---
d_main_48_01:
  d_main_48_01_1:
    speaker: ziz
    en: Um... are you sure it's gonna be okay?
    ko: 그… 괜찮은 거 맞아?
    ja: ほ…本当に大丈夫なの？
  d_main_48_01_2:
    speaker: leviathan
    en: What?
    ko: 뭐가.
    ja: 何が。
  d_main_48_01_3:
    speaker: ziz
    en: Th-the Ark. You know, with the missiles and all.
    ko: |-
      바, 방주.
      미사일이 날아갔으니까아….
    ja: |-
      アーク…
      ミサイルが飛んでったけど…
  d_main_48_01_4:
    speaker: leviathan
    en: That's a good question...
    ko: "…그러게."
    ja: "…さあ。"
  d_main_48_01_5:
    speaker: "<Self>"
    en: "... I'm worried, but we just have to believe in the Ark and its ability to
      defend itself."
    ko: "…걱정되지만, 믿어야지. 방주의 힘을."
    ja: "…気にはなるが、信じよう。アークの力を"
  d_main_48_01_6:
    speaker: "<Self>"
    en: They already managed to fight off the last attack.
    ko: 일전에도 훌륭하게 막아냈으니까.
    ja: すでに1度食い止めたことがあるからな
  d_main_48_01_7:
    speaker: behemoth
    en: Honestly... there's nothing we can do at this point anyway.
    ko: 뭐… 사실 지금 시점에 뭘 할 수도 없는 상태니까 어쩔 수 없겠네.
    ja: ま…今さら何もできねぇし、それしかねぇな。
  d_main_48_01_8:
    speaker: snowwhite_h
    en: "... Yeah."
    ko: "…그래."
    ja: "…そうだな。"
  d_main_48_01_9:
    speaker: anis_i_w
    en: The Ark's full of monstrous freaks. It'll be fine.
    ko: 뭐, 방주에는 괴물 같은 녀석들 천지니 괜찮을 거야.
    ja: |-
      アークにはおかしな人たちがいっぱいいるし、
      どうせ大丈夫よ。
  d_main_48_01_10:
    speaker: neon_v_w
    en: That's right!
    ko: 그럼요 그럼요.
    ja: その通りです。
  d_main_48_01_11:
    speaker: anis_i_w
    en: "... By the way,"
    ko: "…그나저나."
    ja: "…それはそうと…"
  d_main_48_01_12:
    speaker: anis_i_w
    en: does something feel off about this place to anyone else?
    ko: 여기 너무 이상하지 않아?
    ja: 様子がヘンじゃない？
  d_main_48_01_13:
    speaker: anis_i_w
    en: Why's it so quiet?
    ko: 왜 이렇게 조용해?
    ja: ここ、なんでこんなに静かなの？
  d_main_48_01_14:
    speaker: rapi_red
    en: You're right...
    ko: "…맞아."
    ja: "…そうね。"
  d_main_48_01_15:
    speaker: rapi_red
    en: It's too quiet.
    ko: 너무 조용해.
    ja: "…静かすぎる。"
  d_main_48_01_16:
    speaker: bahamut
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_48_01_17:
    speaker: bahamut
    en: My apologies. As one blessed with knowledge, I have been remiss in my duty
      to share it. I shall resume elucidating you all once again.
    ko: |-
      미안하다. 지식을 가진 자로서 게으름을 피웠다.
      계속해서 지식을 전파하도록 하겠다.
    ja: |-
      失礼…賢き者の義務を
      果たしていなかった。
      引き続き知識を伝授してやろう。
  d_main_48_01_18:
    speaker: anis_i_w
    en: "... Anyway. There are Raptures here, but nothing remotely strong."
    ko: 그러게. 랩쳐들이 있긴 하지만 잔챙이들 뿐이야.
    ja: |-
      でしょ。ラプチャーがいるにはいるけど
      ザコばっかりみたいだし…
  d_main_48_01_19:
    speaker: neon_v_w
    en: Yeah, and usually the sound of fighting will attract more to come swarming
      in, but that hasn't happened either.
    ko: 보통은 전투 중에 소란이 일어나면 소리를 듣고 다른 곳에서 몰려오는데 그런 것도 없네요.
    ja: |-
      普通なら戦闘中に騒ぎをかぎつけてきた敵が
      寄って来たりするものですけど、
      それもありませんしね。
  d_main_48_01_20:
    speaker: snowwhite_h
    en: "... Maybe no one's here."
    ko: "…혹시, 빈집인가?"
    ja: "…すると、空き家か？"
  d_main_48_01_21:
    speaker: snowwhite_h
    en: The Queen might have already moved somewhere else.
    ko: 퀸은 이미 다른 곳으로 이동했을지도 모른다.
    ja: |-
      クイーンがどこか別の場所へ
      拠点を変えたのかもしれないな。
  d_main_48_01_22:
    speaker: leviathan
    en: I don't think so.
    ko: 그건 아닌 것 같네.
    ja: それはないでしょ。
  d_main_48_01_23:
    speaker: leviathan
    en: She just fired more missiles, and...
    ko: 미사일도 쐈고, 거기다….
    ja: ミサイル飛ばしたばっかりだし、それに…
  d_main_48_01_24:
    speaker: "<Monologue>"
    en: Leviathan points toward the Lift.
    ko: 레비아탄이 궤도 엘리베이터를 가리킨다.
    ja: レヴィアタンが軌道エレベーターを指さす
  d_main_48_01_25:
    speaker: leviathan
    en: "... take a close look at that."
    ko: 저거, 자세히 봐.
    ja: あれ、よーく見て。
  d_main_48_01_26:
    speaker: "<Monologue>"
    en: I look closely at the Lift.
    ko: 궤도 엘리베이터를 자세히 바라본다.
    ja: 軌道エレベーターに目を凝らした
  d_main_48_01_27:
    speaker: "<Monologue>"
    en: Something about it is off, almost as though...
    ko: "…뭔가 묘하다. 마치…."
    ja: "…確かに奇妙だ。あれは…"
  d_main_48_01_28:
    speaker: "<Self>"
    en: "... It looks like it's glittering."
    ko: "…반짝이고 있는 것 같은데?"
    ja: "…光っているように見えるな"
  d_main_48_01_29:
    speaker: leviathan
    en: That's right.
    ko: 제대로 봤어.
    ja: そう。
  d_main_48_01_30:
    speaker: leviathan
    en: To be precise, it's not the Lift itself that's glittering.
    ko: 정확히는 궤도 엘리베이터가 반짝이는 게 아니라.
    ja: |-
      正確には軌道エレベーターが
      光ってるんじゃなくて…
  d_main_48_01_31:
    speaker: leviathan
    en: The Dark Matter that's stuck to it is moving around, reflecting the light.
    ko: 저거에 달라붙은 다크 매터들이 움직여서 빛이 반사되고 있는 거야.
    ja: |-
      付着して動いてる
      ダークマターに光が反射してる。
  d_main_48_01_32:
    speaker: snowwhite_h
    en: "... Dark Matter?"
    ko: "…다크 매터가?"
    ja: "…ダークマターが？"
  d_main_48_01_33:
    speaker: leviathan
    en: Yeah. Dark Matter has attached itself to the Lift.
    ko: 응. 다크 매터가 궤도 엘리베이터에 달라붙었어.
    ja: |-
      そう。まずダークマターが
      軌道エレベーターに付着してる。
  d_main_48_01_34:
    speaker: leviathan
    en: Remember those pools of Dark Matter we saw on the ground?
    ko: 그리고 바닥에 고여있던 다크 매터들 있지?
    ja: |-
      それと別に、
      ダークマターの水たまりも
      地面に散らばってたでしょ？
  d_main_48_01_35:
    speaker: leviathan
    en: They were heading toward the Lift.
    ko: 방향성이 있어. 궤도 엘리베이터로 가고 있다고.
    ja: |-
      そっちもみんな、
      軌道エレベーターに向かってる。
  d_main_48_01_36:
    speaker: leviathan
    en: The Queen's gathering all the Dark Matter to the Lift.
    ko: 모으고 있어. 다크 매터를. 궤도 엘리베이터로.
    ja: |-
      集合させてるってこと。
      ダークマターを、あそこに。
  d_main_48_01_37:
    speaker: leviathan
    en: "... I bet a structure that size could hold all the Dark Matter she took from
      our place."
    ko: "…저 정도 크기의 건축물이니, 우리집에서 가져온 것도 다 담을 수 있겠네."
    ja: |-
      …ウチにあった分全部、
      入りそうなくらい大きい建物だけど…
  d_main_48_01_38:
    speaker: behemoth
    en: What do you think she's trying to do...?
    ko: "…뭘 하려는 걸까?"
    ja: "…なに企んでるんだろうな？"
  d_main_48_01_39:
    speaker: leviathan
    en: "... Dark Matter can be used to do something akin to creation."
    ko: "…다크 매터는 창조에 가까운 뭔가를 할 수 있어."
    ja: |-
      …ダークマターは
      ほとんど何でも生み出せるからね。
  d_main_48_01_40:
    speaker: leviathan
    en: The obvious guess would be she's making Heretics.
    ko: 쉽게 생각할 수 있는 건, 헬레틱을 만드는 거겠지.
    ja: |-
      できる予想としては…
      ヘレティックを作ってる、ぐらいかな。
  d_main_48_01_41:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_01_42:
    speaker: "<Monologue>"
    en: Snow White steadies herself,
    ko: 스노우 화이트가 자세를 잡는다.
    ja: スノーホワイトが構えをとった
  d_main_48_01_43:
    speaker: "<Monologue>"
    en: and takes aim with Seven Dwarves.
    ko: 세븐스 드워프를 겨눈다.
    ja: セブンスドワーフの射撃姿勢だ
  d_main_48_01_44:
    speaker: anis_i_w
    en: "... What are you doing?"
    ko: "…뭐 하는 거야."
    ja: "…何してるの？"
  d_main_48_01_45:
    speaker: snowwhite_h
    en: I'm going to shoot the Lift.
    ko: 궤도 엘리베이터를 쏠거다.
    ja: 軌道エレベーターを撃つ。
  d_main_48_01_46:
    speaker: anis_i_w
    en: You can't be serious...
    ko: 너 말이야….
    ja: あのねえ…
  d_main_48_01_47:
    speaker: snowwhite_h
    en: We have no way of knowing what they're planning right now.
    ko: 놈들이 무슨 꿍꿍이인지 지금 우리로서는 알 방법이 없다.
    ja: 奴らが何をしているかは知りようがない。
  d_main_48_01_48:
    speaker: snowwhite_h
    en: If we get any closer to investigate and fall into an ambush, we might not
      be able to retreat.
    ko: 더 접근해서 확인하다가, 매복에 당하기라도 하면 퇴로가 끊겨.
    ja: |-
      確かめようと接近して、
      待ち伏せでもされれば退路が断たれる。
  d_main_48_01_49:
    speaker: snowwhite_h
    en: I want to see what happens if I shoot it from here, since we can still secure
      an escape route.
    ko: |-
      퇴로를 확보할 수 있는 지금 시점에서,
      건드려 보는 거다.
    ja: |-
      退路を確保できる今この場所から、
      仕掛けてみるべきだ。
  d_main_48_01_50:
    speaker: snowwhite_h
    en: I'm sure we'll get a reaction of some kind.
    ko: 무슨 반응이라도 있겠지.
    ja: どういう反応をするかは見られるだろう。
  d_main_48_01_51:
    speaker: rapi_red
    en: That makes sense.
    ko: 그럴듯해.
    ja: 筋は通っているわね。
  d_main_48_01_52:
    speaker: rapi_red
    en: I thought you just wanted to shoot it because you're getting impatient.
    ko: 난 또, 답답해서 냅다 쏘자고 하는 줄 알았어.
    ja: |-
      ガマンに疲れて
      暴れたくなっただけかと思ったわ。
  d_main_48_01_53:
    speaker: snowwhite_h
    en: That's part of it too. Maybe seventy percent.
    ko: 그 이유도 있다. 70% 정도.
    ja: それもあるな。7割ほどは。
  d_main_48_01_54:
    speaker: anis_i_w
    en: In other words, you just made up all that other stuff as an excuse.
    ko: 그럼 그냥 이유를 갖다 붙인 거잖아….
    ja: 理由は後付けで考えたってことじゃないの。
  d_main_48_01_55:
    speaker: "<Self>"
    en: "... It's worth a shot. Fire away."
    ko: "…좋아. 쏴보자."
    ja: "…そうだな、試してみるか"
  d_main_48_01_56:
    speaker: snowwhite_h
    en: I knew you'd understand.
    ko: 역시 너라면 알아줄 줄 알았다.
    ja: お前なら分かってくれると思っていた。
  d_main_48_01_57:
    speaker: "<Self>"
    en: Everyone, stay on alert. We don't know what's going to happen next.
    ko: 전원. 이후에 무슨 일이 일어날지 모르니 긴장해줘.
    ja: |-
      全員、敵の出方は分からない。
      気を引き締めてくれ
  d_main_48_01_58:
    speaker: snowwhite_h
    en: Here I go.
    ko: 그럼 간다.
    ja: では、撃つぞ。
  d_main_48_01_59:
    speaker: snowwhite_h
    en: Seven Dwarves Fully Active!
    ko: 세븐스 드워프 풀 액티브…!
    ja: セブンスドワーフ・フルアクティブ…！
  d_main_48_01_60:
    speaker: snowwhite_h
    en: Pierce through!
    ko: 꿰뚫어라--!!
    ja: 貫け――！！
  d_main_48_01_61:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!!
    ja: ドカン！！
  d_main_48_01_62:
    speaker: "<Monologue>"
    en: A blinding flash erupts from Snow White's rifle.
    ko: 스노우 화이트의 대함 라이플에서 섬광이 번쩍인다.
    ja: |-
      スノーホワイトの対艦ライフルが
      光を放った
  d_main_48_01_63:
    speaker: "<Monologue>"
    en: The surge of white light rushes forward with tremendous force,
    ko: 맹렬한 기세로 나아간 백색의 빛줄기는
    ja: 目にも留まらぬ速さで伸びた白色の光線は…
  d_main_48_01_64:
    speaker: "<Monologue>"
    en: and tears a gaping hole right through the center of the Lift.
    ko: 궤도 엘리베이터의 중심에 거대한 구멍을 만들었다.
    ja: 軌道エレベーターの中心に巨大な穴を開けた
  d_main_48_01_65:
    speaker: behemoth
    en: That's just crazy...
    ko: "…바보 같은 출력이네."
    ja: "…バカみてーな威力だな。"
  d_main_48_01_66:
    speaker: snowwhite_h
    en: What'd you say? You really want to pick a fight with me in enemy territory?
    ko: 뭐라고? 적진에서 시비를 걸다니 무슨 생각이냐.
    ja: 何？こんな場所でケンカを売る気か。
  d_main_48_01_67:
    speaker: behemoth
    en: It's a compliment, you idiot.
    ko: 칭찬하는 거잖아 인마.
    ja: 褒めたんだよ、バーカ。
  d_main_48_01_68:
    speaker: "<Narration>"
    en: "*Blurb, blurb, blurb*"
    ko: 부글부글부글.
    ja: ボコ、ボコ、ボコ――
  d_main_48_01_69:
    speaker: "<Narration>"
    en: The Dark Matter clinging to the Lift quickly begins to move.
    ko: 궤도 엘리베이터에 붙어있던 다크 매터들이 분주하게 움직인다.
    ja: |-
      軌道エレベーターに付着しているダークマターが
      激しく動き出した
  d_main_48_01_70:
    speaker: "<Narration>"
    en: It quickly seals the hole.
    ko: 그리고 곧, 구멍을 메운다.
    ja: 開いた穴は見る間に埋められてしまった
  d_main_48_01_71:
    speaker: snowwhite_h
    en: Tch... That's annoying.
    ko: "…기분 나쁘군."
    ja: "…面白くはないな。"
  d_main_48_01_72:
    speaker: leviathan
    en: "... This might be bad. It's almost fused together."
    ko: "…안 좋은데. 거의 일체화 됐잖아."
    ja: "…まずいかも。ほぼ一体化してる…"
  d_main_48_01_73:
    speaker: "<Narration>"
    en: "*Bam!*"
    ko: 꽈앙--!!
    ja: ドカン！！
  d_main_48_01_74:
    speaker: "<Monologue>"
    en: With a deafening sound, a section of the Lift bursts open,
    ko: 굉음과 함께 궤도 엘리베이터의 일부가 터지듯 열렸고
    ja: |-
      轟音とともに
      軌道エレベーターの一部が弾けるように開いた
  d_main_48_01_75:
    speaker: "<Monologue>"
    en: and a staggering number of Raptures comes pouring out.
    ko: 수많은 랩쳐들이 쏟아져나왔다.
    ja: そこから無数のラプチャーが飛び出した
  d_main_48_01_76:
    speaker: "<Monologue>"
    en: "... The swarm is so thick, it's like a veritable tidal wave of Raptures."
    ko: "…마치 랩쳐의 파도다. 밀도가 너무 높다."
    ja: |-
      …すき間もないほど密集したラプチャーが
      波のように流れ出してくる
  d_main_48_01_77:
    speaker: "<Self>"
    en: Prepare for battle!
    ko: "!! 전투 준비!"
    ja: "！！戦闘準備！"
  d_main_48_01_78:
    speaker: anis_i_w
    en: So that's where they were all hiding!
    ko: 다 어디갔었나 했더니 거기 짱박혀 있었냐!
    ja: |-
      どこにいったのかと思ったら、
      あんなところに詰めこまれてたってことね！
  d_main_48_01_79:
    speaker: neon_v_w
    en: Here we go! It's time to unleash maximum firepower!
    ko: 가요! 화력 전개 시간이에요!
    ja: |-
      行きましょう！
      火力を展開する時です！
  d_main_48_01_80:
    speaker: rapi_red
    en: Let's go!
    ko: 가자!
    ja: 行こう！
  d_main_48_01_81:
    speaker: leviathan
    en: We'll join.
    ko: 우리도 가자.
    ja: 私たちも。
  d_main_48_01_82:
    speaker: behemoth
    en: All right! Let's wipe them out!
    ko: 좋아! 깔끔하게 쓸어버리자고!
    ja: よっしゃ！きれいさっぱり大掃除といこうぜ！
  d_main_48_01_83:
    speaker: ziz
    en: Y-yeah!
    ko: 으, 응!
    ja: う、うん！
  d_main_48_01_84:
    speaker: bahamut
    en: I shall demonstrate that I, the ever-so-wise Bahamut, possess more than intellect!
    ko: 똑똑한 바하무트가 머리만 좋은 게 아니라는 걸 보여주마.
    ja: |-
      賢いバハムートが頭だけではないということを
      見せつけてやろう。
  d_main_48_01_85:
    speaker: snowwhite_h
    en: Engaging!
    ko: 인카운터!
    ja: エンカウンター！
d_main_48_02:
  d_main_48_02_1:
    speaker: anis_i_w
    en: What's going on?! They just keep coming!
    ko: 와 뭐지? 끝도 없이 쏟아져 나오는데?
    ja: |-
      何これ？倒しても倒しても
      キリがないじゃない！
  d_main_48_02_2:
    speaker: snowwhite_h
    en: Then we just need to keep wiping them out!
    ko: 다 쓸어버리면 그만이다!
    ja: 片っ端から倒すだけだ！
  d_main_48_02_3:
    speaker: behemoth
    en: Time to transform!
    ko: 거대화 할 시간이네!
    ja: 巨大化、かましてやるか！
  d_main_48_02_4:
    speaker: rapi_red
    en: No! We don't know when a Heretic will appear! Conserve your strength!
    ko: 아니! 헬레틱이 언제 나올지 몰라! 전력을 아껴!
    ja: |-
      まだよ！
      ヘレティックがいつ出てくるか分からないわ！
      戦力は温存して！
  d_main_48_02_5:
    speaker: leviathan
    en: But we can't keep fighting these things like this!
    ko: 그렇다고 이것들을 계속 이렇게 상대하고 있을 순 없다고!
    ja: |-
      だからって、いつまでも
      ザコの相手してるわけにはいかないでしょ！
  d_main_48_02_6:
    speaker: bahamut
    en: I, the sagacious Bahamut, shall inform you. The Raptures are currently—
    ko: |-
      똑똑한 바하무트가 알려주겠다.
      지금 랩쳐들의….
    ja: |-
      賢いバハムートが教えてやろう。
      今、ラプチャーたちは…
  d_main_48_02_7:
    speaker: leviathan
    en: If you're going to say something stupid again, save it! We're too busy fighting
      to deal with your rambling!
    ko: |-
      너 또 헛소리할 거면 하지 마!
      싸우기에도 바빠 죽겠는데 정말!
    ja: |-
      バカなこと言う気なら黙ってて！
      ただでさえ戦うので忙しいんだから！
  d_main_48_02_8:
    speaker: bahamut
    en: "... Some of them are heading toward the Ark."
    ko: 일부는 방주 방향으로 향하고 있다.
    ja: 一部がアークの方へ向かっている。
  d_main_48_02_9:
    speaker: "<Self>"
    en: "... What?"
    ko: "…뭐?"
    ja: "…何？"
  d_main_48_02_10:
    speaker: rapi_red
    en: Ziz!
    ko: 지즈!
    ja: ジズ！
  d_main_48_02_11:
    speaker: ziz
    en: I-I'm on it!
    ko: 아, 알겠어!
    ja: わ、分かった！
  d_main_48_02_12:
    speaker: "<Monologue>"
    en: Ziz soars up into the air.
    ko: 지즈가 공중으로 솟아오른다.
    ja: ジズが空へと飛び上がった
  d_main_48_02_13:
    speaker: "<Monologue>"
    en: She looks around, then turns pale.
    ko: 시선을 돌린다. 그리고 사색이 된다.
    ja: 何かを確かめ、表情が凍り付く
  d_main_48_02_14:
    speaker: ziz
    en: Sh-she's right! About half of them are heading toward the Ark!
    ko: 저, 정말이야…! 반 정도는 방주 방향으로 가고 있어!
    ja: |-
      ほ、ほんとだ…！
      半分くらいがアークの方に向かってる！
  d_main_48_02_15:
    speaker: behemoth
    en: Young Man! Will the Ark be okay?
    ko: 남자! 방주는 괜찮겠어?
    ja: おい！アークは大丈夫なんだろうな？
  d_main_48_02_16:
    speaker: "<Self>"
    en: They have an airship, a giant robot, and a few heroes! They'll be...
    ko: 공중 전함, 거대 로봇, 히어로가 있으니까 아마 괜찮을…!
    ja: |-
      空飛ぶ戦艦に巨大ロボット、
      それにヒーローたちが何とかしてくれる…！
  d_main_48_02_17:
    speaker: "<Narration>"
    en: "*Bam! Bam! Bam!*"
    ko: 콰앙-! 콰앙-! 콰앙-!
    ja: バシュン！バシュン！バシュン！
  d_main_48_02_18:
    speaker: "<Monologue>"
    en: Three flashes of light erupt from the Lift,
    ko: 궤도 엘리베이터에서 섬광이 세 번 번쩍인다.
    ja: 軌道エレベーターが3回光った
  d_main_48_02_19:
    speaker: "<Monologue>"
    en: and three Annihilios rise up.
    ko: "…애니힐리오 셋이, 솟아오른다."
    ja: |-
      …そう思った瞬間、
      アニヒリオが3体飛び出していた
  d_main_48_02_20:
    speaker: "<Self>"
    en: "... Oh, come on."
    ko: "…뭐야."
    ja: "…あれは…"
  d_main_48_02_21:
    speaker: ziz
    en: The missiles have changed course!
    ko: 미, 미사일이 방향을 틀었어!
    ja: ミ、ミサイルの軌道は…！
  d_main_48_02_22:
    speaker: ziz
    en: They're heading for the Ark!
    ko: 방주 방향이야!
    ja: アークの方角！
  d_main_48_02_23:
    speaker: "<Self>"
    en: Argh...!
    ko: "…!! 이런…!!"
    ja: "…！！やはり…！！"
  d_main_48_02_24:
    speaker: anis_i_w
    en: Commander! We need to go!
    ko: 지휘관님! 방주로!
    ja: 指揮官様！アークが！
  d_main_48_02_25:
    speaker: neon_v_w
    en: Ziz! Give us a ride!
    ko: 지즈! 우리 좀 태워줘요!
    ja: ジズ！乗せてください！
  d_main_48_02_26:
    speaker: leviathan
    en: You won't get there in time!
    ko: 지금 당장 방주까지 가는 건 무리야!
    ja: 今から行ったって間に合わないでしょ！
  d_main_48_02_27:
    speaker: rapi_red
    en: We know! But we can at least cut them off in the middle!
    ko: 알아! 그래도 허리는 끊을 수 있어!
    ja: 分かってる！でも完全に終わる前には着くわ！
  d_main_48_02_28:
    speaker: ziz
    en: T-take hold, everyone!
    ko: 다, 다들 잡아!
    ja: み、みんな捕まって！
  d_main_48_02_29:
    speaker: "<Monologue>"
    en: Ziz flies up into the air.
    ko: 지즈가 날아오른다.
    ja: ジズが飛び上がった
  d_main_48_02_30:
    speaker: "<Monologue>"
    en: She spreads her wings and deploys a black veil downward.
    ko: 날개를 펼치고, 아래를 향해 검은 장막을 전개한다.
    ja: 翼が広がり、地面に向かって黒い膜が展開される
  d_main_48_02_31:
    speaker: "<Monologue>"
    en: Just as the Counters are about to grab on...
    ko: 카운터스가 그것을 잡으려는 순간
    ja: |-
      カウンターズの仲間たちの手が
      それをつかもうとした時…
  d_main_48_02_32:
    speaker: egovista
    en: Where goest thou in such haste?
    ko: 어딜 그리 급히 가시나.
    ja: そんなに急いで、どこへ行く？
  d_main_48_02_33:
    speaker: "<Narration>"
    en: "*Swoosh!*"
    ko: 스칵-!!
    ja: ザンッ――！！
  d_main_48_02_34:
    speaker: ziz
    en: Wh-what the...?!
    ko: 어, 어라?
    ja: え、あれ…？
  d_main_48_02_35:
    speaker: "<Monologue>"
    en: The black wings are sliced in two, and Ziz plummets to the ground.
    ko: "…검은 날개가 두동강나며, 지즈가 추락한다."
    ja: "…黒い翼を真っ二つに切られ、ジズが墜落した"
  d_main_48_02_36:
    speaker: egovista
    en: Since thou hast journeyed thus far, prithee leave thy head as a gift before
      parting.
    ko: |-
      이왕 여기까지 걸음 했으니,
      목이라도 내놓고 가게.
    ja: |-
      わざわざここまで出向いて来たのだ。
      首のひとつでも手みやげに置いていけ。
  d_main_48_02_37:
    speaker: snowwhite_h
    en: Egovista!
    ko: 에고비스타-!!
    ja: エゴビスタ！！
  d_main_48_02_38:
    speaker: anis_i_w
    en: Oh, so you're the shoddy knockoff of Scarlet and Isabel!
    ko: 이 녀석이 그 홍련이랑 이사벨 짝퉁이구만!
    ja: こいつが例の紅蓮とイサベルのニセモノね！
  d_main_48_02_39:
    speaker: egovista
    en: "... What's that?"
    ko: "…뭣이?"
    ja: "…なに？"
  d_main_48_02_40:
    speaker: rapi_red
    en: If you're so confident in close-quarters combat, I'll be your opponent!
    ko: 접근전에 그렇게 자신이 있다면, 상대해주지!
    ja: |-
      白兵戦に自信があるというなら、
      相手をしてあげるわ！
  d_main_48_02_41:
    speaker: egovista
    en: Are ye the greatest combatants amongst this rabble?
    ko: 그대들이 이 무리에서 가장 몸을 잘 쓰는 이들인가?
    ja: お前たちが使える方の奴らか？
  d_main_48_02_42:
    speaker: egovista
    en: Excellent. My spirits had grown dull for want of a worthy adversary.
    ko: 좋네. 소인, 적절한 상대가 없어 쓸쓸하던 참이었으니.
    ja: |-
      よかろう。ちょうどよい相手がおらず
      退屈しておったところだ。
  d_main_48_02_43:
    speaker: behemoth
    en: Let's go, Rapi! I'll take the left!
    ko: 가자 라피! 왼쪽을 맡아!
    ja: 行くぞ、ラピ！左は任せた！
  d_main_48_02_44:
    speaker: rapi_red
    en: No, you take the right!
    ko: 너는 오른쪽으로 가!
    ja: あなたは右へ！
  d_main_48_02_45:
    speaker: neon_v_w
    en: And as they draw your attention...!
    ko: 라고 하는 척 하면서!
    ja: "…と見せかけて！"
  d_main_48_02_46:
    speaker: "<Narration>"
    en: "*Bang! Bang! Bang!*"
    ko: 쾅-! 쾅-! 쾅-! 쾅-!
    ja: ズドドドッ――！
  d_main_48_02_47:
    speaker: "<Monologue>"
    en: Rapi and Behemoth split off to either side as they charge towards Egovista.
    ko: 에고비스타를 향해 양쪽으로 갈라지며 돌진하는 라피와 베히모스.
    ja: |-
      エゴビスタ目がけて
      ラピとベヒモスが左右から挟撃を仕掛ける
  d_main_48_02_48:
    speaker: "<Monologue>"
    en: Egovista's front is left wide open, and Neon, standing right in front of her,
      unleashes a barrage of rocket fire.
    ko: 에고비스타의 정면이 비었고, 그 앞에 서 있던 네온이 탄환을 갈겨댄다.
    ja: |-
      あえて空けられた正面から、
      その隙を狙ったネオンが掃射を放った
  d_main_48_02_49:
    speaker: egovista
    en: Mark me well. Naught exists but what my blade can cleave.
    ko: 알아두게나. 소인이 벨 수 없는 것은 없네.
    ja: |-
      覚えておくがいい。
      天下に拙者が斬れぬものはない。
  d_main_48_02_50:
    speaker: "<Monologue>"
    en: Egovista raises her sword.
    ko: 에고비스타가 검을 들어올린다.
    ja: エゴビスタが剣を振り上げた
  d_main_48_02_51:
    speaker: "<Monologue>"
    en: Just as she is about to swing at the incoming barrage,
    ko: 돌진하는 탄환을 향해 휘두르려는 순간.
    ja: |-
      飛んでくる銃弾に向かって
      刃が振り下ろされようとした、その時…
  d_main_48_02_52:
    speaker: "<Monologue>"
    en: a familiar silhouette steps in to block her.
    ko: 익숙한 실루엣이 에고비스타의 앞을 막아선다.
    ja: |-
      見覚えのあるシルエットが
      エゴビスタの前に立った
  d_main_48_02_53:
    speaker: altruia
    en: Do not waste your strength.
    ko: 괜한 곳에 힘을 낭비하지 마시옵소서.
    ja: |-
      無駄なところで
      力をお使いにならないでください。
  d_main_48_02_54:
    speaker: "<Monologue>"
    en: Altruia deploys a shield, blocking Neon's attack.
    ko: 앨트루이아가 실드를 전개, 네온의 공격을 막아낸다.
    ja: |-
      アルトルイアの展開したシールドが、
      ネオンの攻撃を弾いた
  d_main_48_02_55:
    speaker: altruia
    en: "... Those shots were quite heavy."
    ko: "…탄환이 무겁사옵니다."
    ja: "…なんと重い射撃でしょう。"
  d_main_48_02_56:
    speaker: egovista
    en: Their appearance alone doth suggest as much.
    ko: 딱 보기에도 무거워 보이잖나.
    ja: 見れば分かるであろうに。
  d_main_48_02_57:
    speaker: altruia
    en: I did not mean heavy in that sense.
    ko: 그런 의미의 무거움이 아니옵니다.
    ja: 重量の話ではございませんよ。
  d_main_48_02_58:
    speaker: anis_i_w
    en: Hey, get out of the way.
    ko: 야, 이거 치워.
    ja: それ、しまいなさいよ。
  d_main_48_02_59:
    speaker: "<Monologue>"
    en: Anis bursts out from the explosion caused by Neon's attack.
    ko: 네온의 공격으로 인해 발생한 폭연 안에서 아니스가 튀어나간다.
    ja: |-
      ネオンの射撃が生んだ爆煙の中から
      アニスが飛び出した
  d_main_48_02_60:
    speaker: "<Monologue>"
    en: She reaches out and absorbs the energy shield Altruia had deployed.
    ko: 손을 뻗어, 앨트루이아가 전개한 에너지 실드를 흡수한다.
    ja: |-
      伸ばした手が、アルトルイアの展開した
      エネルギーの盾を吸収していく
  d_main_48_02_61:
    speaker: altruia
    en: I remember you. You were quite the nuisance.
    ko: |-
      당신을 기억합니다.
      아주 성가셨던 것으로 기억하고 있사옵니다.
    ja: |-
      あなたのことは覚えておりますよ。
      とても面倒くさい方でございました。
  d_main_48_02_62:
    speaker: anis_i_w
    en: Rude!
    ko: 성가신 여자라고 하지마!
    ja: その言い方はやめてくれる！？
  d_main_48_02_63:
    speaker: "<Monologue>"
    en: Anis's hand begins to glow.
    ko: 아니스의 손이 빛난다.
    ja: アニスの手が光を放った
  d_main_48_02_64:
    speaker: "<Monologue>"
    en: At the same time, Rapi and Behemoth close in rapidly from both flanks.
    ko: 그리고 그와 동시에, 라피와 베히모스가 양 옆에서 빠르게 접근한다.
    ja: |-
      畳みかけるように、
      ラピとベヒモスが側面から素早く接近した
  d_main_48_02_65:
    speaker: egovista
    en: Oh, an assault from three directions?
    ko: 오. 세 방향에서의 동시 공격인가?
    ja: ほう、三方同時か？
  d_main_48_02_66:
    speaker: altruia
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_48_02_67:
    speaker: anis_i_w
    en: Entertainment Punch!
    ko: 엔터테인먼트 펀치!
    ja: エンターテイメントパンチ！
  d_main_48_02_68:
    speaker: rapi_red
    en: Seven Dwarves Zero! Fully active!
    ko: 세븐스 드워프 제로! 풀 액티브!
    ja: セブンスドワーフゼロ！フルアクティブ！
  d_main_48_02_69:
    speaker: behemoth
    en: Uh... Be... Behemoth Claw!
    ko: 음… 베히… 베히모스 크로!
    ja: あー…ベ…ベヒモスクロー！
  d_main_48_02_70:
    speaker: leviathan
    en: Oof, that was terrible.
    ko: 으에, 구려.
    ja: ええ、ダッサ…
  d_main_48_02_71:
    speaker: egovista
    en: Come to me...
    ko: 오게나.
    ja: 来い。
  d_main_48_02_72:
    speaker: egovista
    en: Sea Nettle.
    ko: 해월(海月).
    ja: 海月。
  d_main_48_02_73:
    speaker: "<Monologue>"
    en: Rapi, Anis, and Behemoth are sent flying back.
    ko: "…라피와 아니스, 베히모스가 나동그라진다."
    ja: "…ラピとアニス、ベヒモスが突然吹き飛んだ"
  d_main_48_02_74:
    speaker: "<Monologue>"
    en: They tumble to the ground, struck by something fired from far off.
    ko: 멀리서 쏘아진 뭔가에 피격당해, 바닥을 구른다.
    ja: |-
      遠距離から飛来した何かに撃たれたらしく、
      そのまま地面を転がり倒れる
  d_main_48_02_75:
    speaker: "<Monologue>"
    en: I look down to see the remains of what had been fired at a speed too fast
      for the eye to perceive.
    ko: 눈으로 인지하지 못 할 정도의 속도로 쏘아진 그것의 잔재가 내 발 밑에 있다.
    ja: |-
      目には見えないほどの速さで放たれた
      攻撃の余波が、足元に散った
  d_main_48_02_76:
    speaker: "<Self>"
    en: "... Water."
    ko: "…물."
    ja: "…水だ"
  d_main_48_02_77:
    speaker: "<Monologue>"
    en: It's just water. There doesn't seem to be anything special about it.
    ko: 물이다. 아무런 특징도 없는, 그저 물.
    ja: |-
      水の痕跡。
      特に何も変わったことのない、ただの水
  d_main_48_02_78:
    speaker: "<Monologue>"
    en: The surroundings grow dark.
    ko: 주위가 어두워진다.
    ja: あたりに影が差した
  d_main_48_02_79:
    speaker: "<Monologue>"
    en: I raise my head and look up at the sky.
    ko: 나는 고개를 들어 하늘을 바라본다.
    ja: 頭を上げ、空を仰ぐと…
  d_main_48_02_80:
    speaker: "<Monologue>"
    en: A massive figure is floating there, looking down at us.
    ko: "…거대한 신체가, 우릴 내려다보듯 떠 있다."
    ja: |-
      …何かの巨体が、
      こちらを見下ろすように浮かんでいる
  d_main_48_02_81:
    speaker: "<Monologue>"
    en: Something about it feels familiar.
    ko: 어딘가 익숙한 모습.
    ja: どこか見覚えのある光景という気がした
  d_main_48_02_82:
    speaker: "<Monologue>"
    en: There is a terrifying silence.
    ko: 그리고 끔찍한 침묵.
    ja: 寒気がするほど静かだ
  d_main_48_02_83:
    speaker: "<Monologue>"
    en: The colossal figure blotting out the sky is utterly quiet, to an unsettling
      degree.
    ko: |-
      하늘을 가릴 정도로 거대한 그것에게서는,
      이질적일 정도로 아무 소리도 들려오지 않았다.
    ja: |-
      空を覆うほどの存在感がありながら、
      奇妙なほど何の音も聞こえない
  d_main_48_02_84:
    speaker: "<Self>"
    en: "... As far as declarations of war go, I think we've made our point."
    ko: "…선전포고는 이 정도면 됐어."
    ja: "…宣戦布告はこれくらいで十分だろう"
  d_main_48_02_85:
    speaker: "<Self>"
    en: Let's retreat.
    ko: 퇴각 하자.
    ja: 撤退だ
  d_main_48_02_86:
    speaker: snowwhite_h
    en: What are you talking about? This is just the beginning. We haven't even properly
      introduced ourselves yet.
    ko: |-
      무슨 소리냐. 이제 시작이다.
      아직 제대로 된 인사도 하지 못했다.
    ja: |-
      何を言っている。ここからだろう。
      これではあいさつにもならない。
  d_main_48_02_87:
    speaker: behemoth
    en: Hmm. I think it would be wise to listen to him.
    ko: "…남자 말을 듣는 게 좋을 것 같은데."
    ja: "…言う通りにした方がいいと思うぞ。"
  d_main_48_02_88:
    speaker: ziz
    en: Y-yeah. Based on this feeling... it's definitely her.
    ko: 으, 응. 이 느낌… 확실해.
    ja: う、うん。この感じ…間違いないよ。
  d_main_48_02_89:
    speaker: leviathan
    en: "... So that's why they only took her body."
    ko: "…몸만 가져간 이유가 이거였네."
    ja: |-
      …頭以外持っていかれたって、
      こういう意味だったんだ。
  d_main_48_02_90:
    speaker: bahamut
    en: Huh...?
    ko: "??"
    ja: "？？"
  d_main_48_02_91:
    speaker: anis_i_w
    en: What's gotten into you all?
    ko: 왜, 왜들 그러는 거야.
    ja: ど、どうしたのよ急に。
  d_main_48_02_92:
    speaker: neon_v_w
    en: "... If the Heretics are reacting like that, it probably means..."
    ko: "…헬레틱 분들이 반응한다는 건 설마…."
    ja: |-
      …ヘレティック同士だけが分かること…
      まさか…
  d_main_48_02_93:
    speaker: rapi_red
    en: "... Commander, give the order."
    ko: "…지휘관. 다시 한 번 명령을."
    ja: "…指揮官。正式にご命令を。"
  d_main_48_02_94:
    speaker: "<Self>"
    en: Everyone! Retreat!
    ko: 전원! 퇴각!
    ja: 総員ただちに退却する！！
  d_main_48_02_95:
    speaker: "<Self>"
    en: It's Liberalio! She's transformed!
    ko: 거대화 한 리버렐리오다!
    ja: あれは巨大化したリバーレリオだ！
  d_main_48_02_96:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 쿠우우우우--!!
    ja: ゴオオオッ…！！
  d_main_48_02_97:
    speaker: "<Monologue>"
    en: I feel the ground start to rumble in a way that's all too familiar.
    ko: "…진동이 느껴진다. 익숙하다면, 익숙한 진동이다."
    ja: |-
      …地響きがした。
      これを感じるのも初めてではない
  d_main_48_02_98:
    speaker: "<Monologue>"
    en: I turn my head and look to the source.
    ko: 고개를 돌려 저편을 본다.
    ja: 振り返り、様子をうかがうと…
  d_main_48_02_99:
    speaker: "<Monologue>"
    en: Sweeping away every single building in its path,
    ko: 빼곡한 건물들을 모조리 쓸어버리며.
    ja: 並び立つ建造物を飲みこみながら
  d_main_48_02_100:
    speaker: "<Monologue>"
    en: An unfathomably large wave is approaching.
    ko: 아득한 높이의 파도가 다가오고 있었다.
    ja: とてつもない大波が迫りつつあった
d_main_48_03:
  d_main_48_03_1:
    speaker: "<Narration>"
    en: At Eden's Repair Center...
    ko: 에덴의 리페어 센터.
    ja: エデン、リペアセンター
  d_main_48_03_2:
    speaker: "<Narration>"
    en: Cecil and Papillon silently survey the interior of the repair center.
    ko: 세실과 파피용은 리페어 센터의 내부를 말없이 둘러본다.
    ja: |-
      セシルとパピヨンが言葉もなく
      リペアセンターを見回していた
  d_main_48_03_3:
    speaker: "<Narration>"
    en: There are two giant machines that create Nikkes,
    ko: 니케를 만들어내는 두개의 거대한 기계.
    ja: 2台の巨大なニケ製造装置
  d_main_48_03_4:
    speaker: "<Narration>"
    en: three brain shelters,
    ko: 셋의 브레인 셸터.
    ja: 3つのブレインシェルター
  d_main_48_03_5:
    speaker: "<Narration>"
    en: and Rose, lying there completely motionless.
    ko: 미동도 하지 않은 채 누워있는 장화.
    ja: 身動き一つせず、横たわっている薔花
  d_main_48_03_6:
    speaker: "<Narration>"
    en: After looking around the quiet repair center for a long while, Papillon finally
      speaks.
    ko: 적막한 리페어 센터를 한참 둘러보던 파피용이 입을 연다.
    ja: |-
      リペアセンターは静まり返っている。
      しばらくするとパピヨンが口を開いた
  d_main_48_03_7:
    speaker: papillon
    en: This place is practically a morgue.
    ko: 영안실이 따로 없네.
    ja: 霊安室みたいね。
  d_main_48_03_8:
    speaker: cecil
    en: A real morgue wouldn't be much different from this.
    ko: 크게 다르지 않겠죠.
    ja: 似たようなものです。
  d_main_48_03_9:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_10:
    speaker: "<Narration>"
    en: Cecil stares at the brain shelters resting in front of her.
    ko: 세실은 눈앞에 놓인 셋의 브레인 셸터를 바라본다.
    ja: |-
      セシルは目の前に並ぶ
      3つのブレインシェルターを眺めた
  d_main_48_03_11:
    speaker: "<Narration>"
    en: She picks one of them up.
    ko: 그 중 하나를 들어올린다.
    ja: そのうちの1つに手が伸びた
  d_main_48_03_12:
    speaker: "<Narration>"
    en: Rapunzel's tag is attached to it.
    ko: 라푼젤의 태그가 붙어있는 브레인 셸터다.
    ja: ラプンツェルのタグが貼られている
  d_main_48_03_13:
    speaker: "<Narration>"
    en: She hands it over to Papillon.
    ko: 세실은 그것을 파피용에게 넘겨준다.
    ja: 持ち上げられたものがパピヨンに渡された
  d_main_48_03_14:
    speaker: cecil
    en: Put this in the body maker.
    ko: 바디 메이커에 넣어줘요.
    ja: 装置にセットしてください。
  d_main_48_03_15:
    speaker: papillon
    en: Okay. Time to revive her.
    ko: 오케이. 이제 부활이네.
    ja: 了解、これでやっと元通りね。
  d_main_48_03_16:
    speaker: cecil
    en: Rapunzel, at least.
    ko: 예. 라푼젤은요.
    ja: ひとまず、ラプンツェルは。
  d_main_48_03_17:
    speaker: papillon
    en: "... Is Scarlet beyond saving?"
    ko: "…홍련은, 영 가망이 없어?"
    ja: "…紅蓮は、やっぱり見込みがないってこと？"
  d_main_48_03_18:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_19:
    speaker: cecil
    en: It's not going to be easy.
    ko: 쉽지 않네요.
    ja: 簡単ではありません。
  d_main_48_03_20:
    speaker: cecil
    en: If I'd known it would come to this, I would have secured the body data for
      the previous Scarlet.
    ko: 이럴 줄 알았으면, 이전 홍련의 바디 데이터라도 확보해 놓을 걸 그랬어요.
    ja: |-
      こうなると分かっていれば、
      紅蓮のボディデータも取っておいたのですが。
  d_main_48_03_21:
    speaker: papillon
    en: She wouldn't have let you. I heard you two didn't get along.
    ko: |-
      그렇게 두지 않았겠지.
      너희 사이 안 좋았다며.
    ja: |-
      それはムリでしょ。
      仲良しってワケじゃなかったみたいだし。
  d_main_48_03_22:
    speaker: cecil
    en: That's true. Still, I could have at least tried asking.
    ko: 그렇죠. 그래도 부탁이라도 한번 해볼걸 그랬어요.
    ja: |-
      そうですね。
      それでも、一度くらい聞いておけばよかった。
  d_main_48_03_23:
    speaker: cecil
    en: Perhaps I should have gotten on my knees, or begged.
    ko: 무릎이라도 꿇던가, 빌어보기라도 할 걸 그랬네요.
    ja: 土下座でも泣き落としでも、試すべきでした。
  d_main_48_03_24:
    speaker: cecil
    en: Pride, differences of opinions... It all feels so unimportant now.
    ko: 그깟 자존심이 뭐라고. 사상이 뭐라고.
    ja: プライドや思想が何だったというのでしょうね。
  d_main_48_03_25:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_26:
    speaker: cecil
    en: Lately, all I have is regret.
    ko: 요즘들어, 후회 뿐이네요.
    ja: 最近は、後悔ばかりしています。
  d_main_48_03_27:
    speaker: papillon
    en: I don't regret anything.
    ko: 나는 후회 안해.
    ja: 私は後悔なんてしないわ。
  d_main_48_03_28:
    speaker: cecil
    en: I'm talking about myself right now.
    ko: 지금 제 얘기를 하고 있는데요.
    ja: 私の話だったのですが。
  d_main_48_03_29:
    speaker: papillon
    en: Joining the Counters to play spy. Getting taken hostage by Eden.
    ko: |-
      스파이 짓을 하러 카운터스에 붙은 것.
      에덴에 인질로 잡히게 된 것.
    ja: |-
      カウンターズにスパイとして近づいたことも、
      エデンの人質になったことも。
  d_main_48_03_30:
    speaker: papillon
    en: "... Starting to flee to the Ark, then turning back."
    ko: "…그 날, 방주로 도망가던 걸음을 되돌린 것."
    ja: |-
      …あの時アークへ逃げるつもりだったけど
      思い直してやめたことも。
  d_main_48_03_31:
    speaker: papillon
    en: Deciding to settle down and stay in Eden.
    ko: 에덴에 죽치고 앉아있기로 결정한 것.
    ja: それから、エデンに居座るって決めたこともね。
  d_main_48_03_32:
    speaker: papillon
    en: Inheriting you-know-what.
    ko: 그걸 이어 받은 것.
    ja: あと、これを預かってることも、かしら。
  d_main_48_03_33:
    speaker: papillon
    en: I don't regret a single thing.
    ko: 단 하나도 후회 안 해.
    ja: 全部、一度も後悔してないの。
  d_main_48_03_34:
    speaker: papillon
    en: Even if I could turn back time, I would make the exact same choices again.
    ko: 만약에 시간을 되돌린다 하더라도, 나는 똑같은 선택을 했을 거야.
    ja: |-
      もし時間を戻せるとしても、
      私は同じ選択をするわ。
  d_main_48_03_35:
    speaker: papillon
    en: Our decisions change naturally as we make our way through life.
    ko: 선택은 시간의 흐름에 따라 자연스럽게 바뀌는 거야.
    ja: 選択っていうのは時間の流れに沿うものだから。
  d_main_48_03_36:
    speaker: papillon
    en: I always made the best choices for who I was at the time.
    ko: 그 시간대의 나는 항상 최선의 선택을 했어.
    ja: |-
      私はその時ごとに、
      ベストだと思う選択をしてるだけ。
  d_main_48_03_37:
    speaker: papillon
    en: I'm sure you did too.
    ko: 너도 마찬가지겠지.
    ja: あなたも同じでしょ？
  d_main_48_03_38:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_39:
    speaker: cecil
    en: How convenient. Are you sure you're not just reframing everything to make
      yourself feel good?
    ko: 그거 너무 자기 좋을 대로만 생각하는 것 아닌가요?
    ja: それは自分に都合の良すぎる考えでは？
  d_main_48_03_40:
    speaker: papillon
    en: The first thing a spy has to learn is to adapt to change.
    ko: 스파이는 시대의 흐름에 적응하는 법부터 배워야 하거든.
    ja: |-
      スパイってのはね、
      まず時代の流れに合わせることが大事なの。
  d_main_48_03_41:
    speaker: papillon
    en: When you get tossed back and forth so much, the only way to survive is to
      become more elastic and go with the flow.
    ko: |-
      이리저리 흔들리는 팔자라서,
      잘 녹아들어가서 잘 흔들려야 살아남아.
    ja: |-
      風に揺られる運命だから、
      それが出来なきゃ生き残れないのよ。
  d_main_48_03_42:
    speaker: "<Narration>"
    en: Papillon inserts Rapunzel's brain shelter into the huge machine.
    ko: 파피용이 라푼젤의 브레인 셸터를 거대한 기계에 집어넣는다.
    ja: |-
      パピヨンはラプンツェルの
      ブレインシェルターを巨大な装置に投入した
  d_main_48_03_43:
    speaker: "<Narration>"
    en: A loud mechanical hum fills the room.
    ko: 우우우웅--- 큰 기계음이 들려온다.
    ja: うなるような機械音が響く
  d_main_48_03_44:
    speaker: papillon
    en: "... Is that all I have to do?"
    ko: "…이러면 끝?"
    ja: "…これで終わり？"
  d_main_48_03_45:
    speaker: cecil
    en: Yes. I've already input all the body data. The machine will take care of the
      rest.
    ko: 예. 바디 데이터는 모두 입력해 놨으니까, 이제 기계가 알아서 해줄 거예요.
    ja: |-
      ええ。データはすべて入力済みですので、
      後は装置が自動で処理します。
  d_main_48_03_46:
    speaker: papillon
    en: "... I don't want to watch. I feel like I'd have a Mind Switch if I did."
    ko: "…아 나 이거 안볼래. 사고전환 올 것 같아."
    ja: |-
      …見ない方がよさそうね。
      思考転換しちゃいそう。
  d_main_48_03_47:
    speaker: papillon
    en: I know we're produced by machines, but knowing it and seeing it are two very
      different things.
    ko: |-
      우리가 기계에서 [생산]되는 건 알고 있었지만,
      이걸 눈으로 직접 보는 건 좀 다른 문제인 것 같아.
    ja: |-
      自分が機械から「製造」されるってことは
      知ってるけど、実際に見るのは
      また別の問題かも…
  d_main_48_03_48:
    speaker: cecil
    en: Sure. I understand.
    ko: 그래요. 이해해요.
    ja: そうですね。気持ちは理解できます。
  d_main_48_03_49:
    speaker: papillon
    en: Call me if you need help, okay?
    ko: 도움 필요하면 부르고. 알겠지?
    ja: 手伝えることがあったら呼んで。いい？
  d_main_48_03_50:
    speaker: cecil
    en: Yeah.
    ko: 예.
    ja: はい。
  d_main_48_03_51:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_52:
    speaker: papillon
    en: Hey, Cecil. Snap out of it. If your head's not in the game, Eden is doomed.
    ko: |-
      얘. 세실. 정신차려.
      너까지 넋놓고 있으면 에덴 전멸이다?
    ja: |-
      ちょっと、セシル…しっかりして。
      あなたまでボーっとしてたらエデンは全滅よ？
  d_main_48_03_53:
    speaker: cecil
    en: "... Will do. Thank you."
    ko: "…알겠어요. 고마워요."
    ja: "…そうですね。ありがとうございます。"
  d_main_48_03_54:
    speaker: "<Narration>"
    en: Papillon opens the door and steps outside.
    ko: 파피용이 문을 열고 밖으로 나간다.
    ja: パピヨンが扉を開き、出ていった
  d_main_48_03_55:
    speaker: "<Narration>"
    en: Cecil quietly stares at the monitor connected to the body maker.
    ko: 세실은 말없이, 바디 메이커와 연결된 화면을 바라보고 있다.
    ja: |-
      セシルは何も言わず
      ボディ製造装置に接続されている
      モニターを見つめ続けた
  d_main_48_03_56:
    speaker: "<Narration>"
    en: All the readings are normal. There are no signs of abnormalities.
    ko: 모든 수치가 정상이다. 이상 징후는 보이지 않는다.
    ja: |-
      すべての数値は正常だ。
      異常の兆候は見られない
  d_main_48_03_57:
    speaker: "<Narration>"
    en: She turns her eyes away from the screen and gazes at the brain shelters of
      Scarlet and Noah.
    ko: 세실은 화면에서 눈을 돌려 홍련과 노아의 브레인 셸터를 바라본다.
    ja: |-
      セシルは画面から目を離し、
      紅蓮とノアのブレインシェルターに目を向けた
  d_main_48_03_58:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_59:
    speaker: rapunzel
    en: It's been a while.
    ko: 오랜만이네요.
    ja: お久しぶりですね。
  d_main_48_03_60:
    speaker: redshoes
    en: Yeah, it has.
    ko: 예. 그러네요.
    ja: ええ。ずいぶんと。
  d_main_48_03_61:
    speaker: rapunzel
    en: This must be a space generated from NIMPH data.
    ko: "…여긴. NIMPH의 데이터로 생성된 공간이겠네요."
    ja: "…ここは、NIMPHのデータ空間ですか。"
  d_main_48_03_62:
    speaker: redshoes
    en: That's right.
    ko: 맞아요.
    ja: その通りです。
  d_main_48_03_63:
    speaker: rapunzel
    en: The fact that you and I are together in this space,
    ko: 이곳에 저와 레드 슈즈가 함께 있다는 얘기는.
    ja: ここに私とあなたがいるということは…
  d_main_48_03_64:
    speaker: rapunzel
    en: means that you have infiltrated my NIMPH.
    ko: 당신이 제 NIMPH에 침입했다는 뜻일 테고요.
    ja: 私のNIMPHに侵入したということですね。
  d_main_48_03_65:
    speaker: redshoes
    en: That's also correct. You're amazing.
    ko: 그것도 맞아요. 역시 대단하세요.
    ja: それも正解です。さすがですね。
  d_main_48_03_66:
    speaker: rapunzel
    en: How are you even in here?
    ko: 당신이 어떻게 이곳에 있죠?
    ja: あなたがなぜここに？
  d_main_48_03_67:
    speaker: redshoes
    en: Because they're currently trying to transplant my weapon onto you.
    ko: 라푼젤에게, 제가 쓰던 무장을 이식하려 하고 있으니까요.
    ja: 私の使っていた武装が、あなたに移植されます。
  d_main_48_03_68:
    speaker: rapunzel
    en: "... Red Shoes?"
    ko: "…레드 슈즈를요?"
    ja: "…赤い靴が？"
  d_main_48_03_69:
    speaker: redshoes
    en: That's right.
    ko: 예.
    ja: ええ。
  d_main_48_03_70:
    speaker: redshoes
    en: That's how my personality data, hidden deep within the weapon, was able to
      infiltrate your NIMPH.
    ko: 그래서 무장의 깊고 깊은 곳에 숨겨 놓은 이 인격 데이터가 라푼젤의 NIMPH에 침입할 수 있었던 거죠.
    ja: |-
      その中に隠してあった人格データが
      NIMPHに侵入したということです。
  d_main_48_03_71:
    speaker: rapunzel
    en: Ah, I see. It's personality data.
    ko: 아아. 그렇군요. 인격 데이터였군요.
    ja: ああ、そういうことですか。人格データ。
  d_main_48_03_72:
    speaker: rapunzel
    en: Did you leave it behind because you had some final words for me?
    ko: 마지막으로 할 말이 있어서 남겨놓으신 건가요?
    ja: 最後のメッセージでも残そうとしたのですか？
  d_main_48_03_73:
    speaker: rapunzel
    en: Whatever it is, you can tell me. I promise to pass it on to everyone, to the
      entire world.
    ko: |-
      저희에게 말씀해주세요.
      반드시 모두에게, 세상에 전할게요.
    ja: |-
      聞かせてください。
      必ず仲間や世界に伝えます。
  d_main_48_03_74:
    speaker: redshoes
    en: No, there's no need for that.
    ko: 아니요. 그러지 않으셔도 돼요.
    ja: いいえ。その必要はありません。
  d_main_48_03_75:
    speaker: redshoes
    en: After all, I'm going to be living within your NIMPH from now on.
    ko: 저는 라푼젤의 NIMPH에서 살아갈 테니까요.
    ja: |-
      私はラプンツェルのNIMPHとして
      生きていきますから。
  d_main_48_03_76:
    speaker: rapunzel
    en: "... What do you mean?"
    ko: "…무슨 뜻인가요?"
    ja: "…どういうことでしょう？"
  d_main_48_03_77:
    speaker: redshoes
    en: I've waited so long,
    ko: 오래 기다렸어요.
    ja: 長い間待っていました。
  d_main_48_03_78:
    speaker: redshoes
    en: wondering who would eventually wield this weapon.
    ko: 과연 누가 이 무장의 주인이 될까.
    ja: 誰かがまた、この靴を履く時を。
  d_main_48_03_79:
    speaker: redshoes
    en: I'd expected the new owner to be more than an ordinary Nikke, given that it's
      a second-generation Grimms model,
    ko: 2세대 페어리 테일의 무장이니 이걸 받아갈 주인은 보통의 니케가 아닐거라는 기대는 했지만.
    ja: |-
      第2世代フェアリーテールの武装である以上、
      受け取るのは並のニケではないだろうと
      予想していましたが…
  d_main_48_03_80:
    speaker: redshoes
    en: but I never thought it would be someone of your caliber. It's quite the happy
      miscalculation on my part.
    ko: |-
      그게 라푼젤 정도 되는 거물일지는 예상하지 못했네요.
      기쁜 오산이에요.
    ja: |-
      まさかあなたほどの大物になるとは、
      うれしすぎる誤算です。
  d_main_48_03_81:
    speaker: redshoes
    en: I really am lucky to be receiving such a perfect vessel...
    ko: |-
      이런 최고의 그릇이 준비되다니.
      저는 역시 운이 좋아요.
    ja: |-
      これ以上ない器をいただけるのですから。
      やはり天は私を見ています。
  d_main_48_03_82:
    speaker: rapunzel
    en: "... Are you trying to take over my NIMPH using the personality data embedded
      in your weapon?"
    ko: "…무장에 심어놓은 인격 데이터로 제 NIMPH를 장악하려는 건가요?"
    ja: |-
      …武装に埋め込んであった人格データで
      私のNIMPHを掌握しようと？
  d_main_48_03_83:
    speaker: redshoes
    en: That's right.
    ko: 맞아요.
    ja: その通りです。
  d_main_48_03_84:
    speaker: rapunzel
    en: How is that even possible?
    ko: 어떻게 그런 일이 가능하죠?
    ja: |-
      あなたになぜ
      そのようなことができるのですか？
  d_main_48_03_85:
    speaker: redshoes
    en: My personality data has a corruption mechanism within it.
    ko: 제 인격 데이터는 침식의 메커니즘을 가지고 있어요.
    ja: |-
      私の人格データには
      侵食のメカニズムが組み込まれていますから。
  d_main_48_03_86:
    speaker: redshoes
    en: Eventually, you will succumb to corruption.
    ko: 결국, 라푼젤은 침식에 걸리게 되는 거예요.
    ja: |-
      結局、あなたも
      侵食される運命だったようですね。
  d_main_48_03_87:
    speaker: redshoes
    en: But you won't become a Rapture. Instead, you'll become me.
    ko: 랩쳐가 아니라, 제가 되는 걸 테지만.
    ja: ラプチャーではなく、私に…ですが。
  d_main_48_03_88:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_89:
    speaker: redshoes
    en: The fact that you're conversing with my personality data right now means the
      corruption has already taken root.
    ko: 지금 이렇게 제 인격 데이터와 이야기하고 있다는 것이, 침식이 시작되었다는 뜻이죠.
    ja: |-
      こうして私の人格データと
      対話しているということは、
      すでに侵食が始まっている証です。
  d_main_48_03_90:
    speaker: redshoes
    en: Thank you, Rapunzel, for giving me such a perfect body. You really are generous.
    ko: |-
      고마워요, 라푼젤.
      이런 최고의 몸을 주시다니. 역시 은혜롭네요.
    ja: |-
      あなたにはお礼を言わないといけません。
      ご自分の身体を与えていただけるなんて、
      さすがは慈愛にあふれた方です。
  d_main_48_03_91:
    speaker: rapunzel
    en: You're saying that once I succumb to the corruption,
    ko: 그 말은, 제가 지금 침식에 걸리게 되면.
    ja: つまり、ここで私が侵食されると…
  d_main_48_03_92:
    speaker: rapunzel
    en: my mind won't become like a Rapture's, but rather like yours?
    ko: 랩쳐 기준의 사고가 아닌, 레드 슈즈 기준의 사고를 하게 된다는 건가요?
    ja: |-
      ラプチャーとしての思考ではなく、
      レッドシューズの思考を
      するようになるということですか？
  d_main_48_03_93:
    speaker: redshoes
    en: That's right. You catch on quick.
    ko: 그래요. 이해가 빠르시네요.
    ja: その通りです。理解が早いですね。
  d_main_48_03_94:
    speaker: rapunzel
    en: Because you modified your personality data to become a form of corruption?
    ko: 레드 슈즈의 인격 데이터를 침식과 같은 형태로 개조했기 때문에?
    ja: |-
      レッドシューズの人格データが
      侵食と同じ機能を持つよう
      改造されているから？
  d_main_48_03_95:
    speaker: redshoes
    en: Yup, yup. I hate to repeat myself, but you're really amazing.
    ko: 맞아요 맞아요. 역시 대단하세요.
    ja: そう、その通りです。やはりさすがですね。
  d_main_48_03_96:
    speaker: rapunzel
    en: What do you intend to do with my body?
    ko: 제 몸을 가져서 뭘 할 생각이시죠?
    ja: 私の身体を奪って、何をするつもりですか？
  d_main_48_03_97:
    speaker: redshoes
    en: This time, at long last,
    ko: 이번에야말로.
    ja: 今度こそは…
  d_main_48_03_98:
    speaker: redshoes
    en: I want to become a Heretic.
    ko: 헬레틱이 되고 싶어요.
    ja: ヘレティックになりたいと思っています。
  d_main_48_03_99:
    speaker: redshoes
    en: With such a wonderful body, I'm sure the Raptures will welcome me with open
      arms.
    ko: 최고의 소체가 있으니, 랩쳐들도 흔쾌히 받아주겠죠.
    ja: |-
      最高の素材を持ち込むのですから、
      ラプチャーにも受け入れられるでしょう。
  d_main_48_03_100:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_101:
    speaker: rapunzel
    en: Red Shoes.
    ko: 레드 슈즈.
    ja: レッドシューズ…
  d_main_48_03_102:
    speaker: rapunzel
    en: Are you the one who created this corruption?
    ko: 당신이 침식을 만들었나요?
    ja: 侵食を生み出したのは、あなたですね？
  d_main_48_03_103:
    speaker: redshoes
    en: Yeah, although it's more accurate to say I cultivated it.
    ko: 예. 정확히는 제가 키웠죠.
    ja: ええ。正確には…育てた、でしょうか。
  d_main_48_03_104:
    speaker: rapunzel
    en: I see. So you inserted your personality data into the Raptures' corruption
      technology that targets NIMPH.
    ko: NIMPH를 건드는 랩쳐의 침식 기술에 당신의 인격 데이터를 집어넣어 성장시킨 것이군요.
    ja: |-
      NIMPHに干渉する
      ラプチャーの侵食プログラムに
      あなたの人格データを埋め込み、成長させた。
  d_main_48_03_105:
    speaker: rapunzel
    en: That allows you to think "voluntarily," at least by Rapture standards.
    ko: 랩쳐 기준으로, [자발적으로] 사고 할 수 있도록.
    ja: |-
      ラプチャーとして、
      「自発的な」思考をするように。
  d_main_48_03_106:
    speaker: redshoes
    en: "... Again, that's amazing. You figured that all out so quickly."
    ko: "…대단해. 단번에 거기까지 알아내시는군요?"
    ja: "…驚きました。これだけの情報でそこまで？"
  d_main_48_03_107:
    speaker: rapunzel
    en: I researched corruption for a long time.
    ko: 저는 오랫동안 침식을 연구했어요.
    ja: 長い間、侵食を研究していましたから。
  d_main_48_03_108:
    speaker: rapunzel
    en: I tried long and hard to pinpoint the source of it.
    ko: 그 기원이 무엇인지 한참을 찾아 헤매었죠.
    ja: 起源がどこにあるのか、探し続けていました。
  d_main_48_03_109:
    speaker: rapunzel
    en: But there was a point where it achieved an inexplicable evolutionary leap
      forward.
    ko: 하지만 이해할 수 없는 대도약을 이뤄낸 시점이 있었어요.
    ja: |-
      不可解に急激な変化を
      遂げた時期があることも、
      分かっていました。
  d_main_48_03_110:
    speaker: rapunzel
    en: A point where it jumped from only paralyzing Nikkes temporarily to suddenly
      making them think like Raptures.
    ko: |-
      단순하게 니케를 잠시 동안 마비시키는 것에 불과했던 침식이,
      랩쳐의 기준으로 생각하게 만드는 대도약을 이뤄낸 시점이요.
    ja: |-
      ニケを一時的に麻痺させるだけだった侵食が
      突然ニケの思考を変えてしまうようになった
      大きな変化です。
  d_main_48_03_111:
    speaker: rapunzel
    en: It was such an unusual progression that I always suspected there must have
      been a catalyst,
    ko: |-
      이상할 정도의 성장이었으니까,
      뭔가 계기가 있었을 것이라 생각하고 있었죠.
    ja: |-
      あまりにも不自然な変化だったので、
      何か理由があると考えていました。
  d_main_48_03_112:
    speaker: rapunzel
    en: or some external intervention.
    ko: 아니면, 뭔가의 개입이 있었거나.
    ja: あるいは…自然ではなく、誰かの手か。
  d_main_48_03_113:
    speaker: rapunzel
    en: That was you, wasn't it?
    ko: 그게 당신이었군요?
    ja: あなただったのですね？
  d_main_48_03_114:
    speaker: redshoes
    en: That's right.
    ko: 맞아요.
    ja: ええ。
  d_main_48_03_115:
    speaker: rapunzel
    en: Why?
    ko: 왜죠?
    ja: なぜ？
  d_main_48_03_116:
    speaker: redshoes
    en: Because joining forces with the Raptures is the only way to win this war.
    ko: 랩쳐와 같은 편이 되는 것이 이 전쟁에서 이길 수 있는 유일한 방법이니까요.
    ja: |-
      ラプチャーと同じ側に立つことが
      この戦争に勝つ唯一の方法だからです。
  d_main_48_03_117:
    speaker: redshoes
    en: If we can achieve actual unity, then victory and defeat won't matter anymore.
    ko: 진정한 화합을 이뤄낸다면, 승패는 상관없어지잖아요?
    ja: |-
      真の調和が成れば、
      勝ち負けそのものが無くなるでしょう？
  d_main_48_03_118:
    speaker: rapunzel
    en: "... So you're an apostate."
    ko: "…이단이군요."
    ja: "…異端者…"
  d_main_48_03_119:
    speaker: redshoes
    en: '"Apostate" is just a label that people in power use to eliminate anyone who
      stands against them.'
    ko: 이단이란, 우위에 선 자들이 반대편에 선 자들을 몰아내기 위해 붙이는 이명이죠.
    ja: |-
      異端という言葉は、多数派が
      従わない者を排除するために使う
      決まり文句です。
  d_main_48_03_120:
    speaker: redshoes
    en: The world belongs to Raptures.
    ko: 지금 세계는 랩쳐의 것.
    ja: もはや世界はラプチャーのものですから…
  d_main_48_03_121:
    speaker: redshoes
    en: If you really want to draw lines in the sand, it's you who are the apostates.
    ko: 굳이 구분을 하자면, 당신들 쪽이 이단이죠.
    ja: |-
      強いて分ける必要があるとすれば、
      異端になるのはあなた方でしょう。
  d_main_48_03_122:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_123:
    speaker: redshoes
    en: Hmm. This is taking longer than I thought it would.
    ko: 음. 그나저나 오래 걸리네요.
    ja: それにしても…時間がかかっていますね。
  d_main_48_03_124:
    speaker: redshoes
    en: I guess the NIMPH of someone as extraordinary as you is unusually sturdy.
    ko: 역시 보통 분이 아니라 그런지, NIMPH도 견고한가봐요.
    ja: |-
      さすが、ただ人ではないお方。
      NIMPHもとりわけ頑強なようです。
  d_main_48_03_125:
    speaker: rapunzel
    en: Thank you for the compliment.
    ko: 칭찬 고마워요.
    ja: ほめ言葉と受け取っておきましょう。
  d_main_48_03_126:
    speaker: redshoes
    en: You're welcome.
    ko: 별말씀을요.
    ja: 実際その通りです。
  d_main_48_03_127:
    speaker: rapunzel
    en: Also...
    ko: 그리고.
    ja: それから…
  d_main_48_03_128:
    speaker: rapunzel
    en: Thank you for providing such valuable information.
    ko: 좋은 정보를 알려주셔서 고마워요.
    ja: |-
      いいことを教えていただいた
      お礼も言わないとなりませんね。
  d_main_48_03_129:
    speaker: redshoes
    en: Hehe, you're really gentle, huh?
    ko: 후후. 정말 온화하신 분이네요.
    ja: ふふ…本当に落ち着いた方ですね。
  d_main_48_03_130:
    speaker: redshoes
    en: I'd been hoping to see you get upset, but not anymore.
    ko: 화난 얼굴을 보고 싶었는데, 뭐 그건 됐어요.
    ja: |-
      怒るところも見てみたかったのですが、
      まあいいでしょう。
  d_main_48_03_131:
    speaker: rapunzel
    en: One last thing.
    ko: 단 하나.
    ja: ただ1つ…
  d_main_48_03_132:
    speaker: rapunzel
    en: I had been missing just one last thing.
    ko: 단 하나가 부족했거든요.
    ja: ただ1つだけが、足りなかったのです。
  d_main_48_03_133:
    speaker: rapunzel
    en: I didn't know what caused the corruption's sudden evolutionary leap.
    ko: 침식이 대도약을 이뤄낸 기원이 무엇인가.
    ja: 侵食が急激な変化を遂げた、その原因は…
  d_main_48_03_134:
    speaker: rapunzel
    en: It was the last piece of the puzzle that I needed to conquer corruption.
    ko: 그것만 알아낸다면, 침식을 정복하는 게 가능했으니까요.
    ja: |-
      浸食を克服するために、
      ただ一つ知る必要があった鍵でした。
  d_main_48_03_135:
    speaker: rapunzel
    en: All of the code from the point where that evolutionary jump occurred was indecipherable.
    ko: |-
      대도약을 이뤄낸 그 시점의 코드들이,
      의미 불명의 코드들이었으니까요.
    ja: |-
      急激な変化をした直後のコードは
      意図の判然としない部分があり…
  d_main_48_03_136:
    speaker: rapunzel
    en: It was the only part I couldn't make sense of.
    ko: 딱 그 부분만 해석이 되지 않고 있었거든요.
    ja: そこだけが分析不能だったのです。
  d_main_48_03_137:
    speaker: redshoes
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_138:
    speaker: rapunzel
    en: But now that I know the corruption was modified by a person, I can put it
      together.
    ko: 침식이 [사람]의 손으로 개조되었다는 걸 알았으니, 이제 할 수 있어요.
    ja: |-
      「人」の手が入ったことさえ確定すれば、
      話は変わります。
  d_main_48_03_139:
    speaker: rapunzel
    en: If I proceed under the framework of that indecipherable code being the result
      of human interference,
    ko: |-
      의미 불명의 해석되지 않은 코드들을,
      사람이 개입했다고 기준을 잡는다면.
    ja: |-
      それを前提に、
      あの部分の解析を進めていけば…
  d_main_48_03_140:
    speaker: rapunzel
    en: I can find the answer.
    ko: 정답을 찾아낼 수 있겠죠.
    ja: 遠からず答えは出るでしょう。
  d_main_48_03_141:
    speaker: redshoes
    en: Congratulations.
    ko: 축하해요.
    ja: おめでとうございます。
  d_main_48_03_142:
    speaker: redshoes
    en: You found the answer right at the end of your life. How touching.
    ko: 삶의 마지막에 정답을 찾아내다니, 감동적이네요.
    ja: |-
      最期の瞬間に答えが見つかるなんて、
      ドラマチックですね。
  d_main_48_03_143:
    speaker: rapunzel
    en: I am very grateful.
    ko: 제가 고맙죠.
    ja: ありがとうございました。
  d_main_48_03_144:
    speaker: rapunzel
    en: You gave me such a wonderful gift.
    ko: 이렇게 좋은 선물을 주시다니.
    ja: おかげで、素敵な手土産を持って還れそうです。
  d_main_48_03_145:
    speaker: redshoes
    en: "... What's going on? Something's wrong with this space..."
    ko: "…뭔가요 이건. 장소가…."
    ja: "…これは…いったい何が…"
  d_main_48_03_146:
    speaker: rapunzel
    en: There is something I should tell you.
    ko: 그거 아시나요?
    ja: 分かりませんか？
  d_main_48_03_147:
    speaker: rapunzel
    en: I carry the NIMPH of countless others within me.
    ko: 저는 수많은 자매님들의 NIMPH를 짊어지고 있어요.
    ja: |-
      私の中には
      多くの姉妹たちがいるのです。
  d_main_48_03_148:
    speaker: rapunzel
    en: The space where you and I stand was not created by my NIMPH.
    ko: 당신과 제가 서있는 이 공간은, 제 NIMPH로 만들어진 공간이 아니에요.
    ja: |-
      私とあなたが立っているここは、
      私のNIMPHのデータ空間ではありません。
  d_main_48_03_149:
    speaker: rapunzel
    en: It was created by the NIMPH of my fellow sisters who are with me, now resting
      in eternal slumber.
    ko: 저와 함께 해주는, 이젠 영면에 들어간 자매님들의 NIMPH로 만들어진 공간이죠.
    ja: |-
      永遠の眠りに就かれた、
      別の方のNIMPHのものです。
  d_main_48_03_150:
    speaker: redshoes
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_151:
    speaker: rapunzel
    en: The NIMPH you have been attempting to corrupt is theirs.
    ko: 당신이 계속 침식을 시도하고 있는 NIMPH 역시, 그분들의 것이고요.
    ja: |-
      あなたが侵食を試みているNIMPHは、
      その方のもの。
  d_main_48_03_152:
    speaker: rapunzel
    en: They are buying me time so I can have this conversation with you.
    ko: 당신과의 대화를 위해, 시간을 끌어주고 계세요.
    ja: |-
      この会話のために、
      時間を稼いでくれていました。
  d_main_48_03_153:
    speaker: rapunzel
    en: I suppose you could call it a... bait-and-switch? A decoy? Something along
      those lines.
    ko: 바꿔치기술? 디코이? 뭐 그런 거라고 보면 되겠네요.
    ja: |-
      肩代わり、あるいはおとり？
      そのようなものです。
  d_main_48_03_154:
    speaker: rapunzel
    en: I would hate to trouble their NIMPH any further, so I think I'll end our conversation
      here.
    ko: 그분들의 NIMPH에게 더 폐를 끼칠 수 없으니, 여기까지 하는 게 좋겠어요.
    ja: |-
      ですが、これ以上彼女たちの眠りを
      妨げたくありません。これで終わりにします。
  d_main_48_03_155:
    speaker: rapunzel
    en: NIMPH resists corruption on a fundamental level.
    ko: 기본적으로 NIMPH는 침식에 저항해요.
    ja: NIMPHは基本的に、侵食には抵抗するもの。
  d_main_48_03_156:
    speaker: rapunzel
    en: You can see this from how early-stage corruption heals naturally.
    ko: 극초반의 침식이, 자연 치유되었다는 것을 보면 알 수 있죠.
    ja: |-
      初期の侵食が自然治癒していたことからも、
      分かっていたことです。
  d_main_48_03_157:
    speaker: rapunzel
    en: The reason Nikkes succumb to corruption is because it overwhelms the NIMPH's
      data capacity,
    ko: 그럼에도 침식에 당하는 이유는, 침식이 NIMPH의 데이터 양을 압도하기 때문이에요.
    ja: |-
      それでも侵食されてしまうようになったのは、
      侵食がNIMPHのデータを
      量的に圧倒してしまうからです。
  d_main_48_03_158:
    speaker: rapunzel
    en: essentially outweighing and crushing it.
    ko: 체급으로 눌러버리는 거죠.
    ja: 単純な物量作戦ということでしょう。
  d_main_48_03_159:
    speaker: rapunzel
    en: Since there is a limit to the amount of NIMPH data that can be loaded onto
      a single Nikke, it is impossible to outclass the corruption.
    ko: 한명의 자매님에게 탑재할 수 있는 NIMPH의 데이터 양에는 한계가 명확하니, 큰 체급을 가진 침식에 이길 수 없어요.
    ja: |-
      個人のNIMPHのデータ量には
      限界があります。
      巨大な侵食データには勝ち目がありません。
  d_main_48_03_160:
    speaker: redshoes
    en: "... Rapunzel, wait."
    ko: "…라푼젤. 잠깐만요."
    ja: "…ラプンツェル。待ってください。"
  d_main_48_03_161:
    speaker: "<Narration>"
    en: Golden particles begin to ripple throughout the space.
    ko: 공간에 황금색 입자가 일렁이기 시작한다.
    ja: 空間に黄金色の粒子が漂い始めた
  d_main_48_03_162:
    speaker: "<Narration>"
    en: Soon, everything is dyed gold.
    ko: 그리고 곧, 모든 것이 황금색으로 물든다.
    ja: あたりの全てが黄金色に塗り潰されてゆく
  d_main_48_03_163:
    speaker: rapunzel
    en: Fortunately, I carry the NIMPH of my sisters,
    ko: 감사하게도 저는 영면을 맞이한 자매님들
    ja: |-
      幸いなことに、
      私の中には安らかに眠る姉妹たち…
  d_main_48_03_164:
    speaker: rapunzel
    en: a full twelve-thousand who have passed into eternal slumber.
    ko: 일만이천명의 NIMPH를 짊어지고 있어요.
    ja: 1万と2千人分のNIMPHがあります。
  d_main_48_03_165:
    speaker: rapunzel
    en: I will never fall to something like corruption.
    ko: 침식 같은 것에, 절대 당하지 않아요.
    ja: 侵食に屈することなど、決してありません。
  d_main_48_03_166:
    speaker: redshoes
    en: Wait, just listen to what I have to say. I—
    ko: 제 얘기를 좀 들어봐 주시겠어요? 저는-
    ja: まだ私の話を聞きたいでしょう？私には…
  d_main_48_03_167:
    speaker: rapunzel
    en: Modifying your personality data into a form of corruption was a mistake, Red
      Shoes.
    ko: 인격 데이터를 침식의 형태로 개조해놓은 것이 실수였어요, 레드 슈즈.
    ja: |-
      人格データに侵食コードを組み込んだことは
      失敗でしたね、レッドシューズ。
  d_main_48_03_168:
    speaker: rapunzel
    en: I know you did so in order to steal my body,
    ko: 몸을 빼앗기 위해 선택한 방법이었겠지만….
    ja: |-
      誰かの身体を乗っ取るために
      そうしたのでしょうが…
  d_main_48_03_169:
    speaker: rapunzel
    en: but it ended up backfiring on you.
    ko: 그게 패착이 되었네요.
    ja: それがあなたの消える理由です。
  d_main_48_03_170:
    speaker: redshoes
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_171:
    speaker: redshoes
    en: I'm begging you, please spare me.
    ko: 살려줘요. 부탁이에요.
    ja: 助けてください。お願いです。
  d_main_48_03_172:
    speaker: rapunzel
    en: No.
    ko: 싫어요.
    ja: お断りします。
  d_main_48_03_173:
    speaker: rapunzel
    en: I cannot forgive you.
    ko: 저는 당신을 용서할 수 없어요.
    ja: 私にはあなたを赦すことができません。
  d_main_48_03_174:
    speaker: "<Narration>"
    en: The gold permeating the space starts to swallow any trace of red.
    ko: 공간에 만연한 황금색이 붉은색을 집어삼킨다.
    ja: 漂う黄金色が赤色を飲み込んだ
  d_main_48_03_175:
    speaker: "<Narration>"
    en: Red Shoes struggles frantically,
    ko: 레드 슈즈가 발버둥친다.
    ja: レッドシューズがもだえ、うめきを上げる
  d_main_48_03_176:
    speaker: "<Narration>"
    en: but the sacred gold hue shows no mercy.
    ko: 하지만 성스러운 황금색은 용서하지 않는다.
    ja: |-
      しかし、聖なる黄金の光が
      容赦することはなかった
  d_main_48_03_177:
    speaker: "<Narration>"
    en: Eventually,
    ko: 이윽고
    ja: やがて…
  d_main_48_03_178:
    speaker: "<Narration>"
    en: only the golden light and Rapunzel remain.
    ko: 공간에는 황금색과 라푼젤만이 남았다.
    ja: そこには黄金色とラプンツェルの姿だけが残った
  d_main_48_03_179:
    speaker: cecil
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_48_03_180:
    speaker: "<Narration>"
    en: Cecil peers into the monitor connected to Rapunzel's body maker.
    ko: 세실이 라푼젤의 바디 메이커와 이어진 화면을 들여다본다.
    ja: |-
      セシルがラプンツェルの製造装置に
      接続されているモニターをのぞき込んだ
  d_main_48_03_181:
    speaker: "<Narration>"
    en: She thought she detected a brief anomaly, but now there is nothing unusual.
    ko: 잠깐의 이상이 감지된 것 같았지만, 지금은 아무런 이상이 없다.
    ja: |-
      一瞬だけ異常が出た気がしたものの、
      モニターは何事もなかったかのように
      正常値を表示している
  d_main_48_03_182:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_183:
    speaker: cecil
    en: I must be nervous. This isn't like me.
    ko: 답지않게, 너무 긴장한 모양이네.
    ja: らしくもなく、緊張しすぎているようですね。
  d_main_48_03_184:
    speaker: "<Narration>"
    en: Cecil turns her gaze to another monitor.
    ko: 세실은 시선을 돌려 다른 모니터를 바라본다.
    ja: セシルは視線を外し、別のモニターに向けた
  d_main_48_03_185:
    speaker: "<Narration>"
    en: The screen is filled with Scarlet and Rose's data.
    ko: 홍련의 데이터와 장화의 데이터로 가득한 화면이다.
    ja: |-
      紅蓮と薔花のデータが
      画面いっぱいに表示されている
  d_main_48_03_186:
    speaker: "<Narration>"
    en: She shifts her eyes to her personal PC,
    ko: 개인 PC로 눈을 돌린다.
    ja: |-
      自分の個人用コンピューター端末に
      視線を落とした
  d_main_48_03_187:
    speaker: "<Narration>"
    en: and stares at the numerous formulas and notes on the screen.
    ko: 수많은 공식과 메모가 가득한 화면을 바라본다.
    ja: 無数の数式やメモが画面を埋め尽くしている
  d_main_48_03_188:
    speaker: "<Narration>"
    en: She suddenly feels a sharp ache in her head.
    ko: 세실은 갑자기 머리가 아파오는 것을 느꼈다.
    ja: セシルは不意に頭痛を感じた
  d_main_48_03_189:
    speaker: cecil
    en: "... Is there really no way...?"
    ko: "…방법이 없는 건가…."
    ja: "…何か、方法は…"
  d_main_48_03_190:
    speaker: "<Narration>"
    en: Cecil stands there silently for a moment.
    ko: 세실은 잠깐동안 멍하니 있었다.
    ja: そのまましばらく頭を抱え続けた
  d_main_48_03_191:
    speaker: "<Narration>"
    en: She looks at the other body maker.
    ko: 남은 한대의 바디 메이커를 바라본다.
    ja: やがてセシルはもう1台の製造装置に目を向けた
  d_main_48_03_192:
    speaker: "<Narration>"
    en: Then she looks at the two brain shelters.
    ko: 둘의 브레인 셸터를 바라본다.
    ja: それから2つのブレインシェルターを見つめた
  d_main_48_03_193:
    speaker: "<Narration>"
    en: She hesitantly stretches forth her hand.
    ko: 망설이다, 손을 뻗는다.
    ja: ためらいがちに手が伸びた
  d_main_48_03_194:
    speaker: "<Narration>"
    en: As she reaches for Noah's brain shelter,
    ko: 노아의 브레인 셸터로 뻗어가던 세실의 손이
    ja: |-
      ノアのブレインシェルターに触れかけた
      セシルの指は…
  d_main_48_03_195:
    speaker: "<Narration>"
    en: she suddenly stops as she feels a chilling sensation behind her.
    ko: 등 뒤에서 느껴지는 오싹한 기운에 멈춘다.
    ja: 背後から感じる薄気味悪い気配に止められた
  d_main_48_03_196:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_03_197:
    speaker: "<Narration>"
    en: Cecil hastily turns around.
    ko: 세실이 황급하게 뒤를 돌아본다.
    ja: セシルは素早く振り向いた
  d_main_48_03_198:
    speaker: "<Narration>"
    en: Rose is staring at her.
    ko: 장화가 세실을 바라보고 있다.
    ja: 薔花の顔がセシルに向けられていた
d_main_48_04:
  d_main_48_04_1:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_2:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_3:
    speaker: cecil
    en: It seems you've regained consciousness.
    ko: 정신을 차린 모양이군요.
    ja: 目覚めたのですか。
  d_main_48_04_4:
    speaker: cecil
    en: "... How?"
    ko: "…어떻게."
    ja: "…どうやって…"
  d_main_48_04_5:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_6:
    speaker: "<Narration>"
    en: Rose raises her trembling arm and points to Scarlet's brain shelter.
    ko: 장화가 떨리는 팔을 들어 홍련의 브레인 셸터를 가리킨다.
    ja: |-
      薔花の腕が震えながら持ち上がり、
      紅蓮のブレインシェルターを指さした
  d_main_48_04_7:
    speaker: cecil
    en: "... I'm working on it."
    ko: "…노력하고 있어요."
    ja: "…最善は尽くしています。"
  d_main_48_04_8:
    speaker: cecil
    en: It's not easy. The damage is severe.
    ko: 손상이 너무 심해서 쉽지 않은 상태죠.
    ja: 損傷が激しく、難しい状態です。
  d_main_48_04_9:
    speaker: "<Narration>"
    en: Rose turns her arm.
    ko: 장화의 팔이 방향을 바꾼다.
    ja: 薔花の腕が動いた
  d_main_48_04_10:
    speaker: "<Narration>"
    en: Disturbing snaps and cracks echo through the room.
    ko: 뚝. 뚜둑. 끔찍한 소리가 울려퍼진다.
    ja: 骨のきしむような、身の毛のよだつ音がする
  d_main_48_04_11:
    speaker: "<Narration>"
    en: She points at herself.
    ko: 손가락으로 자신을 가리킨다.
    ja: 指が薔花自身に向けられた
  d_main_48_04_12:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_13:
    speaker: cecil
    en: You heard everything.
    ko: 다 듣고 있었군요.
    ja: すべて聞いていたのですね。
  d_main_48_04_14:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_15:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_16:
    speaker: cecil
    en: Theoretically, yes. That is the correct course of action.
    ko: |-
      이론상으로는, 예.
      그렇게 하는 게 맞아요.
    ja: |-
      理論上は、そうです。
      それがもっとも見込みのある手段でしょう。
  d_main_48_04_17:
    speaker: cecil
    en: Giving your body to Scarlet is the solution most likely to succeed in the
      current situation.
    ko: 당신의 바디를 홍련에게 주는 게, 현 상황에서는 가능성이 가장 높겠죠.
    ja: |-
      あなたのボディを紅蓮に与えれば
      彼女が助かる可能性は高い。
  d_main_48_04_18:
    speaker: cecil
    en: But... taking someone's life to save another...
    ko: 하지만… 누군가를 살리기 위해 누군가를 죽인다는 게.
    ja: |-
      ですが…誰かを助けるために
      誰かを殺すということは…
  d_main_48_04_19:
    speaker: cecil
    en: It's not easy. I hope you understand that.
    ko: 쉬운 일은 아니라는 걸 알아주면 좋겠어요.
    ja: 軽々しく行ってよい判断ではありません。
  d_main_48_04_20:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_21:
    speaker: "<Narration>"
    en: Rose's arm moves again, accompanied by sickening cracks and snaps.
    ko: 뚜둑. 뚝. 장화의 팔이 끔찍한 소리를 내며 움직인다.
    ja: また、薔花の腕が不気味な音を立てて動いた
  d_main_48_04_22:
    speaker: "<Narration>"
    en: She pulls out her broken sword,
    ko: 부러진 검을 꺼내들고
    ja: その腕は折れた剣を握り…
  d_main_48_04_23:
    speaker: "<Narration>"
    en: and stabs herself in the head.
    ko: 자신의 머리를 찌른다.
    ja: 自分の頭に突き刺した
  d_main_48_04_24:
    speaker: cecil
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  d_main_48_04_25:
    speaker: "<Narration>"
    en: Rose collapses, and Cecil rushes over to her.
    ko: 장화가 쓰러지고 세실이 달려간다.
    ja: 倒れる薔花にセシルは駆け寄った
  d_main_48_04_26:
    speaker: "<Narration>"
    en: She checks the wound.
    ko: 세실은 장화의 상태를 확인한다.
    ja: セシルが薔花の傷を確かめる
  d_main_48_04_27:
    speaker: "<Narration>"
    en: The cut is precise.
    ko: 정확하게 찔렀다.
    ja: 正確な一撃だ
  d_main_48_04_28:
    speaker: "<Narration>"
    en: There is no saving her.
    ko: 이건 살릴 수 없다.
    ja: 急所が貫かれていた
  d_main_48_04_29:
    speaker: cecil
    en: What did you do...?!
    ko: 당신…!
    ja: あなた…！
  d_main_48_04_30:
    speaker: "<Narration>"
    en: Cecil feels the life fading from Rose's body.
    ko: 세실은 장화의 몸에서 생명력이 빠져나가는 것을 느낀다.
    ja: |-
      セシルの目の前で、
      薔花の身体から命が抜けていく
  d_main_48_04_31:
    speaker: "<Narration>"
    en: After staring for a moment, she abruptly stands up.
    ko: 그 모습을 잠시 동안 바라본 후, 벌떡 일어난다.
    ja: |-
      その様子を見届け、
      セシルは勢いよく立ち上がった
  d_main_48_04_32:
    speaker: cecil
    en: "... Okay."
    ko: "…예."
    ja: "…ええ。"
  d_main_48_04_33:
    speaker: cecil
    en: Leave it to me.
    ko: 맡겨줘요.
    ja: 後はお任せを。
  d_main_48_04_34:
    speaker: cecil
    en: Thank you.
    ko: 고마워요.
    ja: ありがとうございます。
  d_main_48_04_35:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_36:
    speaker: hongryeon
    en: "'Tis a strange place here."
    ko: 묘한 장소로군.
    ja: 妙な場所だね。
  d_main_48_04_37:
    speaker: "<Narration>"
    en: Scarlet looks down to see a bottle of liquor and two cups.
    ko: 홍련이 고개를 숙인다. 아래에 술병과 술잔이 놓여있다.
    ja: 紅蓮が視線を下に落とした。酒瓶と杯がある
  d_main_48_04_38:
    speaker: hongryeon
    en: Two cups.
    ko: 술잔이 두개라.
    ja: 杯は2つ…
  d_main_48_04_39:
    speaker: hongryeon
    en: Am I to expect a guest? Or am I the one summoned?
    ko: |-
      손님이 오는겐가.
      아니면, 내가 초대받았거나.
    ja: |-
      客が来るのか。
      あるいは、私が呼ばれたか？
  d_main_48_04_40:
    speaker: "<Narration>"
    en: Scarlet raises her head. She sees Rose.
    ko: |-
      홍련이 고개를 든다.
      장화가 보인다.
    ja: |-
      紅蓮が顔を上げた。
      薔花の姿があった
  d_main_48_04_41:
    speaker: janghwa
    en: Hello, Scarlet.
    ko: 안녕. 련아.
    ja: 久しぶり、レン。
  d_main_48_04_42:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_43:
    speaker: hongryeon
    en: A great while it has been, Rose.
    ko: 오랜만일세. 언니.
    ja: 久しぶりだな、姉さん。
  d_main_48_04_44:
    speaker: janghwa
    en: You're prettier than ever.
    ko: 음. 예뻐졌네?
    ja: うん。きれいになったね？
  d_main_48_04_45:
    speaker: hongryeon
    en: And thou remaineth unchanged.
    ko: 언니는 예전 그대로군.
    ja: 姉さんは変わらないねぇ。
  d_main_48_04_46:
    speaker: janghwa
    en: Let's sit. We don't have much time.
    ko: 앉자. 시간이 얼마 없어.
    ja: 座って。あんまりゆっくりできないの。
  d_main_48_04_47:
    speaker: janghwa
    en: It seems someone both capable and kind has bought me some time with you.
    ko: 유능하면서도 상냥한 누군가가, 나한테 시간을 좀 준 모양이니까.
    ja: |-
      賢くて親切な人が、
      私に少し時間をくれただけだから。
  d_main_48_04_48:
    speaker: hongryeon
    en: Oh, is it so?
    ko: 그런가.
    ja: そうかい。
  d_main_48_04_49:
    speaker: "<Narration>"
    en: Scarlet and Rose sit facing each other.
    ko: 홍련과 장화가 마주앉는다.
    ja: 紅蓮と薔花が向かい合って座った
  d_main_48_04_50:
    speaker: "<Narration>"
    en: Rose quietly pours them both a drink, and the two clink their glasses.
    ko: 장화가 말없이 술잔을 채우고, 둘은 잔을 부딪힌다.
    ja: 薔花が無言で酒を注ぎ、2人は軽く杯をぶつけた
  d_main_48_04_51:
    speaker: "<Narration>"
    en: After taking a sip, they gaze at each other in silence.
    ko: 한모금 마신 둘은, 말없이 서로를 바라본다.
    ja: |-
      互いに一口飲みくだし、
      しばらく無言で視線を交わす
  d_main_48_04_52:
    speaker: janghwa
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_53:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_54:
    speaker: hongryeon
    en: What a sumptuous dream is this.
    ko: 이것 참. 호화로운 꿈이로군.
    ja: これは…実にぜいたくな夢だ。
  d_main_48_04_55:
    speaker: janghwa
    en: Yeah, it's almost too nice.
    ko: 그러게. 분에 넘칠 정도야.
    ja: そうね。身に余るほど。
  d_main_48_04_56:
    speaker: "<Narration>"
    en: "*Splash, splash, splash*"
    ko: 첨벙. 첨벙. 첨벙.
    ja: ザバ、ザバ、ザバ――
  d_main_48_04_57:
    speaker: "<Narration>"
    en: From the tranquil surface of the water,
    ko: 고요한 수면이 솟아오른다.
    ja: 水面から湧き上がるように、何かが姿を現した
  d_main_48_04_58:
    speaker: "<Narration>"
    en: swordsmen clad in black emerge.
    ko: 검은 옷을 걸친 검사들이 모습을 드러낸다.
    ja: 黒装束の剣士たちだ
  d_main_48_04_59:
    speaker: "<Narration>"
    en: Scarlet gazes at the familiar faces and breaks into a bright smile.
    ko: 홍련은 그리운 얼굴들을 바라보고, 활짝 웃었다.
    ja: 紅蓮は懐かしがるように笑みを浮かべた
  d_main_48_04_60:
    speaker: hongryeon
    en: Ah... Ye have come also.
    ko: 아아… 자네들도 왔는가.
    ja: ああ…君たちも来たか。
  d_main_48_04_61:
    speaker: hongryeon
    en: Here, be seated. Let us drink together.
    ko: 어서 이리들 와서 앉게. 함께 마시지.
    ja: 早く座れ。一杯やろう。
  d_main_48_04_62:
    speaker: janghwa
    en: Scarlet. Draw your sword.
    ko: 련아. 검을 들어.
    ja: レン。剣を取って。
  d_main_48_04_63:
    speaker: hongryeon
    en: My sword? For what reason?
    ko: 검? 갑자기 무슨 소린가.
    ja: 剣？急にどうした？
  d_main_48_04_64:
    speaker: janghwa
    en: Those aren't our allies.
    ko: 저것들은 우리 동료가 아니야.
    ja: 私たちの仲間じゃないわ。
  d_main_48_04_65:
    speaker: janghwa
    en: They're here to make us into puppets.
    ko: 우릴 꼭두각시로 만들기 위해 온 것들이지.
    ja: 操り人形にしようとしてるの。
  d_main_48_04_66:
    speaker: hongryeon
    en: Hmm?
    ko: 흐음…?
    ja: ほう…？
  d_main_48_04_67:
    speaker: janghwa
    en: She enjoys this sort of thing. Drudging up your own memories to force you
      into submission.
    ko: |-
      그 녀석은 이런 걸 좋아하거든.
      기억을 끄집어내서 굴복할 수밖에 없게 만들어.
    ja: |-
      そういうシュミのヤツがいるのよ。
      相手の記憶を使って、心を折る。
  d_main_48_04_68:
    speaker: hongryeon
    en: '"She"?'
    ko: 그 녀석?
    ja: そんなやからが？
  d_main_48_04_69:
    speaker: janghwa
    en: Yeah, a dismal creature who enjoys watching others fall apart from the shadows.
    ko: 있어. 직접 나서지는 않는 주제에 남이 망가지는 걸 지켜보기 좋아하는 음침한 녀석.
    ja: |-
      そう。自分は隠れて、
      誰かが壊れるところを見るのが好きな
      陰気臭いやつがね。
  d_main_48_04_70:
    speaker: hongryeon
    en: The world hath no lack of such miscreants.
    ko: 어딜 가나 그런 것들은 있기 마련이지.
    ja: その程度のやから、どこにでもいる。
  d_main_48_04_71:
    speaker: janghwa
    en: If those things defeat us, our NIMPH will break down and we'll become nothing
      more than puppets.
    ko: |-
      저것들에게 패배하는 순간,
      NIMPH가 망가져서 꼭두각시가 되는 거야.
    ja: |-
      あれに負けると、
      NIMPHが壊されて、操り人形にされるの。
  d_main_48_04_72:
    speaker: janghwa
    en: She planted all these blackboxes throughout my body because she didn't want
      to lose her puppet again.
    ko: |-
      자기 꼭두각시가 빼앗기는 건 또 싫어서,
      내 몸 곳곳에 있는 블랙박스에 저런 걸 심어 놓은 거지.
    ja: |-
      自分のオモチャを取られるのは
      面白くないからって、
      私のブラックボックスに仕込んでたのね。
  d_main_48_04_73:
    speaker: hongryeon
    en: Thou speakest as if from experience.
    ko: 경험이 있는 것처럼 말하는군.
    ja: まるで見たことがあるような話しぶりだ。
  d_main_48_04_74:
    speaker: janghwa
    en: Yes, it happened to me before.
    ko: 응. 당했었으니까.
    ja: うん。経験したから。
  d_main_48_04_75:
    speaker: hongryeon
    en: What? To thee?
    ko: 호오. 언니가?
    ja: ほう。姉さんを？
  d_main_48_04_76:
    speaker: hongryeon
    en: Are they strong?
    ko: 저들은 강한가?
    ja: 強いのか？
  d_main_48_04_77:
    speaker: janghwa
    en: Not really, but they make you unable to attack.
    ko: 별로. 근데 못 베게 만들어.
    ja: 別に。でも、斬れなくするの。
  d_main_48_04_78:
    speaker: janghwa
    en: You were the one I saw when this happened to me.
    ko: 나한테는 련이 네가 나왔었거든.
    ja: 私の時にはレンの姿だった。
  d_main_48_04_79:
    speaker: janghwa
    en: I knew it was fake, of course, but I still couldn't do it.
    ko: 가짜인 줄은 당연히 알았는데, 차마 못 베겠더라.
    ja: |-
      ニセモノだって分かってても、
      どうしても斬れなかったの。
  d_main_48_04_80:
    speaker: janghwa
    en: "... I couldn't bring myself to attack you, because all of my memories are
      of me hurting you."
    ko: "…너한테 상처를 준 기억밖에 없어서 그런지, 벨 수 없었어."
    ja: |-
      …あなたを傷つけた記憶しか、
      無かったからかしら。
  d_main_48_04_81:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_82:
    speaker: hongryeon
    en: Thou didst command me to wax stronger,
    ko: 언니는 나에게 강해지라 말해주었네.
    ja: 姉さんはいつも私に強くなれと言っていた。
  d_main_48_04_83:
    speaker: hongryeon
    en: that I may never be controlled.
    ko: 누구에게도 휘둘리지 않게.
    ja: 誰にも振り回されないように、とな。
  d_main_48_04_84:
    speaker: hongryeon
    en: I have lived long by that creed,
    ko: 나는 그것을 삶의 지표삼아 살아왔고
    ja: 私はそれを頼りに生きてきた。
  d_main_48_04_85:
    speaker: hongryeon
    en: and now know I am the master of mine own blade.
    ko: 내 검의 주인은 나임을 자각했네.
    ja: |-
      おかげで、私の剣のあるじは私だと
      自覚ができている。
  d_main_48_04_86:
    speaker: hongryeon
    en: None can wield me.
    ko: 그 누구도 나를 휘두를 수 없네.
    ja: 何人たりとも、振り回せはしない。
  d_main_48_04_87:
    speaker: hongryeon
    en: I have lived freely, by mine own discretion guided.
    ko: 자유롭게, 나 스스로 판단하며 살아왔네.
    ja: 何ごとにもとらわれず、己の心に従ってきた。
  d_main_48_04_88:
    speaker: hongryeon
    en: Thus I pray thee, say not thou hast wounded me.
    ko: 그러니 상처를 줬다 말하지 말게.
    ja: 傷つけたなどと、考えて欲しくないねぇ。
  d_main_48_04_89:
    speaker: janghwa
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_90:
    speaker: hongryeon
    en: Now, we need but slay the rabble there, do we not?
    ko: 그럼, 저것들을 모조리 베면 되는 건가.
    ja: それで、全部斬ればいいのかい。
  d_main_48_04_91:
    speaker: janghwa
    en: Yeah. They're not real, of course, so don't hesitate.
    ko: 응. 당연히 진짜가 아니니 망설이지 말고.
    ja: そう。本物じゃないし、迷う必要もない。
  d_main_48_04_92:
    speaker: hongryeon
    en: Then let us, thee and me,
    ko: 언니와 내가.
    ja: 姉さんと私で…
  d_main_48_04_93:
    speaker: hongryeon
    en: join in our might,
    ko: 힘을 합쳐.
    ja: ともに並んでか。
  d_main_48_04_94:
    speaker: hongryeon
    en: and put them to the sword. Shall we not?
    ko: 저것들을 베는 건가?
    ja: やれるのだな？
  d_main_48_04_95:
    speaker: janghwa
    en: "... Let's do it."
    ko: "…응."
    ja: "…うん。"
  d_main_48_04_96:
    speaker: hongryeon
    en: Haha!
    ko: 허, 허허.
    ja: ふふ、ははは…
  d_main_48_04_97:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_98:
    speaker: hongryeon
    en: Sumptuous is too cold a word for such a dream as this, one that surpasseth
      all description.
    ko: 이것 참. 정말 호화롭다는 말로는 다 담을 수 없을 정도의 꿈이로군.
    ja: |-
      なんとまぁ…
      ぜいたくの一言では、足りぬ夢だ。
  d_main_48_04_99:
    speaker: "<Narration>"
    en: The sisters rush forward.
    ko: 자매가 달린다.
    ja: 姉妹が駆けた
  d_main_48_04_100:
    speaker: "<Narration>"
    en: With their swords in hand, they cut down their enemies.
    ko: 검을 휘두르며, 적들을 베어낸다.
    ja: 剣がひらめき、敵がなぎ倒される
  d_main_48_04_101:
    speaker: "<Narration>"
    en: They flow like water, effortlessly dodging the enemy's assault.
    ko: 적의 공격을 받아낼 땐 흐르는 물처럼.
    ja: 受ける時は、流れる水のごとく
  d_main_48_04_102:
    speaker: "<Narration>"
    en: They strike like lightning, slaying their foes with swift cruelty.
    ko: 적에게 공격을 퍼부을 땐 질주하는 번개처럼.
    ja: 攻める時は、ほとばしる稲妻のごとく
  d_main_48_04_103:
    speaker: "<Narration>"
    en: They move like flower petals carried on the wind.
    ko: 움직임은 바람에 몸을 맡긴 꽃잎처럼.
    ja: 風に身を任せた花びらのように…
  d_main_48_04_104:
    speaker: "<Narration>"
    en: The sisters act in perfect harmony, as if they are one body.
    ko: 자매는 마치 처음부터 한몸이었던 것 마냥, 완벽한 호흡을 맞춘다.
    ja: |-
      二人は最初から一心同体であったと
      言わんばかりに、
      寸分たがわず息を合わせた
  d_main_48_04_105:
    speaker: "<Narration>"
    en: The enemies' assault intensifies, crashing down like a tidal wave of swords
      from all directions.
    ko: |-
      적의 공격이 거세진다.
      사방에서 공격해오는 검의 파도와 같다.
    ja: |-
      それでも敵の勢いは増していく。
      四方からの刃が波のように襲った
  d_main_48_04_106:
    speaker: "<Narration>"
    en: The sisters stand back-to-back.
    ko: 자매는 서로 등을 맞댄다.
    ja: 姉妹が背中合わせに立った
  d_main_48_04_107:
    speaker: "<Narration>"
    en: Neither looks back, their eyes fixed only straight ahead,
    ko: |-
      뒤를 돌아보지 않는다.
      오직 자신의 정면만을 바라본다.
    ja: |-
      後ろは見ない。
      ひたすら正面と斬り結ぶ
  d_main_48_04_108:
    speaker: "<Narration>"
    en: because they each know that behind them stands the greatest swordswoman there
      ever was,
    ko: 서로의 등 뒤에는 최고의 검사가 있으니
    ja: 最高の剣士に背中を預けているのだ
  d_main_48_04_109:
    speaker: "<Narration>"
    en: and that all they have to do is defeat the enemies right in front of them.
    ko: 둘은 그저 눈앞의 적만을 베어내면 그만인 일이다.
    ja: ただ、目の前の敵を斬ればいい
  d_main_48_04_110:
    speaker: "<Narration>"
    en: The slash, cut, and stab again and again and again.
    ko: 베고, 베고, 베어낸다.
    ja: 斬っては捨て、また斬って捨てる
  d_main_48_04_111:
    speaker: "<Narration>"
    en: The water's surface shakes violently.
    ko: 수면이 난폭하게 흔들린다.
    ja: 足下の水面は荒々しく揺れた
  d_main_48_04_112:
    speaker: "<Narration>"
    en: Only the clang of clashing swords fills the air.
    ko: 검과 검이 부딪히는 소리만이 들려온다.
    ja: 剣のぶつかる音だけが響く
  d_main_48_04_113:
    speaker: "<Narration>"
    en: Occasionally, the sound of the sisters' breathing can be heard, mixed with
      laughter the two are unable to contain.
    ko: 간혹, 즐거움을 주체하지 못 하는 자매의 웃음 섞인 호흡이 들려온다.
    ja: |-
      時おり、心から愉快そうな
      二人の笑い混じりの呼吸が聞こえた
  d_main_48_04_114:
    speaker: "<Narration>"
    en: Then, at long last,
    ko: 그리고 이윽고.
    ja: しばらくして…
  d_main_48_04_115:
    speaker: "<Narration>"
    en: there is complete silence,
    ko: 아무런 소리도 들려오지 않고
    ja: 静けさが戻った
  d_main_48_04_116:
    speaker: "<Narration>"
    en: and the water's surface grows calm.
    ko: 수면은 잔잔해진다.
    ja: 水面に立つ波も消えた
  d_main_48_04_117:
    speaker: "<Narration>"
    en: The sisters gaze at each other.
    ko: 자매는 서로를 바라본다.
    ja: 姉妹は互いに視線を交わした
  d_main_48_04_118:
    speaker: "<Narration>"
    en: They break into wide, beaming smiles.
    ko: 활짝, 조금의 구김도 없는 웃음을 짓는다.
    ja: 曇りのない笑顔を浮かべて
  d_main_48_04_119:
    speaker: "<Narration>"
    en: Flower petals in full bloom begin to fall from the trees.
    ko: 나무에 흐드러지게 핀 꽃잎이 떨어진다.
    ja: 咲き乱れる花びらが落ちてゆく
  d_main_48_04_120:
    speaker: "<Narration>"
    en: They rustle as they fall, as if shedding everything that had held them back.
    ko: 우수수. 모든것을 털어내듯 떨어진다.
    ja: はらはらと、名残を惜しまず
  d_main_48_04_121:
    speaker: "<Narration>"
    en: The older sister slowly approaches
    ko: 언니는 천천히 다가가
    ja: 姉が穏やかに近づき…
  d_main_48_04_122:
    speaker: "<Narration>"
    en: and embraces her beloved little sister.
    ko: 사랑스러운 동생을 끌어안는다.
    ja: 愛する妹を抱き寄せた
  d_main_48_04_123:
    speaker: janghwa
    en: '"Flowers are fleetly fading."'
    ko: 열흘 붉은 꽃은 없다.
    ja: 花に十日の紅無し…
  d_main_48_04_124:
    speaker: janghwa
    en: I always hated that saying.
    ko: 나는 화무십일홍이라는 말이 너무 싫었어.
    ja: 嫌いで仕方なかったのよね、この言葉。
  d_main_48_04_125:
    speaker: janghwa
    en: It feels so... stingy.
    ko: 너무 쪼잔하다고 생각했지.
    ja: だって、厳しすぎるもの。
  d_main_48_04_126:
    speaker: janghwa
    en: Do they really have to be so fleeting? It's just cruel.
    ko: 고작 열흘이라니, 너무하잖아.
    ja: 十日だけなんて、残酷でしょ。
  d_main_48_04_127:
    speaker: janghwa
    en: I mean, what's the rush?
    ko: 하루 정도는, 더 붉어도 괜찮을 텐데.
    ja: もう一日くらい、紅いままでもいいじゃない。
  d_main_48_04_128:
    speaker: janghwa
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_04_129:
    speaker: janghwa
    en: Well, my time ended long ago, and I already wilted.
    ko: 나의 열흘은 이미 오래전에 끝났고, 나는 시들었어.
    ja: 私の十日はずっと前に終わって、私は枯れた。
  d_main_48_04_130:
    speaker: janghwa
    en: But at least I was given one more day to bloom again.
    ko: 그런데 딱 하루. 더 붉을 수 있었네.
    ja: でも、一日だけ。また紅くなれた。
  d_main_48_04_131:
    speaker: janghwa
    en: And that was today.
    ko: 그게 오늘이고.
    ja: それが今日。
  d_main_48_04_132:
    speaker: hongryeon
    en: "... What, goest thou now?"
    ko: "…가는겐가."
    ja: "…行くのかい。"
  d_main_48_04_133:
    speaker: janghwa
    en: Yeah, I have to.
    ko: 응. 이제 가야지.
    ja: うん。もう行かないと。
  d_main_48_04_134:
    speaker: janghwa
    en: Take care, Scarlet, my little flower of a sister whom I love so much.
    ko: 안녕 련아. 내 사랑하는 꽃같은 동생.
    ja: じゃあね、レン。私の愛する、花のような妹。
  d_main_48_04_135:
    speaker: janghwa
    en: I'm going to place one last curse on you.
    ko: 내가 너한테 거는 마지막 주박이야.
    ja: これがあなたにかける最後の呪い…
  d_main_48_04_136:
    speaker: janghwa
    en: Live a happy life.
    ko: 행복하게 살아.
    ja: どうか、幸せに生きて。
  d_main_48_04_137:
    speaker: "<Narration>"
    en: Rose's body turns into red petals and vanishes.
    ko: 장화의 몸이 붉은 꽃잎이 되어 사라진다.
    ja: 薔花の身体が紅い花びらとなって消えていく
  d_main_48_04_138:
    speaker: "<Narration>"
    en: Scarlet embraces Rose even tighter.
    ko: 홍련은 장화를 더욱 세게 끌어안는다.
    ja: 紅蓮は薔花をさらに強く抱き寄せた
  d_main_48_04_139:
    speaker: hongryeon
    en: I swear to thee,
    ko: 약조하겠네.
    ja: 約束しよう。
  d_main_48_04_140:
    speaker: hongryeon
    en: I shall live and be happy.
    ko: 나는 반드시 행복하게 살겠네.
    ja: 私は必ず、幸せになってみせる。
  d_main_48_04_141:
    speaker: "<Narration>"
    en: The red petals flutter down quietly,
    ko: 붉은 꽃잎만이 고요히 흩날린다.
    ja: 紅い花びらだけが静かに舞い続けた
  d_main_48_04_142:
    speaker: "<Narration>"
    en: until the last petal gently settles upon the water's surface,
    ko: 마지막 남은 붉은 꽃잎이 수면에 내려앉는다.
    ja: 最後のひとひらが、水面に落ちた
  d_main_48_04_143:
    speaker: "<Narration>"
    en: causing a tiny ripple.
    ko: 작은 파문과 함께.
    ja: 小さな波紋が広がり…
  d_main_48_04_144:
    speaker: "<Narration>"
    en: Scarlet opens her eyes.
    ko: 홍련은 눈을 뜬다.
    ja: 紅蓮は目を開いた
d_main_48_05:
  d_main_48_05_1:
    speaker: "<Narration>"
    en: One corner of the dark space is bustling with noise.
    ko: 검은 공간의 한 구석이 요란스럽다.
    ja: |-
      黒い空間の中、
      その片隅だけが騒がしく音を立てる
  d_main_48_05_2:
    speaker: "<Narration>"
    en: The girl and Marian watch the battle taking place around the Lift.
    ko: 소녀와 마리안은 궤도 엘리베이터에서의 전투를 지켜보고 있다.
    ja: |-
      少女とマリアンが
      軌道エレベーターでの戦いを見守っていた
  d_main_48_05_3:
    speaker: "<Narration>"
    en: Leviathan narrowly manages to seize control of the nearby Dark Matter and
      create a massive wall to block the wave.
    ko: 레비아탄이 인근의 다크 매터들의 제어권을 겨우 빼앗아 거대한 벽을 만들어 파도를 막아낸다.
    ja: |-
      レヴィアタンが近場にあるダークマターの
      制御権をどうにか奪取し、
      巨大な壁を作って波を食い止めていた
  d_main_48_05_4:
    speaker: "<Narration>"
    en: However, it soon reaches its limit. Just before the wall collapses, Ziz envelops
      everyone and soars into the sky.
    ko: |-
      하지만 곧 한계에 다다른다. 벽이 무너지기 직전,
      지즈가 모두를 감싸 하늘로 솟아오른다.
    ja: |-
      だが、限界が近づいている。
      壁が崩れる直前、
      ジズが全員を包み込み空へと飛び上がった
  d_main_48_05_5:
    speaker: "<Narration>"
    en: Liberalio's body unleashes a swift, high-pressure torrent of water from one
      of its tentacles, sending Ziz crashing down.
    ko: 리버렐리오 바디가 촉수에서 고압고속의 물줄기를 쏟아내 지즈를 떨어뜨린다.
    ja: |-
      敵の触手から高圧の水流が放たれ、
      ジズを叩き落とした
  d_main_48_05_6:
    speaker: "<Narration>"
    en: Without giving the fallen party a moment to recover, Liberalio's body continues
      to blast jets of water from its tentacles.
    ko: |-
      바닥에 쓰러진 일행이 추스릴 틈도 주지 않은 채,
      리버렐리오 바디는 촉수에서 물줄기를 쏘아댄다.
    ja: |-
      体勢を崩した一行に立ち直る間も与えず、
      触手からさらなる追撃が放たれた
  d_main_48_05_7:
    speaker: "<Narration>"
    en: At such a staggering size and height,
    ko: 아득한 높이. 아득한 크기.
    ja: 圧倒的な巨体が、圧倒的な高度にいる
  d_main_48_05_8:
    speaker: "<Narration>"
    en: it does not dodge any of their attacks
    ko: 리버렐리오 바디는 공격을 피하지 않는다.
    ja: 攻撃を避けようと動くことさえない
  d_main_48_05_9:
    speaker: "<Narration>"
    en: It merely looks down with contempt and shoots blasts of water.
    ko: 오만하게 아래를 내려다보며 물줄기를 쏘아낼 뿐이다.
    ja: |-
      下々の物を見下ろすかのような態度で、
      水流を放ち続けている
  d_main_48_05_10:
    speaker: "<Narration>"
    en: It is enormous, durable, and powerful,
    ko: 그저 크고, 단단하고, 강하다.
    ja: ただ大きく、固く、強い
  d_main_48_05_11:
    speaker: "<Narration>"
    en: to an unprecedented degree.
    ko: 순수한 스펙 자체가 터무니없이 높다.
    ja: 単純な性能差の暴力だ
  d_main_48_05_12:
    speaker: "<Narration>"
    en: It does not possess any special abilities, or rather cannot use them,
    ko: 별다른 특수 능력은 없다. 정확히는 사용할 수 없다.
    ja: 特殊能力めいたものはない。正確には、使えない
  d_main_48_05_13:
    speaker: "<Narration>"
    en: as it lacks a brain to utilize all of its functions.
    ko: 바디의 기능을 끌어내고 활용할 머리가 없다.
    ja: ボディの機能を活かせる頭がないからだ
  d_main_48_05_14:
    speaker: "<Narration>"
    en: As such, it can do nothing but unleash attack after attack.
    ko: 그렇기에 그저 공격만을 퍼부을 뿐이다.
    ja: ゆえにひたすら、単純な攻撃を繰り返す
  d_main_48_05_15:
    speaker: "<Narration>"
    en: Liberalio was the second Heretic ever created.
    ko: 두 번째로 만들어진 헬레틱.
    ja: 2体目のヘレティック
  d_main_48_05_16:
    speaker: "<Narration>"
    en: Unlike the first Heretic, Anachiro, who was created almost by chance,
    ko: 우연에 가깝게 만들어진 첫 번째 헬레틱 아나키오르와는 달리
    ja: |-
      それはほぼ成り行きで生みだされた
      最初のヘレティック、アナキオールとは異なる
  d_main_48_05_17:
    speaker: "<Narration>"
    en: the second Heretic was created with clear intent, focus, and with everything
      available at the time.
    ko: 명확한 의도를 가지고 성심성의껏, 전력을 다해 만들어진 두번째 헬레틱.
    ja: |-
      明確な設計意図をもって思考を巡らせ、
      製造者の実力を尽くして生み出されたものだ
  d_main_48_05_18:
    speaker: "<Narration>"
    en: And now, its overwhelming power is being fully unleashed.
    ko: 그 압도적인 힘이 유감없이 발휘되고 있다.
    ja: その違いがもたらす力を余さず発揮している
  d_main_48_05_19:
    speaker: "<Narration>"
    en: Altruia and Egovista watch the scene from afar.
    ko: 앨트루이아와 에고비스타는 멀찌감치, 그 모습을 바라보고 있다.
    ja: |-
      アルトルイアとエゴビスタは
      離れた場所で戦場を眺めているだけだ
  d_main_48_05_20:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_21:
    speaker: marian_q
    en: Commander... Everyone...
    ko: "…지휘관. 모두…."
    ja: "…指揮官。みんな…"
  d_main_48_05_22:
    speaker: onlyone_c
    en: I've made up my mind.
    ko: 결정했어.
    ja: 決めた。
  d_main_48_05_23:
    speaker: onlyone_c
    en: I'm going over there.
    ko: 저기로 갈래.
    ja: あそこに行く。
  d_main_48_05_24:
    speaker: marian_q
    en: What...?
    ko: "…?"
    ja: "…？"
  d_main_48_05_25:
    speaker: onlyone_c
    en: They're weak.
    ko: 언니들은 약해.
    ja: お姉ちゃんたち、弱い。
  d_main_48_05_26:
    speaker: onlyone_c
    en: I'm strong.
    ko: 나는 강해.
    ja: わたし、強い。
  d_main_48_05_27:
    speaker: onlyone_c
    en: I will go kill that thing in the sky, steal the gene, and become the Queen.
    ko: 가서 하늘에서 온 그것을 죽이고, 인자를 빼앗아 퀸이 될래.
    ja: |-
      あそこに行って、
      空から来たやつを倒して、
      因子を奪ってクイーンになる。
  d_main_48_05_28:
    speaker: onlyone_c
    en: Yeah... That's what I've decided.
    ko: 응. 그렇게 정했어.
    ja: うん。そう決めた。
  d_main_48_05_29:
    speaker: marian_q
    en: "... Why?"
    ko: "…왜요?"
    ja: "…どうして？"
  d_main_48_05_30:
    speaker: onlyone_c
    en: Because I have to save them.
    ko: 언니들을 구해야 하니까.
    ja: お姉ちゃんたち、助けないと。
  d_main_48_05_31:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_32:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_33:
    speaker: marian_q
    en: But...
    ko: "…퀸이"
    ja: "…クイーンに…"
  d_main_48_05_34:
    speaker: marian_q
    en: do you want to become the Queen?
    ko: 되고 싶나요?
    ja: なりたいんですか？
  d_main_48_05_35:
    speaker: onlyone_c
    en: "... No. I don't want to."
    ko: "…아니. 싫어."
    ja: "…ううん。イヤ。"
  d_main_48_05_36:
    speaker: onlyone_c
    en: But I have to.
    ko: 그런데 해야 해.
    ja: でも、やらなくちゃ。
  d_main_48_05_37:
    speaker: onlyone_c
    en: We can't let that thing be the Queen.
    ko: 그것이 퀸이 되어서는 안돼.
    ja: あれがクイーンなのはダメ。
  d_main_48_05_38:
    speaker: onlyone_c
    en: I felt something when I fought it.
    ko: 그때 싸우면서 알게됐어.
    ja: この前戦って、分かった。
  d_main_48_05_39:
    speaker: onlyone_c
    en: It only wants one thing.
    ko: 그것이 원하는 건 단 하나야.
    ja: あいつが欲しいものはひとつだけ。
  d_main_48_05_40:
    speaker: onlyone_c
    en: To kill everything except what it created.
    ko: 자기가 만들어낸 것 이외에는 다 죽이는거야.
    ja: 自分が作ったもの以外、みんな壊したい。
  d_main_48_05_41:
    speaker: onlyone_c
    en: It will kill everyone...
    ko: 언니들을… 다 죽일거야.
    ja: お姉ちゃんたちも…みんな壊しちゃう。
  d_main_48_05_42:
    speaker: onlyone_c
    en: And try to start over.
    ko: 그리고 다시 시작하려 해.
    ja: それで、やり直すつもり。
  d_main_48_05_43:
    speaker: onlyone_c
    en: "... I don't want that. So I have to do it. I have to become the Queen."
    ko: "…그건 싫어. 그러니 내가 해야 해. 내가 퀸이 되어야 해."
    ja: |-
      …それはイヤ。
      だから、行く。
      わたしが、クイーンになる。
  d_main_48_05_44:
    speaker: marian_q
    en: What do you want?
    ko: 뭘 원하나요.
    ja: あなたが望むものは？
  d_main_48_05_45:
    speaker: onlyone_c
    en: A world where my friends and family are alive.
    ko: 언니들이 살아있는 세상.
    ja: お姉ちゃんたちが、生きてる世界。
  d_main_48_05_46:
    speaker: marian_q
    en: No, I don't mean that.
    ko: 아뇨. 그거 말고요.
    ja: いいえ。そのことじゃありません。
  d_main_48_05_47:
    speaker: marian_q
    en: I wasn't asking what kind of world you want to create.
    ko: 어떤 세상을 만들고 싶은지가 아니라
    ja: 望む世界のことではなくて…
  d_main_48_05_48:
    speaker: marian_q
    en: I want you to tell me what you really want.
    ko: 당신이 원하는 것이 무엇인지 알려줘요.
    ja: あなたがしたいことです。
  d_main_48_05_49:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_50:
    speaker: onlyone_c
    en: I want to live together with my sisters.
    ko: 나는 언니들이랑 같이 살고 싶어.
    ja: わたし、お姉ちゃんたちと一緒に暮らしたい。
  d_main_48_05_51:
    speaker: onlyone_c
    en: I want to spend time with Daddy and Mommy.
    ko: 아빠랑 엄마랑 같이 지내고 싶어.
    ja: パパとママと、ずっと一緒にいたい。
  d_main_48_05_52:
    speaker: onlyone_c
    en: I want them to hug me, and take me places.
    ko: 품에 안겨 자고, 온갖 곳을 돌아다니고 싶어.
    ja: |-
      だっこされて寝て、
      いろんなところに行きたい。
  d_main_48_05_53:
    speaker: onlyone_c
    en: I want to laugh every day, and have fun.
    ko: 매일 웃고, 재미있고 싶어.
    ja: 毎日、笑って、楽しいことをしたい。
  d_main_48_05_54:
    speaker: marian_q
    en: "... Wow, you are deeply loved."
    ko: "…당신은, 사랑받고 있군요."
    ja: "…あなたは、愛されているみたいですね。"
  d_main_48_05_55:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_56:
    speaker: onlyone_c
    en: Yeah.
    ko: 응.
    ja: うん。
  d_main_48_05_57:
    speaker: onlyone_c
    en: They give me hugs.
    ko: 나 안아줬어.
    ja: わたしのこと、だっこしてくれた。
  d_main_48_05_58:
    speaker: onlyone_c
    en: They hugged me so much.
    ko: 많이 많이 안아줬어.
    ja: いっぱい、いっぱい、ぎゅってしてくれた。
  d_main_48_05_59:
    speaker: marian_q
    en: Can you not do those things if you become the Queen?
    ko: 퀸이 되고 난 뒤에는… 못 하는 건가요?
    ja: クイーンになったら…できなくなるんですか？
  d_main_48_05_60:
    speaker: onlyone_c
    en: You really don't know anything, huh?
    ko: 언니는 정말 아무것도 모르는구나.
    ja: お姉ちゃん、ほんとに何も知らないね。
  d_main_48_05_61:
    speaker: onlyone_c
    en: The Queen has to build the world together with the Seven Arbiters.
    ko: 퀸은 일곱의 조율자와 함께 세상을 만들어 나가야 해.
    ja: |-
      クイーンは7人の調律者といっしょに
      世界を作らないといけない。
  d_main_48_05_62:
    speaker: onlyone_c
    en: That's her duty.
    ko: 그게 퀸이 해야 할 일이야.
    ja: それが、クイーンのすること。
  d_main_48_05_63:
    speaker: onlyone_c
    en: She can't do anything else.
    ko: 그 외엔 무엇도 할 수 없어.
    ja: それ以外は、何もできない。
  d_main_48_05_64:
    speaker: onlyone_c
    en: "... I won't be able to ask for hugs."
    ko: "…그래서, 안아달라고 할 수 없어."
    ja: "…抱っこしてって、言えなくなるの。"
  d_main_48_05_65:
    speaker: onlyone_c
    en: I won't be able to go out to play, or even laugh.
    ko: 놀러 갈 수도 없어. 웃지도 못해.
    ja: 遊びに行けない。笑うのもできない。
  d_main_48_05_66:
    speaker: onlyone_c
    en: I'll be lonely.
    ko: 외로울 거야.
    ja: さびしくなる。
  d_main_48_05_67:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_68:
    speaker: onlyone_c
    en: But I still have to do it.
    ko: 그래도 해야 해.
    ja: でも、やらないと。
  d_main_48_05_69:
    speaker: onlyone_c
    en: I am the only one who can defeat that thing.
    ko: 그것을 이길 수 있는 건 나 뿐이야.
    ja: あいつに勝てるの、わたししかいない。
  d_main_48_05_70:
    speaker: onlyone_c
    en: I have to do it.
    ko: 내가 해야 해.
    ja: わたしがやらないといけないの、
  d_main_48_05_71:
    speaker: onlyone_c
    en: If I don't, that thing will take over the world.
    ko: 그렇지 않으면 세상을 그것에게 넘겨주게 될 테니까.
    ja: そうしないと、あいつに世界をとられる。
  d_main_48_05_72:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_73:
    speaker: "<Narration>"
    en: Marian slowly approaches the girl.
    ko: 마리안이 천천히 소녀에게 다가간다.
    ja: マリアンがゆっくりと少女に近づいた
  d_main_48_05_74:
    speaker: "<Narration>"
    en: She sees the emotion in her seemingly empty eyes.
    ko: 소녀의 공허해 보이는 눈 안에 담긴 감정을 본다.
    ja: 底知れない瞳の奥から感情がのぞく
  d_main_48_05_75:
    speaker: "<Narration>"
    en: She quietly embraces the girl.
    ko: 마리안은 조용히, 소녀를 끌어안았다.
    ja: マリアンは少女を優しく抱き寄せた
  d_main_48_05_76:
    speaker: marian_q
    en: "... The idea of becoming the Queen is really weighing on you."
    ko: "…퀸이라는 존재가, 당신을 짓누르고 있군요."
    ja: "…重たいものを、背負っているんですね。"
  d_main_48_05_77:
    speaker: onlyone_c
    en: Yeah.
    ko: 응.
    ja: うん。
  d_main_48_05_78:
    speaker: marian_q
    en: You're just a child who loves to play around and be hugged.
    ko: 당신은 그냥 뛰어놀고 안기는 걸 좋아하는 아이일 뿐인데.
    ja: |-
      あなたは駆け回ったり、遊んだり、
      だっこされたりすることが
      好きなだけの子どもなのに。
  d_main_48_05_79:
    speaker: onlyone_c
    en: Yeah.
    ko: 응.
    ja: うん。
  d_main_48_05_80:
    speaker: marian_q
    en: And you're planning on giving that up for the ones you love.
    ko: 사랑하는 사람들을 위해, 그 모든 걸 포기하려 하는군요.
    ja: |-
      大事な人たちのために、
      全部あきらめるつもりなんて…
  d_main_48_05_81:
    speaker: onlyone_c
    en: Yeah.
    ko: 응.
    ja: うん。
  d_main_48_05_82:
    speaker: onlyone_c
    en: But it's okay.
    ko: 그래도 괜찮아.
    ja: でも、大丈夫。
  d_main_48_05_83:
    speaker: onlyone_c
    en: My sisters...
    ko: 언니들이
    ja: お姉ちゃんたちが…
  d_main_48_05_84:
    speaker: onlyone_c
    en: have shown me so much love.
    ko: 나 많이 사랑해줬거든.
    ja: わたしのこと、たくさん愛してくれたから。
  d_main_48_05_85:
    speaker: onlyone_c
    en: So it's okay. I can become the Queen for them.
    ko: |-
      그래서 괜찮아.
      언니들을 위해 퀸이 될 수 있어.
    ja: |-
      だから平気。
      お姉ちゃんたちのために、
      クイーンになる。
  d_main_48_05_86:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_87:
    speaker: "<Narration>"
    en: Marian embraces the girl even tighter.
    ko: 마리안이 소녀를 더욱 강하게 끌어안는다.
    ja: マリアンの抱きとめる力が強くなった
  d_main_48_05_88:
    speaker: "<Narration>"
    en: The girl closes her eyes and lets her body yield to the comforting warmth.
    ko: 소녀는 눈을 감고 그 기분 좋은 힘에 몸을 맡긴다.
    ja: 少女は目を閉じ、優しい力に身を任せた
  d_main_48_05_89:
    speaker: onlyone_c
    en: You're a good person too.
    ko: 언니도 좋은 사람.
    ja: お姉ちゃんも、いい人。
  d_main_48_05_90:
    speaker: onlyone_c
    en: Everyone is good.
    ko: 다 좋은 사람.
    ja: みんないい人。
  d_main_48_05_91:
    speaker: onlyone_c
    en: "... But they are weak."
    ko: "…하지만 약한 사람."
    ja: "…だけど、弱い人。"
  d_main_48_05_92:
    speaker: onlyone_c
    en: That's why I have to become the Queen.
    ko: 그래서 나는 퀸이 되어야 해.
    ja: だから、わたしがクイーンにならないと。
  d_main_48_05_93:
    speaker: "<Narration>"
    en: Marian feels a heartbeat.
    ko: 두근.
    ja: 鼓動が聞こえる
  d_main_48_05_94:
    speaker: "<Narration>"
    en: Two heartbeats.
    ko: 두개의 고동.
    ja: 2つの脈動
  d_main_48_05_95:
    speaker: "<Narration>"
    en: Two comforting scents.
    ko: 편안해지는 냄새.
    ja: 心の落ち着く香り
  d_main_48_05_96:
    speaker: "<Narration>"
    en: Both are familiar, and a wave of nostalgia rushes over her.
    ko: 마리안은 소녀에게서 익숙하면서도 그리운 두개의 고동과 냄새를 느낀다.
    ja: |-
      マリアンは少女から感じるそれが
      覚えのある懐かしいものだと思った
  d_main_48_05_97:
    speaker: marian_q
    en: "... Oh."
    ko: "…아."
    ja: "…あ…"
  d_main_48_05_98:
    speaker: marian_q
    en: I know this feeling...
    ko: 이 느낌은….
    ja: この感じ…
  d_main_48_05_99:
    speaker: marian_q
    en: "... Rapi."
    ko: "…라피."
    ja: "…ラピ。"
  d_main_48_05_100:
    speaker: marian_q
    en: And... the Commander?
    ko: 그리고 지휘관…?
    ja: それに指揮官も…？
  d_main_48_05_101:
    speaker: onlyone_c
    en: Yeah. Mommy and Daddy.
    ko: 응. 아빠랑 엄마.
    ja: うん。パパとママ。
  d_main_48_05_102:
    speaker: marian_q
    en: "... What?"
    ko: "…예?"
    ja: "…え？"
  d_main_48_05_103:
    speaker: onlyone_c
    en: They're my mommy and daddy.
    ko: 아빠랑 엄마야.
    ja: パパとママだよ。
  d_main_48_05_104:
    speaker: marian_q
    en: Is that... so?
    ko: 그렇… 군요?
    ja: そう…だったんですか？
  d_main_48_05_105:
    speaker: "<Narration>"
    en: Marian closes her eyes.
    ko: 마리안은 눈을 감는다.
    ja: マリアンが目を閉じた
  d_main_48_05_106:
    speaker: "<Narration>"
    en: She surrenders herself to the nostalgia,
    ko: 그리운 그 감각에 온 몸을 맡긴다.
    ja: 湧き上がる気持ちに身をゆだねた
  d_main_48_05_107:
    speaker: "<Narration>"
    en: to that warm and deeply familiar feeling.
    ko: 따스하고 그리운 감각.
    ja: 温かく、懐かしい感覚
  d_main_48_05_108:
    speaker: onlyone_c
    en: Hug me tighter.
    ko: 더 쎄게 안아줘.
    ja: もっと強く、ぎゅってして。
  d_main_48_05_109:
    speaker: onlyone_c
    en: Daddy must really like you.
    ko: 아빠가 언니 많이 좋아하나 봐.
    ja: パパはお姉ちゃんのこと、大好きみたい。
  d_main_48_05_110:
    speaker: "<Narration>"
    en: Marian embraces the girl even tighter.
    ko: 마리안은 더욱 강하게 소녀를 끌어안는다.
    ja: マリアンはさらに強く少女を抱き寄せた
  d_main_48_05_111:
    speaker: "<Narration>"
    en: She feels her mind going blank,
    ko: 마리안은 머리가 멍해지는 느낌을 받는다.
    ja: 意識がおぼろげになる
  d_main_48_05_112:
    speaker: "<Narration>"
    en: as if everything is melting away.
    ko: 모든 것이 녹아드는 것 같은 기분을 느낀다.
    ja: 何もかもが溶けていくような気がした
  d_main_48_05_113:
    speaker: "<Narration>"
    en: She casts everything she is into that feeling.
    ko: 마리안은 그 감각 안으로, 모든 것을 내던졌다.
    ja: マリアンの意識も、その中に溶けていく
  d_main_48_05_114:
    speaker: onlyone_c
    en: Your head is glowing.
    ko: 언니. 머리가 빛나.
    ja: お姉ちゃん。頭、光ってる。
  d_main_48_05_115:
    speaker: "<Narration>"
    en: Marian's bandages begin to glow.
    ko: 마리안의 붕대가 빛나기 시작한다.
    ja: マリアンの包帯が輝いていた
  d_main_48_05_116:
    speaker: "<Narration>"
    en: And then..
    ko: 그리고
    ja: そして…
  d_main_48_05_117:
    speaker: marian_p
    en: No. I don't want to listen.
    ko: |-
      시, 싫어요.
      안 들을래요.
    ja: |-
      い、嫌です。
      聞きたくないです。
  d_main_48_05_118:
    speaker: marian_p
    en: No! I don't want to. I don't want that.
    ko: |-
      안 할래요.
      나 그거 안 할래요.
    ja: |-
      嫌です。
      地上に行きたくありません。
  d_main_48_05_119:
    speaker: marian_p
    en: I want to be with the Commander.
    ko: 지휘관이랑 같이 있을 거예요.
    ja: 指揮官と一緒にいます。
  d_main_48_05_120:
    speaker: marian_p
    en: So don't... please don't leave me.
    ko: |-
      그러니까 버리지 마세요….
      제발 버리지 마세요….
    ja: |-
      だから捨てないでください…
      お願いします…
  d_main_48_05_121:
    speaker: marian_p
    en: I want to be together with you.
    ko: 저는 같이 있고 싶단 말이에요.
    ja: 私は一緒にいたいです。
  d_main_48_05_122:
    speaker: modenia
    en: "... Are you going to shoot me?"
    ko: |-
      …쏘실 건가요?
      저를?
    ja: |-
      …撃つのですか？
      私を？
  d_main_48_05_123:
    speaker: modenia
    en: Haha. I know you, Commander. You can't shoot me.
    ko: |-
      후후. 저는 지휘관을 잘 알아요.
      지휘관은 저를 쏘지 못해요.
    ja: |-
      ふふ、私は指揮官を知っています。
      指揮官は私を撃てません。
  d_main_48_05_124:
    speaker: modenia
    en: You couldn't shoot me then, and you can't shoot me now.
    ko: 그때도 쏘지 못하셨잖아요.
    ja: あの時も撃てなかったじゃありませんか。
  d_main_48_05_125:
    speaker: modenia
    en: You're a warm person. A kind person.
    ko: |-
      따뜻한 사람이니까.
      상냥한 사람이니까.
    ja: |-
      温かい人だから。
      優しい人だから。
  d_main_48_05_126:
    speaker: marian
    en: Over... here.
    ko: 여기… 예요.
    ja: ここ…です。
  d_main_48_05_127:
    speaker: marian
    en: Comman...der!
    ko: 지휘… 관.
    ja: 指揮…官。
  d_main_48_05_128:
    speaker: marian
    en: Thank you... for your... bandage.
    ko: 붕대… 고마웠어… 요….
    ja: 包帯…嬉しかった…です…
  d_main_48_05_129:
    speaker: marian
    en: Please don't worry.
    ko: 걱정 마세요.
    ja: 心配なさらないでください。
  d_main_48_05_130:
    speaker: marian
    en: I will protect you.
    ko: 저는 당신을 지키니까요.
    ja: 私があなたをお守りします。
  d_main_48_05_131:
    speaker: marian
    en: Commander, I could use another bandage here as well.
    ko: |-
      지휘관.
      이쪽에도 붕대를 감아주세요.
    ja: |-
      指揮官。
      ここにも包帯を巻いてください。
  d_main_48_05_132:
    speaker: marian
    en: BA-01 down! BA-01 down!
    ko: |-
      BA-01다운!
      BA-01다운!
    ja: |-
      BA-01ダウン！
      BA-01ダウン！
  d_main_48_05_133:
    speaker: marian
    en: Please respond! We've been shot down!
    ko: |-
      응답해 주세요!
      추, 추락했다고요!
    ja: |-
      答えてください！
      つ、墜落しました！
  d_main_48_05_134:
    speaker: girl
    en: "... You want to be a Commander?"
    ko: 지휘관?
    ja: 指揮官？
  d_main_48_05_135:
    speaker: girl
    en: Why would you wanna be something like that?
    ko: 그런 걸 왜 하려고 해?
    ja: なんでそんな仕事がしたいの？
  d_main_48_05_136:
    speaker: girl
    en: I heard they don't make much money, and it's really dangerous.
    ko: 박봉에, 위험하기만 하다고 그랬는데.
    ja: 安月給だし、とっても危ないって聞いたけど。
  d_main_48_05_137:
    speaker: girl
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_138:
    speaker: girl
    en: Well, I'll root for you anyway. And your dream.
    ko: 그래도 응원할게. 그 꿈.
    ja: でも応援するね、その夢。
  d_main_48_05_139:
    speaker: girl
    en: If...
    ko: 혹시.
    ja: あの…
  d_main_48_05_140:
    speaker: girl
    en: And this is a big if...
    ko: 혹시 말이야.
    ja: もしかしたらね。
  d_main_48_05_141:
    speaker: girl
    en: If I ever become a Nikke...
    ko: 내가 니케가 된다면.
    ja: 私がニケになったら、
  d_main_48_05_142:
    speaker: girl
    en: I hope you'll be my Commander.
    ko: 네가 내 지휘관이 되면 좋겠네.
    ja: あなたが私の指揮官になってほしいな。
  d_main_48_05_143:
    speaker: girl
    en: What's your name?
    ko: 넌 이름이 뭐야?
    ja: あなたの名前は何？
  d_main_48_05_144:
    speaker: girl
    en: "@UserName? Haha, that's a weird name."
    ko: |-
      @UserName?
      하하. 이상한 이름이네.
    ja: |-
      @UserName？
      あは、変な名前。
  d_main_48_05_145:
    speaker: girl
    en: Oh, I haven't even introduced myself.
    ko: |-
      아.
      내 소개를 안 했구나.
    ja: |-
      あぁ。
      自己紹介がまだだったね。
  d_main_48_05_146:
    speaker: girl
    en: You can call me...
    ko: 내 이름은….
    ja: 私の名前は…
  d_main_48_05_147:
    speaker: onlyone_c
    en: Hey...
    ko: "…언니."
    ja: お姉ちゃん…
  d_main_48_05_148:
    speaker: onlyone_c
    en: Are you crying?
    ko: 울어?
    ja: 泣いてる？
  d_main_48_05_149:
    speaker: marian_q
    en: Oh...
    ko: 아….
    ja: あ…
  d_main_48_05_150:
    speaker: marian_q
    en: Ohhh...
    ko: 아아아아….
    ja: ああ…ああ…
  d_main_48_05_151:
    speaker: "<Monologue>"
    en: That's right...
    ko: 그래. 나는.
    ja: そうだった。私は…
  d_main_48_05_152:
    speaker: "<Monologue>"
    en: I wanted to create a world where he wouldn't die.
    ko: 그 사람이 죽지 않는 세계를 만들기 위해.
    ja: あの人が死ぬことのない世界を作るために
  d_main_48_05_153:
    speaker: "<Monologue>"
    en: A world where he could live happily.
    ko: 그 사람이 행복하게 살아갈 수 있는 세계를 만들기 위해.
    ja: あの人が幸せに生きていける世界を作るために
  d_main_48_05_154:
    speaker: "<Monologue>"
    en: A world where he could smile.
    ko: 그 사람이 웃을 수 있는 세계를 만들기 위해.
    ja: あの人が笑顔でいられる世界を作るために
  d_main_48_05_155:
    speaker: "<Monologue>"
    en: It's been so long...
    ko: 그 긴 시간을-
    ja: 長い時間を…
  d_main_48_05_156:
    speaker: "<Monologue>"
    en: A seemingly never-ending loop...
    ko: 영원할 것만 같았던 굴레를-
    ja: 永遠に続くと思っていた束縛を…
  d_main_48_05_157:
    speaker: "<Monologue>"
    en: That's why...
    ko: 그렇기에 나는.
    ja: だから、私は…
  d_main_48_05_158:
    speaker: "<Monologue>"
    en: I wanted to create a world where everyone can love one another.
    ko: 모두가 모두를 사랑할 수 있는 세계를.
    ja: みんなが、お互いに愛することができる世界を
  d_main_48_05_159:
    speaker: "<Monologue>"
    en: A world where no one gets hurt, and no one hurts others.
    ko: 그 누구도 상처받지 않고, 상처주지 않는 세계를.
    ja: 誰も傷つかず、傷つけない世界を
  d_main_48_05_160:
    speaker: "<Monologue>"
    en: A world filled with love.
    ko: 사랑으로 가득한 세계를.
    ja: 愛でいっぱいの世界を
  d_main_48_05_161:
    speaker: "<Monologue>"
    en: That was what I wanted to create.
    ko: 만들고 싶었다.
    ja: 作りたかった
  d_main_48_05_162:
    speaker: marian_q
    en: I have a favor to ask.
    ko: 부탁이 있어요.
    ja: お願いがあります。
  d_main_48_05_163:
    speaker: onlyone_c
    en: What is it?
    ko: 뭔데?
    ja: どんな？
  d_main_48_05_164:
    speaker: marian_q
    en: Give me your Queen Gene.
    ko: 나에게 당신의 인자를 줘요.
    ja: あなたの因子、私に譲ってください。
  d_main_48_05_165:
    speaker: onlyone_c
    en: "... You want it?"
    ko: "…언니한테?"
    ja: "…お姉ちゃんに？"
  d_main_48_05_166:
    speaker: marian_q
    en: Yeah.
    ko: 예.
    ja: ええ。
  d_main_48_05_167:
    speaker: onlyone_c
    en: No. You're too weak.
    ko: 안 돼. 언니는 약한걸.
    ja: ダメ。お姉ちゃん、弱いもん。
  d_main_48_05_168:
    speaker: marian_q
    en: I was.
    ko: 저는 약해요.
    ja: 確かにそうでした。
  d_main_48_05_169:
    speaker: marian_q
    en: But not anymore.
    ko: 하지만 이젠 아니에요.
    ja: でも、もう違います。
  d_main_48_05_170:
    speaker: marian_q
    en: Now I know what I have to...
    ko: 제가 해야 할 일.
    ja: 私がするべきこと…
  d_main_48_05_171:
    speaker: marian_q
    en: No, not "have to." Now I know what I want to do.
    ko: 아니, 하고 싶은 일이 무엇인지 알았어요.
    ja: |-
      いいえ、やりたいことが
      何だったのか分かりました。
  d_main_48_05_172:
    speaker: marian_q
    en: More clearly than I ever have.
    ko: 예. 이제 완전히 알아요.
    ja: ええ…今ならよく分かります。
  d_main_48_05_173:
    speaker: marian_q
    en: So I'm not weak anymore.
    ko: 그러니까 저는 이제 약하지 않아요.
    ja: だから、私はもう弱くありません。
  d_main_48_05_174:
    speaker: marian_q
    en: I can win.
    ko: 저는 이길 수 있어요.
    ja: 私は勝てます。
  d_main_48_05_175:
    speaker: "<Narration>"
    en: The girl gently pushes Marian away and takes a step back.
    ko: 소녀가 마리안을 살짝 밀어내고 뒷걸음친다.
    ja: 少女はマリアンを押し出し、後ろにさがった
  d_main_48_05_176:
    speaker: "<Narration>"
    en: She looks at Marian, who is gazing back at her.
    ko: 자신을 바라보고 있는 마리안을 바라본다.
    ja: 見つめるマリアンの顔を見返している
  d_main_48_05_177:
    speaker: "<Narration>"
    en: She fidgets with her fingers.
    ko: 손가락을 꼼지락댄다.
    ja: 両指をもじもじと絡ませた
  d_main_48_05_178:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_05_179:
    speaker: onlyone_c
    en: Can I really give it to you?
    ko: 정말 그래도 돼?
    ja: ほんとに、いいの？
  d_main_48_05_180:
    speaker: marian_q
    en: Yeah.
    ko: 예.
    ja: はい。
  d_main_48_05_181:
    speaker: "<Narration>"
    en: The girl fidgets with her fingers more,
    ko: 소녀가 손가락을 더욱 꼼지락댄다.
    ja: からんだ指の動きが早くなる
  d_main_48_05_182:
    speaker: "<Narration>"
    en: then shakes her head firmly.
    ko: 그리고 이내, 고개를 강하게 가로젓는다.
    ja: そして、頭を強く横に振った
  d_main_48_05_183:
    speaker: onlyone_c
    en: Everyone's so weak.
    ko: 언니들은 약해.
    ja: お姉ちゃんたち、弱い。
  d_main_48_05_184:
    speaker: onlyone_c
    en: They can't even beat that thing's minions.
    ko: 그것의 부하조차 이기지 못 하는걸.
    ja: しもべにも、勝ててない。
  d_main_48_05_185:
    speaker: marian_q
    en: Listen to me.
    ko: 아뇨. 잘 봐요.
    ja: いいえ。見ていてください。
  d_main_48_05_186:
    speaker: marian_q
    en: They are never going to lose,
    ko: 저들은 절대 지지 않아요.
    ja: あの人たちは絶対に負けません。
  d_main_48_05_187:
    speaker: marian_q
    en: because they are the Goddesses of Victory.
    ko: 승리의 여신들이니까.
    ja: 勝利の女神たちですから。
d_main_48_06_s:
  d_main_48_06_s_1:
    speaker: "<Monologue>"
    en: The assault from the transformed Liberalio continues,
    ko: 거대화한 리버렐리오의 공격이 계속 이어진다.
    ja: 巨大化したリバーレリオの攻勢が続く
  d_main_48_06_s_2:
    speaker: "<Monologue>"
    en: overwhelming us with its staggering firepower.
    ko: 압도적인 스펙과, 끝없는 출력으로 압박해온다.
    ja: |-
      圧倒的な性能と底知れぬ出力で
      一方的にけん制されている
  d_main_48_06_s_3:
    speaker: "<Monologue>"
    en: But...
    ko: 하지만….
    ja: だが…
  d_main_48_06_s_4:
    speaker: rapi_red
    en: Commander!
    ko: 지휘관!
    ja: 指揮官！
  d_main_48_06_s_5:
    speaker: "<Self>"
    en: I know! Its pattern is simple! It just keeps using the same attacks!
    ko: 응! 패턴이 단순해! 그냥 쏟아내기만 할 뿐이야!
    ja: |-
      ああ！パターンは単純だ！
      ひたすら撃ってくるだけだな！
  d_main_48_06_s_6:
    speaker: "<Self>"
    en: We can think of it as just a Tyrant, but a little stronger!
    ko: 그냥 좀 쎈 타일런트 급 정도라고 생각하자!
    ja: 少し強いタイラント級程度だと考えよう！
  d_main_48_06_s_7:
    speaker: anis_i_w
    en: Since when did they become "just" Tyrants?!
    ko: 언제부터 타일런트 급을 정도라고 부를 수 있었던 건데!
    ja: |-
      タイラント級程度なんて…
      いつからそんな大物になったのよ！
  d_main_48_06_s_8:
    speaker: neon_v_w
    en: Ever since the three of us teamed up!
    ko: 우리 셋이 모였을 때부터죠!
    ja: 私たち3人がそろった時からです！
  d_main_48_06_s_9:
    speaker: anis_i_w
    en: Aw, that's actually touching! I like that!
    ko: 감동적인 말이네! 좋다!
    ja: 感動的じゃない！気に入ったわ！
  d_main_48_06_s_10:
    speaker: rapi_red
    en: Let's go, everyone!
    ko: 다들 가자!
    ja: みんな、ここからよ！
  d_main_48_06_s_11:
    speaker: snowwhite_h
    en: Its attack pattern is definitely simple. It doesn't seem to be thinking at
      all.
    ko: |-
      확실히 패턴이 단순하다.
      생각을 하고 움직이지 않는군.
    ja: |-
      確かに攻撃パターンは単純だ。
      思考能力があるか疑わしい。
  d_main_48_06_s_12:
    speaker: bahamut
    en: There's no easier enemy to fight than a stupid one.
    ko: 머리가 나쁜 적만큼 상대하기 쉬운 건 없는 법이지.
    ja: 頭の悪い敵の相手など、たやすいものだ。
  d_main_48_06_s_13:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_s_14:
    speaker: bahamut
    en: What? Why'd you go quiet all of a sudden?
    ko: 뭐지? 왜 갑자기 입을 다무는 거지?
    ja: なんだ？なぜ急に黙り込む？
  d_main_48_06_s_15:
    speaker: snowwhite_h
    en: Let's finish this quickly and then kill those two who are sneering behind
      us.
    ko: 얼른 치워버리고, 뒤에서 이죽대고 있는 둘을 죽이자.
    ja: |-
      早く片付けて、
      後ろで薄ら笑いをしている奴らも始末するぞ。
  d_main_48_06_s_16:
    speaker: "<Monologue>"
    en: Altruia and Egovista continue to watch our battle from afar.
    ko: 앨트루이아와 에고비스타는 여전히 멀찌감치 떨어져서 우리의 싸움을 지켜보고만 있다.
    ja: |-
      アルトルイアとエゴビスタは
      相変わらず遠巻きに、戦いを静観している
  d_main_48_06_s_17:
    speaker: "<Monologue>"
    en: I can't make out Altruia's facial expression,
    ko: "…앨트루이아의 표정을 읽을 순 없지만"
    ja: "…アルトルイアの表情は読みとれないが…"
  d_main_48_06_s_18:
    speaker: "<Monologue>"
    en: but Egovista is smiling.
    ko: 에고비스타는 웃고 있다.
    ja: エゴビスタは笑っていた
  d_main_48_06_s_19:
    speaker: "<Self>"
    en: Egovista gets on my nerves.
    ko: 기분 나쁘네 저 녀석.
    ja: 確かに気分が悪い
  d_main_48_06_s_20:
    speaker: ziz
    en: Y-yeah. She acts like she's way better than us.
    ko: 그, 그러게. 한참 아래로 보는 것 같아서 기분 나빠.
    ja: |-
      そ、そうだね。
      なんかバカにされてるみたいで、ムカつく。
  d_main_48_06_s_21:
    speaker: behemoth
    en: Look at her all smug, just standing over there watching.
    ko: 건방지게, 어딜 가만히 지켜보고만 있어?
    ja: ウゼェよな、なに遠くからジロジロ見てんだよ。
  d_main_48_06_s_22:
    speaker: bahamut
    en: Don't get distracted. What we're fighting may not have a brain, but it's still
      the transformed body of an Offspring.
    ko: |-
      그래도 조심하는 게 좋다.
      머리가 없다지만 직계의 바디가 거대화 한 것이니까.
    ja: |-
      油断はするな。
      頭脳がないとはいえ、巨大化した直系だ。
  d_main_48_06_s_23:
    speaker: leviathan
    en: Tch, the Offsprings are no match for us now!
    ko: 직계 따위, 이제 우리한텐 상대도 안된다고!
    ja: 直系なんか、もう私たちの敵じゃないでしょ！
  d_main_48_06_s_24:
    speaker: leviathan
    en: C'mon, no more holding back. Let's end this now!
    ko: 가자. 아낄 것 없이, 한 번에 끝내는 거야!
    ja: 行くよ。出し惜しみなし、一発で決める！
  d_main_48_06_s_25:
    speaker: bahamut
    en: Agreed.
    ko: 동의한다.
    ja: その通りだな。
  d_main_48_06_s_26:
    speaker: bahamut
    en: Four Beasts! Transform!
    ko: 포비스트! 거대화!
    ja: フォービースト！巨大化だ！
  d_main_48_06_s_27:
    speaker: ziz
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_s_28:
    speaker: behemoth
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_s_29:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_s_30:
    speaker: bahamut
    en: Huh? Why didn't anyone transform?
    ko: 뭐지? 거대화 하는 것 아니었나?
    ja: なんだ？巨大化する流れではなかったか？
  d_main_48_06_s_31:
    speaker: leviathan
    en: Why are you the one giving the signal? You can't even transform.
    ko: 너는 거대화도 못 하면서 뭘 신호를 주고 있어?
    ja: |-
      自分が出来ないのに、
      なんであんたが張り切ってんのよ？
  d_main_48_06_s_32:
    speaker: bahamut
    en: Because it'd look cool if everyone transformed as soon as I, the astute Bahamut,
      gave the command.
    ko: 똑똑한 바하무트의 명령에 맞춰 다같이 거대화 하면 멋있으니까.
    ja: |-
      賢いバハムートの号令に合わせて
      いっせいに巨大化したら
      カッコいいだろう。
  d_main_48_06_s_33:
    speaker: bahamut
    en: It'd make me look like a leader.
    ko: 그리고 똑똑한 바하무트가 리더처럼 보이기도 하니까.
    ja: |-
      それに、賢いバハムートが
      リーダーっぽく見える。
  d_main_48_06_s_34:
    speaker: leviathan
    en: "*Sigh...*"
    ko: "…에휴."
    ja: "…はぁ…"
  d_main_48_06_s_35:
    speaker: leviathan
    en: Fine. Give the signal again.
    ko: 그래. 다시 신호 줘.
    ja: そうね。じゃ、もう一回やって。
  d_main_48_06_s_36:
    speaker: bahamut
    en: Much appreciated, Levi.
    ko: 감사를 표한다. 레비.
    ja: 話が分かるな、レヴィ。
  d_main_48_06_s_37:
    speaker: bahamut
    en: Four Beasts! Transform!
    ko: 포비스트! 거대화!
    ja: フォービースト！巨大化だ！
  d_main_48_06_s_38:
    speaker: behemoth
    en: Transform!
    ko: 거~대~화~!
    ja: 巨大化ぁ～ッ！
  d_main_48_06_s_39:
    speaker: ziz
    en: Transfooorm!
    ko: 거, 거대화아….
    ja: えーと、巨大化ぁ…
  d_main_48_06_s_40:
    speaker: leviathan
    en: Would you all stop shouting? It's embarrassing.
    ko: "…그런거 하지 마. 창피하니까 좀."
    ja: "…そういうのやめて。恥ずかしいから。"
  d_main_48_06_s_41:
    speaker: "<Monologue>"
    en: A dark light bursts forth as they transform.
    ko: 검은 빛이 뿜어져 나온다.
    ja: 黒い光があたりに広がる
  d_main_48_06_s_42:
    speaker: snowwhite_h
    en: We're up next!
    ko: 우리도 간다!
    ja: 続くぞ！
  d_main_48_06_s_43:
    speaker: rapi_red
    en: My fellow Seven Dwarves sister! Let's go!
    ko: 세븐스 드워프 자매! 출격이야!
    ja: セブンスドワーフ・シスターズ！行こう！
  d_main_48_06_s_44:
    speaker: snowwhite_h
    en: "...! Excellent!"
    ko: "!! 좋다!"
    ja: "！！ああ！"
  d_main_48_06_s_45:
    speaker: anis_i_w
    en: "... Should we shout something too?"
    ko: "…우리도 뭐 하나 할까?"
    ja: "…私たちも何かやる？"
  d_main_48_06_s_46:
    speaker: neon_v_w
    en: How about... "Neo-Star!"?
    ko: 네오-스타 어때요?
    ja: ネオ・スターなんてどうでしょう？
  d_main_48_06_s_47:
    speaker: anis_i_w
    en: Nah. Let's just go.
    ko: 됐다. 그냥 가자 우린.
    ja: やっぱいい。いつも通り行きましょ、私たちは。
  d_main_48_06_s_48:
    speaker: neon_v_w
    en: Okay.
    ko: 넹.
    ja: はぁ～い…
d_main_48_06_e:
  d_main_48_06_e_1:
    speaker: rapi_red
    en: Target down!
    ko: 격추 확인!
    ja: 目標撃墜！
  d_main_48_06_e_2:
    speaker: leviathan
    en: Rip out the core! It's the only way to stop it from regenerating!
    ko: 코어를 뜯어! 그래야 재생이 멈춰!
    ja: |-
      コアを奪って！
      そうすれば再生が止まるから！
  d_main_48_06_e_3:
    speaker: rapi_red
    en: Behemoth! Grab on!
    ko: 베히모스! 잡아!
    ja: ベヒモス！つかまって！
  d_main_48_06_e_4:
    speaker: behemoth
    en: Time to fly!
    ko: 날아가보자고!
    ja: 今、飛ぶぞ！
  d_main_48_06_e_5:
    speaker: "<Narration>"
    en: "*Vrrrrrr!*"
    ko: 키이이이잉--
    ja: キュィィィン――
  d_main_48_06_e_6:
    speaker: "<Monologue>"
    en: Rapi deploys Seven Dwarves Zero and soars into the sky while carrying Behemoth.
    ko: 라피가 세븐스 드워프 제로를 전개, 베히모스를 잡은 채 공중으로 치솟는다.
    ja: |-
      ラピがセブンスドワーフゼロを展開し、
      ベヒモスをつかんで空に上がった
  d_main_48_06_e_7:
    speaker: "<Monologue>"
    en: They fly up to until they are in front of Liberalio's body's falling core,
      where she deploys her drill.
    ko: 추락하고 있는 리버렐리오 바디의 코어 정면까지 상승한 후, 드릴을 전개한다.
    ja: |-
      高度を落とすリバーレリオの胴体に向かって
      コアの正面まで上昇し、ドリルをうならせる
  d_main_48_06_e_8:
    speaker: rapi_red
    en: I'll use the drill to grind down the area around the core, then you rip it
      out with your claws!
    ko: |-
      드릴로 코어 부근을 갈아낼 테니,
      집게로 뜯어버려!
    ja: |-
      コアの近くまで削る！
      アームで引きちぎって！
  d_main_48_06_e_9:
    speaker: behemoth
    en: Okay! Leave it to me!
    ko: 오케이! 맡겨줘!
    ja: オッケー！任せろ！
  d_main_48_06_e_10:
    speaker: rapi_red
    en: Pierce through it!
    ko: 꿰뚫어라-!!
    ja: 貫け！！
  d_main_48_06_e_11:
    speaker: "<Narration>"
    en: "*Booom!*"
    ko: 콰아아아앙---!!
    ja: ドカン！！
  d_main_48_06_e_12:
    speaker: "<Monologue>"
    en: A massive beam of light flashes past Rapi and Behemoth as they charge forward.
    ko: 돌진 중인 라피와 베히모스의 옆을 거대한 빛줄기가 지나간다.
    ja: |-
      突撃するラピとベヒモスのすぐ横を、
      巨大な光線が通り過ぎた
  d_main_48_06_e_13:
    speaker: "<Monologue>"
    en: And pierces right through the core of Liberalio's body and the surrounding
      parts.
    ko: 백색의 빛은, 정확히 리버렐리오 바디의 코어와 인근의 파츠까지 꿰뚫는다.
    ja: 白い光は周囲のパーツごとコアを貫通した
  d_main_48_06_e_14:
    speaker: "<Monologue>"
    en: Liberalio's body begins to crumble and vanish.
    ko: 리버렐리오 바디가 바스러지며 사라지기 시작한다.
    ja: リバーレリオのボディが崩壊を始めた
  d_main_48_06_e_15:
    speaker: snowwhite_h
    en: Pierced right through it.
    ko: 꿰뚫었다.
    ja: 貫いたぞ。
  d_main_48_06_e_16:
    speaker: rapi_red
    en: I wasn't talking to you. I was talking to Seven Dwarves.
    ko: |-
      너한테 한 말이 아니야.
      세븐스 드워프한테 한 말이라고.
    ja: |-
      あなたに言ったのではなくて、
      セブンスドワーフに呼びかけたの。
  d_main_48_06_e_17:
    speaker: snowwhite_h
    en: I use Seven Dwarves too.
    ko: 나도 세븐스 드워프를 쓴다.
    ja: これもセブンスドワーフだ。
  d_main_48_06_e_18:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_19:
    speaker: "<Monologue>"
    en: Rapi and Behemoth land on the ground.
    ko: 라피와 베히모스가 바닥에 착지한다.
    ja: ラピとベヒモスが地面に降りた
  d_main_48_06_e_20:
    speaker: "<Monologue>"
    en: Everyone takes a step forward.
    ko: 모두가 앞으로 한걸음 내딛는다.
    ja: 全員が前に一歩躍り出た
  d_main_48_06_e_21:
    speaker: "<Monologue>"
    en: They gaze at Altruia and Egovista.
    ko: 앨트루이아와 에고비스타를 바라본다.
    ja: |-
      その目はアルトルイアとエゴビスタに
      向けられている
  d_main_48_06_e_22:
    speaker: altruia
    en: Magnificent.
    ko: 훌륭하옵니다.
    ja: 素晴らしいですね。
  d_main_48_06_e_23:
    speaker: altruia
    en: They defeated the one once hailed as the strongest, mindless though it may
      have been...
    ko: |-
      비록 사고를 못 한다고는 하나,
      한 때 최강이라 칭해졌던 이를 쓰러뜨리다니.
    ja: |-
      頭がないとはいえ、
      かつて最強とまで言われた存在を
      こうも簡単に下せるなんて。
  d_main_48_06_e_24:
    speaker: altruia
    en: I can feel myself being moved to tears.
    ko: 감격하여, 눈물이 다 흐르옵니다.
    ja: 感動して、涙が出てしまいそうです。
  d_main_48_06_e_25:
    speaker: egovista
    en: "'Tis our cue to fight."
    ko: 그럼, 이제는 본인들의 차례로군.
    ja: やっと我らの出番というわけか。
  d_main_48_06_e_26:
    speaker: egovista
    en: I had thought to reserve my strength...
    ko: 가능하면 힘을 온전하고 싶었네만….
    ja: ここが力の入れどころではないのだろうが…
  d_main_48_06_e_27:
    speaker: egovista
    en: Though, I grant little could be expected of the aged Sea Nettle.
    ko: 뭐, 해월이 낡은 탓에 큰 기대를 할 수 없었던 것도 사실.
    ja: |-
      古い海月だ。
      もともと期待など、さほどしておらぬ。
  d_main_48_06_e_28:
    speaker: egovista
    en: In the end, the weightiest matters are best dispatched by one's own hand.
    ko: 결국 가장 중요한 일은 본인이 직접 해야 하는 법이지.
    ja: 結局、肝心なことには己の手を使わぬとなぁ。
  d_main_48_06_e_29:
    speaker: snowwhite_h
    en: Where's the Queen?
    ko: 퀸은 어딨나.
    ja: クイーンはどこだ。
  d_main_48_06_e_30:
    speaker: altruia
    en: You needn't concern yourself with the safety of our great mother.
    ko: 당신이 위대하신 어머니의 안위를 신경쓸 필요는 없사옵니다.
    ja: 気にしていただく必要はございません。
  d_main_48_06_e_31:
    speaker: altruia
    en: The only thing within your power is to choose how you perish here.
    ko: 그저 이곳에서 바스러지는 것만이, 당신들이 할 수 있는 일이옵니다.
    ja: |-
      あなたたちにできることは、
      この場で滅びることだけですから。
  d_main_48_06_e_32:
    speaker: snowwhite_h
    en: Is she hiding in the Lift?
    ko: 궤도 엘리베이터에 숨었나?
    ja: 軌道エレベーターに逃げたか？
  d_main_48_06_e_33:
    speaker: altruia
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_48_06_e_34:
    speaker: altruia
    en: Mother neither flees nor hides!
    ko: 어머니는! 도망치지도 숨지도 않사옵니다!
    ja: お母様は逃げも隠れもなさいません！
  d_main_48_06_e_35:
    speaker: snowwhite_h
    en: Your mother is a spineless coward.
    ko: 니 엄마는 비겁한 겁쟁이다.
    ja: あれは卑怯な臆病者だ。
  d_main_48_06_e_36:
    speaker: snowwhite_h
    en: She couldn't win on her own, so she stole Liliweiss's body.
    ko: 본인으로서는 이길 방법이 없어서, 언니의 몸을 훔쳤다.
    ja: |-
      自分の力では勝てないからと、
      他人のボディを奪った。
  d_main_48_06_e_37:
    speaker: snowwhite_h
    en: Now that I hear it out loud, she's basically a common thief.
    ko: 이런, 말하고 나니 도둑놈이 따로 없군.
    ja: ずいぶん手くせの悪い泥棒だ。
  d_main_48_06_e_38:
    speaker: altruia
    en: "!"
    ko: "---!!"
    ja: "――！！"
  d_main_48_06_e_39:
    speaker: egovista
    en: Hold thy tongue. I'll hear no more.
    ko: 거기까지하게. 못 들어주겠으니.
    ja: そこまでだ。聞いておられぬ。
  d_main_48_06_e_40:
    speaker: egovista
    en: I had thought only to watch, in pity, thine attempt to prolong thy time.
    ko: 체력을 회복하려고 시간을 끄는 꼴이 안쓰러워 그냥 지켜보려 했건만.
    ja: |-
      身体を休ませる時間が欲しかろうと思って、
      情けで付き合ってやっていたが…
  d_main_48_06_e_41:
    speaker: egovista
    en: But I cannot abide such slander of our mother.
    ko: 어머니를 욕하는 것은 참을 수 없네.
    ja: お母様への侮辱は許せぬな。
  d_main_48_06_e_42:
    speaker: egovista
    en: In what manner wouldst thou have me cleave thy pate? Vertically? Horizontally?
      Perhaps diagonally?
    ko: |-
      그대. 머리를 어떻게 쪼개주길 원하나.
      세로? 가로? 아니면 대각선?
    ja: |-
      貴様、どう頭を割られたい？
      縦か？横か？それとも、斜めか？
  d_main_48_06_e_43:
    speaker: snowwhite_h
    en: Why don't you ask your mommy?
    ko: 네 엄마한테나 물어봐라.
    ja: 貴様の母に聞くんだな。
  d_main_48_06_e_44:
    speaker: egovista
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_48_06_e_45:
    speaker: "<Monologue>"
    en: Altruia and Egovista charge forward, their faces contorted in rage.
    ko: 앨트루이아와 에고비스타가 노기서린 얼굴로 달려든다.
    ja: |-
      アルトルイアとエゴビスタが
      怒りに狂った顔で突進してきた
  d_main_48_06_e_46:
    speaker: anis_i_w
    en: What're you trying to do by provoking them? We're all exhausted.
    ko: |-
      아니, 도발을 해서 뭘 어쩌자고.
      우리 지금 힘들어 죽겠는데.
    ja: |-
      ちょっと、挑発してどうするのよ。
      ただでさえキツいのに…
  d_main_48_06_e_47:
    speaker: snowwhite_h
    en: They're the ones stalling for time. They clearly have some sort of plan.
    ko: |-
      시간을 끄는 건 오히려 저쪽이다.
      뭔가 꿍꿍이가 있는 게 분명해.
    ja: |-
      時間を稼いでいるのは向こうだ。
      裏で何か企んでいるのだろう。
  d_main_48_06_e_48:
    speaker: rapi_red
    en: Still, you should find other ways to provoke someone moving forward.
    ko: 그래도 앞으로 그런 심한 말은 자제하는 게 좋겠어.
    ja: |-
      どちらにしても、刺激するような
      言い方をするのは、控えた方がいいわ。
  d_main_48_06_e_49:
    speaker: behemoth
    en: Levi. Ziz. Are you okay?
    ko: "…레비. 지즈. 괜찮아?"
    ja: "…レヴィ、ジズ。大丈夫か？"
  d_main_48_06_e_50:
    speaker: leviathan
    en: "... I'm all right."
    ko: "…문제없어."
    ja: "…平気。"
  d_main_48_06_e_51:
    speaker: ziz
    en: M-me too. I think.
    ko: 으, 응. 아마도.
    ja: う、うん。たぶんね。
  d_main_48_06_e_52:
    speaker: bahamut
    en: I, the wise Bahamut, am perfectly fine. Because I did not fight.
    ko: 똑똑한 바하무트는 멀쩡하다. 싸우지 않았으니까.
    ja: |-
      賢いバハムートも無事だ。
      そもそも戦っていないからな。
  d_main_48_06_e_53:
    speaker: leviathan
    en: You know, the new Heretics the Queen made...
    ko: "…퀸이 만들어낸 최신형의 헬레틱."
    ja: "…クイーンが作り出した最新のヘレティック…"
  d_main_48_06_e_54:
    speaker: leviathan
    en: are probably even bigger monsters than the Offsprings.
    ko: 아마 직계보다 더 괴물이겠지.
    ja: 直系よりもさらにケタ違いでしょうね…
  d_main_48_06_e_55:
    speaker: ziz
    en: A-are you scared?
    ko: 레, 레비 겁먹었어?
    ja: レ、レヴィ、もしかして怖いの？
  d_main_48_06_e_56:
    speaker: leviathan
    en: Who said I'm scared?!
    ko: 겁먹긴 누가!
    ja: 誰が怖がってるって！？
  d_main_48_06_e_57:
    speaker: "<Monologue>"
    en: The two Heretics draw increasingly closer.
    ko: 두 헬레틱이 점점 더 접근해온다.
    ja: 2体のヘレティックが遠方から迫る
  d_main_48_06_e_58:
    speaker: "<Monologue>"
    en: Altruia deploys a massive electromagnetic field and pushes it forward.
    ko: 앨트루이아가 거대한 전자기장을 전개하고, 그대로 밀어붙인다.
    ja: |-
      アルトルイアは
      巨大な電磁場を展開しながら距離を詰めてくる
  d_main_48_06_e_59:
    speaker: "<Monologue>"
    en: Egovista charges in as if ready to bring down her sword at any moment.
    ko: 에고비스타가 검을 당장에 내려칠 기세로 돌진한다.
    ja: エゴビスタは剣を上段に構え、突進してくる
  d_main_48_06_e_60:
    speaker: "<Self>"
    en: Counters and Snow White, you handle Altruia. You've fought her before, which
      should make her relatively easier to handle.
    ko: |-
      …앨트루이아는 카운터스와 스노우 화이트가 맡는다.
      전적이 있으니 상대적으로 할 만 할 거야.
    ja: |-
      …アルトルイアは戦闘経験のある
      カウンターズとスノーホワイトで相手する
  d_main_48_06_e_61:
    speaker: "<Self>"
    en: Four Beasts, you take Egovista. She's skilled in close-quarters combat, so
      Behemoth will have to bear the brunt of it.
    ko: |-
      포비스트는 에고비스타를 맡아줘.
      접근전에 능숙할 테니, 베히모스가 고생해줘야 할 거야.
    ja: |-
      フォービーストはエゴビスタを頼む。
      接近戦を仕掛けてくる、ベヒモスが鍵だ
  d_main_48_06_e_62:
    speaker: "<Monologue>"
    en: Everyone nods.
    ko: 모두가 고개를 끄덕인다.
    ja: 全員が頭を縦に振った
  d_main_48_06_e_63:
    speaker: "<Monologue>"
    en: The Heretics get even closer.
    ko: 거리가 더욱 가까워진다.
    ja: 両者の距離が縮む
  d_main_48_06_e_64:
    speaker: "<Monologue>"
    en: Soon, they will be within firing range.
    ko: 곧, 사거리 안이다.
    ja: 射程圏内が間近に迫った
  d_main_48_06_e_65:
    speaker: "<Self>"
    en: Everyone, g—
    ko: 다들! 가ㅈ
    ja: みんな、行くぞ――
  d_main_48_06_e_66:
    speaker: hongryeon_g
    en: Squander not thy vigor upon trifles.
    ko: 괜한 곳에 힘빼지 마시게.
    ja: 無駄なところで力を使わないでおくれ。
  d_main_48_06_e_67:
    speaker: rapunzel_s
    en: Leave this to us.
    ko: 여긴 맡겨주세요.
    ja: この場はお任せを。
  d_main_48_06_e_68:
    speaker: snowwhite_h
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_48_06_e_69:
    speaker: "<Monologue>"
    en: A shining golden barrier appears before us.
    ko: 우리의 앞에 빛나는 황금색 장벽이 나타난다.
    ja: 私たちの目の前に、黄金に輝く壁が広がった
  d_main_48_06_e_70:
    speaker: "<Monologue>"
    en: And at its center,
    ko: 그리고 그 중심.
    ja: その中心に…
  d_main_48_06_e_71:
    speaker: "<Monologue>"
    en: there stands a saint, shining brighter than everything else.
    ko: 그보다 더욱 밝게 빛나는 성녀가 서 있었다.
    ja: さらにまばゆく輝く聖女の姿が見えた
  d_main_48_06_e_72:
    speaker: rapunzel_s
    en: Sorry to keep you waiting. Everything will be okay now.
    ko: |-
      오래 기다리셨죠?
      이제 괜찮아요.
    ja: |-
      お待たせしてしまいましたか？
      もう大丈夫です。
  d_main_48_06_e_73:
    speaker: "<Monologue>"
    en: Then the swordswoman casually steps in front of us.
    ko: 그리고 느긋한 몸짓의 검사가 우리 앞을 막아선다.
    ja: |-
      もう一つの剣士の影が、
      ゆったりと私たちの前に出た
  d_main_48_06_e_74:
    speaker: hongryeon_g
    en: Take a moment's respite. I shall fell them in a single stroke.
    ko: |-
      잠시 쉬고들 있게.
      단숨에 베어 넘길 테니.
    ja: |-
      少し休んでいるといい。
      一太刀で終わらせる。
  d_main_48_06_e_75:
    speaker: snowwhite_h
    en: Scarlet...! Rapunzel...!
    ko: 홍련…! 라푼젤…!
    ja: 紅蓮…！ラプンツェル…！
  d_main_48_06_e_76:
    speaker: hongryeon_g
    en: Reserve thy tears till a later hour.
    ko: 아아. 눈물을 흘리는 건 나중으로 미룸세.
    ja: ああっと、涙は後にしておくれ。
  d_main_48_06_e_77:
    speaker: rapunzel_s
    en: We need to teach these impostors a lesson first.
    ko: 저 흉내쟁이 분들을 혼내주는 게 먼저니까요.
    ja: 今は私たちのニセモノを懲らしめるのが先です。
  d_main_48_06_e_78:
    speaker: "<Monologue>"
    en: Scarlet and Rapunzel gaze at the incoming Altruia and Egovista,
    ko: 홍련과 라푼젤이 돌진해오는 앨트루이아와 에고비스타를 바라본다.
    ja: |-
      突進するアルトルイアとエゴビスタを
      紅蓮とラプンツェルが見すえた
  d_main_48_06_e_79:
    speaker: "<Monologue>"
    en: then dash forward.
    ko: 그리고, 달려나간다.
    ja: 次の瞬間、二人は飛び出した
  d_main_48_06_e_80:
    speaker: altruia
    en: It is an honor to finally meet you, Rapunzel.
    ko: 만나 뵙게 되어 영광이옵니다. 라푼젤.
    ja: |-
      ここでお会いできるとは光栄です、
      ラプンツェル。
  d_main_48_06_e_81:
    speaker: rapunzel_s
    en: "... How vulgar."
    ko: "…그 모습."
    ja: "…その姿…"
  d_main_48_06_e_82:
    speaker: rapunzel_s
    en: Sister Noah's shields are not something the likes of you should imitate.
    ko: 노아 자매님의 방패는 당신 같은 것이 흉내내선 안됩니다.
    ja: |-
      ノアの盾は、あなたのような存在が
      騙ってよいものではありません。
  d_main_48_06_e_83:
    speaker: rapunzel_s
    en: I will destroy them.
    ko: 부숴드릴게요.
    ja: 打ち砕いて差し上げましょう。
  d_main_48_06_e_84:
    speaker: "<Monologue>"
    en: Light shoots out from the halo floating behind Rapunzel.
    ko: 라푼젤의 등 뒤에 떠있는 타륜이 빛을 뿜어낸다.
    ja: ラプンツェルの背後に浮かぶ輪が光を放った
  d_main_48_06_e_85:
    speaker: "<Monologue>"
    en: At the same time, Rapunzel charges forward.
    ko: 동시에 라푼젤이 돌진한다.
    ja: そのまま勢いよく距離を詰める
  d_main_48_06_e_86:
    speaker: "<Monologue>"
    en: Altruia and Rapunzel clash, both having deployed their barriers.
    ko: |-
      앨트루이아와 라푼젤은 서로의 장막을 전개한 채,
      서로에게 부딪혔다.
    ja: |-
      アルトルイアとラプンツェルが
      互いのバリアを展開したまま衝突した
  d_main_48_06_e_87:
    speaker: "<Narration>"
    en: The air is filled with the sound of battle.
    ko: 카가가가가가가---!!
    ja: ガガガガッ――！！
  d_main_48_06_e_88:
    speaker: "<Monologue>"
    en: Golden and green particles scatter about violently.
    ko: 황금색과 녹색의 입자가 거칠게 흩날린다.
    ja: 黄金と緑の粒子が激しく舞い散る
  d_main_48_06_e_89:
    speaker: "<Monologue>"
    en: What seemed like a close back-and-forth quickly tilts to one side.
    ko: 힘겨루기로 보이던 그 모습은, 빠르게 한쪽으로 기울었다.
    ja: |-
      互角の押し合いにも見えたその姿は、
      すぐに片方へ傾いた
  d_main_48_06_e_90:
    speaker: altruia
    en: "... I'm being overwhelmed...? Me?"
    ko: "…밀린다는 말이옵니까? 제가?"
    ja: "…押されている？このわたくしが？"
  d_main_48_06_e_91:
    speaker: rapunzel_s
    en: I told you. You are not worthy to bear those shields.
    ko: 말했죠? 당신은 그 방패를 짊어질 자격이 없다고.
    ja: |-
      言ったはずです。
      あなたにその盾を使う資格はありません。
  d_main_48_06_e_92:
    speaker: "<Narration>"
    en: Suddenly, there is a loud hum.
    ko: 우우우우웅--!!
    ja: ブウゥゥゥン――！
  d_main_48_06_e_93:
    speaker: "<Monologue>"
    en: The red components on part of Rapunzel's halo begin to glow.
    ko: 라푼젤의 타륜 일부에 위치한 붉은색의 파츠가 발광한다.
    ja: ラプンツェルの輪の赤いパーツが光った
  d_main_48_06_e_94:
    speaker: "<Monologue>"
    en: She floats into the air and surges forward with a ferocious momentum.
    ko: |-
      라푼젤의 몸이 떠오른다.
      그리고 맹렬한 기세로 앞으로 나아간다.
    ja: |-
      ラプンツェルの身体が浮かびあがり、
      凄まじい速度で前に進む
  d_main_48_06_e_95:
    speaker: "<Monologue>"
    en: As Rapunzel pushes forward, Altruia's barrier grows thinner and dimmer.
    ko: |-
      계속 앞으로 나아간다.
      앨트루이아의 장막이 옅어지며, 그 빛을 잃어간다.
    ja: |-
      勢いは止まることなく、
      アルトルイアのバリアが薄れ、
      光を失っていく
  d_main_48_06_e_96:
    speaker: rapunzel_s
    en: Oh my. You seem to be the type who crumbles when someone pushes back.
    ko: 어머. 밀어붙이는 것에 약한 타입이시군요?
    ja: あら…押しには弱いタイプでしたか？
  d_main_48_06_e_97:
    speaker: rapunzel_s
    en: Hehe! I suppose I shall have to keep pushing, then.
    ko: 후후. 어디 끝까지 밀어붙여볼까요?
    ja: ふふ…どこまで攻めてみましょう？
  d_main_48_06_e_98:
    speaker: rapunzel_s
    en: Harder and harder... until you fall! Haha!
    ko: 제가 금방 함락시켜드릴게요. 하악하악.
    ja: |-
      行くところまで行ってみましょうか？
      はぁはぁ…！
  d_main_48_06_e_99:
    speaker: altruia
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_100:
    speaker: "<Monologue>"
    en: Rapunzel advances, and Altruia is pushed back.
    ko: 라푼젤이 전진한다. 앨트루이아가 밀린다.
    ja: ラプンツェルが前進し、アルトルイアが退く
  d_main_48_06_e_101:
    speaker: "<Narration>"
    en: "*Ksshhkkk!*"
    ko: 카아아앙--!!
    ja: ガシャン！！
  d_main_48_06_e_102:
    speaker: "<Monologue>"
    en: With a sound like shattering glass, Altruia's barrier erupts into pieces.
    ko: |-
      유리가 깨지는 듯 한 소리가 들리며,
      앨트루이아의 실드가 산산히 흩어진다.
    ja: |-
      ガラスを思わせる破壊音とともに、
      アルトルイアのシールドが粉砕された
  d_main_48_06_e_103:
    speaker: "<Monologue>"
    en: Still deploying her shield, Rapunzel closes in.
    ko: 라푼젤은 실드를 전개한 채, 그대로 앨트루이아에게로 다가간다.
    ja: |-
      ラプンツェルはシールドを展開したまま、
      アルトルイアに迫っていく
  d_main_48_06_e_104:
    speaker: "<Monologue>"
    en: A massive energy barrier strikes Altruia head on.
    ko: 거대한 에너지의 장벽이, 앨트루이아의 정면을 덮친다.
    ja: |-
      巨大なエネルギーの盾が、
      アルトルイアの正面に衝突した
  d_main_48_06_e_105:
    speaker: altruia
    en: You're nothing but a false saint.
    ko: 그래봤자 가짜 성녀.
    ja: しょせんは形だけの聖女…
  d_main_48_06_e_106:
    speaker: altruia
    en: I am protected by our great mother. I will never suffer defeat.
    ko: 위대하신 어머니의 가호를 받는 제가 패배하는 일 따윈 없사옵니다.
    ja: |-
      偉大なるお母様のご加護を受けた
      このわたくしに、敗北などありえません。
  d_main_48_06_e_107:
    speaker: "<Monologue>"
    en: Two arm extending from Altruia's back thrust forward.
    ko: 앨트루이아의 등에서 뻗은 양손이 앞으로 내밀어진다.
    ja: アルトルイアの背面から一対の腕が前へ伸びた
  d_main_48_06_e_108:
    speaker: "<Narration>"
    en: "*Grnnnggg*"
    ko: 카가가가각--!!
    ja: ガガガガガッ――！！
  d_main_48_06_e_109:
    speaker: "<Monologue>"
    en: They pierce through Rapunzel's shield. The arms are burnt to a crisp, turning
      into charcoal.
    ko: 라푼젤의 실드를 뚫고 들어간다. 손이 타들어가며 검은 숯덩이가 된다.
    ja: |-
      腕はラプンツェルのシールドを突き破りながら
      焼けつき、黒い塊と化していく
  d_main_48_06_e_110:
    speaker: "<Monologue>"
    en: But they regenerate almost instantly.
    ko: 하지만 곧 재생된다.
    ja: しかし、焼けてもなお再生を続けていた
  d_main_48_06_e_111:
    speaker: "<Monologue>"
    en: Altruia's hands grab hold of Rapunzel's head.
    ko: 앨트루이아의 양 손이 라푼젤의 머리를 잡는다.
    ja: |-
      アルトルイアの両手が
      ラプンツェルの頭につかみかかる
  d_main_48_06_e_112:
    speaker: rapunzel_s
    en: Oh my! T-taking my head in your hands for a... k-kiss? At such a time as this?
    ko: |-
      어머.
      이, 이건 과격한 키스 자세인데요? 지금요?
    ja: |-
      ああっ…
      か、顔を引き寄せてどうすると言うのですか？
      こんな場所で…？
  d_main_48_06_e_113:
    speaker: altruia
    en: I'm going to generate shields from both of my hands and crush your head.
    ko: 이대로 양 손에서 실드를 발생시켜, 머리를 뭉개드리겠사옵니다.
    ja: |-
      この腕からシールドを出して
      頭を粉々にして差し上げます。
  d_main_48_06_e_114:
    speaker: rapunzel_s
    en: Oh, so not a kiss.
    ko: 아, 키스가 아니었군요.
    ja: ああ、私はてっきり…
  d_main_48_06_e_115:
    speaker: rapunzel_s
    en: That's a relief. You are not my type.
    ko: 다행이네요. 저도 취향이라는 게 있는지라.
    ja: |-
      安心しました。
      私にも好みというものがありますので。
  d_main_48_06_e_116:
    speaker: "<Narration>"
    en: "*Bam!*"
    ko: 까앙-!
    ja: カン――！
  d_main_48_06_e_117:
    speaker: "<Monologue>"
    en: A loud crack echoes as a portion of Altruia's head vanishes.
    ko: 굉음이 울리며 앨트루이아의 머리 일부가 사라졌다.
    ja: |-
      大きな音がしたかと思うと、
      アルトルイアの頭が欠けた
  d_main_48_06_e_118:
    speaker: "<Monologue>"
    en: As her head regenerates, Altruia stares at Rapunzel in astonishment.
    ko: 쿠드드득- 하며 재생을 하는 과정에도, 앨트루이아는 경악에 빠진 눈으로 라푼젤을 바라본다.
    ja: |-
      すぐに再生を始めたものの、
      その様子からは驚愕していることがうかがえる
  d_main_48_06_e_119:
    speaker: "<Monologue>"
    en: Her gaze shifts above Rapunzel's head.
    ko: 앨트루이아의 시선이, 라푼젤의 머리 위로 향한다.
    ja: |-
      アルトルイアの視線が
      ラプンツェルの頭の上に向けられた
  d_main_48_06_e_120:
    speaker: "<Monologue>"
    en: She sees a staff.
    ko: 지팡이.
    ja: 杖がある
  d_main_48_06_e_121:
    speaker: "<Monologue>"
    en: The red parts mounted on the head of the staff are vibrating.
    ko: 지팡이의 머리에 장착된 붉은색 파츠들이 진동하고 있다.
    ja: その先端は一部が赤く、振動していた
  d_main_48_06_e_122:
    speaker: "<Narration>"
    en: "*Vooooom*"
    ko: 웅웅웅웅웅--!!
    ja: ブーン――！！
  d_main_48_06_e_123:
    speaker: "<Monologue>"
    en: The head of the staff is vibrating so intensely that it appears blurry.
    ko: 지팡이의 머리가 흐리게 보일 정도의 진동.
    ja: 輪郭がかすんで見えるほどの速さだ
  d_main_48_06_e_124:
    speaker: altruia
    en: Ultrasonic... vibrations?
    ko: 초진동… 이옵니까.
    ja: 超振動…でしたか。
  d_main_48_06_e_125:
    speaker: rapunzel_s
    en: That's right.
    ko: 그렇답니다.
    ja: ご名答です。
  d_main_48_06_e_126:
    speaker: rapunzel_s
    en: Hyah!
    ko: 에~잇.
    ja: それっ！
  d_main_48_06_e_127:
    speaker: "<Monologue>"
    en: Golden light pours out from the red parts.
    ko: 지팡이 머리 부분의 붉은 파츠들이 황금빛을 쏟아낸다.
    ja: 杖頭の赤い部分から黄金色の光が放たれた
  d_main_48_06_e_128:
    speaker: "<Monologue>"
    en: Accelerated by the thrust, the staff strikes downward with explosive energy.
    ko: 추진력에 의해 폭발적인 가속을 받은 지팡이는 그대로-
    ja: |-
      推進力を得て爆発的に加速した杖は、
      その勢いを…
  d_main_48_06_e_129:
    speaker: "<Narration>"
    en: "*Bammm!*"
    ko: 까아아앙--!!
    ja: カン！！
  d_main_48_06_e_130:
    speaker: "<Monologue>"
    en: It smashes into Altruia's head.
    ko: 앨트루이아의 머리를 내려찍는다.
    ja: アルトルイアの頭に叩きつけた
  d_main_48_06_e_131:
    speaker: "<Monologue>"
    en: Altruia is slammed into the ground, leaving a deep crater.
    ko: 앨트루이아가 바닥에 쳐박히고, 지면이 움푹 파인다.
    ja: |-
      叩きつけられたアルトルイアが、
      大地を深くえぐる
  d_main_48_06_e_132:
    speaker: "<Narration>"
    en: The hum of the vibration continues.
    ko: 웅웅웅웅웅--!!
    ja: ブーン――！！
  d_main_48_06_e_133:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_134:
    speaker: rapunzel_s
    en: Oh wow... Th-this sound is a bit... dangerous. *Gasp*
    ko: 아, 이 소리 좀 위험하네요. 하악하악.
    ja: あ…この音は少し…いけませんね。はぁはぁ…
  d_main_48_06_e_135:
    speaker: rapunzel_s
    en: I-I can flip this switch to make the vibrations even stronger.
    ko: 이, 이 스위치를 올리면 진동이 더 강해지거든요?
    ja: |-
      このスイッチを押すと
      振動がさらに強くなるらしいですが…
  d_main_48_06_e_136:
    speaker: rapunzel_s
    en: Sh-should I flip it?
    ko: 오, 올릴, 올릴게요?
    ja: た、試してみましょうか？
  d_main_48_06_e_137:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: カチッ――
  d_main_48_06_e_138:
    speaker: "<Narration>"
    en: "*Vooooom*"
    ko: 웅웅웅웅웅웅웅웅--!!
    ja: ウィィィィン――！！
  d_main_48_06_e_139:
    speaker: "<Narration>"
    en: "*Rrrrrrr*"
    ko: 드드드드드드---!!
    ja: ガガガガ――！！
  d_main_48_06_e_140:
    speaker: "<Monologue>"
    en: The staff vibrates even more intensely. Altruia struggles desperately against
      the vibrations of the staff pressing down on her head.
    ko: |-
      지팡이가 더욱 진동한다.
      앨트루이아는 머리를 짓누르는 지팡이의 진동에 버둥거린다.
    ja: |-
      杖の振動が激しくなり、
      アルトルイアは頭を押しつぶされそうな
      衝撃にうめいた
  d_main_48_06_e_141:
    speaker: altruia
    en: "*Gnnnggghhh*"
    ko: 그그그그극--!!
    ja: うぐがががっ――！！
  d_main_48_06_e_142:
    speaker: rapunzel_s
    en: These ultrasonic vibrations actually break down nanomachines.
    ko: 나노머신 분해용 초진동이에요.
    ja: ナノマシン分解用の超振動です。
  d_main_48_06_e_143:
    speaker: rapunzel_s
    en: Here, have some more.
    ko: 자, 마음껏 가버리세요.
    ja: さあ、お好きなだけ味わってください。
  d_main_48_06_e_144:
    speaker: altruia
    en: Aaaggghhh!
    ko: 아, 아아아아아…!
    ja: ああ…がががが…！
  d_main_48_06_e_145:
    speaker: rapunzel_s
    en: By the way, aren't you going to transform?
    ko: 그런데 거대화 안 하시나요?
    ja: それはそうと、巨大化はされないのですか？
  d_main_48_06_e_146:
    speaker: rapunzel_s
    en: There's something I've been wanting to do.
    ko: 저, 그거 해보고 싶거든요.
    ja: いつか、やってみたかったのですが。
  d_main_48_06_e_147:
    speaker: rapunzel_s
    en: I want to locate the weak point of a huge, powerful enemy,
    ko: 엄청 크고 강한 상대의 야, 약점을.
    ja: 大きくて屈強な相手の弱いところを攻めて…
  d_main_48_06_e_148:
    speaker: rapunzel_s
    en: and... assault it with my staff... Haha... hahaha!
    ko: 지, 진동 지팡이로 함락시키는거요. 하악하악.
    ja: |-
      震える棒状のモノで陥落させるというのを…
      はぁはぁ…
  d_main_48_06_e_149:
    speaker: altruia
    en: This is... humiliating!
    ko: 모욕… 적이옵니다…!
    ja: なんたる…屈辱…！
  d_main_48_06_e_150:
    speaker: altruia
    en: Utterly... humiliating!
    ko: 너무나…! 모욕적이옵니다!
    ja: 絶対に…！許せません！
  d_main_48_06_e_151:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_152:
    speaker: rapunzel_s
    en: That's supposed to be my line.
    ko: 제가 할 말이네요. 그건.
    ja: それはこちらのセリフです。
  d_main_48_06_e_153:
    speaker: "<Narration>"
    en: "*Clank!*"
    ko: 카아아앙--!!
    ja: キン――！！
  d_main_48_06_e_154:
    speaker: "<Monologue>"
    en: The clear sound of steel rings through the air.
    ko: 맑은 강철음이 울려퍼진다.
    ja: 澄んだ鋼の音が大きく響いた
  d_main_48_06_e_155:
    speaker: egovista
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_48_06_e_156:
    speaker: hongryeon_g
    en: "'Tis thee, the Heretic who dared to mimic myself and Isabel."
    ko: 자네인가. 나와 이사벨 소저의 모습을 흉내냈다는 헬레틱이.
    ja: |-
      君かね。私とイサベルを模倣しているという
      ヘレティックは。
  d_main_48_06_e_157:
    speaker: egovista
    en: Scarlet...!
    ko: 홍련…!
    ja: 紅蓮…！
  d_main_48_06_e_158:
    speaker: hongryeon_g
    en: Thou knowest me.
    ko: 나를 아는가.
    ja: 知られていたのか。
  d_main_48_06_e_159:
    speaker: hongryeon_g
    en: "'Tis meet, I suppose, to learn the name of she whom thou doth imitate."
    ko: 하긴, 흉내낼 대상의 이름 정도는 알아놓는 게 좋겠지.
    ja: |-
      確かに、真似た相手の名ぐらいは
      覚えておくべきであろうな。
  d_main_48_06_e_160:
    speaker: egovista
    en: I have yearned to make acquaintance with thee. Thou knowest not...
    ko: |-
      만나고 싶었네.
      그대는 모르겠지.
    ja: |-
      会いたかったぞ。
      貴様は知らんだろうがな。
  d_main_48_06_e_161:
    speaker: egovista
    en: "... how I have sought to bandy blows with thee!"
    ko: 본인이 얼마나 그대와 검을 나누고 싶었었는지!
    ja: どれだけ剣を交えたいと思っていたか！
  d_main_48_06_e_162:
    speaker: "<Narration>"
    en: "*Clank, clank, clank!*"
    ko: 카가가가강---!!
    ja: ガガガガッ――！！
  d_main_48_06_e_163:
    speaker: "<Monologue>"
    en: Scarlet and Egovista exchange sword strikes.
    ko: 홍련과 에고비스타가 검격을 교환한다.
    ja: 紅蓮とエゴビスタの剣撃がぶつかり合う
  d_main_48_06_e_164:
    speaker: "<Monologue>"
    en: They attack faster than the eye can follow, yet neither yields an inch.
    ko: "…눈으로 따라갈 수 없을 정도의 속도지만, 둘은 서로 조금도 물러서지 않는다."
    ja: |-
      …目で追えないほどの速さだが、
      互いに一歩も退かない勢いだとは理解できる
  d_main_48_06_e_165:
    speaker: egovista
    en: Oh...! What a delight! Verily, the sword is mightier than all else!
    ko: |-
      아아…! 즐겁다! 즐거워!
      역시 검은 최고일세!
    ja: |-
      ああ…！楽しくてたまらぬ！
      やはり斬り合いはいい！
  d_main_48_06_e_166:
    speaker: egovista
    en: The clash of two swords conveys so much without words!
    ko: |-
      이렇게 검격을 나누고 있자니,
      말로 하지 않아도 많은 것이 전해지는군!
    ja: |-
      剣筋を見れば、言葉にせずとも
      多くのことが伝わってくる！
  d_main_48_06_e_167:
    speaker: egovista
    en: Indeed, a single clang of steel says far more than a hundred words ever could!
      Hahaha!
    ko: 이것 보게나! 백마디 말보다, 한 번의 검격이 더욱 많은 것을 얘기하고 있지 않나! 하하하!
    ja: |-
      そうだろう！百の言葉より
      剣の一撃の方が多くを語る！ワハハハ！！
  d_main_48_06_e_168:
    speaker: hongryeon_g
    en: What meanest thou by this?
    ko: 자네 무슨 소릴 하는겐가.
    ja: 何を言っておる。
  d_main_48_06_e_169:
    speaker: hongryeon_g
    en: Using blades to converse? 'Tis idle dotage.
    ko: 검으로 대화라니, 어처구니없는 소릴 하는군.
    ja: 剣で語るなどと、たわけた話だ。
  d_main_48_06_e_170:
    speaker: egovista
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_171:
    speaker: hongryeon_g
    en: A sword is but an instrument of death. How canst thou imagine it serve for
      discourse?
    ko: |-
      검은 상대를 죽이기 위한 수단일 뿐일세.
      검격으로 나누는 대화라니, 어디서 뭘 본 건가.
    ja: |-
      剣は殺しの道具にすぎない。
      それで対話した気になるなど、
      話にならないねぇ。
  d_main_48_06_e_172:
    speaker: egovista
    en: Ha, haha! I fear I did esteem thee too highly. I spake as if thou wert of
      understanding!
    ko: |-
      하, 하하! 본인, 그대를 너무 과대평가한 모양이군!
      경지에 다다른 이라고 생각해, 본인이 말이 많았어!
    ja: |-
      ハ、ハハハ！拙者が買いかぶりすぎたか！？
      貴様も至った者なのだと思っていたがな！
  d_main_48_06_e_173:
    speaker: hongryeon_g
    en: In truth, I have heretofore heard such an idle musing. Though I knew it a
      fiction, it held some likelihood of truth.
    ko: |-
      뭐 그런 허황된 이야기는 나도 들어본 적 있네.
      가상의 이야기지만 제법 그럴듯하다고는 생각했지.
    ja: |-
      よた話だが、聞いたことはある。
      そういう話もあるかも知れぬと
      信じた時もあった。
  d_main_48_06_e_174:
    speaker: hongryeon_g
    en: However, it doth suppose adversaries alike in strength.
    ko: 그런데, 그것도 어느 정도 격이 맞는 상대끼리의 얘기 아니겠는가.
    ja: |-
      しかしそれも、同格の使い手であればこそ、
      という話ではないかね？
  d_main_48_06_e_175:
    speaker: hongryeon_g
    en: Alas, thou art far too feeble.
    ko: 미안하네만, 자네는 한참 모자라는군.
    ja: すまないが、君はまだまだ及ばぬ。
  d_main_48_06_e_176:
    speaker: egovista
    en: "... Thy sister was pitiful."
    ko: "…그대의 언니는 형편없었네."
    ja: "…貴様の姉上には、ひどい肩透かしを食らったぞ。"
  d_main_48_06_e_177:
    speaker: egovista
    en: But a single strike of my sword did cleave her in twain.
    ko: 본인의 검격 한번에 몸이 쪼개졌지.
    ja: 拙者の一太刀で真っ二つに割られて…
  d_main_48_06_e_178:
    speaker: egovista
    en: The spectacle of her falling to the ground proved most amusing.
    ko: 힘없이 바닥에 쓰러지는 모습이, 퍽이나 유쾌했었네.
    ja: 地に伏せるザマだけは、見ものだったがなぁ。
  d_main_48_06_e_179:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_180:
    speaker: "<Monologue>"
    en: Egovista raises her sword.
    ko: 에고비스타의 검이 들어올려진다.
    ja: エゴビスタは剣を大上段に構え…
  d_main_48_06_e_181:
    speaker: "<Monologue>"
    en: She brings it down with all her might.
    ko: 모든 힘을 실어 내려친다.
    ja: 渾身の一撃を繰り出した
  d_main_48_06_e_182:
    speaker: "<Monologue>"
    en: Scarlet lowers her stance and swiftly sheathes her sword at the same time.
    ko: 홍련이 자세를 숙임과 동시에 빠르게 검을 검집에 집어넣는다.
    ja: |-
      紅蓮は腰を落とし、
      剣を素早くさやに収めた
  d_main_48_06_e_183:
    speaker: "<Monologue>"
    en: Then, the moment she blinks and opens her eyes,
    ko: 그리고, 눈을 깜빡였다가 뜨는 순간.
    ja: 一瞬目を閉じ、それが再び開かれた時…
  d_main_48_06_e_184:
    speaker: "<Monologue>"
    en: Egovista's sword is sliced in two and sent flying away through the air.
    ko: 에고비스타의 검이 두 동강 난 채 날아가고 있었고
    ja: エゴビスタの剣は両断され、吹き飛んでいた
  d_main_48_06_e_185:
    speaker: "<Monologue>"
    en: Sheathing her sword, Scarlet rises to her feet.
    ko: 홍련은 검집에 검을 집어넣는 상태로, 몸을 일으킨다.
    ja: 剣をさやに収めたまま、紅蓮は姿勢を正した
  d_main_48_06_e_186:
    speaker: egovista
    en: "... What?"
    ko: "…뭣."
    ja: "…何？"
  d_main_48_06_e_187:
    speaker: "<Monologue>"
    en: Egovista falls to her knees.
    ko: 에고비스타가 무릎을 꿇으며 쓰러진다.
    ja: エゴビスタがひざをつき、倒れ込む
  d_main_48_06_e_188:
    speaker: "<Narration>"
    en: "*Crack*"
    ko: 쩍-
    ja: バシュッ――
  d_main_48_06_e_189:
    speaker: "<Monologue>"
    en: Her right shoulder splits open, and black liquid spurts out.
    ko: 오른쪽 어깨가 갈라지며, 검은색 액체가 솟아오른다.
    ja: 右肩が裂け、黒い液体が吹きだした
  d_main_48_06_e_190:
    speaker: hongryeon_g
    en: Thou art not worthy to dog my sister's heels.
    ko: 자네는 언니의 발끝도 따라가지 못하네.
    ja: 姉さんの足元にも及ばぬな。
  d_main_48_06_e_191:
    speaker: hongryeon_g
    en: Know thy place.
    ko: 주제를 알게나.
    ja: 身の程知らずというものだ。
  d_main_48_06_e_192:
    speaker: egovista
    en: Cursed... human... imposter...
    ko: 유사 인간… 따위가….
    ja: 人間もどきの…分際で…
  d_main_48_06_e_193:
    speaker: hongryeon_g
    en: Thou art drunk with a love of the blade,
    ko: "…자네. 검의 길에 심취한 모양이군."
    ja: "…君は、剣の道にかぶれているようだが…"
  d_main_48_06_e_194:
    speaker: hongryeon_g
    en: yet depend upon thy brawn alone to wield it.
    ko: 허나 자네는 그저 신체능력을 앞세워 검을 휘둘러댈 뿐일세.
    ja: 膂力に任せて、刃物を振り回しているだけだ。
  d_main_48_06_e_195:
    speaker: hongryeon_g
    en: "'Tis unbefitting the name of swordsmanship. Desist henceforth to call it
      such."
    ko: |-
      검술이라 부르기에 한참은 부족하니,
      앞으로 검술이 어쩌니하는 말은 삼가주게.
    ja: |-
      剣術と呼ぶには程遠い。
      その口で語るべきことではなかろうな。
  d_main_48_06_e_196:
    speaker: hongryeon_g
    en: It abashes me to hear thee speak.
    ko: 듣고있자니 민망해서 고개를 들 수 없으니.
    ja: |-
      聞いているだけで恥ずかしくなる。
      顔も上げられなくなってしまいそうだ。
  d_main_48_06_e_197:
    speaker: egovista
    en: Silence... imposter...! Do not slander... my sword...!
    ko: |-
      닥치… 시게. 유사 인간 따위… 가…!
      본인의 검을… 모독하지 말… 게…!
    ja: |-
      黙れ…人間もどきが…！
      拙者の剣を…侮辱する…な…！
  d_main_48_06_e_198:
    speaker: hongryeon_g
    en: It is a mystery where thou learned to wield a sword in so lamentable a manner.
    ko: 이것 참. 어디서 뭘 보았길래 그런 되도 않는 검사 흉내를 내는 건지 원.
    ja: |-
      まったく、どこで覚えたのやら…
      形だけのまね事で使い手を名乗るとはな。
  d_main_48_06_e_199:
    speaker: hongryeon_g
    en: "... Oh, I understand."
    ko: 오, 그런가. 그런 것인가.
    ja: おっと、そうだった、そうだった。
  d_main_48_06_e_200:
    speaker: hongryeon_g
    en: Thy mother, so filled with dread of swords after I severed her head,
    ko: |-
      자네의 어미가 나에게 목이 썰린 이후,
      검이라는 것이 너무나 두려워….
    ja: |-
      君のお母上は私に首を斬られて、
      剣というものが恐ろしくなったのであろう。
  d_main_48_06_e_201:
    speaker: hongryeon_g
    en: settled her opinion of what a sword should be, and thus fashioned thee.
    ko: 검이란 무엇인지 나름대로의 결론을 내려, 자네를 빚은 것이로군.
    ja: |-
      それで剣とは何か、
      独りよがりの答えを出して、
      君のようなものを作ったに違いない。
  d_main_48_06_e_202:
    speaker: hongryeon_g
    en: A confluence of prejudice and her own capricious ideals.
    ko: 편견과 제멋대로인 이상을 섞어, 빚은 것이야.
    ja: |-
      色めがねと自分本位の理想で編んだ、
      まやかしだ。
  d_main_48_06_e_203:
    speaker: hongryeon_g
    en: Haha. How ridiculous.
    ko: 하하. 이것 참 유쾌한 일일세.
    ja: いやはや、実に面白いねぇ。
  d_main_48_06_e_204:
    speaker: hongryeon_g
    en: Ye call us imposters,
    ko: 우리더러 유사 인간이라 얕잡아보던 것이.
    ja: 私たちのことを人間もどきと見くびるやからが…
  d_main_48_06_e_205:
    speaker: hongryeon_g
    en: yet imitate us and desire to resemble us.
    ko: 역으로 우리를 닮고 싶어 흉내낸 꼴이라니.
    ja: 私たちに寄せてくるとは。
  d_main_48_06_e_206:
    speaker: hongryeon_g
    en: Does that not make you human imposter imposters, as the phrase is?
    ko: |-
      자네의 말을 빌리자면 자네는,
      유사 유사 인간인 셈인가?
    ja: |-
      その言葉を借りるなら、
      君は人間もどきのもどきと
      いうことになるのかい？
  d_main_48_06_e_207:
    speaker: egovista
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_48_06_e_208:
    speaker: hongryeon_g
    en: By all means, transform.
    ko: 거대화나 하시게.
    ja: 巨大化、見せてみたまえ。
  d_main_48_06_e_209:
    speaker: hongryeon_g
    en: "'Tis thy sole faculty, is it not?"
    ko: 어차피 자네의 재주라곤 그것밖에 없지 않은가.
    ja: それが君のたった一つの取り柄であろう？
  d_main_48_06_e_210:
    speaker: egovista
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_211:
    speaker: altruia
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_212:
    speaker: egovista
    en: As you wish.
    ko: 바라는대로.
    ja: ならば、望み通りに…
  d_main_48_06_e_213:
    speaker: altruia
    en: I shall grant your request.
    ko: 해 드리겠사옵니다.
    ja: してさしあげましょう。
  d_main_48_06_e_214:
    speaker: "<Narration>"
    en: "*Screeeech!*"
    ko: 키이이이이이잉--!!
    ja: キィィィィィン…！！
  d_main_48_06_e_215:
    speaker: egovista
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_48_06_e_216:
    speaker: altruia
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_48_06_e_217:
    speaker: hongryeon_g
    en: I have heard this before...
    ko: "…이건… 그 때 들었던…."
    ja: "…これは…あの時にも聞いた…"
  d_main_48_06_e_218:
    speaker: rapunzel_s
    en: "... The Queen's calling signal."
    ko: "…퀸의 콜링 시그널."
    ja: "…クイーンのコーリングシグナル。"
  d_main_48_06_e_219:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 콰앙-!
    ja: ダンッ！
  d_main_48_06_e_220:
    speaker: "<Monologue>"
    en: The fallen Altruia and Egovista spring up into the air.
    ko: 쓰러져있는 앨트루이아와 에고비스타가 튀어 오른다.
    ja: |-
      倒れていたアルトルイアとエゴビスタが
      飛び上がった
  d_main_48_06_e_221:
    speaker: "<Monologue>"
    en: They instantly widen the distance between us and stare in our direction.
    ko: 순식간에 거리를 벌린 후, 우리를 바라본다.
    ja: 一瞬で距離を広げ、こちらをにらみ付けている
  d_main_48_06_e_222:
    speaker: egovista
    en: "... Mother summons us."
    ko: "…어머니께서 부르신다."
    ja: "…お母様がお呼びとあっては…"
  d_main_48_06_e_223:
    speaker: altruia
    en: I will never forget this humiliation.
    ko: 이 굴욕은, 절대 잊지 않겠사옵니다.
    ja: この屈辱、決して忘れはしません。
  d_main_48_06_e_224:
    speaker: egovista
    en: We shall see you dead. I swear.
    ko: 죽여주겠네. 반드시.
    ja: 殺してやるぞ。必ずだ。
  d_main_48_06_e_225:
    speaker: altruia
    en: Every last one of you.
    ko: 모두.
    ja: 一人残らずです。
  d_main_48_06_e_226:
    speaker: "<Monologue>"
    en: Altruia and Egovista retreat toward the Lift from where the sound originated.
    ko: 앨트루이아와 에고비스타가 소리가 들려온 궤도 엘리베이터를 향해 퇴각한다.
    ja: |-
      アルトルイアとエゴビスタは呼び出し元、
      すなわち軌道エレベーターに向かって飛んだ
  d_main_48_06_e_227:
    speaker: "<Monologue>"
    en: Shortly after, they disappear inside the Lift.
    ko: 그리고 이내, 궤도 엘리베이터 안으로 사라진다.
    ja: |-
      その姿はたちまち
      軌道エレベーターの内部に吸い込まれて消えた
  d_main_48_06_e_228:
    speaker: "<Monologue>"
    en: Scarlet and Rapunzel turn around.
    ko: 홍련과 라푼젤이 뒤를 돌아본다.
    ja: 紅蓮とラプンツェルが背中を振り返る
  d_main_48_06_e_229:
    speaker: "<Monologue>"
    en: Just as they are about to smile and say something,
    ko: 둘이 미소지으며 뭐라고 말하려는 순간
    ja: |-
      二人は笑顔を浮かべ、
      何かを言おうと口を開いたが…
  d_main_48_06_e_230:
    speaker: "<Monologue>"
    en: Snow White steps forward.
    ko: 스노우 화이트가 앞으로 걸어나갔다.
    ja: |-
      前に歩み出してきた
      スノーホワイトの姿に止められた
  d_main_48_06_e_231:
    speaker: snowwhite_h
    en: Scarlet... Rapunzel.
    ko: 홍련… 라푼젤.
    ja: 紅蓮…ラプンツェル。
  d_main_48_06_e_232:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_233:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_234:
    speaker: snowwhite_h
    en: Come quicker next time.
    ko: 일찍일찍 좀 다녀라.
    ja: もっと早く来い。
  d_main_48_06_e_235:
    speaker: hongryeon_g
    en: Must thou quench all cheer?
    ko: 그것 참. 낭만이라고는 없군그래.
    ja: まったく…無粋だねぇ。
  d_main_48_06_e_236:
    speaker: rapunzel_s
    en: I feel silly for expecting anything else.
    ko: 뭘 기대하고 있었던 걸까요. 저는.
    ja: 期待した方が間違っていました。
  d_main_48_06_e_237:
    speaker: hongryeon_g
    en: Wherefore art thou girt with such store of weapons? Art thou an armory? Show
      some restraint.
    ko: |-
      그나저나 자네 뭘 또 그리 주렁주렁 매달고 다니는겐가.
      적당히 하게. 창고도 아니고 원.
    ja: |-
      それにしても、
      ずいぶん得物をぶら下げておるな。
      まるで武器庫だ。
  d_main_48_06_e_238:
    speaker: rapunzel_s
    en: You're... not wearing any pants. You're finally starting to see things the
      way I do...!
    ko: |-
      바지가… 없군요.
      드디어 스노우 화이트도 이쪽 세계에 눈을…!
    ja: |-
      脚が…むき出しですね。
      もしやスノーホワイトも目覚め…！
  d_main_48_06_e_239:
    speaker: snowwhite_h
    en: What about you two? What's with all the stuff you've got?
    ko: 그러는 너희야말로 뭘 그렇게 달고 나타난 거지?
    ja: |-
      そういうお前たちこそ
      何をそんなに持ち歩いている？
  d_main_48_06_e_240:
    speaker: snowwhite_h
    en: Don't rely too much on your equipment.
    ko: 장비에 의존하지마라.
    ja: 装備に頼るな。
  d_main_48_06_e_241:
    speaker: hongryeon_g
    en: "... Thou has bereft me of all words."
    ko: 기가 막혀 뭐라 대꾸할 기운도 안나는군.
    ja: あきれて言い返す気にもならないねえ。
  d_main_48_06_e_242:
    speaker: rapunzel_s
    en: Equipment is extremely important—essential, really, to bridge a difference
      in ability.
    ko: |-
      장비가 얼마나 중요한데요.
      기량의 차이를 메꾸기 위해선 장비가 필수라고요.
    ja: |-
      装備は大切なものですよ。
      力の差を埋めるためにも必要不可欠ですから。
  d_main_48_06_e_243:
    speaker: "<Self>"
    en: "... Welcome back, you two."
    ko: "…다들, 어서와."
    ja: "…2人とも、待っていたぞ"
  d_main_48_06_e_244:
    speaker: "<Self>"
    en: I'm so relieved to see you again.
    ko: 다시 만날 수 있어서 너무 다행이야.
    ja: また顔が見られて本当によかった
  d_main_48_06_e_245:
    speaker: hongryeon_g
    en: Ah, 'tis refreshing to hear. Thou alone dost offer so sincere a greeting.
    ko: 아아. 역시 이런 정상적인 반응을 해주는 건 도령밖에 없군.
    ja: |-
      ああ…やはりまっとうな言葉を
      返してくれるのはぼっちゃんだけだ。
  d_main_48_06_e_246:
    speaker: rapunzel_s
    en: You seem even brawnier than when I last saw you, Believer.
    ko: 형제님. 오랜만에 봐서 그런지 몸이 더 다부져보이시네요.
    ja: |-
      ブラザー。久しぶりだからでしょうか、
      さらにたくましくなられた気がします。
  d_main_48_06_e_247:
    speaker: rapunzel_s
    en: If you don't mind, may I touch... I mean... lick... I mean! May I massage
      you?
    ko: |-
      실례가 안된다면 한번만 더듬어, 아니, 핥, 아니아니.
      주물러봐도 될까요?
    ja: |-
      もし失礼でなければ、一度触れて…
      いえ、なめ…これも違いますね。
      揉んでみてもよろしいでしょうか？
  d_main_48_06_e_248:
    speaker: anis_i_w
    en: That's the word you decided to go with?
    ko: 단어를 고른 의미 없지 않냐.
    ja: 言葉を選んだ意味、なくない？
  d_main_48_06_e_249:
    speaker: neon_v_w
    en: Neither of you has changed a bit, I see.
    ko: 다들 여전하시네요.
    ja: 皆さん、お変わりないようですね。
  d_main_48_06_e_250:
    speaker: rapi_red
    en: Yeah.
    ko: 그러게.
    ja: そうね。
  d_main_48_06_e_251:
    speaker: hongryeon_g
    en: A great while has passed since last we met, Counters. Ye are all finely attired,
      I see.
    ko: |-
      카운터스 낭자들도 오랜만일세.
      다들 멋들어지게 차려들 입으셨군.
    ja: |-
      カウンターズも久しぶりに見るねえ。
      ずいぶんと貫禄が出た。
  d_main_48_06_e_252:
    speaker: rapunzel_s
    en: "... I can feel it. You've all grown stronger."
    ko: "…느껴져요. 여러분은 강해졌군요."
    ja: "…感じます。皆さんも強くなったのですね。"
  d_main_48_06_e_253:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_254:
    speaker: hongryeon_g
    en: "... Wait. Rapi. Thou art... changed..."
    ko: "…잠깐. 라피 낭자. 뭔가 느낌이…."
    ja: "…待て。ラピ、その気配は…"
  d_main_48_06_e_255:
    speaker: rapunzel_s
    en: Ooh, is this new outfit of hers to your liking? You never spoke of such things
      before, but now...
    ko: |-
      어머어머. 바뀐 모습이 취향이신가요?
      남한테 그런 얘기 통 안 하시던 분이 갑자기….
    ja: |-
      あら、ああいう姿が好みでしたか？
      そんなことを口に出すなんて珍しい…
  d_main_48_06_e_256:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_257:
    speaker: rapunzel_s
    en: Red Hood?
    ko: 레드 후드?
    ja: レッドフード…？
  d_main_48_06_e_258:
    speaker: "<Monologue>"
    en: Rapi quietly nods her head.
    ko: 라피가 조용히 고개를 끄덕인다.
    ja: ラピが静かに頭を縦に振った
  d_main_48_06_e_259:
    speaker: rapi_red
    en: I have a lot to tell you two.
    ko: 너희들한테 얘기해줄게 많아.
    ja: |-
      あなたたちには、
      話したいことがたくさんあるの。
  d_main_48_06_e_260:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_261:
    speaker: hongryeon_g
    en: "... I see. Discuss it to us hereafter."
    ko: "…그래. 나중에 얘기함세."
    ja: |-
      …そうかい。
      後でゆっくり聞かせてもらうとしよう。
  d_main_48_06_e_262:
    speaker: rapunzel_s
    en: Yeah. We'd love to hear all about it.
    ko: 예. 꼭 들려줘요.
    ja: はい。ぜひ。
  d_main_48_06_e_263:
    speaker: rapunzel_s
    en: By the way, who are these brazen sisters in black? They seem to be quite...
      bold.
    ko: |-
      그나저나 이쪽의 파렴치한 검은 자매님들은 누구시죠?
      아주 과감하시네요.
    ja: |-
      それはさておき、
      そちらのハレンチな黒ずくめの方たちは？
      なんとも大胆ですが…
  d_main_48_06_e_264:
    speaker: ziz
    en: Huh? Brazen?
    ko: 파, 파렴치….
    ja: ハ、ハレンチって…
  d_main_48_06_e_265:
    speaker: "<Self>"
    en: They're the Four Beasts. They've agreed to help us in this fight.
    ko: |-
      포비스트야.
      이번 싸움에 힘을 보태주기로 했어.
    ja: |-
      フォービーストと言うんだ。
      私たちの戦いに力を貸してくれている
  d_main_48_06_e_266:
    speaker: "<Self>"
    en: "... Er, they're Heretics, but they're on our side. You can trust them."
    ko: "…어, 헬레틱이지만 우리 편이지. 믿어도 돼."
    ja: |-
      …実は、ヘレティックでもあるが、
      私たちの味方だ。信じてくれ
  d_main_48_06_e_267:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_268:
    speaker: hongryeon_g
    en: "... I see. Thou art of a right sociable nature, my lord."
    ko: "…그런가. 도령은 참으로 사회성이 좋군."
    ja: |-
      …そうかい。
      相変わらず人付き合いが上手いようだねぇ。
  d_main_48_06_e_269:
    speaker: rapunzel_s
    en: No kidding. You accept just about anyone as an ally.
    ko: 그러게요. 일단 동료로 삼고 보네요.
    ja: |-
      そういうことでしたら、
      仲間として受け入れさせていただきましょう。
  d_main_48_06_e_270:
    speaker: rapunzel_s
    en: Your range is... quite amazing.
    ko: |-
      상대를 가리지 않는 그 수비범위…
      대단하다고 생각해요.
    ja: |-
      限界を知らない守備範囲の広さ…
      素晴らしいと思います。
  d_main_48_06_e_271:
    speaker: snowwhite_h
    en: Enough chit chat.
    ko: 잡담은 거기까지다.
    ja: 立ち話はここまでだ。
  d_main_48_06_e_272:
    speaker: snowwhite_h
    en: We've finished declaring war, so now we fall back.
    ko: 선전포고는 끝났으니 퇴각한다.
    ja: 宣戦布告も終わった。撤退するぞ。
  d_main_48_06_e_273:
    speaker: hongryeon_g
    en: For what reason? Being now arrived, should we not press forward?
    ko: 무슨 소린가. 우리까지 왔으니 밀고 나가야하지 않겠나.
    ja: |-
      何を言っているのだね？
      私たちまでそろったのだ、
      今こそ押すべきであろう。
  d_main_48_06_e_274:
    speaker: rapunzel_s
    en: I agree. It's a little anticlimactic to stop now.
    ko: 저도 동의해요. 이대로 가기엔 좀 아쉬운데요.
    ja: |-
      私もそう思います。
      このまま戻るのはもったいないかと。
  d_main_48_06_e_275:
    speaker: snowwhite_h
    en: The Ark is going to initiate the Third Surface Reclamation War.
    ko: 방주가 3차 지상 탈환전을 시작할 거다.
    ja: アークが第三次地上奪還戦を仕掛ける。
  d_main_48_06_e_276:
    speaker: snowwhite_h
    en: We wait until then.
    ko: 그때까진 기다린다.
    ja: 決戦はその時だ。
  d_main_48_06_e_277:
    speaker: rapunzel_s
    en: The Third Surface Reclamation War...?
    ko: 3차 지상 탈환전… 이요?
    ja: 第三次地上奪還戦…ですか？
  d_main_48_06_e_278:
    speaker: hongryeon_g
    en: What...?
    ko: 이건 또 무슨….
    ja: それはなんとも…
  d_main_48_06_e_279:
    speaker: snowwhite_h
    en: I'll explain the details later.
    ko: 자세한 이야기는 나중이다.
    ja: 詳しいことは後で話す。
  d_main_48_06_e_280:
    speaker: snowwhite_h
    en: We're in the middle of enemy territory. Now's not the time.
    ko: 적진 한가운데서 한가로이 얘기를 나눌 여유는 없다.
    ja: 敵地の中央でのんびりと話すほど、余裕はない。
  d_main_48_06_e_281:
    speaker: hongryeon_g
    en: "'Tis strange to hear such words from thy mouth."
    ko: 자네가 그런 말을 잘도 하는군.
    ja: 君がそんなことを言いだすとはねえ。
  d_main_48_06_e_282:
    speaker: rapunzel_s
    en: Hehe, agreed.
    ko: 후후. 그러게요.
    ja: ふふ、そうですね。
  d_main_48_06_e_283:
    speaker: hongryeon_g
    en: Well then, let us turn back.
    ko: 그럼 일단 돌아가세.
    ja: ひとまず、戻るとしようか。
  d_main_48_06_e_284:
    speaker: hongryeon_g
    en: We have journeyed thus far but to waste our strength.
    ko: 왔다갔다 힘만 뺐군그래.
    ja: |-
      駆けつけざまの大立ち回りで、
      こちらもクタクタだ。
  d_main_48_06_e_285:
    speaker: rapunzel_s
    en: Still, it wasn't all bad. We made quite the entrance, after all.
    ko: 그래도, 멋지게 등장해서 활약했으니 괜찮지 않나요?
    ja: |-
      その分、格好良く活躍できましたから、
      疲れたかいはあったでしょう？
  d_main_48_06_e_286:
    speaker: hongryeon_g
    en: We did, indeed.
    ko: 뭐, 그건 그렇지.
    ja: まあ、それもそうだねぇ。
  d_main_48_06_e_287:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_288:
    speaker: snowwhite_h
    en: You two.
    ko: 둘.
    ja: 二人とも…
  d_main_48_06_e_289:
    speaker: snowwhite_h
    en: Thanks for coming back.
    ko: 잘 돌아와줘서 고맙다.
    ja: 戻ってきてくれて、よかった。
  d_main_48_06_e_290:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_291:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_292:
    speaker: hongryeon_g
    en: Thou hast grown tender in our absence.
    ko: 뭘 새삼스럽게.
    ja: 何だい、今さら。
  d_main_48_06_e_293:
    speaker: rapunzel_s
    en: Thank you for holding on.
    ko: 잘 버텨주셔서 고마워요.
    ja: 今まで一人で戦い抜いていたのでしょう。
  d_main_48_06_e_294:
    speaker: rapunzel_s
    en: And for staying alive.
    ko: 살아있어줘서, 고마워요.
    ja: こちらこそ、お礼を言わないと。
  d_main_48_06_e_295:
    speaker: marian_q
    en: See?
    ko: 보셨죠?
    ja: 見ましたか？
  d_main_48_06_e_296:
    speaker: marian_q
    en: They will never lose.
    ko: 저들은 절대 지지 않아요.
    ja: あの人たちは絶対に負けません。
  d_main_48_06_e_297:
    speaker: marian_q
    en: They're sure to win.
    ko: 반드시 이겨요.
    ja: 必ず勝つんです。
  d_main_48_06_e_298:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_299:
    speaker: onlyone_c
    en: Then...
    ko: 그럼, 언니.
    ja: じゃあ、お姉ちゃん…
  d_main_48_06_e_300:
    speaker: onlyone_c
    en: I, uh...
    ko: 나….
    ja: わ…
  d_main_48_06_e_301:
    speaker: onlyone_c
    en: Can I keep cuddling with everyone?
    ko: 나 계속 언니들한테 안겨 있어도 돼?
    ja: |-
      わたし、ずっとお姉ちゃんたちと
      ぎゅーってしててもいいの？
  d_main_48_06_e_302:
    speaker: marian_q
    en: Yeah.
    ko: 예.
    ja: はい。
  d_main_48_06_e_303:
    speaker: onlyone_c
    en: And go to new places,
    ko: 새로운 곳에 놀러가고.
    ja: 知らないところに遊びに行って…
  d_main_48_06_e_304:
    speaker: onlyone_c
    en: and eat yummy food,
    ko: 맛있는 거 먹고.
    ja: おいしいものを食べて…
  d_main_48_06_e_305:
    speaker: onlyone_c
    en: and laugh a lot,
    ko: 하하하 웃으면서.
    ja: いっぱい笑って…
  d_main_48_06_e_306:
    speaker: onlyone_c
    en: and run around every day?
    ko: 매일 뛰어다녀도 돼?
    ja: 毎日走り回って、いいの？
  d_main_48_06_e_307:
    speaker: marian_q
    en: Yeah.
    ko: 예.
    ja: ええ。
  d_main_48_06_e_308:
    speaker: onlyone_c
    en: Really? Can I?
    ko: 정말 그래도 돼?
    ja: ほんとに、いいの？
  d_main_48_06_e_309:
    speaker: marian_q
    en: Yeah.
    ko: 예.
    ja: はい。
  d_main_48_06_e_310:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_311:
    speaker: marian_q
    en: You're allowed to keep living, surrounded by love.
    ko: 그렇게, 계속 사랑받으면서 살아도 돼요.
    ja: |-
      そうやって、愛されながら
      ずっと生きていってください。
  d_main_48_06_e_312:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_06_e_313:
    speaker: onlyone_c
    en: You know...
    ko: "…나 있지, 언니."
    ja: "…あのね、お姉ちゃん…"
  d_main_48_06_e_314:
    speaker: onlyone_c
    en: I really don't want to be the Queen.
    ko: 퀸 정말 하기 싫어.
    ja: クイーンなんて、なりたくないの。
  d_main_48_06_e_315:
    speaker: marian_q
    en: Then I'll do it.
    ko: 제가 할게요.
    ja: 私がなります。
  d_main_48_06_e_316:
    speaker: marian_q
    en: For all those you care for, of course,
    ko: 당신의 소중한 사람은 물론
    ja: あなたの大切な人だけではありません。
  d_main_48_06_e_317:
    speaker: marian_q
    en: but also for everyone. I'll create a world where no one dies.
    ko: 그 누구도 죽지 않는 세계를 만들게요.
    ja: 誰も死ななくていい世界を作ります。
  d_main_48_06_e_318:
    speaker: marian_q
    en: A world where everyone loves and is loved in return.
    ko: 사랑하고, 사랑받는 세계를.
    ja: 愛すること、愛されることができる世界を。
  d_main_48_06_e_319:
    speaker: "<Narration>"
    en: The girl stares intently at Marian.
    ko: 소녀가 마리안을 빤히 바라본다.
    ja: 少女の瞳がマリアンを見つめた
  d_main_48_06_e_320:
    speaker: "<Narration>"
    en: After nodding, she places her hand over her chest.
    ko: 고개를 끄덕인 후, 가슴에 손을 얹는다.
    ja: 頭を縦に振り、胸に手を当てる
  d_main_48_06_e_321:
    speaker: "<Narration>"
    en: Her core glows red as black light drifts around it.
    ko: 붉게 빛나는 코어. 그 주위를 떠도는 검은색 빛.
    ja: |-
      赤く光を放つコアが
      周囲に黒い光を漂わせ、浮かぶ
  d_main_48_06_e_322:
    speaker: "<Narration>"
    en: It moves toward Marian.
    ko: 그것이 마리안에게로 향한다.
    ja: コアはマリアンに向かった
  d_main_48_06_e_323:
    speaker: marian_q
    en: Thank you.
    ko: 고마워요.
    ja: ありがとうございます。
  d_main_48_06_e_324:
    speaker: marian_q
    en: I'm going to do it. I promise.
    ko: 반드시, 해낼게요.
    ja: やり遂げます。必ず。
d_main_48_07:
  d_main_48_07_1:
    speaker: ingrid_op
    en: Two Annihilios have been confirmed destroyed.
    ko: 애니힐리오 두 기 격추 확인.
    ja: アニヒリオ2機の撃墜を確認。
  d_main_48_07_2:
    speaker: ingrid_op
    en: Only one remains.
    ko: 남은 건 하나다.
    ja: 残りは1機だ。
  d_main_48_07_3:
    speaker: dorothy
    en: "... You managed to shoot down two of those missiles while holding back all
      those Raptures at the same time?"
    ko: "…그 많은 랩쳐들을 막아내고, 미사일까지 요격했다고요?"
    ja: |-
      …あの数のラプチャーを相手にしながら、
      ミサイルの迎撃まで？
  d_main_48_07_4:
    speaker: ingrid_op
    en: Yeah, Matis and the Ark Rangers did.
    ko: 그래. 메티스와 아크레인저가 했다.
    ja: ああ。メティスとアークレンジャーの力だ。
  d_main_48_07_5:
    speaker: dorothy
    en: The Ark is pretty impressive.
    ko: 제법이네요. 방주의 힘도.
    ja: あなどれませんね。アークの力も。
  d_main_48_07_6:
    speaker: ingrid_op
    en: It's amazing is what it is.
    ko: 아주 훌륭하지.
    ja: それは良かった。
  d_main_48_07_7:
    speaker: dorothy
    en: Captain.
    ko: 기장님.
    ja: 機長。
  d_main_48_07_8:
    speaker: sky
    en: Yes?
    ko: 예스 맴.
    ja: イエス、マム。
  d_main_48_07_9:
    speaker: dorothy
    en: Could you position us below the missile?
    ko: 미사일 아래쪽으로 위치를 잡아주시겠어요?
    ja: ミサイルの下へ回り込んでいただけますか？
  d_main_48_07_10:
    speaker: sky
    en: "... Come again?"
    ko: "…예?"
    ja: "…え？"
  d_main_48_07_11:
    speaker: sora
    en: Whoa. You're gonna aim right for the power core, aren't you?
    ko: 와. 동력부를 바로 노릴 생각이시군요?
    ja: まさか、動力部を狙うおつもりです？
  d_main_48_07_12:
    speaker: dorothy
    en: You're very perceptive.
    ko: 눈썰미가 좋으시네요.
    ja: 話が早いですね。
  d_main_48_07_13:
    speaker: dorothy
    en: That's right. I can shoot it straight from below.
    ko: 맞아요. 아래쪽에서는 바로 쏠 수 있어요.
    ja: そうです。下からなら直接狙えます。
  d_main_48_07_14:
    speaker: dorothy
    en: No need to go through the hassle of stripping off all that armor.
    ko: 번거롭게 장갑을 벗겨낼 필요도 없죠.
    ja: 装甲をはがす手間がかかりません。
  d_main_48_07_15:
    speaker: sora
    en: Wow ★ That's not something that just anyone would try to do.
    ko: 흐응~★ 그렇다고 해도 그걸 바로 노릴 사람은 없을 텐데요.
    ja: |-
      え～と～★
      確かにできるなら一番ラクだと思いますけど…
  d_main_48_07_16:
    speaker: dorothy
    en: Perhaps, but I can do it.
    ko: 저는 할 수 있어요.
    ja: 私にはできます。
  d_main_48_07_17:
    speaker: sky
    en: Hm...
    ko: "……."
    ja: "……"
  d_main_48_07_18:
    speaker: sky
    en: Yeah, let's do it! We'll dive beneath that Heretic and match her rate of descent!
    ko: 좋습니다! 헬레틱 자식의 아래로 들어가, 강하 속도와 맞추겠습니다!
    ja: |-
      ラジャー！ヘレティックの下に回り込んで、
      降下速度に合わせるぜ…合わせます！
  d_main_48_07_19:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 쿠우우우우---!
    ja: ゴゴゴゴ…！！
  d_main_48_07_20:
    speaker: "<Narration>"
    en: Dorothy watches the scenery outside the window tilt sharply.
    ko: 도로시는 창밖으로 급격하게 기우는 풍경을 본다.
    ja: |-
      ドロシーは急激に傾きはじめた
      窓の外の景色に目をやった
  d_main_48_07_21:
    speaker: dorothy
    en: Hmm. It looks like we're making a steep turn. But I don't feel anything.
    ko: "…급선회를 하는 것 같은데, 내부에서는 느껴지지 않네요."
    ja: |-
      …そうとう傾けているようですが、
      中では感じられませんね。
  d_main_48_07_22:
    speaker: sora
    en: That's right! ♥ We retrofitted the bridge with active gimbal technology.
    ko: 예♥ 짐벌 기술을 활용한 능동형 브릿지로 개조했으니까요.
    ja: |-
      はい♥ブリッジにジンバル式の
      姿勢維持装置が採用されてますから。
  d_main_48_07_23:
    speaker: sora
    en: You can even drink tea in here without worrying about spilling ★
    ko: 차도 마실 수 있답니다★
    ja: ティータイムだって楽しめますよ★
  d_main_48_07_24:
    speaker: cielo
    en: Speaking of, would you like a cup?
    ko: 아, 말나온김에 한잔 드릴까요?
    ja: あ、せっかくですので一杯いかがですか？
  d_main_48_07_25:
    speaker: dorothy
    en: Just like last time, I'll have it when I get back.
    ko: 이번에도 다녀와서 마실게요.
    ja: 先日同様、戻ってからいただきます。
  d_main_48_07_26:
    speaker: cielo
    en: Hehe, all right! I'll have a warm cup of plum blossom tea waiting for you.
    ko: |-
      후후. 예.
      매화차로 준비해 놓겠습니다.
    ja: |-
      ふふっ。はい。
      プラムティーをご用意しておきますね。
  d_main_48_07_27:
    speaker: "<Narration>"
    en: Dorothy looks up from the deck of the Wings of Victory.
    ko: 도로시는 승리의 날개 호 갑판에서 위를 올려다본다.
    ja: ドロシーが勝利の翼号のデッキから空を見上げた
  d_main_48_07_28:
    speaker: "<Narration>"
    en: Annihilio is plummeting down at breakneck speed.
    ko: 애니힐리오가 맹렬한 기세로 떨어지고 있다.
    ja: アニヒリオが凄まじい速度で降下している
  d_main_48_07_29:
    speaker: "<Narration>"
    en: Dorothy raises her arm and aims at the sky.
    ko: 도로시는 팔을 들어 하늘을 겨눈다.
    ja: ドロシーは腕を上げ、空を狙った
  d_main_48_07_30:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_31:
    speaker: dorothy
    en: Look at you, Dorothy, fighting here like this.
    ko: 잘도 싸우고 있네, 나.
    ja: よく戦うものですね、私は。
  d_main_48_07_32:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 푸슝-!
    ja: バシュン――！
  d_main_48_07_33:
    speaker: "<Narration>"
    en: A beam of light erupts from Dorothy's gun barrel,
    ko: 도로시의 총구에서 빛이 뿜어져 나간다.
    ja: ドロシーの銃口から放たれた光が…
  d_main_48_07_34:
    speaker: "<Narration>"
    en: and pierces straight through Annihilio.
    ko: 애니힐리오를 관통한다.
    ja: アニヒリオを貫いた
  d_main_48_07_35:
    speaker: "<Narration>"
    en: Annihilio's posture falters. The light and flames spewing from her are completely
      extinguished.
    ko: |-
      애니힐리오의 자세가 휘청인다.
      뿜어져 나오던 빛과 불꽃이 모조리 꺼진다.
    ja: |-
      アニヒリオの体勢が崩れ、
      まき散らしていた光と炎が消えていく
  d_main_48_07_36:
    speaker: sora_op_c
    en: "... That was amazing. You hit the power source with a single shot."
    ko: "…대단해요. 한방에 동력원을 맞췄어요."
    ja: |-
      …すごい。
      一発で弱点に当てるなんて…
  d_main_48_07_37:
    speaker: cielo_op_l
    en: But don't forget that there's a separate main body.
    ko: 하지만 본체가 따로 있다는 것, 잊으시면 안 돼요.
    ja: |-
      でも、まだ中身が別にいることは
      お忘れではありませんよね。
  d_main_48_07_38:
    speaker: dorothy
    en: Of course.
    ko: 물론이에요.
    ja: 当然です。
  d_main_48_07_39:
    speaker: cielo_op_l
    en: Right. But if the warhead falls to the ground, the chemical payload will—
    ko: 앗. 그런데 탄두가 지상에 떨어지면 화학 무기가….
    ja: |-
      あ、それと、弾頭が
      そのまま地上に落ちたら化学兵器が…
  d_main_48_07_40:
    speaker: dorothy
    en: It's okay. I shot through the detonator while I was at it.
    ko: 괜찮아요. 기폭 장치도 한번에 뚫었으니까.
    ja: |-
      問題ありません。
      起爆装置も貫通しています。
  d_main_48_07_41:
    speaker: sora_op_c
    en: '... "Amazing" doesn''t begin to do you justice.'
    ko: "…대단하다는 말로는 모자라네요."
    ja: "…すごいどころじゃない…"
  d_main_48_07_42:
    speaker: cielo_op_l
    en: No kidding.
    ko: 그러게요.
    ja: ホントに…
  d_main_48_07_43:
    speaker: "<Narration>"
    en: Annihilio continues to fall.
    ko: 애니힐리오가 계속 떨어진다. 추락이다.
    ja: |-
      アニヒリオの高度が下がり続ける。
      墜落というべきか
  d_main_48_07_44:
    speaker: "<Narration>"
    en: Dorothy waits. She waits for Annihilio's armor to peel away and expose the
      main body.
    ko: |-
      도로시는 기다린다.
      애니힐리오의 장갑이 벗겨지고 본체가 튀어나오는 것을 기다린다.
    ja: |-
      ドロシーは、アニヒリオの外装が外れ
      中にあるものが飛び出す瞬間を待ち受けた
  d_main_48_07_45:
    speaker: "<Narration>"
    en: A piece of metal clanks as it flies off.
    ko: 툭. 투둑-
    ja: ピキ、ピキッ…
  d_main_48_07_46:
    speaker: "<Narration>"
    en: Then another, and another...
    ko: 투두두두두--
    ja: ドドドドドッ――
  d_main_48_07_47:
    speaker: "<Narration>"
    en: All of Annihilio's armor is stripped away.
    ko: 애니힐리오의 장갑이 모두 벗겨진다.
    ja: アニヒリオの外装がはがれ落ちた
  d_main_48_07_48:
    speaker: "<Narration>"
    en: Then, from within,
    ko: 그리고 그 내부에서
    ja: 中から飛び出してきたものは…
  d_main_48_07_49:
    speaker: "<Narration>"
    en: Monks with red eyes come pouring down.
    ko: 붉은 눈의 승려들이 쏟아져 내려온다.
    ja: 紅い目の、仙人然とした無数の人型だった
  d_main_48_07_50:
    speaker: sora_op_c
    en: "... Huh?"
    ko: "…어?"
    ja: "…え？"
  d_main_48_07_51:
    speaker: cielo_op_l
    en: "... What?"
    ko: "…아니."
    ja: "…うそ…"
  d_main_48_07_52:
    speaker: sky_op_r
    en: N-Nikkes...?!
    ko: 니, 니케…!?
    ja: ニ、ニケ…！？
  d_main_48_07_53:
    speaker: dorothy
    en: What the...?
    ko: "…이건 대체…."
    ja: "…これはいったい…"
  d_main_48_07_54:
    speaker: mirror_r
    en: Now then...
    ko: 자, 그럼.
    ja: さて、それでは…
  d_main_48_07_55:
    speaker: mirror_r
    en: Shall we make some new friends?
    ko: 동료를 만들어볼까요?
    ja: 私たちの新たな一員を増やしましょうか？
  d_main_48_07_56:
    speaker: "<Narration>"
    en: Dorothy watches the red-eyed monks pouring down.
    ko: 도로시는 쏟아져 내려오는 붉은 눈의 승려들을 본다.
    ja: ドロシーは飛び出してきた紅い眼の人型を数えた
  d_main_48_07_57:
    speaker: "<Narration>"
    en: There are 42 in total.
    ko: 수는 총 42.
    ja: 全部で42…
  d_main_48_07_58:
    speaker: "<Narration>"
    en: Their eyes are red. They are corrupted.
    ko: 눈이 붉다. 침식 상태다.
    ja: 眼の色は侵食のそれだ
  d_main_48_07_59:
    speaker: "<Narration>"
    en: Nikkes who have succumbed to corruption and can never return.
    ko: 침식에 걸린 니케는 다시 돌아올 수 없다.
    ja: 侵食されたニケは二度と元に戻らない
  d_main_48_07_60:
    speaker: "<Narration>"
    en: She has to shoot them.
    ko: 쏴야 한다.
    ja: 撃つしかない
  d_main_48_07_61:
    speaker: "<Narration>"
    en: But she hesitates for just a brief moment.
    ko: 하지만 아주 잠깐 망설인다.
    ja: だが、一瞬のためらいが生まれた
  d_main_48_07_62:
    speaker: "<Narration>"
    en: Taking advantage of the opening in that flash of an instant,
    ko: 그 찰나에 가까운 망설임을 놓치지 않고.
    ja: そのわずかな隙を突かれ…
  d_main_48_07_63:
    speaker: "<Narration>"
    en: one of the monks rushes forward,
    ko: 붉은 눈의 승려 중 하나가
    ja: 飛び出してきた赤い眼の人型が…
  d_main_48_07_64:
    speaker: "<Narration>"
    en: and thrusts the thorn in her hand directly into Dorothy.
    ko: 손에 들고 있는 가시를 도로시에게 찔러넣는다.
    ja: 手にした針をドロシーに突き刺した
  d_main_48_07_65:
    speaker: dorothy
    en: Hngh...!
    ko: 헉…!
    ja: う…！
  d_main_48_07_66:
    speaker: "<Narration>"
    en: "*Thud, thud, thud!*"
    ko: 쿵쿵쿵쿵쿵-!!
    ja: ダン、ダン、ダン、ダン――！
  d_main_48_07_67:
    speaker: "<Narration>"
    en: The monks land on the deck.
    ko: 붉은 눈의 승려들이 갑판에 착지한다.
    ja: 紅い目の人型がデッキに続々と乗り込んでくる
  d_main_48_07_68:
    speaker: "<Narration>"
    en: Some of their gazes shift towards the bridge.
    ko: |-
      일부의 시선이 돌아간다.
      브릿지를 향한다.
    ja: すでに視線をブリッジに向けている個体もある
  d_main_48_07_69:
    speaker: dorothy
    en: Agh...!
    ko: 큭…!
    ja: くっ…！
  d_main_48_07_70:
    speaker: "<Narration>"
    en: Dorothy fires at them,
    ko: 도로시는 방아쇠를 당긴다.
    ja: ドロシーが引き金を引いた
  d_main_48_07_71:
    speaker: "<Narration>"
    en: one after another after another.
    ko: 푸슝-! 푸슝-! 푸슝-!
    ja: バシュッ！バシュッ！バシュッ――！
  d_main_48_07_72:
    speaker: "<Narration>"
    en: The red-eyed monks fall.
    ko: 붉은 눈의 승려들이 쓰러진다.
    ja: 撃たれた人型は倒れ…
  d_main_48_07_73:
    speaker: "<Narration>"
    en: They vanish, emitting a blue light.
    ko: 푸른 빛을 내뿜으며 사라진다.
    ja: 青い光を放ちながら消えた
  d_main_48_07_74:
    speaker: dorothy
    en: No one leave the bridge under any circumstances!
    ko: 다들! 브릿지에서 절대 나오지 마요!
    ja: |-
      皆さん！
      ブリッジから絶対に出ないでください！
  d_main_48_07_75:
    speaker: "<Narration>"
    en: Dorothy runs.
    ko: 도로시가 달린다.
    ja: ドロシーは駆けた
  d_main_48_07_76:
    speaker: "<Narration>"
    en: She pushes her way through all of the red-eyed monks.
    ko: 붉은 눈의 승려들 사이를 헤집는다.
    ja: 紅い目の集団に向かって飛び込んでいく
  d_main_48_07_77:
    speaker: "<Narration>"
    en: Fortunately, their individual combat capabilities are not that high.
    ko: 다행히 각자의 전투 능력은 그다지 높지 않다.
    ja: 幸い、それぞれの戦闘力はそれほど高くない
  d_main_48_07_78:
    speaker: "<Narration>"
    en: She feels confident she can defeat them without much trouble.
    ko: 이 정도면 무난히 이겨낼 수 있을 것이라는 확신이 든다.
    ja: 勝てると言う確信はすぐに得られた
  d_main_48_07_79:
    speaker: "<Narration>"
    en: However...
    ko: 하지만
    ja: しかし…
  d_main_48_07_80:
    speaker: dorothy
    en: "... Hah."
    ko: "…하."
    ja: "…フフ…"
  d_main_48_07_81:
    speaker: dorothy
    en: Haha... hahaha.
    ko: 하하. 하하하.
    ja: ハハ…アハハハハ！！
  d_main_48_07_82:
    speaker: "<Narration>"
    en: Dorothy lets out a hollow, empty laugh,
    ko: 도로시는 허탈한 웃음을 내뱉으며
    ja: ドロシーは空虚な笑い声を上げながら…
  d_main_48_07_83:
    speaker: "<Narration>"
    en: and then points her weapon at the monks and shoots.
    ko: 붉은 눈의 승려들을 향해 방아쇠를 당긴다.
    ja: 紅い目の人型たちに向かって引き金を引き続けた
  d_main_48_07_84:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_85:
    speaker: "<Narration>"
    en: The monks are completely annihilated.
    ko: 붉은 눈의 승려들은 전멸했다.
    ja: 赤い眼の人型はすべて消えた
  d_main_48_07_86:
    speaker: "<Narration>"
    en: They leave behind no trace, almost as if they never even existed.
    ko: 아무런 흔적도 남기지 않고, 처음부터 없었던 것 마냥 사라졌다.
    ja: |-
      一切の痕跡を残さず、
      まるで初めからいなかったかのように
  d_main_48_07_87:
    speaker: "<Narration>"
    en: Dorothy gasps as she struggles to breathe.
    ko: |-
      도로시는 호흡을 몰아쉰다.
      숨이 가쁘다.
    ja: |-
      ドロシーは荒い息を吐いた。
      呼吸が苦しい
  d_main_48_07_88:
    speaker: "<Narration>"
    en: Her body is tingling.
    ko: 몸이 저릿저릿하다.
    ja: 体にしびれを感じる
  d_main_48_07_89:
    speaker: "<Narration>"
    en: Her vision is tinged with red.
    ko: 시야가 붉다.
    ja: 視界が赤くかすむ
  d_main_48_07_90:
    speaker: "<Narration>"
    en: She looks down at her hands.
    ko: 도로시는 자신의 손을 내려다 본다.
    ja: ドロシーは自分の手を確かめた
  d_main_48_07_91:
    speaker: "<Narration>"
    en: They are trembling ever so slightly.
    ko: 미세하게 떨리고 있다.
    ja: かすかに震えている
  d_main_48_07_92:
    speaker: sora_op_c
    en: Dorothy! Dorothy!
    ko: 도로시! 도로시!
    ja: ドロシー様！大丈夫ですか！？
  d_main_48_07_93:
    speaker: cielo_op_l
    en: Wait! I'm coming right now!
    ko: 기다려요! 지금 갈 테니까!
    ja: 少々お待ちください！すぐに行きます！！
  d_main_48_07_94:
    speaker: dorothy
    en: Don't!
    ko: 오지 마요!
    ja: 来ないで！
  d_main_48_07_95:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_48_07_96:
    speaker: sora_op_c
    en: Doro... thy.
    ko: 도로… 시.
    ja: ドロシー…様…？
  d_main_48_07_97:
    speaker: cielo_op_l
    en: But... the corruption...
    ko: 침식… 이….
    ja: 侵食…が…
  d_main_48_07_98:
    speaker: sky_op_r
    en: Divert! Head back to the Ark!
    ko: 방주로 긴급 회항!
    ja: アークに緊急帰還する！
  d_main_48_07_99:
    speaker: dorothy
    en: Stop! You can't bring a corrupted Nikke back to the Ark!
    ko: 그만! 방주로 침식된 니케를 데려가서 뭘 어쩌겠다는 건가요!
    ja: |-
      不要です！
      侵食されたニケを連れ帰ったところで
      どうにもなりません！
  d_main_48_07_100:
    speaker: cielo_op_l
    en: B-but...
    ko: 그럼… 어떻게….
    ja: じゃあ…どうすれば…
  d_main_48_07_101:
    speaker: "<Narration>"
    en: Dorothy's breathing grows ragged.
    ko: 도로시의 호흡이 거칠어진다.
    ja: ドロシーの呼吸がさらに荒くなった
  d_main_48_07_102:
    speaker: "<Narration>"
    en: The symptoms are progressing rapidly, more so than she's ever seen before.
    ko: 증상이 빠르다. 이렇게까지 빠르게 발현되는 건 처음이다.
    ja: |-
      症状の進行が早い。
      ここまで早く発現するものは見たことがない
  d_main_48_07_103:
    speaker: dorothy
    en: "... It must be... a modified strain... for war..."
    ko: "…개량형… 이겠네. 전쟁을 위한…."
    ja: "…改良されている…戦争のために…"
  d_main_48_07_104:
    speaker: "<Narration>"
    en: Dorothy lifts her head.
    ko: 도로시는 숙이고 있던 고개를 든다.
    ja: ドロシーが顔を上げた
  d_main_48_07_105:
    speaker: "<Narration>"
    en: She sees the vast surface stretching out beyond the deck.
    ko: 갑판 너머로, 광활하게 펼쳐져 있는 지상을 본다.
    ja: |-
      デッキの外に果てしなく広がる
      地上を眺め続けた
  d_main_48_07_106:
    speaker: "<Narration>"
    en: After a few moments,
    ko: 그러기를 잠시.
    ja: それからしばらくして…
  d_main_48_07_107:
    speaker: "<Narration>"
    en: Dorothy pulls a pistol from her pocket and places it below her chin.
    ko: 도로시는 품에서 권총을 꺼내들어 턱에 겨눈다.
    ja: |-
      ドロシーは胸元から取り出した拳銃の先端を
      自分のあごに当てた
  d_main_48_07_108:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_109:
    speaker: dorothy
    en: Still... I'm glad...
    ko: 그래도. 다행이야.
    ja: まぁ…幸いでした。
  d_main_48_07_110:
    speaker: dorothy
    en: I was able to forgive...
    ko: 용서할 수 있어서.
    ja: 赦すことができた後で。
  d_main_48_07_111:
    speaker: andersen
    en: Stop!
    ko: 그만!!
    ja: よせ！！
  d_main_48_07_112:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_48_07_113:
    speaker: andersen
    en: Stop! Don't pull that trigger! I'm going to kill you if you do!
    ko: 쏘지 마라! 쏘지 마! 쏘면 죽여버릴 거다!
    ja: |-
      撃つな！撃つんじゃない！
      撃ったら後悔させてやる！
  d_main_48_07_114:
    speaker: dorothy
    en: Comman...der...
    ko: 지휘… 관….
    ja: 指揮…官…？
  d_main_48_07_115:
    speaker: andersen
    en: Run, Dorothy! Run!
    ko: 도망가라 도로시! 도망가!
    ja: 逃げろ、ドロシー！どこでもいい！
  d_main_48_07_116:
    speaker: andersen
    en: Run as far away as you can!
    ko: 최대한 멀리 도망가!
    ja: できるだけ遠くだ！
  d_main_48_07_117:
    speaker: dorothy
    en: "... Commander, the corruption will erase me..."
    ko: "…지휘관. 침식은 자아를…."
    ja: "…指揮官、侵食されれば自我は…"
  d_main_48_07_118:
    speaker: andersen
    en: Shut up and run! Get away from there!
    ko: 닥치고 도망가! 거기서 벗어나!
    ja: いいから早く！そこから離れろ！
  d_main_48_07_119:
    speaker: andersen
    en: I promise you right now...!
    ko: 반드시…!
    ja: 絶対に…！
  d_main_48_07_120:
    speaker: andersen
    en: I'll bring you back!
    ko: 반드시 되돌려주겠다!
    ja: 絶対に元に戻してやる！
  d_main_48_07_121:
    speaker: andersen
    en: I promise!
    ko: 반드시다!
    ja: 必ずだ！
  d_main_48_07_122:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_123:
    speaker: andersen
    en: We have plenty of options!
    ko: 우리한텐 많은 방법이 있다!
    ja: やりようならいくらでもある！
  d_main_48_07_124:
    speaker: andersen
    en: So don't shoot! Put the gun down, damn it!
    ko: 그러니 쏘지 마! 총 내려놓으라고 이런 제기랄!
    ja: だから撃つな！銃を下ろせ…クソッ…！
  d_main_48_07_125:
    speaker: andersen
    en: Put it down! Don't shoot!
    ko: 내려놔! 쏘지 마라고!
    ja: とにかく！撃つんじゃない！
  d_main_48_07_126:
    speaker: dorothy
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  d_main_48_07_127:
    speaker: andersen
    en: We'll find you...!
    ko: 우리가 널 찾겠다…!
    ja: 捜しに行く…！
  d_main_48_07_128:
    speaker: andersen
    en: We'll find you and bring you back!
    ko: 찾아서, 반드시 되돌려 놓겠다…!
    ja: 見つけて、必ず元に戻してみせる…！
  d_main_48_07_129:
    speaker: andersen
    en: That's a promise, Dorothy.
    ko: 약속한다. 도로시.
    ja: 約束だ、ドロシー。
  d_main_48_07_130:
    speaker: andersen
    en: Believe in me.
    ko: 날 믿어라.
    ja: 私を信じてくれ。
  d_main_48_07_131:
    speaker: andersen
    en: Believe in me, your Commander.
    ko: 네 지휘관인, 나를 믿어.
    ja: 君の指揮官である、私を…
  d_main_48_07_132:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_133:
    speaker: dorothy
    en: Okay.
    ko: 믿을게요.
    ja: 信じます。
  d_main_48_07_134:
    speaker: dorothy
    en: Make sure you bring me back.
    ko: 꼭, 되돌려주세요.
    ja: 必ず、来てくださいね。
  d_main_48_07_135:
    speaker: andersen
    en: "... I will. I swear."
    ko: "…그래. 꼭이다."
    ja: "…ああ、必ずだ。"
  d_main_48_07_136:
    speaker: "<Narration>"
    en: Dorothy tosses the pistol aside.
    ko: 도로시가 권총을 집어던진다.
    ja: ドロシーが拳銃を放り投げた
  d_main_48_07_137:
    speaker: "<Narration>"
    en: She runs towards the edge of the deck,
    ko: 갑판 끝을 향해 달려간다.
    ja: デッキの先に向かって駆けだし…
  d_main_48_07_138:
    speaker: "<Narration>"
    en: and throws herself into the sky.
    ko: 그리고 하늘을 향해 몸을 던진다.
    ja: 空に向かって全速力で飛び出した
  d_main_48_07_139:
    speaker: andersen
    en: "... Wait for me, Dorothy. I'll come find you."
    ko: "…기다리고 있어라, 도로시. 찾아갈 테니."
    ja: |-
      …待っていてくれ、ドロシー。
      絶対に助けに行く。
  d_main_48_07_140:
    speaker: dorothy
    en: "... Yes, Commander."
    ko: "…예. 지휘관."
    ja: "…はい。指揮官。"
  d_main_48_07_141:
    speaker: "<Narration>"
    en: She disappears from view.
    ko: 도로시의 모습이 사라진다.
    ja: ドロシーの姿がかき消えた
  d_main_48_07_142:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_143:
    speaker: burningum
    en: Dorothy...
    ko: 도로시….
    ja: ドロシー…
  d_main_48_07_144:
    speaker: andersen
    en: Arrrgggh!
    ko: 으으아아아아--!!
    ja: うううううっ――！！
  d_main_48_07_145:
    speaker: "<Narration>"
    en: "*Bam!*"
    ko: 쿵-!
    ja: ドンッ！
  d_main_48_07_146:
    speaker: "<Narration>"
    en: Andersen slams his fist down onto the table.
    ko: 엔더슨이 테이블을 내려친다.
    ja: アンダーソンがテーブルを叩きつけた
  d_main_48_07_147:
    speaker: andersen
    en: Damn it! Damn the Queen, that bitch!
    ko: 아아! 젠장! 빌어먹을! 개같은 퀸 새X!!
    ja: |-
      クソ…クソッ！
      クソッタレのクイーンめ！！
  d_main_48_07_148:
    speaker: burningum
    en: Calm down. You still haven't fully recovered, so don't get too worked up.
    ko: 진정해. 몸도 성치 않으면서 너무 흥분하지 마.
    ja: |-
      落ち着くんだ。
      体も万全ではないだろう、
      そう興奮しては…
  d_main_48_07_149:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_150:
    speaker: andersen
    en: I don't care.
    ko: 싫어.
    ja: ムリだな。
  d_main_48_07_151:
    speaker: "<Narration>"
    en: "*Bam! Bam! Crash!*"
    ko: 쿵! 쿵! 와장창!
    ja: ドン！ガタン！ガシャーン！
  d_main_48_07_152:
    speaker: "<Narration>"
    en: Andersen goes on a rampage as he sends furniture flying—chairs, the table,
      and whatever else he can get off the ground.
    ko: 엔더슨이 날뛴다. 테이블이며, 의자며, 온갖 가구들이 나뒹군다.
    ja: |-
      アンダーソンは手当たり次第、
      物に当たり散らした。
      テーブルに、イスに、あらゆる物が転がった
  d_main_48_07_153:
    speaker: "<Narration>"
    en: Watching Andersen, Burningum feels both shocked and worried.
    ko: 버닝엄은 그런 엔더슨의 모습을 보며 놀람과 동시에 걱정을 느낀다.
    ja: |-
      バーニンガムは
      アンダーソンの取り乱しぶりに驚いたが、
      同時に心配した
  d_main_48_07_154:
    speaker: "<Narration>"
    en: After a while, Andersen stops his outburst.
    ko: 잠시 후, 엔더슨의 소란이 멈춘다.
    ja: |-
      しばらく経って、
      アンダーソンの怒りがようやく収まった
  d_main_48_07_155:
    speaker: "<Narration>"
    en: Burningum gets into position,
    ko: 버닝엄은 자세를 잡는다.
    ja: バーニンガムは構えていた
  d_main_48_07_156:
    speaker: "<Narration>"
    en: ready to catch Andersen the moment he collapses.
    ko: 엔더슨이 언제 쓰러지든 바로 잡을 수 있기 위함이다.
    ja: |-
      アンダーソンがいつ倒れても
      支えられるようにするためだ
  d_main_48_07_157:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_158:
    speaker: burningum
    en: "... What the?"
    ko: "…뭐지."
    ja: "…ん？"
  d_main_48_07_159:
    speaker: "<Narration>"
    en: Burningum stares intently at Andersen from behind.
    ko: 버닝엄이 엔더슨의 뒷모습을 빤히 바라본다.
    ja: バーニンガムはアンダーソンの後ろ姿を観察した
  d_main_48_07_160:
    speaker: "<Narration>"
    en: Something is wrong.
    ko: 뭔가 이상하다.
    ja: どこか違和感がある
  d_main_48_07_161:
    speaker: "<Narration>"
    en: Burningum stares even more intently at Andersen, trying to identify what feels
      off.
    ko: 이 이상한 느낌이 뭔지 알기 위해, 버닝엄은 엔더슨을 더욱 빤히 바라본다.
    ja: |-
      その理由を確かめようと、
      バーニンガムはアンダーソンの様子に
      目を凝らした
  d_main_48_07_162:
    speaker: "<Narration>"
    en: Suddenly, he figures it out.
    ko: 버닝엄은 이 이질감의 정체를 알아낸다.
    ja: 違和感の正体はすぐに分かった
  d_main_48_07_163:
    speaker: "<Narration>"
    en: Andersen's breathing hasn't faltered in the slightest.
    ko: 호흡이 조금도 흐트러지지 않았다.
    ja: 呼吸がまったく乱れていない
  d_main_48_07_164:
    speaker: "<Narration>"
    en: His shoulders aren't heaving, and he's not breathing raggedly.
    ko: 어깨도 들썩이지 않고, 거친 호흡 소리도 들려오지 않는다.
    ja: 肩も上下せず、荒い息の音もさせていない
  d_main_48_07_165:
    speaker: "<Narration>"
    en: Burningum freezes.
    ko: 버닝엄은 굳었다.
    ja: |-
      バーニンガムは
      どう動けばいいか分からなくなった
  d_main_48_07_166:
    speaker: "<Narration>"
    en: Silence fills the briefing room.
    ko: 고요함만이 브리핑 룸에 가득하다.
    ja: ブリーフィングルームは静まり返っている
  d_main_48_07_167:
    speaker: "<Narration>"
    en: "*Clang!*"
    ko: 터엉-!
    ja: ゴトン――！
  d_main_48_07_168:
    speaker: "<Narration>"
    en: Something metallic drops to the floor.
    ko: 강철 재질의 뭔가가 바닥에 떨어지는 소리.
    ja: 金属質の何かが床に落ち、音を響かせた
  d_main_48_07_169:
    speaker: "<Narration>"
    en: For a moment, Burningum feels as if his heart dropped along with it.
    ko: 버닝엄은 심장이 떨어지는 것 같은 착각을 느낀다.
    ja: |-
      バーニンガムはまるで
      自分の心臓を落としたような気がした
  d_main_48_07_170:
    speaker: "<Narration>"
    en: He looks down.
    ko: 소리가 들려온 바닥을 본다.
    ja: 音のした方を見ると…
  d_main_48_07_171:
    speaker: burningum
    en: That's...!
    ko: "…!!"
    ja: "…！！"
  d_main_48_07_172:
    speaker: "<Narration>"
    en: He sees the thing that had been restraining his hero,
    ko: 그곳에는 자신의 우상을 옭아메고 있던
    ja: |-
      そこに落ちていたのは、
      彼にとって憧れだった存在を縛り付けていた…
  d_main_48_07_173:
    speaker: "<Narration>"
    en: that cursed mechanical device, now lying on the floor.
    ko: 저주스러운 기계 장치가 널브러져 있었다.
    ja: 忌々しき機械装置だ
  d_main_48_07_174:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_175:
    speaker: burningum
    en: Andersen... Your... life support device... just fell...
    ko: "…엔더슨. 생명 유지 장치가… 지금… 떨어졌…."
    ja: |-
      …アンダーソン、生命維持装置が…
      落ちているぞ…
  d_main_48_07_176:
    speaker: andersen
    en: "... I don't need it anymore."
    ko: "…이제 필요 없다."
    ja: "…もう必要ない。"
  d_main_48_07_177:
    speaker: andersen
    en: I just get that feeling.
    ko: 그런 느낌이 들어.
    ja: そんな気がするんだ。
  d_main_48_07_178:
    speaker: "<Narration>"
    en: Andersen turns around.
    ko: 엔더슨이 뒤를 돈다.
    ja: アンダーソンが振り返った
  d_main_48_07_179:
    speaker: "<Narration>"
    en: Burningum takes a look at Andersen and immediately takes a few steps back.
    ko: 버닝엄은 엔더슨을 바라보다, 뒤로 몇 걸음 물러섰다.
    ja: その顔を見て、バーニンガムが後ずさりした
  d_main_48_07_180:
    speaker: "<Narration>"
    en: He rubs his eyes.
    ko: 버닝엄이 눈을 비빈다.
    ja: バーニンガムは目をこすった
  d_main_48_07_181:
    speaker: "<Narration>"
    en: His physical appearance hasn't changed,
    ko: 외형은 변함이 없다.
    ja: 見た目には変化がない
  d_main_48_07_182:
    speaker: "<Narration>"
    en: but there's now an energy emanating from his face and posture, a certain vitality.
    ko: 하지만 얼굴과 서 있는 자세에서 느껴지는 에너지. 생명력.
    ja: |-
      だが、顔と立ち姿からあふれだす気迫、
      何より生命力
  d_main_48_07_183:
    speaker: "<Narration>"
    en: Standing before Burningum is the man who was both his hero and his ideal,
    ko: 과거, 버닝엄의 우상이자 영웅이었던
    ja: かつてバーニンガムの憧れた英雄そのもの
  d_main_48_07_184:
    speaker: "<Narration>"
    en: the legendary Commander.
    ko: 전설의 지휘관이 버닝엄의 앞에 서 있었다.
    ja: 伝説の指揮官がバーニンガムの前に立っていた
  d_main_48_07_185:
    speaker: andersen
    en: "... Let's go up."
    ko: "…올라가자."
    ja: "…上がるぞ。"
  d_main_48_07_186:
    speaker: andersen
    en: To the surface.
    ko: 지상으로.
    ja: 地上へ。
  d_main_48_07_187:
    speaker: "<Narration>"
    en: Light illuminates the black space.
    ko: 검은 공간을 비추는 빛.
    ja: 漆黒の空間を光が照らしている
  d_main_48_07_188:
    speaker: "<Narration>"
    en: Marian embraces the core and the gene.
    ko: 마리안이 코어와 인자를 끌어안는다.
    ja: マリアンがコアと因子を抱き寄せた
  d_main_48_07_189:
    speaker: "<Narration>"
    en: She entrusts her consciousness to memories that are becoming clearer.
    ko: 더욱 선명해지는 기억 속으로 의식을 맡긴다.
    ja: |-
      ますます鮮明になっていく記憶の中へ
      意識を集中させる
  d_main_48_07_190:
    speaker: "<Monologue>"
    en: My name?
    ko: 내 이름?
    ja: 私の名前？
  d_main_48_07_191:
    speaker: unknown
    en: Yes. I've got to call you something, don't I?
    ko: 예. 언제까지나 당신이라고 부를 순 없으니까요.
    ja: |-
      はい。いつまでもあなたと
      呼んでいるわけにはいかないでしょう？
  d_main_48_07_192:
    speaker: "<Monologue>"
    en: Uh... well.
    ko: 어… 글쎄.
    ja: うーん…そうだな
  d_main_48_07_193:
    speaker: "<Monologue>"
    en: Everyone used to call me No. 7.
    ko: 다들 7호라고 부르던데.
    ja: 周りからは7号と呼ばれていた
  d_main_48_07_194:
    speaker: unknown
    en: So should I call you No. 7? That feels weird.
    ko: |-
      그럼 7호씨라고 부르면 되나요?
      이상한데요.
    ja: |-
      7号と呼べばいいということですか？
      なんだかヘンな感じですね。
  d_main_48_07_195:
    speaker: "<Monologue>"
    en: Yeah, it does feel a little weird.
    ko: 그건 좀 이상하긴 하다.
    ja: それもそうだ
  d_main_48_07_196:
    speaker: unknown
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_197:
    speaker: unknown
    en: You said your dream was to become a commander, right?
    ko: 지휘관이 꿈이라고 했죠?
    ja: |-
      指揮官になるのが
      夢だって言ってましたよね？
  d_main_48_07_198:
    speaker: "<Monologue>"
    en: Yeah.
    ko: 응.
    ja: ああ
  d_main_48_07_199:
    speaker: "<Monologue>"
    en: I made a promise with that child.
    ko: 약속했거든. 그 아이랑.
    ja: 約束したんだ、あの子と
  d_main_48_07_200:
    speaker: unknown
    en: "... What child?"
    ko: "…그 아이… 라면 누구요?"
    ja: "…あの子…というのは？"
  d_main_48_07_201:
    speaker: "<Monologue>"
    en: "... Hmm. I'm sorry. I can't really remember."
    ko: "…음. 미안. 기억이 잘 안나."
    ja: |-
      …ああ、すまない。
      よく覚えていないんだ
  d_main_48_07_202:
    speaker: "<Monologue>"
    en: But...
    ko: 그런데… 엄청.
    ja: だが…とても…
  d_main_48_07_203:
    speaker: "<Monologue>"
    en: I remember she was incredibly dear to me.
    ko: 소중한 사람이었다는 건 기억 나.
    ja: 大切な人だったということだけ覚えている
  d_main_48_07_204:
    speaker: unknown
    en: "... I see."
    ko: "…그렇군요."
    ja: "…そうですか。"
  d_main_48_07_205:
    speaker: unknown
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_206:
    speaker: unknown
    en: Then, I will call you Commander.
    ko: 그럼, 지휘관이라고 부를게요.
    ja: では、指揮官とお呼びしますね。
  d_main_48_07_207:
    speaker: "<Monologue>"
    en: Er, I'm not so sure about that.
    ko: 아니. 그건 좀.
    ja: いや、それもちょっと…
  d_main_48_07_208:
    speaker: "<Monologue>"
    en: It'd be kind of embarrassing when I just graduated from the military academy
      yesterday.
    ko: 어제 갓 사관학교를 졸업했는데 지휘관이라고 부르면 민망해.
    ja: |-
      きのう士官学校を卒業したばかりで、
      そう呼ばれると気恥ずかしい
  d_main_48_07_209:
    speaker: unknown
    en: So what? It's just the two of us.
    ko: 뭐 어때요. 우리 둘 뿐인데.
    ja: |-
      いいじゃないですか。
      私たち二人だけのことなんですから。
  d_main_48_07_210:
    speaker: unknown
    en: It should be fine, right?
    ko: 괜찮죠?
    ja: 構いませんよね？
  d_main_48_07_211:
    speaker: "<Monologue>"
    en: '... All right. "Commander" it is.'
    ko: "…그래. 그렇게 불러줘."
    ja: "…ああ、それでいい"
  d_main_48_07_212:
    speaker: "<Monologue>"
    en: Now, what should I call you?
    ko: 그럼, 너는 뭐라고 부르면 돼?
    ja: それで、君のことはどう呼べば？
  d_main_48_07_213:
    speaker: unknown
    en: I'm...
    ko: 아, 저는
    ja: ああ、私は…
  d_main_48_07_214:
    speaker: unknown
    en: Maria...
    ko: 마리아-
    ja: マリア――
  d_main_48_07_215:
    speaker: onlyone_c
    en: "... Wow."
    ko: "…와아."
    ja: "…わぁ。"
  d_main_48_07_216:
    speaker: onlyone_c
    en: You're so beautiful.
    ko: 언니. 엄청 예뻐.
    ja: お姉ちゃん、とってもきれい。
  d_main_48_07_217:
    speaker: onlyone_c
    en: You really look like a Queen.
    ko: 진짜 여왕 같아.
    ja: 女王様みたい。
  d_main_48_07_218:
    speaker: marian_q
    en: Hehe. Thank you.
    ko: 후후. 고마워요.
    ja: ふふ、ありがとうございます。
  d_main_48_07_219:
    speaker: "<Narration>"
    en: Marian gazes at the sky outside the window.
    ko: 마리안이 창 밖의 하늘을 바라본다.
    ja: マリアンが窓の外の空を眺めた
  d_main_48_07_220:
    speaker: "<Narration>"
    en: There is a radiance in her eyes that sparkles, as though the whole world is
      in her embrace.
    ko: 그 눈에 담긴 광채가, 모든 것을 끌어안듯 빛난다.
    ja: |-
      すべてを包み込むような光が、
      瞳の中に宿っている
  d_main_48_07_221:
    speaker: marian_q
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  d_main_48_07_222:
    speaker: marian_q
    en: This time...
    ko: 이번에야말로.
    ja: 今度こそ…
  d_main_48_07_223:
    speaker: marian_q
    en: I promise to keep you safe.
    ko: 제가 반드시 지켜드릴게요.
    ja: 私が必ず、お守りします。
  d_main_48_07_224:
    speaker: leviathan
    en: "... Wait. Everyone, hold on."
    ko: "…잠깐. 다들 기다려."
    ja: "…待って。みんな、ちょっと。"
  d_main_48_07_225:
    speaker: behemoth
    en: What's wrong, Levi?
    ko: 레비. 갑자기 왜 그래?
    ja: レヴィ、急にどうした？
  d_main_48_07_226:
    speaker: leviathan
    en: "... It's moving."
    ko: "…움직여."
    ja: "…動いてるの…"
  d_main_48_07_227:
    speaker: leviathan
    en: The Lift.
    ko: 궤도 엘리베이터가.
    ja: 軌道エレベーター。
  d_main_48_07_228:
    speaker: "<Monologue>"
    en: I turn my head and look back.
    ko: 고개를 돌려 궤도 엘리베이터를 바라본다.
    ja: 顔を上げ、軌道エレベーターを見た
  d_main_48_07_229:
    speaker: "<Monologue>"
    en: The monumental Lift is wriggling, covered in Dark Matter.
    ko: 다크 매터로 뒤덮이다시피 한 궤도 엘리베이터가 꿈틀댄다.
    ja: |-
      ダークマターに覆われた軌道エレベーターが
      うごめいている
  d_main_48_07_230:
    speaker: "<Monologue>"
    en: "... It's enough to warp your sense of reality, seeing something that massive
      moving like liquid."
    ko: |-
      …현실감이 망가지는 느낌이다.
      저렇게 거대한 것이 액체처럼 움직이고 있다.
    ja: |-
      …現実離れした光景だ。
      巨大な建物が液体のように震えている
  d_main_48_07_231:
    speaker: behemoth
    en: "... What's it doing?"
    ko: "…저거, 뭐 하는 거야?"
    ja: "…あれ、何やってんだ？"
  d_main_48_07_232:
    speaker: ziz
    en: Y-you don't think it's...
    ko: "…서, 설마."
    ja: "…ま、まさか…"
  d_main_48_07_233:
    speaker: leviathan
    en: The way it's moving... Yeah.
    ko: 저 움직임. 틀림없어.
    ja: あの動き。間違いないよ…
  d_main_48_07_234:
    speaker: leviathan
    en: It's transforming.
    ko: 거대화야.
    ja: 巨大化しようとしてる。
  d_main_48_07_235:
    speaker: "<Monologue>"
    en: Suddenly from the Lift,
    ko: 궤도 엘리베이터에서
    ja: 軌道エレベーターから…
  d_main_48_07_236:
    speaker: "<Monologue>"
    en: a shockwave erupts together with black light.
    ko: 검은 빛과 충격파가 터져나왔다.
    ja: 黒い光と衝撃波があふれ出した
  d_main_48_07_237:
    speaker: "<Monologue>"
    en: I squeeze my eyes shut,
    ko: 눈을 질끈 감는다.
    ja: 目を開けていられない
  d_main_48_07_238:
    speaker: "<Monologue>"
    en: and then open them a moment later.
    ko: 그리고 잠시 후, 눈을 뜬다.
    ja: しばらくして、ようやく目を開けると…
  d_main_48_07_239:
    speaker: "<Monologue>"
    en: The colossal Lift is gone, now vanished without a trace.
    ko: 궤도 엘리베이터가 없다. 그 거대한 것이 흔적도 없이 사라져있다.
    ja: |-
      あの巨大な軌道エレベーターは
      跡形もなく消えていた
  d_main_48_07_240:
    speaker: "<Monologue>"
    en: Instead, filling my entire field of vision,
    ko: 대신 내 시야를 가득 채우고 있는 것은
    ja: |-
      その代わりに、視界を覆うがごとく
      伸びあがっているものは
  d_main_48_07_241:
    speaker: "<Monologue>"
    en: is something so enormous that I can't even take it all in at once.
    ko: 한 눈에 다 들어오지도 않을 정도로 거대한
    ja: |-
      一目で全てを見ることができないほど、
      巨大な――
  d_main_48_07_242:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_243:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_244:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_245:
    speaker: snowwhite_h
    en: "... She's mocking us."
    ko: "…까불고 있군."
    ja: "…思いあがっているな。"
  d_main_48_07_246:
    speaker: hongryeon
    en: "... Indeed, she flouts us downright."
    ko: "…그래. 아주 까불고 있어."
    ja: "…ああ。そのようだ。"
  d_main_48_07_247:
    speaker: rapunzel
    en: You know, I don't think I've ever been this angry in my entire life.
    ko: 저 말이죠. 살면서 이렇게까지 화난 적은 처음인 것 같아요.
    ja: これほどの怒りを感じたことは初めてです。
  d_main_48_07_248:
    speaker: hongryeon
    en: Nor I...!
    ko: 마찬가지일세…!
    ja: 私もだ…！
  d_main_48_07_249:
    speaker: snowwhite_h
    en: "... I'm going to kill her."
    ko: "…죽여주마."
    ja: "…破壊する。"
  d_main_48_07_250:
    speaker: snowwhite_h
    en: I swear, I'm going to kill her!
    ko: 반드시, 죽여주마!
    ja: 破壊してやる。必ずだ！
  d_main_48_07_251:
    speaker: snowwhite_h
    en: I will kill the Queen!
    ko: 퀸--!!
    ja: クイーン――！！
  d_main_48_07_252:
    speaker: "<Monologue>"
    en: Towering before us is the statue of the Goddess of Victory.
    ko: 승리의 여신상이었다.
    ja: 勝利の女神像だった
  d_main_48_07_253:
    speaker: leviathan
    en: "... It's moving."
    ko: "…움직인다."
    ja: "…動いた。"
  d_main_48_07_254:
    speaker: "<Monologue>"
    en: The statue of the Goddess of Victory moves.
    ko: 승리의 여신상이 움직인다.
    ja: 勝利の女神像は動いていた
  d_main_48_07_255:
    speaker: "<Monologue>"
    en: It changes directions,
    ko: 방향을 튼다.
    ja: どこかを向き…
  d_main_48_07_256:
    speaker: "<Monologue>"
    en: and then slowly starts to advance forward.
    ko: 그리고, 서서히 전진한다.
    ja: ゆっくりと前進を始めている
  d_main_48_07_257:
    speaker: "<Monologue>"
    en: The ground trembles, and the air itself seems to shriek.
    ko: 지축이 흔들리고, 공기가 비명을 지르는 것만 같다.
    ja: 大地が震え、空気は悲鳴を上げた
  d_main_48_07_258:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_48_07_259:
    speaker: rapi_red
    en: Commander.
    ko: 지휘관.
    ja: 指揮官…
  d_main_48_07_260:
    speaker: rapi_red
    en: The Queen...
    ko: 퀸은 지금
    ja: クイーンの進行方向は…
  d_main_48_07_261:
    speaker: rapi_red
    en: She's heading to the Ark.
    ko: 방주 방향으로 향하고 있습니다.
    ja: アークの方角です。
