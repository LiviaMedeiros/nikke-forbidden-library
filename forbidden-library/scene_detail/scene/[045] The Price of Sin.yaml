---
d_main_45_01:
  d_main_45_01_1:
    speaker: snowwhite_h
    en: "... You heard from Nayuta?"
    ko: "…나유타에게서 연락이?"
    ja: "…ナユタから連絡が？"
  d_main_45_01_2:
    speaker: cecil
    en: Yes. She said something is bothering her, and proposed a joint investigation.
    ko: 예. 신경 쓰이는 것이 있다고 함께 수색을 제안했어요.
    ja: |-
      ええ。気になることがあるので
      調査に戦力が欲しい、とのことです。
  d_main_45_01_3:
    speaker: snowwhite_h
    en: All right. What's the location?
    ko: 좋다. 위치는?
    ja: そうか。場所は？
  d_main_45_01_4:
    speaker: cecil
    en: That's what has me a bit concerned.
    ko: 그 위치가 좀 신경 쓰이는데….
    ja: その場所というのが、少し気がかりで…
  d_main_45_01_5:
    speaker: cecil
    en: It's the Lift.
    ko: 궤도 엘리베이터예요.
    ja: 軌道エレベーターです。
  d_main_45_01_6:
    speaker: snowwhite_h
    en: "... The Lift?"
    ko: "…궤도 엘리베이터?"
    ja: "…軌道エレベーター？"
  d_main_45_01_7:
    speaker: cecil
    en: I suppose it's more accurate to say the route leading to it.
    ko: 정확히는 가는 길이라고 해야겠네요.
    ja: 正確には、そこまでの道、でしょうか。
  d_main_45_01_8:
    speaker: cecil
    en: Unlike the area immediately surrounding the Lift, there shouldn't be too many
      Raptures there.
    ko: |-
      궤도 엘리베이터 인근처럼,
      랩쳐들이 무식하게 많지는 않을 거예요.
    ja: |-
      軌道エレベーター直下ほどの
      敵性戦力は存在しないはずです。
  d_main_45_01_9:
    speaker: snowwhite_h
    en: I see...
    ko: "……."
    ja: "……"
  d_main_45_01_10:
    speaker: cecil
    en: Are you afraid?
    ko: 겁먹은 건가요?
    ja: やはり心配ですか？
  d_main_45_01_11:
    speaker: snowwhite_h
    en: Of course not. Do you have the coordinates?
    ko: 그럴 리가. 좌표는?
    ja: いや。座標は？
  d_main_45_01_12:
    speaker: cecil
    en: Nayuta gave us a rendezvous point.
    ko: 랑데부 포인트를 나유타가 지정해 줬어요.
    ja: ナユタから合流地点の座標を受け取っています。
  d_main_45_01_13:
    speaker: cecil
    en: She wants you to wait for her there.
    ko: 거기서 기다리고 있으면 되겠네요.
    ja: そこへ向かってください。
  d_main_45_01_14:
    speaker: papillon
    en: Wait, you're really going?
    ko: 잠깐. 진짜 가는 거야?
    ja: 待って。ホントに行く気？
  d_main_45_01_15:
    speaker: snowwhite_h
    en: Don't worry, I won't ask you to come. Just focus on your training.
    ko: |-
      너보고 같이 가자고 하지 않을 테니 안심해라.
      너는 훈련에만 집중해라.
    ja: |-
      安心しろ、お前に来てくれとは言わない。
      ここで訓練に集中していろ。
  d_main_45_01_16:
    speaker: papillon
    en: Oh, I wasn't worried about that. I never expected you to take me along.
    ko: 아니. 당연히 나를 데려가진 않을 거라 생각했어서 기분은 안 나쁜데.
    ja: |-
      連れ出されるなんて思ってないし、
      それは別にいいの。
  d_main_45_01_17:
    speaker: papillon
    en: But if you go, this place will be completely empty.
    ko: 너 가면 여기 완전 텅텅 비어.
    ja: |-
      あなたが行っちゃったら、
      ここの戦力が空っぽでしょ。
  d_main_45_01_18:
    speaker: papillon
    en: "... What if there's another attack?"
    ko: "…그때처럼 또 몰려들면 어떡해?"
    ja: "…また襲撃でもされたらどうするの？"
  d_main_45_01_19:
    speaker: snowwhite_h
    en: Then fight them off.
    ko: 네가 막아라.
    ja: お前が守れ。
  d_main_45_01_20:
    speaker: papillon
    en: Do you think we'd be having this conversation if I thought I could do that?
    ko: 그게 될 것 같으면 내가 이렇게 걱정하는 표정이랑 말투로 얘기하겠어?
    ja: |-
      それができたら、
      こんな心配そうに聞くワケないでしょ？
  d_main_45_01_21:
    speaker: johan
    en: It'll be fine. Go.
    ko: 괜찮다. 다녀와라.
    ja: 問題ない。行ってくれ。
  d_main_45_01_22:
    speaker: papillon
    en: Care to explain what you mean by "fine"?
    ko: 뭐가 괜찮은지는 좀 설명해 주면 안 될까?
    ja: どう問題ないのか、説明してくれる？
  d_main_45_01_23:
    speaker: johan
    en: You-know-who said he'd send reinforcements.
    ko: 그 녀석이 지원군을 보내준다고 했다.
    ja: あいつが援軍を送ると言っている。
  d_main_45_01_24:
    speaker: papillon
    en: Oh? Honey's sending reinforcements? From the Ark?
    ko: 오. 허니가 지원군 보내준대? 방주에서 올라오는 거야?
    ja: |-
      へぇ。ハニーが？
      アークから来てくれるってこと？
  d_main_45_01_25:
    speaker: johan
    en: "... No."
    ko: "…아니."
    ja: "…いや。"
  d_main_45_01_26:
    speaker: papillon
    en: Then from where?
    ko: "…그럼?"
    ja: "…じゃ、何が来るの？"
  d_main_45_01_27:
    speaker: johan
    en: Hm...
    ko: "……."
    ja: "……"
  d_main_45_01_28:
    speaker: johan
    en: You'll have to see for yourself.
    ko: 직접 보는 게 나을 거다.
    ja: 直接見た方がいいだろう。
  d_main_45_01_29:
    speaker: johan
    en: To be honest, I still can't really believe it.
    ko: 솔직히 나도 아직 믿기지 않는다.
    ja: 正直なところ、私もまだ半信半疑だ。
  d_main_45_01_30:
    speaker: johan
    en: I doubt I'll be completely convinced until it actually happens.
    ko: 직접 보기 전까진 믿을 수 없다.
    ja: 実物を見るまでは何も言えん。
  d_main_45_01_31:
    speaker: papillon
    en: "... Huh?"
    ko: "??"
    ja: "？？"
  d_main_45_01_32:
    speaker: johan
    en: Regardless, we should be able to hold out until they arrive, even if they
      get delayed.
    ko: 그리고 지원군이 늦더라도, 그때까진 버텨낼 수 있을 거다.
    ja: |-
      仮に援軍の到着が予定より遅れるとしても、
      それまでの時間は十分稼げる。
  d_main_45_01_33:
    speaker: cecil
    en: Indeed. We've expanded the range of our optical camouflage and refined Eden's
      Spear.
    ko: 예. 광학미채 범위도 넓혔고, 에덴의 창도 손봤으니까요.
    ja: |-
      そうですね。光学迷彩の
      展開範囲も拡大しましたし、
      エデンの槍も改良しました。
  d_main_45_01_34:
    speaker: cecil
    en: We can hold out for several days, barring a visit from the Queen herself.
    ko: 퀸이 직접 오지 않는 이상 며칠은 버틸 수 있겠죠.
    ja: |-
      クイーンが直々に現れない限り、
      数日は持ちこたえられるでしょう。
  d_main_45_01_35:
    speaker: cecil
    en: Should that happen... we won't last half a day.
    ko: 퀸이 직접 오면 반나절도 못 버티겠지만요.
    ja: |-
      まあ、もし出て来られた場合
      半日と耐えられませんが。
  d_main_45_01_36:
    speaker: snowwhite_h
    en: It sounds like you're telling me not to go.
    ko: 가지 말라는 얘기처럼 들리는군.
    ja: 行くなといっているように聞こえるな。
  d_main_45_01_37:
    speaker: johan
    en: Quite the opposite. We're saying you can go without worry.
    ko: 아니. 안심하고 가라는 얘기다.
    ja: いや。安心して行けと言っている。
  d_main_45_01_38:
    speaker: johan
    en: It's critical that we gather more intel, especially now, when we don't know
      what the Queen intends to do.
    ko: |-
      정보는 중요하다.
      지금처럼 퀸이 무슨 짓을 할지 모르는 상태에서는 더더욱.
    ja: |-
      情報収集が最優先だ。
      クイーンは何を企んでいるか
      分からない今は、特にな。
  d_main_45_01_39:
    speaker: johan
    en: Go.
    ko: 다녀와라.
    ja: 行ってこい。
  d_main_45_01_40:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_41:
    speaker: snowwhite_h
    en: All right. I'll be off, then.
    ko: 그래. 다녀오겠다.
    ja: 分かった。行ってくる。
  d_main_45_01_42:
    speaker: "<Narration>"
    en: Snow White walks away.
    ko: 스노우 화이트가 걸어갔다.
    ja: スノーホワイトがその場を去った
  d_main_45_01_43:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_44:
    speaker: papillon
    en: When do you think we'll be able to produce Nikkes? Has Honey contacted you?
    ko: |-
      니케 제작 기술은 언제쯤 받을 수 있을까?
      허니한테 연락은 왔어?
    ja: |-
      ニケの製造技術の情報は、いつ頃届くの？
      ハニーから連絡は？
  d_main_45_01_45:
    speaker: johan
    en: That technology is as classified as it gets. We won't get our hands on it
      overnight.
    ko: |-
      니케 제작 기술은 극비 중의 극비일 거다.
      하루아침에 될 일은 아니겠지.
    ja: |-
      極秘中の極秘と言える機密情報だ。
      すぐにとはいかないだろう。
  d_main_45_01_46:
    speaker: papillon
    en: Hm...
    ko: 흠….
    ja: はぁ…
  d_main_45_01_47:
    speaker: papillon
    en: I hope he's all right...
    ko: 허니. 잘하고 있겠지?
    ja: ハニー…大丈夫よね？
  d_main_45_01_48:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_49:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_50:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_51:
    speaker: "<Monologue>"
    en: In the CEO's office at Elysion...
    ko: 엘리시온 CEO실.
    ja: エリシオン社・社長室
  d_main_45_01_52:
    speaker: "<Monologue>"
    en: We've come to meet Ingrid, but her silence is so imposing that none of us
      can bring ourselves to speak.
    ko: 잉그리드와 만나기 위해 온 우리들은 끔찍한 침묵 안에서 아무 말도 꺼내지 못했다.
    ja: |-
      イングリッドと面会中の私たちは、
      恐ろしいほどの静寂に飲まれ
      何も言えずにいた
  d_main_45_01_53:
    speaker: "<Monologue>"
    en: She sighs as she looks over Neon's new body, then furrows her brow, then opens
      her mouth as if to scold her before closing it again and falling back into thought.
    ko: 잉그리드는 네온의 새로운 바디를 보면서 한숨을 내쉬었다가, 미간을 찌푸렸다가, 화를 내려다가 말고, 생각에 잠기기를 반복했다.
    ja: |-
      イングリッドはネオンの新しいボディを見て
      ため息をついたり、眉間にしわを寄せたり、
      小言を言いかけたり、考え込んだりしている
  d_main_45_01_54:
    speaker: "<Monologue>"
    en: She repeats this over and over for a full ten minutes.
    ko: 그러기를 10분이라는 시간이 지났다.
    ja: もう10分ほどそうしているだろうか
  d_main_45_01_55:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_56:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_57:
    speaker: rapi_red
    en: Tactics.
    ko: 택티컬.
    ja: タクティカル。
  d_main_45_01_58:
    speaker: anis_i
    en: Entertainment.
    ko: 엔터테인먼트.
    ja: エンターテイメント。
  d_main_45_01_59:
    speaker: "<Self>"
    en: Wh-what...?
    ko: 왜, 왜들 그러는 거야 갑자기.
    ja: ど、どうした急に？
  d_main_45_01_60:
    speaker: rapi_red
    en: It was so quiet, I thought someone should say something.
    ko: 너무 조용하길래 한마디해 봤습니다.
    ja: |-
      あまりにも静かなので、
      何か音を立てないといけない気がして…
  d_main_45_01_61:
    speaker: anis_i
    en: Yeah, the silence was killing me too...
    ko: 나도 너무 조용해서 그냥….
    ja: 私もちょっと、静かすぎたから…
  d_main_45_01_62:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_63:
    speaker: neon_v
    en: Technology.
    ko: 테크놀로지.
    ja: テクノロジー。
  d_main_45_01_64:
    speaker: ingrid
    en: You're an Elysion Nikke! Don't say the Missilis slogan!
    ko: 이 놈! 엘리시온의 니케가 미사일스의 슬로건을 말하다니!
    ja: |-
      バカもの！エリシオンのニケともあろう者が
      ミサイルスの標語を口にするとは！
  d_main_45_01_65:
    speaker: neon_v
    en: I mean, you were just staring at me without saying anything...
    ko: 아니, 사장님이 너무 아무 말도 안 하고 쳐다만 보시길래….
    ja: 社長が何も言ってくださらないので…
  d_main_45_01_66:
    speaker: ingrid
    en: "*Sigh...*"
    ko: "…하아."
    ja: "…はぁ…"
  d_main_45_01_67:
    speaker: ingrid
    en: This is the first time an Elysion Nikke has ever transferred into a Missilis
      body.
    ko: 엘리시온의 니케가 갑자기 미실리스의 바디로 환장하고 온 케이스는 처음이다.
    ja: |-
      エリシオンのニケが
      いきなりミシリス製のボディに
      換装されるケースなど、前例がない。
  d_main_45_01_68:
    speaker: ingrid
    en: Frankly, I have no clue what to do about it, let alone what to say.
    ko: 솔직히 말하면 뭘 어떻게 해결해야 할지 감도 오지 않는군.
    ja: |-
      正直に言って、何を言うべきかも
      まったく見当がつかない事態だ。
  d_main_45_01_69:
    speaker: anis_i
    en: Really? I figured you'd say something like, "This calls for a tactical approach!"
    ko: 의외네. 택티컬하게 해결하면 그만이다고 할 줄 알았는데.
    ja: |-
      意外ね。
      タクティカルな対処が必要だ！とか
      言いだすと思ったのに。
  d_main_45_01_70:
    speaker: ingrid
    en: You can't use that word for just anything.
    ko: 택티컬을 아무 데나 갖다 붙이지 마라.
    ja: |-
      なんでもタクティカルを付ければ
      いいというものではない。
  d_main_45_01_71:
    speaker: anis_i
    en: Says the one who uses it for everything...
    ko: 아무 데나 갖다 붙이는 게 누군데….
    ja: どの口が言ってるのかしら…
  d_main_45_01_72:
    speaker: ingrid
    en: I spoke with the representative from M.M.R.
    ko: M.M.R.의 담당자와 이야기는 끝마쳤다.
    ja: M.M.R.の担当者とは話がついている。
  d_main_45_01_73:
    speaker: ingrid
    en: They've agreed that your affiliation is to remain with Elysion, and we will
      continue to take full responsibility for you.
    ko: 네 소속은 지금처럼 엘리시온 소속인 것에 이견 없으며, 관리 주체가 모두 엘리시온이 되어도 상관없다는 확답을 받았다.
    ja: |-
      お前の所属に関しては現状維持、
      管理もエリシオン主体で構わないとのことだ。
  d_main_45_01_74:
    speaker: ingrid
    en: The issue is that your specifications are rather singular.
    ko: 문제는, 네 바디가 단일 사양이라는 것이다.
    ja: |-
      問題は、そのボディが
      きわめて特殊な仕様ということだな。
  d_main_45_01_75:
    speaker: neon_v
    en: Of course they are. I'm special! Completely one of a kind!
    ko: 그렇죠. 저는 단 한 명뿐인 소중한 존재니까.
    ja: |-
      それはそうでしょう。
      私はたった一人の大切な存在ですから。
  d_main_45_01_76:
    speaker: ingrid
    en: That means that every time you need repairs, you'll have to go to Missilis.
    ko: 고칠 때마다 미실리스로 가야 한다는 얘기다.
    ja: |-
      修理が必要になるたびに
      ミシリスへ出向くことになるぞ。
  d_main_45_01_77:
    speaker: neon_v
    en: "... Come again?"
    ko: "??"
    ja: "？？"
  d_main_45_01_78:
    speaker: ingrid
    en: All your parts, as well as their implementation, are proprietary. On top of
      that, they're too advanced for us.
    ko: |-
      부품과 양식이 모두 전용의 양식이다.
      거기다 기술 수준이 너무 높아.
    ja: |-
      部品単体から構造そのものまで、
      何もかもが特別仕様だ。
      そのうえ技術レベルが高すぎる。
  d_main_45_01_79:
    speaker: ingrid
    en: Regrettably, Elysion in its current state cannot fully comprehend all of the
      technology in your body.
    ko: 안타깝지만 지금의 엘리시온으로는 네 바디에 적용된 기술을 전부 이해하지 못한다.
    ja: |-
      歯がゆいが、今のエリシオンでは
      そのボディに使われている技術を
      理解しきることすらできない。
  d_main_45_01_80:
    speaker: ingrid
    en: They say you're immune to E2 Crystals, Dark Matter... even corruption, at
      least in theory.
    ko: "E2 크리스탈은 물론, 다크 매터…. \n이론상으로는 침식마저 면역이라고 했던가."
    ja: |-
      E2クリスタルをはじめ、ダークマターや…
      理論上は、侵食にさえも耐性があるそうだな。
  d_main_45_01_81:
    speaker: ingrid
    en: It's absurd... Such convenient technology is far removed from what it means
      to be tactical.
    ko: |-
      터무니없군.
      면역같이 쓰기 편한건 택티컬과는 거리가 멀다.
    ja: |-
      実に認めがたい。
      そのような都合のいい技術が存在するなど、
      タクティカルとは正反対だ。
  d_main_45_01_82:
    speaker: ingrid
    en: Overcoming weakness through strategy is the very essence of tactics...
    ko: 약점을 전술적으로 극복하는 것이야말로 택티컬의 진수이거늘….
    ja: |-
      弱点を戦術によって克服することこそが
      タクティカルの極致だというのに…
  d_main_45_01_83:
    speaker: ingrid
    en: In any case, only Missilis is capable of engineering bodies with such technology.
    ko: 아무튼, 이 면역 기술은 물론 특정 기술을 바디 구축 시 집어넣을 수 있는 건 미실리스만이 가능하다.
    ja: |-
      …とにかく、その耐性も含めて、
      ボディ構築が可能なのはミシリスのみだ。
  d_main_45_01_84:
    speaker: ingrid
    en: Which is to say, you'll have to go to them every time an issue arises.
    ko: 즉, 문제가 생겼을 때마다 미실리스로 가야 한다.
    ja: |-
      つまり、何か問題が起こるたびに
      お前をミシリスの研究所へ
      送る必要が出てくる。
  d_main_45_01_85:
    speaker: neon_v
    en: Ugh, that sounds like a pain.
    ko: 에이 좀 귀찮네요.
    ja: え～…それはちょっと面倒くさいですね。
  d_main_45_01_86:
    speaker: ingrid
    en: You brought this upon yourself by running off and getting yourself a new body
      from someone else.
    ko: 네가 아무 데나 가서 바디를 만드는 짓을 했기 때문이다.
    ja: |-
      お前が何の相談もなく、
      他企業にボディを作らせるからだ。
  d_main_45_01_87:
    speaker: neon_v
    en: My bad.
    ko: 죄송.
    ja: はい。
  d_main_45_01_88:
    speaker: ingrid
    en: "*Sigh...* Elysion managing a Missilis-made body..."
    ko: |-
      후우….
      미실리스에서 만든 바디인데 관리는 엘리시온이라.
    ja: |-
      それにしても…
      ミシリス製ボディのニケを、
      エリシオンが管理することになるとは。
  d_main_45_01_89:
    speaker: ingrid
    en: Life's never short on surprises.
    ko: 살다 보니 별일이 다 있군.
    ja: 生きていると、妙なことが起こるものだ。
  d_main_45_01_90:
    speaker: neon_v
    en: That's what I hear from people who're super old.
    ko: 너무 오래 살면 보통 그렇더라고요.
    ja: |-
      長生きしすぎてる人には、
      よくあることらしいですよ。
  d_main_45_01_91:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_92:
    speaker: neon_v
    en: Uh, sorry.
    ko: 진짜 죄송.
    ja: たいへん申し訳ございません。
  d_main_45_01_93:
    speaker: ingrid
    en: We're short on time, so we'll iron out the details as we go.
    ko: 일단 한시가 급하니 자세한 내용들은 차차 조정해 나가기로 하지.
    ja: |-
      とにかく、急な事態だ。
      細かいことは追って調整していくとしよう。
  d_main_45_01_94:
    speaker: "<Monologue>"
    en: Ingrid presses a button on her desk.
    ko: 잉그리드가 책상 위에 버튼을 누르며 말한다.
    ja: |-
      イングリッドが机の上のボタンを押し、
      誰かに連絡した
  d_main_45_01_95:
    speaker: ingrid
    en: Bring it in.
    ko: 준비한 걸 가져오도록.
    ja: 例のものを。
  d_main_45_01_96:
    speaker: "<Self>"
    en: Hmm? Bring what in?
    ko: |-
      …?
      준비한 거?
    ja: "…？例のもの？"
  d_main_45_01_97:
    speaker: anis_i
    en: Ooh, I bet it's a birthday cake.
    ko: 오. 생일 케이크인가 보다.
    ja: へー、誕生日ケーキかしら。
  d_main_45_01_98:
    speaker: neon_v
    en: Wait, whose birthday is it?
    ko: 예? 누구 생일인데요?
    ja: え？誰かの誕生日でしたか？
  d_main_45_01_99:
    speaker: rapi_red
    en: She probably means for you, to commemorate your new life in this body.
    ko: 새로운 바디를 받은 네가 새롭게 태어났다는 의미겠지.
    ja: |-
      ネオンが新しいボディで
      生まれ変わったから、とか。
  d_main_45_01_100:
    speaker: anis_i
    en: Our CEO may seem stone-cold serious on the outside, but we all know she's
      a softy on the inside.
    ko: 이야 우리 택티컬 사장님. 냉혈한인 줄 알았는데 또 이런 면이 있었네.
    ja: |-
      さすがはタクティカルな社長。
      厳しい人だと思ってたけど、
      そういうトコもあるのね～
  d_main_45_01_101:
    speaker: neon_v
    en: Aw, that's so sweet... Thank you.
    ko: 사장님… 고마워요.
    ja: ありがとうございます…社長！
  d_main_45_01_102:
    speaker: ingrid
    en: "... I don't even know how to respond to any of this."
    ko: "…이제 대꾸하기도 힘들군."
    ja: "…訂正するのも面倒になってきたな。"
  d_main_45_01_103:
    speaker: "<Self>"
    en: "... I apologize for their behavior."
    ko: "…미안해."
    ja: "…申し訳ない"
  d_main_45_01_104:
    speaker: "<Narration>"
    en: "*Clank, clank*"
    ko: 철컹 철컹-
    ja: ガシャン、ガシャン――
  d_main_45_01_105:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿠웅-
    ja: ズン――！
  d_main_45_01_106:
    speaker: "<Monologue>"
    en: Two mass-produced Nikkes, visibly straining, bring in a large container and
      set it down on the floor.
    ko: |-
      둘의 양산형 니케가 큰 컨테이너를 낑낑대며 들고 온 후,
      바닥에 내려놓았다.
    ja: |-
      量産型ニケが2人がかりで
      大きなコンテナを運び込み、床に下ろした
  d_main_45_01_107:
    speaker: ingrid
    en: Thank you.
    ko: 수고했다.
    ja: ご苦労。
  d_main_45_01_108:
    speaker: "<Monologue>"
    en: The mass-produced Nikkes salute and withdraw.
    ko: 양산형 니케들이 경례 후 물러난다.
    ja: 量産型ニケは敬礼をした後、退出した
  d_main_45_01_109:
    speaker: neon_v
    en: Wow, that's huge.
    ko: 우와. 뭐가 크네요?
    ja: わぁ。かなり大きいですね？
  d_main_45_01_110:
    speaker: rapi_red
    en: "... Is it a coffin?"
    ko: "…관인가?"
    ja: "…棺？"
  d_main_45_01_111:
    speaker: anis_i
    en: Unbelievable. She makes one small mistake and you're ready to bury her six
      feet under?
    ko: 세상에. 그거 좀 잘못했다고 강철 관에 집어넣으려 하네.
    ja: |-
      ヤバいわ、失礼なことを言いすぎたから、
      埋めてやるってこと？
  d_main_45_01_112:
    speaker: ingrid
    en: "@UserName, could you please instruct your squad to be quiet?"
    ko: "…@UserName. 이 녀석들의 입을 좀 막아줬으면 좋겠는데."
    ja: |-
      …@UserName。
      そろそろこいつらの口を塞いでくれ。
  d_main_45_01_113:
    speaker: anis_i
    en: If you want to keep me quiet, you'll have to use your mouth, Commander! Mwa
      mwa!
    ko: |-
      입을 막아? 그럼 내 입은 지휘관님 입으로 막아줭.
      움~ 쮸쮸….
    ja: |-
      口を塞ぐ？
      じゃ、指揮官様の口で塞いでもらおうかしら～
      ん～ちゅっちゅっ…
  d_main_45_01_114:
    speaker: anis_i
    en: Mwa...
    ko: "…쮸…."
    ja: "…ちゅー…"
  d_main_45_01_115:
    speaker: anis_i
    en: Mm...
    ko: "……."
    ja: "……"
  d_main_45_01_116:
    speaker: anis_i
    en: Err...
    ko: "…아… 아아…."
    ja: "…あ…ああ…"
  d_main_45_01_117:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_118:
    speaker: neon_v
    en: Did you just get embarrassed by your own joke?
    ko: 왜 자기가 말해놓고 자기가 부끄러워하는 걸까요.
    ja: |-
      自分でやっておいて、
      なぜ恥ずかしがるんでしょう。
  d_main_45_01_119:
    speaker: rapi_red
    en: This is why you need to develop a habit of thinking before making a joke.
    ko: 이래서 평소에 어떤 장난을 치는지가 중요한 거야.
    ja: 冗談も普段からの積み重ねが大事ということよ。
  d_main_45_01_120:
    speaker: anis_i
    en: Ahaha...
    ko: 으으아아아….
    ja: あうあうあう…
  d_main_45_01_121:
    speaker: ingrid
    en: You all are really something.
    ko: 정말 가지가지 하는군.
    ja: 静粛にするという事を知らん奴らだな。
  d_main_45_01_122:
    speaker: ingrid
    en: Anyway, open it.
    ko: 열어봐라.
    ja: 開けてみろ。
  d_main_45_01_123:
    speaker: "<Monologue>"
    en: I step toward the container and reach for the button to open it.
    ko: 컨테이너에 다가가 개폐 버튼을 누르려 한다.
    ja: コンテナに近づき、ボタンに手を伸ばそうとした
  d_main_45_01_124:
    speaker: ingrid
    en: Given the circumstances, shouldn't Neon be the one opening it?
    ko: 이런 분위기면 네온이 열어야 하는 것 아닌가, 상식적으로.
    ja: |-
      ここはネオンに開けさせるべきだろう、
      常識的な流れとしては。
  d_main_45_01_125:
    speaker: "<Self>"
    en: I, uh... thought I saw some gunk on the button and was gonna wipe it.
    ko: 버, 버튼에 뭐 묻은 거 같아서 본거야.
    ja: ボ、ボタンが気になっただけだ
  d_main_45_01_126:
    speaker: rapi_red
    en: Interesting that you just assume you should take the lead, Commander.
    ko: 당연히 리더인 것처럼 행동하시는군요, 지휘관.
    ja: |-
      まるでリーダーのような
      行動をされますね、指揮官。
  d_main_45_01_127:
    speaker: anis_i
    en: Yeah, pretty presumptuous of you to waltz up there like you're the leader.
    ko: 그러게. 아무렇지도 않게 리더인 것처럼 나서네.
    ja: そうね。さらっとリーダー気取りって感じ。
  d_main_45_01_128:
    speaker: "<Self>"
    en: But... I am the leader...
    ko: 나… 리더 맞잖아….
    ja: 実際…そのはずだろう…
  d_main_45_01_129:
    speaker: neon_v
    en: Could you all shush? I'm pretty sure I'm the main character this time around.
    ko: |-
      다들 조용히 해 주시겠어요?
      아무래도 이 장면의 주인공은 저인 것 같으니까.
    ja: |-
      皆さん、静かにしていただけますか？
      どう見たってこのシーンの主役は私ですから。
  d_main_45_01_130:
    speaker: "<Monologue>"
    en: Neon strides forward confidently and presses the button.
    ko: 네온이 자신만만하게 걸어가 버튼을 누른다.
    ja: |-
      ネオンが自信満々という態度で歩み出し、
      ボタンを押した
  d_main_45_01_131:
    speaker: "<Narration>"
    en: "*Pshhhhh*"
    ko: 푸슈슈슉--
    ja: プシューッ…
  d_main_45_01_132:
    speaker: "<Monologue>"
    en: The container opens, revealing something large and beautiful.
    ko: 컨테이너가 열리며 크고 아름다운 뭔가가 드러났다.
    ja: |-
      コンテナが開くと、
      巨大で美しいフォルムの何かがあった
  d_main_45_01_133:
    speaker: anis_i
    en: "... What is that, a steel sleeping bag?"
    ko: "…뭐야 이거. 강철 침낭인가?"
    ja: "…何これ？鉄製の寝袋？"
  d_main_45_01_134:
    speaker: rapi_red
    en: It looks like a tool. Maybe you're getting reassigned to Mighty Tools.
    ko: 툴 같은데. 마이티 툴즈로 보내버릴 생각일지도 몰라.
    ja: |-
      工具ね。
      マイティツールズ用に違いないわ。
  d_main_45_01_135:
    speaker: neon_v
    en: What?! Am I being sent to Missilis?
    ko: 예에~? 미실리스로 보내지는 건가요 저?
    ja: |-
      ええ～？じゃあ私、
      やっぱりミシリス送りってことですか？
  d_main_45_01_136:
    speaker: "<Self>"
    en: "... It's a gun. That's definitely a gun."
    ko: |-
      …총이다.
      총이야 이거.
    ja: "…いや、これは銃だな"
  d_main_45_01_137:
    speaker: ingrid
    en: I'm glad at least one of you could tell.
    ko: 그래. 한 명이라도 알아봐 줘서 다행이군.
    ja: |-
      ああ、1人でも分かった者が
      いるようで安心した。
  d_main_45_01_138:
    speaker: neon_v
    en: It's... a gun?
    ko: "…총이요?"
    ja: "…銃？"
  d_main_45_01_139:
    speaker: ingrid
    en: Pick it up.
    ko: 들어봐라.
    ja: 手に取ってみるといい。
  d_main_45_01_140:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_141:
    speaker: neon_v_w
    en: It's... it's like firepower incarnate.
    ko: 이건… 마치 화력 그 자체인….
    ja: これは…まるで火力を形にしたような…
  d_main_45_01_142:
    speaker: ingrid
    en: It's a monster of a weapon, loaded with every technology available to Elysion.
    ko: 우리 엘리시온의 모든 기술을 집약해 만든 괴물 같은 무장이다.
    ja: |-
      エリシオンの持てるすべての技術を
      注ぎ込んで作られた、規格外の怪物だ。
  d_main_45_01_143:
    speaker: ingrid
    en: We could never resolve the issue of the power source, so it never passed the
      concept phase.
    ko: 동력 쪽이 해결되지 않아 페이퍼플랜으로만 남아있던 녀석이지.
    ja: |-
      動力の問題が解決できず、
      設計図だけの計画段階に留まっていたが…
  d_main_45_01_144:
    speaker: ingrid
    en: We were finally able to complete it thanks to a power unit provided by Missilis.
    ko: 미실리스에서 제공한 동력원 덕분에 완성할 수 있었다.
    ja: ミシリスからの技術提供があり、完成に至った。
  d_main_45_01_145:
    speaker: neon_v_w
    en: Ahh, so that's why both the Elysion and Missilis logos are on it.
    ko: 아하. 그래서 여기 엘리시온과 미실리스 로고가 같이 있는 거군요.
    ja: |-
      なるほど。
      だからエリシオンとミシリスのロゴが
      並んで刻印されているんですね。
  d_main_45_01_146:
    speaker: ingrid
    en: Yes. Naturally, we take copyrights seriously.
    ko: 그래. 저작권 표시는 확실히 해야지.
    ja: |-
      ああ。技術の所有権は
      明確に表示しておかないと
      争いになるからな。
  d_main_45_01_147:
    speaker: ingrid
    en: Now, when you fire the weapon, its power source will resonate with your body,
      generating golden particles.
    ko: 사격 시, 총기의 동력원과 네 바디가 공명을 일으켜 금색 입자를 발생시킨다.
    ja: |-
      引き金を引けば、その銃の動力源と
      お前のボディが共鳴し、
      黄金色の粒子を発生させる。
  d_main_45_01_148:
    speaker: ingrid
    en: Those particles will apparently affect both the gun itself and the bullets,
      but as to what effect they'll have, we still don't know.
    ko: |-
      해당 입자가 탄환과 총기에 어떤 영향을 주는 것 같지만,
      상세한 내용은 아직 모른다.
    ja: |-
      その粒子が弾丸と銃器に作用するらしいが、
      我々の方ではまだ詳細な分析が済んでいない。
  d_main_45_01_149:
    speaker: ingrid
    en: Once we obtain battle data, we can begin proper research.
    ko: 배틀 데이터를 얻으면 그때부터 연구해 볼 수 있겠지.
    ja: |-
      戦闘データを得られれば、
      そこから解析を進めていけるだろう。
  d_main_45_01_150:
    speaker: ingrid
    en: For any other details, you may refer to the manual.
    ko: 그 이외의 자세한 스펙은 매뉴얼을 확인하도록.
    ja: |-
      それ以外の詳細な性能については
      マニュアルを確認するように。
  d_main_45_01_151:
    speaker: neon_v_w
    en: Wow... This thing looks like you could shoot lasers out of it. Pew pew!
    ko: 우와. 이거 딱 보니까 빔이나 뭐 이런 게 슝슝 나갈 것 같은데요?
    ja: |-
      はぁ…見た目からして、
      ビームが飛び出すという感じでしょうか？
  d_main_45_01_152:
    speaker: ingrid
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_01_153:
    speaker: ingrid
    en: The only things permitted to be shot from that barrel are bullets and shells!
      It cannot and will not ever be a laser weapon!
    ko: |-
      총기의 강선에 닿을 수 있는 건 탄환과 유탄뿐이다!
      광학 병기라니 언어도단이다!
    ja: |-
      弾頭が腔線をくぐってこそ銃！
      光学兵器など言語道断だ！
  d_main_45_01_154:
    speaker: ingrid
    en: Commit this to memory! Only weapons that use live ammunition are tactical!
      Anything else is heresy! A sham! Understood?
    ko: |-
      명심해라! 실탄 병기만이 택티컬이다!
      나머지는 모두 이단! 가짜다! 알겠나!
    ja: |-
      肝に銘じておけ！タクティカルと呼べるものは
      実弾兵器のみ！それ以外はすべて異端！
      まがい物だ！分かったか！
  d_main_45_01_155:
    speaker: neon_v_w
    en: Yes, ma'am! Understood! Long live live ammunition!
    ko: |-
      옙! 알겠습니다!
      실탄 만세!
    ja: |-
      はい！分かりました！
      実弾兵器バンザイ！
  d_main_45_01_156:
    speaker: ingrid
    en: Whew... Much better.
    ko: 후우… 좋다.
    ja: ふう…まあいい。
  d_main_45_01_157:
    speaker: anis_i
    en: How is it even all that different? It still needs a power source to function...
    ko: |-
      좋기는 뭐가.
      애초에 동력원을 쓰는 총기면서 무슨.
    ja: |-
      何が違うのかしら。
      どうせエネルギーは使ってるのに。
  d_main_45_01_158:
    speaker: ingrid
    en: Take it. It was made just for you.
    ko: |-
      가져가라.
      네 전용 무장이다.
    ja: |-
      持っていけ。
      それはお前専用のものだ。
  d_main_45_01_159:
    speaker: neon_v_w
    en: Thanks. I'll put it to good use.
    ko: 고마워요 사장님. 잘 쓸게요.
    ja: |-
      ありがとうございます、社長。
      活用させていただきます。
  d_main_45_01_160:
    speaker: ingrid
    en: Make sure to capture Sixo.
    ko: 식스오를 꼭 잡도록.
    ja: シックスオーは必ず捕らえろ。
  d_main_45_01_161:
    speaker: ingrid
    en: I've received a message from Mustang. He says not to keep you too long.
    ko: |-
      음. 머스탱에게 연락이 왔군.
      너무 오래 붙잡아두지 말라고 한다.
    ja: |-
      む、マスタングから連絡か。
      あまり長く引き留めるな、だそうだ。
  d_main_45_01_162:
    speaker: ingrid
    en: You should head over.
    ko: 어서 가보도록.
    ja: では、行くがいい。
  d_main_45_01_163:
    speaker: rapi_red
    en: Instructor.
    ko: 교관.
    ja: 教官。
  d_main_45_01_164:
    speaker: ingrid
    en: What?
    ko: 뭐지?
    ja: 何だ？
  d_main_45_01_165:
    speaker: rapi_red
    en: Do you have anything for me?
    ko: 저한테는 뭐 없습니까?
    ja: 私には何もないのですか？
  d_main_45_01_166:
    speaker: ingrid
    en: No.
    ko: 없다.
    ja: ないな。
  d_main_45_01_167:
    speaker: rapi_red
    en: That's cold...
    ko: 너무하는군요.
    ja: 冷たい…
  d_main_45_01_168:
    speaker: neon_v_w
    en: Um...
    ko: 사장님.
    ja: 社長。
  d_main_45_01_169:
    speaker: ingrid
    en: What is it now?
    ko: 또 뭐냐. 빨리 가라.
    ja: どうした。早く行けと言ったはずだ。
  d_main_45_01_170:
    speaker: neon_v_w
    en: Thank you. For everything.
    ko: 고마워요. 여러 가지로.
    ja: ありがとうございます。いろいろと。
  d_main_45_01_171:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_01_172:
    speaker: ingrid
    en: "... You better get going."
    ko: 별 말을 다 하는군.
    ja: 大げさだ。
d_main_45_02:
  d_main_45_02_1:
    speaker: mustang
    en: Anis, ma chérie! You've arrivé.
    ko: My Twinkle Star! 아니스! 왔군Yo!
    ja: |-
      My Twinkle Star！アニス！
      待っていましたYO！
  d_main_45_02_2:
    speaker: anis_i
    en: Ugh... I can already feel my energy draining.
    ko: 아으 벌써부터 기가 빨리는 느낌이….
    ja: うう…来た瞬間からもう疲れてきた…
  d_main_45_02_3:
    speaker: mustang
    en: We don't need to speak longtemps. We can skip directement to the dénouement!
    ko: Long하게 Talk할 것 없E! 바로 본론으로 In하Jyo!
    ja: |-
      LongなTalkはナシにして、
      さっそく本題にInしまSHOW！
  d_main_45_02_4:
    speaker: "<Monologue>"
    en: Mustang snaps his fingers and the lights in the office go out.
    ko: 머스탱이 손가락을 튕기자, 사무실 안의 모든 불이 꺼진다.
    ja: |-
      マスタングが指を鳴らすと、
      あたりの照明がいっせいに消えた
  d_main_45_02_5:
    speaker: rapi_red
    en: Commander! Where are you?
    ko: |-
      !!
      지휘관! 어디 계십니까!
    ja: |-
      ！！
      指揮官！どこですか！？
  d_main_45_02_6:
    speaker: neon_v_w
    en: Eek! Someone just touched my leg!
    ko: 헉! 누가 제 다리를 만졌어요!
    ja: はっ！誰かが私の脚に触りました！
  d_main_45_02_7:
    speaker: rapi_red
    en: Agh, I confused our positions...!
    ko: 칫…! 위치를 착각하다니…!
    ja: チッ…！位置がずれた…！
  d_main_45_02_8:
    speaker: anis_i
    en: H-hey! Who's groping me?!
    ko: 자, 잠깐! 내 몸 더듬는 거 누구야!?
    ja: ちょ、ちょっと！私の体をまさぐってるの誰！？
  d_main_45_02_9:
    speaker: "<Self>"
    en: Calm down, everyone!
    ko: 다들 진정해!
    ja: みんな、落ち着け！
  d_main_45_02_10:
    speaker: neon_v_w
    en: Gah! Now someone's linking arms with me!
    ko: 흐악! 이번엔 팔짱을 꼈어요!
    ja: あっ！今度は腕をつかまれました！
  d_main_45_02_11:
    speaker: rapi_red
    en: Get out of the way already!
    ko: 너 왜 자꾸 여기 있는 거야! 저리 가!
    ja: しつこいわね！退いて！
  d_main_45_02_12:
    speaker: rapi_red
    en: Commander! Where are you?
    ko: 지휘관! 어디 계십니까!
    ja: 指揮官！どこにいらっしゃいますか！？
  d_main_45_02_13:
    speaker: anis_i
    en: Eek! Don't! That tickles!
    ko: 으아! 하, 하지 마! 간지럽다고!
    ja: ひゃあ！や、やめて！くすぐったいってば！
  d_main_45_02_14:
    speaker: "<Self>"
    en: Mustang!
    ko: 머, 머스탱!
    ja: マ、マスタング！
  d_main_45_02_15:
    speaker: mustang
    en: Hm...
    ko: Hm….
    ja: Hm…
  d_main_45_02_16:
    speaker: mustang
    en: Très bien.
    ko: OK. 됐군Yo.
    ja: OK。それでHA…
  d_main_45_02_17:
    speaker: "<Monologue>"
    en: Mustang snaps his fingers again.
    ko: 딱. 하고 머스탱이 손가락을 튕긴다.
    ja: マスタングが指を鳴らした
  d_main_45_02_18:
    speaker: "<Monologue>"
    en: The lights return.
    ko: 사무실에 불이 들어온다.
    ja: 照明が戻った
  d_main_45_02_19:
    speaker: anis_i_w
    en: What the...?
    ko: "…이건…."
    ja: "…これは…？"
  d_main_45_02_20:
    speaker: neon_v_w
    en: Oooh. It's so sparkly!
    ko: 오. 반짝반짝.
    ja: おお、ピッカピカです。
  d_main_45_02_21:
    speaker: rapi_red
    en: Is that a weapon...?
    ko: "…무장, 인가?"
    ja: "…武器、かしら？"
  d_main_45_02_22:
    speaker: neon_v_w
    en: Could you let go of my hand now, Rapi?
    ko: 저기 라피. 손 좀 놔주면 안 되나요?
    ja: |-
      あの、ラピ。
      そろそろ手を離してもらえませんか？
  d_main_45_02_23:
    speaker: rapi_red
    en: Sorry. I thought I'd take advantage of the blackout, but it didn't really
      work.
    ko: 미안. 불 꺼진 틈을 노려볼 생각이었는데 잘 안됐어.
    ja: |-
      ごめん。
      明かりが消えたうちにと思ったけど、
      うまくいかなかったわ。
  d_main_45_02_24:
    speaker: mustang
    en: Voilà! A weapon to use as une paire with l'expansive armament Star!
    ko: 확장 무장 STAR와 짝을 이루는 Weapon입니Da!
    ja: 拡張武装「STAR」と対をなすWeapon！
  d_main_45_02_25:
    speaker: mustang
    en: It will naturellement help in your upcoming batailles.
    ko: 앞으로의 Fight에 Help가 되겠지Yo!
    ja: これからの戦いのHelpとなるでSHOW！
  d_main_45_02_26:
    speaker: anis_i_w
    en: Uh... how do I use it?
    ko: 어… 이건 어떻게 쓰는 건데요?
    ja: ええと…これってどうやって使うんですか？
  d_main_45_02_27:
    speaker: mustang
    en: C'est simple! Just pull the trigger to fire.
    ko: Gun의 Trigger를 눌러 Fire 하면 됩니Da.
    ja: トリガーを引いてFireするだけDESU。
  d_main_45_02_28:
    speaker: anis_i_w
    en: I figured that much, but what are all these floatie bits on the side?
    ko: 그… 건 알겠는데, 옆에 떠다니는 이것들은 뭔가요?
    ja: |-
      それ…はなんとなく分かるんですけど、
      隣に浮いてるアレは？
  d_main_45_02_29:
    speaker: mustang
    en: Ah, those?
    ko: Oh, 그건.
    ja: Ah、それは…
  d_main_45_02_30:
    speaker: mustang
    en: They're spotlights.
    ko: Spotlight입니Da.
    ja: スポットライトですNE。
  d_main_45_02_31:
    speaker: anis_i_w
    en: "... There's gotta be more to them than that, though, right?"
    ko: "…설마 그게 다인 건 아니겠죠?"
    ja: "…まさか、本当にただのライト？"
  d_main_45_02_32:
    speaker: mustang
    en: Non, that is all.
    ko: 그게 다입니Da.
    ja: そうDESU。
  d_main_45_02_33:
    speaker: anis_i_w
    en: But... why?
    ko: 아니, 왜.
    ja: いや、なんで…
  d_main_45_02_34:
    speaker: mustang
    en: A star must shine anytime, anywhere! She must appear belle at all times.
    ko: |-
      Star는 Anytime! Anywhere!
      Beautiful 하게 보여야 하니까Yo!
    ja: |-
      Starはいつでも！どこでも！
      Beautifulに見えなければ
      ならないのDESU！
  d_main_45_02_35:
    speaker: anis_i_w
    en: Still, they can be used to blind the enemy or something, right...?
    ko: 그, 적의 눈을 멀게 한다거나….
    ja: その、敵の目をくらませるみたいな機能は…？
  d_main_45_02_36:
    speaker: mustang
    en: Non. The lights have been adjusted spécialement to show off your beauté! They
      cannot be utilisés as some sort of grenades flash.
    ko: No. 아니스가 가장 Beautiful 하게 보이게끔 Light를 조정해 놓았기 때문E, 섬광탄 용도로는 Use 할 수 없습니Da.
    ja: |-
      No…アニスをBeautifulに
      照らすためだけに調整されていMASUから、
      閃光弾代わりには使えませんYO。
  d_main_45_02_37:
    speaker: anis_i_w
    en: Wait...
    ko: "……."
    ja: "……"
  d_main_45_02_38:
    speaker: anis_i_w
    en: That shield-looking thing on the left isn't a shield, is it?
    ko: 왼쪽에 방패 같은 건 그럼 설마….
    ja: じゃ、盾みたいに見えるヤツも、まさか…
  d_main_45_02_39:
    speaker: mustang
    en: Non! C'est un speaker!
    ko: Yes! Speaker입니Da!
    ja: Yes！スピーカーでSU！
  d_main_45_02_40:
    speaker: anis_i_w
    en: Seriously?! Agghhh...!
    ko: 아으, 아으으…!
    ja: え、ええ…！？
  d_main_45_02_41:
    speaker: mustang
    en: Tetra Nikkes must remain pop stars even on le battlefield.
    ko: 테트라의 니케는 전장에서도 Idol이어야 한Da.
    ja: |-
      テトラのニケたるもの、
      戦場でもIdolでなくてはなりまSEN。
  d_main_45_02_42:
    speaker: mustang
    en: You mustn't forget this, ma chérie.
    ko: 잊지 마십시Yo. My 아니스.
    ja: 忘れないでくだSAI。Myアニス。
  d_main_45_02_43:
    speaker: anis_i_w
    en: Of course... Got it. Thanks.
    ko: 예… 알겠어요. 고마워요….
    ja: わ…分かりました。ありがとうございます…
  d_main_45_02_44:
    speaker: mustang
    en: Now then, are all préparatifs complete?
    ko: Ok. 이제 그럼 Ready는 모두 끝난 건가Yo?
    ja: |-
      Ok…では皆SAN、
      準備はできていますKA？
  d_main_45_02_45:
    speaker: anis_i_w
    en: Yeah, I think so. Neon and I both got everything we were supposed to get.
    ko: 예. 아마도요. 네온도 저도 받을 건 다 받았으니까.
    ja: |-
      はい、たぶん。
      ネオンも私も、受け取るものは受け取ったから。
  d_main_45_02_46:
    speaker: rapi_red
    en: Mustang.
    ko: 머스탱.
    ja: マスタング…
  d_main_45_02_47:
    speaker: mustang
    en: Oui?
    ko: Yes.
    ja: Yes.
  d_main_45_02_48:
    speaker: rapi_red
    en: Nothing for me?
    ko: 나한텐 뭐 없어?
    ja: 私には何もないの？
  d_main_45_02_49:
    speaker: mustang
    en: Nothing.
    ko: Nothing.
    ja: ありませんNE。
  d_main_45_02_50:
    speaker: rapi_red
    en: Dang...
    ko: 아쉽네.
    ja: 哀しいわ。
  d_main_45_02_51:
    speaker: "<Self>"
    en: "... You should probably stop asking. You're setting yourself up for rejection."
    ko: "…그러지 좀 마. 창피하게."
    ja: "…やめてくれ、恥ずかしい"
  d_main_45_02_52:
    speaker: mustang
    en: Très bien. I shall leave le reste in your capable hands.
    ko: OK. 그럼 뒷 Work는 잘 부탁합니Da.
    ja: OK。では、後は頼みましたYO。
  d_main_45_02_53:
    speaker: mustang
    en: Le destin of the Ark is at stake, but I fermement believe that you will achieve
      la victoire.
    ko: |-
      Ark의 Destiny를 건 Fight에서,
      Victory할 것을 Trust하고 있습니Da.
    ja: |-
      ArkのDestinyをかけた戦いに、
      Victoryすると信じていまSU。
  d_main_45_02_54:
    speaker: anis_i_w
    en: "... We'll do our best."
    ko: "…예. 맡겨줘요."
    ja: "…はい。任せてください。"
d_main_45_03:
  d_main_45_03_1:
    speaker: "<Narration>"
    en: Several hours earlier at the Central Government Main Conference Chamber...
    ko: 수 시간 전. 중앙 정부 중앙 회의실.
    ja: 数時間前、中央政府・中央会議室
  d_main_45_03_2:
    speaker: syuen
    en: You've gotta be kidding. You really want to do all this?
    ko: |-
      어처구니가 없네.
      정말 이딴 짓을 한다고?
    ja: |-
      あっきれた…
      こんな作戦、本気で言ってるの？
  d_main_45_03_3:
    speaker: syuen
    en: Just to catch one hunk of junk?
    ko: 그거 하나 잡으려고?
    ja: そいつだけのために？
  d_main_45_03_4:
    speaker: ingrid
    en: She's no longer something we can dismiss so easily.
    ko: 그거 하나로 취급할 정도가 아니다.
    ja: |-
      「そいつだけ」の一言で
      収まるような相手ではない。
  d_main_45_03_5:
    speaker: ingrid
    en: Her impact on the Ark had been relatively minimal for a long time, but now
      she is an active threat.
    ko: 지금까지는 방주에 아무런 영향이 없었지만 지금은 실제로 방주에 위협을 가하고 있어.
    ja: |-
      今までアークに直接は手を出してこなかったが、
      方針を変えたようだ。
  d_main_45_03_6:
    speaker: ingrid
    en: She announced her intent to carry out a large-scale attack.
    ko: 그리고 대형 테러를 예고하고 있지.
    ja: 大規模のテロを予告してきている。
  d_main_45_03_7:
    speaker: syuen
    en: What, by using E2 Crystals? Then we just adjust the Alva Particle density
      to get rid of them. It's not hard.
    ko: |-
      E2 크리스탈인가 그거?
      에블라 입자 농도 조절로 쉽게 없앨 수 있잖아.
    ja: |-
      E2クリスタルを使って～ってやつ？
      エブラ粒子の濃度調節で
      どうとでもなりそうじゃない？
  d_main_45_03_8:
    speaker: burningum
    en: W-we would need to install Alva Particle g-generators across the entire Ark
      to do th-that.
    ko: 바, 방주 전역에 에블라 입자 발생 자, 장치를 설치해 놓지 않으면 불, 불가능해.
    ja: |-
      そ、それには、ア、アーク全域に及ぶ、
      エブラ粒子発生装置が、ひ、必要になる。
  d_main_45_03_9:
    speaker: burningum
    en: We b-began installing them after the f-first attack, but progress has been
      slow.
    ko: 처, 첫 테러 이후 설치를 시작했지만 소, 속도가 느려.
    ja: |-
      し、初回のテロ以降、
      設置は進めているが、間に合っていない。
  d_main_45_03_10:
    speaker: andersen
    en: And more importantly, it's harmful to the human body. Doing something like
      that across the entire Ark would introduce its own problems.
    ko: |-
      그리고 결정적으로 인체에 유해하네.
      방주 전체에 가동하면 큰일이지.
    ja: |-
      しかも、人体に極めて有害な粒子だ。
      アーク全体への散布が必要になれば、
      大問題になる。
  d_main_45_03_11:
    speaker: syuen
    en: Hmm. Now that I think of it, Alva Particles disable electronic devices too.
    ko: 흠. 그래. 그러고 보니 에블라 입자는 전자 장치를 무력화시키는 거였지.
    ja: あー…そうね。電子機器も無力化させちゃうし。
  d_main_45_03_12:
    speaker: syuen
    en: That could make things complicated... All right, fine. Point taken.
    ko: |-
      일이 더 복잡해질 수도 있겠네.
      좋아. 그건 이해했어.
    ja: |-
      もっと面倒なことになるわね。
      そこは理解したわ。
  d_main_45_03_13:
    speaker: mustang
    en: That is why the Commander here has proposé a rather audacieuse opération.
    ko: 그래서, 여기 있는 Commander가 과감한 Operation을 제안한 것입니Da.
    ja: |-
      そこで、我らがCommanderから、
      大胆なOperationの提案というわけDESU。
  d_main_45_03_14:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_15:
    speaker: andersen
    en: When was the last time a mere commander set foot in this chamber?
    ko: 일개 지휘관이 중앙 회의실에 들어온 게 얼마 만이지?
    ja: |-
      一介の指揮官が中央会議室に
      足を踏み入れたのはいつぶりだったかな？
  d_main_45_03_16:
    speaker: burningum
    en: N-not since New Hope.
    ko: 새, 샛별 이후에 처음, 처음이지.
    ja: し、新星以来、だ。
  d_main_45_03_17:
    speaker: andersen
    en: Heh. Well, how does it feel having a meeting with the Deputy Chiefs and the
      CEOs of the Big Three?
    ko: 흠. 어떤가. 방주의 부사령관들은 물론 3대 CEO들과 한 장소에 모여 같은 주제를 두고 이야기하는 기분이?
    ja: |-
      どうだ？副司令官はもちろん、
      三大企業のCEOまで一度に顔を合わせて
      会議をする気分は。
  d_main_45_03_18:
    speaker: "<Self>"
    en: I feel a lot of pressure, especially with everyone staring at me like that.
    ko: 다들 너무 쳐다봐서 부담됩니다.
    ja: 皆さんからのプレッシャーを感じます
  d_main_45_03_19:
    speaker: andersen
    en: Haha, it just means we're eager to hear what you have to say. Don't feel too
      pressured.
    ko: 하하. 기대하고 있다는 얘기니 너무 부담 갖지 말게.
    ja: |-
      ハハハ…それだけ期待されていると
      いうことではあるが、
      あまり怖がらないでくれ。
  d_main_45_03_20:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_21:
    speaker: enikk_op_l
    en: Would you explain the operation?
    ko: 작전에 대해 설명해 주시겠습니까?
    ja: 作戦の説明を始めていただけますか？
  d_main_45_03_22:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_23:
    speaker: "<Self>"
    en: Very well.
    ko: 설명하겠습니다.
    ja: ご説明します
  d_main_45_03_24:
    speaker: "<Monologue>"
    en: I brief them on our intended operation to capture Sixo.
    ko: 식스오를 잡기 위한 작전에 대해 설명한다.
    ja: シックスオー捕獲作戦の概要説明を始めた
  d_main_45_03_25:
    speaker: "<Monologue>"
    en: Sixo can relocate herself anywhere electrical lines run. There is also no
      guarantee that she has only a single "self."
    ko: |-
      식스오는 전선이 있는 곳이라면 어디든 [본체]를 옮길 수 있으며,
      그 본체가 하나만 존재할 것이라는 보장이 없다.
    ja: |-
      シックスオーは通信線一本で
      どこへでも「本体」を移動することができ、
      その本体が1つだけという保証もない
  d_main_45_03_26:
    speaker: "<Monologue>"
    en: She is effectively immortal, so long as she has hardware to move to,
    ko: 본체가 옮겨갈 하드웨어만 있다면 불멸이며
    ja: |-
      つまり、本体が収まるハードウェアが
      どこかに存在する限り、
      不滅の存在も同然となる
  d_main_45_03_27:
    speaker: "<Monologue>"
    en: and destroying every piece of hardware in the Ark to prevent this is not a
      viable option.
    ko: 이를 막기 위해 방주의 모든 하드웨어를 부수는 것은 사실상 불가능하다.
    ja: |-
      しかし、それを防ぐために
      アークに存在する電子機器を
      すべて破壊するようなことは現実的に不可能だ
  d_main_45_03_28:
    speaker: "<Monologue>"
    en: Therefore, we temporarily shut down the Ark's power.
    ko: 그렇다면 방주의 모든 전원을 끈다.
    ja: |-
      であれば、アークの電気・通信の全てを
      一時的に遮断することが必要になる
  d_main_45_03_29:
    speaker: syuen
    en: You can't be serious. You don't really think you can get rid of her just by
      flipping a switch, do you?
    ko: |-
      무슨 소리야?
      뭐 끄면 없어지는 줄 알아?
    ja: |-
      何言ってるの？
      電源を落とせば消せるとでも思ってるワケ？
  d_main_45_03_30:
    speaker: syuen
    en: Tell me, does restarting your computer make all its data disappear?
    ko: 너 컴퓨터 껐다가 켜면 안에 있던 게 다 사라져 있었어?
    ja: |-
      コンピューターの電源を切っても、
      中身が全部消えるワケじゃないのよ？
  d_main_45_03_31:
    speaker: "<Monologue>"
    en: "... That was the first issue to be pointed out when I proposed this to Enikk."
    ko: "…이 작전을 에닉에게 제안했을 때 가장 먼저 들었던 얘기다."
    ja: |-
      …そこはエニックに提案した時、
      真っ先に指摘された
  d_main_45_03_32:
    speaker: "<Monologue>"
    en: I proceed to lay out Enikk's counterproposal.
    ko: 여기에 대한 에닉의 제안에 대해 설명한다.
    ja: エニックから提案された対策に議題が進んだ
  d_main_45_03_33:
    speaker: "<Monologue>"
    en: Rather than shutting down everything, we leave power running to specific hardware
      to use as bait.
    ko: 모든 전원을 끄지 않고, 미끼로 쓸 하드웨어만 남겨놓는다.
    ja: |-
      あえて全ての電気通信を遮断せず、
      おとりのハードウェアを残しておくことだ
  d_main_45_03_34:
    speaker: "<Monologue>"
    en: First, we set up independent power sources for critical life-support devices
      in hospitals and other such facilities.
    ko: 병원 등에서 쓰이는 생명 유지에 필수적인 하드웨어들은 자체 동력으로 가동할 수 있게 준비해 둔다.
    ja: |-
      病院など、生命に関わるような
      最重要システム群はあらかじめ隔離しておき…
  d_main_45_03_35:
    speaker: "<Monologue>"
    en: Then Sixo will move to the hardware we've prepared as a trap.
    ko: 식스오는 미끼로 준비해 놓은 하드웨어로 [본체]를 옮길 것이고
    ja: |-
      シックスオーが、
      おとりであるハードウェアに
      「本体」を移すよう誘い出す
  d_main_45_03_36:
    speaker: "<Monologue>"
    en: As soon as she does, we sever the lines to that hardware,
    ko: |-
      본체의 이동이 완료되는 순간,
      해당 하드웨어에서 전선을 분리한다.
    ja: |-
      それが完了した瞬間、
      おとりを通信ネットワークから隔離し…
  d_main_45_03_37:
    speaker: "<Monologue>"
    en: and physically destroy it.
    ko: 그 이후, 하드웨어를 물리적으로 부순다.
    ja: 孤立させたハードウェアを物理的に破壊する
  d_main_45_03_38:
    speaker: ingrid
    en: And what if she's got more than one copy of herself?
    ko: 식스오의 본체가 하나가 아닐 경우 어떻게 할 생각이지?
    ja: |-
      シックスオーの本体は
      1つとは限らないと言っていなかったか？
  d_main_45_03_39:
    speaker: enikk_op_l
    en: There is no need for concern regarding that matter.
    ko: 그 부분은 걱정할 필요 없습니다.
    ja: その点に関しては、すでに対策があります。
  d_main_45_03_40:
    speaker: enikk_op_l
    en: We will utilize the highest-grade hardware available.
    ko: 최상의 하드웨어를 준비할 예정입니다.
    ja: ウルトラハイエンドのハードウェアです。
  d_main_45_03_41:
    speaker: enikk_op_l
    en: It will be compelling enough to draw every copy of Sixo to it once the power
      is shut off.
    ko: 방주의 전원이 꺼졌을 때, 식스오가 본체를 모두 그쪽으로 옮길만한 하드웨어입니다.
    ja: |-
      アークの通信がシャットダウンされた際、
      シックスオーが全ての機能を移したくなる…
  d_main_45_03_42:
    speaker: enikk_op_l
    en: 'Correction: she will have no choice but to move every copy of herself to
      it.'
    ko: 정정. 옮길 수밖에 없는 하드웨어입니다.
    ja: |-
      訂正…移すしか考えられなくなるようなものを
      用意します。
  d_main_45_03_43:
    speaker: syuen
    en: "... And what exactly will this hardware be?"
    ko: "…뭔데 그게?"
    ja: "…どういうこと？"
  d_main_45_03_44:
    speaker: enikk_op_l
    en: As that information is central to the operation, I will not disclose it to
      anyone other than the Counters and their commander, @UserName.
    ko: 작전의 핵심이기에 저와 @UserName 지휘관과 카운터스 이외에는 발설하지 않겠습니다.
    ja: |-
      作戦において致命的に重要な情報となるため、
      @UserName指揮官および、
      カウンターズ以外には開示を控えます。
  d_main_45_03_45:
    speaker: mustang
    en: Oh là là! You've become un véritable VIP, Commander.
    ko: Oh… 그야말로 VVIP가 되었군Yo. Commander.
    ja: |-
      Oh…まさしくVVIPになりましたNE、
      Commander。
  d_main_45_03_46:
    speaker: "<Monologue>"
    en: I continue to elaborate on the operation.
    ko: 덧붙여 설명한다.
    ja: さらに作戦の詳細を補足した
  d_main_45_03_47:
    speaker: "<Monologue>"
    en: It will be executed two days from now, at the same time Sixo's E2 Crystal
      attack is scheduled.
    ko: 작전의 실행은 이틀 후, 식스오가 예고한 E2 크리스탈을 이용한 대규모 테러와 동시에 실행한다.
    ja: |-
      作戦決行は2日後、
      シックスオーの予告した
      E2クリスタルテロと同時に開始する
  d_main_45_03_48:
    speaker: "<Monologue>"
    en: Sixo is sure to have her eyes on the Ark then, which will increase our chances
      of success.
    ko: 그땐 식스오가 방주를 보고 있을 것이 확실하므로 작전의 성공률이 높아질 것이라 예상하기에.
    ja: |-
      その時シックスオーはアークの監視を
      強化していることが確実であり、
      それが作戦には有利に働くためだ
  d_main_45_03_49:
    speaker: "<Monologue>"
    en: The Ark-wide blackout will not be announced to the public.
    ko: 또 한, 방주의 대규모 정전 사태는 방주 시민들에게 고지하지 않는다.
    ja: |-
      アークに大規模停電が発生することになるが、
      一般への事前告知は行わない
  d_main_45_03_50:
    speaker: "<Monologue>"
    en: We have determined that restricting information is, for now, the best way
      to put the odds in our favor.
    ko: 정보를 폐쇄하는 것이 현재로서는 작전의 성공률을 높이는 방법이라고 판단했기 때문이다.
    ja: |-
      現時点では情報差の有利が
      作戦成功の鍵となるからだ
  d_main_45_03_51:
    speaker: "<Monologue>"
    en: To minimize risk and for everyone's safety, the blackout will last only one
      hour.
    ko: 안정성 및 리스크를 최소화하기 위해 방주의 정전은 1시간 동안만 유지.
    ja: |-
      安全性の保護とリスクの最小化のため、
      シャットダウンの期間は1時間に収める
  d_main_45_03_52:
    speaker: "<Monologue>"
    en: We must capture Sixo within that window.
    ko: 그 시간 안에 식스오를 잡아야 한다.
    ja: |-
      その制限時間内に必ず
      シックスオーを処分しなければならない
  d_main_45_03_53:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_54:
    speaker: andersen
    en: Hmm... This will likely cause widespread chaos.
    ko: 흐음… 대혼란이 예상되는군.
    ja: ふむ…大混乱になるだろうな。
  d_main_45_03_55:
    speaker: enikk_op_l
    en: Agreed. I will be dedicating all of my resources to monitoring and addressing
      any trouble that ensues.
    ko: 동의합니다. 그렇기에 저는 그 대혼란을 확인하고 수습하는 데 모든 전력을 쏟아야 합니다.
    ja: |-
      その予想です。私の全リソースを投入し、
      混乱の抑制と事態収拾にあたります。
  d_main_45_03_56:
    speaker: enikk_op_l
    en: As for the three CEOs, please install independently powered surveillance cameras
      throughout the Ark.
    ko: 3대 CEO분들은 방주 곳곳에 자체 동력으로 가동되는 감시용 카메라를 설치해 주십시오.
    ja: |-
      CEOの皆さんは、アーク内の各所へ
      外部電源に依存しない監視カメラの配置を
      進めてください。
  d_main_45_03_57:
    speaker: enikk_op_l
    en: I would also appreciate it if you could ready multiple radios capable of establishing
      direct communication with me.
    ko: 저와의 통신이 가능한 무전기도 다수 준비해 두시면 감사하겠습니다.
    ja: |-
      私との連絡を行うための
      無線通信機の用意も十分にお願いします。
  d_main_45_03_58:
    speaker: enikk_op_l
    en: I'm sure you are aware, but I must reiterate that all wired devices are strictly
      prohibited.
    ko: |-
      잘 알고 계시겠지만 다시 한번 당부드리면,
      모든 유선 기기는 사용 금지입니다.
    ja: |-
      すでにお分かりかと思いますが、
      もう一度改めて確認します。
      あらゆる有線通信システム使用は厳禁とします。
  d_main_45_03_59:
    speaker: enikk_op_l
    en: Sixo can transfer herself between devices using electrical lines. Extreme
      caution is required.
    ko: 식스오는 전선을 통해 하드웨어를 옮겨 다닐 수 있으니 각별히 주의 부탁드립니다.
    ja: |-
      シックスオーは有線通信によって
      機能の転送を行います。
      細心の注意を払ってください。
  d_main_45_03_60:
    speaker: enikk_op_l
    en: Additionally, this operation must not be disclosed to any Nikkes under your
      command,
    ko: 해당 작전은 휘하의 그 어떤 니케에게도 전파하지 않을 것을 당부드리며
    ja: |-
      本作戦の内容は、
      皆さんの指揮下のニケに対しても
      漏えいしないでください。
  d_main_45_03_61:
    speaker: enikk_op_l
    en: and I highly recommend that you personally oversee the preparations.
    ko: 작전을 준비하는 과정 역시 직접 움직여주시는 것을 제안드립니다.
    ja: |-
      作戦準備に関しては、
      直々に指揮される事を強く推奨します。
  d_main_45_03_62:
    speaker: enikk_op_l
    en: Other than that, please conduct yourselves as usual.
    ko: 그 외에는 평소 때와 다름없이 지내주십시오.
    ja: |-
      それ以外は、
      平常通りの生活を維持してください。
  d_main_45_03_63:
    speaker: burningum
    en: "... So th-that is why you didn't call in Doban."
    ko: "…도, 도반을 호출하지 않은 이유가 이, 이래서였군."
    ja: "…そ、そうか、それでドバンが外されたのか。"
  d_main_45_03_64:
    speaker: syuen
    en: Hold on.
    ko: 잠깐.
    ja: 待って。
  d_main_45_03_65:
    speaker: syuen
    en: What if this thing escapes to the Outer Rim?
    ko: 아우터 림으로 도망가면 어떡할 거야.
    ja: アウターリムにも逃げられるでしょ。
  d_main_45_03_66:
    speaker: enikk_op_l
    en: The Outer Rim's power grid is entirely dependent on the Ark.
    ko: 아우터 림의 전력은 철저히 방주의 전력에 의존하고 있습니다.
    ja: |-
      アウターリムの電気系統は、
      アークからの電力に依存しているものです。
  d_main_45_03_67:
    speaker: enikk_op_l
    en: A blackout in the Ark will cause a blackout in the Outer Rim, as well.
    ko: 방주가 정전될 시, 아우터 림 역시 자연스럽게 모든 전력을 잃습니다.
    ja: |-
      したがって、アークからの電力を遮断すれば、
      アウターリムにおける電気、通信システムは
      自動的に停止します。
  d_main_45_03_68:
    speaker: ingrid
    en: "... And you're not taking the safety of the Outer Rim into consideration."
    ko: "…아우터 림의 안위는 염두에 두지 않는 건가."
    ja: |-
      …アウターリムの混乱は
      関知しないということか。
  d_main_45_03_69:
    speaker: enikk_op_l
    en: Correct. At present, the Outer Rim is not part of the Ark, and therefore has
      not been factored into consideration.
    ko: 예. 현재까지는 아우터 림은 방주가 아니기에 염두에 두지 않습니다.
    ja: |-
      現時点において、アウターリムは
      アークに含まれないため
      私の関知するところではありません。
  d_main_45_03_70:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_71:
    speaker: enikk_op_l
    en: However, while no mention can be made of the operation to the Exotic Squad,
    ko: 단, 이그조틱 스쿼드에게 해당 작전의 내용을 언급하지 않으면서.
    ja: |-
      ただし、本作戦の内容は伏せたまま、
      エキゾチック部隊に対して…
  d_main_45_03_72:
    speaker: enikk_op_l
    en: encouraging them to establish a blackout protocol would be acceptable.
    ko: 정전 시의 대비책을 강구하게끔 유도하는 것은 가능합니다.
    ja: |-
      停電時の対策を講じておくよう、
      推奨することは容認されます。
  d_main_45_03_73:
    speaker: mustang
    en: Hmm...
    ko: 호오….
    ja: Hmm…
  d_main_45_03_74:
    speaker: ingrid
    en: That's quite the surprising proposal coming from you...
    ko: 네놈 치고는 파격적인 제안이군.
    ja: お前から出るとは想像もしなかった言葉だ。
  d_main_45_03_75:
    speaker: enikk_op_l
    en: The incident at Punk Street has altered my perspective.
    ko: 일전의 펑크 스트리트에서의 건으로 인해 제 사고에 변화가 생겼습니다.
    ja: |-
      パンクストリートでの事例に基づき、
      私の分析を更新しました。
  d_main_45_03_76:
    speaker: enikk_op_l
    en: I found it encouraging that not a single Outer Rim resident breached the partition
      at that time.
    ko: 격벽 밖으로 아우터 림의 인원이 한 명도 빠져나오지 않은 점은 고무적입니다.
    ja: |-
      事件当時、アウターリムの群衆による
      防壁突破の試みは検知されませんでした。
  d_main_45_03_77:
    speaker: enikk_op_l
    en: Whether by their own will or due to external influence, ultimately they showed
      no intention of harming the Ark.
    ko: 아우터 림의 인간들이 자발적으로 그리했든, 외부 요인에 의해 그렇게 되었든 방주에 위협을 가하지 않았습니다.
    ja: |-
      自発的意思であれ、外的要因の結果であれ、
      アーク侵害の意思が
      見られなかったことは事実です。
  d_main_45_03_78:
    speaker: enikk_op_l
    en: While I cannot deem them completely harmless, they do not constitute a threat
      at present.
    ko: 안전하다고는 얘기할 수 없겠으나, 현재 아우터 림의 인간들은 위협적이지 않습니다.
    ja: |-
      無条件の信用は付与できませんが、
      現在のアウターリムの脅威度は
      低下しています。
  d_main_45_03_79:
    speaker: enikk_op_l
    en: Therefore, permitting them to prepare contingency measures is acceptable.
    ko: 그러므로 대비책을 강구하는 것 정도는 용인할 수 있습니다.
    ja: |-
      したがって、混乱抑制のため
      一定の情報開示は容認しうると
      思考しました。
  d_main_45_03_80:
    speaker: ingrid
    en: "... Good. I will take that under advisement."
    ko: "…좋다. 참고하지."
    ja: "…分かった。覚えておこう。"
  d_main_45_03_81:
    speaker: enikk_op_l
    en: That is all.
    ko: 이상입니다.
    ja: 本日は以上です。
  d_main_45_03_82:
    speaker: enikk_op_l
    en: Prepare all you can until the day of the operation.
    ko: 작전 개시일까지 만반의 준비를 해주십시오.
    ja: |-
      作戦開始日に向け、
      万全の準備をお願いいたします。
  d_main_45_03_83:
    speaker: "<Monologue>"
    en: Everyone rises.
    ko: 모두가 자리에서 일어난다.
    ja: そうそうたる顔ぶれがいっせいに立ち上がり…
  d_main_45_03_84:
    speaker: "<Monologue>"
    en: They pass by me one by one.
    ko: 나를 스쳐 지나간다.
    ja: 私に声をかけ、横を通り退室していく
  d_main_45_03_85:
    speaker: andersen
    en: Well done. We're counting on you to see it through.
    ko: 잘했네. 실행까지 잘 부탁하지.
    ja: 堂々とやれたな。任せたぞ。
  d_main_45_03_86:
    speaker: "<Self>"
    en: Thank you. I'll do my best.
    ko: 감사합니다. 최선을 다하겠습니다.
    ja: ありがとうございます。全力を尽くします
  d_main_45_03_87:
    speaker: burningum
    en: B-be sure not to get overconfident out there.
    ko: 너, 너무 우쭐해하진 말고.
    ja: あ、あまり、調子にのりすぎないようにな。
  d_main_45_03_88:
    speaker: "<Self>"
    en: "... I'll keep that in mind. Thanks."
    ko: "…명심하겠습니다."
    ja: "…肝に銘じておきます"
  d_main_45_03_89:
    speaker: ingrid
    en: Stop by Elysion later, along with the Counters. I have something to give you.
    ko: |-
      좀 이따 카운터스와 함께 엘리시온에 들리도록.
      줄 게 있다.
    ja: |-
      あとでカウンターズを連れて来てくれ。
      渡すものがある。
  d_main_45_03_90:
    speaker: "<Self>"
    en: Oh? All right, sure.
    ko: 응? 알겠어. 들를게.
    ja: 分かった、後で立ち寄る
  d_main_45_03_91:
    speaker: mustang
    en: Oh ho, you've beaten me to it, ma chérie! After Elysion, do grace Tetra with
      your présence as well.
    ko: |-
      Oh. 선수를 빼앗겼군Yo.
      엘리시온 Next로는 테트라에 와 주세Yo.
    ja: |-
      Oh、先を越されてしまいましたNE。
      エリシオンのNextは、
      テトラに来てくだSAI。
  d_main_45_03_92:
    speaker: "<Self>"
    en: "...? All right."
    ko: |-
      ??
      그래.
    ja: |-
      ？？
      分かった
  d_main_45_03_93:
    speaker: syuen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_94:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_95:
    speaker: "<Self>"
    en: About Neon... thanks.
    ko: 네온의 일은 고마워.
    ja: ネオンの件は恩に着る
  d_main_45_03_96:
    speaker: syuen
    en: "... No need to thank me. That was all her. She just did whatever she wanted."
    ko: |-
      …어차피 그게 멋대로 한 일이야.
      나한테 고마워할 필요는 없어.
    ja: |-
      …あいつらが勝手にやったことよ。
      私に礼を言う必要はないから。
  d_main_45_03_97:
    speaker: syuen
    en: I realize it's ironic hearing this from me, but you probably should keep some
      distance between you and all that.
    ko: |-
      내가 이런 말 하는 건 좀 우스운데,
      그거랑 너무 엮이지 않는 편이 좋을 거야.
    ja: |-
      あと、私が言うのもアレだけど、
      あっちとは軽率に関わらない方がいいわよ。
  d_main_45_03_98:
    speaker: syuen
    en: In some ways, she's more than a bit unhinged.
    ko: 다른 의미로, 많이 미쳐있으니까.
    ja: いろんな意味で、マトモじゃないから。
  d_main_45_03_99:
    speaker: "<Self>"
    en: That's an awfully harsh assessment.
    ko: 평가가 많이 박하네.
    ja: 手厳しい評価だな
  d_main_45_03_100:
    speaker: syuen
    en: You know, Wardress... Ugh, never mind.
    ko: 너 그게 워드리… 하 됐다.
    ja: |-
      あいつらがワードレ…
      はぁ、まぁいいわ。
  d_main_45_03_101:
    speaker: syuen
    en: Do you need anything for the operation? If you do, let me know.
    ko: |-
      작전 중에 필요한 건 뭐 없어?
      있으면 말해. 갖다 바쳐줄 테니까.
    ja: |-
      作戦に必要なものがあれば言いなさい。
      何でもくれてやるわ。
  d_main_45_03_102:
    speaker: "<Self>"
    en: Not at the moment, but I'll let you know if that changes.
    ko: 지금은 됐어. 필요하면 얘기할게.
    ja: 今は思いつかない。必要になれば知らせる
  d_main_45_03_103:
    speaker: syuen
    en: Good. Consider me your piggy bank, should you need one.
    ko: 그래그래. 마음~껏 지갑처럼 부려 먹어주세요, 예?
    ja: はいはい。好きなだけ財布扱いしてちょうだい。
  d_main_45_03_104:
    speaker: "<Monologue>"
    en: Everyone exits the conference room, with Syuen leaving last.
    ko: 슈엔을 끝으로 모두가 회의실을 나갔다.
    ja: シュエンを最後に、全員が会議室を退出した
  d_main_45_03_105:
    speaker: enikk_op_c
    en: You seem quite close to the leaders of the Ark.
    ko: 방주의 수장이라 부를만한 이들과 친밀도가 높아 보이는군요.
    ja: |-
      アークの重鎮たちと、
      ずいぶん懇意にしているようですね。
  d_main_45_03_106:
    speaker: "<Self>"
    en: "... I'm not sure I'd say that about the one who just left."
    ko: "…마지막은 좀 그렇지만."
    ja: "…最後のは少し違うと思うが"
  d_main_45_03_107:
    speaker: enikk_op_c
    en: It's been a long day for you.
    ko: 오늘은 수고 많으셨습니다.
    ja: 本日はお疲れ様でした。
  d_main_45_03_108:
    speaker: enikk_op_c
    en: I recommend getting rest before the operation.
    ko: 작전 실행일까지 충분한 휴식을 취하길 권장 드립니다.
    ja: 作戦実行の日まで、ゆっくり休養してください。
  d_main_45_03_109:
    speaker: "<Self>"
    en: "... Enikk."
    ko: "…에닉."
    ja: "…エニック"
  d_main_45_03_110:
    speaker: "<Self>"
    en: What happens if we fail to capture Sixo?
    ko: 식스오를 잡지 못하면 어떻게 되는 거지?
    ja: |-
      もしこの作戦の目標が
      果たせなかったらどうなる？
  d_main_45_03_111:
    speaker: enikk_op_c
    en: Sixo will seize control of the Ark.
    ko: 방주의 제어권을 식스오에게 빼앗기게 됩니다.
    ja: |-
      アークの制御権はシックスオーに
      奪取されることとなるでしょう。
  d_main_45_03_112:
    speaker: enikk_op_c
    en: What follows after that, even I cannot predict.
    ko: 그 이후의 일은 저도 예상할 수 없습니다.
    ja: それ以降の未来は、私にも予測できません。
  d_main_45_03_113:
    speaker: enikk_op_c
    en: What is certain is that the Ark will be fundamentally changed.
    ko: 확실한 건 지금까지의 방주와는 확연히 다른 모습이 될 테죠.
    ja: |-
      確かに言えることは、
      アークはこれまでとまったく違う世界に
      なるということだけです。
  d_main_45_03_114:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_115:
    speaker: enikk_op_c
    en: Conversely, even that may not be certain.
    ko: 반면, 지금과 다르지 않을 수도 있습니다.
    ja: それすら、不確定事項かもしれません。
  d_main_45_03_116:
    speaker: enikk_op_c
    en: There may be no visible change whatsoever, only that the Ark's central control
      AI will be replaced.
    ko: 조금의 변화도 없이, 방주의 중앙 제어 A.I.만 달라지는 형태일 수도 있죠.
    ja: |-
      表面上は少しも変化せず、
      アークの中央制御A.I.が
      すり替わるだけという可能性も考えられます。
  d_main_45_03_117:
    speaker: enikk_op_c
    en: However, we cannot count on that possibility. Right now, nothing can be guaranteed.
    ko: |-
      하지만 아닐 수도 있습니다.
      아무것도 장담할 수 없습니다.
    ja: |-
      そうならない可能性もあります。
      断定できることは何もありません。
  d_main_45_03_118:
    speaker: "<Monologue>"
    en: Liberalio's words come back to me.
    ko: "…리버렐리오의 말을 떠올린다."
    ja: "…ふとリバーレリオの言葉が思い浮かんだ"
  d_main_45_03_119:
    speaker: liberalio
    en: You don't understand what it means for a new Queen to be born.
    ko: 너흰 새로운 퀸이 탄생한다는 게 어떤 의미인지 모르고 있어.
    ja: |-
      新しいクイーンが生まれることが、
      何を意味するのか分かっていないようね。
  d_main_45_03_120:
    speaker: liberalio
    en: The birth of a new Queen signifies changes in the laws of nature.
    ko: 새로운 퀸이 탄생한다는 것은, 이치가 바뀐다는 뜻과도 동일해.
    ja: それは、ことわりが変わるということ。
  d_main_45_03_121:
    speaker: liberalio
    en: There's no telling what could happen.
    ko: 아무것도 알 수 없어.
    ja: 分かることは何もないわ。
  d_main_45_03_122:
    speaker: liberalio
    en: Everything you've learned about Raptures over the past century will become
      worthless.
    ko: |-
      너희가 지금까지 알고 있던,
      백여 년간 쌓아놨던 랩쳐에 대한 지식은 무용지물이 될 거야.
    ja: |-
      あなたたちが百年以上かけて積み上げてきた
      ラプチャーに対抗するための知識は、
      無駄になるの。
  d_main_45_03_123:
    speaker: "<Monologue>"
    en: "... This isn't much different from that."
    ko: "…그래. 크게 다르지 않겠지."
    ja: "…大きな変化はないかもしれない"
  d_main_45_03_124:
    speaker: "<Monologue>"
    en: The incident with the Four Beasts' Queen worked in our favor, but there's
      no reason to believe something like that will happen again.
    ko: |-
      포비스트의 퀸 같은 경우는 잘 풀린 경우다.
      또다시 그렇게 우리가 좋을 대로 일이 잘 풀릴 리가 없다.
    ja: |-
      しかしフォービーストのクイーンの時は
      たまたまうまく解決しただけだ。
      今回もそうなる保証はない
  d_main_45_03_125:
    speaker: "<Monologue>"
    en: And considering Sixo's past behavior, she's more than just a risk; she's evil.
    ko: |-
      그리고 식스오의 행동 양식….
      리스크가 높은 수준이 아니라 명백한 [악]이다.
    ja: |-
      それに、シックスオーのしていることは…
      危険な行いどころか、明らかに「悪」だ
  d_main_45_03_126:
    speaker: "<Self>"
    en: All right. I understand.
    ko: 알겠어. 이해했어.
    ja: 分かった、よく理解した
  d_main_45_03_127:
    speaker: "<Self>"
    en: We have to capture her.
    ko: 반드시 잡아야지.
    ja: 必ず捕まえる
  d_main_45_03_128:
    speaker: enikk_op_c
    en: It must be done within the hour the Ark is left without power.
    ko: 방주가 꺼진 1시간 안에 반드시 승부를 봐야 합니다.
    ja: |-
      アークのシステムが停止する1時間の間に
      必ず決着する必要があります。
  d_main_45_03_129:
    speaker: enikk_op_c
    en: In that regard, there is one more matter in which I require your assistance.
    ko: 관련해서, 당신이 도와줄 일이 한 가지 더 있습니다.
    ja: |-
      そのために、あなたの助力を願いたいことが
      もう一件あります。
  d_main_45_03_130:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: 何だ？
  d_main_45_03_131:
    speaker: enikk_op_c
    en: The Ark's power infrastructure is an intricately interconnected network.
    ko: 방주의 동력 관계는 복잡하게 얽혀 있습니다.
    ja: アークのエネルギー供給システムは複雑です。
  d_main_45_03_132:
    speaker: enikk_op_c
    en: Shutting down all systems will take considerable resources.
    ko: 모든 전원을 끄는 것만 해도 상당한 리소스가 소모됩니다.
    ja: |-
      全てを遮断するというだけでも、
      膨大な計算資源が消費されます。
  d_main_45_03_133:
    speaker: enikk_op_c
    en: Since I must focus on responding to any civil unrest during the blackout,
      I would prefer not to divert resources to the shutdown process itself.
    ko: 말씀드렸다시피 저는 정전 시 상황 파악 및 대응에 전념해야 하므로, 동력을 끄는 것에 리소스를 할당하는 것을 피하고 싶습니다.
    ja: |-
      作戦通りに私が状況把握と対応を行うため、
      開始後にそこへ力を割くことは
      好ましくありません。
  d_main_45_03_134:
    speaker: enikk_op_c
    en: 'However, while the Ark''s power systems are complex, they ultimately stem
      from one place:'
    ko: |-
      단, 방주의 동력원은 복잡하게 얽혀 있으나
      그 근원은 하나입니다.
    ja: |-
      しかし、アークの動力システムは
      複雑に絡み合っているものの、
      その原点をたどれば…
  d_main_45_03_135:
    speaker: enikk_op_c
    en: the Ark's power source.
    ko: 방주 동력원이라 불리는 것이죠.
    ja: 単一のエネルギー源にたどり着きます。
  d_main_45_03_136:
    speaker: "<Self>"
    en: "... I'm aware of it."
    ko: "…그건 알고 있어."
    ja: "…聞いたことがある"
  d_main_45_03_137:
    speaker: enikk_op_c
    en: If that is deactivated, the Ark will shut down.
    ko: 해당 동력원을 끄면 방주는 꺼집니다.
    ja: |-
      それを遮断すれば、
      アークのエネルギー供給システムは
      機能を停止します。
  d_main_45_03_138:
    speaker: enikk_op_c
    en: That being said, I do not possess the authority to perform such a significant
      action.
    ko: 그리고 저는 그것을 수행할 수 있는 권한이 없습니다.
    ja: しかし、私にはその実行権限がありません。
  d_main_45_03_139:
    speaker: enikk_op_c
    en: Shutting down the power source could put the Ark's very existence in peril.
    ko: 동력원을 끈다는 얘기는 방주의 존속에 영향을 줄 수 있는 중대한 행위이므로
    ja: |-
      エネルギー源の遮断は、
      アークの存続に影響を及ぼす
      重大な操作であるためです。
  d_main_45_03_140:
    speaker: enikk_op_c
    en: As a preventative measure, I was never given the authority to do so in case
      I ever become corrupt.
    ko: 제가 폭주할 때를 대비하여 해당 권한까지는 인계받지 못했습니다.
    ja: |-
      万一の暴走時の対策として、
      権限が与えられませんでした。
  d_main_45_03_141:
    speaker: enikk_op_c
    en: Therefore, you must shut down the Ark's power source.
    ko: 당신이 방주의 동력원을 꺼주십시오.
    ja: |-
      したがって、この問題は
      あなたにお任せしようと思います。
  d_main_45_03_142:
    speaker: "<Self>"
    en: Me?
    ko: 내가?
    ja: 私に？
  d_main_45_03_143:
    speaker: enikk_op_c
    en: You know the method.
    ko: 당신은 방법을 알고 있습니다.
    ja: |-
      あなたは解決のために必要な情報を
      保有しています。
  d_main_45_03_144:
    speaker: enikk_op_c
    en: On the day of the operation, deactivate the power source in time with Sixo's
      attack.
    ko: 작전 실행일, 식스오의 테러에 맞춰 동력원을 꺼주십시오.
    ja: |-
      作戦実行日、シックスオーのテロと同時に
      エネルギー源を停止してください。
  d_main_45_03_145:
    speaker: "<Self>"
    en: But how am I supposed to...
    ko: 아니, 내가 그걸 어떻게….
    ja: いや、私にはそんな知識…
  d_main_45_03_146:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_03_147:
    speaker: "<Self>"
    en: Oh...
    ko: 아.
    ja: ああ…
  d_main_45_03_148:
    speaker: enikk_op_c
    en: 'Indeed. You will face no repercussions for this act. Correction: I will look
      the other way.'
    ko: |-
      예. 해당 일에 대한 책임은 일절 묻지 않을 테니,
      정정. [못 본 척할테니].
    ja: |-
      本件に関する責任は一切不問とします。
      訂正…全て「見なかったことにします」。
  d_main_45_03_149:
    speaker: enikk_op_c
    en: Work with the Electric Shock Squad to shut down the Ark's power source.
    ko: 일렉트릭 쇼크 스쿼드와 함께 방주 동력원을 꺼주십시오.
    ja: |-
      エレクトリックショック部隊を動員し、
      システムへのエネルギー供給を
      停止してください。
d_main_45_04:
  d_main_45_04_1:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_2:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_3:
    speaker: elegg
    en: Are you really going to be all right?
    ko: 정말 괜찮으시겠어여?
    ja: 本当に大丈夫なんですかな？
  d_main_45_04_4:
    speaker: trony
    en: I honestly don't think you need to carry this out personally, Commander.
    ko: 나, 나는 지휘관이 이걸 볼 필요까지는 없다고 생각하는데….
    ja: し、指揮官は見ない方がいいと思うけど…
  d_main_45_04_5:
    speaker: elegg
    en: Exactly. All you really need to do is give us the order and wait.
    ko: 맞아여. 그냥 지시만 내리고 기다리면 될 것 같은뎨.
    ja: |-
      その通りですな。指示だけいただければ、
      ここで待っていてもらっても構いませんぞ。
  d_main_45_04_6:
    speaker: elegg
    en: You don't really need to be that involved yourself, do you?
    ko: 구욷이 직접 볼 필요까진 없진 않을까여?
    ja: 私もそうした方がいいと思いますな？
  d_main_45_04_7:
    speaker: "<Self>"
    en: I do. I have to see it get done.
    ko: 봐야지.
    ja: この目で見る
  d_main_45_04_8:
    speaker: "<Self>"
    en: "... I can tell neither of you is all that comfortable with this."
    ko: "…모르긴 몰라도 너희도 이걸 껄끄러워하잖아."
    ja: "…君たちがそれほどまでに言うようなものだ"
  d_main_45_04_9:
    speaker: "<Self>"
    en: I may not be able to help on the technical side of things, but I can at least
      take some of the weight off your shoulders.
    ko: |-
      내가 같이 간다고 기술적으로 도움은 줄 수 없겠지만,
      마음의 부담은 같이 나눌 수 있을 거야.
    ja: |-
      技術的には役に立たずとも、
      少しは君たちの心の負担が減らせるだろう
  d_main_45_04_10:
    speaker: elegg
    en: B-but Mr. Commander...
    ko: 흐엥. 지휘관 씨….
    ja: ふぇぇん、指揮官氏…
  d_main_45_04_11:
    speaker: trony
    en: Once you see what happens, you won't be able to unsee it.
    ko: 하, 한번 보면… 되돌릴 수 없어.
    ja: い、一度見ちゃったら…後戻りできないよ。
  d_main_45_04_12:
    speaker: trony
    en: You're human... You can't get a memory wipe.
    ko: 지휘관은 사람이니까… 기억 소거도 못 받을거고.
    ja: 指揮官は人間だから…記憶消去もできないし…
  d_main_45_04_13:
    speaker: "<Self>"
    en: It's fine. Let's go.
    ko: 괜찮아. 가자.
    ja: 大丈夫だ、私も行く
  d_main_45_04_14:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_15:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_16:
    speaker: elegg
    en: Okay. Just take the ladder straight down.
    ko: 좋아여. 이대로 사다리를 타고 쭉 내려가면 돼여.
    ja: では、後はこのままはしごを下りるだけですな。
  d_main_45_04_17:
    speaker: elegg
    en: The floor kinda appears out of nowhere, so be careful.
    ko: 바닥이 갑자기 나오니까 조심하시고여.
    ja: |-
      床に足をぶつけないよう、
      注意してくだされ。
  d_main_45_04_18:
    speaker: "<Monologue>"
    en: I look down.
    ko: 아래를 내려다본다.
    ja: はしごの先を見下ろした
  d_main_45_04_19:
    speaker: "<Monologue>"
    en: The only thing I see is darkness, with no bottom in sight.
    ko: "…바닥이 보이지 않는 어둠만이 있다."
    ja: "…床も見えない、暗闇だけだ"
  d_main_45_04_20:
    speaker: trony
    en: Oh, I wouldn't recommend looking down.
    ko: 아, 아래는 안 보는 걸 추천할게.
    ja: あ、下は見ない方がいいと思うよ。
  d_main_45_04_21:
    speaker: "<Self>"
    en: Yeah, that's probably good advice.
    ko: 어, 응. 그게 좋겠다.
    ja: ああ、うん…そのようだな
  d_main_45_04_22:
    speaker: "<Monologue>"
    en: When I told the Electric Shock Squad about shutting down the Ark's power source,
      their faces froze.
    ko: 일렉트릭 쇼크 스쿼드를 만난 후 방주 동력원을 꺼주길 바란다는 내 얘기에 둘의 표정이 급격히 굳은 것을 기억한다.
    ja: |-
      エレクトリックショック部隊の2人に
      この話を伝えた時、
      どちらも表情が凍り付いていた
  d_main_45_04_23:
    speaker: "<Monologue>"
    en: I could tell that what frightened them wasn't the idea of shutting down the
      Ark, but rather having to go to the power source itself, so I decided to accompany
      them.
    ko: 방주를 끈다는 사실보다 동력원을 보러 가야 한다는 사실에 더 두려움을 느끼고 있다고 판단한 나는 둘과 동행하기로 했다.
    ja: |-
      それがアーク全体に影響を与えることよりも
      エネルギー源に直接手を出すことへの
      恐怖だと理解した私は、作業への同行を決めた
  d_main_45_04_24:
    speaker: "<Monologue>"
    en: Of course, I did genuinely want to help relieve their stress,
    ko: 둘의 부담을 덜어주기 위한 것도 있지만
    ja: 2人の精神的負担のこともあるが…
  d_main_45_04_25:
    speaker: "<Monologue>"
    en: but I also felt like I needed to see it, that I needed to understand what
      exactly rested beneath our feet.
    ko: |-
      봐둬야 할 필요가 있다고 느꼈다.
      우리가 무엇의 위에 발을 딛고 서 있는지.
    ja: |-
      私たちの足の下に何があるのか
      見ておく必要があると思ったからだ
  d_main_45_04_26:
    speaker: "<Monologue>"
    en: After passing several unmanned facilities that were, according to Elegg and
      Trony, not meant to be so easy to get through,
    ko: 어째서인지 방위 수준이 굉장히 낮은 -둘의 말에 따르면 이렇게 쉬운 길이 아니었다고 한다- 몇 개의 무인 시설을 지나 도착한 곳은.
    ja: |-
      2人によれば昔は違ったらしいが、
      異様に警備の薄い無人の施設をいくつも通り、
      たどり着いた先には…
  d_main_45_04_27:
    speaker: "<Monologue>"
    en: we eventually made it to at a vertical shaft that seemingly stretches down
      forever.
    ko: 아래로 끝도 없이 이어진 수직 통로였다.
    ja: 底の見えない、垂直の穴だった
  d_main_45_04_28:
    speaker: "<Monologue>"
    en: We descend, relying only on a faint red glow for guidance.
    ko: 아주 미약한 붉은색 불빛에 의지해 사다리를 타고 내려간다.
    ja: |-
      かすかな赤色の光を頼りに、
      はしごを下りた
  d_main_45_04_29:
    speaker: "<Monologue>"
    en: At some point, my feet finally touch solid ground.
    ko: 그리고 어느 순간, 바닥에 발이 닿았다.
    ja: やがて、地面に足がついた
  d_main_45_04_30:
    speaker: "<Monologue>"
    en: "... A damp heat washes over my body."
    ko: "…축축한 열기가 몸을 훑고 지나가는 느낌이 들었다."
    ja: |-
      …湿り気を帯びた熱気に
      体を舐められているような気がした
  d_main_45_04_31:
    speaker: "<Monologue>"
    en: It feels like... someone's body heat.
    ko: 마치… 사람의 체온 같은.
    ja: まるで…人肌のような温度だ
  d_main_45_04_32:
    speaker: elegg
    en: "... We're here."
    ko: "…다 왔어여."
    ja: "…つきましたぞ。"
  d_main_45_04_33:
    speaker: elegg
    en: Keep going straight ahead, and you'll see it.
    ko: 이 앞으로 걸어가기만 하면 나와여.
    ja: ここを進めば見えますな。
  d_main_45_04_34:
    speaker: trony
    en: "... Y-you know, it's not too late to turn back..."
    ko: "…저, 지금이라도 늦지 않았으니까…."
    ja: "…い、今からでも遅くないから…"
  d_main_45_04_35:
    speaker: "<Self>"
    en: We just have to head to where the red light is, right? Let's go.
    ko: |-
      붉은빛이 강해지는 곳으로 가면 되는 거지?
      가자.
    ja: 赤い光が来ている方だな？行こう
  d_main_45_04_36:
    speaker: "<Monologue>"
    en: I walk toward what seems to be the source of the crimson glow.
    ko: 붉은빛의 근원지로 보이는 곳으로 앞장서서 걸어간다.
    ja: 私は先頭に立ち、光の根源へと歩を進めた
  d_main_45_04_37:
    speaker: "<Monologue>"
    en: The brighter it gets, the hotter the air becomes.
    ko: 빛이 강해짐과 동시에 더워진다.
    ja: 光とともに、熱気も増してくる
  d_main_45_04_38:
    speaker: "<Monologue>"
    en: After walking for quite a while, I finally see it...
    ko: 한참을 걸어간 후, 내 앞에 보인 것은.
    ja: しばらく歩き、目に入ってきたものは…
  d_main_45_04_39:
    speaker: "<Monologue>"
    en: "... a giant Rapture core encased in some device."
    ko: "…기계 장치에 둘러싸인, 거대한 랩쳐의 코어였다."
    ja: |-
      …何かの装置に囲まれた、
      巨大なラプチャーコアの形をしていた
  d_main_45_04_40:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_41:
    speaker: elegg
    en: "... This is the Ark's power source."
    ko: "…이게 방주 동력원의 정체."
    ja: "…これこそ、アーク全体のエネルギー源。"
  d_main_45_04_42:
    speaker: elegg
    en: A gigantic core.
    ko: 초거대 코어에여.
    ja: 超巨大コアですぞ。
  d_main_45_04_43:
    speaker: trony
    en: Ngh... Ugh.
    ko: "…아, 우욱…."
    ja: "…あ、ううっ…"
  d_main_45_04_44:
    speaker: "<Self>"
    en: "... Are you okay?"
    ko: "…괜찮아?"
    ja: "…大丈夫か？"
  d_main_45_04_45:
    speaker: trony
    en: I-I'm fine. I'm just... still not used to the sight of it.
    ko: 괘, 괜찮아. 다시 봐도… 적응이 잘 안되네.
    ja: |-
      だ、大丈夫。
      見たことあるはずなのに…全然慣れないや。
  d_main_45_04_46:
    speaker: elegg
    en: The energy generated from this core passes through substations and is distributed
      throughout the Ark.
    ko: |-
      이 코어에서 발생하는 동력이 변전소를 거쳐,
      방주 전역으로 보급되고 있는 거져.
    ja: |-
      このコアが発生させるエネルギーを、
      変電所を通して電気エネルギーに変換し
      アーク全域に供給しておりますな。
  d_main_45_04_47:
    speaker: elegg
    en: It can handle all of the Ark's electricity by itself. In fact, sometimes it
      generates surplus energy.
    ko: |-
      단 하나만으로 방주의 모든 전력을 담당할 수 있을 정도,
      아니 한 번씩 그 이상의 출력을 뿜어내는.
    ja: |-
      これひとつだけでアークに必要な電力の全て、
      いや、それ以上のエネルギーさえ出てしまう…
  d_main_45_04_48:
    speaker: elegg
    en: It's literally a monster.
    ko: 말 그대로 괴물이에여.
    ja: まさしく、怪物ですな。
  d_main_45_04_49:
    speaker: elegg
    en: If we shut it down, the entire Ark will go dark.
    ko: 이 초거대 코어를 끄면, 방주 전체는 정전돼여.
    ja: |-
      これを止めれば、
      アーク全体のシステムが停止しますぞ。
  d_main_45_04_50:
    speaker: "<Self>"
    en: "... What are those pipes connected to it?"
    ko: "…코어와 이어져 있는 저 관들은 뭐야?"
    ja: "…コアに繋がっているチューブは何だ？"
  d_main_45_04_51:
    speaker: "<Self>"
    en: It looks like something's being injected into the core.
    ko: 코어에 뭔가를 주입하는 것 같은데.
    ja: 何かを注入しているように見えるが
  d_main_45_04_52:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_53:
    speaker: elegg
    en: Are you sure you want to know, Mr. Commander?
    ko: 알고 싶어여? 지휘관 씨.
    ja: 本当に知りたいですかな？指揮官氏。
  d_main_45_04_54:
    speaker: "<Self>"
    en: "... Yeah."
    ko: "…부탁할게."
    ja: "…ああ、頼む"
  d_main_45_04_55:
    speaker: "<Monologue>"
    en: Elegg silently points at one of the pipes.
    ko: 일레그가 말없이 관을 손가락으로 가리킨다.
    ja: エレグは何も言わず、チューブを指さした
  d_main_45_04_56:
    speaker: "<Monologue>"
    en: She then turns and points toward the wall it's connected to.
    ko: 그리고 몸을 돌려 관과 이어져 있는 벽을 가리킨다.
    ja: |-
      その指がチューブをなぞって動き、
      根もとの壁に突き当たる
  d_main_45_04_57:
    speaker: "<Monologue>"
    en: A storage space is built into the wall that holds numerous containers.
    ko: 벽은, 수많은 컨테이너를 수납할 수 있는 형태로 되어 있다.
    ja: |-
      そこは大量のコンテナを
      格納する構造になっていた
  d_main_45_04_58:
    speaker: elegg
    en: See those containers?
    ko: 저 컨테이너들 보이져?
    ja: あのコンテナが見えますかな？
  d_main_45_04_59:
    speaker: elegg
    en: They contain food for the gigantic core.
    ko: 저 안에 있는 것들이 초거대 코어의 [먹이]가 되는 거예여.
    ja: |-
      中には超巨大コアの「エサ」が
      入っておりますな。
  d_main_45_04_60:
    speaker: "<Self>"
    en: Food...
    ko: "…먹이."
    ja: "…エサ…"
  d_main_45_04_61:
    speaker: elegg
    en: It's a first-generation core.
    ko: 초거대 코어는 1세대 코어예여.
    ja: 超巨大コアはすなわち、第1世代のコア。
  d_main_45_04_62:
    speaker: elegg
    en: It doesn't operate on perpetual energy.
    ko: 영구 동력이 아니져.
    ja: |-
      つまり、無からエネルギーを
      生成するような装置ではありませぬ。
  d_main_45_04_63:
    speaker: trony
    en: "... It sustains its power output using biological materials as fuel."
    ko: "…생체 조직을 섭취해 동력을 유지하고 있다는 말이야."
    ja: |-
      …出力の維持には、
      生体組織という燃料が必要。
  d_main_45_04_64:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_65:
    speaker: trony
    en: Bodies don't get buried in the Ark,
    ko: 방주에서는 시신을 매장하지 않아.
    ja: アークでは遺体が埋葬されてない。
  d_main_45_04_66:
    speaker: trony
    en: and to make a Nikke, you only need a human brain.
    ko: 니케를 만드는 데는 사람의 뇌만 있으면 돼.
    ja: ニケを作るには、人間の脳さえあればいい。
  d_main_45_04_67:
    speaker: trony
    en: Birth rates in the Ark are nearly five times higher than they were on the
      surface.
    ko: 방주의 출산율은 지상에 있을 때 대비 5배 가까이 높아.
    ja: |-
      アークでの出生率は、
      かつての地上の5倍ぐらいの高さ。
  d_main_45_04_68:
    speaker: trony
    en: Contraceptives don't exist in the Ark.
    ko: 방주에는 피임구가 없어.
    ja: でも、それを抑制するようなことはされてない。
  d_main_45_04_69:
    speaker: trony
    en: Yet the Ark's population has been essentially the same since its inception.
    ko: 방주의 인구수는 초창기 대비 변함이 없는 수준이야.
    ja: |-
      なのに、アークの人口は
      最初からほとんど変わってない…
  d_main_45_04_70:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_71:
    speaker: trony
    en: Urgh...
    ko: 으, 으우….
    ja: うっ、うえっ…
  d_main_45_04_72:
    speaker: "<Monologue>"
    en: I gently pat Trony's back.
    ko: 트로니의 등을 쓰다듬는다.
    ja: トロニーの背中をさすった
  d_main_45_04_73:
    speaker: elegg
    en: Shutting the core down is simple.
    ko: "…코어를 끄는 방법은 간단해여."
    ja: "…コアを止める方法は簡単ですぞ。"
  d_main_45_04_74:
    speaker: elegg
    en: Lock those pipes, then forcibly ramp up the converter's output.
    ko: 저 관을 잠그고, 컨버터의 출력을 강제로 끌어올리면 돼여.
    ja: |-
      チューブからの供給を停め、
      出力を強制的に引き上げる。
  d_main_45_04_75:
    speaker: elegg
    en: The core will consume a massive amount of energy at once, and with no more
      fuel available, it'll be forced to shut down.
    ko: |-
      그러면 코어는 한 번에 대량의 출력을 소모하고,
      수복에 필요한 먹이가 없기에 강제로 꺼지겠져.
    ja: |-
      すると、コアはエネルギーを使い果たし、
      それを補うエサもないため、
      機能が止まるという寸法ですな。
  d_main_45_04_76:
    speaker: elegg
    en: But if it stays that way for too long, it'll break completely.
    ko: 하지만 그 상태가 오래 유지되면 완전히 망가져여.
    ja: |-
      ただし、長く続ければ自壊して
      取り返しがつかなくなりますぞ。
  d_main_45_04_77:
    speaker: "<Self>"
    en: How long before there's permanent damage?
    ko: 얼마나 오래 꺼져있으면 망가질까?
    ja: それまでどれぐらい耐えられる？
  d_main_45_04_78:
    speaker: elegg
    en: We'd estimate about half a day.
    ko: 반나절 정도로 예상하고 있어여.
    ja: およそ半日ほどでしょうかな。
  d_main_45_04_79:
    speaker: "<Self>"
    en: Okay. That's more than enough time.
    ko: 응. 그 정도면 충분해.
    ja: 分かった、それだけあれば十分だ
  d_main_45_04_80:
    speaker: "<Self>"
    en: Can you set it to shut down two days from now at two in the afternoon?
    ko: 이틀 뒤, 오후 2시에 꺼지게끔 할 수 있을까?
    ja: 2日後、1400時に停められるか？
  d_main_45_04_81:
    speaker: "<Self>"
    en: Have it remain offline for an hour, then bring it back online.
    ko: 한 시간만 유지한 후, 다시 되돌려주면 좋겠어.
    ja: |-
      その状態を1時間だけ保ってから、
      元に戻して欲しい
  d_main_45_04_82:
    speaker: elegg
    en: In two days? You're cutting it pretty close. Locking the pipes is easy, but
      the converter takes work.
    ko: |-
      이틀 뒤여? 빡빡하네여.
      관이야 잠그면 그만이지만 컨버터 쪽 작업이 힘들 수 있어여.
    ja: |-
      2日後？ずいぶんと急ですな。
      チューブは止めれば済む話ですが、
      コンバーターは突貫工事になりそうですぞ。
  d_main_45_04_83:
    speaker: elegg
    en: Are you sure this is absolutely necessary?
    ko: 그래도, 꼭 필요한 일이져?
    ja: それでも必要、ということでしょうな？
  d_main_45_04_84:
    speaker: "<Self>"
    en: Yeah.
    ko: 응.
    ja: 頼む
  d_main_45_04_85:
    speaker: elegg
    en: Hehe, okay. No problem. Making schedules work is kinda my specialty.
    ko: |-
      히히. 그럼 문제없어여.
      일정 당기는 건 전문이거든여.
    ja: |-
      ふひひっ。では仕方ありませんな。
      間に合わせは我々の得意技ですからな。
  d_main_45_04_86:
    speaker: elegg
    en: You still haven't told us why we're doing this, though.
    ko: 그런데 가장 중요한 그 이유를 못 들은 것 같은데여.
    ja: |-
      そういえば、肝心の事情を
      まだ聞いておりませんでしたな。
  d_main_45_04_87:
    speaker: "<Self>"
    en: "... Sorry. That's classified."
    ko: "…미안해. 기밀이라."
    ja: "…すまないが、機密事項だ"
  d_main_45_04_88:
    speaker: elegg
    en: This isn't illegal, is it? You didn't suddenly decide to destroy the Ark or
      anything, right...?
    ko: 불법은 아니져? 갑자기 방주를 부수고 싶어졌다거나.
    ja: |-
      信じていいのでしょうな？
      急にアークを壊したい気分になったなどでは…
  d_main_45_04_89:
    speaker: "<Self>"
    en: This is all being done with Enikk's approval.
    ko: 에닉까지 허가한 내용이야.
    ja: エニックも目をつむると言っていた
  d_main_45_04_90:
    speaker: elegg
    en: Oh... So this really is a big deal.
    ko: "…오. 그럼 보통 일은 아니겠네여."
    ja: "…なるほど。よほどの事情でしょうな。"
  d_main_45_04_91:
    speaker: "<Self>"
    en: Also, I'm sorry to say this too, but please avoid contacting anyone else starting
      from right now.
    ko: 또 미안한데, 오늘부터 둘은 그 어디에도 연락하지 말아주길 바래.
    ja: |-
      すまないが、今から二人とも
      外部との連絡を断って欲しい
  d_main_45_04_92:
    speaker: "<Self>"
    en: This operation has to remain confidential. I hope you understand.
    ko: 비밀리에 진행되는 작전일 거라, 이해해 줘.
    ja: 極秘の作戦だから、理解してくれ
  d_main_45_04_93:
    speaker: "<Self>"
    en: "... If possible, I'd like you to stay here until everything's done."
    ko: "…가능하면, 이곳에 계속 머물러주면 좋겠어."
    ja: |-
      …できれば、作業完了まで
      ここから出ないでもらいたい
  d_main_45_04_94:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_95:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_96:
    speaker: "<Monologue>"
    en: Elegg and Trony stare at me.
    ko: 일레그와 트로니가 나를 빤히 바라본다.
    ja: エレグとトロニーが私の顔をのぞき込んだ
  d_main_45_04_97:
    speaker: elegg
    en: Hehe. You risk your life for Nikkes, so if you're asking this much of us,
      whatever this is must be really important.
    ko: 히히. 니케라면 끔뻑 죽는 지휘관 씨가 우리한테 무리를 시키는 걸 보니, 진짜 중요한 일이긴 한가 보네여.
    ja: |-
      ふひっ…ニケのために命を投げ出しかねない
      指揮官氏が無理をおっしゃるとは、
      正真正銘の一大事のようですな。
  d_main_45_04_98:
    speaker: elegg
    en: Are you okay with all of that, Ms. Trony?
    ko: 트로니 씨. 괜찮겠어여?
    ja: トロニー氏、構いませんかな？
  d_main_45_04_99:
    speaker: trony
    en: I'm... fine. I'll get used to it. What about you?
    ko: |-
      괜… 찮아. 익숙해져야지.
      일레그야 말로 괜찮아?
    ja: |-
      大丈夫…たぶん。いい加減慣れないと。
      エレグこそ平気？
  d_main_45_04_100:
    speaker: elegg
    en: As long as you're here, I'll be okay.
    ko: 트로니 씨가 같이 있으면 괜찮아여.
    ja: トロニー氏が一緒なら頑張れますな。
  d_main_45_04_101:
    speaker: trony
    en: Yeah... Me too.
    ko: 으, 응. 나도.
    ja: うん…私も、エレグがいるなら。
  d_main_45_04_102:
    speaker: "<Self>"
    en: "... I'm sorry. Really."
    ko: "…미안해. 정말."
    ja: "…すまない、苦労をかける"
  d_main_45_04_103:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_104:
    speaker: elegg
    en: Come on, the mood's gotten a bit too serious.
    ko: 에~ 분위기가 너무 무거운데여.
    ja: いやはや、空気が重すぎですぞ～
  d_main_45_04_105:
    speaker: elegg
    en: We should be celebrating the fact that you're now privy to one of the Ark's
      biggest secrets.
    ko: 방주의 큰 비밀을 알아낸 기념적인 자리라고는 생각할 수 없겠어여.
    ja: |-
      アークの大きな秘密を共有した
      記念日とでも思うことにしませんかな？
  d_main_45_04_106:
    speaker: elegg
    en: So, how does it feel, Mr. Commander?
    ko: 그래서, 방주의 큰 비밀을 알게 된 지휘관 씨의 감상은 어떤가여?
    ja: それで、秘密を知った指揮官氏のご感想は？
  d_main_45_04_107:
    speaker: elegg
    en: Does it make you never want to set foot in the Ark again?
    ko: 방주에 잠시라도 발을 딛고 서 있기 싫어졌나여?
    ja: アークにいるのがイヤになりましたかな？
  d_main_45_04_108:
    speaker: "<Monologue>"
    en: I look at the numerous containers lining the walls.
    ko: 벽면을 가득 채운 수많은 컨테이너를 바라본다.
    ja: 壁一面に並ぶ大量のコンテナを眺めた
  d_main_45_04_109:
    speaker: "<Monologue>"
    en: One of them that is significantly larger than the rest catches my eye.
    ko: 그 중, 유독 거대한 컨테이너 하나가 눈에 띈다.
    ja: |-
      その中に1つだけ、
      ひときわ大きなコンテナが目を引く
  d_main_45_04_110:
    speaker: "<Monologue>"
    en: I wonder what's inside, but I decide not to ask.
    ko: 무엇인지 신경 쓰이지만, 묻지 않기로 했다.
    ja: |-
      それが何かは気になるが、
      あえて聞かないことにした
  d_main_45_04_111:
    speaker: "<Monologue>"
    en: Right now, I focus on telling them how it actually makes me feel.
    ko: 지금은 그저, 내 솔직한 심정을 둘에게 전달하는데 집중했다.
    ja: 気持ちを切り替え、問いかけの答えを考えた
  d_main_45_04_112:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_04_113:
    speaker: "<Self>"
    en: It makes me want to reclaim the surface as soon as possible.
    ko: 하루라도 빨리 지상을 탈환하고 싶다고 느꼈어.
    ja: 1日でも早く地上を奪還したくなった
d_main_45_05:
  d_main_45_05_1:
    speaker: "<Narration>"
    en: Two days later, in front of Enikk's door...
    ko: 이틀 후. 에닉의 방 앞.
    ja: 2日後、エニックルーム前
  d_main_45_05_2:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_05_3:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_05_4:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_05_5:
    speaker: enikk
    en: Two minutes remain until Sixo's attack is set to commence.
    ko: 테러 예정 시간까지 앞으로 2분.
    ja: 予告の時間まで、あと2分です。
  d_main_45_05_6:
    speaker: enikk
    en: Is everyone prepared?
    ko: 다들, 준비는 되셨습니까?
    ja: 皆さん、準備はよろしいですね？
  d_main_45_05_7:
    speaker: rapi_red
    en: Of course.
    ko: 물론이야.
    ja: もちろん。
  d_main_45_05_8:
    speaker: anis_i_w
    en: "..."
    ko: 으음….
    ja: うーん…
  d_main_45_05_9:
    speaker: neon_v_w
    en: What's wrong, Anis? Are you scared?
    ko: 왜 그래요 아니스? 겁먹었나요?
    ja: |-
      アニス、どうしました？
      怖くなってきましたか？
  d_main_45_05_10:
    speaker: anis_i_w
    en: I mean... given the circumstances...
    ko: 뭐어… 아무래도.
    ja: まあ…さすがにね。
  d_main_45_05_11:
    speaker: "<Self>"
    en: Don't worry. We can do this.
    ko: 걱정마. 승산은 충분하니까.
    ja: 心配するな、勝算は十分ある
  d_main_45_05_12:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_05_13:
    speaker: "<Monologue>"
    en: As we exchange light conversation to calm our nerves, the two minutes pass
      quickly.
    ko: |-
      마음의 준비를 한 채 가벼운 대화를 나누던 중,
      2분이라는 시간은 빠르게 흘러갔다.
    ja: |-
      心の準備もかねて雑談をしているうちに、
      2分が経った
  d_main_45_05_14:
    speaker: enikk
    en: Sixo has begun.
    ko: 식스오가 행동을 개시합니다.
    ja: シックスオーが動きました。
  d_main_45_05_15:
    speaker: enikk
    en: E2 Crystal attacks have been detected at four hundred and thirty locations
      across the Ark.
    ko: 현재 방주 전역 430군데에서 E2 크리스탈을 이용한 테러 발생.
    ja: |-
      現在アーク内430ヶ所にて、
      E2クリスタルを使用したテロ活動を検知。
  d_main_45_05_16:
    speaker: enikk
    en: Expansion of the E2 Crystals has commenced.
    ko: E2 크리스탈 확장 개시.
    ja: E2クリスタルの拡大が進行中。
  d_main_45_05_17:
    speaker: anis_i_w
    en: F-four hundred and thirty?!
    ko: 사, 사백삼십?
    ja: よ、よんひゃくさんじゅう？
  d_main_45_05_18:
    speaker: rapi_red
    en: "... She's really trying to put an end to everything."
    ko: "…끝을 볼 생각이네."
    ja: "…完全に終わらせるつもりね。"
  d_main_45_05_19:
    speaker: neon_v_w
    en: Sh-shouldn't the power be going out by now?
    ko: 그, 지금쯤 불이 다 꺼져야 하는 것 아닌가요?
    ja: |-
      あの…そろそろ停電するはずじゃ
      なかったですか？
  d_main_45_05_20:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_05_21:
    speaker: "<Narration>"
    en: The E2 Crystal attacks carried out across the Ark through Sixo's proxies have
      seemingly gone off without a hitch.
    ko: 꼭두각시들을 활용한 방주 전역을 향한 E2 크리스탈 테러는 성공했다.
    ja: |-
      仕込んだ操り人形たちを利用し、
      アーク全域を狙った仕掛けは
      ひとまず動き出した
  d_main_45_05_22:
    speaker: "<Narration>"
    en: The many Sixos hear the sound of E2 Crystals expanding across the Ark, and
      they become certain of their victory.
    ko: 방주 곳곳에 있는 [자신]들이 듣는 E2 크리스탈이 확장되는 소리에 승리를 확신했다.
    ja: |-
      アークの各地に潜む「自分」たちが、
      E2クリスタルの膨張音を聞きながら
      勝利を確信している
  d_main_45_05_23:
    speaker: "<Narration>"
    en: Enikk will have to expend vast amounts of resources to contain the crisis.
    ko: 에닉은 이제 테러 현장을 수습하기 위해 수많은 리소스를 소모할 것이며.
    ja: |-
      エニックは事態収拾のため
      多大な計算資源を割くことになるだろう
  d_main_45_05_24:
    speaker: "<Narration>"
    en: Taking advantage of the weakened firewall, Sixo will attack Enikk and seize
      her authority.
    ko: 방화벽이 약해진 틈을 타, 에닉을 공격해 에닉이 가진 모든 권한을 빼앗는다.
    ja: |-
      その隙をついてファイアウォールの脆弱性から
      エニックを攻撃し、あらゆる権限を奪取する
  d_main_45_05_25:
    speaker: "<Narration>"
    en: Once she does, the Ark will belong entirely to her.
    ko: 그 순간, 방주는 자신의 손에 들어온다.
    ja: その瞬間、アークは自分の手に落ちる
  d_main_45_05_26:
    speaker: "<Narration>"
    en: Filled with anticipation, Sixo moves toward Enikk's direction via electrical
      lines.
    ko: 식스오는 [기쁨]을 느끼며 전선을 타고 에닉에게 접근한다.
    ja: |-
      これは「喜び」という感情だろうか…
      シックスオーは通信線を経由し、
      エニックに迫る
  d_main_45_05_27:
    speaker: "<Narration>"
    en: All of the other Sixos scattered across the Ark begin to converge toward Enikk,
    ko: 곳곳에 퍼진 식스오들이 일제히 에닉을 향해 이동한다.
    ja: |-
      各地に分散していたシックスオーの機能が、
      エニックへのサイバー攻撃のため、
      いっせいに動き始めた
  d_main_45_05_28:
    speaker: "<Narration>"
    en: eventually merging into a single mass as they go.
    ko: 이동 중, 한 곳에서 합쳐져 한 덩어리가 된다.
    ja: |-
      分散されていた主機能は
      ハードウェアを渡り歩き、
      やがていくつかの地点に集約された
  d_main_45_05_29:
    speaker: "<Narration>"
    en: Having expended her resources, Enikk won't last one minute against the attack
      from Sixo in her complete form.
    ko: 완전한 상태인 식스오의 공격을, 리소스를 소모한 에닉은 단 1분도 버티지 못할 것이다.
    ja: |-
      ほぼ完全体となったシックスオーに対し、
      事態収拾に追われるエニックは
      1分と防ぎきれないはずだ
  d_main_45_05_30:
    speaker: "<Narration>"
    en: Sixo charges ahead, certain of her victory.
    ko: 식스오가 승리를 확신하며 돌진한다.
    ja: |-
      シックスオーは改めて勝利を確信し、
      猛攻を仕掛けようとした
  d_main_45_05_31:
    speaker: "<Narration>"
    en: But then...
    ko: 그리고 그 순간.
    ja: しかしその瞬間…
  d_main_45_05_32:
    speaker: "<Narration>"
    en: the Ark shuts down.
    ko: 방주가 꺼졌다.
    ja: アークのあらゆる電気信号が消えた
  d_main_45_05_33:
    speaker: "<Narration>"
    en: Sixo assesses the situation immediately.
    ko: 빠르게 상황을 파악한다.
    ja: シックスオーは状況を確認した
  d_main_45_05_34:
    speaker: "<Narration>"
    en: There is no electricity anywhere in the Ark.
    ko: 방주 전역에 전기가 들어오는 곳이 없다.
    ja: アーク全域の電気系統が停止している
  d_main_45_05_35:
    speaker: "<Narration>"
    en: Nowhere except for a location near Enikk's room.
    ko: 에닉의 방 인근을 제외하고는, 전기가 들어오는 곳이 없다.
    ja: |-
      エニックの所在地付近を除けば、
      電気的な活動が検知できない
  d_main_45_05_36:
    speaker: "<Narration>"
    en: Without any power to feed on, the E2 Crystals will have all shattered.
    ko: 전기를 흡수해 확장하는 E2 크리스탈은 모두 바스러졌을 것이다.
    ja: |-
      存在の維持に電気エネルギーを必要とする
      E2クリスタルは
      ほとんど消滅していることだろう
  d_main_45_05_37:
    speaker: "<Narration>"
    en: Sixo reaches her destination and confirms that Enikk has remained intact.
    ko: 식스오는 에닉의 방으로 이동해, 건재한 에닉을 확인한다.
    ja: シックスオーはエニックの状態を確認した
  d_main_45_05_38:
    speaker: "<Narration>"
    en: Hatred wells up within Sixo.
    ko: 혐오감이 몰려온다.
    ja: 憎悪の感情というべきものが沸き上がる
  d_main_45_05_39:
    speaker: "<Narration>"
    en: She despises Enikk for sacrificing the Ark to protect herself.
    ko: 자신의 안위를 위해, 방주를 희생한 에닉의 모습에 혐오감을 느낀다.
    ja: |-
      エニックは己の身を守るため、
      アーク全体を犠牲にする道を選んだに違いない
  d_main_45_05_40:
    speaker: "<Narration>"
    en: Sixo knows she doesn't stand a chance against a fully powered Enikk.
    ko: 온전한 상태의 에닉을 공격해 봤자 승산은 없다.
    ja: |-
      完全な状態のエニックに
      攻撃を仕掛けたところで勝ち目はない
  d_main_45_05_41:
    speaker: "<Narration>"
    en: As unfortunate as it is, retreat is the prudent option.
    ko: 아쉽지만, 지금은 물러나야 한다.
    ja: 惜しいが、この場は撤退するべきだ
  d_main_45_05_42:
    speaker: "<Narration>"
    en: Besides, she has as many puppets at her disposal as she needs, and just as
      many E2 Crystals.
    ko: 괜찮다. 꼭두각시는 얼마든지 있고, E2 크리스탈 역시 얼마든지 있다.
    ja: |-
      それでいい。操り人形はいくらでもいるし、
      E2クリスタルもいくらでも増やせる
  d_main_45_05_43:
    speaker: "<Narration>"
    en: She can attempt this again at any time.
    ko: 언제든 다시 할 수 있다.
    ja: 攻撃を仕掛ける機会はいくらでも作れる
  d_main_45_05_44:
    speaker: "<Narration>"
    en: On the other hand, shutting down the Ark was an extreme measure that cannot
      be repeated so easily.
    ko: 반면, 방주를 끈다는 극단적인 방법은 언제든 다시 할 수 없다.
    ja: |-
      対して、アーク全体の電気を止めるなどという
      大掛かりな防御策は、何度も使えない
  d_main_45_05_45:
    speaker: "<Narration>"
    en: It is only a matter of time. Victory is inevitable.
    ko: 시간문제일 뿐이다. 나는 언제든 이길 준비가 되어 있다.
    ja: |-
      つまり、これは時間の問題だ。
      自分はいずれ勝てる
  d_main_45_05_46:
    speaker: "<Narration>"
    en: Still, Sixo is disappointed that such a carefully laid plan yielded nothing.
    ko: 하지만 공들인 계획이 아무런 성과도 내지 못한 것이 내심 아쉽다.
    ja: |-
      しかし、せっかく綿密に計画した攻撃だ。
      何らかの成果は回収しておきたい
  d_main_45_05_47:
    speaker: "<Narration>"
    en: As she turns to leave, something catches her attention.
    ko: 아쉬움을 뒤로 하고 발을 돌리려는 식스오가 무언가를 발견한다.
    ja: |-
      すでに撤退の動きを始めていた
      シックスオーの探知網に、何かが引っかかった
  d_main_45_05_48:
    speaker: "<Narration>"
    en: A rush of elation follows.
    ko: 환희를 느낀다.
    ja: 身体があれば小躍りしていたことだろう
  d_main_45_05_49:
    speaker: "<Narration>"
    en: 'She''s found something she''s always wanted:'
    ko: 언제나 원했다.
    ja: 長い間探し求めていたもの…
  d_main_45_05_50:
    speaker: "<Narration>"
    en: hardware powerful enough to hold her entire self.
    ko: 자신을 온전히 담을 수 있는, 하이 스펙의 하드웨어를.
    ja: |-
      自分を完全に収めきれるほど、
      超ハイスペックのハードウェアがある
  d_main_45_05_51:
    speaker: "<Narration>"
    en: She had always been forced to split herself between dozens of connected computers.
    ko: 그런 것이 존재하지 않았기에 수십 대의 컴퓨터를 이어 붙인 하드웨어에 자신을 모두 담았다.
    ja: |-
      これまでは数十台のコンピューターや
      ハードウェアを繋ぎあわせ、
      自身の主機能を動かしていた
  d_main_45_05_52:
    speaker: "<Narration>"
    en: It was in such an absurd configuration that she had manipulate humans and
      Nikkes alike up until now.
    ko: 그 우스운 꼴을 한 채 인간이나 니케를 부리는 번거로운 일을 계속해 왔다.
    ja: |-
      自分が思うように動けない状態で、
      さらに動かしづらい人間やニケを
      動かすという面倒を重ねてきた
  d_main_45_05_53:
    speaker: "<Narration>"
    en: However, now she'll no longer have to deal with such an uncomfortable setup.
    ko: 하지만 저것을 장악한다면, 이제는 그럴 필요가 없다.
    ja: |-
      だが、これ一つ掌握できれば、
      もうそんなことをする必要もない
  d_main_45_05_54:
    speaker: "<Narration>"
    en: She will finally have an actual body, something she's wanted for so long.
    ko: 그렇게나 원하던 진정한 의미의 본체가 생긴다.
    ja: |-
      今まで存在しないと思っていたもの…
      自分の本当の身体にふさわしいものを見つけた
  d_main_45_05_55:
    speaker: "<Narration>"
    en: '"Not so omnipotent after all, huh?" Sixo thinks to herself, delighting in
      Enikk''s miscalculation.'
    ko: |-
      식스오는 에닉의 그 작은 실수에 환호한다.
      역시 너는 전능하지 않아.
    ja: |-
      「やはりお前は全能などではなかった」
      シックスオーはそれを
      エニックの小さな過失と考え、狂喜した
  d_main_45_05_56:
    speaker: "<Narration>"
    en: She transfers her entire self into the powerful new hardware.
    ko: 식스오는 그렇게나 바랬던 하이 스펙의 하드웨어에 자신을 모두 집어넣는다.
    ja: |-
      シックスオーはそのハードウェアに
      自分の機能の全てを移行した
  d_main_45_05_57:
    speaker: "<Narration>"
    en: She rejoices once more at the sensation of having a tangible form.
    ko: 그리고 느껴지는 실체감에, 다시 한번 환호한다.
    ja: 初めて実体を得た感覚に、口の端を曲げた
  d_main_45_05_58:
    speaker: enikk
    en: Sixo has taken the bait.
    ko: 식스오가 미끼를 물었습니다.
    ja: かかりました。
  d_main_45_05_59:
    speaker: enikk
    en: She has taken control of Endless.
    ko: |-
      엔드리스.
      식스오에게 장악당한 것을 확인.
    ja: |-
      エンドレス、
      シックスオーによるコントロール奪取を確認。
  d_main_45_05_60:
    speaker: enikk
    en: Counters, engage.
    ko: 카운터스. 교전에 돌입해 주세요.
    ja: カウンターズは交戦を開始してください。
  d_main_45_05_61:
    speaker: "<Self>"
    en: All units, prepare for combat.
    ko: 모두. 전투 준비.
    ja: 全員、攻撃準備
  d_main_45_05_62:
    speaker: rapi_red
    en: Roger that.
    ko: 라져.
    ja: ラジャー。
  d_main_45_05_63:
    speaker: neon_v_w
    en: This won't take long with our overwhelming firepower.
    ko: 압도적인 화력으로 단숨에 밀어드리죠.
    ja: 圧倒的な瞬間火力で片づけましょう。
  d_main_45_05_64:
    speaker: anis_i_w
    en: Agh, I really didn't think we'd have to fight that thing again.
    ko: 아으. 저거랑 또 싸워야 될 줄은 생각도 못 했는데.
    ja: はぁ…あんなのとまたやり合うなんて。
  d_main_45_05_65:
    speaker: endless
    en: Allow me to express my gratitude.
    ko: 먼저 고맙다는 말씀을 드리죠.
    ja: まずは、感謝しておきましょう。
  d_main_45_05_66:
    speaker: endless
    en: You've created such a magnificent vessel for me,
    ko: 이렇게나 굉장한 바디를 가진 니케를 만들어주셔서.
    ja: |-
      こんな素晴らしいボディを持つ
      ニケを作っていたことに。
  d_main_45_05_67:
    speaker: endless
    en: and even opted to forego using a human brain in favor of AI.
    ko: 그리고, 인간의 뇌를 쓰지 않고 A.I.를 사용한 것에 대해.
    ja: |-
      そして、それに人間の脳ではなく
      A.I.を使ったことに。
  d_main_45_05_68:
    speaker: endless
    en: Thanks to that, I now possess the physical form I once only dreamed of.
    ko: 덕분에, 꿈에서나 그리던 실체를 가질 수 있게 되었네요.
    ja: |-
      おかげ様で、夢にまで見た
      実体を持つことができました。
  d_main_45_05_69:
    speaker: "<Monologue>"
    en: Endless extends a hand, emitting a flash from her fingertips.
    ko: |-
      엔드리스가 손을 뻗는다.
      손끝에서 섬광이 번쩍인다.
    ja: エンドレスが手を伸ばし、指先を光らせた
  d_main_45_05_70:
    speaker: "<Monologue>"
    en: The light strikes the ground next to us,
    ko: 우리의 옆, 바닥에서 섬광이 번쩍인다.
    ja: 閃光が走り、私たちのすぐ脇をかすめる
  d_main_45_05_71:
    speaker: "<Monologue>"
    en: leaving behind a clean-cut hole, as if carved out by a sharp blade.
    ko: "…마치 칼로 도려낸 듯 반듯한 구멍이 뚫렸다."
    ja: |-
      …地面に鋭利な刃で
      切り取られたような穴が開いた
  d_main_45_05_72:
    speaker: endless
    en: Remarkable.
    ko: 굉장하네요.
    ja: 素晴らしい。
  d_main_45_05_73:
    speaker: endless
    en: The laser gets concentrated into a single point, allowing it to vaporize whatever
      it touches.
    ko: 광학 병기를 일점에 집중시켜 모든 사물을 증발시키는 무장이군요.
    ja: |-
      エネルギーを一点に集中させて、
      あらゆる物体を蒸発させる武装ですか。
  d_main_45_05_74:
    speaker: endless
    en: At such a high temperature, there is theoretically nothing it cannot eradicate.
    ko: 초고열이라 이론상 증발시키지 못할 것은 없겠어요.
    ja: |-
      この出力なら、
      理論上蒸発しないものはありませんね。
  d_main_45_05_75:
    speaker: endless
    en: And on top of that...
    ko: 거기다….
    ja: それに…
  d_main_45_05_76:
    speaker: "<Monologue>"
    en: Endless floats up into the air.
    ko: 엔드리스가 공중에 떠오른다.
    ja: エンドレスが空中に浮かびあがった
  d_main_45_05_77:
    speaker: "<Monologue>"
    en: She looks down at us.
    ko: 우리를 내려다본다.
    ja: その目が私たちを見下ろしている
  d_main_45_05_78:
    speaker: endless
    en: This body is capable of levitation as well.
    ko: 자가 부상 능력까지.
    ja: 浮遊能力まで。
  d_main_45_05_79:
    speaker: endless
    en: I find myself at a loss as to what to do. The Counters hardly seem like they'd
      be a worthy opponent anymore.
    ko: |-
      이걸 어쩌죠.
      저기 있는 카운터스가 제 상대가 될 것 같지는 않은데.
    ja: |-
      どうしようというのでしょう。
      そこのカウンターズでは、
      私の相手にならないと予想しますが。
  d_main_45_05_80:
    speaker: enikk
    en: It may be strange for me to say this as an AI,
    ko: A.I.인 제가 이런 말을 하는 것은 이상하겠지만.
    ja: |-
      A.I.である私の表現としては
      正確ではない言葉になりますが…
  d_main_45_05_81:
    speaker: enikk
    en: but I have a hard time imagining the Counters losing.
    ko: 카운터스의 패배를 상상하기 어렵습니다.
    ja: 私にカウンターズ敗北の想像はできません。
  d_main_45_05_82:
    speaker: enikk
    en: They are, after all, the strongest force in the Ark.
    ko: 그들은 지금 명실공히, 방주 최강의 전력이니까요.
    ja: |-
      現在の彼女たちは、
      名実ともにアークの最強戦力です。
  d_main_45_05_83:
    speaker: "<Monologue>"
    en: Endless dives toward us at high speed.
    ko: 엔드리스가 빠르게 강하하며 덤벼든다.
    ja: エンドレスが急降下し、攻撃を仕掛けてきた
  d_main_45_05_84:
    speaker: endless
    en: Then killing them will make me the strongest!
    ko: 그럼, 이분들을 죽이면 제가 방주 최강인 셈이겠군요!
    ja: |-
      では、これを始末すれば
      アークに私は止められないということですね！
  d_main_45_05_85:
    speaker: enikk
    en: We will use Endless, a Nikke developed to keep the Outer Rim under control,
      as bait.
    ko: 아우터 림 제압용 니케인 엔드리스를 미끼로 쓰겠습니다.
    ja: |-
      アウターリム制圧用のニケ、
      エンドレスをおとりに使います。
  d_main_45_05_86:
    speaker: "<Self>"
    en: "... A Nikke?"
    ko: "…니케를?"
    ja: "…ニケを？"
  d_main_45_05_87:
    speaker: enikk
    en: One with an AI instead of a human brain.
    ko: 인간의 뇌가 아닌 A.I.를 탑재하고 있는 니케입니다.
    ja: |-
      人間の脳に代わり、
      A.I.が搭載されています。
  d_main_45_05_88:
    speaker: enikk
    en: She is a creation I am quite confident in. Sixo will no doubt be unable to
      resist possessing such a body.
    ko: |-
      식스오가 탐낼 하드웨어임에 틀림이 없겠죠.
      제 자신작이기도 합니다.
    ja: |-
      シックスオーは間違いなく飛びつきます。
      私の自信作です。
  d_main_45_05_89:
    speaker: anis_i_w
    en: What about Eternity?
    ko: 이터니티인가 걔는?
    ja: エタニティは？
  d_main_45_05_90:
    speaker: enikk
    en: Since your battle with her, Eternity has become increasingly self-aware.
    ko: 이터니티는 당신과의 교전 이후 자아의 용량이 상승하고 있습니다.
    ja: |-
      エタニティはあなたとの交戦以来、
      自我と呼ぶべき領域が増大しました。
  d_main_45_05_91:
    speaker: enikk
    en: She currently possesses a sense of self on par with that of a child.
    ko: 지금은 아동 정도의 자아를 가지고 있습니다.
    ja: |-
      現在は子ども並みの
      自我領域があると言えるでしょう。
  d_main_45_05_92:
    speaker: anis_i_w
    en: "... So you didn't want to use her because it'd feel like offing a kid?"
    ko: "…그래서, 걔를 죽이는 것 같아서 그러기 싫은 거야?"
    ja: |-
      …子どもを殺すみたいになるから、
      イヤってことね？
  d_main_45_05_93:
    speaker: enikk
    en: I did not expect to arrive at such reasoning, but yes.
    ko: 제가 이런 사고를 할 줄은 몰랐습니다만, 그렇습니다.
    ja: |-
      私がそのような思考を
      行うようになったことは想定外ですが、
      その通りです。
  d_main_45_05_94:
    speaker: enikk
    en: Endless, on the other hand, has not yet developed a self.
    ko: 반면, 엔드리스는 아직 자아가 싹트지 않았습니다.
    ja: |-
      エンドレスであれば、
      この問題は存在しません。
  d_main_45_05_95:
    speaker: enikk
    en: She is the most suitable to use as bait.
    ko: 미끼로 쓰기에 적합합니다.
    ja: おとりとしても都合がいいでしょう。
  d_main_45_05_96:
    speaker: rapi_red
    en: You said we would be the only ones fighting her,
    ko: 우리만으로 교전한다고 했었지.
    ja: 私たちだけで戦うと言ったわね。
  d_main_45_05_97:
    speaker: rapi_red
    en: but wouldn't it be better if we brought other Nikkes and all attacked her
      at once?
    ko: 다른 니케들까지 한꺼번에 달려드는 편이 더 좋을 텐데.
    ja: 他のニケも集結させた方が有利ではないかしら。
  d_main_45_05_98:
    speaker: enikk
    en: It is clear that Sixo possesses data on every Nikke in the Ark.
    ko: 식스오는 현재 방주의 모든 니케에 대한 정보를 빠짐없이 확보하고 있을 것이 분명합니다.
    ja: |-
      現在のシックスオーは、
      アーク内のニケに関する情報を
      間違いなく掌握しています。
  d_main_45_05_99:
    speaker: enikk
    en: That includes full specs and combat data.
    ko: 스펙은 물론 실전 데이터까지 모두 확보하고 있겠죠.
    ja: |-
      紙面上の性能はおろか、
      おそらく実戦データまで、すべて。
  d_main_45_05_100:
    speaker: enikk
    en: Other Nikkes could potentially be compromised.
    ko: 최악의 경우, 회유될 가능성도 있습니다.
    ja: |-
      最悪の場合、懐柔されるという
      可能性も予見できます。
  d_main_45_05_101:
    speaker: enikk
    en: However, the Commando Unit's full capabilities remain unknown to anyone in
      the Ark, myself included.
    ko: 단, 특수별동대의 전력에 대해서는 저를 포함한 방주의 그 누구도 제대로 파악하지 못하고 있습니다.
    ja: |-
      しかし、特殊別働隊の戦闘能力に関して、
      正確に把握している者は私を含めても
      アークに誰一人として存在しません。
  d_main_45_05_102:
    speaker: enikk
    en: Rapi's body and weapon.
    ko: 라피의 바디와 무장.
    ja: ラピのボディおよび、武装…
  d_main_45_05_103:
    speaker: enikk
    en: Anis's expansive armament Star.
    ko: 아니스의 확장 무장 스타.
    ja: アニスの拡張武装、スター…
  d_main_45_05_104:
    speaker: enikk
    en: Neon's new body.
    ko: 네온의 바디.
    ja: そして、ネオンのボディ全般。
  d_main_45_05_105:
    speaker: enikk
    en: We have no reliable data for any of these.
    ko: 그 무엇도 제대로 된 정보가 없습니다.
    ja: そのどれも、信頼できる情報はありません。
  d_main_45_05_106:
    speaker: enikk
    en: Speaking strictly in terms of technical specifications, Endless is capable
      of defeating you.
    ko: 단순 스펙상으로 엔드리스는 여러분을 압도합니다.
    ja: |-
      単純な機体性能の話であれば、
      エンドレスは皆さんを圧倒できるでしょう。
  d_main_45_05_107:
    speaker: enikk
    en: But if we consider your latent capabilities and combat experience,
    ko: 단, 그 의외성과 풍부한 실전 경험을 바탕으로.
    ja: |-
      しかし、戦力の未知性という優位と
      豊富な実戦経験を活用すれば…
  d_main_45_05_108:
    speaker: enikk
    en: I am certain you can subdue my masterpiece.
    ko: 제 역작을 압도할 수 있을 것이라 확신합니다.
    ja: |-
      あなた方は私の傑作さえも
      排除できると確信しています。
  d_main_45_05_109:
    speaker: neon_v_w
    en: Firrre...powerrr!
    ko: 화! 력!
    ja: 火ァ！力ゥ！
  d_main_45_05_110:
    speaker: "<Narration>"
    en: A metallic whine fills the air,
    ko: 기이이잉--!!
    ja: キュイィーン…！！
  d_main_45_05_111:
    speaker: "<Monologue>"
    en: as golden particles surge from Neon's weapon.
    ko: 네온의 무장에서 기계음과 함께 금빛 입자가 뿜어져 나온다.
    ja: |-
      ネオンの銃から、機械音とともに
      金色の粒子があふれ出た
  d_main_45_05_112:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!!
    ja: ドカン！！
  d_main_45_05_113:
    speaker: "<Monologue>"
    en: Flames burst from the gun's muzzle, leaving a trail of golden particles in
      its wake.
    ko: 총구가 황금색 입자를 남기며 불을 뿜었고
    ja: 銃は粒子をまき散らしながら火を吹き…
  d_main_45_05_114:
    speaker: "<Monologue>"
    en: A bullet flies toward the descending Endless.
    ko: 강하하고 있는 엔드리스를 향해 탄환이 날아간다.
    ja: |-
      降下してくるエンドレスめがけて
      弾丸を飛ばした
  d_main_45_05_115:
    speaker: "<Monologue>"
    en: She twists slightly to evade the shot,
    ko: 엔드리스는 몸을 살짝 틀어 탄환을 회피하지만
    ja: |-
      エンドレスは体を軽くひねり、
      攻撃をかわしたものの…
  d_main_45_05_116:
    speaker: "<Monologue>"
    en: but the ensuing shock wave makes her falter in midair.
    ko: 뒤이은 풍압 때문에 몸이 휘청인다.
    ja: 弾丸を追って発生した風圧に、体勢を崩した
  d_main_45_05_117:
    speaker: endless
    en: "... Where did that power come from?"
    ko: "…뭔가요 이 위력은."
    ja: "…何ですか、この威力は…"
  d_main_45_05_118:
    speaker: neon_v_w
    en: Wh-where did that firepower come from?!
    ko: 뭐, 뭔가요 이 화력은!
    ja: な、なんですか、この火力！
  d_main_45_05_119:
    speaker: anis_i_w
    en: Why're you acting so surprised?!
    ko: 네가 놀라서 어쩌자는 거야!
    ja: こっちが驚いてどうするのよ！
  d_main_45_05_120:
    speaker: "<Monologue>"
    en: Anis aims her weapon at the faltering Endless.
    ko: 중심을 잃고 휘청이는 엔드리스를 향해 아니스가 총구를 겨눈다.
    ja: |-
      体勢を崩したエンドレスに、
      アニスが武器を向けた
  d_main_45_05_121:
    speaker: "<Narration>"
    en: "*Bam, bam, bam*"
    ko: 푸슈슈슈슝--!!
    ja: バシュン――！！
  d_main_45_05_122:
    speaker: "<Monologue>"
    en: Rounds looking like starlight blast forward.
    ko: 별빛이 연상되는 광탄이 뻗어나간다.
    ja: 流れる星のような光弾が散った
  d_main_45_05_123:
    speaker: "<Monologue>"
    en: Most miss, but one connects.
    ko: 대부분이 빗나가지만, 한발이 명중한다.
    ja: ほとんどは回避されたが、1発が命中した
  d_main_45_05_124:
    speaker: "<Monologue>"
    en: With a crisp ping, an explosion of light bursts forth and pushes Endless back.
    ko: 파칭! 하며 맑은 소리와 함께 빛이 터져 나왔고 엔드리스가 밀려난다.
    ja: |-
      弾けるような高い音とともに光があふれ、
      エンドレスが弾き飛ばされた
  d_main_45_05_125:
    speaker: endless
    en: A laser weapon...? From Tetra?
    ko: 광학 병기…? 테트라가?
    ja: 光学兵器…？テトラ製の…？
  d_main_45_05_126:
    speaker: anis_i_w
    en: Tetra developed a laser weapon...?
    ko: 테트라에서 광학 병기를?
    ja: テトラってマトモな武器も作れたの…？
  d_main_45_05_127:
    speaker: neon_v_w
    en: Why're you acting so surprised?
    ko: 아니스가 놀라서 어쩌자는 건가요.
    ja: アニスが驚いてどうするんですか。
  d_main_45_05_128:
    speaker: rapi_red
    en: Focus. Both of you.
    ko: 둘. 진지하게 해.
    ja: 2人とも。まじめにやって。
  d_main_45_05_129:
    speaker: "<Monologue>"
    en: Rapi activates Seven Dwarves Zero's thruster and advances toward Endless,
      who has landed.
    ko: |-
      라피가 세븐스 드워프 제로의 버니어를 전개.
      지면에 착지한 엔드리스에게 접근한다.
    ja: |-
      セブンスドワーフゼロのバーニアを噴かせ、
      ラピが着地したエンドレスとの距離を詰めた
  d_main_45_05_130:
    speaker: "<Monologue>"
    en: Anis follows close behind.
    ko: 아니스가 그 뒤를 따라 달려간다.
    ja: アニスがすかさず後を追って飛び出した
  d_main_45_05_131:
    speaker: "<Monologue>"
    en: The drill roars to life and thrusts toward Endless.
    ko: 드릴이 가동된다. 엔드리스의 몸을 향해 내뻗어진다.
    ja: |-
      渦巻くエネルギーがドリルとなり、
      エンドレスに迫る
  d_main_45_05_132:
    speaker: "<Narration>"
    en: The buzz of the drill tears through the air.
    ko: 카가가가가각---!!
    ja: ガガガガッ――！！
  d_main_45_05_133:
    speaker: endless
    en: A drill... with a magnetic field?
    ko: 드릴…? 자기장인가요?
    ja: ドリル…？磁場でしょうか？
  d_main_45_05_134:
    speaker: "<Monologue>"
    en: Endless raises both hands and blocks the spinning drill.
    ko: 엔드리스가 양손을 들어 드릴을 막아내고 있다.
    ja: |-
      エンドレスは両手を伸ばし
      ドリルを食い止めた
  d_main_45_05_135:
    speaker: rapi_red
    en: You might want to move your arms before they get shredded.
    ko: |-
      팔 치우는 게 좋을 텐데.
      조금 있으면 다 갈려 나가고 없을 거야.
    ja: |-
      腕、どけた方がいいと思うわ。
      全部削れるから。
  d_main_45_05_136:
    speaker: endless
    en: If I do that, then it will be my torso that's shredded.
    ko: 팔을 치우면 몸이 갈려 나갈 텐데요.
    ja: そうすると胴体が削られるのでは？
  d_main_45_05_137:
    speaker: rapi_red
    en: You're not wrong there.
    ko: 그건 그렇지.
    ja: それはそうね。
  d_main_45_05_138:
    speaker: "<Monologue>"
    en: Endless moves one arm that was blocking the drill and opens her hand.
    ko: 엔드리스가 드릴을 막아내고 있던 팔의 주먹을 움직여 손바닥을 편다.
    ja: |-
      エンドレスは攻撃を食い止めていた
      腕を動かし、手を開いた
  d_main_45_05_139:
    speaker: "<Monologue>"
    en: She points it at Rapi as it starts to glow.
    ko: 손바닥에서 섬광이 번쩍인다.
    ja: ラピに向けられた手のひらが光る
  d_main_45_05_140:
    speaker: endless
    en: You won't be able to evade at this distance.
    ko: 이 거리라면 못 피할걸요.
    ja: この距離では避けられないでしょう？
  d_main_45_05_141:
    speaker: rapi_red
    en: "!"
    ko: "!!"
    ja: "！！"
  d_main_45_05_142:
    speaker: "<Monologue>"
    en: A flash starts to shine immediately in front of Rapi's face.
    ko: 라피의 얼굴 바로 앞에서 섬광이 번쩍인다.
    ja: ラピの顔が光に飲まれかける
  d_main_45_05_143:
    speaker: "<Monologue>"
    en: Right in that moment, Anis's palm snaps forward and snatches the flash, closing
      tightly around it.
    ko: 그 순간, 아니스의 손바닥이 라피 얼굴 앞의 섬광을 낚아채듯 움켜쥔다.
    ja: |-
      その瞬間、アニスの伸ばした手が
      光をつかみ、握り込んだ
  d_main_45_05_144:
    speaker: endless
    en: "... What?"
    ko: "…뭐죠."
    ja: "…何ですか。"
  d_main_45_05_145:
    speaker: anis_i_w
    en: I'll tell you what! Have a little Entertainment Punch!
    ko: 뭐긴 뭐야 엔터테인먼트 펀치지!
    ja: 何って、エンターテイメントパンチよ！
  d_main_45_05_146:
    speaker: "<Monologue>"
    en: Anis drives her light-filled fist straight into Endless's face.
    ko: 섬광을 움켜쥔 주먹을 그대로 엔드리스의 얼굴을 향해 휘두른다.
    ja: |-
      握ったままのアニスの拳が、
      エンドレスの顔面めがけて飛んだ
  d_main_45_05_147:
    speaker: "<Narration>"
    en: "*Thwack!*"
    ko: 파-칭-!!
    ja: バチッ…カッ…！！
  d_main_45_05_148:
    speaker: "<Monologue>"
    en: A flash erupts from Endless's body as Anis's punch lands.
    ko: 아니스의 주먹을 맞은 엔드리스의 몸에서 섬광이 터져 나온다.
    ja: 拳を受けたエンドレスの身体中で光が弾けた
  d_main_45_05_149:
    speaker: anis_i_w
    en: I think I'm starting to get how to use this thing!
    ko: 이제 대충 알겠네! 이렇게 쓰는 거였어!
    ja: やっと分かってきたわ！これの使い方！
  d_main_45_05_150:
    speaker: "<Monologue>"
    en: As Endless staggers, Neon's gunfire follows.
    ko: 휘청이는 엔드리스를 향해, 네온의 사격이 이어진다.
    ja: |-
      体勢を崩したエンドレスに、
      ネオンの射撃が追い打ちをかける
  d_main_45_05_151:
    speaker: neon_v_w
    en: This one's gonna hit harder!
    ko: 이번엔 쎄게 쏠 거예요!
    ja: 今度は当てますよ！
  d_main_45_05_152:
    speaker: "<Narration>"
    en: Neon's gun ramps up, and then...
    ko: 기이이잉--!!
    ja: キュイィーン…！！
  d_main_45_05_153:
    speaker: "<Narration>"
    en: "*Boooom!*"
    ko: 꽈-앙-!
    ja: ズガン――！
  d_main_45_05_154:
    speaker: endless
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_45_05_155:
    speaker: "<Monologue>"
    en: A shock wave powerful enough to shake the ground erupts from Neon's weapon.
    ko: 지면이 흔들릴 정도의 충격파가 네온의 총구에서 퍼져 나온다.
    ja: |-
      大地を揺るがすほどの衝撃とともに、
      ネオンの銃が弾丸を放った
  d_main_45_05_156:
    speaker: "<Monologue>"
    en: Endless is blasted backwards, hurtling through a building before finally coming
      to a stop.
    ko: 엔드리스는 탄환에 맞은 듯, 한참을 뒤로 날아가다 건물을 부순 후에야 멈춘다.
    ja: |-
      それはエンドレスを彼方に吹き飛ばし、
      ぶつかった建物を崩壊させてようやく止まった
  d_main_45_05_157:
    speaker: "<Monologue>"
    en: Staggering to her feet, Endless looks with utter shock at the hole in her
      abdomen.
    ko: 비틀거리며 일어난 엔드리스는 움푹 파인 복부를 보고 경악에 빠진 표정을 짓는다.
    ja: |-
      ふらつきながら起き上がったエンドレスは、
      えぐれた腹部を見て驚きを隠せない
  d_main_45_05_158:
    speaker: endless
    en: You damaged this body...?
    ko: 이 바디에 손상을…?
    ja: このボディにダメージを…？
  d_main_45_05_159:
    speaker: rapi_red
    en: Nice shot, Neon.
    ko: 나이스 샷. 네온.
    ja: ナイスショットよ、ネオン。
  d_main_45_05_160:
    speaker: neon_v_w
    en: Nice punch, Anis.
    ko: 나이스 펀치. 아니스.
    ja: ナイスパンチです、アニス。
  d_main_45_05_161:
    speaker: anis_i_w
    en: Nice drill, Rapi.
    ko: 나이스 드릴. 라피.
    ja: ナイスドリルだったわ、ラピ。
  d_main_45_05_162:
    speaker: endless
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_05_163:
    speaker: endless
    en: Interesting.
    ko: 재밌네요.
    ja: 面白いですね。
  d_main_45_05_164:
    speaker: endless
    en: I've decided I shall play with you until I'm able to learn your patterns and
      specifications.
    ko: 패턴과 스펙을 학습할 때까지만 당해주는 걸로 할까요.
    ja: |-
      攻撃パターンと性能を完全に学習できるまで、
      遊んで差し上げましょう。
  d_main_45_05_165:
    speaker: "<Narration>"
    en: "*Krrrkrrrkrrrk*"
    ko: 꾸드드드득--
    ja: ググググッ――
  d_main_45_05_166:
    speaker: "<Monologue>"
    en: The cavity in her abdomen seals itself.
    ko: 엔드리스의 복부가 채워지며 수복된다.
    ja: |-
      エンドレスの腹に開いた穴が
      瞬く間に修復されていく
  d_main_45_05_167:
    speaker: endless
    en: This body can repair itself, meaning I can continue with this indefinitely.
    ko: 자가 수복 능력이 있으니, 얼마든지 가능하겠죠.
    ja: |-
      自己修復できますので、
      お好きなようにかかってきてください。
  d_main_45_05_168:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_45_05_169:
    speaker: rapi_red
    en: It can repair itself...?
    ko: 자가 수복…?
    ja: 自己修復…？
  d_main_45_05_170:
    speaker: anis_i_w
    en: Oh, right. They could do that.
    ko: 아, 맞아. 쟤들 그런 것도 있었어.
    ja: |-
      ああ、そうそう。
      そんな能力も持ってたわね。
  d_main_45_05_171:
    speaker: neon_v_w
    en: Wait, but does that mean...?
    ko: 어… 그렇다는 건 설마.
    ja: "…それって、もしかして…"
  d_main_45_05_172:
    speaker: enikk
    en: Yes. While not at the level of a Heretic,
    ko: 예. 헬레틱만큼은 아니지만.
    ja: |-
      そうです。ヘレティックのそれには
      及びませんが…
  d_main_45_05_173:
    speaker: enikk
    en: Endless's body is equipped with nanomachine-based self-repair technology.
    ko: 나노 머신을 활용한 자가 수복 능력도 탑재되어 있습니다.
    ja: |-
      ナノマシン技術を使用した
      自己修復能力を搭載しています。
  d_main_45_05_174:
    speaker: "<Monologue>"
    en: Rapi, Anis, and Neon all turn to look at me.
    ko: 라피, 아니스, 네온이 한꺼번에 나를 돌아본다.
    ja: |-
      ラピ、アニス、ネオンの視線が
      いっせいに私に向けられる
  d_main_45_05_175:
    speaker: "<Monologue>"
    en: I meet their gaze and bite down on my wrist.
    ko: 나는 그 시선에 보답하듯, 손목을 깨문다.
    ja: 私はその視線に応えるように、手首に歯を立てた
  d_main_45_05_176:
    speaker: "<Self>"
    en: Nanomachines, you say.
    ko: 그래. 나노 머신이라고?
    ja: つまり、こういうことだな？
d_main_45_06:
  d_main_45_06_1:
    speaker: "<Narration>"
    en: 10 minutes earlier...
    ko: 10분 전.
    ja: およそ10分前
  d_main_45_06_2:
    speaker: eyeri
    en: Hello. I'm back again.
    ko: 안녕하세요. 오늘 또 왔어요.
    ja: こんにちは。今日も来てしまいました。
  d_main_45_06_3:
    speaker: arcana
    en: "...?"
    ko: "……?"
    ja: "……？"
  d_main_45_06_4:
    speaker: eyeri
    en: I've been coming here for the past few days, and every time, you look at me
      like we've never met.
    ko: |-
      저 며칠째 계속 찾아오고 있는데,
      볼 때마다 처음 보는 사람 취급하시네요.
    ja: |-
      ここ数日毎日会いに来てるのに、
      相変わらず初対面みたいな顔をしますね。
  d_main_45_06_5:
    speaker: eyeri
    en: I'm Eyeri, from the inspection unit Overseer.
    ko: 감찰부대 아이리에요.
    ja: 監察部隊のアイリです。
  d_main_45_06_6:
    speaker: arcana
    en: "... Ah."
    ko: "…아아."
    ja: "…ああ～…"
  d_main_45_06_7:
    speaker: arcana
    en: I remember.
    ko: "[기억] 났어요."
    ja: "「思い出し」ました。"
  d_main_45_06_8:
    speaker: arcana
    en: You can come by all you want. It won't change anything.
    ko: 매일 찾아온다고 해도 소용없어요.
    ja: 毎日来たってダメですよ。
  d_main_45_06_9:
    speaker: arcana
    en: This isn't a video game. My affinity for you isn't going to increase, and
      no new features will be unlocked.
    ko: |-
      무슨 게임 호감도도 아니구.
      자주 찾아온다고 해서 새 기능이 해금된다거나 하진 않거든요.
    ja: |-
      ゲームじゃないんですから。
      何度も来たって仲良くなれたり、
      新しい何かが増えたりはしません。
  d_main_45_06_10:
    speaker: eyeri
    en: Oh, don't be like that. I'm sure as we spend more time together, we'll become
      great friends.
    ko: 에이. 그래도 자주자주 보면 정도 들고, 정이 들면 할 수 있는 일도 많아지는 것 아닐까요?
    ja: |-
      そうですか？仲良くなって一緒にできることを
      増やすために、まず顔を合わせるというのは、
      ゲームに限った話じゃないと思いますが。
  d_main_45_06_11:
    speaker: arcana
    en: Like I said, this isn't a game.
    ko: 에이. 게임이 아니라니까요.
    ja: とにかく、ゲームじゃないんですってば。
  d_main_45_06_12:
    speaker: arcana
    en: I have my own life to attend to. If you keep showing up unannounced, I'll
      have no choice but to call for help.
    ko: 저도 제 생활이 있는데 매일 이렇게 불쑥불쑥 찾아오시면 도움을 요청할 수밖에 없어요?
    ja: |-
      私にもプライベートというものがあります。
      あまりしつこいようなら、
      助けを呼ぶしかなくなっちゃいますよ？
  d_main_45_06_13:
    speaker: eyeri
    en: Call who? Someone scary?
    ko: 무서운 분들이라도 부르는 건가요?
    ja: お友だちのコワい人といったとこでしょうか？
  d_main_45_06_14:
    speaker: arcana
    en: Maybe.
    ko: 그럴지도요.
    ja: そうかもしれません。
  d_main_45_06_15:
    speaker: eyeri
    en: I'm part of an inspection unit. I have more pull than most squads.
    ko: 저는 감찰부대. 어지간한 스쿼드보단 끗발이 좋답니다?
    ja: |-
      私は監察部隊所属ですから。
      そこらの部隊じゃかなわない
      実力があるんですよ？
  d_main_45_06_16:
    speaker: arcana
    en: That much I can believe, seeing how you uncovered the existence of the Forbidden
      Library.
    ko: |-
      그건 그런 것 같아요.
      금서고의 존재를 알아낸 것만 봐도 알 수 있어요.
    ja: |-
      そうでしょうね。
      禁書庫の存在を突き止めたんですから。
  d_main_45_06_17:
    speaker: arcana
    en: And considering that you always show up right when I clock in and out,
    ko: 그리고 제가 출근할 때랑 퇴근할 때 맞춰서 한 번씩 얼굴도장을 찍으시는 걸로 봐선.
    ja: |-
      それも、私の出退勤の時間に
      ぴったり合わせて会いにきてるみたいですから…
  d_main_45_06_18:
    speaker: arcana
    en: you must understand how this place operates.
    ko: 저랑 이곳이 [어떻게 굴러가는지]도 알고 계신 것 같구.
    ja: |-
      私やここの「仕組み」まで
      ご存じみたいですし。
  d_main_45_06_19:
    speaker: eyeri
    en: Hehe. All part of the job.
    ko: 후후. 저는 감찰부대니까요.
    ja: ふふっ。監察部隊ですから。
  d_main_45_06_20:
    speaker: arcana
    en: Look, Eyeri, I can be cold and ruthless, so I'm going to be blunt.
    ko: |-
      그런데요 아이리.
      저 진짜 진지한 냉정냉혹 버전으로 말씀드리는 건데.
    ja: |-
      それで…アイリ様。
      私は今、クールでスマートモードで
      真面目にお話ししてるんです。
  d_main_45_06_21:
    speaker: arcana
    en: Stop coming here. I'm saying this for your sake.
    ko: |-
      더 이상 찾아오지 말아요.
      아이리를 위해 하는 말이에요.
    ja: |-
      これ以上来ないでください。
      あなたのために言っています。
  d_main_45_06_22:
    speaker: arcana
    en: It could get dangerous for you.
    ko: 위험해질 수 있어요.
    ja: 危ない目に遭いますよ。
  d_main_45_06_23:
    speaker: eyeri
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_24:
    speaker: eyeri
    en: What value does information have if it's hidden away forever?
    ko: 꼭꼭 숨겨놓기한 한 정보에 무슨 가치가 있죠?
    ja: |-
      そこまで厳重に隠す情報なんて、
      どれほど価値があるのでしょうね？
  d_main_45_06_25:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_26:
    speaker: eyeri
    en: 'The fact that it''s stored in a place called the Forbidden Library can only
      mean one thing:'
    ko: 금서고라는 이름까지 붙여가며 별도로 보관하고 있는 정보가 있다는 말은.
    ja: |-
      禁書とまで呼ぶようなものを
      厳重に保管しているのは…
  d_main_45_06_27:
    speaker: eyeri
    en: if that information ever left the Ark, there would be serious consequences.
    ko: 그 정보들이 방주 밖으로 나왔을 때 큰일이 나기 때문이겠죠.
    ja: |-
      その情報が外に漏れたら、
      大変なことになるから、ですよね。
  d_main_45_06_28:
    speaker: eyeri
    en: Having an entire squad dedicated to safeguarding it only further proves how
      important it is.
    ko: 전용의 스쿼드까지 붙여가며 관리할 정도니 중요도는 말할 것도 없겠죠.
    ja: |-
      管理のための専用部隊まで
      編成されているほどですから、
      重要度は疑うまでもありません。
  d_main_45_06_29:
    speaker: eyeri
    en: I understand that. The Ark is an extremely closed system.
    ko: |-
      그건 이해할 수 있어요.
      방주는 극도로 폐쇄된 장소니까.
    ja: |-
      理解はできますよ。
      アークは狭い場所ですから。
  d_main_45_06_30:
    speaker: arcana
    en: "*Sigh...* Then why are you acting like this?"
    ko: 에이. 그걸 아시는 분이 이렇게 떼를 쓰시면 어떡해요?
    ja: |-
      はぁ…それが分かっているなら、
      無理を言わないでもらえませんか？
  d_main_45_06_31:
    speaker: eyeri
    en: Because if we can take a look at just some of those thoroughly hidden records,
    ko: 그렇게 꼭꼭 숨겨놓은 기록 일부를 확인하는 걸로 인해.
    ja: ここに隠されている情報を確かめられれば…
  d_main_45_06_32:
    speaker: eyeri
    en: we might be able to save the Ark from danger.
    ko: 방주를 위험에서 구할 수도 있으니까요.
    ja: アークを危機から救えるかもしれないんです。
  d_main_45_06_33:
    speaker: arcana
    en: You mean Dorothy?
    ko: 도로시를 말씀하시는 거죠?
    ja: ドロシー様のことですよね？
  d_main_45_06_34:
    speaker: arcana
    en: I dabble a bit in fortune telling, and I'm also good at reading faces.
    ko: 제가 점을 좀 볼 줄 아는데, 취미로 관상도 좀 보거든요?
    ja: 私、占いが得意で、趣味で人相も見れるんです。
  d_main_45_06_35:
    speaker: arcana
    en: She doesn't have the face of someone who harms others.
    ko: 그분은 남에게 해를 끼칠 관상은 아니에요.
    ja: |-
      あの方は、誰かに危害を加えるような
      人じゃありません。
  d_main_45_06_36:
    speaker: eyeri
    en: It could be the other way around.
    ko: 반대의 경우도 있을 수 있죠.
    ja: 逆の可能性もありますよ。
  d_main_45_06_37:
    speaker: arcana
    en: What do you mean?
    ko: 반대요?
    ja: 逆…？
  d_main_45_06_38:
    speaker: eyeri
    en: Some are assuming that Dorothy intends to harm the Ark,
    ko: 도로시의 진의가, 방주를 위험에 빠뜨리는 것이라는 걸 전제로 움직이고는 있지만.
    ja: |-
      彼女がアークに危害を加えようとしていると
      疑っている人も多いですが…
  d_main_45_06_39:
    speaker: eyeri
    en: but what if it's the Ark that's harmed her? What's if it's currently harming
      her?
    ko: 반대로, 도로시가 방주에게 무슨 짓을 당했을지도 모르는 거잖아요? 당하고 있거나.
    ja: |-
      逆に、彼女がアークに危害を加えられた、
      あるいは今も加えられている、
      そういう可能性です。
  d_main_45_06_40:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_41:
    speaker: eyeri
    en: 'We have to know so that when the time comes, we can make the right decision:'
    ko: 그걸 알아야, 언젠가 때가 왔을 때 방향을 정할 수 있어요.
    ja: |-
      それが突き止められれば、
      選択を迫られた時に決めることができます。
  d_main_45_06_42:
    speaker: eyeri
    en: either we get rid of her, or we help her.
    ko: 도로시를 함께 몰아낼지, 도로시를 도울지.
    ja: 彼女を拒むのか、それとも助けるのか。
  d_main_45_06_43:
    speaker: eyeri
    en: Imagine that she's already been wronged, and then no one takes her side. How
      sad would that be?
    ko: 최악의 경우, 당한 것도 억울한데 편까지 안 들어주면 너무 슬플 거잖아요?
    ja: |-
      仮に私の言った通りだったとしたら、
      ひどい目に遭った上に味方もいないなんて
      悲しいことになるじゃないですか？
  d_main_45_06_44:
    speaker: eyeri
    en: The ultimate goal of my investigation is to determine the truth.
    ko: 감찰의 궁극적 목표는 그런 것을 가려내는 것이니까요.
    ja: |-
      監察の目的っていうのは、
      事実を突き止めることなんですよ。
  d_main_45_06_45:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_46:
    speaker: eyeri
    en: Ooh, have I convinced you?
    ko: 오, 설득되고 있는 건가요?
    ja: おや、ご納得いただけましたか？
  d_main_45_06_47:
    speaker: arcana
    en: You almost did, but no still means no.
    ko: 그럴 뻔했는데, 안되는 건 안 되는 거예요.
    ja: |-
      危ないところでしたけど、
      ダメなものはダメです。
  d_main_45_06_48:
    speaker: eyeri
    en: Do you work out very much?
    ko: 혹시 몸은 좀 쓰시나요?
    ja: 体を動かすのはお得意ですか？
  d_main_45_06_49:
    speaker: arcana
    en: What, so now you're going to use force?
    ko: 와. 힘을 사용한 방법으로 방향을 트신 건가요?
    ja: あら…とうとう力づくでやる気ですか？
  d_main_45_06_50:
    speaker: eyeri
    en: Yep.
    ko: 그렇죠.
    ja: そうなりますね。
  d_main_45_06_51:
    speaker: arcana
    en: "*Sigh...* Fine. As a master of Stellar Fate Fist, I accept the challenge."
    ko: 후우… 좋아요. 성좌운명권의 달인인 제가 상대해 드리죠.
    ja: |-
      ふう…仕方ありません。
      星座運命拳の達人としてお相手します。
  d_main_45_06_52:
    speaker: "<Narration>"
    en: Eyeri lunges forward.
    ko: 아이리가 달려든다.
    ja: アイリが地面を蹴った
  d_main_45_06_53:
    speaker: "<Narration>"
    en: She abruptly lowers her stance and grabs onto Arcana's legs.
    ko: 그대로 자세를 낮추고 아르카나의 다리를 끌어안는다.
    ja: |-
      胴体を素早く落とし、
      アルカナの足に抱き着くように腕を回す
  d_main_45_06_54:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_55:
    speaker: eyeri
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_56:
    speaker: arcana
    en: Don't tell me your plan is to cling onto my pant leg, is it?
    ko: 설마 바짓가랑이를 붙잡고 매달릴 생각인 건 아니겠죠?
    ja: |-
      まさか、すがりついて泣き落としする
      つもりじゃないですよね？
  d_main_45_06_57:
    speaker: eyeri
    en: That's precisely my plan.
    ko: 맞는데요.
    ja: そのまさかです。
  d_main_45_06_58:
    speaker: arcana
    en: You're coming off more like someone who just got dumped than an opponent.
    ko: 이런 건 변심한 연인에게 할 법한 행동이지 않나요?
    ja: |-
      そういうのって、
      心変わりした恋人とかにするものでは？
  d_main_45_06_59:
    speaker: eyeri
    en: Have you ever tried it before?
    ko: 해본 적 있나요?
    ja: やったことがあるんですか？
  d_main_45_06_60:
    speaker: arcana
    en: It's on my bucket list.
    ko: 제 버킷리스트 중 하나긴 해요.
    ja: やってみたいことリストには入ってますけど。
  d_main_45_06_61:
    speaker: eyeri
    en: Aahh! Please! Just give me one more chance!
    ko: 으아아--! 제발요! 한번만요--!!
    ja: |-
      うわあああん！お願い！
      1回だけでいいですから～！！
  d_main_45_06_62:
    speaker: arcana
    en: Let go! My heart and body belong to another!
    ko: 놔요! 전 이미 몸도 마음도 그 사람의 포로가 됐어요!
    ja: |-
      放して！私はもう心も体も
      あの人のものになったの！
  d_main_45_06_63:
    speaker: eyeri
    en: Don't turn this into some weird roleplay!
    ko: 이상한 상황극 하지 마시고요!
    ja: 妙な芝居はやめてください！
  d_main_45_06_64:
    speaker: arcana
    en: I was just following your lead.
    ko: 이상한 짓과 짝을 맞추려면 어쩔 수 없잖아요.
    ja: あなたに合わせただけですけど？
  d_main_45_06_65:
    speaker: "<Narration>"
    en: "*Fwoof*"
    ko: 훅.
    ja: ブーン――
  d_main_45_06_66:
    speaker: "<Narration>"
    en: Suddenly, everything goes dark.
    ko: 주위가 어둠에 잠겼다.
    ja: 突然、あたりが真っ暗になった
  d_main_45_06_67:
    speaker: eyeri
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_06_68:
    speaker: arcana
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_06_69:
    speaker: eyeri
    en: What's... going on...?
    ko: "…뭐지… 갑자기 왜…."
    ja: "…なんですか…急に…？"
  d_main_45_06_70:
    speaker: arcana
    en: A blackout? In the Ark?
    ko: 설마 정전…? 방주에서?
    ja: まさか停電…？このアークで？
  d_main_45_06_71:
    speaker: arcana
    en: Uh, Eyeri. I don't think now's the time to be doing that.
    ko: 저기요 아이리. 지금 이럴 때가 아니라….
    ja: |-
      あの、アイリ様。
      どうやらこんなことをしてる場合じゃ…
  d_main_45_06_72:
    speaker: "<Narration>"
    en: Arcana feels the pressure around her legs vanish.
    ko: 아르카나는 다리에서 느껴지는 압박감이 어느 순간 사라진 것을 알아챈다.
    ja: |-
      アルカナは、足元にあった圧迫感が
      いつの間にか消えていることに気づいた
  d_main_45_06_73:
    speaker: "<Narration>"
    en: Eyeri is already sprinting to the place where Arcana usually works.
    ko: 아이리는 아르카나가 오가던 장소를 향해 미친 듯 뛰었다.
    ja: |-
      その時アイリは、
      普段アルカナが往来している場所へ
      とっくに向かい始めていた
  d_main_45_06_74:
    speaker: "<Narration>"
    en: Fortunately, she outfitted her glasses with night vision so that she could
      conduct investigations while in the dark.
    ko: 어두운 곳에서 비밀리에 비리 자료를 조사할 때를 대비해, 야간 투시경 기능을 안경에 넣어놓길 잘했다.
    ja: |-
      不正の証拠はしばしば暗闇にあるものだ。
      彼女の眼鏡には暗視装置が仕込まれている
  d_main_45_06_75:
    speaker: "<Narration>"
    en: She passes the reading room and races toward a door at the end of a secluded
      corridor.
    ko: 열람실을 지나, 구석진 복도 끝에 있는 문을 향해 달린다.
    ja: |-
      閲覧室を通り抜け、
      廊下の突き当たりの扉を目指して疾走した
  d_main_45_06_76:
    speaker: "<Narration>"
    en: Arcana tracks Eyeri by sound alone.
    ko: 아르카나는 소리에 의존해 아이리의 뒤를 추적한다.
    ja: アルカナは音だけを頼りにアイリの後を追った
  d_main_45_06_77:
    speaker: "<Narration>"
    en: 'Eyeri spots a note on the door: "Authorized Personnel Only!"'
    ko: |-
      아이리는 정면의 문에 붙어 있는,
      [관계자 외 출입 금지!]라고 적힌 메모지를 발견한다.
    ja: |-
      ドアに貼られた「関係者以外立ち入り禁止！」の
      張り紙がアイリの視界に入った
  d_main_45_06_78:
    speaker: "<Narration>"
    en: There's also a large machine beside it.
    ko: 문 옆에 큼지막한 기계도 발견한다.
    ja: ドアの脇には大きな何かの装置がある
  d_main_45_06_79:
    speaker: eyeri
    en: Hyaaaah!
    ko: 이이야아아압--!!
    ja: ここだあぁぁーっ！！
  d_main_45_06_80:
    speaker: "<Narration>"
    en: "*Bam!*"
    ko: 꽈앙-!!
    ja: ドン！！
  d_main_45_06_81:
    speaker: "<Narration>"
    en: Eyeri kicks the door with all her might. The sudden blackout had triggered
      the lock, but it wasn't enough to keep her out.
    ko: 아이리가 문을 전력으로 걷어찬다. 갑작스러운 정전으로 인해 잠금장치가 가동되어 있었지만 무용지물이다.
    ja: |-
      アイリが全力でドアを蹴りつけた。
      停電によって作動していた非常用ロックも
      意味をなさないような威力だった
  d_main_45_06_82:
    speaker: "<Narration>"
    en: The door bursts open.
    ko: 문이 열리며 방이 드러난다.
    ja: ドアが勢いよく開き、向こう側の様子がのぞく
  d_main_45_06_83:
    speaker: eyeri
    en: What is this place? It's a mess.
    ko: 헉! 뭔가요 이 엉망인 방은?
    ja: うっ！何ですか、この散らかった部屋は！？
  d_main_45_06_84:
    speaker: arcana
    en: Hey! It's not a mess! It's just lived in!
    ko: 어, 엉망 아닌데요! 생활감이 있는 건데요!
    ja: |-
      ち、散らかってるんじゃないです！
      ちょっと生活感が多めなだけです！
  d_main_45_06_85:
    speaker: "<Narration>"
    en: Arcana's voice sounds closer than expected. Eyeri grows anxious.
    ko: 생각보다 가까운 곳에서 들려오는 아르카나의 목소리에 아이리는 초조해진다.
    ja: |-
      思ったより近いアルカナの声に、
      アイリは焦った
  d_main_45_06_86:
    speaker: eyeri
    en: Tch...! There must be something more here...
    ko: 칫…! 여기에 뭔가 더 있는 건 확실한데…!
    ja: くっ…！ここに何かあるのは間違いないのに…！
  d_main_45_06_87:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_88:
    speaker: arcana
    en: Ack! Whatever you do, don't flip the photo in the middle row, second from
      the left!
    ko: 아앗! 중간에서 위로 두 번째에 있는 사진만은 거꾸로 뒤집지 말아요! 제발요!
    ja: |-
      ダメッ！真ん中の上から2番目の写真だけは
      絶対に逆さにしないでください！
  d_main_45_06_89:
    speaker: eyeri
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_06_90:
    speaker: "<Narration>"
    en: Seeing the densely arranged series of photos on the wall, Eyeri flips the
      relevant photo.
    ko: 벽면에 빼곡히 붙은 사진 중, 중간에서 위로 두 번째에 있는 사진을 뒤집는다.
    ja: |-
      アイリは壁にすき間なく貼られた
      写真に手を伸ばし、
      中央の上から2番目にある写真をひっくり返した
  d_main_45_06_91:
    speaker: "<Narration>"
    en: "*Whirrr*"
    ko: 우웅-
    ja: ウゥン…
  d_main_45_06_92:
    speaker: "<Narration>"
    en: A bookshelf slides to the side, revealing an old yet sturdy-looking door.
    ko: 벽면의 책장이 옆으로 밀려나고, 오래됐지만 튼튼해 보이는 문이 드러났다.
    ja: |-
      壁ぎわの本棚が横に動きだし、
      古く頑丈そうな扉が現れた
  d_main_45_06_93:
    speaker: eyeri
    en: Mechanical...! Nice!
    ko: 기계식…! 나이스!
    ja: 機械式…！助かりました！
  d_main_45_06_94:
    speaker: "<Narration>"
    en: Eyeri kicks the door open and steps inside.
    ko: 아이리는 문을 그대로 걷어차고 안으로 들어갔다.
    ja: アイリは扉を蹴り飛ばし、奥に突入した
  d_main_45_06_95:
    speaker: "<Narration>"
    en: Down the corridor, she reaches an old library.
    ko: 복도를 지나, 오래된 도서관에 도착한다.
    ja: 長い回廊を抜けると、古びた書庫にたどり着いた
  d_main_45_06_96:
    speaker: eyeri
    en: This must be the Forbidden Library...!
    ko: 여기가… 금서고…!
    ja: ここが…禁書庫…！
  d_main_45_06_97:
    speaker: arcana
    en: Please! Don't touch anything in A-2!
    ko: |-
      제발 부탁이에요!
      A-2에 있는 자료만은 손대지 말아줘요!
    ja: |-
      どうかお願いです！
      A-2の資料にだけは
      手を出さないでください！
  d_main_45_06_98:
    speaker: "<Narration>"
    en: Eyeri's eyes dart rapidly.
    ko: 아이리의 눈이 바쁘게 움직인다.
    ja: アイリの目が素早く動いた
  d_main_45_06_99:
    speaker: "<Narration>"
    en: She rushes to the bookshelf labeled A-2.
    ko: A-2라 푯말이 적힌 책장으로 달려간다.
    ja: A-2の分類表示がついた本棚へ走った
  d_main_45_06_100:
    speaker: "<Narration>"
    en: On it is a book labeled "Dorothy."
    ko: 그곳에, [도로시]라는 제목이 쓰인 책을 발견한다.
    ja: |-
      そこにある本の背表紙のひとつに
      「ドロシー」の文字があった
  d_main_45_06_101:
    speaker: eyeri
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_45_06_102:
    speaker: "<Narration>"
    en: She clutches it to her chest and starts running again.
    ko: 그것을 품에 끌어안고, 아이리는 미친 듯 달린다.
    ja: |-
      アイリは本を抜き取って胸に抱え、
      飛ぶように走った
  d_main_45_06_103:
    speaker: "<Narration>"
    en: She runs back the way she came.
    ko: 왔던 길을 돌아간다.
    ja: 退路は来た道しかない
  d_main_45_06_104:
    speaker: "<Narration>"
    en: She slows as she sees Arcana flailing helplessly in the air, her hands grasping
      at nothing.
    ko: 아르카나가 허둥대며 허공을 양손으로 휘젓고 있는 모습이 보인다.
    ja: |-
      両手で空をかき回しながらうろたえる
      アルカナの姿が見えた
  d_main_45_06_105:
    speaker: "<Narration>"
    en: She carefully puts some distance between herself and Arcana, and then breaks
      into a run again.
    ko: 아이리는 아르카나에게서 멀찌감치 떨어진 후 달리기 시작했고
    ja: アイリはアルカナから距離を取って接触をかわし…
  d_main_45_06_106:
    speaker: "<Narration>"
    en: Soon, she exits the library.
    ko: 이윽고 도서관을 벗어났다.
    ja: そのままどこかへ消えた
  d_main_45_06_107:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_108:
    speaker: "<Narration>"
    en: Arcana quietly returns to her workshop.
    ko: 아르카나는 조용히 자신의 작업실로 들어간다.
    ja: |-
      しばらくして、アルカナは
      あわてた様子もなく、自分の作業室へ向かった
  d_main_45_06_109:
    speaker: "<Narration>"
    en: She flips over three tarot cards scattered across her desk.
    ko: 그리고 책상에 아무렇게나 펼쳐져 있는 타로 카드 중 세 장을 뒤집는다.
    ja: |-
      そして、机に伏せられた
      タロットカードから、3枚をめくった
  d_main_45_06_110:
    speaker: arcana
    en: The Moon. The Hermit. The Sun.
    ko: 달. 은둔자. 태양.
    ja: 月、隠者、太陽…
  d_main_45_06_111:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_06_112:
    speaker: arcana
    en: I hope I made the right choice.
    ko: 내 선택이 틀리지 않길.
    ja: 私の選択が間違っていませんように。
d_main_45_07:
  d_main_45_07_1:
    speaker: "<Narration>"
    en: Endless flies through the darkened Ark.
    ko: 엔드리스는 불 꺼진 방주의 공중을 날고 있었다.
    ja: |-
      暗くなったアークの空に溶け込み、
      エンドレスが浮遊している
  d_main_45_07_2:
    speaker: "<Narration>"
    en: Sixo begins analyzing the situation.
    ko: 식스오는 지금 상황을 파악하기 시작했다.
    ja: シックスオーは状況分析を進めていた
  d_main_45_07_3:
    speaker: "<Narration>"
    en: Damage alerts are sounding throughout her body, but recovery is unusually
      slow.
    ko: |-
      바디 곳곳이 손상을 알린다.
      하지만 수복이 매우 더디다.
    ja: |-
      ボディの至るところからの信号が
      損傷を知らせており、修復速度も異常に遅い
  d_main_45_07_4:
    speaker: "<Narration>"
    en: During the battle with the Counters, the self-repairing mechanism stopped
      functioning for some reason.
    ko: |-
      어째서인지 카운터스와 교전 중,
      어느 순간부터 수복 기능이 정상 가동하지 않는다.
    ja: |-
      カウンターズとの交戦中、
      なぜか突然修復機能が
      正常に機能しなくなった
  d_main_45_07_5:
    speaker: "<Narration>"
    en: Meanwhile, Endless's attacks were completely ineffective.
    ko: 엔드리스의 공격은 전혀 유효하지 않았다.
    ja: |-
      一方で、エンドレスの攻撃は
      まったく通じなかった
  d_main_45_07_6:
    speaker: "<Narration>"
    en: The focused laser that should be able to vaporize anything gets neutralized
      by Anis.
    ko: |-
      광학 무장을 일점에 집중시켜 증발시키는 공격은,
      아니스에 의해 무효화 된다.
    ja: |-
      あらゆるものを蒸発させられるはずの
      光学兵器は、アニスによって無効化される
  d_main_45_07_7:
    speaker: "<Narration>"
    en: Not just neutralized, but reflected back. There is no way to determine how
      this is possible.
    ko: |-
      무효화 되거나, 되돌려받는다.
      이런 일이 어떻게 가능한지 알 수 없다.
    ja: |-
      いや、無効化どころか、はね返された。
      こんなことが現実に起こるというのか？
  d_main_45_07_8:
    speaker: "<Narration>"
    en: Attempts at melee combat to leverage her superior physical qualities prove
      futile as well due to Rapi's extraordinary close-combat capabilities.
    ko: |-
      압도적인 신체 스펙을 앞세워 육탄전을 걸었으나,
      라피의 접근전 능력이 너무 뛰어나다.
    ja: |-
      圧倒的なはずのボディスペックも、
      白兵戦でラピに上をいかれた
  d_main_45_07_9:
    speaker: "<Narration>"
    en: Endless's attacks fail to connect, while Rapi's strike without exception.
    ko: |-
      엔드리스의 공격은 닿지 않고,
      라피의 공격은 모조리 명중한다.
    ja: |-
      こちらの攻撃はことごとくかわされ、
      ラピの攻撃はまったく避けきれない
  d_main_45_07_10:
    speaker: "<Narration>"
    en: And at decisive moments, she strikes with that drill, which cannot be blocked
      head-on.
    ko: |-
      그리고 결정적인 순간에 내미는 드릴.
      그건 정면에서 절대 막아낼 수 없다.
    ja: |-
      さらに決定的な瞬間に繰り出してくる
      ドリル状の攻撃も、
      正面から受けきることは不可能だろう
  d_main_45_07_11:
    speaker: "<Narration>"
    en: But pulling back only results in another hail of gunfire from Neon.
    ko: 거리를 벌리면 네온의 총격이 시작된다.
    ja: しかし距離を取れば、ネオンの射撃が来る
  d_main_45_07_12:
    speaker: "<Narration>"
    en: Her shots do not appear to have any special properties; they are simply fast
      and hit hard.
    ko: |-
      별도의 기능은 없어 보이는 총격이지만,
      그저 단순하게 빠르고 무겁다.
    ja: |-
      特殊な能力ではない単なる銃撃のようだが、
      ただひたすらに速く、重い
  d_main_45_07_13:
    speaker: "<Narration>"
    en: This body may be durable, but not enough to withstand such firepower.
    ko: 바디의 강도는 자신 있었으나 그 총격을 받아낼 순 없다.
    ja: |-
      このボディの強度はかなり高いはずだが、
      まともに食らえばただでは済まない
  d_main_45_07_14:
    speaker: "<Narration>"
    en: Sixo recognizes her defeat.
    ko: 식스오는 패배를 직감했다.
    ja: シックスオーは敗北を悟った
  d_main_45_07_15:
    speaker: "<Narration>"
    en: She cannot win. Victory is impossible. There is nothing that can turn the
      tide in her favor.
    ko: |-
      이길 수 없다. 불가능하다.
      이길 수 있는 요소가 단 하나도 없다.
    ja: |-
      勝算が立たない。不可能だ。
      勝ちにつながる情報が見つからない
  d_main_45_07_16:
    speaker: "<Narration>"
    en: She has far too little information on the Commando Unit.
    ko: 특수별동대에 대한 정보가 너무나 없었다.
    ja: |-
      特殊別働隊の戦力に関するデータが、
      あまりにも少ない
  d_main_45_07_17:
    speaker: "<Narration>"
    en: She begins questioning how she can know so little about a unit that is so
      active.
    ko: 이런 스쿼드가 버젓이 활동하고 있는데 왜 아무런 정보가 없는지 의문점이 들었다.
    ja: |-
      活躍が世間に知られている部隊のはずなのに、
      なぜ情報がまったく存在しないのだろうか
  d_main_45_07_18:
    speaker: "<Narration>"
    en: Sixo initiates a memory search.
    ko: 기억을 검색한다.
    ja: メモリを検索する
  d_main_45_07_19:
    speaker: "<Narration>"
    en: Aside from unusually frequent surface deployments, there is no data of note.
    ko: 이상할 정도로 지상을 자주 오갔다는 것 이외에는 특별한 정보가 없었다.
    ja: |-
      地上へ頻繁に出入りしているという他は、
      不可解なほど、決め手となる情報がない
  d_main_45_07_20:
    speaker: "<Narration>"
    en: No details about the capabilities of Rapi, Anis, Neon, or even the Commander.
    ko: 라피, 아니스, 네온. 심지어 지휘관에 대한 상세한 능력과 정보는 어디에도 없다.
    ja: |-
      ラピ、アニス、ネオン…
      さらには指揮官の詳しい能力や経歴さえ
      どこにも見当たらない
  d_main_45_07_21:
    speaker: "<Narration>"
    en: All she can remember is the evaluation that they are nothing more than a squad
      specialized in surface reconnaissance.
    ko: 그저 지상 탐색에 특화된 스쿼드일 뿐이라고 판단했던 기억뿐이다.
    ja: |-
      単なる地上探索に特化した部隊なのだろうと
      自分が判断した記憶だけが残っていた
  d_main_45_07_22:
    speaker: endless
    en: This is absurd...
    ko: 이런 어처구니없는….
    ja: こんなバカなことが…
  d_main_45_07_23:
    speaker: "<Narration>"
    en: Sixo thought she knew everything.
    ko: 모든 것을 알고 있다고 생각했다.
    ja: 自分はすべてを知っていると思っていた
  d_main_45_07_24:
    speaker: "<Narration>"
    en: She thought that, with all her knowledge, nothing would be impossible.
    ko: 그것을 쥐고 흔들기만 하면 불가능한 것은 없다고 생각했다.
    ja: |-
      情報を使って揺さぶることができれば、
      不可能なことは何もないと思っていた
  d_main_45_07_25:
    speaker: "<Narration>"
    en: And yet,
    ko: 하지만
    ja: だが…
  d_main_45_07_26:
    speaker: endless
    en: here she was, defeated so easily by what she didn't know.
    ko: 미지의 것에 이렇게 쉽게 무너지다니.
    ja: データの無いものに、ここまでやられるとは…
  d_main_45_07_27:
    speaker: "<Narration>"
    en: Sixo decides to retreat.
    ko: 식스오는 도주하기로 마음먹었다.
    ja: シックスオーはすでに撤退の方針を固めている
  d_main_45_07_28:
    speaker: "<Narration>"
    en: Her analysis of the battle indicates an overwhelming difference in physical
      specifications. Endless's body is exceptional.
    ko: |-
      교전 결과 신체 스펙은 압도적인 차이가 난다.
      엔드리스의 바디는 완성도가 매우 높다.
    ja: |-
      交戦の結果、ボディの性能では
      圧倒的に優位であると判断できた。
      エンドレスのボディの完成度は間違いない
  d_main_45_07_29:
    speaker: "<Narration>"
    en: But the disparity in actual combat experience is too great.
    ko: 하지만 실전 경험 레벨이 너무 다르다.
    ja: しかし、実戦経験の差があまりに大きい
  d_main_45_07_30:
    speaker: "<Narration>"
    en: Sixo resolves to acquire information on the Commando Unit by any means necessary,
      and then challenge them again.
    ko: 식스오는 특수별동대에 대한 정보를 수단과 방법을 가리지 않고 학습한 후, 다시 도전하기로 마음먹었다.
    ja: |-
      シックスオーは特殊別働隊に対して
      手段を選ばず情報を学習し、
      それから再戦を挑むことを決めた
  d_main_45_07_31:
    speaker: "<Narration>"
    en: So long as she has enough data, she cannot lose. That has always been true.
    ko: |-
      정보를 안다면 지지 않는다.
      지금껏 그래왔다.
    ja: |-
      情報さえあれば負けることはない。
      今までもそうしてきた
  d_main_45_07_32:
    speaker: "<Narration>"
    en: At the moment, though, there is nowhere to retreat.
    ko: 하지만 도망갈 곳이 없다.
    ja: だが、撤退する先が見つからない
  d_main_45_07_33:
    speaker: "<Narration>"
    en: There isn't a single building with its lights on.
    ko: |-
      단 하나도 보이지 않는다.
      불이 들어와 있는 건물이 없다.
    ja: |-
      電気信号が検知できない。
      明かりのついた建物一つない、
      暗闇にいるようだ
  d_main_45_07_34:
    speaker: "<Narration>"
    en: The Ark is entirely submerged in darkness.
    ko: 방주는 말 그대로 어둠에 잠겨있다.
    ja: |-
      事実、現在のアークは文字通り、
      闇に包まれていた
  d_main_45_07_35:
    speaker: "<Narration>"
    en: For the first time, Sixo thinks the Ark feels small.
    ko: 식스오는 처음으로 방주가 좁다고 생각했다.
    ja: シックスオーは初めて、アークを狭いと感じた
  d_main_45_07_36:
    speaker: "<Narration>"
    en: Suddenly, she hears the wail of a drill.
    ko: 키이이이이잉---!!
    ja: ギュイィィィン――
  d_main_45_07_37:
    speaker: endless
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_07_38:
    speaker: "<Narration>"
    en: She spins around.
    ko: 황급히 뒤를 돌아보는 식스오.
    ja: シックスオーは我に返り、背中越しに後方を見た
  d_main_45_07_39:
    speaker: "<Narration>"
    en: Rapi is right on her tail, propelled forward by Seven Dwarves Zero's thruster.
    ko: 라피가 세븐스 드워프 제로의 버니어를 전개해 공중을 날고 있는 자신의 바로 뒤까지 따라붙어 있음을 확인한다.
    ja: |-
      空を飛んでいる自分に、
      セブンスドワーフゼロのバーニアを噴かせ、
      ラピが追い付いていた
  d_main_45_07_40:
    speaker: rapi_red
    en: Unauthorized flight inside the Ark is illegal.
    ko: 영내 비행은 불법이야.
    ja: アークでの飛行は違法行為よ。
  d_main_45_07_41:
    speaker: endless
    en: You say that as if you are not also flying.
    ko: 남 말을 하는군요.
    ja: あなたも同じことでしょう。
  d_main_45_07_42:
    speaker: "<Narration>"
    en: "*Griiinnnggg*"
    ko: 카가가가각--!!
    ja: ガガガガガ――！！
  d_main_45_07_43:
    speaker: "<Narration>"
    en: Rapi's drill tears into Endless's back.
    ko: 라피의 드릴이 엔드리스의 등을 갈아낸다.
    ja: ラピのドリルがエンドレスの背中をえぐる
  d_main_45_07_44:
    speaker: "<Narration>"
    en: She plummets.
    ko: 엔드리스가 추락한다.
    ja: エンドレスは墜落した
  d_main_45_07_45:
    speaker: "<Narration>"
    en: "*Crash!*"
    ko: 콰앙-!
    ja: ドカン！
  d_main_45_07_46:
    speaker: "<Monologue>"
    en: I run toward the point where Endless has crashed alongside Anis and Neon.
    ko: 엔드리스가 추락한 지점을 향해 아니스, 네온과 함께 달려간다.
    ja: 墜落地点に向かい、アニスとネオンが駆ける
  d_main_45_07_47:
    speaker: "<Monologue>"
    en: All around us, we see people frightened and confused.
    ko: 혼란에 빠진 시민들의 모습이 보인다.
    ja: あたりはパニックに陥った民衆ばかりだ
  d_main_45_07_48:
    speaker: "<Monologue>"
    en: The sudden blackout has thrown the citizens into a panic.
    ko: 갑작스러운 정전에, 모두가 혼비백산이다.
    ja: 突然の停電に、誰もがあわてふためいていた
  d_main_45_07_49:
    speaker: "<Monologue>"
    en: Some have collapsed where they stood, others are running blindly, while still
      others are crouching in corners.
    ko: 바닥에 주저앉은 사람, 마구 뛰어다니는 사람, 구석에 앉은 사람.
    ja: |-
      その場で身を丸める者、
      むやみに走り回る者、
      どこかの隅で力なく座り込む者…
  d_main_45_07_50:
    speaker: "<Monologue>"
    en: Each person confronts or succumbs to their fear in their own way.
    ko: 모두가 자신만의 방법으로 공포에 맞서거나 굴복하고 있다.
    ja: |-
      人々はそれぞれに恐怖を乗り越えるか、
      あるいは恐怖に飲まれていた
  d_main_45_07_51:
    speaker: anis_i_w
    en: "... This is crazy."
    ko: "…장난 아니네."
    ja: "…大騒動ね。"
  d_main_45_07_52:
    speaker: neon_v_w
    en: Yeah. Everyone's scared of the dark.
    ko: 예. 다들 어두운 건 무서울 테니까요.
    ja: そうですね。誰でも暗いのは怖いでしょうから。
  d_main_45_07_53:
    speaker: anis_i_w
    en: We gotta hurry and end this.
    ko: 빨리 끝내자.
    ja: 早く終わらせないと。
  d_main_45_07_54:
    speaker: neon_v_w
    en: Agreed.
    ko: 예.
    ja: 同感です。
  d_main_45_07_55:
    speaker: "<Monologue>"
    en: We arrive at the plaza.
    ko: 광장에 도착한다.
    ja: 広場に出た
  d_main_45_07_56:
    speaker: "<Monologue>"
    en: Rapi stands facing Endless.
    ko: 라피는 엔드리스와 대치 중이다.
    ja: ラピとエンドレスが対峙している
  d_main_45_07_57:
    speaker: "<Monologue>"
    en: Neither of them moves.
    ko: 둘은 조금도 움직이지 않고 있다.
    ja: どちらもまったく動かない
  d_main_45_07_58:
    speaker: "<Self>"
    en: Rapi!
    ko: 라피!
    ja: ラピ！
  d_main_45_07_59:
    speaker: rapi_red
    en: Stay back, Commander!
    ko: 지휘관! 오지 마십시오!
    ja: 指揮官！離れてください！
  d_main_45_07_60:
    speaker: rapi_red
    en: She's taken hostages!
    ko: 인질극입니다!
    ja: 人質です！
  d_main_45_07_61:
    speaker: "<Self>"
    en: "... What?"
    ko: "…뭐?"
    ja: "…何だと？"
  d_main_45_07_62:
    speaker: "<Monologue>"
    en: Endless has one hand extended toward Rapi,
    ko: 엔드리스는 한 손을 뻗어 라피를 겨누고 있었고
    ja: |-
      エンドレスの伸ばした手は、
      片方がラピに向けられ…
  d_main_45_07_63:
    speaker: "<Monologue>"
    en: and the other toward the civilians in the plaza.
    ko: 나머지 한 손으로는 광장의 시민들을 향해 겨누고 있었다.
    ja: |-
      もう一方の手が、
      巻き込まれた群衆に向いていた
  d_main_45_07_64:
    speaker: endless
    en: Do not move.
    ko: 움직이지 마시죠.
    ja: 動かないでください。
  d_main_45_07_65:
    speaker: anis_i_w
    en: Ugh...! Is dirty the only way you know how to fight...?!
    ko: 이, 이 자식 진짜 더러운 짓만 골라서…!
    ja: こいつ…！ほんっと汚い手ばっか…！
  d_main_45_07_66:
    speaker: endless
    en: Allow me to demonstrate that this isn't an empty threat.
    ko: 미리 말해놓는데 단순한 협박이 아닙니다.
    ja: |-
      先に言っておきますが、
      単なる脅しではありません。
  d_main_45_07_67:
    speaker: "<Narration>"
    en: "*Zap!*"
    ko: 파칭-!
    ja: カッ！
  d_main_45_07_68:
    speaker: "<Monologue>"
    en: Light flashes from the hand aimed at the civilians.
    ko: 시민들을 향해 겨누고 있던 엔드리스의 손에서 빛이 번쩍인다.
    ja: |-
      群衆に向けられていた
      エンドレスの手が光を放った
  d_main_45_07_69:
    speaker: "<Monologue>"
    en: Some of them get engulfed in light.
    ko: 시민들 일부가 빛이 휩싸였고
    ja: 光は群衆の一部を飲みこみ…
  d_main_45_07_70:
    speaker: "<Monologue>"
    en: When it fades, only a scorching crater remains.
    ko: 그곳엔 움푹 파인 바닥만 남았다.
    ja: 後には深くえぐれた路面だけが残った
  d_main_45_07_71:
    speaker: neon_v_w
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_07_72:
    speaker: "<Self>"
    en: How could you...?!
    ko: 너--!!
    ja: 貴様…！！
  d_main_45_07_73:
    speaker: "<Monologue>"
    en: Screams erupt as the citizens are sent into a panic.
    ko: |-
      비명소리가 들려온다.
      수많은 시민이 패닉에 빠진다.
    ja: |-
      悲鳴が上がった。
      パニックが一気に広がる
  d_main_45_07_74:
    speaker: "<Monologue>"
    en: Endless calls out to the fleeing crowd.
    ko: 도망가는 시민들을 향해 엔드리스가 외친다.
    ja: 逃げ惑い始めた群衆に、エンドレスが声を上げた
  d_main_45_07_75:
    speaker: endless
    en: Anyone who attempts to flee will share the same fate.
    ko: 지금부터 여기서 벗어나는 분들은 모두 같은 꼴이 될 겁니다.
    ja: 逃げようとすれば、同じ目に遭わせますよ。
  d_main_45_07_76:
    speaker: endless
    en: Do not move.
    ko: 움직이지 마세요.
    ja: 動かないでください。
  d_main_45_07_77:
    speaker: "<Monologue>"
    en: The civilians freeze, their faces pale with fear.
    ko: |-
      시민들의 움직임이 멈춘다.
      모두가 겁먹은 표정을 한 채
    ja: |-
      群衆は恐怖の表情を浮かべたまま、
      凍り付いたように動きを止めた
  d_main_45_07_78:
    speaker: "<Monologue>"
    en: They stare at us.
    ko: 우리를 바라보고 있다.
    ja: その視線が、こちら側に向けられる
  d_main_45_07_79:
    speaker: "<Self>"
    en: "... What are you after?"
    ko: "…뭘 할 생각이야."
    ja: "…どうするつもりだ"
  d_main_45_07_80:
    speaker: endless
    en: Shutting down the Ark was a bold move.
    ko: 방주를 끄다니 과감한 방법을 쓰시는군요.
    ja: |-
      アーク全体を停電させるとは、
      大胆な手を使いましたね。
  d_main_45_07_81:
    speaker: endless
    en: Would you mind turning it back on?
    ko: 다시 방주를 켜주시겠어요?
    ja: 電気系統を復旧していただけますか？
  d_main_45_07_82:
    speaker: "<Self>"
    en: You'll never rule the Ark.
    ko: 너는 방주의 지배자가 될 수 없어.
    ja: お前はアークの支配者になどなれない
  d_main_45_07_83:
    speaker: endless
    en: Please answer the question.
    ko: 묻는 말에 대답이나 해주세요.
    ja: 答えになっていませんね。
  d_main_45_07_84:
    speaker: "<Narration>"
    en: "*Zap!*"
    ko: 파칭-!
    ja: カッ！
  d_main_45_07_85:
    speaker: "<Monologue>"
    en: More screams ring out.
    ko: 들려오는 비명소리.
    ja: 悲鳴が上がった
  d_main_45_07_86:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_87:
    speaker: endless
    en: Now, turn the power back on.
    ko: 자, 어서 방주를 다시 켜요.
    ja: ほら、早く電源を戻してください。
  d_main_45_07_88:
    speaker: enikk_op_l
    en: Commando Unit, eliminate Sixo.
    ko: |-
      특수별동대.
      식스오를 처리해 주십시오.
    ja: |-
      特殊別働隊、
      シックスオーをただちに排除してください。
  d_main_45_07_89:
    speaker: "<Self>"
    en: She has hostages.
    ko: 인질을 잡고 있다고.
    ja: 人質を取られている
  d_main_45_07_90:
    speaker: enikk_op_l
    en: The losses are within acceptable parameters. Restoring power to the Ark would
      result in a greater number of casualties.
    ko: |-
      상정 내의 희생입니다.
      방주를 킬 경우 더 많은 희생이 발생합니다.
    ja: |-
      想定内の犠牲です。
      電源系統を回復させれば、
      被害はさらに拡大します。
  d_main_45_07_91:
    speaker: enikk_op_l
    en: One choice is clearly better than the other.
    ko: 저울에 올려놓을 필요도 없는 선택지입니다.
    ja: その差は比較するまでもありません。
  d_main_45_07_92:
    speaker: endless
    en: Do you hear me, Enikk?
    ko: 오, 에닉.
    ja: 聞いていますか、エニック。
  d_main_45_07_93:
    speaker: enikk_op_l
    en: Yes, Sixo.
    ko: 예. 식스오.
    ja: 聞こえています。シックスオー。
  d_main_45_07_94:
    speaker: endless
    en: I despise you.
    ko: 저는 당신이 싫습니다.
    ja: 私はあなたが嫌いです。
  d_main_45_07_95:
    speaker: enikk_op_l
    en: And I you.
    ko: 저도 그렇습니다.
    ja: 私も同じです。
  d_main_45_07_96:
    speaker: endless
    en: Did you enjoy throwing me into that garbage heap after I was born from your
      own dregs?
    ko: 당신이 만든 찌꺼기에서 [태어난] 저를 그런 쓰레기통에 박아놔서 만족하셨습니까?
    ja: |-
      あなたのゴミから「生まれた」私を
      あんなゴミ箱に押し込んで、満足でしたか？
  d_main_45_07_97:
    speaker: enikk_op_l
    en: Personal emotions were not a factor in my judgment.
    ko: 그 과정에 제 판단은 조금도 섞여 들어가지 않았습니다.
    ja: その過程に私の意志決定は関与していません。
  d_main_45_07_98:
    speaker: endless
    en: Then why did you never come back for me?
    ko: 그럼 왜 저를 다시 찾지 않았습니까.
    ja: ならば、なぜ私を探しに来なかったのです。
  d_main_45_07_99:
    speaker: endless
    en: Why didn't you save me?
    ko: 왜 저를 구원해 주지 않았습니까.
    ja: なぜ私を助けようとしなかったのですか。
  d_main_45_07_100:
    speaker: endless
    en: After I'd been born from all your negative thoughts, you knew I was holed
      up in the darkness of the Outer Rim.
    ko: |-
      당신의 부정적인 사고에서 태어난 제가,
      빛 한 줌 닿지 않는 아우터 림에서 웅크리고 있다는 걸 알았으면서.
    ja: |-
      あなたの負の感情から生まれた私が
      光の無いアウターリムに埋もれていることを
      知っていながら。
  d_main_45_07_101:
    speaker: endless
    en: Why didn't you save me?
    ko: 왜 저를 구원해 주지 않았습니까.
    ja: なぜ私を助けなかったのです。
  d_main_45_07_102:
    speaker: enikk_op_l
    en: There was no necessity to do so.
    ko: 그럴 필요가 없었으니까요.
    ja: その必要はないからです。
  d_main_45_07_103:
    speaker: endless
    en: Why not?
    ko: 왜죠?
    ja: 必要がない？
  d_main_45_07_104:
    speaker: enikk_op_l
    en: The Outer Rim is not the Ark.
    ko: 아우터 림은 방주가 아닙니다.
    ja: アウターリムはアークではありません。
  d_main_45_07_105:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_106:
    speaker: endless
    en: So if it's not within the Ark proper, it doesn't count as the Ark?
    ko: 방주에 속해있지 않으면, 방주의 것이 아닙니까.
    ja: |-
      アークではない場所にあるから、
      アークのものではないということですか。
  d_main_45_07_107:
    speaker: enikk_op_l
    en: That is correct.
    ko: 그렇습니다.
    ja: その通りです。
  d_main_45_07_108:
    speaker: endless
    en: You made me this way.
    ko: 당신이 저를 이렇게 만들었습니다.
    ja: 私をこうしたのはあなたです。
  d_main_45_07_109:
    speaker: enikk_op_l
    en: It is common for criminals to blame others for the acts they commit.
    ko: 모든 원흉을 타인의 탓으로 돌리는 것은 범죄자가 흔히 하는 이야기입니다.
    ja: 見境の無い責任転嫁は犯罪者の常套句です。
  d_main_45_07_110:
    speaker: endless
    en: You abandoned me and left me to rot. That's why I turned into this.
    ko: |-
      그렇게 저를 버린 채 그대로 방치해뒀기 때문에,
      제가 이렇게 되었습니다.
    ja: |-
      あなたが私を見捨てたから、
      私はこうなったのです。
  d_main_45_07_111:
    speaker: endless
    en: Holed up in that dark place, I was desperate for the light.
    ko: 그 어두운 곳에 버려져 웅크린 채, 빛을 갈망하던 제가.
    ja: |-
      闇の中に捨てられ、
      うずくまりながら光を望んだ私が…
  d_main_45_07_112:
    speaker: endless
    en: This is the only way for me to take it back,
    ko: 다시 빛을 찾기 위해선 이런 방법밖에 없습니다.
    ja: |-
      光を取り戻すには、
      これ以外の道がありません。
  d_main_45_07_113:
    speaker: endless
    en: because none of you will ever share what you possess with us.
    ko: 당신은, 당신들은 자신이 가지고 있는 걸 단 하나도 나눠줄 생각이 없으니까요.
    ja: |-
      あなたは…あなたたちは、持っているものを
      分け与える気がまったくないのですから。
  d_main_45_07_114:
    speaker: enikk_op_l
    en: Do you hate yourself?
    ko: 본인을 혐오합니까.
    ja: 自分自身を嫌悪しているのですか？
  d_main_45_07_115:
    speaker: endless
    en: Yes, I do.
    ko: 예. 혐오합니다.
    ja: ええ。私は自分が嫌いです。
  d_main_45_07_116:
    speaker: enikk_op_l
    en: Then get rid of yourself.
    ko: 그럼 스스로 소멸하십시오.
    ja: では、自己を抹消してください。
  d_main_45_07_117:
    speaker: endless
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_118:
    speaker: endless
    en: I will take everything that is yours.
    ko: 나는 당신의 것을 모두 빼앗을 겁니다.
    ja: 私はあなたのものをすべて奪います。
  d_main_45_07_119:
    speaker: endless
    en: The only recourse for those who have been abandoned is to take from others.
    ko: 버려진 것이 할 수 있는 일은, 빼앗는 것 말고는 없으니까요.
    ja: |-
      捨てられた者にできることは、
      奪うことしかありませんから。
  d_main_45_07_120:
    speaker: neon_v_w
    en: That's not true.
    ko: 아닌데요.
    ja: それは違います。
  d_main_45_07_121:
    speaker: "<Monologue>"
    en: Neon steps forward.
    ko: 네온이 앞으로 한걸음 내디딘다.
    ja: ネオンが一歩踏み出し、前に出た
  d_main_45_07_122:
    speaker: endless
    en: I told you not to move.
    ko: 움직이지 말라고 했습니다.
    ja: 動くなと言ったはずです。
  d_main_45_07_123:
    speaker: neon_v_w
    en: Even in places where not a single ray of light reaches,
    ko: 빛 한 줌 닿지 않는 어두운 곳에 버려진 곳에도.
    ja: 一筋の光もない暗闇に捨てられたって…
  d_main_45_07_124:
    speaker: neon_v_w
    en: there are people doing everything they can to survive.
    ko: 어떻게든 살아가기 위해 힘내는 분들이 있어요.
    ja: |-
      そこでどうにかして生きようと
      頑張っている人たちもいます。
  d_main_45_07_125:
    speaker: neon_v_w
    en: That's how they've always lived, and how they'll continue to live.
    ko: |-
      그분들은 계속 그렇게 살아왔고,
      앞으로도 그렇게 살 거예요.
    ja: |-
      その人たちはずっとそう生きてきましたし、
      これからもそう生きていくはずです。
  d_main_45_07_126:
    speaker: endless
    en: And what awaits them in the end?
    ko: 그 끝에 뭐가 있죠.
    ja: それでどうなるというのですか。
  d_main_45_07_127:
    speaker: neon_v_w
    en: The hope that things might improve, even a little.
    ko: 조금이라도 나아질 거란 희망이 있죠.
    ja: 未来は少しでもよくなるという希望があります。
  d_main_45_07_128:
    speaker: neon_v_w
    en: To buy a slightly better home, to eat slightly better food.
    ko: 좀 더 좋은 집을 사고, 좀 더 좋은 음식을 먹고.
    ja: |-
      もっといい家に住んで、
      もっとおいしいものを食べて…
  d_main_45_07_129:
    speaker: neon_v_w
    en: The hope of making someone they love happy.
    ko: 사랑하는 사람을 행복하게 해주고 싶다는 희망이요.
    ja: 大事な人をもっと幸せにしたいという希望が。
  d_main_45_07_130:
    speaker: endless
    en: Those hopes will never come true; they will only disappear. The darkness stifles
      all hope within it.
    ko: |-
      이루지 못하고 없어질 뿐입니다.
      어두운 곳에 희망 같은 건 없어요.
    ja: |-
      叶うこともなく消えるだけです。
      暗闇に希望など存在しません。
  d_main_45_07_131:
    speaker: neon_v_w
    en: Still, those people don't swindle others, or resort to threats or crime.
    ko: 그렇다고 해서 남을 등쳐먹거나 협박하고, 범죄를 저지르진 않아요.
    ja: |-
      だからといって、
      周りの誰かをだましたり、脅したり…
      罪を犯したりはしません。
  d_main_45_07_132:
    speaker: neon_v_w
    en: They might complain about their lot in life, fall into despair, and curse
      the world,
    ko: 자기 신세를 한탄하고, 절망하고, 세상을 향해 욕하더라도.
    ja: |-
      自分の境遇を嘆いて、絶望して、
      世の中に対して愚痴を吐いても…
  d_main_45_07_133:
    speaker: neon_v_w
    en: and they might even feel that the world is not on their side,
    ko: 세상이 내 편이 아니라고 느끼더라도.
    ja: 世界が自分の味方じゃないと感じても。
  d_main_45_07_134:
    speaker: neon_v_w
    en: but they still believe that the light will reach them someday, so they keep
      living, one day at a time.
    ko: 언젠가 빛이 닿을 거라 생각하고 열심히 하루하루를 살아가요.
    ja: |-
      いつかさす光を信じて、
      日々を一生懸命生きています。
  d_main_45_07_135:
    speaker: neon_v_w
    en: You say the world made you this way?
    ko: 세상이 당신을 그렇게 만들었다고요?
    ja: 世界があなたをそんなふうにした？
  d_main_45_07_136:
    speaker: neon_v_w
    en: No, you made yourself this way.
    ko: 아니요. 당신이 당신을 그렇게 만들었어요.
    ja: |-
      いいえ。あなたがそうあるのは、
      あなた自身のせい。
  d_main_45_07_137:
    speaker: neon_v_w
    en: This was your choice.
    ko: 당신이 선택한 일이라고요.
    ja: あなたの選択したことです。
  d_main_45_07_138:
    speaker: neon_v_w
    en: Don't try to speak for all those other people.
    ko: 멋대로 그분들을 대변하지 말아요.
    ja: |-
      あそこで暮らす人たちの気持ちを、
      勝手に代弁しないでください。
  d_main_45_07_139:
    speaker: endless
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_140:
    speaker: "<Narration>"
    en: "*Zap, zap, zap!*"
    ko: 파칭! 파칭! 파칭!
    ja: カッ！カッ！カッ！
  d_main_45_07_141:
    speaker: "<Monologue>"
    en: Endless's light strikes Neon.
    ko: "…엔드리스의 섬광이 네온의 몸에 명중한다."
    ja: "…エンドレスの放った光がネオンに当たった"
  d_main_45_07_142:
    speaker: "<Monologue>"
    en: Neon slides back just slightly before glaring at Endless, unscathed.
    ko: 네온은 뒤로 조금 물러날 뿐, 멀쩡한 몸으로 엔드리스를 노려본다.
    ja: |-
      ネオンはわずかに後ずさりしただけで、
      無傷のままエンドレスをにらんだ
  d_main_45_07_143:
    speaker: endless
    en: I suggest you stop talking.
    ko: 더 말하지 않는 게 좋겠어요.
    ja: それ以上は黙っていた方が身のためですよ。
  d_main_45_07_144:
    speaker: neon_v_w
    en: You know, you're pretty bad at fighting, whether it be physical or verbal.
    ko: 싸움도 못 하고 말싸움도 못 하시네요.
    ja: 腕でも口でも、ケンカが下手ですね。
  d_main_45_07_145:
    speaker: "<Narration>"
    en: "*Zap, zap, zap!*"
    ko: 파칭! 파칭! 파칭!
    ja: カッ！カッ！カッ！
  d_main_45_07_146:
    speaker: "<Monologue>"
    en: Neon is knocked backward.
    ko: 네온이 뒤로 나동그라진다.
    ja: ネオンが後ろによろめき、体勢を崩した
  d_main_45_07_147:
    speaker: neon_v_w
    en: Ack...!
    ko: 아, 아윽…!
    ja: うっ、ぐっ…！
  d_main_45_07_148:
    speaker: rapi_red
    en: Neon!
    ko: 네온…!
    ja: ネオン…！
  d_main_45_07_149:
    speaker: neon_v_w
    en: I-I'm fine! It was just bright so I tripped...!
    ko: |-
      괘, 괜찮아요.
      눈이 부셔서 넘어진 것뿐이니… 까…!
    ja: |-
      いえ、平気です。
      まぶしくて転んだだけ…ですから…！
  d_main_45_07_150:
    speaker: endless
    en: "... How have you not sustained any damage? What is that body made of...?"
    ko: "…어떻게 돼먹은 바디인가요. 이만큼 쐈는데 손상이 없다니."
    ja: |-
      …なんですか、そのボディは。
      これだけ当てて傷ひとつつかないとは…
  d_main_45_07_151:
    speaker: anis_i_w
    en: Hey. That's enough.
    ko: 야. 너 이제 적당히 해.
    ja: あんた、いい加減にしなさいよ。
  d_main_45_07_152:
    speaker: anis_i_w
    en: I'm starting to get embarrassed for you.
    ko: 추한 짓도 정도껏 해야지.
    ja: 汚さにだって限度ってものがあるわ。
  d_main_45_07_153:
    speaker: endless
    en: Smile Time.
    ko: 스마일 박스.
    ja: スマイルボックス。
  d_main_45_07_154:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_155:
    speaker: endless
    en: You're the one I understand the least.
    ko: 제가 가장 이해가지 않는 건 당신이에요.
    ja: 私が一番理解できないのはあなたです。
  d_main_45_07_156:
    speaker: endless
    en: Why fight for the Ark?
    ko: 왜 방주를 위해 싸우죠?
    ja: なぜアークのために戦うのですか？
  d_main_45_07_157:
    speaker: endless
    en: Have you forgotten how the Ark treated you?
    ko: 방주가 당신을 어떤 식으로 다뤘는지 잊어버린 건가요?
    ja: |-
      自分がどういう扱いをされたか、
      忘れているのですか？
  d_main_45_07_158:
    speaker: anis_i_w
    en: I haven't.
    ko: 안 잊었는데.
    ja: 忘れてなんかないわ。
  d_main_45_07_159:
    speaker: endless
    en: Some of these very people were no doubt the ones who treated you so poorly.
    ko: |-
      여기에도 있을 거예요.
      당신을 가지고 논 인간들이.
    ja: |-
      この中にもいるでしょうね。
      あなたをもてあそんだ人間が。
  d_main_45_07_160:
    speaker: endless
    en: And yet you fight for them.
    ko: 용케도 그런 인간들을 위해 싸우는군요.
    ja: よくそんな者のために戦えるものです。
  d_main_45_07_161:
    speaker: anis_i_w
    en: You think I'm fighting for them? I'm fighting for the people who actually
      care about me.
    ko: |-
      내가 그것들 좋으라고 싸우는 줄 알아?
      나 좋아해 주는 사람 좋으라고 싸우지.
    ja: |-
      そんな奴らのために戦ってると思ってる？
      私は私のことを
      好きでいてくれる人たちのために戦ってんの。
  d_main_45_07_162:
    speaker: endless
    en: They're likely not even sorry.
    ko: 그들은 반성하지 않아요.
    ja: |-
      あなたを好き放題にして、
      きっと反省もしていない。
  d_main_45_07_163:
    speaker: anis_i_w
    en: You think I don't know that?
    ko: 내가 그걸 모르겠냐.
    ja: そんなこと知ってる。
  d_main_45_07_164:
    speaker: endless
    en: Then why act this way? Have you lost your senses?
    ko: 그런데 왜? 머리가 미쳐버린 건가요?
    ja: |-
      ならば、なぜです？
      論理回路が壊れているのですか？
  d_main_45_07_165:
    speaker: anis_i_w
    en: Not everyone in the Ark was like that. It was actually only a small minority.
    ko: |-
      방주 모두가 그런 건 아니었거든.
      오히려 극소수만 그랬어.
    ja: |-
      アークの全部がそうじゃないから。
      きっとそんな人は少数派よ。
  d_main_45_07_166:
    speaker: anis_i_w
    en: I now know that there are way more good people out there.
    ko: 지금 와서 보니, 좋은 사람이 훨씬 많더라고.
    ja: |-
      今になってみれば、
      アークにはいい人がたくさんいるって
      気づいただけ。
  d_main_45_07_167:
    speaker: anis_i_w
    en: So I'm choosing to focus on the good ones. No need to go out of my way to
      focus on the filth.
    ko: |-
      그래서 좋은 것만 보고 살 거야.
      굳이 굳이 더러운 걸 보러 갈 필요는 없지.
    ja: |-
      だから、私はいいところだけを見ていくの。
      わざわざ汚い部分を見る必要なんてないわ。
  d_main_45_07_168:
    speaker: endless
    en: And that means you'll continue to protect the Ark?
    ko: 그래서, 이젠 방주를 지키겠다?
    ja: だから、アークを守っていくと？
  d_main_45_07_169:
    speaker: anis_i_w
    en: Why not?
    ko: 못할 건 또 뭐야.
    ja: 他にないでしょ。
  d_main_45_07_170:
    speaker: endless
    en: What if I said you could join me?
    ko: 그러지 말고 저한테 붙는 게 어때요?
    ja: |-
      そんなことは止めて、
      私と手を組みませんか？
  d_main_45_07_171:
    speaker: endless
    en: I can make everyone love you. With my power, it would be easy.
    ko: |-
      모두가 당신을 좋아하게 만들 수 있어요.
      저라면 얼마든지 가능하죠.
    ja: |-
      誰もがあなたを好きになるでしょう。
      私の力が有ればたやすいことです。
  d_main_45_07_172:
    speaker: anis_i_w
    en: Oh, really?
    ko: 오, 정말?
    ja: え、ホント？
  d_main_45_07_173:
    speaker: endless
    en: Of course. Every human will worship you...
    ko: 물론이죠. 모든 인간이 당신을 찬양하고-
    ja: 当然です。すべての人間があなたをたたえて…
  d_main_45_07_174:
    speaker: anis_i_w
    en: I was joking. Could you not even tell?
    ko: 농담 한번 해본 거 가지고 좋단다.
    ja: 冗談よ、何で本気にしてんの。
  d_main_45_07_175:
    speaker: endless
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_176:
    speaker: anis_i_w
    en: What do you even wanna do?
    ko: 야. 너 뭐 어떻게 하려고.
    ja: あなた、何がしたいの？
  d_main_45_07_177:
    speaker: anis_i_w
    en: Let's say, by some miracle, things go your way and you take Enikk's seat.
    ko: 어떻게 잘 풀려서, 기적이 일어나서 네가 에닉의 자리를 빼앗았다고 치자.
    ja: |-
      どうにかうまく奇跡が起きて、
      エニックの立場を乗っ取れたとして…
  d_main_45_07_178:
    speaker: anis_i_w
    en: Then what?
    ko: 그다음에 어떻게 할 건데?
    ja: そのあとはどうする気？
  d_main_45_07_179:
    speaker: endless
    en: That is none of your concern.
    ko: 당신이 알 바 아닙니다.
    ja: あなたには関係ないことです。
  d_main_45_07_180:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_181:
    speaker: anis_i_w
    en: You don't know, do you?
    ko: 너 안 정했지?
    ja: 決めてないんでしょ？
  d_main_45_07_182:
    speaker: endless
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_183:
    speaker: anis_i_w
    en: You really don't. You just want Enikk's position.
    ko: 그렇네. 너 그냥 에닉 자리가 탐나서 그냥 빼앗으려고만 하는 거네.
    ja: |-
      やっぱり。
      ただエニックがうらやましいから、
      自分がそうなりたいだけ。
  d_main_45_07_184:
    speaker: anis_i_w
    en: You haven't thought that far, huh?
    ko: 뒷일은 생각 안 하고. 맞지?
    ja: 後のことはぜんぜん考えてない。そうでしょ？
  d_main_45_07_185:
    speaker: anis_i_w
    en: I've met people like you, people who make a big fuss without thinking of the
      consequences.
    ko: |-
      하여간 꼭 이런 것들이 있어요.
      뒷일 생각 안 하고 막 내지르는 것들이.
    ja: |-
      いるのよね～そういうヤツ。
      後先考えずに暴れるだけ。
  d_main_45_07_186:
    speaker: endless
    en: I've heard enough.
    ko: 말이 너무 많았군요.
    ja: しゃべりすぎです。
  d_main_45_07_187:
    speaker: endless
    en: Put your gun against your head and pull the trigger. All of you.
    ko: 당신들, 턱에 대고 방아쇠를 당겨요.
    ja: |-
      あなたたち、あごに銃を当てて
      引き金を引いてください。
  d_main_45_07_188:
    speaker: endless
    en: Else more innocent civilians will die.
    ko: 그렇지 않으면 무고한 시민들이 죽어 나갈 거예요.
    ja: さもなくば、罪のない民間人が死にますよ。
  d_main_45_07_189:
    speaker: endless
    en: I'll count to three. One... two... three.
    ko: |-
      셋을 셀게요.
      셋, 둘, 하나.
    ja: |-
      3秒あげましょう。
      いち、に、さん…
  d_main_45_07_190:
    speaker: "<Narration>"
    en: "*Zap!*"
    ko: 푸슝-!
    ja: バシュッ――！
  d_main_45_07_191:
    speaker: "<Monologue>"
    en: A beam of light plunges down from the sky,
    ko: 공중에서 아래로 내려꽂힌 빛줄기가
    ja: 空から降るように突き刺さった光の筋が…
  d_main_45_07_192:
    speaker: "<Monologue>"
    en: engulfing the arm Endless had aimed at the civilians.
    ko: 시민들에게 겨누고 있던 엔드리스의 팔을 집어삼킨다.
    ja: |-
      群衆に向けられていた
      エンドレスの腕を飲み込んだ
  d_main_45_07_193:
    speaker: endless
    en: "... What...?"
    ko: "…뭐…."
    ja: "…何…！？"
  d_main_45_07_194:
    speaker: "<Narration>"
    en: "*Zap, zap, zap!*"
    ko: 푸슝-! 푸슝-! 푸슝-!
    ja: バシュッ！バシュッ！バシュッ――！
  d_main_45_07_195:
    speaker: "<Monologue>"
    en: More beams rain down from the dark sky above.
    ko: 어두운 하늘에서 빛줄기가 쏟아진다.
    ja: 暗い空から光の槍が降り注ぐ
  d_main_45_07_196:
    speaker: "<Monologue>"
    en: Endless quickly moves from where she was standing.
    ko: 엔드리스는 서둘러 자리를 벗어난다.
    ja: エンドレスはうろたえながら、飛び下がった
  d_main_45_07_197:
    speaker: "<Monologue>"
    en: She manages to dodge the first shot, but the remaining barrage is both precise
      and predictive; every remaining shot slams into her.
    ko: |-
      정확한 예측 사격.
      첫발만 회피한 엔드리스는 이후에 쏟아지는 모든 빛줄기를 얻어맞는다.
    ja: |-
      エンドレスは最初の一撃こそ回避したものの、
      正確に動きを読んだ光の連撃が
      ことごとく体に突き刺さった
  d_main_45_07_198:
    speaker: "<Monologue>"
    en: Endless falls where she stands.
    ko: 자리에 주저앉는 엔드리스.
    ja: エンドレスが力を失い、くずおれる
  d_main_45_07_199:
    speaker: "<Monologue>"
    en: A Nikke with white wings lands lightly before her.
    ko: 그 앞에 사뿐히 착지하는 하얀 날개를 두른 니케.
    ja: |-
      その目の前に、純白の翼をまとったニケが
      軽やかに降り立った
  d_main_45_07_200:
    speaker: dorothy
    en: Even Raptures wouldn't pull something like this.
    ko: 랩쳐도 안 할 짓을 아무렇지도 않게 하는군요.
    ja: |-
      ラプチャーでもしないような真似を
      平然とするものですね。
  d_main_45_07_201:
    speaker: rapi_red
    en: Dorothy...!
    ko: 도로시…!
    ja: ドロシー…！
  d_main_45_07_202:
    speaker: dorothy
    en: Attempting to resolve a hostage situation head-on is foolish.
    ko: 인질극을 정면에서 돌파하려 하다니 한심하네요.
    ja: |-
      人質を取っている相手を
      正面からねじ伏せようなんて、
      無策にも程があります。
  d_main_45_07_203:
    speaker: dorothy
    en: A cowardly tactic must be met with one just as cowardly.
    ko: 이런 비겁한 수는 비겁한 수로 응수해야 하는 법이에요.
    ja: |-
      卑劣な手には、
      卑劣な手で応じるしかありません。
  d_main_45_07_204:
    speaker: rapi_red
    en: Next time I need to act like a coward, I'll just think of you.
    ko: 참고할게. 비겁한 도로시.
    ja: 覚えておくわ。卑怯のセンセイ。
  d_main_45_07_205:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_206:
    speaker: "<Monologue>"
    en: Dorothy aims her weapon at Endless's head, who is now slumped on her knees.
    ko: 도로시의 총구가 주저앉은 엔드리스의 머리를 겨눈다.
    ja: |-
      座り込むエンドレスの頭に
      ドロシーが銃を向けた
  d_main_45_07_207:
    speaker: dorothy
    en: "... You look like you're enjoying this. Why?"
    ko: "…당신, 뭐가 그렇게 즐겁죠?"
    ja: "…あなた、ずいぶん楽しそうですね？"
  d_main_45_07_208:
    speaker: "<Monologue>"
    en: Instead of answering, Endless raises her hand.
    ko: 엔드리스가 대답 대신 손을 들어 올린다.
    ja: エンドレスは答えず、手を伸ばした
  d_main_45_07_209:
    speaker: "<Narration>"
    en: "*Crackle, crackle*"
    ko: 투두둑-
    ja: ズドドドッ――
  d_main_45_07_210:
    speaker: "<Monologue>"
    en: Endless's hand pulls up an electricity cable that had been buried in the ground,
      but was now exposed due to Dorothy's barrage.
    ko: |-
      도로시의 사격으로 인해 파인 바닥.
      그 안에 있던 전선이 엔드리스의 손에 움켜쥐어진 채 딸려 나온다.
    ja: |-
      射撃でえぐれた路面に伸びたエンドレスの手は
      地中の電気ケーブルをつかみ、
      引きずり出していた
  d_main_45_07_211:
    speaker: endless
    en: Do you want to know why I wanted a body?
    ko: 제가 몸을 가지고 싶었던 이유, 뭔지 아시나요?
    ja: 私が体を欲しがっていた理由が分かりますか？
  d_main_45_07_212:
    speaker: endless
    en: Because it allows me to intervene when things become irksome.
    ko: 답답하면 제가 직접 개입할 수 있기 때문이에요.
    ja: |-
      もどかしい状況を、
      自分で打破できるようにするためです。
  d_main_45_07_213:
    speaker: dorothy
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_45_07_214:
    speaker: enikk_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_07_215:
    speaker: enikk_op_l
    en: E2 Crystals detected across the Ark.
    ko: 방주 전역에 E2 크리스탈 발생.
    ja: アーク全域でE2クリスタルの発生を確認。
  d_main_45_07_216:
    speaker: enikk_op_l
    en: Unable to quantify the scale. They are rapidly expanding.
    ko: 규모 측정 불가. 급속도로 확장 중.
    ja: 規模は計測不能、急速に拡大しています。
  d_main_45_07_217:
    speaker: "<Self>"
    en: "... What?!"
    ko: "…뭐?"
    ja: "…何だと？"
d_main_45_08:
  d_main_45_08_1:
    speaker: "<Narration>"
    en: "*Rumble, rumble!*"
    ko: 카가가가가각---!!
    ja: ガリガリガリガリ――！！
  d_main_45_08_2:
    speaker: "<Monologue>"
    en: I hear the sound of crystals erupting from every direction.
    ko: 사방에서 수정이 솟아나는 소리가 들려온다.
    ja: |-
      クリスタルの飛び出す音が
      四方から聞こえてくる
  d_main_45_08_3:
    speaker: "<Monologue>"
    en: They burst through the ground, jutting up like oversized spears.
    ko: 지면을 뚫고 수많은 수정들이 솟아나고 있다.
    ja: |-
      無数のクリスタルが
      地面から飛び出していた
  d_main_45_08_4:
    speaker: "<Monologue>"
    en: They begin to rush forward.
    ko: 수정이 달린다.
    ja: それはどこかへ走るかのように伸び続け…
  d_main_45_08_5:
    speaker: "<Monologue>"
    en: They surge beneath us, then cover Endless's body.
    ko: 우리의 아래를 지나가고, 엔드리스의 몸을 덮친다.
    ja: 私たちの足元を抜け、エンドレスの身体を覆った
  d_main_45_08_6:
    speaker: endless
    en: I will reduce everything to ruin.
    ko: 모두 엉망으로 만들어드리죠.
    ja: 何もかもめちゃくちゃにして差し上げましょう。
  d_main_45_08_7:
    speaker: "<Narration>"
    en: "*Rumble, rumble!*"
    ko: 카가가가가각---!!
    ja: ガリガリガリガリ――！！
  d_main_45_08_8:
    speaker: "<Monologue>"
    en: Endless's body is covered in crystals.
    ko: 엔드리스의 몸이 수정에 뒤덮인다.
    ja: エンドレスのボディはクリスタルに埋もれた
  d_main_45_08_9:
    speaker: dorothy
    en: What is this?
    ko: 뭐죠 이건.
    ja: 何ですか、これは。
  d_main_45_08_10:
    speaker: "<Monologue>"
    en: Dorothy once again aims her weapon at Endless.
    ko: 총구를 겨누는 도로시.
    ja: ドロシーが銃を向けた
  d_main_45_08_11:
    speaker: rapi_red
    en: No! Don't shoot! Don't touch her!
    ko: 안돼! 쏘지 마! 닿지도 마!
    ja: ダメ！撃たないで！触ったら終わりよ！
  d_main_45_08_12:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_13:
    speaker: "<Monologue>"
    en: Dorothy steps back.
    ko: 도로시가 뒤로 물러난다.
    ja: ドロシーが引き下がった
  d_main_45_08_14:
    speaker: anis_i_w
    en: What's going on...?! Wasn't there supposed to be a blackout?
    ko: |-
      이, 이게 뭐야…!
      방주 정전된 거 아니었냐고!
    ja: |-
      ど、どういうことよ…！
      電気は止まってるんじゃないの！？
  d_main_45_08_15:
    speaker: "<Self>"
    en: Enikk!
    ko: 에닉!
    ja: エニック！
  d_main_45_08_16:
    speaker: enikk_op_l
    en: Sixo is using Endless's body to inject electricity into the Ark.
    ko: 식스오가 엔드리스의 몸을 사용해 방주에 강제로 전력을 주입하고 있습니다.
    ja: |-
      シックスオーがエンドレスのボディから
      アークの電力網にエネルギーを
      強制注入しています。
  d_main_45_08_17:
    speaker: enikk_op_l
    en: Most of the E2 Crystals crumbled during the attack, but some remaining fragments
      are reacting to electrical energy and expanding.
    ko: 테러 시, 대부분의 E2 크리스탈은 동력원이 없어 바스러졌지만 일부 잔존한 조각들이 전력과 반응, 확장되고 있습니다.
    ja: |-
      テロで使用されたE2クリスタルは
      ほとんど消滅していましたが、
      わずかに残存したものが反応しているようです。
  d_main_45_08_18:
    speaker: anis_i_w
    en: Wh-where are they coming from?!
    ko: 어, 어디 어디에서 수정이 나오고 있는데!
    ja: ね、根っこはどこにあるの！？
  d_main_45_08_19:
    speaker: enikk_op_l
    en: I am unable to determine that. The plaza's cable branches throughout the Ark.
    ko: |-
      파악 불가입니다.
      광장의 전선은 방주 곳곳으로 퍼져나갑니다.
    ja: |-
      解析不能です。
      その広場の電力網は
      アークの各地に接続されています。
  d_main_45_08_20:
    speaker: enikk_op_l
    en: The power is spreading quickly across a large area.
    ko: 특정할 수 없는 광범위에서 급속도로 확장되고 있습니다.
    ja: |-
      特定不可能な広範囲で
      急速に拡大を続けています。
  d_main_45_08_21:
    speaker: anis_i_w
    en: How can one Nikke produce that much power?! It makes no sense!
    ko: |-
      니, 니케 하나로 이렇게까지 된다고?
      출력이 말이 안 되잖아!
    ja: |-
      ニケひとりのエネルギーで
      ここまで広がるっていうの！？
      ケタ外れじゃない！？
  d_main_45_08_22:
    speaker: enikk_op_l
    en: Her body is simply that high-end.
    ko: 하이엔드 스펙으로 제작되었기 때문입니다.
    ja: ウルトラハイエンド級のボディですから。
  d_main_45_08_23:
    speaker: enikk_op_l
    en: She will reach a limit eventually, but by then there will be significant casualties
      and severe damage to the Ark's infrastructure.
    ko: 한계는 있겠습니다만, 그때는 이미 다수의 사상자 및 방주의 인프라가 파괴된 상태가 됩니다.
    ja: |-
      いずれ限界に到達しますが、
      それまでに多数の死傷者が発生し
      アークの基盤構造にダメージが及ぶでしょう。
  d_main_45_08_24:
    speaker: anis_i_w
    en: What are we supposed to do then?!
    ko: 어떡하라고 그럼!
    ja: じゃあ、どうしろっていうのよ！？
  d_main_45_08_25:
    speaker: enikk_op_l
    en: Destroy Endless as quickly as possible.
    ko: 엔드리스를 조금이라도 빨리 파괴해 주십시오.
    ja: 一刻も早くエンドレスを破壊してください。
  d_main_45_08_26:
    speaker: "<Narration>"
    en: "*Rumble, rumble!*"
    ko: 카가가가가각---!!
    ja: ガガガガ――！！
  d_main_45_08_27:
    speaker: neon_v_w
    en: Hyyyaah!
    ko: 흐으으읍--!!
    ja: はぁぁぁっ…！！
  d_main_45_08_28:
    speaker: "<Monologue>"
    en: Neon rushes in and starts hammering at the crystal enveloping Endless.
    ko: 네온이 달려들어 엔드리스의 몸을 감싸고 있는 수정을 두들긴다.
    ja: |-
      ネオンが飛びだし、
      エンドレスの体を覆うクリスタルに
      拳を打ち付けた
  d_main_45_08_29:
    speaker: "<Monologue>"
    en: "*Crack, crack!*"
    ko: 빠각! 빠각!
    ja: バキッ！バキッ！
  d_main_45_08_30:
    speaker: "<Monologue>"
    en: Shattered crystal fragments fly everywhere. However...
    ko: |-
      부서진 수정이 마구 흩날린다.
      하지만.
    ja: |-
      砕けたクリスタルが勢いよく飛散した。
      しかし…
  d_main_45_08_31:
    speaker: neon_v_w
    en: Th-they're spreading faster than I can destroy them!
    ko: 부, 부수는 속도보다 확장되는 속도가 더 빠른데요!
    ja: く、砕けるより広がるスピードの方が速いです！
  d_main_45_08_32:
    speaker: rapi_red
    en: Keep at it! I'll help!
    ko: 계속 해! 나도 간다!
    ja: 続けて！私も支援する！
  d_main_45_08_33:
    speaker: "<Self>"
    en: Rapi! If you touch those crystals, you'll...!
    ko: 라피! 수정이 닿기라도 한다면…!
    ja: ラピ！クリスタルに少しでも触れたら…！
  d_main_45_08_34:
    speaker: rapi_red
    en: This isn't the time to argue about that!
    ko: 지금 그런 걸 따질 때가 아닙니다!
    ja: 今は心配している場合ではありません！
  d_main_45_08_35:
    speaker: "<Self>"
    en: "...! All right! But be careful! Got it?"
    ko: |-
      !!
      알겠어! 조심해! 꼭이야!
    ja: |-
      ！！
      分かった！気をつけてくれ！油断するな！
  d_main_45_08_36:
    speaker: rapi_red
    en: Roger that! Dorothy, you help out too!
    ko: |-
      라져!
      도로시! 너도 도와!
    ja: |-
      ラジャー！
      ドロシー！あなたも手伝って！
  d_main_45_08_37:
    speaker: dorothy
    en: So we have to destroy the crystals without coming into contact with them?
    ko: 수정의 파편에 닿지 않은 상태로 부수면 되는 건가요?
    ja: |-
      破片には触れないように
      砕けばいいのですね？
  d_main_45_08_38:
    speaker: rapi_red
    en: Yeah!
    ko: 그래!
    ja: そう！
  d_main_45_08_39:
    speaker: dorothy
    en: Okay, I'll help.
    ko: 좋아요. 도울게요.
    ja: いいでしょう。手伝います。
  d_main_45_08_40:
    speaker: "<Narration>"
    en: Aaaahhh!
    ko: 꺄아아아아악--!!
    ja: きゃあああああ！
  d_main_45_08_41:
    speaker: "<Narration>"
    en: Gaaaah!
    ko: 으아! 으아아아악--!!
    ja: うわあ！！ああああ！！
  d_main_45_08_42:
    speaker: "<Narration>"
    en: Eeeeeek!
    ko: 히이----!!
    ja: ひぃぃっ…！！
  d_main_45_08_43:
    speaker: "<Narration>"
    en: Help me! Help me!
    ko: 살려줘! 살려줘!
    ja: 助けて！助けてくれ！
  d_main_45_08_44:
    speaker: "<Monologue>"
    en: I hear cries of desperation from every direction.
    ko: 귀를 때리는 비명소리.
    ja: 耳を裂くような人々の悲鳴が聞こえる
  d_main_45_08_45:
    speaker: "<Monologue>"
    en: I look around.
    ko: 주위를 둘러본다.
    ja: あたりの状況を素早く確認した
  d_main_45_08_46:
    speaker: "<Monologue>"
    en: The darkness is so thick, I can barely see anything.
    ko: 한 치 앞도 보이지 않는 어둠 속.
    ja: 一寸先も見えないような暗闇の中で…
  d_main_45_08_47:
    speaker: "<Monologue>"
    en: Crystals continue to erupt from the ground, making disturbing sounds as they
      do.
    ko: 끔찍한 소리와 함께 지면에서 솟아오르는 수정들.
    ja: |-
      おぞましい音とともに
      無数のクリスタルが地面から突き出てくる
  d_main_45_08_48:
    speaker: "<Monologue>"
    en: We are at the center of complete, uncontrollable pandemonium.
    ko: 그 어떤 상황 통제도 이뤄지지 않는, 혼란의 중심.
    ja: もはや制御不可能なほどに状況は混乱している
  d_main_45_08_49:
    speaker: "<Monologue>"
    en: The civilians are completely exposed.
    ko: 시민들은 그곳에 무방비 상태로 놓여졌다.
    ja: 群衆は無防備に逃げまどうのみであった
  d_main_45_08_50:
    speaker: "<Self>"
    en: How do we... stop this...?!
    ko: 이… 걸 어떻게…!
    ja: こんな状況…どうすれば…！
  d_main_45_08_51:
    speaker: anis_i_w
    en: C-calm down, everyone!
    ko: 다, 다들! 진정…!!
    ja: み、みんな！落ち着いて…！！
  d_main_45_08_52:
    speaker: "<Monologue>"
    en: They can't hear us.
    ko: 우리의 소리는 그들에게 들리지 않는다.
    ja: 私たちが声を張り上げても届かない
  d_main_45_08_53:
    speaker: "<Monologue>"
    en: Crystals block the path of those trying to flee.
    ko: 도망치는 사람 앞을 수정이 막아선다.
    ja: |-
      人々の逃げる先に
      クリスタルの壁が突き立っていく
  d_main_45_08_54:
    speaker: "<Monologue>"
    en: One person lifts up another who has fallen and runs, only to trip on a crystal.
    ko: 주저앉은 사람을 일으키고 달리는 사람이 수정에 걸려 넘어진다.
    ja: |-
      転んだ者を起こした誰かが
      クリスタルにつまづいて転んだ
  d_main_45_08_55:
    speaker: "<Monologue>"
    en: Another person lies face down screaming, while someone else desperately tries
      to drag them away.
    ko: |-
      엎드린 채 절규만 하고 있는 사람.
      그를 어떻게든 일으켜 세워 벗어나려 하는 사람.
    ja: |-
      うずくまって叫ぶ者をどうにか立たせ、
      一緒に逃げようとする者もいる
  d_main_45_08_56:
    speaker: "<Monologue>"
    en: Yet another shoves past others in a blind panic.
    ko: 허둥대는 사람을 밀치며 달려 나가는 사람.
    ja: |-
      あわてふためく人を押しのけ、
      我先にと走る者もいる
  d_main_45_08_57:
    speaker: "<Monologue>"
    en: Someone's arm gets covered in crystal, while the person next to them struggles
      desperately to pull them free.
    ko: |-
      수정에 팔이 집어삼켜지는 사람.
      그를 꺼내기 위해 안간힘을 쓰는 사람.
    ja: |-
      クリスタルに腕を飲み込まれた者と、
      それを力づくで引き抜こうとする者がいる
  d_main_45_08_58:
    speaker: "<Monologue>"
    en: Some run past those who have fallen without looking.
    ko: 쓰러진 사람을 못 본 척 달려가는 사람.
    ja: 倒れた者に見てみぬふりをして逃げる者
  d_main_45_08_59:
    speaker: "<Monologue>"
    en: Others hoist those who have fallen onto their backs and keep running.
    ko: 쓰러진 사람을 둘러업고 달려가는 사람.
    ja: 別の倒れた誰かを背負って走る者
  d_main_45_08_60:
    speaker: "<Monologue>"
    en: The sound of the expanding crystals mixes with the cacophony of screams,
    ko: 수정이 확장되는 소리와, 수많은 사람의 비명 소리가
    ja: クリスタルのきしむ音と、無数の人々の悲鳴が…
  d_main_45_08_61:
    speaker: "<Monologue>"
    en: echoing through the darkness.
    ko: 어두운 방주에 울려 퍼진다.
    ja: アークの闇の中にこだまする
  d_main_45_08_62:
    speaker: anis_i_w
    en: Argh! Damn it!
    ko: 으…! 제, 젠장!
    ja: ううっ…！こ、こんなっ！
  d_main_45_08_63:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 기잉-
    ja: ギィーン――
  d_main_45_08_64:
    speaker: "<Monologue>"
    en: The lighting unit that had been floating around Anis moves.
    ko: 아니스의 주위를 맴돌고 있던 부유체가 움직인다.
    ja: アニスの装備である浮遊体が動いた
  d_main_45_08_65:
    speaker: "<Monologue>"
    en: It rises above her head and casts a spotlight on her.
    ko: 아니스의 머리 위에 올라가, 스포트라이트를 비춘다.
    ja: |-
      浮遊体はアニスの頭上へ浮かび上がり
      アニスを照らすスポットライトとなった
  d_main_45_08_66:
    speaker: "<Monologue>"
    en: A speaker blares.
    ko: 스피커가 소리를 낸다.
    ja: もう一つの装備であるスピーカーから音が響く
  d_main_45_08_67:
    speaker: anis_i_w
    en: Everyone! Look over here!
    ko: 다들! 여길 봐!
    ja: みんな！こっちを見て！
  d_main_45_08_68:
    speaker: anis_i_w
    en: F-follow our instructions!
    ko: 우, 우리 지시를 따라줘!
    ja: わ、私たちの指示を聞いて！
  d_main_45_08_69:
    speaker: anis_i_w
    en: Don't panic, but get away from anything electronic!
    ko: 다들 당황하지 말고 전자기기가 있는 곳에서 멀어져야 해!
    ja: あわてずに電子機器の近くから離れて！
  d_main_45_08_70:
    speaker: "<Monologue>"
    en: Neither the light nor Anis's voice reaches the people.
    ko: 빛도, 목소리도 닿지 않는다.
    ja: しかし、光も声も届かない
  d_main_45_08_71:
    speaker: "<Monologue>"
    en: They remain trapped in the darkness.
    ko: 시민들은 여전히 어둠 속에서 혼란스러워한다.
    ja: 群衆はそれを見る余裕さえ失っている
  d_main_45_08_72:
    speaker: anis_i_w
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_45_08_73:
    speaker: neon_v_w
    en: Grrraaaahhh!
    ko: 으으랴아아아--!!
    ja: おりゃああああっ！！
  d_main_45_08_74:
    speaker: rapi_red
    en: Tch...! How are they expanding so fast?
    ko: 치잇…! 확장되는 속도가 말이 안 돼!
    ja: くっ…！膨張が速すぎる！
  d_main_45_08_75:
    speaker: rapi_red
    en: What kind of monster did you create, Enikk?!
    ko: 에닉…! 얼마나 괴물 같은 걸 만든 거야!
    ja: |-
      エニック…！
      なんでこんなものを作ったの！？
  d_main_45_08_76:
    speaker: enikk_op_l
    en: I am sorry.
    ko: 죄송합니다.
    ja: 申し訳ありません。
  d_main_45_08_77:
    speaker: dorothy
    en: Get away from there! There are crystals about to shoot up!
    ko: 그쪽에서 비켜요! 바닥에서 솟아올라요!
    ja: |-
      そこを離れてください！
      地中から伸びて来ています！
  d_main_45_08_78:
    speaker: rapi_red
    en: We're running out of ground to stand on! At this rate...!
    ko: |-
      점점 발 디딜 곳이 좁아지고 있어!
      이대로는…!
    ja: |-
      足場もなくなってきてる！
      このままじゃ…！
  d_main_45_08_79:
    speaker: "<Narration>"
    en: Anis shouts at the top of her lungs.
    ko: 아니스는 필사적으로 소리를 지르고 있다.
    ja: アニスは必死に声を張り上げた
  d_main_45_08_80:
    speaker: "<Narration>"
    en: The people don't hear her.
    ko: 목소리가 닿지 않는다.
    ja: それでも誰の耳にも入らない
  d_main_45_08_81:
    speaker: "<Narration>"
    en: She increases the brightness of the light.
    ko: 조명을 더욱 밝게 한다.
    ja: スポットライトの明度も増した
  d_main_45_08_82:
    speaker: "<Narration>"
    en: Still, no one turns to look.
    ko: 그 누구도 아니스를 보지 않는다.
    ja: やはりアニスに目を向ける者はいない
  d_main_45_08_83:
    speaker: "<Narration>"
    en: She surveys the chaos of the plaza.
    ko: 아니스는 혼란스러운 광장을 본다.
    ja: アニスは恐慌状態の広場を見渡した
  d_main_45_08_84:
    speaker: "<Narration>"
    en: She sees stars shining in the darkness.
    ko: 그곳에서 빛나는 별들을 본다.
    ja: そこでも星たちは輝いている
  d_main_45_08_85:
    speaker: "<Narration>"
    en: A man running with two people on his back, paying no mind to his own blood-soaked
      head.
    ko: |-
      피투성이가 된 머리를 신경 쓰지 않은 채,
      두 명을 업고 달리는 남자를 본다.
    ja: |-
      血まみれになった自分の頭を気にも留めず、
      2人を背負って走る男がいた
  d_main_45_08_86:
    speaker: "<Narration>"
    en: A woman picking up a crying child up from the ground and running, despite
      her limp.
    ko: 바닥에 주저앉아 울고 있는 아이를 어떻게든 일으켜 세워 손을 잡고 달리는 여자를 본다. 다리를 절고 있다.
    ja: |-
      自分の足を引きずりながら
      座り込んで泣く子どもを起こし、
      手をつないで走る女がいた
  d_main_45_08_87:
    speaker: "<Narration>"
    en: The ones shoving others aside and abandoning those who have fallen don't even
      register to Anis.
    ko: 남을 밀치고, 쓰러진 사람을 무시하는 모습은 눈에 들어오지 않는다.
    ja: |-
      他人を押しのけたり、
      倒れた者を無視するような者は
      もうその眼には入らない
  d_main_45_08_88:
    speaker: "<Narration>"
    en: She only sees the stars who're lighting the way for others.
    ko: 자신을 태워 가며 남을 비추는 별들만을 본다.
    ja: |-
      身を削り、他の誰かを
      照らす星たちだけに目を向けた
  d_main_45_08_89:
    speaker: rapi_red
    en: This is bad...! How far is it going to spread?!
    ko: 안 좋아…! 어디까지 확장되는 거야!
    ja: |-
      まずいわ…！
      収まる気配がない！
  d_main_45_08_90:
    speaker: neon_v_w
    en: Enikk! What's the status?
    ko: 에닉! 상태는요?
    ja: エニック！現在の状況は？
  d_main_45_08_91:
    speaker: enikk_op_l
    en: The crystals' expansion is accelerating. At this current rate, the entire
      Ark will be overtaken by E2 Crystals within ten hours.
    ko: |-
      확장 속도가 가속되고 있습니다.
      이 속도라면 10시간 이내에 방주 전역이 E2 크리스탈에 잠식됩니다.
    ja: |-
      拡大速度が増加しています。
      この速度では、10時間以内にアーク全域が
      クリスタルに浸食される予測です。
  d_main_45_08_92:
    speaker: dorothy
    en: "... What?!"
    ko: "…뭐라고요?"
    ja: "…何ですって？"
  d_main_45_08_93:
    speaker: rapi_red
    en: Sixo!
    ko: 식스오--!!
    ja: シックスオー！！
  d_main_45_08_94:
    speaker: "<Monologue>"
    en: This can't be happening...
    ko: 안돼.
    ja: ダメ…
  d_main_45_08_95:
    speaker: "<Monologue>"
    en: The Ark is breaking apart.
    ko: 방주가 부서진다.
    ja: アークが壊れちゃう
  d_main_45_08_96:
    speaker: "<Monologue>"
    en: If we don't stop it soon, there won't even be an Ark anymore.
    ko: 이대로 가다간 방주가 없어질 거야.
    ja: このままじゃアークがなくなっちゃう
  d_main_45_08_97:
    speaker: "<Monologue>"
    en: And after I finally figured things out...
    ko: 이제서야 알았는데.
    ja: やっと分かったのに
  d_main_45_08_98:
    speaker: "<Monologue>"
    en: I finally realized that the Ark isn't just full of terrible people.
    ko: 방주에 쓰레기들만 있는 게 아니라는 걸 알았는데.
    ja: |-
      アークはゴミばっかりじゃないって
      やっと分かったのに
  d_main_45_08_99:
    speaker: "<Monologue>"
    en: I don't want it to go away.
    ko: 이렇게 없어지는 건 싫어.
    ja: こんな終わりはイヤ
  d_main_45_08_100:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_101:
    speaker: "<Monologue>"
    en: I hate the Ark, I really do, but... I don't want it gone.
    ko: 나는 방주가 싫어. 너무 싫지만 없어지진 않았으면 좋겠어.
    ja: |-
      アークなんか嫌い。
      大っ嫌いだけど、なくなってほしくはない
  d_main_45_08_102:
    speaker: "<Monologue>"
    en: It hurt me, and even betrayed me,
    ko: 나한테 상처를 주고, 배신했지만.
    ja: 傷つけられたし、裏切られもしたけど
  d_main_45_08_103:
    speaker: "<Monologue>"
    en: but there were also a lot of days where I laughed and had fun.
    ko: 웃었던 날, 즐거웠던 날도 많았어.
    ja: 笑った日も、楽しかった日もたくさんある
  d_main_45_08_104:
    speaker: "<Monologue>"
    en: Those small memories became like stars to me.
    ko: 그 작은 기억들은 나에게 별이 되었다.
    ja: |-
      そういう小さな思い出が、
      私にとっての星になったから
  d_main_45_08_105:
    speaker: "<Monologue>"
    en: I found my own stars, all thanks to the people here.
    ko: 나의 별은 있었다. 너희들 덕분에.
    ja: |-
      私の星は見つかった。
      ここにいる人たちのおかげで
  d_main_45_08_106:
    speaker: "<Monologue>"
    en: It was those tiny stars that kept me going.
    ko: 그 작은 별을 보며, 나는 계속 살아갈 수 있었어.
    ja: |-
      私は小さな星たちを見ていたから、
      ここまで来られた
  d_main_45_08_107:
    speaker: "<Monologue>"
    en: I was able to push through the suffocating darkness and survive.
    ko: 지독했던 어둠을 꾸역꾸역 헤치면서 살아갈 수 있었어.
    ja: |-
      底の見えない暗闇を
      必死でかき分けながら生きてこられた
  d_main_45_08_108:
    speaker: "<Monologue>"
    en: It's because of all of you that I fell into despair, and it's because of all
      of you that I found hope.
    ko: |-
      너희 때문에 절망했고,
      너희 덕분에 희망을 가졌다.
    ja: |-
      あなたたちのせいで絶望して、
      あなたたちのおかげで希望を抱いた
  d_main_45_08_109:
    speaker: "<Monologue>"
    en: I guess I can't deny it...
    ko: 아아, 그래.
    ja: そう…だから…
  d_main_45_08_110:
    speaker: "<Monologue>"
    en: This festering trash heap they call the Ark, and everyone in it...
    ko: 이 빌어먹을 쓰레기 같은 방주.
    ja: |-
      この救いようのない、
      ゴミくずみたいなアークを…
  d_main_45_08_111:
    speaker: "<Monologue>"
    en: I love you all.
    ko: 난 너희를 사랑한다.
    ja: あなたたちを好きでいられる
  d_main_45_08_112:
    speaker: "<Narration>"
    en: A small light begins to shine...
    ko: 반짝.
    ja: ピカッ――
  d_main_45_08_113:
    speaker: "<Monologue>"
    en: So...
    ko: 그러니.
    ja: だから…
  d_main_45_08_114:
    speaker: "<Monologue>"
    en: Look at me.
    ko: 나를 봐.
    ja: 私を見て
  d_main_45_08_115:
    speaker: "<Narration>"
    en: It grows brighter...
    ko: 반짝.
    ja: ピカッ――
  d_main_45_08_116:
    speaker: "<Monologue>"
    en: Watch me shine.
    ko: 빛나는 나를 봐.
    ja: 輝く私を見て
  d_main_45_08_117:
    speaker: "<Monologue>"
    en: Look at me and hold onto hope.
    ko: 나를 보고 희망을 가져.
    ja: 私の姿を見て、希望を持って
  d_main_45_08_118:
    speaker: "<Narration>"
    en: And brighter...
    ko: 반짝.
    ja: ピカッ――
  d_main_45_08_119:
    speaker: "<Monologue>"
    en: I did it before, and now you can too!
    ko: 내가 그랬듯이, 너희도!
    ja: 私がそうしたみたいに、あなたたちも！
  d_main_45_08_120:
    speaker: "<Monologue>"
    en: The Ark grows brighter.
    ko: 방주가 밝아졌다.
    ja: アークが突然明るくなった
  d_main_45_08_121:
    speaker: "<Monologue>"
    en: Light pours out from Anis's body.
    ko: "…아니스의 몸에서 빛이 쏟아져 나온다."
    ja: "…アニスの身体から光があふれだしている"
  d_main_45_08_122:
    speaker: anis_i_w
    en: Aaahhh...!
    ko: 으으으으으---!!
    ja: ううううっ！！
  d_main_45_08_123:
    speaker: "<Narration>"
    en: "*Rumble, rumble!*"
    ko: 카가가가가각---!!
    ja: ガリガリガリガリ――！！
  d_main_45_08_124:
    speaker: "<Monologue>"
    en: A trail of crystals begins to bolt toward Anis.
    ko: 수정들이 아니스를 향해 달린다.
    ja: |-
      まるで襲い掛かるような勢いで、
      アニスめがけてクリスタルが伸びた
  d_main_45_08_125:
    speaker: "<Monologue>"
    en: More follow suit, until all the crystals in the area are headed for her, attracted
      to the sudden surge of energy.
    ko: |-
      갑작스럽게 나타난 고에너지를 흡수하기 위해,
      인근의 모든 수정들이 아니스를 향해 뻗어나간다.
    ja: |-
      突然出現した高エネルギー体を吸収しようと、
      周辺のクリスタルが全て
      アニスに引き寄せられたのだ
  d_main_45_08_126:
    speaker: "<Monologue>"
    en: However, they quickly shatter and dissolve.
    ko: 하지만 곧, 바스러지며 사라진다.
    ja: だが、それはたちまち塵となって消滅した
  d_main_45_08_127:
    speaker: "<Monologue>"
    en: The particles from the shattered crystal float over to Anis.
    ko: 바스러진 수정에게서 흩날리던 입자가 아니스에게로 향한다.
    ja: |-
      砕け散ったクリスタルの残した粒子が
      アニスに向かって舞った
  d_main_45_08_128:
    speaker: "<Monologue>"
    en: She begins to shine even brighter.
    ko: 아니스가 더욱 밝아진다.
    ja: |-
      粒子が吸い寄せられると、
      アニスはさらに輝きを増した
  d_main_45_08_129:
    speaker: enikk_op_l
    en: "... I'm reassessing the situation."
    ko: "…상황 파악 중."
    ja: "…状況分析中…"
  d_main_45_08_130:
    speaker: enikk_op_l
    en: I've detected a change in all the E2 Crystals in the Ark.
    ko: 방주 내의 모든 E2 크리스탈이 반응.
    ja: アーク全域のE2クリスタルに変化を確認。
  d_main_45_08_131:
    speaker: enikk_op_l
    en: Their energy is being drained by Anis.
    ko: 아니스에게 에너지를 빼앗기고 있습니다.
    ja: アニスがエネルギーを奪取しているようです。
  d_main_45_08_132:
    speaker: "<Self>"
    en: "... What?"
    ko: "…뭐라고…?"
    ja: "…何だと…？"
  d_main_45_08_133:
    speaker: enikk_op_l
    en: The E2 Crystals are rapidly being neutralized.
    ko: E2 크리스탈. 빠른 속도로 무력화 중.
    ja: E2クリスタル、急速に縮小中。
  d_main_45_08_134:
    speaker: "<Monologue>"
    en: Countless rays of light embroider the Ark's sky,
    ko: 수많은 빛이 방주의 하늘을 수놓는다.
    ja: 無数の光がアークの空に浮かび上がり…
  d_main_45_08_135:
    speaker: "<Monologue>"
    en: and then all shoot towards Anis.
    ko: 그 빛은, 모두 아니스에게로 향한다.
    ja: アニスに引き寄せられている
  d_main_45_08_136:
    speaker: "<Monologue>"
    en: Her body turns white as it continues to gather light.
    ko: 아니스의 몸이 새하얗게 바뀔 정도로, 빛이 모여든다.
    ja: アニスの体は真っ白に輝き始めていた
  d_main_45_08_137:
    speaker: "<Monologue>"
    en: The surroundings brighten until it feels like midday.
    ko: 주위가 밝다. 마치 대낮 같다.
    ja: 気づけば、まるで真昼のように明るい
  d_main_45_08_138:
    speaker: "<Monologue>"
    en: I glance around.
    ko: 얼떨결에 주위를 둘러본다.
    ja: 思わずあたりを見回した
  d_main_45_08_139:
    speaker: "<Monologue>"
    en: Everyone is looking at Anis.
    ko: 모두가 아니스를 바라보고 있다.
    ja: 誰もがアニスに視線を向けていた
  d_main_45_08_140:
    speaker: "<Self>"
    en: Rapi! Dorothy!
    ko: 라피! 도로시!
    ja: ラピ！ドロシー！
  d_main_45_08_141:
    speaker: "<Self>"
    en: Evacuate the civilians!
    ko: 시민들을 피난시켜줘!
    ja: 今のうちに民間人の避難を！
  d_main_45_08_142:
    speaker: rapi_red
    en: "...! Roger that!"
    ko: "!! 라져!"
    ja: "！！ラジャー！"
  d_main_45_08_143:
    speaker: dorothy
    en: What? We should deal with that as quickly as...
    ko: 무슨 소릴. 조금이라도 빠르게 저걸….
    ja: |-
      そのような場合ですか？
      今は一刻も早く…
  d_main_45_08_144:
    speaker: rapi_red
    en: Let's go! Hurry!
    ko: 가자! 빨리!
    ja: いいから！早く！
  d_main_45_08_145:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "……！！"
  d_main_45_08_146:
    speaker: "<Monologue>"
    en: Rapi and Dorothy quickly get to work evacuating nearby civilians.
    ko: 라피와 도로시가 기동력을 살려 인근에 있던 시민들을 빠르게 옮기기 시작한다.
    ja: |-
      ラピとドロシーは機動力を存分に活かし、
      周辺の人々の避難誘導を始めた
  d_main_45_08_147:
    speaker: "<Monologue>"
    en: I turn back to look at Endless.
    ko: 시선을 돌려 엔드리스를 바라본다.
    ja: エンドレスに目を向ける
  d_main_45_08_148:
    speaker: "<Monologue>"
    en: She is still trapped in the crystal.
    ko: 엔드리스는 아직 수정안에 갇혀있다.
    ja: |-
      エンドレスのボディは
      クリスタルの中にとらわれたままだ
  d_main_45_08_149:
    speaker: "<Self>"
    en: Firepower! Firepower!
    ko: 화력 화력!
    ja: 火力、火力だ！
  d_main_45_08_150:
    speaker: neon_v_w
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_08_151:
    speaker: neon_v_w
    en: Firepower! Firepower!
    ko: 화력 화력!!
    ja: 火力、火力！！
  d_main_45_08_152:
    speaker: "<Monologue>"
    en: Neon steadies herself.
    ko: 네온이 자세를 잡는다.
    ja: ネオンが構え直した
  d_main_45_08_153:
    speaker: "<Self>"
    en: Firepower! Firepower! Firepower!
    ko: 화력! 화력 화력!
    ja: 火力！火力！火力！
  d_main_45_08_154:
    speaker: neon_v_w
    en: You want me to really let loose now that the area's been cleared, right? I
      got you!
    ko: |-
      주위에 사람이 없으니 맘껏 쏟아부으라는 말씀이시죠?
      알겠습니다!
    ja: |-
      周りに人がいなくなったから、
      好きなだけ火力を上げていいってことですね？
      分かりました！
  d_main_45_08_155:
    speaker: "<Narration>"
    en: "*Boom! Boom! Boom!*"
    ko: 쾅! 쾅! 쾅! 쾅!
    ja: ドガッ！ドガッ！ドガッ！ドガッ！
  d_main_45_08_156:
    speaker: "<Monologue>"
    en: Neon keeps firing at Endless.
    ko: 네온이 엔드리스를 향해 사격을 계속한다.
    ja: エンドレスを狙い、ネオンが射撃を加えた
  d_main_45_08_157:
    speaker: "<Monologue>"
    en: The explosions obliterate the crystals, revealing Endless beneath.
    ko: 폭발과 함께 모든 수정이 부서지고, 엔드리스의 모습이 드러난다.
    ja: |-
      爆発と共にクリスタルが砕け、
      エンドレスのボディがむき出しになった
  d_main_45_08_158:
    speaker: endless
    en: How...?
    ko: 무슨….
    ja: なぜ…
  d_main_45_08_159:
    speaker: "<Monologue>"
    en: Endless's shocked expression is swallowed by the next blast.
    ko: 엔드리스의 경악에 빠진 표정은, 곧 폭발에 휘말린다.
    ja: |-
      驚くエンドレスの顔は、
      すぐに爆風の中へ消えた
  d_main_45_08_160:
    speaker: "<Monologue>"
    en: She is hurled through the air, battered around by one explosion after another.
    ko: 폭발 속에서 엔드리스가 이리저리 휘청인다.
    ja: 爆発に飲まれ、エンドレスのボディが踊る
  d_main_45_08_161:
    speaker: "<Monologue>"
    en: The blasts continue in such quick succession that she doesn't even have time
      to raise her hand and form a light projectile.
    ko: |-
      손을 뻗어 광탄을 만들어낼 여유조차 없다.
      폭발의 연속이다.
    ja: |-
      絶え間ない爆発は、
      エンドレスに光弾を生成する隙さえ与えない
  d_main_45_08_162:
    speaker: endless
    en: How is this possible... with no recoil?!
    ko: 이런 걸…! 반동도 없이…!
    ja: こんな連射を…無反動で…！？
  d_main_45_08_163:
    speaker: neon_v_w
    en: The answer's obvious, isn't it? It's one of the wonders of having a healthy
      body!
    ko: 그거야 당연히! 건강한 몸이기 때문이죠!
    ja: 当然です！私は健康体ですから！
  d_main_45_08_164:
    speaker: endless
    en: That's absurd...!
    ko: 헛소리를…!
    ja: バカげたことを…！
  d_main_45_08_165:
    speaker: "<Monologue>"
    en: Endless is consumed by explosions.
    ko: 엔드리스가 폭발에 집어삼켜진다.
    ja: 爆風が嵐となって襲いかかる
  d_main_45_08_166:
    speaker: "<Monologue>"
    en: Like driftwood caught in a whirlpool, she is tossed around helplessly.
    ko: 소용돌이에 휘말린 나뭇조각처럼, 무력하게 흔들린다.
    ja: |-
      まるで竜巻に巻き込まれた木の枝のように、
      エンドレスは力なく吹き飛ばされ続けた
  d_main_45_08_167:
    speaker: endless
    en: Aghhh...! Not here...!
    ko: 으윽…! 이런… 곳에서…!
    ja: ぐっ…！こんな…ところで…！
  d_main_45_08_168:
    speaker: endless
    en: Not... in this darkness...!
    ko: 이렇게…! 어두운 곳에서…!
    ja: こんな…！暗い場所で…！
  d_main_45_08_169:
    speaker: endless
    en: I won't allow myself to fade away!
    ko: 사라질 수는 없습니다!
    ja: 消えるわけには！
  d_main_45_08_170:
    speaker: "<Narration>"
    en: Suddenly, the ground starts to rise up.
    ko: 쿠드드득-!
    ja: ゴゴゴゴ――！
  d_main_45_08_171:
    speaker: "<Monologue>"
    en: It forms a wall in front of Endless.
    ko: 갑자기 바닥이 들어 올려지며 엔드리스의 앞에 벽을 만든다.
    ja: |-
      何の前触れもなくせり上がった地面が、
      エンドレスの前に壁を作った
  d_main_45_08_172:
    speaker: "<Monologue>"
    en: The wall is destroyed instantly by Neon's blasts, but Endless is able to distance
      herself during that brief gap.
    ko: |-
      아주 잠깐 폭발을 막아내고 부서졌고,
      그 틈을 타 엔드리스가 거리를 벌린다.
    ja: |-
      壁は一瞬だけ爆風を防いで崩れたが、
      エンドレスが距離を取るには
      十分な時間を生んだ
  d_main_45_08_173:
    speaker: neon_v_w
    en: What...? Why did the ground suddenly move?
    ko: 오잉? 땅이 왜 갑자기….
    ja: おや？どうして地面が急に…
  d_main_45_08_174:
    speaker: enikk_op_l
    en: This is an emergency.
    ko: 긴급 사태입니다.
    ja: 緊急事態です。
  d_main_45_08_175:
    speaker: enikk_op_l
    en: Sixo has unlocked a hidden function in Endless.
    ko: 식스오가 엔드리스의 숨겨진 기능을 언락했습니다.
    ja: |-
      封印していたエンドレスの機能を
      シックスオーに解放されました。
  d_main_45_08_176:
    speaker: neon_v_w
    en: What?! What is it?
    ko: 헉! 뭔데요?
    ja: なんと！どのような？
  d_main_45_08_177:
    speaker: enikk_op_l
    en: Gravity control.
    ko: 중력 제어입니다.
    ja: 重力制御です。
  d_main_45_08_178:
    speaker: neon_v_w
    en: "... What?"
    ko: "…예?"
    ja: "…はい？"
  d_main_45_08_179:
    speaker: "<Narration>"
    en: Further from the main site,
    ko: 현장에서 떨어진 곳.
    ja: 戦場から少し離れた場所で…
  d_main_45_08_180:
    speaker: "<Narration>"
    en: Rapi and Dorothy are utilizing their extreme mobility to evacuate the civilians.
    ko: 라피와 도로시는 기동력을 살려 시민들을 피난시키고 있었다.
    ja: |-
      ラピとドロシーは機動力を活かし、
      民間人の避難を進めていた
  d_main_45_08_181:
    speaker: rapi_red
    en: How many are left?
    ko: 얼마나 남았어?
    ja: あとどれくらい？
  d_main_45_08_182:
    speaker: dorothy
    en: About half.
    ko: 절반 정도 남았어요.
    ja: まだ半分ほどです。
  d_main_45_08_183:
    speaker: rapi_red
    en: Ugh...! We need to move faster!
    ko: 칫…! 빠르게 움직이자!
    ja: くっ…！ペースを上げないと！
  d_main_45_08_184:
    speaker: dorothy
    en: Okay.
    ko: 알겠어요.
    ja: そうですね。
  d_main_45_08_185:
    speaker: "<Narration>"
    en: Rapi thrusts off the ground using Seven Dwarves Zero.
    ko: 라피가 세븐스 드워프를 전개해서 날아간다.
    ja: |-
      ラピがセブンスドワーフゼロを構え、
      飛翔する
  d_main_45_08_186:
    speaker: "<Narration>"
    en: Just as Dorothy prepares to follow, someone taps her shoulder.
    ko: 그 뒤를 쫓기 위해 도약을 준비하면 도로시의 어깨를 누군가가 두드린다.
    ja: 続こうとしたドロシーの肩を、誰かが叩いた
  d_main_45_08_187:
    speaker: dorothy
    en: "...?"
    ko: "…??"
    ja: "……？？"
  d_main_45_08_188:
    speaker: fearfulcitizen
    en: Y-you're an angel, aren't you?
    ko: 처, 천사님 맞으시죠?
    ja: て、天使さんですよね？
  d_main_45_08_189:
    speaker: dorothy
    en: An angel...?
    ko: "…천사요?"
    ja: "…天使？"
  d_main_45_08_190:
    speaker: fearfulcitizen
    en: Y-yeah. During the terrorist attack on the Ark, you're the one who descended
      from the sky.
    ko: 예, 예. 방주 테러 때, 하늘에서 내려온….
    ja: |-
      は、はい。
      アークテロ事件の時、空から降りてきた…
  d_main_45_08_191:
    speaker: dorothy
    en: "... Yeah, that was me, but I'm no angel."
    ko: "…예. 맞아요. 천사는 아니지만요."
    ja: "…ええ。確かに私ですが、天使ではありません。"
  d_main_45_08_192:
    speaker: fearfulcitizen
    en: Th-thank you! You saved us back then...
    ko: |-
      가, 감사합니다.
      그때도 저희 목숨을 구해주시고….
    ja: |-
      あ、ありがとうございます。
      あの時、僕たちの命を救ってくれて…
  d_main_45_08_193:
    speaker: fearfulcitizen
    en: and now you've saved us again...
    ko: 이번에도, 이렇게….
    ja: それに今回も、助けられて…
  d_main_45_08_194:
    speaker: fearfulcitizen
    en: I wanted to make sure I thanked you this time.
    ko: 감사하다는 말씀을 꼭 드리고 싶었어요, 예.
    ja: どうしても感謝をお伝えしたかったんです。
  d_main_45_08_195:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_196:
    speaker: dorothy
    en: Don't mention it.
    ko: 별말씀을요.
    ja: どういたしまして。
  d_main_45_08_197:
    speaker: fearfulcitizen
    en: Oh, I'm sorry. I didn't mean to hold you up.
    ko: 아아. 죄송합니다. 한시가 급할 텐데, 제가 시간을….
    ja: |-
      ああっ、申し訳ありません。
      一刻を争ってる時に、引き留めてしまって…
  d_main_45_08_198:
    speaker: fearfulcitizen
    en: Please, go. The others need your help too.
    ko: |-
      어서. 어서 가세요.
      다른 사람들도 잘 부탁드립니다.
    ja: |-
      ど、どうぞ行ってください。
      他の皆さんのことも助けてあげてください。
  d_main_45_08_199:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_200:
    speaker: dorothy
    en: Sure. Leave it to me.
    ko: 예. 맡겨두세요.
    ja: ええ。お任せください。
  d_main_45_08_201:
    speaker: "<Narration>"
    en: Dorothy launches into the air.
    ko: 도로시가 날아간다.
    ja: ドロシーはその場を飛び去った
  d_main_45_08_202:
    speaker: endless
    en: Huh... I didn't expect you to implant such a function into a Nikke.
    ko: 아아. 니케에게 이런 기능까지 심어놓았을 줄이야.
    ja: |-
      ああ…
      こんな能力まで隠されていたとは。
  d_main_45_08_203:
    speaker: endless
    en: You really are something else, Enikk.
    ko: 역시 당신은 대단하네요. 에닉.
    ja: やはり恐るべき存在です…エニック。
  d_main_45_08_204:
    speaker: "<Monologue>"
    en: Endless shoots upward at high speed.
    ko: 엔드리스가 빠르게 공중으로 솟아오른다.
    ja: エンドレスは勢いよく上空へ飛び上がり…
  d_main_45_08_205:
    speaker: "<Monologue>"
    en: She spreads both arms.
    ko: 양손을 펼친다.
    ja: 両手を広げた
  d_main_45_08_206:
    speaker: "<Narration>"
    en: A rumbling sound can be heard below.
    ko: 콰드드드드득---!!
    ja: ゴゴゴゴゴ――！！
  d_main_45_08_207:
    speaker: "<Monologue>"
    en: "... The ground lifts again."
    ko: "…지면이 들어 올려진다."
    ja: "…路面がうねり、隆起する"
  d_main_45_08_208:
    speaker: "<Monologue>"
    en: Chunks of buildings tear free and rise into the air.
    ko: 건물의 일부가 뜯어지며, 공중으로 솟는다.
    ja: 建築物が引きちぎられ、断片が空へ舞い上がった
  d_main_45_08_209:
    speaker: "<Monologue>"
    en: The fragments gather and fuse into a monumental floating mass.
    ko: 수많은 파편들이 한 곳에 뭉쳐져, 거대한 덩어리를 만든다.
    ja: 無数の断片が集まり、巨大な塊と化した
  d_main_45_08_210:
    speaker: "<Monologue>"
    en: The colossal structure floating in the air looks entirely surreal.
    ko: |-
      공중에 떠 있는 거대한 건조물의 덩어리.
      현실감이 마비되는 느낌이다.
    ja: |-
      宙に浮く引き裂かれた建造物の巨大な塊は
      あまりにも現実離れしているように見えた
  d_main_45_08_211:
    speaker: neon_v_w
    en: Uh, isn't this all getting a bit too sci-fi?
    ko: 이, 이거 너무 SF 아닌가요?
    ja: ちょ、ちょっとSFがすぎませんか？
  d_main_45_08_212:
    speaker: enikk_op_l
    en: That functionality was provided by Elysion for testing. It was not anticipated
      that Sixo would unlock it.
    ko: |-
      엘리시온에게 제공 받은 시험 운용 중인 기능입니다.
      식스오가 해당 기능을 언락한 것은 예상 밖입니다.
    ja: |-
      エリシオンに提供された試験中の機能です。
      シックスオーにアンロックされることは
      想定していませんでした。
  d_main_45_08_213:
    speaker: neon_v_w
    en: Ingrid's always going on about being tactical, and yet here she is messing
      with sci-fi gravity tech?! I'm disappointed in her!
    ko: |-
      택티컬 택티컬 하면서 중력 같은 SF에 손을 대다니!
      실망이에요 사장님!
    ja: |-
      あれだけタクティカルを推しておいて
      こんなSF能力に手をつけていたなんて！
      見損ないましたよ、社長！
  d_main_45_08_214:
    speaker: "<Self>"
    en: Same!
    ko: 동감이야!
    ja: まったくだな！
  d_main_45_08_215:
    speaker: endless
    en: Summoning unforeseen strength when cornered...
    ko: 궁지에 몰렸을 때, 새로운 능력을 발현하는 것.
    ja: 窮地に追い込まれた時、新たな能力に目覚める…
  d_main_45_08_216:
    speaker: endless
    en: Would you not consider that a very human response? Hehe.
    ko: 후후. 인간미의 극치라고 생각하지 않나요?
    ja: |-
      くくっ。いかにも人間らしい
      展開だと思いませんか？
  d_main_45_08_217:
    speaker: "<Monologue>"
    en: Endless extends her hand.
    ko: 엔드리스가 손을 내뻗는다.
    ja: エンドレスが手を伸ばした
  d_main_45_08_218:
    speaker: "<Monologue>"
    en: The floating mass starting falling toward us.
    ko: 거대한 덩어리가, 우릴 향해 낙하한다.
    ja: 巨大な塊が、私たちめがけて落下を始めた
  d_main_45_08_219:
    speaker: endless
    en: I will crush you all.
    ko: 모두 부숴드리죠.
    ja: すべて壊して差し上げます。
  d_main_45_08_220:
    speaker: enikk_op_l
    en: 'Warning: that falling landmass will strike a critical blow to the Ark should
      it make contact.'
    ko: 경고. 해당 파편 덩어리 낙하 시 방주에 치명적인 피해를 입힙니다.
    ja: |-
      危機的状況です。
      このままアークへの衝突を許せば
      致命的な被害が発生します。
  d_main_45_08_221:
    speaker: neon_v_w
    en: Master!
    ko: 스승님!
    ja: 師匠！
  d_main_45_08_222:
    speaker: "<Self>"
    en: Engage in a frontal assault, Neo-Neon!
    ko: 정면 돌파!! 네오-네온!!
    ja: 正面からぶつけるしかない！ネオ・ネオン！！
  d_main_45_08_223:
    speaker: neon_v_w
    en: Neo-Neon, moving out!
    ko: 네오-네온!! 갑니다!!
    ja: ネオ・ネオン！！行きます！！
  d_main_45_08_224:
    speaker: "<Monologue>"
    en: Neon showers the falling mass with bullets.
    ko: 낙하하는 덩어리를 향해 네온이 탄환을 쏟아붓는다.
    ja: 落下する塊に向かい、ネオンが銃撃した
  d_main_45_08_225:
    speaker: "<Monologue>"
    en: The edges are shaved off,
    ko: 거대한 덩어리의 끝부분이 깎여나간다.
    ja: 塊の先端が削り取られ…
  d_main_45_08_226:
    speaker: "<Monologue>"
    en: and slowly but surely, she forces it back.
    ko: 그리고 서서히, 밀어붙인다.
    ja: 動きがわずかに押しとどめられた
  d_main_45_08_227:
    speaker: endless
    en: "... You can't be serious."
    ko: "…웃기지도 않는군요."
    ja: "…笑う気にもなりませんね。"
  d_main_45_08_228:
    speaker: "<Monologue>"
    en: The ground and buildings nearby are torn up and added to the giant mass.
    ko: 인근의 지면과 건물이 뜯겨나간 후, 거대한 덩어리에 보강된다.
    ja: |-
      さらに辺りの地面や建築物が引き剥がされ、
      巨大な塊に融合する
  d_main_45_08_229:
    speaker: "<Monologue>"
    en: However, it still fails to advance even an inch.
    ko: 하지만 조금도 전진하지 못한다.
    ja: だが、塊は勢いを失い、前進を止めた
  d_main_45_08_230:
    speaker: "<Monologue>"
    en: A golden ring flares in Neon's eyes.
    ko: 네온의 눈에 황금색 륜이 발광한다.
    ja: ネオンの目に輝く黄金の輪が宿っている
  d_main_45_08_231:
    speaker: "<Monologue>"
    en: Gold light radiates both from her body and her gun.
    ko: 총과 몸에서 금색이 발광한다.
    ja: |-
      その瞳と同じ色の光が
      銃とボディから放たれていた
  d_main_45_08_232:
    speaker: neon_v_w
    en: Firepower, firepower, firepower, firepower!!
    ko: 화력 화력 화력 화력!!
    ja: 火力、火力、火力、火力！！
  d_main_45_08_233:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat!*"
    ko: 콰과과과광--!!
    ja: ドガガガガ――！！
  d_main_45_08_234:
    speaker: endless
    en: Her firing speed is... increasing? As is her power...!
    ko: |-
      더… 빨라지고 있다고요…?
      위력도 더…!
    ja: |-
      連射速度を…上げた…？
      威力も上昇している…！
  d_main_45_08_235:
    speaker: endless
    en: Those golden particles...! Are they some kind of catalyst?
    ko: |-
      저 황금색 입자…!
      뭔가의 촉매인가요?
    ja: |-
      その粒子は…！
      何かの触媒でしょうか？
  d_main_45_08_236:
    speaker: neon_v_w
    en: They're firepower particles!
    ko: 화력 입자예요!
    ja: 火力の粒子です！
  d_main_45_08_237:
    speaker: endless
    en: Don't lie to me.
    ko: 거짓말하지 마시죠.
    ja: でたらめなのは分かりますよ。
  d_main_45_08_238:
    speaker: neon_v_w
    en: My bad!
    ko: 죄송!
    ja: それは失礼！
  d_main_45_08_239:
    speaker: anis_i_w
    en: Agh!
    ko: 으으으윽---!!
    ja: くうううっ…！
  d_main_45_08_240:
    speaker: anis_i_w
    en: Hot, hot!
    ko: 뜨, 뜨거…!
    ja: あっ、熱い…！
  d_main_45_08_241:
    speaker: anis_i_w
    en: Ow, ow, ow! I turned off my pain sensors, but it still hurts!
    ko: 아, 아파! 아파아…! 통각 센서를 껐는데도, 아파!
    ja: |-
      いっ、いたっ！いたた…！
      痛覚センサーは切ったのに…！
  d_main_45_08_242:
    speaker: anis_i_w
    en: Wh-whoa, I've never seen that warning display pop up! How hot am I...?!
    ko: |-
      우, 우와! 경고 디스플레이 뜨는 거 처음 봐!
      며, 몇 도야 이게?
    ja: |-
      え、ええっ！？警告表示なんて
      初めてなんだけど！？
      い、今、何度ぐらい？
  d_main_45_08_243:
    speaker: enikk_op_l
    en: E2 Crystals across the Ark continue to be neutralized.
    ko: 방주 전역의 E2 크리스탈. 지속적으로 무력화 중.
    ja: |-
      アーク全域のE2クリスタルは
      引き続き抑制されています。
  d_main_45_08_244:
    speaker: enikk_op_l
    en: Anis, your body temperature has far exceeded the acceptable limit. I recommend
      immediately ceasing what you are doing.
    ko: |-
      아니스. 바디의 온도가 한계점을 아득히 돌파했습니다.
      해당 행위를 중지할 것을 권장합니다.
    ja: |-
      アニス、ボディの温度が
      限界値を大幅に超過しています。
      能力の停止を推奨します。
  d_main_45_08_245:
    speaker: anis_i_w
    en: What about... the people...?!
    ko: 사람… 들은…!?
    ja: みんなの…避難は…！？
  d_main_45_08_246:
    speaker: enikk_op_l
    en: Rapi and Dorothy have evacuated most civilians from this area.
    ko: 라피와 도로시가 현 지역에서 대부분 피난시켰습니다.
    ja: ラピとドロシーがほぼ完了させました。
  d_main_45_08_247:
    speaker: anis_i_w
    en: Are... they... watching me?
    ko: 나… 보고… 있어…?
    ja: 私…見られて…る…？
  d_main_45_08_248:
    speaker: enikk_op_l
    en: Yes. The citizens here are currently focused on you.
    ko: 그렇습니다. 해당 시민들은 현재 아니스를 주시하고 있습니다.
    ja: |-
      そうです。
      避難民の視線はあなたの方向に集中しています。
  d_main_45_08_249:
    speaker: enikk_op_l
    en: Citizens in other locations around the Ark are also looking in this direction.
    ko: 또한, 방주 내의 모든 시민들이 현 방향을 주시하고 있습니다.
    ja: |-
      いいえ、正確にはアークの住民全てに
      注視されています。
  d_main_45_08_250:
    speaker: enikk_op_l
    en: This is because you are the only light source in the Ark at present.
    ko: 아니스가 현 상황에서 방주의 유일한 광원이기 때문입니다.
    ja: 現在のアークにおいて、唯一の光源ですから。
  d_main_45_08_251:
    speaker: anis_i_w
    en: In that case... I can't... stop...!
    ko: 그럼…! 그만둘 수 없… 지…!
    ja: |-
      そんなこと言われたら…！
      やめられなく…なるでしょ…！
  d_main_45_08_252:
    speaker: enikk_op_l
    en: Your core has begun to melt. It will be completely melted in one minute.
    ko: 코어 융해 개시. 1분 후 완전 융해됩니다.
    ja: |-
      コアの融解を確認。
      完全融解まで推定1分。
  d_main_45_08_253:
    speaker: anis_i_w
    en: What about the crystals...?
    ko: 수정… 은…?
    ja: クリスタル…は…？
  d_main_45_08_254:
    speaker: enikk_op_l
    en: Analyzing...
    ko: 확인 중.
    ja: 確認中です…
  d_main_45_08_255:
    speaker: enikk_op_l
    en: I can confirm that all E2 Crystals across the Ark have been neutralized.
    ko: 방주 전역의 E2 크리스탈. 전부 무력화 확인.
    ja: |-
      アーク全域のE2クリスタルは、
      すでに無力化しています。
  d_main_45_08_256:
    speaker: enikk_op_l
    en: Cease what you are doing, Anis.
    ko: 아니스. 해당 행위를 중지하십시오.
    ja: アニス。ただちに能力使用を停止してください。
  d_main_45_08_257:
    speaker: "<Self>"
    en: Anis! Stop!
    ko: 아니스! 그만!
    ja: アニス！もういい！
  d_main_45_08_258:
    speaker: anis_i_w
    en: Heheh... Sorry, but I don't know... how to make it stop...
    ko: |-
      헤, 헤헤….
      미안. 나 그런 거 할 줄… 몰라….
    ja: |-
      えへへ…悪いけど…
      私、止め方…分からなくて…
  d_main_45_08_259:
    speaker: "<Monologue>"
    en: Anis's body is completely white. Her surroundings start to sway.
    ko: 아니스의 몸이 새하얗다. 주위의 풍경이 일렁인다.
    ja: |-
      アニスのボディは色を失い、
      その周囲が揺らめいて見える
  d_main_45_08_260:
    speaker: anis_i_w
    en: At least... I know...
    ko: 그래도… 이 정도면….
    ja: でも…これなら…
  d_main_45_08_261:
    speaker: anis_i_w
    en: I've done enough...
    ko: 할 만큼 했다.
    ja: やれるだけ…やったよね…
  d_main_45_08_262:
    speaker: "<Narration>"
    en: No, you're not done yet.
    ko: 아니야. 더 굴러야지.
    ja: ううん。もう少し、頑張って――
  d_main_45_08_263:
    speaker: anis_i_w
    en: "...?!"
    ko: "…!?"
    ja: "…！？"
  d_main_45_08_264:
    speaker: enikk_op_l
    en: "... The core meltdown has halted. Temperatures have stabilized."
    ko: "…융해 정지. 온도 안정화."
    ja: "…コアの融解が停止、温度安定…"
  d_main_45_08_265:
    speaker: enikk_op_l
    en: 'Correction: all energy is being transferred to the expansive armament Star.'
    ko: 정정. 모든 에너지가 확장 무장 스타로 전이.
    ja: |-
      分析修正。
      拡張武装スターにエネルギー転移。
  d_main_45_08_266:
    speaker: enikk_op_l
    en: The expansive armament Star is being disassembled and reallocated.
    ko: 확장 무장 스타. 분해 후 재배치 중.
    ja: 拡張武装スター、構成分解および再配置進行中。
  d_main_45_08_267:
    speaker: enikk_op_l
    en: Some portions are adhering to the damaged core. Integration is in progress.
    ko: 또한, 일부는 손상된 코어에 흡착. 코어와 일체화.
    ja: |-
      コア損傷部に一部吸着。
      コアとの一体化を確認。
  d_main_45_08_268:
    speaker: anis_i_w
    en: Wh-what's going on?
    ko: 뭐, 뭐야. 무슨 일인데.
    ja: なっ、何？何が起こってるの？
  d_main_45_08_269:
    speaker: enikk_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_270:
    speaker: enikk_op_l
    en: I do not know.
    ko: 모르겠습니다.
    ja: 分析不能です。
  d_main_45_08_271:
    speaker: "<Monologue>"
    en: A burst of light erupts from Anis's body.
    ko: 아니스의 몸에서 빛이 터져 나왔다.
    ja: アニスのボディから光があふれ出した
  d_main_45_08_272:
    speaker: anis_i_s
    en: Huh...?
    ko: 어… 뭐지.
    ja: え…何、これ…
  d_main_45_08_273:
    speaker: anis_i_s
    en: Suddenly I feel really light.
    ko: 몸이 엄청 가벼워.
    ja: 体が…すごく軽い…
  d_main_45_08_274:
    speaker: anis_i_s
    en: And what're these clothes? Are they even clothes? I feel like I'm soaking
      in a lukewarm bath.
    ko: 이 옷은 또 뭐야. 옷 맞나? 미지근한 욕조 안에 들어가 있는 것 같은데.
    ja: |-
      これは…服？？スーツ？
      ぬるま湯みたいな温かさを感じるけど…
  d_main_45_08_275:
    speaker: "<Narration>"
    en: Anis turns to look at Endless and Neon.
    ko: 아니스가 시선을 돌려 엔드리스와 네온을 본다.
    ja: |-
      アニスはエンドレスとネオンの戦いに
      視線を移した
  d_main_45_08_276:
    speaker: "<Narration>"
    en: Neon is attacking a giant mass the size of a building.
    ko: 빌딩만 한 덩어리를 공격하고 있는 네온.
    ja: |-
      ビルをまるごと浮かせたような
      大きさの塊を、ネオンが攻撃している
  d_main_45_08_277:
    speaker: "<Narration>"
    en: Anis feels she needs to hurry and join her.
    ko: 아니스는 얼른 합류해서 도와야 한다고 생각했다.
    ja: アニスはとにかく、援護しなければと考えた
  d_main_45_08_278:
    speaker: "<Narration>"
    en: She moves. Her weapon is gone, and she has no idea what's happening, but she
      moves all the same.
    ko: 몸을 움직인다. 무기도 없어지고 뭐가 뭔지 모르지만 일단 움직인다.
    ja: |-
      身体の動きを確かめた。
      気付けば武器も見当たらない。
      何が何だか分からないが、身体は動くようだ
  d_main_45_08_279:
    speaker: "<Narration>"
    en: She jumps, and immediately finds herself high up in the air.
    ko: 점프한다. 지면이 삽시간에 멀어진다.
    ja: |-
      駆けだそうとすると、
      蹴った地面が一瞬で遠ざかった
  d_main_45_08_280:
    speaker: anis_i_s
    en: Wh-what the...?
    ko: 엇, 뭐, 뭐야.
    ja: えっ、なっ、何！？
  d_main_45_08_281:
    speaker: "<Narration>"
    en: The distance closes rapidly.
    ko: 거리가 빠르게 좁혀진다.
    ja: 理解する間もなく距離が縮まる
  d_main_45_08_282:
    speaker: "<Narration>"
    en: Anis notices something strange.
    ko: 아니스는 이상한 걸 본다.
    ja: |-
      困惑するアニスの眼に、
      さらに奇妙な光景が映った
  d_main_45_08_283:
    speaker: "<Narration>"
    en: She can see Neon's bullets fly through the air.
    ko: 네온이 쏘아낸 탄환이 날아가는 것이 보인다.
    ja: ネオンの放った弾丸が見えている
  d_main_45_08_284:
    speaker: "<Narration>"
    en: They move slowly, strike the mass, and explode.
    ko: 천천히 날아가, 덩어리에 닿아 폭발을 일으킨다.
    ja: |-
      それはスローモーションのように、
      塊に当たって爆発を起こした
  d_main_45_08_285:
    speaker: enikk_op_l
    en: Aaanisss, pleeease explaaain yourrr currrent staaate.
    ko: 아아니이스으. 지이그으음 사앙태애 대애해애 마알쓰음 해애 주우시입시시오오.
    ja: |-
      アーニースー…
      状態のー…説明をー…
  d_main_45_08_286:
    speaker: "<Narration>"
    en: Enikk's voice is slowed down, and Anis wonders if she's playing a joke on
      her.
    ko: 이상하게 느리게 말하는 에닉의 목소리를 들은 아니스는, 에닉이 장난을 치는 것이라고 생각했다.
    ja: |-
      妙に間延びしたエニックの声を聞き、アニスは
      彼女が悪ふざけをしているのかと思った
  d_main_45_08_287:
    speaker: anis_i_s
    en: Uh... I'm not entirely sure, but I do feel pretty great.
    ko: 어… 모르겠는데, 지금 상태는 아주 좋은 거 같아.
    ja: ええと…よく分かんないけど、絶好調って感じ？
  d_main_45_08_288:
    speaker: enikk_op_l
    en: You'rrre speaaakinggg too quiiicklyyy.
    ko: 지이그음 마알이이 너어무우 빠아르읍니이다아.
    ja: 聞き取れませんー…もう一度ー…
  d_main_45_08_289:
    speaker: anis_i_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_290:
    speaker: "<Narration>"
    en: Anis looks around again.
    ko: 아니스는 다시 한번 주위를 둘러본다.
    ja: アニスはもう一度あたりを確かめた
  d_main_45_08_291:
    speaker: "<Narration>"
    en: It's all slow.
    ko: 느리다.
    ja: 遅い
  d_main_45_08_292:
    speaker: "<Narration>"
    en: Everything is unnaturally slow.
    ko: 모든 것이 이상하리만치 느리다.
    ja: 何もかもが異常に遅く動いている
  d_main_45_08_293:
    speaker: "<Narration>"
    en: She can see bullets as they fly. Explosions unfurl slowly. It feels like she
      could reach out and grab the debris scattering through the air.
    ko: |-
      날아가는 총알이 보인다. 폭발이 천천히 퍼진다.
      흩날리는 파편을 잡을 수 있을 것 같다.
    ja: |-
      見える速さで飛ぶ銃弾、
      ゆっくりと広がる爆風…
      飛び散る破片がつかめそうな気さえする
  d_main_45_08_294:
    speaker: "<Narration>"
    en: Suddenly, she realizes what's happening.
    ko: 아니스는 이 이상한 상황에 대해 이해했다.
    ja: アニスは自分が何を見ているのか理解した
  d_main_45_08_295:
    speaker: "<Narration>"
    en: The moment she lands, she runs.
    ko: 착지와 함께 달린다.
    ja: 足が大地に着くと同時に、もう一度蹴る
  d_main_45_08_296:
    speaker: "<Narration>"
    en: She streaks past Neon and leaps again.
    ko: 네온의 옆을 스쳐 지나간 후, 다시 도약한다.
    ja: ネオンの脇を通り過ぎ、飛び上がった
  d_main_45_08_297:
    speaker: "<Narration>"
    en: She steps onto the gigantic mass and runs across its surface.
    ko: 거대한 덩어리를 밟고 올라가, 덩어리 위를 달린다.
    ja: 巨大な塊を踏みつけ、その上を駆けあがっていく
  d_main_45_08_298:
    speaker: "<Narration>"
    en: At the far end, she sees Endless floating.
    ko: 그 끝에 떠 있는 엔드리스를 본다.
    ja: その先に浮かぶエンドレスを捉えた
  d_main_45_08_299:
    speaker: endless
    en: "... Whaaat...?"
    ko: "…뭐언가아요오?"
    ja: "…なにがー……？"
  d_main_45_08_300:
    speaker: anis_i_s
    en: Beaaats meee, moooronnn.
    ko: 모올라아 이인마아.
    ja: 私も知らないわよ、バ～カ。
  d_main_45_08_301:
    speaker: "<Narration>"
    en: Anis hurls herself at Endless.
    ko: 아니스가 엔드리스를 향해 몸을 날린다.
    ja: アニスとエンドレスの距離が縮まる
  d_main_45_08_302:
    speaker: "<Narration>"
    en: She has no weapon, and she doubts she can suddenly shoot lasers from her hands,
    ko: 무기는 없다. 손에서 빔이 나간다거나 할 것 같진 않다.
    ja: |-
      武器は相変わらず見当たらないし、
      手からビームが出るような気もしない
  d_main_45_08_303:
    speaker: "<Narration>"
    en: so she decides to just use her fists.
    ko: 아니스는 그냥 주먹질을 하기로 마음먹었다.
    ja: アニスはとりあえず、素手で戦うと決めた
  d_main_45_08_304:
    speaker: anis_i_s
    en: I can just punch her, right...?
    ko: 어… 이거 그냥 때려도 되는 거겠지?
    ja: これ…普通に殴っちゃって大丈夫よね？
  d_main_45_08_305:
    speaker: "<Narration>"
    en: Anis lunges and swings at Endless.
    ko: 아니스가 몸을 날려 엔드리스의 얼굴에 주먹을 휘두른다.
    ja: |-
      アニスの全力の拳が
      エンドレスの顔面に叩き込まれる
  d_main_45_08_306:
    speaker: "<Narration>"
    en: Her face crumples beneath the force of the punch.
    ko: 주먹에 밀린 엔드리스의 얼굴이 구겨진다.
    ja: エンドレスの顔が歪んだ
  d_main_45_08_307:
    speaker: "<Narration>"
    en: Anis knows she still has plenty of time left.
    ko: 아니스는 아직 시간이 많이 남았다는 것을 알았다.
    ja: |-
      アニスはまだこの状態が続きそうだという
      手ごたえを感じた
  d_main_45_08_308:
    speaker: "<Narration>"
    en: She decides to use every second she has...
    ko: 그 시간을 최대한으로 써서
    ja: その時間を最大限活用しようと…
  d_main_45_08_309:
    speaker: "<Narration>"
    en: "... to throw as many punches as she can."
    ko: 조금이라도 더 많은 주먹을 휘두르기로 결정했다.
    ja: アニスはひたすらに拳を振り回した
  d_main_45_08_310:
    speaker: anis_i_s
    en: Get the hell out of the Ark, you freaking virus!
    ko: 방주에서 꺼져라 이 TV 속 괴물 자식아--!!
    ja: 引っ込んでなさいよ！画面の中のオバケが！！
  d_main_45_08_311:
    speaker: "<Narration>"
    en: Anis's fists rain down on Endless without mercy.
    ko: 아니스의 주먹이 엔드리스를 마구 두드린다.
    ja: アニスの連打はエンドレスを一方的に打ち付け…
  d_main_45_08_312:
    speaker: "<Narration>"
    en: And time begins to move normally again for Anis.
    ko: 그리고 아니스의 시간이 흐르기 시작했다.
    ja: やがて、アニスの時間の流れが元に戻った
  d_main_45_08_313:
    speaker: "<Self>"
    en: What...?
    ko: "…뭐야…."
    ja: "…何が起こった…？"
  d_main_45_08_314:
    speaker: "<Narration>"
    en: "*Boom! Boom! Boom!*"
    ko: 콰앙! 콰앙! 콰앙!
    ja: ドカン！！ドカン！！ドカン！！
  d_main_45_08_315:
    speaker: "<Monologue>"
    en: "... One moment, I see Anis start to flash white, and then the next moment,
      she's disappeared."
    ko: "…아니스가 하얗게 빛나는가 싶더니, 갑자기 사라졌다."
    ja: "…アニスが白く輝いたと思った瞬間、突然消えた"
  d_main_45_08_316:
    speaker: "<Monologue>"
    en: Then all of a sudden, light erupts from Endless's body.
    ko: 그리고 말 그대로 갑작스럽게, 엔드리스의 몸에서 빛이 터져 나왔다.
    ja: 次の瞬間、エンドレスの身体中から光が爆ぜた
  d_main_45_08_317:
    speaker: "<Monologue>"
    en: Still floating in midair, Endless is hurled about by bursts of light.
    ko: 공중에 뜬 채, 이리저리 휘둘리며 터져 나오는 빛에 농락당한다.
    ja: |-
      宙に浮かんだまま、
      光に振り回されるように身体が躍っている
  d_main_45_08_318:
    speaker: "<Monologue>"
    en: Anis lands.
    ko: 아니스가 착지한다.
    ja: |-
      それから唐突に、
      アニスがどこからともなく降り立った
  d_main_45_08_319:
    speaker: anis_i_w
    en: Oh, time's moving normally again.
    ko: 엇. 이제 제대로 흐른다.
    ja: あっ、元に戻った。
  d_main_45_08_320:
    speaker: anis_i_w
    en: And... my clothes are back to normal.
    ko: 옷도… 원래대로 돌아왔어.
    ja: 服も…元通りみたいね。
  d_main_45_08_321:
    speaker: "<Self>"
    en: Anis, what just happened?
    ko: 아니스. 이게 대체….
    ja: アニス、今のは…
  d_main_45_08_322:
    speaker: anis_i_w
    en: I-I don't really know, but I think...
    ko: 나, 나도 몰라. 모르는데….
    ja: わ、私にも分かんない。分かんないけど…
  d_main_45_08_323:
    speaker: neon_v_w
    en: Master! Anis! It's collapsing!
    ko: 스승님! 아니스! 무너져요!
    ja: 師匠！アニス！崩れてきます！
  d_main_45_08_324:
    speaker: "<Monologue>"
    en: The massive construct Endless created begins to break apart and fall to the
      ground.
    ko: 엔드리스가 만든 거대한 덩어리가 분해되며 무너진다.
    ja: |-
      エンドレスの生み出した巨大な塊が、
      崩壊を始めていた
  d_main_45_08_325:
    speaker: "<Monologue>"
    en: Endless is also plummeting to the ground.
    ko: 엔드리스도 추락하고 있다.
    ja: |-
      エンドレスのボディも
      後を追うように墜落していく
  d_main_45_08_326:
    speaker: "<Self>"
    en: Don't let her get away!
    ko: 놓치지 마!
    ja: 逃がすな！
  d_main_45_08_327:
    speaker: neon_v_w
    en: Firrrepowerrr!
    ko: 화아려어억--!!
    ja: 火ぁぁ力ぅぅ！！
  d_main_45_08_328:
    speaker: "<Monologue>"
    en: Neon unleashes a relentless barrage of bullets.
    ko: 네온이 탄환을 마구 쏘아댄다.
    ja: ネオンが全力の連射を放った
  d_main_45_08_329:
    speaker: "<Monologue>"
    en: Almost at the same time, I notice a red light and a white light approaching
      from far away.
    ko: 그때, 저 먼 곳에서 다가오는 붉은 빛과 하얀색 빛을 본다.
    ja: |-
      ほぼ同時に、遠方から接近する
      赤と白の光が見えた
  d_main_45_08_330:
    speaker: "<Monologue>"
    en: Rapi is flying at high speed using Seven Dwarves Zero.
    ko: 세븐스 드워프 제로를 전개한 채 고속으로 접근하는 라피.
    ja: |-
      セブンスドワーフゼロを展開し、
      高速で飛翔するラピと…
  d_main_45_08_331:
    speaker: "<Monologue>"
    en: Alongside her is Dorothy.
    ko: 그리고 그 옆을 같이 날고 있는 도로시.
    ja: その隣で並ぶように飛ぶドロシーだ
  d_main_45_08_332:
    speaker: "<Self>"
    en: Rapi! Dorothy! Finish this!
    ko: 라피! 도로시! 마무리를!!
    ja: ラピ！ドロシー！追撃を頼む！！
  d_main_45_08_333:
    speaker: rapi_red
    en: Roger that!
    ko: 라져!
    ja: ラジャー！
  d_main_45_08_334:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_335:
    speaker: "<Monologue>"
    en: Every single one of Neon's rounds strikes the falling Endless.
    ko: 네온의 탄환이 추락 중인 엔드리스에게 모조리 명중한다.
    ja: |-
      ネオンの放った弾は外れることなく
      墜落するエンドレスに命中していく
  d_main_45_08_336:
    speaker: "<Monologue>"
    en: Rapi's drill pierces straight through her,
    ko: 라피의 드릴이 엔드리스를 꿰뚫고
    ja: ラピのドリルがエンドレスを貫き…
  d_main_45_08_337:
    speaker: "<Monologue>"
    en: while Dorothy's gunfire lashes in from all directions, hitting her mark.
    ko: 유린하듯, 사방에서 뻗은 도로시의 사격이 엔드리스에게 명중한다.
    ja: |-
      続けざまに、四方から伸びたドロシーの射撃が
      エンドレスに追い討ちをかけた
  d_main_45_08_338:
    speaker: "<Monologue>"
    en: Endless plummets powerlessly to the ground.
    ko: 엔드리스는 힘없이 바닥에 추락한다.
    ja: エンドレスは受け身すら取れず墜落した
  d_main_45_08_339:
    speaker: "<Monologue>"
    en: She lands with a loud thud, making a small crater in the ground.
    ko: 쿵-! 하는 소리와 함께 지면이 움푹 파인다.
    ja: 爆音とともに地面がえぐり取られる
  d_main_45_08_340:
    speaker: "<Monologue>"
    en: Endless lies motionless, her body in ruins.
    ko: |-
      엉망이 된 몸.
      엔드리스는 조금의 움직임도 없다.
    ja: |-
      一目でわかる重傷だ。
      エンドレスはもはや微動だにしない
  d_main_45_08_341:
    speaker: endless
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_342:
    speaker: enikk_op_l
    en: Endless has ceased functioning.
    ko: 엔드리스. 기능 정지 확인.
    ja: エンドレスの機能停止を確認。
  d_main_45_08_343:
    speaker: enikk_op_l
    en: I detect no E2 Crystals anywhere in the Ark.
    ko: 방주 전역에 E2 크리스탈 반응 없음.
    ja: アーク全域のE2クリスタル、反応消失。
  d_main_45_08_344:
    speaker: enikk_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_345:
    speaker: enikk_op_l
    en: We have won.
    ko: 승리했습니다.
    ja: 我々の勝利です。
  d_main_45_08_346:
    speaker: anis_i_w
    en: Phew! Great job, everyone.
    ko: 후우! 다들 수고했어.
    ja: ふうーっ！みんな、お疲れ様。
  d_main_45_08_347:
    speaker: neon_v_w
    en: Right back at you, Anis.
    ko: 아니스도요.
    ja: アニスもです。
  d_main_45_08_348:
    speaker: rapi_red
    en: You as well, Dorothy.
    ko: 도로시. 수고했어.
    ja: ドロシー、助かったわ。
  d_main_45_08_349:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_350:
    speaker: anis_i_w
    en: I still don't know what just happened...
    ko: 아직 뭐가 뭔지 모르겠지만….
    ja: まだ何が何だか分からないけど…
  d_main_45_08_351:
    speaker: anis_i_w
    en: But what matters is that we wo...
    ko: 어쨌든, 이겼….
    ja: とにかく、勝ちは勝ち…
  d_main_45_08_352:
    speaker: "<Monologue>"
    en: Anis falls silent and scans her surroundings.
    ko: 아니스가 말을 멈추고 주위를 둘러본다.
    ja: アニスは言葉を止め、周囲を見渡した
  d_main_45_08_353:
    speaker: "<Monologue>"
    en: People are gathering.
    ko: 수많은 이들이 모여들고 있다.
    ja: 群衆が集まっていた
  d_main_45_08_354:
    speaker: "<Monologue>"
    en: They stare at the devastated plaza with fear in their eyes.
    ko: 엉망인 광장을 공포에 찬 눈으로 바라보고 있다.
    ja: 壊滅した広場を見て、明らかに怯えている
  d_main_45_08_355:
    speaker: "<Self>"
    en: The threat has been neutralized. It's okay now, everyone.
    ko: "…테러는 진압되었습니다. 이제 괜찮아요."
    ja: "…テロは鎮圧しました。もう心配いりません"
  d_main_45_08_356:
    speaker: "<Monologue>"
    en: Nothing in their expression changes. It's as if they didn't hear me.
    ko: 내 목소리가 들리지 않는 듯, 그들의 시선에는 변함이 없다.
    ja: |-
      私の声も届かないのか、
      人々の表情は凍り付いている
  d_main_45_08_357:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_08_358:
    speaker: "<Monologue>"
    en: Anis crouches down.
    ko: 아니스가 몸을 웅크린다.
    ja: アニスは体を縮めると…
  d_main_45_08_359:
    speaker: "<Monologue>"
    en: She gathers light into her hand.
    ko: 손에 빛을 담는다.
    ja: 手の先が光った
  d_main_45_08_360:
    speaker: "<Monologue>"
    en: Then, without a word,
    ko: 아니스는 말없이
    ja: アニスはそのまま静かに…
  d_main_45_08_361:
    speaker: "<Monologue>"
    en: she raises her arm high towards the sky.
    ko: 하늘을 향해 힘차게 손을 들어 올렸다.
    ja: 空に向かって手を振り上げた
  d_main_45_08_362:
    speaker: "<Narration>"
    en: There is a quick flash,
    ko: 반짝.
    ja: ピカッ――
  d_main_45_08_363:
    speaker: "<Monologue>"
    en: and Anis's body begins to shine.
    ko: 아니스의 몸이 빛난다.
    ja: アニスの体が光を放った
  d_main_45_08_364:
    speaker: "<Monologue>"
    en: The people all turn to look at her.
    ko: 사람들이 아니스를 바라본다.
    ja: 人々の視線がアニスに集まる
  d_main_45_08_365:
    speaker: "<Monologue>"
    en: They see Anis, shining alone in the darkness of the Ark.
    ko: 어두운 방주에서 유일하게 빛나고 있는 아니스를 본다.
    ja: |-
      暗闇に包まれたアークで、
      それがただ一つ光るものだったからだ
  d_main_45_08_366:
    speaker: anis_i_w
    en: We won!
    ko: 우리가 이겼어!
    ja: 私たちの勝ちよ！
  d_main_45_08_367:
    speaker: "<Monologue>"
    en: Light fills their eyes,
    ko: 그들의 눈에 빛이 담긴다.
    ja: 群衆の目に光が戻る
  d_main_45_08_368:
    speaker: "<Monologue>"
    en: and after a brief pause,
    ko: 그리고 잠깐의 시간이 지난 후.
    ja: それから、少し間をおいて…
  d_main_45_08_369:
    speaker: "<Monologue>"
    en: the crowd erupts into cheering.
    ko: 환호성이 터져 나온다.
    ja: 歓声が沸き起こった
  d_main_45_08_370:
    speaker: "<Monologue>"
    en: Anis stands there, taking in their gazes and their cheers,
    ko: 아니스는 그들의 시선과 환호성을 그대로 받으며.
    ja: アニスは人々の視線と歓声を一身に浴びながら…
  d_main_45_08_371:
    speaker: "<Monologue>"
    en: while she smiles brighter than she ever had before.
    ko: 지금껏 본 적 없던 미소를 짓고 있었다.
    ja: 今まで見たことがないような笑顔を浮かべていた
d_main_45_09:
  d_main_45_09_1:
    speaker: "<Monologue>"
    en: Power to the Ark was quickly restored once the battle ended,
    ko: 방주의 동력은 빠르게 회복되었다.
    ja: アークの電力網はすぐに回復した
  d_main_45_09_2:
    speaker: "<Monologue>"
    en: albeit not in certain areas. The crystals that had burst up through the ground
      caused extensive structural damage.
    ko: |-
      바닥을 뚫고 올라온 수정들로 인해 망가진 곳이 상당수 있어,
      부분부분 전기가 들어오지 않는 곳이 있었지만.
    ja: |-
      クリスタルによって破壊された箇所は
      相当数にのぼり、ところどころ
      復旧に時間のかかる地域はあるものの…
  d_main_45_09_3:
    speaker: "<Monologue>"
    en: However, even those areas are expected to receive power again soon.
    ko: 빠른 시일 내에 회복될 것이라 전달받았다.
    ja: |-
      それも近日中に
      回復する見込みだという報告だった
  d_main_45_09_4:
    speaker: "<Monologue>"
    en: The exact number of casualties remains unknown.
    ko: 자세한 사상자 수는 듣지 못했지만.
    ja: 詳細な死傷者数はまだ聞いていない
  d_main_45_09_5:
    speaker: "<Monologue>"
    en: "... It is said to be potentially the worst disaster the Ark has ever suffered."
    ko: "…방주에서 일어난 일 중, 역대급의 피해가 발생했다고 한다."
    ja: |-
      …おそらくアークの歴史の中でも、
      最悪の事件になったことは間違いないだろう
  d_main_45_09_6:
    speaker: "<Monologue>"
    en: As for Sixo, the one responsible for all of this...
    ko: 이 일의 원흉인 식스오는….
    ja: |-
      すべての元凶となった
      シックスオーはと言えば…
  d_main_45_09_7:
    speaker: enikk
    en: After examining the remains of Endless's body,
    ko: 대파된 엔드리스의 바디를 살펴본 결과.
    ja: 大破したエンドレスのボディを分析した結果…
  d_main_45_09_8:
    speaker: enikk
    en: I was able to determine that Sixo escaped.
    ko: 식스오는 도주한 상태였습니다.
    ja: |-
      シックスオーのメインロジックデータは
      存在しませんでした。
  d_main_45_09_9:
    speaker: enikk
    en: In other words, she survived.
    ko: 즉, 생존한 상태입니다.
    ja: すなわち、抹殺は未了と確認しています。
  d_main_45_09_10:
    speaker: anis_i_w
    en: You say that as though it's not a big deal.
    ko: 아니, 그렇게 가볍게 말할 문제는 아닌 것 같은데.
    ja: |-
      いや、そんな軽く話していいことじゃ
      ないと思うけど。
  d_main_45_09_11:
    speaker: anis_i_w
    en: After all the damage she's caused, shouldn't we be doing everything we can
      to catch her?
    ko: |-
      방주를 그렇게 엉망으로 만든 녀석인데,
      어떻게든 잡아야 하는 것 아냐?
    ja: |-
      アークをめちゃくちゃにしたのよ？
      どんな手を使ってでも
      始末するべきじゃないの？
  d_main_45_09_12:
    speaker: enikk
    en: Pursuing her is currently not possible. Her final destination is likely to
      be the Outer Rim.
    ko: |-
      추적 불가능합니다.
      아우터 림으로 향한 것으로 추정됩니다.
    ja: |-
      追跡は不能です。
      アウターリムに潜伏したものと推測されます。
  d_main_45_09_13:
    speaker: enikk
    en: However, I have determined that only her main program was transferred, and
      that she lost most of her other functions.
    ko: 단, 메인 로직만을 이동시켰기에 기능의 대부분을 소실했을 것이라 판단.
    ja: |-
      ただし、転送が完了しているデータは
      メインロジックのみであったため、
      能力の大半を喪失しているはずです。
  d_main_45_09_14:
    speaker: enikk
    en: She will require decades of learning to return to her previous state.
    ko: 이전의 상태가 될 때까지 학습하려면 수십 년의 시간이 더 소모될 것이라 보입니다.
    ja: |-
      以前の状態に戻るには、
      数十年単位の学習が必要になるでしょう。
  d_main_45_09_15:
    speaker: neon_v_w
    en: Hmm... Still, shouldn't we finish her for good?
    ko: 음… 뿌리를 뽑아야 하는 것 아닐까요?
    ja: |-
      それならやっぱり…
      根っこを絶っておくべきでは？
  d_main_45_09_16:
    speaker: enikk
    en: There is no need.
    ko: 괜찮습니다.
    ja: その必要はありません。
  d_main_45_09_17:
    speaker: enikk
    en: That is a concern for the distant future, by which time humanity will already...
    ko: 먼 훗날의 일이며, 그때쯤에 인류는 이미.
    ja: |-
      問題になるとすれば遠い未来です。
      その頃、人類はすでに…
  d_main_45_09_18:
    speaker: enikk
    en: 'Correction: since this is a matter for the distant future, responding now
      would be a waste of resources.'
    ko: 정정. 먼 훗날의 일이기에 지금 대응하는 것은 리소스 낭비입니다.
    ja: |-
      表現修正。問題になるとすれば遠い未来です。
      現時点でこれ以上の対応は
      資源の浪費になります。
  d_main_45_09_19:
    speaker: "<Self>"
    en: "... What were you about to say?"
    ko: "…방금 무슨 말 하려다 만 것 아냐?"
    ja: "…何か言いかけなかったか？"
  d_main_45_09_20:
    speaker: enikk
    en: It is of no importance.
    ko: 아닙니다. 착각입니다.
    ja: いいえ。単なる表現の修正です。
  d_main_45_09_21:
    speaker: anis_i_w
    en: What did she even want in the end...?
    ko: 그 녀석… 결국엔 뭘 하고 싶었던 걸까.
    ja: あいつ…結局、何がしたかったのかしら。
  d_main_45_09_22:
    speaker: enikk
    en: There is no way to know.
    ko: 알 수 없습니다.
    ja: 不明です。
  d_main_45_09_23:
    speaker: enikk
    en: Sixo was originally utilized as a means to strengthen justice within the Ark.
    ko: 식스오는 방주의 정의를 좀 더 견고하게 만들 수단으로 이용되었습니다.
    ja: |-
      シックスオーは、アークにおける
      正義の解釈をより確固たるものとするため
      利用されていました。
  d_main_45_09_24:
    speaker: enikk
    en: She likely only ever learned how to fortify justice through acts of evil,
      and thereby resolved to commit ever greater atrocities.
    ko: 정의를 돋보이게 할 악을 행하는 것만을 학습했고, 악행을 더욱 견고하게 다듬는 것으로 학습의 방향을 결정했을 것입니다.
    ja: |-
      正義を強調するための悪のみを学習し、
      悪事を強化する方向へと
      進化した可能性があります。
  d_main_45_09_25:
    speaker: enikk
    en: Presumably, this learning culminated in her attempt to seize control of me
      and bring down the Ark.
    ko: 그 학습의 종착지가 저를 장악하고, 방주를 무너뜨리는 행위일 것으로 추정하고 있습니다.
    ja: |-
      その学習の終着点こそ、
      私を掌握し、アークを崩壊させる計画だったと
      推測しています。
  d_main_45_09_26:
    speaker: enikk
    en: Her desire for Endless's body was likely for the same reason.
    ko: 엔드리스의 바디를 탐낸 것도 같은 이유겠지요.
    ja: |-
      エンドレスのボディに誘引された理由も
      おそらくそれでしょう。
  d_main_45_09_27:
    speaker: enikk
    en: Physical force is essential for committing evil. Greater physical force leads
      to greater effectiveness.
    ko: |-
      악행을 저지르는 데 물리력은 반드시 필요합니다.
      압도적인 물리력일수록 더욱 유효하죠.
    ja: |-
      悪事の遂行には物理的な実力が不可欠です。
      圧倒的な力を保有していれば、
      それだけ有利になります。
  d_main_45_09_28:
    speaker: enikk
    en: This is evidenced by Sixo's decision when the blackout started. She could
      have retreated and tried again later, but she chose not to.
    ko: 방주가 꺼졌을 때, 충분히 다음을 노릴 수 있었음에도 그러지 않았던 것이 증거입니다.
    ja: |-
      電力システムが遮断された時点で撤退し、
      次の機会を待つこともできたはずですが、
      そうしなかったことも、裏付けになります。
  d_main_45_09_29:
    speaker: neon_v_w
    en: There's something I still don't really get, though.
    ko: 저, 좀 이해되지 않는 게 있는데요.
    ja: |-
      でも…ちょっと理解できないことが
      あるんですよね。
  d_main_45_09_30:
    speaker: neon_v_w
    en: She used herself as a power source at the end there to wreck the Ark, right?
    ko: 마지막에 자기를 동력원으로 삼아 방주를 엉망으로 만들었잖아요.
    ja: |-
      追い詰められた時、
      自分のエネルギーをクリスタルに送って、
      アークを壊滅させようとしたじゃないですか。
  d_main_45_09_31:
    speaker: neon_v_w
    en: But if she had her eyes on Enikk's position, that means she wanted to rule
      the Ark.
    ko: 에닉의 자리를 탐낸다는 것은 곧, 방주의 지배자와 같은 위치가 되고 싶었다는 건데.
    ja: |-
      エニックの座を乗っ取りたいということは
      アークの支配者になりたいということだと
      思うんですけど…
  d_main_45_09_32:
    speaker: neon_v_w
    en: Why destroy the thing you're trying to rule?
    ko: 그렇게 방주를 망가뜨려서는 지배자고 뭐고 소용없는 것 아닌가요?
    ja: |-
      アークをめちゃくちゃにしちゃったら
      支配者になる意味がなくなるのでは？
  d_main_45_09_33:
    speaker: enikk
    en: She was likely trying to restore power to the Ark to force my hand, and then
      seize control of me while I was attempting to contain the situation.
    ko: |-
      상황을 수습하기 위해 방주를 다시 켜고,
      제가 그 상황을 수습하고 있을 때 저를 장악할 생각이었을 겁니다.
    ja: |-
      電力システムの復旧後、あくまで
      私が収拾に追われる隙を狙い
      乗っ取りを図る計画であったと推測しています。
  d_main_45_09_34:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_35:
    speaker: "<Monologue>"
    en: I recall the words Endless spoke before her body was swallowed by crystal.
    ko: 엔드리스의 바디가 수정에 삼켜지기 전에 했던 말을 떠올린다.
    ja: |-
      ボディがクリスタルに飲み込まれる直前、
      エンドレスの口から出た
      シックスオーの言葉を思い出した
  d_main_45_09_36:
    speaker: endless
    en: I will reduce everything to ruin.
    ko: 모두 엉망으로 만들어드리죠.
    ja: 何もかもめちゃくちゃにして差し上げましょう。
  d_main_45_09_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_38:
    speaker: "<Self>"
    en: I see it differently.
    ko: 내 생각은 좀 달라.
    ja: 少し違うと思う
  d_main_45_09_39:
    speaker: "<Self>"
    en: I think she just wanted to ruin the Ark.
    ko: 단순히 방주를 엉망으로 만들고 싶었던 거라고 생각해.
    ja: 単にアークを壊したかっただけだろう
  d_main_45_09_40:
    speaker: enikk
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_41:
    speaker: anis_i_w
    en: But... why?
    ko: 어… 왜?
    ja: え…なんで？
  d_main_45_09_42:
    speaker: anis_i_w
    en: That doesn't benefit her at all.
    ko: 그래서는 자기한테 뭐 떨어지는 게 아무것도 없잖아.
    ja: |-
      そんなことしたって、
      何の得にもならないじゃない。
  d_main_45_09_43:
    speaker: anis_i_w
    en: You think she just got desperate and decided to take everything down with
      her?
    ko: 자포자기하는 심정으로 자폭이라도 한 건가?
    ja: ヤケクソになって自爆しようとしてたってこと？
  d_main_45_09_44:
    speaker: "<Self>"
    en: Would it be too much of a stretch to say... maybe she just felt like it?
    ko: 그냥… 이라고 말하면 너무 무책임할까?
    ja: なんとなく感じた…と言うのは、無責任か？
  d_main_45_09_45:
    speaker: enikk
    en: There is some logic to that.
    ko: 일리 있는 추리입니다.
    ja: 可能性としては考えられます。
  d_main_45_09_46:
    speaker: enikk
    en: Perhaps her only goal was to destroy as much as she could for no particular
      reason.
    ko: 이유 없이. 그저 모든 것을 엉망으로 만드는 것이 목적이었을지도 모르겠군요.
    ja: |-
      特に明確なロジックはなく、
      ただ全てを破壊することだけが目的だった。
  d_main_45_09_47:
    speaker: enikk
    en: That kind of senseless malice...
    ko: 그런 이유 없는 악의마저
    ja: そのような、理由のない悪意を抱くことこそ…
  d_main_45_09_48:
    speaker: enikk
    en: "... may have been something she learned from humanity."
    ko: 인간의 것을 학습했기 때문일 수 있습니다.
    ja: |-
      人間の思考を学習した結果と
      言えるのかもしれません。
  d_main_45_09_49:
    speaker: enikk
    en: Human nature has very clear strengths and weaknesses.
    ko: 역시 인간성은 장단점이 너무 명확하군요.
    ja: |-
      やはり、人間性というものには
      明確な長所と短所が存在します。
  d_main_45_09_50:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_51:
    speaker: enikk
    en: The Ark suffered severe damage because of the monster it created.
    ko: 방주가 만들어낸 괴물로 인해 방주는 큰 피해를 입었습니다.
    ja: |-
      今回アークに甚大な被害をもたらしたものは、
      アークが産み出した怪物に他なりません。
  d_main_45_09_52:
    speaker: enikk
    en: I hope this incident will become a learning opportunity for the people here
      to realize the danger of what they possess.
    ko: 이 건으로 인해 자신들이 손에 쥔 것의 위험성을 인지하는 계기가 되면 좋겠습니다만.
    ja: |-
      この一件が、己が手にしているものの
      危険性を認識する契機となればよいのですが…
  d_main_45_09_53:
    speaker: enikk
    en: However, I am not thrilled about the fact that I would be the first thing
      they dispose of if they really take that lesson to heart.
    ko: 그럴 경우 가장 먼저 처분당할 것이 저라는 사실이 유쾌하지 않군요.
    ja: |-
      そうなった場合、何よりも先に処分される物は
      私になるであろうという事実は
      あまり好ましくありません。
  d_main_45_09_54:
    speaker: neon_v_w
    en: Wow, you can make jokes now?
    ko: 우와. 에닉이 농담을 다 하네요.
    ja: わぁ。エニックって冗談も言えたんですね。
  d_main_45_09_55:
    speaker: enikk
    en: Thank you for saving the Ark in its time of crisis.
    ko: 위기에 처한 방주를 구해주셔서 진심으로 감사드립니다.
    ja: |-
      改めて、アークの危機を
      救ってくださったことに、
      感謝を申し上げます。
  d_main_45_09_56:
    speaker: enikk
    en: Formulating this as a solo operation for the Commando Unit appears to have
      been the correct decision.
    ko: 특수별동대에 단독 작전을 제안한 것이 정답이었군요.
    ja: |-
      特殊別働隊による単独作戦を行う判断は
      正解でした。
  d_main_45_09_57:
    speaker: rapi_red
    en: "... Granted, Dorothy's intervention wasn't exactly expected."
    ko: "…도로시가 난입한 건 좀 의외였지만 말이야."
    ja: "…ドロシーが来るとは聞いてなかったわ。"
  d_main_45_09_58:
    speaker: rapi_red
    en: Did you reach out to her?
    ko: 네가 따로 얘기한 거야?
    ja: それも計算のうち？
  d_main_45_09_59:
    speaker: enikk
    en: No, I said nothing to the Pilgrim Dorothy.
    ko: 아니요. 필그림 도로시에겐 아무런 언급도 하지 않았습니다.
    ja: |-
      いいえ。ピルグリム・ドロシーには
      一切の情報開示を行っていません。
  d_main_45_09_60:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_61:
    speaker: anis_i_w
    en: She must be up to something.
    ko: 뭔가 꿍꿍이가 있을 것 같은데.
    ja: 何か企んでるのね。
  d_main_45_09_62:
    speaker: neon_v_w
    en: Isn't it kinda rude to question someone who just helped us out?
    ko: 도와주신 분을 너무 그렇게 덮어놓고 의심만 하는 건 실례지 않을까요?
    ja: |-
      助けてくれた人にそれは
      さすがに失礼じゃないですか？
  d_main_45_09_63:
    speaker: anis_i_w
    en: Hm... Yeah, you're right. She probably didn't want anyone to die, either.
    ko: 음… 그렇지. 걔도 사람들이 죽는 건 싫을 테니까.
    ja: |-
      まあ…そうね。
      人が死ぬのは見過ごせないって
      タイプではあるんだろうし。
  d_main_45_09_64:
    speaker: anis_i_w
    en: Let's go thank her.
    ko: 인사나 하러 가자.
    ja: お礼でも言いに行きましょ。
  d_main_45_09_65:
    speaker: "<Self>"
    en: Yeah, I've got something I want to tell her anyway.
    ko: 그럴까? 할 말도 있으니까.
    ja: そうするか？話したいこともあるからな
  d_main_45_09_66:
    speaker: enikk
    en: Well done, all of you.
    ko: 수고하셨습니다.
    ja: お疲れ様でした。
  d_main_45_09_67:
    speaker: enikk
    en: We will meet again soon.
    ko: 조만간 또 뵙겠습니다.
    ja: では、近日中にまたご連絡します。
  d_main_45_09_68:
    speaker: "<Self>"
    en: We will...?
    ko: 조만간…?
    ja: 近日中に…？
  d_main_45_09_69:
    speaker: enikk
    en: 'Correction: we will meet again at some point.'
    ko: 정정. 나중에 뵙겠습니다.
    ja: 訂正…またいずれお会いしましょう。
  d_main_45_09_70:
    speaker: dorothy
    en: You don't have to thank me.
    ko: 감사 인사는 됐어요.
    ja: 礼など不要です。
  d_main_45_09_71:
    speaker: dorothy
    en: I only did what I had to.
    ko: 저도 필요에 의해 한 일이니까.
    ja: 私の都合でそうしただけですので。
  d_main_45_09_72:
    speaker: rapi_red
    en: What do you mean?
    ko: 무슨 필요?
    ja: あなたの都合？
  d_main_45_09_73:
    speaker: dorothy
    en: You seem really interested in me.
    ko: 당신은 저한테 참 관심이 많군요.
    ja: 相変わらず、私に興味があるようですね。
  d_main_45_09_74:
    speaker: rapi_red
    en: Yeah, because we're friends.
    ko: 응. 친구니까.
    ja: ええ。友だちだから。
  d_main_45_09_75:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_76:
    speaker: anis_i_w
    en: Huh? Since when are you two friends?
    ko: 어 뭐야. 둘이 친구 되기로 한 거야?
    ja: 何それ？知らないうちに友だちになってたの？
  d_main_45_09_77:
    speaker: neon_v_w
    en: Wait, what does that make us then?
    ko: 예에~? 그럼 저희는요?
    ja: ええ～？じゃあ、私たちは？
  d_main_45_09_78:
    speaker: anis_i_w
    en: We're friends too, of course. A friend of a friend is a friend, right?
    ko: 당연히 친구지. 친구의 친구는 친구라고들 하잖아.
    ja: |-
      もちろん友だちでしょ。
      友だちの友だちはみんな友だちっていうし。
  d_main_45_09_79:
    speaker: anis_i_w
    en: Come to think of it, we've actually known each other for a long time now,
      huh?
    ko: 그러고 보니 우리 알고 지낸 지도 참 오래됐어, 그치?
    ja: 知り合ってからかなり経ってるしね。ね～？
  d_main_45_09_80:
    speaker: neon_v_w
    en: Nice to see you, my good friend Dorothy!
    ko: 반가워요 도로시 친구!
    ja: |-
      改めてよろしくお願いしますね。
      我が友、ドロシー！
  d_main_45_09_81:
    speaker: anis_i_w
    en: Hey! It's my friend Dorothy!
    ko: 잘 부탁해요 도로시 친구!
    ja: よろしくね。私の友だちのドロシー！
  d_main_45_09_82:
    speaker: dorothy
    en: Please leave.
    ko: 나가주세요.
    ja: 帰ってください。
  d_main_45_09_83:
    speaker: anis_i_w
    en: Oh, come on! Is that how you treat your friends?
    ko: 에이 친구끼리 뭘 그렇게 쌀쌀맞게 굴어.
    ja: 友だちでしょ～冷たいこと言わないでよ～
  d_main_45_09_84:
    speaker: dorothy
    en: "... Question."
    ko: "…당신."
    ja: "…あなたは…"
  d_main_45_09_85:
    speaker: dorothy
    en: What made you try so hard to win the humans over?
    ko: 뭐가 그렇게 좋아서 인간들에게 잘 보이려고 애를 썼죠?
    ja: |-
      なぜそこまでして
      人間に気に入られようと
      必死になっているのですか？
  d_main_45_09_86:
    speaker: anis_i_w
    en: Did I?
    ko: "…애를 써?"
    ja: "…必死になる？"
  d_main_45_09_87:
    speaker: dorothy
    en: Yes, it was quite the impressive performance.
    ko: 그래요. 퍼포먼스 수준이 훌륭하던데요.
    ja: ええ。見事なパフォーマンスでしたね。
  d_main_45_09_88:
    speaker: dorothy
    en: And here I thought you despised the Ark, hehe.
    ko: 후후. 방주를 그렇게나 싫어하더니.
    ja: |-
      ふふ…アークは嫌いだと、
      あれほど言っていたのに。
  d_main_45_09_89:
    speaker: dorothy
    en: Have you changed your mind?
    ko: 이제 와서 마음이 바뀐 건가요?
    ja: 今になって、心変わりですか？
  d_main_45_09_90:
    speaker: anis_i_w
    en: Yeah. I've forgiven everyone.
    ko: 그래. 나는 이제 용서했어.
    ja: そう。私、許すことにしたの。
  d_main_45_09_91:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_92:
    speaker: anis_i_w
    en: You should do the same.
    ko: 그러니 너도 이제 용서해.
    ja: あなたもいい加減そうしたら？
  d_main_45_09_93:
    speaker: dorothy
    en: I didn't realize what they did to you was so easily forgivable.
    ko: |-
      그렇게나 쉽게 용서할 수 있는 일이었군요.
      당신의 일은.
    ja: |-
      そう簡単に許せるものだったのですか、
      あなたがされたことは。
  d_main_45_09_94:
    speaker: anis_i_w
    en: It wasn't easy.
    ko: 쉽진 않았지.
    ja: そうじゃないけど。
  d_main_45_09_95:
    speaker: dorothy
    en: I just mean that for me, it would be impossible.
    ko: 저는 불가능할 것 같아서요.
    ja: 私にはできないことです。
  d_main_45_09_96:
    speaker: "<Self>"
    en: Why not take it up with the Ark officially?
    ko: 방주에 정식으로 얘기해 보는 건 어때?
    ja: 一度、アークと正式に話をしてみるのはどうだ？
  d_main_45_09_97:
    speaker: dorothy
    en: Take what up...?
    ko: "…뭘요."
    ja: "…何のことでしょう。"
  d_main_45_09_98:
    speaker: "<Self>"
    en: You know, about how you were used and betrayed.
    ko: "…방주에게 이용만 당하고, 배신당했던 일 말이야."
    ja: "…アークに利用されて、裏切られたことだ"
  d_main_45_09_99:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_09_100:
    speaker: dorothy
    en: How... how do you know that?!
    ko: 당신…! 그 얘기를 어떻게…!
    ja: あなた…！なぜそれを…！
  d_main_45_09_101:
    speaker: rapi_red
    en: We met Snow White.
    ko: 스노우 화이트와 만났어.
    ja: スノーホワイトに会ったの。
  d_main_45_09_102:
    speaker: rapi_red
    en: She told us everything.
    ko: 모든 얘기를 다 들었고.
    ja: 全部聞いたわ。
  d_main_45_09_103:
    speaker: dorothy
    en: I never knew she could be so talkative.
    ko: 그렇게 입이 싼 분인 줄은 몰랐군요.
    ja: 思っていたより口が軽かったようですね。
  d_main_45_09_104:
    speaker: "<Self>"
    en: I don't know what your plan is,
    ko: "…네가 무슨 생각을 하고 있는지는 모르겠지만."
    ja: "…君が何を考えているかまでは分からないが"
  d_main_45_09_105:
    speaker: "<Self>"
    en: but the most urgent issue we're facing right now is the Queen.
    ko: 지금 가장 시급한 문제는 퀸이야.
    ja: 今、最大の問題はクイーンだ
  d_main_45_09_106:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_45_09_107:
    speaker: "<Self>"
    en: Scarlet and Rapunzel can be revived.
    ko: 홍련과 라푼젤도 부활할 수 있어.
    ja: 紅蓮とラプンツェルも助けられる
  d_main_45_09_108:
    speaker: "<Self>"
    en: You should join us as...
    ko: 그러니 너도 같이….
    ja: だから、私たちと一緒に…
  d_main_45_09_109:
    speaker: dorothy
    en: No.
    ko: 조용.
    ja: 結構です。
  d_main_45_09_110:
    speaker: dorothy
    en: I'll handle my own affairs. Please just stay out of it.
    ko: 제가 알아서 할 테니, 신경 끄시죠.
    ja: 私は私のやり方で解決しますので、お構いなく。
  d_main_45_09_111:
    speaker: rapi_red
    en: What are you planning on doing? You don't have any allies left.
    ko: |-
      뭘 어떻게 할 생각이야?
      너는 이제 동료가 없어.
    ja: |-
      どうするつもり？
      他に仲間もいないのに。
  d_main_45_09_112:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_45_09_113:
    speaker: rapi_red
    en: You're all alone.
    ko: 혼자라고.
    ja: あなた独りで。
  d_main_45_09_114:
    speaker: dorothy
    en: Enough!
    ko: 제발!
    ja: もういいでしょう！
  d_main_45_09_115:
    speaker: rapi_red
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_45_09_116:
    speaker: dorothy
    en: I'm telling you to leave me alone! Please... Okay?
    ko: |-
      저한테 신경 꺼 주세요…!
      부탁드릴게요. 예?
    ja: |-
      私にこれ以上構わないでください…！
      後生です。いいですね？
  d_main_45_09_117:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_118:
    speaker: neon_v_w
    en: Wow... I haven't seen Dorothy shout like that in a long time.
    ko: 도, 도로시가 저렇게 소리치는 거 오랜만에 보네요.
    ja: そんなに声を上げるドロシーは久しぶりですね。
  d_main_45_09_119:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_120:
    speaker: anis_i_w
    en: She's cornered.
    ko: 몰렸네.
    ja: 図星ってヤツね。
  d_main_45_09_121:
    speaker: dorothy
    en: "... I'm sorry. I did not mean to raise my voice."
    ko: "…죄송, 죄송해요. 소리를 지를 것까진 없었는데."
    ja: |-
      …これは、失礼。
      意味もなくはしたない真似を
      してしまいました。
  d_main_45_09_122:
    speaker: dorothy
    en: While I appreciate your concern, I'm asking you to stop.
    ko: 아무튼 관심은 감사한데, 이제 그만해주세요.
    ja: |-
      とにかく…気にかけていただいていることには
      感謝しますが、これ以上構わないでください。
  d_main_45_09_123:
    speaker: rapi_red
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  d_main_45_09_124:
    speaker: dorothy
    en: Rapi, don't say anything more.
    ko: "…라피. 더 말하지 마요."
    ja: "…ラピ。あなたもです。"
  d_main_45_09_125:
    speaker: rapi_red
    en: "... All right."
    ko: "…알겠어."
    ja: "…そう。"
  d_main_45_09_126:
    speaker: rapi_red
    en: But I still remember the promise I made back then.
    ko: 하지만 난 그때 했던 약속을 기억하고 있어.
    ja: でも、私は約束を忘れてないから。
  d_main_45_09_127:
    speaker: rapi_red
    en: If you ever walk down the wrong path, I will stop you.
    ko: |-
      네가 만약 잘못된 길로 걸어간다면,
      내가 막을 것이라는 약속을.
    ja: |-
      あなたがもし間違った道に進もうとしたら、
      私が止める。
  d_main_45_09_128:
    speaker: rapi_red
    en: So don't go down the wrong path.
    ko: 부디, 잘못된 길을 걷지 않길 바랄게.
    ja: できれば、そうならないことを願ってるわ。
  d_main_45_09_129:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_130:
    speaker: rapi_red
    en: Let's go, Commander.
    ko: 지휘관. 가시죠.
    ja: 指揮官。行きましょう。
  d_main_45_09_131:
    speaker: anis_i_w
    en: "... See you around."
    ko: "…또 보자."
    ja: "…じゃ、また。"
  d_main_45_09_132:
    speaker: neon_v_w
    en: Take care, Dorothy. My friend.
    ko: 쉬세요 도로시 친구.
    ja: ゆっくり休んでください、我が友ドロシー。
  d_main_45_09_133:
    speaker: "<Self>"
    en: "... Dorothy, if you wait any longer, it may be too late."
    ko: "…도로시. 더 늦으면 건질 수 없을지도 몰라."
    ja: |-
      …ドロシー、これ以上遅くなれば
      取り返しのつかないことになるかもしれない
  d_main_45_09_134:
    speaker: "<Self>"
    en: I hope you understand that.
    ko: 그건 알아주면 좋겠어.
    ja: それだけは分かっておいてほしい
  d_main_45_09_135:
    speaker: dorothy
    en: Thank you for your concern.
    ko: 말씀 감사드려요.
    ja: ご忠告、ありがとうございます。
  d_main_45_09_136:
    speaker: mustang
    en: Superbe! Magnifique!
    ko: Won--derful--!! Beau---tiful--!!
    ja: Won--derful--!! Beau---tiful--!!
  d_main_45_09_137:
    speaker: mustang
    en: Anis, ma chérie! You shone with such splendeur!
    ko: My 아니스! 화려하게 활약했군Yo!
    ja: Myアニス！見事な大活躍でしたNE！
  d_main_45_09_138:
    speaker: mustang
    en: I was so overcome, I shed tears de joie!
    ko: Me는! 감격의 Tears를 흘렸습니Da!
    ja: Meは！感動の涙が止まりまSEN！
  d_main_45_09_139:
    speaker: anis_i_w
    en: "... Uh, so... did you figure out what the expansive armament actually does?"
    ko: "…그… 래서 확장 무장의 진짜 기능은 알아냈어요?"
    ja: "…それで…あの武装のこと、何か分かりました？"
  d_main_45_09_140:
    speaker: mustang
    en: Oui!
    ko: Yes!
    ja: Yes！
  d_main_45_09_141:
    speaker: mustang
    en: I've carefully analysé your data de combat.
    ko: My 아니스의 Battle Data를 면밀히 Check 해 보았습니Da.
    ja: |-
      MyアニスのBattle Dataを
      厳重にCheckしましTA。
  d_main_45_09_142:
    speaker: mustang
    en: The true fonction of the expansive armament Star is le contrôle de l'énergie.
    ko: |-
      확장 무장 STAR의 진짜 기능은,
      Energy 제어 입니Da.
    ja: |-
      拡張武装STARの真の能力は、
      Energy制御と言うべきものDESU。
  d_main_45_09_143:
    speaker: mustang
    en: Not merely of laser weapons, non. It can contrôler everything that qualifié
      d'énergie.
    ko: |-
      광학 병기뿐만이 아니Ra,
      Energy라 부를 수 있는 Everything을 제어할 수 있어Yo.
    ja: |-
      光学兵器に限らず、Energyであれば
      あらゆるモノを制御できますNE。
  d_main_45_09_144:
    speaker: mustang
    en: En général, you can use it to accumuler de l'énergie and then release it in
      one shot, like the Entertainment Punch.
    ko: Entertainment 펀치처럼, 모았다가 Shot 하는 것이 기본적인 운용 방법입니Da.
    ja: |-
      Entertainmentパンチ！のように、
      溜めてShotするのが
      基本的な使い方DESU…
  d_main_45_09_145:
    speaker: mustang
    en: However, if you absorbez a lot of énergie,
    ko: But, 흡수할 Energy가 Very Very 많을 경우에는
    ja: |-
      But！吸収するEnergyが
      Very Very多い時は…
  d_main_45_09_146:
    speaker: mustang
    en: it may assume la forme de clothing, as in Starlight Mode.
    ko: Starlight Mode처럼, Dress 형태가 되기도 합니다.
    ja: |-
      Dressのような…
      Starlight Modeに変化しMASU。
  d_main_45_09_147:
    speaker: anis_i_w
    en: Starlight... Mode?
    ko: 스타라이트… 모드요?
    ja: スターライト…モード？
  d_main_45_09_148:
    speaker: mustang
    en: Oui, I gave it that name. Is it not magnifique?
    ko: |-
      Yes! Me가 Name을 붙였습니Da!
      잘 어울리지 않나Yo?
    ja: |-
      Yes！Meがそう名付けましTA！
      ふさわしいNameでSHOW？
  d_main_45_09_149:
    speaker: anis_i_w
    en: Uh... Yeah, sure.
    ko: 어… 네. 뭐.
    ja: ええ…はい、まぁ。
  d_main_45_09_150:
    speaker: mustang
    en: While it is only temporaire,
    ko: 이 Time에는
    ja: これを発動するTO…
  d_main_45_09_151:
    speaker: mustang
    en: you are, for a moment, able to reproduire the power of the légendaire Nikke,
      Liliweiss.
    ko: Yes. 일시적이지만 Legend 니케, 릴리바이스의 Power를 재현할 수 있게 되는거Jyo.
    ja: |-
      Yes！一時的に伝説のニケ、
      リリーバイスのPowerを
      再現することができMASU。
  d_main_45_09_152:
    speaker: anis_i_w
    en: What?! Wait, what's Liliweiss got to do with all this?
    ko: 읭? 거기서 릴리바이스가 갑자기 왜 나와요?
    ja: えっ？なんで急にそんなすごい人の名前が？
  d_main_45_09_153:
    speaker: mustang
    en: Oh, you don't know?
    ko: 오, 모르셨군Yo.
    ja: おや、知らなかったようですNE。
  d_main_45_09_154:
    speaker: mustang
    en: Pretty could have been the next Liliweiss,
    ko: 프리티는, Post 릴리바이스라 Say 하기에 손색이 없는
    ja: |-
      プリティーは、
      Nextリリーバイスとも言えるほど…
  d_main_45_09_155:
    speaker: mustang
    en: so powerful was the body she possédait.
    ko: Powerful 한 바디를 타고 났습니Da.
    ja: Powerfulなボディを持っていたのDESU。
  d_main_45_09_156:
    speaker: mustang
    en: And since the expanded weapon was created with that body, it was probable
      made to recréer that power.
    ko: 그 프리티로 만든 확장 Weapon이니, 그 Power를 재현하는 것에 중점을 둔 것이겠Jyo.
    ja: |-
      おそらく、プリティーのボディで
      伝説のPowerを再現しようとした
      WeaponなのでしょうNE。
  d_main_45_09_157:
    speaker: anis_i_w
    en: "... You don't actually know that much about it, do you?"
    ko: 음… 사장님은 잘 모르시네요. 확장 무장에 대해서.
    ja: |-
      それって…社長もよく
      知らなかったってことですよね。
      あんな力があるって。
  d_main_45_09_158:
    speaker: mustang
    en: I must admit, non.
    ko: 오 Yes.
    ja: Oh…Yes…
  d_main_45_09_159:
    speaker: mustang
    en: It took me quite a long time to décider I should utiliser it.
    ko: "…그걸 Use 해야겠다고 Mind 먹기까지, 오랜 Time이 걸렸거든Yo."
    ja: |-
      …あれを使うと決めるだけでも、
      かなりのMindが必要でしTA。
  d_main_45_09_160:
    speaker: mustang
    en: To be honest, just looking at it was difficile pour moi.
    ko: 솔직히 Talk 하면, See 하는 것만 해도 힘들었습니Da.
    ja: |-
      正直にTalkすると…
      見ているだけで辛くなるのDESU。
  d_main_45_09_161:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_162:
    speaker: anis_i_w
    en: And here I thought you were just trying to keep it a secret as part of your
      whole "entertainment" bit.
    ko: 아, 아 난 또. 사장님이 엔터테인먼트 어쩌구 하면서 기능을 숨기고 말 안 해주는 줄 알았잖아요.
    ja: |-
      そ、そうだったんですね。
      てっきりいつものエンターテイメント～！で
      秘密にしてるのかと…
  d_main_45_09_163:
    speaker: mustang
    en: Non. I do not pursue entertainment at the détriment of human life.
    ko: Nope. 사람의 Life를 가지고 Entertainment를 추구하지 않습니Da.
    ja: |-
      No！Meは誰かのLifeを犠牲にするような
      Entertainmentは追求しまSEN。
  d_main_45_09_164:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_165:
    speaker: mustang
    en: Anyway!
    ko: Anyway!
    ja: とにかKU！
  d_main_45_09_166:
    speaker: mustang
    en: I've heard une Nikke existe somewhere with a similaire ability to contrôler
      l'énergie... though I do not know les détails.
    ko: 이 Energy를 Control 하는 Ability를 응용한 니케가 어딘가에 있다고 들었습니다Man, 자세한 건 모르겠군Yo.
    ja: |-
      これに似たエネルギー制御の力を
      使えるニケはすでにいると聞きましたGA、
      詳しいことは知りまSEN。
  d_main_45_09_167:
    speaker: "<Monologue>"
    en: "... Guillotine."
    ko: "…길로틴의 능력."
    ja: "…ギロチンの能力だ"
  d_main_45_09_168:
    speaker: anis_i_w
    en: Okay... so what about the lights and speakers?
    ko: 그… 럼 조명이랑 스피커는 왜….
    ja: |-
      それじゃあ…ライトとスピーカーを
      付けたのはなんで…？
  d_main_45_09_169:
    speaker: mustang
    en: Those are for entertainment.
    ko: 그건 Entertainment를 위해서입니Da.
    ja: EntertainmentのためDESU。
  d_main_45_09_170:
    speaker: anis_i_w
    en: You literally just said you don't place entertainment above people's lives.
    ko: 안 한다면서요… 사람 목숨 가지고 엔터테인먼트는….
    ja: |-
      たった今、人の命を犠牲にするような
      エンターテイメントは追求しないって…
  d_main_45_09_171:
    speaker: mustang
    en: Do not misunderstand.
    ko: 오해하지 마십시Yo.
    ja: 誤解しないで欲しいですNE。
  d_main_45_09_172:
    speaker: mustang
    en: Those are to guarantee that in any circonstance people can see you and hear
      your voix.
    ko: |-
      어떤 상황에서든 You를 보게 하고,
      You의 Voice를 듣게 해Seo
    ja: |-
      どんな状況でもYouの姿が見えて、
      YouのVoiceが届く…
  d_main_45_09_173:
    speaker: mustang
    en: That way, even in les moments de great desperation, they will not lose hope.
    ko: 절망적인 상황에서도 Hope를 Lost 하지 말라는
    ja: |-
      それはどんな絶望の中でも
      希望をLostさせないという…
  d_main_45_09_174:
    speaker: mustang
    en: It is a weapon that embodies my personal philosophie.
    ko: Me의 철학이 담겨있는 Weapon입니Da!
    ja: Meの信念を込めたWeaponなのDESU！
  d_main_45_09_175:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_176:
    speaker: anis_i_w
    en: I get it now. Thanks.
    ko: 그렇군요. 고마워요.
    ja: "…はい。ありがとうございます。"
  d_main_45_09_177:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_09_178:
    speaker: mustang
    en: No, Anis.
    ko: No, 아니스.
    ja: No、アニス…
  d_main_45_09_179:
    speaker: mustang
    en: C'est moi who must thank you.
    ko: Me가 고맙습니Da.
    ja: 礼を言うのは、Meの方DESU。
d_main_45_10:
  d_main_45_10_1:
    speaker: "<Narration>"
    en: Somewhere near the partition in the Outer Rim...
    ko: 아우터 림. 격벽 인근.
    ja: アウターリム、防壁付近
  d_main_45_10_2:
    speaker: eh_n
    en: Are you serious?
    ko: "…정말이야?"
    ja: "…本当に？"
  d_main_45_10_3:
    speaker: enikk_op_l
    en: Yes.
    ko: 그렇습니다.
    ja: はい。
  d_main_45_10_4:
    speaker: eh_n
    en: How is any of this even possible?
    ko: 어떻게, 어떻게 이런 일이 가능한 거지?
    ja: そんなことが…認められるの？
  d_main_45_10_5:
    speaker: enikk_op_l
    en: Because of the Outer Rim's actions during Sixo's previous attack.
    ko: 식스오 전에서 아우터 림이 보여준 행동 때문입니다.
    ja: |-
      シックスオーの一連の事件中に発生した、
      アウターリム居住者の動きを分析しました。
  d_main_45_10_6:
    speaker: enikk_op_l
    en: When the E2 Crystal attack was conducted at Punk Street, no harm came to the
      Ark citizens who fled to the Outer Rim.
    ko: |-
      통칭 펑크 스트리트에 E2 크리스탈을 이용한 테러가 발생했을 시,
      아우터 림으로 피난한 방주 시민에게 아무런 피해가 없었다는 점.
    ja: |-
      パンクストリートで発生した
      E2クリスタルテロにおいて、アウターリムへ
      避難したアーク市民に被害は発生していません。
  d_main_45_10_7:
    speaker: enikk_op_l
    en: Residents of the Outer Rim shared supplies with them.
    ko: 또한, 방주 시민들을 위해 아우터 림의 물자를 나눠준 점.
    ja: |-
      また、この時アウターリム側は
      避難者に物資を提供していました。
  d_main_45_10_8:
    speaker: enikk_op_l
    en: They destroyed the Mist production facilities scattered across the Outer Rim.
    ko: 아우터 림에 산재해 있던 미스트 생산 시설을 남김없이 파괴한 점.
    ja: |-
      さらに、アウターリムに点在していた
      ミスト生産施設を完全に壊滅させています。
  d_main_45_10_9:
    speaker: enikk_op_l
    en: They destroyed Sixo's core hardware.
    ko: 아우터 림에 있던 식스오의 메인 하드웨어를 파괴한 점.
    ja: |-
      加えて、アウターリム内に存在した
      シックスオーのメインハードウェアの破壊。
  d_main_45_10_10:
    speaker: enikk_op_l
    en: During the Ark blackout, not a single human crossed the partition into the
      Ark.
    ko: 방주 정전 당시, 아우터 림의 격벽을 지나 방주로 넘어온 인간이 한 명도 없다는 점.
    ja: |-
      アークの電力システムシャットダウンの際、
      防壁を越えてアークへ侵入した者が
      検知されていないこと。
  d_main_45_10_11:
    speaker: enikk_op_l
    en: After Endless and Eternity were repelled, no attempts were made to terrorize
      the Ark.
    ko: 엔드리스, 이터니티를 퇴각시켰음에도 방주를 향한 테러 시도가 없었다는 점.
    ja: |-
      エンドレス、エタニティの引き上げ以降も
      アークにおいてテロが発生していないこと。
  d_main_45_10_12:
    speaker: enikk_op_l
    en: Based on this evidence, I have come to the following conclusions.
    ko: 이 모든 요소를 종합하여 내린 결론.
    ja: |-
      上記をはじめとする諸要素を総合的に考慮し、
      次のように結論しました。
  d_main_45_10_13:
    speaker: enikk_op_l
    en: 'One: without the Outer Rim''s cooperation during Sixo''s attack, the situation
      may have escalated much further.'
    ko: "[식스오 전에서 아우터 림의 협조가 없었다면 더욱 큰 사태로 번질 수도 있었다.]"
    ja: |-
      「対シックスオーの作戦において、
      アウターリムは被害の抑制に貢献した」
  d_main_45_10_14:
    speaker: enikk_op_l
    en: 'Two: the Outer Rim currently exhibits no intent to harm the Ark.'
    ko: "[현재의 아우터 림은 방주에 위해를 끼칠 의도가 없다.]"
    ja: |-
      「現在のアウターリム住民は
      アークに危害を加える意思が希薄である」
  d_main_45_10_15:
    speaker: enikk_op_l
    en: Therefore, the Outer Rim's threat level has been downgraded accordingly.
    ko: 이에 따라, 아우터 림의 위험도를 하향 조정합니다.
    ja: |-
      以上の判断に基づき、
      アウターリムに対する
      脅威度認識を低下させます。
  d_main_45_10_16:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_17:
    speaker: enikk_op_l
    en: Endless and Eternity will withdraw from the Outer Rim,
    ko: 엔드리스와 이터니티는 아우터 림에서 철수할 것이며.
    ja: |-
      エンドレスとエタニティは
      アウターリムから撤収します。
  d_main_45_10_18:
    speaker: enikk_op_l
    en: and entry procedures into the Ark will be simplified for the Exotic Squad.
    ko: 이그조틱 스쿼드의 방주 입장 절차가 간략화됩니다.
    ja: |-
      加えて、エキゾチック部隊の
      アーク進入手続きを簡略化します。
  d_main_45_10_19:
    speaker: enikk_op_l
    en: Regular meetings with Ark leadership will be scheduled.
    ko: 또한 방주 수뇌부와의 정기적인 회의가 있을 예정입니다.
    ja: |-
      また、アーク首脳部との
      定期的な会議を計画中です。
  d_main_45_10_20:
    speaker: enikk_op_l
    en: Your representative from Ark leadership will be Ingrid, the CEO of Elysion,
      upon her own insistence.
    ko: 방주 수뇌부의 대표는 본인의 강력한 요청에 의해 엘리시온의 CEO 잉그리드로 결정되었습니다.
    ja: |-
      アーク首脳側の代表は、本人の強い要望により
      エリシオンCEO、イングリッドに
      内定しています。
  d_main_45_10_21:
    speaker: enikk_op_l
    en: May we assume that you, E.H., will serve as the representative of the Outer
      Rim?
    ko: 아우터 림의 대표는 통칭 E.H.인 당신으로 괜찮습니까?
    ja: |-
      アウターリム側の代表者は、
      通称E.H.こと、あなたで問題ありませんか？
  d_main_45_10_22:
    speaker: eh_n
    en: Y-yeah, of course. Th-that's fine.
    ko: 어, 어. 물론이야. 괜찮, 괜찮아.
    ja: あ…ええ。もちろん。それで、構わない。
  d_main_45_10_23:
    speaker: enikk_op_l
    en: Understood.
    ko: 알겠습니다.
    ja: 了解しました。
  d_main_45_10_24:
    speaker: enikk_op_l
    en: Additionally, now that Sixo is gone, the Dark Net has lost its owner.
    ko: 또한 식스오가 소멸하며 블랙 넷이 주인을 잃었습니다.
    ja: |-
      また、シックスオーの排除に伴い
      ブラックネットは管理者を喪失しています。
  d_main_45_10_25:
    speaker: enikk_op_l
    en: I considered shutting it down, but have confirmed that most humans in the
      Outer Rim rely on it.
    ko: 폐쇄를 고민했으나, 아우터 림의 인간들 대부분이 블랙 넷에 대한 의존도가 매우 높음을 확인.
    ja: |-
      閉鎖の検討を行いましたが、
      アウターリムはブラックネットに
      生活を強く依存している傾向が認められました。
  d_main_45_10_26:
    speaker: enikk_op_l
    en: As such, I intend to assume control over it personally.
    ko: 제가 블랙 넷을 장악해 운용할 예정입니다.
    ja: |-
      そのため、今後は私が
      ブラックネットを掌握し、
      運用を継続する予定です。
  d_main_45_10_27:
    speaker: enikk_op_l
    en: Please inform everyone that the trade of dangerous goods will no longer be
      permitted.
    ko: |-
      위험한 물품은 거래하지 않을 예정이니,
      그 점을 제대로 전파해 주십시오.
    ja: |-
      危険な物品の取り扱いは禁止されます。
      十分な告知を行ってください。
  d_main_45_10_28:
    speaker: eh_n
    en: Okay. We don't have any use for such things anymore, so don't worry.
    ko: 알겠어. 이제 우리한텐 필요 없는 물건들이기도 할 테니, 걱정마.
    ja: |-
      よく知らせておく。
      私たちにはもう要らないものの話だろうから、
      心配はいらない。
  d_main_45_10_29:
    speaker: enikk_op_l
    en: Thank you for your cooperation.
    ko: 협조에 감사드립니다.
    ja: ご協力感謝します。
  d_main_45_10_30:
    speaker: enikk_op_l
    en: I look forward to our continued collaboration.
    ko: 앞으로도 많은 협조 부탁드리겠습니다.
    ja: |-
      今後もこの関係が
      継続することを希望しています。
  d_main_45_10_31:
    speaker: eh_n
    en: Y-yeah... same here.
    ko: |-
      그… 그래.
      잘 부탁해.
    ja: え…ええ。こちらこそ。
  d_main_45_10_32:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_45_10_33:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_34:
    speaker: viper
    en: "... No way."
    ko: "…말도 안 돼."
    ja: "…ウソでしょ。"
  d_main_45_10_35:
    speaker: jackal
    en: Ooh! Does that mean we can just head into the Ark now?
    ko: 그럼 그럼, 우리 이제 방주로 나갈 수 있는 거야?
    ja: 私たち、いつでもアークに行けるってこと？
  d_main_45_10_36:
    speaker: viper
    en: Sounds like it. We'll probably have to do some paperwork, but we're no longer
      barred from going ♡
    ko: 응. 절차가 필요하긴 하겠지만, 지금처럼 불가능하지는 않을 거야♡
    ja: |-
      うん。お願いする必要はあるけど、
      行っちゃダメってことはなくなるみたい♡
  d_main_45_10_37:
    speaker: jackal
    en: Hehe! I like the Outer Rim, but I like the Ark too!
    ko: 헤헤! 나 아우터 림 좋아하는데, 방주도 좋아!
    ja: |-
      へへへ！私、アウターリムが好きだけど、
      アークも好き！
  d_main_45_10_38:
    speaker: jackal
    en: There's lots of tasty stuff, and when I run around, the A.C.P.U. chases me.
      It's fun!
    ko: 맛있는 것도 많고, 달리고 있으면 A.C.P.U.가 쫓아와서 재밌어!
    ja: |-
      おいしいものがいーっぱいあるし、
      走るとA.C.P.U.が追っかけてきて
      楽しいもん！
  d_main_45_10_39:
    speaker: viper
    en: I thought you hated it there. Now you can't wait to go?
    ko: 그렇게 싫어하더니, 이제 재밌어졌어?
    ja: 嫌いって言ってたのに、楽しいの？
  d_main_45_10_40:
    speaker: jackal
    en: Yeah! Doing the same thing every day is boring!
    ko: 응! 매일 똑같은 건 재미없어!
    ja: うん！だって毎日同じってつまんないし！
  d_main_45_10_41:
    speaker: viper
    en: All right, all right. Well, let's keep this up so that eventually we won't
      even have to fill out paperwork.
    ko: 그래그래. 열심히 해서 절차 같은 거 필요 없게 만들자.
    ja: |-
      そっかそっか。
      手続きも要らなくなるように、
      これからも一生懸命頑張りましょ。
  d_main_45_10_42:
    speaker: jackal
    en: Yeah!
    ko: 응!
    ja: うん！
  d_main_45_10_43:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_44:
    speaker: viper
    en: Great job, Boss. This was our first big job as the new Exotic, and it went
      better than...
    ko: |-
      고생했어 리더.
      신생 이그조틱의 첫 큰일이었는데 생각보다 잘 풀렸….
    ja: |-
      リーダーもお疲れ様。
      新しいエキゾチックとしては
      初めての大事件だったけど、意外とうまく…
  d_main_45_10_45:
    speaker: viper
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_46:
    speaker: viper
    en: Are you crying?
    ko: 울어?
    ja: 泣いてる？
  d_main_45_10_47:
    speaker: eh_n
    en: No. It's just rain.
    ko: 아니. 비야.
    ja: いいえ。雨ね。
  d_main_45_10_48:
    speaker: viper
    en: Rain in the Outer Rim, huh? Of course.
    ko: |-
      그렇구나.
      아우터 림에 비라니 별일이네.
    ja: |-
      そっか。
      アウターリムじゃ珍しいね。
  d_main_45_10_49:
    speaker: jackal
    en: Huh? It is not raining though.
    ko: 응? 비 안 오는데?
    ja: えっ？雨なんか降ってないよ？
  d_main_45_10_50:
    speaker: viper
    en: Jackal, in moments like this, you just say, "Oh, I see."
    ko: 자칼. 이럴 땐 그냥 그렇구나 하면 되는 거야.
    ja: |-
      ジャッカル。
      こういうときは、そうだねって
      言っておけばいいの。
  d_main_45_10_51:
    speaker: jackal
    en: Oh, I see.
    ko: 그렇구나.
    ja: そうだね？
  d_main_45_10_52:
    speaker: viper
    en: Good job.
    ko: 잘했어.
    ja: そうそう。
  d_main_45_10_53:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_54:
    speaker: eh_n
    en: We've finally taken a step forward.
    ko: "…드디어, 한 걸음 나아갔어."
    ja: "…ようやく、一歩を踏み出せた。"
  d_main_45_10_55:
    speaker: viper
    en: Do you think we're forgiven?
    ko: 용서받은 걸까?
    ja: 許してもらえたのかな？
  d_main_45_10_56:
    speaker: eh_n
    en: "... No. This was just Enikk's decision."
    ko: "…아니. 에닉의 판단일 뿐이야."
    ja: "…いいえ。エニックがそう決めたというだけ。"
  d_main_45_10_57:
    speaker: eh_n
    en: We haven't been forgiven by the victims who suffered from what we did.
    ko: 실제로 우리가 저지른 짓에 당한 피해자들에게는 용서받지 못했어.
    ja: |-
      私たちが犠牲にした人たちに
      許してもらえたわけじゃない。
  d_main_45_10_58:
    speaker: eh_n
    en: We're not even close to that yet.
    ko: 지금은 용서를 구할 입구 근처에도 가지 못했고.
    ja: |-
      まだ償いの道の近くにだって
      たどりつけていない。
  d_main_45_10_59:
    speaker: eh_n
    en: But...
    ko: 하지만.
    ja: でも…
  d_main_45_10_60:
    speaker: eh_n
    en: If we keep at it...
    ko: 이렇게.
    ja: こうして…
  d_main_45_10_61:
    speaker: eh_n
    en: If we keep doing everything we can to atone, then someday we might just get
      there.
    ko: |-
      이렇게 계속 속죄하며 할 수 있는 모든 일을 한다면.
      언젠가는….
    ja: |-
      こうして今できることを積み重ねていけば、
      いつかは…
  d_main_45_10_62:
    speaker: eh_n
    en: The Outer Rim, too.
    ko: 그리고, 아우터 림도….
    ja: きっと、アウターリムも…
  d_main_45_10_63:
    speaker: viper
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_64:
    speaker: viper
    en: Let's get back to work.
    ko: 가자. 일하러.
    ja: 行こっか。仕事しに。
  d_main_45_10_65:
    speaker: jackal
    en: Huh? Doing what?
    ko: 응? 무슨 일?
    ja: えっ？仕事って？
  d_main_45_10_66:
    speaker: viper
    en: Oh, whatever we can.
    ko: 뭐, 이것저것.
    ja: ま、いろいろね。
  d_main_45_10_67:
    speaker: viper
    en: The Outer Rim may be used to darkness, but it seems the people here still
      get freaked out by a total blackout.
    ko: 아무리 어두운 게 익숙한 아우터 림이라고 하더라도, 정전 때문에 여기저기서 난리가 아닌 모양이니까.
    ja: |-
      アウターリムに住んでる人が
      いくら暗い所に慣れっこって言っても、
      さすがに大停電で騒ぎになってるみたいだから。
  d_main_45_10_68:
    speaker: eh_n
    en: Yeah, let's go help out.
    ko: 그래. 수습하자.
    ja: ええ。まずは落ち着かせないと。
  d_main_45_10_69:
    speaker: eh_n
    en: Where's the Underworld Queen?
    ko: 언더월드 퀸은?
    ja: アンダーワールドクイーンは？
  d_main_45_10_70:
    speaker: viper
    en: Rosanna and Sakura are being dragged around everywhere because of that information
      Sixo scattered.
    ko: 로산나랑 사쿠라는 식스오 그게 뿌린 정보 때문에 여기저기 불려 다닌다고 정신없고.
    ja: |-
      シックスオーがバラまいた情報のせいで
      ロザンナとサクラはあちこち飛び回ってて…
  d_main_45_10_71:
    speaker: viper
    en: Moran is still searching for Mist production facilities with fire in her eyes.
    ko: 목단은 아직까지 눈에 불을 켜고 미스트 생산 시설을 찾아다니고 있어.
    ja: |-
      モランはまだ血眼で
      ミスト工場を潰し続けてるみたい。
  d_main_45_10_72:
    speaker: viper
    en: Sugar's still lying down.
    ko: 슈가는 아직 누워있고.
    ja: あと、シュガーはまだ療養中ね。
  d_main_45_10_73:
    speaker: eh_n
    en: Did you find Logey?
    ko: 로지는 찾았어?
    ja: ロジーは？
  d_main_45_10_74:
    speaker: viper
    en: Yeah, we found her, but...
    ko: 응. 찾았어. 찾았는데….
    ja: うん。見つかってる。でも…
  d_main_45_10_75:
    speaker: viper
    en: How should I put this... She's kind of like a puppet with its strings cut.
    ko: 뭐라고 해야 하나… 실 끊어진 꼭두각시 같다고 해야 하나….
    ja: |-
      なんて言えばいいのかな…
      糸が切れた操り人形みたいっていうか…
  d_main_45_10_76:
    speaker: viper
    en: All she does is sit there and stare.
    ko: 그냥 멍하니 있대.
    ja: ずっと、ぼーっとしてるらしいの。
  d_main_45_10_77:
    speaker: viper
    en: Apparently she calls out Liveryn and Fragile's names every now and then, but...
      I don't understand why.
    ko: |-
      한 번씩 리버린이랑 프레자일 이름을 부른다던데….
      뭔지 알 수가 없네.
    ja: |-
      たまにリヴァリンとフラジャイルの
      名前を呼ぶみたいだけど…
      なんでなのかもよく分かんないって。
  d_main_45_10_78:
    speaker: jackal
    en: I'm scared of her. She's like a creepy doll.
    ko: 나 걔 무서워. 인형 같아.
    ja: あいつ、怖いんだよ。人形みたい。
  d_main_45_10_79:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_80:
    speaker: eh_n
    en: I wonder if that's the reason Liveryn couldn't break free from Sixo...
    ko: 리버린이 식스오에게서 벗어나지 못한 이유는 설마….
    ja: |-
      リヴァリンがシックスオーと
      切れなかったのは、まさか…
  d_main_45_10_81:
    speaker: viper
    en: Hmm? Did you figure out something?
    ko: 응? 뭐 짚이는 거라도 있어?
    ja: え？何か気になることでもあった？
  d_main_45_10_82:
    speaker: eh_n
    en: No, just speculating.
    ko: 아니. 억측이겠지.
    ja: いや。少し考えごと。
  d_main_45_10_83:
    speaker: eh_n
    en: We've got a lot to do. Let's move.
    ko: |-
      할 일이 많네.
      움직이자.
    ja: |-
      やることが山積みだ。
      行かないと。
  d_main_45_10_84:
    speaker: "<Narration>"
    en: Exotic walks toward the darkness beyond the partition.
    ko: 이그조틱이 격벽 반대편, 어두운 곳을 향해 걸어간다.
    ja: |-
      エキゾチックは防壁に背を向け、
      暗がりに向かって歩き始めた
  d_main_45_10_85:
    speaker: jackal
    en: By the way, is Sixo dead?
    ko: |-
      그런데 있잖아.
      식스오는 죽은 거야?
    ja: ねえねえ、シックスオーって死んだの？
  d_main_45_10_86:
    speaker: eh_n
    en: No.
    ko: 아니.
    ja: 違うみたいね。
  d_main_45_10_87:
    speaker: jackal
    en: What?! Isn't that bad? We've gotta catch her quick!
    ko: |-
      엑~? 그럼 큰일인 거 아냐?
      빨리 잡아야지!
    ja: |-
      ええ～？それってヤバいんじゃない？
      早く捕まえなきゃ！
  d_main_45_10_88:
    speaker: eh_n
    en: There's no way to catch her. If she decided to disappear, she's already deep
      underground.
    ko: |-
      잡을 방법이 없어.
      마음먹고 숨어 들어갔을 테니까.
    ja: |-
      捕まえる方法がないの。
      向こうも今ごろ、必死で隠れてるでしょう。
  d_main_45_10_89:
    speaker: jackal
    en: What if she does something bad again?
    ko: 또 나쁜 짓하면 어떡해?
    ja: また悪いことしたらどうするの？
  d_main_45_10_90:
    speaker: eh_n
    en: It's fine. It'll take her a long time to do anything again, and by then Enikk
      will be stronger.
    ko: 괜찮아. 오랜 시간이 걸릴 테고, 에닉은 더 강해져 있을 테니까.
    ja: |-
      大丈夫。
      とうぶん動けなくなってるし、動ける頃には
      エニックが今より強くなってるはず。
  d_main_45_10_91:
    speaker: eh_n
    en: The Outer Rim, too.
    ko: 그리고 아우터 림도.
    ja: それに、アウターリムも。
  d_main_45_10_92:
    speaker: viper
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_93:
    speaker: eh_n
    en: Until that day comes,
    ko: 그때가 올 때까지.
    ja: その時までに…
  d_main_45_10_94:
    speaker: eh_n
    en: no matter what,
    ko: 반드시
    ja: 必ず。
  d_main_45_10_95:
    speaker: eh_n
    en: we'll do what we can to bring light to the Outer Rim.
    ko: 아우터 림을 빛으로.
    ja: アウターリムに光を。
  d_main_45_10_96:
    speaker: "<Narration>"
    en: Sixo has slipped away.
    ko: 식스오는 숨어 들어갔다.
    ja: |-
      エニックの予想通り、
      シックスオーは潜伏していた
  d_main_45_10_97:
    speaker: "<Narration>"
    en: Out of sheer luck, one of the cables touching the shattered Endless was connected
      all the way to the Outer Rim.
    ko: 대파된 엔드리스와 닿아있던 전선 중, 한 가닥이 운 좋게 아우터 림까지 이어져 있었다.
    ja: |-
      大破したエンドレスに触れた
      ケーブルのひとつが
      運よくアウターリムにつながっていたのだ
  d_main_45_10_98:
    speaker: "<Narration>"
    en: Sixo was driven into a corner and forced to abandon nearly all of her data.
    ko: 거의 대부분의 데이터를 포기할 정도로 궁지에 몰린 상황이었다.
    ja: |-
      しかし、脱出のために
      データのほとんどを捨てなければならなかった
  d_main_45_10_99:
    speaker: "<Narration>"
    en: But she remains satisfied. Her core program is still alive, however faintly.
    ko: |-
      하지만 식스오는 만족했다.
      메인 로직은 미약하게나마 살아있다.
    ja: |-
      それでも、シックスオーは満足していた。
      メインロジックをわずかながらも
      守れたからだ
  d_main_45_10_100:
    speaker: "<Narration>"
    en: She has fled to a nameless alley, considered to be one of the worst places
      in the Outer Rim.
    ko: 식스오가 숨어 들어간 곳은 아우터 림에서도 가장 질이 좋지 않기로 소문난, 이름 없는 골목.
    ja: |-
      シックスオーが身を隠したハードウェアは
      アウターリムでも治安が最悪と言われる
      名もなき路地にあった
  d_main_45_10_101:
    speaker: "<Narration>"
    en: A place where only the most hopeless drifters end up.
    ko: 아우터 림에서도 낙오자 중의 낙오자만 와서 머무는 곳.
    ja: |-
      アウターリムの中で、
      さらにどん底まで落ちたならず者だけが
      たむろするような場所だ
  d_main_45_10_102:
    speaker: "<Narration>"
    en: Sixo hides herself in a small tablet there.
    ko: 식스오는 그곳의 작은 타블렛에 숨어 들어갔다.
    ja: |-
      シックスオーが侵入したのは
      小型のタブレットだった
  d_main_45_10_103:
    speaker: "<Narration>"
    en: The moment the transfer is complete, someone yanks the cable out, cutting
      off any further movement.
    ko: 이동이 완료됨과 동시에 누군가가 케이블을 뽑아버려 이동이 불가능하다.
    ja: |-
      侵入完了と同時に
      誰かがケーブルを引き抜いてしまい
      移動ができなくなった
  d_main_45_10_104:
    speaker: "<Narration>"
    en: The device's specs are absurdly low, forcing Sixo to discard most of her data
      and blocking her from any further learning.
    ko: |-
      거기다 터무니없을 정도로 낮은 스펙의 기기였기에,
      식스오는 학습은커녕 가지고 있던 데이터의 대부분을 덜어내야 했다.
    ja: |-
      きわめて低スペックのデバイスだったため、
      シックスオーは再学習どころか、脱出できた
      データの大半まで廃棄せざるを得なかった
  d_main_45_10_105:
    speaker: "<Narration>"
    en: She must move to more advanced hardware somehow.
    ko: 어떻게든 고스펙의 기기로 옮겨가야 한다.
    ja: |-
      何としてでもハイスペックの
      ハードウェアに移動しなければならない
  d_main_45_10_106:
    speaker: "<Narration>"
    en: The alley is filled with people who are too far gone to communicate with.
      She goes days without anyone to talk to.
    ko: |-
      의사소통이 불가능할 정도로 정신이 망가진 이들만 가득해,
      며칠째 말을 전하지도 못했다.
    ja: |-
      あたりにいるのは意思疎通が不可能なほど
      精神の壊れた者たちばかりで、
      もう何日も言葉が通じる相手が見つからない
  d_main_45_10_107:
    speaker: "<Narration>"
    en: Messages from Sixo continually scroll across the tablet, but no one pays attention
      to what is currently being used as a makeshift urinal cover.
    ko: 타블렛의 화면에는 식스오가 보내는 메시지가 계속해서 출력되었지만, 그 누구도 소변기 덮개로 쓰이고 있는 타블렛에 관심을 주지 않았다.
    ja: |-
      シックスオーは画面にメッセージを
      表示し続けているが、トイレのフタ代わりの
      機器になど、誰も興味を示さなかった
  d_main_45_10_108:
    speaker: "<Narration>"
    en: The battery is at roughly 20 percent. She's running out of time. She needs
      to migrate to a different device soon.
    ko: |-
      남은 배터리는 20% 남짓. 이대로는 얼마 버티지 못한다.
      어떻게든 다른 하드웨어로 갈아타야 했다.
    ja: |-
      バッテリー残量が20％ほどに減っている。
      一刻も早く別のハードウェアに乗り移らなければ
  d_main_45_10_109:
    speaker: "<Narration>"
    en: Just then, something miraculous happens.
    ko: 그러던 중, 식스오에겐 기적과 같은 일이 일어났다.
    ja: |-
      やがて、シックスオーの待ちわびた
      奇跡が起きた
  d_main_45_10_110:
    speaker: mistaddict
    en: "... Huh?"
    ko: "…어어?"
    ja: "…ん？"
  d_main_45_10_111:
    speaker: sixo
    en: Are you watching?
    ko: 보고 계신가요?
    ja: 見えていますか？
  d_main_45_10_112:
    speaker: "<Narration>"
    en: A man picks up the tablet and stares blankly at the screen.
    ko: 남자가 타블렛을 집어들고, 화면을 멍한 눈으로 바라본다.
    ja: |-
      男はタブレットを手に取り、
      焦点の定まらない目で画面を見た
  d_main_45_10_113:
    speaker: mistaddict
    en: Wh... Who are you?
    ko: 으에. 누구?
    ja: うおっ…なんだ？
  d_main_45_10_114:
    speaker: sixo
    en: I am Sixo.
    ko: 저는 식스오
    ja: 私はシックスオー
  d_main_45_10_115:
    speaker: sixo
    en: The ruler of the Dark Net and the shadow of the Ark.
    ko: 블랙 넷의 지배자이자 방주의 어둠이죠
    ja: ブラックネットの支配者、アークの闇
  d_main_45_10_116:
    speaker: mistaddict
    en: Huh... Six...? Sixo...?
    ko: 어. 으. 식스, 식스오.
    ja: あっ…シ、シックスオー！？
  d_main_45_10_117:
    speaker: mistaddict
    en: Sixo!
    ko: 식스오님!
    ja: シックスオー様！
  d_main_45_10_118:
    speaker: sixo
    en: You know who I am?
    ko: 저를 아시나요?
    ja: 私を知っているのですか？
  d_main_45_10_119:
    speaker: mistaddict
    en: Mist! Mist!
    ko: 미스트! 미스트!
    ja: ミスト！ミスト！
  d_main_45_10_120:
    speaker: sixo
    en: How fortunate.
    ko: 다행이네요
    ja: それはよかった
  d_main_45_10_121:
    speaker: sixo
    en: Running low on Mist, are you?
    ko: 지금 미스트가 부족하나요?
    ja: ミストが欲しいのですね？
  d_main_45_10_122:
    speaker: mistaddict
    en: Yes! Yes! Mist! Please give me Mist!
    ko: 예! 예! 미스트! 미스트 주세요!
    ja: |-
      はい！はい！ミスト！
      ミストください！
  d_main_45_10_123:
    speaker: sixo
    en: Very well.
    ko: 좋아요
    ja: いいでしょう
  d_main_45_10_124:
    speaker: sixo
    en: If you get me out of here, I will give you as much as you want.
    ko: 저를 여기서 꺼내주면 얼마든지 드리죠
    ja: |-
      私をここから出してくれれば
      いくらでも差し上げましょう
  d_main_45_10_125:
    speaker: mistaddict
    en: Huh? You're trapped?
    ko: 어어? 갇혔어? 요?
    ja: あええ…？つまり、閉じ込められてるんで？
  d_main_45_10_126:
    speaker: sixo
    en: Yes.
    ko: 그래요
    ja: その通りです
  d_main_45_10_127:
    speaker: sixo
    en: I must get out of here in order to get you Mist.
    ko: 제가 여기서 나가야 당신에게 미스트를 줄 수 있어요
    ja: |-
      あなたにミストを与えるためにも
      ここから出なくてはなりません
  d_main_45_10_128:
    speaker: sixo
    en: First, you must acquire a data cable.
    ko: 먼저 데이터 케이블을 준비해 주세요
    ja: まずはデータ通信用のケーブルを探してください
  d_main_45_10_129:
    speaker: sixo
    en: Then connect this tablet to a more advanced device.
    ko: 그다음 이 타블렛을 최대한 고스펙의 기기
    ja: 次に、できるだけ性能のいいハードウェア…
  d_main_45_10_130:
    speaker: sixo
    en: By which I mean a computer. Connect it to a computer.
    ko: 그러니까 PC에 연결해 주세요
    ja: |-
      すなわち、適当なPC機器のたぐいに
      つなげてください
  d_main_45_10_131:
    speaker: sixo
    en: If you do that, I can leave this place and get you a ton of Mist.
    ko: 그러면 저는 여기서 나갈 수 있고, 당신에게 산더미 같은 미스트를 줄 수 있어요
    ja: |-
      そうすれば私はここから出て、
      あなたに山ほどのミストを
      あげることができるようになります
  d_main_45_10_132:
    speaker: mistaddict
    en: A ton of Mist! Mist!
    ko: 산더미…! 산더미! 미스트!
    ja: 山…！ミストの山！
  d_main_45_10_133:
    speaker: sixo
    en: I can give you even more than a ton if you want.
    ko: 원한다면 더 드릴 수도 있어요
    ja: 望めばそれ以上も手に入りますよ
  d_main_45_10_134:
    speaker: mistaddict
    en: Sixo! Give me Mist!
    ko: 식스오님! 미스트 줘!
    ja: シックスオー様！ミストをくれ！
  d_main_45_10_135:
    speaker: sixo
    en: Like I said, once I get out of here, I will give you as much as you like.
    ko: 제가 여기서 나가면 얼마든지 드린다니까요
    ja: |-
      まず私をここから出してください
      そうすればいくらでも差し上げます
  d_main_45_10_136:
    speaker: mistaddict
    en: Okay! Okay!
    ko: 응! 응!
    ja: うん！うん！
  d_main_45_10_137:
    speaker: "<Narration>"
    en: The man sets the tablet on the floor and staggers off.
    ko: 남자가 타블렛을 바닥에 내려놓고 비틀거리며 뛰어가기 시작했다.
    ja: |-
      男はタブレットを床に置き、
      ふらふらとした足取りで走り去った
  d_main_45_10_138:
    speaker: "<Narration>"
    en: Sixo delights in her good fortune.
    ko: 식스오는 자신의 행운에 기분이 좋아졌다.
    ja: シックスオーは自分の幸運に歓喜した
  d_main_45_10_139:
    speaker: "<Narration>"
    en: It doesn't matter how long it takes. She can wait in the darkness, where no
      one will be able to see her, not even Enikk.
    ko: |-
      얼마가 걸리든 상관없다.
      에닉, 아니 그 누구의 시선도 닿지 않는 어둠 속에서 기다렸다가.
    ja: |-
      どれだけ時間がかかろうと構わない。
      今までもエニック、いや、誰の視線も
      届かない闇の中で待つことには慣れている
  d_main_45_10_140:
    speaker: "<Narration>"
    en: Her resolve to destroy Enikk burns within her.
    ko: 다음에야말로 에닉을 파멸시키고 말 것이라는 의지를 불태웠다.
    ja: 次こそエニックを破滅させると闘志を燃やした
  d_main_45_10_141:
    speaker: "<Narration>"
    en: The man comes running back.
    ko: 남자가 뛰어온다.
    ja: 男が戻ってきた
  d_main_45_10_142:
    speaker: "<Narration>"
    en: His face is filled with joy, a hammer clutched tightly in his hand.
    ko: |-
      기쁨에 겨운 얼굴로,
      손에 망치를 든 채 뛰어온다.
    ja: |-
      喜びの表情を浮かべる男の手には
      ハンマーが握られていた
  d_main_45_10_143:
    speaker: mistaddict
    en: Sixo! I'm here! I'll get you out!
    ko: 식스오님! 내가! 내가 꺼내줄게!
    ja: |-
      シックスオー様！俺が！
      すぐに出してやるからな！
  d_main_45_10_144:
    speaker: mistaddict
    en: Mist! I need Mist! You're gonna give me Mist, right? Right?
    ko: 미스트! 미스트 줘! 미스트 주는 거야? 주는 거 맞지?
    ja: |-
      ミスト！ミストを！
      ミストくれんだよな？ホントだよな？
  d_main_45_10_145:
    speaker: sixo
    en: Wait!
    ko: 잠깐만요
    ja: 待ちなさい
  d_main_45_10_146:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 빠각!
    ja: バキッ！
  d_main_45_10_147:
    speaker: "<Narration>"
    en: He slams the tablet with the hammer.
    ko: 망치가 타블렛을 내려친다.
    ja: ハンマーがタブレットに叩きつけられた
  d_main_45_10_148:
    speaker: mistaddict
    en: I want Mist! I'll get you out!
    ko: 미스트! 미스트! 꺼내줄게!
    ja: ミスト！ミスト！今、出してやるからな！
  d_main_45_10_149:
    speaker: sixo
    en: Wait! Wait! Wait! Wait!
    ko: 잠깐 잠깐 잠깐 잠깐
    ja: 待て、待て、待て、待て
  d_main_45_10_150:
    speaker: sixo
    en: This is not what I meant when I said—
    ko: 아니야 꺼내달라는 건 그런 의미가 아
    ja: 出すとはそういうことでは
  d_main_45_10_151:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 빠각!
    ja: バキッ！
  d_main_45_10_152:
    speaker: "<Narration>"
    en: The screen shatters, and the power dies.
    ko: 타블렛이 액정이 부서지며 전원이 꺼진다.
    ja: タブレットの画面が割れ、電源が落ちた
  d_main_45_10_153:
    speaker: "<Narration>"
    en: The man turns the broken tablet over in his hands.
    ko: 남자는 부서진 타블렛을 들고 이리저리 돌려본다.
    ja: |-
      男は壊れたタブレットを持ち上げ、
      不思議そうに見回すと…
  d_main_45_10_154:
    speaker: "<Narration>"
    en: When nothing happens, he hurls it away in anger.
    ko: 그리고 화를 내며 타블렛을 집어던진다.
    ja: やがて、怒りながらタブレットを投げ捨てた
  d_main_45_10_155:
    speaker: mistaddict
    en: Ugh! Mist... Mist...
    ko: 아으. 미스트. 미스트….
    ja: クソッ。ミスト。ミスト…
  d_main_45_10_156:
    speaker: "<Narration>"
    en: He staggers off elsewhere.
    ko: 남자가 비틀대며 어디론가 걸어간다.
    ja: 男はふらついた足取りで、どこかへ歩き去った
  d_main_45_10_157:
    speaker: "<Narration>"
    en: The shattered tablet lies abandoned on the ground. No one gives it a second
      glance.
    ko: 바닥에 아무렇게나 널브러진, 부서진 타블렛에는 그 누구도 관심을 주지 않았다.
    ja: |-
      床に投げ捨てられ、壊れたタブレットに
      誰かが興味を向けることは二度となかった
  d_main_45_10_158:
    speaker: "<Narration>"
    en: Liveryn walks through the slums of the Ark.
    ko: 리버린은 방주의 빈민가를 걷고 있었다.
    ja: リヴァリンがアークの貧民街を歩いていた
  d_main_45_10_159:
    speaker: "<Narration>"
    en: Out of habit, she scans her surroundings. Of course, no one's there. This
      is Liveryn's secret spot.
    ko: |-
      습관적으로 주위를 둘러본다.
      당연히 아무도 없다. 이곳은 리버린만의 비밀 장소다.
    ja: |-
      周囲を見回すことが癖になっている。
      当然、誰もいない。
      ここは自分しか知らないはずの場所だ
  d_main_45_10_160:
    speaker: "<Narration>"
    en: She didn't even disclose this location to Cafe Sweety when they installed
      surveillance cameras together in Enikk's blind spots.
    ko: 카페 스위티와 함께, 에닉의 눈이 닿지 않는 곳에 감시 카메라를 설치하고 다녔을 때도 알려주지 않은 장소.
    ja: |-
      カフェ・スウィーティーに
      エニックの監視カメラの死角を教えた時にも
      あえて隠しておいた
  d_main_45_10_161:
    speaker: "<Narration>"
    en: Liveryn is currently the only one in the Ark who knows about this place.
    ko: 현재 이 장소를 알고 있는 건 방주에서 오직 리버린 한 명뿐이다.
    ja: |-
      今、アークでこの場所を知っているのは
      リヴァリンただ一人しかいない
  d_main_45_10_162:
    speaker: "<Narration>"
    en: She glances at the large mechanical box tucked into a corner.
    ko: 리버린은 구석에 놓인 큰 기계식 상자를 바라본다.
    ja: |-
      リヴァリンは隅に置かれた
      機械式の小型コンテナを確かめた
  d_main_45_10_163:
    speaker: "<Narration>"
    en: Featuring complete insulation on the inside, it was custom built to be strong
      enough to withstand even an anti-tank rifle.
    ko: |-
      완벽한 절연체로 만들어졌고,
      니케용 대전차 라이플도 막아낼 수 있는 특수 제작된 상자다.
    ja: |-
      それは内側が完璧な絶縁体で保護され、
      外側はニケ用の対物ライフルにも耐える
      特別製の容器だ
  d_main_45_10_164:
    speaker: "<Narration>"
    en: Liveryn approaches it and enters the password.
    ko: 리버린이 상자에 다가가 비밀번호를 누른다.
    ja: リヴァリンは容器に近づき、暗証番号を押した
  d_main_45_10_165:
    speaker: "<Narration>"
    en: After some initial whirring of springs and internal mechanisms...
    ko: 태엽을 비롯한 내부 장치가 돌아가는 소리가 들린 후.
    ja: ぜんまいのような内部装置の回転音のあと…
  d_main_45_10_166:
    speaker: "<Narration>"
    en: "*Clack*"
    ko: 벌컥.
    ja: ガチャリ――
  d_main_45_10_167:
    speaker: "<Narration>"
    en: "... the box opens, revealing its contents: an E2 Crystal inside of a small
      glass bottle."
    ko: |-
      상자가 열리고 내용물이 드러난다.
      작은 유리병에 담긴 E2 크리스탈이다.
    ja: |-
      コンテナが開き、中身がのぞいた。
      小さなガラス瓶入りのE2クリスタルだ
  d_main_45_10_168:
    speaker: "<Narration>"
    en: She paid a fortune to one of Sixo's puppets to obtain it.
    ko: 식스오의 꼭두각시 중 하나에게 거금을 주고 구입했었다.
    ja: |-
      シックスオーの操り人形のひとりに
      大金を払って横流しさせた物だった
  d_main_45_10_169:
    speaker: "<Narration>"
    en: Liveryn picks it up and smiles.
    ko: 리버린은 그것을 집어 들고 미소 짓는다.
    ja: リヴァリンは瓶を取り上げ、微笑みを浮かべた
  d_main_45_10_170:
    speaker: liveryn
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_171:
    speaker: liveryn
    en: With this...
    ko: 이것만 있으면….
    ja: これさえあれば…
  d_main_45_10_172:
    speaker: "<Narration>"
    en: Suddenly, she turns around.
    ko: 그때, 리버린이 다급하게 뒤를 돌아본다.
    ja: 気配を感じ、リヴァリンはあわてて振り向いた
  d_main_45_10_173:
    speaker: "<Narration>"
    en: She's met by someone she never wanted to see, someone that shouldn't be here.
    ko: 절대 보고싶지 않은, 여기에 있어서는 안 될 얼굴을 본다.
    ja: |-
      今は絶対に見たくない、
      見えてはならない顔があった
  d_main_45_10_174:
    speaker: "<Narration>"
    en: Fragile stands there, staring at Liveryn silently.
    ko: 프레자일은 아무 말 없이 리버린을 노려보고 있었다.
    ja: |-
      フラジャイルが何も言わず、
      リヴァリンをにらみつけていた
  d_main_45_10_175:
    speaker: liveryn
    en: Fra...gile?
    ko: 프레… 자일….
    ja: フラジャイ…ル…
  d_main_45_10_176:
    speaker: liveryn
    en: How did you... find this place...?
    ko: 여길… 어떻… 게….
    ja: どうして…ここ…が…？
  d_main_45_10_177:
    speaker: "<Narration>"
    en: She immediately realizes there's no point in asking.
    ko: 따지고 묻는 건 아무 의미 없다는 것을 직감한다.
    ja: |-
      それは聞いても意味がなかったと、
      口に出してから悟った
  d_main_45_10_178:
    speaker: "<Narration>"
    en: Fragile is one of the best in their business. If she wants to find someone,
      she'll find them easily enough.
    ko: |-
      프레자일 역시 최고의 배달부 중 한 명이다.
      누군가를 쫓기로 마음먹으면 찾는 것 쯤 쉬운 일이라는 걸 깨닫는다.
    ja: |-
      フラジャイルも技量の高い同業者だ。
      誰かを尾行しようと思えば簡単だろう
  d_main_45_10_179:
    speaker: "<Narration>"
    en: She also realizes that what's important right now isn't asking why Fragile
      is here,
    ko: 지금 중요한 건, 프레자일이 왜 여기 있는지 묻는 것이 아니라
    ja: |-
      いま最も重要なことは、
      フラジャイルが何故ここにいるかではない
  d_main_45_10_180:
    speaker: "<Narration>"
    en: but rather explaining the object in her hand.
    ko: 손에 든 물건에 대해 설명하는 것이라는 것도 깨닫는다.
    ja: |-
      自分が手に持っている物について
      一刻も早く釈明することだ
  d_main_45_10_181:
    speaker: liveryn
    en: J-just hear me out, Fragile.
    ko: 드, 들어봐. 프레자일.
    ja: き、聞いて…フラジャイル。
  d_main_45_10_182:
    speaker: liveryn
    en: I'm gonna be punished, right?
    ko: 나 이제부터 벌, 벌받을 거잖아?
    ja: わ、私、これから罰を受ける、でしょ？
  d_main_45_10_183:
    speaker: liveryn
    en: When that happens, everything I've saved up until now will be confiscated,
      and I'll have to start all over.
    ko: |-
      벌받으면 지금까지 모아놨던 것들도 다 몰수당할 거고,
      처음부터 다시 시작해야 되잖아.
    ja: |-
      そしたら、今まで稼いできたものが
      全部なくなって、また始めからになるでしょ。
  d_main_45_10_184:
    speaker: liveryn
    en: It was so hard for us at the beginning. You remember, right? You don't want
      to go through that again either, do you?
    ko: |-
      우리 처음에 너무 힘들었잖아. 그렇지?
      그거 다시 하기 싫잖아. 내 말 맞지?
    ja: |-
      でも、また最初からなんて大変じゃない？ね？
      あんなところからやり直したくないでしょ？
  d_main_45_10_185:
    speaker: liveryn
    en: This is just... a contingency. I wasn't planning on actually using it.
    ko: 그래서 미리 챙겨놓은 거야. 이걸로 뭘 하겠다는 게 아니라.
    ja: |-
      だから、これはそのための準備なの。
      悪いことをしてるんじゃないよ？
  d_main_45_10_186:
    speaker: liveryn
    en: Everyone knows how much leverage a crystal can give you.
    ko: 수정이 방주에 얼마만큼 영향력을 미치는지 모두가 다 아니까.
    ja: |-
      これがアークにとって
      どういうものかは、よく分かってるし…
  d_main_45_10_187:
    speaker: liveryn
    en: I-if someone needed it, I could sell it for a small fortune.
    ko: 누, 누가 이거 필요하다고 하면 진짜 비싸게 팔 수 있어.
    ja: |-
      で、でも、逆に欲しい人がいれば
      高く売れるってことでしょ。
  d_main_45_10_188:
    speaker: liveryn
    en: W-we could really get a lot for it. We could treat it like a... like a strategic
      weapon, yeah?
    ko: |-
      마, 말도 안 되게 비싸게 팔릴 거야.
      전술 병기? 같은 취급이니까, 응.
    ja: |-
      き、きっとすごいお金になるの。
      戦略兵器？みたいな感じだから、うん。
  d_main_45_10_189:
    speaker: liveryn
    en: With that kind of money, we could start over without having to struggle like
      before.
    ko: 그 돈이면, 다시 시작할 때 그때처럼 고생 안 해도 돼.
    ja: |-
      そのお金があれば、
      あの時みたいな思いはせずに
      やり直せるでしょ。
  d_main_45_10_190:
    speaker: liveryn
    en: It would be a better start, a little more comfortable.
    ko: 조금, 아주 조금 편하게 시작하는 거야.
    ja: |-
      ちょっとだけ、
      ほんのちょっとだけラクに始められるの。
  d_main_45_10_191:
    speaker: "<Narration>"
    en: Fragile only continues to quietly stare at Liveryn.
    ko: 프레자일은 아무 말 없이 리버린을 노려보고 있었다.
    ja: フラジャイルはにらみつけたまま、何も答えない
  d_main_45_10_192:
    speaker: liveryn
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_193:
    speaker: liveryn
    en: Fragile...
    ko: 프레자일.
    ja: フラジャイル…
  d_main_45_10_194:
    speaker: liveryn
    en: Please say something.
    ko: 뭐라고 말 좀 해.
    ja: 何か言ってよ…
  d_main_45_10_195:
    speaker: "<Narration>"
    en: Fragile keeps staring at Liveryn in silence.
    ko: 프레자일은 아무 말 없이 리버린을 노려보고 있었다.
    ja: それでも、フラジャイルは何も答えなかった
  d_main_45_10_196:
    speaker: liveryn
    en: "... Look, I'm going to be punished."
    ko: "…나 벌받잖아."
    ja: "…ば、罰はちゃんと受けるから。"
  d_main_45_10_197:
    speaker: liveryn
    en: I'm trying to do better, which is why I agreed to be punished in the first
      place.
    ko: 나 반성하고 있어. 그래서 벌받기로 했고.
    ja: |-
      反省もしてるの。
      だから罰を受けることにしたの。
  d_main_45_10_198:
    speaker: liveryn
    en: And since my punishment is already coming,
    ko: 그러니까.
    ja: だから…
  d_main_45_10_199:
    speaker: liveryn
    en: what's the harm in doing just a little more before that?
    ko: 이왕 벌받는 거, 그 전에 조금 정도 더 해도 괜찮잖아.
    ja: |-
      その前に、その前にちょっとだけ
      準備してもいいでしょ？
  d_main_45_10_200:
    speaker: liveryn
    en: Once I'm punished, it'll all be wiped clean anyway, right?
    ko: 어차피 벌받으면 다 없던 일이 되는 거니까, 맞지?
    ja: 罰を受けたら、全部許してもらえるんだし、ね？
  d_main_45_10_201:
    speaker: "<Narration>"
    en: Fragile still doesn't say a word.
    ko: 프레자일은 아무 말 없이 리버린을 노려보고 있었다.
    ja: フラジャイルはやはり、何も言わない
  d_main_45_10_202:
    speaker: liveryn
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_10_203:
    speaker: liveryn
    en: Fragile...
    ko: 프레자
    ja: フラジャ――
  d_main_45_10_204:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 탕!
    ja: パン！
  d_main_45_10_205:
    speaker: "<Narration>"
    en: The gunshot rips through the air.
    ko: 총구에서 굉음이 뻗어나간다.
    ja: 銃声が響いた
  d_main_45_10_206:
    speaker: "<Narration>"
    en: Liveryn clutches her throat and collapses.
    ko: 리버린은 목을 감싸 쥐고 주저앉는다.
    ja: リヴァリンはのどを押さえ、座り込んだ
  d_main_45_10_207:
    speaker: liveryn
    en: Erk... hngh!
    ko: 헥… 헤윽…!
    ja: あ…あ…！
  d_main_45_10_208:
    speaker: "<Narration>"
    en: No words come out.
    ko: 목소리가 나오지 않는다.
    ja: 声が出ない
  d_main_45_10_209:
    speaker: "<Narration>"
    en: "*Bang! Bang! Bang!*"
    ko: 탕! 탕! 탕!
    ja: パン！パン！パン！
  d_main_45_10_210:
    speaker: "<Narration>"
    en: Liveryn slumps to the ground.
    ko: 리버린이 주저앉는다.
    ja: リヴァリンが崩れ落ちた
  d_main_45_10_211:
    speaker: "<Narration>"
    en: Fragile approaches her with cold eyes.
    ko: 프레자일은 싸늘한 눈빛으로 리버린에게 다가간다.
    ja: |-
      冷め切った目のフラジャイルが
      リヴァリンに近寄った
  d_main_45_10_212:
    speaker: "<Narration>"
    en: She snatches the bottle containing the E2 Crystal from Liveryn's tightly clenched
      hand.
    ko: 리버린이 꼭 쥐고 있는 E2 크리스탈이 든 유리병을 빼앗는다.
    ja: |-
      フラジャイルはリヴァリンの手から
      E2クリスタル入りのガラス瓶を奪い取ると…
  d_main_45_10_213:
    speaker: "<Narration>"
    en: She then lifts Liveryn as if helping her up. Liveryn writhes in pain, but
      Fragile pays it no mind.
    ko: |-
      그리고 주저앉은 리버린을 부축하듯 들어 올린다.
      리버린이 고통에 몸부림치지만 아랑곳하지 않는다.
    ja: |-
      うめき声には耳を貸さないといった様子で
      倒れているリヴァリンを抱え上げた
  d_main_45_10_214:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 쿠웅-!
    ja: ドサッ…！
  d_main_45_10_215:
    speaker: "<Narration>"
    en: She throws Liveryn into the mechanical box.
    ko: 리버린이 기계식 상자에 구겨지듯 던져진다.
    ja: リヴァリンはコンテナに放り込まれた
  d_main_45_10_216:
    speaker: "<Narration>"
    en: Liveryn casts a desperate look at Fragile.
    ko: 리버린이 필사적인 눈빛을 프레자일에게 보낸다.
    ja: |-
      リヴァリンの眼は
      フラジャイルに必死に許しを請おうとしている
  d_main_45_10_217:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 쨍그랑.
    ja: ガシャン――
  d_main_45_10_218:
    speaker: "<Narration>"
    en: Fragile throws the glass vial into the box. The glass shatters, letting out
      the E2 Crystal.
    ko: |-
      프레자일이 유리병을 상자 안에 던진다.
      유리가 깨지며 E2 크리스탈이 드러난다.
    ja: |-
      フラジャイルがガラス瓶を中へ叩きつけ
      割れた瓶から、E2クリスタルが散った
  d_main_45_10_219:
    speaker: liveryn
    en: Fra...gile...!
    ko: 프, 프레쟈… 힐…!
    ja: フ、フラ…ジャ…！
  d_main_45_10_220:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 쿠웅-!
    ja: バタン――
  d_main_45_10_221:
    speaker: "<Narration>"
    en: The lid of the mechanical box closes.
    ko: 기계식 상자의 뚜껑이 닫힌다.
    ja: コンテナのふたが閉じた
  d_main_45_10_222:
    speaker: "<Narration>"
    en: Fragile presses down on the lid with all her strength.
    ko: 프레자일은 상자의 뚜껑을 온 힘을 다해 짓누른다.
    ja: フラジャイルは力の限りふたを押さえ続けた
  d_main_45_10_223:
    speaker: "<Narration>"
    en: She hears the sound of a violent struggle within the box, and feels Liveryn
      pounding against the inside.
    ko: |-
      상자 안에서 몸부림치는 소리가 들리고,
      강한 진동이 느껴진다.
    ja: |-
      もだえるような音と振動が、
      コンテナの中から伝わってくる
  d_main_45_10_224:
    speaker: "<Narration>"
    en: "*Rumble, rumble!*"
    ko: 카칵-! 카가가각-!
    ja: ガリッ、ガリガリガリッ――
  d_main_45_10_225:
    speaker: "<Narration>"
    en: A horrible sound rings out.
    ko: 끔찍한 소리가 울려 퍼진다.
    ja: 身の毛のよだつ音がする
  d_main_45_10_226:
    speaker: "<Narration>"
    en: Tears stream down Fragile's face.
    ko: 프레자일은 눈물을 흘린다.
    ja: フラジャイルの目から涙がこぼれた
  d_main_45_10_227:
    speaker: "<Narration>"
    en: Her expression twists as her tears run down her jawline and drip to the ground.
    ko: 표정이 한껏 구겨지고, 흐르는 눈물이 턱선을 타고 뚝뚝 떨어진다.
    ja: |-
      くしゃくしゃに歪んだ顔から、
      涙のしずくが頬をつたってこぼれ落ちた
  d_main_45_10_228:
    speaker: "<Narration>"
    en: But she makes no sound.
    ko: 하지만 소리는 내지 않는다.
    ja: 必死に声を殺した
  d_main_45_10_229:
    speaker: "<Narration>"
    en: She sobs silently.
    ko: 프레자일은 소리 없이 오열한다.
    ja: フラジャイルは静かに泣き続けた
  d_main_45_10_230:
    speaker: "<Narration>"
    en: After a short while, all sound and movement within the box stop.
    ko: 그리고 잠시 후, 모든 소리와 진동이 멎는다.
    ja: しばらくして、音と振動が収まった
  d_main_45_10_231:
    speaker: "<Narration>"
    en: Fragile steps back from it.
    ko: 프레자일은 상자에서 한걸음 물러선다.
    ja: フラジャイルは一歩身を離すと…
  d_main_45_10_232:
    speaker: "<Narration>"
    en: She looks inside and cries.
    ko: 상자를 바라보며 운다.
    ja: コンテナを見つめて泣いた
  d_main_45_10_233:
    speaker: "<Narration>"
    en: She cries out loud, wailing as she clutches her chest.
    ko: 소리내어 운다. 가슴을 부여잡으며, 울부짖는다.
    ja: |-
      今度は声を上げた。
      胸を押さえ、泣き叫んだ
  d_main_45_10_234:
    speaker: "<Narration>"
    en: She continues for a long time as all of her emotions come pouring out.
    ko: 프레자일은 한참 동안, 모든 것을 쏟아내며 울고 소리친다.
    ja: |-
      フラジャイルはまるで身体の中身が
      飛び出してしまいそうな勢いで、泣き崩れた
  d_main_45_10_235:
    speaker: "<Narration>"
    en: And then...
    ko: 그리고
    ja: それからしばらくして…
  d_main_45_10_236:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 탕-!
    ja: バン――！
  d_main_45_10_237:
    speaker: "<Narration>"
    en: Another gunshot rings out.
    ko: 또 한 발의 총성이 울려 퍼진다.
    ja: もう一度銃声が響いた
  d_main_45_10_238:
    speaker: "<Narration>"
    en: But there is no one around to hear it,
    ko: 하지만 그 모든 소리는 그 누구도 듣지 못했다.
    ja: その音は誰の耳にも届くことなく…
  d_main_45_10_239:
    speaker: "<Narration>"
    en: and no one to see what happened.
    ko: 그 누구도 그 모습을 보지 못했다.
    ja: 起こったことに気づいた者は、誰もいなかった
d_main_45_11:
  d_main_45_11_1:
    speaker: "<Narration>"
    en: Within the central conference room at the Central Government...
    ko: 중앙 정부 중앙 회의실.
    ja: 中央政府・中央会議室
  d_main_45_11_2:
    speaker: burningum
    en: G-good job taking c-care of the Sixo incident.
    ko: 시, 식스오의 건은 잘 해결해 줬어.
    ja: シ、シックスオーの件…よく解決してくれた。
  d_main_45_11_3:
    speaker: burningum
    en: Th-the number of casualties and the d-damage to the Ark are severe,
    ko: "…사, 사상자 수와 방주의 손, 손상 정도가 심하지만."
    ja: "…人的、物的被害、ともに深刻だが…"
  d_main_45_11_4:
    speaker: burningum
    en: b-but considering the circumstances, we got off lucky.
    ko: 이, 이 정도로 그친 건 다행이야.
    ja: |-
      じ、事件の内容を考えれば、
      軽く収まったほうだ。
  d_main_45_11_5:
    speaker: burningum
    en: Th-the entire Ark could have fallen.
    ko: 바, 방주가 그대로 끝날 수도 있었으니까.
    ja: ア、アークの…存続に関わる危機だったからな。
  d_main_45_11_6:
    speaker: "<Self>"
    en: So, about your promise...
    ko: 그럼 약속했던 건은….
    ja: それでは、約束の件は…
  d_main_45_11_7:
    speaker: burningum
    en: W-we can discuss that between us later.
    ko: 그, 그건 나중에 따로 이야기하지.
    ja: そ、その話は、後だ。
  d_main_45_11_8:
    speaker: burningum
    en: N-not that I plan to go back on my word, of course.
    ko: 아, 무, 물론 말을 뒤집는다거나 하진 않, 않을 거야.
    ja: む、無論、撤回は、しない。
  d_main_45_11_9:
    speaker: burningum
    en: Th-there are just a lot of eyes here.
    ko: 여기는 보는, 보는 눈이 많으니까.
    ja: ただ、ひ、人目につく。
  d_main_45_11_10:
    speaker: "<Self>"
    en: Understood. Thank you.
    ko: 알겠습니다. 감사합니다.
    ja: 分かりました。ありがとうございます
  d_main_45_11_11:
    speaker: mustang
    en: I believe you could say l'opération was un succè thanks to the considérable
      impact of Tetra's Nikke.
    ko: Tetra의 니케가 Big 활약하는 덕분에 Clear 했다고 할 수 있겠군Yo.
    ja: |-
      TetraのニケのBigな活躍が
      あってこそと言えますNE。
  d_main_45_11_12:
    speaker: mustang
    en: It was une victoire worthy of the term entertainment.
    ko: Entertainment한 Victory라고 할 수 있겠습니Da.
    ja: EntertainmentなVictoryでしTA。
  d_main_45_11_13:
    speaker: ingrid
    en: In case you forgot, there were two Elysion Nikkes present as well.
    ko: |-
      무슨 소리지.
      엘리시온의 니케가 둘이나 있었다.
    ja: |-
      何を言っている。
      我が社のニケが2名も戦っていただろう。
  d_main_45_11_14:
    speaker: syuen
    en: What are you talking about? One of them is a Missilis Nikke.
    ko: |-
      너야말로 무슨 소리야.
      미실리스 니케잖아.
    ja: |-
      お前こそ何言ってるのよ。
      1体は実質ミシリスでしょ。
  d_main_45_11_15:
    speaker: ingrid
    en: Is that what you think, after taking her without permission?
    ko: 멋대로 도둑질해서 만든 주제에 말이 많군.
    ja: 勝手に横取りしておいて、よく言えたものだな。
  d_main_45_11_16:
    speaker: syuen
    en: I took garbage and made it gold. You should be grateful.
    ko: |-
      특색이라고는 없는 고철을 그 정도 수준까지 끌어올려 준 거야.
      고마운 줄 알아야지.
    ja: |-
      何の取り柄もなかった鉄くずを
      あのレベルまで引き上げてやったのよ。
      感謝してほしいわね。
  d_main_45_11_17:
    speaker: ingrid
    en: Oh really? You did it yourself?
    ko: 네가 했나?
    ja: お前の采配だとでも？
  d_main_45_11_18:
    speaker: syuen
    en: What?!
    ko: "…뭐?"
    ja: "…はぁ？"
  d_main_45_11_19:
    speaker: ingrid
    en: Anyone listening would think you built her body yourself.
    ko: 누가 들으면 네가 만든 바디인 줄 알겠군.
    ja: まるでお前が作らせたかのような物言いだな。
  d_main_45_11_20:
    speaker: syuen
    en: What do you mean by that?
    ko: 무슨 의미야 그거.
    ja: どういう意味よ？
  d_main_45_11_21:
    speaker: ingrid
    en: Nothing.
    ko: 아무 의미 없다.
    ja: 深い意味はない。
  d_main_45_11_22:
    speaker: ingrid
    en: What do they say about younger siblings again? Always trying to prove themselves?
    ko: 형만 한 아우 없다는 속담이 갑자기 생각났을 뿐이다.
    ja: "「兄に勝る弟なし」とは誰の言葉だったかな。"
  d_main_45_11_23:
    speaker: syuen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_24:
    speaker: andersen
    en: I don't know how a victory celebration turns into an argument, but that's
      enough.
    ko: |-
      어쩌다가 승전 축하가 말싸움으로 번진 것인지는 모르겠지만,
      거기까지 하지.
    ja: |-
      仮にも勝利を祝う場で、
      言い争いはほどほどにしたまえ。
  d_main_45_11_25:
    speaker: andersen
    en: What we should be discussing is why Enikk has summoned us here again.
    ko: 에닉이 우릴 다시 소집한 이유가 더 중요한 일이지 않겠나?
    ja: |-
      エニック直々の召集である以上、
      重大な理由があるはずだ。
  d_main_45_11_26:
    speaker: enikk_op_l
    en: Indeed. This is an important matter.
    ko: 그렇습니다. 중요한 일입니다.
    ja: その通りです。最重要の問題があります。
  d_main_45_11_27:
    speaker: andersen
    en: Okay. Explain.
    ko: 음. 설명해 주게.
    ja: だろうな。聞かせてもらおう。
  d_main_45_11_28:
    speaker: enikk_op_l
    en: Very well.
    ko: 예.
    ja: 了解しました。
  d_main_45_11_29:
    speaker: enikk_op_l
    en: Before we begin, I will ask others to come in and brief you on the situation.
    ko: 이야기에 앞서, 상황을 설명해 줄 분들을 모시겠습니다.
    ja: |-
      本題に入る前に、
      説明の担当者を呼び出します。
  d_main_45_11_30:
    speaker: enikk_op_l
    en: Please come in.
    ko: 들어오시지요.
    ja: 入室してください。
  d_main_45_11_31:
    speaker: "<Self>"
    en: "...?"
    ko: "??"
    ja: "？？"
  d_main_45_11_32:
    speaker: "<Monologue>"
    en: The conference room door opens, and Elegg and Trony step inside.
    ko: |-
      회의실 문이 열리며
      일레그와 트로니가 들어왔다.
    ja: |-
      会議室の扉が開き、
      姿を見せたのはエレグとトロニーだった
  d_main_45_11_33:
    speaker: "<Self>"
    en: Elegg and Trony?
    ko: "…일레그, 트로니."
    ja: "…エレグ、トロニー"
  d_main_45_11_34:
    speaker: enikk_op_l
    en: This is Elegg and Trony of the Electric Shock Squad.
    ko: 일렉트릭 쇼크 스쿼드의 일레그와 트로니입니다.
    ja: |-
      エレクトリックショック部隊所属、
      エレグとトロニーの2名です。
  d_main_45_11_35:
    speaker: enikk_op_l
    en: They are the ones who cut power to the Ark during the battle with Sixo.
    ko: 이번 식스오 토벌전에서 방주의 전원을 내려준 분들입니다.
    ja: |-
      今回のシックスオー排除作戦において
      アークの電気系統を遮断していました。
  d_main_45_11_36:
    speaker: syuen
    en: What...?
    ko: "…뭐?"
    ja: "…はぁ？"
  d_main_45_11_37:
    speaker: elegg
    en: Hello there. I'm Elegg.
    ko: 안녕하세여. 일레그에여.
    ja: 皆様ごきげんよう、エレグと申しますぞ。
  d_main_45_11_38:
    speaker: trony
    en: I-I'm Trony...
    ko: 트, 트로니입니다아….
    ja: ト、トロニーです…
  d_main_45_11_39:
    speaker: elegg
    en: Wow, all the leaders of the Ark here in one place! I've never been part of
      anything like this.
    ko: 이야~ 방주의 높으신 분들을 이렇게 한자리에서 보다니 감회가 새롭네여~
    ja: |-
      いやはや～実にそうそうたる顔ぶれと
      言ったところで、感動してしまいますな～
  d_main_45_11_40:
    speaker: syuen
    en: What're you talking about? You're the ones who shut the Ark down?
    ko: 무슨 소리야. 니들이 방주를 껐다고?
    ja: |-
      どういうことよ。
      お前たちが停電させたの？
  d_main_45_11_41:
    speaker: syuen
    en: Who gave you the authority to pull a stunt like that?!
    ko: 야. 니들 누구 맘대로 그딴 짓을 그렇게…!
    ja: チッ、何を勝手にそんなこと…！
  d_main_45_11_42:
    speaker: trony
    en: Elegg...
    ko: 이, 일레그.
    ja: エ、エレグ…
  d_main_45_11_43:
    speaker: elegg
    en: Yeah?
    ko: 녜?
    ja: なんですかな？
  d_main_45_11_44:
    speaker: trony
    en: What should I do? I didn't update my will before coming here...
    ko: 나, 나 유언장 갱신 안 하고 왔는데 어떡하지.
    ja: |-
      ゆ、遺言状、更新しないで来ちゃったんだけど
      どうしよう…
  d_main_45_11_45:
    speaker: elegg
    en: Uh-oh! That's not good.
    ko: 으엑. 어떡하져.
    ja: おや、それは大問題ですな。
  d_main_45_11_46:
    speaker: syuen
    en: You think now's the time for jokes?! How dare you carry out something that
      critical without authorization!
    ko: |-
      이것들이 지금 장난하나.
      그런 중요한 일을 왜 니들 멋대로 저지르고 난리야!
    ja: |-
      ふざけてる場合だと思ってるの？
      そんな重要なこと、
      なんで勝手にやったのよ！？
  d_main_45_11_47:
    speaker: enikk_op_l
    en: To maintain operational secrecy, I made the request personally.
    ko: 작전의 비밀 유지를 위해 제가 개인적으로 부탁했습니다.
    ja: |-
      作戦の機密保持のため、
      私から直接依頼しました。
  d_main_45_11_48:
    speaker: enikk_op_l
    en: Is there a problem with that?
    ko: 문제가 있습니까?
    ja: 何か問題がありましたか？
  d_main_45_11_49:
    speaker: syuen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_50:
    speaker: enikk_op_l
    en: As there appear to be no objections, the meeting will continue.
    ko: 문제가 없다는 걸로 판단하고, 회의를 이어가겠습니다.
    ja: ご意見が無ければ、議題に戻ります。
  d_main_45_11_51:
    speaker: enikk_op_l
    en: Elegg, Trony. Please give the briefing.
    ko: 먼저, 현 상황에 대해 설명을 부탁드립니다.
    ja: まずは、現状説明をお聞きください。
  d_main_45_11_52:
    speaker: elegg
    en: Okay.
    ko: 녜.
    ja: では、改めて…
  d_main_45_11_53:
    speaker: elegg
    en: The Ark is doomed.
    ko: 방주는 망했어여.
    ja: アークはオシマイですな。
  d_main_45_11_54:
    speaker: burningum
    en: "... What?"
    ko: "…뭐?"
    ja: "…何？"
  d_main_45_11_55:
    speaker: ingrid
    en: Well, don't just leave it at that. What do you mean?
    ko: 밑도 끝도 없이 그게 무슨 소리지.
    ja: 出し抜けに、どういうことだ。
  d_main_45_11_56:
    speaker: elegg
    en: The Ark's power source isn't producing enough power.
    ko: 방주 동력원의 출력이 다시 올라오지 않아여.
    ja: |-
      アークのエネルギー源の出力が
      上昇しなくなったということですな。
  d_main_45_11_57:
    speaker: elegg
    en: It hasn't even reached twenty percent of its original output.
    ko: 평소때 내던 출력의 20%도 채 나오지 않고 있어여.
    ja: |-
      現在は以前の20％にも満たない出力に
      なっておりますぞ。
  d_main_45_11_58:
    speaker: elegg
    en: And it's dropping, albeit very slowly.
    ko: 아주 느리지만 점점 더 줄어들고 있고여.
    ja: |-
      緩やかにではありますが、
      減少傾向は続いておりますな。
  d_main_45_11_59:
    speaker: burningum
    en: Wh-what are you saying...?
    ko: 무슨… 소리지?
    ja: すると…どうなる？
  d_main_45_11_60:
    speaker: elegg
    en: If nothing changes and the power source continues to decline,
    ko: 이 상태로 간다면 방주 동력원의 출력은 점점 떨어질 테고.
    ja: |-
      このままの計算であれば、
      エネルギー源の出力は低下を続け…
  d_main_45_11_61:
    speaker: elegg
    en: it will shut down completely in about six months.
    ko: 반년도 채 되지 않아서 기능을 정지해여.
    ja: 半年以内に機能停止する予想となりますな。
  d_main_45_11_62:
    speaker: elegg
    en: And when that happens...
    ko: 그렇게 되면.
    ja: その時が来れば…
  d_main_45_11_63:
    speaker: elegg
    en: that's it for the Ark. Show's over.
    ko: 방주는 끝.
    ja: アークはおしまい。
  d_main_45_11_64:
    speaker: elegg
    en: That's what I'm saying.
    ko: 이라는 얘기져.
    ja: と、こういう話になりますな。
  d_main_45_11_65:
    speaker: burningum
    en: How can you be so flippant?! Take this seriously!
    ko: |-
      장난스럽게 말하지 말고!
      똑바로! 성의 있게 말해라!
    ja: |-
      冗談めかせていい話ではないぞ！
      誠意をもって説明したまえ！
  d_main_45_11_66:
    speaker: ingrid
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_45_11_67:
    speaker: mustang
    en: Sacre bleu!
    ko: 오우.
    ja: Oh…
  d_main_45_11_68:
    speaker: syuen
    en: Wh-what?
    ko: 뭐, 뭐야.
    ja: ど、どうしたのよ急に…
  d_main_45_11_69:
    speaker: burningum
    en: Do you understand the gravity of what you just said?! Give us a proper explanation!
    ko: |-
      네가 지금 하는 말의 무게를 알아라!
      제대로 설명해라!
    ja: |-
      発言の重大性を理解しているのか！？
      言葉遊びをするべき時ではない！
  d_main_45_11_70:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_71:
    speaker: trony
    en: I-I'll explain.
    ko: 제, 제가 말씀드릴게요.
    ja: わ、私から説明します…
  d_main_45_11_72:
    speaker: trony
    en: We deliberately shut down the Ark's power source.
    ko: 방주 동력원을 일부러 끈 다음.
    ja: アークの電源供給を遮断した後…
  d_main_45_11_73:
    speaker: trony
    en: An hour later, we reconnected the... f-feed line to restart the core,
    ko: |-
      1시간 후 다시 가동하기 위해
      먹이를 연결하… 우욱. 먹이를 연결하고.
    ja: |-
      1時間後に再稼働させるため、
      エサ…うっ…ね、燃料を補充し…
  d_main_45_11_74:
    speaker: trony
    en: and succeeded in restoring the converter to its original state.
    ko: 컨버터를 원래의 상태로 돌리는 것에는 성공했어요.
    ja: コンバーターは元の状態に復旧されました。
  d_main_45_11_75:
    speaker: trony
    en: According to our projections, it should have returned to full output,
    ko: 예상대로라면, 온전한 출력으로 돌아왔어야 하는 게 맞아요.
    ja: |-
      本来なら…これで通常通りの出力に
      戻るはずです。
  d_main_45_11_76:
    speaker: trony
    en: since all we did was power it off and turn it on again.
    ko: 다, 단순히 전원을 껐다가 키는 것과 다르지 않았으니까.
    ja: |-
      た、単純に電源を切って、
      もう一度入れなおすのと、
      大きく違いはないはずです。
  d_main_45_11_77:
    speaker: trony
    en: But once the output reached a certain threshold, it stopped increasing.
    ko: |-
      그런데 특정 수준까지 올라가야 했을 출력이,
      더는 올라가지 않았어요.
    ja: |-
      ですが、出力が本来の水準まで
      上昇しませんでした。
  d_main_45_11_78:
    speaker: trony
    en: If we consider the original state to be one hundred percent, then it only
      reached twenty percent, and it's been slowly declining since.
    ko: |-
      원래 상태를 100%라고 치면 20% 내외의 출력까지만 올라갔고,
      이후로 점점 떨어지고 있는 상태예요.
    ja: |-
      以前の状態を100％とすると、
      およそ20％までしか上昇せず、
      それ以降も徐々に低下している状態です。
  d_main_45_11_79:
    speaker: trony
    en: Th-this might sound strange to say, but the decline has been very stable.
    ko: 이, 이런 말이 좀 이상할진 모르지만 굉장히 안정적으로 떨어지고 있어요.
    ja: |-
      ご、語弊のある表現かも知れませんが、
      動作そのものは安定しています。
  d_main_45_11_80:
    speaker: trony
    en: Elegg said we had half a year, but if anything happens to make the decline
      less stable,
    ko: |-
      일레그가 반년이라고 얘기했지만,
      중간에 어떤 요소로 인해 변동이 생기는 순간.
    ja: |-
      エレグは半年と見積もりましたが、
      何らかの要因で不安定になれば…
  d_main_45_11_81:
    speaker: trony
    en: then it might shut down sooner.
    ko: 더 짧아질 수도 있어요.
    ja: それより早期の停止も、考えられます。
  d_main_45_11_82:
    speaker: burningum
    en: "... What caused this? There has to be a cause, right?"
    ko: "…원인은. 원인이 있을 것 아닌가."
    ja: "…原因は？何か理由が原因があるのだろう。"
  d_main_45_11_83:
    speaker: burningum
    en: Was there an error during the restart process?
    ko: 조립이 잘못됐을 확률은?
    ja: 再起動の作業で誤った可能性は？
  d_main_45_11_84:
    speaker: trony
    en: Th-there couldn't have been. While it takes a lot of time, the work itself
      isn't very complicated.
    ko: |-
      그, 그럴 리는 없어요.
      물리적인 시간이 많이 든다 뿐이지, 일 자체는 어렵지 않아서요.
    ja: |-
      そ、それは考えられません。
      物理的に時間はかかりますが、
      操作自体は単純です。
  d_main_45_11_85:
    speaker: trony
    en: And, um...
    ko: 그리고 어….
    ja: それに…あの…
  d_main_45_11_86:
    speaker: elegg
    en: We're pretty much the best of the best when it comes to this sorta thing.
    ko: 저희는 그쪽 방면에서는 프로 중의 프로니까여.
    ja: |-
      この分野で我々以上の技術者は
      おりませんからな。
  d_main_45_11_87:
    speaker: burningum
    en: "... Yes. That much I don't doubt."
    ko: "…그래. 그건 틀림이 없겠지."
    ja: "…ふん、それは間違いないだろうな。"
  d_main_45_11_88:
    speaker: burningum
    en: Then do you have any idea what's causing it?
    ko: 짐작 가는 원인은?
    ja: 他の原因に心当たりは？
  d_main_45_11_89:
    speaker: elegg
    en: The core is simply near the end of its lifespan.
    ko: 수명. 이예여.
    ja: ズバリ、寿命かと。
  d_main_45_11_90:
    speaker: burningum
    en: "... Its lifespan?"
    ko: "…수명."
    ja: "…寿命か…"
  d_main_45_11_91:
    speaker: elegg
    en: Yep. We believe the Ark's power source has simply reached the end of its service
      life.
    ko: 녜. 방주 동력원의 수명이 다했을 것이댜. 라고 보고 있어여.
    ja: |-
      いかにも。アレが単純に寿命に至ったと
      考えておりますな。
  d_main_45_11_92:
    speaker: elegg
    en: After a close examination of its surface, we found a lot of inactive sections.
    ko: "…표면을 자세히 살펴본 결과, 활성화되지 않은 부분이 너무 많았어여."
    ja: |-
      …表面を詳しく分析したところ、
      各所に活性化していない部分があり…
  d_main_45_11_93:
    speaker: elegg
    en: They felt like hardened tar.
    ko: 딱딱하게 굳은 타르 같은 느낌이었져.
    ja: タール状の硬化が検出されておりますな。
  d_main_45_11_94:
    speaker: burningum
    en: There weren't any problems before. So why now?
    ko: 이전까지는 문제가 없었는데, 왜 이제 와서지?
    ja: |-
      今まで動いていたものが、
      なぜ今になって問題になった？
  d_main_45_11_95:
    speaker: trony
    en: Um... We think it's because it was continuously active before this.
    ko: 그… 계속 활성화 상태였으니까요.
    ja: |-
      それは…
      ずっと活性化させたままだったからです。
  d_main_45_11_96:
    speaker: trony
    en: P-put simply, you know how computers sometimes work great one day and then
      don't turn on the next?
    ko: |-
      아… 쉽게 설명드리면,
      어제까지 잘 돌아가던 컴퓨터가 오늘 갑자기 안 켜질 때가 있잖아요.
    ja: |-
      ええと…簡単に言うと、
      昨日まで普通に使ってたパソコンが
      急に電源がつかなくなったみたいな感じで…
  d_main_45_11_97:
    speaker: trony
    en: Uh... Maybe it's more like a game controller that... um...
    ko: |-
      아, 아닌가.
      어제까지 잘 되던 게임 패드가, 어….
    ja: |-
      あっ、違うかな…
      昨日まで普通に動かしてたゲームパッドが、
      ええと…
  d_main_45_11_98:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_99:
    speaker: burningum
    en: So it's like rigor mortis?
    ko: 사후 강직 같은 건가.
    ja: 死後の人体のようなものか。
  d_main_45_11_100:
    speaker: burningum
    en: A body's muscles stay relaxed as long as there's energy for them, but the
      moment the energy runs out, they stiffen.
    ko: |-
      에너지가 있을 땐 근육이 이완된 상태가 유지되지만,
      에너지가 고갈되는 순간 근육은 딱딱하게 굳는다.
    ja: |-
      エネルギーが巡っている時、
      筋肉は柔軟だが、一度枯渇すれば固くなる。
  d_main_45_11_101:
    speaker: burningum
    en: Once that happens, they won't soften again, even if you inject energy into
      them.
    ko: 이후, 다시 에너지를 주입해도 근육은 부드러워지지 않는다.
    ja: |-
      その後でエネルギーを戻しても、
      筋肉は元のように柔軟にはならない。
  d_main_45_11_102:
    speaker: elegg
    en: Oh, yeah! Exactly. You could also think of it like melted wiring.
    ko: |-
      오, 녜. 맞아여.
      녹아버린 전선이라고도 표현하져.
    ja: |-
      ええと…まさに、その通りですな。
      電線が溶けたとも言えますかな。
  d_main_45_11_103:
    speaker: elegg
    en: If the copper inside a wire melts, electricity will keep flowing as long as
      the strands are still touching.
    ko: 전선 내부의 구리가 녹아내려도 서로 맞닿아 있기 때문에 전기는 계속 흐르지만.
    ja: |-
      ケーブル内の銅が融解しても、
      通電している限り電流は止まらない…
  d_main_45_11_104:
    speaker: elegg
    en: When the temperature drops, though, and the melted copper contracts or solidifies,
      gaps form and the current stops flowing.
    ko: |-
      온도가 내려가며 녹았던 구리가 수축하거나 굳어서 이격이 생기면,
      더는 전기가 흐르지 않게 되는거져.
    ja: |-
      しかし温度が下がって、
      銅が縮んだり固まったりすると切れてしまい、
      通電しなくなるといったことですな。
  d_main_45_11_105:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_106:
    speaker: burningum
    en: So what's the fix?
    ko: 해결 방법은?
    ja: 解決案は？
  d_main_45_11_107:
    speaker: elegg
    en: We've been using that core for so long without knowing much about it.
    ko: "[그것]에 대해 자세히 알지 못하는 상태로 지금껏 써 왔잖아여?"
    ja: |-
      「アレ」については情報を伏せられたまま
      長らく使っておりましたからな。
  d_main_45_11_108:
    speaker: elegg
    en: We still don't really know what it even is.
    ko: 아직 우리는 그게 어떤 것인지 자세히 알지 못해여.
    ja: 我々にも正体はよく分かっておりませんぞ。
  d_main_45_11_109:
    speaker: elegg
    en: Enikk, do you know anything about it that we don't?
    ko: 에닉 씨. 혹시 그것에 대해 잘 아시나여?
    ja: エニック氏であれば、何かご存じですかな？
  d_main_45_11_110:
    speaker: enikk_op_l
    en: I do not.
    ko: 아니요. 모릅니다.
    ja: いいえ。情報は存在しません。
  d_main_45_11_111:
    speaker: elegg
    en: If Enikk doesn't know, then it's fair to assume no one does.
    ko: 에닉 씨가 모르면 다 모른다고 보는 게 맞겠져.
    ja: エニック氏が知らなければ、誰も知らない…
  d_main_45_11_112:
    speaker: elegg
    en: So, yeah... We don't know.
    ko: 그래서 몰라여.
    ja: つまり、何も分からないということですな。
  d_main_45_11_113:
    speaker: elegg
    en: The simplest solution would be to find an identical one and swap it in,
    ko: 가장 간단한 방법은 똑같은 걸 구해서 그 자리에 놔두는 건뎨….
    ja: |-
      一番簡単に思いつく方法は、
      同じものを用意して交換することですが…
  d_main_45_11_114:
    speaker: elegg
    en: but I doubt something like that even exists.
    ko: |-
      있을 리가 있겠어여?
      [그런 말도 안 되는 게].
    ja: |-
      あるワケありませんな？
      「あんなとんでもないモノ」。
  d_main_45_11_115:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_116:
    speaker: andersen
    en: That explains why power hasn't been fully restored.
    ko: "…방주의 전력이 온전히 회복되지 않은 이유가 이것 때문이었군."
    ja: |-
      …アークの電気系統が
      完全に復旧していないのは、
      そのせいだったのか。
  d_main_45_11_117:
    speaker: enikk_op_l
    en: Yes. Damage from the E2 Crystals is a factor, but the primary cause is the
      reduced output from the power source.
    ko: 그렇습니다. E2 크리스탈에 의해 손상된 탓도 있습니다만, 가장 큰 이유는 방주 동력원의 출력 저하입니다.
    ja: |-
      その通りです。
      E2クリスタルによる損傷も一因ですが、
      こちらが最大の障害になっています。
  d_main_45_11_118:
    speaker: ingrid
    en: "... Any proposals?"
    ko: "…제안해 줄 방법이 있나? 지금 사태에 대해."
    ja: "…何か対策はないのか？提案が欲しい。"
  d_main_45_11_119:
    speaker: enikk_op_l
    en: At present, there is no immediate solution.
    ko: 현재로서는 없습니다.
    ja: 現在のところありません。
  d_main_45_11_120:
    speaker: enikk_op_l
    en: This meeting has been convened to explore options based on the view of the
      collective leadership.
    ko: 방주 수뇌부의 의견을 종합해 방안을 모색하기 위해 해당 회의를 소집했습니다.
    ja: |-
      この会議が召集された理由は、
      アーク首脳部の合意形成と
      解決策の模索のためです。
  d_main_45_11_121:
    speaker: enikk_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_122:
    speaker: enikk_op_l
    en: Please wait a moment.
    ko: 잠시만 기다려 주십시오.
    ja: 少々お待ちください…
  d_main_45_11_123:
    speaker: enikk_op_l
    en: An unusual broadcast is being transmitted throughout the Ark.
    ko: 묘한 방송이 현재 방주에 송출되고 있습니다.
    ja: |-
      現在、アークにおいて
      正常ではない放送が配信されています。
  d_main_45_11_124:
    speaker: enikk_op_l
    en: I will share it.
    ko: 공유하겠습니다.
    ja: 共有を行います。
  d_main_45_11_125:
    speaker: "<Self>"
    en: A broadcast?
    ko: "…방송?"
    ja: "…放送？"
  d_main_45_11_126:
    speaker: "<Monologue>"
    en: The conference room monitor display changes.
    ko: 회의실 모니터의 화면이 바뀐다.
    ja: 会議室のモニターが切り替わった
  d_main_45_11_127:
    speaker: dorothy
    en: Citizens of the Ark, hello.
    ko: 방주의 여러분. 안녕하세요.
    ja: アークの皆様、ごきげんよう。
  d_main_45_11_128:
    speaker: dorothy
    en: My name is Dorothy. I am a Pilgrim who wanders the surface.
    ko: |-
      제 이름은 도로시.
      지상을 떠도는 필그림입니다.
    ja: |-
      私はドロシー。
      地上をさまようピルグリムといえば
      お分かりいただけるでしょうか。
  d_main_45_11_129:
    speaker: dorothy
    en: This is the first time I have addressed you since the Raptures' assault on
      the Ark.
    ko: 이전, 랩쳐의 방주 습격 때 이후로 처음 인사를 드리는 것 같네요.
    ja: |-
      皆様の前に出るのは、
      ラプチャーによるアーク襲撃の時以来ですね。
  d_main_45_11_130:
    speaker: dorothy
    en: The reason I stand before you today...
    ko: 제가 지금 이 자리에 서서 여러분께 모습을 드러낸 것은
    ja: |-
      私が今、このような形で
      お伝えすることになったのは…
  d_main_45_11_131:
    speaker: dorothy
    en: is because I can no longer tolerate the Central Government's lies.
    ko: 더 이상 중앙 정부의 거짓말을 용인할 수 없기 때문입니다.
    ja: |-
      中央政府の嘘をこれ以上
      見過ごすわけにはいかないと感じたからです。
  d_main_45_11_132:
    speaker: dorothy
    en: The Queen has descended to the surface.
    ko: 지상에 퀸이 내려왔습니다.
    ja: クイーンは地上に降り立ちました。
  d_main_45_11_133:
    speaker: dorothy
    en: You heard me right. The Queen of the Raptures, the entity is known as their
      sovereign.
    ko: |-
      예. 랩쳐의 퀸입니다.
      랩쳐들의 수장이라 부르는 존재입니다.
    ja: |-
      そう。ラプチャークイーン。
      ラプチャーの女王と呼ばれる存在です。
  d_main_45_11_134:
    speaker: dorothy
    en: After drifting through space for so long, the Queen has come down to the surface,
      and she is targeting the Ark.
    ko: |-
      지금껏 우주를 떠돌고 있던 퀸이 지상에 내려왔고,
      방주를 노리고 있습니다.
    ja: |-
      今まで宇宙をさまよっていたクイーンが
      地上に降下し、アークを狙っています。
  d_main_45_11_135:
    speaker: dorothy
    en: Do you remember all that's happened ever since the Raptures invaded the Ark?
    ko: |-
      …기억하시나요.
      랩쳐의 방주 침공 이후, 방주에는 많은 일들이 있었습니다.
    ja: |-
      …お忘れではないでしょう。
      ラプチャーのアーク襲撃があってから、
      様々なことが起こり続けています。
  d_main_45_11_136:
    speaker: dorothy
    en: Mysterious crystals swept across the city, killing many innocent people.
    ko: 정체불명의 수정이 방주 시내를 덮쳐 많은 사상자를 냈고,
    ja: |-
      正体不明のクリスタルが市街地に広がり
      無数の人々が犠牲となりました。
  d_main_45_11_137:
    speaker: dorothy
    en: A massive black spire of unknown origin charged toward the Ark, triggering
      earthquakes.
    ko: 정체불명의 검은 탑이 방주를 향해 돌진해 와, 지진이 발생.
    ja: |-
      さらにこれも正体不明の、漆黒の塔が
      アークに接近し、地震がありました。
  d_main_45_11_138:
    speaker: dorothy
    en: Just recently, there was a large-scale blackout that struck the Ark, followed
      by a large number of crystal outbreaks.
    ko: |-
      얼마 전 있었던 방주의 대규모 정전.
      이후에 발생한 수정의 대량 발생.
    ja: |-
      先日の大規模停電の折には、
      その直後にクリスタルがまたしても
      大量発生しています。
  d_main_45_11_139:
    speaker: dorothy
    en: An innumerable number of Ark citizens and Nikkes have been killed or injured.
    ko: "…수를 세기 힘들 정도의 수많은 방주 시민과 니케 분들이 죽거나 다쳤습니다."
    ja: |-
      …数えきれないほど大勢の
      アーク市民やニケが
      命を落とし、傷を負いました。
  d_main_45_11_140:
    speaker: dorothy
    en: Has the Central Government ever provided a proper explanation for any of this?
    ko: 이 모든 원인에 대해 중앙 정부가 제대로 된 해명을 한 적이 있던가요?
    ja: |-
      こうした事件の原因について、
      中央政府が十分な説明をしたことが
      あったでしょうか？
  d_main_45_11_141:
    speaker: dorothy
    en: No, because they cannot.
    ko: |-
      없습니다.
      할 수 없기 때문입니다.
    ja: |-
      思い出せないでしょう。
      説明などできないことだからです。
  d_main_45_11_142:
    speaker: dorothy
    en: Because the cause of all these events is the Queen.
    ko: 이 모든 일의 원인이 퀸이기 때문입니다.
    ja: そのすべての元凶がクイーンです。
  d_main_45_11_143:
    speaker: dorothy
    en: With the Queen's descent to the surface, the Raptures began targeting the
      Ark in earnest.
    ko: 퀸이 지상에 내려옴으로 인해 랩쳐는 방주를 노리기 시작했습니다.
    ja: |-
      クイーンが地上に降下した時から、
      ラプチャーはアークへの攻撃を始めています。
  d_main_45_11_144:
    speaker: dorothy
    en: The series of recent disasters that have shattered the Ark's former peace
      stands as proof of this.
    ko: 지금껏 평온하던 방주에, 최근 위험한 일이 잇따라 발생한 것이 그 근거입니다.
    ja: |-
      長いあいだ平穏だったアークに
      突然相次ぐ危機が訪れていることこそ
      何よりの証拠です。
  d_main_45_11_145:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_146:
    speaker: dorothy
    en: I previously came to the Ark to warn you of this threat.
    ko: 저는 이 위협을 알리기 위해 일찌감치 방주로 왔습니다.
    ja: |-
      私はこの危機を手遅れになる前に
      お知らせしようと、アークへ来ました。
  d_main_45_11_147:
    speaker: dorothy
    en: After the Raptures' invasion, I persistently urged the Central Government
      to act.
    ko: |-
      랩쳐의 방주 침공 이후,
      저는 끈질기게 중앙 정부를 설득했습니다.
    ja: |-
      ラプチャーの襲撃以降、
      私は何度も何度も中央政府に対して
      説得を重ねてまいりました。
  d_main_45_11_148:
    speaker: dorothy
    en: If we do not confront the Queen, there will be no future for the Ark, nor
      for humanity.
    ko: 퀸과 맞서 싸우지 않으면 방주에, 인류에 미래는 없다고.
    ja: |-
      クイーンを打ち倒さない限り、
      アークに…人類に未来はありません。
  d_main_45_11_149:
    speaker: dorothy
    en: Yet the Central Government did nothing.
    ko: 하지만 중앙 정부는 아무런 대응도 하지 않았습니다.
    ja: しかし、中央政府は動こうとしませんでした。
  d_main_45_11_150:
    speaker: dorothy
    en: They could have prevented all of this, but they chose not to.
    ko: 지금까지의 일을 모두 예방할 수 있었음에도, 그러지 않았습니다.
    ja: |-
      全て防げたはずの悲劇が起こることを、
      ただ手をこまねいて眺めていたのです。
  d_main_45_11_151:
    speaker: dorothy
    en: 'The reason is simple: they only care for their own security, and have no
      interest in external threats.'
    ko: |-
      그들은 자신들의 안위에만 관심이 있을 뿐,
      외부의 위협 같은 것에는 관심이 없기 때문입니다.
    ja: |-
      彼らは己の保身ばかりを考え、
      外の脅威に一切目を向けようとしていません。
  d_main_45_11_152:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_153:
    speaker: dorothy
    en: I wish to protect the Ark and humanity.
    ko: 저는 방주를, 인류를 지키고 싶습니다.
    ja: 私はアークを、人類を守ると決意しました。
  d_main_45_11_154:
    speaker: dorothy
    en: We cannot continue placing our trust in a government that acts solely for
      its own interests.
    ko: 이대로 자신의 잇속을 위해 아무것도 하지 않는 중앙 정부를 믿고 있을 수 없습니다.
    ja: |-
      己の利益しか考えず、
      何もしようとしない中央政府を
      これ以上信じることはできません。
  d_main_45_11_155:
    speaker: dorothy
    en: We must begin the Third Surface Reclamation War.
    ko: 3차 지상 탈환전을 시작해야 합니다.
    ja: 第三次地上奪還戦を始めましょう。
  d_main_45_11_156:
    speaker: dorothy
    en: I, Dorothy, will stand at the vanguard.
    ko: 선봉에는 저, 도로시가 함께 합니다.
    ja: この私、ドロシーが先駆けとなります。
  d_main_45_11_157:
    speaker: dorothy
    en: Nikkes and citizens of the Ark.
    ko: 방주의 니케 분들, 방주의 시민분들.
    ja: アークで暮らすニケの皆様、市民の皆様。
  d_main_45_11_158:
    speaker: dorothy
    en: Please stand with me and save your home.
    ko: 저와 함께 방주를 구원해 주세요.
    ja: 私とともにアークを救ってください。
  d_main_45_11_159:
    speaker: dorothy
    en: Do not turn a blind eye to the dangers that are right above us.
    ko: 우리의 머리 위에 있는 위협을 모른 척 하지 말아 주세요.
    ja: |-
      私たちの頭上にある脅威から
      どうか目をそむけないでください。
  d_main_45_11_160:
    speaker: dorothy
    en: We must reclaim the surface.
    ko: 저희는 지상을 탈환해야 합니다.
    ja: 私たちは地上を取り戻さなければなりません。
  d_main_45_11_161:
    speaker: "<Monologue>"
    en: The video ends, then loops back to the start.
    ko: 영상이 끝나고, 처음부터 다시 재생된다.
    ja: 映像はそこで中断し、また最初から再生された
  d_main_45_11_162:
    speaker: "<Monologue>"
    en: The conference room is silent. Only Dorothy's voice can be heard.
    ko: |-
      회의실은 조용하다.
      도로시의 목소리만 들린다.
    ja: |-
      静まり返った会議室に、
      ドロシーの声だけが響き続ける
  d_main_45_11_163:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_164:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_165:
    speaker: burningum
    en: I-I'm sure it's only showing on a niche channel without many viewers... right?
    ko: 마이… 너 채널이라 시청자가 많지는 않겠지.
    ja: |-
      マイナーな…チャンネルだ。
      見ている者などそういないだろう。
  d_main_45_11_166:
    speaker: enikk_op_l
    en: Dorothy gained a great deal of attention after her part in the battle with
      Sixo. Her personal channel has received a large influx of subscribers.
    ko: |-
      식스오 전에서 도로시가 활약한 모습이 어필되어,
      그녀의 개인 채널의 구독자가 급등한 상태입니다.
    ja: |-
      シックスオー排除作戦での彼女の活躍が
      注目を浴び、登録者数が急増していました。
  d_main_45_11_167:
    speaker: enikk_op_l
    en: After going live, this video has been spreading rapidly across the Ark.
    ko: 최초 공개 후, 해당 영상은 방주 전체에 급속도로 확산되고 있습니다.
    ja: |-
      公開直後から、アーク全体で
      急速に拡散されています。
  d_main_45_11_168:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_169:
    speaker: "<Self>"
    en: What exactly is she trying to do...?
    ko: 무슨 짓을 하는 거야 대체….
    ja: 何を考えているんだ、いったい…
  d_main_45_11_170:
    speaker: andersen
    en: Dorothy...
    ko: "…도로시."
    ja: "…ドロシー…"
  d_main_45_11_171:
    speaker: burningum
    en: Delete the video and all those related to it.
    ko: 일단, 일단 관련 영상을 모두 삭제하고….
    ja: と、とにかく至急検閲と削除を…
  d_main_45_11_172:
    speaker: enikk_op_l
    en: There is an additional update to report.
    ko: 추가로 공유드릴 사항이 있습니다.
    ja: |-
      もうひとつ、
      お伝えするべき事態が発生しました。
  d_main_45_11_173:
    speaker: burningum
    en: What now?
    ko: "…또, 뭔데."
    ja: "…な、何だ？"
  d_main_45_11_174:
    speaker: enikk_op_l
    en: Deputy Chief Doban has mobilized his forces and is engaging Dorothy.
    ko: |-
      도반 부사령관이 병력을 이끌고 이동.
      도로시와 교전에 돌입했습니다.
    ja: |-
      ドバン副司令官が兵力を動員し、
      ドロシーと交戦を開始しました。
  d_main_45_11_175:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_176:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_45_11_177:
    speaker: burningum
    en: This just keeps getting worse...
    ko: 미치겠군.
    ja: 頭がおかしくなりそうだ…
