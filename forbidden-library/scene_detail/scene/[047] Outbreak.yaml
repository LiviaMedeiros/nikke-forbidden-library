---
d_main_47_01:
  d_main_47_01_1:
    speaker: anis_i_w
    en: Ugh, it's so dark. I can't see a thing.
    ko: 아으 어두워. 아무것도 안 보이잖아 이거.
    ja: うわ…暗いわね。何も見えないじゃない。
  d_main_47_01_2:
    speaker: rapi_red
    en: And it's way too bumpy. This ride is awful.
    ko: 그리고 너무 흔들리지 않아? 승차감이 엉망이네.
    ja: 揺れもひどいわ。乗り心地は最悪ね。
  d_main_47_01_3:
    speaker: neon_v_w
    en: Hey, could we make a hole in here? I can't stand the dark.
    ko: |-
      저기, 죄송한데 구멍 하나만 뚫어주시면 안 되나요?
      어두운 건 좀 질색인데요.
    ja: |-
      すみませんが、
      小さい穴を開けていただけませんか？
      暗いのがちょっと苦手なもので。
  d_main_47_01_4:
    speaker: "<Self>"
    en: Just bear with it, everyone. They're going out of their way to transport us.
    ko: 다들 참아. 힘내서 운반해주고 있잖아.
    ja: |-
      みんな我慢しろ、
      頑張って運んでくれているんだ
  d_main_47_01_5:
    speaker: anis_i_w
    en: Eww! Something's stuck to me! It's all sticky!
    ko: 으악! 뭔가 달라붙었어! 끈적거려!
    ja: きゃあ！何かくっついた！ベタベタする！
  d_main_47_01_6:
    speaker: neon_v_w
    en: Sorry. I spilled my drink earlier.
    ko: 죄송. 제가 좀 전에 음료수를 흘려서.
    ja: 失礼、先ほどこぼしたドリンクですね。
  d_main_47_01_7:
    speaker: snowwhite_h
    en: When did you have a drink? I didn't notice at all.
    ko: "!! 언제 먹었지? 전혀 눈치채지 못했다."
    ja: "！！いつ飲んだ？まったく気づかなかった。"
  d_main_47_01_8:
    speaker: neon_v_w
    en: I may not look it, but I'm actually pretty good at sneaking food, since someone
      I live with is always stealing my food.
    ko: |-
      제가 이래 봬도 몰래 먹는 건 자신 있거든요.
      같이 사는 누가 하도 제걸 훔쳐먹고 뺏어먹어서요.
    ja: |-
      こっそり食べることには自信があるんです。
      誰かさんがいつも私のものを
      勝手に食べるので。
  d_main_47_01_9:
    speaker: anis_i_w
    en: And who is this "someone?"
    ko: 누군데 그게.
    ja: 誰のことよ。
  d_main_47_01_10:
    speaker: neon_v_w
    en: Well, who do you think?
    ko: 글쎄요. 누굴까요?
    ja: さあ、誰でしょうねぇ？
  d_main_47_01_11:
    speaker: snowwhite_h
    en: All this talk about food is making me hungry.
    ko: 음식 얘기를 했더니 배가 고파졌다.
    ja: 食べ物の話をしたら、腹が減ってきたな。
  d_main_47_01_12:
    speaker: snowwhite_h
    en: Hey. Don't you have food stocked in here?
    ko: 이봐. 여기에 음식은 구비되어 있지 않나?
    ja: 聞くが、ここに食べ物はないのか？
  d_main_47_01_13:
    speaker: leviathan
    en: You lot are pissing me off! What do you think this is, a sightseeing train?
    ko: 이것들이 듣자듣자하니까 여기가 뭐 관광열차인 줄 알아?
    ja: |-
      黙って聞いてれば…
      観光旅行か何かとカン違いしてんの？
  d_main_47_01_14:
    speaker: leviathan
    en: If you're gonna complain about the ride or food, get off.
    ko: 승차감이 어떻니 음식이 어떻니 불평할 거면 내려.
    ja: |-
      乗り心地がとか、食べ物はとか…
      不満があるなら降りなさいよ。
  d_main_47_01_15:
    speaker: behemoth
    en: Here, have an apple.
    ko: 자, 여기 사과.
    ja: ほら、リンゴでも食え。
  d_main_47_01_16:
    speaker: snowwhite_h
    en: Apples again? I'm tired of these. Give me something else.
    ko: 또 사과인가. 조금 질린다. 다른 걸 다오.
    ja: またリンゴか。少し飽きた。他のものをくれ。
  d_main_47_01_17:
    speaker: behemoth
    en: There's no point being nice to you.
    ko: 얘는 잘해줄 필요가 없는 애네.
    ja: 親切にするかいのないヤツだな。
  d_main_47_01_18:
    speaker: bahamut
    en: It's too dark. I can't peruse my book.
    ko: 너무 어둡다. 책을 읽을 수 없다.
    ja: 暗すぎる。これでは読書ができないではないか。
  d_main_47_01_19:
    speaker: leviathan
    en: Everybody off! Enough with the complaints!
    ko: 다들 내려! 뭐가 그렇게 말들이 많아!
    ja: もうみんな降りなさいよ！うるさい！
  d_main_47_01_20:
    speaker: ziz
    en: B-but you're being the loudest, Levi...
    ko: 레, 레비가 제일 시끄러운데에….
    ja: い、一番声が大きいのはレヴィだと思うけど…
  d_main_47_01_21:
    speaker: ziz
    en: I can hear everything from outside the pouch. If we get caught, it'll be your
      fault, Levi.
    ko: 주머니 밖으로 소리가 다 들려. 이러다 들키기라도 하면 레비 책임이야.
    ja: |-
      外側まで聞こえてるよ。
      気づかれちゃったらレヴィのせいかも…
  d_main_47_01_22:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_23:
    speaker: rapi_red
    en: Hmm. It's quiet now.
    ko: 음. 조용해졌네.
    ja: やっと静かになったわね。
  d_main_47_01_24:
    speaker: anis_i_w
    en: "... I've been thinking."
    ko: "…생각해 봤는데."
    ja: "…考えてみたんだけど…"
  d_main_47_01_25:
    speaker: anis_i_w
    en: If I make a light and shine it on Levi's forehead, would the whole place light
      up?
    ko: 내가 빛을 만들어서 레비 이마에 비추면 전체적으로 다 밝아지는 거 아닐까?
    ja: |-
      私が光を出してレヴィのおでこに当てたら
      間接照明になるんじゃないかしら？
  d_main_47_01_26:
    speaker: leviathan
    en: You really say such utter nonsense with such sincerity. Also, I told you not
      to call me Levi.
    ko: |-
      헛소리를 아주 진지하게 하고 있네 정말.
      그리고 레비라고 부르지 말랬지.
    ja: |-
      マジメな顔で何を言い出すかと思えば…
      あとその呼び方はやめてって言ったでしょ？
  d_main_47_01_27:
    speaker: bahamut
    en: Ziz. It's dark.
    ko: 지즈. 어둡다.
    ja: ジズ。暗いぞ。
  d_main_47_01_28:
    speaker: neon_v_w
    en: Yeah, super dark.
    ko: 맞아요. 어두워요.
    ja: そうです、暗すぎます。
  d_main_47_01_29:
    speaker: ziz
    en: A-all right. It might slow us down a bit, but I'll open it just a tad.
    ko: |-
      아, 알겠어 그럼. 속도가 좀 떨어지긴 할 텐데,
      조금만 열게.
    ja: |-
      わ、分かったよ。
      スピードが少し落ちちゃうけど、
      ちょっとだけ開けるね…
  d_main_47_01_30:
    speaker: "<Monologue>"
    en: With a tearing sound, a crack opens up in the darkness.
    ko: 쩌억- 하는 소리와 함께 검은 공간이 갈라진다.
    ja: |-
      何かが裂けるような音とともに
      黒一面の空間が二つに割れた
  d_main_47_01_31:
    speaker: "<Monologue>"
    en: Sunlight and wind come pouring through the opening,
    ko: 갈라진 틈 사이로 햇빛과, 바람이 불어닥친다.
    ja: すき間から太陽の光と烈風が吹き込んでくる
  d_main_47_01_32:
    speaker: "<Monologue>"
    en: and the sky is revealed.
    ko: 그리고 하늘이 보인다.
    ja: 向こう側に空が見えた
  d_main_47_01_33:
    speaker: neon_v_w
    en: Yikes, we're too high up! It's kinda scary. Could you close it back up?
    ko: 헉. 너무 높아서 무서운데요. 다시 닫아주시면 안 될까요.
    ja: |-
      うっ、高すぎて怖いです。
      やっぱり閉めてもらえませんか？
  d_main_47_01_34:
    speaker: bahamut
    en: The wind's too strong. My pages keep flipping on their own. Close it.
    ko: 바람이 너무 불어 페이지가 멋대로 넘어간다. 다시 닫아라.
    ja: |-
      風が強すぎてページが勝手にめくれてしまう。
      もう一度閉めてくれたまえ。
  d_main_47_01_35:
    speaker: ziz
    en: Er... o-okay.
    ko: 아, 으, 응.
    ja: あ、う、うん…
  d_main_47_01_36:
    speaker: behemoth
    en: You people are unbelievable.
    ko: 가지가지한다, 정말.
    ja: あきれちまうな、まったく。
  d_main_47_01_37:
    speaker: leviathan
    en: Forget about them. Don't listen to them.
    ko: 됐어. 얘들 얘기 듣지 마.
    ja: 聞かなくていいって、こんなヤツらの話。
  d_main_47_01_38:
    speaker: "<Monologue>"
    en: We are being transported aboard Ziz's Dark Matter Pouch.
    ko: 우리는 지즈의 다크 매터 주머니에 탑승한 채 운반되고 있었다.
    ja: |-
      私たちはジズのダークマターの、
      いわばポケットに入り、運ばれている
  d_main_47_01_39:
    speaker: "<Monologue>"
    en: Through a small hole in the pouch, our destination comes into view.
    ko: 작은 구멍이 난 주머니 너머로, 우리의 목적지가 보인다.
    ja: 開いた小さな穴の向こうに、目的地が見えた
  d_main_47_01_40:
    speaker: "<Monologue>"
    en: Even from afar, the grandeur of the Lift is unmistakable.
    ko: 궤도 엘리베이터는, 멀리서도 그 위용을 유감없이 뿜어내고 있었다.
    ja: |-
      遠くからでも圧倒的な存在感を放つ、
      軌道エレベーターだ
  d_main_47_01_41:
    speaker: "<Self>"
    en: "... The Lift."
    ko: "…궤도 엘리베이터."
    ja: "…あれが軌道エレベーターか"
  d_main_47_01_42:
    speaker: anis_i_w
    en: It's my first time seeing it in person. It's impressive.
    ko: 실제로 보는 건 처음인데, 대단하네.
    ja: 実物は初めて見るけど、すごいわね。
  d_main_47_01_43:
    speaker: neon_v_w
    en: So that's where she is?
    ko: 저기에 있다는 거죠?
    ja: あそこにいるってことですよね？
  d_main_47_01_44:
    speaker: rapi_red
    en: Yeah. The Queen is there. Now that she's stolen Liliweiss' body, she's probably
      up there living it up, playing queen.
    ko: 응. 퀸은 저기 있어. 릴리바이스의 몸을 강탈하고, 유유자적 여왕 놀이를 하고 있겠지.
    ja: |-
      ええ。クイーンはあそこにいる。
      リリーバイスのボディを奪って、
      のんびり女王様を気取っているはず。
  d_main_47_01_45:
    speaker: snowwhite_h
    en: We're still not within firing range. Let's get a little closer.
    ko: "…아직 사거리가 나오지 않는다. 조금만 더 접근하자."
    ja: "…まだ射程外だ。もう少し近づけ。"
  d_main_47_01_46:
    speaker: behemoth
    en: What are you talking about? We're not here to attack her. Did you forget?
    ko: 무슨 소리야. 우리 공격하러 가는 거 아니라고. 잊었어?
    ja: |-
      何言ってんだ？
      まだケンカ売りに来たわけじゃなかっただろ？
  d_main_47_01_47:
    speaker: snowwhite_h
    en: I didn't forget. I just felt the urge to take a shot after seeing the Lift.
    ko: 잊지 않았다. 궤도 엘리베이터를 봤더니 쏘고 싶어졌을 뿐이다.
    ja: |-
      分かっている。
      軌道エレベーターを見ると
      つい撃ちたくなるだけだ。
  d_main_47_01_48:
    speaker: behemoth
    en: Is she all right in the head? I think lugging all those heavy weapons around
      has scrambled her brain.
    ko: |-
      얘 머리 괜찮은 거 맞아?
      무거운 걸 많이 들어서 머리가 망가졌나 봐.
    ja: |-
      ホントに分かってるんだろうな？
      重いモンの持ちすぎで頭壊れちまってねぇか？
  d_main_47_01_49:
    speaker: snowwhite_h
    en: You wouldn't understand, since you only carry those lightweight claws around.
    ko: 가벼운 집게를 들고 다니는 너는 이해하지 못하겠지.
    ja: そのアームの軽さでは、理解できないだろうな。
  d_main_47_01_50:
    speaker: behemoth
    en: "... I should add more claws. Maybe get eight of them."
    ko: "…나 집게 좀 늘려야겠다. 8개 정도로."
    ja: "…増やすか。8つくらいに。"
  d_main_47_01_51:
    speaker: rapi_red
    en: You'd be indistinguishable from a Harvester at that point.
    ko: 하베스터랑 구분이 안 가겠는데.
    ja: ハーベスターと見分けがつかなくなるわね。
  d_main_47_01_52:
    speaker: johan_op_l
    en: "... Silence. Need I remind all of you that we're in the middle of an infiltration
      mission?"
    ko: "…정숙해라. 잠입 중이라는 걸 다시 한 번 상기시켜줘야 하나?"
    ja: "…静かにしろ。潜入作戦の最中だと忘れたのか？"
  d_main_47_01_53:
    speaker: cecil_op_r
    en: I think it'd be better if you land soon.
    ko: 슬슬 착지하는 게 좋지 않을까요?
    ja: そろそろ着陸した方がよいのでは？
  d_main_47_01_54:
    speaker: johan_op_l
    en: Agreed, otherwise you'll run the chance of being detected by anti-aircraft
      guns or Storm Bringer.
    ko: 그래. 대공 화기나 스톰 브링어에게 발각될 가능성이 높다.
    ja: |-
      そうだな。
      対空火器やストームブリンガーに
      発見される可能性が高くなる。
  d_main_47_01_55:
    speaker: johan_op_l
    en: Land, then continue on foot.
    ko: 착지 후, 도보로 전환해라.
    ja: 着陸後は徒歩で目的地に近づけ。
  d_main_47_01_56:
    speaker: anis_i_w
    en: Eh? No thanks. I hate walking. I want to take the plane.
    ko: 에~? 싫어. 걷는 거 싫어. 비행기 타고 갈래.
    ja: ええ～？ヤダ、歩きたくない。飛行機がいい。
  d_main_47_01_57:
    speaker: neon_v_w
    en: If you're worried about the altitude, why don't we just fly lower?
    ko: 고도가 높아서 걱정이라면 고도를 낮춰서 가면 되지 않나요?
    ja: 高度の問題なら、低く飛べばいいのでは？
  d_main_47_01_58:
    speaker: rapi_red
    en: That's genius.
    ko: 천재적이야.
    ja: 天才ね。
  d_main_47_01_59:
    speaker: snowwhite_h
    en: Genius indeed.
    ko: 천재적이군.
    ja: 天才だ。
  d_main_47_01_60:
    speaker: johan_op_l
    en: "... Do something about them, @UserName."
    ko: "…어떻게 좀 해봐라. @UserName."
    ja: "…どうにかしてくれ、@UserName。"
  d_main_47_01_61:
    speaker: "<Self>"
    en: Ziz, just set us down somewhere suitable.
    ko: "…지즈. 적당한 곳에 착지해 줘."
    ja: "…ジズ、適当な場所に着地してくれ"
  d_main_47_01_62:
    speaker: ziz
    en: Oh, okay. Then I'll land.
    ko: 아, 응. 그럼 착지할게에….
    ja: あ、うん。それじゃあ、下りるね…
  d_main_47_01_63:
    speaker: "<Monologue>"
    en: With a whoosh, I feel my center of gravity shift.
    ko: 후욱- 하고 몸의 중심이 바뀌는 듯 한 느낌이 들었다.
    ja: 突然、身体の中身がずれるような感覚がした
  d_main_47_01_64:
    speaker: "<Monologue>"
    en: Ziz begins descending rapidly.
    ko: 지즈가 빠르게 하강하기 시작했다.
    ja: ジズが急降下を始めたからだ
  d_main_47_01_65:
    speaker: "<Monologue>"
    en: Moments later, we touch down on the surface, with the Lift now in sight.
    ko: 그리고 잠시 후, 우린 궤도 엘리베이터가 보이는 지면에 착지했다.
    ja: |-
      間を置かず、私たちは
      軌道エレベーターの見える場所に立っていた
  d_main_47_01_66:
    speaker: "<Narration>"
    en: Several days prior...
    ko: 며칠 전.
    ja: 数日前
  d_main_47_01_67:
    speaker: johan
    en: About time you showed up.
    ko: 왔나.
    ja: 来たか。
  d_main_47_01_68:
    speaker: cecil
    en: You're here.
    ko: 오셨군요.
    ja: お待ちしていました。
  d_main_47_01_69:
    speaker: "<Self>"
    en: Johan. Cecil.
    ko: 요한. 세실.
    ja: ヨハン、セシル
  d_main_47_01_70:
    speaker: rapi_red
    en: Long time no see.
    ko: 오랜만이야.
    ja: 久しぶりね。
  d_main_47_01_71:
    speaker: anis_i_w
    en: Even though we saw each other not too long ago.
    ko: 얼마 전에 봤지만 말이지.
    ja: 顔は少し前に見たばっかりだけどね。
  d_main_47_01_72:
    speaker: rapi_red
    en: Short time no see then.
    ko: 최근만이야.
    ja: 最近ぶりと言うべき？
  d_main_47_01_73:
    speaker: neon_v_w
    en: But it's really been a long time for me, hasn't it?
    ko: 근데 저는 진짜 오랜만인데요?
    ja: でも、私は本当に久しぶりですよ？
  d_main_47_01_74:
    speaker: johan
    en: Yes, it's been a while.
    ko: 그래. 너는 오랜만이군.
    ja: ああ。お前はそうなるな。
  d_main_47_01_75:
    speaker: cecil
    en: Huh, that's strange. I've never seen that type of weapon before.
    ko: "…뭔가 이상한데요. 무장 양식이 처음 보는 타입이군요."
    ja: |-
      …少し変わられましたね。
      初めて見るタイプの武装です。
  d_main_47_01_76:
    speaker: neon_v_w
    en: Oh, this? It was jointly developed by Elysion and Missilis. It's incredibly
      powerful. The firepower packs a serious punch.
    ko: |-
      아. 엘리시온이랑 미실리스가 합작으로 만든 무기거든요.
      엄청 세요. 화력이 뻥뻥 터져나오죠.
    ja: |-
      ああ、これはエリシオンとミシリスが
      共同開発した新作なんです。
      最強ですよ。火力がバーンと。
  d_main_47_01_77:
    speaker: cecil
    en: Elysion and Missilis? That's a first.
    ko: |-
      엘리시온과 미실리스가요?
      별일이 다 있네요.
    ja: |-
      エリシオンとミシリスが？
      珍しいこともあるものですね。
  d_main_47_01_78:
    speaker: johan
    en: Has the situation at the Ark been resolved?
    ko: "…방주의 일은 해결된 건가?"
    ja: "…アークの問題は片付いたのか？"
  d_main_47_01_79:
    speaker: "<Self>"
    en: Not entirely... but a lot of it has been taken care of, yes.
    ko: 응. 전부는 아니지만… 많이 해결됐어.
    ja: ああ。すべてではないが…一通り落ち着いた
  d_main_47_01_80:
    speaker: "<Self>"
    en: Speaking of which, I've got something to tell everyone at Eden.
    ko: 관련해서, 에덴에게 전할 말도 있고.
    ja: それに関して、エデンに伝えることもある
  d_main_47_01_81:
    speaker: johan
    en: Okay, let's talk inside.
    ko: 좋다. 그럼 안에 들어가서 얘기하지.
    ja: 分かった。続きは中で話そう。
  d_main_47_01_82:
    speaker: johan
    en: After you, @UserName.
    ko: 앞장서라. @UserName.
    ja: 先に行け、@UserName。
  d_main_47_01_83:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_84:
    speaker: rapi_red
    en: What's this? What's his angle? Why is he asking the Commander to take the
      lead?
    ko: |-
      뭐지. 무슨 꿍꿍이야.
      왜 지휘관한테 선두를 맡기지?
    ja: |-
      いったい何を企んでいるのかしら。
      指揮官に先頭を歩かせるなんて。
  d_main_47_01_85:
    speaker: johan
    en: "... An angle? I have nothing of the sort."
    ko: "…꿍꿍이라니. 그런 건 없다."
    ja: "…企み？何の話だ。"
  d_main_47_01_86:
    speaker: anis_i_w
    en: Wait a second. Now that I think about it, why did New Hope come all the way
      out here to welcome us?
    ko: 잠깐만. 생각해 보니 샛별님이 왜 여기까지 마중 나왔어?
    ja: |-
      待って。なんで新星様が
      わざわざ出迎えに来てくれたの？
  d_main_47_01_87:
    speaker: anis_i_w
    en: He never does that. His social skills are practically nonexistent.
    ko: |-
      샛별님 마중 같은 거 안 나오잖아.
      사회성 엉망이잖아.
    ja: |-
      そういうこと絶対しないタイプでしょ。
      社交性ゼロだし。
  d_main_47_01_88:
    speaker: cecil
    en: Hehehe!
    ko: 후.
    ja: ぷふっ…
  d_main_47_01_89:
    speaker: johan
    en: Don't laugh, Cecil.
    ko: 웃지마라 세실.
    ja: 笑うな、セシル。
  d_main_47_01_90:
    speaker: neon_v_w
    en: You're right. He would wait inside Eden, then act all high and mighty when
      we showed up.
    ko: 그러게요. 에덴 안에 있다가 우리가 가면 거만하게 맞이했죠.
    ja: |-
      そうです。いつもふんぞり返って
      私たちが来るのを待っていましたよね。
  d_main_47_01_91:
    speaker: johan
    en: I did no such thing.
    ko: 거만하게 맞이하지 않았다.
    ja: ふんぞり返っていた記憶はない。
  d_main_47_01_92:
    speaker: "<Self>"
    en: Maybe he's actually happy to see us this time.
    ko: 이제 우리가 그만큼 반가운 거 아닐까?
    ja: |-
      今はそれぐらい歓迎してくれるように
      なったということでは？
  d_main_47_01_93:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_94:
    speaker: rapi_red
    en: Is that it, Johan?
    ko: 그런 거야? 요한.
    ja: どうなの？ヨハン。
  d_main_47_01_95:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_96:
    speaker: johan
    en: Yes. That's right.
    ko: 그래. 맞다.
    ja: ああ、そうだな。
  d_main_47_01_97:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_98:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_99:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_100:
    speaker: "<Self>"
    en: Then how about a welcome hug?
    ko: 그럼 반가움의 포옹이라도….
    ja: そういうことなら、再会のハグを…
  d_main_47_01_101:
    speaker: johan
    en: Keep your distance. Just lead the way.
    ko: 가까이 오지 마라. 앞장이나 서라.
    ja: 近づくな。早く先に立って歩け。
  d_main_47_01_102:
    speaker: bahamut
    en: As you all know, knowledge is important.
    ko: 다들 잘 알고 있겠지만, 지식은 중요하다.
    ja: 皆も分かっていると思うが、知識は大事だ。
  d_main_47_01_103:
    speaker: bahamut
    en: After observing you all for quite some time, I, the wise Bahamut, have come
      to the unfortunate realization that your level of knowledge is simply abysmal.
    ko: |-
      똑똑한 바하무트가 이곳에서 너희를 한참 동안 지켜본 결과,
      너희들의 지식 수준이 참담하다는 것을 깨달았다.
    ja: |-
      賢いバハムートがここで君たちを
      しばらく観察したところ、諸君の知識レベルは
      悲惨だということに気がついた。
  d_main_47_01_104:
    speaker: bahamut
    en: Which is why I, the ever-brilliant Bahamut, have arranged this gathering to
      impart my knowledge to you all.
    ko: |-
      그래서 똑똑한 바하무트가 특별히,
      너희에게 지식을 나눠주는 자리를 마련했다.
    ja: |-
      そこで賢いバハムートは特別に、
      君たちへ知識を分け与える場を
      設けようと思う。
  d_main_47_01_105:
    speaker: bahamut
    en: 'I call this segment: "Ask the Wise Bahamut Anything."'
    ko: 이름하여 [똑똑한 바하무트에게 뭐든 물어보세요.]코너다.
    ja: |-
      名付けて、
      「賢いバハムートに何でも聞きたまえ」の
      コーナーだ。
  d_main_47_01_106:
    speaker: "<Narration>"
    en: Not a single cheer comes from the crowd gathered in Eden's lobby.
    ko: 에덴의 로비에 모인 많은 인원 중 그 누구도 환호하지 않았다.
    ja: |-
      エデンのロビーにそろった顔ぶれは
      誰一人として声を上げなかった
  d_main_47_01_107:
    speaker: bahamut
    en: Now then, ask me anything you're curious about.
    ko: 자, 뭐든 궁금한 게 있으면 물어봐라.
    ja: さあ、気になることは何でも聞きたまえ。
  d_main_47_01_108:
    speaker: "<Narration>"
    en: Not a single person says a word.
    ko: 에덴의 로비에 모인 많은 인원 중 그 누구도 입을 열지 않았다.
    ja: |-
      エデンのロビーにそろった顔ぶれは
      誰一人として口を開かなかった
  d_main_47_01_109:
    speaker: bahamut
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_110:
    speaker: bahamut
    en: 'Let me make this clear: ignorance is nothing to be ashamed of.'
    ko: 말해두지만, 무지한 것은 부끄러운 것이 아니다.
    ja: 言っておくが、無知は恥ずべきことではない。
  d_main_47_01_111:
    speaker: bahamut
    en: Only by facing your ignorance head-on can you ascend to greater intellectual
      heights.
    ko: 무지함에 당당히 맞서야만, 더욱 높은 곳으로 올라갈 수 있다.
    ja: |-
      己の無知と正面から向かい合ってこそ、
      さらなる高みへと至れるのだからな。
  d_main_47_01_112:
    speaker: bahamut
    en: So do not be afraid to ask questions.
    ko: 그러니 궁금한 것을 물어보는 것을 겁내지 마라.
    ja: 恐れずに何でも聞くがいい。
  d_main_47_01_113:
    speaker: papillon
    en: "... Look. We just got back from a search mission, and we're exhausted. Then
      you dragged us all the way out here..."
    ko: |-
      …저기 있잖아.
      수색 갔다와서 힘들어 죽겠는 마당에 갑자기 불러서 왔는데.
    ja: |-
      …ねえ。
      調査から帰ってきてクタクタのところで
      急に呼び出されて来てるんだけど…
  d_main_47_01_114:
    speaker: papillon
    en: What is this, anyway? Do you guys do this kind of thing often?
    ko: |-
      지금 이거 뭐 하는 거야?
      너희들 이런 거 자주 해?
    ja: |-
      みんなで何してるの、これ？
      あなたたち、いつもこんなことやってるの？
  d_main_47_01_115:
    speaker: ziz
    en: N-no. It's the first time.
    ko: 아, 아닌데. 처음인데.
    ja: ち、違う、こんなの初めてだよ…
  d_main_47_01_116:
    speaker: papillon
    en: So you have no idea how to wrap this up?
    ko: 그럼 어떻게 해야 끝나는지도 모르는 거네?
    ja: じゃあ、終わらせ方も分からないってことね？
  d_main_47_01_117:
    speaker: ziz
    en: Uh... Maybe if someone just asks a question?
    ko: 어… 뭐라도 질문하면 되지 않을까.
    ja: うーん…なにか質問すればいいのかな…
  d_main_47_01_118:
    speaker: papillon
    en: Hey, hey. Behemoth. Just ask her anything.
    ko: 얘, 얘. 베히. 뭐라도 질문 좀 해봐.
    ja: ねえ、ほら、ベヒ。何でもいいから質問してよ。
  d_main_47_01_119:
    speaker: behemoth
    en: Huh? Why me?
    ko: 아니 왜 난데.
    ja: なんであたしなんだよ。
  d_main_47_01_120:
    speaker: papillon
    en: You're the one who's closest with Bahamut.
    ko: 네가 바하무트랑 제일 친하잖아.
    ja: |-
      だってバハムートと一番仲良しなの、
      あなたでしょ？
  d_main_47_01_121:
    speaker: behemoth
    en: Isn't Levi closer?
    ko: 레비가 더 친할걸?
    ja: レヴィだと思うぞ？
  d_main_47_01_122:
    speaker: papillon
    en: Then you ask, Levi.
    ko: 레비. 네가 질문 해 그럼.
    ja: じゃレヴィ、なんか聞いて。
  d_main_47_01_123:
    speaker: leviathan
    en: I told you not to call me Levi.
    ko: 레비라고 부르지 말랬지.
    ja: その呼び方はやめてって言ってるでしょ。
  d_main_47_01_124:
    speaker: papillon
    en: Hurry up and ask something, Sparkles.
    ko: 반짝반짝아. 질문 해 빨리.
    ja: ピカピカちゃん、なんか聞いて。
  d_main_47_01_125:
    speaker: leviathan
    en: Don't call me that either!
    ko: 그렇게도 부르지 말라고!
    ja: そっちはもっとやめて！
  d_main_47_01_126:
    speaker: bahamut
    en: Silence during the lecture, Levi.
    ko: 강의 중엔 정숙해라, 레비.
    ja: 授業中だ、静かにしたまえ、レヴィ。
  d_main_47_01_127:
    speaker: leviathan
    en: How is this a lecture if you haven't said a thing?
    ko: 아무 말도 안하고 있으면서 무슨 강의야!
    ja: 何も教えてないのに授業も何もないでしょ！
  d_main_47_01_128:
    speaker: bahamut
    en: Go ahead. Ask your questions. I, the sagacious Bahamut, am ready.
    ko: 질문. 질문해라. 똑똑한 바하무트는 준비되어 있다.
    ja: |-
      質問だ。質問をくれたまえ。
      賢いバハムートは準備ができている。
  d_main_47_01_129:
    speaker: bahamut
    en: No one leaves this room until we've had a proper question-and-answer session.
    ko: 제대로 된 문답이 성립되기 전까진 아무도 여기서 벗어나지 못한다.
    ja: |-
      一問一答がきちんと成立するまで
      誰もここから出ることはできないぞ。
  d_main_47_01_130:
    speaker: papillon
    en: Someone do something about this. I haven't even had a chance to shower. What
      is this?
    ko: 어떻게 좀 해봐. 샤워도 못하고 이게 뭐람.
    ja: |-
      何とかしてよ。
      これじゃあシャワーにも行けないわ。
  d_main_47_01_131:
    speaker: leviathan
    en: "*Sigh* What are we even doing here?"
    ko: 하아… 이게 뭐 하는 짓인지 정말.
    ja: はぁ…なんなのよ、もう…
  d_main_47_01_132:
    speaker: leviathan
    en: Who made the Ar—
    ko: 방주는 누가 만들었-
    ja: アークは誰が作っ…
  d_main_47_01_133:
    speaker: bahamut
    en: The proper etiquette during a lecture is to raise your hand and say, "Professor
      Bahamut, I have a question."
    ko: |-
      손을 들고, 바하무트 선생님, 질문이 있습니다.
      라고 말하는 게 강의 중의 매너다.
    ja: |-
      手を上げて、
      「先生、質問があります」と言うのが
      授業中のマナーだ。
  d_main_47_01_134:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_135:
    speaker: leviathan
    en: Professor Bahamut. I have a question.
    ko: 바하무트 선생님. 질문이 있습니다.
    ja: 先生、質問があります。
  d_main_47_01_136:
    speaker: bahamut
    en: Good. Now ask your question.
    ko: 좋다. 질문해라.
    ja: いいだろう。聞かせたまえ。
  d_main_47_01_137:
    speaker: leviathan
    en: Who made the Ark?
    ko: 방주는 누가 만들었어?
    ja: アークは誰が作ったの？
  d_main_47_01_138:
    speaker: bahamut
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_139:
    speaker: bahamut
    en: A fine question, indeed. So, you are asking who created the Ark?
    ko: |-
      그래. 좋은 질문이군.
      방주는 누가 만들었냐는 질문인가.
    ja: |-
      ふむ、いい質問だ。
      アークは誰が作ったか、だな。
  d_main_47_01_140:
    speaker: bahamut
    en: The Ark is a place where pseudohumans and humans coexist. It is underground,
      and quite spacious...
    ko: |-
      방주란 유사 인간과 인간이 살고 있는 장소다.
      지하에 있고, 넓고….
    ja: |-
      アークとは、人間もどきと
      人間が住んでいる場所だ。
      地下にあり、広くて…
  d_main_47_01_141:
    speaker: bahamut
    en: It's underground... Yes.
    ko: 지하에 있다, 음.
    ja: 地下にある。うむ。
  d_main_47_01_142:
    speaker: ziz
    en: She just keeps harping about it being underground.
    ko: 지하 얘기밖에 안 하네.
    ja: 地下しか言ってないけど…
  d_main_47_01_143:
    speaker: papillon
    en: She's totally stalling for time right now.
    ko: 쟤 지금 필사적으로 시간 끌고 있는데?
    ja: |-
      引き延ばして時間を稼いでるんじゃ
      ないでしょうね？
  d_main_47_01_144:
    speaker: leviathan
    en: Hurry up and answer the question.
    ko: 빠른 답변 부탁해.
    ja: 早く答えを教えて。
  d_main_47_01_145:
    speaker: bahamut
    en: Very well. If you are asking who made the Ark...
    ko: 그래. 방주는 누가 만들었냐면.
    ja: そうだ、アークは誰が作ったのかというと…
  d_main_47_01_146:
    speaker: bahamut
    en: I, the clever Bahamut, made it.
    ko: 똑똑한 바하무트가 만들었다.
    ja: 賢いバハムートが作ったのだ。
  d_main_47_01_147:
    speaker: leviathan
    en: All right, everyone's dismissed. The speaker's a fraud, so the lecture's canceled.
    ko: 자- 해산. 해산 사유는 선생님이 사기꾼이라서 강의 성립이 안 돼서야.
    ja: |-
      は～い解散、解散。
      先生がほら吹きじゃ
      授業にならないでしょうが。
  d_main_47_01_148:
    speaker: bahamut
    en: Next question. I'll take the next question now.
    ko: 다음 질문. 다음 질문을 받겠다.
    ja: 次だ。誰か質問はないか？
  d_main_47_01_149:
    speaker: snowwhite_h_no
    en: Is there a food that will keep you full for three days after eating one serving?
    ko: 하나 먹으면 3일 동안 배부른 음식이 있나?
    ja: |-
      ひとつ食えば3日間
      腹が減らずに済む食べ物はないか？
  d_main_47_01_150:
    speaker: bahamut
    en: The answer's simple. Just eat three days' worth of food in one sitting.
    ko: 간단하다. 3일치 음식을 한 번에 먹으면 된다.
    ja: |-
      簡単な話だ。
      3日分の食べものを一度に食べればいい。
  d_main_47_01_151:
    speaker: snowwhite_h_no
    en: "...! That's genius!"
    ko: "…! 천재적이군."
    ja: "…！天才だ。"
  d_main_47_01_152:
    speaker: bahamut
    en: Such is the brilliance of me, Bahamut!
    ko: 똑똑한 바하무트는 똑똑하니까.
    ja: 賢いバハムートは賢いのだよ。
  d_main_47_01_153:
    speaker: leviathan
    en: You guys are having a ball, aren't you?
    ko: 잘들 논다 정말.
    ja: ホント楽しそうね。
  d_main_47_01_154:
    speaker: leviathan
    en: "... Wait. Where did the kid go off to again?"
    ko: "…잠깐. 얘는 또 어디 갔어?"
    ja: "…待って。あの子はどこ？"
  d_main_47_01_155:
    speaker: behemoth
    en: She went to see the sleeping princess, of course.
    ko: 잠자는 공주님 보러 갔지 뭐.
    ja: 眠り姫のところだろ。
  d_main_47_01_156:
    speaker: leviathan
    en: Marian? What, is she made of honey or something? Why's that kid always running
      over to see her?
    ko: |-
      마리안? 아니 걔 몸에 뭐 꿀이라도 발라 놨대?
      뭘 틈만 나면 가서 그러고 있는 거야.
    ja: |-
      マリアンのこと？
      身体にハチミツでも塗ってあるの？
      ちょっと見ないと、いつもあそこなんだけど。
  d_main_47_01_157:
    speaker: leviathan
    en: Is she over there talking to herself again?
    ko: 가서 또 계속 혼잣말하고 있어?
    ja: また何か、独りごとを言ってる？
  d_main_47_01_158:
    speaker: behemoth
    en: Yes, same as always.
    ko: 응. 계속 그러고 있지.
    ja: ああ。ずっとな。
  d_main_47_01_159:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_160:
    speaker: leviathan
    en: She'll be okay, right? I heard Marian's a Queen too.
    ko: |-
      괜찮겠지?
      마리안도 퀸이라며.
    ja: |-
      大丈夫だよね？
      マリアンもクイーンなんでしょ？
  d_main_47_01_161:
    speaker: behemoth
    en: Yes, or at least she used to be. Right now, she's barely surviving on a pseudo-core.
    ko: |-
      응. 그랬었다고 했지.
      지금은 유사 코어로 연명만 하고 있는 중이고.
    ja: |-
      ああ。そうだったんだってな。
      今は疑似的なコアで死なせないのが
      やっとらしいけど。
  d_main_47_01_162:
    speaker: leviathan
    en: "... The Queen we created, and a Queen born of nature."
    ko: "…우리가 만든 퀸과, 자연 발생한 퀸."
    ja: |-
      …私たちが作ったクイーンと、
      どこで生まれたか知らないクイーン…
  d_main_47_01_163:
    speaker: leviathan
    en: I shudder to imagine what would happen if those two paired up.
    ko: 둘이 만나면 무슨 일이 벌어질지 상상이 안 가네.
    ja: 意識がある時に会ったらどんなことになるか…
  d_main_47_01_164:
    speaker: behemoth
    en: So what do we do? Forcibly separate them?
    ko: 그럼 어떡해. 억지로 떼어 놔?
    ja: どうする気だよ。無理にでも引き離すか？
  d_main_47_01_165:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_01_166:
    speaker: ziz
    en: Uh... I'm sure it'll be okay?
    ko: 그… 괜찮지 않을까?
    ja: だ…大丈夫じゃないかな？
  d_main_47_01_167:
    speaker: ziz
    en: They're both on our side, after all.
    ko: 두, 둘 다 우리 편이니까.
    ja: 二人とも私たちの味方なんだし…
  d_main_47_01_168:
    speaker: behemoth
    en: Yeah. I agree with Ziz.
    ko: 응. 나도 지즈 의견에 동의해.
    ja: そうだな。あたしもジズと同じ意見だ。
  d_main_47_01_169:
    speaker: behemoth
    en: Everything about Marian tells me she's on our side.
    ko: |-
      마리안이라는 애.
      아무리 봐도 우리 편이거든.
    ja: |-
      マリアンとかいうヤツも、
      どう考えたってこっちの仲間だしな。
  d_main_47_01_170:
    speaker: behemoth
    en: I don't get the feeling that anything bad will happen.
    ko: 나쁜 일이 생길 거라는 느낌은 안 드네.
    ja: 悪いようにはならないだろ。
  d_main_47_01_171:
    speaker: leviathan
    en: You're being naive.
    ko: 안일하네.
    ja: のんきすぎよ。
  d_main_47_01_172:
    speaker: ziz
    en: L-Levi, aren't you worrying too much?
    ko: 레, 레비가 너무 걱정이 많은 거 아닐까아….
    ja: レ、レヴィが心配しすぎなんじゃないかなぁ…
  d_main_47_01_173:
    speaker: leviathan
    en: "... This won't do. I'm going to bring her back."
    ko: "…안되겠어. 데려와야겠어."
    ja: "…やっぱダメ。呼び戻さないと。"
  d_main_47_01_174:
    speaker: behemoth
    en: Leave her be. She wants to be there, so why do you keep making such a fuss?
    ko: 놔둬. 놀겠다는데 뭘 자꾸 그래.
    ja: 放っておけ。遊ばせてやれよ。
  d_main_47_01_175:
    speaker: ziz
    en: Ugh... You're so overprotective.
    ko: 으… 과보호.
    ja: うーん…過保護…
  d_main_47_01_176:
    speaker: leviathan
    en: I'm not being overprotective, I'm being prudent.
    ko: 과보호가 아니라. 신중한 거야.
    ja: 過保護じゃなくて、慎重なの。
  d_main_47_01_177:
    speaker: papillon
    en: If you're already this overbearing, she's going to end up rebelling.
    ko: 벌써부터 그렇게 강압적으로 대하면 나중에 엇나간다?
    ja: |-
      今からそんなに厳しくしてたら
      後でグレちゃうかもよ？
  d_main_47_01_178:
    speaker: snowwhite_h_no
    en: Agreed. Give her some freedom, and she'll grow on her own.
    ko: 동의한다. 자유롭게 두면 알아서 성장한다.
    ja: |-
      その通りだ。
      自由にしておけば、自然に成長する。
  d_main_47_01_179:
    speaker: snowwhite_h_no
    en: That's how we raised Marian, and she turned out wonderfully because of it.
    ko: 우리는 마리안을 그렇게 키웠고, 그 덕에 훌륭하게 잘 자랐다.
    ja: |-
      私たちはマリアンをそうやって育てた。
      立派に育った。
  d_main_47_01_180:
    speaker: papillon
    en: See? I told you.
    ko: 거봐. 그렇다잖아.
    ja: ほらね。やっぱりそうでしょ。
  d_main_47_01_181:
    speaker: leviathan
    en: I-I don't believe you. Somehow, I just don't.
    ko: 모, 못 믿겠어. 이상하게 못 믿겠어.
    ja: |-
      ダメ、信じられない。
      なんでか分かんないけど、全然。
  d_main_47_01_182:
    speaker: bahamut
    en: Parenting is difficult, Levi. I, the ever-astute Bahamut, will teach you everything
      from Z to A about parenting, so ask away.
    ko: |-
      육아는 어렵다, 레비.
      똑똑한 바하무트가 육아의 Z부터 A까지 알려줄 테니 질문해라.
    ja: |-
      子を育てるとは難しいものだ、レヴィ。
      賢いバハムートが育児のイロハを教えてやろう。
      なんでも質問したまえ。
  d_main_47_01_183:
    speaker: leviathan
    en: You're better off getting advice from a deer in the woods.
    ko: 그냥 숲에 있는 사슴한테 물어보는 게 더 나을걸.
    ja: はぁ…森でシカに聞く方がマシ。
  d_main_47_01_184:
    speaker: "<Narration>"
    en: Leviathan grumbles as she walks away.
    ko: 레비아탄이 투덜대며 걸어간다.
    ja: レヴィアタンはぼやきながら、その場を離れた
  d_main_47_01_185:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_main_47_01_186:
    speaker: "<Narration>"
    en: The door across from Leviathan opens,
    ko: 레비아탄의 맞은편 문이 열리고
    ja: レヴィアタンの前で扉が開いた
  d_main_47_01_187:
    speaker: "<Narration>"
    en: and a girl with a bright smile comes running out.
    ko: 활짝 웃는 표정의 소녀가 뛰어나온다.
    ja: 満面の笑みを浮かべた少女が飛び出してきた
  d_main_47_01_188:
    speaker: onlyone_c
    en: Hehehe!
    ko: 꺄하하! 꺄하-!
    ja: きゃはは！きゃは！
  d_main_47_01_189:
    speaker: leviathan
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_main_47_01_190:
    speaker: "<Narration>"
    en: Leviathan's heart melts at the sight of the girl running toward her with arms
      wide open and a bright smile.
    ko: 양팔을 벌리고 활짝 웃으며 뛰어오는 소녀의 모습을 본 레비아탄은 갑자기 마음이 사르르 녹는 듯한 느낌을 받았다.
    ja: |-
      両腕を広げて笑いながら駆け寄ってくる
      少女の姿を見たレヴィアタンは、
      自分の頬がゆるんでいることを感じた
  d_main_47_01_191:
    speaker: "<Narration>"
    en: Leviathan crouches to the floor, ready to embrace the girl.
    ko: 레비아탄은 바닥에 쪼그리고 앉은 후, 달려오는 소녀를 안아줄 준비를 한다.
    ja: |-
      その場で腰を落とし、
      駆け寄ってくる少女を
      抱きかかえようと待ち構える
  d_main_47_01_192:
    speaker: onlyone_c
    en: Hehe!
    ko: 꺄하-!
    ja: きゃはは！
  d_main_47_01_193:
    speaker: "<Narration>"
    en: The little girl runs right past Leviathan.
    ko: 소녀는 레비아탄을 스쳐 지나간다.
    ja: 少女はレヴィアタンの横をすり抜けていった
  d_main_47_01_194:
    speaker: "<Narration>"
    en: Leviathan feels anger, disappointment, and a hint of sadness.
    ko: 레비아탄은 분노와 섭섭함, 그리고 조금의 슬픔을 느낀다.
    ja: |-
      レヴィアタンはいら立ちと寂しさ、
      そしてわずかな悲しみを覚えた
  d_main_47_01_195:
    speaker: ziz
    en: Heh... L-Levi? Wh-what are you doing?
    ko: 흐헤, 레, 레비. 뭐, 뭐해?
    ja: へへ…あれ、レヴィ。何してるの？
  d_main_47_01_196:
    speaker: leviathan
    en: Sh-shut it.
    ko: 조, 조용히 해.
    ja: う、うるさい。
  d_main_47_01_197:
    speaker: "<Narration>"
    en: Leviathan grumbles as she rises to her feet.
    ko: 레비아탄은 투덜대며 자리에서 일어난다.
    ja: レヴィアタンは不平をこぼしながら立ち上がった
  d_main_47_01_198:
    speaker: "<Narration>"
    en: Then she looks toward where the girl ran off to.
    ko: 그리고 소녀가 뛰어가는 방향을 바라본다.
    ja: 駆けていった少女の行く先を目で追った
  d_main_47_01_199:
    speaker: "<Narration>"
    en: Johan, Cecil,
    ko: 요한과 세실.
    ja: ヨハンとセシル
  d_main_47_01_200:
    speaker: "<Narration>"
    en: and four familiar faces are making their way over.
    ko: 그리고 익숙한 얼굴 넷이 걸어오고 있었다.
    ja: |-
      そして、見知った顔の4人組が
      こちらに向かって歩いてくる
d_main_47_02:
  d_main_47_02_1:
    speaker: "<Monologue>"
    en: As we enter Eden,
    ko: 에덴 안으로 들어온다.
    ja: 私たちはエデンの中を歩いた
  d_main_47_02_2:
    speaker: "<Monologue>"
    en: we're greeted by familiar sights.
    ko: 익숙한 풍경들이 보인다.
    ja: すでに見慣れているたたずまいだ
  d_main_47_02_3:
    speaker: "<Monologue>"
    en: In the distance, I see a child racing toward me at full speed.
    ko: 그리고 멀리서, 나를 향해 전력으로 뛰어오고 있는 아이가 보인다.
    ja: |-
      遠くからこちらに向かって
      全速力で走ってくる小さな影が見えた
  d_main_47_02_4:
    speaker: "<Monologue>"
    en: With a bright smile and arms spread wide, the child leaps and throws herself
      into my arms.
    ko: |-
      활짝 웃으며, 양팔을 벌린 채 뛰어오는 아이는,
      펄쩍 뛰어 내 몸으로 달려들었다.
    ja: |-
      満面の笑みで両腕を広げ、
      駆け寄ってきた少女が勢いよく私に飛びつく
  d_main_47_02_5:
    speaker: onlyone_c
    en: Hug me!
    ko: 안아 줘-!!
    ja: だっこ！！
  d_main_47_02_6:
    speaker: "<Monologue>"
    en: I wrap my arms around the child as she leaps into my embrace.
    ko: 달려들어 뛰어온 아이를 끌어안는다.
    ja: 私は少女を抱き上げた
  d_main_47_02_7:
    speaker: "<Monologue>"
    en: She nuzzles her cheek against me, seemingly delighted.
    ko: 아이는 기분 좋은 듯 내 몸에 뺨을 부빈다.
    ja: 少女は嬉しそうに頬をすり寄せた
  d_main_47_02_8:
    speaker: onlyone_c
    en: Hehe. It's warm. Feels good.
    ko: 헤헤. 따뜻해. 좋아.
    ja: えへへ、あったかい。
  d_main_47_02_9:
    speaker: "<Self>"
    en: There, there. Have you been doing well?
    ko: 그래그래. 잘 지냈어?
    ja: そうだな、元気だったか？
  d_main_47_02_10:
    speaker: onlyone_c
    en: Uh-huh!
    ko: 응!
    ja: うん！
  d_main_47_02_11:
    speaker: leviathan
    en: Look at her, running straight into his arms. Unbelievable.
    ko: |-
      쪼르르 달려가서 안기는 것 좀 봐.
      기가 막혀서.
    ja: |-
      見つけて真っ先に抱きつきにいくなんて、
      なんなのよ、もう。
  d_main_47_02_12:
    speaker: "<Self>"
    en: You're all here.
    ko: 다들 와줬구나.
    ja: 来てくれていたようだな
  d_main_47_02_13:
    speaker: leviathan
    en: Yeah. We made it.
    ko: 그래. 왔어.
    ja: うん。来てあげた。
  d_main_47_02_14:
    speaker: behemoth
    en: How are things?
    ko: 별일 없었어?
    ja: あれから元気してたか？
  d_main_47_02_15:
    speaker: ziz
    en: Uh... Th-there are people I don't recognize...
    ko: 어… 처, 처음보는 애들이 있네에….
    ja: わ…初めましての人たちもいる…
  d_main_47_02_16:
    speaker: bahamut
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_17:
    speaker: anis_i
    en: What a strange sight, seeing the Four Beasts in Eden.
    ko: |-
      되게 이질적인 장면이네.
      포비스트가 에덴에 있으니까.
    ja: |-
      やっぱり自分の目を疑っちゃうわね。
      フォービーストがエデンにいるなんて。
  d_main_47_02_18:
    speaker: neon_v
    en: I know, right?
    ko: 그러게요.
    ja: そうですね。
  d_main_47_02_19:
    speaker: anis_i
    en: "... Hmm. All we've ever done is fight them. But since everything's been resolved,
      we should at least go say hi."
    ko: "…음. 뭐 우리 입장에서는 포비스트랑은 싸웠던 기억밖에 없지만, 그래도 잘 해결됐다니까 인사라도 하자."
    ja: |-
      …うーん…私たちは戦ってた
      記憶しかないけど。丸く収まったみたいだし、
      あいさつしときましょ。
  d_main_47_02_20:
    speaker: neon_v
    en: Shall we?
    ko: 그럴까요.
    ja: そうですね。
  d_main_47_02_21:
    speaker: anis_i
    en: Hey, Leviathan. Your forehead's looking even shinier than usual. Care for
      a sparkle-off with me?
    ko: |-
      여, 레비아탄.
      이마가 더 반짝반짝하네. 나랑 반짝반짝 대결이라도 해볼까?
    ja: |-
      久しぶり～レヴィアタン。
      おでこの輝きに磨きがかかったわね。
      私と明るさ対決でもする？
  d_main_47_02_22:
    speaker: leviathan
    en: Wh-why you...!
    ko: 이, 이게…!
    ja: こ…このっ…！
  d_main_47_02_23:
    speaker: neon_v
    en: Your claws haven't changed a bit, Behemoth. Bet you can't lift my weapon with
      those flimsy things though.
    ko: |-
      베히모스의 집게는 여전하네요.
      하지만 그런 연약한 집게로는 제 무기는 들 수 없을걸요.
    ja: |-
      ベヒモスのアームも変わっていませんね。
      でも、そんな貧弱なアームでは
      私の火力に勝てませんよ。
  d_main_47_02_24:
    speaker: behemoth
    en: Oh, really now?
    ko: 어쭈?
    ja: へぇ？
  d_main_47_02_25:
    speaker: rapi_red
    en: Don't pick a fight. They're weak, so it's easy to get a rise out of them.
    ko: |-
      시비 걸지 마.
      나약한 애들이라서 쉽게 반응하니까.
    ja: |-
      挑発してはダメよ。
      弱い相手ほど乗ってくるから。
  d_main_47_02_26:
    speaker: "<Self>"
    en: "... I apologize on their behalf."
    ko: "…내가 사과할게."
    ja: "…代わりに謝らせてくれ"
  d_main_47_02_27:
    speaker: behemoth
    en: Haha. You guys are still as delightful as ever.
    ko: 하핫. 여전히 유쾌한 녀석들이네.
    ja: アハハ…相変わらずユカイなヤツらだ。
  d_main_47_02_28:
    speaker: behemoth
    en: It's your first time meeting Ziz and Bahamut, isn't it?
    ko: 둘은 지즈랑 바하무트는 처음 보지?
    ja: ジズとバハムートは初めてだったよな？
  d_main_47_02_29:
    speaker: behemoth
    en: Go on, say hello.
    ko: 자, 인사해.
    ja: ほら、自己紹介しときな。
  d_main_47_02_30:
    speaker: ziz
    en: Uh... H-hello... I-I'm Ziz.
    ko: |-
      어… 아, 안녀엉….
      지, 지즈라고 해.
    ja: |-
      は…は、初めましてぇ…
      私、ジズだよ。
  d_main_47_02_31:
    speaker: neon_v
    en: Nice to meet you, Ziz. You can call me Neon.
    ko: |-
      반가워요 지즈.
      네온이라고 불러주세요.
    ja: |-
      初めましてですね、ジズ。
      ネオンと呼んでください。
  d_main_47_02_32:
    speaker: anis_i
    en: You seem shy, but your figure says otherwise... Definitely the type people
      can't get enough of.
    ko: "…소심하지만 몸은 그렇지 않은… 수요가 있다 못해 넘치는 타입이네."
    ja: |-
      …内気だけど、ボディは強気…
      需要がありすぎるタイプね…
  d_main_47_02_33:
    speaker: ziz
    en: Uh, wh-what?
    ko: 어, 으, 응?
    ja: え…あの、ええと？
  d_main_47_02_34:
    speaker: anis_i
    en: Never mind. I'm Anis.
    ko: 아무것도 아냐. 아니스라고 해.
    ja: 気にしないで。アニスよ。
  d_main_47_02_35:
    speaker: bahamut
    en: Pleasure to meet you. You may address me as the Wise Bahamut.
    ko: 반갑다. 똑똑한 바하무트라고 불러라.
    ja: |-
      会えて嬉しい。
      賢いバハムートと呼んでくれたまえ。
  d_main_47_02_36:
    speaker: neon_v
    en: Oh, then you can call me Neo-Neon.
    ko: 오. 그럼 저는 네오-네온이라고 불러주세요.
    ja: |-
      なるほど。では私のことは
      ネオ・ネオンと呼んでください。
  d_main_47_02_37:
    speaker: anis_i
    en: And you can call me Star Anis.
    ko: 나는 스타 아니스라고 불러줄래?
    ja: 私はスターアニスって呼んでくれる？
  d_main_47_02_38:
    speaker: bahamut
    en: I'll commit it to memory. After all, I, the knowledgeable Bahamut, have an
      excellent memory.
    ko: |-
      기억하겠다.
      똑똑한 바하무트는 기억력이 좋으니까.
    ja: |-
      覚えておこう。
      賢いバハムートは記憶力も優れているのだ。
  d_main_47_02_39:
    speaker: bahamut
    en: Forgive my bluntness, but how would you rate your own level of knowled—
    ko: 초면에 미안하지만, 너희들은 스스로의 지식 수준이 어느 정도라고 생각-
    ja: |-
      初対面でぶしつけだが、
      君たちは自分の知識レベルをどの程度だと…
  d_main_47_02_40:
    speaker: leviathan
    en: All right! Now that everyone's here, I believe there's something we have to
      discuss?
    ko: 자! 그럼 다들 모였으니까 할 얘기가 있지 않아?
    ja: はい！みんな集まったし、本題に入っていい？
  d_main_47_02_41:
    speaker: "<Self>"
    en: Oh, right. I was hoping everyone could gather a bit closer, but...
    ko: 아, 응. 다들 좀 모였으면 좋겠… 는데….
    ja: ああ。こっちだ、みんな集まって…えー…
  d_main_47_02_42:
    speaker: "<Monologue>"
    en: The child clinging to me refuses to budge.
    ko: 몸에 달라붙은 아이가 꼼짝도 하지 않는다.
    ja: 身体をくっつけたままの少女が離れようとしない
  d_main_47_02_43:
    speaker: onlyone_c
    en: Heheh. Hehehe.
    ko: 에헤. 헤헤헤.
    ja: えへ。えへへへ。
  d_main_47_02_44:
    speaker: "<Monologue>"
    en: Seeing her beaming smile, I can't help but smile too.
    ko: 싱글벙글 웃는 모습을 보니 나도 모르게 웃음이 난다.
    ja: あまりの笑顔に、私もつられて笑いそうになる
  d_main_47_02_45:
    speaker: "<Monologue>"
    en: "... But I can't shake the feeling that I'm forgetting something important..."
    ko: "…그런데, 뭔가 중요한 걸 잊고 있는 듯한 느낌이…."
    ja: しかし、何か重大な問題を忘れているような…
  d_main_47_02_46:
    speaker: anis_i
    en: So this is the Queen the Four Beasts created? She's tiny.
    ko: |-
      …얘가 포비스트 너희가 만든 퀸이라 이거지?
      엄청 작네.
    ja: |-
      …フォービーストが作ったクイーンって
      この子のこと？すごく小さいのね。
  d_main_47_02_47:
    speaker: neon_v
    en: You're right. I was expecting a Queen to look a lot more intimidating.
    ko: 그러게요. 퀸이라고 하면 응당 험악한 인상을 기대했는데.
    ja: |-
      そうですね。なにせクイーンですし、
      もっと悪そうな顔かと思っていました。
  d_main_47_02_48:
    speaker: anis_i
    en: Speaking of which, she's awfully fond of the Commander. She's stuck to him
      like glue...
    ko: |-
      그나저나 지휘관님 너무 좋아하는 거 아냐?
      붙어서 떨어지질 않….
    ja: |-
      だいたい、指揮官様のこと好きすぎじゃない？
      さっきから全然離れようと…
  d_main_47_02_49:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_50:
    speaker: anis_i
    en: "... Isn't that Rapi?"
    ko: "…라피, 잖아."
    ja: "…ラピ、よね。"
  d_main_47_02_51:
    speaker: neon_v
    en: "... Huh?"
    ko: "…예?"
    ja: "…はい？"
  d_main_47_02_52:
    speaker: anis_i
    en: "... That kid looks just like Rapi."
    ko: "…얘. 라피랑 똑같이 생겼어."
    ja: "…この子。ラピにそっくり。"
  d_main_47_02_53:
    speaker: neon_v
    en: Eh? No way. Rapi isn't nearly as cute and adorable.
    ko: |-
      예에~? 그럴리가요.
      라피는 이렇게 귀엽고 사랑스럽지 않다고요.
    ja: |-
      ええ～？まさか～
      ラピはこんなに可愛らしくありませんよ。
  d_main_47_02_54:
    speaker: neon_v
    en: And the size difference is way too... Wait, that is Rapi.
    ko: 결정적으로 크기가 차이가 너무 나잖- 라피네요?
    ja: そもそも大きさが全然違い…ラピですね？
  d_main_47_02_55:
    speaker: papillon
    en: Oh my, you're right. No wonder I thought she looked familiar.
    ko: |-
      어머. 그러네?
      어쩐지, 뭔가 익숙한 얼굴인가 싶더라니.
    ja: |-
      あら、ホントね？
      どうりで、なんでか見覚えのある顔だと
      思ってたわ。
  d_main_47_02_56:
    speaker: johan
    en: Hmm... They do look alike.
    ko: "…그렇군. 닮았군."
    ja: "…そうだな。よく似ている。"
  d_main_47_02_57:
    speaker: cecil
    en: You're right... Now that you've pointed it out, the resemblance is uncanny.
    ko: "…그렇네요. 인지하고 나서 보니까 정말 닮았어요."
    ja: |-
      …そうですね。
      言われてみると、本当に似ています。
  d_main_47_02_58:
    speaker: anis_i
    en: R-right? I knew I couldn't be the only one who felt that way.
    ko: 그, 그렇지? 나만 그렇게 느낀 거 아니지?
    ja: |-
      そ、そうよね？
      私だけじゃないわよね？
  d_main_47_02_59:
    speaker: neon_v
    en: "... What in the world is going on?"
    ko: "…무슨, 일일까요 이게."
    ja: "…いったいどういうことでしょう。"
  d_main_47_02_60:
    speaker: "<Monologue>"
    en: Oh...
    ko: "…아."
    ja: "…あー…"
  d_main_47_02_61:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_62:
    speaker: rapi_red
    en: Heh.
    ko: 후.
    ja: ふ…
  d_main_47_02_63:
    speaker: rapi_red
    en: Hehehehehe.
    ko: 후후후후후.
    ja: ふふふふふ…
  d_main_47_02_64:
    speaker: rapi_red
    en: The time has finally come to reveal the secret I've kept hidden for so long.
    ko: 드디어 오래 숨겨놨던 비밀을 얘기할 때가 왔네.
    ja: |-
      長い間隠していた秘密を
      とうとう明かす時が来たようね。
  d_main_47_02_65:
    speaker: "<Monologue>"
    en: I completely forgot to explain the whole situation.
    ko: 자초지종을 설명하는 걸 완전 잊고 있었다.
    ja: 事情の説明を完全に忘れていた…
  d_main_47_02_66:
    speaker: rapi_red
    en: Well, little one, who's this wonderful person you're hugging?
    ko: |-
      자, 아가야.
      지금 네가 안겨있는 이 멋진 사람은 누구지?
    ja: |-
      ほら、見て。
      今、あなたを抱っこしてくれている
      ステキな人はだぁれ？
  d_main_47_02_67:
    speaker: onlyone_c
    en: Daddy! Daddy!
    ko: 아빠, 아빠!
    ja: パパ、パパ！
  d_main_47_02_68:
    speaker: anis_i
    en: "... What?"
    ko: "…뭣."
    ja: "…なんて？"
  d_main_47_02_69:
    speaker: neon_v
    en: "... Huh?"
    ko: "…예?"
    ja: "…はい？"
  d_main_47_02_70:
    speaker: papillon
    en: "... Oh my."
    ko: "…어머."
    ja: "…あら。"
  d_main_47_02_71:
    speaker: johan
    en: "... Come again?"
    ko: "…뭐?"
    ja: "…何？"
  d_main_47_02_72:
    speaker: cecil
    en: "...?!"
    ko: "…!?"
    ja: "…！？"
  d_main_47_02_73:
    speaker: snowwhite_h_no
    en: "...??"
    ko: "…??"
    ja: "…？？"
  d_main_47_02_74:
    speaker: rapi_red
    en: And who am I?
    ko: 그럼 나는 누구지?
    ja: じゃあ、私は？
  d_main_47_02_75:
    speaker: onlyone_c
    en: Mommy! Mommy!
    ko: 엄마, 엄마!
    ja: ママ、ママ！
  d_main_47_02_76:
    speaker: anis_i
    en: What!
    ko: 뭣!
    ja: はぁ！？
  d_main_47_02_77:
    speaker: neon_v
    en: Huh?!
    ko: 예!?
    ja: ええっ！？
  d_main_47_02_78:
    speaker: papillon
    en: Oh my goodness! Oh my goodness!
    ko: 어머 어머! 어머머!
    ja: あらあらあらあら！
  d_main_47_02_79:
    speaker: johan
    en: What...!
    ko: 뭐…!
    ja: 何だと…！？
  d_main_47_02_80:
    speaker: cecil
    en: "...?!?!"
    ko: "…!?!?"
    ja: "…！？！？"
  d_main_47_02_81:
    speaker: snowwhite_h_no
    en: "...????"
    ko: "…????"
    ja: "…？？？？"
  d_main_47_02_82:
    speaker: rapi_red
    en: That's right. Mommy and Daddy.
    ko: 그래그래. 아빠랑 엄마야.
    ja: そうね。パパとママよ。
  d_main_47_02_83:
    speaker: onlyone_c
    en: Hehe! Mommy! Daddy!
    ko: 헤헤! 아빠! 엄마!
    ja: えへへ！パパ！ママ！
  d_main_47_02_84:
    speaker: "<Monologue>"
    en: Rapi flips her hair with a smug, self-satisfied look.
    ko: 라피가 한껏 우쭐대는 표정으로 머리카락을 흩뿌린다.
    ja: ラピが得意げな表情で髪をなびかせている
  d_main_47_02_85:
    speaker: rapi_red
    en: Well, that's how things turned out.
    ko: 뭐, 그렇게 됐어.
    ja: つまり、そういうことよ。
  d_main_47_02_86:
    speaker: anis_i
    en: "..."
    ko: |-
      …….
      …….
    ja: |-
      ……
      ……
  d_main_47_02_87:
    speaker: anis_i
    en: Wh-what on earth are you talking about? Haha. Th-this isn't funny at all.
    ko: |-
      무, 무슨 소리야 대체. 하하.
      재, 재미없다 진짜.
    ja: |-
      な、何言ってるのよ。あはは…
      ぜっ、全然面白くないわよ。
  d_main_47_02_88:
    speaker: anis_i
    en: C-C-C-Commander, Rapi said something really strange.
    ko: 지, 지지지지휘관님. 라피가 이, 이상한 소리 하는데?
    ja: |-
      ほら、ししし指揮官様。
      ラ、ラピがなんかおかしなこと
      言いだしてるわよ？
  d_main_47_02_89:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_90:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_91:
    speaker: anis_i
    en: Why... why aren't you saying anything... Well? Well?!
    ko: 왜… 입다물고 있는거… 야. 응? 응!? 으응!?
    ja: |-
      なんで…黙ってるの…？
      ねえ！ねえ！？ちょっと！？
  d_main_47_02_92:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_93:
    speaker: anis_i
    en: N-Neon. Say something, please.
    ko: 네, 네온. 너도 뭐라고 말 좀 해봐.
    ja: ネ、ネオン。あなたも何か言ってよ。
  d_main_47_02_94:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_95:
    speaker: neon_v
    en: Well, I expected something like this from you eventually, Master.
    ko: 뭐, 저는 스승님이라면 언젠가 이럴 거라고 생각했어요.
    ja: |-
      まあ、私は師匠ならいつか
      こうなるだろうと思っていました。
  d_main_47_02_96:
    speaker: anis_i
    en: Don't just go along with it! Say something else other than that!
    ko: 긍정하지 말고! 긍정 빼고 뭐라도 말 하라고!
    ja: |-
      認めないで！
      それ以外で何か言って！
  d_main_47_02_97:
    speaker: papillon
    en: G-good heavens... so it's actually possible? I thought it was all just a baseless
      rumor floating around the Ark.
    ko: |-
      세, 세상에. 그게 되는 거였어?
      그냥 방주에 떠도는 헛소문 아니었어?
    ja: |-
      じ、冗談よね。できるの？
      ただのウワサじゃなかったってこと？
  d_main_47_02_98:
    speaker: johan
    en: Walk us through the process. Tell us how this came to be.
    ko: |-
      과정에 대해 설명해라.
      어떻게 해서 그렇게 됐는지 말해라.
    ja: |-
      何をどうしたのか、
      事情はきっちり説明してもらおうか。
  d_main_47_02_99:
    speaker: cecil
    en: That comment sounds highly inappropriate.
    ko: 무슨 성희롱 같은 발언인가요 그게.
    ja: 解釈によってはセクハラ発言になりますよ。
  d_main_47_02_100:
    speaker: onlyone_c
    en: Mommy! Daddy!
    ko: 아빠! 엄마!
    ja: パパ！ママ！
  d_main_47_02_101:
    speaker: "<Self>"
    en: All right. I'll explain everything, so listen up.
    ko: 자, 자. 다들 내가 제대로 설명해 줄 테니까 잘 들어.
    ja: きちんと説明するから、まずは聞いてくれ
  d_main_47_02_102:
    speaker: rapi_red
    en: This child is mine and the Commander's.
    ko: 이 아이는 나와 지휘관의 아이야.
    ja: 私と指揮官の子どもよ。
  d_main_47_02_103:
    speaker: anis_i
    en: Don't be absurd! Y-you said she's a Queen!
    ko: 헛소리하지 마! 퀴, 퀸이라며!
    ja: |-
      それはもういいから！
      ク、クイーンなんでしょ？
  d_main_47_02_104:
    speaker: rapi_red
    en: That's right. Our child is a Queen.
    ko: 그래. 지휘관과 나의 아이는 퀸이야.
    ja: |-
      そうよ。指揮官と私の子どもが
      クイーンということ。
  d_main_47_02_105:
    speaker: anis_i
    en: The timeline doesn't add up! She's not a newborn!
    ko: |-
      기, 기간이 안 맞잖아!
      얘 지금 어, 신생아가 아닌데!
    ja: |-
      じ、時期が合わないでしょ！
      どう見たって新生児じゃないし！
  d_main_47_02_106:
    speaker: rapi_red
    en: We raised her with love, so she grew up healthy and strong.
    ko: 사랑으로 키웠더니 무럭무럭 자라버렸어.
    ja: 愛情の力ですくすくと育ってしまったようね。
  d_main_47_02_107:
    speaker: anis_i
    en: I know love can work miracles, but come on! Even miracles have their limits!
    ko: 사랑의 힘이 기적을 일으킨다는 건 아는데, 기적도 정도가 있어야지!
    ja: |-
      愛の力が奇跡を～とかよく言うけど、
      奇跡だって限度があるわよ！
  d_main_47_02_108:
    speaker: "<Self>"
    en: Everyone, that's not entirely accurate. To make a long story short, she's
      not my child...
    ko: 자, 다들 그게 아니라, 결론부터 말하자면 내 아이가 아니….
    ja: |-
      みんな、違うんだ。
      そもそも私の子ではなく…
  d_main_47_02_109:
    speaker: johan
    en: You pathetic excuse for a man. At least have the courage to take responsibility
      for your actions.
    ko: 쓰레기 같은 놈. 남자라면 네가 한 행동에 당당하게 맞서라.
    ja: |-
      見損なったぞ。
      自分の行動には責任を取れ。
  d_main_47_02_110:
    speaker: "<Self>"
    en: No, you've got it all wrong...!
    ko: 아니라고…!
    ja: 違う…！
  d_main_47_02_111:
    speaker: rapi_red
    en: What do you mean by that? Are you saying you don't intend to take responsibility?
    ko: 아니라뇨. 책임지지 않으실 생각입니까?
    ja: |-
      違うとは？
      責任を取ってくださらないつもりでしょうか？
  d_main_47_02_112:
    speaker: papillon
    en: Oh my. Can someone go get some popcorn?
    ko: 어머어머. 누가 가서 팝콘 좀 가져올래?
    ja: |-
      面白くなってきたわね。
      誰か、ポップコーン持ってない？
  d_main_47_02_113:
    speaker: leviathan
    en: Argh, shut up! All of you, be quiet!
    ko: 아잇 시끄러! 다들 조용히 좀 해!
    ja: ああもう、うるさい！みんな静かにして！
  d_main_47_02_114:
    speaker: johan
    en: I never thought I'd hear you say something like that, but I agree.
    ko: 네 입에서 나온 말인 게 믿기지 않지만, 동의한다.
    ja: お前が言えたことではないと思うが、同意だ。
  d_main_47_02_115:
    speaker: leviathan
    en: Bahamut. Explain. I can't take this racket any longer!
    ko: 바하무트. 설명해줘. 시끄러워서 살 수가 있나.
    ja: |-
      バハムート。説明してあげて。
      このままじゃ収まりがつかないし。
  d_main_47_02_116:
    speaker: bahamut
    en: All right. Everyone, calm down. I, the enlightened Bahamut, will explain the
      birth of this child.
    ko: |-
      그래. 다들 진정해라.
      똑똑한 바하무트가 이 아이의 탄생에 대해 설명하겠다.
    ja: |-
      そうだ。みな、落ち着きたまえ。
      賢いバハムートがこの子の
      誕生した経緯を説明してしんぜよう。
  d_main_47_02_117:
    speaker: bahamut
    en: The Young Man's ***** entered Rapi's body, thus giving birth to this child.
    ko: 남자의 XX이 라피의 몸 안에 들어가서 이 아이가 탄생했다.
    ja: |-
      男のXXXXをラピの体内に入れたことで、
      この子が誕生したのだ。
  d_main_47_02_118:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_119:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_120:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_121:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_122:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_123:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_124:
    speaker: anis_i
    en: Oh, ****!
    ko: 하, XX.
    ja: はぁ、XXX。
  d_main_47_02_125:
    speaker: neon_v
    en: Anis. You shouldn't start cursing just because of this.
    ko: 아니스. 그렇다고 욕을하면 어떡하나요.
    ja: アニス、いくらなんでもひどい暴言です。
  d_main_47_02_126:
    speaker: anis_i
    en: Do you have the slightest idea of what I'm going through right now?! Any idea
      at all?!
    ko: 네가! 내 기분을! 알아!? 지금 내 기분이! 어떤지! 아냐고!
    ja: |-
      私が今！どんな気分か！分かる！？
      分かった上でそんなことが言えるワケ！？
  d_main_47_02_127:
    speaker: neon_v
    en: Calm down. I don't think we've heard the whole story yet.
    ko: 진정해요. 아직 얘기가 다 끝난 건 아닌 것 같으니까.
    ja: |-
      落ち着いてください。
      まだ話は全部終わっていないようです。
  d_main_47_02_128:
    speaker: leviathan
    en: "... Fine, I'll just explain it myself. Otherwise, you'll only make an even
      bigger scene."
    ko: "…그냥 내가 설명할게. 더 시끄러워지기만 하니까."
    ja: |-
      …やっぱり私が説明する。
      これ以上騒がしくなったら困るし。
  d_main_47_02_129:
    speaker: "<Monologue>"
    en: "... Leviathan wraps up her explanation."
    ko: "…레비아탄의 설명이 끝났다."
    ja: "…レヴィアタンが事情を説明した"
  d_main_47_02_130:
    speaker: "<Monologue>"
    en: Thanks to her somewhat dry but highly objective explanation, free of any personal
      opinion...
    ko: |-
      사견이 조금도 섞여들어가지 않은,
      건조하지만 아주 객관적인 설명 덕분에
    ja: |-
      私見をまったく挟まない、
      客観的で淡々とした説明によって…
  d_main_47_02_131:
    speaker: "<Monologue>"
    en: Calm is restored to Eden, which has been a complete madhouse.
    ko: 혼란의 도가니였던 에덴이 침착함을 되찾았다.
    ja: |-
      混乱に飲まれつつあったエデンに
      落ち着きが戻った
  d_main_47_02_132:
    speaker: "<Monologue>"
    en: "... I feel nothing but relief."
    ko: "…천만다행이라고 생각했다."
    ja: "…私の心にも平穏が戻った"
  d_main_47_02_133:
    speaker: bahamut
    en: I, the knowledgeable Bahamut, will provide additional explanation regarding
      the extraction of the core materials.
    ko: 똑똑한 바하무트가 핵심 물질 추출 과정에 대해 추가 설명하겠다.
    ja: |-
      賢いバハムートが、
      さらに核となった物質の
      抽出方法について詳しく説明しよう。
  d_main_47_02_134:
    speaker: bahamut
    en: First, the pants—
    ko: 일단 바지를-
    ja: まずはズボンを…
  d_main_47_02_135:
    speaker: leviathan
    en: All right. That's enough about this.
    ko: 자자. 이 이야기는 여기서 끝.
    ja: はいはい。この話はおしまい。
  d_main_47_02_136:
    speaker: bahamut
    en: Urgh... Are you trying to deprive everyone of the knowledge they deserve to
      know?
    ko: 크윽… 모두가 알아야 할 지식을 빼앗아가려는 건가.
    ja: しかし…知識とは共有するべきものだろう。
  d_main_47_02_137:
    speaker: "<Self>"
    en: "... Please don't tell everyone. I'm begging you."
    ko: "…모두한테 알리지 말아줘. 부탁이야 제발 좀."
    ja: "…しないでくれ。私からも頼む、この通りだ"
  d_main_47_02_138:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_139:
    speaker: neon_v
    en: "... Anis, are you okay? You're snapping one second and dead quiet the next.
      It's actually a little scary."
    ko: "…아니스. 괜찮아요? 화냈다가 조용해졌다가 좀 무섭네요."
    ja: |-
      …アニス。大丈夫ですか？
      騒いだと思ったら急に静かになって…
      なんだか怖いですよ。
  d_main_47_02_140:
    speaker: rapi_red
    en: Leave her be. She needs time to recover from the shock.
    ko: 놔둬. 충격에서 벗어날 시간이 필요할 테니까.
    ja: |-
      そっとしておきましょう。
      立ち直るのには時間がかかるはずよ。
  d_main_47_02_141:
    speaker: rapi_red
    en: Isn't that right, baby?
    ko: 우리 아기도 그렇게 생각하지?
    ja: あなたもそう思うでしょう、ねぇ？
  d_main_47_02_142:
    speaker: onlyone_c
    en: Hehe. Mommy, Mommy.
    ko: 꺄하하. 엄마, 엄마.
    ja: きゃはは、ママ、ママ！
  d_main_47_02_143:
    speaker: rapi_red
    en: Hehe. So cute. I wonder who she gets it from?
    ko: 후후. 귀여워라. 누굴 닮아서 이렇게 귀여울까.
    ja: ふふ…かわいいわ。誰に似たのかしら。
  d_main_47_02_144:
    speaker: rapi_red
    en: Oh, of course. She must take after me and the Commander. I'm really something
      else, huh.
    ko: 아, 나랑 지휘관을 닮은 거겠네. 나도 참.
    ja: |-
      ああ、私と指揮官だったわね。
      私としたことが。
  d_main_47_02_145:
    speaker: anis_i
    en: "... So to summarize..."
    ko: "…요약하자면."
    ja: "…つまり…"
  d_main_47_02_146:
    speaker: anis_i
    en: Nothing happened. Is that right?
    ko: 아무 일도 없었다. 맞지?
    ja: 何もなかったってことよね。違った？
  d_main_47_02_147:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_148:
    speaker: rapi_red
    en: Anis, denial isn't the answer. I know you're in shock, but turning away from
      reality won't do you any good.
    ko: |-
      아니스. 현실 부정은 좋지 않아.
      충격에 빠진 건 알겠는데, 현실에서 눈을 돌리지 마.
    ja: |-
      アニス。目を塞ぐのはよくないわ。
      ショックを受けたことは分かるけれど、
      現実から目をそらさないで。
  d_main_47_02_149:
    speaker: anis_i
    en: Nothing happened. Right?
    ko: 아무 일도 없었잖아. 그렇지?
    ja: 何もなかったんでしょ？そうよね？
  d_main_47_02_150:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_151:
    speaker: anis_i
    en: Rien.
    ko: Nothing.
    ja: Nothing.
  d_main_47_02_152:
    speaker: neon_v
    en: Oh là là, you've suddenly become Mustang?
    ko: Oh. 아니스가 갑자기 머스탱 사장님이 됐어Yo.
    ja: |-
      Oh…アニスがいきなり
      マスタング社長になってしまいましたNE。
  d_main_47_02_153:
    speaker: rapi_red
    en: Think of this as an "act first, report later" kind of situation.
    ko: 선조치 후보고 같은 거야.
    ja: 後が先になっただけよ。
  d_main_47_02_154:
    speaker: anis_i
    en: That doesn't apply to a situation like this!
    ko: 선조치 후보고가 성립될 일이 아니잖아!
    ja: それじゃ因果が成り立たないでしょうが！
  d_main_47_02_155:
    speaker: anis_i
    en: Whatever. Forget about it.
    ko: 뭐. 그럼 됐어.
    ja: ま、そういうことならいいわ。
  d_main_47_02_156:
    speaker: anis_i
    en: Haha. Man, you really scared me there.
    ko: 하하. 아 깜짝 놀랐네 정말.
    ja: あはは、あー…びっくりした…
  d_main_47_02_157:
    speaker: "<Monologue>"
    en: Anis extends a hand toward the child in my arms.
    ko: 아니스가 내 품에 안겨있는 아이에게 손을 뻗는다.
    ja: アニスが私の胸元の少女に手を伸ばした
  d_main_47_02_158:
    speaker: "<Monologue>"
    en: She pokes the child's cheek with her finger.
    ko: 손가락으로 볼을 콕콕 찌른다.
    ja: 指先が頬を軽くつつく
  d_main_47_02_159:
    speaker: anis_i
    en: "... She's cute."
    ko: "…귀엽다."
    ja: "…かわいいわね。"
  d_main_47_02_160:
    speaker: anis_i
    en: So, what's her name?
    ko: 그래서, 얘 이름이 뭐야?
    ja: それで、この子の名前は？
  d_main_47_02_161:
    speaker: leviathan
    en: "... Huh?"
    ko: "…응?"
    ja: "…え？"
  d_main_47_02_162:
    speaker: behemoth
    en: "... Oh."
    ko: "…엇."
    ja: "…あ。"
  d_main_47_02_163:
    speaker: ziz
    en: Uh...
    ko: 어….
    ja: えーっと…
  d_main_47_02_164:
    speaker: bahamut
    en: She's Wise Bahamut the Second.
    ko: 똑똑한 바하무트 2세다.
    ja: 賢いバハムート2世だ。
  d_main_47_02_165:
    speaker: anis_i
    en: What? You haven't even named her yet?
    ko: 뭐야. 이름도 아직 안 지은 거야?
    ja: 何よ、まだ名前もつけてなかったの？
  d_main_47_02_166:
    speaker: anis_i
    en: Then should I give her a name? Believe it or not, I'm pretty good at coming
      up with—
    ko: 그럼 내가 지어줄까? 나 이래뵈도 네이밍 센스는 나쁘지 않-
    ja: |-
      じゃあ私がつけてあげようかしら？
      私、ネーミングセンスはけっこう…
  d_main_47_02_167:
    speaker: onlyone_c
    en: No.
    ko: 싫어.
    ja: イヤ。
  d_main_47_02_168:
    speaker: anis_i
    en: Huh? Y-you don't want that? Why not?
    ko: 응? 시, 싫어? 왜?
    ja: え？イ、イヤって？どうして？
  d_main_47_02_169:
    speaker: onlyone_c
    en: I can't have a name yet.
    ko: 나는 아직 이름을 가질 수 없어.
    ja: 名前、まだ、持てない。
  d_main_47_02_170:
    speaker: onlyone_c
    en: I haven't decided.
    ko: 선택하지 않았으니까.
    ja: 選んでない、から。
  d_main_47_02_171:
    speaker: anis_i
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_47_02_172:
    speaker: "<Monologue>"
    en: The child slips out of my arms,
    ko: 아이가 내 품에서 떨어진다.
    ja: そう言うと、少女は私の胸元から降り…
  d_main_47_02_173:
    speaker: "<Monologue>"
    en: then scampers off somewhere.
    ko: 그리고 어딘가를 향해 도도도 달려간다.
    ja: どこかへ走り去ろうとした
  d_main_47_02_174:
    speaker: "<Self>"
    en: "...? Where are you going?"
    ko: "…? 어디 가?"
    ja: "…？どこへ行くんだ？"
  d_main_47_02_175:
    speaker: onlyone_c
    en: To see the sleeping girl.
    ko: 언니 보러 가.
    ja: お姉ちゃん、会う。
  d_main_47_02_176:
    speaker: "<Monologue>"
    en: The child disappears through the door.
    ko: 아이가 문 너머로 사라진다.
    ja: 少女が扉の向こうに消えた
  d_main_47_02_177:
    speaker: "<Monologue>"
    en: I turn to Leviathan, looking for an explanation.
    ko: 답을 요구하는 표정으로 레비아탄을 바라본다.
    ja: 答えを求めて、レヴィアタンの顔を見た
  d_main_47_02_178:
    speaker: leviathan
    en: "... She went to see Marian."
    ko: "…마리안을 보러 갔어."
    ja: "…マリアンのこと。"
  d_main_47_02_179:
    speaker: rapi_red
    en: "... Marian?"
    ko: "…마리안을."
    ja: "…マリアンに？"
  d_main_47_02_180:
    speaker: leviathan
    en: She goes to see her every chance she gets. Then she just sits there, talking
      to herself.
    ko: |-
      틈만 나면 보러 가.
      앉아서 혼잣말하고 그래.
    ja: |-
      何かあるたびに行くのよね。
      それで、そばに座って
      ずっと独りごとを言ってるの。
  d_main_47_02_181:
    speaker: leviathan
    en: I'm not entirely sure, but I get the feeling they share some kind of connection
      as Queens.
    ko: 잘은 모르지만… 퀸끼리 통하는 뭔가가 있는 것 아닐까 싶어.
    ja: |-
      よく分かんないけど…
      クイーン同士で、何か通じ合ってるのかも。
  d_main_47_02_182:
    speaker: leviathan
    en: She never tells us what it is, though.
    ko: 그게 뭔지 우리한테는 절대 말 해주지 않지만.
    ja: |-
      どういうことなのかは、
      私たちには絶対に教えてくれないけど。
  d_main_47_02_183:
    speaker: "<Self>"
    en: "... Is Marian still in the same condition?"
    ko: "…마리안은 아직 그 상태야?"
    ja: "…マリアンはまだあの時のままか？"
  d_main_47_02_184:
    speaker: cecil
    en: Yes. She's still alive... technically.
    ko: 예. 살아만 있는 상태. 라고 할 수 있죠.
    ja: ええ。生きてはいるというだけです。
  d_main_47_02_185:
    speaker: anis_i
    en: Once we're done talking, let's all go see her together.
    ko: "…이야기 다 끝나면, 다같이 한번 보러 가자."
    ja: |-
      …話が終わったら、
      みんなで一緒に顔を見に行かない？
  d_main_47_02_186:
    speaker: neon_v
    en: Yeah. If we all go together, she might suddenly come around.
    ko: 예. 우리 다 같이 가면 또 갑자기 벌떡 일어날지도 모르잖아요.
    ja: |-
      そうですね。みんなで行けば、
      いきなり目を覚ますかもしれませんし。
  d_main_47_02_187:
    speaker: rapi_red
    en: Yeah. Let's do that.
    ko: 응. 그러자.
    ja: ええ。そうしましょう。
  d_main_47_02_188:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_02_189:
    speaker: "<Self>"
    en: All right then, gather around, everyone.
    ko: 그래. 그럼 다 모여줘.
    ja: そうだな。では、みんな集まってくれ
  d_main_47_02_190:
    speaker: "<Self>"
    en: I'll fill you in on the Ark's stance and the current situation.
    ko: 방주의 입장과 현재 상황에 대해 전달할게.
    ja: アークの置かれている状況を説明する
d_main_47_03:
  d_main_47_03_1:
    speaker: "<Monologue>"
    en: I brief everyone on the Ark's current situation.
    ko: 모두에게 방주의 상태에 대해 전한다.
    ja: 私はアークの様々な事情を説明した
  d_main_47_03_2:
    speaker: "<Monologue>"
    en: Most of the issues within the Ark have been resolved, but as a consequence,
      the Ark's power source is nearing the end of its lifespan.
    ko: |-
      방주 내부의 일은 대부분 해결되었으나,
      그 여파로 방주 동력원이 수명을 다해간다.
    ja: |-
      アーク内部の問題はおおむね解決したが、
      その副次的な結果として
      アークのエネルギー源は急激に寿命を縮めた
  d_main_47_03_3:
    speaker: "<Monologue>"
    en: That end is closer than we think.
    ko: 그 끝은 생각보다 가깝다.
    ja: 残された時間はかなり短い
  d_main_47_03_4:
    speaker: "<Monologue>"
    en: The Queen has also begun targeting the Ark directly.
    ko: "…그리고 퀸이 직접적으로 방주를 노리기 시작했다."
    ja: |-
      …さらに、クイーンはアークに
      直接狙いを定めたらしい
  d_main_47_03_5:
    speaker: "<Monologue>"
    en: She has even resorted to deploying chemical weapons. It is clear she is intent
      on destroying the Ark.
    ko: 화학무기까지 동원하며 명백히 방주의 [멸망]을 목표로 움직이기 시작했다.
    ja: |-
      明らかにアークの「滅亡」を目標とする、
      化学兵器を用いた攻撃があった
  d_main_47_03_6:
    speaker: "<Monologue>"
    en: Humanity can no longer afford to remain underground in the Ark.
    ko: 방주는 이제 지하에 머물러 있을 수 없다.
    ja: もはや人類は地下に留まり続けていられない
  d_main_47_03_7:
    speaker: "<Monologue>"
    en: Whether we like it or not, we have no choice but to launch the Third Surface
      Reclamation War.
    ko: 좋든 싫든, 3차 지상 탈환전을 시작할 수밖에 없는 상황이다.
    ja: |-
      否応なく、第三次地上奪還戦を
      始めるしかなくなるだろう
  d_main_47_03_8:
    speaker: "<Monologue>"
    en: The Third Surface Reclamation War that will be an all-out war against the
      Queen.
    ko: 퀸과의 전면전인, 3차 지상 탈환전을.
    ja: |-
      その第三次地上奪還戦は、
      クイーンとの全面戦争となる
  d_main_47_03_9:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: そして…
  d_main_47_03_10:
    speaker: "<Self>"
    en: "... Dorothy may be the one leading the charge."
    ko: "…도로시가 그 선봉에 설지도 몰라."
    ja: "…その先頭に、ドロシーが立つだろう"
  d_main_47_03_11:
    speaker: johan
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_47_03_12:
    speaker: snowwhite_h_no
    en: "... Dorothy?"
    ko: "…도로시가?"
    ja: "…ドロシーが？"
  d_main_47_03_13:
    speaker: rapi_red
    en: That's right. She would become the symbol of the Third Surface Reclamation
      War.
    ko: 그래. 3차 지상 탈환전의 상징이 되는 거지.
    ja: ええ。第三次地上奪還戦の旗振り役として。
  d_main_47_03_14:
    speaker: anis_i
    en: Of course, if Dorothy refuses, there's nothing we can do about it.
    ko: 물론, 도로시가 거절하면 어쩔 수 없겠지만….
    ja: ま、本人に断られたらどうしようもないけど…
  d_main_47_03_15:
    speaker: anis_i
    en: "... Personally, I think she'll do it."
    ko: "…나는, 할 거라고 봐."
    ja: "…私は、なると思う。"
  d_main_47_03_16:
    speaker: neon_v
    en: Yes. I think so too.
    ko: 예. 저도 그렇게 생각해요.
    ja: はい。私も同じ考えです。
  d_main_47_03_17:
    speaker: johan
    en: "... Why is that?"
    ko: "…어째서지?"
    ja: "…なぜそう思う？"
  d_main_47_03_18:
    speaker: rapi_red
    en: The malice is gone.
    ko: 표독함이 사라졌어.
    ja: トゲが消えたから。
  d_main_47_03_19:
    speaker: snowwhite_h_no
    en: "... What?"
    ko: "…뭐라고?"
    ja: "…どういう意味だ？"
  d_main_47_03_20:
    speaker: rapi_red
    en: The malice in her eyes is gone.
    ko: 눈빛에서 표독함이 사라졌어.
    ja: 毒のある目つきというか…
  d_main_47_03_21:
    speaker: rapi_red
    en: I don't know the reason, but that's the feeling I got.
    ko: 이유는 모르지만, 그렇게 느꼈어.
    ja: そんな感じのものが、消えた気がするの。
  d_main_47_03_22:
    speaker: anis_i
    en: Yeah. It felt like something had been resolved.
    ko: 응. 뭔가 해소된 것 같은 느낌이었지.
    ja: そうね。なんかスッキリしたみたいな雰囲気。
  d_main_47_03_23:
    speaker: neon_v
    en: Aren't we going off nothing but a hunch here?
    ko: 그런데 저희 너무 감에만 의존해서 얘기하고 있지 않나요?
    ja: |-
      それにしても私たち、
      勘に頼った話ばかりですね？
  d_main_47_03_24:
    speaker: anis_i
    en: When it comes to complicated matters, there's nothing as reliable as intuition.
    ko: 복잡한 일에는 감만큼 확실한 게 없다고.
    ja: こういうことには直感が一番頼れるのよ。
  d_main_47_03_25:
    speaker: neon_v
    en: That's true.
    ko: 그건 그래요.
    ja: それはそうですね。
  d_main_47_03_26:
    speaker: snowwhite_h_no
    en: Dorothy... at the forefront of the Third Surface Reclamation War...
    ko: 도로시가… 3차 지상 탈환전의 선봉이라고….
    ja: |-
      ドロシーが…
      第三次地上奪還戦の先頭に、か…
  d_main_47_03_27:
    speaker: johan
    en: Does that mean she's forgiven the Ark?
    ko: "…방주를 용서했단 말인가? 도로시가."
    ja: |-
      …アークを赦したということか？
      あのドロシーが。
  d_main_47_03_28:
    speaker: rapi_red
    en: That was the impression I got.
    ko: 그런 분위기였어.
    ja: そんなところね。
  d_main_47_03_29:
    speaker: johan
    en: "... That's hard to believe."
    ko: "…믿을 수 없군."
    ja: "…信じられないな。"
  d_main_47_03_30:
    speaker: johan
    en: She didn't look like she'd lost all hope after running out of places to turn?
    ko: 갈 곳을 잃어 자포자기한 것처럼 보이지는 않았나?
    ja: |-
      居場所を失くして
      やけを起こしたといった事ではないのか？
  d_main_47_03_31:
    speaker: "<Self>"
    en: No. I'm certain of that.
    ko: 그건 아니야. 확실해.
    ja: それは違う。保証する
  d_main_47_03_32:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_33:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_34:
    speaker: "<Self>"
    en: You seem happy, Snow White.
    ko: "…스노우 화이트는 기뻐 보이네."
    ja: "…スノーホワイトは嬉しそうだな"
  d_main_47_03_35:
    speaker: snowwhite_h_no
    en: Yes.
    ko: 그래.
    ja: ああ。
  d_main_47_03_36:
    speaker: snowwhite_h_no
    en: Because I'd given up hope.
    ko: 포기했었으니까.
    ja: 諦めていたんだ。
  d_main_47_03_37:
    speaker: snowwhite_h_no
    en: I thought Dorothy would never fight for humanity again.
    ko: 도로시가 이제 인류를 위해 싸우는 일 같은 건 없을 것이라고 생각했었다.
    ja: |-
      ドロシーが人類のために戦うことは
      もうないと思っていた。
  d_main_47_03_38:
    speaker: snowwhite_h_no
    en: But now...
    ko: 그런데….
    ja: だが…
  d_main_47_03_39:
    speaker: "<Monologue>"
    en: Snow White stares intently at us.
    ko: 스노우 화이트가 우릴 빤히 바라본다.
    ja: スノーホワイトの目が私たちを見すえた
  d_main_47_03_40:
    speaker: snowwhite_h_no
    en: "... Thanks."
    ko: "…고맙다."
    ja: "…ありがとう。"
  d_main_47_03_41:
    speaker: anis_i
    en: You don't have to thank us for anything.
    ko: 우리한테 인사할 건 아니야.
    ja: お礼を言われるようなことじゃないわ。
  d_main_47_03_42:
    speaker: anis_i
    en: It was Dorothy's choice, after all.
    ko: 선택은 도로시가 했을테니까.
    ja: ドロシーが自分で選んだだけ。
  d_main_47_03_43:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_44:
    speaker: johan
    en: So, what exactly are you getting at?
    ko: "…그렇다면 네가 하고 싶은 말은."
    ja: "…すると、お前が言おうとしているのは…"
  d_main_47_03_45:
    speaker: johan
    en: Are you asking Eden to join the Ark's Third Surface Reclamation War?
    ko: 방주의 3차 지상 탈환전에 에덴이 합류하라는 얘기인가?
    ja: |-
      エデンもお前たちの第三次地上奪還戦に
      合流しろという話か？
  d_main_47_03_46:
    speaker: johan
    en: I already told you. We won't rely on the Ark.
    ko: 말했을 거다. 우린 방주의 힘을 빌리지 않는다.
    ja: 言ったはずだ。アークの力は借りない。
  d_main_47_03_47:
    speaker: cecil
    en: There you go with that foolish talk again.
    ko: 또 바보같은 소릴 하고 있네요.
    ja: 相変わらずワガママですね。
  d_main_47_03_48:
    speaker: cecil
    en: Surely you understand the situation we're in, Johan?
    ko: 지금 상황이 어떤 상황인지, 요한이 모르지는 않을 텐데요?
    ja: |-
      今がどういう状況か、
      よく分かっているはずでしょう？
  d_main_47_03_49:
    speaker: cecil
    en: This is not the time to cling to your pride.
    ko: 자존심 내세울 때가 아니에요.
    ja: プライドにこだわっている場合ではありません。
  d_main_47_03_50:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_51:
    speaker: johan
    en: My decision hasn't changed.
    ko: 내 선택에 변함은 없다.
    ja: 私の選択は変わらない。
  d_main_47_03_52:
    speaker: cecil
    en: Honestly, you're acting like a child.
    ko: 애도 아니고 정말.
    ja: もう子どもでもないでしょう。
  d_main_47_03_53:
    speaker: "<Self>"
    en: Oh, I didn't come to Eden seeking help for the Ark.
    ko: 아, 내가 에덴에 온 이유는 방주를 도와달라고 요청하려 온 건 아니야.
    ja: いや、そのつもりはない
  d_main_47_03_54:
    speaker: johan
    en: "... Then what?"
    ko: "…그럼."
    ja: "…では、何だ。"
  d_main_47_03_55:
    speaker: "<Self>"
    en: The Ark will help Eden.
    ko: 방주가 에덴을 도울게.
    ja: アークはエデンを支援するように仕向ける
  d_main_47_03_56:
    speaker: "<Self>"
    en: Eden will proceed with its original goal of capturing the Queen.
    ko: 에덴은 원래 목적대로 퀸을 잡기 위해 행동해줘.
    ja: |-
      エデンはもともとの目的通り
      クイーンを討つために動いてくれればいい
  d_main_47_03_57:
    speaker: "<Self>"
    en: In turn, the Ark will help Eden on its own terms.
    ko: 그럼 방주가 [멋대로] 에덴을 돕는 거야.
    ja: |-
      アークは「たまたま」
      エデンに都合よく動くだけだ
  d_main_47_03_58:
    speaker: "<Self>"
    en: The Ark intends to benefit from Eden's extensive combat experience during
      its time on the surface over the years.
    ko: |-
      오랜 시간 지상에서 실전 경험을 쌓은 에덴의 덕을,
      방주가 본다는 거지.
    ja: |-
      地上での実戦経験に長けたエデンに
      アークが助けられたという
      形になるだろう
  d_main_47_03_59:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_60:
    speaker: johan
    en: You're just twisting the wording.
    ko: 말장난이군.
    ja: ものは言いようだな。
  d_main_47_03_61:
    speaker: cecil
    en: You say that, but you certainly look more relaxed.
    ko: 그런 것치곤 표정이 많이 풀렸는데요.
    ja: その割には顔がうれしそうですね。
  d_main_47_03_62:
    speaker: johan
    en: "... Be quiet."
    ko: "…조용히해라."
    ja: "…何も言うな。"
  d_main_47_03_63:
    speaker: neon_v
    en: New Hope was easier to convince than I thought.
    ko: 샛별님은 쉬운 분이셨네요.
    ja: 新星様って、単純な方だったんですね。
  d_main_47_03_64:
    speaker: anis_i
    en: Yeah, I'm surprised how easily things settled.
    ko: 그러게. 생각보다 너무 쉽게 풀려서 놀랐어.
    ja: そうね。思ったよりあっさり説得できたわ。
  d_main_47_03_65:
    speaker: rapi_red
    en: The tougher a hero acts, the easier he is to win over.
    ko: 강한척하는 히로인일수록 쉽게 공략되는 법이지.
    ja: 強がりなヒロインほど落としやすいものよ。
  d_main_47_03_66:
    speaker: johan
    en: I can hear everything you're saying. And I'm not a hero.
    ko: 다 들린다. 히로인이 아니다.
    ja: |-
      全部聞こえている。
      それと、ヒロインではない。
  d_main_47_03_67:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_68:
    speaker: johan
    en: Very well. I'll accept your proposition for now.
    ko: 좋다. 일단은 그렇게 알고 있겠다.
    ja: いいだろう。ひとまず、そう理解しておく。
  d_main_47_03_69:
    speaker: johan
    en: Then allow me to explain the current situation in Eden and on the surface.
    ko: 그럼 현재 에덴과 지상의 상황에 대해 설명하지.
    ja: |-
      次は、エデンと地上の現状について
      こちらから説明しよう。
  d_main_47_03_70:
    speaker: "<Monologue>"
    en: We listen to Johan's briefing.
    ko: 요한에게서 설명을 듣는다.
    ja: ヨハンから説明を聞いた
  d_main_47_03_71:
    speaker: "<Monologue>"
    en: About Nayuta's corruption.
    ko: "…나유타의 침식."
    ja: "…ナユタが侵食されたこと"
  d_main_47_03_72:
    speaker: "<Monologue>"
    en: The newborn Raptures.
    ko: 신생 랩쳐.
    ja: 新世代型ラプチャーの出現
  d_main_47_03_73:
    speaker: "<Monologue>"
    en: The new Heretic imitating Scarlet and Isabel.
    ko: 홍련과 이사벨을 흉내낸 새로운 헬레틱.
    ja: 紅蓮とイサベルを模倣した、新手のヘレティック
  d_main_47_03_74:
    speaker: "<Monologue>"
    en: An unknown entity called Mirror.
    ko: 미러라 불리는 미지의 대상.
    ja: ミラーと呼ばれる正体不明の存在
  d_main_47_03_75:
    speaker: "<Monologue>"
    en: Rose, Scarlet's older sister.
    ko: 홍련의 언니인 장화.
    ja: 紅蓮の姉、薔花の出現
  d_main_47_03_76:
    speaker: "<Monologue>"
    en: Liberalio, betrayed and decapitated.
    ko: "…배신당한, 리버렐리오의 머리."
    ja: "…捨てられた、リバーレリオの頭"
  d_main_47_03_77:
    speaker: "<Monologue>"
    en: Red Shoes, one of the second-generation Grimms models.
    ko: 2세대 페어리 테일 모델의 무장 중 하나인, 레드 슈즈.
    ja: |-
      第2世代のフェアリーテールモデルの
      武装のひとつ、赤い靴
  d_main_47_03_78:
    speaker: "<Monologue>"
    en: The Queen who invaded the Imitation Ark to secure Dark Matter.
    ko: 다크 매터 확보를 위해 유사 방주로 쳐들어간 퀸.
    ja: |-
      ダークマターを狙い、
      直接フォービーストの根城を
      襲撃してきたクイーン…
  d_main_47_03_79:
    speaker: johan
    en: Newborn Raptures are gathering near the Lift. Or rather, it'd be more accurate
      to say they're being created there.
    ko: |-
      …궤도 엘리베이터 부근에서 신생 랩쳐들이 모여들고 있다.
      아니, 만들어지고 있다고 보는 게 맞겠군.
    ja: |-
      …新世代型ラプチャーは
      軌道エレベーター付近に集合している。
      いや、そこで製造されていると見るべきだ。
  d_main_47_03_80:
    speaker: johan
    en: We've confirmed that the black pools we've been seeing everywhere are Dark
      Matter.
    ko: 곳곳에 보이는 검은색 웅덩이는, 다크 매터로 확정된다.
    ja: |-
      周辺に見える黒い水たまりのようなものは、
      ダークマターだ。
  d_main_47_03_81:
    speaker: johan
    en: It appears that after securing the massive stockpiles of Dark Matter stored
      at Four Beasts' base, the Imitation Ark, the Queen seems to be accelerating
      production of newborn Raptures.
    ko: 포비스트의 본거지인 유사 방주에 모아 놓은 대량의 다크 매터를 확보한 후, 신생 랩쳐의 생산에 박차를 가한 것으로 보인다.
    ja: |-
      フォービーストが襲撃された理由も、
      新型ラプチャー生産のための
      ダークマターを確保するためだろう。
  d_main_47_03_82:
    speaker: johan
    en: Anyone can see they are preparing for all-out war.
    ko: 누가 봐도 총력전을 준비하고 있는 모습이다.
    ja: |-
      敵も総力戦に向けて
      動いているとしか考えられない。
  d_main_47_03_83:
    speaker: johan
    en: "... Also, judging by the incident with the Heretic, Annihilio,"
    ko: "…그리고 헬레틱 애니힐리오의 건으로 추측해보자면."
    ja: |-
      …ヘレティック・アニヒリオの一件も
      考慮に入れれば…
  d_main_47_03_84:
    speaker: johan
    en: it's certain that they are amassing their forces to strike the Ark.
    ko: 방주를 치기 위해 힘을 모으고 있는 것이 확실하다.
    ja: 目標は間違いなくアークだ。
  d_main_47_03_85:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_86:
    speaker: johan
    en: The Queen is being cautious. I had assumed it was out of fear, but I was wrong.
    ko: 퀸은 신중하다. 겁이 많은 것이라 판단했지만, 아니었다.
    ja: |-
      クイーンは慎重な性格らしい。
      臆病なのかと考えたこともあるが、
      そうではなかった。
  d_main_47_03_87:
    speaker: johan
    en: The fact that she dropped chemical weapons on the Ark proves that.
    ko: 방주에 화학무기를 떨어뜨린 것으로 봐선 명백하다.
    ja: 化学兵器の一件もそれだ。
  d_main_47_03_88:
    speaker: johan
    en: She used a lethal weapon to gauge how strong the Ark is at present.
    ko: 치명적인 무기를 사용해, 방주의 현재 힘에 대해 파악했을 것이고.
    ja: |-
      アークが無視できない攻撃を仕掛けて、
      対応力を測っていたのだろう。
  d_main_47_03_89:
    speaker: johan
    en: She must have realized that it's impossible to wipe us out without unleashing
      her full power.
    ko: 전력을 다하지 않으면 확실하게 멸망시킬 수 없을 것이라 판단했을 것이다.
    ja: |-
      そこまでしなければ確実な勝算を
      得られない相手だと考えているに違いない。
  d_main_47_03_90:
    speaker: johan
    en: It's safe to assume she's making thorough preparations for precisely that.
    ko: 그를 위한 준비를 철저히 하고 있는 편이라 보는 게 맞겠지.
    ja: |-
      つまり、奴らは今も徹底的に
      準備を重ねているということだ。
  d_main_47_03_91:
    speaker: cecil
    en: What about the possibility of an attack on Eden?
    ko: 에덴을 공격할 가능성은요?
    ja: エデンが狙われている可能性は？
  d_main_47_03_92:
    speaker: johan
    en: "... There's none."
    ko: "…없다."
    ja: "…ない。"
  d_main_47_03_93:
    speaker: johan
    en: Infuriating as it is, there hasn't been a single additional raid since that
      day.
    ko: 화나는 일이지만, 그날 이후 추가 습격이 단 한 차례도 없었으니까.
    ja: |-
      不愉快な話ではあるが、
      あの日以降、さらなる攻撃の動きはない。
  d_main_47_03_94:
    speaker: johan
    en: Besides, our forces were annihilated after the battle with the Queen.
    ko: 그리고 우리는 퀸 전 이후 전력이 괴멸되었다.
    ja: |-
      そもそも前回の衝突で、
      こちらの戦力は壊滅している。
  d_main_47_03_95:
    speaker: johan
    en: From her perspective, we're no longer a threat worth worrying about.
    ko: 퀸 입장에서 우리는 경계 대상이 아니겠지.
    ja: もはや警戒には値しないということだろうな。
  d_main_47_03_96:
    speaker: johan
    en: If anything, the only thing she'd likely be wary of is Eden's Spear.
    ko: 경계한다면, 에덴의 창 정도겠군.
    ja: |-
      警戒しているものがあるとすれば、
      エデンの槍だ。
  d_main_47_03_97:
    speaker: johan
    en: We pose no threat if left alone.
    ko: 놔둬도 아무런 영향을 미치지 못하는 우리를 잡기 위해,
    ja: 放置しておいても脅威にならない我々のために…
  d_main_47_03_98:
    speaker: johan
    en: So there's no reason to send troops toward Eden's Spear just to eliminate
      us.
    ko: 에덴의 창이 자리잡고 있는 쪽으로 병력을 보낼 이유가 없다.
    ja: |-
      わざわざ危険なエデンの槍の射程内へ
      戦力を送り込む理由はない。
  d_main_47_03_99:
    speaker: johan
    en: It would be easier for the Queen to resolve the situation by drawing us out.
    ko: 끌어내는 쪽이, 퀸 입장에서는 일을 더욱 쉽게 해결할 수 있겠지.
    ja: |-
      こちらが出ていかざるをえない状況を作れば、
      敵から見ればはるかに簡単に解決できる。
  d_main_47_03_100:
    speaker: johan
    en: But... she hasn't even bothered with such provocations. The Queen clearly
      doesn't consider us worthy of her attention.
    ko: |-
      …하지만 그런 도발조차 없는 상황이다.
      퀸은 명백히 우릴 신경 쓰고 있지 않아.
    ja: |-
      …だが、今のところそのような挑発もない。
      クイーンは我々を無視している。
  d_main_47_03_101:
    speaker: johan
    en: In her eyes, we're merely a peripheral faction with nothing to show for beyond
      our formidable defensive armaments.
    ko: 그저 막강한 방위 무장 말고는 내세울 것 없는 변두리의 세력 취급이다.
    ja: |-
      立地上も障害にならず、守りが固い以外は
      無視できる勢力だと見ているのだろう。
  d_main_47_03_102:
    speaker: johan
    en: We're something she'll finish off later on the side, after taking care of
      more pressing matters.
    ko: 급한 일을 처리하고 난 뒤에 겸사겸사 처리해도 괜찮은, 그런 거다.
    ja: |-
      急ぎの用さえ済ませれば、
      後でいつでも片づけられる、
      ということだ。
  d_main_47_03_103:
    speaker: cecil
    en: "... It stings, but it's true."
    ko: "…열받지만, 맞는 말이네요."
    ja: "…腹立たしい話ですが、合理的ではあります。"
  d_main_47_03_104:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_105:
    speaker: johan
    en: "@UserName. How long do you estimate it will take before the Third Surface
      Reclamation War begins?"
    ko: "@UserName. 3차 지상 탈환전 개시까진 얼마나 걸릴 것으로 예상하지?"
    ja: |-
      @UserName。
      第三次地上奪還戦の開始まで
      どれだけの時間がある？
  d_main_47_03_106:
    speaker: "<Self>"
    en: We're expediting preparations as much as possible, but it won't be anytime
      soon.
    ko: |-
      …최대한 서두르고는 있어.
      하지만 바로는 아닐 거야.
    ja: |-
      …できる限り急いでいる。
      だが、今すぐとはいかない
  d_main_47_03_107:
    speaker: johan
    en: In the meantime, they'll continue steadily building up their forces.
    ko: "…그 동안에도 저쪽은 착실히 세력을 불려나가겠지."
    ja: |-
      …その間にも敵は
      着実に勢力を増すだろうな。
  d_main_47_03_108:
    speaker: "<Monologue>"
    en: Johan looks around.
    ko: 요한이 주위를 둘러본다.
    ja: ヨハンがあたりを見回した
  d_main_47_03_109:
    speaker: "<Monologue>"
    en: He gazes at the Four Beasts, the Counters, and Snow White.
    ko: 포비스트, 카운터스, 스노우 화이트를 바라본다.
    ja: |-
      フォービースト、カウンターズ、
      スノーホワイトと視線が動いた
  d_main_47_03_110:
    speaker: johan
    en: "... I want to propose a preemptive strike."
    ko: "…선공을 제안하고 싶다."
    ja: "…先手を打ちたい。"
  d_main_47_03_111:
    speaker: johan
    en: Papillon and Ziz's reconnaissance confirmed that something is happening at
      the Lift.
    ko: 파피용과 지즈의 수색 결과, 궤도 엘리베이터에서 무슨 일이 벌어지고 있음이 확인됐다.
    ja: |-
      パピヨンとジズの偵察によって、
      軌道エレベーターで何らかの
      重大な動きがあると判明している。
  d_main_47_03_112:
    speaker: johan
    en: A massive amount of Dark Matter has adhered to the Lift.
    ko: 궤도 엘리베이터에 대량의 다크 매터가 흡착된 상태다.
    ja: |-
      軌道エレベーターに
      大量のダークマターが吸着していた。
  d_main_47_03_113:
    speaker: johan
    en: It's safe to assume they're creating something.
    ko: 뭔가 만들고 있을 것이 확실하겠지.
    ja: 何かを製造していると見て間違いない。
  d_main_47_03_114:
    speaker: "<Self>"
    en: If it's another Heretic like Annihilio, our chances of victory will only grow
      slimmer.
    ko: "…애니힐리오 같은 헬레틱이라면 승산이 더 옅어지겠네."
    ja: |-
      …アニヒリオのようなヘレティックなら、
      勝算はさらに低くなるだろうな
  d_main_47_03_115:
    speaker: johan
    en: Precisely. The Queen is preparing for a war, not merely a battle.
    ko: 그래. 퀸은 이미 [전투]가 아닌 [전쟁]을 준비하고 있다.
    ja: |-
      その通りだ。
      クイーンは単なる「戦闘」ではなく、
      「戦争」の準備をしている。
  d_main_47_03_116:
    speaker: johan
    en: The Heretic Annihilio is a prime example of that.
    ko: 헬레틱 애니힐리오가 좋은 예시라고 할 수 있겠지.
    ja: ヘレティック・アニヒリオはその最たる例だ。
  d_main_47_03_117:
    speaker: "<Self>"
    en: What is the objective of the preemptive strike?
    ko: 선공의 목표는?
    ja: 先手を取って何を狙う？
  d_main_47_03_118:
    speaker: "<Self>"
    en: An all-out war with just our current forces is impossible. We have almost
      no chance of winning.
    ko: |-
      지금 우리만으로 전면전은 불가능 해.
      승산이 너무 낮아.
    ja: |-
      私たちだけで全面戦争は不可能だ。
      勝つ方法がない
  d_main_47_03_119:
    speaker: johan
    en: We confirm the status of the Lift, and if possible, strike or destroy it.
    ko: |-
      궤도 엘리베이터의 상태 확인 및,
      가능하다면 타격을 주거나 파괴하는 거다.
    ja: |-
      軌道エレベーターの状況確認。
      可能であれば一部、あるいは完全な破壊。
  d_main_47_03_120:
    speaker: johan
    en: If we can rescue the Monk in the process, we will.
    ko: 겸사겸사 승려를 구출할 수 있다면 구한다.
    ja: 副目標として、可能であれば仙人の救出。
  d_main_47_03_121:
    speaker: "<Self>"
    en: Is that all?
    ko: 그게 전부야?
    ja: それだけか？
  d_main_47_03_122:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_123:
    speaker: cecil
    en: Johan. Be honest with us.
    ko: 요한. 솔직히 얘기해줘요.
    ja: ヨハン。正直に話してください。
  d_main_47_03_124:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_125:
    speaker: johan
    en: It's a declaration of war.
    ko: 선전포고다.
    ja: 宣戦布告をする。
  d_main_47_03_126:
    speaker: johan
    en: A message to that arrogant creature who trampled us beneath her feet and doesn't
      even spare us a second thought.
    ko: 짓밟은 후, 신경조차 쓰지 않는 오만한 놈에게 보내는 메시지다.
    ja: |-
      一方的に荒らしに来て、
      何も反撃されないと思いあがっている奴に…
  d_main_47_03_127:
    speaker: johan
    en: We'll show her not to underestimate us.
    ko: 우릴 얕보지 말라는.
    ja: 我々をあなどるな、とな。
  d_main_47_03_128:
    speaker: rapi_red
    en: All right. If that's the reason, I'm convinced.
    ko: 좋아. 그 이유라면 나는 납득했어.
    ja: いいと思うわ。それなら納得できる。
  d_main_47_03_129:
    speaker: anis_i
    en: Yeah. We gotta knock that arrogant punk down a peg.
    ko: 응. 까부는 녀석에게는 한방 먹여줘야지.
    ja: |-
      そうね。調子に乗ってるヤツに
      一発ガツンとお見舞いしてあげないと。
  d_main_47_03_130:
    speaker: neon_v
    en: They were the ones who launched the ambush! Let's give them a taste of their
      own medicine.
    ko: 애초에 저쪽은 기습만 했잖아요? 반대로 한번 당해보라죠.
    ja: |-
      いきなり襲ってきたのは向こうですからね？
      気持ちを分からせてあげましょう。
  d_main_47_03_131:
    speaker: "<Self>"
    en: All right. Let's do it.
    ko: 좋아. 가보자.
    ja: 分かった、私も賛成だ
  d_main_47_03_132:
    speaker: johan
    en: "... Well then."
    ko: "…그래."
    ja: "…そうか。"
  d_main_47_03_133:
    speaker: cecil
    en: You could at least say thank you. Honestly, there's barely anyone here representing
      Eden.
    ko: |-
      고맙다는 말 한마디 정도는 하지 그래요?
      솔직히 지금 여기서 에덴 소속은 하나도 없어요.
    ja: |-
      お礼の一言ぐらいは言ったらどうですか？
      今この場でエデンに所属している者は
      一人もいないというのに。
  d_main_47_03_134:
    speaker: papillon
    en: I'm right here, you know.
    ko: 나 있잖아, 나.
    ja: 私がいるじゃない、私が。
  d_main_47_03_135:
    speaker: johan
    en: You're just backup.
    ko: 너는 대기다.
    ja: お前は待機だ。
  d_main_47_03_136:
    speaker: papillon
    en: "... Oh, right. I figured you'd say that."
    ko: "…아, 그래. 그럴 것 같았어."
    ja: "…ま、そうよね。そんな気がしてたわ。"
  d_main_47_03_137:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_138:
    speaker: leviathan
    en: We might be able to win if we use the child.
    ko: 저 아이를 쓰면 이길 수도 있어.
    ja: あの子を使うなら、勝てるかもね。
  d_main_47_03_139:
    speaker: rapi_red
    en: Who? The Commander's and my child?
    ko: 누구. 나랑 지휘관의 아이?
    ja: あの子？私と指揮官の子どものこと？
  d_main_47_03_140:
    speaker: anis_i
    en: "... Why does it annoy me so much whenever you keep bringing that up?"
    ko: "…자꾸 강조하는 거 왜 이리 듣기 싫지 나."
    ja: "…いちいちしつこいわよ、イライラするわね。"
  d_main_47_03_141:
    speaker: leviathan
    en: Yes. After all, she once overpowered the Queen who had taken control of Liliweiss's
      body.
    ko: 그래. 릴리바이스의 몸을 강탈한 퀸을 압도했었으니까.
    ja: |-
      あの子、リリーバイスのボディを奪った
      クイーンってヤツも圧倒してたし。
  d_main_47_03_142:
    speaker: leviathan
    en: If we use her, we can win.
    ko: "[쓴다면], 이길 수 있어."
    ja: "「使うなら」、勝てると思う。"
  d_main_47_03_143:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_144:
    speaker: onlyone
    en: Huh... g...
    ko: "……아… ㄴ…."
    ja: "…だ……"
  d_main_47_03_145:
    speaker: onlyone
    en: "... me..."
    ko: 아… 줘….
    ja: だっ…こ…
  d_main_47_03_146:
    speaker: onlyone
    en: Hug... me...
    ko: "…안아… 줘."
    ja: "…だっこ…して…"
  d_main_47_03_147:
    speaker: "<Self>"
    en: No. I don't want her to fight anymore.
    ko: 아니. 저 아이는 이제 싸우지 않았으면 해.
    ja: いや、それはしない
  d_main_47_03_148:
    speaker: leviathan
    en: "... Why?"
    ko: "…왜?"
    ja: "…なんで？"
  d_main_47_03_149:
    speaker: "<Self>"
    en: She's just a little girl who likes being held.
    ko: 그냥 안기기 좋아하는 아이잖아.
    ja: |-
      あの子は抱っこされるのが好きな
      ただの子どもだ
  d_main_47_03_150:
    speaker: "<Self>"
    en: I want her to grow up like a normal child.
    ko: 그냥 아이답게 컸으면 해.
    ja: 普通の子どもらしく育ってほしい
  d_main_47_03_151:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_152:
    speaker: behemoth
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_153:
    speaker: ziz
    en: Wow, just wow...
    ko: 와, 와아….
    ja: わ、わぁ…
  d_main_47_03_154:
    speaker: bahamut
    en: Did you two rehearse this beforehand? I, the brilliant Bahamut, won't be deceived.
    ko: |-
      둘이 미리 말을 맞췄나?
      똑똑한 바하무트는 속일 수 없다.
    ja: |-
      さては二人で話を合わせたな？
      賢いバハムートはだませないぞ。
  d_main_47_03_155:
    speaker: "<Self>"
    en: "...?"
    ko: "…??"
    ja: "…？？"
  d_main_47_03_156:
    speaker: leviathan
    en: Fine. Since you're the one saying it, I suppose it must be true.
    ko: 뭐, 그래. 남자 네가 그렇게 말한다면 그게 맞겠지.
    ja: |-
      ま、あんたがそう言うなら
      それが正しいんじゃない。
  d_main_47_03_157:
    speaker: leviathan
    en: I'll get ready. Let me know when the time comes.
    ko: 준비할게. 갈때 되면 불러줘.
    ja: 準備しとくわ。行く時に呼んで。
  d_main_47_03_158:
    speaker: "<Monologue>"
    en: Leviathan leaves the meeting room with a nonchalant expression.
    ko: 레비아탄이 심드렁한 표정으로 회의실을 벗어났다.
    ja: |-
      レヴィアタンが無愛想な顔で
      会議室を出ていった
  d_main_47_03_159:
    speaker: rapi_red
    en: Still utterly devoid of manners, as always.
    ko: 여전히 예의라곤 눈을 씻고 찾아봐도 없네.
    ja: 相変わらず、礼儀の欠片もないわね。
  d_main_47_03_160:
    speaker: behemoth
    en: She's acting that way because she's grateful. She's just running off because
      she's embarrassed.
    ko: 고마워서 그러는 거야. 그게 부끄러워서 도망가는 거고.
    ja: 感謝はしてんだよ。照れ隠しってヤツさ。
  d_main_47_03_161:
    speaker: ziz
    en: Y-yeah. Levi said the same thing.
    ko: 으, 응. 레비도 똑같은 얘기 했거든.
    ja: |-
      そ、そうだよ。
      レヴィも同じようなこと言ってたもんね。
  d_main_47_03_162:
    speaker: ziz
    en: She hopes the child doesn't become a monster...
    ko: 저 아이가… 괴물이 되지 않았으면 좋겠다고….
    ja: あの子には…怪物になってほしくないとか…
  d_main_47_03_163:
    speaker: behemoth
    en: Then we'll go get some rest too. Gotta stock up on more apples.
    ko: 그럼 우리도 가서 좀 쉴게. 사과나 잔뜩 먹어놔야겠다.
    ja: |-
      あたしたちも休んどくよ。
      今のうちにリンゴも
      食えるだけ食っておかないとな。
  d_main_47_03_164:
    speaker: ziz
    en: Um... th-then I'll go take a bath.
    ko: 어… 그, 그럼 나도 목욕할래.
    ja: あ…じゃ、じゃあ、私はお風呂に入ろっと。
  d_main_47_03_165:
    speaker: bahamut
    en: I shall read a book. Even I, the wise Bahamut, know it's impossible to read
      while fighting a battle.
    ko: 책을 읽겠다. 전투 중엔 책을 읽을 순 없다는 걸 똑똑한 바하무트는 잘 안다.
    ja: |-
      私は読書をしておこう。
      戦闘中には本を読めないということを、
      賢いバハムートは知っている。
  d_main_47_03_166:
    speaker: johan
    en: We're still in the middle of our briefing.
    ko: 브리핑 중이다.
    ja: まだ作戦会議中だ。
  d_main_47_03_167:
    speaker: behemoth
    en: Whatever. What you expect from us is simple, isn't it?
    ko: 됐어. 어차피 우리한테 바라는 건 단순하잖아?
    ja: |-
      構わねぇだろ？
      あたしたちに求められるモンなんて
      どうせ単純なことなんだし。
  d_main_47_03_168:
    speaker: behemoth
    en: A complex operation wouldn't work, since neither side knows the other well
      enough.
    ko: 복잡한 작전 같은 건 서로서로 잘 모르니까 불가능해.
    ja: |-
      お互いのこともよく知らねぇで、
      複雑な連携なんてムリな話だ。
  d_main_47_03_169:
    speaker: behemoth
    en: So, all we have to do is go there and wipe them out. Right?
    ko: |-
      그럼 우리가 해야 할 일은,
      가서 밀어버리는 거. 맞지?
    ja: |-
      あたしたちが任されるのは、
      敵をハデに蹴散らすこと。だろ？
  d_main_47_03_170:
    speaker: johan
    en: That's right.
    ko: 그건 맞다.
    ja: そうなるだろうな。
  d_main_47_03_171:
    speaker: behemoth
    en: There you go. Then we'll go get some rest.
    ko: 그래그래. 그러니 쉬고 있을게.
    ja: そうだろそうだろ。じゃ、休ませてもらうぜ。
  d_main_47_03_172:
    speaker: behemoth
    en: Come visit if you get bored, Young Man. You hear?
    ko: 남자. 심심하면 놀러와. 알겠지?
    ja: 男、ヒマになったら顔見せてくれ。いいだろ？
  d_main_47_03_173:
    speaker: "<Self>"
    en: Sure. Get some rest.
    ko: 그래. 쉬고 있어.
    ja: ああ、先に休んでくれ
  d_main_47_03_174:
    speaker: "<Monologue>"
    en: The Four Beasts leave the meeting room.
    ko: 포비스트가 회의실을 나간다.
    ja: フォービーストが会議室を離れた
  d_main_47_03_175:
    speaker: johan
    en: "... What a self-centered bunch."
    ko: "…멋대로인 녀석들이군."
    ja: "…勝手な奴らだ。"
  d_main_47_03_176:
    speaker: cecil
    en: They're awfully docile for Heretics, though.
    ko: 헬레틱치곤 저 정도면 아주 온순한 편 아닌가요?
    ja: ヘレティックにしては、穏やかな方では？
  d_main_47_03_177:
    speaker: johan
    en: Yes, that's true.
    ko: 그래. 그건 맞다.
    ja: そうだな。それもそうか。
  d_main_47_03_178:
    speaker: "<Self>"
    en: Scarlet, Rapunzel... and Noah... it'll be difficult for them to join the fight,
      won't it?
    ko: "…홍련과 라푼젤. 노아의 참전은 힘들겠지?"
    ja: |-
      …紅蓮、ラプンツェル、それとノアの参戦は
      やはり厳しそうか？
  d_main_47_03_179:
    speaker: cecil
    en: Yes, it would be impossible for now.
    ko: 예. 지금 당장은 힘들어요.
    ja: ええ。今の段階では困難です。
  d_main_47_03_180:
    speaker: cecil
    en: That Nikke manufacturing technology you secured for us... Oh, thank you for
      providing us with such highly classified information. My thanks are long overdue.
    ko: |-
      당신이 확보해준 니케 제작 기술, 아.
      극비 중의 극비를 제공해줘서 고마워요. 인사가 늦었네요.
    ja: |-
      確保できたニケの製造技術で…ああ。
      最重要の機密情報を提供していただいた
      というのに、お礼が遅くなりました。
  d_main_47_03_181:
    speaker: cecil
    en: Anyway, it's taking some time to set up the equipment needed for production.
    ko: 아무튼 제작 관련된 장비들을 세팅하는데 시간이 좀 걸리고 있어요.
    ja: |-
      話を戻すと、製造設備のセッティングに
      まだ時間が必要です。
  d_main_47_03_182:
    speaker: cecil
    en: I expect we'll be able to proceed immediately once the setup is complete.
    ko: 세팅만 끝나면 바로 가능할 거라고 봐요.
    ja: |-
      それさえ終われば、
      すぐにでも始められると思います。
  d_main_47_03_183:
    speaker: snowwhite_h_no
    en: "... Good. Glad to hear it."
    ko: "…그래. 다행이군."
    ja: "…そうか、よかった。"
  d_main_47_03_184:
    speaker: cecil
    en: That brings me to my point, Johan. I'd like you to set the priorities.
    ko: |-
      그래서 말인데, 요한.
      우선 순위를 지정해줬으면 해요.
    ja: |-
      ちょうどその話が出たので…ヨハン？
      優先順位を決めてください。
  d_main_47_03_185:
    speaker: johan
    en: What priorities?
    ko: 무슨 우선 순위지?
    ja: どういう優先順位だ？
  d_main_47_03_186:
    speaker: cecil
    en: We can only complete setup for up to two pieces of equipment.
    ko: 장비 세팅은 두개까지가 한계에요.
    ja: 同時にセットできるのは2体が限界です。
  d_main_47_03_187:
    speaker: cecil
    en: In other words, I'm asking you to choose who to save first.
    ko: 누구부터 살릴지, 선택해달라는 얘기죠.
    ja: 誰から先に復帰させるか、選んでください。
  d_main_47_03_188:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_189:
    speaker: johan
    en: "... Rapunzel, Scarlet, then Noah."
    ko: "…라푼젤, 홍련, 노아 순이다."
    ja: "…ラプンツェル、紅蓮、ノアの順だ。"
  d_main_47_03_190:
    speaker: cecil
    en: Such a cold, rational assessment.
    ko: 냉정하게 판단하네요.
    ja: 冷静な判断かと。
  d_main_47_03_191:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_03_192:
    speaker: cecil
    en: Understood. We'll proceed in that order.
    ko: 알겠어요. 그렇게 진행할게요.
    ja: 了解しました。そのように進めます。
  d_main_47_03_193:
    speaker: cecil
    en: I have one suggestion and one issue to bring up related to this.
    ko: 관련해서, 한가지 제안과 한가지 문제점이 있어요.
    ja: |-
      それにも関わる話として、
      提案と問題が1点ずつあります。
d_main_47_04:
  d_main_47_04_1:
    speaker: "<Monologue>"
    en: We move to Eden's Repair Center.
    ko: 우린 에덴에 있는 리페어 센터로 이동했다.
    ja: |-
      私たちはエデンのリペアセンターへ
      場所を移した
  d_main_47_04_2:
    speaker: "<Monologue>"
    en: Inside, two massive machines are being assembled.
    ko: "…뭔가 거대한 기계 두대가 조립되고 있었고."
    ja: "…2台の巨大な装置が目を引く"
  d_main_47_04_3:
    speaker: "<Monologue>"
    en: Against one wall are three brain shelters.
    ko: 한 쪽 벽면에는 셋의 브레인 셸터.
    ja: |-
      一方の壁には、
      3つのブレインシェルターが並んでいた
  d_main_47_04_4:
    speaker: "<Monologue>"
    en: Against another wall is a bed where Rose lies, battered and broken.
    ko: 그리고 한쪽 침대에는 만신창이가 된 장화가 누워있었다.
    ja: |-
      反対側のベッドに横たわる
      満身創痍の何者かは、薔花だろう
  d_main_47_04_5:
    speaker: "<Monologue>"
    en: I shake my head, trying to shake off the lifeless, chilling atmosphere that
      hangs over the entire Repair Center.
    ko: "…리페어 센터 전체에서 느껴지는, 생명력이라고는 없는 싸늘한 느낌을 떨쳐내기 위해 머리를 흔든다."
    ja: |-
      …生命の息吹を感じさせない
      リペアセンターの冷たい雰囲気から
      気をそらそうと頭を振った
  d_main_47_04_6:
    speaker: "<Monologue>"
    en: Johan and Cecil continue their conversation.
    ko: 요한과 세실이 대화를 이어간다.
    ja: ヨハンとセシルの話が再開された
  d_main_47_04_7:
    speaker: johan
    en: "... Use Red Shoes as Rapunzel's equipment?"
    ko: "…레드 슈즈를 라푼젤의 장비로?"
    ja: "…赤い靴をラプンツェルに？"
  d_main_47_04_8:
    speaker: cecil
    en: Yes.
    ko: 예.
    ja: そうです。
  d_main_47_04_9:
    speaker: johan
    en: We have no idea what Mirror might have done to her inside. It's far too dangerous.
    ko: |-
      미러라는 놈이 안에 무슨 짓을 해놨을지 모르는 일이다.
      너무 위험해.
    ja: |-
      ミラーといったか、
      奴が何を仕込んでいるかも分からない。
      リスクが高すぎる。
  d_main_47_04_10:
    speaker: cecil
    en: We've completed all precision scans. There's no sign of corruption, and her
      entire operating system has been completely wiped... Hmm...
    ko: |-
      정밀 검사는 모두 끝냈어요.
      침식은 고사하고 OS까지 다 날아가있어서… 음….
    ja: |-
      精密検査は完了しています。
      侵食どころか、基本システムまで
      きれいに消えていました。そうですね…
  d_main_47_04_11:
    speaker: cecil
    en: She's essentially undergone a factory reset.
    ko: 순정 상태라고 할 수 있죠.
    ja: いわゆる、工場出荷状態と言えるかと。
  d_main_47_04_12:
    speaker: cecil
    en: She's nothing more than a machine now. Albeit an ultra-high-performance one.
    ko: |-
      단순 기계 그 이상도 이하도 아닌 상태에요.
      초 고성능의.
    ja: |-
      今は単なる装置でしかありません。
      ただし、超高性能の。
  d_main_47_04_13:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_04_14:
    speaker: "<Self>"
    en: What do you think, Snow White?
    ko: 스노우 화이트 생각은 어때?
    ja: スノーホワイト、どう思う？
  d_main_47_04_15:
    speaker: snowwhite_h_no
    en: What happens if we use Red Shoes as equipment?
    ko: 레드 슈즈를 장비로 사용하면 어떻게 되는 거지?
    ja: 赤い靴の装備としての性能は？
  d_main_47_04_16:
    speaker: cecil
    en: She was originally designed with advanced mobility and physical strength.
    ko: 애초에 괴물 같은 기동력과 물리력이 컨셉인 무장이에요.
    ja: |-
      けた外れの機動力と
      物理的破壊力を持つ武装です。
  d_main_47_04_17:
    speaker: cecil
    en: Rapunzel isn't skilled in physical combat, so she won't be able to make much
      use of the body offensively. But in terms of mobility, she's in a completely
      different league.
    ko: 라푼젤에게 몸을 쓰는 재주는 없어서 공격용으로는 못 쓰겠지만, 기동력 측면에서는 비교도 되지 않겠죠.
    ja: |-
      格闘戦の心得が無いラプンツェルに
      武器としての利用は難しいと思いますが、
      機動力は段違いに向上するでしょう。
  d_main_47_04_18:
    speaker: snowwhite_h_no
    en: Excellent. Let's do it immediately.
    ko: 좋군. 당장 하자.
    ja: 分かった。やってくれ。
  d_main_47_04_19:
    speaker: anis_i
    en: Wait, shouldn't we deliberate on this a little more?
    ko: 아니, 그렇게 쉽게 정해도 되는 거야?
    ja: ちょっと、そんな簡単に決めちゃっていいの？
  d_main_47_04_20:
    speaker: snowwhite_h_no
    en: Rapunzel would have been thrilled. She was always frustrated by her lack of
      mobility.
    ko: |-
      라푼젤이었다면 좋아했을 거다.
      기동력을 항상 아쉬워했으니까.
    ja: |-
      ラプンツェルなら喜ぶはずだ。
      機動力の弱さをいつも嘆いていた。
  d_main_47_04_21:
    speaker: snowwhite_h_no
    en: She's always racing all over the place, providing healing and support...
    ko: 온갖 곳을 누비면서 치료와 보조를 한다라….
    ja: |-
      戦場を飛び回って治療や支援が
      できるようになれば…
  d_main_47_04_22:
    speaker: snowwhite_h_no
    en: Just thinking about it makes me feel more at ease.
    ko: 생각만 해도 든든하군.
    ja: 私たちも想像するだけで心強い。
  d_main_47_04_23:
    speaker: snowwhite_h_no
    en: And above all else, we have no one to back us now.
    ko: 그리고 무엇보다 우리는 지금 뒤가 없다.
    ja: 何より、私たちにはもう後がない。
  d_main_47_04_24:
    speaker: snowwhite_h_no
    en: So we must use every means at our disposal.
    ko: 쓸 수 있는 모든 수단을 동원해야 해.
    ja: 使えるものは何でも使うべきだ。
  d_main_47_04_25:
    speaker: cecil
    en: Since her squadmate has given her approval, I'll take that as permission.
    ko: 동료가 허가했으니 되는 걸로 알고 있을게요.
    ja: |-
      隊友の言葉です。
      許可を得られたものと判断します。
  d_main_47_04_26:
    speaker: johan
    en: All right. I'll leave it in your hands.
    ko: "…그래. 맡기겠다."
    ja: "…ああ。任せる。"
  d_main_47_04_27:
    speaker: johan
    en: If your suggestion was about Red Shoes, what's the other issue?
    ko: 제안은 레드 슈즈의 이야기였을테고, 그럼 문제는 뭐지?
    ja: 提案がこの話だとして、問題の方は何だ？
  d_main_47_04_28:
    speaker: cecil
    en: Scarlet is the issue.
    ko: 홍련이 문제에요.
    ja: 紅蓮のことです。
  d_main_47_04_29:
    speaker: cecil
    en: We are currently attempting to design a body blueprint based on her ideal
      form, as derived from her brain scan.
    ko: 현재 뇌스캔 후, 이상향에 기반한 바디 설계도를 만들어보려 하고 있는데.
    ja: |-
      脳スキャンをして、彼女の理想像に基づく
      ボディの設計図製作を試みました。
  d_main_47_04_30:
    speaker: cecil
    en: It's not working.
    ko: 만들어지지 않아요.
    ja: しかし、これが成功しません。
  d_main_47_04_31:
    speaker: snowwhite_h_no
    en: Why not?
    ko: "…만들어지지 않는다?"
    ja: "…どういうことだ？"
  d_main_47_04_32:
    speaker: cecil
    en: When she was attacked by the Queen, her brain suffered severe damage.
    ko: 퀸에게 당했을 때, 뇌에 큰 손상이 있었어요.
    ja: |-
      クイーンとの戦いで、
      脳に甚大な損傷を受けています。
  d_main_47_04_33:
    speaker: cecil
    en: Scarlet's NIMPH is currently compensating for the damaged areas,
    ko: 현재 홍련의 NIMPH는 그 손상된 부분을 커버하기 위해 움직이고 있는-
    ja: |-
      紅蓮のNIMPHは現在、その傷を
      カバーするために動いているため…
  d_main_47_04_34:
    speaker: cecil
    en: which technically qualifies as a malfunction.
    ko: 명백한 오작동을 일으키고 있는 상태고요.
    ja: 正常な動作をしていない状態です。
  d_main_47_04_35:
    speaker: snowwhite_h_no
    en: What do you mean malfunction?
    ko: 오작동이라니.
    ja: 壊れたということか？
  d_main_47_04_36:
    speaker: cecil
    en: Ah, I mean from a functional standpoint. But thanks to that, Scarlet's brain
      is still intact.
    ko: |-
      아, 기능상으로는 그렇다는 의미에요.
      덕분에 홍련의 뇌는 무사하다고 할 수 있으니까요.
    ja: |-
      いえ、あくまで機能的な問題の話です。
      そのおかげで紅蓮の脳は
      実質的に無事ですから。
  d_main_47_04_37:
    speaker: cecil
    en: However, a malfunction is still a malfunction, so it's preventing us from
      creating a proper body blueprint.
    ko: 그런데 오작동은 오작동이라 바디 설계도가 제대로 만들어지지 않아요.
    ja: |-
      ですが、そのせいでボディの製図が
      行えなくなっているのも確かです。
  d_main_47_04_38:
    speaker: cecil
    en: In the worst case scenario, we might have to put Scarlet's brain into a standard
      mass-produced body.
    ko: "…최악의 경우, 흔한 양산형 바디에 홍련의 뇌를 집어넣어야 할지도요."
    ja: |-
      …最悪の場合、量産型ボディを
      利用するしかありませんが…
  d_main_47_04_39:
    speaker: snowwhite_h_no
    en: What happens in that case?
    ko: 그럴 경우 어떻게 되는 거지?
    ja: そうすると、どうなる？
  d_main_47_04_40:
    speaker: cecil
    en: We'd have to leave it all to chance. Either her memories remain, or she's
      reduced to a blank slate.
    ko: |-
      운에 맡길 수밖에요.
      기억이 남을지, 백지가 될지.
    ja: |-
      まったくの運任せです。
      記憶が残るか、白紙に還るか…
  d_main_47_04_41:
    speaker: cecil
    en: Not to mention Scarlet would lose all the advantages of the highly customized
      mass-produced body she's had until now.
    ko: 그리고 지금껏 홍련이 누렸던… 극도로 커스터마이징 한 양산형 바디의 덕은 볼 수 없겠죠.
    ja: |-
      さらに、これまでの彼女のボディ…
      つまり、重度にカスタマイズされていた
      量産型ボディの恩恵は受けられなくなります。
  d_main_47_04_42:
    speaker: snowwhite_h_no
    en: Can't you just modify it?
    ko: 네가 개조해주면 되지 않나?
    ja: 改造だけならもともとできると聞いたが？
  d_main_47_04_43:
    speaker: cecil
    en: Modifying a mass-produced body is significantly harder than modifying a standard
      one.
    ko: 양산형 바디를 개조하는 건 일반 바디를 개조하는 것 보다 훨씬 어려워요.
    ja: 量産型ボディの改造は勝手が異なりますから。
  d_main_47_04_44:
    speaker: cecil
    en: We have limited resources available after all.
    ko: 사용할 수 있는 코스트가 한정되어 있으니까요.
    ja: 今から使用できる資源は限られますし…
  d_main_47_04_45:
    speaker: cecil
    en: "... Well, it's not entirely impossible... if we're prepared to create dozens
      of corpses, that is."
    ko: "…뭐, 수십개의 시체를 만들 각오만 있다면 불가능하진 않겠죠."
    ja: |-
      …いちおう、数十の命を
      失敗作にして捨てる覚悟があれば
      不可能ではないと思いますが。
  d_main_47_04_46:
    speaker: cecil
    en: The problem is, there's only one Scarlet.
    ko: 홍련은 하나라는 게 문제지만.
    ja: 紅蓮の命は一つしかないというのが問題です。
  d_main_47_04_47:
    speaker: cecil
    en: Just in case...
    ko: "…혹시나 싶어서."
    ja: "…それと、念のため…"
  d_main_47_04_48:
    speaker: cecil
    en: I ran a simulation to see what would happen if we forcibly attached a completed
      body without going through a brain scan.
    ko: 뇌스캔을 거치지 않고 완성된 바디를 강제로 달면 어떨까 싶어 시뮬레이션을 돌려봤는데.
    ja: |-
      脳スキャンを省いて完成させたボディを
      強制的に使用したらどうなるか、
      シミュレーションしましたが…
  d_main_47_04_49:
    speaker: cecil
    en: The result showed a 98.2% probability of her NIMPH going berserk. In other
      words, it would mean a catastrophic Mind Switch.
    ko: |-
      98.2% 확률로 NIMPH가 폭주하는 결과가 나왔어요.
      사고 전환이 크게 온다는 얘기죠.
    ja: |-
      98.2％の確率で
      NIMPHが暴走するという結果になりました。
      深刻な思考転換が発生するということです。
  d_main_47_04_50:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_04_51:
    speaker: snowwhite_h_no
    en: So... Scarlet can't be saved, is that it?
    ko: 홍련은… 살아날 수 없는 건… 가.
    ja: 紅蓮は…助からないと…いうことか…
  d_main_47_04_52:
    speaker: cecil
    en: There's only one option.
    ko: "…단 하나. 방법이 있어요."
    ja: "…たったひとつ、方法があります。"
  d_main_47_04_53:
    speaker: cecil
    en: We use Rose's body.
    ko: 장화의 바디를 쓰는 거죠.
    ja: 薔花のボディを利用することです。
  d_main_47_04_54:
    speaker: snowwhite_h_no
    en: Come again?
    ko: "…뭐?"
    ja: "…何？"
  d_main_47_04_55:
    speaker: cecil
    en: Scarlet's and Rose's bodies should be identical models, so they should be
      a perfect match.
    ko: |-
      홍련의 바디와 장화의 바디는 동형기였을테니,
      완벽하게 맞아떨어지겠죠.
    ja: |-
      紅蓮のボディと薔花のボディは
      もともと同型だったようで、
      完全に一致すると思われます。
  d_main_47_04_56:
    speaker: "<Self>"
    en: What if we just build a body according to Rose's body data?
    ko: 그럼 장화의 바디 데이터를 그대로 따라 제작하면…!
    ja: |-
      であれば、薔花のボディデータを
      そのまま転用すれば…！
  d_main_47_04_57:
    speaker: cecil
    en: There are many inherent problems with that.
    ko: 문제가 많아요.
    ja: それにも問題が多くあります。
  d_main_47_04_58:
    speaker: cecil
    en: There are a plethora of black boxes in Rose's body.
    ko: 장화의 바디. 블랙박스가 너무 많아요.
    ja: |-
      今の薔花のボディには
      ブラックボックスが多すぎることです。
  d_main_47_04_59:
    speaker: cecil
    en: The fact that she can function without a core is abnormal in itself.
    ko: 애초에 코어가 없는데 움직이는 것부터가 정상은 아니죠.
    ja: |-
      コアが見当たらないにも関わらず
      動いていた時点で、
      すでに普通ではありません。
  d_main_47_04_60:
    speaker: cecil
    en: Mirror must have used every trick imaginable to make her operational. As far
      as we're concerned, that's technology that's completely unknown to us.
    ko: |-
      미러라는 자가 온갖 술수를 다 써서 움직이게 만들어 놨을 테고,
      그건 저희 입장에서는 미지의 기술이에요.
    ja: |-
      ミラーと名乗る何者かの技術のようですが、
      我々にとっては完全に未知の領域です。
  d_main_47_04_61:
    speaker: cecil
    en: We can't replicate it.
    ko: 복사할 수 없어요.
    ja: 単純にデータをコピーするとはいきません。
  d_main_47_04_62:
    speaker: cecil
    en: "... Also, there's no way to obtain the data for Scarlet's original body,
      the close-combat mass-produced model."
    ko: "…홍련의 원래 몸인, 접근전용 양산형 바디의 정보는 어디에서도 구할 수 없고요."
    ja: |-
      …そして、紅蓮のもともとのボディである、
      近接戦闘向けの量産型ボディのデータも
      今から入手することは難しいでしょう。
  d_main_47_04_63:
    speaker: snowwhite_h_no
    en: That means...
    ko: "…그 말은."
    ja: "…言いたいことは分かった。"
  d_main_47_04_64:
    speaker: snowwhite_h_no
    en: Unless we use Rose's body as-is, Scarlet can't be saved.
    ko: 장화의 바디를 그대로 쓰지 않는다면 홍련은 되살아날 수 없다는 얘기로군.
    ja: |-
      今ある薔花のボディをそのまま使わなければ、
      紅蓮を助けられないということだな。
  d_main_47_04_65:
    speaker: cecil
    en: "... Yes. That's right."
    ko: "…예. 맞아요."
    ja: "…ええ。その通りです。"
  d_main_47_04_66:
    speaker: snowwhite_h_no
    en: In that case, Rose would die.
    ko: 그렇게 되면, 장화는 죽는 것일 테고.
    ja: そうなれば、薔花は死ぬ。
  d_main_47_04_67:
    speaker: cecil
    en: "... That's also true."
    ko: "…그것도, 맞아요."
    ja: "…その通りです。"
  d_main_47_04_68:
    speaker: "<Self>"
    en: Hold on. What if we scan Rose's NIMPH and create a new body?
    ko: 잠깐. 장화의 NIMPH를 스캔해서 새로운 바디를 만든다면….
    ja: |-
      待ってくれ。薔花のNIMPHを
      スキャンして、新しいボディを作れば…
  d_main_47_04_69:
    speaker: cecil
    en: Rose's NIMPH is a mess. There are traces of corruption as well.
    ko: 장화의 NIMPH는 엉망이에요. 침식에 오염된 흔적도 보이고요.
    ja: |-
      薔花のNIMPHは壊滅的です。
      侵食で汚染されている痕跡もあります。
  d_main_47_04_70:
    speaker: cecil
    en: I scanned Rose's NIMPH and tried creating a body blueprint based on that data,
      but...
    ko: 장화의 NIMPH를 스캔해서, 그 데이터를 기반으로 바디의 설계도를 만들어봤는데….
    ja: |-
      すでにNIMPHをスキャンして、
      データを基に製図を試しましたが…
  d_main_47_04_71:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_04_72:
    speaker: cecil
    en: Ugh...
    ko: "…웁."
    ja: "…うっ…"
  d_main_47_04_73:
    speaker: cecil
    en: Pardon me.
    ko: 실례.
    ja: "…失礼。"
  d_main_47_04_74:
    speaker: cecil
    en: The result was something unidentifiable.
    ko: 뭔지 모를 것이 나왔어요.
    ja: 私の理解を超えるものになりました。
  d_main_47_04_75:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_04_76:
    speaker: cecil
    en: Rose isn't even aware of what she is anymore.
    ko: 장화는 지금 자신이 무엇인지조차 인지하지 못하고 있어요.
    ja: |-
      現在の薔花は、自分が何者かすらも
      認識できていないようです。
  d_main_47_04_77:
    speaker: cecil
    en: She's completely broken.
    ko: "…망가져 있는 거죠. 완전히."
    ja: "…完全に崩壊しています。"
  d_main_47_04_78:
    speaker: cecil
    en: All we've managed to do is keep her alive until now.
    ko: 말 그대로, 살려만 놓은 거예요. 지금껏.
    ja: |-
      言葉通り、ただ生きていただけです。
      おそらく今まで。
  d_main_47_04_79:
    speaker: "<Self>"
    en: What if we remove her NIMPH with Vapaus?
    ko: 언체인드로 NIMPH를 없애면?
    ja: アンチェインドでNIMPHを止めてみるか？
  d_main_47_04_80:
    speaker: "<Monologue>"
    en: Cecil shakes her head.
    ko: 세실은 고개를 가로저었다.
    ja: セシルは首を横に振った
  d_main_47_04_81:
    speaker: cecil
    en: Rose's brain has lost most of its functions.
    ko: 장화의 뇌는 지금 기능 대부분을 잃었어요.
    ja: 薔花の脳はすでに機能の大半を失っています。
  d_main_47_04_82:
    speaker: cecil
    en: She is entirely dependent on her NIMPH.
    ko: 전적으로 NIMPH에 의존하고 있는 상태인데.
    ja: |-
      NIMPH頼りで生存していると
      言っていいでしょう。
  d_main_47_04_83:
    speaker: cecil
    en: And right now, that NIMPH is in complete disarray.
    ko: 그 NIMPH가 엉망진창인 상태인 거죠.
    ja: |-
      問題はそのNIMPHも
      崩壊しているということです。
  d_main_47_04_84:
    speaker: cecil
    en: Furthermore, a Nikke's body blueprint is read directly from the NIMPH. Without
      the NIMPH, there's nothing we can do.
    ko: |-
      그리고 니케의 바디 설계도는 NIMPH에서 읽어요.
      NIMPH를 없애면 아무것도 할 수 없어요.
    ja: |-
      ニケのボディの製図には
      NIMPHから引き出すデータが必要です。
      それなしには、何もできません。
  d_main_47_04_85:
    speaker: johan
    en: So to summarize...
    ko: "…요약하자면."
    ja: "…要するに…"
  d_main_47_04_86:
    speaker: johan
    en: We can only save one of them. Either Rose or Scarlet.
    ko: 장화와 홍련 둘 중 하나만 살릴 수 있다. 로군.
    ja: |-
      薔花と紅蓮のどちらか一人だけということか。
      助けられるのは。
  d_main_47_04_87:
    speaker: cecil
    en: Yes.
    ko: 예.
    ja: はい。
  d_main_47_04_88:
    speaker: johan
    en: And we don't know what would happen if we transplanted Rose's body directly
      onto Scarlet.
    ko: 장화의 바디를 그대로 홍련에게 이식한다면 무슨 일이 일어날지 모르고.
    ja: |-
      薔花のボディに紅蓮を移植すれば、
      何が起こるか分からない。
  d_main_47_04_89:
    speaker: cecil
    en: Yes.
    ko: 예.
    ja: そうですね。
  d_main_47_04_90:
    speaker: johan
    en: Do the black boxes inside Rose's body pose any risks?
    ko: "…장화의 바디에 있다는 블랙박스에 위험성은 없나?"
    ja: |-
      …薔花のボディのブラックボックスには
      未知の危険性もあるはずだな？
  d_main_47_04_91:
    speaker: cecil
    en: Plenty. She might have been implanted with corruption, or perhaps even a self-destruct
      code.
    ko: 차고넘치죠. 침식을 심어놨을지도 모르고, 자폭 코드를 심어놨을지도 모르는 일이죠.
    ja: |-
      高いリスクが存在します。
      侵食や、自爆コードが
      仕込まれている可能性もあるでしょう。
  d_main_47_04_92:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_04_93:
    speaker: cecil
    en: Ah, @UserName. Could you look up body data for close-combat specialized squads
      in the Ark? If there's any data left, we might have a chance.
    ko: 아, 당신. 방주에서 근접전 특화 스쿼드의 바디 데이터를 찾아볼 수 없나요? 혹시 남아있다면 가능성이 있어요.
    ja: |-
      ああ、あるいは…近接戦闘部隊の
      ボディデータが、アークで手に入りませんか？
      それがあれば、別の可能性も考えられます。
  d_main_47_04_94:
    speaker: "<Self>"
    en: Sure. Just a moment.
    ko: 알겠어. 잠시만.
    ja: 分かった、少し待ってくれ
  d_main_47_04_95:
    speaker: cecil
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_47_04_96:
    speaker: enikk_op_l
    en: You called?
    ko: 호출하셨습니까.
    ja: お呼びでしょうか。
  d_main_47_04_97:
    speaker: "<Self>"
    en: Enikk. Is it possible to obtain body data from Nikkes belonging to a close-combat
      squad from around a hundred years ago?
    ko: 에닉. 100여년 전, 근접전용 스쿼드 소속 니케의 바디 데이터를 구할 수 있을까?
    ja: |-
      エニック、100年ほど前にあったらしい、
      近接戦闘用部隊に所属していた
      ニケのボディデータは手に入らないか？
  d_main_47_04_98:
    speaker: enikk_op_l
    en: Are you referring to Scarlet's original affiliation before joining the Goddess
      Squad?
    ko: 갓데스 스쿼드 소속, 홍련의 원 소속을 말씀하시는 겁니까?
    ja: |-
      ゴッデス部隊、紅蓮が
      加入前に所属していた部隊のことでしょうか？
  d_main_47_04_99:
    speaker: "<Self>"
    en: Yes. That's the one.
    ko: 응. 그거야.
    ja: ああ、それだ
  d_main_47_04_100:
    speaker: enikk_op_l
    en: Please wait a moment.
    ko: 잠시만 기다려주십시오.
    ja: 少々お待ちください。
  d_main_47_04_101:
    speaker: johan
    en: What is this?
    ko: "…뭐냐 이건."
    ja: "…冗談だろう。"
  d_main_47_04_102:
    speaker: cecil
    en: You're calling Enikk?
    ko: "…에닉을 호출한다고요?"
    ja: "…エニックを呼び出せるのですか？"
  d_main_47_04_103:
    speaker: enikk_op_l
    en: Thank you for waiting.
    ko: 오래 기다리셨습니다.
    ja: お待たせしました。
  d_main_47_04_104:
    speaker: enikk_op_l
    en: No records of that squad currently exist in the Ark's database.
    ko: 해당 스쿼드의 정보는 현재 방주의 데이터베이스엔 존재하지 않습니다.
    ja: |-
      該当する部隊の情報は現在、
      アークのデータベース内に存在しません。
  d_main_47_04_105:
    speaker: enikk_op_l
    en: It was the first squad to be documented as having directly killed a human.
      Consequently, all records were purged. Only traces of their deletion remain.
    ko: |-
      인간을 직접 살해한 최초의 사례가 관찰된 스쿼드라,
      모든 자료가 폐기된 흔적만 존재합니다.
    ja: |-
      人間を直接殺害した
      初の事例が発生した部隊として、
      資料は痕跡と呼ぶもの以外廃棄されています。
  d_main_47_04_106:
    speaker: enikk_op_l
    en: The data may still exist in the Forbidden Library. However, all information
      stored in that location consists solely of handwritten records.
    ko: |-
      금서고에는 존재할지도 모릅니다만,
      해당 장소의 자료는 모두 수기로 기록된 정보들 뿐입니다.
    ja: |-
      禁書庫に存在する可能性はありますが、
      紙面のみの情報にはアクセスできません。
  d_main_47_04_107:
    speaker: enikk_op_l
    en: It is highly unlikely that a Nikke's body data was ever recorded by hand.
    ko: 니케의 바디 데이터 정보를 수기로 작성했을 것이라고는 보기 어렵습니다.
    ja: |-
      ニケのボディデータが
      手書きで残されている可能性は
      低いと思われます。
  d_main_47_04_108:
    speaker: "<Self>"
    en: "... Right. Thank you."
    ko: "…그래. 고마워."
    ja: "…そうか。ありがとう"
  d_main_47_04_109:
    speaker: enikk_op_l
    en: Certainly. Please contact me anytime should you require further assistance.
    ko: 예. 또 도움이 필요하다면 언제든 연락 주십시오.
    ja: |-
      はい。また何かお困りの際は
      いつでもご連絡ください。
  d_main_47_04_110:
    speaker: "<Self>"
    en: Yeah. I'll reach out in the future.
    ko: 응. 다음에 또 연락할게.
    ja: ああ、また連絡する
  d_main_47_04_111:
    speaker: "<Self>"
    en: Sorry. I guess that wasn't much help.
    ko: "…미안. 도움이 안되네."
    ja: "…すまない。ないようだ"
  d_main_47_04_112:
    speaker: cecil
    en: "... Nothing we can do about it."
    ko: "…어쩔 수 없죠."
    ja: "…仕方ありませんね。"
  d_main_47_04_113:
    speaker: cecil
    en: I'll exhaust every available resource to find a solution, so give me a little
      more time.
    ko: 일단 저도 모든 수단을 다 동원해서 방법을 찾아볼 테니, 조금만 기다려줘요.
    ja: |-
      ひとまずは、私もあらゆる手を尽くして
      方法を探してみます。少し時間をください。
  d_main_47_04_114:
    speaker: snowwhite_h_no
    en: All right. I'm counting on you.
    ko: "…그래. 부탁하겠다."
    ja: "…分かった。頼む。"
  d_main_47_04_115:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_04_116:
    speaker: cecil
    en: I know what you're thinking, Johan.
    ko: "…요한. 무슨 생각하는지는 알겠는데."
    ja: "…ヨハン、考えていることは分かります。"
  d_main_47_04_117:
    speaker: cecil
    en: But we haven't become monsters yet.
    ko: 우리, 아직 괴물이 되긴 일러요.
    ja: ですが、まだ人を捨てるには早いでしょう。
  d_main_47_04_118:
    speaker: cecil
    en: Rose is still alive.
    ko: 장화는 살아있어요.
    ja: 薔花はまだ生きています。
  d_main_47_04_119:
    speaker: johan
    en: Hmm. Fine. I'll keep that in mind.
    ko: "…그래. 명심하지."
    ja: "…ああ、そうだな。"
  d_main_47_04_120:
    speaker: "<Self>"
    en: What about Liberalio?
    ko: "…리버렐리오는?"
    ja: "…リバーレリオは？"
  d_main_47_04_121:
    speaker: cecil
    en: We're leaving her alone and keeping her stored away.
    ko: 그냥 놔두고 있어요. 보관만 하고 있죠.
    ja: |-
      とくに手は出していません。
      保管されているだけの状態です。
  d_main_47_04_122:
    speaker: cecil
    en: Even though she helped you, the fact remains that she's a Heretic who invaded
      Eden and summoned the Queen.
    ko: "…당신을 도와줬다고는 하나, 에덴을 침략하고 퀸을 불러낸 헬레틱이라는 사실에는 변함이 없어요."
    ja: |-
      …あなたは助けられたそうですが、
      エデンを攻撃し、クイーンを地上に呼んだ
      ヘレティックということも事実です。
  d_main_47_04_123:
    speaker: cecil
    en: And although the Queen betrayed her, we can't be certain whether her affection
      has faded, or if it remains as strong as ever.
    ko: 퀸에게 배신당했다고는 하지만… 그 애정이 식었을지, 아직도 그대로일지도 확신할 수 없고요.
    ja: |-
      クイーンに捨てられたとも聞きました。
      しかし、それで関係が切れたのか、
      そのままなのか、確証は何もありません。
  d_main_47_04_124:
    speaker: cecil
    en: She is a massive liability. We could revive her as a Nikke, but I'd rather
      not.
    ko: 리스크 덩어리죠. 니케로 되살릴 순 있겠지만, 그러고 싶진 않네요.
    ja: |-
      リスクの塊です。
      ニケとしての蘇生は不可能ではありませんが、
      気は進みません。
  d_main_47_04_125:
    speaker: "<Self>"
    en: Right. I understand.
    ko: "…그래. 이해해."
    ja: "…そうか、分かった"
  d_main_47_04_126:
    speaker: "<Self>"
    en: What about the White Knights?
    ko: 바이스리터는 어때?
    ja: ヴァイスリッターはどうしている？
  d_main_47_04_127:
    speaker: johan
    en: I'm not entirely sure what they meant, but they sent word that they would
      regroup with us after recharging.
    ko: |-
      무슨 말인지는 모르겠지만,
      충전 후 합류하겠다고 전했다.
    ja: |-
      詳しいことは分からないが、
      力を蓄えて合流すると連絡が来た。
  d_main_47_04_128:
    speaker: johan
    en: Since that noisy attendant of theirs delivered the message, it can be trusted.
    ko: 그 시끄러운 시종이 전한 말이니, 믿을 수 있다.
    ja: |-
      あのうるさい従僕の言葉だ。
      信頼してもいいだろう。
  d_main_47_04_129:
    speaker: johan
    en: "... Any other questions?"
    ko: "…더 궁금한 사항은?"
    ja: "…他に聞きたいことは？"
  d_main_47_04_130:
    speaker: "<Self>"
    en: No. None for now.
    ko: 괜찮아. 지금은 없어.
    ja: 特にない、今のところは
  d_main_47_04_131:
    speaker: johan
    en: All right. Then that concludes our briefing on the current situation.
    ko: 그래. 그럼 상황에 대한 공유는 끝난 모양이군.
    ja: |-
      そうか。
      では、情報交換はこれで終わりとしよう。
  d_main_47_04_132:
    speaker: johan
    en: Let's prepare to depart.
    ko: 출발 준비를 하지.
    ja: 出撃の準備に移る。
  d_main_47_04_133:
    speaker: "<Self>"
    en: Before we leave, could I go see Marian for a moment?
    ko: 아, 가기 전에 마리안을 한번 보고 갈 수 있을까?
    ja: その前に、マリアンを見てきていいか？
  d_main_47_04_134:
    speaker: johan
    en: Sure. Do as you please.
    ko: 그래. 맘대로 해라.
    ja: ああ。構わない。
d_main_47_05:
  d_main_47_05_1:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_2:
    speaker: "<Narration>"
    en: The girl stares intently at Marian as she lies there, seemingly asleep.
    ko: 소녀는 잠든듯 누워있는 마리안을 빤히 바라본다.
    ja: |-
      眠るように横たわるマリアンを
      少女が見つめていた
  d_main_47_05_3:
    speaker: "<Narration>"
    en: She closes her eyes and focuses her mind. She doesn't sense anyone nearby.
    ko: |-
      눈을 감고 정신을 집중한다.
      인근에 그 누구도 감지되지 않는다.
    ja: |-
      目を閉じ、精神を集中している。
      近くに他の人影はない
  d_main_47_05_4:
    speaker: "<Narration>"
    en: The girl's body becomes engulfed in black.
    ko: 소녀의 몸이 검은색으로 물든다.
    ja: 少女の身体が黒に染まりはじめる
  d_main_47_05_5:
    speaker: "<Narration>"
    en: Moments later, the blackness spreading from her swallows the entire area.
    ko: 그리고 곧, 소녀에게서 뻗어나온 검은색이 일대를 뒤덮는다.
    ja: |-
      やがて少女からあふれ出た黒は
      あたり一面に広がり…
  d_main_47_05_6:
    speaker: "<Narration>"
    en: The blackness envelops Marian as well.
    ko: 검은색이 마리안마저 뒤덮는다.
    ja: マリアンをも包み込んだ
  d_main_47_05_7:
    speaker: "<Narration>"
    en: The girl opens her eyes.
    ko: 소녀는 눈을 뜬다.
    ja: 少女が目を開いた
  d_main_47_05_8:
    speaker: onlyone
    en: Hi, sleeping girl.
    ko: 잠자는 언니.
    ja: 眠ってる、お姉ちゃん。
  d_main_47_05_9:
    speaker: marian_q
    en: "..."
    ko: "…아."
    ja: "…あ…"
  d_main_47_05_10:
    speaker: onlyone
    en: Do you feel better now?
    ko: 이제 괜찮아졌어?
    ja: もう、ヘーキ？
  d_main_47_05_11:
    speaker: onlyone
    en: Are you still scared?
    ko: 아직 무서워?
    ja: まだ、怖い？
  d_main_47_05_12:
    speaker: "<Narration>"
    en: Marian stares intently at the girl.
    ko: 마리안은 소녀를 빤히 바라본다.
    ja: マリアンが少女に目をやった
  d_main_47_05_13:
    speaker: marian_q
    en: No. I'm fine now.
    ko: 아뇨. 이제 괜찮아요.
    ja: いえ。もう大丈夫です。
  d_main_47_05_14:
    speaker: marian_q
    en: "... I want to be absolutely sure."
    ko: "…다시 한 번 확인하고 싶어요."
    ja: "…もう一度、確かめさせてください。"
  d_main_47_05_15:
    speaker: marian_q
    en: This is inside your mind, right?
    ko: 여긴 당신의 안이죠?
    ja: ここは、あなたの中なんですね？
  d_main_47_05_16:
    speaker: onlyone
    en: Uh-huh. You're outside, sleeping right now.
    ko: 응. 언니는 지금 바깥에서 자고 있어.
    ja: うん。お姉ちゃん、外で寝てる。
  d_main_47_05_17:
    speaker: onlyone
    en: So we can only talk here.
    ko: 그래서 여기에서밖에 얘기 못 해.
    ja: しゃべれるの、ここだけ。
  d_main_47_05_18:
    speaker: marian_q
    en: "... That's incredible... Is this what a Queen is capable of?"
    ko: "…대단하네요. 퀸의 능력인가요?"
    ja: |-
      …すごいですね。
      クイーンの能力ですか？
  d_main_47_05_19:
    speaker: onlyone
    en: I dunno.
    ko: 몰라.
    ja: わかんない。
  d_main_47_05_20:
    speaker: marian_q
    en: "... I see."
    ko: "…그렇군요."
    ja: "…そうですか。"
  d_main_47_05_21:
    speaker: onlyone
    en: You're a Queen too, right?
    ko: 언니도 퀸이지?
    ja: お姉ちゃんも、クイーン？
  d_main_47_05_22:
    speaker: marian_q
    en: Yes. That's right.
    ko: 예. 맞아요.
    ja: ええ、そうでした。
  d_main_47_05_23:
    speaker: marian_q
    en: But right now... I'm not really sure.
    ko: 지금은… 잘 모르겠지만.
    ja: 今は…よく分からないですが。
  d_main_47_05_24:
    speaker: onlyone
    en: What...
    ko: 언니.
    ja: お姉ちゃん。
  d_main_47_05_25:
    speaker: onlyone
    en: What does a Queen have to do?
    ko: 퀸은 뭘 해야 해?
    ja: クイーンって、なにするの？
  d_main_47_05_26:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_27:
    speaker: onlyone
    en: You know...
    ko: 나 있잖아.
    ja: あのね。
  d_main_47_05_28:
    speaker: onlyone
    en: My heart keeps pounding.
    ko: 자꾸 가슴이 콩닥콩닥거려.
    ja: 胸が何回もドキドキするの。
  d_main_47_05_29:
    speaker: onlyone
    en: I feel like it keeps telling me to do something.
    ko: 뭘 하라고 자꾸 얘기하고 있는 것 같아.
    ja: 何かしなさいって、ずっと言われてるみたい。
  d_main_47_05_30:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_31:
    speaker: onlyone
    en: I know.
    ko: 나는 알아.
    ja: わかるの。
  d_main_47_05_32:
    speaker: onlyone
    en: I know I can become a Queen, and a Queen has to do something.
    ko: 나는 퀸이 될 수 있고, 퀸은 뭔가를 해야 해.
    ja: |-
      わたしはクイーンになる。
      それで、何かしなきゃいけないの。
  d_main_47_05_33:
    speaker: onlyone
    en: Has to. Doesn't have a choice.
    ko: 응. 그렇게 하지 않으면 안 돼.
    ja: うん。そうしないと。
  d_main_47_05_34:
    speaker: onlyone
    en: But... what do I need to do?
    ko: 언니. 나는 뭘 해야 해?
    ja: お姉ちゃん。わたし、何すればいいの？
  d_main_47_05_35:
    speaker: marian_q
    en: I... I don't know.
    ko: 모르… 겠어요.
    ja: 私にも…分かりません。
  d_main_47_05_36:
    speaker: onlyone
    en: What did you want to do?
    ko: 언니는 뭘 하고 싶었어?
    ja: お姉ちゃんは、何したい？
  d_main_47_05_37:
    speaker: marian_q
    en: I...
    ko: 저는….
    ja: 私は…
  d_main_47_05_38:
    speaker: marian_q
    en: I wanted to create a world where everyone could love one another.
    ko: 모두가 모두를 사랑하는 세계를 만들고 싶었어요.
    ja: |-
      誰もが、お互いを
      愛せる世界にしたいと思っていました。
  d_main_47_05_39:
    speaker: marian_q
    en: A world where Nikkes, humans, and Raptures could all love one another.
    ko: |-
      니케도, 사람도, 랩쳐도.
      모두 서로를 사랑할 수 있는 세계를 만들고 싶었어요.
    ja: |-
      ニケも、人間も、ラプチャーも…
      みんながみんなを好きでいられる、
      そういう世界です。
  d_main_47_05_40:
    speaker: marian_q
    en: "... But it didn't work out."
    ko: "…잘 안됐지만."
    ja: "…できませんでしたけど。"
  d_main_47_05_41:
    speaker: onlyone
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_42:
    speaker: onlyone
    en: Why?
    ko: 왜?
    ja: どうして？
  d_main_47_05_43:
    speaker: marian_q
    en: Huh?
    ko: 예?
    ja: え？
  d_main_47_05_44:
    speaker: onlyone
    en: Why did you want to do that?
    ko: 왜 그러고 싶었어?
    ja: なんで、そうしたかったの？
  d_main_47_05_45:
    speaker: marian_q
    en: Well... obviously because...
    ko: 그야… 당연히….
    ja: それは…もちろん…
  d_main_47_05_46:
    speaker: marian_q
    en: Because I wanted to... protect everyone...
    ko: 모두를… 지키고 싶어서….
    ja: みんなを…守るために…
  d_main_47_05_47:
    speaker: onlyone
    en: Everyone? Nikkes, humans, and Raptures?
    ko: 모두? 니케. 사람. 랩쳐 모두?
    ja: みんな？ニケと、人間、ラプチャーも？
  d_main_47_05_48:
    speaker: marian_q
    en: "... Yeah."
    ko: "…예."
    ja: "…はい。"
  d_main_47_05_49:
    speaker: onlyone
    en: How?
    ko: 어떻게?
    ja: どうやって？
  d_main_47_05_50:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_51:
    speaker: onlyone
    en: Hehe.
    ko: 꺄햐하. 언니.
    ja: きゃはは、お姉ちゃん…
  d_main_47_05_52:
    speaker: onlyone
    en: You're so greedy.
    ko: 욕심쟁이.
    ja: よくばり。
  d_main_47_05_53:
    speaker: marian_q
    en: "... I'm greedy?"
    ko: "…욕심쟁이요?"
    ja: "…欲張り？"
  d_main_47_05_54:
    speaker: onlyone
    en: Yeah. I get scolded everyday.
    ko: 응. 나 매일 혼나.
    ja: うん。わたし、いつも怒られる。
  d_main_47_05_55:
    speaker: onlyone
    en: They tell me not to eat so much and to eat just enough for my body.
    ko: 너무 많이 먹지말고, 몸에 맞게 적당히 먹으라고 혼내.
    ja: |-
      食べすぎちゃダメ、
      体に合った分だけ食べなさいって。
  d_main_47_05_56:
    speaker: onlyone
    en: They say I'm greedy.
    ko: 욕심쟁이래.
    ja: そうしないと、よくばり。
  d_main_47_05_57:
    speaker: onlyone
    en: But I can eat it all. So I do.
    ko: |-
      그런데 나는 다 먹을 수 있어.
      그래서 먹어.
    ja: |-
      でもわたし、ぜんぶ食べられる。
      だから食べてるの。
  d_main_47_05_58:
    speaker: onlyone
    en: I'm not greedy.
    ko: 나는 욕심쟁이가 아니야.
    ja: わたし、よくばりじゃない。
  d_main_47_05_59:
    speaker: onlyone
    en: But you are.
    ko: 그런데 언니는 욕심쟁이야.
    ja: でもお姉ちゃんは、よくばり。
  d_main_47_05_60:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_61:
    speaker: onlyone
    en: Ah, someone's coming.
    ko: 아, 누가 왔다.
    ja: あっ、だれか来た。
  d_main_47_05_62:
    speaker: onlyone
    en: Bye. See you later.
    ko: 다음에 봐. 안녕.
    ja: またね。バイバイ。
  d_main_47_05_63:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_64:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_main_47_05_65:
    speaker: anis_i
    en: There you are.
    ko: 진짜 여기 있네.
    ja: 本当にここにいたのね。
  d_main_47_05_66:
    speaker: neon_v
    en: What are you doing here, Little Sister?
    ko: 사매님. 여기서 뭘 하고 계시나요?
    ja: 師妹、ここで何をしているんですか？
  d_main_47_05_67:
    speaker: "<Self>"
    en: Why are you calling her that?
    ko: 사매는 또 뭐야.
    ja: シーメイ？
  d_main_47_05_68:
    speaker: neon_v
    en: Since she's Master's daughter, that makes her my little sister.
    ko: 스승님의 딸이니 사매가 맞죠.
    ja: |-
      師匠の娘さんは
      そう呼ぶものらしいのです。
  d_main_47_05_69:
    speaker: rapi_red
    en: Yes. We should get the titles right.
    ko: 그래. 호칭은 확실하게 해야지.
    ja: そうね。正しい呼び方だと思うわ。
  d_main_47_05_70:
    speaker: rapi_red
    en: I suppose that makes her Anis's niece, then? Hehe.
    ko: 그럼 아니스한텐 조카가 되는건가? 후후.
    ja: |-
      アニスにとっては
      姪っ子ということになるかしら？ふふっ…
  d_main_47_05_71:
    speaker: anis_i
    en: Har har. Very funny.
    ko: 후후 같은 소리한다 정말.
    ja: ふふっ、じゃないわよ。
  d_main_47_05_72:
    speaker: onlyone_c
    en: Mommy. Mommy. Hug me.
    ko: 엄마. 엄마. 안아 줘.
    ja: ママ。ママ。だっこ。
  d_main_47_05_73:
    speaker: rapi_red
    en: All right, come here.
    ko: 그래그래. 이리 와.
    ja: はいはい。だっこしてあげましょうね。
  d_main_47_05_74:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_75:
    speaker: anis_i
    en: Um... I can hug you. I'm probably a bit more cuddly, you know.
    ko: 내… 가 안아줄까? 내가 더 푹신푹신할걸?
    ja: |-
      わ…私が抱っこしたげよっか？
      きっと私の方が柔らかいわよ？
  d_main_47_05_76:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_77:
    speaker: onlyone_c
    en: I don't like you.
    ko: 언니는 싫어.
    ja: お姉ちゃん、ヤ。
  d_main_47_05_78:
    speaker: anis_i
    en: Huh...? Why not...?
    ko: "…왜… 싫어?"
    ja: "…え…なんで？"
  d_main_47_05_79:
    speaker: onlyone_c
    en: You threw a star at me.
    ko: 언니 나한테 별 던졌어.
    ja: 星、ぶつけた。
  d_main_47_05_80:
    speaker: anis_i
    en: No... that was... er...
    ko: 아니… 그건… 어….
    ja: いや…あれは…その…
  d_main_47_05_81:
    speaker: rapi_red
    en: That's right. We don't like people who hurt us, do we?
    ko: 그렇지? 아프게 하는 언니는 싫지?
    ja: |-
      そうね？痛いことをしてきた
      お姉ちゃんはイヤよね～？
  d_main_47_05_82:
    speaker: neon_v
    en: Then can I hug you?
    ko: 그럼 제가 안아도 될까요?
    ja: でしたら、私が抱っこしてもいいですか？
  d_main_47_05_83:
    speaker: onlyone_c
    en: Uh-huh. Hug me.
    ko: 응. 안아 줘.
    ja: うん。だっこ。
  d_main_47_05_84:
    speaker: "<Monologue>"
    en: Neon takes the child into her arms.
    ko: 네온이 아이를 안아든다.
    ja: ネオンが少女を抱き上げた
  d_main_47_05_85:
    speaker: neon_v
    en: Wow. This is more stressful than I thought. I'm afraid I might drop her.
    ko: 우와. 생각보다 엄청 신경쓰이네요. 떨어뜨릴까봐.
    ja: |-
      ああ…意外とハラハラするものなんですね。
      落としちゃわないかって。
  d_main_47_05_86:
    speaker: rapi_red
    en: It's okay. Just let your maternal instincts take over.
    ko: 괜찮아. 모성애를 발휘해봐.
    ja: 大丈夫よ。母性の訴えるままにすればいいの。
  d_main_47_05_87:
    speaker: neon_v
    en: I'll do my best.
    ko: 힘내볼게요.
    ja: 頑張ってみます。
  d_main_47_05_88:
    speaker: onlyone_c
    en: "*Snores*"
    ko: "…쿨."
    ja: "…ぐぅ…"
  d_main_47_05_89:
    speaker: neon_v
    en: Huh. She fell asleep.
    ko: 엇. 자는데요?
    ja: おや。眠ってしまいましたか？
  d_main_47_05_90:
    speaker: rapi_red
    en: I guess she likes you.
    ko: 맘에 든 모양이네.
    ja: 気に入られたみたいね。
  d_main_47_05_91:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_92:
    speaker: "<Monologue>"
    en: Everyone's gaze falls on the sleeping child.
    ko: 모두의 시선이 잠든 아이를 바라본다.
    ja: 周囲の視線が眠る少女に向けられる
  d_main_47_05_93:
    speaker: "<Monologue>"
    en: We savor the peaceful moment for a brief moment, but soon turn our eyes to
      Marian lying there.
    ko: 그 평화로움을 만끽하는 것도 잠시, 우리는 곧 누워있는 마리안에게로 시선을 돌렸다.
    ja: |-
      つかの間の穏やかな空気を楽しんだ後、
      私たちは横たわったままの
      マリアンに視線を移した
  d_main_47_05_94:
    speaker: "<Monologue>"
    en: She remains completely motionless.
    ko: 마리안은 여전히, 미동도 하지 않는다.
    ja: 相変わらず、目覚める気配もない
  d_main_47_05_95:
    speaker: "<Self>"
    en: Marian. We're here.
    ko: 마리안. 우리 왔어.
    ja: マリアン、会いに来た
  d_main_47_05_96:
    speaker: anis_i
    en: The whole Counters Squad is here.
    ko: 카운터스 완전체로 왔지.
    ja: 完全体になったカウンターズも一緒にね。
  d_main_47_05_97:
    speaker: neon_v
    en: So please, wake up already and give us a big hug.
    ko: 그러니까 얼른 일어나서 재회의 포옹을 해주세요.
    ja: だから、早く起きて再会のハグをしましょう。
  d_main_47_05_98:
    speaker: rapi_red
    en: Come on, hurry up.
    ko: 자, 어서.
    ja: ほら、早く。
  d_main_47_05_99:
    speaker: "<Monologue>"
    en: Rapi looks down at Marian, who lies there with her arms spread open.
    ko: 라피가 양팔을 벌린 채 누워있는 마리안을 바라본다.
    ja: ラピが両腕を広げ、マリアンに身体を向けた
  d_main_47_05_100:
    speaker: "<Monologue>"
    en: "... As expected, Marian doesn't move an inch."
    ko: "…당연히, 마리안은 미동도 하지 않는다."
    ja: "…当然、マリアンは動かない"
  d_main_47_05_101:
    speaker: rapi_red
    en: "... This isn't working."
    ko: "…안되네."
    ja: "…ダメね。"
  d_main_47_05_102:
    speaker: neon_v
    en: Should we try dancing around her?
    ko: 마리안의 주위를 돌면서 춤이라도 출까요?
    ja: 周りをまわりながら踊ってみましょうか？
  d_main_47_05_103:
    speaker: anis_i
    en: What, like some kind of a rain dance or something? Why don't you just play
      some music instead. How about "Be My Star?"
    ko: |-
      무슨 기우제냐고.
      차라리 음악을 들려주자. Be My Star어때?
    ja: |-
      雨乞いの儀式じゃないんだから…
      それより音楽よ。
      Be My Starはどう？
  d_main_47_05_104:
    speaker: rapi_red
    en: The Tetra legal team might come after us for illegal advertising. Maybe we
      should splash some water on her.
    ko: |-
      불법 홍보 활동이라서 테트라 법무팀에서 연락이 올지도 몰라.
      차라리 확실하게 물을 뿌려보자.
    ja: |-
      無断で曲を流したらテトラの法務部が来るわ。
      水でもかけてみましょう。
  d_main_47_05_105:
    speaker: neon_v
    en: Getting her body wet could cause all sorts of problems. How about waking her
      up with the smell of food?
    ko: |-
      몸이 젖으면 여러모로 곤란해질 것 같으니,
      음식 냄새로 유인해볼까요?
    ja: |-
      体が濡れたら色々と困るでしょうし、
      食べ物の匂いで釣ってみませんか？
  d_main_47_05_106:
    speaker: anis_i
    en: Are we trying to hunt a wild animal or something? It's better if—
    ko: |-
      야생동물이라도 잡냐.
      차라리-
    ja: |-
      野生動物でも捕まえる気？
      そんなものより…
  d_main_47_05_107:
    speaker: rapi_red
    en: Rather than that, we should—
    ko: 그것보단 차라리-
    ja: いえ、ここはいっそ…
  d_main_47_05_108:
    speaker: neon_v
    en: No, forget all that. We need to—
    ko: 그런것들보단 차라리-
    ja: それならもっと名案が…
  d_main_47_05_109:
    speaker: "<Monologue>"
    en: As everyone spouts all sorts of bizarre ideas in hopes that Marian will wake
      up...
    ko: "…마리안이 깨어나길 바라면서 모두가 이런저런 이상한 소리를 하고 있는 가운데."
    ja: |-
      …マリアンの回復を願いながら、
      3人が冗談を飛ばし合っている間も…
  d_main_47_05_110:
    speaker: "<Monologue>"
    en: I keep my eyes on Marian.
    ko: 나는 계속 마리안을 바라본다.
    ja: 私は静かにマリアンを見ていた
  d_main_47_05_111:
    speaker: "<Monologue>"
    en: I imagine Marian opening her eyes as if nothing had happened and greeting
      us.
    ko: 아무렇지도 않게 눈을 뜬 후, 우리에게 인사하는 마리안을 상상한다.
    ja: |-
      今にも何事もなかったかのように目を開き、
      私たちに声をかけてきそうな気さえする
  d_main_47_05_112:
    speaker: "<Monologue>"
    en: Then, I feel a gaze from somewhere.
    ko: 그 때, 어딘가에서 시선을 느낀다.
    ja: ふと、どこからか視線を感じた
  d_main_47_05_113:
    speaker: "<Monologue>"
    en: The child cradled in Neon's arms opens her eyes and looks right at me.
    ko: "…네온의 품에 안겨있는 아이가, 눈을 뜨고 나를 바라보고 있다."
    ja: |-
      …ネオンの胸に抱かれた少女が、
      いつの間にか起きて私を見ていた
  d_main_47_05_114:
    speaker: "<Monologue>"
    en: She stares at me intently, as if observing me.
    ko: 빤히 바라보고 있다. 마치 관찰하는 듯 한 눈빛이다.
    ja: 興味のあるものを観察するようなまなざしだ
  d_main_47_05_115:
    speaker: onlyone_c
    en: Daddy.
    ko: 아빠.
    ja: パパ。
  d_main_47_05_116:
    speaker: Self
    en: "... Hmm?"
    ko: "…응?"
    ja: "…ん？"
  d_main_47_05_117:
    speaker: onlyone_c
    en: Is the sleeping girl someone special to Daddy?
    ko: 잠자는 언니는 아빠한테 소중한 사람이야?
    ja: |-
      寝てるお姉ちゃん、
      パパにとって、だいじな人？
  d_main_47_05_118:
    speaker: Self
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_119:
    speaker: Self
    en: Yes.
    ko: 응.
    ja: ああ
  d_main_47_05_120:
    speaker: onlyone_c
    en: How special?
    ko: 얼마만큼?
    ja: どのくらい？
  d_main_47_05_121:
    speaker: Self
    en: Well... it's hard to put into words.
    ko: 글쎄… 말로 표현하기 힘드네.
    ja: そうだな…言葉ではうまく言えない
  d_main_47_05_122:
    speaker: onlyone_c
    en: Do you want her to wake up?
    ko: 잠자는 언니가 깨어났으면 좋겠어?
    ja: お姉ちゃん、起きてほしい？
  d_main_47_05_123:
    speaker: Self
    en: Yes.
    ko: 응.
    ja: そうだな
  d_main_47_05_124:
    speaker: onlyone_c
    en: I see.
    ko: 그렇구나.
    ja: そうなんだ。
  d_main_47_05_125:
    speaker: onlyone_c
    en: I'll think about it a little longer.
    ko: 조금만 더 고민해볼게.
    ja: もうちょっと、かんがえる。
  d_main_47_05_126:
    speaker: Self
    en: Huh? About what?
    ko: 응? 뭘?
    ja: ん？何をだ？
  d_main_47_05_127:
    speaker: onlyone_c
    en: I'm not telling.
    ko: 안 알려줘.
    ja: ひみつ。
  d_main_47_05_128:
    speaker: "<Monologue>"
    en: The child hops down from Neon's arms and dashes away.
    ko: 아이는 네온의 품에서 폴짝 뛰어내린 후, 도도도 달려나갔다.
    ja: |-
      少女はネオンの胸元から飛び降り、
      素早く走り去っていった
  d_main_47_05_129:
    speaker: neon_v
    en: "... What was that about?"
    ko: "…뭐였을까요."
    ja: "…どうしたんでしょう。"
  d_main_47_05_130:
    speaker: anis_i
    en: Who knows? You can never really tell what kids are thinking.
    ko: 글쎄. 애들 생각은 알수가 없지.
    ja: |-
      何かしらね。
      子どもの考えることなんて分からないわ。
  d_main_47_05_131:
    speaker: rapi_red
    en: Hehe. She's so adorable.
    ko: 후후. 귀여워라.
    ja: ふふ。本当にかわいいわ。
  d_main_47_05_132:
    speaker: "<Narration>"
    en: Meanwhile, in the present...
    ko: 그리고, 현재.
    ja: そして、時は現在…
  d_main_47_05_133:
    speaker: "<Monologue>"
    en: After landing near the Lift, we take a look around.
    ko: 우리는 궤도 엘리베이터 인근에 착지 후, 주위를 둘러보았다.
    ja: |-
      私たちは軌道エレベーターの近辺に降下し、
      周囲の様子をうかがっていた
  d_main_47_05_134:
    speaker: "<Self>"
    en: "... It's really quiet."
    ko: "…조용하네."
    ja: "…静かだな"
  d_main_47_05_135:
    speaker: johan_op_l
    en: "... Damn, the comms..."
    ko: "…칫. 통신이…."
    ja: "…チッ。通信が…"
  d_main_47_05_136:
    speaker: cecil_op_c
    en: The jamming is way stronger than expected.
    ko: 생각보다 재밍이 너무 강하네요.
    ja: 想定以上に強力なジャミングです。
  d_main_47_05_137:
    speaker: papillon_op_r
    en: Really? Even after all those upgrades to the auxiliary facilities?
    ko: 진짜? 추가 시설을 그렇게나 보강했는데도 그래?
    ja: |-
      ホント？通信補助装置を
      あれだけ仕掛けといたのに？
  d_main_47_05_138:
    speaker: cecil_op_c
    en: This is no good. Let's set up more. As many as we can.
    ko: 안되겠어요. 조금 더 설치하죠. 최대한으로.
    ja: |-
      そのようです。さらに数を増やしましょう。
      限界まで。
  d_main_47_05_139:
    speaker: papillon_op_r
    en: Give me a break. It may look easy, but you have no idea how hard it is for
      me to fly around...
    ko: 좀 봐줘. 이게 보기에는 쉬워보이지만, 정작 날아다니는 사람은 얼마나….
    ja: |-
      カンベンして…
      簡単そうに見えるかもしれないけど、
      こっちは…
  d_main_47_05_140:
    speaker: johan_op_l
    en: Hurry up.
    ko: 서둘러라.
    ja: 急げ。
  d_main_47_05_141:
    speaker: papillon_op_r
    en: "... Fine. I'm on it."
    ko: "…예, 예. 알겠습니다~"
    ja: "…はいはい。分かりました～"
  d_main_47_05_142:
    speaker: "<Self>"
    en: Johan, Cecil. Do you copy?
    ko: 요한, 세실. 들려?
    ja: ヨハン、セシル。聞こえるか？
  d_main_47_05_143:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_144:
    speaker: "<Self>"
    en: It's not working. Communications are completely cut off.
    ko: 안되네. 통신이 완전 끊겼어.
    ja: ダメだ。通信が妨害されている
  d_main_47_05_145:
    speaker: snowwhite_h
    en: "... I don't recall it being this bad."
    ko: "…이 정도까진 아니었던 걸로 기억한다."
    ja: "…そんなものはなかったはずだ。"
  d_main_47_05_146:
    speaker: snowwhite_h
    en: The last time we were here, communications were fine until Mirror showed up.
    ko: 이전에 왔을 때는 미러라는 녀석이 나타나기 전까지 통신은 문제없었다.
    ja: |-
      前回の時は、
      ミラーという奴が顔を出すまで
      通信には何の問題もなかった。
  d_main_47_05_147:
    speaker: rapi_red
    en: "... Are you saying Mirror might be nearby?"
    ko: "…미러가 근처에 있을지도 모른다는 얘기겠네."
    ja: "…そのミラーが近くにいる可能性もあるわ。"
  d_main_47_05_148:
    speaker: leviathan
    en: That might be the case, but I think the cause is over there.
    ko: |-
      그럴지도 모르겠네.
      그런데 내 생각에 직접적인 원인은 저거야.
    ja: |-
      それもあるかもね。
      直接的な原因は、たぶんアレだと思うけど。
  d_main_47_05_149:
    speaker: "<Monologue>"
    en: I look in the direction Leviathan is pointing.
    ko: 레비아탄이 가리키는 곳을 바라본다.
    ja: レヴィアタンが指さす先を見た
  d_main_47_05_150:
    speaker: "<Monologue>"
    en: Bizarrely writhing black pools can be seen everywhere.
    ko: "…기묘하게 꿈틀대는 검은색 웅덩이가 곳곳에 보인다."
    ja: |-
      …奇妙にうごめく黒い水たまりが
      あちこちに散らばっている
  d_main_47_05_151:
    speaker: "<Self>"
    en: "... Dark Matter."
    ko: "…다크 매터."
    ja: "…ダークマターか"
  d_main_47_05_152:
    speaker: leviathan
    en: It's everywhere. There's so much of it.
    ko: 곳곳에 있어. 엄청 많아.
    ja: どこを見てもアレばっかり。すごい量。
  d_main_47_05_153:
    speaker: behemoth
    en: They probably took it all from our home. Hmm.
    ko: 아마도 우리 집에서 다 가져온거겠지, 이거.
    ja: 全部ウチからかっぱらってきた奴だろうな。
  d_main_47_05_154:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_155:
    speaker: "<Monologue>"
    en: Leviathan reaches out and points at the Dark Matter pools.
    ko: 레비아탄이 손을 뻗어 고여있는 다크 매터를 가리킨다.
    ja: |-
      レヴィアタンが手を伸ばし、
      ダークマター溜まりに指を向けた
  d_main_47_05_156:
    speaker: "<Monologue>"
    en: A moment later...
    ko: 그리고 잠시 후.
    ja: しばらくの沈黙の後…
  d_main_47_05_157:
    speaker: leviathan
    en: "... No. I've completely lost control of it."
    ko: "…안 돼. 제어권이 완전 넘어갔어."
    ja: "…ダメ。制御権を完全に取られてる。"
  d_main_47_05_158:
    speaker: leviathan
    en: It's not responding at all.
    ko: 잘 안 움직이네.
    ja: 全然動かせない。
  d_main_47_05_159:
    speaker: anis_i_w
    en: What are you doing, playing psychic?
    ko: 뭐하는거야. 초능력자 놀이?
    ja: 何してたの？超能力者ごっこ？
  d_main_47_05_160:
    speaker: neon_v_w
    en: Could you try bending my glasses?
    ko: 제 안경 한번 구부려보실래요?
    ja: 私の眼鏡を曲げたりできます？
  d_main_47_05_161:
    speaker: leviathan
    en: It's completely ignoring my commands.
    ko: 내 신호를 완전히 무시하고 있어.
    ja: 私の信号が完全に無視されてる。
  d_main_47_05_162:
    speaker: neon_v_w
    en: Just like you're ignoring us.
    ko: 레비아탄도 우리 신호 무시하고 있는데요.
    ja: |-
      私たちの信号も
      完全に無視された気がしますね。
  d_main_47_05_163:
    speaker: snowwhite_h
    en: "... It must be the Queen."
    ko: "…퀸이겠군."
    ja: "…クイーンだな。"
  d_main_47_05_164:
    speaker: leviathan
    en: Yeah. It's safe to assume the Queen has control over all the Dark Matter in
      this area.
    ko: 응. 퀸이 이 일대에 있는 모든 다크 매터의 제어권을 가지고 있다고 보는 게 맞겠지.
    ja: |-
      たぶん。このあたりのダークマターは、
      全部クイーンが制御権を握ってる。
  d_main_47_05_165:
    speaker: leviathan
    en: "... Has it found its master?"
    ko: "…주인을 찾은 건가."
    ja: "…本当の主を見つけたってことかもね。"
  d_main_47_05_166:
    speaker: snowwhite_h
    en: Its master?
    ko: 주인이라니.
    ja: 本当の主だと？
  d_main_47_05_167:
    speaker: leviathan
    en: I've always believed that the Queen is the source of the Dark Matter.
    ko: 나는 다크 매터의 기원이 퀸이라고 생각하고 있어.
    ja: |-
      私、ダークマターって
      クイーンに由来するものだと思ってるの。
  d_main_47_05_168:
    speaker: leviathan
    en: The fact that the kid was able to manipulate Dark Matter more skillfully than
      I could from the moment she was born...
    ko: 꼬맹이가 태어나자마자 다크 매터를… 나 이상으로 능숙하게 다뤘던 것도 그렇고.
    ja: |-
      あの子が生まれた瞬間から
      ダークマターを私よりうまく扱ってたのも、
      きっとそういうこと。
  d_main_47_05_169:
    speaker: leviathan
    en: Not to mention, I believe the Queen invaded our home to acquire the Dark Matter.
    ko: 퀸이 우리 집에 쳐들어온 이유도 다크 매터를 확보하기 위함이라고 생각하니까.
    ja: |-
      クイーンが私たちを狙ってきたのも、
      たぶんダークマターが目当てだったんでしょ。
  d_main_47_05_170:
    speaker: snowwhite_h
    en: "... Liliweiss's body was formed from Dark Matter, too."
    ko: "…언니의 몸도, 다크 매터에서 나타났었지."
    ja: |-
      …今のクイーンのボディも、
      ダークマターから出てきていたな。
  d_main_47_05_171:
    speaker: leviathan
    en: Yes. Considering everything, all the evidence points to the Queen being the
      source of the Dark Matter.
    ko: 응. 이런저런 점에서 생각해보면, 다크 매터의 기원은 퀸이 맞아.
    ja: |-
      それも。やっぱり全部の手がかりが
      そう言ってる。
  d_main_47_05_172:
    speaker: leviathan
    en: Needless to say, she doesn't just handle it skillfully, she wields it as if
      it's an extension of her body.
    ko: 말할 것도 없이, 능숙한 정도가 아니라 수족처럼 다룰 수 있을 테고.
    ja: |-
      今さら言うまでもないけど、
      上手どころか自分の手足みたいな感じで
      自由自在に使えてたし。
  d_main_47_05_173:
    speaker: ziz
    en: Er... s-so, in the worst-case scenario...
    ko: 어… 그, 그럼 최악의 경우.
    ja: あ…じゃ、じゃあ最悪の場合は…
  d_main_47_05_174:
    speaker: ziz
    en: Y-you're saying even the Dark Matter we're currently wearing or using could
      be stolen from us?
    ko: 우, 우리가 지금 두르고 있거나 쓰고 있는 다크 매터도 빼앗길 수 있다는 거잖아.
    ja: |-
      わ、私たちが今
      身に着けたり使ったりしてる
      ダークマターも奪われちゃうってことだよね…
  d_main_47_05_175:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_176:
    speaker: rapi_red
    en: Commander. If that happens, the Four Beasts might end up being the Four Naked
      Beasts.
    ko: 지휘관. 그럴 경우 포비스트는 알몸 4인조가 될지도 모릅니다.
    ja: |-
      指揮官…そうなるとフォービーストが
      ただの全裸4人組に
      なってしまうかもしれません。
  d_main_47_05_177:
    speaker: "<Self>"
    en: Why are you looking at me when you say that...?
    ko: 왜 날 보고 그런 얘길 하는 거야….
    ja: なぜその話を私に振るんだ…
  d_main_47_05_178:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_05_179:
    speaker: leviathan
    en: That shouldn't be a problem. The Dark Matter we all have is practically one
      with us already.
    ko: 그건 괜찮을 거야. 우리가 두르고 있거나 사용하는 다크 매터는 이미 우리랑 일체화된 거나 마찬가지니까.
    ja: |-
      それは心配しなくていいと思う。
      私たちが今使ってるダークマターは
      もう私たちになってるようなものだから。
  d_main_47_05_180:
    speaker: leviathan
    en: It's already finished transforming and is no longer in its original form.
      We'll be fine.
    ko: 원형이 아니라, 변화가 끝난 상태니까 괜찮아.
    ja: |-
      まだ変化してない、
      原型みたいな状態だけに限った話。
  d_main_47_05_181:
    speaker: leviathan
    en: Probably.
    ko: 아마도.
    ja: たぶんだけど。
  d_main_47_05_182:
    speaker: ziz
    en: O-okay... if you say so. I believe you, Levi.
    ko: 으, 응. 알겠어. 레비를 믿을게.
    ja: う、うん…分かった。レヴィを信じる。
  d_main_47_05_183:
    speaker: "<Self>"
    en: Then let's get moving.
    ko: 그럼 일단 움직이자.
    ja: とにかく、移動を始めよう
  d_main_47_05_184:
    speaker: "<Self>"
    en: We'll get as close to the Lift as possible and assess the situation.
    ko: 궤도 엘리베이터에 최대한 접근 후, 상태를 확인한 다음.
    ja: |-
      まず軌道エレベーターに可能な限り接近し、
      状況を確認する
  d_main_47_05_185:
    speaker: "<Self>"
    en: Then we hit them with everything we've got before retreating.
    ko: "…한 방 먹이고, 퇴각하는거야."
    ja: "…その後、一撃を与え、退却する"
  d_main_47_05_186:
    speaker: snowwhite_h
    en: All right. Let's go.
    ko: 좋다. 가자.
    ja: よし。行こう。
  d_main_47_05_187:
    speaker: snowwhite_h
    en: Mirror, or the corrupted Nayuta, could show up at any moment.
    ko: "…어디서 미러라는 녀석과 침식된 나유타가 나타날지 모른다."
    ja: |-
      …ミラーの奴と侵食されたナユタが
      どこから出てくるかも分からない。
  d_main_47_05_188:
    speaker: snowwhite_h
    en: And the Heretics, too.
    ko: 그리고 헬레틱도.
    ja: それに、ヘレティックもだ。
  d_main_47_05_189:
    speaker: snowwhite_h
    en: Proceed with extreme caution. But don't lose your nerve.
    ko: |-
      최대한 경계하면서 이동하자.
      겁먹지는 말고.
    ja: |-
      できる限り警戒しながら移動しよう。
      だが、おそれるな。
  d_main_47_05_190:
    speaker: "<Monologue>"
    en: Just as we are about to move out...
    ko: 이동하려는 순간.
    ja: 私たちが足を動かそうとした瞬間…
  d_main_47_05_191:
    speaker: "<Monologue>"
    en: A flash of light erupts from one side of the Lift.
    ko: 궤도 엘리베이터 한켠에서 섬광이 번쩍인다.
    ja: 軌道エレベーターの一部に光がほとばしった
  d_main_47_05_192:
    speaker: "<Monologue>"
    en: And then, something massive bursts out.
    ko: 그리고 거대한 무엇인가가 튀어나간다.
    ja: 光の中から巨大な何かが飛び出していく
  d_main_47_05_193:
    speaker: rapi_red
    en: That's...!
    ko: "…저건…!"
    ja: "…今のは…！"
  d_main_47_05_194:
    speaker: anis_i_w
    en: A H-Heretic Missile! That's Annihilio, right?!
    ko: 헤, 헬레틱 미사일이잖아…! 애니힐리오던가 그거!
    ja: |-
      ミ、ミサイルみたいなヘレティック…！
      アニヒリオよ！
  d_main_47_05_195:
    speaker: neon_v_w
    en: It's heading... towards the Ark!
    ko: 저 방향…! 방주 방향이에요!
    ja: あっちは…！アークの方角です！
  d_main_47_05_196:
    speaker: Self
    en: "...!"
    ko: "…!!"
    ja: "…！！"
d_main_47_06:
  d_main_47_06_1:
    speaker: ingrid_op
    en: A high-energy entity has been detected descending vertically toward the Ark.
    ko: 고 에너지 개체가 방주를 향해 수직 낙하 중인 것을 확인했다.
    ja: |-
      超高高度からアークに向かって落下する
      高エネルギー個体が確認された。
  d_main_47_06_2:
    speaker: ingrid_op
    en: Energy signature confirmed. It's Annihilio.
    ko: 에너지 패턴, 애니힐리오로 확정된다.
    ja: エネルギーパターン、アニヒリオで確定だ。
  d_main_47_06_3:
    speaker: sora
    en: Oh dear, again? That was fast. ★
    ko: 세상에. 또요? 빠르기도 해라~★
    ja: |-
      まったく、またですか？
      休むヒマもありませんね～★
  d_main_47_06_4:
    speaker: cielo
    en: Are we going to intercept it?
    ko: 저희가 요격하나요?
    ja: 迎撃は私たちが？
  d_main_47_06_5:
    speaker: sky
    en: Of course we will! That's why we have Zoomie.
    ko: 당연한 것 아닌가요? 그럴려고 붕붕이가 있는건데.
    ja: あたりめぇだろ？そのためのブンブン号だ。
  d_main_47_06_6:
    speaker: cielo
    en: That's true, but we don't have the Counters with us right now, so I'm a bit
      worried.
    ko: 그건 그렇죠. 그런데 지금은 카운터스도 없어서 좀 걱정이네요.
    ja: |-
      それはそうですけど、
      今はカウンターズがいませんし、
      ちょっと心配です。
  d_main_47_06_7:
    speaker: ingrid_op
    en: Don't worry. Matis and the Ark Rangers are below us, standing by.
    ko: |-
      걱정하지마라.
      아래에는 메티스와 아크레인저가 대기중이다.
    ja: |-
      心配するな。
      下にメティスとアークレンジャーも
      待機している。
  d_main_47_06_8:
    speaker: ingrid_op
    en: As long as they don't let it get past them, interception should be no issue.
    ko: 그냥 보내주지만 않는다면 요격은 문제 없겠지.
    ja: |-
      アークへの直撃さえ防げれば、
      あとは問題なくカバーできる。
  d_main_47_06_9:
    speaker: ingrid_op
    en: Also...
    ko: 그리고….
    ja: それから…
  d_main_47_06_10:
    speaker: ingrid_op
    en: With the guest currently aboard the Wings of Victory, Elysion Edition, there's
      nothing to worry about.
    ko: 지금 승리의 날개 호 Ver.엘리시온에 탑승하고 있는 손님이라면 문제 없다.
    ja: 乗せている客人のことなら、遠慮はいらん。
  d_main_47_06_11:
    speaker: sky
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_12:
    speaker: cielo
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_13:
    speaker: sora
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_14:
    speaker: ingrid_op
    en: Once again, thank you for your cooperation.
    ko: 다시 한번 협조에 감사한다.
    ja: 改めて、協力の申し出に感謝する。
  d_main_47_06_15:
    speaker: ingrid_op
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  d_main_47_06_16:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_17:
    speaker: dorothy
    en: I haven't actually agreed to cooperate with the Ark yet.
    ko: 저는 아직 방주에 협력하겠다고 말한적 없어요.
    ja: |-
      私はまだアークに協力すると
      言ったつもりはありません。
  d_main_47_06_18:
    speaker: dorothy
    en: Didn't the Comman... I mean, Deputy Chief Andersen, inform you?
    ko: 지휘관, 아니. 엔더슨 부사령관에게 전해듣지 못 했나요?
    ja: |-
      指揮官、いえ…
      アンダーソン副司令官から
      何も聞かされていないのですか？
  d_main_47_06_19:
    speaker: ingrid_op
    en: Yes, of course he did.
    ko: 음. 물론 전해들었다.
    ja: いや、当然聞いている。
  d_main_47_06_20:
    speaker: ingrid_op
    en: He said you might resist at first, but you'd come around eventually.
    ko: "[처음엔 튕기겠지만 결국엔 도와줄 거다]라고 하더군."
    ja: |-
      「口ではいろいろ言うが、
      　結局は力を貸してくれるだろう」だそうだ。
  d_main_47_06_21:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_22:
    speaker: dorothy
    en: You want to start the Third Surface Reclamation War?
    ko: "…3차 지상 탈환전을 시작한다고요?"
    ja: "…第三次地上奪還戦を始める？"
  d_main_47_06_23:
    speaker: andersen
    en: Yes.
    ko: 그래.
    ja: ああ。
  d_main_47_06_24:
    speaker: andersen
    en: To be precise, we have no other option.
    ko: 정확히는 할 수밖에 없는 상황이다.
    ja: 正確に言えば、やるしかないという感じだな。
  d_main_47_06_25:
    speaker: andersen
    en: The Ark is in shambles.
    ko: 방주가 개판이 났거든.
    ja: アークはもう壊れかけだ。
  d_main_47_06_26:
    speaker: andersen
    en: Like it or not, we have to go up to the surface and make a stand.
    ko: 좋든 싫든, 지상으로 올라가서 한바탕 할 수밖에 없어.
    ja: |-
      とにかく地上に出ていって、
      一か八かで暴れるしかない。
  d_main_47_06_27:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_28:
    speaker: andersen
    en: Lead the charge, Dorothy.
    ko: 선봉에 서라. 도로시.
    ja: 先頭に立ってくれ、ドロシー。
  d_main_47_06_29:
    speaker: andersen
    en: As a member of the Goddess Squad, you will announce the beginning of the Third
      Surface Reclamation War.
    ko: 갓데스 스쿼드의 도로시로, 3차 지상 탈환전의 시작을 알려.
    ja: |-
      ゴッデスのドロシーとして、
      第三次地上奪還戦開始の狼煙を上げるんだ。
  d_main_47_06_30:
    speaker: dorothy
    en: Lead the charge? Me?
    ko: "…선봉이라뇨. 제가요?"
    ja: "…先駆けを、私が？"
  d_main_47_06_31:
    speaker: andersen
    en: Didn't you want to be the one in charge? Isn't that why you made that broadcast?
    ko: 너 대장질 하고 싶어 했잖아. 그래서 방송까지 한 것 아냐?
    ja: |-
      注目されるのは好きだろう。
      それで配信までやっていたんじゃないのか？
  d_main_47_06_32:
    speaker: dorothy
    en: That wasn't my intention!
    ko: 그럴 의도로 방송을 한게…!
    ja: そんなことのための放送では…！
  d_main_47_06_33:
    speaker: andersen
    en: Sure.
    ko: 그럼.
    ja: 違うというなら…
  d_main_47_06_34:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_35:
    speaker: andersen
    en: I'm going to make all those things you said on air a reality.
    ko: 네가 방송에서 했던 그 말들을, 진짜로 만들거다.
    ja: |-
      君がアークに向かって言ったことを、
      本当にするしかない。
  d_main_47_06_36:
    speaker: andersen
    en: We'll blame the Queen for everything that has happened to the Ark.
    ko: 방주가 지금 이꼴이 된 건 모두 퀸 그 자식의 탓으로 돌리고.
    ja: |-
      今のアークに起きている問題の責任を、
      全てクイーンに押し付ける。
  d_main_47_06_37:
    speaker: andersen
    en: We'll declare an all-out war against the Queen and bring the Ark to the surface.
    ko: 퀸과의 전면전을 선포하며, 방주를 지상으로 올릴거다.
    ja: |-
      クイーンとの全面戦争を布告して、
      アークは地表へ浮上する。
  d_main_47_06_38:
    speaker: andersen
    en: Stand at the forefront of it all, Dorothy.
    ko: 그 선봉에 서라. 도로시.
    ja: その合図をするのは君だ、ドロシー。
  d_main_47_06_39:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_40:
    speaker: andersen
    en: You're in a very favorable position to be used as a symbol right now.
    ko: 너는 지금 상징으로 써먹기에 아주 좋은 상태야.
    ja: |-
      旗印として君以上に
      ふさわしい人物はいない。
  d_main_47_06_41:
    speaker: andersen
    en: Frankly, the stage is already set for you.
    ko: 솔직히 판이 깔려있는 수준이지.
    ja: |-
      実のところ、
      それ以外の手はずはもう整えてある。
  d_main_47_06_42:
    speaker: andersen
    en: Just step forward, proclaim that you'll be the vanguard, and everyone will
      eat it up.
    ko: 나서서, 내가 선봉 하겠소~ 라고 얘기만 하면 여기저기서 다 떠먹여줄거다.
    ja: |-
      君は「やりま～す」とだけ言ってくれれば、
      後のことは他の連中がやる。
  d_main_47_06_43:
    speaker: andersen
    en: All you have to do is giggle and bask in the attention.
    ko: 호호 거리면서 한껏 우쭐대기만 해도 된다는 얘기지.
    ja: |-
      あとは高笑いして
      偉そうにしていればいいだけだ。
  d_main_47_06_44:
    speaker: dorothy
    en: I do not giggle.
    ko: 저는 호호 거리지 않아요.
    ja: 私がいつ高笑いなどしたでしょうか。
  d_main_47_06_45:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_46:
    speaker: andersen
    en: While you were sitting in a cell, staring blankly at the walls, the Ark was
      attacked again.
    ko: |-
      네가 감방에서 벽보고 멍이나 때리고 있는 동안,
      방주는 또 습격을 받았다.
    ja: |-
      君が独房の壁を鑑賞している間に、
      アークはまた襲撃を受けた。
  d_main_47_06_47:
    speaker: andersen
    en: Those Rapture scum even deployed chemical weapons in an attempt to kill us.
    ko: 랩쳐놈들이 화학무기까지 동원하며 우릴 죽이려 들었어.
    ja: |-
      ラプチャーどもが、化学兵器に手を出した。
      人類を根絶やしにする気になったらしい。
  d_main_47_06_48:
    speaker: andersen
    en: They have no intention of showing us mercy anymore.
    ko: 저쪽은 이제 우릴 봐줄 생각이 없다.
    ja: もう見逃してはくれないだろうな。
  d_main_47_06_49:
    speaker: andersen
    en: We can't afford to stay on the defensive.
    ko: 우리도 이제 방어만 하고 있을 수 없는 상황이고.
    ja: |-
      我々も守りを固めているだけでは
      済まなくなった。
  d_main_47_06_50:
    speaker: andersen
    en: By all accounts, this will be our final battle.
    ko: 여러가지 의미로, 최종전이 되겠지.
    ja: あらゆる意味で、最後の戦いになる。
  d_main_47_06_51:
    speaker: andersen
    en: Either we die, or they do.
    ko: 우리가 죽거나, 저것들이 죽거나.
    ja: 私たちが死ぬか、あいつらが死ぬかだ。
  d_main_47_06_52:
    speaker: dorothy
    en: I... see...
    ko: 그렇… 군요.
    ja: そう…ですか。
  d_main_47_06_53:
    speaker: andersen
    en: This is our last chance.
    ko: 마지막 기회라는 얘기야.
    ja: これが最後のチャンスだ。
  d_main_47_06_54:
    speaker: andersen
    en: If we don't take it, there won't be another.
    ko: 이때가 아니면 다시는 기회가 없다.
    ja: 今を逃せば、二度と時は来ない。
  d_main_47_06_55:
    speaker: andersen
    en: So, what will you do?
    ko: 어떡할거냐?
    ja: どうする？
  d_main_47_06_56:
    speaker: dorothy
    en: Give me some time to think.
    ko: 생각할 시간을 좀 줘요.
    ja: 少し、考える時間をいただけますか。
  d_main_47_06_57:
    speaker: andersen
    en: Fine. Take your time.
    ko: 뭐, 좋아. 천천히 생각해보라고.
    ja: ああ、構わないさ。しっかり考えてくれ。
  d_main_47_06_58:
    speaker: andersen
    en: I've prepared a nice and cushy place for you to do your thinking.
    ko: 생각하기에 아주 좋은 장소를 준비해놨으니까.
    ja: そのための場所も用意しておいたからな。
  d_main_47_06_59:
    speaker: dorothy
    en: What do you mean?
    ko: 무슨 말이죠?
    ja: どういう意味です？
  d_main_47_06_60:
    speaker: andersen
    en: I'm saying you should go get some fresh air.
    ko: 바람이나 좀 쐬고 오라는 얘기야.
    ja: 少しばかり、風に当たってこいということだ。
  d_main_47_06_61:
    speaker: andersen
    en: The wind might be a bit strong, though.
    ko: 뭐… 바람이 좀 강할지도 모르겠지만 말이지.
    ja: まあ…少し強すぎるかもしれないが。
  d_main_47_06_62:
    speaker: dorothy
    en: He called this getting some fresh air? Unbelievable.
    ko: "…바람이나 쐬고 오라더니, 기가 막혀서 정말."
    ja: |-
      …こういう意味だったとは…
      まったく、呆れますね。
  d_main_47_06_63:
    speaker: sky
    en: We have a visual on Annihilio.
    ko: 애니힐리오. 육안으로 확인 가능해요.
    ja: アニヒリオ、目視で確認！
  d_main_47_06_64:
    speaker: sky
    en: Whatever you decide, just make a decision.
    ko: 뭐가 됐든 결정해줘요.
    ja: |-
      何でもいいが、さっさと
      決めやが…決めてください。
  d_main_47_06_65:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_66:
    speaker: cielo
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_67:
    speaker: "<Narration>"
    en: Cielo approaches Dorothy, seated in her chair.
    ko: 시엘로가 좌석에 앉아있는 도로시를 향해 다가간다.
    ja: シエロが座席のドロシーに近づいた
  d_main_47_06_68:
    speaker: "<Narration>"
    en: She kneels before her on one knee.
    ko: 그 앞에 한쪽 무릎을 꿇고 앉는다.
    ja: 片ひざをつき、声をかけた
  d_main_47_06_69:
    speaker: cielo
    en: Everything comfortable with the flight so far?
    ko: 비행에 불편함은 없으신가요?
    ja: フライトにご不便な点はございませんか？
  d_main_47_06_70:
    speaker: dorothy
    en: "... I'm fine. Don't worry about me."
    ko: "…괜찮아요. 신경쓰지 마세요."
    ja: "…何もありません。お構いなく。"
  d_main_47_06_71:
    speaker: cielo
    en: We may encounter some turbulence, so please bear with us on that.
    ko: 조금 흔들릴수도 있으니, 그 부분은 양해 부탁드려요.
    ja: |-
      少々揺れる場合もございますが、
      ご容赦ください。
  d_main_47_06_72:
    speaker: dorothy
    en: I said I'm fine.
    ko: 괜찮다니까요.
    ja: お構いなくと言いました。
  d_main_47_06_73:
    speaker: cielo
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_74:
    speaker: cielo
    en: This ship you're riding on now is the Wings of Victory.
    ko: "…지금 손님께서 탑승하고 계신 승리의 날개 호는."
    ja: "…お客様がご搭乗になっている勝利の翼号は…"
  d_main_47_06_75:
    speaker: cielo
    en: It's an aerial fortress constructed during the mid-Rapture invasion period.
    ko: 과거, 랩쳐 침공 중기에 제작된 공중 요새함이에요.
    ja: |-
      かつてのラプチャー侵攻中期に製造された
      飛行要塞でございます。
  d_main_47_06_76:
    speaker: cielo
    en: A masterpiece that represents the culmination of all of humanity's technology,
      and one that will never be built again.
    ko: 인류의 모든 기술이 집약된, 다시 나오지 않을 걸작이죠.
    ja: |-
      当時の人類の技術のすべてが集約された、
      不世出の傑作でした。
  d_main_47_06_77:
    speaker: cielo
    en: While its performance is indeed exceptional, the true value of the Wings of
      Victory does not lie in its capabilities.
    ko: |-
      성능적인 측면에서도 매우 우수했지만,
      승리의 날개 호의 진정한 가치는 성능이 아니에요.
    ja: |-
      当然、性能面でも優れてはおりますが、
      勝利の翼号が持つ真の価値は
      それではございません。
  d_main_47_06_78:
    speaker: cielo
    en: Rather, it lies in having served as the mobile base of operations for the
      Goddess Squad.
    ko: 갓데스 스쿼드의 이동 기지로 운용되었다는 것이, 승리의 날개 호의 진정한 가치죠.
    ja: |-
      勝利の翼号の真の価値は、
      かのゴッデス部隊により、移動する拠点として
      使用されていたことでございます。
  d_main_47_06_79:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_80:
    speaker: cielo
    en: Aboard the Wings of Victory, the Goddess Squad soared across the battlefield
      and brought countless victories to humanity.
    ko: 갓데스 스쿼드는 승리의 날개 호에 탑승해 전장을 누비며 수많은 승리를 인류에게 안겨줬어요.
    ja: |-
      ゴッデス部隊は勝利の翼号に乗り、
      無数の戦場を駆けめぐって
      数多の勝利を人類にもたらしました。
  d_main_47_06_81:
    speaker: cielo
    en: They say that no matter how desperate the battle seemed, the moment the Wings
      of Victory appeared, the tide of battle would turn.
    ko: 그 어떤 절망적인 전장에서도, 승리의 날개 호가 등장하는 순간 전장의 분위기가 바뀌었다고 해요.
    ja: |-
      どれほど絶望的な戦場も、
      ひとたび勝利の翼号が姿を表せば
      空気が一変したと言われております。
  d_main_47_06_82:
    speaker: cielo
    en: Because the Goddess Squad was there.
    ko: 그곳에, 갓데스 스쿼드가 있었으니까.
    ja: |-
      ゴッデス部隊がそこにいることの
      象徴となっていたからです。
  d_main_47_06_83:
    speaker: cielo
    en: It is an honor to be aboard this legendary aircraft,
    ko: 그 전설의 함선에서,
    ja: そのような伝説の象徴である当機の上で…
  d_main_47_06_84:
    speaker: cielo
    en: accompanying the one who helped create that very legend.
    ko: 전설을 만들어낸 주인을 모실 수 있어 영광입니다.
    ja: |-
      伝説を生んだご本人をお迎えできたことは、
      たいへん光栄でございます。
  d_main_47_06_85:
    speaker: cielo
    en: It's as if the legend from that era has been revived. It's got my heart racing.
    ko: |-
      마치 그때의 전설이 되살아난 것 같아,
      너무 두근거리네요.
    ja: |-
      まさに当時の伝説の中にいるようで、
      私も胸が高鳴っております。
  d_main_47_06_86:
    speaker: cielo
    en: If there is anything you'd like, please don't hesitate to let us know.
    ko: 원하시는 것이 있다면, 부디 말씀해주세요.
    ja: |-
      ご希望がございましたら、
      なんでもお申し付けください。
  d_main_47_06_87:
    speaker: cielo
    en: Ah, I heard you enjoy tea. Would you like me to brew some for you?
    ko: 아, 차를 즐기신다고 들었어요. 한 잔 내드릴까요?
    ja: |-
      そういえば、
      お茶がお好きだとうかがっております。
      お淹れしましょうか？
  d_main_47_06_88:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_06_89:
    speaker: dorothy
    en: Do you have plum blossom tea?
    ko: 매화차. 있나요?
    ja: プラムティー。ありますか？
  d_main_47_06_90:
    speaker: cielo
    en: Of course. We have some aboard.
    ko: 그럼요. 준비되어 있답니다.
    ja: もちろん、ございます。
  d_main_47_06_91:
    speaker: dorothy
    en: I'll have that, please.
    ko: 그걸로 부탁드릴게요.
    ja: では、それを。
  d_main_47_06_92:
    speaker: cielo
    en: Certainly. I will brew it with the utmost care.
    ko: 알겠습니다. 정성스럽게 우려 대령하겠습니다.
    ja: |-
      かしこまりました。
      心を込めてお淹れいたします。
  d_main_47_06_93:
    speaker: dorothy
    en: Oh, not right now. I'll have it later, so just have it ready.
    ko: 아, 지금 말고요. 조금 이따가 마실테니 준비만 해줘요.
    ja: |-
      いえ、今すぐではありません。
      用意だけしておいてください。
  d_main_47_06_94:
    speaker: cielo
    en: "... Ah."
    ko: "…아."
    ja: "…はい。"
  d_main_47_06_95:
    speaker: dorothy
    en: "... Captain."
    ko: "…기장님."
    ja: "…機長。"
  d_main_47_06_96:
    speaker: sky
    en: Captain Sky, reporting in.
    ko: 기장 스카이. 여기 있습니다.
    ja: 機長スカイ、待機中。
  d_main_47_06_97:
    speaker: dorothy
    en: "..."
    ko: "……"
    ja: "……"
  d_main_47_06_98:
    speaker: dorothy
    en: Bring us as close to Annihilio as possible.
    ko: 애니힐리오에게 최대한 가까이 붙여줘요.
    ja: アニヒリオに可能な限り接近してください。
  d_main_47_06_99:
    speaker: dorothy
    en: I'll take it down myself.
    ko: 제가 떨어뜨릴테니.
    ja: 私が叩き落とします。
  d_main_47_06_100:
    speaker: sora
    en: "... ♥"
    ko: "……♥"
    ja: "……♥"
  d_main_47_06_101:
    speaker: sky
    en: Yes, ma'am.
    ko: 예스 맴.
    ja: イエス、マム！
  d_main_47_06_102:
    speaker: sky
    en: Wings of Victory. Full speed ahead. Approaching the Heretic Annihilio.
    ko: 승리의 날개 호. 전속 전진. 헬레틱 애니힐리오에게 접근합니다.
    ja: |-
      勝利の翼号、全速前進！
      ヘレティック・アニヒリオにアプローチ！
  d_main_47_06_103:
    speaker: cielo
    en: Please be careful, as we may experience some light turbulence.
    ko: 선내가 조금 흔들릴 수 있으니 주의해주세요.
    ja: 機内の揺れが予想されます。ご注意ください。
  d_main_47_06_104:
    speaker: "<Narration>"
    en: "*Whooooosh*"
    ko: 쿠우우우우---!!
    ja: ゴゴゴゴ――！！
  d_main_47_06_105:
    speaker: "<Narration>"
    en: The Wings of Victory tears through the sky as it surges forward.
    ko: 승리의 날개 호가 하늘을 가르며 전진한다.
    ja: 勝利の翼号が空を切り裂き突進する
  d_main_47_06_106:
    speaker: "<Narration>"
    en: Dorothy briefly gazes at the clouds rushing past the window, then rises from
      her seat.
    ko: |-
      도로시는 창 밖으로 빠르게 흘러가는 구름을 잠깐 바라본 후,
      자리에서 일어났다.
    ja: |-
      ドロシーは窓の外を高速で流れる雲を
      しばらく見つめ、立ち上がった
  d_main_47_06_107:
    speaker: "<Narration>"
    en: She deploys the expanded armament,
    ko: 확장 무장을 전개하고.
    ja: 拡張武装が展開され…
  d_main_47_06_108:
    speaker: "<Narration>"
    en: With her weapon in hand,
    ko: 총을 거머쥔 후.
    ja: 銃を手に握った
  d_main_47_06_109:
    speaker: "<Narration>"
    en: she walks out onto the deck.
    ko: 갑판으로 걸어나갔다.
    ja: そうして、デッキへと歩み出た
d_main_47_07:
  d_main_47_07_1:
    speaker: "<Narration>"
    en: The sky is dotted with explosions.
    ko: 하늘이 폭발로 물든다.
    ja: 空に爆発の衝撃が広がった
  d_main_47_07_2:
    speaker: "<Narration>"
    en: Dorothy watches as Annihilio plummets, engulfed in flames.
    ko: 도로시는 폭발하며 추락하는 애니힐리오를 바라본다.
    ja: |-
      ドロシーは爆発し墜落する
      アニヒリオを見すえた
  d_main_47_07_3:
    speaker: "<Narration>"
    en: The barrel of her gun remains trained on Annihilio.
    ko: 총구는 아직 애니힐리오를 겨누고 있다.
    ja: 銃口はアニヒリオに向けられたままだ
  d_main_47_07_4:
    speaker: sora_op_l
    en: Confirmed, Annihilio has been shot down! ★
    ko: 애니힐리오 격추 확인~★
    ja: アニヒリオの撃墜を確認～★
  d_main_47_07_5:
    speaker: sora_op_l
    en: Oh, she does have something resembling a core inside, so please be caref—
    ko: 아, 애니힐리오는 내부에 본체 비슷한 게 있으니 주의 부탁드-
    ja: |-
      あ、でも中身みたいなものがあるから
      まだ油断は…
  d_main_47_07_6:
    speaker: "<Narration>"
    en: Before Sora can finish speaking, Annihilio's core surges up through the flames.
    ko: 말이 끝나기가 무섭게 폭연을 뚫고 애니힐리오의 본체가 솟아오른다.
    ja: |-
      言い終わるより早く、
      爆煙からアニヒリオの「中身」が
      天に向かって伸びあがった
  d_main_47_07_7:
    speaker: "<Narration>"
    en: Without changing her aim, Dorothy pulls the trigger.
    ko: |-
      도로시는 겨누고 있던 총구의 방향을 조금도 틀지 않고,
      그대로 방아쇠를 당긴다.
    ja: |-
      ドロシーは銃口を動かすこともせず、
      引き金を引いた
  d_main_47_07_8:
    speaker: "<Narration>"
    en: A beam of light pierces straight through Annihilio's black core,
    ko: 빛이 애니힐리오의 검은색 코어를 꿰뚫고,
    ja: 光が漆黒のコアを貫いた
  d_main_47_07_9:
    speaker: "<Narration>"
    en: and it plummets to the ground in a fiery explosion.
    ko: 애니힐리오는 그대로 추락하며 폭발한다.
    ja: アニヒリオは何もできず墜落し、爆発した
  d_main_47_07_10:
    speaker: sora_op_l
    en: Amazing! ★
    ko: "…대단해★"
    ja: "…すごーい★"
  d_main_47_07_11:
    speaker: dorothy
    en: All clear.
    ko: 클리어.
    ja: クリア。
  d_main_47_07_12:
    speaker: andersen_op_r
    en: Your skills haven't dulled a bit.
    ko: 실력 어디 안 가는구만.
    ja: 腕は落ちていないな。
  d_main_47_07_13:
    speaker: dorothy
    en: It's just a missile with a few extra features tacked on.
    ko: 미사일에 이런저런 기능을 붙여놨을 뿐이니까요.
    ja: ミサイルに小細工がされただけのものです。
  d_main_47_07_14:
    speaker: dorothy
    en: It's hardly worthy of being called a Heretic.
    ko: 헬레틱이라 부르기엔 좀 민망한 수준이죠.
    ja: |-
      こんなもの、ヘレティックに数えるのも
      恥ずかしいでしょう。
  d_main_47_07_15:
    speaker: andersen_op_r
    en: That might change if dozens of them came at you all at once.
    ko: 수십개가 한번에 날아온다면 얘기는 달라지겠지.
    ja: |-
      何十発もまとめて飛んで来たら、
      話は変わるだろうがな。
  d_main_47_07_16:
    speaker: dorothy
    en: I suppose so.
    ko: 그렇겠죠.
    ja: そういうことですね。
  d_main_47_07_17:
    speaker: andersen_op_r
    en: Well, good work at any rate.
    ko: 뭐, 어쨌든 수고했다.
    ja: まあ、ひとまずご苦労だった。
  d_main_47_07_18:
    speaker: andersen_op_r
    en: I sent you out to get some fresh air. Who would've thought you'd end up in
      a battle.
    ko: 바람쐬라고 보내놨더니, 전투까지 해줄줄은 몰랐지 뭐야.
    ja: |-
      風に当たってこいとは言ったが、
      仕事を手伝ってくれるとはな。
  d_main_47_07_19:
    speaker: dorothy
    en: "... You certainly know how to spin things."
    ko: "…말은 잘 하시는군요."
    ja: "…口だけはお上手ですね。"
  d_main_47_07_20:
    speaker: andersen_op_r
    en: Well, I've got to make it sound good somehow, don't I?
    ko: 뭐 말이라도 잘 해야하지 않겠어?
    ja: それぐらいはできないと、だろう？
  d_main_47_07_21:
    speaker: andersen_op_r
    en: So, how does it feel to have a successful debut under your belt?
    ko: 그래서, 데뷔전을 성공적으로 치른 소감은 어떻지?
    ja: で、デビュー戦がうまくいった感想は？
  d_main_47_07_22:
    speaker: dorothy
    en: What are you talking about?
    ko: 데뷔전이라니. 무슨 말이죠?
    ja: デビュー戦？何の話です。
  d_main_47_07_23:
    speaker: andersen_op_r
    en: What else? I'm talking about your debut as the vanguard of the Third Surface
      Reclamation War.
    ko: 뭐긴 뭐야. 3차 지상 탈환전의 선봉으로서의 데뷔전이지.
    ja: |-
      第三次地上奪還戦、
      切り込み隊長としてのデビュー戦だ。
  d_main_47_07_24:
    speaker: dorothy
    en: I never agreed to that.
    ko: 한다고 얘기한 적 없다고요.
    ja: やるとは言っていませんよ。
  d_main_47_07_25:
    speaker: andersen_op_r
    en: It seems others see it differently.
    ko: 사람들 생각은 다른 것 같은데.
    ja: みんなはそう思ってないみたいだぞ？
  d_main_47_07_26:
    speaker: dorothy
    en: "... What are you talking about?"
    ko: "…뭐라고요?"
    ja: "…誰のことです？"
  d_main_47_07_27:
    speaker: andersen_op_r
    en: Oh, did I not mention it?
    ko: 아, 내가 얘기 안 했나?
    ja: あ、話していなかったか？
  d_main_47_07_28:
    speaker: andersen_op_r
    en: This battle is being broadcast live to the Ark.
    ko: 이 전투, 방주에 생중계되고 있었다.
    ja: 今の戦闘、アークで生中継されてたんだ。
  d_main_47_07_29:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_47_07_30:
    speaker: andersen_op_r
    en: Everyone in the Ark witnessed your heroics firsthand.
    ko: 도로시 아가씨의 활약상을 방주 시민들이 빠짐없이 다 봤다는 얘기지.
    ja: |-
      君の活躍をアークの人々が
      しっかり見届けたということだ。
  d_main_47_07_31:
    speaker: andersen_op_r
    en: Dorothy, the leader of the Goddess Squad, aboard the Wings of Victory.
    ko: 승리의 날개 호를 탄 갓데스 스쿼드의 리더 도로시가.
    ja: |-
      ゴッデス部隊のリーダー、
      ドロシーが勝利の翼号に搭乗し…
  d_main_47_07_32:
    speaker: andersen_op_r
    en: Striking down Heretics, humanity's greatest enemy.
    ko: 인류의 숙적인 헬레틱을 때려잡는 모습.
    ja: 人類の宿敵、ヘレティックを打ち倒す。
  d_main_47_07_33:
    speaker: andersen_op_r
    en: It was such a magnificent sight, I couldn't resist showing it off.
    ko: 너무 좋은 그림이라 자랑 안 하고는 못 베기겠더라고.
    ja: |-
      つい自慢せずにはいられないほど
      いいシーンだったからなぁ。
  d_main_47_07_34:
    speaker: andersen_op_r
    en: It caused quite a stir. Want me to play back the cheers for you?
    ko: 난리가 났다 아주. 함성 소리 들려줄까?
    ja: ものすごい騒ぎだぞ。聞いてみるか？
  d_main_47_07_35:
    speaker: dorothy
    en: No, thank you. You've grown quite cunning in your old age.
    ko: 됐어요. 나이를 먹더니 교활해 지셨군요.
    ja: |-
      結構です。
      年を取って悪知恵が働くようになりましたね。
  d_main_47_07_36:
    speaker: andersen_op_r
    en: Please, it's painful enough being old without being reminded.
    ko: 나이 얘기 꺼내기야? 늙은 것도 서러운데.
    ja: |-
      年の話はしないでくれるか？
      こっちも気にしてるんだ。
  d_main_47_07_37:
    speaker: andersen_op_r
    en: Anyway, you can't back out now. You have to lead the charge.
    ko: 아무튼 너 이제 그만 못 해. 선봉 해야 해.
    ja: |-
      とにかく、後に引けなくなったな。
      もう前に立つしかない。
  d_main_47_07_38:
    speaker: andersen_op_r
    en: After all this, that'd be rather poor form, don't you think?
    ko: 이렇게까지 해놓고 발을 빼는 건 솔직히 아니지 않나?
    ja: ここまでやって、抜けられやしないだろう？
  d_main_47_07_39:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_40:
    speaker: dorothy
    en: "*Sigh*"
    ko: "…하아."
    ja: "…はぁ…"
  d_main_47_07_41:
    speaker: dorothy
    en: Fine. I'll do it.
    ko: 그래요. 할게요.
    ja: いいでしょう。やって差し上げます。
  d_main_47_07_42:
    speaker: andersen_op_r
    en: Oh?
    ko: "…오."
    ja: "…ふ…"
  d_main_47_07_43:
    speaker: dorothy
    en: I'll lead the Third Surface Reclamation War.
    ko: 3차 지상 탈환전의 선봉이 될게요.
    ja: 私が先頭に立ちます。
  d_main_47_07_44:
    speaker: andersen_op_r
    en: Haha.
    ko: 흐핫.
    ja: はは…
  d_main_47_07_45:
    speaker: andersen_op_r
    en: As expected, you haven't changed a bit.
    ko: 역시 너는 변하지 않았어.
    ja: やはり、君はちっとも変わっていない。
  d_main_47_07_46:
    speaker: andersen_op_r
    en: There's the Dorothy I remember.
    ko: 내가 아는 도로시 그대로다.
    ja: 私が知るドロシーのままだ。
  d_main_47_07_47:
    speaker: dorothy
    en: "... Hmph."
    ko: "…흥."
    ja: "…フン…"
  d_main_47_07_48:
    speaker: "<Narration>"
    en: "*Rumble, rumble*"
    ko: 드르르륵-
    ja: カラカラカラ――
  d_main_47_07_49:
    speaker: "<Narration>"
    en: The sound of wheels rolling echoes across the deck. Dorothy turns toward the
      source of the noise.
    ko: |-
      갑판에 바퀴가 구르는 소리가 들려온다.
      도로시는 소리가 들려온 곳을 바라본다.
    ja: |-
      車輪の転がる音がした。
      ドロシーは音のする方に顔を向けた
  d_main_47_07_50:
    speaker: "<Narration>"
    en: Sora and Cielo are pushing a trolley over, on it rests an elegantly designed
      teacup.
    ko: |-
      소라와 시엘로가 트롤리를 끌고 온다.
      트롤리에는 고풍스러운 디자인의 찻잔이 올려져있다.
    ja: |-
      ソラとシエロがティーワゴンを引いていた。
      ワゴンには上品なデザインの
      ティーセットが乗っている
  d_main_47_07_51:
    speaker: sora
    en: Your plum blossom tea, as requested. ♥
    ko: 요청하신 매화차 대령입니다~♥
    ja: ご注文のプラムティーでございま～す♥
  d_main_47_07_52:
    speaker: cielo
    en: The wind is quite strong here, so I'm afraid the tea may cool too quickly.
      Please enjoy it while it's still hot.
    ko: |-
      바람이 강해서 식을까 우려되니,
      빠르게 시음 부탁드립니다.
    ja: |-
      風が強いですので、冷めないよう
      早めにお召し上がりください。
  d_main_47_07_53:
    speaker: dorothy
    en: "... I'll go inside to drink it."
    ko: "…들어가서 마실게요."
    ja: "…中でいただきます。"
  d_main_47_07_54:
    speaker: "<Narration>"
    en: In Burningum's office.
    ko: 버닝엄의 사무실.
    ja: バーニンガムの執務室
  d_main_47_07_55:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_56:
    speaker: "<Narration>"
    en: Burningum stares blankly into space.
    ko: 버닝엄은 멍하니 허공을 바라보고 있었다.
    ja: バーニンガムが虚空を見上げていた
  d_main_47_07_57:
    speaker: "<Narration>"
    en: He reaches out and presses the button on the machine before him.
    ko: 손을 뻗어 앞에 놓인 기계의 버튼을 누른다.
    ja: |-
      腕が動き、目の前に置かれた
      装置のボタンを押した
  d_main_47_07_58:
    speaker: dorothy
    en: Fine. I'll do it.
    ko: 그래요. 할게요.
    ja: いいでしょう。やって差し上げます。
  d_main_47_07_59:
    speaker: dorothy
    en: I'll lead the Third Surface Reclamation War.
    ko: 3차 지상 탈환전의 선봉이 될게요.
    ja: 私が先頭に立ちます。
  d_main_47_07_60:
    speaker: "<Narration>"
    en: Burningum continues staring vacantly.
    ko: 버닝엄은 다시 한번 멍하니 허공을 바라본다.
    ja: バーニンガムは恍惚としている
  d_main_47_07_61:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_62:
    speaker: "<Narration>"
    en: He reaches out and presses the button again.
    ko: 다시 한 번 손을 뻗어 버튼을 누른다.
    ja: また手がボタンに伸びた
  d_main_47_07_63:
    speaker: dorothy
    en: Fine. I'll do it.
    ko: 그래요. 할게요.
    ja: いいでしょう。やって差し上げます。
  d_main_47_07_64:
    speaker: dorothy
    en: I'll lead the Third Surface Reclamation War.
    ko: 3차 지상 탈환전의 선봉이 될게요.
    ja: 私が先頭に立ちます。
  d_main_47_07_65:
    speaker: "<Narration>"
    en: He falls into a daze again.
    ko: 다시 멍해진다.
    ja: また虚空を見上げた
  d_main_47_07_66:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_67:
    speaker: "<Narration>"
    en: A moment later...
    ko: 그리고 잠시 후.
    ja: しばらくそうしていた後…
  d_main_47_07_68:
    speaker: burningum
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_47_07_69:
    speaker: "<Narration>"
    en: Burningum clenches his fist.
    ko: 버닝엄은 주먹을 불끈 쥔다.
    ja: バーニンガムはこぶしを握り締めた
  d_main_47_07_70:
    speaker: "<Narration>"
    en: He silently cheers in triumph.
    ko: 소리 없는 환호성을 내지른다.
    ja: 声にこそ出さないが、全身が歓喜を表現している
  d_main_47_07_71:
    speaker: "<Narration>"
    en: His quiet jubilation continues until Enikk contacts him.
    ko: 그 조용한 열광은, 에닉에게서 연락이 올 때까지 계속됐다.
    ja: |-
      静かなる熱狂は、
      エニックの連絡が来るまで続いた
  d_main_47_07_72:
    speaker: burningum
    en: Enikk. Give me an update.
    ko: 에닉. 현재 진행 상황에 대해 알려줘.
    ja: エニックか、報告を聞かせてもらおう。
  d_main_47_07_73:
    speaker: enikk_op_l
    en: Preparations for the Third Surface Reclamation War are proceeding smoothly.
    ko: 3차 지상 탈환전의 준비는 매우 순조롭게 진행 중입니다.
    ja: |-
      第三次地上奪還戦の準備は
      遅滞なく進行しています。
  d_main_47_07_74:
    speaker: enikk_op_l
    en: Public sentiment has stabilized thanks to the large-scale relay concert series
      that kicked off with T.T. STAR.
    ko: 민심의 경우, T.T. STAR를 시작으로 개최한 대규모 릴레이 콘서트를 통해 안정권에 접어들었습니다.
    ja: |-
      市民感情については、
      T.T. STARをはじめとする大規模な
      リレーコンサートの開催以降、安定しています。
  d_main_47_07_75:
    speaker: enikk_op_l
    en: During the concert, Mustang made continuous remarks hinting at the surface
      reclamation war, which naturally spread throughout the Ark.
    ko: 콘서트 중, 머스탱 CEO의 지상 탈환을 암시하는 듯 한 지속적 발언이 자연스럽게 방주 전역으로 확장.
    ja: |-
      マスタングCEOはコンサート中に
      地上奪還の気運を高めるメッセージを
      アーク全域に浸透させており…
  d_main_47_07_76:
    speaker: enikk_op_l
    en: We have determined that the Ark will not descend into chaos whenever the Third
      Surface Reclamation War is officially declared.
    ko: 3차 지상 탈환전을 언제 선포하더라도 방주가 혼란에 빠지는 일은 없을 것이라 판단합니다.
    ja: |-
      第三次地上奪還戦がいつ布告されても
      アークに混乱は発生しないものと
      予想されます。
  d_main_47_07_77:
    speaker: enikk_op_l
    en: The strategy of using entertainment to dilute the fear associated with war...
    ko: 전쟁이라는 두려운 행위를 엔터테인먼트를 통해 희석시키는 방식은
    ja: |-
      戦争という恐るべき行為を
      娯楽で緩和するという手法は…
  d_main_47_07_78:
    speaker: enikk_op_l
    en: That's something I would like to learn from as well.
    ko: 저도 학습하고 싶을 정도입니다.
    ja: 有用な学習データになると考えています。
  d_main_47_07_79:
    speaker: enikk_op_l
    en: There were three major issues concerning the Ark, all of which are now being
      addressed in sequence.
    ko: 방주의 경우 크게 3가지의 중대 문제가 있었으나, 해당 부분도 순차적으로 해결되고 있습니다.
    ja: |-
      その他、現在のアークにおける
      3点の主要な問題については、
      順次解決が進行しています。
  d_main_47_07_80:
    speaker: enikk_op_l
    en: Firstly, the Ark's levitation function.
    ko: 첫 번째. 방주의 부상 기능.
    ja: 1点目、アークの浮上計画については…
  d_main_47_07_81:
    speaker: enikk_op_l
    en: Thanks to continuous maintenance by Missilis Industry, we have determined
      that this function will operate without issue.
    ko: 미실리스 인더스트리의 지속적인 관리 덕에 해당 기능은 문제 없이 작동할 것이라 판단합니다.
    ja: |-
      ミシリス・インダストリーによる
      継続的な管理が行き届いており、
      問題なく機能すると見られます。
  d_main_47_07_82:
    speaker: enikk_op_l
    en: The Ark is a city built atop a massive lift. Raising the city itself requires
      an enormous amount of power.
    ko: |-
      방주는 거대 리프트 위에 지어진 도시입니다.
      도시 자체를 들어올려야 하기에 막대한 전력이 필요합니다.
    ja: |-
      ただし、アーク全体の基盤である
      巨大リフトを上昇させるためには
      膨大なエネルギーが必要となります。
  d_main_47_07_83:
    speaker: enikk_op_l
    en: At present, the Ark's power source is currently operating at drastically reduced
      output, leaving insufficient power to operate the lift.
    ko: |-
      현재 방주 동력원의 출력이 급감해있는 상태라,
      리프트를 가동할 전력이 확보되지 않습니다.
    ja: |-
      現在はエネルギー源の出力が急減した影響で
      リフトを稼働させるための電力が
      確保されていません。
  d_main_47_07_84:
    speaker: enikk_op_l
    en: I assess that this issue can be resolved with the assistance of the Electric
      Shock Squad, along with Endless and Eternity.
    ko: 해당 부분은 일렉트릭 쇼크 스쿼드와 엔드리스 및 이터니티를 통해 해결할 수 있을 것이라 판단합니다.
    ja: |-
      この問題は、エレクトリックショック部隊
      および、エンドレス、エタニティを利用して
      解決できる見込みです。
  d_main_47_07_85:
    speaker: enikk_op_l
    en: Secondly, the Ark's infrastructure.
    ko: 두 번째. 방주의 시설.
    ja: 2点目は、アーク内の各種施設です。
  d_main_47_07_86:
    speaker: enikk_op_l
    en: The Ark has undergone significant expansions since its original construction.
    ko: 방주는 건축 당시에 비해 현재 너무 많은 확장이 이뤄진 상태입니다.
    ja: |-
      アークは建築時と比較して、
      相当な拡張が進んでいます。
  d_main_47_07_87:
    speaker: enikk_op_l
    en: I've determined that all such additions must be dismantled to ensure the smooth
      operation of the lift.
    ko: 해당 부분을 모두 폐기해야 리프트의 작동이 원활하게 이뤄질 것이라 판단.
    ja: |-
      リフトの円滑な機能のために、
      これらの部分は放棄する必要があります。
  d_main_47_07_88:
    speaker: enikk_op_l
    en: Dismantling is currently underway with the support of the Mighty Tools and
      Hammer & Drill Squads.
    ko: 현재 마이티 툴즈 및 해머&드릴 스쿼드의 지원으로 철거를 진행하고 있습니다.
    ja: |-
      現在はマイティツールズ、
      ハンマー＆ドリル部隊の協力のもと、
      撤去作業が進行中です。
  d_main_47_07_89:
    speaker: enikk_op_l
    en: Citizens who lose their homes or workplaces in this process are being supported
      with temporary housing and employment provided by the Central Government.
    ko: 해당 과정에서 주거지나 직장을 잃은 시민들은 중앙 정부에서 제공한 임시 숙소와 일자리로 해결하고 있습니다.
    ja: |-
      この影響で住居や職場を失う市民については、
      中央政府が仮の宿所提供や
      職務の紹介を行っています。
  d_main_47_07_90:
    speaker: enikk_op_l
    en: Furthermore, the Dome of Eternity and all elevators must be dismantled prior
      to the Ark's ascent.
    ko: 또한 방주 부상 시 이터널 스카이 및 모든 엘리베이터는 철거해야 합니다.
    ja: |-
      また、アーク浮上に先がけて、
      エターナルスカイとすべてのエレベーターを
      撤去する必要が発生します。
  d_main_47_07_91:
    speaker: enikk_op_l
    en: Due to the exceedingly high risk of accidents caused by the impact during
      ascent, dismantling is mandatory.
    ko: 부상시의 충격으로 사고가 일어날 확률이 너무 높기에 철거는 필수 사항입니다.
    ja: |-
      浮上時の衝撃による事故防止のため、
      これ以外の解決法は存在しません。
  d_main_47_07_92:
    speaker: enikk_op_l
    en: Elevators are being dismantled in sequence, starting with those with the lowest
      usage, and the Dome of Eternity is scheduled to be dismantled immediately before
      the Ark's ascent.
    ko: |-
      엘리베이터는 사용량이 낮은순으로 순차적으로 철거 중이며,
      이터널 스카이는 방주 부상 직전에 철거 예정입니다.
    ja: |-
      エレベーターは使用頻度の低いものから
      撤去を開始しており、エターナルスカイは
      浮上直前に作業を行う予定です。
  d_main_47_07_93:
    speaker: enikk_op_l
    en: During the Ark's ascent, all citizens will be required to enter the evacuation
      shelters.
    ko: 방주 부상 시 모든 시민들은 피난용 쉘터에 모두 입장하게 됩니다.
    ja: |-
      浮上開始前には、すべての市民を
      専用のシェルターに避難させます。
  d_main_47_07_94:
    speaker: enikk_op_l
    en: To prevent accidents, citizens will be advised not to remain at home or in
      designated areas.
    ko: 사고 방지를 위해, 자택 및 특정 지역에서 머무는 것은 권장하지 않습니다.
    ja: |-
      事故防止のため、
      一般の住宅や特定の区域などに
      市民を留まらせることは推奨しません。
  d_main_47_07_95:
    speaker: burningum
    en: Hmm... So when the Ark ascends, all of the Ark's infrastructure will go offline.
    ko: 음… 방주 부상 시, 방주의 모든 인프라가 멈추겠군.
    ja: |-
      ふむ…アーク浮上の前後には、
      全てのインフラが止まるということだな。
  d_main_47_07_96:
    speaker: enikk_op_l
    en: That is correct. While preventing accidents is also a consideration, it is
      also because we must conserve as much power as possible.
    ko: 그렇습니다. 사고를 방지하는 의도도 있습니다만, 전력을 조금이라도 아껴야 하기 때문입니다.
    ja: |-
      その通りです。
      事故防止としての側面のほか、
      消費電力抑制の目的もあります。
  d_main_47_07_97:
    speaker: burningum
    en: "... Understood. What is the third issue, then?"
    ko: "…알겠어. 그럼 세 번째 문제는 뭐지?"
    ja: "…分かった。それで、3点目の問題は？"
  d_main_47_07_98:
    speaker: enikk_op_l
    en: The Outer Rim.
    ko: 아우터 림입니다.
    ja: アウターリムです。
  d_main_47_07_99:
    speaker: enikk_op_l
    en: The Outer Rim is located on the periphery of the Ark.
    ko: 아우터 림은 방주의 외곽에 위치하고 있습니다.
    ja: アーク外縁部に位置するアウターリムは…
  d_main_47_07_100:
    speaker: enikk_op_l
    en: This area is expected to face the highest level of risk upon the Ark's ascent.
    ko: 방주 부상 시, 위험도가 가장 높은 지역입니다.
    ja: |-
      アークの浮上に際し、
      危険度が最も高い区域となります。
  d_main_47_07_101:
    speaker: enikk_op_l
    en: Most of the Outer Rim's infrastructure will be destroyed, and it is highly
      likely that the majority of its human inhabitants will perish.
    ko: 아우터 림 대부분의 인프라가 파괴될 것이며, 거주 중인 인간 대부분이 목숨을 잃을 가능성이 높습니다.
    ja: |-
      アウターリムの生活基盤は大半が崩壊し、
      居住者の大部分が死亡するものと
      予想されています。
  d_main_47_07_102:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_103:
    speaker: burningum
    en: We can't just abandon them all.
    ko: 그들을 모두 버릴 순 없어.
    ja: 全部見捨てるとは言うまいな。
  d_main_47_07_104:
    speaker: enikk_op_l
    en: The Outer Rim is not part of the Ark, and its inhabitants are not citizens
      of the Ark.
    ko: 아우터 림은 방주가 아니며, 아우터 림의 인간은 방주의 시민이 아닙니다.
    ja: |-
      アウターリムはアークではなく、
      アウターリムの居住者は
      アーク市民ではありません。
  d_main_47_07_105:
    speaker: enikk_op_l
    en: We cannot afford to waste resources on protecting the people of the Outer
      Rim.
    ko: 아우터 림의 인간을 지키기 위해 리소스를 낭비할 수 없습니다.
    ja: |-
      アウターリム居住者の保護に
      資源を割くことは、
      浪費とみなすことができます。
  d_main_47_07_106:
    speaker: enikk_op_l
    en: That was my initial assessment.
    ko: "-가 저의 초기 판단이었으나"
    ja: "…少なくとも、それが初期の私の判断です。"
  d_main_47_07_107:
    speaker: enikk_op_l
    en: However, with the support of Ingrid, the CEO of Elysion, a large number of
      shelters are currently being prepared.
    ko: 엘리시온의 CEO 잉그리드의 지원으로 대량의 쉘터가 준비중입니다.
    ja: |-
      しかし、この件についてはエリシオン社、
      イングリッドCEOによる支援のもと、
      大規模シェルターの準備が進められています。
  d_main_47_07_108:
    speaker: enikk_op_l
    en: There should be no issue accommodating the estimated total population of the
      Outer Rim, which was provided by E.H.
    ko: 통칭 E.H.가 제공한 아우터 림의 예상 총인구수를 수납하기에 문제가 없습니다.
    ja: |-
      通称E.H.から提供されたデータによる
      アウターリムの予想総人口に基づく限り、
      居住者全員の収容が可能な見込みです。
  d_main_47_07_109:
    speaker: enikk_op_l
    en: At least, that is the case in theory.
    ko: 이론상으로는 그렇습니다.
    ja: 理論上は、という前提ですが。
  d_main_47_07_110:
    speaker: burningum
    en: The question is whether those in the Outer Rim will actually accept this.
    ko: 아우터 림의 사람들이 과연 그 일을 받아들일지가 문제겠군.
    ja: |-
      アウターリムの人間が
      そんな話を素直に聞くか、ということだな。
  d_main_47_07_111:
    speaker: enikk_op_l
    en: That is correct. They currently believe this to be a purge of the Outer Rim
      carried out by the Ark.
    ko: 그렇습니다. 방주의 아우터 림 청소로 오해하고 있는 상태입니다.
    ja: |-
      正しい推測です。
      アウターリムの撤去を狙った
      強制退去だという誤解があるようです。
  d_main_47_07_112:
    speaker: burningum
    en: I can see why they would think that.
    ko: 이해가 안가는 부분은 아니야.
    ja: 理解できない心情ではない。
  d_main_47_07_113:
    speaker: burningum
    en: They were treated as less than human until recently. It's only natural they'd
      be suspicious when they're suddenly told to move into shelters in the Ark.
    ko: 얼마전까지 사람 취급도 못 받던 이들에게, 방주에 쉘터를 준비해줄테니 그곳으로 이동하라니 의심스러울만 해.
    ja: |-
      少し前まで人間扱いすらされていなかった。
      それが急にシェルターへ避難させるなどと
      言われれば、当然の反応だ。
  d_main_47_07_114:
    speaker: burningum
    en: Having the Central Government intervene would only make matters worse. We
      have no choice but to entrust this entirely to Ingrid and E.H.
    ko: 이 부분은 중앙 정부가 적극적으로 나서면 더욱 독이 될 것 같으니, 잉그리드와 E.H.에게 전적으로 맡길 수밖에 없겠군.
    ja: |-
      中央政府が動くほど、余計に話がこじれる。
      イングリッドとE.H.に
      一任するほかないだろう。
  d_main_47_07_115:
    speaker: enikk_op_l
    en: Yes. Currently, the Exotic Squad and Underworld Queen Squad are utilizing
      intimidation and force to coerce the inhabitants of the Outer Rim...
    ko: 예. 현재 이그조틱 스쿼드, 언더월드 퀸 스쿼드를 필두로 아우터 림의 인간들에게 협박과 무력을 동원하여-
    ja: |-
      同じ見解です。現在、エキゾチック部隊、
      アンダーワールドクイーン部隊を筆頭として
      アウターリムの居住者に対する脅迫…
  d_main_47_07_116:
    speaker: enikk_op_l
    en: 'Correction: coaxing them through persuasion. Things are progressing smoothly,
      and we have shown significant success.'
    ko: |-
      정정, 설득을 통해 회유 중입니다.
      달성률 및 진행도가 순조롭습니다.
    ja: |-
      訂正、懐柔工作を進めています。
      達成率および進行度は順調です。
  d_main_47_07_117:
    speaker: burningum
    en: Good. Any other issues?
    ko: 좋아. 그 외의 문제는?
    ja: そうか。他に問題は？
  d_main_47_07_118:
    speaker: enikk_op_l
    en: Presently, there are no other issues that would directly affect the Ark's
      ascent.
    ko: 현재로서는 이외에 방주 부상에 직접적으로 영향을 주는 문제는 없습니다.
    ja: |-
      アークの浮上に関して、
      直接影響を及ぼす諸問題は
      現在のところ、他にありません。
  d_main_47_07_119:
    speaker: burningum
    en: All right. Proceed as planned.
    ko: 그래. 잘 진행해줘.
    ja: 分かった。そのまま進めてくれ。
  d_main_47_07_120:
    speaker: andersen
    en: Let us move on to the next matter.
    ko: 그럼 다음 이야기로 넘어가지.
    ja: では、次の議題だ。
  d_main_47_07_121:
    speaker: andersen
    en: It's certain that a massive swarm of Raptures will converge on us after the
      Ark's ascent.
    ko: 방주 부상 후, 대량의 랩쳐들이 몰려올 것은 확정이겠지.
    ja: |-
      アークが浮上すれば、
      確実に大量のラプチャーが
      押し寄せてくる。
  d_main_47_07_122:
    speaker: enikk_op_l
    en: Correct. That is certain.
    ko: 그렇습니다. 확정입니다.
    ja: はい、確定事項と考えてよいでしょう。
  d_main_47_07_123:
    speaker: andersen
    en: The Queen will come to finish us off herself.
    ko: 퀸이 직접 끝내러 올테고.
    ja: クイーンも直接乗り込んでくるだろうな。
  d_main_47_07_124:
    speaker: enikk_op_l
    en: Correct. That is certain.
    ko: 그렇습니다. 확정입니다.
    ja: はい、それも確定事項と考えてよいでしょう。
  d_main_47_07_125:
    speaker: andersen
    en: What are our chances?
    ko: 승산은?
    ja: 勝算は？
  d_main_47_07_126:
    speaker: enikk_op_l
    en: I did not expect to give such an uncertain assessment,
    ko: 제가 이런 애매한 답변을 하게 될 줄은 몰랐으나.
    ja: |-
      私にこれほど不透明な回答を行う能力が
      あるとは思っていませんでしたが…
  d_main_47_07_127:
    speaker: enikk_op_l
    en: but we have a fighting chance.
    ko: 할만합니다.
    ja: やる価値は十分にあると考えます。
  d_main_47_07_128:
    speaker: andersen
    en: Oh?
    ko: 호오.
    ja: ほう。
  d_main_47_07_129:
    speaker: enikk_op_l
    en: The Ark's military strength is currently at its peak since its establishment.
    ko: 방주의 힘은 방주 설립 이후 최고의 전성기 상태입니다.
    ja: |-
      現在のアークの実力は
      史上最高の状態にあります。
  d_main_47_07_130:
    speaker: enikk_op_l
    en: Despite the Raptures' overwhelming numerical superiority, the Ark possesses
      several means to overcome this disadvantage.
    ko: |-
      랩쳐들과의 수적 차이가 상당하지만,
      수적 열세를 뒤집을 만한 수단이 방주에는 몇이나 있습니다.
    ja: |-
      ラプチャーに対する数的劣勢は事実ですが、
      アークはそれを覆す多数の手段を有しています。
  d_main_47_07_131:
    speaker: enikk_op_l
    en: The alliance with the Four Beasts, including Eden, is also promising.
    ko: 에덴을 비롯한 포비스트의 아군화 역시 고무적입니다.
    ja: |-
      外部勢力のエデンおよびフォービーストも、
      友軍として期待できる情勢です。
  d_main_47_07_132:
    speaker: enikk_op_l
    en: The crucial factor now lies in how few casualties we can sustain while securing
      victory against the Raptures' elite forces.
    ko: 주요점은, 랩쳐 측의 정예들을 상대로 얼마나 적은 피해를 입으며 승리하느냐에 달려있습니다.
    ja: |-
      戦略的急所は、ラプチャー側の精鋭に対し、
      どこまで損害を抑えて
      勝利できるかになるでしょう。
  d_main_47_07_133:
    speaker: enikk_op_l
    en: Among them, the greatest threat will undoubtedly be the Queen, who has taken
      control of Liliweiss's body.
    ko: 그 중 가장 경계해야 할 대상은 릴리바이스의 바디를 강탈한 퀸이 되겠죠.
    ja: |-
      なかでも、最も警戒が必要となる敵は、
      リリーバイスのボディを
      奪取したクイーンです。
  d_main_47_07_134:
    speaker: enikk_op_l
    en: While Liliweiss's body is undoubtedly the strongest of its kind, there is
      an undeniable limit to its usage.
    ko: 릴리바이스의 바디는 최강이라 불리기에 부족함이 없었지만, 활동 시간의 한계가 명확했습니다.
    ja: |-
      かつて最強と呼ばれた存在にふさわしく、
      特筆すべき弱点と言えるものは
      活動時間の限界以外にありません。
  d_main_47_07_135:
    speaker: enikk_op_l
    en: If that limit is surpassed, the outcome of this battle becomes uncertain.
    ko: 그 한계를 초월한 상태라면, 승리 여부는 불투명합니다.
    ja: |-
      稼働限界を超えて戦闘できる前提になれば、
      勝敗の見込みはますます不透明になります。
  d_main_47_07_136:
    speaker: andersen
    en: There is no need for such concerns.
    ko: 그건 걱정할 필요 없네.
    ja: それについては心配無用だ。
  d_main_47_07_137:
    speaker: andersen
    en: We will emerge victorious.
    ko: 반드시 이길테니.
    ja: 必ず勝つ。
  d_main_47_07_138:
    speaker: enikk_op_l
    en: Yes. I will trust your judgment.
    ko: 예. 믿겠습니다.
    ja: では、その言葉を信用しましょう。
  d_main_47_07_139:
    speaker: burningum
    en: What happens after the Ark ascends?
    ko: 방주 부상 이후엔 어떻게 되는거지?
    ja: アークが浮上できたとして、その後の展開は？
  d_main_47_07_140:
    speaker: enikk_op_l
    en: We will deploy large-scale optical camouflage.
    ko: 대규모의 광학미채를 전개합니다.
    ja: 大規模な光学迷彩を展開します。
  d_main_47_07_141:
    speaker: enikk_op_l
    en: It will shield the entire Ark and distort the Raptures' perception.
    ko: 랩쳐의 인지를 뒤틀어 방주 전체를 보호합니다.
    ja: |-
      ラプチャーの認識能力に作用する機能があり、
      アーク全体を保護することが可能です。
  d_main_47_07_142:
    speaker: andersen
    en: Which is precisely why we must eliminate the Raptures' elite forces.
    ko: "…랩쳐의 정예를 다 잡아야 하는 이유이기도 하지."
    ja: |-
      …つまり、ラプチャーの精鋭どもを
      残らず始末する必要が出るわけだな。
  d_main_47_07_143:
    speaker: andersen
    en: If they possess intelligence, they will remember our location regardless of
      whether we conceal ourselves with optical camouflage.
    ko: 지성이 있는 것들이라면 광학미채로 숨기든 어쨌든 위치 자체는 기억하고 있을테니 말일세.
    ja: |-
      知性を持っている奴なら、
      光学迷彩で隠したところで
      すでに位置は把握されているだろう。
  d_main_47_07_144:
    speaker: enikk_op_l
    en: That is correct.
    ko: 그렇습니다.
    ja: その通りです。
  d_main_47_07_145:
    speaker: andersen
    en: "... All right. When can we execute the plan?"
    ko: "…좋아. 언제 실행 가능하지?"
    ja: "…それで、いつから実行に移せる？"
  d_main_47_07_146:
    speaker: enikk_op_l
    en: If we expedite the process, we can be ready in three days. If we make thorough
      preparations, it will be possible in two weeks.
    ko: 서두른다면 3일 뒤, 철저히 준비를 한다면 2주 뒤 가능합니다.
    ja: |-
      最短で3日後、
      徹底した準備を行うのであれば、
      2週間後です。
  d_main_47_07_147:
    speaker: andersen
    en: That's quick.
    ko: 빠르군.
    ja: 早いな。
  d_main_47_07_148:
    speaker: enikk_op_l
    en: It is only possible because this is a one-time defensive operation.
    ko: 일회성 방위전이라 가능한 일입니다.
    ja: 防衛戦の発生は1度限りという想定です。
  d_main_47_07_149:
    speaker: andersen
    en: Good. Continue with the preparations.
    ko: 좋아. 계속 준비해주게.
    ja: 分かった。そのまま準備を続けてくれ。
  d_main_47_07_150:
    speaker: enikk_op_l
    en: Understood.
    ko: 예.
    ja: 了解しました。
  d_main_47_07_151:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_152:
    speaker: burningum
    en: Once the Ark has ascended and all attacks have been repelled...
    ko: 방주가 올라가고, 모든 공격을 막아낸 이후에는.
    ja: |-
      アークが地上に出て、
      その防衛戦にも成功したとして…
  d_main_47_07_153:
    speaker: burningum
    en: What will become of the Ark?
    ko: 방주는 어떻게 되는거지?
    ja: アークはそれからどうなる？
  d_main_47_07_154:
    speaker: enikk_op_l
    en: That remains uncertain.
    ko: 모르겠습니다.
    ja: 計算不能です。
  d_main_47_07_155:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_156:
    speaker: enikk_op_l
    en: This is uncharted territory, even for me.
    ko: 저에게 있어서도 아득한 미지의 영역입니다.
    ja: 私にとってもはるかな未知の領域です。
  d_main_47_07_157:
    speaker: enikk_op_l
    en: All possibilities remain open.
    ko: 모든 선택지가 열려있습니다.
    ja: 考えられる選択も無数に存在します。
  d_main_47_07_158:
    speaker: enikk_op_l
    en: Therefore, it cannot be predicted.
    ko: 그렇기에 예상할 수 없습니다.
    ja: 予想不能、それ以上の回答は不可能です。
  d_main_47_07_159:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_160:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_161:
    speaker: burningum
    en: I see. Ascending to the surface won't be the end of things, will it?
    ko: 그래. 올라간다고 끝이 아니겠지.
    ja: |-
      まあ…めでたしめでたし、
      とはいかないだろうな。
  d_main_47_07_162:
    speaker: andersen
    en: But doesn't it excite you?
    ko: 하지만 두근거리지 않나.
    ja: だが、胸が高鳴ってこないか？
  d_main_47_07_163:
    speaker: burningum
    en: "... Excitement, huh."
    ko: "…두근거린다라."
    ja: "…ああ、高鳴るな。"
  d_main_47_07_164:
    speaker: andersen
    en: Yes. Humanity has spent over a century buried underground...
    ko: 그래. 100년이 넘는 시간 동안 지하에 쳐박혀 있던 인류가.
    ja: 100年以上、地下に追いやられていた人類が…
  d_main_47_07_165:
    speaker: andersen
    en: At last, we will finally set foot on the surface beneath the sunlight.
    ko: 마침내 태양 아래의 땅을 딛고 서는 걸세.
    ja: |-
      また太陽の下で、
      広い大地を踏みしめて立てる時が来るんだ。
  d_main_47_07_166:
    speaker: andersen
    en: A new world will open up for everyone.
    ko: 모두에게 새로운 세계가 열리는 것이지.
    ja: 新しい世界が全ての人々に開かれる。
  d_main_47_07_167:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_47_07_168:
    speaker: burningum
    en: Yes.
    ko: 그래.
    ja: ああ…
  d_main_47_07_169:
    speaker: burningum
    en: That does sound exciting.
    ko: 두근거려.
    ja: 胸が熱くなるよ。
