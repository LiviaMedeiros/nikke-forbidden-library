---
d_main_46_01:
  d_main_46_01_1:
    speaker: snowwhite_h
    en: I'm at the target location.
    ko: 목표 지점에 도착했다.
    ja: 目標地点に到着した。
  d_main_46_01_2:
    speaker: cecil_op_r
    en: Good. Stand by.
    ko: 좋아요. 대기해 주세요.
    ja: 了解しました。そのまま待機してください。
  d_main_46_01_3:
    speaker: snowwhite_h
    en: How long do I have to wait?
    ko: 얼마나 기다려야 하지?
    ja: いつまでだ？
  d_main_46_01_4:
    speaker: cecil_op_r
    en: Hard to say. Probably till she shows up.
    ko: 글쎄요. 저쪽에서 오기까지 기다려야겠죠?
    ja: |-
      どうでしょうね。
      待ち合わせの相手が来るまで、でしょうか？
  d_main_46_01_5:
    speaker: snowwhite_h
    en: Then I'll search the nearby area.
    ko: 그럼 인근을 수색해 보겠다.
    ja: それなら、周辺の探索をしておく。
  d_main_46_01_6:
    speaker: cecil_op_r
    en: You were provided with sufficient rations. Did you eat them all already?
    ko: |-
      음식은 충분히 보급해 드렸잖아요.
      벌써 다 먹은 건가요?
    ja: |-
      食料は十分な量を支給したはずですが、
      まさか、もうすべて食べてしまったのですか？
  d_main_46_01_7:
    speaker: snowwhite_h
    en: I'm going to check for Raptures.
    ko: 랩쳐가 있는지 확인하는 거다.
    ja: ラプチャーがいないか索敵するだけだ。
  d_main_46_01_8:
    speaker: cecil_op_r
    en: Oh, my apologies.
    ko: 아, 미안해요.
    ja: それは失礼しました。
  d_main_46_01_9:
    speaker: johan_op_l
    en: If there are no issues, hold your current position.
    ko: 문제가 되지 않는다면 해당 위치에서 대기해라.
    ja: 問題がないようなら、その場で待機していろ。
  d_main_46_01_10:
    speaker: johan_op_l
    en: If you miss each other, it'll only complicate things.
    ko: 동선이 엇갈리면 그게 더 골치다.
    ja: 行き違いになる方が面倒だ。
  d_main_46_01_11:
    speaker: snowwhite_h
    en: I don't have time to waste here.
    ko: 이렇게 한 곳에서 시간을 죽이면서 있을 여유는 없다.
    ja: ただ待つだけで時間を無駄にする余裕などない。
  d_main_46_01_12:
    speaker: snowwhite_h
    en: I'd rather use that time to take down even one more Rapture.
    ko: 한 놈이라도 더 잡는 편이 좋아.
    ja: その間に、1体でも敵を減らす方が効率的だ。
  d_main_46_01_13:
    speaker: johan_op_l
    en: I agree with you, but there's also no need to cause a commotion.
    ko: 그 말에는 동의하지만, 괜히 소동을 일으킬 필요는 없다.
    ja: |-
      言い分は理解できるが、
      今は騒ぎを起こすべき時ではない。
  d_main_46_01_14:
    speaker: johan_op_l
    en: If you engage, the noise could draw more of them—
    ko: 교전 시의 소리를 듣고 더 몰려올 수도 있-
    ja: |-
      戦闘音を聞かれれば、
      ラプチャーを引き寄せる可能性が――
  d_main_46_01_15:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 콰앙-!
    ja: バン！
  d_main_46_01_16:
    speaker: "<Narration>"
    en: Snow White fires her rifle.
    ko: 스노우 화이트가 라이플을 발사한다.
    ja: |-
      スノーホワイトは言葉を
      さえぎるように銃撃を放った
  d_main_46_01_17:
    speaker: "<Narration>"
    en: An explosion occurs in the distance.
    ko: 먼 거리에서 폭발이 일어난다.
    ja: 遠方で爆発が起こった
  d_main_46_01_18:
    speaker: snowwhite_h
    en: One down.
    ko: 한 놈 잡았다.
    ja: 1機撃破。
  d_main_46_01_19:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_01_20:
    speaker: cecil_op_r
    en: Great. Other Raptures in the area heard the gunshot and are converging.
    ko: |-
      잘하셨어요.
      소리를 듣고 인근의 랩쳐들이 몰려오고 있네요.
    ja: |-
      見事な射撃でした。
      周辺のラプチャーが見物に来るようです。
  d_main_46_01_21:
    speaker: snowwhite_h
    en: Just as I wanted.
    ko: 바라던 바다.
    ja: 望むところだ。
  d_main_46_01_22:
    speaker: johan_op_l
    en: Don't even think about it. Withdraw from that sector. Any unnecessary engagements—
    ko: |-
      바라지 마라.
      해당 구역에서 이탈해라. 불필요한 교전은-
    ja: |-
      望むな。ただちにその場を離脱しろ。
      不必要な交戦は――
  d_main_46_01_23:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 콰앙-!
    ja: バン！
  d_main_46_01_24:
    speaker: "<Narration>"
    en: Snow White fires her rifle again.
    ko: 스노우 화이트가 라이플을 발사한다.
    ja: スノーホワイトは再び銃撃を放った
  d_main_46_01_25:
    speaker: "<Narration>"
    en: Another explosion occurs in the distance.
    ko: 먼 거리에서 폭발이 일어난다.
    ja: また遠方で爆発が起こった
  d_main_46_01_26:
    speaker: "<Narration>"
    en: A cloud of dust heads straight for her.
    ko: 먼지구름이 스노우 화이트를 향해 다가온다.
    ja: スノーホワイトの姿が爆発の砂ぼこりに隠れた
  d_main_46_01_27:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_01_28:
    speaker: snowwhite_h
    en: Sorry, I didn't catch that. What did you say?
    ko: |-
      미안하다. 못 들었다.
      뭐라고 했지?
    ja: |-
      悪いが、聞こえなかった。
      何か言っていたか？
  d_main_46_01_29:
    speaker: johan_op_l
    en: Cecil.
    ko: 세실.
    ja: セシル。
  d_main_46_01_30:
    speaker: cecil_op_r
    en: Yes?
    ko: 예.
    ja: はい。
  d_main_46_01_31:
    speaker: johan_op_l
    en: Stop using the operation device. Switch all communications to messaging.
    ko: |-
      오퍼레이션 디바이스로 백업하는 건 그만두지.
      앞으로는 메시지로 소통하겠다.
    ja: |-
      オペレーションデバイスでの
      バックアップは中止だ。
      今後はメッセージで連絡を取る。
  d_main_46_01_32:
    speaker: cecil_op_r
    en: Why?
    ko: 왜요?
    ja: なぜでしょう？
  d_main_46_01_33:
    speaker: johan_op_l
    en: Watching this is making my blood boil.
    ko: 저러는 걸 보고 있자니 울화가 치미는군.
    ja: 私が冷静でいられなくなる。
  d_main_46_01_34:
    speaker: cecil_op_r
    en: Don't let it get to you, Johan.
    ko: 참아요.
    ja: 我慢してください。
  d_main_46_01_35:
    speaker: snowwhite_h
    en: Yes, calm yourself. Patience is a virtue.
    ko: |-
      그래. 참아라.
      참을성은 많은 도움이 된다.
    ja: |-
      そうだ。我慢しろ。
      忍耐力は何かと役に立つからな。
  d_main_46_01_36:
    speaker: johan_op_l
    en: You're the one who needs to calm down.
    ko: 너나 좀 참아라.
    ja: それはこちらのセリフだ。
  d_main_46_01_37:
    speaker: cecil_op_r
    en: Raptures incoming. Numbers are...
    ko: 랩쳐 접근 중. 수는….
    ja: |-
      ラプチャーがさらに接近。
      数は…
  d_main_46_01_38:
    speaker: cecil_op_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_01_39:
    speaker: cecil_op_r
    en: Johan. Look at this.
    ko: 요한. 이거 좀 봐요.
    ja: ヨハン。これを。
  d_main_46_01_40:
    speaker: johan_op_l
    en: What is it?
    ko: 뭐지.
    ja: 何だ？
  d_main_46_01_41:
    speaker: cecil_op_r
    en: Just look at the approaching Raptures.
    ko: 여기. 접근하는 랩쳐들을 봐요.
    ja: |-
      ここです。
      接近中のラプチャーを見てください。
  d_main_46_01_42:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_01_43:
    speaker: johan_op_l
    en: What the hell is that?
    ko: 뭐냐 이건.
    ja: 何だ、これは。
  d_main_46_01_44:
    speaker: snowwhite_h
    en: What is it? Tell me.
    ko: 뭐지? 나도 보여다오.
    ja: どうした？私にも見せてくれ。
  d_main_46_01_45:
    speaker: johan_op_l
    en: Use your eyes and see for yourself.
    ko: 넌 직접 봐라.
    ja: お前は直接見ればいい。
  d_main_46_01_46:
    speaker: snowwhite_h
    en: Very well.
    ko: 그러면 되겠군.
    ja: そうする。
  d_main_46_01_47:
    speaker: "<Narration>"
    en: Snow White looks at the Raptures swarming in.
    ko: 스노우 화이트가 몰려오는 랩쳐들을 바라본다.
    ja: |-
      スノーホワイトは押し寄せる
      ラプチャーの群れに目を凝らした
  d_main_46_01_48:
    speaker: "<Narration>"
    en: They're no different from the Raptures she's always encountered.
    ko: 언제나 봐오던 랩쳐들이다.
    ja: とくに変わったことは見当たらない
  d_main_46_01_49:
    speaker: "<Narration>"
    en: Assuming Johan and Cecil are just overreacting, Snow White takes aim.
    ko: 스노우 화이트는 요한과 세실이 호들갑을 떠는 것이라 생각하고, 자세를 잡는다.
    ja: |-
      ヨハンとセシルの杞憂だろうと考え、
      スノーホワイトは迎撃の構えを取った
  d_main_46_01_50:
    speaker: "<Narration>"
    en: She waits until the Raptures are within maximum effective range.
    ko: 최대 화력의 사정거리 안으로 들어올 때까지 기다린다.
    ja: |-
      最大火力の射程圏内に
      敵が踏み入って来る時を、静かに待つ体勢だ
  d_main_46_01_51:
    speaker: "<Narration>"
    en: As the lead Raptures come into range, Snow White pulls the trigger.
    ko: |-
      선두의 랩쳐가 거리에 들어왔을 때,
      스노우 화이트는 방아쇠를 당긴다.
    ja: |-
      先頭の集団が射程圏内に収まった瞬間、
      スノーホワイトは引き金に指をかけた
  d_main_46_01_52:
    speaker: "<Narration>"
    en: "*Bang, bang, bang*"
    ko: 콰과과광--!!
    ja: ズガガガガガッ！！
  d_main_46_01_53:
    speaker: "<Narration>"
    en: No, she was about to pull the trigger,
    ko: 아니, 당기려고 했다.
    ja: 引き金にかけた指はそこで止まったままだ
  d_main_46_01_54:
    speaker: "<Narration>"
    en: when the front-line Raptures explode into smithereens.
    ko: 선두의 랩쳐들이 폭발을 일으키며 터져나간다.
    ja: |-
      先頭のラプチャーたちが
      突然爆発を起こして吹き飛んだ
  d_main_46_01_55:
    speaker: snowwhite_h
    en: What was that? I didn't fire.
    ko: "…뭐지. 난 쏘지 않았다."
    ja: "…何だ？私は攻撃していない。"
  d_main_46_01_56:
    speaker: cecil_op_r
    en: It came from behind.
    ko: 뒤에서 쐈어요.
    ja: 後方からの射撃です。
  d_main_46_01_57:
    speaker: snowwhite_h
    en: From behind?
    ko: "…뒤에서?"
    ja: "…後方から？"
  d_main_46_01_58:
    speaker: cecil_op_r
    en: That shot came from somewhere in the rear of that swarm and hit the ones in
      the front-line.
    ko: 다가오고 있는 랩쳐의 후미에서 선두를 쐈다는 얘기예요.
    ja: |-
      ラプチャーの群れ同士の、
      後ろ側から攻撃されたということです。
  d_main_46_01_59:
    speaker: snowwhite_h
    en: Why?
    ko: 왜?
    ja: なぜだ？
  d_main_46_01_60:
    speaker: cecil_op_r
    en: No idea. Could they be infighting?
    ko: 그거야 모르죠. 내분이라도 일어났나?
    ja: |-
      分かりません。
      仲間割れでしょうか？
  d_main_46_01_61:
    speaker: snowwhite_h
    en: No, Raptures are brainless idiots. They're incapable of that.
    ko: 랩쳐 놈들은 지능이 없는 멍청이들이라 내분 같은 건 할 줄 모른다.
    ja: ラプチャーにそんな知性はない。
  d_main_46_01_62:
    speaker: johan_op_l
    en: The front-line units have been annihilated.
    ko: 선두 전멸 확인.
    ja: 先頭集団の壊滅を確認。
  d_main_46_01_63:
    speaker: johan_op_l
    en: Rear units are approaching.
    ko: 후미가 접근한다.
    ja: 後方の敵が接近しているな。
  d_main_46_01_64:
    speaker: johan_op_l
    en: Unidentified Raptures. Engage with caution—
    ko: "…미확인 랩쳐들이다. 신중을 가해 교전-"
    ja: |-
      …得体の知れない相手だ。
      慎重に交戦を――
  d_main_46_01_65:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 콰앙-!
    ja: バン！
  d_main_46_01_66:
    speaker: "<Narration>"
    en: Snow White fires her rifle yet again.
    ko: 스노우 화이트가 라이플을 발사한다.
    ja: スノーホワイトの射撃の音がした
  d_main_46_01_67:
    speaker: "<Narration>"
    en: Yet another explosion erupts in the distance.
    ko: 먼 거리에서 폭발이 일어난다.
    ja: 遠方で爆発が起こった
  d_main_46_01_68:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_01_69:
    speaker: snowwhite_h
    en: If you don't know what you're dealing with, strike first.
    ko: 상대가 누군지 모르면 일단 선공이다.
    ja: 未知の敵なら、先手を打つに限る。
  d_main_46_01_70:
    speaker: johan_op_l
    en: "... Fine. Engage."
    ko: "…좋다. 교전에 돌입해라."
    ja: "…そうだな。交戦を開始しろ。"
  d_main_46_01_71:
    speaker: snowwhite_h
    en: Encounter.
    ko: 인카운터.
    ja: エンカウンター。
d_main_46_02:
  d_main_46_02_1:
    speaker: snowwhite_h
    en: All clear.
    ko: "…상황 종료."
    ja: "…状況終了。"
  d_main_46_02_2:
    speaker: "<Narration>"
    en: Snow White looks at the wreckage of the Raptures scattered across the ground.
    ko: 스노우 화이트는 바닥에 널브러진 랩쳐들의 잔해를 바라본다.
    ja: |-
      スノーホワイトは地面に転がる
      ラプチャーの残骸を確かめた
  d_main_46_02_3:
    speaker: snowwhite_h
    en: "... I've never seen Raptures like these before."
    ko: "…처음 보는 랩쳐들이다."
    ja: "…初めて見るラプチャーだ。"
  d_main_46_02_4:
    speaker: johan_op_l
    en: Get closer so I can have a better look.
    ko: 접근해라. 확인해 보겠다.
    ja: 近づいてくれ。こちらでも確認したい。
  d_main_46_02_5:
    speaker: "<Narration>"
    en: Snow White approaches the wreckage.
    ko: 스노우 화이트가 잔해에 접근한다.
    ja: スノーホワイトは残骸に近づいた
  d_main_46_02_6:
    speaker: "<Narration>"
    en: She crouches down and picks up a mangled component.
    ko: 쪼그리고 앉아, 너덜너덜해진 부품을 집어 든다.
    ja: |-
      残骸の側でしゃがみ込み、
      ボロボロの部品を手に取った
  d_main_46_02_7:
    speaker: cecil_op_r
    en: That's not edible.
    ko: 먹으면 안 돼요.
    ja: 食べないでくださいね。
  d_main_46_02_8:
    speaker: snowwhite_h
    en: I'm not going to eat it.
    ko: 안 먹는다.
    ja: 食べる気はない。
  d_main_46_02_9:
    speaker: johan_op_l
    en: The color is different... It's very vivid.
    ko: "…색이 다르군. 화려해."
    ja: "…色から違うな。目立つ色だ。"
  d_main_46_02_10:
    speaker: johan_op_l
    en: Most of the Raptures we've seen are monochrome. These are different.
    ko: |-
      지금껏 랩쳐들은 무채색 위주였다.
      이것들은 다르군.
    ja: |-
      今までのラプチャーは無彩色だった。
      こいつらは違う。
  d_main_46_02_11:
    speaker: johan_op_l
    en: What's the texture like?
    ko: 촉감은 어떻지?
    ja: 材質の感触に違いはあるか？
  d_main_46_02_12:
    speaker: snowwhite_h
    en: "... Different."
    ko: "…다르다."
    ja: "…違うな。"
  d_main_46_02_13:
    speaker: snowwhite_h
    en: It's not entirely rigid. There's some elasticity to it.
    ko: |-
      딱딱하기만 한 게 아니야.
      탄력이 있다.
    ja: |-
      ただ硬いだけじゃない。
      弾力がある。
  d_main_46_02_14:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_02_15:
    speaker: johan_op_l
    en: Pick up that yellow component at your four o'clock.
    ko: 4시 방향에 있는 노란색 부품을 집어봐라.
    ja: 4時の方向の黄色い部品を手で確かめてくれ。
  d_main_46_02_16:
    speaker: "<Narration>"
    en: Snow White grabs the part.
    ko: 스노우 화이트가 부품을 잡는다.
    ja: スノーホワイトが指示されたものを持ち上げた
  d_main_46_02_17:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_02_18:
    speaker: cecil_op_r
    en: "... The size is obviously different, but is that a..."
    ko: "…크기는 당연히 다르지만, 이건…."
    ja: "…大きさこそ当然違いますが、これは…"
  d_main_46_02_19:
    speaker: johan_op_l
    en: Yes. It's a finger.
    ko: 그래. 손가락이다.
    ja: ああ。指だろう。
  d_main_46_02_20:
    speaker: johan_op_l
    en: It's attached differently, but it's clearly a finger.
    ko: 달려있는 위치가 다를 뿐, 모습은 확실히 손가락이다.
    ja: |-
      生えている位置は妙だが、
      形状からして指に違いない。
  d_main_46_02_21:
    speaker: johan_op_l
    en: I can also make out parts like ribs, teeth and legs...
    ko: 그 외에도 갈비뼈, 치아, 다리… 같은 부분이 보이는군.
    ja: |-
      それ以外に、肋骨、歯…
      脚のような部分もある。
  d_main_46_02_22:
    speaker: johan_op_l
    en: Snow White, rub your arm.
    ko: |-
      스노우 화이트.
      네 팔을 주물러봐라.
    ja: |-
      スノーホワイト。
      自分の腕を触ってみろ。
  d_main_46_02_23:
    speaker: snowwhite_h
    en: My muscles aren't sore.
    ko: 근육통 같은 건 없다.
    ja: 特に痛みはないが。
  d_main_46_02_24:
    speaker: johan_op_l
    en: It is for comparison. Go on, feel it.
    ko: |-
      촉감 비교를 위한 거다.
      만져봐라.
    ja: |-
      感触を比較してくれということだ。
      違いはあるか？
  d_main_46_02_25:
    speaker: "<Narration>"
    en: Snow White rubs her arm,
    ko: 스노우 화이트가 팔을 주무른다.
    ja: スノーホワイトは自分の腕を揉んだ
  d_main_46_02_26:
    speaker: "<Narration>"
    en: then touches the Rapture component again.
    ko: 이후, 다시 랩쳐의 부품을 만진다.
    ja: それから、もう一度ラプチャーの残骸に触れた
  d_main_46_02_27:
    speaker: johan_op_l
    en: Well?
    ko: "…어떻지?"
    ja: "…どうだ？"
  d_main_46_02_28:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_02_29:
    speaker: snowwhite_h
    en: It feels the same.
    ko: 같다.
    ja: 同じだ。
  d_main_46_02_30:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_02_31:
    speaker: johan_op_l
    en: Check the core.
    ko: 코어를 확인해라.
    ja: コアを確認したい。
  d_main_46_02_32:
    speaker: snowwhite_h
    en: There isn't any.
    ko: 코어는 없다.
    ja: 見当たらないな。
  d_main_46_02_33:
    speaker: snowwhite_h
    en: There's only black liquid where the core should be.
    ko: 코어가 있을법한 위치에는 검은색 액체뿐이다.
    ja: |-
      それらしい位置には黒い液体が
      飛び散っているだけだ。
  d_main_46_02_34:
    speaker: snowwhite_h
    en: It's not oil. It's heavier. More viscous.
    ko: 기름은 아니야. 좀 더 무겁고 점성이 높다.
    ja: |-
      油ではないな。
      油より重くて、粘度が高い。
  d_main_46_02_35:
    speaker: johan_op_l
    en: There's... no core?
    ko: 코어가… 없다고?
    ja: コアが…存在しない？
  d_main_46_02_36:
    speaker: johan_op_l
    en: Then where is it drawing power from?
    ko: 어디에서 동력을 받아 움직이는 거지?
    ja: だとすれば、動力はどこから…？
  d_main_46_02_37:
    speaker: cecil_op_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_02_38:
    speaker: johan_op_l
    en: Secure a sample of the black liquid.
    ko: 검은색 액체의 샘플을 확보해라.
    ja: 黒い液体のサンプルを持ち帰ってくれ。
  d_main_46_02_39:
    speaker: johan_op_l
    en: We'll analyze its composition in Eden.
    ko: 에덴에서 성분을 조사해 보겠다.
    ja: エデンで成分を分析する。
  d_main_46_02_40:
    speaker: snowwhite_h
    en: Understood. Securing a sample.
    ko: 알겠다. 확보하겠다.
    ja: 分かった。確保しておく。
  d_main_46_02_41:
    speaker: cecil_op_r
    en: Nayuta's signature detected nearby.
    ko: 근방에 나유타 반응 확인.
    ja: ナユタの反応を確認。
  d_main_46_02_42:
    speaker: snowwhite_h
    en: Hmm. Looks like she's finally here.
    ko: 음. 이제 온 모양이군.
    ja: ああ、来たようだな。
  d_main_46_02_43:
    speaker: "<Narration>"
    en: Nayuta appears riding Mantra.
    ko: 나유타가 만트라를 타고 나타난다.
    ja: マントラに乗ったナユタが現れた
  d_main_46_02_44:
    speaker: "<Narration>"
    en: She looks around, frowning.
    ko: 주위를 둘러보며 미간을 찌푸린다.
    ja: 周囲を見渡し、眉間にしわが寄る
  d_main_46_02_45:
    speaker: nayuta_m
    en: "... What manner of disturbance is this?"
    ko: "…이게 무슨 소란이오?"
    ja: "…これは、何の騒ぎでしょう？"
  d_main_46_02_46:
    speaker: snowwhite_h
    en: You're late. Try being on time next time.
    ko: 늦었다. 일찍일찍 좀 다녀라.
    ja: 遅いぞ。もっと迅速に行動しろ。
  d_main_46_02_47:
    speaker: nayuta_m
    en: Did we not appoint this place for our rendezvous? Did thy impatience get the
      better of thee, that thou didst open fire?
    ko: |-
      이 근방에서 만나기로 하지 않았소.
      그새를 못 참고 총질을 해댄 것이오?
    ja: |-
      この近くで合流する約束だったはずです。
      待ちきれなくて戦闘を始めたのですか？
  d_main_46_02_48:
    speaker: nayuta_m
    en: There is naught to gain to be gained from raising a disturbance here.
    ko: 여기서 소란을 피워 좋을 게 없소이다.
    ja: |-
      ここで騒ぎを起こすことに
      利はないと思いますが…
  d_main_46_02_49:
    speaker: snowwhite_h
    en: The Raptures started it first.
    ko: 랩쳐 놈들이 먼저 시비를 걸었다.
    ja: ラプチャーの方から誘ってきた。
  d_main_46_02_50:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_02_51:
    speaker: "<Narration>"
    en: Nayuta stares at the Rapture wreckage.
    ko: 나유타는 랩쳐들의 잔해를 빤히 바라보았다.
    ja: ナユタはラプチャーの残骸に目を凝らした
  d_main_46_02_52:
    speaker: nayuta_m
    en: Pray, what in heavens are these...?
    ko: "…이들은 대체…."
    ja: "…これはいったい…"
d_main_46_03:
  d_main_46_03_1:
    speaker: nayuta
    en: This spot shall serve admirably. 'Tis inconspicuous, and affords a most advantageous
      vantage point.
    ko: |-
      음. 이쯤이 좋겠소.
      적절히 눈에 띄지 않고, 쳐다보기에 용이하구려.
    ja: |-
      ふむ、この辺りがよさそうですねぇ。
      目立たずに様子をうかがえます。
  d_main_46_03_2:
    speaker: johan_op_l
    en: What are you playing at, Monk?
    ko: 무슨 생각이냐 승려.
    ja: 仙人、どういうことだ？
  d_main_46_03_3:
    speaker: johan_op_l
    en: Why did you insist on meeting near the Lift, of all places?
    ko: 많고 많은 장소 중에 궤도 엘리베이터 인근에서 보자고 한 이유가 뭐지.
    ja: |-
      他に場所などいくらでもあるだろう。
      なぜ軌道エレベーター間近を選んだ。
  d_main_46_03_4:
    speaker: johan_op_l
    en: You couldn't pick a more dangerous location if you tried.
    ko: 궤도 엘리베이터는 최고 수준의 위험 지역이다.
    ja: あの周辺は最高レベルの危険地帯だ。
  d_main_46_03_5:
    speaker: johan_op_l
    en: It's a fair distance from the main structure, but that doesn't mean we're
      in the clear.
    ko: |-
      본 건물까지는 거리가 제법 있다지만,
      이곳이라고 해서 안심할 순 없다.
    ja: |-
      多少の距離があるとはいえ、
      そこも安心できるような場所ではない。
  d_main_46_03_6:
    speaker: nayuta
    en: I am not oblivious. You are exceedingly given to quibbling.
    ko: |-
      소인도 알고 있소.
      그것 참 엄청 따지고 드는구려.
    ja: |-
      それは私も承知しております。
      あまり責めないでいただきたいですねぇ。
  d_main_46_03_7:
    speaker: nayuta
    en: Would I summon White Snow hither without due cause?
    ko: 소인이 아무 이유도 없이 이곳에 백설 소저를 불렀겠소?
    ja: |-
      私が何の理由もなく、
      ここへお呼び立てしたとお考えですか？
  d_main_46_03_8:
    speaker: johan_op_l
    en: Explain.
    ko: 말해라.
    ja: 聞いてやろう。
  d_main_46_03_9:
    speaker: nayuta
    en: Since the encounter with the Queen, I dispatched my remaining replicas to
      reconnoiter places of import.
    ko: 퀸 전 이후 소인은 남은 분신들로 하여금 신경 쓰이는 곳에 정찰을 보냈소.
    ja: |-
      クイーン戦の後、私は残った分身を使って
      気になる地点を偵察させました。
  d_main_46_03_10:
    speaker: johan_op_l
    en: Wait. You have more clones left?
    ko: "…남았다고? 분신이?"
    ja: "…分身？残っていたのか？"
  d_main_46_03_11:
    speaker: nayuta
    en: "... Aye. Not combat units proper, but adequate for reconnaissance."
    ko: "…그렇소. 일군이 아닌 분신이긴 하지만, 정찰에는 문제없소."
    ja: |-
      …そうですねぇ。
      偵察に使える程度だけですが。
  d_main_46_03_12:
    speaker: johan_op_l
    en: "... I see."
    ko: "…그렇군."
    ja: "…そうか。"
  d_main_46_03_13:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_03_14:
    speaker: nayuta
    en: Nevertheless, my replicas have scouted locations upon the surface deemed of
      strategic import.
    ko: 아무튼, 소인의 분신들이 현재 지상의 요지라 불릴 만한 곳을 정찰하였는데.
    ja: |-
      ともあれ、分身を使って、
      地上各地の要衝と呼ぶべき場所を
      探っているのですが…
  d_main_46_03_15:
    speaker: nayuta
    en: Alas, none evinced any reaction of note.
    ko: 딱히 특별한 반응을 보이는 곳은 없었소.
    ja: |-
      変わった動きがあった場所は
      見つかりませんでした。
  d_main_46_03_16:
    speaker: "<Narration>"
    en: Nayuta silently raises her finger and points off in the distance.
    ko: 나유타는 말없이 손가락을 들어 먼 곳을 가리킨다.
    ja: ナユタは静かに、遠くを指さした
  d_main_46_03_17:
    speaker: "<Narration>"
    en: She gestures to a towering structure that seems to pierce the sky, the greatest
      construct humanity ever created.
    ko: |-
      하늘을 꿰뚫을 듯 우뚝 솟아 있는,
      인류가 만들어낸 최고의 건조물.
    ja: |-
      その先には、空を貫くようにそびえ立つ
      かつての人類が打ち建てた技術の結晶――
  d_main_46_03_18:
    speaker: "<Narration>"
    en: The Lift.
    ko: 궤도 엘리베이터를 가리킨다.
    ja: 軌道エレベーターがある
  d_main_46_03_19:
    speaker: nayuta
    en: Save for that place. The Orbital Spire.
    ko: 저곳, 궤도 엘리베이터를 제외하고는 말이외다.
    ja: ただ一ヶ所、あの軌道エレベーターを除いて。
  d_main_46_03_20:
    speaker: snowwhite_h
    en: You're getting a special reading from over there?
    ko: 저기에는 특별한 반응이 있나?
    ja: 何か変化があったのか？
  d_main_46_03_21:
    speaker: nayuta
    en: Indeed. Observe closely.
    ko: 그렇소. 잘 보시오.
    ja: いかにも。よくご覧ください。
  d_main_46_03_22:
    speaker: nayuta
    en: Lights kindle within.
    ko: 불이 들어오고 있소.
    ja: 照明が点灯しています。
  d_main_46_03_23:
    speaker: nayuta
    en: Venture nearer, and perchance a mechanical hum shall reach thy ear.
    ko: 좀 더 가까이 접근하면 기계음도 들리오.
    ja: もう少し近づけば、音も聞こえるでしょう。
  d_main_46_03_24:
    speaker: snowwhite_h
    en: "... No way."
    ko: "…설마."
    ja: "…まさか。"
  d_main_46_03_25:
    speaker: nayuta
    en: The Orbital Spire yet functions.
    ko: |-
      가동되고 있는 것이외다.
      궤도 엘리베이터가.
    ja: |-
      その通り。
      軌道エレベーターが稼働しています。
  d_main_46_03_26:
    speaker: johan_op_l
    en: The Lift is...
    ko: "…궤도 엘리베이터가."
    ja: "…動き出していたのか。"
  d_main_46_03_27:
    speaker: johan_op_l
    en: That means the Raptures we saw earlier are being produced there?
    ko: 그럼 좀 전에 본 랩쳐들은 거기서 생산되고 있는 건가?
    ja: |-
      ならば、合流前に交戦したラプチャーは
      そこで生産されていたということか？
  d_main_46_03_28:
    speaker: nayuta
    en: You speak of the new sort of Raptures. Aye, that hath troubled me likewise.
    ko: |-
      …새로운 양식의 랩쳐들을 말하는 것이구려.
      소인도 계속 신경 쓰였소.
    ja: |-
      …新型ラプチャーのことは
      もうお気づきのようですねぇ。
      私も長く気に掛かっていました。
  d_main_46_03_29:
    speaker: nayuta
    en: During my reconnaissance, Raptures of the new sort were observed in considerable
      number.
    ko: 정찰 중, 새로운 양식의 랩쳐들이 상당수 눈에 띄었지.
    ja: 偵察中、かなり目についたものですから。
  d_main_46_03_30:
    speaker: nayuta
    en: These new Raptures were all manufactured within the orbital stations, yet
      the stations themselves are now ruins.
    ko: |-
      하지만 랩쳐는 모두 스테이션에서 생산되었소.
      스테이션은 파괴되었고.
    ja: |-
      ですが、ラプチャーはあの先の
      宇宙ステーションで製造されていたはずで、
      そのステーションはとうに破壊されている。
  d_main_46_03_31:
    speaker: nayuta
    en: I desire to confirm whether a connection doth exist between these two facts.
    ko: 그 상관관계를 확인하고 싶소.
    ja: 関係を確かめる必要があると考えました。
  d_main_46_03_32:
    speaker: snowwhite_h
    en: So you want to scout the Lift.
    ko: 원하는 건 궤도 엘리베이터 정찰인가.
    ja: 軌道エレベーターの偵察をしたいということか。
  d_main_46_03_33:
    speaker: nayuta
    en: Indeed.
    ko: 그렇소.
    ja: ご明察。
  d_main_46_03_34:
    speaker: snowwhite_h
    en: Fine. Then let's go.
    ko: 좋다. 그럼 가지.
    ja: よし、では行こう。
  d_main_46_03_35:
    speaker: nayuta
    en: Much obliged.
    ko: 고맙소.
    ja: 恩に着ます。
  d_main_46_03_36:
    speaker: johan_op_l
    en: Wait.
    ko: 기다려라.
    ja: 待て。
  d_main_46_03_37:
    speaker: johan_op_l
    en: Snow White is the only fighting force Eden's got right now.
    ko: 스노우 화이트는 현재 에덴의 유일한 전력이다.
    ja: 現状ではスノーホワイトがエデン唯一の戦力だ。
  d_main_46_03_38:
    speaker: johan_op_l
    en: I won't authorize her to conduct such a dangerous recon.
    ko: 위험도가 높은 정찰에 투입할 수 없다.
    ja: リスクの高い偵察には投入させられない。
  d_main_46_03_39:
    speaker: nayuta
    en: It doth prove quite impossible for me to do alone. Thus I venture to solicit
      a favor from thee.
    ko: 소인 혼자로서는 도저히 불가능하니 부탁하는 것이외다.
    ja: |-
      私一人で成し得ないことだからこそ、
      このようなお願いをしているのです。
  d_main_46_03_40:
    speaker: johan_op_l
    en: You've got plenty of clones who can handle the scouting just fine.
    ko: 정찰 능력이 좋은 네 분신들이 있을 거다.
    ja: 偵察こそ、分身向きの任務だろう。
  d_main_46_03_41:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_03_42:
    speaker: nayuta
    en: I did dispatch several score of them nigh unto the Orbital Spire,
    ko: 궤도 엘리베이터 인근으로 수십의 분신들이 정찰을 나섰으나.
    ja: すでに数十体の分身を送っています。
  d_main_46_03_43:
    speaker: nayuta
    en: yet to this hour, no word hath reached me.
    ko: 현재까지 아무런 연락이 없는 상태요.
    ja: 今のところ、情報はありません。
  d_main_46_03_44:
    speaker: nayuta
    en: As their NIMPH hath not yet returned unto me, while I do not think they have
      perished outright,
    ko: NIMPH가 소인에게 오지 않았으니 사망하지는 않았을 것 같소만….
    ja: |-
      NIMPHが戻って来ていないので、
      壊滅したわけではないはずですが…
  d_main_46_03_45:
    speaker: nayuta
    en: and yet, I cannot shake the conviction that all is not well.
    ko: 좋은 상황은 아닐 거란 확신이 드오.
    ja: 好ましい状況でもないことは確かでしょう。
  d_main_46_03_46:
    speaker: nayuta
    en: I desire to investigate that matter in my reconnaissance as well.
    ko: 그것까지 포함하여 정찰해 보고 싶소.
    ja: そのことも含めて、状況把握が必要なのです。
  d_main_46_03_47:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_03_48:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_03_49:
    speaker: nayuta
    en: Put from thy mind the one who hath departed. Young Lady Isabel is gone.
    ko: |-
      떠난 이는 잊으시오.
      이사벨 소저는 없소.
    ja: |-
      あまり思い出しすぎないことです。
      イサベルはもうおりません。
  d_main_46_03_50:
    speaker: johan_op_l
    en: I know that.
    ko: 안다.
    ja: 分かっている。
  d_main_46_03_51:
    speaker: johan_op_l
    en: "... Proceed with extreme caution."
    ko: "…최대한 경계하며 정찰해라."
    ja: "…細心の注意を払って偵察にあたれ。"
  d_main_46_03_52:
    speaker: johan_op_l
    en: The moment you feel it's too dangerous, withdraw at once.
    ko: 위험하다 판단되면 바로 퇴각하도록.
    ja: 危険を感知次第、ただちに撤退しろ。
  d_main_46_03_53:
    speaker: cecil_op_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_03_54:
    speaker: nayuta
    en: Understood. I shall bear that in mind.
    ko: 알겠소. 명심하겠소.
    ja: 委細承知。肝に銘じておきましょう。
d_main_46_04:
  d_main_46_04_1:
    speaker: nayuta
    en: Hmm... I desire to draw nearer still, yet it proves not feasible.
    ko: 으음… 조금 더 접근하고 싶소만 여의치 않군.
    ja: |-
      はてさて…もう少し近づきたいところですが、
      ままならぬものですねぇ。
  d_main_46_04_2:
    speaker: nayuta
    en: However, to venture any deeper would be to invite battle.
    ko: 허나 이 이상 깊게 들어가면 전투를 피할 수 없을 것이외다.
    ja: |-
      これ以上深入りしては、
      戦闘が避けられなくなります。
  d_main_46_04_3:
    speaker: snowwhite_h
    en: Why avoid combat?
    ko: 전투를 왜 피하지?
    ja: なぜ避ける必要がある？
  d_main_46_04_4:
    speaker: nayuta
    en: I cast no doubt upon thy abilities nor thy newfound powers, White Snow. Yet
      why spend that strength for naught?
    ko: "…물론 새로운 힘을 가진 백설 소저의 능력을 의심하는 것은 아니오만, 괜히 힘 뺄 필요가 있겠소?"
    ja: |-
      …エデンで受けた強化を
      疑っているわけではありませんが、
      いたずらに消耗するべきではありません。
  d_main_46_04_5:
    speaker: snowwhite_h
    en: You have to pick apart everything, don't you.
    ko: 너는 너무 따지는 게 많다.
    ja: お前は細かいことを考えすぎだ。
  d_main_46_04_6:
    speaker: snowwhite_h
    en: Sometimes, the simplest option is the best one.
    ko: 가끔은 단순한 방법이 도움이 될 때도 있다.
    ja: 単純な方法がもっとも有効な場合もある。
  d_main_46_04_7:
    speaker: nayuta
    en: And sometimes it is not. Hence why I am deliberating.
    ko: 가끔이 아니니 소인이 하는 말 아니오.
    ja: 場合もある、では困りますねぇ。
  d_main_46_04_8:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_9:
    speaker: nayuta
    en: Young Lady Cecil. Wouldst thou be able to confirm the spread of Raptures in
      the vicinity?
    ko: |-
      세실 소저.
      혹여 인근의 랩쳐 분포도를 확인할 수 있겠소?
    ja: |-
      セシル。
      周辺の敵戦力を確認できますか？
  d_main_46_04_10:
    speaker: cecil_op_r
    en: There are far too many. There's no point even trying to count them all.
    ko: |-
      많아도 너무 많아요.
      수를 세는 게 무의미한 수준이겠네요.
    ja: |-
      圧倒的な数です。
      数える意味を感じません。
  d_main_46_04_11:
    speaker: cecil_op_r
    en: Charging in would be a suicide mission.
    ko: 달려드는 건 죽으러 가는 것과 다르지 않겠죠.
    ja: 交戦は自殺行為です。
  d_main_46_04_12:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_13:
    speaker: johan_op_l
    en: You're out of options. Fall back for now.
    ko: 방법이 없군. 일단 퇴각해라.
    ja: 他に方法がない。この場は撤退しろ。
  d_main_46_04_14:
    speaker: johan_op_l
    en: We now know something's amiss here. That alone is a significant find.
    ko: 이곳에서 심상치 않은 일이 일어나고 있다는 것을 안 것만 해도 큰 수확이다.
    ja: |-
      ここで重大な何かが起こっているという
      事実が確認できただけでも、十分な収穫だ。
  d_main_46_04_15:
    speaker: cecil_op_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_16:
    speaker: johan_op_l
    en: We'll pick this back up when @UserName arrives with the cavalry.
    ko: 추후 그 녀석의 지원이 온다면 그때 다시 정찰을 시작하지.
    ja: 増援の到着を待ち、改めて偵察を行う。
  d_main_46_04_17:
    speaker: cecil_op_r
    en: Do you think the Queen is just going to sit around twiddling her thumbs?
    ko: 그동안 퀸이 아무것도 안 하고 기다려준대요?
    ja: |-
      それまでクイーンが、
      何もせずに大人しく待っていると
      思いますか？
  d_main_46_04_18:
    speaker: johan_op_l
    en: "... What?"
    ko: "…뭐?"
    ja: "…何？"
  d_main_46_04_19:
    speaker: cecil_op_r
    en: Nayuta, find a way to scout the area without getting drawn into a fight.
    ko: |-
      나유타. 방법을 찾아줘요.
      전투를 최대한 피하면서 정찰할 수 있는 방법을.
    ja: |-
      ナユタ、策を探してください。
      可能な限り戦闘を回避しつつ、
      最大限の情報収集ができる方法を。
  d_main_46_04_20:
    speaker: johan_op_l
    en: This is not your call to make, Cecil. I'm the one in command here.
    ko: |-
      지휘권자는 나다, 세실.
      네가 판단할 일이 아니다.
    ja: |-
      セシル、指揮官は私だ。
      勝手な指示を出すな。
  d_main_46_04_21:
    speaker: cecil_op_r
    en: Letting fear dictate our every move won't get us anywhere, Johan.
    ko: 겁을 먹고 안전한 길만 골라 가서는 아무것도 할 수 없어요, 요한.
    ja: |-
      怯えて安全な道ばかり選んでいては
      何もできなくなりますよ、ヨハン。
  d_main_46_04_22:
    speaker: cecil_op_r
    en: Especially in a situation like this.
    ko: 지금 같은 상황이면 더욱 그렇죠.
    ja: 今のような状況では、なおさらです。
  d_main_46_04_23:
    speaker: johan_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_24:
    speaker: cecil_op_r
    en: With no way of knowing what Queen is up to, we can't turn back now, not after
      coming this far.
    ko: |-
      퀸이 무슨 짓을 하고 있을지 알 수 없는 마당에,
      여기까지 와서 그냥 돌아갈 수는….
    ja: |-
      クイーンが何をしているかが
      分かっていないのです。
      ここで引き下がるわけには…
  d_main_46_04_25:
    speaker: cecil_op_r
    en: "??"
    ko: "??"
    ja: "？？"
  d_main_46_04_26:
    speaker: cecil_op_r
    en: What's... wrong... comm...
    ko: 통신… 이… 왜 이러….
    ja: これは…？通信…が…
  d_main_46_04_27:
    speaker: nayuta
    en: Young Lady Cecil. Can my voice reach thee?
    ko: 세실 소저. 들리시오?
    ja: セシル、聞こえていますか？
  d_main_46_04_28:
    speaker: cecil_op_r
    en: Alv... particle density... too low...
    ko: 에블… 입자 농도… 낮은….
    ja: エブラ粒子…濃度…低い…
  d_main_46_04_29:
    speaker: cecil_op_r
    en: You two... Listen care... Find whatever... then... back...
    ko: 둘… 잘 들… 뭐라도 알아… 후… 복귀….
    ja: |-
      2人…よく聞い…そちら…突き止め…
      帰還…
  d_main_46_04_30:
    speaker: cecil_op_r
    en: Find whatever you can and then fall back. Understood?
    ko: 뭐라도 알아낸 후 복귀해요. 알겠죠?
    ja: |-
      そちらの状況を突き止めて帰還してください。
      聞こえますか？
  d_main_46_04_31:
    speaker: "<Narration>"
    en: The line goes to static.
    ko: 치지지직--
    ja: ザザザッ――
  d_main_46_04_32:
    speaker: snowwhite_h
    en: "... Communications are completely cut off."
    ko: "…통신이 완전히 끊겼다."
    ja: "…通信が完全に切れたな。"
  d_main_46_04_33:
    speaker: snowwhite_h
    en: Our communication equipment is functioning normally. This wasn't caused by
      elevated Alva particles.
    ko: |-
      장비는 제대로 작동한다.
      에블라 입자 농도가 짙어서 생긴 일은 아니야.
    ja: |-
      装置は問題ない。
      エブラ粒子の濃度でもなさそうだ。
  d_main_46_04_34:
    speaker: nayuta
    en: To lose contact within Eden of all places? A strange thing indeed.
    ko: 별일이 다 있구려. 에덴에서 통신이 끊기다니.
    ja: |-
      妙なことが起きたものですねぇ。
      エデンの通信に障害など…
  d_main_46_04_35:
    speaker: nayuta
    en: In any case, "Find whatever you can and then fall back." Words most ill-advised,
      and yet...
    ko: |-
      그나저나 뭐라도 알아낸 후 복귀라….
      천부당만부당한 말이오만….
    ja: |-
      それにしても、何でもいいから
      突き止めて帰れとは…
      ずいぶんと厳しいお言葉ですねぇ。
  d_main_46_04_36:
    speaker: snowwhite_h
    en: Let's go. We'll avoid the areas where there are too many Raptures.
    ko: 가자. 랩쳐 놈들이 적어 보이는 곳으로 가겠다.
    ja: 行くぞ。手薄そうな場所を探す。
  d_main_46_04_37:
    speaker: snowwhite_h
    en: Playing it safe will gain us nothing.
    ko: 몸을 사려서는 아무것도 얻을 수 없다.
    ja: 動かなければ、得られるものもないからな。
  d_main_46_04_38:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_39:
    speaker: nayuta
    en: Very well. I shall entrust this matter to thee.
    ko: 좋소. 부탁하외다.
    ja: 分かりました。後に続きます。
  d_main_46_04_40:
    speaker: mirror_r
    en: My, my. They say people lose their heads when cornered. Guess it's true after
      all.
    ko: 세상에. 궁지에 몰리면 바보가 된다더니. 정말인가 보네요?
    ja: |-
      あらあら。追い詰められると
      知能が低下すると言うのは
      事実だったようですね？
  d_main_46_04_41:
    speaker: mirror_r
    en: Don't go rushing in now. You'll get yourself killed.
    ko: 함부로 가지 마요. 죽으니까.
    ja: |-
      軽々しく近づくのはやめるべきです。
      死んでしまいますよ。
  d_main_46_04_42:
    speaker: nayuta
    en: Young Lady Mirror...
    ko: 미러… 소저….
    ja: 出ましたか…ミラー…
  d_main_46_04_43:
    speaker: janghwa_n
    en: Hello.
    ko: 안녕?
    ja: また会ったわね？
  d_main_46_04_44:
    speaker: nayuta
    en: Swordwarden.
    ko: 호위 무사 소저.
    ja: それに、お付きの方も。
  d_main_46_04_45:
    speaker: snowwhite_h
    en: "... Who are they?"
    ko: "…누구지?"
    ja: "…誰だ？"
  d_main_46_04_46:
    speaker: mirror_r
    en: Snow White. Youngest member of the Goddess Squad. The fourth Grimms Model.
      The White Reaper of the Horizon.
    ko: |-
      …스노우 화이트. 갓데스 스쿼드의 막내.
      4번째 페어리 테일 모델. 지평선의 하얀 사신.
    ja: |-
      …スノーホワイト、ゴッデス部隊の末っ子、
      フェアリーテールモデル・ナンバー4、
      地平線の白き死神。
  d_main_46_04_47:
    speaker: mirror_r
    en: What an honor to have such a distinguished guest.
    ko: 귀한 분이 와주셨네요.
    ja: ここでお会いできるなんて、光栄ですね。
  d_main_46_04_48:
    speaker: snowwhite_h
    en: "... Identify yourself."
    ko: "…누구냐."
    ja: "…誰だ。"
  d_main_46_04_49:
    speaker: mirror_r
    en: Pleasure meeting you.
    ko: 처음 뵐게요.
    ja: 初めまして。
  d_main_46_04_50:
    speaker: mirror_r
    en: The name's Mirror.
    ko: 저는 미러.
    ja: 私はミラー。
  d_main_46_04_51:
    speaker: mirror_r
    en: I'm an old friend of Nayuta's.
    ko: 나유타와는 오랜 친구랍니다.
    ja: ナユタとは古くからのお友だちです。
  d_main_46_04_52:
    speaker: snowwhite_h
    en: Someone like her wouldn't have any friends, so who are you?
    ko: 저 녀석에게 친구가 있을 리가 없다. 누구지?
    ja: |-
      ナユタに友だちなどいるはずがない。
      何者だ。
  d_main_46_04_53:
    speaker: mirror_r
    en: Goodness, quite perceptive, aren't you?
    ko: 어머. 통찰력이 굉장하시군요?
    ja: あら。よく分かっていますね？
  d_main_46_04_54:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_55:
    speaker: "<Narration>"
    en: Snow White reaches out toward Mirror.
    ko: 스노우 화이트가 미러에게 손을 뻗는다.
    ja: スノーホワイトがミラーに手を伸ばした
  d_main_46_04_56:
    speaker: "<Narration>"
    en: Her hand passes straight through her. The point of contact crackles with static.
    ko: |-
      스노우 화이트의 손이 미러를 뚫고 지나간다.
      손과 닿은 부분이 지직거리며 노이즈가 발생한다.
    ja: |-
      伸ばした手はミラーをすり抜け、
      乱れた通信機器の映像のようなノイズが
      触れたはずの部分に生まれた
  d_main_46_04_57:
    speaker: snowwhite_h
    en: You're just a hologram.
    ko: 홀로그램이군.
    ja: 立体映像か。
  d_main_46_04_58:
    speaker: mirror_r
    en: Yes.
    ko: 예.
    ja: ええ。
  d_main_46_04_59:
    speaker: snowwhite_h
    en: You're the one who cut our communications with Johan and Cecil?
    ko: 요한과 세실의 통신을 끊은 게 너인가?
    ja: 通信妨害しているのも貴様だな？
  d_main_46_04_60:
    speaker: mirror_r
    en: Mmhm, guilty as charged. I've nothing to gain from making my presence known,
      you know.
    ko: |-
      음. 맞아요.
      모습을 보여서 좋을게 없으니까요.
    ja: |-
      はい、その通りです。
      見られると良いことがありませんから。
  d_main_46_04_61:
    speaker: snowwhite_h
    en: Just what are you?
    ko: 넌 뭐지?
    ja: お前は何だ？
  d_main_46_04_62:
    speaker: mirror_r
    en: I already told you. I'm Nayuta's associate.
    ko: 말씀드렸잖아요. 나유타의 동업자라고.
    ja: 言ったとおり、ナユタのお友だちです。
  d_main_46_04_63:
    speaker: mirror_r
    en: At the moment... yes, I'm acting as a spy and pretending to side with the
      Raptures.
    ko: 지금은… 그래요. 랩쳐의 편인 척 스파이 짓을 하고 있어요.
    ja: |-
      今は…そうですね。
      ラプチャーの味方のふりをして、
      スパイ活動中というところでしょうか。
  d_main_46_04_64:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_65:
    speaker: mirror_r
    en: Hehe, it's been a while since I've been greeted with such distrust.
    ko: |-
      후후. 오랜만이네요.
      이런 불신에 가득한 눈빛을 받는 게.
    ja: |-
      ふふっ…久しぶりです。
      そういう強い疑いの目を向けられるのは。
  d_main_46_04_66:
    speaker: mirror_r
    en: Nayuta, could you please say something?
    ko: 나유타. 뭐라고 얘기 좀 해주시겠어요?
    ja: ナユタも、何か言ってあげてください。
  d_main_46_04_67:
    speaker: mirror_r
    en: My character is in doubt before I've even had the chance to relay any useful
      information.
    ko: |-
      이러다가 의심만 받다가 끝나겠어요.
      [좋은 정보]를 주기도 전에 말이죠.
    ja: |-
      このままでは、疑われるだけで
      終わってしまいそうです。
      せっかく「おいしい情報」を用意したのに。
  d_main_46_04_68:
    speaker: nayuta
    en: "... She speaks the truth, White Snow."
    ko: "…백설 소저. 미러 소저의 말이 맞소."
    ja: |-
      …白雪、ミラーの言っていることは
      間違いありません。
  d_main_46_04_69:
    speaker: nayuta
    en: She is indeed my associate. It is likewise true that she hath taken to the
      Raptures' side, carrying out espionage.
    ko: |-
      미러 소저는 소인의 동업자요.
      랩쳐 측에 붙어서 스파이 짓을 하고 있는 것도 맞소.
    ja: |-
      ミラーと私は協力して、
      ラプチャー側の情報を探っているのです。
  d_main_46_04_70:
    speaker: mirror_r
    en: There you have it.
    ko: 그렇다네요?
    ja: お分かりいただけましたか？
  d_main_46_04_71:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_04_72:
    speaker: snowwhite_h
    en: Fine. I'll take your word for it.
    ko: 좋다. 믿겠다.
    ja: いいだろう。信じる。
  d_main_46_04_73:
    speaker: mirror_r
    en: Hehe, much appreciated.
    ko: 후후. 고마워요.
    ja: ふふ、ありがとうございます。
  d_main_46_04_74:
    speaker: mirror_r
    en: Now then, shall I show you around?
    ko: 자, 그럼 제가 안내를 좀 해드려도 될까요?
    ja: ここから先は、案内をお任せいただけますか？
  d_main_46_04_75:
    speaker: mirror_r
    en: There is quite a lot I need to convey regarding the current situation.
    ko: 지금 상황에 대해 전달해 드릴게 많아요.
    ja: お伝えすることがたくさんありますから。
d_main_46_05:
  d_main_46_05_1:
    speaker: mirror_r
    en: After the battle at Eden, the first thing the Queen did
    ko: 에덴에서의 전투 이후 퀸이 가장 먼저 한 일은.
    ja: |-
      エデンから撤退した後、
      クイーンが何よりも先にしたことは…
  d_main_46_05_2:
    speaker: mirror_r
    en: was roam around, surveying the surface.
    ko: 이곳저곳을 돌아보는 것이었어요.
    ja: 各地を飛び回ることでした。
  d_main_46_05_3:
    speaker: mirror_r
    en: She looked like some legendary hero wandering the surface, riding atop Storm
      Bringer.
    ko: |-
      스톰 브링어를 타고 지상을 돌아다니는 게,
      무슨 전설의 용사라도 보는 줄 알았죠.
    ja: |-
      ストームブリンガーに乗って世界を巡る姿は
      まるで伝説の勇者のようで、
      堂々としていましたね。
  d_main_46_05_4:
    speaker: mirror_r
    en: I watched to see how long she would continue in this vein,
    ko: 언제까지 그러나 지켜보고 있었는데.
    ja: |-
      いつまで続けるつもりかと、
      見守っていたところ…
  d_main_46_05_5:
    speaker: mirror_r
    en: when she settled at the Lift without warning.
    ko: 돌연, 궤도 엘리베이터에 자리를 잡았어요.
    ja: |-
      突然軌道エレベーターに降り立ち、
      そこから動かなくなりました。
  d_main_46_05_6:
    speaker: mirror_r
    en: She began overhauling the derelict equipment within,
    ko: 죽어있던 내부 시설을 뜯어고치기 시작했죠.
    ja: |-
      それ以来、崩壊した内部構造の
      改造を進めています。
  d_main_46_05_7:
    speaker: mirror_r
    en: turning it into Rapture production facilities.
    ko: 랩쳐 생산 시설로요.
    ja: ラプチャーの製造施設にしているようです。
  d_main_46_05_8:
    speaker: nayuta
    en: You would have me believe she hath built a factory?
    ko: "…공장을, 지었다는 말이오?"
    ja: "…工場に改造したということですか？"
  d_main_46_05_9:
    speaker: mirror_r
    en: Yes, she converted everything in one go.
    ko: 예. 단숨에 개조해 버렸어요.
    ja: ええ。驚異的な速度で。
  d_main_46_05_10:
    speaker: mirror_r
    en: Humanity's finest technology was already concentrated there, so there was
      plenty to work with and the overhaul wasn't challenging.
    ko: |-
      애초에 인간의 모든 기술력이 집약되어 있던 장소라,
      좋은 것들이 잔뜩 있어서 개조는 어렵지 않았어요.
    ja: |-
      もともと人類の叡智が
      詰め込まれた建造物でしたから、
      素材には困らなかったのでしょう。
  d_main_46_05_11:
    speaker: mirror_r
    en: She tinkered away at it, then began to produce Raptures like it was nothing.
    ko: |-
      그렇게 뚝딱뚝딱 개조하더니,
      당연하다는 듯이 랩쳐들을 생산해 내기 시작했죠.
    ja: |-
      瞬く間に改造が進み、
      続々とラプチャーの製造が始まりました。
  d_main_46_05_12:
    speaker: nayuta
    en: Whence came the materials?
    ko: 재료가 없지 않소.
    ja: その材料はどこからでしょう。
  d_main_46_05_13:
    speaker: nayuta
    en: Even the Queen cannot conjure something from naught...
    ko: 제아무리 퀸이라 할지라도 무에서 유를 창조할 수는 없….
    ja: |-
      いかにクイーンといえども、
      無から有を生み出すことは不可能のはず…
  d_main_46_05_14:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_15:
    speaker: mirror_r
    en: Seems like you've figured something out. Let's hear it.
    ko: |-
      뭔가 짐작 가는 게 있는 모양이네요.
      말씀해 주세요.
    ja: |-
      見当がついたようですね。
      聞かせてください。
  d_main_46_05_16:
    speaker: nayuta
    en: "... Doth the Queen tear it all asunder?"
    ko: "…갈아엎는 것이오? 퀸은."
    ja: "…作り直している？"
  d_main_46_05_17:
    speaker: mirror_r
    en: You've got it.
    ko: 정답이에요.
    ja: その通りです。
  d_main_46_05_18:
    speaker: mirror_r
    en: The Queen was deeply dissatisfied with the current state of the surface after
      surveying it.
    ko: 지상을 한번 쭉 둘러본 퀸은 지금의 지상이 너무 맘에 들지 않았어요.
    ja: |-
      地上を見て回ったクイーンは、
      現在の様子が気に入らなかった。
  d_main_46_05_19:
    speaker: mirror_r
    en: So she made a decision.
    ko: 그래서 결정했죠.
    ja: その時、意思を固めたようです。
  d_main_46_05_20:
    speaker: mirror_r
    en: She would wipe the slate clean,
    ko: 아, 여기 다 갈아엎어야겠다.
    ja: 何もかも、作り直さなければならないと。
  d_main_46_05_21:
    speaker: mirror_r
    en: since the surface wasn't one she envisioned.
    ko: 내가 원하던 지상의 모습이 아니야.
    ja: |-
      現在の地上は、クイーンの理想に
      かなう場所ではなかったようですね。
  d_main_46_05_22:
    speaker: mirror_r
    en: And just like that, she started producing Raptures at the Lift.
    ko: 그러고는 바로 궤도 엘리베이터에서 랩쳐들을 생산하기 시작했는데.
    ja: |-
      それからすぐに、軌道エレベーターが
      ラプチャーの工場になりました。
  d_main_46_05_23:
    speaker: nayuta
    en: I see. She hath created Raptures that are unlike any known to us now.
    ko: 지금의 랩쳐들과는 다른 것들을 만들어낸 것이로군.
    ja: |-
      これまでと違うラプチャーが
      現れ始めたのは、そのせいでしたか。
  d_main_46_05_24:
    speaker: mirror_r
    en: Yes.
    ko: 맞아요.
    ja: はい。
  d_main_46_05_25:
    speaker: mirror_r
    en: She used existing Raptures as raw material,
    ko: 지금의 랩쳐들을 재료로 사용해서.
    ja: 旧いラプチャーを材料に…
  d_main_46_05_26:
    speaker: mirror_r
    en: and created entirely new ones.
    ko: 새로운 랩쳐들을 만들어내기 시작했어요.
    ja: 新しいラプチャーを生み始めています。
  d_main_46_05_27:
    speaker: mirror_r
    en: Hehe. These... newborns, shall we call them?
    ko: 후후. [신생]이라고 부르면 너무 거창할까요?
    ja: |-
      ふふっ…「新世代型」…と言うのも
      大げさでしょうか？
  d_main_46_05_28:
    speaker: mirror_r
    en: They're not drastically different from their predecessors performance-wise.
    ko: 뭐 성능이 그렇게 극단적으로 차이가 나진 않아요.
    ja: 実のところ、性能面に大した差はありません。
  d_main_46_05_29:
    speaker: mirror_r
    en: But their appearance... now that's where things get interesting.
    ko: 하지만 그 외형이 재밌죠.
    ja: ですが、見た目の違いは興味深いものです。
  d_main_46_05_30:
    speaker: snowwhite_h
    en: "... They seemed to be imitating human body parts."
    ko: "…인간의 신체 부위를 모방하는 것처럼 보였다."
    ja: "…人間の身体に似せているように見えた。"
  d_main_46_05_31:
    speaker: mirror_r
    en: They're imitating Nikke body parts, to be precise. But visually, there isn't
      much difference between the two.
    ko: |-
      음. 정확히는 니케의 신체 부위지만요.
      뭐 보기에는 둘은 크게 다르지 않으니까요.
    ja: |-
      正確には、ニケのボディですね。
      外観上の大きな違いはありませんが。
  d_main_46_05_32:
    speaker: mirror_r
    en: I believe the battle at Eden brought about a significant shift in the Queen's
      thinking.
    ko: 에덴과의 전투 이후 퀸의 [생각]에는 큰 변화가 있었을거라 생각해요.
    ja: |-
      エデンとの交戦で、クイーンの「思考」に
      大きな変化が発生したものと予想しています。
  d_main_46_05_33:
    speaker: mirror_r
    en: She gathered Raptures and even Heretics as a show of strength, to celebrate
      her descent to the surface.
    ko: 지상에 내려온 기념으로 랩쳐는 물론 헬레틱까지 끌어모아 자신의 힘을 보여주려 했지만.
    ja: |-
      地上に降り立って、ラプチャーはもちろん、
      ヘレティックまで集合させて、
      自分の力を見せつけようとしたら…
  d_main_46_05_34:
    speaker: mirror_r
    en: But the bulk of her forces fell, and you all managed to pull through largely
      unscathed.
    ko: 대부분의 전력이 쓰러졌고, 당신들은 큰 피해 없이 이겨냈으니까요.
    ja: |-
      そのほとんどが返り討ちに遭い、
      致命傷を与えることも出来ずに
      敗北してしまった。
  d_main_46_05_35:
    speaker: mirror_r
    en: Although things ended with her seizing the body of the strongest Nikke, Liliweiss,
    ko: 결과적으로 최강의 니케 릴리바이스의 바디를 강탈한 것으로 상황을 종결시켰지만.
    ja: |-
      結果的には最強のニケ、
      リリーバイスのボディを
      戦利品として持ち帰っていますが…
  d_main_46_05_36:
    speaker: mirror_r
    en: I'm sure that's far from a satisfying result to the Queen.
    ko: 퀸 입장에서는 썩 만족스러운 결과가 아니었겠죠.
    ja: |-
      クイーンとしては
      満足のいく戦果ではなかったはずです。
  d_main_46_05_37:
    speaker: mirror_r
    en: She must have concluded that the current Raptures simply weren't powerful
      enough,
    ko: 그 이유를 지금의 랩쳐가 강하지 않았다고 생각했을 테고.
    ja: |-
      そのような惨敗を喫したのは、
      今のラプチャーが弱いから。
  d_main_46_05_38:
    speaker: mirror_r
    en: and felt a generational shift was needed.
    ko: 세대교체가 필요하다고 느꼈겠죠.
    ja: 世代交代が必要だと考えるのは当然の帰結です。
  d_main_46_05_39:
    speaker: mirror_r
    en: Otherwise, she wouldn't have gone out of her way to create newborn Raptures
      modeled after you Nikkes.
    ko: 그렇지 않으면 당신들 니케의 모습을 흉내낸 신생 랩쳐를 만들어내진 않았을 테니까.
    ja: |-
      そうでなければ、
      新世代型がニケを模倣している
      説明がつきません。
  d_main_46_05_40:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_41:
    speaker: snowwhite_h
    en: How repulsive.
    ko: 불쾌하군.
    ja: 気に入らないな。
  d_main_46_05_42:
    speaker: nayuta
    en: No core could be discerned in these newly born Raptures.
    ko: 신생 랩쳐들에게서는 코어가 보이지 않았소.
    ja: 新世代型には、コアが見当たりませんでした。
  d_main_46_05_43:
    speaker: nayuta
    en: Then whence do they draw their power?
    ko: 그럼 어디에서 동력을 가져오는 것이오?
    ja: 動力はどこから？
  d_main_46_05_44:
    speaker: mirror_r
    en: From Dark Matter.
    ko: 다크 매터요.
    ja: ダークマターです。
  d_main_46_05_45:
    speaker: nayuta
    en: Caliginous Material...
    ko: 암흑 물질….
    ja: 暗黒物質…
  d_main_46_05_46:
    speaker: mirror_r
    en: They use highly condensed Dark Matter as a power source. It's a versatile
      substance, so using it that way is certainly feasible.
    ko: |-
      다크 매터를 극도로 응축해 동력원으로 사용해요.
      만능 물질이니, 동력원으로 쓰는 것도 가능하겠죠.
    ja: |-
      凝縮させたダークマターですね。
      全能の物質と言うぐらいですから、
      動力源としても使えるのでしょう。
  d_main_46_05_47:
    speaker: mirror_r
    en: I don't know much beyond that. But since Dark Matter is the Queen's to begin
      with, she is another matter entirely.
    ko: |-
      저도 그것에 대해서는 잘 몰라요.
      하지만 퀸은 다르죠. 애초에 자기 것이었으니까.
    ja: |-
      私も詳しくは分かっていません。
      ですが、クイーンはよく知っているはずです。
      そもそも自分にあったものですから。
  d_main_46_05_48:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_49:
    speaker: snowwhite_h
    en: So, in short, after fighting us, the Queen became jealous of us.
    ko: 요약하자면, 퀸은 우리와의 전투 후 우리가 너무 부러워서.
    ja: |-
      つまり、クイーンはあの戦いの後、
      私たちがうらやましくなった。
  d_main_46_05_50:
    speaker: snowwhite_h
    en: Which led to her creating new Raptures in our image.
    ko: 그 모습을 흉내 낸 새로운 랩쳐들을 만들고 있는 것이군.
    ja: |-
      だから、形をまねて新しいラプチャーを
      生み出している…ということか。
  d_main_46_05_51:
    speaker: mirror_r
    en: That about sums it up, yes.
    ko: 요약하자면 그렇죠.
    ja: そういうことになりますね。
  d_main_46_05_52:
    speaker: nayuta
    en: Yet the manner of their imitation is most suspect.
    ko: 허나 그 흉내 내는 모습이 썩 의심스럽소.
    ja: |-
      しかし、模倣のしかたが
      何とも奇妙ではありませんかねぇ。
  d_main_46_05_53:
    speaker: nayuta
    en: If the Queen deemed Nikkes powerful, one would expect their forms to be imitated
      in every particular.
    ko: 니케가 강하다고 생각되면 니케의 모습을 그대로 흉내 내는 것이 보통이거늘.
    ja: |-
      ニケの強さを再現したいなら、
      姿をそっくり模倣すればいいものを…
  d_main_46_05_54:
    speaker: nayuta
    en: And yet the manner of imitation here is most peculiar.
    ko: 퍽이나 이상하게 흉내내고 있소.
    ja: なぜそうしないのでしょう。
  d_main_46_05_55:
    speaker: nayuta
    en: Only hands, feet, viscera and the like doth she see fit to replicate.
    ko: 손, 발, 내장 기관 등의 일부만 흉내 내고 있는 것이외다.
    ja: |-
      手にせよ、足にせよ、内臓にせよ…
      一部のみを取ってつけたように作るとは。
  d_main_46_05_56:
    speaker: mirror_r
    en: Hmm, well...
    ko: 음. 그건….
    ja: ああ、それは…
  d_main_46_05_57:
    speaker: mirror_r
    en: They're experiments.
    ko: 실험이에요.
    ja: 実験ですから。
  d_main_46_05_58:
    speaker: mirror_r
    en: She attaches Nikke parts to low-level Raptures to see if they function properly,
    ko: 하위 랩쳐들에게 니케의 일부를 달아 그것이 제대로 작동하는지를 파악하고.
    ja: |-
      下級のラプチャーにパーツを接着し、
      正常に作動するか確かめる。
  d_main_46_05_59:
    speaker: mirror_r
    en: and to assess the potential of those parts.
    ko: 그 부위들이 얼마만큼의 가능성이 있는지 파악하는 거죠.
    ja: |-
      そのパーツにどれほどの可能性があるのかを
      確かめているようです。
  d_main_46_05_60:
    speaker: nayuta
    en: If this be true, the Queen's final intent is...
    ko: 그렇다면, 퀸이 최종적으로 하고자 하려는 일은….
    ja: となると、クイーンの最終的な目的は…
  d_main_46_05_61:
    speaker: mirror_r
    en: That's right. To create a new Heretic.
    ko: 예. 새로운 헬레틱의 창조에요.
    ja: そうですね。新世代型のヘレティック。
  d_main_46_05_62:
    speaker: mirror_r
    en: The Queen's so-called elites proved rather lackluster in the battle at Eden,
      wouldn't you say?
    ko: 퀸의 정예라는 이름이, 에덴전에서는 무색했잖아요?
    ja: |-
      クイーンの精鋭という面目が、
      エデンとの戦いで
      すっかりつぶれてしまいましたからね？
  d_main_46_05_63:
    speaker: mirror_r
    en: She wants to create a true elite. One worthy of the Queen she is today.
    ko: 지금의 퀸에게 어울릴법한, 진짜 정예를 만들고 싶은거죠.
    ja: |-
      今のクイーンにふさわしい、
      本物の精鋭を作り出したいのでしょう。
  d_main_46_05_64:
    speaker: snowwhite_h
    en: "... Altruia."
    ko: "…앨트루이아."
    ja: "…アルトルイアか。"
  d_main_46_05_65:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_66:
    speaker: mirror_r
    en: How do you know about her?
    ko: 어떻게 알죠?
    ja: なぜその名を？
  d_main_46_05_67:
    speaker: snowwhite_h
    en: We've met. She even transformed during our fight.
    ko: 만난 적 있다. 교전했고, 놈은 거대화까지 했지.
    ja: |-
      会ったことがある。
      交戦して、巨大化形態も見た。
  d_main_46_05_68:
    speaker: mirror_r
    en: My goodness... she really does whatever she pleases.
    ko: 아… 하여간 참 멋대로라니까요.
    ja: あらあら…ずいぶんやんちゃですね。
  d_main_46_05_69:
    speaker: snowwhite_h
    en: She was mimicking Rapunzel and Noah.
    ko: 라푼젤과 노아를 흉내 내고 있더군.
    ja: ラプンツェルとノアを真似ていた。
  d_main_46_05_70:
    speaker: mirror_r
    en: That's right.
    ko: 맞아요.
    ja: お分かりのようですね。
  d_main_46_05_71:
    speaker: mirror_r
    en: The Queen picked the ones who stood out most to her during the battle at Eden
      and modeled her Heretics after them.
    ko: 에덴전에서 특히나 퀸에게 강렬한 인상을 남긴 이들을 흉내 내 헬레틱으로 만들었어요.
    ja: |-
      おそらくエデンとの戦いで
      よほどクイーンの印象に残ったのでしょう。
      明らかに、彼女たちを参考にしています。
  d_main_46_05_72:
    speaker: mirror_r
    en: Two have been created, and one is still in the making.
    ko: 둘은 만들었고, 하나는 만드는 중이죠.
    ja: |-
      現在完成しているものは2体、
      もう1体が製造中です。
  d_main_46_05_73:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_74:
    speaker: snowwhite_h
    en: You know a lot.
    ko: 너는 많은 걸 알고 있군.
    ja: お前は何でも知っているな。
  d_main_46_05_75:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_76:
    speaker: snowwhite_h
    en: Who are you, really? What's your angle?
    ko: 너는 뭐지. 목적이 뭐냐.
    ja: 何者だ？何が目的だ。
  d_main_46_05_77:
    speaker: mirror_r
    en: I want a new Queen.
    ko: 저는 새로운 퀸을 원해요.
    ja: 私は新たなクイーンを望んでいます。
  d_main_46_05_78:
    speaker: snowwhite_h
    en: Why?
    ko: 왜.
    ja: なぜだ。
  d_main_46_05_79:
    speaker: "<Narration>"
    en: Mirror looks at the Lift.
    ko: 미러는 궤도 엘리베이터를 바라본다.
    ja: ミラーは軌道エレベーターに向き直った
  d_main_46_05_80:
    speaker: mirror_r
    en: Because I don't like the current Queen.
    ko: 지금 퀸은 마음에 안 드니까요.
    ja: 今のクイーンが気に入らないからです。
  d_main_46_05_81:
    speaker: snowwhite_h
    en: You're hardly the trustworthy type.
    ko: 신용이 안 가는 녀석이군.
    ja: 信用ならないな。
  d_main_46_05_82:
    speaker: mirror_r
    en: That stings, especially after I shared such valuable intel.
    ko: 이런 고급 정보를 드렸는데도 그렇게 말씀하시니 좀 섭섭하네요.
    ja: |-
      とても大事な秘密を教えたのに、
      傷ついてしまいますね。
  d_main_46_05_83:
    speaker: mirror_r
    en: You must trust me.
    ko: 당신들은 저를 믿어야 해요.
    ja: あなたも私を信用するべきです。
  d_main_46_05_84:
    speaker: mirror_r
    en: I've been doing all kinds of dirty work at the Queen's side to obtain this
      precious information, and I'm giving it to you with no strings attached.
    ko: 퀸의 옆에서 이런저런 궂은일을 하면서 얻어낸 소중한 정보를, 당신들에게 아무런 조건 없이 주고 있잖아요?
    ja: |-
      クイーンの雑用をしながら集めた
      貴重な情報を、
      タダでお分けしているのですよ？
  d_main_46_05_85:
    speaker: snowwhite_h
    en: Yes, that's been bothering me too.
    ko: 그래. 그것도 신경 쓰인다.
    ja: ああ。そこも引っかかる。
  d_main_46_05_86:
    speaker: snowwhite_h
    en: What is your relationship with the Queen? How do you know all of this?
    ko: |-
      퀸과 너는 무슨 사이지?
      너는 왜 그런 정보들을 다 알고 있는거냐.
    ja: |-
      クイーンとお前はどういう関係だ？
      なぜここまでの情報を握っている。
  d_main_46_05_87:
    speaker: mirror_r
    en: I've had a hand in the overhaul of the Lift, the design of the newborn Raptures,
      and in the creation of the new Heretics of course.
    ko: 궤도 엘리베이터의 개조라던가, 신생 랩쳐 설계라던가, 새로운 헬레틱을 만들고 있죠.
    ja: |-
      私は軌道エレベーターの改造にも、
      新世代ラプチャーとヘレティックの
      設計開発にも、全てに関わっています。
  d_main_46_05_88:
    speaker: snowwhite_h
    en: "... What did you just say?"
    ko: "…뭐라고."
    ja: "…何だと？"
  d_main_46_05_89:
    speaker: mirror_r
    en: Don't look at me like I'm the mastermind behind all of this.
    ko: 너무 그렇게 저를 원흉 보듯이 보지 말아요.
    ja: そんなに怖い目でにらまないでください。
  d_main_46_05_90:
    speaker: mirror_r
    en: If Queen grows suspicious of me, any chance of a counterattack is gone for
      good, since you'll lose your only source of information.
    ko: |-
      퀸이 저를 의심하면 반격의 기회를 영영 잃는 거예요.
      당신들에게 가는 정보가 하나도 없을 테니까.
    ja: |-
      私がクイーンに疑われれば、
      反撃の機会は永遠に失われます。
      あなたたちに他の情報源はないでしょうから。
  d_main_46_05_91:
    speaker: mirror_r
    en: I'll tell you everything I know.
    ko: 저는 알고 있는 모든 정보를 당신들에게 줄 거고.
    ja: |-
      私は知っていることをすべて、
      あなたたちにお教えします。
  d_main_46_05_92:
    speaker: mirror_r
    en: And you'll use that information to kill the Queen.
    ko: 당신들은 이 정보를 활용해 퀸을 죽여야 해요.
    ja: |-
      あなた方はその情報を利用し、
      クイーンを倒せばいいだけです。
  d_main_46_05_93:
    speaker: snowwhite_h
    en: Assuming any of what you're saying is true.
    ko: 네가 하는 말이 진짜라면 말이지.
    ja: お前の言っていることが事実であればな。
  d_main_46_05_94:
    speaker: mirror_r
    en: What other choice do you have?
    ko: 선택의 여지가 있나요?
    ja: 選択の余地があるとでも？
  d_main_46_05_95:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_05_96:
    speaker: mirror_r
    en: Believe me or don't. That's entirely up to you.
    ko: 믿든 안 믿든 그건 당신들 자유예요.
    ja: 信じるか信じないかは、お好きなように。
  d_main_46_05_97:
    speaker: mirror_r
    en: Frankly, I couldn't care less whether you win or lose.
    ko: |-
      솔직히 상관없거든요.
      당신들이 이기든 지든.
    ja: |-
      正直なところ、私にとって
      勝つのはどちらでも構わないのです。
  d_main_46_05_98:
    speaker: mirror_r
    en: I'll simply side with whoever wins.
    ko: 저는 이기는 쪽에 붙으면 그만이니까.
    ja: 私は勝つ方につくだけのことですから。
  d_main_46_05_99:
    speaker: nayuta
    en: How enviable, to hold such clear convictions.
    ko: 사상이 뚜렷해서 참 부럽소.
    ja: 迷いが無くてうらやましい限りですねぇ。
  d_main_46_05_100:
    speaker: mirror_r
    en: Now, let's get moving.
    ko: 자, 계속 가죠.
    ja: さあ、先へ進みましょう。
  d_main_46_05_101:
    speaker: mirror_r
    en: This isn't a place you can visit often, so take in as much as you can.
    ko: 자주 올 수 있는 곳이 아니니 최대한 눈에 담아가세요.
    ja: |-
      何度も来られる場所ではありませんよ。
      しっかりと目に焼きつけておいてください。
d_main_46_06:
  d_main_46_06_1:
    speaker: "<Narration>"
    en: Snow White and Nayuta follow along the path Mirror leads them down.
    ko: 스노우 화이트와 나유타는 미러가 안내하는 길을 따라 이동한다.
    ja: |-
      スノーホワイトとナユタは
      ミラーに導かれるまま進んだ
  d_main_46_06_2:
    speaker: "<Narration>"
    en: They get into a few skirmishes with Raptures, but they are small-scale.
    ko: 랩쳐들과의 전투가 있었지만, 소규모 전투다.
    ja: |-
      途中でラプチャーとの遭遇はあったが、
      小規模な戦闘だけで済んだ
  d_main_46_06_3:
    speaker: "<Narration>"
    en: The commotion is not big enough to draw in additional Raptures.
    ko: 주위의 랩쳐들을 불러들일 정도로 소란이 일어나지도 않았다.
    ja: |-
      周辺のラプチャーが
      興味を持つほどの騒ぎにもならない
  d_main_46_06_4:
    speaker: "<Narration>"
    en: Rose shares a brief exchange with Mirror, who nods at her words.
    ko: 장화가 미러와 대화를 나눈다.
    ja: 薔花がミラーに何かをささやいた
  d_main_46_06_5:
    speaker: "<Narration>"
    en: Then, Rose slows her pace,
    ko: |-
      장화의 말을 듣고 있던 미러가 고개를 끄덕이고,
      장화가 걸음을 늦춘다.
    ja: |-
      それを聞いたミラーがうなずくと、
      薔花は歩みを遅らせ…
  d_main_46_06_6:
    speaker: "<Narration>"
    en: and falls into step beside Snow White.
    ko: 그리고 스노우 화이트와 나란히 걷는다.
    ja: スノーホワイトの横に並んだ
  d_main_46_06_7:
    speaker: janghwa_n
    en: Can I talk to you for a moment?
    ko: 잠깐 괜찮을까?
    ja: ちょっといい？
  d_main_46_06_8:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_9:
    speaker: janghwa_n
    en: Is this a bad time?
    ko: 안 괜찮아?
    ja: やっぱりダメ？
  d_main_46_06_10:
    speaker: snowwhite_h
    en: You look like her.
    ko: 닮았군.
    ja: 似ているな。
  d_main_46_06_11:
    speaker: snowwhite_h
    en: Scarlet.
    ko: 홍련과.
    ja: 紅蓮と。
  d_main_46_06_12:
    speaker: janghwa_n
    en: Of course, we were in the same squad after all.
    ko: |-
      그럴 수밖에.
      같은 스쿼드였으니까.
    ja: |-
      当たり前ね。
      同じ部隊だったんだから。
  d_main_46_06_13:
    speaker: snowwhite_h
    en: A squad that specialized in close combat, made up of mass-produced Nikkes,
      right?
    ko: 양산형 니케들로 이뤄진 근접전용 스쿼드였던가.
    ja: 近接戦闘用の量産型部隊…だったか。
  d_main_46_06_14:
    speaker: janghwa_n
    en: You remember all that? You have a good memory.
    ko: 기억력 좋네? 그걸 다 기억하고 있어?
    ja: よく知ってたわね？昔のことを覚えてるの？
  d_main_46_06_15:
    speaker: snowwhite_h
    en: Those are recent memories to me.
    ko: 내 기준으로는 최근 기억이니까 기억하고 있다.
    ja: 私にとっては最近のことだ。
  d_main_46_06_16:
    speaker: janghwa_n
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_46_06_17:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_18:
    speaker: snowwhite_h
    en: Scarlet is alive. Her brain is, at least.
    ko: 홍련은 무사하다. 뇌뿐이지만.
    ja: 紅蓮はまだ生きている。脳だけだがな。
  d_main_46_06_19:
    speaker: snowwhite_h
    en: Eden currently doesn't have the technology to produce a Nikke, but once that's
      secured, she can be revived.
    ko: |-
      니케 제작 기술이 현재 에덴에는 없지만,
      그것만 확보된다면 되살아날 수 있다고 하더군.
    ja: |-
      今のエデンにはニケの製造技術がない。
      それさえ手に入れば復活できるらしい。
  d_main_46_06_20:
    speaker: janghwa_n
    en: "... So you caught on."
    ko: "…눈치챘구나?"
    ja: "…気づいてたのね？"
  d_main_46_06_21:
    speaker: snowwhite_h
    en: Yes.
    ko: 그래.
    ja: ああ。
  d_main_46_06_22:
    speaker: snowwhite_h
    en: Scarlet often told me about her sister.
    ko: 홍련에게 언니에 대한 이야기는 자주 들었으니까.
    ja: 紅蓮がよく話していた。
  d_main_46_06_23:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_24:
    speaker: snowwhite_h
    en: Why did you come back to life?
    ko: 뭐 하러 다시 살아났지?
    ja: 何のために還ってきた？
  d_main_46_06_25:
    speaker: janghwa_n
    en: I didn't choose this. Mirror revived me on her own.
    ko: |-
      내가 그러고 싶어서 그런 건 아니야.
      미러가 멋대로 되살렸어.
    ja: |-
      私だってこうなりたかったわけじゃないの。
      ミラーが勝手にやったこと。
  d_main_46_06_26:
    speaker: janghwa_n
    en: What was it she said. Something about needing someone who could cut through
      anything.
    ko: 뭐라더라. 뭐든 벨 수 있는 존재가 필요하다던가.
    ja: |-
      何だっけ。
      なんでも斬れる人が欲しかった～とか。
  d_main_46_06_27:
    speaker: janghwa_n
    en: As you can see, I'm more or less her bodyguard right now.
    ko: 지금은 보다시피 미러의 호위 무사 비슷한 상태야.
    ja: |-
      分かってると思うけど、
      今はミラーの付き人みたいな感じ。
  d_main_46_06_28:
    speaker: snowwhite_h
    en: Then what are you still alive for?
    ko: 뭘 위해서 계속 살아있지?
    ja: 何のために生き続けている？
  d_main_46_06_29:
    speaker: janghwa_n
    en: That's harsh.
    ko: 너무한 말을 하는걸.
    ja: ずいぶんキツい言い方ね。
  d_main_46_06_30:
    speaker: snowwhite_h
    en: You placed a curse on Scarlet and died.
    ko: 홍련에게 주박을 걸고, 너는 죽었다.
    ja: お前は紅蓮に呪いをかけて、死んだ。
  d_main_46_06_31:
    speaker: snowwhite_h
    en: Just as you intended.
    ko: 네 의도대로.
    ja: お前の思い通りになった。
  d_main_46_06_32:
    speaker: snowwhite_h
    en: What unfinished business do you have left?
    ko: 무슨 미련이 남아있는 거지.
    ja: なら、何の未練がある。
  d_main_46_06_33:
    speaker: janghwa_n
    en: "... A curse?"
    ko: "…주박."
    ja: "…呪い？"
  d_main_46_06_34:
    speaker: snowwhite_h
    en: Yes. A curse.
    ko: 그래. 주박이다.
    ja: そうだ。呪いだ。
  d_main_46_06_35:
    speaker: snowwhite_h
    en: Scarlet was always obsessed with becoming stronger.
    ko: 홍련은 언제나 강해지는 것에 집착했다.
    ja: 紅蓮はずっと、強くなることに縛られていた。
  d_main_46_06_36:
    speaker: snowwhite_h
    en: '"Just like Rose." or "If only Rose were here." She was always muttering things
      like that, thinking no one heard her.'
    ko: |-
      언니처럼. 언니였다면.
      들리지 않을거라 생각했겠지만, 언제나 중얼거렸지.
    ja: |-
      姉さんみたいに。姉さんだったら。
      聞かれていないと思っていたようだが、
      いつもつぶやいていた。
  d_main_46_06_37:
    speaker: snowwhite_h
    en: The curse you placed on Scarlet gave her the strength to push forward, and
      it all worked out in the end.
    ko: |-
      네가 건 주박은 홍련에게 나아갈 힘을 주었고,
      결과적으로는 잘 풀렸지만.
    ja: |-
      お前という呪縛は紅蓮に前へ進む力を与えた。
      結果的には生き延びるための役にたった。
  d_main_46_06_38:
    speaker: snowwhite_h
    en: But as her sister, that's not something you should have done.
    ko: 언니로서 할 일은 아니었다고 생각한다.
    ja: |-
      だが、それが姉のするべきことだったとは
      思わない。
  d_main_46_06_39:
    speaker: janghwa_n
    en: You're right.
    ko: 맞는 말이네.
    ja: その通りね。
  d_main_46_06_40:
    speaker: janghwa_n
    en: That's why I'm still alive.
    ko: 그래서 살아있는 거야.
    ja: だから、生きてるの。
  d_main_46_06_41:
    speaker: snowwhite_h
    en: "?"
    ko: "…?"
    ja: "…？"
  d_main_46_06_42:
    speaker: janghwa_n
    en: Strictly speaking, I cannot die without Mirror's permission and I could disappear
      at any moment on her whim.
    ko: 정확히 얘기하면 죽는 것조차도 미러의 허락을 받아야 하고, 미러의 변덕에 의해 언제 사라져도 이상하지 않지만.
    ja: |-
      本当はどうせ、
      ミラーに許されなきゃ死ねないし、
      気まぐれでいつ消されるかも分からないけど。
  d_main_46_06_43:
    speaker: janghwa_n
    en: But the reason I'm obeying Mirror and trying to stay alive...
    ko: 미러의 말을 충실히 따르면서 계속 살아있기 위해 노력하는 이유는.
    ja: |-
      とりあえず従って、
      生き続けようと思ってるのは…
  d_main_46_06_44:
    speaker: janghwa_n
    en: is because I don't think I've ever given Scar anything good.
    ko: 련이한테 좋은 걸 준 적이 한 번도 없었던 것 같아서야.
    ja: |-
      レンには一度もいいものを
      あげられなかった気がしたから。
  d_main_46_06_45:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_46:
    speaker: janghwa_n
    en: I ruined the squad in the name of helping her and made her kill her own sister
      by her own hand.
    ko: |-
      련이를 위해서라고는 했지만 스쿼드를 망가뜨리고,
      언니를 자기 손으로 죽이게 만들었지.
    ja: |-
      レンのためなんて言いながら
      部隊の仲間を手にかけたうえに、
      姉殺しをさせちゃったから。
  d_main_46_06_47:
    speaker: janghwa_n
    en: I've come to realize what a pathetic and awful sister I was.
    ko: 참 못나고 못된 언니라는 생각이 들더라고.
    ja: ホント、ダメな姉だったと思ってる。
  d_main_46_06_48:
    speaker: janghwa_n
    en: So I want to make it up to her somehow.
    ko: 그래서 뭐라도 해주고 싶었어.
    ja: だから、何かしてあげたいと思ってるの。
  d_main_46_06_49:
    speaker: janghwa_n
    en: I thought if I kept living, maybe I'll get a chance someday.
    ko: 계속 살아있다 보면, 뭐라도 해줄 기회가 오지 않을까 싶어서.
    ja: |-
      生きてれば、何かしてあげられる機会が
      来ることもあるんじゃないかと思って。
  d_main_46_06_50:
    speaker: janghwa_n
    en: But it's not easy.
    ko: 음… 그런데 쉽지 않아.
    ja: ま…簡単にはいきそうにないわね。
  d_main_46_06_51:
    speaker: janghwa_n
    en: Heh, I've never done a single thing right by her, so I really don't know.
    ko: 후후. 뭐 하나 제대로 해준 게 없어서, 아예 모르겠어.
    ja: |-
      あはは…してあげたことなんて
      ひとつもないから、全然分からないの。
  d_main_46_06_52:
    speaker: janghwa_n
    en: I don't know what I could ever do for her.
    ko: 내가 련이에게 뭘 해줄 수 있을지, 아예 모르겠어.
    ja: |-
      私がレンに何をしてあげればいいのか、
      さっぱり。
  d_main_46_06_53:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_54:
    speaker: snowwhite_h
    en: Why not meet with her?
    ko: 만나보지 그랬나.
    ja: 顔を見せてやればいい。
  d_main_46_06_55:
    speaker: janghwa_n
    en: That will never happen.
    ko: 그럴 일은 없을 거야.
    ja: それはダメ。
  d_main_46_06_56:
    speaker: janghwa_n
    en: Showing up in front of Scarlet in my current state wouldn't do her any good.
    ko: 지금의 내가 련이 앞에 나타나봤자 아무 도움도 안 돼.
    ja: |-
      今の私がレンの前に出てったところで、
      何も助けてあげられないから。
  d_main_46_06_57:
    speaker: janghwa_n
    en: I will simply resign myself to the life I'm living,
    ko: 그저 이렇게 휘둘리며 살다가.
    ja: とりあえず、今は振り回されながら生き続けて…
  d_main_46_06_58:
    speaker: janghwa_n
    en: do what I can for her if the opportunity arises.
    ko: 기회가 되면 련이에게 해줄 수 있는 일을 하고.
    ja: |-
      チャンスが来たら、
      レンにできることをしてあげて…
  d_main_46_06_59:
    speaker: janghwa_n
    en: Then I'll disappear quietly.
    ko: 조용히 사라질 거야.
    ja: あとは静かに消えるつもり。
  d_main_46_06_60:
    speaker: janghwa_n
    en: If Scar learned about the state I'm in, she would reach out without hesitation.
    ko: 련이가 지금 내 상태에 대해 알게 되면 반드시 손을 내밀겠지.
    ja: |-
      レンは今の私の状態を知ったら、
      きっと助けようとするでしょ。
  d_main_46_06_61:
    speaker: janghwa_n
    en: But the fact is,
    ko: 그런데 난 있잖아.
    ja: でも、私は…
  d_main_46_06_62:
    speaker: janghwa_n
    en: I'm a broken sword.
    ko: 부러진 검이야.
    ja: もう折れた刃なの。
  d_main_46_06_63:
    speaker: janghwa_n
    en: A blade that wounds whoever holds it.
    ko: 잡는 이를 상처입히는, 부러진 검.
    ja: つかもうとする人を傷つけるだけ。
  d_main_46_06_64:
    speaker: janghwa_n
    en: You get it, don't you?
    ko: 그러니, 알겠지?
    ja: だから…ね？
  d_main_46_06_65:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_66:
    speaker: snowwhite_h
    en: Very well. I won't say a word to Scarlet.
    ko: 그래. 홍련에게는 절대 말하지 않겠다.
    ja: 分かった。紅蓮には言わない。
  d_main_46_06_67:
    speaker: janghwa_n
    en: Hehe. Thank you.
    ko: 후후. 고마워.
    ja: ふふ。安心したわ。
  d_main_46_06_68:
    speaker: janghwa_n
    en: Well, since fate brought us together like this,
    ko: 자, 그럼 이렇게 만난 것도 인연 중의 인연인데.
    ja: そうだ、せっかく会えたんだから…
  d_main_46_06_69:
    speaker: janghwa_n
    en: tell me more about Scar.
    ko: 우리 련이 얘기 좀 해줘.
    ja: レンの話、聞かせて。
  d_main_46_06_70:
    speaker: janghwa_n
    en: How did she end up joining the Goddess Squad, the strongest squad there is?
    ko: 어쩌다가 갓데스라는 최강의 스쿼드에 들어가게 되었는지.
    ja: |-
      どういうきっかけで
      最強のゴッデス部隊に入ったのか、とか…
  d_main_46_06_71:
    speaker: janghwa_n
    en: And what has she accomplished since then?
    ko: 그 이후에 어떤 활약을 펼쳤는지.
    ja: それからどんな活躍をしたか、とか。
  d_main_46_06_72:
    speaker: snowwhite_h
    en: All right.
    ko: 그래.
    ja: いいだろう。
  d_main_46_06_73:
    speaker: snowwhite_h
    en: It's a bit of a long story.
    ko: 짧은 이야기는 아닐 거다.
    ja: だが、長い話になる。
  d_main_46_06_74:
    speaker: janghwa_n
    en: Then keep it to the parts about Scar. I'm not big on long stories.
    ko: 그럼 련이 위주로만 얘기해줘. 긴 이야기는 싫어하거든.
    ja: |-
      じゃ、レンが主役のとこだけでいいわ。
      長話って嫌いなの。
  d_main_46_06_75:
    speaker: "<Narration>"
    en: Snow White and Rose's voices echo around them,
    ko: 스노우 화이트와 장화의 목소리가 울려 퍼진다.
    ja: スノーホワイトと薔花は言葉を交わし続けた
  d_main_46_06_76:
    speaker: "<Narration>"
    en: as Nayuta and Mirror walk on, listening.
    ko: 나유타와 미러는 그 소리를 들으며 걷고 있다.
    ja: ナユタとミラーは、それを聞きながら歩いた
  d_main_46_06_77:
    speaker: mirror_r
    en: They seem to be getting along.
    ko: 사이가 좋아 보이네요.
    ja: 仲よくなったようですね。
  d_main_46_06_78:
    speaker: nayuta
    en: How far dost thou intend to lead us?
    ko: 어디까지 우릴 안내할 생각이오?
    ja: 私たちをどこまで連れていくおつもりですか？
  d_main_46_06_79:
    speaker: nayuta
    en: I confess, this leisurely stroll through the heart of enemy territory does
      not sit well with me.
    ko: 솔직히 말하면 적진의 한복판을 이렇게 유유자적 걸어가는 게 유쾌한 기분은 아니오만.
    ja: |-
      正直、敵陣のど真ん中を
      のんびり散歩というのは
      私の性に合いませんねぇ。
  d_main_46_06_80:
    speaker: mirror_r
    en: Not much further now.
    ko: 조금만 더 가면 돼요.
    ja: あと少しです。
  d_main_46_06_81:
    speaker: mirror_r
    en: We wouldn't be able to go any further than that anyway.
    ko: 어차피 그 이상은 가지도 못할 테고.
    ja: |-
      いずれにしても、
      それより先には進めません。
  d_main_46_06_82:
    speaker: nayuta
    en: So thou hast been here all this time?
    ko: 미러 소저는 계속 이곳에 있었던 것이오?
    ja: 今までずっとここに？
  d_main_46_06_83:
    speaker: mirror_r
    en: That's right. I've been here ever since Eden. There's work to be done after
      all.
    ko: |-
      그렇죠. 에덴전 이후에는 계속 여기 있었어요.
      일해야 되니까.
    ja: |-
      ええ。エデンでの戦いの後はほとんど。
      こき使われていますから。
  d_main_46_06_84:
    speaker: nayuta
    en: Then didst thou not see my replicas? There ought to have been at the very
      least several score.
    ko: |-
      그럼 소인의 분신들을 보지 못하였소?
      못해도 수십은 되었을 터.
    ja: |-
      私の分身を見かけませんでしたか？
      数十は侵入していたはずです。
  d_main_46_06_85:
    speaker: mirror_r
    en: Hmm... beats me. Maybe they're all dead?
    ko: 음… 글쎄요. 죽은 것 아닌가요?
    ja: さて…思い当たりませんね。始末されたのでは？
  d_main_46_06_86:
    speaker: nayuta
    en: When a replica doth perish, its NIMPH returneth unto me.
    ko: 분신이 사망 시 NIMPH가 소인에게로 향하오.
    ja: |-
      そうなれば、NIMPHは私のもとへ
      帰ってくるはずです。
  d_main_46_06_87:
    speaker: nayuta
    en: Such a thing hath not occurred even once.
    ko: 그런 적은 한 번도 없었소.
    ja: それが1つも戻らないというのは…
  d_main_46_06_88:
    speaker: mirror_r
    en: Is that so?
    ko: 그래요?
    ja: そうなのですか？
  d_main_46_06_89:
    speaker: mirror_r
    en: I haven't the faintest idea.
    ko: 전혀 모르겠는데요.
    ja: 残念ですが、やはり分かりませんね。
  d_main_46_06_90:
    speaker: nayuta
    en: "... I see."
    ko: "…그렇군."
    ja: "…そうですか。"
  d_main_46_06_91:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_92:
    speaker: nayuta
    en: Is it... still intact?
    ko: "[그건] 건재하오?"
    ja: "「あれ」は健在で？"
  d_main_46_06_93:
    speaker: mirror_r
    en: Of course. That's why the Lift is in operation.
    ko: 물론이죠. 그러니까 궤도 엘리베이터가 가동되죠.
    ja: |-
      当然です。軌道エレベーターが
      動かせるのですから。
  d_main_46_06_94:
    speaker: mirror_r
    en: The Ultra Massive Core is very much intact. It's in much better shape than
      anticipated.
    ko: |-
      초거대 코어는 아주 건재해요.
      예상보다 아주 멀쩡하더라고요.
    ja: |-
      超巨大コアは今も無事です。
      思ったほどの損傷もありませんでした。
  d_main_46_06_95:
    speaker: nayuta
    en: Who doth maintain it?
    ko: 관리는 누가 하오.
    ja: 維持管理は誰が？
  d_main_46_06_96:
    speaker: mirror_r
    en: It's left alone. It was designed to run itself after all.
    ko: |-
      그냥 두는 거죠.
      알아서 잘 굴러가게 만들어놨잖아요.
    ja: |-
      特に誰も。
      自動化されていますから。
  d_main_46_06_97:
    speaker: mirror_r
    en: By you, I might add.
    ko: 당신이.
    ja: あなたの仕事だったのでは？
  d_main_46_06_98:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_06_99:
    speaker: mirror_r
    en: The Ark and the Lift each hold one of the twin cores.
    ko: 쌍둥이인 코어를 하나씩 가지고 있는 방주와 궤도 엘리베이터….
    ja: |-
      アークと軌道エレベーターに配置された、
      双子のコア。
  d_main_46_06_100:
    speaker: mirror_r
    en: The moment either is destroyed, mutual destruction follows.
    ko: 둘 중 하나의 코어라도 망가지는 순간, 공멸하고.
    ja: |-
      どちらか一方が崩壊した瞬間、
      もう一方も崩壊する。
  d_main_46_06_101:
    speaker: mirror_r
    en: And in close proximity to one another, the resulting resonance would destroy
      them both.
    ko: 거리가 너무 가까워지면 또 서로 공명해 같이 파괴되는.
    ja: 距離が近すぎても、共鳴して同時に消滅する…
  d_main_46_06_102:
    speaker: mirror_r
    en: Hehe. Quite the troublesome design.
    ko: 후후. 아주 귀찮은 설계군요.
    ja: ふふ…とても手の込んだ設計です。
  d_main_46_06_103:
    speaker: nayuta
    en: There was surely reason behind its design.
    ko: 이유가 있어 그렇게 설계되었을 것이오.
    ja: |-
      そうなっていたことには、
      何か理由があったのでしょう。
  d_main_46_06_104:
    speaker: nayuta
    en: Yet we failed to uncover that reason, and we erred in wielding forces unknowable
      in heedless fashion.
    ko: |-
      우리는 그 이유를 찾아내지 못하고,
      미지의 힘을 마구 휘둘러서 문제였지만.
    ja: |-
      私たちはその意味さえ理解せぬまま、
      軽率に未知の力を振り回してしまった…
  d_main_46_06_105:
    speaker: mirror_r
    en: Just so you know, mutual destruction is not an option.
    ko: 미리 말해두는데, 동귀어진은 안 돼요.
    ja: |-
      あらかじめ忠告しておきますが、
      共倒れはもうできません。
  d_main_46_06_106:
    speaker: mirror_r
    en: It might have been a viable choice in the past, but not now with the Queen
      in the picture.
    ko: |-
      예전 같으면 선택지 중 하나였겠지만,
      지금은 퀸이 있어요.
    ja: |-
      少し前ならそれも
      選択肢のうちだったかもしれませんが、
      今はクイーンがいますから。
  d_main_46_06_107:
    speaker: mirror_r
    en: Humanity, stripped of its sanctuary, against the Queen.
    ko: 보금자리를 잃은 인류와 퀸의 싸움.
    ja: 家を失った人類対クイーン。
  d_main_46_06_108:
    speaker: mirror_r
    en: The outcome is obvious, wouldn't you say?
    ko: 어느 쪽이 이길지는 너무 뻔히 보이잖아요.
    ja: どちらが勝つかは考えなくても分かることです。
  d_main_46_06_109:
    speaker: nayuta
    en: "... This I know."
    ko: "…알고 있소."
    ja: "…分かっています。"
d_main_46_07:
  d_main_46_07_1:
    speaker: mirror_r
    en: All right, this is as far as we go.
    ko: 자, 여기까지.
    ja: さあ、ここです。
  d_main_46_07_2:
    speaker: mirror_r
    en: I don't recommend going any further.
    ko: 이 이상 접근하는 건 추천하지 않아요.
    ja: これ以上の接近はお勧めしません。
  d_main_46_07_3:
    speaker: mirror_r
    en: We might get caught.
    ko: 들킬 수도 있으니까.
    ja: 発見される可能性がありますから。
  d_main_46_07_4:
    speaker: nayuta
    en: By your efforts, we have come thus far without great peril.
    ko: "…덕분에, 비교적 안전하게 여기까지 올 수 있었소."
    ja: |-
      …おかげ様で、比較的安全に
      ここまで偵察できました。
  d_main_46_07_5:
    speaker: nayuta
    en: To know the lay of the land beforehand shall alone prove of great service.
    ko: 지리적 특성을 미리 파악하는 것만 해도 큰 도움이 되겠군.
    ja: |-
      地理を事前に把握できただけでも、
      大きな助けです。
  d_main_46_07_6:
    speaker: mirror_r
    en: Take it all in before you return. That's the only way you'll even stand a
      chance of winning.
    ko: |-
      최대한 눈에 담고 돌아가요.
      그래야 조금이라도 승산이 생길 테니까.
    ja: |-
      しっかり見ていってください。
      少しでも勝算を生むために。
  d_main_46_07_7:
    speaker: snowwhite_h
    en: Sounds like you're saying we'd lose if we fought now.
    ko: 지금 싸우면 우리가 진다는 얘기처럼 들리는군.
    ja: |-
      今戦えば私たちが
      負けると言っているように聞こえるな。
  d_main_46_07_8:
    speaker: mirror_r
    en: Of course. You have absolutely no chance of winning right now.
    ko: 당연하죠. 이길 가능성이 조금도 없어요.
    ja: |-
      言うまでもないことでは？
      勝つための手がないのですから。
  d_main_46_07_9:
    speaker: mirror_r
    en: You're lucky that the Queen is focused on rebuilding her strength now.
    ko: 지금은 퀸이 힘을 비축하는 데 집중하고 있어서 망정이지
    ja: |-
      クイーンは戦力の増加に
      集中しているだけです。
  d_main_46_07_10:
    speaker: mirror_r
    en: Do you honestly think you could stop her if she went after Eden and the Ark
      this very moment?
    ko: 지금 당장 에덴과 방주를 친다고 하면 막을 수 있을 것 같아요?
    ja: |-
      もし今エデンとアークが襲撃されたら、
      止められますか？
  d_main_46_07_11:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_07_12:
    speaker: mirror_r
    en: While she gathers strength, you must do the same.
    ko: |-
      이쪽이 힘을 모으고 있을 때,
      당신들도 힘을 모아놓아야 해요.
    ja: |-
      向こうがそうしているうちに、
      あなた方も力を蓄えなければなりません。
  d_main_46_07_13:
    speaker: mirror_r
    en: By any means necessary.
    ko: 수단과 방법을 가리지 말고.
    ja: 例えどんな手段を使ってでも。
  d_main_46_07_14:
    speaker: mirror_r
    en: "... I'm backing the losing side here."
    ko: "…저는 지금 밑지는 장사를 하고 있는 거예요."
    ja: |-
      …私にとっては、
      得にならないことをしているのです。
  d_main_46_07_15:
    speaker: mirror_r
    en: Siding with the Queen would make things so much easier.
    ko: 퀸 쪽에 붙으면 일이 아주 쉽게 풀리겠죠.
    ja: |-
      クイーン側についた方が、
      楽に事が運べるでしょうから。
  d_main_46_07_16:
    speaker: mirror_r
    en: And yet I'm going this far because I genuinely want you to win.
    ko: |-
      그럼에도 이렇게까지 하는 이유는,
      당신들이 꼭 이기길 바라는 마음이 있어서예요.
    ja: |-
      それでもこうして骨を折っているのは、
      あなたたちに勝ってほしいからです。
  d_main_46_07_17:
    speaker: mirror_r
    en: So please, don't disappoint me.
    ko: 부디, 저를 실망시키지 않길 바랄게요.
    ja: どうか、失望させないでくださいね。
  d_main_46_07_18:
    speaker: snowwhite_h
    en: Talk is cheap. Give us something useful to work with.
    ko: 말만 하지 말고 뭐라도 좀 주지 그래.
    ja: |-
      それなら、言葉より
      手みやげのひとつでもくれたらどうだ。
  d_main_46_07_19:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_07_20:
    speaker: mirror_r
    en: Fine. That's the reason I brought you here anyway.
    ko: 그래요. 어차피 여기까지 안내한 이유도 그거니까.
    ja: |-
      構いませんよ。
      ここまでご案内した理由でもありますし。
  d_main_46_07_21:
    speaker: mirror_r
    en: Rose.
    ko: 장화.
    ja: 薔花。
  d_main_46_07_22:
    speaker: janghwa_n
    en: All right, all right.
    ko: 예~ 예~
    ja: はいは～い。
  d_main_46_07_23:
    speaker: "<Narration>"
    en: Rose heads to a corner,
    ko: 장화가 구석으로 향한다.
    ja: 薔花が物陰に向かい…
  d_main_46_07_24:
    speaker: "<Narration>"
    en: then proceeds to perform a peculiar sequence of steps.
    ko: 이상한 스텝을 밟는다.
    ja: 奇妙なステップを踏んだ
  d_main_46_07_25:
    speaker: nayuta
    en: Oho. Hast thou brought us thus far merely that Swordwarden might unveil some
      secret dance techniques?
    ko: 호오. 호위 무사께서 비장의 춤사위를 보여주기 위해 우릴 여기까지 안내한 것이오?
    ja: |-
      なるほど。わざわざここまで案内したのは、
      とっておきの踊りを披露するためだと？
  d_main_46_07_26:
    speaker: snowwhite_h
    en: Come to think of it, Red Hood did a tap dance the day we first met Scarlet.
    ko: 그러고 보니 홍련과 처음 만난 날 레드 후드가 탭댄스를 췄었지.
    ja: |-
      初めて紅蓮と会った時は
      レッドフードがタップダンスをしていたな。
  d_main_46_07_27:
    speaker: janghwa_n
    en: "... I told you we should have changed this."
    ko: "…이거 바꾸자니까."
    ja: "…やっぱりコレ、変えない？"
  d_main_46_07_28:
    speaker: mirror_r
    en: What's the harm. Besides, this way, no one will find out by accident either.
    ko: 뭐 어때요. 그리고 이렇게 해놔야 우연히라도 못 찾지.
    ja: |-
      いい認証方法だと思いますが。
      偶然見つかることもありませんし。
  d_main_46_07_29:
    speaker: "<Narration>"
    en: The moment Rose completes her steps, the corner crackles to life.
    ko: 장화의 스탭이 끝나자, 구석이 지직거린다.
    ja: |-
      薔花のステップが終わると、
      壁面にノイズが揺らぎ…
  d_main_46_07_30:
    speaker: "<Narration>"
    en: A human-sized container emerges.
    ko: 사람만 한 크기의 컨테이너가 나타난다.
    ja: |-
      人ほどの大きさのある
      コンテナが突然姿を現した
  d_main_46_07_31:
    speaker: nayuta
    en: Optical camouflage...
    ko: "…광학미채."
    ja: "…光学偽装ですか。"
  d_main_46_07_32:
    speaker: mirror_r
    en: Would you mind opening it?
    ko: 열어주시겠어요?
    ja: 開けてもらえますか？
  d_main_46_07_33:
    speaker: janghwa_n
    en: Bodyguard... I'm nothing but an errand girl.
    ko: 호위 무사가 아니라 잡일꾼이네.
    ja: もう、用心棒っていうよりただの雑用係ね。
  d_main_46_07_34:
    speaker: mirror_r
    en: I have no physical body, I don't have much of a choice.
    ko: 실체가 없으니까 어쩔 수 없잖아요.
    ja: 実体がないのですから、仕方ないでしょう？
  d_main_46_07_35:
    speaker: "<Narration>"
    en: Rose presses the button on the container.
    ko: 장화가 컨테이너의 버튼을 누른다.
    ja: 薔花がコンテナのボタンを押した
  d_main_46_07_36:
    speaker: "<Narration>"
    en: With a hiss, the contents are revealed.
    ko: 푸슉- 하고 내용물이 드러난다.
    ja: |-
      何かの噴き出すような音とともに、
      中身が現れる
  d_main_46_07_37:
    speaker: "<Narration>"
    en: Steel legs clad in red.
    ko: 붉은색으로 치장된, 강철의 다리.
    ja: それは赤く染まった、鋼鉄製の脚だった
  d_main_46_07_38:
    speaker: nayuta
    en: Red Shoes...!
    ko: 레드… 슈즈…!
    ja: レッドシューズ…！
  d_main_46_07_39:
    speaker: mirror_r
    en: I kept them safe, as you can see.
    ko: 제가 잘 챙겨놨죠.
    ja: 私が保管していたものです。
  d_main_46_07_40:
    speaker: mirror_r
    en: I tried everything I could to make replicas with them, but they don't seem
      compatible with Rapture technology.
    ko: 이걸로 레플리카도 만들어보고 별짓을 다 해봤는데, 아무래도 랩쳐한테 맞는 기술이 아니라서요.
    ja: |-
      何かに使えないかと試しては見たのですが、
      ラプチャーとは技術的に
      相性が悪かったようです。
  d_main_46_07_41:
    speaker: mirror_r
    en: Take them. Perhaps they'll come in handy somehow.
    ko: 가져가서 쓰세요. 뭐라도 도움이 되겠죠.
    ja: |-
      持っていってください。
      何かの役には立つはずです。
  d_main_46_07_42:
    speaker: nayuta
    en: This... shall prove of considerable aid.
    ko: 이건… 큰 도움이 될 거요.
    ja: ええ…大きな助けになりそうですねぇ。
  d_main_46_07_43:
    speaker: mirror_r
    en: That's what I thought.
    ko: 그렇죠?
    ja: でしょう？
  d_main_46_07_44:
    speaker: mirror_r
    en: And take one more thing with you. Rose, if you could.
    ko: |-
      그리고 하나 더 챙겨가요.
      장화.
    ja: |-
      それと、もう1点。
      薔花？
  d_main_46_07_45:
    speaker: "<Narration>"
    en: Rose retrieves a small bag from inside the container and hands it to Snow
      White.
    ko: 장화가 컨테이너 안에 있는 작은 가방을 스노우 화이트에게 건넨다.
    ja: |-
      コンテナの中にあった小型の容器を
      薔花がスノーホワイトに渡した
  d_main_46_07_46:
    speaker: snowwhite_h
    en: What's this? It's really heavy.
    ko: "…뭐지 이건? 무거운데."
    ja: "…何だこれは？ずいぶんと重いな。"
  d_main_46_07_47:
    speaker: mirror_r
    en: It's a brain shelter.
    ko: 브레인 셸터예요.
    ja: ブレインシェルターです。
  d_main_46_07_48:
    speaker: snowwhite_h
    en: A brain shelter?
    ko: 브레인 셸터?
    ja: ブレインシェルター？
  d_main_46_07_49:
    speaker: mirror_r
    en: Liberalio's head is inside.
    ko: 리버렐리오의 머리가 들어있어요.
    ja: 中身はリバーレリオ。
  d_main_46_07_50:
    speaker: snowwhite_h
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_07_51:
    speaker: nayuta
    en: What...?!
    ko: "…무슨…!"
    ja: なんと…！？
  d_main_46_07_52:
    speaker: mirror_r
    en: I don't know what possessed Liberalio, or why.
    ko: "…리버렐리오가 어디에서 무슨 바람이 들었는지는 모르겠지만."
    ja: |-
      …何を考えていたのかは、
      私にも分かりませんが…
  d_main_46_07_53:
    speaker: mirror_r
    en: But she proposed to the Queen a dialogue with humanity.
    ko: 퀸에게 인류와의 대화를 제안했어요.
    ja: |-
      リバーレリオはクイーンに
      人類との対話を持ちかけたのです。
  d_main_46_07_54:
    speaker: mirror_r
    en: I'll admit, I had some hope myself. I figured it might get through to the
      Queen even just a little, given it was coming from her second daughter.
    ko: |-
      저도 어느 정도는 기대했어요.
      퀸의 두 번째 딸이 하는 말인 만큼, 조금이라도 흔들리지 않을까 하는.
    ja: |-
      実は、私も少し期待していました。
      2番目の娘ともいえる存在の言葉なら、
      わずかでも考えが揺さぶれるのではないかと。
  d_main_46_07_55:
    speaker: mirror_r
    en: But...
    ko: 하지만.
    ja: ですが…
  d_main_46_07_56:
    speaker: mirror_r
    en: The Queen truly is a monster.
    ko: 퀸은 정말 괴물이었어요.
    ja: クイーンは本当の怪物だったようです。
  d_main_46_07_57:
    speaker: mirror_r
    en: Liberalio's words fell on deaf ears.
    ko: 리버렐리오의 말은 조금도 통하지 않았죠.
    ja: |-
      リバーレリオの言葉は
      まったく届きませんでした。
  d_main_46_07_58:
    speaker: mirror_r
    en: "... Although, I honestly doubt dialogue was ever possible with her in the
      first place."
    ko: "…애초에, 대화가 통하는 존재인지도 의문이지만."
    ja: |-
      …そもそも言葉を理解していたかどうかから
      疑わないといけませんが。
  d_main_46_07_59:
    speaker: mirror_r
    en: She tore off Liberalio's head, frozen in ecstasy after meeting her beloved
      mother.
    ko: 사랑하는 어머니를 만나 황홀경에 빠진 얼굴을, 그대로 뽑았어요.
    ja: |-
      ともあれ、愛する母にようやく会えて
      心から喜んでいた彼女を
      クイーンは首から引きちぎり…
  d_main_46_07_60:
    speaker: mirror_r
    en: She kept only the body that had the core, and tossed the head away like trash.
    ko: 코어가 있는 몸만 챙긴 후 머리는 쓰레기 버리듯 버렸죠.
    ja: |-
      コアのある胴体だけを持ち去った後、
      頭は放り捨てられました。
  d_main_46_07_61:
    speaker: mirror_r
    en: That's what I retrieved.
    ko: 그걸 주워 왔어요.
    ja: それを拾っておいたというわけです。
  d_main_46_07_62:
    speaker: nayuta
    en: Yet Heretics possess the capacity for regeneration by means of their core...
    ko: 허나 헬레틱은 코어를 중심으로 재생하는 게….
    ja: |-
      しかし、ヘレティックならば
      コアから再生できるはずでは…
  d_main_46_07_63:
    speaker: mirror_r
    en: There's no core in her head. Unlike Indivilia, Liberalio didn't do something
      as grotesque as implanting a core fragment in her head.
    ko: 코어는 없어요. 인디빌리아처럼 코어 조각을 머리에 심어놓는 추한 짓은 하지 않았으니까.
    ja: |-
      コアは抜かれました。インディビリアと違い、
      一部を頭に移植しておくような
      小賢しい手は使わないタイプでしたから。
  d_main_46_07_64:
    speaker: mirror_r
    en: But her brain is still alive.
    ko: 하지만 뇌는 살아있어요.
    ja: ですが、脳は生きています。
  d_main_46_07_65:
    speaker: mirror_r
    en: It should be enough to create a human imposter, at the very least.
    ko: 유사 인간 정도는 만들 수 있겠죠.
    ja: 人間もどきにはできるでしょう。
  d_main_46_07_66:
    speaker: mirror_r
    en: That is, when Eden has the technology to do so, of course.
    ko: 뭐, 그것도 에덴에 유사 인간 제작 기술이 있을 때 얘기지만.
    ja: |-
      ただし、それもエデンに
      製造技術があればの話ですが。
  d_main_46_07_67:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_07_68:
    speaker: mirror_r
    en: She's a Heretic who spent nearly a century slaughtering humans on the surface.
    ko: 지상에서 100년 가까이 인자를 죽이고 다닌 헬레틱이에요.
    ja: |-
      地上で100年近く因子狩りをしていた
      ヘレティックの脳です。
  d_main_46_07_69:
    speaker: mirror_r
    en: Such vast combat experience must mean she'll have a wealth of information.
    ko: 많은 실전 경험과 정보를 가지고 있겠죠.
    ja: |-
      豊富な実戦経験とデータが
      収まっているでしょう。
  d_main_46_07_70:
    speaker: mirror_r
    en: She's also one of my greatest works.
    ko: 제 최고의 자신작 중 하나기도 하고요.
    ja: 私の最高傑作のひとつでもありました。
  d_main_46_07_71:
    speaker: mirror_r
    en: So even turning her into a standard pseudohuman won't be a loss.
    ko: 그러니 유사 인간으로 만들어도 손해는 보지 않을 거예요.
    ja: |-
      人間もどきとして作り直しても
      損にはならないはずです。
  d_main_46_07_72:
    speaker: mirror_r
    en: We need every asset we can get, don't you think?
    ko: 하나라도 더 끌어모아야죠. 그렇죠?
    ja: 今は少しでも戦力が必要なはず。違いますか？
  d_main_46_07_73:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_07_74:
    speaker: mirror_r
    en: All right, it's time for you to leave.
    ko: 자, 그럼 어서 돌아가요.
    ja: では、そろそろお送りします。
  d_main_46_07_75:
    speaker: mirror_r
    en: We stuck strictly to inconspicuous routes, but if we stay too long, we're
      bound to get caught.
    ko: |-
      눈에 띄지 않는 루트로만 다녔지만,
      너무 오래 머물면 꼬리가 잡히기 마련이니까.
    ja: |-
      目につかないようにしているとはいえ、
      長居しすぎれば疑われます。
  d_main_46_07_76:
    speaker: mirror_r
    en: See them back safely, Rose.
    ko: 장화. 가는 길을 잘 안내해줘요.
    ja: 薔花。後は任せました。
  d_main_46_07_77:
    speaker: mirror_r
    en: They'll start to suspect something if I'm away from my post for too long.
    ko: 저는 너무 오래 자리를 비우면 그것들이 의심해서요.
    ja: |-
      私があまり留守にしていると、
      怪しまれてしまいますから。
  d_main_46_07_78:
    speaker: janghwa_n
    en: Yes, yes.
    ko: 그래그래.
    ja: は～い。
  d_main_46_07_79:
    speaker: mirror_r
    en: I guess the saying's true. When the cat's away, the mice come out to play.
    ko: 사자 없는 굴에서는 여우가 왕이라더니, 그 말이 딱 맞네요.
    ja: |-
      まさに鬼の居ぬ間に…という
      タイミングでしたね。
  d_main_46_07_80:
    speaker: nayuta
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_46_07_81:
    speaker: nayuta
    en: The Queen not present at this moment?
    ko: 퀸이 지금 여기에 없는 것이오?
    ja: クイーンは不在だということですか？
  d_main_46_07_82:
    speaker: mirror_r
    en: Yes.
    ko: 예.
    ja: ええ。
  d_main_46_07_83:
    speaker: mirror_r
    en: Remember how I mentioned those new Raptures use Dark Matter as a power source?
    ko: 좀 전에 신생 랩쳐들이 다크 매터를 동력원으로 쓴다고 했었죠?
    ja: |-
      新世代のラプチャーが
      ダークマターを利用していることは
      お話ししましたね？
  d_main_46_07_84:
    speaker: mirror_r
    en: She's gone to gather some.
    ko: 그걸 모으러 갔어요.
    ja: その回収に出かけています。
  d_main_46_07_85:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_07_86:
    speaker: nayuta
    en: The Maleficent Beast Quartet...
    ko: 사마수.
    ja: 四魔獣…
  d_main_46_07_87:
    speaker: mirror_r
    en: That's right.
    ko: 예.
    ja: そうです。
  d_main_46_07_88:
    speaker: mirror_r
    en: She went to steal the Dark Matter that the Four Beasts painstakingly scraped
      together.
    ko: 포비스트가 아득바득 모아놓은 다크 매터를 빼앗으러 갔어요.
    ja: |-
      ずいぶん頑張って集めているようですから、
      その横取りに。
d_main_46_08:
  d_main_46_08_1:
    speaker: leviathan
    en: Are you ready?
    ko: 준비는 끝났어?
    ja: 準備できてる？
  d_main_46_08_2:
    speaker: behemoth
    en: Yeah. There's nothing in particular I need to pack.
    ko: 응. 뭐 따로 챙길 것도 없으니까.
    ja: ああ。特に準備するようなモンもないしな。
  d_main_46_08_3:
    speaker: leviathan
    en: What about you, Bahamut?
    ko: 바하무트는?
    ja: バハムートは？
  d_main_46_08_4:
    speaker: bahamut
    en: I, the incomparably clever Bahamut, am not yet finished preparing.
    ko: 똑똑한 바하무트는 아직 준비가 끝나지 않았다.
    ja: 賢い私は、まだ時間がかかる。
  d_main_46_08_5:
    speaker: bahamut
    en: I can't decide which book to take.
    ko: 가져갈 책을 고르지 못했다.
    ja: 持っていく本が選べなくてな。
  d_main_46_08_6:
    speaker: leviathan
    en: What book?
    ko: 뭔 책.
    ja: 本？
  d_main_46_08_7:
    speaker: bahamut
    en: Don't you know? Books are nourishment for the mind.
    ko: 모르는 건가. 책이란 마음의 양식이다.
    ja: 知らないのか？本とは心の糧だ。
  d_main_46_08_8:
    speaker: bahamut
    en: No matter where one goes, books are an absolute necessity.
    ko: 어딜가든 책은 반드시 가져가야 한다.
    ja: どんな時でも、一冊は持ち歩かなければ。
  d_main_46_08_9:
    speaker: leviathan
    en: Uh... Bahamut.
    ko: 그, 바하무트.
    ja: あのさ、バハムート。
  d_main_46_08_10:
    speaker: leviathan
    en: "... Why are you always reading books?"
    ko: "…너, 책 왜 자꾸 읽는 거야?"
    ja: "…なんでいつも何か読んでるの？"
  d_main_46_08_11:
    speaker: bahamut
    en: Knowledge is a weapon, Levi. One must always keep it sharp.
    ko: |-
      지식이란 무기다, 레비.
      상시 준비해 놓지 않으면 안 된다.
    ja: |-
      知識とは武器なのだよ、レヴィ。
      常に備えておかなければ。
  d_main_46_08_12:
    speaker: behemoth
    en: Your knowledge is a weapon, all right. Something you swing around that leaves
      people dazed.
    ko: |-
      네 지식은 무기는 무기지.
      아무 데나 휘둘러서 사람을 굳게 만드니까.
    ja: |-
      ある意味武器にはなってるな。
      いきなり振り回して周りの奴がビビる。
  d_main_46_08_13:
    speaker: bahamut
    en: Precisely. It's gratifying to be surrounded by fellows who truly understand.
    ko: 그래. 이해해 주는 동료가 있다는 건 기쁜 일이다.
    ja: |-
      そうだろう。分かってくれる仲間が
      いるというのは嬉しいことだ。
  d_main_46_08_14:
    speaker: leviathan
    en: "*Sigh*"
    ko: 에휴.
    ja: はぁ…
  d_main_46_08_15:
    speaker: behemoth
    en: I'm surprised you actually agreed to help the Young Man.
    ko: 그런데 용케 남자의 제안을 받아들이기로 했네?
    ja: |-
      それより、なぜあの男の提案を
      受け入れる気になった？
  d_main_46_08_16:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_17:
    speaker: leviathan
    en: I promised him I would.
    ko: 도와주기로 약속했으니까.
    ja: 手伝うって約束したから。
  d_main_46_08_18:
    speaker: leviathan
    en: And from what I hear, something major happened.
    ko: 그리고 듣자하니 큰일이 난 것 같고.
    ja: |-
      話を聞いた限り、
      何かヤバいことになってるみたいだし。
  d_main_46_08_19:
    speaker: leviathan
    en: Come to think of it, you've visited Eden before, right? So you're already
      familiar with the place?
    ko: |-
      그러고 보니 너 에덴에 인사 간 적 있잖아.
      구면이겠네?
    ja: |-
      そういえば、ベヒモスはエデンに
      あいさつしたとか言ってたよね？
      もう顔なじみってこと？
  d_main_46_08_20:
    speaker: behemoth
    en: Sure, I've been there before.
    ko: 응. 구면은 구면이겠지.
    ja: まあ、顔は覚えられてるだろうな。
  d_main_46_08_21:
    speaker: behemoth
    en: But I doubt they'll welcome me with open arms.
    ko: 딱히 반겨줄 것 같진 않지만 말이야.
    ja: 歓迎はされないだろうけど。
  d_main_46_08_22:
    speaker: leviathan
    en: "... What did you do?"
    ko: "…너 뭐라고 인사했는데."
    ja: "…どういうあいさつ？"
  d_main_46_08_23:
    speaker: behemoth
    en: Let's just say we got off to a rocky start...
    ko: 첫 만남의 바위 던지기를….
    ja: 初対面の記念に、ちょっと岩投げを…
  d_main_46_08_24:
    speaker: leviathan
    en: We're doomed. We'll be lucky if we don't get intercepted along the way.
    ko: 망했네. 가다가 요격이나 안 당하면 다행이겠어.
    ja: |-
      終わった…
      いきなり攻撃されなきゃいいけど。
  d_main_46_08_25:
    speaker: behemoth
    en: Well, the Young Man probably gave Eden a heads-up already. We should be fine.
    ko: 뭐, 남자가 에덴에 미리 얘기해 놨을 테니 괜찮겠지.
    ja: |-
      ま、アイツがエデンに話を通してるはずだし、
      それはないだろ。
  d_main_46_08_26:
    speaker: leviathan
    en: Yeah, I guess it'll be fine.
    ko: 그래. 뭐 괜찮겠지.
    ja: そうね。心配しても仕方ないか。
  d_main_46_08_27:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_28:
    speaker: leviathan
    en: It'll be fine... right?
    ko: 괜찮… 겠지?
    ja: 大丈夫…だよね？
  d_main_46_08_29:
    speaker: behemoth
    en: Why? Are you nervous?
    ko: 왜. 불안해?
    ja: どうした。不安か？
  d_main_46_08_30:
    speaker: leviathan
    en: Mmm... I mean, kind of.
    ko: 으음… 아무래도 좀.
    ja: うーん…やっぱり、ちょっとね。
  d_main_46_08_31:
    speaker: behemoth
    en: I don't blame you. We've kept to ourselves this whole time without dealing
      with anyone else whatsoever.
    ko: 하긴. 그 오랜 시간 동안 우리끼리만 지냈지 다른 어디와도 교류가 없었으니까.
    ja: |-
      だろうな。
      長い間あたしたちだけでやってきて、
      外と交流なんて全然してこなかったし。
  d_main_46_08_32:
    speaker: behemoth
    en: If it weren't for Grave, that might still be the case.
    ko: 그레이브가 아니었으면 아직까지 그러고 있었을지도 몰라.
    ja: |-
      グレイブのやつがいなきゃ、
      今もそうだったかもなぁ。
  d_main_46_08_33:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_34:
    speaker: behemoth
    en: Still, we got along well enough with Anachiro's group and the Young Man's
      crew, even if it was only briefly.
    ko: |-
      그래도, 대선배님 일행도 그렇고 남자 일행도 그렇고.
      잠깐이지만 잘 지냈잖아?
    ja: |-
      けど、大先輩とかあの男の仲間とかとは
      まだ短い付き合いだけど
      うまくやってこれただろ？
  d_main_46_08_35:
    speaker: behemoth
    en: Eden won't be any different.
    ko: 에덴이라고 다를 건 없을 거야.
    ja: なら、エデンが相手でも大丈夫さ。
  d_main_46_08_36:
    speaker: leviathan
    en: Ah, true. You're right.
    ko: 아, 응. 그럴 거야.
    ja: "…うん。まあ、そうかも。"
  d_main_46_08_37:
    speaker: bahamut
    en: First meeting jitters are perfectly natural.
    ko: 첫 만남의 불안감은 누구나 가지고 있다.
    ja: 知らない者と会えば、誰しも不安を抱くものだ。
  d_main_46_08_38:
    speaker: bahamut
    en: But conversation is the cornerstone of evolution.
    ko: 하지만 대화는 진화의 초석.
    ja: しかし、対話は進化のいしずえ。
  d_main_46_08_39:
    speaker: bahamut
    en: New encounters beget new dialogue and the exchange of new knowledge.
    ko: 새로운 만남은 새로운 대화를 낳고, 새로운 지식을 주고받게 된다.
    ja: |-
      新たな出会いは新たな対話を生み、
      新たな知識の交換につながるだろう。
  d_main_46_08_40:
    speaker: bahamut
    en: I, the brilliant Bahamut, can hardly contain my excitement.
    ko: 똑똑한 바하무트는 벌써부터 기대가 되어 참을 수 없다.
    ja: 賢い私はすでに期待で胸がいっぱいだ。
  d_main_46_08_41:
    speaker: bahamut
    en: I await the magnificent moment my profound knowledge and Eden's converge.
    ko: 똑똑한 바하무트의 지식과, 에덴의 지식이 교차되어 발생될 믹스 업의 순간을.
    ja: |-
      賢いバハムートの知識とエデンの知識が
      交われば、新たな高みへと至れるだろう。
  d_main_46_08_42:
    speaker: behemoth
    en: Are we seriously taking her with us? I'd say a fight's liable to break out
      before long.
    ko: |-
      얘 진짜 데려갈 거야?
      싸움 날 것 같아.
    ja: |-
      ホントにこいつも連れてくのか？
      話がややこしくなるかもしれねぇぞ。
  d_main_46_08_43:
    speaker: leviathan
    en: We have to bring her. What choice do we have?
    ko: 데려가야지 뭘 어떡해.
    ja: 置いてくワケにもいかないでしょ。
  d_main_46_08_44:
    speaker: leviathan
    en: But what's taking those two so long?
    ko: 그런데 둘은 왜 이렇게 안 와?
    ja: それより、あと2人は何してるの？
  d_main_46_08_45:
    speaker: behemoth
    en: Yeah, they're running pretty late today.
    ko: 그러게. 오늘은 좀 늦네.
    ja: そういや、やけに遅いな。
  d_main_46_08_46:
    speaker: "<Narration>"
    en: "*Swooooosh*"
    ko: 슈우우우우---!
    ja: ヒュウウウ――
  d_main_46_08_47:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 착.
    ja: スタッ
  d_main_46_08_48:
    speaker: "<Narration>"
    en: Ziz lands from the air.
    ko: 지즈가 공중에서 착지했다.
    ja: ジズが空から降下し、着地した
  d_main_46_08_49:
    speaker: "<Narration>"
    en: The girl hanging from Ziz's neck climbs down to the ground.
    ko: 지즈의 목에 안겨있던 소녀가 바닥에 내린다.
    ja: |-
      ジズの首にしがみついていた少女が
      地面に飛び下りた
  d_main_46_08_50:
    speaker: onlyone_c
    en: Hehe! S'fun!
    ko: 꺄하. 재밌어.
    ja: えへへ、たのしい。
  d_main_46_08_51:
    speaker: ziz
    en: Heh, hehe. Seeing new places is nice, isn't it?
    ko: 헤, 헤헤. 새로운 곳 보니까 좋지?
    ja: |-
      へへ、えへへ…
      新しい場所って楽しいでしょ？
  d_main_46_08_52:
    speaker: onlyone_c
    en: Uh-huh.
    ko: 응. 응.
    ja: うん。楽しい。
  d_main_46_08_53:
    speaker: onlyone_c
    en: Go new place 'morrow?
    ko: 내일도 새로운 곳 가?
    ja: 明日も、あたらしいところ？
  d_main_46_08_54:
    speaker: behemoth
    en: Tomorrow's my turn, right? I'll take you somewhere completely new.
    ko: |-
      내일은 내 차례였지?
      완전 새로운 곳으로 데려다줄게.
    ja: |-
      確か明日はあたしの番だったな？
      誰も行ったことのない場所に
      連れてってやるか。
  d_main_46_08_55:
    speaker: onlyone_c
    en: Hehe. Yay, yay!
    ko: 우헤헤. 좋아 좋아.
    ja: えへへ。やったあ。
  d_main_46_08_56:
    speaker: onlyone_c
    en: Huh...
    ko: "…아."
    ja: "…あ…"
  d_main_46_08_57:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_58:
    speaker: onlyone_c
    en: Uunngh...
    ko: 우응….
    ja: う～…
  d_main_46_08_59:
    speaker: ziz
    en: Eh? Wh-what's wrong?
    ko: 어? 왜, 왜 그래?
    ja: えっ？ど、どうしたの？
  d_main_46_08_60:
    speaker: bahamut
    en: I, the erudite Bahamut, shall enlighten you. The child currently requires
      sleep.
    ko: |-
      똑똑한 바하무트가 알려주겠다.
      지금 아이는 수면이 필요한 상태다.
    ja: |-
      賢いバハムートが教えてやろう。
      この子には今、睡眠が必要だ。
  d_main_46_08_61:
    speaker: onlyone_c
    en: Hug me.
    ko: 안아 줘.
    ja: だっこ。
  d_main_46_08_62:
    speaker: ziz
    en: Ah, okay. Come here.
    ko: 아, 응. 이리 와.
    ja: あ、うん。おいで。
  d_main_46_08_63:
    speaker: "<Narration>"
    en: Ziz wraps her arms around the girl,
    ko: 지즈가 소녀를 끌어안는다.
    ja: ジズが少女を引き寄せた
  d_main_46_08_64:
    speaker: "<Narration>"
    en: and the girl buries her face into Ziz's chest.
    ko: 소녀는 지즈의 가슴에 얼굴을 파묻는다.
    ja: 少女はジズの胸に顔をうずめた
  d_main_46_08_65:
    speaker: onlyone_c
    en: Fluffy. Feel good.
    ko: 푹신푹신. 기분 좋아.
    ja: ふわふわ。きもちいい。
  d_main_46_08_66:
    speaker: ziz
    en: Oh, hehe... R-really?
    ko: 에, 헤헤. 그, 그래?
    ja: え、えへへ。そ、そう？
  d_main_46_08_67:
    speaker: ziz
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_68:
    speaker: ziz
    en: Wh-what do I do...
    ko: "…어, 어떡하지."
    ja: "…ど、どうしよう。"
  d_main_46_08_69:
    speaker: ziz
    en: I... feel like I'm gonna cry.
    ko: 나, 나 눈물 날 것 같아.
    ja: なんか…涙が出そう。
  d_main_46_08_70:
    speaker: leviathan
    en: Wh-what's wrong?
    ko: 왜, 왜 그래.
    ja: ど、どうしてよ。
  d_main_46_08_71:
    speaker: ziz
    en: I-I don't know...
    ko: 모, 몰라아….
    ja: わ、分かんないけどぉ…
  d_main_46_08_72:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_73:
    speaker: leviathan
    en: Are you all packed?
    ko: 너 준비는 다 했어?
    ja: あんた、準備はできてんの？
  d_main_46_08_74:
    speaker: ziz
    en: Packed? For what?
    ko: 준비? 무슨 준비?
    ja: 準備って何の？
  d_main_46_08_75:
    speaker: leviathan
    en: We're leaving today, remember?
    ko: 오늘 출발하기로 했잖아.
    ja: 今日出発するって言ったでしょ？
  d_main_46_08_76:
    speaker: ziz
    en: Oh, r-right! We were going to Eden.
    ko: 아. 에, 에덴으로 간다고 했지.
    ja: あっ…えと、エデンに行くんだっけ。
  d_main_46_08_77:
    speaker: ziz
    en: I-I forgot...
    ko: 이, 잊고 있었어….
    ja: す、すっかり忘れてた…
  d_main_46_08_78:
    speaker: leviathan
    en: "... Hurry up and get ready."
    ko: "…빨리 준비해."
    ja: "…早く準備して。"
  d_main_46_08_79:
    speaker: leviathan
    en: I'll hold her.
    ko: 내가 안고 있을 테니까.
    ja: 私が抱っこしておいてあげるから。
  d_main_46_08_80:
    speaker: ziz
    en: Oh, okay.
    ko: 아, 응.
    ja: あ、うん。
  d_main_46_08_81:
    speaker: leviathan
    en: All right, come here.
    ko: 자, 이리 와.
    ja: ほら、おいで。
  d_main_46_08_82:
    speaker: "<Narration>"
    en: Leviathan reaches out toward the girl nestled in Ziz's arms.
    ko: 레비아탄이 지즈의 품에 안겨있는 소녀에게 손을 뻗는다.
    ja: レヴィアタンがジズの胸元の少女に手を伸ばした
  d_main_46_08_83:
    speaker: "<Narration>"
    en: She stares silently at Leviathan.
    ko: 소녀가 레비아탄을 물끄러미 바라본다.
    ja: 少女はレヴィアタンの顔をのぞきこんだ後…
  d_main_46_08_84:
    speaker: "<Narration>"
    en: Her gaze travels down towards Leviathan's chest.
    ko: 시선이 레비아탄의 가슴으로 내려간다.
    ja: 胸に視線を落とした
  d_main_46_08_85:
    speaker: onlyone_c
    en: Hard. No like.
    ko: 딱딱해서 싫어.
    ja: "…かたいから、ヤ。"
  d_main_46_08_86:
    speaker: leviathan
    en: Y-you little brat...!
    ko: 이, 이 꼬맹이가…!
    ja: こ、こんのガキ…！
  d_main_46_08_87:
    speaker: behemoth
    en: Hah. Come here. I'll hold you.
    ko: 흐핫. 이리 와. 내가 안아줄게.
    ja: |-
      くははっ…！ほらほら、こっちだ。
      あたしが抱っこしてやるよ。
  d_main_46_08_88:
    speaker: "<Narration>"
    en: The girl settles into Behemoth's arms, tucks her head in and nuzzles against
      her.
    ko: |-
      소녀가 베히모스의 품에 안긴다.
      머리를 파묻으며 비비적댄다.
    ja: |-
      少女はベヒモスに抱きつき、
      胸に顔をうずめてこすりつけた
  d_main_46_08_89:
    speaker: onlyone_c
    en: Fluffy.
    ko: 푹신푹신.
    ja: ふわふわ。
  d_main_46_08_90:
    speaker: behemoth
    en: Heh, yeah. Fluffy, isn't it?
    ko: 그래그래. 푹신푹신하지?
    ja: うんうん、ふわふわで気持ちいいな？
  d_main_46_08_91:
    speaker: "<Narration>"
    en: The girl turns her head and looks at Leviathan.
    ko: 소녀가 고개를 돌려 레비아탄을 본다.
    ja: 少女は顔の向きを変え、レヴィアタンを見た
  d_main_46_08_92:
    speaker: onlyone_c
    en: Hard.
    ko: 딱딱.
    ja: かちかち。
  d_main_46_08_93:
    speaker: leviathan
    en: Ugh, I swear I'll—!
    ko: 하 저걸 그냥 진짜…!
    ja: なっ…なんなのホント…！
  d_main_46_08_94:
    speaker: bahamut
    en: Levi.
    ko: 레비.
    ja: レヴィ…
  d_main_46_08_95:
    speaker: leviathan
    en: What?
    ko: 왜.
    ja: 何？
  d_main_46_08_96:
    speaker: "<Narration>"
    en: Bahamut looks at Leviathan,
    ko: 바하무트가 레비아탄을 바라본다.
    ja: バハムートはレヴィアタンに視線を送り…
  d_main_46_08_97:
    speaker: "<Narration>"
    en: then nods silently.
    ko: 그리고 말없이 고개를 끄덕인다.
    ja: 無言でうなずいた
  d_main_46_08_98:
    speaker: leviathan
    en: Stop nodding like you've got some secret! It's annoying!
    ko: 뭘 이해한다는 둥 고개를 끄덕이고 앉아 있어 짜증 나게!
    ja: |-
      「分かる」みたいな顔するんじゃない！
      あ～イライラする！
  d_main_46_08_99:
    speaker: ziz
    en: Uh... L-Levi.
    ko: 레, 레비.
    ja: レ、レヴィ…
  d_main_46_08_100:
    speaker: leviathan
    en: What?! What is it?!
    ko: 왜! 뭐!
    ja: もう！今度は何！？
  d_main_46_08_101:
    speaker: ziz
    en: Oh... I-I'm packed and ready.
    ko: 아, 주, 준비 다 했다고.
    ja: えっと、じゅ、準備できたんだけど…
  d_main_46_08_102:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_103:
    speaker: leviathan
    en: Let's go then.
    ko: 가자.
    ja: 行きましょ。
  d_main_46_08_104:
    speaker: behemoth
    en: But she just fell asleep.
    ko: 얘 잠들었는데.
    ja: 女王サマ、もう寝ちまってるぞ。
  d_main_46_08_105:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_106:
    speaker: leviathan
    en: Let's be quiet then. If she wakes up, we'll take turns transforming and giving
      her rides.
    ko: |-
      조용히 가자.
      깨면 순서대로 거대화해서 타고 가고.
    ja: |-
      起こさないように行きましょ。
      もし起きたら交代で巨大化して、
      乗せてあげるしかないわね。
  d_main_46_08_107:
    speaker: leviathan
    en: If we don't let her ride while we're transformed, she'll throw a fit.
    ko: 얘 거대화한 채 안 태워주면 난리 나니까.
    ja: そうしないと、大騒ぎするし。
  d_main_46_08_108:
    speaker: ziz
    en: Oh, okay.
    ko: 아, 응.
    ja: うん。分かった。
  d_main_46_08_109:
    speaker: ziz
    en: Th-this is kinda fun. It's like taking turns driving on a road trip.
    ko: 여, 여행 갈때 운전 교대로 하는 것 같아서 재밌다.
    ja: |-
      なんかそれって、交代で運転しながら
      旅行するみたいで楽しそう。
  d_main_46_08_110:
    speaker: behemoth
    en: This is a family trip all right.
    ko: 가족 여행이네. 가족 여행이야.
    ja: 家族旅行ってヤツだな。
  d_main_46_08_111:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_08_112:
    speaker: leviathan
    en: Yeah.
    ko: 그러네.
    ja: そうね。
  d_main_46_08_113:
    speaker: "<Narration>"
    en: The Four Beasts walk on.
    ko: 포비스트가 걷는다.
    ja: フォービーストは徒歩で移動を始めた
  d_main_46_08_114:
    speaker: "<Narration>"
    en: Leviathan glances back.
    ko: 레비아탄이 뒤를 돌아본다.
    ja: |-
      しばらく経って、レヴィアタンは
      何気なく後ろを振り返った
  d_main_46_08_115:
    speaker: "<Narration>"
    en: The White Ark, once a ritual space built for the creation of the Queen.
    ko: 하얀색 방주. 퀸을 만들기 위해 지어진 의식용 공간.
    ja: |-
      白一色の都市の輪郭。
      それはクイーンを生み出す儀式のために
      作られたものだ
  d_main_46_08_116:
    speaker: "<Narration>"
    en: A place that has since become their home.
    ko: 하지만 이제는 집이 되어버린 곳.
    ja: しかし今では、我が家と感じる場所になっていた
  d_main_46_08_117:
    speaker: "<Narration>"
    en: It was wrecked by Liberalio, but even the process of restoring it was enjoyable.
    ko: |-
      리버렐리오에 의해 엉망이 되었지만,
      수복하는 것조차도 즐거웠던 공간.
    ja: |-
      リバーレリオに破壊された後、
      修復する時間すら楽しく感じた場所
  d_main_46_08_118:
    speaker: "<Narration>"
    en: For some reason, Leviathan feels a twinge of regret.
    ko: 레비아탄은 어째서인지, 아쉽다는 느낌을 받았다.
    ja: レヴィアタンはなぜか、名残惜しく感じた
  d_main_46_08_119:
    speaker: behemoth
    en: We'll be able to come back. It's our home, after all.
    ko: |-
      다시 오면 돼.
      우리 집이니까.
    ja: |-
      また帰って来ればいい。
      あたしたちの家なんだからさ。
  d_main_46_08_120:
    speaker: leviathan
    en: Yeah, you're right.
    ko: 아, 응. 그렇지.
    ja: ああ、うん。そうだね。
  d_main_46_08_121:
    speaker: "<Narration>"
    en: The Four Beasts continue onward.
    ko: 포비스트가 다시 걷는다.
    ja: フォービーストはまた歩き出し…
  d_main_46_08_122:
    speaker: "<Narration>"
    en: After walking for a long time, they stop.
    ko: 한참을 걸어가다 멈춰선다.
    ja: まだ間もないうちに、立ち止まった
  d_main_46_08_123:
    speaker: "<Narration>"
    en: Before them stands the Thing,
    ko: 눈앞에 서 있는 [그것]을 바라본다.
    ja: "…目の前に、知らない誰かが立っている"
  d_main_46_08_124:
    speaker: "<Narration>"
    en: who looks at them with a smile.
    ko: "[그것]은 웃으며 포비스트를 바라본다."
    ja: |-
      その人影は笑顔を浮かべて
      こちらを見つめていた
  d_main_46_08_125:
    speaker: leviathan
    en: "... What is that?"
    ko: "…뭐야 저건."
    ja: "…誰、あれ。"
  d_main_46_08_126:
    speaker: behemoth
    en: A human impostor...? But something feels of...
    ko: 유사 인간…? 그런데 느낌이 뭔가 이상-
    ja: |-
      人間もどきか…？
      それにしちゃ、なんか雰囲気が…
  d_main_46_08_127:
    speaker: "<Narration>"
    en: The Thing closes the distance in an instant.
    ko: "[그것]이 순식간에 거리를 좁힌다."
    ja: 人影が一瞬で間合いを詰めた
  d_main_46_08_128:
    speaker: "<Narration>"
    en: Her gaze locks onto the girl in Behemoth's arms.
    ko: 그 시선은, 정확히 베히모스의 품에 안긴 소녀를 바라본다.
    ja: |-
      その視線はベヒモスが懐に抱えた少女を
      迷いなく狙っていた
  d_main_46_08_129:
    speaker: "<Narration>"
    en: Behemoth reflexively turns and shields the girl.
    ko: 베히모스는 반사적으로 소녀를 감싸며 등을 돌린다.
    ja: ベヒモスが反射的に背を向け、かばった
  d_main_46_08_130:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: ドゴッ！
  d_main_46_08_131:
    speaker: "<Narration>"
    en: A thunderous roar echoes out.
    ko: 굉음이 울려 퍼진다.
    ja: 轟音が響いた
  d_main_46_08_132:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩.
    ja: ドサッ…
  d_main_46_08_133:
    speaker: "<Narration>"
    en: Behemoth collapses to her knees, the upper half of her body now missing.
    ko: 상체를 잃은 베히모스의 몸이 바닥에 무릎을 꿇는다.
    ja: 上半身を吹き飛ばされ、ベヒモスがひざをついた
  d_main_46_08_134:
    speaker: "<Narration>"
    en: The girl, flung aside, lies on the ground staring at the lower half of Behemoth
      that remains.
    ko: 튕겨 나간 소녀가 쓰러진 채, 하반신만 남은 베히모스를 바라본다.
    ja: |-
      投げ出された少女は、
      倒れたまま下半身だけになった
      ベヒモスを見つめた
  d_main_46_08_135:
    speaker: "<Narration>"
    en: She crawls over and touches the core lying on the floor.
    ko: 엉금엉금 기어가, 바닥에 널브러진 코어를 만진다.
    ja: |-
      ゆっくりと這い出し、
      地面に飛び散ったコアに触れた
  d_main_46_08_136:
    speaker: onlyone_c
    en: Moth. Moth.
    ko: 언니. 언니.
    ja: お姉ちゃん。お姉ちゃん。
  d_main_46_08_137:
    speaker: "<Narration>"
    en: The Thing looks down at the girl and raises her foot.
    ko: "[그것]이 소녀를 내려다보며 발을 들어 올린다."
    ja: |-
      その様子を見下ろしながら、
      襲撃者は足を振り上げた
  d_main_46_08_138:
    speaker: "<Narration>"
    en: A fire ignites in the eyes of Leviathan, Ziz, and Bahamut.
    ko: 레비아탄과 지즈, 바하무트의 눈에서 불꽃이 튀었다.
    ja: |-
      レヴィアタンとジズ、バハムートが
      怒りに目をたぎらせていた
  d_main_46_08_139:
    speaker: ziz
    en: Get your foot away!
    ko: 발 치워--!!
    ja: やめて――！！
  d_main_46_08_140:
    speaker: leviathan
    en: What are you?!
    ko: 너 뭐야--!!
    ja: 何なのよ、あんた！！
  d_main_46_08_141:
    speaker: bahamut
    en: You'll pay for this!
    ko: "…죽여주마."
    ja: "…殺してやろう。"
  d_main_46_08_142:
    speaker: "<Narration>"
    en: Black light bursts forth, staining the white Ark.
    ko: 검은빛이 터져 나와, 하얀 방주를 물들인다.
    ja: |-
      黒い光が白い街並みさえも
      染めるような勢いであふれだした
d_main_46_09:
  d_main_46_09_1:
    speaker: onlyone_c
    en: Ziz. Ziz.
    ko: 언니. 언니.
    ja: お姉ちゃん…お姉ちゃん…
  d_main_46_09_2:
    speaker: "<Narration>"
    en: Ziz does not move. Her wings have been completely torn apart.
    ko: |-
      지즈는 움직이지 않는다.
      날개가 모두 찢어졌다.
    ja: |-
      ジズは動かない。
      翼がすべてへし折られている
  d_main_46_09_3:
    speaker: onlyone_c
    en: Bah. Bah.
    ko: 언니. 언니.
    ja: お姉ちゃん…お姉ちゃん…
  d_main_46_09_4:
    speaker: "<Narration>"
    en: Bahamut is motionless. Half of her upper body has vanished.
    ko: |-
      바하무트는 움직이지 않는다.
      상반신 절반이 사라져 있다.
    ja: |-
      バハムートも動かない。
      上半身がほとんど消し飛んでいる
  d_main_46_09_5:
    speaker: onlyone_c
    en: Vi. Vi.
    ko: 언니. 언니.
    ja: お姉ちゃん…お姉ちゃん…
  d_main_46_09_6:
    speaker: leviathan
    en: "*Cough, cough*"
    ko: 켁… 케흑…!
    ja: カハッ…ゲホッ…！
  d_main_46_09_7:
    speaker: "<Narration>"
    en: Leviathan's body is grotesquely contorted in several places. She writhes in
      agony.
    ko: |-
      레비아탄은 몸 곳곳이 엉망으로 뒤틀려있다.
      고통에 몸부림치고 있다.
    ja: |-
      体のあちこちが不自然に折れ曲がった
      レヴィアタンは、苦痛にもだえている
  d_main_46_09_8:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_9:
    speaker: onlyone_c
    en: Vi. Hurt?
    ko: 언니. 아파?
    ja: お姉ちゃん。苦しいの？
  d_main_46_09_10:
    speaker: leviathan
    en: Run... ughh! Run...! Go...!
    ko: 도망… 크학! 도망…! 가…!
    ja: 逃げ…ゲホッ！逃げ…て…！
  d_main_46_09_11:
    speaker: leviathan
    en: Don't... fight...!
    ko: 싸우… 지 말… 고…!
    ja: 戦わ…ない…で…！
  d_main_46_09_12:
    speaker: leviathan
    en: Run... away... now...!
    ko: 도… 망… 가…!
    ja: に…げ…て…！
  d_main_46_09_13:
    speaker: "<Narration>"
    en: The Thing steadies her breathing.
    ko: "[그것]이 호흡을 가다듬는다."
    ja: "「それ」は息を吐き出し…"
  d_main_46_09_14:
    speaker: "<Narration>"
    en: She shakes off the Dark Matter clinging to her body.
    ko: 몸 곳곳에 달라붙은 다크 매터를 털어낸다.
    ja: 身体にまとわりつくダークマターを払い落とした
  d_main_46_09_15:
    speaker: "<Narration>"
    en: Her gaze sweeps across the Four Beasts scattered on the ground,
    ko: 바닥에 널브러진 포비스트를 바라본다.
    ja: |-
      さらに地面を転がる
      フォービーストたちの残骸に視線を向けた後…
  d_main_46_09_16:
    speaker: "<Narration>"
    en: then settles on the girl standing in their midst.
    ko: 그 중심에 서 있는 소녀를 바라본다.
    ja: その中心で立つ少女を見すえた
  d_main_46_09_17:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_18:
    speaker: onlyone_c
    en: You.
    ko: 너.
    ja: お前…
  d_main_46_09_19:
    speaker: onlyone_c
    en: Bad girl.
    ko: 나쁜 사람.
    ja: 悪いヒト。
  d_main_46_09_20:
    speaker: "<Narration>"
    en: The ground beneath the girl begins to turn black.
    ko: 소녀의 바닥이 검게 물들기 시작한다.
    ja: 少女の足下の大地が黒く染まった
  d_main_46_09_21:
    speaker: "<Narration>"
    en: It continues to spread, wider and wider.
    ko: 점점 더 영역을 넓혀간다.
    ja: 漆黒が徐々に広がる
  d_main_46_09_22:
    speaker: "<Narration>"
    en: As Leviathan sinks into the blackness, she desperately shouts.
    ko: 레비아탄은 검은 바닥 안으로 잠겨가며, 필사적으로 외쳤다.
    ja: |-
      黒く染まる大地の中へ沈められながら、
      レヴィアタンは必死に声をあげた
  d_main_46_09_23:
    speaker: leviathan
    en: No...! You... mustn't... fight...!
    ko: 안 돼…! 싸우면… 안… 돼…!
    ja: ダメ…！戦っちゃ…ダメ…！
  d_main_46_09_24:
    speaker: leviathan
    en: Run...!
    ko: 도망…!
    ja: 逃げ…！
  d_main_46_09_25:
    speaker: "<Narration>"
    en: The Four Beasts sink into the blackness created by the girl.
    ko: 소녀가 만들어낸 검은 바닥에 포비스트가 잠긴다.
    ja: 漆黒の海がフォービーストを飲み込んだ
  d_main_46_09_26:
    speaker: "<Narration>"
    en: Gigantic wings unfurl, and drill shafts and pincers rise up from the ground.
    ko: 거대한 날개가 펼쳐지고, 바닥에서 시추공과 집게가 솟아오른다.
    ja: |-
      少女は巨大な翼を広げ、
      巨大な柱とアームが黒い海から飛び出した
  d_main_46_09_27:
    speaker: "<Narration>"
    en: The Thing charges forward.
    ko: "[그것]이 달려든다."
    ja: "「それ」は構わず飛びかかり…"
  d_main_46_09_28:
    speaker: "<Narration>"
    en: A mass of arms surge up from the ground and latches onto the Thing's legs.
    ko: 바닥에서 솟은 수많은 팔이 [그것]의 다리를 붙잡는다.
    ja: |-
      地面から飛び出した無数のアームに
      脚をつかまれた
  d_main_46_09_29:
    speaker: "<Narration>"
    en: She tries to shake them off but cannot, for their strength is tremendous.
    ko: 뿌리치려 하지만 안된다. 힘이 굉장하다.
    ja: |-
      払いのけようとしたものの、
      凄まじい力に押さえ付けられる
  d_main_46_09_30:
    speaker: "<Narration>"
    en: The girl's pincers strike ferociously at the immobilized Thing.
    ko: 움직이지 못하는 [그것]을 소녀의 집게가 마구 후려친다.
    ja: |-
      身動きできなくなった身体に、
      別のアームが叩きつけられた
  d_main_46_09_31:
    speaker: "<Narration>"
    en: The Thing staggers, then tears off the hands gripping her with sheer force.
    ko: 휘청이는 [그것]이 힘을 줘 붙잡은 손들을 뜯어낸다.
    ja: |-
      「それ」は体勢を崩しながら、
      体をつかむアームを力づくではがした
  d_main_46_09_32:
    speaker: "<Narration>"
    en: She catches the swinging pincers and twists. With a sickening crunch sound,
      the pincers warp and shatter.
    ko: |-
      휘둘러지는 집게를 잡고 뒤튼다.
      콰드드득- 하는 소리와 함께 집게가 뒤틀려 부서진다.
    ja: |-
      暴れ狂うアームがねじれ、
      固い音を立てて壊れた
  d_main_46_09_33:
    speaker: "<Narration>"
    en: The Thing drives her fist into the girl's torso.
    ko: "[그것]의 주먹이 소녀의 몸통을 친다."
    ja: 間を置かず少女の身体に拳が叩きつけられる
  d_main_46_09_34:
    speaker: "<Narration>"
    en: Part of the girl's upper body disappears with a thunderous boom, but it regenerates
      almost instantly.
    ko: |-
      펑-! 하는 소리와 함께 소녀의 상반신 일부가 사라진다.
      하지만 곧 재생된다.
    ja: |-
      轟音と共に上半身が形を失ったものの、
      瞬く間に再生した
  d_main_46_09_35:
    speaker: "<Narration>"
    en: A massive pillar is summoned. Simultaneously, another swarm of arms rises
      up once more.
    ko: |-
      거대한 기둥을 불러낸다.
      동시에 다시 한번 수많은 팔을 불러낸다.
    ja: |-
      巨大な柱と無数のアームが
      さらに地面から伸びあがる
  d_main_46_09_36:
    speaker: "<Narration>"
    en: The Thing takes her stance.
    ko: "[그것]이 자세를 잡는다."
    ja: "「それ」が構えを取った"
  d_main_46_09_37:
    speaker: "<Narration>"
    en: The girl lashes out with her pillar and arms, with a ferocity that could tear
      her opponent asunder.
    ko: |-
      소녀는 기둥과 팔을 마구 휘두른다.
      눈앞의 상대를 찢어발길 기세로 휘두른다.
    ja: |-
      少女の無造作に振り回す柱とアームが
      引き裂かんばかりの勢いで迫る
  d_main_46_09_38:
    speaker: "<Narration>"
    en: Meanwhile, the Thing wildly throws her fists, intent on pulverizing anything
      in her path.
    ko: |-
      [그것]이 주먹을 마구 휘두른다.
      눈앞의 상대를 분쇄할 기세로 휘두른다.
    ja: |-
      「それ」も答えるかのように、
      破壊の意志が乗った拳を叩きつけた
  d_main_46_09_39:
    speaker: "<Narration>"
    en: "*Boom! Bang! Crash! Bang!*"
    ko: 쾅! 콰앙-! 콰앙! 쾅!
    ja: 爆音が絶え間なく響く
  d_main_46_09_40:
    speaker: "<Narration>"
    en: The girl's Dark Matter and the Thing's fists collide over and over.
    ko: 소녀의 다크 매터와 [그것]의 주먹이 수도 없이 부딪힌다.
    ja: ダークマターと拳が何度も激突する
  d_main_46_09_41:
    speaker: "<Narration>"
    en: Shockwaves ripple outward. The pseudo-Ark's buildings tremble and the ground
      splits open.
    ko: 충격파가 퍼져나간다. 유사 방주의 건물들이 흔들린다. 지면이 갈라진다.
    ja: |-
      衝撃の余波が白一色の街並みを揺るがし、
      大地を引き裂いた
  d_main_46_09_42:
    speaker: "<Narration>"
    en: "*Boom! Bang! Crash! Bang!*"
    ko: 쾅! 콰앙-! 콰앙! 쾅!
    ja: ひときわ大きな轟音が響く
  d_main_46_09_43:
    speaker: "<Narration>"
    en: The fierce stalemate continues, until the balance is broken by the Thing.
    ko: |-
      팽팽한 접전이 이어진다.
      그 균형이 [그것]에 의해 깨진다.
    ja: |-
      やがて激しい接戦の均衡を破る一撃が、
      「それ」の側から放たれた
  d_main_46_09_44:
    speaker: "<Narration>"
    en: A low kick aimed at the girl's legs tears them clean off.
    ko: 발차기. 소녀의 다리를 노린 낮은 발차기가 소녀의 다리를 뜯어낸다.
    ja: |-
      脚を狙った低い蹴りが、
      少女の脚を吹き飛ばしたのだ
  d_main_46_09_45:
    speaker: "<Narration>"
    en: The girl crumples to the ground, her legs gone. The Thing rains down punches
      from above.
    ko: |-
      다리를 잃은 소녀가 바닥에 쓰러진다.
      [그것]이 아래를 향해 주먹을 난사한다.
    ja: |-
      地面に倒れ込んだ少女に向かい、
      容赦のない乱打が浴びせらせる
  d_main_46_09_46:
    speaker: "<Narration>"
    en: Under the barrage of fists, the girl panics. This is something she has never
      felt before.
    ko: |-
      쏟아지는 주먹에 소녀가 당황한다.
      이런 경험은 처음이다.
    ja: |-
      降り注ぐ拳に少女は困惑した。
      今までに経験したことのない事態だ
  d_main_46_09_47:
    speaker: onlyone_c
    en: Hurt.
    ko: 아파.
    ja: いたい…
  d_main_46_09_48:
    speaker: "<Narration>"
    en: Black light erupts.
    ko: 검은빛이 터져 나온다.
    ja: 黒い光があふれ出した
  d_main_46_09_49:
    speaker: "<Narration>"
    en: The Thing looks up at the black spire that has suddenly risen before her.
    ko: "[그것]은 갑작스럽게 솟아오른 검은 탑을 올려다본다."
    ja: |-
      突然伸びあがり始めた黒い巨塔を
      「それ」は見上げた
  d_main_46_09_50:
    speaker: "<Narration>"
    en: Beams of light pour down from the spire, and black thorns rain down like a
      storm.
    ko: |-
      탑에서 광선이 쏟아져 내려온다.
      검은 가시가 비처럼 내린다.
    ja: |-
      塔から放たれる光線と漆黒のトゲが
      雨のように降り注いだ
  d_main_46_09_51:
    speaker: "<Narration>"
    en: The Thing swiftly evades the projectiles, but it's useless. There are simply
      too many of them.
    ko: |-
      [그것]은 빠른 움직임으로 공격들을 회피한다.
      하지만 역부족이다. 너무 많다.
    ja: |-
      「それ」はすぐさま回避を試みたものの
      雨粒を全て避け切るようなことは
      できるはずもない
  d_main_46_09_52:
    speaker: "<Narration>"
    en: A beam catches her in the torso and sends her staggering. The attacks that
      had been spreading in all directions now concentrate solely on the Thing.
    ko: |-
      몸통에 광선을 맞아 자세가 무너진다.
      사방으로 퍼져나가던 공격이 [그것]에게로 집중된다.
    ja: |-
      身体中を光線に打たれ、体勢が崩れた。
      広範囲に拡散していた攻撃が
      すぐさま一点に集中し始める
  d_main_46_09_53:
    speaker: "<Narration>"
    en: For the first time since inhabiting this body,
    ko: "[그것]은 이 바디를 가진 이후 처음으로"
    ja: |-
      その時「それ」は、
      リリーバイスのボディを
      手に入れて以来、初めて…
  d_main_46_09_54:
    speaker: "<Narration>"
    en: the Thing adopts a defensive stance.
    ko: 방어 자세를 취했다.
    ja: 防御の姿勢を取った
  d_main_46_09_55:
    speaker: "<Narration>"
    en: Beams of light and black thorns crash down upon her.
    ko: 광선과 검은 가시가 [그것]을 덮친다.
    ja: 光線と黒いトゲがいっせいに襲い掛かる
  d_main_46_09_56:
    speaker: "<Narration>"
    en: After raining down attacks for a long while, the girl looks downward.
    ko: 한참 동안 공격을 쏟아붓던 소녀가 아래를 내려다본다.
    ja: |-
      しばらく攻撃を浴びせ続けた後、
      少女は下の様子を確かめた
  d_main_46_09_57:
    speaker: "<Narration>"
    en: The Thing is on one knee, staring up at her.
    ko: "[그것]은 한쪽 무릎을 꿇은 채 자신을 바라보고 있다."
    ja: |-
      「それ」は片ひざをつき、
      こちらを見上げていた
  d_main_46_09_58:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_59:
    speaker: onlyone_c
    en: Die.
    ko: 죽일래.
    ja: やっつける。
  d_main_46_09_60:
    speaker: "<Narration>"
    en: Massive pincers, pillars, and drill shafts burst from the spire. All of them
      pointed downward.
    ko: |-
      거대한 집게, 기둥, 시추공이 탑에서 튀어나온다.
      각각의 머리가 아래를 향한다.
    ja: |-
      巨大なアーム、ローラー、
      そして柱が塔から飛び出し、
      地面へと急降下していく
  d_main_46_09_61:
    speaker: "<Narration>"
    en: The Thing looks up at the colossal black spire looming before her.
    ko: "[그것]은 눈앞의 거대한 검은 탑을 올려다본다."
    ja: |-
      「それ」は目の前にそびえたつ
      巨大な黒い塔を見上げた
  d_main_46_09_62:
    speaker: "<Narration>"
    en: She shifts her gaze to her own body,
    ko: 시선을 돌려 자신의 몸을 본다.
    ja: その視線が、自身のボディに移る
  d_main_46_09_63:
    speaker: "<Narration>"
    en: then back at the spire,
    ko: 다시 탑을 올려다보고.
    ja: さらにもう一度塔を見上げ…
  d_main_46_09_64:
    speaker: "<Narration>"
    en: and back to herself.
    ko: 다시 자신의 몸을 본다.
    ja: 自身のボディに視線を戻した
  d_main_46_09_65:
    speaker: "<Narration>"
    en: Fury spreads across her face.
    ko: "[그것]의 얼굴에 분노가 떠올랐다."
    ja: その顔には、怒りの表情が浮かんでいた
  d_main_46_09_66:
    speaker: "<Narration>"
    en: At that moment, Leviathan comes flying out of the black spire.
    ko: 그때, 검은 탑에서 레비아탄이 튀어나왔다.
    ja: |-
      しかし突然、塔から
      レヴィアタンの身体が飛び出した
  d_main_46_09_67:
    speaker: leviathan
    en: Stop!
    ko: 그만--!!
    ja: やめて――！！
  d_main_46_09_68:
    speaker: onlyone_c
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_46_09_69:
    speaker: leviathan
    en: Enough! No more fighting!
    ko: 그만해! 싸우지 마!
    ja: やめなさい！戦っちゃダメ！
  d_main_46_09_70:
    speaker: onlyone_c
    en: Vi.
    ko: 언니.
    ja: お姉ちゃん。
  d_main_46_09_71:
    speaker: "<Narration>"
    en: The girl points at the Thing.
    ko: 소녀가 [그것]을 손가락으로 가리킨다.
    ja: 少女が「それ」を指差した
  d_main_46_09_72:
    speaker: onlyone_c
    en: Bad girl.
    ko: 나쁜 사람.
    ja: 悪いヒト。
  d_main_46_09_73:
    speaker: onlyone_c
    en: Die.
    ko: 죽일래.
    ja: やっつける。
  d_main_46_09_74:
    speaker: leviathan
    en: No! Don't kill her!
    ko: 안돼! 죽이지 마!
    ja: ダメ！殺さなくていい！
  d_main_46_09_75:
    speaker: leviathan
    en: You don't need to do that! Leave the fighting to us!
    ko: 너는 그럴 필요 없어! 싸우는 건 우리가 해!
    ja: |-
      あんたはそんなことしなくていいの！
      私たちが戦うから！
  d_main_46_09_76:
    speaker: leviathan
    en: So just stop!
    ko: 그러니까 하지 마!
    ja: もうやめて！
  d_main_46_09_77:
    speaker: leviathan
    en: All you have to do is sneak bites of grilled fish, hitch rides on us, and
      go for walks.
    ko: |-
      너는 그냥 구운 생선이나 훔쳐먹고!
      우리를 타고 산책이나 다니고!
    ja: |-
      あんたはただ、焼き魚を盗み食いして！
      私たちの背中に乗ってお散歩して！
  d_main_46_09_78:
    speaker: leviathan
    en: Just snuggle up and sleep in our arms! You don't have to fight!
    ko: |-
      품에 안겨서 자면 돼!
      싸울 필요 없어!
    ja: |-
      抱っこされながら寝てればいいの！
      戦わなくていい！
  d_main_46_09_79:
    speaker: onlyone_c
    en: She hurt you.
    ko: 언니들 아프게 했어.
    ja: お姉ちゃんたち、苦しめた。
  d_main_46_09_80:
    speaker: onlyone_c
    en: Bad girl.
    ko: 나쁜 사람.
    ja: だから、悪いヒト。
  d_main_46_09_81:
    speaker: leviathan
    en: We're... fine...! We're not hurting anymore!
    ko: |-
      괜찮… 아…!
      우리들 이제 안 아파!
    ja: |-
      もう平気…！
      私たちなら、痛くもなんともないから！
  d_main_46_09_82:
    speaker: leviathan
    en: So don't. Let's just go.
    ko: 그러니까, 하지 말고, 가자.
    ja: だから、こんなことやめて、行きましょ？
  d_main_46_09_83:
    speaker: leviathan
    en: Let's go. Okay?
    ko: 가자. 응?
    ja: ほら…ねっ？
  d_main_46_09_84:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_85:
    speaker: onlyone_c
    en: "'Kay."
    ko: 응.
    ja: うん。
  d_main_46_09_86:
    speaker: "<Narration>"
    en: The black spire disappears and the Four Beasts are left floating in midair.
    ko: |-
      검은 탑이 사라진다.
      포비스트가 허공에 떠 있다.
    ja: |-
      黒い塔が消えた。
      フォービーストは空中に放り出された
  d_main_46_09_87:
    speaker: leviathan
    en: Ziz!!
    ko: 지즈--!!
    ja: ジズ！！
  d_main_46_09_88:
    speaker: ziz
    en: Y-yeah!
    ko: 으, 응!
    ja: う、うん！
  d_main_46_09_89:
    speaker: "<Narration>"
    en: Ziz's wings spread wide.
    ko: 지즈의 날개가 크게 펼쳐진다.
    ja: ジズが翼を大きく広げ…
  d_main_46_09_90:
    speaker: "<Narration>"
    en: She carries everyone and quickly takes flight.
    ko: 모두를 짊어지고, 빠르게 날아간다.
    ja: |-
      全員を素早く背中に乗せると、
      瞬く間に飛び去った
  d_main_46_09_91:
    speaker: "<Narration>"
    en: The Thing watches them go with fury etched across her face.
    ko: "[그것]이 그 모습을, 분노에 찬 얼굴로 바라본다."
    ja: |-
      「それ」は怒りに顔を歪ませ
      飛び去るジズを見届けていた
  d_main_46_09_92:
    speaker: behemoth
    en: We almost died back there.
    ko: "…죽을 뻔했어."
    ja: "…死ぬかと思った。"
  d_main_46_09_93:
    speaker: ziz
    en: Yeah... even after transforming...
    ko: |-
      지, 진짜.
      거대화까지 했는데….
    ja: |-
      ほ、ホント。
      巨大化までしたのに…
  d_main_46_09_94:
    speaker: bahamut
    en: What was that thing? It looked like a pseudohuman.
    ko: "…뭐냐 저건. 유사 인간이 아닌가?"
    ja: |-
      …何だったんだ、あれは。
      人間もどきではないのか？
  d_main_46_09_95:
    speaker: behemoth
    en: It certainly had the appearance of one...
    ko: 생긴 건 누가 봐도 유사 인간인데….
    ja: 見た目はどう考えてもそのはずだけどな…
  d_main_46_09_96:
    speaker: behemoth
    en: But it was unbelievably strong.
    ko: "…말도 안 되게 강했지."
    ja: "…けた外れの強さだった。"
  d_main_46_09_97:
    speaker: ziz
    en: Wh-what even was that thing...?
    ko: 뭘… 까 저건.
    ja: それって…どういうことかな。
  d_main_46_09_98:
    speaker: bahamut
    en: Even I, the ever astute Bahamut, cannot say.
    ko: 똑똑한 바하무트도 그건 모르겠다.
    ja: 賢いバハムートにも分からないことはある。
  d_main_46_09_99:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_100:
    speaker: onlyone_c
    en: Moth. Moth.
    ko: 언니. 언니.
    ja: お姉ちゃん。お姉ちゃん。
  d_main_46_09_101:
    speaker: behemoth
    en: Yes, yes. You saved us. Thank you.
    ko: "…그래그래. 네가 우릴 구해줬구나. 고마워."
    ja: |-
      …よしよし。
      あたしたちを助けてくれたんだろ、
      ありがとな。
  d_main_46_09_102:
    speaker: onlyone_c
    en: Uh-huh. I scold bad girl.
    ko: 응. 응. 나쁜 사람 혼내줬어.
    ja: うん。うん。悪いヒト、おしおきした。
  d_main_46_09_103:
    speaker: leviathan
    en: No more fighting though, okay?
    ko: 다시는 싸우지 마.
    ja: もう二度とやっちゃダメよ。
  d_main_46_09_104:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_105:
    speaker: onlyone_c
    en: No.
    ko: 싫어.
    ja: ヤ。
  d_main_46_09_106:
    speaker: leviathan
    en: Don't you dare do it!
    ko: 너 하지 마.
    ja: やめて。
  d_main_46_09_107:
    speaker: onlyone_c
    en: No.
    ko: 싫어.
    ja: ヤ。
  d_main_46_09_108:
    speaker: leviathan
    en: What the... this kid is getting more defiant by the day!
    ko: 아 정말 애가 어떻게 가면 갈수록 말을 안 듣…!
    ja: |-
      もう、どんどん言うこと
      聞かなくなってきてる…！
  d_main_46_09_109:
    speaker: onlyone_c
    en: Who hurt my sisters. I'll kill them all.
    ko: 언니들 괴롭히면. 내가 다 죽일 거야.
    ja: |-
      お姉ちゃんたち、苦しめるヒト、
      みんなやっつける。
  d_main_46_09_110:
    speaker: onlyone_c
    en: Don't like you hurting. Don't like bullies.
    ko: |-
      언니들 아픈 거 싫어.
      괴롭히는 거 싫어.
    ja: |-
      お姉ちゃんたち、ケガするの、イヤ。
      苦しむの、イヤ。
  d_main_46_09_111:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_112:
    speaker: leviathan
    en: All the same, I don't want you fighting.
    ko: 그래도 싸우지 마.
    ja: それでも、戦っちゃダメ。
  d_main_46_09_113:
    speaker: leviathan
    en: Please. Okay?
    ko: 부탁할게. 알겠지?
    ja: お願いだから。分かった？
  d_main_46_09_114:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_115:
    speaker: onlyone_c
    en: Maybe.
    ko: 몰라.
    ja: わかんない…
  d_main_46_09_116:
    speaker: onlyone_c
    en: "*Soft snores*"
    ko: 쿠우… 쿠우….
    ja: "…すぅ…すぅ…"
  d_main_46_09_117:
    speaker: "<Narration>"
    en: The girl had fallen asleep in Leviathan's arms.
    ko: 소녀는 레비아탄의 품에 안겨 잠들어 있었다.
    ja: レヴィアタンの腕の中で、少女は眠りに落ちた
  d_main_46_09_118:
    speaker: "<Narration>"
    en: Leviathan looks down at her with a troubled expression.
    ko: 레비아탄은 품에 안긴 소녀를, 착잡한 표정으로 바라본다.
    ja: |-
      レヴィアタンは胸に抱いた少女を
      複雑な顔で見つめた
  d_main_46_09_119:
    speaker: ziz
    en: Um... L-Levi?
    ko: "…저, 레, 레비."
    ja: "…ね、ねえ、レヴィ。"
  d_main_46_09_120:
    speaker: leviathan
    en: Yeah?
    ko: 응?
    ja: 何？
  d_main_46_09_121:
    speaker: ziz
    en: Why... why are you telling her not to fight?
    ko: 왜… 저 아이한테 싸우지 말라고 하는 거야?
    ja: なんで…戦っちゃダメって言うの？
  d_main_46_09_122:
    speaker: ziz
    en: Sh-she's so strong. She might have won that fight earlier.
    ko: |-
      어, 엄청 강한데.
      좀 전에도 이길 수 있었을지도 몰라.
    ja: |-
      だって、ものすごく強いでしょ？
      さっきだって、勝てたかもしれないし…
  d_main_46_09_123:
    speaker: leviathan
    en: "... You're right. She is strong. Unbelievably so."
    ko: "…맞지. 강하지. 말도 안 될 만큼."
    ja: "…分かってる。強かった。信じられないくらい。"
  d_main_46_09_124:
    speaker: ziz
    en: Th-then why...
    ko: 그, 그런데 왜….
    ja: じゃ、じゃあどうして…
  d_main_46_09_125:
    speaker: bahamut
    en: No parent wishes to see their child fighting.
    ko: 자식이 싸우고 다녀서 좋아할 부모는 없다.
    ja: 我が子を戦争に出して喜ぶ親などいるものか。
  d_main_46_09_126:
    speaker: ziz
    en: Oh... W-well, I guess that's true...
    ko: 어? 그, 그건 나도 그렇긴 한데에….
    ja: え？そ、それはそうかもしれないけど…
  d_main_46_09_127:
    speaker: ziz
    en: But there are times when fighting is the only solution.
    ko: 우리. 싸우지 않으면 해결되지 않을 일도 많을 테니까아….
    ja: |-
      でも、戦わないと解決しないことだって
      私たちにはいっぱいあるし…
  d_main_46_09_128:
    speaker: ziz
    en: At least to protect ourselves...
    ko: 적어도 몸을 지킬 수 있을 만큼은….
    ja: 最低でも、自分の身を守るためぐらいなら…
  d_main_46_09_129:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_130:
    speaker: behemoth
    en: Levi. Tell me what you're thinking.
    ko: 레비. 네 생각을 얘기해줘.
    ja: レヴィ、考えてることを聞かせてくれよ。
  d_main_46_09_131:
    speaker: leviathan
    en: She's strong. Too strong.
    ko: "…이 아이는 강해. 너무 강해."
    ja: |-
      …この子が強いのは分かってる。
      それもけた違いに。
  d_main_46_09_132:
    speaker: leviathan
    en: With her power, she could probably solve most things.
    ko: 힘을 쓰면 아마 대부분의 일이 해결될 거야.
    ja: |-
      力づくで、ほとんどどんな問題でも
      解決できるぐらい。
  d_main_46_09_133:
    speaker: leviathan
    en: She could take anything she wants, without exception.
    ko: |-
      원하는 걸 다 손에 넣을 수 있겠지.
      그게 무엇이든.
    ja: |-
      欲しいと思ったら、
      何でも自分で手に入れられる。
      たぶん、どんなものでも。
  d_main_46_09_134:
    speaker: leviathan
    en: She won't even need to control her emotions. She could just unleash them alongside
      her power.
    ko: |-
      감정을 다스릴 필요도 없어.
      그저 힘과 함께 표출하면 되니까.
    ja: |-
      感情を抑える必要だってないでしょ。
      力づくで何でも押し通せるんだから。
  d_main_46_09_135:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_136:
    speaker: leviathan
    en: And that can't happen. It mustn't.
    ko: 그러면 안 돼. 그래선 안 돼.
    ja: でも、ダメなの。そうさせちゃ。
  d_main_46_09_137:
    speaker: leviathan
    en: If she repeatedly uses her power every time she wants something,
    ko: |-
      원하는 게 있을 때마다 힘을 써서 이뤄버리면.
      그게 반복되면.
    ja: |-
      欲しいものができるたびに
      力づくで手に入れるなんてこと、
      ずっと続けさせたら…
  d_main_46_09_138:
    speaker: leviathan
    en: she'll turn into a real monster.
    ko: 진짜 괴물이 되어버릴 거라고.
    ja: きっといつか、本物の怪物になっちゃうから。
  d_main_46_09_139:
    speaker: behemoth
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_140:
    speaker: behemoth
    en: But why not?
    ko: 왜 그러면 안 되는데?
    ja: それじゃダメだって言いたいんだな？
  d_main_46_09_141:
    speaker: behemoth
    en: Why don't you want her to become a monster?
    ko: 이 아이를 왜 괴물로 만들고 싶지 않은 거야?
    ja: どうしてこいつをバケモノにしたくねぇんだ？
  d_main_46_09_142:
    speaker: behemoth
    en: Is it because you promised Siren her power would only be used for good?
    ko: 이 아이의 힘을 반드시 선한 곳에 쓰겠다고, 세이렌과 약속해서?
    ja: |-
      力を正しいことだけに使わせるって、
      セイレーンと約束したからか？
  d_main_46_09_143:
    speaker: leviathan
    en: "... That's part of it."
    ko: "…그것도 있지만."
    ja: "…それもあるけど。"
  d_main_46_09_144:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_145:
    speaker: leviathan
    en: That kid. We made her.
    ko: 얘. 우리가 만들었잖아.
    ja: 作っちゃったのは、私たちだから。
  d_main_46_09_146:
    speaker: leviathan
    en: She had no say in her creation.
    ko: 이 아이가 원했든 원하지 않았든 우리가 만들었잖아.
    ja: |-
      この子の意志とか関係なく、
      私たちが生み出しちゃったものだから。
  d_main_46_09_147:
    speaker: leviathan
    en: After selfishly bringing her into this world,
    ko: 그렇게 멋대로 만들어 놓고.
    ja: 一方的にそうしておいて…
  d_main_46_09_148:
    speaker: leviathan
    en: we can't ask her to use her powers for our sake.
    ko: 우릴 위해 힘을 써달라고 할 수는 없잖아.
    ja: |-
      私たちのために力を使えなんて
      言えないじゃない。
  d_main_46_09_149:
    speaker: leviathan
    en: We can't ask her to become a monster for us.
    ko: 우릴 위해 괴물이 되어달라고 할 수 없잖아.
    ja: |-
      私たちに都合のいい怪物になれなんて
      言いたくないじゃない。
  d_main_46_09_150:
    speaker: leviathan
    en: But... damn it...!
    ko: 그런데… 씨이…!
    ja: なのに…うっ…！
  d_main_46_09_151:
    speaker: ziz
    en: Wh-why are you crying...
    ko: 왜, 왜 울어어….
    ja: な、なんで泣くのぉ…？
  d_main_46_09_152:
    speaker: leviathan
    en: I didn't want her to fight.
    ko: 싸우게 하고 싶지 않았어.
    ja: 戦わせたくなかっただけ。
  d_main_46_09_153:
    speaker: leviathan
    en: I don't know if we're even capable of it,
    ko: 우리가 할 수 있을지는 모르지만
    ja: 私たちは仕方ないけど…
  d_main_46_09_154:
    speaker: leviathan
    en: but I wanted her to live in a world where none of that exists.
    ko: 얘는 그런 거랑 관계없는 세계에서 살게 해주고 싶었다고.
    ja: |-
      この子だけは、戦うことなんて
      考えないでいい世界で
      生きててほしかっただけ。
  d_main_46_09_155:
    speaker: leviathan
    en: She's the child we created. I want her free from all that.
    ko: 우리가 만든 아이니까, 그런 거 없이.
    ja: 私たちの子には、辛い思いなんてせずに…
  d_main_46_09_156:
    speaker: leviathan
    en: I just wanted her to live happily...
    ko: 그냥 즐겁게 지내기만 바랬는데…!
    ja: ただ楽しく、生きていてほしかっただけ…！
  d_main_46_09_157:
    speaker: leviathan
    en: But in the end...!
    ko: 그런데 결국…! 결국…!
    ja: でも…！結局…！
  d_main_46_09_158:
    speaker: onlyone_c
    en: Mm... Mmm...
    ko: 우, 으응….
    ja: ん、うぅ～ん…
  d_main_46_09_159:
    speaker: "<Narration>"
    en: The girl wakes up.
    ko: 소녀가 잠에서 깬다.
    ja: 少女が眠りから覚めた
  d_main_46_09_160:
    speaker: "<Narration>"
    en: She lifts her head to look at Leviathan.
    ko: 고개를 들어 레비아탄의 얼굴을 바라본다.
    ja: 頭を上げ、レヴィアタンの顔を見つめた
  d_main_46_09_161:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_162:
    speaker: onlyone_c
    en: Vi.
    ko: 언니.
    ja: お姉ちゃん。
  d_main_46_09_163:
    speaker: onlyone_c
    en: Don't cry.
    ko: 울지 마.
    ja: 泣かないで。
  d_main_46_09_164:
    speaker: "<Narration>"
    en: She reaches out and wipes Leviathan's tears.
    ko: 소녀가 손을 뻗어 레비아탄의 눈물을 닦는다.
    ja: 少女が手を伸ばし、レヴィアタンの涙を拭いた
  d_main_46_09_165:
    speaker: leviathan
    en: This is why... I keep... crying!
    ko: 이러니까… 내가… 자꾸 운다고…!
    ja: |-
      そういうことされるから…
      余計に涙が出ちゃうの…！
  d_main_46_09_166:
    speaker: behemoth
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_167:
    speaker: bahamut
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_168:
    speaker: ziz
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_09_169:
    speaker: behemoth
    en: The child will grow up right.
    ko: 이 아이는 제대로 클 거야.
    ja: いい子に育つさ。
  d_main_46_09_170:
    speaker: behemoth
    en: She won't become a monster. Ever.
    ko: 절대. 괴물이 되지 않아.
    ja: 絶対ならねぇよ。バケモノなんて。
  d_main_46_09_171:
    speaker: ziz
    en: Yeah, we can do it. Let's make sure of that.
    ko: |-
      …응. 우리가 그렇게 만들자.
      만들 수 있어.
    ja: |-
      …うん、私たちで頑張ろ。
      きっとできるよ。
  d_main_46_09_172:
    speaker: bahamut
    en: Do you know what distinguishes a monster from something that isn't? It's the
      presence or absence of knowledge.
    ko: |-
      괴물과 그렇지 않은 것의 차이가 뭔지 알고 있나?
      지식의 유무다.
    ja: |-
      バケモノとそうではないものの
      違いは何か分かるか？
      それはすなわち、知識があるかないかだ。
  d_main_46_09_173:
    speaker: bahamut
    en: I, in all my astonishing wisdom, will impart all my knowledge unto this child.
      I shall personally see to it that she becomes a person of intellect.
    ko: |-
      똑똑한 바하무트가, 이 아이에게 모든 지식을 전수하겠다.
      책임지고 지식인으로 만들어주지.
    ja: |-
      賢いバハムートが、
      この子にあらゆる知識を授けてやろう。
      責任を持って、立派な知識人にしてみせる。
  d_main_46_09_174:
    speaker: behemoth
    en: "... She's doomed. I can already tell this is going to end badly."
    ko: "…큰일 났다. 벌써 망할 것 같아."
    ja: "…ヤバいぞ。ダメそうな気がしてきた。"
d_main_46_10:
  d_main_46_10_1:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_2:
    speaker: janghwa_n
    en: You look like you have a lot on your mind.
    ko: 생각이 많아 보이네?
    ja: ずいぶん思いつめた顔ね？
  d_main_46_10_3:
    speaker: nayuta
    en: Ah. Well, indeed.
    ko: 아아. 뭐, 그렇소.
    ja: ええ…まあ、少し。
  d_main_46_10_4:
    speaker: janghwa_n
    en: Feeling pushed around by Mirror?
    ko: 미러한테 너무 휘둘려서 그래?
    ja: ミラーの思い通りになってるから？
  d_main_46_10_5:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_6:
    speaker: janghwa_n
    en: It can't be helped. You lost so many of your clones since that day.
    ko: |-
      어쩔 수 없어.
      그날 이후 너는 분신을 많이 잃었고.
    ja: |-
      仕方ないでしょ。
      あなた自身も分身をたくさん失くしてるし…
  d_main_46_10_7:
    speaker: janghwa_n
    en: All of you lost a great deal of strength.
    ko: 너희는 많은 힘을 잃었지.
    ja: あなたの仲間も、かなり力を削られた。
  d_main_46_10_8:
    speaker: janghwa_n
    en: Meanwhile, the Queen got a clean slate,
    ko: 반면 퀸은 처음부터 다시 시작했어.
    ja: クイーンは最初からやり直すことにしただけ。
  d_main_46_10_9:
    speaker: janghwa_n
    en: and Mirror's been glued to her side, watching everything unfold.
    ko: 미러는 그 옆에 딱 달라붙어서 모든 걸 지켜보고 있고.
    ja: ミラーはその隣にくっついて、全部を見てる。
  d_main_46_10_10:
    speaker: janghwa_n
    en: There's bound to be a gap in our intel, don't you think?
    ko: 정보력에 차이가 날 수밖에 없지 않을까?
    ja: 情報収集に差が出るのは当然じゃない？
  d_main_46_10_11:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_12:
    speaker: janghwa_n
    en: Mirror wants to see where things are at for you all.
    ko: 미러는 너희의 지금 상황을 확인하고 싶어 해.
    ja: ミラーはあなたたちの実力を知りたがってる。
  d_main_46_10_13:
    speaker: janghwa_n
    en: Whether you truly have the power to stand against the Queen.
    ko: 과연 너희가 퀸과 맞서 싸울 힘이 있는지.
    ja: |-
      クイーンに対抗できる力が
      あなたたちにあるのか。
  d_main_46_10_14:
    speaker: snowwhite_h
    en: Stand against her? No. We're going to kill her.
    ko: 맞서 싸울 힘? 틀렸다. 우린 퀸을 죽인다.
    ja: |-
      対抗？違うな。
      私たちはクイーンを抹殺する。
  d_main_46_10_15:
    speaker: janghwa_n
    en: She wants to make sure it's not all talk.
    ko: 그게 말뿐인지 아닌지 확인하고 싶은 거야.
    ja: それが口先だけの話じゃないよねってこと。
  d_main_46_10_16:
    speaker: janghwa_n
    en: If you have what it takes to be the ones who kill the Queen,
    ko: 만약 너희가 여왕 시해자가 되기에 충분한 힘을 가지고 있다면
    ja: もしそうできる力が本当にあると見たら…
  d_main_46_10_17:
    speaker: janghwa_n
    en: Mirror will offer even more help than she does now.
    ko: 미러는 지금처럼, 어쩌면 지금보다 더 많은 도움을 줄 테고
    ja: |-
      ミラーは今みたいか、もしかしたら今以上に、
      力を貸そうとするはず。
  d_main_46_10_18:
    speaker: janghwa_n
    en: But if you're not...
    ko: 그렇지 않다면….
    ja: でも、そうじゃないって見たら…
  d_main_46_10_19:
    speaker: nayuta
    en: No doubt she shall cleave to the Queen's side without a moment's hesitation.
      That much I know.
    ko: |-
      손바닥 뒤집듯 퀸에게 붙겠지.
      그건 알고 있소.
    ja: |-
      手のひらを返してクイーンにつく。
      理解しています。
  d_main_46_10_20:
    speaker: janghwa_n
    en: Right. So don't disappoint her.
    ko: 응. 그러니까 실망시키지 마.
    ja: うん。だから、失望させないようにして。
  d_main_46_10_21:
    speaker: janghwa_n
    en: She's devious, but incredibly capable.
    ko: 하는 짓이 음흉해서 그렇지, 엄청 유능하니까.
    ja: |-
      やり方は陰険だけど、
      能力はあるヤツだから。
  d_main_46_10_22:
    speaker: janghwa_n
    en: Having her as an ally is always an advantage.
    ko: 아군으로 두는 편이 무조건 이득이야.
    ja: |-
      味方につけておいたほうが、
      きっと何かと有利でしょ。
  d_main_46_10_23:
    speaker: nayuta
    en: "... Art thou not speaking rather too much?"
    ko: "…말이 너무 많은 것 아니오?"
    ja: "…今日はずいぶんとお声が聞けるようですねぇ？"
  d_main_46_10_24:
    speaker: janghwa_n
    en: Oh, don't you worry. Mirror probably sent me to see you off just so I'd tell
      you all this.
    ko: 걱정 마. 나를 마중 나가는 것에 쓴 건 이런 얘기를 해주길 바래서일테니까.
    ja: |-
      心配しないで。
      私に見送りさせたのも、
      たぶんこのためだから。
  d_main_46_10_25:
    speaker: janghwa_n
    en: She loves making others do the talking for her.
    ko: 참 이런 거 좋아해. 본인 의도를 본인이 아니라 남의 입을 통해서 전달하는 거.
    ja: |-
      そういうシュミらしいの。
      自分の考えを誰かに
      代わりに言わせるのが好きみたい。
  d_main_46_10_26:
    speaker: janghwa_n
    en: She fancies herself a puppet master pulling strings from the shadows. She's
      devious to the core, that Mirror.
    ko: |-
      뒤에 숨은 실세 같은 거, 진짜 하고 싶나 봐.
      음흉하기 짝이 없어.
    ja: |-
      黒幕的な存在になりたいっていうのかしら？
      ホント、悪趣味でしょ。
  d_main_46_10_27:
    speaker: nayuta
    en: On that, I concur.
    ko: 그건 동의하오.
    ja: そこは同意しかできませんねぇ。
  d_main_46_10_28:
    speaker: snowwhite_h
    en: Nayuta.
    ko: 나유타.
    ja: ナユタ。
  d_main_46_10_29:
    speaker: nayuta
    en: "... Hm. What troubleth thee?"
    ko: "…음. 왜 그러시오."
    ja: "…私ですか？何か。"
  d_main_46_10_30:
    speaker: snowwhite_h
    en: Explain how you came to know this Mirror.
    ko: 저 미러라는 것과 네가 어떻게 아는 사이인지 설명해다오.
    ja: ミラーとお前の関係を説明してくれ。
  d_main_46_10_31:
    speaker: snowwhite_h
    en: She says she's helping us, but she's more like a Rapture strategist than anything
      else.
    ko: 우릴 도와준다고는 하고 있지만 저건 랩쳐의 참모에 가깝다.
    ja: |-
      私たちを助けると言っていたが、
      あれはほとんどラプチャーの頭脳役だ。
  d_main_46_10_32:
    speaker: snowwhite_h
    en: With how she talks about creating Liberalio, she's clearly been around for
      a long time.
    ko: 리버렐리오를 만들었다고 애기하는 걸로 봐선 오래전부터 활동한 게 분명해.
    ja: |-
      リバーレリオを作ったとも言っていた。
      かなり昔から活動していたに違いない。
  d_main_46_10_33:
    speaker: snowwhite_h
    en: That means she had a significant hand in humanity's destruction.
    ko: 즉, 인류를 죽이는 데 크게 일조한 녀석이라는 거다.
    ja: つまり、人類をそうとう殺したはずだ。
  d_main_46_10_34:
    speaker: snowwhite_h
    en: How did you end up allied with something like that?
    ko: 어째서 그런 것과 네가 협력 관계에 있는 거지?
    ja: なぜお前は、そんなものと協力している？
  d_main_46_10_35:
    speaker: nayuta
    en: What a predicament.
    ko: 난처하군.
    ja: 難しい質問ですねぇ。
  d_main_46_10_36:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_37:
    speaker: nayuta
    en: If I were to lie, wouldst thou let it pass?
    ko: 거짓말하면 넘어가 줄 것이오?
    ja: 適当に答えれば、見逃してもらえますか？
  d_main_46_10_38:
    speaker: snowwhite_h
    en: Fine. I'll believe it even if it's a lie.
    ko: 그래. 거짓말이라도 믿겠다.
    ja: ああ。嘘でも信じよう。
  d_main_46_10_39:
    speaker: nayuta
    en: What an even greater predicament this is.
    ko: 더 난처하군.
    ja: もっと難しくなりましたねぇ。
  d_main_46_10_40:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_41:
    speaker: nayuta
    en: "'Tis a simple enough tale."
    ko: 간단한 이야기외다.
    ja: 事情は単純です。
  d_main_46_10_42:
    speaker: nayuta
    en: When mine replicas did roam the surface in great numbers, seeking a means
      to fell the Queen,
    ko: 퀸을 쓰러뜨릴 방법을 찾아, 수많은 소인의 분신이 지상을 떠돌고 있을 때.
    ja: |-
      クイーンを打ち倒す方法を求めて、
      私の分身が地上を探し回っていた時…
  d_main_46_10_43:
    speaker: nayuta
    en: "'twas Young Lady Mirror who first approached me."
    ko: 미러 소저 측에서 먼저 접근해 왔소.
    ja: ミラーの方から接触してきたのです。
  d_main_46_10_44:
    speaker: nayuta
    en: By means of a nearby Rapture, she did drive a corrupted thorn into me.
    ko: 인근의 랩쳐를 통해 소인에게 침식 가시를 찔러넣었지.
    ja: |-
      近くにいたラプチャーをけしかけてきて、
      侵食作用のある針を刺されました。
  d_main_46_10_45:
    speaker: snowwhite_h
    en: "... What?"
    ko: "…뭐?"
    ja: "…何？"
  d_main_46_10_46:
    speaker: nayuta
    en: Fortunately, I am possessed of some small skill in the handling of NIMPH.
    ko: 다행히 소인은 NIMPH를 다루는 것에는 조금 재주가 있소.
    ja: |-
      幸い、私はNIMPHの扱いには
      人より長けていました。
  d_main_46_10_47:
    speaker: nayuta
    en: Should the corruption be minor, I may address it by excising only the corrupted
      NIMPH.
    ko: 소량의 침식이라면, 오염된 NIMPH만을 덜어내는 것으로 대응할 수 있소.
    ja: |-
      わずかの侵食であれば、
      汚染されたNIMPHのみを切り捨てることで
      対処できます。
  d_main_46_10_48:
    speaker: nayuta
    en: The drawback is that much information is thereby lost. Yet I at least evade
      utter corruption.
    ko: "…정보를 많이 잃는다는 단점이 있소만, 완전히 오염되진 않지."
    ja: |-
      …大量の情報と引き換えになるという
      問題はありますが、
      完全な汚染は避けられますから。
  d_main_46_10_49:
    speaker: nayuta
    en: Young Lady Mirror witnessed this and did propose a deal.
    ko: 그 모습을 본 미러 소저가 소인에게 거래를 건 것이외다.
    ja: |-
      その様子を見ていたミラーに、
      取り引きを持ちかけられました。
  d_main_46_10_50:
    speaker: nayuta
    en: Having observed mine replicas that did linger nearby and the treating of my
      corruption, she divined the extraordinary nature of my ability and put forth
      her proposal.
    ko: |-
      계속해서 주위를 맴돌던 분신, 침식을 치료하는 것을 보고는
      소인의 능력이 범상치 않음을 알아보고 거래를 걸었소.
    ja: |-
      無数の分身や、侵食を治療する力を見て、
      あなどり難い存在だと
      思われたのでしょうねぇ。
  d_main_46_10_51:
    speaker: nayuta
    en: "'Twas a deal to strike down the Queen together."
    ko: 함께 퀸을 치자는 거래였지.
    ja: |-
      彼女から持ちかけられた話は、
      協力してクイーンを倒そうというものでした。
  d_main_46_10_52:
    speaker: nayuta
    en: I knew full well the sort of being Young Lady Mirror was.
    ko: 소인은 알고 있었소. 미러 소저가 어떤 존재인지.
    ja: |-
      私は知っていました。
      ミラーがどのような存在か。
  d_main_46_10_53:
    speaker: nayuta
    en: How grave a threat she doth pose to humanity. How much suffering she hath
      wrought.
    ko: |-
      인류에게 얼마나 위협적인 존재인지,
      얼마나 괴롭게 했는지 잘 알고 있었소.
    ja: |-
      人類にとっていかに危険な存在か、
      人類にどれだけの苦難をもたらしたか、
      よく理解していました。
  d_main_46_10_54:
    speaker: nayuta
    en: "... Even so, I joined hands with her."
    ko: "…그럼에도, 손을 잡았소."
    ja: "…その上で、手を組むと決めました。"
  d_main_46_10_55:
    speaker: snowwhite_h
    en: "... Why?"
    ko: "…어째서."
    ja: "…なぜだ。"
  d_main_46_10_56:
    speaker: nayuta
    en: I coveted the knowledge too greatly to forgo.
    ko: 그 정보가 너무나 탐났기 때문이외다.
    ja: |-
      彼女の持つ情報が、
      それほど貴重な物だからです。
  d_main_46_10_57:
    speaker: nayuta
    en: However many replicas I may possess, there is no means of learning the Raptures'
      inner affairs.
    ko: |-
      소인의 분신이 제아무리 많다 하더라도,
      랩쳐의 내부 사정까진 알아낼 방법이 없소.
    ja: |-
      いくら無数の分身があると言っても、
      ラプチャーの内部事情まで
      探ることなどできません。
  d_main_46_10_58:
    speaker: nayuta
    en: Thus I joined hands with her, and much was brought to light.
    ko: 그래서 손을 잡았고, 많은 것을 알아낼 수 있었소.
    ja: |-
      協力のかいあって、
      知れるはずもなかったことを
      知ることができました。
  d_main_46_10_59:
    speaker: nayuta
    en: "... 'Twould be a falsehood to claim I felt no self-reproach over that decision."
    ko: "…그 결정에 자괴감이 들지 않았다면 거짓말일 테지만."
    ja: |-
      …その選択に罪の意識がなかったかと
      問われれば、また別の話になりますねぇ。
  d_main_46_10_60:
    speaker: nayuta
    en: Even so, to secure victory, I shall stoop to any deed.
    ko: 소인은 이기기 위해선 무슨 짓이든 하외다.
    ja: |-
      いずれにせよ、私は勝つために
      手段は選ばぬ覚悟でしたから。
  d_main_46_10_61:
    speaker: nayuta
    en: Any deed whatsoever.
    ko: 무슨 짓이든.
    ja: "…それがたとえ、どんな手であろうと。"
  d_main_46_10_62:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_63:
    speaker: nayuta
    en: I had thought thou wouldst speak of the path to victory, yet thou dost refrain.
      How unexpected.
    ko: |-
      승리의 과정에 대해 얘기할 줄 알았건만, 하지 않는군.
      의외요.
    ja: |-
      …手段は選べと抗議されるかと思いましたが、
      お静かですねぇ。
  d_main_46_10_64:
    speaker: snowwhite_h
    en: And are you sure you're okay?
    ko: 너는 괜찮은 건가?
    ja: それでお前は、平気なのか？
  d_main_46_10_65:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_66:
    speaker: snowwhite_h
    en: "... Very well. I respect your decision."
    ko: "…그래. 알겠다. 네 결정을 존중한다."
    ja: "…分かった。それなら、お前の選択を尊重する。"
  d_main_46_10_67:
    speaker: nayuta
    en: Many thanks.
    ko: 고맙소.
    ja: かたじけない。
  d_main_46_10_68:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_69:
    speaker: janghwa_n
    en: We're here.
    ko: 다 왔어.
    ja: はい、到着。
  d_main_46_10_70:
    speaker: janghwa_n
    en: There's an underground tunnel from this point that'll get you out quickly.
    ko: 여기서 지하 터널을 이용하면 빠르게 벗어날 수 있어.
    ja: |-
      ここから地下トンネルを通っていけば
      脱出できるはずよ。
  d_main_46_10_71:
    speaker: janghwa_n
    en: Stay safe, and if Scarlet happens to wake up, don't mention me.
    ko: |-
      조심히들 가고,
      혹시나 련이가 깨어나도 내 얘기는 절대 하지 마.
    ja: |-
      気をつけて帰って…
      あと、もしレンの目が覚めても、
      私のことは絶対に教えないでね。
  d_main_46_10_72:
    speaker: nayuta
    en: That matter will not be resolved so swiftly, but very well.
    ko: 그렇게 빠르게 해결될 일은 아니지만… 알겠소.
    ja: |-
      当分先のことになりそうですが…
      覚えておきましょう。
  d_main_46_10_73:
    speaker: mirror_r
    en: All of you. Get moving.
    ko: 당신들. 빨리 가요.
    ja: お二人とも、一刻も早く脱出してください。
  d_main_46_10_74:
    speaker: janghwa_n
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_46_10_75:
    speaker: mirror_r
    en: Egovista has caught your sc—
    ko: 에고비스타가 냄새를 맡았-
    ja: エゴビスタに嗅ぎつけられ…
  d_main_46_10_76:
    speaker: mirror_r
    en: Damn it.
    ko: 젠장.
    ja: くっ…
  d_main_46_10_77:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_78:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_79:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_80:
    speaker: "<Narration>"
    en: "*Whooooooosh*"
    ko: 후우우우우웅--
    ja: ヒュウウウウン――
  d_main_46_10_81:
    speaker: "<Narration>"
    en: The sound of something tearing through the air echoes from the distance and
      rapidly approaches.
    ko: |-
      먼 곳에서 파공음이 들려온다.
      빠른 속도로 가까워진다.
    ja: |-
      空気を切り裂くような音とともに、
      彼方から何かが猛スピードで迫ってくる
  d_main_46_10_82:
    speaker: nayuta
    en: "... What sound be that?"
    ko: "…뭐요 이 소리는."
    ja: "…何の音でしょう？"
  d_main_46_10_83:
    speaker: janghwa_n
    en: This complicates things on so many levels. Let's evade for now.
    ko: |-
      아… 이거 여러모로 곤란하겠는데.
      일단 피해.
    ja: |-
      あーあ…面倒なことになったわね。
      とりあえず、何とか避けて。
  d_main_46_10_84:
    speaker: snowwhite_h
    en: We can't exactly run from something if we don't know what it is.
    ko: 뭔지 알아야 피하든가 할 것 아닌가.
    ja: 何か分からないと避けようがない。
  d_main_46_10_85:
    speaker: janghwa_n
    en: Just run.
    ko: 그냥 피해.
    ja: いいから、何でも。
  d_main_46_10_86:
    speaker: "<Narration>"
    en: "*Whooooooosh*"
    ko: 후우우우우웅--
    ja: ヒュウウウウ――
  d_main_46_10_87:
    speaker: "<Narration>"
    en: "*Boooom*"
    ko: 콰----앙---!!
    ja: ズガン！！
  d_main_46_10_88:
    speaker: "<Narration>"
    en: Something enormous slams down.
    ko: 거대한 뭔가가 내려쳐진다.
    ja: 巨大な何かが地面に激しく叩きつけられた
  d_main_46_10_89:
    speaker: "<Narration>"
    en: The ground splits, and nearby buildings collapse.
    ko: 바닥이 쪼개지고 인근의 건물이 무너진다.
    ja: 衝撃が辺りの建築物ごと地面を砕いた
  d_main_46_10_90:
    speaker: "<Narration>"
    en: Snow White stares at the massive wall blocking her way.
    ko: 스노우 화이트는 눈앞을 막고 있는 거대한 벽을 본다.
    ja: |-
      スノーホワイトの視界いっぱいに、
      巨大な壁が広がっていた
  d_main_46_10_91:
    speaker: "<Narration>"
    en: A towering wall, smooth and flat.
    ko: 매끈하고 평평한, 거대한 벽.
    ja: つやのある、大きな平面だ
  d_main_46_10_92:
    speaker: "<Narration>"
    en: "*Crackkk*"
    ko: 쿠지직--
    ja: ズズッ――
  d_main_46_10_93:
    speaker: "<Narration>"
    en: The wall slowly lifts, revealing its end.
    ko: 벽이 천천히 들어 올려지며 끝부분이 보인다.
    ja: |-
      壁がゆっくりと起き上がり、
      先端が見えた
  d_main_46_10_94:
    speaker: "<Narration>"
    en: It tapers gradually to a point.
    ko: 끝으로 갈수록 점점 좁아진다.
    ja: 先端に近づくほど、細く鋭くなっている
  d_main_46_10_95:
    speaker: snowwhite_h
    en: "... A sword?"
    ko: "…검?"
    ja: "…剣か？"
  d_main_46_10_96:
    speaker: nayuta
    en: A sword? A sword, you say? This?
    ko: 검? 검이라고? 이것이?
    ja: 剣？武器ですか？これが…？
  d_main_46_10_97:
    speaker: "<Narration>"
    en: The gigantic sword swings again.
    ko: 거대한 검이 다시 한번 휘둘러진다.
    ja: 巨大な刃が振り上げられるように動いた
  d_main_46_10_98:
    speaker: "<Narration>"
    en: This time, it comes down aimed directly at Snow White.
    ko: 이번엔 스노우 화이트를 정확히 노리고 내려쳐진다.
    ja: |-
      次の瞬間、刃はスノーホワイトを
      正確に狙って落ちはじめた
  d_main_46_10_99:
    speaker: snowwhite_h
    en: Ugh...!!
    ko: 크읏…!!
    ja: くっ…！！
  d_main_46_10_100:
    speaker: "<Narration>"
    en: Seven Dwarves unleashes fire.
    ko: 세븐스 드워프가 불을 뿜는다.
    ja: セブンスドワーフが火を放った
  d_main_46_10_101:
    speaker: "<Narration>"
    en: An explosion hits the descending blade, knocking it off course.
    ko: 내려쳐지던 검날에 폭발이 일어나며, 검이 튕겨 나간다.
    ja: |-
      振り下ろされた刃の根元で爆発が起こり、
      剣の軌道がそれた
  d_main_46_10_102:
    speaker: "<Narration>"
    en: Snow White quickly takes to higher ground.
    ko: 스노우 화이트는 재빨리 높은 곳으로 올라간다.
    ja: スノーホワイトは素早く高所へ動いた
  d_main_46_10_103:
    speaker: "<Narration>"
    en: Beyond the dust cloud, the vague silhouette of a giant approaches slowly.
    ko: |-
      먼지구름 너머,
      멀리서 천천히 걸어오고 있는 거신의 형태가 어렴풋이 보인다.
    ja: |-
      砂ぼこりの向こうに、
      ゆったりと歩む大きな影がのぞいた
  d_main_46_10_104:
    speaker: snowwhite_h
    en: A sword strike? From that distance...?
    ko: "…저 거리에서 검격을…?"
    ja: あの距離から斬撃を…？
  d_main_46_10_105:
    speaker: "<Narration>"
    en: Snow White stands ready with Seven Dwarves, waiting for the dust to clear.
    ko: |-
      스노우 화이트는 세븐스 드워프를 준비한 채,
      먼지구름이 걷히길 기다린다.
    ja: |-
      スノーホワイトは
      セブンスドワーフを再装填し、
      砂ぼこりが収まる時を待った
  d_main_46_10_106:
    speaker: "<Narration>"
    en: As the dust thins, the giant's silhouette appears.
    ko: 그리고 먼지 구름이 옅어지며 거신의 실루엣이 드러난다.
    ja: |-
      次第に砂ぼこりが薄れ、
      シルエットが浮かび上がる
  d_main_46_10_107:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_10_108:
    speaker: "<Narration>"
    en: A wide-brimmed hat. A single sword. Wings on her back.
    ko: |-
      넓은 챙을 가진 모자. 한 자루의 검.
      등에 달린 날개.
    ja: |-
      大きな笠、一振りの剣。
      背中に生えた翼…
  d_main_46_10_109:
    speaker: snowwhite_h
    en: "...!!"
    ko: "---!!"
    ja: "――！！"
  d_main_46_10_110:
    speaker: "<Narration>"
    en: Snow White stares vacantly at the form, an unmistakable imitation of someone.
    ko: 누군가를 흉내 낸 것이 분명한 그 모습을 스노우 화이트는 멍하니 바라본다.
    ja: |-
      間違いなく誰かを思い起こさせるような姿が
      スノーホワイトの目をくぎ付けにした
  d_main_46_10_111:
    speaker: "<Narration>"
    en: And just like Altruia,
    ko: |-
      앨트루이아라 불렸던 그 녀석도 그렇고,
      눈앞의 이 녀석도 그렇고.
    ja: |-
      アルトルイアもそうだった。
      目の前のこれもそうだ
  d_main_46_10_112:
    speaker: "<Narration>"
    en: this doppelganger before her provokes a great sense of rage in her.
    ko: 하나같이 분노를 불러일으킨다.
    ja: 怒りをかき立てる形をしている
  d_main_46_10_113:
    speaker: "<Narration>"
    en: This is sacrilege.
    ko: 이것은 모독이다.
    ja: 冒涜している
  d_main_46_10_114:
    speaker: "<Narration>"
    en: A desecration of her comrades who risked their lives in battle.
    ko: 목숨을 걸고 싸워준 동료들을 모독하는 행위다.
    ja: 命を賭して戦った自分の仲間を、侮辱している
  d_main_46_10_115:
    speaker: "<Narration>"
    en: Snow White's eyes blaze as she clenches her teeth.
    ko: 스노우 화이트는 눈을 부릅뜨고, 이를 꽉 깨문다.
    ja: スノーホワイトは目を見開き、歯を食いしばった
  d_main_46_10_116:
    speaker: "<Narration>"
    en: Without any further hesitation, she unleashes her attack.
    ko: 망설임 없이, 거신을 향해 공격을 퍼붓는다.
    ja: そして迷うことなく、攻撃を仕掛けた
  d_main_46_10_117:
    speaker: snowwhite_h
    en: I'll kill you!
    ko: 죽여주마.
    ja: 覚悟するがいい…
  d_main_46_10_118:
    speaker: snowwhite_h
    en: I'll kill every single one of you!!
    ko: 다 죽여주마--!!
    ja: 全て消してやる…！！
d_main_46_11:
  d_main_46_11_1:
    speaker: egovista
    en: Hahahahaha!
    ko: 흐하하하하!
    ja: アッハハハハ！！
  d_main_46_11_2:
    speaker: egovista
    en: Splendid! Truly splendid!
    ko: 좋아! 아주 좋아!
    ja: いいぞ！実にいい！
  d_main_46_11_3:
    speaker: egovista
    en: Never have I have fought so earnestly! Not since the day of my birth!
    ko: 이렇게 진지하게 싸워본 건 태어나서 처음이네!
    ja: これほど肌のひりつく戦いは生まれて初めてだ！
  d_main_46_11_4:
    speaker: egovista
    en: Though admittedly, I am newly born into the world Hahahaha!
    ko: 아, 물론 본인. 태어난 지 얼마 되지 않았지만! 흐하하하!
    ja: |-
      まあ、拙者は…まだ生まれたばかりだがな！
      ワハハハハ！
  d_main_46_11_5:
    speaker: snowwhite_h
    en: Stop laughing!
    ko: 웃지 마라…!
    ja: 不愉快だ…！
  d_main_46_11_6:
    speaker: nayuta
    en: Young Lady Scarlet's and Young Lady Isabel's weapons...!
    ko: 홍련 소저와 이사벨 소저의 무장을…!
    ja: 紅蓮とイサベルの武装…！
  d_main_46_11_7:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_8:
    speaker: egovista
    en: I would fain give thee applause. Alas, I only have but one arm. Most vexing.
    ko: 박수라도 쳐 주고 싶지만, 본인 팔이 하나뿐이라 그럴 수 없는 게 원통하군.
    ja: |-
      拍手でも送ってやりたいところ、
      あいにくと腕が1本しかない。
  d_main_46_11_9:
    speaker: egovista
    en: I shall clap with mine mouth instead. Thou shalt have to make do.
    ko: 입으로라도 박수를 쳐줄 테니, 그걸로 참아주게나.
    ja: |-
      代わりに口で音を出そう、
      それで堪忍してくれ。
  d_main_46_11_10:
    speaker: egovista
    en: "*Clap, clap, clap*"
    ko: 짝! 짝! 짝!
    ja: パチパチパチ！
  d_main_46_11_11:
    speaker: snowwhite_h
    en: You lunatic.
    ko: 미친놈.
    ja: 狂っているな。
  d_main_46_11_12:
    speaker: egovista
    en: I must confess, transforming doth dull the pleasure of the slice of mine blade.
    ko: 허나 역시 거대화는 베는 맛이 떨어지는군.
    ja: |-
      しかし、この姿になると
      斬れ味が落ちてしまうなぁ。
  d_main_46_11_13:
    speaker: egovista
    en: "'Tis less like a cut and more a bludgeoning."
    ko: 벤다기보단 두들겨 팬다는 감각이라 말일세.
    ja: なまくらを叩きつけている気になる。
  d_main_46_11_14:
    speaker: egovista
    en: Only in this body can I truly feel the joy of cutting something down.
    ko: 이 몸으로 베어야 진정으로 뭔가를 베었다는 손맛이 느껴지니.
    ja: |-
      この身で斬ってこそ、
      刃の手ごたえを感じられるというのに。
  d_main_46_11_15:
    speaker: egovista
    en: A poorly made thing, this body. Hahaha!
    ko: 이것 참 잘못 만들어진 몸뚱이라 할 수 있겠네. 흐하하.
    ja: この体は出来損ないだな、ワハハ…
  d_main_46_11_16:
    speaker: "<Narration>"
    en: "*Whoooosh*"
    ko: 푸슈슈슈--!!
    ja: バシュン――！！
  d_main_46_11_17:
    speaker: "<Narration>"
    en: Snow White fires a barrage of missiles.
    ko: 스노우 화이트가 미사일을 쏟아낸다.
    ja: スノーホワイトがミサイルを放った
  d_main_46_11_18:
    speaker: egovista
    en: Oh.
    ko: 오.
    ja: ほう…
  d_main_46_11_19:
    speaker: "<Narration>"
    en: Egovista's arm detaches.
    ko: 에고비스타의 팔이 분리된다.
    ja: エゴビスタの腕が分離した
  d_main_46_11_20:
    speaker: "<Narration>"
    en: The sword it's holding lashes out like a whip.
    ko: 팔 끝에 잡고 있는 검이 마치 채찍처럼 휘둘러진다.
    ja: 握られた剣がムチのようにしなる
  d_main_46_11_21:
    speaker: "<Narration>"
    en: With precise cuts, it slices through the incoming missiles before they can
      even explode.
    ko: 폭발도 일어나지 않을 정도로 다가오는 미사일을 정교하게 베어낸 후,
    ja: |-
      迫るミサイルが、
      爆発を起こさないよう精密に切り取られた
  d_main_46_11_22:
    speaker: "<Narration>"
    en: The sword then swings toward Snow White's head.
    ko: 스노우 화이트의 머리를 노리고 휘둘러진다.
    ja: |-
      そのままの勢いで、
      スノーホワイトの頭に刃が飛んだ
  d_main_46_11_23:
    speaker: "<Narration>"
    en: Snow White tilts her head slightly, evading the strike.
    ko: 스노우 화이트가 머리를 살짝 틀어 검격을 피한다.
    ja: |-
      スノーホワイトは軽く頭をひねり、
      それをかわした
  d_main_46_11_24:
    speaker: egovista
    en: My apologies, 'twas a reflex. Mine aim was merely to deflect the explosives.
    ko: 이거 실례했네. 폭탄만 적절히 덜어내려 했건만, 반사적으로 그만.
    ja: |-
      おっと失礼…
      爆弾だけを落とすつもりが、つい。
  d_main_46_11_25:
    speaker: egovista
    en: Though thou art not blameless either, attacking in the midst of conversation.
      Doth such conduct not violate the way of the sword?
    ko: |-
      허나 대화 중에 공격한 그대의 잘못도 있네.
      무사도에 어긋나는 짓이지 않은가.
    ja: |-
      だが、口上をさえぎって仕掛けてきた
      お前にも落ち度はあろうな。
      武士道に外れる行いだ。
  d_main_46_11_26:
    speaker: nayuta
    en: Spare us the falsehoods. 'Tis plain to any soul that strike was aimed with
      intent.
    ko: |-
      거짓말하지 마시오.
      누가 봐도 노리고 휘두른 것이지 않소.
    ja: |-
      信じられませんねぇ。
      どう見ても狙っていたようですが。
  d_main_46_11_27:
    speaker: egovista
    en: Nay, nay. 'Twas a mere mishap, as I said.
    ko: 아니아니. 실수라고 하지 않았나.
    ja: |-
      いやいや。
      間違いだったと言ったであろう。
  d_main_46_11_28:
    speaker: "<Narration>"
    en: Egovista vanishes,
    ko: 에고비스타의 모습이 사라진다.
    ja: エゴビスタの姿がかき消えた
  d_main_46_11_29:
    speaker: "<Narration>"
    en: then lands between Nayuta and Snow White.
    ko: 나유타와 스노우 화이트 사이에 착지한다.
    ja: |-
      一瞬のうちに、
      ナユタとスノーホワイトの間に立っている
  d_main_46_11_30:
    speaker: egovista
    en: Ambushes are not my specialty.
    ko: 기습은 본인의 전공이 아닐세.
    ja: 不意打ちは不得手なのだがな。
  d_main_46_11_31:
    speaker: "<Narration>"
    en: The sword swings wildly.
    ko: 검이 마구잡이로 휘둘러진다.
    ja: 手当たり次第の斬撃が飛んだ
  d_main_46_11_32:
    speaker: "<Narration>"
    en: Nayuta and Snow White both block and evade, but are grazed and sliced.
    ko: 방어하고 회피하지만 긁혀나가고, 베어진다.
    ja: 防御も回避も、すり抜けてくる
  d_main_46_11_33:
    speaker: nayuta
    en: Blast...!
    ko: 이… 런…!
    ja: なん…と…！
  d_main_46_11_34:
    speaker: snowwhite_h
    en: Tch...!
    ko: 치잇…!
    ja: ぐっ…！
  d_main_46_11_35:
    speaker: "<Narration>"
    en: Precisely refined close-quarters combat.
    ko: 정교하게 다듬어진 접근전.
    ja: 敵は白兵戦を極めている
  d_main_46_11_36:
    speaker: "<Narration>"
    en: Neither Snow White nor Nayuta have experience against a sword-wielding opponent.
      They couldn't have.
    ko: 스노우 화이트와 나유타는 검을 쓰는 상대에 대한 경험이 없다. 있을 수 없다.
    ja: |-
      スノーホワイトとナユタには
      剣士との戦闘経験がない。
      あるはずもなかった
  d_main_46_11_37:
    speaker: "<Narration>"
    en: Against Raptures, gun fights are the standard.
    ko: 랩쳐들을 상대할 땐 기본적으로 총기 대 총기다.
    ja: ラプチャーとの戦闘は、基本的に銃撃戦しかない
  d_main_46_11_38:
    speaker: "<Narration>"
    en: Some Raptures do engage in close combat, but their attacks are nothing more
      than straightforward physical aggression.
    ko: 접근전을 시도하는 랩쳐가 있지만 어디까지나 피지컬을 앞세운 단순한 공격일 뿐이다.
    ja: |-
      近づいてくるラプチャーがいたとしても
      あくまで力任せのごり押しだ
  d_main_46_11_39:
    speaker: "<Narration>"
    en: But Egovista plays mind games. She targets blind spots and vital points.
    ko: 하지만 에고비스타는 심리전을 걸고, 사각과 급소를 노린다.
    ja: |-
      だが、エゴビスタは相手を読み、
      死角と急所を狙ってくる
  d_main_46_11_40:
    speaker: "<Narration>"
    en: Nayuta knows self-defense, but not at a level to face a master like this.
    ko: 나유타는 호신술에 조예가 있으나, 달인을 상대로 펼칠 기량은 아니다.
    ja: |-
      ナユタにも一通り護身術の心得はあるが、
      達人と比べられるものではない
  d_main_46_11_41:
    speaker: "<Narration>"
    en: Against a master of the blade, neither can mount a single counterattack.
    ko: 둘은 검의 달인을 상대로, 아무런 반격도 하지 못한다.
    ja: |-
      圧倒的な技量の差を前に、
      2人は一方的に翻弄された
  d_main_46_11_42:
    speaker: "<Narration>"
    en: "*Clang*"
    ko: 카앙-!
    ja: キン！
  d_main_46_11_43:
    speaker: "<Narration>"
    en: Sword meets sword.
    ko: 검과 검이 맞부딪힌다.
    ja: 剣のぶつかる音がした
  d_main_46_11_44:
    speaker: "<Narration>"
    en: Rose blocks Egovista's strike.
    ko: 장화가 에고비스타의 검격을 막아낸다.
    ja: エゴビスタの剣を止めたのは薔花だった
  d_main_46_11_45:
    speaker: egovista
    en: Hmm?
    ko: "…응?"
    ja: "…んん？"
  d_main_46_11_46:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_47:
    speaker: egovista
    en: Well, well. If it isn't Mirror's puppet.
    ko: 아니. 이제 보니 미러의 꼭두각시 아닌가.
    ja: ああ、何かと思えば、ミラーの操り人形か。
  d_main_46_11_48:
    speaker: egovista
    en: What exactly dost thou think thou art doing?
    ko: 이게 뭐 하는 짓인지 물어봐도 되겠는가?
    ja: これはいったい、どういう了見だ？
  d_main_46_11_49:
    speaker: janghwa_n
    en: Who knows. Perhaps facing a sword-wielder after so long stirred my spirit.
    ko: 글쎄. 검 쓰는 상대를 오랜만에 봤더니 피가 끓어서 그런가?
    ja: |-
      さあ。剣の使い手なんて久しぶりに見たから
      血がたぎったのかもね？
  d_main_46_11_50:
    speaker: egovista
    en: Hahaha! A hollow husk with no blood to boil. What rubbish doth thou speak.
    ko: 흐하하. 끓을 피도 없는 거죽 몸뚱이 주제에 무슨 소릴 하는겐가.
    ja: |-
      ハハハ…血など流れてもいないであろう、
      たわけたことを申すな。
  d_main_46_11_51:
    speaker: janghwa_n
    en: Rich words coming from something that imitates humans.
    ko: 뭐래. 사람 흉내나 내고 있는 게.
    ja: そう？人間のマネはお互い様でしょ。
  d_main_46_11_52:
    speaker: egovista
    en: "... Hah!"
    ko: "…흐하!"
    ja: "…フハッ！"
  d_main_46_11_53:
    speaker: "<Narration>"
    en: Their blades clash.
    ko: 둘의 검격이 교환된다.
    ja: 2人の剣が交わった
  d_main_46_11_54:
    speaker: "<Narration>"
    en: From a distance, Mirror watches.
    ko: 그 모습을, 멀리서 미러가 바라보고 있다.
    ja: ミラーは遠くからその様子を観察していた
  d_main_46_11_55:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_56:
    speaker: mirror_r
    en: This is no good.
    ko: 안 되겠네.
    ja: いけませんね。
  d_main_46_11_57:
    speaker: mirror_r
    en: Ugh... They really are completely helpless.
    ko: 아… 진짜 말 그대로 쪽도 못 쓰잖아.
    ja: ここまで…一方的に圧されるなんて。
  d_main_46_11_58:
    speaker: mirror_r
    en: Even with half their forces remaining...
    ko: 아무리 전력이 반 토막이 났다지만….
    ja: いくら戦力が半減していると言っても…
  d_main_46_11_59:
    speaker: mirror_r
    en: They're struggling this much against a single newborn Heretic...
    ko: "…신생 헬레틱 하나에 저렇게 애를 먹는다라…."
    ja: |-
      …新世代のヘレティック1体に
      こんな苦戦をするようでは。
  d_main_46_11_60:
    speaker: mirror_r
    en: Altruia's retreat was likely due to that strange wall.
    ko: 앨트루이아가 퇴각한 건 그 이상한 성벽 때문인 것 같고.
    ja: |-
      アルトルイアの撤退も
      妙な要因が絡んだだけのようですし…
  d_main_46_11_61:
    speaker: mirror_r
    en: These new Raptures will just keep getting better.
    ko: 신생 랩쳐는 점점 성능이 좋아지고 있고….
    ja: |-
      新世代ラプチャーの性能は
      向上を続けていますし…
  d_main_46_11_62:
    speaker: mirror_r
    en: The Queen will secure the Dark Matter, and those half-baked things aren't
      going to pose an obstacle to her.
    ko: |-
      퀸은 다크 매터를 확보하겠지.
      그런 되다 만 것들은 아무런 방해가 되지 않아.
    ja: |-
      クイーンもすぐにダークマターを
      持ち帰って来るでしょうし…
      この程度の力では、足止めにもなりません。
  d_main_46_11_63:
    speaker: mirror_r
    en: Eden is still devastated, and the Ark shows no sign of mobilizing.
    ko: |-
      에덴은 여전히 괴멸 상태….
      방주가 움직일 기미는 없다.
    ja: |-
      エデンは壊滅したばかりですし…
      アークが動く気配もない。
  d_main_46_11_64:
    speaker: mirror_r
    en: On top of that, Marian's gene is now in the Queen's hands.
    ko: 마리안의 인자는 퀸에게 빼앗긴 상태….
    ja: それに、マリアンの因子もクイーンの手の中…
  d_main_46_11_65:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_66:
    speaker: mirror_r
    en: Hmm. I've decided.
    ko: 음. 결정했어.
    ja: やはり、止むを得ませんね。
  d_main_46_11_67:
    speaker: mirror_r
    en: It's a shame to abandon everything I've invested, but the Queen is on a whole
      other level. Perhaps her descent was the problem from the start.
    ko: |-
      오랜 시간 공들인 게 아깝지만,
      퀸이 너무 규격 외네. 아니, 내려온 것부터 문제였나.
    ja: |-
      時間をかけた計画は惜しいですが、
      規格外のクイーンを呪うしかありません。
      降下した時点で終わっていたのでしょうか。
  d_main_46_11_68:
    speaker: mirror_r
    en: There's no other choice.
    ko: 어쩔 수 없지.
    ja: 仕方ないことです。
  d_main_46_11_69:
    speaker: mirror_r
    en: This is the right call.
    ko: 이게 맞아.
    ja: 他に方法がないのですから。
  d_main_46_11_70:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_71:
    speaker: mirror_r
    en: Ugh, what a waste.
    ko: 아아~ 아깝다. 너무 아까워.
    ja: |-
      ああ…でもやはりもったいない。
      手放したくありませんね。
  d_main_46_11_72:
    speaker: mirror_r
    en: Both Marian and the Ark. Such a shame.
    ko: |-
      마리안도, 방주도.
      너무 아깝네.
    ja: |-
      マリアンも、アークも。
      未練が残ってしまいます。
  d_main_46_11_73:
    speaker: mirror_r
    en: After all that effort I've put in...
    ko: 그동안 들인 공이 얼만데….
    ja: 今までどれだけの労力をかけてきたか…
  d_main_46_11_74:
    speaker: mirror_r
    en: The Queen obtaining a new body was the deciding factor.
    ko: "…퀸이 새로운 바디를 손에 넣은 게 너무 컸어."
    ja: |-
      …クイーンが新しいボディを
      手に入れてしまったことが誤算でした。
  d_main_46_11_75:
    speaker: mirror_r
    en: Otherwise, she could've been stopped.
    ko: 그것만 아니었다면… 잡을 수 있었을 텐데.
    ja: |-
      あれさえなければ…
      今ごろ手が届いていたはず。
  d_main_46_11_76:
    speaker: mirror_r
    en: "... Right. Time is infinite."
    ko: "…그래. 시간은 무한하니까."
    ja: "…まあ、時間はいくらでもあります。"
  d_main_46_11_77:
    speaker: mirror_r
    en: I'll just have to look for the next opportunity...
    ko: 기회는… 다음에 또 노려보는 걸로.
    ja: いずれ来る…次の機会を待ちましょう。
  d_main_46_11_78:
    speaker: "<Narration>"
    en: With a quiet crackle of static, Mirror vanishes.
    ko: 지직- 하는 작은 노이즈와 함께 미러가 사라졌다.
    ja: |-
      小さなノイズの音と共に
      ミラーは姿を消した
  d_main_46_11_79:
    speaker: "<Narration>"
    en: "*Clang, clang, clang*"
    ko: 캉! 카앙-! 캉-!
    ja: カン！！キン！カン――
  d_main_46_11_80:
    speaker: "<Narration>"
    en: Rose and Egovista's blades clash in a flurry of exchanges.
    ko: 장화와 에고비스타의 검격이 복잡하게 얽힌다.
    ja: 薔花とエゴビスタの剣撃が乱れ飛ぶ
  d_main_46_11_81:
    speaker: "<Narration>"
    en: They are evenly matched, but one side begins to falter.
    ko: 팽팽하지만, 한쪽이 조금씩 밀리기 시작한다.
    ja: 互角の戦いは崩れつつあった
  d_main_46_11_82:
    speaker: "<Narration>"
    en: The difference in physical specs is overwhelming, but the difference in swordsmanship
      is overwhelming enough to cancel it out.
    ko: |-
      압도적인 신체적 스펙 차이.
      그 차이를 누를 만큼 압도적인 검술의 기량 차이.
    ja: |-
      圧倒的なボディスペックの違い。
      それを押し返す、
      剣の使い手としての実力差…
  d_main_46_11_83:
    speaker: "<Narration>"
    en: Rose drives Egovista back.
    ko: 장화는 에고비스타를 몰아붙인다.
    ja: 薔花がエゴビスタを追い詰めている
  d_main_46_11_84:
    speaker: egovista
    en: Impossible! How...?!
    ko: 아니…! 이런…!
    ja: これは…！信じられぬ…！
  d_main_46_11_85:
    speaker: janghwa_n
    en: You were going on about the way of the sword. You should know how meaningless
      ideals are when they're bereft of power.
    ko: |-
      무사도가 어쩌고저쩌고 하지 않았어?
      힘없이 외치는 사상이 얼마나 무의미한지 알지?
    ja: |-
      武士道とか言ってた？
      実力がついてなきゃ空しいだけよ？
  d_main_46_11_86:
    speaker: egovista
    en: Silence, thou empty husk!
    ko: 시끄럽다 껍데기 놈--!!
    ja: ほざくわ、抜け殻が――！！
  d_main_46_11_87:
    speaker: "<Narration>"
    en: Egovista swings her blade in desperation.
    ko: 에고비스타가 발악하듯 검을 내려친다.
    ja: エゴビスタが怒りに任せ、剣を振り下ろした
  d_main_46_11_88:
    speaker: "<Narration>"
    en: Her movements are wide and sweeping, the kind that happens when emotion overtakes
      the body.
    ko: 큰 동작. 마음에 몸을 맡겼을 때 흔히 일어나는 동작.
    ja: 激情にとらわれた、大振りの動きだ
  d_main_46_11_89:
    speaker: "<Narration>"
    en: Rose ducks and raises her blade.
    ko: 장화가 자세를 숙이고 검을 들어올린다.
    ja: 薔花は腰を落とし、剣を握りなおした
  d_main_46_11_90:
    speaker: "<Narration>"
    en: All she needs to do is lightly deflect and charge forward to pierce the core.
    ko: 가볍게 흘려보내고, 파고든 후 코어를 찌르면 된다.
    ja: |-
      軽く受け流し、身体の下へもぐり込み、
      コアを一突き、それで決まる
  d_main_46_11_91:
    speaker: janghwa_n
    en: As expected, nothing beats Scar's swordsmanship.
    ko: 역시. 검술은 우리 련이가 최고네.
    ja: やっぱり、剣術じゃレンが一番ね。
  d_main_46_11_92:
    speaker: "<Narration>"
    en: "*Clang*"
    ko: 카앙-!!
    ja: カン――！！
  d_main_46_11_93:
    speaker: "<Narration>"
    en: "*Craaaack*"
    ko: 콰드드드득--!!
    ja: バキッ！！
  d_main_46_11_94:
    speaker: "<Narration>"
    en: Egovista's blade drives deep into Rose's upper body.
    ko: 에고비스타의 검이 장화의 상반신을 깊게 파고든다.
    ja: |-
      エゴビスタの剣が
      薔花の上半身に深々と刺さっていた
  d_main_46_11_95:
    speaker: "<Narration>"
    en: Rose collapses.
    ko: 장화가 쓰러진다.
    ja: 薔花が倒れた
  d_main_46_11_96:
    speaker: janghwa_n
    en: Ah...
    ko: 아….
    ja: あ…
  d_main_46_11_97:
    speaker: egovista
    en: "... A pity.."
    ko: "…안타깝군."
    ja: "…惜しかったな。"
  d_main_46_11_98:
    speaker: egovista
    en: The sword was too worn. Too frail to endure mine strikes.
    ko: |-
      검이 너무 낡았네.
      본인의 검격을 받아내지 못 할 정도로 말일세.
    ja: |-
      剣が古すぎたか。
      受けきれずにへし折れてしまうとは。
  d_main_46_11_99:
    speaker: egovista
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_100:
    speaker: egovista
    en: That it should end thus... I find it nothing short of regrettable.
    ko: 이렇게 승부가 나다니 본인도 안타까울 따름일세.
    ja: |-
      こんな決着のつけようでは、
      拙者の腑にも落ちぬ。
  d_main_46_11_101:
    speaker: "<Narration>"
    en: Snow White levels her gun at the stunned Egovista.
    ko: 스노우 화이트는 멍하니 서 있는 에고비스타를 향해 총구를 겨눈다.
    ja: |-
      呆然と立つエゴビスタに
      スノーホワイトが銃口を向けた
  d_main_46_11_102:
    speaker: "<Narration>"
    en: She glances toward Nayuta to call for backup,
    ko: 나유타에게 백업을 요구하기 위해 옆으로 시선을 돌리는 순간.
    ja: |-
      ナユタの支援に頼るため、
      横に視線を向けると…
  d_main_46_11_103:
    speaker: "<Narration>"
    en: but sees her staring into the distance, her face frozen in horror.
    ko: 경악에 빠져있는 표정을 한 채, 먼 곳을 바라보는 나유타의 얼굴을 본다.
    ja: ナユタは放心した顔で遠くを見つめていた
  d_main_46_11_104:
    speaker: nayuta
    en: We are undone...
    ko: 낭패….
    ja: なんたる…
  d_main_46_11_105:
    speaker: nayuta
    en: Just as I feared...
    ko: 역시….
    ja: なんたること…
  d_main_46_11_106:
    speaker: nayuta
    en: We ought not have joined hands with an outsider.
    ko: 외도와 손을 잡는 것이 아니었소.
    ja: やはり外道と手を組むべきではなかった…
  d_main_46_11_107:
    speaker: "<Narration>"
    en: Snow White follows Nayuta's gaze.
    ko: 스노우 화이트의 시선이 나유타의 시선을 따라간다.
    ja: スノーホワイトはナユタの視線の先を追った
  d_main_46_11_108:
    speaker: "<Narration>"
    en: Dozens of glowing red orbs of light hurtle toward Nayuta.
    ko: 그곳에는, 붉게 빛나는 수십 개의 빛 덩어리가 나유타를 향해 날아오고 있었다.
    ja: |-
      数十の赤い光の塊が
      こちらをめがけて飛来している
  d_main_46_11_109:
    speaker: nayuta
    en: Mantra!
    ko: 만트라!!
    ja: マントラ！！
  d_main_46_11_110:
    speaker: "<Narration>"
    en: A thunderous roar echoes in the distance, sending vibrations rippling through
      the air.
    ko: 먼 곳에서 굉음이 울려 퍼지며 진동이 울려 퍼진다.
    ja: 彼方で轟音が鳴り、地響きが起こった
  d_main_46_11_111:
    speaker: "<Narration>"
    en: The sound slowly draw closer.
    ko: 소리가 점점 가까워진다.
    ja: 音が少しずつ接近する
  d_main_46_11_112:
    speaker: snowwhite_h
    en: Nayuta, what's happening?!
    ko: 나유타! 무슨 일…!
    ja: ナユタ！どういうことだ…！？
  d_main_46_11_113:
    speaker: nayuta
    en: Mount Mantra and make haste! Retreat, I say!
    ko: 만트라를 타고 어서 가시오! 퇴각하란 말이외다!
    ja: |-
      マントラに乗って逃げてください！
      一刻も早く！
  d_main_46_11_114:
    speaker: snowwhite_h
    en: Nayuta!
    ko: 나유타!
    ja: ナユタ！
  d_main_46_11_115:
    speaker: nayuta
    en: When my replicas perish, their NIMPH returns unto me!
    ko: 소인의 분신이 죽으면 NIMPH가 소인에게 되돌아오오!
    ja: |-
      私の分身が死ねば、
      NIMPHは私のもとへ戻ります！
  d_main_46_11_116:
    speaker: nayuta
    en: The scores of replicas whose whereabouts were lost here have felled!
    ko: 이곳에서 행방이 끊어진 수십의 분신이 방금 모두 죽었소!
    ja: |-
      行方の途絶えていた分身が全て、
      たったいま始末されました！
  d_main_46_11_117:
    speaker: nayuta
    en: They met their end whilst afflicted with corruption!
    ko: 침식에 걸린 채 죽었단 말이외다!
    ja: 侵食された状態で…！
  d_main_46_11_118:
    speaker: snowwhite_h
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_46_11_119:
    speaker: snowwhite_h
    en: Then those lights...
    ko: 그럼 저 빛은…!
    ja: なら、あの光は…！
  d_main_46_11_120:
    speaker: nayuta
    en: Corruption of NIMPH! That light yonder!
    ko: |-
      침식은 NIMPH를 오염시키는 것!
      지금 저 빛은!
    ja: |-
      侵食とはNIMPHの汚染！
      あの光は…！
  d_main_46_11_121:
    speaker: nayuta
    en: Mine own NIMPH, now corrupted! It comes for me! There is no evading it!
    ko: |-
      침식에 걸린 소인의 NIMPH요!
      소인에게 오고 있소! 저건 피할 수 없소!
    ja: |-
      あの光は汚染された私のNIMPHです！
      避けることはできません…！
  d_main_46_11_122:
    speaker: snowwhite_h
    en: Then you...!
    ko: 그럼 너는…!
    ja: それではお前が…！
  d_main_46_11_123:
    speaker: nayuta
    en: Go at once! No more words!
    ko: 어서 가시오! 긴말 말고!
    ja: 構わず！早く行ってください！
  d_main_46_11_124:
    speaker: snowwhite_h
    en: Grrgh!
    ko: 크읏…!
    ja: くっ…！
  d_main_46_11_125:
    speaker: "<Narration>"
    en: Mantra crashes through the wall.
    ko: 벽을 뚫고 만트라가 도착한다.
    ja: 壁を突き破り、マントラが降り立った
  d_main_46_11_126:
    speaker: "<Narration>"
    en: Snow White hesitates. She locks eyes with Nayuta.
    ko: 스노우 화이트가 망설인다. 나유타와 눈이 마주친다.
    ja: |-
      ためらうスノーホワイトと、
      ナユタの目が合った
  d_main_46_11_127:
    speaker: nayuta
    en: Fret not, I beseech thee. There is no shortage of what may replace me.
    ko: |-
      걱정 마시오.
      소인을 대체할 건 얼마든지 있소.
    ja: |-
      ご心配なく。
      奥の手はいくつもあります。
  d_main_46_11_128:
    speaker: snowwhite_h
    en: "... Understood!"
    ko: |-
      …!!
      알겠다…!
    ja: |-
      …！！
      分かった…！
  d_main_46_11_129:
    speaker: "<Narration>"
    en: Snow White mounts Mantra.
    ko: 스노우 화이트가 만트라에 올라탄다.
    ja: スノーホワイトがマントラに飛び乗った
  d_main_46_11_130:
    speaker: "<Narration>"
    en: The beast gallops off.
    ko: 만트라가 달린다.
    ja: マントラが駆けだした
  d_main_46_11_131:
    speaker: "<Narration>"
    en: Snow White's gaze turns to the fallen Rose.
    ko: 스노우 화이트의 시선이 쓰러진 장화를 향한다.
    ja: |-
      スノーホワイトの視線が、
      倒れたままの薔花に向けられた
  d_main_46_11_132:
    speaker: "<Narration>"
    en: Egovista stares at the ground as if dejected.
    ko: 에고비스타는 허탈한 듯 바닥만 보고 있다.
    ja: |-
      エゴビスタは呆然とした様子で、
      地面を見ている
  d_main_46_11_133:
    speaker: "<Narration>"
    en: While Mantra gallops on, Snow White bends down and lifts the battered Rose.
    ko: 만트라가 달리는 중, 스노우 화이트가 허리를 숙여 만신창이가 된 장화를 들어 올린다.
    ja: |-
      スノーホワイトは腰を下ろし、
      ぼろぼろの薔花を抱え上げ、
      疾走するマントラに乗せた
  d_main_46_11_134:
    speaker: "<Narration>"
    en: With Snow White and Rose aboard, Mantra leaves the area in an instant.
    ko: 스노우 화이트와 장화를 실은 만트라는 순식간에 해당 지역을 벗어났다.
    ja: |-
      スノーホワイトと薔花を乗せたマントラは、
      たちまちその場から見えなくなった
  d_main_46_11_135:
    speaker: "<Narration>"
    en: Nayuta watches the ominous red lights converging on her.
    ko: 나유타는 자신을 향해 오고 있는 불길한 붉은 빛들을 본다.
    ja: |-
      ナユタは、自分に向かい来る
      不吉な赤い光をにらんだ
  d_main_46_11_136:
    speaker: nayuta
    en: Mirror...!
    ko: 미러…!
    ja: ミラー…！
  d_main_46_11_137:
    speaker: nayuta
    en: Things shall not unfold according to thy will...!
    ko: 그대의 뜻대로 되진 않을 것이오…!
    ja: あなたの思い通りにはさせません…！
  d_main_46_11_138:
    speaker: "<Narration>"
    en: Nayuta presses her palms together. Light bursts from her body.
    ko: |-
      나유타가 합장한다.
      몸에서 빛이 뿜어져 나온다.
    ja: |-
      ナユタが手を合わせると、
      体から光があふれ出した
  d_main_46_11_139:
    speaker: nayuta
    en: Though mine original self be forfeit here, there is no want of replicas to
      succeed me—
    ko: |-
      비록 본체는 이곳에서 잃겠으나,
      뒤를 이어줄 분신은 얼마든지 있-
    ja: |-
      たとえこの身をここで失うとしても、
      後を継ぐ分身はいくらでも…
  d_main_46_11_140:
    speaker: "<Narration>"
    en: "*Thwack*"
    ko: 퍼억-!
    ja: ドゴッ！
  d_main_46_11_141:
    speaker: "<Narration>"
    en: Egovista's blade smashes into Nayuta's face, sending her tumbling across the
      ground.
    ko: |-
      에고비스타의 검이 나유타의 얼굴을 후려친다.
      나유타가 바닥을 구른다.
    ja: |-
      エゴビスタの剣がナユタの顔面に直撃し、
      ナユタが転がった
  d_main_46_11_142:
    speaker: "<Narration>"
    en: Nayuta's vision swims as she is struck by the flat of the sword.
    ko: 검의 옆면으로 휘둘러진 공격. 나유타는 정신이 아찔해짐을 느낀다.
    ja: |-
      剣の側面をぶつけられた。
      ナユタの意識が遠のいていく
  d_main_46_11_143:
    speaker: nayuta
    en: Ugh...!
    ko: 허억…!
    ja: がっ…！
  d_main_46_11_144:
    speaker: mirror_r
    en: Self-destruction? How terribly boring.
    ko: 자폭이라니 재미없는 짓 하지 말아요.
    ja: 自爆なんて、面白くありませんね。
  d_main_46_11_145:
    speaker: nayuta
    en: Mi... Mirror...!
    ko: 미… 러어어--!!
    ja: ミ…ラー…！！
  d_main_46_11_146:
    speaker: mirror_r
    en: I've had my eye on you for quite some time.
    ko: 예전부터 저는 당신이 탐났어요.
    ja: |-
      ずっと昔から、
      あなたのことが欲しかったんです。
  d_main_46_11_147:
    speaker: mirror_r
    en: There's no better material for a puppet than you. I've always coveted you
      for that.
    ko: 꼭두각시가 된다면 이만한 소재도 없다고, 항상 탐냈죠.
    ja: |-
      操り人形として、
      あなた以上の素材なんてありませんから。
  d_main_46_11_148:
    speaker: mirror_r
    en: Ah, I should mention. About your clones...
    ko: 아, 미리 말해놓는데 당신의 분신들.
    ja: ついでに、教えておきますね。
  d_main_46_11_149:
    speaker: mirror_r
    en: I've already taken care of them. In case things came to this.
    ko: 일찌감치 제가 잡아놨어요. 혹시나 이런 일이 있을까 봐.
    ja: |-
      分身を捕まえていたのは私です。
      こんなことになるんじゃないかと
      思っていました。
  d_main_46_11_150:
    speaker: mirror_r
    en: Injecting corruption directly into your body would be pointless. You would
      only cure yourself.
    ko: |-
      당신의 몸에 직접 침식을 주입해 봤자,
      치료해 버릴 테니까.
    ja: |-
      直接侵食を注入しても、
      治療できるのは知っていましたから。
  d_main_46_11_151:
    speaker: mirror_r
    en: But even you cannot withstand this much corruption being planted in your NIMPH.
    ko: |-
      하지만 이만큼의 침식을 심어놓은 NIMPH에요.
      당신도 이건 못 이겨내겠죠?
    ja: |-
      ですが、あれはたっぷりと
      侵食させてあります。
      さすがのあなたでも耐えられないでしょう？
  d_main_46_11_152:
    speaker: nayuta
    en: Traitorous... scum...!
    ko: 외도… 놈…!
    ja: 外道…め…！
  d_main_46_11_153:
    speaker: mirror_r
    en: Don't look at me like that. I believed in you and cooperated with you in good
      faith.
    ko: |-
      너무 그렇게 보지 말아요.
      저는 진심으로 당신들한테 협력했어요. 믿었고.
    ja: |-
      そんな目で見ないでください。
      私は本気であなたたちを信じて
      協力していたのですから。
  d_main_46_11_154:
    speaker: mirror_r
    en: But I'm simply too disappointed. Please know that my feelings were genuine
      before.
    ko: |-
      너무 실망해서 그렇지,
      그때의 마음만은 진심이었다는 걸 알아줘요.
    ja: |-
      こうなったのは、あなたたちに
      失望させられたからです。
      あの時の気持ちは本物でした。
  d_main_46_11_155:
    speaker: nayuta
    en: Vile wretch...! I swear I shall...!
    ko: 네놈은…! 반드시…!
    ja: 貴様…！絶対に…！
  d_main_46_11_156:
    speaker: mirror_r
    en: Sorry. But you should know...
    ko: |-
      미안해요.
      그런데.
    ja: |-
      本当に残念です。
      ですが…
  d_main_46_11_157:
    speaker: mirror_r
    en: I'll do whatever it takes to win too.
    ko: 저도 이기기 위해선 무슨 짓이든 하거든요.
    ja: 私も、勝つためなら手段は選ばないので。
  d_main_46_11_158:
    speaker: "<Narration>"
    en: The red lights enter Nayuta's body.
    ko: 붉은빛들이 나유타의 몸 안으로 들어간다.
    ja: 赤い光がナユタの身体に取り込まれた
  d_main_46_11_159:
    speaker: "<Narration>"
    en: She struggles,
    ko: 나유타가 발버둥 친다.
    ja: ナユタはもだえ、身をよじらせた
  d_main_46_11_160:
    speaker: "<Narration>"
    en: but goes still after a moment.
    ko: 그리고 잠시 후, 발버둥이 멎는다.
    ja: しばらく経って、動きが止まった
  d_main_46_11_161:
    speaker: "<Narration>"
    en: A short time passes.
    ko: 잠깐의 시간이 지난 후.
    ja: 再び起き上がった時…
  d_main_46_11_162:
    speaker: "<Narration>"
    en: The red-eyed monk rises to her feet.
    ko: 붉은 눈의 승려가 몸을 일으킨다.
    ja: その眼には紅い光が宿っていた
  d_main_46_11_163:
    speaker: mirror_r
    en: How do you feel?
    ko: 기분이 어때요?
    ja: 気分はどうですか？
  d_main_46_11_164:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_11_165:
    speaker: mirror_r
    en: Hmm... this is exactly why corrupted puppets are so boring.
    ko: 음… 역시 침식을 심은 꼭두각시는 이래서 재미없다니까요.
    ja: |-
      やはり…浸食を使うと操り人形としては
      面白くなりませんね。
  d_main_46_11_166:
    speaker: mirror_r
    en: Oh well. I'll just have to make do with your performance.
    ko: 그래도 뭐. 성능으로 만족해야겠네요.
    ja: まあ、性能だけで満足しておきましょう。
  d_main_46_11_167:
    speaker: mirror_r
    en: Now then, could you call all your clones here?
    ko: 일단, 당신의 분신들을 모두 이곳으로 불러주시겠어요?
    ja: |-
      とりあえず、あなたの分身をすべて
      ここに呼び寄せてもらえますか？
  d_main_46_11_168:
    speaker: mirror_r
    en: There's something I've been wanting to try for some time.
    ko: 예전부터 해보고 싶었던 일이 있거든요.
    ja: 前からやってみたかったことがあるんです。
  d_main_46_11_169:
    speaker: "<Narration>"
    en: The red-eyed monk sits cross-legged and closes her eyes.
    ko: 붉은 눈의 승려가 정좌를 틀고 눈을 감는다.
    ja: 紅い瞳の仙人は正座し、目を閉じた
  d_main_46_11_170:
    speaker: "<Narration>"
    en: Light rises upward.
    ko: 빛이 솟아오른다.
    ja: 光があふれ出した
  d_main_46_11_171:
    speaker: "<Narration>"
    en: Watching that light, Mirror smiles.
    ko: 그 빛을 보며, 미러는 미소 지었다.
    ja: その光を眺めて、ミラーは微笑を浮かべた
d_main_46_af_01:
  d_main_46_af_01_1:
    speaker: "<Narration>"
    en: A few days later in Eden...
    ko: 며칠 후. 에덴.
    ja: 数日後、エデン
  d_main_46_af_01_2:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_3:
    speaker: "<Narration>"
    en: Johan's mind is unsettled.
    ko: 요한은 마음이 복잡하다.
    ja: ヨハンの心中は穏やかではない
  d_main_46_af_01_4:
    speaker: "<Narration>"
    en: Since the battle with the Queen, there has not been a single day his heart
      has been at peace.
    ko: 퀸과의 전투 이후 단 한 번도 마음이 편한 날이 없었다.
    ja: |-
      クイーンとの戦闘以来、
      落ち着いていられた時は一度もない
  d_main_46_af_01_5:
    speaker: "<Narration>"
    en: That painful defeat weighs heavily on him.
    ko: 뼈아픈 패배는 요한의 마음에 깊게 자리 잡았다.
    ja: |-
      痛烈な敗北感が、
      ヨハンの心の奥に根付いていた
  d_main_46_af_01_6:
    speaker: "<Narration>"
    en: What happened afterward only made things more complicated.
    ko: 그 이후에 일어난 일은, 요한의 마음을 더 복잡하게 만들기에 충분했다.
    ja: |-
      追い討ちをかけるような報告が、
      ヨハンの心をさらに荒らした
  d_main_46_af_01_7:
    speaker: "<Narration>"
    en: The corruption of Nayuta's true body.
    ko: 나유타 본체의 침식.
    ja: ナユタの本体が侵食された
  d_main_46_af_01_8:
    speaker: johan
    en: "... This is devastating."
    ko: "…치명적이군."
    ja: "…致命的だな。"
  d_main_46_af_01_9:
    speaker: snowwhite_h
    en: It'll be fine. Knowing her, she'll come out of this like it's nothing.
    ko: 괜찮다. 녀석이라면 또 아무렇지도 않게 상황을 타파할 거다.
    ja: |-
      大丈夫だ。
      あいつなら、平気な顔で何とかできる。
  d_main_46_af_01_10:
    speaker: snowwhite_h
    en: Then right on cue, she'll waltz in looking smug as ever.
    ko: 그리고 예상했던 대로라며, 갑자기 나타나서는 뻔뻔하게 우쭐대겠지.
    ja: |-
      思った通りだったとでも言いながら、
      急に得意面を見せに来るはずだ。
  d_main_46_af_01_11:
    speaker: papillon
    en: But you said she was corrupted...
    ko: 침식에 걸렸다며.
    ja: 侵食されたんでしょ。
  d_main_46_af_01_12:
    speaker: snowwhite_h
    en: Even that won't be a problem.
    ko: 그것까지 포함해서 괜찮다.
    ja: それも含めて、どうにかするだろう。
  d_main_46_af_01_13:
    speaker: snowwhite_h
    en: I believe in Nayuta.
    ko: 난 나유타를 믿는다.
    ja: 私はナユタを信じる。
  d_main_46_af_01_14:
    speaker: papillon
    en: I can't tell if that's trust or just blind optimism.
    ko: 믿는 건지 낙천적인 건지 원.
    ja: 信じるっていうか、楽観的っていうか…
  d_main_46_af_01_15:
    speaker: snowwhite_h
    en: She may not have always told us everything.
    ko: 그 녀석은 언제나 우리에게 모든 걸 말해주지 않았지만.
    ja: |-
      あいつはいつも誰かに
      全てを話したりはしない奴だ。
  d_main_46_af_01_16:
    speaker: snowwhite_h
    en: But she's always been thinking several steps ahead, and we've benefited from
      that numerous times.
    ko: |-
      언제나 뒤를 생각하고 있었다.
      그 덕도 많이 봤었다.
    ja: |-
      常に後のことまで考えている。
      それに何度も助けられてきた。
  d_main_46_af_01_17:
    speaker: snowwhite_h
    en: So things will be all right. I trust her.
    ko: 그러니 괜찮다. 믿는다.
    ja: だから、大丈夫だ。信じている。
  d_main_46_af_01_18:
    speaker: johan
    en: "... Fine."
    ko: "…좋다."
    ja: "…そうだな。"
  d_main_46_af_01_19:
    speaker: johan
    en: Then I'll trust the monk too.
    ko: 나도 승려를 믿겠다.
    ja: 私も信じよう。
  d_main_46_af_01_20:
    speaker: johan
    en: Come to think of it, there's no way someone as conniving as her would be struck
      down like a dog.
    ko: 생각해 보니, 그 음흉한 녀석이 그렇게 무력하게 당하기만 할 리가 없다.
    ja: |-
      考えてみるほど、あの陰険根暗が
      そう簡単にやられるはずはない。
  d_main_46_af_01_21:
    speaker: johan
    en: She must have something up her sleeve.
    ko: 뭔가 비장의 수가 있을 거라 믿겠다.
    ja: まだ何か隠しているのだろう。
  d_main_46_af_01_22:
    speaker: "<Narration>"
    en: The Rapture strategist called Mirror.
    ko: 미러라 불리는 랩쳐의 참모.
    ja: |-
      さらに、ミラーと呼ばれる
      ラプチャーの参謀の存在
  d_main_46_af_01_23:
    speaker: "<Narration>"
    en: The newborn Raptures the Queen is said to be creating.
    ko: 퀸이 만들고 있다는 신생 랩쳐.
    ja: |-
      クイーンが新世代のラプチャーを
      生み出し始めたこと
  d_main_46_af_01_24:
    speaker: "<Narration>"
    en: New Heretics like Altruia and Egovista. There may even be more. There probably
      are.
    ko: |-
      앨트루이아, 에고비스타라는 새로운 헬레틱.
      더 있을지도 모른다. 아마 있을 것이다.
    ja: |-
      新たな敵、アルトルイアとエゴビスタ。
      そして確実に存在する、
      まだ見ぬヘレティック
  d_main_46_af_01_25:
    speaker: "<Narration>"
    en: Liberalio, who arrived in Eden with only her head remaining.
    ko: 머리만 남은 채 에덴으로 온 리버렐리오.
    ja: そして運び込まれた、リバーレリオの頭
  d_main_46_af_01_26:
    speaker: "<Narration>"
    en: Rose, severely damaged, now unresponsive, with only her brainwaves still active.
    ko: 대파되어 현재는 아무런 반응이 없이, 뇌파만 살아있는 장화.
    ja: |-
      脳波だけはかろうじて反応がある
      ボロボロの薔花
  d_main_46_af_01_27:
    speaker: "<Narration>"
    en: An unidentified weapon dubbed Red Shoes.
    ko: 레드 슈즈라 이름 붙여진 정체불명의 무장.
    ja: レッドシューズと呼ばれた未知の武器
  d_main_46_af_01_28:
    speaker: "<Narration>"
    en: So many new and unfamiliar things keep converging in Eden.
    ko: 새로운 것, 낯선 것이 에덴으로 계속 모여든다.
    ja: |-
      新たなもの、見知らぬ存在が
      続々とエデンに流れ込んでくる
  d_main_46_af_01_29:
    speaker: "<Narration>"
    en: Johan is conservative by nature.
    ko: 요한은 보수적이다.
    ja: ヨハンは保守的な性格だ
  d_main_46_af_01_30:
    speaker: "<Narration>"
    en: He is not accustomed to accepting things he doesn't have a full grasp on.
    ko: 제대로 파악되지 않은 새로운 것을 받아들이는 것에 익숙하지 않다.
    ja: |-
      よく分かっていない、新しいものを
      受け入れることをこころよく思わない
  d_main_46_af_01_31:
    speaker: "<Narration>"
    en: His years spent on the surface have only pushed that tendency to an even greater
      extreme.
    ko: 오랜 지상 생활이 요한의 그런 성격을 더욱 극단적으로 만들었다.
    ja: |-
      長い地上生活によって、
      その傾向はますます尖っていた
  d_main_46_af_01_32:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_33:
    speaker: "<Narration>"
    en: "*Squelch*"
    ko: 철퍽.
    ja: ベシャッ…
  d_main_46_af_01_34:
    speaker: "<Narration>"
    en: Johan steps on something.
    ko: 요한이 뭔가를 밟는다.
    ja: 足下の何かを踏みつけた
  d_main_46_af_01_35:
    speaker: "<Narration>"
    en: He frowns and slowly lifts his foot.
    ko: 미간을 찌푸리는 요한. 발을 천천히 들어 올린다.
    ja: 顔をしかめ、ゆっくりと足をどける
  d_main_46_af_01_36:
    speaker: "<Narration>"
    en: A sticky black liquid stretches between his boot and the floor.
    ko: 끈적한 검은 액체가, 군화와 바닥을 잇는다.
    ja: |-
      ねばり気のある黒い液体が
      靴の底と床にべったりと貼りついていた
  d_main_46_af_01_37:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_38:
    speaker: "<Narration>"
    en: Johan's head hurts.
    ko: 요한은 머리가 아프다.
    ja: ヨハンは顔をしかめた
  d_main_46_af_01_39:
    speaker: "<Narration>"
    en: He is afraid to open the door before him,
    ko: 눈앞의 문을 열기가 두렵다.
    ja: |-
      もはや、目の前のドアさえ
      安心して開けられない
  d_main_46_af_01_40:
    speaker: "<Narration>"
    en: but he can longer ignore the noise coming from outside.
    ko: 하지만 문밖에서 들려오는 소리를 무시할 수 없다.
    ja: |-
      だが、向こう側から聞こえる声を
      無視するわけにもいかない
  d_main_46_af_01_41:
    speaker: "<Narration>"
    en: After taking a short breath, Johan opens the door.
    ko: |-
      요한은 짧은 심호흡을 한번 한 뒤,
      문을 열었다.
    ja: |-
      ヨハンは小さく深呼吸をした後、
      ドアを開いた
  d_main_46_af_01_42:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_main_46_af_01_43:
    speaker: leviathan
    en: Hey! I told you not to eat every single thing you find!
    ko: 야--!! 너 내가 아무거나 주워 먹지 말랬지--!!
    ja: |-
      ちょっと！！何でもかんでも
      拾い食いしちゃダメって言ったでしょ！？
  d_main_46_af_01_44:
    speaker: onlyone_c
    en: Sis gave me.
    ko: 언니가 줬어.
    ja: お姉ちゃんにもらった。
  d_main_46_af_01_45:
    speaker: leviathan
    en: Who?! Was it Ziz?
    ko: 언니 누구! 지즈가 줬어?
    ja: お姉ちゃんってどの！？ジズ！？
  d_main_46_af_01_46:
    speaker: ziz
    en: Huh? N-no, it wasn't me...
    ko: 어? 으, 응? 나 아닌데에….
    ja: えっ？わ、私じゃないよ…
  d_main_46_af_01_47:
    speaker: leviathan
    en: Then who was it?!
    ko: 그럼 누구야!
    ja: じゃあ誰！？
  d_main_46_af_01_48:
    speaker: papillon
    en: Oh, sorry. I gave it to her. Was I not supposed to?
    ko: 아… 미안. 내가 줬는데. 주면 안 되는 거였어?
    ja: |-
      あ…ごめんなさい。私があげたの。
      ダメだったかしら？
  d_main_46_af_01_49:
    speaker: leviathan
    en: She refuses to eat her meals because she keeps snacking all the time.
    ko: 자꾸 간식만 집어 먹으니까 얘가 밥을 안 먹잖아!
    ja: |-
      そうやっておやつばっかり食べさせたら、
      ご飯を食べられなくなるの！
  d_main_46_af_01_50:
    speaker: papillon
    en: Come on, kids should be able to eat what they want.
    ko: 아니 애들이 먹고 싶은 걸 먹고 지내야지.
    ja: |-
      でも、食べたいものを
      食べさせてあげたいじゃない？
  d_main_46_af_01_51:
    speaker: leviathan
    en: You can't go through life just doing whatever you want! Sometimes you have
      to do things you don't want to do!
    ko: |-
      어떻게 하고 싶은 것만 하고 살아?
      하기 싫어도 해야지!
    ja: |-
      やりたいことだけやってれば
      生きていけるってわけじゃないでしょ？
      ガマンも覚えさせないと！
  d_main_46_af_01_52:
    speaker: papillon
    en: Wow, you're being all philosophical all of a sudden.
    ko: 어머. 갑자기 삶의 진리 같은 걸 얘기하고 있네.
    ja: あら、急に話が大きくなったわね。
  d_main_46_af_01_53:
    speaker: snowwhite_h
    en: Hmm... this is certainly heavy.
    ko: 음… 이건 확실히 무겁다.
    ja: おお…確かに重いな。
  d_main_46_af_01_54:
    speaker: behemoth
    en: See? It's too heavy for you to lift, isn't it?
    ko: 그렇지? 못 들겠지?
    ja: だろ？持ち上がらないよな？
  d_main_46_af_01_55:
    speaker: snowwhite_h
    en: I said it was heavy. I didn't say I couldn't lift it.
    ko: "…무겁다고 얘기했지, 못 든다고 하진 않았다."
    ja: |-
      …重いとは言ったが、
      持てないとは言っていない。
  d_main_46_af_01_56:
    speaker: snowwhite_h
    en: Hngh...!
    ko: 흐읍…!
    ja: ふん…！
  d_main_46_af_01_57:
    speaker: behemoth
    en: Wow! A pseudohuman like you could lift my pincers?
    ko: "…우와. 집게를 들었어? 유사 인간이?"
    ja: |-
      …うお…アームを持ち上げやがったぞ？
      人間もどきのくせに？
  d_main_46_af_01_58:
    speaker: snowwhite_h
    en: It's no big deal. It's your turn.
    ko: 이 정도다. 너도 들어봐라.
    ja: これと同じぐらいか。お前が持ってみろ。
  d_main_46_af_01_59:
    speaker: behemoth
    en: You want me to lift your weapon? I could do that with one hand.
    ko: 네 무기 말이지? 까짓거 한 손으로 든다 내가.
    ja: |-
      お前の武器か？
      そんなもん、あたしなら片手で持てるだろ。
  d_main_46_af_01_60:
    speaker: behemoth
    en: Hngh...!
    ko: 흐읍…!
    ja: ふんっ…！
  d_main_46_af_01_61:
    speaker: behemoth
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_62:
    speaker: behemoth
    en: What the... How do you carry all of this around?
    ko: 어, 뭐야. 너 이거 어떻게 들고 다니는거야.
    ja: |-
      ま、待ってくれ。
      こんなモンどうやって持ち歩いてんだ？
  d_main_46_af_01_63:
    speaker: snowwhite_h
    en: With my strength, of course.
    ko: 물론, 힘으로 들고 다닌다.
    ja: 当然、力だ。
  d_main_46_af_01_64:
    speaker: cecil
    en: The sub-arm distributes the weight. There's no way you could lift it with
      strength alone.
    ko: |-
      서브 암이 무게를 분산시켜 주고 있어요.
      힘만으로는 절대 못 들죠.
    ja: |-
      サブアームに重量を分散しています。
      腕力で持てるものではありません。
  d_main_46_af_01_65:
    speaker: behemoth
    en: Huh. You little liar.
    ko: 뭐야. 거짓말쟁이네?
    ja: なんだ、からかわれてたのか？
  d_main_46_af_01_66:
    speaker: snowwhite_h
    en: Even if the weight is distributed, I'm still lifting it with my own strength.
    ko: 무게를 분산시켰어도, 드는 건 내 힘으로 드는 거다.
    ja: |-
      分散させていようと、
      自分の力で持っていることは変わりない。
  d_main_46_af_01_67:
    speaker: bahamut
    en: A valid point. The total weight doesn't change simply because it's distributed.
    ko: 맞는 말이다. 분산된 무게의 총량은 변하지 않지.
    ja: それはそうだな。総重量は変わっていない。
  d_main_46_af_01_68:
    speaker: bahamut
    en: Allow me, the ever astute Bahamut, to enlighten you. It's called the law of
      the totality of mass.
    ko: |-
      똑똑한 바하무트가 알려주겠다.
      무게 총량의 법칙이라는 거다.
    ja: |-
      賢いバハムートが教えてやろう。
      それを総量の法則という。
  d_main_46_af_01_69:
    speaker: cecil
    en: There's no such law.
    ko: 그런 법칙은 없어요.
    ja: 聞いたこともありませんね。
  d_main_46_af_01_70:
    speaker: bahamut
    en: I was mistaken. Was it the law of weight conservation?
    ko: 착각했다. 무게 보존의 법칙이던가?
    ja: |-
      おっと、勘違いしていた。
      重量保存の法則だったか？
  d_main_46_af_01_71:
    speaker: cecil
    en: That's not a thing either.
    ko: 그런 것도 없는데요.
    ja: 微妙に違います。
  d_main_46_af_01_72:
    speaker: bahamut
    en: Hmph! And what would you know about that to act so smug? Don't underestimate
      the brilliance of my intelligence!
    ko: |-
      흥. 네가 뭘 안다고 잘난 척하는거지?
      똑똑한 바하무트의 지식을 얕보지 마라.
    ja: |-
      ふっ…知ったかぶりはやめたまえ。
      賢いバハムートの知識を
      甘く見るものではない。
  d_main_46_af_01_73:
    speaker: cecil
    en: Pardon me, but what are you reading?
    ko: 실례지만, 읽고 있는 책은 뭐죠?
    ja: |-
      失礼ですが、お持ちの本は
      何ですか？
  d_main_46_af_01_74:
    speaker: bahamut
    en: A blank notebook. It used to be a book, but it became blank.
    ko: 공책이다. 원래 책이었지만 공책이 되었지.
    ja: |-
      ノートだ。
      元々は本だったが、ノートになってしまった。
  d_main_46_af_01_75:
    speaker: bahamut
    en: I, in my infinite wisdom, absorbed all the knowledge in it, rendering it blank.
    ko: 똑똑한 바하무트가 이 책의 지식을 모조리 흡수해 버려 공책이 되었다.
    ja: |-
      賢いバハムートが
      本にあった知識をすべて吸収してしまった
      結果というわけだ。
  d_main_46_af_01_76:
    speaker: cecil
    en: I've never heard of such a thing in my life.
    ko: 살면서 처음 들어보는 말이네요.
    ja: |-
      そんなことができるとは
      生まれて初めて聞きました。
  d_main_46_af_01_77:
    speaker: papillon
    en: Wow! Check out her forehead, Cecil. It's so smooth.
    ko: 어머어머. 세실. 얘 이마 좀 봐. 엄청 매끈매끈해.
    ja: |-
      ちょっとちょっと、セシル。
      この子のおでこ見てよ。
      ツルッツルよツルッツル。
  d_main_46_af_01_78:
    speaker: leviathan
    en: Hey! Don't touch my forehead!
    ko: 이…! 이마 만지지 말라고!
    ja: ちょっと…！触らないでくれる！？
  d_main_46_af_01_79:
    speaker: papillon
    en: Goodness, you could practically use it as a mirror.
    ko: 세상에. 거울로도 쓸 수 있겠어.
    ja: あら、鏡としても使えそうね。
  d_main_46_af_01_80:
    speaker: onlyone_c
    en: Shiny.
    ko: 반짝반짝.
    ja: ぴかぴか。
  d_main_46_af_01_81:
    speaker: ziz
    en: Hehehehe, it's blinding!
    ko: 흐헤헤. 눈부시다아~
    ja: へへへ。まぶし～
  d_main_46_af_01_82:
    speaker: ziz
    en: Oww... my eyes!
    ko: 으아~ 내 눈~
    ja: うわぁ～、目が、目がぁ～
  d_main_46_af_01_83:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_84:
    speaker: ziz
    en: I-I mean... the sun is so blinding...!
    ko: |-
      아, 아니이….
      햇빛이 너무 눈부시다고오….
    ja: |-
      あ、ええと…
      ああ～太陽がまぶしいな～…
  d_main_46_af_01_85:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_86:
    speaker: "<Narration>"
    en: The moment he opens the door, the troubling thoughts that had been swirling
      in Johan's mind vanish.
    ko: 문을 여는 순간, 요한의 머릿속을 맴돌던 골치 아픈 생각들이 거짓말처럼 사라진다.
    ja: |-
      ドアを開けた瞬間、
      ヨハンの頭の中をぐるぐると巡っていた
      複雑な悩みはウソのように吹き飛んだ
  d_main_46_af_01_87:
    speaker: "<Narration>"
    en: His brain mobilizes every resource at its disposal, in order to find a way
      to bring order to this chaotic situation.
    ko: |-
      이런 혼란스러운 상황을 정리할 방법을 찾기 위해,
      뇌가 모든 정보력을 동원한다.
    ja: |-
      この混沌に収拾をつけるべく、
      脳の情報が総動員される
  d_main_46_af_01_88:
    speaker: "<Narration>"
    en: He combs through his memory and speaks the words he once used to resolve situations
      like these.
    ko: 기억을 더듬어, 이런 상황을 정리했던 말을 내뱉는다.
    ja: |-
      どうにか記憶をたどり、
      このような状況を整理するための
      言葉を吐き出した
  d_main_46_af_01_89:
    speaker: johan
    en: Be quiet.
    ko: 조용히 해라.
    ja: 静かにしろ。
  d_main_46_af_01_90:
    speaker: "<Narration>"
    en: But things do not quieten down at all.
    ko: 조금도 조용해지지 않는다.
    ja: 誰も聞いていない
  d_main_46_af_01_91:
    speaker: "<Narration>"
    en: Johan's head pounds.
    ko: 요한은 머리가 아프다.
    ja: ヨハンのこめかみが引きつった
  d_main_46_af_01_92:
    speaker: "<Narration>"
    en: He needs to resolve this situation one way or another.
    ko: 어떻게든 이 상황을 해결해야 한다.
    ja: どうにかしてこの状況を解決する必要がある
  d_main_46_af_01_93:
    speaker: "<Narration>"
    en: He quickly assesses what's happening.
    ko: 빠르게 상황을 파악한다.
    ja: ヨハンは状況を素早く分析し…
  d_main_46_af_01_94:
    speaker: "<Narration>"
    en: He approaches the source of the commotion, the person whom everyone is shouting
      at.
    ko: 소란의 중심, 모두에게 소리치는 대상에게 다가간다.
    ja: |-
      騒ぎの中心で、
      四方へ声を荒げている者に近づいた
  d_main_46_af_01_95:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_96:
    speaker: leviathan
    en: Wh-what is it?
    ko: 뭐, 뭐야.
    ja: な、何？
  d_main_46_af_01_97:
    speaker: johan
    en: Are you the leader?
    ko: 네가 리더인가?
    ja: お前がリーダーか？
  d_main_46_af_01_98:
    speaker: leviathan
    en: You could say that... for the time being.
    ko: 일단은… 그렇다고 할 수 있지.
    ja: ええと…一応そんな感じ。
  d_main_46_af_01_99:
    speaker: johan
    en: We need to sort some things out.
    ko: 지금 상황에 대해 정리를 할 필요가 있다.
    ja: 今の状況を整理したい。
  d_main_46_af_01_100:
    speaker: johan
    en: You call yourselves the Four Beast, correct?
    ko: 포비스트라고 했나?
    ja: フォービーストと言ったな？
  d_main_46_af_01_101:
    speaker: leviathan
    en: Yes.
    ko: 응.
    ja: うん。
  d_main_46_af_01_102:
    speaker: johan
    en: You're Heretics.
    ko: 헬레틱.
    ja: ヘレティック。
  d_main_46_af_01_103:
    speaker: leviathan
    en: Yes.
    ko: 응.
    ja: そう。
  d_main_46_af_01_104:
    speaker: johan
    en: Who created the Queen.
    ko: 퀸을 만들었다고.
    ja: クイーンを生みだした。
  d_main_46_af_01_105:
    speaker: leviathan
    en: Indeed.
    ko: 응.
    ja: まあ。
  d_main_46_af_01_106:
    speaker: johan
    en: And you're her associates.
    ko: "…그 녀석의 동료."
    ja: "…あの指揮官の友人。"
  d_main_46_af_01_107:
    speaker: leviathan
    en: Yes.
    ko: 응.
    ja: うん。
  d_main_46_af_01_108:
    speaker: johan
    en: "... You saddle up to just about anyone, don't you?"
    ko: "…뭐든 동료로 만들고 보는군."
    ja: "…見境が無いな。"
  d_main_46_af_01_109:
    speaker: johan
    en: I've been briefed about you ahead of time. Your...
    ko: |-
      이야기는 미리 전해 들었다.
      너희는-
    ja: |-
      話は聞いている。
      お前たちの…
  d_main_46_af_01_110:
    speaker: "<Narration>"
    en: Johan is startled by the sudden strange sensation against his leg.
    ko: 요한은 갑자기 다리에 느껴지는 이질적인 감각에 놀랐다.
    ja: |-
      足に突然触れた異質な感覚が、
      ヨハンの言葉を止めた
  d_main_46_af_01_111:
    speaker: "<Narration>"
    en: He looks down.
    ko: 아래를 내려다본다.
    ja: 足もとを見下ろす
  d_main_46_af_01_112:
    speaker: "<Narration>"
    en: A girl is clinging to his leg.
    ko: 소녀가 요한의 다리를 붙잡고 있다.
    ja: 少女が足にしがみついていた
  d_main_46_af_01_113:
    speaker: onlyone_c
    en: Hug me.
    ko: 안아 줘.
    ja: だっこ。
  d_main_46_af_01_114:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_115:
    speaker: papillon
    en: My my, just a kid and already taken with a handsome face.
    ko: 어머어머. 어린애가 벌써부터 얼굴 밝히는 것 좀 봐.
    ja: |-
      あらあら。
      この子ったら、もうなついちゃって。
  d_main_46_af_01_116:
    speaker: "<Narration>"
    en: Johan ignores the girl and continues.
    ko: 요한이 무시하고 얘기를 이어간다.
    ja: ヨハンは見なかったことにして、話を続けた
  d_main_46_af_01_117:
    speaker: johan
    en: As I was saying, your...
    ko: |-
      이야기는 미리 전해 들었다.
      너희-
    ja: |-
      話は聞いている。
      お前たちの…
  d_main_46_af_01_118:
    speaker: onlyone_c
    en: Hug me.
    ko: 안아 줘.
    ja: だっこ。
  d_main_46_af_01_119:
    speaker: johan
    en: "... end goal is? I have a hard time believing you helped us out of..."
    ko: |-
      …는 뭐가 목적이지?
      단순히 우릴 도와준다고는 생각할 수 없-
    ja: |-
      …目的は何だ？
      ただ助けに来たとは信じられ…
  d_main_46_af_01_120:
    speaker: onlyone_c
    en: Hug me.
    ko: 안아 줘.
    ja: だっこ。
  d_main_46_af_01_121:
    speaker: johan
    en: "... goodwill, so I need you to be clear about your intentions. You're aware
      of who we're going up against..."
    ko: |-
      …으니 목적에 대해 확실히 알려주길 바란다.
      우리가 맞서야 할 대상이 누구인지는 알고 있-
    ja: |-
      …ない。目的を聞かせろ。
      戦おうとしている敵が何なのか…
  d_main_46_af_01_122:
    speaker: onlyone_c
    en: Hug me.
    ko: 안아 줘.
    ja: だっこ、して。
  d_main_46_af_01_123:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_124:
    speaker: "<Narration>"
    en: Johan bends down and lifts the girl up.
    ko: 요한이 허리를 숙여 소녀를 들어 올린다.
    ja: ヨハンは腰をかがめ、少女を抱え上げた
  d_main_46_af_01_125:
    speaker: "<Narration>"
    en: He holds her out at arm's length and looks at her.
    ko: 팔을 쭉 뻗고, 들어 올린 소녀를 바라본다.
    ja: 腕を伸ばし、少女の様子を見た
  d_main_46_af_01_126:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_127:
    speaker: onlyone_c
    en: Hehe. Hug me.
    ko: 꺄하. 안아 줘.
    ja: きゃはー。だっこ。
  d_main_46_af_01_128:
    speaker: johan
    en: "... I don't know how I'm supposed to hug you."
    ko: "…어떻게 안아야 하는지 모른다."
    ja: "…どうすればいい。"
  d_main_46_af_01_129:
    speaker: papillon
    en: Just wrap your arms snug around her!
    ko: 그냥 안으면 되잖아. 폭- 하고.
    ja: |-
      抱きしめてあげればいいのよ。
      ぎゅ～って。
  d_main_46_af_01_130:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_131:
    speaker: "<Narration>"
    en: Johan brings the girl into his embrace with stiff, awkward movements.
    ko: 요한이 어색한 움직임으로 소녀를 품에 안는다.
    ja: |-
      ヨハンはぎこちない動きで
      少女を抱きしめた
  d_main_46_af_01_132:
    speaker: "<Narration>"
    en: She falls asleep almost instantly.
    ko: 소녀는 빠르게 잠들었다.
    ja: |-
      それで満足したのか、
      すぐに眠りに落ちた
  d_main_46_af_01_133:
    speaker: johan
    en: "... She's asleep."
    ko: "…잔다."
    ja: "…寝たようだ。"
  d_main_46_af_01_134:
    speaker: leviathan
    en: You're right. She'll sleep in just about anyone's arms.
    ko: 그렇네. 아무한테나 안겨서 잘도 자네.
    ja: そうね。誰の胸でもよく寝られるみたい。
  d_main_46_af_01_135:
    speaker: johan
    en: Do I have to keep holding her like this?
    ko: 계속 이러고 있어야 하나?
    ja: このままこうしていろと？
  d_main_46_af_01_136:
    speaker: leviathan
    en: Yes. If you put her down, there'll be hell to pay.
    ko: 응. 내려놓으면 난리 날걸.
    ja: うん。下ろしたら暴れ出すし。
  d_main_46_af_01_137:
    speaker: johan
    en: What do you mean by that?
    ko: 난리라니.
    ja: 暴れ出す？
  d_main_46_af_01_138:
    speaker: leviathan
    en: She'll cry and scream and all that.
    ko: 울고불고 소리치고 막 그래.
    ja: そりゃもう大泣き。
  d_main_46_af_01_139:
    speaker: johan
    en: "... How long do I have to stay like this?"
    ko: "…언제까지 이러고 있어야 하지?"
    ja: "…いつまで続ければいい？"
  d_main_46_af_01_140:
    speaker: leviathan
    en: Umm... probably until she wakes up?
    ko: 뭐… 깨어날 때까지?
    ja: まあ…この子が起きるまで？
  d_main_46_af_01_141:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_142:
    speaker: "<Narration>"
    en: Johan looks down at the sleeping girl in her arms.
    ko: 요한은 품에 안겨 잠든 소녀를 바라본다.
    ja: ヨハンは胸元で眠る少女の様子をうかがった
  d_main_46_af_01_143:
    speaker: "<Narration>"
    en: The thoughts that had been tormenting him moments ago are completely gone.
    ko: 조금 전까지 머릿속을 괴롭히던 생각들이 깔끔하게 사라진다.
    ja: |-
      先ほどまで何を悩んでいたのかも
      思い出せなくなっていた
  d_main_46_af_01_144:
    speaker: "<Narration>"
    en: Focusing all his attention on holding the girl, Johan stood frozen in place.
    ko: 소녀를 안고 있는 것에 모든 신경을 집중한 요한은 그 자리에서 꼼짝도 하지 못했다.
    ja: |-
      ヨハンは胸の中の存在に
      全神経を集中させ、
      その場から動けなくなった
  d_main_46_af_01_145:
    speaker: "<Narration>"
    en: This is the first time Cecil has seen this side of Johan.
    ko: 세실은 그런 요한의 모습을 처음 봤고.
    ja: |-
      見たことのないうろたえ方をする
      ヨハンを見たセシルは…
  d_main_46_af_01_146:
    speaker: "<Narration>"
    en: She bursts out laughing in the end.
    ko: 결국 웃음을 터트렸다.
    ja: |-
      こらえていた笑いが
      とうとう抑えられなくなった
  d_main_46_af_01_147:
    speaker: leviathan
    en: "... All right. I have a clear picture of what's going on."
    ko: "…좋아. 상황에 대해서는 잘 알겠어."
    ja: "…うん。状況についてはよく分かったわ。"
  d_main_46_af_01_148:
    speaker: leviathan
    en: We'll cooperate.
    ko: 협력할게.
    ja: 協力する。
  d_main_46_af_01_149:
    speaker: johan
    en: Do I need to remind you who we're up against?
    ko: 상대에 대해 다시 한번 상기시켜 줘야 하나?
    ja: 敵についての説明は、これ以上不要か？
  d_main_46_af_01_150:
    speaker: leviathan
    en: There's no need. We've met her.
    ko: |-
      그럴 필요 없어.
      만났으니까.
    ja: |-
      うん、いらない。
      もう戦ってきたから。
  d_main_46_af_01_151:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_152:
    speaker: leviathan
    en: Hmm... so that was the Queen. No wonder...
    ko: |-
      그래. 그게 퀸이었구나.
      어쩐지….
    ja: |-
      やっぱ、あれがクイーンだったってことだね。
      どうりで…
  d_main_46_af_01_153:
    speaker: leviathan
    en: What would happen if we leave her alone?
    ko: 그거, 놔두면 어떻게 돼?
    ja: あいつ、放っといたらどうなるの？
  d_main_46_af_01_154:
    speaker: johan
    en: I have no idea at all.
    ko: 모른다. 아무것도.
    ja: 不明だ。何も分かっていない。
  d_main_46_af_01_155:
    speaker: johan
    en: According to Snow White, she's establishing a new faction.
    ko: 스노우 화이트의 말에 따르면 새로운 세력을 구축 중이라 한다.
    ja: |-
      スノーホワイトの報告によれば、
      今はラプチャーどもを作り直しているらしい。
  d_main_46_af_01_156:
    speaker: johan
    en: Which means they intend to create a world of their own.
    ko: 그 의미는, 그것들만의 세상을 만들겠다는 의미다.
    ja: |-
      今度こそ、奴らだけの世界を
      作り出すつもりだろう。
  d_main_46_af_01_157:
    speaker: johan
    en: Any notion of coexistence is just a pipe dream.
    ko: 공존 같은 건 꿈꾸는 소리겠지.
    ja: 共存など、夢物語だな。
  d_main_46_af_01_158:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_159:
    speaker: "<Narration>"
    en: Leviathan stares at the girl asleep in Johan's arms.
    ko: 레비아탄은 요한의 품에 안겨 잠든 소녀를 빤히 바라보았다.
    ja: |-
      レヴィアタンは、ヨハンに抱かれたまま眠る
      少女に目をやった
  d_main_46_af_01_160:
    speaker: leviathan
    en: That's reason enough.
    ko: 그 이유면 충분해.
    ja: なら、十分。
  d_main_46_af_01_161:
    speaker: leviathan
    en: We're in.
    ko: 협력할게.
    ja: それも協力する理由。
  d_main_46_af_01_162:
    speaker: johan
    en: "... Good."
    ko: "…그래."
    ja: "…そうか。"
  d_main_46_af_01_163:
    speaker: leviathan
    en: So we just wait until the Young Man contacts us?
    ko: 그럼, 남자의 연락이 올 때까지 기다리면 되는 거야?
    ja: で、今はあっちからの連絡待ちってこと？
  d_main_46_af_01_164:
    speaker: johan
    en: For now, yes.
    ko: 지금으로서는 그렇다.
    ja: 現状はそうなる。
  d_main_46_af_01_165:
    speaker: leviathan
    en: Understood. We'll wait then.
    ko: 알겠어. 기다릴게.
    ja: じゃ、待つしかないね。
  d_main_46_af_01_166:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_167:
    speaker: leviathan
    en: Isn't she heavy?
    ko: 그 애. 안 무거워?
    ja: その子、重くない？
  d_main_46_af_01_168:
    speaker: johan
    en: No. I've gotten the hang of it.
    ko: 요령이 생겼다. 무겁지 않다.
    ja: 要領をつかんできた。何とかなる。
  d_main_46_af_01_169:
    speaker: leviathan
    en: "... I see."
    ko: 아… 그래.
    ja: ふーん…そう。
  d_main_46_af_01_170:
    speaker: "<Narration>"
    en: The girl suddenly opens her eyes wide.
    ko: 소녀가 갑자기 눈을 번쩍 뜬다.
    ja: 少女が突然、目を開いた
  d_main_46_af_01_171:
    speaker: "<Narration>"
    en: She slips out of Johan's arms and runs off.
    ko: 요한의 품을 벗어나 어디론가 달려간다.
    ja: |-
      ヨハンの胸元を抜け出し、
      どこかへ駆け出した
  d_main_46_af_01_172:
    speaker: johan
    en: "...?"
    ko: "…?"
    ja: "……？"
  d_main_46_af_01_173:
    speaker: leviathan
    en: H-hey! Where are you going?
    ko: 앗. 야, 야! 어디가!
    ja: ちょ、ちょっとちょっと！どこ行くの！？
  d_main_46_af_01_174:
    speaker: leviathan
    en: Honestly! I can't take my eyes off her for even a second.
    ko: 아잇 정말! 한시도 눈을 뗄 수가 없네 정말!
    ja: ああもう！手がかかる！
  d_main_46_af_01_175:
    speaker: "<Narration>"
    en: Leviathan chases after the girl.
    ko: 레비아탄이 소녀의 뒤를 쫓는다.
    ja: レヴィアタンが少女を追いかけた
  d_main_46_af_01_176:
    speaker: "<Narration>"
    en: Johan rises and follows.
    ko: 요한도 일어나 뒤를 쫓는다.
    ja: ヨハンは立ち上がり、後に続いた
  d_main_46_af_01_177:
    speaker: "<Narration>"
    en: Without the slightest hesitation, the girl runs through Eden.
    ko: 소녀는 조금의 망설임도 없이 에덴 내부를 달린다.
    ja: |-
      少女は全く迷う様子もなく、
      エデンの奥へ進んでいく
  d_main_46_af_01_178:
    speaker: "<Narration>"
    en: Something about her path she's taking strikes Johan as strange.
    ko: 요한은 소녀의 동선이 이상하다고 느꼈다.
    ja: ヨハンは、どこかを目指していると感じた
  d_main_46_af_01_179:
    speaker: "<Narration>"
    en: The place she is heading to is clearly...
    ko: 지금 향하는 곳은 분명히-
    ja: その場所には予想がつく
  d_main_46_af_01_180:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_main_46_af_01_181:
    speaker: onlyone_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_01_182:
    speaker: "<Narration>"
    en: The girl quietly stares at Marian, lying there as if asleep.
    ko: 소녀는 잠든 듯 누워있는 마리안을 물끄러미 바라본다.
    ja: |-
      まるで眠るように横たわるマリアンを
      少女がじっと見つめた
  d_main_46_af_01_183:
    speaker: "<Narration>"
    en: She waves her hand in front of her face, but Marian does not wake.
    ko: |-
      얼굴 앞에서 손을 흔든다.
      마리안은 깨어나지 않는다.
    ja: |-
      顔の前で手を振っても、
      マリアンに反応はない
  d_main_46_af_01_184:
    speaker: "<Narration>"
    en: She reaches out and places her hand on Marian's chest.
    ko: 소녀가 손을 뻗어 마리안의 가슴에 얹는다.
    ja: 少女は手を伸ばし、マリアンの胸に触れた
  d_main_46_af_01_185:
    speaker: "<Narration>"
    en: No heartbeat can be felt.
    ko: 아무런 고동도 느껴지지 않는다.
    ja: 胸の鼓動がまったくない
  d_main_46_af_01_186:
    speaker: "<Narration>"
    en: The girl takes a step back,
    ko: 소녀는 한걸음 뒤로 물러선다.
    ja: 少女は一歩身を引き…
  d_main_46_af_01_187:
    speaker: "<Narration>"
    en: and places her hand on her own chest.
    ko: 자신의 가슴에 손을 올린다.
    ja: 手を自分の胸に伸ばした
  d_main_46_af_01_188:
    speaker: "<Narration>"
    en: She feels two heartbeats.
    ko: 두개의 고동이 느껴진다.
    ja: その手は2つの鼓動を感じていた
  d_main_46_af_01_189:
    speaker: "<Narration>"
    en: The girl continues to stare at Marian.
    ko: 소녀는 마리안을 계속 바라본다.
    ja: 少女の視線がマリアンに戻った
d_main_46_af_02:
  d_main_46_af_02_1:
    speaker: doban
    en: Fire!
    ko: 쏴라-!
    ja: 撃て！
  d_main_46_af_02_2:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두--!!
    ja: ズダダダダッ――！！
  d_main_46_af_02_3:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_4:
    speaker: "<Narration>"
    en: Mass-produced Nikkes open fire on Dorothy.
    ko: 양산형 니케들이 도로시를 향해 총을 쏜다.
    ja: |-
      量産型ニケの軍団が
      ドロシーに向かっていっせいに射撃した
  d_main_46_af_02_5:
    speaker: "<Narration>"
    en: Dorothy effortlessly evades the fusillade, lost in thought.
    ko: 도로시는 가볍게 그 공격들을 피하며 생각한다.
    ja: |-
      ドロシーはそれを易々とかわしつつ、
      思考を巡らせた
  d_main_46_af_02_6:
    speaker: dorothy
    en: I suppose this must be because of the Queen...
    ko: "…퀸에 대한 이야기 때문… 이겠네."
    ja: "…クイーンの話を出したから…でしょうね。"
  d_main_46_af_02_7:
    speaker: "<Narration>"
    en: "'The Ark's leadership must already know that the Queen has come to the surface.'"
    ko: 방주의 수뇌부는 이미 퀸이 지상에 왔다는 것을 알고 있을 것이다.
    ja: |-
      アークの首脳部は、
      クイーンが地上に降下したことを
      すでに知っているはずだ
  d_main_46_af_02_8:
    speaker: "<Narration>"
    en: "'Information that is highly confidential.'"
    ko: 극비 중의 극비.
    ja: 間違いなく、極秘中の極秘情報
  d_main_46_af_02_9:
    speaker: "<Narration>"
    en: "'They're attacking me on grounds that I disclosed that information and stirred
      up unrest among the public.'"
    ko: |-
      그 정보를 공개해 민심을 뒤흔들었다는 이유로,
      나를 공격하는 것이겠지.
    ja: |-
      それを公表し、
      人々を混乱させたというあたりが
      襲撃された理由だろうか
  d_main_46_af_02_10:
    speaker: "<Narration>"
    en: "'But this is not what I had in mind.'"
    ko: 하지만 예상과는 다르다.
    ja: しかし、襲撃はドロシーの予想外だった
  d_main_46_af_02_11:
    speaker: "<Narration>"
    en: "'One would expect leadership would summon me for a meeting, or even an interrogation,
      for leaking classified intel.'"
    ko: 극비를 누설한 이유로 수뇌부들에게 불려 가 회의, 심하면 심문을 당할 것이라 예상했다.
    ja: |-
      機密情報を漏らしたかどで、
      首脳部の前に呼び出され問い詰められるか、
      最悪の場合は尋問されるだろうと考えていた
  d_main_46_af_02_12:
    speaker: "<Narration>"
    en: "'I intended to make my case for the necessity of the Third Surface Reclamation
      War. But of course, leadership couldn't possibly be swayed.'"
    ko: |-
      그 과정에서 3차 지상 탈환전에 대한 필요성을 어필할 예정이었다.
      물론, 수뇌부는 설득되지 않는다.
    ja: |-
      その時に第三次地上奪還戦の
      必要性を訴えればいい。
      無論、首脳部は聞く耳を持たないだろう
  d_main_46_af_02_13:
    speaker: "<Narration>"
    en: "'But for the Nikkes who are completely kept in the dark, and the civilians
      who are equally uninformed?'"
    ko: |-
      하지만 니케들은. 아무것도 모르는 니케들은.
      그리고 아무것도 모르는 시민들은.
    ja: |-
      だが、ニケなら。
      何も知らないニケたち、
      そして何も知らない人々なら…
  d_main_46_af_02_14:
    speaker: "<Narration>"
    en: "'The mounting chaos within the Ark would have been more than enough to shake
      them to the core. I need to be the one who puts those fears to rest.'"
    ko: |-
      잇따른 방주 내의 혼란은 그들의 마음을 뒤흔들기에 충분했을 테고,
      내가 직접 그 불안감을 해소한다.
    ja: |-
      相次ぐ大事件に揺さぶられているはずだ。
      自分がその心のすき間を埋めればいい
  d_main_46_af_02_15:
    speaker: "<Narration>"
    en: "'It's impossible to explain everything to them as it were, so some degree
      of deception is necessary.'"
    ko: |-
      어느 정도의 거짓말은 필요하다.
      그들에게 모든 사정을 설명할 순 없다.
    ja: |-
      そのためには、ある程度の作り話も必要だ。
      すべての人に事情を細かく説明することなど
      できはしないのだから
  d_main_46_af_02_16:
    speaker: "<Narration>"
    en: "'That way, it will be easier to incite them. After all, what people want
      are visible facts and solutions. What lies beneath never interests them.'"
    ko: 그편이 선동도 더욱 쉽다. 눈에 보이는 사실과 그 해결책이 중요하지, 그 이면에 대해서는 사람들은 관심이 없다.
    ja: |-
      それが扇動というものだ。
      大事なのは目につく事実と解決策で、
      ほとんどの人々はその裏事情に関心を持たない
  d_main_46_af_02_17:
    speaker: "<Narration>"
    en: "'The performance I've put on in the Ark until now should be sufficient to
      draw in both Nikkes and the people alike.'"
    ko: |-
      지금까지 내가 방주 안에서 보여준 퍼포먼스는,
      니케와 사람들을 끌어들이기에 충분하다고 판단했다.
    ja: |-
      自分がアークで重ねてきた
      パフォーマンスを思い起こせば、
      ニケも人々も十分に引き込めると考えていた
  d_main_46_af_02_18:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두--!!
    ja: ズダダダダッ――！！
  d_main_46_af_02_19:
    speaker: "<Narration>"
    en: "'But this I did not anticipate.'"
    ko: 하지만 이건 예상 밖이다.
    ja: だが、これは想定外だった
  d_main_46_af_02_20:
    speaker: "<Narration>"
    en: "'I didn't think they would attack without warning. And In the middle of the
      city, no less.'"
    ko: |-
      다짜고짜 공격을 해올줄은 몰랐다.
      그것도 시내 한복판에서.
    ja: |-
      問答無用の襲撃。
      しかも、市街地の中心で
  d_main_46_af_02_21:
    speaker: dorothy
    en: What's going on?
    ko: 대체 뭐지.
    ja: いったいどういう…
  d_main_46_af_02_22:
    speaker: "<Narration>"
    en: Dorothy avoids every bullet as they rain down on her.
    ko: 도로시는 빗발치는 총알을 모두 피한다.
    ja: 銃弾の雨がドロシーを捉えることはない
  d_main_46_af_02_23:
    speaker: "<Narration>"
    en: Citizens flee in terror or collapse to the ground.
    ko: 시민들은 공포에 질려 도망가거나 주저앉는다.
    ja: |-
      だが恐怖に怯えた人々が逃げ惑い、
      あるいはその場に座り込んでいる
  d_main_46_af_02_24:
    speaker: "<Narration>"
    en: She moves carefully so no one gets hurt.
    ko: 그들에게 피해가 가지 않게 주의하며 움직인다.
    ja: |-
      ドロシーはそれを巻き込まないよう、
      慎重な立ち回りを続けていた
  d_main_46_af_02_25:
    speaker: "<Narration>"
    en: Any casualties will prove fatal to her plan. Even the slightest association
      to what is going on would be just as fatal.
    ko: |-
      희생자가 생기는 건 치명적이다.
      거기에 연관이 되었다는 것만 해도 치명적이다.
    ja: |-
      犠牲者が出るだけで重大な問題だが、
      もし自分が原因になれば致命的だ
  d_main_46_af_02_26:
    speaker: doban
    en: You little rat...!
    ko: 쥐새끼 같은…!
    ja: ネズミのようにチョロチョロと…！
  d_main_46_af_02_27:
    speaker: doban
    en: Where are my damned reinforcements?!
    ko: 지원 병력은 아직인가!
    ja: 増援はまだか！？
  d_main_46_af_02_28:
    speaker: "<Narration>"
    en: The moment Doban's shout fades, a swarm of mass-produced Nikkes appear.
    ko: 도반의 외침이 끝나기 무섭게 다수의 양산형 니케들이 나타난다.
    ja: |-
      ドバンの声に応えるかのごとく、
      さらに多数の量産型ニケが現れた
  d_main_46_af_02_29:
    speaker: "<Narration>"
    en: They open fire on Dorothy.
    ko: 도로시를 향해 총격을 가한다.
    ja: ドロシーを狙う射撃が勢いを増す
  d_main_46_af_02_30:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_31:
    speaker: dorothy
    en: This could go on forever.
    ko: 이대로는 끝이 없겠어.
    ja: らちが明かない…
  d_main_46_af_02_32:
    speaker: "<Narration>"
    en: Dorothy dashes forward.
    ko: 도로시가 달려 나간다.
    ja: ドロシーが身をひるがえらせた
  d_main_46_af_02_33:
    speaker: "<Narration>"
    en: Weaving the hail of bullets, she charges toward the mass-produced Nikkes spread
      into formation.
    ko: 쏟아치는 총알을 모두 회피하며, 대형을 펼치고 있는 양산형 니케 부대에게 돌진한다.
    ja: |-
      降り注ぐ銃弾をことごとくかわし、
      陣形を組む量産型ニケの集団に飛び込んでいく
  d_main_46_af_02_34:
    speaker: "<Narration>"
    en: She does not draw her gun. Instead, using hand-to-hand combat, she takes them
      down one by one.
    ko: |-
      총은 꺼내지 않는다.
      체술로 하나하나 쓰러뜨린다.
    ja: |-
      銃は抜いていない。
      体術をしかけられ、
      ニケが1人、また1人と落ちていく
  d_main_46_af_02_35:
    speaker: "<Narration>"
    en: With no knowledge of close-quarters combat, the mass-produced Nikkes begin
      to fall.
    ko: 접근전에 대한 정보가 없는 양산형 니케들이 하나둘씩 쓰러진다.
    ja: |-
      肉弾戦に不慣れな量産型ニケたちは
      なすすべなく倒れていった
  d_main_46_af_02_36:
    speaker: "<Narration>"
    en: Dorothy keeps dropping them without pause.
    ko: 도로시는 계속해서 양산형 니케들을 쓰러뜨려간다.
    ja: 立っている量産型ニケが見る間に減っていく
  d_main_46_af_02_37:
    speaker: doban
    en: Tch...! Damned Pilgrim!
    ko: 치잇…! 필그림 놈…!
    ja: チッ…！ピルグリムめ…！
  d_main_46_af_02_38:
    speaker: dorothy
    en: Deputy Chief Doban.
    ko: 부사령관. 도반.
    ja: 副司令官、ドバン。
  d_main_46_af_02_39:
    speaker: doban
    en: Oh. So you know who I am.
    ko: 호오. 나를 아는군.
    ja: ん？知られていたのか。
  d_main_46_af_02_40:
    speaker: dorothy
    en: Information on the Ark's commander in chief and deputy chiefs is kept well-hidden.
    ko: 방주의 총사령관은 물론 부사령관들에 대한 정보는 꼭꼭 숨겨져 있더군요.
    ja: |-
      総司令官はもちろん、
      副司令官に関する情報まで
      アークでは厳重に隠匿されていますが…
  d_main_46_af_02_41:
    speaker: dorothy
    en: With the exception of yours. So it left an impression.
    ko: 그런데 오직 당신의 정보만 쉽게 열람할 수 있어서, 기억하고 있죠.
    ja: |-
      あなたの情報だけは簡単に閲覧できたので、
      よく覚えています。
  d_main_46_af_02_42:
    speaker: dorothy
    en: Given the low security clearance, I assume you aren't anyone of significance.
      Am I right?
    ko: 보안 레벨이 낮은 걸로 봐서 대단한 인물은 아닐 거라 생각했는데, 맞나요?
    ja: |-
      セキュリティレベルの低さからしても、
      肩書きほどの方ではない。違いましたか？
  d_main_46_af_02_43:
    speaker: doban
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_44:
    speaker: dorothy
    en: I don't believe we've formally been introduced.
    ko: 따로 인사를 드린 적은 없었던 것 같은데….
    ja: |-
      そういえば、
      特に顔合わせをした記憶もありませんね。
  d_main_46_af_02_45:
    speaker: dorothy
    en: Have we met before?
    ko: 저희, 구면이던가요?
    ja: それとも、どこかでお会いしていましたか？
  d_main_46_af_02_46:
    speaker: doban
    en: Like hell we have.
    ko: 그럴 리가 있겠나.
    ja: 会ったことはなかっただろうな。
  d_main_46_af_02_47:
    speaker: dorothy
    en: Then do you hold some personal grudge against me?
    ko: 그럼 저한테 개인적인 원한이라도?
    ja: では、私に何か恨みでも？
  d_main_46_af_02_48:
    speaker: doban
    en: It's nothing personal.
    ko: 개인적인 원한은 없다.
    ja: そんなものはない。
  d_main_46_af_02_49:
    speaker: doban
    en: I'm acting on behalf of the Ark.
    ko: 방주를 위해서다.
    ja: 全てはアークのためだ。
  d_main_46_af_02_50:
    speaker: dorothy
    en: "... What did you say?"
    ko: "…뭐라고요?"
    ja: "…どういうことです？"
  d_main_46_af_02_51:
    speaker: doban
    en: I've known about your little scheme all along.
    ko: 네놈의 속셈 따위 진즉에 알고 있었다.
    ja: 貴様の企みは分かっている。
  d_main_46_af_02_52:
    speaker: doban
    en: I won't let you have your revenge on the Ark.
    ko: 방주에 복수하도록 두지 않는다.
    ja: アークに復讐などさせはせん。
  d_main_46_af_02_53:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_54:
    speaker: dorothy
    en: Revenge on the Ark? What on earth are you...
    ko: 방주에 복수라니, 무슨 뜬구름 잡는 소릴 하-
    ja: アークに復讐？訳の分からないことを…
  d_main_46_af_02_55:
    speaker: doban
    en: You're part of the Goddess Squad...
    ko: 갓데스 스쿼드.
    ja: ゴッデス。
  d_main_46_af_02_56:
    speaker: doban
    en: "... And you're the acting leader, Dorothy."
    ko: "…의 리더 대행. 도로시."
    ja: "…その暫定リーダー、ドロシー。"
  d_main_46_af_02_57:
    speaker: dorothy
    en: "...!!"
    ko: "--!!"
    ja: "――！！"
  d_main_46_af_02_58:
    speaker: doban
    en: That's right. You must want revenge, don't you?
    ko: 그래. 복수하고 싶겠지.
    ja: いいや。復讐したいと思わない方が不思議だ。
  d_main_46_af_02_59:
    speaker: doban
    en: The Ark should have been yours, and yet there's no place for any of you in
      it.
    ko: 원래 너희들의 것이 되야 했을 방주에, 너희의 자리가 없으니까.
    ja: |-
      アークはお前たちのものになるはずだった。
      そこに居場所が無かったというのだからな。
  d_main_46_af_02_60:
    speaker: doban
    en: But I won't allow it.
    ko: 하지만 안된다.
    ja: だが、そうはいかん。
  d_main_46_af_02_61:
    speaker: doban
    en: As long as I, Deputy Chief Doban, am here,
    ko: 내가 있는 한. 이 부사령관 도반이 있는 한.
    ja: この私、副司令官ドバンがいる限り…
  d_main_46_af_02_62:
    speaker: doban
    en: You won't have your revenge on the Ark.
    ko: 너는 방주에 복수할 수 없다.
    ja: お前に復讐など、させはせん。
  d_main_46_af_02_63:
    speaker: dorothy
    en: You...
    ko: "…당신."
    ja: "…あなたは…"
  d_main_46_af_02_64:
    speaker: dorothy
    en: How do you know any of this?
    ko: 그걸 어떻게 알고 있죠?
    ja: どこでその話を？
  d_main_46_af_02_65:
    speaker: doban
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_af_02_66:
    speaker: "<Narration>"
    en: Seeing Dorothy's reaction, Doban becomes certain.
    ko: 도반은 도로시의 반응을 보며 확신했다.
    ja: ドロシーの反応を見て、ドバンは確信した
  d_main_46_af_02_67:
    speaker: "<Narration>"
    en: This is it.
    ko: 진짜다.
    ja: 間違いない
  d_main_46_af_02_68:
    speaker: "<Narration>"
    en: This is real.
    ko: 이건 진짜다.
    ja: 目の前にいるのは本物だ
  d_main_46_af_02_69:
    speaker: "<Narration>"
    en: With this, he can make a name for himself.
    ko: 이걸로 공을 세울 수 있다.
    ja: これは大手柄になる
  d_main_46_af_02_70:
    speaker: "<Narration>"
    en: Doban was born in the Outer Rim.
    ko: 도반은 아우터 림에서 태어났다.
    ja: ドバンはアウターリムの出身だ
  d_main_46_af_02_71:
    speaker: "<Narration>"
    en: He was raised by a father who dealt with the stress of a difficult life by
      beating him mercilessly.
    ko: 힘든 삶에 대한 스트레스를 아들에게 폭력을 휘두르는 것으로 해소하던 아버지 밑에서 자랐다.
    ja: |-
      苦しい生活のストレスを
      暴力として自分に向けてくる
      父親のもとで育った
  d_main_46_af_02_72:
    speaker: "<Narration>"
    en: To this day, he's unsure if that man was truly his father. Perhaps that was
      simply what he wanted to believe.
    ko: 아버지인지는 모른다. 그렇게 믿고 싶었을 뿐일지도 모른다.
    ja: |-
      本当に父親だったかも分かっていない。
      自分がそう信じたかっただけかもしれない
  d_main_46_af_02_73:
    speaker: "<Narration>"
    en: One day, while living hand to mouth as a collector, a Central Government soldier
      showed up in Ephialtes.
    ko: |-
      콜렉터로 하루하루 살아가고 있던 어느 날,
      중앙 정부의 군인이 배드 드림을 찾았다.
    ja: |-
      くず拾いをして暮らしていたある日、
      中央政府の軍人がバッドドリームを訪れた
  d_main_46_af_02_74:
    speaker: "<Narration>"
    en: Everyone groveled before the soldier and obtained food and money in return.
    ko: 모두가 군인에게 굽신거리며 음식이며 돈을 얻어냈다.
    ja: |-
      周囲の誰もがその軍人に媚びを売り、
      食べ物や金を受け取っていた
  d_main_46_af_02_75:
    speaker: "<Narration>"
    en: Doban polished the soldier's shoes out of curiosity, and the soldier gave
      him money.
    ko: |-
      도반은 호기심에 군인의 구두를 닦았다.
      군인이 돈을 건넸다.
    ja: |-
      ドバンは好奇心だけで軍人の靴を磨いた。
      軍人に金を差し出された
  d_main_46_af_02_76:
    speaker: "<Narration>"
    en: It was a large sum that would take three months of work to earn, but he turned
      down the money.
    ko: |-
      도반은 돈을 받지 않았다.
      석 달은 일해야 손에 넣을 수 있는 거금이었지만 받지 않았다.
    ja: |-
      ドバンはそれを受け取らなかった。
      自分の稼ぎの3ヶ月分にはなる大金だったが、
      それでもかたくなに固辞した
  d_main_46_af_02_77:
    speaker: "<Narration>"
    en: Instead, he smiled and claimed he was only doing this because he enjoyed it.
    ko: |-
      대신 웃으며 말했다.
      제가 좋아서 하는 건데요 뭘.
    ja: |-
      代わりに、笑顔を返した。
      自分の好きでやったことだからと言った
  d_main_46_af_02_78:
    speaker: "<Narration>"
    en: The soldier took an interest in this young boy from the Outer Rim. One who
      expected no compensation.
    ko: 군인은 아우터 림에서 대가를 요구하지 않는 어린 남자아이에게 흥미가 생겼다.
    ja: |-
      アウターリムで見返りを求めない少年が
      珍しかったらしく、興味を抱かれた
  d_main_46_af_02_79:
    speaker: "<Narration>"
    en: The soldier stayed in Ephialtes for a month, putting Doban to work as his
      errand boy.
    ko: 군인은 한 달 동안 배드 드림에서 지내며 도반을 심부름꾼으로 부렸다.
    ja: |-
      それから1ヶ月ほど
      その軍人はバッドドリームに滞在し
      ドバンに使い走りをさせた
  d_main_46_af_02_80:
    speaker: "<Narration>"
    en: 'Doban served the soldier wholeheartedly, and on the last day, the soldier
      said to him:'
    ko: |-
      도반은 성심성의껏 군인을 보필했다.
      마지막 날, 군인이 얘기했다.
    ja: |-
      ドバンは裏心なく付き従った。
      最後の日に、軍人が言った
  d_main_46_af_02_81:
    speaker: "<Narration>"
    en: '"Come to the Ark and serve me there."'
    ko: 너 방주 와서 내 시중이나 들어라.
    ja: アークに来て、私に仕えろ
  d_main_46_af_02_82:
    speaker: "<Narration>"
    en: And so, Doban received an identification chip from the soldier and headed
      for the Ark.
    ko: 도반은 군인에게 인식 칩을 받고 방주로 향한다.
    ja: |-
      ドバンは軍人から認識チップを渡され、
      アークへと足を踏み入れた
  d_main_46_af_02_83:
    speaker: "<Narration>"
    en: One month was all it took.
    ko: 한 달. 고작 한 달이었다.
    ja: たった1ヶ月のことだ
  d_main_46_af_02_84:
    speaker: "<Narration>"
    en: The identification chip that everyone in the Outer Rim could only dream of
      had come to him, simply because he served an unnamed soldier for a month.
    ko: |-
      아우터 림에서 모두의 꿈이나 다름없었던 인식 칩이,
      이름 모를 군인을 고작 한 달 모셨다는 이유로 손에 들어왔다.
    ja: |-
      アウターリムの誰もが憧れるチップを
      名前も知らない軍人に
      たった1ヶ月付き添うだけで手に入れた
  d_main_46_af_02_85:
    speaker: "<Narration>"
    en: It didn't take long for him to realize that everything he so desperately desired
      in the Outer Rim is easily obtained in the Ark.
    ko: 아우터 림에서 그렇게나 필사적으로 원했던 것들이, 방주에서는 쉽게 쉽게 이뤄진다는 사실을 깨닫는 데는 오래 걸리지 않았다.
    ja: |-
      アウターリムでは命がけで願うようなことが
      アークでは簡単に叶うという事実に気づくまで
      そう長くはかからなかった
  d_main_46_af_02_86:
    speaker: "<Narration>"
    en: Doban lived as a citizen of the Ark before becoming a soldier.
    ko: |-
      도반은 [방주의 시민]으로 살았다.
      군인이 되었다.
    ja: |-
      ドバンは「アークの市民」として
      生きるようになり、軍人となった
  d_main_46_af_02_87:
    speaker: "<Narration>"
    en: One day, an opportunity arose for him to tour the Outer Rim, which he accepted
      without hesitation.
    ko: |-
      어느 날, 아우터 림 견학 기회가 왔다.
      도반은 망설임 없이 아우터 림으로 향했다.
    ja: |-
      ある時、アウターリムへ行く機会が
      回ってきたドバンは、喜び勇んで
      アウターリムへ向かった
  d_main_46_af_02_88:
    speaker: "<Narration>"
    en: He did so because he found himself missing his hometown.
    ko: 고향이 그립다는 생각이 들었기 때문이다.
    ja: そこは彼が故郷と感じる場所でもあったからだ
  d_main_46_af_02_89:
    speaker: "<Narration>"
    en: The moment he crossed the Partition, however, Doban was horrified.
    ko: 격벽을 넘어가자마자 도반은 경악했다.
    ja: しかし防壁を越えた瞬間、ドバンは困惑した
  d_main_46_af_02_90:
    speaker: "<Narration>"
    en: Had this place always been this filthy and dark?
    ko: 이렇게 지저분하고 어두운 곳이었다니.
    ja: こんなに汚くて暗い場所だったとは
  d_main_46_af_02_91:
    speaker: "<Narration>"
    en: Someone approached him and polished his shoes.
    ko: 누군가가 다가와 자신의 구두를 닦는다.
    ja: 誰かが近寄り、ドバンの靴に手を伸ばした
  d_main_46_af_02_92:
    speaker: "<Narration>"
    en: It was the man he used to call father.
    ko: 아버지라 부르던 남자였다.
    ja: 自分が父と呼んでいた男だった
  d_main_46_af_02_93:
    speaker: "<Narration>"
    en: The man repeatedly bowed and polished Doban's shoes, but had no idea who Doban
      was.
    ko: |-
      남자는 연신 굽신거리며 도반의 구두를 닦았다.
      도반을 알아보지 못했다.
    ja: |-
      男はすり寄るような態度で
      ドバンの靴を磨きだした。
      靴の持ち主が誰かには気づきもしない
  d_main_46_af_02_94:
    speaker: "<Narration>"
    en: Doban ground the man underfoot, then fled the Outer Rim.
    ko: 도반은 남자를 짓밟고, 도망치듯 아우터 림을 빠져나왔다.
    ja: |-
      ドバンは男を蹴りつけ、
      逃げるようにアウターリムから抜け出した
  d_main_46_af_02_95:
    speaker: "<Narration>"
    en: He was ashamed. Ashamed that he comes from such a putrid cesspool.
    ko: 창피했다. 자신이 그런 지저분하고 어두운 곳 출신이라는 것이.
    ja: |-
      にわかに恥ずかしくなった。
      自分の出身地があれほど
      汚く暗い場所だったということが
  d_main_46_af_02_96:
    speaker: "<Narration>"
    en: He despised himself for ever considering that place home, and for missing
      it even briefly.
    ko: 그곳을 고향이라 여기고, 잠시나마 그리워했던 자신이 싫었다.
    ja: |-
      あんな場所を故郷だと思い、
      時々懐かしみさえしていた自分がいやになった
  d_main_46_af_02_97:
    speaker: "<Narration>"
    en: From that day on, Doban became vitriolic in his disdain for the Outer Rim.
    ko: 도반은 그날부터 아우터 림에 대한 증오를 뿜어냈다.
    ja: |-
      ドバンのアウターリムに対する嫌悪は、
      その日からつのる一方となった
  d_main_46_af_02_98:
    speaker: "<Narration>"
    en: He believed that if the Outer Rim disappeared, his shameful and disgusting
      past would disappear along with it.
    ko: 아우터 림이 없어진다면, 자신의 창피하고 혐오스러운 과거도 함께 사라질 것이라 믿었다.
    ja: |-
      アウターリムを消せば、
      自分の忌まわしい過去も消えると
      考えるようになった
  d_main_46_af_02_99:
    speaker: "<Narration>"
    en: He proposed a policy targeting the Outer Rim to the Central Government.
    ko: 도반은 아우터 림을 향한 정책을 중앙 정부에 제시했다.
    ja: |-
      ドバンはアウターリムへの大政策を
      中央政府に提案した
  d_main_46_af_02_100:
    speaker: "<Narration>"
    en: The policy called for isolating the Outer Rim and designating it as a dumping
      ground.
    ko: 아우터 림을 고립시키고, 철저히 쓰레기통으로 쓰자는 내용이었다.
    ja: |-
      それはアウターリムを孤立させ、
      徹底的にゴミ箱として扱うような内容だ
  d_main_46_af_02_101:
    speaker: "<Narration>"
    en: The Central Government approved the proposal and gave Doban full oversight.
    ko: 중앙 정부는 이를 승인하고, 도반에게 총책임을 맡겼다.
    ja: |-
      中央政府はそれを承認し、
      ドバンを総責任者に据えた
  d_main_46_af_02_102:
    speaker: "<Narration>"
    en: From the Central Government's perspective, the Outer Rim had always been a
      headache. But abandoned or not, it was still a place where people lived.
    ko: |-
      중앙 정부 입장에서도 아우터 림은 처치 곤란인 장소였다.
      버림받았든 어쨌든 [사람 사는 곳]이었기 때문이었다.
    ja: |-
      アウターリムは中央政府としても
      悩みの種だ。打ち捨てられているとはいえ
      「人の居住地」と見られていたからだ
  d_main_46_af_02_103:
    speaker: "<Narration>"
    en: But the policy Doban presented treated the Outer Rim as a place bereft of
      inhabitants.
    ko: 하지만 아우터 림을 사람 사는 곳으로 취급하지 않는다는 정책을 도반이 가져왔다.
    ja: |-
      ドバンの提案は、
      アウターリムを人の居住地として
      扱わない枠組みだった
  d_main_46_af_02_104:
    speaker: "<Narration>"
    en: If things went wrong, all blame could be pinned on Doban. From the Central
      Government's perspective, there was no reason to refuse.
    ko: |-
      일이 잘못되면 모든 화살은 도반에게 돌리면 그만인 일.
      중앙 정부 입장에서는 이를 마다할 이유가 없었다.
    ja: |-
      何か不都合が起こった時は、
      すべての責任をドバンに負わせられる。
      中央政府が却下するわけも無かった
  d_main_46_af_02_105:
    speaker: "<Narration>"
    en: The Outer Rim began to turn into hell.
    ko: 아우터 림은 지옥이 되기 시작했다.
    ja: そうして、アウターリムの締め付けが始まった
  d_main_46_af_02_106:
    speaker: "<Narration>"
    en: Doban soon gained recognition for his role in resolving such a troublesome
      matter, and rose to a high-ranking position.
    ko: 골치 아픈 일을 처리한 공로를 인정받아 고위직에 오른다.
    ja: |-
      ドバンは厄介ごとを取り除いた
      功績が認められ、高官に昇進した
  d_main_46_af_02_107:
    speaker: "<Narration>"
    en: From then on, Doban directed all troublesome and unsavory matters into the
      Outer Rim.
    ko: 이후 도반은 지저분하고 골치 아픈 일을 모두 아우터 림에 버렸다.
    ja: |-
      それからというもの、アークは厄介な問題を
      すべてアウターリムに押し付けるようになった
  d_main_46_af_02_108:
    speaker: "<Narration>"
    en: The place descended further into hell.
    ko: 아우터 림은 더욱더 지옥이 되기 시작했다.
    ja: アウターリムはますます地獄と化していった
  d_main_46_af_02_109:
    speaker: "<Narration>"
    en: Meanwhile, the quality of life in the Ark continued to rise.
    ko: 반면 방주 시민들의 삶의 질은 더욱 올라가기 시작했다.
    ja: |-
      引き換えに、
      アークの民衆の生活は向上していった
  d_main_46_af_02_110:
    speaker: "<Narration>"
    en: As a result of this repeated cycle,
    ko: 그러기를 반복한 결과.
    ja: その繰り返しが重なり…
  d_main_46_af_02_111:
    speaker: "<Narration>"
    en: Doban rose to the position of Deputy Chief.
    ko: 도반은 부사령관의 자리에 올랐다.
    ja: ドバンはとうとう副司令官にまで上り詰めた
  d_main_46_af_02_112:
    speaker: "<Narration>"
    en: He felt on top of the world. That someone like him from the Outer Rim could
      rise all the way to Deputy Chief. It felt like a dream.
    ko: |-
      세상을 다 얻은 것 같았다.
      아우터 림 출신인 자신이 부사령관 자리에 오르다니 꿈만 같았다.
    ja: |-
      この世のすべてを手に入れた気分になった。
      アウターリムを出た身から、
      夢のような成り上がりだ
  d_main_46_af_02_113:
    speaker: "<Narration>"
    en: But that was where it ended.
    ko: 하지만 거기까지였다.
    ja: だが、そこで頭打ちになった
  d_main_46_af_02_114:
    speaker: "<Narration>"
    en: With the Ark stabilized, there was nothing left to dump in the Outer Rim.
    ko: 방주가 안정되어, 아우터 림에 더 버릴 것이 없었다.
    ja: |-
      アークは安定し、
      アウターリムに捨てたいものも
      なくなりつつあった
  d_main_46_af_02_115:
    speaker: "<Narration>"
    en: Whenever problems arose in the Ark, he engineered it to appear as the Outer
      Rim's handiwork, only to be repeatedly foiled by the Underworld Queen and Exotic.
    ko: 방주에 일이 생길 때마다 아우터 림의 소행인 것처럼 공작했지만, 언더월드 퀸과 이그조틱에 의해 빈번히 실패했다.
    ja: |-
      アークで起こった問題の責任を
      なすりつけようとしても、
      アンダーワールドクイーンや
      エキゾチックに阻まれた
  d_main_46_af_02_116:
    speaker: "<Narration>"
    en: He hears whispers behind his back. He's accused of selling out his own hometown
      for a promotion, and now that he's without a scapegoat, he's powerless.
    ko: |-
      뒷담이 들려온다.
      [고향을 팔아 승진했지만, 팔 고향이 없어지자 아무것도 못 한다]는.
    ja: |-
      「故郷を売り続けて、売るものが
      無くなった途端に何もできなくなった」
      などと陰口を言うやからまで現れた
  d_main_46_af_02_117:
    speaker: "<Narration>"
    en: Doban began to grow anxious.
    ko: 도반은 초조해졌다.
    ja: ドバンは焦りはじめた
  d_main_46_af_02_118:
    speaker: "<Narration>"
    en: He had a dream to make the Ark his own personal fiefdom.
    ko: |-
      도반에겐 꿈이 있었다.
      방주를 자신의 왕국으로 만드는 것이었다.
    ja: |-
      ドバンには、
      アークを自分の王国にするという
      野望があった
  d_main_46_af_02_119:
    speaker: "<Narration>"
    en: The thought of an Outer Rim native standing atop the Ark filled him with unbridled
      joy.
    ko: 아우터 림 출신인 자신이, 방주의 꼭대기에 위치한다면 그보다 행복한 일은 없을 거라 생각했다.
    ja: |-
      アウターリム出身の自分が
      アークの頂点に上り詰められれば、
      至上の喜びを感じられるだろう
  d_main_46_af_02_120:
    speaker: "<Narration>"
    en: But he had no way of getting there. Save for his capacity for inhumane methods,
      Doban had no real talent.
    ko: |-
      하지만 방법이 없었다.
      비인간적인 방법을 쓸 수 있다는 것 외에 도반에게 재주는 없었다.
    ja: |-
      しかし、その道は閉ざされつつあった。
      ドバンの才といえば、他者なら目を背ける手を
      迷いなく使えるということぐらいだ
  d_main_46_af_02_121:
    speaker: "<Narration>"
    en: His standing naturally began to erode, and nobody acknowledged his worth.
    ko: |-
      입지가 자연스럽게 좁아진다.
      그 누구도 도반을 인정해 주지 않는다.
    ja: |-
      おのずと立場は弱くなっていった。
      誰一人、ドバンに実力があるとは認めていない
  d_main_46_af_02_122:
    speaker: "<Narration>"
    en: He was excluded from important meetings and he was not even assigned a Nikke
      to his name.
    ko: 중요 회의 자리에서 누락되고, 담당 니케마저 붙여주지 않는다.
    ja: |-
      重要な会議からは外され、
      専属のニケさえ配属されない
  d_main_46_af_02_123:
    speaker: "<Narration>"
    en: He concluded that both his position as Deputy Chief, and his place as a soldier
      and citizen of the Ark were at risk if things continued.
    ko: |-
      이대로는 부사령관 자리는 고사하고,
      군인으로서의 자리, 방주 시민으로서의 자리도 위험하다고 판단했다.
    ja: |-
      このままでは副司令官の座はおろか、
      軍人の地位、あるいはアークの市民権さえ
      危うくなるかもしれない
  d_main_46_af_02_124:
    speaker: "<Narration>"
    en: He needed to prove himself, but he was incompetent.
    ko: 공을 세워야 한다. 하지만 도반은 무능하다.
    ja: |-
      何としても功績が必要だ。
      だが、ドバンにはその才がなかった
  d_main_46_af_02_125:
    speaker: "<Narration>"
    en: That was when the Pilgrim, Dorothy, arrived in the Ark.
    ko: 그때. 필그림 도로시가 방주로 온다.
    ja: |-
      ピルグリム、ドロシーが
      アークを訪れたのはその時だ
  d_main_46_af_02_126:
    speaker: "<Narration>"
    en: He found it suspicious. The timing was too conspicuous.
    ko: |-
      수상하다고 생각했다.
      타이밍이 너무 극적이었기 때문이다.
    ja: |-
      当然、不審に思った。
      あまりにも来訪のタイミングがよすぎたからだ
  d_main_46_af_02_127:
    speaker: "<Narration>"
    en: Doban became certain Dorothy had ulterior motives and began investigating
      her.
    ko: |-
      도반은 도로시에게 다른 꿍꿍이가 있을 것이라 확신하고,
      뒤를 캐기 시작했다.
    ja: |-
      ドバンは彼女の裏に何かあると確信し、
      探りを入れ始めた
  d_main_46_af_02_128:
    speaker: "<Narration>"
    en: When Dorothy left the Ark on an exploration mission on the Utopia, he went
      so far as to plant a bug on her to find out her motives.
    ko: 도로시가 방주를 떠나 유토피아 호로 탐색 임무를 나갔을 때, 도청기까지 붙여가며 그녀의 목적을 알아내려 했지만.
    ja: |-
      ドロシーが突然海上探索へ
      向かったと聞き、盗聴器まで仕掛けて
      目的を探ろうとしたものの…
  d_main_46_af_02_129:
    speaker: "<Narration>"
    en: However, he learned nothing of significance, and there was no information
      about Dorothy anywhere in the Ark either.
    ko: |-
      대단한 것은 알아내지 못했다.
      도로시에 대한 정보는 방주 그 어디에도 없었다.
    ja: |-
      決め手となる情報は手に入らなかった。
      アークのどこを探しても
      ドロシーの背景は不明のままだった
  d_main_46_af_02_130:
    speaker: "<Narration>"
    en: A Nikke without records shouldn't exist. After exhaustive inquiries, Doban
      uncovered the existence of the Forbidden Library.
    ko: |-
      정보가 없는 니케는 존재할 수 없다.
      도반은 수소문 끝에 금서고의 존재에 대해 알아낸다.
    ja: |-
      だが、情報のないニケなど存在しないはずだ。
      ドバンは必死にかぎまわり、
      やがて禁書庫の存在を突き止めた
  d_main_46_af_02_131:
    speaker: "<Narration>"
    en: His position as Deputy Chief made that a possibility.
    ko: 부사령관이라는 직책이 이를 가능하게 만들었다.
    ja: |-
      副司令官という権限が無ければ、
      存在自体を知らないままだっただろう
  d_main_46_af_02_132:
    speaker: "<Narration>"
    en: Doban set out to comb through the Forbidden Library.
    ko: 도반은 금서고를 뒤져보기로 한다.
    ja: ドバンは禁書庫に足を踏み入れようとしたが…
  d_main_46_af_02_133:
    speaker: "<Narration>"
    en: However, the library's doors remained closed to him.
    ko: 하지만 금서고는 철통같은 보안을 유지하고 있다.
    ja: |-
      それはとてつもなく厳重な
      セキュリティに保護されていた
  d_main_46_af_02_134:
    speaker: "<Narration>"
    en: Breaking in without authorization would be a death sentence, even for a Deputy
      Chief.
    ko: 허가 없이 접근했다가는 제아무리 부사령관이라도 죽음을 면치 못할 것이 분명했다.
    ja: |-
      副司令官という立場でもなお、
      許可なく立ち入ろうとすれば命が危うくなる
  d_main_46_af_02_135:
    speaker: "<Narration>"
    en: Since there was no way access to the Forbidden Library would be granted to
      him, Doban was left stomping his feet in frustration.
    ko: |-
      금서고가 자신의 출입을 허가해 줄 리가 없기에,
      도반은 발만 동동 굴렀다.
    ja: |-
      当然立ち入りなど許可されるはずもなく、
      ドバンは歯噛みした
  d_main_46_af_02_136:
    speaker: "<Narration>"
    en: After days of lurking around the Forbidden Library, he spotted a Nikke scoping
      out the same area.
    ko: |-
      그렇게 금서고 주위를 서성이기를 수일,
      어떤 니케가 같은 곳을 서성이는 것을 발견한다.
    ja: |-
      禁書庫の周りを自らかぎまわること数日、
      自分と同じ狙いのニケが
      存在することに気づいた
  d_main_46_af_02_137:
    speaker: "<Narration>"
    en: Doban sensed that an opportunity would present itself in some form.
    ko: 도반은 어떤 형태로든 간에 기회가 올 것이라 직감했다.
    ja: |-
      ドバンはどんな形であれ
      それがチャンスになると直感した
  d_main_46_af_02_138:
    speaker: "<Narration>"
    en: And sure enough, something miraculous happened.
    ko: 그리고 기적은 일어났다.
    ja: そして実際、奇跡はドバンに味方した
  d_main_46_af_02_139:
    speaker: "<Narration>"
    en: There was a blackout in the Ark. Shortly after, the Nikke who had been loitering
      came sprinting out with a book in hand.
    ko: |-
      방주가 정전되고, 잠시 후.
      서성이던 니케가 책을 들고 뛰어오는 것이 보였다.
    ja: |-
      アークの大停電のさなか、
      同じものを狙っていたニケが
      禁書庫から何かを抱えて飛び出してきたのだ
  d_main_46_af_02_140:
    speaker: "<Narration>"
    en: Doban shot the Nikke in the head, stole the book from her, and fled.
    ko: |-
      도반은 그 니케의 머리를 쏜 후,
      품에 안고 있던 책을 훔쳐 달아났다.
    ja: |-
      ドバンはそのニケの頭を撃ち抜き、
      抱えていたものを奪ってその場を離れた
  d_main_46_af_02_141:
    speaker: "<Narration>"
    en: After reading everything written in that book, Doban let out a shout of triumph.
    ko: 그 책에 쓰여 있는 모든 내용을 읽은 도반은 환호성을 내질렀다.
    ja: |-
      奪った資料の中身を知ったドバンは、
      歓喜の声を上げた
  d_main_46_af_02_142:
    speaker: "<Narration>"
    en: All records from the Forbidden Library carry inherent credibility, so the
      contents of the book could be trusted.
    ko: |-
      금서고의 모든 자료는 그 자체만으로 공신력을 가지므로,
      이 책의 내용은 신용할 수 있다.
    ja: |-
      わざわざ厳重に保管されている資料だ。
      信頼性は疑うべくもない
  d_main_46_af_02_143:
    speaker: "<Narration>"
    en: He became certain of Dorothy's intention.
    ko: 도로시의 의도가 무엇인지 확신했다.
    ja: ドロシーの企みに確信を持った
  d_main_46_af_02_144:
    speaker: "<Narration>"
    en: He was convinced if he killed Dorothy before she brought ruin to the Ark,
      his standing would solidify for good.
    ko: |-
      방주에 위기를 가져올 도로시를 처단하면,
      자신의 입지가 더욱 견고해질 것이라는 확신이 들었다.
    ja: |-
      アークに危機をもたらそうとしている
      ドロシーを始末できれば、
      もう一度自分の立場を固められる
  d_main_46_af_02_145:
    speaker: "<Narration>"
    en: Eliminating the instigator intent on destroying the Ark, right before any
      damage occurred.
    ko: |-
      방주를 파멸시키려는 주동자를,
      피해가 일어나기 직전에 처단한다.
    ja: |-
      アークを破滅させる企みを、
      事前に防がなければならない
  d_main_46_af_02_146:
    speaker: "<Narration>"
    en: Just imagining himself as the hero who averted the crisis and saved the Ark
      filled him with joy.
    ko: |-
      방주의 위기를 사전에 알아채고 차단한,
      자신의 모습을 상상만 해도 즐겁다.
    ja: |-
      アークを危機から救った自分の姿に
      想像を膨らませた
  d_main_46_af_02_147:
    speaker: "<Narration>"
    en: Doban. Guardian of the Ark.
    ko: 아아. 도반. 방주의 수호자시여.
    ja: 英雄、ドバン。アークの守護者
  d_main_46_af_02_148:
    speaker: "<Narration>"
    en: While he yet stood, peace would reign in the Ark forever.
    ko: 당신이 있기에 방주는 영원히 평화로울 것입니다.
    ja: アークの平和を永遠に守る者――
  d_main_46_af_02_149:
    speaker: dorothy
    en: Answer me...
    ko: "…대답해요."
    ja: "…答えてください。"
  d_main_46_af_02_150:
    speaker: dorothy
    en: How do you know any of this?
    ko: 그걸 어떻게 알고 있냐고요.
    ja: どこでその話を聞いたのです。
  d_main_46_af_02_151:
    speaker: doban
    en: Everybody in the Ark knows it.
    ko: 방주에 그걸 모르는 사람은 없다.
    ja: アークに知らない者などいない。
  d_main_46_af_02_152:
    speaker: doban
    en: Why would you think I wouldn't know?
    ko: 왜 모를 거라 생각하지?
    ja: まさか、分からないとでも思っていたのか？
  d_main_46_af_02_153:
    speaker: doban
    en: And, I know your motives too.
    ko: 그리고, 네 목적도.
    ja: お前の目的までお見通しだ。
  d_main_46_af_02_154:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_155:
    speaker: doban
    en: Goddess Squad. The Goddess of Victory. Humanity's hope.
    ko: |-
      갓데스 스쿼드.
      승리의 여신. 인류의 희망.
    ja: |-
      ゴッデス部隊。
      勝利の女神。人類の希望。
  d_main_46_af_02_156:
    speaker: doban
    en: To think that you, one of those legendary Nikkes, could have fallen this far...
      Pathetic.
    ko: 그 전설의 니케 중 하나인 네가 이렇게 타락했을 줄이야, 안타깝군.
    ja: |-
      伝説に名を連ねたニケが、
      こんな落ちぶれ方をするとは。
      実に残念だ。
  d_main_46_af_02_157:
    speaker: doban
    en: We will never hand the Ark over.
    ko: 방주는 절대 넘겨줄 수 없다.
    ja: アークは絶対に渡さん。
  d_main_46_af_02_158:
    speaker: dorothy
    en: "... I see. So you knew everything."
    ko: "…그렇군요. 다 알고 있었군요."
    ja: "…そうですか。すべてをご存じ、と。"
  d_main_46_af_02_159:
    speaker: dorothy
    en: So, what exactly do you plan to do about it?
    ko: 그래서. 뭘 어떻게 할 생각이시죠?
    ja: それで、どうするおつもりですか？
  d_main_46_af_02_160:
    speaker: doban
    en: Isn't it obvious? I eliminate the outsider who is trying to throw the Ark
      into chaos.
    ko: |-
      뻔하지 않나.
      방주의 민심을 어지럽히고, 위협하는 이방인을 처단한다.
    ja: |-
      決まっている。
      人々を混乱に陥れ、アークに危険を
      もたらさんとする侵入者を処断する。
  d_main_46_af_02_161:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_162:
    speaker: dorothy
    en: Just one question.
    ko: 하나만 묻죠.
    ja: 1つだけ聞いておきましょう。
  d_main_46_af_02_163:
    speaker: dorothy
    en: Why did you abandon us?
    ko: 왜 우릴 버렸나요?
    ja: 私たちはなぜ捨てられたのですか？
  d_main_46_af_02_164:
    speaker: doban
    en: What are you talking about? You're the ones who abandoned the Ark.
    ko: |-
      무슨 소리지?
      너희가 방주를 버리지 않았나.
    ja: |-
      何を言っている？
      お前たちがアークを捨てたのだろう。
  d_main_46_af_02_165:
    speaker: dorothy
    en: "... What did you say?"
    ko: "…뭐라고요?"
    ja: "…どういう意味です？"
  d_main_46_af_02_166:
    speaker: doban
    en: The Goddess Squad demanded far too much.
    ko: 너희 갓데스 스쿼드는 너무 과한 것을 요구했다.
    ja: |-
      お前たちゴッデス部隊は、
      度の過ぎた要求をした。
  d_main_46_af_02_167:
    speaker: doban
    en: You wanted half of the Ark and the seat of supreme authority.
    ko: 방주의 절반을 요구했고, 최고 권력자의 자리를 요구했다.
    ja: |-
      最高権力者の座と、
      アークの半分にも等しいものを望んだ。
  d_main_46_af_02_168:
    speaker: doban
    en: Free control over military forces and unlimited access to resources.
    ko: 병력의 자유로운 운용을 요구했고, 끝없는 자원을 요구했다.
    ja: |-
      無制限の兵力指揮権と
      資源の使用権もそのうちだ。
  d_main_46_af_02_169:
    speaker: doban
    en: You didn't care what happened to the citizens. All you did was constantly
      demand things to serve your own interests.
    ko: |-
      방주의 시민들이 어떻게 되든 관심 없었고,
      너희들의 잇속을 챙기기 위한 것을 요구했다. 끊임없이.
    ja: |-
      アークの人々の暮らしなど考えもせず、
      己の利益ばかりを考えた。
  d_main_46_af_02_170:
    speaker: doban
    en: You even threatened us with force! Fortunately, the Ark was strong enough
      to withstand your assault!
    ko: |-
      무력까지 써가면서 협박하지 않았나!
      그걸 방주의 힘으로 막아낸 것이고!
    ja: |-
      武力を盾に脅迫までした！
      アークはそれに立ち向かった！
  d_main_46_af_02_171:
    speaker: doban
    en: And when defeated, all of you fled the Ark with your tails tucked between
      your legs.
    ko: 그렇게 패배한 너희는 방주를 벗어나, 도망간 것이 아닌가!
    ja: |-
      そしてお前たちは敗れ、
      アークから逃げ去ったのだろうが！
  d_main_46_af_02_172:
    speaker: doban
    en: Despite all that, to honor your contributions, the Ark elevated you to myth,
      enshrined you in monuments, and passed down your legend through the generations...!
    ko: |-
      그럼에도 너희의 활약을 기리기 위해 신화로 격상해,
      곳곳에 상징물은 물론 전설로서 전승되게 만든…!
    ja: |-
      それでも、活躍をたたえて
      各地に像が建てられ、
      伝説を語り継いでいるというのに…！
  d_main_46_af_02_173:
    speaker: doban
    en: Instead of gratitude toward the Ark, this is how you repay us?!
    ko: 방주에게 고마워하지는 못할망정 이 무슨 행패인가!
    ja: |-
      アークに感謝しろとは言わんが、
      大した横暴ぶりだ！
  d_main_46_af_02_174:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_175:
    speaker: dorothy
    en: Have you ever seen us in person?
    ko: 당신. 우릴 직접 본 적이 있나요?
    ja: あなた…当時の私たちを直接見たことは？
  d_main_46_af_02_176:
    speaker: doban
    en: No. I was born in the Ark.
    ko: "…없다. 난 방주 출신이다."
    ja: "…いいや。私はアークで生まれた。"
  d_main_46_af_02_177:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_178:
    speaker: dorothy
    en: Ahh. I see.
    ko: 아아. 그럼.
    ja: ああ…そうでしたか。
  d_main_46_af_02_179:
    speaker: dorothy
    en: So that's how they recorded it.
    ko: "[그렇게 되어 있는] 거군요."
    ja: "「そういうことにされた」のですね。"
  d_main_46_af_02_180:
    speaker: doban
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_02_181:
    speaker: "<Narration>"
    en: Doban knows the whole truth.
    ko: |-
      도반은 알고 있다.
      모든 진실을 알고 있다.
    ja: |-
      実際のところ…
      ドバンは真実を知っていた
  d_main_46_af_02_182:
    speaker: "<Narration>"
    en: He knows the author of the Forbidden Library foresaw what fate awaited the
      Goddess Squad upon entering the Ark.
    ko: 방주로 들어온 갓데스 스쿼드가 어떤 꼴을 당하게 될 줄 알았던 금서고의 집필자가
    ja: |-
      禁書庫の資料の著者は
      ゴッデス部隊がアークに戻れば
      どのような目に遭うか知っていたこと
  d_main_46_af_02_183:
    speaker: "<Narration>"
    en: He knows they took on the role of villain, to prevent the Goddesses from being
      forgotten. And he knows why the Goddesses ended up the way they did.
    ko: |-
      갓데스의 퇴색을 막고자 악역을 자처한 것을 알고 있다.
      갓데스가 왜 그렇게 되었는지 알고 있다.
    ja: |-
      資料の著者がそれを防ぐために
      あえて憎まれ役を買ってでたこと、
      ゴッデスがそこに至る物語までも
  d_main_46_af_02_184:
    speaker: "<Narration>"
    en: But he doesn't say anything.
    ko: 하지만 말하지 않는다.
    ja: だが、ドバンが口に出すことはない
  d_main_46_af_02_185:
    speaker: "<Narration>"
    en: What matters now is for him, the Ark's Deputy Chief, to take down the outsider
      blinded by revenge and earn his merit.
    ko: 지금 중요한 건, 복수심에 눈먼 이방인을 방주의 부사령관이 잡아내 공을 세우는 것이다.
    ja: |-
      ドバンの目的は、
      復讐に目がくらんだ侵入者を捕らえ、
      副司令官としての功績にすること
  d_main_46_af_02_186:
    speaker: "<Narration>"
    en: So he must provoke Dorothy into giving him what he wants.
    ko: 도로시를 자극해, 원하는 것을 얻어내야 한다.
    ja: |-
      望むものを手に入れるためには、
      ドロシーを激昂させる必要があるのだ
  d_main_46_af_02_187:
    speaker: doban
    en: All units! This Pilgrim has spread misinformation and incited unrest in the
      Ark! I want her captured alive!
    ko: 전원! 방주에 헛소문을 퍼트려 민심을 어지럽히는 이 필그림을 반드시 생포해라!
    ja: |-
      諸君！アークに混乱を撒き、
      人々を混乱させたピルグリムだ、
      必ず捕らえろ！
  d_main_46_af_02_188:
    speaker: doban
    en: We must keep the Ark safe! We cannot allow an outsider to ruin everything
      we've built!
    ko: |-
      방주를 지켜라!
      우리가 지금껏 쌓아온 것을 이방인이 망치게 두지 말아라!
    ja: |-
      アークを守れ！
      我々が今まで積み上げてきたものを
      破壊させるな！
  d_main_46_af_02_189:
    speaker: dorothy
    en: You really do have a way with words.
    ko: 잘도 말하는군요.
    ja: 口は達者なようですね。
  d_main_46_af_02_190:
    speaker: "<Narration>"
    en: It's a battle of falsehood against falsehood.
    ko: 거짓말과 거짓말의 싸움이다.
    ja: |-
      ドロシーの頭の中で
      嘘と嘘が化学反応を起こす
  d_main_46_af_02_191:
    speaker: "<Narration>"
    en: If the official narrative regarding the Goddess Squad is as Doban says, then
      Burningum's passive treatment of her makes sense. But it doesn't matter.
    ko: 도반의 말대로 갓데스의 행보가 [그렇게 되어 있다]면 버닝엄이 왜 그렇게 소극적으로 자신을 대했는지 이해된다. 하지만 상관없다.
    ja: |-
      ドバンの言った通り、ゴッデスが
      「そういうこと」にされているなら、
      バーニンガムの態度もつじつまが合う
  d_main_46_af_02_192:
    speaker: "<Narration>"
    en: The people whom Dorothy must appeal to are not those in power, but the Nikkes
      and the ordinary citizens.
    ko: 도로시가 흔들어야 하는 것은 권력자가 아닌 니케와 시민이다.
    ja: |-
      しかし関係ない。
      ドロシーが揺さぶろうとしているのは
      権力者たちではなくニケと群衆
  d_main_46_af_02_193:
    speaker: "<Narration>"
    en: Dorothy holds irrefutable proof that the Queen has descended.
    ko: 도로시는 퀸이 강림했다는 결정적이고도 바꿀 수 없는 사실을 쥐고 있다.
    ja: |-
      そしてクイーンの降下は、
      決定的で揺るがぬ事実だ
  d_main_46_af_02_194:
    speaker: "<Narration>"
    en: Whatever Doban says about Dorothy's true intentions will crumble before the
      undeniable physical disaster looming ahead.
    ko: 도반이 떠드는 도로시의 [진의] 따위는 눈앞에 닥칠 물리적 재앙 앞에서는 힘없이 무너질 뿐이다.
    ja: |-
      ドバンがドロシーの陰謀を叫んだところで、
      眼前に迫る物理的な災厄の前では
      何の力も持たない
  d_main_46_af_02_195:
    speaker: "<Narration>"
    en: Both lies will come to light one day, but Dorothy is confident in her victory.
    ko: 두 거짓말은 언젠가 도마 위에 오르겠지만, 도로시는 승리를 자신한다.
    ja: |-
      どちらの嘘も、いずれは露見するだろう。
      しかしドロシーは勝利を確信していた
  d_main_46_af_02_196:
    speaker: "<Narration>"
    en: If the truth is great enough, even the small lies mixed into it have a way
      of becoming the truth.
    ko: 거대한 진실이 있다면 그 과정에 섞인 작은 거짓말들조차 진실로 둔갑하기 마련이니까.
    ja: |-
      あまりにも巨大な真実の前では
      その過程で混ぜられた些細な嘘さえ
      真実に化けてしまうものだ
  d_main_46_af_02_197:
    speaker: "<Narration>"
    en: To ensure that she'll come out on top when that decisive moment arrives, Dorothy
      decides she must first control public sentiment.
    ko: 그 순간이 왔을 때 완벽하게 승기를 잡기 위해, 도로시는 무엇보다 민심을 장악해야 한다고 판단했다.
    ja: |-
      その瞬間に完璧な勝利を遂げるため、
      今は群衆の心をつかんでおく必要があると
      ドロシーは判断した
  d_main_46_af_02_198:
    speaker: "<Narration>"
    en: Dorothy once again cuts through the mass-produced Nikkes.
    ko: 도로시가 다시 양산형 니케들 사이를 헤집는다.
    ja: |-
      ドロシーは再び
      量産型ニケの隊列に飛び込んだ
  d_main_46_af_02_199:
    speaker: "<Narration>"
    en: "'Escaping would be easy, as would subduing them.'"
    ko: |-
      이 상황을 벗어나는 건 쉬운 일이다.
      제압하는 것 또한 쉬운 일이다.
    ja: |-
      この程度の状況、
      逃げることも制圧することも
      彼女には容易なことだ
  d_main_46_af_02_200:
    speaker: "<Narration>"
    en: "'But I needs to come off as the victim, since the public tends to side with
      the weak.'"
    ko: |-
      하지만 피해자인 척을 할 필요가 있다.
      대중은 약자의 편이다.
    ja: |-
      だが、この場は被害者を演じる必要がある。
      大衆は弱者にひいきをするものだからだ
  d_main_46_af_02_201:
    speaker: "<Narration>"
    en: "'I'll give them just enough of a fight and take some hits. But under no circumstances
      can I use my gun, and there must be absolutely no casualties.'"
    ko: |-
      적당히 상대해 주고, 피해를 입자.
      총은 절대 쓰지 말고, 절대 사망자가 나와선 안 된다.
    ja: |-
      適当に戦いを演じて、若干の傷を負う。
      銃は使わず、死傷者も出してはならない
  d_main_46_af_02_202:
    speaker: "<Narration>"
    en: "'I must appear as someone targeted by the Central Government for telling
      the truth.'"
    ko: 나는 어디까지나 진실을 말한 대가로, 중앙 정부에게 보복을 당하는 입장이어야 한다.
    ja: |-
      真実を伝えたために、
      中央政府の報復を受けたという
      形へ持っていくべきだ
  d_main_46_af_02_203:
    speaker: "<Narration>"
    en: "'Doban's actions here will give the Nikkes and citizens the confirmation
      they need.'"
    ko: 도반의 이 행동이, 니케와 시민들에게 확신을 주게 될 것이다.
    ja: |-
      ドバンが無理に押すほど、
      ニケや群衆は確信を持つだろう
  d_main_46_af_02_204:
    speaker: "<Narration>"
    en: "'Confirmation that the Central Government has been deceiving the Ark.'"
    ko: 중앙 정부가 방주를 속이고 있다는 확신을.
    ja: 中央政府がアークの人々を欺いていると
  d_main_46_af_02_205:
    speaker: dorothy
    en: Why don't you take a nap?
    ko: 조금 자둬요.
    ja: 少しお休みください。
  d_main_46_af_02_206:
    speaker: "<Narration>"
    en: Dorothy drives her knee into the abdomen of a mass-produced Nikke.
    ko: 도로시의 무릎이 양산형 니케의 복부를 올려 친다.
    ja: ドロシーのひざが量産型ニケの腹を蹴り上げた
  d_main_46_af_02_207:
    speaker: "<Narration>"
    en: The Nikke bends at the waist and groans.
    ko: 양산형 니케의 허리가 숙여지며 신음을 내뱉는다.
    ja: 量産型ニケが体をすくめ、うめきをあげた
  d_main_46_af_02_208:
    speaker: "<Narration>"
    en: At that moment...
    ko: 그 순간
    ja: 次の瞬間
  d_main_46_af_02_209:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 퍼--엉--!!
    ja: ドカン！！
  d_main_46_af_02_210:
    speaker: "<Narration>"
    en: The mass-produced Nikke explodes, sending fragments scattering everywhere.
    ko: |-
      양산형 니케가 폭발한다.
      수많은 조각이 비산한다.
    ja: |-
      量産型ニケが爆発し、
      ボディの断片をまき散らした
  d_main_46_af_02_211:
    speaker: dorothy
    en: "...?"
    ko: "…?"
    ja: "…！？"
  d_main_46_af_02_212:
    speaker: "<Narration>"
    en: The Nikke beside her charges with a shriek and lunges at Dorothy, trying to
      grab her.
    ko: 옆의 양산형 니케가 괴성과 함께 달려들며 도로시를 잡으려 든다.
    ja: |-
      横から別の量産型ニケが奇声をあげ、
      ドロシーに飛びかかった
  d_main_46_af_02_213:
    speaker: "<Narration>"
    en: Dorothy reflexively dodges and breaks the Nikke's stance.
    ko: 도로시는 반사적으로 피한 후, 양산형 니케의 자세를 무너뜨린다.
    ja: |-
      ドロシーは反射的に攻撃をかわし、
      量産型ニケが体勢を崩した
  d_main_46_af_02_214:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 퍼--엉--!!
    ja: ドカン！！
  d_main_46_af_02_215:
    speaker: "<Narration>"
    en: The Nikke staggers, then detonates.
    ko: 양산형 니케가 휘청이다가 폭발을 일으킨다.
    ja: 体勢の崩れた量産型ニケが爆発を起こした
d_main_46_af_03:
  d_main_46_af_03_1:
    speaker: "<Narration>"
    en: Dorothy brushes a fragment of something from her face and realizes with certainty.
    ko: 도로시는 얼굴에 붙은 뭔가의 조각을 털어내며 직감했다.
    ja: |-
      ドロシーは自分の顔についた
      何かを払いながら、状況を理解した
  d_main_46_af_03_2:
    speaker: dorothy
    en: "... What a dirty trick."
    ko: "…더러운 짓을."
    ja: "…卑劣な真似を…"
  d_main_46_af_03_3:
    speaker: doban
    en: Wh-what the hell! This Pilgrim killed those Nikkes!
    ko: 이, 이런 제길! 필그림이 니케들을 죽였다!
    ja: |-
      クッ、なんということだ！
      部隊に被害発生！
  d_main_46_af_03_4:
    speaker: doban
    en: All units! Switch from suppression rounds to live ammunition!
    ko: 전원! 제압탄 사용을 그만두고 실탄으로 교체해라!
    ja: 総員、鎮圧弾の使用中止、実弾に切り替えろ！
  d_main_46_af_03_5:
    speaker: doban
    en: This Pilgrim has no intention of cooperating!
    ko: 필그림은 협조할 생각이 없다!
    ja: ピルグリムに抵抗の意志あり！
  d_main_46_af_03_6:
    speaker: "<Narration>"
    en: All the mass-produced Nikkes simultaneously replace their magazines, and fire
      at Dorothy.
    ko: |-
      모든 양산형 니케들이 일제히 탄창을 교체한 후,
      도로시를 향해 발사한다.
    ja: |-
      量産型ニケたちは一斉に弾倉を交換し、
      ドロシーに向かって射撃を始める
  d_main_46_af_03_7:
    speaker: "<Narration>"
    en: But the bullets are the same as they were before. Everything was just for
      show.
    ko: |-
      탄환은 이전과 동일하다.
      쇼맨십일 뿐이다.
    ja: |-
      実際には弾丸は変わっていない。
      そう見せかけているだけだ
  d_main_46_af_03_8:
    speaker: "<Narration>"
    en: While dodging the bullets, Dorothy glares at Doban.
    ko: 탄환을 피해내며 도로시는 도반을 노려본다.
    ja: |-
      ドロシーは銃撃をかわしながら
      ドバンをにらみつけた
  d_main_46_af_03_9:
    speaker: doban
    en: You conniving Pilgrim! You're bent on throwing the Ark into chaos, aren't
      you? But as long as I, Deputy Chief Doban, still stand, you won't succeed!
    ko: |-
      방주를 혼란에 빠뜨리려는 간사한 필그림이여!
      나 부사령관 도반이 있는 이상 그렇게는 못 한다!
    ja: |-
      アークを混乱に陥れようとする
      邪悪なピルグリムめ！
      この副司令官ドバンが、絶対にそうはさせん！
  d_main_46_af_03_10:
    speaker: "<Narration>"
    en: His stentorian shouts are clearly meant to be heard by everyone.
    ko: 누가 봐도 들으라는 듯 외쳐대는 목소리.
    ja: ドバンが、聞こえよがしに声を張りあげる
  d_main_46_af_03_11:
    speaker: "<Narration>"
    en: Dorothy feels a rage boiling from within.
    ko: 도로시는 울화가 치미는 것을 느낀다.
    ja: ドロシーはこみ上げる怒りを感じた
  d_main_46_af_03_12:
    speaker: dorothy
    en: Do you have a death wish?
    ko: 당신. 죽고 싶은 건가요?
    ja: あなた。死にたいのですか？
  d_main_46_af_03_13:
    speaker: doban
    en: You'd even lay hands on a human?!
    ko: 이젠 인간에게까지 손을 대겠다는 건가!
    ja: 人間にまで害を加える気か！？
  d_main_46_af_03_14:
    speaker: doban
    en: No matter how intensely you despise the Ark, isn't this going too far?!
    ko: 방주가 아무리 밉다지만, 너무 과하지 않은가!
    ja: |-
      どれほどアークが憎かろうと、
      限度を知らん奴め！
  d_main_46_af_03_15:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_16:
    speaker: "<Narration>"
    en: Looking at the loathsome man before her, spouting drivel.
    ko: 도로시는 지금 이 앞에서 눈에 거슬리는 말만 내뱉는 남자의
    ja: |-
      ドロシーは、目の前で
      自分の神経を逆なでし続ける男の…
  d_main_46_af_03_17:
    speaker: "<Narration>"
    en: She considers perhaps breaking one of his legs wouldn't be so bad.
    ko: 다리 하나쯤은 부러뜨려도 괜찮겠다는 생각이 들었다.
    ja: |-
      片足を折るぐらいのことはしても
      支障が出ないだろうと考えた
  d_main_46_af_03_18:
    speaker: "<Narration>"
    en: She could stage it as an accident. Make it look like he fell on his own.
    ko: 우연을 가장하고, 스스로 넘어진 것처럼 만들어서….
    ja: たまたま、自分で転ぶように仕向ければ…
  d_main_46_af_03_19:
    speaker: dorothy
    en: "...?"
    ko: "…?"
    ja: "……？"
  d_main_46_af_03_20:
    speaker: "<Narration>"
    en: "*Screeeech*"
    ko: 키이이이잉---!!
    ja: ギュイィィィン――！！
  d_main_46_af_03_21:
    speaker: "<Narration>"
    en: A mechanical sound echoes from above.
    ko: 공중에서 기계음이 들려온다.
    ja: 空から機械音が響いた
  d_main_46_af_03_22:
    speaker: "<Narration>"
    en: Dorothy looks up.
    ko: 도로시는 위를 올려다보았다.
    ja: ドロシーは空を見上げた
  d_main_46_af_03_23:
    speaker: "<Monologue>"
    en: Rapi and I land together, aboard Seven Dwarves Zero.
    ko: 라피의 세븐스 드워프 제로를 함께 타고 착지한다.
    ja: |-
      地上に降り立ったのは、
      セブンスドワーフゼロを駆るラピと私だ
  d_main_46_af_03_24:
    speaker: "<Monologue>"
    en: We assess the situation.
    ko: 상황을 파악한다.
    ja: 私はあたりの状況を確認した
  d_main_46_af_03_25:
    speaker: "<Monologue>"
    en: Fragments of fallen Nikkes lie scattered across the ground.
    ko: "…바닥에 널브러진 니케들의 파편이 보인다."
    ja: "…バラバラになったニケが転がっている"
  d_main_46_af_03_26:
    speaker: "<Self>"
    en: Dorothy...
    ko: "…도로시."
    ja: "…ドロシー"
  d_main_46_af_03_27:
    speaker: dorothy
    en: "... It wasn't me."
    ko: "…저는 아니에요."
    ja: "…私ではありません。"
  d_main_46_af_03_28:
    speaker: "<Self>"
    en: I know. I'm asking what happened.
    ko: 알아. 어쩌다 이렇게 됐는지 묻는 거야.
    ja: |-
      知っている。
      どういう状況か聞いただけだ
  d_main_46_af_03_29:
    speaker: "<Monologue>"
    en: Dorothy looks at Doban.
    ko: 도로시가 도반을 바라본다.
    ja: ドロシーがドバンに視線を向けた
  d_main_46_af_03_30:
    speaker: dorothy
    en: Were you the one who talked?
    ko: 당신이 얘기했나요?
    ja: あなたが話したのですか？
  d_main_46_af_03_31:
    speaker: "<Self>"
    en: Huh...? About what?
    ko: |-
      …?
      뭘.
    ja: "……？何のことだ？"
  d_main_46_af_03_32:
    speaker: dorothy
    en: About me. To that human.
    ko: 저에 대한 이야기를. 저 인간에게.
    ja: 私のことを、あの人間に。
  d_main_46_af_03_33:
    speaker: "<Self>"
    en: Of course not. Why would I go around talking about that so carelessly?
    ko: |-
      그럴 리가 없잖아.
      그런 얘기를 왜 함부로….
    ja: |-
      そんなことはしていない。
      軽々しく話せるものじゃないだろう…
  d_main_46_af_03_34:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_35:
    speaker: doban
    en: Ah, the Counters! The Ark's beacon of hope. You've arrived just in time!
    ko: |-
      오오! 카운터스!
      방주의 희망! 잘 왔다!
    ja: |-
      おお！カウンターズか！
      アークの希望よ！よく来てくれた！
  d_main_46_af_03_36:
    speaker: doban
    en: Pilgrim! It's over! Give up now!
    ko: 필그림! 이제 그만 포기해라!
    ja: ピルグリム！観念するがいい！
  d_main_46_af_03_37:
    speaker: dorothy
    en: Have you come to stop me?
    ko: 저를 막으러 오신 건가요?
    ja: 私を止めに来たのですか？
  d_main_46_af_03_38:
    speaker: rapi_red
    en: Yes.
    ko: 맞아.
    ja: そうね。
  d_main_46_af_03_39:
    speaker: dorothy
    en: "... I see. In the end, you're all the same..."
    ko: "…그렇군요. 결국 당신들도 똑같은-"
    ja: |-
      …そうですか。
      結局、あなたたちもあれと同じ…
  d_main_46_af_03_40:
    speaker: rapi_red
    en: It seems like your patience is wearing thin.
    ko: 곧 네 인내심이 바닥날 것 같았거든.
    ja: |-
      そろそろ、あなたのガマンに限界が
      来るんじゃないかって思ったから。
  d_main_46_af_03_41:
    speaker: rapi_red
    en: Considering how much Doban is provoking you, perhaps you were considering
      breaking his leg and staging it as an accident?
    ko: |-
      도반 부사령관이 긁어대는 걸 보니,
      조만간 우연을 가장해서 다리라도 부러뜨릴 것 같아서.
    ja: |-
      挑発するようなことを言われていたし、
      事故のふりをして足を折るぐらいは
      考え始めていたでしょう。
  d_main_46_af_03_42:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_43:
    speaker: "<Self>"
    en: I don't know how things got to this point, but I think we should talk things
      over first.
    ko: |-
      일이 어쩌다 이렇게 됐는지는 모르겠지만,
      일단 얘기를 나눠보는 쪽이 좋겠어.
    ja: |-
      どうしてこうなっているかは分からないが
      ひとまず話をした方がいい
  d_main_46_af_03_44:
    speaker: dorothy
    en: That is what I intended, but the other side does not seem so amenable to the
      idea.
    ko: 저는 그럴 생각이었는데, 저쪽은 그럴 생각이 없는 것 같군요.
    ja: |-
      私はそのつもりでしたが、
      あちらにその気がないようなので。
  d_main_46_af_03_45:
    speaker: doban
    en: "... What? Hey, you! Aren't you here to back us up?"
    ko: "…뭐라고? 네놈. 우릴 지원하러 온 게 아닌가?"
    ja: |-
      …どういうことだ？貴様…
      援護に来たのではないのか？
  d_main_46_af_03_46:
    speaker: "<Self>"
    en: No. We came to take Dorothy with us.
    ko: |-
      아닙니다.
      도로시를 데려가려고 왔습니다.
    ja: |-
      そうではありません。
      ドロシーの確保に来ました
  d_main_46_af_03_47:
    speaker: doban
    en: You fool! Take a good look at this carnage! That Pilgrim has already killed
      two of my precious Nikkes! Invaluable assets to the Ark!
    ko: |-
      이놈! 지금 이 참사를 잘 봐라!
      필그림이 내 소중한! 방주의 재산인 니케를 벌써 둘이나 죽였다!
    ja: |-
      貴様！この惨状が見えていないのか！？
      そのピルグリムは！アークの財産でもある
      私の部下を2体も殺したのだぞ！
  d_main_46_af_03_48:
    speaker: "<Self>"
    en: That's impossible. Dorothy doesn't use explosives.
    ko: |-
      그럴 리가 없습니다.
      도로시는 폭발 병기를 사용하지 않습니다.
    ja: |-
      それは奇妙ですね。
      ドロシーはそんな武装をしていません
  d_main_46_af_03_49:
    speaker: doban
    en: "...!"
    ko: "……!"
    ja: "……！"
  d_main_46_af_03_50:
    speaker: "<Self>"
    en: It looks to me that those Nikkes exploded from the inside out.
    ko: 사망한 니케들은… 내부에서 폭발한 것 같은 모습입니다.
    ja: |-
      それに、犠牲になったニケは…
      内側から爆発しているようです
  d_main_46_af_03_51:
    speaker: "<Self>"
    en: As if someone planted bombs in them beforehand.
    ko: 꼭, 누가 미리 폭탄을 심어놓은 것 같군요.
    ja: |-
      あらかじめ爆弾を
      仕込まれていた可能性が高い
  d_main_46_af_03_52:
    speaker: doban
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_53:
    speaker: doban
    en: You idiot! A little success and suddenly you can't see what's right in front
      of you.
    ko: 네놈. 조금 잘나간다 싶으니 눈에 보이는 게 없나 보군.
    ja: |-
      貴様。少し活躍したからと
      思いあがっているようだな。
  d_main_46_af_03_54:
    speaker: doban
    en: This Pilgrim is set on overturning the Ark, and you're defending her?
    ko: 방주를 전복시키려 하는 필그림을 두둔하는 건가.
    ja: |-
      アークの破滅を企てる
      ピルグリムの肩を持つ気か？
  d_main_46_af_03_55:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_56:
    speaker: "<Self>"
    en: Yes. I am siding with Dorothy.
    ko: |-
      그렇습니다.
      도로시를 두둔합니다.
    ja: |-
      そうです。
      私はドロシーを信じます
  d_main_46_af_03_57:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_46_af_03_58:
    speaker: doban
    en: You traitor! You have no idea what she's really capable of!
    ko: |-
      이 반역자 놈!
      네놈은! 저것의 본성을 모른다!
    ja: |-
      反逆者め！
      貴様は！そいつの本性を知らないだけだ！
  d_main_46_af_03_59:
    speaker: "<Self>"
    en: I would say I know her better than you do, Deputy Chief.
    ko: |-
      …적어도 당신보다는 잘 안다고 생각합니다.
      부사령관님.
    ja: |-
      …少なくとも、あなたよりは
      知っているはずです、副司令官
  d_main_46_af_03_60:
    speaker: doban
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_46_af_03_61:
    speaker: doban
    en: Filthy traitors, the lot of you!
    ko: 이 더러운 반역자 놈들이…!
    ja: 汚らわしい反逆者どもめ…！
  d_main_46_af_03_62:
    speaker: doban
    en: I'll see you all court-martialed and hanged!
    ko: 내가 반드시 군법회의에서 네놈을 매달고 말겠다!
    ja: このことは必ず軍法会議にかけてやる！
  d_main_46_af_03_63:
    speaker: doban
    en: You say I don't know her true colors? It's you who doesn't!
    ko: |-
      내가 저것의 본성을 모른다고?
      모르는 건 네놈이다!
    ja: |-
      私がそいつの本性を知らないだと？
      知らないのは貴様の方だ！
  d_main_46_af_03_64:
    speaker: doban
    en: I'll show you what kind of creature that Pilgrim really is!
    ko: 저 필그림이 어떤 놈인지! 보여주마!
    ja: 見たいと言うなら！見せてやる！
  d_main_46_af_03_65:
    speaker: doban
    en: Come out!
    ko: 나와라!
    ja: 出せ！
  d_main_46_af_03_66:
    speaker: "<Monologue>"
    en: At Doban's gesture, the formation parts.
    ko: 도반이 손짓하자, 대열이 갈라진다.
    ja: |-
      ドバンが合図をすると、
      取り囲んでいたニケの隊列が二手に割れた
  d_main_46_af_03_67:
    speaker: "<Monologue>"
    en: Numerous mass-produced Nikkes step forward.
    ko: 다수의 양산형 니케들이 앞으로 나선다.
    ja: 別の量産型ニケの軍団がその奥から現れた
  d_main_46_af_03_68:
    speaker: "<Monologue>"
    en: They are all Product 23 model Nikkes.
    ko: 프로덕트 23 모델인 양산형 니케들이다.
    ja: 全員プロダクト23モデルのようだ
  d_main_46_af_03_69:
    speaker: "<Monologue>"
    en: All of them remove their visors to reveal familiar necklaces around their
      necks.
    ko: "…모두, 바이저를 벗고 익숙한 목걸이를 착용하고 있다."
    ja: |-
      …だが、バイザーを装着しておらず、
      代わりにどこかで見た首飾りを提げている
  d_main_46_af_03_70:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_71:
    speaker: rapi_red
    en: No way.
    ko: 설마.
    ja: まさか…
  d_main_46_af_03_72:
    speaker: "<Monologue>"
    en: Memories from aboard the Utopia come rushing back to me.
    ko: "…유토피아 호에서의 기억이 떠오른다."
    ja: "…ユートピア号の記憶がよみがえる"
  d_main_46_af_03_73:
    speaker: "<Monologue>"
    en: The image that held Dorothy captivated. A name surfaces.
    ko: 도로시가 사로잡혔던, 그 모습. 그 이름이 떠오른다.
    ja: |-
      ドロシーが囚われていた光景。
      その時に聞いた名前
  d_main_46_af_03_74:
    speaker: "<Self>"
    en: "... Pinne."
    ko: "…피나."
    ja: "…ピナ"
  d_main_46_af_03_75:
    speaker: "<Monologue>"
    en: No. Something is different. The mass-produced Nikkes who have stepped forward
      each wear anxious expressions.
    ko: |-
      아니다. 다르다.
      앞으로 나선 양산형 니케들은 저마다 불안한 표정을 짓고 있다.
    ja: |-
      いや、そうではない。
      出てきた量産型ニケたちは
      不安げな表情をしている
  d_main_46_af_03_76:
    speaker: "<Monologue>"
    en: They glance around nervously, their gazes wavering.
    ko: 눈치를 보고, 시선이 흔들린다.
    ja: あたりの様子をうかがい、視線を泳がせている
  d_main_46_af_03_77:
    speaker: "<Monologue>"
    en: They're all individuals Nikkes.
    ko: 각자 다른 니케들일 뿐인다.
    ja: どれも本人ではない
  d_main_46_af_03_78:
    speaker: "<Monologue>"
    en: They cautiously turn their eyes toward Dorothy.
    ko: 시선을 조심히 돌려, 도로시를 바라본다.
    ja: 視線を移し、ドロシーの様子をうかがった
  d_main_46_af_03_79:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_80:
    speaker: "<Monologue>"
    en: Up until now...
    ko: "…지금껏."
    ja: "…今まで…"
  d_main_46_af_03_81:
    speaker: "<Monologue>"
    en: I've never seen Dorothy wear that expression.
    ko: 도로시의 이런 표정을 본 적이 있었던가.
    ja: |-
      こんな表情のドロシーを
      見たことがあっただろうか…
  d_main_46_af_03_82:
    speaker: "<Narration>"
    en: Seeing Dorothy's face, Doban celebrates inwardly.
    ko: 도로시의 표정을 본 도반은 마음속으로 쾌재를 불렀다.
    ja: |-
      ドロシーの表情を見たドバンは
      心の中で歓喜していた
  d_main_46_af_03_83:
    speaker: "<Narration>"
    en: The name he heard spoken through the wiretap while Dorothy was aboard the
      Utopia. Pinne.
    ko: 유토피아 호에서의 도청으로 들었던 이름. 피나.
    ja: |-
      海上探索の時にしかけた盗聴器で
      聞きとれた「ピナ」という言葉
  d_main_46_af_03_84:
    speaker: "<Narration>"
    en: The same one confirmed in the book from the Forbidden Library. Pinne.
    ko: 금서고에서 얻은 책에서 확인한 이름. 피나.
    ja: 禁書庫の資料にあった「ピナ」の名前
  d_main_46_af_03_85:
    speaker: "<Narration>"
    en: Whoever this Pinne is, she's clearly someone important to Dorothy.
    ko: 모르긴 몰라도 피나라는 니케는 도로시에게 중요한 존재일 것이 확실하다.
    ja: |-
      詳細は不明だが、それがドロシーにとって
      大切な存在であることは確信できた
  d_main_46_af_03_86:
    speaker: "<Narration>"
    en: So he dug through old records to learn everything he could about Pinne.
    ko: 오래된 자료를 뒤적거려 피나의 모든 정보를 알아낸다.
    ja: |-
      古い資料を漁り、
      ピナに関わるあらゆる情報を集めた
  d_main_46_af_03_87:
    speaker: "<Narration>"
    en: Fortunately, the book from the Forbidden Library even detailed her final demise.
    ko: |-
      그녀의 최후가 어땠는지까지 찾아낸다.
      다행히, 금서고에 있던 책에 그 내용이 있었다.
    ja: |-
      彼女の最期の様子は、
      禁書庫の資料に残されていた
  d_main_46_af_03_88:
    speaker: "<Narration>"
    en: From there, he mobilized as many Product 23 models as possible.
    ko: 프로덕트 23 모델을 최대한 동원했다.
    ja: |-
      手当たり次第に
      プロダクト23モデルを寄せ集め…
  d_main_46_af_03_89:
    speaker: "<Narration>"
    en: He prepared and equipped them with the same necklace seen in the photo.
    ko: 사진에 보였던 목걸이를 준비하고, 장착시킨다.
    ja: 写真に映っていたネックレスを着用させてあった
  d_main_46_af_03_90:
    speaker: "<Narration>"
    en: Now he'll send them hurtling toward Dorothy, then kill them all.
    ko: 그리고 이들을 도로시에게 돌격시킨 후, 죽인다.
    ja: 彼女たちをドロシーにけしかけ、殺させる
  d_main_46_af_03_91:
    speaker: "<Narration>"
    en: If Dorothy becomes angry, good. If she loses reason, even better.
    ko: 도로시가 화내면 좋다. 이성을 잃으면 더 좋다.
    ja: |-
      ドロシーが怒るほど都合がいい。
      理性を失えばさらにいい
  d_main_46_af_03_92:
    speaker: "<Narration>"
    en: If she comes charging at him to kill him, it'll be perfect.
    ko: 자신을 죽이러 달려들면 더욱더 좋다.
    ja: 自分を殺しに飛びかかってくるなら最高だ
  d_main_46_af_03_93:
    speaker: "<Narration>"
    en: In that moment, she'll become the Ark's public enemy number one.
    ko: |-
      그 순간, 도로시는 극악무도한.
      방주의 적이 된다.
    ja: |-
      その瞬間、ドロシーは極悪非道な
      アークの敵となる
  d_main_46_af_03_94:
    speaker: "<Narration>"
    en: The Nikkes at his side are equipped with energy shields rated against optical
      weapons.
    ko: 곁에서 호위하는 니케들에게 광학 병기용 에너지 실드를 장비해 놓는다.
    ja: |-
      護衛のニケには対光学兵器用の
      エネルギーシールドを持たせてある
  d_main_46_af_03_95:
    speaker: "<Narration>"
    en: Dorothy uses optical weapons, favoring precision low-output shots over high-output
      ones.
    ko: |-
      도로시는 광학 병기를 사용한다.
      또 한, 고출력보다는 저출력의 정밀 사격을 선호한다.
    ja: |-
      ドロシーが光学兵器を使うこと、
      爆発的高火力よりも、低出力の精密射撃を
      重んじることまで把握している
  d_main_46_af_03_96:
    speaker: "<Narration>"
    en: The shields should hold against her shots well enough.
    ko: 충분히 막아낼 수 있다.
    ja: 十分に防げる計算だ
  d_main_46_af_03_97:
    speaker: "<Narration>"
    en: And in the process, Dorothy's weakness will become fully exposed.
    ko: 그리고 그 과정에서, 도로시의 위험도가 그대로 드러난다.
    ja: |-
      過程はどうあれ銃が抜かれさえすれば、
      ドロシーが危険人物である証拠になる
  d_main_46_af_03_98:
    speaker: "<Narration>"
    en: After that, everything will fall into place. He'll take down Dorothy, the
      Pilgrim with unclear motives who poses a clear threat.
    ko: |-
      이후는 일사천리다.
      목적이 불분명한 데다 위험하기까지 한 필그림인 도로시를 잡는다.
    ja: |-
      あとは簡単だ。
      目的不明の危険な侵入者、ドロシーを始末する
  d_main_46_af_03_99:
    speaker: "<Narration>"
    en: It will be easy to frame her for attempting to overthrow the Ark, especially
      because she's a well-known Pilgrim.
    ko: |-
      방주 전복을 꾀하고 있었다고 덮어씌우는 건 쉬운 일이다.
      필그림이기에, 유명하기에 더욱 쉽다.
    ja: |-
      アークの転覆を企んでいたと
      でっち上げるのは簡単だ。
      過去を持つ英雄ならば、なおさらのこと
  d_main_46_af_03_100:
    speaker: "<Narration>"
    en: Then Doban will be recognized for his efforts. For saving the Ark from danger.
    ko: |-
      그럼 도반은 공적이 생긴다.
      방주를 위험에서 구해낸 공적이 생긴다.
    ja: |-
      そうすれば、全てはドバンが
      アークを危機から救ったという功績となる
  d_main_46_af_03_101:
    speaker: "<Narration>"
    en: He recalls Dorothy's reaction earlier.
    ko: 좀 전. 도로시의 반응을 다시 한번 상기한다.
    ja: ドバンはドロシーの反応を確かめた
  d_main_46_af_03_102:
    speaker: "<Narration>"
    en: Drunk on the feeling of victory, Doban smiles for the first time in a while.
    ko: 도반은 승리감에 취해, 오랜만에 미소를 지었다.
    ja: |-
      勝利を確信したドバンの顔には
      いつぶりかも分からない笑みが浮かんでいた
  d_main_46_af_03_103:
    speaker: "<Monologue>"
    en: I don't fully understand the relationship between Pinne and Dorothy.
    ko: 피나와 도로시의 관계에 대해서는 잘 모른다.
    ja: |-
      ピナとドロシーの関係について、
      私はよく知らない
  d_main_46_af_03_104:
    speaker: "<Monologue>"
    en: Even so, one thing is certain. Pinne is more precious to Dorothy than anyone
      else.
    ko: "그럼에도 한 가지 확실한 건, \n피나는 도로시에게 그 누구보다 소중한 존재였다는 것 뿐이다."
    ja: |-
      ひとつだけ確かなことは、
      ピナがドロシーにとって
      誰より大切な存在だったということだ
  d_main_46_af_03_105:
    speaker: "<Monologue>"
    en: And the image of that very person... is standing before her now.
    ko: "…그 대상이, 지금 눈앞에 있다."
    ja: "…それに似せたものが、目の前に立っている"
  d_main_46_af_03_106:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_107:
    speaker: "<Monologue>"
    en: This is an act of desecration.
    ko: 이건 모독이다.
    ja: 侮辱であり挑発だ
  d_main_46_af_03_108:
    speaker: "<Monologue>"
    en: A vile one at that.
    ko: 지독한 모독이다.
    ja: ドロシーにとって耐えがたい冒涜
  d_main_46_af_03_109:
    speaker: "<Monologue>"
    en: It is trampling with muddy feet into the sacred space of a stranger's cherished
      memories.
    ko: |-
      잘 알지도 못하는 누군가의 기억이라는 소중한 공간을,
      흙발로 들어와 마구 짓밟는 행위다.
    ja: |-
      誰かの大切な記憶を
      土足で踏み荒らすような行いだ
  d_main_46_af_03_110:
    speaker: doban
    en: "... Go."
    ko: "…가라."
    ja: "…行け。"
  d_main_46_af_03_111:
    speaker: "<Monologue>"
    en: A mass-produced Nikke resembling Pinne hesitates, then runs forward.
    ko: 피나와 닮은 양산형 니케가 머뭇대다 달려온다.
    ja: |-
      ピナに似せられた量産型ニケが
      ためらいながら近づいてくる
  d_main_46_af_03_112:
    speaker: "<Monologue>"
    en: She spreads her arms toward Dorothy and forces a smile.
    ko: 도로시를 향해 양팔을 벌리며, 억지로 웃는다.
    ja: |-
      ドロシーに向かって両腕を広げ、
      ひきつった笑みを浮かべて
  d_main_46_af_03_113:
    speaker: "<Monologue>"
    en: Dorothy stands frozen, staring blankly at the sight before her.
    ko: 도로시는 굳은 채, 그 모습을 멍하니 바라보고 있다.
    ja: |-
      ドロシーは身動きもせず
      その様子を直視していた
  d_main_46_af_03_114:
    speaker: "<Monologue>"
    en: The Nikke approaches.
    ko: 양산형 니케가 다가온다.
    ja: 近づいてきた量産型ニケは…
  d_main_46_af_03_115:
    speaker: pinneimitating
    en: D-Dorothy...
    ko: 도, 도로시 님~
    ja: ド、ドロシー様～
  d_main_46_af_03_116:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 퍼--엉--!!
    ja: ドカン！！
  d_main_46_af_03_117:
    speaker: "<Monologue>"
    en: And she explodes.
    ko: 그리고, 폭사한다.
    ja: 爆発した
  d_main_46_af_03_118:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_03_119:
    speaker: "<Self>"
    en: R-Rapi...
    ko: "…라, 라피."
    ja: "…ラピ…"
  d_main_46_af_03_120:
    speaker: "<Self>"
    en: Rapi! Rapi!!
    ko: 라피! 라피---!!
    ja: ラピ！今すぐ――！！
  d_main_46_af_03_121:
    speaker: rapi_red
    en: Roger. Putting a bullet in that bastard's head now.
    ko: 라져. 당장 더 빌어먹을 자식의 머리를 꿰뚫어버리겠습니다.
    ja: ラジャー。あの男の頭を――
  d_main_46_af_03_122:
    speaker: "<Self>"
    en: Subdue Dorothy!
    ko: 도로시를 잡아!!
    ja: 違う、ドロシーを止めろ！！
  d_main_46_af_03_123:
    speaker: rapi_red
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_af_03_124:
    speaker: "<Monologue>"
    en: Dorothy draws her gun.
    ko: 도로시가 총을 꺼내 든다.
    ja: ドロシーが銃を抜いている
  d_main_46_af_03_125:
    speaker: "<Monologue>"
    en: She aims it directly at Doban.
    ko: 도반을 향해 겨눈다.
    ja: 銃口がドバンに向けられた
  d_main_46_af_03_126:
    speaker: "<Monologue>"
    en: Rapi rushes in and grabs Dorothy's gun.
    ko: 라피가 달려들어 도로시의 총을 잡고 늘어진다.
    ja: 割り込んだラピが、ドロシーの銃をつかんだ
  d_main_46_af_03_127:
    speaker: dorothy
    en: Let go.
    ko: "…놔."
    ja: "…放して…"
  d_main_46_af_03_128:
    speaker: rapi_red
    en: Wait...!
    ko: 기다… 려…!
    ja: 待っ…落ち着いて…！
  d_main_46_af_03_129:
    speaker: "<Self>"
    en: Fall back!
    ko: 이탈!
    ja: 離脱しろ！
  d_main_46_af_03_130:
    speaker: rapi_red
    en: Roger!
    ko: 라져!
    ja: ラジャー！
  d_main_46_af_03_131:
    speaker: dorothy
    en: Let go, I said!
    ko: 놔!!
    ja: 放して！！
  d_main_46_af_03_132:
    speaker: "<Monologue>"
    en: Seven Dwarves Zero activates, and Rapi withdraws from the area with Dorothy
      in tow.
    ko: |-
      세븐스 드워프 제로가 가동된다.
      도로시와 함께 구역을 이탈한다.
    ja: |-
      セブンスドワーフゼロがバーニアを吹き、
      ドロシーごと飛び去った
  d_main_46_af_03_133:
    speaker: "<Monologue>"
    en: I glare at Doban.
    ko: 나는 도반을 바라본다.
    ja: 私はドバンに向き直った
  d_main_46_af_03_134:
    speaker: doban
    en: You fool! What do you think you're doing?!
    ko: 네 이놈…! 지금 뭐 하는 짓이냐…!
    ja: 貴様…！どういうつもりだ…！
  d_main_46_af_03_135:
    speaker: doban
    en: Traitorous scum...! How dare you protect the Ark's enemy!
    ko: 반역자 놈…! 감히 방주의 적을 보호하는 것-
    ja: |-
      反逆者が…！
      アークの敵にくみするような真似を…
  d_main_46_af_03_136:
    speaker: "<Self>"
    en: You... Don't expect your death to be clean.
    ko: "…너. 곱게 죽을 생각은 하지 마라."
    ja: "…お前こそ、ただで済むと思うな"
  d_main_46_af_03_137:
    speaker: doban
    en: "... Wh-what?"
    ko: "…뭐, 뭐라고?"
    ja: "…な、何だと？"
  d_main_46_af_03_138:
    speaker: "<Monologue>"
    en: I run in the direction Rapi and Dorothy flew off toward.
    ko: 라피와 도로시가 날아간 방향을 향해 뛰어간다.
    ja: ラピとドロシーが飛び去った方向へ走った
  d_main_46_af_03_139:
    speaker: "<Self>"
    en: Anis! Neon! Change of location!
    ko: 아니스! 네온! 장소가 바뀌었어!
    ja: アニス！ネオン！目的地の変更だ！
  d_main_46_af_03_140:
    speaker: anis_i_w_op_r
    en: What?! But we're almost there! Then where do we go?
    ko: 아잇 거의 다 왔는데…! 어딘데?
    ja: えっ、もうすぐつくのに…！今度はどこ？
  d_main_46_af_03_141:
    speaker: "<Self>"
    en: Head toward the hospital! I'll send you the exact location later!
    ko: 일단 병원 쪽으로 달려! 확실한 위치는 나중에 전달할게!
    ja: |-
      ひとまず病院へ向かってくれ！
      正確な位置は追って伝える！
  d_main_46_af_03_142:
    speaker: anis_i
    en: Okay!
    ko: 오케이!
    ja: 了解！
  d_main_46_af_03_143:
    speaker: neon_v_w_op_l
    en: See you later, Master!
    ko: 이따 봬요! 스승님!
    ja: またあとでお会いしましょう！師匠！
  d_main_46_af_03_144:
    speaker: "<Monologue>"
    en: I cut the transmission and break into a full sprint.
    ko: 통신을 끊고, 전력을 다해 달린다.
    ja: 通信を切り、全力で走った
d_main_46_af_04:
  d_main_46_af_04_1:
    speaker: "<Monologue>"
    en: I sprint in the direction Rapi and Dorothy are headed.
    ko: 라피와 도로시가 향한 방향으로 달린다.
    ja: |-
      ラピとドロシーが消えた方向へ、
      さらに走り続ける
  d_main_46_af_04_2:
    speaker: "<Monologue>"
    en: The only problem is, I don't know the exact location either...!
    ko: 문제는, 나도 정확한 위치를 모른다는 건데…!
    ja: 私にも正確な場所は分からないが…！
  d_main_46_af_04_3:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 콰아아앙--!!
    ja: ドカーン！！
  d_main_46_af_04_4:
    speaker: "<Monologue>"
    en: There!
    ko: "…저기다!"
    ja: "…あそこか！"
  d_main_46_af_04_5:
    speaker: "<Narration>"
    en: "*Crashhhh*"
    ko: 쿠당탕탕-!
    ja: ゴロゴロゴロ――
  d_main_46_af_04_6:
    speaker: "<Monologue>"
    en: Rapi tumbles across the ground.
    ko: "…라피가 굴러온다."
    ja: "…ラピが足下に転がってきた"
  d_main_46_af_04_7:
    speaker: "<Monologue>"
    en: From a distance, I catch sight of Dorothy pulling away.
    ko: 먼 곳에서 발을 거두고 있는 도로시가 보인다.
    ja: 遠くではドロシーが足を引きずっている
  d_main_46_af_04_8:
    speaker: rapi_red
    en: Commander!
    ko: 지휘관!
    ja: 指揮官！
  d_main_46_af_04_9:
    speaker: "<Self>"
    en: Rapi! Are you oka—!
    ko: 라피! 괜찮…!
    ja: ラピ！大丈…
  d_main_46_af_04_10:
    speaker: rapi_red
    en: Take cover!
    ko: 피하십시오!
    ja: 危ない！
  d_main_46_af_04_11:
    speaker: "<Narration>"
    en: "*Pew, pew, pew*"
    ko: 푸슝 푸슝 푸슝!
    ja: バシュン！バシュン！バシュン！
  d_main_46_af_04_12:
    speaker: "<Monologue>"
    en: Dorothy fires wildly.
    ko: 도로시가 총을 난사한다.
    ja: ドロシーが銃を乱射してきた
  d_main_46_af_04_13:
    speaker: "<Monologue>"
    en: I quickly hurl myself to the side. The optical rounds scrape across the ground.
    ko: 황급히 몸을 날린다. 광탄이 바닥을 긁는다.
    ja: |-
      あわてて身をひるがえすと、
      光弾が地面をかすめた
  d_main_46_af_04_14:
    speaker: "<Self>"
    en: She fired her gun?!
    ko: 총을 쓴다고…!?
    ja: 撃ってきた…！？
  d_main_46_af_04_15:
    speaker: rapi_red
    en: She's lost her mind!
    ko: 눈이 돌았습니다!
    ja: 完全に我を失っています！
  d_main_46_af_04_16:
    speaker: "<Monologue>"
    en: Dorothy approaches rapidly in low flight.
    ko: 도로시가 저공비행으로 빠르게 접근한다.
    ja: ドロシーが低空を飛び、距離を詰めてくる
  d_main_46_af_04_17:
    speaker: "<Monologue>"
    en: Rapi unleashes a volley at her, but she rolls clear of every shot.
    ko: 라피가 탄환을 갈겨대지만, 롤링으로 모두 회피한다.
    ja: |-
      迎撃するラピの放った弾丸は
      ことごとく回避された
  d_main_46_af_04_18:
    speaker: "<Monologue>"
    en: In the same motion, Dorothy fires back with optical rounds.
    ko: "…회피와 동시에 광탄을 쏘아댄다."
    ja: "…回避と同時に反撃が来る"
  d_main_46_af_04_19:
    speaker: "<Self>"
    en: Wait...! If I get shot, I'll die!
    ko: 잠깐…! 나는 맞으면 죽는다고!
    ja: 待て…！私に当たったら死ぬぞ！
  d_main_46_af_04_20:
    speaker: rapi_red
    en: The same goes for me!
    ko: 저도 마찬가지입니다!
    ja: 私でも同じです！
  d_main_46_af_04_21:
    speaker: "<Monologue>"
    en: Rapi and I roll out of the way as heat grazes our bodies.
    ko: 라피와 함께 몸을 굴린다. 열기가 몸을 스쳐 지나간다.
    ja: |-
      ラピも私もその場を飛び退いた。
      熱気が体をかすめた
  d_main_46_af_04_22:
    speaker: "<Monologue>"
    en: Dorothy walks slowly toward us.
    ko: 도로시가 천천히 걸어온다.
    ja: ドロシーがゆっくりと歩み寄って来る
  d_main_46_af_04_23:
    speaker: dorothy
    en: Do you intend to keep going?
    ko: 계속할 생각이신가요?
    ja: まだ続けるつもりですか？
  d_main_46_af_04_24:
    speaker: rapi_red
    en: I'd prefer not to, but if I stop, you'll go back and kill Doban.
    ko: 그러고 싶지 않은데, 계속 안 하면 너 도반 죽이러 갈 거잖아.
    ja: |-
      続けたくはないけど、そうしなければ
      あなたはドバンを殺しにいく。
  d_main_46_af_04_25:
    speaker: dorothy
    en: That's right. There's no reason to let him live.
    ko: 예. 맞아요. 살려둘 이유가 없는걸요.
    ja: |-
      ええ。その通りです。
      生かしておく理由はありませんから。
  d_main_46_af_04_26:
    speaker: rapi_red
    en: Stop this. You said you would take over the Ark.
    ko: 관둬. 너 방주 빼앗는다며.
    ja: |-
      そんなことは止めて。
      アークを乗っ取るつもりではなかったの？
  d_main_46_af_04_27:
    speaker: rapi_red
    en: If you do this, all of your plans will fall apart.
    ko: 그렇게 되면 아무것도 안 돼.
    ja: 殺してしまったら、それもできなくなるわ。
  d_main_46_af_04_28:
    speaker: rapi_red
    en: Everything you have prepared till now will become meaningless.
    ko: 지금까지 네가 준비해 오던 모든 게 무의미해질 거야.
    ja: 今までのあなたの計画が、全部水の泡。
  d_main_46_af_04_29:
    speaker: dorothy
    en: Everything I've prepared?
    ko: 제가 준비해 오던 거요?
    ja: 私の計画？
  d_main_46_af_04_30:
    speaker: dorothy
    en: It has already been ruined.
    ko: "…다 망가졌어요."
    ja: "…なくなりました。"
  d_main_46_af_04_31:
    speaker: dorothy
    en: Nothing is left.
    ko: 아무것도 안 남았거든요.
    ja: もう何も残っていません。
  d_main_46_af_04_32:
    speaker: rapi_red
    en: Dorothy, why are you doing this?
    ko: "…도로시. 왜 이러는 거야."
    ja: "…ドロシー。何があったの？"
  d_main_46_af_04_33:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_34:
    speaker: dorothy
    en: I have nothing left now.
    ko: 저는 이제 아무것도 안 남았어요.
    ja: 私にはもう何もありません。
  d_main_46_af_04_35:
    speaker: dorothy
    en: The place we thought was paradise refused to let us in, and the new paradise
      we built cast us out.
    ko: |-
      낙원이라 여겼던 곳은 저희를 들여보내 주지 않았고,
      새롭게 만든 낙원에서는 추방당했어요.
    ja: |-
      楽園だと思っていた箱舟には扉を閉ざされ、
      新たに作った楽園からも追われ…
  d_main_46_af_04_36:
    speaker: dorothy
    en: That's right. I have given up all hope.
    ko: "…그래요. 자포자기하는 심정이었어요."
    ja: "…そうです。私は諦めました。"
  d_main_46_af_04_37:
    speaker: dorothy
    en: Because there's nothing else I can do.
    ko: 할 수 있는 게 없으니까.
    ja: できることなど、もう何もありません。
  d_main_46_af_04_38:
    speaker: dorothy
    en: After inciting the humans and Nikkes of the Ark to leave with me...
    ko: 방주에서 인간과 니케를 선동해 방주 밖으로 나간 뒤,
    ja: |-
      アークの人間やニケをそそのかし、
      外へ連れ出して…
  d_main_46_af_04_39:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_40:
    speaker: dorothy
    en: "... I wanted to create another paradise."
    ko: 다시 한번. 낙원을 만들고 싶었어요.
    ja: もう一度、楽園を作り直すつもりでした。
  d_main_46_af_04_41:
    speaker: dorothy
    en: Ha. That trivial thing.
    ko: 그게, 하하. 그딴 게.
    ja: それが…ふふ…それぐらいしか…
  d_main_46_af_04_42:
    speaker: dorothy
    en: That was the only form of revenge I had left.
    ko: 지금 제가 할 수 있는 유일한 복수니까.
    ja: 今の私にできる復讐は、ありませんから。
  d_main_46_af_04_43:
    speaker: dorothy
    en: That was the only thing left I could take from the Ark.
    ko: 방주에서 빼앗을 수 있는 유일한 거니까.
    ja: 私がアークから奪えるものは、たったそれだけ。
  d_main_46_af_04_44:
    speaker: dorothy
    en: I've tried to endure all this time because it was all I had left.
    ko: 그것밖에 남지 않아서 참아보려 했는데.
    ja: そのためだけに耐えるつもりでしたが…
  d_main_46_af_04_45:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_46:
    speaker: dorothy
    en: But what I can't endure... is that.
    ko: 못 참겠어요. 저것만은.
    ja: 許せません。あれだけは。
  d_main_46_af_04_47:
    speaker: "<Self>"
    en: Dorothy...
    ko: "…도로시."
    ja: "…ドロシー"
  d_main_46_af_04_48:
    speaker: "<Self>"
    en: Come with us. Let's defeat the Queen together.
    ko: |-
      우리와 같이 가자.
      같이 퀸을 잡자.
    ja: |-
      私たちと来ればいい。
      力を合わせてクイーンを倒そう
  d_main_46_af_04_49:
    speaker: dorothy
    en: You're asking me to join forces with the Ark?
    ko: 방주와 손을 잡으라고요?
    ja: アークと手を組めと？
  d_main_46_af_04_50:
    speaker: dorothy
    en: You heard what happened, from Snow White herself.
    ko: 들었다면서요. 스노우 화이트한테.
    ja: 聞いたのでしょう、スノーホワイトに。
  d_main_46_af_04_51:
    speaker: dorothy
    en: What was done to me. To us.
    ko: 제가, 우리가 무슨 짓을 당했는지.
    ja: 私が…私たちが、何をされたのか。
  d_main_46_af_04_52:
    speaker: dorothy
    en: I'll never forgive the Ark for that.
    ko: 저는 도저히 용서가 안 되거든요.
    ja: 私には、どうしても許すことができません。
  d_main_46_af_04_53:
    speaker: "<Self>"
    en: I'll convince them. I'll make sure you're compensated for everything you've
      suffered, I—!
    ko: 내가 설득할게. 너희가 겪었던 모든 일을 보상받을 수 있도록, 내가…!
    ja: |-
      私が説得する。君たちの受けてきた仕打ちが、
      償われるように…！
  d_main_46_af_04_54:
    speaker: dorothy
    en: You know that would never happen!
    ko: 그딴 게 될 리가 없잖아요!
    ja: できもしないことを言わないでください！
  d_main_46_af_04_55:
    speaker: "<Narration>"
    en: Dorothy levels her gun at me.
    ko: 도로시가 총을 겨눈다.
    ja: ドロシーが銃を構えた
  d_main_46_af_04_56:
    speaker: rapi_red
    en: You idiot!
    ko: 이 멍청이가…!
    ja: バカ…！
  d_main_46_af_04_57:
    speaker: anis_i_w
    en: Anis is here!!
    ko: 아니스 등장!!
    ja: アニス参上！！
  d_main_46_af_04_58:
    speaker: neon_v_w
    en: Neo-Neon has arrived!!
    ko: 네오-네온 등장!!
    ja: ネオ・ネオン参上！！
  d_main_46_af_04_59:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 쿠웅-!!
    ja: ドスンッ！！
  d_main_46_af_04_60:
    speaker: "<Monologue>"
    en: Anis and Neon jump down from a building and land loudly behind Dorothy.
    ko: 건물 위에서 점프한 아니스와 네온이 도로시의 뒤에 요란하게 착지한다.
    ja: |-
      建物の上から飛び降りてきた
      アニスとネオンが
      ドロシーの背後に音を立てて着地した
  d_main_46_af_04_61:
    speaker: "<Monologue>"
    en: Dorothy hurriedly turns and pulls the trigger.
    ko: 도로시가 황급하게 뒤를 돌며 방아쇠를 당긴다.
    ja: ドロシーは反射的に振り向き、引き金を引いた
  d_main_46_af_04_62:
    speaker: "<Narration>"
    en: "*Pew*"
    ko: 푸슝-!
    ja: バシュン――！
  d_main_46_af_04_63:
    speaker: "<Monologue>"
    en: Anis's hand blocks the optical round aimed at Neon's head.
    ko: "…네온의 머리를 향해 쏜 도로시의 광탄이 아니스의 손에 막힌다."
    ja: |-
      …ネオンの頭に向かうドロシーの光弾を
      アニスの手が弾いた
  d_main_46_af_04_64:
    speaker: neon_v_w
    en: Whoa...
    ko: "…와."
    ja: "…わお。"
  d_main_46_af_04_65:
    speaker: anis_i_w
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_af_04_66:
    speaker: dorothy
    en: Oh...
    ko: "…아."
    ja: "…あ…"
  d_main_46_af_04_67:
    speaker: anis_i_w
    en: Did you just...!
    ko: 너 지금…!
    ja: ちょっと…！？
  d_main_46_af_04_68:
    speaker: dorothy
    en: I... I just...
    ko: 이건… 제가….
    ja: 今のは…私が…
  d_main_46_af_04_69:
    speaker: "<Monologue>"
    en: Dorothy steps back.
    ko: 도로시가 뒷걸음친다.
    ja: ドロシーがうろたえ、後ずさりした
  d_main_46_af_04_70:
    speaker: anis_i_w
    en: Were you trying to kill her?
    ko: 죽일 생각이었냐?
    ja: 今、殺す気だった？
  d_main_46_af_04_71:
    speaker: dorothy
    en: No... I wasn't.
    ko: 아니… 에요.
    ja: ち…違います。
  d_main_46_af_04_72:
    speaker: dorothy
    en: I-I'm sorry.
    ko: 미안, 미안해요.
    ja: も…申し訳ありません。
  d_main_46_af_04_73:
    speaker: neon_v_w
    en: Dorothy...
    ko: "…도로시."
    ja: "…ドロシー。"
  d_main_46_af_04_74:
    speaker: anis_i_w
    en: Hey...
    ko: 야, 너….
    ja: ねえ、あなた…
  d_main_46_af_04_75:
    speaker: neon_v_w
    en: Are you okay?
    ko: 괜찮아요?
    ja: 大丈夫ですか？
  d_main_46_af_04_76:
    speaker: anis_i_w
    en: Are you okay?
    ko: 괜찮냐?
    ja: 大丈夫？
  d_main_46_af_04_77:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_78:
    speaker: "<Narration>"
    en: "*Thud, thud, thud, thud*"
    ko: 쿵쿵쿵쿵.
    ja: ザッ、ザッ、ザッ、ザッ…
  d_main_46_af_04_79:
    speaker: "<Monologue>"
    en: Numerous footsteps send tremors through the ground.
    ko: 많은 발소리가 들리며 바닥이 진동한다.
    ja: 地面を揺らし、大群が押し寄せる
  d_main_46_af_04_80:
    speaker: "<Monologue>"
    en: Countless Nikkes are advancing toward us.
    ko: 수많은 니케들이 우리 쪽으로 다가오고 있다.
    ja: ニケの大軍団がこちらに追いついてきた
  d_main_46_af_04_81:
    speaker: "<Monologue>"
    en: At the forefront are Product 23 models.
    ko: "…그 선두에, 프로덕트 23 모델들이 있다."
    ja: |-
      …先頭には、あのプロダクト23モデルたちが
      立っている
  d_main_46_af_04_82:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "……！！"
  d_main_46_af_04_83:
    speaker: doban
    en: Well done, Counters! Hold her right there!
    ko: |-
      잘했다 카운터스!
      그대로 잡고 있어라!
    ja: |-
      お手柄だぞ、カウンターズ！
      そのまま足止めしていろ！
  d_main_46_af_04_84:
    speaker: "<Self>"
    en: Stop!
    ko: 멈춰!
    ja: 止まれ！
  d_main_46_af_04_85:
    speaker: doban
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_af_04_86:
    speaker: "<Self>"
    en: Don't take another step, and don't even think about giving any orders!
    ko: |-
      거기서 한 발짝도 움직이지 마라…!
      명령을 내릴 생각도 하지 마…!
    ja: |-
      1歩も動くんじゃない…！
      何も言うな…！
  d_main_46_af_04_87:
    speaker: doban
    en: Y-you son of a...!
    ko: 이, 이놈이…!
    ja: き、貴様…！
  d_main_46_af_04_88:
    speaker: "<Self>"
    en: Counters.
    ko: 카운터스.
    ja: カウンターズ
  d_main_46_af_04_89:
    speaker: "<Self>"
    en: We protect Dorothy.
    ko: 우리는 도로시를 지킨다.
    ja: 私たちはドロシーを守る
  d_main_46_af_04_90:
    speaker: rapi_red
    en: Roger.
    ko: 라져.
    ja: ラジャー。
  d_main_46_af_04_91:
    speaker: anis_i_w
    en: Got it.
    ko: 오케이.
    ja: オッケー。
  d_main_46_af_04_92:
    speaker: neon_v_w
    en: Firepower, firepower!
    ko: 화력 화력.
    ja: 火力、火力！
  d_main_46_af_04_93:
    speaker: "<Monologue>"
    en: We face off against Doban's forces with Dorothy standing behind us.
    ko: |-
      우리는 등 뒤에 도로시를 둔 채,
      도반의 병력과 대치한다.
    ja: |-
      私たちはドロシーに背を向け、
      ドバンの兵力と対峙した
  d_main_46_af_04_94:
    speaker: doban
    en: Ugh... Grr...
    ko: 윽…! 으으윽…!
    ja: うっ…！うぐぐっ…！
  d_main_46_af_04_95:
    speaker: doban
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_96:
    speaker: doban
    en: Go!
    ko: 가라.
    ja: 行け。
  d_main_46_af_04_97:
    speaker: "<Monologue>"
    en: The mass-produced Nikkes leading the formation exchange nervous glances.
    ko: 선두에 서 있는 양산형 니케들이 눈치를 본다.
    ja: |-
      先頭の量産型ニケたちは戸惑い、
      様子をうかがっている
  d_main_46_af_04_98:
    speaker: doban
    en: Go, damn you! I said go!
    ko: 가라! 가라! 가라!
    ja: どうした！行け！早く！
  d_main_46_af_04_99:
    speaker: doban
    en: Go and fight!!
    ko: 가서 싸우란 말이다!!
    ja: 突撃しろ！！
  d_main_46_af_04_100:
    speaker: "<Monologue>"
    en: The leading Product 23 models charge forward.
    ko: 선두의 프로덕트 23 모델들이 돌진한다.
    ja: 先頭のプロダクト23の軍団が動き出した
  d_main_46_af_04_101:
    speaker: "<Monologue>"
    en: With frightened expressions, they rush toward us.
    ko: 겁먹은 표정으로, 우릴 향해 돌진한다.
    ja: 怯えた表情で、こちらに向かってくる
  d_main_46_af_04_102:
    speaker: "<Monologue>"
    en: Fury fills Dorothy's eyes.
    ko: 도로시의 눈에 노기가 서린다.
    ja: ドロシーの目が怒りに染まった
  d_main_46_af_04_103:
    speaker: "<Monologue>"
    en: Rapi quickly grabs both of Dorothy's hands. Anis and Neon follow suit, grabbing
      Dorothy's shoulders.
    ko: |-
      라피가 빠르게 도로시의 양 손을 잡는다.
      뒤따라 아니스와 네온도 도로시의 어깨를 잡는다.
    ja: |-
      ラピが素早くドロシーの両手をつかみ、
      アニスとネオンがドロシーの肩を抑えた
  d_main_46_af_04_104:
    speaker: anis_i_w
    en: Urgh! Why is she so strong?!
    ko: 으윽…! 뭔 힘이 이렇게 쎈 거야…!
    ja: うっ…！なんでこんなに力が強いのよ…！
  d_main_46_af_04_105:
    speaker: neon_v_w
    en: Don't worry, there's three of us!
    ko: 하지만 우린 셋이죠!
    ja: こっちは3人がかりなのですが！
  d_main_46_af_04_106:
    speaker: dorothy
    en: Let me go! I'm going to dispose of that trash!
    ko: 놔요! 저는 저 쓰레기를…!
    ja: 放して！私はあの人でなしを…！
  d_main_46_af_04_107:
    speaker: rapi_red
    en: I know he's a piece of garbage! But you have to hold back!
    ko: 알아! 쓰레기인 것 알아! 그래도 참아!
    ja: |-
      分かってる！あいつは人でなし！
      でもここは耐えて！
  d_main_46_af_04_108:
    speaker: dorothy
    en: Hold back?! You want me to hold back?!
    ko: 참아!? 참으라고요!?
    ja: 耐えて！？耐えろというのですか！？
  d_main_46_af_04_109:
    speaker: dorothy
    en: Imagine if those Nikkes looked like Red Hood?
    ko: 레드 후드가 저 꼴이 되어서 왔다고 생각해 봐요!
    ja: もし、レッドフードでこんなことをされたら！
  d_main_46_af_04_110:
    speaker: dorothy
    en: Could you really hold back?
    ko: 당신, 참을 수 있어요?
    ja: 耐えられるというのですか！？
  d_main_46_af_04_111:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_112:
    speaker: dorothy
    en: That piece of filth! How dare he use Pinne...! My most precious wings...!
    ko: 저딴 게 감히 피나를…! 내 가장 소중한 날개를…!
    ja: |-
      汚されたのです…！
      私の何より大切な翼を…！
  d_main_46_af_04_113:
    speaker: dorothy
    en: He's desecrating her memory!
    ko: 모독하고 있다고요!
    ja: 冒涜されているのですよ！？
  d_main_46_af_04_114:
    speaker: dorothy
    en: He doesn't know the first thing about what happened! But he dares trample
      on my memories to provoke me?!
    ko: |-
      잘 알지도 못하는 주제에…!
      나를 자극하려고! 제 추억을!
    ja: |-
      何も知らないで…！
      私を！私の記憶を！
  d_main_46_af_04_115:
    speaker: dorothy
    en: My most precious memories!
    ko: 가장 소중한 기억을!
    ja: 何より大切な記憶を踏みにじって！
  d_main_46_af_04_116:
    speaker: rapi_red
    en: You already know he's trying to get a rise out of you! So don't fall for it!
    ko: |-
      알고 있잖아! 자극하려고 저런다는 거!
      말려들지 마!
    ja: |-
      分かってるはず！
      挑発よ！乗ってはダメ！
  d_main_46_af_04_117:
    speaker: dorothy
    en: I don't care! I'll play right along!
    ko: 까짓거 말려 들어가 드리죠…!
    ja: 乗って差し上げようじゃありませんか…！
  d_main_46_af_04_118:
    speaker: dorothy
    en: Very well! I'll take the bait!
    ko: 아아, 그래요…! 까짓거 놀아나 드리죠!!
    ja: |-
      もう、構いません…！
      存分に乗って差し上げましょう！
  d_main_46_af_04_119:
    speaker: rapi_red
    en: Are you being serious?
    ko: 진심이야…?
    ja: 本気で言ってる…？
  d_main_46_af_04_120:
    speaker: dorothy
    en: Yes, I'm serious!
    ko: 예! 진심이에요!
    ja: ええ！そうです！
  d_main_46_af_04_121:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_04_122:
    speaker: "<Monologue>"
    en: Rapi releases Dorothy's hands.
    ko: 라피가 도로시의 손을 놓는다.
    ja: ラピがドロシーの手を離した
  d_main_46_af_04_123:
    speaker: "<Monologue>"
    en: 'She looks straight at Dorothy and says:'
    ko: 도로시를 똑바로 바라보며 말한다.
    ja: |-
      ドロシーの目をまっすぐにのぞき込み、
      言い放った
  d_main_46_af_04_124:
    speaker: rapi_red
    en: Okay. Then let's kill him together.
    ko: 그래. 그럼 같이 죽이자.
    ja: 分かった。なら、付き合うわ。
  d_main_46_af_04_125:
    speaker: dorothy
    en: "... What?"
    ko: "…뭐라고요?"
    ja: "…なんですって？"
  d_main_46_af_04_126:
    speaker: rapi_red
    en: If that's what you want, then let's kill him together, Dorothy.
    ko: |-
      같이 죽이자, 도로시.
      네가 그렇게 원한다면 같이 하자.
    ja: |-
      一緒にやりましょう、ドロシー。
      それがあなたの望みなら、私も付き合う。
  d_main_46_af_04_127:
    speaker: rapi_red
    en: I'm your friend, so I'm in this with you.
    ko: |-
      나는 네 친구니까.
      같이 짊어질게.
    ja: |-
      私はあなたの友だちだから、
      一緒に背負う。
  d_main_46_af_04_128:
    speaker: dorothy
    en: "... What are you saying?"
    ko: "…뭐라는 거예요 당신."
    ja: "…何を言っているか分かっていますか、あなた。"
  d_main_46_af_04_129:
    speaker: "<Narration>"
    en: "*Thud, thud, thud, thud*"
    ko: 쿵쿵쿵쿵.
    ja: ザッ、ザッ、ザッ、ザッ…
  d_main_46_af_04_130:
    speaker: "<Monologue>"
    en: The ground shakes from the thunderous footsteps.
    ko: 많은 발소리가 들리며 바닥이 진동한다.
    ja: さらに無数の足音が、地面を揺らした
  d_main_46_af_04_131:
    speaker: "<Monologue>"
    en: In an instant, countless Nikkes surround us.
    ko: 순식간에, 수많은 니케가 우리를 둘러싼다.
    ja: 私たちは瞬く間に、新手のニケに包囲された
  d_main_46_af_04_132:
    speaker: "<Monologue>"
    en: Deputy Chief Burningum arrives with reinforcements in tow.
    ko: "…버닝엄 부사령관이, 병력을 끌고 왔다."
    ja: |-
      …指揮を執っているのは、
      バーニンガム副司令官だ
  d_main_46_af_04_133:
    speaker: burningum
    en: Huff... huff...!
    ko: 후우…! 후우…!
    ja: はぁ…！ふぅ…！
  d_main_46_af_04_134:
    speaker: burningum
    en: Everyone... stop...!
    ko: 다들…! 멈춰… 라…!
    ja: 全員…！動く…な…！
  d_main_46_af_04_135:
    speaker: burningum
    en: Doro...thy...! Huff...! Drop your... weapon!
    ko: 도로, 시…! 후우…! 무기를 버려… 라.
    ja: ドロ、シー…！ふぅ…！武器を…捨てろ。
  d_main_46_af_04_136:
    speaker: burningum
    en: Huff... huff...!
    ko: 후욱…! 후우…!
    ja: ふぅ…はぁっ…！
  d_main_46_af_04_137:
    speaker: doban
    en: Burningum...!
    ko: 버닝엄…!
    ja: バーニンガム…！
  d_main_46_af_04_138:
    speaker: burningum
    en: I said drop your weapon, Dorothy.
    ko: 무기를 버려라, 도로시.
    ja: 武器を捨てろ、ドロシー。
  d_main_46_af_04_139:
    speaker: burningum
    en: Now. Drop it.
    ko: 당장. 무기를 버려.
    ja: 今すぐだ。早く。
  d_main_46_af_04_140:
    speaker: dorothy
    en: "... Why should I?"
    ko: "…내가 왜요."
    ja: "…なぜです？"
  d_main_46_af_04_141:
    speaker: doban
    en: Perfect. Exactly what I hoped for. A large audience.
    ko: 좋아. 관중이 이렇게나 많다면 바라던 바다.
    ja: |-
      いいだろう。
      目撃者は多い方がいい…
  d_main_46_af_04_142:
    speaker: "<Monologue>"
    en: "... Doban fiddles with something."
    ko: "…도반이 뭔가 꼼지락거린다."
    ja: "…ドバンが手の中で何かに触れた"
  d_main_46_af_04_143:
    speaker: "<Monologue>"
    en: I get a bad feeling in the pit of my stomach.
    ko: 불길한 느낌이 든다.
    ja: 嫌な予感がした
  d_main_46_af_04_144:
    speaker: "<Monologue>"
    en: As if responding to that foreboding, the Nikkes resembling Pinne react all
      at once.
    ko: |-
      그 불길한 느낌에 호응하듯,
      피나를 닮은 니케들이 일제히 반응한다.
    ja: |-
      答え合わせをするかのように、
      ピナに似せられたニケたちが一斉に反応した
  d_main_46_af_04_145:
    speaker: "<Monologue>"
    en: They tremble as if in agonizing pain.
    ko: "…고통스러운 듯, 몸을 떤다."
    ja: "…苦しそうに身をよじりだしている"
  d_main_46_af_04_146:
    speaker: "<Monologue>"
    en: Moments later, all the mass-produced Nikkes have red eyes.
    ko: 잠시 후, 양산형 니케들은 모두 붉은 눈을 한 채
    ja: |-
      やがて、量産型ニケたちは
      目を赤く光らせながら…
  d_main_46_af_04_147:
    speaker: pinnelike
    en: Dorothy. Dorothy.
    ko: 도로시 님. 도로시 님.
    ja: ドロシー様。ドロシー様。
  d_main_46_af_04_148:
    speaker: pinnelike
    en: Dorothy. Dorothy.
    ko: 도로시 님. 도로시 님.
    ja: ドロシー様。ドロシー様。
  d_main_46_af_04_149:
    speaker: pinnelike
    en: Dorothy. Dorothy.
    ko: 도로시 님. 도로시 님.
    ja: ドロシー様。ドロシー様。
  d_main_46_af_04_150:
    speaker: "<Monologue>"
    en: They begin calling her name in metallic, distorted voices.
    ko: 쇳소리가 섞인 목소리로 도로시를 부르기 시작했다.
    ja: 金属音の混ざった声でドロシーの名を呼び始めた
  d_main_46_af_04_151:
    speaker: "<Self>"
    en: Are they... corrupted?
    ko: 침… 식…?
    ja: 侵食か…？
  d_main_46_af_04_152:
    speaker: doban
    en: Go on then, Pilgrim. Shoot.
    ko: 자! 쏴라, 필그림!
    ja: さあ！撃ってみろ、ピルグリム！
  d_main_46_af_04_153:
    speaker: doban
    en: Isn't shooting corrupted Nikkes your specialty?
    ko: 침식에 걸린 니케를 쏘는 건 네 전공이지 않나!
    ja: |-
      侵食されたニケの始末は
      これが初めてじゃないだろう！
  d_main_46_af_04_154:
    speaker: dorothy
    en: Argh...!
    ko: 으…!
    ja: うっ…！
  d_main_46_af_04_155:
    speaker: dorothy
    en: Aaaaaah!
    ko: 아아아아아--!!
    ja: あぁぁぁぁっ！！
  d_main_46_af_04_156:
    speaker: "<Monologue>"
    en: Dorothy shakes everyone off and raises her gun.
    ko: 도로시가 모두를 뿌리치고 총을 겨눈다.
    ja: |-
      ドロシーが抑えていた全員を振り払い、
      銃を構えた
  d_main_46_af_04_157:
    speaker: "<Self>"
    en: No! Dorothy!
    ko: 안돼! 도로시!
    ja: よせ！ドロシー！
  d_main_46_af_04_158:
    speaker: doban
    en: Haha! Yes! Shoot!
    ko: 하하! 그래! 쏴라!
    ja: ハハハ…！そうだ！撃て！
  d_main_46_af_04_159:
    speaker: doban
    en: Shoot and reveal your true nature!
    ko: 쏴서 네 본성을 드러내라!
    ja: 撃って、本性を見せろ！
  d_main_46_af_04_160:
    speaker: "<Monologue>"
    en: Several mass-produced Nikkes shield Doban.
    ko: 도반의 앞을 양산형 니케들이 지킨다.
    ja: 量産型ニケたちがドバンの前を固めている
  d_main_46_af_04_161:
    speaker: "<Monologue>"
    en: Doban laughs.
    ko: 도반은 웃는다.
    ja: ドバンが笑った
  d_main_46_af_04_162:
    speaker: doban
    en: It worked. She took the bait.
    ko: 됐다. 떨어졌다.
    ja: 勝った。これで…
  d_main_46_af_04_163:
    speaker: "<Monologue>"
    en: Dorothy's gun trembles.
    ko: 도로시의 총구가 떨린다.
    ja: ドロシーの向けた銃口が震えている
  d_main_46_af_04_164:
    speaker: "<Monologue>"
    en: She glares at Doban, her face filled with rage.
    ko: 도로시가 분노에 찬 얼굴로 도반을 노려본다.
    ja: 怒りに満ちた顔でドバンをにらんでいる
  d_main_46_af_04_165:
    speaker: "<Monologue>"
    en: Then...
    ko: 그리고
    ja: そして…
  d_main_46_af_04_166:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 타앙-
    ja: バン――！
  d_main_46_af_04_167:
    speaker: "<Monologue>"
    en: A hole opens in Doban's head.
    ko: 도반의 머리에 구멍이 뚫렸다.
    ja: ドバンの頭に穴が開いた
d_main_46_af_05:
  d_main_46_af_05_1:
    speaker: "<Monologue>"
    en: Doban collapses to the ground.
    ko: 도반이 쓰러진다.
    ja: ドバンの胴体が地に伏した
  d_main_46_af_05_2:
    speaker: "<Monologue>"
    en: Red spills from his head and stains the ground.
    ko: 머리에서 흘러나온 붉은색이 바닥을 물들인다.
    ja: 鮮血が地面を赤く染めていく
  d_main_46_af_05_3:
    speaker: "<Monologue>"
    en: His body lies motionless.
    ko: 도반은 조금도 움직이지 않는다.
    ja: ドバンは身じろぎ一つしない
  d_main_46_af_05_4:
    speaker: "<Monologue>"
    en: He dies instantly.
    ko: "…즉사했다."
    ja: "…即死だ"
  d_main_46_af_05_5:
    speaker: rapi_red
    en: Damn it...
    ko: "…이… 런…."
    ja: "…こん…な…"
  d_main_46_af_05_6:
    speaker: "<Monologue>"
    en: Chaos erupts. Nikkes and citizens alike scream.
    ko: 소란이 일어난다. 니케들은 물론, 시민들이 소리를 지른다.
    ja: |-
      当然のパニックが起こる。
      ニケもあたりの民間人も悲鳴を上げた
  d_main_46_af_05_7:
    speaker: "<Monologue>"
    en: One of the Ark's highest authorities, a Deputy Chief, is dead.
    ko: 방주의 최고 권력자 중 한 명인, 부사령관이 죽었다.
    ja: |-
      アーク最高権力者の一人である
      副司令官が目の前で死んだのだから
  d_main_46_af_05_8:
    speaker: rapi_red
    en: Dorothy! What have you done...!
    ko: 도로시! 너 이게 무슨 미친 짓…!
    ja: ドロシー！あなた、自分が何をしたのか…！
  d_main_46_af_05_9:
    speaker: dorothy
    en: "... It wasn't me."
    ko: "…제가 아니에요."
    ja: "…私ではありません。"
  d_main_46_af_05_10:
    speaker: "<Self>"
    en: "...!"
    ko: "…!!"
    ja: "……！？"
  d_main_46_af_05_11:
    speaker: "<Monologue>"
    en: I turn my head.
    ko: 고개를 돌린다.
    ja: 後方を振り返った
  d_main_46_af_05_12:
    speaker: "<Monologue>"
    en: Smoke rises from Deputy Chief Burningum's gun.
    ko: "…버닝엄 부사령관의 총구에서 연기가 피어오르고 있다."
    ja: |-
      …煙を上げていたのは、
      バーニンガム副司令官の銃だった
  d_main_46_af_05_13:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_14:
    speaker: "<Self>"
    en: Deputy Chief...
    ko: "…부사령관님."
    ja: "…副司令官"
  d_main_46_af_05_15:
    speaker: burningum
    en: Enikk.
    ko: 에닉.
    ja: エニック…
  d_main_46_af_05_16:
    speaker: burningum
    en: The verdict.
    ko: 판결을.
    ja: 判決を。
  d_main_46_af_05_17:
    speaker: enikk_op_r
    en: I will deliver my judgment.
    ko: 판결하겠습니다.
    ja: 判決を言い渡します。
  d_main_46_af_05_18:
    speaker: enikk_op_r
    en: The mobilization of private forces within the Ark without majority consent
      of Ark leadership.
    ko: 방주 내에서 수뇌부 과반수 이상의 동의를 얻지 않은 채 사병을 동원한 것.
    ja: |-
      首脳部の過半数以上の同意を得ずに
      アーク内で私兵を動員したこと。
  d_main_46_af_05_19:
    speaker: enikk_op_r
    en: The use of live ammunition within the Ark without majority consent of Ark
      leadership.
    ko: 방주 내에서 수뇌부 과반수 이상의 동의를 얻지 않은 채 실탄을 사용한 것.
    ja: |-
      首脳部の過半数以上の同意を得ずに
      アーク内で実弾を使用したこと。
  d_main_46_af_05_20:
    speaker: enikk_op_r
    en: The use of explosives within the Ark without majority consent of Ark leadership.
    ko: 방주 내에서 수뇌부 과반수 이상의 동의를 얻지 않은 채 폭발물을 사용한 것.
    ja: |-
      首脳部の過半数以上の同意を得ずに
      アーク内で爆発物を使用したこと。
  d_main_46_af_05_21:
    speaker: enikk_op_r
    en: The meaningless sacrifice of Nikkes in the process.
    ko: 해당 과정에서 니케를 무의미하게 희생시킨 것.
    ja: |-
      また、その過程で
      不必要なニケの犠牲を生んだこと。
  d_main_46_af_05_22:
    speaker: enikk_op_r
    en: Furthermore, the misuse of classified research data pertaining to corruption
      without majority consent of Ark leadership.
    ko: 또한 현재 극비로 연구 중이던 침식 관련 데이터를 수뇌부 과반수 이상의 동의를 얻지 않은 채 남용한 것.
    ja: |-
      さらに、極秘である侵食研究のデータを
      首脳部の過半数以上の同意を得ずに
      乱用したこと。
  d_main_46_af_05_23:
    speaker: enikk_op_r
    en: All of the above actions resulted in considerable disorder within the Ark.
    ko: 위 사항으로 인해 방주에 혼란을 야기한 것.
    ja: |-
      以上により、アークに著しい
      混乱を引き起こしたこと。
  d_main_46_af_05_24:
    speaker: enikk_op_r
    en: I hereby deliver judgment on Deputy Chief Burningum, who carried out summary
      execution on Deputy Chief Doban, the party responsible for the aforementioned
      offenses.
    ko: |-
      위 사항을 발생시킨 부사령관 도반에게,
      즉결심판을 가한 부사령관 버닝엄에 대해 판결합니다.
    ja: |-
      かかる罪状に基づき、副司令官ドバンに対し
      副司令官バーニンガムが略式の処刑を
      行ったことについて…
  d_main_46_af_05_25:
    speaker: enikk_op_r
    en: On the basis that Deputy Chief Doban's actions could have further destabilized
      the Ark's already turbulent situation.
    ko: 혼란스러운 현재 방주의 상황을 더 악화시킬 수도 있었던 점.
    ja: |-
      状況を看過すればアークの混乱を
      さらに深刻化させるおそれがあったこと…
  d_main_46_af_05_26:
    speaker: enikk_op_r
    en: On the basis of the potential threat posed to the Ark by unnecessarily provoking
      the Pilgrim, Dorothy, an unidentified entity.
    ko: 미확인 개체인 필그림 도로시를 필요 이상으로 자극해 방주에 위협이 될 수도 있었던 점.
    ja: |-
      過剰な挑発行為により
      未確認個体であるピルグリム、ドロシーを
      アークの脅威たらしめる可能性があったこと…
  d_main_46_af_05_27:
    speaker: enikk_op_r
    en: Furthermore, on the basis that Deputy Chief Doban held no meaningful influence
      over the Ark's current operations.
    ko: 또 한, 부사령관 도반이 현재 방주의 운용에 유의미한 영향력이 없었다는 점에 의거.
    ja: |-
      また、副司令官ドバンの排除が
      アークの運用に対し、重大な影響力を
      及ぼさないことなどを鑑み…
  d_main_46_af_05_28:
    speaker: enikk_op_r
    en: I hereby rule Deputy Chief Burningum's summary execution of Doban a justified
      act.
    ko: 부사령관 버닝엄의 즉결심판은 정당한 행위로 판결합니다.
    ja: |-
      正当な判断に基づく行為として、
      副指令官バーニンガムによる処分を
      追認するものとします。
  d_main_46_af_05_29:
    speaker: enikk_op_r
    en: Please note that this ruling factored in the special circumstances of the
      situation being treated as wartime.
    ko: 해당 상황을 전시 상황이라 가정한 특수성이 고려된 점, 참고해 주십시오.
    ja: |-
      ただし、この裁定は戦時下に匹敵する状況での
      特例的判断であることはご承知おきください。
  d_main_46_af_05_30:
    speaker: burningum
    en: "... Whew."
    ko: "…후우."
    ja: "…ふぅ…"
  d_main_46_af_05_31:
    speaker: burningum
    en: Good. That's a relief.
    ko: 그래. 다행이군.
    ja: そうか。安心した。
  d_main_46_af_05_32:
    speaker: "<Monologue>"
    en: Burningum, who is drenched in sweat, looks at Dorothy.
    ko: 버닝엄 부사령관은 땀을 뻘뻘 흘리며 도로시를 바라본다.
    ja: |-
      バーニンガム副司令官は
      一面に汗の流れる顔でドロシーを見た
  d_main_46_af_05_33:
    speaker: "<Monologue>"
    en: Dorothy stares back with a shocked expression.
    ko: 도로시는 놀란 표정으로, 버닝엄 부사령관을 바라본다.
    ja: |-
      ドロシーは理解が及んでいないという顔で
      バーニンガム副司令官を見ていた
  d_main_46_af_05_34:
    speaker: burningum
    en: "... A real relief."
    ko: "…정말 다행이야."
    ja: "…本当に、よかった。"
  d_main_46_af_05_35:
    speaker: "<Monologue>"
    en: Burningum surveys the Nikkes filling the streets, and the citizens watching
      everything unfold from a distance.
    ko: |-
      버닝엄 부사령관은 거리를 가득 채운 니케들과,
      멀찌감치 모든 상황을 보고 있던 시민들을 본다.
    ja: |-
      バーニンガム副司令官は辺りを見回し、
      立ち尽くすニケたちと、
      騒動の一部始終を目撃した人々の様子を見た
  d_main_46_af_05_36:
    speaker: "<Monologue>"
    en: Then he whispers to me.
    ko: 그리고 나에게 속삭인다.
    ja: それから、私に小声でささやいた
  d_main_46_af_05_37:
    speaker: burningum
    en: Help me put the Nikkes and the citizens at ease.
    ko: 니케와 시민들을 안심시켜 줘.
    ja: ニケと目撃者たちを落ち着けてやってくれ。
  d_main_46_af_05_38:
    speaker: "<Self>"
    en: Wh-what...? Why don't you do it yourself?
    ko: 왜… 직접 하지 않으시고….
    ja: いえ…ご自分でなされた方がよいのでは…？
  d_main_46_af_05_39:
    speaker: burningum
    en: I'm not good with crowded places.
    ko: 이렇게 사람이 많은 곳은 불편해.
    ja: 人だかりは苦手でな。
  d_main_46_af_05_40:
    speaker: "<Self>"
    en: V-very well.
    ko: 아, 알겠습니다.
    ja: り、了解しました
  d_main_46_af_05_41:
    speaker: "<Monologue>"
    en: A private call comes through from Enikk.
    ko: 에닉에게 개인 회선이 온다.
    ja: エニックからの個人通信の呼び出しが鳴った
  d_main_46_af_05_42:
    speaker: enikk_op_c
    en: I will dispatch personnel to retrieve the body of the former Deputy Chief
      Doban.
    ko: 저는 전 부사령관 도반의 시신을 수습할 인원을 파견하겠습니다.
    ja: |-
      ドバン前副司令官の遺体を回収するため
      人員を派遣します。
  d_main_46_af_05_43:
    speaker: enikk_op_c
    en: Additionally, I will request that Elysion treat the Nikkes afflicted with
      corruption.
    ko: 추가로, 침식에 걸린 니케들의 치료를 엘리시온에게 요청하겠습니다.
    ja: |-
      また、浸食されたニケたちの治療を
      エリシオンに要請します。
  d_main_46_af_05_44:
    speaker: enikk_op_c
    en: They should be treatable with the Vapaus we have secured.
    ko: 확보해 놓은 언체인드로 치료할 수 있겠죠.
    ja: |-
      確保済みのアンチェインドで
      不足はないはずです。
  d_main_46_af_05_45:
    speaker: "<Self>"
    en: So you knew about this.
    ko: 알고 있었구나.
    ja: 知っていたのか
  d_main_46_af_05_46:
    speaker: enikk_op_c
    en: Yes, but I am the only one who does, so there is no need for concern.
    ko: 예. 저만 알고 있으니 안심하셔도 좋습니다.
    ja: |-
      はい。他には知らせていませんので、
      ご心配なく。
  d_main_46_af_05_47:
    speaker: "<Self>"
    en: Good. I'll leave it in your hands.
    ko: 그래. 부탁할게.
    ja: 分かった、頼む
  d_main_46_af_05_48:
    speaker: enikk_op_c
    en: Very well.
    ko: 예.
    ja: 承知しました。
  d_main_46_af_05_49:
    speaker: "<Monologue>"
    en: I look around.
    ko: 주위를 바라본다.
    ja: あたりの様子をうかがった
  d_main_46_af_05_50:
    speaker: "<Monologue>"
    en: I see the trembling eyes of the countless Nikkes and citizens.
    ko: 수많은 니케들과, 시민들의 떨리는 눈동자를 본다.
    ja: 大勢のニケと群衆が怯えた目をしている
  d_main_46_af_05_51:
    speaker: "<Monologue>"
    en: At the end of their gazes, Dorothy stands.
    ko: 그 시선의 끝에, 도로시가 있다.
    ja: その視線の集まる先には、ドロシーがいた
  d_main_46_af_05_52:
    speaker: "<Monologue>"
    en: I take a deep breath,
    ko: 나는 심호흡을 한다.
    ja: 私は深呼吸をした後…
  d_main_46_af_05_53:
    speaker: "<Monologue>"
    en: and point at Dorothy.
    ko: 도로시를 가리킨다.
    ja: ドロシーを指さし、声をあげた
  d_main_46_af_05_54:
    speaker: "<Self>"
    en: This is Dorothy, the second leader of the Goddess Squad.
    ko: |-
      갓데스 스쿼드의 두 번째 리더.
      도로시입니다.
    ja: |-
      彼女こそゴッデス部隊2人目のリーダー、
      ドロシーです
  d_main_46_af_05_55:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_46_af_05_56:
    speaker: "<Self>"
    en: The Goddess Squad is not a legend. They existed, and their leader stands before
      you now.
    ko: |-
      갓데스 스쿼드는 전설이 아닙니다.
      실존했으며, 그 리더가 지금 여러분 앞에 있습니다.
    ja: |-
      ただの伝説ではありません。
      ゴッデスは実在し、皆さんの前に立っています
  d_main_46_af_05_57:
    speaker: dorothy
    en: What on earth are you saying?!
    ko: 지금 무슨 소릴…!!
    ja: 急に何を…！！
  d_main_46_af_05_58:
    speaker: "<Self>"
    en: Dorothy is innocent. I can vouch for her.
    ko: |-
      도로시는 죄가 없습니다.
      제가 보증합니다.
    ja: |-
      彼女に罪はありません。
      カウンターズ指揮官の名において保証します
  d_main_46_af_05_59:
    speaker: "<Self>"
    en: You all know what Dorothy has done for the Ark in its time of need.
    ko: |-
      다들 아실 겁니다.
      도로시가 방주의 위기를 해결하기 위해 해왔던 일들을.
    ja: |-
      皆さんも覚えているはずです。
      彼女がアークの危機を救ったことを
  d_main_46_af_05_60:
    speaker: "<Self>"
    en: I will personally guarantee Dorothy's safety,
    ko: 도로시의 신변은 제가 보증합니다.
    ja: ドロシーの潔白には私が責任を負います
  d_main_46_af_05_61:
    speaker: "<Self>"
    en: as the Commander of the Counters, the Commando Unit.
    ko: 카운터스, 특수별동대의 지휘관인 제가 보증합니다.
    ja: |-
      カウンターズこと、特殊別働隊の
      指揮官である私が保証します
  d_main_46_af_05_62:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_63:
    speaker: "<Self>"
    en: Former Deputy Chief Doban...
    ko: 도반 전 부사령관은….
    ja: ドバン前副司令官は…
  d_main_46_af_05_64:
    speaker: "<Self>"
    en: He attempted to frame and execute Dorothy. His motives are currently under
      investigation.
    ko: |-
      그런 도로시에게 누명을 씌워 사살하려 했습니다.
      의도는 현재 파악 중입니다.
    ja: |-
      彼女に汚名を着せ、抹殺しようとしました。
      詳細な動機は現在調査中です
  d_main_46_af_05_65:
    speaker: "<Self>"
    en: His actions were no different from acts of terrorism, including the discharge
      of firearms, and the planting of bombs inside Nikkes to use them as weapons.
    ko: "…총격은 물론 니케들에게 폭탄을 내장해 무기로 사용한, 테러와 다르지 않은 행위를 저질렀기에."
    ja: |-
      …市街での銃撃をはじめ、ニケを爆弾として
      テロにも等しいことを行いました
  d_main_46_af_05_66:
    speaker: "<Self>"
    en: He was executed by Deputy Chief Burningum.
    ko: 버닝엄 부사령관에게 사살당했습니다.
    ja: |-
      そのため、バーニンガム副司令官の手で
      やむを得ず射殺されました
  d_main_46_af_05_67:
    speaker: "<Monologue>"
    en: Should I say more? Do I need to address what Dorothy, or even what Doban said.
    ko: |-
      …더 말해야 하나.
      도로시가 했던 말, 도반이 했던 말을 여기서 해명해야 하나.
    ja: |-
      …これ以上の説明は必要だろうか？
      ドロシーとドバンの会話に踏み込むべきか…
  d_main_46_af_05_68:
    speaker: "<Monologue>"
    en: As I mull these things over, my eyes meet Burningum's.
    ko: 그때, 버닝엄 부사령관과 눈이 마주쳤다.
    ja: バーニンガム副司令官と目を合わせた
  d_main_46_af_05_69:
    speaker: "<Monologue>"
    en: He subtly shakes his head.
    ko: 버닝엄 부사령관이 고개를 살짝 흔든다.
    ja: バーニンガム副司令官は小さく首を振った
  d_main_46_af_05_70:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_71:
    speaker: "<Self>"
    en: This is all I can share at the moment. Further details will be provided in
      a statement from the Central Government.
    ko: |-
      …현재 말씀드릴 수 있는 건 이 정도입니다.
      자세한 사항은 중앙 정부를 통해 공식 발표를 하겠습니다.
    ja: |-
      …今お伝えできることは以上です。
      詳細は中央政府の正式発表をお待ちください
  d_main_46_af_05_72:
    speaker: "<Self>"
    en: From here on, please follow any directives issued by the Central Government.
      Thank you.
    ko: |-
      이후는 중앙 정부의 인도에 따라 행동해 주십시오.
      감사합니다.
    ja: |-
      このあとは中央政府の誘導に従って
      行動してください。以上です
  d_main_46_af_05_73:
    speaker: "<Monologue>"
    en: The commotion begins to settle.
    ko: 소란이 정리되어 간다.
    ja: 騒ぎが少しずつ静かになった
  d_main_46_af_05_74:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_75:
    speaker: "<Self>"
    en: "... Dorothy."
    ko: "…도로시."
    ja: "…ドロシー"
  d_main_46_af_05_76:
    speaker: dorothy
    en: Who gave you the right... to talk about me like that?!
    ko: 누가… 멋대로 저에 대해서 그렇게 얘기하라고…!
    ja: 誰が…こんなことをしろとは頼んでいません…！
  d_main_46_af_05_77:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_78:
    speaker: "<Self>"
    en: I'll convince them.
    ko: 설득할게.
    ja: 説得する
  d_main_46_af_05_79:
    speaker: dorothy
    en: What...?
    ko: 뭘… 요….
    ja: 何を…です…
  d_main_46_af_05_80:
    speaker: "<Self>"
    en: I'll convince them so that you can be compensated for everything you've been
      through.
    ko: |-
      네가 그동안 겪었던 일을 보상받을 수 있도록.
      설득할게.
    ja: |-
      君たちの耐えてきたことが報われるように、
      説得してみせる
  d_main_46_af_05_81:
    speaker: "<Self>"
    en: Just trust me.
    ko: 믿어줘.
    ja: 信じてくれ
  d_main_46_af_05_82:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_83:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: カチャリ
  d_main_46_af_05_84:
    speaker: "<Monologue>"
    en: Handcuffs are placed on Dorothy's wrists.
    ko: 도로시의 손에 수갑이 채워진다.
    ja: ドロシーに手錠がかけられた
  d_main_46_af_05_85:
    speaker: "<Self>"
    en: Wait...!
    ko: 잠깐…!
    ja: 待て…！
  d_main_46_af_05_86:
    speaker: burningum
    en: This is just for show.
    ko: 구색만 맞추는 거야.
    ja: 体裁上こうするだけだ。
  d_main_46_af_05_87:
    speaker: burningum
    en: She did discharge a firearm in city limits, after all.
    ko: 어쨌든 시내에서 총기를 사용한 건 맞으니까.
    ja: |-
      市街地で銃を使用したことは
      紛れもない事実だからな。
  d_main_46_af_05_88:
    speaker: burningum
    en: Beside, do you really think this metal scrap can actually restrain her?
    ko: 그리고 이런 강철 쪼가리로 도로시를 구속할 수 있을 거라 생각하나?
    ja: |-
      そもそも、こんな鉄の輪ごときで
      拘束できる相手だと思うか？
  d_main_46_af_05_89:
    speaker: "<Self>"
    en: Of course... not.
    ko: 그건… 아닙니다.
    ja: "…いいえ"
  d_main_46_af_05_90:
    speaker: burningum
    en: For now, we'll hold her at the Rehabilitation Center for Nikkes.
    ko: 일단 갱생관의 니케용 시설에 가둘 거야.
    ja: |-
      ひとまず、更生館に送るという
      形にさせてもらう。
  d_main_46_af_05_91:
    speaker: burningum
    en: We can talk there.
    ko: 그곳에서, 얘기 좀 하지.
    ja: 後の話は、そこでしよう。
  d_main_46_af_05_92:
    speaker: dorothy
    en: "... Very well."
    ko: "…그러죠."
    ja: "…ええ。"
  d_main_46_af_05_93:
    speaker: burningum
    en: Oh, and by the way.
    ko: 아, 그리고 자네.
    ja: ああ、それと、君…
  d_main_46_af_05_94:
    speaker: "<Self>"
    en: Yes?
    ko: 예.
    ja: はい
  d_main_46_af_05_95:
    speaker: burningum
    en: Well done.
    ko: 잘했어.
    ja: あれでいい。
  d_main_46_af_05_96:
    speaker: burningum
    en: In times of chaos like this, it's more helpful to convey just the immediate
      situation than to go into detail.
    ko: 이런 혼란에선 자세한 걸 설명하기보단 현재 눈앞 상황의 전후 관계만을 명료하게 전달하는 게 도움이 되지.
    ja: |-
      これだけ混乱した状況では
      詳しい説明をするより、目に見えていることに
      集中して伝えることが重要だ。
  d_main_46_af_05_97:
    speaker: burningum
    en: It also buys us time on our end, which is even better.
    ko: 우리 쪽에서도 시간을 벌 수 있어서 더 좋아.
    ja: 我々としても時間を稼げて、都合がいい。
  d_main_46_af_05_98:
    speaker: burningum
    en: You're still a little rough around the edges when it comes to knowing when
      to cut things off, but you'll improve.
    ko: 어디에서 끊어야 할지 파악하는 게 조금 미숙하지만… 그건 나아질 거야.
    ja: |-
      締め方はあと一歩というところだが…
      いずれ身に着けられるだろう。
  d_main_46_af_05_99:
    speaker: burningum
    en: Anyway, go inside and rest. We'll talk again soon.
    ko: |-
      아무튼 들어가서 쉬도록 해.
      조만간 다시 얘기하지.
    ja: |-
      とにかく、今は帰ってゆっくり休みたまえ。
      近いうちにまた話をしよう。
  d_main_46_af_05_100:
    speaker: "<Self>"
    en: Understood. Thank you.
    ko: 알겠습니다. 감사합니다.
    ja: 分かりました。ありがとうございます
  d_main_46_af_05_101:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_102:
    speaker: rapi_red
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  d_main_46_af_05_103:
    speaker: dorothy
    en: "... Yes?"
    ko: "…예."
    ja: "…はい。"
  d_main_46_af_05_104:
    speaker: rapi_red
    en: Behave yourself, and don't cause any trouble at the Rehabilitation Center.
    ko: |-
      갱생관에서 얌전히 있어.
      소란 피우지 말고.
    ja: |-
      更生館では大人しくしていて。
      騒ぎを起こしてはダメよ。
  d_main_46_af_05_105:
    speaker: anis_i_w
    en: I'll hook you up with some outside food.
    ko: 사식 넣어줄게.
    ja: 差し入れしてあげるから。
  d_main_46_af_05_106:
    speaker: neon_v_w
    en: Any magazines you want, just say the word.
    ko: 필요한 잡지 있으면 말씀해 주시고요.
    ja: 読みたい雑誌があったら、教えてください。
  d_main_46_af_05_107:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_05_108:
    speaker: dorothy
    en: You three are absurd.
    ko: 기가 막혀서 정말.
    ja: あなたたちという人は、本当に…
d_main_46_af_06:
  d_main_46_af_06_1:
    speaker: "<Narration>"
    en: Dorothy and Burningum stare at each other.
    ko: 도로시와 버닝엄은 서로를 바라보고 있었다.
    ja: |-
      ドロシーとバーニンガムが
      無言でにらみ合っている
  d_main_46_af_06_2:
    speaker: "<Narration>"
    en: After more than ten minutes, Dorothy begins to grow restless.
    ko: |-
      10분이 넘는 시간.
      도로시는 슬슬 초조함을 느꼈다.
    ja: |-
      10分以上続いた頃、
      ドロシーに焦りが生まれた
  d_main_46_af_06_3:
    speaker: "<Narration>"
    en: Just as she is about to speak, Burningum opens his mouth.
    ko: 입을 떼려는 순간, 버닝엄이 입을 열었다.
    ja: |-
      口を開こうとした矢先、
      バーニンガムが先に話を始めた
  d_main_46_af_06_4:
    speaker: burningum
    en: You were too hasty.
    ko: 너무 서둘렀어.
    ja: 先を急ぎすぎだ。
  d_main_46_af_06_5:
    speaker: burningum
    en: Inciting Nikkes and citizens to rise up toward a Third Surface Reclamation
      War.
    ko: 니케들과 시민들을 선동해서 3차 지상 탈환전이라니.
    ja: |-
      ニケや群衆を扇動し、
      第三次地上奪還戦を始めさせようなどと…
  d_main_46_af_06_6:
    speaker: burningum
    en: Did you really think that would work?
    ko: 그런 게 가능할 거라 생각했나?
    ja: 本当にできると思っていたのか？
  d_main_46_af_06_7:
    speaker: dorothy
    en: All of you were dragging your feet. It was frustrating.
    ko: 당신들이 너무 아무것도 안 하고 있으니 답답해서 그랬죠.
    ja: |-
      あなたがいつまで経っても何もしないので
      やむを得ずそうしたまでです。
  d_main_46_af_06_8:
    speaker: burningum
    en: So the Queen really has descended.
    ko: 퀸이 내려온 건 정말인가 보군.
    ja: クイーンの降下は事実か。
  d_main_46_af_06_9:
    speaker: dorothy
    en: Yes. She has.
    ko: 예. 맞아요.
    ja: ええ。そうです。
  d_main_46_af_06_10:
    speaker: burningum
    en: Then the destruction of Eden must be true as well.
    ko: 에덴이 괴멸된 것도 정말이겠고.
    ja: エデンの壊滅も。
  d_main_46_af_06_11:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_12:
    speaker: burningum
    en: And you really are Dorothy of the Goddess Squad.
    ko: 갓데스의 도로시인 것도 정말이겠군.
    ja: 君がゴッデスのドロシーであることも。
  d_main_46_af_06_13:
    speaker: dorothy
    en: Yes.
    ko: 그래요.
    ja: ええ。
  d_main_46_af_06_14:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_15:
    speaker: burningum
    en: Right, I've known that all along.
    ko: 그래. 그건 알고 있었어.
    ja: まあ、それは知っていたがな。
  d_main_46_af_06_16:
    speaker: dorothy
    en: "... What?"
    ko: "…뭐라고요?"
    ja: "…なんですって？"
  d_main_46_af_06_17:
    speaker: burningum
    en: I knew you were Dorothy of the Goddesses from the moment we first met.
    ko: 네가 갓데스의 도로시라는 것은, 처음 만났을 때부터 알고 있었어.
    ja: |-
      君がかのゴッデス部隊のドロシーということは
      初めて会った時から知っていた。
  d_main_46_af_06_18:
    speaker: dorothy
    en: I knew those in the Ark regarded us as legends, but I didn't expect a Deputy
      Chief of all people to buy into it...
    ko: |-
      방주에서는 전설 취급 아니었나요?
      그런 걸 믿었다니, 방주의 부사령관이나 된 인간이-
    ja: |-
      アークでは伝説のようなものだったのでしょう？
      そんな話を信じるなど、
      アークの副司令官としては…
  d_main_46_af_06_19:
    speaker: burningum
    en: When we first met, you asked me something.
    ko: 처음 만났을 때 네가 물어본 것이 있어.
    ja: 初対面の時、君が聞いてきたことがあったな。
  d_main_46_af_06_20:
    speaker: burningum
    en: You mentioned someone's name and asked if I knew it.
    ko: 누군가의 이름을 대며, 그 이름을 모르냐고 물어봤었지.
    ja: 尋ね人だ。名前と、その人物の行方を聞かれた。
  d_main_46_af_06_21:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_22:
    speaker: burningum
    en: Oswald.
    ko: 오스왈드.
    ja: オスワルド。
  d_main_46_af_06_23:
    speaker: burningum
    en: He's my grandfather, although not by blood.
    ko: |-
      내 조부님이야.
      피는 이어지지 않았지만.
    ja: |-
      私の祖父にあたる。
      血のつながりはないがな。
  d_main_46_af_06_24:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_46_af_06_25:
    speaker: "<Narration>"
    en: Dorothy springs to her feet.
    ko: 도로시가 벌떡 일어났다.
    ja: ドロシーがやにわに立ち上がった
  d_main_46_af_06_26:
    speaker: dorothy
    en: You...!
    ko: 당신…!!
    ja: あなたは…！！
  d_main_46_af_06_27:
    speaker: burningum
    en: Please sit. Causing a scene won't help anything.
    ko: 앉아 줘. 소란을 피워서 좋을 건 없으니.
    ja: |-
      座ってくれ。
      ここで騒ぐのは得策ではない。
  d_main_46_af_06_28:
    speaker: burningum
    en: I'll explain.
    ko: 설명할게.
    ja: 説明はする。
  d_main_46_af_06_29:
    speaker: dorothy
    en: That would be wise.
    ko: 그래야 할 거예요.
    ja: そうしてください。
  d_main_46_af_06_30:
    speaker: "<Narration>"
    en: Dorothy sits back down.
    ko: 도로시가 자리에 앉는다.
    ja: ドロシーが座り直した
  d_main_46_af_06_31:
    speaker: burningum
    en: I doubted you.
    ko: 나는 너를 의심했어.
    ja: 私は君を疑っていた。
  d_main_46_af_06_32:
    speaker: burningum
    en: I wasn't convinced that you were truly Dorothy from the Goddess Squad.
    ko: 네가 정말 갓데스의 도로시가 맞는지 의심했지.
    ja: |-
      君が本当に、
      あのゴッデスのドロシーかどうか。
  d_main_46_af_06_33:
    speaker: burningum
    en: I saw through your true intentions of either destroying or taking over the
      Ark early on.
    ko: |-
      네 속내는 일찌감치 파악하고 있었어.
      방주를 부수거나 빼앗을 의도가 너무 보였지.
    ja: |-
      君の企みは最初からほぼ分かっていた。
      アークを狙っていることは
      隠しきれていなかったからな。
  d_main_46_af_06_34:
    speaker: burningum
    en: But I couldn't bring myself to dispose of you.
    ko: 하지만 처분하지 못했어.
    ja: だが、それだけで処分することも出来なかった。
  d_main_46_af_06_35:
    speaker: burningum
    en: According to my grandfather's records, you were the most radiant Goddess of
      Victory of all.
    ko: 조부님의 기록상에서 너는, 그 누구보다 빛나는 승리의 여신이었으니까.
    ja: |-
      祖父の残していた記録の中で、
      君は誰よりも輝く勝利の女神だったからだ。
  d_main_46_af_06_36:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "……！！"
  d_main_46_af_06_37:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_38:
    speaker: burningum
    en: My grandfather Oswald...
    ko: 조부님은. 오스왈드 할아버지는.
    ja: 私の祖父…つまり、オスワルドは…
  d_main_46_af_06_39:
    speaker: burningum
    en: He allowed himself to be disgraced in order to protect you all.
    ko: 너희를 지키기 위해 오명을 뒤집어썼다.
    ja: 君たちを守るために、憎まれ役を買っていた。
  d_main_46_af_06_40:
    speaker: dorothy
    en: What... are you talking about?
    ko: 무슨… 소린가요.
    ja: どういう…ことです。
  d_main_46_af_06_41:
    speaker: burningum
    en: After Operation Ark Guardian ended, the Ark deliberated over what to do with
      the Goddess Squad.
    ko: "…아크 가디언 작전 종료 후, 방주는 갓데스 스쿼드의 처분에 대해 고민했어."
    ja: |-
      …アークガーディアン作戦の後、
      アークはゴッデス部隊の処分を考えていた。
  d_main_46_af_06_42:
    speaker: burningum
    en: They were certain you would wield influence far beyond the Central Government.
    ko: 중앙 정부를 아득히 뛰어넘는 영향력을 행사할 것이라고 확신했지.
    ja: |-
      中央政府をはるかに凌ぐ影響力を持つ存在に
      なるというのは、分かりきったことだ。
  d_main_46_af_06_43:
    speaker: burningum
    en: So on the day you returned to the Ark, they mobilized every method they could.
    ko: |-
      그래서 방주로 돌아오는 날,
      쓸 수 있는 모든 방법을 동원해.
    ja: |-
      そこで、アークへ帰還する時を狙い、
      あらゆる手を使って…
  d_main_46_af_06_44:
    speaker: burningum
    en: To bring you Goddesses down, and to drag you from your pedestal.
    ko: |-
      갓데스를 추락시키려고 했어.
      우상에서 끌어내리려고 했지.
    ja: |-
      ゴッデスを陥れる計画があった。
      全ての名誉を失わせようとしていた。
  d_main_46_af_06_45:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_46:
    speaker: burningum
    en: No one adored the Goddess Squad more than my grandfather.
    ko: |-
      조부님은 갓데스의 광팬이셨어.
      그 누구보다.
    ja: |-
      祖父は誰よりもゴッデスを信奉していた。
      熱狂的ファンと言ってもいい。
  d_main_46_af_06_47:
    speaker: burningum
    en: He held a high enough position to oversee the entirety of Operation Ark Guardian.
    ko: 아크 가디언 작전의 총책임자를 맡으실 정도로 높은 위치에 앉아계셨지.
    ja: |-
      その祖父はアークガーディアン作戦の
      総責任者を任されるほどの人物だった。
  d_main_46_af_06_48:
    speaker: burningum
    en: "... So he abandoned the Goddess Squad."
    ko: "…그래서, 갓데스 스쿼드를 버렸다."
    ja: |-
      …その立場を使って、
      ゴッデス部隊を締めだした。
  d_main_46_af_06_49:
    speaker: burningum
    en: Because it was obvious to anyone that they would be destroyed if they returned
      to the Ark.
    ko: 방주로 돌아온 우상이, 망가질 것이 너무 눈에 보였기 때문이야.
    ja: |-
      アークに戻ればゴッデスは
      名前も残らなくなると知ってのことだ。
  d_main_46_af_06_50:
    speaker: dorothy
    en: You honestly expect me to believe that?
    ko: 그걸… 지금 저보고 믿으라고…!
    ja: そんな話…今さら信じろと…！？
  d_main_46_af_06_51:
    speaker: burningum
    en: I know, there's no evidence of it.
    ko: |-
      그래. 증거는 없지.
      하지만.
    ja: |-
      そうだな。証拠として見せられるものもない。
      だが…
  d_main_46_af_06_52:
    speaker: burningum
    en: But back then, the Central Government was filled with the likes of Doban.
    ko: 당시의 중앙 정부에는 도반 같은 놈들이 득실댔다.
    ja: |-
      当時の中央政府には、
      ドバンのような連中が何人もいたようだ。
  d_main_46_af_06_53:
    speaker: dorothy
    en: If you're going to lie, you should at least get your stories straight.
    ko: "…거짓말도 좀 입을 맞추고 하는 게 어때요?"
    ja: |-
      …嘘をつくのでしたら、
      口裏程度は合わせておけばいかがですか？
  d_main_46_af_06_54:
    speaker: dorothy
    en: What you're saying contradicts Doban's account considerably.
    ko: 도반이 말한 것과는 내용이 너무 다르네요.
    ja: |-
      ドバンの言っていたこととは
      話があまりに違いすぎます。
  d_main_46_af_06_55:
    speaker: burningum
    en: Doban was lying.
    ko: 도반의 말은 거짓말이야.
    ja: あいつの話を信じるな。
  d_main_46_af_06_56:
    speaker: dorothy
    en: Do you really expect me to believe you on your word alone?
    ko: 그렇게 말하면 제가 믿을 거라 생각하나요?
    ja: そう言われて、私が従うとお考えで？
  d_main_46_af_06_57:
    speaker: burningum
    en: There's nothing more I can say.
    ko: 이 이상 얘기할 수 있는 건 없어.
    ja: それ以上、言えることが無いんだ。
  d_main_46_af_06_58:
    speaker: burningum
    en: Doban lied to provoke you. That's all there is to it.
    ko: 도반은 너를 자극하기 위해 거짓말을 했어. 이게 전부야.
    ja: 君を挑発するための嘘だった、それがすべてだ。
  d_main_46_af_06_59:
    speaker: dorothy
    en: Then how did he know how Pinne died?
    ko: 그게 어떻게 피나가 어떻게 떠났는지 알고 있는 거죠.
    ja: ならばなぜ、ピナの最期まで知っていたのです。
  d_main_46_af_06_60:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_61:
    speaker: burningum
    en: My grandfather apparently listened to every conversation in that temporary
      camp.
    ko: 조부님은 임시 캠프의 모든 대화를 듣고 있었다고 해.
    ja: |-
      祖父は臨時キャンプでの会話まで
      すべて聞いていたらしい。
  d_main_46_af_06_62:
    speaker: burningum
    en: He recorded it all in a book.
    ko: 그걸 책에 남겼고.
    ja: それを記録に残していた。
  d_main_46_af_06_63:
    speaker: dorothy
    en: "... He heard everything?"
    ko: 다… 듣고 있었다고요.
    ja: 全部…聞いていた？
  d_main_46_af_06_64:
    speaker: burningum
    en: Yes.
    ko: 그래.
    ja: そうだ。
  d_main_46_af_06_65:
    speaker: burningum
    en: It seems he originally intended to wait longer, since moving too hastily could
      have exposed him.
    ko: |-
      …원래는 더 기다리려고 했던 모양이야.
      섣불리 움직이면 발각될 수 있었으니까.
    ja: |-
      …本当はもう少し
      引き延ばす予定だったようだ。
      あまり事を急げば、発覚してしまうからな。
  d_main_46_af_06_66:
    speaker: burningum
    en: But after what happened to you, he moved up the schedule.
    ko: "…너한테 그런 일이 생긴 후, 예정을 앞당긴 거야."
    ja: |-
      …だが、君に起こったことを知って、
      予定を前倒しにした。
  d_main_46_af_06_67:
    speaker: burningum
    en: Because he feared the Goddesses would crumble.
    ko: 갓데스가 무너질까봐.
    ja: ゴッデスが耐えきれなくなると思ったのだろう。
  d_main_46_af_06_68:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_69:
    speaker: dorothy
    en: Why didn't anyone say anything?
    ko: 왜 말하지 않았죠.
    ja: なぜ、そう言わなかったのですか。
  d_main_46_af_06_70:
    speaker: dorothy
    en: If what you're saying is true, why did he abandon us instead of telling the
      truth?
    ko: |-
      당신이 말한 게 사실이라면,
      왜 그때 사실대로 말하지 않고 버렸냐고요.
    ja: |-
      あなたの話が事実なら、なぜあの時私たちは
      真実を聞けずに見捨てられたのです。
  d_main_46_af_06_71:
    speaker: burningum
    en: Because even if he told you that entering the Ark meant you would be placed
      on trial, destroyed politically, and buried under false charges...
    ko: "[방주에 들어오면 당신들은 시험대 위에 올려지고, 정치적으로 말살될 것이며, 온갖 누명을 쓸 것입니다.]"
    ja: |-
      「アークに戻れば、ゴッデスは
      政治的に消され、実験台に送られ、
      あらゆる濡れ衣を着せられる」
  d_main_46_af_06_72:
    speaker: burningum
    en: You would still insist on coming to confirm it for yourselves.
    ko: |-
      라고 얘기한다면 갓데스는 방주로 왔을 거다.
      그럴 리가 없으니 직접 확인하겠다고.
    ja: |-
      そう言っても、ゴッデスは
      アークへ向かっただろうな。
      そんなはずがない、自分の目で確かめると。
  d_main_46_af_06_73:
    speaker: burningum
    en: That was how deep your trust in the Ark ran after all.
    ko: 방주를 그만큼 신용했을 테니까.
    ja: 君たちはアークをそれほどまでに信用していた。
  d_main_46_af_06_74:
    speaker: burningum
    en: If he'd told you that there was a problem in the Ark and that he'd contact
      you later, you would never have left the Ark's entrance.
    ko: |-
      [방주에 문제가 생겼으니 나중에 연락하겠습니다.]
      라고 얘기한다면 갓데스는 방주 입구를 떠나지 않았을 거다.
    ja: |-
      「問題が起きたので、後で連絡します」
      これもダメだ。おそらくゴッデスは
      アークの入り口から離れようとしなくなる。
  d_main_46_af_06_75:
    speaker: burningum
    en: Because your concern for the Ark ran that deep.
    ko: 방주를 그만큼 걱정했을 테니까.
    ja: 君たちがアークを大事に思っていたからだ。
  d_main_46_af_06_76:
    speaker: burningum
    en: From my grandfather's perspective, he needed a lie that was convincingly realistic.
    ko: 조부님 입장에서는, 적절히 현실감 있는 거짓말을 할 필요가 있었어.
    ja: |-
      祖父の立場からして、
      それなりに現実味のある作り話が必要だった。
  d_main_46_af_06_77:
    speaker: burningum
    en: A lie that would keep you away from the Ark.
    ko: 방주로 오지 않게 할 거짓말을.
    ja: ゴッデスがアークから離れるような話だ。
  d_main_46_af_06_78:
    speaker: burningum
    en: Even if it bred hatred, rage, or a thirst for revenge.
    ko: 비록 그게 증오나 분노, 복수심으로 인한 것일지라도.
    ja: |-
      たとえそれが自分への憎悪や憎しみ、
      復讐心によるものだとしても。
  d_main_46_af_06_79:
    speaker: burningum
    en: Even if it meant you would one day return to exact that revenge.
    ko: 시간이 흘러, 갓데스가 다시 방주로 와서 복수를 할지언정.
    ja: |-
      時が流れて、ゴッデスがいつかアークに
      復讐することも目指さないような…
  d_main_46_af_06_80:
    speaker: burningum
    en: He wanted to make sure you never wished to set eyes on the Ark again.
    ko: 방주를 다시는 보고 싶지 않게 하고 싶으셨겠지.
    ja: |-
      できれば二度とアークを見たくないと
      思わせる話を作る必要があったのだろう。
  d_main_46_af_06_81:
    speaker: dorothy
    en: Then why didn't he call us back afterward?
    ko: 그럼 그 이후에 저희를 다시 부르지 않은 이유는요.
    ja: |-
      ではそれ以降、アーク側から
      私たちへの通信が絶えた理由は？
  d_main_46_af_06_82:
    speaker: burningum
    en: The Ark had long been dominated by V.T.C., and V.T.C. would never have tolerated
      your existence.
    ko: |-
      방주는 오랫동안 V.T.C.가 지배하고 있었어.
      V.T.C.는 너희의 존재를 절대 용인하지 않았지.
    ja: |-
      アークは長い間、V.T.C.という組織が
      支配していた。V.T.C.は君たちの存在を
      許そうとしなかった。
  d_main_46_af_06_83:
    speaker: burningum
    en: There was nothing he could do, since they were too powerful.
    ko: |-
      할 수 있는 게 없었어.
      너무 큰 힘이었거든.
    ja: |-
      できることは何もなかった。
      V.T.C.の支配力があまりに強すぎたからだ。
  d_main_46_af_06_84:
    speaker: burningum
    en: So my grandfather filed a false report saying the Goddess Squad had deserted.
    ko: 그래서 조부님은 갓데스 스쿼드가 탈주했다고 거짓 보고를 올렸다.
    ja: |-
      そこで祖父は、ゴッデス部隊は
      脱走したという報告をでっち上げた。
  d_main_46_af_06_85:
    speaker: burningum
    en: Later, after V.T.C. was destroyed, the situation improved.
    ko: "…추후, V.T.C.가 괴멸하는 일이 일어나 상황이 좋아졌지만."
    ja: |-
      …その後、V.T.C.は壊滅し
      状況は変わったが…
  d_main_46_af_06_86:
    speaker: burningum
    en: But too much time had passed at that point, there was no way to find any of
      you.
    ko: |-
      너무 많은 시간이 흐른 뒤였지.
      너희를 찾을 방법이 없었어.
    ja: |-
      その時にはもうかなりの時間が経っていて、
      君たちを探す方法が無くなっていた。
  d_main_46_af_06_87:
    speaker: dorothy
    en: Then that means you knew what we went through.
    ko: 그렇다면 당신은, 우리가 무슨 꼴을 당했는지도 다 알았고.
    ja: |-
      その話が正しければあなたは、
      私たちがどのような目に遭ってきたか
      全てを知っていて…
  d_main_46_af_06_88:
    speaker: dorothy
    en: You knew my true identity when I came to the Ark, so that means you knew of
      my objectives too.
    ko: |-
      방주에 온 제 정체도 알고 있었고,
      제 목적도 알고 있었다는 얘기인데.
    ja: |-
      アークに来た私が何者かも、
      私の目的も初めから知っていたと
      いうことになりますね。
  d_main_46_af_06_89:
    speaker: dorothy
    en: Then why did you stay silent? Did you want to humiliate me?
    ko: |-
      왜 잠자코 있었죠?
      저를 모독하고 싶어서?
    ja: |-
      なぜ黙っていたのです？
      私をあざ笑うためですか？
  d_main_46_af_06_90:
    speaker: burningum
    en: As I said before, I doubted you.
    ko: 좀 전에도 말했지만, 나는 너를 의심했어.
    ja: さっきも言った通り、君を疑っていたからだ。
  d_main_46_af_06_91:
    speaker: burningum
    en: It was far too obvious that you had come to the Ark for revenge after being
      abandoned like that.
    ko: 그렇게 버림받은 네가, 방주에 복수를 하러 온 게 너무 뻔했으니까.
    ja: |-
      事の顛末を知っていれば、
      いつかアークへ復讐に戻ると考えるのは
      当然の想像だろう。
  d_main_46_af_06_92:
    speaker: burningum
    en: So I kept watch this whole time.
    ko: 그래서 계속 지켜봤어. 지금까지 계속.
    ja: |-
      だから、様子をうかがっていたんだ。
      たった今まで。
  d_main_46_af_06_93:
    speaker: burningum
    en: To determine whether you were the Dorothy of the past, or the Dorothy of the
      present, blinded by revenge.
    ko: 네가 [과거]의 도로시인지, 지금의 복수심에 눈먼 도로시인지 확인하기 위해.
    ja: |-
      君が「昔のまま」のドロシーなのか、
      復讐心に燃える変わり果てたドロシーなのか
      確かめなければならなかった。
  d_main_46_af_06_94:
    speaker: burningum
    en: And I came to a conclusion.
    ko: 그리고 결론을 내렸어.
    ja: だがもう、答えは出た。
  d_main_46_af_06_95:
    speaker: dorothy
    en: Your grandfather would have been heartbroken to see what became of the Dorothy
      he once knew.
    ko: |-
      당신의 조부님이 슬퍼하겠군요.
      과거의 도로시가 지금 이렇게 되어서요.
    ja: |-
      あなたのおじい様は悲しむでしょうね。
      そのドロシーが
      こんな有り様になってしまうなんて。
  d_main_46_af_06_96:
    speaker: dorothy
    en: But you know what? The only reason I'm this way is because of you...
    ko: |-
      그런데 그거 아나요?
      제가 이렇게 된 건 모두 당신들 때문-
    ja: |-
      ですが、分かっていますか？
      私がこうなったのも、すべてあなたたちの…
  d_main_46_af_06_97:
    speaker: burningum
    en: I'm sorry.
    ko: 미안하다.
    ja: 申し訳ない。
  d_main_46_af_06_98:
    speaker: "<Narration>"
    en: Dorothy freezes.
    ko: 도로시가 굳는다.
    ja: ドロシーの言葉が止まった
  d_main_46_af_06_99:
    speaker: dorothy
    en: What... did you say?
    ko: 뭐… 라고요?
    ja: 今…なんと？
  d_main_46_af_06_100:
    speaker: burningum
    en: I can't speak for the entire Ark, but I apologize.
    ko: 미안하다. 방주를 대표할 순 없겠지만, 사과하겠다.
    ja: |-
      申し訳ない。
      アーク全てを代表することはできないが、
      このとおり謝罪する。
  d_main_46_af_06_101:
    speaker: dorothy
    en: I... I didn't come here for an apology.
    ko: 제가… 그딴소리나 들으려고….
    ja: 私は…そんなことが聞きたかったわけでは…
  d_main_46_af_06_102:
    speaker: burningum
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  d_main_46_af_06_103:
    speaker: burningum
    en: What do you want from the Ark?
    ko: 너는 방주를 어떻게 하고 싶은 거지?
    ja: 君はアークをどうしたい。
  d_main_46_af_06_104:
    speaker: dorothy
    en: I... The Ark...
    ko: 저는… 방주를….
    ja: 私は…アークを…
  d_main_46_af_06_105:
    speaker: dorothy
    en: I want to seize it... and get my revenge...
    ko: 빼앗… 고 복수를….
    ja: 奪って…復讐…を…
  d_main_46_af_06_106:
    speaker: burningum
    en: No.
    ko: 아니야.
    ja: 違うな。
  d_main_46_af_06_107:
    speaker: burningum
    en: You cannot.
    ko: 너는 못 해.
    ja: 君にそんなことはできない。
  d_main_46_af_06_108:
    speaker: burningum
    en: As I said, I reached a conclusion after observing you,
    ko: 내가 너를 지켜본 결과 결론을 내렸다고 했었지.
    ja: 私は君の様子を見て、答えを出したと言った。
  d_main_46_af_06_109:
    speaker: burningum
    en: and my conclusion is this.
    ko: 내 결론은 이거다.
    ja: これが私の答えだ。
  d_main_46_af_06_110:
    speaker: burningum
    en: You won't act against the Ark.
    ko: 너는 방주에 복수할 수 없어.
    ja: 君がアークに復讐することはできない。
  d_main_46_af_06_111:
    speaker: dorothy
    en: "...!"
    ko: "--!!"
    ja: "――！！"
  d_main_46_af_06_112:
    speaker: dorothy
    en: I could reduce the Ark to ruins right now if I wanted to!
    ko: 지금 당장이라도 방주를 엉망으로 만들어 버릴 수 있어요!
    ja: |-
      今すぐめちゃくちゃにすることも
      できるのですよ！？
  d_main_46_af_06_113:
    speaker: burningum
    en: Perhaps. But you won't.
    ko: 그렇겠지. 하지만 못 해.
    ja: やろうと思えば、できるだろう。
  d_main_46_af_06_114:
    speaker: burningum
    en: You had the power, the ability, the charisma, and yet you didn't.
    ko: 힘과 능력, 카리스마까지 있었음에도 그러지 않았어.
    ja: |-
      そうするだけの武力も知力も、統率力もある。
      だがそうはしなかった。
  d_main_46_af_06_115:
    speaker: burningum
    en: You deliberately took the long way around.
    ko: 굳이 길을 돌아갔어.
    ja: あえて遠回りをしている。
  d_main_46_af_06_116:
    speaker: burningum
    en: You saved the Ark from the brink of ruin multiple times.
    ko: 몇 번이나 방주를 위기에서 구해줬고.
    ja: 君は何度もアークを危機から救った。
  d_main_46_af_06_117:
    speaker: burningum
    en: You were happy when Nikkes and people thanked you.
    ko: 니케와 사람들의 감사 인사에 기뻐했지.
    ja: ニケや人間からの感謝の言葉に喜んでいた。
  d_main_46_af_06_118:
    speaker: burningum
    en: As you said, you could have had your revenge at any moment you wanted. But
      you didn't act on it.
    ko: 네 말대로 당장이라도 복수할 수 있었겠지만, 그러지 않았어.
    ja: |-
      君の言う通り、君は今すぐにでも
      復讐を果たせる。だがそうしていない。
  d_main_46_af_06_119:
    speaker: burningum
    en: Watching you fail to fire a single shot at Doban was what convinced me.
    ko: |-
      이번 건으로 더 확신하게 됐어.
      도반에게 총 한 발 쏘지 못하는 너를 보고 확신했어.
    ja: |-
      今回の件で、確信ができた。
      君はあのドバンにさえ一発も撃てなかった。
  d_main_46_af_06_120:
    speaker: burningum
    en: You can't do it.
    ko: 너는 못 해.
    ja: 君にはできない。
  d_main_46_af_06_121:
    speaker: burningum
    en: Because you are a Goddess.
    ko: 갓데스니까.
    ja: 君はまだゴッデスで…
  d_main_46_af_06_122:
    speaker: burningum
    en: The Goddess of Victory.
    ko: 승리의 여신이니까.
    ja: 勝利の女神だ。
  d_main_46_af_06_123:
    speaker: burningum
    en: That's why you cannot do harm to the Ark.
    ko: 너는 방주에 복수할 수 없어.
    ja: 君がアークに復讐を果たすことはない。
  d_main_46_af_06_124:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_af_06_125:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_126:
    speaker: burningum
    en: It's pitiful in a way.
    ko: 가엾다.
    ja: 哀れなものだ。
  d_main_46_af_06_127:
    speaker: burningum
    en: You dreamed of revenge for such a long time, yet you soften immediately at
      the slightest recognition and respect.
    ko: |-
      그 오랜 시간 복수를 꿈꿔왔으면서,
      짧은 인정과 경의 따위에 바로 마음을 푸는 게.
    ja: |-
      長いあいだ燃やしてきた復讐心が、
      わずかな承認や敬意を得られただけで
      揺らいでしまうものだとは。
  d_main_46_af_06_128:
    speaker: burningum
    en: It's regrettable.
    ko: 안타깝다.
    ja: 不憫なものだ。
  d_main_46_af_06_129:
    speaker: burningum
    en: And yet you cannot help but love Nikkes, humans, and humanity itself.
    ko: |-
      그럼에도 니케를, 인간을.
      인류를 사랑할 수밖에 없는 네가.
    ja: |-
      それでもニケや人間を…
      人類を愛することしかできない君は。
  d_main_46_af_06_130:
    speaker: burningum
    en: It's truly sad.
    ko: 슬프다.
    ja: そして、悲しいことだ。
  d_main_46_af_06_131:
    speaker: burningum
    en: That you're destined only to be used by others, despite having the wherewithal
      to take revenge, yet unable to go through with it.
    ko: |-
      좋을 대로 이용만 당할 뿐,
      복수할 생각과 능력이 있었지만 그러지 못한
    ja: |-
      いいように利用されるばかりで、
      復讐を果たせるほどの知恵も力もありながら、
      それを活かせない…
  d_main_46_af_06_132:
    speaker: burningum
    en: How foolish of you.
    ko: 너의 그 바보 같음이.
    ja: 君の愚直さは。
  d_main_46_af_06_133:
    speaker: dorothy
    en: Why you...! Who are you to talk to me like that?!
    ko: 당신이…! 당신이 나에 대해 뭘 안다고 그딴 식으로…!
    ja: |-
      勝手なことを…！
      何が分かるというのです…！
  d_main_46_af_06_134:
    speaker: burningum
    en: And that's precisely why...
    ko: 그렇기에.
    ja: だからこそ…
  d_main_46_af_06_135:
    speaker: burningum
    en: You're still the Goddess of Victory.
    ko: 너는 아직까지 승리의 여신인 거야.
    ja: 君はまだ勝利の女神のままだ。
  d_main_46_af_06_136:
    speaker: dorothy
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_46_af_06_137:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_138:
    speaker: burningum
    en: I can't leave you like this.
    ko: 너를 이대로 가만히 둘 수 없어.
    ja: 君をこれ以上泳がせておくこともできん。
  d_main_46_af_06_139:
    speaker: burningum
    en: Tell me clearly. Are you an enemy or an ally?
    ko: 적인지, 아군인지 확실히 해줘.
    ja: 敵になるか味方になるか、覚悟を決めたまえ。
  d_main_46_af_06_140:
    speaker: burningum
    en: If you are our enemy, we will strike you down.
    ko: 적이라면 쓰러뜨릴 것이고.
    ja: 敵であれば打ち倒す。
  d_main_46_af_06_141:
    speaker: burningum
    en: But if you are still our Goddess of Victory, the Ark will help you.
    ko: 네가 아직 승리의 여신이라면, 방주는 너를 돕는다.
    ja: |-
      だが君が今も勝利の女神であるというなら、
      アークは君を助けるだろう。
  d_main_46_af_06_142:
    speaker: burningum
    en: Without fail.
    ko: 반드시 돕는다.
    ja: そうなることは、約束する。
  d_main_46_af_06_143:
    speaker: burningum
    en: We will help you become the Goddess of Victory once again. Humanity's hope.
      A true Goddess.
    ko: 너를 다시 승리의 여신, 인류의 희망, 갓데스가 되도록 돕겠다.
    ja: |-
      君が再び勝利の女神、人類の希望、
      ゴッデスとなれるよう、力を尽くそう。
  d_main_46_af_06_144:
    speaker: dorothy
    en: Please... stop. Don't say any more.
    ko: |-
      더 이상….
      말하지… 말아줘요. 제발.
    ja: |-
      それ以上…
      何も言わないでください。お願いです。
  d_main_46_af_06_145:
    speaker: "<Narration>"
    en: Because Dorothy feels like she might start to hope again.
    ko: 또 희망을 가지게 될 것만 같으니까.
    ja: また希望を持たせないで
  d_main_46_af_06_146:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_147:
    speaker: "<Narration>"
    en: Burningum places an old book on the table titled Dorothy.
    ko: |-
      버닝엄이 책 한 권을 테이블 위에 올려놨다.
      도로시라는 제목의 낡은 책이다.
    ja: |-
      バーニンガムが1冊の古びた本を
      テーブルの上に置いた。
      表題にドロシーと書かれている
  d_main_46_af_06_148:
    speaker: burningum
    en: This is a handwritten record about you that my grandfather left behind.
    ko: 조부님이 직접 수기로 남긴, 너에 대한 기록이야.
    ja: 祖父が手書きで残した、君に関する記録だ。
  d_main_46_af_06_149:
    speaker: burningum
    en: Read it. You deserve that much.
    ko: 읽어 줘. 너라면 읽을 자격이 있으니까.
    ja: 読みたまえ。君にはその資格がある。
  d_main_46_af_06_150:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_151:
    speaker: "<Monologue>"
    en: Burningum rises from his seat,
    ko: 버닝엄이 자리에서 일어난다.
    ja: バーニンガムは立ち上がり…
  d_main_46_af_06_152:
    speaker: "<Monologue>"
    en: then turns and walks out.
    ko: 뒤돌아 나간다.
    ja: 背中を向けて扉に向かった
  d_main_46_af_06_153:
    speaker: "<Monologue>"
    en: He looks back at Dorothy staring blankly at the book on the table.
    ko: 테이블 위의 책을 멍하니 보고 있는 도로시를 바라본다.
    ja: |-
      ドロシーは呆然と
      テーブルの上の本を見ている
  d_main_46_af_06_154:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_155:
    speaker: "<Monologue>"
    en: Burningum looks at Dorothy then straightens.
    ko: 버닝엄이 도로시를 바라보고 똑바로 선다.
    ja: |-
      バーニンガムが姿勢を正し、
      ドロシーを見た
  d_main_46_af_06_156:
    speaker: "<Monologue>"
    en: Dorothy lifts her head and looks back at Burningum.
    ko: 도로시가 고개를 들어 버닝엄을 바라본다.
    ja: ドロシーが顔を上げ、バーニンガムを見返した
  d_main_46_af_06_157:
    speaker: burningum
    en: There was something I always wanted to say to you if I ever met you.
    ko: "…언젠가, [도로시]를 만나게 되면 꼭 해주고 싶은 말이 있었어."
    ja: |-
      …いつか「ドロシー」に会えたら、
      言いたいことがあったんだ。
  d_main_46_af_06_158:
    speaker: "<Monologue>"
    en: Burningum salutes.
    ko: 버닝엄이 경례한다.
    ja: バーニンガムが敬礼した
  d_main_46_af_06_159:
    speaker: burningum
    en: For fighting for humanity...
    ko: 인류를 위해 싸워준.
    ja: 人類のために戦う…
  d_main_46_af_06_160:
    speaker: "<Narration>"
    en: "'Please. Don't.'"
    ko: 안돼. 하지 마.
    ja: やめて、言わないで
  d_main_46_af_06_161:
    speaker: "<Narration>"
    en: "'Don't say it!'"
    ko: 하지 마!
    ja: やめて！
  d_main_46_af_06_162:
    speaker: burningum
    en: I sincerely thank the Goddess Squad.
    ko: 갓데스 스쿼드에게 감사를.
    ja: "…ゴッデス部隊に感謝を。"
  d_main_46_af_06_163:
    speaker: "<Narration>"
    en: The door closes.
    ko: 문이 닫힌다.
    ja: 扉が閉ざされた
  d_main_46_af_06_164:
    speaker: "<Narration>"
    en: Dorothy stares ahead blankly.
    ko: 도로시는 허공을 바라본다.
    ja: ドロシーは虚空を見つめ続けた
  d_main_46_af_06_165:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_06_166:
    speaker: dorothy
    en: No...
    ko: "…아."
    ja: "…あ…"
  d_main_46_af_06_167:
    speaker: dorothy
    en: Ugh...
    ko: "…아아…."
    ja: "…ああ…"
  d_main_46_af_06_168:
    speaker: dorothy
    en: How... how could I have been so foolish?
    ko: 어떻게 이렇게, 이렇게나 바보같이.
    ja: なぜ、なぜこんな、バカみたいに…
  d_main_46_af_06_169:
    speaker: dorothy
    en: So... easily...
    ko: 이렇게나… 쉽게….
    ja: こんな…簡単に…
  d_main_46_af_06_170:
    speaker: dorothy
    en: Ha... haha...
    ko: 하, 하하….
    ja: ふ、ふふ…
  d_main_46_af_06_171:
    speaker: "<Narration>"
    en: That evening...
    ko: 그날 저녁.
    ja: その日の夕方
  d_main_46_af_06_172:
    speaker: "<Narration>"
    en: Dorothy reads the book Burningum gave her.
    ko: 도로시는 버닝엄이 건네준 책을 읽었다.
    ja: |-
      ドロシーはバーニンガムから渡された
      手記を読み漁った
  d_main_46_af_06_173:
    speaker: "<Narration>"
    en: The final page...
    ko: 마지막 페이지.
    ja: 最後のページは…
  d_main_46_af_06_174:
    speaker: "<Narration>"
    en: is filled with nothing but words of guilt toward the Goddesses,
    ko: 갓데스에 대한 죄책감으로만 가득 차 있는 페이지를
    ja: |-
      ゴッデスへの罪悪感に満ちた言葉で
      埋め尽くされていた
  d_main_46_af_06_175:
    speaker: "<Narration>"
    en: which Dorothy stares at blankly through the entire night.
    ko: 도로시는 밤새도록 멍하니 바라보고만 있었다.
    ja: ドロシーは一晩中、それをぼんやりと見つめた
  d_main_46_af_06_176:
    speaker: "<Narration>"
    en: When morning comes,
    ko: 날이 밝았다.
    ja: 翌朝
  d_main_46_af_06_177:
    speaker: "<Narration>"
    en: she hears that a high-ranking official from the Central Government has requested
      a visit.
    ko: 중앙 정부의 고위 인사가 면회를 요청했다는 얘기를 듣는다.
    ja: |-
      ドロシーに対して、
      中央政府の上層部の何者かから
      面会希望の申し出があった
  d_main_46_af_06_178:
    speaker: "<Narration>"
    en: She doesn't want to go because it's certain to be an uncomfortable meeting.
    ko: |-
      도로시는 나가고 싶지 않았다.
      불편한 자리일 것이 분명했다.
    ja: |-
      ドロシーの気は進まなかった。
      どうせ自分にとってろくな話にはならない
  d_main_46_af_06_179:
    speaker: "<Narration>"
    en: Even so, she gets to her feet.
    ko: 그럼에도 도로시는 몸을 일으켰다.
    ja: それでも、ドロシーは身体を起こした
  d_main_46_af_06_180:
    speaker: "<Narration>"
    en: Dorothy sits in a chair in the visitation room.
    ko: 도로시는 면회실의 의자에 앉아 있었다.
    ja: 面会室の椅子に座り、相手を待った
  d_main_46_af_06_181:
    speaker: "<Narration>"
    en: Her visitor has yet to arrive.
    ko: 상대는 아직 오지 않았다.
    ja: 面会希望者はまだ来ていない
  d_main_46_af_06_182:
    speaker: "<Narration>"
    en: But Dorothy is relieved as she still wrestles with her feelings.
    ko: 마음을 아직 정하지 못한 도로시는 안도감을 느꼈다.
    ja: |-
      迷っているドロシーには、
      かえって落ち着く時間になった
  d_main_46_af_06_183:
    speaker: "<Narration>"
    en: A short while later, she hears the door opening behind her.
    ko: 그리고 잠시 후, 도로시의 등 뒤에 문이 열리는 소리가 들렸다.
    ja: しばらくして、背後の扉の開く音がした
d_main_46_af_07:
  d_main_46_af_07_1:
    speaker: "<Narration>"
    en: She does not turn around.
    ko: 도로시는 뒤돌아보지 않았다.
    ja: ドロシーは振り返らない
  d_main_46_af_07_2:
    speaker: "<Narration>"
    en: She hears the door close and the footsteps draw nearer.
    ko: 문이 닫히는 소리가 들리고, 발소리가 더 가까워진다.
    ja: 扉の閉まる音の後、足音が近づいてきた
  d_main_46_af_07_3:
    speaker: "<Narration>"
    en: Dorothy lowers her head and closes her eyes. A silent signal that she doesn't
      want to be spoken to.
    ko: |-
      도로시는 고개를 숙인 채 눈을 감는다.
      말을 걸지 않았으면 하는 의사 표현이다.
    ja: |-
      ドロシーはうつむいたまま、目を閉じた。
      話しかけるなという意思表示だ
  d_main_46_af_07_4:
    speaker: "<Narration>"
    en: Then, a familiar scent reaches her.
    ko: 그때, 익숙한 향기가 느껴졌다.
    ja: だが、覚えのある香りが漂ってきた
  d_main_46_af_07_5:
    speaker: "<Narration>"
    en: The scent of marigold.
    ko: 메리 골드.
    ja: マリーゴールド
  d_main_46_af_07_6:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: カチャリ――
  d_main_46_af_07_7:
    speaker: "<Narration>"
    en: She hears a teacup being placed in front of her,
    ko: 도로시의 앞에 찻잔이 놓이는 소리가 들렸다.
    ja: 自分の前にティーカップを置く音だ
  d_main_46_af_07_8:
    speaker: "<Narration>"
    en: and the sound of the chair across from her being pulled out and someone sitting
      in it.
    ko: 맞은 편의 의자를 끌어당겨 앉는 소리가 들린다.
    ja: 向かいの椅子が引かれ、誰かが腰を下ろした
  d_main_46_af_07_9:
    speaker: "<Narration>"
    en: A brief silence ensues.
    ko: 잠깐 동안의 정적.
    ja: しばらく沈黙が続いた
  d_main_46_af_07_10:
    speaker: "<Narration>"
    en: Then the sound of tea being sipped from across the table is heard.
    ko: 맞은 편에서 차를 마시는 소리가 들려온다.
    ja: 向かいから、茶を飲む音がした
  d_main_46_af_07_11:
    speaker: "<Narration>"
    en: Dorothy opens her eyes.
    ko: 도로시는 눈을 뜬다.
    ja: ドロシーは目を開いた
  d_main_46_af_07_12:
    speaker: "<Narration>"
    en: She looks at the golden liquid swirling in the teacup.
    ko: 찻잔에 찰랑이는 황금빛 액체를 바라본다.
    ja: ティーカップの中で黄金色が揺らめいている
  d_main_46_af_07_13:
    speaker: "<Narration>"
    en: After letting out a short sigh, Dorothy reaches for the cup.
    ko: |-
      도로시는 짧게 한숨을 내쉰 뒤,
      찻잔에 손을 뻗는다.
    ja: |-
      ドロシーは短いため息をつき、
      ティーカップに手を伸ばした
  d_main_46_af_07_14:
    speaker: "<Narration>"
    en: Just as she is about to grasp the handle, a voice speaks from across the table.
    ko: 손잡이를 잡으려는 순간, 맞은 편에서 목소리가 들려온다.
    ja: |-
      持ち手をつかんだ瞬間、
      向かい側から声が聞こえた
  d_main_46_af_07_15:
    speaker: andersen
    en: Hmm. Nothing beats a good cup of tea.
    ko: 흠. 역시 차만 한 게 없군.
    ja: やはり、これが一番か。
  d_main_46_af_07_16:
    speaker: andersen
    en: I see you're still as picky as ever.
    ko: 여전히 취향 하난 까다로워.
    ja: 好みにうるさいのは相変わらずだ。
  d_main_46_af_07_17:
    speaker: "<Narration>"
    en: Dorothy freezes and her pupils widen.
    ko: |-
      도로시는 그대로 멈췄다.
      동공이 커진다.
    ja: |-
      ドロシーは凍り付き、
      目を見開いた
  d_main_46_af_07_18:
    speaker: "<Narration>"
    en: She barely manages to lift her trembling head to look forward.
    ko: 떨리는 고개를 간신히 움직여 앞을 바라본다.
    ja: 震える顔をどうにか動かし、正面を見た
  d_main_46_af_07_19:
    speaker: "<Narration>"
    en: Andersen looks at Dorothy with a gentle smile.
    ko: 엔더슨은 도로시를 바라보며 부드럽게 미소 짓고 있었다.
    ja: |-
      向かいに座ったアンダーソンは
      ドロシーを見て優しい微笑みを浮かべていた
  d_main_46_af_07_20:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_21:
    speaker: andersen
    en: Miss Dorothy.
    ko: 도로시 아가씨.
    ja: やあ、ドロシーお嬢サマ。
  d_main_46_af_07_22:
    speaker: dorothy
    en: Com...mander...
    ko: 지… 휘관….
    ja: 指揮…官…
  d_main_46_af_07_23:
    speaker: andersen
    en: Thank goodness. I was worried you might not recognize me now that I'm older.
    ko: 이런. 늙어서 못 알아볼까 봐 걱정했는데 다행이군.
    ja: |-
      年を取って分からないんじゃないかと
      心配だったが、安心したよ。
  d_main_46_af_07_24:
    speaker: dorothy
    en: How...
    ko: 어떻… 게….
    ja: どう…して…
  d_main_46_af_07_25:
    speaker: "<Narration>"
    en: Dorothy's thoughts come to a halt.
    ko: 도로시의 생각에 제동이 걸린다.
    ja: ドロシーの思考が制動をかける
  d_main_46_af_07_26:
    speaker: "<Narration>"
    en: How many times in the past has she been manipulated  by ghosts from her past.
    ko: 지금껏, 과거의 인물들에게 얼마나 농락당했던가.
    ja: |-
      今まで過去の面影に
      どれほどもてあそばれてきたことか
  d_main_46_af_07_27:
    speaker: "<Narration>"
    en: First Liliweiss, then Pinne.
    ko: 피나. 릴리바이스.
    ja: ピナも、リリーバイスも…
  d_main_46_af_07_28:
    speaker: "<Narration>"
    en: Wariness fills Dorothy's eyes.
    ko: 도로시의 눈빛에 경계심이 떠올랐다.
    ja: ドロシーの目に警戒が浮かぶ
  d_main_46_af_07_29:
    speaker: dorothy
    en: "... Who are you?"
    ko: "…누군가요 당신."
    ja: "…何者です。あなたは。"
  d_main_46_af_07_30:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_31:
    speaker: "<Narration>"
    en: Andersen silently looks at Dorothy.
    ko: 엔더슨은 말없이 도로시를 바라본다.
    ja: |-
      アンダーソンは何も言わず、
      ドロシーを見返した
  d_main_46_af_07_32:
    speaker: "<Narration>"
    en: Dorothy silently looks back at Andersen.
    ko: 도로시도 엔더슨을 말없이 바라본다.
    ja: |-
      ドロシーも何も言わず、
      アンダーソンを見すえた
  d_main_46_af_07_33:
    speaker: "<Narration>"
    en: After staring at one another for a long time, Dorothy becomes certain.
    ko: 한참을 그렇게 바라보던 도로시는 확신한다.
    ja: |-
      そのまましばらく視線を交わし、
      ドロシーは確信した
  d_main_46_af_07_34:
    speaker: "<Narration>"
    en: He is not an illusion, nor a monster wearing another's skin.
    ko: 허상도, 가죽을 뒤집어쓰고 있는 괴물도 아니다.
    ja: 幻でも、皮をかぶった偽物でもない
  d_main_46_af_07_35:
    speaker: "<Narration>"
    en: He's the same person she once knew, bearing the marks of time on his face.
    ko: 예전의 모습에서, 세월의 흔적을 맞은.
    ja: かつての姿に、時の流れが刻まれているが…
  d_main_46_af_07_36:
    speaker: "<Narration>"
    en: The same person who shared her most radiant days.
    ko: 자신의 가장 빛나는 시절을 함께 했던 사람이다.
    ja: |-
      自分の最も輝かしい時代を
      共に過ごしていた人物だ
  d_main_46_af_07_37:
    speaker: "<Narration>"
    en: Tears fall from Dorothy's eyes.
    ko: 도로시는 눈물을 흘렸다.
    ja: ドロシーの目から涙がこぼれた
  d_main_46_af_07_38:
    speaker: dorothy
    en: You're... alive...
    ko: 살아… 있었군요….
    ja: 生きて…いたのですね…
  d_main_46_af_07_39:
    speaker: andersen
    en: Ta-da. I'm still alive and kicking.
    ko: 짜쟌. 살아있었습니다.
    ja: ジャジャーン…まあ、そういうわけだ。
  d_main_46_af_07_40:
    speaker: dorothy
    en: "*Sob*"
    ko: 아…! 아아…!!
    ja: あ…ああ…！！
  d_main_46_af_07_41:
    speaker: andersen
    en: I'm sorry I couldn't come see you sooner.
    ko: 미안하다. 미리 만나러 오지 못해서.
    ja: 遅くなってすまない。
  d_main_46_af_07_42:
    speaker: andersen
    en: But you've gotta admit, reuniting in a prison visitation room is quite dramatic.
    ko: 그런데 오랜만에 만나는 게 감방 면회라니 참 극적이야. 안 그래?
    ja: |-
      それにしても、
      感動の再会がムショの面会室なんて
      大したドラマだ。なあ？
  d_main_46_af_07_43:
    speaker: dorothy
    en: "*Sob*"
    ko: 윽…! 으흑…!
    ja: うっ…！ううっ…！
  d_main_46_af_07_44:
    speaker: andersen
    en: The things you get to see when you live long enough.
    ko: 세상 참 오래 살고 볼 일이야.
    ja: 長生きはしてみるものだ。
  d_main_46_af_07_45:
    speaker: andersen
    en: To think that such a noble lady would end up in a cell.
    ko: 그 고귀하신 아가씨가 감방에 오게 되다니.
    ja: あのお嬢様が刑務所送りになるなんてな。
  d_main_46_af_07_46:
    speaker: andersen
    en: The others would get a real kick out of this.
    ko: 애들한테 말해주면 진짜 좋아하겠어.
    ja: みんなに話してやったら、きっと大爆笑だ。
  d_main_46_af_07_47:
    speaker: dorothy
    en: "*Sob*"
    ko: 어윽…! 흐윽…!
    ja: ううっ…！うぐっ…！
  d_main_46_af_07_48:
    speaker: andersen
    en: You haven't changed at all. There's a bit more intensity in your eyes, but
      you're exactly the same.
    ko: |-
      너는 정말 하나도 안 변했군.
      눈빛이 좀 표독스러워진 것 말고는 변한 게 없어.
    ja: |-
      少しも変わっていないな。
      目つきが少し鋭くなった気はするが、
      ほとんどあの頃のままだ。
  d_main_46_af_07_49:
    speaker: andersen
    en: Maybe I should have become a Nikke too. I'm the only one aging here, it's
      ridiculous.
    ko: 나도 니케나 할 걸 그랬네. 나만 늙어가지고 이게 뭐야.
    ja: |-
      私もニケになればよかったな。
      自分だけ年を取るなんて、不公平じゃないか。
  d_main_46_af_07_50:
    speaker: andersen
    en: Do you have some kind of skincare routine? Care to share it with me?
    ko: |-
      너 무슨 피부관리 같은 거 하냐?
      아가씨만의 스킨 케어 방법 같은 게 있으면 공유 좀 해줘.
    ja: |-
      それともスキンケアのおかげか？
      お嬢様御用達のスキンケアグッズとか、
      あるなら教えてくれ。
  d_main_46_af_07_51:
    speaker: dorothy
    en: Please...! Be quiet!
    ko: 조용히…! 하세… 요…!
    ja: 静かに…！して…ください…！
  d_main_46_af_07_52:
    speaker: dorothy
    en: Can't you see... I'm crying right now...!
    ko: 지금 울고… 있잖아요…!
    ja: 泣いているのが…分かりませんか…！？
  d_main_46_af_07_53:
    speaker: andersen
    en: Stop crying, or you'll get me started too.
    ko: |-
      그만 울어.
      나도 눈물 날 것 같으니까.
    ja: |-
      そろそろ泣きやんでくれ。
      私までもらい泣きしそうだ。
  d_main_46_af_07_54:
    speaker: andersen
    en: The older I get, the easier the tears come. It's becoming quite the problem.
    ko: 나이를 먹으니 눈물만 많아져서 큰일이야 나도.
    ja: 年を取ると、涙もろくなるらしい。
  d_main_46_af_07_55:
    speaker: andersen
    en: I've been taking all sorts of things for my health, but nothing's quite what
      it used to be.
    ko: 뭐 이것저것 챙겨 먹고는 있는데 영 예전 같지 않네.
    ja: |-
      あれこれ健康にいいものを
      食べるようにしてはいるが、
      昔のようにはいかないな。
  d_main_46_af_07_56:
    speaker: dorothy
    en: Please...! Just...! Keep it down...!
    ko: 그러니까…! 조용히 좀…! 하시라고요…!
    ja: だから…！静かに…！してください…！
  d_main_46_af_07_57:
    speaker: andersen
    en: "*Sigh* Honestly."
    ko: 하… 것 참.
    ja: やれやれだ…まったく。
  d_main_46_af_07_58:
    speaker: andersen
    en: I told you not to cry.
    ko: 울지 말라니까.
    ja: 泣きやんでくれって、言っただろう。
  d_main_46_af_07_59:
    speaker: "<Narration>"
    en: Only the sound of Dorothy's sobs echoes through the visitation room.
    ko: 면회실에는 도로시의 울음소리만 들린다.
    ja: 面会室にドロシーの泣き声だけが響いた
  d_main_46_af_07_60:
    speaker: "<Narration>"
    en: Dorothy brings the tea to her lips.
    ko: 도로시는 차를 입에 가져다댔다.
    ja: ドロシーがティーカップに口をつけた
  d_main_46_af_07_61:
    speaker: dorothy
    en: Not bad at all. The leaves are good, and it's well-brewed.
    ko: |-
      나쁘지 않네요.
      찻잎도 좋고, 잘 우렸어요.
    ja: |-
      悪くありませんね。
      いい茶葉です。出し方も正しくできています。
  d_main_46_af_07_62:
    speaker: andersen
    en: Look at you, pretending to be elegant when you were just bawling your eyes
      out two seconds ago.
    ko: 좀 전까지 질질 짜다가 우아한 척 해 봤자.
    ja: |-
      あれだけ泣いておいて、
      今さら気取っても無駄だぞ。
  d_main_46_af_07_63:
    speaker: dorothy
    en: "... How long are you going to keep bringing that up?"
    ko: "…그 얘기, 언제까지 할 건가요?"
    ja: "…その話、いつまで引っ張るおつもりですか？"
  d_main_46_af_07_64:
    speaker: andersen
    en: Let me see. Until I get to tell Lilith?
    ko: 글쎄. 릴리스한테 얘기해줄 때까지?
    ja: そうだな…リリスに話すまでか？
  d_main_46_af_07_65:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_66:
    speaker: andersen
    en: I already know.
    ko: 나는 이미 안다.
    ja: 話は聞いている。
  d_main_46_af_07_67:
    speaker: andersen
    en: That damned Queen stole Lilith's body.
    ko: 퀸 그 빌어먹을 놈이 릴리스의 몸을 강탈했다는 걸 알아.
    ja: |-
      リリスのボディが
      クイーンに奪われたそうだな。
  d_main_46_af_07_68:
    speaker: andersen
    en: That thing needs to die. Without a doubt.
    ko: 그거 죽여야 돼. 반드시 죽인다.
    ja: 何としても倒さないとならない。絶対に。
  d_main_46_af_07_69:
    speaker: andersen
    en: But what are you doing here right now?
    ko: 그런데 넌 지금 여기서 뭘 하는 거지?
    ja: それで、君はこんなところで何をしている？
  d_main_46_af_07_70:
    speaker: dorothy
    en: "... You must have already heard everything."
    ko: "…얘기는 이미 다 전해 들었을 텐데요."
    ja: "…話はすでに聞いているのでは？"
  d_main_46_af_07_71:
    speaker: andersen
    en: Yes. That's why I'm asking.
    ko: 그래. 그래서 물어보는 거야.
    ja: ああ。だから聞いたんだ。
  d_main_46_af_07_72:
    speaker: andersen
    en: You could be out there right now trying to tear the Queen's head off. So what
      are you doing sitting here?
    ko: |-
      당장에 달려가서 퀸의 목을 따버려도 시원찮은 판에,
      여기서 뭘 하는 거냐고 물었다.
    ja: |-
      今クイーンの首を取るために戦っていても
      まだ遅いぐらいだ。
      だから、ここで何しているのか聞いた。
  d_main_46_af_07_73:
    speaker: andersen
    en: On a journey of self-discovery, are you?
    ko: 자아 찾기 여행 중이야?
    ja: 自分探しの旅か？
  d_main_46_af_07_74:
    speaker: dorothy
    en: I could say the same thing about you, Commander!
    ko: 그러는 지휘관은…!
    ja: そういう指揮官こそ…！
  d_main_46_af_07_75:
    speaker: dorothy
    en: You were alive this whole time! What were you doing?!
    ko: 그러는 지휘관은 살아있었으면서 지금껏 뭘 한 건가요!
    ja: 生きていたなら、今まで何をしていたのです！
  d_main_46_af_07_76:
    speaker: dorothy
    en: And despite me already being in the Ark, why did you wait until now to...!
    ko: 그리고 제가 방주에 왔는데 왜 지금까지…!
    ja: |-
      しかも私がアークにいるというのに
      なぜ今まで…！
  d_main_46_af_07_77:
    speaker: andersen
    en: Calm down. I'll explain everything.
    ko: |-
      진정해.
      다 설명해 줄 테니까.
    ja: |-
      落ち着いてくれ。
      全部聞かせてやるから。
  d_main_46_af_07_78:
    speaker: andersen
    en: Hmm... It's been a while since I talked about the old days. My heart's racing.
    ko: 음… 과거 얘기는 오랜만이군. 두근거려.
    ja: |-
      しかし…昔の話をするなんて久しぶりだな。
      ワクワクしてくる。
  d_main_46_af_07_79:
    speaker: dorothy
    en: Quit kidding around!
    ko: 장난하지 말고요!
    ja: 軽口はもう結構です！
  d_main_46_af_07_80:
    speaker: andersen
    en: First of all...
    ko: 일단 나는….
    ja: とりあえず、私のことだが…
  d_main_46_af_07_81:
    speaker: andersen
    en: During Operation Ark Guardian, I was on the brink of death, when Lilith forcibly
      sent me into the Ark.
    ko: |-
      아크 가디언 작전 중에 사경을 헤맸는데,
      릴리스가 나를 강제로 방주에 집어넣었어.
    ja: |-
      アークガーディアン作戦の途中で死にかけて、
      リリスにアーク行きのエレベーターへ
      叩き込まれたんだ。
  d_main_46_af_07_82:
    speaker: andersen
    en: I've always felt terrible about leaving without saying goodbye. I'm sorry.
    ko: "…인사도 못 하고 그렇게 가버린 것. 미안하다."
    ja: |-
      …何も言わずに、
      あんな別れ方になったのは、
      本当にすまなかった。
  d_main_46_af_07_83:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_84:
    speaker: andersen
    en: I arrived at the Ark and I received treatment, somehow managing to cling on
      to life.
    ko: 그렇게 방주로 와서 치료를 받고, 목숨줄은 어떻게든 붙였는데.
    ja: |-
      アークに来てから治療続きで、
      どうにか死なずには済んだが…
  d_main_46_af_07_85:
    speaker: andersen
    en: By the time I woke up, decades had passed.
    ko: 깨어나 보니 시간이 수십 년은 지나있더군.
    ja: 目を覚ました時には、何十年も経っていた。
  d_main_46_af_07_86:
    speaker: andersen
    en: Those V.T.C. bastards had forcibly induced me into a coma for all those years.
    ko: |-
      V.T.C.놈들이 나를 강제로 혼수 상태로 만들어 놨더라고.
      그 긴 시간 동안.
    ja: |-
      V.T.C.の連中が、
      あえて昏睡状態のままにしていたらしい。
      それだけの時間、ずっとだ。
  d_main_46_af_07_87:
    speaker: andersen
    en: Good grief. I'm sure that technology was never designed to be used as such.
    ko: 세상에. 그런데 쓰라고 개발한 기술이 아닐 텐데 말이지.
    ja: |-
      そんなことのために開発された
      技術ではなかっただろうにな。
  d_main_46_af_07_88:
    speaker: dorothy
    en: So... V.T.C. did that... to keep you in check.
    ko: "…V.T.C.가 지휘관을 견제하기 위해서… 였죠."
    ja: |-
      V.T.C.は指揮官の影響力を…
      恐れていたのでしょうね。
  d_main_46_af_07_89:
    speaker: andersen
    en: Yes. You heard that from Burningum?
    ko: 그래. 버닝엄한테 얘기 들었지?
    ja: そうだろうな。バーニンガムから聞いていたか？
  d_main_46_af_07_90:
    speaker: dorothy
    en: No. I read it in the book.
    ko: 아뇨. 책에서 봤어요.
    ja: いいえ。記録を読みました。
  d_main_46_af_07_91:
    speaker: andersen
    en: Ah, that book. It's quite well written. Though it skims through my exploits
      a bit too much for my liking. But it was a fine book.
    ko: |-
      아, 그 책이군. 잘 썼어.
      내 활약을 조금 축약해서 써놓긴 해서 맘에 안 들지만 괜찮은 책이야.
    ja: |-
      ああ、あの本のことか。よく書けていたな。
      私の活躍が抜けている以外は、いい記録だ。
  d_main_46_af_07_92:
    speaker: andersen
    en: Anyway, after sleeping like the dead for all those years, it was thanks to
      a man named Arthur that I finally woke up.
    ko: |-
      아무튼 그렇게 죽은 듯 잠만 자다,
      아서라는 양반한테 도움을 받아서 깨어났다.
    ja: |-
      とにかく、何十年も死人同然に
      眠り続けていたところを、
      アーサーという人物に起こされた。
  d_main_46_af_07_93:
    speaker: andersen
    en: When I came to, my body was a wreck, and you were all, bizarrely, being called
      Pilgrims.
    ko: |-
      깨어나서 보니 몸은 엉망이지,
      너희는 필그림이라는 이상한 이름으로 불리고 있더라고.
    ja: |-
      目を覚ましてみれば、体はボロボロの上に、
      君たちはピルグリムという、知らない名前で
      呼ばれるようになっていた。
  d_main_46_af_07_94:
    speaker: andersen
    en: I did some digging and used every connection I had to investigate why things
      ended up like this.
    ko: |-
      뒷조사를 좀 해봤다.
      왜 이 꼬라지가 됐는지, 있는 인맥 없는 인맥 다 동원해서 알아봤어.
    ja: |-
      それで調べたんだ。
      細い人脈を総動員して、何があったのか。
  d_main_46_af_07_95:
    speaker: andersen
    en: I eventually found the culprit. It was V.T.C., a painfully obvious conclusion.
    ko: |-
      원흉을 알아냈지.
      V.T.C.였다. 반전 하나 없는 아주 뻔한 결말이었어.
    ja: |-
      全ての大元はV.T.C.だった。
      意外でも何でもない、予想通りのことだがな。
  d_main_46_af_07_96:
    speaker: andersen
    en: After getting myself back in shape, I heard there was an event where key figures
      would gather.
    ko: 몸 좀 만든 후에, 뭐 주요 인사들이 모이는 행사 같은 걸 한다더라고?
    ja: |-
      そんなわけで、体を少し鍛えていたら、
      奴らの中のえらい連中が集まる
      イベントがあると聞いた。
  d_main_46_af_07_97:
    speaker: andersen
    en: So I went and paid them a little visit.
    ko: 그래서 거기 가서 인사 좀 해줬어.
    ja: そこに行って、あいさつしてやったんだ。
  d_main_46_af_07_98:
    speaker: dorothy
    en: You killed them all.
    ko: 다 죽였군요.
    ja: 壊滅させたそうですね。
  d_main_46_af_07_99:
    speaker: andersen
    en: Yes, I did. I let the leader escape though.
    ko: 그래. 다 죽였다. 대장은 놓쳤지만.
    ja: |-
      ああ。一人残らず。
      いや、一番上には逃げられたか。
  d_main_46_af_07_100:
    speaker: andersen
    en: My achievement was recognized... Hah. Even though it's an achievement for
      eliminating political enemies.
    ko: 그 공적을 인정받아… 하하. 정적을 날려준 공적이겠지만.
    ja: |-
      その功績が認められて…フ…
      厳密には波を起こしたことの方だろうがな。
  d_main_46_af_07_101:
    speaker: andersen
    en: I even rose to the position of Deputy Chief.
    ko: 부사령관 자리에까지 올랐지.
    ja: とにかく、副司令官に収まったという訳だ。
  d_main_46_af_07_102:
    speaker: andersen
    en: After that, I tried tirelessly to find all of you.
    ko: 그 후에 너흴 만나려고 부단히도 노력했다.
    ja: |-
      その後は、君たちと連絡をつけようと
      方法を探し続けた。
  d_main_46_af_07_103:
    speaker: andersen
    en: But you were just too good at running away, there was no way to catch any
      of you.
    ko: |-
      그런데 너희는… 너무 잘 도망 다녔어.
      잡을 방도가 없었지.
    ja: |-
      だが…君たちの足跡は完璧に消されていて、
      追う方法もなかった。
  d_main_46_af_07_104:
    speaker: andersen
    en: And though your personalities had changed somewhat...
    ko: 그리고 성격들이 좀 바뀌긴 했지만….
    ja: ただ、少し性格は変わったりしたが…
  d_main_46_af_07_105:
    speaker: andersen
    en: You were still out there, fighting for humanity.
    ko: "…여전히, 인류를 위해 싸우고 있더군."
    ja: |-
      …相変わらず、
      人類のために戦っていると聞いた。
  d_main_46_af_07_106:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_107:
    speaker: andersen
    en: I desperately wanted to go up there myself, but my body couldn't last a day
      without specialized treatment.
    ko: |-
      당장에 내가 올라가고 싶었지만,
      전용 치료 시설이 없으면 하루도 못 버티는 몸뚱이가 되었고
    ja: |-
      すぐにでも飛び出して行きたかったが、
      アークの治療設備が無ければ
      1日と持たない身体になっていたからな。
  d_main_46_af_07_108:
    speaker: andersen
    en: And considering the mortality rates up on the surface, sending someone else
      up was too risky a proposition.
    ko: 누구를 시키자니 지상에서의 사망률이 너무 높았어.
    ja: |-
      誰かに任せようにも、
      地上での探索はリスクが高すぎる。
  d_main_46_af_07_109:
    speaker: andersen
    en: So I left things as they were.
    ko: 그래서 그냥 뒀다.
    ja: それで、何もできずにいた。
  d_main_46_af_07_110:
    speaker: andersen
    en: I simply issued a directive not to attack any Pilgrim since they are friendly
      to humanity, and to request their help instead.
    ko: 필그림은 인류에 호의적이니, 절대 공격하지 말고 도움을 요청하라는 지침만 내리고.
    ja: |-
      ピルグリムは人類に好意的だから、
      決して攻撃せずに助けてもらえと
      指示を出したぐらいだ。
  d_main_46_af_07_111:
    speaker: dorothy
    en: Still, you could have tried at least once.
    ko: 그래도 한 번쯤은 시도해 볼 수 있었을 거잖아요.
    ja: |-
      それでも、一度くらいは
      試してみてもよかったのでは？
  d_main_46_af_07_112:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_113:
    speaker: andersen
    en: How could I possibly face any of you.
    ko: 내가 무슨 낯짝으로.
    ja: どんな顔してそうすればいい。
  d_main_46_af_07_114:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_115:
    speaker: andersen
    en: I fled to the Ark at the end of Operation Ark Guardian,
    ko: 아크 가디언 작전 막바지에 방주로 도망쳤고.
    ja: |-
      アークガーディアン作戦の
      大事な時に自分だけアークへ逃げて…
  d_main_46_af_07_116:
    speaker: andersen
    en: and left you stranded for decades.
    ko: 그 이후로 수십 년 동안 너희를 버려뒀다.
    ja: 君たちを何十年と見捨てているんだ。
  d_main_46_af_07_117:
    speaker: andersen
    en: The fact that I was sent here against my will doesn't change that fact.
    ko: 자의든 타의든 그 사실은 변하지 않아.
    ja: |-
      自分の意思でないといったって、
      事実は変わらないだろう。
  d_main_46_af_07_118:
    speaker: andersen
    en: So I decided to simply watch over you and help from a distance.
    ko: 그래서 그냥 지켜보며 돕기로 했다.
    ja: |-
      だから見守って、
      遠回しに助けるぐらいしかできなかった。
  d_main_46_af_07_119:
    speaker: andersen
    en: Because the me that I am now is someone with authority without the ability
      to act.
    ko: "…지금의 나는, 아무것도 못 하는 권력만 있는 사람이니까."
    ja: |-
      …今の私は、権力だけ持て余した、
      何もできない人間だ。
  d_main_46_af_07_120:
    speaker: dorothy
    en: Even so...!
    ko: 그래도…!
    ja: だからといって…！
  d_main_46_af_07_121:
    speaker: andersen
    en: I wanted to see you.
    ko: 만나고 싶었다.
    ja: 会いたかった。
  d_main_46_af_07_122:
    speaker: andersen
    en: But... well... I couldn't.
    ko: 하지만… 뭐 그래. 그러지 못했어.
    ja: だが…出来なかった。出来なかったんだ。
  d_main_46_af_07_123:
    speaker: "<Narration>"
    en: Andersen lightly taps his side with his fist.
    ko: 엔더슨은 자신의 옆구리를 주먹으로 가볍게 두드렸다.
    ja: アンダーソンは自分の脇腹を拳でこづいた
  d_main_46_af_07_124:
    speaker: "<Narration>"
    en: A metallic thud echoes.
    ko: 탕탕. 하며 강철 음이 들려왔다.
    ja: 固い鋼鉄の音が返ってくる
  d_main_46_af_07_125:
    speaker: andersen
    en: I can no longer be the commander who charges into battle alongside you.
    ko: 난 이제 너희와 같이 전장을 누비는 지휘관이 될 수 없으니까.
    ja: |-
      私はもう、君たちと共に
      戦場を駆け回れる指揮官ではなくなった。
  d_main_46_af_07_126:
    speaker: andersen
    en: It's embarrassing.
    ko: 쪽팔려.
    ja: 情けない。
  d_main_46_af_07_127:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_128:
    speaker: andersen
    en: So after stepping back from the front lines, I did what I could to help with
      surface reclamation efforts.
    ko: 그래서 일선에서 물러난 후, 지상 탈환을 위해 뭐 이것저것 했다.
    ja: |-
      一線を退いた後は、
      地上奪還のために色々と働いた。
  d_main_46_af_07_129:
    speaker: andersen
    en: I cleaned up the mess we had for a military, rewrote our combat manuals...
      I worked quite hard, in whatever way I could.
    ko: |-
      엉망으로 굴러가던 군부를 정리하고, 전투 교범을 새로 만들고…
      나름 열심히 했지.
    ja: |-
      混乱した軍部を立て直したり、
      戦闘教本を新しく作ったり…
      できることはやってきた。
  d_main_46_af_07_130:
    speaker: andersen
    en: But things were a disaster. After two failed surface reclamation wars, the
      Ark was in shambles.
    ko: |-
      하지만 너무 엉망인 상태였어.
      지상 탈환전이 두 번이나 실패한 뒤라 방주가 개판이었지.
    ja: |-
      だが、その時のアークはもうボロボロだった。
      地上奪還戦に二度も失敗して、
      壊れかけていたんだ。
  d_main_46_af_07_131:
    speaker: andersen
    en: So I've been managing the fallout ever since, right up to now.
    ko: |-
      그래서 계속 수습하면서 지내고 있어.
      지금까지.
    ja: |-
      繋ぎとめるだけで精いっぱいだったんだ。
      今までずっとな。
  d_main_46_af_07_132:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_133:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_134:
    speaker: andersen
    en: Well then. I suppose that covers my sob story.
    ko: 자, 그럼 얼추 사연팔이는 된 것 같고.
    ja: "…まあ、私の事情はこんなところだ。"
  d_main_46_af_07_135:
    speaker: andersen
    en: You're wondering why I never came to see you after you got to the Ark, aren't
      you?
    ko: 방주에 온 너를 왜 만나러 가지 않았는지가 궁금하지?
    ja: |-
      君がアークにいるのに、
      なぜ会いに来なかったか気になるか？
  d_main_46_af_07_136:
    speaker: andersen
    en: After all, you made such a flashy entrance, appearing like an angel from above.
      There's no way I wouldn't have known.
    ko: 그렇게 멋지게 천사님처럼 쨘-하고 등장해서 모를 리가 없었을 텐데 말이야.
    ja: |-
      天使みたいにバッチリ決めて入って来たから、
      知らなかったはずがない、
      とでも言いたいところだろう。
  d_main_46_af_07_137:
    speaker: dorothy
    en: Yes. Let's hear it.
    ko: 예. 한번 말해봐요.
    ja: そうですね。聞かせていただきましょうか。
  d_main_46_af_07_138:
    speaker: andersen
    en: I knew everything about your situation.
    ko: 모든 사정을 다 알고 있는 상태였다.
    ja: 何もかも分かっていたからだ。
  d_main_46_af_07_139:
    speaker: andersen
    en: I knew better than anyone why you'd come to the Ark.
    ko: 네가 방주로 온 이유도 누구보다 잘 알고 있었지.
    ja: |-
      君がアークにやって来た理由は
      誰よりもよく理解している。
  d_main_46_af_07_140:
    speaker: andersen
    en: That's why I stayed away.
    ko: 그래서 안 만나러 간 거야.
    ja: だから、会いに行けなかったんだ。
  d_main_46_af_07_141:
    speaker: dorothy
    en: What on earth are you saying?
    ko: 무슨 소린가요 대체.
    ja: どういうことです？
  d_main_46_af_07_142:
    speaker: andersen
    en: Because if you had asked me to destroy the Ark together, I would have agreed.
    ko: 네가 같이 방주를 부수자고 했으면, 그러자고 했을 테니까.
    ja: |-
      君がアークを壊そうと言えば、
      きっと私は手を貸すしかなくなっただろう。
  d_main_46_af_07_143:
    speaker: andersen
    en: I would have smashed the Ark with you and cheered for Eden.
    ko: 너랑 같이 방주 박살 내고 에덴 만세 했을 테니까.
    ja: |-
      君と力を合わせてアークをバラバラにした後、
      エデン万歳と叫んでいただろうな。
  d_main_46_af_07_144:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_145:
    speaker: andersen
    en: The Ark matters. Like it or not, it is humanity's last refuge.
    ko: 방주는 중요해. 밉든 싫든 인류 최후의 터전인 건 변함이 없다.
    ja: |-
      それでも、アークは重要な場所だ。
      いくら憎かろうと、人類最後の拠り所で
      あることに変わりはない。
  d_main_46_af_07_146:
    speaker: andersen
    en: It must be protected at all costs.
    ko: 어떻게든 지키는 게 맞아.
    ja: どうあっても、守られるべき場所なんだ。
  d_main_46_af_07_147:
    speaker: andersen
    en: That is why I went to Burningum.
    ko: 그래서 버닝엄한테 부탁한 거야.
    ja: それで、バーニンガムに託した。
  d_main_46_af_07_148:
    speaker: andersen
    en: He has a sharp eye for people, and good instincts. He's a talented man with
      no flaws, aside from his weight.
    ko: |-
      버닝엄은 사람 보는 눈이 탁월하거든. 감도 좋고.
      과체중 말고는 단점이 없는 인재지.
    ja: |-
      バーニンガムは人を見る目がある。
      カンも働く。ルックス以外に弱点がない。
  d_main_46_af_07_149:
    speaker: andersen
    en: I asked him to determine your true intentions.
    ko: 가서 도로시의 진의를 파악해 달라.
    ja: 君の本心を確かめて欲しいと頼んだ。
  d_main_46_af_07_150:
    speaker: andersen
    en: If you were still the same as before, the Ark would help you.
    ko: 만약 도로시가 예전 그대로라면 방주는 도로시를 도울 것이고.
    ja: もし君が昔のままなら、アークを挙げて助ける。
  d_main_46_af_07_151:
    speaker: andersen
    en: But If you were truly intent on destroying the Ark...
    ko: 만약 도로시가 방주를 부수려 든다면.
    ja: もし、そうでないなら…
  d_main_46_af_07_152:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_153:
    speaker: dorothy
    en: You told him to kill me?
    ko: 저를 죽이라고 했나요?
    ja: 私を殺すつもりでしたか？
  d_main_46_af_07_154:
    speaker: andersen
    en: Yes.
    ko: 그래.
    ja: ああ。
  d_main_46_af_07_155:
    speaker: dorothy
    en: You would do that to me?
    ko: 지휘관이. 저를.
    ja: 指揮官が、この私を。
  d_main_46_af_07_156:
    speaker: andersen
    en: The hero who is forced to cut down a fallen comrade. Talk about a cliché.
    ko: |-
      타락한 과거 동료를 어쩔 수 없이 베야 하는 용사.
      제법 인기 있는 전개지.
    ja: |-
      闇に落ちた仲間を涙を流して斬るヒーロー。
      けっこう王道だろう。
  d_main_46_af_07_157:
    speaker: andersen
    en: On the other hand.
    ko: 반대로.
    ja: あるいは…
  d_main_46_af_07_158:
    speaker: andersen
    en: The hero who sides with his fallen comrade and joins the Demon King's army.
    ko: |-
      타락한 과거 동료의 사상에 동조되어,
      마왕군에 붙는 용사.
    ja: |-
      落ちた昔の仲間にほだされて、
      魔王軍につくヒーローもな。
  d_main_46_af_07_159:
    speaker: andersen
    en: That's also not terribly original.
    ko: 이것도 제법 인기 있는 전개야.
    ja: こっちも、それなりに人気が出そうな話だ。
  d_main_46_af_07_160:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_161:
    speaker: andersen
    en: I'm glad you haven't changed.
    ko: "…여전한 것 같아서 다행이다."
    ja: "…変わっていないようで、よかった。"
  d_main_46_af_07_162:
    speaker: dorothy
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  d_main_46_af_07_163:
    speaker: dorothy
    en: I've changed a lot.
    ko: 저는 많이 바뀌었어요.
    ja: 私は変わり果ててしまいました。
  d_main_46_af_07_164:
    speaker: andersen
    en: No.
    ko: 아니.
    ja: いいや。
  d_main_46_af_07_165:
    speaker: andersen
    en: You're the same.
    ko: 너는 그대로야.
    ja: 君はそのままだ。
  d_main_46_af_07_166:
    speaker: andersen
    en: I'm convinced of that.
    ko: 나는 알아.
    ja: 私には分かる。
  d_main_46_af_07_167:
    speaker: andersen
    en: You put on that tough act all by yourself,
    ko: 너는 여전히 독한 척은 혼자 다 하지만.
    ja: 相変わらず、一人で強がって…
  d_main_46_af_07_168:
    speaker: andersen
    en: but in the end, you're guided by your heart and you sacrifice yourself for
      the greater good.
    ko: 결국엔 정에 이끌리고 대의를 위해 희생해.
    ja: |-
      結局は情に流されて、
      大義のために自分を犠牲にする。
  d_main_46_af_07_169:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_170:
    speaker: andersen
    en: Stand with the Ark, Dorothy.
    ko: 방주에 붙어라. 도로시.
    ja: アークの手を取ってくれ。ドロシー。
  d_main_46_af_07_171:
    speaker: andersen
    en: Let's go kill that Queen. Just thinking about that bitch keeps me awake at
      night.
    ko: |-
      퀸이나 잡으러 가자고.
      그 새X 생각하면 내가 잠이 안 와.
    ja: |-
      それからクイーンを倒しに行くんだ。
      あいつのことを考えていると、
      怒りで眠れなくなる。
  d_main_46_af_07_172:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_173:
    speaker: andersen
    en: Yes. After sharpening your teeth on revenge for so long, it won't be easy.
    ko: 그래. 뭐 오랫동안 복수 복수 이만 갈고 있었으니 쉽지 않겠지.
    ja: |-
      そうは言っても、今までずっと
      復讐のために生きてきたんだ。
      簡単には決められないだろうな。
  d_main_46_af_07_174:
    speaker: andersen
    en: But Dorothy.
    ko: 하지만 도로시.
    ja: だが、ドロシー…
  d_main_46_af_07_175:
    speaker: andersen
    en: The reason you never put your plans into action,
    ko: 지금까지 하지 않았던 건.
    ja: 今までしなかったのなら…
  d_main_46_af_07_176:
    speaker: andersen
    en: means you never truly intended to see them through.
    ko: 할 생각이 없었다는 거다.
    ja: それはきっと、する気がなかったということだ。
  d_main_46_af_07_177:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブルルル――
  d_main_46_af_07_178:
    speaker: andersen
    en: Hmm. Excuse me for a moment.
    ko: 음. 잠시만 실례하지.
    ja: ちょっと失礼。
  d_main_46_af_07_179:
    speaker: "<Narration>"
    en: Andersen takes out his phone.
    ko: 엔더슨이 핸드폰을 꺼내 든다.
    ja: アンダーソンは携帯端末を取り出した
  d_main_46_af_07_180:
    speaker: andersen
    en: Yes, it's me.
    ko: 그래. 날세.
    ja: ああ。私だ。
  d_main_46_af_07_181:
    speaker: andersen
    en: Mmm, yes. I'll return shortly. I'm meeting an old acquaintance.
    ko: |-
      아아. 그래. 금방 돌아가겠네.
      오랜 지인을 만나서 말이야.
    ja: |-
      分かった。すぐに戻る。
      昔の知り合いと話をしていた。
  d_main_46_af_07_182:
    speaker: andersen
    en: My condition has been stable, so I don't see why I need such frequent checkups.
    ko: 요즘은 상태가 괜찮으니 그리 자주 검사 받을 필요는 없지 않은가.
    ja: |-
      最近は数字も良好だ。
      何度も検査を受ける必要はないと思うが。
  d_main_46_af_07_183:
    speaker: andersen
    en: Understood. I'll be there soon.
    ko: 아아. 알겠네. 금방 가겠네.
    ja: ああ。分かった。ただちに向かう。
  d_main_46_af_07_184:
    speaker: andersen
    en: Yes. See you later.
    ko: 그래. 이따 보도록 하지.
    ja: そうだな、では後ほど。
  d_main_46_af_07_185:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_46_af_07_186:
    speaker: dorothy
    en: "... Your way of speaking has changed a lot."
    ko: "…말투가 많이 바뀌셨네요."
    ja: "…話し方を変えたようですね。"
  d_main_46_af_07_187:
    speaker: andersen
    en: I'm a Deputy Chief, after all. I have to act a little dignified.
    ko: |-
      그래도 부사령관이니까.
      위엄 좀 세워야지.
    ja: |-
      副司令官ともなると、
      威厳を保たないといけないからな。
  d_main_46_af_07_188:
    speaker: andersen
    en: But I'm the same man I was before.
    ko: 하지만 나는 과거 그대로다.
    ja: だが、中身は昔と何も変わっていない。
  d_main_46_af_07_189:
    speaker: andersen
    en: My body may be broken down and aging, but my heart is unchanged.
    ko: |-
      몸뚱이가 망가지고 늙었지만,
      마음만은 예전 그대로야.
    ja: |-
      体はボロボロですっかり老いぼれたが、
      気持ちは昔のままだ。
  d_main_46_af_07_190:
    speaker: andersen
    en: What about you?
    ko: 너는 어떻지?
    ja: 君はどうだ？
  d_main_46_af_07_191:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_192:
    speaker: andersen
    en: I have to go, but I'll be back.
    ko: 간다. 또 올게.
    ja: また来る。
  d_main_46_af_07_193:
    speaker: andersen
    en: Listen to the guard and don't try to escape.
    ko: 간수 말 잘 듣고, 탈옥하려고 하지 말고.
    ja: |-
      看守の言うことをよく聞いて、
      脱獄は止めておけ。
  d_main_46_af_07_194:
    speaker: dorothy
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  d_main_46_af_07_195:
    speaker: dorothy
    en: Despite all that's happened,
    ko: 뭐가 어떻게 됐든.
    ja: 色々なことはありましたが…
  d_main_46_af_07_196:
    speaker: dorothy
    en: I'm glad I could see you again.
    ko: 다시 볼 수 있어서 다행이에요.
    ja: またお会いできてよかった。
  d_main_46_af_07_197:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_198:
    speaker: andersen
    en: See? I told you I tear up easily now that I'm getting older.
    ko: 거 참. 나이 들어서 눈물 많아졌다니까 그러네.
    ja: まったく…年を取ると涙もろくなって困るな。
  d_main_46_af_07_199:
    speaker: anis_i_w
    en: Oh, try these. They're apparently mint chocolate seafood chips.
    ko: |-
      오 이거 먹어봐.
      민트 초코 맛 해물 과자라던데.
    ja: |-
      これ食べてみて。
      チョコミント味のシーフードスナックだって。
  d_main_46_af_07_200:
    speaker: neon_v_w
    en: Yuck. What unholy abomination is that?
    ko: 으엑. 뭔가요 그 혼종은.
    ja: うっ…どう考えてもミスマッチでは。
  d_main_46_af_07_201:
    speaker: rapi_red
    en: Sounds like a gourmet, haute cuisine snack.
    ko: 뭔가 미식의 영역에 있는 과자 같네.
    ja: グルメの間では話題だそうよ。
  d_main_46_af_07_202:
    speaker: rapi_red
    en: Let Dorothy be the judge. She has discerning taste.
    ko: |-
      도로시가 먹고 판단해 줄 거야.
      입맛이 까다로우시거든.
    ja: |-
      ドロシーの評価は参考になると思うわ。
      味にはうるさい人だから。
  d_main_46_af_07_203:
    speaker: dorothy
    en: I'm not eating that.
    ko: 안 먹어요.
    ja: 結構です。
  d_main_46_af_07_204:
    speaker: "<Self>"
    en: Wow, this fried ramen is really good. It's salty, spicy, and just hits the
      spot.
    ko: |-
      오 이거 진짜 맛있네.
      튀긴 라면? 짭짤하고 맵고 진짜 맛있어.
    ja: |-
      おお、これはうまいな。
      揚げラーメン？塩味と辛味がちょうどいい
  d_main_46_af_07_205:
    speaker: anis_i_w
    en: It's good. I think it tanked because of its name. Change that and it would
      be a hit.
    ko: |-
      괜찮지. 내가 보기에 이름 때문에 망했어 그거.
      이름만 바꾸면 대박칠 걸?
    ja: |-
      でしょ？
      私が思うに、人気がないのは名前のせいよ。
      うまく変えたら大ヒットしそうじゃない？
  d_main_46_af_07_206:
    speaker: rapi_red
    en: Why did you buy so many dumplings?
    ko: 만두를 왜 이렇게 많이 산 거야?
    ja: こっちのギョウザの山は何？
  d_main_46_af_07_207:
    speaker: neon_v_w
    en: The shop's grill was fired up to the max. With firepower like that, it can't
      taste all that bad.
    ko: |-
      그 가게 화력이 장난이 아니었거든요.
      그 화력이면 맛이 없을 수 없죠.
    ja: |-
      火力が半端じゃない店なんです。
      あの火力でおいしくないわけがありません。
  d_main_46_af_07_208:
    speaker: neon_v_w
    en: Dorothy, want to give it a sniff? It's got this great smokiness.
    ko: |-
      도로시도 냄새 한번 맡아볼래요?
      불향이 아주 그냥.
    ja: |-
      ドロシーも嗅いでみませんか？
      炎と煙の香りがすごいんですよ。
  d_main_46_af_07_209:
    speaker: dorothy
    en: No, thank you.
    ko: 됐어요.
    ja: 結構です。
  d_main_46_af_07_210:
    speaker: rapi_red
    en: Then what about this? It's called flower bread. There's red bean paste inside.
    ko: |-
      그럼 이거.
      꽃빵이라는 건데, 안에 팥이 들었어.
    ja: |-
      じゃあ、これ。
      花パンと言うらしいわ。
      中に豆のペーストが入ってる。
  d_main_46_af_07_211:
    speaker: dorothy
    en: Why would a flower bread have red bean paste in it?
    ko: 꽃빵인데 팥이 왜 들어있죠.
    ja: 花の要素がないかと思いますが。
  d_main_46_af_07_212:
    speaker: rapi_red
    en: Beats me. Maybe because it's shaped like a flower?
    ko: 글쎄. 모양이 꽃이라서?
    ja: さあ…形が花みたいだから？
  d_main_46_af_07_213:
    speaker: "<Self>"
    en: Now that you mention it, there are a lot of different breads like that. Fish-shaped
      bread, for example.
    ko: |-
      그러고 보니 그런 게 제법 있지.
      붕어빵도 그렇고.
    ja: |-
      そういうものは結構あるな。
      たい焼きもそうか
  d_main_46_af_07_214:
    speaker: neon_v_w
    en: Oh! I read in a book that they used to put real fish in fish bread.
    ko: 엇 저 책에서 읽었는데, 예전에는 붕어빵에 진짜 붕어 넣었대요.
    ja: |-
      本で読んだことありますよ。
      昔は本物の鯛が入っていたんだとか。
  d_main_46_af_07_215:
    speaker: anis_i_w
    en: What kind of weird books are you even reading?
    ko: 너 대체 무슨 책을 읽고 다니는 거야.
    ja: どういう本よそれ。
  d_main_46_af_07_216:
    speaker: anis_i_w
    en: By the way, Dorothy, why aren't you eating? We bought all this for you.
    ko: |-
      그나저나 도로시 너 왜 이렇게 안 먹어.
      이거 다 너 먹으라고 사 온 거야.
    ja: |-
      それよりドロシー、なんで食べないの？
      全部あなたのために買ってきたのに。
  d_main_46_af_07_217:
    speaker: dorothy
    en: You say that, but all of you seem to be doing the eating.
    ko: 그런 것 치곤 여러분들이 지금 다 드시고 계시는데요.
    ja: |-
      言っているそばから、
      皆さんが全て食べてしまっているようですが。
  d_main_46_af_07_218:
    speaker: anis_i_w
    en: Because you're refusing everything even if we spoon-feed you!
    ko: 아 먹으라고 떠먹여 줘도 안 먹잖아.
    ja: |-
      食べさせてあげてるのに、
      全然食べてくれないじゃない。
  d_main_46_af_07_219:
    speaker: dorothy
    en: You haven't spoon-fed me anything yet.
    ko: 떠먹여 주진 않았죠.
    ja: 食べさせてもらってはいません。
  d_main_46_af_07_220:
    speaker: anis_i_w
    en: Fine, then open wide and say aaahhh!
    ko: |-
      자자. 그럼 아~ 해.
      아~앙~
    ja: |-
      はいはい。じゃ、お口開けて。
      あ～～ん…
  d_main_46_af_07_221:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_07_222:
    speaker: anis_i_w
    en: See? Even if we spoon-feed you, you won't eat.
    ko: 거 봐. 떠먹여 줘도 안 먹는구만.
    ja: |-
      ほらね。
      口まで持っていても食べてくれないし。
  d_main_46_af_07_223:
    speaker: neon_v_w
    en: Then feed me instead! Aaaaah!
    ko: 그럼 저한테 줘요. 아~앙~
    ja: |-
      それなら、私に食べさせてください。
      あ～～ん。
  d_main_46_af_07_224:
    speaker: anis_i_w
    en: There.
    ko: 얍.
    ja: えいっ。
  d_main_46_af_07_225:
    speaker: neon_v_w
    en: Blech! Why did you stick your fingers in?!
    ko: 우푸풋. 손가락을 왜 넣는데요!
    ja: むぐっ…なんで指を突っ込むんですか！？
  d_main_46_af_07_226:
    speaker: dorothy
    en: "... Since you are done eating, could you leave now?"
    ko: "…다 드신 것 같으니 이만 가주시겠어요?"
    ja: |-
      …食べ終わったのでしたら、
      そろそろお帰りいただけますか？
  d_main_46_af_07_227:
    speaker: "<Self>"
    en: We haven't even started.
    ko: 아직 시작도 안 했는데?
    ja: まだ食べ始めたうちにも入らないぞ？
  d_main_46_af_07_228:
    speaker: dorothy
    en: "*Sigh*"
    ko: 하아….
    ja: はぁ…
  d_main_46_af_07_229:
    speaker: "<Narration>"
    en: 30 minutes later...
    ko: 30분 후.
    ja: 30分後
  d_main_46_af_07_230:
    speaker: anis_i_w
    en: Ah, that was delicious.
    ko: 아~ 잘 먹었다.
    ja: あ～、お腹いっぱい。
  d_main_46_af_07_231:
    speaker: rapi_red
    en: Shall we get going then?
    ko: 갈까 그럼.
    ja: そろそろ帰るわ。
  d_main_46_af_07_232:
    speaker: neon_v_w
    en: Yeah, let's grab some coffee on the way. I feel like I'm gonna burst.
    ko: |-
      예. 가는 길에 커피라도 좀 마셔요.
      배가 터질 것 같거든요.
    ja: |-
      そうですね。帰りにコーヒーでもどうですか？
      お腹がはち切れそうです。
  d_main_46_af_07_233:
    speaker: "<Self>"
    en: Oh, Dorothy, be sure to eat the crème brûlée today. Otherwise, it'll spoil.
    ko: |-
      아, 도로시. 크림 브륄레는 오늘 안에 먹어야 돼.
      놔두면 상하니까.
    ja: |-
      ああ、ドロシー。時間が経つと傷むから、
      クレームブリュレは今日中に食べた方がいい
  d_main_46_af_07_234:
    speaker: dorothy
    en: "... Are you really leaving?"
    ko: "…진짜 간다고요?"
    ja: "…もう帰るのですか？"
  d_main_46_af_07_235:
    speaker: "<Self>"
    en: Hmm? Yeah, we finished eating, after all.
    ko: |-
      ??
      어. 다 먹었으니까.
    ja: |-
      ？？
      まあ、食べ終わったからな
  d_main_46_af_07_236:
    speaker: dorothy
    en: Did you not come because you had something to say?
    ko: 뭔가 할 말이 있어서 온 거 아니었나요?
    ja: 何か言いたいことがあって来られたのでは？
  d_main_46_af_07_237:
    speaker: rapi_red
    en: The truth is, we're here because Anis wanted to see you in a prison uniform.
    ko: 사실은 아니스가 네 죄수복 입은 모습을 싶다고 해서 왔어.
    ja: |-
      本当は、アニスが囚人服を着たあなたを
      見たいと言うから来たの。
  d_main_46_af_07_238:
    speaker: anis_i_w
    en: Hey! You said you wanted to see it too!
    ko: 야! 너도 보고 싶다고 했잖아!
    ja: ちょっと！ラピだって同じでしょ！
  d_main_46_af_07_239:
    speaker: neon_v_w
    en: But how are your clothes so clean after all this time in here? Do you sleep
      standing up?
    ko: |-
      그런데 시간이 좀 됐는데 옷이 무지 깨끗하시네요?
      혹시 서서 주무시나요?
    ja: |-
      けっこう経っていますが、
      服がきれいなままですね？
      もしかして、立って寝てます？
  d_main_46_af_07_240:
    speaker: dorothy
    en: "*Sigh* All right. Please leave."
    ko: "…하아. 알겠어요. 얼른 가요."
    ja: "…はぁ。そうですか。もう行ってください。"
  d_main_46_af_07_241:
    speaker: rapi_red
    en: Do you have any letters you want delivered? People in prison tend to write
      a lot of letters to the outside.
    ko: |-
      혹시 뭐 전해줄 편지 같은 거 없어?
      감방에서 밖에 편지 많이 쓰잖아.
    ja: |-
      届けてほしい手紙はない？
      捕まったらそうやって外と連絡するものよ。
  d_main_46_af_07_242:
    speaker: anis_i_w
    en: Oh, right. Rapi is an ex-convict, so she knows all about this stuff. If there's
      anything you don't know, ask her.
    ko: |-
      오, 그래. 라피도 전과자니까 잘 알아.
      모르는 거 있으면 물어봐.
    ja: |-
      ああ、そうそう。
      ラピも前科者だから詳しいのよね。
      分からないことがあったら聞けるわよ。
  d_main_46_af_07_243:
    speaker: rapi_red
    en: I made a brief mistake... during my turbulent youth...
    ko: "…난 질풍노도의 시기 때… 잠깐의 실수를…."
    ja: "…不安定な頃の、ささいな過ちよ…"
  d_main_46_af_07_244:
    speaker: neon_v_w
    en: Then if you and Dorothy ended up in the same squad, does that make it a criminal
      squad?
    ko: 그럼 도로시랑 라피가 같은 스쿼드가 되면 범법자 스쿼드네요?
    ja: |-
      ドロシーとラピが同じ部隊になれば
      犯罪者部隊が結成できますね？
  d_main_46_af_07_245:
    speaker: anis_i_w
    en: Isn't that the story with everyone in Real Kindness?
    ko: 리얼 카인드니스 애들이 그렇지 않나.
    ja: リアルカインドネスがもうあるでしょ。
  d_main_46_af_07_246:
    speaker: dorothy
    en: "... Please get out."
    ko: "…가주세요."
    ja: "…帰ってください。"
d_main_46_af_08:
  d_main_46_af_08_1:
    speaker: "<Narration>"
    en: In the Central Government's main conference room...
    ko: 중앙 정부 중앙 회의실.
    ja: 中央政府・中央会議室
  d_main_46_af_08_2:
    speaker: andersen
    en: All right, let's go over the situation.
    ko: "…좋아. 상황을 정리해 보지."
    ja: "…では、状況を整理しよう。"
  d_main_46_af_08_3:
    speaker: andersen
    en: The most pressing issue is the Ark's power source.
    ko: 먼저 가장 큰 문제는 방주의 동력원이겠군.
    ja: まず最大の問題は、アークのエネルギー源だ。
  d_main_46_af_08_4:
    speaker: andersen
    en: It's only operating at 20% of its former output, and that number continues
      to decrease.
    ko: |-
      예전 출력의 20%밖에 내지 못하는 상황에,
      점점 그 출력이 떨어지고 있다.
    ja: |-
      出力がこれまでの20％未満に落ち、
      その後も徐々に低下を続けている。
  d_main_46_af_08_5:
    speaker: andersen
    en: Second is the matter of Dorothy's sentencing.
    ko: "…두 번째는 도로시의 처분."
    ja: "…その次は、ドロシー絡みの事件の処理だ。"
  d_main_46_af_08_6:
    speaker: andersen
    en: The incident was severe enough to cause casualties. On top of that, it really
      rattled the public.
    ko: |-
      사상자가 나올 정도의 소란이었지.
      거기다 방주 민심을 흔들었어.
    ja: |-
      死傷者が出たうえに、
      アークの群衆に不安を招いている。
  d_main_46_af_08_7:
    speaker: andersen
    en: Speaking of, we've got an open Deputy Chief position now.
    ko: 그러고 보니 부사령관 자리가 하나 공석이 되었군.
    ja: 同時に、副司令官の席が1つ空いた。
  d_main_46_af_08_8:
    speaker: andersen
    en: Anyone have any candidates in mind?
    ko: 생각해 둔 후보가 있나?
    ja: 思い当たる候補はいるか？
  d_main_46_af_08_9:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_10:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  d_main_46_af_08_11:
    speaker: burningum
    en: I-I do. I-it's still a little early to say, though.
    ko: 있, 있어. 아직은 좀 이르, 이르지만.
    ja: こ、候補なら、いる。だが、時期尚早、だ。
  d_main_46_af_08_12:
    speaker: andersen
    en: Hmm. Very well.
    ko: 흠. 알겠네.
    ja: そうか。まぁ、その話は後だ。
  d_main_46_af_08_13:
    speaker: andersen
    en: And third.
    ko: 그리고 세 번째.
    ja: それから3件目。
  d_main_46_af_08_14:
    speaker: andersen
    en: A gunfight in the middle of the city, following the incident with Sixo, all
      sorts of rumors are spreading.
    ko: |-
      식스오의 건에 이은 시내 한복판에서의 총격전….
      별별 소리가 다 나오고 있는 상태지.
    ja: |-
      シックスオー絡みの市街中心部での戦闘…
      あらゆる憶測が飛び交っている状況だ。
  d_main_46_af_08_15:
    speaker: andersen
    en: Public confidence has taken a serious hit.
    ko: 민심이 크게 흔들리고 있네.
    ja: 民衆も大きく動揺している。
  d_main_46_af_08_16:
    speaker: andersen
    en: We need to gradually resolve this, but we're out of ideas at the moment.
    ko: 차차 해결해야 하겠지만… 마땅한 방법이 없는 상태군.
    ja: |-
      いずれ解決せねばならないが…
      これといった決め手がない。
  d_main_46_af_08_17:
    speaker: enikk_op_r
    en: The Ark's power source is the most critical issue.
    ko: 방주 동력원 쪽 문제가 가장 심각합니다.
    ja: エネルギー源の問題解決が最も深刻な課題です。
  d_main_46_af_08_18:
    speaker: enikk_op_r
    en: The Ark's infrastructure will gradually become paralyzed.
    ko: 점진적으로 방주의 인프라가 마비되겠지요.
    ja: |-
      アークの基盤システムが
      徐々に麻痺していくことになります。
  d_main_46_af_08_19:
    speaker: enikk_op_r
    en: No viable alternative has been identified as of yet.
    ko: 현재까지 적합한 대안을 찾지 못했습니다.
    ja: |-
      現在のところ、
      有効な対策は発見できていません。
  d_main_46_af_08_20:
    speaker: syuen
    en: Can't we just go to the surface and bring back a truckload of supplies?
    ko: 지상에 가서 물자를 잔뜩 가져오면 되는 거 아냐?
    ja: 地上からの物資を増やして補えないの？
  d_main_46_af_08_21:
    speaker: ingrid
    en: Supplies near the Ark have been completely depleted.
    ko: 방주 인근의 물자는 씨가 말랐다.
    ja: アーク近辺の資源はほぼ枯渇している。
  d_main_46_af_08_22:
    speaker: ingrid
    en: We'd need to venture much farther, and the risk and time required increase
      sharply the farther we go.
    ko: 먼 곳까지 가야 하며, 그럴수록 위험도와 소요 시간이 급상승하지.
    ja: |-
      資源調達には遠方に出る必要があるが、
      遠くへ行くほど、
      危険度も必要な時間も急激に上昇する。
  d_main_46_af_08_23:
    speaker: ingrid
    en: Also, it's not just a matter of supplies. Even if supplies come in, we lack
      the power to process them.
    ko: |-
      그리고 물자만의 문제는 아니야.
      물자가 들어와도 그걸 가공할 동력이 없다.
    ja: |-
      それに、資源だけの問題ではない。
      資源を手に入れても、
      それを加工するエネルギーが不足している。
  d_main_46_af_08_24:
    speaker: mustang
    en: Le public sentiment c'est much more sérieux.
    ko: People의 Mind가 더욱 심각합니Da.
    ja: PeopleのMindも深刻ですNE。
  d_main_46_af_08_25:
    speaker: mustang
    en: Mystérieux groups are forming in large numbers.
    ko: Mystery한 Group이 Many 생겨나고 있어Yo.
    ja: |-
      MysteryなGroupが
      Many出来上がっていMASU。
  d_main_46_af_08_26:
    speaker: mustang
    en: We do not know when or where or what kind of problème will arise.
    ko: 언제 어디서 무슨 Problem이 생겨날지 모릅니Da.
    ja: |-
      いつどこでどうProblemになるか、
      分かりませんNE。
  d_main_46_af_08_27:
    speaker: "<Monologue>"
    en: The conference chamber falls silent.
    ko: "…회의실이 정적에 휩싸인다."
    ja: "…会議室が静寂に包まれた"
  d_main_46_af_08_28:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_29:
    speaker: andersen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_30:
    speaker: burningum
    en: "@UserName. W-we would like to hear your thoughts."
    ko: |-
      @UserName.
      자, 자네 생각을 듣고 싶군.
    ja: |-
      @UserName。
      き、君の考えを聞かせてくれ。
  d_main_46_af_08_31:
    speaker: andersen
    en: Hmm. I believe you would have an appropriate solution.
    ko: 음. 자네라면 뭔가 적절한 방법이 있을 거라 생각되네만.
    ja: ああ。君なら何かいい解決法を持っていそうだ。
  d_main_46_af_08_32:
    speaker: andersen
    en: After all, you are the Commander of the Commando Unit.
    ko: 뭐니 뭐니 해도 특수별동대의 지휘관 아닌가.
    ja: |-
      なんといっても、
      かの特殊別働隊の指揮官だからな。
  d_main_46_af_08_33:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_34:
    speaker: "<Monologue>"
    en: Everyone looks at me.
    ko: 모두가 나를 바라본다.
    ja: 全員の視線が集中する
  d_main_46_af_08_35:
    speaker: "<Monologue>"
    en: Bearing the weight of expectations, I open my mouth to speak.
    ko: 부담스러움을 견뎌내며, 입을 연다.
    ja: 重圧に耐え、口を開いた
  d_main_46_af_08_36:
    speaker: "<Self>"
    en: I propose the Third Surface Reclamation War.
    ko: 3차 지상 탈환전을 제안합니다.
    ja: 第三次地上奪還戦を提案します
  d_main_46_af_08_37:
    speaker: "<Monologue>"
    en: Silence falls over the chambers once more.
    ko: 또다시 정적이 흐른다.
    ja: 再び、静寂が広がった
  d_main_46_af_08_38:
    speaker: "<Monologue>"
    en: I press on.
    ko: 나는 말을 이어갔다.
    ja: 私は言葉を続けた
  d_main_46_af_08_39:
    speaker: "<Monologue>"
    en: The Ark's power source is effectively beyond saving. Which means, we would
      have no choice but to abandon the Ark.
    ko: |-
      방주의 동력원은 사실상 방법이 없는 상태다.
      그렇다면 방주를 버릴 수밖에 없다.
    ja: |-
      アークのエネルギー源には
      事実上回復の見込みがない。
      遠からずアークは放棄するほかなくなる
  d_main_46_af_08_40:
    speaker: "<Monologue>"
    en: The surface has more natural resources in abundance, such as sunlight and
      water.
    ko: 지상이라면 햇빛, 물 등의 천연자원이 넘쳐난다.
    ja: |-
      地上には、太陽の光や水など
      天然資源が豊富に望める
  d_main_46_af_08_41:
    speaker: "<Monologue>"
    en: In contrast, the Ark consumes vast amounts of energy just to sustain light
      and water sources.
    ko: 반면, 방주에서는 빛과 물을 유지하는 데만 막대한 전력이 소모된다.
    ja: |-
      アークにいる限り、
      光源や水を維持するだけでも
      莫大なエネルギーが消費される
  d_main_46_af_08_42:
    speaker: "<Monologue>"
    en: Yes, our infrastructure will falter at first, but we can't just sit back and
      wait for death.
    ko: |-
      당장은 인프라가 휘청이겠지만,
      가만히 앉아서 죽음을 기다릴 순 없다.
    ja: |-
      当面はアークの基盤システムに
      さらなる負荷をかけることになるが、
      何もせず死を待つわけにはいかない
  d_main_46_af_08_43:
    speaker: "<Monologue>"
    en: Everyone in the conference room listens quietly.
    ko: 회의실의 모두가 가만히 듣고 있다.
    ja: 会議室の誰もが私の説明を静かに聞いている
  d_main_46_af_08_44:
    speaker: "<Self>"
    en: I propose the Third Surface Reclamation War, with Dorothy leading the charge.
    ko: 도로시를 선봉으로 둔, 3차 지상 탈환전입니다.
    ja: |-
      ドロシーを旗印として
      第三次地上奪還戦を進行します
  d_main_46_af_08_45:
    speaker: "<Monologue>"
    en: We legitimize everything Dorothy said.
    ko: 도로시가 이야기한 것을 사실로 만든다.
    ja: ドロシーが話したことを事実にすればいい
  d_main_46_af_08_46:
    speaker: "<Monologue>"
    en: We announce that all of this happened because the Queen descended to the surface.
    ko: 이 모든 일은 지상에 퀸이 내려왔기 때문이라고 발표한다.
    ja: |-
      つまり、全てはクイーンが
      地上に降下したせいだと発表する
  d_main_46_af_08_47:
    speaker: "<Monologue>"
    en: We attribute the string of incidents that occurred in the Ark to the Queen.
    ko: 잇따라 발생한 방주에서의 사고를 모두 퀸 탓으로 돌려버린다.
    ja: |-
      アークでたて続けに起こった大事件も
      クイーンに責任を押し付けられる
  d_main_46_af_08_48:
    speaker: "<Monologue>"
    en: The Central Government kept all this secret to prepare for the Third Surface
      Reclamation War,
    ko: 중앙 정부는 3차 지상 탈환전 준비를 위해 지금까지 이 일을 비밀로 했던 것이며
    ja: |-
      中央政府がこれまで沈黙していたのは
      第三次地上奪還戦の準備のため
  d_main_46_af_08_49:
    speaker: "<Monologue>"
    en: but in the wake of Dorothy's revelation, decided to go public to prevent anything
      worse.
    ko: 도로시의 폭로 이후 더 큰 사고 방지를 위해 발표하기로 했다고 한다.
    ja: |-
      ドロシーの告発を受けて、
      これ以上の混乱を防ぐため
      事実を公表したということにする
  d_main_46_af_08_50:
    speaker: "<Monologue>"
    en: Since we cannot let Dorothy's words turn out to be a lie, we place Dorothy
      at the vanguard.
    ko: |-
      도로시의 말이 거짓말이 되면 안 되기에,
      도로시를 선봉으로 둔다.
    ja: |-
      ドロシーの言葉が事実になるよう、
      ドロシーを先頭にすえる
  d_main_46_af_08_51:
    speaker: "<Monologue>"
    en: Additionally, I demand the restoration of her reputation and that of the entire
      Goddess Squad.
    ko: 추가로 도로시를 비롯한 갓데스 스쿼드의 명예 회복도 요구한다.
    ja: |-
      さらに、ドロシーをはじめとする
      ゴッデス部隊の名誉を回復させる
  d_main_46_af_08_52:
    speaker: andersen
    en: "... That last request seems rather personal."
    ko: "…지극히 개인적인 배려가 섞여 들어간 듯하네만."
    ja: |-
      …個人の思惑に依存する部分が
      多く混ざっているようだが。
  d_main_46_af_08_53:
    speaker: "<Self>"
    en: I won't deny it.
    ko: 부정하진 않겠습니다.
    ja: 否定はしません
  d_main_46_af_08_54:
    speaker: andersen
    en: Do you think Dorothy will go along with this?
    ko: 도로시가 설득될 거라 생각하나?
    ja: ドロシーを説得できると思っているのか？
  d_main_46_af_08_55:
    speaker: "<Self>"
    en: Of course.
    ko: 물론입니다.
    ja: その通りです
  d_main_46_af_08_56:
    speaker: syuen
    en: The Third Surface Reclamation War? Are you out of your mind?
    ko: 잠깐만. 3차 지상 탈환전이라니 제정신이야?
    ja: ちょっと…第三次地上奪還戦って、正気なの？
  d_main_46_af_08_57:
    speaker: syuen
    en: The Raptures are infinite. How long are we going to bang our heads against
      this wall?
    ko: |-
      랩쳐 놈들은 무한하다고.
      또 바위에 계란을 그렇게 던져댈 거야?
    ja: |-
      ラプチャーなんて無限に湧いて出てくるのよ。
      また岩に卵をぶつけるようなことを
      やるつもり？
  d_main_46_af_08_58:
    speaker: andersen
    en: The Raptures are no longer infinite.
    ko: 랩쳐는 이제 무한하지 않네.
    ja: ラプチャーは無限ではない。
  d_main_46_af_08_59:
    speaker: syuen
    en: "... What?"
    ko: "…뭐?"
    ja: "…はぁ？"
  d_main_46_af_08_60:
    speaker: andersen
    en: It's been confirmed. The Raptures are now finite in number.
    ko: |-
      확정났네.
      랩쳐는 이제 무한하지 않아.
    ja: |-
      これはすでに判明している｡
      ラプチャーはもう無限ではない。
  d_main_46_af_08_61:
    speaker: burningum
    en: En-Enikk verified it.
    ko: 에, 에닉이 교차 검증해 줬어.
    ja: エ、エニックも検証済みだ。
  d_main_46_af_08_62:
    speaker: syuen
    en: What are you saying...?
    ko: 무슨… 소리야 그게.
    ja: それ…どういうことよ。
  d_main_46_af_08_63:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_64:
    speaker: "<Monologue>"
    en: To summarize.
    ko: 내용을 정리한다.
    ja: 改めて提案を整理した
  d_main_46_af_08_65:
    speaker: "<Monologue>"
    en: The Ark can no longer serve as humanity's home.
    ko: 방주는 이제 인류의 터전이 될 수 없다.
    ja: アークはもはや人類の拠り所でいられなくなる
  d_main_46_af_08_66:
    speaker: "<Monologue>"
    en: The Queen has descended.
    ko: 퀸이 내려왔고.
    ja: クイーンは地上に降下し…
  d_main_46_af_08_67:
    speaker: "<Monologue>"
    en: The Raptures are no longer infinite.
    ko: 랩쳐는 무한하지 않으며.
    ja: ラプチャーにも限界がある
  d_main_46_af_08_68:
    speaker: "<Monologue>"
    en: With Eden's new technology, our equipment production output is sufficient.
    ko: 에덴의 신기술로 인한 장비의 생산량도 충분하다.
    ja: |-
      エデンの技術が応用された
      新式装備の製造も十分に進んでいる
  d_main_46_af_08_69:
    speaker: "<Monologue>"
    en: The Ark's strength is at its peak.
    ko: 방주의 힘은 최전성기를 맞이하고 있고.
    ja: アークの戦力は過去にない水準に至った
  d_main_46_af_08_70:
    speaker: "<Monologue>"
    en: And our comrades on the surface will be a great asset to us.
    ko: 지상의 동료들도 큰 힘이 되어줄 것이다.
    ja: 地上にいる友軍の協力も期待できる
  d_main_46_af_08_71:
    speaker: "<Self>"
    en: The time for the Third Surface Reclamation War is now. If we don't do this
      now, it will be impossible later.
    ko: |-
      3차 지상 탈환전은 지금이 적기입니다.
      아니, 지금이 아니라면 불가능합니다.
    ja: |-
      第三次地上奪還戦には、今が好機です。
      いや、今を逃せば不可能になります
  d_main_46_af_08_72:
    speaker: ingrid
    en: "... I agree."
    ko: "…찬성한다."
    ja: "…私は賛成する。"
  d_main_46_af_08_73:
    speaker: andersen
    en: "... We haven't even put this to a vote yet."
    ko: "…아직 투표도 시작하지 않았네만."
    ja: "…まだ投票は始まっていないぞ。"
  d_main_46_af_08_74:
    speaker: ingrid
    en: I'm fully in agreement!
    ko: 찬성! 무조건 찬성이다!
    ja: 賛成！賛成に決まっている！
  d_main_46_af_08_75:
    speaker: ingrid
    en: We're talking about surface reclamation. Doesn't just the thought of it make
      your heart race?
    ko: 지상 탈환이라니! 말만 들어도 설레지 않나!
    ja: 地上奪還！口にするだけで奮い立つ！
  d_main_46_af_08_76:
    speaker: ingrid
    en: This is the moment Elysion has been walking the tactical path toward!
    ko: 이때를 위해 엘리시온은 지금껏 택티컬의 길을…!
    ja: |-
      我がエリシオンはこの時のため、
      今までタクティカルの道を…！
  d_main_46_af_08_77:
    speaker: ingrid
    en: Onward AZX! Onward Admire!
    ko: |-
      가라 AZX!
      가라 어드마이어!
    ja: |-
      行くぞAZX！
      行くぞアドマイアー！
  d_main_46_af_08_78:
    speaker: ingrid
    en: Onward Wings of Victor—!
    ko: 가라 승리의 날-!
    ja: そして勝利の翼…！
  d_main_46_af_08_79:
    speaker: syuen
    en: Pipe down, Miss Tactical.
    ko: 아 택티컬 택티컬 시끄러.
    ja: |-
      ああもう、タクティカルタクティカルって
      うっさいわね…
  d_main_46_af_08_80:
    speaker: ingrid
    en: Whew... my apologies. I got a bit carried away there.
    ko: |-
      후우…! 미안하군.
      너무 흥분했다.
    ja: |-
      くっ…！面目ない。
      私としたことが、我を忘れてしまった。
  d_main_46_af_08_81:
    speaker: syuen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_82:
    speaker: syuen
    en: Will this be another large-scale surface deployment?
    ko: 이번에도 대규모 지상 파견 형태야?
    ja: 大規模な地上派遣をするってことね？
  d_main_46_af_08_83:
    speaker: andersen
    en: That remains to be seen, but it's unlikely.
    ko: 검토해 봐야겠지만, 그럴 가능성은 낮겠지.
    ja: 検討の必要はあるが、そうなる可能性が高い。
  d_main_46_af_08_84:
    speaker: andersen
    en: In many ways, this may well be our last opportunity.
    ko: 여러 가지 의미로, 마지막 기회가 될 테니 말일세.
    ja: |-
      色々な面で、
      これが最後のチャンスになるだろうからな。
  d_main_46_af_08_85:
    speaker: syuen
    en: Right?
    ko: 그렇지?
    ja: そうよね？
  d_main_46_af_08_86:
    speaker: syuen
    en: "... Fine. I'll run a check on that function then."
    ko: "…좋아. 그럼 그 기능 점검해 볼게."
    ja: "…仕方ないわね。あれの再点検もしておく。"
  d_main_46_af_08_87:
    speaker: syuen
    en: It's been maintained pretty consistently, so there shouldn't be a problem.
    ko: 지금까지 꾸준히 관리하고 있던 거라서, 문제는 없을 거야.
    ja: |-
      日頃からキッチリ管理してるから、
      問題は出ないと思うけど。
  d_main_46_af_08_88:
    speaker: andersen
    en: Much appreciated.
    ko: 부탁하지.
    ja: 頼んだ。
  d_main_46_af_08_89:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "……？"
  d_main_46_af_08_90:
    speaker: syuen
    en: What, you didn't know?
    ko: 뭐야. 너 몰라?
    ja: 何よ。お前、知らなかった？
  d_main_46_af_08_91:
    speaker: syuen
    en: The Ark can rise to the surface.
    ko: 방주. 지상으로 올릴 수 있어.
    ja: アークは地表へ浮上できるの。
  d_main_46_af_08_92:
    speaker: "<Self>"
    en: What?!
    ko: "…뭐…!?"
    ja: 何…！？
  d_main_46_af_08_93:
    speaker: syuen
    en: It is not called the Ark for nothing. It can float. That's what it was designed
      and built for.
    ko: |-
      이름이 괜히 방주가 아니야.
      올릴 수 있어. 그걸 산정하고 만들어진 거야.
    ja: |-
      アークの名前はダテじゃないのよ。
      最初から地上に上がることを見越して
      設計されてたワケ。
  d_main_46_af_08_94:
    speaker: "<Self>"
    en: Th-the Ark can rise to the surface?!
    ko: 바, 방주가 지상으로 올라간다고?
    ja: ア、アークが地表へ浮上できる？
  d_main_46_af_08_95:
    speaker: syuen
    en: Yes, how many times do I have to say it? It rises. It can go up.
    ko: |-
      아 몇 번을 말해.
      올라가. 올라간다고.
    ja: |-
      同じことを何度も言わせないで。
      そう。地上に出せるのよ。
  d_main_46_af_08_96:
    speaker: "<Self>"
    en: I can't believe it...
    ko: "…말도 안 돼."
    ja: "…信じられない"
  d_main_46_af_08_97:
    speaker: andersen
    en: Enikk, if you would.
    ko: "…에닉."
    ja: "…エニック。"
  d_main_46_af_08_98:
    speaker: enikk_op_r
    en: Yes. I will review the feasibility, timing, and probability of success for
      the Third Surface Reclamation War.
    ko: 예. 3차 지상 탈환전의 실행 가능 여부, 시기, 성공 확률 등을 적극적으로 검토하겠습니다.
    ja: |-
      はい。第三次地上奪還戦の実行可否、
      時期、成功率など、優先的に計算します。
  d_main_46_af_08_99:
    speaker: andersen
    en: How long will it take?
    ko: 얼마나 걸릴 것 같나.
    ja: どの程度の時間が要る？
  d_main_46_af_08_100:
    speaker: enikk_op_r
    en: The report will be ready within one month.
    ko: 한 달 이내에 가능합니다.
    ja: 1ヶ月以内に完了の見込みです。
  d_main_46_af_08_101:
    speaker: andersen
    en: Good. I'll leave it to you.
    ko: 좋아. 부탁하지.
    ja: 分かった。よろしく頼む。
  d_main_46_af_08_102:
    speaker: andersen
    en: Ah, right. We need the two other Deputy Chiefs to agree on this.
    ko: "…아, 나머지 둘의 부사령관의 동의를 받아야겠군."
    ja: "…残りの副司令官2名からの同意も必要だな。"
  d_main_46_af_08_103:
    speaker: andersen
    en: A matter of this magnitude requires a unanimous decision.
    ko: 이런 건은 만장일치가 아니면 안 될 테니.
    ja: 重大事項だ、満場一致が条件になる。
  d_main_46_af_08_104:
    speaker: burningum
    en: Th-there's no need to worry. The c-commander in chief is still in the same
      state...
    ko: |-
      그, 그건 괜찮아.
      초, 총사령관님은 아직까지 그, 그런 상태고….
    ja: |-
      そ、それなら心配は不要だ。
      そ、総司令官は相変わらずだし…
  d_main_46_af_08_105:
    speaker: burningum
    en: Th-the remaining two have delegated full au-authority to me.
    ko: 나, 나머지 둘은 나한테 전권을 이, 일임했으니까.
    ja: |-
      あ、あとの2名は、
      私に全権を委任している。
  d_main_46_af_08_106:
    speaker: andersen
    en: "... I see they still have no interest in the Ark."
    ko: 흠… 여전히 방주에는 관심이 없군. 그 둘은.
    ja: |-
      フン…こんな事態になっても
      アークには関心がないようだな。あの2人は。
  d_main_46_af_08_107:
    speaker: andersen
    en: I'd like each of you to begin your research and preparations with the Third
      Surface Reclamation War's execution in mind.
    ko: 그럼 각자 3차 지상 탈환전의 실행을 염두에 둔 채 조사와 준비를 해주게.
    ja: |-
      では各自、第三次地上奪還戦の開始を
      念頭に置き、調査と準備を進めてくれたまえ。
  d_main_46_af_08_108:
    speaker: mustang
    en: Un moment.
    ko: Wait.
    ja: Wait！
  d_main_46_af_08_109:
    speaker: andersen
    en: What is it, Mustang?
    ko: 뭔가. 머스탱.
    ja: どうした？マスタング。
  d_main_46_af_08_110:
    speaker: mustang
    en: You're announcing the Third Surface Reclamation War maintenant?
    ko: 지금 Time에 3rd 지상 탈환전을 발표한다고Yo?
    ja: |-
      こんなTimeに第三次地上奪還戦を
      発表するつもりですKA？
  d_main_46_af_08_111:
    speaker: mustang
    en: Oh non, certainement not! Public morale is at its absolute lowest.
    ko: Oh No. 지금 Ark의 민심은 최악입니Da.
    ja: |-
      Oh No…Arkの人々の心は
      最悪の状態DESU。
  d_main_46_af_08_112:
    speaker: mustang
    en: To déclarer war in the middle of this would be catastrophic.
    ko: 이 와중에 War 선포라니, 난리가 날 게 분명합니Da.
    ja: |-
      Warを始めるなんて発表したら、
      大騒ぎになるに決まっていMASU。
  d_main_46_af_08_113:
    speaker: mustang
    en: I would not be surprised if une révolte occurs.
    ko: Terror가 일어나도 이상하지 않겠지Yo.
    ja: テロだって起こるかもしれませんNE。
  d_main_46_af_08_114:
    speaker: andersen
    en: But we have no proper alternative. Our only choice is to push forward.
    ko: |-
      하지만 마땅한 방법이 없지 않나.
      강행할 수밖에.
    ja: |-
      しかし、他に道もないだろう。
      強行するしかない。
  d_main_46_af_08_115:
    speaker: mustang
    en: C'est moi, I have the idéale solution!
    ko: Me한테 아주 적절한 방법이 있습니Da!
    ja: Meにとっておきの提案がありMASU！
  d_main_46_af_08_116:
    speaker: mustang
    en: We hold un grand concert to célébrer the Third Surface Reclamation War!
    ko: 3rd 지상 탈환전을! 축하하는 Big Big Concert를 여는겁니Da!
    ja: |-
      3rd地上奪還戦への士気向上のTAME！
      Big Big Concertを開催するのDESU！
  d_main_46_af_08_117:
    speaker: mustang
    en: Strip away the solemnité and march toward a better tomorrow pour all of humanité!
    ko: |-
      비장함을 모두 덜어내Go!
      우리 인류가 좀 더 나은 곳으로 향하기 위Han!
    ja: |-
      悲壮感を吹き飛ばし！
      よりよい未来へ人類が向かうためNO！
  d_main_46_af_08_118:
    speaker: mustang
    en: Et voilà! That's how we présent le festival.
    ko: Festival로 Packaging하는 것이지Yo!
    ja: FestivalをしようということDESU！
  d_main_46_af_08_119:
    speaker: andersen
    en: "... Huh."
    ko: "…호오."
    ja: "…ふむ…"
  d_main_46_af_08_120:
    speaker: mustang
    en: Moi excels at this. The crème de la crème, in fact.
    ko: |-
      Me는 그것을 Very 잘합니Da!
      Pro Of Pro라고 할 수 있Jyo!
    ja: |-
      MeはそれがVery得意DESU！
      Pro中のProとも言えるでSHOW！
  d_main_46_af_08_121:
    speaker: mustang
    en: Mais. It will costs beaucoup de money.
    ko: But. Money가 많이 듭니Da!
    ja: |-
      But. それにはBigなMoneyが
      必要になりMASU！
  d_main_46_af_08_122:
    speaker: mustang
    en: This won't end with just one concert, non! We open concert after concert,
      encore et encore!
    ko: |-
      One번으로 End할 것이 아니La!
      수번에 걸쳐 Big Big Concert를 연속으로 Open!
    ja: |-
      One Timeでは終わらせまSEN！
      複数回に渡るBig Big Concertを
      連続で開催しMASU！
  d_main_46_af_08_123:
    speaker: mustang
    en: We will captiver the souls of every Ark citizen, absolument!
    ko: Ark 시민들의 혼을 Ssok 빼놓겠습니Da!
    ja: Ark市民の心をガッチリ捕まえるのDESU！
  d_main_46_af_08_124:
    speaker: mustang
    en: Entertainment, c'est what makes people forget their pain and anxiety!
    ko: Entertainment란 아픔과 불안감을 잊게 만드는 것이니까Yo!
    ja: |-
      苦しみも不安も忘れさせるのが
      EntertainmentですからNE！
  d_main_46_af_08_125:
    speaker: andersen
    en: "... Very well. You'll have the Central Government's backing."
    ko: "…좋네. 중앙 정부 측에서 적극 지원하겠네."
    ja: |-
      …悪くない。
      中央政府からも積極的に
      支援できるようにしておこう。
  d_main_46_af_08_126:
    speaker: andersen
    en: I'll leave that part in your hands.
    ko: 그쪽은 잘 부탁하지.
    ja: それに関しては任せる。
  d_main_46_af_08_127:
    speaker: mustang
    en: C'est bon!
    ko: Yes!
    ja: Yes！
  d_main_46_af_08_128:
    speaker: mustang
    en: Therefore, Commandant.
    ko: 그런고로, Commander!
    ja: そういうわけで、Commander！
  d_main_46_af_08_129:
    speaker: "<Self>"
    en: Yes?
    ko: "…응?"
    ja: "…私か？"
  d_main_46_af_08_130:
    speaker: mustang
    en: T.T. STAR must be the première act at the Third Surface Reclamation War festival!
    ko: T.T. STAR가 3rd 지상 탈환전 축하 Festival에Seo!
    ja: T.T. STARにはそのFestivalで…
  d_main_46_af_08_131:
    speaker: mustang
    en: They must be our numéro un! Absolument!
    ko: First가 되어 줘야 겠습니DAAAAAAA!!
    ja: Firstを飾ってもらいMAAAAASU！！
  d_main_46_af_08_132:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_08_133:
    speaker: "<Self>"
    en: Oh.
    ko: 오.
    ja: え？
d_main_46_af_09:
  d_main_46_af_09_1:
    speaker: eyeri
    en: Ugh...!
    ko: 으윽…!
    ja: うぐっ…！
  d_main_46_af_09_2:
    speaker: ingrid
    en: Are you with us?
    ko: 정신이 드나.
    ja: 気がついたか。
  d_main_46_af_09_3:
    speaker: eyeri
    en: Ah! Ma'am!
    ko: 헉! 사장님!
    ja: ハッ！社長！？
  d_main_46_af_09_4:
    speaker: ingrid
    en: Call me Instructor.
    ko: 교관이라고 불러라.
    ja: 教官と呼べ。
  d_main_46_af_09_5:
    speaker: eyeri
    en: Oh! Instructor!
    ko: 헉! 교관!
    ja: ハッ！教官！
  d_main_46_af_09_6:
    speaker: ingrid
    en: "... I hear you looted the Forbidden Library during the blackout."
    ko: "…방주 정전을 틈타 금서고를 털었다고 들었다."
    ja: "…大停電の隙を狙って禁書庫を漁ったそうだな。"
  d_main_46_af_09_7:
    speaker: ingrid
    en: And that you smuggled out a book about Dorothy.
    ko: 도로시에 대한 책을 빼돌렸고.
    ja: ドロシーに関わる資料を盗み出し…
  d_main_46_af_09_8:
    speaker: ingrid
    en: Apparently you were attacked while making your escape?
    ko: 이동 중에 괴한에게 습격을 당했다고 하더군.
    ja: それを不審な男に襲われ、奪われた。
  d_main_46_af_09_9:
    speaker: ingrid
    en: Is that correct?
    ko: 맞나?
    ja: 間違いないか？
  d_main_46_af_09_10:
    speaker: eyeri
    en: Yes. That's about right.
    ko: 예. 맞아요.
    ja: エヘン、その通りです。
  d_main_46_af_09_11:
    speaker: ingrid
    en: "... What are you being so brazen about."
    ko: "…뭘 그렇게 당당하게 이야기하고 있나."
    ja: "…堂々と胸を張れるようなことか？"
  d_main_46_af_09_12:
    speaker: ingrid
    en: It's only thanks to Arcana that we found you so quickly.
    ko: 아르카나의 도움으로 빨리 발견할 수 있었다.
    ja: |-
      アルカナの通報があったから、
      手遅れにならずにすんだ。
  d_main_46_af_09_13:
    speaker: ingrid
    en: Had we been any later, we might not have been able to save you.
    ko: 조금만 늦었으면 살릴 수 없었을지도 몰라.
    ja: |-
      あと少しでも遅かったら
      どうなっていたか分からん。
  d_main_46_af_09_14:
    speaker: eyeri
    en: But you did save me, didn't you?
    ko: 하지만 살았죠?
    ja: まあ、そうならなかったワケですし？
  d_main_46_af_09_15:
    speaker: ingrid
    en: "*Sigh*"
    ko: "…하아."
    ja: "…はぁ…"
  d_main_46_af_09_16:
    speaker: eyeri
    en: Oh, um... What became of Arcana...?
    ko: 아, 저 혹시 아르카나 그분은 어떻게….
    ja: それで…アルカナさんは…？
  d_main_46_af_09_17:
    speaker: ingrid
    en: Since Forbidden Library materials were leaked under her care, she will be
      punished accordingly...
    ko: "…금서고의 자료가 외부로 유출되었으니 그에 합당한 벌을 받아야 하겠지만-"
    ja: |-
      …禁書庫の資料を外部に流出させた。
      相応の罰を受けることになる…
  d_main_46_af_09_18:
    speaker: eyeri
    en: I'm the one who stole it. She's the victim here.
    ko: 제가 훔쳤어요. 그분은 피해자거든요?
    ja: |-
      私が盗んだだけです。
      あちらは被害者ですよ？
  d_main_46_af_09_19:
    speaker: eyeri
    en: Why would you punish the victim? What kind of abuse of power is this?
    ko: 피해자에게 벌을 주다니 이 무슨 기업의 횡포인가요?
    ja: 被害者を処罰するなんて、企業の横暴では？
  d_main_46_af_09_20:
    speaker: ingrid
    en: I haven't finished speaking.
    ko: "…아직 얘기가 끝나지 않았다."
    ja: "…まだ話は終わっていない。"
  d_main_46_af_09_21:
    speaker: ingrid
    en: Theoretically speaking, Arcana should be punished, but this only occurred
      due to the unforeseen Ark blackout.
    ko: |-
      원칙대로라면 아르카나에게 벌을 주는 게 맞으나,
      방주 정전이라는 예상 밖의 사태로 인해 생겨난 일이다.
    ja: |-
      原則的にはそうなるべきだが、
      元はと言えばアークの大停電という
      想定外の要因がある。
  d_main_46_af_09_22:
    speaker: ingrid
    en: Given the special circumstances, we've decided not to pursue the matter.
    ko: 특수성을 고려해서, 문제 삼지 않기로 했다.
    ja: |-
      特殊な事情も考慮に入れて、
      今回は不問ということにした。
  d_main_46_af_09_23:
    speaker: ingrid
    en: All things considered, things did not turn out too badly.
    ko: "…결과적으로, 나쁜 그림도 아니게 됐고 말이지."
    ja: |-
      …つまり、悪いようには
      していないという意味だ。
  d_main_46_af_09_24:
    speaker: eyeri
    en: Has the person who shot me been identified? What happened to them?
    ko: |-
      저를 쐈던 건 누군지 밝혀졌나요?
      어떻게 됐죠?
    ja: |-
      私を撃った犯人は？
      どうなりましたか？
  d_main_46_af_09_25:
    speaker: ingrid
    en: They were identified and killed.
    ko: 밝혀졌고, 사살당했다.
    ja: すでに発見されて、射殺された。
  d_main_46_af_09_26:
    speaker: eyeri
    en: Goodness. It just goes to show that crime doesn't pay.
    ko: 세상에. 이래서 죄짓고 살면 안 된다니까.
    ja: |-
      まったく、犯罪なんて
      するものじゃありませんね。
  d_main_46_af_09_27:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_09_28:
    speaker: ingrid
    en: Eyeri.
    ko: 아이리.
    ja: アイリ。
  d_main_46_af_09_29:
    speaker: ingrid
    en: The Forbidden Library's very existence is classified.
    ko: 금서고는 존재 자체만으로 극비다.
    ja: 禁書庫は存在自体が極秘事項だ。
  d_main_46_af_09_30:
    speaker: ingrid
    en: You will be held accountable for leaking its contents without authorization.
    ko: 그곳의 정보를 허가 없이 외부로 유출한 벌을 받아야 할 거다.
    ja: |-
      情報を許可なく外部に
      持ち出したことへの責任は、負ってもらうぞ。
  d_main_46_af_09_31:
    speaker: eyeri
    en: I've got a question.
    ko: 한가지 질문이 있어요.
    ja: ひとつ質問があります。
  d_main_46_af_09_32:
    speaker: ingrid
    en: You're not listening to a word I say. Fine, what is it?
    ko: |-
      …내 말은 전혀 안 듣는군.
      뭐냐.
    ja: |-
      …私の話を聞いていないな。
      何だ？
  d_main_46_af_09_33:
    speaker: eyeri
    en: What were Dorothy's true intentions?
    ko: 도로시의 진의는 뭐였나요?
    ja: ドロシーは何を狙っていたんですか？
  d_main_46_af_09_34:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_09_35:
    speaker: ingrid
    en: To take revenge on the Ark... but she never actually acted on it.
    ko: 방주에 복수하는 것… 이었다만 시도조차 하지 못했다.
    ja: |-
      アークへの復讐…といったところだが
      実行には移していない。
  d_main_46_af_09_36:
    speaker: eyeri
    en: What drove her to seek revenge?
    ko: 왜 복수를 하려고 했나요?
    ja: 何の復讐ですか？
  d_main_46_af_09_37:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_09_38:
    speaker: ingrid
    en: Because the Ark used Dorothy and the Goddess Squad before discarding them.
    ko: 방주가 도로시를, 갓데스 스쿼드를 이용만 하고 버렸기 때문. 이다.
    ja: |-
      アークには、ドロシーとゴッデス部隊を
      利用して、捨てた過去がある。
  d_main_46_af_09_39:
    speaker: eyeri
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_09_40:
    speaker: eyeri
    en: I see.
    ko: 그렇군요.
    ja: そうでしたか。
  d_main_46_af_09_41:
    speaker: ingrid
    en: You seem pleased.
    ko: "…기뻐 보이는군."
    ja: "…嬉しそうだな。"
  d_main_46_af_09_42:
    speaker: eyeri
    en: Yes.
    ko: 예.
    ja: はい。
  d_main_46_af_09_43:
    speaker: eyeri
    en: I'm with an inspection unit.
    ko: 저는 감찰부대.
    ja: 私は監察部隊の所属ですから。
  d_main_46_af_09_44:
    speaker: eyeri
    en: Exposing the dirty secrets of others is the reason for my existence.
    ko: 타인의 치부를 들춰내는 게 삶의 이유니까요.
    ja: |-
      人の隠し事を暴くことこそ
      生きている理由です。
  d_main_46_af_09_45:
    speaker: eyeri
    en: And now... oh my!
    ko: 그런데 아아… 이럴 수가!
    ja: それにしても、ああ…最高の気分です！
  d_main_46_af_09_46:
    speaker: eyeri
    en: To think I've now exposed even the Ark's darkest secret! I love it!
    ko: 하다 하다 이제 방주의 치부마저 들춰내 버렸군요! 너무 좋아!
    ja: |-
      アークの隠し事を暴けたなんて！
      気持ちいい！
  d_main_46_af_09_47:
    speaker: eyeri
    en: I knew there was a reason I didn't quit this job!
    ko: 역시, 이것 때문에 제가 이 일을 그만둘 수 없는 거거든요!
    ja: だからこの仕事はやめられないんですよ！
  d_main_46_af_09_48:
    speaker: eyeri
    en: Go on! Tell me how brilliant I am!
    ko: 자! 어서 제가 유능하다고 말해줘요!
    ja: さあ！私のことを有能だとほめてください！
  d_main_46_af_09_49:
    speaker: ingrid
    en: "... Yes. You are brilliant."
    ko: "…그래. 유능하다."
    ja: "…ああ。実に有能だな。"
  d_main_46_af_09_50:
    speaker: eyeri
    en: Woohoo!
    ko: 야호!
    ja: やった～！
  d_main_46_af_09_51:
    speaker: ingrid
    en: Which is why you will be undergoing a memory wipe.
    ko: 해서, 너는 기억 소거를 받을 거다.
    ja: |-
      そういうわけで、
      お前は記憶消去を受けることになった。
  d_main_46_af_09_52:
    speaker: eyeri
    en: "... Pardon?"
    ko: "…예?"
    ja: "…はい？"
  d_main_46_af_09_53:
    speaker: ingrid
    en: Don't worry. Only the information pertaining to the Forbidden Library will
      be erased.
    ko: 안심해라. 금서고에 대한 정보만 지운다.
    ja: |-
      心配するな。
      消されるのは禁書庫に関する情報に限られる。
  d_main_46_af_09_54:
    speaker: ingrid
    en: But knowing you, you'll find your way back there someday.
    ko: "…너라면, 또 언젠가 거기에 도달하겠지만."
    ja: |-
      …お前のことだ、
      またいつかたどり着いてしまう気はするがな。
  d_main_46_af_09_55:
    speaker: eyeri
    en: Oh, that's no problem then.
    ko: 아, 그럼 문제없어요.
    ja: ああ、それなら問題ありません。
  d_main_46_af_09_56:
    speaker: eyeri
    en: Any chance you could put it off for a while, though?
    ko: 그런데 최대한 늦게 해주시면 안 될까요?
    ja: ただ、もうちょっと後にしてもらえますか？
  d_main_46_af_09_57:
    speaker: eyeri
    en: I'd like to savor this feeling a little longer.
    ko: 이 기분을 좀 더 만끽하고 싶거든요.
    ja: この気分をもう少し味わっていたいので。
  d_main_46_af_09_58:
    speaker: ingrid
    en: "... Fine. As you wish."
    ko: "…그래. 맘대로 해라."
    ja: "…ああ。好きにしろ。"
  d_main_46_af_09_59:
    speaker: ingrid
    en: By the way, where is Avistar? Why isn't she with you?
    ko: |-
      그런데 아비스타는 어디 갔지?
      왜 같이 행동하지 않나.
    ja: |-
      ところで、アビスタはどこへ行った？
      一緒に行動しているはずではないのか。
  d_main_46_af_09_60:
    speaker: eyeri
    en: Oh. Avistar is currently the manager of those pop stars.
    ko: 아. 아비스타는 아이돌 매니저 중이에요.
    ja: |-
      ああ、アビスタなら
      アイドルのマネージャーをやってます。
  d_main_46_af_09_61:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_09_62:
    speaker: ingrid
    en: Where did Elysion go so wrong?
    ko: |-
      어디서부터 잘못된 거지.
      엘리시온은.
    ja: |-
      どこで道を間違えたというのだ、
      エリシオンは…
d_main_46_af_10:
  d_main_46_af_10_1:
    speaker: anis_i_w
    en: So...
    ko: "…그으래서."
    ja: "…それで…"
  d_main_46_af_10_2:
    speaker: anis_i_w
    en: T.T. STAR's comeback concert has been upgraded once again?
    ko: T.T. STAR의 복귀 공연이 또 한 번 업그레이드 되었다고?
    ja: |-
      T.T. STARのライブが
      またアップグレードされるってこと？
  d_main_46_af_10_3:
    speaker: "<Self>"
    en: Yes.
    ko: 응.
    ja: そうなる
  d_main_46_af_10_4:
    speaker: rapi_red
    en: And it's the first step in preparation for the Third Surface Reclamation War.
    ko: "…그것도, 3차 지상 탈환전 준비 과정 중 첫 번째 단추라."
    ja: |-
      …それも、第三次地上奪還戦記念イベントの
      一発目よ。
  d_main_46_af_10_5:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_10_6:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_10_7:
    speaker: rapi_red
    en: Isn't it a bit much?
    ko: 너무 크지 않아?
    ja: 責任が重すぎない？
  d_main_46_af_10_8:
    speaker: neon_v_w
    en: Tell me about it.
    ko: 그러게요.
    ja: そうですね。
  d_main_46_af_10_9:
    speaker: anis_i_w
    en: My thoughts exactly...
    ko: 내 말이….
    ja: そうよね…
  d_main_46_af_10_10:
    speaker: anis_i_w
    en: We're not the only ones performing, right? Given the scale of things.
    ko: |-
      우리만 하는 건 아니겠지?
      규모가 규모다 보니.
    ja: |-
      私たちだけじゃないんでしょ？
      さすがに規模が大きいし。
  d_main_46_af_10_11:
    speaker: "<Self>"
    en: There may be some supporting acts, but it's essentially a T.T. STAR solo concert.
    ko: |-
      게스트는 있을지도 모른다고 했는데,
      기본적으로 T.T. STAR 단독 공연이야.
    ja: |-
      ゲスト出演があるかもと言っていたが
      基本的にはT.T. STARの単独のはずだ
  d_main_46_af_10_12:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_10_13:
    speaker: anis_i_w
    en: Did you obtain the Nikke production technology?
    ko: 그. 니케 제작 기술은 받았어?
    ja: そういえば…ニケの製造技術は手に入ったの？
  d_main_46_af_10_14:
    speaker: "<Self>"
    en: Yes. Missilis provided it.
    ko: 응. 미실리스에게 제공 받았어.
    ja: ああ、ミシリスから提供を受けた
  d_main_46_af_10_15:
    speaker: neon_v_w
    en: Huh? Why Missilis and not Elysion? Are you not afraid of our tactical ways?
    ko: |-
      예에~? 왜 엘리시온이 아니라 미실리스죠?
      택티컬이 두렵지도 않으신가요?
    ja: |-
      ええ～？エリシオンではなくミシリスですか？
      タクティカルの力が分かってないんですか？
  d_main_46_af_10_16:
    speaker: "<Self>"
    en: Missilis is the best when it comes to Nikke production technology, after all.
    ko: 미실리스가 니케 제작 기술 자체로만 보면 최고니까.
    ja: |-
      製造技術だけで見れば、
      ミシリスが先を行っているからな
  d_main_46_af_10_17:
    speaker: neon_v_w
    en: Hmm... I suppose that's true...
    ko: 으음… 그건 그런 것 같기도 한데….
    ja: うーん…それはそうかもしれませんが…
  d_main_46_af_10_18:
    speaker: anis_i_w
    en: If we've secured the technology, we should head to Eden quickly.
    ko: 니케 제작 기술도 확보했으면 빨리 에덴에 올라가야겠네.
    ja: 手に入ったなら、早くエデンに渡さないとね。
  d_main_46_af_10_19:
    speaker: anis_i_w
    en: It can't be helped. We're short on time, so let's get going.
    ko: "…어쩔 수 없지. 한시가 급하니 얼른 올라가자."
    ja: |-
      …仕方ないわね～…
      一刻を争うことだし、早く行きましょ。
  d_main_46_af_10_20:
    speaker: "<Self>"
    en: Your participation in the concert is mandatory, Anis.
    ko: 공연에는 아니스의 참가가 필수야.
    ja: ステージの方が最優先だ
  d_main_46_af_10_21:
    speaker: anis_i_w
    en: Huh? Me?
    ko: "…응? 나?"
    ja: "…え？そっち？"
  d_main_46_af_10_22:
    speaker: "<Self>"
    en: Yes.
    ko: 응.
    ja: ああ
  d_main_46_af_10_23:
    speaker: "<Monologue>"
    en: I explain to everyone.
    ko: 모두에게 설명한다.
    ja: 全員に事情を説明した
  d_main_46_af_10_24:
    speaker: "<Monologue>"
    en: Thanks to her heroics on Punk Street, shooting down the black spire,
    ko: |-
      펑크 스트리트에서 보여준 아니스의 활약과,
      검은 탑을 격추했던 모습.
    ja: |-
      パンクストリートでの避難誘導や
      アークに接近した黒い塔の撃退…
  d_main_46_af_10_25:
    speaker: "<Monologue>"
    en: and also her performance in the recent battle with Sixo, Anis's recognition
      has greatly increased.
    ko: |-
      그리고 이번 식스오 전에서 보여준 아니스의 활약 덕분에,
      아니스의 인지도가 크게 치솟은 상태다.
    ja: |-
      さらにシックスオー戦での活躍で
      アニスの知名度は急激に上がっている
  d_main_46_af_10_26:
    speaker: "<Monologue>"
    en: All of these achievements occurred inside the Ark and were witnessed by numerous
      people.
    ko: 이 모든 활약상은 방주 안에서 일어난 일이었고 수많은 목격자를 낳았다.
    ja: |-
      アーク内で繰り広げられた戦いは、
      すべて大勢の目撃者を生んでいた
  d_main_46_af_10_27:
    speaker: "<Monologue>"
    en: As a result, Anis has become one of the most famous Nikkes in the Ark,
    ko: 그 덕에 아니스는 지금 방주 내에서 가장 유명한 니케 중 하나가 되어
    ja: |-
      アニスは現在、アーク内で
      もっとも有名なニケとなっている
  d_main_46_af_10_28:
    speaker: "<Monologue>"
    en: having established herself as a symbol of hope who saved the Ark in its darkest
      hour.
    ko: |-
      방주를 위기에서 구한,
      희망의 상징으로 자리 잡았다.
    ja: |-
      アークを危機から救った、
      希望の象徴とも言える
  d_main_46_af_10_29:
    speaker: "<Monologue>"
    en: The fate of the entire Ark is at stake with the Third Surface Reclamation
      War.
    ko: |-
      3차 지상 탈환전은 방주의 명운을 건,
      중요하고도 위험한 일이다.
    ja: |-
      第三次地上奪還戦はアークの命運をかけた
      重要かつ危険な作戦になる
  d_main_46_af_10_30:
    speaker: "<Monologue>"
    en: As a symbol of hope, Anis must stand behind it.
    ko: 희망의 상징이 된 아니스가 그것을 독려해야 한다.
    ja: |-
      市民の士気向上のためにも
      シンボルとしてアニスの存在は不可欠だ
  d_main_46_af_10_31:
    speaker: "<Monologue>"
    en: Since she has past experience as a pop star, it is a perfect opportunity.
    ko: 마침 과거에 아이돌로 활동했던 내역도 있으니 더할 나위 없는 기회다.
    ja: |-
      アイドルとしての活動経験もあり、
      最重要のポジションとなる
  d_main_46_af_10_32:
    speaker: "<Monologue>"
    en: That is the position of the Central Government and Tetra.
    ko: "…라는 게 중앙 정부와 테트라의 입장이라는 것을 전달한다."
    ja: |-
      …ということが、中央政府とテトラの
      見解だということを伝えた
  d_main_46_af_10_33:
    speaker: anis_i_w
    en: A symbol...
    ko: "…상징."
    ja: "…希望の象徴。"
  d_main_46_af_10_34:
    speaker: anis_i_w
    en: Me...?
    ko: "…내가."
    ja: "…私が。"
  d_main_46_af_10_35:
    speaker: "<Self>"
    en: Yes.
    ko: 응.
    ja: そうだ
  d_main_46_af_10_36:
    speaker: "<Self>"
    en: I'd wager you're a source of hope for a lot of people in the Ark.
    ko: |-
      아마 방주의 수많은 사람이,
      아니스를 보고 희망을 품지 않았을까 해.
    ja: |-
      きっとアークの大勢の人々が、
      アニスを見て希望を持ったはずだ
  d_main_46_af_10_37:
    speaker: "<Self>"
    en: The Third Surface Reclamation War must not fail. And since you've now become
      a symbol of hope...
    ko: |-
      3차 지상 탈환전은 실패하면 안 돼.
      지금, 희망의 상징이 된 아니스가….
    ja: |-
      第三次地上奪還戦に失敗は許されない。
      だからこそ、希望の象徴であるアニスには…
  d_main_46_af_10_38:
    speaker: "<Self>"
    en: You need to inspire that hope in others.
    ko: 사람들에게 희망을 불어넣어 줘야 해.
    ja: みんなに希望を与えてもらう必要がある
  d_main_46_af_10_39:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_10_40:
    speaker: "<Self>"
    en: You need to show them who you are, Anis.
    ko: 너를 보여줘야지. 아니스.
    ja: 存分に見せつけてやるんだ、アニス
  d_main_46_af_10_41:
    speaker: "<Self>"
    en: Show them how radiant you are.
    ko: 빛나는 너를.
    ja: 輝く君を
  d_main_46_af_10_42:
    speaker: "<Monologue>"
    en: Rapi and Neon place their hands on Anis' shoulders.
    ko: 라피와 네온이 아니스의 어깨에 손을 올린다.
    ja: ラピとネオンが、アニスの肩に手を乗せた
  d_main_46_af_10_43:
    speaker: rapi_red
    en: Be humble, Anis.
    ko: 겸손해야 해. 아니스.
    ja: 調子に乗りすぎてはダメよ、アニス。
  d_main_46_af_10_44:
    speaker: neon_v_w
    en: Don't get all high and mighty just because you got a little famous.
    ko: 인기 좀 얻었다고 턱 들고 다니지 마시고요.
    ja: |-
      ちょっと人気が出たからって
      足下をおろそかにしちゃダメですよ？
  d_main_46_af_10_45:
    speaker: anis_i_w
    en: I haven't even done anything!
    ko: 아직 시작도 안 했거든?
    ja: まだ始めてもいないでしょうが！？
  d_main_46_af_10_46:
    speaker: anis_i_w
    en: "... Wait. Then are you going to Eden without me?"
    ko: "…엇. 그럼 나 놔두고 에덴으로 가는 거야?"
    ja: "…あ…それで、エデンは私抜きで行くってこと？"
  d_main_46_af_10_47:
    speaker: "<Self>"
    en: No. We'll catch your concert first, then go after.
    ko: 아니. 아니스 공연 보고 올라갈 거야.
    ja: いや、アニスのライブを見てから行くつもりだ
  d_main_46_af_10_48:
    speaker: anis_i_w
    en: You sure that's okay time-wise?
    ko: "…시간 괜찮은거야?"
    ja: "…それで大丈夫なの？"
  d_main_46_af_10_49:
    speaker: "<Self>"
    en: This doesn't only concern you. It's also important for the Counters.
    ko: |-
      이건 아니스만의 일이 아니라,
      카운터스에게도 중요한 일이 될 거야.
    ja: |-
      これはアニスだけじゃなく
      カウンターズにとって重要なことだ
  d_main_46_af_10_50:
    speaker: "<Self>"
    en: We'll finally get to see the fruits of our labor.
    ko: 우리가 해왔던 일이, 어떤 결과로 오는지 확인할 수 있을 테니까.
    ja: |-
      私たちのしてきたことが
      どう返ってくるかを見届けたい
  d_main_46_af_10_51:
    speaker: "<Self>"
    en: I think it'll be a good source of motivation for what's to come.
    ko: 앞으로의 일에 큰 도움이 될 거라고 생각해.
    ja: その経験が、きっと後で役に立つ
  d_main_46_af_10_52:
    speaker: "<Self>"
    en: Going to Eden after the concert is the right call.
    ko: 에덴에는, 그 이후에 가는 게 맞아.
    ja: それが終わったらエデンに向かおう
  d_main_46_af_10_53:
    speaker: "<Self>"
    en: Some of the Nikke production technology has already been sent ahead. The important
      parts must be delivered in person, but they can at least start setting things
      up.
    ko: |-
      니케 제작 기술 일부는 미리 보내놨어.
      중요한 건 직접 전해줘야겠지만, 시작은 할 수 있어.
    ja: |-
      技術の一部はもう送ってある。重要な情報は
      直接渡すが、作業に遅れは出ないはずだ
  d_main_46_af_10_54:
    speaker: "<Self>"
    en: So, get yourself ready.
    ko: 그러니, 제대로 준비하고.
    ja: 今はこちらのことに集中して…
  d_main_46_af_10_55:
    speaker: "<Self>"
    en: Let's put on a show.
    ko: 공연하자.
    ja: 最高のステージにしてくれ
  d_main_46_af_10_56:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_10_57:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_46_af_10_58:
    speaker: anis_i_w
    en: "... All right!"
    ko: "…좋아!"
    ja: "…よーし！"
  d_main_46_af_10_59:
    speaker: anis_i_w
    en: I'll put on one hell of a show!
    ko: 멋지게 한 번 해볼게!
    ja: 素敵なライブにしてみせるわ！
  d_main_46_af_10_60:
    speaker: neon_v_w
    en: You'll make sure our tickets are sorted, right?
    ko: 저희 티켓은 잘 좀 챙겨주실 거죠?
    ja: 私たちのチケット、用意してもらえますよね？
  d_main_46_af_10_61:
    speaker: rapi_red
    en: Be sure to give us good seats.
    ko: 좋은 자리로 부탁해.
    ja: いい席を頼むわ。
  d_main_46_af_10_62:
    speaker: anis_i_w
    en: Of course!
    ko: 그래그래.
    ja: はいはい。
  d_main_46_af_10_63:
    speaker: anis_i_w
    en: You'll have the best seats in the house, with the best view of my performance.
    ko: |-
      최고의 자리에서.
      최고의 무대를 볼 수 있게 해줄게.
    ja: 最高の席で、最高のステージを見せてあげる。
