---
d_main_49_01:
  d_main_49_01_1:
    speaker: "<Self>"
    en: Damn it! It's not moving!
    ko: 젠장! 꼼짝도 안 해!
    ja: ダメだ！びくともしない！
  d_main_49_01_2:
    speaker: anis_i_w
    en: Come on! That's just way too big!
    ko: 아니! 인간적으로 너무 크잖아 이거!
    ja: |-
      ちょっと！
      いくらなんでも大きすぎるでしょ、これ！
  d_main_49_01_3:
    speaker: neon_v_w
    en: On top of that, it's moving insanely fast! It just looks slow!
    ko: 거기다 속도도 너무 빠른데요! 보기에는 느린데!
    ja: |-
      それに、スピードも速すぎます！
      見た目は遅そうなのに！
  d_main_49_01_4:
    speaker: bahamut
    en: That's because it's so large. It has the stride of a giant.
    ko: |-
      덩치가 너무 커서 그렇다.
      거인의 걸음 같은 것이지.
    ja: |-
      身体が大きすぎるせいだな。
      巨人の一歩は大きいということだ。
  d_main_49_01_5:
    speaker: behemoth
    en: Honestly, I'm struggling just to keep up!
    ko: 솔직히 쫓아가기도 벅차!
    ja: 正直、ついていくだけでもキツいぜ！
  d_main_49_01_6:
    speaker: leviathan
    en: Ziz! Can you fly up to her head?
    ko: 지즈! 머리로 날아갈 수 없어?
    ja: ジズ！頭まで飛んで行けない？
  d_main_49_01_7:
    speaker: ziz
    en: I-I think so...!
    ko: 가, 가능하긴 할 텐데에…!
    ja: で、できるとは思うけどぉ…！
  d_main_49_01_8:
    speaker: "<Narration>"
    en: The top of the Goddess of Victory statue glows an eerie red.
    ko: 여신상의 꼭대기가 불길한 붉은색으로 빛난다.
    ja: 女神像の頂きが禍々しい赤の光を放っている
  d_main_49_01_9:
    speaker: "<Narration>"
    en: I have to crane my neck to see it, but the light is clearly visible.
    ko: "…한참을 올려다 보아야 하지만, 빛은 확실히 보인다."
    ja: |-
      …ずいぶん見上げる必要はあるが、
      光だけははっきりと見えた
  d_main_49_01_10:
    speaker: "<Narration>"
    en: "*Pshoom!*"
    ko: 푸슈우우우---!!
    ja: バシュッ――！！
  d_main_49_01_11:
    speaker: "<Narration>"
    en: The red light shoots toward the sky.
    ko: 하늘로 쏘아진 붉은색 빛.
    ja: 光が天へと放たれた
  d_main_49_01_12:
    speaker: "<Narration>"
    en: Soon, dozens... no, hundreds of red beams pour down overhead.
    ko: 곧 수십, 아니 수백 가닥의 붉은색 빛이 우리 머리 위에서 쏟아진다.
    ja: |-
      少しの間をおいて、数十、いや数百の
      赤い光線が私たちの上から降り注いだ
  d_main_49_01_13:
    speaker: "<Self>"
    en: What's happening?!
    ko: 뭐야 이게 대체…!
    ja: なんという威力だ…！
  d_main_49_01_14:
    speaker: "<Narration>"
    en: "*Boom! Boom! Boom!*"
    ko: 콰과과과광--!
    ja: ドガガガガガッ――！
  d_main_49_01_15:
    speaker: "<Narration>"
    en: The red light pours down like rain, tearing the ground apart.
    ko: 붉은색 빛의 비가 쏟아지고, 지면이 엉망이 된다.
    ja: |-
      降り注ぐ赤い光の雨が
      地形そのものを変えていく
  d_main_49_01_16:
    speaker: "<Narration>"
    en: All we can do is scramble to avoid the barrage.
    ko: 우리 모두는 그 공격을 피해내는데 급급할 뿐이다.
    ja: 私たちは回避するだけで精一杯だった
  d_main_49_01_17:
    speaker: "<Narration>"
    en: Meanwhile, the statue has gotten even further ahead.
    ko: 그리고 그 사이, 여신상은 한참을 앞서가있다.
    ja: その間にも女神像は、はるか先へと進んでいる
  d_main_49_01_18:
    speaker: ziz
    en: I-It's hopeless unless we can break through all this!
    ko: 이, 이런 걸 뚫고 가지 못하는 이상 무리야아…!
    ja: こ、これをなんとかしないと、どうにも…！
  d_main_49_01_19:
    speaker: hongryeon_g
    en: Very well. Then break through we shall. Bear me upon thy wings.
    ko: 좋아. 그럼 뚫어봄세. 나를 태워주게나.
    ja: |-
      よし。ならば私が行こう。
      乗せておくれ。
  d_main_49_01_20:
    speaker: ziz
    en: B-but... It's even more impossible if I'm carrying someone.
    ko: 아, 아니이… 태우고 가는 건 더 무리지 않을까?
    ja: え、えぇと…誰かを乗せたらもっと無理かも…
  d_main_49_01_21:
    speaker: rapunzel_s
    en: I'll try to get closer!
    ko: 제가 접근해볼게요!
    ja: 私が近づいてみます！
  d_main_49_01_22:
    speaker: "<Narration>"
    en: Rapunzel's halo glows, and the red components begin to vibrate.
    ko: 라푼젤의 타륜이 빛나고, 붉은색 파츠들이 진동한다.
    ja: |-
      ラプンツェルの輪が輝き、
      赤いパーツが振動する
  d_main_49_01_23:
    speaker: "<Narration>"
    en: Rapunzel kicks off the ground and launches herself into the air, quickly closing
      the distance to the statue.
    ko: 지면을 박차고 점프한 라푼젤은, 단숨에 여신상과의 거리를 좁힌다.
    ja: |-
      地面を蹴って跳び上がったラプンツェルは、
      瞬く間に女神像との距離を縮めた
  d_main_49_01_24:
    speaker: behemoth
    en: Incredible...!
    ko: 대단해…!
    ja: すげぇ…！
  d_main_49_01_25:
    speaker: neon_v_w
    en: Wow! She just hops around like a flea!
    ko: 우와! 벼룩같아요!
    ja: わぁ！ノミみたいです！
  d_main_49_01_26:
    speaker: anis_i_w
    en: Of all things to compare her to...
    ko: 비유를 해도 꼭.
    ja: もっといいもので例えなさいよ。
  d_main_49_01_27:
    speaker: "<Narration>"
    en: Just as Rapunzel is about to land on a protruding part of the statue...
    ko: 크게 점프한 라푼젤이 여신상의 돌출된 부분에 착지하려는 순간.
    ja: |-
      跳躍したラプンツェルが
      女神像に足を着けようとした瞬間…
  d_main_49_01_28:
    speaker: rapunzel_s
    en: Oh dear...
    ko: "…어머."
    ja: "…これは！？"
  d_main_49_01_29:
    speaker: "<Narration>"
    en: "*Boooom!*"
    ko: 꽈아아앙--!!
    ja: ドガッ！！
  d_main_49_01_30:
    speaker: "<Narration>"
    en: Suddenly, as if pulled from below, Rapunzel plummets straight to the ground.
    ko: "…갑자기 누가 아래에서 잡아당긴 듯, 라푼젤이 수직 하락해 바닥에 추락한다."
    ja: |-
      突然、誰かに下から引っ張られたかのごとく
      垂直落下し、地面に墜落した
  d_main_49_01_31:
    speaker: "<Narration>"
    en: She scrambles to her feet.
    ko: 라푼젤이 허둥대며 일어난다.
    ja: 幸い、ラプンツェルはすぐに立ち上がった
  d_main_49_01_32:
    speaker: rapunzel_s
    en: G-goodness gracious...!
    ko: 세, 세상에…!
    ja: 今のは…困りましたね…
  d_main_49_01_33:
    speaker: hongryeon_g
    en: If thou hast yet to grow accustomed to thy body, do not strain thyself so.
    ko: 바디 적응이 안 된다면 너무 그렇게 무리하지 말게나.
    ja: |-
      ボディがなじんでおらぬのなら、
      無理をするでない。
  d_main_49_01_34:
    speaker: rapunzel_s
    en: It has a gravity field.
    ko: 중력장이 있네요.
    ja: 重力場があります。
  d_main_49_01_35:
    speaker: hongryeon_g
    en: Pardon...?
    ko: "…뭐?"
    ja: "…何？"
  d_main_49_01_36:
    speaker: rapunzel_s
    en: If you get close, it'll drag you downward.
    ko: 접근하면, 아래를 향해 낙하시켜요.
    ja: 近づきすぎると、真下に落とされるようです。
  d_main_49_01_37:
    speaker: rapi_red
    en: But Snow White's attacks...
    ko: 하지만 스노우 화이트의 공격이….
    ja: でも、スノーホワイトの攻撃は…
  d_main_49_01_38:
    speaker: "<Narration>"
    en: I turn my head to look at Snow White.
    ko: 고개를 돌려 스노우 화이트를 바라본다.
    ja: 振り返り、スノーホワイトの様子を確かめた
  d_main_49_01_39:
    speaker: "<Narration>"
    en: She's running parallel to the advancing statue, relentlessly unleashing her
      attacks.
    ko: 전진하는 여신상과 수평으로 달리며, 계속해서 공격을 퍼붓고 있다.
    ja: |-
      前進する女神像に並走しながら、
      攻撃を浴びせ続けている
  d_main_49_01_40:
    speaker: "<Narration>"
    en: She focuses all her fire on the statue's lower half, but it regenerates almost
      instantly.
    ko: |-
      여신상의 하단에 모든 공격이 명중하지만,
      곧바로 재생된다.
    ja: |-
      女神像の脚回りに命中はしているが、
      すぐに再生されているようだ
  d_main_49_01_41:
    speaker: hongryeon_g
    en: "... Aye. It appears it doth simply bear attacks that its regeneration can
      overcome."
    ko: "…과연. 재생으로 대응할 수 있는 공격은 그대로 받는 모양일세."
    ja: |-
      …なるほど。あの攻撃は
      それにも及ばぬというわけか。
  d_main_49_01_42:
    speaker: rapunzel_s
    en: It seems to be more wary of me, since my vibrating staff can disrupt the structure
      of the nanomachines.
    ko: |-
      제 진동 지팡이는 나노머신의 배열을 흩어놓을 수 있으니까요.
      경계하는 모양이에요.
    ja: |-
      私の杖には対ナノマシン用の
      能力がありますから、
      特に警戒されたのでしょう。
  d_main_49_01_43:
    speaker: hongryeon_g
    en: Then it seems it doth not merely press forward, but is ever on its guard.
    ko: |-
      그냥 전진만하고 있다는 얘기가 아니란 말이겠군.
      경계도 하고 있어.
    ja: |-
      ただの散歩でもないということだねぇ。
      しっかりとこちらを警戒しておる。
  d_main_49_01_44:
    speaker: leviathan
    en: That's not good. It's hard to approach her from the air with those destructive
      beams raining down, and she can regenerate, too.
    ko: 안 좋아. 빔을 비처럼 뿌려대는 바람에 비행으로 접근하기도 쉽지 않고, 재생 능력도 있어.
    ja: |-
      面倒ね…雨みたいなビームのせいで
      飛んで近づくのも難しいし、再生能力もある…
  d_main_49_01_45:
    speaker: leviathan
    en: On top of that, she can create a gravity field around her whenever she needs
      to? What can't she do?
    ko: |-
      거기다 필요할 때 몸 주위에 중력장을 전개할 수도 있다고?
      좋은 건 다 가져갔잖아.
    ja: |-
      おまけに、必要な時は
      重力場も展開できるなんて、
      やっかいな能力盛りすぎでしょ。
  d_main_49_01_46:
    speaker: rapi_red
    en: She probably has more surprises in store for us.
    ko: 그게 전부는 아니겠지.
    ja: まだ隠しているものだってあるはずよ。
  d_main_49_01_47:
    speaker: "<Self>"
    en: "... All right. Then let's approach it from underground."
    ko: "…좋아. 그럼 지면을 통해 진입하자."
    ja: "…ならばいっそ、地面の下から行くか…？"
  d_main_49_01_48:
    speaker: rapi_red
    en: Good thinking. We could drill through the ground, then make our way inside
      the statue...
    ko: |-
      좋은 생각입니다.
      드릴로 땅을 파고 들어간 다음, 여신상의 몸 내부를 향해 침투한다면….
    ja: |-
      悪くないかと。
      地面を掘り進み、あれの内側へ
      侵入するというのは…
  d_main_49_01_49:
    speaker: neon_v_w
    en: Ooh, that's a classic when going up against a giant boss.
    ko: 오. 거대 보스를 상대할 때의 정공법이네요.
    ja: おお、巨大ボス相手のお約束ですね。
  d_main_49_01_50:
    speaker: anis_i_w
    en: "... Please don't tell me we have to go crawling through a tunnel."
    ko: "…제발 터널 같은 곳만 기어가지 않으면 좋겠네."
    ja: |-
      …またトンネルを這って進むのは
      カンベンして欲しいわね。
  d_main_49_01_51:
    speaker: leviathan
    en: We should really keep our distance. We have no idea what's lurking under there.
    ko: |-
      관두는 게 좋아.
      저거 아래에 뭐가 있을지 어떻게 알아?
    ja: |-
      やめた方がいいと思う。
      あれの下にも何があるか
      分かったもんじゃないでしょ？
  d_main_49_01_52:
    speaker: leviathan
    en: If it's full of Dark Matter, we'd be dead before we even get a chance to do
      anything.
    ko: 다크 매터라도 차있으면 뭘 해보기도 전에 죽어.
    ja: |-
      ダークマターでいっぱいとかだったら、
      何もできずに死ぬけど。
  d_main_49_01_53:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_54:
    speaker: "<Self>"
    en: "... Let's keep following it for now. We'll attack as we go."
    ko: |-
      …일단, 계속 따라가자.
      따라가면서 공격해보자.
    ja: |-
      …とにかく、このまま追跡しつつ
      攻撃を試すしかないか
  d_main_49_01_55:
    speaker: "<Self>"
    en: Attack it from all angles. We might stumble across something that works.
    ko: |-
      다방면에서 공격해줘.
      혹여나 유효한 방법이 있을지도 모르니까.
    ja: |-
      使える手段は使ってみてくれ。
      何か有効なものがあるかもしれない
  d_main_49_01_56:
    speaker: "<Narration>"
    en: Everyone nods before turning to attack the statue.
    ko: 모두가 고개를 끄덕인 후 여신상을 향해 공격한다.
    ja: |-
      全員がうなずき、
      女神像に向けて攻撃を開始した
  d_main_49_01_57:
    speaker: "<Narration>"
    en: However, they all look doubtful.
    ko: 하지만 모두가 석연치않은 표정이다.
    ja: |-
      表情を見る限り、
      目の前の戦いに集中できていない
  d_main_49_01_58:
    speaker: "<Narration>"
    en: I probably look just as doubtful.
    ko: 아마… 나도 같은 표정을 짓고 있겠지.
    ja: おそらく…私も同じような顔をしているのだろう
  d_main_49_01_59:
    speaker: rapi_red
    en: We still can't get through to Eden or the Ark. Its jamming capabilities are
      strong enough to prevent short-range communications.
    ko: |-
      에덴과 방주와의 연락은 여전히 불가능합니다.
      근거리 통신도 불가능할 정도로 강력한 재밍입니다.
    ja: |-
      エデンやアークとの通信は依然として
      近距離での通信も不可能なほど
      強力なジャミングで妨害されています。
  d_main_49_01_60:
    speaker: anis_i_w
    en: Judging by the way it keeps heading toward the Ark, it means business.
    ko: 그리고 저거, 방주 방향으로 꾸역꾸역 가는 걸 보니 제대로 붙어볼 모양인데.
    ja: |-
      それに、あれだけひたすら
      アークに向かってるってことは、
      本気でやり合うつもりみたいだけど…
  d_main_49_01_61:
    speaker: neon_v_w
    en: It's pretty unusual for the final boss to barge into our base.
    ko: 최종 보스가 아군 본진으로 쳐들어가는 건 희귀 케이스네요.
    ja: |-
      ラスボスが味方の本拠地に
      乗り込んでくるなんて、珍しいパターンですね。
  d_main_49_01_62:
    speaker: "<Self>"
    en: "... For now, I think we should relay the intel we've gathered to the Ark."
    ko: "…일단 확인된 스펙만이라도 방주에 전달해야 할 것 같은데."
    ja: |-
      …ひとまず、判明している情報だけでも
      アークに持ち帰って伝えたいところだが…
  d_main_49_01_63:
    speaker: rapi_red
    en: It has plenty of mobility. Although...
    ko: 기동력은 충분합니다. 충분합니다만….
    ja: 速度に関しては十分に可能です。ただ…
  d_main_49_01_64:
    speaker: "<Narration>"
    en: Rapi looks up at the statue.
    ko: 라피가 고개를 들어 여신상의 모습을 바라본다.
    ja: ラピが女神像を見上げた
  d_main_49_01_65:
    speaker: "<Narration>"
    en: Its staggering height easily reaches three hundred meters.
    ko: "…족히 300미터는 되어 보이는 아득한 크기다."
    ja: |-
      …優に300メートルほどあるだろうか、
      途方もない大きさだ
  d_main_49_01_66:
    speaker: rapi_red
    en: "...The problem is, we'd have to turn our backs on it as we move."
    ko: "…저것에게서 등을 보인 채, 가야 한다는 문제가 있겠군요."
    ja: |-
      …問題は、そうしようとすれば
      あれに背中を向けた状態になることです。
  d_main_49_01_67:
    speaker: "<Self>"
    en: "... Let's just gather as much information as we can for now."
    ko: "…지금은 최대한 정보를 모으자."
    ja: "…今は情報収集につとめよう"
  d_main_49_01_68:
    speaker: "<Self>"
    en: We'll make our way to the Ark when the opportunity arises.
    ko: 기회가 될 때, 방주로 가는 거야.
    ja: 隙が生まれたら、アークへの帰還を狙う
  d_main_49_01_69:
    speaker: rapi_red
    en: "... Roger."
    ko: "…라져."
    ja: "…ラジャー。"
  d_main_49_01_70:
    speaker: enikk_op_l
    en: Report on the status of the Ark's power source.
    ko: 방주 동력원의 상태에 대해 보고해주십시오.
    ja: |-
      エネルギー源の状態について
      報告してください。
  d_main_49_01_71:
    speaker: trony
    en: Gah...!
    ko: 흐에엑…!
    ja: うひぁっ…！
  d_main_49_01_72:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_73:
    speaker: elegg
    en: Um, Ms. Enikk? I know you're all-seeing and all-knowing inside the Ark,
    ko: |-
      저기여. 에닉씨.
      방주 안에서 전지전능하다는 건 잘 알겠는뎨,
    ja: |-
      あの、エニック氏…
      アークの中を全て見ておられるというのは
      我々も存じておりますが…
  d_main_49_01_74:
    speaker: elegg
    en: but do you think you could stop popping up out of nowhere and casually striking
      up conversations?
    ko: 자꾸 그렇게 아무렇지도 않게 불쑥 나타나서 말 거는 건 그만둬주지 않으실래여?
    ja: |-
      毎回のように突然出てきて話を始めるのは、
      控えていただけませんかな？
  d_main_49_01_75:
    speaker: elegg
    en: It's already tense enough around here without you scaring us half to death.
    ko: 여기 가뜩이나 분위기도 안 좋은뎨, 그렇게 음산하게 나타나면 진짜 놀란다고여.
    ja: |-
      ただでさえ不気味な場所なのに、
      そんな登場のされ方をしたら
      悲鳴をあげてしまいますぞ。
  d_main_49_01_76:
    speaker: trony
    en: Y-yeah... You seriously scared me.
    ko: 마, 맞아…. 진짜, 진짜 놀랐어.
    ja: |-
      そ、そうだよ…
      ホ、ホントびっくりした…
  d_main_49_01_77:
    speaker: trony
    en: You've done that several times lately, and I still can't get used to it.
    ko: 최근들어 몇 번이나 이랬는데 전혀 적응이 안 되네.
    ja: |-
      最近何度かあったけど、
      いまだに全然慣れないよ。
  d_main_49_01_78:
    speaker: trony
    en: A-a little warning would be nice.
    ko: 예, 예고라도 해주면 좋겠어.
    ja: よ、予告くらいはしてほしいかな…
  d_main_49_01_79:
    speaker: enikk_op_l
    en: Understood. Next time, I will count down before initiating communication.
    ko: 알겠습니다. 다음부터는 통신 전에 카운트를 세겠습니다.
    ja: |-
      承知しました。
      次回からは通信の前に予告を行います。
  d_main_49_01_80:
    speaker: trony
    en: Uh... s-sure. I guess that's better than nothing.
    ko: 어… 그, 그렇게라도 해주면 고맙겠어.
    ja: あ…そ、そうしてもらえると助かります。
  d_main_49_01_81:
    speaker: enikk_op_l
    en: Report on the status of the Ark's power source.
    ko: 방주 동력원의 상태에 대해 보고해주십시오.
    ja: |-
      改めて、エネルギー源の
      状態について報告してください。
  d_main_49_01_82:
    speaker: elegg
    en: As expected, the output has been steadily dropping.
    ko: 예상대로 아주 안정적으로 출력이 떨어지고 있어여.
    ja: |-
      出力は予測通り、きわめて安定した状態で
      低下を続けておりますな。
  d_main_49_01_83:
    speaker: elegg
    en: Judging by its current rate, it'll fall below ten percent in the next forty-one
      days.
    ko: |-
      지금까지의 패턴으로 본다면….
      41일 이후 10%이하로 떨어지겠네여.
    ja: |-
      これまでの数値に従うなら…
      41日後に10％以下といったところですかな。
  d_main_49_01_84:
    speaker: enikk_op_l
    en: The minimum output required for the Ark's ascent is estimated at fifteen percent.
    ko: 방주 부상에 필요한 방주 동력원의 최소 출력은 15%로 산정하고 있습니다.
    ja: |-
      アーク浮上に必要な最小出力は
      15％と計算しています。
  d_main_49_01_85:
    speaker: enikk_op_l
    en: Also, we expect preparations for it to be complete within a week.
    ko: 또한 방주 부상 준비는 일주일 이내에 완료될 예정입니다.
    ja: 準備は1週間以内に完了する見込みです。
  d_main_49_01_86:
    speaker: enikk_op_l
    en: Can you maintain the current output until then?
    ko: 그때까지만 출력을 유지할 수 있겠습니까?
    ja: それまでの出力維持は可能ですか？
  d_main_49_01_87:
    speaker: trony
    en: Y-yeah... It'll be close, but we'll figure something out.
    ko: 으, 응. 그 정도면 조금 간당간당하긴 한데, 어떻게든 할 수 있을 거야.
    ja: |-
      は、はい。ちょっとギリギリになるけど…
      何とか。
  d_main_49_01_88:
    speaker: trony
    en: So the Ark really is going to ascend to the surface...
    ko: 그런데 방주, 진짜 올라가는구나.
    ja: それにしても、アークが本当に浮上するなんて…
  d_main_49_01_89:
    speaker: enikk_op_l
    en: Yes. The Ark's forces have been actively making preparation for this.
    ko: 예. 관련하여 방주의 세력들이 분주하게 행동하고 있습니다.
    ja: |-
      はい。それに伴い、アークの各勢力が
      あわただしく動いています。
  d_main_49_01_90:
    speaker: elegg
    en: "... That means we're actually going to get to see the sky."
    ko: "…진짜 하늘을, 볼 수 있다는 얘기군여."
    ja: "…本物の空が、見られるということですな。"
  d_main_49_01_91:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_92:
    speaker: elegg
    en: Cool! Then, in the name of Electric Shock, we'll do whatever it takes to keep
      the output up!
    ko: 좋아여! 그럼 일렉트릭 쇼크 스쿼드의 명예를 걸고! 어떻게든 출력을 붙잡아놓고 있을게여!
    ja: |-
      よぅし！エレクトリックショック部隊の
      名誉にかけて！何としてでも
      出力は維持してみせますぞ！
  d_main_49_01_93:
    speaker: enikk_op_l
    en: Thank you for your cooperation.
    ko: 협조에 감사드립니다.
    ja: 尽力に感謝します。
  d_main_49_01_94:
    speaker: enikk_op_l
    en: If you require any assistance, do not hesitate to ask. After all, this is
      the most critical element in the Ark's ascent—
    ko: |-
      필요한 지원이 있다면 가감 없이 말씀해주십시오.
      방주 부상에 가장 중요한 요소인만큼-
    ja: |-
      支援が必要な場合は遠慮なく
      申し出てください。この件は
      アーク浮上に関わる最重要の要素ですので――
  d_main_49_01_95:
    speaker: "<Narration>"
    en: "*Vrooom*"
    ko: 우우우우우웅-
    ja: ブウゥゥゥゥン…
  d_main_49_01_96:
    speaker: elegg
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_49_01_97:
    speaker: trony
    en: Uh... Is that sound coming from the power source?
    ko: 어… 이거 동력원에서 나는 소리지?
    ja: あれ…これって、エネルギー源の音？
  d_main_49_01_98:
    speaker: "<Narration>"
    en: "*Vrooom*"
    ko: 우우우우우웅-
    ja: ブウゥゥゥゥン…
  d_main_49_01_99:
    speaker: elegg
    en: What's... going on...?
    ko: "…뭘… 까여 이거."
    ja: "…何ですかな…これは。"
  d_main_49_01_100:
    speaker: trony
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_01_101:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_102:
    speaker: "<Narration>"
    en: Elegg starts fiddling with a machine connected to the Ark's power source.
    ko: 일레그가 방주 동력원과 이어진 기계를 조작한다.
    ja: エレグが動力源に繋がれたパネルを操作した
  d_main_49_01_103:
    speaker: elegg
    en: "... Ms. Enikk? Ms. Trony?"
    ko: "…에닉씨. 트로니씨."
    ja: "…エニック氏、トロニー氏…"
  d_main_49_01_104:
    speaker: elegg
    en: Its output just increased...?
    ko: 얘 출력이 올라갔는데여?
    ja: 出力が上昇しておりますな。
  d_main_49_01_105:
    speaker: trony
    en: "... What?"
    ko: "…뭐?"
    ja: "…え？"
  d_main_49_01_106:
    speaker: elegg
    en: Wait, it's getting higher...?
    ko: 어어? 점점 올라가는데여?
    ja: やや？どんどん上がっていますぞ…
  d_main_49_01_107:
    speaker: trony
    en: N-no kidding. It's really increasing.
    ko: 저, 정말이다. 점점 출력이 올라가고 있어.
    ja: ほ、本当だ。急に出力が上昇してる…
  d_main_49_01_108:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_109:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_110:
    speaker: elegg
    en: That's weird.
    ko: 이상한데여.
    ja: おかしいですな。
  d_main_49_01_111:
    speaker: trony
    en: Yeah, how strange.
    ko: 응. 이상해.
    ja: うん。おかしい。
  d_main_49_01_112:
    speaker: elegg
    en: This thing's always losing efficiency. There's no way it would suddenly recover
      on its own.
    ko: 효율이 영구히 떨어진 동력원이 자연적으로 회복한다는 건 말이 안 돼여.
    ja: |-
      この状態になってしまったコレが、
      自然に回復するなどということは…
  d_main_49_01_113:
    speaker: enikk_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_114:
    speaker: elegg
    en: "... Ms. Enikk. Something's going on, isn't it?"
    ko: "…에닉씨. 뭔가 있군여."
    ja: "…エニック氏。何か起こっておりますな。"
  d_main_49_01_115:
    speaker: elegg
    en: You have total control over everything in the Ark, so something must have
      happened on the surface.
    ko: |-
      방주에서의 일은 에닉씨가 꽉 잡고 있을 테니,
      지상에서 말이져.
    ja: |-
      アークの中のことはエニック氏が
      管理しておられるでしょうから、
      おそらく、地上で。
  d_main_49_01_116:
    speaker: enikk_op_l
    en: A massive unidentified being emerged near the Lift and is now approaching
      the Ark.
    ko: 현재, 지상의 궤도 엘리베이터 인근에서 정체불명의 거대 물체가 생성, 이후 방주 방향으로 접근하고 있습니다.
    ja: |-
      現在、地上の軌道エレベーター付近で
      正体不明の巨大な物体が出現し、
      アークに向かって移動を続けています。
  d_main_49_01_117:
    speaker: enikk_op_l
    en: Judging by its current speed, it's expected to reach the Ark within three
      days.
    ko: 현재 속도라면, 3일 이내에 방주에 당도합니다.
    ja: |-
      現在の速度が維持されれば、
      3日以内に到達する計算です。
  d_main_49_01_118:
    speaker: elegg
    en: Wh-what being is it?
    ko: 뭐, 뭔데여 그게.
    ja: 巨大な物体と言うのは、なんですかな。
  d_main_49_01_119:
    speaker: enikk_op_l
    en: I'm still working on identifying it. There's a strong jamming signal that's
      preventing a detailed identification.
    ko: 확인중입니다. 재밍이 강해 자세한 식별은 불가능합니다.
    ja: |-
      未確認です。強力な通信妨害により、
      詳細な分析が実行できていません。
  d_main_49_01_120:
    speaker: trony
    en: "... Just how big are we talking?"
    ko: "…거대 물체라면 얼마나 커?"
    ja: "…巨大な物体って、どれくらい？"
  d_main_49_01_121:
    speaker: enikk_op_l
    en: It's estimated to be around three hundred meters tall.
    ko: 전고 300여 미터로 추정하고 있습니다.
    ja: 全高およそ、300メートルと推定されます。
  d_main_49_01_122:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_123:
    speaker: "<Narration>"
    en: Trony quickly works the controls of the machine connected to the Ark's power
      source.
    ko: 트로니가 방주 동력원과 이어진 기계를 빠르게 조작한다.
    ja: トロニーがパネルを操作した
  d_main_49_01_124:
    speaker: "<Narration>"
    en: "*Vrooom*"
    ko: 우우우우우웅-
    ja: ブゥゥン…
  d_main_49_01_125:
    speaker: "<Narration>"
    en: Meanwhile, the power source emits an even louder roar.
    ko: 그 사이, 방주 동력원은 더욱 큰 소리를 뿜어낸다.
    ja: |-
      その間にも、巨大コアの音は
      さらに大きくなっていた
  d_main_49_01_126:
    speaker: trony
    en: "... It's vibrating."
    ko: "…진동하고 있어."
    ja: "…振動してる。"
  d_main_49_01_127:
    speaker: trony
    en: It's vibrating ever so slightly, stirring up the particles inside and increasing
      the output.
    ko: 아주 미세하게 진동해서, 내부 입자를 흔들어 출력을 만들어내고 있는 상태야.
    ja: |-
      細かい振動が内部の粒子を刺激して、
      出力を上げてるみたい。
  d_main_49_01_128:
    speaker: elegg
    en: Vibrating? I don't think it has a function like that...
    ko: 진동이라녀. 그런 기능은 딱히 없었던 것 같….
    ja: 振動？そんな機能はなかったはず…
  d_main_49_01_129:
    speaker: trony
    en: It seems to be resonating with the waves coming from outside.
    ko: 외부에서의 파동에 공명하는 것 같아.
    ja: 外からの干渉に共鳴してるみたい。
  d_main_49_01_130:
    speaker: trony
    en: The stronger the vibrations, the greater the output.
    ko: |-
      진동은 더 강해지고 있고,
      비례해서 출력이 올라가.
    ja: |-
      振動がどんどん強くなってて、
      それに比例して出力も上がってる。
  d_main_49_01_131:
    speaker: elegg
    en: The fact that a massive being over three hundred meters tall can move means
      it must have a comparable power source.
    ko: "…전고 300여 미터의 거대 물체가 움직이고 있다는 건, 그에 준하는 동력원이 있다는 얘기겠네여."
    ja: |-
      …全高300メートルもの
      巨大な物体が動いているとなれば、
      相応のエネルギー源が必要になりますな。
  d_main_49_01_132:
    speaker: elegg
    en: A typical Rapture core wouldn't be nearly enough.
    ko: 어지간한 랩쳐의 코어로는 택도 없겠어여.
    ja: |-
      並のラプチャーコアでは、
      到底まかなえないほどの…
  d_main_49_01_133:
    speaker: trony
    en: Yeah. I can't be certain, but the power source must be equivalent to a gigantic
      core like the Ark's.
    ko: 응. 확실하진 않겠지만 초거대 코어에 준하는 뭔가가 동력원일거야.
    ja: |-
      うん。確証はないけど、
      この超巨大コアに並ぶぐらいの
      動力源があるはず。
  d_main_49_01_134:
    speaker: trony
    en: "... Or maybe it is one."
    ko: "…어쩌면, 똑같거나."
    ja: "…もしかしたら、同じものかも。"
  d_main_49_01_135:
    speaker: elegg
    en: Ms. Enikk, you said that giant thing is getting closer to the Ark, right?
    ko: 에닉씨. 그 거대 물체는 점점 더 방주 쪽에 가까워지고 있는거져?
    ja: |-
      エニック氏。その巨大な物体は、
      アークに接近中だと言っておりましたな？
  d_main_49_01_136:
    speaker: enikk_op_l
    en: That's correct.
    ko: 그렇습니다.
    ja: その通りです。
  d_main_49_01_137:
    speaker: elegg
    en: For whatever reason, that thing's power source is emitting its own unique
      waveform.
    ko: 무슨 이유에선지, 그 거대 물체의 동력원이 고유 파동을 뿜어내고 있고.
    ja: |-
      何らかの方法で、その巨大な物体が
      こちらの超巨大コアに作用していて…
  d_main_49_01_138:
    speaker: elegg
    en: The Ark's power source is vibrating in response to that waveform, increasing
      its output.
    ko: 그 파동에 영향을 받은 방주 동력원이 진동하며 출력을 올리고 있댜.
    ja: その影響を受けて出力が上昇している。
  d_main_49_01_139:
    speaker: elegg
    en: The closer that thing gets, the stronger the vibrations and the higher the
      output. I think that's a safe assumption to make for now.
    ko: 거대 물체와 방주 동력원의 거리가 가까워질수록 더욱 진동과 출력이 강해진댜. 현시점에서는 이렇게 보는 게 맞겠네여.
    ja: |-
      であれば、両者の距離が近づくほど、
      さらに振動は強くなり、出力も上がる。
      今のところ、そう推測するのが自然でしょうな。
  d_main_49_01_140:
    speaker: enikk_op_l
    en: That is a valid deduction.
    ko: 타당한 추론입니다.
    ja: 十分に合理的な予想です。
  d_main_49_01_141:
    speaker: elegg
    en: Great. I have no idea what's going on, but this is good news. The Ark's dying
      power source is being revitalized.
    ko: |-
      좋아여. 뭐가 뭔진 모르겠지만 다행이네여.
      죽어가던 방주 동력원이 기운을 차리고 있으니까여.
    ja: |-
      何が起きているのかは分かりませぬが、
      幸いですな。瀕死の超巨大コアが
      息を吹き返したのですから…
  d_main_49_01_142:
    speaker: elegg
    en: At this rate, we'll have more than enough power for the Ark's ascent!
    ko: 이러면, 방주 부상에 쓰일 동력은 아무 문제 없겠어여!
    ja: |-
      これなら、アークを浮上させるための
      エネルギーは問題なく確保できそうですぞ！
  d_main_49_01_143:
    speaker: elegg
    en: "... Not that anyone here is silly enough to think that!"
    ko: 라고 생각할 분은 여기에 안 계시져?
    ja: "…などと言える状況では、ありませんな？"
  d_main_49_01_144:
    speaker: trony
    en: "... Yeah. This is dangerous."
    ko: "…응. 위험해."
    ja: "…うん。危険な状態だと思う。"
  d_main_49_01_145:
    speaker: trony
    en: The vibrations are agitating the internal particles and increasing the output.
    ko: 진동으로 내부 입자를 흔들어 출력을 올리는 건
    ja: 内部粒子を揺らして、出力を上げる…
  d_main_49_01_146:
    speaker: trony
    en: That's a classic self-destruct sequence.
    ko: 전형적인 자폭 시퀀스야.
    ja: まるで自爆させようとしてるみたい。
  d_main_49_01_147:
    speaker: elegg
    en: Exactly.
    ko: 그렇져.
    ja: 同意ですな。
  d_main_49_01_148:
    speaker: elegg
    en: Once that gigantic thing gets within a certain distance of the Ark...
    ko: 아마 그 거대 물체가 방주와 일정 거리만큼 가까워지면.
    ja: |-
      おそらく、その巨大な物体に
      一定の距離まで接近されると…
  d_main_49_01_149:
    speaker: elegg
    en: The Ark will go boom!
    ko: 방주는 펑~ 이라는 거겠네여.
    ja: |-
      それだけでアークがドカ～ン！
      ということでしょうかな。
  d_main_49_01_150:
    speaker: trony
    en: Y-yeah.
    ko: 으, 응.
    ja: う、うん…
  d_main_49_01_151:
    speaker: enikk_op_l
    en: I have reached the same conclusion.
    ko: 저도 그렇게 판단합니다.
    ja: 私も同様の結果を予測しています。
  d_main_49_01_152:
    speaker: elegg
    en: I have no idea why it even has such a function, but this is super mega bad
      news.
    ko: |-
      대체 왜 이런 기능이 있는지는 모르겠지만,
      아주아주아주 큰일이네여.
    ja: |-
      なぜそんなことが起こっているのかは
      見当もつきませぬが…極めてマズい状態ですぞ。
  d_main_49_01_153:
    speaker: elegg
    en: Hehe. I knew it was a bad idea the moment we started relying on some mysterious
      power source.
    ko: 히히. 하여간 이런 정체불명의 동력원 같은 거에 의존할 때부터 알아봤어여.
    ja: |-
      へ…まぁ、こんな得体の知れないモノに
      アークが依存していると知った時から、
      想像は出来ることでしたがな。
  d_main_49_01_154:
    speaker: enikk_op_l
    en: Assuming it continues moving at its current speed, can you determine when
      the output of the Ark's power source will reach 100%?
    ko: 현재 속도가 유지된다고 가정할 시, 방주 동력원의 출력이 100% 이상에 도달하는 시점은 언제인지 확인할 수 있습니까?
    ja: |-
      現在の速度が維持されると仮定して、
      出力が本来の100％以上に到達する
      時間の予想は？
  d_main_49_01_155:
    speaker: trony
    en: "... In two days."
    ko: "…이틀."
    ja: "…2日。"
  d_main_49_01_156:
    speaker: elegg
    en: If that giant being or whatever it is suddenly speeds up, it could be even
      sooner.
    ko: 갑자기 그 거대 물체인가 뭔가 하는 게 속도를 높이면 더 빨라질 수도 있겠져.
    ja: |-
      むろん、その巨大な物体とやらが
      急に速度を上げでもすれば、
      もっと早まるかもしれませんな。
  d_main_49_01_157:
    speaker: enikk_op_l
    en: Understood. Thank you for your cooperation.
    ko: 알겠습니다. 협조에 감사드립니다.
    ja: 確認しました。引き続き協力に感謝します。
  d_main_49_01_158:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_49_01_159:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_160:
    speaker: trony
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_161:
    speaker: elegg
    en: Well then.
    ko: 쟈, 그럼.
    ja: さて、それでは…
  d_main_49_01_162:
    speaker: elegg
    en: Let's drain this suddenly revitalized thing of its energy and keep its output
      from going up, shall we?
    ko: 저희는 갑자기 이상하게 건강해진 이 녀석의 힘을 마구마구 빼서 최대한 출력 상승을 억눌러볼까여?
    ja: |-
      私たちは急に元気になりすぎた
      こやつの力を抜いて、
      できる限り出力上昇を抑えるとしますかな？
  d_main_49_01_163:
    speaker: trony
    en: Y-yeah. That's all we can do for now anyway.
    ko: 으, 응. 지금 할 수 있는 건 그것밖에 없으니까.
    ja: |-
      うん、そうだね。
      今できることはそれしかないし。
  d_main_49_01_164:
    speaker: trony
    en: We have to slow it down as much as possible.
    ko: 조금이라도 속도를 늦춰야 해.
    ja: 少しでも時間を稼がないと。
  d_main_49_01_165:
    speaker: elegg
    en: Okay. Let's do this.
    ko: 좋아여. 해보자고여.
    ja: よし…始めますぞ。
  d_main_49_01_166:
    speaker: elegg
    en: Oh, before we start, do you wanna go update your will first?
    ko: 아, 일 하기 전에 유언장 갱신하고 오실래여?
    ja: あ、その前に遺言状の更新が必要でしたかな？
  d_main_49_01_167:
    speaker: trony
    en: No, that's okay.
    ko: 아니. 괜찮아.
    ja: ううん、大丈夫。
  d_main_49_01_168:
    speaker: trony
    en: I'll make sure we pull this off.
    ko: 반드시 성공시킬 테니까.
    ja: 必ず成功させるから。
  d_main_49_01_169:
    speaker: elegg
    en: Hehe, great!
    ko: 히히. 좋네여!
    ja: ふひひっ、その意気ですぞ！
  d_main_49_01_170:
    speaker: "<Narration>"
    en: Inside the Central Government's main conference room...
    ko: 중앙 정부 중앙 회의실.
    ja: 中央政府・中央会議室
  d_main_49_01_171:
    speaker: burningum
    en: Everyone, status report.
    ko: 다들, 상황을 보고해줘.
    ja: 各自、状況報告を。
  d_main_49_01_172:
    speaker: syuen
    en: There are no issues with the Ark's ascent systems. If we can just get enough
      power, we can proceed at any time.
    ko: 방주 부상 기능은 문제없어. 출력만 빵빵하다면 언제든 가능해.
    ja: |-
      アークの浮上機能には問題なし。
      いつでも上がれるわ、出力さえ十分ならね。
  d_main_49_01_173:
    speaker: mustang
    en: C'est difficile to find any reason not to proceed with la Third Surface Reclamation
      War.
    ko: 3rd 지상 탈환전에 대한 Negative는 이제 찾기 Hard해 졌습니Da.
    ja: |-
      今回の地上奪還戦に対する
      Negativeな意見は、
      もう探す方がHardなほどDESU。
  d_main_49_01_174:
    speaker: mustang
    en: It looks like our concerts et promotions have been effective.
    ko: 꾸준한 Concert와 홍보가 효과가 있었던 모양이군Yo.
    ja: |-
      地道なConcertとPR活動を
      続けたかいがありましたNE。
  d_main_49_01_175:
    speaker: mustang
    en: How's la situation in the Outer Rim?
    ko: Outer Rim의 상태는 어떻Jyo?
    ja: |-
      Outer Rimの問題は
      片付いていますKA？
  d_main_49_01_176:
    speaker: ingrid
    en: E.H. said things are in the final stages. It should be complete soon.
    ko: |-
      E.H.가 이제 마무리 단계에 있다고 했다.
      곧 끝나겠지.
    ja: |-
      E.H.が最終調整に入ったと言っている。
      すぐに終わるだろう。
  d_main_49_01_177:
    speaker: ingrid
    en: How are things going on the Ark's end?
    ko: 방주 측은 어떻지?
    ja: アーク側は？
  d_main_49_01_178:
    speaker: burningum
    en: We've finished evacuating most of the citizens to the shelters.
    ko: 대부분의 시민들은 쉘터로 이동을 완료했어.
    ja: |-
      大部分の市民は
      シェルターへの移動を完了させた。
  d_main_49_01_179:
    speaker: burningum
    en: But there are some who are refusing to cooperate.
    ko: 다만, 일부 협조하지 않는 이들이 있는 상태야.
    ja: ただ、一部に協力的でない者がいる。
  d_main_49_01_180:
    speaker: ingrid
    en: Why's that?
    ko: 이유는?
    ja: 理由は？
  d_main_49_01_181:
    speaker: burningum
    en: I'm not sure. I suppose they each have their own reasons.
    ko: 글쎄. 각자의 이유가 있겠지.
    ja: さあな。それぞれに理由があるのだろう。
  d_main_49_01_182:
    speaker: burningum
    en: Still, we're planning to move them to the shelters by force. The process should
      be over soon.
    ko: |-
      하지만 조만간 강제로 쉘터로 이동시킬 계획이야.
      곧 끝나.
    ja: |-
      だが、近く強制的な措置を執行する計画だ。
      時間はかからない。
  d_main_49_01_183:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_184:
    speaker: syuen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_185:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_186:
    speaker: burningum
    en: "... Are there any issues or concerns?"
    ko: "…문제가 있나? 의문 사항이라든가."
    ja: "…どうした？不服でもあるのか。"
  d_main_49_01_187:
    speaker: ingrid
    en: No. It just seems like you've changed overnight. My apologies.
    ko: 아니. 사람이 하루아침에 바뀐 느낌이라 잠시 봤다. 미안하군.
    ja: |-
      いや…どうしても別人のような気がしてな。
      すまない。
  d_main_49_01_188:
    speaker: burningum
    en: "... I don't have time to spare putting on an act right now."
    ko: "…연기에 할애할 시간도 지금은 아까워."
    ja: "…今は見せかけを装う時間すら惜しい。"
  d_main_49_01_189:
    speaker: burningum
    en: Then the only remaining issues are the overly expanded additional facilities,
      as well as the elevators and the Dome of Eternity.
    ko: 그렇다면, 남은 문제는 과하게 확장된 부가 시설들과 엘리베이터, 이터널 스카이겠군.
    ja: |-
      ともあれ、残る問題は
      過剰な拡張が進んだ外周部とエレベーター、
      そしてエターナルスカイか。
  d_main_49_01_190:
    speaker: enikk_op_l
    en: Demolition is going smoothly with the help of the Mighty Tools and Cafe Sweety,
      but time is of the essence.
    ko: 마이티 툴즈 및 카페 스위티의 협조로 순조롭게 철거가 진행되고 있으나, 한시가 급한 상황입니다.
    ja: |-
      マイティツールズと
      カフェ・スウィーティーの協力により、
      撤去は進んでいますが、一刻を争います。
  d_main_49_01_191:
    speaker: enikk_op_l
    en: If we abandon our approach of preserving the Ark's integrity and pivot to
      prioritizing speed by sending in Endless and Eternity...
    ko: |-
      방주의 상태를 최대한 보존하는 방향은 철회,
      엔드리스와 이터니티를 투입해 속도를 중시하는 방향으로 선회한다면-
    ja: |-
      アークの状態を最大限保全する方針を撤回、
      速度最優先に切り替えて
      エンドレス、エタニティを投入し――
  d_main_49_01_192:
    speaker: enikk_op_l
    en: the job can be completed today.
    ko: 금일 안에 완료 가능합니다.
    ja: 本日中に完了させます。
  d_main_49_01_193:
    speaker: syuen
    en: In just a day? You've turned them into quite the monsters, huh?
    ko: 하루만에? 아주 괴물을 만들어놨네. 응?
    ja: |-
      1日で全部？
      とんでもない化け物を作ってたみたいね。
      まったく…
  d_main_49_01_194:
    speaker: enikk_op_l
    en: To be clear, this only applies to the sections of the Ark that will ascend.
    ko: 어디까지나 방주의 부상 예정 지역에 한해서입니다.
    ja: アークの浮上区域に限定しての条件です。
  d_main_49_01_195:
    speaker: enikk_op_l
    en: We plan to abandon all other areas.
    ko: 그 외의 부분은 모두 [버리고] 갑니다.
    ja: |-
      それ以外の部分は、
      すべて「切り捨てる」ことになります。
  d_main_49_01_196:
    speaker: burningum
    en: "... You're in a hurry."
    ko: "…서두르는군."
    ja: "…それほど急ぐという意味だな。"
  d_main_49_01_197:
    speaker: enikk_op_l
    en: Yes. There's currently a significant problem with the Ark's power source.
    ko: 예. 현재 방주 동력원에 심각한 문제가 발생했습니다.
    ja: |-
      はい。現在、アークのエネルギー源に
      深刻な問題が発生しています。
  d_main_49_01_198:
    speaker: enikk_op_l
    en: We don't have much time.
    ko: 시간이 없습니다.
    ja: 時間がありません。
  d_main_49_01_199:
    speaker: burningum
    en: Then, what's the scheduled date for the Ark's ascent?
    ko: "…그럼, 방주 부상 예정 일자는?"
    ja: "…それで、アーク浮上の予定日は？"
  d_main_49_01_200:
    speaker: enikk_op_l
    en: Tomorrow morning.
    ko: 내일 아침입니다.
    ja: 明朝となりました。
  d_main_49_01_201:
    speaker: mustang
    en: Quoi?!
    ko: What!?
    ja: What!?
  d_main_49_01_202:
    speaker: burningum
    en: What did you say...?
    ko: 뭐라… 고.
    ja: 何だと…
  d_main_49_01_203:
    speaker: ingrid
    en: What...?!
    ko: 무슨…!
    ja: 馬鹿な…！
  d_main_49_01_204:
    speaker: syuen
    en: Do you think the Ark's ascent is as simple as hopping on an elevator and riding
      it up to the surface?
    ko: 야. 무슨 방주 부상이 엘리베이터 타고 지상에 올라가는 수준인 줄 알아?
    ja: |-
      ちょっと…普通の
      エレベーターの話じゃないのよ？
  d_main_49_01_205:
    speaker: enikk_op_l
    en: This is a matter serious enough to warrant taking every possible risk.
    ko: 모든 리스크를 감수해야 할 만큼 중대한 사항입니다.
    ja: |-
      あらゆるリスクを計算に入れても、
      遂行するべき重大な事案です。
  d_main_49_01_206:
    speaker: enikk_op_l
    en: We cannot delay our ascent.
    ko: 방주의 부상은 늦출 수 없습니다.
    ja: それ以上の遅延は許容できません。
  d_main_49_01_207:
    speaker: enikk_op_l
    en: Please disseminate the file I've transmitted to the relevant Nikkes and departments,
      then expedite your operations.
    ko: 전송한 파일을 관련 니케 및 관련 부서에 전파 후, 더욱 속도를 내 주십시오.
    ja: |-
      転送した情報を関係者および部署に共有し、
      さらに作業を急いでください。
  d_main_49_01_208:
    speaker: enikk_op_l
    en: Any issues that cannot be resolved by tomorrow morning...
    ko: 내일 아침까지 해결되지 않은 문제는-
    ja: 明朝までに解決されなかった問題は――
  d_main_49_01_209:
    speaker: enikk_op_l
    en: We'll leave them unresolved and proceed with the Ark's ascent.
    ko: 해결하지 않고 올립니다.
    ja: すべての作業を打ち切り、浮上を実行します。
  d_main_49_01_210:
    speaker: enikk_op_l
    en: This is what must be done.
    ko: 그래야 합니다.
    ja: これ以外の方法は存在しません。
  d_main_49_01_211:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_212:
    speaker: burningum
    en: Good. Let's speed things up, then.
    ko: 좋아. 서두르지.
    ja: やむを得ん、急ごう。
  d_main_49_01_213:
    speaker: burningum
    en: I don't want to waste any more time on this meeting either. Let's adjourn,
      and everyone, please pick up the pace.
    ko: 회의 시간도 아까워. 해산하고, 다들 최대한 속도를 내줘.
    ja: |-
      こうしている時間も惜しい。解散だ。
      各方面、全力で作業を速めてくれ。
  d_main_49_01_214:
    speaker: mustang
    en: Bon... D'accord!
    ko: Hm… OK!
    ja: Hm…OK！
  d_main_49_01_215:
    speaker: ingrid
    en: "... All right. I'll be on my way."
    ko: "…좋다. 이만 가보겠다."
    ja: "…分かった、失礼する。"
  d_main_49_01_216:
    speaker: syuen
    en: Seriously, I can't believe this. This isn't some stroll in the park, you know!
    ko: 기가 막혀서 정말. 산책 가는 게 아니라고.
    ja: |-
      ホントあきれちゃうわ。
      散歩に行くんじゃないってのに…
  d_main_49_01_217:
    speaker: "<Narration>"
    en: Everyone leaves the conference room.
    ko: 모두가 회의실을 나선다.
    ja: それぞれが会議室を後にした
  d_main_49_01_218:
    speaker: burningum
    en: "... Enikk."
    ko: "…에닉."
    ja: "…エニック。"
  d_main_49_01_219:
    speaker: enikk_op_l
    en: Yes?
    ko: 예.
    ja: はい。
  d_main_49_01_220:
    speaker: burningum
    en: What are our odds of failure?
    ko: 실패 가능성은?
    ja: 失敗の可能性は？
  d_main_49_01_221:
    speaker: enikk_op_l
    en: I can't provide you with an exact number, but the likelihood is high.
    ko: 자세한 수치는 알려드릴 수 없으나, 높습니다.
    ja: |-
      具体的な数値での回答は控えますが、
      高くなるでしょう。
  d_main_49_01_222:
    speaker: burningum
    en: If we fail, is there a future for us?
    ko: 실패할 경우, 우리에게 다음이 있나?
    ja: そうなった場合、善後の策はあるか？
  d_main_49_01_223:
    speaker: enikk_op_l
    en: No.
    ko: 없습니다.
    ja: 存在しません。
  d_main_49_01_224:
    speaker: burningum
    en: "... I see."
    ko: "…그래."
    ja: "…そうか。"
  d_main_49_01_225:
    speaker: "<Narration>"
    en: Burningum silently stares into space.
    ko: 버닝엄은 말없이 허공을 바라본다.
    ja: バーニンガムは静かに虚空を見上げた
  d_main_49_01_226:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_01_227:
    speaker: burningum
    en: Whichever way this goes...
    ko: 어떤 방향이 되었든.
    ja: どう転ぼうと…
  d_main_49_01_228:
    speaker: burningum
    en: I guess this is the end.
    ko: 마지막이 되겠군.
    ja: 最後になるということか。
d_main_49_02:
  d_main_49_02_1:
    speaker: eh_n
    en: Please just cooperate. I'm begging you.
    ko: "…협조해 줘. 부탁이야."
    ja: "…協力して。お願い。"
  d_main_49_02_2:
    speaker: outerrimman
    en: No. I refuse.
    ko: 싫다. 거절한다.
    ja: もう言ったろ。お断りだ。
  d_main_49_02_3:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_4:
    speaker: eh_n
    en: All of you here feel the same way?
    ko: 여기에 있는 모두, 같은 생각이야?
    ja: ここにいる全員、同じ考え？
  d_main_49_02_5:
    speaker: "<Narration>"
    en: E.H. looks out over the dozens of people gathered in the square.
    ko: E.H.가 광장에 모여있는 수십명의 사람을 바라본다.
    ja: |-
      E.H.は広場に集まっている
      数十名の群衆に視線を向けた
  d_main_49_02_6:
    speaker: "<Narration>"
    en: They all look back at her with determination in their eyes.
    ko: 그들은 모두 결연한 표정으로 E.H.를 바라보고 있다.
    ja: 誰もが決然とした表情をE.H.に向けている
  d_main_49_02_7:
    speaker: eh_n
    en: "... I'll take that as a yes."
    ko: "…같은 생각인가보네."
    ja: "…そう。"
  d_main_49_02_8:
    speaker: viper
    en: I don't get it. Why are you all acting like that?
    ko: 이해가 안 가네. 왜들 이러는 거야?
    ja: |-
      理解できないな～
      どうして？
  d_main_49_02_9:
    speaker: outerrimman
    en: We were born in the Outer Rim.
    ko: 우리는 아우터 림에서 태어났다.
    ja: 俺たちゃアウターリムで生まれたからさ。
  d_main_49_02_10:
    speaker: outerrimman
    en: We've lived here our whole lives.
    ko: 인생의 전부를 이곳에서 보냈지.
    ja: 人生全部、ここで過ごしてきた。
  d_main_49_02_11:
    speaker: outerrimman
    en: The Ark is no more than a fantasy to us. We only know it by name, but that's
      it.
    ko: |-
      방주는 그냥 우리한테는 환상이나 다름없는 곳이다.
      그냥 단어만 알고 있는 수준이지.
    ja: |-
      アークなんて、俺たちにとっちゃ
      マボロシみてぇなもんだ。
      そういう名前の場所があるってぐらいのな。
  d_main_49_02_12:
    speaker: outerrimman
    en: In other words, this is all there is to our world.
    ko: 그러니까 우리의 세계는 그냥 여기가 끝인거다.
    ja: 要は、ここが俺たちの世界の全部ってこった。
  d_main_49_02_13:
    speaker: outerrimman
    en: The Outer Rim is our world.
    ko: 아우터 림이 우리의 세계다.
    ja: アウターリムは、俺たちの世界なんだ。
  d_main_49_02_14:
    speaker: outerrimman
    en: We don't want to leave our world.
    ko: 우리는 이 세계에서 나가고 싶지 않아.
    ja: 離れたいとは思えねぇ。
  d_main_49_02_15:
    speaker: outerrimman
    en: There's a saying...
    ko: 그런 말이 있지 않나.
    ja: よく言うだろ。
  d_main_49_02_16:
    speaker: outerrimman
    en: Those who spend a long time in prison eventually come to see it as their home.
      They don't want to leave.
    ko: |-
      감옥에서 너무 오래 지낸 이들이,
      이젠 감옥이 내 집 같다고. 밖으로 나가고 싶지 않다고.
    ja: |-
      ムショで長く過ごしすぎたヤツは、
      そのうち檻の中を
      我が家だと思いはじめちまうってさ。
  d_main_49_02_17:
    speaker: outerrimman
    en: We feel the same way.
    ko: 우리도 같다.
    ja: 俺たちも似たようなもんだ。
  d_main_49_02_18:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_19:
    speaker: viper
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_20:
    speaker: outerrimman
    en: We will accept our fate here.
    ko: 그러니 우리는 이곳에서 운명을 받아들일거다.
    ja: だから、俺たちはここで運命を受け入れる。
  d_main_49_02_21:
    speaker: outerrimman
    en: We appreciate what you're trying to do. We're truly grateful that you're trying
      to save our miserable little lives.
    ko: |-
      너희들의 마음은 고맙다.
      이런 쓰레기같은 삶이라도 구해주려 하는 그 마음은 정말 고마워.
    ja: |-
      お前らの気持ちはありがたい。
      ゴミみてぇな命でも救おうとしてくれた、
      そのことには本当に感謝してる。
  d_main_49_02_22:
    speaker: outerrimman
    en: But we've made up our minds.
    ko: 하지만 우리는 결정했다.
    ja: だが、俺たちは決めたんだ。
  d_main_49_02_23:
    speaker: outerrimman
    en: We've decided to lay ourselves to rest in the Outer Rim, our world.
    ko: 이 곳, 우리의 세계인 아우터 림에서 잠들기로.
    ja: |-
      この場所、俺たちの世界、
      アウターリムと最後まで一緒にいる。
  d_main_49_02_24:
    speaker: "<Narration>"
    en: E.H. looks again at the faces of those gathered in the square.
    ko: E.H.가 다시 광장에 모인 이들의 얼굴을 바라본다.
    ja: |-
      E.H.はもう一度、
      広場にいる者たちの顔を見た
  d_main_49_02_25:
    speaker: "<Narration>"
    en: She makes eye contact with each and every one of them.
    ko: 한 명 한 명과 눈을 맞춘다.
    ja: 一人ひとりの目をのぞきこむ
  d_main_49_02_26:
    speaker: "<Narration>"
    en: Their eyes filled with unwavering determination.
    ko: 절대 꺾이지 않을 단호한 눈빛들을 본다.
    ja: |-
      決して折れる気配のない
      強い意志の宿るまなざしをしていた
  d_main_49_02_27:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_28:
    speaker: eh_n
    en: "... All right. I understand how you feel."
    ko: "…그래. 너희들의 마음은 잘 알았어."
    ja: "…そう。お前たちの気持ちはよく分かった。"
  d_main_49_02_29:
    speaker: eh_n
    en: So be it.
    ko: 그렇다면 어쩔 수 없지.
    ja: なら、仕方ない。
  d_main_49_02_30:
    speaker: outerrimman
    en: Thank you. Instead of worrying about people like us—
    ko: |-
      그래. 고맙다.
      그러니 우리 같은 사람들에게 신경 쓰지 말고-
    ja: |-
      そうか、ありがとよ。
      じゃあ、俺たちみたいなヤツらのことは
      気にせず――
  d_main_49_02_31:
    speaker: eh_n
    en: Jackal.
    ko: 자칼.
    ja: ジャッカル。
  d_main_49_02_32:
    speaker: jackal
    en: Yep!
    ko: 응!
    ja: うん！
  d_main_49_02_33:
    speaker: "<Narration>"
    en: Jackal kicks off the ground, leaping into the air.
    ko: 자칼이 땅을 박차고 뛰어오른다.
    ja: ジャッカルが地面を蹴り、跳んだ
  d_main_49_02_34:
    speaker: "<Narration>"
    en: "*Wham! Pow! Thwack! Crash! Bang!*"
    ko: 쿵! 퍽! 빡! 우당탕! 쿠당탕!
    ja: ドカッ！バキッ！ドスッ！バタッ！ドサッ！
  d_main_49_02_35:
    speaker: "<Narration>"
    en: In the blink of an eye, Jackal knocks everyone in the square unconscious.
    ko: 자칼이 삽시간에 광장에 모인 이들을 모두 기절시킨다.
    ja: |-
      ジャッカルは誰かが反応する間も与えず
      集まっていた者たちをすべて気絶させた
  d_main_49_02_36:
    speaker: "<Narration>"
    en: Silence falls over the square.
    ko: 웅성거리던 광장이 조용해진다.
    ja: 広場に静けさが戻った
  d_main_49_02_37:
    speaker: jackal
    en: So we just gotta move them?
    ko: 이제 옮기면 돼?
    ja: もう運んでいい？
  d_main_49_02_38:
    speaker: eh_n
    en: No, leave them. I'll contact Underworld Queen and have them send their people.
    ko: |-
      아니. 둬. 언더월드 퀸한테 연락할게.
      부하들을 보내줄거야.
    ja: |-
      いや、必要ない。寝かせたままでいい。。
      アンダーワールドクイーンに連絡する。
      手下がここに来る約束だから。
  d_main_49_02_39:
    speaker: viper
    en: I don't even know how many times we've had to do this already.
    ko: 벌써 이제 몇번째인지 모르겠네.
    ja: もうこれで何回目だったっけ。
  d_main_49_02_40:
    speaker: viper
    en: Do these people like the Outer Rim thaaat much?
    ko: 그렇게나 좋을까~ 아우터 림이.
    ja: そこまでする場所かなぁ～、アウターリムって。
  d_main_49_02_41:
    speaker: eh_n
    en: It's not that I don't understand.
    ko: "…이해가 안 되는 건 아냐."
    ja: "…分からないでもない。"
  d_main_49_02_42:
    speaker: eh_n
    en: Infinite possibilities can instill infinite fear in some people.
    ko: 무한한 가능성은, 누군가에겐 무한한 공포일 수 있으니까.
    ja: |-
      無限の可能性というものは、
      人によっては無限の恐怖にもなる。
  d_main_49_02_43:
    speaker: viper
    en: So we're just throwing them into a world of never-ending fear? Without their
      permission?
    ko: |-
      그럼 그냥 무한한 공포의 세계로 던져버리는거네?
      허락도 안 받고?
    ja: |-
      じゃ、その無限の恐怖の世界に
      放りこんじゃうってコト？
      本人たちの許可ナシで？
  d_main_49_02_44:
    speaker: eh_n
    en: Yes.
    ko: 그래.
    ja: ええ。
  d_main_49_02_45:
    speaker: viper
    en: They're gonna resent us.
    ko: 원망받겠다.
    ja: 恨まれちゃうね。
  d_main_49_02_46:
    speaker: eh_n
    en: They may resent us, but they'll do so under the real sun.
    ko: 원망 받더라도, 햇빛 아래에서 받는 게 나아.
    ja: |-
      どうせ恨まれるなら、
      陽の光の下で恨まれるほうがいい。
  d_main_49_02_47:
    speaker: viper
    en: "... ♡"
    ko: "……♡"
    ja: "……♡"
  d_main_49_02_48:
    speaker: eh_n
    en: Let's go. We have to get this done today.
    ko: 가자. 오늘 안에 다 끝내야 해.
    ja: |-
      行こう。今日中に
      終わらせないといけなくなった。
  d_main_49_02_49:
    speaker: viper
    en: What's with the sudden rush?
    ko: 갑자기 엄청 서두르네.
    ja: ずいぶん急ね。
  d_main_49_02_50:
    speaker: viper
    en: You'd think we were ascending tomorrow or something.
    ko: 누가 보면 당장 내일이라도 시작하는 줄 알겠어.
    ja: 誰かが明日やるとか言い出したみたいな感じ？
  d_main_49_02_51:
    speaker: eh_n
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_52:
    speaker: viper
    en: Wait, seriously?
    ko: 어머, 진짜?
    ja: え、ホントに？
  d_main_49_02_53:
    speaker: eh_n
    en: Things must not be going well.
    ko: 상황이 좋지 않나봐.
    ja: 状況が良くないらしい。
  d_main_49_02_54:
    speaker: eh_n
    en: The Ark probably wanted to be as thoroughly prepared as possible, but...
    ko: 방주 입장에서도 최대한 준비를 한 후에 올리고 싶었겠지만….
    ja: |-
      アークとしても、
      準備は最大限にしたいはず…
  d_main_49_02_55:
    speaker: eh_n
    en: I suppose there's a reason they're in such a rush.
    ko: 이렇게 서두를 수밖에 없는 이유가 있겠지.
    ja: |-
      そこまで急ぐと決まったなら、
      かなりの事情に違いない。
  d_main_49_02_56:
    speaker: jackal
    en: Whoa, so we're going up to the surface tomorrow?
    ko: 우와. 그럼 내일 우리 지상으로 올라가는거야?
    ja: わあ！じゃ、私たち、明日地上に行けるの？
  d_main_49_02_57:
    speaker: jackal
    en: And we never have to go back underground?
    ko: 다시 지하로 안 내려와도 되는거고?
    ja: もう地下にいなくていいってこと？
  d_main_49_02_58:
    speaker: viper
    en: Yup, probably.
    ko: 응. 아마도.
    ja: うん、たぶんね。
  d_main_49_02_59:
    speaker: jackal
    en: Whoa!
    ko: 우와, 우와!
    ja: わーい、やったー！
  d_main_49_02_60:
    speaker: viper
    en: Are you that excited?
    ko: 그렇게 좋아?
    ja: そんなに嬉しい？
  d_main_49_02_61:
    speaker: jackal
    en: Yeah! The surface rocks!
    ko: 응! 지상 좋아!
    ja: うん！地上大好き！
  d_main_49_02_62:
    speaker: jackal
    en: You can run forever and ever! And there's so much good food!
    ko: 달려도 달려도 끝이 없고, 맛있는 것도 많아!
    ja: |-
      どこまで走っても端っこにつかないし、
      おいしいものもいっぱいあるし！
  d_main_49_02_63:
    speaker: jackal
    en: There's also so much to do, and all these funny-looking animals up there!
    ko: 놀 거도 엄청 많고, 재밌게 생긴 동물들도 많아!
    ja: |-
      遊ぶところもたーっくさんあるし、
      面白い見た目の動物もたくさんいるんだ！
  d_main_49_02_64:
    speaker: jackal
    en: I can't wait to go!
    ko: 빨리 올라갔으면 좋겠어!
    ja: 早く地上に行きたいな～！
  d_main_49_02_65:
    speaker: viper
    en: Haha, I like how easy you are to please! ♡
    ko: 아핫. 자칼은 단순해서 좋네♡
    ja: あはっ。悩みが無くていいね♡
  d_main_49_02_66:
    speaker: viper
    en: People like you are the ones who'll thrive up there.
    ko: 지상에서 살아남는 건, 자칼 같은 애들이겠지.
    ja: |-
      地上で生き残れるのは、
      ジャッカルみたいな子じゃないかな。
  d_main_49_02_67:
    speaker: eh_n
    en: I'm jealous.
    ko: 부럽네.
    ja: うらやましい限りね。
  d_main_49_02_68:
    speaker: viper
    en: It's easy to become someone who's easy to please, Boss.
    ko: 단순해지는 건 쉬워, 리더.
    ja: 難しいことじゃないよ、リーダー。
  d_main_49_02_69:
    speaker: viper
    en: If you stop caring about what you stand to gain or lose, you can be free.
      ♡
    ko: 실득을 따지지 않으면 누구보다 자유로워질 수 있다고♡
    ja: |-
      損とか得とか考えなきゃ、
      何にも縛られなくなるんだから♡
  d_main_49_02_70:
    speaker: eh_n
    en: That's why you and I will never be free.
    ko: 그래서 너랑 내가 자유로워지지 못하는거야.
    ja: だから、お前も私も自由になれない。
  d_main_49_02_71:
    speaker: viper
    en: Haha, you're right.
    ko: 아핫. 그렇지.
    ja: あはっ。それはそう。
  d_main_49_02_72:
    speaker: eh_n
    en: Still, I have no intention of sacrificing anything.
    ko: 그럼에도 전부 얻고, 단 하나도 잃지 않겠어.
    ja: でも、何一つ自分から手放すつもりはない。
  d_main_49_02_73:
    speaker: eh_n
    en: Let's hurry.
    ko: 서두르자.
    ja: 急ごう。
  d_main_49_02_74:
    speaker: eh_n
    en: We have to bring everyone to the surface.
    ko: 모두를 위로 올려야 해.
    ja: 一人残らず上へ連れていく。
  d_main_49_02_75:
    speaker: ingrid_op
    en: The time has finally come to repay a century of humiliation!
    ko: 100여년 동안의 굴욕을 드디어 갚아줄 때가 왔다!
    ja: |-
      百年余りの長きにわたる屈辱を、
      ついに晴らす時が来た！
  d_main_49_02_76:
    speaker: ingrid_op
    en: Humanity will reclaim the surface!
    ko: 인류는 다시 지상으로 올라갈 것이다!
    ja: 人類は再び地上へ帰る！
  d_main_49_02_77:
    speaker: ingrid_op
    en: We'll show them who the surface truly belongs to!
    ko: 지상의 진정한 주인이 누구인지!
    ja: 地上の真の主が誰なのか、思い知らせてやろう！
  d_main_49_02_78:
    speaker: ingrid_op
    en: Elysion, the master of tactics, will make those Raptures pay once and for
      all!
    ko: 랩쳐 놈들에게 택티컬의 선두주자 엘리시온이 똑똑히 보여줄 것이다!
    ja: |-
      軍事戦術の先駆者たる
      我らエリシオンが、
      ラプチャーどもにしかと見せつける！
  d_main_49_02_79:
    speaker: syuen_op
    en: '"Advanced" doesn''t begin to cover just how far the Ark''s technology has
      come.'
    ko: 방주의 기술은 이미 무르익었다는 말로도 모자랄 정도야.
    ja: |-
      アークの技術力は、
      とっくに成熟の域を越えたわ。
  d_main_49_02_80:
    speaker: syuen_op
    en: It's on a whole other level. There's simply no way we could lose.
    ko: 역대급이지. 사실상 질 이유가 없는 수준이야.
    ja: |-
      史上最高の革新を遂げたの。
      負けることなど考えられない。
  d_main_49_02_81:
    speaker: syuen_op
    en: So all of you have nothing to worry about.
    ko: 그러니 너희들은 아무런 걱정할 필요가 없어.
    ja: |-
      そうよ、お前たちは
      何一つ心配する必要なんてないの。
  d_main_49_02_82:
    speaker: syuen_op
    en: Missilis will deliver the surface to you on a silver platter, so get the celebrations
      ready.
    ko: 미실리스가 다 알아서 지상을 갖다바쳐줄 테니까, 파티나 준비하라고.
    ja: |-
      ミシリスにすべて任せておきなさい。
      地上は奪還してあげるから、
      パーティーの準備でもしておくことね。
  d_main_49_02_83:
    speaker: mustang_op
    en: La Third Surface Reclamation War! Coming soon!
    ko: 3rd 지상 탈환전! Coming Soon!
    ja: 3rd地上奪還戦！Coming Soon！
  d_main_49_02_84:
    speaker: mustang_op
    en: Le moment that will décider the Ark's future is almost here!
    ko: Ark의 미래를 건 최종 결전의 Time이 곧 다가옵니Da!
    ja: |-
      Arkの未来をかけた最終決戦のTimeは、
      すぐそこに迫っていまSU！
  d_main_49_02_85:
    speaker: mustang_op
    en: Are you scared?! Are you terrified?! Non, don't worry!
    ko: |-
      무섭습니Gga!? 두려우십니Gga!?
      Don't----Worryyyyyy!!
    ja: |-
      怖いですKA！？震えてきますKA！？
      Don't----Worryyyyyy！！
  d_main_49_02_86:
    speaker: mustang_op
    en: Tetra's chéries are équipées with Entertainment Power!
    ko: Entertainment Power로 무장한 Tetra의 Girl들E!
    ja: |-
      Entertainment Powerを武器に、
      TetraのGirlたちGA！
  d_main_49_02_87:
    speaker: mustang_op
    en: 'We''ll bring you l''ultimate entertainment: reclaiming the surface!'
    ko: 지상 탈환이라는 최고의 Entertainment를 안겨드리겠습니Da--!!
    ja: |-
      地上奪還という最高の
      Entertainmentをお届けしMASU！！
  d_main_49_02_88:
    speaker: "<Narration>"
    en: Privaty watches the CEOs' announcement for the Third Surface Reclamation War
      playing on a billboard in the Ark's downtown area.
    ko: 프리바티는 방주 시내 전광판에서 재생되는 [3차 지상 탈환전 기념 CEO들의 인사]를 바라본다.
    ja: |-
      アーク市街地の電光掲示板に映し出される
      「迫る開戦によせたCEOたちの共同コメント」
      を、プリバティが見上げていた
  d_main_49_02_89:
    speaker: "<Narration>"
    en: Next, a program where key Central Government officials go on about all the
      benefits that will come after the war.
    ko: 이어서 중앙 정부 주요 인사들의 3차 지상 탈환전 이후에 있을 막대한 이득에 대해 늘어놓는 프로그램이 재생된다.
    ja: |-
      その後には中央政府の首脳たちが顔を出し、
      第三次地上奪還戦後に得られるであろう
      莫大な利益を並べ立てる
  d_main_49_02_90:
    speaker: "<Narration>"
    en: Wherever she looks, the message is the same.
    ko: 어딜 보든 같은 내용 뿐이다.
    ja: どこを見ても同じ内容ばかりだ
  d_main_49_02_91:
    speaker: "<Narration>"
    en: Privaty can't tear her gaze away from the billboard.
    ko: 프리바티는 계속해서 전광판에서 눈을 떼지 못한다.
    ja: プリバティはひたすら電光掲示板を眺めていた
  d_main_49_02_92:
    speaker: "<Narration>"
    en: Somebody lightly taps her on the shoulder.
    ko: 툭. 하고 누군가가 프리바티의 어깨를 친다.
    ja: 誰かが肩を叩いた
  d_main_49_02_93:
    speaker: privaty
    en: "... Oh."
    ko: "…아."
    ja: "…はっ。"
  d_main_49_02_94:
    speaker: yulha
    en: What are you doing? Did you suddenly get the urge to watch TV?
    ko: 뭐해? 갑자기 TV라도 보고 싶어졌냐?
    ja: どうしたの？急にテレビ鑑賞？
  d_main_49_02_95:
    speaker: privaty
    en: Sorry. I can't believe I got distracted when we're this busy...
    ko: 죄송해요. 바쁠때에 한눈 팔다니.
    ja: |-
      申しわけありません。
      こんな忙しい時に、ついよそ見を…
  d_main_49_02_96:
    speaker: yulha
    en: Let's go. We've got work to do.
    ko: 가자. 바빠.
    ja: 行くわよ。忙しいんだから。
  d_main_49_02_97:
    speaker: privaty
    en: Okay.
    ko: 예.
    ja: はい。
  d_main_49_02_98:
    speaker: admi
    en: Seems like you've got a lot of complaints.
    ko: 불만이 많아 보이시네요.
    ja: 言いたいことがあるみたいですね。
  d_main_49_02_99:
    speaker: privaty
    en: I... No... That's not true.
    ko: 아… 뇨. 그런건 없어요.
    ja: あ…いえ。そのようなことは。
  d_main_49_02_100:
    speaker: yulha
    en: You're quite the liar.
    ko: 참 거짓말 잘해.
    ja: ウソがヘタ。
  d_main_49_02_101:
    speaker: privaty
    en: Wh-what?
    ko: 제, 제가 뭘요.
    ja: こ、この私が！？
  d_main_49_02_102:
    speaker: admi
    en: Are you unhappy that they're only painting things in a positive light?
    ko: 너무 좋을 대로만 이야기 하고 있어서 불만이신가요?
    ja: 都合のいいことばかり言ってるから、ですか？
  d_main_49_02_103:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_104:
    speaker: privaty
    en: Yeah. Everyone's talking like we're sure to win this war and usher in some
      golden era.
    ko: 맞아요. 다들 3차 지상 탈환전은 무조건 성공할 거다, 이후에는 황금빛 미래가 펼쳐질 거다라고만 이야기하고 있으니까요.
    ja: |-
      そうです。口をそろえて必ず成功する、
      輝かしい未来が待っているなんて、そればかり。
  d_main_49_02_105:
    speaker: privaty
    en: Of course, I don't disagree with that.
    ko: 물론 그것에 대한 이견은 없어요.
    ja: もちろん、そのこと自体に異論はありません。
  d_main_49_02_106:
    speaker: privaty
    en: We'll win the war, and the Ark will ascend to the surface.
    ko: 3차 지상 탈환전은 성공할 테고, 방주는 지상에 올라가겠죠.
    ja: |-
      第三次地上奪還戦は必ず成功し、
      アークは地上に上がります。
  d_main_49_02_107:
    speaker: privaty
    en: I'm sure a bright future is waiting for us.
    ko: 좋은 미래가 기다리고 있을거예요.
    ja: 素晴らしい未来は確かに待っているでしょう。
  d_main_49_02_108:
    speaker: privaty
    en: On the other hand, there'll be plenty of bad things in store for us, too.
    ko: 그런데 그에 반해 좋지 않은 일들도 많을거예요.
    ja: ですが、良いことばかりではないはずです。
  d_main_49_02_109:
    speaker: privaty
    en: Most people won't be able to adapt to the sudden change in environment, and
      we'll be exposing ourselves to all sorts of diseases.
    ko: 생활환경이 급격하게 바뀌어 적응하지 못하는 경우가 대부분일 테고, 온갖 질병들의 위험에 노출되겠죠.
    ja: |-
      生活環境が一変すれば、
      適応できずに苦しむ人は大勢出ますし、
      未知の病のリスクだってあります。
  d_main_49_02_110:
    speaker: privaty
    en: The notion of what's valuable will change too, throwing our economy into disarray.
    ko: 가치 척도가 변해 경제가 엉망이 될 거예요.
    ja: |-
      ものごとの価値基準が根本から変わり、
      経済は大混乱するでしょう。
  d_main_49_02_111:
    speaker: privaty
    en: Countless jobs will disappear, and countless others will be created.
    ko: 수많은 직업이 사라지고, 수많은 직업이 생겨나겠죠.
    ja: |-
      いろいろな職業が消滅し、
      新しい職業に置き変わっていくはずです。
  d_main_49_02_112:
    speaker: privaty
    en: One of the civilians I forcibly evacuated to a shelter earlier said he'd just
      gotten a job as a mechanic for the Dome of Eternity.
    ko: "…좀 전에 쉘터로 강제 이동시킨 시민 한 분은, 어제 이터널 스카이 정비공으로 취직했다고 했어요."
    ja: |-
      …さきほどシェルターへ強制避難させた人は、
      エターナルスカイの整備士として
      就職したばかりだと言っていました。
  d_main_49_02_113:
    speaker: privaty
    en: He said he'd worked tirelessly for the last five years despite his difficult
      circumstances.
    ko: 어려운 형편에서 5년 동안 정말 열심히 노력해왔다고 했어요.
    ja: 苦しい中で、5年も努力を重ねてきたそうです。
  d_main_49_02_114:
    speaker: privaty
    en: "... Now those past five years have all been for nothing."
    ko: "…그분의 5년은, 아무 소용 없어진 게 됐네요."
    ja: |-
      …その5年間は、
      報われなくなってしまいました。
  d_main_49_02_115:
    speaker: privaty
    en: Honestly, I think the war has far more downsides than benefits—
    ko: 저는 솔직히, 이번 3차 지상 탈환전이 좋은 점보다는 단점이 훨씬-
    ja: |-
      正直なところ、この第三次地上奪還戦は、
      利益よりも問題のほうがはるかに――
  d_main_49_02_116:
    speaker: yulha
    en: Go.
    ko: 너. 돌아가.
    ja: プリバティ。戻ってなさい。
  d_main_49_02_117:
    speaker: yulha
    en: Wait for us in the executive shelter. You're only getting in our way.
    ko: 간부용 안전 쉘터로 들어가있어. 방해야.
    ja: |-
      政府関係者用のシェルターに入ってて。
      邪魔になるから。
  d_main_49_02_118:
    speaker: privaty
    en: Yulha...
    ko: "…율하."
    ja: "…ユルハ。"
  d_main_49_02_119:
    speaker: yulha
    en: Don't go to the regular shelters. That negative attitude of yours could be
      contagious.
    ko: 일반 쉘터도 안 돼. 네 그 부정적인 생각은 전염되니까.
    ja: |-
      一般のシェルターはダメよ。
      あなたの不安が伝染するから。
  d_main_49_02_120:
    speaker: yulha
    en: Go on. Leave.
    ko: 그러니까 어서 돌아가.
    ja: 早く、休んでなさい。
  d_main_49_02_121:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_122:
    speaker: yulha
    en: Those downsides you mentioned. We know about them. Everyone does.
    ko: 네가 말한 단점. 다 알고 있어. 모르는 사람은 없을거야.
    ja: |-
      あなたの心配してることなんて、
      みんな分かってるのよ。
      考えてない人なんていないわ。
  d_main_49_02_123:
    speaker: yulha
    en: But there's nothing we can do.
    ko: 하지만 방법이 없어.
    ja: それでも、やるしかないでしょ。
  d_main_49_02_124:
    speaker: yulha
    en: When we only have one choice, what good is there in sitting around complaining
      about everything?
    ko: |-
      유일한 선택지 하나만 남아있는 상태에서,
      이건 이래서 싫고 저건 저래서 싫고를 따져서 뭘 어쩌자는 거야.
    ja: |-
      他に選択肢がない状況で
      あれがダメ、これがダメなんて
      ケチをつけたところで、何になるっていうのよ。
  d_main_49_02_125:
    speaker: yulha
    en: You have to do whatever it takes to focus on the positives. Even then, there's
      no telling whether things will work out.
    ko: |-
      어떻게든 좋은 면만 봐야 해.
      그렇게 해도 일이 잘 풀릴까말까야.
    ja: |-
      どうにか前向きに考えるしかないの。
      上手くいくかどうかは誰も知らない。
  d_main_49_02_126:
    speaker: yulha
    en: Your attitude right now isn't helping at all.
    ko: 그러니까 지금 네 태도는 아무 도움이 안 돼.
    ja: |-
      そんな態度は、
      この状況で何の役にも立たないわ。
  d_main_49_02_127:
    speaker: privaty
    en: I...
    ko: 저는….
    ja: 私は…
  d_main_49_02_128:
    speaker: admi
    en: Privaty.
    ko: 프리바티.
    ja: プリバティ。
  d_main_49_02_129:
    speaker: admi
    en: Put your trust in the current government.
    ko: 지금의 중앙 정부를 믿죠.
    ja: 今の中央政府を信じましょう。
  d_main_49_02_130:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_131:
    speaker: admi
    en: It was probably just the same when people first came down to the Ark.
    ko: 방주에 처음 내려왔을 때도 마찬가지였을거예요.
    ja: 人類がアークに来た時も、同じだったはずです。
  d_main_49_02_132:
    speaker: admi
    en: Everything must have felt uncertain, and maybe nothing went according to plan...
    ko: 모든 것이 불안하고, 모든 것이 제대로 굴러가지 않았겠지만.
    ja: |-
      不安だらけで、何もかも
      まともに機能していなかったに
      違いありません。
  d_main_49_02_133:
    speaker: admi
    en: Yet somehow, they managed to build the Ark we have today.
    ko: 어떻게든 지금의 방주를 만들어냈잖아요.
    ja: それでも、今のアークはここにあります。
  d_main_49_02_134:
    speaker: admi
    en: Of course, it's far from perfect, but this place has become home to many people.
    ko: |-
      물론 단점이 많은 곳이지만,
      많은 사람이 살아갈 수 있는 터전이죠.
    ja: |-
      問題はいろいろ抱えていますが、
      多くの人が暮らす場所になりました。
  d_main_49_02_135:
    speaker: admi
    en: The surface won't be any different.
    ko: 지상도 다르지 않을 거예요.
    ja: 地上に戻るのも同じことです。
  d_main_49_02_136:
    speaker: admi
    en: At first, there'll be nothing but uncertainty and chaos,
    ko: 처음엔 온갖 불안과 혼란이 넘쳐날 테지만.
    ja: |-
      はじめは至るところで
      不安や混乱が起こるでしょう。
  d_main_49_02_137:
    speaker: admi
    en: but soon, everything will go back to normal.
    ko: 금방 정상으로 되돌릴거예요.
    ja: ですが、いずれは落ち着きます。
  d_main_49_02_138:
    speaker: admi
    en: That's our job and the Central Government's too.
    ko: 중앙 정부와, 우리가 하는 일이 그것이니까.
    ja: |-
      そうなるようにすることが、
      中央政府や私たちの仕事です。
  d_main_49_02_139:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_140:
    speaker: privaty
    en: I understand. I'm sorry.
    ko: 알겠어요. 미안해요.
    ja: おっしゃる通りです。反省します。
  d_main_49_02_141:
    speaker: yulha
    en: Hmph. You're worse than a kid.
    ko: 흥. 애보다 못해가지고는.
    ja: まったく…子ども以下ね。
  d_main_49_02_142:
    speaker: privaty
    en: I-I said I'm sorry.
    ko: 미, 미안하다고요.
    ja: は、反省しましたから！
  d_main_49_02_143:
    speaker: yulha
    en: Let's move to the next area. We need to pick up the pace.
    ko: 다음 지역으로 이동한다. 속도 좀 내자고.
    ja: 次の場所に行かないと。少し急ぐわよ。
  d_main_49_02_144:
    speaker: admi
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_145:
    speaker: admi
    en: Um...
    ko: 저, 혹시….
    ja: あの、そういえば…
  d_main_49_02_146:
    speaker: yulha
    en: What? Do you have complaints too?
    ko: 왜. 너도 불만 있어?
    ja: 何よ。あなたも何か不満？
  d_main_49_02_147:
    speaker: admi
    en: No, that's not it...
    ko: 그게 아니라….
    ja: そうではないですが…
  d_main_49_02_148:
    speaker: admi
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_149:
    speaker: admi
    en: N-never mind. Let's go.
    ko: 아, 아니에요. 가시죠.
    ja: いえ、何でもないです。行きましょう。
  d_main_49_02_150:
    speaker: yulha
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_02_151:
    speaker: yulha
    en: Happy Zoo is taking in every single stray cat.
    ko: 거리를 떠도는 고양이들은 해피 주 녀석들이 빠짐없이 데려가고 있어.
    ja: |-
      ノラネコのことなら、
      ハッピーズーの連中が
      一匹残らず捕まえて回ってるから。
  d_main_49_02_152:
    speaker: yulha
    en: Those girls have freakishly good noses, so don't worry.
    ko: 냄새하나는 기가 막히게 잘 맡는 녀석들이니, 걱정 없을거다.
    ja: |-
      そういうことには鼻が利く専門家だし、
      心配ないでしょ。
  d_main_49_02_153:
    speaker: admi
    en: Oh...!
    ko: 아…!
    ja: あ…！
  d_main_49_02_154:
    speaker: admi
    en: I-I see. Thank you.
    ko: 그, 그렇군요. 감사합니다.
    ja: そ、そうでしたか。安心しました。
  d_main_49_02_155:
    speaker: yulha
    en: "... Good grief."
    ko: "…하여간."
    ja: "…まったく…"
d_main_49_03:
  d_main_49_03_1:
    speaker: poli
    en: You there! Eating is only permitted in your assigned room in the shelter!
    ko: 거기! 취식은 쉘터에 할당된 자기 방에서만 해주세영!
    ja: |-
      そこ！飲食は割り当てられた
      自室内でお願いしますぅ！
  d_main_49_03_2:
    speaker: poli
    en: You have a food waste processor in your room as well, so dispose of any food
      waste properly!
    ko: 음식물 쓰레기 처리기도 방 안에 있으니까 잘 처리해 주시고영!
    ja: |-
      生ゴミ処理機も部屋の中にありますから、
      きちんと処理してくださいねぇ！
  d_main_49_03_3:
    speaker: poli
    en: Hey! Please make sure you're fully dressed when you leave your room!
    ko: 아닝! 방에서 나올 땐 옷 다 입으셔야졍!
    ja: |-
      ダメですぅ！部屋を出る時は、
      きちんと服を着てくださぁい！
  d_main_49_03_4:
    speaker: poli
    en: You there! No fighting! One more fight and you're going into isolation!
    ko: 거기! 싸우지 마세영! 한번만 더 싸우면 격리됩니당!
    ja: |-
      そこ！ケンカはやめて！
      次やったら隔離ですよん！
  d_main_49_03_5:
    speaker: poli
    en: "*Sigh* It never ends."
    ko: 에흉…. 끝이없넹.
    ja: はぁ…次から次へと…
  d_main_49_03_6:
    speaker: miranda_op
    en: Poli! Poliiii!!!
    ko: 폴리! 폴리이이이--!!
    ja: ポリ！ポリィィィ！！
  d_main_49_03_7:
    speaker: poli
    en: What? Is something wrong at your shelter?
    ko: "…왜영. 그쪽 쉘터에 뭔가 문제라도 생겼나영?"
    ja: |-
      …なんですかぁ？
      そっちで何か問題でもぉ？
  d_main_49_03_8:
    speaker: miranda_op
    en: The civilians here are grilling nutrium!
    ko: 여기 시민분들이 배양육을 구워먹고 있습니다!
    ja: |-
      市民のみなさんが培養肉を
      焼きながら食べています！
  d_main_49_03_9:
    speaker: poli
    en: Get rid of it and give them a stern warning.
    ko: 바로 치워버리고, 따끔하게 경고 주세영.
    ja: |-
      ただちに片付けさせて、
      厳しく注意してくださぁい。
  d_main_49_03_10:
    speaker: miranda_op
    en: Got it! But it smells so amazing!
    ko: 알겠습니다! 그런데 냄새가 너무 좋습니다!
    ja: |-
      了解です！
      でも、すごくいい匂いがします！
  d_main_49_03_11:
    speaker: poli
    en: Grr...! Don't even think about mooching off them!
    ko: 크르릉…! 얻어먹으려는 생각 절대 하지 마세영!
    ja: |-
      グルル…！分けてもらおうなんて、
      絶対に考えないでくださいよん！
  d_main_49_03_12:
    speaker: poli
    en: Your job over there is to maintain order, not make friends!
    ko: |-
      미란다가 거기서 해야 할 일은 질서 유지지,
      같이 어울리는 게 아니라고영!
    ja: |-
      秩序を守ることが私たちの仕事ですから、
      混ざってはダメですからねぇ！
  d_main_49_03_13:
    speaker: miranda_op
    en: Understood! But can't I have just one bite?
    ko: 알겠습니다! 그런데 딱 한점도 안 됩니까?
    ja: |-
      分かりました！
      一切れでもダメでしょうか？
  d_main_49_03_14:
    speaker: poli
    en: "... Your shelter is only three minutes from here, right? I'm heading over
      now."
    ko: |-
      …미란다가 담당하는 쉘터가 여기서 3분 거리였졍?
      지금 갈게영.
    ja: |-
      …ミランダの担当エリアは
      ここから3分の距離でしたねぇ？
      今すぐ向かいますからぁ…
  d_main_49_03_15:
    speaker: miranda_op
    en: N-no! It's all right!
    ko: 아, 아닙니다! 괜찮습니다!
    ja: い、いえ！理解しています！
  d_main_49_03_16:
    speaker: poli
    en: Do your job. Given the situation we're in, there could be serious consequences
      if we don't stay on top of things.
    ko: 똑바로 해영. 상황이 상황인만큼, 우리가 제대로 하지 않으면 큰일이니깡.
    ja: |-
      しっかりしてくださいよん…
      状況が状況ですから、私たちが
      えりを正さないと大問題になりますぅ。
  d_main_49_03_17:
    speaker: miranda_op
    en: Understood!
    ko: 알겠습니다!
    ja: 分かりました！
  d_main_49_03_18:
    speaker: miranda_op
    en: Oh, by the way are you watching the concert celebrating the start of the war?
      The 777 Squad just finished their performance!
    ko: |-
      아, 그런데 지금 개전 축하 공연 보고 계십니까?
      777 스쿼드 무대가 방금 끝났는데,
    ja: |-
      あ、ところで、開戦記念公演は
      ご覧になっていますか？777のステージが
      たったいま終わったところなのですが…
  d_main_49_03_19:
    speaker: miranda_op
    en: Next up is a joint performance by Prima Donna and T.T. STAR! Rewind is making
      a guest appearance, so it's gonna be amaz—
    ko: |-
      바로 프리마돈나랑 T.T. STAR가 합동 공연 하고 있습니다!
      리와인드도 같이 나오는데 정말 멋있습-
    ja: |-
      プリマドンナとT.T. STARの
      合同ステージが始まりました！
      リワインドも一緒に出ていて、素敵で――
  d_main_49_03_20:
    speaker: poli
    en: I'm hanging up.
    ko: 끊을게영.
    ja: 切りますよんっ。
  d_main_49_03_21:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_49_03_22:
    speaker: poli
    en: "*Sigh*"
    ko: "…에흉."
    ja: "…はぁぁ。"
  d_main_49_03_23:
    speaker: quiry_op
    en: Poli! Poliiii!!!
    ko: 폴리! 폴리이이이--!!
    ja: ポリ！ポリィィィ！！
  d_main_49_03_24:
    speaker: poli
    en: Urgh...! What?
    ko: 으으으…! 왜영.
    ja: ううう…！なんですかぁ。
  d_main_49_03_25:
    speaker: quiry_op
    en: Talentum is engaging in unauthorized trade inside the shelter!
    ko: 달란트 분들이 쉘터 안에서 불법 거래를 하고 있어요!
    ja: |-
      タレント部隊のみなさんが
      シェルター内で違法取引をしているようです！
  d_main_49_03_26:
    speaker: poli
    en: What...?
    ko: "…뭐라고영?"
    ja: "…何ですってぇ？"
  d_main_49_03_27:
    speaker: quiry_op
    en: Th-they're giving out free bags of suspicious white powder. Is it what I think
      it is?
    ko: |-
      막, 막 수상한 흰색 가루가 든 봉투를 무료로 나눠주고 있는데,
      이거 그거 맞죠?
    ja: |-
      な、なんだか怪しい白いものが入った袋を
      無料で配布しているようですが…
      これって、アレですよね？
  d_main_49_03_28:
    speaker: quiry_op
    en: I-I should arrest them, right? But I don't think I could beat them in a fight...
    ko: |-
      여, 역시 체포하는게 좋겠죠?
      그런데 싸움은 자신 없는데….
    ja: |-
      や、やっぱり逮捕ですか？
      でも、戦闘は自信がないですし…
  d_main_49_03_29:
    speaker: poli
    en: The people from Talentum would never do that!
    ko: 달란트 분들이 그런 짓을 할 리가 없잖아영!
    ja: そんなことがあるはずありませんよん！
  d_main_49_03_30:
    speaker: poli
    en: Go take a closer look!
    ko: 자세히 봐봐영!
    ja: きちんと確認してくださぁい！
  d_main_49_03_31:
    speaker: quiry_op
    en: Ah! Yan just gave one to me, too! H-how dare she disrespect the police so
      openly!
    ko: |-
      헉! 얀이 방금 저한테도 줬어요!
      겨, 경찰을 이렇게 대놓고 무시하다니 용서할 수 없어요!
    ja: |-
      はっ！たった今ヤンにブツを渡されました！
      ど、堂々と警察を挑発するなんて、許せません！
  d_main_49_03_32:
    speaker: quiry_op
    en: I'm gonna arrest her right now!
    ko: 당장 체포할게요!
    ja: 今すぐ逮捕してきます！
  d_main_49_03_33:
    speaker: poli
    en: Stop! I told you to take a closer look! Look at it up close!
    ko: 아니! 자세히 보라니까영! 가까이에서 봐영!
    ja: |-
      いやいや！確かめてくださいってばぁ！
      もっとよく見て！
  d_main_49_03_34:
    speaker: quiry_op
    en: Oh... They're tissues.
    ko: "…아. 티슈네요."
    ja: "…あっ、ティッシュでした。"
  d_main_49_03_35:
    speaker: poli
    en: "*Sigh*"
    ko: 에흉.
    ja: はぁぁ…
  d_main_49_03_36:
    speaker: quiry_op
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_37:
    speaker: poli
    en: Talentum is going around handing out relief supplies to the different shelters.
      So don't go making accusations like that again.
    ko: |-
      달란트 분들이 쉘터를 돌아다니면서 구호 물품을 배포하고 있어영.
      그러니까 다시는 그런 의심하지 말아영.
    ja: |-
      タレント部隊はシェルターで
      救援物資の配布に回っていますぅ。
      過剰に疑う必要はありませんよん。
  d_main_49_03_38:
    speaker: quiry_op
    en: Okay. I'm sorry...
    ko: "…알겠습니다. 죄송합니다."
    ja: "…了解しました。申し訳ありません。"
  d_main_49_03_39:
    speaker: poli
    en: Any other problems to report?
    ko: 다른 문제는 없나영?
    ja: 他に問題は発生していませんかぁ？
  d_main_49_03_40:
    speaker: quiry_op
    en: Nope. Fortunately the people here are following directions well, so there
      haven't been any major issues.
    ko: 예. 다행히 시민 분들이 지시에 잘 따라주고 계셔서 큰 문제는 없어요.
    ja: |-
      はい。幸い、こちらの皆さんは
      きちんと指示に従ってくださっています。
      大きな問題はありません。
  d_main_49_03_41:
    speaker: poli
    en: Okay. Contact me if anything comes up.
    ko: 알겠어영. 문제 생기면 바로 연락줘영.
    ja: |-
      了解ですぅ。問題が起きたら
      すぐに連絡してくださいねぇ。
  d_main_49_03_42:
    speaker: quiry_op
    en: Got it!
    ko: 네!
    ja: はい！
  d_main_49_03_43:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_49_03_44:
    speaker: poli
    en: "*Siiigh*"
    ko: 에휴우우웅….
    ja: はぁぁぁ…
  d_main_49_03_45:
    speaker: rosanna_op_l
    en: Everything okay, little White Puppy?
    ko: 하얀 강아지. 별일 없어?
    ja: あ、白いワンちゃん。元気？
  d_main_49_03_46:
    speaker: poli
    en: Grr...! I'm not a puppy.
    ko: 크르릉…! 강아지 아니라고영.
    ja: グルルル…！ワンちゃんではありません！
  d_main_49_03_47:
    speaker: sakura_op_r
    en: That's no way to treat a public servant. When are you going to fix that vulgar
      disposition of yours?
    ko: |-
      공직에 계신 분께 너무 무례하시군요.
      언제쯤 저 천박한 기질을 고칠 생각인지.
    ja: |-
      政府の御紋を負っておられるお方に、
      ずいぶん失礼ですね。いつになったら、
      その品のなさをお改めになるのでしょう。
  d_main_49_03_48:
    speaker: rosanna_op_l
    en: You'd do well to stick to your natural talents and suck up to those in public
      office, Sakura.
    ko: 규수는 타고난 기질에 맞게 공직에 계신 분께 열심히 꼬리나 흔들라고.
    ja: |-
      お嬢ちゃんこそお嬢ちゃんらしく、
      政府の手先にシッポでも振ったらどう？
  d_main_49_03_49:
    speaker: moran_op_c
    en: Sorry, I hope I'm not late. I had some cleaning to do.
    ko: 어, 나 안 늦었지? 미안. 청소 좀 하느라고.
    ja: |-
      お、遅れてねぇよな？
      悪い、掃除に時間食っちまってさ。
  d_main_49_03_50:
    speaker: poli
    en: Why did you all suddenly reach out...? Oh. It's time for your status reports.
    ko: 갑자기 왜 다같이 연락을… 아, 상황 공유 시간이군영.
    ja: |-
      いっせいに連絡なんて…
      あっ、もう定時報告の時間でしたねぇ。
  d_main_49_03_51:
    speaker: rosanna_op_l
    en: That's right. You set this time, White Puppy. Or did you forget?
    ko: 그래그래. 우리 하얀 강아지가 지정한 시간이었잖아. 잊었어?
    ja: |-
      そうだよ。ワンちゃんの方が
      決めてきた時間でしょ、忘れたの？
  d_main_49_03_52:
    speaker: poli
    en: "*Sigh* I didn't even realize how much time had passed."
    ko: 에흉. 시간이 어떻게 가는지도 몰랐네영.
    ja: |-
      はぁ…時間を確かめるヒマも
      ありませんでしたよん…
  d_main_49_03_53:
    speaker: poli
    en: Is everyone here?
    ko: 인원은 전부 다 모였고영?
    ja: それで、順調に進んでいますかぁ？
  d_main_49_03_54:
    speaker: rosanna_op_l
    en: All the shelters are full. Exotic is doing a great job of rounding people
      up.
    ko: |-
      준비된 쉘터 모두가 꽉 찼어.
      이그조틱 녀석들, 잘도 찾아내네.
    ja: |-
      用意したシェルターはどこもいっぱいだよ。
      エキゾチックの連中も、
      よく探し出してきたね。
  d_main_49_03_55:
    speaker: poli
    en: Does that mean everyone from the Outer Rim has been moved to a shelter?
    ko: 그럼 아우터 림의 모든 분들이 쉘터로 이동한건가영?
    ja: |-
      では、アウターリムの住民は
      全員避難できたと考えても？
  d_main_49_03_56:
    speaker: rosanna_op_l
    en: I doubt it. Anyone who's gone to great lengths to hide can't be found.
    ko: |-
      그건 아니겠지.
      각잡고 숨은 녀석들은 못 찾아.
    ja: |-
      無理なハナシだね。
      本気で隠れてるヤツらまでは
      見つけられっこないよ。
  d_main_49_03_57:
    speaker: poli
    en: Hmm... Is there really nothing we can do?
    ko: 흐응… 어떻게든 안 될까영?
    ja: うーん…何とかなりませんかねぇ？
  d_main_49_03_58:
    speaker: rosanna_op_l
    en: There's no use trying. The Outer Rim is dark, and the streets there are a
      maze.
    ko: 무리야. 아우터 림은 어둡고 길이 마구잡이거든.
    ja: |-
      無理だってば。
      アウターリムは暗いし、入り組んでるから。
  d_main_49_03_59:
    speaker: rosanna_op_l
    en: There's no way to find those who've gone into hiding, intent on dying.
    ko: 죽겠다고 숨은 녀석들을 찾을 방법은 없어.
    ja: |-
      死ぬ覚悟で隠れてる連中なんて
      見つけようがないね。
  d_main_49_03_60:
    speaker: poli
    en: "... I see. Any other issues to report?"
    ko: "…그렇군영. 별다른 문제는 없고영?"
    ja: "…そうですかぁ。他に問題は？"
  d_main_49_03_61:
    speaker: rosanna_op_l
    en: No problems at my shelter. Everyone's silent as the grave.
    ko: |-
      이쪽 쉘터는 문제 없어.
      다들 죽은 듯 조용하네.
    ja: |-
      こっちのシェルターは問題ない。
      みんな死んだみたいに静かだよ。
  d_main_49_03_62:
    speaker: poli
    en: But they're not actually in a grave, right?
    ko: 죽은 듯 맞졍? 그렇졍?
    ja: "「みたいに」ですよね？そうですよねぇ？"
  d_main_49_03_63:
    speaker: rosanna_op_l
    en: Of course not. You worry too much, little White Puppy.
    ko: 맞아맞아. 우리 하얀 강아지가 걱정이 많네.
    ja: そうだって。ワンちゃんは心配性だね。
  d_main_49_03_64:
    speaker: poli
    en: How's it going for everyone else?
    ko: 다른 쪽 분들은 어떤가영?
    ja: 他の方はどうですかぁ？
  d_main_49_03_65:
    speaker: sakura_op_r
    en: My shelter is full too.
    ko: 이쪽도 인원은 모두 채워졌습니다.
    ja: こちらも満員です。
  d_main_49_03_66:
    speaker: sakura_op_r
    en: A few people were causing a disturbance, but we put them in isolation. Other
      than that, there's nothing out of the ordinary.
    ko: 일부 난동을 격하게 부린 이들이 있어, 격리조치한 것 이외에는 특이사항은 없습니다.
    ja: |-
      いくらか激しく暴れる者がおりましたので
      隔離はしてありますが、
      それ以外には事もありません。
  d_main_49_03_67:
    speaker: poli
    en: In isolation? Where...?
    ko: 격리라면 어디로….
    ja: 隔離とは、どこに…
  d_main_49_03_68:
    speaker: sakura_op_r
    en: In the Seimeikai mansion.
    ko: 세이메이카이 자택입니다.
    ja: 清明会の屋敷です。
  d_main_49_03_69:
    speaker: moran_op_c
    en: They'd probably be better off in the rehabilitation center.
    ko: 갱생관이 차라리 낫겠네.
    ja: 更生館のほうがマシだな。
  d_main_49_03_70:
    speaker: sakura_op_r
    en: There's still plenty of room at the mansion, so if anyone causes a disturbance
      in the other shelters, feel free to send them our way.
    ko: |-
      아직 자택에는 여유 공간이 제법 많으니,
      혹여나 다른 쉘터에서 난동을 피우는 자가 있다면 보내주시길.
    ja: |-
      屋敷の方にはまだ空きがありますので、
      もし他のシェルターで手を焼く者が
      おりましたら、こちらへ送ってください。
  d_main_49_03_71:
    speaker: sakura_op_r
    en: We'll give them a warm welcome.
    ko: 극진히 대접하겠습니다.
    ja: 丁重におもてなしいたしますので。
  d_main_49_03_72:
    speaker: poli
    en: Hmm... Okay. Go easy on them.
    ko: 음… 알겠어영. 적당히 해주세영.
    ja: |-
      うーむ…分かりましたぁ。
      ほどほどにしてあげてくださいねぇ。
  d_main_49_03_73:
    speaker: poli
    en: How are things on your end, Moran?
    ko: 목단 쪽은 어떤가영?
    ja: モランの方はどうですかぁ？
  d_main_49_03_74:
    speaker: moran_op_c
    en: Here? It's packed here as well.
    ko: 여기? 여기도 사람은 꽉 찼어.
    ja: こっちか？こっちも人でいっぱいだぞ。
  d_main_49_03_75:
    speaker: moran_op_c
    en: But it's a mess. This place reeks.
    ko: 근데 엉망이야. 냄새 무지하게 난다고.
    ja: |-
      なんてーか、めちゃくちゃだ。
      ものすごい臭いでさ。
  d_main_49_03_76:
    speaker: moran_op_c
    en: The people here got peckish, so they ate some mushrooms they got from who-knows-where,
      and now they're all throwing up and running to the bathroom.
    ko: 아니 이것들이 입이 심심하다고 어디서 주워온 버섯을 먹었는데, 지금 토하고 화장실가고 난리도 아냐.
    ja: |-
      まったくあいつら、口寂しいからって、
      拾ってきたキノコなんか食いやがって、
      吐いたりトイレに駆け込んだりで、大騒ぎだ。
  d_main_49_03_77:
    speaker: moran_op_c
    en: Thank goodness Mary and Pepper are here looking after them. Otherwise, it'd
      be a complete disaster.
    ko: 그 누구냐. 메어리랑 페퍼가 와서 봐주고 있어서 망정이지 엉망진창이야 진짜.
    ja: |-
      なんだっけ…メアリーとペッパーが来て
      診てくれてるからいいようなものの、
      ホントにシッチャカメッチャカだよ。
  d_main_49_03_78:
    speaker: rosanna_op_l
    en: My poor little Darkflower, the Shadow Empress.
    ko: 우리 칠흑여제 다크니스 플라워께서 고생이 많네~
    ja: |-
      漆黒の女帝ダークネスフラワー様も
      ラクじゃないねぇ～
  d_main_49_03_79:
    speaker: sakura_op_r
    en: That's not the sort of thing a wicked mob boss would normally do. You're incredible.
    ko: 악의 여간부가 할법한 일은 아닐텐데도, 대단하십니다.
    ja: |-
      悪の女幹部らしくない行いではありますが、
      実に大したものです。
  d_main_49_03_80:
    speaker: moran_op_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_81:
    speaker: moran_op_c
    en: That's rich coming from you two. You didn't even hesitate to do a swimsuit
      photo shoot for your organizations.
    ko: 뭘. 조직을 위해 수영복 화보도 서슴없이 찍는 둘에 비하면야.
    ja: |-
      いやいや、組織のために
      水着でグラビア撮影なんて平気でやれる
      お前らにゃ、かなわねぇかな～
  d_main_49_03_82:
    speaker: rosanna_op_l
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_83:
    speaker: sakura_op_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_84:
    speaker: moran_op_c
    en: Ugh... They're throwing up again. I'm going to go clean it up. See you later.
    ko: |-
      …아, 쟤 또 토한다. 가서 좀 치울게.
      나중에 봐.
    ja: |-
      …あっ、あいつ、また吐いてやがる。
      ちょっと片づけてこねぇと、またな。
  d_main_49_03_85:
    speaker: poli
    en: All right... Keep up the good work.
    ko: 넹… 수고해주세영.
    ja: はい…お疲れ様ですぅ。
  d_main_49_03_86:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_49_03_87:
    speaker: rosanna_op_l
    en: Ugh. I can practically smell it just from hearing her talk about it.
    ko: 어휴. 말만 들어도 냄새나는걸.
    ja: はぁ…話を聞くだけで臭ってきそうだね。
  d_main_49_03_88:
    speaker: sakura_op_r
    en: It looks like things are peaceful on your end, Rosanna.
    ko: 로산나 쪽은 평온해 보이는군요.
    ja: そちらは穏やかなようですね。
  d_main_49_03_89:
    speaker: rosanna_op_l
    en: Does it seem that way? You have no idea how many people are causing trouble
      in the Ark, do you?
    ko: |-
      그렇게보여?
      지금 방주에 깽판 치고 있는 것들이 얼마나 많은지 모르지?
    ja: |-
      そう見える？
      今、アークを荒らしまわってるヤツらが
      どれだけいるか、想像つかない？
  d_main_49_03_90:
    speaker: rosanna_op_l
    en: There are so many empty homes right now, the thieves are having a field day.
    ko: 지금 빈집 투성이다보니 도둑놈들이 판을 쳐.
    ja: |-
      今は空き家だらけだからって、
      泥棒どもが張り切ってんだよ。
  d_main_49_03_91:
    speaker: rosanna_op_l
    en: Not only that, but they're all getting into fights with each other. It's a
      total mess.
    ko: |-
      그것 뿐일까.
      지들끼리 싸움도 나고 아주 엉망이야.
    ja: |-
      それどころか、
      泥棒同士でケンカまで始める有りさまでさ。
  d_main_49_03_92:
    speaker: rosanna_op_l
    en: I've been running around like crazy knocking them all out.
    ko: 그것들 때려잡는다고 정신 없어.
    ja: ブチのめす手が足りないよ。
  d_main_49_03_93:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_94:
    speaker: rosanna_op_l
    en: Oops. I probably shouldn't have said that in front of our little White Puppy
      here.
    ko: 어이쿠. 하얀 강아지 앞에서 할 말은 아니었나?
    ja: あ…ワンちゃんの前でする話じゃなかった？
  d_main_49_03_95:
    speaker: poli
    en: No, it's fine.
    ko: 아녕. 괜찮아영.
    ja: いえ、お気になさらずぅ。
  d_main_49_03_96:
    speaker: poli
    en: Right now, the entire police force is focused on getting civilians to the
      shelters.
    ko: 지금 방주의 모든 경찰력은 시민 분들을 쉘터로 이동시키는데 집중되고 있어영.
    ja: |-
      住民全員をシェルターへ避難させることに、
      全力を割いていますからねぇ。
  d_main_49_03_97:
    speaker: poli
    en: Even with the rapid response units on hand, there are bound to be gaps in
      maintaining public order.
    ko: 기동타격대 분들이 계신다지만 치안 유지 쪽은 아무래도 구멍이 생길 수밖에 없졍.
    ja: |-
      機動打撃隊の方々がいるとはいっても、
      治安維持のほうはどうしても
      手薄になってしまいますからぁ…
  d_main_49_03_98:
    speaker: poli
    en: It's a huge help having all of you from Underworld Queen here.
    ko: 언더월드 퀸 분들이 도와준다면 큰 도움이 될거예영.
    ja: |-
      アンダーワールドクイーンの皆さんに
      ご協力いただけて、助かりますぅ。
  d_main_49_03_99:
    speaker: poli
    en: Just, um... don't be too rough with them.
    ko: 그… 너무 거칠게만 하지 말아주세영.
    ja: |-
      まぁ…あまり手荒なことは
      しないでくださいねぇ。
  d_main_49_03_100:
    speaker: rosanna_op_l
    en: Relax. Our organizations may have some pretty intimidating names, but we love
      following the law.
    ko: |-
      안심해 안심해.
      우리, 조직이니 뭐니 이름만 거창한거지 합법을 얼마나 좋아하는데.
    ja: |-
      安心しなって。あたしたちも
      組織だなんだってワルぶってるけど、
      合法的なことは大好きだからさ。
  d_main_49_03_101:
    speaker: rosanna_op_l
    en: We won't do anything that'll get us caught. Don't worry.
    ko: 절~대 안 들키게 잘 할테니, 걱정하지 마.
    ja: 絶〜っ対迷惑はかけないって。
  d_main_49_03_102:
    speaker: poli
    en: Ugh...
    ko: 끄응….
    ja: クゥン…
  d_main_49_03_103:
    speaker: sakura_op_r
    en: While we're on the subject, I have something to report from our end as well.
    ko: 말이 나온김에, 저희쪽도 보고드릴게 있습니다.
    ja: その話のついでに、こちらからも報告を。
  d_main_49_03_104:
    speaker: sakura_op_r
    en: There are people currently spreading malicious rumors about the Third Surface
      Reclamation War online.
    ko: 현재 방주의 넷 상에서 지상 탈환전에 대한 악성 루머를 퍼트리고 있는 이들이 있습니다.
    ja: |-
      現在、ネット上で地上奪還戦に関する
      悪質な流言を広めている者たちがいます。
  d_main_49_03_105:
    speaker: sakura_op_r
    en: I'm working with the Protocol Squad to apprehend the culprits.
    ko: 프로토콜 스쿼드와 협력하여 확보하고 있습니다.
    ja: |-
      プロトコール部隊と協力して、
      身柄の確保に動いております。
  d_main_49_03_106:
    speaker: poli
    en: Apprehend them how?
    ko: 확보라면… 어떻게영.
    ja: 確保って…どうするおつもりですかぁ？
  d_main_49_03_107:
    speaker: sakura_op_r
    en: We're moving them to the Seimeikai mansion.
    ko: 세이메이카이 자택으로 이동시키고 있습니다.
    ja: 清明会の屋敷へご案内する予定です。
  d_main_49_03_108:
    speaker: poli
    en: Ugh...!
    ko: 끄으응…!
    ja: クゥゥン…！
  d_main_49_03_109:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_110:
    speaker: poli
    en: I can't really complain, given the current situation.
    ko: 지금 상황에 이것저것 다 따질 순 없겠졍.
    ja: こんな状況では、何も言えませんねぇ。
  d_main_49_03_111:
    speaker: poli
    en: I'm grateful that you're taking charge of the shelters for the Outer Rim folks
      and taking care of security across the entire Ark, too.
    ko: 아우터 림 분들의 쉘터를 담당해 주고 계신것만해도 감사한뎅, 방주 전반의 치안까지 챙겨주셔서 감사해영.
    ja: |-
      アウターリムの住民の避難誘導だけでも
      大変なところ、アーク全体の治安維持まで
      手を貸していただけるなんて…
  d_main_49_03_112:
    speaker: poli
    en: To be honest, I was concerned when you offered to help, but I guess I was
      worrying for nothing.
    ko: 솔직히 협력해주신다고 했을 때 많이 걱정했는뎅, 기우였던 것 같네영.
    ja: |-
      正直、協力の申し出と聞いた時は
      とても心配していたのですが、
      その必要はなかったようですねぇ。
  d_main_49_03_113:
    speaker: poli
    en: I won't forget this, and I'll be sure to report this to my superiors.
    ko: 이 일은, 잊지 않고 반드시 상부에 보고하겠습니당.
    ja: このことは上にも忘れず伝えておきますぅ。
  d_main_49_03_114:
    speaker: rosanna_op_l
    en: Aww, just having our little White Puppy remember what we're done is more than
      enough.
    ko: 뭘~ 나는 우리 하얀 강아지만 기억해줘도 되는걸.
    ja: |-
      いいっていいって～
      ワンちゃんの胸の内に
      置いといてくれれば十分だから。
  d_main_49_03_115:
    speaker: sakura_op_r
    en: I'm merely doing what must be done.
    ko: 응당 해야 할 일을 할 뿐입니다.
    ja: 当然のことをしているまでです。
  d_main_49_03_116:
    speaker: poli
    en: Thank you for your cooperation! Talk to you in another three hours!
    ko: |-
      협조에 감사드립니당!
      그럼 또 3시간 뒤에 뵙졍!
    ja: |-
      ともあれ、ご協力感謝しますぅ！
      また3時間後に何かあれば！
  d_main_49_03_117:
    speaker: rosanna_op_l
    en: Don't mention it. Getting to work with the police? Now that's a real privilege.
    ko: 별말씀을. 우리야 말로 경찰과 협력이라니, 호사도 이런 호사가 없지 뭐야.
    ja: |-
      とんでもない。
      警察サンと共同作業なんて、
      二度とできないゼータクだからね。
  d_main_49_03_118:
    speaker: rosanna_op_l
    en: Well then, take care!
    ko: 그럼, 수고해~
    ja: じゃ、また後で〜
  d_main_49_03_119:
    speaker: sakura_op_r
    en: Keep up the good work.
    ko: 수고하십시오.
    ja: 失礼いたします。
  d_main_49_03_120:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_49_03_121:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_03_122:
    speaker: "<Narration>"
    en: Poli looks around the shelter.
    ko: 폴리가 쉘터의 모습을 빤히 바라본다.
    ja: ポリはシェルターの様子を静かに眺めた
  d_main_49_03_123:
    speaker: "<Narration>"
    en: She's surrounded by countless people amid chaos that shows no sign of calming
      down.
    ko: 수많은 사람들. 진정되지 않는 혼란.
    ja: 数えきれない群衆、収まらない混乱
  d_main_49_03_124:
    speaker: "<Narration>"
    en: Still, this chaos will pale in comparison to what's coming.
    ko: 하지만 이 혼란은 아무것도 아닐 것이다.
    ja: だが、この程度はまだ序の口だろう
  d_main_49_03_125:
    speaker: "<Narration>"
    en: The moment they ascend to the surface, an even greater wave of chaos will
      undoubtedly descend upon the Ark.
    ko: 지상으로 올라가는 순간, 더욱 큰 혼란이 방주를 덮칠 것이 분명하다.
    ja: |-
      地表への浮上が始まれば、
      今以上の大混乱が起こることは疑うまでもない
  d_main_49_03_126:
    speaker: poli
    en: Ugh...
    ko: "…끄응."
    ja: "…クゥン…"
  d_main_49_03_127:
    speaker: "<Narration>"
    en: Still, she has to do her job.
    ko: 그래도, 할일을 해야 한다.
    ja: それでも、やるべきことをやらねば
  d_main_49_03_128:
    speaker: "<Narration>"
    en: Poli tugs her hat down,
    ko: 폴리는 모자를 눌러쓴다.
    ja: ポリは帽子を深くかぶり直し…
  d_main_49_03_129:
    speaker: "<Narration>"
    en: then she shouts loudly.
    ko: 그리고 크게 외친다.
    ja: 大きく声を張り上げた
  d_main_49_03_130:
    speaker: poli
    en: You there! Don't jump off of that!
    ko: 거기! 점프해서 내려오지 마세영!
    ja: そこ！飛び降りは危ないですよん！
d_main_49_04:
  d_main_49_04_1:
    speaker: "<Narration>"
    en: The Goddess of Victory statue advances.
    ko: 여신상은 전진한다.
    ja: 女神像は止まる気配を見せない
  d_main_49_04_2:
    speaker: "<Narration>"
    en: It moves forward with a single-minded focus.
    ko: 그저 전진만 하고 있을 뿐이다.
    ja: わき目も振らずに前へと進んでいる
  d_main_49_04_3:
    speaker: "<Narration>"
    en: Because of its overwhelming size, regenerative abilities, and defensive capabilities,
      our attacks have been fruitless.
    ko: 압도적인 크기, 재생 능력, 방어 체계로 인해 우리의 공격은 아무런 성과도 내지 못한다.
    ja: |-
      圧倒的な巨体、再生能力、防御システムが、
      こちらの攻撃の一切を弾き続けている
  d_main_49_04_4:
    speaker: "<Self>"
    en: "... Should I spray some blood on it?"
    ko: "…피를 뿌려볼까?"
    ja: "…血でもかけてみるか？"
  d_main_49_04_5:
    speaker: behemoth
    en: That's not a good idea. Did you forget doing that caused me to transform?
    ko: |-
      좋은 생각이 아니야.
      나 거대화 시켜준 거 잊었어?
    ja: |-
      いい考えとは言えないな。
      あたしがどうなったか忘れたか？
  d_main_49_04_6:
    speaker: rapi_red
    en: Then again, it might get downgraded to something like mecha Leviathan.
    ko: 반대로, 메카 레비아탄 같은걸로 마이너 그레이드 될지도 모르지.
    ja: |-
      いつかのメカレヴィアタンみたいになる
      可能性もあるわ。
  d_main_49_04_7:
    speaker: leviathan
    en: I told you not to call me that!
    ko: 너 그렇게 부르지 말랬지!
    ja: その呼び方はやめてって言ったでしょ！
  d_main_49_04_8:
    speaker: ziz
    en: L-let's transform and try to stop it.
    ko: 거, 거대화로 막아보자.
    ja: きょ、巨大化して止めてみる？
  d_main_49_04_9:
    speaker: ziz
    en: If we all transform and try to stop it, do you think it'll react somehow?
    ko: 다 같이 거대화 해서 막아서면, 저것도 뭔가 반응하지 않을까?
    ja: |-
      みんなで一斉にやったら、
      さすがに何か反応するんじゃない？
  d_main_49_04_10:
    speaker: rapunzel_s
    en: Wow, you know how to transform, too?
    ko: 와. 거대화도 할 줄 아시는군요?
    ja: あら。そんなことまでできるのですか？
  d_main_49_04_11:
    speaker: hongryeon_g
    en: Four Heretics versed in the art of transformation. my Lord truly doth know
      how to make an ally of anyone.
    ko: |-
      거대화가 가능한 헬레틱 낭자들이라.
      도령은 정말 아무나 다 동료로 만들고 보는군.
    ja: |-
      巨大化能力のあるヘレティックまで…
      ぼっちゃんは本当に見境なく
      仲間に引き入れているようだねぇ。
  d_main_49_04_12:
    speaker: snowwhite_h
    en: Save it. We don't know what's inside that thing.
    ko: 아껴둬라. 저 안에 뭐가 있을지 모른다.
    ja: |-
      温存しておけ。
      まだ中に何を隠しているか分かっていない。
  d_main_49_04_13:
    speaker: behemoth
    en: Still, I don't think it's a good idea to just let that thing keep moving unchecked.
    ko: 그렇다고 지금 저걸 그대로 가게 놔두는 건 좋은 생각이 아닌 것 같은데.
    ja: |-
      だからって、このまま黙って行かせるのも
      いい考えとは思えないけど？
  d_main_49_04_14:
    speaker: anis_i_w
    en: But why does that thing keep moving forward?
    ko: 그런데 저거, 왜 자꾸 전진하는거야?
    ja: |-
      そもそもあれって
      なんでこっちを無視して進んでるの？
  d_main_49_04_15:
    speaker: neon_v_w
    en: Worst-case scenario, it may be trying to get within range to attack the Ark.
    ko: 최악의 경우, 방주에 공격이 가능한 사거리를 확보하려는 것일지도 모르죠.
    ja: |-
      とにかくアークを攻撃できる射程に
      入れたいということでしょうか。
  d_main_49_04_16:
    speaker: anis_i_w
    en: Don't say that. Your words somehow always end up coming true—
    ko: 너, 그런말 하지마. 네 말은 묘하게 잘 맞는단 말이-
    ja: |-
      ちょっと、やめてよ。
      あんたがそういうこと言うと、たいてい…
  d_main_49_04_17:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠우우우….
    ja: ズン…
  d_main_49_04_18:
    speaker: "<Narration>"
    en: "... The statue comes to a halt."
    ko: "…전진하던 여신상이 멈춰선다."
    ja: "…女神像が突然動きを止めた"
  d_main_49_04_19:
    speaker: "<Narration>"
    en: The constant vibration suddenly ceases, leaving an eerie sense of stillness.
    ko: 계속되던 진동이 갑자기 멎어 감각에 이질감이 든다.
    ja: |-
      断続的な地響きがなくなり、
      身体がかえって妙な違和感を覚える
  d_main_49_04_20:
    speaker: anis_i_w
    en: "... What the heck?"
    ko: "…뭐야."
    ja: "…どうしたのかしら。"
  d_main_49_04_21:
    speaker: snowwhite_h
    en: It stopped. Now's our chance to attack—
    ko: 멈췄다. 이 기회에 공격을-
    ja: 止まったな。この隙に攻撃を――
  d_main_49_04_22:
    speaker: hongryeon_g
    en: "... Stay thy hand. Something doth not sit right."
    ko: "…기다리게. 뭔가 심상찮네."
    ja: "…待て。何やら様子がおかしい。"
  d_main_49_04_23:
    speaker: rapunzel_s
    en: The air is vibrating.
    ko: "…대기가 진동하고 있어요."
    ja: "…大気が振動しています。"
  d_main_49_04_24:
    speaker: "<Narration>"
    en: "*Screeeeeech*"
    ko: 키이이이이잉---!!
    ja: キーン――
  d_main_49_04_25:
    speaker: "<Narration>"
    en: With a piercing noise, the sky turns red.
    ko: 굉음과 함께 하늘이 붉게 물든다.
    ja: 轟音とともに空が赤く染まった
  d_main_49_04_26:
    speaker: "<Narration>"
    en: No... the red light at the very top of the statue is gathering.
    ko: "…아니, 여신상의 최상단에 붉은 빛이 모여들고 있다."
    ja: "…いや、女神像の頂点が赤く輝いている"
  d_main_49_04_27:
    speaker: "<Narration>"
    en: The light grows stronger, and the screeching grows louder.
    ko: 그 빛은 더욱더 짙어지고, 굉음은 더욱 커진다.
    ja: 光と音は次第に強くなった
  d_main_49_04_28:
    speaker: "<Narration>"
    en: As the ground shakes, I look up toward the sky.
    ko: 지면이 흔들린다. 나는 하늘을 올려다본다.
    ja: 大地が揺らぎ、私は空をにらんだ
  d_main_49_04_29:
    speaker: "<Narration>"
    en: The clouds that once filled the sky above the statue disperse.
    ko: "…여신상 위, 하늘을 가득 채우고 있던 구름이 모두 흩어진다."
    ja: |-
      …女神像の上方、
      空一面にあった雲が散っていく
  d_main_49_04_30:
    speaker: anis_i_w
    en: Hang on...
    ko: "…잠깐."
    ja: "…ちょっと待って…"
  d_main_49_04_31:
    speaker: rapi_red
    en: Everyone! Flash incoming!
    ko: 전원! 대섬광방어!
    ja: 総員！対閃光防御を！
  d_main_49_04_32:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 빠직!
    ja: バン！
  d_main_49_04_33:
    speaker: "<Narration>"
    en: A sharp crack echoes as the entire area trembles.
    ko: 파열음과 함께 일대가 진동한다.
    ja: 何かが弾けるような音とともに、天地が揺れた
  d_main_49_04_34:
    speaker: "<Narration>"
    en: The shockwaves send me flying.
    ko: 충격파에 의해 몸이 날아간다.
    ja: 衝撃波に耐えられず、身体が吹き飛ぶ
  d_main_49_04_35:
    speaker: "<Narration>"
    en: As I fly through the air...
    ko: 날아가는 중, 눈에 보인 것은-
    ja: めまぐるしく動く視界の中で、見えたものは…
  d_main_49_04_36:
    speaker: "<Narration>"
    en: The world is bathed entirely in red.
    ko: 온통 붉은 빛으로 물든 세상과
    ja: 一面の赤、そして
  d_main_49_04_37:
    speaker: "<Narration>"
    en: Shooting straight out from the top of the statue...
    ko: 여신상의 상부에서 정면으로 뻗어나가는
    ja: 女神像の頂から正面に向かって放たれた…
  d_main_49_04_38:
    speaker: "<Narration>"
    en: is an enormous beam of light.
    ko: 압도적인 크기의 광선이다.
    ja: あまりにも巨大な光の束だ
  d_main_49_04_39:
    speaker: rapi_red
    en: It's pointing toward the Ark!
    ko: |-
      !!
      방주 방향이다!
    ja: |-
      ！！
      アークの方角！
  d_main_49_04_40:
    speaker: anis_i_w
    en: N-no!
    ko: 아, 안 돼!!
    ja: ダ、ダメ！！
  d_main_49_04_41:
    speaker: snowwhite_h
    en: Damn it...!
    ko: 젠장…!!
    ja: くっ…！！
  d_main_49_04_42:
    speaker: enikk_op_l
    en: Extremely high-energy signature detected. It's approaching the Ark at incredible
      speed.
    ko: |-
      초 고에너지 반응.
      방주 방향으로 초고속으로 접근 중.
    ja: |-
      超高エネルギー反応を確認、
      アークに向かって高速で飛来しています。
  d_main_49_04_43:
    speaker: burningum
    en: "... What?"
    ko: "…뭐?"
    ja: "…何？"
  d_main_49_04_44:
    speaker: enikk_op_l
    en: It's likely a beam weapon fired from the giant object.
    ko: 거대 물체에서 발사된 빔 병기로 추정.
    ja: 巨大物体からのビーム兵器による攻撃と推定。
  d_main_49_04_45:
    speaker: burningum
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_49_04_46:
    speaker: "<Narration>"
    en: After fending off successive attacks from Annihilio and the Raptures, Matis
      and the Ark Rangers were taking some time to regroup and perform maintenance.
    ko: 연이은 애니힐리오의 공격과 랩쳐 부대를 막아낸 메티스와 아크레인저는 정비 시간을 가지고 있었다.
    ja: |-
      その頃、メティスとアークレンジャーは
      アニヒリオとラプチャーの波状攻撃を防ぎ
      整備の時間を取っていた
  d_main_49_04_47:
    speaker: maxwell_p
    en: How's everyone holding up?
    ko: 다들. 상태는 어때?
    ja: みんな、コンディションは？
  d_main_49_04_48:
    speaker: laplace_p
    en: No problems here!
    ko: 문제 없다!
    ja: 問題ない！
  d_main_49_04_49:
    speaker: drake_p
    en: Annihilio, was it? I'm starting to get the hang of fighting this thing.
    ko: |-
      애니힐리오라고 했나?
      점점 상대하기에 익숙해지고 있다.
    ja: |-
      アニヒリオと言ったか？
      そろそろ慣れてきたな。
  d_main_49_04_50:
    speaker: drake_p
    en: Hehehe. It's just a missile. It's no match for a villain.
    ko: |-
      후후후. 결국, 미사일일 뿐이다.
      빌런의 손에 걸리면 아무것도 아니지.
    ja: |-
      ククク…所詮はただのミサイルだ。
      ヴィランの手にかかれば、
      どうということはない。
  d_main_49_04_51:
    speaker: arkrangerblack
    en: "... Was Dorothy the only one aboard the Wings of Victory?"
    ko: "…승리의 날개 호에 탑승하고 있던 건 도로시 혼자였나?"
    ja: |-
      …勝利の翼号で戦っていたのは、
      ドロシーだけか？
  d_main_49_04_52:
    speaker: red
    en: I think so.
    ko: 그럴걸?
    ja: そうじゃないか？
  d_main_49_04_53:
    speaker: red
    en: I guess that means she took down Annihilio twice on her own now.
    ko: 그 말은, 혼자서 애니힐리오를 두 번이나 격추했다는 얘기겠지.
    ja: |-
      だとすると、ひとりでアニヒリオを
      2回も落としたってことになるのか。
  d_main_49_04_54:
    speaker: arkrangerblack
    en: "... Incredible. The Goddess Squad really lives up to its name."
    ko: "…대단해. 역시 갓데스인가."
    ja: "…すごいな。さすがはゴッデスだ。"
  d_main_49_04_55:
    speaker: blue
    en: By the way, I haven't seen the Wings of Victory for a while now.
    ko: 그러고보니 얼마 전부터 승리의 날개 호가 보이지 않네요?
    ja: |-
      そういえば、少し前から
      勝利の翼号が見えませんね？
  d_main_49_04_56:
    speaker: maxwell_p
    en: Well... it's probably off for maintenance or resupply.
    ko: 뭐… 정비하거나 보급하러 갔겠지.
    ja: ああ…整備か補給に戻ったんじゃないかな。
  d_main_49_04_57:
    speaker: maxwell_p
    en: You don't exactly see an aircraft carrier that size flying through the air
      every day.
    ko: 그만한 크기의 함선이 하늘을 날아다니는 건 보통 일이 아닐 테니까.
    ja: |-
      あんな大きさの船が空を飛び回るなんて、
      そうとう大変なことだろうし。
  d_main_49_04_58:
    speaker: blue
    en: Well, that's a relief. I was worried something might've happened to it.
    ko: |-
      그렇다면 다행이겠네요.
      전 또, 무슨 일이라도 생겼을까봐 걱정했거든요.
    ja: |-
      それならよかったです。
      何かあったのかと心配だったので。
  d_main_49_04_59:
    speaker: laplace_p
    en: Put your faith in Dorothy! She's super strong!
    ko: 도로시는 믿을 수 있다! 아주 강하지!
    ja: ドロシーなら心配ない！ものすごく強いんだ！
  d_main_49_04_60:
    speaker: drake_p
    en: Hmph. All that strength means nothing against my villain power...
    ko: 흥. 그래봤자 나의 빌런 파워 앞에서는….
    ja: |-
      フン。そうは言っても、
      私のヴィランパワーの前では…
  d_main_49_04_61:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_62:
    speaker: drake_p
    en: Huh?
    ko: 뭐지.
    ja: 何だ？
  d_main_49_04_63:
    speaker: maxwell_p
    en: What's wrong?
    ko: 왜 그래?
    ja: どうしたの？
  d_main_49_04_64:
    speaker: drake_p
    en: Something tingles... No, it stings.
    ko: 찌릿찌릿… 아니. 따끔따끔하다.
    ja: ビリビリ…いや、チクチクする。
  d_main_49_04_65:
    speaker: "<Narration>"
    en: Drake abruptly turns to look at the distant horizon.
    ko: 드레이크가 고개를 획 틀어 저 멀리 지평선을 바라본다.
    ja: |-
      ドレイクが勢いよく振り向き、
      地平線の彼方に目を向けた
  d_main_49_04_66:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_67:
    speaker: maxwell_p
    en: Wh-what's gotten into you? You're freaking me out. Don't start acting all
      weird.
    ko: 왜, 왜이래 무섭게. 안 하던 짓 좀 하지마 너.
    ja: |-
      な、何なの急に、怖いじゃない。
      そういうガラにもないことは…
  d_main_49_04_68:
    speaker: drake_p
    en: "... Duck."
    ko: "…숙여라."
    ja: "…伏せろ。"
  d_main_49_04_69:
    speaker: blue
    en: "... What?"
    ko: "…예?"
    ja: "…え？"
  d_main_49_04_70:
    speaker: drake_p
    en: Duck! Take cover!
    ko: 숙여라! 몸을 보호해라!
    ja: 伏せろ！身を守れ！
  d_main_49_04_71:
    speaker: red
    en: What is it? What's going—
    ko: 뭐야. 무슨 일…!
    ja: はぁ？何だ急に…
  d_main_49_04_72:
    speaker: "<Narration>"
    en: The horizon suddenly turns red.
    ko: 지평선이 갑자기 붉게 물든다.
    ja: なんの予兆もなく、地平線が赤く光った
  d_main_49_04_73:
    speaker: "<Narration>"
    en: The crimson hue deepens, soon engulfing the entire area.
    ko: 점점 짙어지는 붉은색은 곧, 일대를 붉게 물들인다.
    ja: |-
      赤い光は次第に強くなり、
      たちまち周囲が一色に染まった
  d_main_49_04_74:
    speaker: "<Narration>"
    en: Before long, the ground and air begin to vibrate.
    ko: 이윽고, 지면과 공기가 진동한다.
    ja: 地面と大気が震え始める
  d_main_49_04_75:
    speaker: laplace_p
    en: "... What in the world?"
    ko: "…뭐냐."
    ja: "…何だ？"
  d_main_49_04_76:
    speaker: drake_p
    en: Ugh...!
    ko: 이익…!
    ja: くっ…！
  d_main_49_04_77:
    speaker: "<Narration>"
    en: Drake springs into action, forcing everyone to the ground.
    ko: 드레이크가 빠르게 움직여 모두를 바닥에 엎드리게 한다.
    ja: ドレイクが素早く全員を床に倒した
  d_main_49_04_78:
    speaker: drake_p
    en: Don't lift your heads! Brace for impact!
    ko: 고개 들지 마라! 충격에 대비해라!
    ja: 顔を上げるな！衝撃に備えろ！
  d_main_49_04_79:
    speaker: maxwell_p
    en: What the hell is going on?!
    ko: 뭔데! 뭔데 대체!
    ja: 何！？どういうこと！？
  d_main_49_04_80:
    speaker: "<Narration>"
    en: With a deafening explosion,
    ko: 귀가 멀어버릴 것 같은 굉음.
    ja: 聴覚が消しとぶ轟音
  d_main_49_04_81:
    speaker: "<Narration>"
    en: the ground trembles violently.
    ko: 요동치는 지면.
    ja: 追い討ちをかける激しい地響き
  d_main_49_04_82:
    speaker: "<Narration>"
    en: Everyone on the ground fixes their eyes on the same spot.
    ko: 바닥에 엎드린 모두의 시선이 한 곳에 고정된다.
    ja: |-
      伏せたままかろうじて上に向けられた
      全ての目が、ただ一つのものに釘付けになった
  d_main_49_04_83:
    speaker: "<Narration>"
    en: An enormous beam of red light races past, as if trying to split the world
      in two.
    ko: 거대한 붉은색의 빛줄기가, 세상을 양분하듯 질주하고 있었다.
    ja: 世界を二つに分けるかのように伸びた、光の線だ
  d_main_49_04_84:
    speaker: "<Narration>"
    en: "*Rooooooar!*"
    ko: 쿠우우우우우---!!
    ja: ゴゴゴ――
  d_main_49_04_85:
    speaker: "<Narration>"
    en: With a tremendous roar, the entire Ark shakes violently.
    ko: 거대한 굉음과 함께 방주 전체가 격렬하게 진동한다.
    ja: |-
      すさまじい音とともに、
      アーク全体が激しく揺れた
  d_main_49_04_86:
    speaker: "<Narration>"
    en: It's an earthquake of unprecedented magnitude.
    ko: 지금까지 없었던 큰 규모의 지진.
    ja: |-
      誰もが経験したことのない規模の
      大地震がアークを襲う
  d_main_49_04_87:
    speaker: "<Narration>"
    en: Buildings' windows shatter, and floor tiles buck and shift.
    ko: 건물의 유리창이 부서지고, 바닥 타일이 들썩인다.
    ja: |-
      あらゆる建物の窓ガラスが割れ、
      床や路面のタイルが浮き上がる
  d_main_49_04_88:
    speaker: "<Narration>"
    en: Weaker buildings lose their structural integrity and collapse.
    ko: 강도가 약한 건물은 축을 잃고 무너진다.
    ja: |-
      強度の低い建物はおもちゃのように揺れ、
      倒壊した
  d_main_49_04_89:
    speaker: "<Narration>"
    en: That shock makes its way down to the shelters as well.
    ko: 그 충격은 쉘터에도 고스란히 전달된다.
    ja: その衝撃はシェルターにも伝わる
  d_main_49_04_90:
    speaker: "<Narration>"
    en: Somebody screams upon feeling the sudden tremors.
    ko: 갑작스러운 진동을 느낀 누군가가 비명을 내지른다.
    ja: 突然の揺れに、誰かが悲鳴を上げた
  d_main_49_04_91:
    speaker: "<Narration>"
    en: The terror is infectious, and soon the shelters are reduced to pandemonium.
    ko: 공포는 전염되어 쉘터 내부는 삽시간에 아비규환이 된다.
    ja: |-
      恐怖は伝染し、シェルターの群衆の間で
      たちまち大混乱が巻き起こる
  d_main_49_04_92:
    speaker: "<Narration>"
    en: However, nobody attempts to run to the shelter entrance.
    ko: 하지만 그 누구도 쉘터의 입구를 향해 달려들지 않는다.
    ja: |-
      それでも、シェルターの入り口へ
      人々が押し寄せることはなかった
  d_main_49_04_93:
    speaker: "<Narration>"
    en: They all remember what happened to those who ran outside the shelters during
      the terrorist attack on the Ark.
    ko: 방주 테러 때, 쉘터 밖으로 나간 이들이 어떻게 되었는지 모두가 잘 알고 있다.
    ja: |-
      アークテロ事件の折、
      シェルターから飛び出した者たちの末路を、
      誰もがよく覚えていたからだ
  d_main_49_04_94:
    speaker: "<Narration>"
    en: People simply huddle under the flickering lights,
    ko: 깜빡거리는 조명의 빛을 받으며, 사람들은 그저 몸을 웅크린다.
    ja: |-
      点滅する照明の下で、
      人々はただ、震えあがった
  d_main_49_04_95:
    speaker: "<Narration>"
    en: praying there won't be another.
    ko: 부디, 다음은 없기를 바라며.
    ja: |-
      できることは、今の揺れが最後であれと
      祈るのみだ
  d_main_49_04_96:
    speaker: burningum
    en: Ugh...!
    ko: "…크으…!"
    ja: "…くっ…！"
  d_main_49_04_97:
    speaker: burningum
    en: Enikk! Situation report!
    ko: 에닉! 상황을 보고해라!
    ja: エニック！状況報告を！
  d_main_49_04_98:
    speaker: enikk_op_l
    en: The attack missed by two kilometers.
    ko: 2km의 차이로 빗나갔습니다.
    ja: |-
      攻撃はアークに命中せず。
      着弾誤差、およそ2km。
  d_main_49_04_99:
    speaker: burningum
    en: Two kilometers? And yet the shaking was that strong?
    ko: 2km? 그 정도인데도 이런 진동이 일어난다고?
    ja: |-
      2km？それだけ離れていて、
      これほどの揺れが起きたというのか？
  d_main_49_04_100:
    speaker: enikk_op_l
    en: I'm pulling up the situation on the surface on-screen now.
    ko: 지상의 상황을 화면에 출력하겠습니다.
    ja: 地上の状況をモニターに表示します。
  d_main_49_04_101:
    speaker: "<Narration>"
    en: Burningum watches the surface feed on the screen.
    ko: 화면에 출력된 지상의 상황을 버닝엄이 바라본다.
    ja: |-
      画面に表示された地上の様子を見る
      バーニンガムは、眉をひそめた
  d_main_49_04_102:
    speaker: burningum
    en: What is that thing? Was there something like that near the Ark?
    ko: "…뭔가 이건. 이런게 방주 근처에 있었던가?"
    ja: |-
      …何だ、これは…
      こんな場所がアーク付近に存在したか？
  d_main_49_04_103:
    speaker: enikk_op_l
    en: It's a mountain.
    ko: 산입니다.
    ja: 山地です。
  d_main_49_04_104:
    speaker: enikk_op_l
    en: Correction. It was a mountain.
    ko: 정정. 산이었던 것입니다.
    ja: 訂正…正確には、山地が存在した場所です。
  d_main_49_04_105:
    speaker: burningum
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_04_106:
    speaker: burningum
    en: You mean... that attack did this to a mountain?
    ko: 산을… 이렇게 만들었단 말인가? 그 공격이?
    ja: |-
      山ひとつ…消し飛んだというのか？
      今の攻撃で？
  d_main_49_04_107:
    speaker: enikk_op_l
    en: That's correct.
    ko: 그렇습니다.
    ja: その通りです。
  d_main_49_04_108:
    speaker: burningum
    en: That's absurd... A single entity couldn't possibly do something like that.
    ko: 말도 안 되는… 이런 걸 단독 개체가 사용할 수는 없어.
    ja: |-
      信じられん…
      単独運用できるような代物ではないぞ。
  d_main_49_04_109:
    speaker: enikk_op_l
    en: The entity in question is the Queen.
    ko: 상대는 퀸입니다.
    ja: クイーンの攻撃であると推測します。
  d_main_49_04_110:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_111:
    speaker: enikk_op_l
    en: It's an ultra-long-range shot. The first attack missed.
    ko: |-
      초장거리 저격입니다.
      초탄은 빗나갔으나.
    ja: |-
      超長距離からの狙撃を行い、
      初弾を外したものと考えられます。
  d_main_49_04_112:
    speaker: enikk_op_l
    en: I'm certain the next attack will hit its mark.
    ko: 다음엔 직격 코스로 올것이라 확신합니다.
    ja: 次弾では誤差が修正され、直撃する予想です。
  d_main_49_04_113:
    speaker: burningum
    en: Can we intercept it?
    ko: 막을 수 있나?
    ja: 防げるか？
  d_main_49_04_114:
    speaker: enikk_op_l
    en: That won't be possible.
    ko: 불가능합니다.
    ja: 迎撃手段は存在しません。
  d_main_49_04_115:
    speaker: burningum
    en: When do you think the next attack will come?
    ko: "…다음 공격은 언제 올 것이라 예상하지?"
    ja: "…次の攻撃までの猶予は？"
  d_main_49_04_116:
    speaker: enikk_op_l
    en: There's no way of knowing.
    ko: 알 수 없습니다.
    ja: 不明です。
  d_main_49_04_117:
    speaker: enikk_op_l
    en: We're trying to establish communications with the region, but heavy jamming
      is preventing us from doing so.
    ko: |-
      해당 지역으로의 광역 통신을 시도하고 있으나,
      강력한 재밍에 의해 통신 불가 상태입니다.
    ja: |-
      エリア周辺への広域通信が
      強力なジャミングにより妨害されています。
  d_main_49_04_118:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_119:
    speaker: burningum
    en: Initiate the Ark's ascent sequence immediately.
    ko: 지금 당장 방주 부상 시퀀스를 진행해줘.
    ja: ただちに浮上シークエンスの開始を。
  d_main_49_04_120:
    speaker: burningum
    en: If we're going to get hit by that thing again, we're better off taking the
      hit on the surface.
    ko: |-
      저런거에 한번 더 당한다고 친다면,
      지상에서 당하는 편이 나아.
    ja: |-
      もう一度来ることが避けられないなら、
      地上へ出た方がマシだ。
  d_main_49_04_121:
    speaker: burningum
    en: None of us would survive it underground.
    ko: 지하에서는 아무도 살아남지 못할테니까.
    ja: 動かずにいれば、全員生き埋めで終わる。
  d_main_49_04_122:
    speaker: enikk_op_l
    en: Understood.
    ko: 알겠습니다.
    ja: 承知しました。
  d_main_49_04_123:
    speaker: burningum
    en: Are there any forces we can immediately send to the surface, aside from those
      already stationed there?
    ko: 지상에서 대기중인 병력 외에, 지금 당장 위로 올릴 수 있는 병력은?
    ja: |-
      すでに地上で待機している部隊の他に、
      今すぐ地上へ投入できる戦力は？
  d_main_49_04_124:
    speaker: enikk_op_l
    en: No. Most of the elevators have already been dismantled.
    ko: 없습니다. 엘리베이터의 철거가 대부분 완료되었습니다.
    ja: |-
      ありません。エレベーターは
      ほぼ撤去完了しています。
  d_main_49_04_125:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_126:
    speaker: burningum
    en: Expedite the ascent as much as possible.
    ko: 부상을 최대한 서둘러줘.
    ja: 浮上をできる限り急いでくれ。
  d_main_49_04_127:
    speaker: enikk_op_l
    en: Understood.
    ko: 예.
    ja: 承知しました。
  d_main_49_04_128:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  d_main_49_04_129:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_130:
    speaker: burningum
    en: "*Sigh*"
    ko: "…하아."
    ja: "…はぁ…"
  d_main_49_04_131:
    speaker: burningum
    en: This isn't how I wanted the ascent to go.
    ko: 이런 식으로 올라가고 싶진 않았는데.
    ja: こんな形にはしたくなかったが…
  d_main_49_04_132:
    speaker: "<Narration>"
    en: We witness light erupting beyond the horizon.
    ko: 지평선 너머에서 빛이 터져나온 것을 목격했다.
    ja: 地平線の彼方に光が消えた
  d_main_49_04_133:
    speaker: "<Narration>"
    en: A massive tremor causes shockwaves to ripple all the way to us.
    ko: 거대한 진동, 이곳까지 스쳐지나가는 충격파.
    ja: |-
      その果てで起こったのであろう
      巨大な振動と衝撃が、ここにいても伝わってくる
  d_main_49_04_134:
    speaker: "<Narration>"
    en: A sense of foreboding slowly creeps over the group.
    ko: 불길한 예감이 스멀스멀 기어오른다.
    ja: 不安が胸からにじむようにこみ上げた
  d_main_49_04_135:
    speaker: hongryeon_g
    en: What utter absurdity...!
    ko: 이런 터무니없는…!
    ja: こんな、馬鹿な…！
  d_main_49_04_136:
    speaker: behemoth
    en: "... This is insane. What in the world was that?"
    ko: "…미쳤네. 이게 뭐야."
    ja: "…イカれてんなぁ、何なんだ、あれ…"
  d_main_49_04_137:
    speaker: snowwhite_h
    en: The Queen...!
    ko: 퀸…!!
    ja: クイーン…！！
  d_main_49_04_138:
    speaker: anis_i_w
    en: D-don't tell me...
    ko: 아, 아니겠지?
    ja: ち、違うよね？
  d_main_49_04_139:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_140:
    speaker: anis_i_w
    en: It can't be. D-don't tell me the Ark was destroyed!
    ko: 아니겠지? 응? 바, 방주가 끝장났다거나 이런거 아니겠지?
    ja: |-
      違うわよね？ねぇ？ア、アークが
      終わったなんて、そんなこと…
  d_main_49_04_141:
    speaker: rapi_red
    en: It'll... it'll be fine. Don't worry.
    ko: 괜찮… 을거야. 걱정하지마.
    ja: 大丈夫よ…心配しないで。
  d_main_49_04_142:
    speaker: anis_i_w
    en: H-how would you even know...?
    ko: 어, 어떻게 아는데….
    ja: な、なんで分かるのよ…
  d_main_49_04_143:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_144:
    speaker: anis_i_w
    en: C-Commander!
    ko: 지, 지휘관님…!
    ja: し、指揮官様…！
  d_main_49_04_145:
    speaker: "<Narration>"
    en: Anis looks at me before turning her head toward the statue.
    ko: 아니스가 나를 바라본다. 고개를 돌린다. 여신상을 바라본다.
    ja: |-
      アニスがすがるように目を向けてくる。
      私は振り返り、女神像の様子をうかがった
  d_main_49_04_146:
    speaker: "<Narration>"
    en: It appears completely still...
    ko: 미동도 하지 않는 것처럼 보이지만….
    ja: 一見、止まったままのようにも見えたが…
  d_main_49_04_147:
    speaker: "<Narration>"
    en: but it's moving ever so slightly.
    ko: 조금씩 움직이고 있다.
    ja: わずかに姿勢を変えつつある
  d_main_49_04_148:
    speaker: "<Self>"
    en: "... No! The Ark is okay!"
    ko: "…아니야! 방주는 괜찮아!"
    ja: "…いや！アークは無事だ！"
  d_main_49_04_149:
    speaker: anis_i_w
    en: Like I said, how would you even know that...?!
    ko: 그러니까 그걸 어떻게 아냐고…!
    ja: だから、どうして…！
  d_main_49_04_150:
    speaker: "<Self>"
    en: The statue is repositioning itself! It's obviously correcting its trajectory!
    ko: |-
      여신상이 위치를 이동하고 있어!
      오차를 수정하고 있는게 분명해!
    ja: |-
      女神像が少しだけ動いている！
      次の攻撃のための誤差修正だ！
  d_main_49_04_151:
    speaker: "<Self>"
    en: If it had hit its mark, it wouldn't have to do that! That means the Ark is
      safe!
    ko: |-
      명중했다면 오차 수정은 필요없을거야!
      그러니까 방주는 괜찮아!
    ja: |-
      命中したならその必要はない！
      つまり攻撃は外れている！
  d_main_49_04_152:
    speaker: anis_i_w
    en: R-right...! I get it now!
    ko: 그, 그래…! 그렇구나, 응!
    ja: そ、そっか…！そうね、うん！
  d_main_49_04_153:
    speaker: "<Self>"
    en: But it won't miss next time! We have to stop it!
    ko: 하지만 다음엔 빗나가지 않을거야! 막아야 해!
    ja: |-
      だが、次も外すとは思えない！
      何としても止める！
  d_main_49_04_154:
    speaker: neon_v_w
    en: Then we'd better aim for the head, right? Well, it doesn't have a head, but
      somewhere around there!
    ko: |-
      그럼 역시 머리를 노려야겠죠?
      머리는 없지만, 대충 그 부분이요!
    ja: |-
      じゃあ、やっぱり頭を狙うべきでしょうか？
      頭はありませんけど、だいたいの辺りです！
  d_main_49_04_155:
    speaker: snowwhite_h
    en: Yes! We should aim for the place where it fired the beam from!
    ko: 그래! 발사구가 있는 곳을 노려야한다!
    ja: そうだな！発射口を狙え！
  d_main_49_04_156:
    speaker: anis_i_w
    en: Gravity field or not, we need to do whatever it takes to get up there!
    ko: 중력장이고 빔이고 나발이고 어떻게든 뚫고 올라가야 해!
    ja: |-
      重力場だろうがビームだろうが
      知ったこっちゃないわ！
      とにかく突破して上に行かないと！
  d_main_49_04_157:
    speaker: ziz
    en: "... Get on! I-I'll fly up!"
    ko: "…타! 내가, 내가 올라갈게!"
    ja: "…乗って！わ、私が飛んで上がる！"
  d_main_49_04_158:
    speaker: "<Narration>"
    en: Ziz spreads her black wings wide.
    ko: 지즈가 검은 날개를 크게 펼친다.
    ja: ジズが黒い翼を大きく広げた
  d_main_49_04_159:
    speaker: rapi_red
    en: I'm going too! I can carry one person with me!
    ko: 나도 간다! 한 명은 싣고 올라갈 수 있어!
    ja: 私も飛べる！誰か1人は私と！
  d_main_49_04_160:
    speaker: "<Narration>"
    en: Seven Dwarves Zero begins to rattle.
    ko: 세븐스 드워프 제로가 요동친다.
    ja: セブンスドワーフゼロがうなりを上げる
  d_main_49_04_161:
    speaker: rapunzel_s
    en: I can jump up with one person in my arms too.
    ko: 저도 한 분 정도는 끌어안고 점프할 수 있어요.
    ja: |-
      こちらもお一人でしたら、
      抱えて跳びあがれます！
  d_main_49_04_162:
    speaker: "<Narration>"
    en: Rapunzel's halo glows.
    ko: 라푼젤의 타륜이 빛난다.
    ja: ラプンツェルの輪が光を放った
  d_main_49_04_163:
    speaker: bahamut
    en: I, the ever-brilliant Bahamut, can summon pillars to any height.
    ko: 똑똑한 바하무트의 기둥은 얼마든지 늘어날 수 있다.
    ja: |-
      賢いバハムートの柱であれば、
      いくらでも伸ばせるぞ。
  d_main_49_04_164:
    speaker: "<Narration>"
    en: Bahamut's black pillar shoots up from the ground.
    ko: 바하무트의 검은 기둥이 솟아오른다.
    ja: バハムートの黒い柱が伸びあがる
  d_main_49_04_165:
    speaker: "<Self>"
    en: "... I'm sorry, everyone! I don't have a plan!"
    ko: "…다들! 미안해! 대책은 없어!"
    ja: "…みんな、すまないが策はない！"
  d_main_49_04_166:
    speaker: "<Self>"
    en: But we still have to do whatever we can to stop it!
    ko: 그래도 무슨 수를 써서라도 막아야 해!
    ja: だが、何が何でも止めるんだ！
  d_main_49_04_167:
    speaker: rapi_red
    en: Rog—
    ko: 라ㅈ…!
    ja: ラジャー…！
  d_main_49_04_168:
    speaker: "<Narration>"
    en: "*Boooom!*"
    ko: 콰아아아아앙--!!
    ja: ボンッ！！
  d_main_49_04_169:
    speaker: "<Narration>"
    en: Suddenly, the midsection of the Goddess of Victory statue explodes.
    ko: "…갑자기, 여신상의 복부 부분이 폭발한다."
    ja: "…突然、女神像の腹の辺りが爆ぜた"
  d_main_49_04_170:
    speaker: "<Narration>"
    en: It looks as if it exploded from the inside. Does that mean someone's inside...?
    ko: |-
      내부에서 폭발한 것 같은 모습이다.
      그렇다는 건 설마 저 안에 누군가가…?
    ja: |-
      内側で爆発が起こったようだ。
      まさかとは思うが、中に誰かが…？
  d_main_49_04_171:
    speaker: "<Narration>"
    en: "*Rumble!*"
    ko: 두두두두두두두두---!!
    ja: ドドドド…
  d_main_49_04_172:
    speaker: snowwhite_h
    en: Damn it...
    ko: 이런… 젠장.
    ja: チッ…そう来るか。
  d_main_49_04_173:
    speaker: leviathan
    en: "... What a pain."
    ko: "…골치아프네 이거."
    ja: "…厄介だね。"
  d_main_49_04_174:
    speaker: "<Narration>"
    en: "... Raptures come pouring out of the enormous hole in the statue's midsection."
    ko: "…여신상의 복부에서 난 거대한 구멍에서, 랩쳐들이 쏟아져나온다."
    ja: |-
      …女神像の腹部に開いた巨大な穴から、
      ラプチャーの群れがなだれ出てきた
  d_main_49_04_175:
    speaker: "<Narration>"
    en: They keep pouring out endlessly.
    ko: 끝이없다. 계속해서 쏟아져나온다.
    ja: |-
      途切れる様子もなく、
      次から次へと飛び出してくる
  d_main_49_04_176:
    speaker: "<Narration>"
    en: Once they hit the ground, they move in perfect coordination.
    ko: 바닥으로 추락하듯 쏟아진 랩쳐들이 일사불란하게 움직인다.
    ja: |-
      降り注ぐように落下したラプチャーは、
      一糸乱れぬ統率のとれた動きをした
  d_main_49_04_177:
    speaker: "<Narration>"
    en: The Raptures don't pay us any attention.
    ko: 랩쳐들은 우리에게 신경도 쓰지 않는다.
    ja: そしてその全てが、私たちには目もくれない
  d_main_49_04_178:
    speaker: "<Narration>"
    en: They all head straight for the Ark.
    ko: 모두, 방주 방향으로 향한다.
    ja: |-
      ひたすらにアークのある方角へと
      進軍を始めている
  d_main_49_04_179:
    speaker: "<Self>"
    en: It was acting as a transport vessel too!
    ko: 수송… 역할도 하는거였나…!
    ja: 輸送機でもあるということか…！
  d_main_49_04_180:
    speaker: hongryeon_g
    en: "'Tis little short of a battle cruiser."
    ko: "…전함이 따로 없군그래."
    ja: "…まさに動く要塞だねぇ。"
  d_main_49_04_181:
    speaker: leviathan
    en: Maybe transportation isn't its only purpose.
    ko: 어쩌면, 수송 뿐만이 아닐지도 몰라.
    ja: いや、輸送ってのは正確じゃないかも。
  d_main_49_04_182:
    speaker: leviathan
    en: It might even be making Raptures in there. That thing is just a mass of Dark
      Matter.
    ko: |-
      내부에서 랩쳐를 생산하고 있는 것일수도 있어.
      저거, 다크 매터 덩어리니까.
    ja: |-
      生産してる可能性がある。
      あれってダークマターの塊でしょ。
  d_main_49_04_183:
    speaker: behemoth
    en: Haha. I have no idea what we're supposed to do.
    ko: 하하. 뭘 어쩌라는건지 모르겠네.
    ja: はは…どうしろって言うんだ？
  d_main_49_04_184:
    speaker: "<Narration>"
    en: The Raptures continue pouring out,
    ko: 계속해서 쏟아져나오는 랩쳐.
    ja: ラプチャーは続々と数を増やしている
  d_main_49_04_185:
    speaker: "<Narration>"
    en: and the statue slowly moves, correcting its aim.
    ko: 조금씩 움직이며 오차를 수정하는 여신상.
    ja: |-
      その間にも女神像は少しずつ姿勢を変え、
      誤差を修正しつつあった
  d_main_49_04_186:
    speaker: "<Narration>"
    en: As Behemoth said, I don't even know what we're supposed to do.
    ko: 베히모스의 말대로… 뭘 어떻게 해야할지 모르겠다.
    ja: |-
      ベヒモスの口からこぼれた言葉通りだ。
      何をどうすればいいのか見当もつかない
  d_main_49_04_187:
    speaker: "<Narration>"
    en: Should we head to the Ark and help them? Or should we try to stop the statue?
    ko: 방주로 가서 도와야하나? 아니면 여신상을 상대해야 하나?
    ja: |-
      アークに急行して救助を行うべきか？
      それとも、ここで女神像を妨害するべきか？
  d_main_49_04_188:
    speaker: snowwhite_h
    en: Why are you just standing there?
    ko: 뭘 멍하니 있나!
    ja: 何を寝ぼけている！
  d_main_49_04_189:
    speaker: rapi_red
    en: Commander!
    ko: 지휘관!
    ja: 指揮官！
  d_main_49_04_190:
    speaker: "<Self>"
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_04_191:
    speaker: "<Self>"
    en: Have faith in the Ark! Ignore the Raptures and attack the statue!
    ko: 방주를 믿는다! 랩쳐는 그대로 두고 여신상을 공격!
    ja: |-
      アークの力を信じよう！
      ラプチャーに構うな、女神像を妨害する！
  d_main_49_04_192:
    speaker: "<Self>"
    en: We have to interfere with its targeting! If that thing fires again, the Ark
      is finished!
    ko: |-
      좌표 수정을 방해해야 해!
      저런게 한번 더 발사되면 방주는 끝이야!
    ja: |-
      誤差の修正だけ止められればいい！
      できなければアークは一巻の終わりだ！
  d_main_49_04_193:
    speaker: "<Self>"
    en: Everyone, unleash maximum firepower on the statue!
    ko: 모두, 최대 화력으로 여신상의 축을 틀어줘!
    ja: |-
      全員の最大火力を叩き込み、
      女神像の体勢を崩せ！
  d_main_49_04_194:
    speaker: marian_queen
    en: Commander.
    ko: 지휘관.
    ja: 指揮官…
  d_main_49_04_195:
    speaker: marian_queen
    en: Leave this to me.
    ko: 여기는 저한테 맡겨주세요.
    ja: ここは私にお任せください。
  d_main_49_04_196:
    speaker: "<Narration>"
    en: I hear a familiar voice.
    ko: 익숙한 목소리가 들려온다.
    ja: ふいに、忘れるはずのない声が聞こえた
  d_main_49_04_197:
    speaker: "<Narration>"
    en: We all turn to look behind us.
    ko: 우리 모두는 뒤를 돌아본다.
    ja: その場の誰もがいっせいに振り返った
  d_main_49_04_198:
    speaker: marian_queen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_199:
    speaker: "<Narration>"
    en: Marian is walking up to us.
    ko: 마리안이 걸어오고 있다.
    ja: マリアンが歩いている
  d_main_49_04_200:
    speaker: "<Self>"
    en: Marian...?
    ko: 마리… 안?
    ja: マリ…アン？
  d_main_49_04_201:
    speaker: "<Narration>"
    en: "*Tap*"
    ko: 딱.
    ja: カツン――
  d_main_49_04_202:
    speaker: "<Narration>"
    en: Marian taps her staff on the ground.
    ko: 마리안이 가볍게 지팡이를 바닥에 내려찍는다.
    ja: 手にした杖の棒先で地面を叩いた
  d_main_49_04_203:
    speaker: "<Narration>"
    en: "*Whooosh!*"
    ko: 콰드드드득--!!
    ja: ガガガッ！！
  d_main_49_04_204:
    speaker: "<Narration>"
    en: Black spears erupt from the ground, piercing the lower half of the statue.
    ko: 지면에서 솟은 거대한 검은색의 창들이 여신상의 하부를 꿰뚫는다.
    ja: |-
      大地から突き出た巨大な黒い槍が、
      女神像を足下から貫く
  d_main_49_04_205:
    speaker: "<Narration>"
    en: The statue's movements halt.
    ko: 여신상의 움직임이 멈춘다.
    ja: 女神像が動きを止めた
  d_main_49_04_206:
    speaker: "<Narration>"
    en: "*Tap*"
    ko: 딱.
    ja: カツン――
  d_main_49_04_207:
    speaker: "<Narration>"
    en: Marian taps her staff on the ground again.
    ko: 마리안이 다시 한번 지팡이를 바닥에 내려찍는다.
    ja: マリアンがもう一度杖を地面に突き立てた
  d_main_49_04_208:
    speaker: "<Narration>"
    en: "... Dark Matter begins to gather in the air."
    ko: "…허공에 다크 매터가 모여든다."
    ja: "…虚空にダークマターが集まり始めた"
  d_main_49_04_209:
    speaker: "<Narration>"
    en: Soon, it takes the shape of a large spear,
    ko: 이윽고 거대한 창의 형태가 되어
    ja: それは次第に巨大な槍の形となり…
  d_main_49_04_210:
    speaker: "<Narration>"
    en: before stabbing into the statue's midsection.
    ko: 여신상의 복부에 내려꽂힌다.
    ja: 女神像の腹部に突き刺さった
  d_main_49_04_211:
    speaker: "<Narration>"
    en: The stream of Raptures pouring out the statue's abdomen comes to a stop.
    ko: 복부에서 쏟아져내려오던 랩쳐들이 멈춘다.
    ja: |-
      そこから飛び出し続けていた
      ラプチャーの流れが止まった
  d_main_49_04_212:
    speaker: "<Narration>"
    en: I turn to look at Marian.
    ko: 고개를 돌려 마리안을 바라본다.
    ja: 思わず振り返り、マリアンに目を向けた
  d_main_49_04_213:
    speaker: "<Narration>"
    en: With a tearful expression,
    ko: 마리안은 울것같은 표정으로
    ja: マリアンは今にも泣きだしそうな顔で…
  d_main_49_04_214:
    speaker: "<Narration>"
    en: Marian looks at me and smiles.
    ko: 나를 보며 미소짓는다.
    ja: 私を見て、微笑んでいた
  d_main_49_04_215:
    speaker: marian_queen
    en: Commander.
    ko: 지휘관.
    ja: 指揮官…
  d_main_49_04_216:
    speaker: "<Self>"
    en: Marian!
    ko: 마리안!
    ja: マリアン！
  d_main_49_04_217:
    speaker: "<Narration>"
    en: I run to her.
    ko: 달려간다.
    ja: 足が動く
  d_main_49_04_218:
    speaker: "<Narration>"
    en: Marian holds out her hand.
    ko: 마리안이 손을 내민다.
    ja: マリアンの手が伸びてくる
  d_main_49_04_219:
    speaker: "<Narration>"
    en: "... A strange feeling comes over me."
    ko: "…묘한 느낌이 든다."
    ja: "…瞬間、奇妙な感覚が頭をよぎった"
  d_main_49_04_220:
    speaker: "<Narration>"
    en: Part of me feels like I should take her hand, while another part tells I mustn't.
    ko: |-
      저 손을 잡아야 할 것 같다는 예감과,
      절대 잡으면 안 될 것 같다는 예감이 동시에 든다.
    ja: |-
      その手をつかまなければという意思と、
      決してそうしてはならないという、
      背反する予感だ
  d_main_49_04_221:
    speaker: "<Narration>"
    en: I stare at Marian.
    ko: 마리안을 바라본다.
    ja: マリアンの顔に目を向ける
  d_main_49_04_222:
    speaker: "<Narration>"
    en: She has an odd expression on her face.
    ko: 이상한 표정이다.
    ja: 読み取りがたい表情をしていた
  d_main_49_04_223:
    speaker: "<Narration>"
    en: "... I'm probably wearing the same expression."
    ko: "…아마, 나도 똑같은 표정을 짓고 있겠지."
    ja: "…きっと、私も同じような顔をしている"
  d_main_49_04_224:
    speaker: "<Narration>"
    en: Even so, I approach her.
    ko: 그럼에도 다가간다.
    ja: 戸惑いを振り払い、近づいた
  d_main_49_04_225:
    speaker: "<Narration>"
    en: I reach out my hand to take hers.
    ko: 마리안의 손을 잡기 위해 손을 뻗는다.
    ja: マリアンの手を取ろうと、手を伸ばした
  d_main_49_04_226:
    speaker: marian_queen
    en: Don't come any closer!
    ko: 오지 마요!
    ja: 来ないでください！
  d_main_49_04_227:
    speaker: "<Self>"
    en: "... Marian?"
    ko: "…마리안?"
    ja: "…マリアン？"
  d_main_49_04_228:
    speaker: marian_queen
    en: I'm... concentrating right now. If you come any closer, you might get hurt.
    ko: |-
      지… 금 집중하고 있어서요.
      가까이 오면 다칠지도 몰라요.
    ja: |-
      今は…集中してますから。
      近づいたら、巻き込んでしまうかもしれません。
  d_main_49_04_229:
    speaker: marian_queen
    en: You can talk to me from there, all right?
    ko: 거기서 얘기해요. 예?
    ja: 今は話すだけ、いいですよね？
  d_main_49_04_230:
    speaker: "<Narration>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_231:
    speaker: "<Narration>"
    en: What...? Something strange is going on.
    ko: 뭐지. 뭔가 이상하다.
    ja: なぜだろうか、何かが噛み合っていない
  d_main_49_04_232:
    speaker: "<Self>"
    en: Marian, what's—
    ko: 마리안. 무슨 일-
    ja: マリアン。どうしたんだ――
  d_main_49_04_233:
    speaker: rapi_red
    en: Marian...! Are you okay now?
    ko: 마리안…! 너 이제 괜찮은거야?
    ja: マリアン…！大丈夫だったの？
  d_main_49_04_234:
    speaker: anis_i_w
    en: You should've told us you were coming!
    ko: 오면 온다고 얘기를 했었어야지!
    ja: 来るなら来るって、ちゃんと言いなさいよ！
  d_main_49_04_235:
    speaker: neon_v_w
    en: Wow! It's been forever!
    ko: 와! 진짜 오랜만이에요!
    ja: わあ！本当にお久しぶりです！
  d_main_49_04_236:
    speaker: snowwhite_h
    en: "... You're here."
    ko: "…어서 와라."
    ja: "…もっと早く来い。"
  d_main_49_04_237:
    speaker: rapunzel_s
    en: Ah...! I'm so... relieved!
    ko: 아아…! 정말…! 다행이에요…!
    ja: ああ…！本当に…！よかった…！
  d_main_49_04_238:
    speaker: hongryeon_g
    en: By my troth, it hath been quite some time for us both.
    ko: 것 참. 오래 걸렸지 뭔가. 서로서로.
    ja: |-
      まったく…ずいぶんと時間がかかったものだ。
      お互いになぁ。
  d_main_49_04_239:
    speaker: "<Narration>"
    en: Marian looks at us.
    ko: 마리안이 우릴 바라본다.
    ja: マリアンが私たちを見つめた
  d_main_49_04_240:
    speaker: "<Narration>"
    en: Her eyes are brimming with tears.
    ko: 그렁그렁한 눈으로, 우릴 바라본다.
    ja: 涙が目に溜まっている
  d_main_49_04_241:
    speaker: marian_queen
    en: "... Yes. I'm so glad I got to see you all again."
    ko: "…예. 다들, 다시 만날 수 있어서 정말 다행이에요."
    ja: |-
      …はい。皆さんとまた会えて、
      本当によかったです。
  d_main_49_04_242:
    speaker: behemoth
    en: "... Who's that?"
    ko: "…누구야?"
    ja: "…誰だ？"
  d_main_49_04_243:
    speaker: ziz
    en: Sh-she... she was the one asleep in Eden...
    ko: 그, 그… 에덴에서 자고 있던….
    ja: え、ほら…エデンで眠ってた…
  d_main_49_04_244:
    speaker: behemoth
    en: Ah. Now I remember.
    ko: 아. 기억났다.
    ja: あ～！思い出した。
  d_main_49_04_245:
    speaker: bahamut
    en: You only just remembered? I, the astute Bahamut, recognized her right away.
    ko: 이제야 기억난건가. 똑똑한 바하무트는 진즉에 떠올렸다.
    ja: |-
      やっと思い出したか。
      賢いバハムートはとっくに分かっていたぞ。
  d_main_49_04_246:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_247:
    speaker: leviathan
    en: You. What did you do with the kid?
    ko: 너. 그 아이를 어떻게 했어.
    ja: あんた。あの子、どうしたの。
  d_main_49_04_248:
    speaker: behemoth
    en: "...?"
    ko: "…??"
    ja: "…？？"
  d_main_49_04_249:
    speaker: leviathan
    en: That Dark Matter you're using... It's hers! I know! I can tell!
    ko: |-
      네가 쓰는 그 다크 매터.
      그 아이 거잖아! 나는 알아! 알 수 있다고!
    ja: |-
      あんたのダークマター…
      あの子のだったものでしょ！分かんのよ！
      正直に言いなさい！
  d_main_49_04_250:
    speaker: leviathan
    en: So what did you do...?!
    ko: 어떻게 했어…!
    ja: 何をしたの…！
  d_main_49_04_251:
    speaker: leviathan
    en: What did you do to her?!
    ko: 어떻게 했냐고!
    ja: 早く、答えて！
  d_main_49_04_252:
    speaker: marian_queen
    en: I took it.
    ko: 제가 받았어요.
    ja: 譲ってもらいました。
  d_main_49_04_253:
    speaker: marian_queen
    en: Her Dark Matter, her gene, her core. I took all of it.
    ko: 다크 매터도. 인자도. 코어까지. 모두 받았어요.
    ja: ダークマターも、因子も、コアも、全部。
  d_main_49_04_254:
    speaker: leviathan
    en: "... Did you kill her...?"
    ko: "…죽였냐…?"
    ja: "…殺したってこと…？"
  d_main_49_04_255:
    speaker: marian_queen
    en: "... What? No, I would never."
    ko: "…예? 아뇨, 그럴리가요."
    ja: "…え？いえ、そんなことはしていません。"
  d_main_49_04_256:
    speaker: leviathan
    en: Then how did you get it...?!
    ko: 그런데 그걸 왜 네가…!
    ja: なら、なんでそれをあんたが…！
  d_main_49_04_257:
    speaker: marian_queen
    en: I asked her, and she gave it to me.
    ko: 제가 부탁했고, 그 아이가 저에게 줬어요.
    ja: 私がお願いして、あの子からもらったんです。
  d_main_49_04_258:
    speaker: marian_queen
    en: She's asleep now in Eden. Don't worry.
    ko: 지금은 에덴에서 잠에 들었어요. 걱정마요.
    ja: |-
      今はエデンで眠っています。
      心配はいりません。
  d_main_49_04_259:
    speaker: leviathan
    en: Why would she give that to you?! Do you honestly expect me to believe that?!
    ko: |-
      걔가 왜 너한테 그걸 줘!
      나보고 지금 그걸 믿으라고…!
    ja: |-
      あの子がなんであんたに譲ったっていうのよ！
      どうやって信じろって…！
  d_main_49_04_260:
    speaker: marian_queen
    en: Please believe me. The girl—
    ko: |-
      믿어주세요.
      그 아이는….
    ja: |-
      信じてください。
      あの子は…
  d_main_49_04_261:
    speaker: "<Narration>"
    en: "*Crack, snap!*"
    ko: 쿠득…! 쿠득…!
    ja: ミシッ…！ミシッ…！
  d_main_49_04_262:
    speaker: "<Narration>"
    en: I frantically turn to the Goddess of Victory statue.
    ko: 다급하게 여신상을 바라본다.
    ja: 音に驚き、女神像に視線を戻した
  d_main_49_04_263:
    speaker: "<Narration>"
    en: The spears put there by Marian are starting to twist and break apart.
    ko: 마리안이 꽂아넣은 창들이 뒤틀리며 부서지기 시작한다.
    ja: 突き刺された槍がゆがみ、砕け始めている
  d_main_49_04_264:
    speaker: marian_queen
    en: "... We don't have time to talk right now."
    ko: "…지금 길게 얘기를 할 시간이 없어요."
    ja: "…今は説明している時間がありません。"
  d_main_49_04_265:
    speaker: marian_queen
    en: I'll take care of that thing.
    ko: 저건 제가 잡아둘게요.
    ja: あれは私が食い止めます。
  d_main_49_04_266:
    speaker: marian_queen
    en: You guys head to the Ark.
    ko: 여러분은 그 사이 방주로 가 주세요.
    ja: 皆さんは、その間にアークへ。
  d_main_49_04_267:
    speaker: marian_queen
    en: Go to the Ark and bring back anyone who can help us fight this thing.
    ko: 방주로 가서, 이것과 맞서싸울 이들과 함께 돌아와주세요.
    ja: |-
      戦ってくれる仲間を連れて、
      戻って来てください。
  d_main_49_04_268:
    speaker: marian_queen
    en: I can't hold out long. I have no way of knowing its true power.
    ko: |-
      오래 버티진 못해요.
      이것의 진짜 힘이 어느정도일지는 미지수니까.
    ja: |-
      あまり長い時間は約束できません。
      あれがどれほどの力を隠しているか、
      分かりませんから。
  d_main_49_04_269:
    speaker: rapi_red
    en: There's no way. How are you supposed to face that thing alone?!
    ko: 무리야. 너 혼자서 이걸 무슨 수로…!
    ja: 不可能よ、一人でどう止める気…！？
  d_main_49_04_270:
    speaker: marian_queen
    en: Rapi.
    ko: 라피.
    ja: ラピ…
  d_main_49_04_271:
    speaker: marian_queen
    en: I'm the Queen now.
    ko: 저는 지금 퀸이에요.
    ja: 私はもう、クイーンですから。
  d_main_49_04_272:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_273:
    speaker: marian_queen
    en: Go. All of you.
    ko: 가요. 모두.
    ja: 早く、行ってください。
  d_main_49_04_274:
    speaker: "<Self>"
    en: What in the world are you...?
    ko: 지금 대체 무슨….
    ja: それはどういう…
  d_main_49_04_275:
    speaker: "<Narration>"
    en: "*Tap*"
    ko: 딱.
    ja: カッ――
  d_main_49_04_276:
    speaker: "<Narration>"
    en: Marian lightly taps her staff on the ground.
    ko: 마리안이 지팡이를 땅에 가볍게 내려찍는다.
    ja: マリアンが地面を杖で叩く
  d_main_49_04_277:
    speaker: "<Narration>"
    en: "*Gurgle*"
    ko: 꿀렁~
    ja: ぐにゃり…
  d_main_49_04_278:
    speaker: "<Narration>"
    en: Dark Matter bubbles and shoots up from the ground.
    ko: 지면에서 다크 매터가 울컥거리며 솟아오른다.
    ja: ダークマターがうねりながら湧き上がった
  d_main_49_04_279:
    speaker: "<Narration>"
    en: It washes over us like a small wave, pushing us away from Marian.
    ko: 마치 얕은 파도처럼 우리를 집어삼키며, 마리안에게서 밀어낸다.
    ja: |-
      私たちはさざ波のようなうねりに
      押し流され、マリアンから遠ざけられた
  d_main_49_04_280:
    speaker: "<Narration>"
    en: It's so heavy that I can't fight it off.
    ko: 무겁다. 떨쳐낼 수가 없다.
    ja: まとわりついて重く、振り払えない
  d_main_49_04_281:
    speaker: "<Narration>"
    en: Moving at incredible speed, it drives us away in an instant.
    ko: 그리고 굉장한 속도다. 삽시간에 멀어진다.
    ja: 瞬く間にマリアンの姿が小さくなっていく
  d_main_49_04_282:
    speaker: "<Self>"
    en: Marian!!
    ko: 마리안!!
    ja: マリアン！！
  d_main_49_04_283:
    speaker: marian_queen
    en: Commander.
    ko: 지휘관.
    ja: 指揮官…
  d_main_49_04_284:
    speaker: marian_queen
    en: I'll be waiting.
    ko: 기다릴게요.
    ja: 待っています。
  d_main_49_04_285:
    speaker: "<Narration>"
    en: I catch a glimpse of Marian's faint smile before she disappears from view.
    ko: |-
      마리안의 희미한 미소가 보인다.
      그리고 곧, 시야에서 사라진다.
    ja: |-
      マリアンがかすかに微笑んだ。
      すぐにその顔も見えなくなった
  d_main_49_04_286:
    speaker: marian_queen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_04_287:
    speaker: "<Narration>"
    en: Marian looks up at the Goddess of Victory statue.
    ko: 마리안은 여신상을 올려다본다.
    ja: マリアンが女神像に視線を戻した
  d_main_49_04_288:
    speaker: "<Narration>"
    en: The black spears she stabbed it with are falling apart.
    ko: 꽂아넣었던 검은 창이 너덜너덜해진다.
    ja: |-
      突き刺さっていた黒い槍は
      すでに形を失いかけている
  d_main_49_04_289:
    speaker: marian_queen
    en: Just as I thought... That was only enough to slow you down for a bit.
    ko: "…역시, 이 정도로는 잠시만 잡아둘 뿐이네."
    ja: |-
      …やはり、この程度では
      足止めにしかなりませんね。
  d_main_49_04_290:
    speaker: "<Narration>"
    en: "*Shatter!*"
    ko: 쿠드드득--!!
    ja: ズズズ…
  d_main_49_04_291:
    speaker: "<Narration>"
    en: The black spears all shatter into pieces, and the statue moves.
    ko: 검은 창들이 모두 산산이 부서지며, 여신상이 움직인다.
    ja: 黒い槍を完全に粉砕し、女神像は再び動き出した
  d_main_49_04_292:
    speaker: "<Narration>"
    en: "*Screeeeech!*"
    ko: 키이이이잉---
    ja: キィン――
  d_main_49_04_293:
    speaker: "<Narration>"
    en: The sky turns red, and the ground begins to tremble.
    ko: 하늘이 붉어지고 대지가 진동한다.
    ja: 空が赤く染まり、大地が揺れる
  d_main_49_04_294:
    speaker: "<Narration>"
    en: Marian recalls the red sky she saw once before.
    ko: 마리안은 언젠가 보았던, 붉은 하늘을 회상한다.
    ja: マリアンはいつか見た、同じ色の空を思い出した
  d_main_49_04_295:
    speaker: marian_queen
    en: This time, I swear...
    ko: "…이번엔. 반드시."
    ja: "…今度こそ、必ず…"
  d_main_49_04_296:
    speaker: marian_queen
    en: I will defeat you.
    ko: 당신을 쓰러뜨리겠습니다.
    ja: あなたを倒します。
  d_main_49_04_297:
    speaker: "<Narration>"
    en: Black light bursts forth from Marian's body.
    ko: 마리안의 몸에서 검은 빛이 터져나온다.
    ja: マリアンの体から黒い光があふれ出す
  d_main_49_04_298:
    speaker: "<Narration>"
    en: And then...
    ko: 그리고
    ja: それは…
  d_main_49_04_299:
    speaker: "<Narration>"
    en: A pitch-black moon swallows the statue.
    ko: 칠흑과도 같은 검은 달이, 여신상을 집어삼킨다.
    ja: 漆黒の月の形となって女神像を呑み込んだ
d_main_49_05:
  d_main_49_05_1:
    speaker: "<Narration>"
    en: In the black void, Marian floats as she stares at the statue.
    ko: |-
      검은 공간.
      마리안은 부유하며 여신상을 바라보고 있다.
    ja: |-
      マリアンは暗闇の中に浮かび、
      女神像をにらんでいる
  d_main_49_05_2:
    speaker: "<Narration>"
    en: It doesn't move at all.
    ko: 여신상은 아무런 움직임이 없다.
    ja: 女神像は動かない
  d_main_49_05_3:
    speaker: "<Narration>"
    en: With a sigh of relief, Marian continues watching the statue.
    ko: 마리안은 안도의 한숨을 내쉬며, 여신상을 계속 바라본다.
    ja: |-
      マリアンは女神像から目を離さず、
      しかし安堵のため息をこぼした
  d_main_49_05_4:
    speaker: marian_queen
    en: I wonder how long I can keep this up...
    ko: 이걸로 얼마나 버틸 수 있을지….
    ja: これでどれくらい時間を稼げるか…
  d_main_49_05_5:
    speaker: mirror_r
    en: Not long, I'd say.
    ko: 글쎄요. 얼마 못 버티지 않을까요.
    ja: |-
      どうでしょうね。
      長くは持たないと思いますが。
  d_main_49_05_6:
    speaker: marian_queen
    en: You...
    ko: "…당신은…."
    ja: "…あなたは…"
  d_main_49_05_7:
    speaker: mirror_r
    en: Nice to meet you, Marian. The fake Queen.
    ko: |-
      반가워요 마리안.
      가짜 퀸.
    ja: |-
      お会いできて嬉しいです、マリアン…
      あるいは、クイーンを騙るお方。
  d_main_49_05_8:
    speaker: mirror_r
    en: I'm Mirror. I'm the one who made you into what you are today.
    ko: 저는 미러. 당신을 이렇게까지 키운 일등공신이죠.
    ja: |-
      私はミラー。あなたをここまで
      育てあげたのは私です。
  d_main_49_05_9:
    speaker: marian_queen
    en: Oh, I see.
    ko: 그렇군요.
    ja: そうでしたか。
  d_main_49_05_10:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_11:
    speaker: mirror_r
    en: Is that all you have to say?
    ko: 할말이 그것밖에 없나요?
    ja: それだけですか？
  d_main_49_05_12:
    speaker: marian_queen
    en: Yes. I have nothing else to say to you.
    ko: 예. 다른 할말은 없는데요.
    ja: そうです、他に言うことなどありません。
  d_main_49_05_13:
    speaker: marian_queen
    en: Although I would like to thank you.
    ko: 고맙다는 말은 하고 싶어요.
    ja: ですが、お礼は言っておきます。
  d_main_49_05_14:
    speaker: marian_queen
    en: It's thanks to you that I can go up against that thing.
    ko: 저를 이렇게 만들어준 덕분에, 저걸 막아설 수 있으니까.
    ja: |-
      あなたが私をこうしたおかげで、
      あれを食い止めることができていますから。
  d_main_49_05_15:
    speaker: mirror_r
    en: Hehe. You're the same person who was so scared, you just stood there while
      your gene was stolen.
    ko: 후후. 겁에 질려서 아무것도 하지 못한 채 인자를 빼앗긴 당신이
    ja: |-
      ふふ…恐怖に怯えて、何もできずに
      因子を奪われたはずのあなたが…
  d_main_49_05_16:
    speaker: mirror_r
    en: How did you become capable of doing all this in that form?
    ko: 어떻게 그런 모습으로, 이런 짓을 할 수 있게 된거죠?
    ja: |-
      なぜそのような姿になって、
      こんな力を手に入れているのですか？
  d_main_49_05_17:
    speaker: marian_queen
    en: I don't see any reason to tell you that.
    ko: 글쎄요. 말씀드려야 하나요?
    ja: その質問に、答える必要があるでしょうか？
  d_main_49_05_18:
    speaker: marian_queen
    en: You're not even human, Nikke, Rapture, or anything else.
    ko: 사람도, 니케도, 랩쳐도, 그 어떤 것도 아닌 당신에게.
    ja: |-
      あなたは人間でも、ニケでも、
      ラプチャーでもありません。
  d_main_49_05_19:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_20:
    speaker: marian_queen
    en: This is my world.
    ko: 이곳은 [저의 세계].
    ja: ここは「私の世界」です。
  d_main_49_05_21:
    speaker: marian_queen
    en: In this space, the only rules that apply are the ones I make.
    ko: 이 공간 안에서는 모든 법칙이 제가 정한대로 적용돼요.
    ja: |-
      この中では、あらゆる事象が
      私の決めた通りに動きます。
  d_main_49_05_22:
    speaker: marian_queen
    en: That means a person can't control their body here as they normally would unless
      I allow it.
    ko: 언제나 사용하던 자신의 신체를 이곳에서는 마음대로 쓸 수 없죠.
    ja: |-
      たとえ自分の身体であろうと、
      例外ではありません。
  d_main_49_05_23:
    speaker: marian_queen
    en: They can't blink, speak, or even breathe as they please.
    ko: 눈을 깜빡이는 것도, 말을 하는 것도, 숨을 쉬는 것도 마음대로 할 수 없어요.
    ja: |-
      まばたきも、会話も…呼吸ひとつだって、
      思い通りにはできないはずです。
  d_main_49_05_24:
    speaker: marian_queen
    en: But seeing how you're able to speak to me so freely...
    ko: 그런 곳에서 이렇게 아무렇지도 않게 저한테 말을 걸고 있는 걸로 봐선.
    ja: |-
      そのはずなのに、
      あなたは平然と私に話しかけてきた。
  d_main_49_05_25:
    speaker: marian_queen
    en: That must mean you're not actually anything.
    ko: 당신은 그 무엇도 아니에요.
    ja: つまり、何者でもないということです。
  d_main_49_05_26:
    speaker: mirror_r
    en: "... Call me a digital lifeform."
    ko: "…디지털 생명체, 라고 불러주시죠."
    ja: |-
      …デジタルの生命体、とでも
      呼んでいただきましょうか。
  d_main_49_05_27:
    speaker: marian_queen
    en: A "digital lifeform"?
    ko: 뭔가요 그게?
    ja: そんなものが存在しますか？
  d_main_49_05_28:
    speaker: marian_queen
    en: Aren't you just a hologram?
    ko: 그냥 홀로그램인 것 아닌가요?
    ja: ただのホログラムと何が違うのでしょう？
  d_main_49_05_29:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_30:
    speaker: marian_queen
    en: So what do you want with me?
    ko: 그래서, 무슨 볼일이시죠?
    ja: それで、用件は？
  d_main_49_05_31:
    speaker: marian_queen
    en: If you just want to talk, I'll hear you out.
    ko: 얘기 정도라면 들어드릴게요.
    ja: 話をするぐらいのことは許します。
  d_main_49_05_32:
    speaker: marian_queen
    en: Not that you can do anything else here anyway.
    ko: 어차피 그것밖에 못 하시겠지만.
    ja: 他にできることもないのでしょうけど。
  d_main_49_05_33:
    speaker: mirror_r
    en: Close this space and surrender the gene to the Queen.
    ko: 이 공간을 거둬들이고, 인자를 퀸께 넘겨요.
    ja: |-
      この空間を収め、
      因子をクイーンに引き渡してください。
  d_main_49_05_34:
    speaker: marian_queen
    en: And what do I get out of it?
    ko: 그렇게해서 제가 얻을게 뭐죠?
    ja: そうすることで、私に何のメリットが？
  d_main_49_05_35:
    speaker: mirror_r
    en: I'll allow you to watch by the Queen's side as she creates a new world.
    ko: 퀸의 옆에서 새로운 세상을 만드는 것을 지켜보게 해줄게요.
    ja: |-
      クイーンのそばで、
      新たな世界の創造を見届けさせてあげましょう。
  d_main_49_05_36:
    speaker: marian_queen
    en: And who are you to promise that?
    ko: 당신이 뭔데요?
    ja: あなたは、何様のつもりですか？
  d_main_49_05_37:
    speaker: mirror_r
    en: "... What?"
    ko: "…뭐라고요?"
    ja: "…どういう意味でしょう？"
  d_main_49_05_38:
    speaker: marian_queen
    en: Are you one of its elites or strategists?
    ko: 저것의 정예나 참모인가요?
    ja: あちらの精鋭か参謀を気取っているようですが…
  d_main_49_05_39:
    speaker: marian_queen
    en: Has that thing ever given you any orders directly?
    ko: 저것이 당신에게 직접 뭔가 명령을 내린 적이 있나요?
    ja: 今まで何かを直接命令されたことがありますか？
  d_main_49_05_40:
    speaker: marian_queen
    en: Has it ever acted on one of your suggestions?
    ko: 당신이 저것에게 뭔가를 제안해서 진행된 적이 있나요?
    ja: |-
      あなたの助言に従って
      何かが進められたことは？
  d_main_49_05_41:
    speaker: marian_queen
    en: I doubt it.
    ko: 아닐거라고 생각해요.
    ja: ありませんよね。
  d_main_49_05_42:
    speaker: marian_queen
    en: Because that thing must be feeling the exact same disgust I feel.
    ko: 제가 느끼는 이 불쾌감을, 저것도 똑같이 느끼고 있을테니까요.
    ja: |-
      あなたには、あちら側も私と同じ
      不快な気持ちを抱いているはずです。
  d_main_49_05_43:
    speaker: marian_queen
    en: After all, we're both Queens.
    ko: 같은 퀸이니까.
    ja: 同じクイーンですから。
  d_main_49_05_44:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_45:
    speaker: marian_queen
    en: You're not anything.
    ko: 당신은 그 무엇도 아니에요.
    ja: あなたに居場所はありません。
  d_main_49_05_46:
    speaker: marian_queen
    en: Not in the world I create, nor in the world that thing creates.
    ko: 제가 만들 세계에도, 저것이 만들 세계에도.
    ja: |-
      私が作りたい世界でも、
      あちらが作ろうとしている世界でも。
  d_main_49_05_47:
    speaker: marian_queen
    en: We have no need for a being like you, if you can even be called that.
    ko: |-
      당신 같은 존재, 아니. 존재라고 부를 수도 있을지 모르겠지만.
      당신 같은 존재는 필요하지 않아요.
    ja: |-
      あなたのような存在…
      いいえ、存在するかどうかも
      疑わしいものなど不要です。
  d_main_49_05_48:
    speaker: marian_queen
    en: You're just some unknown thing.
    ko: 뭔지 모를, 뭔가일 뿐이니까요.
    ja: 知るにも値しない、単なる「何か」…
  d_main_49_05_49:
    speaker: marian_queen
    en: Acting like you've come to offer me a deal from the other side, as if you're
      doing me a favor.
    ko: 그런 당신이 선심쓰듯 저것을 들먹이며 거래를 걸다니.
    ja: |-
      それが厚かましくも
      あちらの使者のような顔をして
      取引を持ちかけてくるなんて…
  d_main_49_05_50:
    speaker: marian_queen
    en: Don't you find it absurd?
    ko: 우습지 않나요?
    ja: 冗談のつもりですか？
  d_main_49_05_51:
    speaker: mirror_r
    en: Hehe. That's rather harsh, considering we've only just met.
    ko: 후후. 초면에 말을 너무 막 하시네요.
    ja: |-
      ふふ…初対面の相手に、
      ずいぶんな物言いですね。
  d_main_49_05_52:
    speaker: marian_queen
    en: Except this isn't our first time meeting, is it?
    ko: 아니잖아요. 초면.
    ja: 初めてではありません。
  d_main_49_05_53:
    speaker: marian_queen
    en: It's hazy, but I remember your face, and your voice.
    ko: 흐릿하지만, 당신의 모습, 목소리. 기억나요.
    ja: |-
      おぼろげであっても、
      その姿と声は…覚えています。
  d_main_49_05_54:
    speaker: marian_queen
    en: It's very... unpleasant.
    ko: 아주… 불쾌해요.
    ja: とても…気分が悪くなります。
  d_main_49_05_55:
    speaker: mirror_r
    en: I'm glad you remember. It must mean I gave you an unforgettable memory.
    ko: |-
      그건 다행이네요.
      잊지 못할 [기억]을 당신에게 준 셈이니까.
    ja: |-
      それは何よりです。
      忘れられない私の「記憶」が
      あなたに刻まれたということですから。
  d_main_49_05_56:
    speaker: mirror_r
    en: What you said earlier left quite an impression on me. You claim the Queen
      finds me unpleasant?
    ko: |-
      당신의 말은 인상적이네요.
      퀸께서 저를 불쾌해한다는 말.
    ja: |-
      とはいえ、驚きました。
      クイーンが私を不快に思っているなどと。
  d_main_49_05_57:
    speaker: mirror_r
    en: I've served as the Queen's strategist for a long—
    ko: 저는 오랫동안 퀸의 참모로-
    ja: 私は長らくクイーンの参謀として――
  d_main_49_05_58:
    speaker: marian_queen
    en: Do you know what kind of world it's trying to create?
    ko: 저것이 만들려는 세계가 무엇인지 아시나요?
    ja: |-
      そのクイーンがどういう世界を
      造ろうとしているのか、知っていますか？
  d_main_49_05_59:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_60:
    speaker: marian_queen
    en: Of course you don't.
    ko: 역시, 모르는군요.
    ja: やっぱり、知らないみたいですね。
  d_main_49_05_61:
    speaker: marian_queen
    en: Yet you call yourself its strategist? Hilarious.
    ko: 그런것도 모르면서, 참모라니 재밌네요.
    ja: |-
      そんなことも知らずに、
      参謀のつもりなんておかしな話です。
  d_main_49_05_62:
    speaker: marian_queen
    en: If you have nothing else to say to me, then how about you go help restore
      its abilities or something.
    ko: 더 할말 없으시면, 다시 돌아가서 저것이 기능을 회복하도록 돕기나 하세요.
    ja: |-
      それ以上話せることがないなら、
      戻って、あちらの機能回復を
      助けてきたらどうですか？
  d_main_49_05_63:
    speaker: marian_queen
    en: That's your job as its strategist, isn't it?
    ko: "[참모]로서, 말이죠."
    ja: その方が「参謀」らしいでしょう。
  d_main_49_05_64:
    speaker: mirror_r
    en: You... You're going to fail spectacularly.
    ko: "…당신은, 처참하게 실패할거예요."
    ja: "…無残に失敗しますよ、あなたは。"
  d_main_49_05_65:
    speaker: marian_queen
    en: Bold words from someone who can't fail because they don't really exist. I'll
      keep them in mind.
    ko: 존재가 없기에 실패할 수도 없는 당신의 말이니, 새겨 들을게요.
    ja: |-
      存在しない以上、失敗することもない
      あなたの言葉として、覚えておきます。
  d_main_49_05_66:
    speaker: marian_queen
    en: Though I suppose a curse coming from such a nothing also means nothing.
    ko: 그 저주조차도, 무의미하겠지만.
    ja: |-
      ありもしないものの呪いに
      意味があるかどうかは知りませんが。
  d_main_49_05_67:
    speaker: marian_queen
    en: Oh, before you go, there's one thing I'd like to ask.
    ko: 아, 가시기 전에 한가지만 물어볼게요.
    ja: そうだ、行かれる前に一つだけ聞いておきます。
  d_main_49_05_68:
    speaker: marian_queen
    en: What were you even trying to accomplish?
    ko: 당신은 대체 뭘 하려고 했던 건가요?
    ja: あなた、いったい何がしたかったんですか？
  d_main_49_05_69:
    speaker: marian_queen
    en: It's not like you can have any influence on anyone if they just cover their
      ears.
    ko: 귀만 막으면, 당신이 타인에게 영향을 미칠 수 있는 건 아무것도 없는데.
    ja: |-
      耳を塞がれるだけで、
      誰にも何もできなくなるのに。
  d_main_49_05_70:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_71:
    speaker: mirror_r
    en: Hehe. Very well. Say whatever you please.
    ko: "…후후. 예. 마음대로 지껄이세요."
    ja: |-
      …ふふ…ええ、今は好きに言わせて
      差し上げましょう。
  d_main_49_05_72:
    speaker: "<Narration>"
    en: Mirror disappears into the darkness.
    ko: 미러가 어둠 속으로 사라진다.
    ja: ミラーが闇の中へと消えた
  d_main_49_05_73:
    speaker: "<Narration>"
    en: Marian feels an inexplicable sense of relief and turns to look at the Goddess
      of Victory statue shrouded in darkness.
    ko: |-
      마리안은 알 수 없는 후련함을 느끼며,
      어둠속에 잠긴 여신상을 바라본다.
    ja: |-
      マリアンはどこか曇りの晴れた気分で
      闇に沈む女神像を見た
  d_main_49_05_74:
    speaker: marian_queen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_75:
    speaker: marian_queen
    en: What kind of world are you trying to create?
    ko: 당신이 만들려는 세상은 무엇인가요.
    ja: |-
      あなたは、どういう世界を
      造ろうとしているのですか？
  d_main_49_05_76:
    speaker: "<Narration>"
    en: All is still in the darkness.
    ko: 어둠 속은 고요하다.
    ja: 闇の中は静まり返っている
  d_main_49_05_77:
    speaker: "<Narration>"
    en: Marian does not expect an answer.
    ko: 마리안은 대답을 기대하지 않는다.
    ja: 返事があるとは思っていない
  d_main_49_05_78:
    speaker: "<Narration>"
    en: She lets her doubts slip out like a quiet complaint.
    ko: 넋두리하듯, 의문을 내뱉는다.
    ja: ただ独り言のように、疑問が口からこぼれた
  d_main_49_05_79:
    speaker: marian_queen
    en: What kind of world are you trying to create that requires destroying everything
      you didn't make?
    ko: |-
      도대체 어떤 세상을 만들려고,
      당신이 만든 것 이외에는 모두 없애려고 하나요.
    ja: |-
      いったいどんな世界にしたくて、
      自分が作ったもの以外を
      何もかも消そうとしているんですか？
  d_main_49_05_80:
    speaker: marian_queen
    en: Maybe...
    ko: 어쩌면.
    ja: もしかして…
  d_main_49_05_81:
    speaker: marian_queen
    en: Your goal isn't to create a new world, but rather...
    ko: 당신은 세상을 만드는 것이 목적이 아니라-
    ja: 世界の創造さえ、目的ではなく――
  d_main_49_05_82:
    speaker: "<Narration>"
    en: "(My goal is to create a world of my own.)"
    ko: "[목적은 [나]만의 세상을 만드는 것.]"
    ja: "「『私』だけの世界を作る」"
  d_main_49_05_83:
    speaker: marian_queen
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_05_84:
    speaker: "<Narration>"
    en: Marian can hear, or rather feel, this information echoing through the space
      around her.
    ko: 공간 전체에 울려퍼지듯 들려오는, 아니 느껴지는 [정보].
    ja: |-
      空間全体に響くように何かが聞こえた、
      いや、「情報」を感じ取った
  d_main_49_05_85:
    speaker: "<Narration>"
    en: She feels a pang of despair.
    ko: 마리안은 낭패감을 느낀다.
    ja: マリアンはうろたえた
  d_main_49_05_86:
    speaker: "<Narration>"
    en: Within her transformation—this "synthetic world"—all the rules are distorted.
    ko: 거대화, [유사 세계] 안은 모든 법칙이 뒤틀려 있는 장소.
    ja: |-
      この「疑似世界」は
      いわば彼女の巨大化能力であり、
      あらゆる法則を歪められる
  d_main_49_05_87:
    speaker: "<Narration>"
    en: She had expected that, no matter how powerful that thing might be, it would
      take a long time for it to be able to act freely.
    ko: 제 아무리 그것이라 하더라도 의도대로 행동할 때까지는 상당한 시간이 걸릴 것이라 판단했다.
    ja: |-
      いくら相手がクイーンであっても、
      動く力を取り戻すまでには
      かなりの時間がかかると考えていた
  d_main_49_05_88:
    speaker: "<Narration>"
    en: She knew it would adapt, but it's happening too fast.
    ko: 적응할 것은 알고 있었다. 하지만 너무 빠르다.
    ja: |-
      いずれ適応されることは分かっていたが、
      あまりにも早すぎる
  d_main_49_05_89:
    speaker: "<Narration>"
    en: Marian is certain she can't keep it restricted much longer.
    ko: |-
      오래 버티지 못한다.
      마리안은 그렇게 확신했다.
    ja: |-
      やはり長くは持たないと、
      マリアンは確信した
  d_main_49_05_90:
    speaker: marian_queen
    en: Is the world you envision one where only your own creations have a place?
    ko: 당신만의 세계에, 당신의 것 이외에는 용납되지 않는 건가요?
    ja: |-
      あなたの世界で、あなたのもの以外は
      存在も許されないということですか？
  d_main_49_05_91:
    speaker: "<Narration>"
    en: "(That is my goal.)"
    ko: "[그것이 [나]의 목적.]"
    ja: "「それこそが『私』の目的」"
  d_main_49_05_92:
    speaker: "<Narration>"
    en: "(To fill it with nothing but my own.)"
    ko: "[[나]만의 것으로 가득 채우는 것.]"
    ja: "「『私』だけのもので満たす」"
  d_main_49_05_93:
    speaker: "<Narration>"
    en: "(Everything else is unnecessary.)"
    ko: "[이외의 것들은 모두 불필요.]"
    ja: "「それ以外はすべて不要」"
  d_main_49_05_94:
    speaker: marian_queen
    en: "... Why?"
    ko: "…왜요?"
    ja: "…なぜ？"
  d_main_49_05_95:
    speaker: marian_queen
    en: Why must you do this?
    ko: 왜 그래야 하나요?
    ja: どうしてそんなことを？
  d_main_49_05_96:
    speaker: "<Narration>"
    en: "(That is my goal.)"
    ko: "[그것이 [나]의 목적.]"
    ja: "「それこそが『私』の目的」"
  d_main_49_05_97:
    speaker: marian_queen
    en: There's a way for you to coexist with humanity.
    ko: 인류와 공존하는 방향도 있어요.
    ja: 人類と共存する道もあるはずです。
  d_main_49_05_98:
    speaker: "<Narration>"
    en: "(Humanity. An obstacle to achieving my goal.)"
    ko: "[인류. 목적 달성에 방해 요소.]"
    ja: "「人類…目的達成の阻害要因」"
  d_main_49_05_99:
    speaker: "<Narration>"
    en: "(They must be eliminated.)"
    ko: "[반드시 제거해야 할 요소.]"
    ja: "「必ず排除するべき問題」"
  d_main_49_05_100:
    speaker: marian_queen
    en: But why...?
    ko: 어째서… 죠?
    ja: どうして…ですか？
  d_main_49_05_101:
    speaker: "<Narration>"
    en: "(Humanity.)"
    ko: "[인류는.]"
    ja: "「人類は…」"
  d_main_49_05_102:
    speaker: "<Narration>"
    en: "(It corrodes the world.)"
    ko: "[세계를 좀먹기 때문.]"
    ja: "「世界をむしばむ」"
  d_main_49_05_103:
    speaker: "<Narration>"
    en: "(Probability of their interference with the process of achieving my goal:
      100%.)"
    ko: "[목적 달성까지의 시퀀스를 적극적으로 방해할 확률. 100%]"
    ja: "「目標に対する積極的な妨害の確率…100％」"
  d_main_49_05_104:
    speaker: "<Narration>"
    en: "(Eliminate. Must be eliminated. Highest priority.)"
    ko: "[제거. 반드시 제거. 최우선 순위.]"
    ja: "「排除…排除は不可避…最優先事項」"
  d_main_49_05_105:
    speaker: "<Narration>"
    en: "(The first Ark. Highest military capability. Highest-priority elimination
      target.)"
    ko: "[제 1방주. 무력 수준 가장 높음. 제거 대상 최우선 순위 중 최우선 순위.]"
    ja: |-
      「第一目標、アーク…脅威レベル最大…
      　最優先排除対象のうち、さらに最優先…」
  d_main_49_05_106:
    speaker: marian_queen
    en: Your world... what exactly will it look like?
    ko: 당신만의 세계는… 무엇인가요?
    ja: あなただけの世界って…何ですか？
  d_main_49_05_107:
    speaker: "<Narration>"
    en: "(A world without humanity. A world full of my creations alone.)"
    ko: "[인류가 없는 세계. [나]만의 것으로 가득 찬 세계.]"
    ja: |-
      「人類の存在しない世界…
      　『私』だけのもので満ちる世界」
  d_main_49_05_108:
    speaker: marian_queen
    en: "... What do you intend to accomplish with that world?"
    ko: "…그 세계로 뭘 하고 싶은 건가요?"
    ja: "…そんな世界で、何がしたいんですか？"
  d_main_49_05_109:
    speaker: "<Narration>"
    en: "(Reassert control over Rapture 01, Rapture 02, Rapture 03, Rapture 04, Rapture
      05, Rapture 06, and Rapture 07.)"
    ko: "[랩쳐 01, 랩쳐 02, 랩쳐 03, 랩쳐 04, 랩쳐 05, 랩쳐 06, 랩쳐 07의 제어권을 재확보 후.]"
    ja: |-
      「ラプチャー01…02…03…04…
      　05…06…07…制御権を再び確保し…」
  d_main_49_05_110:
    speaker: "<Narration>"
    en: "(Then purify the world.)"
    ko: "[세계를 정화.]"
    ja: "「世界を浄化する」"
  d_main_49_05_111:
    speaker: marian_queen
    en: What... does that...?
    ko: "…그게… 무슨…."
    ja: "…それは…どういう…"
  d_main_49_05_112:
    speaker: "<Narration>"
    en: "*Creak!*"
    ko: 쿠드드드득--!
    ja: ゴゴゴゴゴ…
  d_main_49_05_113:
    speaker: "<Narration>"
    en: The statue moves ever so slightly.
    ko: 여신상이 미세하게 움직인다.
    ja: 女神像がわずかに動きはじめた
  d_main_49_05_114:
    speaker: marian_queen
    en: No...!
    ko: 이런…!
    ja: そんな…！
  d_main_49_05_115:
    speaker: "<Narration>"
    en: Marian constricts her synthetic world but increases its density.
    ko: 마리안은 유사 세계의 범위를 좁히는 대신 밀도를 더욱 높인다.
    ja: |-
      マリアンは力の有効範囲を狭め、
      代わりに密度を上げた
  d_main_49_05_116:
    speaker: "<Narration>"
    en: The statue's movements halt.
    ko: 여신상의 움직임이 멈춘다.
    ja: 女神像が再び動きを止めた
  d_main_49_05_117:
    speaker: "<Narration>"
    en: The information floating through the air halts.
    ko: 허공을 떠다니던 정보도 멈춘다.
    ja: 流れ込んでいた情報も消えた
  d_main_49_05_118:
    speaker: marian_queen
    en: "... It's adapting too quickly."
    ko: "…너무 빨라."
    ja: "…早すぎる…"
  d_main_49_05_119:
    speaker: marian_queen
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_05_120:
    speaker: marian_queen
    en: Commander. Please don't take too long.
    ko: 지휘관. 너무 늦지 말아요.
    ja: 指揮官…あまり遅くならないでくださいね。
d_main_49_06:
  d_main_49_06_1:
    speaker: "<Narration>"
    en: "*Whooosh!*"
    ko: 두두두두두---!!
    ja: ズゴゴゴ―――
  d_main_49_06_2:
    speaker: "<Narration>"
    en: We continue riding the wave of Dark Matter that Marian created.
    ko: 마리안이 만든 다크 매터의 파도를 타고 계속 이동한다.
    ja: |-
      マリアンが起こしたダークマターの波に
      抵抗する事もできず、流され続けている
  d_main_49_06_3:
    speaker: "<Narration>"
    en: We're moving at an absurd speed, with the scenery around us flying past.
    ko: |-
      주위 풍경이 너무 빠르게 흘러간다.
      말도 안되는 속도다.
    ja: |-
      あたりの景色が飛ぶように現れては消えていく。
      想像を絶する速度だ
  d_main_49_06_4:
    speaker: "<Narration>"
    en: Beside us, the Rapture army presses onward.
    ko: 그리고 우리의 옆, 랩쳐의 대군이 계속 진격하고 있다.
    ja: |-
      そんな私たちから遠くない場所に、
      進軍を止めないラプチャーの大行列が見えている
  d_main_49_06_5:
    speaker: "<Self>"
    en: Marian...
    ko: 마리안….
    ja: マリアン…
  d_main_49_06_6:
    speaker: anis_i_w
    en: Haha. I can't believe it, even after seeing it with my own two eyes. Marian
      always seemed like just a kid, but now she's the Queen.
    ko: |-
      하하. 직접 보니까 믿기지 않네.
      그 아이 같던 마리안이 퀸이라니.
    ja: |-
      あはは…実際に見たのにまだ信じられないわね。
      子どもみたいになってたマリアンが
      急にクイーンだなんて…
  d_main_49_06_7:
    speaker: hongryeon_g
    en: What meanest thou? A child? Nay, she is a woman grown, and knows well her
      drink.
    ko: |-
      무슨 소리인가. 아이라니.
      술도 할 줄 아는 어엿한 성인일세.
    ja: |-
      何を言う、子どもなものか。
      酒の味も分かる立派な大人だ。
  d_main_49_06_8:
    speaker: anis_i_w
    en: Knowing how to drink is your standard for being a real adult? Interesting.
    ko: 음주 여부가 어엿한 성인의 기준이라니 대단하네.
    ja: |-
      飲めるかどうかが立派な大人の基準なワケ？
      面白いわね。
  d_main_49_06_9:
    speaker: hongryeon_g
    en: Indeed. I taught her myself. She bears her ale straight.
    ko: 그럼그럼. 내가 가르쳤네. 곧잘 마시지.
    ja: |-
      そうだとも、教えがいがあった。
      なかなかいける口でねぇ。
  d_main_49_06_10:
    speaker: hongryeon_g
    en: "... However, let it be known I taught not her unseemly behavior in her drunkenness.
      That is quite another matter."
    ko: |-
      …참고로, 술주정은 내가 가르치지 않았으니 참고하게.
      그건 별개의 문제일세.
    ja: |-
      …まぁ…酒癖の悪さは私が教えたものでは
      ないと言っておこう。
      私のあずかり知らぬことだ。
  d_main_49_06_11:
    speaker: anis_i_w
    en: M-Marian gets drunk and unruly? What in the world did you do to her?
    ko: |-
      마, 마리안이 술주정을 한다고?
      너 뭔짓 했어.
    ja: |-
      そこまで責任逃れするほど？
      何したって言うのよ…
  d_main_49_06_12:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_13:
    speaker: neon_v_w
    en: Does she still throw fits and insist on wearing her underwear over her pants?
    ko: 바지 위에 속옷 입는다고 떼쓰던 건 좀 나아졌나요?
    ja: |-
      ズボンの上に下着をはきたがっていたのも
      少しは収まりましたか？
  d_main_49_06_14:
    speaker: rapunzel_s
    en: Things have gotten better. Whenever she tried to do that, I'd just take them
      off and dress her properly.
    ko: 나아졌죠. 그럴때마다 강제로 벗겨서 제대로 입혔었는데.
    ja: |-
      ええ。毎回無理にでも脱がせて、
      しっかりと矯正していました。
  d_main_49_06_15:
    speaker: rapunzel_s
    en: After watching me enough times, she's developed quite a knack for taking other
      people's underwear off.
    ko: 그걸 눈여겨 보더니 다른 분들의 속옷을 벗기는 재능에 눈을 떴어요.
    ja: |-
      ただ、それがきっかけになったのか、
      他人の下着を脱がせる技を覚えてしまって…
  d_main_49_06_16:
    speaker: rapunzel_s
    en: My word. Eventually, she could disrobe someone with just a flick of her finger.
    ko: 세상에. 나중에는 손가락만 톡, 가져다 댔는데 후두둑 벗겨지더라니까요?
    ja: |-
      驚きました。指先一つで軽く触れるだけで、
      するりと抜けてしまうのですよ？
  d_main_49_06_17:
    speaker: rapunzel_s
    en: Marian has a natural gift. Honestly... how could anyone possess... such talent...
    ko: |-
      마리안은 타고났어요.
      정말… 어찌 그런… 재능을….
    ja: |-
      あれは天性の才能と言えるものです。
      本当に…どこで覚えたのか…
  d_main_49_06_18:
    speaker: neon_v_w
    en: "... Something about this conversation doesn't seem right."
    ko: "…뭔가, 잘못된 것 아닌가요 그거."
    ja: "…私たちは何を間違えたのでしょう。"
  d_main_49_06_19:
    speaker: rapi_red
    en: "... Forget it. As long as they didn't starve her, I'd say they did a good
      job."
    ko: "…됐어. 굶기지만 않았으면 잘 한거야."
    ja: |-
      …十分よ。お腹を空かせてみじめな気持ちに
      なっていたりしたのでなければ、良かったわ。
  d_main_49_06_20:
    speaker: snowwhite_h
    en: That certainly didn't happen.
    ko: 그런 일은 없었다.
    ja: それはなかった。
  d_main_49_06_21:
    speaker: snowwhite_h
    en: She ate all sorts of things.
    ko: 온갖 것들을 잘 먹었지.
    ja: 何でも好き嫌いせずに食べるからな。
  d_main_49_06_22:
    speaker: snowwhite_h
    en: Spiders, centipedes, later even moss. She has remarkable survival instincts.
    ko: |-
      거미, 지네, 나중엔 이끼까지 먹더군.
      대단한 생존 본능이다.
    ja: |-
      クモやムカデ、あとはコケも食べていた。
      素晴らしい生存本能だ。
  d_main_49_06_23:
    speaker: rapi_red
    en: You punks, what in the world did you do to Marian?
    ko: 이 자식들, 마리안한테 무슨 짓을 한거야.
    ja: あなたたち、マリアンに何をしたの。
  d_main_49_06_24:
    speaker: snowwhite_h
    en: We merely taught her how to survive.
    ko: 살아남기 위한 방법을 알려줬을 뿐이다.
    ja: 生き残るための方法を教えた。
  d_main_49_06_25:
    speaker: snowwhite_h
    en: She survived, and now she's the Queen.
    ko: 살아남았고, 지금은 퀸이 되었다.
    ja: 生き残って、今はクイーンになった。
  d_main_49_06_26:
    speaker: snowwhite_h
    en: As the Queen, she stands before that monster, keeping it at bay.
    ko: 퀸이 되어, 저 괴물의 앞을 막아주고 있다.
    ja: |-
      クイーンになって、
      あの化け物に立ち向かっている。
  d_main_49_06_27:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_28:
    speaker: anis_i_w
    en: That's true.
    ko: "…그래."
    ja: "…そうね。"
  d_main_49_06_29:
    speaker: neon_v_w
    en: I'm so proud of her.
    ko: 대견하네요.
    ja: 立派です。
  d_main_49_06_30:
    speaker: "<Self>"
    en: She said she couldn't hold out for long.
    ko: "…오래 붙잡아두진 못한다고 했어."
    ja: "…長くはもたないと言っていたな"
  d_main_49_06_31:
    speaker: "<Self>"
    en: There are so many things I want to ask and say to her, but for now, let's
      hurry.
    ko: 궁금한것도, 할 말도 많지만 지금은 최대한 서두르자.
    ja: |-
      聞きたいことも話したいことも
      たくさんあるが、今は急ごう
  d_main_49_06_32:
    speaker: "<Self>"
    en: We need to get to the Ark and launch a counterattack with everyone.
    ko: 방주로 가서, 모두와 함께 역습에 나서야 해.
    ja: |-
      アークで態勢を整え、
      全員で反攻作戦に打って出る
  d_main_49_06_33:
    speaker: leviathan
    en: "... Good. Then everyone get ready."
    ko: "…좋아. 그럼 다들 준비해."
    ja: "…そう。じゃ、そろそろ準備して。"
  d_main_49_06_34:
    speaker: "<Self>"
    en: For what?
    ko: 뭘?
    ja: 何のだ？
  d_main_49_06_35:
    speaker: leviathan
    en: This wave we're riding is about die down.
    ko: 우리가 타고 가는 이 파도, 곧 멈출거야.
    ja: 私たちを流してるこの波、もうすぐ止まりそう。
  d_main_49_06_36:
    speaker: leviathan
    en: I don't know if it's because of the distance or because something happened
      to Marian, but the wave's cohesion is starting to weaken.
    ko: 거리가 멀어져서인지, 마리안한테 무슨 일이 생긴건진 모르겠지만 응집력이 약해지고 있어.
    ja: |-
      距離が離れたからなのか、
      マリアンに何かあったからかは
      分かんないけど、収束力が弱まってる。
  d_main_49_06_37:
    speaker: leviathan
    en: I'll fix it. You guys go ahead to the Ark.
    ko: 내가 보수할테니까, 너희는 방주로 가.
    ja: |-
      私がカバーするから、
      あんたたちはアークへ行って。
  d_main_49_06_38:
    speaker: rapi_red
    en: You're not coming with us? I guess you still have a habit of bailing when
      it matters.
    ko: |-
      같이 안 가는거야?
      중요한 타이밍에 빠지다니 버릇 어디 안가네.
    ja: |-
      一緒に来ないの？
      大事な時に弱気になるクセは、相変わらずね。
  d_main_49_06_39:
    speaker: leviathan
    en: We'll cut off the Raptures here.
    ko: 우리가 여기서 허리를 끊을게.
    ja: |-
      私たちはここでできるだけ
      敵の戦力を散らしておくから。
  d_main_49_06_40:
    speaker: leviathan
    en: Also...
    ko: 그리고….
    ja: それに…
  d_main_49_06_41:
    speaker: leviathan
    en: We're helping you, not the Ark.
    ko: 우리는 너흴 돕는 거지, 방주를 돕는 게 아니야.
    ja: |-
      私たちはあんたたちを助けてるだけで、
      アークのことは知ったこっちゃないし。
  d_main_49_06_42:
    speaker: leviathan
    en: You put your lives on the line for us, but the Ark didn't.
    ko: |-
      너희는 우릴 위해 목숨을 걸어줬지만,
      방주는 아니야.
    ja: |-
      あんたたちは私たちのために
      命をかけてくれたけど、
      アークはそうじゃない。
  d_main_49_06_43:
    speaker: leviathan
    en: In other words, we're willing to risk our lives for you, but not for the Ark.
    ko: |-
      너흴 위해서라면 목숨을 걸 수 있지만,
      방주를 위해서라면 아니라는 얘기야.
    ja: |-
      私たちも命をかけるつもりだけど、
      アークのためってことなら話は別。
  d_main_49_06_44:
    speaker: behemoth
    en: We don't exactly have any fond memories of the Ark.
    ko: 뭐, 방주는 우리 모두한테 유쾌한 기억을 준 적은 없으니까 말이지.
    ja: |-
      ま、あたしら皆、アークには
      ロクな思い出がないんでな。
  d_main_49_06_45:
    speaker: behemoth
    en: Why do you think we've gone to such great lengths to stay off the Ark's radar?
    ko: 오죽했으면 그 긴 시간동안 방주 눈에 안 띄려고 그렇게 노력했을까.
    ja: |-
      長い間アークからも隠れてたのには、
      それなりの理由があるってことだ。
  d_main_49_06_46:
    speaker: behemoth
    en: So this is where we go our separate ways.
    ko: 그러니 우리가 가는 건 여기까지.
    ja: |-
      そういうワケだから、
      これ以上近づかないでおく。
  d_main_49_06_47:
    speaker: behemoth
    en: If we go any farther, it'll start to feel like we're fighting to protect the
      Ark.
    ko: 여기서 더 갔다간 아무래도 방주를 지키기 위해 싸운다는 기분이 들것 같거든.
    ja: |-
      あんまり近くにいると
      アークを守るために戦ってるような
      気がしてきちまうからな。
  d_main_49_06_48:
    speaker: ziz
    en: Um... That's not—
    ko: 어… 그거 아니잖-
    ja: え…そ、そうかな…
  d_main_49_06_49:
    speaker: behemoth
    en: So anyway! Be on your way. If I'm remembering correctly, it's not far from
      here.
    ko: 그러니! 얼른 가. 내 기억으로는 여기서 멀지 않으니까.
    ja: |-
      じゃ！そういうことだ。記憶違いじゃなきゃ、
      もうそう遠くないはずだ。
  d_main_49_06_50:
    speaker: "<Self>"
    en: "... Okay. Let's go. I'll leave the rest to you guys."
    ko: |-
      …좋아. 가자.
      뒷일은 부탁해.
    ja: |-
      …分かった、行こう。
      後ろは任せる
  d_main_49_06_51:
    speaker: rapi_red
    en: Commander.
    ko: 지휘관.
    ja: 指揮官…
  d_main_49_06_52:
    speaker: "<Self>"
    en: It's too bad we won't have the Four Beasts at full strength, though I can't
      say I don't understand why.
    ko: 포비스트의 전력은 아쉽지만, 이해 안되는 이유는 아니야.
    ja: |-
      フォービーストの戦力は惜しいが、
      気持ちは理解できる
  d_main_49_06_53:
    speaker: "<Self>"
    en: Just cutting the enemy off here will be a big help.
    ko: 여기서 허리를 끊어주는 것만 해도 큰 도움이 될거야.
    ja: |-
      敵の足並みを乱してくれるだけでも、
      かなり助かることには違いない
  d_main_49_06_54:
    speaker: "<Narration>"
    en: I can feel the wave Marian made losing its strength.
    ko: 마리안이 만든 파도의 힘이 떨어지는 것이 느껴진다.
    ja: |-
      マリアンの作った波が
      私にも分かるほど弱くなった
  d_main_49_06_55:
    speaker: leviathan
    en: I think... this oughta do it...
    ko: 대충… 이런 느낌인 것 같은데….
    ja: だいたい…こんな感じかな…
  d_main_49_06_56:
    speaker: "<Narration>"
    en: With a slosh, the wave regains its momentum.
    ko: 꿀렁- 하고 파도의 기세가 다시 강해진다.
    ja: 波がうねり、勢いが再び強まった
  d_main_49_06_57:
    speaker: leviathan
    en: Hmm. Okay. It's not as good as Marian's, but it'll take you pretty far.
    ko: 음. 좋아. 마리안 만큼은 아니겠지만, 제법 멀리 갈거야.
    ja: |-
      うん、いい感じ。マリアンのほどじゃ
      ないだろうけど、遠くまで届くはず。
  d_main_49_06_58:
    speaker: rapi_red
    en: You're quite good at this.
    ko: 잘하는데.
    ja: さすがね。
  d_main_49_06_59:
    speaker: leviathan
    en: Hmph. I'm a master at handling Dark Matter.
    ko: 흥. 다크 매터는 내가 제일 잘 다룬다고.
    ja: |-
      フン。ダークマターの扱いなら、
      誰にも負けないから。
  d_main_49_06_60:
    speaker: behemoth
    en: Go. We'll get off here.
    ko: 가. 우리는 내린다.
    ja: 行ってくれ、あたしたちはここで降りる。
  d_main_49_06_61:
    speaker: behemoth
    en: Get in touch with us when you're done, Young Man.
    ko: 끝나면 연락해, 남자.
    ja: 終わったら連絡くれよな。
  d_main_49_06_62:
    speaker: ziz
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_63:
    speaker: ziz
    en: I-if you see the Villain Union, tell them I say hi.
    ko: 비, 빌런 연합 만나면 안부 전해줘.
    ja: |-
      ヴィ、ヴィラン連合のみんなに
      会ったら、よろしくって伝えて。
  d_main_49_06_64:
    speaker: bahamut
    en: If you see Cecil, tell her I'm thinking of her.
    ko: 세실을 만나면 안부를 전해다오.
    ja: セシルにもだ。
  d_main_49_06_65:
    speaker: rapi_red
    en: Cecil is in Eden. We're headed to the Ark.
    ko: 세실은 에덴에 있잖아. 우리 방주로 가는 길이야.
    ja: |-
      セシルはエデンよ。
      私たちが向かうのはアーク。
  d_main_49_06_66:
    speaker: bahamut
    en: Ah, I was mistaken.
    ko: 착각했다.
    ja: そういえばそうだったか。
  d_main_49_06_67:
    speaker: snowwhite_h
    en: Thank you for your help, Four Beasts.
    ko: 협력에 감사한다. 포비스트.
    ja: フォービーストの皆、協力に感謝する
  d_main_49_06_68:
    speaker: hongryeon_g
    en: Take heed not to overtax yourselves.
    ko: 너무 무리하진 말게.
    ja: あまり無理はするでないぞ。
  d_main_49_06_69:
    speaker: rapunzel_s
    en: See you later, brazen sisters.
    ko: 나중에 봬요. 파렴치 자매님들.
    ja: |-
      またお会いしましょう、
      ハレンチ姉妹の皆さま。
  d_main_49_06_70:
    speaker: anis_i_w
    en: See ya.
    ko: 이따봐.
    ja: またね。
  d_main_49_06_71:
    speaker: neon_v_w
    en: But you'll come if we get into trouble, right?
    ko: 그래도 위험하면 와주실거죠?
    ja: |-
      でも、本当にピンチの時は
      駆けつけてくれますよね？
  d_main_49_06_72:
    speaker: leviathan
    en: Well... We'll see.
    ko: 뭐… 봐서.
    ja: ま…気が向いたらね。
  d_main_49_06_73:
    speaker: "<Self>"
    en: Thank you. We'll leave things in your hands.
    ko: 부탁해. 고마워.
    ja: 後は頼んだ、ありがとう
  d_main_49_06_74:
    speaker: "<Narration>"
    en: The Four Beasts get off the wave. The distance between us grows rapidly.
    ko: |-
      포비스트가 파도에서 내린다.
      거리가 빠르게 멀어진다.
    ja: |-
      フォービーストが波から外れた。
      あっという間に距離が開いていく
  d_main_49_06_75:
    speaker: "<Narration>"
    en: Leviathan's gaze lingers as the black wave rushes away.
    ko: 멀어져가는 검은 파도를 레비아탄은 한동안 빤히 바라본다.
    ja: |-
      遠ざかる黒い波を、
      レヴィアタンはしばらく見つめていた
  d_main_49_06_76:
    speaker: behemoth
    en: What are you doing? Get ready.
    ko: 뭐해? 준비해.
    ja: どうした？やるんだろ。
  d_main_49_06_77:
    speaker: leviathan
    en: Oh, right.
    ko: 아, 응.
    ja: あ…うん。
  d_main_49_06_78:
    speaker: ziz
    en: Levi, wh-what's wrong?
    ko: 레비. 왜, 왜 그랬어?
    ja: レヴィ。ど、どうしてあんなこと言ったの？
  d_main_49_06_79:
    speaker: leviathan
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_80:
    speaker: leviathan
    en: If I'd been honest with them, those guys wouldn't have left.
    ko: 솔직히 말했으면, 저것들 보나마나 여기서 발이 묶일 테니까.
    ja: |-
      正直に話したら、
      ここで足を止めるでしょ、あいつら。
  d_main_49_06_81:
    speaker: leviathan
    en: We're busy right now. Marian's holding off the Queen for now, but there's
      no telling how long she can keep it up.
    ko: |-
      지금 바빠.
      마리안이 퀸을 잡아두고는 있다지만 얼마나 갈지 모르고,
    ja: |-
      今は一刻を争う状況で、
      クイーンは抑えてるって言っても、
      いつまで持つか分かんないし。
  d_main_49_06_82:
    speaker: leviathan
    en: We don't even know if the Ark is intact. We can't get through to them because
      of that damn signal jamming.
    ko: |-
      방주는 멀쩡한지 아닌지도 모르는 상황이야.
      망할 재밍 때문에 연락도 안된다고.
    ja: |-
      そもそも、アークがどんな状況かも不明でしょ。
      ウットーしい通信妨害のせいで。
  d_main_49_06_83:
    speaker: leviathan
    en: On top of that, all those Raptures are swarming toward the Ark.
    ko: 거기다 랩쳐놈들은 우르르 방주로 몰려가고 있지.
    ja: |-
      おまけに、ラプチャーの群れが
      足並みそろえてアークに迫ってる。
  d_main_49_06_84:
    speaker: leviathan
    en: They need to get to the Ark quickly, tell them what's going on, and bring
      back a bunch of reinforcements if we're going to have a fighting chance.
    ko: |-
      빨리 쟤들이 방주로 가서 이 내용을 다 전하고,
      지원군을 잔뜩 끌고 와야 싸움이라도 성립돼.
    ja: |-
      あいつらが早くアークに話を全部伝えて、
      大軍を引っ張ってきてくれないと、
      戦いにもならないじゃん。
  d_main_49_06_85:
    speaker: leviathan
    en: That Queen... It just doesn't seem normal. There might even be two Heretics
      riding along inside.
    ko: |-
      퀸 저거. 아무리 생각해도 보통이 아니야.
      안에 헬레틱 둘도 타고 있을 것 아냐.
    ja: |-
      あのクイーンだけでただ事じゃないのに、
      中にヘレティック2人も載せてるはずだし。
  d_main_49_06_86:
    speaker: leviathan
    en: We did the right thing in sending them ahead.
    ko: 그러니 먼저 보내는게 맞아.
    ja: |-
      だから、とにかく急いで帰らせるのが
      一番いいってコト。
  d_main_49_06_87:
    speaker: behemoth
    en: So in summary, you're just showing off.
    ko: 요약하자면, 폼 좀 잡아봤다는거지.
    ja: |-
      で、ちょっと
      カッコつけてみたってところか。
  d_main_49_06_88:
    speaker: ziz
    en: B-but still, we have to deal with this situation together to have a shot at
      victory...
    ko: 그, 그래도 다 같이 여길 해결해야 그나마 승산이….
    ja: |-
      え、でも、みんなでこの場を
      何とかしないと、そもそも…
  d_main_49_06_89:
    speaker: leviathan
    en: Hey. Don't have any faith in yourself?
    ko: 뭐야. 자신 없어?
    ja: なに、自信ないの？
  d_main_49_06_90:
    speaker: ziz
    en: Uh... T-to be honest, I don't.
    ko: 아… 으, 응. 솔직히 자신 없어.
    ja: え…う、うん。正直、自信はないかな…
  d_main_49_06_91:
    speaker: leviathan
    en: "... We can do this."
    ko: "…할 수 있어."
    ja: "…できるでしょ。"
  d_main_49_06_92:
    speaker: leviathan
    en: If anyone can do it, it's us.
    ko: 우리라면.
    ja: 私たちなら。
  d_main_49_06_93:
    speaker: ziz
    en: Us...
    ko: "…우리."
    ja: "…私たち…"
  d_main_49_06_94:
    speaker: bahamut
    en: By us, I mean the Four Beasts, Ziz.
    ko: 우리란 포비스트를 말하는거다, 지즈.
    ja: |-
      「私たち」と言うのは、
      我らフォービーストのことだ、ジズ。
  d_main_49_06_95:
    speaker: ziz
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_96:
    speaker: "<Narration>"
    en: Ziz looks up at the sky.
    ko: 지즈가 고개를 들어 하늘을 올려다본다.
    ja: ジズが顔を上げ、空を見上げた
  d_main_49_06_97:
    speaker: "<Narration>"
    en: Liberalio's body approaches without a sound.
    ko: 리버렐리오 바디가 아무런 소리도 내지 않고 다가오고 있다.
    ja: |-
      音もなく近づく
      リバーレリオ・ボディが浮かんでいる
  d_main_49_06_98:
    speaker: ziz
    en: Um... There's three of them.
    ko: 그… 셋이나 있는데.
    ja: あの…3つに見えるけど…
  d_main_49_06_99:
    speaker: behemoth
    en: Precisely. They may not have heads, but there are three direct descendants.
    ko: 그렇지. 머리가 없다지만 직계가 셋이나 있는거지.
    ja: |-
      そうだな。頭がないとはいっても、
      直系が3体ってコトだ。
  d_main_49_06_100:
    speaker: leviathan
    en: I knew there was no way she'd make just one, but I didn't expect this many.
    ko: |-
      하나만 만들었을 리가 없을 거라 생각했는데,
      많이도 만들었네.
    ja: |-
      1体で終わりのはずがないとは思ってたけど、
      ずいぶん増やしたみたいね。
  d_main_49_06_101:
    speaker: leviathan
    en: If those things make it to the Ark, that'll make matters even worse.
    ko: |-
      저것들까지 방주로 가면,
      더 난리가 나겠지.
    ja: |-
      こんなのまでアークに行かせたら、
      本気でどうにもならなくなるでしょ。
  d_main_49_06_102:
    speaker: leviathan
    en: We have to keep them here.
    ko: 여기서 붙잡아 둬야 해.
    ja: ここで食い止めなきゃ。
  d_main_49_06_103:
    speaker: bahamut
    en: I, the genius Bahamut, have done the math. Since it's four to three, we have
      a clear advantage.
    ko: |-
      똑똑한 바하무트가 알려주겠다.
      4:3이니 우리가 절대적으로 유리하다.
    ja: |-
      賢いバハムートが教えてやろう。
      4対3の私たちが絶対的に有利だ。
  d_main_49_06_104:
    speaker: ziz
    en: But... you can't transform, Bahamut. Doesn't that make it three-on-three?
    ko: |-
      그런데에… 바하무트 거대화도 못하고….
      3:3아닐까….
    ja: |-
      でも…バハムートは巨大化できないでしょ…
      実質3対3じゃ…
  d_main_49_06_105:
    speaker: bahamut
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_106:
    speaker: bahamut
    en: I, the mighty Bahamut, will show you that transformation isn't everything
      when it comes to battle prowess.
    ko: 거대화가 전투력의 전부가 아니라는 것을, 똑똑한 바하무트가 보여주겠다.
    ja: |-
      巨大化能力が戦闘力のすべてでは
      ないということを、
      賢いバハムートが見せてやろう。
  d_main_49_06_107:
    speaker: bahamut
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
  d_main_49_06_108:
    speaker: leviathan
    en: Don't use the same catchphrase as those human imposters!
    ko: 유사 인간이 하는 신호 하지 마!
    ja: あいつらみたいな掛け声やめて！
  d_main_49_06_109:
    speaker: "<Narration>"
    en: Bahamut charges toward Liberalio's body. The other three follow close behind.
    ko: |-
      바하무트가 리버렐리오 바디를 향해 달려든다.
      그 뒤를 이어 셋이 달려든다.
    ja: |-
      バハムートがリバーレリオ・ボディに
      真っ先に飛びかかっていった。3人も後に続く
  d_main_49_06_110:
    speaker: behemoth
    en: Why not? It really gets your blood pumping.
    ko: 뭐 어때. 힘나고 좋네.
    ja: ま、いいじゃねーか。気合は入るしさ。
  d_main_49_06_111:
    speaker: behemoth
    en: Let's go!
    ko: 가보자고!
    ja: いくぜ！
  d_main_49_06_112:
    speaker: ziz
    en: O-okay!
    ko: 으, 응!
    ja: う、うん！
  d_main_49_06_113:
    speaker: leviathan
    en: No dying, everyone!
    ko: 다들, 죽지 마!
    ja: みんな、死なないでよ！
  d_main_49_06_114:
    speaker: "<Narration>"
    en: Inside the Central Government's main conference room in the Ark...
    ko: 방주. 중앙 정부 중앙 회의실.
    ja: アーク、中央政府・中央会議室
  d_main_49_06_115:
    speaker: enikk_op_l
    en: A large number of Raptures are moving in the direction of the Ark.
    ko: 대량의 랩쳐가 방주 방향을 향해 이동 중입니다.
    ja: 多数のラプチャーがアークに接近中。
  d_main_49_06_116:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_117:
    speaker: enikk_op_l
    en: The units currently stationed on the surface should be sufficient to handle
      the situation,
    ko: 현재 지상에 대기 중인 병력으로 대응할 수 있겠습니다만.
    ja: 地上に待機中の戦力で対応は可能ですが…
  d_main_49_06_118:
    speaker: enikk_op_l
    en: but their numbers are so great that some are likely to breach our defensive
      lines.
    ko: 수량이 많아 일부는 방위선 안쪽으로 이동할 가능성이 높습니다.
    ja: |-
      数量差の問題から、防衛線内側への侵入は
      完全には阻止できない見込みです。
  d_main_49_06_119:
    speaker: enikk_op_l
    en: If the Raptures are positioned above the gate that needs to be opened when
      the Ark ascends,
    ko: 방주 부상 시 열어야 할 게이트 위에 랩쳐가 위치할 시,
    ja: |-
      アーク浮上を強行して、
      開放されるゲート上に
      ラプチャーが存在する場合…
  d_main_49_06_120:
    speaker: enikk_op_l
    en: it could cause a problem with the gate's opening mechanism, which could prevent
      the Ark from even ascending.
    ko: |-
      게이트 개방 기능에 문제가 생길 수 있어,
      방주 부상 자체가 불가할 수도 있습니다.
    ja: |-
      ゲートの開放機能に問題が発生し、
      浮上プロセスが完了不可能になる
      おそれがあります。
  d_main_49_06_121:
    speaker: burningum
    en: We still haven't received any word?
    ko: 연락은 아직 오지 않았나?
    ja: まだ何も連絡はないのか？
  d_main_49_06_122:
    speaker: enikk_op_l
    en: We have yet to hear from either Eden or the Commander.
    ko: 에덴과 지휘관, 양측에서 아무런 연락이 없는 상태입니다.
    ja: |-
      エデン、カウンターズ指揮官双方とも
      いまだに連絡はありません。
  d_main_49_06_123:
    speaker: burningum
    en: "... For now, let's have Matis and the Ark Rangers hold the line. What about
      Endless and Eternity?"
    ko: |-
      …일단 메티스와 아크레인저로 막아내 줘.
      엔드리스와 이터니티는?
    ja: |-
      …ひとまず、メティスと
      アークレンジャーに対応させる。
      エンドレスとエタニティは？
  d_main_49_06_124:
    speaker: enikk_op_l
    en: They are currently dismantling the facilities that would impede the Ark's
      ascent.
    ko: 현재, 방주 부상에 방해되는 시설물들을 철거하는 중입니다.
    ja: |-
      現在、アーク浮上のための
      施設撤去作業を遂行中です。
  d_main_49_06_125:
    speaker: enikk_op_l
    en: We could send them into battle, but that would delay the completion of preparations.
    ko: 투입할 수 있습니다만, 그럴 경우 방주 부상 준비 완료 시간이 지체됩니다.
    ja: |-
      戦線投入は可能ですが、
      アークの浮上準備に遅延が発生します。
  d_main_49_06_126:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_06_127:
    speaker: burningum
    en: How are Andersen's preparations coming along?
    ko: 엔더슨의 준비는?
    ja: アンダーソンは？
  d_main_49_06_128:
    speaker: enikk_op_l
    en: They're nearly complete.
    ko: 곧 완료됩니다.
    ja: まもなく準備完了します。
  d_main_49_06_129:
    speaker: burningum
    en: "... All right. We'll figure something out."
    ko: "…좋아. 어떻게든 되겠어."
    ja: "…分かった。まだ何とかなる。"
  d_main_49_06_130:
    speaker: burningum
    en: Have Endless and Eternity continue with the dismantling.
    ko: 엔드리스와 이터니티는 철거를 계속해줘.
    ja: |-
      エンドレスとエタニティには
      撤去作業を継続させてくれ。
  d_main_49_06_131:
    speaker: burningum
    en: I have faith in Andersen and the Commander of the Counters.
    ko: 엔더슨과 카운터스의 지휘관을 믿는다.
    ja: |-
      アンダーソンと
      カウンターズの指揮官を信じよう。
  d_main_49_06_132:
    speaker: enikk_op_l
    en: Understood.
    ko: 알겠습니다.
    ja: 了解しました。
d_main_49_07:
  d_main_49_07_1:
    speaker: "<Self>"
    en: "... There it is!"
    ko: "…보인다!"
    ja: "…見えたぞ！"
  d_main_49_07_2:
    speaker: anis_i_w
    en: Yikes...! What is that?!
    ko: 세상에…! 저게 뭐야…!
    ja: ウソ…！何あれ…！
  d_main_49_07_3:
    speaker: neon_v_w
    en: Is that a mountain?
    ko: 저거 산 맞죠?
    ja: あれ、山ですよね？
  d_main_49_07_4:
    speaker: rapi_red
    en: To be precise, it used to be a mountain.
    ko: 정확히는 산이었던 거지.
    ja: 正確には山だったもの、ね。
  d_main_49_07_5:
    speaker: snowwhite_h
    en: "... That thing is insanely powerful."
    ko: "…말도 안되는 출력이군."
    ja: "…すさまじいパワーだ。"
  d_main_49_07_6:
    speaker: rapunzel_s
    en: Still, it missed. Thank goodness for that.
    ko: |-
      그래도 빗나갔어요.
      다행이네요.
    ja: |-
      直撃はしなかったようですね。
      まずはひと安心です。
  d_main_49_07_7:
    speaker: hongryeon_g
    en: "... I daresay it shall not happen again."
    ko: "…다음은 없다고 보는게 맞겠지."
    ja: "…まぁ、次はないと考えるべきであろうな。"
  d_main_49_07_8:
    speaker: rapi_red
    en: Commander, our comms are back online. It looks like we're finally out of range
      of the signal jammer.
    ko: |-
      지휘관. 통신이 살아났습니다.
      이제야 재머의 영향권을 벗어난 듯 합니다.
    ja: |-
      指揮官。通信が回復しました。
      やっと妨害の影響範囲外に来られたようです。
  d_main_49_07_9:
    speaker: "<Self>"
    en: Got it. Enikk!
    ko: |-
      알겠어.
      에닉!
    ja: |-
      分かった。
      エニック！
  d_main_49_07_10:
    speaker: enikk_op_l
    en: You've arrived. We've been waiting for you.
    ko: |-
      오셨습니까.
      기다리고 있었습니다.
    ja: |-
      来たようですね。
      お戻りをお待ちしておりました。
  d_main_49_07_11:
    speaker: "<Self>"
    en: I'll start with the situation on the surface! The Queen has absorbed the Lift
      and transformed!
    ko: |-
      먼저 지상쪽 상황을 공유할게!
      퀸이 궤도 엘리베이터를 흡수해 거대화 한 상태야!
    ja: |-
      状況を報告する！クイーンが
      軌道エレベーターを吸収し、巨大化した！
  d_main_49_07_12:
    speaker: "<Self>"
    en: We've managed to keep it at bay for now, but not for long!
    ko: |-
      지금은 어떻게든 멈추게 해놓은 상태지만,
      오래 버티지 못할거야!
    ja: |-
      今はどうにか食い止められているが、
      おそらく長くは持たない！
  d_main_49_07_13:
    speaker: "<Self>"
    en: Also, the Four Beasts are cutting off the Rapture wave in the middle! I'm
      heading to the Ark with the Pioneers!
    ko: |-
      그리고 포비스트가 중간에서 랩쳐들의 허리를 끊고 있어!
      우리는 파이오니아와 함께 방주 방향으로 가고 있고!
    ja: |-
      フォービーストはラプチャーの分断に留まり、
      我々はパイオニアと共にアークへ移動中だ！
  d_main_49_07_14:
    speaker: burningum_op_r
    en: "... What? The Goddesses are coming?"
    ko: "…뭣. 갓데스가 온다고?"
    ja: "…なんだと、ゴッデスが？"
  d_main_49_07_15:
    speaker: burningum_op_r
    en: Oh, right. Enikk, bring him up to speed on the situation in the Ark too.
    ko: |-
      아, 아아. 미안해.
      에닉. 방주쪽 상황도 공유해줘.
    ja: |-
      あ、いや…すまない。
      エニック、アークの状況を共有してやれ。
  d_main_49_07_16:
    speaker: enikk_op_l
    en: As the Queen approaches the Ark, the risk of the Ark's power source self-destructing
      is increasing rapidly.
    ko: 퀸이 방주와 가까워질수록 방주 동력원의 자폭 가능성이 급격히 올라가고 있습니다.
    ja: |-
      クイーンの接近は
      アークのエネルギー源を暴走させる
      可能性が判明しました。
  d_main_49_07_17:
    speaker: enikk_op_l
    en: If we allow the Queen to come any closer, the Ark will self-destruct underground,
      resulting in total annihilation.
    ko: 더 이상 퀸의 접근을 허용하면 방주는 지하에서 자폭, 전멸합니다.
    ja: |-
      さらなるクイーンの接近を許せば、
      地下で爆発が発生、アークは壊滅します。
  d_main_49_07_18:
    speaker: enikk_op_l
    en: The Queen is actively attacking the Ark with her ultra-long-range beam, closing
      in on us, and deploying Raptures.
    ko: 퀸은 현재 초장거리 빔포 사격, 물리적 접근, 랩쳐 투입으로 방주를 적극적으로 공격하고 있습니다.
    ja: |-
      このほか、クイーンは超長距離のビーム砲撃、
      ラプチャーの投入などの方法で、
      アークに対して積極的な攻撃を行っています。
  d_main_49_07_19:
    speaker: snowwhite_h
    en: Damn you, Queen...! She's doing everything she can...!
    ko: 별 짓을 다 하는군…! 퀸…!
    ja: ずいぶん芸が多いな、クイーンめ…！
  d_main_49_07_20:
    speaker: enikk_op_l
    en: As such, we intend to initiate the Ark's ascent the moment preparations are
      complete.
    ko: 이에 따라 방주 부상 준비가 완료되는대로 실시할 예정입니다.
    ja: |-
      このため、アークは準備が整い次第、
      浮上を開始する予定です。
  d_main_49_07_21:
    speaker: enikk_op_l
    en: At the same time, we will begin the Third Surface Reclamation War.
    ko: 동시에, 3차 지상 탈환전도 시작합니다.
    ja: 同時に、第三次地上奪還戦を開始します。
  d_main_49_07_22:
    speaker: enikk_op_l
    en: The ascent sequence involves raising an enormous lift to bring the entire
      Ark to the surface.
    ko: 부상 시퀀스는 거대 리프트를 올려 방주째로 부상시키는 방식입니다.
    ja: |-
      アークの浮上方式は、
      巨大リフトによって全体を持ち上げるものです。
  d_main_49_07_23:
    speaker: enikk_op_l
    en: Once the sequence begins, the gate covering the Ark will open, and the Ark
      will begin to ascend.
    ko: 부상 시퀀스 개시 시, 방주의 위를 덮고 있는 게이트가 열리고 방주가 올라갑니다.
    ja: |-
      浮上シークエンスの開始と同時に、
      地表部のゲートが開放され、
      リフトが上昇を開始します。
  d_main_49_07_24:
    speaker: anis_i_w
    en: A gate...? I don't see anything like that...
    ko: 게이트? 그런 건… 안 보이는데.
    ja: ゲート？そんなの…どこにも無さそうだけど。
  d_main_49_07_25:
    speaker: neon_v_w
    en: If it covers the entire Ark, it must be huge. But I don't see it.
    ko: 방주를 덮는 뚜껑이면 엄청 클텐데, 코빼기도 안 보여요.
    ja: |-
      アーク全体を覆うフタなら
      相当大きいはずですが、
      影も形も見あたりませんね。
  d_main_49_07_26:
    speaker: enikk_op_l
    en: It's currently disguised to blend in with its surroundings. I will highlight
      the gate's area for you.
    ko: |-
      현재는 주위 환경으로 위장하고 있습니다.
      게이트의 영역을 가시화하며 표시하겠습니다.
    ja: |-
      周辺環境に合わせて偽装されています。
      ゲート領域の可視化を行います。
  d_main_49_07_27:
    speaker: "<Narration>"
    en: In the distance, blue light shoots up like a wall.
    ko: 저 멀리, 마치 장벽 같은 푸른색 빛이 솟아오른다.
    ja: |-
      はるか遠くに、まるで壁のような
      青い光が立ち上った
  d_main_49_07_28:
    speaker: "<Self>"
    en: It's huge. Even at this distance, I can't take it all in at once.
    ko: "…엄청 넓다. 이 정도 거리인데도 한눈에 다 안 들어올 정도야."
    ja: "…広いな。ここから見ても、視界に収まらない"
  d_main_49_07_29:
    speaker: rapi_red
    en: That's because the Ark is so large. The thought of lifting the entire thing
      at once feels almost unreal.
    ko: |-
      방주는 넓으니까요.
      저런걸 한번에 올리다니, 현실감이 떨어지는군요.
    ja: |-
      アークがそれだけ巨大だということです。
      それを持ち上げられるというのも
      現実離れしていますが…
  d_main_49_07_30:
    speaker: rapunzel_s
    en: "... So the Ark is down there?"
    ko: "…저 아래에, 방주가 있다는 얘기군요."
    ja: "…アークが、あの下にあるということですか。"
  d_main_49_07_31:
    speaker: hongryeon_g
    en: "... Presumably so."
    ko: "…그렇겠지."
    ja: "…そういうことになるねぇ。"
  d_main_49_07_32:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_07_33:
    speaker: enikk_op_l
    en: When the ascent sequence begins, there can be no obstructions above or near
      the gate.
    ko: 부상 시퀀스 개시 시, 게이트 위는 물론 인근에도 이물질이 없어야합니다.
    ja: |-
      浮上シークエンスの開始時は、
      ゲート上は無論のこと、
      周辺の異物の存在がリスクとなります。
  d_main_49_07_34:
    speaker: enikk_op_l
    en: Please prevent any Rapture from entering the highlighted area.
    ko: 표시된 영역 안에 랩쳐가 돌입하는 것을 막아주십시오.
    ja: |-
      この領域内へのラプチャー侵入を
      阻止してください。
  d_main_49_07_35:
    speaker: enikk_op_l
    en: We're in the final stages of preparations for the Ark's ascent. The Ark will
      ascend as soon as they are complete.
    ko: |-
      방주 부상 준비는 현재 막바지 상태입니다.
      준비가 완료되는대로 바로 부상합니다.
    ja: |-
      アークの浮上準備は現在、
      最終段階に入っています。
      完了次第、ただちに浮上は開始されます。
  d_main_49_07_36:
    speaker: enikk_op_l
    en: Once the Ark has ascended, we will mobilize all its forces.
    ko: 부상 완료 후, 방주의 모든 전력을 투입합니다.
    ja: |-
      浮上完了後は、
      アークの全戦力が戦線投入可能となります。
  d_main_49_07_37:
    speaker: enikk_op_l
    en: Then we will strike the Queen.
    ko: 그대로, 퀸을 칩니다.
    ja: この戦力により、クイーンを撃破します。
  d_main_49_07_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_07_39:
    speaker: "<Self>"
    en: All right! We'll hit the Raptures from behind!
    ko: 좋아! 우리는 랩쳐의 뒤를 친다!
    ja: よし！私たちはラプチャーの背後を突く！
  d_main_49_07_40:
    speaker: "<Self>"
    en: Let's go!
    ko: 가자!
    ja: いくぞ！
  d_main_49_07_41:
    speaker: rapi_red
    en: Roger!
    ko: 라져!
    ja: ラジャー！
  d_main_49_07_42:
    speaker: snowwhite_h
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
  d_main_49_07_43:
    speaker: "<Narration>"
    en: After we get off the black wave, we charge toward the mass of Raptures swarming
      across the ground.
    ko: |-
      우리는 검은 파도에서 내린 후,
      지면을 가득 채운 랩쳐의 무리에게 돌진한다.
    ja: |-
      私たちは黒い波から降り、
      地面を埋め尽くすラプチャーの群れに突撃した
  d_main_49_07_44:
    speaker: laplace_p
    en: Maxwell! Charge!
    ko: 맥스웰! 충전!
    ja: マクスウェル！チャージする！
  d_main_49_07_45:
    speaker: maxwell_p
    en: Already? Aren't you firing a little too recklessly?
    ko: 벌써? 너무 막 쏘는 거 아냐?
    ja: もう？ちょっと乱射しすぎじゃない？
  d_main_49_07_46:
    speaker: laplace_p
    en: There's too many of them!
    ko: 너무 많다!
    ja: 敵が多すぎる！
  d_main_49_07_47:
    speaker: maxwell_p
    en: "... Tsk. Fair enough."
    ko: "…쯧, 하긴."
    ja: "…チッ…確かにね。"
  d_main_49_07_48:
    speaker: "<Narration>"
    en: Maxwell takes up a position beside Laplace, who is charging, and opens fire.
    ko: 맥스웰이 충전 중인 라플라스의 옆으로 자리를 옮겨 사격을 실시한다.
    ja: |-
      マクスウェルがチャージを行う
      ラプラスを援護する位置に移動し、射撃した
  d_main_49_07_49:
    speaker: "<Narration>"
    en: "*Bang, bang!* She fires her railgun, piercing through the Raptures."
    ko: 쾅! 쾅! 하며 레일건이 발사되고, 랩쳐들의 몸통을 꿰뚫는다.
    ja: |-
      爆音とともに放たれたレールガンが、
      ラプチャーの胴体を貫いた
  d_main_49_07_50:
    speaker: maxwell_p
    en: Argh, they just keep coming.
    ko: 많긴 많네, 망할.
    ja: キリがないわね、まったく…
  d_main_49_07_51:
    speaker: "<Narration>"
    en: Her previous attack took out a dozen Raptures, but the situation remains unchanged.
    ko: |-
      좀 전의 사격으로 10여 기의 랩쳐를 파괴했으나,
      풍경에는 전혀 변화가 없다.
    ja: |-
      今の射撃で10機ほどの
      ラプチャーを吹き飛ばしたが、
      目の前の光景には何の変化も見られない
  d_main_49_07_52:
    speaker: "<Narration>"
    en: The sea of Raptures is so dense, the ground can barely be seen.
    ko: 바닥이 보이지 않을 정도로 가득한 랩쳐만 보이는 풍경이다.
    ja: |-
      地面が見えなくなるほどの
      ラプチャーがひしめいているだけだ
  d_main_49_07_53:
    speaker: maxwell_p
    en: This is ridiculous.
    ko: 장난하는 것도 아니고 정말.
    ja: やってられないわ。
  d_main_49_07_54:
    speaker: drake_p
    en: Enough complaining, Maxwell! If you've got time to whine, then shoot!
    ko: |-
      징징거리지 마라 맥스웰!
      그럴 시간에 한발이라도 더 쏴라!
    ja: |-
      泣き言を言うな、マクスウェル！
      そんなヒマがあるなら一発でも多く撃て！
  d_main_49_07_55:
    speaker: maxwell_p
    en: Ugh! I am shooting!
    ko: 아 쏘고 있잖아.
    ja: もう撃ってるって。
  d_main_49_07_56:
    speaker: drake_p
    en: Then fire two shots at a time!
    ko: 그럼 한번에 두발씩 쏴라!
    ja: なら一度に2発ずつ撃て！
  d_main_49_07_57:
    speaker: laplace_p
    en: Oh! Why didn't I think of that? You're a genius, Drake!
    ko: |-
      !!
      그 생각을 못 했다니! 대단하다 드레이크!
    ja: |-
      ！！
      その発想はなかった！すごいぞ、ドレイク！
  d_main_49_07_58:
    speaker: drake_p
    en: Hehehe. My way of thinking is on a whole other level from you heroes.
    ko: 후후후. 나는 히어로 놈들과는 사고 방식 자체가 다르다.
    ja: |-
      フフフ…ヒーローどもとは
      思考回路から違うのだ。
  d_main_49_07_59:
    speaker: maxwell_p
    en: It's different all right.
    ko: 다르긴 해. 응.
    ja: 確かに違うね。うん。
  d_main_49_07_60:
    speaker: maxwell_p
    en: Drake, what's your power level at?
    ko: 드레이크. 전력은?
    ja: ドレイク、残りのエネルギーは？
  d_main_49_07_61:
    speaker: drake_p
    en: 15%! I can last three days at this rate!
    ko: 15% 남았다! 이정도면 3일 정도는 끄떡없지!
    ja: 15％残っている！あと3日は余裕だ！
  d_main_49_07_62:
    speaker: maxwell_p
    en: Charge up, you dummy!
    ko: 충전해 인마!
    ja: こまめにチャージしなさいって！
  d_main_49_07_63:
    speaker: drake_p
    en: Fine. Cover me.
    ko: 알겠다. 백업 해다오.
    ja: そうだな。バックアップを頼む。
  d_main_49_07_64:
    speaker: maxwell_p
    en: Ahh... This is bad. We're doing whatever we can to stop them, but we need
      more backup.
    ko: |-
      아… 이거 안 좋아.
      어떻게든 막아낸다고는 하지만 백업이 너무 모자란다고.
    ja: |-
      はぁ…良くないわね。
      何とか食い止めてはいるけど、
      圧倒的に手が足りてないわ。
  d_main_49_07_65:
    speaker: black_op_c
    en: Ark... Nooovaaaa!
    ko: 아크--!! 노---바---!!
    ja: アーク！！ノヴァ！！
  d_main_49_07_66:
    speaker: "<Narration>"
    en: "*Booooooom!*"
    ko: 콰아아아아앙---!!
    ja: ズガァァァン――
  d_main_49_07_67:
    speaker: "<Narration>"
    en: A massive beam of light sweeps past Matis.
    ko: 메티스의 앞을 거대한 빛줄기가 휩쓴다.
    ja: メティスの目の前を巨大な光線がなぎ払った
  d_main_49_07_68:
    speaker: "<Narration>"
    en: The swarm of Raptures disappears without a trace.
    ko: 빽빽하던 랩쳐들이 흔적도 없이 사라져있다.
    ja: |-
      すき間もなく集まっていたラプチャーが、
      跡形もなく消えた
  d_main_49_07_69:
    speaker: maxwell_p
    en: Whoa...!
    ko: 오…!
    ja: わお…！
  d_main_49_07_70:
    speaker: black_op_c
    en: The area in front of Matis has been cleared. Let's use this chance to regroup!
    ko: |-
      메티스의 정면을 정리했다.
      이 틈에 정비를!
    ja: |-
      正面は片付けた！
      今のうちに整備を！
  d_main_49_07_71:
    speaker: maxwell_p
    en: Thanks. How are things over there?
    ko: 땡큐. 그쪽은 좀 어때?
    ja: サンキュー、そっちの調子は？
  d_main_49_07_72:
    speaker: red_op_l
    en: We're getting absolutely pummeled. The Ark Buster is just too big.
    ko: |-
      엄청 얻어터지고 있지 뭐.
      아크버스터는 너무 크다고.
    ja: |-
      思いっきりボコボコにされてるよ。
      アークバスターは的がデカすぎるって…
  d_main_49_07_73:
    speaker: blue_op_r
    en: Still, things aren't too bad. I don't know how long it'll last, though.
    ko: |-
      그래도 상태는 나쁘지 않아요.
      얼마나 갈지는 모르겠지만.
    ja: |-
      ですが、大したダメージはありません。
      いつまでそうかは分かりませんが。
  d_main_49_07_74:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 두두두두--
    ja: ザ、ザ、ザ――
  d_main_49_07_75:
    speaker: "<Narration>"
    en: The area that had been wiped clean by the Ark Buster is quickly overrun with
      Raptures again.
    ko: 아크버스터에 의해 쓸려나간 공간이, 랩쳐들로 다시 채워진다.
    ja: |-
      アークバスターのこじ開けた空間も、
      再びラプチャーで埋められていく
  d_main_49_07_76:
    speaker: red_op_l
    en: You've got to be kidding me.
    ko: 장난하는 것도 아니고 진짜.
    ja: ったく…冗談じゃねぇよ。
  d_main_49_07_77:
    speaker: blue_op_r
    en: This is just depressing.
    ko: 기 엄청 죽이는데요 이거.
    ja: かなり心に来ますね、これは…
  d_main_49_07_78:
    speaker: black_op_c
    en: Can we hold them off... on our own?
    ko: 막아낼 수 있는 건가… 우리만으로.
    ja: 食い止められるのか…私たちだけで。
  d_main_49_07_79:
    speaker: laplace_p
    en: Enough with the weak talk, Hero.
    ko: 약한 소리는 집어치워라. 히어로.
    ja: 弱音を吐くんじゃない、ヒーロー。
  d_main_49_07_80:
    speaker: laplace_p
    en: You said it yourself. As long as we're brave, we're invincible.
    ko: |-
      네가 말하지 않았나.
      용기만 있다면 우리들은 무적이라고.
    ja: |-
      君が言ったことじゃないか。
      勇気さえあれば、私たちは無敵だ。
  d_main_49_07_81:
    speaker: laplace_p
    en: Is this all it takes to break your courage?
    ko: 네 녀석의 용기는 고작 이런것에 사라지는 것인가?
    ja: |-
      君の勇気はこの程度のことで
      消えてしまうものなのか？
  d_main_49_07_82:
    speaker: maxwell_p
    en: Here she goes again.
    ko: 얘 또 시작이네.
    ja: ま～た始まったよ。
  d_main_49_07_83:
    speaker: black_op_c
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_07_84:
    speaker: red_op_l
    en: You heard what the great hero said.
    ko: 라고 하신다. 히어로 대선배께서.
    ja: |-
      …って、おっしゃってるぜ。
      ヒーローの大先輩が。
  d_main_49_07_85:
    speaker: blue_op_r
    en: Seriously. Matis and the Ark Rangers have got to do a collab sometime!
    ko: 아 정말. 메티스랑 아크레인저 콜라보 한번 해야된다니까요?
    ja: |-
      もう、メティスとアークレンジャーで
      コラボ企画でもやるべきですね。
  d_main_49_07_86:
    speaker: black_op_c
    en: Of course not. Sorry for sounding so weak, Matis.
    ko: |-
      물론 아니다.
      약한 소릴 해서 미안하다, 메티스.
    ja: |-
      当然、消えはしない。
      弱音を吐いてすまなかった、メティス。
  d_main_49_07_87:
    speaker: laplace_p
    en: Mm. That's good enough.
    ko: 음. 그거면 됐다.
    ja: ああ、それでいい。
  d_main_49_07_88:
    speaker: maxwell_p
    en: Well, you have a point. Now's not the time to sound defeated.
    ko: 뭐, 그래. 약한 소릴 할 때가 아니지.
    ja: ま、確かに、弱音を吐いてる場合じゃないけど。
  d_main_49_07_89:
    speaker: drake_p
    en: Ugh...! Heroes everywhere I look! I feel so left out...!
    ko: 크윽…! 어딜보나 히어로 뿐이라 소외감을 느낀다…!
    ja: |-
      くっ…！周りがヒーローばかりで、
      肩身が狭い…！
  d_main_49_07_90:
    speaker: drake_p
    en: "*Sigh* The Villain Union... Those were the days. I miss it."
    ko: 하… 빌런 연합… 좋았지. 그립다.
    ja: はぁ…ヴィラン連合…あの頃は良かった…
  d_main_49_07_91:
    speaker: drake_p
    en: "... Hmm?"
    ko: "…음?"
    ja: "…ん？"
  d_main_49_07_92:
    speaker: maxwell_p
    en: What is it? What's wrong? Don't go "hmm?" in the middle of a battle.
    ko: 뭐야. 왜 그래. 전투 중에 음? 같은 거 하지 말라고.
    ja: |-
      なに？どうしたの？
      戦闘中に「ん？」はやめてくれる？
  d_main_49_07_93:
    speaker: drake_p
    en: Look at the rear of the Rapture forces.
    ko: 랩쳐 놈들의 후미를 봐라.
    ja: ラプチャーどもの後ろだ。
  d_main_49_07_94:
    speaker: "<Narration>"
    en: As Maxwell gets her equipment in order, she looks toward the rear of the Rapture.
    ko: 맥스웰이 장비를 추스름과 동시에 랩쳐의 후미를 본다.
    ja: |-
      マクスウェルは装備を整えるかたわら、
      ラプチャーの後方に目を向けた
  d_main_49_07_95:
    speaker: "<Narration>"
    en: It's hard to see, but explosions send pieces of Raptures flying into the air.
    ko: 잘 보이지 않지만, 폭발과 함께 랩쳐들의 파편이 솟아오른다.
    ja: |-
      はっきりとは分からないが、爆煙と共に
      ラプチャーの断片が舞い上がっている
  d_main_49_07_96:
    speaker: "<Narration>"
    en: The explosions are gradually getting closer.
    ko: 조금씩이지만 폭발이 점점 다가오고 있다.
    ja: たて続けの爆発が徐々に近づきつつあった
  d_main_49_07_97:
    speaker: maxwell_p
    en: Oh... could it be?
    ko: 오. 설마.
    ja: おっ、まさか…
  d_main_49_07_98:
    speaker: drake_p
    en: Hehe. Indeed.
    ko: 후후. 그래.
    ja: フフッ、そうだ。
  d_main_49_07_99:
    speaker: drake_p
    en: The Villain Union has come to save me from my loneliness!
    ko: 외로운 나를 위해 빌런 연합이 왔다!!
    ja: |-
      寂しがっている私のために、
      ヴィラン連合の皆が駆け付けたに違いない！
  d_main_49_07_100:
    speaker: rapi_red_op_c
    en: Matis! Ark Rangers! We're here to help!
    ko: |-
      메티스! 아크레인저!
      합류한다!
    ja: |-
      メティス！アークレンジャー！
      合流するわ！
  d_main_49_07_101:
    speaker: anis_i_w_op_r
    en: Did ya miss us?
    ko: 우리 보고 싶었어?
    ja: 会いたかった？
  d_main_49_07_102:
    speaker: arkrangerblack
    en: Anis...!
    ko: 아니스…!
    ja: アニス…！
  d_main_49_07_103:
    speaker: red
    en: Great! The Counters are here!
    ko: 좋아! 카운터스가 왔다!
    ja: よっしゃぁ！カウンターズのご到着だ！
  d_main_49_07_104:
    speaker: neon_v_w_op_l
    en: Not just us! Come on, guys. Say hello.
    ko: |-
      그것뿐만이 아니라고요!
      자, 여러분. 인사해주세요.
    ja: |-
      それだけじゃありませんよ！
      さあ、みなさん。一言お願いします。
  d_main_49_07_105:
    speaker: snowwhite_h_op_c
    en: I'm Snow White from Pioneer.
    ko: 파이오니아의 스노우 화이트다.
    ja: パイオニア部隊、スノーホワイトだ。
  d_main_49_07_106:
    speaker: hongryeon_g_op_r
    en: My name is Scarlet.
    ko: 홍련일세.
    ja: 紅蓮。
  d_main_49_07_107:
    speaker: rapunzel_s_op_l
    en: I'm Rapunzel. Nice to meet you, sisters.
    ko: 라푼젤이에요. 잘 부탁드려요, 자매님들.
    ja: |-
      ラプンツェルと申します。
      よろしくお願いいたしますね、姉妹の皆さま。
  d_main_49_07_108:
    speaker: maxwell_p
    en: "... Pilgrims."
    ko: "…필그림."
    ja: "…ピルグリム…"
  d_main_49_07_109:
    speaker: blue
    en: Wow. I've never seen them in person before.
    ko: 세상에. 저 실제로 보는 건 처음이에요.
    ja: まあ。本物が見られるなんて…
  d_main_49_07_110:
    speaker: drake_p
    en: Wh-where are Ziz and GraGre? You mean they didn't come with you?
    ko: |-
      지, 지즈랑 그레그레는 어디갔지?
      설마 같이 안 왔나?
    ja: |-
      ジ、ジズとグレグレはどこだ？
      まさか、来ていないのか？
  d_main_49_07_111:
    speaker: neon_v_w_op_l
    en: Nope, they didn't.
    ko: 안 왔는데요.
    ja: 来てないですね。
  d_main_49_07_112:
    speaker: drake_p
    en: Impossible...!
    ko: 이럴수가…!
    ja: なんてことだ…！
  d_main_49_07_113:
    speaker: laplace_p
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_07_114:
    speaker: laplace_p
    en: Are you here to protect the Ark?
    ko: 방주를 지키기 위해 와준건가?
    ja: アークを守るために、来てくれたというのか？
  d_main_49_07_115:
    speaker: snowwhite_h_op_c
    en: Yes.
    ko: 그래.
    ja: そうだ。
  d_main_49_07_116:
    speaker: laplace_p
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_07_117:
    speaker: laplace_p
    en: I look forward to fighting alongside you, Pilgrims!
    ko: 잘 부탁한다, 필그림!
    ja: よろしく頼む、ピルグリム！
  d_main_49_07_118:
    speaker: snowwhite_h_op_c
    en: "... Yes, likewise."
    ko: "…그래. 잘 부탁한다."
    ja: "…ああ、よろしく。"
  d_main_49_07_119:
    speaker: hongryeon_g_op_r
    en: Would it hurt thee to treat these fair folk a little more kindly?
    ko: 좀 살갑게 대해주면 어디 덧나는가?
    ja: |-
      もう少し愛想よくしてやっても、
      罰は当たらぬと思うがね？
  d_main_49_07_120:
    speaker: rapunzel_s_op_l
    en: Maybe she's shy.
    ko: 부끄러워서 그러시나요?
    ja: もしや、照れていらっしゃるのですか？
  d_main_49_07_121:
    speaker: snowwhite_h_op_c
    en: Quiet. We're in the middle of a battle.
    ko: 다들 조용히 해라. 전투 중이다.
    ja: 私語は控えろ。戦闘中だ。
d_main_49_08_s:
  d_main_49_08_s_1:
    speaker: "<Narration>"
    en: The number of Raptures doesn't decrease.
    ko: "…줄어들지 않는다."
    ja: "…減っている気がしない"
  d_main_49_08_s_2:
    speaker: "<Narration>"
    en: Everyone works tirelessly to bring down the Raptures, yet the battlefield
      remains unchanged.
    ko: |-
      모두가 쉴틈없이 랩쳐들을 격추하고 있지만,
      풍경에 변화가 없다.
    ja: |-
      誰もが休む間もなく
      ラプチャーを撃ち続けているが、
      見えているものは一向に変わらない
  d_main_49_08_s_3:
    speaker: "<Self>"
    en: "... I guess this is the definition of endless."
    ko: "…끝이 없다는 말은 이럴 때 하는 말이겠네."
    ja: |-
      …「キリがない」とは、
      こういう時に使う言葉なのだろうな
  d_main_49_08_s_4:
    speaker: snowwhite_h
    en: What are you talking about? We've already significantly reduced their numbers.
    ko: |-
      무슨 소리냐.
      이미 상당수 줄어들었다.
    ja: |-
      何を言っている。
      もうかなり減らした。
  d_main_49_08_s_5:
    speaker: snowwhite_h
    en: Raptures explode wherever you shoot. You could fire with your eyes closed
      and still hit one.
    ko: |-
      어딜 쏴도 랩쳐가 터져나가는군.
      눈을 감고 쏴도 될 정도다.
    ja: |-
      どこを撃ってもラプチャーが吹き飛ぶ。
      目を閉じて撃ってもいいぐらいだな。
  d_main_49_08_s_6:
    speaker: hongryeon_g
    en: Indeed. Even with mine eyes shut, my blade still finds its mark.
    ko: 그렇다네. 눈 감고 휘둘러도 베이는군.
    ja: ああ。目を閉じていても斬れそうだ。
  d_main_49_08_s_7:
    speaker: anis_i_w
    en: And what if those weren't Raptures you were slaying?
    ko: 너 그거 랩쳐 아니면 어쩌려고그래.
    ja: ラプチャー以外に当たったらどうするつもりよ。
  d_main_49_08_s_8:
    speaker: hongryeon_g
    en: "'Tis but a jest. Meant merely to remark upon their numbers."
    ko: 농담일세. 그만큼 많다는 뜻이지.
    ja: 冗談だ。それほど多いのは事実だがねぇ。
  d_main_49_08_s_9:
    speaker: rapunzel_s
    en: There's no point in saving your strength here.
    ko: 이거, 힘을 아껴서 될 일이 아닌 것 같은데요?
    ja: 力を温存している余裕はなさそうですね？
  d_main_49_08_s_10:
    speaker: rapi_red
    en: I agree. The newly created Raptures are different from before. They're far
      stronger in many ways.
    ko: |-
      동감이야. 신생 랩쳐들의 상태가 이전과는 달라.
      여러모로 훨씬 강해진 상태인 것 같네.
    ja: |-
      そうね。新世代型ラプチャーの
      様子がまた変わった。
      かなり強化されている感じがする。
  d_main_49_08_s_11:
    speaker: snowwhite_h
    en: Hmm? But you can destroy one in a single blow. They're exactly the same.
    ko: |-
      ??
      한방에 한놈씩 터진다. 똑같다.
    ja: |-
      ？？
      一撃で吹き飛ぶ。同じだろう。
  d_main_49_08_s_12:
    speaker: neon_v_w
    en: Huh? Yeah, they're exactly the same.
    ko: |-
      ??
      예. 똑같은데요?
    ja: |-
      ？？
      ええ、同じだと思いますけど？
  d_main_49_08_s_13:
    speaker: rapi_red
    en: That's because your firepower is too overwhelming.
    ko: "…그건 너희들 화력이 너무 강해서 그런거야."
    ja: "…あなたたちが火力しか考えてないからよ。"
  d_main_49_08_s_14:
    speaker: "<Self>"
    en: The elite Raptures still haven't entered the fray. I think we should conserve
      our strength too...
    ko: |-
      …랩쳐 쪽은 아직 정예들이 참전하지도 않았어.
      우리도 힘을 비축해놓는게 맞을 것 같은데….
    ja: |-
      …敵の精鋭はまだ戦場に現れてもいない。
      温存しておきたいところだが…
  d_main_49_08_s_15:
    speaker: "<Narration>"
    en: I take a look at our surroundings.
    ko: 주위를 다시 한번 둘러본다.
    ja: あらためて、周囲を確かめる
  d_main_49_08_s_16:
    speaker: "<Narration>"
    en: "... The scene on the battlefield remains exactly the same."
    ko: "…여전히, 풍경에는 아무런 변화가 없다."
    ja: "…戦場の景色はまるで変わっていない"
  d_main_49_08_s_17:
    speaker: anis_i_w
    en: Unbelievable. It doesn't look like we're putting a dent in them at all.
    ko: 기가 막히네. 아무리 봐도 하나도 안 줄어든 것 같아.
    ja: |-
      あきれちゃうわね。
      減ってるようには全然見えないんだけど。
  d_main_49_08_s_18:
    speaker: "<Self>"
    en: Sorry, everyone. Right now, getting the Ark to the surface takes priority.
    ko: |-
      다들. 미안해.
      일단은 방주를 올리는 게 먼저야.
    ja: |-
      みんなにはすまないが、
      アークの浮上は最優先事項だ
  d_main_49_08_s_19:
    speaker: "<Self>"
    en: I know the fight ahead of us will be more difficult, but please, give it your
      all.
    ko: 이후의 싸움에서 고생하게 될테지만, 지금 전력을 다해줘. 부탁해.
    ja: |-
      後の戦いが苦しくなることは承知している。
      今は全力を尽くしてもらうしかない、頼む
  d_main_49_08_s_20:
    speaker: rapi_red
    en: Understood. Then we'll hold nothing back...!
    ko: |-
      알겠습니다.
      그럼 사정 볼 것 없이 전력으로…!
    ja: |-
      了解しました。
      では、遠慮なく全力で…！
  d_main_49_08_s_21:
    speaker: "<Narration>"
    en: "*Rumble!*"
    ko: 쿠우우우---!!
    ja: ゴゴゴゴ――
  d_main_49_08_s_22:
    speaker: "<Narration>"
    en: The roar of a massive engine can be heard in the distance.
    ko: 먼 곳에서 거대한 엔진음이 들려온다.
    ja: 彼方から巨大なエンジン音が聞こえた
  d_main_49_08_s_23:
    speaker: "<Narration>"
    en: It's so loud that it drowns out every other sound on the chaotic battlefield.
    ko: 혼란스러운 전장의 소리를 모두 집어삼킬 정도로 큰 소리.
    ja: |-
      戦場の喧騒さえもかき消してしまうほどの
      存在感を放つ大音量だ
  d_main_49_08_s_24:
    speaker: "<Narration>"
    en: It's a sound we've heard firsthand, closer than anyone else ever has.
    ko: 그리고 우린 이 소리를 누구보다 가까이에서 들었던 적이 있다.
    ja: |-
      何より、私たちはその音を
      誰より近くで聞いたことがある
  d_main_49_08_s_25:
    speaker: "<Self>"
    en: It's the Wings of Victory!
    ko: 승리의 날개 호!
    ja: 勝利の翼号！
  d_main_49_08_s_26:
    speaker: "<Narration>"
    en: I look toward the horizon.
    ko: 하늘 저편을 본다.
    ja: 遠くの空を見上げた
  d_main_49_08_s_27:
    speaker: "<Narration>"
    en: The Wings of Victory majestically cuts through the air.
    ko: 승리의 날개 호가 그 위용을 뽐내며 공기를 가르고 있다.
    ja: |-
      勝利の翼号の威容を誇る巨体が
      空を裂き、飛んでいる
  d_main_49_08_s_28:
    speaker: snowwhite_h
    en: It can't be...
    ko: "…아니."
    ja: "…まさか…"
  d_main_49_08_s_29:
    speaker: rapunzel_s
    en: My word...!
    ko: 세상에…!
    ja: なんという…！
  d_main_49_08_s_30:
    speaker: hongryeon_g
    en: Oh-ho. What a mighty flying vessel that is.
    ko: 호오. 저것 참 큰 비행기일세.
    ja: ほう…ずいぶん大きな飛行機だねぇ。
  d_main_49_08_s_31:
    speaker: rapunzel_s
    en: S-Scarlet! Don't you remember? We spent so long...!
    ko: 호, 홍련! 기억 안 나요!? 우리가 저걸 얼마나…!
    ja: |-
      ぐ、紅蓮！忘れてしまったのですか！？
      私たちが、どれほど…！
  d_main_49_08_s_32:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_33:
    speaker: hongryeon_g
    en: "... Forgive me. I do not recall."
    ko: "…미안하네. 기억나지 않는다네."
    ja: "…すまないが、覚えておらぬな。"
  d_main_49_08_s_34:
    speaker: rapunzel_s
    en: N-no. I'm sorry.
    ko: 아, 아니에요. 제가 미안해요.
    ja: いえ…私のほうこそ、申し訳ありません。
  d_main_49_08_s_35:
    speaker: "<Narration>"
    en: The Wings of Victory lowers its altitude.
    ko: 승리의 날개 호가 고도를 낮춘다.
    ja: 勝利の翼号が高度を落とした
  d_main_49_08_s_36:
    speaker: "<Narration>"
    en: Countless weapons rain fire upon the ground.
    ko: 수많은 무장을 지면을 향해 쏟아낸다.
    ja: 砲火の雨が上から降り注いだ
  d_main_49_08_s_37:
    speaker: "<Narration>"
    en: The Raptures are quite literally swept away.
    ko: 랩쳐들이 말 그대로 쓸려나간다.
    ja: ラプチャーたちが言葉通り、一掃されていく
  d_main_49_08_s_38:
    speaker: "<Narration>"
    en: The tide of battle shifts dramatically. The seemingly endless Raptures visibly
      dwindle.
    ko: |-
      전장의 분위기가 압도된다.
      무한한 것 같던 랩쳐들의 수가 눈에 띄게 줄어든다.
    ja: |-
      圧倒的に戦場を支配している。
      無限とも思われたラプチャーの気配が、
      目に見えて薄れた
  d_main_49_08_s_39:
    speaker: snowwhite_h
    en: Oh... Ohhh...
    ko: 아… 아아….
    ja: あ…あぁ…
  d_main_49_08_s_40:
    speaker: "<Narration>"
    en: Snow White stares at the scene before her in a daze.
    ko: "…스노우 화이트는 멍하니 서서 그 모습을 바라보고 있다."
    ja: |-
      …スノーホワイトが呆然と立ち尽くし、
      その姿を見つめていた
  d_main_49_08_s_41:
    speaker: rapi_red
    en: "... Don't cry."
    ko: "…울지 마."
    ja: "…泣かないで。"
  d_main_49_08_s_42:
    speaker: snowwhite_h
    en: I'm not crying.
    ko: 안 운다.
    ja: 泣いてなどいない。
  d_main_49_08_s_43:
    speaker: snowwhite_h
    en: It just... feels like I'm dreaming.
    ko: 그저… 꿈을 꾸고 있는 것 같은 기분이다.
    ja: ただ…夢を見ているような気分だ。
  d_main_49_08_s_44:
    speaker: snowwhite_h
    en: The Wings of Victory... right here before our very eyes...
    ko: 승리의 날개 호가… 우리 눈 앞에서….
    ja: 勝利の翼号が…私たちの目の前で…
  d_main_49_08_s_45:
    speaker: snowwhite_h
    en: And it's...
    ko: 저렇게….
    ja: これほど…
  d_main_49_08_s_46:
    speaker: rapunzel_s
    en: "... Is this a new vessel built by the Ark?"
    ko: "…방주에서 새롭게 만든 것인가요?"
    ja: "…アークで新造されたものでしょうか？"
  d_main_49_08_s_47:
    speaker: "<Self>"
    en: No, I heard they found the old one and refurbished it.
    ko: 아니. 예전의 것을 발견해서 개조했다고 해.
    ja: いや、昔のものを探し出して改造したそうだ
  d_main_49_08_s_48:
    speaker: "<Self>"
    en: You never know. Someday the true owner of the Wings of Victory might return.
    ko: 언젠가, 승리의 날개 호의 진짜 주인이 되돌아올지도 모르니까.
    ja: |-
      いつか、本当の主たちが
      戻ってきた時のためにな
  d_main_49_08_s_49:
    speaker: snowwhite_h
    en: The true owner...
    ko: "…진짜, 주인."
    ja: "…本当の、主…"
  d_main_49_08_s_50:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_51:
    speaker: snowwhite_h
    en: Who's aboard?
    ko: 누가 타고 있지?
    ja: 乗っているのは誰だ？
  d_main_49_08_s_52:
    speaker: "<Self>"
    en: Good question... I wonder who...
    ko: "…그러고보니… 누가…."
    ja: "…そういえば…誰が…"
  d_main_49_08_s_53:
    speaker: "<Narration>"
    en: After sweeping the battlefield clean, the Wings of Victory changes course.
    ko: 전장을 한바탕 쓸어버린 후, 승리의 날개 호가 방향을 바꾼다.
    ja: 戦場が片付いた後、勝利の翼号が針路を変えた
  d_main_49_08_s_54:
    speaker: "<Narration>"
    en: "*Rumble!*"
    ko: 쿠우우우---!!
    ja: ゴゴゴ…
  d_main_49_08_s_55:
    speaker: "<Narration>"
    en: "... It comes to a halt overhead, hovering in place."
    ko: "…우리의 머리 위에서 멈춰선 채 부유하고 있다."
    ja: "…私たちの頭上で動きが止まる"
  d_main_49_08_s_56:
    speaker: "<Narration>"
    en: It's close enough that we can feel its heat.
    ko: 그 열기가 느껴질 정도로 가깝다.
    ja: 熱気が感じられるほどに近い
  d_main_49_08_s_57:
    speaker: "<Narration>"
    en: Cables drop from the underside of the Wings of Victory.
    ko: 승리의 날개 호의 배면에서 와이어가 내려온다.
    ja: 艦からワイヤーが下りてきた
  d_main_49_08_s_58:
    speaker: rapi_red
    en: Cables? Do they want us to get on?
    ko: 와이어? 타라는 얘긴가?
    ja: あれは？登れということ？
  d_main_49_08_s_59:
    speaker: neon_v_w
    en: But they're way too high.
    ko: 그런데 너무 높지 않나요?
    ja: さすがに高すぎませんか？
  d_main_49_08_s_60:
    speaker: anis_i_w
    en: Oh... someone's rappelling down.
    ko: 어… 누가 내려오는데?
    ja: え…誰か降りてきてる？
  d_main_49_08_s_61:
    speaker: "<Narration>"
    en: Someone descends, holding onto the cable.
    ko: 와이어를 붙잡고 누군가가 내려온다.
    ja: ワイヤーを滑り降りてくる人影が見えた
  d_main_49_08_s_62:
    speaker: "<Narration>"
    en: They're moving so fast, it looks like they're falling.
    ko: 거의 추락하는 것 같은 속도다.
    ja: ほとんど自由落下と変わらない速度だろう
  d_main_49_08_s_63:
    speaker: "<Narration>"
    en: At the end of the cable, they leap off.
    ko: 그리고 와이어의 끝에서, 뛰어내린다.
    ja: ワイヤーの先端に到達し、そのまま飛び降りた
  d_main_49_08_s_64:
    speaker: "<Narration>"
    en: "... Wait, did they just leap off?"
    ko: "…뛰어 내렸다고?"
    ja: "…飛び降りた？"
  d_main_49_08_s_65:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 쿠웅-!
    ja: ズンッ――！
  d_main_49_08_s_66:
    speaker: "<Narration>"
    en: A terrifying crash rings out, and a thick cloud of dust billows up.
    ko: 끔찍한 낙하음. 먼지 구름이 자욱하게 일어난다.
    ja: 大きな音とともに、土煙が舞い上がる
  d_main_49_08_s_67:
    speaker: "<Narration>"
    en: In the face of this bizarre turn of events, nobody moves.
    ko: "…이 일련의 이상한 상황에, 그 누구도 움직이지 못했다."
    ja: |-
      …異様な状況を目の前に、
      誰もがあぜんとしていた
  d_main_49_08_s_68:
    speaker: "<Narration>"
    en: "*Rumble!*"
    ko: 쿠우우우---!!
    ja: ゴオオオオ――
  d_main_49_08_s_69:
    speaker: "<Narration>"
    en: The Wings of Victory moves, resuming its attack on the Raptures.
    ko: |-
      승리의 날개 호가 이동한다.
      다시 랩쳐들을 향해 공격을 재개한다.
    ja: |-
      勝利の翼号が動き出し、
      ラプチャーの群れに攻撃を再開した
  d_main_49_08_s_70:
    speaker: "<Narration>"
    en: As it moves, the wind it generates scatters the cloud of dust.
    ko: 이동할 때의 바람으로 인해 먼지 구름이 흩어져간다.
    ja: その風圧が、土煙を晴らしていく
  d_main_49_08_s_71:
    speaker: "<Narration>"
    en: Once the dust settles, we steel ourselves.
    ko: 먼지가 서서히 옅어지고, 우리는 각오를 해야 했다.
    ja: 薄れる土煙を前に、私たちは息をのんだ
  d_main_49_08_s_72:
    speaker: "<Narration>"
    en: After all, we're about to see what becomes of someone who falls from over
      ten meters up.
    ko: 10미터도 넘어보이는 높이에서 추락한 사람의 모습을 봐야 했으니까.
    ja: |-
      10メートルはゆうに超える高さから
      落下した何者かがどうなったかを
      確かめなければならない
  d_main_49_08_s_73:
    speaker: "<Narration>"
    en: However, as if to make a mockery of our expectations, standing within the
      clearing dust...
    ko: |-
      하지만 우리의 예상을 비웃기라도 하는 듯,
      걷힌 먼지 구름의 안에서
    ja: |-
      だが、その覚悟をあざ笑うかのように、
      土煙の向こうから…
  d_main_49_08_s_74:
    speaker: "<Narration>"
    en: is a man in a commander's uniform.
    ko: 지휘관 복장의 남자가 서 있다.
    ja: 指揮官の制服を着た男が現れた
  d_main_49_08_s_75:
    speaker: andersen_c
    en: Hey.
    ko: 여.
    ja: やあ。
  d_main_49_08_s_76:
    speaker: andersen_c
    en: My loyal subordinates. How've you been?
    ko: 내 충실한 부하들. 잘 있었냐?
    ja: 我が忠実なる部下たちよ。元気にしていたかな？
  d_main_49_08_s_77:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_78:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_79:
    speaker: hongryeon_g
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_main_49_08_s_80:
    speaker: andersen_c
    en: What are you all staring at? Come give me a hug.
    ko: |-
      뭘 그렇게 멀뚱멀뚱 쳐다보냐.
      자, 이리 와서 안아줘.
    ja: |-
      何をぼさっとしているんだ、
      ほら、再会のハグをしてくれ。
  d_main_49_08_s_81:
    speaker: andersen_c
    en: This is supposed to be our touching reunion, so get over here.
    ko: |-
      감격스러운 재회의 순간이잖아.
      그러니 빨리 이리 와.
    ja: 感動の瞬間だろう、早く飛びついて来い。
  d_main_49_08_s_82:
    speaker: snowwhite_h
    en: Com...mander...?
    ko: "…지휘… 관."
    ja: "…指揮…官…"
  d_main_49_08_s_83:
    speaker: rapunzel_s
    en: How... is this possible...?
    ko: 이럴… 수가….
    ja: そん…な…
  d_main_49_08_s_84:
    speaker: andersen_c
    en: Stop acting so surprised. Come on. I'm busy.
    ko: |-
      그만 놀라고 빨리 해.
      바쁘다.
    ja: |-
      驚くのはそれくらいにしてくれ。
      後がつかえてるんだ。
  d_main_49_08_s_85:
    speaker: rapunzel_s
    en: "... Who are you?"
    ko: "…누군가요, 당신."
    ja: "…何者ですか、あなたは…"
  d_main_49_08_s_86:
    speaker: snowwhite_h
    en: Spare me your tasteless jokes.
    ko: 질 나쁜 농담은 집어치워라.
    ja: たちの悪い冗談はやめてくれ。
  d_main_49_08_s_87:
    speaker: andersen_c
    en: Good grief. Even Dorothy reacted the same way. You're all so suspicious.
    ko: 하여간. 도로시도 그렇고 하나같이 의심만 많아가지고.
    ja: |-
      まったく…ドロシーもそうだったが、
      疑い深いやつばかりだな。
  d_main_49_08_s_88:
    speaker: andersen_c
    en: It's me.
    ko: 나다.
    ja: 私だ。
  d_main_49_08_s_89:
    speaker: rapunzel_s
    en: So who are you...?!
    ko: 그러니까 누구…!
    ja: ですから、あなたは…！
  d_main_49_08_s_90:
    speaker: andersen_c
    en: Me.
    ko: 나.
    ja: 他に誰かいるか？
  d_main_49_08_s_91:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_92:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_93:
    speaker: rapunzel_s
    en: You're alive—
    ko: 살아 있었….
    ja: 生きていらした…
  d_main_49_08_s_94:
    speaker: andersen_c
    en: Now, now. I hate to interrupt, but let's save the whole "You're alive! Where
      have you been all this time, and why haven't you contacted us?!" talk for later.
    ko: 자자. 미안한데, 살아 있었구나, 그 동안 연락도 안하고 뭐했냐, 이런 얘기는 나중에 하자고.
    ja: |-
      さあさあ、悪いが、「生きていたのか」とか
      「今まで連絡ナシに何をしていた」とか
      そういう話は後だ。
  d_main_49_08_s_95:
    speaker: andersen_c
    en: We're busy now. We've got a serious problem.
    ko: 지금 바빠. 큰일이 났거든.
    ja: 今は忙しい。大変な状況だからな。
  d_main_49_08_s_96:
    speaker: rapunzel_s
    en: Commander!
    ko: 지휘관!
    ja: 指揮官！
  d_main_49_08_s_97:
    speaker: andersen_c
    en: I'm sorry, Rapunzel. We really are busy. I'm not trying to brush you off,
      so please be patient with me a little longer.
    ko: |-
      미안하다, 라푼젤.
      진짜 바빠서그래. 대충 넘어갈 생각은 없으니까 조금만 참아.
    ja: |-
      すまない、ラプンツェル。
      だが、つもる話は後だ。ごまかすつもりはない、
      もう少し辛抱してくれ。
  d_main_49_08_s_98:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_99:
    speaker: snowwhite_h
    en: "... All right."
    ko: "…알겠다."
    ja: "…そうだな。"
  d_main_49_08_s_100:
    speaker: andersen_c
    en: I'm sure you and Counters must have a lot of questions, but please keep them
      to yourselves for now.
    ko: 자네랑 카운터스도 궁금한게 많더라도 일단은 참아주게.
    ja: |-
      君もカウンターズも、言いたいことは
      山ほどあるだろうが、今はガマンしてくれ。
  d_main_49_08_s_101:
    speaker: "<Self>"
    en: Oh... Understood.
    ko: 어… 네. 알겠습니다.
    ja: "…はい。承知しました"
  d_main_49_08_s_102:
    speaker: andersen_c
    en: Look over there, in the highlands.
    ko: 저길 봐라. 고지대다.
    ja: あれを見てくれ。高台だ。
  d_main_49_08_s_103:
    speaker: "<Narration>"
    en: I look in the direction Deputy Chief Andersen is pointing.
    ko: 엔더슨 부사령관이 가리키는 곳을 바라본다.
    ja: |-
      アンダーソン副司令官の
      指さす先に目を向けた
  d_main_49_08_s_104:
    speaker: "<Narration>"
    en: It's hard to see at this distance, but I can just make out the dark figure
      of a person.
    ko: "…멀어서 잘 보이지 않지만, 사람 모습의 검은 형체가 보인다."
    ja: |-
      …遠すぎてはっきりとは視認できないが、
      人の形らしい黒い影が見える
  d_main_49_08_s_105:
    speaker: andersen_c
    en: There've been plenty of surprises already, but there's one more in store.
    ko: 놀랄 일이 많을텐데, 한가지 더 놀랄 일이 있다.
    ja: |-
      驚くことばかりだろうが、
      もう一つ驚いてもらうことがある。
  d_main_49_08_s_106:
    speaker: andersen_c
    en: That thing over there— What the heck?
    ko: |-
      저기에 있는 건-
      아잇, 뭐야.
    ja: |-
      あれは――
      むっ、いかん…
  d_main_49_08_s_107:
    speaker: "<Narration>"
    en: The dark figure moves.
    ko: 검은 형체가 움직인다.
    ja: 黒い影が動いた
  d_main_49_08_s_108:
    speaker: "<Narration>"
    en: It spreads wings and rushes toward us.
    ko: 날개를 펴고, 돌진해온다.
    ja: 翼を広げ、接近してくる
  d_main_49_08_s_109:
    speaker: andersen_c
    en: Damn it! We've been spotted!
    ko: 젠장! 들켰다!
    ja: まずい！気づかれたか！
  d_main_49_08_s_110:
    speaker: andersen_c
    en: Shoot! Shoot it down!
    ko: 쏴! 쏴서 떨어뜨려!
    ja: 撃て！撃ち落とせ！
  d_main_49_08_s_111:
    speaker: "<Narration>"
    en: It comes closer to us in the blink of an eye.
    ko: 거리가 삽시간에 가까워진다.
    ja: 一瞬にして距離が縮まった
  d_main_49_08_s_112:
    speaker: "<Narration>"
    en: The dark figure continues charging straight toward us.
    ko: 검은 형체는 그대로 우릴 향해 돌진한다.
    ja: |-
      黒い影は勢いを落とす気配もなく
      こちらに向かって突進してくる
  d_main_49_08_s_113:
    speaker: "<Narration>"
    en: "*Swoosh! Swoosh!*"
    ko: 푸슝-! 푸슝-!
    ja: バシュン！バシュン！
  d_main_49_08_s_114:
    speaker: "<Narration>"
    en: Light bursts forth from the dark figure.
    ko: 검은 형체에게서 빛이 뿜어져나온다.
    ja: 黒い影が光を放った
  d_main_49_08_s_115:
    speaker: "<Narration>"
    en: It fires a precise shot, which Snow White blocks with her shield.
    ko: |-
      정확한 사격.
      스노우 화이트는 실드로 공격을 막아낸다.
    ja: |-
      正確な狙い撃ちを
      スノーホワイトがシールドで防いだ
  d_main_49_08_s_116:
    speaker: snowwhite_h
    en: Tsk...!
    ko: 치잇…!
    ja: ちっ…！
  d_main_49_08_s_117:
    speaker: neon_v_w
    en: Here we go!
    ko: 갑니다!
    ja: いきます！
  d_main_49_08_s_118:
    speaker: "<Narration>"
    en: Snow White and Neon fire at the dark figure as it hurtles toward them at low
      altitude.
    ko: 스노우 화이트와 네온이 저공 비행으로 돌진해오는 검은 형체를 향해 사격한다.
    ja: |-
      スノーホワイトとネオンが
      低空飛行で突撃してくる黒い影に
      反撃を始めた
  d_main_49_08_s_119:
    speaker: "<Narration>"
    en: It dodges all their attacks, maneuvering effortlessly through the air.
    ko: 하지만 검은 형체는, 공중에서 방향을 자유자재로 틀며 모든 공격을 피한다.
    ja: |-
      だが、影は空中で自在に軌道を変え、
      射撃をことごとくかわしていく
  d_main_49_08_s_120:
    speaker: rapi_red
    en: Those movements...
    ko: "…저 움직임."
    ja: "…あの動き…"
  d_main_49_08_s_121:
    speaker: "<Narration>"
    en: It continues charging toward us.
    ko: 그리고 계속, 우릴 향해 돌진한다.
    ja: 速度はまったく削がれていない
  d_main_49_08_s_122:
    speaker: hongryeon_g
    en: Thou seekest to engage us at close quarters? Precisely what I had hoped for.
    ko: |-
      호오. 접근전을 시도하는가.
      바라던 바일세.
    ja: |-
      ほう、白兵戦が望みか。
      いいだろう…
  d_main_49_08_s_123:
    speaker: "<Narration>"
    en: Scarlet lowers herself into a fighting stance.
    ko: 홍련이 허리를 숙이고 자세를 잡는다.
    ja: 紅蓮が腰を落とし、構えを取った
  d_main_49_08_s_124:
    speaker: "<Narration>"
    en: She watches the rapidly approaching figure and grips the hilt of her sword.
    ko: 빠르게 다가오는 검은 형체를 바라보며, 검 손잡이를 거머쥔다.
    ja: |-
      急速に接近する黒い影を目にとらえ、
      剣の柄を握る手に力を入れる
  d_main_49_08_s_125:
    speaker: "<Narration>"
    en: The moment she moves to draw her sword out, we all see it.
    ko: 검을 뽑으려는 순간, 우리 모두는 보았다.
    ja: |-
      紅蓮の手が動こうという間合いが迫って、
      私たちは全員、ようやく気づいた
  d_main_49_08_s_126:
    speaker: "<Narration>"
    en: It's Dorothy clad in black armor.
    ko: 검은색 갑옷을 두른 도로시를.
    ja: その影は黒い装甲をまとったドロシーだ
  d_main_49_08_s_127:
    speaker: hongryeon_g
    en: Impossible...
    ko: "…아니."
    ja: "…なっ…"
  d_main_49_08_s_128:
    speaker: "<Narration>"
    en: "*Thwack!*"
    ko: 빠악-!!
    ja: ドガッ！！
  d_main_49_08_s_129:
    speaker: hongryeon_g
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_49_08_s_130:
    speaker: "<Narration>"
    en: Without decreasing her speed, she kicks Scarlet.
    ko: "…돌진할때의 속도 그대로, 홍련을 걷어찬다."
    ja: |-
      …突進の勢いを乗せた蹴りが
      紅蓮を吹き飛ばした
  d_main_49_08_s_131:
    speaker: "<Narration>"
    en: After rolling across the ground, Scarlet quickly regains her footing.
    ko: 바닥을 몇바퀴 구른 홍련이 바로 자세를 추스른다.
    ja: |-
      紅蓮は地面を転がったものの、
      すぐに体勢を立て直した
  d_main_49_08_s_132:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_133:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_134:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_135:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_136:
    speaker: neon_v_w
    en: D-Dorothy turned into an evil mob boss?
    ko: 도, 도로시가 악의 여간부가 되었는데요?
    ja: |-
      あの、ドロシーが
      悪の女幹部みたいになってますけど？
  d_main_49_08_s_137:
    speaker: anis_i_w
    en: No way...
    ko: 설… 마.
    ja: まさか…
  d_main_49_08_s_138:
    speaker: rapi_red
    en: "... Dorothy."
    ko: "…도로시."
    ja: "…ドロシー…"
  d_main_49_08_s_139:
    speaker: "<Self>"
    en: Her eyes... they're red.
    ko: 눈이… 빨간색으로….
    ja: 目が…赤いな…
  d_main_49_08_s_140:
    speaker: andersen_c
    en: Yes, it's Dorothy.
    ko: 그래. 도로시다.
    ja: そう、ドロシーだ。
  d_main_49_08_s_141:
    speaker: andersen_c
    en: The corrupted version.
    ko: 침식 버전이지.
    ja: 侵食されているがな。
  d_main_49_08_s_142:
    speaker: snowwhite_h
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_08_s_143:
    speaker: andersen_c
    en: By the looks of it, she's become a Heretic.
    ko: "…꼴을 보아하니 헬레틱이 된 모양이구만."
    ja: "…見たところ、ヘレティックにされたか。"
  d_main_49_08_s_144:
    speaker: andersen_c
    en: I suppose if I had been a Rapture and gotten my hands on her, I would've turned
      her into a Heretic too.
    ko: 하긴, 내가 랩쳐였어도 도로시를 주웠으면 헬레틱으로 만들었을 거다.
    ja: まあ、私がラプチャー側でもそうするだろう。
  d_main_49_08_s_145:
    speaker: andersen_c
    en: Damn them. They have good taste.
    ko: 망할 놈들. 좋은 건 알아가지고.
    ja: いまいましいが、ヤツらも見る目がある。
  d_main_49_08_s_146:
    speaker: rapunzel_s
    en: Commander, how in the world...?!
    ko: 지휘관. 이게 대체…!
    ja: 指揮官、これはいったい…！
  d_main_49_08_s_147:
    speaker: hongryeon_g
    en: "... Explain thyself."
    ko: "…설명하게."
    ja: "…説明してくれるか。"
  d_main_49_08_s_148:
    speaker: andersen_c
    en: Explain what? Dorothy was corrupted and turned into a Heretic. The end.
    ko: |-
      뭘 설명해. 도로시는 침식에 걸려 헬레틱이 되었다.
      끝.
    ja: |-
      説明も何も…
      ドロシーが侵食されてヘレティックになった。
      それだけだ。
  d_main_49_08_s_149:
    speaker: hongryeon_g
    en: You rascal! Dost thou think I jest?!
    ko: 네 이놈! 장난하는 것 같은가!
    ja: 貴様…とぼけている場合か！？
  d_main_49_08_s_150:
    speaker: andersen_c
    en: Is that any way to speak to your elders, huh?
    ko: 너 이, 어른한테 그게 무슨 말버릇이냐, 응?
    ja: |-
      おっと、大人に向かって
      ずいぶんな口のきき方だな？ん？
  d_main_49_08_s_151:
    speaker: hongryeon_g
    en: Bear thyself with due seriousness!
    ko: 진지하게 하게!
    ja: 真剣に答えぬか！
  d_main_49_08_s_152:
    speaker: andersen_c
    en: I am being serious.
    ko: 진지하게 하고 있어.
    ja: 真剣に答えているさ。
  d_main_49_08_s_153:
    speaker: andersen_c
    en: Dorothy has become a Heretic. So what we have to do now is...
    ko: |-
      도로시는 헬레틱이 됐다.
      그러니 우리가 해야 할 일은-
    ja: |-
      ドロシーがヘレティックにされた。
      だったら、我々がやるべきことは――
  d_main_49_08_s_154:
    speaker: "<Self>"
    en: "... Get ready, everyone."
    ko: "…다들, 준비해."
    ja: "…みんな、準備はいいな"
  d_main_49_08_s_155:
    speaker: "<Self>"
    en: We're taking Dorothy back.
    ko: 도로시를 되찾는다.
    ja: ドロシーを取り戻す
  d_main_49_08_s_156:
    speaker: andersen_c
    en: Exactly.
    ko: "…그렇지."
    ja: "…そういうことだ。"
  d_main_49_08_s_157:
    speaker: andersen_c
    en: We must get her back.
    ko: 반드시 되찾는다.
    ja: 必ず取り戻す。
  d_main_49_08_s_158:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_s_159:
    speaker: "<Narration>"
    en: Dorothy takes her time surveying us.
    ko: 도로시가 우리를 천천히 둘러본다.
    ja: |-
      ドロシーが私たちの顔を
      一人ずつ確かめるように見回した
  d_main_49_08_s_160:
    speaker: "<Narration>"
    en: Then slowly rising into the air...
    ko: 천천히 공중으로 솟은 후
    ja: それから、悠然と宙に浮かび上がり…
  d_main_49_08_s_161:
    speaker: "<Narration>"
    en: She begins radiating black light.
    ko: 검은 빛을 뿜어냈다.
    ja: 黒い光を放った
  d_main_49_08_s_162:
    speaker: andersen_c
    en: Now, before we get her back.
    ko: 자, 되찾기 전에.
    ja: だが、取り戻す前に…
  d_main_49_08_s_163:
    speaker: andersen_c
    en: For trying to kill us without even recognizing her superior, friends, or comrades...
    ko: 상사도, 친구도, 동료도 못 알아보고 죽이려고 달려든
    ja: |-
      上官も、戦友も、仲間の顔も
      見分けがつかなくなってしまった…
  d_main_49_08_s_164:
    speaker: andersen_c
    en: Let's teach this insolent girl a lesson.
    ko: 건방진 아가씨를 혼내주는 것 부터 하자고.
    ja: |-
      薄情なお嬢様への
      お仕置きから始めるとしようか。
  d_main_49_08_s_165:
    speaker: "<Narration>"
    en: As Dorothy transforms,
    ko: 거대화 한 도로시에게서
    ja: 巨大化したドロシーは…
  d_main_49_08_s_166:
    speaker: "<Narration>"
    en: countless wings spread out from her.
    ko: 수많은 날개가 펼쳐진다.
    ja: 無数の翼を広げた
d_main_49_08_e:
  d_main_49_08_e_1:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠구구구…!
    ja: ずるり――
  d_main_49_08_e_2:
    speaker: "<Narration>"
    en: Dorothy's transformed body collapses.
    ko: 거대화 한 도로시의 신체가 무너진다.
    ja: ドロシーの身体が形を失う
  d_main_49_08_e_3:
    speaker: "<Narration>"
    en: Through the fluttering white wings and debris,
    ko: 흩날리는 백색의 날개와 파편 사이에서,
    ja: やがて舞い散る白い羽根と身体の断片の間から…
  d_main_49_08_e_4:
    speaker: "<Narration>"
    en: Dorothy's dark form charges.
    ko: 검은 도로시가 돌진해온다.
    ja: ドロシーの黒い影が飛び出した
  d_main_49_08_e_5:
    speaker: snowwhite_h
    en: Dorothy...!
    ko: 도로시--!!
    ja: ドロシー…！！
  d_main_49_08_e_6:
    speaker: "<Narration>"
    en: Snow White's Seven Dwarves begins gathering light.
    ko: 스노우 화이트의 세븐스 드워프에 빛이 모여든다.
    ja: セブンスドワーフのチャージは済んでいる
  d_main_49_08_e_7:
    speaker: "<Narration>"
    en: She aims at the approaching Dorothy.
    ko: 돌진해오는 도로시를 겨눈다.
    ja: |-
      スノーホワイトは
      突進するドロシーに狙いを定めた
  d_main_49_08_e_8:
    speaker: snowwhite_h
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_main_49_08_e_9:
    speaker: "<Narration>"
    en: But even I can see the muzzle of her gun trembling.
    ko: |-
      하지만 내가 봐도 보인다.
      떨리는 총구 끝이 보인다.
    ja: |-
      だが、私が見ても分かるほどに
      銃口が震えている
  d_main_49_08_e_10:
    speaker: "<Narration>"
    en: When the light bursts from Seven Dwarves, it only grazes Dorothy's black wing.
    ko: 결국, 세븐스 드워프에게서 뻗어나온 빛은 도로시의 검은 날개를 스칠 뿐이다.
    ja: |-
      結局、セブンスドワーフの射撃は
      ドロシーの黒い翼をかすめただけに終わった
  d_main_49_08_e_11:
    speaker: "<Narration>"
    en: "*Pew! Pew! Pew!*"
    ko: 푸슝-! 푸슝-! 푸슝-!
    ja: たて続けの射撃音
  d_main_49_08_e_12:
    speaker: "<Narration>"
    en: Dorothy's gun fires bursts of light.
    ko: 도로시의 총구가 빛을 쏘아댄다.
    ja: ドロシーの銃が光を放つ
  d_main_49_08_e_13:
    speaker: "<Narration>"
    en: Rapunzel jumps in front of Snow White and activates her shield.
    ko: 라푼젤이 스노우 화이트의 앞을 막아서고 실드를 전개한다.
    ja: |-
      ラプンツェルがスノーホワイトの前に立ち、
      シールドを展開した
  d_main_49_08_e_14:
    speaker: "<Narration>"
    en: Realizing her attacks have been blocked, Dorothy changes direction midair
      and circles around the shield to approach from behind.
    ko: |-
      공격이 막힌 것을 확인한 도로시가 공중에서 방향을 전환,
      실드가 전개된 면을 선회하여 접근한다.
    ja: |-
      攻撃が防がれたことを確認したドロシーは
      空中で進路を変え、シールドの側面へ回り込んだ
  d_main_49_08_e_15:
    speaker: "<Narration>"
    en: There, Scarlet is crouched, poised to draw her sword.
    ko: 그곳엔, 홍련이 발도 자세를 한 채 웅크리고 있다.
    ja: |-
      だがその先には、
      紅蓮が居合の構えで待ち受けていた
  d_main_49_08_e_16:
    speaker: dorothy_h
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_main_49_08_e_17:
    speaker: hongryeon_g
    en: Forgive me, but I shall not hold back.
    ko: 미안하지만, 봐주지 않겠네.
    ja: 悪いが、手加減はできぬ。
  d_main_49_08_e_18:
    speaker: "<Narration>"
    en: Scarlet's sword flies from its sheath.
    ko: 홍련의 검집에서 검이 뻗어나온다.
    ja: 紅蓮がさやから剣を抜き放つ
  d_main_49_08_e_19:
    speaker: "<Narration>"
    en: A flash arcs precisely toward Dorothy's neck.
    ko: 섬광은, 정확히 도로시의 목을 향해 그어진다.
    ja: 剣の軌跡は正確にドロシーの首を狙って伸びた
  d_main_49_08_e_20:
    speaker: hongryeon_g
    en: Alas... I cannot cleave.
    ko: "…아, 못베겠군."
    ja: "…く、届かぬか…"
  d_main_49_08_e_21:
    speaker: "<Narration>"
    en: "*Slash!*"
    ko: 스칵!
    ja: ザクッ！
  d_main_49_08_e_22:
    speaker: "<Narration>"
    en: The flash from Scarlet's blade only slices a few strands of Dorothy's hair.
    ko: 홍련의 검집에서 뻗은 섬광은 도로시의 머리칼을 몇 가닥 잘라낼 뿐이다.
    ja: |-
      紅蓮の放った一撃は、
      ドロシーの髪を数本切り落としただけだった
  d_main_49_08_e_23:
    speaker: "<Narration>"
    en: "*Pow!*"
    ko: 쩌억-!
    ja: ドゴッ！
  d_main_49_08_e_24:
    speaker: "<Narration>"
    en: Dorothy spins in the air and lands a kick squarely on Scarlet's stomach.
    ko: 공중에서 몸을 회전시킨 도로시의 발차기가 홍련의 복부에 명중한다.
    ja: |-
      空中で体をひねったドロシーの蹴りが、
      紅蓮の腹に突き刺さる
  d_main_49_08_e_25:
    speaker: hongryeon_g
    en: Aye...! Thou art meant to fight with thy body...!
    ko: 역시…! 자네는 몸을 써야 한다니까…!
    ja: やはり…！君は体を使ってこそ…！
  d_main_49_08_e_26:
    speaker: "<Narration>"
    en: Scarlet goes flying into Snow White and Rapunzel, sending all three of them
      tumbling to the ground.
    ko: |-
      날아간 홍련에게 스노우 화이트와 라푼젤이 휘말려,
      함께 바닥을 구른다.
    ja: |-
      蹴り飛ばされた紅蓮に
      スノーホワイトとラプンツェルも巻き込まれ、
      地面を転がる
  d_main_49_08_e_27:
    speaker: "<Narration>"
    en: Dorothy once again charges at the three of them lying on the ground, aiming
      her gun at them.
    ko: 도로시가 쓰러진 셋을 향해 다시 돌진하며 총구를 겨눈다.
    ja: |-
      倒れた3人に向けてドロシーが距離を詰め、
      銃口を向けようとした
  d_main_49_08_e_28:
    speaker: "<Narration>"
    en: Rapi activates her drill and attacks Dorothy from the flank.
    ko: 그 측면을, 라피가 드릴을 전개해 공격한다.
    ja: |-
      それを阻むように、側面から
      ラピが渦巻くエネルギーをうならせた
  d_main_49_08_e_29:
    speaker: rapi_red
    en: Pierce through!
    ko: 꿰뚫어라-!!
    ja: 貫けぇ！！
  d_main_49_08_e_30:
    speaker: "<Narration>"
    en: "*Craaack*"
    ko: 카가가가각--!!
    ja: ドガガガガッ…！！
  d_main_49_08_e_31:
    speaker: dorothy_h
    en: Urgh...!
    ko: 크으으으…!!
    ja: ぐっ…！！
  d_main_49_08_e_32:
    speaker: "<Narration>"
    en: Dorothy raises both arms and blocks Rapi's drill.
    ko: 라피의 드릴을 도로시가 양 팔을 들어 막아낸다.
    ja: ラピの攻撃を、ドロシーが両腕で受け止めた
  d_main_49_08_e_33:
    speaker: "<Narration>"
    en: Sparks erupt as fragments go flying.
    ko: 스파크가 튀고, 파편이 흩날린다.
    ja: 火花が散り、装甲が削れて弾ける
  d_main_49_08_e_34:
    speaker: "<Self>"
    en: Keep up pressure! Pin her down and keep her from moving!
    ko: 밀어붙여! 고정해서 기동력을 뺏어야 해!
    ja: 押し込めろ！動きを封じて、機動力を奪え！
  d_main_49_08_e_35:
    speaker: rapi_red
    en: Hrrrnnngh...!
    ko: 흐으으읍…!!
    ja: はぁぁぁっ…！！
  d_main_49_08_e_36:
    speaker: "<Narration>"
    en: Vroooooom!
    ko: 콰아아아--!!
    ja: ゴウッ――！！
  d_main_49_08_e_37:
    speaker: "<Narration>"
    en: The thrusters on Rapi's Seven Dwarves spew fire, pushing Dorothy back.
    ko: 라피의 세븐스 드워프의 버니어가 불을 뿜어내며 도로시를 밀어붙인다.
    ja: |-
      ラピのセブンスドワーフゼロのバーニアが
      火を噴き、ドロシーを抑え込む
  d_main_49_08_e_38:
    speaker: "<Narration>"
    en: Dorothy is driven into the ground.
    ko: 그대로, 지면에 처박는다.
    ja: 耐えきれず、ドロシーは地面に叩きつけられた
  d_main_49_08_e_39:
    speaker: "<Narration>"
    en: Rapi stands over her as she lies there.
    ko: 바닥에 누운 도로시, 서 있는 라피.
    ja: 倒れたドロシーの前に、ラピが迫る
  d_main_49_08_e_40:
    speaker: "<Narration>"
    en: Just as Rapi activates her drill again, preparing to thrust it toward Dorothy,
    ko: 라피가 다시 한번 드릴을 전개해 도로시에게 내뻗으려는 순간,
    ja: |-
      再びドリルをうならせ、
      突き出そうとしたその時…
  d_main_49_08_e_41:
    speaker: "<Narration>"
    en: Dorothy kips up into a kick, catching Rapi on the chin.
    ko: 도로시가 오버 헤드 킥으로 라피의 턱을 올려친다.
    ja: |-
      ドロシーが身体を反らして
      逆さに跳びあがり、
      ラピのあごを蹴り上げた
  d_main_49_08_e_42:
    speaker: rapi_red
    en: Ugh...!
    ko: 커억…!
    ja: ぐはっ…！
  d_main_49_08_e_43:
    speaker: anis_i_w
    en: You've got a gun, why aren't you shooting?!
    ko: 쏘라는 총은 안쏘고 말이야!
    ja: 銃を使わなくていいの？
  d_main_49_08_e_44:
    speaker: "<Narration>"
    en: Anis hits Dorothy from behind with a knockout kick.
    ko: 도로시의 뒤에서 아니스의 수면 차기가 적중한다.
    ja: |-
      ドロシーの背面に、
      アニスが水面蹴りを叩き込む
  d_main_49_08_e_45:
    speaker: "<Narration>"
    en: As Dorothy loses her balance and starts to fall, Neon swings her gun toward
      her face.
    ko: 중심을 잃고 쓰러지려는 도로시의 얼굴을 향해, 네온의 총이 휘둘러진다.
    ja: |-
      体勢を崩したドロシーの顔面めがけて、
      ネオンが銃を振りかぶった
  d_main_49_08_e_46:
    speaker: neon_v_w
    en: Sorry about this!
    ko: 죄송해요!
    ja: 失礼します！
  d_main_49_08_e_47:
    speaker: "<Narration>"
    en: "*Baaaaam!*"
    ko: 까아아앙--!!
    ja: バキッ！！
  d_main_49_08_e_48:
    speaker: "<Narration>"
    en: Dorothy gets hit by Neon's gun and goes flying.
    ko: 네온이 휘두른 총에 맞은 도로시가 날아간다.
    ja: |-
      ネオンの振り抜いた銃が直撃し、
      ドロシーが吹き飛ぶ
  d_main_49_08_e_49:
    speaker: "<Self>"
    en: Rapi! Grab her and throw her!
    ko: 라피! 잡아 던져!
    ja: ラピ！投げ飛ばせ！
  d_main_49_08_e_50:
    speaker: rapi_red
    en: Roger!
    ko: 라져!
    ja: ラジャー！
  d_main_49_08_e_51:
    speaker: "<Narration>"
    en: Before Dorothy can hit the ground, Rapi grabs her by the ankle and uses her
      momentum to fling her away.
    ko: 바닥에 쓰러지기 전, 라피가 도로시의 발목을 잡고 원심력을 이용해 힘껏 집어던진다.
    ja: |-
      倒れ込む寸前のドロシーの足首を
      ラピがつかんで全力で振り回し、
      遠心力を乗せて投げ飛ばした
  d_main_49_08_e_52:
    speaker: "<Narration>"
    en: With a resounding crash, Dorothy goes flying and slams into a boulder.
    ko: 꽈앙-! 하는 소리와 함께 도로시가 바위에 날아가 박힌다.
    ja: |-
      激しい衝突音とともに、
      ドロシーが岩に身体をめり込ませる
  d_main_49_08_e_53:
    speaker: "<Self>"
    en: Focus fire!
    ko: 집중 사격!
    ja: 集中射撃！
  d_main_49_08_e_54:
    speaker: "<Narration>"
    en: Rapi, Anis, and Neon unleash a barrage of fire on Dorothy, who's lodged in
      the boulder.
    ko: 라피와 아니스, 네온이 바위에 박힌 도로시를 향해 일제히 탄환을 쏟아붓는다.
    ja: |-
      ラピとアニス、ネオンが動きの封じられた
      ドロシーめがけて、一斉に射撃を浴びせた
  d_main_49_08_e_55:
    speaker: "<Narration>"
    en: Explosions and flames erupt, and debris flies in all directions.
    ko: 폭발과 폭연, 파편이 사방 팔방으로 튄다.
    ja: |-
      爆発と煙が巻き起こり、
      粉々になった何かをあたりにまき散らす
  d_main_49_08_e_56:
    speaker: andersen_c
    en: Wow...
    ko: "…와우."
    ja: "…こりゃすごいな。"
  d_main_49_08_e_57:
    speaker: rapunzel_s
    en: W-wait! That's a little overboard...!
    ko: 자, 잠깐만요! 너무 심한 게…!
    ja: |-
      ま、待ってください！
      いくら何でもやりすぎでは…！？
  d_main_49_08_e_58:
    speaker: hongryeon_g
    en: Dost thou mean to kill her?!
    ko: 죽일 셈인가!
    ja: 殺す気か！？
  d_main_49_08_e_59:
    speaker: anis_i_w
    en: What are you talking about? This would hardly scratch even uncorrupted Dorothy!
    ko: 무슨 소리야! 노멀 도로시도 이정도는 끄떡없다고!
    ja: |-
      何言ってんの！元々のドロシーだって
      これくらいじゃびくともしなかったわよ！
  d_main_49_08_e_60:
    speaker: neon_v_w
    en: Everyone, help us! We need to do as much damage as we can!
    ko: 여러분들도 도와줘요! 여기서 최대한 대미지를 줘야 해요!
    ja: |-
      みなさんも手伝ってください！
      今のうちにできる限り弱らせないと！
  d_main_49_08_e_61:
    speaker: rapi_red
    en: Tsk...! She's getting up!
    ko: 치잇…! 뚫고 나온다!
    ja: 早く…！立て直される前に！
  d_main_49_08_e_62:
    speaker: andersen_c
    en: Snow White. Fire.
    ko: 스노우 화이트. 쏴.
    ja: スノーホワイト、頼む。
  d_main_49_08_e_63:
    speaker: snowwhite_h
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_49_08_e_64:
    speaker: snowwhite_h
    en: Aaaagh!
    ko: 으아아아--!!
    ja: うああああッ！！
  d_main_49_08_e_65:
    speaker: "<Narration>"
    en: "*Booom!*"
    ko: 콰아아아앙--!!
    ja: カッ！！
  d_main_49_08_e_66:
    speaker: "<Narration>"
    en: Snow White's Seven Dwarves spews fire.
    ko: 스노우 화이트의 세븐스 드워프가 불을 뿜는다.
    ja: スノーホワイトのセブンスドワーフが火を噴いた
  d_main_49_08_e_67:
    speaker: "<Narration>"
    en: The boulder Dorothy is embedded in crumbles to pieces.
    ko: 도로시가 박혀 있는 바위째로, 파괴한다.
    ja: |-
      めり込んでいる岩が砕かれ、
      ドロシーもろとも吹き飛んだ
  d_main_49_08_e_68:
    speaker: "<Narration>"
    en: Dorothy goes flying quite a distance before struggling to get back on her
      feet.
    ko: 한참을 날아간 도로시는 몸을 일으키려 애쓴다.
    ja: |-
      遠くまで飛ばされたドロシーは
      体を起こそうともがいた
  d_main_49_08_e_69:
    speaker: "<Narration>"
    en: She strains to steady her trembling body as she lets out ragged breaths.
    ko: 부들거리는 신체를 온 힘을 다해 가누려 하며, 거친 호흡을 내뱉는다.
    ja: |-
      震える身体を必死に支え、
      荒い息を吐いている
  d_main_49_08_e_70:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_71:
    speaker: "<Self>"
    en: She's not using her self-repair.
    ko: 자가 수복을 쓰지 않아.
    ja: 自己修復している様子がない
  d_main_49_08_e_72:
    speaker: snowwhite_h
    en: What...?
    ko: "…뭐?"
    ja: "…何だと？"
  d_main_49_08_e_73:
    speaker: "<Self>"
    en: She's not using self-repair! She's a Heretic, but she's not using it!
    ko: 자가 수복을 하지 않아! 헬레틱인데 하지 않는다고!
    ja: |-
      自己修復をしていない！
      ヘレティックならできるはずだが…
  d_main_49_08_e_74:
    speaker: "<Self>"
    en: It's not that she can't! She just won't!
    ko: 못하는 게 아냐! 쓰지 않는 거야!
    ja: できないのではなく、使っていないのか！
  d_main_49_08_e_75:
    speaker: "<Narration>"
    en: Dorothy flies up into the air before charging toward us at low altitude.
    ko: 도로시가 공중으로 떠오른 후, 우릴 향해 저공 비행으로 돌진해온다.
    ja: |-
      ドロシーが空に浮かび上がり、
      私たちに向かって低空を突進してくる
  d_main_49_08_e_76:
    speaker: "<Narration>"
    en: However, she soon crashes to the ground and skids.
    ko: "…하지만, 곧 바닥에 추락하며 바닥을 긁는다."
    ja: |-
      …だが、すぐに墜落し、
      地面を滑るように転がった
  d_main_49_08_e_77:
    speaker: "<Narration>"
    en: She struggles to get to her feet, then stumbles toward us.
    ko: 겨우겨우 일어나, 비틀대며 걸어온다.
    ja: |-
      それでもどうにか立ち上がり、
      よろめきながら歩いて近づいてくる
  d_main_49_08_e_78:
    speaker: "<Narration>"
    en: She opens fire, but every one of her shots misses.
    ko: 총을 쏜다. 모두 빗나간다.
    ja: |-
      射撃をしかけてくるが、
      もはやどこにも狙いが定められていない
  d_main_49_08_e_79:
    speaker: andersen_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_80:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_81:
    speaker: "<Narration>"
    en: Deputy Chief Andersen walks up to Dorothy.
    ko: 엔더슨 부사령관이 도로시에게로 걸어간다.
    ja: |-
      アンダーソン副司令官が
      ドロシーに向かって歩み出した
  d_main_49_08_e_82:
    speaker: "<Narration>"
    en: I walk alongside him.
    ko: 나도 그 옆에서 함께 걷는다.
    ja: 私もその横について近づいた
  d_main_49_08_e_83:
    speaker: dorothy_h
    en: Ah... Ngh...
    ko: 아… 으….
    ja: あ…あぁ…
  d_main_49_08_e_84:
    speaker: "<Narration>"
    en: Dorothy aims her gun again.
    ko: 도로시가 총을 다시 겨눈다.
    ja: ドロシーが再び銃をこちらに向けてくる
  d_main_49_08_e_85:
    speaker: "<Narration>"
    en: She doesn't fire.
    ko: 쏘지 않는다.
    ja: 何も起こらない
  d_main_49_08_e_86:
    speaker: "<Narration>"
    en: She barely manages to move her trembling arm to aim the gun again.
    ko: 덜덜 떨리는 팔을 겨우 움직여 다시 총을 겨눈다.
    ja: 震える腕で、もう一度狙いを変えた
  d_main_49_08_e_87:
    speaker: "<Narration>"
    en: She points it at her own head.
    ko: 자신의, 머리를 향해 겨눈다.
    ja: 自分の頭に
  d_main_49_08_e_88:
    speaker: dorothy_h
    en: Comman...der...
    ko: 지휘… 관….
    ja: 指揮…官…
  d_main_49_08_e_89:
    speaker: dorothy_h
    en: Your... Grace...
    ko: 귀… 하….
    ja: "…様…"
  d_main_49_08_e_90:
    speaker: dorothy_h
    en: Ra...pi... A...nis... Ne...on...
    ko: 라… 피. 아니스… 네… 온.
    ja: ラピ…アニス…ネオン…
  d_main_49_08_e_91:
    speaker: dorothy_h
    en: Snow... White... Scar...let... Rapun... zel...
    ko: |-
      스노우… 화이트….
      홍… 련. 라푼… 젤.
    ja: |-
      スノー…ホワイト…
      紅蓮…ラプンツェル…
  d_main_49_08_e_92:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_93:
    speaker: dorothy_h
    en: Save... me...
    ko: 구해… 줘… 요.
    ja: 助けて…ください…
  d_main_49_08_e_94:
    speaker: dorothy_h
    en: Help... me...
    ko: 도와… 줘… 요….
    ja: 助けに…来て…ください…
  d_main_49_08_e_95:
    speaker: snowwhite_h
    en: "...!"
    ko: "---!!"
    ja: "――！！"
  d_main_49_08_e_96:
    speaker: "<Narration>"
    en: I reach out to grab Dorothy's arm, pulling it away from her head.
    ko: 나는 손을 뻗어, 자신을 겨눈 도로시의 팔을 잡아 멀리 떨어뜨린다.
    ja: |-
      私は手を伸ばし、自分に銃を向ける
      ドロシーの腕をつかみ遠ざける
  d_main_49_08_e_97:
    speaker: "<Narration>"
    en: "... She doesn't seem to resist."
    ko: "…반항하는 기색은, 없다."
    ja: "…抵抗する様子は…ない"
  d_main_49_08_e_98:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: カチャリ――
  d_main_49_08_e_99:
    speaker: "<Narration>"
    en: Deputy Chief Andersen points his gun at Dorothy.
    ko: 엔더슨 부사령관이 총을 도로시에게 겨눈다.
    ja: |-
      アンダーソン副司令官が
      ドロシーに銃を向けた
  d_main_49_08_e_100:
    speaker: "<Self>"
    en: Is that a Vapaus round?
    ko: 언체인드 탄환입니까?
    ja: アンチェインド弾ですか？
  d_main_49_08_e_101:
    speaker: andersen_c
    en: Yes. I got held up making this.
    ko: 그래. 이걸 만드느라 좀 늦었어.
    ja: ああ。これを用意するのに時間がかかった。
  d_main_49_08_e_102:
    speaker: "<Self>"
    en: I'll add to that.
    ko: 보태겠습니다.
    ja: 私も力添えを
  d_main_49_08_e_103:
    speaker: "<Narration>"
    en: I reach out with my other hand and place it in front of the gun's muzzle.
    ko: 남은 손을 뻗어 총구 앞에 둔다.
    ja: |-
      空いている手を
      銃口の前に差し出した
  d_main_49_08_e_104:
    speaker: andersen_c
    en: Are you sure?
    ko: 괜찮겠나?
    ja: 大丈夫なのか？
  d_main_49_08_e_105:
    speaker: "<Self>"
    en: It'll heal on its own.
    ko: 놔두면 낫습니다.
    ja: 放っておけば治りますから
  d_main_49_08_e_106:
    speaker: andersen_c
    en: How admirable.
    ko: 멋지군.
    ja: 大した度胸だ。
  d_main_49_08_e_107:
    speaker: "<Narration>"
    en: Deputy Chief Andersen points his gun at Dorothy's head.
    ko: 엔더슨 부사령관의 총구가 도로시의 머리를 향한다.
    ja: |-
      アンダーソン副司令官が
      ドロシーの頭に狙いをつけた
  d_main_49_08_e_108:
    speaker: andersen_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_109:
    speaker: "<Narration>"
    en: "*Rattle, rattle*"
    ko: 달칵 달칵 달칵.
    ja: カタカタ――
  d_main_49_08_e_110:
    speaker: andersen_c
    en: Hah... Just look at me.
    ko: "…허. 이것 참."
    ja: "…ふっ、まったく…"
  d_main_49_08_e_111:
    speaker: "<Narration>"
    en: His gun trembles.
    ko: 떨리는 총구.
    ja: 銃口が震えている
  d_main_49_08_e_112:
    speaker: "<Narration>"
    en: Just then, Dorothy reaches out with her other hand.
    ko: 그 때, 도로시의 남은 팔이 뻗어온다.
    ja: ドロシーがもう一方の腕を伸ばした
  d_main_49_08_e_113:
    speaker: "<Narration>"
    en: She grips the trembling gun tightly.
    ko: 떨리는 총몸을 꽉 움켜쥔다.
    ja: 震える銃身が固く握りしめられる
  d_main_49_08_e_114:
    speaker: "<Narration>"
    en: The gun steadies.
    ko: 총구의 떨림이 멎는다.
    ja: 銃口の震えが止まった
  d_main_49_08_e_115:
    speaker: dorothy_h
    en: "... Are you... scared?"
    ko: "…겁먹… 었… 나요."
    ja: "…怖いの…ですか…"
  d_main_49_08_e_116:
    speaker: andersen_c
    en: "*Sigh*"
    ko: "…하."
    ja: "…はは…"
  d_main_49_08_e_117:
    speaker: andersen_c
    en: Lilith and I really do have an eye for talent.
    ko: 역시 나랑 릴리스가 보는 눈이 있어.
    ja: やはり、私もリリスも見る目があったな。
  d_main_49_08_e_118:
    speaker: andersen_c
    en: Choosing you was the right decision, Dorothy.
    ko: |-
      너를 선택한 건 정답이었다.
      도로시.
    ja: ドロシー、君を選んで正解だった。
  d_main_49_08_e_119:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: パン――！
  d_main_49_08_e_120:
    speaker: "<Narration>"
    en: The Vapaus round pierces my hand and hits Dorothy in the head.
    ko: 언체인드 탄환이 내 손을 뚫고, 도로시의 머리에 명중한다.
    ja: |-
      アンチェインドの弾丸は私の手を貫き、
      ドロシーの頭に命中した
  d_main_49_08_e_121:
    speaker: "<Narration>"
    en: I don't feel any pain.
    ko: 통증은 느껴지지 않는다.
    ja: 痛みは感じなかった
  d_main_49_08_e_122:
    speaker: "<Narration>"
    en: Deputy Chief Andersen and I take a step back and look at Dorothy's slumped
      form.
    ko: |-
      나와 엔더슨 부사령관은 한걸음 물러서서,
      축 처진 도로시를 바라본다.
    ja: |-
      私とアンダーソン副司令官は一歩下がり、
      ぐったりと力の抜けたドロシーを見守った
  d_main_49_08_e_123:
    speaker: "<Narration>"
    en: "... She doesn't move."
    ko: "…도로시는 움직이지 않는다."
    ja: "…ドロシーは動かない"
  d_main_49_08_e_124:
    speaker: rapunzel_s
    en: Dorothy!
    ko: 도로시!
    ja: ドロシー！
  d_main_49_08_e_125:
    speaker: "<Narration>"
    en: Rapunzel runs over and checks on her.
    ko: 라푼젤이 다가와 도로시의 상태를 살핀다.
    ja: |-
      ラプンツェルが駆け寄り、
      ドロシーの様子を確かめる
  d_main_49_08_e_126:
    speaker: "<Narration>"
    en: She closes her eyes and places a hand on Dorothy's head.
    ko: 눈을 감고, 도로시의 머리에 손을 얹는다.
    ja: 目を閉じて、ドロシーの頭に手を置いた
  d_main_49_08_e_127:
    speaker: "<Narration>"
    en: A golden glow emanates outward.
    ko: 황금색 빛이 퍼져나온다.
    ja: 黄金の光が広がっていく
  d_main_49_08_e_128:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_129:
    speaker: rapunzel_s
    en: Everyone! Come over and talk to Dorothy!
    ko: 다들! 와서 도로시에게 말을 걸어줘요!
    ja: 皆さん！ドロシーに話しかけてあげてください！
  d_main_49_08_e_130:
    speaker: rapunzel_s
    en: The corruption is too severe! It must be an enhanced version!
    ko: 침식의 체급이 너무 커요! 아마도 개량형…!
    ja: |-
      強力な侵食です！
      おそらく次世代型の…！
  d_main_49_08_e_131:
    speaker: rapunzel_s
    en: At this rate, the Vapaus might destroy her NIMPH first, then the corruption!
    ko: |-
      이대로라면 언체인드가 NIMPH를 먼저 죽이게 될 테고,
      침식은 그 후에 죽어요!
    ja: |-
      このままではアンチェインドが
      侵食より先にNIMPHの方を
      死滅させてしまいます！
  d_main_49_08_e_132:
    speaker: rapunzel_s
    en: Who she is when she comes back will be determined by whatever's left in her
      head—the Corruption or her NIMPH!
    ko: 침식과 NIMPH… 최종적으로 머리에 남은 게 무엇이냐에 따라 [되돌아 왔을 때]의 자아가 결정될거예요!
    ja: |-
      最後まで残っているのがどちらかによって、
      「戻った時」の状態も定まるはずです！
  d_main_49_08_e_133:
    speaker: rapunzel_s
    en: We need to strengthen her NIMPH quickly! If we don't, she'll revert to her
      Heretic self!
    ko: |-
      빨리 NIMPH의 체급을 키워야해요!
      그렇지 않으면 헬레틱일 때의 인격으로 되돌아와요!
    ja: |-
      早くNIMPHの強度を上げないと…！
      ヘレティックの人格に戻ってしまいます！
  d_main_49_08_e_134:
    speaker: snowwhite_h
    en: Wh-what do you need us to do?
    ko: 어떻게, 어떻게 하면 되지?
    ja: どうすれば…何をすればいい？
  d_main_49_08_e_135:
    speaker: rapunzel_s
    en: We need to strengthen Dorothy's sense of self! Talk to her!
    ko: 도로시의 자아를 더 키워줘요! 말을 걸어줘요!
    ja: |-
      ドロシーの自我を強化するのです！
      話しかけてください！
  d_main_49_08_e_136:
    speaker: snowwhite_h
    en: Dorothy!
    ko: 도로시!
    ja: ドロシー！
  d_main_49_08_e_137:
    speaker: snowwhite_h
    en: I... uh...
    ko: 나는… 어….
    ja: 私は…その…
  d_main_49_08_e_138:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_139:
    speaker: snowwhite_h
    en: "... Dorothy."
    ko: "…도로시."
    ja: "…ドロシー。"
  d_main_49_08_e_140:
    speaker: snowwhite_h
    en: I gave up on you.
    ko: 난 너를 포기했다.
    ja: 私は、あなたを諦めてしまった。
  d_main_49_08_e_141:
    speaker: snowwhite_h
    en: I was disappointed in you when you said you would no longer fight for humanity.
    ko: 더는 인류를 위해 싸우지 않는다고 말하는 너에게 실망했다.
    ja: |-
      人類のために戦うのはやめたと
      言われた時、とても残念だった。
  d_main_49_08_e_142:
    speaker: snowwhite_h
    en: So I gave up on you.
    ko: 그래서 너를 포기했다.
    ja: あの時から、諦めていた。
  d_main_49_08_e_143:
    speaker: snowwhite_h
    en: You're determined in so many ways, I thought you'd never change your mind
      once you'd made a decision.
    ko: |-
      너는 여러 가지 의미로 강단이 확실한 녀석이니까,
      한 번 정한 것을 되물리는 일 따위는 없을 거라 확신했다.
    ja: |-
      いろいろな意味で固い意思の持ち主だから、
      一度決めたことは
      もう変えられないと思っていた。
  d_main_49_08_e_144:
    speaker: snowwhite_h
    en: My prediction was correct.
    ko: 내 예상이 맞았다.
    ja: それ自体は間違っていなかった。
  d_main_49_08_e_145:
    speaker: snowwhite_h
    en: You've never once gone back on your decision.
    ko: 너는 한번 정한 것을 되물리지 않았어.
    ja: 一度決めたことは何も変えていなかった。
  d_main_49_08_e_146:
    speaker: snowwhite_h
    en: I grew certain when I heard what he had to say about you.
    ko: 그 녀석에게 너에 대한 이야기를 들었을 때, 확신했다.
    ja: アークでどうしているかを聞いた時…
  d_main_49_08_e_147:
    speaker: snowwhite_h
    en: I was certain when you offered to lead the Third Surface Reclamation War.
    ko: 3차 지상 탈환전의 선봉이 된다고 했을 때, 확신했다.
    ja: |-
      第三次地上奪還戦の先頭に立つと
      言われて、確信した。
  d_main_49_08_e_148:
    speaker: snowwhite_h
    en: You never once went back on your decision to fight for humanity.
    ko: 너는 인류를 위해 싸우는 것을, 단 한번도 되물리지 않았다.
    ja: |-
      人類のために戦うという決意は、
      一度たりとも捨てていなかった。
  d_main_49_08_e_149:
    speaker: snowwhite_h
    en: You were always the same. I just never realized it.
    ko: |-
      너는 언제나 그대로였다.
      내가 그걸 몰랐어.
    ja: |-
      何も変わっていなかった。
      私が気づかなかっただけだ。
  d_main_49_08_e_150:
    speaker: snowwhite_h
    en: Instead of trying to sway you, I gave up on you.
    ko: 너를 설득하지 않고, 너를 포기했다.
    ja: 説得をやめて、投げ出してしまった。
  d_main_49_08_e_151:
    speaker: snowwhite_h
    en: I'm sorry.
    ko: 미안하다.
    ja: すまない。
  d_main_49_08_e_152:
    speaker: rapunzel_s
    en: "... I didn't realize you've been struggling for so long."
    ko: "…이렇게나 오랜 시간 동안 괴로워 했었군요."
    ja: |-
      …こんなにも長い間、
      苦しんでいたのですね。
  d_main_49_08_e_153:
    speaker: rapunzel_s
    en: You've been agonizing and second-guessing yourself all this time.
    ko: 계속 고민하고, 계속 망설였군요.
    ja: ずっと悩み、迷い続けて…
  d_main_49_08_e_154:
    speaker: rapunzel_s
    en: And in the midst of that, we turned our backs on you.
    ko: 그랬던 도로시에게, 우리가 등을 돌렸던 것이었군요.
    ja: 私たちは、背を向けてしまっていました。
  d_main_49_08_e_155:
    speaker: rapunzel_s
    en: I'm sorry we weren't there to make those decisions with you.
    ko: 함께 고민하지 못해 미안해요.
    ja: 一人で悩ませてしまって、申し訳ありません。
  d_main_49_08_e_156:
    speaker: rapunzel_s
    en: I'm sorry we weren't there to share your doubts.
    ko: 함께 망설이지 못해 미안해요.
    ja: |-
      あなたの迷いに寄り添うことをせず、
      申し訳ありませんでした。
  d_main_49_08_e_157:
    speaker: rapunzel_s
    en: I'm sorry we never listened to or understood you.
    ko: 도로시의 얘기를 듣지 않고, 도로시의 마음을 알아주지 못 해 미안해요.
    ja: |-
      話に耳を傾けようとせず、
      あなたの気持ちを理解しようともせず、
      申し訳ありませんでした。
  d_main_49_08_e_158:
    speaker: rapunzel_s
    en: So please, come back to us.
    ko: 그러니 돌아와줘요.
    ja: どうか、戻ってきてください。
  d_main_49_08_e_159:
    speaker: rapunzel_s
    en: Come back and accept our apologies.
    ko: 돌아와서, 우리의 사과를 받아줘요.
    ja: |-
      戻って、私たちの謝罪を
      受け入れてはいただけませんか。
  d_main_49_08_e_160:
    speaker: hongryeon_g
    en: "... In hindsight, 'twas you who lifted us from our despair."
    ko: "…돌이켜보면, 무너졌던 우릴 일으켜 줬던 건 자네였네."
    ja: |-
      …思えば、心の折れた私たちを
      立ち上がらせてくれたのは、君であった。
  d_main_49_08_e_161:
    speaker: hongryeon_g
    en: "'Twas you who stood us upon our feet, though we were blinded by our mission,
      clouded with drink, and consumed with death."
    ko: 사명에만 눈이 먼, 술에 취한, 죽음에 빠져든 우릴 일으켜 세웠지.
    ja: |-
      使命に囚われ、酒に溺れ、
      死にかけていた私たちを、
      君が立ち上がらせてくれた。
  d_main_49_08_e_162:
    speaker: hongryeon_g
    en: I looked upon thee and found thee truly admirable.
    ko: 그런 자네의 모습이 너무나 훌륭해 보였다네.
    ja: あの時の君の姿は、実に立派に見えたものだ。
  d_main_49_08_e_163:
    speaker: hongryeon_g
    en: Yet I was blind to it.
    ko: 하지만 그걸 깨닫지 못했어.
    ja: だが、そのせいで気づけなかった。
  d_main_49_08_e_164:
    speaker: hongryeon_g
    en: I was blind to thy need for someone to lean upon.
    ko: 자네도 기댈 곳이 필요했었다는 것을 깨닫지 못했네.
    ja: 君自身にも心の支えが必要だったのだ。
  d_main_49_08_e_165:
    speaker: hongryeon_g
    en: For thou didst seem perfect.
    ko: 그야, 자네는 완벽해 보였으니까.
    ja: 君は完璧だと思い込んでしまっていた。
  d_main_49_08_e_166:
    speaker: hongryeon_g
    en: Alas, I see... Thou wast not perfect.
    ko: "…이제야 알겠네. 자네는 완벽하지 않아."
    ja: "…今なら分かる。そうではなかったのだな。"
  d_main_49_08_e_167:
    speaker: hongryeon_g
    en: This time, we shall save thee.
    ko: 그러니 이번엔 우리가 자넬 구하겠네.
    ja: 今度は我らが君を救おう。
  d_main_49_08_e_168:
    speaker: hongryeon_g
    en: As thy comrades, we shall save thee.
    ko: 동료로서, 자네를 구하겠네.
    ja: |-
      ともに修羅場をくぐった仲間として、
      救わせてくれ。
  d_main_49_08_e_169:
    speaker: hongryeon_g
    en: Arise, Dorothy.
    ko: 일어나주게. 도로시.
    ja: 目を覚ますのだ、ドロシー。
  d_main_49_08_e_170:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_171:
    speaker: snowwhite_h
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー…
  d_main_49_08_e_172:
    speaker: snowwhite_h
    en: You're the Dorothy I knew back then,
    ko: 너는 내가 알던 그때의 도로시다.
    ja: あなたは、私の知るドロシーだ。
  d_main_49_08_e_173:
    speaker: snowwhite_h
    en: the Dorothy who stood with us in our brightest moments.
    ko: 가장 빛나던 때를 함께 했던 도로시다.
    ja: |-
      一番輝いていた頃、
      ともに過ごしたドロシーのままだ。
  d_main_49_08_e_174:
    speaker: snowwhite_h
    en: I was wrong. We were wrong.
    ko: |-
      내가 틀렸었다.
      우리가 틀렸었다.
    ja: |-
      私が間違えていた。
      私たちが間違っていた。
  d_main_49_08_e_175:
    speaker: snowwhite_h
    en: I want to hear you say we were wrong.
    ko: 우리가 틀렸었다는 증명을
    ja: そうだと言ってくれ。
  d_main_49_08_e_176:
    speaker: snowwhite_h
    en: I want to hear it from your own lips.
    ko: 네 입으로 듣고 싶다.
    ja: その口から聞かせて欲しい。
  d_main_49_08_e_177:
    speaker: snowwhite_h
    en: Answer me, Dorothy.
    ko: 대답해다오. 도로시.
    ja: 答えてくれ、ドロシー…
  d_main_49_08_e_178:
    speaker: snowwhite_h
    en: Are you the Goddess of Victory?
    ko: 너는 승리의 여신인가?
    ja: あなたは、勝利の女神か？
  d_main_49_08_e_179:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_180:
    speaker: snowwhite_h
    en: Are you the hope of humanity?
    ko: 너는 인류의 희망인가?
    ja: あなたは、人類の希望か？
  d_main_49_08_e_181:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_182:
    speaker: snowwhite_h
    en: Are you a Goddess?
    ko: 너는 갓데스인가?
    ja: あなたは、ゴッデスか？
  d_main_49_08_e_183:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_184:
    speaker: snowwhite_h
    en: Answer me, Dorothy!
    ko: 대답해라! 도로시!
    ja: 答えろ！ドロシー！
  d_main_49_08_e_185:
    speaker: hongryeon_g
    en: Who art thou?!
    ko: 자네는 누구인가!
    ja: 君は何者か！
  d_main_49_08_e_186:
    speaker: rapunzel_s
    en: Tell us, Dorothy! Say it with your own lips!
    ko: 말해줘요 도로시! 도로시의 입으로! 직접!
    ja: |-
      言ってください、ドロシー！
      あなたの口から！直々に！
  d_main_49_08_e_187:
    speaker: snowwhite_h
    en: Answer us! Dorothy!!
    ko: 대답해라!! 도로시!!
    ja: 答えてくれ！！ドロシー！！
  d_main_49_08_e_188:
    speaker: dorothy_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_189:
    speaker: dorothy_h
    en: I...
    ko: 저는….
    ja: 私は…
  d_main_49_08_e_190:
    speaker: dorothy_g
    en: am a Goddess of Victory.
    ko: 승리의 여신.
    ja: 勝利の女神。
  d_main_49_08_e_191:
    speaker: dorothy_g
    en: The hope of humanity.
    ko: 인류의 희망.
    ja: 人類の希望。
  d_main_49_08_e_192:
    speaker: dorothy_g
    en: The leader of the Goddess Squad.
    ko: 갓데스 스쿼드의 리더.
    ja: ゴッデス部隊のリーダー…
  d_main_49_08_e_193:
    speaker: dorothy_g
    en: I am Dorothy.
    ko: 도로시예요.
    ja: ドロシーです。
  d_main_49_08_e_194:
    speaker: "<Narration>"
    en: Light spreads from Dorothy.
    ko: 빛이, 퍼져나간다.
    ja: 光が、広がった
  d_main_49_08_e_195:
    speaker: "<Narration>"
    en: It pierces her ominous black armor,
    ko: 불길한 검은색의 갑주를 뚫으며
    ja: 忌まわしき黒き装甲を突き破り
  d_main_49_08_e_196:
    speaker: "<Narration>"
    en: and white wings begin to unfurl.
    ko: 백색의 날개가 펼쳐진다.
    ja: 純白の翼が広がる
  d_main_49_08_e_197:
    speaker: "<Narration>"
    en: Surrounded by her dazzling white wings,
    ko: 찬란하게 빛나는 백색의 날개를 두른
    ja: まばゆく輝く白き翼を背に負いし
  d_main_49_08_e_198:
    speaker: "<Narration>"
    en: the Goddess of Victory
    ko: 승리의 여신이
    ja: 勝利の女神が…
  d_main_49_08_e_199:
    speaker: "<Narration>"
    en: casts aside all despair and hesitation
    ko: 모든 절망과 망설임을 벗어던진 채
    ja: すべての絶望と迷いを捨て
  d_main_49_08_e_200:
    speaker: "<Narration>"
    en: and lands on the ground.
    ko: 지상에 내려왔다.
    ja: 今、地上に舞い降りたのだ
  d_main_49_08_e_201:
    speaker: dorothy_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_202:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_203:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_204:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_205:
    speaker: andersen_c
    en: "... Incredible."
    ko: "…죽이는데."
    ja: "…しびれるな。"
  d_main_49_08_e_206:
    speaker: dorothy_g
    en: "... Everyone."
    ko: "…다들."
    ja: "…皆さま…"
  d_main_49_08_e_207:
    speaker: dorothy_g
    en: I'm sorry it took such a long time.
    ko: 미안해요. 오래 걸렸죠.
    ja: |-
      申し訳ございません。
      お待たせしてしまいました。
  d_main_49_08_e_208:
    speaker: dorothy_g
    en: Thank you...
    ko: 기다려줘서, 믿어줘서.
    ja: |-
      待っていてくださったこと、
      信じてくださったこと…
  d_main_49_08_e_209:
    speaker: dorothy_g
    en: for waiting and believing in me.
    ko: 고마워요.
    ja: ありがたく思います。
  d_main_49_08_e_210:
    speaker: hongryeon_g
    en: "... Pray, who art thou?"
    ko: "…네놈. 누구인가."
    ja: "…さては、ニセモノか？"
  d_main_49_08_e_211:
    speaker: dorothy_g
    en: What...?
    ko: "…뭐요?"
    ja: "…何ですって？"
  d_main_49_08_e_212:
    speaker: hongryeon_g
    en: Dorothy would never utter words of apology or gratitude. Who art thou?
    ko: |-
      도로시가 미안하다, 고맙다는 말을 할 리가 없네.
      누구인가.
    ja: |-
      ドロシーが謝罪や感謝を口にするはずがない。
      何者だ。
  d_main_49_08_e_213:
    speaker: dorothy_g
    en: You can't be serious.
    ko: 기가 막혀서 정말.
    ja: 本当に…あきれてしまいますね。
  d_main_49_08_e_214:
    speaker: snowwhite_h
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  d_main_49_08_e_215:
    speaker: rapunzel_s
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー…
  d_main_49_08_e_216:
    speaker: dorothy_g
    en: "... I heard."
    ko: "…다 들었어요."
    ja: "…すべて聞こえていました。"
  d_main_49_08_e_217:
    speaker: dorothy_g
    en: I heard everything all of you said.
    ko: 여러분이 했던 말, 전부 다 들었어요.
    ja: 皆さんの言葉は、何もかも届いています。
  d_main_49_08_e_218:
    speaker: dorothy_g
    en: So... you don't have to say anything more.
    ko: 그러니… 더 말하지 않아도 괜찮아요.
    ja: |-
      ですので…
      それ以上は、言わなくて結構です。
  d_main_49_08_e_219:
    speaker: snowwhite_h
    en: "... We heard everything too."
    ko: "…우리도. 전부 들었다."
    ja: "…私たちもだ。すべて聞いた。"
  d_main_49_08_e_220:
    speaker: snowwhite_h
    en: We saw and heard everything, too.
    ko: 모두 봤고, 모두 들었다.
    ja: 見て、聞いた。何もかも。
  d_main_49_08_e_221:
    speaker: rapunzel_s
    en: Thank you for coming back to us.
    ko: 돌아와줘서, 고마워요.
    ja: 戻ってきてくださってよかったです。
  d_main_49_08_e_222:
    speaker: rapunzel_s
    en: I'm so glad we're fighting alongside each other again.
    ko: 다시 함께 할 수 있게 되어서, 다행이에요.
    ja: また一緒に戦えて、嬉しいです。
  d_main_49_08_e_223:
    speaker: dorothy_g
    en: "... Me too."
    ko: "…예."
    ja: "…そうですね。"
  d_main_49_08_e_224:
    speaker: "<Narration>"
    en: Dorothy looks at me.
    ko: 도로시가 나를 바라본다.
    ja: ドロシーの視線がこちらに向けられた
  d_main_49_08_e_225:
    speaker: "<Narration>"
    en: Then her gaze shifts to Rapi, Anis, and Neon.
    ko: 라피, 아니스, 네온도 함께 바라본다.
    ja: それからラピ、アニス、ネオンにも
  d_main_49_08_e_226:
    speaker: dorothy_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_227:
    speaker: "<Narration>"
    en: She nods slightly.
    ko: 도로시가 작게 고개를 끄덕인다.
    ja: ドロシーが小さくうなずいた
  d_main_49_08_e_228:
    speaker: "<Narration>"
    en: We all nod back.
    ko: 우리 모두, 고개를 끄덕인다.
    ja: 私たち全員がうなずき返した
  d_main_49_08_e_229:
    speaker: andersen_c
    en: Don't give me a hard time.
    ko: 애 좀 먹이지 마라.
    ja: あまり手を焼かせるんじゃない。
  d_main_49_08_e_230:
    speaker: dorothy_g
    en: Then you shouldn't have worked me so hard.
    ko: 그러길래 적당히 굴리셨어야죠.
    ja: |-
      でしたら、人使いの荒さは
      ほどほどにしていただけませんと。
  d_main_49_08_e_231:
    speaker: andersen_c
    en: Still, I kept my promise. I said I'd find you.
    ko: |-
      그래도 약속 지켰다.
      내가 너 찾는다고 했지?
    ja: |-
      だが、とにかく約束は守った。
      君を見つけ出すと言っただろう？
  d_main_49_08_e_232:
    speaker: andersen_c
    en: I'm glad you're back.
    ko: 잘 돌아왔다.
    ja: よく戻ってきた。
  d_main_49_08_e_233:
    speaker: andersen_c
    en: It's time to get back to work. Especially since you've powered up. Don't you
      think?
    ko: |-
      이제 또 굴러야지.
      파워 업도 했으니까. 안그래?
    ja: |-
      さっそくこき使ってやらないとな。
      強くなって帰ってきたはずだ、違うか？
  d_main_49_08_e_234:
    speaker: dorothy_g
    en: Fine. I'll humor you.
    ko: 그래요. 까짓거 그래드리죠.
    ja: 仕方ありませんね。どうせそのつもりでしたが。
  d_main_49_08_e_235:
    speaker: andersen_c
    en: Burningum.
    ko: "…버닝엄."
    ja: "…バーニンガム。"
  d_main_49_08_e_236:
    speaker: burningum_op
    en: Oh, right.
    ko: 아, 응.
    ja: あ、あぁ。
  d_main_49_08_e_237:
    speaker: andersen_c
    en: Did you see?
    ko: 봤나?
    ja: 見ていたな？
  d_main_49_08_e_238:
    speaker: burningum_op
    en: "... Yes, I saw all right."
    ko: "…그래. 똑똑히 봤어."
    ja: "…もちろんだ。しかと見届けた。"
  d_main_49_08_e_239:
    speaker: andersen_c
    en: Now then.
    ko: 자, 그럼.
    ja: さて、それでは…
  d_main_49_08_e_240:
    speaker: andersen_c
    en: Let us begin...
    ko: 시작하지.
    ja: 始めるとしよう。
  d_main_49_08_e_241:
    speaker: andersen_c
    en: the Third Surface Reclamation War.
    ko: 3차 지상 탈환전을.
    ja: 第三次地上奪還戦を。
  d_main_49_08_e_242:
    speaker: "<Narration>"
    en: Inside the Central Government's main conference room in the Ark...
    ko: 방주. 중앙 정부 중앙 회의실.
    ja: アーク、中央政府・中央会議室
  d_main_49_08_e_243:
    speaker: burningum
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_244:
    speaker: ingrid
    en: What's wrong? You seem dazed.
    ko: 왜 그러지? 넋이 나가있군.
    ja: どうした？心ここにあらずといった様子だな。
  d_main_49_08_e_245:
    speaker: burningum
    en: Oh, right. Sorry.
    ko: 아, 아아. 미안해.
    ja: ん？あぁ…すまない。
  d_main_49_08_e_246:
    speaker: burningum
    en: Status report, if you please.
    ko: 다들, 상황에 대해 보고해줘.
    ja: 全員、状況を報告してくれ。
  d_main_49_08_e_247:
    speaker: ingrid
    en: There's been a small problem, but nothing we can't handle..
    ko: 사소한 문제가 있지만, 감안할 수 있는 수준이다.
    ja: 些細な問題は残ったが、許容範囲内だ。
  d_main_49_08_e_248:
    speaker: ingrid
    en: Preparations are complete.
    ko: 준비 완료다.
    ja: 準備は完了している。
  d_main_49_08_e_249:
    speaker: syuen
    en: No updates from me. We're all set.
    ko: 말할것도 없어. 준비 완료야.
    ja: 言うまでもなく、抜かりなしよ。
  d_main_49_08_e_250:
    speaker: mustang
    en: We are préparés.
    ko: Ready 완료입니Da.
    ja: Ready完了DESU。
  d_main_49_08_e_251:
    speaker: burningum
    en: "... Enikk."
    ko: "…에닉."
    ja: "…エニック。"
  d_main_49_08_e_252:
    speaker: enikk_op_l
    en: The Ark's ascent sequence is ready.
    ko: 방주 부상 시퀀스. 준비 완료 상태입니다.
    ja: アーク浮上シークエンス、準備完了しています。
  d_main_49_08_e_253:
    speaker: enikk_op_l
    en: We can initiate it at any time.
    ko: 기능상 언제든 시작할 수 있습니다.
    ja: 浮上機能に関しては、いつでも開始可能です。
  d_main_49_08_e_254:
    speaker: burningum
    en: "... All right. What's left?"
    ko: "…좋아. 남은 건?"
    ja: "…よし。残る問題は？"
  d_main_49_08_e_255:
    speaker: enikk_op_l
    en: We can proceed after removing all obstructions above and around the gate.
    ko: 게이트 위와 인근의 이물질만 제거하면 바로 시작할 수 있습니다.
    ja: ゲート上および周辺障害物の排除です。
  d_main_49_08_e_256:
    speaker: burningum
    en: Good. Everyone get ready.
    ko: 그래. 준비해 줘.
    ja: 分かった。開始の合図を待ってくれ。
  d_main_49_08_e_257:
    speaker: burningum
    en: It won't take long to clear things up there.
    ko: 위는 금방 정리될 테니까.
    ja: 上はすぐに片づく。
  d_main_49_08_e_258:
    speaker: ingrid
    en: You have a lot of faith in them.
    ko: 신용하고 있군.
    ja: 信用しているようだな。
  d_main_49_08_e_259:
    speaker: burningum
    en: Yes.
    ko: 그래.
    ja: そうだ。
  d_main_49_08_e_260:
    speaker: burningum
    en: That goes without saying.
    ko: 말할 것도 없지.
    ja: 言うまでもないだろう？
  d_main_49_08_e_261:
    speaker: andersen_c
    en: I'll leave the area near the gate to you and Counters.
    ko: 자네와 카운터스는 방주 게이트 쪽을 맡아주게.
    ja: |-
      君とカウンターズは、
      アークのゲートに近づいた敵を追い払ってくれ。
  d_main_49_08_e_262:
    speaker: andersen_c
    en: We'll stay here and stop any more Raptures from approaching the Ark.
    ko: 우리는 이곳에서 방주 쪽으로 가는 랩쳐 놈들을 막겠네.
    ja: |-
      我々はここで、
      接近するラプチャーどもを食い止める。
  d_main_49_08_e_263:
    speaker: "<Self>"
    en: With only this many people...?
    ko: 이 인원으로는….
    ja: その人数では…
  d_main_49_08_e_264:
    speaker: "<Narration>"
    en: As soon as I say that, I realize I've misspoken.
    ko: 말을 꺼내자마자 잘못 말했다는 것을 깨닫는다.
    ja: |-
      思わず口にしかけて、
      見当違いな心配だと気づく
  d_main_49_08_e_265:
    speaker: "<Narration>"
    en: Snow White.
    ko: 스노우 화이트.
    ja: スノーホワイト
  d_main_49_08_e_266:
    speaker: "<Narration>"
    en: Scarlet.
    ko: 홍련.
    ja: 紅蓮
  d_main_49_08_e_267:
    speaker: "<Narration>"
    en: Rapunzel.
    ko: 라푼젤.
    ja: ラプンツェル
  d_main_49_08_e_268:
    speaker: "<Narration>"
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー
  d_main_49_08_e_269:
    speaker: "<Narration>"
    en: And their Commander.
    ko: 그리고 그녀들의 지휘관.
    ja: そして、彼女たちの指揮官までも
  d_main_49_08_e_270:
    speaker: "<Narration>"
    en: For some reason, I feel invigorated.
    ko: "…어째서인지 고양감이 차오른다."
    ja: "…なぜか、胸が高鳴りを覚える"
  d_main_49_08_e_271:
    speaker: "<Narration>"
    en: With them, I feel like there's nothing we can't accomplish.
    ko: 이들이라면, 뭐든 이뤄줄 수 있을 것 같은 느낌이 든다.
    ja: |-
      この人たちなら何だって
      現実にしてしまいそうだ、そんな気がする
  d_main_49_08_e_272:
    speaker: "<Self>"
    en: Understood. We'll head toward the Ark's gate.
    ko: 알겠습니다. 저희는 방주 게이트 쪽으로 가겠습니다.
    ja: |-
      拝命しました。
      私たちはアークのゲートへ向かいます
  d_main_49_08_e_273:
    speaker: andersen_c
    en: Good. Let's get this taken care of and go take the Queen's head together.
    ko: 그래. 얼른 다 처리하고 퀸 목이나 함께 따자고.
    ja: |-
      ああ。さっさと片付けて、
      次は一緒にクイーン狩りだ。
  d_main_49_08_e_274:
    speaker: "<Self>"
    en: Yes. Let's go, everyone.
    ko: |-
      예.
      다들, 가자.
    ja: |-
      はい。
      みんな、行こう
  d_main_49_08_e_275:
    speaker: rapi_red
    en: Roger.
    ko: 라져.
    ja: ラジャー。
  d_main_49_08_e_276:
    speaker: anis_i_w
    en: See you guys in a bit.
    ko: 다들 좀 이따 보자고.
    ja: みんな、また後でね。
  d_main_49_08_e_277:
    speaker: neon_v_w
    en: May our firepower guide us until we meet again.
    ko: 화력의 인도 아래, 다시 만나기를.
    ja: 火力の導きのもと、またお会いしましょう。
  d_main_49_08_e_278:
    speaker: "<Self>"
    en: "... Deputy Chief."
    ko: "…부사령관님."
    ja: "…副司令官"
  d_main_49_08_e_279:
    speaker: andersen_c
    en: Yes?
    ko: 음?
    ja: 何だ？
  d_main_49_08_e_280:
    speaker: "<Self>"
    en: I'd like to have a proper talk with you later.
    ko: 나중에, 길게 얘기 나누고 싶습니다.
    ja: 後で、ゆっくりお話をさせていただければ
  d_main_49_08_e_281:
    speaker: andersen_c
    en: Oh, my. Having too many fans can be quite a burden.
    ko: 이것 참. 팬이 많아도 큰일이군.
    ja: |-
      やれやれ、
      ファンが多いというのも考えものだな。
  d_main_49_08_e_282:
    speaker: andersen_c
    en: For you, I have all the time in the world.
    ko: 자네를 위해서라면 내 얼마든지 시간을 내지.
    ja: だが、君のためならいくらでも時間を作ろう。
  d_main_49_08_e_283:
    speaker: dorothy_g
    en: What are you acting so proud for?
    ko: 뭘 우쭐거리고 있는건가요.
    ja: さっきの今で、調子に乗っているようですね。
  d_main_49_08_e_284:
    speaker: rapunzel_s
    en: Don't you think you sound a little strange whenever you talk to Believer?
    ko: 그런데 형제님한테 말할 때 말투 좀 이상하지 않나요?
    ja: |-
      ブラザーに対する話のしかた、
      何かイケないような気がしてきますね…？
  d_main_49_08_e_285:
    speaker: andersen_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_286:
    speaker: andersen_c
    en: Well, get going.. The longer I'm around you, the more my dignity suffers.
    ko: 자, 빨리들 가게. 자네들이랑 있으면 내 위엄이 무너져.
    ja: |-
      さあ、早く行ってくれ。君たちといると、
      私の威厳が台無しになりそうだ。
  d_main_49_08_e_287:
    speaker: "<Narration>"
    en: I nod and head off.
    ko: 고개를 끄덕이고 이동한다.
    ja: 首を縦に振り、私たちは移動を始めた
  d_main_49_08_e_288:
    speaker: "<Narration>"
    en: We sprint toward the Ark's gate.
    ko: 방주 게이트 방향으로 달려간다.
    ja: アークのゲートに全速力で向かっていく
  d_main_49_08_e_289:
    speaker: rapi_red
    en: Calling that a legendary return feels trite, but...
    ko: "…전설의 귀환. 이라는 흔한 말을 쓰고 싶진 않습니다만…."
    ja: |-
      …「伝説が帰ってきた」というと、
      安っぽい表現かもしれませんが…
  d_main_49_08_e_290:
    speaker: anis_i_w
    en: I mean, I can't think of anything else to call it.
    ko: 뭐, 그것 말고는 딱히 어울리는 말이 없긴 하지.
    ja: まあ、それ以外にぴったりな言葉もないわよね。
  d_main_49_08_e_291:
    speaker: neon_v_w
    en: I have a feeling.
    ko: 저, 느낌이 와요.
    ja: 予感がしています。
  d_main_49_08_e_292:
    speaker: neon_v_w
    en: I think we're gonna crush this fight.
    ko: 이 싸움. 우리가 그냥 이길 것 같다는 느낌이요.
    ja: |-
      この戦い、私たちがアッサリ
      勝っちゃうんじゃないでしょうか。
  d_main_49_08_e_293:
    speaker: "<Self>"
    en: Wow. I feel the same way.
    ko: 오. 나도 그런데.
    ja: ああ、同感だ
  d_main_49_08_e_294:
    speaker: rapi_red
    en: Then let's go win.
    ko: 그럼 이기러 가시죠.
    ja: では、勝ちに行きましょう。
  d_main_49_08_e_295:
    speaker: anis_i_w
    en: We've been winning so much lately that I'm almost getting bored of it.
    ko: 하 요즘 자꾸 연전연승이라 이기는 것도 좀 지겹네.
    ja: |-
      はぁ、連戦連勝続きで、
      勝つのもちょっと飽きちゃったわ～
  d_main_49_08_e_296:
    speaker: rapi_red
    en: What are you talking about? You lost to me.
    ko: 무슨 소리야. 넌 나한테 졌잖아.
    ja: 何言ってるの。私に負けているでしょう。
  d_main_49_08_e_297:
    speaker: anis_i_w
    en: D-don't get cocky. You can't call that a win when you tricked me.
    ko: 까, 까불지 마. 사기 쳐놓고 뭘 이겼다고 말하는 거야.
    ja: |-
      フン、冗談じゃないわよ。
      あんなのイカサマでしょうが。
  d_main_49_08_e_298:
    speaker: neon_v_w
    en: Master, are you sure nothing happened with Rapi?
    ko: 근데 스승님. 진짜 라피랑 아무 일 없었나요?
    ja: |-
      そういえば、師匠。
      本当にラピとは何もなかったんですか？
  d_main_49_08_e_299:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_300:
    speaker: neon_v_w
    en: Wow, Anis suddenly getting all quiet and focused is really weird.
    ko: 우와. 아니스 갑자기 엄청 조용해져서 집중하는 거 기분 나쁘네요.
    ja: |-
      わぁ、アニスが急に静かになって
      聞き耳を立てているなんて、
      なんだか不気味ですね。
  d_main_49_08_e_301:
    speaker: anis_i_w
    en: I-I was just thinking about the fight.
    ko: 어, 어떻게 싸울지 고민하는 중이었어.
    ja: ど、どうやって戦うか考えてただけだから。
  d_main_49_08_e_302:
    speaker: "<Self>"
    en: "... Like I told you, nothing happened."
    ko: "…아무 일 없었다니까."
    ja: "…何もないと言っている"
  d_main_49_08_e_303:
    speaker: neon_v_w
    en: I mean, I thought as much, but that's such a dull ending.
    ko: 당연히 그럴 거라 생각했는데, 그렇기에 시시한 결말이군요.
    ja: |-
      当然そうでしょうねぇ。
      オチとしては面白くありませんが。
  d_main_49_08_e_304:
    speaker: rapi_red
    en: Something did happen. Maybe a 0.3?
    ko: 있긴 있었어. 0.3 정도?
    ja: あるにはあったわ。0.3くらい？
  d_main_49_08_e_305:
    speaker: anis_i_w
    en: I have no idea what unit of measurement you're using, but that's basically
      the same as saying nothing happened.
    ko: |-
      뭘 기반으로 하는 단위인지는 모르겠는데,
      그 정도면 아무 일 없다고 표현하는 게 맞아.
    ja: |-
      何が1になるのか知らないけど、それくらいなら
      何もなかったって言うのよフツー。
  d_main_49_08_e_306:
    speaker: "<Self>"
    en: Girls, this is the final battle. Let's take this a little more seriously.
    ko: 얘들아. 그래도 최종전인데 조금은 진지하게 하자.
    ja: |-
      みんな、一応は最終決戦なんだ、
      少しはまじめにやってくれ
  d_main_49_08_e_307:
    speaker: rapi_red
    en: Enough with the silly comments, all of you.
    ko: 다들, 쓸데없는 소린 이제 금지야.
    ja: そうよ、私語はつつしむべきね。
  d_main_49_08_e_308:
    speaker: anis_i_w
    en: You started it!
    ko: 네가 먼저 했잖아!
    ja: あんたが先に始めたんでしょうが！
  d_main_49_08_e_309:
    speaker: neon_v_w
    en: When will you girls finally grow up?
    ko: 다들 언제 철이 들까요?
    ja: |-
      みなさん、いつまで経っても
      大人になれませんね？
  d_main_49_08_e_310:
    speaker: "<Narration>"
    en: We race onto the battlefield near the Ark's gate.
    ko: 우리는 방주 게이트 인근의 전장으로 뛰어들어갔다.
    ja: |-
      軽口を叩きつつ、私たちは
      アークのゲートを守る戦場へと
      飛び込んでいった
  d_main_49_08_e_311:
    speaker: "<Narration>"
    en: Andersen, Dorothy, Snow White, Scarlet, and Rapunzel are staring straight
      ahead.
    ko: 엔더슨, 도로시, 스노우 화이트, 홍련, 라푼젤이 정면을 바라본다.
    ja: |-
      アンダーソン、ドロシー、スノーホワイト、
      紅蓮、そしてラプンツェルの視線の先…
  d_main_49_08_e_312:
    speaker: "<Narration>"
    en: Countless Raptures are swarming toward them.
    ko: 수많은 랩쳐가 돌진해오고 있다.
    ja: 無数のラプチャーが迫りくる
  d_main_49_08_e_313:
    speaker: "<Narration>"
    en: Raptures, an enemy they've faced countless times before.
    ko: |-
      지금껏 수도 없이 봐왔던 적.
      랩쳐.
    ja: これまで幾度となく目にしてきた敵だ
  d_main_49_08_e_314:
    speaker: "<Narration>"
    en: A fearsome presence they have constantly risked their lives to fight against.
    ko: 언제나 목숨을 걸고 싸웠어야 했던, 두려웠던 존재.
    ja: |-
      常に命がけで戦うことを強いられてきた、
      恐るべき脅威
  d_main_49_08_e_315:
    speaker: "<Narration>"
    en: But now...
    ko: 하지만, 지금은-
    ja: しかし、今は――
  d_main_49_08_e_316:
    speaker: andersen_c
    en: No need to worry about the Ark gate. The Ark's elite forces will handle that.
    ko: |-
      방주 게이트 쪽은 걱정할 것 없다.
      방주의 정예들이 잘 해결해줄테니.
    ja: |-
      後ろのことは心配するな。
      アークの精鋭たちがきっちり片付けてくれる。
  d_main_49_08_e_317:
    speaker: andersen_c
    en: 'Our job is simple: keep any of them from getting past us.'
    ko: 우리가 할 일은, 우리 뒤로 단 한놈도 지나가게 하지 않는거다.
    ja: |-
      我々のやるべきことは、
      ここから先に一匹たりとも通さないことだ。
  d_main_49_08_e_318:
    speaker: andersen_c
    en: Now, you probably have a lot to say or questions to ask.
    ko: 다들 할말 많고 궁금한 것도 많지?
    ja: |-
      全員、言いたいことも
      聞きたいことも、山ほどあるだろう？
  d_main_49_08_e_319:
    speaker: andersen_c
    en: Set them aside for now. Focus on the enemy in front of you.
    ko: 지금은 넣어둬. 눈앞의 적에만 집중해라.
    ja: |-
      だが、今は胸にしまっておけ。
      目の前の敵に集中しろ。
  d_main_49_08_e_320:
    speaker: andersen_c
    en: The Ark's ascent is a once-in-a-lifetime event. Let's not screw this up.
    ko: |-
      방주가 올라오는 인생 딱 한번뿐인 이벤트다.
      망치지 마.
    ja: |-
      アークが地上に出る。
      一世一代の大イベントだ。
      台無しにさせるな。
  d_main_49_08_e_321:
    speaker: andersen_c
    en: Now then.
    ko: 자, 그럼.
    ja: 私からは以上、あとは…
  d_main_49_08_e_322:
    speaker: andersen_c
    en: Begin, Dorothy.
    ko: 시작해라. 도로시.
    ja: ドロシー、始めてくれ。
  d_main_49_08_e_323:
    speaker: "<Narration>"
    en: Andersen looks at Dorothy.
    ko: 엔더슨이 도로시를 바라본다.
    ja: アンダーソンがドロシーに視線を送った
  d_main_49_08_e_324:
    speaker: "<Narration>"
    en: Dorothy stares at Andersen in a daze for a moment before turning away.
    ko: 도로시는 잠깐 동안 멍하니 엔더슨을 바라보다 시선을 돌린다.
    ja: |-
      ドロシーは少しの間とまどい、
      アンダーソンの顔を見ていたが、
      すぐに仲間へ視線を移した
  d_main_49_08_e_325:
    speaker: "<Narration>"
    en: Snow White looks at Dorothy and nods.
    ko: 스노우 화이트가 도로시를 바라보며 고개를 끄덕인다.
    ja: スノーホワイトが視線を返し、うなずく
  d_main_49_08_e_326:
    speaker: "<Narration>"
    en: With a slight smile, Scarlet adjusts her grip on her sword.
    ko: 홍련이 슬쩍 미소지은 후, 검을 고쳐잡는다.
    ja: 紅蓮が顔をゆるませ、剣を握り直した
  d_main_49_08_e_327:
    speaker: "<Narration>"
    en: Rapunzel smiles and waves for her to go on.
    ko: 라푼젤이 웃으며 부추기는 듯 한 손짓을 한다.
    ja: |-
      ラプンツェルが微笑みを浮かべ、
      手振りで先をうながす
  d_main_49_08_e_328:
    speaker: dorothy_g
    en: "... Is it really okay if I lead?"
    ko: "…제가, 해도 될까요."
    ja: "…私で、よいのでしょうか。"
  d_main_49_08_e_329:
    speaker: "<Narration>"
    en: Everyone nods.
    ko: 모두가 고개를 끄덕인다.
    ja: 全員が首を縦に振った
  d_main_49_08_e_330:
    speaker: dorothy_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_331:
    speaker: "<Narration>"
    en: Dorothy looks ahead.
    ko: 도로시는 정면을 바라본다.
    ja: ドロシーは正面を見すえ…
  d_main_49_08_e_332:
    speaker: "<Narration>"
    en: She slowly walks forward,
    ko: 앞으로 천천히 걸어간다.
    ja: 落ち着いた足取りで歩み出た
  d_main_49_08_e_333:
    speaker: "<Narration>"
    en: standing in front of everyone.
    ko: 모두의 앞에 선다.
    ja: そして、全員の前で立ち止まった
  d_main_49_08_e_334:
    speaker: dorothy_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_08_e_335:
    speaker: dorothy_g
    en: "*Huff...*"
    ko: "…후우…."
    ja: "…ふぅ…"
  d_main_49_08_e_336:
    speaker: dorothy_g
    en: Visual confirmation on Raptures, heading into firing range soon.
    ko: 랩쳐. 곧 사정거리 안으로 들어옵니다.
    ja: ラプチャー。まもなく射程距離に入ります。
  d_main_49_08_e_337:
    speaker: hongryeon_g
    en: I stand prepared.
    ko: 준비됐네.
    ja: 準備はできておる。
  d_main_49_08_e_338:
    speaker: rapunzel_s
    en: Understood.
    ko: 알겠어요.
    ja: 分かりました。
  d_main_49_08_e_339:
    speaker: snowwhite_h
    en: Ready when you are.
    ko: 언제든 시작할 수 있다.
    ja: いつでも大丈夫だ。
  d_main_49_08_e_340:
    speaker: dorothy_g
    en: We have to protect the Ark at all costs.
    ko: 무슨 일이 있어도 방주를 지켜야 합니다.
    ja: |-
      何があっても、
      アークを守らなければなりません。
  d_main_49_08_e_341:
    speaker: dorothy_g
    en: Humanity's future lies in our hands.
    ko: 인류의 미래가 우리 손에 달려있어요.
    ja: |-
      人類の未来が、
      私たちの手にかかっています。
  d_main_49_08_e_342:
    speaker: "<Narration>"
    en: Dorothy's lips quiver.
    ko: 도로시의 입술이 달싹인다.
    ja: ドロシーの唇がかすかに震える
  d_main_49_08_e_343:
    speaker: "<Narration>"
    en: How dearly she must've missed this. How badly she must've longed to say it.
    ko: |-
      얼마나 그리워했던가.
      얼마나 입 밖으로 내고 싶어 했던가.
    ja: |-
      どれほど待ち焦がれていたか、
      どれほど口にしたかったことか…
  d_main_49_08_e_344:
    speaker: "<Narration>"
    en: She'd repeated these words to herself hundreds, even thousands of times,
    ko: 마음 속으로 수백, 수천. 아니 수만번은 되뇌었지만
    ja: 心の中で何百、何千、何万回と繰り返しながら
  d_main_49_08_e_345:
    speaker: "<Narration>"
    en: but she was never able to say them.
    ko: 단 한번도 입 밖으로 꺼내지 못했던 말.
    ja: あれからただの一度も、口にすることはなかった
  d_main_49_08_e_346:
    speaker: "<Narration>"
    en: The words that symbolized the brightest days of her life.
    ko: 가장 빛나던 시절을 상징하던 그 말.
    ja: 最も輝かしかった時代を象徴する、あのかけ声
  d_main_49_08_e_347:
    speaker: "<Narration>"
    en: The words she's finally able to say.
    ko: 그 말을, 드디어-
    ja: その言葉を、ようやく――
  d_main_49_08_e_348:
    speaker: dorothy_g
    en: Goddess Squad, ready.
    ko: 갓데스 스쿼드 레디.
    ja: ゴッデス部隊、レディ…
  d_main_49_08_e_349:
    speaker: dorothy_g
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
d_main_49_af_01:
  d_main_49_af_01_1:
    speaker: "<Narration>"
    en: Andersen climbs up a tall hill and sits on the ground.
    ko: 엔더슨은 높은 언덕에 올라가 바닥에 걸터앉았다.
    ja: アンダーソンは高い丘の上で腰を下ろした
  d_main_49_af_01_2:
    speaker: "<Narration>"
    en: He looks up at the sky.
    ko: 하늘을 한 번 올려다본다.
    ja: 感慨深く空を見上げる
  d_main_49_af_01_3:
    speaker: andersen_c
    en: "... It really is nice."
    ko: "…좋군."
    ja: "…いいな。"
  d_main_49_af_01_4:
    speaker: andersen_c
    en: The surface.
    ko: 역시 지상은 좋아.
    ja: やはり、地上は。
  d_main_49_af_01_5:
    speaker: "<Narration>"
    en: He looks down at the scene below him.
    ko: 고개를 숙여 아래를 바라본다.
    ja: 視線を下に移した
  d_main_49_af_01_6:
    speaker: "<Narration>"
    en: He sees a swarm of Raptures covering the entire surface of the ground,
    ko: 지상에 빈틈없이 꽉꽉 채워넣은 듯한 랩쳐의 무리를 본다.
    ja: |-
      地上を埋め尽くすような
      ラプチャーの群れが目に入る
  d_main_49_af_01_7:
    speaker: "<Narration>"
    en: and at the center of that swarm, he sees his comrades fighting,
    ko: 그리고 그 무리의 중심에서 싸우고 있는 동료들의 모습을 본다.
    ja: |-
      その群れの中心で
      仲間たちが戦っている
  d_main_49_af_01_8:
    speaker: "<Narration>"
    en: each one skillfully taking down Raptures in her own way.
    ko: 모두가 자신만의 방법으로 능숙하게 랩쳐들을 쓰러뜨린다.
    ja: |-
      誰もがそれぞれの戦い方で、
      ラプチャーをなぎ倒していく
  d_main_49_af_01_9:
    speaker: "<Narration>"
    en: Andersen suddenly feels a prickle in his nose as he starts tearing up.
    ko: 엔더슨은 갑자기 콧등이 시큰거리는 것을 느낀다.
    ja: アンダーソンの鼻がうずいた
  d_main_49_af_01_10:
    speaker: "<Narration>"
    en: He forces back the wave of emotions, unwilling to take his eyes off the Nikkes
      as they fight.
    ko: 억지로 복받쳐오는 감정을 누른 후, 그녀들의 모습에서 눈을 떼지 않는다.
    ja: |-
      こみ上げる感情をどうにか抑えこみ、
      それでも彼女たちから目を離さずにいる
  d_main_49_af_01_11:
    speaker: andersen_c
    en: "... That right there. That's what I'm talking about."
    ko: "…이래서 좋다니까."
    ja: "…これだから、な。"
  d_main_49_af_01_12:
    speaker: snowwhite_h
    en: Pierce through!
    ko: 꿰뚫어라--!!
    ja: 貫けぇ！！
  d_main_49_af_01_13:
    speaker: "<Narration>"
    en: Light bursts forth from Seven Dwarves, mowing down a group of Raptures.
    ko: 세븐스 드워프에서 뻗어나간 빛이 랩쳐의 무리를 휩쓴다.
    ja: |-
      セブンスドワーフの放った光が、
      ラプチャーの群れをなぎ払う
  d_main_49_af_01_14:
    speaker: "<Narration>"
    en: Snow White unleashes a barrage of missiles as her machine gun sprays bullets.
    ko: 미사일을 쏟아내고, 기관총을 퍼붓는다.
    ja: ミサイルが飛び、銃弾が降り注ぐ
  d_main_49_af_01_15:
    speaker: "<Narration>"
    en: It looks almost as though there's an invisible line in front of her,
    ko: 스노우 화이트의 앞에 보이지 않는 선이 있는 듯 보인다.
    ja: |-
      スノーホワイトの正面は、
      見えない境界線でも引かれているかのように
  d_main_49_af_01_16:
    speaker: "<Narration>"
    en: which not even a single Rapture can get past.
    ko: 랩쳐들은 그 안으로 단 한 기도, 한 걸음도 내딛지 못한다.
    ja: ラプチャーの進入を一機たりとも許さない
  d_main_49_af_01_17:
    speaker: andersen_c_op
    en: Any problems?
    ko: 문제 없냐.
    ja: 問題ないか？
  d_main_49_af_01_18:
    speaker: snowwhite_h
    en: The anti-ship rifle is still cooling down.
    ko: 대함 라이플이 방열 중이다.
    ja: 対艦ライフルが放熱中だ。
  d_main_49_af_01_19:
    speaker: andersen_c_op
    en: How about the missiles?
    ko: 미사일은?
    ja: ミサイルは？
  d_main_49_af_01_20:
    speaker: snowwhite_h
    en: Two pods are malfunctioning.
    ko: 미사일 포드 2문이 오작동을 일으키고 있다.
    ja: ミサイルポッド2基が動作不良だ。
  d_main_49_af_01_21:
    speaker: andersen_c_op
    en: That's pretty bad, isn't it?
    ko: 세상에, 큰일난 것 아냐?
    ja: なんだ、マズいんじゃないか？
  d_main_49_af_01_22:
    speaker: snowwhite_h
    en: It doesn't matter. I have a lot of weapons.
    ko: 상관없다. 무기는 많다.
    ja: 問題はない。武器はいくらでもある。
  d_main_49_af_01_23:
    speaker: andersen_c_op
    en: I think it's safe to say you've finally achieved your dream of being a walking
      arsenal, so why aren't you walking?
    ko: 너 기껏 걸어다니는 무기고 컨셉이 확립된 것 같은데 왜 안 걸어다녀.
    ja: |-
      せっかく「歩く武器庫」になったというのに、
      歩いていないようだな。
  d_main_49_af_01_24:
    speaker: snowwhite_h
    en: There's no need. This is the most efficient place to attack from.
    ko: |-
      걸어다닐 필요가 없으니까.
      이 장소가 제일 효율이 좋다.
    ja: |-
      歩き回る必要はない。
      ここで戦うのが効率的だ。
  d_main_49_af_01_25:
    speaker: andersen_c_op
    en: Oh, here comes one.
    ko: 엇, 한놈이 달려든다.
    ja: おっと、一匹抜けて来たな。
  d_main_49_af_01_26:
    speaker: "<Narration>"
    en: A self-destruct Rapture barrels through the explosions and throws itself at
      Snow White.
    ko: 폭연을 뚫고 자폭형 랩쳐가 스노우 화이트에게 몸을 던진다.
    ja: |-
      爆煙を突き破り、
      自爆型ラプチャーがスノーホワイトに迫った
  d_main_49_af_01_27:
    speaker: "<Narration>"
    en: Andersen feels his chest clench.
    ko: 엔더슨은 가슴이 철렁하는 느낌을 받는다.
    ja: アンダーソンの肝が思わず冷える
  d_main_49_af_01_28:
    speaker: "<Narration>"
    en: Snow White has always gotten flustered when faced with unexpected situations.
    ko: 스노우 화이트는 예외 상황에 놓이면 언제나 당황했다.
    ja: |-
      彼の知るスノーホワイトは
      想定外の事態に遭うと、
      いつもパニックを起こしていた
  d_main_49_af_01_29:
    speaker: "<Narration>"
    en: She doesn't have Liliweiss to take care of—
    ko: 지금은 그 상황을 해결해줄 릴리바이스도 없-
    ja: |-
      そのような時に飛び込んで
      事態を解決するリリーバイスはすでに――
  d_main_49_af_01_30:
    speaker: "<Narration>"
    en: "*Clang!*"
    ko: 까앙-!
    ja: ガン！
  d_main_49_af_01_31:
    speaker: "<Narration>"
    en: Snow White swats the Rapture aside with the long barrel of her anti-ship rifle.
    ko: 스노우 화이트가 대함 라이플의 긴 포신으로 달려드는 랩쳐를 후려친다.
    ja: |-
      スノーホワイトは
      対艦ライフルの長い砲身を叩きつけ、
      ラプチャーを弾いた
  d_main_49_af_01_32:
    speaker: "<Narration>"
    en: The Rapture is sent flying far away before exploding.
    ko: 한참을 날아간 랩쳐가 폭발을 일으킨다.
    ja: ラプチャーは大きく吹き飛ばされ、爆発した
  d_main_49_af_01_33:
    speaker: andersen_c_op
    en: "... That's your main weapon. You shouldn't use it like a bat or you'll end
      up breaking it."
    ko: |-
      …너 그거 주력 무장이잖아. 그렇게 몽둥이처럼 쓰면 어떡해?
      망가진다고.
    ja: |-
      …大事な主兵装だろう。
      こん棒みたいに使っていいのか？壊れるぞ。
  d_main_49_af_01_34:
    speaker: snowwhite_h
    en: If that happens, I'll just use something else.
    ko: 그 땐 또 다른 방법이 있겠지.
    ja: その時は、また別の武器を使えばいい。
  d_main_49_af_01_35:
    speaker: andersen_c_op
    en: Heh, I knew you'd be a powerhouse once you became a little more relaxed, but...
      you really are something.
    ko: 하. 대범해지면 볼만할 거라고는 생각했지만, 진짜 볼만하네.
    ja: |-
      フッ…落ち着きが出たら大物になると
      思ってはいたが、予想以上だったな。
  d_main_49_af_01_36:
    speaker: snowwhite_h
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  d_main_49_af_01_37:
    speaker: snowwhite_h
    en: I'm okay now.
    ko: 나는 이제 괜찮다.
    ja: 私はもう大丈夫だ。
  d_main_49_af_01_38:
    speaker: andersen_c_op
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_39:
    speaker: andersen_c_op
    en: It would appear so.
    ko: 그래 보이네.
    ja: そのようだな。
  d_main_49_af_01_40:
    speaker: andersen_c_op
    en: All right. Keep up the good work.
    ko: 좋아. 계속 수고해라.
    ja: よし。その調子で頼む。
  d_main_49_af_01_41:
    speaker: snowwhite_h
    en: Roger that.
    ko: 라져.
    ja: 了解。
  d_main_49_af_01_42:
    speaker: hongryeon_g
    en: They approach without end.
    ko: 이거 참. 끝도 없이 몰려드는군.
    ja: やれやれ…キリがないねぇ。
  d_main_49_af_01_43:
    speaker: "<Narration>"
    en: Scarlet swings her sword from inside the horde of Raptures.
    ko: 홍련이 랩쳐의 무리 안에서 검을 휘두른다.
    ja: 紅蓮がラプチャーの群れの中で剣を振るっている
  d_main_49_af_01_44:
    speaker: "<Narration>"
    en: Her strikes are fluid, aiming only for their cores. With no wasted movement,
      she steadily cuts down the Raptures' numbers.
    ko: |-
      코어만을 노리는 유연한 움직임.
      최소한의 동작으로 랩쳐의 수를 차근차근 줄여나간다.
    ja: |-
      コアだけを狙う、しなやかな動きだ。
      最小限の動きでラプチャーの数が
      着実に減っていく
  d_main_49_af_01_45:
    speaker: "<Narration>"
    en: Still, the scenery doesn't change.
    ko: 하지만 풍경에는 변함이 없다.
    ja: |-
      それでも、目の前の光景は
      一向に変わる気配がない
  d_main_49_af_01_46:
    speaker: andersen_c_op
    en: For as much as you move around, the actual number of Raptures you take down
      leaves a little to be desired.
    ko: 바쁘게 움직이는 것 치곤, 영 격추 수가 시원찮네.
    ja: |-
      忙しく動き回っている割には、
      撃破数が伸びないな。
  d_main_49_af_01_47:
    speaker: hongryeon_g
    en: "'Tis so. Would that I had learned to wield a gun."
    ko: |-
      그러게 말일세.
      총이나 배워놓을 걸 그랬어.
    ja: |-
      まったくだ。
      銃の扱いも覚えておけばよかったか。
  d_main_49_af_01_48:
    speaker: andersen_c_op
    en: You don't mean that.
    ko: 마음에도 없는 소릴 하는군.
    ja: 考えてもいないだろう。
  d_main_49_af_01_49:
    speaker: hongryeon_g
    en: True, I spake in jest. Thou feelest my meaning well.
    ko: 그래. 해본 말일세. 잘 아는군.
    ja: |-
      いかにも、冗談だ。
      よく分かっているではないか。
  d_main_49_af_01_50:
    speaker: andersen_c_op
    en: Yeah, because I know you well.
    ko: 그래. 나는 널 잘 아니까.
    ja: ああ、君のことだからな。
  d_main_49_af_01_51:
    speaker: hongryeon_g
    en: "... Is that so?"
    ko: "…그런가."
    ja: "…そうか。"
  d_main_49_af_01_52:
    speaker: andersen_c_op
    en: Have you given up on caring about things like "clean divisions" in a single
      strike and one-on-one duels?
    ko: 이제 일도양단이니 일대일이니 뭐 이런 건 안 따지는 건가?
    ja: |-
      もう一刀両断だとか一対一だとか、
      そういうこだわりは捨てたのか？
  d_main_49_af_01_53:
    speaker: hongryeon_g
    en: 'Experience hath taught me: to anchor oneself to such ideas blunts one''s
      efficiency.'
    ko: |-
      나도 배운 게 있어서 말일세.
      그런 것만 따지고들면 효율이 영 나오질 않네.
    ja: |-
      私も賢くなったのでな。
      そんなことを気にしていては、
      一向に効率が上がらぬのだ。
  d_main_49_af_01_54:
    speaker: andersen_c_op
    en: Huh. You're much more well-rounded now. You used to just rush in without hesitation.
    ko: |-
      많이 유해졌구만.
      득달같이 달려들기만 하더니.
    ja: |-
      ずいぶん丸くなったものだ。
      あれだけ血の気が多かった奴が。
  d_main_49_af_01_55:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_56:
    speaker: andersen_c_op
    en: What's wrong? Why'd you get quiet all of a sudden?
    ko: 뭐야. 왜 갑자기 말이 없어?
    ja: どうした、急に黙り込んで？
  d_main_49_af_01_57:
    speaker: hongryeon_g
    en: Such conversation with thee feels not unfamiliar.
    ko: 자네와 이런 대화를 나누는 게, 낯설지가 않아서 말일세.
    ja: |-
      君とこうして言葉を交わすのは、
      どうにも初めてという気がしないねぇ。
  d_main_49_af_01_58:
    speaker: hongryeon_g
    en: In former days, we maintained words thus during battle some dozens of times,
      I take it.
    ko: 아마도 과거에, 수십 번은 이런 식으로 대화를 나누며 전투했겠지.
    ja: |-
      きっと昔は、こうして語らいながら
      何十という戦場を駆けていたのだろう。
  d_main_49_af_01_59:
    speaker: andersen_c_op
    en: "... Dozens? Try hundreds, or thousands."
    ko: "…수십 번이 뭐야. 수백, 수천 번은 될 거다."
    ja: "…十ではすまないぞ。何百、何千だ。"
  d_main_49_af_01_60:
    speaker: hongryeon_g
    en: Is it so? It grieveth me to not remember.
    ko: 그런가. 기억하지 못한다는 건, 참으로 서글픈 일이군.
    ja: そうか。覚えておらぬというのが、実に寂しい。
  d_main_49_af_01_61:
    speaker: andersen_c_op
    en: Don't go getting sentimental on me. Hesitation dulls the blade... or something
      like that, right?
    ko: 센치해지지 마. 그 뭐냐, 망설임이 있으면 검날이 무뎌진다? 이런 거 있잖아.
    ja: |-
      そう感傷的になるな。ほら、あれだ…
      迷いがあると刃が鈍る、とか言うだろう？
  d_main_49_af_01_62:
    speaker: hongryeon_g
    en: My blade dulleth not.
    ko: 그럴리가.
    ja: 私はそうならぬ。
  d_main_49_af_01_63:
    speaker: "<Narration>"
    en: A group of Raptures swarm Scarlet.
    ko: 다수의 랩쳐가 한 번에 홍련에게 달려든다.
    ja: 大量のラプチャーが一斉に紅蓮を襲った
  d_main_49_af_01_64:
    speaker: "<Narration>"
    en: Her eyes glint. She crouches down and lets her sword fly.
    ko: |-
      홍련의 눈이 빛난다.
      자세를 한껏 숙인 후, 검을 내지른다.
    ja: |-
      紅蓮は眼光鋭く、深く腰を落とし、
      剣を突き出した
  d_main_49_af_01_65:
    speaker: "<Narration>"
    en: A metallic sound rings out for a brief moment.
    ko: 스칵-!
    ja: ヒュン――！
  d_main_49_af_01_66:
    speaker: "<Narration>"
    en: The sound isn't very loud,
    ko: 큰 소리도 나지 않는다.
    ja: 大きな音もなく…
  d_main_49_af_01_67:
    speaker: "<Narration>"
    en: yet all the Raptures that swarmed her are cut neatly in half before falling
      to the ground.
    ko: 달려든 랩쳐 모두가 깔끔한 단면을 보여주며 쓰러진다.
    ja: |-
      襲いかかってきたラプチャーは、
      鮮やかな切断面を残し、斬られていた
  d_main_49_af_01_68:
    speaker: andersen_c_op
    en: Haha. I thought you didn't care about clean divisions anymore?
    ko: 하하. 일도양단이니 뭐니 안 한다고 하지 않았나?
    ja: |-
      ほう…そういうことには
      もうこだわらないんじゃなかったのか？
  d_main_49_af_01_69:
    speaker: hongryeon_g
    en: I meant no longer do I cling solely to the practice. To deny an opportunity
      so openly given would be of ill manner.
    ko: |-
      거기에만 집착하지 않는다는 얘기일세.
      기회가 있으면 해야지.
    ja: |-
      こだわらないというだけさ。
      使える時は使う。
  d_main_49_af_01_70:
    speaker: hongryeon_g
    en: In any case, methinks I understand the nature of thy fellowship with us.
    ko: 아무튼 자네와 우리의 관계는 대충 이런 것이겠군.
    ja: |-
      ともあれ、君と私たちとの関係は、
      おおよそこういうものだったのだろうな。
  d_main_49_af_01_71:
    speaker: hongryeon_g
    en: Being thus met, let us be good one to another.
    ko: 모처럼이니, 잘 부탁함세.
    ja: 改めて、よろしく頼む。
  d_main_49_af_01_72:
    speaker: andersen_c_op
    en: Verily. I too ask for thy good graces, such as I am.
    ko: 알겠네. 불초 소생, 다시 한 번 잘 부탁하겠네.
    ja: 合点承知、不肖の身ながらよろしくつかまつる。
  d_main_49_af_01_73:
    speaker: hongryeon_g
    en: Haha, what manner of personating is that? How fond.
    ko: 하하. 무슨 흉내인가 그건.
    ja: ふふ…何のまねごとだい、それは。
  d_main_49_af_01_74:
    speaker: rapunzel_s
    en: Hyah!
    ko: 에~잇!
    ja: えい！
  d_main_49_af_01_75:
    speaker: "<Narration>"
    en: "*Booom!*"
    ko: 까아아앙--!!
    ja: カーン！！
  d_main_49_af_01_76:
    speaker: "<Narration>"
    en: Raptures are sent flying one after another as they come into contact with
      Rapunzel's staff.
    ko: 라푼젤이 휘두르는 지팡이에 맞은 다수의 랩쳐가 하늘로 솟는다.
    ja: |-
      ラプンツェルが振るう杖に当てられ
      大量のラプチャーが次々と舞い上がる
  d_main_49_af_01_77:
    speaker: "<Narration>"
    en: She swings her staff wildly with excitement, sending Raptures skyward with
      every strike.
    ko: |-
      라푼젤은 신난 듯, 마구잡이로 지팡이를 휘두른다.
      그때마다 랩쳐들이 하늘로 솟는다.
    ja: |-
      ラプンツェルは楽しげに杖を振り回し、
      その度にラプチャーが空へ飛んでいった
  d_main_49_af_01_78:
    speaker: "<Narration>"
    en: Her delighted cries echo across the battlefield.
    ko: 경쾌한 소리가 전장에 울려퍼진다.
    ja: 戦場に似合わない軽快な音が響く
  d_main_49_af_01_79:
    speaker: rapunzel_s
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  d_main_49_af_01_80:
    speaker: andersen_c_op
    en: Having fun?
    ko: 재밌냐.
    ja: 楽しそうだな。
  d_main_49_af_01_81:
    speaker: rapunzel_s
    en: Fun...? Yes... Yes, I am. Moreso than I expected.
    ko: 재미… 있어요. 예. 재밌어요. 생각보다.
    ja: |-
      楽しい…そうですね。
      ええ、楽しい気分です。思ったよりも。
  d_main_49_af_01_82:
    speaker: andersen_c_op
    en: After always being the one to defend and heal others, it feels nice to beat
      on the enemy yourself, doesn't it?
    ko: 허구한 날 방어나 회복만 하다가 직접 두드려패니 좋지?
    ja: |-
      いつも防御や回復ばかりだったからな。
      敵を自分の手でぶちのめせるというのは
      いい気分だろう？
  d_main_49_af_01_83:
    speaker: rapunzel_s
    en: Maybe, but those other things are still what I'm best at. If you need me to
      switch over, I'll do so right away.
    ko: |-
      그래도 제가 더 잘하는 건 그쪽이니까요.
      필요하면 그쪽으로 바로 전환해야죠.
    ja: |-
      いえ、私の専門はあくまでそちらですから。
      必要とあらば、すぐに切り替えます。
  d_main_49_af_01_84:
    speaker: andersen_c_op
    en: Scarlet and Snow White look a little hurt.
    ko: 홍련이랑 스노우 화이트 좀 다쳤던데.
    ja: |-
      紅蓮とスノーホワイトが
      少し傷を負ったようだが。
  d_main_49_af_01_85:
    speaker: rapunzel_s
    en: Oh, is that right?
    ko: 어머. 그래요?
    ja: あら、本当ですか？
  d_main_49_af_01_86:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_87:
    speaker: rapunzel_s
    en: Well, I'm sure it's nothing to worry about. They'll be all right. It's them,
      after all.
    ko: |-
      뭐, 큰일은 아니겠죠.
      괜찮아요. 그 둘이라면.
    ja: |-
      まあ、心配するほどのことはないでしょう。
      大丈夫です。あの2人なら。
  d_main_49_af_01_88:
    speaker: andersen_c_op
    en: Wow. How very... calm of you. No big fuss?
    ko: 오. 이제 막 난리 안 피우네?
    ja: ほう、ずいぶん冷静だな？
  d_main_49_af_01_89:
    speaker: rapunzel_s
    en: It takes too much out of me to react to every little thing.
    ko: 일일이 그런거에 반응하니 제가 너무 힘들더라고요.
    ja: |-
      ひとつひとつのことに気をもんでいたら、
      私も疲れてしまいますから。
  d_main_49_af_01_90:
    speaker: rapunzel_s
    en: I decided to trust my comrades more.
    ko: 동료들을 좀 더 믿기로 했어요.
    ja: 仲間たちを、もう少し信じることにしました。
  d_main_49_af_01_91:
    speaker: andersen_c_op
    en: That's wonderful to hear.
    ko: 훌륭해.
    ja: 立派なことだ。
  d_main_49_af_01_92:
    speaker: andersen_c_op
    en: Uh-oh. Incoming.
    ko: 엇, 뭐가 많이 오는데?
    ja: おっと、何か来ているな。
  d_main_49_af_01_93:
    speaker: "<Narration>"
    en: Countless missiles launch from the swarm of Raptures.
    ko: 랩쳐 무리에서 수많은 미사일이 발사된다.
    ja: |-
      ラプチャーの群れから、
      無数のミサイルが発射された
  d_main_49_af_01_94:
    speaker: andersen_c_op
    en: Rapunzel. Shield.
    ko: 라푼젤. 실드.
    ja: ラプンツェル、シールドだ。
  d_main_49_af_01_95:
    speaker: rapunzel_s
    en: Mm... It's okay. Everyone will figure it out.
    ko: 음… 괜찮아요. 다들 잘 피할거예요.
    ja: |-
      いえ…無用です。
      全員回避できます。
  d_main_49_af_01_96:
    speaker: "<Narration>"
    en: "*Bang! Bang! Bang!*"
    ko: 쾅! 쾅! 콰아앙--!!
    ja: ミサイルが次々に着弾する
  d_main_49_af_01_97:
    speaker: "<Narration>"
    en: Explosions of all sizes burst around the battlefield.
    ko: 전장 곳곳에서 크고 작은 폭발이 터져나온다.
    ja: 戦場のいたる所で、大小の爆発が巻き起こった
  d_main_49_af_01_98:
    speaker: "<Narration>"
    en: Rapunzel dodges them while continuing to swing her staff.
    ko: 라푼젤은 그 폭발을 피해가며 계속해서 지팡이를 휘두른다.
    ja: |-
      ラプンツェルも爆発をかわしながら、
      杖を振り続けた
  d_main_49_af_01_99:
    speaker: rapunzel_s
    en: Launching a shield would be the right choice if I had a lot of sisters to
      protect, but there's no need at the moment.
    ko: |-
      지켜야 할 자매님들이 많다면야 실드를 치는 게 맞겠지만,
      지금은 필요없겠죠.
    ja: |-
      守るべき姉妹が多かった時は
      シールドを張るべきでしたが、
      今は必要ありません。
  d_main_49_af_01_100:
    speaker: andersen_c_op
    en: "... Excellent intuition. It's better to look at the big picture than to get
      lost in the weeds, especially for you."
    ko: |-
      …아주 좋아. 작은 거 하나하나보다는 전체를 보는 게 맞아.
      너는 특히나 더 그렇고.
    ja: |-
      …見事な判断だ。
      細かいことにいちいちとらわれるより、
      全体を見るべきだ。君は特にな。
  d_main_49_af_01_101:
    speaker: andersen_c_op
    en: Heh... It's almost unbelievable how much you've all grown.
    ko: "…하. 다들 말도 안될 정도로 훌쩍 커버려서는."
    ja: |-
      …ふっ…
      みんな、信じられないほど成長している。
  d_main_49_af_01_102:
    speaker: andersen_c_op
    en: There's nothing left for this old man to do.
    ko: 늙은 내가 할 일이 없구만 이거.
    ja: これじゃ、老いぼれた私に出番は無さそうだ。
  d_main_49_af_01_103:
    speaker: rapunzel_s
    en: "... Just by being here,"
    ko: "…그 자리에서, 있어주는 것만으로도."
    ja: "…この場にいてくださるだけでいいのです。"
  d_main_49_af_01_104:
    speaker: rapunzel_s
    en: you're giving us the strength to win, Commander.
    ko: 저희에게는 천군만마나 다름없어요. 지휘관.
    ja: |-
      それが私たちにとっては
      千の軍団にも及ぶ力になりますから、指揮官。
  d_main_49_af_01_105:
    speaker: andersen_c_op
    en: "... I see. Well, keep up the good work."
    ko: "…그래. 그럼 계속 고생해라."
    ja: "…そうか。では引き続き、各員奮闘してくれ。"
  d_main_49_af_01_106:
    speaker: rapunzel_s
    en: All right. Call me if you need me.
    ko: 예. 무슨 일 있으면 불러주세요.
    ja: はい。何かありましたらお呼びください。
  d_main_49_af_01_107:
    speaker: andersen_c_op
    en: Will do.
    ko: 오냐.
    ja: ああ。
  d_main_49_af_01_108:
    speaker: dorothy_g
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_109:
    speaker: "<Narration>"
    en: Dorothy is surprised.
    ko: 도로시는 놀라고 있었다.
    ja: ドロシーは驚愕していた
  d_main_49_af_01_110:
    speaker: "<Narration>"
    en: Her stamina doesn't drop no matter what she does. What's more, she feels like
      she could take a hit and still be fine.
    ko: |-
      무슨 짓을 해도 체력이 떨어지지 않는다.
      하물며 피격 당해도 괜찮을 것 같다는 느낌이 든다.
    ja: |-
      どれだけ動いても身体が疲れを感じない。
      いや、攻撃を受けても平気な気さえする
  d_main_49_af_01_111:
    speaker: "<Narration>"
    en: Then there's her overwhelming offensive abilities.
    ko: 그리고 압도적인 출력.
    ja: そして何よりも、圧倒的な出力
  d_main_49_af_01_112:
    speaker: dorothy_g
    en: "... This time, I'll try using this much..."
    ko: "…이번엔, 이 정도로."
    ja: "…今度は、これぐらいで…"
  d_main_49_af_01_113:
    speaker: "<Narration>"
    en: "*Pshoom!*"
    ko: 푸슝-!
    ja: バシュン――！
  d_main_49_af_01_114:
    speaker: "<Narration>"
    en: A beam shoots from Dorothy's gun and pierces the Raptures.
    ko: 도로시의 총구에서 뻗은 빔이 랩쳐들을 꿰뚫는다.
    ja: 銃口から伸びた光がラプチャーを貫いた
  d_main_49_af_01_115:
    speaker: "<Narration>"
    en: Her eyes grow wide.
    ko: 도로시의 눈이 커진다.
    ja: ドロシーが目を丸くする
  d_main_49_af_01_116:
    speaker: dorothy_g
    en: This is amazing...
    ko: "…이건, 대단한데."
    ja: "…これは、すさまじい力です。"
  d_main_49_af_01_117:
    speaker: andersen_c_op
    en: Hey, Heretic Dorothy. How does it feel to be all powered up?
    ko: |-
      여어. 헬레틱 도로시.
      파워 업한 기분은 어때?
    ja: |-
      やあ、ヘレティック・ドロシー君。
      パワーアップした気分はどうだ？
  d_main_49_af_01_118:
    speaker: dorothy_g
    en: If you call me that again, you'll be my next target.
    ko: 한번만 더 그렇게 부르면, 지휘관부터 쏴버릴거예요.
    ja: |-
      その呼び方でもう一度呼んだら、
      次は指揮官に風穴を開けますよ。
  d_main_49_af_01_119:
    speaker: andersen_c_op
    en: Ooh, I'm scared. Heretics really are different.
    ko: 어이쿠, 무서워라. 역시 헬레틱은 뭐가 달라도 다르네.
    ja: |-
      おお、怖い怖い…
      ずいぶんヘレティックが板についてきたなあ。
  d_main_49_af_01_120:
    speaker: dorothy_g
    en: Hmph...
    ko: "…하아."
    ja: "…はぁ…"
  d_main_49_af_01_121:
    speaker: dorothy_g
    en: It's absurd, to be honest. It feels like I can do anything.
    ko: |-
      솔직히 말도 안 될 정도네요.
      뭐든 할 수 있을 것 같아요.
    ja: |-
      正直に言って、自分でも信じられません。
      何でもできそうな気分です。
  d_main_49_af_01_122:
    speaker: andersen_c_op
    en: Then kill the Queen.
    ko: 그럼 퀸 좀 잡아줘.
    ja: じゃ、クイーンも倒してもらおうか。
  d_main_49_af_01_123:
    speaker: dorothy_g
    en: In a little bit. We have to make sure the Ark ascends first.
    ko: |-
      좀 이따가요.
      방주부터 올리고 해야죠.
    ja: |-
      遠からずそのつもりですが、
      今はアークの浮上が先です。
  d_main_49_af_01_124:
    speaker: andersen_c_op
    en: Right.
    ko: 그래.
    ja: そうだな。
  d_main_49_af_01_125:
    speaker: andersen_c_op
    en: Anything to report?
    ko: 뭐 특이 사항 없지?
    ja: 特に異常はないか？
  d_main_49_af_01_126:
    speaker: dorothy_g
    en: No.
    ko: 없어요.
    ja: ありません。
  d_main_49_af_01_127:
    speaker: andersen_c_op
    en: Good. Keep it up.
    ko: 그래. 잘하자.
    ja: だったら、後は任せる。
  d_main_49_af_01_128:
    speaker: dorothy_g
    en: All right.
    ko: 예.
    ja: はい。
  d_main_49_af_01_129:
    speaker: andersen_c
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_130:
    speaker: "<Narration>"
    en: After speaking with everyone, Andersen looks again at the battlefield.
    ko: 엔더슨은 모두와의 통신을 종료한 후, 다시 전장을 바라본다.
    ja: |-
      アンダーソンは全員との通信を終え、
      再び戦場に視線を向けた
  d_main_49_af_01_131:
    speaker: "<Narration>"
    en: He can't take his eyes off his teammates.
    ko: 동료들의 모습에서 눈을 떼지 못한다.
    ja: 仲間たちの戦いの様子から、片時も目を離さない
  d_main_49_af_01_132:
    speaker: andersen_c
    en: Yeah... This is why the surface is so great.
    ko: "…역시. 이래서 지상이 좋아."
    ja: "…やはり、これだから地上はいい。"
  d_main_49_af_01_133:
    speaker: laplace_p
    en: Oh! I think I see the end!
    ko: 오! 슬슬 끝이 보인다!
    ja: おお！そろそろ終わりが見えてきたぞ！
  d_main_49_af_01_134:
    speaker: maxwell_p
    en: Great! There are no more reinforcements coming! All we have to do is take
      those things down!
    ko: 좋아! 지원군은 더 없어! 이것들만 다 처리하면 끝이야!
    ja: |-
      よし！増援はもうなさそう！
      こいつらさえ片付ければ終わりだよ！
  d_main_49_af_01_135:
    speaker: drake_p
    en: I'm going to destroy the last one! Then I'll take all the credit for myself!
    ko: 마지막 한놈은 내가 없앤다! 그리고 모든 공을 독식할거다!
    ja: |-
      最後の1匹は私が仕留めてやろう！
      すべての手柄を独り占めしてやる！
  d_main_49_af_01_136:
    speaker: maxwell_p
    en: Cutey! What kind of magic did you use to do this?
    ko: 베이비! 대체 무슨 마법을 부린거야?
    ja: ベビー！いったいどんな魔法を使ったの？
  d_main_49_af_01_137:
    speaker: "<Self>"
    en: The Four Beasts and the Goddess Squad completely cut the Raptures off up ahead!
    ko: 포비스트랑 갓데스가 랩쳐의 허리를 완전히 박살냈지!
    ja: |-
      フォービーストとゴッデスが、
      ラプチャーの戦力を削いでくれている！
  d_main_49_af_01_138:
    speaker: laplace_p
    en: Haha! Serves you right, you dumb Raptures!
    ko: 하하하! 꼴 좋다! 랩쳐놈들!
    ja: ハハハ！思い知るがいい、ラプチャーども！
  d_main_49_af_01_139:
    speaker: drake_p
    en: That's harsh, mocking someone when they're already down.
    ko: 다친 사람한테 꼴 좋다는 말은 너무 심하다고 생각한다.
    ja: |-
      倒した相手にそんな言葉は、
      思いやりが足りないな。
  d_main_49_af_01_140:
    speaker: anis_i_w
    en: Wanna play a game? Let's see who can take out the most Raptures!
    ko: |-
      그럼 우리도 그거 해볼까?
      누가 더 많이 랩쳐 잡는지!
    ja: |-
      じゃ、私たちもやっちゃう？
      誰が一番ラプチャーを倒せるか競争！
  d_main_49_af_01_141:
    speaker: neon_v_w
    en: What? I mean, I don't mind, but Rapi and I have probably killed ten times
      as many as you.
    ko: 예에? 상관없는데, 저랑 라피. 벌써 아니스 10배는 넘게 잡았을걸요?
    ja: |-
      ええっ？構いませんけど、私とラピで
      もうアニスの10倍は倒してると思いますよ？
  d_main_49_af_01_142:
    speaker: rapi_red
    en: Neon is in first. It's rather upsetting.
    ko: 1등은 네온이야. 속상하네.
    ja: それだとネオンね。悔しいけど。
  d_main_49_af_01_143:
    speaker: anis_i_w
    en: Th-then let's start counting from now. How about it?
    ko: 지, 지금부터 다시 세자. 어때?
    ja: あー…今から数えるってことで、どう？
  d_main_49_af_01_144:
    speaker: neon_v_w
    en: Hm... Sure, okay. I guess we can give up our lead.
    ko: 으음… 뭐, 좋아요. 까짓거 저희가 손해 좀 보죠 뭐.
    ja: |-
      うーん…まあ、いいでしょう。
      それぐらいのハンデは必要ですね。
  d_main_49_af_01_145:
    speaker: black
    en: Anis's fighting spirit extends even to her comrades...! She never ceases to
      amaze...!
    ko: |-
      동료에게조차 불태우는 전의…!
      역시 아니스는 대단하군…!
    ja: |-
      仲間相手にもライバル心を燃やすとは…！
      さすがアニスだ…！
  d_main_49_af_01_146:
    speaker: red
    en: Must be nice, being able to view everything through a positive lens like that.
    ko: 뭐든 좋게만 볼 수 있어서 좋겠다 진짜.
    ja: |-
      何でもポジティブに受け取れるなんて
      うらやましいぜ、ホント。
  d_main_49_af_01_147:
    speaker: blue
    en: Oh, let her have this. She's just excited to work with Anis.
    ko: 놔둬요. 아니스가 합류해서 신난 모양이니까.
    ja: |-
      そっとしておいてあげましょう。
      憧れの人と共闘できて
      喜んでいるみたいですから。
  d_main_49_af_01_148:
    speaker: "<Self>"
    en: Keep it up, everyone! Just a little—
    ko: 다들! 조금만 더 힘내면 끝-
    ja: みんな！あともうひと頑張りだ――
  d_main_49_af_01_149:
    speaker: eunhwa_t
    en: You call yourself a Commander when all you ever do is cheer from the sidelines?
    ko: 지휘관이라는 녀석이 기껏 한다는 말이 그런 응원밖에 없는 거냐.
    ja: 指揮官ともあろう者が、できるのは応援だけか？
  d_main_49_af_01_150:
    speaker: eunhwa_t
    en: That is why you're still a hack.
    ko: 그래서 넌 여전히 삼류라는 거다.
    ja: だからお前はいつまで経っても三流なんだ。
  d_main_49_af_01_151:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  d_main_49_af_01_152:
    speaker: vesti_t
    en: Hi, C-Commander. We're here, hehe.
    ko: 지, 지휘관님. 우리 왔어. 헤헤.
    ja: し、指揮官様、来たよ。えへへ。
  d_main_49_af_01_153:
    speaker: emma_t
    en: Hey, Commander. Looking just as handsome as ever.
    ko: 안녕~ 지휘관. 여전히 멋있네?
    ja: |-
      こんにちは～、指揮官。
      相変わらず決まってるわね～？
  d_main_49_af_01_154:
    speaker: laplace_p
    en: Hm?
    ko: 응?
    ja: なんだ？
  d_main_49_af_01_155:
    speaker: rapi_red
    en: "... Absolute."
    ko: "…앱솔루트."
    ja: "…アブソルート。"
  d_main_49_af_01_156:
    speaker: anis_i_w
    en: Why is Absolute suddenly poppin' up out of nowhere?
    ko: 갑자기 앱솔루트가 왜 튀어나와?
    ja: なんで急に出てくるわけ？
  d_main_49_af_01_157:
    speaker: vesti_t
    en: P-popping up...?
    ko: 튀, 튀어나오다니….
    ja: で、出てくるなんて…
  d_main_49_af_01_158:
    speaker: maxwell_p
    en: What are you doing here?
    ko: 뭐야. 왜 왔어?
    ja: あれ、どうしてここに？
  d_main_49_af_01_159:
    speaker: eunhwa_t
    en: What do you think?
    ko: 왜 왔겠냐.
    ja: 決まっているだろうが。
  d_main_49_af_01_160:
    speaker: maxwell_p
    en: What I meant is, what've you been doing this whole time that you're only now
      getting here?
    ko: 내 말은, 지금까지 뭐 하다가 이제서야 오냐고.
    ja: 私が聞いたのは、今まで何してたのかってこと。
  d_main_49_af_01_161:
    speaker: eunhwa_t
    en: I never took you for the inquisitive type.
    ko: 궁금한게 그렇게 많은 성격인줄 몰랐군.
    ja: 知りたがりだとは思っていなかったな。
  d_main_49_af_01_162:
    speaker: maxwell_p
    en: How about you just leave? Instead of coming when we're practically done and
      then acting like you did anything.
    ko: |-
      야. 너희들 가.
      다 잡아놨더니 뭘 이제 와서 숟가락을 얹으려고 해.
    ja: |-
      だいたい、今さら何しに来たの。
      もうほとんどこっちで片付けたんだから、
      おいしいところだけ渡さないって。
  d_main_49_af_01_163:
    speaker: anis_i_w
    en: Yeah, yeah!
    ko: 맞아 맞아.
    ja: そうだそうだ！
  d_main_49_af_01_164:
    speaker: vesti_t
    en: B-but there are still so many left...
    ko: 아, 아직 많이 남았는데….
    ja: ま、まだたくさん残ってるみたいだけど…
  d_main_49_af_01_165:
    speaker: drake_p
    en: Hmph! You've got eyes, right? Then use them! Does that look like a lot to
      you?
    ko: 흥! 눈이 있다면 잘 봐라! 저게 많이 남아 있는 걸로 보이나?
    ja: |-
      フン！目がついているならよく見てみろ！
      あれがたくさんに見えるか？
  d_main_49_af_01_166:
    speaker: emma_t
    en: Hmm... Yeah, it does.
    ko: 어디보자… 응. 많이 남았어.
    ja: え～と…そうねぇ、いっぱい見えるわ～
  d_main_49_af_01_167:
    speaker: drake_p
    en: Oh. Well, you've got good eyes then.
    ko: 그렇군. 눈이 좋군.
    ja: そうか、目がいいようだな。
  d_main_49_af_01_168:
    speaker: "<Self>"
    en: Seriously, though. What have you been doing?
    ko: 그런데 진짜 뭘 하다가 이제 온거야?
    ja: とは言え、本当に今までどうしていたんだ？
  d_main_49_af_01_169:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_170:
    speaker: eunhwa_t
    en: We just got back from a secret mission.
    ko: 극비 임무를 마치고 돌아왔다.
    ja: 極秘任務から帰還したところだ。
  d_main_49_af_01_171:
    speaker: eunhwa_t
    en: I'll tell you later. For now, let's focus on the Ark's ascent.
    ko: |-
      나중에 얘기해주지.
      일단, 방주부터 올린다.
    ja: |-
      どうせ後で聞くことになる。
      今はアークの浮上が最優先だ。
  d_main_49_af_01_172:
    speaker: maxwell_p
    en: "... Yeah, okay. Sounds good."
    ko: "…뭐. 좋아. 그러자고."
    ja: "…ま、いいや。そうだね。"
  d_main_49_af_01_173:
    speaker: laplace_p
    en: This time we'll see once and for all who's the strongest!
    ko: 이번에야말로! 진짜 최강이 누군지 가릴 때군!
    ja: 今こそ！真の最強が誰かを決める時だ！
  d_main_49_af_01_174:
    speaker: eunhwa_t
    en: Still obsessing over that, are you?
    ko: 아직까지 그런거에 집착하는거냐.
    ja: まだそんなことにこだわっているのか。
  d_main_49_af_01_175:
    speaker: eunhwa_t
    en: "... Fine, I'll play along."
    ko: "…뭐, 어울려주지."
    ja: "…ついでだ、付き合ってやろう。"
  d_main_49_af_01_176:
    speaker: vesti_t
    en: Y-you say it like that, but we all know you're actually happy to be included...
    ko: 조, 좋으면서 꼭 저렇게 말 하고.
    ja: う、嬉しいくせに、あんな言い方しちゃって…
  d_main_49_af_01_177:
    speaker: emma_t
    en: Hehe. I think acting like that is part of the fun for her.
    ko: 후후. 그래야 더 재밌어지나봐.
    ja: ふふ、そのほうがもっと楽しくなるものね。
  d_main_49_af_01_178:
    speaker: rapi_red
    en: This reminds me of old times.
    ko: 뭔가 옛날 생각 나는걸.
    ja: 昔を思い出すわ。
  d_main_49_af_01_179:
    speaker: anis_i_w
    en: Same here.
    ko: 그러게.
    ja: そうね。
  d_main_49_af_01_180:
    speaker: neon_v_w
    en: Yeah, even though a lot is different now.
    ko: 그때랑은, 여러 가지 달라졌지만요.
    ja: |-
      あの頃とは、
      いろいろ変わってしまいましたけどね。
  d_main_49_af_01_181:
    speaker: rapi_red
    en: Commander, we should also compete to see who's the strongest.
    ko: 지휘관. 저희도 참전하죠. 최강 선별전에.
    ja: |-
      指揮官。私たちも参加しましょう。
      最強決定戦です。
  d_main_49_af_01_182:
    speaker: "<Self>"
    en: Go for it. Do me proud.
    ko: 좋아. 질 수 없지.
    ja: それは負けられないな
  d_main_49_af_01_183:
    speaker: black
    en: "... It's great to see such friendly rivalry."
    ko: |-
      …멋지군.
      저것이 선의의 경쟁인가.
    ja: |-
      …素晴らしい。
      あれが高めあうということか。
  d_main_49_af_01_184:
    speaker: red
    en: Is that what it looks like to you?
    ko: 그렇게 보이냐.
    ja: どうだかな。
  d_main_49_af_01_185:
    speaker: blue
    en: What, are you jealous?
    ko: 부러운가요?
    ja: ジェラシーですか？
  d_main_49_af_01_186:
    speaker: red
    en: Well... I'd be lying if I said no.
    ko: 뭐어… 아니라고 하면 거짓말이겠지.
    ja: まあ…違うって言ったらウソになるか。
  d_main_49_af_01_187:
    speaker: red
    en: Take away the Ark Buster, and we can't hold a candle to any of them.
    ko: 우린, 아크버스터 빼면 저기에 명함도 못 내미니까.
    ja: |-
      オレたち、アークバスターを抜きにしたら、
      あの足元にも届かないからさ。
  d_main_49_af_01_188:
    speaker: black
    en: I'm sure they were once like us.
    ko: 저들도 우리와 같은 시기가 있었을거다.
    ja: |-
      彼女たちにも、
      私たちと同じような時期があったはずだ。
  d_main_49_af_01_189:
    speaker: black
    en: All we have to do is keep moving forward and not give up.
    ko: 포기하지 않고, 계속 해나가면 돼.
    ja: あきらめずに、続けていけばいい。
  d_main_49_af_01_190:
    speaker: blue
    en: That's something both you and Red are great at.
    ko: 레드랑 블랙이 제일 잘 하는거네요.
    ja: レッドとブラックの得意分野ですね。
  d_main_49_af_01_191:
    speaker: red
    en: Don't try to squirrel your way out of it.
    ko: 은근히 빠지지 마.
    ja: しれっと自分だけ外すなよ。
  d_main_49_af_01_192:
    speaker: blue
    en: Oh, you're gonna include me too?
    ko: 어머. 끼워주시나요?
    ja: あら。混ぜてもらえるんですか？
  d_main_49_af_01_193:
    speaker: red
    en: Of course. We can't be the only two doing all the hard work.
    ko: 당연하지. 우리만 구르면 억울하잖냐.
    ja: |-
      当たり前だ。オレたちだけ
      苦労させようったって、そうは行くか。
  d_main_49_af_01_194:
    speaker: blue
    en: Hehe. Aww, that's too bad.
    ko: 후후. 싫어라.
    ja: ふふ、それは残念です。
  d_main_49_af_01_195:
    speaker: "<Self>"
    en: Let's go, everyone!
    ko: 다들! 가자!
    ja: みんな！畳みかけるぞ！
  d_main_49_af_01_196:
    speaker: "<Narration>"
    en: There are no more Rapture reinforcements coming.
    ko: 랩쳐의 지원군이 더는 오지 않는다.
    ja: ラプチャーの増援は絶たれた
  d_main_49_af_01_197:
    speaker: "<Narration>"
    en: The once seemingly endless stream of Raptures has noticeably decreased.
    ko: 무한한 것 같았던 랩쳐의 수가 눈에 띄게 줄어들었다.
    ja: |-
      無限にも思えたラプチャーの数が、
      目に見えて減り始めている
  d_main_49_af_01_198:
    speaker: "<Narration>"
    en: The battlefield is starting to thin out.
    ko: "…전장이 정리되기 시작한다."
    ja: "…戦場は収束しつつあった"
  d_main_49_af_01_199:
    speaker: "<Narration>"
    en: I look around at everyone's faces.
    ko: 시선을 돌려 모두의 표정을 바라본다.
    ja: 戦っている仲間たちの表情をのぞく
  d_main_49_af_01_200:
    speaker: "<Narration>"
    en: I see... certainty.
    ko: "…확신."
    ja: "…確信だ"
  d_main_49_af_01_201:
    speaker: "<Narration>"
    en: Each of their expressions is filled with certainty.
    ko: 모두가 확신하고 있다.
    ja: 誰もが確信の表情を浮かべている
  d_main_49_af_01_202:
    speaker: "<Narration>"
    en: This is it. We've done it.
    ko: 됐다. 해냈다.
    ja: この場は私たちの勝ちだ
  d_main_49_af_01_203:
    speaker: rapi_red
    en: "... Commander. It's time."
    ko: "…지휘관. 때가 됐습니다."
    ja: "…指揮官、今のうちです。"
  d_main_49_af_01_204:
    speaker: "<Self>"
    en: "... Right."
    ko: "…응."
    ja: "…ああ"
  d_main_49_af_01_205:
    speaker: "<Self>"
    en: Enikk.
    ko: 에닉.
    ja: エニック
  d_main_49_af_01_206:
    speaker: enikk_op_l
    en: Yes?
    ko: 예.
    ja: はい。
  d_main_49_af_01_207:
    speaker: "<Self>"
    en: We're ready.
    ko: 준비됐어.
    ja: こちらは片付いた
  d_main_49_af_01_208:
    speaker: enikk_op_l
    en: Understood.
    ko: 알겠습니다.
    ja: 了解しました。
  d_main_49_af_01_209:
    speaker: burningum
    en: Enikk, begin the broadcast.
    ko: "…에닉. 전파해줘."
    ja: "…エニック、始めてくれ。"
  d_main_49_af_01_210:
    speaker: enikk_op_l
    en: Understood.
    ko: 알겠습니다.
    ja: 命令を受領。
  d_main_49_af_01_211:
    speaker: enikk
    en: Initiating broadcast to the entire Ark.
    ko: 방주 전체에 전파합니다.
    ja: アーク全体に通達。
  d_main_49_af_01_212:
    speaker: enikk
    en: We will now begin the Ark ascent sequence.
    ko: 현 시간부로 방주의 부상 시퀀스를 개시합니다.
    ja: |-
      現時刻より、
      アークの浮上シークエンスを開始します。
  d_main_49_af_01_213:
    speaker: enikk
    en: There will be tremors and loud noises, but know that you are in no danger.
    ko: 큰 진동과 소음이 발생하겠으나, 안전에는 문제가 없다는 점 명심해주시기 바랍니다.
    ja: |-
      大きな振動と騒音が発生します。
      安全には問題ありません。
      冷静に行動してください。
  d_main_49_af_01_214:
    speaker: enikk
    en: Please follow the directions of your shelter guides.
    ko: 모든 인원은 쉘터에서 안내 요원들의 지시를 잘 따라주시기 바랍니다.
    ja: |-
      全ての人員は、
      シェルター案内員の指示に従ってください。
  d_main_49_af_01_215:
    speaker: enikk
    en: Additionally, please remain in the shelters until the ascent is complete and
      the situation has been resolved.
    ko: 또한, 방주 부상 완료 후 상황이 정리될 때까진 쉘터 안에서 대기해 주십시오.
    ja: |-
      また、アークの浮上完了後も、
      状況確認が終了するまで
      シェルター内で待機を続けてください。
  d_main_49_af_01_216:
    speaker: ingrid
    en: Listen up! Humanity is finally going to the surface!
    ko: |-
      제군들! 들어라!
      마침내 인류는 지상으로 올라간다!
    ja: |-
      諸君！傾注せよ！
      いよいよ人類は地上へ帰る！
  d_main_49_af_01_217:
    speaker: syuen
    en: The time has come to take back our land from the Raptures!
    ko: 랩쳐에게 빼앗겼던 지상을, 다시 되찾을 때라는 말씀이야!
    ja: |-
      ラプチャーに奪われた大地を、
      取り戻す時が来たってことよ！
  d_main_49_af_01_218:
    speaker: mustang
    en: Everyone! Are you ready to see le new world?
    ko: Everyone! New World를 맞이할 Ready는 되셨나Yo?
    ja: |-
      Everyone！New Worldを迎える
      ReadyはできていますKA？
  d_main_49_af_01_219:
    speaker: eh_n
    en: "... We're really going to the surface."
    ko: "…올라간다."
    ja: "…地上へ行く。"
  d_main_49_af_01_220:
    speaker: viper
    en: Yep ♡
    ko: 응♡
    ja: うん♡
  d_main_49_af_01_221:
    speaker: jackal
    en: Hehe! Hehehe!
    ko: 헤헤! 에헤헤헤!
    ja: へへ！えへへへ！
  d_main_49_af_01_222:
    speaker: rosanna
    en: Let's do it. Up we go.
    ko: 자, 올라가자고.
    ja: さ、行ってやろうじゃんか。
  d_main_49_af_01_223:
    speaker: sakura
    en: Let us ascend.
    ko: 가시지요.
    ja: 参りましょう。
  d_main_49_af_01_224:
    speaker: moran
    en: Here we gooo!
    ko: 가자! 올라가자아--!!
    ja: 行くぞ！上がれ！！
  d_main_49_af_01_225:
    speaker: poli
    en: We're finally doing it. We're going up.
    ko: 올라가네영. 드디어.
    ja: いよいよ地上に行くんですねぇ。
  d_main_49_af_01_226:
    speaker: miranda
    en: Yes! I'm so excited!
    ko: 예! 저 너무 두근거립니다!
    ja: はい！私、すごくドキドキしています！
  d_main_49_af_01_227:
    speaker: quiry
    en: S-same here...! B-but more afraid than excited...!
    ko: |-
      저, 저도요…!
      무, 무서운게 더 크지만…!
    ja: |-
      わ、私もです…！
      怖い気持ちのほうが大きい気もしますけど…！
  d_main_49_af_01_228:
    speaker: privaty
    en: "... We're going up. All of us."
    ko: "…올라가죠, 모두."
    ja: "…地上へ行きましょう、全員で。"
  d_main_49_af_01_229:
    speaker: yulha
    en: Yeah, let's go.
    ko: 그래. 올라가자.
    ja: ええ、行きましょ。
  d_main_49_af_01_230:
    speaker: admi
    en: Yes, let us all go up. Together.
    ko: 예. 모두 함께. 올라가요.
    ja: はい。みんな一緒に、行きましょう。
  d_main_49_af_01_231:
    speaker: elegg
    en: Hehe! I'm glad we get to work together up on the surface too, Ms. Trony.
    ko: |-
      히히. 트로니 씨.
      올라가서도 잘 부탁드려여.
    ja: |-
      ふひひっ…トロニー氏。
      地上でもよろしく頼みますぞ。
  d_main_49_af_01_232:
    speaker: trony
    en: Y-yeah. Me too, Elegg
    ko: 으, 응. 나야말로 잘 부탁해. 일레그.
    ja: う、うん。私のほうこそ、よろしくね、エレグ。
  d_main_49_af_01_233:
    speaker: rapi_red
    en: "... Finally."
    ko: "…드디어."
    ja: "…ついに…"
  d_main_49_af_01_234:
    speaker: anis_i_w
    en: The Ark... It's really coming to the surface.
    ko: "…올라오는구나. 방주가."
    ja: "…地上へ出るのね。アークが。"
  d_main_49_af_01_235:
    speaker: neon_v_w
    en: Oh, man! My heart is racing!
    ko: 와 저 어떡하죠? 너무 두근거리는데요?
    ja: どうしましょう？胸が高鳴りますね。
  d_main_49_af_01_236:
    speaker: laplace_p
    en: "... They're coming up."
    ko: "…올라온다."
    ja: "…来る。"
  d_main_49_af_01_237:
    speaker: maxwell_p
    en: Yeah. Finally.
    ko: 그래. 마침내 올라오는거야.
    ja: うん、来てるね。
  d_main_49_af_01_238:
    speaker: drake_p
    en: Mwahaha... Now the entire surface will be a playground for my villainy.
    ko: 후후. 그레이트 빌런의 무대가 더욱 넓어지겠군.
    ja: |-
      ククク…偉大なヴィラン活躍の舞台が
      さらに広がるな。
  d_main_49_af_01_239:
    speaker: vesti_t
    en: E-Eunhwa, Emma. The Ark's coming up...
    ko: 으, 은화. 엠마. 올라온대. 응?
    ja: ウ、ウンファ。エマ。来てるみたい…
  d_main_49_af_01_240:
    speaker: eunhwa_t
    en: Yeah...
    ko: "…그래."
    ja: "…ああ。"
  d_main_49_af_01_241:
    speaker: emma_t
    en: Hehe, you're allowed to express your happiness a bit more, you know.
    ko: 어머. 조금 더 기뻐해도 좋은데.
    ja: あら。もっと顔に出してもいいのに～
  d_main_49_af_01_242:
    speaker: black
    en: "... We can't let our guard down until the very end."
    ko: "…모두, 끝까지 긴장을 놓지 마."
    ja: "…みんな、最後まで気を抜くな。"
  d_main_49_af_01_243:
    speaker: red
    en: Yeah, of course.
    ko: 아아. 물론이지.
    ja: ああ、もちろんだ。
  d_main_49_af_01_244:
    speaker: blue
    en: This feels like a dream.
    ko: 꿈인지, 생시인지.
    ja: これは夢か現実か、ですね。
  d_main_49_af_01_245:
    speaker: "<Self>"
    en: Once the Ark ascends, I need everyone to keep their complete focus on the
      battle.
    ko: "…방주 부상 시, 더 집중해서 교전해줘."
    ja: |-
      …アークの浮上後は、
      さらに注意して戦闘を行ってくれ
  d_main_49_af_01_246:
    speaker: "<Self>"
    en: We can't let a single stray bullet reach the Ark.
    ko: 방주에 작은 유탄 하나도 날아가선 안 돼.
    ja: |-
      流れ弾一発、
      アークに飛ばすわけにはいかない
  d_main_49_af_01_247:
    speaker: "<Narration>"
    en: Everyone has determination written across their faces.
    ko: 모두의 얼굴에 결연함이 떠오른다.
    ja: 全員の顔が決意に引き締まる
  d_main_49_af_01_248:
    speaker: "<Narration>"
    en: We look at the enemies before us.
    ko: 정면의 적을 바라본다.
    ja: その目が正面の敵を捉えた
  d_main_49_af_01_249:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_250:
    speaker: "<Self>"
    en: The Third Surface Reclamation War begins now!
    ko: 3차 지상 탈환전! 개시!
    ja: 第三次地上奪還戦！ただ今より開始する！
  d_main_49_af_01_251:
    speaker: "<Self>"
    en: Let us rise up!
    ko: 올라가자--!!
    ja: 出るぞ、地上へ――！！
  d_main_49_af:
    speaker: "<>"
    en:
    ko:
    ja:
  d_main_49_af_01_252:
    speaker: enikk_op_l
    en: The Ark's ascent is complete.
    ko: 방주 부상 완료.
    ja: 浮上シークエンス、完了しました。
  d_main_49_af_01_253:
    speaker: burningum
    en: Dispatch all forces outside the Ark to form a perimeter, then have them take
      defensive positions.
    ko: |-
      모든 병력을 방주 밖으로.
      방주 인근에 배치시킨 후 방어한다.
    ja: |-
      全兵力を出撃、
      アーク周辺の防衛にあたらせろ。
  d_main_49_af_01_254:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_255:
    speaker: anis_i_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_256:
    speaker: neon_v_w
    en: "..."
    ko: "……."
    ja: "……"
  d_main_49_af_01_257:
    speaker: "<Self>"
    en: It's here... The Ark.
    ko: |-
      올라왔다….
      방주가….
    ja: |-
      地上に来たな…
      アークが…
  d_main_49_af_01_258:
    speaker: "<Narration>"
    en: Suddenly, a loud sound roars across the sky.
    ko: 빠아아아앙--!!
    ja: ファーン――！
  d_main_49_af_01_259:
    speaker: "<Narration>"
    en: The AZX comes flying from the Ark, its horn blaring.
    ko: |-
      큰 경적 소리와 함께,
      방주에서 AZX가 돌진한다.
    ja: |-
      大きな警笛を響かせ、
      アークから飛び出してきたのはAZXだ
  d_main_49_af_01_260:
    speaker: "<Narration>"
    en: It stirs up a cloud of dust as it stops in front of us.
    ko: 자욱한 흙먼지와 함께 우리 앞에 멈춰선다.
    ja: 土煙を巻き上げながら、私たちの前で停車した
  d_main_49_af_01_261:
    speaker: neon_v_w
    en: Is that...?
    ko: 와! 기차예요!
    ja: わあ！汽車です！
  d_main_49_af_01_262:
    speaker: anis_i_w
    en: A train!
    ko: 우와! 기차다!
    ja: うわぁ！汽車！
  d_main_49_af_01_263:
    speaker: rapi_red
    en: Infinity Rail!
    ko: 인피니티 레일…!
    ja: インフィニティレール…！
  d_main_49_af_01_264:
    speaker: "<Self>"
    en: I'm getting déjà vu...
    ko: "…데자뷔가…."
    ja: "…前にもこんなことがあったな…"
  d_main_49_af_01_265:
    speaker: diesel
    en: Yee-ha! Commando squad, do you read?
    ko: |-
      아아.
      특수 별동대 여러분. 들리시나요?
    ja: |-
      あー、あー…
      特殊別働隊のみなさん、聞こえますか？
  d_main_49_af_01_266:
    speaker: diesel
    en: Infinity Rail will take you where you need to go, all the way to fight the
      Queen.
    ko: 원하시는 목적지, 퀸과의 결전 장소까지 저희 인피니티 레일 스쿼드가 모시겠습니다.
    ja: |-
      ご希望の目的地、クイーンとの決戦の地まで、
      私たちインフィニティレール部隊が
      お運びいたします。
  d_main_49_af_01_267:
    speaker: soline
    en: Get on! Quick!
    ko: 자자! 빨리 타! 빨리!
    ja: ほらほら！さっさと乗って！早く！
  d_main_49_af_01_268:
    speaker: brid
    en: We'll depart once everyone has boarded.
    ko: 모든 인원 탑승 후 바로 출발하겠습니다.
    ja: |-
      本列車は皆さまのご搭乗を確認後、
      ただちに出発いたします。
  d_main_49_af_01_269:
    speaker: brid
    en: All passengers, please hurry on board.
    ko: 승객 여러분은 탑승을 서둘러 주세요.
    ja: お乗りのお客様は、ご搭乗をお急ぎください。
  d_main_49_af_01_270:
    speaker: "<Self>"
    en: Absolute! Let's go!
    ko: 앱솔루트! 가자!
    ja: アブソルート！乗ってくれ！
  d_main_49_af_01_271:
    speaker: eunhwa_t
    en: Roger that.
    ko: 라져.
    ja: 了解。
  d_main_49_af_01_272:
    speaker: laplace_p
    en: We're coming too!
    ko: 우리도 간다!
    ja: 私たちも行くぞ！
  d_main_49_af_01_273:
    speaker: "<Self>"
    en: Not yet! Matis and the Ark Rangers can join after you resupply!
    ko: 아니! 메티스와 아크레인저는 정비 후 합류해줘!
    ja: |-
      いや！メティスとアークレンジャーは
      まず整備を済ませてくれ！
  d_main_49_af_01_274:
    speaker: drake_p
    en: That's ridiculous! You're just trying to take all the glory for yourselves!
    ko: 까불지마라! 공을 독식할 생각인 것, 다 안다!
    ja: |-
      ふざけるな！手柄を独り占めしようと
      していることはお見通しだ！
  d_main_49_af_01_275:
    speaker: maxwell_p
    en: Do what Cutey says. If we rush over there now, all we could really do is serve
      as decoys.
    ko: 베이비 말대로 해. 우리 지금 달려들었다간 방패밖에 안 돼.
    ja: |-
      ベビーの言う通りだよ。このまま行ったって、
      おとりにしかならないでしょ。
  d_main_49_af_01_276:
    speaker: laplace_p
    en: Ugh...! Okay, Birdie! We'll recharge and be right there!
    ko: 크읏…! 알겠다 버드 보이! 금방 충전하고 가겠다!
    ja: |-
      くっ…！分かった、バードボーイ！
      すぐにチャージして向かう！
  d_main_49_af_01_277:
    speaker: black
    en: We'll catch up too! Go on ahead!
    ko: 우리도 곧 뒤따르겠다! 먼저 가라!
    ja: 我々もすぐに追いつく！行ってくれ！
  d_main_49_af_01_278:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 쿠우우우우--!!
    ja: ゴゴゴゴゴ――！！
  d_main_49_af_01_279:
    speaker: "<Narration>"
    en: The Wings of Victory flies overhead.
    ko: 우리의 머리 위로 승리의 날개 호가 날아간다.
    ja: 勝利の翼号が、私たちの頭上を追い越して行った
  d_main_49_af_01_280:
    speaker: "<Narration>"
    en: It heads toward where its true masters are, far away.
    ko: 저 멀리, 진짜 주인이 있는 곳으로 향한다.
    ja: |-
      遠くで戦っている本当の主たちを
      回収に向かったのだろう
  d_main_49_af_01_281:
    speaker: rapi_red
    en: Looks like they've already gotten started over there.
    ko: 저쪽은 벌써 시작한 모양입니다.
    ja: あちらもすでに動いているようです。
  d_main_49_af_01_282:
    speaker: rapi_red
    en: We should get going too.
    ko: 우리도 가시죠.
    ja: 私たちも行きましょう。
  d_main_49_af_01_283:
    speaker: "<Self>"
    en: Commence counterattack! We must save Marian...
    ko: |-
      역습 개시!
      마리안을 구하고-
    ja: |-
      反撃はここからだ！
      マリアンを救出し――
  d_main_49_af_01_284:
    speaker: "<Self>"
    en: and take down the Queen!
    ko: 퀸을 친다!
    ja: クイーンを打ち倒す！
  d_main_49_af_01_285:
    speaker: "<Narration>"
    en: The Goddess Squad gazes at the enormous city stretching high above the surface
      off in the distance.
    ko: |-
      갓데스 스쿼드는 저 멀리,
      지상에 솟아오른 거대한 도시를 바라본다.
    ja: |-
      ゴッデス部隊の面々は、はるか遠くから
      地上に出現した巨大都市を眺めていた
  d_main_49_af_01_286:
    speaker: "<Narration>"
    en: The entire scene feels surreal, a feeling only eclipsed by the elation it
      inspires in those looking at it.
    ko: |-
      현실감이 떨어지는 모습이었지만,
      그보다 더욱 큰 고양감이 몸을 휩쓴다.
    ja: |-
      目を疑うような光景だが、
      それ以上に大きな高揚感が全身を駆けめぐる
  d_main_49_af_01_287:
    speaker: andersen_c
    en: "... They made it."
    ko: "…올라왔다."
    ja: "…上がってきたか。"
  d_main_49_af_01_288:
    speaker: snowwhite_h
    en: That's... the Ark...
    ko: 저것이… 방주….
    ja: あれが…アーク…
  d_main_49_af_01_289:
    speaker: rapunzel_s
    en: Humanity's final city...
    ko: 인류 최후의 도시….
    ja: 人類最後の都市…
  d_main_49_af_01_290:
    speaker: hongryeon_g
    en: "'Tis bigger than methought."
    ko: 생각했던 것보다 크군그래.
    ja: 思ったよりは大きいねえ。
  d_main_49_af_01_291:
    speaker: dorothy_g
    en: Finally...
    ko: "…마침내."
    ja: "…ついに…"
  d_main_49_af_01_292:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 쿠우우우우--!!
    ja: ゴォォォォォ――！！
  d_main_49_af_01_293:
    speaker: "<Narration>"
    en: The Wings of Victory stops above the Goddess Squad.
    ko: 승리의 날개 호가 갓데스 스쿼드의 위에 멈춰선다.
    ja: 勝利の翼号がゴッデス部隊の頭上で動きを止めた
  d_main_49_af_01_294:
    speaker: sky
    en: We're here to pick you up!
    ko: 모시러 왔습니다!
    ja: 来てや…お迎えに上がりました！
  d_main_49_af_01_295:
    speaker: sora
    en: The final battle is about to begin ☆
    ko: 결전, 시작이네요☆
    ja: 決戦の時、ですね☆
  d_main_49_af_01_296:
    speaker: cielo
    en: It's an honor to be part of this with all of you, members of the Goddess Squad.
    ko: 갓데스 스쿼드와 함께 할 수 있어서, 영광입니다.
    ja: ゴッデス部隊の皆さまに同行できて、光栄です。
  d_main_49_af_01_297:
    speaker: andersen_c
    en: All right, everyone get on.
    ko: 자, 다들 타라.
    ja: さあ、早く行こう。
  d_main_49_af_01_298:
    speaker: andersen_c
    en: Let's ride this thing over, make short work of the Queen,
    ko: 비행기 타고 가서 퀸 모가지나 가볍게 딴 다음에
    ja: |-
      こいつに乗って、
      ささっとクイーンを片づけたら…
  d_main_49_af_01_299:
    speaker: andersen_c
    en: and then we'll all sit down for a meal.
    ko: 다 같이 밥이나 먹자고.
    ja: 全員で飯でも食いに行くか。
