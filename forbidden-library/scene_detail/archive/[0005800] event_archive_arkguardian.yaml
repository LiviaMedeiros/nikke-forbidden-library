---
event_arkguardian1_prologue:
  event_arkguardian1_prologue_1:
    speaker: cecil
    en: How are you feeling?
    ko: 상태는 어때요?
    ja: 具合はどうですか？
  event_arkguardian1_prologue_2:
    speaker: snowwhite_h_no
    en: Fine...
    ko: 나쁘지 않다.
    ja: 悪くない。
  event_arkguardian1_prologue_3:
    speaker: snowwhite_h_no
    en: On second thought, I feel great.
    ko: |-
      아니. 정정하지.
      아주 좋다.
    ja: |-
      いや、それ以上だな。
      最高だ。
  event_arkguardian1_prologue_4:
    speaker: snowwhite_h_no
    en: So this is what it's like to be able to move your body freely.
    ko: 몸이 마음대로 움직인다는 게 이런 느낌이었군.
    ja: 体が自由に動くとは、こういうことだったのか。
  event_arkguardian1_prologue_5:
    speaker: snowwhite_h_no
    en: I'd forgotten what this felt like.
    ko: 너무 오랫동안 잊고 있었다.
    ja: 長いあいだ忘れていた。
  event_arkguardian1_prologue_6:
    speaker: cecil
    en: Considering your condition, it's impressive any of you were able to move around
      on the surface.
    ko: 이제 와서 얘긴데, 당신들 용케도 그런 상태로 지상을 돌아다녔었군요.
    ja: |-
      今さらですが…よくこんな状態で
      地上を歩き回っていましたね。
  event_arkguardian1_prologue_7:
    speaker: cecil
    en: What a complete mess. Not a single component was left intact.
    ko: 엉망진창이에요. 멀쩡한 부품이 하나도 없는 수준이었죠.
    ja: |-
      全身ボロボロです。
      良好な状態の部品が
      ひとつもありませんでした。
  event_arkguardian1_prologue_8:
    speaker: cecil
    en: Not only that, Scarlet's body is practically a mass-produced model in its
      current state. It's unbelievable.
    ko: |-
      그리고 홍련은 소체 자체가 양산형에 가깝더라고요?
      기가 막힐 정도예요.
    ja: |-
      それに、紅蓮のボディは
      ほぼ量産型のものですね？
      信じられません。
  event_arkguardian1_prologue_9:
    speaker: cecil
    en: Yet despite all that, you both kept fighting. Most admirable.
    ko: "…그럼에도, 그만큼 싸워왔다는 게 대단하다는 얘기긴 하지만."
    ja: |-
      …今まで戦い続けてこられたこと自体、
      驚くべきことです。
  event_arkguardian1_prologue_10:
    speaker: snowwhite_h_no
    en: You're right. We are admirable.
    ko: 그래. 우리는 대단하다.
    ja: ああ。私たちはすごい。
  event_arkguardian1_prologue_11:
    speaker: cecil
    en: At present, your body has been completely repaired and even enhanced. Try
      to move as much as possible to acclimate to it.
    ko: |-
      일단 당신의 바디는 완전히 수리 및 개량되었어요.
      많이 움직여서 많이 익숙해지도록 해요.
    ja: |-
      ひとまず、あなたのボディは
      修理と更新が完了しました。
      とにかく動かして、慣れてください。
  event_arkguardian1_prologue_12:
    speaker: cecil
    en: How about the armaments? Do you like them? We tried to replicate them as closely
      as possible to what you used previously.
    ko: |-
      무장들은 어때요? 마음에 들어요?
      당신이 사용하던 무장과 최대한 비슷한 것들로 준비했어요.
    ja: |-
      武装の方は？手になじみますか？
      あなたが使っていたものに
      できるだけ近いタイプを選びました。
  event_arkguardian1_prologue_13:
    speaker: snowwhite_h_no
    en: They don't seem particularly strong. They're a bit too light in fact.
    ko: 좀 가벼운 것 같다. 그래서 약한 것 같다.
    ja: 軽すぎる。信頼性が不安だ。
  event_arkguardian1_prologue_14:
    speaker: cecil
    en: Weight has no bearing on power. Don't you know, technological advances begin
      with improvements in weight?
    ko: |-
      …가볍다고 약한 게 아니에요.
      기술의 발전은 경량화부터라고요.
    ja: |-
      …軽量でも、性能は落ちていません。
      技術の進歩はまず軽量化からです。
  event_arkguardian1_prologue_15:
    speaker: snowwhite_h_no
    en: Even so, they feel far too light, and seem too weak.
    ko: 그래도 너무 가벼워서 약한 것 같다.
    ja: それにしても軽すぎる。落ち着かない。
  event_arkguardian1_prologue_16:
    speaker: cecil
    en: I'm telling you, they're not weak.
    ko: 약하지 않다고요.
    ja: 性能は保証します。
  event_arkguardian1_prologue_17:
    speaker: snowwhite_h_no
    en: Then load me up with additional weapons and ammunition.
    ko: 그럼 무기와 탄환을 가득 실어다오.
    ja: なら、その分武器と弾薬を積んでくれ。
  event_arkguardian1_prologue_18:
    speaker: cecil
    en: We finally succeeded in increasing performance while reducing weight. What's
      the point of making it heavier again?
    ko: 기껏 무장의 성능은 올리면서 경량화에 성공했는데 무게를 늘려서 뭘 어쩌겠다는 건가요.
    ja: |-
      性能も上げたうえで身軽になれたのに、
      それでも重量を増やせと？
  event_arkguardian1_prologue_19:
    speaker: snowwhite_h_no
    en: The more weapons, the better.
    ko: 무기는 많으면 많을수록 좋다.
    ja: 武器は多ければ多いほどいい。
  event_arkguardian1_prologue_20:
    speaker: cecil
    en: "*Sigh* Fine."
    ko: 하아… 알겠어요.
    ja: はぁ…分かりました。
  event_arkguardian1_prologue_21:
    speaker: snowwhite_h_no
    en: Load me up to the limit.
    ko: 한계치까지 실어다오.
    ja: 限界まで積んでくれ。
  event_arkguardian1_prologue_22:
    speaker: cecil
    en: As you wish.
    ko: 알겠다고요.
    ja: 分かっています。
  event_arkguardian1_prologue_23:
    speaker: snowwhite_h_no
    en: Thank you.
    ko: 고맙다.
    ja: 礼を言う。
  event_arkguardian1_prologue_24:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_prologue_25:
    speaker: snowwhite_h_no
    en: How are Scarlet and Rapunzel?
    ko: 홍련과 라푼젤의 상태는 어떻지?
    ja: 紅蓮とラプンツェルはどうなった？
  event_arkguardian1_prologue_26:
    speaker: cecil
    en: I managed to keep them alive.
    ko: 살려놨어요.
    ja: 命は繋ぎとめました。
  event_arkguardian1_prologue_27:
    speaker: cecil
    en: Strictly speaking, their brains are being housed in the brain shelter.
    ko: 정확히는 뇌만, 브레인 셸터에 보관 중인 상태죠.
    ja: |-
      正確に言えば、脳だけが
      ブレインシェルターに保管されている状態です。
  event_arkguardian1_prologue_28:
    speaker: cecil
    en: Their bodies are beyond repair and cannot be used.
    ko: 바디는 쓸 수 없어요. 고칠 수 있는 수준이 아니거든요.
    ja: |-
      ボディはもう使い物になりません。
      修理で対応できるレベルを超えていました。
  event_arkguardian1_prologue_29:
    speaker: snowwhite_h_no
    en: That's a relief. Then when will they receive their new bodies?
    ko: "…다행이군. 그럼 언제 새로운 바디를 받을 수 있지?"
    ja: "…そうか。新しいボディはいつ完成する？"
  event_arkguardian1_prologue_30:
    speaker: cecil
    en: That won't be possible.
    ko: 안 돼요.
    ja: 予定はありません。
  event_arkguardian1_prologue_31:
    speaker: snowwhite_h_no
    en: "... What?"
    ko: "…뭐?"
    ja: "…なぜだ？"
  event_arkguardian1_prologue_32:
    speaker: cecil
    en: Eden doesn't possess the technology to manufacture Nikkes.
    ko: 에덴에 니케 제작 기술은 없거든요.
    ja: エデンにニケの製造技術はありませんから。
  event_arkguardian1_prologue_33:
    speaker: snowwhite_h_no
    en: I don't understand. Then what have you been doing all this time?
    ko: |-
      이해가 안 가는군.
      그럼 지금까지 했던 건 뭐지?
    ja: |-
      理解できないな。
      今までどうしていた？
  event_arkguardian1_prologue_34:
    speaker: cecil
    en: We can modify or repair pre-existing bodies,
    ko: 만들어져 있는 바디를 개조하고 고치는 건 가능해요.
    ja: すでにあるボディの改造や修理は可能です。
  event_arkguardian1_prologue_35:
    speaker: cecil
    en: but creating one from scratch is beyond our capabilities.
    ko: 하지만 처음부터 만드는 건 안 돼요.
    ja: 一から製造する能力がないということです。
  event_arkguardian1_prologue_36:
    speaker: cecil
    en: It's similar to how the Ark handles NIMPH.
    ko: 방주가 NIMPH를 다루는 것과 비슷한 상황이라 보면 되겠네요.
    ja: |-
      アークにとってのNIMPHと
      同じような関係と言えます。
  event_arkguardian1_prologue_37:
    speaker: cecil
    en: When I escaped from the Ark, I took everything I could carry with me...
    ko: 방주에서 탈주할 때 가져올 수 있는 건 죄다 챙겨서 도망쳐 나왔지만….
    ja: |-
      アークを離れる時に、
      持てるだけのものは持ち出してきましたが…
  event_arkguardian1_prologue_38:
    speaker: cecil
    en: However, I was merely an M.M.R. researcher. There was no way I could smuggle
      out Nikke production technology on top of everything else.
    ko: 일개 M.M.R.의 연구원이었던 제가 니케 제작 기술까지 들고나올 순 없었죠.
    ja: |-
      M.M.R.の一介の研究員に過ぎない私では、
      ニケの製造技術まで手が届きませんでした。
  event_arkguardian1_prologue_39:
    speaker: cecil
    en: That technology is entirely monopolized by the Big Three.
    ko: 니케 제작 기술은 방주의 3대 기업이 꽉 잡고 있으니까.
    ja: |-
      あれはアーク三大企業が
      厳重に管理する機密ですから。
  event_arkguardian1_prologue_40:
    speaker: snowwhite_h_no
    en: "... So what happens now?"
    ko: "…그럼 어떻게 되는 거지?"
    ja: "…これからどうなる？"
  event_arkguardian1_prologue_41:
    speaker: cecil
    en: We'll have to obtain it from the Ark.
    ko: 기술을 받아야죠. 방주에게.
    ja: 技術供与が必要になります。アークからの。
  event_arkguardian1_prologue_42:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_prologue_43:
    speaker: cecil
    en: That guy, @UserName, is making his way to Eden.
    ko: 그 사람, @UserName이 에덴으로 오고 있어요.
    ja: "@UserNameをエデンに呼び出しています。"
  event_arkguardian1_prologue_44:
    speaker: cecil
    en: I'm planning to have him request the Ark to transfer Nikke production technology
      to us.
    ko: 그 사람을 통해서 방주에게 니케 제작 기술을 양도해달라고 요구해 볼 생각이예요.
    ja: |-
      彼を介して、アークに
      ニケの製造技術共有を依頼する予定です。
  event_arkguardian1_prologue_45:
    speaker: snowwhite_h_no
    en: And you're okay with doing that?
    ko: 너는 그래도 괜찮은 건가?
    ja: お前はそれでいいのか？
  event_arkguardian1_prologue_46:
    speaker: cecil
    en: Of course I'm not okay with it. It hurts both my pride and feelings.
    ko: 당연히 안 괜찮죠. 자존심도 상하고 기분도 나빠요.
    ja: |-
      むろん、よくはありませんね。
      プライドは傷つきますし、苦々しい気分です。
  event_arkguardian1_prologue_47:
    speaker: cecil
    en: The same applies to Johan, obviously...
    ko: 요한이야 뭐… 말할 것도 없고.
    ja: ヨハンも…まぁ、言うまでもないでしょう。
  event_arkguardian1_prologue_48:
    speaker: cecil
    en: However, during our battle against the Queen, I realized something.
    ko: 하지만 이번 퀸 공략전을 통해 깨달은 게 있어요.
    ja: |-
      ですが、今回のクイーン攻略戦で
      痛感したことがあります。
  event_arkguardian1_prologue_49:
    speaker: cecil
    en: We should've set aside our bullheaded pride and conviction and just focused
      on becoming stronger.
    ko: |-
      자존심이나 신념 같은 건 집어넣어 두고,
      좀 더 힘을 키워야 했었다고.
    ja: |-
      私たちはプライドや信念など脇に置いて、
      さらに力を求めるべきでした。
  event_arkguardian1_prologue_50:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_prologue_51:
    speaker: cecil
    en: If we had shared our technology with you and learned yours in return,
    ko: |-
      당신들에게 우리의 기술을 전달하고,
      우리가 당신들의 기술을 전수받았으면.
    ja: |-
      私たちとあなた方、
      それぞれが持つ技術や経験を
      お互いに分かち合えていれば…
  event_arkguardian1_prologue_52:
    speaker: cecil
    en: things might have turned out a lot differently.
    ko: 좀 더, 다른 결과가 나올 수 있지 않았을까 하고.
    ja: もっと違う結果が、あったのではないかと。
  event_arkguardian1_prologue_53:
    speaker: cecil
    en: It's something I regret.
    ko: 후회하고 있어요.
    ja: そう後悔しています。
  event_arkguardian1_prologue_54:
    speaker: cecil
    en: Though at this point, such insights are pointless.
    ko: 뭐, 지나간 마당에 아무런 소용없는 얘기겠지만.
    ja: |-
      まあ、今さら悔いたところで、
      何の意味もありませんが。
  event_arkguardian1_prologue_55:
    speaker: snowwhite_h_no
    en: "... I feel the same way."
    ko: "…나도 그렇다."
    ja: "…私もそうだ。"
  event_arkguardian1_prologue_56:
    speaker: snowwhite_h_no
    en: I took the Queen too lightly.
    ko: 퀸이라는 존재에 대해 너무 안일하게 생각했다.
    ja: クイーンという存在を、軽く考えすぎていた。
  event_arkguardian1_prologue_57:
    speaker: snowwhite_h_no
    en: I thought of her as something that existed only in concept,
    ko: 그저 개념적으로 존재하는 무언가… 라고 막연하게 생각했었지.
    ja: |-
      ただ、そういうものが存在する…
      その程度の認識しかしていなかった。
  event_arkguardian1_prologue_58:
    speaker: snowwhite_h_no
    en: and I figured that would be enough.
    ko: 그래서 이 정도면 충분하겠지, 라고 생각했던 것 같다.
    ja: だから、これだけやれば勝てるはずだと…
  event_arkguardian1_prologue_59:
    speaker: snowwhite_h_no
    en: But I was far too complacent. I regret it.
    ko: 너무 안일했어. 반성하고 있다.
    ja: 甘く見ていた。反省している。
  event_arkguardian1_prologue_60:
    speaker: cecil
    en: Yes...
    ko: "…예."
    ja: "…そうですね。"
  event_arkguardian1_prologue_61:
    speaker: snowwhite_h_no
    en: If we obtain the Nikke production technology from the Ark, Noah can be restored
      as well.
    ko: |-
      방주에게 니케 제작 기술을 전달받으면,
      노아도 복귀 가능하겠군.
    ja: |-
      ニケの製造技術が手に入れば、
      ノアも助けられるな。
  event_arkguardian1_prologue_62:
    speaker: cecil
    en: "... We can only hope."
    ko: "…그러길, 바래야죠."
    ja: "…そう、願います。"
  event_arkguardian1_prologue_63:
    speaker: snowwhite_h_no
    en: "... What about Harran and Isabel?"
    ko: "…하란과 이사벨은?"
    ja: "…ハランとイサベルは？"
  event_arkguardian1_prologue_64:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_prologue_65:
    speaker: snowwhite_h_no
    en: "... I'm sorry."
    ko: "…미안하다."
    ja: "…すまない。"
  event_arkguardian1_prologue_66:
    speaker: cecil
    en: No, it is all right.
    ko: 아니. 괜찮아요.
    ja: いいえ、気にしないでください。
  event_arkguardian1_prologue_67:
    speaker: cecil
    en: Those two... heh. I never thought I would say this, but...
    ko: |-
      그 둘은… 후후.
      제가 이 말을 입에 담을 줄은 몰랐지만.
    ja: |-
      あの2人は…ふふ。
      私の口から、こんなことを言う日が
      来るとは思いませんでしたが…
  event_arkguardian1_prologue_68:
    speaker: cecil
    en: They went out like true Goddesses of Victory.
    ko: 승리의 여신답게, 떠났어요.
    ja: 勝利の女神らしく、去りましたから。
  event_arkguardian1_prologue_69:
    speaker: cecil
    en: So it's fine.
    ko: 그러니 괜찮아요.
    ja: 気に病むことはありません。
  event_arkguardian1_prologue_70:
    speaker: snowwhite_h_no
    en: "... All right."
    ko: "…그래."
    ja: "…そうか。"
  event_arkguardian1_prologue_71:
    speaker: cecil
    en: Get some rest. You must be exhausted from all the testing.
    ko: 좀 쉬어요. 테스트하느라고 고생 많았을 테니까.
    ja: |-
      少し休んでください。
      テスト続きでお疲れでしょう。
  event_arkguardian1_prologue_72:
    speaker: snowwhite_h_no
    en: I guess. Thanks for everything you've done.
    ko: 그래. 수고 많았다.
    ja: ああ。助かった。
  event_arkguardian1_prologue_73:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_prologue_74:
    speaker: "<Narration>"
    en: Snow White lies on the bed and stares at the ceiling.
    ko: 스노우 화이트는 침대에 누워 천장을 바라보았다.
    ja: |-
      スノーホワイトはベッドに横たわり、
      天井を眺めた
  event_arkguardian1_prologue_75:
    speaker: "<Narration>"
    en: Her thoughts are all over the place.
    ko: 머릿속이 뒤죽박죽이다.
    ja: まとまらない思考が頭をめぐる
  event_arkguardian1_prologue_76:
    speaker: "<Narration>"
    en: However, the mental turmoil soon settles, condensing into a single thought.
    ko: 하지만 복잡하던 머릿속은 곧, 하나의 생각으로 정리됐다.
    ja: しかし、意識はやがて一つに集約した
  event_arkguardian1_prologue_77:
    speaker: "<Narration>"
    en: Kill the Queen.
    ko: 퀸을 죽인다.
    ja: クイーンを倒す
  event_arkguardian1_prologue_78:
    speaker: "<Narration>"
    en: The one who desecrated the beautiful white flower, Liliweiss.
    ko: 아름다운 하얀 꽃, 릴리바이스를 모독하는.
    ja: |-
      美しき白い花、
      リリーバイスを踏みにじった…
  event_arkguardian1_prologue_79:
    speaker: "<Narration>"
    en: Kill the Queen, no matter what.
    ko: 퀸을 반드시 죽인다.
    ja: クイーンを、必ず倒す
  event_arkguardian1_prologue_80:
    speaker: "<Narration>"
    en: Snow White closes her eyes and falls asleep.
    ko: 스노우 화이트는 눈을 감고 잠에 들었다.
    ja: スノーホワイトは目を閉じ、眠りに落ちていった
  event_arkguardian1_prologue_81:
    speaker: "<Narration>"
    en: For some reason, she feels as if she's about to dream of the past.
    ko: 어째서인지, 과거의 꿈을 꿀 것만 같다는 생각이 들었다.
    ja: 昔の夢を見るという、予感がした
event_arkguardian1_01_s:
  event_arkguardian1_01_s_1:
    speaker: hongryeon_o
    en: Hath there yet been any word from Lilith or the Commander?
    ko: 릴리스와 지휘관에게서 연락은 아직 없나?
    ja: リリスと指揮官からの知らせは？
  event_arkguardian1_01_s_2:
    speaker: dorothy
    en: Not yet, no.
    ko: 예. 아직 없네요.
    ja: いいえ。まだ何も。
  event_arkguardian1_01_s_3:
    speaker: rapunzel_o
    en: I am worried. It is the first time we've experienced such prolonged silence
      from them.
    ko: 걱정인데요. 이렇게까지 연락이 안 된 적은 처음인데.
    ja: |-
      心配ですね。
      こんなに連絡がないのは初めてです。
  event_arkguardian1_01_s_4:
    speaker: dorothy
    en: I doubt there'll be any trouble. Not with those two.
    ko: 그 둘이니까 큰일은 없겠죠.
    ja: |-
      あの2人のことです、
      心配はいらないでしょう。
  event_arkguardian1_01_s_5:
    speaker: rapunzel_o
    en: That may be true, but considering the circumstances...
    ko: 그건 그렇지만, 시기가 시기잖아요.
    ja: それはそうですが、なにもこんな時に…
  event_arkguardian1_01_s_6:
    speaker: dorothy
    en: We've been staying in contact with the United Forces of Humanity... or rather,
      the Central Government.
    ko: 인류연합군, 아니 중앙 정부에는 계속 연락을 넣고 있는 상태에요.
    ja: |-
      人類連合軍…いえ、中央政府には
      問い合わせを続けています。
  event_arkguardian1_01_s_7:
    speaker: dorothy
    en: They're saying something unexpected came up, so it's hard to get in touch
      with them right now. For the time being, we'll just have to take their word
      for it.
    ko: 돌발 사태가 생겨 지금은 연락하기 힘들다라는 답변만 하고 있는데, 일단은 믿어야죠.
    ja: |-
      緊急事態で連絡はできないとの
      一点張りですが、今は信じるほかありません。
  event_arkguardian1_01_s_8:
    speaker: hongryeon_o
    en: And should they still fail to make their appearance?
    ko: 그러다가 계속 안 오면?
    ja: 戻って来なければどうする？
  event_arkguardian1_01_s_9:
    speaker: dorothy
    en: Then we'll just have to storm in.
    ko: 쳐들어가야죠 뭐.
    ja: 現場に踏み込むしかありません。
  event_arkguardian1_01_s_10:
    speaker: hongryeon_o
    en: Pray, what—
    ko: "…뭣."
    ja: "…おや。"
  event_arkguardian1_01_s_11:
    speaker: rapunzel_o
    en: That's rather bold of you.
    ko: 과감하시네요.
    ja: そこまでですか。
  event_arkguardian1_01_s_12:
    speaker: dorothy
    en: You said it yourself; in light of the current situation, those two are indispensable.
    ko: 라푼젤의 말대로 시기가 시기인 만큼 둘의 존재는 필수적이에요.
    ja: |-
      ラプンツェルの言う通り、
      この状況で2人の存在は不可欠です。
  event_arkguardian1_01_s_13:
    speaker: dorothy
    en: It's obvious the authorities are hamstringing them with political nonsense
      again. If they're just stalling, we should get both of them out ourselves.
    ko: 보나마다 또 쓸데없는 정치적 이슈로 붙잡아두고 있을 게 뻔하니까, 계속 시간을 끈다고 생각되면 데려와야죠.
    ja: |-
      どうせまたくだらない政治的トラブルに
      巻き込まれただけでしょう。
      あまりにも遅ければ引きずり出します。
  event_arkguardian1_01_s_14:
    speaker: hongryeon_o
    en: Methinks thou hast rous'd the slumb'ring beast within thy breast.
    ko: 도로시 자네… 발차기 한번 하더니 야성에 눈을 뜬 모양이군.
    ja: |-
      ドロシー…あの蹴り以来、
      野性に目覚めでもしたか。
  event_arkguardian1_01_s_15:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_16:
    speaker: hongryeon_o
    en: Very well. If the interim chieftain saith so, I have no quarrel.
    ko: 좋네. 임시 두령이 그리 말하면 나도 불만 없네.
    ja: |-
      分かった。臨時とはいえ
      それが頭領の判断なら、私も異論はない。
  event_arkguardian1_01_s_17:
    speaker: dorothy
    en: Don't call me that. It makes us sound like a motley crew of mountain bandits.
    ko: |-
      두령이라고 하지 말라고요.
      우리가 무슨 산적이에요?
    ja: |-
      頭領はやめてください。
      私たちは山賊のたぐいですか？
  event_arkguardian1_01_s_18:
    speaker: hongryeon_o
    en: Alas, this is a most vexing matter indeed.
    ko: 허나 이것 참 곤란하군그래.
    ja: まったく、実に困ったものだ。
  event_arkguardian1_01_s_19:
    speaker: hongryeon_o
    en: Though they did not partake in the battle against Anachiro, that they have
      not so much as revealed their visages till now is an offence most unpardonable.
    ko: |-
      아나키오르 전에 참가하지 않은 건 그렇다 치겠으나,
      아직까지 코빼기도 비추지 않는다는 건 용서할 수 없네.
    ja: |-
      アナキオール戦にも間に合わず、
      いまだに顔すら出さず…
  event_arkguardian1_01_s_20:
    speaker: hongryeon_o
    en: Should they present themselves, I shall chastise them soundly.
    ko: 오면 따끔하게 혼내야겠어.
    ja: 戻ってきたら、少し締め上げてやらねばな。
  event_arkguardian1_01_s_21:
    speaker: dorothy
    en: And how exactly are you planning to scold them?
    ko: 혼내다니 어떻게요?
    ja: できるのですか？
  event_arkguardian1_01_s_22:
    speaker: dorothy
    en: You've already been slammed into the floor and ceiling. There's nowhere left
      for you to get lodged in.
    ko: 바닥이나 천장에는 박혀봤으니 이젠 박힐 곳도 없을 텐데요.
    ja: |-
      地面と天井は経験済みでしょうし、
      めり込む場所ももう
      残っていないと思いますが。
  event_arkguardian1_01_s_23:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_24:
    speaker: rapunzel_o
    en: Speaking of Anachiro,
    ko: 아나키오르 이야기가 나와서 말인데요.
    ja: 名前が出たので、アナキオールの話ですが…
  event_arkguardian1_01_s_25:
    speaker: rapunzel_o
    en: I have a feeling there's more than one Heretic.
    ko: 그 헬레틱이라는 것. 하나만 있을 거라 생각하진 않아요.
    ja: |-
      あのヘレティックと名付けられたもの…
      1体だけでは終わらないはずです。
  event_arkguardian1_01_s_26:
    speaker: dorothy
    en: I agree.
    ko: 저도 동의해요.
    ja: 私も同じ意見です。
  event_arkguardian1_01_s_27:
    speaker: hongryeon_o
    en: What giveth thee such a notion?
    ko: 응? 어째서인가?
    ja: ふむ。なぜだ？
  event_arkguardian1_01_s_28:
    speaker: rapunzel_o
    en: Those fusion experiments I saw in labs where they create the second generation.
    ko: 2세대 분들이 만들어지고 있던 곳에서 봤던 융합체.
    ja: 第2世代の研究所でみた、あの融合体です。
  event_arkguardian1_01_s_29:
    speaker: rapunzel_o
    en: I believe Anachiro was the result of them.
    ko: 그 결과가 아나키오르라고 생각되거든요.
    ja: |-
      アナキオールは、
      あれの成功例と言うべきものでしょう。
  event_arkguardian1_01_s_30:
    speaker: rapunzel_o
    en: They've already cracked the code to fusing Nikkes with Raptures. Anachiro
      must've been their first successful creation.
    ko: |-
      이미 저쪽은 랩쳐와 니케의 융합에 대한 답을 내렸고,
      아나키오르는 첫 완성품인 셈이겠죠.
    ja: |-
      ラプチャーとニケは融合が可能だと実証され、
      最初に完成したものがアナキオール…
  event_arkguardian1_01_s_31:
    speaker: rapunzel_o
    en: And considering how much she's accomplished, there's no way they would stop
      at only one.
    ko: |-
      그렇게 막대한 전과를 낸 개체를,
      하나만 만들고 끝낼 것 같진 않아요.
    ja: |-
      それがあれほどの戦果を挙げたのですから、
      1体でやめてしまうとは考えがたいことです。
  event_arkguardian1_01_s_32:
    speaker: dorothy
    en: Frankly, if three additional Heretics like Anachiro—no, even just two—were
      to show up, humanity wouldn't stand a chance.
    ko: 솔직히 말씀드리면 아나키오르 같은 헬레틱이 셋… 아니 둘만 더 나타나도 인류에게 승산은 없겠죠.
    ja: |-
      正直に言って、あのようなものが3体…
      いえ、2体に増えるだけでも、
      人類はまともに抵抗できなくなるでしょう。
  event_arkguardian1_01_s_33:
    speaker: dorothy
    en: That's precisely why we need Lilith and the Commander.
    ko: 그게 릴리스와 지휘관이 필요한 이유예요.
    ja: リリスと指揮官が必要な理由はそれです。
  event_arkguardian1_01_s_34:
    speaker: dorothy
    en: They're steadily growing stronger, while we're over here wearing ourselves
      down.
    ko: |-
      저쪽은 착실히 전력을 늘려가고 있는데,
      우리는 소모되고 있죠.
    ja: |-
      あちらは着実に戦力を増強する一方で、
      我々は消耗を続けています。
  event_arkguardian1_01_s_35:
    speaker: dorothy
    en: Unless something big happens that can turn the tide,
    ko: 뭔가, 크게 뒤집을만한 게 없는 이상….
    ja: 何か、戦況を一変するような手が打てなければ…
  event_arkguardian1_01_s_36:
    speaker: dorothy
    en: humanity is doomed.
    ko: 인류는 져요.
    ja: 人類は、敗れます。
  event_arkguardian1_01_s_37:
    speaker: hongryeon_o
    en: What manner of talk is this? Did we not achieve victory even without the two
      of them?
    ko: |-
      무슨 소릴 하는겐가.
      둘 없이도 이겼지 않나.
    ja: |-
      ふぬけたことを。
      2人がおらずとも勝ったではないか。
  event_arkguardian1_01_s_38:
    speaker: dorothy
    en: "... Yes, but we had Red Hood with us."
    ko: "…레드 후드가, 있었죠."
    ja: "…レッドフードが、いましたから。"
  event_arkguardian1_01_s_39:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_40:
    speaker: hongryeon_o
    en: Doth thy heart yet yearn for her?
    ko: 그리운가.
    ja: 未練があるのか。
  event_arkguardian1_01_s_41:
    speaker: rapunzel_o
    en: Yes. If I could, I'd find her and bring her back.
    ko: 예. 할 수만 있다면, 다시 찾아오고 싶을 정도로요.
    ja: |-
      そうですね。
      できれば戻ってきてほしいと
      つい考えてしまいます。
  event_arkguardian1_01_s_42:
    speaker: hongryeon_o
    en: Pray, be not thus. She shone brilliantly and departed of her own free will,
      with no regrets.
    ko: |-
      너무 그러지 말게.
      미련 없이 다 태우고 간 친구일세.
    ja: |-
      あまり引きずってやるな。
      あいつはきれいさっぱり、
      己を燃やし尽くした。
  event_arkguardian1_01_s_43:
    speaker: hongryeon_o
    en: "'Tis unbecoming to linger in such moping."
    ko: 여기서 더 질척거리면 멋이 없지 않은가.
    ja: |-
      我々が枕を濡らしていては、
      心意気が台無しであろう。
  event_arkguardian1_01_s_44:
    speaker: rapunzel_o
    en: Moping?
    ko: 질척….
    ja: 濡らす…！？
  event_arkguardian1_01_s_45:
    speaker: hongryeon_o
    en: Snow White herself hath maintained a most admirable composu—
    ko: 그 스노우 화이트도 잘 참고 있….
    ja: あのスノーホワイトも、よく我慢して…
  event_arkguardian1_01_s_46:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_47:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_48:
    speaker: hongryeon_o
    en: Doth she remain as she was?
    ko: 아직 그대로인가? 스노우 화이트는?
    ja: 相変わらずかい？スノーホワイトは。
  event_arkguardian1_01_s_49:
    speaker: rapunzel_o
    en: Yes...
    ko: "…예."
    ja: "…ええ。"
  event_arkguardian1_01_s_50:
    speaker: rapunzel_o
    en: She spends all her time in the workshop and barely comes out.
    ko: 틈만 나면 공방에 들어가서 나오지 않고 있어요.
    ja: 何かと理由をつけて、工房にこもりきりです。
  event_arkguardian1_01_s_51:
    speaker: rapunzel_o
    en: I suppose she still hasn't gotten over it.
    ko: 아직 완전히 떨쳐내진 못한 거겠죠.
    ja: |-
      まだ完全に心残りが無いとは
      言い切れないのでしょう。
  event_arkguardian1_01_s_52:
    speaker: rapunzel_o
    en: I can understand how she feels. It's never easy to forget those we've lost.
    ko: |-
      저도 그렇거든요.
      떠나보낸 분들을 잊기가 쉽지 않아요.
    ja: |-
      私にはよく分かります。
      見送った方のことは、
      そう簡単に忘れられません。
  event_arkguardian1_01_s_53:
    speaker: rapunzel_o
    en: Especially considering it's someone she trusted and admired so deeply... it's
      only natural she feels this way.
    ko: |-
      하물며 가장 믿고 따랐던 분이 그렇게 떠났으니…
      이해가 안 가는 건 아니죠.
    ja: |-
      それも、彼女にとっては
      誰より慕っていた方ですから…
  event_arkguardian1_01_s_54:
    speaker: dorothy
    en: All we can do is give her time.
    ko: 시간을 주는 수밖에 없겠죠.
    ja: 時間をあげるしかありません。
  event_arkguardian1_01_s_55:
    speaker: dorothy
    en: Since we can't truly know what it feels like to lose someone so precious.
    ko: 소중한 이를 떠나보낸다는 게, 어떤 기분일지 저희는 모르니까.
    ja: |-
      大切な人を送り出すということが、
      どのような気持ちになるものか…
      私たちには計り知れませんから。
  event_arkguardian1_01_s_56:
    speaker: hongryeon_o
    en: I know well how it feels.
    ko: 나는 아네.
    ja: 私は知っている。
  event_arkguardian1_01_s_57:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_58:
    speaker: hongryeon_o
    en: I needs must have a word with her.
    ko: 한마디 해줘야겠어.
    ja: ひとこと言ってやらねば。
  event_arkguardian1_01_s_59:
    speaker: dorothy
    en: Leave her be. She needs some time alone.
    ko: 관둬요. 혼자만의 시간을 가지게 해 줘야….
    ja: |-
      やめてあげてください。
      彼女にも一人だけの時間が…
  event_arkguardian1_01_s_60:
    speaker: hongryeon_o
    en: Art thou so soon forgetful of thy own utterance?
    ko: 자네 좀 전에 자네가 했던 말도 기억하지 못하는 건가.
    ja: |-
      たった今、自分が言ったことも
      忘れてしまったか？
  event_arkguardian1_01_s_61:
    speaker: hongryeon_o
    en: We require every able-bodied soul we can gather forthwith, even if just one.
    ko: 우리는 하나라도 더 많은 인재가 필요해.
    ja: 一人でも多くの手が必要なのだろう。
  event_arkguardian1_01_s_62:
    speaker: hongryeon_o
    en: Though it may strike harsh, now is assuredly not the hour for succumbing to
      despondency.
    ko: |-
      잔인한 말처럼 들릴지도 모르겠지만,
      실의에 빠져있는 건 지금과는 어울리지 않지.
    ja: |-
      厳しく聞こえるかもしれぬが、
      打ちひしがれている余裕など我々にはない。
  event_arkguardian1_01_s_63:
    speaker: hongryeon_o
    en: So must I press them onward, even by force if need be.
    ko: 그러니 강제로라도 등을 떠밀어야 해.
    ja: 無理やりにでも、背中を押してやらねば。
  event_arkguardian1_01_s_64:
    speaker: hongryeon_o
    en: I shall take upon myself the part of villain.
    ko: 내가, 그 악역을 자처하겠다는 걸세.
    ja: |-
      要は、私が憎まれ役を
      買って出てやろうということだ。
  event_arkguardian1_01_s_65:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_s_66:
    speaker: dorothy
    en: Very well. I'll leave that to you.
    ko: 알겠어요. 부탁드려요.
    ja: 分かりました。お任せします。
  event_arkguardian1_01_s_67:
    speaker: dorothy
    en: I'm not confident when it comes to such things.
    ko: 저는 그런 건 자신 없어서.
    ja: そのようなことは、不得手ですので。
  event_arkguardian1_01_s_68:
    speaker: hongryeon_o
    en: Hah. Methought as much.
    ko: 흥. 그럴 것 같았네.
    ja: ふん…そうであろうな。
  event_arkguardian1_01_s_69:
    speaker: dorothy
    en: "... What do you mean by that?"
    ko: "…무슨 의미인가요 그건?"
    ja: "…どういう意味でしょう？"
  event_arkguardian1_01_s_70:
    speaker: hongryeon_o
    en: I take my leave, and shall return anon.
    ko: 다녀오겠네.
    ja: 行ってくる。
event_arkguardian1_01_e:
  event_arkguardian1_01_e_1:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_2:
    speaker: "<Narration>"
    en: "*Bang bang*"
    ko: 쾅 쾅.
    ja: ガンガン！
  event_arkguardian1_01_e_3:
    speaker: "<Narration>"
    en: Scarlet knocks on the firmly shut workshop door with the hilt of her sword.
    ko: 홍련이 검 손잡이로 굳게 닫힌 공방의 문을 두드렸다.
    ja: |-
      紅蓮は固く閉ざされた工房の扉を
      剣の柄で叩いた
  event_arkguardian1_01_e_4:
    speaker: hongryeon_o
    en: Is there any within?
    ko: 있는가.
    ja: いるかい？
  event_arkguardian1_01_e_5:
    speaker: "<Narration>"
    en: Only the sound of machinery can be heard from beyond the door.
    ko: 문 너머에서는 기계음만 들려온다.
    ja: 扉の向こうからは機械の音だけが聞こえてくる
  event_arkguardian1_01_e_6:
    speaker: "<Narration>"
    en: "*Bang bang*"
    ko: 쾅 쾅.
    ja: ガンガン！
  event_arkguardian1_01_e_7:
    speaker: "<Narration>"
    en: Scarlet knocks a little harder.
    ko: 홍련이 검 손잡이로 굳게 닫힌 공방의 문을 조금 더 세게 두드린다.
    ja: |-
      紅蓮は固く閉ざされた工房の扉を
      剣の柄でさらに強く叩いた
  event_arkguardian1_01_e_8:
    speaker: hongryeon_o
    en: Snow White. Art thou within? 'Tis I.
    ko: 스노우 화이트. 있는가. 나일세.
    ja: スノーホワイト。いるのだろう。
  event_arkguardian1_01_e_9:
    speaker: "<Narration>"
    en: As before, all that can be heard is the sound of machinery.
    ko: 문 너머에서는 기계음만 들려온다.
    ja: 相変わらず、機械音しか聞こえてこない
  event_arkguardian1_01_e_10:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_11:
    speaker: hongryeon_o
    en: Hmm, this situation doth offer scant hope unto my heart...
    ko: 음. 이렇게 나오면 나도 자신 없네만….
    ja: ふむ…そうなると、私も得意ではないが…
  event_arkguardian1_01_e_12:
    speaker: "<Narration>"
    en: Scarlet takes a deep breath and grips the hilt of her sword, preparing to
      strike the door with even greater force.
    ko: |-
      홍련은 가볍게 심호흡을 한 다음,
      좀 더 문을 세게 두드리기 위해 검 손잡이를 거머쥐었다.
    ja: |-
      紅蓮は軽く深呼吸をした後、
      剣の柄を強く握り直した
  event_arkguardian1_01_e_13:
    speaker: "<Narration>"
    en: She raises her hand and swings it down at the door.
    ko: 손을 들어 올리고, 문을 향해 내리친다.
    ja: |-
      扉に向かって、振り上げた手を
      勢いよく下ろそうとすると…
  event_arkguardian1_01_e_14:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  event_arkguardian1_01_e_15:
    speaker: snowwhite_o
    en: I'm comin—
    ko: 예 나가ㅇ….
    ja: はい、なんですか…
  event_arkguardian1_01_e_16:
    speaker: hongryeon_o
    en: Heavens!
    ko: 엇.
    ja: むっ。
  event_arkguardian1_01_e_17:
    speaker: "<Narration>"
    en: "*Smack*"
    ko: 빠악-
    ja: ベシッ！！
  event_arkguardian1_01_e_18:
    speaker: "<Narration>"
    en: As Scarlet swings her sword to knock on the door once more, the hilt smacks
      Snow White square in the forehead.
    ko: 문을 두드리려던 홍련의 검 손잡이 끝이 스노우 화이트의 이마를 내려찍는다.
    ja: |-
      扉を叩こうとした紅蓮の剣の柄が、
      スノーホワイトの額に当たった
  event_arkguardian1_01_e_19:
    speaker: snowwhite_o
    en: Agh!
    ko: 으악!
    ja: あだっ！
  event_arkguardian1_01_e_20:
    speaker: hongryeon_o
    en: What meaneth this?
    ko: 아니 이게 무슨.
    ja: なんと間の悪い。
  event_arkguardian1_01_e_21:
    speaker: snowwhite_o
    en: Th-that's precisely what I was going to ask you! What in the world are you
      doing?!
    ko: |-
      제, 제가 할 말인데요!
      무슨 짓이에요 이게!
    ja: |-
      な、なんですかいきなり！？
      何のつもりですか！？
  event_arkguardian1_01_e_22:
    speaker: hongryeon_o
    en: Well, regarding that...
    ko: 그게 말일세, 음.
    ja: いや、そのつもりはなかったのだ。
  event_arkguardian1_01_e_23:
    speaker: hongryeon_o
    en: What possessed thee to fling the door wide open so suddenly?
    ko: 갑자기 문을 열면 어떡하는가.
    ja: 急に扉を開けた君が悪い。
  event_arkguardian1_01_e_24:
    speaker: snowwhite_o
    en: Because you knocked!
    ko: 홍련이 노크했잖아요!
    ja: ノックしたのはそっちじゃないですか！
  event_arkguardian1_01_e_25:
    speaker: hongryeon_o
    en: Hadst thou opened it sooner, no harm would have befallen any.
    ko: 진즉에 열면 아무도 안 다치고 끝났을 일일세.
    ja: |-
      さっさと開けていれば、
      痛い目を見ずに済んだものを。
  event_arkguardian1_01_e_26:
    speaker: snowwhite_o
    en: Ugh... What is it? What do you want?
    ko: 씨이… 왜요. 무슨 일이신데요.
    ja: もう…それで、何の用ですか？
  event_arkguardian1_01_e_27:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_28:
    speaker: hongryeon_o
    en: Come, let us enter. I must have a word with thee.
    ko: 들어가서 얘기 좀 하세.
    ja: 中で話そう。
  event_arkguardian1_01_e_29:
    speaker: "<Narration>"
    en: Scarlet walks past Snow White and steps into the workshop.
    ko: 홍련이 스노우 화이트를 지나쳐 공방 안으로 들어갔다.
    ja: |-
      紅蓮がスノーホワイトの脇をすり抜け、
      工房の中へ入ろうとした
  event_arkguardian1_01_e_30:
    speaker: snowwhite_o
    en: H-hey, wait!
    ko: 어? 자, 잠깐만요.
    ja: えっ？ま、待ってください。
  event_arkguardian1_01_e_31:
    speaker: snowwhite_o
    en: A-at least let me make some room for you...
    ko: 바, 발 디딜 곳 정도는 만들어놔야….
    ja: さ、先に足の踏み場を作らないと…
  event_arkguardian1_01_e_32:
    speaker: "<Narration>"
    en: Scarlet's previously determined steps begin to falter.
    ko: 성큼성큼 걸어가던 홍련의 발걸음이 신중해진다.
    ja: 紅蓮の足取りはおのずと遅くなった
  event_arkguardian1_01_e_33:
    speaker: "<Narration>"
    en: The spacious workshop is cluttered with countless tools and weapons, leaving
      barely any space to walk.
    ko: 스노우 화이트의 말대로 넓은 공방은 멀쩡히 발 디딜 곳 하나 없이 각종 장비와 무기들로 가득 차 있다.
    ja: |-
      スノーホワイトの言う通り、
      広い工房が、足の踏み場もないほどの
      装備や武器であふれかえっていたのだ
  event_arkguardian1_01_e_34:
    speaker: "<Narration>"
    en: Eventually, Scarlet stops in her tracks.
    ko: 결국 홍련은 자리에 멈춰 섰다.
    ja: 結局、紅蓮は途中で進むことを諦めた
  event_arkguardian1_01_e_35:
    speaker: snowwhite_o
    en: You could have told me you were coming to visit.
    ko: 오시기 전에 말이라도 좀 해주던가요.
    ja: 来る前にひとこと言ってください。
  event_arkguardian1_01_e_36:
    speaker: hongryeon_o
    en: Had I done so, thou wouldst have striven to avoid me.
    ko: 그랬으면 피했을 것 아닌가.
    ja: それでは避けられてしまうであろう？
  event_arkguardian1_01_e_37:
    speaker: snowwhite_o
    en: "... Huh?"
    ko: |-
      …?
      예?
    ja: |-
      …？
      はい？
  event_arkguardian1_01_e_38:
    speaker: hongryeon_o
    en: I've heard from Rapunzel and Dorothy.
    ko: 라푼젤과 도로시에게 얘기 들었네.
    ja: ラプンツェルとドロシーから聞いた。
  event_arkguardian1_01_e_39:
    speaker: hongryeon_o
    en: Since the departure of Red Hood, thou hast sequester'd thyself within the
      workshop, refusing to leave forthwith.
    ko: 레드 후드가 떠난 이후 공방에 틀어박혀서 나오지 않고 있다고.
    ja: |-
      レッドフードが去ってからというもの、
      ずっと工房に閉じこもっているとな。
  event_arkguardian1_01_e_40:
    speaker: hongryeon_o
    en: I do not claim to ken what lieth within thy heart, yet now is not the time
      for—
    ko: "…내 자네의 마음을 전부 아는 것은 아니네만, 지금은 그럴 때가 아…."
    ja: |-
      …気持ちは分からなくもないが、
      今はそのような時では…
  event_arkguardian1_01_e_41:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_42:
    speaker: "<Narration>"
    en: As Scarlet scans around the workshop, her gaze settles on one particular spot.
    ko: 공방을 둘러보던 홍련의 시선이 한곳에 멈췄다.
    ja: 工房を見まわす紅蓮の目が止まった
  event_arkguardian1_01_e_43:
    speaker: "<Narration>"
    en: There, two uniforms painted white are visible.
    ko: 하얀색으로 칠해진 두 개의 복장.
    ja: 白を基調とした2着の衣装
  event_arkguardian1_01_e_44:
    speaker: "<Narration>"
    en: The figures of the mannequins dressed in them are strangely familiar.
    ko: 그 복장을 걸치고 있는 마네킹의 체형이 익숙하다.
    ja: |-
      着ているマネキンの体形で、
      紅蓮には誰のものか見分けがつく
  event_arkguardian1_01_e_45:
    speaker: "<Narration>"
    en: Scarlet continues to speak, her gaze never leaving the outfits.
    ko: 홍련은 그 복장들에서 눈을 떼지 않은 채 말했다.
    ja: 紅蓮はそれを注視したまま、口を開いた
  event_arkguardian1_01_e_46:
    speaker: hongryeon_o
    en: "... What be these, then?"
    ko: "…뭔가 이건."
    ja: "…何だい？あれは。"
  event_arkguardian1_01_e_47:
    speaker: snowwhite_o
    en: Oh, those... I was planning on showing them to you once they were finished.
    ko: 아, 그… 완성되면 보여드리려고 했는데.
    ja: |-
      あっ、それは…完成してから
      見せるつもりだったのに。
  event_arkguardian1_01_e_48:
    speaker: hongryeon_o
    en: "... Art these new outfits for Rapunzel and myself?"
    ko: "…나와 라푼젤의 새로운 옷인가?"
    ja: "…私とラプンツェルのものか？"
  event_arkguardian1_01_e_49:
    speaker: snowwhite_o
    en: More like equipment than an outfit.
    ko: 옷… 이라기보단 장비에 가깝지만요.
    ja: 服…というか、装備というか。
  event_arkguardian1_01_e_50:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_51:
    speaker: "<Narration>"
    en: Scarlet carefully walks closer and gently touches the brim of the hat.
    ko: 홍련이 조심스럽게 걸어가 걸려있는 갓을 어루만진다.
    ja: 紅蓮はゆっくりと進み、笠に触れた
  event_arkguardian1_01_e_52:
    speaker: hongryeon_o
    en: "... How splendid."
    ko: "…멋지군."
    ja: "…見事だ。"
  event_arkguardian1_01_e_53:
    speaker: snowwhite_o
    en: Do you like it?
    ko: 마음에 드세요?
    ja: 気に入ってもらえました？
  event_arkguardian1_01_e_54:
    speaker: hongryeon_o
    en: Very much so.
    ko: 그렇다네.
    ja: ああ。
  event_arkguardian1_01_e_55:
    speaker: snowwhite_o
    en: Hehe, I'm glad.
    ko: 헤헤. 다행이네요.
    ja: えへへ。よかったです。
  event_arkguardian1_01_e_56:
    speaker: hongryeon_o
    en: But what possessed thee to make these?
    ko: 허나 이걸 왜 갑자기….
    ja: しかし、どうしてこれを…
  event_arkguardian1_01_e_57:
    speaker: snowwhite_o
    en: Well... the battle's going to get a lot tougher from here on out.
    ko: 그야… 이제부터 더 힘든 싸움이 될 테니까요.
    ja: |-
      だって…これからもっと
      つらい戦いになりますから。
  event_arkguardian1_01_e_58:
    speaker: snowwhite_o
    en: Red Hood's gone, and we don't know when Lilith will return.
    ko: 레드 후드도 없고, 릴리스 언니도 언제 돌아올지 모르겠고.
    ja: |-
      レッドフードもいないし、
      リリスお姉ちゃんもいつ戻るか分からないし。
  event_arkguardian1_01_e_59:
    speaker: snowwhite_o
    en: And there could be another Heretic like Anachiro out there.
    ko: "…아나키오르 같은, 헬레틱이 또 나타날지도 모르잖아요."
    ja: |-
      …アナキオールみたいな、
      ヘレティックがまた出てくるかもしれません。
  event_arkguardian1_01_e_60:
    speaker: snowwhite_o
    en: We have to be ready.
    ko: 우리도 준비를 해놔야죠.
    ja: 私たちも準備しておかないと。
  event_arkguardian1_01_e_61:
    speaker: hongryeon_o
    en: Snow White...
    ko: "…자네."
    ja: "…君。"
  event_arkguardian1_01_e_62:
    speaker: snowwhite_o
    en: Wh-why are you looking at me like that?
    ko: 왜, 왜 그렇게 빤히 바라보세요?
    ja: な、なんでそんなに見つめるんですか？
  event_arkguardian1_01_e_63:
    speaker: hongryeon_o
    en: Thou art not mired in despair, then.
    ko: 실의에 빠져 있는 게 아니었군.
    ja: 落ち込んでいるわけではなかったのか。
  event_arkguardian1_01_e_64:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_65:
    speaker: snowwhite_o
    en: I am filled with sorrow.
    ko: 빠져 있어요.
    ja: 落ち込んではいますけど。
  event_arkguardian1_01_e_66:
    speaker: snowwhite_o
    en: I miss Red Hood. I miss her so much already.
    ko: |-
      레드 후드가 그리워요.
      벌써 보고 싶고요.
    ja: |-
      レッドフードに会いたいです。
      今だって。
  event_arkguardian1_01_e_67:
    speaker: snowwhite_o
    en: But even so...
    ko: 그래도….
    ja: でも…
  event_arkguardian1_01_e_68:
    speaker: snowwhite_o
    en: I said everything I wanted to say. We parted on good terms.
    ko: 하고 싶은 말도 다 했고, 잘 이별했으니까요.
    ja: |-
      言いたいことも全部言って、
      ちゃんとお別れも済ませたんですから。
  event_arkguardian1_01_e_69:
    speaker: snowwhite_o
    en: I can't afford to wallow in despair.
    ko: 실의에 빠져 있을 수만은 없죠.
    ja: 落ち込んでばかりいられません。
  event_arkguardian1_01_e_70:
    speaker: hongryeon_o
    en: Art thou burying that sorrow deep within thy bosom and continuing on thy path?
    ko: 슬픔은 가슴에 묻고, 발걸음을 내딛는 것인가.
    ja: 悲しみを胸に、歩き出しているというのか。
  event_arkguardian1_01_e_71:
    speaker: snowwhite_o
    en: Well... I wouldn't go as far as to put it that way.
    ko: 뭐어… 그렇게까지 거창하게 얘기할 건 아닌 것 같지만요.
    ja: |-
      うーん…そんなカッコいい話じゃ
      ないと思いますけど。
  event_arkguardian1_01_e_72:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_73:
    speaker: hongryeon_o
    en: Methinks I have regarded thee far too much as a child, and unfairly so.
    ko: 이거… 아무래도 너무 아이로 본 모양이야.
    ja: これは…子どもだとばかり思っていたが…
  event_arkguardian1_01_e_74:
    speaker: snowwhite_o
    en: What?
    ko: 예?
    ja: はい？
  event_arkguardian1_01_e_75:
    speaker: hongryeon_o
    en: N-never mind. Think naught of it.
    ko: 아니. 아무것도 아닐세.
    ja: いや、気にすることはない。
  event_arkguardian1_01_e_76:
    speaker: hongryeon_o
    en: In any case, about these attires...
    ko: 그런데, 이 복장 말일세.
    ja: ところで、この装束…
  event_arkguardian1_01_e_77:
    speaker: hongryeon_o
    en: What of Dorothy and Liliweiss? Are there none for them? Dost thou lack one
      too?
    ko: 도로시와 릴리바이스의 것은 없는 겐가? 자네 것도 없지 않나.
    ja: |-
      ドロシーとリリーバイスの分はないのかい？
      君自身の分もないようだ。
  event_arkguardian1_01_e_78:
    speaker: snowwhite_o
    en: Ah, yes. I figured I should start with the ones that have the highest priority...
    ko: 아, 예. 아무래도 우선순위가 높은 쪽부터 제작하는 게….
    ja: あ、はい。とりあえず優先順位が高いほうから…
  event_arkguardian1_01_e_79:
    speaker: hongryeon_o
    en: Lo!
    ko: 오.
    ja: ほう？
  event_arkguardian1_01_e_80:
    speaker: hongryeon_o
    en: By those very words, thou dost acknowledge that I surpass Dorothy in strength.
    ko: 그 말은 역시, 자네도 내가 도로시보다 강하다는 것을 인정한다는 게로군.
    ja: |-
      それはつまり、ドロシーよりも私の方が
      戦力として優先ということか。
  event_arkguardian1_01_e_81:
    speaker: hongryeon_o
    en: Haha. A fine jest, but if thou were to attend first to us, how sorely disappointed
      would the others be?
    ko: |-
      하하. 이것 참.
      그렇다고 우리부터 챙겨주면 다른 이들은 얼마나 섭섭하겠나.
    ja: |-
      ふ、これはこれは…
      他の者たちを悔しがらせてしまいそうだねぇ。
  event_arkguardian1_01_e_82:
    speaker: snowwhite_o
    en: Ah... I actually started with the ones who take the most damage or are frequently
      injured...
    ko: 그… 피격 횟수랑 부상 빈도가 높은 쪽부터….
    ja: その…被弾と負傷が多い順で…
  event_arkguardian1_01_e_83:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_84:
    speaker: snowwhite_o
    en: I... I'm sorry.
    ko: 죄, 죄송해요.
    ja: す、すみません。
  event_arkguardian1_01_e_85:
    speaker: hongryeon_o
    en: "... Nay, 'tis no matter. All is well."
    ko: "…아닐세. 괜찮네."
    ja: "…いや、構わぬ。"
  event_arkguardian1_01_e_86:
    speaker: hongryeon_o
    en: But pray, whose foolishly large firearm be that?
    ko: 그런데, 이 바보같이 큰 총은 누구의 것인가?
    ja: それより、こちらのやたらと大きな銃は？
  event_arkguardian1_01_e_87:
    speaker: hongryeon_o
    en: None among us would rightly wield such.
    ko: 우리 중에 이걸 사용할 이는 없을텐데….
    ja: これを使いそうな者は誰もいないと思うが…
  event_arkguardian1_01_e_88:
    speaker: snowwhite_o
    en: Oh, that's...
    ko: 아… 그건….
    ja: ああ…それは…
  event_arkguardian1_01_e_89:
    speaker: snowwhite_o
    en: "... I made a promise to someone that I'd make something special for her."
    ko: "…약속했거든요. 꼭 만들어서 선물해 주기로."
    ja: |-
      …約束したんです。
      必ず作って、プレゼントするって。
  event_arkguardian1_01_e_90:
    speaker: snowwhite_o
    en: So, I've been working on it whenever I can.
    ko: 그래서 틈날 때마다 만들고 있어요.
    ja: だから、時間を見つけて作ってます。
  event_arkguardian1_01_e_91:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_92:
    speaker: hongryeon_o
    en: Though the recipient remains unknown to me, yet they are the luckiest soul
      in all the world.
    ko: 누군지는 모르겠으나, 세상 제일 가는 행운아로군.
    ja: 誰だか知らぬが、世界一の果報者だな。
  event_arkguardian1_01_e_93:
    speaker: hongryeon_o
    en: To be the beneficiary of a weapon crafted by the most accomplished artisan.
    ko: 최고의 명장이 손수 만들어주는 무기를 선물 받다니 말일세.
    ja: |-
      最高の職人が手掛けた武器を
      贈ってもらえるとは。
  event_arkguardian1_01_e_94:
    speaker: snowwhite_o
    en: Hehe, you flatter me.
    ko: 헤헤. 뭘요.
    ja: えへへ…大げさですよ。
  event_arkguardian1_01_e_95:
    speaker: rapunzel_o
    en: There you are.
    ko: 오셨나요.
    ja: どうでしたか？
  event_arkguardian1_01_e_96:
    speaker: dorothy
    en: That was quick. You did get a chance to talk some sense into her, right?
    ko: |-
      금방 왔네요.
      아무 말도 못 하고 온 건 아니죠?
    ja: |-
      早かったですね。
      まさか、何も言えずに出てきたのですか？
  event_arkguardian1_01_e_97:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_98:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_99:
    speaker: dorothy
    en: "*Sigh...* This won't do. As the acting leader, I'll—"
    ko: |-
      하아… 안 되겠네요.
      일단은 임시 리더인 제가….
    ja: |-
      はぁ…仕方ありません。
      ここは臨時的なリーダーの私が…
  event_arkguardian1_01_e_100:
    speaker: hongryeon_o
    en: Thou shalt not treat Snow White as a child!
    ko: 스노우 화이트를! 아이 취급하지 마시게!
    ja: いいや！子ども扱いなど無礼だ！
  event_arkguardian1_01_e_101:
    speaker: dorothy
    en: You startled me! Why are you yelling all of a sudden? What's gotten into you?
    ko: 깜짝이야. 왜 갑자기 소리를 지르시나요? 정신이 나가버린 건가요?
    ja: |-
      なんですか？急に大声など上げて。
      何か気に入らないことでも？
  event_arkguardian1_01_e_102:
    speaker: hongryeon_o
    en: Snow White is... Snow White is...!
    ko: 스노우 화이트는…! 스노우 화이트는…!
    ja: スノーホワイトは…！彼女は…！
  event_arkguardian1_01_e_103:
    speaker: hongryeon_o
    en: Fie!
    ko: 후우…!
    ja: "…はぁ…！"
  event_arkguardian1_01_e_104:
    speaker: hongryeon_o
    en: Dorothy, prithee, step out and spar with me for a moment.
    ko: 도로시. 잠시 나와 상대 좀 해주시게.
    ja: ドロシー、軽く相手をしてはもらえまいか。
  event_arkguardian1_01_e_105:
    speaker: hongryeon_o
    en: My blood fulminates within me, and I must needs quell it.
    ko: 이 달아오른 몸을 어떻게든 좀 식혀야겠네.
    ja: ほてった身体を冷ましたい。
  event_arkguardian1_01_e_106:
    speaker: rapunzel_o
    en: Wh-what?
    ko: 뭐, 뭐라고요?
    ja: ほ、ほてった身体…？
  event_arkguardian1_01_e_107:
    speaker: hongryeon_o
    en: With all haste, before this fire within me fades.
    ko: 어서. 이 열기가 식기 전에.
    ja: 早く、この熱が冷めぬうちに。
  event_arkguardian1_01_e_108:
    speaker: dorothy
    en: Uh, no thanks.
    ko: 아. 저는 됐어요.
    ja: いいえ、遠慮しておきます。
  event_arkguardian1_01_e_109:
    speaker: dorothy
    en: The one thing I hate the most is getting sweaty.
    ko: 땀 흘리는 건 질색이라서요.
    ja: 汗をかきたくありませんので。
  event_arkguardian1_01_e_110:
    speaker: hongryeon_o
    en: Very well, then stand thee still. I shall see to the rest myself.
    ko: 그럼 자네는 가만히 있게. 내가 다 알아서 할 테니.
    ja: |-
      別に動かなくても構わないぞ？
      私ひとりで勝手にやる。
  event_arkguardian1_01_e_111:
    speaker: rapunzel_o
    en: Oh my!
    ko: 어머 어머.
    ja: え、えっ…！？
  event_arkguardian1_01_e_112:
    speaker: dorothy
    en: Count me out. You're good at playing by yourself, so why don't you do that
      instead?
    ko: 됐어요. 혼자 노는 거 잘하시잖아요. 혼자 노시죠.
    ja: |-
      結構です。一人遊びがお得意なのですか？
      それでしたら、お一人でどうぞ。
  event_arkguardian1_01_e_113:
    speaker: rapunzel_o
    en: "*Gasp* P-playing by herself? How could you say such a thing!"
    ko: 혼, 혼자 놀…! 어떻게 그런…! 하악 하악…!
    ja: |-
      ひ、ひとりで…！？そんなこと…！
      はあ、はあ…！
  event_arkguardian1_01_e_114:
    speaker: hongryeon_o
    en: Very well, I shall contend alone; do but grant me thine audience.
    ko: 그럼 혼자 할 테니 봐주기라도 하게나.
    ja: では、好き勝手にやらせてもらおうか…
  event_arkguardian1_01_e_115:
    speaker: rapunzel_o
    en: Goodness gracious! Such noble... N-no, such indecency!
    ko: 세상, 세상에! 그, 그런 고귀, 아니 망측한…!
    ja: |-
      す、好き勝手に！？
      そ、そんな素晴ら、いえ、いやらしい…！
  event_arkguardian1_01_e_116:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_117:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_01_e_118:
    speaker: dorothy
    en: I suggest you stop talking.
    ko: 더 말하지 않는 게 좋겠어요.
    ja: それ以上はしゃべらないでください。
  event_arkguardian1_01_e_119:
    speaker: hongryeon_o
    en: Aye, that would be best.
    ko: 그러는 게 좋겠네.
    ja: その方が良さそうだ。
  event_arkguardian1_01_e_120:
    speaker: rapunzel_o
    en: Huh? You're not going to keep going? But why? Aww.
    ko: 예? 왜, 왜요? 더 안 하세요? 예?
    ja: |-
      あら？ど、どうかしましたか？
      どうして急に静かになったのでしょう？
event_arkguardian1_02_s:
  event_arkguardian1_02_s_1:
    speaker: liliweiss
    en: "...!"
    ko: 으으음…!
    ja: ううん…
  event_arkguardian1_02_s_2:
    speaker: commander
    en: You're awake.
    ko: 일어났군.
    ja: 目が覚めたか。
  event_arkguardian1_02_s_3:
    speaker: liliweiss
    en: Commander? Where are we?
    ko: 지휘관. 여기 어디예요?
    ja: 指揮官、ここは？
  event_arkguardian1_02_s_4:
    speaker: commander
    en: We're in the repair center.
    ko: 리페어 센터다.
    ja: リペアセンターだ。
  event_arkguardian1_02_s_5:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_s_6:
    speaker: commander
    en: So, what do you think? Is the Central Government's repair facility any different?
    ko: 어떻게, 중앙 정부 본부에 있는 리페어 센터는 뭐가 좀 다른가?
    ja: どうだ、中央政府本部のリペアセンターは？
  event_arkguardian1_02_s_7:
    speaker: commander
    en: Softer beds, perhaps? Or maybe the air is cleaner?
    ko: 침대가 좀 더 푹신푹신하다던가, 공기가 좋다던가.
    ja: ベッドが柔らかいとか、空気がおいしいとか。
  event_arkguardian1_02_s_8:
    speaker: liliweiss
    en: All hospital rooms are the same.
    ko: 병실이 다 똑같은 병실이죠 뭐.
    ja: 病室なんてどこも一緒でしょう。
  event_arkguardian1_02_s_9:
    speaker: "<Narration>"
    en: Liliweiss looks around the quiet room.
    ko: 릴리바이스는 조용한 병실을 둘러보았다.
    ja: リリーバイスは静かにあたりを見回した
  event_arkguardian1_02_s_10:
    speaker: liliweiss
    en: I do like that it's spacious.
    ko: 방은 넓어서 좋네요.
    ja: 広いですね。
  event_arkguardian1_02_s_11:
    speaker: commander
    en: Tell me about it. You could run laps in here.
    ko: |-
      그러게 말이다.
      이 정도면 축구도 하겠어.
    ja: |-
      そうだな。
      ここならサッカーもできそうだ。
  event_arkguardian1_02_s_12:
    speaker: liliweiss
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  event_arkguardian1_02_s_13:
    speaker: commander
    en: Yes?
    ko: 왜.
    ja: 何だ。
  event_arkguardian1_02_s_14:
    speaker: liliweiss
    en: "... What did they say?"
    ko: "…뭐래요?"
    ja: "…なんて言われました？"
  event_arkguardian1_02_s_15:
    speaker: commander
    en: What do you mean?
    ko: 뭐가.
    ja: 何のことかな。
  event_arkguardian1_02_s_16:
    speaker: liliweiss
    en: How much time do I have left?
    ko: 저 얼마나 남았대요?
    ja: 私の時間、あとどれぐらいですか？
  event_arkguardian1_02_s_17:
    speaker: commander
    en: I don't know. For all we know, you could live another hundred years.
    ko: 글쎄. 앞으로 100년은 더 살지 않을까.
    ja: |-
      さあな。
      あと100年は生きられるんじゃないか。
  event_arkguardian1_02_s_18:
    speaker: liliweiss
    en: Don't joke around.
    ko: 장난하지 말고요.
    ja: 真剣な話です。
  event_arkguardian1_02_s_19:
    speaker: commander
    en: I'm just trying to hold onto hope.
    ko: 희망을 얘기한 거야.
    ja: 真剣な希望だ。
  event_arkguardian1_02_s_20:
    speaker: liliweiss
    en: Hope is important.
    ko: 희망은 중요하죠.
    ja: 希望は大事ですね。
  event_arkguardian1_02_s_21:
    speaker: commander
    en: "... Half a year, maybe."
    ko: 길면 반년.
    ja: "…長ければ半年。"
  event_arkguardian1_02_s_22:
    speaker: commander
    en: Less, if you push yourself too hard.
    ko: 몸을 격하게 움직이면 더 짧아질 수도 있다더군.
    ja: 負荷をかければ、それより短くなるらしい。
  event_arkguardian1_02_s_23:
    speaker: liliweiss
    en: I see.
    ko: 그렇군요.
    ja: そうですか。
  event_arkguardian1_02_s_24:
    speaker: liliweiss
    en: So there's really no other way?
    ko: 뭐 다른 방법은 없대요?
    ja: 何か方法は？
  event_arkguardian1_02_s_25:
    speaker: commander
    en: There's no cure.
    ko: 없대.
    ja: ないそうだ。
  event_arkguardian1_02_s_26:
    speaker: commander
    en: Those idiots. They built it without even knowing how to fix it.
    ko: |-
      멍청한 놈들이.
      지들이 만들어놓고 지들이 고칠 줄도 몰라.
    ja: |-
      おかしな奴らだ。
      自分たちで作っておいて、
      直し方も分からないらしい。
  event_arkguardian1_02_s_27:
    speaker: liliweiss
    en: This body was intended for short-term battles after all.
    ko: 애초에 단기 결전용으로 만들어진 바디니까요.
    ja: もともと短期決戦用でしたから。
  event_arkguardian1_02_s_28:
    speaker: liliweiss
    en: The problem is that the war has dragged on for too long.
    ko: 전쟁이 너무 길어진 게 문제겠죠.
    ja: 戦争が長びいていることの方が問題です。
  event_arkguardian1_02_s_29:
    speaker: liliweiss
    en: Do you think we'll be victorious in six months' time?
    ko: 반년 안에 결판이 날까요?
    ja: 半年以内に決着がつくでしょうか？
  event_arkguardian1_02_s_30:
    speaker: commander
    en: Not a chance.
    ko: 절대.
    ja: 不可能だ。
  event_arkguardian1_02_s_31:
    speaker: commander
    en: Losing, though... that's possible.
    ko: 지는 건 가능하겠군.
    ja: 勝ちを捨てない限りはな。
  event_arkguardian1_02_s_32:
    speaker: liliweiss
    en: As expected... The Goddess squad alone can't win such a drawn-out war.
    ko: 역시… 갓데스로는 전쟁에서 이길 순 없었네요.
    ja: やっぱり…ゴッデスでは勝てないみたいですね。
  event_arkguardian1_02_s_33:
    speaker: commander
    en: Sure, we're undefeated, but there are fewer than ten of us in this squad.
    ko: 그래. 백전백승, 무패의 갓데스지만 우린 고작 10명이 채 되지 않아.
    ja: |-
      ああ。いくら百戦百勝、無敗のゴッデスでも、
      我々はたった数人だけだ。
  event_arkguardian1_02_s_34:
    speaker: commander
    en: All we can do now is serve as a symbol of hope for humanity on the battlefield.
    ko: 전쟁이라는 큰 무대에서 우리가 할 수 있는 일이라고는 인류에게 희망을 주는 프로파간다 그 이상도 이하도 아니다.
    ja: |-
      戦争という大きな舞台で我々にできることは、
      人類に希望を与える広告塔の役目だけ、
      それ以上でも以下でもない。
  event_arkguardian1_02_s_35:
    speaker: liliweiss
    en: Well, we certainly pulled that off admirably.
    ko: 그리고 그걸 훌륭히 해냈죠.
    ja: その役目なら、立派に果たせました。
  event_arkguardian1_02_s_36:
    speaker: commander
    en: Yeah... maybe too admirably.
    ko: 그래. 넘치도록 잘 해냈다.
    ja: ああ。十分すぎるほどな。
  event_arkguardian1_02_s_37:
    speaker: commander
    en: We've already become the hope of humanity.
    ko: 이미 우리는 인류의 희망이 되었어.
    ja: 今の私たちは人類の希望だ。
  event_arkguardian1_02_s_38:
    speaker: commander
    en: So you've gotta stay alive.
    ko: 그러니 죽지 마라.
    ja: だから、死ぬな。
  event_arkguardian1_02_s_39:
    speaker: liliweiss
    en: Hehe, I wish it were that simple.
    ko: 후후. 그랬으면 좋겠네요.
    ja: ふふ。そうできればいいですけど。
  event_arkguardian1_02_s_40:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_s_41:
    speaker: liliweiss
    en: I expected this, but it's happening too quickly.
    ko: 예상은 하고 있었지만, 너무 빨라요.
    ja: 予想はしていましたが、早すぎます。
  event_arkguardian1_02_s_42:
    speaker: liliweiss
    en: I wish I'd left something behind for the others.
    ko: 애들에게 뭐라도 남기고 갔으면 좋겠는데 말이죠.
    ja: みんなに何か残しておきたいなぁ。
  event_arkguardian1_02_s_43:
    speaker: commander
    en: Like Red Hood did?
    ko: 레드 후드가 그랬던 것처럼?
    ja: レッドフードのように？
  event_arkguardian1_02_s_44:
    speaker: liliweiss
    en: "... Yeah. When the end starts to draw near, I guess people start thinking
      the same things."
    ko: "…그러게요. 막상 끝이 다가오니까 같은 생각을 하게 되는 것 같아요."
    ja: |-
      …そうですね。終わりが見えた時って、
      誰でも同じことを考えるみたいです。
  event_arkguardian1_02_s_45:
    speaker: commander
    en: If I were to die tomorrow, I wouldn't care what anyone thought.
    ko: 나는 당장 내일 죽는다면 남들 신경 같은 건 안 쓸 거다.
    ja: |-
      私は明日で終わるとなったら、
      周りのことなど考えないぞ。
  event_arkguardian1_02_s_46:
    speaker: commander
    en: What's the point in leaving anything behind? I'm barely able to take care
      of my own matters as it is.
    ko: 남기긴 뭘 남겨. 내 거 챙기기도 바쁠 텐데.
    ja: |-
      何を残すというんだ。
      自分がそれどころじゃないと言うのに。
  event_arkguardian1_02_s_47:
    speaker: liliweiss
    en: So what would you do?
    ko: 그럼 뭐 할 건데요.
    ja: どうするんですか、それじゃあ。
  event_arkguardian1_02_s_48:
    speaker: commander
    en: Let's see... Drink some fine liquor, with a beauty on each arm...
    ko: 글쎄. 좋은 술을 잔뜩 마시고, 양쪽에 미녀를 끼고
    ja: |-
      さあな。いい酒を浴びるほど飲んで、
      両脇に美女を抱えて…
  event_arkguardian1_02_s_49:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_s_50:
    speaker: commander
    en: "... and look back on my life."
    ko: "…내 삶을 되돌아볼 거야. 응."
    ja: "…自分の人生でも振り返るさ、きっと。"
  event_arkguardian1_02_s_51:
    speaker: liliweiss
    en: While you're flanked by two beautiful women?
    ko: 양쪽에 미녀를 끼고요?
    ja: 両脇に美女を抱えて？
  event_arkguardian1_02_s_52:
    speaker: commander
    en: Why not? Every story needs an audience.
    ko: 그래. 청중은 필요하니까.
    ja: ああ。話を聞いてくれる相手は欲しい。
  event_arkguardian1_02_s_53:
    speaker: liliweiss
    en: I hope that wish of yours comes true.
    ko: 꼭 이루세요. 그 소원.
    ja: ぜったいやってください、それ。
  event_arkguardian1_02_s_54:
    speaker: commander
    en: I'm gonna try my best.
    ko: 그러도록 노력해 보지.
    ja: 努力はしよう。
  event_arkguardian1_02_s_55:
    speaker: liliweiss
    en: So, how did the meeting go?
    ko: 그래서, 회의는 잘 끝났어요?
    ja: それで、会議も終わりましたか？
  event_arkguardian1_02_s_56:
    speaker: commander
    en: It hasn't even started yet.
    ko: 아니. 아직 시작도 안 했어.
    ja: いや。まだ始まってもいない。
  event_arkguardian1_02_s_57:
    speaker: liliweiss
    en: Really? Not yet?
    ko: 예? 아직이요?
    ja: えっ？まだ何も？
  event_arkguardian1_02_s_58:
    speaker: commander
    en: Because you collapsed.
    ko: 네가 쓰러졌으니까.
    ja: 君が倒れたからな。
  event_arkguardian1_02_s_59:
    speaker: liliweiss
    en: Is it really necessary for me to attend?
    ko: 저도 꼭 같이 들어야 한대요?
    ja: 私も参加しないとダメなんですか？
  event_arkguardian1_02_s_60:
    speaker: commander
    en: Apparently. They said you had to hear what they had to say too.
    ko: 그래. 너도 꼭 같이 들어야 한다고 하더군.
    ja: そうだ。必ず参加、らしい。
  event_arkguardian1_02_s_61:
    speaker: liliweiss
    en: Uh...
    ko: 어….
    ja: あ…
  event_arkguardian1_02_s_62:
    speaker: liliweiss
    en: I think I know what they're going to bring up.
    ko: 이거 아무래도 그 얘기 하려는 것 같은데요.
    ja: あの話をする気なんですね。
  event_arkguardian1_02_s_63:
    speaker: commander
    en: I think you're right.
    ko: 그래. 나도 그렇게 생각한다.
    ja: おそらくな。私も同じ予想だ。
  event_arkguardian1_02_s_64:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_s_65:
    speaker: liliweiss
    en: No matter where we turn, it looks like the end is coming.
    ko: 끝이 오는군요. 여기저기서.
    ja: 終わりが来てるんですね。あっちもこっちも。
  event_arkguardian1_02_s_66:
    speaker: commander
    en: Yeah, there's nothing we can do about that. It's inevitable.
    ko: 그래. 끝이 오는 건 어쩔 수 없지.
    ja: そうだな。どうしようもないことだ。
  event_arkguardian1_02_s_67:
    speaker: liliweiss
    en: I really don't like it.
    ko: 싫네요 진짜.
    ja: イヤになりますね。
  event_arkguardian1_02_s_68:
    speaker: commander
    en: Me neither.
    ko: 나도 싫다.
    ja: まったくだ。
event_arkguardian1_02_e:
  event_arkguardian1_02_e_1:
    speaker: "<Narration>"
    en: Two days later.
    ko: 이틀 후.
    ja: 2日後
  event_arkguardian1_02_e_2:
    speaker: "<Narration>"
    en: The Commander and Liliweiss walk down the corridor.
    ko: 지휘관과 릴리바이스가 복도를 걷고 있다.
    ja: 指揮官とリリーバイスが廊下を進んでいる
  event_arkguardian1_02_e_3:
    speaker: "<Narration>"
    en: Their steps are quick, shoulders hunched with grim looks on their faces.
    ko: |-
      상체를 앞으로 숙인 채 걷는 빠른 걸음.
      굳은 표정.
    ja: |-
      上体は前に傾き、歩調は足早、
      そして顔には硬い表情が浮かんでいた
  event_arkguardian1_02_e_4:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_5:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_6:
    speaker: liliweiss
    en: Commander.
    ko: 지휘관.
    ja: 指揮官…
  event_arkguardian1_02_e_7:
    speaker: commander
    en: Yes?
    ko: 왜.
    ja: 何だ。
  event_arkguardian1_02_e_8:
    speaker: liliweiss
    en: May I hit that wall? Just once?
    ko: 저 벽 한번 쳐도 될까요?
    ja: 壁、一発だけ叩いちゃダメですか？
  event_arkguardian1_02_e_9:
    speaker: commander
    en: "... No, you can't."
    ko: 아니. 안 돼.
    ja: いや、ダメだ。
  event_arkguardian1_02_e_10:
    speaker: commander
    en: Not until I've had my turn.
    ko: 내가 먼저 할 거니까.
    ja: 私が先にやる。
  event_arkguardian1_02_e_11:
    speaker: "<Narration>"
    en: They come to a stop,
    ko: 둘이 멈춰 선다.
    ja: 2人が立ち止まった
  event_arkguardian1_02_e_12:
    speaker: "<Narration>"
    en: and the Commander proceeds to kick the wall over and over.
    ko: 지휘관이 벽을 향해 마구 발길질을 한다.
    ja: 指揮官が何度も壁を蹴りつけた
  event_arkguardian1_02_e_13:
    speaker: commander
    en: I didn't go through hell! And suffer like a dog! Just for this to happen!
    ko: 내가! 이 꼴 보려고! 그렇게! 개 같이! 구른 줄! 아냐고!
    ja: |-
      私は！こんなことのために！
      犬みたいなマネを…してきたんじゃない！
  event_arkguardian1_02_e_14:
    speaker: "<Narration>"
    en: "*Thud thud thud*"
    ko: 퍽! 퍽! 퍽!
    ja: ドガッ！ドガッ！バキッ！
  event_arkguardian1_02_e_15:
    speaker: "<Narration>"
    en: His military boots leave black skid marks on the white wall.
    ko: 군화 밑창의 자국이 스키드 마크처럼 하얀 벽에 그어진다.
    ja: |-
      白い壁に車のブレーキ痕のような
      軍靴の底の形が残った
  event_arkguardian1_02_e_16:
    speaker: "<Narration>"
    en: After some time,
    ko: 그러기를 한참.
    ja: それはしばらく止まらず…
  event_arkguardian1_02_e_17:
    speaker: "<Narration>"
    en: the Commander drops to his knees, gasping for breath.
    ko: 지휘관은 무릎을 짚고 거친 숨을 몰아쉬었다.
    ja: |-
      やがて指揮官は膝に手をついたまま、
      荒い息を吐いた
  event_arkguardian1_02_e_18:
    speaker: commander
    en: "*Gasp gasp*"
    ko: 후우…! 후우…!
    ja: はぁ…！ふぅ…！
  event_arkguardian1_02_e_19:
    speaker: liliweiss
    en: Are you finished?
    ko: 다 했나요?
    ja: 終わりました？
  event_arkguardian1_02_e_20:
    speaker: commander
    en: Hah... Yeah...
    ko: 후우…! 그래…!
    ja: ふぅ…！ああ…！
  event_arkguardian1_02_e_21:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 꽈앙-!!
    ja: ドカン――！！
  event_arkguardian1_02_e_22:
    speaker: "<Narration>"
    en: Liliweiss slams her fist into the wall,
    ko: 릴리바이스가 벽에 주먹을 휘두른다.
    ja: リリーバイスが壁に拳を叩きつけた
  event_arkguardian1_02_e_23:
    speaker: "<Narration>"
    en: sending debris flying.
    ko: 벽이 산산조각 나며 부서진다.
    ja: 壁が粉々に砕け散った
  event_arkguardian1_02_e_24:
    speaker: "<Narration>"
    en: Behind where the wall once stood, bewildered Central Government soldiers come
      into view.
    ko: 뚫린 벽 너머로 당황하고 있는 중앙 정부 병사들이 보인다.
    ja: |-
      開いた大穴の向こう側に、
      中央政府の兵士たちの困惑した顔があった
  event_arkguardian1_02_e_25:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_26:
    speaker: liliweiss
    en: Argh... what should I do? I can't shake off my anger.
    ko: 아… 어떡하죠. 화가 안 풀리는데.
    ja: あ…どうしよう。ムカつきすぎてウッカリ。
  event_arkguardian1_02_e_27:
    speaker: commander
    en: Hold it in. If you keep at it, you'll get arrested.
    ko: 참아. 더 이상 하면 잡혀가.
    ja: 我慢しろ。それ以上はいろいろと面倒だ。
  event_arkguardian1_02_e_28:
    speaker: liliweiss
    en: Ah...
    ko: 아….
    ja: あぁ…
  event_arkguardian1_02_e_29:
    speaker: liliweiss
    en: Damn it!
    ko: 아---!!
    ja: ああああ！！
  event_arkguardian1_02_e_30:
    speaker: liliweiss
    en: I can't believe this!
    ko: 아---! 진짜---!!
    ja: もうっ！！本当にっ――！！！
  event_arkguardian1_02_e_31:
    speaker: CGplatoonleader
    en: What the... What's going on here?
    ko: 뭐, 뭐야! 무슨 일이야!
    ja: な、何だ！？緊急事態か！？
  event_arkguardian1_02_e_32:
    speaker: "<Narration>"
    en: The soldiers rush forward, staring wide-eyed at the hole in the wall.
    ko: 중앙 정부의 병사들이 부리나케 달려와 벽에 뚫린 구멍을 바라보았다.
    ja: |-
      あわてて駆けつけた兵士たちの目が
      壁にあいた穴にくぎ付けになった
  event_arkguardian1_02_e_33:
    speaker: "<Narration>"
    en: At first, some glare with hostility, but when they see the Commander and Liliweiss
      standing before them, their expressions change.
    ko: |-
      일부가 험악한 표정으로 바뀌었으나,
      그 앞에 서 있는 릴리바이스와 지휘관을 확인하고 표정이 바뀌었다.
    ja: |-
      険しい顔をしている者もいたが、
      穴の前に立つリリーバイスと指揮官を見て
      表情が変わった
  event_arkguardian1_02_e_34:
    speaker: CGplatoonleader
    en: G-Goddess...!
    ko: 가, 갓데스…!
    ja: ゴ、ゴッデス…！
  event_arkguardian1_02_e_35:
    speaker: "<Narration>"
    en: The platoon leader and his soldiers stand at attention and salute in perfect
      unison.
    ko: 소대장과 병사들이 일제히 절도 있는 경례를 한다.
    ja: 小隊長と兵士たちが一斉に敬礼した
  event_arkguardian1_02_e_36:
    speaker: commander
    en: Huh.
    ko: 아, 음.
    ja: ああ…うむ。
  event_arkguardian1_02_e_37:
    speaker: liliweiss
    en: At ease, gentlemen.
    ko: 수고가 많아요.
    ja: お疲れ様で～す。
  event_arkguardian1_02_e_38:
    speaker: CGplatoonleader
    en: T-to meet a Goddess herself in person...
    ko: 마, 만나!
    ja: おッ、お目に！
  event_arkguardian1_02_e_39:
    speaker: CGplatoonleader
    en: Wh-what an incredible honor! T-truly a great honor indeed!
    ko: 마, 만나 뵙게 되어서 여영광, 영광! 영광!!
    ja: |-
      お、お目にかかれて、
      ここ、光え、光栄…！光栄！！
  event_arkguardian1_02_e_40:
    speaker: commander
    en: What's all this nonsense about honor? What are we, a cult?
    ko: 뭔 영광이 그렇게 많아. 종교도 아니고.
    ja: |-
      光栄が多すぎるな。
      宗教でもあるまいし。
  event_arkguardian1_02_e_41:
    speaker: CGplatoonleader
    en: My apologies, sir! It's just such an honor to meet the people I've always
      admired that I'm all tongue-tied! I shall sever this worthless tongue at once!
    ko: 죄송합니드악! 평소 존경하던 분들을 만나뵙게 되어 혀가 꼬인 모양입니드악! 지금 당장 이 비천한 혀를 자르겠습니드악!
    ja: |-
      申し訳ございませんっ！尊敬する御両名の
      拝顔にあずかり舌がもつれたようです！
      こんな無礼な舌は今すぐ切り落としますっ！
  event_arkguardian1_02_e_42:
    speaker: commander
    en: Ugh... These fanatics are the worst. I can't stand them.
    ko: 아… 난 이런 타입의 팬이 제일 힘들더라.
    ja: あぁ…こういうタイプのファンが一番苦手だ。
  event_arkguardian1_02_e_43:
    speaker: liliweiss
    en: Same here.
    ko: 저도 그래요.
    ja: 同感です。
  event_arkguardian1_02_e_44:
    speaker: CGplatoonleader
    en: It's truly an honor to meet the likes of you two, who have always fought on
      behalf of all humanity.
    ko: |-
      언제나 인류를 위해 힘써주고 계시는 두 분께!
      이렇게 인사를 드릴 수 있어 정말 영광입니드악!
    ja: |-
      人類のために力を尽くされているお二人に！
      お目にかかれるとは誠に光栄でありますっ！
  event_arkguardian1_02_e_45:
    speaker: commander
    en: Well, it's not like we're the only ones fighting.
    ko: 뭘. 우리만 힘쓰고 있는 것도 아닌데.
    ja: 力を尽くしているのは我々だけではない。
  event_arkguardian1_02_e_46:
    speaker: commander
    en: Judging by that insignia, you're a platoon leader. You're doing your part
      too.
    ko: |-
      견장을 보니까 소대장이네.
      그쪽도 열심히 하는구만.
    ja: |-
      その肩章、小隊長だな。
      君も力を尽くしている一人だ。
  event_arkguardian1_02_e_47:
    speaker: CGplatoonleader
    en: Oh no! Compared to the great work you two are doing, my contributions are
      utterly insignificant! I'm pathetic! Worthless! Human garbage!
    ko: 아닙니드악! 두 분이 하는 일에 비하면 제가 하는 일은 하찮고! 보잘것없고! 쓰레기 같은 일일 뿐입니드악!
    ja: |-
      とんでもない！
      お二人のご活躍に比べれば、私の仕事など
      取るに足らないことばかりであります！
  event_arkguardian1_02_e_48:
    speaker: commander
    en: This is exhausting.
    ko: 힘든데 벌써.
    ja: "…もう疲れてきたな…"
  event_arkguardian1_02_e_49:
    speaker: liliweiss
    en: Indeed.
    ko: 그러게요.
    ja: そうですね。
  event_arkguardian1_02_e_50:
    speaker: CGplatoonleader
    en: If I may, could I inquire as to what caused this hole in the wall?
    ko: 실례가 안 된다면! 벽에 난 구멍에 대해 설명을 부탁드려도 되겠습니끄악!
    ja: |-
      差し支えなければ！
      この壁の穴について事情を
      お聞かせ願えますでしょうか！？
  event_arkguardian1_02_e_51:
    speaker: CGplatoonleader
    en: If there's been any inconvenience at all, please tell me, and I'll fix it!
      No matter what it takes!
    ko: 두 분께 어떤 불편 사항이 있었는지 말씀해 주시면! 제가 무슨 수를 쓰더라도 해결하겠습니드악!
    ja: |-
      何なりと問題をご教示いただければ、
      我々があらゆる手を尽くして
      解決いたしますっ！
  event_arkguardian1_02_e_52:
    speaker: commander
    en: Oh, that hole?
    ko: 벽에 이거?
    ja: ああ、これか？
  event_arkguardian1_02_e_53:
    speaker: commander
    en: This big honkin' Mecha Destructor came out of nowhere and smashed a hole in
      the waaallllll—Owww!!
    ko: 갑자기 어디선가 메카 고릴라가 튀어나와서 벽에 구멍을 냈으아아아악!!
    ja: |-
      単にいきなり飛び出したメカゴリラが、
      壁に穴をあけあぁぁっ！？
  event_arkguardian1_02_e_54:
    speaker: commander
    en: Hey. Stop pinching me! Don't you realize how strong you are? That's more like
      a vice than a pinch!
    ko: "…야. 너 꼬집지 좀 마. 네가 꼬집는 게 그냥 꼬집는 건 줄 알아? 아이언 클로가 따로 없다고."
    ja: |-
      …おい。つねらないでくれ。
      肉がちぎれそうだ。
  event_arkguardian1_02_e_55:
    speaker: liliweiss
    en: Well, I can't exactly hit you, can I?
    ko: 때릴 순 없잖아요?
    ja: この壁みたいにはできないでしょう？
  event_arkguardian1_02_e_56:
    speaker: commander
    en: True...
    ko: "…그건, 그렇지."
    ja: "…それは、その通りだが。"
  event_arkguardian1_02_e_57:
    speaker: CGplatoonleader
    en: A... Mecha Destructor?
    ko: 메카… 고릴라 말씀이십니까?
    ja: メカ…ゴリラとおっしゃいましたか？
  event_arkguardian1_02_e_58:
    speaker: CGplatoonleader
    en: Er... isn't that Major Liliweiss's nickname...
    ko: 어… 그건 릴리바이스 소령님의 별명….
    ja: それは…確かリリーバイス少佐の…
  event_arkguardian1_02_e_59:
    speaker: CGplatoonleader
    en: Oh...
    ko: "…아."
    ja: "…あっ。"
  event_arkguardian1_02_e_60:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_61:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_62:
    speaker: CGplatoonleader
    en: M-my apologies, sir! My lips are sealed!
    ko: 죄, 죄송합니드악! 당장 입을 꿰메겠습니드악!
    ja: |-
      も、申し訳ございませんっ！
      今すぐ口を縫いあわせますっ！
  event_arkguardian1_02_e_63:
    speaker: liliweiss
    en: Excuse me, but who told you that?
    ko: 저기, 그 얘기 누구한테 들었나요?
    ja: それ、誰から聞いたの？
  event_arkguardian1_02_e_64:
    speaker: CGplatoonleader
    en: No one told me per se, but an anonymous person started spreading it on the
      Central Government's intranet.
    ko: 어, 어디서 들은 건 아니고 중앙 정부 인트라넷에 익명의 누군가가 적극적으로 전파를….
    ja: |-
      き、聞いたわけではなく…
      中央政府のイントラネットに
      匿名で流布している者がおり…
  event_arkguardian1_02_e_65:
    speaker: CGplatoonleader
    en: They even made emojis and everything.
    ko: 이모티콘도 만들어서 배포하고 그러고 있습니… 다….
    ja: スタンプなども配布されておりまして…その…
  event_arkguardian1_02_e_66:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_67:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_02_e_68:
    speaker: liliweiss
    en: Commander, may I have a word with you?
    ko: 잠깐 시간 좀 내주실래요? 지휘관.
    ja: ちょっとお時間いただけますか？指揮官。
  event_arkguardian1_02_e_69:
    speaker: commander
    en: Stop fooling around, Liliweiss. We don't have any time to spare.
    ko: |-
      바보 같은 소리 하지 마라, 릴리바이스.
      우리에게 남는 시간 같은 게 있을 리가 없다.
    ja: |-
      そんな場合ではないだろう、リリーバイス。
      残された時間は少ないんだ。
  event_arkguardian1_02_e_70:
    speaker: commander
    en: Get it together. We still have work to do.
    ko: |-
      정신 차려라.
      우리에겐 할 일이 있다.
    ja: |-
      些細なことで気をそらすな。
      私たちには使命がある。
  event_arkguardian1_02_e_71:
    speaker: commander
    en: I'm leaving this situation in your hands, platoon leader.
    ko: 그쪽의 소대장. 뒤를 부탁하지.
    ja: そういうわけで小隊長君、あとは頼む！
  event_arkguardian1_02_e_72:
    speaker: "<Narration>"
    en: The Commander walks away with quick, determined steps.
    ko: 지휘관은 빠른 걸음으로 걸어갔다.
    ja: 指揮官が足早にその場を離れた
  event_arkguardian1_02_e_73:
    speaker: liliweiss
    en: If you'll excuse me. I have something to take care of.
    ko: |-
      미안해요. 먼저 가볼게요.
      꼭 해야 할 일이 있어서.
    ja: |-
      悪いけど、ここはお任せします。
      緊急の用件があるので。
  event_arkguardian1_02_e_74:
    speaker: "<Narration>"
    en: Liliweiss follows close behind, matching his stride.
    ko: 그 뒤를 릴리바이스가 빠른 걸음으로 따라간다.
    ja: リリーバイスもすぐさま後を追った
  event_arkguardian1_02_e_75:
    speaker: "<Narration>"
    en: The Commander glances back briefly, then quickens his pace even more.
    ko: 뒤를 힐끔 쳐다본 지휘관의 발걸음이 더욱 빨라진다.
    ja: |-
      後方をちらりと確かめた指揮官が、
      さらに足を速めた
  event_arkguardian1_02_e_76:
    speaker: "<Narration>"
    en: Liliweiss keeps pace, and before long, they're both practically running down
      the corridor.
    ko: 그 뒤를 릴리바이스가 쫒고, 둘은 거의 뛰듯 복도를 걸어간다.
    ja: |-
      リリーバイスがさらに追い上げ、
      2人はほとんど走るような速さで
      廊下を歩き去った
  event_arkguardian1_02_e_77:
    speaker: "<Narration>"
    en: The man watches them as they recede into the distance.
    ko: 소대장은 그 뒷모습을 한참 동안 바라본다.
    ja: |-
      小隊長は、その後ろ姿を
      しばらくの間見つめていた
  event_arkguardian1_02_e_78:
    speaker: CGplatoonleader
    en: So cool...
    ko: "…멋있다 진짜."
    ja: "…かっこいい、本当に…"
event_arkguardian1_03_s:
  event_arkguardian1_03_s_1:
    speaker: "<Narration>"
    en: Oswald watches the stream of people and supplies pouring into the entrance
      of the Ark.
    ko: 오스왈드는 방주 입구로 몰려드는 인파와 물자들을 바라보고 있었다.
    ja: |-
      アークにつながるトンネルの前で、
      オスワルドは押し寄せる人混みと
      物資を眺めていた
  event_arkguardian1_03_s_2:
    speaker: "<Narration>"
    en: The line of people stretches on endlessly as the supply trucks continue rolling
      in.
    ko: |-
      인파의 줄은 끝이 보이지 않을 정도로 이어져 있었고,
      차량들이 실은 물자들이 계속해서 들어온다.
    ja: |-
      最後尾がどこかも分からないほど人が並び、
      物資を積んだ車も続々と到着する
  event_arkguardian1_03_s_3:
    speaker: "<Narration>"
    en: Oswald is suddenly filled with a sense of unease.
    ko: 오스왈드는 갑자기 인지부조화가 왔다.
    ja: |-
      オスワルドはふいに、
      それが現実離れした光景のように感じた
  event_arkguardian1_03_s_4:
    speaker: "<Narration>"
    en: Has there always been this many people and this much supplies in the world?
    ko: 이 세상에 이렇게나 많은 사람과 물자가 있었던가?
    ja: |-
      これほど多くの人間や物資が
      この世界に存在していたのか？
  event_arkguardian1_03_s_5:
    speaker: "<Narration>"
    en: It feels as though everything and everyone on the entire planet has gathered
      here.
    ko: 이 정도면 이미 세상에 있는 모든 사람과 물자가 다 모여든 것 아닐까?
    ja: |-
      この世界の人々と物資が全て
      目の前に集まってきているのではないか？
  event_arkguardian1_03_s_6:
    speaker: "<Narration>"
    en: Glancing back at the procession, Oswald finds the same discomfort washes over
      him once again.
    ko: |-
      오스왈드는 또다시 한동안 행렬을 바라보았다.
      그리고 다시 인지부조화를 느낀다.
    ja: |-
      オスワルドはしばらくの間
      ただ行列を眺め続けた。
      やはり現実離れしているように感じられた
  event_arkguardian1_03_s_7:
    speaker: "<Narration>"
    en: This feels never-ending.
    ko: 끝나지 않는다.
    ja: 終わりが見えない
  event_arkguardian1_03_s_8:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_s_9:
    speaker: "<Narration>"
    en: Oswald feels a sudden wave of dizziness.
    ko: 오스왈드는 갑자기 아찔한 기분을 느꼈다.
    ja: オスワルドは軽いめまいを覚えた
  event_arkguardian1_03_s_10:
    speaker: "<Narration>"
    en: Having admitted defeat, humanity decides to take refuge in the underground
      city known as the Ark.
    ko: 패배를 인정한 인류는 지하 도시 방주로 숨어 들어가기로 결정했다.
    ja: |-
      敗北が決定的となった人類は、
      地下都市、アークへの避難を進めている
  event_arkguardian1_03_s_11:
    speaker: "<Narration>"
    en: The Ark will be sealed through a five-phase process, after which it will never
      open again—neither from the inside nor from the outside.
    ko: |-
      5번에 걸쳐 방주는 완전히 밀봉되며,
      그 이후는 안에서도 밖에서도 열리지 않는다.
    ja: |-
      5段階にわたる封鎖作戦の後、
      アークは内からも外からも
      開くことはなくなる
  event_arkguardian1_03_s_12:
    speaker: "<Narration>"
    en: Despite humanity's defeat, it has managed to survive.
    ko: 인류는 패배하지만 살아남는다.
    ja: 人類は敗れた、だが生き残る
  event_arkguardian1_03_s_13:
    speaker: "<Narration>"
    en: The fate of the entire species hinges upon the success of this operation.
    ko: 말 그대로 인류의 존망이 달려있는 일.
    ja: 言葉通り、人類の存亡がかかっている
  event_arkguardian1_03_s_14:
    speaker: "<Narration>"
    en: As Oswald thinks of his role as the one responsible for sealing the Ark, the
      dizziness returns.
    ko: 오스왈드는 그 방주 밀봉의 총책임자가 된 자신의 처지를 생각하며 다시 한번 아찔함을 느낀다.
    ja: |-
      封鎖計画の総責任者に任命された
      自らの立場を思い起こし、
      オスワルドはまた目がくらみそうになった
  event_arkguardian1_03_s_15:
    speaker: "<Narration>"
    en: On the day of his appointment,
    ko: 방주 밀봉의 총책임자로 임명되던 날.
    ja: 総責任者に任命された日――
  event_arkguardian1_03_s_16:
    speaker: "<Narration>"
    en: he could sense the jealousy hidden behind the smiles of his peers and superiors
      who congratulated him.
    ko: 축하한다며 손을 내미는 동기와 선배들의 웃음 뒤에 숨은 열등감과 질투를 느꼈다.
    ja: |-
      祝辞の言葉とともに手を差し出す
      同期や先輩たちの笑顔の裏には
      劣等感や嫉妬がのぞいていた
  event_arkguardian1_03_s_17:
    speaker: "<Narration>"
    en: But such things no longer matter.
    ko: 하지만 그런 것쯤은 아무래도 좋았다.
    ja: だが、そんなことさえどうでもいい
  event_arkguardian1_03_s_18:
    speaker: "<Narration>"
    en: Once the Ark is sealed, it cannot be reopened, not even from within.
    ko: |-
      방주를 밀봉한다는 말은,
      안에서 열리지 않으며.
    ja: |-
      ひとたびアークの扉が閉ざされれば、
      もはや開くことはできない
  event_arkguardian1_03_s_19:
    speaker: "<Narration>"
    en: Nor can anyone enter it from the outside.
    ko: 밖에서도 들어갈 수 없다는 얘기다.
    ja: |-
      それは同時に、
      入ることもできなくなるという意味だ
  event_arkguardian1_03_s_20:
    speaker: "<Narration>"
    en: After the five-step sealing process, those who come seeking refuge in this
      utopia will find only silent gates greeting them before they perish.
    ko: 5차 밀봉 이후, 방주의 입구를 찾아온 이들은 그저 대답 없는 낙원의 문을 앞에 두고 죽을 뿐이다.
    ja: |-
      第5次閉鎖の後、アークにたどり着いた人々は
      沈黙した救いの舟の扉の前で、
      死に果てていくだろう
  event_arkguardian1_03_s_21:
    speaker: "<Narration>"
    en: When the time comes, Oswald must shut the doors.
    ko: 때가 오면, 오스왈드는 문을 닫아야 한다.
    ja: 時が来れば、自分がその号令を下すことになる
  event_arkguardian1_03_s_22:
    speaker: "<Narration>"
    en: He will have to turn a blind eye to those who come hoping for rescue.
    ko: 희망을 품고 이곳을 찾는 이들을 무시한 채.
    ja: |-
      希望を胸に押し寄せる人々の前で
      扉を閉ざす号令を…
  event_arkguardian1_03_s_23:
    speaker: oswald_o
    en: I'll be an executioner. No... a mass murderer.
    ko: "…사형 집행인이군. 아니, 대량 살인마인가."
    ja: "…死刑の執行人…いや、大量殺人者か。"
  event_arkguardian1_03_s_24:
    speaker: "<Narration>"
    en: He has always followed orders from above, without question.
    ko: 상부의 명령이라면 가리지 않고 무조건 따랐다.
    ja: |-
      今まで上層部の命令には、
      何であろうと従ってきた
  event_arkguardian1_03_s_25:
    speaker: "<Narration>"
    en: Even when those orders require him to dirty his hands, he never refuses or
      disobeys.
    ko: |-
      대부분이 지저분한 일이었지만,
      단 한 번도 거부하거나 항명하지 않았다.
    ja: |-
      ほとんどは汚れ仕事だったが、
      ただの一度も拒否や抗命をしたことはない
  event_arkguardian1_03_s_26:
    speaker: "<Narration>"
    en: After all, all the guilt he felt can simply be passed onto those above him.
    ko: 모든 죄책감은 상부에 떠넘기면 되는 일이었으니까.
    ja: |-
      罪悪感など、すべて上に
      押しつけておけば済む話だ
  event_arkguardian1_03_s_27:
    speaker: "<Narration>"
    en: As a result of his work, he has somehow earned the nickname "Hellhound."
    ko: 그렇게 일을 계속해 온 결과, 어느샌가 헬하운드라는 별명까지 붙어 있었다.
    ja: |-
      そんな態度で仕事を続けた結果が、
      いつしか「地獄の猟犬」という
      あだ名になった
  event_arkguardian1_03_s_28:
    speaker: "<Narration>"
    en: It is a name far from glorious, yet he feels content. After all, it means
      he is being recognized.
    ko: 영광과는 거리가 있는 별명이었지만 만족했다. 인정받는다는 느낌이 들었으니까.
    ja: |-
      栄えある称号にはほど遠いが、満足していた。
      自分の仕事が認められた気がしたからだ
  event_arkguardian1_03_s_29:
    speaker: "<Narration>"
    en: Oswald, the Hellhound, believes no one is more suited than him to be in charge
      of sealing the Ark.
    ko: 헬하운드 오스왈드는 방주 밀봉의 총책임자로서 자신만 한 적임자가 없다고 생각했다.
    ja: |-
      地獄の猟犬たる自分ほど、
      アーク封鎖の総責任者として
      ふさわしい者はいないだろうとさえ考えた
  event_arkguardian1_03_s_30:
    speaker: "<Narration>"
    en: All he has to do is follow orders from his superiors, as he always has.
    ko: 언제나처럼 상부의 명령을 따라, 그대로 이행하기만 하면 되는 일이었으므로.
    ja: |-
      自分はいつものように上の命令に従い、
      職務を遂行するだけ
  event_arkguardian1_03_s_31:
    speaker: "<Narration>"
    en: 'It is simple. He only needs to issue one command: Seal it.'
    ko: 쉬운 일이다. [닫아라]라고만 명령하면 되는 일.
    ja: |-
      何も難しいことはない。
      ただ「封鎖」と一声あげるだけでいい
  event_arkguardian1_03_s_32:
    speaker: "<Narration>"
    en: It's supposed to be an easy task.
    ko: 간단한 일이라고 생각했다.
    ja: 簡単なことだと、考えていた
  event_arkguardian1_03_s_33:
    speaker: "<Narration>"
    en: But then...
    ko: 하지만.
    ja: しかし…
  event_arkguardian1_03_s_34:
    speaker: oswald_o
    en: "... There are too many."
    ko: "…너무 많아."
    ja: "…多すぎる…"
  event_arkguardian1_03_s_35:
    speaker: "<Narration>"
    en: Oswald looks once more at the endless line of people.
    ko: 오스왈드는 다시 한번 끝없이 이어진 사람들의 행렬을 본다.
    ja: |-
      オスワルドは、果てしなく続く人々の行列に
      もう一度目を向けた
  event_arkguardian1_03_s_36:
    speaker: "<Narration>"
    en: How many people are supposed to be allowed into the Ark?
    ko: 방주에 들어올 수 있는 사람의 수가 몇 명이었더라.
    ja: アークの収容可能数は何名だった？
  event_arkguardian1_03_s_37:
    speaker: "<Narration>"
    en: What percentage of the total population is it?
    ko: 전체 인구의 몇 %지?
    ja: それは世界人口の何パーセントだ？
  event_arkguardian1_03_s_38:
    speaker: "<Narration>"
    en: Surely no more than ten percent.
    ko: 모르긴 몰라도 10%도 채 되지 않겠지.
    ja: |-
      正確には知りようもないが、
      10％にも満たないはずだ
  event_arkguardian1_03_s_39:
    speaker: "<Narration>"
    en: No, not even that. Perhaps a single digit, or merely a fraction.
    ko: 10%는 무슨. 한 자릿수, 아니 소수점에 가깝겠지.
    ja: |-
      いや、10％はおろか、一ケタ…
      おそらく小数点に近いだろう
  event_arkguardian1_03_s_40:
    speaker: "<Narration>"
    en: Then what about the rest?
    ko: 그럼 나머지는.
    ja: すると、残りは…
  event_arkguardian1_03_s_41:
    speaker: "<Narration>"
    en: What will happen to them?
    ko: 나머지는 어떻게 되는 거지?
    ja: 残された者たちはどうなる？
  event_arkguardian1_03_s_42:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_s_43:
    speaker: "<Narration>"
    en: Oswald nearly collapses where he stands.
    ko: 오스왈드는 자리에 주저앉을 뻔했다.
    ja: オスワルドは足の力が抜けそうになった
  event_arkguardian1_03_s_44:
    speaker: "<Narration>"
    en: He's sure he won't be able to endure much longer.
    ko: 버틸 수 없을 것 같다는 확신이 들었다.
    ja: 自分には耐えられそうにないという、確信がある
  event_arkguardian1_03_s_45:
    speaker: "<Narration>"
    en: Everything has been planned by his superiors.
    ko: 모든 일의 설계는 상부가 진행했다.
    ja: 計画の策定はすべて上層部が行っている
  event_arkguardian1_03_s_46:
    speaker: "<Narration>"
    en: Everything must proceed as outlined. Even contingency measures are already
      in place.
    ko: |-
      모든 진행은 매뉴얼대로 흘러간다.
      돌발 상황의 대처 방안도 모두 준비되어 있다.
    ja: |-
      すべてが定められたマニュアル通りに流れる。
      不測の事態への対応も
      あらかじめ決められている
  event_arkguardian1_03_s_47:
    speaker: "<Narration>"
    en: But he is the one who must make the decision.
    ko: 하지만 결정은 내가 해야 한다.
    ja: だが、号令するのは自分だ
  event_arkguardian1_03_s_48:
    speaker: "<Narration>"
    en: To abandon the majority of all humankind.
    ko: 인류 대부분을 버린다는 선택을.
    ja: その号令が人類の大部分を切り捨てる
  event_arkguardian1_03_s_49:
    speaker: "<Narration>"
    en: In that moment, he desperately tries to recall who will assist him in sealing
      the Ark.
    ko: 그때 이 방주 밀봉을 도와주는 이가 누구인지 필사적으로 떠올린다.
    ja: |-
      アーク封鎖のために戦っている者たちの姿を
      必死に思い浮かべた
  event_arkguardian1_03_s_50:
    speaker: "<Narration>"
    en: The Goddesses.
    ko: 갓데스.
    ja: ゴッデス
  event_arkguardian1_03_s_51:
    speaker: "<Narration>"
    en: The hope of mankind. The Goddesses of Victory.
    ko: 인류의 희망. 승리의 여신.
    ja: 人類の希望、勝利の女神
  event_arkguardian1_03_s_52:
    speaker: "<Narration>"
    en: They will be assisting him.
    ko: 그들이 함께한다.
    ja: 彼女たちとともに戦う
  event_arkguardian1_03_s_53:
    speaker: "<Narration>"
    en: 'During the sealing of the Ark, the Goddesses will stand guard as part of
      Operation: Ark Guardian.'
    ko: 방주가 밀봉되는 동안, 방주 입구를 지키는 [아크 가디언] 작전에 갓데스가 함께 한다.
    ja: |-
      アーク完全封鎖までの防衛作戦、
      「アークガーディアン」には
      ゴッデスが参加する
  event_arkguardian1_03_s_54:
    speaker: oswald_o
    en: "... Yes, that'll do for now."
    ko: "…그래. 그거면 됐어. 지금은."
    ja: "…そうだ。それでいい。今は。"
  event_arkguardian1_03_s_55:
    speaker: "<Narration>"
    en: That single fact alone keeps Oswald from falling apart.
    ko: 그 사실 하나만이, 오스왈드가 주저앉지 않도록 만들었다.
    ja: その事実だけが、オスワルドを支えていた
  event_arkguardian1_03_s_56:
    speaker: "<Narration>"
    en: Since becoming the one in charge of the sealing operation, Oswald has been
      saved by the Goddesses more times than he can count.
    ko: |-
      밀봉의 총책임자가 된 이후.
      지금까지 수십, 수백 번. 어쩌면 수천 번.
    ja: |-
      封鎖の総責任者となってから、
      数十回、数百回、あるいは数千回…
  event_arkguardian1_03_s_57:
    speaker: "<Narration>"
    en: Dozens, hundreds, perhaps even thousands of times.
    ko: 오스왈드는 갓데스에게 구원받았다.
    ja: オスワルドはゴッデスに救われていた
  event_arkguardian1_03_s_58:
    speaker: "<Narration>"
    en: Regaining focus, Oswald takes out his tablet and looks at the status screen.
    ko: 정신을 차린 오스왈드는 타블렛을 꺼내 현황판을 바라보기 시작했다.
    ja: |-
      気を取り直し、タブレットに表示される
      現況報告に目を通そうとした
  event_arkguardian1_03_s_59:
    speaker: "<Narration>"
    en: Off in the distance, a shadow appears,
    ko: 타블렛 너머 지면에 그림자가 보인다.
    ja: タブレットの向こう側、地面に影が差している
  event_arkguardian1_03_s_60:
    speaker: "<Narration>"
    en: but lost in thought, he fails to notice its approach.
    ko: 너무 깊은 생각을 한 탓에 접근한 것을 눈치채지 못했다.
    ja: |-
      気がそれていたせいで、
      近づいてきた何者かへの反応が遅れた
  event_arkguardian1_03_s_61:
    speaker: "<Narration>"
    en: Feigning composure, he stays still for a moment, then quickly draws his gun
      and points it straight ahead.
    ko: |-
      오스왈드는 동요하지 않은 척, 잠시동안 가만히 있다가
      홀스터의 권총을 빠르게 뽑아 들어 정면을 향해 겨눴다.
    ja: |-
      オスワルドは平静を装って様子をうかがい
      ホルスターから拳銃を素早く抜き
      気配の主に向けた
  event_arkguardian1_03_s_62:
    speaker: freesia
    en: Wow, where did this gun come from?
    ko: 와. 갑자기 손에서 총이 생겼어.
    ja: わ。手品みたい。
  event_arkguardian1_03_s_63:
    speaker: freesia
    en: That's so strange.
    ko: 진짜 신기하다.
    ja: すご～い。
  event_arkguardian1_03_s_64:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_s_65:
    speaker: freesia
    en: Hi, Mister.
    ko: 아저씨.
    ja: おじさん。
  event_arkguardian1_03_s_66:
    speaker: freesia
    en: Are you busy?
    ko: 바빠?
    ja: 忙しい？
event_arkguardian1_03_e:
  event_arkguardian1_03_e_1:
    speaker: "<Narration>"
    en: Oswald lowers his weapon.
    ko: 오스왈드는 겨눴던 권총을 내려놓았다.
    ja: オスワルドは銃口を下げた
  event_arkguardian1_03_e_2:
    speaker: oswald_o
    en: Who are you?
    ko: 누굽니까.
    ja: どちら様でしょう。
  event_arkguardian1_03_e_3:
    speaker: freesia
    en: Name's Freesia.
    ko: 프리시아.
    ja: フリージア。
  event_arkguardian1_03_e_4:
    speaker: freesia
    en: We met before. When Red Hood saved us?
    ko: |-
      그때 본 적 있잖아.
      레드 후드 언니가 우리 구해줬을 때.
    ja: |-
      一緒にいたでしょ。
      レッドフードお姉ちゃんが助けてくれた時。
  event_arkguardian1_03_e_5:
    speaker: redhood
    en: Hey, kid. What's your name?
    ko: 꼬맹이. 이름이 뭐야?
    ja: おちびちゃん。名前は？
  event_arkguardian1_03_e_6:
    speaker: freesia
    en: Freesia.
    ko: 프리시아.
    ja: フリージア。
  event_arkguardian1_03_e_7:
    speaker: redhood
    en: Okay, Freesia. Where are your mom and dad?
    ko: |-
      그래. 프리시아.
      엄마랑 아빠는?
    ja: |-
      フリージア。
      パパとママは？
  event_arkguardian1_03_e_8:
    speaker: freesia
    en: They're... They're dead.
    ko: 응. 엄마랑 아빠는 죽었어.
    ja: うん。2人とも死んじゃった。
  event_arkguardian1_03_e_9:
    speaker: freesia
    en: They got sick. It only happened recently.
    ko: 병에 걸렸는데, 얼마 전에 죽었어.
    ja: 病気になっちゃって、この間。
  event_arkguardian1_03_e_10:
    speaker: redhood
    en: "... You must miss them very much."
    ko: "…많이 보고 싶겠네."
    ja: "…会いたいだろうな。"
  event_arkguardian1_03_e_11:
    speaker: freesia
    en: I do, but it's okay.
    ko: |-
      보고 싶어.
      근데 괜찮아.
    ja: |-
      会いたいよ。
      でも大丈夫。
  event_arkguardian1_03_e_12:
    speaker: freesia
    en: I was able to say goodbye to them.
    ko: 작별 인사 잘했거든.
    ja: お別れのあいさつ、ちゃんとしたから。
  event_arkguardian1_03_e_13:
    speaker: freesia
    en: They were sick for a long time,
    ko: |-
      엄마랑 아빠 있지.
      오랫동안 아팠어.
    ja: |-
      パパもママもね。
      ずっと苦しんでたの。
  event_arkguardian1_03_e_14:
    speaker: freesia
    en: so we talked a lot.
    ko: 그래서 얘기 많이 했어.
    ja: だから、たくさんお話したよ。
  event_arkguardian1_03_e_15:
    speaker: freesia
    en: About things we liked, what we didn't like... we talked about all sorts of
      stuff.
    ko: |-
      좋았던 거. 안 좋았던 거.
      다 얘기했어.
    ja: |-
      よかったこと。悪かったこと。
      全部お話したよ。
  event_arkguardian1_03_e_16:
    speaker: freesia
    en: So that's okay.
    ko: |-
      그래서 괜찮아.
      잔뜩 얘기했으니까.
    ja: |-
      だから大丈夫。
      いっぱいおしゃべりしたから。
  event_arkguardian1_03_e_17:
    speaker: freesia
    en: I'm sure my mom and dad are in a happier place too.
    ko: 엄마랑 아빠도 괜찮을 거야.
    ja: パパとママも大丈夫だよ。
  event_arkguardian1_03_e_18:
    speaker: redhood
    en: "... That's good."
    ko: "…그래."
    ja: "…そうか。"
  event_arkguardian1_03_e_19:
    speaker: oswald_o
    en: I remember now.
    ko: 기억납니다.
    ja: 覚えています。
  event_arkguardian1_03_e_20:
    speaker: oswald_o
    en: What is it? This area is off-limits to civilians.
    ko: 무슨 일이죠? 여긴 민간인이 와선 안 되는 곳입니다.
    ja: |-
      何かありましたか？
      ここは入って来てはいけない場所です。
  event_arkguardian1_03_e_21:
    speaker: freesia
    en: Oh, nothing much.
    ko: 아, 응. 별건 아니고.
    ja: あ、うん。大したことじゃないんだけどね。
  event_arkguardian1_03_e_22:
    speaker: "<Narration>"
    en: Freesia rummages through her coat.
    ko: 프리시아가 품을 뒤적인다.
    ja: フリージアが胸元を探った
  event_arkguardian1_03_e_23:
    speaker: "<Narration>"
    en: Oswald shifts his finger and places it on the gun's trigger.
    ko: 오스왈드는 총몸에 걸쳐놓았던 손가락을 방아쇠 쪽으로 가져간다.
    ja: オスワルドの指が引き金に伸びた
  event_arkguardian1_03_e_24:
    speaker: freesia
    en: Here.
    ko: 이거.
    ja: これ。
  event_arkguardian1_03_e_25:
    speaker: "<Narration>"
    en: Freesia holds out a document that's been folded in half.
    ko: 프리시아가 두 번 접힌 서류를 내민다.
    ja: フリージアは二つ折りの書類を差し出した
  event_arkguardian1_03_e_26:
    speaker: freesia
    en: Can you sign here for me?
    ko: 여기에 사인 좀 해줘.
    ja: サインしてください。
  event_arkguardian1_03_e_27:
    speaker: oswald_o
    en: You want me to sign it?
    ko: 사인이요?
    ja: サイン？
  event_arkguardian1_03_e_28:
    speaker: freesia
    en: Yes.
    ko: 응.
    ja: うん。
  event_arkguardian1_03_e_29:
    speaker: "<Narration>"
    en: Oswald looks at the papers Freesia is holding out.
    ko: 오스왈드는 프리시아가 내민 서류를 바라본다.
    ja: オスワルドは差し出された書類を確かめた
  event_arkguardian1_03_e_30:
    speaker: oswald_o
    en: A guardian consent form?
    ko: 보호자 동의서로군요.
    ja: 保護者登録の申請書ですか。
  event_arkguardian1_03_e_31:
    speaker: oswald_o
    en: Why are you giving this to me?
    ko: 이걸 왜 저한테 주는 겁니까.
    ja: なぜこれを私に？
  event_arkguardian1_03_e_32:
    speaker: freesia
    en: I want you to be my guardian.
    ko: 아저씨가 나 보호자 되어 주면 좋겠어.
    ja: おじさんに保護者になってもらいたいの。
  event_arkguardian1_03_e_33:
    speaker: oswald_o
    en: I can't do that.
    ko: 저는 당신의 보호자가 될 수 없습니다.
    ja: 私はあなたの保護者にはなれません。
  event_arkguardian1_03_e_34:
    speaker: oswald_o
    en: It might be best if you can find someone suitable among those heading to the
      Ark.
    ko: 방주로 가는 분 중 적절한 분들을 찾아보는 게 좋겠군요.
    ja: |-
      アークへ行く人の中から、
      引き受けてくれる人を探してください。
  event_arkguardian1_03_e_35:
    speaker: freesia
    en: Everyone who came here with me already has family.
    ko: 나랑 같이 온 사람들은 다 가족이 있어.
    ja: 私と一緒に来た人たち、みんな家族がいるの。
  event_arkguardian1_03_e_36:
    speaker: freesia
    en: A dad, a mom, a brother, or a sister. Someone.
    ko: 아빠, 엄마, 동생, 언니, 오빠 한 명씩 있어. 다 있거나.
    ja: |-
      パパ、ママ、弟、妹、お兄ちゃん、お姉ちゃん。
      みんな。
  event_arkguardian1_03_e_37:
    speaker: freesia
    en: But I don't have anyone.
    ko: 근데 난 아무도 없어.
    ja: でも私、誰もいないから。
  event_arkguardian1_03_e_38:
    speaker: freesia
    en: When I showed this to them, all of them had an awkward look on their face.
    ko: 이거 보여줬는데, 다들 곤란한 표정 지었어.
    ja: これ見せたら、みんな困った顔したの。
  event_arkguardian1_03_e_39:
    speaker: freesia
    en: I don't want to make anyone feel put out.
    ko: 다른 사람들을 곤란하게 만들고 싶진 않거든.
    ja: みんなには困ってほしくないから。
  event_arkguardian1_03_e_40:
    speaker: freesia
    en: But they said if I don't have a guardian, I'll be sent to an orphanage, and
      I don't want that.
    ko: 보호자가 없으면 고아원으로 간다고 하는데, 그건 싫어.
    ja: |-
      誰もサインしてくれないと、
      孤児院に行くらしいけど、それはイヤ。
  event_arkguardian1_03_e_41:
    speaker: freesia
    en: I'm scared. I don't even know anyone there.
    ko: 무섭거든. 아는 사람도 없고.
    ja: 知ってる人いないし、怖いの。
  event_arkguardian1_03_e_42:
    speaker: freesia
    en: So I want you to be my guardian.
    ko: 그래서 아저씨가 나 보호자 해줬으면 좋겠어.
    ja: だから、おじさんが私の保護者になって。
  event_arkguardian1_03_e_43:
    speaker: oswald_o
    en: Freesia... I don't know you either.
    ko: 프리시아. 저는 당신을 모릅니다.
    ja: |-
      フリージア。
      私はあなたのことを知りません。
  event_arkguardian1_03_e_44:
    speaker: freesia
    en: You know my face.
    ko: 얼굴 알잖아.
    ja: 顔は知ってるでしょ。
  event_arkguardian1_03_e_45:
    speaker: oswald_o
    en: I'm...
    ko: 저는….
    ja: 私は…
  event_arkguardian1_03_e_46:
    speaker: "<Narration>"
    en: Shaking off his dizzying inner thoughts, Oswald sighs, only to realize he
      is facing a situation he has never experienced before.
    ko: 아찔했던 생각에서 벗어나 한숨 돌린 오스왈드는 지금껏 겪어보지 못한 상황에 당황했다.
    ja: |-
      気の遠くなるような思考を抜け出した
      オスワルドだったが、
      落ち着く間もなく未知の状況に困惑した
  event_arkguardian1_03_e_47:
    speaker: "<Narration>"
    en: There's no manual for situations like this.
    ko: 이런 상황에서의 매뉴얼에 대해서는 본적도, 들어본 적도 없다.
    ja: |-
      こんな状況に対応するマニュアルは
      見たことも聞いたこともない
  event_arkguardian1_03_e_48:
    speaker: "<Narration>"
    en: He stares at Freesia.
    ko: 오스왈드는 프리시아를 빤히 쳐다보았다.
    ja: オスワルドはフリージアを観察した
  event_arkguardian1_03_e_49:
    speaker: "<Narration>"
    en: Her expression is confident, fearless, and unwavering.
    ko: 당당한 표정. 두려움이나 망설임이라고는 찾아볼 수 없는 표정.
    ja: |-
      表情は堂々としている。
      恐れや迷いは見当たらない
  event_arkguardian1_03_e_50:
    speaker: "<Narration>"
    en: Oswald, seemingly against all reason, feels a quiet certainty that this girl
      will be fine.
    ko: 오스왈드는 멋대로, 이 아이라면 걱정 없을 것 같다는 생각을 했다.
    ja: |-
      オスワルドは心の内で、
      この子はどこへいっても大丈夫だろうと考えた
  event_arkguardian1_03_e_51:
    speaker: oswald_o
    en: I'm sorry. I can't be your guardian.
    ko: 죄송합니다. 저는 당신의 보호자가 될 수 없
    ja: 申しわけありませんが、あなたの保護者には…
  event_arkguardian1_03_e_52:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 팔락팔락.
    ja: カタカタ――
  event_arkguardian1_03_e_53:
    speaker: "<Narration>"
    en: The sound of paper rustling fills the air.
    ko: 종이가 흔들리는 소리가 들린다.
    ja: 紙の震える音が聞こえた
  event_arkguardian1_03_e_54:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 팔락팔락.
    ja: カタカタ――
  event_arkguardian1_03_e_55:
    speaker: "<Narration>"
    en: Freesia's hands, holding out the paper, tremble ever so slightly.
    ko: 프리시아가 내민 종이가 미세하게 떨리고 있다.
    ja: |-
      フリージアの差し出した書類が、
      わずかに揺れている
  event_arkguardian1_03_e_56:
    speaker: "<Narration>"
    en: Oswald looks at Freesia once more.
    ko: 오스왈드는 다시 한번 프리시아를 바라본다.
    ja: |-
      オスワルドはもう一度
      フリージアの表情をうかがった
  event_arkguardian1_03_e_57:
    speaker: "<Narration>"
    en: Her face appears calm, indifferent to success or failure.
    ko: 되면 좋고, 안돼도 그만이라는 표정을 짓고 있지만
    ja: |-
      まるでうまくいけばラッキー、
      ダメでも気にしないという
      表情を装っているが…
  event_arkguardian1_03_e_58:
    speaker: "<Narration>"
    en: Yet he notices her shoulders and legs, quiver almost imperceptibly.
    ko: 미세하게 떨리는 어깨와 다리를 바라본다.
    ja: 肩と足がかすかに震えている
  event_arkguardian1_03_e_59:
    speaker: "<Narration>"
    en: Oswald thinks of the Goddess squad—
    ko: 오스왈드는 갓데스를 생각한다.
    ja: オスワルドの頭にゴッデスの面々の顔が浮かんだ
  event_arkguardian1_03_e_60:
    speaker: "<Narration>"
    en: those who held him up whenever he was about to fall.
    ko: 자신이 무너질 것 같을 때, 지탱해 준 갓데스를.
    ja: |-
      自分が絶望の淵へ落ちそうになるたび、
      支えとしてきたゴッデスの表情が…
  event_arkguardian1_03_e_61:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_62:
    speaker: "<Narration>"
    en: Oswald takes the papers from Freesia and signs them.
    ko: 오스왈드는 프리시아의 서류를 받아 들고 사인한다.
    ja: |-
      結局、オスワルドは
      フリージアから書類を受け取った
  event_arkguardian1_03_e_63:
    speaker: "<Narration>"
    en: He pulls out his seal, stamps it beside his signature,
    ko: 품에서 도장을 꺼내 사인 옆에 찍는다.
    ja: |-
      胸元から印鑑を取り出し、
      署名の隣に捺印を添えた
  event_arkguardian1_03_e_64:
    speaker: "<Narration>"
    en: then returns the documents to her.
    ko: 그리고 다시 서류를 프리시아에게 돌려준다.
    ja: そうして、書類をフリージアに返した
  event_arkguardian1_03_e_65:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_66:
    speaker: oswald_o
    en: Present this seal to the administrator.
    ko: 이 도장을 담당자에게 보여주십시오.
    ja: その印ごと、担当者に見せてください。
  event_arkguardian1_03_e_67:
    speaker: oswald_o
    en: It should make things easier for you.
    ko: 계시는 동안 좀 더 편하게 지낼 수 있을 겁니다.
    ja: ここにいる間、少しは楽に過ごせるでしょう。
  event_arkguardian1_03_e_68:
    speaker: freesia
    en: "... Are you okay with this?"
    ko: 어… 괜찮아?
    ja: えっと…いいの？
  event_arkguardian1_03_e_69:
    speaker: oswald_o
    en: What do you mean?
    ko: 뭐가요.
    ja: 何がですか？
  event_arkguardian1_03_e_70:
    speaker: freesia
    en: Becoming my guardian.
    ko: 나… 보호자 해주는 거.
    ja: 私の…保護者になること。
  event_arkguardian1_03_e_71:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_72:
    speaker: oswald_o
    en: Well...
    ko: "…글쎄요."
    ja: "…どうでしょうね。"
  event_arkguardian1_03_e_73:
    speaker: oswald_o
    en: I'm not sure either.
    ko: 저도 잘 모르겠군요.
    ja: 私にも、よく分かりません。
  event_arkguardian1_03_e_74:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_75:
    speaker: freesia
    en: Thanks, Mister.
    ko: "…아저씨. 고마워."
    ja: "…おじさん。ありがとう。"
  event_arkguardian1_03_e_76:
    speaker: freesia
    en: Truly.
    ko: 진짜 고마워.
    ja: 本当に、ありがとう。
  event_arkguardian1_03_e_77:
    speaker: freesia
    en: "*Sniff* Thank you!"
    ko: 아… 윽…! 고마워요…!
    ja: あっ…ううっ…！ありがとう…！
  event_arkguardian1_03_e_78:
    speaker: freesia
    en: "*Sobs* I'm truly so grateful."
    ko: 훌쩍. 진짜, 진짜 고마워.
    ja: ぐすっ…本当に、本当に…
  event_arkguardian1_03_e_79:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_80:
    speaker: freesia
    en: Can I stay here by your side for a while?
    ko: 나 아저씨 옆에 있어도 돼?
    ja: おじさんの隣にいてもいい？
  event_arkguardian1_03_e_81:
    speaker: oswald_o
    en: No. I'm busy.
    ko: 안 됩니다. 일이 바빠서요.
    ja: だめです。仕事が忙しいので。
  event_arkguardian1_03_e_82:
    speaker: freesia
    en: I'll be quiet. I won't say anything.
    ko: 아무 말 안 하고 있을게.
    ja: じっとしてるから。
  event_arkguardian1_03_e_83:
    speaker: oswald_o
    en: Go and submit that document to the administrator.
    ko: 담당자에게 서류를 제출하십시오.
    ja: それより、書類を出してきてください。
  event_arkguardian1_03_e_84:
    speaker: freesia
    en: O-oh, right!
    ko: 아, 아 맞다.
    ja: あっ、そうだった。
  event_arkguardian1_03_e_85:
    speaker: freesia
    en: I'll be right back.
    ko: 금방 갔다 올게.
    ja: すぐ戻ってくるね。
  event_arkguardian1_03_e_86:
    speaker: oswald_o
    en: That won't be necessary.
    ko: 다시 올 필요는 없습니다.
    ja: 戻ってこないでください。
  event_arkguardian1_03_e_87:
    speaker: "<Narration>"
    en: Freesia clutches the papers tightly and runs off.
    ko: 프리시아가 서류를 든 채 달려간다.
    ja: フリージアが書類を抱いて駆けていった
  event_arkguardian1_03_e_88:
    speaker: "<Narration>"
    en: Oswald watches her go, a blank expression on his face.
    ko: 오스왈드는 멍하니 그 뒷모습을 바라보았다.
    ja: オスワルドはその背中をぼんやりと見送った
  event_arkguardian1_03_e_89:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_90:
    speaker: oswald_o
    en: What was I thinking...?
    ko: "…무슨 생각이지."
    ja: "…何を考えているんだ、私は…"
  event_arkguardian1_03_e_91:
    speaker: "<Narration>"
    en: He gazes absentmindedly toward the crowd surging into the Ark.
    ko: 오스왈드는 멍하니 방주 입구로 밀려오는 인파를 바라본다.
    ja: |-
      オスワルドはアークの入口に押し寄せる
      人混みをぼんやりと眺め続けた
  event_arkguardian1_03_e_92:
    speaker: "<Narration>"
    en: He looks on vacantly as if gazing at a distant landscape.
    ko: 풍경을 보듯이, 멍하니 바라본다.
    ja: ただ風景を見るように、漠然と
  event_arkguardian1_03_e_93:
    speaker: "<Narration>"
    en: After some time...
    ko: 그러기를 한참.
    ja: しばらく時が経った
  event_arkguardian1_03_e_94:
    speaker: "<Narration>"
    en: Two figures approach from afar.
    ko: 멀리서 두 사람이 걸어온다.
    ja: 遠くから、2つの人影が寄ってきた
  event_arkguardian1_03_e_95:
    speaker: CGsoldier
    en: How are you, Special Agent—sorry, Chief?
    ko: |-
      수고 많으십니다.
      특무원님, 아니 특무실장님.
    ja: |-
      お疲れ様です。
      特務員…いえ、特務室長。
  event_arkguardian1_03_e_96:
    speaker: oswald_o
    en: I'm good. What's the matter?
    ko: |-
      수고 많으십니다.
      무슨 일이시죠?
    ja: |-
      お疲れ様です。
      何ごとですか？
  event_arkguardian1_03_e_97:
    speaker: CGsoldier
    en: Oh, nothing serious. This child brought a guardian consent form bearing your
      signature and seal, so I wanted to stop by to verify it.
    ko: 다른 게 아니라 이 아이가 특무실장님 사인과 도장이 찍힌 보호자 동의서를 들고 와서, 확인차 들렀습니다.
    ja: |-
      特務室長の署名捺印がされた
      不審な書類を提出する者がありましたので、
      確認のためにうかがいました。
  event_arkguardian1_03_e_98:
    speaker: freesia
    en: I'm telling you, it's true. He signed it and stamped it himself.
    ko: 맞다니까. 아저씨가 사인해 주고 도장 찍어줬어.
    ja: |-
      ホントだってば。
      おじさんがサインして、
      ハンコも押してくれたの。
  event_arkguardian1_03_e_99:
    speaker: CGsoldier
    en: Putting aside her current plight, we plan to launch an investigation regarding
      this forgery.
    ko: "…일단 이 아이의 처분은 둘째치고, 특무실장님의 사인과 도장이 도용된 건에 대해서 철저하게 조사해 보도록 하겠습니다."
    ja: |-
      …この子の処分は後ほどとして、
      今は特務室長の署名と印鑑の偽造に関して
      至急徹底的な調査を行いたく、ご協力を。
  event_arkguardian1_03_e_100:
    speaker: oswald_o
    en: I was the one who signed it and stamped it.
    ko: 제가 사인했고, 도장을 찍었습니다.
    ja: 正真正銘、私の署名捺印です。
  event_arkguardian1_03_e_101:
    speaker: CGsoldier
    en: Yes, we'll be sure to be thorough in our inves—
    ko: 예. 그 건에 대해 철저하게 조사를….
    ja: はい。ですので、この件に関して…
  event_arkguardian1_03_e_102:
    speaker: CGsoldier
    en: "... I beg your pardon?"
    ko: "…잘못 들었습니다?"
    ja: |-
      …恐れ入りますが、
      もう一度確認させていただけますか？
  event_arkguardian1_03_e_103:
    speaker: oswald_o
    en: I signed and stamped those documents myself.
    ko: 제가 직접 사인했고, 도장을 찍었다고 말씀드렸습니다.
    ja: 私が直々に署名をし、捺印を行いました。
  event_arkguardian1_03_e_104:
    speaker: CGsoldier
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_105:
    speaker: CGsoldier
    en: You... you did?
    ko: 특무실장님이 직접, 말씀이십니까.
    ja: 特務室長がご自分で…ですか？
  event_arkguardian1_03_e_106:
    speaker: oswald_o
    en: That's correct.
    ko: 그렇습니다.
    ja: その通りです。
  event_arkguardian1_03_e_107:
    speaker: freesia
    en: See? I told you it's true.
    ko: 거 봐. 맞다니까.
    ja: ほら。ホントだったでしょ。
  event_arkguardian1_03_e_108:
    speaker: CGsoldier
    en: Uh...
    ko: 어….
    ja: ええと…
  event_arkguardian1_03_e_109:
    speaker: oswald_o
    en: Is there a problem with that?
    ko: 혹시 문제가 될 사항이 있을까요?
    ja: 何か問題が？
  event_arkguardian1_03_e_110:
    speaker: CGsoldier
    en: No, no, of course not. However...
    ko: 아니, 그런 건 아닙니다. 아닙니다만….
    ja: いえ、そうではありませんが、しかし…
  event_arkguardian1_03_e_111:
    speaker: CGsoldier
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_112:
    speaker: "<Narration>"
    en: The soldier from the Central Government parts his lips hesitantly.
    ko: 중앙 정부의 병사의 입이 달싹거린다.
    ja: 兵士の口が何かを言いたそうに動いている
  event_arkguardian1_03_e_113:
    speaker: "<Narration>"
    en: His eyes clearly asking, "Why did you?"
    ko: "[왜 네가?]라고 묻고 싶은 눈치가 역력하다."
    ja: "「なぜ？」そう聞きたいのだろう"
  event_arkguardian1_03_e_114:
    speaker: "<Narration>"
    en: Normally, Oswald has an answer for every question,
    ko: 오스왈드는 모든 질문에 대답한다.
    ja: |-
      オスワルドはあらゆる質問への回答を
      常に用意している
  event_arkguardian1_03_e_115:
    speaker: "<Narration>"
    en: but not even he can answer this one. So he remains silent.
    ko: 하지만 그 질문에 대한 답만은 오스왈드 본인도 할 수 없었기에 그저 잠자코 있었다.
    ja: |-
      だが、その質問の答えは彼自身にも分からず、
      何も言うことができなかった
  event_arkguardian1_03_e_116:
    speaker: CGsoldier
    en: Uh... understood. I've verified its authenticity.
    ko: "…알겠, 습니다. 사실 여부 확인했습니다."
    ja: |-
      …了解、いたしました。
      署名は本物で間違いございませんね。
  event_arkguardian1_03_e_117:
    speaker: CGsoldier
    en: "... As per regulations, an adult male is actually not permitted to serve
      as a child's sole guardian."
    ko: "…원칙대로라면 성인 남성이 단독으로 아동의 보호자가 되는 것은 허가되지 않습니다만."
    ja: |-
      …ですが原則として、成人男性が
      単独で児童の保護者となることは
      許可されておりません。
  event_arkguardian1_03_e_118:
    speaker: oswald_o
    en: Is that so?
    ko: 그렇습니까.
    ja: そうでしたか。
  event_arkguardian1_03_e_119:
    speaker: CGsoldier
    en: Yes. It's essentially no different from an adoption.
    ko: 예. 사실상 입양과 크게 다르지 않으니까요.
    ja: はい。事実上の養子縁組になりますので。
  event_arkguardian1_03_e_120:
    speaker: CGsoldier
    en: However, since it's you, Chief, it won't be an issue. Your credentials are
      beyond reproach.
    ko: |-
      하지만 특무실장님이라면 문제없습니다.
      신원이 워낙 확실하셔서요.
    ja: |-
      とはいえ、室長直々の
      申請となれば通るでしょう。
      素性は疑いようもありませんし。
  event_arkguardian1_03_e_121:
    speaker: CGsoldier
    en: We'll proceed with processing the paperwork.
    ko: 서류는 정상적으로 접수될 겁니다.
    ja: 問題なく受理されるかと思います。
  event_arkguardian1_03_e_122:
    speaker: CGsoldier
    en: Thank you for your time.
    ko: 바쁘신 와중에 시간 내주셔서 감사합니다.
    ja: |-
      お忙しい中、お手間を取らせてしまい
      申しわけございませんでした。
  event_arkguardian1_03_e_123:
    speaker: oswald_o
    en: Sorry to have troubled you. I should have handled this in person.
    ko: 아닙니다. 제가 직접 가서 처리했어야 하는데 번거롭게 해드렸군요.
    ja: |-
      いいえ。私が直接処理するべきところ、
      ご面倒をおかけしました。
  event_arkguardian1_03_e_124:
    speaker: oswald_o
    en: I appreciate all your hard work.
    ko: 수고 많으셨습니다.
    ja: ご苦労様です。
  event_arkguardian1_03_e_125:
    speaker: CGsoldier
    en: Thank you. I'll be on my way then.
    ko: 감사합니다. 그럼.
    ja: お言葉、痛み入ります。では。
  event_arkguardian1_03_e_126:
    speaker: "<Narration>"
    en: The soldier salutes, then turns to leave.
    ko: 중앙 정부 병사는 경례 후 뒤돌아 걸어갔다.
    ja: 中央政府の兵士は敬礼をした後、その場を離れた
  event_arkguardian1_03_e_127:
    speaker: "<Narration>"
    en: As he walks away, he keeps glancing down at the papers, tilting his head in
      confusion.
    ko: 서류를 들여다보며 계속 고개를 갸웃한다.
    ja: |-
      歩きながら書類をのぞきこみ、
      何度も首をかしげている
  event_arkguardian1_03_e_128:
    speaker: "<Narration>"
    en: Oswald feels the urge to tilt his head in puzzlement as well, but decides
      against it—a certain someone still has her eyes on him.
    ko: |-
      오스왈드는 그 갸웃거림에 동참하고 싶었지만,
      자신을 빤히 쳐다보는 시선 때문에 그러지 않기로 했다.
    ja: |-
      オスワルド自身もそうしたいほどだったが、
      自分に向けられた視線を感じ、思いとどまった
  event_arkguardian1_03_e_129:
    speaker: freesia
    en: "... Hehe."
    ko: "…헤헤."
    ja: "…えへへ。"
  event_arkguardian1_03_e_130:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_131:
    speaker: "<Narration>"
    en: Freesia sits beside Oswald.
    ko: 프리시아는 오스왈드의 옆에 앉았다.
    ja: フリージアがオスワルドの隣に座った
  event_arkguardian1_03_e_132:
    speaker: oswald_o
    en: I'm on duty.
    ko: 저는 업무 중입니다.
    ja: 私は忙しいと言ったはずですが。
  event_arkguardian1_03_e_133:
    speaker: freesia
    en: I know.
    ko: 응. 알아.
    ja: うん、知ってる。
  event_arkguardian1_03_e_134:
    speaker: freesia
    en: I'll be quiet as a mouse. I won't make a peep.
    ko: 아무 말 안 하고 있을 테니까 괜찮아.
    ja: いい子にしてるから、気にしないで。
  event_arkguardian1_03_e_135:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_03_e_136:
    speaker: "<Narration>"
    en: Oswald's gaze drifts back to the endless stream of people and supplies entering
      the Ark.
    ko: 오스왈드의 시선이 다시 인파와 물자로 향했다.
    ja: オスワルドは視線を人混みと物資に向けた
  event_arkguardian1_03_e_137:
    speaker: "<Narration>"
    en: His attention, however, remains squarely fixated on the girl at his side.
    ko: 하지만 모든 신경은 옆에 앉은 소녀에게로 쏠려 있었다.
    ja: だが、神経は隣に座る気配に集中していた
  event_arkguardian1_03_e_138:
    speaker: "<Narration>"
    en: Because of her, his mind finds a brief escape from its tangled web of thoughts.
    ko: 그 덕분에, 오스왈드는 복잡한 생각에서 벗어날 수 있었다.
    ja: そうしていると、深く考え込まずに済んだ
  event_arkguardian1_03_e_139:
    speaker: "<Narration>"
    en: Other complicated feelings fill the space instead—but for now, he's fine with
      that.
    ko: |-
      다른 복잡한 생각이 그 자리를 대신했지만,
      지금으로서는 그걸로 좋았다.
    ja: |-
      別の複雑な悩みを抱えることになったが、
      今のところは気を紛らわせることができた
event_arkguardian1_intermission_01:
  event_arkguardian1_intermission_01_1:
    speaker: liliweiss
    en: We're here.
    ko: 우리 왔어.
    ja: ただいま。
  event_arkguardian1_intermission_01_2:
    speaker: commander
    en: I trust you troublemakers behaved while I was away?
    ko: 사고 안 치고 잘들 있었냐 이 녀석들아.
    ja: 仲良く元気でやってたか？
  event_arkguardian1_intermission_01_3:
    speaker: snowwhite_o
    en: There you are.
    ko: 오셨어요?
    ja: 戻って来てたんですか？
  event_arkguardian1_intermission_01_4:
    speaker: dorothy
    en: You're late.
    ko: 늦었군요.
    ja: 遅かったですね。
  event_arkguardian1_intermission_01_5:
    speaker: hongryeon_o
    en: What hath detained thee thus?
    ko: 뭘 하다가 이제서야 오는가.
    ja: 今まで何をしていたのやら。
  event_arkguardian1_intermission_01_6:
    speaker: rapunzel_o
    en: Are you both all right?
    ko: 두 분 다 괜찮은 거 맞죠?
    ja: お二人とも、おケガはありませんか？
  event_arkguardian1_intermission_01_7:
    speaker: commander
    en: Speak one at a time, people.
    ko: 한 명씩 말해라 좀.
    ja: 話すのは1人ずつにしてもらえないか。
  event_arkguardian1_intermission_01_8:
    speaker: liliweiss
    en: I heard something major happened while we were gone?
    ko: 우리 없는 동안 큰일이 있었다며?
    ja: 私たちがいない間、大変だったんでしょ？
  event_arkguardian1_intermission_01_9:
    speaker: liliweiss
    en: You guys held the fort well. Great job.
    ko: 다들 잘 해줬어. 장하네.
    ja: みんな、よく頑張りました。えらい。
  event_arkguardian1_intermission_01_10:
    speaker: hongryeon_o
    en: Pish posh, 'twas an easy feat.
    ko: 뭘. 쉬운 일이었다네.
    ja: なぁに、大したことではない。
  event_arkguardian1_intermission_01_11:
    speaker: commander
    en: So... did she leave okay?
    ko: "…그 녀석은, 잘 갔나?"
    ja: "…見送りは、できたのか？"
  event_arkguardian1_intermission_01_12:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_13:
    speaker: snowwhite_o
    en: Yes.
    ko: 예.
    ja: はい。
  event_arkguardian1_intermission_01_14:
    speaker: snowwhite_o
    en: She departed without any regrets,
    ko: 아무런 미련 없이, 잘 갔어요.
    ja: きれいなお別れでした。
  event_arkguardian1_intermission_01_15:
    speaker: snowwhite_o
    en: and we gave her a proper send off.
    ko: 우리도, 잘 보내줬고요.
    ja: 私たちも、きちんと送り出しました。
  event_arkguardian1_intermission_01_16:
    speaker: commander
    en: "... Good."
    ko: "…그래."
    ja: "…そうか。"
  event_arkguardian1_intermission_01_17:
    speaker: commander
    en: That's all that matters.
    ko: 그럼 됐다.
    ja: それならいい。
  event_arkguardian1_intermission_01_18:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_19:
    speaker: liliweiss
    en: It's a pity I couldn't say goodbye to her.
    ko: 마지막으로 인사도 못 한 게 아쉽네.
    ja: 最後のあいさつもできなかったなんて。
  event_arkguardian1_intermission_01_20:
    speaker: liliweiss
    en: Oh well. There'll be other chances.
    ko: 뭐, 또 기회가 있겠지.
    ja: まあ、またチャンスはあるかな。
  event_arkguardian1_intermission_01_21:
    speaker: snowwhite_o
    en: Huh?
    ko: "??"
    ja: "？？"
  event_arkguardian1_intermission_01_22:
    speaker: liliweiss
    en: I hate to start barking orders so soon after arriving, but I need everyone
      to gather in the meeting room.
    ko: 오자마자 미안한데, 다들 회의실로 좀 모여줘.
    ja: |-
      さっそくで悪いんだけど、
      みんな、会議室に集合して。
  event_arkguardian1_intermission_01_23:
    speaker: liliweiss
    en: I have an urgent announcement,
    ko: 긴급히 전달할 게 있어.
    ja: 緊急の連絡があるの。
  event_arkguardian1_intermission_01_24:
    speaker: liliweiss
    en: and it's not something I can discuss here.
    ko: 여기서 할만한 얘기도 아니고.
    ja: こんな場所で話せるようなことじゃないし。
  event_arkguardian1_intermission_01_25:
    speaker: rapunzel_o
    en: I suppose this has to do with your belated return?
    ko: 늦어진 것과 관계 있는 내용이겠군요.
    ja: それが今までかかった理由でしょうか。
  event_arkguardian1_intermission_01_26:
    speaker: liliweiss
    en: Precisely.
    ko: 응. 맞아.
    ja: うん、そう。
  event_arkguardian1_intermission_01_27:
    speaker: liliweiss
    en: All right, let's go.
    ko: 자, 이동하자.
    ja: あとの話は、移動してからね。
  event_arkguardian1_intermission_01_28:
    speaker: "<Narration>"
    en: Liliweiss explains how the Ark is to be sealed.
    ko: 릴리바이스는 모두에게 방주 밀봉에 대해 설명했다.
    ja: |-
      リリーバイスが全員に
      アーク封鎖計画の内容を明かした
  event_arkguardian1_intermission_01_29:
    speaker: "<Narration>"
    en: She details the five-phase process that will gradually seal the gates,
    ko: 5차에 걸쳐 방주는 서서히 문을 닫을 것이고,
    ja: |-
      アークは5段階の封鎖作戦を経て
      徐々に封鎖され…
  event_arkguardian1_intermission_01_30:
    speaker: "<Narration>"
    en: after which they will never open again on either side.
    ko: 그 이후로는 안팎에서 문이 열리지 않는다는 것을 설명한다.
    ja: |-
      作戦完了後、内側からも外側からも、
      アークへの通行は不可能になること
  event_arkguardian1_intermission_01_31:
    speaker: "<Narration>"
    en: 'She continues by explaining Operation: Ark Guardian, a defense mission led
      by the Goddess squad,'
    ko: |-
      마지막 밀봉이 끝날 때까지 방주 입구를 지키는,
      갓데스를 주축으로 펼쳐지는 방위 작전
    ja: |-
      そして、最終封鎖の完了まで、
      アークへの進入口を防衛する作戦は…
  event_arkguardian1_intermission_01_32:
    speaker: "<Narration>"
    en: who will protect the Ark's entrance until the final sealing is complete.
    ko: "[아크 가디언]에 대해서도 설명한다."
    ja: "「アークガーディアン」と命名されたこと"
  event_arkguardian1_intermission_01_33:
    speaker: "<Narration>"
    en: Her voice remains steadfast and calm throughout.
    ko: 덤덤하게 이어지는 설명.
    ja: 説明は淡々と続けられた
  event_arkguardian1_intermission_01_34:
    speaker: "<Narration>"
    en: The Goddesses listen in silence,
    ko: 갓데스의 모두가 가만히 이야기를 듣고만 있다.
    ja: それを聞く誰からも、言葉は無かった
  event_arkguardian1_intermission_01_35:
    speaker: "<Narration>"
    en: but their faces betray emotions they cannot hide.
    ko: 하지만 표정에 드러나는 감정은 숨길 수 없었다.
    ja: |-
      だが、顔からは
      隠し切れない感情がこぼれ出ていた
  event_arkguardian1_intermission_01_36:
    speaker: "<Narration>"
    en: Her brief explanation comes to an end.
    ko: 짧은 설명이 끝났다.
    ja: 簡潔な説明が終わった
  event_arkguardian1_intermission_01_37:
    speaker: liliweiss
    en: "... That's it. Any questions?"
    ko: "…이상이야. 질문 있어?"
    ja: "…以上、質問はある？"
  event_arkguardian1_intermission_01_38:
    speaker: dorothy
    en: So when do we head in?
    ko: 우리는 언제 들어가죠?
    ja: 私たちの撤収はいつになりますか？
  event_arkguardian1_intermission_01_39:
    speaker: liliweiss
    en: During the final phase of the sealing process. The same goes for the mass-produced
      Nikke units.
    ko: |-
      5차 밀봉 최후반에 들어가.
      양산형 니케 부대들도 마찬가지고.
    ja: |-
      第5次封鎖の一番最後。
      量産型ニケ部隊も同じね。
  event_arkguardian1_intermission_01_40:
    speaker: liliweiss
    en: We'll defend the entrance until the very last moment, then enter the Ark.
    ko: 최후의 최후까지 지킨 후, 방주로 들어가는 거지.
    ja: 最後の最後まで、アークを守り切ってから。
  event_arkguardian1_intermission_01_41:
    speaker: dorothy
    en: "... All right."
    ko: "…그래요."
    ja: "…そうですか。"
  event_arkguardian1_intermission_01_42:
    speaker: snowwhite_o
    en: How long will it take until the fifth phase is complete?
    ko: 5차 밀봉 완료까지 얼마나 걸릴까요?
    ja: |-
      第5次封鎖の完了まで、
      どれくらいかかりますか？
  event_arkguardian1_intermission_01_43:
    speaker: liliweiss
    en: I don't know. I heard it might vary depending on the situation at hand.
    ko: 글쎄. 그 부분은 가변적으로 진행한다고 해.
    ja: 未定よ。そこは流動的に変わるみたい。
  event_arkguardian1_intermission_01_44:
    speaker: liliweiss
    en: Even in the worst-case scenario, it shouldn't take more than a month.
    ko: 길어도 한 달은 넘기지 않을 예정이야.
    ja: 長くても1ヶ月は超えない予定だけど。
  event_arkguardian1_intermission_01_45:
    speaker: snowwhite_o
    en: "... That's rather short."
    ko: "…짧네요."
    ja: "…短いですね。"
  event_arkguardian1_intermission_01_46:
    speaker: liliweiss
    en: Yes, it is.
    ko: 응. 짧지.
    ja: うん、本当に。
  event_arkguardian1_intermission_01_47:
    speaker: liliweiss
    en: In addition, since this operation is purely defensive in nature, the Wings
      of Victory will be moved to the Ark.
    ko: |-
      추가로 이제는 방위전 만으로 작전 범위가 좁아지는 관계로,
      승리의 날개 호도 방주로 옮길 거야.
    ja: |-
      それと、これからは防衛戦に移るから、
      勝利の翼号もアークへ
      回収されることになったの。
  event_arkguardian1_intermission_01_48:
    speaker: liliweiss
    en: That will happen during the third phase.
    ko: 3차 밀봉쯤에 옮길 예정이라고 해.
    ja: これは第3次封鎖の辺りになる予定よ。
  event_arkguardian1_intermission_01_49:
    speaker: hongryeon_o
    en: So even our dedicated transport base shall be taken from us.
    ko: 전용 이동 기지도 없어지는군.
    ja: 我らが空飛ぶネグラともおさらばか。
  event_arkguardian1_intermission_01_50:
    speaker: hongryeon_o
    en: Is there some cause for dividing this undertaking into five phases?
    ko: 굳이 5차로 나눠서 진행하는 이유가 있는 건가?
    ja: わざわざ5段階に分ける理由はなんだい？
  event_arkguardian1_intermission_01_51:
    speaker: liliweiss
    en: There's a limit to how many people the Ark can take at one time.
    ko: 방주로 한 번에 수용할 수 있는 인원의 수는 한계가 있어.
    ja: |-
      一度にアークへ収容できる人数には、
      限界があるの。
  event_arkguardian1_intermission_01_52:
    speaker: liliweiss
    en: So they're splitting the procedure into separate phases to ensure safety.
    ko: 그래서 안전하게 이동 인원을 나누는 거지.
    ja: だから、安全な移動のために分けるんだって。
  event_arkguardian1_intermission_01_53:
    speaker: hongryeon_o
    en: Hmph. 'Tis but a fine way of saying the highborn mean to enter first.
    ko: 흥. 높은 분들부터 먼저 들어가려고 하는 말이군.
    ja: |-
      ふん、お偉方が真っ先に
      逃げ込もうというわけか。
  event_arkguardian1_intermission_01_54:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_55:
    speaker: dorothy
    en: It's not just about the people.
    ko: 단순 인원수 때문만은 아닐 텐데요.
    ja: 人数の問題だけではないでしょう。
  event_arkguardian1_intermission_01_56:
    speaker: liliweiss
    en: That's right. The Ark has dozens of entrances,
    ko: 맞아. 방주에는 수십 개의 입구가 있어.
    ja: そう。アークには何十ヶ所も入り口があるから。
  event_arkguardian1_intermission_01_57:
    speaker: liliweiss
    en: which act as supply channels.
    ko: 각종 물자들이 들어가는 입구지.
    ja: そっちは物資用だけどね。
  event_arkguardian1_intermission_01_58:
    speaker: liliweiss
    en: Since the supplies also need to be continually brought in until the very last
      moment, the entrances will be closed off step by step.
    ko: 물자 역시 최후의 최후까지 들어가야 하기 때문에 순차적으로 입구를 닫을 거야.
    ja: |-
      物資も最後まで運ばないといけないから、
      少しずつ封鎖していくしかないの。
  event_arkguardian1_intermission_01_59:
    speaker: liliweiss
    en: This process will make quite a ruckus, which will naturally attract the Raptures.
    ko: 이 과정에서 큰 소음이 동반되고, 당연히 랩쳐들이 몰려올 거야.
    ja: |-
      当たり前だけど、そんなことをしていれば…
      ラプチャーも集まってくるはず。
  event_arkguardian1_intermission_01_60:
    speaker: liliweiss
    en: It's our job to hold them back.
    ko: 그걸 우리가 막아내는 거고.
    ja: 私たちの出番はそこから。
  event_arkguardian1_intermission_01_61:
    speaker: rapunzel_o
    en: There are dozens of entrances, you say?
    ko: 입구가 수십 개나 있다고요?
    ja: 入口が数十ヶ所も？
  event_arkguardian1_intermission_01_62:
    speaker: rapunzel_o
    en: Then why is there only one for humans?
    ko: 그런데 왜 사람용 입구는 여기 하나뿐이죠?
    ja: |-
      なぜ人々の受け入れをしているのは
      1ヶ所だけなのですか？
  event_arkguardian1_intermission_01_63:
    speaker: dorothy
    en: It's likely due to the selection process.
    ko: 선별 때문이겠죠.
    ja: 選別するため。
  event_arkguardian1_intermission_01_64:
    speaker: dorothy
    en: Only those who are chosen may enter. Anyone else cannot.
    ko: 선택받은, 즉 확인되지 않은 사람은 방주로 들어갈 수 없다.
    ja: |-
      選ばれていない者…
      政府に身分が認められていない者は、
      アークに入れない。
  event_arkguardian1_intermission_01_65:
    speaker: dorothy
    en: Correct?
    ko: 맞죠?
    ja: 違いますか？
  event_arkguardian1_intermission_01_66:
    speaker: commander
    en: Right.
    ko: 그래. 맞다.
    ja: ああ、正解だ。
  event_arkguardian1_intermission_01_67:
    speaker: commander
    en: They can't let just anyone in.
    ko: 아무나 들일 수는 없으니까.
    ja: 誰でも入れてやるというわけにはいかない。
  event_arkguardian1_intermission_01_68:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_69:
    speaker: rapunzel_o
    en: Once the fifth phase is complete,
    ko: 5차 밀봉이 끝난 후.
    ja: 第5次封鎖の完了後…
  event_arkguardian1_intermission_01_70:
    speaker: rapunzel_o
    en: what about those who arrive at the Ark's entrance afterward?
    ko: 방주 입구로 찾아오는 분들은요?
    ja: アークにたどり着いた人々はどうなるのですか？
  event_arkguardian1_intermission_01_71:
    speaker: rapunzel_o
    en: And those left on the surface? What happens to them?
    ko: 그리고, 지상에 남은 다른 분들은요?
    ja: それに、地上に残った他の人々は…？
  event_arkguardian1_intermission_01_72:
    speaker: commander
    en: They're to be abandoned.
    ko: 버린다.
    ja: 見捨てられる。
  event_arkguardian1_intermission_01_73:
    speaker: rapunzel_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian1_intermission_01_74:
    speaker: commander
    en: Since we lost the battle,
    ko: 우린 졌으니까.
    ja: 私たちは負けたんだ。
  event_arkguardian1_intermission_01_75:
    speaker: commander
    en: we can't save everyone.
    ko: 모두를 구할 수 없다.
    ja: 全てを救うことはできない。
  event_arkguardian1_intermission_01_76:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_77:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_78:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_intermission_01_79:
    speaker: hongryeon_o
    en: Come, let us make for the Lift at once.
    ko: 당장 궤도 엘리베이터로 가세.
    ja: 今すぐ軌道エレベーターに行くぞ。
  event_arkguardian1_intermission_01_80:
    speaker: hongryeon_o
    en: If we were to sever the Queen's head, would not every ill be resolved?
    ko: 가서. 퀸의 모가지를 따버리면 다 해결될 문제 아니던가.
    ja: |-
      行って、クイーンの首さえ取れば
      解決するのであろう？
  event_arkguardian1_intermission_01_81:
    speaker: liliweiss
    en: You know as well as I do that's impossible.
    ko: 무리라는 거 알잖아.
    ja: 無理って、分かってるでしょ。
  event_arkguardian1_intermission_01_82:
    speaker: liliweiss
    en: There's no way we can even get close to the Lift, not even if every person
      on the planet rushed it at the same time.
    ko: 지금의 궤도 엘리베이터는 인류 전체가 달려들어도 뚫을 수 없어.
    ja: |-
      今の軌道エレベーターは、
      人類みんなで行ったって突破できないの。
  event_arkguardian1_intermission_01_83:
    speaker: hongryeon_o
    en: What then, pray? Are we to tuck our tails betwixt our legs like hounds defeated,
      and slink into the depths below?
    ko: 그럼 이대로 패배한 개마냥 꼬리를 말고 지하로 숨어 들어가라는 말인가!
    ja: |-
      では、このまま負け犬同然に、
      尻尾を巻いて地下へ逃がれろと！？
  event_arkguardian1_intermission_01_84:
    speaker: commander
    en: So what do you want us to do? Go ahead and bring me the Queen's head yourself
      then.
    ko: 뭐 어쩌라는 거야. 그럼 네가 가서 퀸 목을 따오던가.
    ja: |-
      他に何ができる。
      一人でクイーンの首を持ち帰ってくるか？
  event_arkguardian1_intermission_01_85:
    speaker: hongryeon_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian1_intermission_01_86:
    speaker: commander
    en: Stop throwing a fit, Scarlet.
    ko: 떼쓰지 마라 홍련.
    ja: 子どものわがままじゃないんだ。
  event_arkguardian1_intermission_01_87:
    speaker: hongryeon_o
    en: A fit...? Me? I but sought to...!
    ko: 떼를 쓰다니…! 나는 그저…!
    ja: 子どもだと…！私はただ…！
  event_arkguardian1_intermission_01_88:
    speaker: commander
    en: That'll be all. Meeting adjourned.
    ko: 이상. 회의 종료.
    ja: 以上だ。会議はここまで。
  event_arkguardian1_intermission_01_89:
    speaker: commander
    en: If you've got any complaints or questions, come to me.
    ko: 불만이 있거나, 의문이 있다면 나를 찾아와라.
    ja: 不満や質問があれば、私のところへ来い。
  event_arkguardian1_intermission_01_90:
    speaker: commander
    en: However,
    ko: 단.
    ja: ただし…
  event_arkguardian1_intermission_01_91:
    speaker: commander
    en: think through what you want to say before you do.
    ko: 충분히 생각한 뒤에 찾아와라.
    ja: 十分に考えたうえで来てくれ。
  event_arkguardian1_intermission_01_92:
    speaker: commander
    en: If you intend to come to me simply to whine, don't bother.
    ko: 와서 떼를 쓸 생각이라면 찾아올 생각도 하지 마라.
    ja: |-
      ただの泣き言や愚痴を聞いている時間は
      ないからな。
  event_arkguardian1_intermission_01_93:
    speaker: commander
    en: Let's go, Lilith.
    ko: 가자. 릴리스.
    ja: 行くぞ、リリス。
  event_arkguardian1_intermission_01_94:
    speaker: liliweiss
    en: "... Yes, Commander."
    ko: "…예. 지휘관."
    ja: "…はい。指揮官。"
  event_arkguardian1_intermission_01_95:
    speaker: "<Narration>"
    en: The Commander and Liliweiss leave the meeting room,
    ko: 지휘관과 릴리바이스가 회의실을 나섰다.
    ja: 指揮官とリリーバイスが会議室から去った
  event_arkguardian1_intermission_01_96:
    speaker: "<Narration>"
    en: leaving only a dreadful silence behind.
    ko: 회의실 안에는 끔찍한 침묵만이 맴돌았다.
    ja: 会議室は恐ろしいほどの静寂に包まれた
event_arkguardian1_04_s:
  event_arkguardian1_04_s_1:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 쾅!
    ja: バン！
  event_arkguardian1_04_s_2:
    speaker: "<Narration>"
    en: Scarlet slams her hand against the table.
    ko: 홍련이 테이블을 내려친다.
    ja: 紅蓮がテーブルを叩いた
  event_arkguardian1_04_s_3:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_4:
    speaker: dorothy
    en: Rather than beating up the table, why don't you say something?
    ko: 테이블을 그렇게 내려쳤으면 뭐라도 얘기하시죠.
    ja: テーブルを叩くより、何か言ってください。
  event_arkguardian1_04_s_5:
    speaker: hongryeon_o
    en: I am merely venting. Is that forbidden?
    ko: 화풀이 좀 했네. 안되는가?
    ja: |-
      ただのやつ当たりだ。
      文句があるかい？
  event_arkguardian1_04_s_6:
    speaker: dorothy
    en: Of course it's not.
    ko: 안될 것 없죠.
    ja: いいえ。
  event_arkguardian1_04_s_7:
    speaker: dorothy
    en: Truth be told, I'd love to do the same.
    ko: 저도 그러고 싶은 심정이니까.
    ja: 私もそうしたい気分でした。
  event_arkguardian1_04_s_8:
    speaker: hongryeon_o
    en: Is there truly no other way?
    ko: 뭔가 방법이 없겠는가.
    ja: 何か手はないものか。
  event_arkguardian1_04_s_9:
    speaker: dorothy
    en: It's as you said—the only option left is to defeat the Queen.
    ko: 당신 말대로 퀸을 쓰러뜨리는 것 말고는 없겠죠.
    ja: |-
      あなたが言った通り、
      クイーンを倒すしかありません。
  event_arkguardian1_04_s_10:
    speaker: dorothy
    en: "... And even then, there's no guarantee the situation will change."
    ko: "…그리고, 그런다고 해결될지도 미지수고요."
    ja: "…仮に倒せたとしても、その後は未知数です。"
  event_arkguardian1_04_s_11:
    speaker: dorothy
    en: No one can say for sure that everything will end the moment the Queen falls.
    ko: 퀸을 쓰러뜨리면 정말 모든 것이 끝날지는 아무도 몰라요.
    ja: |-
      クイーンを倒せば全て終わるという
      保証もありません。
  event_arkguardian1_04_s_12:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_13:
    speaker: hongryeon_o
    en: So I am rendered a defeated hound, tail tucked as I flee.
    ko: 꼬리를 말고 도망가는 패배한 개… 가 되었군.
    ja: 尻尾を巻いて逃げる…負け犬か。
  event_arkguardian1_04_s_14:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_15:
    speaker: snowwhite_o
    en: Even so...
    ko: 그래도.
    ja: それでも…
  event_arkguardian1_04_s_16:
    speaker: snowwhite_o
    en: we can still save the ones within our reach.
    ko: 손이 닿는 사람들은 모두 구할 수 있잖아요.
    ja: 手の届く人たちは全員、まだ助けられます。
  event_arkguardian1_04_s_17:
    speaker: snowwhite_o
    en: That's what we have to do.
    ko: 그렇게 해야 하고요.
    ja: だったら、やるべきです。
  event_arkguardian1_04_s_18:
    speaker: hongryeon_o
    en: Snow White... thou...
    ko: 스노우 화이트… 자네.
    ja: スノーホワイト…君は…
  event_arkguardian1_04_s_19:
    speaker: snowwhite_o
    en: We can't save everyone, but the ones we can save still count for something.
    ko: |-
      모두를 구할 수는 없지만,
      그것만 해도 크다고 생각해요.
    ja: |-
      たとえ全員は助けられなくたって、
      大きな意義があると思います。
  event_arkguardian1_04_s_20:
    speaker: snowwhite_o
    en: So let's not think of it as losing.
    ko: 그러니 우리, 졌다고 생각하지 말아요.
    ja: だから、負けたと思うのはまだ早いです。
  event_arkguardian1_04_s_21:
    speaker: snowwhite_o
    en: But a temporary retreat.
    ko: 잠깐 후퇴하는 거라고 생각하자고요.
    ja: 少し後ろにさがっただけだって、思いましょう。
  event_arkguardian1_04_s_22:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_23:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_24:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_25:
    speaker: snowwhite_o
    en: Wh-why is everyone looking at me like that?
    ko: 왜들… 그렇게 저를 빤히….
    ja: ええと…なんでそんなに見てるんですか…？
  event_arkguardian1_04_s_26:
    speaker: dorothy
    en: Because you're the most mature among us.
    ko: 이 중에서 가장 어른스러워서요.
    ja: この中で一番の大人が、あなただったとは。
  event_arkguardian1_04_s_27:
    speaker: snowwhite_o
    en: No, I'm just...
    ko: 아니, 저는….
    ja: そ、そんなことは…
  event_arkguardian1_04_s_28:
    speaker: dorothy
    en: Snow White is right. For now, we must do what we can.
    ko: 스노우 화이트 말대로, 지금 할 수 있는 일을 해야죠.
    ja: |-
      スノーホワイトの言う通りです。
      今はできることをしましょう。
  event_arkguardian1_04_s_29:
    speaker: dorothy
    en: If we recklessly overdo it, we might end up losing what we already have in
      our hands.
    ko: 괜히 무리를 하려다가 손안의 것들마저 모두 놓칠 수 있어요.
    ja: |-
      やけになれば、今この手が届くものまで
      失うことになります。
  event_arkguardian1_04_s_30:
    speaker: dorothy
    en: We must understand our own limits. All of us.
    ko: 주제 파악을 해야 해요. 서로서로.
    ja: |-
      私たち全員が、置かれた状況を
      よく考えるべきです。
  event_arkguardian1_04_s_31:
    speaker: hongryeon_o
    en: Bah.
    ko: "…칫."
    ja: "…くっ。"
  event_arkguardian1_04_s_32:
    speaker: dorothy
    en: If there had been a way, the Commander and Lilith wouldn't have stood idle.
    ko: 방법이 있었다면 지휘관과 릴리스가 가만히 있지 않았겠죠.
    ja: |-
      他に方法があったなら、
      指揮官とリリスがとっくに動いているはず。
  event_arkguardian1_04_s_33:
    speaker: dorothy
    en: They've accepted it and moved on. So should we.
    ko: 그 둘이 수긍하고 넘어갔으니 우리도 따라야 해요.
    ja: |-
      あの2人が他にないと言ったなら、
      私たちはそれに従うまでです。
  event_arkguardian1_04_s_34:
    speaker: dorothy
    en: Our duty is to strive for the best possible outcome in our current situation.
    ko: 그 안에서 최선의 결과를 내기 위해 노력할 뿐이어야겠죠.
    ja: |-
      その中で、最善の結果を得るために
      全力を尽くすべきでしょう。
  event_arkguardian1_04_s_35:
    speaker: dorothy
    en: Don't be one of those people who rage when there's no solution.
    ko: 누구처럼 방법은 없는 주제에 화만 낼 게 아니라.
    ja: 机にやつ当たりしている場合ではありません。
  event_arkguardian1_04_s_36:
    speaker: hongryeon_o
    en: Very well... Forgive me.
    ko: "…알겠네. 미안하네."
    ja: "…そうだな。すまぬ。"
  event_arkguardian1_04_s_37:
    speaker: dorothy
    en: "... Hmm."
    ko: "…흠."
    ja: "…ふん…"
  event_arkguardian1_04_s_38:
    speaker: rapunzel_o
    en: I know there's no helping it...
    ko: 어쩔 수 없다는 건 알지만….
    ja: 他に道が無いとは分かっていますが…
  event_arkguardian1_04_s_39:
    speaker: rapunzel_o
    en: But I guess we really can't save everyone.
    ko: "…역시, 모두를 구할 순 없군요."
    ja: |-
      …やはり、全てを救うことは
      できないのですね。
  event_arkguardian1_04_s_40:
    speaker: rapunzel_o
    en: When I became a Nikke, I thought I'd be capable of anything.
    ko: 니케가 되었을 때, 뭐든 할 수 있을 것 같았는데.
    ja: |-
      ニケになった時は、
      なんだってできるような気がしたのに…
  event_arkguardian1_04_s_41:
    speaker: rapunzel_o
    en: I feel so powerless...
    ko: 무력하네요.
    ja: 私は無力です。
  event_arkguardian1_04_s_42:
    speaker: hongryeon_o
    en: "... I am of like mind."
    ko: "…동감일세."
    ja: "…同じ気分だ。"
  event_arkguardian1_04_s_43:
    speaker: hongryeon_o
    en: Why am I so feeble thus?
    ko: 나는 어찌하여 이리도 나약한가.
    ja: 私はなぜこうも弱いのだろうな。
  event_arkguardian1_04_s_44:
    speaker: dorothy
    en: Indeed.
    ko: 그러게요.
    ja: そうですね。
  event_arkguardian1_04_s_45:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_s_46:
    speaker: hongryeon_o
    en: Come now, Dorothy. 'Twas but a passing remark. Surely thou dost not truly
      deem me weak?
    ko: |-
      이보게 도로시. 그냥 해본 말 아닌가.
      설마 진짜 내가 약하다고 생각하는 건 아니겠지?
    ja: |-
      待て、ドロシー。それは単なる相づちかい？
      それともドサクサ紛れに私のことを
      弱いと言ったか？
  event_arkguardian1_04_s_47:
    speaker: dorothy
    en: You can't even remember what you said a moment ago.
    ko: 본인이 좀 전에 한 얘기도 기억 못 하시는군요.
    ja: |-
      自分が口に出したばかりのことも
      思い出せないようですね？
  event_arkguardian1_04_s_48:
    speaker: hongryeon_o
    en: Wilt thou step outside with me for a moment?
    ko: 잠깐 따라 나오겠는가?
    ja: 表に出たまえ。
  event_arkguardian1_04_s_49:
    speaker: dorothy
    en: Very well.
    ko: 그러죠.
    ja: いいでしょう。
  event_arkguardian1_04_s_50:
    speaker: hongryeon_o
    en: "... Come again?"
    ko: "…뭣?"
    ja: "…何？"
  event_arkguardian1_04_s_51:
    speaker: dorothy
    en: You told me to step outside with you.
    ko: 따라 나오라면서요.
    ja: ご自分で言ったことでは？
  event_arkguardian1_04_s_52:
    speaker: hongryeon_o
    en: I mean to cross blades with thee.
    ko: 대련할 생각이네만.
    ja: 分かったうえの返答か。
  event_arkguardian1_04_s_53:
    speaker: dorothy
    en: Fine. Let's do it.
    ko: 좋아요. 하죠.
    ja: ええ、望むところです。
  event_arkguardian1_04_s_54:
    speaker: dorothy
    en: Rapunzel, Snow White, mind being our referees?
    ko: 라푼젤. 스노우 화이트. 심판 좀 봐줘요.
    ja: |-
      ラプンツェル、スノーホワイト。
      立ち会いをお願いします。
  event_arkguardian1_04_s_55:
    speaker: dorothy
    en: I fear she might start throwing a fit the moment she loses.
    ko: 진 주제에 바락바락 우길까 봐 걱정이니까.
    ja: |-
      素直に負けを認めていただけないと
      面倒ですので。
  event_arkguardian1_04_s_56:
    speaker: hongryeon_o
    en: Ha! Me?
    ko: 하! 내가?
    ja: フン！言ったな？
  event_arkguardian1_04_s_57:
    speaker: hongryeon_o
    en: Then prepare to prostrate thyself and admit defeat.
    ko: 바닥에 엎드려 패배를 인정할 준비나 하게.
    ja: |-
      土にまみれて負け口上を言う
      支度をしておくがいい。
  event_arkguardian1_04_s_58:
    speaker: dorothy
    en: Heh.
    ko: 후후.
    ja: ふふ…
  event_arkguardian1_04_s_59:
    speaker: snowwhite_o
    en: Oh... Dorothy smiled.
    ko: 어… 도로시가 웃었어요.
    ja: あっ…笑った。
  event_arkguardian1_04_s_60:
    speaker: dorothy
    en: Ah, my apologies. That was simply too absurd I couldn't help myself.
    ko: 아, 실례. 너무 어이가 없어서 저도 모르게 그만.
    ja: |-
      これは失礼。
      あまりにバカバカしかったもので、つい。
  event_arkguardian1_04_s_61:
    speaker: hongryeon_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian1_04_s_62:
    speaker: hongryeon_o
    en: Step outside forthwith!
    ko: 당장 따라 나오게.
    ja: 表だ、今すぐ。
event_arkguardian1_04_e:
  event_arkguardian1_04_e_1:
    speaker: "<Narration>"
    en: Dorothy sinks deep into the sofa of the empty room, staring up at the ceiling.
    ko: |-
      도로시는 아무도 없는 방에서
      소파에 몸을 깊이 묻고 천장을 바라보고 있었다.
    ja: |-
      ドロシーは誰もいない部屋で
      ソファーに身をうずめ、天井を見上げている
  event_arkguardian1_04_e_2:
    speaker: "<Narration>"
    en: Her hollow eyes gaze toward a distant future.
    ko: 공허한 눈동자로 먼 미래를 바라본다.
    ja: うつろな目で、遠い未来を思い浮かべた
  event_arkguardian1_04_e_3:
    speaker: "<Narration>"
    en: A faint smile slowly forms on her lips.
    ko: 그리고 곧, 입가에 미소를 띈다.
    ja: 微笑むように、口の端がゆがむ
  event_arkguardian1_04_e_4:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_5:
    speaker: dorothy
    en: Heh.
    ko: 후후.
    ja: "…ふふ…"
  event_arkguardian1_04_e_6:
    speaker: dorothy
    en: I truly hate this.
    ko: 진짜 싫다.
    ja: うんざりだわ。
  event_arkguardian1_04_e_7:
    speaker: liliweiss
    en: What exactly do you hate so much?
    ko: 뭐가 그렇게 싫을까?
    ja: 何がそんなにイヤなの？
  event_arkguardian1_04_e_8:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_9:
    speaker: liliweiss
    en: If you're startled, can't you at least react like you are?
    ko: 놀랐으면 놀랐다고 리액션 좀 해주면 안 될까?
    ja: 驚いたなら、ちゃんと驚いてくれない？
  event_arkguardian1_04_e_10:
    speaker: dorothy
    en: I didn't think anyone else was here.
    ko: 아무도 없는 줄 알았어요.
    ja: 誰もいないと思っていました。
  event_arkguardian1_04_e_11:
    speaker: liliweiss
    en: Didn't you hear? I even knocked.
    ko: 못 들었구나? 노크도 했어.
    ja: ノックもしたけど？聞こえてなかった？
  event_arkguardian1_04_e_12:
    speaker: dorothy
    en: Oh... I see.
    ko: 그렇… 군요.
    ja: そう…でしたか。
  event_arkguardian1_04_e_13:
    speaker: "<Narration>"
    en: Liliweiss sits across from Dorothy.
    ko: 릴리바이스는 도로시의 맞은편에 앉았다.
    ja: |-
      リリーバイスがドロシーと
      向かい合うように座った
  event_arkguardian1_04_e_14:
    speaker: liliweiss
    en: I heard you sparred with Scarlet, and the result was a draw?
    ko: |-
      홍련과 대련했다며?
      결과는 무승부고.
    ja: |-
      紅蓮と決闘したんだって？
      それも引き分けだったって。
  event_arkguardian1_04_e_15:
    speaker: dorothy
    en: Yes. That's how things turned out.
    ko: 예. 그렇게 됐네요.
    ja: ええ。そうなりました。
  event_arkguardian1_04_e_16:
    speaker: liliweiss
    en: Not bad. You're beginning to show the qualities of the next leader.
    ko: 제법이야. 이제 제법 차기 리더 티가 나는걸?
    ja: すごい。いよいよ次期リーダーって感じ？
  event_arkguardian1_04_e_17:
    speaker: dorothy
    en: I learned from watching you.
    ko: 당신을 보고 배운 거예요.
    ja: あなたを見て覚えました。
  event_arkguardian1_04_e_18:
    speaker: dorothy
    en: And remember—I'm the acting leader right now, but that's all. I'm no successor.
    ko: 그리고 임시 리더잖아요. 차기 리더가 아니라.
    ja: |-
      それに臨時リーダーです。
      次期ではありません。
  event_arkguardian1_04_e_19:
    speaker: liliweiss
    en: "... Hehe."
    ko: "…후후."
    ja: "…ふふ…"
  event_arkguardian1_04_e_20:
    speaker: dorothy
    en: "??"
    ko: "…??"
    ja: "…？？"
  event_arkguardian1_04_e_21:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_22:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arkguardian1_04_e_23:
    speaker: dorothy
    en: Lilith, you don't mean—surely not.
    ko: 릴리스. 당신 설마.
    ja: リリス。あなた、まさか…
  event_arkguardian1_04_e_24:
    speaker: liliweiss
    en: Six months, tops. Could be less if I push myself too hard.
    ko: |-
      길어야 반년.
      격하게 움직이면 더 짧아질 수도 있대.
    ja: |-
      長くて半年。
      無理すればもっと短くなるって。
  event_arkguardian1_04_e_25:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_26:
    speaker: liliweiss
    en: Seriously? If you're surprised can you at least act like it?
    ko: 정말. 놀라면 놀랐다고 리액션 좀 해달라니까.
    ja: もう、驚いたならちゃんと驚いてってば。
  event_arkguardian1_04_e_27:
    speaker: dorothy
    en: "... Is there really no alternative?"
    ko: "…방법은 없나요?"
    ja: "…方法はないのですか？"
  event_arkguardian1_04_e_28:
    speaker: liliweiss
    en: Well... they say if I stay quiet and do nothing, it might be longer.
    ko: 뭐… 아무것도 안 하면서 얌전히 있으면 더 길어질 수도 있다고는 하는데.
    ja: |-
      まあ…何もしないでじっとしてれば
      長くはなるみたいだけど。
  event_arkguardian1_04_e_29:
    speaker: liliweiss
    en: But given the situation, that's not really an option.
    ko: 상황이 상황인 만큼 그럴 수는 없겠지.
    ja: こんな時に、そんなことしてられないし。
  event_arkguardian1_04_e_30:
    speaker: dorothy
    en: You should retire at once and get some rest.
    ko: 당장 은퇴하고 쉬어요.
    ja: 今すぐ退役して、休んでください。
  event_arkguardian1_04_e_31:
    speaker: liliweiss
    en: You know I can't do that.
    ko: 알잖아. 그럴 수 없다는 거.
    ja: 分かってるでしょ？それは無理。
  event_arkguardian1_04_e_32:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_33:
    speaker: dorothy
    en: Are you going to tell everyone?
    ko: 모두에게 얘기할 생각인가요?
    ja: その話、私以外の皆には？
  event_arkguardian1_04_e_34:
    speaker: liliweiss
    en: No. I only meant to tell you.
    ko: 아니. 너한테만 이야기하려고.
    ja: ううん。あなたにだけ話しておこうと思って。
  event_arkguardian1_04_e_35:
    speaker: dorothy
    en: How cruel.
    ko: "…잔인하네요."
    ja: "…残酷ですね。"
  event_arkguardian1_04_e_36:
    speaker: liliweiss
    en: Well, I suppose it's the fate of the next leader.
    ko: 뭐, 차기 리더의 숙명이라고 생각해.
    ja: 悪いけど、次期リーダーの宿命だと思って。
  event_arkguardian1_04_e_37:
    speaker: dorothy
    en: You should at least tell Snow White.
    ko: 스노우 화이트한테는 얘기하는 게 좋을 텐데요.
    ja: スノーホワイトには話しておくべきです。
  event_arkguardian1_04_e_38:
    speaker: liliweiss
    en: Hmm... I don't know if that's the right thing to do.
    ko: 음… 모르겠어. 말하는 게 맞는지.
    ja: うーん…自信がないの。話していいかどうか。
  event_arkguardian1_04_e_39:
    speaker: dorothy
    en: Do you want her to endure the same pain twice?
    ko: 같은 아픔을 두 번이나 겪게 할 생각이신가요.
    ja: 同じ苦しみを2度も味わわせるつもりですか？
  event_arkguardian1_04_e_40:
    speaker: liliweiss
    en: "... I'm not sure if that kid can handle it."
    ko: "…확신이 없어서. 그 아이가 이겨낼 수 있을지."
    ja: |-
      …確信が持てないから。
      乗り越えられるかどうか。
  event_arkguardian1_04_e_41:
    speaker: dorothy
    en: Snow White's not a kid anymore.
    ko: 스노우 화이트는 이제 어린애가 아니에요.
    ja: スノーホワイトはもう子どもではありません。
  event_arkguardian1_04_e_42:
    speaker: dorothy
    en: She's grown so much since then.
    ko: 그날 이후, 많이 성장했어요.
    ja: あの日から、見違えるほど成長しています。
  event_arkguardian1_04_e_43:
    speaker: liliweiss
    en: Heh. To me, everyone is still a kid.
    ko: 후후. 내 눈에는 아직 다들 애라서.
    ja: ふふ。私から見たら、まだみんな子ども。
  event_arkguardian1_04_e_44:
    speaker: dorothy
    en: Even me?
    ko: 저도요?
    ja: 私も含めて？
  event_arkguardian1_04_e_45:
    speaker: liliweiss
    en: I'm only telling you this because I don't think you are.
    ko: 그렇게 생각하지 않으니까 너한테만 이야기하고 있는 거야.
    ja: そうは思ってないから、あなたにだけ話したの。
  event_arkguardian1_04_e_46:
    speaker: dorothy
    en: Sometimes... I wish people would treat me like a kid, too.
    ko: 가끔씩은, 저도 아이 취급받고 싶을 때가 있어요.
    ja: 私にも、子ども扱いされたい時はあります。
  event_arkguardian1_04_e_47:
    speaker: liliweiss
    en: I understand. We all have moments like that.
    ko: 이해해. 그럴 때가 있지.
    ja: 分かる。私もあるから。
  event_arkguardian1_04_e_48:
    speaker: liliweiss
    en: Anyway, just keep this in mind. If anything happens, I'll be counting on you.
    ko: |-
      아무튼 그렇게 알아둬.
      일이 터졌을 때 잘 부탁할게.
    ja: |-
      とにかく、そういうこと。
      何かあった時はお願いね。
  event_arkguardian1_04_e_49:
    speaker: dorothy
    en: What's there to be so scared of? We've got the Commander.
    ko: 지휘관이 있는데 뭐가 걱정인가요.
    ja: 指揮官がいますから、心配は無用でしょう。
  event_arkguardian1_04_e_50:
    speaker: liliweiss
    en: He's likely going to be the one who breaks down the hardest. He's playing
      it cool now, but I'm sure of it.
    ko: |-
      그 사람. 분명 가장 크게 망가질 거야.
      지금은 덤덤한 척하고 있지만, 확실해.
    ja: |-
      ううん、あの人は誰より壊れちゃうと思う。
      今は平気なフリをしてるけど、きっと。
  event_arkguardian1_04_e_51:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_52:
    speaker: liliweiss
    en: Hehe, sorry for dropping all that on you out of nowhere.
    ko: 후후. 갑자기 너무 큰 부담을 줘서 미안해.
    ja: ふふ。急にプレッシャーをかけてごめんね。
  event_arkguardian1_04_e_53:
    speaker: dorothy
    en: When have you not?
    ko: 언제는 안 그랬나요.
    ja: いつものことです。
  event_arkguardian1_04_e_54:
    speaker: liliweiss
    en: So... future leader, what is it you hate so much?
    ko: "…그래서, 우리 차기 리더께서는 뭐가 그렇게 싫을까?"
    ja: |-
      …それで、次期リーダーさんは
      何がそんなにイヤなの？
  event_arkguardian1_04_e_55:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_56:
    speaker: dorothy
    en: Myself.
    ko: 제가요.
    ja: 私自身です。
  event_arkguardian1_04_e_57:
    speaker: liliweiss
    en: "... Hmm?"
    ko: "…응?"
    ja: "…えっ？"
  event_arkguardian1_04_e_58:
    speaker: dorothy
    en: I hate myself. I'm stuck in this loop of self-loathing.
    ko: 제가 싫어서, 자기혐오에 빠져 있었어요.
    ja: 自分が気に入らず、自己嫌悪に陥っています。
  event_arkguardian1_04_e_59:
    speaker: liliweiss
    en: Oh? I didn't see this coming.
    ko: 어머나. 이건 전혀 생각하지 못하고 있었는데.
    ja: うーん…それは予想してなかった答えかも。
  event_arkguardian1_04_e_60:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_61:
    speaker: dorothy
    en: When all this is over... When the Ark is sealed...
    ko: |-
      모든 일이 끝났을 때.
      방주의 밀봉이 다 끝났을 때.
    ja: |-
      すべてが終わり、
      アークの封鎖が完了した後…
  event_arkguardian1_04_e_62:
    speaker: dorothy
    en: We will return and be lauded as heroes.
    ko: 우리는 방주로 돌아가 영웅 대접을 받겠죠.
    ja: |-
      私たちはおそらく、英雄として
      喝采を浴びることになるでしょう。
  event_arkguardian1_04_e_63:
    speaker: dorothy
    en: The ones who defended humanity to the end. Goddesses of Victory. Humanity's
      hope.
    ko: |-
      인류를 끝까지 지켜낸 영웅.
      승리의 여신. 인류의 희망.
    ja: |-
      人類を最後まで守り抜いた英雄。
      勝利の女神。人類の希望。
  event_arkguardian1_04_e_64:
    speaker: dorothy
    en: Our legacy will live on forever. It might even turn into a myth someday.
    ko: |-
      우리의 업적은 길이길이 남겠죠.
      어쩌면 신화에 가까운 뭔가가 될지도 모르죠.
    ja: |-
      歴史に名が残る功績です。
      神話に肩を並べるかもしれません。
  event_arkguardian1_04_e_65:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_66:
    speaker: dorothy
    en: Even if we can't save everyone, we will still be celebrated as heroes back
      in the Ark.
    ko: |-
      모든 사람을 구해내지도 못한 주제에,
      방주에서 영웅 대접을 받겠죠.
    ja: |-
      すべての人を救ったわけでもないくせに、
      祭り上げられて…
  event_arkguardian1_04_e_67:
    speaker: dorothy
    en: And I'll live with that fact, fully content,
    ko: 저는 그 사실에 아주 만족하면서 살 거예요.
    ja: |-
      きっと私はその事実に満足しながら
      生きていくはずです。
  event_arkguardian1_04_e_68:
    speaker: dorothy
    en: telling myself that our fight, my fight, was not in vain.
    ko: 아, 우리의, 나의 싸움은 헛되지 않았구나. 하면서요.
    ja: |-
      ああ、私の、私たちの戦いは
      無駄ではなかった…
      そんなことを考えながら。
  event_arkguardian1_04_e_69:
    speaker: dorothy
    en: That's what I hate.
    ko: 그게 싫어요.
    ja: それが嫌なのです。
  event_arkguardian1_04_e_70:
    speaker: liliweiss
    en: Everyone wants something different out of this.
    ko: 각자 원하는 보상은 다를 수 있어.
    ja: 望むものって人それぞれねぇ。
  event_arkguardian1_04_e_71:
    speaker: dorothy
    en: I know. I still don't like it.
    ko: 알아요. 그래도 싫어요.
    ja: 分かっています。それでも。
  event_arkguardian1_04_e_72:
    speaker: liliweiss
    en: So you're just doing things half-heartedly?
    ko: 그래서 대충 할 거야?
    ja: だから、適当にやり過ごす？
  event_arkguardian1_04_e_73:
    speaker: dorothy
    en: Of course not.
    ko: 그럴 리가요.
    ja: いいえ。
  event_arkguardian1_04_e_74:
    speaker: liliweiss
    en: Then you're good. There won't be any issues in that case.
    ko: 그럼 됐어. 아무 문제 없어.
    ja: それならいいの。何の問題もないと思う。
  event_arkguardian1_04_e_75:
    speaker: dorothy
    en: Thanks.
    ko: 고마워요.
    ja: ありがとうございます。
  event_arkguardian1_04_e_76:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_77:
    speaker: dorothy
    en: You're the only one I could speak to about such things.
    ko: "…이런 얘기를 할 수 있는 사람은 당신이 유일한데."
    ja: "…こんな話ができる人は、あなたしかいません。"
  event_arkguardian1_04_e_78:
    speaker: dorothy
    en: And now, you're leaving.
    ko: 가버린다고요.
    ja: いなくなってしまうのですね。
  event_arkguardian1_04_e_79:
    speaker: liliweiss
    en: Yeah. Looks like it.
    ko: 응. 그렇네.
    ja: うん。そうみたい。
  event_arkguardian1_04_e_80:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_81:
    speaker: dorothy
    en: Don't die, Lilith.
    ko: 죽지 마요. 릴리스.
    ja: 死なないでください。リリス。
  event_arkguardian1_04_e_82:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_83:
    speaker: liliweiss
    en: I don't want to, either.
    ko: 나도 그러고 싶어.
    ja: 私だってそうしたいの。
  event_arkguardian1_04_e_84:
    speaker: "<Narration>"
    en: After finishing her conversation with Dorothy, Liliweiss heads back to her
      room.
    ko: 도로시와의 이야기를 마친 후 릴리바이스는 방으로 돌아가고 있었다.
    ja: |-
      ドロシーと話を終えて、
      リリーバイスは自室に戻ろうとした
  event_arkguardian1_04_e_85:
    speaker: "<Narration>"
    en: She sees Snow White standing by the door, and their eyes meet.
    ko: |-
      문 앞에 서 있는 스노우 화이트를 바라본다.
      눈이 마주친다.
    ja: |-
      扉の前に立っていた
      スノーホワイトと目が合った
  event_arkguardian1_04_e_86:
    speaker: liliweiss
    en: Snow White.
    ko: 스노우 화이트.
    ja: スノーホワイト。
  event_arkguardian1_04_e_87:
    speaker: snowwhite_o
    en: Lilith!
    ko: 아, 언니.
    ja: あ、お姉ちゃん。
  event_arkguardian1_04_e_88:
    speaker: liliweiss
    en: What's wrong? Is there something about the operation you don't understand?
    ko: 무슨 일이야? 작전에 대해 뭐 이해 안 가는 거라도 있어?
    ja: |-
      どうしたの？
      作戦内容で分からないことがあった？
  event_arkguardian1_04_e_89:
    speaker: snowwhite_o
    en: Oh, no. It's not that.
    ko: 아, 아뇨. 그런 건 아닌데.
    ja: い、いいえ。そういうわけじゃないです。
  event_arkguardian1_04_e_90:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_91:
    speaker: snowwhite_o
    en: How are you doing? Are you okay?
    ko: 릴리스 언니. 괜찮아요?
    ja: リリスお姉ちゃん。大丈夫ですか？
  event_arkguardian1_04_e_92:
    speaker: liliweiss
    en: Of course. Why would I not be?
    ko: "…응. 당연히 괜찮지. 왜 그래?"
    ja: "…うん、もちろん。どうかしたの？"
  event_arkguardian1_04_e_93:
    speaker: snowwhite_o
    en: Oh... It's just...
    ko: 아… 그게 음.
    ja: ええと…その。
  event_arkguardian1_04_e_94:
    speaker: snowwhite_o
    en: You seem a little different from your usual self.
    ko: 어쩐지 평소때의 언니랑은 좀 다른 것 같아서요.
    ja: |-
      なんだかいつものお姉ちゃんと
      ちょっと違う気がして…
  event_arkguardian1_04_e_95:
    speaker: liliweiss
    en: Different how? Nothing's changed.
    ko: 다르다니 뭐가? 아무것도 바뀐 거 없는데?
    ja: どこが？いつもと同じでしょ？
  event_arkguardian1_04_e_96:
    speaker: snowwhite_o
    en: Just the vibe, I guess...
    ko: 그… 분위기라던가 뭐 이런 것들이….
    ja: ううん…雰囲気っていうか…
  event_arkguardian1_04_e_97:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_98:
    speaker: liliweiss
    en: Hey, look at me.
    ko: 자, 나 봐봐.
    ja: ね、私を見て。
  event_arkguardian1_04_e_99:
    speaker: snowwhite_o
    en: Uh, okay.
    ko: 어… 예.
    ja: え…はい。
  event_arkguardian1_04_e_100:
    speaker: liliweiss
    en: I look all right, don't I?
    ko: 괜찮아 보이지?
    ja: 何ともないでしょ？
  event_arkguardian1_04_e_101:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_102:
    speaker: snowwhite_o
    en: Hehe. Yes. You're the same Lilith as always.
    ko: 헤헤. 예. 언제나와 똑같은 릴리스 언니네요.
    ja: えへへ。はい、いつものリリスお姉ちゃんです。
  event_arkguardian1_04_e_103:
    speaker: liliweiss
    en: Right?
    ko: 그렇지?
    ja: ね？
  event_arkguardian1_04_e_104:
    speaker: "<Narration>"
    en: Liliweiss pulls Snow White into a tight embrace.
    ko: 릴리바이스는 스노우 화이트를 꼭 끌어안는다.
    ja: リリーバイスはスノーホワイトを抱き寄せた
  event_arkguardian1_04_e_105:
    speaker: snowwhite_o
    en: Oh? Huh?
    ko: 어? 어어?
    ja: え？ええ！？
  event_arkguardian1_04_e_106:
    speaker: liliweiss
    en: Look at you, worrying about me. You're all grown up.
    ko: 언니 걱정도 다 해주고, 우리 스노우 화이트 다 컸네?
    ja: |-
      お姉ちゃんの心配なんて、
      スノーホワイトもすっかり大きくなったね～？
  event_arkguardian1_04_e_107:
    speaker: liliweiss
    en: Aww, you're so adorable. *Ruffles Snow White's hair*
    ko: 으이구 이뻐라. 문질문질문질~
    ja: よしよし、いい子いい子～！
  event_arkguardian1_04_e_108:
    speaker: snowwhite_o
    en: H-hey, stop that! I'm not a kid anymore!
    ko: 하, 하지 마요. 어린애도 아니고.
    ja: |-
      や、やめてください。
      子どもじゃないんですから。
  event_arkguardian1_04_e_109:
    speaker: liliweiss
    en: You're not? Then who is this small, adorable person standing in front of me?
    ko: 어린애가 아니라고? 그럼 이렇게 작고 귀여운 건 뭐야?
    ja: |-
      子どもじゃない？
      こんなに小さくてかわいいのに？
  event_arkguardian1_04_e_110:
    speaker: snowwhite_o
    en: I said s-stop!
    ko: 하, 하지 말라니까요~
    ja: や、やめてくださいってば～！
  event_arkguardian1_04_e_111:
    speaker: liliweiss
    en: Ahaha. Hahaha.
    ko: 아하하. 하하하하.
    ja: ふふふ、あはははっ…！
  event_arkguardian1_04_e_112:
    speaker: "<Narration>"
    en: Snow White.
    ko: 스노우 화이트.
    ja: スノーホワイト――
  event_arkguardian1_04_e_113:
    speaker: "<Narration>"
    en: I'm dying.
    ko: 나는 죽어.
    ja: "――私、死んじゃうの。"
  event_arkguardian1_04_e_114:
    speaker: liliweiss
    en: Haa... all my stress just melted away.
    ko: "…아. 스트레스가 한 번에 다 날아갔네."
    ja: |-
      …あ～、おかげでストレスが
      吹き飛んだって感じ。
  event_arkguardian1_04_e_115:
    speaker: liliweiss
    en: Now, my worrywart, go get some sleep, okay?
    ko: 걱정 많은 우리 스노우 화이트는 어서 자요. 알겠죠?
    ja: |-
      心配してくれるのはいいけど、
      そろそろ寝る時間でしょ？
  event_arkguardian1_04_e_116:
    speaker: snowwhite_o
    en: Okay...
    ko: "…예."
    ja: "…はい。"
  event_arkguardian1_04_e_117:
    speaker: liliweiss
    en: Good. Sleep tight.
    ko: 그래. 잘 자.
    ja: うん。おやすみ。
  event_arkguardian1_04_e_118:
    speaker: snowwhite_o
    en: Good night.
    ko: 안녕히 주무세요.
    ja: おやすみなさい。
  event_arkguardian1_04_e_119:
    speaker: "<Narration>"
    en: Snow White walks away.
    ko: 스노우 화이트가 걸어간다.
    ja: スノーホワイトが歩きだし…
  event_arkguardian1_04_e_120:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_04_e_121:
    speaker: snowwhite_o
    en: Wait, Lilith.
    ko: 아, 릴리스 언니.
    ja: あ、お姉ちゃん。
  event_arkguardian1_04_e_122:
    speaker: liliweiss
    en: Hmm? What's wrong?
    ko: "…응? 왜?"
    ja: "…え？どうしたの？"
  event_arkguardian1_04_e_123:
    speaker: snowwhite_o
    en: I-if anything happens, you have to tell me. All right?
    ko: 호, 혹시나 무슨 일 있으면 꼭 얘기해줘야 해요. 알겠죠?
    ja: あの、もし何かあったら絶対言ってくださいね？
  event_arkguardian1_04_e_124:
    speaker: snowwhite_o
    en: You always end up pushing yourself too hard.
    ko: 언니는 항상 무리하니까.
    ja: お姉ちゃん、いつも無理するから…
  event_arkguardian1_04_e_125:
    speaker: liliweiss
    en: Of course.
    ko: 응. 물론이지.
    ja: うん。そうする。
  event_arkguardian1_04_e_126:
    speaker: "<Narration>"
    en: Snow White lowers her head and disappears down the corridor.
    ko: 스노우 화이트가 고개를 꾸벅 숙이고 복도 너머로 사라진다.
    ja: |-
      スノーホワイトは会釈をして、
      廊下の奥に歩き去った
  event_arkguardian1_04_e_127:
    speaker: "<Narration>"
    en: Liliweiss buries her face in her hands.
    ko: 릴리스는 얼굴을 감싸 쥔다.
    ja: リリスが顔を手で覆った
  event_arkguardian1_04_e_128:
    speaker: liliweiss
    en: Ah...
    ko: 아….
    ja: あ…
  event_arkguardian1_04_e_129:
    speaker: liliweiss
    en: Aargh...
    ko: 아아….
    ja: ああ…
  event_arkguardian1_04_e_130:
    speaker: liliweiss
    en: I don't want to die.
    ko: 죽기 싫다.
    ja: 死にたくないなぁ…
event_arkguardian1_05_s:
  event_arkguardian1_05_s_1:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠구구구…!!
    ja: ゴゴゴゴ…！！
  event_arkguardian1_05_s_2:
    speaker: "<Narration>"
    en: The ground trembles as a deafening roar echoes through the air.
    ko: 지축이 울리며 굉음이 울려 퍼진다.
    ja: 遠くから地響きとともに、大きな音がした
  event_arkguardian1_05_s_3:
    speaker: liliweiss
    en: Here we go.
    ko: 시작됐네.
    ja: 始まったね。
  event_arkguardian1_05_s_4:
    speaker: rapunzel_o
    en: That's quite the sound.
    ko: 굉장한 소리네요.
    ja: すさまじい音です。
  event_arkguardian1_05_s_5:
    speaker: hongryeon_o
    en: Hmph. 'Tis naught but a mere door closing, yet it soundeth as though the earth
      itself doth tremble.
    ko: 기껏해야 문 닫는 소리일 텐데 너무 큰 것 아닌가.
    ja: 扉を閉めるだけのことで、おおげさな音だ。
  event_arkguardian1_05_s_6:
    speaker: dorothy
    en: Try not to make it painfully obvious that you weren't listening during the
      briefing.
    ko: 작전 설명 때 제대로 안 들은 티를 너무 그렇게 내지 마세요.
    ja: |-
      こちらが作戦の説明をしている時に、
      堂々と別の話を始めるのは
      やめていただけますか？
  event_arkguardian1_05_s_7:
    speaker: liliweiss
    en: The supply passage is massive.
    ko: 물자용 통로는 어어어엄청 크거든.
    ja: 物資用のトンネルってすごく大きいの。
  event_arkguardian1_05_s_8:
    speaker: liliweiss
    en: It's a multi-phase sealing process. Of course it's bound to be loud—
    ko: 그걸 몇 중으로 잠그는 작업이니, 소리가 클 수밖에.
    ja: |-
      それを何重にも塞ぐ作業だから、
      これぐらいは当然。
  event_arkguardian1_05_s_9:
    speaker: "<Narration>"
    en: The words have barely left Liliweiss's mouth when, off in the distance, a
      cloud of dust begins to rise.
    ko: |-
      릴리바이스의 말이 끝나기가 무섭게,
      저편에서 먼지구름이 다가오기 시작한다.
    ja: |-
      リリーバイスの言葉が終わりもしないうちに、
      遠くで砂ぼこりが立ち始めた
  event_arkguardian1_05_s_10:
    speaker: snowwhite_o
    en: "... They're coming. A lot of them."
    ko: "…오네요. 엄청 많은데요."
    ja: "…来ますね。すごい量です。"
  event_arkguardian1_05_s_11:
    speaker: commander
    en: Damn Raptures, scurrying around like a bunch of roaches.
    ko: 빌어먹을 랩쳐놈들. 꾸역꾸역 잘도 기어 오는군.
    ja: |-
      クソッタレのラプチャーどもめ。
      しつこい奴らだ。
  event_arkguardian1_05_s_12:
    speaker: commander
    en: Multiple Tyrant-class Raptures confirmed.
    ko: 다수의 타일런트 급이 확인된다.
    ja: タイラント級が多数確認されている。
  event_arkguardian1_05_s_13:
    speaker: commander
    en: Those aren't small fry.
    ko: 잔챙이들은 아니야.
    ja: ザコの群れではないぞ。
  event_arkguardian1_05_s_14:
    speaker: liliweiss
    en: Rapunzel, what's the status?
    ko: 라푼젤. 상황은 어때?
    ja: ラプンツェル、状況は？
  event_arkguardian1_05_s_15:
    speaker: rapunzel_o
    en: The mass-produced units are ready.
    ko: 양산형 분들도 모두 준비 완료 상태에요.
    ja: 量産型も含め、全員準備万端です。
  event_arkguardian1_05_s_16:
    speaker: liliweiss
    en: Good. Now all that's left is to fight.
    ko: 좋아. 이제 싸울 일만 남았네.
    ja: オッケー。あとはやるだけ。
  event_arkguardian1_05_s_17:
    speaker: liliweiss
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  event_arkguardian1_05_s_18:
    speaker: commander
    en: All right.
    ko: 그래.
    ja: ああ。
  event_arkguardian1_05_s_19:
    speaker: commander
    en: Everyone, listen up.
    ko: 다들. 잘 들어라.
    ja: みんな、よく聞いてくれ。
  event_arkguardian1_05_s_20:
    speaker: commander
    en: We're not gods.
    ko: 우리는 신이 아니다.
    ja: 私たちは神ならざる身だ。
  event_arkguardian1_05_s_21:
    speaker: commander
    en: We can't save everyone.
    ko: 모두를 구할 수 없다.
    ja: 全てを救うことはできない。
  event_arkguardian1_05_s_22:
    speaker: commander
    en: But we can save everything we see.
    ko: 대신 우리 눈에 보이는 모든 것들은 구할 수 있다.
    ja: |-
      だが、目の前にいる人々を
      救うことはできる。
  event_arkguardian1_05_s_23:
    speaker: "<Narration>"
    en: The Commander turns around, pointing toward the buildings near the Ark's entrance.
    ko: 지휘관이 뒤로 돌아 방주 입구 근처의 건물들을 가리킨다.
    ja: |-
      指揮官は振り返り、アークの搬入口の
      周囲に密集する建築物を指さした
  event_arkguardian1_05_s_24:
    speaker: commander
    en: See that? That's a temporary bunker.
    ko: 보이나? 임시 벙커다.
    ja: 見えるか？臨時シェルターだ。
  event_arkguardian1_05_s_25:
    speaker: commander
    en: It's called "temporary" because that's exactly what it is.
    ko: 왜 임시라고 이름 붙여졌냐면, 말 그대로 임시기 때문이다.
    ja: |-
      その名の通り、避難してきた人々が
      一時しのぎで集まる場所だ。
  event_arkguardian1_05_s_26:
    speaker: commander
    en: It's so badly constructed rifle rounds can easily penetrate it.
    ko: 소총탄에도 뻥뻥 뚫리는 열악하기 짝이 없는 벙커란 말이다.
    ja: |-
      だが壁に撃たれれば簡単に穴が開くほどの、
      粗末なものにすぎん。
  event_arkguardian1_05_s_27:
    speaker: commander
    en: I don't know how many people are inside, but I'd bet it's a lot.
    ko: |-
      저 안에 몇 명의 사람이 있는지 모른다.
      모르긴 몰라도 무지하게 많겠지.
    ja: |-
      中にどれだけいるかは知らないが、
      多くの人が身を寄せ合っているということは
      確かだ。
  event_arkguardian1_05_s_28:
    speaker: commander
    en: So protect them.
    ko: 지켜라.
    ja: 守れ。
  event_arkguardian1_05_s_29:
    speaker: commander
    en: No matter what happens, protect the people inside.
    ko: 무슨 일이 있어도 지켜라.
    ja: 何があっても守り抜くんだ。
  event_arkguardian1_05_s_30:
    speaker: commander
    en: Don't overthink things.
    ko: 쓸데없는 생각은 집어치워라.
    ja: 余計な考えは捨てろ。
  event_arkguardian1_05_s_31:
    speaker: commander
    en: Thought breeds doubt, and doubt breeds hesitation.
    ko: 생각이 많아지면 걱정이 생기고, 걱정은 망설임이 된다.
    ja: 考えれば不安が生まれ、不安は迷いになる。
  event_arkguardian1_05_s_32:
    speaker: commander
    en: Every time you hesitate, someone in there dies.
    ko: 너희가 망설일 때마다 저쪽에 있는 사람들이 죽을 확률이 올라간다는 걸 알아둬라.
    ja: |-
      君たちが迷うたびに、あそこにいる人々を
      死なせるかもしれないということ、
      肝に銘じておけ。
  event_arkguardian1_05_s_33:
    speaker: "<Narration>"
    en: The Commander turns back again, pointing at the rising cloud of dust in the
      distance.
    ko: 지휘관이 다시 뒤로 돌아, 저편의 먼지구름을 가리킨다.
    ja: |-
      指揮官は向き直り、
      立ちのぼる彼方の砂ぼこりを差し示した
  event_arkguardian1_05_s_34:
    speaker: commander
    en: Focus all your thoughts on them.
    ko: 저것들만 생각해라.
    ja: あれのことだけを考えろ。
  event_arkguardian1_05_s_35:
    speaker: commander
    en: We don't know what those things are or why they're here. But one thing's certain.
    ko: |-
      뭐 하는 놈들인지도 모르고, 정체도 모르는 놈들이지만
      단 하나 확실한 게 있다.
    ja: |-
      目的も正体も分からない奴らだが、
      ひとつだけ確かなことがある。
  event_arkguardian1_05_s_36:
    speaker: commander
    en: They hate us.
    ko: 저것들은 우릴 싫어한다.
    ja: 奴らは私たちを憎んでいる。
  event_arkguardian1_05_s_37:
    speaker: commander
    en: So don't let them do as they please.
    ko: 그러니 저것들이 하고 싶은 대로 하게 두지 마라.
    ja: 奴らの思い通りにはさせるな。
  event_arkguardian1_05_s_38:
    speaker: commander
    en: Don't let those damned scrap heaps take what you love.
    ko: |-
      저 빌어먹을 고철 덩어리들이,
      너희가 사랑하는 것을 빼앗게 두지 마라.
    ja: |-
      忌まわしい鉄くずどもに
      私たちの大切なものを奪わせるな。
  event_arkguardian1_05_s_39:
    speaker: commander
    en: There's no one else but us.
    ko: 우리밖에 없다.
    ja: 私たちがやるしかない。
  event_arkguardian1_05_s_40:
    speaker: commander
    en: It's up to us to stop them from doing what they please.
    ko: 저것들이 하고 싶은 일을 하지 못하게 막을 건 우리밖에 없다.
    ja: 奴らを食い止められるのは、私たちだけだ。
  event_arkguardian1_05_s_41:
    speaker: commander
    en: So no matter what, we must win.
    ko: 그러니 반드시 이겨야 한다.
    ja: 勝つ以外に道はない。
  event_arkguardian1_05_s_42:
    speaker: commander
    en: Show them.
    ko: 알려줘라.
    ja: 思い知らせてやれ。
  event_arkguardian1_05_s_43:
    speaker: commander
    en: Show them who they're trying to steal from.
    ko: 저것들이 감히 누구의 보물을 탐내고 있는지.
    ja: |-
      私たちが大切にしているものに
      手を出せばどうなるか。
  event_arkguardian1_05_s_44:
    speaker: "<Narration>"
    en: Everyone's gaze intensifies as they stare at the Raptures beyond the dust
      cloud.
    ko: |-
      모두의 눈빛이 바뀐다.
      먼지구름 너머의 랩쳐들을 노려본다.
    ja: |-
      目つきの変わった兵士たちが
      砂ぼこりに潜むラプチャーたちを
      にらみ付けた
  event_arkguardian1_05_s_45:
    speaker: "<Narration>"
    en: Their weapons are drawn, and their bodies are tense, poised to charge at any
      moment.
    ko: 무기를 거머쥔다. 당장이라도 달려 나갈 듯 몸에 힘이 실린다.
    ja: |-
      武器を握りしめ、今すぐ飛び出しそうなほど
      身体に力をみなぎらせながら
  event_arkguardian1_05_s_46:
    speaker: commander
    en: Goddess Squad, get ready.
    ko: 갓데스 스쿼드, 레디.
    ja: ゴッデス部隊、レディ…
  event_arkguardian1_05_s_47:
    speaker: commander
    en: Go. Destroy them.
    ko: 가서, 죽여라.
    ja: 行け、殲滅しろ！
event_arkguardian1_05_e:
  event_arkguardian1_05_e_1:
    speaker: "<Narration>"
    en: A hail of silver bullets slice through the battlefield.
    ko: 은색 탄환이 전장을 가로지른다.
    ja: 銀色の弾丸が戦場を貫いた
  event_arkguardian1_05_e_2:
    speaker: "<Narration>"
    en: Liliweiss charges forward, smashing through the swarm of Raptures.
    ko: 릴리바이스는 말 그대로 랩쳐의 무리를 박살 내며 달린다.
    ja: |-
      それはラプチャーの群れを粉砕しながら駆ける
      リリーバイスの姿だ
  event_arkguardian1_05_e_3:
    speaker: "<Narration>"
    en: Every punch sends them flying, scattering them into pieces.
    ko: 아무렇게나 뻗는 주먹에 랩쳐의 무리가 산산조각 나며 날아간다.
    ja: |-
      振るう拳は手当たり次第に
      ラプチャーの群れを吹き飛ばしていった
  event_arkguardian1_05_e_4:
    speaker: "<Narration>"
    en: Ahead, the Raptures are so densely packed that the landscape disappears from
      view.
    ko: 정면에 뒤 풍경이 보이지 않을 정도의 랩쳐들이 보인다.
    ja: |-
      向こう側が見えないほどの
      ラプチャーの群れが立ちふさがったが…
  event_arkguardian1_05_e_5:
    speaker: "<Narration>"
    en: Liliweiss lowers her stance and throws a punch, putting her full weight behind
      it.
    ko: 릴리바이스가 자세를 낮추고, 체중을 실어 주먹을 휘두른다.
    ja: |-
      リリーバイスは腰を落とし、
      体重を乗せた拳を繰り出した
  event_arkguardian1_05_e_6:
    speaker: "<Narration>"
    en: The scenery comes back into view as the Raptures that had filled it vanish.
    ko: |-
      풍경이 드러난다.
      그 앞을 채우고 있던 랩쳐는 더는 보이지 않는다.
    ja: ラプチャーが消し飛び、景色が開ける
  event_arkguardian1_05_e_7:
    speaker: "<Narration>"
    en: She looks down at her hand.
    ko: 릴리바이스는 자신의 손을 내려다본다.
    ja: リリーバイスが自分の手を確かめた
  event_arkguardian1_05_e_8:
    speaker: "<Narration>"
    en: She can still do more.
    ko: 더 할 수 있다.
    ja: まだやれる
  event_arkguardian1_05_e_9:
    speaker: "<Narration>"
    en: With a satisfied smile, she charges forward once again.
    ko: 만족스러운 미소와 함께, 릴리바이스는 다시 달린다.
    ja: |-
      満足げな笑顔を浮かべ、
      リリーバイスは再び戦場に飛び込んでいった
  event_arkguardian1_05_e_10:
    speaker: commander_op_r
    en: Take it easy. People might think you're immortal.
    ko: 살살해. 누가 보면 수명이 무한인 줄 알겠어.
    ja: |-
      ほどほどにしろ。
      本当に不死身だと勘違いされそうだ。
  event_arkguardian1_05_e_11:
    speaker: liliweiss
    en: Come on, you know that's hardly true.
    ko: 그럴 수야 있나요. 보는 눈이 몇 갠데.
    ja: |-
      そうはいきません。
      みんなに見られてるんですから。
  event_arkguardian1_05_e_12:
    speaker: liliweiss
    en: Besides, I'm pacing myself, so don't worry.
    ko: 그리고 적당히 힘 조절하고 있으니까, 걱정하지 말아요.
    ja: ちゃんと加減はしてるので、ご心配なく。
  event_arkguardian1_05_e_13:
    speaker: commander_op_r
    en: Well, I guess you'll handle it just fine on your own.
    ko: 뭐 알아서 잘하겠지.
    ja: ああ、君のことだ、よく分かってるだろうな。
  event_arkguardian1_05_e_14:
    speaker: liliweiss
    en: How's the other side holding up?
    ko: 다른 쪽은 상태가 어때요?
    ja: 他のみんなの調子はどうですか？
  event_arkguardian1_05_e_15:
    speaker: commander_op_r
    en: That's actually why I called.
    ko: 안 그래도 그거 때문에 연락했어.
    ja: ちょうどその連絡だ。
  event_arkguardian1_05_e_16:
    speaker: commander_op_r
    en: Go check on Snow White. She's probably gonna space out again.
    ko: 스노우 화이트 쪽으로 가봐. 걔 또 얼탄다.
    ja: |-
      スノーホワイトの援護に行ってくれ。
      またパニックを起こした。
  event_arkguardian1_05_e_17:
    speaker: liliweiss
    en: On it.
    ko: 알겠어요.
    ja: 了解。
  event_arkguardian1_05_e_18:
    speaker: "<Narration>"
    en: Liliweiss runs, cutting through the Raptures in front of her and arriving
      at Snow White's combat zone.
    ko: 릴리바이스가 달린다. 눈앞의 랩쳐들을 날리고, 스노우 화이트의 전투 구역에 도착한다.
    ja: |-
      リリーバイスは目の前のラプチャーを
      吹き飛ばしながら駆け抜け、
      スノーホワイトの持ち場へ向かった
  event_arkguardian1_05_e_19:
    speaker: liliweiss
    en: Snow White, I'm here.
    ko: 스노우 화이트. 나 왔어.
    ja: スノーホワイト、大丈夫？
  event_arkguardian1_05_e_20:
    speaker: snowwhite_o
    en: Oh, y-you're here?
    ko: 아, 오, 오셨어요?
    ja: あっ、お、お姉ちゃん？
  event_arkguardian1_05_e_21:
    speaker: liliweiss
    en: What's wrong?
    ko: 무슨 문제야?
    ja: 何があったの？
  event_arkguardian1_05_e_22:
    speaker: snowwhite_o
    en: Uh, w-well... three missile pods malfunctioned, so my firepower is—
    ko: |-
      아, 그, 그게.
      미사일 포드 중 3개가 오작동을 일으켜서 화력이…!
    ja: |-
      あ、それが、ええと…
      ミサイルポッドが3つも
      誤作動を起こして火力が…！
  event_arkguardian1_05_e_23:
    speaker: "<Narration>"
    en: Snow White holds her position, using every weapon at her disposal to strike
      in all directions.
    ko: 스노우 화이트는 위치를 잡은 채 모든 무기를 사방으로 쏟아붓고 있었다.
    ja: |-
      スノーホワイトはその場を動かず、
      携行している火器の全てを四方に乱射していた
  event_arkguardian1_05_e_24:
    speaker: "<Narration>"
    en: Before they have any time to react, the Raptures are blown apart by the relentless
      barrage of bullets and missiles.
    ko: 랩쳐들은 사정거리 밖에서 쏟아지는 탄환과 미사일로 인해 아무것도 해보지 못하고 터져나간다.
    ja: |-
      射程外からの弾丸とミサイルの雨が、
      対抗手段を持たないラプチャーへ
      一方的に降り注いでいる
  event_arkguardian1_05_e_25:
    speaker: liliweiss
    en: Now this is what you call wiping them out.
    ko: 흐음. 쓸어버린다는 표현은 이럴 때 쓰는 거겠네.
    ja: うーん…一掃するって言葉がぴったりね。
  event_arkguardian1_05_e_26:
    speaker: snowwhite_o
    en: H-huh?
    ko: 예, 예?
    ja: え、何か言いました？
  event_arkguardian1_05_e_27:
    speaker: liliweiss
    en: Watch out. Eleven o'clock. They're zeroing in on this position.
    ko: 아. 11시 방향. 이쪽을 노리고 있어.
    ja: あ、11時の方向。こっちを狙ってる。
  event_arkguardian1_05_e_28:
    speaker: snowwhite_o
    en: Eek!
    ko: 히, 히이…!
    ja: ひ、ひぃ…！
  event_arkguardian1_05_e_29:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두--!!
    ja: ドドドド――！！
  event_arkguardian1_05_e_30:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: ドカン！
  event_arkguardian1_05_e_31:
    speaker: liliweiss
    en: Three o'clock!
    ko: 3시 방향에도.
    ja: 3時の方向も。
  event_arkguardian1_05_e_32:
    speaker: snowwhite_o
    en: O-on it!
    ko: 예, 예!
    ja: は、はい！
  event_arkguardian1_05_e_33:
    speaker: "<Narration>"
    en: "*Rat-a-tat*"
    ko: 투두두--!!
    ja: ドドドド！！
  event_arkguardian1_05_e_34:
    speaker: "<Narration>"
    en: "*Clink clink clink*"
    ko: 틱. 틱. 틱.
    ja: カチ、カチ、カチッ――
  event_arkguardian1_05_e_35:
    speaker: snowwhite_o
    en: M-my ammo!
    ko: 타, 탄환이…!
    ja: あ、弾丸切れ…！
  event_arkguardian1_05_e_36:
    speaker: liliweiss
    en: It's okay. Stay calm. Your barrage is more than enough for now. You're safe.
    ko: |-
      자자, 괜찮아. 침착하게.
      지금 탄막은 충분해. 너는 안전해.
    ja: |-
      大丈夫。ひと呼吸して、落ち着いて。
      弾幕は十分だし、ここは安全だから。
  event_arkguardian1_05_e_37:
    speaker: snowwhite_o
    en: G-got it!
    ko: 알겠… 어요!
    ja: りょ…了解です！
  event_arkguardian1_05_e_38:
    speaker: "<Narration>"
    en: Snow White tries to reload.
    ko: 스노우 화이트가 재장전을 시도한다.
    ja: スノーホワイトはリロードを試みた
  event_arkguardian1_05_e_39:
    speaker: "<Narration>"
    en: However, her trembling hands fumble the magazine, clanking against the gun's
      body.
    ko: 덜덜 떨리는 손에 잡힌 탄창은, 애꿎은 총몸만 친다.
    ja: |-
      しかし、震える手でつかんだ弾倉が
      銃身に当たって落ちた
  event_arkguardian1_05_e_40:
    speaker: "<Narration>"
    en: Snow White looks up at Liliweiss.
    ko: 스노우 화이트가 릴리바이스를 올려본다.
    ja: スノーホワイトはリリーバイスを見上げた
  event_arkguardian1_05_e_41:
    speaker: liliweiss
    en: You've got to do this on your own. You're a Goddess, aren't you?
    ko: 혼자서 해내야지. 갓데스잖아?
    ja: 一人でできるよね。ゴッデスの一員でしょ？
  event_arkguardian1_05_e_42:
    speaker: snowwhite_o
    en: O-of course. Yes.
    ko: 무, 물론이에요. 예.
    ja: は、はい、できます。
  event_arkguardian1_05_e_43:
    speaker: "<Narration>"
    en: After three failed attempts, she finally manages to reload her weapon. She
      fires her rounds toward the three o'clock direction.
    ko: |-
      3번의 실패가 있었지만, 삽탄에 성공.
      3시 방향을 향해 탄환을 쏟아낸다.
    ja: |-
      それから装填を3回やり直し、
      ようやくリリーバイスが指示した敵に
      攻撃することができた
  event_arkguardian1_05_e_44:
    speaker: liliweiss
    en: Nice job!
    ko: 좋아. 잘했어.
    ja: オッケー、その調子。
  event_arkguardian1_05_e_45:
    speaker: snowwhite_o
    en: Thanks!
    ko: 고, 고맙습니다.
    ja: た、助かりました。
  event_arkguardian1_05_e_46:
    speaker: liliweiss
    en: You've got more than enough firepower—excessively so. It won't matter even
      if three missile pods malfunctioned.
    ko: |-
      지금 화력은 충분해. 오히려 넘칠 정도야.
      미사일 포드 3문 정도는 작동하지 않아도 아무 문제 없어.
    ja: |-
      火力は今ので十分ね。
      ミサイルポッドが3つくらい
      壊れても、大丈夫。
  event_arkguardian1_05_e_47:
    speaker: liliweiss
    en: The Raptures won't even get close to you or attack you.
    ko: 랩쳐들은 너에게 다가오지도, 너를 공격하지도 못해.
    ja: ラプチャーは近づけないし、攻撃も届かない。
  event_arkguardian1_05_e_48:
    speaker: liliweiss
    en: Just keep bombarding them from a safe distance, like you're doing now. You
      copy?
    ko: 지금처럼 안전거리를 유지하면서 계속 퍼부어. 알겠지?
    ja: |-
      このまま安全な距離を保って、
      攻撃を続けて。分かった？
  event_arkguardian1_05_e_49:
    speaker: snowwhite_o
    en: Y-yes! Copy!
    ko: 예, 예! 알겠어요!
    ja: は、はい！分かりました！
  event_arkguardian1_05_e_50:
    speaker: liliweiss
    en: Good. I'm counting on you.
    ko: 그래. 부탁해.
    ja: じゃあ、お願いね。
  event_arkguardian1_05_e_51:
    speaker: snowwhite_o
    en: Yeah!
    ko: 예!
    ja: はい！
  event_arkguardian1_05_e_52:
    speaker: "<Narration>"
    en: Liliweiss leaves, breaking into a run.
    ko: 릴리바이스가 자리를 벗어나 달린다.
    ja: リリーバイスは走り去った
  event_arkguardian1_05_e_53:
    speaker: liliweiss
    en: She still gets flustered when something unexpected arises.
    ko: 예외 상황에 놓이면 당황하는 건 여전하네요.
    ja: |-
      予想外の状態になると
      パニックになっちゃうのは
      相変わらずみたいです。
  event_arkguardian1_05_e_54:
    speaker: commander_op_r
    en: That's why she's always the most prepared before an operation. She knows her
      weaknesses better than anyone.
    ko: |-
      그래서 작전 전에 가장 많은 준비를 해.
      자기 약점을 잘 알고 있는 거지.
    ja: |-
      だから作戦前には
      誰より念入りに準備している。
      自分の短所をよく分かっているようだ。
  event_arkguardian1_05_e_55:
    speaker: liliweiss
    en: I know. But she could stand to be a little bolder.
    ko: 알아요. 그래도 스노우 화이트는 좀 더 대범해질 필요가 있어요.
    ja: |-
      その通りですけど、
      スノーホワイトはもう少し大胆にならないと。
  event_arkguardian1_05_e_56:
    speaker: commander_op_r
    en: Hah. She's already a walking arsenal. Can you imagine if she gets any bolder?
    ko: 하. 지금도 저렇게 걸어 다니는 무기고 같은데 대범해지면 볼만하겠네.
    ja: |-
      フ…今でもまるで歩く武器庫だというのに、
      そうなったら見ものだな。
  event_arkguardian1_05_e_57:
    speaker: commander_op_r
    en: You know, Snow White's kill count just caught up to Dorothy's.
    ko: 그거 알아? 최근 스노우 화이트의 격추 수가 도로시를 따라잡았어.
    ja: |-
      知っていたか？スノーホワイトの撃破数が、
      ドロシーに追いついたぞ。
  event_arkguardian1_05_e_58:
    speaker: liliweiss
    en: Really?
    ko: 정말요?
    ja: 本当ですか？
  event_arkguardian1_05_e_59:
    speaker: commander_op_r
    en: Yeah, she's got the makings of something big. I'm looking forward to seeing
      what she's like in a few years.
    ko: 그래. 크게 될 거다 저 녀석은. 몇 년 후가 기대되는걸.
    ja: |-
      ああ。あいつは大物になる。
      数年後が楽しみだな。
  event_arkguardian1_05_e_60:
    speaker: "<Narration>"
    en: Scarlet charges forward, swinging her sword and cleaving the Raptures in two.
    ko: 달려가며 검을 휘둘러 랩쳐들을 두 동강 내고 있는 홍련을 본다.
    ja: |-
      走りながら剣をふるい、ラプチャーを両断する
      紅蓮の姿がリリーバイスの目に入った
  event_arkguardian1_05_e_61:
    speaker: "<Narration>"
    en: Liliweiss runs alongside Scarlet.
    ko: 릴리바이스는 홍련의 옆에서 나란히 달린다.
    ja: リリーバイスは紅蓮に追いつき、並走した
  event_arkguardian1_05_e_62:
    speaker: liliweiss
    en: Any problems?
    ko: 문제없어?
    ja: 問題ない？
  event_arkguardian1_05_e_63:
    speaker: hongryeon_o
    en: A problem, thou sayest? None at all... Nay!
    ko: 문제는 무슨. 아무런 문제 없… 네!
    ja: 問題など、あるわけなか…ろう！
  event_arkguardian1_05_e_64:
    speaker: "<Narration>"
    en: Without slowing down, Scarlet swings her sword at a heavy armored Rapture.
    ko: 속도를 줄이지 않고 중갑형 랩쳐에게 검을 휘두르는 홍련.
    ja: |-
      紅蓮は速度を落とさず、
      重装甲のラプチャーに斬りつけた
  event_arkguardian1_05_e_65:
    speaker: "<Narration>"
    en: But the blade lodges deep into its body, unable to cut through.
    ko: 하지만 검날이 중갑형 랩쳐의 몸통에 박혀 더 이상 나아가지 않았다.
    ja: だが、刃が厚い装甲に刺さり、抜けなくなった
  event_arkguardian1_05_e_66:
    speaker: hongryeon_o
    en: Tch!
    ko: 칫…!
    ja: チッ…！
  event_arkguardian1_05_e_67:
    speaker: liliweiss
    en: Let me help.
    ko: 도와줄게.
    ja: 手伝ってあげる。
  event_arkguardian1_05_e_68:
    speaker: "<Narration>"
    en: Liliweiss lightly taps the back of Scarlet's sword with her fist.
    ko: 릴리바이스의 주먹이 가볍게 홍련의 칼등을 친다.
    ja: リリーバイスが拳で軽く紅蓮の剣を叩いた
  event_arkguardian1_05_e_69:
    speaker: "<Narration>"
    en: The blade surges forward, slicing the Rapture neatly in half.
    ko: 칼날이 앞으로 나아가며, 랩쳐를 두 동강 낸다.
    ja: |-
      刃がするりと前に進み、
      ラプチャーが二つに裂けた
  event_arkguardian1_05_e_70:
    speaker: liliweiss
    en: Why do you keep obsessing over severing them in two? You can't even do it
      properly.
    ko: |-
      너 왜 자꾸 두 동강에 집착하는 거야?
      제대로 하지도 못하는 거.
    ja: |-
      なんでそこまで真っ二つにこだわるの？
      まだうまくできないのに。
  event_arkguardian1_05_e_71:
    speaker: hongryeon_o
    en: Next time, I shall cleave with greater celerity and might.
    ko: 다음엔 더 빠르고 강하게 베면 그만일세.
    ja: 次は、もっと速く、強く斬るだけだ。
  event_arkguardian1_05_e_72:
    speaker: liliweiss
    en: Just stab or slash the core.
    ko: 그냥 코어를 찌르거나 베면 되잖아.
    ja: |-
      そんなことせずに、
      コアを狙えばいいんじゃない？
  event_arkguardian1_05_e_73:
    speaker: liliweiss
    en: The core and the surrounding area are... relatively softer.
    ko: 코어랑 그 인근은 그 뭐랄까… 상대적으로 연한? 부분이라고.
    ja: |-
      コアとかその周りとかって、なんていうか…
      比較的、薄い？でしょ。
  event_arkguardian1_05_e_74:
    speaker: hongryeon_o
    en: Thus, such would prove naught of my strength.
    ko: 그래서는 나의 강함을 증명할 수 없네.
    ja: それでは私の強さの証明にならぬ。
  event_arkguardian1_05_e_75:
    speaker: hongryeon_o
    en: To strike in one swift stroke is the very essence of true swordsmanship.
    ko: 일도양단이야말로 검의 극의라 할 수 있는 것이니.
    ja: 万物を斬ることこそ、剣の極意だ。
  event_arkguardian1_05_e_76:
    speaker: liliweiss
    en: My, I didn't know we had a sword master in our squad.
    ko: 허이구. 우리 스쿼드에 검호가 있는 줄은 몰랐네.
    ja: |-
      まったく、うちの部隊に
      そんな剣術家さんがいるなんてね。
  event_arkguardian1_05_e_77:
    speaker: liliweiss
    en: Aim for the weak spots. That's the smartest way to fight.
    ko: 약한 곳을 노리고 싸워. 그게 영리한 거야.
    ja: 弱いところを狙う方が、賢いんじゃないの？
  event_arkguardian1_05_e_78:
    speaker: hongryeon_o
    en: Hmph. Pay heed.
    ko: 흥. 잘 보게나.
    ja: ふんっ。見ているといい。
  event_arkguardian1_05_e_79:
    speaker: "<Narration>"
    en: Scarlet adjusts her stance.
    ko: 홍련이 자세를 잡는다.
    ja: 紅蓮が構えを取った
  event_arkguardian1_05_e_80:
    speaker: "<Narration>"
    en: She swings her sword at the advancing heavy armored Rapture.
    ko: 달려드는 중갑형 랩쳐를 향해, 검을 휘두른다.
    ja: |-
      迫りくる重装甲のラプチャーに向かって
      剣がひらめく
  event_arkguardian1_05_e_81:
    speaker: "<Narration>"
    en: "*Slash*"
    ko: 스칵!
    ja: ザンッ！
  event_arkguardian1_05_e_82:
    speaker: "<Narration>"
    en: The Rapture splits in two under the impact of Scarlet's strike.
    ko: 홍련의 검격에 중갑형 랩쳐가 두 동강 나며 쓰러진다.
    ja: ラプチャーが両断され、崩れ落ちた
  event_arkguardian1_05_e_83:
    speaker: liliweiss
    en: Wow...
    ko: 오.
    ja: わあ。
  event_arkguardian1_05_e_84:
    speaker: hongryeon_o
    en: Said I not? Celerity and might are all that is required.
    ko: 말했지 않나. 더 빠르고 강하게 베면 그만인 일이라고.
    ja: |-
      言ったであろう。
      もっと速く、強く斬ればよいだけだ。
  event_arkguardian1_05_e_85:
    speaker: hongryeon_o
    en: Hence, I shall not stoop to such dishonorable acts as striking at feeble spots
      like some craven.
    ko: 그러니 약한 곳을 노리는 비겁한 짓 따위는 하지 않겠네.
    ja: |-
      守りの薄い部分を狙うなどと、
      弱腰な手は使わぬ。
  event_arkguardian1_05_e_86:
    speaker: liliweiss
    en: How amazing!
    ko: 와. 대단해.
    ja: へえ、すごい。
  event_arkguardian1_05_e_87:
    speaker: "<Narration>"
    en: A heavy armored Rapture lunges at Liliweiss.
    ko: 중갑형 랩쳐가 릴리바이스에게 달려든다.
    ja: |-
      別の重装甲型ラプチャーが
      リリーバイスに飛びかかった
  event_arkguardian1_05_e_88:
    speaker: "<Narration>"
    en: She grabs its front leg, twists,
    ko: 릴리바이스는 중갑형 랩쳐의 앞발을 잡고 몸을 살짝 뒤튼다.
    ja: |-
      リリーバイスがその前足をつかみ、
      体を軽くひねる
  event_arkguardian1_05_e_89:
    speaker: "<Narration>"
    en: and slams it to the ground.
    ko: 중갑형 랩쳐가 바닥에 쓰러진다.
    ja: ラプチャーは地面に叩きつけられ…
  event_arkguardian1_05_e_90:
    speaker: "<Narration>"
    en: Then she lifts her foot and lightly stomps on its core.
    ko: 릴리바이스가 발을 든 후 가볍게 중갑형 랩쳐의 코어를 짓밟는다.
    ja: リリーバイスの足がコアを踏みつけた
  event_arkguardian1_05_e_91:
    speaker: "<Narration>"
    en: "*Crack*"
    ko: 빠각-!
    ja: バキッ！
  event_arkguardian1_05_e_92:
    speaker: "<Narration>"
    en: The Rapture goes silent.
    ko: 중갑형 랩쳐가 침묵한다.
    ja: ラプチャーは動かなくなった
  event_arkguardian1_05_e_93:
    speaker: liliweiss
    en: Hmm?
    ko: 흐음?
    ja: どう？
  event_arkguardian1_05_e_94:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_05_e_95:
    speaker: liliweiss
    en: Some have to swing their swords with all their strength to barely take one
      down, while others manage it with just a simple gesture.
    ko: |-
      누구는 온몸을 써서 검을 휘둘러 겨우 잡았는데,
      누구는 간단한 손짓발짓으로 잡아버렸네?
    ja: |-
      必死で剣を振るより、
      こっちの方が簡単だと思うけど？
  event_arkguardian1_05_e_96:
    speaker: liliweiss
    en: That's called fighting smart.
    ko: 이런 게 요령이자 영리하게 싸우는 방법
    ja: 賢く戦うって、そういうこと。
  event_arkguardian1_05_e_97:
    speaker: hongryeon_o
    en: Curse thee, Mecha Destructor...
    ko: 메카 고릴라 놈이….
    ja: メカゴリラめ…
  event_arkguardian1_05_e_98:
    speaker: liliweiss
    en: "... What did you say?"
    ko: "…뭐라고?"
    ja: "…何か言った？"
  event_arkguardian1_05_e_99:
    speaker: hongryeon_o
    en: Begone. Do not dampen the spirits of those who fight with valor.
    ko: 가게나. 잘 싸우고 있는 사람 기죽이지 말고.
    ja: よそへ行け。こちらの手が乱れる。
  event_arkguardian1_05_e_100:
    speaker: "<Narration>"
    en: Scarlet grumbles and charges forward.
    ko: 홍련이 투덜대며 달려 나간다.
    ja: |-
      紅蓮は不満げに何かをつぶやきながら
      駆けていった
  event_arkguardian1_05_e_101:
    speaker: liliweiss
    en: Her obsession with head-on clashes and one-stroke finishes... I don't even
      know what to say.
    ko: 그놈의 정면 승부, 일도양단이 뭐라고 참.
    ja: 真っ向勝負、一刀必殺って、ねぇ…
  event_arkguardian1_05_e_102:
    speaker: commander_op_r
    en: She fights well. While she may struggle in large-scale battles, she's nearly
      unbeatable in one-on-one confrontations.
    ko: |-
      잘 싸우잖아.
      일대 다수에는 상대적으로 약하지만 일대일에서는 무적에 가까워.
    ja: |-
      よく戦えている。
      多数相手には向かないといっても、
      1対1ならほとんど敵なしだ。
  event_arkguardian1_05_e_103:
    speaker: commander_op_r
    en: Put her up against those pesky elite Raptures, and she consistently exceeds
      expectations.
    ko: 번거로운 랩쳐 놈들의 정예랑 붙여놓으면 밥값 이상의 이상은 하지.
    ja: |-
      厄介な精鋭にぶつけるなら、
      彼女以上の適材はいない。
  event_arkguardian1_05_e_104:
    speaker: liliweiss
    en: Nonetheless, she's way too rigid.
    ko: 아무리 그래도 유연성이 너무 부족해요.
    ja: ですが、柔軟性が足りません。
  event_arkguardian1_05_e_105:
    speaker: liliweiss
    en: If she just dropped that stubborn streak of hers, she'd be so much better.
    ko: 저 똥고집만 좀 꺾으면 훨씬 좋아질 텐데.
    ja: もっと臨機応変に考えてほしいところです。
  event_arkguardian1_05_e_106:
    speaker: commander_op_r
    en: Still, she offers excellent cost-efficiency and operational versatility.
    ko: 그래도 가성비랑 범용성이 좋아.
    ja: だが、コスパと使い勝手はいい。
  event_arkguardian1_05_e_107:
    speaker: liliweiss
    en: Cost-efficiency?
    ko: 가성비요?
    ja: コスパ？
  event_arkguardian1_05_e_108:
    speaker: commander_op_r
    en: Look, since she has a mass-produced body, maintenance is easy. Bullets and
      missiles are not necessary.
    ko: 봐봐. 양산형 바디다 보니 유지 보수하기 좋지, 탄환이 필요해 미사일이 필요해.
    ja: |-
      量産型ボディはメンテナンスが簡単だからな。
      それに銃弾もミサイルもいらない。
  event_arkguardian1_05_e_109:
    speaker: commander_op_r
    en: Just drop her in, and she clears the field. What more could a commander ask
      for?
    ko: |-
      그냥 대충 던져놔도 상황이 싹 정리되니까,
      지휘권자로서 저만한 패도 없지.
    ja: |-
      適当に戦場へ放り込んでも敵が減る。
      指揮する立場としては最高だ。
  event_arkguardian1_05_e_110:
    speaker: liliweiss
    en: '... Would you call someone like that a reliable jack-of-all-trades? What''s
      all this talk about "cost-efficiency" anyway?'
    ko: "…믿을 수 있는 만능 인력이라고 해주시겠어요? 가성비가 뭐예요 가성비가."
    ja: |-
      …状況を選ばず頼れる味方ぐらいに
      言ってあげてください。
      コスパなんて言い方はひどすぎます。
  event_arkguardian1_05_e_111:
    speaker: commander_op_r
    en: Enough, let's go check on Rapunzel.
    ko: 그럼 이제 슬슬 라푼젤에게 가볼까.
    ja: |-
      そろそろラプンツェルの様子を
      見にいってくれ。
  event_arkguardian1_05_e_112:
    speaker: liliweiss
    en: Roger.
    ko: 라져.
    ja: 了解。
  event_arkguardian1_05_e_113:
    speaker: "<Narration>"
    en: Liliweiss crouches down to the ground,
    ko: 릴리바이스가 웅크린다.
    ja: リリーバイスは体を縮めると…
  event_arkguardian1_05_e_114:
    speaker: "<Narration>"
    en: then kicks off from the surface, launching herself upward. The entire battlefield
      unfolds before her eyes.
    ko: 지면을 박차고 점프한다. 전장이 한눈에 보인다.
    ja: 地面を強く蹴って跳躍し、上から戦場を一望した
  event_arkguardian1_05_e_115:
    speaker: "<Narration>"
    en: She spots a golden light flashing in the distance and lands in its direction.
    ko: 전장 한편에 황금색 빛이 번쩍이는 곳을 향해 릴리바이스가 착지한다.
    ja: |-
      戦場の一角、金色の光が見える場所へ向かって
      降りてゆく
  event_arkguardian1_05_e_116:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿠웅-!
    ja: ズンッ…！
  event_arkguardian1_05_e_117:
    speaker: rapunzel_o
    en: Lilith.
    ko: 릴리스.
    ja: リリス。
  event_arkguardian1_05_e_118:
    speaker: liliweiss
    en: How are the mass-produced units doing?
    ko: 양산형 분들의 상황은 어때?
    ja: 量産型部隊の状況は？
  event_arkguardian1_05_e_119:
    speaker: rapunzel_o
    en: 32 wounded and zero fatalities so far.
    ko: 현재까지 부상자 32, 사망자 0이예요.
    ja: 現在までで負傷32名、死者はおりません。
  event_arkguardian1_05_e_120:
    speaker: liliweiss
    en: Zero? And only that many wounded? That's incredible.
    ko: 0? 대단한데. 부상자도 그것밖에 없어?
    ja: 誰も？すごい。負傷者もそれだけ？
  event_arkguardian1_05_e_121:
    speaker: rapunzel_o
    en: They're all doing well. It's no wonder they're the elite.
    ko: |-
      다들 잘해주고 계세요.
      괜히 정예분들만 남은 게 아니겠죠.
    ja: |-
      皆さん奮闘してくださっています。
      さすがはこの場に残った精鋭部隊ですね。
  event_arkguardian1_05_e_122:
    speaker: liliweiss
    en: Wonderful. Can we keep it that way?
    ko: 아주 좋아. 계속 유지할 수 있겠어?
    ja: いい感じ。このままいけそう？
  event_arkguardian1_05_e_123:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_05_e_124:
    speaker: rapunzel_o
    en: Every time I step onto the battlefield, I tell myself
    ko: 전장에 나올 때마다 생각해요.
    ja: 戦場に出るたびに、考えています。
  event_arkguardian1_05_e_125:
    speaker: rapunzel_o
    en: that this time, no one will die.
    ko: 이번에야말로 그 누구도 죽지 않게 하겠다고.
    ja: 今度こそは誰一人死なせない、と。
  event_arkguardian1_05_e_126:
    speaker: rapunzel_o
    en: But I fail every time.
    ko: 매번 실패하지만요.
    ja: できた試しはありませんが…
  event_arkguardian1_05_e_127:
    speaker: liliweiss
    en: It just might work this time. I have a good feeling.
    ko: 이번은 가능할 거야. 분위기 좋네.
    ja: 今度は出来るはず。全部うまくいってるよ。
  event_arkguardian1_05_e_128:
    speaker: rapunzel_o
    en: Yes, I'll do my best.
    ko: 예. 힘내볼게요.
    ja: はい、全力を尽くします。
  event_arkguardian1_05_e_129:
    speaker: "<Narration>"
    en: A mass-produced Nikke rushes over, carrying another whose lower body has been
      blown apart.
    ko: 양산형 니케가 하반신이 다 날아간 다른 양산형 니케를 업고 뛰어온다.
    ja: |-
      量産型ニケが、別の量産型ニケの
      上半身だけを背負って走ってきた
  event_arkguardian1_05_e_130:
    speaker: pinne
    en: Rapunzel! Rapunzel!
    ko: 라푼젤 님! 라푼젤 님!
    ja: ラプンツェル様！ラプンツェル様！
  event_arkguardian1_05_e_131:
    speaker: pinne
    en: We've got a critical casualty!
    ko: 중상자 발생입니다!
    ja: 重傷者です！
  event_arkguardian1_05_e_132:
    speaker: rapunzel_o
    en: This way!
    ko: "!! 이리로!"
    ja: "…！！早くこちらへ！"
  event_arkguardian1_05_e_133:
    speaker: pinne
    en: She was hit by a beam weapon! About three minutes ago!
    ko: 빔 병기에 당했어요! 3분 정도 지났고요!
    ja: 3分ほど前、ビーム攻撃による負傷です！
  event_arkguardian1_05_e_134:
    speaker: rapunzel_o
    en: All right! I'll administer first aid!
    ko: 알겠어요! 응급 처치할게요!
    ja: 分かりました！応急処置を行います！
  event_arkguardian1_05_e_135:
    speaker: "<Narration>"
    en: A golden light radiates from Rapunzel's body.
    ko: 황금빛이 라푼젤의 몸에서 뿜어져 나온다.
    ja: ラプンツェルの身体が金色の光を放った
  event_arkguardian1_05_e_136:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_05_e_137:
    speaker: rapunzel_o
    en: First aid's done, but she needs to get to the Repair Center to fully recover.
    ko: 응급 처치는 끝났어요. 하지만 완전 치료는 리페어 센터로 가야 해요.
    ja: |-
      応急処置はできました。
      リペアセンターへ送り、
      治療を受けさせてください。
  event_arkguardian1_05_e_138:
    speaker: rapunzel_o
    en: She won't die if we leave her like this, but she might experience a Mind Switch.
    ko: 이대로 둬도 죽진 않겠지만, 사고 전환이 올 수도 있어요.
    ja: |-
      命に別状はありませんが、
      このままでは思考転換の恐れもあります。
  event_arkguardian1_05_e_139:
    speaker: rapunzel_o
    en: What's your name, Sister?
    ko: 그쪽의 자매님. 성함은요?
    ja: そちらの方…お名前は？
  event_arkguardian1_05_e_140:
    speaker: pinne
    en: Pinne! My name's Pinne!
    ko: 피나! 피나입니다!
    ja: ピナです！ピナと申します！
  event_arkguardian1_05_e_141:
    speaker: rapunzel_o
    en: All right, Sister Pinne. Can you take her to the Repair Center?
    ko: 좋아요. 피나 자매님. 이분을 데리고 리페어 센터로 갈 수 있겠어요?
    ja: |-
      負傷者の方を、リペアセンターまで
      連れていっていただけますか？
  event_arkguardian1_05_e_142:
    speaker: rapunzel_o
    en: As you know, even the rear defense lines aren't safe from the Raptures either.
    ko: 아시겠지만 후방이라고 해도 랩쳐에게서 안전하지 않아요.
    ja: |-
      当然ながら、戦線の後方といっても
      襲撃を受ける可能性はゼロではありません。
  event_arkguardian1_05_e_143:
    speaker: rapunzel_o
    en: Will you be okay?
    ko: 괜찮겠어요?
    ja: できますか？
  event_arkguardian1_05_e_144:
    speaker: pinne
    en: "... I'll try!"
    ko: "…해볼게요!"
    ja: "…やってみます！"
  event_arkguardian1_05_e_145:
    speaker: rapunzel_o
    en: Good. I'm counting on you. Tell them to treat her with the B-2 protocol when
      you get there.
    ko: |-
      알겠어요. 부탁드릴게요.
      리페어 센터로 가면 B-2 사양으로 치료해달라고 해주세요.
    ja: |-
      分かりました、お願いします。
      リペアセンターへ着いたら、
      B-2仕様での治療と伝えてください。
  event_arkguardian1_05_e_146:
    speaker: pinne
    en: B-2, B-2... Got it!
    ko: B-2, B-2… 알겠습니다!
    ja: B-2、B-2…分かりました！
  event_arkguardian1_05_e_147:
    speaker: rapunzel_o
    en: Thank you.
    ko: 부탁드려요.
    ja: よろしくお願いします。
  event_arkguardian1_05_e_148:
    speaker: liliweiss
    en: Should I go? I'd be much faster.
    ko: 내가 갈까? 훨씬 빠를 거야.
    ja: 私が行こうか？その方が早いと思うけど。
  event_arkguardian1_05_e_149:
    speaker: rapunzel_o
    en: It's okay. Just focus on what needs to be done.
    ko: 아뇨. 릴리스는 릴리스의 일을 해주세요.
    ja: いいえ。リリスはご自分のなすべきことを。
  event_arkguardian1_05_e_150:
    speaker: rapunzel_o
    en: Let's end this battle as quickly as possible, even if it's just by a second.
    ko: 1분 1초라도 빨리, 이 전투를 끝내주세요.
    ja: |-
      1分1秒でも早く、
      この戦いを終わらせてください。
  event_arkguardian1_05_e_151:
    speaker: liliweiss
    en: "... All right, leave it to me."
    ko: "…알겠어. 맡겨둬."
    ja: "…分かった。任せて。"
  event_arkguardian1_05_e_152:
    speaker: rapunzel_o
    en: Go now, both of you.
    ko: 둘 다, 가요.
    ja: お二人とも、お願いします。
  event_arkguardian1_05_e_153:
    speaker: pinne
    en: Copy!
    ko: 예!
    ja: はい！
  event_arkguardian1_05_e_154:
    speaker: liliweiss
    en: Roger.
    ko: 라져.
    ja: 了解。
  event_arkguardian1_05_e_155:
    speaker: "<Narration>"
    en: Pinne lifts the wounded Nikke on her back and dashes toward the rear, while
      Liliweiss charges toward the battlefield.
    ko: |-
      피나가 양산형 니케를 둘러업고 후방으로 달려 나가고,
      릴리바이스가 전장을 향해 달려 나간다.
    ja: |-
      ピナは量産型ニケを背負って戦線の後方へ、
      リリーバイスは前方へ飛び出していった
  event_arkguardian1_05_e_156:
    speaker: liliweiss
    en: She's doing great. She knows exactly where everyone should be and what they
      need to do.
    ko: |-
      역시 잘해요.
      각각의 인원이 어디에서 뭘 해야 하는지 확실하게 알고 있어요.
    ja: |-
      さすがですね。
      誰がどう動くべきか、正確に把握しています。
  event_arkguardian1_05_e_157:
    speaker: liliweiss
    en: Clear and decisive, without any hesitation.
    ko: 결단력도 있고, 망설임도 없죠.
    ja: 決断力もあるし、判断に迷いを感じません。
  event_arkguardian1_05_e_158:
    speaker: commander_op_r
    en: Rapunzel is essential for holding the front line. Having her out there makes
      a significant difference.
    ko: |-
      그리고 전선 유지력에 막대한 영향력을 끼치고 있지.
      라푼젤이 있고 없고의 차이는 말 그대로 천지 차이야.
    ja: |-
      戦線の維持力も大きく変わる。
      彼女がいるかいないかは雲泥の差だな。
  event_arkguardian1_05_e_159:
    speaker: commander_op_r
    en: If I had to pick the next leader, it'd be her.
    ko: 차차기 리더를 정한다면 저 녀석일 거다.
    ja: |-
      次の次のリーダーを決めることになったら、
      彼女しかいないだろう。
  event_arkguardian1_05_e_160:
    speaker: liliweiss
    en: I agree.
    ko: 동의해요.
    ja: そうですね。
  event_arkguardian1_05_e_161:
    speaker: liliweiss
    en: But Rapunzel has a critical weakness.
    ko: 하지만 라푼젤은 결정적인 약점이 있어요.
    ja: ただ、大きな懸念があります。
  event_arkguardian1_05_e_162:
    speaker: commander_op_r
    en: Yeah, she gets overly attached to the deaths of others and shows too much
      empathy.
    ko: |-
      맞아. 저 녀석은 타인의 죽음에 너무 매몰된다.
      감정 이입이 심해.
    ja: |-
      ああ。犠牲者に感情移入しすぎだ。
      被害に敏感すぎる。
  event_arkguardian1_05_e_163:
    speaker: liliweiss
    en: A battlefield where lives are snuffed out like candles is not where she belongs.
    ko: 사람 목숨이 촛불처럼 픽픽 쓰러지는 전장에서는 어울리지 않죠.
    ja: |-
      人命がロウソクの火みたいに吹き飛ぶ戦場では
      辛いでしょうね。
  event_arkguardian1_05_e_164:
    speaker: commander_op_r
    en: But that's also why she's able to unleash her true potential.
    ko: 하지만 그게 라푼젤이 능력을 발휘할 수 있는 이유기도 하지.
    ja: |-
      とはいえ、だからこそ
      力を発揮できている部分もある。
  event_arkguardian1_05_e_165:
    speaker: liliweiss
    en: Yes. It's both her strength and her weakness.
    ko: 예. 장점이자 단점이죠.
    ja: ええ。長所でもあり、短所でもあります。
  event_arkguardian1_05_e_166:
    speaker: commander_op_r
    en: So how do we deal with it?
    ko: 어떻게 해결할 거지?
    ja: 君ならどう対応する？
  event_arkguardian1_05_e_167:
    speaker: liliweiss
    en: Well, to be honest, I have no idea when it comes to Rapunzel.
    ko: 글쎄요. 라푼젤의 경우는 진짜 모르겠네요.
    ja: |-
      どうでしょう。
      ラプンツェルに関しては、本当に分かりません。
  event_arkguardian1_05_e_168:
    speaker: commander_op_r
    en: Hmm... Dorothy requested backup.
    ko: 음. 도로시한테 지원 요청이 들어왔다.
    ja: ん？ドロシーから支援要請だ。
  event_arkguardian1_05_e_169:
    speaker: liliweiss
    en: Dorothy? What's going on?
    ko: 도로시한테요? 웬일이래.
    ja: ドロシーから？珍しい。
  event_arkguardian1_05_e_170:
    speaker: "<Narration>"
    en: Liliweiss stops beside Dorothy.
    ko: 릴리바이스가 도로시의 옆에 멈춰 선다.
    ja: リリーバイスがドロシーの側に現れた
  event_arkguardian1_05_e_171:
    speaker: dorothy
    en: You're here.
    ko: 오셨군요.
    ja: 来ましたね。
  event_arkguardian1_05_e_172:
    speaker: liliweiss
    en: What's wrong? It's unusual for you to be calling me.
    ko: 무슨 일이야? 네가 부르다니 별일이네.
    ja: どうしたの？あなたから支援要請なんて。
  event_arkguardian1_05_e_173:
    speaker: dorothy
    en: I want to secure the high ground at ten o'clock, but the path is too dangerous.
    ko: 10시 방향의 저 고지를 확보하고 싶은데, 가는 길이 너무 험해서요.
    ja: |-
      10時の高台を取りたいと考えていますが、
      らちがあきません。
  event_arkguardian1_05_e_174:
    speaker: dorothy
    en: Could you clear the way?
    ko: 좀 뚫어주시겠어요?
    ja: 道を開いていただけますか？
  event_arkguardian1_05_e_175:
    speaker: liliweiss
    en: Leave it to me.
    ko: 맡겨둬.
    ja: 任せて。
  event_arkguardian1_05_e_176:
    speaker: "<Narration>"
    en: Liliweiss steps forward and throws a punch, putting her full weight behind
      it.
    ko: 지면을 내딛고, 체중을 실어 주먹을 날리는 릴리바이스.
    ja: |-
      リリーバイスが大地を踏みしめ、
      体重を乗せた拳を振るった
  event_arkguardian1_05_e_177:
    speaker: "<Narration>"
    en: A thunderous metallic crash echoes, clearing the path ahead.
    ko: 거대한 강철음이 들리며 릴리바이스의 앞길이 뚫린다.
    ja: |-
      はじけ飛ぶ鋼鉄の音とともに、
      リリーバイスの正面に道が生まれた
  event_arkguardian1_05_e_178:
    speaker: liliweiss
    en: There. Done.
    ko: 음. 정리됐어.
    ja: はい、終わり。
  event_arkguardian1_05_e_179:
    speaker: dorothy
    en: Thanks.
    ko: 고마워요.
    ja: 感謝します。
  event_arkguardian1_05_e_180:
    speaker: liliweiss
    en: What else do you need?
    ko: 또 필요한 건?
    ja: 他に何かある？
  event_arkguardian1_05_e_181:
    speaker: dorothy
    en: That will do. You can go now.
    ko: |-
      아. 이제 됐어요.
      볼일 보세요.
    ja: |-
      いいえ。もう十分です。
      他の場所へ向かってください。
  event_arkguardian1_05_e_182:
    speaker: "<Narration>"
    en: Dorothy sprints ahead, gaining the high ground, and then engages the Raptures
      with impressive acrobatic precision.
    ko: |-
      도로시는 뛰어가 고지를 점령한 후,
      아크로바틱한 움직임으로 랩쳐들을 상대한다.
    ja: |-
      すぐに高台を押さえたドロシーは、
      縦横無尽にラプチャーと戦い始めた
  event_arkguardian1_05_e_183:
    speaker: liliweiss
    en: She sure knows how to get people to work to her advantage.
    ko: 사람을 너무 좋을 대로 부려 먹네.
    ja: もう、人使いが荒いんだから。
  event_arkguardian1_05_e_184:
    speaker: commander_op_r
    en: She'll make a great leader. After all, a great leader knows how to use people
      well.
    ko: |-
      좋은 리더가 될거다.
      사람을 잘 굴려야 좋은 리더가 되니까.
    ja: |-
      上に立つ素質がある。
      人を思い通りに転がせてこそ、
      いいリーダーだ。
  event_arkguardian1_05_e_185:
    speaker: liliweiss
    en: True. That's why Dorothy is the best fit for now.
    ko: 맞아요. 그래서 지금으로선 도로시가 제일 적임이죠.
    ja: |-
      その通りですね。
      今の時点ではドロシーが適任です。
  event_arkguardian1_05_e_186:
    speaker: commander_op_r
    en: The east side's getting pushed back.
    ko: 음. 동쪽이 밀린다.
    ja: ふむ、東側が押されているな。
  event_arkguardian1_05_e_187:
    speaker: commander_op_r
    en: Let's take care of it.
    ko: 가서 정리하자고.
    ja: 援護に向かってくれ。
  event_arkguardian1_05_e_188:
    speaker: liliweiss
    en: Copy.
    ko: 예.
    ja: 了解。
  event_arkguardian1_05_e_189:
    speaker: commander_op_r
    en: Take a break if it gets too rough.
    ko: 힘들면 들어가서 좀 쉬고.
    ja: 疲れているなら下がって休んでもいいぞ。
  event_arkguardian1_05_e_190:
    speaker: liliweiss
    en: Can I, though? When the girls are out there fighting with all their hearts?
    ko: 그럴 수야 있나요. 우리 애들이 저렇게 열심히 싸워주고 있는데.
    ja: |-
      そうはいきません。
      みんなが必死に戦ってますから。
  event_arkguardian1_05_e_191:
    speaker: liliweiss
    en: As a leader, I've got to set an example.
    ko: 리더답게, 모범을 보여야 하겠죠.
    ja: リーダーとして、お手本にならないと。
  event_arkguardian1_05_e_192:
    speaker: commander_op_r
    en: All right, then. Go, Mecha Destructor.
    ko: "…좋아. 가라. 메카 고릴라."
    ja: "…そうか。なら暴れてこい、メカゴリラ。"
  event_arkguardian1_05_e_193:
    speaker: liliweiss
    en: I'll just head that way.
    ko: 그쪽으로 갈게요 그냥.
    ja: 今すぐそちらに向かいますね。
  event_arkguardian1_05_e_194:
    speaker: commander_op_r
    en: I was just kidding. No need to take it so seriously.
    ko: 농담이야 농담. 뭘 그렇게 정색을 하시나.
    ja: 冗談だ、冗談。怖い顔はよせ…
event_arkguardian1_06_s:
  event_arkguardian1_06_s_1:
    speaker: liliweiss
    en: Cheers!
    ko: 건배~
    ja: かんぱ～い。
  event_arkguardian1_06_s_2:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 챙-
    ja: カチン――
  event_arkguardian1_06_s_3:
    speaker: hongryeon_o
    en: What be this? Surely, this is not spirits!
    ko: 아니 이게 뭔가. 술이 아니지 않은가.
    ja: 何だいこれは。酒ではないのか。
  event_arkguardian1_06_s_4:
    speaker: liliweiss
    en: We can't be drinking right now. An ambush could happen at any time.
    ko: 언제 습격이 올 지 모르는데 술을 마실 수 없지.
    ja: |-
      いつ襲撃があるかも分からないのに
      酔っぱらっていいワケないでしょ。
  event_arkguardian1_06_s_5:
    speaker: liliweiss
    en: But I asked logistics to bring us some nice drinks.
    ko: 그래도 군수 담당한테 얘기해서 맛있는 음료수로 가져왔어.
    ja: |-
      とびきりいいものを
      用意してもらったんだから、
      文句言わないの。
  event_arkguardian1_06_s_6:
    speaker: hongryeon_o
    en: Hmm... a feast, and yet no wine to grace it?
    ko: 으음… 축하하는 자리에 술이 없다니….
    ja: ふん…祝いの席に酒がないとは…
  event_arkguardian1_06_s_7:
    speaker: dorothy
    en: It wasn't really a battle worth celebrating.
    ko: 축하할 만한 전투는 아니었던 것 같은데요.
    ja: 祝うような戦いではなかったと思いますが。
  event_arkguardian1_06_s_8:
    speaker: rapunzel_o
    en: Achieving zero deaths and sealing 20% of the Ark is quite impressive, in my
      opinion.
    ko: 사망자 0명에, 방주 밀봉 20%면 대단하죠.
    ja: |-
      死者なしでアークの封鎖が20％も
      進んだのですから、大きな戦果だと思います。
  event_arkguardian1_06_s_9:
    speaker: liliweiss
    en: Yes, it was spectacular!
    ko: 그래. 대단한 거 맞아.
    ja: その通りね。皆、よくがんばりました。
  event_arkguardian1_06_s_10:
    speaker: liliweiss
    en: We just need to succeed in the next four battles, like we did today.
    ko: 앞으로 남은 네 번도 오늘처럼 하면 되는 거야.
    ja: 残りの4回も今日みたいにやれば大丈夫。
  event_arkguardian1_06_s_11:
    speaker: hongryeon_o
    en: Well, truth be told, should each battle unfold as hath this day, I would bear
      it fortyfold over.
    ko: 뭐, 솔직히 오늘만 같으면 40번도 더 하겠네.
    ja: この調子なら、あと40回はやれそうだ。
  event_arkguardian1_06_s_12:
    speaker: commander
    en: It's our first major victory in a while. The Central Government is pushing
      the hype hard.
    ko: 오랜만의 대승이라 중앙 정부 쪽에서도 적극 홍보 중이다.
    ja: |-
      久しぶりの大勝利だからな。
      中央政府もハデに宣伝している。
  event_arkguardian1_06_s_13:
    speaker: commander
    en: Morale's climbed across the board. Good work.
    ko: |-
      전반적인 사기가 크게 올랐어.
      고생했다.
    ja: |-
      全体的な士気もかなり向上した。
      皆、ご苦労だった。
  event_arkguardian1_06_s_14:
    speaker: liliweiss
    en: Yeah, you all did great!
    ko: 그래그래. 다들 고생 많았어.
    ja: うん。みんな、本当にお疲れ様。
  event_arkguardian1_06_s_15:
    speaker: snowwhite_o
    en: Lilith, you did the most. You were running all over the place.
    ko: |-
      언니가 제일 고생했잖아요.
      여기저기 뛰어다니고.
    ja: |-
      一番疲れてるのはお姉ちゃんですよ。
      ずっと走り回ってましたよね。
  event_arkguardian1_06_s_16:
    speaker: liliweiss
    en: That's my job, after all.
    ko: 내가 하는 일이 그건데 뭘.
    ja: 私はそういう役目だから。
  event_arkguardian1_06_s_17:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_18:
    speaker: snowwhite_o
    en: Um, about that...
    ko: 저, 그런데.
    ja: あの、ところで…
  event_arkguardian1_06_s_19:
    speaker: snowwhite_o
    en: This might not be the best time, but...
    ko: 아… 이런 자리에서 꺼내기엔 좀 조심스러운데.
    ja: |-
      こんな時に聞くべきことじゃ
      ないかもしれないですけど…
  event_arkguardian1_06_s_20:
    speaker: snowwhite_o
    en: How are you doing? Are you okay?
    ko: 릴리스 언니. 괜찮아요?
    ja: リリスお姉ちゃん。大丈夫ですか？
  event_arkguardian1_06_s_21:
    speaker: liliweiss
    en: Yeah, I'm fine. Why do you ask?
    ko: "…응. 괜찮지. 왜?"
    ja: "…うん。大丈夫だけど、どうして？"
  event_arkguardian1_06_s_22:
    speaker: snowwhite_o
    en: I don't know... but your movements today felt a little different than usual.
    ko: 잘 모르겠는데, 오늘 움직임이 지금까지랑은 좀 달랐던 것 같아서요.
    ja: |-
      なんとなく、今日は動きが
      いつもと少し違うような気がしたんです。
  event_arkguardian1_06_s_23:
    speaker: snowwhite_o
    en: M-maybe it's just my imagination.
    ko: 어… 기, 기분 탓일지도 모르겠지만요.
    ja: ええと…や、やっぱり気のせいかもしれません。
  event_arkguardian1_06_s_24:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_25:
    speaker: liliweiss
    en: "... Well, I did hold back a bit today, so I performed poorly."
    ko: "…글쎄. 오늘 좀 힘 빼고 하긴 했는데, 그렇다고 못하진 않았을걸?"
    ja: |-
      …そうかな。今日は少し力を抜いてたけど、
      やることはできてたでしょ？
  event_arkguardian1_06_s_26:
    speaker: hongryeon_o
    en: Um...
    ko: 뭣.
    ja: 何だと？
  event_arkguardian1_06_s_27:
    speaker: hongryeon_o
    en: Pray tell, Rapunzel, what tally of foes did fall to mine hand and to Lilith's,
      this day past?
    ko: 이보게 라푼젤. 오늘 릴리스와 내 격추 수가 어떻게 되나?
    ja: |-
      ラプンツェル。
      今日のリリスと私の撃破数は？
  event_arkguardian1_06_s_28:
    speaker: rapunzel_o
    en: Oh, right. Lilith had about twenty times more than you.
    ko: 아, 예. 릴리스가 홍련보다 20배 정도 많아요.
    ja: |-
      ええと…はい。
      リリスは紅蓮の20倍ほどです。
  event_arkguardian1_06_s_29:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_30:
    speaker: dorothy
    en: Whoo...
    ko: 후.
    ja: ふっ…
  event_arkguardian1_06_s_31:
    speaker: hongryeon_o
    en: Why dost thou find mirth in this?
    ko: 왜 웃는 건가.
    ja: なぜ笑った。
  event_arkguardian1_06_s_32:
    speaker: dorothy
    en: I'm just cooling my drink. It's too hot.
    ko: 음료수가 뜨거워서 식히는 중인걸요.
    ja: 飲み物を冷ましていただけです。
  event_arkguardian1_06_s_33:
    speaker: hongryeon_o
    en: There be ice within. How then doth it burn?
    ko: 얼음이 들어 있는데 뜨겁긴 뭐가 뜨겁다는 겐가.
    ja: 氷の入った飲み物をか？
  event_arkguardian1_06_s_34:
    speaker: dorothy
    en: I mean, I couldn't exactly say, "I found it amusing seeing you get excited
      only to be let down," could I?
    ko: 솔직하게 [혼자 들떠있다가 실망한 모습이 우스워서요]라고 얘기할 순 없잖아요?
    ja: |-
      「一人で盛り上がって、
      勝手に落ち込んだ様子がおかしくて」
      とは正直に言えないでしょう？
  event_arkguardian1_06_s_35:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_36:
    speaker: dorothy
    en: What now? Do you want me to follow you outside again?
    ko: 왜요? 또 따라 나가요?
    ja: なんです？またいつものですか？
  event_arkguardian1_06_s_37:
    speaker: hongryeon_o
    en: I see we are of one mind. Thou shalt come with me this very instance.
    ko: |-
      말이 잘 통해서 좋군.
      당장 따라 나오게.
    ja: |-
      話が早くて何よりだ。
      今すぐ表へ出たまえ。
  event_arkguardian1_06_s_38:
    speaker: dorothy
    en: Go ahead. I'll catch up.
    ko: 먼저 나가 있어요. 곧 따라갈 테니.
    ja: |-
      先に行っていてください。
      すぐに追いつきますので。
  event_arkguardian1_06_s_39:
    speaker: "<Narration>"
    en: Scarlet grips her sword and heads out.
    ko: 홍련이 검을 쥐어 잡고 밖으로 나간다.
    ja: 紅蓮が剣をつかみ、外へ飛び出した
  event_arkguardian1_06_s_40:
    speaker: "<Narration>"
    en: Dorothy casually takes another sip of her drink.
    ko: 도로시는 음료 한 모금을 우아하게 마셨다.
    ja: |-
      ドロシーは急ぐ様子もなく、
      ドリンクに口を付けた
  event_arkguardian1_06_s_41:
    speaker: dorothy
    en: Finally, some peace and quiet.
    ko: 이제 좀 조용해지겠네요.
    ja: 少しは静かになりましたね。
  event_arkguardian1_06_s_42:
    speaker: rapunzel_o
    en: You're not following her outside?
    ko: 안 따라 나가시나요?
    ja: 放っておくつもりですか？
  event_arkguardian1_06_s_43:
    speaker: dorothy
    en: I'm not. She'll get tired and come back in eventually.
    ko: 안 나가요. 저러다가 지치면 다시 들어오거나 하겠죠.
    ja: |-
      ええ。
      そのうち、待ちくたびれて
      戻ってくるでしょう。
  event_arkguardian1_06_s_44:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_45:
    speaker: rapunzel_o
    en: You're getting better at handling her.
    ko: 도로시는 점점 홍련을 다루는 게 능숙해지는군요.
    ja: ますます紅蓮の扱いに慣れてきていますね。
  event_arkguardian1_06_s_46:
    speaker: rapunzel_o
    en: A rough swordswoman... tamed by a noble lady.
    ko: 다듬어지지 않은 거친 검객이… 고귀한 아가씨에게 길들여져서….
    ja: お嬢様に飼いならされる…無骨な剣士…
  event_arkguardian1_06_s_47:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_48:
    speaker: rapunzel_o
    en: "*Huff, huff*"
    ko: 후우, 후우.
    ja: はぁっ、ふぅ…
  event_arkguardian1_06_s_49:
    speaker: commander
    en: What's with her now? She doesn't even care about timing or place anymore.
    ko: |-
      얘 또 왜 이래.
      이젠 때랑 장소도 안 가리네.
    ja: |-
      ますます悪化してるな。
      もう完全に見境なしだ。
  event_arkguardian1_06_s_50:
    speaker: liliweiss
    en: Red Hood...
    ko: "…레드 후드으…."
    ja: "…レッドフードは本当に…"
  event_arkguardian1_06_s_51:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_52:
    speaker: liliweiss
    en: What are you staring at? You're gonna burn a hole through me.
    ko: 뭘 그렇게 쳐다봐? 닳겠다 얘.
    ja: どうしたの？私をじっと見て。
  event_arkguardian1_06_s_53:
    speaker: snowwhite_o
    en: Are you sure you're really okay, Lilith?
    ko: 릴리스 언니 진짜 괜찮은 거 맞죠?
    ja: 本当に大丈夫なんですよね？
  event_arkguardian1_06_s_54:
    speaker: liliweiss
    en: I told you I'm fine. You worry too much.
    ko: 괜찮다니까. 별걱정을 다 하네.
    ja: 大丈夫だってば。心配のしすぎ。
  event_arkguardian1_06_s_55:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_56:
    speaker: snowwhite_o
    en: All right, then.
    ko: 그럼 됐어요.
    ja: そうですよね…
  event_arkguardian1_06_s_57:
    speaker: snowwhite_o
    en: Can I order more food?
    ko: 저 음식 더 시켜도 되죠?
    ja: あっ、お代わり注文してもいいですか？
  event_arkguardian1_06_s_58:
    speaker: commander
    en: Go ahead. You sure eat a lot. Are you sure those calories don't turn into
      bullets and missiles?
    ko: |-
      시켜 시켜. 무지하게 먹는구만.
      너 혹시 칼로리가 탄환이랑 미사일로 바뀌는 거 아냐?
    ja: |-
      好きなだけ頼め。それにしても大した食欲だ。
      カロリーを弾丸やミサイルに変換しているのか？
  event_arkguardian1_06_s_59:
    speaker: snowwhite_o
    en: They don't...
    ko: "…아닌데요."
    ja: "…違います。"
  event_arkguardian1_06_s_60:
    speaker: dorothy
    en: Oh, that reminds me, Rapunzel. A package came for you earlier.
    ko: |-
      아, 그리고 보니 라푼젤.
      라푼젤 앞으로 택배 하나가 와 있었어요.
    ja: |-
      そういえば、ラプンツェル。
      あなた宛ての荷物が届いていましたよ。
  event_arkguardian1_06_s_61:
    speaker: rapunzel_o
    en: A package?
    ko: 택배요?
    ja: 荷物？
  event_arkguardian1_06_s_62:
    speaker: rapunzel_o
    en: Ah...
    ko: "…아."
    ja: "…あっ。"
  event_arkguardian1_06_s_63:
    speaker: dorothy
    en: "... It looked like a book, so I asked them not to run any scans."
    ko: "…책인 것 같아서, 내부 스캔은 하지 말아 달라고 얘기해놨어요."
    ja: |-
      …中身は本のようでしたので、
      スキャンはしないように伝えておきました。
  event_arkguardian1_06_s_64:
    speaker: dorothy
    en: You should pick it up soon.
    ko: 빨리 찾아가는 걸 추천 드릴게요.
    ja: 早く取りに行った方がいいかと。
  event_arkguardian1_06_s_65:
    speaker: rapunzel_o
    en: O-okay! I'll go get it now!
    ko: 아, 알겠어요! 먼저 가볼게요!
    ja: そ、そうですね！お先に失礼します！
  event_arkguardian1_06_s_66:
    speaker: "<Narration>"
    en: Rapunzel leaves hurriedly.
    ko: 라푼젤이 서둘러 자리를 벗어났다.
    ja: ラプンツェルが大慌てで飛び出していった
  event_arkguardian1_06_s_67:
    speaker: dorothy
    en: Mm...
    ko: 음.
    ja: ふう。
  event_arkguardian1_06_s_68:
    speaker: dorothy
    en: Now, this is a fine evening for dinner.
    ko: 좋은 저녁 식사 자리네요.
    ja: これでゆっくり素敵な時間を過ごせそうです。
  event_arkguardian1_06_s_69:
    speaker: commander
    en: She's the one I'm most afraid of.
    ko: 난 얘가 제일 무서워.
    ja: 私はこいつが一番怖い。
  event_arkguardian1_06_s_70:
    speaker: snowwhite_o
    en: Same here.
    ko: 저도요.
    ja: 同感です。
  event_arkguardian1_06_s_71:
    speaker: liliweiss
    en: Ahahaha.
    ko: 아하하하.
    ja: ふふふふ……
  event_arkguardian1_06_s_72:
    speaker: "<Narration>"
    en: Oswald looks down at the report displayed on his phone.
    ko: 오스왈드는 핸드폰에 출력된 보고서를 바라보았다.
    ja: |-
      オスワルドは携帯端末に表示された
      報告書を閲覧していた
  event_arkguardian1_06_s_73:
    speaker: oswald_o
    en: "... A major victory. Zero casualties."
    ko: "…대승. 사망자 0명."
    ja: "…死亡者なし、大戦果。"
  event_arkguardian1_06_s_74:
    speaker: oswald_o
    en: "... As expected."
    ko: "…역시."
    ja: "…さすがだ。"
  event_arkguardian1_06_s_75:
    speaker: "<Narration>"
    en: A faint smile spread across his previously rigid face.
    ko: 굳어 있던 오스왈드의 얼굴에 옅은 미소가 번졌다.
    ja: オスワルドの硬い表情がわずかに緩んだ
  event_arkguardian1_06_s_76:
    speaker: "<Narration>"
    en: But the next moment, his expression hardens as he moves on to the next report.
    ko: 그러기를 잠시, 다음 보고서를 보며 표정을 굳혔다.
    ja: |-
      だが次の報告書に目を移した瞬間、
      表情は元に戻った
  event_arkguardian1_06_s_77:
    speaker: "<Narration>"
    en: The bold red letters stating "TOP SECRET" highlight the document's importance.
    ko: "[TOP SECRET]이라 쓰인 붉은 글자가 문서의 중요도를 알려주는 듯했다."
    ja: |-
      赤い「TOP SECRET」の文字が
      ただならぬ事態を予感させる
  event_arkguardian1_06_s_78:
    speaker: "<Narration>"
    en: Oswald opens it with a heavy heart,
    ko: 오스왈드는 착잡한 심정으로 문서를 열었다.
    ja: オスワルドは複雑な気分で、本文を確かめた
  event_arkguardian1_06_s_79:
    speaker: "<Narration>"
    en: and scans the contents.
    ko: 오스왈드의 눈이 문서를 훑는다.
    ja: |-
      オスワルドの目がめまぐるしく
      書かれた文字をなぞる
  event_arkguardian1_06_s_80:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_81:
    speaker: oswald_o
    en: Anachiro has been transferred to the Heretic Research Lab.
    ko: 아나키오르는 헬레틱 연구소로 이동.
    ja: アナキオールはヘレティック研究所へ搬送…
  event_arkguardian1_06_s_82:
    speaker: oswald_o
    en: The second generation units... are under investigation for treason.
    ko: 2세대는… 배신자 혐의로 조사 중….
    ja: 第2世代は…反逆の容疑で調査中…
  event_arkguardian1_06_s_83:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_84:
    speaker: oswald_o
    en: That wasn't the impression I got.
    ko: 그런 분위기는 아니었는데.
    ja: そんな様子ではなかった。
  event_arkguardian1_06_s_85:
    speaker: oswald_o
    en: There's still something not right.
    ko: 역시 석연찮아.
    ja: やはり、何かが引っかかる…
  event_arkguardian1_06_s_86:
    speaker: "<Narration>"
    en: A soreness creeps up the back of his neck where he'd once been hit with a
      stun gun.
    ko: 오스왈드는 전기 충격기에 당한 뒷목에 뻐근함을 느꼈다.
    ja: 首筋に残るスタンガンの痕がうずいた
  event_arkguardian1_06_s_87:
    speaker: "<Narration>"
    en: He turns off the phone
    ko: 핸드폰을 끈다.
    ja: オスワルドは端末の画面を消し…
  event_arkguardian1_06_s_88:
    speaker: "<Narration>"
    en: and gazes past the Ark's entrance.
    ko: 방주 입구 너머를 바라본다.
    ja: アークにつながるゲートの奥を見つめた
  event_arkguardian1_06_s_89:
    speaker: "<Narration>"
    en: Something catches his eye.
    ko: 시선 한켠에 뭔가가 들어온다.
    ja: 視界の片隅で何かが動いた
  event_arkguardian1_06_s_90:
    speaker: oswald_o
    en: Huh?
    ko: "…?"
    ja: "…？"
  event_arkguardian1_06_s_91:
    speaker: "<Narration>"
    en: Freesia walks over, holding a tray with both hands.
    ko: 프리시아가 양손에 식판을 든 채 걸어오고 있다.
    ja: |-
      両手でトレイを持ち、こちらに向かってくる
      フリージアの姿だった
  event_arkguardian1_06_s_92:
    speaker: "<Narration>"
    en: She meets Oswald's gaze and smiles.
    ko: 오스왈드와 눈이 마주친 프리시아가 웃는다.
    ja: オスワルドと目が合い、フリージアが笑った
  event_arkguardian1_06_s_93:
    speaker: freesia
    en: Howdy, Mister.
    ko: 아저씨.
    ja: おじさん。
  event_arkguardian1_06_s_94:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_95:
    speaker: freesia
    en: Have you eaten?
    ko: 밥 먹었어?
    ja: ご飯、食べた？
  event_arkguardian1_06_s_96:
    speaker: oswald_o
    en: Freesia.
    ko: 프리시아.
    ja: フリージア。
  event_arkguardian1_06_s_97:
    speaker: oswald_o
    en: What are you doing up here?
    ko: 당신이 왜 여기 있는 겁니까.
    ja: なぜここにいるのです。
  event_arkguardian1_06_s_98:
    speaker: oswald_o
    en: You were supposed to head inside the Ark during the first sealing phase.
    ko: 1차 밀봉 때 방주로 내려가는 걸로 되어 있었을 텐데요.
    ja: |-
      1回目の封鎖でアークへ行くはず
      だったでしょう。
  event_arkguardian1_06_s_99:
    speaker: freesia
    en: "... Have you eaten? If not, let's eat together."
    ko: "…밥 먹었어? 안 먹었으면 나랑 같이 먹자."
    ja: "…ご飯は？まだなら、一緒に食べよ。"
  event_arkguardian1_06_s_100:
    speaker: oswald_o
    en: Freesia.
    ko: 프리시아.
    ja: フリージア。
  event_arkguardian1_06_s_101:
    speaker: freesia
    en: Oh dear... it's all cold now. But I think it's still safe to eat.
    ko: 아… 다 식었네. 그래도 먹는 데는 지장 없지 않을까.
    ja: |-
      あ…もう冷めちゃってる。
      まあ、食べても大丈夫かな。
  event_arkguardian1_06_s_102:
    speaker: freesia
    en: Hmm... this one's still hot. You should take this one.
    ko: |-
      음… 이게 좀 더 따뜻하다.
      아저씨가 이거 먹어.
    ja: |-
      あっ…これ、まだちょっと温かいから、
      おじさんが食べて。
  event_arkguardian1_06_s_103:
    speaker: oswald_o
    en: Freesia.
    ko: 프리시아.
    ja: フリージア。
  event_arkguardian1_06_s_104:
    speaker: freesia
    en: When are you going down, Mister?
    ko: 아저씨는 언제 내려가?
    ja: おじさんはいつ行くの？
  event_arkguardian1_06_s_105:
    speaker: oswald_o
    en: I'm going down during the fifth sealing.
    ko: 저는 5차 밀봉 때 내려갈 예정입니다.
    ja: 5回目の時の予定です。
  event_arkguardian1_06_s_106:
    speaker: freesia
    en: Then I'll go down with you when that time comes.
    ko: 그럼 그때 같이 갈게.
    ja: じゃあ、その時一緒に行く。
  event_arkguardian1_06_s_107:
    speaker: oswald_o
    en: No. It's too dangerous.
    ko: 안 됩니다. 위험합니다.
    ja: いけません。危険です。
  event_arkguardian1_06_s_108:
    speaker: freesia
    en: It's okay.
    ko: 괜찮아.
    ja: 大丈夫だよ。
  event_arkguardian1_06_s_109:
    speaker: freesia
    en: The Goddess squad will protect me.
    ko: 그리고 갓데스 언니들이 지켜줄 텐데.
    ja: ゴッデスのお姉ちゃんたちが守ってくれるもん。
  event_arkguardian1_06_s_110:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_111:
    speaker: freesia
    en: Mister, aren't you hungry?
    ko: 아저씨. 배 안 고파?
    ja: おじさん、お腹空いてないの？
  event_arkguardian1_06_s_112:
    speaker: oswald_o
    en: Freesia.
    ko: 프리시아.
    ja: フリージア。
  event_arkguardian1_06_s_113:
    speaker: oswald_o
    en: I can't be your family.
    ko: 저는 당신의 가족이 될 수 없습니다.
    ja: 私はあなたの家族にはなれません。
  event_arkguardian1_06_s_114:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_115:
    speaker: oswald_o
    en: I became your guardian on a whim, but we cannot live together.
    ko: |-
      제 변덕으로 인해 당신의 보호자가 되었지만,
      함께 지낼 수 없습니다.
    ja: |-
      気の迷いで保護者にはなってしまいましたが、
      一緒にいることはできません。
  event_arkguardian1_06_s_116:
    speaker: oswald_o
    en: We will neither dine together nor share a home.
    ko: |-
      당신의 앞에서 밥을 먹을 일도,
      당신과 같은 집에 살 일도 없을 겁니다.
    ja: |-
      あなたと食事をすることも、
      同じ家で暮らすこともしません。
  event_arkguardian1_06_s_117:
    speaker: freesia
    en: Then... where will I live?
    ko: 그럼… 어디서 사는데?
    ja: じゃあ…お家はどうするの？
  event_arkguardian1_06_s_118:
    speaker: oswald_o
    en: The Ark has a home prepared just for you.
    ko: 방주에 마련된 집은 당신 혼자만의 집입니다.
    ja: |-
      アークへ行けば、
      あなた一人で住むための家があります。
  event_arkguardian1_06_s_119:
    speaker: oswald_o
    en: It should be comfortable enough to live in.
    ko: 지내기에 나쁘지 않을 겁니다.
    ja: 生きていくのに困ることはないでしょう。
  event_arkguardian1_06_s_120:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_121:
    speaker: oswald_o
    en: Freesia, go down during the next sealing.
    ko: 프리시아. 다음 밀봉 때 내려가세요.
    ja: フリージア。次の封鎖の時に行ってください。
  event_arkguardian1_06_s_122:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_123:
    speaker: freesia
    en: Eat with me. Then I will.
    ko: 같이 밥 먹어. 그럼 그렇게 할게.
    ja: 一緒に食べよ。そしたら、言う通りにするから。
  event_arkguardian1_06_s_124:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_s_125:
    speaker: "<Narration>"
    en: Oswald reaches for the tray that Freesia had brought
    ko: 오스왈드는 프리시아가 가져온 식판으로 손을 뻗었다.
    ja: オスワルドはトレイに手を伸ばし…
  event_arkguardian1_06_s_126:
    speaker: "<Narration>"
    en: and finishes his meal quickly.
    ko: 빠르게 식사를 마친다.
    ja: すぐに食事を済ませた
  event_arkguardian1_06_s_127:
    speaker: freesia
    en: It's been a while since I've eaten with someone else.
    ko: 이렇게 딴 사람이랑 같이 밥 먹는 거 오랜만이야.
    ja: 誰かと一緒にご飯を食べるなんて、久しぶり。
  event_arkguardian1_06_s_128:
    speaker: oswald_o
    en: Aren't there other refugees?
    ko: 다른 피난민들이 있지 않습니까.
    ja: 他にも避難してきている人たちはいるでしょう。
  event_arkguardian1_06_s_129:
    speaker: freesia
    en: They all have someone to eat with.
    ko: 다들 같이 먹는 사람 있어.
    ja: みんなはもう一緒に食べる人がいるから。
  event_arkguardian1_06_s_130:
    speaker: freesia
    en: They're always chatting about fun stuff and laughing while they eat,
    ko: |-
      다 재밌는 얘기 하면서 먹나 봐.
      엄청 웃어.
    ja: |-
      楽しそうに話してるの。
      いつも笑顔で。
  event_arkguardian1_06_s_131:
    speaker: freesia
    en: so it feels awkward to ask if I can join in.
    ko: 그래서 같이 먹자고 하기 힘들어.
    ja: だから、入りづらくて。
  event_arkguardian1_06_s_132:
    speaker: freesia
    en: Since you're usually on your own, I thought I'd eat with you instead.
    ko: 아저씨는 항상 혼자 있고 하니까, 같이 먹으려고 왔어.
    ja: おじさんはいつも一人だから、いいでしょ。
  event_arkguardian1_06_s_133:
    speaker: freesia
    en: Have you finished eating?
    ko: 다 먹었어?
    ja: もう食べ終わった？
  event_arkguardian1_06_s_134:
    speaker: oswald_o
    en: Yes.
    ko: 예.
    ja: ええ。
  event_arkguardian1_06_s_135:
    speaker: freesia
    en: Here, this is for you.
    ko: 이거 줄게.
    ja: これ、あげる。
  event_arkguardian1_06_s_136:
    speaker: "<Narration>"
    en: Freesia holds out a worn glove,
    ko: 프리시아가 낡은 장갑을 내민다.
    ja: フリージアが古い手袋を差し出した
  event_arkguardian1_06_s_137:
    speaker: "<Narration>"
    en: one signed by Red Hood.
    ko: 레드 후드가 사인한 낡은 장갑이다.
    ja: レッドフードのサインが入っている
  event_arkguardian1_06_s_138:
    speaker: oswald_o
    en: "... I cannot accept this."
    ko: "…받을 수 없습니다."
    ja: "…それは受け取れません。"
  event_arkguardian1_06_s_139:
    speaker: freesia
    en: It's my way of thanking you for being my guardian.
    ko: 내 보호자가 되어준 보답이야.
    ja: 保護者になってくれたお礼。
  event_arkguardian1_06_s_140:
    speaker: freesia
    en: You like the Goddess squad, right?
    ko: 좋아하지? 갓데스 언니들.
    ja: 嫌いなの？ゴッデスのお姉ちゃんたち。
  event_arkguardian1_06_s_141:
    speaker: oswald_o
    en: Yes.
    ko: 예.
    ja: いえ。
  event_arkguardian1_06_s_142:
    speaker: freesia
    en: Then take it.
    ko: 그럼 받아 줘.
    ja: じゃあ受け取って。
  event_arkguardian1_06_s_143:
    speaker: "<Narration>"
    en: Oswald accepts the worn glove.
    ko: 낡은 장갑을 받아 든다.
    ja: 手袋が渡された
  event_arkguardian1_06_s_144:
    speaker: freesia
    en: Thank you for saving me, Mister.
    ko: 살려줘서 고마워. 아저씨.
    ja: 助けてくれてありがとう、おじさん。
  event_arkguardian1_06_s_145:
    speaker: "<Narration>"
    en: Freesia picks up the tray and walks toward the camp.
    ko: 프리시아는 식판을 들고 일어나 캠프 쪽으로 걸어간다.
    ja: |-
      フリージアがトレイを持って立ち上がり、
      キャンプに戻っていった
  event_arkguardian1_06_s_146:
    speaker: "<Narration>"
    en: Her shoulders tremble faintly, but Oswald pretends not to notice.
    ko: 미세하게 떨리는 어깨를, 오스왈드는 애써 모른척했다.
    ja: |-
      細かく震える彼女の肩から、
      オスワルドは必死に目をそらした
  event_arkguardian1_06_s_147:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠구구구구…!!
    ja: ゴゴゴゴゴ――
  event_arkguardian1_06_s_148:
    speaker: commander_op_r
    en: The second sealing has begun.
    ko: 2차 밀봉이 시작됐다.
    ja: 第2次封鎖が始まった。
  event_arkguardian1_06_s_149:
    speaker: commander_op_r
    en: Let's aim for another big win, just like we did last time.
    ko: 이전처럼 대승을 거둬보자고.
    ja: 前回と同じだ、大勝利を目指す。
  event_arkguardian1_06_s_150:
    speaker: liliweiss
    en: All right, let's give it our all, shall we?
    ko: 좋아. 힘내서 가볼까?
    ja: よーし。準備はいい？
  event_arkguardian1_06_s_151:
    speaker: snowwhite_o
    en: Yeah!
    ko: 예!
    ja: はい！
  event_arkguardian1_06_s_152:
    speaker: dorothy
    en: "... There's a lot of them."
    ko: "…수가 많군요."
    ja: "…すさまじい数です。"
  event_arkguardian1_06_s_153:
    speaker: liliweiss
    en: It seems like the Raptures must have sensed something here.
    ko: 아무래도 랩쳐 쪽에서도 여기에 뭔가 있다고 느낀 거겠지.
    ja: |-
      あっちもここで何かしてるって
      勘づいたんでしょうね。
  event_arkguardian1_06_s_154:
    speaker: commander_op_r
    en: It's only a few Tyrant-class Raptures at most. Nothing to worry about.
    ko: |-
      끽해봐야 타일런트 급 몇 대 더 추가된 정도다.
      걱정할 건 없어.
    ja: |-
      なに、タイラント級が少し増えたぐらいだ。
      心配は必要ない。
  event_arkguardian1_06_s_155:
    speaker: hongryeon_o
    en: Methinks a Tyrant-class should count as a hundred foes felled, should it not?
    ko: 생각해 봤는데, 타일런트 급은 격추 수 100대로 쳐야 하지 않겠나?
    ja: |-
      思うに、大物は100体分として
      撃破数を数えるべきではないかい？
  event_arkguardian1_06_s_156:
    speaker: rapunzel_o
    en: That seems fair, but they're honestly worth way more.
    ko: 그게 맞을지도요. 실제로는 그 이상이긴 하지만요.
    ja: |-
      それでもよいぐらいかもしれません。
      実際にはそれ以上だと思いますが。
  event_arkguardian1_06_s_157:
    speaker: hongryeon_o
    en: Excellent. My spirit stirs with renewed vigor.
    ko: 좋아. 의욕이 나는군.
    ja: よし。面白くなってきたぞ。
  event_arkguardian1_06_s_158:
    speaker: commander_op_r
    en: We've spotted Ultra among the Tyrant-class Raptures.
    ko: 타일런트 급에서 울트라를 확인했다.
    ja: タイラント級の中にウルトラが確認された。
  event_arkguardian1_06_s_159:
    speaker: commander_op_r
    en: Be mindful of corruption during combat.
    ko: "…침식에 유의하며 전투하도록."
    ja: "…侵食にはくれぐれも気を付けてくれ。"
  event_arkguardian1_06_s_160:
    speaker: liliweiss
    en: Roger.
    ko: 라져.
    ja: 了解。
  event_arkguardian1_06_s_161:
    speaker: liliweiss
    en: Okay, everyone. Let's give it our best once again.
    ko: 자, 얘들아. 그럼 또 힘내서 가볼까?
    ja: さっ、みんな。張り切っていきましょ？
event_arkguardian1_06_e:
  event_arkguardian1_06_e_1:
    speaker: liliweiss
    en: Clear.
    ko: 상황 종료.
    ja: 状況終了。
  event_arkguardian1_06_e_2:
    speaker: liliweiss
    en: Rapunzel, status?
    ko: 라푼젤. 상황은?
    ja: ラプンツェル、被害は？
  event_arkguardian1_06_e_3:
    speaker: rapunzel_o
    en: 34 dead and 84 wounded...
    ko: "…사망자 34명. 부상자 84명이에요."
    ja: "…死者34名、負傷84名です。"
  event_arkguardian1_06_e_4:
    speaker: liliweiss
    en: "... Got it."
    ko: "…그래. 알겠어."
    ja: "…そう、分かった。"
  event_arkguardian1_06_e_5:
    speaker: rapunzel_o
    en: Let's recover the bodies first and—
    ko: 일단 사망자분들을 수습하고
    ja: ひとまず、遺体の回収を…
  event_arkguardian1_06_e_6:
    speaker: commander_op_r
    en: Wait. There's something out there.
    ko: 잠깐. 뭔가 있는 것 같은데.
    ja: 待て。何か来る。
  event_arkguardian1_06_e_7:
    speaker: liliweiss
    en: What?
    ko: 예?
    ja: えっ？
  event_arkguardian1_06_e_8:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 푸슝--!!
    ja: バシュッ――！！
  event_arkguardian1_06_e_9:
    speaker: "<Narration>"
    en: Rapunzel collapses.
    ko: 라푼젤이 쓰러진다.
    ja: ラプンツェルが倒れた
  event_arkguardian1_06_e_10:
    speaker: "<Narration>"
    en: Half her shoulders and upper body are gone.
    ko: 어깨와 상반신 절반이 사라져있었다.
    ja: 上半身の半分が肩もろとも消し飛んでいる
  event_arkguardian1_06_e_11:
    speaker: snowwhite_o
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arkguardian1_06_e_12:
    speaker: commander_op_r
    en: Sniper! Take cover!
    ko: 저격이다! 엄폐!
    ja: 狙撃か！？全員ハイド！
  event_arkguardian1_06_e_13:
    speaker: "<Narration>"
    en: Light pours down from the sky like rain.
    ko: 공중에서 빛이 비처럼 쏟아져 내려온다.
    ja: たて続けに空から光が雨のように降り注いだ
  event_arkguardian1_06_e_14:
    speaker: commander_op_r
    en: Damn it! It's an airstrike!
    ko: 이런 젠장! 폭격이다!
    ja: チッ！爆撃か！
  event_arkguardian1_06_e_15:
    speaker: "<Narration>"
    en: "*Boom boom boom boom!*"
    ko: 콰과과과과광---!!
    ja: ドガガガガガ――！！
  event_arkguardian1_06_e_16:
    speaker: liliweiss
    en: Beam weapons!?
    ko: 빔 병기…!?
    ja: ビーム兵器…！？
  event_arkguardian1_06_e_17:
    speaker: snowwhite_o
    en: Aaargh!
    ko: 으, 으아아…!!
    ja: う、うわわわ…！！
  event_arkguardian1_06_e_18:
    speaker: dorothy
    en: Scarlet! Rapunzel!
    ko: 홍련! 라푼젤을!
    ja: 紅蓮！ラプンツェルを！
  event_arkguardian1_06_e_19:
    speaker: hongryeon_o
    en: I stand as her protector!
    ko: 지키고 있네!
    ja: 確保している！
  event_arkguardian1_06_e_20:
    speaker: "<Narration>"
    en: The bombardment stops.
    ko: 폭격이 멎는다.
    ja: 爆撃が止んだ
  event_arkguardian1_06_e_21:
    speaker: liliweiss
    en: Commander! Give me a location!
    ko: 지휘관! 위치!
    ja: 指揮官！方角は！？
  event_arkguardian1_06_e_22:
    speaker: commander_op_r
    en: Two o'clock.
    ko: 2시 방향.
    ja: 2時の方向…
  event_arkguardian1_06_e_23:
    speaker: commander_op_r
    en: "... 20 meters up."
    ko: "…상공 20m."
    ja: "…20メートル上だ。"
  event_arkguardian1_06_e_24:
    speaker: liliweiss
    en: "... Up?"
    ko: "…상공?"
    ja: "…上？"
  event_arkguardian1_06_e_25:
    speaker: "<Narration>"
    en: Everyone looks up at the sky.
    ko: 모두의 시선이 하늘을 바라본다.
    ja: 全員が空を見上げた
  event_arkguardian1_06_e_26:
    speaker: "<Narration>"
    en: A Nikke clad in black armor hovers above, staring down at them.
    ko: 검은색 갑주를 입은 니케가 부유한 채 일행을 내려다보고 있다.
    ja: |-
      黒い装甲を身にまとったニケらしき影が
      宙に浮かび、こちらを見下ろしている
  event_arkguardian1_06_e_27:
    speaker: "<Narration>"
    en: She lands lightly and looks toward the Goddess squad.
    ko: |-
      검은 니케가 가볍게 지상에 착지한다.
      갓데스를 바라본다.
    ja: |-
      それはゆったりと地上に降り立ち、
      ゴッデスを見すえた
  event_arkguardian1_06_e_28:
    speaker: liliweiss
    en: Solo beam bombardment... Levitation abilities...
    ko: "…단독으로 빔 병기를 폭격 규모로 사용. 자가 부상 능력."
    ja: "…単独でのビーム兵器による爆撃と、浮遊能力…"
  event_arkguardian1_06_e_29:
    speaker: liliweiss
    en: Nikke-like appearance, tactical understanding prioritizing sniping support
      and recovery units first.
    ko: 니케의 외형. 보조와 회복 담당을 먼저 저격한 전술 이해력.
    ja: |-
      ニケの外見に、補助・治療要員を
      優先して狙撃する戦術理解力…
  event_arkguardian1_06_e_30:
    speaker: liliweiss
    en: "... It's a Heretic."
    ko: "…헬레틱이네."
    ja: "…ヘレティック。"
  event_arkguardian1_06_e_31:
    speaker: hongryeon_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian1_06_e_32:
    speaker: snowwhite_o
    en: Aaargh!
    ko: 으아아아--!!
    ja: うわあああッ――！！
  event_arkguardian1_06_e_33:
    speaker: "<Narration>"
    en: Snow White's entire array of weapons comes to life with a roar.
    ko: 스노우 화이트의 모든 무장이 불을 뿜는다.
    ja: |-
      スノーホワイトが手当たり次第の攻撃を
      叩き込んだ
  event_arkguardian1_06_e_34:
    speaker: "<Narration>"
    en: The Heretic staggers under the barrage of explosions.
    ko: 검은 헬레틱은 폭발에 휘말려 몸이 이리저리 휘청인다.
    ja: 爆風に飲まれ、ヘレティックのボディが踊る
  event_arkguardian1_06_e_35:
    speaker: "<Narration>"
    en: Her frame splinters, and her armor tears apart, catching on fire.
    ko: 뼈대가 부서지고, 외장이 뜯겨져 나가고 불에 탄다.
    ja: 骨格が砕け、外装が焼け剥がれた
  event_arkguardian1_06_e_36:
    speaker: "<Narration>"
    en: "*Crack, crack*"
    ko: 쿠득- 쿠드드득--
    ja: ズリッ、ギシギシ――
  event_arkguardian1_06_e_37:
    speaker: "<Narration>"
    en: However, she regenerates as if nothing happened.
    ko: 하지만, 아무렇지도 않게 몸을 수복한다.
    ja: |-
      そう思った次の瞬間、
      ボディは元通りになっていた
  event_arkguardian1_06_e_38:
    speaker: snowwhite_o
    en: "... Huh?"
    ko: "…어?"
    ja: "…え？"
  event_arkguardian1_06_e_39:
    speaker: liliweiss
    en: She even has the ability to self-repair. That's so unfair.
    ko: 자가 수복 능력까지. 너무 사기 아냐?
    ja: |-
      おまけに、自己修復能力…
      インチキされてる気分ね？
  event_arkguardian1_06_e_40:
    speaker: hongryeon_o
    en: It matters not! A swift cleave shall end her life!
    ko: 그래봤자! 잘라내면 그만일 뿐!
    ja: それがどうした！八つ裂きにすればいいだけだ！
  event_arkguardian1_06_e_41:
    speaker: "<Narration>"
    en: Scarlet closes the distance in an instant and swings her blade.
    ko: 홍련이 단숨에 접근해 검을 휘두른다.
    ja: 紅蓮が一気に距離を縮め、剣を振る
  event_arkguardian1_06_e_42:
    speaker: "<Narration>"
    en: The Heretic raises her arm to block the strike.
    ko: 검은 헬레틱이 팔을 들어 검을 막아낸다.
    ja: 黒いヘレティックは腕を上げ、剣を受けた
  event_arkguardian1_06_e_43:
    speaker: "<Narration>"
    en: "*Thunk!*"
    ko: 푸욱--!!
    ja: ズブッ――！！
  event_arkguardian1_06_e_44:
    speaker: "<Narration>"
    en: The sword fails to slice through the arm and gets lodged in.
    ko: 검날이 팔을 베어내지 못하고 박힌다.
    ja: 刃は腕を落としきれず、止まった
  event_arkguardian1_06_e_45:
    speaker: hongryeon_o
    en: It doth not cleave!
    ko: 베이지 않는다고…!?
    ja: 斬れぬだと…！？
  event_arkguardian1_06_e_46:
    speaker: "<Narration>"
    en: "*Crack, crack*"
    ko: 쿠득- 쿠드드득--
    ja: ズリッ、ギシギシ――
  event_arkguardian1_06_e_47:
    speaker: "<Narration>"
    en: The half-severed limb regenerates, trapping Scarlet's blade in her arm.
    ko: 반쯤 잘린 팔이 수복된다. 홍련의 검이 팔에 붙잡힌다.
    ja: |-
      斬れかけの腕はそのまま修復を始め、
      紅蓮の剣をくわえ込んだ
  event_arkguardian1_06_e_48:
    speaker: hongryeon_o
    en: Foul luck!
    ko: 이런!
    ja: しまった！
  event_arkguardian1_06_e_49:
    speaker: "<Narration>"
    en: Scarlet desperately tries to pull her sword free. Just then, light bursts
      forth from the Heretic's body.
    ko: |-
      다급하게 검을 빼내는 홍련.
      그때, 검은 헬레틱의 몸에서 빛이 뿜어져 나온다.
    ja: |-
      紅蓮が素早く剣を引き抜いた瞬間、
      ヘレティックのボディが光を放った
  event_arkguardian1_06_e_50:
    speaker: "<Narration>"
    en: Dorothy jumps in, sweeping Scarlet's legs and knocking her off balance,
    ko: 도로시가 달려들어 홍련의 다리를 걸어 넘어뜨린다.
    ja: |-
      飛び込んできたドロシーが
      紅蓮に足をかけ、体勢を崩させた
  event_arkguardian1_06_e_51:
    speaker: "<Narration>"
    en: right as the beams slice through the air.
    ko: 뻗어 나온 빛들이 허공을 가른다.
    ja: 放たれた光が虚空を切り裂いた
  event_arkguardian1_06_e_52:
    speaker: hongryeon_o
    en: Argh!
    ko: 칫…!
    ja: チッ…！
  event_arkguardian1_06_e_53:
    speaker: dorothy
    en: Move! You're in the way!
    ko: 비켜요! 방해되니까!
    ja: 下がってください！邪魔です！
  event_arkguardian1_06_e_54:
    speaker: "<Narration>"
    en: The black Heretic unleashes blinding rays from her entire body toward Dorothy.
    ko: 검은 헬레틱이 도로시를 향해 온몸에서 빛을 뿜어낸다.
    ja: |-
      ヘレティックはドロシーに狙いを変え、
      光を放った
  event_arkguardian1_06_e_55:
    speaker: "<Narration>"
    en: She dodges every strike and fires back.
    ko: 도로시는 모든 공격을 피하며 사격한다.
    ja: |-
      ドロシーは飛び来る光を
      ことごとくかわしつつ、銃を撃ち返した
  event_arkguardian1_06_e_56:
    speaker: "<Narration>"
    en: Bullets tear through the Heretic's form, but she heals just as quickly.
    ko: 검은 헬레틱의 몸에 수많은 구멍이 뚫리지만, 이내 수복한다.
    ja: |-
      ヘレティックのボディに無数の穴を開けたが、
      それもたちまち修復されてしまう
  event_arkguardian1_06_e_57:
    speaker: dorothy
    en: "... What is this thing?"
    ko: "…뭔가요 이건."
    ja: "…何ですか、これは。"
  event_arkguardian1_06_e_58:
    speaker: "<Narration>"
    en: Light gathers within the Heretic's body.
    ko: 검은 헬레틱의 몸에 큰 빛이 모여든다.
    ja: |-
      ヘレティックのボディが、
      さらに強い光を帯びた
  event_arkguardian1_06_e_59:
    speaker: dorothy
    en: Oh no!
    ko: 이런…!
    ja: こんなことが…！
  event_arkguardian1_06_e_60:
    speaker: liliweiss
    en: All right. Target locked.
    ko: 좋아. 파악 완료.
    ja: うん。分かった。
  event_arkguardian1_06_e_61:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 꽈앙-!
    ja: ドカン！！
  event_arkguardian1_06_e_62:
    speaker: "<Narration>"
    en: The sound of metal clashing resounds as the Heretic's side is blown apart.
    ko: 강철을 두드리는 소리가 나며 검은 헬레틱의 옆구리가 사라진다.
    ja: |-
      鋼鉄を打ち付けるような音とともに、
      ヘレティックの脇腹が消し飛んだ
  event_arkguardian1_06_e_63:
    speaker: "<Narration>"
    en: As she turns to assess the damage, Liliweiss's fist slams into her face.
    ko: 상황을 파악하려는 듯 고개를 돌린 검은 헬레틱의 얼굴에 릴리바이스의 주먹이 박힌다.
    ja: |-
      状況を理解できず振り向いた
      ヘレティックの顔面に
      リリーバイスの拳が突き刺さる
  event_arkguardian1_06_e_64:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 꽈앙-!
    ja: ズガン――！！
  event_arkguardian1_06_e_65:
    speaker: "<Narration>"
    en: The Heretic staggers, and Liliweiss rushes in.
    ko: |-
      휘청이는 검은 헬레틱.
      릴리바이스가 그 안으로 파고든다.
    ja: |-
      ヘレティックが体勢を崩し
      リリーバイスの拳がボディにめり込む
  event_arkguardian1_06_e_66:
    speaker: liliweiss
    en: You hear it all the time, right?
    ko: 그런 얘기들 많이 하잖아?
    ja: お約束でしょ？
  event_arkguardian1_06_e_67:
    speaker: liliweiss
    en: If an opponent has high regeneration, strike quickly before they have a chance
      to recover.
    ko: |-
      재생 능력이 높은 상대가 있다면,
      재생되기 전에 박살 내면 된다고.
    ja: |-
      相手がどんどん再生するなら、
      それより早く壊せばいいって。
  event_arkguardian1_06_e_68:
    speaker: "<Narration>"
    en: Liliweiss unleashes a relentless barrage of punches.
    ko: 릴리바이스가 마구잡이로 주먹을 휘두른다.
    ja: リリーバイスの猛打がヘレティックを襲った
  event_arkguardian1_06_e_69:
    speaker: "<Narration>"
    en: "*Bang bang bang bang*"
    ko: 쾅! 쾅! 쾅! 쾅!
    ja: ガン！ガン！ガンガン！
  event_arkguardian1_06_e_70:
    speaker: "<Narration>"
    en: The black Heretic shakes helplessly, but the assault rages on.
    ko: |-
      검은 헬레틱이 무력하게 흔들린다.
      공격은 멈추지 않는다.
    ja: |-
      ヘレティックのボディが力なく揺れ、
      それでもリリーバイスは攻撃を緩めない
  event_arkguardian1_06_e_71:
    speaker: "<Narration>"
    en: "*Bang bang bang bang*"
    ko: 쾅! 쾅! 쾅! 쾅!
    ja: ガスッ！ドカッ！バシッ！バン！
  event_arkguardian1_06_e_72:
    speaker: "<Narration>"
    en: By the end of her relentless blows, only the shattered pieces of the Heretic
      remain across the wrecked ground.
    ko: |-
      한참 동안 이어진 공격의 끝에,
      검은 헬레틱의 파편만이 엉망이 된 바닥에 널브러져 있었다.
    ja: |-
      リリーバイスがようやく手を止めた時、
      あたりにはヘレティックだったものの断片が
      散乱していた
  event_arkguardian1_06_e_73:
    speaker: "<Narration>"
    en: Liliweiss dusts off her hands.
    ko: 릴리바이스는 손을 털며 말한다.
    ja: リリーバイスは手を払い、つぶやいた
  event_arkguardian1_06_e_74:
    speaker: liliweiss
    en: "... Phew. Done."
    ko: "…후우. 끝."
    ja: ふう…おしまい。
  event_arkguardian1_06_e_75:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian1_06_e_76:
    speaker: hongryeon_o
    en: I can scarcely tell who the true monster is.
    ko: "…누가 괴물인지 모르겠군."
    ja: "…これではどちらが化け物か…"
  event_arkguardian1_06_e_77:
    speaker: snowwhite_o
    en: Wow... Lilith, you're amazin—
    ko: 여, 역시 릴리스 언니는 대단….
    ja: さ、さすがはリリスお姉ちゃん…
  event_arkguardian1_06_e_78:
    speaker: snowwhite_o
    en: Huh?
    ko: "……?"
    ja: "……？"
  event_arkguardian1_06_e_79:
    speaker: "<Narration>"
    en: Something catches Snow White's eye.
    ko: 스노우 화이트의 시선에 뭔가 들어왔다.
    ja: 何かがスノーホワイトの視界に入った
  event_arkguardian1_06_e_80:
    speaker: "<Narration>"
    en: The silhouette of a human figure flying low and fast.
    ko: 낮지만 빠르게 날아가고 있는 사람의 형체.
    ja: 低空を高速で飛ぶ人型の影だ
  event_arkguardian1_06_e_81:
    speaker: "<Narration>"
    en: It's the same Heretic they just destroyed.
    ko: 좀 전에 쓰러뜨린 것이 분명한 검은 헬레틱이었다.
    ja: |-
      それはたった今倒したはずのヘレティックと
      同じ姿をしている
  event_arkguardian1_06_e_82:
    speaker: snowwhite_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian1_06_e_83:
    speaker: snowwhite_o
    en: Over there! There's one more!
    ko: 하나! 하나 더 있어요!!
    ja: もう1体！もう1体来ます！！
  event_arkguardian1_06_e_84:
    speaker: commander_op_r
    en: What?!
    ko: 뭐야?
    ja: 何だと？
  event_arkguardian1_06_e_85:
    speaker: snowwhite_o
    en: Sh-she's heading toward the camp!
    ko: 캐, 캠프 쪽으로 가고 있어요!
    ja: キャ、キャンプの方に向かってます！
  event_arkguardian1_06_e_86:
    speaker: commander_op_r
    en: Damn it!
    ko: 이런 제기랄!
    ja: クソッ！
  event_arkguardian1_06_e_87:
    speaker: liliweiss
    en: I'll go!
    ko: 내가 갈게!
    ja: 私が行きます！
  event_arkguardian1_06_e_88:
    speaker: "<Narration>"
    en: Liliweiss lowers her stance and sprints forward,
    ko: 릴리바이스가 자세를 숙이고, 단숨에 뛰쳐나간다.
    ja: リリーバイスが腰を落とし、飛び出そうとした
  event_arkguardian1_06_e_89:
    speaker: "<Narration>"
    en: only to collapse, hands bracing against the ground.
    ko: 그대로, 땅을 짚으며 앞으로 쓰러진다.
    ja: しかし身体は前に倒れ、地面に手をついた
  event_arkguardian1_06_e_90:
    speaker: liliweiss
    en: "... Huh?"
    ko: "…어?"
    ja: "…え？"
  event_arkguardian1_06_e_91:
    speaker: "<Narration>"
    en: "*Gurgle*"
    ko: 울컥울컥.
    ja: ボタボタッ…
  event_arkguardian1_06_e_92:
    speaker: "<Narration>"
    en: Blood gushes from her eyes, nose, mouth, and ears.
    ko: 눈, 코, 입, 귀에서 피가 쏟아진다.
    ja: 目鼻、口、そして耳から血が流れ落ちた
  event_arkguardian1_06_e_93:
    speaker: "<Narration>"
    en: The ground begins to get drenched in fresh blood.
    ko: 바닥이 선혈로 물들어간다.
    ja: 足下が赤く染まっていく
  event_arkguardian1_06_e_94:
    speaker: "<Narration>"
    en: The bleeding is profuse and doesn't stop.
    ko: 피가 멈추지 않는다.
    ja: 流れ出る血は止まる気配がない
  event_arkguardian1_06_e_95:
    speaker: liliweiss
    en: Ah...
    ko: 아….
    ja: あぁ…
  event_arkguardian1_06_e_96:
    speaker: liliweiss
    en: Of all times for this to happen!
    ko: 하필 이럴 때.
    ja: よりによって、こんな時に…
  event_arkguardian1_06_e_97:
    speaker: "<Narration>"
    en: Liliweiss collapses.
    ko: 릴리바이스가 쓰러진다.
    ja: リリーバイスが倒れた
  event_arkguardian1_06_e_98:
    speaker: "<Narration>"
    en: The bleeding doesn't stop.
    ko: 피는 멈추지 않는다.
    ja: 赤い染みが拡がっていく
  event_arkguardian1_06_e_99:
    speaker: snowwhite_o
    en: Li...lith...
    ko: 언… 니….
    ja: お姉…ちゃん…？
  event_arkguardian1_06_e_100:
    speaker: snowwhite_o
    en: L-Lilith! Lilith!
    ko: 어어어, 언니! 릴리스 언니!
    ja: お、お姉ちゃん！リリスお姉ちゃん！？
  event_arkguardian1_06_e_101:
    speaker: dorothy
    en: Scarlet! Run!
    ko: 홍련!! 뛰어요!!
    ja: 紅蓮！！行きますよ！！
  event_arkguardian1_06_e_102:
    speaker: hongryeon_o
    en: Make haste!
    ko: "!! 가세!!"
    ja: "！！ああ！"
  event_arkguardian1_06_e_103:
    speaker: "<Narration>"
    en: Dorothy and Scarlet rush toward the camp.
    ko: 도로시와 홍련이 캠프 방향으로 뛰어간다.
    ja: ドロシーと紅蓮がキャンプへ駆けていった
  event_arkguardian1_06_e_104:
    speaker: "<Narration>"
    en: Snow White shakes Liliweiss desperately.
    ko: 스노우 화이트는 릴리바이스를 흔든다.
    ja: スノーホワイトはリリーバイスの身体を揺すった
  event_arkguardian1_06_e_105:
    speaker: snowwhite_o
    en: Get up, please! G-get up!
    ko: 이, 일어나요…! 일어나요!
    ja: 起きて…！起きてください！
  event_arkguardian1_06_e_106:
    speaker: snowwhite_o
    en: N-not yet... Not now!
    ko: 아직, 아직 안 돼요! 아직은 안된다고요!
    ja: だ、ダメです！まだダメ…！
  event_arkguardian1_06_e_107:
    speaker: "<Narration>"
    en: Liliweiss doesn't move.
    ko: 릴리바이스는 움직이지 않는다.
    ja: リリーバイスは身動き一つしない
  event_arkguardian1_06_e_108:
    speaker: snowwhite_o
    en: Li...lith...
    ko: 언… 니….
    ja: お姉…ちゃん…
  event_arkguardian1_06_e_109:
    speaker: "<Narration>"
    en: A chill runs down Snow White's spine.
    ko: 스노우 화이트는 갑자기 오싹한 기분을 느꼈다.
    ja: スノーホワイトの背筋に寒気が走った
  event_arkguardian1_06_e_110:
    speaker: "<Narration>"
    en: She looks up into the sky to see three black Heretics floating above, gazing
      down at her.
    ko: 올려다본 하늘엔, 셋의 검은 헬레틱이 부유한 채 자신을 내려다보고 있었다.
    ja: |-
      見上げた空に、こちらを見下ろす
      3体のヘレティックの姿があった
  event_arkguardian1_06_e_111:
    speaker: snowwhite_o
    en: There are... more...
    ko: 더… 있잖아….
    ja: なんで…こんなに…
  event_arkguardian1_06_e_112:
    speaker: "<Narration>"
    en: The Commander runs toward the camp.
    ko: 지휘관은 캠프 쪽으로 뛰어갔다.
    ja: 指揮官が疾走した
  event_arkguardian1_06_e_113:
    speaker: "<Narration>"
    en: In the distance, he notices another black Heretic heading for the camp.
    ko: 저 멀리, 캠프 쪽으로 향하고 있는 검은 헬레틱이 보인다.
    ja: |-
      キャンプに接近しつつあるヘレティックを
      遠くに捉えた
  event_arkguardian1_06_e_114:
    speaker: commander
    en: Please... look here...
    ko: 제발…! 여길 봐라…!
    ja: 頼む…！こっちを見ろ…！
  event_arkguardian1_06_e_115:
    speaker: "<Narration>"
    en: He draws his pistol,
    ko: 품에서 권총을 꺼낸다.
    ja: 指揮官は拳銃を懐から取り出し…
  event_arkguardian1_06_e_116:
    speaker: "<Narration>"
    en: and fires without hesitation. The bullets hit their mark.
    ko: |-
      망설이지 않고 쏜다.
      탄환이 명중한다.
    ja: |-
      迷うことなく引くと、
      弾丸は狙い通りに命中した
  event_arkguardian1_06_e_117:
    speaker: "<Narration>"
    en: The Heretic turns her gaze toward him.
    ko: 검은 헬레틱이 지휘관을 바라본다.
    ja: |-
      弾丸の当たったヘレティックが
      指揮官に視線を向けた
  event_arkguardian1_06_e_118:
    speaker: commander
    en: What are you staring at, you filthy monster?
    ko: 뭘 보냐 괴물 자식아.
    ja: 何を見ている、バケモノめ。
  event_arkguardian1_06_e_119:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 푸슝-!
    ja: バシュン――！
  event_arkguardian1_06_e_120:
    speaker: "<Narration>"
    en: The Heretic fires a beam. The Commander dodges and pulls the trigger.
    ko: |-
      검은 헬레틱이 빔을 쏘아낸다.
      지휘관은 회피하며 방아쇠를 당긴다.
    ja: |-
      ヘレティックの放つビームをかわし、
      指揮官が拳銃で応戦する
  event_arkguardian1_06_e_121:
    speaker: "<Narration>"
    en: Every bullet hits its mark. He picks up speed and rushes toward the Heretic.
    ko: |-
      모든 탄환이 명중한다.
      지휘관은 속도를 내 검은 헬레틱에게로 뛰어간다.
    ja: |-
      弾丸はすべて吸い込まれるように命中し、
      指揮官はヘレティックとの距離を詰めた
  event_arkguardian1_06_e_122:
    speaker: "<Narration>"
    en: More beams rain down. He dodges them all, firing nonstop.
    ko: |-
      이어지는 빔 공격.
      지휘관은 모든 공격을 피하며 사격을 계속한다.
    ja: |-
      さらに続く攻撃をやり過ごし、
      指揮官は射撃を続けた
  event_arkguardian1_06_e_123:
    speaker: "<Narration>"
    en: The distance closes gradually.
    ko: 거리가 점점 가까워진다.
    ja: 距離がじわじわと縮まっていく
  event_arkguardian1_06_e_124:
    speaker: "<Narration>"
    en: As the Commander reaches his desired range, he dodges the oncoming beam and
      takes aim.
    ko: |-
      그리고 지휘관이 원하는 거리가 되었을 때,
      뻗어오는 빔을 피한 후 조준한다.
    ja: |-
      十分に近づいたと見た指揮官は、
      攻撃をかわし、狙いを定めた
  event_arkguardian1_06_e_125:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕-!
    ja: バン！
  event_arkguardian1_06_e_126:
    speaker: "<Narration>"
    en: The bullet pierces the Heretic's forehead.
    ko: 탄환이 검은 헬레틱의 이마에 명중한다.
    ja: 銃弾はヘレティックの額に命中した
  event_arkguardian1_06_e_127:
    speaker: "<Narration>"
    en: But there is no reaction.
    ko: 하지만 아무런 반응이 없다.
    ja: しかし、手ごたえはまったくなかった
  event_arkguardian1_06_e_128:
    speaker: commander
    en: Figures that wouldn't work.
    ko: 음. 역시 안되는군.
    ja: やはり、無理か。
  event_arkguardian1_06_e_129:
    speaker: "<Narration>"
    en: In an instant, the Heretic materializes before him.
    ko: 검은 헬레틱이 순식간에 지휘관에게로 접근한다.
    ja: ヘレティックが一瞬で迫り…
  event_arkguardian1_06_e_130:
    speaker: "<Narration>"
    en: "*Shunk!*"
    ko: 푸욱--!!
    ja: ドスッ！！
  event_arkguardian1_06_e_131:
    speaker: "<Narration>"
    en: Her arm drives into the Commander's side, dragging it all the way up to his
      elbow.
    ko: 검은 헬레틱의 팔이 지휘관의 옆구리에 팔꿈치까지 들어간다.
    ja: 指揮官の脇腹に腕が突き刺さった
  event_arkguardian1_06_e_132:
    speaker: "<Narration>"
    en: The Commander collapses without a sound.
    ko: 지휘관은 비명도 지르지 못하고 쓰러진다.
    ja: 指揮官は声一つ上げずに倒れた
  event_arkguardian1_06_e_133:
    speaker: "<Narration>"
    en: The Heretic turns her gaze back toward the camp,
    ko: 검은 헬레틱은 다시 캠프 쪽으로 시선을 돌린다.
    ja: |-
      ヘレティックは再びキャンプに
      視線を戻そうとした
  event_arkguardian1_06_e_134:
    speaker: "<Narration>"
    en: then suddenly freezes.
    ko: 그리고 갑자기 멈춰 선다.
    ja: しかし、その動きが急に止まった
  event_arkguardian1_06_e_135:
    speaker: "<Narration>"
    en: She stares at her hand.
    ko: 자신의 손을 바라본다.
    ja: 引き抜いた手を見ると…
  event_arkguardian1_06_e_136:
    speaker: "<Narration>"
    en: Her fingertips are disintegrating.
    ko: 손 끝이 붕괴하고 있다.
    ja: 指先が崩れ落ちている
  event_arkguardian1_06_e_137:
    speaker: dorothy
    en: Commander!
    ko: 지휘관--!!
    ja: 指揮官…！！
  event_arkguardian1_06_e_138:
    speaker: hongryeon_o
    en: Vile beast!
    ko: 이 놈--!!
    ja: おのれ…！！
  event_arkguardian1_06_e_139:
    speaker: "<Narration>"
    en: Scarlet slices the Heretic in two.
    ko: 홍련이 검은 헬레틱을 두동강 낸다.
    ja: 紅蓮がヘレティックを二つに斬り裂いた
  event_arkguardian1_06_e_140:
    speaker: "<Narration>"
    en: Dorothy's kick crushes her head.
    ko: 도로시의 발차기가 머리를 뭉갠다.
    ja: すかさずドロシーの足が頭部を踏みつけた
  event_arkguardian1_06_e_141:
    speaker: "<Narration>"
    en: The Heretic drops to her knees.
    ko: 검은 헬레틱이 주저앉는다.
    ja: ヘレティックが崩れ落ちる
  event_arkguardian1_06_e_142:
    speaker: "<Narration>"
    en: At the same time, a legion of beams erupts violently from her body.
    ko: 그와 동시에, 발악하듯 몸에서 수많은 빔이 뻗어 나온다.
    ja: |-
      瞬間、最期のあがきとばかりに、
      ボディが無数の光を放った
  event_arkguardian1_06_e_143:
    speaker: "<Narration>"
    en: Dorothy and Scarlet are thrown to the ground, engulfed by the light.
    ko: 빔에 집어삼켜진 도로시와 홍련이 땅바닥을 구른다.
    ja: |-
      光線に打たれ、
      ドロシーと紅蓮が地面に転がった
  event_arkguardian1_06_e_144:
    speaker: "<Narration>"
    en: Both of them can immediately tell that these wounds are fatal.
    ko: 둘 모두 치명상임을 직감한다.
    ja: どちらも致命傷を受けたと直感した
  event_arkguardian1_06_e_145:
    speaker: dorothy
    en: A-argh!
    ko: 아… 아윽…!!
    ja: うっ…ぐっ…！！
  event_arkguardian1_06_e_146:
    speaker: hongryeon_o
    en: What... art thou doing...! Arise... at once...!
    ko: 뭐…! 하고 있나…! 어서 일어나지 않… 고…!!
    ja: 何を…しておる…！早く…立たぬ…か…！！
  event_arkguardian1_06_e_147:
    speaker: dorothy
    en: I'm... trying...!
    ko: 하고…! 있다고요…!!
    ja: 言われ…！なくても…！！
  event_arkguardian1_06_e_148:
    speaker: "<Narration>"
    en: Dorothy's vision blurs, but she forces herself up.
    ko: 정신이 아찔해진다. 하지만 일어나야 한다.
    ja: |-
      2人は遠くなる意識の中で、
      それでも立ち上がろうともがいた
  event_arkguardian1_06_e_149:
    speaker: "<Narration>"
    en: Then, she sees them, human soldiers and mass-produced Nikkes rushing from
      the camp.
    ko: 그때, 도로시의 눈에 캠프에서 뛰쳐나오는 인간 병사들과 양산형 니케들이 들어온다.
    ja: |-
      やがてキャンプから飛び出してくる
      人間の兵士と量産型ニケたちが
      ドロシーの目に入った
  event_arkguardian1_06_e_150:
    speaker: "<Narration>"
    en: In an instant, she feels a great sense of relief,
    ko: 도로시는 안도감을 느꼈다.
    ja: 一瞬安堵したドロシーだったが…
  event_arkguardian1_06_e_151:
    speaker: "<Narration>"
    en: but only for a moment. She quickly realizes they'll only die in vain.
    ko: 하지만 곧, 그들이 할 수 있는 일이라고는 허무하게 죽는 것뿐이라는 것을 깨닫는다.
    ja: |-
      出てきたところで、
      みな抵抗もできず死ぬだけだと気づいた
  event_arkguardian1_06_e_152:
    speaker: dorothy
    en: Don't... come... any...
    ko: 오면… 안…!
    ja: 来ない…で…！
  event_arkguardian1_06_e_153:
    speaker: hongryeon_o
    en: "*Cough*"
    ko: 쿨럭…!
    ja: ゲホッ…！
  event_arkguardian1_06_e_154:
    speaker: "<Narration>"
    en: Dorothy's vision darkens.
    ko: 도로시의 시야가 검어진다.
    ja: ドロシーの視界がかすんでいく
  event_arkguardian1_06_e_155:
    speaker: "<Narration>"
    en: Just before it fades completely, Dorothy watches,
    ko: 완전히 검어지기 직전, 도로시는 보았다.
    ja: だが視界が闇に落ちる直前、確かに見えた
  event_arkguardian1_06_e_156:
    speaker: "<Narration>"
    en: as the Heretic's body disintegrates into nothingness.
    ko: 검은 헬레틱의 몸이 바스러져 가는 것을.
    ja: 粉々に砕け散るヘレティックのボディが
  event_arkguardian1_06_e_157:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두두--!!
    ja: ダダダダダッ――！
  event_arkguardian1_06_e_158:
    speaker: "<Narration>"
    en: Gunfire, unmistakably Snow White's, erupts from behind.
    ko: 후방에서 스노우 화이트의 것이 분명한 총성이 들려온다.
    ja: 後方でスノーホワイトの銃声が響く
  event_arkguardian1_06_e_159:
    speaker: hongryeon_o
    en: Snow... White...!
    ko: 스노우… 화이트…!
    ja: スノー…ホワイト…！
  event_arkguardian1_06_e_160:
    speaker: "<Narration>"
    en: Dorothy and Scarlet's vision fades to black.
    ko: 도로시와 홍련의 시야가 검어진다.
    ja: 2人の目には何も見えなくなり…
  event_arkguardian1_06_e_161:
    speaker: "<Narration>"
    en: Eventually, they lose consciousness.
    ko: 이윽고, 둘은 정신을 잃었다.
    ja: そのまま、意識を失った
  event_arkguardian1_06_e_162:
    speaker: "<Narration>"
    en: 'ARK GUARDIAN: To Be Continued...'
    ko: 'ARK GUARDIAN : To Be Continued….'
    ja: 'ARK GUARDIAN : To Be Continued….'
event_arkguardian2_01_s:
  event_arkguardian2_01_s_1:
    speaker: snowwhite_o
    en: "*Gasp*"
    ko: "…허억…!"
    ja: "…っ…！！"
  event_arkguardian2_01_s_2:
    speaker: "<Narration>"
    en: Snow White opens her eyes and finds herself in the infirmary.
    ko: 스노우 화이트는 병실에서 눈을 떴다.
    ja: スノーホワイトは病室で目を覚ました
  event_arkguardian2_01_s_3:
    speaker: "<Narration>"
    en: Running her hands over her body, she finds nothing wrong.
    ko: |-
      몸을 더듬는다.
      아무렇지도 않다.
    ja: |-
      体をひねってみたが、
      違和感はどこにもない
  event_arkguardian2_01_s_4:
    speaker: "<Narration>"
    en: She pushes herself up from the bed.
    ko: 침대에서 몸을 일으킨다.
    ja: ベッドから上体を起こした
  event_arkguardian2_01_s_5:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_s_6:
    speaker: snowwhite_o
    en: Wh-why am I...
    ko: 나… 왜….
    ja: 私…どうして…
  event_arkguardian2_01_s_7:
    speaker: snowwhite_o
    en: What happened...?
    ko: 무슨 일이….
    ja: いったい何が…
  event_arkguardian2_01_s_8:
    speaker: "<Narration>"
    en: A sharp stab of pain shoots through her head.
    ko: 찌릿. 하면서 스노우 화이트의 머리에 통증이 찾아온다.
    ja: スノーホワイトの頭に刺すような痛みが走る
  event_arkguardian2_01_s_9:
    speaker: "<Narration>"
    en: She clutches her temples.
    ko: 스노우 화이트는 머리를 감싸 쥔다.
    ja: 反射的に頭を抑えた
  event_arkguardian2_01_s_10:
    speaker: snowwhite_o
    en: Ah...
    ko: "…아."
    ja: あ…
  event_arkguardian2_01_s_11:
    speaker: snowwhite_o
    en: Aaaargh...!
    ko: 아아… 아아아아….
    ja: ああ…ああああ…
  event_arkguardian2_01_s_12:
    speaker: "<Narration>"
    en: Vivid memories come flooding back.
    ko: 생생한 기억이 떠오른다.
    ja: 記憶が鮮明によみがえってくる
  event_arkguardian2_01_s_13:
    speaker: snowwhite_o
    en: There are... more...
    ko: 더… 있잖아….
    ja: なんで…こんなに…
  event_arkguardian2_01_s_14:
    speaker: "<Narration>"
    en: The black Heretics land,
    ko: 검은 헬레틱들이 착지한다.
    ja: ヘレティックたちが地表に降り…
  event_arkguardian2_01_s_15:
    speaker: "<Narration>"
    en: encircling the fallen Liliweiss.
    ko: 쓰러진 릴리바이스를 둘러싸듯 자리를 잡는다.
    ja: 倒れたリリーバイスを取り囲んだ
  event_arkguardian2_01_s_16:
    speaker: "<Narration>"
    en: After staring down at her for a long while, the Heretics all reach out their
      hands in unison.
    ko: 한참 동안 릴리바이스를 내려다보던 검은 헬레틱들이 동시에 손을 뻗는다.
    ja: |-
      ヘレティックたちは、
      しばらくリリーバイスを見下ろした後、
      同時に手を伸ばし…
  event_arkguardian2_01_s_17:
    speaker: snowwhite_o
    en: Ahhhhhh!
    ko: 아아아아--!!
    ja: ああああーーっ！！
  event_arkguardian2_01_s_18:
    speaker: "<Narration>"
    en: Snow White unleashes a barrage of bullets in a frenzy.
    ko: 스노우 화이트가 발악하듯 탄환을 쏟아붓는다.
    ja: スノーホワイトが半狂乱で銃撃した
  event_arkguardian2_01_s_19:
    speaker: "<Narration>"
    en: She refrains from using missiles for fear of injuring Liliweiss.
    ko: 미사일은 사용할 수 없다. 릴리바이스가 말려들 수도 있다.
    ja: |-
      リリーバイスを巻き込まないよう、
      ミサイルを使わないだけの判断力は
      辛うじて残っている
  event_arkguardian2_01_s_20:
    speaker: "<Narration>"
    en: "*Clink clink clink*"
    ko: 틱. 틱. 틱.
    ja: カチ、カチ、カチッ――
  event_arkguardian2_01_s_21:
    speaker: "<Narration>"
    en: Her rounds are quickly spent. She pulls out another magazine and attempts
      to reload.
    ko: |-
      탄환은 빠르게 소모되었다.
      스노우 화이트는 탄창을 꺼내 재장전을 시도한다.
    ja: |-
      銃弾は一瞬で底をつき、
      スノーホワイトはリロードを試みた
  event_arkguardian2_01_s_22:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 투욱-
    ja: ガタッ――
  event_arkguardian2_01_s_23:
    speaker: "<Narration>"
    en: Her trembling hands fumble the magazine,
    ko: 떨리는 손은 탄창을 제대로 잡고 있지 못했다.
    ja: 震えの収まらない手が、弾倉を取り落とした
  event_arkguardian2_01_s_24:
    speaker: "<Narration>"
    en: and it falls pitifully to the ground.
    ko: 탄창은 허무하게 바닥으로 떨어진다.
    ja: 弾倉は無慈悲に地面へ転がった
  event_arkguardian2_01_s_25:
    speaker: "<Narration>"
    en: She doesn't have any other magazine she can load.
    ko: 남은 탄창은 없다.
    ja: 他のものはとっくに使い切っている
  event_arkguardian2_01_s_26:
    speaker: "<Narration>"
    en: Her gaze shifts to the one on the ground.
    ko: 스노우 화이트의 시선이 탄창 쪽으로 향한다.
    ja: スノーホワイトは落ちた弾倉を見た
  event_arkguardian2_01_s_27:
    speaker: "<Narration>"
    en: She has to pick it up.
    ko: 주워야해.
    ja: 拾わないと…
  event_arkguardian2_01_s_28:
    speaker: "<Narration>"
    en: She has to pick it up, reload, and shoot the Heretics.
    ko: 주워서, 재장전한 다음, 저것들에게 쏴야 해.
    ja: 拾って、リロードして、あいつらを撃たないと…
  event_arkguardian2_01_s_29:
    speaker: "<Narration>"
    en: But she can't bring herself to reach for the magazine, nor lift her head.
    ko: |-
      하지만 스노우 화이트는 탄창 쪽으로 손을 뻗지도,
      고개를 들 수도 없었다.
    ja: |-
      しかし、スノーホワイトは
      弾倉に手を伸ばすことも、
      顔を上げることもできなかった
  event_arkguardian2_01_s_30:
    speaker: "<Narration>"
    en: If she does, the Heretics might be looking right at her.
    ko: 고개를 들면, 검은 헬레틱들이 자신을 바라보고 있을 것 같았다.
    ja: |-
      顔を上げればヘレティックたちの視線が
      自分に刺さるような気がしたからだ
  event_arkguardian2_01_s_31:
    speaker: "<Narration>"
    en: Cold sweat runs down her body.
    ko: 식은땀이 줄줄 흐른다.
    ja: 冷や汗が流れ落ちた
  event_arkguardian2_01_s_32:
    speaker: "<Narration>"
    en: She wants to run away.
    ko: 도망가고 싶다.
    ja: 逃げ出したい衝動が襲う
  event_arkguardian2_01_s_33:
    speaker: snowwhite_o
    en: Aargh...
    ko: 아, 으으.
    ja: う、ああ…
  event_arkguardian2_01_s_34:
    speaker: snowwhite_o
    en: I-I have to grab it...!
    ko: 잡아야, 잡아야 해. 잡아야….
    ja: 早く…早く拾わないと…
  event_arkguardian2_01_s_35:
    speaker: "<Narration>"
    en: Her eyes are still fixed on the floor until the foot of a black Heretic comes
      into view.
    ko: |-
      바닥을 보고 있던 스노우 화이트의 시선 끝에,
      검은 헬레틱의 발이 들어온다.
    ja: |-
      地面から動かないスノーホワイトの視界の端に、
      ヘレティックの足が見えた
  event_arkguardian2_01_s_36:
    speaker: "<Narration>"
    en: The Heretic is heading her way.
    ko: 내 쪽으로 온다.
    ja: こちらに向かってくる
  event_arkguardian2_01_s_37:
    speaker: "<Narration>"
    en: Her eyes quiver as she looks up.
    ko: 떨리는 눈동자와 고개를 위로 든다.
    ja: |-
      焦点の定まらない目を
      どうにか上に向けた
  event_arkguardian2_01_s_38:
    speaker: "<Narration>"
    en: One of the Heretics is walking toward her.
    ko: 검은 헬레틱 중 하나가 자신에게로 걸어오고 있다.
    ja: ヘレティックの1体が歩きながら迫っていた
  event_arkguardian2_01_s_39:
    speaker: "<Narration>"
    en: Snow White drops to her knees.
    ko: 스노우 화이트는 주저앉았다.
    ja: スノーホワイトは身体の力が抜け、座り込んだ
  event_arkguardian2_01_s_40:
    speaker: snowwhite_o
    en: N-no...
    ko: 으… 아아….
    ja: う…あああ…
  event_arkguardian2_01_s_41:
    speaker: "<Narration>"
    en: Her supernatural firepower and lightning-fast regenerative abilities,
    ko: |-
      초월적인 화력.
      압도적인 재생 능력.
    ja: |-
      圧倒的な火力
      現実離れした再生能力
  event_arkguardian2_01_s_42:
    speaker: "<Narration>"
    en: make her a formidable foe.
    ko: 강대한 적.
    ja: 強大な敵
  event_arkguardian2_01_s_43:
    speaker: "<Narration>"
    en: On the other hand, Liliweiss and Rapunzel lie fallen on the ground.
    ko: |-
      쓰러져 있는 릴리바이스.
      쓰러져 있는 라푼젤.
    ja: |-
      倒れたリリーバイス
      ラプンツェル
  event_arkguardian2_01_s_44:
    speaker: "<Narration>"
    en: '"I have to do this."'
    ko: 내가 해야 해.
    ja: 私がやるしかない
  event_arkguardian2_01_s_45:
    speaker: "<Narration>"
    en: Snow White repeats to herself over and over, as she kicks off the ground and
      stands up.
    ko: |-
      스노우 화이트는 마음속으로 수천 번을 되뇌인 다음,
      땅을 박차고 일어난다.
    ja: |-
      心の中で何度も自分に言い聞かせ、
      スノーホワイトは地面を蹴って立ち上がった
  event_arkguardian2_01_s_46:
    speaker: "<Narration>"
    en: She snatches the magazine, reloads, and aims for the head.
    ko: 탄창을 집고, 재장전한 다음, 머리를 겨눈다.
    ja: |-
      弾倉をつかんで素早く装填し、
      頭部に狙いを定める
  event_arkguardian2_01_s_47:
    speaker: "<Narration>"
    en: In that instant, she sees the Heretic's face.
    ko: |-
      그리고 그 순간.
      스노우 화이트는 검은 헬레틱의 얼굴을 본다.
    ja: |-
      その瞬間、スノーホワイトは
      はじめてヘレティックの顔を見た
  event_arkguardian2_01_s_48:
    speaker: "<Narration>"
    en: Though partly hidden, her red eyes and emotionless expression can be faintly
      made out.
    ko: 가려져 있었지만, 붉게 변한 눈과 감정 없는 표정이 희미하게 보인다.
    ja: 隠れた真紅の瞳、感情のない顔
  event_arkguardian2_01_s_49:
    speaker: "<Narration>"
    en: It is a face Snow White has seen countless times before—the face of her comrades
      who fought alongside her.
    ko: 지금껏 수없이 봐왔던, 함께 싸워왔던 동료들과 같은 얼굴.
    ja: |-
      しかしそれは数えきれないほど見てきた、
      戦友たちと同じ顔だ
  event_arkguardian2_01_s_50:
    speaker: "<Narration>"
    en: To her, the black Heretic is someone who was once an ally.
    ko: 스노우 화이트는 검은 헬레틱을 [한때 아군이었던] 존재로 정의해버렸다.
    ja: |-
      ヘレティックは「味方だったもの」という意識が
      スノーホワイトの脳裏をかすめた
  event_arkguardian2_01_s_51:
    speaker: "<Narration>"
    en: She tries to pull the trigger,
    ko: 방아쇠를 당긴다.
    ja: 引き金に指がかかる
  event_arkguardian2_01_s_52:
    speaker: "<Narration>"
    en: but her finger doesn't move.
    ko: 하지만 당기지 못했다.
    ja: しかし、それ以上動かない
  event_arkguardian2_01_s_53:
    speaker: snowwhite_o
    en: Ngh... ngh...
    ko: 흐, 흐으….
    ja: う…ううっ…
  event_arkguardian2_01_s_54:
    speaker: "<Narration>"
    en: '"Pull it, pull it."'
    ko: 당겨라. 당겨라. 당겨라.
    ja: 引け、引け、引け――
  event_arkguardian2_01_s_55:
    speaker: "<Narration>"
    en: '"Pull the trigger."'
    ko: 방아쇠를 당겨라.
    ja: 引くしかない
  event_arkguardian2_01_s_56:
    speaker: "<Narration>"
    en: '"I have to save Lilith and Rapunzel."'
    ko: |-
      릴리스 언니와 라푼젤을 구해야 해.
      당겨라.
    ja: |-
      リリスお姉ちゃんと
      ラプンツェルを助けるんだ、
      早く――
  event_arkguardian2_01_s_57:
    speaker: snowwhite_o
    en: Pull... the... trigger!
    ko: 당… 겨…! 당기라… 고…!
    ja: 引けっ…！引いて…！
  event_arkguardian2_01_s_58:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 퍼-엉-!
    ja: ドカン！！
  event_arkguardian2_01_s_59:
    speaker: "<Narration>"
    en: The Heretic's head explodes.
    ko: 검은 헬레틱의 머리가 터진다.
    ja: 突然、ヘレティックの頭が爆ぜた
  event_arkguardian2_01_s_60:
    speaker: snowwhite_o
    en: Huh?
    ko: "…어?"
    ja: "…えっ？"
  event_arkguardian2_01_s_61:
    speaker: "<Narration>"
    en: The figure standing before her, both fearsome and pitiable, collapses.
    ko: 눈앞에 서 있던 공포와 연민의 대상이 쓰러진다.
    ja: |-
      恐るべき、しかし哀れむべき
      目の前の存在がくずおれた
  event_arkguardian2_01_s_62:
    speaker: "<Narration>"
    en: Across from the Heretic, a white flower spattered with red.
    ko: 그 건너편에는 붉게 물든, 새하얀 꽃이 있었다.
    ja: |-
      その向こう側には、真っ赤に染まった
      リリーバイスが立っていた
  event_arkguardian2_01_s_63:
    speaker: liliweiss
    en: "... Snow White."
    ko: "…스노우 화이트."
    ja: "…スノーホワイト。"
  event_arkguardian2_01_s_64:
    speaker: snowwhite_o
    en: Li...lith...
    ko: 언… 니….
    ja: お姉…ちゃん…
  event_arkguardian2_01_s_65:
    speaker: liliweiss
    en: Snow White.
    ko: 스노우 화이트.
    ja: スノーホワイト。
  event_arkguardian2_01_s_66:
    speaker: liliweiss
    en: Don't worry.
    ko: 걱정 마.
    ja: 心配しないで。
  event_arkguardian2_01_s_67:
    speaker: liliweiss
    en: I'll protect you.
    ko: 내가 지켜줄게.
    ja: 私が守るから。
  event_arkguardian2_01_s_68:
    speaker: "<Narration>"
    en: The white flower, stained red, dances in the wind.
    ko: 붉게 물든 하얀 꽃이 바람에 흩날리듯 춤을 춘다.
    ja: |-
      血にまみれた純白の花が、
      風に吹かれて舞うように
  event_arkguardian2_01_s_69:
    speaker: "<Narration>"
    en: It sways back and forth, freely and without restraint.
    ko: |-
      이리 갔다, 저리 갔다.
      자유분방하게 움직인다.
    ja: |-
      あちらへ、そしてこちらへ、
      目まぐるしく飛び回る
  event_arkguardian2_01_s_70:
    speaker: "<Narration>"
    en: A black flower snaps.
    ko: 검은 꽃이 꺾인다.
    ja: 漆黒の花の形が歪む
  event_arkguardian2_01_s_71:
    speaker: "<Narration>"
    en: Its black petals scatter, and the stem breaks.
    ko: 검은 꽃잎이 찢어지고, 떨어져 나오고, 꽃대가 부러진다.
    ja: |-
      花弁は散り、剥ぎ取られ、
      その茎が手折られる
  event_arkguardian2_01_s_72:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 스스스스스스--
    ja: ヒュゥ――
  event_arkguardian2_01_s_73:
    speaker: "<Narration>"
    en: A gentle wind brushes past Snow White.
    ko: 미지근한 바람이 스노우 화이트를 스친다.
    ja: 生暖かい風がスノーホワイトの頬をかすめた
  event_arkguardian2_01_s_74:
    speaker: "<Narration>"
    en: She looks down on the ground.
    ko: 바닥을 바라본다.
    ja: ふと、視線が地面に落ちる
  event_arkguardian2_01_s_75:
    speaker: "<Narration>"
    en: Black petals lie scattered in every direction.
    ko: 검은 꽃잎들이 사방팔방에 흩어져 있었다.
    ja: 黒い花の残骸が散乱している
  event_arkguardian2_01_s_76:
    speaker: "<Narration>"
    en: She raises her head and sees the red-stained white flower.
    ko: 고개를 들어 붉게 물든 하얀 꽃을 본다.
    ja: 顔を上げ、赤く染まった花を見た
  event_arkguardian2_01_s_77:
    speaker: "<Narration>"
    en: Liliweiss, pure and beautiful,
    ko: 새하얀, 아름다운 릴리바이스.
    ja: 純白の花、美しいリリーバイス
  event_arkguardian2_01_s_78:
    speaker: "<Narration>"
    en: resembles the white flower, just like always.
    ko: 그 새하얀 꽃은, 언제나처럼.
    ja: いつもと変わらない、その姿
  event_arkguardian2_01_s_79:
    speaker: liliweiss
    en: "*Huff... huff...* Snow White, are you all right?"
    ko: |-
      후우, 후우.
      스노우 화이트. 괜찮아?
    ja: |-
      はあ、はあ…
      スノーホワイト、大丈夫？
  event_arkguardian2_01_s_80:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_s_81:
    speaker: liliweiss
    en: That... *huff...* took a while, but it's done. You're not hurt, *huff...*
      are you?
    ko: |-
      조금, 후. 조금 걸렸지만, 다 정리했어.
      어디 다친데 후우, 없지?
    ja: |-
      ちょっと、はぁ…時間がかかっちゃったけど、
      全部片付いたね。ケガはない？
  event_arkguardian2_01_s_82:
    speaker: snowwhite_o
    en: "... Lilith."
    ko: "…언니."
    ja: "…お姉ちゃん。"
  event_arkguardian2_01_s_83:
    speaker: liliweiss
    en: Yes. I'm here.
    ko: 그래. 여기 있어.
    ja: うん。ここにいるよ。
  event_arkguardian2_01_s_84:
    speaker: snowwhite_o
    en: Don't die...
    ko: 죽지 마요.
    ja: 死なないでください。
  event_arkguardian2_01_s_85:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_s_86:
    speaker: liliweiss
    en: I won't.
    ko: 응.
    ja: うん。
  event_arkguardian2_01_s_87:
    speaker: "<Narration>"
    en: Snow White grabs her head even more tightly.
    ko: 스노우 화이트는 머리를 더욱 강하게 감싸 쥔다.
    ja: スノーホワイトはさらに強く頭を抱えた
  event_arkguardian2_01_s_88:
    speaker: snowwhite_o
    en: Hrrrngh...!
    ko: 으… 으윽…!
    ja: うっ…ううっ…！
  event_arkguardian2_01_s_89:
    speaker: "<Narration>"
    en: She couldn't do anything.
    ko: 아무것도 하지 못했다.
    ja: 何もできなかった
  event_arkguardian2_01_s_90:
    speaker: "<Narration>"
    en: Like a complete fool, she couldn't even reload her own weapon as always.
    ko: 언제나처럼, 머저리같이 재장전 하나 제대로 하지 못하고
    ja: いつものように、リロードすらおぼつかず
  event_arkguardian2_01_s_91:
    speaker: "<Narration>"
    en: All she could do was sit there and hope to be rescued.
    ko: 주저앉아 누군가가 구해주길 바랬을 뿐이다.
    ja: 座り込んで、誰かの助けに頼った
  event_arkguardian2_01_s_92:
    speaker: "<Narration>"
    en: The red wolf who once cradled her fragility and kept her safe is gone.
    ko: 나약한 자신을 보듬고 지켜주던 붉은 늑대는 이제 없다.
    ja: 弱い自分を守ってくれた、赤い狼はもういない
  event_arkguardian2_01_s_93:
    speaker: "<Narration>"
    en: The white flower that did the same is now withering.
    ko: 나약한 자신을 보듬고 지켜주던 하얀 꽃은 이제 시들어간다.
    ja: 弱い自分を守ってくれた、白い花は枯れつつある
  event_arkguardian2_01_s_94:
    speaker: "<Narration>"
    en: She must do something.
    ko: 어떻게든 해야 한다.
    ja: 強くならないと
  event_arkguardian2_01_s_95:
    speaker: "<Narration>"
    en: As she grits her teeth and tries to steel herself,
    ko: 이를 악물고 마음을 다잡으려는 순간.
    ja: 歯を食いしばり、気合いを入れなおそうとした
  event_arkguardian2_01_s_96:
    speaker: "<Narration>"
    en: the black Heretic's face resurfaces in her mind.
    ko: 검은 헬레틱의 얼굴이 떠오른다.
    ja: |-
      その瞬間、あのヘレティックの顔が
      脳裏に浮かんだ
  event_arkguardian2_01_s_97:
    speaker: "<Narration>"
    en: Expressionless, yet so familiar up close.
    ko: 무표정하지만, 언제나 가까이에서 봐왔던 얼굴.
    ja: 見慣れた、しかし感情を失くした顔
  event_arkguardian2_01_s_98:
    speaker: "<Narration>"
    en: Snow White becomes certain.
    ko: 스노우 화이트는 확신했다.
    ja: スノーホワイトには痛いほど分かる
  event_arkguardian2_01_s_99:
    speaker: "<Narration>"
    en: If the same situation were to happen again,
    ko: 다시 그런 상황이 오더라도.
    ja: もし、また同じ状況になったら
  event_arkguardian2_01_s_100:
    speaker: "<Narration>"
    en: she would respond in the same way as she did before.
    ko: 자신은 똑같이 행동할 것이라고.
    ja: 自分はきっと同じ過ちを繰り返す
  event_arkguardian2_01_s_101:
    speaker: "<Narration>"
    en: She clutches her head in anguish.
    ko: 스노우 화이트는 머리를 쥐어뜯는다.
    ja: スノーホワイトは頭をかきむしった
  event_arkguardian2_01_s_102:
    speaker: "<Narration>"
    en: The otherwise quiet infirmary is filled with shallow groans and the sound
      of hair being pulled out.
    ko: 고요한 병실은 얕은 신음소리와, 머리카락이 끊어지는 소리로 가득 찼다.
    ja: |-
      静かな病室に、うめき声と
      引きちぎられる髪の音だけが響いた
event_arkguardian2_01_e:
  event_arkguardian2_01_e_1:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  event_arkguardian2_01_e_2:
    speaker: "<Narration>"
    en: Snow White opens the door leading to the lobby.
    ko: 스노우 화이트는 로비로 향하는 문을 열었다.
    ja: スノーホワイトはロビーへのドアを開いた
  event_arkguardian2_01_e_3:
    speaker: "<Narration>"
    en: Dorothy, Scarlet, and Rapunzel look at her.
    ko: 도로시, 홍련, 라푼젤이 스노우 화이트를 바라보고 있다.
    ja: |-
      ドロシー、紅蓮、ラプンツェルが
      待ち構えていた
  event_arkguardian2_01_e_4:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_5:
    speaker: dorothy
    en: You're up? How are you feeling?
    ko: "…일어나셨나요. 몸은 좀 어때요?"
    ja: "…目が覚めたようですね。具合はいかがですか？"
  event_arkguardian2_01_e_6:
    speaker: snowwhite_o
    en: I'm okay... I'm sorry.
    ko: 괜찮아요. 미안해요.
    ja: 大丈夫です。ごめんなさい。
  event_arkguardian2_01_e_7:
    speaker: hongryeon_o
    en: "'Tis fortunate it hath come to an end."
    ko: 그만하길 다행일세.
    ja: この程度で済んだのは、幸いだった。
  event_arkguardian2_01_e_8:
    speaker: hongryeon_o
    en: "'Twould seem more of those damnable abominations have sprung forth anew."
    ko: 어디서 또 괴물 같은 것들이 튀어나왔군.
    ja: 化け物どもめ、どこからともなく湧いて出る。
  event_arkguardian2_01_e_9:
    speaker: snowwhite_o
    en: How about you, Rapunzel? Are you okay?
    ko: 라푼젤은 괜찮아요?
    ja: ラプンツェルは大丈夫でしたか？
  event_arkguardian2_01_e_10:
    speaker: rapunzel_o
    en: Yes, I'm fine.
    ko: 예. 괜찮아요.
    ja: はい。問題ありません。
  event_arkguardian2_01_e_11:
    speaker: snowwhite_o
    en: But your shoulder...
    ko: 어깨가….
    ja: 肩が…
  event_arkguardian2_01_e_12:
    speaker: rapunzel_o
    en: My parts are always in surplus, after all.
    ko: "…제 파츠는 언제나 여분이 있으니까요."
    ja: "…私のパーツは予備がありますから。"
  event_arkguardian2_01_e_13:
    speaker: dorothy
    en: It would be disastrous if Rapunzel were injured, so we always make sure to
      keep plenty of her spare parts on hand.
    ko: 라푼젤이 다치면 큰일이라, 언제나 여분의 파츠를 넉넉하게 준비해 두고 있죠.
    ja: |-
      ラプンツェルの行動不能は
      重大な問題になりますから、常に余裕をもって
      スペアパーツが用意されているのです。
  event_arkguardian2_01_e_14:
    speaker: snowwhite_o
    en: That's good.
    ko: 다행이에요.
    ja: よかった…
  event_arkguardian2_01_e_15:
    speaker: rapunzel_o
    en: I appreciate your concern, Snow White.
    ko: 고마워요. 스노우 화이트.
    ja: ご心配ありがとうございます、スノーホワイト。
  event_arkguardian2_01_e_16:
    speaker: snowwhite_o
    en: And you two? Are you all right?
    ko: 두 분은 괜찮아요?
    ja: ドロシーと紅蓮も？
  event_arkguardian2_01_e_17:
    speaker: dorothy
    en: Well enough, as you can see.
    ko: 보시다시피.
    ja: 見ての通りです。
  event_arkguardian2_01_e_18:
    speaker: hongryeon_o
    en: I endured a direct blow from those infernal scoundrels.
    ko: 놈의 공격에 직격으로 노출되었네.
    ja: まともに食らってしまった。
  event_arkguardian2_01_e_19:
    speaker: hongryeon_o
    en: Mine frame was nigh unto dust, yet by some miracle, it was salvaged.
    ko: 뼈… 그러니까 프레임이 가루가 되었네만 어떻게든 수습할 수 있었네.
    ja: |-
      骨…要はフレームが砕けていたそうだが、
      今は元通りだ。
  event_arkguardian2_01_e_20:
    speaker: hongryeon_o
    en: Such is the strange grace bestowed upon we Nikkes; so long as the components
      be at hand, restoration shall ever be within our grasp.
    ko: 니케는 좋아. 파츠만 있으면 바로바로 복귀할 수 있으니 말일세.
    ja: |-
      ニケは楽でいい。
      部品さえあればすぐに戦場へ戻れる。
  event_arkguardian2_01_e_21:
    speaker: dorothy
    en: That might not be the most appropriate thing to say in front of people who
      were at death's door just a while ago.
    ko: 얼마 전까지 다들 사경을 헤맸던 사람들 앞에서 할 말은 아닌 것 같은데요.
    ja: |-
      つい先ほどまで生死の境を
      彷徨っていた人たちの前で
      言うべきことではありませんね。
  event_arkguardian2_01_e_22:
    speaker: hongryeon_o
    en: Whatever hath transpired, we yet live. That is what truly matters.
    ko: 과정이야 어찌 됐든 살았으니 됐지 않나.
    ja: 過程がどうあれ、生き延びたではないか。
  event_arkguardian2_01_e_23:
    speaker: dorothy
    en: Fair point.
    ko: 뭐, 그건 그렇죠.
    ja: まあ、それはそうです。
  event_arkguardian2_01_e_24:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_25:
    speaker: snowwhite_o
    en: And the Commander?
    ko: 지휘관은요?
    ja: 指揮官は？
  event_arkguardian2_01_e_26:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_27:
    speaker: rapunzel_o
    en: The Commander was seriously injured, so he was transported to the V.T.C. hospital
      managed by Headquarters.
    ko: 지휘관은 부상이 너무 심해서 본부 쪽 V.T.C. 직할 병원으로 수송되었어요.
    ja: |-
      指揮官は重傷を負われ、V.T.C.直轄の
      医療施設へ搬送されました。
  event_arkguardian2_01_e_28:
    speaker: rapunzel_o
    en: They say his internal organs were severely damaged.
    ko: 내장을 크게 다쳤다고….
    ja: 内臓の傷がひどいとのことで…
  event_arkguardian2_01_e_29:
    speaker: snowwhite_o
    en: But he'll be fine... right?
    ko: 괜찮… 겠죠?
    ja: 大丈夫…ですよね？
  event_arkguardian2_01_e_30:
    speaker: rapunzel_o
    en: He's made of tough stuff, so he's not in any mortal danger.
    ko: 워낙에 튼튼하신 분이라 생명에는 지장이 없을 거라고 해요.
    ja: |-
      人一倍丈夫な方というのでしょうか、
      命に別状はないそうです。
  event_arkguardian2_01_e_31:
    speaker: rapunzel_o
    en: The V.T.C. personnel are tending to him personally, so there's no need to
      worry.
    ko: V.T.C. 분들이 직접 치료한다고 하니, 걱정 안 해도 되겠죠.
    ja: |-
      V.T.C.の専門家が治療に当たっていますので、
      心配することはありません。
  event_arkguardian2_01_e_32:
    speaker: hongryeon_o
    en: To survive with a fist lodged in one's side and yet still live... 'tis naught
      short of the supernatural.
    ko: |-
      옆구리에 주먹이 박혔는데도 살아나다니,
      인외가 따로 없군그래.
    ja: |-
      脇腹を貫かれて生きているとは、
      常人離れしているな。
  event_arkguardian2_01_e_33:
    speaker: rapunzel_o
    en: He'll return as soon as he's been treated.
    ko: 치료가 끝나는 대로 바로 복귀한다고 해요.
    ja: 治療が終わり次第、すぐに復帰するそうです。
  event_arkguardian2_01_e_34:
    speaker: rapunzel_o
    en: We just need to wait a little.
    ko: 조금만 기다리면 되겠죠.
    ja: 少し待てば、きっと戻られます。
  event_arkguardian2_01_e_35:
    speaker: snowwhite_o
    en: Good to know.
    ko: 다행이네요.
    ja: 一安心ですね。
  event_arkguardian2_01_e_36:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_37:
    speaker: snowwhite_o
    en: How about Lilith?
    ko: 릴리스 언니는요?
    ja: リリスお姉ちゃんは？
  event_arkguardian2_01_e_38:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_39:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_40:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_41:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  event_arkguardian2_01_e_42:
    speaker: liliweiss
    en: Oh my.
    ko: 어머.
    ja: あら…
  event_arkguardian2_01_e_43:
    speaker: liliweiss
    en: Everyone seems to be doing fine.
    ko: 다들 멀쩡하네?
    ja: みんなもう元気？
  event_arkguardian2_01_e_44:
    speaker: liliweiss
    en: Youth really is a blessing.
    ko: 역시 젊은 게 좋다니까~
    ja: やっぱり若さがモノをいうのね～
  event_arkguardian2_01_e_45:
    speaker: snowwhite_o
    en: Lilith.
    ko: 언니.
    ja: お姉ちゃん。
  event_arkguardian2_01_e_46:
    speaker: liliweiss
    en: Yes? What is it?
    ko: "…응. 왜?"
    ja: "…うん、どうしたの？"
  event_arkguardian2_01_e_47:
    speaker: snowwhite_o
    en: Thank you... for saving me.
    ko: 구해줘서 고마워요.
    ja: 助けてくれて、ありがとうございました。
  event_arkguardian2_01_e_48:
    speaker: liliweiss
    en: Don't mention it. That's what I'm here for.
    ko: 뭘. 내가 하는 일이 그건데.
    ja: 気にしないで。できることをしただけよ。
  event_arkguardian2_01_e_49:
    speaker: liliweiss
    en: All right, everyone, just rest for now.
    ko: "…자. 지금은 일단 쉬고들 있어."
    ja: "…とにかく、今はしっかり休んで。"
  event_arkguardian2_01_e_50:
    speaker: liliweiss
    en: The second phase of the sealing process was successfully completed, so things
      should be quiet for a while.
    ko: |-
      2차 밀봉은 성공적으로 마무리됐으니까,
      한동안은 조용할 거야.
    ja: |-
      第2次封鎖は無事に成功したから、
      しばらくは落ち着くはず。
  event_arkguardian2_01_e_51:
    speaker: liliweiss
    en: If you need to tend to any repairs, do so now. Understood?
    ko: 정비할 것 있으면 하고. 알겠지?
    ja: 整備するものがあれば、しておくこと。いい？
  event_arkguardian2_01_e_52:
    speaker: hongryeon_o
    en: What knowledge hast thou gained of those black Heretics?
    ko: 그 검은 헬레틱에 대해서는 알아낸 것이 있나?
    ja: |-
      例のヘレティックどものことは、
      何か分かったのか？
  event_arkguardian2_01_e_53:
    speaker: liliweiss
    en: We're still looking into it. I'm sure we'll get answers soon.
    ko: |-
      아직. 여기저기서 열심히 조사중이야.
      조만간 답을 들을 수 있겠지.
    ja: |-
      ううん。あちこちで一生懸命調べてるところ。
      近いうちに答えは出ると思うけど。
  event_arkguardian2_01_e_54:
    speaker: liliweiss
    en: If there's any silver lining to this, they don't appear to wield the same
      power as Anachiro.
    ko: |-
      다행이라면 다행일까.
      아나키오르 만큼의 힘은 발휘하지 못하고 있어.
    ja: |-
      不幸中の幸いは、
      アナキオールほどの力がないこと。
  event_arkguardian2_01_e_55:
    speaker: liliweiss
    en: Most likely due to a difference in body specs.
    ko: 아마 소체의 스펙 차이 때문이겠지.
    ja: たぶん、ボディの性能の差じゃないかな。
  event_arkguardian2_01_e_56:
    speaker: hongryeon_o
    en: "'Tis a great relief."
    ko: 그건 듣던 중 다행인 말이군.
    ja: それはなんとも、よい知らせだ。
  event_arkguardian2_01_e_57:
    speaker: liliweiss
    en: Anyway, all we can do is wait for now.
    ko: 아무튼, 지금은 기다리는 것 말고는 아무것도 할 수 없어.
    ja: |-
      とにかく、今は待つ以外に
      できることもないから。
  event_arkguardian2_01_e_58:
    speaker: liliweiss
    en: I know this is easier said than done, but rest. Got it?
    ko: |-
      그러니 다들 편하게 쉬고들 있어.
      쉽지 않겠지만. 알겠지?
    ja: |-
      みんなはゆっくり休んで。
      難しい注文だと思うけど。分かった？
  event_arkguardian2_01_e_59:
    speaker: liliweiss
    en: I'll see you all later.
    ko: 간다.
    ja: また後でね。
  event_arkguardian2_01_e_60:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  event_arkguardian2_01_e_61:
    speaker: "<Narration>"
    en: Liliweiss opens the door and steps out.
    ko: 릴리바이스가 문을 열고 나간다.
    ja: リリーバイスがドアを開き、出ていった
  event_arkguardian2_01_e_62:
    speaker: "<Narration>"
    en: Snow White stares blankly, watching Lilith leave.
    ko: 스노우 화이트는 그 모습을 멍하니 바라보고 있다.
    ja: スノーホワイトはその姿を呆然と見送った
  event_arkguardian2_01_e_63:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_64:
    speaker: rapunzel_o
    en: We still don't know how Lilith's doing, do we?
    ko: "…릴리스의 상태가 어떤지는 아직 모르죠?"
    ja: "…リリスの状態のことは何も聞いていませんか？"
  event_arkguardian2_01_e_65:
    speaker: dorothy
    en: "... No."
    ko: "…예."
    ja: "…ええ。"
  event_arkguardian2_01_e_66:
    speaker: hongryeon_o
    en: Her countenance bore the mark of grievous illness.
    ko: 중병을 앓고 있는 것처럼 보였네만.
    ja: あの時はずいぶん具合が悪そうだったが。
  event_arkguardian2_01_e_67:
    speaker: rapunzel_o
    en: Nikkes are immune to all diseases by default.
    ko: 니케는 기본적으로 모든 질병에는 면역이에요.
    ja: ニケは基本的に病気にはなりません。
  event_arkguardian2_01_e_68:
    speaker: rapunzel_o
    en: But the fact that she coughed up blood means something's amiss with her body...
    ko: "…그런데 피를 토했다는 건, 분명 신체 어딘가가…."
    ja: |-
      …吐血したということは、
      きっとボディのどこかが…
  event_arkguardian2_01_e_69:
    speaker: dorothy
    en: Snow White.
    ko: 스노우 화이트.
    ja: スノーホワイト。
  event_arkguardian2_01_e_70:
    speaker: snowwhite_o
    en: Yes?
    ko: 예?
    ja: はい？
  event_arkguardian2_01_e_71:
    speaker: dorothy
    en: Go after Lilith.
    ko: 릴리스를 따라가 봐요.
    ja: リリスの後を追って…
  event_arkguardian2_01_e_72:
    speaker: dorothy
    en: Talk to her.
    ko: 이야기를 나눠봐요.
    ja: 話を聞いてみてください。
  event_arkguardian2_01_e_73:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_74:
    speaker: snowwhite_o
    en: I don't think that's a good idea.
    ko: "…괜찮아요."
    ja: "…やめておきます。"
  event_arkguardian2_01_e_75:
    speaker: snowwhite_o
    en: If I go after her now, all I'll do is cling to her and cry.
    ko: 제가 가봤자 붙잡고 우는 것 밖에 못 할 테니까요.
    ja: |-
      私が行っても、泣きつくことぐらいしか
      できそうにありませんから。
  event_arkguardian2_01_e_76:
    speaker: snowwhite_o
    en: She has enough on her mind as is. I shouldn't add to it.
    ko: |-
      그리고 지금 가장 생각이 많은 건 언니일 테니,
      저까지 언니를 흔들면 안 되겠죠.
    ja: |-
      それに、いま誰より不安なのは
      きっとお姉ちゃん自身です。
      余計に困らせるわけにはいきません。
  event_arkguardian2_01_e_77:
    speaker: snowwhite_o
    en: She'll talk to us once she's sorted out her thoughts. I'm sure of it.
    ko: 생각이 정리되면 얘기해줄 거라 믿어요.
    ja: 気持ちが整理できたら、話してくれるはずです。
  event_arkguardian2_01_e_78:
    speaker: snowwhite_o
    en: Until then... I'll wait.
    ko: 그때까지 기다리려고요.
    ja: その時まで待ちます。
  event_arkguardian2_01_e_79:
    speaker: rapunzel_o
    en: Oh my.
    ko: "…어머나."
    ja: "…まあ…"
  event_arkguardian2_01_e_80:
    speaker: dorothy
    en: You really have grown up.
    ko: 정말 다 컸네요.
    ja: 大人になりましたね。
  event_arkguardian2_01_e_81:
    speaker: hongryeon_o
    en: Seest thou? Did I not intimate as much?
    ko: 그것 보게. 내 뭐라고 했는가.
    ja: 見たまえ。私の言った通りであろう？
  event_arkguardian2_01_e_82:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_01_e_83:
    speaker: dorothy
    en: It's only natural that we change, whether we like it or not.
    ko: |-
      변할 수밖에 없는 거겠죠.
      우리 모두.
    ja: |-
      変わるしかないのでしょうね。
      私たち全員が。
event_arkguardian2_02_s:
  event_arkguardian2_02_s_1:
    speaker: commander
    en: Vapaus?
    ko: "…언체인드?"
    ja: "…アンチェインド？"
  event_arkguardian2_02_s_2:
    speaker: VTCPriestess
    en: Yes.
    ko: 예.
    ja: その通り。
  event_arkguardian2_02_s_3:
    speaker: VTCPriestess
    en: It's a unique substance that can be extracted from your blood.
    ko: 지휘관님의 혈액에서 추출 가능한 특수한 물질의 이름입니다.
    ja: |-
      貴方の血液から抽出可能な、
      特殊物質の名称です。
  event_arkguardian2_02_s_4:
    speaker: commander
    en: What is it exactly?
    ko: 뭔데 그게.
    ja: どういうものなんだ。
  event_arkguardian2_02_s_5:
    speaker: VTCPriestess
    en: To put it simply, it is a substance that kills nanomachines,
    ko: 간단히 말씀드리면, 나노 머신을 죽이는 물질입니다.
    ja: 端的には、ナノマシンを殺す物質と言えます。
  event_arkguardian2_02_s_6:
    speaker: VTCPriestess
    en: including the NIMPH within a Nikke's brain.
    ko: 니케의 뇌에 있는 NIMPH는 물론.
    ja: ニケの脳内にあるNIMPHはもちろんのこと…
  event_arkguardian2_02_s_7:
    speaker: VTCPriestess
    en: It can also disintegrate the physical body of a Heretic.
    ko: 헬레틱의 몸을 붕괴시킬 수 있는 물질이죠.
    ja: ヘレティックの身体を構成する、それさえも。
  event_arkguardian2_02_s_8:
    speaker: commander
    en: A Heretic...?
    ko: "…헬레틱을."
    ja: ヘレティックの…
  event_arkguardian2_02_s_9:
    speaker: VTCPriestess
    en: Yes. Not long ago, five Heretics attacked the Ark entrance. The Goddess Squad
      wiped them all out.
    ko: 예. 얼마 전, 방주 입구를 습격한 헬레틱 5체는 갓데스 스쿼드의 활약으로 전멸했으나.
    ja: |-
      そうです。先日の封鎖作戦で
      ゴッデス部隊が撃破した、ヘレティック5体…
  event_arkguardian2_02_s_10:
    speaker: VTCPriestess
    en: One of them was exposed to the Vapaus within you, which caused the collapse
      of her nanomachines and the loss of her regenerative abilities.
    ko: 그중 하나는 지휘관님의 언체인드에 노출되어 나노 머신이 붕괴되어 재생 능력을 상실.
    ja: |-
      そのうち1体は貴方由来のアンチェインドで
      ナノマシンが崩壊し、再生能力を失っています。
  event_arkguardian2_02_s_11:
    speaker: VTCPriestess
    en: She was ultimately eliminated by the Goddess Squad.
    ko: 갓데스 스쿼드의 공격으로 인해 소멸했습니다.
    ja: |-
      その後、ゴッデス部隊の攻撃で
      消滅したことを確認しました。
  event_arkguardian2_02_s_12:
    speaker: VTCPriestess
    en: Additionally, when we administered it to the captured Heretic, Anachiro, it
      was confirmed the Vapaus in your blood is genuine.
    ko: 덧붙여 포획한 헬레틱 아나키오르에게도 투입한 결과, 지휘관님의 언체인드는 진짜임이 판명되었습니다.
    ja: |-
      捕獲したヘレティック・アナキオールに対する
      実験で、有効性が確かめられました。
  event_arkguardian2_02_s_13:
    speaker: VTCPriestess
    en: While there were minor complications, it's nothing to be concerned about.
    ko: 뭐… 이후에 사소한 문제가 있긴 했지만 크게 신경 쓸 정도는 아니겠죠.
    ja: |-
      まあ…実験後に別の問題が発生しましたが、
      大したことではありません。
  event_arkguardian2_02_s_14:
    speaker: VTCPriestess
    en: We've assigned Hellhound to the matter. It should be resolved soon.
    ko: 헬하운드를 붙여놨으니 금방 해결될 겁니다.
    ja: |-
      猟犬が対処に当たっていますので、
      すぐに解決するでしょう。
  event_arkguardian2_02_s_15:
    speaker: commander
    en: So you're telling me that Heretic disintegrated... because of my blood?
    ko: 뭐야. 그 시커먼 헬레틱이 바스러지던 게, 그게 내 피 때문이라고?
    ja: |-
      つまり、あの黒いヘレティックが
      ボロボロになったのは、
      私の血のせいだったということか？
  event_arkguardian2_02_s_16:
    speaker: VTCPriestess
    en: That's correct.
    ko: 그렇습니다.
    ja: その通りです。
  event_arkguardian2_02_s_17:
    speaker: commander
    en: Well, she did stab me in the guts. Maybe it wasn't my blood that did it, but
      my fecal matter.
    ko: 그 자식이 내 내장을 쑤셨으니까 똥 때문일 수도 있지 않을까?
    ja: |-
      内臓をえぐられたんだ。
      ウンコの方が原因ってことも
      あるんじゃないか？
  event_arkguardian2_02_s_18:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_19:
    speaker: commander
    en: "... Not your type of humor. Noted."
    ko: 음. 이런 농담 안 좋아하는군. 주의하지.
    ja: |-
      うむ…そういう冗談は苦手のようだな。
      今後は気をつけよう。
  event_arkguardian2_02_s_20:
    speaker: VTCPriestess
    en: Much appreciated.
    ko: 감사합니다.
    ja: ご配慮に感謝します。
  event_arkguardian2_02_s_21:
    speaker: commander
    en: So, how is any of this even possible?
    ko: "…그래서, 왜 그런 게 가능한 거지?"
    ja: "…それで、どうしてそんなことになる？"
  event_arkguardian2_02_s_22:
    speaker: commander
    en: Why is there such a substance in my blood, and why is it lethal to the Heretics?
    ko: |-
      왜 내 피에 그런 물질이 있고,
      그게 헬레틱에게 특효인 거야.
    ja: |-
      なぜ私の血の中にそんなモノがあって、
      どうしてヘレティックに効くんだ？
  event_arkguardian2_02_s_23:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_24:
    speaker: VTCPriestess
    en: I can only disclose that it's part of a long-forgotten project known as Mechanical
      Messiah,
    ko: "…오래전, 머신 메사이어라 불린 프로젝트의 일환이라고만 얘기 해두겠습니다."
    ja: |-
      …マシンメサイアと呼ばれた、
      古いプロジェクトの影響とだけ。
  event_arkguardian2_02_s_25:
    speaker: VTCPriestess
    en: the details of which I cannot share, even to you, Commander.
    ko: 자세한 사항은 아무리 지휘관님이라 하더라도 알려드릴 수 없습니다.
    ja: |-
      それ以上の詳細は、
      いくら貴方であっても開示しかねます。
  event_arkguardian2_02_s_26:
    speaker: commander
    en: Heh. Classified. Figures.
    ko: 하. 그놈의 기밀은.
    ja: フン…また機密事項か。
  event_arkguardian2_02_s_27:
    speaker: commander
    en: I couldn't care less what you're up to at the V.T.C.,
    ko: 너희 V.T.C. 놈들이 뭘 하든 알 바는 아니지만.
    ja: |-
      君らV.T.C.が何をしていようと、
      知ったことではないが…
  event_arkguardian2_02_s_28:
    speaker: commander
    en: but keep doing your dirty work in the shadows, and one day it'll catch up
      with you.
    ko: 계속 그렇게 뒷구멍으로 지저분한 짓만 골라서 하다간 언젠가 패망할 거다.
    ja: |-
      表で言えないようなことばかり
      やっているようでは、いつか破滅するぞ。
  event_arkguardian2_02_s_29:
    speaker: VTCPriestess
    en: Do you really think that'll happen?
    ko: 그럴 리가 있겠습니까.
    ja: そのようなことは起こり得ません。
  event_arkguardian2_02_s_30:
    speaker: commander
    en: Right now, you can act as if you're untouchable, since this is your world.
    ko: 지금이야 그럴 리가 있겠냐고 여유 부릴 수 있겠지. 너희들 세상이니까.
    ja: |-
      余裕ぶってられるのは今のうちだけだ。
      今は何でも思い通りだろうがな。
  event_arkguardian2_02_s_31:
    speaker: commander
    en: But the second things backfire and the consequences of your filthy actions
      start affecting us,
    ko: 그런데 너희가 하는 지저분한 짓이 우리한테 영향을 미치는 순간.
    ja: |-
      だが、ひとたび君たちの悪事が
      私たちに害を及ぼせば…
  event_arkguardian2_02_s_32:
    speaker: commander
    en: prepare for the church to close its doors.
    ko: 교회 문 닫을 준비나 해라.
    ja: 二度と教会の門は開けられなくなると思え。
  event_arkguardian2_02_s_33:
    speaker: VTCPriestess
    en: I shall bear that in mind.
    ko: 명심하죠.
    ja: 肝に銘じておきましょう。
  event_arkguardian2_02_s_34:
    speaker: commander
    en: It's not every day you get to chat with a V.T.C. priestess, so let me ask
      you something.
    ko: 얼굴 보기 힘든 V.T.C.의 사제님을 만난 김에 하나 물어보자.
    ja: |-
      V.T.C.の司祭なんて、
      滅多にお目にかかれないんだ。
      ついでにひとつ聞かせてもらおうか。
  event_arkguardian2_02_s_35:
    speaker: commander
    en: The Ark...
    ko: 방주.
    ja: アークは…
  event_arkguardian2_02_s_36:
    speaker: commander
    en: It wasn't built after the Rapture invasion, was it?
    ko: 랩쳐 침공 이후에 만들어진 게 아니지?
    ja: |-
      ラプチャーの侵攻より前に
      作られ始めていたんじゃないか？
  event_arkguardian2_02_s_37:
    speaker: VTCPriestess
    en: Why do you think so?
    ko: 왜 그런 생각을 하시는 건가요?
    ja: なぜそう思われるのです？
  event_arkguardian2_02_s_38:
    speaker: commander
    en: Because it's rather strange if you ask me.
    ko: 누가 봐도 이상하니까.
    ja: どう考えてもつじつまが合わないからだ。
  event_arkguardian2_02_s_39:
    speaker: commander
    en: I took a little field trip down to the Ark once.
    ko: 견학 겸 한번 내려가 본 적 있거든. 방주에.
    ja: 一度見学したことがある。実物をな。
  event_arkguardian2_02_s_40:
    speaker: commander
    en: You're telling me that massive, advanced underground city was constructed
      in just a few years?
    ko: 그렇게 넓고 기술 수준이 높은 지하 도시가 단 몇 년 만에 만들어졌다고?
    ja: |-
      あれほど広くて高度な技術の施された
      地下都市が、たった数年でできただと？
  event_arkguardian2_02_s_41:
    speaker: commander
    en: It was not even mid-construction. It was basically finished.
    ko: 한창 만드는 것도 아니고, 지금 거의 다 만들었더만.
    ja: |-
      それも建設の大部分は終わって、
      ほとんど完成していた。
  event_arkguardian2_02_s_42:
    speaker: VTCPriestess
    en: You're seriously underestimating humanity's technological prowess.
    ko: 인류의 기술 수준을 너무 무시하시는군요.
    ja: 人類の技術水準を低く見すぎているのでしょう。
  event_arkguardian2_02_s_43:
    speaker: VTCPriestess
    en: We've even come close to the realm of the divine before.
    ko: 저희는 신의 영역에 닿은 적이 있을 정도입니다.
    ja: 我々は神の領域に手が届いたのです。
  event_arkguardian2_02_s_44:
    speaker: commander
    en: That's ridiculous. Just excavating all that dirt alone would have taken a
      decade.
    ko: 헛소리를. 땅만 파내도 10년은 걸렸을 거다.
    ja: |-
      バカを言うな。
      土を掘るだけでも10年はかかるはずだ。
  event_arkguardian2_02_s_45:
    speaker: commander
    en: 'After thinking it through, I''ve got two theories:'
    ko: 아무튼, 이렇게까지 오면 내 머릿속에 드는 생각은 딱 두 개야.
    ja: |-
      とにかく、あれを見れば
      考えられることは2つしかない。
  event_arkguardian2_02_s_46:
    speaker: commander
    en: Either you've got tech that defies belief,
    ko: 진짜 말도 안 되는 기술을 가지고 있거나.
    ja: 本当に常識をはるかに超えた技術が実在するか…
  event_arkguardian2_02_s_47:
    speaker: commander
    en: or you predicted the Rapture invasion a long time ago.
    ko: 랩쳐 침공을 오래전부터 예견하고 있었거나.
    ja: |-
      あるいは、ラプチャーの侵攻が
      大昔から予見されていたかだ。
  event_arkguardian2_02_s_48:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_49:
    speaker: commander
    en: Seems one of the two theories hold truth after all.
    ko: 정답인가 보군.
    ja: それが答えか。
  event_arkguardian2_02_s_50:
    speaker: VTCPriestess
    en: Your suspicion is nothing more than baseless conjecture.
    ko: 증거없는 억측일 뿐입니다.
    ja: 根拠のない臆測です。
  event_arkguardian2_02_s_51:
    speaker: commander
    en: Naturally, since you didn't leave behind any evidence.
    ko: 그렇겠지. 너희가 증거 같은 걸 남겨뒀을 리가 없으니까.
    ja: |-
      そうだろうな。
      証拠を残すような君らではない。
  event_arkguardian2_02_s_52:
    speaker: commander
    en: Oh, just to be clear,
    ko: 아, 오해할까 봐 미리 말해놓는데.
    ja: ああ、誤解のないように言っておこう。
  event_arkguardian2_02_s_53:
    speaker: commander
    en: this is pure curiosity on my part.
    ko: 그냥 단순한 내 호기심이야.
    ja: 私は興味本位で聞いただけだ。
  event_arkguardian2_02_s_54:
    speaker: commander
    en: I've no intentions of stirring up trouble, so chill.
    ko: 이걸 가지고 선동한다거나 할 생각은 없으니까 안심해.
    ja: 言いふらすつもりはない。心配は無用だ。
  event_arkguardian2_02_s_55:
    speaker: VTCPriestess
    en: Appreciate the thought.
    ko: 배려에 감사드립니다.
    ja: ご配慮に感謝します。
  event_arkguardian2_02_s_56:
    speaker: commander
    en: Anyway, how's my physical body?
    ko: 그럼. 내 몸은 지금 어떻지?
    ja: それより、私の身体はどうなった？
  event_arkguardian2_02_s_57:
    speaker: VTCPriestess
    en: We had to remove a significant portion of your internal organs.
    ko: 내장 상당 부분을 덜어냈습니다.
    ja: 内臓の大部分を切除せざるを得ませんでした。
  event_arkguardian2_02_s_58:
    speaker: VTCPriestess
    en: You might not be able to live an ordinary life from now on.
    ko: 아마 앞으로는 정상적인 삶을 살아갈 순 없을 겁니다.
    ja: |-
      おそらく今後、いままで通りの日常は
      送れなくなるでしょう。
  event_arkguardian2_02_s_59:
    speaker: VTCPriestess
    en: Any strenuous movements will undoubtedly have a big impact on your daily life.
    ko: 격한 행동은 물론, 일상생활에도 크게 영향이 가겠죠.
    ja: |-
      激しい運動は当然ながら、
      生活が著しく制限されるはずです。
  event_arkguardian2_02_s_60:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_61:
    speaker: commander
    en: If there's any time I could use one of your so-called "miracles," now would
      be it.
    ko: 너희 자랑인 그 [기적]으로 어떻게 좀 해봐.
    ja: ご自慢の「奇跡」とやらで、どうにかしてくれ。
  event_arkguardian2_02_s_62:
    speaker: VTCPriestess
    en: The only reason you have made it this far is because of a miracle.
    ko: 그걸 했기 때문에 거기서 그친 겁니다.
    ja: どうにかした結果、生きておられるのです。
  event_arkguardian2_02_s_63:
    speaker: VTCPriestess
    en: Otherwise, you would already be dead.
    ko: 그렇지 않으면 이미 돌아가셨겠죠.
    ja: |-
      そうでなければ、
      とうに命を落とされていたでしょう。
  event_arkguardian2_02_s_64:
    speaker: commander
    en: I'm pretty sturdy, you know.
    ko: 나 튼튼한데?
    ja: しぶとさには自信があるぞ？
  event_arkguardian2_02_s_65:
    speaker: VTCPriestess
    en: Yes, I am aware. That is precisely why you can still stand and speak.
    ko: 예. 압니다. 그래서 지금 그렇게 서서 얘기도 할 수 있는 겁니다.
    ja: |-
      それは我々も知るところです。
      今こうして立ち話をしていることが、
      何よりの証拠ですから。
  event_arkguardian2_02_s_66:
    speaker: VTCPriestess
    en: An ordinary human would have been bedridden and on life support for the rest
      of their days.
    ko: 보통 인간 같았으면 누워서 생명 연장하는 것 정도가 한계였을 테죠.
    ja: |-
      並の人間であれば、今ごろは
      寝たきりで延命装置に
      つながれていたはずです。
  event_arkguardian2_02_s_67:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_68:
    speaker: commander
    en: Well, thanks.
    ko: 그래. 고맙다.
    ja: そうか。礼を言う。
  event_arkguardian2_02_s_69:
    speaker: VTCPriestess
    en: Think nothing of it.
    ko: 별말씀을.
    ja: 痛みいります。
  event_arkguardian2_02_s_70:
    speaker: commander
    en: I should get going.
    ko: 그럼 이만 가보겠다.
    ja: そろそろ失礼させてもらうとしよう。
  event_arkguardian2_02_s_71:
    speaker: commander
    en: My poor subordinates must be wearing a hole in the floor, waiting for me.
    ko: 개 같이 구르는 불쌍한 부하들이 기다리고 있어서 말이야.
    ja: かわいそうな部下たちを待たせているからな。
  event_arkguardian2_02_s_72:
    speaker: commander
    en: Thanks a bunch. I owe you one.
    ko: 수고 많았어. 은혜는 반드시 갚겠다.
    ja: とにかく助かった。恩はいずれ必ず返す。
  event_arkguardian2_02_s_73:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_74:
    speaker: "<Narration>"
    en: The Commander leaves the room.
    ko: 지휘관이 방을 나선다.
    ja: 指揮官が部屋を出ようとした
  event_arkguardian2_02_s_75:
    speaker: commander
    en: Next time someone leaves, at least say goodbye. I swear, you V.T.C. weirdos
      are so thick-headed.
    ko: |-
      사람이 나가면 인사 좀 해.
      하여간 V.T.C. 놈들은 머리가 무거워서 큰일이야.
    ja: |-
      別れ際のあいさつも無しか。
      V.T.C.の連中は無愛想にもほどがあるな。
  event_arkguardian2_02_s_76:
    speaker: "<Narration>"
    en: "*Clunk*"
    ko: 덜컥.
    ja: カチッ
  event_arkguardian2_02_s_77:
    speaker: commander
    en: "?"
    ko: "…?"
    ja: "…？"
  event_arkguardian2_02_s_78:
    speaker: "<Narration>"
    en: "*Clunk clunk*"
    ko: 덜컥 덜컥.
    ja: ガチャ、ガチャ…
  event_arkguardian2_02_s_79:
    speaker: commander
    en: Hey, is this door busted or what? It won't open.
    ko: 야. 문 안 열려. 고장 났네 이거.
    ja: |-
      なんだ、ドアが開かないぞ。
      壊れてるんじゃないか？
  event_arkguardian2_02_s_80:
    speaker: VTCPriestess
    en: Is that so?
    ko: 그렇습니까.
    ja: そうですね。
  event_arkguardian2_02_s_81:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_s_82:
    speaker: commander
    en: You bastards! What the hell do you think you're doing?!
    ko: 너 이 새X들 이게 지금 뭐 하는 짓…!
    ja: 冗談はやめろ、何を企んで…！
  event_arkguardian2_02_s_83:
    speaker: "<Narration>"
    en: "*Zap*"
    ko: 파칫-!
    ja: バチッ！
  event_arkguardian2_02_s_84:
    speaker: "<Narration>"
    en: The V.T.C. priestess tases the Commander.
    ko: V.T.C. 여사제의 테이저건이 지휘관에게 명중한다.
    ja: |-
      スタンガンから電極が飛び出し、
      指揮官に命中した
  event_arkguardian2_02_s_85:
    speaker: "<Narration>"
    en: He drops to the floor without so much as a sound.
    ko: 지휘관은 비명도 지르지 못한 채 바닥에 쓰러진다.
    ja: 指揮官は声もなく倒れた
  event_arkguardian2_02_s_86:
    speaker: VTCPriestess
    en: The Vapaus... is a precious piece of lost technology, especially to us.
    ko: 언체인드는… 그래요. 저희 입장에서도 로스트 테크놀로지입니다.
    ja: |-
      アンチェインドは…そう。
      私たちにとっても
      失われたテクノロジーですので。
  event_arkguardian2_02_s_87:
    speaker: VTCPriestess
    en: We cannot afford to lose such a rare specimen.
    ko: 이런 귀중한 샘플을 놓칠 수 없습니다.
    ja: 貴重なサンプルを見逃すことはできません。
  event_arkguardian2_02_s_88:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  event_arkguardian2_02_s_89:
    speaker: "<Narration>"
    en: The door opens, and the Central Government soldiers enter.
    ko: 문이 열리고 중앙 정부 병사들이 들어온다.
    ja: |-
      ドアが開き、中央政府の兵士たちが
      押し入ってきた
  event_arkguardian2_02_s_90:
    speaker: "<Narration>"
    en: They tie up the fallen Commander and lift him up.
    ko: 쓰러진 지휘관을 포박하고 들어 올린다.
    ja: 兵士は指揮官を拘束し、立ち上がらせた
  event_arkguardian2_02_s_91:
    speaker: commander
    en: Easy... I'm a patient here...
    ko: 살살해라… 나 환자다….
    ja: 加減しろ…私は重傷者だぞ…
  event_arkguardian2_02_s_92:
    speaker: VTCPriestess
    en: You will be taken to the laboratory.
    ko: 실험실로 갈 겁니다.
    ja: 実験室へ向かいます。
  event_arkguardian2_02_s_93:
    speaker: VTCPriestess
    en: For the sake of humanity's future, I request your full cooperation in donating
      your blood.
    ko: 인류의 미래를 위해, 지휘관의 적극적인 헌혈을 부탁드립니다.
    ja: 人類の未来のため、積極的な献血にご協力を。
  event_arkguardian2_02_s_94:
    speaker: commander
    en: Listen.
    ko: 야, 야.
    ja: おい、やめてくれ…
  event_arkguardian2_02_s_95:
    speaker: commander
    en: I have to go back.
    ko: 나 돌아가야 돼.
    ja: 戻らなければならないんだ。
  event_arkguardian2_02_s_96:
    speaker: commander
    en: My subordinates and I need to defend against those Raptures.
    ko: 가서 부하들이랑 랩쳐 막아야 된다고.
    ja: 部下たちと、ラプチャーを食い止めないと…
  event_arkguardian2_02_s_97:
    speaker: commander
    en: Once that's done, I'll give you as much blood as you want—so untie me.
    ko: 그거 끝나고 피든 뭐든 줄 테니까, 이거 풀어.
    ja: |-
      それが終われば、いくらでも協力する…
      解放してくれ…
  event_arkguardian2_02_s_98:
    speaker: VTCPriestess
    en: Take him away.
    ko: 데려가 주세요.
    ja: ご案内を。
  event_arkguardian2_02_s_99:
    speaker: "<Narration>"
    en: The Central Government soldiers drag the Commander away.
    ko: 중앙 정부 병사들이 지휘관을 끌고 간다.
    ja: 兵士たちは指揮官を連れ去ろうとした
  event_arkguardian2_02_s_100:
    speaker: "<Narration>"
    en: The Commander jerks his head back, then whips it to the side.
    ko: |-
      지휘관의 고개가 젖혀진다.
      그대로 옆을 향해 내던지듯 휘두른다.
    ja: |-
      指揮官が首を後ろに反らし、
      横向きに身を投げた
  event_arkguardian2_02_s_101:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 콰직-!
    ja: バキッ！
  event_arkguardian2_02_s_102:
    speaker: "<Narration>"
    en: The sound of breaking bone echoes as a soldier's nose crumbles under the impact.
    ko: 뼈가 부러지는 소리가 들리며 중앙 정부 병사의 코가 뭉개진다.
    ja: 兵士の鼻がつぶれ、骨の砕ける音がした
  event_arkguardian2_02_s_103:
    speaker: "<Narration>"
    en: The Commander drives his shoulder into another soldier's jaw.
    ko: 지휘관은 바로 어깨로 다른 병사의 턱을 올려 친다.
    ja: |-
      指揮官は息つく間もなく
      肩で別の兵士のあごを突き上げた
  event_arkguardian2_02_s_104:
    speaker: "<Narration>"
    en: Another grisly snap rings out, and the soldier collapses.
    ko: 끔찍한 소리가 또다시 울려 퍼지며 병사가 쓰러진다.
    ja: おぞましい音とともに、兵士が倒れた
  event_arkguardian2_02_s_105:
    speaker: commander
    en: Awfully presumptuous of you to think two pathetic grunts could restrain me.
    ko: 건방지게 어디 일반병 둘을 감히 나한테 붙이고…!
    ja: 2人ごときで私を止められると思うな…！
  event_arkguardian2_02_s_106:
    speaker: VTCPriestess
    en: Hmm...
    ko: 흐음….
    ja: "…"
  event_arkguardian2_02_s_107:
    speaker: "<Narration>"
    en: "*Zap*"
    ko: 파칫-!
    ja: バチッ！
  event_arkguardian2_02_s_108:
    speaker: "<Narration>"
    en: The priestess fires the taser once again.
    ko: 테이저건이 다시 한번 발사된다.
    ja: 指揮官は再び電撃を浴びた
  event_arkguardian2_02_s_109:
    speaker: commander
    en: Urgh... grrrghh...!
    ko: 윽… 크으으으윽…!
    ja: うっ…ぐうううっ…！
  event_arkguardian2_02_s_110:
    speaker: "<Narration>"
    en: The Commander slumps weakly to the ground.
    ko: 지휘관이 힘없이 바닥에 쓰러진다.
    ja: 力を失った指揮官が、地面に倒れた
  event_arkguardian2_02_s_111:
    speaker: "<Narration>"
    en: The V.T.C. priestess steps forward to check the Commander's vitals and breathing.
    ko: V.T.C. 여사제가 다가가 지휘관의 맥박과 호흡을 확인한다.
    ja: |-
      V.T.C.の司祭が近づき、
      指揮官の脈拍と呼吸を確かめた
  event_arkguardian2_02_s_112:
    speaker: VTCPriestess
    en: Thought you might be dead, but it seems you merely lost consciousness.
    ko: "…죽으면 어쩌나 싶었는데, 그냥 기절입니까."
    ja: |-
      …命の危険を心配しましたが…
      気絶で済みましたか。
  event_arkguardian2_02_s_113:
    speaker: VTCPriestess
    en: Heh. It's getting harder to tell who the real monster is anymore.
    ko: 후후. 누가 괴물인지 모를 지경이군요.
    ja: ふふ…怪物はどちらでしょうね。
event_arkguardian2_02_e:
  event_arkguardian2_02_e_1:
    speaker: "<Narration>"
    en: The Commander opens his eyes.
    ko: 지휘관은 눈을 뜬다.
    ja: 指揮官が目を覚ました
  event_arkguardian2_02_e_2:
    speaker: "<Narration>"
    en: The V.T.C. priestess sits across from him.
    ko: V.T.C.의 사제가 맞은편에 앉아 있다.
    ja: 司祭が向かい合うように座っている
  event_arkguardian2_02_e_3:
    speaker: commander
    en: I see you felt it necessary to hogtie me.
    ko: "…음. 단단하게도 묶어놨군."
    ja: "…フン…ずいぶん念入りに縛ったようだな。"
  event_arkguardian2_02_e_4:
    speaker: VTCPriestess
    en: We've also administered a tranquilizer.
    ko: 진정제도 투여했습니다.
    ja: 鎮静剤も投与してあります。
  event_arkguardian2_02_e_5:
    speaker: commander
    en: I'm just one man, not an elephant.
    ko: 뭔 코끼리라도 잡냐.
    ja: ゾウでも捕まえたつもりか？
  event_arkguardian2_02_e_6:
    speaker: VTCPriestess
    en: It doesn't seem to make a difference. You're far more conscious than a human
      who's been tranquilized.
    ko: |-
      크게 다르지 않은 것 같습니다.
      진정제를 맞은 인간의 의식 수준이 아닙니다.
    ja: |-
      同じようなものです。
      鎮静剤の影響下でなお、
      こうして会話できるのですから。
  event_arkguardian2_02_e_7:
    speaker: commander
    en: Well then,
    ko: 그래서.
    ja: それで…
  event_arkguardian2_02_e_8:
    speaker: commander
    en: mind telling me what's up with this circus?
    ko: 지금 이게 뭔 지랄이지?
    ja: どうするつもりだ？
  event_arkguardian2_02_e_9:
    speaker: VTCPriestess
    en: We intend to study your blood and develop a method to mass-produce Vapaus.
    ko: 지휘관님의 혈액을 연구해, 언체인드를 양산화할 수 있는 방법을 찾아낼 겁니다.
    ja: |-
      貴方の血液を研究し、
      アンチェインドの量産技術を確立させます。
  event_arkguardian2_02_e_10:
    speaker: commander
    en: And if you take a few too many pints of blood, I'll die.
    ko: 피 많이 뽑으면 죽어.
    ja: 血を大量に抜かれたら私でも死ぬぞ。
  event_arkguardian2_02_e_11:
    speaker: VTCPriestess
    en: You need not worry, we will only extract enough to keep you alive.
    ko: 죽지 않을 정도로만 뽑을 테니 걱정마시길.
    ja: 死なない程度にしますので、ご心配なく。
  event_arkguardian2_02_e_12:
    speaker: commander
    en: Can't I just give you a little bit at a time?
    ko: 그냥 내가 조금씩 줄게.
    ja: |-
      少しずつ渡すだけでいいなら、
      ここまでしなくても協力した。
  event_arkguardian2_02_e_13:
    speaker: VTCPriestess
    en: If the sample size is too small, it will create difficulties in several aspects.
    ko: 샘플의 수가 터무니없을 정도로 적으면 여러모로 곤란합니다.
    ja: 十分なサンプルの確保が絶対ですので。
  event_arkguardian2_02_e_14:
    speaker: commander
    en: I've no idea what's gotten you in such a tizzy,
    ko: 그… 네가 지금 뭐 때문에 눈이 돌았는지는 모르겠는데.
    ja: |-
      分からん…なぜそう必死になるのか
      知らないが…
  event_arkguardian2_02_e_15:
    speaker: commander
    en: but I'm the Commander of the Goddess Squad.
    ko: 나 갓데스의 지휘관이야.
    ja: 私はゴッデスの指揮官なんだ。
  event_arkguardian2_02_e_16:
    speaker: commander
    en: I'm currently part of an operation to guard the Ark's entrance while it's
      being sealed.
    ko: 지금 방주 밀봉 동안 입구를 지키는 작전을 수행 중이고.
    ja: |-
      アークの封鎖計画が進行中で、
      その防衛作戦を遂行している。
  event_arkguardian2_02_e_17:
    speaker: commander
    en: If I don't do my job, thousands—maybe even tens of thousands—could die.
    ko: 그거 안 하면 수천, 수만 명이 죽을 수도 있어.
    ja: |-
      私が戻らなければ、
      数千、いや数万という人が死ぬ。
  event_arkguardian2_02_e_18:
    speaker: VTCPriestess
    en: I see.
    ko: 그렇습니까.
    ja: そうでしたか。
  event_arkguardian2_02_e_19:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_20:
    speaker: commander
    en: Let me guess, you don't care.
    ko: 관심없구만?
    ja: どうでもいいと？
  event_arkguardian2_02_e_21:
    speaker: VTCPriestess
    en: No, I do not.
    ko: 예.
    ja: ええ。
  event_arkguardian2_02_e_22:
    speaker: VTCPriestess
    en: Besides, humanity has already lost. During the first phase of the sealing,
      all key personnel have already descended into the Ark.
    ko: |-
      어차피 인류는 졌습니다.
      주요 인원은 이미 1차 밀봉 때 방주로 모두 내려갔습니다.
    ja: |-
      人類の敗北はすでに決まったことです。
      主要な人員は第1次封鎖の時点で
      アークへ収容されました。
  event_arkguardian2_02_e_23:
    speaker: VTCPriestess
    en: In truth, that number alone is sufficient to maintain the Ark.
    ko: 사실 방주가 유지되는 데는 1차 때의 인원만으로도 충분합니다.
    ja: アークの維持は問題なく行えます。
  event_arkguardian2_02_e_24:
    speaker: VTCPriestess
    en: Nevertheless, the reason we have to push through to Phase 3,
    ko: 그럼에도 3차까지 진행하는 이유는….
    ja: |-
      それでも敢えて第3次まで
      計画を継続しようとしているのは…
  event_arkguardian2_02_e_25:
    speaker: VTCPriestess
    en: is for the sake of the ignorant masses.
    ko: 아둔한 민중들을 위함이라고 할 수 있습니다.
    ja: あくまで愚かな民衆への施しです。
  event_arkguardian2_02_e_26:
    speaker: commander
    en: Phase 3?
    ko: 3차까지?
    ja: 第3次まで？
  event_arkguardian2_02_e_27:
    speaker: commander
    en: What happened to Phases 4 and 5?
    ko: 4차랑 5차는 어디 갔어.
    ja: 第4次と第5次はどうした。
  event_arkguardian2_02_e_28:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_29:
    speaker: commander
    en: "... So you're cutting the operation short at Phase 3."
    ko: 하 이것들 3차로 끝낼 생각이네.
    ja: まさか…第3次で切り上げるつもりなのか。
  event_arkguardian2_02_e_30:
    speaker: VTCPriestess
    en: Indeed. The Raptures have already begun mass-producing Heretics.
    ko: 예. 랩쳐는 헬레틱 양산화까지 시작했습니다.
    ja: |-
      ラプチャーはすでに
      ヘレティックの量産化を始めました。
  event_arkguardian2_02_e_31:
    speaker: VTCPriestess
    en: To delay any further would put the Ark in serious peril.
    ko: 더 시간을 끌면 방주가 위험해질 수도 있습니다.
    ja: |-
      これ以上時間をかければ、
      アークが危険にさらされます。
  event_arkguardian2_02_e_32:
    speaker: VTCPriestess
    en: We must protect its citizens.
    ko: "[방주의 시민들]을 지켜야 하니까요."
    ja: "「アークの民」を守らなければなりません。"
  event_arkguardian2_02_e_33:
    speaker: commander
    en: How merciful of V.T.C. A real bunch of saints.
    ko: 선심 쓰셨네. 아주 자애로우셔, 우리 V.T.C.는.
    ja: |-
      ずいぶんお優しいことだな、
      慈悲深きV.T.C.は。
  event_arkguardian2_02_e_34:
    speaker: VTCPriestess
    en: Thank you.
    ko: 감사합니다.
    ja: お褒めの言葉と受け取っておきます。
  event_arkguardian2_02_e_35:
    speaker: commander
    en: You could lose the Goddess Squad.
    ko: 갓데스를 잃을 수도 있다.
    ja: ゴッデスを失うかもしれないんだぞ。
  event_arkguardian2_02_e_36:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_37:
    speaker: commander
    en: You don't care about that either?
    ko: "…그것까지 상관없다?"
    ja: "…それさえ知ったことではないと？"
  event_arkguardian2_02_e_38:
    speaker: VTCPriestess
    en: Technology is ever-advancing.
    ko: 기술은 발전하는 법입니다.
    ja: 技術は進歩するものです。
  event_arkguardian2_02_e_39:
    speaker: VTCPriestess
    en: The latest generation is already on the heels of the Grimms model.
    ko: 이미 스펙 상으로는 페어리 테일 모델의 턱밑까지 쫓아간 세대가 완성되었습니다.
    ja: |-
      すでに性能面でフェアリーテールモデルに
      遅れを取らない次世代型が完成しています。
  event_arkguardian2_02_e_40:
    speaker: commander
    en: Only a fool believes higher specs are the answer to everything.
    ko: 스펙만으로 모든 게 해결될 거라 믿는 멍청이가 여기 있었네.
    ja: |-
      性能だけで何でも解決できるなんて、
      思い上がりだ。
  event_arkguardian2_02_e_41:
    speaker: VTCPriestess
    en: The war is already lost, and humanity has retreated below the surface.
    ko: 이미 진 전쟁. 패배하여 지하로 내려가는 인류.
    ja: |-
      戦争の大勢はすでに決し、
      敗れた人類は地下へ逃れます。
  event_arkguardian2_02_e_42:
    speaker: VTCPriestess
    en: The gifted must prepare for the future—for the counterattack yet to come.
    ko: |-
      우수한 이들은 미래를 준비해야 합니다.
      반격을 위한 미래를 말이죠.
    ja: |-
      能ある者たちは未来へ備える必要があるのです。
      いつか来たるべき反撃の時のために。
  event_arkguardian2_02_e_43:
    speaker: VTCPriestess
    en: Your blood donation will serve as one of the cornerstones.
    ko: 지휘관님의 헌혈은 그 초석 중 일부가 될 수 있습니다.
    ja: |-
      貴方の血も、そのいしずえの
      一部となるでしょう。
  event_arkguardian2_02_e_44:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_45:
    speaker: commander
    en: I'm done talking to the help. Call for your leader.
    ko: 됐고, 부하 1과 더 얘기하고 싶지 않으니까 네 대가리 불러와.
    ja: |-
      分かった、部下1号君。
      君と話すことはもうない。
      上司を呼んできたまえ。
  event_arkguardian2_02_e_46:
    speaker: commander
    en: If we're going to have a real conversation, I need to talk to someone of my
      rank.
    ko: 급이 좀 맞아야 대화가 통하던가 할 것 아냐.
    ja: 話のレベルが合う相手が必要だ。
  event_arkguardian2_02_e_47:
    speaker: VTCPriestess
    en: This matter has been authorized by the higher-ups—straight from the top.
    ko: 상부. 아니, 최상부에게까지 허가를 받은 일입니다.
    ja: |-
      いいえ。この件はすでに上層部…
      いえ、最上層からの承認を受けています。
  event_arkguardian2_02_e_48:
    speaker: commander
    en: Oh? The one you call Her Holiness?
    ko: 오… 그 뭐냐. 니들이 성하라고 부르는 그 양반까지?
    ja: フン…あいつか。君たちが聖下とか呼んでいる…
  event_arkguardian2_02_e_49:
    speaker: VTCPriestess
    en: Yes.
    ko: 예.
    ja: その通りです。
  event_arkguardian2_02_e_50:
    speaker: commander
    en: Crazy bunch of cultish freaks.
    ko: 정신 나간 사이비 새X들 진짜.
    ja: イカれたカルト宗教家どもが。
  event_arkguardian2_02_e_51:
    speaker: VTCPriestess
    en: Kindly mind your words.
    ko: 말씀을 가려주시길.
    ja: 言葉をお慎みください。
  event_arkguardian2_02_e_52:
    speaker: commander
    en: What a load of crap. If you were about to spend your life as a walking blood
      bag, you wouldn't be minding your words either.
    ko: |-
      엿같은 소리하고 있네.
      야. 너 같으면 피 주머니 될 팔자에 말씀이 가려지겠어?
    ja: |-
      クソくらえだ。
      死にかけの身で、いちいち言葉を
      選んでいられると思うのか？
  event_arkguardian2_02_e_53:
    speaker: VTCPriestess
    en: Fair point.
    ko: 그건 그렇습니다.
    ja: 一理ありますね。
  event_arkguardian2_02_e_54:
    speaker: commander
    en: Now, untie me and let me leave.
    ko: 풀어. 날 내보내.
    ja: 解放しろ。早く。
  event_arkguardian2_02_e_55:
    speaker: VTCPriestess
    en: No.
    ko: 안 됩니다.
    ja: それはできません。
  event_arkguardian2_02_e_56:
    speaker: commander
    en: I'll give you my autograph.
    ko: 사인 해줄게.
    ja: サイン色紙をプレゼントしてやろう。
  event_arkguardian2_02_e_57:
    speaker: VTCPriestess
    en: No need.
    ko: 됐습니다.
    ja: 結構です。
  event_arkguardian2_02_e_58:
    speaker: commander
    en: Fine, I'm feeling generous. How about a photo?
    ko: 좋아. 인심 써서 사진까지.
    ja: 分かった。ツーショット写真も撮ってやる。
  event_arkguardian2_02_e_59:
    speaker: VTCPriestess
    en: Not interested.
    ko: 됐습니다.
    ja: 不要です。
  event_arkguardian2_02_e_60:
    speaker: commander
    en: Okay then, how about a dinner date with me?
    ko: 그럼 뭐. 지휘관과의 식사권이라도 줘야 돼?
    ja: 仕方ないな、二人きりのディナー券でどうだ？
  event_arkguardian2_02_e_61:
    speaker: VTCPriestess
    en: No, thank you.
    ko: 필요 없습니다.
    ja: 必要はありません。
  event_arkguardian2_02_e_62:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 푸슉-
    ja: プシューッ――
  event_arkguardian2_02_e_63:
    speaker: CGplatoonleader
    en: Excuse me, Priestess.
    ko: 저, 실례합니다 사제님.
    ja: し、司祭様、失礼いたします…
  event_arkguardian2_02_e_64:
    speaker: VTCPriestess
    en: "... What is it? I told you no one is authorized to enter."
    ko: "…무슨 일이십니까. 여긴 아무도 들어오지 말라고 했을 겁니다."
    ja: |-
      …何の用です。
      誰も入るなと言っておいたはずですが。
  event_arkguardian2_02_e_65:
    speaker: CGplatoonleader
    en: I apologize, but we have a... situation.
    ko: 죄송합니다. 지금… 큰일이 나서.
    ja: 申し訳ございません。ですが…緊急事態です。
  event_arkguardian2_02_e_66:
    speaker: VTCPriestess
    en: What situation?
    ko: 뭡니까.
    ja: 緊急事態？
  event_arkguardian2_02_e_67:
    speaker: "<Narration>"
    en: A Central Government soldier approaches the V.T.C. priestess and whispers.
    ko: 중앙 정부 병사가 V.T.C. 사제에게 다가가 귓속말을 한다.
    ja: 中央政府の兵士は司祭に近づき、耳打ちをした
  event_arkguardian2_02_e_68:
    speaker: "<Narration>"
    en: Her face twists and contorts.
    ko: V.T.C. 여사제의 표정이 구겨진다.
    ja: 司祭の顔がゆがんだ
  event_arkguardian2_02_e_69:
    speaker: VTCPriestess
    en: "... What did you say?"
    ko: "…뭐라고요?"
    ja: "…どういうことです？"
  event_arkguardian2_02_e_70:
    speaker: CGplatoonleader
    en: The officials are waiting outside.
    ko: 관계자들이 밖에서 기다리고 있습니다.
    ja: 外にお待たせしています。
  event_arkguardian2_02_e_71:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_72:
    speaker: VTCPriestess
    en: Excuse me for a moment. We shall continue this conversation when I return.
    ko: |-
      잠시만 실례하겠습니다.
      다녀와서 말씀 계속 나누시죠.
    ja: |-
      少々失礼します。
      お話の続きは後ほど。
  event_arkguardian2_02_e_73:
    speaker: commander
    en: What, did Her Holiness pass away? She did seem like she was hanging on by
      a thread.
    ko: |-
      왜. 성하께서 서거하시기라도 했나?
      그 양반 명줄이 간당간당해 보이긴 하던데.
    ja: |-
      どうした、聖下がお亡くなりか？
      いつくたばっても
      おかしくない様子だったからな。
  event_arkguardian2_02_e_74:
    speaker: VTCPriestess
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_75:
    speaker: commander
    en: Oh snap, did I get it right?
    ko: 오. 진짜야?
    ja: ほう、アタリか？
  event_arkguardian2_02_e_76:
    speaker: commander
    en: Told you. You should have lived a bit more righteously. Now you'll pay the
      price for your sins.
    ko: |-
      거봐. 착하게 살아야지 응?
      그렇게 죄짓고 사니까 천벌 받는 거 아냐.
    ja: |-
      そらみろ、言っただろう？
      ロクでもないことに手を出すからだ。
  event_arkguardian2_02_e_77:
    speaker: "<Narration>"
    en: With a grim expression, the priestess leaves the room, accompanied by the
      soldier.
    ko: V.T.C. 여사제가 굳은 표정을 한 채 병사와 함께 방을 나선다.
    ja: |-
      V.T.C.女司祭は硬い表情を変えず、
      兵士を連れて部屋を出ていった
  event_arkguardian2_02_e_78:
    speaker: "<Narration>"
    en: "*Whoosh whoosh*"
    ko: 푸슉- 푸슉-
    ja: プシューッ、プシューッ――
  event_arkguardian2_02_e_79:
    speaker: "<Narration>"
    en: The door opens and closes behind them.
    ko: 문이 열리고 닫힌다.
    ja: ドアが開き、また閉じた
  event_arkguardian2_02_e_80:
    speaker: "<Narration>"
    en: The Commander strains his ears, listening to the sounds beyond the door.
    ko: 지휘관은 문 너머에서 들려오는 소리에 귀를 기울인다.
    ja: 指揮官はドアの向こうの物音に聞き耳を立てた
  event_arkguardian2_02_e_81:
    speaker: "<Narration>"
    en: The priestess raises her voice,
    ko: V.T.C. 여사제의 언성이 높아진다.
    ja: 司祭の声がだんだんと大きくなっている
  event_arkguardian2_02_e_82:
    speaker: "<Narration>"
    en: gradually getting louder until she's nearly shouting.
    ko: 점점 높아진 언성은, 거의 고함을 지르는 수준으로 바뀐다.
    ja: それはやがて、怒声に変わった
  event_arkguardian2_02_e_83:
    speaker: "<Narration>"
    en: The Commander's only regret is that he can't step outside and revel in her
      misery.
    ko: |-
      지휘관은 당장에라도 밖에 나가서 놀려주고 싶었지만,
      그럴 수 없다는 사실을 안타까워했다.
    ja: |-
      指揮官は今すぐその場を飛び出し
      冷やかしてやりたい気分になったが、
      それができないことを惜しく思った
  event_arkguardian2_02_e_84:
    speaker: "<Narration>"
    en: It grows quiet outside.
    ko: 문밖이 조용해진다.
    ja: ドアの外に静けさが戻った
  event_arkguardian2_02_e_85:
    speaker: "<Narration>"
    en: "*Crack*"
    ko: 우두둑-
    ja: バキ、ボキッ…
  event_arkguardian2_02_e_86:
    speaker: "<Narration>"
    en: A loud noise echoes, clearly audible even through the door.
    ko: 그때, 문 너머까지 들릴 정도로 큰 소리가 들려왔다.
    ja: |-
      しかし突然、ドアを挟んでも聞こえるほど
      大きな物音がした
  event_arkguardian2_02_e_87:
    speaker: "<Narration>"
    en: The Commander recognizes the sound from his days as a mercenary.
    ko: |-
      이 소리는 익숙하다.
      용병 생활 때 자주 들었던 소리다.
    ja: |-
      傭兵時代には珍しくもなかった、
      聞き覚えのある音だ
  event_arkguardian2_02_e_88:
    speaker: "<Narration>"
    en: It's the sound of a bone breaking.
    ko: 뼈가, 부러지는 소리다.
    ja: 誰かの骨が、折れる音
  event_arkguardian2_02_e_89:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 푸슉-
    ja: プシューッ――
  event_arkguardian2_02_e_90:
    speaker: "<Narration>"
    en: The door opens.
    ko: 문이 열린다.
    ja: 扉が開いた
  event_arkguardian2_02_e_91:
    speaker: "<Narration>"
    en: A Central Government soldier walks in and stops before him.
    ko: 중앙 정부 병사가 걸어들어와, 지휘관의 앞에 선다.
    ja: |-
      入ってきた中央政府の兵士が、
      指揮官の前に立った
  event_arkguardian2_02_e_92:
    speaker: commander
    en: "... What now?"
    ko: "…뭐야 넌 또."
    ja: "…何だ、君は。"
  event_arkguardian2_02_e_93:
    speaker: CGplatoonleader
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_94:
    speaker: CGplatoonleader
    en: Do you remember me?
    ko: 저 기억 나십니까?
    ja: 覚えていらっしゃいますか？
  event_arkguardian2_02_e_95:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_96:
    speaker: commander
    en: The platoon leader from the corridor.
    ko: 그때 복도에서 봤던 소대장이군.
    ja: いつぞや廊下で会った小隊長君だな。
  event_arkguardian2_02_e_97:
    speaker: CGplatoonleader
    en: Oh!
    ko: 오…!
    ja: ああ…！
  event_arkguardian2_02_e_98:
    speaker: commander
    en: Here to break me out?
    ko: 구해주러 왔나?
    ja: 助けにきてくれたのか？
  event_arkguardian2_02_e_99:
    speaker: CGplatoonleader
    en: Yes. Hold on.
    ko: 예. 잠시만 기다려 주십시오.
    ja: そうです。少々お待ちください。
  event_arkguardian2_02_e_100:
    speaker: "<Narration>"
    en: The platoon leader's hands move quickly.
    ko: 소대장의 손이 바쁘게 움직인다.
    ja: 小隊長の手がせわしなく動く
  event_arkguardian2_02_e_101:
    speaker: CGplatoonleader
    en: Let me get these off you. Just bear with me.
    ko: 금방 풀겠습니다. 조금만 참아주십시오.
    ja: |-
      今すぐほどいてさしあげます。
      もう少しの辛抱です。
  event_arkguardian2_02_e_102:
    speaker: commander
    en: What are you doing here, anyway?
    ko: 너 뭐야. 갑자기 여기서 왜 나와.
    ja: 何があったんだ。なぜここに来た？
  event_arkguardian2_02_e_103:
    speaker: CGplatoonleader
    en: I was dispatched here from the headquarters.
    ko: 본부에서 이곳에 파견 나왔습니다.
    ja: 本部から派遣されました。
  event_arkguardian2_02_e_104:
    speaker: CGplatoonleader
    en: I heard of your arrival, so I thought I'd drop by and say hello.
    ko: 그러던 중 지휘관이 이곳으로 왔다는 얘기를 듣고, 인사나 할 겸 찾아뵈려 했습니다.
    ja: |-
      ここにいらっしゃるという話を聞いて、
      ごあいさつしようと思っていたんです。
  event_arkguardian2_02_e_105:
    speaker: CGplatoonleader
    en: But something felt off. Everyone was acting all secretive, and the tension
      was palpable.
    ko: 그런데 다들 쉬쉬하는 분위기에, 전체적으로 분위기가 너무 살벌해서 이게 뭔가 싶었습니다.
    ja: |-
      あまりに様子がおかしかったので、
      不可解に思っていたのですが…
  event_arkguardian2_02_e_106:
    speaker: CGplatoonleader
    en: Then I overheard you and the priestess talking through the door.
    ko: 그러다가 저 문 너머에서 지휘관과 사제님이 나누는 대화를 들었습니다.
    ja: |-
      ドアの向こうから、
      話が聞こえてしまいましたので。
  event_arkguardian2_02_e_107:
    speaker: commander
    en: If you're here, you must be one of them, right? A real hardcore devotee of
      the V.T.C.
    ko: |-
      …너 여기 올 정도면 V.T.C. 쪽 사람인 거 아냐?
      그것도 중증, 아니아니 열혈 신도.
    ja: |-
      …君はV.T.C.側の人間だろう？
      それも、かなり信心深い方だ。
  event_arkguardian2_02_e_108:
    speaker: CGplatoonleader
    en: That's right. I've been baptized as well.
    ko: 맞습니다. 세례명도 받았습니다.
    ja: はい。洗礼名も授かっております。
  event_arkguardian2_02_e_109:
    speaker: commander
    en: So what possessed you to snap a priestess's neck?
    ko: 그런데 사제 목을 돌려버리면 어떡하냐.
    ja: 裏切って平気なのか？
  event_arkguardian2_02_e_110:
    speaker: CGplatoonleader
    en: I worship the Goddess Squad above all else.
    ko: 갓데스가 제 신앙 이상이니까요.
    ja: ゴッデスは私の信仰に勝るものです。
  event_arkguardian2_02_e_111:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_112:
    speaker: CGplatoonleader
    en: Done. Can you stand?
    ko: 다 됐습니다. 일어서실 수 있겠습니까?
    ja: ほどけました。立てますか？
  event_arkguardian2_02_e_113:
    speaker: commander
    en: Ugh... Damn... I feel like death warmed over.
    ko: 크으… 으으윽…! 젠장…! 온몸이 쑤시는군.
    ja: くっ…うううっ…！クソッ…！全身が痛むな。
  event_arkguardian2_02_e_114:
    speaker: CGplatoonleader
    en: It's remarkable that you're able to stand in your condition.
    ko: "…대단하십니다. 그 몸 상태로…."
    ja: |-
      …それでもすごいことです。
      こんな体でどうやって…
  event_arkguardian2_02_e_115:
    speaker: CGplatoonleader
    en: Here, hang onto me. Let's go.
    ko: 가시죠. 부축하겠습니다.
    ja: 行きましょう。支えます。
  event_arkguardian2_02_e_116:
    speaker: CGplatoonleader
    en: The hangar's up ahead. Inside is the ATV I arrived in. Use it.
    ko: |-
      이 앞으로 가면 격납고입니다.
      제가 타고 온 ATV가 있는데, 그걸 사용해 주십시오.
    ja: |-
      ここをまっすぐ行けば格納庫です。
      私が乗ってきたATVがあります。
  event_arkguardian2_02_e_117:
    speaker: commander
    en: "... All right. Thanks."
    ko: "…그래. 부탁하지."
    ja: "…ああ、助かる。"
  event_arkguardian2_02_e_118:
    speaker: "<Narration>"
    en: "*Thump thump thump thump thump*"
    ko: 쿵쿵쿵쿵쿵-
    ja: ダッ、ダッ、ダッ、ダッ――
  event_arkguardian2_02_e_119:
    speaker: "<Narration>"
    en: Footsteps echo in the distance.
    ko: 먼 곳에서 발소리들이 들린다.
    ja: 遠くで足音がした
  event_arkguardian2_02_e_120:
    speaker: commander
    en: We finally got caught. Took 'em long enough, their security is pretty sloppy.
    ko: "…이제 들킨 건가. 아무리 지들 세상이라지만 경계가 너무 허술하네."
    ja: |-
      …さすがに気づかれたか。
      敵など想定してないのだろうが、
      油断のしすぎだな。
  event_arkguardian2_02_e_121:
    speaker: commander
    en: Ten or more inbound. Armed from the sound of their heavy footsteps.
    ko: 10명 이상. 발소리가 큰 걸로 봐선 무장 상태다.
    ja: |-
      10人以上…
      足音からして、武装しているようだ。
  event_arkguardian2_02_e_122:
    speaker: commander
    en: Hey, Platoon Leader. Got any spare steel for me?
    ko: 이봐 소대장. 남는 총 있어?
    ja: 君、余分な銃はあるか？
  event_arkguardian2_02_e_123:
    speaker: commander
    en: A sidearm works too. I don't miss.
    ko: 권총이라도 상관없어. 나 백발백중이거든.
    ja: 拳銃でも構わん。一発で当てられる。
  event_arkguardian2_02_e_124:
    speaker: CGplatoonleader
    en: One second.
    ko: 잠시만 기다려주십시오.
    ja: 少々お待ちを。
  event_arkguardian2_02_e_125:
    speaker: "<Narration>"
    en: The platoon leader rummages through his jacket.
    ko: 소대장이 품을 뒤적인다.
    ja: 小隊長がポケットの中を探った
  event_arkguardian2_02_e_126:
    speaker: CGplatoonleader
    en: Here, the key to the ATV.
    ko: 여기. ATV의 키입니다.
    ja: これを。ATVのキーです。
  event_arkguardian2_02_e_127:
    speaker: commander
    en: Why are you giving this to me?
    ko: "…이걸 왜 나한테 줘."
    ja: "…頼んだものと違うな。"
  event_arkguardian2_02_e_128:
    speaker: CGplatoonleader
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_129:
    speaker: commander
    en: Wait, you're not...
    ko: "…너 인마."
    ja: "…君、まさか…"
  event_arkguardian2_02_e_130:
    speaker: CGplatoonleader
    en: Please hurry.
    ko: 서둘러 주십시오.
    ja: お急ぎください。
  event_arkguardian2_02_e_131:
    speaker: commander
    en: Enough, just hand me the gun. This will be easy target practice.
    ko: |-
      됐고 총이나 줘.
      내가 마음만 먹으면 여기 있는 것들 다 잡는 건 일도 아냐.
    ja: |-
      それより銃をくれ。
      私がその気になれば、全員簡単に倒せる。
  event_arkguardian2_02_e_132:
    speaker: CGplatoonleader
    en: |-
      This is one of the main V.T.C. facilities.
      There are numerous autonomous weapons here, as well as Nikkes.
    ko: |-
      V.T.C. 주요 시설 중 한 곳입니다.
      무인 병기는 물론 니케도 다수 있습니다.
    ja: |-
      ここはV.T.C.の主要施設の1つです。
      無人兵器がありますし、ニケも大勢います。
  event_arkguardian2_02_e_133:
    speaker: CGplatoonleader
    en: Moving around with an open wound is reckless, even for someone as invincible
      as you.
    ko: |-
      지휘관이 무적이라는 건 알지만,
      배에 구멍이 채 메워지지도 않은 상태에선 무립니다.
    ja: |-
      無敵の指揮官と存じてはおりますが、
      身体にそんな穴が開いた状態では別でしょう。
  event_arkguardian2_02_e_134:
    speaker: commander
    en: I'm fine. You can see that.
    ko: 나 멀쩡한데. 보면 알거 아냐.
    ja: ピンピンしているぞ。見れば分かるだろう。
  event_arkguardian2_02_e_135:
    speaker: CGplatoonleader
    en: You're drenched in sweat and pale as a sheet.
    ko: |-
      땀을 엄청 흘리고 계십니다.
      낯빛도 흙빛입니다.
    ja: |-
      異常な量の発汗が認められますし、
      顔色も死人同然です。
  event_arkguardian2_02_e_136:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_137:
    speaker: CGplatoonleader
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_138:
    speaker: CGplatoonleader
    en: The Goddess Squad is waiting. They need you.
    ko: |-
      갓데스가 기다리고 있습니다.
      갓데스에는 지휘관이 필요합니다.
    ja: |-
      ゴッデスが待っているのでしょう？
      彼女たちにはあなたが必要です。
  event_arkguardian2_02_e_139:
    speaker: CGplatoonleader
    en: Humanity is in your hands, Commander.
    ko: 인류를 부탁합니다. 지휘관.
    ja: 人類を、どうかお願いします。指揮官。
  event_arkguardian2_02_e_140:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_02_e_141:
    speaker: commander
    en: Fine. Just count on me.
    ko: 그래. 맡겨라.
    ja: ああ。任せろ。
  event_arkguardian2_02_e_142:
    speaker: "<Narration>"
    en: The platoon leader salutes.
    ko: 소대장이 경례한다.
    ja: 小隊長が敬礼した
  event_arkguardian2_02_e_143:
    speaker: CGplatoonleader
    en: Thank you, and the Goddess Squad, for everything you have done for humanity.
    ko: 인류를 위해 싸워준, 갓데스 스쿼드에게 감사를.
    ja: 人類のために戦うゴッデス部隊に感謝を。
  event_arkguardian2_02_e_144:
    speaker: "<Narration>"
    en: The Commander returns the salute.
    ko: 지휘관이 경례한다.
    ja: 指揮官が敬礼を返した
  event_arkguardian2_02_e_145:
    speaker: "<Narration>"
    en: The leader pivots and runs,
    ko: 소대장이 뒤로 돌아 달린다.
    ja: 小隊長はきびすを返し、駆け去った
  event_arkguardian2_02_e_146:
    speaker: "<Narration>"
    en: disappearing down the bend in the corridor.
    ko: 꺾인 복도로 사라진다.
    ja: その姿が廊下の曲がり角に消えた
  event_arkguardian2_02_e_147:
    speaker: "<Narration>"
    en: Gunfire erupts.
    ko: 총성이 울려 퍼진다.
    ja: 銃声が響いた
  event_arkguardian2_02_e_148:
    speaker: "<Narration>"
    en: The Commander pushes his unresponsive body to obey and sprints forward.
    ko: 지휘관은 말을 듣지 않는 몸을 전력으로 이끌며 달려갔다.
    ja: |-
      指揮官は思い通りにならない身体を
      渾身の力で引きずり、先を急いだ
event_arkguardian2_03_s:
  event_arkguardian2_03_s_1:
    speaker: "<Narration>"
    en: The Ark's entrance.
    ko: 방주 입구.
    ja: アークの入口付近
  event_arkguardian2_03_s_2:
    speaker: "<Narration>"
    en: Goddess Squad. In the Commander's Room.
    ko: 갓데스 스쿼드, 지휘관의 방.
    ja: ゴッデス部隊、指揮官室
  event_arkguardian2_03_s_3:
    speaker: liliweiss
    en: Is that for real?
    ko: "…진짜예요 그거?"
    ja: "…この話、本当ですか？"
  event_arkguardian2_03_s_4:
    speaker: commander
    en: Do you really think I would make this up?
    ko: 그럼 내가 거짓말하겠냐.
    ja: 冗談で言うことだと思うか？
  event_arkguardian2_03_s_5:
    speaker: liliweiss
    en: I knew you weren't ordinary, but I never imagined your blood held such a secret.
    ko: |-
      보통 사람은 아닐 거라 생각했지만,
      피에 그런 비밀이 있을 줄은 몰랐네요.
    ja: |-
      普通の人じゃないとは思ってましたけど、
      そんな秘密があったなんて、
      想像もしていませんでした。
  event_arkguardian2_03_s_6:
    speaker: commander
    en: Right? I feel like some kind of legendary hero.
    ko: 그러게 말이야. 전설의 용사라도 된 기분이군.
    ja: まったくだな。伝説の勇者にでもなった気分だ。
  event_arkguardian2_03_s_7:
    speaker: liliweiss
    en: I had my suspicions, but for the V.T.C. to kidnap the Commander of the Goddess
      Squad is awfully audacious of them.
    ko: |-
      알고는 있었지만 V.T.C.는 과감하네요.
      바로 납치를 해버리네. 갓데스의 지휘관을.
    ja: |-
      知ってはいましたが、
      V.T.C.は恐れ知らずですね。
      ゴッデスの指揮官を誘拐するなんて。
  event_arkguardian2_03_s_8:
    speaker: liliweiss
    en: It's not just audacious, it's downright insane.
    ko: 아니, 과감한 정도가 아니라 미쳤어요.
    ja: |-
      ううん、恐れ知らずというより、
      正気じゃない。
  event_arkguardian2_03_s_9:
    speaker: commander
    en: They've always been pulling crazy stunts like this. This time, we're the lucky
      victims.
    ko: |-
      걔들이 미친 짓 하는 게 하루이틀 일이야?
      그게 이번엔 우리한테 온 것뿐이고.
    ja: |-
      あいつらがおかしいのは昔からだろう？
      今回とうとう私が狙われたというだけだ。
  event_arkguardian2_03_s_10:
    speaker: liliweiss
    en: Should we turn the place upside down?
    ko: 가서 한번 뒤집어 놓을까요?
    ja: 制裁しておきますか？
  event_arkguardian2_03_s_11:
    speaker: commander
    en: It's not worth our time.
    ko: 그럴 시간도 아까워.
    ja: いや、今は一秒でも惜しい。
  event_arkguardian2_03_s_12:
    speaker: liliweiss
    en: We both know this won't be the end of them.
    ko: 이걸로 끝날 거란 생각이 안 드는데요.
    ja: ですが、諦めたとは思えません。
  event_arkguardian2_03_s_13:
    speaker: commander
    en: We'll be fine. Everyone here is sane.
    ko: 괜찮아. [여긴] 멀쩡한 사람들만 있으니까.
    ja: |-
      大丈夫だ。
      「ここには」まともな連中しかいない。
  event_arkguardian2_03_s_14:
    speaker: commander
    en: Not even the most fanatical V.T.C. devotee would dream of messing with us
      here.
    ko: 제아무리 V.T.C.의 광신도들이라고 해도 여기서 우릴 건들지는 못 해.
    ja: |-
      いくらV.T.C.の狂信者どもでも、
      軽々しく手出しはできないだろう。
  event_arkguardian2_03_s_15:
    speaker: commander
    en: And frankly, I don't have the mental capacity to deal with them right now.
    ko: 그리고, 지금 상황에서 그것들까지 챙길 심적 여유는 없다.
    ja: |-
      それに、今この状況で奴らのことまで
      気にかけている余裕はない。
  event_arkguardian2_03_s_16:
    speaker: liliweiss
    en: They abducted you under the guise of treatment, only to turn you into their
      test subject.
    ko: 갓데스 스쿼드의 지휘관을 치료 명목으로 데려가서 실험체로 쓰려고 했던 것들이에요.
    ja: |-
      ゴッデスの指揮官を連れ去って、
      実験体にしようとした相手です。
  event_arkguardian2_03_s_17:
    speaker: liliweiss
    en: Any idea on what they're up to?
    ko: 무슨 짓을 할지 예상이 돼요?
    ja: 次に何をしてくるかなんて分かりますか？
  event_arkguardian2_03_s_18:
    speaker: commander
    en: If they lay a finger on me or anyone here,
    ko: 나뿐만 아니라, 우리 중 누군가에게 호작질을 하면.
    ja: |-
      私や、私たちの中の誰かに
      懲りもせずまた手出しをするようなら…
  event_arkguardian2_03_s_19:
    speaker: commander
    en: it will be the end of V.T.C., physically.
    ko: 그땐 V.T.C.를 끝장낸다. 물리적으로.
    ja: |-
      その時はV.T.C.を潰してやろう。
      物理的にな。
  event_arkguardian2_03_s_20:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_21:
    speaker: commander
    en: Talking about this is giving me a headache. This conversation's over.
    ko: |-
      이 이야기는 여기서 끝이야.
      더 말해봤자 머리만 아파.
    ja: |-
      この話はここまでだ。
      続けても頭が痛くなるだけだからな。
  event_arkguardian2_03_s_22:
    speaker: commander
    en: Let's discuss what actually matters.
    ko: 그것보다 더 중요한 얘기를 하지.
    ja: それより、もっと重大な問題がある。
  event_arkguardian2_03_s_23:
    speaker: liliweiss
    en: You mean the fact that Phase 3 is going to be the final phase?
    ko: "…밀봉이 3차로 끝날 거라는 얘기, 말이죠."
    ja: "…封鎖が第3次で切り上げ、という話ですね。"
  event_arkguardian2_03_s_24:
    speaker: commander
    en: Yeah. Neither the Central Government nor V.T.C. intends to let the sealing
      process get to Phase 5.
    ko: 그래. 중앙 정부나 V.T.C.나 밀봉을 5차까지 끌고 갈 생각은 없다.
    ja: |-
      ああ。中央政府もV.T.C.も
      第5次まで続ける気はないらしい。
  event_arkguardian2_03_s_25:
    speaker: commander
    en: The twisted priestess had a lousy way of putting it, but it's not the most
      outlandish course of action.
    ko: |-
      그 목 돌아간 사제가 재수 없게 말하긴 했지만,
      이해가 안 가는 선택은 아니야.
    ja: |-
      狂った奴から聞かされた話だが、
      理解できない選択ではない。
  event_arkguardian2_03_s_26:
    speaker: commander
    en: We're spent, but the Raptures are showing no signs of letting up.
    ko: |-
      우리는 극도로 소모되었다.
      랩쳐는 소모된 기미조차 보이지 않지.
    ja: |-
      こちらは限界まで消耗している。
      ラプチャーは疲れる気配すらない。
  event_arkguardian2_03_s_27:
    speaker: commander
    en: Even Raptures that cause corruption are on the rampage, and morale has hit
      an all time low.
    ko: 침식 탑재형 랩쳐들도 날뛰고 있어 사기는 바닥을 친다.
    ja: |-
      侵食能力を持ったラプチャーが暴れて、
      士気も底をついている。
  event_arkguardian2_03_s_28:
    speaker: commander
    en: And in the midst of all that, we've got mass-produced Heretics showing up.
    ko: 이런 시점에 양산형 헬레틱이라는 것들이 갑자기 떡 하니 나타났어.
    ja: そのうえで、あの量産型ヘレティック…
  event_arkguardian2_03_s_29:
    speaker: commander
    en: The Raptures are rolling out some new units. Things are looking pretty serious.
    ko: 결정적이지. 랩쳐 놈들의 신병기가 나타났다는 얘기다.
    ja: 決定打に近い、新兵器の出現だ。
  event_arkguardian2_03_s_30:
    speaker: commander
    en: They're probably the next generation of weaponry, and there will be many more
      to come.
    ko: |-
      차세대 병기라고 봐도 좋을 정도야.
      더 많아질 테고.
    ja: |-
      次世代の兵器と言っていい。
      今後はさらに増えるだろう。
  event_arkguardian2_03_s_31:
    speaker: commander
    en: If we drag this out any longer, the Ark itself will be at risk.
    ko: 더 끌면 방주 자체가 위험해지는 건 사실이야.
    ja: |-
      これ以上長引かせれば、
      アーク自体が危険にさらされる。
  event_arkguardian2_03_s_32:
    speaker: commander
    en: This time, we've got to seal it for good.
    ko: 이번에 닫아야 해.
    ja: もはや猶予はない。
  event_arkguardian2_03_s_33:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_34:
    speaker: liliweiss
    en: So what do we do?
    ko: 우린 어떻게 하죠.
    ja: 私たちはどうすればいいでしょう。
  event_arkguardian2_03_s_35:
    speaker: commander
    en: Whatever you want.
    ko: 네가 하고 싶은 대로.
    ja: やりたいようにやればいい。
  event_arkguardian2_03_s_36:
    speaker: commander
    en: And we'll let the girls do whatever they want.
    ko: 동시에, 그 녀석들이 하고 싶은 대로.
    ja: 君も、あいつらもな。
  event_arkguardian2_03_s_37:
    speaker: liliweiss
    en: I already know what I want to do.
    ko: 제가 하고 싶은 건 이미 정해져 있어요.
    ja: 私のしたいことは、もう決まっています。
  event_arkguardian2_03_s_38:
    speaker: liliweiss
    en: But I can't say for sure they feel the same.
    ko: 그런데, 그 아이들이 그렇게 하고 싶어 할지는 장담 못 하겠네요.
    ja: 賛成してくれるかは、分かりませんけど。
  event_arkguardian2_03_s_39:
    speaker: commander
    en: What are you talking about?
    ko: 무슨 소리야.
    ja: 何を言ってるんだ。
  event_arkguardian2_03_s_40:
    speaker: commander
    en: You and I raised them.
    ko: 나랑 네가 키운 녀석들이야.
    ja: 私と君とで育ててきたんじゃないか。
  event_arkguardian2_03_s_41:
    speaker: commander
    en: Why wouldn't they feel the same way?
    ko: 다른 생각을 할 리가 없지.
    ja: 分かってくれるさ。
  event_arkguardian2_03_s_42:
    speaker: hongryeon_o
    en: So it shall be... Phase 3 marketh the end.
    ko: 3차로 밀봉이 끝난다라….
    ja: 第3次で封鎖計画が打ち切り、だと…
  event_arkguardian2_03_s_43:
    speaker: rapunzel_o
    en: And here I thought five phases wouldn't be enough, but they're cutting it
      even shorter.
    ko: "…5차도 모자란다고 생각했는데, 더 당겨지는군요."
    ja: |-
      …5回でも足りないと思ったぐらいでしたが、
      さらに減らされるなんて…
  event_arkguardian2_03_s_44:
    speaker: rapunzel_o
    en: Then... what about the others who thought it would end at Phase 5?
    ko: 그럼… 5차까지라고 알고 있던 다른 분들은….
    ja: |-
      それでは…第5次まであると
      期待している方々は…
  event_arkguardian2_03_s_45:
    speaker: dorothy
    en: Was there an official announcement?
    ko: 공식적으로 발표가 났나요?
    ja: 公式な発表は行われるのですか？
  event_arkguardian2_03_s_46:
    speaker: commander
    en: They probably won't be making one.
    ko: 안 하겠지.
    ja: しないだろうな。
  event_arkguardian2_03_s_47:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_48:
    speaker: dorothy
    en: So when do we enter the Ark?
    ko: 그럼 저희는 방주에 언제 들어가나요?
    ja: では、私たちの撤収は？
  event_arkguardian2_03_s_49:
    speaker: commander
    en: We go in together during Phase 3.
    ko: 3차에 같이 들어가야지.
    ja: 第3次の予定だ。
  event_arkguardian2_03_s_50:
    speaker: commander
    en: If that's what you want.
    ko: 너희가 원한다면.
    ja: 君たちが望めばだが。
  event_arkguardian2_03_s_51:
    speaker: dorothy
    en: You speak as if we have a choice.
    ko: 다른 선택지가 있는 것처럼 얘기하는군요.
    ja: 他に選択肢があるかのような言い方ですね。
  event_arkguardian2_03_s_52:
    speaker: commander
    en: We always do.
    ko: 선택지는 언제나 열려있어.
    ja: 選択肢はいつだってある。
  event_arkguardian2_03_s_53:
    speaker: commander
    en: That's how we've always rolled.
    ko: 우리가 지금까지 해왔던 게 그런 일이잖냐.
    ja: |-
      私たちは今までそういうやり方を
      貫いてきただろう。
  event_arkguardian2_03_s_54:
    speaker: commander
    en: We do whatever we want, and we give 'em killer results.
    ko: 하고 싶은 대로 하되, 죽여주는 결과를 내는 것.
    ja: やりたいようにやって、最高の結果を出す。
  event_arkguardian2_03_s_55:
    speaker: hongryeon_o
    en: Hmm...
    ko: 호오….
    ja: ほう…
  event_arkguardian2_03_s_56:
    speaker: dorothy
    en: A choice, you say...
    ko: 선택지가 있다….
    ja: 選択肢とは、つまり…
  event_arkguardian2_03_s_57:
    speaker: rapunzel_o
    en: If that's the case...
    ko: 그렇다면….
    ja: でしたら…
  event_arkguardian2_03_s_58:
    speaker: snowwhite_o
    en: Um...
    ko: "…저기."
    ja: "…あの。"
  event_arkguardian2_03_s_59:
    speaker: snowwhite_o
    en: I...
    ko: 어….
    ja: ええと…
  event_arkguardian2_03_s_60:
    speaker: liliweiss
    en: What is it, Snow White?
    ko: "…왜 그래? 스노우 화이트."
    ja: "…どうしたの？スノーホワイト。"
  event_arkguardian2_03_s_61:
    speaker: "<Narration>"
    en: Snow White locks eyes with everyone,
    ko: 스노우 화이트가 눈치를 본다.
    ja: スノーホワイトが全員の様子をうかがった
  event_arkguardian2_03_s_62:
    speaker: "<Narration>"
    en: gauging the situation.
    ko: 모두와 눈을 한 번씩 마주친다.
    ja: 一人ずつ、目をのぞき込んでいく
  event_arkguardian2_03_s_63:
    speaker: "<Narration>"
    en: Then, it hits her
    ko: 스노우 화이트는 확신했다.
    ja: スノーホワイトは確信した
  event_arkguardian2_03_s_64:
    speaker: "<Narration>"
    en: that everyone feels the same as she does.
    ko: 아, 모두가 나와 같은 생각을 하고 있구나.
    ja: ああ、みんなも私と同じことを考えている
  event_arkguardian2_03_s_65:
    speaker: liliweiss
    en: You have something to say, don't you?
    ko: 뭐 할 말 있는 거 아니었어?
    ja: 何か言いたいことがあるんじゃない？
  event_arkguardian2_03_s_66:
    speaker: snowwhite_o
    en: I think we should stay on the surface.
    ko: 저희는 계속 지상에 남았으면 해요.
    ja: 私たちはこのまま、地上に残りましょう。
  event_arkguardian2_03_s_67:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_68:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_69:
    speaker: snowwhite_o
    en: After Phase 3, there will still be people finding their way to the Ark.
    ko: 3차 밀봉이 끝난 이후에도 방주 입구로 계속 찾아올 분들을 위해.
    ja: |-
      第3次封鎖が終わった後も、
      助けを求めて来る人たちのために。
  event_arkguardian2_03_s_70:
    speaker: snowwhite_o
    en: We'll stay here and protect them,
    ko: 저희는 이곳에 남아 그분들을 지키고.
    ja: 私たちはここに残り、その人たちを守って…
  event_arkguardian2_03_s_71:
    speaker: snowwhite_o
    en: until they're safely inside.
    ko: 방주로 내려보내고 싶어요.
    ja: アークへ送るんです。
  event_arkguardian2_03_s_72:
    speaker: commander
    en: For the rest of our lives?
    ko: 평생?
    ja: いつまで？
  event_arkguardian2_03_s_73:
    speaker: dorothy
    en: If no one comes for two weeks, we'll go down.
    ko: 2주 동안 아무도 찾아오지 않는다면, 그때 내려가죠.
    ja: 2週間、1人も来なくなった時としましょう。
  event_arkguardian2_03_s_74:
    speaker: commander
    en: Then what if one person shows up every 13 days?
    ko: 뭐야 그럼. 13일마다 한 명씩이라도 찾아오면 어떡하려고?
    ja: |-
      なんだそれは。13日ごとに
      1人ずつ来たらどうする？
  event_arkguardian2_03_s_75:
    speaker: dorothy
    en: Then we stay.
    ko: 계속 있는 거죠 뭐.
    ja: 続けるだけです。
  event_arkguardian2_03_s_76:
    speaker: liliweiss
    en: After Phase 3, the Ark will be sealed completely. How will the people get
      in?
    ko: |-
      3차 이후에는 방주는 완전히 닫힐 거야.
      어떻게 내려보내게?
    ja: |-
      アークは第3次の作戦後に完全封鎖されるの。
      どうやって送るつもり？
  event_arkguardian2_03_s_77:
    speaker: rapunzel_o
    en: We'll keep them safe and bring them with us when we descend.
    ko: 저희가 보호하다가, 저희가 내려갈 때 같이 데려가면 될 것 같아요.
    ja: |-
      私たちが保護し、
      私たちとともにアークへ向かいます。
  event_arkguardian2_03_s_78:
    speaker: commander
    en: What if thousands show up? What's your plan then?
    ko: 막 몇천 명이 모였어. 그럼 어떡하게.
    ja: 何千人と集まってきたら、どうする。
  event_arkguardian2_03_s_79:
    speaker: rapunzel_o
    en: We'll protect everyone and go down together.
    ko: 모두 지킵니다. 그리고 모두 함께 내려갈 거예요.
    ja: |-
      全員を守ります。
      そして全員でアークへ向かいます。
  event_arkguardian2_03_s_80:
    speaker: liliweiss
    en: And if they refuse to let us in?
    ko: 우리도 안 들여보내 주면?
    ja: 私たちでも通してもらえなかったら？
  event_arkguardian2_03_s_81:
    speaker: hongryeon_o
    en: Do not be preposterous.
    ko: 그럴 리가 있겠나.
    ja: あるわけなかろう。
  event_arkguardian2_03_s_82:
    speaker: hongryeon_o
    en: We are the Goddess Squad. Though it feels strange for me to utter such, we
      are nigh unto myth.
    ko: 우린 갓데스일세. 뭐 내 입으로 말하긴 뭣하지만 신화나 다름없지.
    ja: |-
      私たちはゴッデスだ。
      おのれで言うのもはばかられるが…
      神話にも肩を並べる名がある。
  event_arkguardian2_03_s_83:
    speaker: hongryeon_o
    en: Assuredly, they shall be amenable to opening the gates for us at least once.
    ko: 우릴 위해 한번은 열어줘야 마땅하다 생각되네.
    ja: 一度ぐらい、道が開かれぬ道理はあるまい。
  event_arkguardian2_03_s_84:
    speaker: dorothy
    en: When that happens, I'll need the two of you to step up and guarantee our safety.
    ko: 그리고 그건, 두 분이 책임지고 보장을 받아주셔야 하고요.
    ja: |-
      そのことは、お二人が責任を持って
      保証されるようにしてください。
  event_arkguardian2_03_s_85:
    speaker: commander
    en: 'So, in summary:'
    ko: "…그럼 요약을 해보자면."
    ja: "…では、話をまとめよう。"
  event_arkguardian2_03_s_86:
    speaker: commander
    en: We're not going down during Phase 3.
    ko: 우린 3차 때 안 내려간다.
    ja: 私たちは第3次封鎖の時点で撤収しない。
  event_arkguardian2_03_s_87:
    speaker: commander
    en: We'll stay here, hold our position, and wait, protecting any latecomers—humans
      and Nikkes alike.
    ko: |-
      계속 여기서 진을 치고 기다리면서,
      뒤늦게 방주 입구로 찾아온 사람들과 니케를 보호한다.
    ja: |-
      この場に防衛線を展開し、
      取り残された者やニケの保護を続ける。
  event_arkguardian2_03_s_88:
    speaker: commander
    en: If no one comes after two weeks, we'll escort those under our protection down
      to the Ark.
    ko: |-
      2주 동안 아무도 오지 않는다면,
      보호 중인 사람들과 함께 방주로 내려간다.
    ja: |-
      2週間のあいだに誰も逃れて来なければ、
      保護した者たちを連れてアークへ向かう。
  event_arkguardian2_03_s_89:
    speaker: commander
    en: The entrance to the Ark will be opened only at that specific time. Lilith
      and I will prepare everything in advance for it.
    ko: |-
      그때에 한정해서, 밀봉된 방주의 입구를 연다.
      이건 나와 릴리스가 미리 밑 작업을 해놓는다.
    ja: |-
      その時に限りアークへの道が開放されるよう、
      私とリリスが話をつけておく。
  event_arkguardian2_03_s_90:
    speaker: commander
    en: Did I miss anything?
    ko: 맞나?
    ja: これでいいか？
  event_arkguardian2_03_s_91:
    speaker: snowwhite_o
    en: No.
    ko: 예.
    ja: はい。
  event_arkguardian2_03_s_92:
    speaker: rapunzel_o
    en: It was perfect.
    ko: 완벽해요.
    ja: 問題ありません。
  event_arkguardian2_03_s_93:
    speaker: dorothy
    en: A stellar summary.
    ko: 요약을 잘하시네요.
    ja: きれいにまとめてくださいました。
  event_arkguardian2_03_s_94:
    speaker: hongryeon_o
    en: He ought to be proficient at that, at the very least.
    ko: 그거라도 잘해야 하지 않겠나.
    ja: それぐらいは当然であろう。
  event_arkguardian2_03_s_95:
    speaker: commander
    en: It's an insane plan.
    ko: 말도 안 되는 작전이야.
    ja: 無謀な作戦になるぞ。
  event_arkguardian2_03_s_96:
    speaker: commander
    en: The logistics alone are a nightmare.
    ko: 물자 문제부터 시작해서 문제가 한두 가지가 아냐.
    ja: 物資の心配以外にも、問題は山ほどある。
  event_arkguardian2_03_s_97:
    speaker: commander
    en: It'll require every last ounce of our strength, mentally and physically.
    ko: 몸과 마음 모두 피폐해질 거다.
    ja: 精神も身体も、限界が試されるだろう。
  event_arkguardian2_03_s_98:
    speaker: commander
    en: "..."
    ko: 하지만.
    ja: だが…
  event_arkguardian2_03_s_99:
    speaker: commander
    en: But we're also the only ones who can carry it out.
    ko: 그렇기에 우리밖에 할 수 없는 일이다.
    ja: だからこそ、私たちにしかできないことだ。
  event_arkguardian2_03_s_100:
    speaker: "<Narration>"
    en: Everyone nods.
    ko: 모두가 고개를 끄덕인다.
    ja: 誰もが頭を縦に振った
  event_arkguardian2_03_s_101:
    speaker: commander
    en: All right. We stay.
    ko: 좋아. 우리는 남는다.
    ja: 決まったな。私たちはここに残る。
  event_arkguardian2_03_s_102:
    speaker: commander
    en: Let's see this through to the end.
    ko: 끝까지, 지켜보자고.
    ja: 最後まで、守り抜くぞ。
  event_arkguardian2_03_s_103:
    speaker: dorothy
    en: Could you promise me one thing?
    ko: 한 가지 약속해주실 수 있나요?
    ja: ひとつ、約束していただけますか？
  event_arkguardian2_03_s_104:
    speaker: commander
    en: What now?
    ko: 뭔데.
    ja: 何だ？
  event_arkguardian2_03_s_105:
    speaker: dorothy
    en: When we return to the Ark,
    ko: 저희가 방주로 돌아갔을 때.
    ja: 私たちがアークへたどりついた時…
  event_arkguardian2_03_s_106:
    speaker: dorothy
    en: please make sure we're well compensated for all of this.
    ko: 이 모든 것을 보상받을 수 있도록 해주세요.
    ja: |-
      すべての苦難が報われたと
      思えるようにしてください。
  event_arkguardian2_03_s_107:
    speaker: dorothy
    en: In whatever form it may be.
    ko: 어떤 형태로든지요.
    ja: どのような形でも構いません。
  event_arkguardian2_03_s_108:
    speaker: commander
    en: Sure, I'll do everything in my power.
    ko: 그래. 최대한 힘써보마.
    ja: ああ。最善を尽くそう。
  event_arkguardian2_03_s_109:
    speaker: commander
    en: No, I promise!
    ko: 아니! 약속하지!
    ja: いや！約束する！
  event_arkguardian2_03_s_110:
    speaker: commander
    en: They'll reward each of us palaces and enough money to last a lifetime!
    ko: |-
      대궐 같은 집도 주고!
      평생 써도 안 모자랄 것 같은 돈도 주고!
    ja: |-
      宮殿のような豪邸に住み！
      使っても使いきれない金を持ち！
  event_arkguardian2_03_s_111:
    speaker: commander
    en: Our story will be turned into a novel! Adapted into movies and games!
    ko: 우리 이야기로 책도 내고! 영화도 만들고! 게임도 만들고!
    ja: |-
      私たちの伝記を出版して、
      映画とゲームも作らせよう！
  event_arkguardian2_03_s_112:
    speaker: commander
    en: Heck, they may even start a religion in our name!
    ko: 네 이름으로 된 종교도 하나 만들고!
    ja: 君の名前の宗教を始めよう！
  event_arkguardian2_03_s_113:
    speaker: rapunzel_o
    en: Oh my.
    ko: 어머나.
    ja: あらあら。
  event_arkguardian2_03_s_114:
    speaker: commander
    en: We'll make a splashy debut in politics!
    ko: 정치판에 화려하게 데뷔도 하고!
    ja: 政治の世界で華々しいデビューを果たそう！
  event_arkguardian2_03_s_115:
    speaker: dorothy
    en: Ooh...
    ko: "…후."
    ja: "…ふ…"
  event_arkguardian2_03_s_116:
    speaker: commander
    en: And we'll create a manufacturing company capable of standing toe to toe with
      the likes of Elysion, Missilis, and Tetra! And we'll call it Snow.
    ko: 엘리시온, 미실리스, 테트라 다음으로 스노우도 하나 만들고!
    ja: |-
      エリシオン、ミシリス、テトラに肩を並べる、
      スノー社も立ち上げよう！
  event_arkguardian2_03_s_117:
    speaker: snowwhite_o
    en: Wow...
    ko: 와아.
    ja: へへ。
  event_arkguardian2_03_s_118:
    speaker: commander
    en: We'll even open a kendo school!
    ko: 검도 도장도 만들고!
    ja: 剣の道場も建てよう！
  event_arkguardian2_03_s_119:
    speaker: hongryeon_o
    en: "... Whatever that may mean."
    ko: "…뭔가 그게."
    ja: "…何だいそれは。"
  event_arkguardian2_03_s_120:
    speaker: commander
    en: And a Mecha Destructor zoo!
    ko: 메카 고릴라 동물원도 짓고!
    ja: メカゴリラ動物園も建てるぞ！
  event_arkguardian2_03_s_121:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_122:
    speaker: commander
    en: Drink for days with beauties in both arms...
    ko: 양쪽에 미녀를 끼고 술도 마시고!
    ja: それから両脇に美女を抱えて酒を飲んでやる！
  event_arkguardian2_03_s_123:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_124:
    speaker: commander
    en: And then...
    ko: 그리고.
    ja: それから…
  event_arkguardian2_03_s_125:
    speaker: commander
    en: You'll be hailed as the Goddesses of Victory.
    ko: 승리의 여신으로 추앙받고.
    ja: 勝利の女神として、称えられよう。
  event_arkguardian2_03_s_126:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_127:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_128:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_129:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_130:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_s_131:
    speaker: commander
    en: This will be our last operation on the surface, but it'll also be the longest,
      as well as the most difficult.
    ko: |-
      우리의 지상에서의 마지막 작전이자,
      가장 힘들고 긴 작전이 될 거다.
    ja: |-
      私たちの地上最後の戦いだ。
      最もつらく、最も長い作戦になるだろう。
  event_arkguardian2_03_s_132:
    speaker: commander
    en: Get some rest everyone.
    ko: 다들, 푹 쉬도록.
    ja: 全員、しっかりと休んでおいてくれ。
  event_arkguardian2_03_s_133:
    speaker: snowwhite_o
    en: C-Commander, Lilith.
    ko: 저. 지휘관. 언니.
    ja: あの…指揮官、お姉ちゃん。
  event_arkguardian2_03_s_134:
    speaker: snowwhite_o
    en: There's a place I'd like us to go together.
    ko: 우, 우리 스쿼드 모두 다 같이 갔으면 하는 곳이 있어요.
    ja: 部隊のみんなで、行きたい所があるんですけど…
  event_arkguardian2_03_s_135:
    speaker: snowwhite_o
    en: Do you all have time?
    ko: 다들 시간 괜찮으세요?
    ja: みなさん、お時間はありますか？
event_arkguardian2_03_e:
  event_arkguardian2_03_e_1:
    speaker: "<Narration>"
    en: "*Buzz buzz*"
    ko: 지잉- 지잉-
    ja: ブブブ…ブブブ…
  event_arkguardian2_03_e_2:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_3:
    speaker: "<Narration>"
    en: "*Buzz buzz*"
    ko: 지잉- 지잉-
    ja: ブブブ…ブブブ…
  event_arkguardian2_03_e_4:
    speaker: "<Narration>"
    en: It's a call from an unknown number.
    ko: 모르는 번호다.
    ja: 発信元は知らない番号だ
  event_arkguardian2_03_e_5:
    speaker: "<Narration>"
    en: Oswald has entrusted the Ark's sealing operations to a reliable subordinate.
    ko: 방주 밀봉 쪽의 업무는 믿을 수 있는 부하에게 맡겨놓았다.
    ja: 封鎖計画の進行は信頼できる部下に任せてある
  event_arkguardian2_03_e_6:
    speaker: "<Narration>"
    en: It is a procedural task that follows a manual, after all. Authorization can
      be granted from anywhere.
    ko: |-
      어차피 매뉴얼대로 진행되는 일.
      허가를 내리는 건 어디서든 할 수 있다.
    ja: |-
      自分がいようがいまいが、
      計画書通りに進むことだ。
      許可を出すだけならどこでもできる
  event_arkguardian2_03_e_7:
    speaker: "<Narration>"
    en: "*Buzz buzz*"
    ko: 지잉- 지잉-
    ja: ブブブ…ブブブ…
  event_arkguardian2_03_e_8:
    speaker: "<Narration>"
    en: However, receiving a call from an unknown number at a time like this means
      something has suddenly changed.
    ko: |-
      그런 시점에 모르는 번호에서 전화가 온다는 건,
      상황이 급변했다는 걸 의미했다.
    ja: |-
      そのような状況で知らない番号から
      連絡が来るということは、
      事態が急変したという意味だ
  event_arkguardian2_03_e_9:
    speaker: "<Narration>"
    en: Perhaps the originally assigned contact cannot be reached.
    ko: 기존의 연락책이 연락할 수 없는 상황이 되었다거나.
    ja: |-
      それも、通常の連絡方法が
      使えないようなことだろうか
  event_arkguardian2_03_e_10:
    speaker: "<Narration>"
    en: "*Buzz buzz*"
    ko: 지잉- 지잉-
    ja: ブブブ…ブブブ…
  event_arkguardian2_03_e_11:
    speaker: "<Narration>"
    en: Oswald presses the button and answers.
    ko: 오스왈드는 통화 버튼을 눌렀다.
    ja: オスワルドは通話ボタンを押した
  event_arkguardian2_03_e_12:
    speaker: oswald_o
    en: This is Oswald.
    ko: 접니다.
    ja: 私です。
  event_arkguardian2_03_e_13:
    speaker: freesia_op_r
    en: Mister.
    ko: 아저씨.
    ja: おじさん。
  event_arkguardian2_03_e_14:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_15:
    speaker: freesia_op_r
    en: When are you coming?
    ko: 언제 올 거야?
    ja: おじさんはいつ来るの？
  event_arkguardian2_03_e_16:
    speaker: oswald_o
    en: How did you get my number?
    ko: 제 번호를 어떻게 안 겁니까.
    ja: この番号は誰に教えてもらったのですか。
  event_arkguardian2_03_e_17:
    speaker: freesia_op_r
    en: I asked that soldier I gave the documents to back then.
    ko: 그때 내가 서류 줬던 병사 아저씨한테 부탁했어.
    ja: あのとき書類を渡した兵士のおじさん。
  event_arkguardian2_03_e_18:
    speaker: freesia_op_r
    en: He even let me borrow his phone.
    ko: 핸드폰도 빌려줬고.
    ja: 電話も貸してもらったの。
  event_arkguardian2_03_e_19:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_20:
    speaker: freesia_op_r
    en: When will you be here, Mister?
    ko: 아저씨. 언제 와?
    ja: おじさん、いつ戻って来るの？
  event_arkguardian2_03_e_21:
    speaker: oswald_o
    en: Why didn't you go down during the second phase?
    ko: 2차 밀봉 때 왜 안 내려갔습니까.
    ja: |-
      2回目で行く約束だったでしょう、
      なぜ残っているのですか？
  event_arkguardian2_03_e_22:
    speaker: freesia_op_r
    en: I wanted to talk to you.
    ko: 아저씨랑 얘기하려고.
    ja: おじさんと話せなくなっちゃうでしょ。
  event_arkguardian2_03_e_23:
    speaker: freesia_op_r
    en: Why aren't you here?
    ko: 왜 여기 없어?
    ja: どうしてこっちにいなくなっちゃったの？
  event_arkguardian2_03_e_24:
    speaker: oswald_o
    en: There's something important I must do.
    ko: 중요한 일이 있으니까요.
    ja: 大事な仕事ができたからです。
  event_arkguardian2_03_e_25:
    speaker: freesia_op_r
    en: I see.
    ko: 그렇구나.
    ja: そうだったんだ。
  event_arkguardian2_03_e_26:
    speaker: freesia_op_r
    en: I'm gonna go down during the third phase.
    ko: 아저씨. 나 3차 때 내려가려고.
    ja: おじさん。私、3回目でアークに行くから。
  event_arkguardian2_03_e_27:
    speaker: freesia_op_r
    en: I'm making all the soldiers really uncomfortable by staying here,
    ko: 계속 여기 있으니까 병사 아저씨들이 엄청 곤란해 해.
    ja: |-
      ずっとここにいたら、
      兵士のおじさんたちにも迷惑かけちゃうし。
  event_arkguardian2_03_e_28:
    speaker: freesia_op_r
    en: so I'm just gonna go down.
    ko: 그래서 그냥 내려갈 거야.
    ja: だから、次で行くね。
  event_arkguardian2_03_e_29:
    speaker: oswald_o
    en: Good thinking.
    ko: 잘 생각하셨습니다.
    ja: しっかり考えたようですね。
  event_arkguardian2_03_e_30:
    speaker: freesia_op_r
    en: Yeah. So I called to say goodbye.
    ko: 응. 그래서 작별 인사 하려고 전화했어.
    ja: |-
      うん。
      だから、お別れのあいさつがしたかったの。
  event_arkguardian2_03_e_31:
    speaker: freesia_op_r
    en: No... not goodbye. More of a see you later.
    ko: 아니다. 작별 인사는 아니고. 그냥 인사.
    ja: |-
      あっ違う、お別れじゃないや。
      またねのあいさつ。
  event_arkguardian2_03_e_32:
    speaker: freesia_op_r
    en: I'll go first and wait there, so you have to come.
    ko: 나 먼저 내려가서 기다릴 테니까, 꼭 와야 해.
    ja: 先に行って待ってるから、絶対来てね。
  event_arkguardian2_03_e_33:
    speaker: freesia_op_r
    en: Okay?
    ko: 알았지?
    ja: ね？
  event_arkguardian2_03_e_34:
    speaker: oswald_o
    en: Freesia, I—
    ko: "…프리시아. 저는…."
    ja: "…フリージア。私は…"
  event_arkguardian2_03_e_35:
    speaker: freesia_op_r
    en: I'm gonna go now. See you.
    ko: 끊을게. 나중에 봐.
    ja: じゃあ切るね。またね。
  event_arkguardian2_03_e_36:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 뚝-
    ja: プツン――
  event_arkguardian2_03_e_37:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_38:
    speaker: "<Narration>"
    en: Oswald calls back the number.
    ko: 오스왈드는 걸려 온 번호로 전화를 걸었다.
    ja: |-
      オスワルドは、履歴に残った番号に
      通話をかけなおした
  event_arkguardian2_03_e_39:
    speaker: soundonly_sol
    en: "... Channel is secure."
    ko: "…통신보안."
    ja: "…どうぞ。"
  event_arkguardian2_03_e_40:
    speaker: oswald_o
    en: What were you thinking when you gave out my number?
    ko: 제 번호를 알려줘서 뭘 어쩌겠다는 겁니까.
    ja: |-
      私への連絡方法を教えるなど、
      どのような意図があってのことですか。
  event_arkguardian2_03_e_41:
    speaker: soundonly_sol
    en: I apologize. I know you left due to urgent business, but...
    ko: |-
      죄송합니다.
      급한 업무로 자리를 비우신 건 알았지만 이게….
    ja: |-
      申し訳ございません。
      急な任務で離れられていることは
      承知しておりましたが…
  event_arkguardian2_03_e_42:
    speaker: soundonly_sol
    en: Well... It's just...
    ko: 아… 그… 이게….
    ja: あ…ええ…その…
  event_arkguardian2_03_e_43:
    speaker: oswald_o
    en: There better be a good reason.
    ko: 타당한 이유가 있어야 할 겁니다.
    ja: 正当な理由が必要だと言っています。
  event_arkguardian2_03_e_44:
    speaker: soundonly_sol
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_45:
    speaker: oswald_o
    en: This is an official Central Government phone number. If civilians were to
      gain access to it...
    ko: |-
      제 번호는 단순한 개인 번호가 아닙니다.
      사실상 중앙 정부의 공무용 번호라 민간인에게 노출되면
    ja: |-
      この連絡先は個人のものではありません。
      中央政府の公務に用するものです。
      民間人に流出させることは…
  event_arkguardian2_03_e_46:
    speaker: soundonly_sol
    en: I realize that, but...
    ko: 아, 압니다. 아는데….
    ja: じ、重々承知しております。ですが…
  event_arkguardian2_03_e_47:
    speaker: soundonly_sol
    en: That kid spent the entire day curled up in the seat you always use.
    ko: 그 아이, 하루 종일 특무실장님이 있던 자리에서 쪼그리고 앉아 있었습니다.
    ja: |-
      あの子が1日中、
      特務室長のいらっしゃった場所に
      座り込んでおりまして…
  event_arkguardian2_03_e_48:
    speaker: soundonly_sol
    en: She said she'd wait until you came back, and she never budged an inch.
    ko: 올 때까지 기다릴 거라고, 계속 거기 있었습니다.
    ja: |-
      来るまで待つと言って、
      その場を離れようとしないものですから…
  event_arkguardian2_03_e_49:
    speaker: oswald_o
    en: Even so, my number is—
    ko: 그렇다고 제 번호를
    ja: それは私の連絡先を…
  event_arkguardian2_03_e_50:
    speaker: soundonly_sol
    en: But, sir...
    ko: 하지만 특무실장님.
    ja: お言葉ですが、特務室長…
  event_arkguardian2_03_e_51:
    speaker: soundonly_sol
    en: She's just a kid.
    ko: 아, 아이지 않습니까.
    ja: まだ、子どもではありませんか。
  event_arkguardian2_03_e_52:
    speaker: soundonly_sol
    en: You should have seen her face. She was on the verge of tears.
    ko: 그 작은, 어린아이가 당장 울어도 이상하지 않을 표정으로.
    ja: |-
      あんな小さい子が、
      今にも泣き出しそうな顔をしておりました。
  event_arkguardian2_03_e_53:
    speaker: soundonly_sol
    en: But she held them in as she spoke.
    ko: 울음을 꾹 참으면서 얘기했습니다.
    ja: それをこらえて、言うんですよ。
  event_arkguardian2_03_e_54:
    speaker: soundonly_sol
    en: She asked where you had gone, and if she could make one phone call.
    ko: 아, 아저씨 어디 갔냐고. 전화 한 번만 할 수 있냐고.
    ja: |-
      おじさんはどこですか、
      1回だけでいいから、電話させてください、
      なんて…
  event_arkguardian2_03_e_55:
    speaker: soundonly_sol
    en: I... I didn't know what else to do.
    ko: 이걸, 이걸 저보고 어떡하라는 겁니까.
    ja: |-
      あんな、あんなものを見たら、
      他にどうしようも…
  event_arkguardian2_03_e_56:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_57:
    speaker: soundonly_sol
    en: I'm sorry. I take full responsibility for my actions and will accept the corresponding
      punishment.
    ko: "…죄송합니다. 모든 책임을 지고 어떤 처벌이라도 받겠습"
    ja: |-
      …たいへん申し訳ございませんでした。
      すべては私の一存です。いかなる処分も…
  event_arkguardian2_03_e_58:
    speaker: oswald_o
    en: Understood.
    ko: 알겠습니다.
    ja: 分かりました。
  event_arkguardian2_03_e_59:
    speaker: oswald_o
    en: Be careful from now on.
    ko: 다음부터는 주의해 주십시오.
    ja: 今後は十分注意してください。
  event_arkguardian2_03_e_60:
    speaker: soundonly_sol
    en: "... Sir?"
    ko: "…예?"
    ja: "…え…？"
  event_arkguardian2_03_e_61:
    speaker: oswald_o
    en: "... I understand how you feel."
    ko: "…이해합니다. 당신의 기분."
    ja: |-
      …いきさつは理解できました。
      あなたの心情も含めて。
  event_arkguardian2_03_e_62:
    speaker: soundonly_sol
    en: "... Th-thank you."
    ko: "…감사, 합니다."
    ja: "…お…恐れ入ります。"
  event_arkguardian2_03_e_63:
    speaker: oswald_o
    en: Could I ask you a favor?
    ko: 부탁 하나 드려도 되겠습니까.
    ja: ひとつ、頼みごとを聞いていただけますか。
  event_arkguardian2_03_e_64:
    speaker: soundonly_sol
    en: Yes, of course.
    ko: 예. 말씀하십시오.
    ja: はい、なんでもお申し付けください。
  event_arkguardian2_03_e_65:
    speaker: oswald_o
    en: During Phase 3, make sure the girl gets on the elevator bound for the Ark.
    ko: 3차 밀봉 때 그 아이를 반드시 방주로 향하는 엘리베이터에 실어주십시오.
    ja: |-
      第3次封鎖の際、あの子が必ず
      エレベーターに乗るようにしてください。
  event_arkguardian2_03_e_66:
    speaker: oswald_o
    en: You don't need to get involved directly. Just confirm she gets on board.
    ko: |-
      직접 나설 필요는 없습니다.
      탑승하는지만 확인해 주시면 됩니다.
    ja: |-
      直接誘導する必要はありません。
      乗っていることだけ確認していただければ
      結構です。
  event_arkguardian2_03_e_67:
    speaker: oswald_o
    en: If she doesn't, you can use my name.
    ko: 만약 탑승하지 않는다면 저를 팔아도 좋습니다.
    ja: 乗らないようなら、私の名前を使ってください。
  event_arkguardian2_03_e_68:
    speaker: oswald_o
    en: Lie if you have to.
    ko: 거짓말도 상관없습니다.
    ja: 何を言っても構いません。
  event_arkguardian2_03_e_69:
    speaker: soundonly_sol
    en: "... Understood. Thank you."
    ko: "…알겠습니다. 감사합니다."
    ja: "…了解しました。必ず。"
  event_arkguardian2_03_e_70:
    speaker: oswald_o
    en: Good. Now go.
    ko: 예. 수고해 주십시오.
    ja: はい、よろしくお願いします。
  event_arkguardian2_03_e_71:
    speaker: soundonly_sol
    en: Yes, sir. Have a good day.
    ko: 예. 수고하십시오.
    ja: こちらこそ、失礼いたします。
  event_arkguardian2_03_e_72:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 뚝-
    ja: プツン――
  event_arkguardian2_03_e_73:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_74:
    speaker: oswald_o
    en: What was he thinking, seriously.
    ko: 진짜 무슨 생각인지 모르겠군.
    ja: 本当に、何を考えているのか…
  event_arkguardian2_03_e_75:
    speaker: "<Narration>"
    en: Oswald studies the report displayed on his phone screen.
    ko: 오스왈드는 핸드폰 화면에 띄워진 보고서를 본다.
    ja: |-
      オスワルドは携帯端末に表示された
      報告書に目をやった
  event_arkguardian2_03_e_76:
    speaker: oswald_o
    en: "... The Heretic Anachiro escaped."
    ko: "…헬레틱 아나키오르가 탈주."
    ja: "…ヘレティック・アナキオールは脱走…"
  event_arkguardian2_03_e_77:
    speaker: oswald_o
    en: After that, Red Shoes died.
    ko: 이후, 레드 슈즈가 사망….
    ja: そして、レッドシューズが死亡…
  event_arkguardian2_03_e_78:
    speaker: oswald_o
    en: Anachiro has not been heard from since.
    ko: 이후의 아나키오르는 아무런 행동이 없다.
    ja: |-
      それ以降、アナキオールは
      何の動きも見せていない。
  event_arkguardian2_03_e_79:
    speaker: oswald_o
    en: It seems like there's an agenda at play. An agenda aimed at the Heretics.
    ko: |-
      의도가 있는 것처럼 보이는데.
      의도라. 헬레틱에게.
    ja: |-
      何らかの意図が？
      しかし、ヘレティックの意図とは…
  event_arkguardian2_03_e_80:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_81:
    speaker: oswald_o
    en: Cinderella is Abe's masterpiece, not merely in terms of specs.
    ko: 신데렐라는 에이브가 만든 자신작. 단순 스펙만의 얘기는 아니겠지.
    ja: |-
      シンデレラはエイブが心血を注いだ傑作…
      おそらく、単なる性能の話に留まらない。
  event_arkguardian2_03_e_82:
    speaker: oswald_o
    en: And then there's Vapaus... They say it can destroy nanomachines.
    ko: 거기다 언체인드…. 나노머신을 죽인다고 했던가.
    ja: |-
      それに、アンチェインド…
      ナノマシンを破壊すると言っていたか…
  event_arkguardian2_03_e_83:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_84:
    speaker: "<Narration>"
    en: Oswald makes a call.
    ko: 오스왈드가 전화를 건다.
    ja: オスワルドが通信回線を開いた
  event_arkguardian2_03_e_85:
    speaker: oswald_o
    en: This is Oswald.
    ko: 접니다.
    ja: 私です。
  event_arkguardian2_03_e_86:
    speaker: oswald_o
    en: I'm gathering all second-generation units to track down Anachiro. Commence
      preparations.
    ko: |-
      2세대를 모두 모아 아나키오르를 추적하겠습니다.
      준비해 주십시오.
    ja: |-
      第2世代を全員集合させて、
      アナキオールを追撃します。
      備えておいてください。
  event_arkguardian2_03_e_87:
    speaker: oswald_o
    en: There's a piece of this puzzle that we're obviously missing.
    ko: 분명히 우리가 모르는 뭔가가 있습니다.
    ja: 間違いなく、私たちの知らない何かがあります。
  event_arkguardian2_03_e_88:
    speaker: oswald_o
    en: What's the status of the old V.T.C. laboratory?
    ko: 구 V.T.C.의 연구실 쪽은 어떻게 되었습니까.
    ja: 例の旧V.T.C.研究室の方は？
  event_arkguardian2_03_e_89:
    speaker: oswald_o
    en: "... Understood. Keep monitoring the situation."
    ko: "…알겠습니다. 계속 지켜봐 주십시오."
    ja: "…分かりました。引き続きお願いします。"
  event_arkguardian2_03_e_90:
    speaker: oswald_o
    en: Worst case scenario, we might have a traitor in our midst.
    ko: 최악의 경우, 인류의 배신자가 있을지도 모르겠군요.
    ja: |-
      最悪の場合、人類を裏切った者が
      いるかもしれません。
  event_arkguardian2_03_e_91:
    speaker: oswald_o
    en: All right. I'm counting on you.
    ko: 예. 그럼 잘 부탁드립니다.
    ja: はい。よろしくお願いします。
  event_arkguardian2_03_e_92:
    speaker: "<Narration>"
    en: Oswald hangs up.
    ko: 전화가 꺼진다.
    ja: オスワルドは通信を切った
  event_arkguardian2_03_e_93:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_03_e_94:
    speaker: oswald_o
    en: Let's roll.
    ko: 가볼까.
    ja: 行くとしましょうか。
event_arkguardian2_intermission_01:
  event_arkguardian2_intermission_01_1:
    speaker: "<Narration>"
    en: White flowers.
    ko: 새햐안 꽃.
    ja: 純白の花――
  event_arkguardian2_intermission_01_2:
    speaker: "<Narration>"
    en: Only white flowers and nothing else.
    ko: 오직 새하얀 꽃뿐이다.
    ja: 見渡す限り、白い花が咲いている
  event_arkguardian2_intermission_01_3:
    speaker: "<Narration>"
    en: The field of white blossoms radiates under the sunlight.
    ko: |-
      평원에 가득 핀 새하얀 꽃은,
      햇빛에 닿아 찬란하게 빛나고.
    ja: |-
      一面に広がる花は太陽に照らされ、
      まぶしいほどに輝いていた
  event_arkguardian2_intermission_01_4:
    speaker: "<Narration>"
    en: The wind carries the petals away.
    ko: 바람에 꽃잎을 실어 보낸다.
    ja: 花びらが風に舞った
  event_arkguardian2_intermission_01_5:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 스스스스----
    ja: サワサワ…
  event_arkguardian2_intermission_01_6:
    speaker: "<Narration>"
    en: Another gust of wind blows.
    ko: 다시 한번 바람이 불어온다.
    ja: 再び風が吹いた
  event_arkguardian2_intermission_01_7:
    speaker: "<Narration>"
    en: Liliweiss, unaware of a petal brushing her cheek, continues to gaze at the
      white surface.
    ko: |-
      릴리바이스는 날아온 꽃잎이 뺨을 스치는 것도 모른 채,
      새하얀 지상을 바라보고 있었다.
    ja: |-
      リリーバイスは
      頬をかすめた花びらにも気づかないほど、
      真っ白な花畑に見とれていた
  event_arkguardian2_intermission_01_8:
    speaker: liliweiss
    en: Wow...
    ko: "…와아."
    ja: "…わぁ…"
  event_arkguardian2_intermission_01_9:
    speaker: commander
    en: "... Magnificent. I had no idea such a place existed nearby."
    ko: "…장관이군. 근처에 이런 곳이 있었나?"
    ja: "…絶景だな。近くにこんな場所があったのか。"
  event_arkguardian2_intermission_01_10:
    speaker: snowwhite_o
    en: I found it a long time ago. I was worried it might be gone, but it's still
      here.
    ko: |-
      오래전에 찾았어요.
      아직 멀쩡할지 좀 걱정이었는데, 다행이네요.
    ja: |-
      ずっと前に見つけました。
      まだ残ってるか心配してたんですけど、
      あってよかったです。
  event_arkguardian2_intermission_01_11:
    speaker: "<Narration>"
    en: A petal floats down and lands on Dorothy's palm.
    ko: 꽃잎이 날아와 도로시의 손바닥에 내려앉는다.
    ja: |-
      風に吹かれた花びらが、
      ドロシーの手のひらに落ちた
  event_arkguardian2_intermission_01_12:
    speaker: dorothy
    en: "... Liliweiss."
    ko: "…릴리바이스."
    ja: "…リリーバイス。"
  event_arkguardian2_intermission_01_13:
    speaker: liliweiss
    en: Yes. I was named after these flowers.
    ko: 응. 내 이름, 이 꽃에서 따왔대.
    ja: |-
      うん。私の名前、
      この花から取ったんだって。
  event_arkguardian2_intermission_01_14:
    speaker: dorothy
    en: It symbolizes love... and sacrifice.
    ko: 꽃말은 순수한 사랑과… 희생.
    ja: 花言葉は、純粋な愛と…献身。
  event_arkguardian2_intermission_01_15:
    speaker: snowwhite_o
    en: Hehe, I'd say it really suits you, Lilith.
    ko: 헤헤. 언니랑 되게 잘 어울리죠?
    ja: |-
      えへへ、お姉ちゃんに
      ピッタリですよね？
  event_arkguardian2_intermission_01_16:
    speaker: hongryeon_o
    en: A wondrous spectacle. 'Twould be a shame to behold it unaccompanied.
    ko: 이것 참. 혼자 보기 아까운 광경이로세.
    ja: |-
      見事なものだ。
      一人で見るには、もったいない。
  event_arkguardian2_intermission_01_17:
    speaker: rapunzel_o
    en: Truly.
    ko: 정말요.
    ja: その通りですね。
  event_arkguardian2_intermission_01_18:
    speaker: rapunzel_o
    en: It's been so long since I've seen such a sight.
    ko: 이런 풍경은… 정말 오랜만이에요.
    ja: |-
      こんな景色は…
      本当に久しぶりです。
  event_arkguardian2_intermission_01_19:
    speaker: liliweiss
    en: Snow White.
    ko: "…스노우 화이트."
    ja: "…スノーホワイト。"
  event_arkguardian2_intermission_01_20:
    speaker: snowwhite_o
    en: I realized... we rarely have the opportunity to experience moments like this
      together.
    ko: |-
      생각해 보니까 저희.
      이런 걸 같이 보러 온 적이 너무 없었던 것 같아서요.
    ja: |-
      考えたら、みんなで一緒に
      こういう景色を見に来たことって
      なかったなって思ったんです。
  event_arkguardian2_intermission_01_21:
    speaker: snowwhite_o
    en: Especially not lately.
    ko: 최근에는 특히나 더….
    ja: 最近は特に、ずっと…
  event_arkguardian2_intermission_01_22:
    speaker: snowwhite_o
    en: So I wanted all of us to see it at least once.
    ko: 그래서, 다 같이 한 번 보고 싶었어요.
    ja: |-
      だから、みんなで
      見たかったんです。
  event_arkguardian2_intermission_01_23:
    speaker: hongryeon_o
    en: "'Ere our final battle?"
    ko: 최후의 싸움을 앞두고 말인가.
    ja: 最後の戦いを控えてということか？
  event_arkguardian2_intermission_01_24:
    speaker: snowwhite_o
    en: It's not going to be our final battle.
    ko: |-
      그런 건 아니에요.
      최후의 싸움일 리가 없으니까요.
    ja: |-
      そういうわけじゃありません。
      最後の戦いなんて言い方じゃ
      不吉ですよ。
  event_arkguardian2_intermission_01_25:
    speaker: snowwhite_o
    en: Soon it'll get cold, and these flowers will wither.
    ko: 조만간 추워질 테고, 그럼 이 꽃들은 다 시들 거예요.
    ja: |-
      もうすぐ寒くなったら、
      花がみんな枯れてしまうんです。
  event_arkguardian2_intermission_01_26:
    speaker: snowwhite_o
    en: I wanted to remember them when they're at their most beautiful.
    ko: 제일 예쁠 때, 눈에 담아두고 싶었어요.
    ja: |-
      一番きれいな時を、
      目に焼きつけておきたかったので。
  event_arkguardian2_intermission_01_27:
    speaker: snowwhite_o
    en: All of us, together.
    ko: 우리 다 같이.
    ja: みんなで…
  event_arkguardian2_intermission_01_28:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_29:
    speaker: "<Narration>"
    en: Liliweiss walks forward.
    ko: 릴리바이스가 앞으로 걸어간다.
    ja: リリーバイスが前に出た
  event_arkguardian2_intermission_01_30:
    speaker: "<Narration>"
    en: Snow White's gaze follows her, lost in thought.
    ko: 스노우 화이트는 그 뒷모습을 하염없이 바라본다.
    ja: スノーホワイトはその背中を目で追い続けた
  event_arkguardian2_intermission_01_31:
    speaker: "<Narration>"
    en: Liliweiss starts to disappear into the distance.
    ko: 릴리바이스가 멀어진다.
    ja: リリーバイスが遠ざかる
  event_arkguardian2_intermission_01_32:
    speaker: "<Narration>"
    en: Farther, and farther still.
    ko: 더, 더 멀어진다.
    ja: さらに、さらに遠くへと離れていく
  event_arkguardian2_intermission_01_33:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_34:
    speaker: "<Narration>"
    en: Snow White feels like bursting into tears,
    ko: 스노우 화이트는 울음이 터져 나올 것만 같았다.
    ja: スノーホワイトの目から涙があふれそうになる
  event_arkguardian2_intermission_01_35:
    speaker: "<Narration>"
    en: but she does not cry.
    ko: 하지만 울지 않았다.
    ja: だが、必死にこらえた
  event_arkguardian2_intermission_01_36:
    speaker: "<Narration>"
    en: She swallows the lump in her throat, and strains to suppress the sting in
      her nostrils.
    ko: |-
      꿀렁이는 목을 억지로 진정시키고,
      시큰거리는 콧등을 힘겹게 억누른다.
    ja: |-
      詰まる喉を無理やり抑え、
      鼻の奥の痛みに耐えた
  event_arkguardian2_intermission_01_37:
    speaker: liliweiss
    en: It's beautiful.
    ko: 진짜 예쁘다.
    ja: 本当にきれい。
  event_arkguardian2_intermission_01_38:
    speaker: liliweiss
    en: Haha... feels like a dream.
    ko: 하하. 꿈속에 있는 것 같아.
    ja: ふふ…夢の中にいるみたい。
  event_arkguardian2_intermission_01_39:
    speaker: "<Narration>"
    en: Liliweiss turns back to look at everyone.
    ko: 릴리바이스가 뒤로 돌아 일행을 바라본다.
    ja: リリーバイスが振り返ってこちらを見た
  event_arkguardian2_intermission_01_40:
    speaker: "<Narration>"
    en: Her face, slightly flushed with excitement, bears a bright smile.
    ko: |-
      상기되어 살짝 발갛게 달아오른 얼굴,
      활짝 웃고 있는 표정.
    ja: |-
      やや上気した顔に、
      満面の笑みを浮かべていた
  event_arkguardian2_intermission_01_41:
    speaker: "<Narration>"
    en: A strong wind blows.
    ko: 그때, 강한 바람이 불었다.
    ja: ふいに、強い風が吹いた
  event_arkguardian2_intermission_01_42:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 스스스스----
    ja: サァァァ…
  event_arkguardian2_intermission_01_43:
    speaker: liliweiss
    en: Wow!
    ko: 우와…!
    ja: わあ…！
  event_arkguardian2_intermission_01_44:
    speaker: "<Narration>"
    en: White petals burst into the air and scatter everywhere.
    ko: 하얀색 꽃잎이 터져 나오듯 흩날린다.
    ja: 白い花びらがいっせいに舞い上がった
  event_arkguardian2_intermission_01_45:
    speaker: "<Narration>"
    en: The ground and even the sky radiate a brilliant white glow.
    ko: 바닥은 물론 하늘까지 빛나는 하얀색으로 가득 찬다.
    ja: 地表と空を、まばゆい白が包んだ
  event_arkguardian2_intermission_01_46:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩.
    ja: パタッ――
  event_arkguardian2_intermission_01_47:
    speaker: "<Narration>"
    en: Liliweiss collapses,
    ko: 릴리바이스가 쓰러진다.
    ja: リリーバイスの姿勢が崩れた
  event_arkguardian2_intermission_01_48:
    speaker: "<Narration>"
    en: sinking beneath the field of flowers.
    ko: 하얀 꽃밭 아래로 사라진다.
    ja: 白い花畑の中に姿が埋もれた
  event_arkguardian2_intermission_01_49:
    speaker: "<Narration>"
    en: Snow White feels her heart plummet.
    ko: 스노우 화이트는 가슴이 철렁 내려앉는 느낌을 받았다.
    ja: |-
      スノーホワイトは一瞬、
      胸が締めつけられたような気がした
  event_arkguardian2_intermission_01_50:
    speaker: liliweiss
    en: Hahaha, oops! I tripped.
    ko: 아하하… 넘어졌어.
    ja: あはは…転んじゃった。
  event_arkguardian2_intermission_01_51:
    speaker: "<Narration>"
    en: Liliweiss rises.
    ko: 릴리바이스가 일어난다.
    ja: リリーバイスが上体を起こした
  event_arkguardian2_intermission_01_52:
    speaker: "<Narration>"
    en: White petals cover her entire body.
    ko: 하얀색 꽃잎이 몸 곳곳에 내려앉아 있다.
    ja: 白い花びらを全身にまとっていた
  event_arkguardian2_intermission_01_53:
    speaker: "<Narration>"
    en: To Snow White, it's as if she's wearing a bridal veil.
    ko: 스노우 화이트는 그 모습이 마치 면사포를 두르고 있는 것 같다고 느꼈다.
    ja: |-
      スノーホワイトは、
      純白のベールのようだと思った
  event_arkguardian2_intermission_01_54:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 스스스스----
    ja: サァァァ…
  event_arkguardian2_intermission_01_55:
    speaker: "<Narration>"
    en: The wind blows again.
    ko: 다시 바람이 분다.
    ja: また風が吹いた
  event_arkguardian2_intermission_01_56:
    speaker: "<Narration>"
    en: The petals whirl and dance around Liliweiss.
    ko: 꽃잎이 흩날리며 릴리바이스의 주위에서 춤춘다.
    ja: |-
      吹き散らされた花びらが、
      リリーバイスの周りで踊る
  event_arkguardian2_intermission_01_57:
    speaker: "<Narration>"
    en: Her eyes widen,
    ko: 릴리바이스의 눈이 커진다.
    ja: リリーバイスが目を大きく見開いた
  event_arkguardian2_intermission_01_58:
    speaker: "<Narration>"
    en: and she dances with the petals, a duet of two Liliweisses.
    ko: 릴리바이스와 릴리바이스가 춤춘다.
    ja: |-
      リリーバイスと白の花びらが
      くるくると回る
  event_arkguardian2_intermission_01_59:
    speaker: liliweiss
    en: Haha...
    ko: 하하…!
    ja: ふふ…！
  event_arkguardian2_intermission_01_60:
    speaker: liliweiss
    en: Hahahaha!
    ko: 아하! 아하하하하!!
    ja: あはっ！あはははは…！！
  event_arkguardian2_intermission_01_61:
    speaker: "<Narration>"
    en: In the dreamlike scene, Liliweiss laughs like a child.
    ko: 릴리바이스는 꿈만 같은 풍경 안에서 어린아이처럼 웃는다.
    ja: |-
      夢のような光景の中で、
      リリーバイスが子どものように笑った
  event_arkguardian2_intermission_01_62:
    speaker: "<Narration>"
    en: Snow White sees her and bursts into laughter.
    ko: 스노우 화이트는 그 모습을 보고, 같이 웃음을 터트렸다.
    ja: それを見たスノーホワイトも、つられて笑った
  event_arkguardian2_intermission_01_63:
    speaker: snowwhite_o
    en: Hahaha!
    ko: 하하! 하하하하!
    ja: あはは！ははははっ！
  event_arkguardian2_intermission_01_64:
    speaker: liliweiss
    en: Hahaha! Snow White! Everyone! Isn't this wonderful? Hahaha!
    ko: 하아…! 아하! 스노우 화이트! 얘들아! 하하! 하하하!
    ja: |-
      あはっ！スノーホワイト！みんな！
      はは！あはは！
  event_arkguardian2_intermission_01_65:
    speaker: snowwhite_o
    en: Haha! You're breathtaking, Lilith!
    ko: 하하! 릴리스 언니! 진짜 예뻐요! 하하하!
    ja: |-
      ははは！リリスお姉ちゃん！
      すごくきれいです！あはは！
  event_arkguardian2_intermission_01_66:
    speaker: liliweiss
    en: Haha! This place! It's amazing! Hahaha!
    ko: 아하하! 여기! 진짜 대단하다! 아하하하!
    ja: |-
      あはは！ここ、本当にステキ！
      あはははっ！
  event_arkguardian2_intermission_01_67:
    speaker: snowwhite_o
    en: Hahaha!
    ko: 아하하하하!
    ja: あはははは！
  event_arkguardian2_intermission_01_68:
    speaker: snowwhite_o
    en: Haha! Haa... ngh... ugh...! Haha... ha... hic...!
    ko: 하하! 하아… 우으…! 으윽…! 하하! 하… 히윽…!
    ja: |-
      ははっ！はあ…ううっ…！うっ…！
      ははっ！あはは…ひっく…！
  event_arkguardian2_intermission_01_69:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_70:
    speaker: snowwhite_o
    en: Lilith! Ahahaha!
    ko: 릴리스 언니--!! 아하하하하!
    ja: リリスお姉ちゃん！！あははははっ！
  event_arkguardian2_intermission_01_71:
    speaker: liliweiss
    en: Snow White!
    ko: 스노우 화이트--!!
    ja: スノーホワイト！！
  event_arkguardian2_intermission_01_72:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_73:
    speaker: hongryeon_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_74:
    speaker: rapunzel_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_75:
    speaker: commander
    en: Snow White.
    ko: "…스노우 화이트."
    ja: "…スノーホワイト。"
  event_arkguardian2_intermission_01_76:
    speaker: commander
    en: Thank you.
    ko: 고맙다.
    ja: ありがとう。
  event_arkguardian2_intermission_01_77:
    speaker: "<Narration>"
    en: Snow White forces a smile and waves at Liliweiss.
    ko: 스노우 화이트는 일그러진 표정으로 웃으며 릴리바이스를 향해 손을 흔든다.
    ja: |-
      スノーホワイトは
      今にも泣きだしそうな笑顔で、
      リリーバイスに向かって手を振った
  event_arkguardian2_intermission_01_78:
    speaker: "<Narration>"
    en: She doesn't shed a single tear.
    ko: 눈물은 단 한 방울도 흘리지 않는다.
    ja: 一滴の涙もこぼさず
  event_arkguardian2_intermission_01_79:
    speaker: "<Narration>"
    en: She doesn't even blink.
    ko: 눈도 깜빡이지 않는다.
    ja: まばたきもせずに
  event_arkguardian2_intermission_01_80:
    speaker: "<Narration>"
    en: She only tries to capture this fairytale dream with her eyes for as long as
      she can,
    ko: |-
      그저 이 꿈속 동화와 같은 모습을
      조금이라도 두 눈에 담기 위해.
    ja: |-
      ただ、夢ともおとぎ話の一場面とも
      つかないような光景を、
      少しでも目に焼きつけようと
  event_arkguardian2_intermission_01_81:
    speaker: "<Narration>"
    en: to imprint it into her mind.
    ko: 머릿속에 새겨두기 위해.
    ja: 記憶に刻みこもうと
  event_arkguardian2_intermission_01_82:
    speaker: "<Narration>"
    en: Snow White gazes at Liliweiss, and Liliweiss the flower, unable to look away.
    ko: 스노우 화이트는 릴리바이스와 릴리바이스를 하염없이 바라보았다.
    ja: |-
      舞い踊る花の中で笑うリリーバイスを
      しっかりと見つめていた
  event_arkguardian2_intermission_01_83:
    speaker: "<Narration>"
    en: What a beautiful white flower.
    ko: 아름다운 하얀 꽃.
    ja: 美しい白の花
  event_arkguardian2_intermission_01_84:
    speaker: "<Narration>"
    en: The most beautiful white flower in the world that will soon wither.
    ko: 곧 시들어버릴, 세상 가장 아름다운 하얀 꽃을.
    ja: |-
      遠からず枯れるさだめの、
      世界で一番美しく白い花を…
  event_arkguardian2_intermission_01_85:
    speaker: "<Narration>"
    en: A heavy silence looms over the plaza, filled with mass-produced Nikkes.
    ko: 광장을 가득 채운 양산형 니케들 사이에서 끔찍한 침묵이 감돌았다.
    ja: |-
      広場を埋め尽くすほどの量産型ニケたちが、
      恐ろしいほど静かに集合している
  event_arkguardian2_intermission_01_86:
    speaker: "<Narration>"
    en: Everyone is staring at the papers in their hands.
    ko: 모두가 손에 들고 있는 서류를 뚫어져라 쳐다보고 있다.
    ja: |-
      誰もが手元の書類に視線を落とし、
      くぎ付けになっていた
  event_arkguardian2_intermission_01_87:
    speaker: "<Narration>"
    en: They outline the final phase of Operation Ark Guardian.
    ko: 아크 가디언 작전의 마지막 페이즈에 대한 내용이 적혀있었고.
    ja: |-
      アークガーディアン作戦、
      最終段階の計画概要書
  event_arkguardian2_intermission_01_88:
    speaker: "<Narration>"
    en: Numerous written warnings fill the margins.
    ko: 그 아래에는 각종 주의 사항 및 경고가 쓰여 있었다.
    ja: その最後に書かれた、注意事項と警告に
  event_arkguardian2_intermission_01_89:
    speaker: "<Narration>"
    en: The sealing will end at Phase 3.
    ko: 전황상 밀봉은 3차로 종료될 것이며
    ja: |-
      ――現在の戦況を鑑み、
      封鎖計画は第3次をもって終了とする
  event_arkguardian2_intermission_01_90:
    speaker: "<Narration>"
    en: The Goddess Squad will remain on the surface,
    ko: 3차 밀봉 이후, 갓데스 스쿼드는 지상에 계속 남을 것이며
    ja: |-
      第3次封鎖の後、
      ゴッデス部隊は地上で防衛戦を続ける
  event_arkguardian2_intermission_01_91:
    speaker: "<Narration>"
    en: to protect the latecomers, returning to the Ark at a later date.
    ko: 방주 입구를 찾아오는 이들을 끝의 끝까지 지킨 후 방주로 복귀한다는 내용이다.
    ja: |-
      さらにキャンプへ到達する避難民たちが
      存在しなくなったことを確認したのち、
      アークへ撤収する
  event_arkguardian2_intermission_01_92:
    speaker: "<Narration>"
    en: Any mass-produced Nikke who wishes to join the operation may do so voluntarily.
    ko: 본인이 원할 시 양산형 니케는 해당 작전에 참가할 수 있으며
    ja: |-
      なお、当作戦への量産型ニケの参加は、
      本人の意思決定による希望制とする――
  event_arkguardian2_intermission_01_93:
    speaker: "<Narration>"
    en: The papers detail the numerous risks each volunteer might face.
    ko: 해당 작전에 참가 시, 본인이 부담해야 할 수많은 위험과 불이익에 대해 상세하게 적혀있었다.
    ja: |-
      そして、作戦参加に伴う数多のリスクや
      不利益の細かい記載が続いていた
  event_arkguardian2_intermission_01_94:
    speaker: "<Narration>"
    en: At the bottom of the paper is a signature line.
    ko: |-
      서류의 가장 아래.
      사인란이 있다.
    ja: |-
      書類の最下部には、
      署名欄がある
  event_arkguardian2_intermission_01_95:
    speaker: "<Narration>"
    en: Joining is a suicide mission,
    ko: 미친 짓이다. 이 작전에 함께 한다는 것은.
    ja: |-
      正気の沙汰ではない。
      自分から志願するなんて、なおさらだ
  event_arkguardian2_intermission_01_96:
    speaker: "<Narration>"
    en: and it's nearly guaranteed they would lose their lives.
    ko: 목숨이 수십 개가 있어도 모자랄 것이 분명하다.
    ja: 命がいくつあっても足りない
  event_arkguardian2_intermission_01_97:
    speaker: "<Narration>"
    en: As mass-produced Nikkes, they are fully aware of this truth and therefore
      remain silent.
    ko: |-
      그 사실을 너무나 잘 알고 있는 양산형 니케들이었기에,
      모두가 침묵을 지킨다.
    ja: |-
      その事実を誰よりも理解している
      量産型ニケたちは、
      ただ押し黙ることしかできなかった
  event_arkguardian2_intermission_01_98:
    speaker: "<Narration>"
    en: "*Scratch scratch*"
    ko: 슥슥-
    ja: サラサラ…
  event_arkguardian2_intermission_01_99:
    speaker: "<Narration>"
    en: In the profound silence, the sound of a pen signing resonates loudly.
    ko: 너무나 조용한 탓에, 서류에 사인하는 소리가 크게 들린다.
    ja: |-
      死んだような静けさの中で、
      誰かのペンの音が響いた
  event_arkguardian2_intermission_01_100:
    speaker: "<Narration>"
    en: Loud enough for nearly every Nikke gathered in the plaza to hear.
    ko: 아마도 광장에 모여있는 모든 양산형 니케들이 그 소리를 들었을 것이다.
    ja: |-
      きっとその場にいた量産型ニケは、
      誰もがその音に耳を澄ませていたことだろう
  event_arkguardian2_intermission_01_101:
    speaker: "<Narration>"
    en: One mass-produced Nikke rises from her seat.
    ko: 어느 양산형 니케가 자리에서 일어났다.
    ja: やがて、1人がその場から立ち上がった
  event_arkguardian2_intermission_01_102:
    speaker: pinne
    en: Where do I submit this after I sign it? Should I take it to the front?
    ko: 사인한 서류는 앞에 제출하면 되나요?
    ja: |-
      署名済みの書類は
      前に提出すればよろしいでしょうか？
  event_arkguardian2_intermission_01_103:
    speaker: "<Narration>"
    en: The squad leader, caught off guard, gives a nod.
    ko: 스쿼드 리더가 얼떨결에 고개를 끄덕인다.
    ja: |-
      部隊のリーダーが戸惑いを隠せないまま、
      うなずいた
  event_arkguardian2_intermission_01_104:
    speaker: "<Narration>"
    en: Pinne walks forward, sets the documents down, and turns back.
    ko: |-
      피나는 앞으로 걸어가 서류를 올려놓고,
      뒤를 돌아본다.
    ja: |-
      集団の前へ歩みでたピナが、
      書類を提出し、振り返った
  event_arkguardian2_intermission_01_105:
    speaker: "<Narration>"
    en: The crowd of Nikkes looks at her.
    ko: 수많은 양산형 니케가 자신을 바라보고 있다.
    ja: 無数の量産型ニケの目が向けられている
  event_arkguardian2_intermission_01_106:
    speaker: pinne
    en: Hmm...
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_107:
    speaker: pinne
    en: The Goddess Squad will be with us.
    ko: 갓데스가 있어요.
    ja: ゴッデスとともに。
  event_arkguardian2_intermission_01_108:
    speaker: "<Narration>"
    en: Pinne heads back to her dorm.
    ko: 피나는 숙소로 걸어갔다.
    ja: ピナが宿所へと歩き去った
  event_arkguardian2_intermission_01_109:
    speaker: "<Narration>"
    en: Soon, the sound of signatures being written fills the plaza.
    ko: 그리고 잠시 후, 광장에는 사인하는 소리만이 울려 퍼졌다.
    ja: |-
      しばらくの静寂の後、
      またペンの音だけが広場に響き始めた
  event_arkguardian2_intermission_01_110:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠구구구구…!
    ja: ゴゴゴゴゴ…！！
  event_arkguardian2_intermission_01_111:
    speaker: commander
    en: All right. Phase 3 of the sealing begins now.
    ko: "…좋아. 3차 밀봉이 시작된다."
    ja: "…よし。第3次封鎖が始まった。"
  event_arkguardian2_intermission_01_112:
    speaker: commander
    en: I've got good news and bad news.
    ko: 좋은 소식과 안 좋은 소식이 있다.
    ja: さっそくだが、いい知らせと悪い知らせがある。
  event_arkguardian2_intermission_01_113:
    speaker: commander
    en: What do you want to hear first?
    ko: 뭐부터 들을래?
    ja: どちらから聞きたい？
  event_arkguardian2_intermission_01_114:
    speaker: liliweiss
    en: Let's start with the bad news.
    ko: 안 좋은 소식부터 듣죠.
    ja: 悪い知らせからお願いします。
  event_arkguardian2_intermission_01_115:
    speaker: commander
    en: A large portion of the elite Raptures stationed at the Lift are heading our
      way.
    ko: 궤도 엘리베이터에 주둔 중인 정예 랩쳐들 중 상당수가 이쪽으로 향하고 있다고 한다.
    ja: |-
      軌道エレベーターに集結していた
      精鋭ラプチャーの大多数が
      こちらへ向かっているらしい。
  event_arkguardian2_intermission_01_116:
    speaker: commander
    en: Whether or not they know this is the last phase is uncertain, but either way,
      they intend to finish this.
    ko: |-
      이번이 마지막인 줄 알았는지 어땠는지는 몰라도,
      아주 끝장을 내러 온다는 얘기지.
    ja: |-
      これで最後だと勘づかれたのかどうかは
      知らないが、とどめを刺そうという気だろう。
  event_arkguardian2_intermission_01_117:
    speaker: liliweiss
    en: "... That's really bad news."
    ko: 으음… 정말 안 좋은 소식이네요.
    ja: それは…最悪の知らせですね。
  event_arkguardian2_intermission_01_118:
    speaker: liliweiss
    en: And the good news?
    ko: 그럼, 좋은 소식은요?
    ja: それで、いい知らせの方は？
  event_arkguardian2_intermission_01_119:
    speaker: commander
    en: I had an excellent bowel movement this morning.
    ko: 오늘 아침에 내가 쾌변을 했다는거지.
    ja: 今朝は快便だった。
  event_arkguardian2_intermission_01_120:
    speaker: liliweiss
    en: Right, congrats.
    ko: 아, 예. 축하해요.
    ja: はい、そうですか。よかったですね。
  event_arkguardian2_intermission_01_121:
    speaker: hongryeon
    en: 'Nay, the good tidings be this: Rapunzel and I hath received new armaments.'
    ko: 틀렸네. 나와 라푼젤이 새로운 장비를 받았다는 게 좋은 소식일세.
    ja: |-
      朗報ならあるぞ。
      私とラプンツェルの新しい装備だ。
  event_arkguardian2_intermission_01_122:
    speaker: rapunzel
    en: That means our combat power has increased.
    ko: 그럼요. 전력이 상승했다는 얘기니까요.
    ja: はい。戦力の向上になりますね。
  event_arkguardian2_intermission_01_123:
    speaker: liliweiss
    en: Looks great on you.
    ko: 음. 잘 어울리네.
    ja: うん、よく似合ってる。
  event_arkguardian2_intermission_01_124:
    speaker: snowwhite_o
    en: The specs have improved significantly, particularly in defense, which I mainly
      focused on.
    ko: |-
      성능도 많이 올랐어요.
      특히 방어력 쪽으로 신경 썼거든요.
    ja: |-
      性能を大幅に上げられました。
      防御力には特に重点を置いています。
  event_arkguardian2_intermission_01_125:
    speaker: hongryeon
    en: Is that so? Seems mighty light for so bold a claim... By how much hath it
      been strengthened?
    ko: |-
      그런가? 그런 것 치곤 가벼운 느낌인데….
      얼마나 올랐는가.
    ja: |-
      そうなのか？それにしては軽い気がするが…
      具体的には。
  event_arkguardian2_intermission_01_126:
    speaker: snowwhite_o
    en: I don't have an exact figure, but I'd say more than twofold.
    ko: 어… 자세한 수치까지는 모르겠는데 2배 이상으로 올랐어요.
    ja: |-
      ええと…細かい数値は出ませんけど、
      2倍以上になったはずです。
  event_arkguardian2_intermission_01_127:
    speaker: hongryeon
    en: Oh!
    ko: 오.
    ja: ほう。
  event_arkguardian2_intermission_01_128:
    speaker: hongryeon
    en: Then could I withstand twice the beating, perchance?
    ko: 두 배 더 맞아도 괜찮다는 얘기로군.
    ja: 2倍撃たれてもよいということだな。
  event_arkguardian2_intermission_01_129:
    speaker: rapunzel
    en: Let's not jump straight to getting a beating.
    ko: 맞는 것부터 생각하지 마세요.
    ja: まず撃たれないようにしてください。
  event_arkguardian2_intermission_01_130:
    speaker: snowwhite_o
    en: Dorothy and Lilith's gear will take a little longer. Sorry about that.
    ko: |-
      도로시와 언니 장비는 시간이 좀 더 걸릴 것 같아요.
      죄송해요.
    ja: |-
      ドロシーとお姉ちゃんの装備は、
      もう少し時間がかかりそうです。
      ごめんなさい。
  event_arkguardian2_intermission_01_131:
    speaker: dorothy
    en: That's fine. I'm good, even in my current state.
    ko: 괜찮아요 저는. 지금 상태로도 충분하니까.
    ja: |-
      気にしないでください。
      今のままでも不足はありませんので。
  event_arkguardian2_intermission_01_132:
    speaker: liliweiss
    en: Same for me.
    ko: 나도 마찬가지야.
    ja: そこは私も。
  event_arkguardian2_intermission_01_133:
    speaker: commander
    en: I don't suppose I get a care package?
    ko: 내 건 당연히 없겠지?
    ja: 私の分は当然ないんだろうな？
  event_arkguardian2_intermission_01_134:
    speaker: snowwhite_o
    en: "... No."
    ko: "…예."
    ja: "…はい…"
  event_arkguardian2_intermission_01_135:
    speaker: commander
    en: Figures. It's a hard-knock life for us non-Nikkes.
    ko: 니케 아닌 사람 서러워서 살겠나 진짜.
    ja: 生身の人間はつらいな、まったく。
  event_arkguardian2_intermission_01_136:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_intermission_01_137:
    speaker: commander
    en: All right. Gear up.
    ko: 자, 준비해라.
    ja: さあ、準備を始めろ。
  event_arkguardian2_intermission_01_138:
    speaker: commander
    en: Our mass-produced friends are all staying. Not a single one's sitting out.
    ko: |-
      양산형 친구들도 모두 남아준다고 했다.
      한 명도 빠짐없이 말이지.
    ja: |-
      量産型ニケたちも全員が
      志願してくれたそうだ。
      1人残らずな。
  event_arkguardian2_intermission_01_139:
    speaker: commander
    en: They'll fight alongside us. Pretty cool if you ask me.
    ko: 멋지지 않냐. 우리랑 같이 싸워준단다.
    ja: |-
      頼もしいことだ。
      戦うのは私たちだけじゃない。
  event_arkguardian2_intermission_01_140:
    speaker: commander
    en: So let's look good out there.
    ko: 그러니 멋진 모습 보여주도록.
    ja: だから、カッコいいところを見せつけてやれ。
  event_arkguardian2_intermission_01_141:
    speaker: liliweiss
    en: Absolutely.
    ko: 물론이죠.
    ja: もちろんです。
  event_arkguardian2_intermission_01_142:
    speaker: hongryeon
    en: Excellent. Let us venture forth.
    ko: 좋아. 가봄세.
    ja: よし、参ろう。
  event_arkguardian2_intermission_01_143:
    speaker: rapunzel
    en: Let's go.
    ko: 다들, 가요.
    ja: みなさん、行きましょう。
  event_arkguardian2_intermission_01_144:
    speaker: snowwhite_o
    en: Don't die out there, all of you.
    ko: 모두. 죽지 마요.
    ja: みんな、死なないでください。
  event_arkguardian2_intermission_01_145:
    speaker: dorothy
    en: You got it.
    ko: 물론이에요.
    ja: 当然です。
  event_arkguardian2_intermission_01_146:
    speaker: commander
    en: Goddess Squad. Ready.
    ko: 갓데스 스쿼드. 레디.
    ja: ゴッデス部隊、レディ…
  event_arkguardian2_intermission_01_147:
    speaker: commander
    en: Encounter.
    ko: 인카운터.
    ja: エンカウンター。
event_arkguardian2_04_s:
  event_arkguardian2_04_s_1:
    speaker: "<Narration>"
    en: "*Roar*"
    ko: 꽈아아아앙---!!
    ja: ガガガガガッ――！！
  event_arkguardian2_04_s_2:
    speaker: "<Narration>"
    en: A thunderous roar erupts as something thrusts up.
    ko: 굉음이 울려 퍼지며 뭔가가 솟아오른다.
    ja: 轟音とともに、何かが飛び出した
  event_arkguardian2_04_s_3:
    speaker: "<Narration>"
    en: The Tyrant-class Rapture, Ultra, shoots into the air.
    ko: 타일런트 급 랩쳐, 울트라가 공중으로 솟는다.
    ja: タイラント級ラプチャー、ウルトラだ
  event_arkguardian2_04_s_4:
    speaker: "<Narration>"
    en: Its abdomen caves in, and fluids scatter as it moves through the air.
    ko: 움푹 들어간 복부, 흩날리는 체액.
    ja: 腹部はえぐれ、体液を飛び散らせている
  event_arkguardian2_04_s_5:
    speaker: "<Narration>"
    en: After briefly tracing an arc through the air, Ultra crashes to the ground
      and crumples with a sickening sound.
    ko: |-
      잠시 동안 공중을 날던 울트라가 지면에 추락하고,
      불쾌한 소리를 내며 뭉개진다.
    ja: |-
      しばらく浮遊していたウルトラは墜落し、
      不快な音を立てて崩壊した
  event_arkguardian2_04_s_6:
    speaker: "<Narration>"
    en: Even amid a massive battlefield filled with Raptures, this sight can be seen
      and heard from everywhere.
    ko: |-
      랩쳐들로 가득한, 넓게 전개된 전장이었지만
      그 이질적인 광경은 전장 어디에서든 확인할 수 있었다.
    ja: |-
      それと同じような異質な光景が、
      ラプチャーだらけの大戦場の中で
      広がっていく
  event_arkguardian2_04_s_7:
    speaker: "<Narration>"
    en: Liliweiss dusts off her hands and admires her handiwork.
    ko: 릴리바이스는 손을 털며 만족스럽게 자기가 만든 결과를 바라보았다.
    ja: |-
      リリーバイスは身体を手で払いながら、
      自分の仕事の結果を満足げに眺めた
  event_arkguardian2_04_s_8:
    speaker: commander_op_r
    en: Aren't you pushing yourself too hard?
    ko: 너무 무리하는 거 아냐?
    ja: 無理しすぎじゃないか？
  event_arkguardian2_04_s_9:
    speaker: liliweiss
    en: I'm letting them know that I'm here to finish them.
    ko: 보여주는 거죠. 갓데스의 릴리바이스가 여기 있다고.
    ja: |-
      見せつけないといけませんから。
      ゴッデスのリリーバイスはここだって。
  event_arkguardian2_04_s_10:
    speaker: commander_op_r
    en: There's no point. Raptures aren't even capable of grasping a concept such
      as morale.
    ko: |-
      랩쳐 놈들은 무식해서 그런 거 몰라.
      사기라는 게 존재하지 않는다고.
    ja: |-
      ラプチャーどもには関係ないだろう。
      士気なんてものを持つだけの
      知能がないからな。
  event_arkguardian2_04_s_11:
    speaker: liliweiss
    en: I'm doing it for our own forces.
    ko: 우리 편한테 보여주는 거예요.
    ja: 味方のほうに見せるためです。
  event_arkguardian2_04_s_12:
    speaker: commander_op_r
    en: It's solid showmanship, I'll give you that.
    ko: 흠. 그래. 좋은 쇼맨십이야.
    ja: |-
      ふん、そうだな。
      素晴らしいショーマンシップだ。
  event_arkguardian2_04_s_13:
    speaker: "<Narration>"
    en: Liliweiss wipes the lukewarm liquid flowing from somewhere on her face.
    ko: 릴리바이스는 얼굴 어딘가에서 흐르는 미지근한 액체를 닦는다.
    ja: |-
      リリーバイスは顔のどこからか流れ出す、
      生温かい液体をぬぐった
  event_arkguardian2_04_s_14:
    speaker: "<Narration>"
    en: There's no need for her to check; she already knows what it is.
    ko: 확인하지는 않는다. 무엇인지는 보지 않아도 알 수 있다.
    ja: それが何かは確かめるまでもない
  event_arkguardian2_04_s_15:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_s_16:
    speaker: liliweiss
    en: "... Just hold on a little longer."
    ko: 자, 조금만 더 버텨줘.
    ja: お願い、もう少しだけ耐えて。
  event_arkguardian2_04_s_17:
    speaker: commander_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_s_18:
    speaker: commander_op_r
    en: Lilith.
    ko: 릴리스.
    ja: リリス。
  event_arkguardian2_04_s_19:
    speaker: liliweiss
    en: What is it? Why are you saying my name like that?
    ko: 왜 그래요? 갑자기 느끼하게 부르시네.
    ja: |-
      どうかしました？
      そんなにカッコつけて私を呼ぶなんて。
  event_arkguardian2_04_s_20:
    speaker: commander_op_r
    en: What do you say we go on a trip when this is over?
    ko: 이번에 끝나면 어디 놀러나 갈까.
    ja: この作戦が終わったら、どこかへ遊びに行こう。
  event_arkguardian2_04_s_21:
    speaker: liliweiss
    en: Are you trying to get me killed? You're distracting me.
    ko: |-
      세상에. 저 죽이려고 작정했어요?
      전투 중에 그런 말을 하다니.
    ja: |-
      ちょっと、私を死なせる気ですか？
      戦闘中にそんな話。
  event_arkguardian2_04_s_22:
    speaker: commander_op_r
    en: Cliches are meant to be broken.
    ko: 클리셰는 부수라고 있는 거야.
    ja: お決まりの展開は破るためにあるんだ。
  event_arkguardian2_04_s_23:
    speaker: liliweiss
    en: "... Okay then. Where are we going?"
    ko: 뭐, 좋아요. 어디 갈 건데요?
    ja: まあ、いいですけど。どこにします？
  event_arkguardian2_04_s_24:
    speaker: commander_op_r
    en: Hmm... Let's go see the ocean.
    ko: 글쎄. 바다나 보러 가자고.
    ja: そうだな。海はどうだ。
  event_arkguardian2_04_s_25:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_s_26:
    speaker: liliweiss
    en: Sure. Let's do that.
    ko: 그래요. 가요.
    ja: いいですね。そうしましょう。
  event_arkguardian2_04_s_27:
    speaker: commander_op_r
    en: Scarlet, how's it going?
    ko: 홍련. 어때?
    ja: 紅蓮、調子はどうだ？
  event_arkguardian2_04_s_28:
    speaker: hongryeon
    en: No need for words. I feel as light as the very air. At this pace, I shall
      eclipse Lilith herself.
    ko: 말할 것도 없네. 이렇게나 몸이 가볍다니, 오늘의 나는 릴리스 그 이상일 게 분명해.
    ja: |-
      言うまでもない、こうも体が軽いとは。
      今の私ならリリスを越える。
  event_arkguardian2_04_s_29:
    speaker: commander_op_r
    en: You do realize you've been hit more than five times, don't you?
    ko: 너 벌써 5번 이상 피격된 건 알아?
    ja: もう5回以上攻撃を受けているようだが？
  event_arkguardian2_04_s_30:
    speaker: hongryeon
    en: Thy calculations doth require amendment. 'Tis but two and a half times.
    ko: 셈이 서툴군그래. 2.5번일세.
    ja: 数字に弱いのか？2回と半分だ。
  event_arkguardian2_04_s_31:
    speaker: hongryeon
    en: For my defenses have doubled in might.
    ko: 왜냐하면 내 방어력이 두 배로 높아졌기 때문이지.
    ja: 防御力が2倍になっているのだからな。
  event_arkguardian2_04_s_32:
    speaker: commander_op_r
    en: That's not how it works.
    ko: 그렇게 계산하는 거 아니야.
    ja: 数え方がおかしいだろう。
  event_arkguardian2_04_s_33:
    speaker: hongryeon
    en: Any tidings of yon mass-produced Heretics?
    ko: 양산형 헬레틱이란 것들은 아직 보이지 않나?
    ja: |-
      量産型ヘレティックとやらは、
      まだ姿を見せぬのか？
  event_arkguardian2_04_s_34:
    speaker: commander_op_r
    en: Not yet. Soon.
    ko: 아직. 곧 오겠지.
    ja: まだだ。だがもうすぐ来る。
  event_arkguardian2_04_s_35:
    speaker: hongryeon
    en: Bid Liliweiss and Dorothy stand aside. I shall fell them all myself.
    ko: 내가 다 잡을 테니 릴리바이스와 도로시에겐 나서지 말라고 일러주게.
    ja: |-
      こちらでまとめて相手してやろう。
      リリーバイスとドロシーには
      手出し無用と伝えておけ。
  event_arkguardian2_04_s_36:
    speaker: commander_op_r
    en: Yeah, yeah, go ahead and take all the glory for yourself.
    ko: 그래그래. 너 혼자 다 해 먹어라.
    ja: 分かった。そちらは君一人に全て任せる。
  event_arkguardian2_04_s_37:
    speaker: commander_op_r
    en: Wait. They're taking position.
    ko: 엇. 놈들이 자리를 잡는다.
    ja: む…新手の出現だ。
  event_arkguardian2_04_s_38:
    speaker: commander_op_r
    en: Bombardment-type Raptures, and it looks like they're aiming for the mass-produced
      Nikkes.
    ko: 포격형들이군. 양산형 친구들을 노리는 것 같은데.
    ja: ミサイル搭載型か。狙いは量産型部隊だろうな。
  event_arkguardian2_04_s_39:
    speaker: hongryeon
    en: I shall go forth and hew them all down.
    ko: 내가 가서 몽땅 베어버리겠네.
    ja: 一匹残らず斬り倒してくれる。
  event_arkguardian2_04_s_40:
    speaker: commander_op_r
    en: Leave them. Rapunzel's here.
    ko: 냅둬. 라푼젤이 있다.
    ja: 不要だ。ラプンツェルがいる。
  event_arkguardian2_04_s_41:
    speaker: "<Narration>"
    en: A shower of missiles traces an arc as they rain down upon the field.
    ko: 수많은 미사일이 호를 그리고 전장에 쏟아진다.
    ja: ミサイルの雨が弧を描き、戦場に降り注いだ
  event_arkguardian2_04_s_42:
    speaker: "<Narration>"
    en: Multiple bombardment-type Raptures shell the mass-produced Nikkes' lines.
    ko: 다수의 포격형 랩쳐들이 양산형 니케들의 전장을 노리고 포격을 쏟아낸다.
    ja: 戦闘中の量産型ニケたちを狙った攻撃だ
  event_arkguardian2_04_s_43:
    speaker: "<Narration>"
    en: Rapunzel steps forward.
    ko: 라푼젤이 나선다.
    ja: ラプンツェルが前に躍り出た
  event_arkguardian2_04_s_44:
    speaker: "<Narration>"
    en: With a prayer-like chant, she raises her staff.
    ko: 기도와 같은 주문과 함께, 지팡이를 들어 올린다.
    ja: 祈るような言葉とともに、杖が掲げられる
  event_arkguardian2_04_s_45:
    speaker: rapunzel
    en: A shield to protect everyone!
    ko: 모두를 지킬 방패를!
    ja: 全てを守る盾を！
  event_arkguardian2_04_s_46:
    speaker: "<Narration>"
    en: A golden veil descends.
    ko: 황금색 막이 드리워진다.
    ja: 黄金色の幕が広がった
  event_arkguardian2_04_s_47:
    speaker: "<Narration>"
    en: Missiles rain down and explode against the golden veil.
    ko: 마치 비처럼 쏟아지던 미사일은, 황금색 막에 막혀 공중에서 폭발한다.
    ja: |-
      ミサイルがことごとく遮られ、
      空中で爆発していく
  event_arkguardian2_04_s_48:
    speaker: rapunzel
    en: This is truly impressive.
    ko: "…이런 것까지 되는군요."
    ja: "…こんなことまでできるのですね。"
  event_arkguardian2_04_s_49:
    speaker: commander_op_r
    en: You like it?
    ko: 마음에 드나 보네.
    ja: 使いこなせているようだな。
  event_arkguardian2_04_s_50:
    speaker: rapunzel
    en: It's more than that. With such power...
    ko: 그 정도가 아니에요. 이 정도의 힘이라면….
    ja: この程度ではありません。この力があれば…
  event_arkguardian2_04_s_51:
    speaker: rapunzel
    en: Let's do it for real this time.
    ko: 이번에야말로.
    ja: 今度こそ。
  event_arkguardian2_04_s_52:
    speaker: commander_op_r
    en: Yes. Let's make it happen. Zero casualties.
    ko: 좋아. 사망자 0명을 목표로 삼고 해보자고.
    ja: よし。目指すは犠牲者ゼロだ。
  event_arkguardian2_04_s_53:
    speaker: rapunzel
    en: You got it!
    ko: 예!
    ja: はい！
  event_arkguardian2_04_s_54:
    speaker: "<Narration>"
    en: A golden glow surges from Rapunzel's staff.
    ko: 라푼젤의 지팡이에서 황금색 빛무리가 뻗어나간다.
    ja: ラプンツェルの杖が黄金の光を放った
  event_arkguardian2_04_s_55:
    speaker: "<Narration>"
    en: It skims through the ranks of Rapture, triggering a series of explosions.
    ko: 랩쳐의 무리를 긁듯 스쳐 지나고, 폭발을 낳는다.
    ja: |-
      光はかすめるようにラプチャーの群れを貫き、
      爆発を起こした
  event_arkguardian2_04_s_56:
    speaker: rapunzel
    en: Did you see that? Our offensive capabilities have skyrocketed as well!
    ko: |-
      보, 보셨나요?
      공격 쪽 출력도 엄청 올라갔어요!
    ja: |-
      み、見ましたか？
      攻撃の出力も大幅に上がっています！
  event_arkguardian2_04_s_57:
    speaker: commander_op_r
    en: Snow White... what exactly did she build?
    ko: "…스노우 화이트 녀석. 뭘 만든 거야 대체."
    ja: |-
      …スノーホワイトめ、
      とんでもないものを仕上げて来たな。
  event_arkguardian2_04_s_59:
    speaker: dorothy_op_l
    en: I should have asked her to make mine first.
    ko: "…저부터 만들어 달라고 할 걸 그랬네요."
    ja: |-
      …私の分を先にするよう
      頼んでおけば良かったですね。
  event_arkguardian2_04_s_60:
    speaker: commander_op_r
    en: Well, maybe you should've been friendlier from the start.
    ko: 그러길래 평소에 좀 친하게 지내지 그랬어.
    ja: だったら、普段からもう少し仲良くしておけ。
  event_arkguardian2_04_s_61:
    speaker: dorothy_op_l
    en: The order of these improvements wasn't based on affinity. I know that much.
    ko: 친밀도로 우선순위가 정해지지 않았다는 것 정도는 알아요.
    ja: |-
      仲の良さで優先順位を決めたわけでは
      ないことくらい、分かります。
  event_arkguardian2_04_s_62:
    speaker: liliweiss_op_c
    en: "*Huff... huff...* Where's Snow White?"
    ko: 허억…! 허억…! 스노우 화이트는?
    ja: はぁ…はぁ…！スノーホワイトは？
  event_arkguardian2_04_s_63:
    speaker: dorothy_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_s_64:
    speaker: dorothy_op_l
    en: She's on her way there.
    ko: 지금 하러 갔어요.
    ja: もう動いています。
  event_arkguardian2_04_s_65:
    speaker: liliweiss_op_c
    en: She'll... *huff...* she'll be okay, right?
    ko: 잘… 후우…! 할 수 있겠지?
    ja: ちゃんと…ふぅ…！できるよね？
  event_arkguardian2_04_s_66:
    speaker: dorothy_op_l
    en: She'll be fine. She was the one who suggested it, after all.
    ko: 본인이 먼저 꺼낸 얘기니까요. 잘하겠죠.
    ja: 自分で言い出したことです。必ず。
  event_arkguardian2_04_s_67:
    speaker: liliweiss_op_c
    en: Maybe we should... *huff...* help her.
    ko: 도와주러 가야 할 것, 후우. 같은데.
    ja: 手伝わなくても…はぁ…大丈夫かな。
  event_arkguardian2_04_s_68:
    speaker: dorothy_op_l
    en: Don't. She can handle it just fine.
    ko: 그만둬요. 충분히 할 수 있어요.
    ja: 任せておきましょう。彼女ならできます。
  event_arkguardian2_04_s_69:
    speaker: commander_op_r
    en: She's right. Now is not the time to worry about that.
    ko: 그래. 지금 그걸 신경 쓸 때가 아니다.
    ja: ああ。今はそちらを気にしている場合じゃない。
  event_arkguardian2_04_s_70:
    speaker: commander_op_r
    en: Storm Bringer has arrived, along with several aerial Raptures.
    ko: 스톰 브링어 및 다수의 공중 병력 확인.
    ja: |-
      ストームブリンガーと
      多数の飛行型が確認された。
  event_arkguardian2_04_s_71:
    speaker: commander_op_r
    en: We've also spotted five mass-produced Heretics.
    ko: 양산형 헬레틱 다섯 기 확인.
    ja: 量産型ヘレティックも5体いる。
  event_arkguardian2_04_s_72:
    speaker: commander_op_r
    en: Even the Raptures that were waiting in the rear are on the move.
    ko: 후방에 대기 중이던 랩쳐 놈들도 움직인다.
    ja: 後ろで様子をうかがっていた奴らも動きだした。
  event_arkguardian2_04_s_73:
    speaker: commander_op_r
    en: They're throwing everything at us.
    ko: 저쪽도 승부수를 던진 모양이군.
    ja: 勝負をしかけてくる気のようだ。
  event_arkguardian2_04_s_74:
    speaker: dorothy_op_l
    en: We're seriously outnumbered.
    ko: 수적 열세가 너무 심하군요.
    ja: 数では圧倒されていますね。
  event_arkguardian2_04_s_75:
    speaker: commander_op_r
    en: So we go big and finish strong.
    ko: 그래서 큰 거 한 방을 노려야지.
    ja: だからこそ、一発逆転を決めるしかない。
  event_arkguardian2_04_s_76:
    speaker: dorothy_op_l
    en: Let's hope Snow White doesn't show up late.
    ko: 스노우 화이트가 늦지 않길 바래야겠네요.
    ja: スノーホワイトが遅れないことを祈りましょう。
  event_arkguardian2_04_s_77:
    speaker: hongryeon_op_l
    en: Pray tell, whither hath Snow White absconded? I have scarcely seen her this
      entire time.
    ko: |-
      그런데 스노우 화이트는 뭘 하러 간 건가?
      처음부터 보이질 않던데.
    ja: |-
      そのスノーホワイトはどこへ行ったのだ？
      最初から居らぬことは知っていたが。
  event_arkguardian2_04_s_78:
    speaker: hongryeon_op_l
    en: Shirking her duty already, is she? Good grief... Youngsters these days are
      most incorrigible.
    ko: |-
      어린 것이 벌써부터 농땡이를 피우는 건가?
      이것 참 요즘 어린 것들은 참.
    ja: |-
      どこかで油を売っているのではあるまいな？
      最近の若い者はだらしがない…
  event_arkguardian2_04_s_79:
    speaker: rapunzel
    en: "... You didn't listen during the mission briefing, did you?"
    ko: "…작전 회의 때 안 들으셨군요."
    ja: "…作戦会議を聞いていなかったようですね。"
  event_arkguardian2_04_s_80:
    speaker: hongryeon_op_l
    en: Of course not. I pay no mind to the words of the weak.
    ko: 그래. 난 나보다 약한 이의 말은 듣지 않으니.
    ja: 何か？私より弱き者の話など聞かぬのでな。
  event_arkguardian2_04_s_81:
    speaker: rapunzel
    en: Snow White... umm...
    ko: 스노우 화이트는… 음….
    ja: スノーホワイトは…ですね…
  event_arkguardian2_04_s_82:
    speaker: commander_op_r
    en: She went to steal something.
    ko: 도둑질하러 갔어.
    ja: かっぱらいに行ったんだ。
  event_arkguardian2_04_s_83:
    speaker: hongryeon_op_l
    en: Thievery? Of what sort?
    ko: 도둑질? 무슨 도둑질?
    ja: かっぱらう？何をだ？
  event_arkguardian2_04_s_84:
    speaker: commander_op_r
    en: A plane.
    ko: 비행기 훔치러.
    ja: 空飛ぶ船を。
  event_arkguardian2_04_s_85:
    speaker: hongryeon_op_l
    en: Excuse me?
    ko: "…뭐?"
    ja: "…何？"
  event_arkguardian2_04_s_86:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠우우우우---
    ja: ゴオオオオ――
  event_arkguardian2_04_s_87:
    speaker: "<Narration>"
    en: The hum of a massive engine comes rolling in,
    ko: 거대한 엔진음이 들려온다.
    ja: 上からエンジン音が響いた
  event_arkguardian2_04_s_88:
    speaker: "<Narration>"
    en: and Scarlet looks up toward the sky.
    ko: 홍련은 하늘을 올려다보았다.
    ja: 紅蓮は空を見上げた
  event_arkguardian2_04_s_89:
    speaker: hongryeon_op_l
    en: The Wings of Victory...!
    ko: "…승리의 날개 호…!"
    ja: 勝利の翼号…！
  event_arkguardian2_04_s_90:
    speaker: snowwhite_o_op_r
    en: Snow White and the Wings of Victory, reporting in!
    ko: 스노우 화이트! 승리의 날개 호! 합류합니다!
    ja: |-
      スノーホワイトおよび、勝利の翼号！
      合流します！
  event_arkguardian2_04_s_91:
    speaker: commander_op_r
    en: Wipe them out.
    ko: 몽땅 쓸어버려.
    ja: 敵を一掃しろ！
  event_arkguardian2_04_s_92:
    speaker: snowwhite_o_op_r
    en: Roger that!
    ko: 예!
    ja: はい！
  event_arkguardian2_04_s_93:
    speaker: "<Narration>"
    en: The main cannon of the Wings of Victory fires.
    ko: 승리의 날개 호의 주포가 발사된다.
    ja: 勝利の翼号の主砲が光を放った
  event_arkguardian2_04_s_94:
    speaker: "<Narration>"
    en: A colossal beam floods the field, leaving nothing in its wake.
    ko: |-
      전장을 가득 메운 거대한 빛줄기는,
      지나간 곳에 아무것도 남기지 않는다.
    ja: |-
      戦場を横切る巨大な光線が
      通り過ぎた場所をなぎ払っていく
  event_arkguardian2_04_s_95:
    speaker: "<Narration>"
    en: It resembles the act of erasing a canvas covered in scribbled pencil lines.
    ko: |-
      연필로 가득 그어진 도화지에,
      지우개질을 한 듯한 모습이다.
    ja: |-
      まるで塗りつぶされた画用紙に、
      消しゴムを滑らせたような痕が残った
  event_arkguardian2_04_s_96:
    speaker: commander_op_r
    en: That's what I'm talking about! Nothing beats our plane.
    ko: 좋아. 성능 죽이는구만. 역시 비행기가 최고야.
    ja: |-
      いいぞ。素晴らしい性能だ。
      やはり空飛ぶ船ほどのロマンはない。
  event_arkguardian2_04_s_97:
    speaker: commander_op_r
    en: Keep firing.
    ko: 계속 쏴, 계속.
    ja: そのままだ、続けろ！
  event_arkguardian2_04_s_98:
    speaker: snowwhite_o_op_r
    en: On it!
    ko: 계속 쏩니다!
    ja: 攻撃を継続します！
  event_arkguardian2_04_s_99:
    speaker: "<Narration>"
    en: The beam slices across the battlefield.
    ko: 전장을 가로지르는 빛줄기.
    ja: 光の筋が戦場を貫く
  event_arkguardian2_04_s_100:
    speaker: "<Narration>"
    en: Liliweiss looks up.
    ko: 릴리바이스는 하늘을 올려다본다.
    ja: リリーバイスは空を見上げた
  event_arkguardian2_04_s_101:
    speaker: "<Narration>"
    en: She wishes that time would stop in this moment.
    ko: 지금 이대로, 시간이 멈췄으면 좋겠다고 생각했다.
    ja: いっそこのまま、時が止まってくれればと願った
event_arkguardian2_04_e:
  event_arkguardian2_04_e_1:
    speaker: commander_op_r
    en: How'd you manage to steal something that big?
    ko: 그런데 어떻게 훔쳤냐 이 큰걸.
    ja: こんなデカブツ、よく盗みだせたな。
  event_arkguardian2_04_e_2:
    speaker: hongryeon_op_l
    en: She did possess a firearm. Mayhap it made the task a simple one.
    ko: 총을 들고 갔으니 쉬웠겠지.
    ja: 銃があるのだ、たやすいことだろう。
  event_arkguardian2_04_e_3:
    speaker: snowwhite_o
    en: Huh? Didn't the Commander give a heads-up in advance?
    ko: 응? 지휘관이 미리 말해놓은 거 아닌가요?
    ja: |-
      あれ？指揮官が話をつけておいて
      くださってたんじゃないんですか？
  event_arkguardian2_04_e_4:
    speaker: commander_op_r
    en: Ownership's split fifty-fifty between V.T.C. and the Central Government,
    ko: 비행기는 V.T.C.랑 중앙 정부 지분이 딱 절반씩이라서 내가 뭐라고 해봤자 씨알도 안 먹혀.
    ja: |-
      所有権はV.T.C.と中央政府が
      5割ずつのはずだ。
      私一人が何を言っても通らないぞ｡
  event_arkguardian2_04_e_5:
    speaker: commander_op_r
    en: so it wouldn't have mattered how I plead.
    ko: 그러니까 방주에 넣는다고 할 때도 아무 말도 못 했지.
    ja: |-
      そのせいでアークに回収すると
      言われた時も､何もできなかったんだ｡
  event_arkguardian2_04_e_6:
    speaker: snowwhite_o
    en: Well... they just let me into the cockpit.
    ko: 어… 그냥 조종석까지 들어가게 해주시던데.
    ja: |-
      え…？普通にブリッジまで
      通してもらえましたけど…
  event_arkguardian2_04_e_7:
    speaker: commander_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_8:
    speaker: commander_op_r
    en: A heist of this magnitude requires teamwork. That means they're on our side.
    ko: 역시 우리 편이야. 도둑질도 손발이 맞아야 할 수 있다는 건 이런 걸 두고 하는 말이겠지.
    ja: |-
      話の分かる奴がいたということだな。
      持つべきものはやはり味方だ。
  event_arkguardian2_04_e_9:
    speaker: rapunzel_op_c
    en: Are you flying that thing all by yourself?
    ko: 그런데 그걸 혼자 조종하시는 건가요?
    ja: 1人で動かせるものなのですか？
  event_arkguardian2_04_e_10:
    speaker: commander_op_r
    en: You didn't know? Snow White played a significant role in designing the aircraft.
    ko: 몰랐냐. 스노우 화이트가 비행기 설계에 엄청 관여했어.
    ja: |-
      知らなかったか？スノーホワイトは
      設計に大きく関わっているからな。
  event_arkguardian2_04_e_11:
    speaker: rapunzel_op_c
    en: What? Really?
    ko: 예? 정말요?
    ja: え？そうだったのですか？
  event_arkguardian2_04_e_12:
    speaker: commander_op_r
    en: Yup. So flying that bird is second nature to her.
    ko: 그래. 그러니 조종 같은 건 누워서 떡 먹기지.
    ja: ああ。一人で操縦するぐらい、訳もないだろう。
  event_arkguardian2_04_e_13:
    speaker: snowwhite_o
    en: Actually, I have some mass-produced Nikkes with me.
    ko: 그… 양산형 분들이 같이 타고 있는데요.
    ja: |-
      いえ…量産型の皆さんに
      協力してもらっているんです。
  event_arkguardian2_04_e_14:
    speaker: snowwhite_o
    en: I can't operate the aircraft by myself.
    ko: 혼자서는 함을 움직일 순 없으니까.
    ja: さすがに1人で動かせるものじゃないですよ。
  event_arkguardian2_04_e_15:
    speaker: commander_op_r
    en: Oh, my bad.
    ko: 아하. 그렇구나.
    ja: ほう、そうだったのか。
  event_arkguardian2_04_e_16:
    speaker: rapunzel_op_c
    en: You speak as if you know everything, yet you are mistaken about every single
      thing.
    ko: 되게 다 아는 것처럼 말씀하셔놓고 맞는 게 하나도 없네요.
    ja: |-
      訳知り顔のわりに、
      先ほどから何も合っていないような…
  event_arkguardian2_04_e_17:
    speaker: commander_op_r
    en: How many are onboard?
    ko: 몇 명이나 같이 탔지?
    ja: 乗っているものは何名いる？
  event_arkguardian2_04_e_18:
    speaker: snowwhite_o
    en: There are about 20 of us, myself included.
    ko: 저 포함해서 20명 정도에요.
    ja: 私も入れて20人ぐらいです。
  event_arkguardian2_04_e_19:
    speaker: commander_op_r
    en: All right then, your mission is to take down 100 of those Raptures each.
    ko: 좋아. 그럼 책임지고 두당 100기씩만 잡자고.
    ja: よし。ならノルマは一人あたり100機だ。
  event_arkguardian2_04_e_20:
    speaker: snowwhite_o
    en: Roger that! We'll do our best!
    ko: 예! 힘내볼게요!
    ja: はい！頑張ります！
  event_arkguardian2_04_e_21:
    speaker: "<Narration>"
    en: As the Wings of Victory joins the battle, the tide begins to change.
    ko: 승리의 날개 호가 참전함으로 전장의 판도가 뒤집히기 시작했다.
    ja: |-
      勝利の翼号が現れたことで、
      戦場の流れが変わり始めた
  event_arkguardian2_04_e_22:
    speaker: "<Narration>"
    en: High-altitude aerial strikes rain down upon the battlefield, sending great
      swathes of Raptures flying.
    ko: |-
      높은 고도에서 지상을 향해 쏟아붓는 공격에,
      랩쳐들이 파죽지세로 쓰러져간다.
    ja: |-
      高空から一方的に打ち下ろされ、
      ラプチャーたちは瞬く間に数を減らしていく
  event_arkguardian2_04_e_23:
    speaker: "<Narration>"
    en: Liliweiss is finally able to catch her breath.
    ko: 릴리바이스는 그제서야 한숨 돌릴 수 있었다.
    ja: リリーバイスにようやく、一息つく間ができた
  event_arkguardian2_04_e_24:
    speaker: "<Narration>"
    en: Her hands shake. Her vision blurs.
    ko: 손이 떨린다. 시야도 흐려진다.
    ja: 手が震え、視界はかすむ
  event_arkguardian2_04_e_25:
    speaker: liliweiss
    en: "... This is happening faster than expected."
    ko: "…빠르네. 생각보다."
    ja: "…早い。思ったより…"
  event_arkguardian2_04_e_26:
    speaker: commander_op_r
    en: Lilith, fall back.
    ko: 릴리스. 복귀해라.
    ja: リリス。戻れ。
  event_arkguardian2_04_e_27:
    speaker: liliweiss
    en: Not yet. Just a little more!
    ko: 아직이요. 조금만 더 하고요.
    ja: まだです。もう少しいけます。
  event_arkguardian2_04_e_28:
    speaker: commander_op_r
    en: If you don't rest now, you won't get another chance. Snow White has helped
      turn the tide.
    ko: |-
      지금 아니면 쉴 기회가 없어.
      스노우 화이트가 분위기를 바꿨다.
    ja: |-
      今を逃せば休めないぞ。
      スノーホワイトが作った時間だ。
  event_arkguardian2_04_e_29:
    speaker: commander_op_r
    en: Hurry back.
    ko: 빨리 와.
    ja: 早く来い。
  event_arkguardian2_04_e_30:
    speaker: liliweiss
    en: "... All right. Just a little more, then."
    ko: "…알겠어요. 그럼 조금만."
    ja: "…分かりました。じゃあ、ちょっとだけ。"
  event_arkguardian2_04_e_31:
    speaker: "<Narration>"
    en: Liliweiss stands beside the Commander.
    ko: 릴리바이스가 지휘관의 옆에 섰다.
    ja: リリーバイスが指揮官の隣に立っている
  event_arkguardian2_04_e_32:
    speaker: liliweiss
    en: I see you still prefer to command outdoors. Though on a day like this, it
      might be wiser to do so indoors, especially in the tower.
    ko: |-
      여전히 야외에서 지휘하는 걸 좋아하네요.
      이런 날은 탑이나 실내에서 하는 게 어때요?
    ja: |-
      相変わらず、外での指揮がお好きですね。
      たまには司令塔や管制室を使ったらどうです？
  event_arkguardian2_04_e_33:
    speaker: commander
    en: Not my style. Where's the fun in that?
    ko: |-
      성미에 안 맞아.
      재미도 없고.
    ja: |-
      性に合わん。
      面白くもないしな。
  event_arkguardian2_04_e_34:
    speaker: liliweiss
    en: That's true.
    ko: 그건 그렇죠.
    ja: それはそうですね。
  event_arkguardian2_04_e_35:
    speaker: commander
    en: Here, clean yourself up.
    ko: 자, 닦아.
    ja: ほら、拭け。
  event_arkguardian2_04_e_36:
    speaker: "<Narration>"
    en: The Commander hands her a towel.
    ko: 지휘관이 타월을 건넨다.
    ja: 指揮官がタオルを差し出した
  event_arkguardian2_04_e_37:
    speaker: "<Narration>"
    en: Liliweiss takes it and wipes her face.
    ko: 릴리바이스가 그것을 받아 들고 얼굴을 닦는다.
    ja: リリーバイスは受け取り、顔をぬぐった
  event_arkguardian2_04_e_38:
    speaker: "<Narration>"
    en: Thick globules of blood stick to the towel.
    ko: 피가 가득 묻어나온다.
    ja: タオルにべったりと赤い跡がついた
  event_arkguardian2_04_e_39:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_40:
    speaker: commander
    en: Rest a bit more before you go. Need some water?
    ko: 좀 더 쉬다가 가. 물 줘?
    ja: 少し休め。水は？
  event_arkguardian2_04_e_41:
    speaker: liliweiss
    en: No, I'm all right.
    ko: 아뇨. 괜찮아요.
    ja: いいえ。大丈夫です。
  event_arkguardian2_04_e_42:
    speaker: liliweiss
    en: You're one to talk. You've got a hole in your side, yet you're playing it
      off like it's nothing.
    ko: 그러는 지휘관이야말로 옆구리에 구멍이 났는데 아무렇지도 않….
    ja: |-
      そういう指揮官こそ、
      脇腹に穴が開いたままなのに、平気な顔で…
  event_arkguardian2_04_e_43:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_44:
    speaker: liliweiss
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  event_arkguardian2_04_e_45:
    speaker: liliweiss
    en: Why are you so pale? And why are you sweating so much?
    ko: 얼굴색이 왜 그래요? 땀은 왜 그렇게 많이 흘리고.
    ja: 顔色、どうしたんですか？それに、すごい汗。
  event_arkguardian2_04_e_46:
    speaker: commander
    en: Had a bit too much to drink last night.
    ko: 어제 술을 좀 퍼먹었더니 그러네.
    ja: 昨日ちょっと飲みすぎたせいだな。
  event_arkguardian2_04_e_47:
    speaker: liliweiss
    en: You never drink before a mission.
    ko: 작전 전에 술 안 마시잖아요.
    ja: 作戦前には飲まないでしょう。
  event_arkguardian2_04_e_48:
    speaker: commander
    en: Felt like letting loose for once.
    ko: 기분 한 번 내봤어.
    ja: 気分を変えたい時もある。
  event_arkguardian2_04_e_49:
    speaker: liliweiss
    en: You're not fully healed, are you?
    ko: "…다 치료된 게 아니군요."
    ja: "…治療、終わってないんですね。"
  event_arkguardian2_04_e_50:
    speaker: commander
    en: I'm all healed, I swear.
    ko: 아닌데. 다 됐는데.
    ja: いや、もう治った。
  event_arkguardian2_04_e_51:
    speaker: liliweiss
    en: You'll end up killing yourself doing this, Commander.
    ko: 지휘관. 죽어요.
    ja: 指揮官。死にますよ。
  event_arkguardian2_04_e_52:
    speaker: liliweiss
    en: You planning to die with me?
    ko: 저랑 같이 죽게요?
    ja: 私と一緒に死ぬ気ですか？
  event_arkguardian2_04_e_53:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_54:
    speaker: commander
    en: Wouldn't be the worst way to go.
    ko: 나쁘지 않겠지.
    ja: それも悪くないな。
  event_arkguardian2_04_e_55:
    speaker: liliweiss
    en: The girls need someone to lead them.
    ko: 저 아이들한테는 지휘관이 필요해요.
    ja: あの子たちには指揮官が必要です。
  event_arkguardian2_04_e_56:
    speaker: commander
    en: "... No. They don't."
    ko: 아냐. 아니야.
    ja: いや、そんなことはないさ。
  event_arkguardian2_04_e_57:
    speaker: commander
    en: Open your eyes, Lilith. They don't need us anymore.
    ko: |-
      잘 봐 릴리스.
      저 녀석들은 이제 우리가 없어도 돼.
    ja: |-
      よく見ろ、リリス。
      あいつらはもう、私たちがいなくても大丈夫だ。
  event_arkguardian2_04_e_58:
    speaker: "<Narration>"
    en: Liliweiss looks across the battlefield.
    ko: 전장을 바라보는 릴리바이스.
    ja: リリーバイスが戦場を見つめた
  event_arkguardian2_04_e_59:
    speaker: "<Narration>"
    en: Each of them is valiantly holding their position.
    ko: 각자가, 각자의 위치에서 훌륭하게 싸워나가고 있다.
    ja: それぞれが持ち場を守り、堂々と戦っている
  event_arkguardian2_04_e_60:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_61:
    speaker: commander
    en: They're pretty good, right? We did a good job raising them.
    ko: 어때? 잘하지? 우리가 키운 거야.
    ja: どうだ？立派だろう？私たちで育てたんだ。
  event_arkguardian2_04_e_62:
    speaker: liliweiss
    en: They are still just kids to me.
    ko: 아직… 제 눈엔 아이들일 뿐이에요.
    ja: 私からしたら…みんな、まだ子どもです。
  event_arkguardian2_04_e_63:
    speaker: commander
    en: Heh. You sound so arrogant.
    ko: 흥. 오만하기는.
    ja: ふっ。傲慢だな。
  event_arkguardian2_04_e_64:
    speaker: liliweiss
    en: Commander, go and get treated!
    ko: "…지휘관. 치료를 받아요."
    ja: "…指揮官。治療を受けてください。"
  event_arkguardian2_04_e_65:
    speaker: commander
    en: I'm fine. It'll take more than this to take me out.
    ko: 됐어. 죽기야 하겠어.
    ja: 平気だ。死にはしない。
  event_arkguardian2_04_e_66:
    speaker: liliweiss
    en: You'll die!
    ko: 죽는다고요!
    ja: 死にます！
  event_arkguardian2_04_e_67:
    speaker: commander
    en: Blerrgh!
    ko: 우욱…!
    ja: うっ…！
  event_arkguardian2_04_e_68:
    speaker: "<Narration>"
    en: The Commander retches.
    ko: 지휘관이 토한다.
    ja: 指揮官が嘔吐した
  event_arkguardian2_04_e_69:
    speaker: liliweiss
    en: Commander!
    ko: "…지휘관."
    ja: "…指揮官。"
  event_arkguardian2_04_e_70:
    speaker: commander
    en: "*Cough cough* Don't shout in my ear. It upsets my stomach."
    ko: 쿨럭, 쿨럭! 거 왜 옆에서 소리를 지르고 그래. 내장이 놀랐잖아.
    ja: |-
      ゲホッ、ゲホッ…！耳元で大声を出すな。
      内臓がビックリしただろう？
  event_arkguardian2_04_e_71:
    speaker: liliweiss
    en: You need to get treated. You have to live!
    ko: 지휘관은 살아야 해요. 치료를 받아요.
    ja: |-
      指揮官は生きなければならない方です。
      治療を受けてください。
  event_arkguardian2_04_e_72:
    speaker: commander
    en: I will. After this fight.
    ko: "…그래. 이번 전투만 끝나고."
    ja: "…ああ。この戦いが終わったらな。"
  event_arkguardian2_04_e_73:
    speaker: liliweiss
    en: No. Right now.
    ko: 지금 당장 받으라고요.
    ja: いいえ。今すぐ。
  event_arkguardian2_04_e_74:
    speaker: commander
    en: Don't lecture me.
    ko: 남 말하지 마라.
    ja: お前には言われたくない。
  event_arkguardian2_04_e_75:
    speaker: commander
    en: You're the one dragging yourself into this fight because you refuse to miss
      out on the fun.
    ko: 이 멋진 전투를 놓치기 싫어서 꾸역꾸역 싸우고 있는 주제에, 누구한테 잔소리야?
    ja: |-
      戦場に未練たらたらで、
      無理して戦い続けてるくせに、
      どの口が言うんだ。
  event_arkguardian2_04_e_76:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_77:
    speaker: commander
    en: I'm not dying.
    ko: 난 안 죽는다.
    ja: 私は死なない。
  event_arkguardian2_04_e_78:
    speaker: commander
    en: I'm going with all of you to the Ark,
    ko: 살아서, 너희들과 방주로 간다.
    ja: 生きて、君たちとアークへ凱旋する。
  event_arkguardian2_04_e_79:
    speaker: commander
    en: and I'll have one hell of a glorious life there.
    ko: 가서, 남은 여생을 죽여주게 멋지게 보낼 거야.
    ja: そうして、素晴らしい余生を過ごすんだ。
  event_arkguardian2_04_e_80:
    speaker: commander
    en: We all will.
    ko: 다 같이.
    ja: みんなで一緒にな。
  event_arkguardian2_04_e_81:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_82:
    speaker: liliweiss
    en: Yes, let's do so. Promise?
    ko: 예. 꼭 그래요. 약속해요.
    ja: はい、必ず。約束です。
  event_arkguardian2_04_e_83:
    speaker: commander
    en: I promise.
    ko: 그래. 약속하지.
    ja: ああ。約束だ。
  event_arkguardian2_04_e_84:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_04_e_85:
    speaker: "<Narration>"
    en: Liliweiss straightens her clothes,
    ko: 릴리바이스가 옷매무새를 다듬는다.
    ja: リリーバイスがえりを正した
  event_arkguardian2_04_e_86:
    speaker: "<Narration>"
    en: pulls on her gloves, and fixes her hair.
    ko: 장갑을 고쳐 끼고, 머리를 정돈한다.
    ja: 手袋を着けなおし、髪も整えた
  event_arkguardian2_04_e_87:
    speaker: liliweiss
    en: I'm heading out.
    ko: 갈게요.
    ja: 行ってきます。
  event_arkguardian2_04_e_88:
    speaker: commander
    en: Be careful.
    ko: 고생해라.
    ja: 頑張ってこい。
  event_arkguardian2_04_e_89:
    speaker: "<Narration>"
    en: Liliweiss runs,
    ko: 릴리바이스가 달려간다.
    ja: リリーバイスが駆けていく
  event_arkguardian2_04_e_90:
    speaker: "<Narration>"
    en: and the Commander watches her dazedly.
    ko: 지휘관은 그 모습을 멍하니 바라본다.
    ja: 指揮官はその後ろ姿を静かに見送った
  event_arkguardian2_04_e_91:
    speaker: rapunzel_op_r
    en: Snow White! The Storm Bringers are heading your way!
    ko: |-
      스노우 화이트!
      스톰 브링어들이 그쪽으로 가요!
    ja: |-
      スノーホワイト！
      ストームブリンガーの大群が向かっています！
  event_arkguardian2_04_e_92:
    speaker: snowwhite_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_04_e_93:
    speaker: dorothy_op_r
    en: I'm picking up over 20 units! I don't care if you're inside Wings of Victory.
      Retreat!
    ko: |-
      20기 이상이라고요…!?
      퇴각해요! 제아무리 승리의 날개 호라고 해도…!
    ja: |-
      20機以上…！？
      後退してください！いくら勝利の翼号でも…！
  event_arkguardian2_04_e_94:
    speaker: "<Narration>"
    en: "*Boooooom*"
    ko: 콰아아앙---
    ja: ドカン――
  event_arkguardian2_04_e_95:
    speaker: "<Narration>"
    en: The hull shudders violently.
    ko: 선체가 크게 흔들린다.
    ja: 船体が大きく揺らいだ
  event_arkguardian2_04_e_96:
    speaker: "<Narration>"
    en: A swarm of Storm Bringers surrounds the Wings of Victory.
    ko: 스톰 브링어의 무리가 승리의 날개 호를 둘러싸고 있다.
    ja: |-
      勝利の翼号がストームブリンガーの群れに
      取り囲まれた
  event_arkguardian2_04_e_97:
    speaker: snowwhite_o
    en: Aaaaah!
    ko: 히, 히이…!
    ja: ひ、ひぃ…！
  event_arkguardian2_04_e_98:
    speaker: hongryeon_op_l
    en: Ye cowardly Raptures! Come forth and face me, one to one!
    ko: 이 비겁한 랩쳐 놈들! 1대 1로 싸워라!!
    ja: 卑劣なラプチャーどもめ！1対1で来い！！
  event_arkguardian2_04_e_99:
    speaker: dorothy_op_r
    en: Snow White! Retreat!
    ko: 스노우 화이트! 퇴각!
    ja: スノーホワイト！後退を！
  event_arkguardian2_04_e_100:
    speaker: rapunzel_op_r
    en: Escape!
    ko: 도망가요!
    ja: 下がってください！
  event_arkguardian2_04_e_101:
    speaker: snowwhite_o
    en: E-escape...!
    ko: 도, 도망…!
    ja: に、逃げ…！
  event_arkguardian2_04_e_102:
    speaker: snowwhite_o
    en: "!!"
    ko: "……!!"
    ja: "……！！"
  event_arkguardian2_04_e_103:
    speaker: snowwhite_o
    en: I... I'll lure the Storm Bringers away from the field!
    ko: 이, 이대로 스톰 브링어들을 붙인 채 전장에서 벗어날게요!
    ja: |-
      このままストームブリンガーを引き付けて、
      戦場から離脱します！
  event_arkguardian2_04_e_104:
    speaker: dorothy_op_r
    en: What are you talking about?!
    ko: 무슨 소리예요!
    ja: 何を言っているのです！？
  event_arkguardian2_04_e_105:
    speaker: snowwhite_o
    en: If... if the Storm Bringers stay here, we'll be at a major disadvantage!
    ko: 스, 스톰! 스톰 브링어가 전장에 있으면 우리, 우리가 너무 불리해요!
    ja: |-
      で…でも！ストームブリンガーを
      戦場から引きはがさないと、
      こちらが一方的に不利になります！
  event_arkguardian2_04_e_106:
    speaker: snowwhite_o
    en: I-I... We... We'll take them all out!
    ko: 제, 제가! 저희가! 모두 치워버릴게요!
    ja: わ、私が！私たちで…！一掃します！
  event_arkguardian2_04_e_107:
    speaker: hongryeon_op_l
    en: Art thou seeking to perish alongside them? What madness is this?
    ko: 같이 죽겠다는 건가! 무슨 짓거리인가!
    ja: 刺し違える気か！？無茶な真似はよせ！
  event_arkguardian2_04_e_108:
    speaker: liliweiss_op_l
    en: Wait for me! I'm coming!
    ko: 내가 갈게! 기다려!
    ja: 私が行く！待ってて！
  event_arkguardian2_04_e_109:
    speaker: snowwhite_o
    en: Don't!
    ko: 오지 마요!
    ja: 来ないでください！
  event_arkguardian2_04_e_110:
    speaker: liliweiss_op_l
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arkguardian2_04_e_111:
    speaker: snowwhite_o
    en: I'll come back! Don't worry!
    ko: 반드시 돌아갈게요! 걱정마요!
    ja: 必ず戻ります！心配しないでください！
  event_arkguardian2_04_e_112:
    speaker: snowwhite_o
    en: I promise!
    ko: 꼭! 돌아갈게요!
    ja: 絶対に！戻りますから！
  event_arkguardian2_04_e_113:
    speaker: liliweiss_op_l
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_04_e_114:
    speaker: "<Narration>"
    en: Snow White shouts into the bridge's communication device.
    ko: 스노우 화이트가 브릿지의 통신 기기에 대고 소리친다.
    ja: |-
      スノーホワイトが
      ブリッジの通信機器に向かって叫んだ
  event_arkguardian2_04_e_115:
    speaker: snowwhite_o
    en: Full speed ahead!
    ko: 전속 전진!
    ja: 全速前進！
  event_arkguardian2_04_e_116:
    speaker: snowwhite_o
    en: I'm sorry, everyone.
    ko: 여러분! 죄송합니다!
    ja: みなさん！ごめんなさい！
  event_arkguardian2_04_e_117:
    speaker: snowwhite_o
    en: But you'll have to trust me.
    ko: 저와 함께 목숨을 걸어주세요!
    ja: 私と一緒に、命をかけてください！
  event_arkguardian2_04_e_118:
    speaker: "<Narration>"
    en: Flames erupt from the engines of the Wings of Victory.
    ko: 승리의 날개 호의 엔진이 불을 내뿜는다.
    ja: 勝利の翼号のエンジンが火を噴いた
  event_arkguardian2_04_e_119:
    speaker: "<Narration>"
    en: The aircraft opens fire on the Storm Bringer swarm and begins to pull away
      from the defense line.
    ko: |-
      승리의 날개 호는 스톰 브링어의 무리를 향해 공격을 시작하며,
      전선을 이탈하기 시작했다.
    ja: |-
      ストームブリンガーの群れに攻撃をしかけた
      勝利の翼号は、戦線から離れ始めた
  event_arkguardian2_04_e_120:
    speaker: "<Narration>"
    en: And then,
    ko: 그리고
    ja: それから間もなく…
  event_arkguardian2_04_e_121:
    speaker: "<Narration>"
    en: it vanishes beyond the horizon.
    ko: 곧 지평선 너머로 사라졌다.
    ja: 艦影は地平線の彼方に消えた
  event_arkguardian2_04_e_122:
    speaker: liliweiss_op_l
    en: Snow White!
    ko: 스노우 화이트…!
    ja: スノーホワイト…！
event_arkguardian2_05_s:
  event_arkguardian2_05_s_1:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두---!!
    ja: ダダダダン――
  event_arkguardian2_05_s_2:
    speaker: "<Narration>"
    en: Gunfire rings out.
    ko: 총성이 들린다.
    ja: 銃声が聞こえた
  event_arkguardian2_05_s_3:
    speaker: "<Narration>"
    en: Snow White opens her eyes.
    ko: 스노우 화이트는 감았던 눈을 떴다.
    ja: スノーホワイトは目を開いた
  event_arkguardian2_05_s_4:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두---!!
    ja: ダダダダッ――
  event_arkguardian2_05_s_5:
    speaker: "<Narration>"
    en: "*Clink clink*"
    ko: 타닥, 타닥.
    ja: パチ、パチ…
  event_arkguardian2_05_s_6:
    speaker: "<Narration>"
    en: Amid the gunfire, something sizzles.
    ko: 총성과 함께 뭔가가 타는 소리가 들린다.
    ja: 銃声にまぎれて、何かが燃える音もする
  event_arkguardian2_05_s_7:
    speaker: "<Narration>"
    en: Snow White pushes herself up.
    ko: 스노우 화이트는 몸을 일으킨다.
    ja: スノーホワイトは身体を起こそうとした
  event_arkguardian2_05_s_8:
    speaker: "<Narration>"
    en: Her body feels heavy, as if something is weighing her down.
    ko: 몸이 무겁다. 몸 위를 뭔가 짓누르고 있다는 것을 느낀다.
    ja: |-
      身体が重い。
      何かに押さえつけられているようだ
  event_arkguardian2_05_s_9:
    speaker: "<Narration>"
    en: She pulls herself up with effort.
    ko: 힘을 줘 몸을 일으킨다.
    ja: 力を入れ直し、体を起こした
  event_arkguardian2_05_s_10:
    speaker: "<Narration>"
    en: "*Thud* *Thump*"
    ko: 쿵! 쿠웅!
    ja: ズシャッ！ドスン――
  event_arkguardian2_05_s_11:
    speaker: "<Narration>"
    en: What covered her body falls to the ground.
    ko: 몸 위를 덮고 있던 것들이 바닥에 떨어진다.
    ja: 覆いかぶさっていた何かが転がった
  event_arkguardian2_05_s_12:
    speaker: "<Narration>"
    en: They are Nikkes, battered to a wreck.
    ko: 만신창이가 된 니케들이다.
    ja: ボロボロになったニケの残骸だ
  event_arkguardian2_05_s_13:
    speaker: snowwhite_o
    en: "*Gasp*"
    ko: 허억…!
    ja: ひっ…！
  event_arkguardian2_05_s_14:
    speaker: "<Narration>"
    en: Their backs are a complete mess.
    ko: 등이 엉망이다.
    ja: 背中が原型を留めていない
  event_arkguardian2_05_s_15:
    speaker: "<Narration>"
    en: There is no doubt that they died while shielding her.
    ko: 분명, 나를 감싸다 죽었을 것이다.
    ja: 自分をかばって死んだのだろう
  event_arkguardian2_05_s_16:
    speaker: "<Narration>"
    en: Snow White turns her head.
    ko: 고개를 돌린다.
    ja: 後ろを振り返った
  event_arkguardian2_05_s_17:
    speaker: "<Narration>"
    en: The Wings of Victory, once the pride of the Goddess Squad,
    ko: 한때, 갓데스 스쿼드의 발이 되어주고
    ja: かつて、ゴッデス部隊の頼れる足だったものが…
  event_arkguardian2_05_s_18:
    speaker: "<Narration>"
    en: and ruler of the skies, has crashed.
    ko: 하늘을 지배하던 승리의 날개 호가 추락해있다.
    ja: |-
      思いのままに空を駆けていた、
      勝利の翼号が墜落している
  event_arkguardian2_05_s_19:
    speaker: "<Narration>"
    en: It's nothing more than a flaming pile of wreckage.
    ko: 곳곳이 망가지고 불타고 있다.
    ja: あちこちが破壊され、炎上していた
  event_arkguardian2_05_s_20:
    speaker: snowwhite_o
    en: No...
    ko: 아… 아아…!
    ja: あ…ああ…！
  event_arkguardian2_05_s_21:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두---!!
    ja: ダダダダッ――
  event_arkguardian2_05_s_22:
    speaker: "<Narration>"
    en: She turns her head again.
    ko: 고개를 돌린다.
    ja: 銃声に振り向いた
  event_arkguardian2_05_s_23:
    speaker: "<Narration>"
    en: The mass-produced Nikkes are firing straight ahead.
    ko: 양산형 니케들이 정면을 향해 총을 쏘고 있다.
    ja: 量産型ニケが正面で戦闘を続けていた
  event_arkguardian2_05_s_24:
    speaker: "<Narration>"
    en: The Raptures are swarming in.
    ko: 랩쳐들이 몰려오고 있다.
    ja: ラプチャーの群れが殺到している
  event_arkguardian2_05_s_25:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두---!!
    ja: ダダダダッ――！！
  event_arkguardian2_05_s_26:
    speaker: "<Narration>"
    en: "*Clink clink*"
    ko: 틱. 틱.
    ja: カチ、カチッ…
  event_arkguardian2_05_s_27:
    speaker: "<Narration>"
    en: Shells fall to the ground.
    ko: 탄환이 떨어진다.
    ja: 弾丸切れだ
  event_arkguardian2_05_s_28:
    speaker: "<Narration>"
    en: One mass-produced Nikke looks at Snow White while taking aim.
    ko: 사격 중이던 양산형 니케 한 명이 스노우 화이트를 바라본다.
    ja: |-
      戦っていた量産型ニケが
      スノーホワイトに気づいた
  event_arkguardian2_05_s_29:
    speaker: "<Narration>"
    en: She gives a wry smile and nods,
    ko: 씨익 웃으면서 고개를 끄덕인다.
    ja: そのニケはにこりと笑い、うなずいた
  event_arkguardian2_05_s_30:
    speaker: "<Narration>"
    en: right as a Rapture's beam cannon decapitates her.
    ko: 그리고 랩쳐의 빔 포에 머리가 날아간다.
    ja: |-
      次の瞬間、ラプチャーのビーム砲が
      彼女の頭を吹き飛ばした
  event_arkguardian2_05_s_31:
    speaker: "<Narration>"
    en: "*Whoosh whoosh*"
    ko: 푸슝-! 푸슝-!
    ja: バシュン！バシュン！
  event_arkguardian2_05_s_32:
    speaker: "<Narration>"
    en: Everyone collapses soon after.
    ko: 모두가 쓰러진다.
    ja: すでに立っている者は誰もいない
  event_arkguardian2_05_s_33:
    speaker: "<Narration>"
    en: Snow White watches the Raptures as they close in.
    ko: 스노우 화이트는 다가오고 있는 랩쳐의 무리를 바라본다.
    ja: |-
      スノーホワイトの目に
      押し寄せるラプチャーの群れが映った
  event_arkguardian2_05_s_34:
    speaker: snowwhite_o
    en: No... no!
    ko: 하아…! 하아…!
    ja: はぁ…！はぁ…！
  event_arkguardian2_05_s_35:
    speaker: "<Narration>"
    en: She raises her weapon with shaking hands. The muzzle wavers.
    ko: 무기를 든다. 손이 떨린다. 총구가 흔들린다.
    ja: 武器を取る手は震え、銃口が揺れる
  event_arkguardian2_05_s_36:
    speaker: "<Narration>"
    en: "*Rat-a-tat-tat-tat*"
    ko: 투두두두두---!!
    ja: ダダダダッ――！！
  event_arkguardian2_05_s_37:
    speaker: "<Narration>"
    en: Every round goes wide.
    ko: 모든 탄환이 빗나간다.
    ja: 弾丸は一つも当たらなかった
  event_arkguardian2_05_s_38:
    speaker: "<Narration>"
    en: Her comrades have fallen.
    ko: 쓰러진 동료들.
    ja: 倒れ伏した仲間たち
  event_arkguardian2_05_s_39:
    speaker: "<Narration>"
    en: The Wings of Victory lies in ruins.
    ko: 추락한 승리의 날개 호.
    ja: 落ちた勝利の翼
  event_arkguardian2_05_s_40:
    speaker: "<Narration>"
    en: Her own body is in tatters.
    ko: 만신창이가 된 몸.
    ja: 傷だらけの身体
  event_arkguardian2_05_s_41:
    speaker: "<Narration>"
    en: The field is so densely packed with Raptures, they blot out everything else.
    ko: 풍경이 보이지 않을 정도로 가득한 랩쳐.
    ja: 視界の全てが塞がれるほど大量のラプチャー
  event_arkguardian2_05_s_42:
    speaker: liliweiss_op_r
    en: Snow White! Snow White!
    ko: 스노우 화이트! 스노우 화이트!
    ja: スノーホワイト！スノーホワイト！
  event_arkguardian2_05_s_43:
    speaker: snowwhite_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_05_s_44:
    speaker: dorothy_op_r
    en: Come in, Snow White!
    ko: 응답해요! 스노우 화이트!
    ja: 応答してください！スノーホワイト！
  event_arkguardian2_05_s_45:
    speaker: snowwhite_o
    en: I... I'm... now...!
    ko: 저, 저는 지금…!
    ja: わ、私は今…！
  event_arkguardian2_05_s_46:
    speaker: liliweiss_op_r
    en: Just tell me where to go—urgh!
    ko: 내가 갈게! 위치만 알려… 커흑!!
    ja: 私が行くから！位置を教え…ゲホッ！！
  event_arkguardian2_05_s_47:
    speaker: rapunzel_op_r
    en: Li-Lilith!
    ko: 리, 릴리스!
    ja: リ、リリス！
  event_arkguardian2_05_s_48:
    speaker: liliweiss_op_r
    en: I'm... fine! It's just a little blood—urgh!
    ko: 크흐윽…! 괜찮… 아! 피를 토한 것 뿌… 크학!
    ja: |-
      クッ…！だいじょ…ぶ！
      ちょっと血を吐いただけ…ゲホッ！
  event_arkguardian2_05_s_49:
    speaker: rapunzel_op_r
    en: Commander! Commander! Lilith is...
    ko: 지휘관! 지휘관! 릴리스가…!
    ja: 指揮官！指揮官！リリスが…！
  event_arkguardian2_05_s_50:
    speaker: dorothy_op_r
    en: Commander! Come in!
    ko: 지휘관! 응답해요!
    ja: 指揮官！応答してください！
  event_arkguardian2_05_s_51:
    speaker: hongryeon_op_r
    en: We have heard naught from him for some time now!
    ko: 좀 전부터 연락이 되지 않네!
    ja: さきほどから連絡がつかぬ！
  event_arkguardian2_05_s_52:
    speaker: dorothy_op_r
    en: Damn it!
    ko: 이런…!
    ja: そんな…！
  event_arkguardian2_05_s_53:
    speaker: liliweiss_op_r
    en: I'm... I'm fine, really. Don't... worry...
    ko: 크… 아아…! 괜찮, 괜찮으니까, 걱, 정…!
    ja: |-
      クッ…ううっ…！だいじょ…
      大丈夫だから、安心し…！
  event_arkguardian2_05_s_54:
    speaker: dorothy_op_r
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_05_s_55:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_s_56:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕-!
    ja: バン――！
  event_arkguardian2_05_s_57:
    speaker: "<Narration>"
    en: Snow White shoots the communication device and destroys it.
    ko: 스노우 화이트가 통신기기를 쏴서 부순다.
    ja: スノーホワイトは通信機を撃ち抜いた
  event_arkguardian2_05_s_58:
    speaker: "<Narration>"
    en: She looks at the oncoming Raptures.
    ko: 다가오는 랩쳐들을 본다.
    ja: そして、押し寄せるラプチャーをにらんだ
  event_arkguardian2_05_s_59:
    speaker: snowwhite_o
    en: "... I have to do this."
    ko: "…내가 해야 해."
    ja: "…私がやるしかない。"
  event_arkguardian2_05_s_60:
    speaker: snowwhite_o
    en: I'm a Goddess. I have to do this.
    ko: 갓데스인 내가. 해야 해.
    ja: 私はゴッデスなんだ。やるしかない…
  event_arkguardian2_05_s_61:
    speaker: snowwhite_o
    en: But I'm scared. Very scared.
    ko: 하지만 무서워. 너무 무서워.
    ja: でも…怖い。怖くてたまらない。
  event_arkguardian2_05_s_62:
    speaker: snowwhite_o
    en: What should I do? What can I possibly do?
    ko: 어떻게 해야 할까. 내가 뭘 어떻게 할 수 있을까.
    ja: どうすればいい？私に何ができる？
  event_arkguardian2_05_s_63:
    speaker: snowwhite_o
    en: I'm scared. Lilith... Red Hood... save me. I'm right here.
    ko: 무섭다. 언니. 레드 후드. 살려줘요. 나 여기 있어요.
    ja: |-
      怖いよ…お姉ちゃん、レッドフード…
      助けて、私はここ…
  event_arkguardian2_05_s_64:
    speaker: snowwhite_o
    en: No, don't come. Leave this to me.
    ko: 아니야. 오지 마요. 여긴 나한테 맡겨요 언니.
    ja: |-
      ううん、やっぱり来ないでください。
      お姉ちゃん、ここは私に任せて…
  event_arkguardian2_05_s_65:
    speaker: snowwhite_o
    en: I...
    ko: 아아….
    ja: ああ…
  event_arkguardian2_05_s_66:
    speaker: snowwhite_o
    en: I want to run...
    ko: 도망… 가고 싶… 어….
    ja: 逃げ出したい…ここから…でも…
  event_arkguardian2_05_s_67:
    speaker: snowwhite_o
    en: But I can't.
    ko: 하지만 도망갈 순 없어.
    ja: でも、逃げるわけにはいかない。
  event_arkguardian2_05_s_68:
    speaker: snowwhite_o
    en: Everyone's fighting. Lilith is fighting.
    ko: 모두가 싸우고 있어. 릴리스 언니가 싸우고 있어.
    ja: |-
      みんなが戦ってる…
      リリスお姉ちゃんが戦ってる…
  event_arkguardian2_05_s_69:
    speaker: snowwhite_o
    en: I have to do this. I have to.
    ko: 내가 해야 해. 내가. 내가.
    ja: 私がやるんだ、自分が、私が…
  event_arkguardian2_05_s_70:
    speaker: snowwhite_o
    en: I have to fight.
    ko: 내가.
    ja: 私が…
  event_arkguardian2_05_s_71:
    speaker: liliweiss
    en: You've got to do this on your own. You're a Goddess, aren't you?
    ko: 혼자서 해내야지. 갓데스잖아?
    ja: 一人でできるよね。ゴッデスの一員でしょ？
  event_arkguardian2_05_s_72:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_s_73:
    speaker: snowwhite_o
    en: Even if I'm forsaken,
    ko: 나를 버리더라도.
    ja: たとえ自分を捨ててでも
  event_arkguardian2_05_s_74:
    speaker: snowwhite_o
    en: it has to be me.
    ko: 내가.
    ja: 私が…
  event_arkguardian2_05_s_75:
    speaker: snowwhite_o
    en: I have to do this.
    ko: 해야 해.
    ja: やるしかない。
event_arkguardian2_05_e:
  event_arkguardian2_05_e_1:
    speaker: "<Narration>"
    en: Mind Switch.
    ko: 사고 전환.
    ja: 思考転換――
  event_arkguardian2_05_e_2:
    speaker: "<Narration>"
    en: It is said that a Nikke's mind breaks under extreme stress.
    ko: 극도의 스트레스를 받은 니케의 머리가 망가지는 것이라고 알려져 있지만.
    ja: |-
      それは極度のストレスを受けた
      脳の機能を崩壊させる現象として知られている
  event_arkguardian2_05_e_3:
    speaker: "<Narration>"
    en: In reality, it is NIMPH reorganizing the brain's data and emotions to escape
      an extreme situation.
    ko: 실상은 극한의 상황에서 벗어나기 위해 NIMPH가 뇌의 정보와 감정을 재조립하는 것이다.
    ja: |-
      だがその実態は、極限状態から解放されるための
      NIMPHによる脳内の情報や感情の再構築である
  event_arkguardian2_05_e_4:
    speaker: "<Narration>"
    en: It analyzes the influx of inputs and rearranges them solely to escape the
      current situation.
    ko: NIMPH에 입력된 수많은 정보와 감정을 검색해, 해당 상황을 벗어나기 위한 것으로만 재배치한다.
    ja: |-
      NIMPHは記憶された数々の情報や感情から、
      極限状態の脱出に有用なものだけを
      検索し、整理する
  event_arkguardian2_05_e_5:
    speaker: "<Narration>"
    en: It discards what is deemed useless and preserves what is needed, amplifying
      it.
    ko: 필요 없는 것은 버리고, 필요한 것은 보존하여 극대화한다.
    ja: |-
      そして不必要な情報は消去され、
      必要な情報だけが保持・強化される
  event_arkguardian2_05_e_6:
    speaker: "<Narration>"
    en: This process results in garbled data, leaving most in a state akin to madness.
    ko: 이 과정에서 정보가 꼬여, 대부분은 광인과 다름없는 모습이 되지만.
    ja: |-
      この過程で発生する情報の歪みにより
      たいていの場合、思考転換したニケは
      狂人同然となり果てる
  event_arkguardian2_05_e_7:
    speaker: "<Narration>"
    en: However, in rare cases, the rearranged data miraculously clicks into place.
    ko: 극히 일부, 재배치된 정보가 기적적으로 아귀가 맞아떨어지는 경우가 있다.
    ja: |-
      しかしごくまれに、再配置された情報が
      奇跡的に「噛み合う」事例が存在する
  event_arkguardian2_05_e_8:
    speaker: "<Narration>"
    en: Snow White is one of those rare few Nikkes.
    ko: 스노우 화이트는 그 극히 일부에 속한 니케였다.
    ja: |-
      果たして、スノーホワイトは…
      その奇跡の事例にあたるニケであった
  event_arkguardian2_05_e_9:
    speaker: snowwhite_o
    en: Aaarrghhh! My... head...!
    ko: 아… 윽…! 머리… 가…!
    ja: ああ…うっ…！頭…が…！
  event_arkguardian2_05_e_10:
    speaker: "<Narration>"
    en: The data in her head reassembles.
    ko: 머릿속 정보가 재조립된다.
    ja: 頭の中の情報が、再構築されてゆく
  event_arkguardian2_05_e_11:
    speaker: "<Narration>"
    en: Information on how to kill Raptures.
    ko: 랩쳐를 죽이는 방법에 대한 정보.
    ja: ラプチャーの倒し方
  event_arkguardian2_05_e_12:
    speaker: "<Narration>"
    en: Something she requires now.
    ko: 지금 상황에서 가장 필요한 정보다.
    ja: 現在の状況で最重要
  event_arkguardian2_05_e_13:
    speaker: "<Narration>"
    en: This information is retained and amplified.
    ko: 남긴다. 동시에 극대화한다.
    ja: 保持、さらに極限まで強化
  event_arkguardian2_05_e_14:
    speaker: "<Narration>"
    en: Information on combat techniques.
    ko: 전투 기술에 대한 정보.
    ja: 戦闘技術に関する情報
  event_arkguardian2_05_e_15:
    speaker: "<Narration>"
    en: Also essential at this moment.
    ko: 지금 상황에서 가장 필요한 정보다.
    ja: 現在の状況で最重要
  event_arkguardian2_05_e_16:
    speaker: "<Narration>"
    en: She keeps it and amplifies it.
    ko: 남긴다. 동시에 극대화한다.
    ja: 保持、さらに極限まで強化
  event_arkguardian2_05_e_17:
    speaker: "<Narration>"
    en: Information on weapons fabrication and modification.
    ko: 제작 및 개조에 대한 정보.
    ja: 武器製造、改造の知識
  event_arkguardian2_05_e_18:
    speaker: "<Narration>"
    en: Useful for improvisation and future fights.
    ko: 임기응변 및 향후 전투에서 매우 유의미하다.
    ja: 状況次第だが今後の戦闘にも有用
  event_arkguardian2_05_e_19:
    speaker: "<Narration>"
    en: She preserves it.
    ko: 남긴다.
    ja: 保持
  event_arkguardian2_05_e_20:
    speaker: "<Narration>"
    en: Fear and hesitation.
    ko: 두려움. 망설임.
    ja: 恐怖心、躊躇
  event_arkguardian2_05_e_21:
    speaker: "<Narration>"
    en: They won't do her any good now.
    ko: 지금 상황에서 아무런 도움이 되지 않는다.
    ja: 現在の状況で完全に無用
  event_arkguardian2_05_e_22:
    speaker: "<Narration>"
    en: She discards them.
    ko: 버린다.
    ja: 消去
  event_arkguardian2_05_e_23:
    speaker: "<Narration>"
    en: Information on Dorothy, Rapunzel, Scarlet, and the mass-produced Nikkes.
    ko: 도로시, 라푼젤, 홍련, 양산형 니케들에 대한 정보.
    ja: |-
      ドロシー、ラプンツェル、
      紅蓮、量産型ニケの情報
  event_arkguardian2_05_e_24:
    speaker: "<Narration>"
    en: Not helpful now, but could be important for future battles.
    ko: 지금 상황에서 도움은 되지 않지만 향후 전투에서 매우 유의미하다.
    ja: |-
      現在の状況では無用だが、
      今後の戦闘に有用
  event_arkguardian2_05_e_25:
    speaker: "<Narration>"
    en: She keeps it.
    ko: 남긴다.
    ja: 保持
  event_arkguardian2_05_e_26:
    speaker: "<Narration>"
    en: The memories she has shared with them, however, will not be needed.
    ko: 단, 그들과의 추억은 향후 전투에서 필요하지 않다.
    ja: ただし、個人的な関係の記憶は戦闘に無用
  event_arkguardian2_05_e_27:
    speaker: "<Narration>"
    en: She discards them.
    ko: 버린다.
    ja: 消去
  event_arkguardian2_05_e_28:
    speaker: "<Narration>"
    en: Information on the Commander.
    ko: 지휘관에 대한 정보.
    ja: 指揮官の情報
  event_arkguardian2_05_e_29:
    speaker: "<Narration>"
    en: This moment requires her to act independently. Orders are unnecessary.
    ko: 자발적 판단이 최우선인 상황. 명령은 필요하지 않다.
    ja: 現在は自発的な判断を最優先、命令は無用
  event_arkguardian2_05_e_30:
    speaker: "<Narration>"
    en: She discards it.
    ko: 버린다.
    ja: 消去
  event_arkguardian2_05_e_31:
    speaker: "<Narration>"
    en: Information on Red Hood.
    ko: 레드 후드에 대한 정보.
    ja: レッドフードの情報
  event_arkguardian2_05_e_32:
    speaker: "<Narration>"
    en: A deceased person.
    ko: 사망한 대상.
    ja: すでに死亡
  event_arkguardian2_05_e_33:
    speaker: "<Narration>"
    en: Such information is of no help in the current situation.
    ko: 지금 상황에서 아무런 도움이 되지 않는다.
    ja: 現在の状況で完全に無用
  event_arkguardian2_05_e_34:
    speaker: "<Narration>"
    en: She discards it.
    ko: 버린다.
    ja: 消去
  event_arkguardian2_05_e_35:
    speaker: "<Narration>"
    en: Information on Liliweiss.
    ko: 릴리바이스에 대한 정보.
    ja: リリーバイスの情報
  event_arkguardian2_05_e_36:
    speaker: "<Narration>"
    en: She will soon perish.
    ko: 빠른 시일 내에 사망한다.
    ja: 死亡間近
  event_arkguardian2_05_e_37:
    speaker: "<Narration>"
    en: Such information is of no help in the current situation.
    ko: 지금 상황에서 아무런 도움이 되지 않는다.
    ja: 現在の状況で完全に無用
  event_arkguardian2_05_e_38:
    speaker: "<Narration>"
    en: She discards it.
    ko: 버린다.
    ja: 消去
  event_arkguardian2_05_e_39:
    speaker: snowwhite_o
    en: Aaarrghhh!
    ko: 아… 아아….
    ja: あ…ああ…
  event_arkguardian2_05_e_40:
    speaker: "<Narration>"
    en: Snow White's mind races as she sorts through these decisions at lightning
      speed.
    ko: 머릿속이 빠르게 정리된다.
    ja: 頭の中の情報がめまぐるしく整理されていく
  event_arkguardian2_05_e_41:
    speaker: "<Narration>"
    en: Her life's goal.
    ko: 삶의 목표.
    ja: 生きる理由
  event_arkguardian2_05_e_42:
    speaker: "<Narration>"
    en: A happy future with everyone.
    ko: 모두와의 행복한 미래.
    ja: みんなとの幸せな未来
  event_arkguardian2_05_e_43:
    speaker: "<Narration>"
    en: Such information is of no help in the current situation.
    ko: 지금 상황에서 아무런 도움이 되지 않는다.
    ja: 現在の状況で完全に無用
  event_arkguardian2_05_e_44:
    speaker: "<Narration>"
    en: She discards it.
    ko: 버린다.
    ja: 消去
  event_arkguardian2_05_e_45:
    speaker: "<Narration>"
    en: Redefining life's goal.
    ko: 삶의 목표에 대해 재정립 중.
    ja: 生きる理由を再設定
  event_arkguardian2_05_e_46:
    speaker: "<Narration>"
    en: Protect humanity. Defend the Ark.
    ko: 인류를 지킨다. 방주를 지킨다.
    ja: 人類を守り、アークを守る
  event_arkguardian2_05_e_47:
    speaker: "<Narration>"
    en: NIMPH searches for methods to achieve this.
    ko: 목표를 이루기 위한 방법에 대해 NIMPH의 정보 검색.
    ja: 目標達成の方法を検索
  event_arkguardian2_05_e_48:
    speaker: "<Narration>"
    en: Her life's goal has been successfully redefined.
    ko: 삶의 목표에 대해 재정립 확정.
    ja: 再設定された生きる目標を拡張
  event_arkguardian2_05_e_49:
    speaker: "<Narration>"
    en: Live.
    ko: 산다.
    ja: 生存を続け…
  event_arkguardian2_05_e_50:
    speaker: "<Narration>"
    en: And kill the Raptures.
    ko: 그리고 랩쳐를 죽인다.
    ja: ラプチャーを破壊する
  event_arkguardian2_05_e_51:
    speaker: snowwhite_o
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_05_e_52:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_53:
    speaker: snowwhite
    en: 54 Raptures ahead.
    ko: 전방. 랩쳐 54기 확인.
    ja: 前方、ラプチャー54機を確認…
  event_arkguardian2_05_e_54:
    speaker: snowwhite
    en: Encounter.
    ko: 인카운터.
    ja: エンカウンター。
  event_arkguardian2_05_e_55:
    speaker: "<Narration>"
    en: Snow White's weapons breathe fire.
    ko: 스노우 화이트의 무장들이 불을 뿜는다.
    ja: スノーホワイトのライフルが火を放った
  event_arkguardian2_05_e_56:
    speaker: "<Narration>"
    en: Every shot targets the Rapture cores with terrifying precision.
    ko: 코어만을 노리는 정밀한 사격.
    ja: コアだけを狙った精密な射撃だ
  event_arkguardian2_05_e_57:
    speaker: "<Narration>"
    en: The instant her ammo runs low, she reloads and begins firing again.
    ko: 탄환이 떨어진다. 순식간에 이뤄지는 재장전. 사격이 계속된다.
    ja: |-
      弾倉が空になった。
      スノーホワイトは瞬く間にリロードを行い、
      射撃を再開した
  event_arkguardian2_05_e_58:
    speaker: "<Narration>"
    en: A Rapture's strike pierces her left arm.
    ko: 랩쳐의 공격에 왼팔이 너덜너덜해진다.
    ja: ラプチャーの攻撃で左腕が破損した
  event_arkguardian2_05_e_59:
    speaker: "<Narration>"
    en: It doesn't matter. She continues to fire without issues.
    ko: 상관없다. 총을 쏘는 것에는 문제가 없다.
    ja: 問題なし、射撃に影響はない
  event_arkguardian2_05_e_60:
    speaker: "<Narration>"
    en: Something pulls at her legs, and she drops to her knees.
    ko: 양다리를 당한다. 무릎을 꿇는다.
    ja: 両足をやられ、ひざをついた
  event_arkguardian2_05_e_61:
    speaker: "<Narration>"
    en: It doesn't matter. She continues to fire without issues.
    ko: 상관없다. 총을 쏘는 것에는 문제가 없다.
    ja: 問題なし、射撃に影響はない
  event_arkguardian2_05_e_62:
    speaker: "<Narration>"
    en: Even as the Raptures' assault intensifies, it doesn't matter.
    ko: 랩쳐의 공세가 강해져도 문제없다.
    ja: ラプチャーが攻勢を強めたが、問題はない
  event_arkguardian2_05_e_63:
    speaker: "<Narration>"
    en: She can easily bring them down with the rounds she has.
    ko: 현재 가지고 있는 탄환이라면 충분히 격추 가능하다.
    ja: 現在の残弾数で十分に撃破可能
  event_arkguardian2_05_e_64:
    speaker: "<Narration>"
    en: Her gun and the hand gripping it are struck.
    ko: 총과, 총을 잡고 있는 손이 당한다.
    ja: 持っている手ごと銃が破損した
  event_arkguardian2_05_e_65:
    speaker: snowwhite
    en: "... Hm."
    ko: "…음."
    ja: "……"
  event_arkguardian2_05_e_66:
    speaker: "<Narration>"
    en: Both her arms and legs are damaged.
    ko: 양팔과 양다리가 모두 당했다.
    ja: 両手、両足、すべて破損
  event_arkguardian2_05_e_67:
    speaker: "<Narration>"
    en: She spots the body of a mass-produced Nikke lying ahead.
    ko: 앞에 쓰러져 있는 양산형 니케의 주검을 본다.
    ja: 倒れた量産型ニケの亡骸が目の前にある
  event_arkguardian2_05_e_68:
    speaker: "<Narration>"
    en: She rips off the hand parts and forces them onto herself.
    ko: 손의 파츠를 떼어내 강제로 자신에게 이어 붙인다.
    ja: |-
      手のパーツをもぎ取り、
      自分の腕へ強引に接着した
  event_arkguardian2_05_e_69:
    speaker: "<Narration>"
    en: She draws another gun and fires.
    ko: 다른 총을 꺼내 든다. 사격한다.
    ja: 別の銃を取り出し、射撃を再開する
  event_arkguardian2_05_e_70:
    speaker: "<Narration>"
    en: She keeps fighting.
    ko: 스노우 화이트는 계속 싸운다.
    ja: スノーホワイトは戦い続けた
  event_arkguardian2_05_e_71:
    speaker: "<Narration>"
    en: At the crash site of the Wings of Victory, the gunfire continues unabated.
    ko: |-
      승리의 날개 호의 추락 지점에는 한동안,
      총성이 끊이지 않았다.
    ja: |-
      勝利の翼号の墜落地点に響く銃声は、
      それからしばらく絶えることが無かった
  event_arkguardian2_05_e_72:
    speaker: "<Narration>"
    en: A battered mass-produced Heretic kneels and looks up at Snow White.
    ko: 너덜너덜해진 양산형 헬레틱이 무릎을 꿇은 채 스노우 화이트를 올려다보고 있다.
    ja: |-
      傷だらけの量産型ヘレティックが、
      ひざをついてスノーホワイトを見上げた
  event_arkguardian2_05_e_73:
    speaker: "<Narration>"
    en: Snow White looks at her face.
    ko: 스노우 화이트는 그 얼굴을 본다.
    ja: スノーホワイトの瞳に、その顔が映る
  event_arkguardian2_05_e_74:
    speaker: "<Narration>"
    en: Red eyes. A face she recognizes from somewhere.
    ko: 붉은 눈. 어디선가 봤던 얼굴.
    ja: 紅くなった眼、だが見覚えのある顔
  event_arkguardian2_05_e_75:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_76:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕-!
    ja: バン――
  event_arkguardian2_05_e_77:
    speaker: "<Narration>"
    en: The mass-produced Heretic's head shatters.
    ko: 양산형 헬레틱의 머리가 부서진다.
    ja: 量産型ヘレティックの頭部が砕け散った
  event_arkguardian2_05_e_78:
    speaker: "<Narration>"
    en: Her body follows suit, crumbling and vanishing.
    ko: 곧, 바스러지며 사라진다.
    ja: 残骸が、塵となって消えた
  event_arkguardian2_05_e_79:
    speaker: snowwhite_o
    en: Clear.
    ko: 상황 종료.
    ja: 状況終了。
  event_arkguardian2_05_e_80:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_81:
    speaker: "<Narration>"
    en: The Raptures have been wiped out.
    ko: 랩쳐는 전멸.
    ja: ラプチャーは全滅していた
  event_arkguardian2_05_e_82:
    speaker: "<Narration>"
    en: Snow White checks her own body.
    ko: 자신의 몸 상태를 확인한다.
    ja: |-
      スノーホワイトは
      自分のボディの状態を確かめた
  event_arkguardian2_05_e_83:
    speaker: "<Narration>"
    en: It's a wreck. Not a single part is intact.
    ko: 엉망이다. 멀쩡한 부분이 하나도 없다.
    ja: |-
      全身ボロボロだ。
      何一つ、形を保っていない
  event_arkguardian2_05_e_84:
    speaker: "<Narration>"
    en: She looks at the mass-produced Nikkes lying on the ground.
    ko: 스노우 화이트는 쓰러져 있는 양산형 니케들을 본다.
    ja: 倒れている量産型ニケたちに視線が移った
  event_arkguardian2_05_e_85:
    speaker: snowwhite_o
    en: If I cannibalize some parts, it should be operational again...
    ko: 파츠를 떼서 붙이면 가동은 한다.
    ja: 取って付ければ動かせるか…
  event_arkguardian2_05_e_86:
    speaker: snowwhite_o
    en: But I would rather not.
    ko: "…하지만 그러고 싶지 않아."
    ja: "…気が進まないな。"
  event_arkguardian2_05_e_87:
    speaker: snowwhite_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_88:
    speaker: "<Narration>"
    en: She stares at the scattered fragments of the Rapture before her
    ko: 랩쳐의 파편들을 바라본다.
    ja: ラプチャーの残骸が目に入った
  event_arkguardian2_05_e_89:
    speaker: "<Narration>"
    en: and drags her uncooperative body toward them.
    ko: 뜻대로 움직이지 않는 몸을 질질 끌며 다가간다.
    ja: 思い通りに動かない身体を引きずり、近づいた
  event_arkguardian2_05_e_90:
    speaker: snowwhite_o
    en: Now is not the time to worry about compatibility.
    ko: 호환성을 따질 때가 아닌가.
    ja: 互換性を心配する場合ではないか。
  event_arkguardian2_05_e_91:
    speaker: "<Narration>"
    en: "*Crack*"
    ko: 콰직-!
    ja: バキッ！
  event_arkguardian2_05_e_92:
    speaker: "<Narration>"
    en: She rips off the Rapture's parts.
    ko: 랩쳐의 파츠를 떼어낸다.
    ja: パーツがはぎとられた
  event_arkguardian2_05_e_93:
    speaker: "<Narration>"
    en: She looks back. The massive transport ship is engulfed in flames.
    ko: 뒤를 돌아본다. 거대한 수송기가 불타고 있다.
    ja: 振り返れば、巨大な戦艦が炎上している
  event_arkguardian2_05_e_94:
    speaker: snowwhite_o
    en: I hope there's still some usable equipment left.
    ko: 쓸만한 장비가 남아 있으면 좋겠군.
    ja: 使えそうなものが残っていればいいが。
  event_arkguardian2_05_e_95:
    speaker: "<Narration>"
    en: Snow White takes the Rapture's fragment and walks toward the crashed Wings
      of Victory.
    ko: |-
      스노우 화이트는 랩쳐의 파편을 들고,
      추락한 승리의 날개 호를 향해 걸어간다.
    ja: |-
      スノーホワイトはラプチャーの残骸を手に、
      墜落した勝利の翼号へと歩いていった
  event_arkguardian2_05_e_96:
    speaker: "<Narration>"
    en: Dorothy halts with Liliweiss on her back.
    ko: 도로시가 릴리바이스를 업은 채 멈춰 선다.
    ja: |-
      リリーバイスを背負ったドロシーが
      立ち止まった
  event_arkguardian2_05_e_97:
    speaker: dorothy
    en: Commander! Lilith is...
    ko: 지휘관! 릴리스가…!
    ja: 指揮官！リリスが…！
  event_arkguardian2_05_e_98:
    speaker: dorothy
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_arkguardian2_05_e_99:
    speaker: "<Narration>"
    en: The Commander is missing from he was supposed to be standing.
    ko: 지휘관이 서 있어야 할 자리에는 아무도 없었다.
    ja: 指揮官が立っているはずの場所に誰もいない
  event_arkguardian2_05_e_100:
    speaker: "<Narration>"
    en: Dorothy looks down.
    ko: 도로시가 아래를 본다.
    ja: ドロシーは視線を下に移した
  event_arkguardian2_05_e_101:
    speaker: dorothy
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  event_arkguardian2_05_e_102:
    speaker: "<Narration>"
    en: The Commander has collapsed.
    ko: 지휘관은 쓰러져 있다.
    ja: 指揮官が倒れている
  event_arkguardian2_05_e_103:
    speaker: "<Narration>"
    en: Dorothy sets Liliweiss down and approaches him.
    ko: 릴리바이스를 내려놓고 도로시가 다가간다.
    ja: |-
      ドロシーはリリーバイスを降ろし、
      指揮官に駆け寄った
  event_arkguardian2_05_e_104:
    speaker: "<Narration>"
    en: He's alive,
    ko: 살아는 있다.
    ja: まだ生きている
  event_arkguardian2_05_e_105:
    speaker: "<Narration>"
    en: but it seems like he could die at any moment.
    ko: 하지만, 곧 죽어도 이상하지 않을 것 같은 모습이다.
    ja: だが、いつ死んでもおかしくない様子だ
  event_arkguardian2_05_e_106:
    speaker: dorothy
    en: Commander...
    ko: "…지휘관."
    ja: "…指揮官。"
  event_arkguardian2_05_e_107:
    speaker: commander
    en: What... What is it?
    ko: 어… 어. 왜.
    ja: ああ…何だ、どうかしたか…？
  event_arkguardian2_05_e_108:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_109:
    speaker: dorothy
    en: Lilith isn't doing well.
    ko: 릴리스의 상태가 안 좋아요.
    ja: リリスの状態が良くありません。
  event_arkguardian2_05_e_110:
    speaker: dorothy
    en: Could you check on her for a moment?
    ko: 잠시 봐줄 수 있어요?
    ja: 見ていていただけますか？
  event_arkguardian2_05_e_111:
    speaker: commander
    en: Yeah, yeah. I'll take a look.
    ko: 어어. 그래, 그래. 내가 볼게.
    ja: ああ…そうか、分かった。任せておけ。
  event_arkguardian2_05_e_112:
    speaker: commander
    en: N-no one saw, right?
    ko: 누구, 누구 본 사람은 없지?
    ja: 誰にも…見られていないな？
  event_arkguardian2_05_e_113:
    speaker: dorothy
    en: No. No one.
    ko: 예. 없어요.
    ja: ええ、誰も見ていません。
  event_arkguardian2_05_e_114:
    speaker: commander
    en: Good. That's a relief. If we lose morale now, we're done for.
    ko: |-
      그래. 다행이네.
      사기가 떨어지면 큰일이야.
    ja: |-
      そうか、よかった。
      士気が落ちたら問題だからな。
  event_arkguardian2_05_e_115:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_116:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_117:
    speaker: commander
    en: Go, fight. We've almost won.
    ko: "…빨리 가서 싸워. 거의 다 이겨간다."
    ja: "…早く前線に戻れ。勝利は目の前だ。"
  event_arkguardian2_05_e_118:
    speaker: dorothy
    en: I'll leave her to you.
    ko: 맡길게요.
    ja: 後はお願いします。
  event_arkguardian2_05_e_119:
    speaker: commander
    en: I've got this. Don't worry.
    ko: 그래. 걱정하지 말고.
    ja: ああ。心配するな。
  event_arkguardian2_05_e_120:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_121:
    speaker: dorothy
    en: Lilith.
    ko: 릴리스.
    ja: リリス。
  event_arkguardian2_05_e_122:
    speaker: liliweiss
    en: Hmm?
    ko: "…응?"
    ja: "…え？"
  event_arkguardian2_05_e_123:
    speaker: dorothy
    en: See you... soon.
    ko: 또… 봐요.
    ja: また…後ほど。
  event_arkguardian2_05_e_124:
    speaker: liliweiss
    en: "... Okay."
    ko: "…그래."
    ja: "…うん。"
  event_arkguardian2_05_e_125:
    speaker: "<Narration>"
    en: Dorothy heads back to the battlefield.
    ko: 도로시가 다시 전장으로 향한다.
    ja: ドロシーは再び戦場へ戻った
  event_arkguardian2_05_e_126:
    speaker: commander
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_127:
    speaker: commander
    en: Lilith.
    ko: 릴리스.
    ja: リリス。
  event_arkguardian2_05_e_128:
    speaker: liliweiss
    en: "... Yes."
    ko: "…예."
    ja: "…はい。"
  event_arkguardian2_05_e_129:
    speaker: commander
    en: That's enough now.
    ko: 이제… 그만해.
    ja: もう…いいだろう。
  event_arkguardian2_05_e_130:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_131:
    speaker: liliweiss
    en: I... still...
    ko: 아직… 저는….
    ja: 私には、まだ…
  event_arkguardian2_05_e_132:
    speaker: liliweiss
    en: I... still have things to do.
    ko: 할 일이… 있어요.
    ja: やるべきことが…ありますから。
  event_arkguardian2_05_e_133:
    speaker: "<Narration>"
    en: Liliweiss staggers to her feet.
    ko: 릴리바이스가 비틀대며 일어난다.
    ja: リリーバイスが、ふらつく足で立ち上がった
  event_arkguardian2_05_e_134:
    speaker: "<Narration>"
    en: She looks up at the sky.
    ko: 하늘을 올려다본다.
    ja: 顔が空に向けられる
  event_arkguardian2_05_e_135:
    speaker: "<Narration>"
    en: Two mass-produced Heretics are staring down at her.
    ko: 양산형 헬레틱 둘이, 릴리바이스를 내려다보고 있다.
    ja: |-
      2体の量産型ヘレティックが、
      リリーバイスを見下ろしていた
  event_arkguardian2_05_e_136:
    speaker: commander
    en: Looks like they're waiting to catch you.
    ko: "…너 잡으려고 기다리고 있었나 본데."
    ja: "…君と決着をつけに来たようだな。"
  event_arkguardian2_05_e_137:
    speaker: liliweiss
    en: "*Huff...*"
    ko: "…후우."
    ja: "…ふぅ…"
  event_arkguardian2_05_e_138:
    speaker: "<Narration>"
    en: Liliweiss steadies herself.
    ko: 릴리바이스가 자세를 다잡는다.
    ja: リリーバイスが構えを取った
  event_arkguardian2_05_e_139:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_05_e_140:
    speaker: liliweiss
    en: Bring it on.
    ko: 덤벼.
    ja: 相手してあげる。
event_arkguardian2_06_s:
  event_arkguardian2_06_s_1:
    speaker: hongryeon
    en: Hyah!
    ko: 흐으으읍--!!
    ja: はぁぁぁっ…！
  event_arkguardian2_06_s_2:
    speaker: "<Narration>"
    en: Scarlet's slash strikes the torso of a mass-produced Heretic,
    ko: 홍련의 검격이 양산형 헬레틱의 몸통을 파고든다.
    ja: 紅蓮の剣が量産型ヘレティックの胴にめり込んだ
  event_arkguardian2_06_s_3:
    speaker: "<Narration>"
    en: but it is abruptly halted mid-strike.
    ko: 하지만 중간에 막힌다.
    ja: だが切り裂くことはできず、刃が止まった
  event_arkguardian2_06_s_4:
    speaker: hongryeon
    en: Blast!
    ko: 치잇…!
    ja: チッ…！
  event_arkguardian2_06_s_5:
    speaker: "<Narration>"
    en: She rips the blade free and lashes out wildly.
    ko: 검을 빼낸 후 마구 휘두른다.
    ja: 抜き取った剣を、さらに大きく振るう
  event_arkguardian2_06_s_6:
    speaker: "<Narration>"
    en: The Heretic takes every strike in stride and proceeds to fire a beam.
    ko: 양산형 헬레틱은 모든 검격을 맞아가며 빔을 내뿜는다.
    ja: |-
      量産型ヘレティックが
      剣撃を受けながら、ビームを放った
  event_arkguardian2_06_s_7:
    speaker: "<Narration>"
    en: Scarlet barely manages to avoid it, her heart in her throat.
    ko: |-
      가까스로 피하는 홍련.
      하지만 숨이 턱끝까지 차올랐다.
    ja: |-
      紙一重でかわした紅蓮だが、
      すでに息は限界まで上がっている
  event_arkguardian2_06_s_8:
    speaker: hongryeon
    en: "*Huff... huff...*"
    ko: 하아…! 하아…!
    ja: はぁ…！はぁ…！
  event_arkguardian2_06_s_9:
    speaker: "<Narration>"
    en: The Heretic walks toward her, slow and steady.
    ko: 양산형 헬레틱이 천천히 홍련에게로 걸어간다.
    ja: |-
      量産型ヘレティックは
      ゆったりと紅蓮との間合いを詰めた
  event_arkguardian2_06_s_10:
    speaker: "<Narration>"
    en: The sight ignites her fury.
    ko: 그 모습이, 홍련을 분노하게 만들었다.
    ja: その余裕が、紅蓮の神経を逆なでした
  event_arkguardian2_06_s_11:
    speaker: hongryeon
    en: Mocking me, art thou?!
    ko: 농락할 셈인가, 네 이놈--!!
    ja: 貴様、愚弄する気か――！！
  event_arkguardian2_06_s_12:
    speaker: "<Narration>"
    en: Scarlet, filled with desperation, charges in.
    ko: 발악하듯 달려드는 홍련.
    ja: 紅蓮が半狂乱に飛びかかる
  event_arkguardian2_06_s_13:
    speaker: "<Narration>"
    en: The Heretic blocks the sword with an arm, then unleashes a beam.
    ko: |-
      양산형 헬레틱은 팔로 검을 막아낸 후,
      빔을 내뿜는다.
    ja: |-
      量産型ヘレティックは腕で剣を弾き、
      反撃を返した
  event_arkguardian2_06_s_14:
    speaker: "<Narration>"
    en: Scarlet tumbles across the ground.
    ko: 홍련이 바닥을 구른다.
    ja: 紅蓮が地面を転がった
  event_arkguardian2_06_s_15:
    speaker: "<Narration>"
    en: She coughs up blood and uses her sword to push herself up.
    ko: 입에서 피를 토하며, 검을 지팡이 삼아 일어난다.
    ja: 口から血を吐き、剣を支えに立ち上がる
  event_arkguardian2_06_s_16:
    speaker: hongryeon
    en: Not yet...! The time is not yet upon us...!
    ko: 아직…! 아직이다…!
    ja: まだ…！まだだ…！
  event_arkguardian2_06_s_17:
    speaker: hongryeon
    en: My blade is forged to cleave all creation!
    ko: 내 검은… 천지 만물을 베야 하는 검…!
    ja: 私の剣は…天地万物を斬る剣…！
  event_arkguardian2_06_s_18:
    speaker: hongryeon
    en: It shall not be stayed by the likes of thee!
    ko: 네놈 같은 것 따위에게 막힐 검이 아니다…!
    ja: 貴様ごときに破れたりはしない…！
  event_arkguardian2_06_s_19:
    speaker: "<Narration>"
    en: She leaps and brings her blade down.
    ko: |-
      도약한다.
      검을 내려친다.
    ja: 跳躍し、大上段から振り下ろした
  event_arkguardian2_06_s_20:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 텁-!
    ja: パシッ――！
  event_arkguardian2_06_s_21:
    speaker: "<Narration>"
    en: Seeing her sword caught in the Heretic's hands, Scarlet feels a wave of despair.
    ko: 양산형 헬레틱의 양손에 잡힌 검을 보고, 홍련은 허탈감을 느꼈다.
    ja: 両手で止められた剣を見て、紅蓮の心が折れた
  event_arkguardian2_06_s_22:
    speaker: hongryeon
    en: By what cause...?
    ko: 어째서….
    ja: なぜだ…
  event_arkguardian2_06_s_23:
    speaker: "<Narration>"
    en: Another beam shoots out, sending her flying backward once again.
    ko: 빔이 뻗어 나온다. 홍련은 다시 뒤로 나동그라진다.
    ja: 放たれた光が、紅蓮を再び地面に転がした
  event_arkguardian2_06_s_24:
    speaker: hongryeon
    en: Ugh...!
    ko: 커흑…!
    ja: ぐはっ…！
  event_arkguardian2_06_s_25:
    speaker: hongryeon
    en: Why... can I not cleave thee...
    ko: 어째서… 벨 수 없는가….
    ja: なぜ…斬れぬ…
  event_arkguardian2_06_s_26:
    speaker: hongryeon
    en: Why?!
    ko: 어째… 서!!
    ja: どう…して…！！
  event_arkguardian2_06_s_27:
    speaker: "<Narration>"
    en: Scarlet's mind races as she drifts in and out of consciousness.
    ko: 아찔해지는 의식 속에서, 홍련은 생각한다.
    ja: 遠のく意識の中で、紅蓮の思考が巡る
  event_arkguardian2_06_s_28:
    speaker: hongryeon
    en: Why can I not strike true?
    ko: 왜 벨 수 없는가.
    ja: なぜ斬れない…
  event_arkguardian2_06_s_29:
    speaker: hongryeon
    en: Wherefore do I aspire to cleave?
    ko: 나는, 왜 베려고 하지?
    ja: 私は、なぜ斬ろうとしている？
  event_arkguardian2_06_s_30:
    speaker: hongryeon
    en: So I may grow in might.
    ko: 강해지기 위해.
    ja: 強くなるためだ。
  event_arkguardian2_06_s_31:
    speaker: hongryeon
    en: And wherefore do I seek such strength?
    ko: 왜 강해지려 하지?
    ja: なぜ強くなろうとしている？
  event_arkguardian2_06_s_32:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_33:
    speaker: hongryeon
    en: Aye, indeed. For my sister.
    ko: 아아. 그래. 언니를 위해.
    ja: |-
      ああ、そうだ…
      姉さんのためだ…
  event_arkguardian2_06_s_34:
    speaker: hongryeon
    en: To fulfill her dearest wish.
    ko: 언니의 바램을 이뤄주기 위해.
    ja: 姉さんの願いをかなえるためだ…
  event_arkguardian2_06_s_35:
    speaker: janghwa
    en: Scarlet... you must become stronger.
    ko: 련… 강해져야 해.
    ja: レン…強くなりなさい。
  event_arkguardian2_06_s_36:
    speaker: janghwa
    en: Don't let yourself be controlled... by anyone...
    ko: 누구에게도… 휘둘리지 않도록….
    ja: 誰にも…振り回されないように…
  event_arkguardian2_06_s_37:
    speaker: hongryeon
    en: Rose was strong.
    ko: 언니는 강했지.
    ja: 姉さんは強かった。
  event_arkguardian2_06_s_38:
    speaker: hongryeon
    en: But how did she come to possess such strength?
    ko: 어떻게 그렇게 강할 수 있었지?
    ja: なぜ、あれほど強くなれたのだろう？
  event_arkguardian2_06_s_39:
    speaker: "<Narration>"
    en: Scarlet lifts her head. The mass-produced Heretic has disappeared from her
      view.
    ko: 홍련은 고개를 든다. 양산형 헬레틱은 눈에 들어오지 않는다.
    ja: |-
      紅蓮が頭を上げた。
      量産型ヘレティックの姿は見えない
  event_arkguardian2_06_s_40:
    speaker: "<Narration>"
    en: Instead, she sees red petals drifting across the field.
    ko: 전장을 떠돌아다니고 있는 붉은색 꽃잎을 본다.
    ja: 戦場に、ゆらめく赤い花弁を見た気がした
  event_arkguardian2_06_s_41:
    speaker: "<Narration>"
    en: Whether it is real or a hallucination is of little importance.
    ko: 그것이 실존하는지, 환상인지는 중요하지 않다.
    ja: それが現実か幻かは、重要ではなかった
  event_arkguardian2_06_s_42:
    speaker: "<Narration>"
    en: She gazes at the petals as they drift carelessly in the wind.
    ko: 홍련은 바람을 타고 자유롭게 떠도는 붉은색 꽃잎을 지긋이 바라본다.
    ja: |-
      風に乗って伸びやかに舞う赤い花弁に
      紅蓮の目が吸い込まれる
  event_arkguardian2_06_s_43:
    speaker: hongryeon
    en: How free...
    ko: 자유롭군.
    ja: なんと自由で…
  event_arkguardian2_06_s_44:
    speaker: hongryeon
    en: And tranquil...
    ko: 여유롭고.
    ja: 思いのままに…
  event_arkguardian2_06_s_45:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_46:
    speaker: hongryeon
    en: Much like Rose.
    ko: 그래. 마치 언니 같아.
    ja: ああ、まるで姉さんのようだ…
  event_arkguardian2_06_s_47:
    speaker: hongryeon
    en: She ne'er did hurry, but moved with a grace and bore herself with a spirit
      unconfined.
    ko: 득달같이 달려들지 않고, 언제나 자유롭고 여유로웠지.
    ja: 腰の落ち着いた、常に気ままで余裕のある姿。
  event_arkguardian2_06_s_48:
    speaker: hongryeon
    en: This I conceived,
    ko: 나는 그것이.
    ja: 私にはそれが…
  event_arkguardian2_06_s_49:
    speaker: hongryeon
    en: to be strength and beauty.
    ko: 그리도 강하고 아름답게 보였다.
    ja: とても強く、美しく見えた。
  event_arkguardian2_06_s_50:
    speaker: hongryeon
    en: I longed to be thus.
    ko: 그렇게 되고 싶었다.
    ja: そうなりたいと願った。
  event_arkguardian2_06_s_51:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_52:
    speaker: hongryeon
    en: Therefore, 'tis plain what course I must pursue.
    ko: "…그렇게 되면 그만인 일."
    ja: "…ならば、そうあればよい。"
  event_arkguardian2_06_s_53:
    speaker: "<Narration>"
    en: Scarlet steadies her breathing.
    ko: 홍련이 호흡을 가다듬는다.
    ja: 紅蓮が息を整え…
  event_arkguardian2_06_s_54:
    speaker: "<Narration>"
    en: She clears her mind.
    ko: 마음을 비운다.
    ja: 心を無にした
  event_arkguardian2_06_s_55:
    speaker: "<Narration>"
    en: The data in her head resets,
    ko: 머릿속의 정보가 재정립된다.
    ja: 頭の中の情報が整理されていく
  event_arkguardian2_06_s_56:
    speaker: "<Narration>"
    en: and she experiences a slight Mind Switch.
    ko: 가벼운 사고 전환.
    ja: 軽度の思考転換
  event_arkguardian2_06_s_57:
    speaker: "<Narration>"
    en: However, in Scarlet's case...
    ko: 하지만 홍련의 경우에는.
    ja: しかし、紅蓮にとっては――
  event_arkguardian2_06_s_58:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_59:
    speaker: hongryeon
    en: Pray, is this truly the field of battle?
    ko: 호오. 그래. 이런 풍경이었군. 전장이란.
    ja: |-
      ほう…戦場というものは、
      このような景色だったのかい。
  event_arkguardian2_06_s_60:
    speaker: hongryeon
    en: And hath my blade ever felt so light in mine hand?
    ko: 그리고, 검의 무게가 이리도 가벼웠던가.
    ja: |-
      それに、剣がこれほどまでに
      軽いものとは知らなかったねぇ。
  event_arkguardian2_06_s_61:
    speaker: "<Narration>"
    en: For Scarlet, this Mind Switch is akin to transcendence.
    ko: 좀 더, 극의에 가까워진 상태로의 승화와도 같았다.
    ja: むしろ、極意に至る悟りの瞬間であった
  event_arkguardian2_06_s_62:
    speaker: hongryeon
    en: Now, come forth.
    ko: 자, 오게나.
    ja: さあ、続きと行こう。
  event_arkguardian2_06_s_63:
    speaker: "<Narration>"
    en: The Heretic fires a beam.
    ko: 양산형 헬레틱이 빔을 내뿜는다.
    ja: 量産型ヘレティックがビームを放った
  event_arkguardian2_06_s_64:
    speaker: "<Narration>"
    en: Scarlet dodges it effortlessly with a slight twist.
    ko: 홍련은 몸을 살짝 틀어 공격을 피한다.
    ja: |-
      紅蓮は体のわずかなひねりだけで、
      攻撃をかわした
  event_arkguardian2_06_s_65:
    speaker: hongryeon
    en: To parry so grievous a strike would be a fool's errand.
    ko: 강한 공격은 받아낼 것 하나 없고.
    ja: 大きな一撃は全てかわし…
  event_arkguardian2_06_s_66:
    speaker: "<Narration>"
    en: The Heretic closes in, pressing for a melee attack.
    ko: |-
      양산형 헬레틱이 접근한다.
      육탄전을 걸어온다.
    ja: |-
      量産型ヘレティックが距離を詰め、
      肉弾戦に切り替えた
  event_arkguardian2_06_s_67:
    speaker: hongryeon
    en: To dodge or parry the strike? A most tricky conundrum.
    ko: 까다로운 공격은 피하거나 흘리면 될 일.
    ja: "…小さなからめ手は、受け流す。"
  event_arkguardian2_06_s_68:
    speaker: "<Narration>"
    en: Scarlet deflects her opponent's incoming fist with the back of her blade,
    ko: 뻗어오는 주먹을 칼등으로 흘려보낸다.
    ja: 飛び来る拳の軌道を、剣の背がそらした
  event_arkguardian2_06_s_69:
    speaker: "<Narration>"
    en: causing the latter to stagger.
    ko: 자세가 무너진다.
    ja: ヘレティックの体勢が崩れる
  event_arkguardian2_06_s_70:
    speaker: "<Narration>"
    en: Then gripping Fleetly Fading in reverse,
    ko: 홍련은 화무십일홍을 역수로 잡은 후.
    ja: 紅蓮は花無十日紅を逆手に持ち替え…
  event_arkguardian2_06_s_71:
    speaker: "<Narration>"
    en: she drives it into the core of the Heretic.
    ko: 양산형 헬레틱의 코어에 찔러 넣었다.
    ja: 量産型ヘレティックのコアに突き刺した
  event_arkguardian2_06_s_72:
    speaker: hongryeon
    en: No need to waste strength. Strike true at the weakness.
    ko: 힘 뺄 필요 없이 약점을 정확히 노린다면.
    ja: 力まかせにせずとも、正確に急所を狙えば…
  event_arkguardian2_06_s_73:
    speaker: "<Narration>"
    en: She extracts the blade,
    ko: 검을 빼낸다.
    ja: 剣が引き抜かれた
  event_arkguardian2_06_s_74:
    speaker: "<Narration>"
    en: then lowers her stance.
    ko: 납도 후, 자세를 숙인다.
    ja: |-
      紅蓮はさやに剣を収めなおすと、
      腰を落とし…
  event_arkguardian2_06_s_75:
    speaker: "<Narration>"
    en: With one clean cut,
    ko: 단숨에 벤다.
    ja: ひと息に抜き放った
  event_arkguardian2_06_s_76:
    speaker: "<Narration>"
    en: the mass-produced Heretic's head tumbles across the ground.
    ko: 양산형 헬레틱의 머리가 바닥에 나동그라진다.
    ja: |-
      量産型ヘレティックの頭が
      地面に転がった
  event_arkguardian2_06_s_77:
    speaker: hongryeon
    en: And victory is assured.
    ko: 절대 질 일은 없는 법.
    ja: "…決して敗れることはない。"
  event_arkguardian2_06_s_78:
    speaker: "<Narration>"
    en: "*Clink clink clank*"
    ko: 카가가가가각--!!
    ja: ガガガガガ――！！
  event_arkguardian2_06_s_79:
    speaker: "<Narration>"
    en: Dozens of slashes carve the Heretic into pieces,
    ko: 수십번의 검격이 양산형 헬레틱을 조각낸다.
    ja: |-
      量産型ヘレティックは
      さらに数十回の斬撃に切り裂かれ…
  event_arkguardian2_06_s_80:
    speaker: "<Narration>"
    en: who then fall lifelessly to the ground.
    ko: 바스러지며 사라진다.
    ja: 塵となって消滅した
  event_arkguardian2_06_s_81:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_82:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: シャリン――
  event_arkguardian2_06_s_83:
    speaker: "<Narration>"
    en: The sword slides into the scabbard.
    ko: 검이 검집으로 들어간다.
    ja: 剣がさやに戻った
  event_arkguardian2_06_s_84:
    speaker: hongryeon
    en: A truth so plain... and yet I grasp it but now.
    ko: 이리도 쉬운걸. 이제서야 깨닫다니.
    ja: |-
      これほど簡単なことに、
      今まで気づかなかったとは…
  event_arkguardian2_06_s_85:
    speaker: hongryeon
    en: "... I must render thanks unto mine elder sister. And unto Lilith also."
    ko: |-
      …언니에게 감사해야겠군.
      그리고 릴리스에게도.
    ja: |-
      …姉さんに感謝しなければならないねぇ。
      リリスにも。
  event_arkguardian2_06_s_86:
    speaker: dorothy
    en: Scarlet?
    ko: 홍… 련?
    ja: 紅…蓮…？
  event_arkguardian2_06_s_87:
    speaker: hongryeon
    en: Oh, Dorothy.
    ko: 오. 도로시 왔는가.
    ja: ああ、ドロシーかい。
  event_arkguardian2_06_s_88:
    speaker: dorothy
    en: Is that really you? Did you take that Heretic down by yourself?
    ko: 당신… 맞아요? 그리고 이걸 혼자 잡은 건가요?
    ja: あなた…なのですか？それに、これは1人で？
  event_arkguardian2_06_s_89:
    speaker: hongryeon
    en: Indeed.
    ko: 그렇다네.
    ja: そうだねぇ。
  event_arkguardian2_06_s_90:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_91:
    speaker: dorothy
    en: Looks like you experienced a Mind Switch.
    ko: 사고 전환이 온 모양이군요.
    ja: 思考転換を起こしたようですね。
  event_arkguardian2_06_s_92:
    speaker: hongryeon
    en: Methinks so. That raging fire within me hath dwindled to naught.
    ko: 그런 모양일세. 불같던 마음이 흔적도 없이 사그라든 걸 보니 말일세.
    ja: |-
      そのようだ。燃え上がっていた心が、
      今は跡形もなく穏やかだよ。
  event_arkguardian2_06_s_93:
    speaker: dorothy
    en: Do you remember everything?
    ko: 기억은 다 나나요?
    ja: 記憶はすべて残っているのですか？
  event_arkguardian2_06_s_94:
    speaker: hongryeon
    en: Aye, I remember it all.
    ko: 그래. 모두 기억나네.
    ja: ああ。何もかも覚えているよ。
  event_arkguardian2_06_s_95:
    speaker: hongryeon
    en: I recall full well how oft I did quarrel with thee.
    ko: 후후. 자네에게 그리도 시비를 걸었던 것이 똑똑히 기억나.
    ja: |-
      ふふ…君と幾度となく
      いがみ合ったことも、しっかりと思い出せる。
  event_arkguardian2_06_s_96:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_97:
    speaker: hongryeon
    en: Is adaptation giving thee trouble, perchance? I am calmer than ever, yet methinks
      thou art not.
    ko: |-
      적응이 쉽지 않은가?
      나는 그 어느 때보다 평온하네만, 자네는 그렇지 않겠군.
    ja: |-
      落ち着かぬかい？
      私は何も変わっていないつもりだが、
      君にはそうでないようだ。
  event_arkguardian2_06_s_98:
    speaker: hongryeon
    en: Thou shalt adjust in due course. For now, let us attend unto the battlefield.
    ko: 차차 적응하도록 하고, 일단은 이 전장을 정리함이 어떻겠나.
    ja: |-
      それにはいずれ慣れてもらうとして、
      ひとまず今は、この場を片づけるとしよう。
  event_arkguardian2_06_s_99:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_100:
    speaker: dorothy
    en: Very well. Let's.
    ko: 좋아요. 그렇게 하죠.
    ja: ええ。そうですね。
  event_arkguardian2_06_s_101:
    speaker: dorothy
    en: I'm counting on you, Scarlet.
    ko: 잘 부탁드려요. 홍련.
    ja: よろしくお願いします、紅蓮。
  event_arkguardian2_06_s_102:
    speaker: hongryeon
    en: Ha, such words need not be spoken aloud.
    ko: 뭘 새삼스럽게.
    ja: 何だい、今さら。
  event_arkguardian2_06_s_103:
    speaker: liliweiss
    en: "*Huff... huff...*"
    ko: 하아…! 하아…!
    ja: はぁ…！はぁ…！
  event_arkguardian2_06_s_104:
    speaker: "<Narration>"
    en: Liliweiss, bent at the waist, catches her breath.
    ko: 릴리바이스는 허리를 숙인 채 호흡을 가다듬는다.
    ja: |-
      リリーバイスが腰を落としたまま、
      呼吸を整えた
  event_arkguardian2_06_s_105:
    speaker: "<Narration>"
    en: She crushes something writhing beneath her foot,
    ko: 꿈틀대는 뭔가를 발로 짓이긴다.
    ja: そして名状しがたい、うごめくものを踏みつけ…
  event_arkguardian2_06_s_106:
    speaker: "<Narration>"
    en: then gazes at the mass-produced Heretics scattered across the ground.
    ko: 그리고 바닥에 흩어진 양산형 헬레틱들을 바라본다.
    ja: 足下に散乱する量産型ヘレティックの残骸を見た
  event_arkguardian2_06_s_107:
    speaker: liliweiss
    en: Ugh... Aagh...!
    ko: 으… 아악…!
    ja: う…ああっ…！
  event_arkguardian2_06_s_108:
    speaker: "<Narration>"
    en: Blood spills from her eyes.
    ko: 눈에서 피가 흘러나온다.
    ja: 目から血が流れ出た
  event_arkguardian2_06_s_109:
    speaker: "<Narration>"
    en: She attempts to wipe it away, but it keeps flowing.
    ko: 닦아내지만 계속 흘러나온다.
    ja: 拭い取るそばから、また流れ出る
  event_arkguardian2_06_s_110:
    speaker: "<Narration>"
    en: Liliweiss senses the end is near.
    ko: 릴리바이스는 끝을 직감했다.
    ja: リリーバイスは終わりを悟った
  event_arkguardian2_06_s_111:
    speaker: commander
    en: Even in your condition... you took down both of them... alone...
    ko: 그 상태로… 둘을… 혼자서 잡다니….
    ja: |-
      そんな状態で…2体…
      1人で仕留めるとは…
  event_arkguardian2_06_s_112:
    speaker: commander
    en: Ha... haha... I knew it. You're... my...
    ko: |-
      하… 하하….
      역시, 넌… 내….
    ja: |-
      は…ははは…
      さすが、君は…私の…
  event_arkguardian2_06_s_113:
    speaker: liliweiss
    en: "*Cough cough*"
    ko: 쿨럭, 쿨럭!
    ja: ゲホ、ゴホッ…！
  event_arkguardian2_06_s_114:
    speaker: commander
    en: Li-Lilith...
    ko: 릴리… 스….
    ja: リリ…ス…
  event_arkguardian2_06_s_115:
    speaker: commander
    en: Seriously... that's enough.
    ko: 이제 진짜… 그만해라.
    ja: 本当に…もういいんだ。
  event_arkguardian2_06_s_116:
    speaker: commander
    en: Rest... now.
    ko: 이제… 쉬어.
    ja: もう…休んでくれ…
  event_arkguardian2_06_s_117:
    speaker: liliweiss
    en: "*Cough cough*"
    ko: 쿨럭! 크흠…!
    ja: ゲホッ！ゴボッ…！
  event_arkguardian2_06_s_118:
    speaker: liliweiss
    en: I still... have work left to do.
    ko: 아직… 더 해야 할 일이… 있어요.
    ja: まだ…まだ、やるべきことが…ありますから。
  event_arkguardian2_06_s_119:
    speaker: commander
    en: Please... just stop...
    ko: 부탁이다. 이제 그… 만….
    ja: 頼む。もう…いい…
  event_arkguardian2_06_s_120:
    speaker: "<Narration>"
    en: The Commander loses consciousness.
    ko: 지휘관이 정신을 잃는다.
    ja: 指揮官が意識を失った
  event_arkguardian2_06_s_121:
    speaker: liliweiss
    en: Commander!
    ko: "…지휘관."
    ja: "…指揮官。"
  event_arkguardian2_06_s_122:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_123:
    speaker: "<Narration>"
    en: Liliweiss hoists him onto her back.
    ko: 릴리바이스는 지휘관을 둘러업는다.
    ja: リリーバイスが指揮官を背負い上げた
  event_arkguardian2_06_s_124:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 챠락-
    ja: チャリン――
  event_arkguardian2_06_s_125:
    speaker: "<Narration>"
    en: His dog tag falls to the ground.
    ko: 지휘관의 군번줄이 바닥에 떨어진다.
    ja: 指揮官の認識票がすべり落ちた
  event_arkguardian2_06_s_126:
    speaker: "<Narration>"
    en: Liliweiss struggles even to bend down and retrieve it.
    ko: 릴리바이스는 그것을 줍기 위해 허리를 숙이는 것조차 쉽지 않았다.
    ja: |-
      リリーバイスは拾おうとしたが、
      もはやしゃがむこともままならない
  event_arkguardian2_06_s_127:
    speaker: "<Narration>"
    en: She leaves it behind and sprints toward the entrance of the Ark.
    ko: 그대로 두고 방주 입구 쪽으로 달려간다.
    ja: |-
      認識票を置き去りにして、
      アークの受け入れ口に向かって駆けた
  event_arkguardian2_06_s_128:
    speaker: "<Narration>"
    en: Her whole body screams in protest, but she does not stop.
    ko: 온몸이 비명을 지른다. 하지만 멈추지 않는다.
    ja: 全身が悲鳴を上げても、止まることはない
  event_arkguardian2_06_s_129:
    speaker: "<Narration>"
    en: Liliweiss looks around.
    ko: 릴리바이스는 주위를 둘러본다.
    ja: リリーバイスはあたりを見回した
  event_arkguardian2_06_s_130:
    speaker: "<Narration>"
    en: She sees the infirmary.
    ko: 의무실이 보인다.
    ja: 医務室が目に入った
  event_arkguardian2_06_s_131:
    speaker: "<Narration>"
    en: She starts toward it, then stops.
    ko: 발걸음을 옮기려다, 멈춰 선다.
    ja: 足を向けようとして、立ち止まった
  event_arkguardian2_06_s_132:
    speaker: "<Narration>"
    en: Most have already entered the Ark, and only a few remain outside.
    ko: 모두 방주로 들어간다. 이곳에는 최소한의 병력만 남는다.
    ja: |-
      誰もがアークへ逃れていく。
      ここには最小限の兵力しかない
  event_arkguardian2_06_s_133:
    speaker: "<Narration>"
    en: The Commander's life is in danger,
    ko: 지휘관은 지금 위험하다.
    ja: 指揮官はきわめて危険な状態だ
  event_arkguardian2_06_s_134:
    speaker: "<Narration>"
    en: but this place cannot treat him since it's a facility for Nikkes.
    ko: 이곳의 시설로는 치료할 수 없다. 니케에 최적화 된 시설이다.
    ja: |-
      本来ニケ用の設備であるここでは、
      どうにもならない
  event_arkguardian2_06_s_135:
    speaker: "<Narration>"
    en: They may be able to buy some time, but that is all.
    ko: 당장은 어떻게든 할 수 있겠지만, 장기적으로 본다면.
    ja: |-
      一時しのぎはできるかもしれないが、
      長期的に考えれば…
  event_arkguardian2_06_s_136:
    speaker: "<Narration>"
    en: The Commander will eventually die.
    ko: 지휘관은 죽는다.
    ja: ここでは助からない
  event_arkguardian2_06_s_137:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_138:
    speaker: "<Narration>"
    en: Liliweiss looks at the Commander's face.
    ko: 릴리바이스는 지휘관의 얼굴을 바라본다.
    ja: リリーバイスが指揮官の顔を見た
  event_arkguardian2_06_s_139:
    speaker: "<Narration>"
    en: Tears threaten to burst forth, but she holds them back.
    ko: 눈물이 나올 것 같다. 하지만 참는다.
    ja: あふれそうになる涙をこらえた
  event_arkguardian2_06_s_140:
    speaker: "<Narration>"
    en: She quickens her pace,
    ko: 발걸음을 서두른다.
    ja: 足取りがさらに早くなった
  event_arkguardian2_06_s_141:
    speaker: "<Narration>"
    en: heading straight for the entrance.
    ko: 방주의 입구로 향한다.
    ja: アークへのゲートが見える
  event_arkguardian2_06_s_142:
    speaker: "<Narration>"
    en: In the midst of the crowd, a soldier recognizes her and makes his way over.
    ko: 수많은 인파 속, 자신을 알아보고 병사가 다가온다.
    ja: |-
      人だかりの中から、こちらに気づいた兵士が
      近づいてきた
  event_arkguardian2_06_s_143:
    speaker: CGsoldier
    en: Major Liliweiss, I'm so glad you're safe.
    ko: 릴리바이스 소령님. 무사하셔서 다행입니다.
    ja: リリーバイス少佐。ご無事で何よりです。
  event_arkguardian2_06_s_144:
    speaker: liliweiss
    en: Hello.
    ko: 안녕하세요.
    ja: お疲れさまです。
  event_arkguardian2_06_s_145:
    speaker: liliweiss
    en: I'm sorry, but is there an access route for primary personnel?
    ko: 죄송한데, 혹시 주요 인사용 통로가 있을까요?
    ja: |-
      悪いけど、VIP用のルートに
      案内してください。
  event_arkguardian2_06_s_146:
    speaker: liliweiss
    en: An access route into the Ark.
    ko: 방주로 가는 통로요.
    ja: アーク行きの。
  event_arkguardian2_06_s_147:
    speaker: CGsoldier
    en: What? No, there isn't...
    ko: 예? 그, 그런 건 없….
    ja: え？そ、そのようなものなど存在し…
  event_arkguardian2_06_s_148:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_149:
    speaker: CGsoldier
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_150:
    speaker: "<Narration>"
    en: The soldier sees the Commander on Liliweiss's back.
    ko: 병사가 릴리바이스가 둘러업고 있는 지휘관을 본다.
    ja: 兵士が背負われた指揮官に気づいた
  event_arkguardian2_06_s_151:
    speaker: "<Narration>"
    en: His face has turned a pallid hue, and sweat pours down.
    ko: 이상한 색으로 변한 얼굴, 비 오듯 흐르는 땀.
    ja: |-
      異常な色の変わり果てた顔に、
      滝のように流れている汗
  event_arkguardian2_06_s_152:
    speaker: "<Narration>"
    en: The soldier understands at once.
    ko: 병사는 단번에 어떤 상황인지 알아챘다.
    ja: それだけで、兵士は全てを察した
  event_arkguardian2_06_s_153:
    speaker: CGsoldier
    en: "... There is. This way."
    ko: 있습니다. 이쪽으로 오시죠.
    ja: "…案内します。こちらへ。"
  event_arkguardian2_06_s_154:
    speaker: CGsoldier
    en: Please don't draw any attention. If others notice, it could cause chaos.
    ko: 다른 사람들이 눈치채면 소동이 일어날 테니, 조용히 와주십시오.
    ja: |-
      人目につくと騒ぎになります。
      目立たないようついて来てください。
  event_arkguardian2_06_s_155:
    speaker: liliweiss
    en: Thank you.
    ko: 고마워요.
    ja: 助かります。
  event_arkguardian2_06_s_156:
    speaker: "<Narration>"
    en: Seeing the masses crowding into the giant elevator, Liliweiss feels an onerous
      sense of remorse.
    ko: 거대한 엘리베이터로 향하고 있는 수많은 인파를 보고 릴리바이스는 착잡함과 미안함을 느꼈다.
    ja: |-
      巨大なエレベーターに寄せ集められた
      大勢の人々を横目に、
      リリーバイスは罪悪感と申し訳なさを覚えた
  event_arkguardian2_06_s_157:
    speaker: "<Narration>"
    en: She follows the soldier to a smaller elevator meant for ten people.
    ko: 병사를 따라 간 곳엔 10인용 엘리베이터가 있었다.
    ja: |-
      兵士の案内で向かった先には
      定員10名ほどと思われる
      エレベーターが待機していた
  event_arkguardian2_06_s_158:
    speaker: "<Narration>"
    en: Three are already inside. Their eyes widen when they see her arrive.
    ko: 셋이 미리 탑승한 상태다. 그들의 눈이 커진다.
    ja: 先に乗っていた3人が、目を丸くした
  event_arkguardian2_06_s_159:
    speaker: "<Narration>"
    en: Ignoring the stares, Liliweiss gently lays the Commander down.
    ko: 릴리바이스는 그 시선들을 무시하며 엘리베이터 안에 조심스럽게 지휘관을 눕혔다.
    ja: |-
      リリーバイスは知らぬふりをして、
      指揮官を優しくエレベーターの中に
      横たわらせた
  event_arkguardian2_06_s_160:
    speaker: "<Narration>"
    en: She looks at his face for a long while.
    ko: 그리고 한참 동안 그 얼굴을 바라보았다.
    ja: それから、しばらく指揮官の顔を見つめた
  event_arkguardian2_06_s_161:
    speaker: CGsoldier
    en: Major...
    ko: "…소령님."
    ja: "…少佐。"
  event_arkguardian2_06_s_162:
    speaker: liliweiss
    en: Are we waiting for more to arrive?
    ko: 아직 더 와야 출발하나요?
    ja: 出発は10人そろってから？
  event_arkguardian2_06_s_163:
    speaker: CGsoldier
    en: "... No. Departing now."
    ko: "…아뇨. 지금 출발하겠습니다."
    ja: "…いいえ。すぐに動きます。"
  event_arkguardian2_06_s_164:
    speaker: liliweiss
    en: Thank you.
    ko: 고마워요.
    ja: 分かりました。
  event_arkguardian2_06_s_165:
    speaker: liliweiss
    en: Please take care of him.
    ko: 이 사람을 부탁해요.
    ja: この人をお願いします。
  event_arkguardian2_06_s_166:
    speaker: liliweiss
    en: Ensure his survival. Can you do that?
    ko: 책임지고 살려줘요. 할 수 있나요?
    ja: |-
      責任を持って、救命にあたってください。
      お願いできますね？
  event_arkguardian2_06_s_167:
    speaker: CGsoldier
    en: "... Understood."
    ko: "…알겠습니다."
    ja: "…了解いたしました。"
  event_arkguardian2_06_s_168:
    speaker: liliweiss
    en: I'm counting on you.
    ko: 믿을게요.
    ja: あなたに託します。
  event_arkguardian2_06_s_169:
    speaker: "<Narration>"
    en: Liliweiss steps back.
    ko: 릴리바이스가 물러선다.
    ja: リリーバイスが後ろに下がった
  event_arkguardian2_06_s_170:
    speaker: "<Narration>"
    en: The soldier takes his place next to the Commander,
    ko: 병사가 지휘관의 옆에 자리를 잡는다.
    ja: 兵士が指揮官の隣に寄った
  event_arkguardian2_06_s_171:
    speaker: "<Narration>"
    en: as the elevator doors slide shut.
    ko: 그리고, 엘리베이터의 문이 닫힌다.
    ja: エレベーターのドアが閉ざされはじめた
  event_arkguardian2_06_s_172:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_s_173:
    speaker: liliweiss
    en: Goodbye...
    ko: 안녕.
    ja: さよなら。
event_arkguardian2_06_e:
  event_arkguardian2_06_e_1:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-!
    ja: ガン――！
  event_arkguardian2_06_e_2:
    speaker: liliweiss
    en: "?"
    ko: "…?"
    ja: "…？"
  event_arkguardian2_06_e_3:
    speaker: "<Narration>"
    en: "*Thud thud thud*"
    ko: 쿵-! 쿵-! 쿵-!
    ja: ガン！ガン！ガン！
  event_arkguardian2_06_e_4:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_5:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 푸슉-!
    ja: プシューッ！
  event_arkguardian2_06_e_6:
    speaker: "<Narration>"
    en: The elevator doors open.
    ko: 엘리베이터의 문이 열린다.
    ja: エレベーターの扉が開いた
  event_arkguardian2_06_e_7:
    speaker: "<Narration>"
    en: The Commander stands before her, sweat pouring down. The soldier holds him
      steady from behind.
    ko: |-
      땀을 비 오듯 흘리고 있는 지휘관이 앞에 서 있다.
      병사가 지휘관을 뒤에서 붙잡고 있다.
    ja: |-
      滝のような汗を流して立つ指揮官と、
      それを後ろから抑える兵士の姿があった
  event_arkguardian2_06_e_8:
    speaker: liliweiss
    en: "... You're unbelievable!"
    ko: 정말… 못 말리겠네요.
    ja: 本当に…困った人。
  event_arkguardian2_06_e_9:
    speaker: commander
    en: What are you doing?
    ko: 뭐 하는 짓이야…!
    ja: これは何のマネだ…！
  event_arkguardian2_06_e_10:
    speaker: liliweiss
    en: You're going down to the Ark.
    ko: 방주로 내려가요.
    ja: アークへ行ってください。
  event_arkguardian2_06_e_11:
    speaker: liliweiss
    en: Live, Commander.
    ko: 살아요. 지휘관.
    ja: 生き延びてください。指揮官。
  event_arkguardian2_06_e_12:
    speaker: commander
    en: Don't be ridiculous! Do you really think I could live with myself if I did
      that?
    ko: 개소리하지 마! 나보고 그런 쪽팔리는 짓을 하라고!?
    ja: |-
      バカを言え！どのツラ下げて
      生きていけと言うんだ！？
  event_arkguardian2_06_e_13:
    speaker: commander
    en: Lilith! What do you take me for?
    ko: 릴리스…! 도대체 날…!
    ja: リリス…！どうして…！
  event_arkguardian2_06_e_14:
    speaker: liliweiss
    en: If you stay here, you'll die! You know that.
    ko: |-
      여기 있다간 죽을 거예요.
      알잖아요.
    ja: |-
      ここにいたら確実に死にます。
      分かってるでしょう？
  event_arkguardian2_06_e_15:
    speaker: commander
    en: So what?
    ko: 그게 뭐!
    ja: それがどうした！
  event_arkguardian2_06_e_16:
    speaker: commander
    en: Dying doesn't scare me! I...
    ko: 죽는 건 아무렇지도 않아! 나는…!
    ja: 死ぬことなんか怖くもない！私は…！
  event_arkguardian2_06_e_17:
    speaker: commander
    en: I'll die with all of you!
    ko: 나는 너희들과 함께 죽을 거다!
    ja: 私は君たちとここで死ぬんだ！
  event_arkguardian2_06_e_18:
    speaker: liliweiss
    en: "!!"
    ko: "----!!"
    ja: "……！！"
  event_arkguardian2_06_e_19:
    speaker: liliweiss
    en: And what about the girls?! What are they supposed to do?
    ko: 그럼 쟤들은! 쟤들은 어떡하라고요!
    ja: |-
      道連れにする気ですか！？
      あの子たちのことを！
  event_arkguardian2_06_e_20:
    speaker: liliweiss
    en: Go! Go to the Ark. Take responsibility and make sure the girls get there safely
      too!
    ko: 방주로 가요! 가서! 책임지고 저 아이들을 방주로 데려와야죠!
    ja: |-
      アークへ行ってください！
      あの子たちがアークへ行けるように、
      責任を持って！
  event_arkguardian2_06_e_21:
    speaker: commander
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_06_e_22:
    speaker: liliweiss
    en: You're the only one who can save them!
    ko: |-
      지휘관밖에 없어요!
      저 아이들을 구해줄 수 있는 사람은!
    ja: |-
      指揮官しかいません！
      あの子たちを救える人は！
  event_arkguardian2_06_e_23:
    speaker: liliweiss
    en: It has to be you!
    ko: 당신밖에 없다고요!
    ja: 他には誰も！
  event_arkguardian2_06_e_24:
    speaker: liliweiss
    en: Take care of them, Commander!
    ko: 저 아이들을 책임져요! 지휘관!
    ja: 責任を取ってください！指揮官！
  event_arkguardian2_06_e_25:
    speaker: commander
    en: I can't! I won't leave you behind!
    ko: 나는! 너희들을 두고 갈 수 없다!
    ja: 君たちを…置いていけるか！
  event_arkguardian2_06_e_26:
    speaker: liliweiss
    en: Andersen!!
    ko: 엔더슨!!
    ja: アンダーソン！！
  event_arkguardian2_06_e_27:
    speaker: andersen
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arkguardian2_06_e_28:
    speaker: liliweiss
    en: You know what's gonna happen!
    ko: 알잖아요! 저 아이들은 지상에…!
    ja: |-
      分かってるはずでしょ！？
      あの子たちが地上に…！
  event_arkguardian2_06_e_29:
    speaker: liliweiss
    en: They'll be left behind on the surface!
    ko: 지상에 버려질 거라고요!
    ja: 地上に捨てられること！！
  event_arkguardian2_06_e_30:
    speaker: andersen
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_06_e_31:
    speaker: liliweiss
    en: Please...
    ko: "…부탁해요."
    ja: "…お願いです…"
  event_arkguardian2_06_e_32:
    speaker: liliweiss
    en: The girls...
    ko: 저 아이들을.
    ja: あの子たちを…
  event_arkguardian2_06_e_33:
    speaker: liliweiss
    en: You have to save them.
    ko: 반드시 구해줘요.
    ja: 必ず、救ってあげて。
  event_arkguardian2_06_e_34:
    speaker: "<Narration>"
    en: Andersen begins to waver.
    ko: 지휘관이 휘청인다.
    ja: 指揮官の身体から力が抜けた
  event_arkguardian2_06_e_35:
    speaker: "<Narration>"
    en: The soldier grabs him from behind again and locks him in place.
    ko: |-
      병사가 지휘관을 뒤에서 다시 잡는다.
      동시에, 움직이지 못하게 끌어안는다.
    ja: |-
      兵士に引き戻され、
      身動きがとれないよう抑え込まれた
  event_arkguardian2_06_e_36:
    speaker: "<Narration>"
    en: His eyes meet Liliweiss', and she gives a nod.
    ko: |-
      릴리바이스와 눈이 마주친다.
      릴리바이스가 고개를 끄덕인다.
    ja: |-
      兵士とリリーバイスの目が合った。
      リリーバイスは頭を縦に振った
  event_arkguardian2_06_e_37:
    speaker: "<Narration>"
    en: The elevator doors start to close.
    ko: 엘리베이터의 문이 닫히기 시작한다.
    ja: エレベーターのドアが閉まりはじめた
  event_arkguardian2_06_e_38:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_39:
    speaker: andersen
    en: Let go! Let go of me! I said let go!
    ko: 놔…! 이거 놔…! 놔라!!
    ja: 放せ…！おい…！放せ！！
  event_arkguardian2_06_e_40:
    speaker: andersen
    en: Lilith! Lilith! I...
    ko: 릴리스! 릴리스! 나는…!
    ja: リリス！リリス！私は…！
  event_arkguardian2_06_e_41:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_42:
    speaker: andersen
    en: I didn't even get to say goodbye...
    ko: 작별… 인사도…!
    ja: 別れの言葉だって…何も…！
  event_arkguardian2_06_e_43:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_44:
    speaker: "<Narration>"
    en: The elevator doors close,
    ko: 엘리베이터의 문이 닫힌다.
    ja: エレベーターの扉が閉まる瞬間…
  event_arkguardian2_06_e_45:
    speaker: "<Narration>"
    en: leaving only a thin slit.
    ko: 아주 작은, 틈만 남겨둔다.
    ja: かすかに残った、隙間から
  event_arkguardian2_06_e_46:
    speaker: "<Narration>"
    en: Andersen peers through the narrow gap at a white flower that appears on the
      verge of wilting.
    ko: |-
      지휘관은 그 작은 틈 사이로 보인,
      당장이라도 시들 것만 같은 하얀 꽃을 바라본다.
    ja: |-
      指揮官の目が今にも枯れてしまいそうな
      白い花を見つめた
  event_arkguardian2_06_e_47:
    speaker: andersen
    en: Lilith, I love you.
    ko: 릴리스. 사랑한다.
    ja: リリス。愛している。
  event_arkguardian2_06_e_48:
    speaker: liliweiss
    en: "!!"
    ko: "……!!"
    ja: "……！！"
  event_arkguardian2_06_e_49:
    speaker: liliweiss
    en: I love you too, Andersen.
    ko: 저도 사랑해요. 엔더슨.
    ja: 私も、愛しています。アンダーソン。
  event_arkguardian2_06_e_50:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 푸슉-!
    ja: プシューッ――
  event_arkguardian2_06_e_51:
    speaker: "<Narration>"
    en: The elevator doors close,
    ko: 엘리베이터의 문이 닫힌다.
    ja: 扉が閉ざされた
  event_arkguardian2_06_e_52:
    speaker: "<Narration>"
    en: and it begins to descend.
    ko: 아래로 내려간다.
    ja: エレベーターが下りてゆく
  event_arkguardian2_06_e_53:
    speaker: "<Narration>"
    en: Lilith stands frozen,
    ko: 릴리바이스는 멍하니 서 있다.
    ja: リリーバイスはその場に立ち尽くした
  event_arkguardian2_06_e_54:
    speaker: "<Narration>"
    en: tears streaming down her face.
    ko: 눈물을 흘린다.
    ja: 涙がこぼれた
  event_arkguardian2_06_e_55:
    speaker: "<Narration>"
    en: She walks on,
    ko: 걸어간다.
    ja: 足が動いた
  event_arkguardian2_06_e_56:
    speaker: "<Narration>"
    en: passing by the entrance to the Ark,
    ko: 방주 입구를 지나.
    ja: アークへのゲートを通り過ぎ
  event_arkguardian2_06_e_57:
    speaker: "<Narration>"
    en: and heads for a vantage point overlooking the battlefield.
    ko: 전장의 모습이 한눈에 보이는 곳으로 향한다.
    ja: 戦場が一望できる場所へ向かって
  event_arkguardian2_06_e_58:
    speaker: "<Narration>"
    en: Through her clouded vision, she vaguely makes out the figures of her cherished
      subordinates, comrades, and friends.
    ko: 흐릿한 시선으로 아끼던 부하, 동료, 동생들의 모습을 눈으로 쫓는다.
    ja: |-
      かすむ目で、大切な部下であり、
      仲間でもある、妹たちの姿を追った
  event_arkguardian2_06_e_59:
    speaker: liliweiss
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_60:
    speaker: liliweiss
    en: Ah...
    ko: 아아….
    ja: ああ…
  event_arkguardian2_06_e_61:
    speaker: "<Narration>"
    en: On the battlefield, she sees them.
    ko: 전장에 보이는 것은
    ja: 戦場に見た姿は…
  event_arkguardian2_06_e_62:
    speaker: "<Narration>"
    en: A young lady moving with unparalleled grace.
    ko: 우아하고 고귀한 몸동작의 아가씨
    ja: 気高く、優雅に舞う令嬢
  event_arkguardian2_06_e_63:
    speaker: "<Narration>"
    en: A compassionate saint wreathed in gold.
    ko: 황금빛을 두른 자애로운 성녀
    ja: 黄金の光をまとう、慈しみ深き聖女
  event_arkguardian2_06_e_64:
    speaker: "<Narration>"
    en: A swordswoman whose movements flow like water.
    ko: 물 흐르듯 흘러가는 검객
    ja: 流水のごとくしなやかな剣士
  event_arkguardian2_06_e_65:
    speaker: "<Narration>"
    en: And a speck of spotless, pure white.
    ko: 그리고 티 없이 하얗기만 한 순백
    ja: そして、汚れなき純白の人影
  event_arkguardian2_06_e_66:
    speaker: snowwhite
    en: Only one mass-produced Heretic left.
    ko: 남은 건 양산형 헬레틱 1기뿐인가.
    ja: 残る敵は量産型ヘレティックが1機か。
  event_arkguardian2_06_e_67:
    speaker: hongryeon
    en: "... Who mightst thou be?"
    ko: "…누구…?"
    ja: "…誰だい？"
  event_arkguardian2_06_e_68:
    speaker: dorothy
    en: Reinforcements...? Who could be arriving now, of all times?
    ko: 지원군...? 이 타이밍에 대체 누구죠?
    ja: |-
      増援ですか…？
      こんなタイミングで、いったいどこから…？
  event_arkguardian2_06_e_69:
    speaker: rapunzel
    en: No way...
    ko: "…설마."
    ja: "…まさか…"
  event_arkguardian2_06_e_70:
    speaker: snowwhite
    en: It's me, Snow White.
    ko: 스노우 화이트다.
    ja: スノーホワイトだ。
  event_arkguardian2_06_e_71:
    speaker: dorothy
    en: "... Snow White?"
    ko: "…예?"
    ja: "…はい？"
  event_arkguardian2_06_e_72:
    speaker: hongryeon
    en: Risen from the grave, have we?
    ko: "…오. 안 보이더니 훌쩍 커서 돌아와 버렸군그래."
    ja: |-
      …おお、しばらく見ないと思ったら…
      ずいぶん大きくなったようだねぇ。
  event_arkguardian2_06_e_73:
    speaker: rapunzel
    en: Those parts... What are they?
    ko: 그 파츠들은 대체….
    ja: その身体はいったい…
  event_arkguardian2_06_e_74:
    speaker: snowwhite
    en: I used Rapture parts as temporary components.
    ko: 랩쳐의 것을 임시 파츠로 썼다.
    ja: ラプチャーのパーツをその場で取り付けた。
  event_arkguardian2_06_e_75:
    speaker: rapunzel
    en: "!"
    ko: "…!!"
    ja: "…！！"
  event_arkguardian2_06_e_76:
    speaker: dorothy
    en: Have you... gone through a Mind Switch?
    ko: 사고 전환… 이 온 건가요?
    ja: 思考転換を…起こしたのですか…？
  event_arkguardian2_06_e_77:
    speaker: snowwhite
    en: Yes.
    ko: 그래.
    ja: そうだ。
  event_arkguardian2_06_e_78:
    speaker: dorothy
    en: So your memories...
    ko: 기억은….
    ja: 記憶は…
  event_arkguardian2_06_e_79:
    speaker: snowwhite
    en: Dorothy, Scarlet, Rapunzel.
    ko: 도로시. 홍련. 라푼젤.
    ja: ドロシー。紅蓮。ラプンツェル。
  event_arkguardian2_06_e_80:
    speaker: snowwhite
    en: Let's move. We can talk later.
    ko: 대화는 나중이다. 가자.
    ja: 話はあとだ。行くぞ。
  event_arkguardian2_06_e_81:
    speaker: "<Narration>"
    en: Snow White breaks into a run,
    ko: 스노우 화이트가 달려간다.
    ja: スノーホワイトが駆けだした
  event_arkguardian2_06_e_82:
    speaker: "<Narration>"
    en: as Dorothy, Scarlet and Rapunzel follow.
    ko: 그 뒤를 도로시, 홍련, 라푼젤이 따른다.
    ja: ドロシー、紅蓮、ラプンツェルが後を追った
  event_arkguardian2_06_e_83:
    speaker: "<Narration>"
    en: They clash with the mass-produced Heretic.
    ko: 양산형 헬레틱과 격돌한다.
    ja: 量産型ヘレティックとの衝突が始まった
  event_arkguardian2_06_e_84:
    speaker: "<Narration>"
    en: The dust begins to settle.
    ko: 전장이 정리되어 간다.
    ja: 戦場の音が見る間に小さくなっていく
  event_arkguardian2_06_e_85:
    speaker: "<Narration>"
    en: Liliweiss, certain of victory, sits back against a wall.
    ko: 릴리바이스는 승리를 확신하며, 벽에 기대앉았다.
    ja: |-
      勝利を確信したリリーバイスは
      壁に身体を預けた
  event_arkguardian2_06_e_86:
    speaker: liliweiss
    en: "... You're all grown up."
    ko: "…다 컸네."
    ja: "…大きくなったね。"
  event_arkguardian2_06_e_87:
    speaker: liliweiss
    en: I'm so proud of you.
    ko: 멋있다. 내 동생들.
    ja: 立派よ、私の妹たち。
  event_arkguardian2_06_e_88:
    speaker: liliweiss
    en: Haha...
    ko: 하하….
    ja: ふふ…
  event_arkguardian2_06_e_89:
    speaker: liliweiss
    en: I really am.
    ko: 진짜, 멋있다.
    ja: 本当に、カッコいい。
  event_arkguardian2_06_e_90:
    speaker: "<Narration>"
    en: Her eyelids grow heavy.
    ko: 눈꺼풀이 무거워진다.
    ja: まぶたが重くなった
  event_arkguardian2_06_e_91:
    speaker: "<Narration>"
    en: Even as her eyes begin to close, she strains to look at her friends a little
      longer.
    ko: |-
      릴리바이스는 감기는 눈에,
      소중한 동생들의 모습을 조금이라도 더 담으려 애썼다.
    ja: |-
      リリーバイスは、大切な妹たちの姿を
      閉じていく目にできるだけ
      長く焼き付けようとしながら
  event_arkguardian2_06_e_92:
    speaker: "<Narration>"
    en: Then, with a smile,
    ko: 그리고 미소 지으며
    ja: 顔には微笑みを浮かべて…
  event_arkguardian2_06_e_93:
    speaker: "<Narration>"
    en: she quietly closes her eyes.
    ko: 조용히 눈을 감았다.
    ja: 静かに目を閉じた
  event_arkguardian2_06_e_94:
    speaker: "<Narration>"
    en: The white flower withers,
    ko: 하얀 꽃은 시들고.
    ja: 白き花が散り…
  event_arkguardian2_06_e_95:
    speaker: "<Narration>"
    en: and the Goddess of Victory falls asleep.
    ko: 승리의 여신이 잠들었다.
    ja: 勝利の女神は眠りについた
  event_arkguardian2_06_e_96:
    speaker: "<Narration>"
    en: Three hours later.
    ko: 3시간 후.
    ja: 3時間後
  event_arkguardian2_06_e_97:
    speaker: "<Narration>"
    en: Freesia stares at the crowd ahead.
    ko: 프리시아는 앞에 서 있는 인파를 바라본다.
    ja: |-
      フリージアは目の前に集まっている
      人々を眺めていた
  event_arkguardian2_06_e_98:
    speaker: "<Narration>"
    en: The once large crowd has diminished to only a few people.
    ko: 그렇게나 많던 사람들이 이제는 몇 남지 않았다.
    ja: |-
      あれだけ大勢いたはずの人たちが、
      もう数えるほどしか残っていない
  event_arkguardian2_06_e_99:
    speaker: "<Narration>"
    en: She looks back.
    ko: 뒤를 돌아본다.
    ja: 後ろを振り向いた
  event_arkguardian2_06_e_100:
    speaker: "<Narration>"
    en: There's no one else.
    ko: 아무도 없다.
    ja: 誰もいない
  event_arkguardian2_06_e_101:
    speaker: "<Narration>"
    en: A soldier at the elevator entrance keeps shouting.
    ko: 엘리베이터 입구의 병사가 계속 크게 외친다.
    ja: |-
      エレベーターの入口にいる兵士が
      ひときわ大きな声をあげた
  event_arkguardian2_06_e_102:
    speaker: "<Narration>"
    en: This might be the last call.
    ko: 아마도 이번이 마지막이다.
    ja: きっと、これで最後だ
  event_arkguardian2_06_e_103:
    speaker: "<Narration>"
    en: The people ahead start walking and step into the elevator.
    ko: 앞의 사람들이 걸어가 엘리베이터에 몸을 싣기 시작한다.
    ja: |-
      目の前の人々が歩き出し、
      エレベーターに向かいはじめた
  event_arkguardian2_06_e_104:
    speaker: "<Narration>"
    en: Freesia grows anxious as her distance from the person ahead of her grows.
    ko: 프리시아는 앞 사람과의 거리가 멀어지는 것에 초조해졌다.
    ja: |-
      フリージアはだんだんと開く
      人々との距離に焦りを覚えた
  event_arkguardian2_06_e_105:
    speaker: "<Narration>"
    en: She looks back.
    ko: 뒤를 돌아본다.
    ja: 後ろを振り向く
  event_arkguardian2_06_e_106:
    speaker: "<Narration>"
    en: Still no one.
    ko: 아무도 없다.
    ja: やはり誰もいない
  event_arkguardian2_06_e_107:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_108:
    speaker: "<Narration>"
    en: She fidgets with the folded paper against her chest.
    ko: |-
      품을 만지작거린다.
      접힌 서류가 만져진다.
    ja: |-
      ポケットをまさぐると、
      折りたたまれた書類が指に触れた
  event_arkguardian2_06_e_109:
    speaker: "<Narration>"
    en: Keenly aware of the paper she holds, she walks with her eyes fixated on the
      ground.
    ko: 프리시아는 그 서류를 의식하며 바닥을 바라보며 걷는다.
    ja: |-
      フリージアは書類にすがるような気持ちで、
      地面を見ながら歩きはじめた
  event_arkguardian2_06_e_110:
    speaker: "<Narration>"
    en: She walks slowly. Very slowly.
    ko: 천천히, 천천히 걷는다.
    ja: 出来る限りゆっくりと、引き延ばすように
  event_arkguardian2_06_e_111:
    speaker: "<Narration>"
    en: The soldier at the front keeps shouting, urging her to hurry.
    ko: 앞에서 재촉하는 병사의 목소리가 들려온다.
    ja: 前方にいる兵士が声を上げ、急かしてくる
  event_arkguardian2_06_e_112:
    speaker: "<Narration>"
    en: Freesia pretends not to hear and keeps walking slowly.
    ko: 프리시아는 못 들은 척 계속 천천히 걷는다.
    ja: |-
      フリージアは聞こえないふりをして、
      ゆっくりとした足取りを続けた
  event_arkguardian2_06_e_113:
    speaker: oswald_o
    en: You should look where you're going.
    ko: 앞을 보고 걸으십시오.
    ja: 歩く時は前を見てください。
  event_arkguardian2_06_e_114:
    speaker: "<Narration>"
    en: She looks back.
    ko: 프리시아가 뒤를 돌아본다.
    ja: フリージアが振り返った
  event_arkguardian2_06_e_115:
    speaker: freesia
    en: Mister!
    ko: 아저씨.
    ja: おじさん。
  event_arkguardian2_06_e_116:
    speaker: oswald_o
    en: Where did the soldier go?
    ko: 병사분은 어디 갔습니까.
    ja: 人に頼んでおいたはずですが。
  event_arkguardian2_06_e_117:
    speaker: freesia
    en: He was with me. But everyone looked so busy, so I told him to help them.
    ko: 나랑 같이 있었는데, 다른 사람들이 너무 바빠 보여서 도와주라고 보냈어.
    ja: |-
      来てくれた人のことなら、
      みんな忙しそうだったから
      お手伝いに行ってもらったの。
  event_arkguardian2_06_e_118:
    speaker: freesia
    en: I can go alone.
    ko: 혼자 갈 수 있으니까.
    ja: 一人で行けるからって言って。
  event_arkguardian2_06_e_119:
    speaker: oswald_o
    en: Can you?
    ko: 혼자 갈 수 있습니까.
    ja: 一人で行けますか。
  event_arkguardian2_06_e_120:
    speaker: freesia
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_121:
    speaker: freesia
    en: No.
    ko: 아니.
    ja: ううん。
  event_arkguardian2_06_e_122:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_123:
    speaker: oswald_o
    en: We won't be seeing each other often.
    ko: 자주 보진 못할 겁니다.
    ja: めったに会うことはできませんよ。
  event_arkguardian2_06_e_124:
    speaker: oswald_o
    en: Are you okay with that?
    ko: 그래도 괜찮습니까.
    ja: それでもいいですか。
  event_arkguardian2_06_e_125:
    speaker: freesia
    en: Yeah...
    ko: 응. 괜찮아.
    ja: うん。平気。
  event_arkguardian2_06_e_126:
    speaker: oswald_o
    en: All right, let's go then.
    ko: 그럼 가죠.
    ja: では、行きましょう。
  event_arkguardian2_06_e_127:
    speaker: oswald_o
    en: To the Ark.
    ko: 방주로.
    ja: アークへ。
  event_arkguardian2_06_e_128:
    speaker: "<Narration>"
    en: The elevator doors close.
    ko: 엘리베이터의 문이 닫힌다.
    ja: エレベーターのドアが閉まった
  event_arkguardian2_06_e_129:
    speaker: rapunzel
    en: Lilith! Lilith!
    ko: 릴리스…! 릴리스…!
    ja: リリス…！リリス…！
  event_arkguardian2_06_e_130:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_131:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_132:
    speaker: rapunzel
    en: Li...lith... no... No!
    ko: 릴리… 스…! 아…! 아아아아…!!
    ja: リリ…ス…！ああ…！ああああっ…！！
  event_arkguardian2_06_e_133:
    speaker: dorothy
    en: "... Scarlet."
    ko: "…홍련."
    ja: "…紅蓮。"
  event_arkguardian2_06_e_134:
    speaker: hongryeon
    en: Why the long face?
    ko: "…왜 그러나."
    ja: "…なんだい。"
  event_arkguardian2_06_e_135:
    speaker: dorothy
    en: Could you... make her a coffin?
    ko: 관을… 만들어 줄 수 있나요?
    ja: 棺は…作れますか？
  event_arkguardian2_06_e_136:
    speaker: hongryeon
    en: Aye, I shall prepare it using the finest white stone I can find.
    ko: "…그래. 내 가장 하얗고 예쁜 돌로 준비함세."
    ja: "…ああ。何よりきれいで真っ白な石を使おう。"
  event_arkguardian2_06_e_137:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_138:
    speaker: dorothy
    en: "... Snow White."
    ko: "…스노우 화이트."
    ja: "…スノーホワイト。"
  event_arkguardian2_06_e_139:
    speaker: dorothy
    en: Are you all right?
    ko: 괜찮나요.
    ja: 大丈夫ですか？
  event_arkguardian2_06_e_140:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_141:
    speaker: snowwhite
    en: Who is she?
    ko: 누구지 이건.
    ja: 誰だ、これは。
  event_arkguardian2_06_e_142:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_143:
    speaker: dorothy
    en: You don't remember.
    ko: 기억… 나지 않는군요.
    ja: 覚えて…いないのですね。
  event_arkguardian2_06_e_144:
    speaker: snowwhite
    en: "... No, I don't."
    ko: 그래. 모르겠다.
    ja: ああ。知らないな。
  event_arkguardian2_06_e_145:
    speaker: dorothy
    en: But... why are you crying?
    ko: 그런데… 왜 울고 있나요.
    ja: それなら…なぜ泣いているのですか？
  event_arkguardian2_06_e_146:
    speaker: "<Narration>"
    en: Snow White lifts a hand to her cheek.
    ko: 스노우 화이트는 손을 들어 뺨을 만진다.
    ja: スノーホワイトは頬に手を伸ばした
  event_arkguardian2_06_e_147:
    speaker: "<Narration>"
    en: Tears are falling.
    ko: 눈물이 흐르고 있다.
    ja: 涙が流れていた
  event_arkguardian2_06_e_148:
    speaker: snowwhite
    en: I don't know. What's happening?
    ko: "…모르겠군. 왜 이러는지."
    ja: "…さあ。なぜだろうな。"
  event_arkguardian2_06_e_149:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_150:
    speaker: snowwhite
    en: So, who is she? Someone significant?
    ko: |-
      그래서, 이건 누구지?
      중요한 인물인가?
    ja: |-
      それで、これは誰だ？
      重要人物か？
  event_arkguardian2_06_e_151:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_152:
    speaker: dorothy
    en: "... The Goddess of Victory."
    ko: "…승리의 여신."
    ja: "…勝利の女神…"
  event_arkguardian2_06_e_153:
    speaker: dorothy
    en: That's who she was.
    ko: 이죠.
    ja: その人でした。
  event_arkguardian2_06_e_154:
    speaker: "<Narration>"
    en: 'OPERATION ARK GUARDIAN: END'
    ko: 'OPERATION ARK GUARDIAN : END'
    ja: 'OPERATION ARK GUARDIAN : END'
  event_arkguardian2_06_e_155:
    speaker: "<Narration>"
    en: One month later.
    ko: 한 달 후.
    ja: 1ヶ月後
  event_arkguardian2_06_e_156:
    speaker: dorothy
    en: What's the latest?
    ko: "…어떤가요."
    ja: "…どうですか。"
  event_arkguardian2_06_e_157:
    speaker: rapunzel
    en: Same as usual. No one today.
    ko: 오늘도… 없네요.
    ja: 今日も…いませんね。
  event_arkguardian2_06_e_158:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_159:
    speaker: hongryeon
    en: Not a soul has arrived since that fateful day.
    ko: 그날 이후로 한 명도 찾아오지 않은 건가.
    ja: あの日から、1人もなしか。
  event_arkguardian2_06_e_160:
    speaker: hongryeon
    en: Neither human, nor Nikke.
    ko: 사람도, 니케도.
    ja: 人間も、ニケも。
  event_arkguardian2_06_e_161:
    speaker: rapunzel
    en: We've had some Nikkes stop by... but not a single human.
    ko: 니케 분들은 간혹 찾아오셨지만… 사람은 단 한 명도….
    ja: |-
      ニケは時おりいらっしゃいますが…
      人間はどなたも…
  event_arkguardian2_06_e_162:
    speaker: rapunzel
    en: Maybe... maybe there really aren't any survivors...
    ko: 어쩌면… 지상의 인류는 모두….
    ja: もしかすると…地上の人々はもう…
  event_arkguardian2_06_e_163:
    speaker: dorothy
    en: "... Let's wait a little longer."
    ko: "…더 기다려보죠."
    ja: "…もう少しだけ待ってみましょう。"
  event_arkguardian2_06_e_164:
    speaker: rapunzel
    en: What about the Commander?
    ko: "…지휘관은요?"
    ja: "…指揮官は？"
  event_arkguardian2_06_e_165:
    speaker: dorothy
    en: Still no word. Some of the mass-produced units said they saw him heading down
      to the Ark, so he's probably there.
    ko: "…아직 연락이 없네요. 방주로 내려가는 걸 양산형 분들 몇이 목격했다고는 하니 방주에 있겠죠."
    ja: |-
      …まだ連絡はありません。
      アークへ向かう姿を目撃した量産型が
      いるそうです。あちらへ着いているのでしょう。
  event_arkguardian2_06_e_166:
    speaker: dorothy
    en: Given his condition, his recovery might be a long one.
    ko: 상태가 상태인 만큼, 치료하는 데 오래 걸리는 것일지도 모르고요.
    ja: |-
      あの時の状態を考えると、
      治療にかなりの時間が
      かかっているのかもしれません。
  event_arkguardian2_06_e_167:
    speaker: hongryeon
    en: Perchance, he is no longer among us.
    ko: 바꿔 말하면, 이미 없는 사람일 수도 있다는 얘기로군.
    ja: |-
      言葉を変えれば、治せるものとも
      限らないということかねぇ。
  event_arkguardian2_06_e_168:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_169:
    speaker: dorothy
    en: Maybe.
    ko: 그럴지도요.
    ja: そうかもしれません。
  event_arkguardian2_06_e_170:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_171:
    speaker: hongryeon
    en: What say they from within the Ark?
    ko: 방주에서는 뭐라 하는가.
    ja: アークは何か言っているかい？
  event_arkguardian2_06_e_172:
    speaker: dorothy
    en: They say the Ark will be completely sealed in four months.
    ko: 앞으로 네 달 뒤면 방주의 밀봉이 완전히 종료된다고 해요.
    ja: |-
      4ヶ月後にはアークの封鎖作業が
      完全に終了するそうです。
  event_arkguardian2_06_e_173:
    speaker: dorothy
    en: After that, they'll open the emergency gate to come and retrieve us.
    ko: 이후에 비상용 입구를 열어 데리러 올 거라고도 했어요.
    ja: その後、非常用のルートで迎えに来ると。
  event_arkguardian2_06_e_174:
    speaker: hongryeon
    en: So they send word still, do they?
    ko: 호오. 그래도 연락이 오긴 오는군.
    ja: ほう。まだ連絡が来ているのかい。
  event_arkguardian2_06_e_175:
    speaker: dorothy
    en: Yes... albeit through a recorded voice message.
    ko: "…녹음된 음성 메시지였긴 하지만요."
    ja: "…録音された音声でしたが。"
  event_arkguardian2_06_e_176:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_177:
    speaker: snowwhite
    en: Raptures incoming.
    ko: 랩쳐 놈들이 온다.
    ja: ラプチャーどもが来る。
  event_arkguardian2_06_e_178:
    speaker: dorothy
    en: Roger.
    ko: "…예."
    ja: "…ええ。"
  event_arkguardian2_06_e_179:
    speaker: dorothy
    en: Everyone, get ready.
    ko: 다들, 준비하죠.
    ja: みなさん、戦闘準備を。
  event_arkguardian2_06_e_180:
    speaker: hongryeon
    en: How tiresome this is.
    ko: 이것 참. 지겹군그래.
    ja: まったく、うんざりするねぇ。
  event_arkguardian2_06_e_181:
    speaker: dorothy
    en: Just hang in there a little longer.
    ko: "…조금만 참죠."
    ja: "…あと少しの辛抱です。"
  event_arkguardian2_06_e_182:
    speaker: "<Narration>"
    en: Another month passes.
    ko: 또 한 달 후.
    ja: さらに1ヶ月後
  event_arkguardian2_06_e_183:
    speaker: hongryeon
    en: Any word?
    ko: "…연락은?"
    ja: "…何か知らせは？"
  event_arkguardian2_06_e_184:
    speaker: "<Narration>"
    en: Dorothy shakes her head.
    ko: 도로시가 고개를 가로젓는다.
    ja: ドロシーが頭を横に振った
  event_arkguardian2_06_e_185:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_186:
    speaker: hongryeon
    en: He's perchance at his drink again.
    ko: 한잔하고 있겠네.
    ja: 一杯やるとするか。
  event_arkguardian2_06_e_187:
    speaker: dorothy
    en: You've been drinking too much lately.
    ko: 요즘 너무 마시는 것 아닌가요.
    ja: ここのところ飲みすぎです。
  event_arkguardian2_06_e_188:
    speaker: hongryeon
    en: No more than a sip.
    ko: 뭘. 목만 축이는걸세.
    ja: よいではないか、喉をうるおすぐらい。
  event_arkguardian2_06_e_189:
    speaker: dorothy
    en: If a Heretic shows up, even a mass-produced one, we're finished.
    ko: 양산형 헬레틱이라도 오면 끝이에요.
    ja: |-
      量産型ヘレティックでも来たら、
      どうするのです。
  event_arkguardian2_06_e_190:
    speaker: hongryeon
    en: Two months hence, and still no whisper of them...
    ko: 이미 두 달이나 모습이 보이지 않네.
    ja: もう2ヶ月も見ておらぬではないか。
  event_arkguardian2_06_e_191:
    speaker: hongryeon
    en: Perchance the last we felled was the last of their kind.
    ko: 우리가 잡은 게 끝일 수도 있지 않은가.
    ja: |-
      いつか仕留めたものが
      最後だったかもしれぬなぁ。
  event_arkguardian2_06_e_192:
    speaker: dorothy
    en: I wouldn't be so sure.
    ko: 그럴 거라는 생각은 들지 않는데요.
    ja: まったくそうは思えませんね。
  event_arkguardian2_06_e_193:
    speaker: dorothy
    en: You're far too optimistic.
    ko: 너무 낙관적이에요.
    ja: あなたは楽観的すぎます。
  event_arkguardian2_06_e_194:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_195:
    speaker: hongryeon
    en: Better that than clutching ever at the dread they might return.
    ko: 올지도 모른다는 불안감을 계속 끌어안고 있는 것보단 낫지 않겠나.
    ja: |-
      来るかもしれぬと不安を抱えすぎるよりは、
      良いと思うがねぇ。
  event_arkguardian2_06_e_196:
    speaker: dorothy
    en: "... You may be right to think that way."
    ko: "…그렇네요. 지금은 그렇게 생각하는 게 좋겠어요."
    ja: |-
      …そうですね。
      今はその方がいいかもしれません。
  event_arkguardian2_06_e_197:
    speaker: hongryeon
    en: Aye, sometimes one must delude oneself out of necessity.
    ko: 그래그래. 좋을 대로 생각하는 것도 필요하네.
    ja: |-
      そうそう。いい方に考えることも、
      時には大事だ。
  event_arkguardian2_06_e_198:
    speaker: dorothy
    en: Still, try to keep your wits about you.
    ko: 그래도 언제나 염두에는 둬 주세요.
    ja: ですが、油断はしないでください。
  event_arkguardian2_06_e_199:
    speaker: hongryeon
    en: I shall bear it in mind.
    ko: 알겠네. 명심하지.
    ja: 分かった。肝に銘じておこう。
  event_arkguardian2_06_e_200:
    speaker: snowwhite
    en: Raptures incoming.
    ko: 랩쳐 놈들이 온다.
    ja: ラプチャーどもが来る。
  event_arkguardian2_06_e_201:
    speaker: snowwhite
    en: Just a handful.
    ko: 수는 많지 않아.
    ja: 数は多くない。
  event_arkguardian2_06_e_202:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_203:
    speaker: dorothy
    en: Let's go.
    ko: 가죠.
    ja: 行きましょう。
  event_arkguardian2_06_e_204:
    speaker: hongryeon
    en: Phew...
    ko: "…후우."
    ja: "…ふぅ…"
  event_arkguardian2_06_e_205:
    speaker: rapunzel
    en: When will this end...
    ko: "…대체 언제까지…."
    ja: いったいいつまで…
  event_arkguardian2_06_e_206:
    speaker: "<Narration>"
    en: Another month later.
    ko: 또 한 달 후.
    ja: それからさらに1ヶ月後
  event_arkguardian2_06_e_207:
    speaker: dorothy
    en: How are the mass-produced Nikkes doing?
    ko: "…양산형 분들의 상태는 어떤가요."
    ja: "…量産型のみなさんの様子は？"
  event_arkguardian2_06_e_208:
    speaker: rapunzel
    en: Things have gone from bad to worse since their squad leader got corrupted.
    ko: "…얼마 전 스쿼드 리더가 침식에 당한 이후 많이 안 좋아요."
    ja: |-
      …この間、部隊長が侵食されてから、
      あまり良くありません。
  event_arkguardian2_06_e_209:
    speaker: dorothy
    en: "... I see."
    ko: "…그렇군요."
    ja: "…そうですか。"
  event_arkguardian2_06_e_210:
    speaker: rapunzel
    en: Let me say a quick prayer.
    ko: 기도를 올리고 올게요.
    ja: "…祈りを捧げてきます。"
  event_arkguardian2_06_e_211:
    speaker: rapunzel
    en: Call me if anything happens.
    ko: 무슨 일 생기면 불러줘요.
    ja: 何かあったらお呼びください。
  event_arkguardian2_06_e_212:
    speaker: dorothy
    en: Rapunzel.
    ko: "…라푼젤."
    ja: "…ラプンツェル。"
  event_arkguardian2_06_e_213:
    speaker: rapunzel
    en: Yes?
    ko: 예?
    ja: 何か？
  event_arkguardian2_06_e_214:
    speaker: dorothy
    en: It's nothing. I appreciate what you're doing.
    ko: |-
      아니, 아무것도 아니에요.
      수고해 주세요.
    ja: |-
      いえ、何でもありません。
      お疲れ様です。
  event_arkguardian2_06_e_215:
    speaker: rapunzel
    en: Don't mention it.
    ko: 예.
    ja: はい。
  event_arkguardian2_06_e_216:
    speaker: dorothy
    en: Snow White.
    ko: "…스노우 화이트."
    ja: "…スノーホワイト。"
  event_arkguardian2_06_e_217:
    speaker: snowwhite
    en: What is it?
    ko: 무슨 일이지.
    ja: どうした。
  event_arkguardian2_06_e_218:
    speaker: dorothy
    en: How are you feeling?
    ko: 어때요?
    ja: 大丈夫ですか？
  event_arkguardian2_06_e_219:
    speaker: snowwhite
    en: Nothing out of the ordinary so far.
    ko: 현재까진 이상 없다.
    ja: 今のところ戦闘に支障はない。
  event_arkguardian2_06_e_220:
    speaker: dorothy
    en: No, what I meant is, are you all right?
    ko: 그게 아니라, 스노우 화이트는 괜찮은지 물어본 거예요.
    ja: そうではなく、あなた自身のことです。
  event_arkguardian2_06_e_221:
    speaker: snowwhite
    en: Nothing out of the ordinary so far.
    ko: 현재까진 이상 없다.
    ja: 戦闘に支障はない。
  event_arkguardian2_06_e_222:
    speaker: dorothy
    en: "... I see."
    ko: "…그래요."
    ja: "…そうですか。"
  event_arkguardian2_06_e_223:
    speaker: hongryeon
    en: I shall step out for a moment.
    ko: 잠깐 나갔다 오겠네.
    ja: 少し出かけるとするよ。
  event_arkguardian2_06_e_224:
    speaker: dorothy
    en: You're going out? Where to?
    ko: 나가다니, 어디로요?
    ja: 出かけるとは、どこへ？
  event_arkguardian2_06_e_225:
    speaker: hongryeon
    en: My spirits have run dry. I shall fetch more.
    ko: 술이 다 떨어져 가서, 좀 구해오겠네.
    ja: 酒がなくなりそうだ。探してこねば。
  event_arkguardian2_06_e_226:
    speaker: dorothy
    en: Now's not the time for that!
    ko: 지금 그런 걸 할 때가…!
    ja: そんなことをしている状況じゃ…！
  event_arkguardian2_06_e_227:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_228:
    speaker: dorothy
    en: All right, fine. Be careful.
    ko: "…그래요. 조심히 갔다 와요."
    ja: "…いえ。お気をつけて。"
  event_arkguardian2_06_e_229:
    speaker: hongryeon
    en: Aye, I shall return.
    ko: "…그래. 다녀오겠네."
    ja: "…ああ。行ってくる。"
  event_arkguardian2_06_e_230:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_231:
    speaker: collectrobot
    en: Do you wish to contact the Ark?
    ko: 방주에 연락을 시도하시겠습니까?
    ja: アークに連絡しますか？
  event_arkguardian2_06_e_232:
    speaker: dorothy
    en: Affirmative.
    ko: 예.
    ja: はい。
  event_arkguardian2_06_e_233:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ――
  event_arkguardian2_06_e_234:
    speaker: collectrobot
    en: Communication open. All recorded messages will be transmitted to the Ark.
    ko: |-
      통신 개방.
      현 시간부터 기록된 음성을 방주에 전송 시도합니다.
    ja: |-
      通信解放。ただ今より
      記録された音声をアークに転送します。
  event_arkguardian2_06_e_235:
    speaker: collectrobot
    en: However, in the event of poor signal, transmission may fail.
    ko: 통신 상태가 좋지 않을 경우 음성 전송이 실패할 수 있습니다.
    ja: |-
      通信状態が悪い場合、音声の転送に失敗する
      可能性があります。
  event_arkguardian2_06_e_236:
    speaker: dorothy
    en: This is Dorothy, acting leader of the Goddess Squad. I have assumed this position
      due to the death of our former leader, Major Lilith.
    ko: |-
      저는 갓데스 스쿼드의 리더 대행 도로시.
      전 리더였던 릴리바이스 소령의 사망으로 인해 리더 대행을 맡습니다.
    ja: |-
      私はゴッデス部隊のリーダー代行、ドロシー。
      リーダーだったリリーバイス少佐の
      死亡により、リーダー代行を務めています。
  event_arkguardian2_06_e_237:
    speaker: dorothy
    en: Our current situation is as follows.
    ko: 방주에 갓데스 스쿼드의 현 상황을 보고합니다.
    ja: アークに、ゴッデス部隊の現状況を報告します。
  event_arkguardian2_06_e_238:
    speaker: dorothy
    en: Our mission is to protect those who have been deemed important and escort
      them from the surface to the massive underground facility known as the Ark.
    ko: |-
      지상의 주요 인력이 거대 지하 도시 [방주]로 이주하는 것을
      보호 및 가이드하는 작전.
    ja: |-
      巨大地下都市「アーク」へ移住する
      地上の重要人物を保護およびガイドする、
  event_arkguardian2_06_e_239:
    speaker: dorothy
    en: 'Operation: Ark Guardian is approximately 72% complete.'
    ko: "[아크 가디언] 작전은 달성률 72%라는 성공적인 수치로 완료되었습니다."
    ja: |-
      「アークガーディアン」作戦は
      達成率72％という数値で、成功を収めました。
  event_arkguardian2_06_e_240:
    speaker: dorothy
    en: There are officially no more humans remaining on the surface.
    ko: 현재 지상에 남은 인류는 공식적으로 없습니다.
    ja: |-
      現在、地上に残っている人類は
      公的にはおりません。
  event_arkguardian2_06_e_241:
    speaker: dorothy
    en: The Goddess Squad and several mass-produced Nikkes are stationed at temporary
      outposts situated at the Ark's entrance.
    ko: |-
      갓데스 스쿼드 및 다수의 양산형 니케들은 방주의 입구에 세워진
      임시 초소에 주둔하고 있으며.
    ja: |-
      ゴッデス部隊および多数の量産型ニケが
      アーク入口に建てられた
      臨時監視所に駐屯しており、
  event_arkguardian2_06_e_242:
    speaker: dorothy
    en: We are to protect the entrance against any future Rapture raids until the
      Ark is completed and sealed off.
    ko: |-
      방주가 완전히 닫혀 [밀봉]될 때까지
      랩쳐의 습격으로부터 입구를 보호하고 있습니다.
    ja: |-
      アークが完全に閉ざされ「封鎖」されるまで
      ラプチャーの襲撃から入口を守っています。
  event_arkguardian2_06_e_243:
    speaker: dorothy
    en: It is expected that we will be required to do this for approximately two months.
    ko: |-
      앞으로 두 달간 방주의 밀봉이 완료될 때까지
      보호를 계속해 나갈 예정입니다.
    ja: |-
      今後2ヶ月間、封鎖が完了するまで
      警備を続ける予定です。
  event_arkguardian2_06_e_244:
    speaker: dorothy
    en: However, the situation is becoming dire.
    ko: "…우리는 지금 위기에 처해 있습니다."
    ja: "…我々は今、危機に瀕しています。"
  event_arkguardian2_06_e_245:
    speaker: dorothy
    en: Our resources and troops are both slowly being depleted, and we are becoming
      physically drained due to the incessant fighting.
    ko: |-
      보급품과 인원은 점점 줄어들고 있으며,
      지속된 전투로 심신이 크게 지친 상태입니다.
    ja: |-
      補給品と人員はどんどん減っており、
      度重なる戦闘により、心身ともに
      極限状態です。
  event_arkguardian2_06_e_246:
    speaker: dorothy
    en: We do not expect any form of backup from the Ark.
    ko: 밀봉 중인 방주에 지원을 바라지는 않습니다.
    ja: 封鎖中であるアークからの支援は望みません。
  event_arkguardian2_06_e_247:
    speaker: dorothy
    en: We will do everything in our power to succeed.
    ko: |-
      우리는 우리의 사명을 끝까지 다할 것이며,
      성공할 것입니다.
    ja: |-
      私たちは最後まで使命を全うし、
      成功を収めるでしょう。
  event_arkguardian2_06_e_248:
    speaker: dorothy
    en: In exchange for this, you must promise us one thing.
    ko: 대신 약속해 주세요.
    ja: その代わり、約束してください。
  event_arkguardian2_06_e_249:
    speaker: dorothy
    en: Once the city has been sealed, we are to be taken back to the Ark,
    ko: 방주의 밀봉이 끝나면 우릴 방주로 데려가 줄 것을,
    ja: |-
      アークの封鎖が終わったら、
      私たちをアークに連れていくことを。
  event_arkguardian2_06_e_250:
    speaker: dorothy
    en: where we will be regarded as Goddess of Victory.
    ko: 그곳에서 우릴 승리의 여신으로 대우해 줄 것을.
    ja: |-
      アークで、私たちを勝利の女神として
      扱うことを。
  event_arkguardian2_06_e_251:
    speaker: dorothy
    en: Make us feel proud for continuing to fight for humanity.
    ko: |-
      인류를 위해 싸워왔던 우리가,
      계속 자부심을 느낄 수 있게 해 주십시오.
    ja: |-
      人類のために戦ってきた私たちが
      誇りを持てるよう、約束してください。
  event_arkguardian2_06_e_252:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_253:
    speaker: dorothy
    en: That is all. I will be waiting for your answer.
    ko: |-
      이상입니다.
      답변을 기다리고 있겠습니다.
    ja: |-
      以上です。
      返答をお待ちしております。
  event_arkguardian2_06_e_254:
    speaker: mirror
    en: It would be best to abandon the Heretic program, which relied on mass-produced
      human imposters.
    ko: 양산형 유사 인간들을 활용한 헬레틱 계획은 폐기하는 게 맞겠네요.
    ja: 量産型を利用する計画は失敗ですね。
  event_arkguardian2_06_e_255:
    speaker: mirror
    en: The base bodies and personalities are incomplete, leading to worse outcomes
      than doing nothing. The process is overly complicated.
    ko: |-
      소체와 자아의 완성도가 너무 떨어져서 안 하느니만 못하네요.
      공정만 복잡해서는.
    ja: |-
      ボディも自我も完成度が低すぎます。
      これでは何もしない方がマシですね。
      工程が複雑になるだけです。
  event_arkguardian2_06_e_256:
    speaker: mirror
    en: "... I wonder if something like Anachiro can ever be made again."
    ko: 흐음… 아나키오르 같은 건 이제 만들 수 없는 걸까요.
    ja: |-
      ふーむ…アナキオールのようなものは、
      もう作れないのでしょうか。
  event_arkguardian2_06_e_257:
    speaker: mirror
    en: Every now and then, a human imposter emerges with a sense of self that is
      remarkably complete,
    ko: 아주 간혹 자아의 완성도가 비상히 높은 유사 인간이 있는 것 같은데.
    ja: |-
      自我の完成度が非常に高い人間もどきも、
      ごく少数はいるようですが…
  event_arkguardian2_06_e_258:
    speaker: mirror
    en: but such occurrences are exceedingly rare.
    ko: 잘 없단 말이죠. 그런 고품질은.
    ja: |-
      滅多に見つかるものではありません。
      高品質の素材というものは。
  event_arkguardian2_06_e_259:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 부글부글.
    ja: ゴポゴポ…
  event_arkguardian2_06_e_260:
    speaker: mirror
    en: Which is precisely why my expectations for you are so high.
    ko: "…그래서 당신한테 거는 기대가 커요."
    ja: |-
      …だからこそ、あなたには
      大いに期待しているのです。
  event_arkguardian2_06_e_261:
    speaker: mirror
    en: I wanted to see what would happen if we created a Heretic from a human imposter
      with a strong sense of self.
    ko: 자아가 강한 유사 인간으로 헬레틱을 만들면 어떤 결과가 나올지 궁금해서 견딜 수 없네요.
    ja: |-
      自我の強い人間もどきを使えば、
      どんな結果になるか。
      気になって仕方ありません。
  event_arkguardian2_06_e_262:
    speaker: mirror
    en: It's also the second work Mother designed.
    ko: 그리고, 어머니가 설계한 두 번째 작품이기도 하고.
    ja: |-
      何より、お母様が直々に手がけられた
      2つ目の作品でもありますから。
  event_arkguardian2_06_e_263:
    speaker: mirror
    en: Come into being. You will play a crucial role.
    ko: 어서 태어나요. 당신은 저 위에 홀로 외롭게 떠돌고 계실.
    ja: |-
      待ち遠しいですね。
      あなたには、1人寂しくあそこを漂っている…
  event_arkguardian2_06_e_264:
    speaker: mirror
    en: You will deliver the "head" to our mother, who drifts alone above us.
    ko: 우리 어머니에게 [머리]를 안겨줄 중요한 역할을 맡고 있으니.
    ja: |-
      お母様に「頭」を届けるという、
      大事な使命があるのですから。
  event_arkguardian2_06_e_265:
    speaker: mirror
    en: Oh, I can't wait to see you soon.
    ko: 빨리 보고 싶네요.
    ja: 早くお顔を見せてください。
  event_arkguardian2_06_e_266:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 부글부글.
    ja: ゴポゴポ…
  event_arkguardian2_06_e_267:
    speaker: mirror
    en: Liberalio.
    ko: 리버렐리오.
    ja: リバーレリオ。
  event_arkguardian2_06_e_268:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_269:
    speaker: "<Narration>"
    en: Oswald goes over the minutes dozens of times.
    ko: 오스왈드는 회의록을 수십번 다시 본다.
    ja: オスワルドは会議録を何度も読み返した
  event_arkguardian2_06_e_270:
    speaker: "<Narration>"
    en: They concern follow-up actions regarding Operation Ark Guardian and the sealing
      of the Ark.
    ko: 아크 가디언 작전 및 방주 밀봉에 대한 후속 조치에 대한 회의록이다.
    ja: |-
      アークガーディアン作戦および
      アーク封鎖における
      今後の措置に関する決定事項…
  event_arkguardian2_06_e_271:
    speaker: "<Narration>"
    en: Operation Ark Guardian was a great success.
    ko: 아크 가디언 작전은 대성공.
    ja: アークガーディアン作戦は大きな成功を収めた
  event_arkguardian2_06_e_272:
    speaker: "<Narration>"
    en: The Ark's seal remains unstable.
    ko: 방주 밀봉은 불안정함.
    ja: しかし、アークの封鎖に不安要素が残っている
  event_arkguardian2_06_e_273:
    speaker: "<Narration>"
    en: It must be finished using the forces left on the surface.
    ko: 지상에 남은 잔존 병력을 통해 방주 밀봉을 마무리할 필요 있음.
    ja: |-
      地上に残存している戦力のみで
      対応を完遂する必要あり
  event_arkguardian2_06_e_274:
    speaker: "<Narration>"
    en: The Goddess Squad is still active and continues to provide updates.
    ko: 갓데스 스쿼드의 건재 확인. 지속적으로 연락이 오고 있음.
    ja: |-
      ゴッデス部隊はいまだ健在、
      現在も定期的な連絡あり
  event_arkguardian2_06_e_275:
    speaker: "<Narration>"
    en: The task of finalizing the sealing process will be assigned to the Goddess
      Squad.
    ko: 갓데스 스쿼드에게 밀봉 마무리 작전을 맡길 것.
    ja: ゴッデス部隊にこの対応を行わせる
  event_arkguardian2_06_e_276:
    speaker: "<Narration>"
    en: Oswald is the best fit for this final operation.
    ko: 해당 마무리 작전의 총책임자는 오스왈드가 적합.
    ja: |-
      本計画に最も適する総責任者として
      オスワルドを指名する
  event_arkguardian2_06_e_277:
    speaker: "<Narration>"
    en: 'Regarding the handling of the Goddess Squad upon their return:'
    ko: 이후 갓데스 스쿼드의 처분에 대해.
    ja: 事後のゴッデス部隊処分について
  event_arkguardian2_06_e_278:
    speaker: "<Narration>"
    en: Their arrival in the Ark poses significant risks,
    ko: 방주 복귀 시 리스크 매우 높음.
    ja: アークへの受け入れは危険性極めて高し
  event_arkguardian2_06_e_279:
    speaker: "<Narration>"
    en: including idolization and the potential for deification.
    ko: 신격화 및 우상화 우려.
    ja: 神格化、偶像化の可能性あり
  event_arkguardian2_06_e_280:
    speaker: "<Narration>"
    en: Their reputation and prestige are likely to greatly surpass those of the Central
      Government.
    ko: 현 중앙 정부의 영향력을 아득히 초월할 것으로 추정.
    ja: |-
      現中央政府を大幅に超えた
      影響力となりうることを懸念
  event_arkguardian2_06_e_281:
    speaker: "<Narration>"
    en: Given the instability of the current situation, the risk is exceptionally
      high.
    ko: 정세가 불안한 시점인 만큼 리스크 매우 높음.
    ja: |-
      情勢不安定の現在、
      許容しがたいリスクが認められる
  event_arkguardian2_06_e_282:
    speaker: "<Narration>"
    en: The same protocol used for second-generation traitors may be applicable.
    ko: 배신자 2세대의 포멧을 동일하게 적용할 수 있을 것.
    ja: |-
      第2世代の反逆時と同一の
      対処フォーマットを適用する
  event_arkguardian2_06_e_283:
    speaker: "<Narration>"
    en: Charges of collusion with Raptures may potentially be imposed. Relevant documentation
      has been prepared.
    ko: |-
      랩쳐와의 내통 혐의 적용 가능.
      자료는 준비되어 있음.
    ja: |-
      ラプチャーとの内通疑惑として処理、
      資料はすでに準備が完了
  event_arkguardian2_06_e_284:
    speaker: "<Narration>"
    en: Red Shoes' corruption research can be transferred under Rapunzel's name. V.T.C.
      is fully on board.
    ko: |-
      레드 슈즈의 침식 연구는 라푼젤의 것으로 전환 가능.
      V.T.C.에서도 매우 협조적.
    ja: |-
      レッドシューズによる侵食研究の責任を
      ラプンツェルに転嫁、
      V.T.C.はきわめて協力的
  event_arkguardian2_06_e_285:
    speaker: "<Narration>"
    en: Regarding the plan to execute the Goddess Squad at the Ark entrance under
      the pretext of corruption,
    ko: 침식을 빌미로 방주 입구에서 처단하는 안에 대해.
    ja: |-
      内通の嫌疑により
      アークのゲートにて処分を行う案について
  event_arkguardian2_06_e_286:
    speaker: "<Narration>"
    en: Enikk is uncooperative. Armed suppression involves significant risks and may
      likely expose the plan to the public.
    ko: |-
      에닉이 비협조적. 무력 제압은 리스크 높음.
      시민에게 노출 가능성도 높음.
    ja: |-
      エニックが非協力的、
      また武力制圧は高いリスクを伴う、
      市民の知るところとなる可能性高し
  event_arkguardian2_06_e_287:
    speaker: "<Narration>"
    en: Political and social erasure is the most effective method.
    ko: 정치적, 사회적 말살이 가장 효과적.
    ja: 政治的・社会的な抹消が最も効果的と判断
  event_arkguardian2_06_e_288:
    speaker: "<Narration>"
    en: The Commander of the Goddess Squad is a risk factor.
    ko: 갓데스 스쿼드의 지휘관이 불안 요소.
    ja: ゴッデス部隊の指揮官は懸念事項
  event_arkguardian2_06_e_289:
    speaker: "<Narration>"
    en: He is currently comatose and being monitored by V.T.C.
    ko: 갓데스 스쿼드의 지휘관은 현재 V.T.C.에 의해 혼수상태 유지 중.
    ja: 現在はV.T.C.の施設にて昏睡状態
  event_arkguardian2_06_e_290:
    speaker: "<Narration>"
    en: The other witnesses who rode the elevator with him have been eliminated. Not
      a single soul knows the Commander survived.
    ko: 갓데스 스쿼드의 지휘관과 같은 엘리베이터에 탑승한 목격자들은 이미 처분 완료. 지휘관의 생존 여부는 아무도 모름.
    ja: |-
      同じエレベーターに乗り合わせていた
      目撃者はすでに処分完了、
      指揮官の生存状態に関する情報は秘匿済
  event_arkguardian2_06_e_291:
    speaker: "<Narration>"
    en: The Goddess Squad has no backing. Political and social erasure is feasible.
    ko: 갓데스 스쿼드의 뒷배는 없는 상황. 정치적, 사회적으로 말살에 용이.
    ja: |-
      ゴッデス部隊に他の後ろ盾はなく
      政治的・社会的な抹消に支障なし
  event_arkguardian2_06_e_292:
    speaker: "<Narration>"
    en: Lifelong house arrest and isolation are appropriate and ideal.
    ko: 평생 자택 연금을 통한 고립이 적합.
    ja: |-
      生涯にわたる自宅軟禁により
      外部との接触を断つことが妥当
  event_arkguardian2_06_e_293:
    speaker: "<Narration>"
    en: The technology used in the Grimms model is of the highest quality and includes
      valuable battle data.
    ko: |-
      페어리 테일 모델에 적용된 기술은 우수.
      양질의 배틀 데이터도 있음.
    ja: |-
      フェアリーテールモデルは
      高水準の技術が適用されており、
      良質なバトルデータを保持している
  event_arkguardian2_06_e_294:
    speaker: "<Narration>"
    en: Dismantling and subsequent research are among the considerations.
    ko: 분해 후 연구도 고려 사항 중 하나.
    ja: 分解後の研究を検討中
  event_arkguardian2_06_e_295:
    speaker: "<Narration>"
    en: 'Conclusion:'
    ko: 결론.
    ja: 総括
  event_arkguardian2_06_e_296:
    speaker: "<Narration>"
    en: Initiate the final phase of the Ark sealing operation with the Goddess Squad.
    ko: 갓데스 스쿼드를 활용해 방주 밀봉 막바지 작업 착수.
    ja: |-
      アーク封鎖の最終段階に
      ゴッデス部隊を活用する
  event_arkguardian2_06_e_297:
    speaker: "<Narration>"
    en: Upon their return,
    ko: 방주 복귀 후.
    ja: アークへの帰還受け入れ後は…
  event_arkguardian2_06_e_298:
    speaker: "<Narration>"
    en: dispose of them in a manner that does not provoke the citizens.
    ko: 시민들에게 반발을 사지 않는 방향으로 처분.
    ja: 市民の反発が発生しない方法にて、処分のこと
  event_arkguardian2_06_e_299:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_300:
    speaker: "<Narration>"
    en: Oswald fights the urge to hurl his phone.
    ko: 오스왈드는 핸드폰을 집어던지고 싶은 충동에 휩싸였다.
    ja: |-
      オスワルドは端末を
      投げ捨てたい衝動に駆られた
  event_arkguardian2_06_e_301:
    speaker: "<Narration>"
    en: He covers his face.
    ko: 얼굴을 감싸 쥔다.
    ja: それから、両手で顔を覆った
  event_arkguardian2_06_e_302:
    speaker: "<Narration>"
    en: After a moment,
    ko: 잠시 후.
    ja: 短い時間が経ち…
  event_arkguardian2_06_e_303:
    speaker: "<Narration>"
    en: a resolve settles over him.
    ko: 오스왈드의 얼굴에 결연함이 떠올랐다.
    ja: オスワルドの瞳に意思の光が戻った
  event_arkguardian2_06_e_304:
    speaker: oswald_o
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_305:
    speaker: "<Narration>"
    en: The thought of his upcoming plan makes him feel nauseous,
    ko: 앞으로의 자신의 [계획]에 대해 생각하자 구역질이 올라왔다.
    ja: |-
      これから自分が進める「計画」のことを
      考えると、吐き気がする
  event_arkguardian2_06_e_306:
    speaker: "<Narration>"
    en: but he must see it through.
    ko: 하지만 해야 한다.
    ja: だが、やらねばならない
  event_arkguardian2_06_e_307:
    speaker: "<Narration>"
    en: They must remain as idols.
    ko: 그들은
    ja: 彼女たちは
  event_arkguardian2_06_e_308:
    speaker: "<Narration>"
    en: Forever.
    ko: 영원히 우상으로 남아야 한다.
    ja: 永遠に偶像として残るべきだ
  event_arkguardian2_06_e_309:
    speaker: "<Narration>"
    en: Oswald looks at the picture frame on the table.
    ko: 오스왈드는 테이블 위에 놓인 액자를 본다.
    ja: |-
      オスワルドはテーブルの上に置かれた
      写真立てに目をやった
  event_arkguardian2_06_e_310:
    speaker: "<Narration>"
    en: It is a photo commemorating the Goddess Squad's first deployment.
    ko: 갓데스 스쿼드의 첫 출진을 기념하는 사진이다.
    ja: ゴッデス部隊、初陣の記念写真だ
  event_arkguardian2_06_e_311:
    speaker: "<Narration>"
    en: With a weary motion, he salutes the photo.
    ko: 오스왈드는 축 처진 동작으로, 사진을 향해 경례한다.
    ja: |-
      オスワルドは疲れ果てたしぐさで
      写真に向かい、敬礼した
  event_arkguardian2_06_e_312:
    speaker: oswald_o
    en: My deepest gratitude to the Goddess Squad,
    ko: 인류를 위해 싸워준.
    ja: 人類のために戦う…
  event_arkguardian2_06_e_313:
    speaker: oswald_o
    en: who fought for humanity.
    ko: 갓데스 스쿼드에게 감사를.
    ja: ゴッデス部隊に感謝を。
  event_arkguardian2_06_e_314:
    speaker: "<Narration>"
    en: Snow White opens her eyes.
    ko: 스노우 화이트가 눈을 뜬다.
    ja: スノーホワイトが目を覚ました
  event_arkguardian2_06_e_315:
    speaker: "<Narration>"
    en: Her body feels light.
    ko: 몸이 가볍다.
    ja: 身体が軽い
  event_arkguardian2_06_e_316:
    speaker: "<Narration>"
    en: It seems she has adapted to her body.
    ko: 아무래도 지금의 바디에 제대로 적응한 모양이다.
    ja: 新しいボディがなじんできたようだ
  event_arkguardian2_06_e_317:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_318:
    speaker: cecil_op_r
    en: You up?
    ko: 일어났나요?
    ja: 目が覚めましたか？
  event_arkguardian2_06_e_319:
    speaker: snowwhite_h_no
    en: Yes.
    ko: 그래.
    ja: ああ。
  event_arkguardian2_06_e_320:
    speaker: cecil_op_r
    en: I've finished calibrating your armaments.
    ko: 무장의 최종 조정이 끝났어요.
    ja: 武器の最終調整が終わりました。
  event_arkguardian2_06_e_321:
    speaker: cecil_op_r
    en: Let's get you suited up.
    ko: 장착해 보죠.
    ja: 装着してみてください。
  event_arkguardian2_06_e_322:
    speaker: snowwhite_h_no
    en: I'm heading to the hangar.
    ko: 격납고로 가겠다.
    ja: 整備室に向かう。
  event_arkguardian2_06_e_323:
    speaker: cecil_op_r
    en: I'll meet you there.
    ko: 예. 거기서 뵙죠.
    ja: はい。ではそちらで。
  event_arkguardian2_06_e_324:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삐잇-
    ja: ピッ
  event_arkguardian2_06_e_325:
    speaker: "<Narration>"
    en: Snow White sits up
    ko: 스노우 화이트가 몸을 일으킨다.
    ja: スノーホワイトが体を起こした
  event_arkguardian2_06_e_326:
    speaker: "<Narration>"
    en: and looks in the mirror.
    ko: 거울을 바라본다.
    ja: 鏡をのぞきこむ
  event_arkguardian2_06_e_327:
    speaker: snowwhite_h_no
    en: "... Tear stains."
    ko: "…눈물 자국."
    ja: "…涙の跡がある。"
  event_arkguardian2_06_e_328:
    speaker: "<Narration>"
    en: She leaves the room
    ko: 방을 나선다.
    ja: 部屋を出た
  event_arkguardian2_06_e_329:
    speaker: "<Narration>"
    en: and walks down the corridor,
    ko: 복도를 걷는다.
    ja: 廊下を進み…
  event_arkguardian2_06_e_330:
    speaker: "<Narration>"
    en: stopping before she reaches the hangar.
    ko: 격납고 앞에 멈춰 선다.
    ja: 整備室の前で立ち止まった
  event_arkguardian2_06_e_331:
    speaker: snowwhite_h_no
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_06_e_332:
    speaker: snowwhite_h_no
    en: Lilith...
    ko: "…언니."
    ja: "…お姉ちゃん。"
  event_arkguardian2_06_e_333:
    speaker: "<Narration>"
    en: Snow White opens the door to the hangar.
    ko: 스노우 화이트는 격납고의 문을 열었다.
    ja: スノーホワイトは扉を開いた
  arkguardian:
    speaker: "<>"
    en:
    ko:
    ja:
  event_arkguardian2_06_e_336:
    speaker: "<Narration>"
    en: 'ARK GUARDIAN: END'
    ko: 'ARK GUARDIAN : END'
    ja: 'ARK GUARDIAN : END'
event_arkguardian2_epilogue:
  event_arkguardian2_epilogue_1:
    speaker: cecil
    en: I loaded you up with as many weapons as you requested.
    ko: 당신이 원하는 대로 최대한 많은 무장을 실었어요.
    ja: |-
      希望通り、できるだけ
      大量の武器を搭載しました。
  event_arkguardian2_epilogue_2:
    speaker: cecil
    en: Since you were so dead set on keeping the loadout you've been using,
    ko: 기존에 당신이 사용하던 무장들을 유지하고 싶다던 요청에 따라.
    ja: |-
      今まで使っていたものは
      そのまま使いたいということでしたので…
  event_arkguardian2_epilogue_3:
    speaker: cecil
    en: I consolidated and did some reorganizing based on the Seven Dwarves functions.
    ko: 세븐스 드워프는 기능별로 구분해서 통폐합했고요.
    ja: |-
      セブンスドワーフは
      機能別に統合、整理を行いました。
  event_arkguardian2_epilogue_4:
    speaker: snowwhite_h
    en: It still feels light.
    ko: 아직 가벼운데.
    ja: まだ軽いな。
  event_arkguardian2_epilogue_5:
    speaker: cecil
    en: This setup is nearly three times heavier than the last one.
    ko: "…실제 무게를 비교하면, 지금 쪽이 3배 가까이 무거워요."
    ja: |-
      …実際の重量差としては、
      今の方が3倍ほど重いはずです。
  event_arkguardian2_epilogue_6:
    speaker: cecil
    en: The individual units may be light, but their total weight is greater than
      before. You understand what that means, don't you?
    ko: 경량화된 무장들인데, 최종 무게가 더 무겁다는 말이 뭐겠어요?
    ja: |-
      武装の軽量化を始めたはずが、
      最終的に以前より重くなるというのは
      理解しがたいことですが…
  event_arkguardian2_epilogue_7:
    speaker: cecil
    en: It means I loaded you up with as many weapons as I could.
    ko: 그만큼 꾹꾹 눌러 담았다는 얘기에요.
    ja: それだけ詰め込んであるということです。
  event_arkguardian2_epilogue_8:
    speaker: snowwhite_h
    en: And yet, it still feels light.
    ko: 그런데 가볍다.
    ja: だが、まだ軽い。
  event_arkguardian2_epilogue_9:
    speaker: cecil
    en: You can't carry all that weight using brute force alone,
    ko: 그 무게를 아무런 보조 장비 없이 무식하게 짊어지고 다닐 수 없으니까.
    ja: |-
      こんな重量を何の補助もなく
      背負うのは無謀です。
  event_arkguardian2_epilogue_10:
    speaker: cecil
    en: so I've added load-bearing auxiliary arms.
    ko: 무게 분산형 서브 암들을 등에 장착했어요.
    ja: |-
      負荷を分散するためのサブアームを
      背面に取り付けてあります。
  event_arkguardian2_epilogue_11:
    speaker: cecil
    en: They're doing the heavy lifting for you.
    ko: 그 장비들이 대신 들어주고 있는 거죠.
    ja: 武器を代わりに保持する機能があります。
  event_arkguardian2_epilogue_12:
    speaker: snowwhite_h
    en: I see. That's good.
    ko: 그렇군. 좋은 거군.
    ja: そうか。それはいい。
  event_arkguardian2_epilogue_13:
    speaker: cecil
    en: Yes, thank you for understanding.
    ko: 그래요. 알아들어 줘서 고마워요.
    ja: ええ。理解していただけて安心しました。
  event_arkguardian2_epilogue_14:
    speaker: snowwhite_h
    en: Are they combat-ready?
    ko: 바로 실전에 투입할 수 있나?
    ja: このまま戦えるか？
  event_arkguardian2_epilogue_15:
    speaker: cecil
    en: Of course.
    ko: 물론이에요.
    ja: もちろんです。
  event_arkguardian2_epilogue_16:
    speaker: snowwhite_h
    en: Then there's somewhere I must go.
    ko: 그럼 잠시 다녀올 곳이 있다.
    ja: それなら、少し出かけてくる。
  event_arkguardian2_epilogue_17:
    speaker: cecil
    en: Where?
    ko: 어디로요?
    ja: どちらへ？
  event_arkguardian2_epilogue_18:
    speaker: snowwhite_h
    en: The Ark entrance... or what used to be.
    ko: |-
      방주 입구.
      였던 곳.
    ja: アークの入口…だった場所だ。
  event_arkguardian2_epilogue_19:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_epilogue_20:
    speaker: cecil
    en: Why?
    ko: 왜요?
    ja: なぜ？
  event_arkguardian2_epilogue_21:
    speaker: snowwhite_h
    en: There is something I wish to see.
    ko: 봐두고 싶은 게 있으니까.
    ja: 確かめたいものがある。
  event_arkguardian2_epilogue_22:
    speaker: cecil
    en: Hmm...
    ko: 흠….
    ja: ふーむ…
  event_arkguardian2_epilogue_23:
    speaker: cecil
    en: Won't it be dangerous if you go alone?
    ko: 위험하지 않겠어요? 혼자서.
    ja: 危険ではありませんか？単独行動は。
  event_arkguardian2_epilogue_24:
    speaker: snowwhite_h
    en: Not at all.
    ko: 전혀.
    ja: 問題ない。
  event_arkguardian2_epilogue_25:
    speaker: cecil
    en: All right, go ahead. Just stay in contact.
    ko: 좋아요. 다녀와요. 연락은 계속해 주시고요.
    ja: |-
      分かりました。引き止めはしません。
      ただし連絡はしてください。
  event_arkguardian2_epilogue_26:
    speaker: snowwhite_h
    en: Will do.
    ko: 그래.
    ja: ああ。
  event_arkguardian2_epilogue_27:
    speaker: "<Narration>"
    en: Snow White stands in a field of pure white flowers.
    ko: 스노우 화이트는 새하얀 꽃밭에 섰다.
    ja: スノーホワイトは一面の白い花畑に立った
  event_arkguardian2_epilogue_28:
    speaker: snowwhite_h
    en: It's still here...
    ko: "…아직. 남아있군."
    ja: "…まだ、残っているな。"
  event_arkguardian2_epilogue_29:
    speaker: "<Narration>"
    en: She crouches down,
    ko: 쪼그리고 앉는다.
    ja: 腰を落とし…
  event_arkguardian2_epilogue_30:
    speaker: "<Narration>"
    en: and studies the white blossoms closely.
    ko: 새하얀 꽃을 자세히 들여다본다.
    ja: 白い花をのぞきこんだ
  event_arkguardian2_epilogue_31:
    speaker: snowwhite_h
    en: "... It's different."
    ko: "…달라."
    ja: "…違う。"
  event_arkguardian2_epilogue_32:
    speaker: "<Narration>"
    en: The flowers are imperceptibly different,
    ko: 미묘하게 다른 꽃이다.
    ja: 探しているものと、かすかな違いがある
  event_arkguardian2_epilogue_33:
    speaker: "<Narration>"
    en: possibly due to natural changes that have occurred over the past century,
    ko: 이전의 꽃이 100여 년의 시간이 지나며 성질이 변한 것인지.
    ja: 100年余りの時が、あの花を変えたのか…
  event_arkguardian2_epilogue_34:
    speaker: "<Narration>"
    en: or they may be entirely different flowers.
    ko: 아니면 아예 다른 꽃인지 알 수 없다.
    ja: それとも、最初から別の花なのか
  event_arkguardian2_epilogue_35:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_epilogue_36:
    speaker: snowwhite_h
    en: Cecil.
    ko: 세실.
    ja: セシル。
  event_arkguardian2_epilogue_37:
    speaker: cecil_op_r
    en: Thank you for reaching out. What can I do for you, Snow White?
    ko: 연락해 줘서 고맙네요. 무슨 일이죠?
    ja: |-
      ご連絡ありがとうございます。
      どうかしましたか？
  event_arkguardian2_epilogue_38:
    speaker: snowwhite_h
    en: Is Eden's technology capable of cultivating flowers in large quantities?
    ko: 에덴의 기술로 꽃을 대량으로 재배할 수 있나?
    ja: エデンの技術で花の大量栽培はできないか？
  event_arkguardian2_epilogue_39:
    speaker: cecil_op_r
    en: It's possible, yes.
    ko: 할 수 있어요.
    ja: 可能ではあります。
  event_arkguardian2_epilogue_40:
    speaker: cecil_op_r
    en: However, I wouldn't recommend it. Flowers do little to satisfy hunger.
    ko: |-
      하지만 추천은 못 하겠네요.
      꽃은 배부른 것과는 거리가 멀거든요.
    ja: |-
      ですが、お勧めはしません。
      花でお腹はふくれませんよ。
  event_arkguardian2_epilogue_41:
    speaker: snowwhite_h
    en: I don't intend to eat them.
    ko: 먹으려고 하는 게 아니다.
    ja: 食べるつもりではない。
  event_arkguardian2_epilogue_42:
    speaker: cecil_op_r
    en: I see. My apologies.
    ko: 그렇군요. 미안해요.
    ja: そうでしたか、失礼しました。
  event_arkguardian2_epilogue_43:
    speaker: snowwhite_h
    en: "... Can you restore a flower to how it used to look?"
    ko: 그럼, 모습이 바뀐 꽃을 다시 원래대로 돌려놓을 수 있나?
    ja: |-
      昔と形が変わった花を、
      元に戻すことはできるか？
  event_arkguardian2_epilogue_44:
    speaker: cecil_op_r
    en: Restore a flower to its original look?
    ko: 모습이 바뀐 꽃을 원래대로요?
    ja: 形質が変化した花を、以前の状態に…？
  event_arkguardian2_epilogue_45:
    speaker: cecil_op_r
    en: That might be tough.
    ko: 그건 힘들어요.
    ja: それは難しいでしょうね。
  event_arkguardian2_epilogue_46:
    speaker: cecil_op_r
    en: Its shape has adapted to blend in with its environment,
    ko: 환경이나 상황에 맞춰 형태를 바꾼 것일 테니까.
    ja: |-
      環境や状況に合わせて
      変化していくものですから。
  event_arkguardian2_epilogue_47:
    speaker: cecil_op_r
    en: so there's no way to revert that process.
    ko: 다시 되돌릴 수 없죠.
    ja: 一度変わったものは、元に戻りません。
  event_arkguardian2_epilogue_48:
    speaker: cecil_op_r
    en: Depending on the specific mutation, it might have become an entirely different
      species.
    ko: |-
      어떤 변화가 일어났느냐에 따라 다르겠지만,
      아예 다른 종에 가까운 뭔가가 되었을지도 모르죠.
    ja: |-
      どのような変化かにもよりますが、
      もはや別の存在になっているという
      可能性もありますね。
  event_arkguardian2_epilogue_49:
    speaker: snowwhite_h
    en: "..."
    ko: "……."
    ja: "……"
  event_arkguardian2_epilogue_50:
    speaker: snowwhite_h
    en: I see. Thank you.
    ko: 그래. 고맙다.
    ja: そうか。分かった。
  event_arkguardian2_epilogue_51:
    speaker: cecil_op_r
    en: Did you find what you were looking for?
    ko: 확인할 건 다 했나요?
    ja: 確かめたいことというのはそれでしたか？
  event_arkguardian2_epilogue_52:
    speaker: snowwhite_h
    en: I'm heading back.
    ko: 이제 돌아간다.
    ja: 今から帰還する。
  event_arkguardian2_epilogue_53:
    speaker: cecil_op_r
    en: The Counters are arriving soon. Come quickly.
    ko: |-
      카운터스가 곧 도착할 거예요.
      빨리 와요.
    ja: |-
      カウンターズがもうすぐ到着します。
      早く戻ってきてください。
  event_arkguardian2_epilogue_54:
    speaker: "<Narration>"
    en: Snow White reaches out her hand,
    ko: 스노우 화이트는 손을 뻗는다.
    ja: スノーホワイトは手を伸ばし…
  event_arkguardian2_epilogue_55:
    speaker: "<Narration>"
    en: and plucks a flower.
    ko: 꽃을 꺾는다.
    ja: 花を摘み取った
  event_arkguardian2_epilogue_56:
    speaker: "<Narration>"
    en: She brings it to her nose and inhales.
    ko: 코로 가져가 향기를 맡는다.
    ja: 鼻に近づけ、香りを感じる
  event_arkguardian2_epilogue_57:
    speaker: "<Narration>"
    en: The scent is strong, but it is not the scent she remembers.
    ko: 강한 향. 하지만 알고 있던 것과는 다른 향.
    ja: 強い香りだ。だが、記憶の中にあるものではない
  event_arkguardian2_epilogue_58:
    speaker: "<Narration>"
    en: She sets the plucked flower back down on the ground,
    ko: 스노우 화이트는 꺾은 꽃을 바닥에 내려놓는다.
    ja: スノーホワイトは摘み取った花を地面に置き…
  event_arkguardian2_epilogue_59:
    speaker: "<Narration>"
    en: then turns around and walks away.
    ko: 그리고 등을 돌려 걸어갔다.
    ja: 背を向けて歩き去った
  event_arkguardian2_epilogue_60:
    speaker: snowwhite_h
    en: "... I guess there's no reason to come back."
    ko: "…다시 올 일은 없겠군."
    ja: "…もう二度と来ることはないな。"
  event_arkguardian2_epilogue_61:
