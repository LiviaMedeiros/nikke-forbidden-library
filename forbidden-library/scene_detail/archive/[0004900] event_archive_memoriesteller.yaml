---
event_ce006_1_prologue:
  event_ce006_1_prologue_1:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 덜컹- 덜컹-
    ja: ガタ、ガタ…
  event_ce006_1_prologue_2:
    speaker: roam
    en: A plate.
    ko: 접시.
    ja: 皿。
  event_ce006_1_prologue_3:
    speaker: roam
    en: An implement used when eating.
    ko: 식사할 때 쓰는 것.
    ja: 食事の時に使うもの。
  event_ce006_1_prologue_4:
    speaker: roam
    en: It is useful. Transport.
    ko: 쓸모 있다. 운반한다.
    ja: 有用。運搬する。
  event_ce006_1_prologue_5:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 덜컹- 덜컹-
    ja: ガタ、ガタ…
  event_ce006_1_prologue_6:
    speaker: roam
    en: A statue.
    ko: 석상.
    ja: 石像。
  event_ce006_1_prologue_7:
    speaker: roam
    en: Often placed by an entrance or against a wall to flaunt wealth or exhibit
      one's taste.
    ko: 입구나 벽면에 세워 놓고 재력이나 취향을 뽐내는 것.
    ja: |-
      出入口や壁面を装飾し、
      財力や嗜好を誇示するために使うもの。
  event_ce006_1_prologue_8:
    speaker: roam
    en: It can also serve a symbolic function.
    ko: 상징물로도 사용 가능한 것.
    ja: 何かの象徴にも使われる。
  event_ce006_1_prologue_9:
    speaker: roam
    en: It is useful. Transport.
    ko: 쓸모 있다. 운반한다.
    ja: 有用。運搬する。
  event_ce006_1_prologue_10:
    speaker: roam
    en: Complication. Volume limit exceeded.
    ko: 문제. 부피 초과.
    ja: 問題。体積過大。
  event_ce006_1_prologue_11:
    speaker: roam
    en: Transport on hold.
    ko: 운반 보류.
    ja: 運搬、保留。
  event_ce006_1_prologue_12:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 덜컹- 덜컹-
    ja: ガタ、ガタ…
  event_ce006_1_prologue_13:
    speaker: roam
    en: A flowerpot.
    ko: 화분.
    ja: 花びん。
  event_ce006_1_prologue_14:
    speaker: roam
    en: A decorative object used to hold flowers.
    ko: 꽃을 장식할 수 있는 것.
    ja: 花を飾るために使うもの。
  event_ce006_1_prologue_15:
    speaker: roam
    en: It is useful. Transport.
    ko: 쓸모 있다. 운반한다.
    ja: 有用。運搬する。
  event_ce006_1_prologue_16:
    speaker: "<Narration>"
    en: "*Beep beep*"
    ko: 삐잇- 삐잇
    ja: ピーッ、ピーッ――
  event_ce006_1_prologue_17:
    speaker: roam
    en: Transportable weight limit reached.
    ko: 운반 가능 중량 한계.
    ja: 積載量の限界。
  event_ce006_1_prologue_18:
    speaker: roam
    en: Go back.
    ko: 돌아간다.
    ja: 帰る。
  event_ce006_1_prologue_19:
    speaker: "<Narration>"
    en: Roam turns itself around, the container on its back filled to the brim with
      various items.
    ko: 롬은 등 뒤 컨테이너에 각종 물품을 가득 싣고 몸을 돌렸다.
    ja: |-
      ロムは背面のコンテナに様々な資材を
      大量に詰め込み、向きを変えた
  event_ce006_1_prologue_20:
    speaker: roam
    en: Calculating time until return.
    ko: 복귀까지 걸리는 시간 계산 중.
    ja: 帰還までの予測時間を計算中…
  event_ce006_1_prologue_21:
    speaker: "<Narration>"
    en: "*Kooooo*"
    ko: 쿠우우우---
    ja: ゴゴゴゴゴ――
  event_ce006_1_prologue_22:
    speaker: roam
    en: Warning. Loud noise detected.
    ko: 경고. 시끄러운 소리.
    ja: 注意。異常な騒音。
  event_ce006_1_prologue_23:
    speaker: roam
    en: Coming from above.
    ko: 상공에서 들린다.
    ja: 上空から。
  event_ce006_1_prologue_24:
    speaker: "<Narration>"
    en: Roam lifts its head and looks toward the sky,
    ko: 롬은 고개를 들어 하늘을 쳐다보았다.
    ja: ロムは頭部を持ち上げ、空をあおいだ
  event_ce006_1_prologue_25:
    speaker: "<Narration>"
    en: revealing a massive transport aircraft with four legs.
    ko: 다리가 넷 달린 거대한 수송선이다.
    ja: 巨大な輸送機らしきものが空を飛んでいた
  event_ce006_1_prologue_26:
    speaker: "<Narration>"
    en: Plumes of fire burst from the appendages as the aircraft slowly descends.
    ko: |-
      넷의 다리에서는 불이 뿜어져 나오고 있었고,
      수송기는 서서히 하강한다.
    ja: |-
      4本の脚部から噴き出す炎が、
      機体をゆるやかに下降させている
  event_ce006_1_prologue_27:
    speaker: "<Narration>"
    en: For some reason, its movements seem unstable.
    ko: 하지만 어째서인지 위태위태한 움직임이다.
    ja: だが、その態勢はおぼつかなかった
  event_ce006_1_prologue_28:
    speaker: roam
    en: Not Rapture.
    ko: 랩쳐. 아니다.
    ja: ラプチャー…ではない。
  event_ce006_1_prologue_29:
    speaker: roam
    en: First time seeing.
    ko: 처음 보는 것.
    ja: 初めて見るもの。
  event_ce006_1_prologue_30:
    speaker: "<Narration>"
    en: "*Kooooo*"
    ko: 쿠우우우---
    ja: ゴゴゴゴゴ――
  event_ce006_1_prologue_31:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 쿠웅--!!
    ja: ドカン――！！
  event_ce006_1_prologue_32:
    speaker: "<Narration>"
    en: The aircraft crash lands on the ground.
    ko: 수송기는 바닥에 반쯤 추락하듯 착지했다.
    ja: |-
      輸送機は墜落も同然の勢いで、
      かろうじて不時着した
  event_ce006_1_prologue_33:
    speaker: roam
    en: First sighting. High probability of substantial value.
    ko: |-
      처음 보는 것.
      귀한 것일 가능성 높다.
    ja: |-
      初めて見るもの。
      貴重なものである可能性が高い。
  event_ce006_1_prologue_34:
    speaker: roam
    en: Transport.
    ko: 운반한다.
    ja: 運搬する。
  event_ce006_1_prologue_35:
    speaker: roam
    en: "... Is transport possible?"
    ko: "---운반, 가능한가?"
    ja: "…運搬は、可能か？"
  event_ce006_1_prologue_36:
    speaker: "<Narration>"
    en: Roam moves toward the grounded transport aircraft.
    ko: 롬은 착지한 수송기를 향해 이동했다.
    ja: ロムは着陸した輸送機に近づいた
  event_ce006_1_prologue_37:
    speaker: "<Narration>"
    en: "*Pshh*"
    ko: 푸슉-!
    ja: プシューッ！
  event_ce006_1_prologue_38:
    speaker: "<Narration>"
    en: A ramp extends from one side of the airship and touches the ground.
    ko: 수송기의 한쪽면에서 발판이 내려와 지면에 닿는다.
    ja: 輸送機から乗降用の足場が伸びた
  event_ce006_1_prologue_39:
    speaker: "<Narration>"
    en: Roam halts its approach.
    ko: 롬은 다가가는 것을 멈췄다.
    ja: ロムは足を止めた
  event_ce006_1_prologue_40:
    speaker: "<Narration>"
    en: Someone walks out of the aircraft.
    ko: 누군가가 수송기에 걸어 나오고 있었다.
    ja: 誰かが輸送機から出てきた
  event_ce006_1_prologue_41:
    speaker: ce006_03
    en: Phew, that was close.
    ko: 흐아~ 아슬아슬했네요.
    ja: いや～、あせりましたね。
  event_ce006_1_prologue_42:
    speaker: ce006_03
    en: We nearly landed on our side thanks to that caliper. Darn thing is off balance.
    ko: 버니어 밸런스가 안 맞아서 하마터면 옆면으로 착륙할 뻔했어요.
    ja: |-
      バーニアのバランスが崩れて、
      あやうく横向きに着陸しちゃうところでした。
  event_ce006_1_prologue_43:
    speaker: ce006_npc_01
    en: You say land, but most people would consider that a crash.
    ko: 보통은 그런 걸 추락이라고 하지.
    ja: 普通はそういうのを墜落って言うんだ。
  event_ce006_1_prologue_44:
    speaker: ce006_01
    en: Is everyone okay?
    ko: 다들 다친 곳은 없어?
    ja: みんな、ケガはない？
  event_ce006_1_prologue_45:
    speaker: ce006_npc_01
    en: No problems.
    ko: 문제없어.
    ja: 問題ない。
  event_ce006_1_prologue_46:
    speaker: ce006_03
    en: I'm fine. How about you, EVE?
    ko: 저도 멀쩡해요. 이브는요?
    ja: あたしもです。イヴは？
  event_ce006_1_prologue_47:
    speaker: ce006_01
    en: All good. Adam, what's the status of the Tetrapod?
    ko: |-
      나도 괜찮아.
      아담. 테트라포드 상태는 어때?
    ja: |-
      私も問題ない。
      アダム、テトラポッドの状態は？
  event_ce006_1_prologue_48:
    speaker: ce006_npc_01
    en: Pretty dire. I think one of the vernier calipers is shot.
    ko: |-
      아주 안 좋아.
      버니어 하나가 완전 망가진 것 같아.
    ja: |-
      最悪だな。
      バーニアが一つ完全にいかれたみたいだ。
  event_ce006_1_prologue_49:
    speaker: ce006_npc_01
    en: I may have to get in there myself and poke around.
    ko: 일단 직접 확인을 한 번 해봐야겠는데….
    ja: まずは状況確認といきたいが…
  event_ce006_1_prologue_50:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_prologue_51:
    speaker: ce006_npc_01
    en: Where are we?
    ko: "…어디야 여긴?"
    ja: "…ここは、どこだ？"
  event_ce006_1_prologue_52:
    speaker: ce006_03
    en: I've never seen this place before.
    ko: 처음 보는 곳인데. 진짜 어딜까요?
    ja: 初めて見る場所だね。どこなんだろ？
  event_ce006_1_prologue_53:
    speaker: ce006_01
    en: Can you not check the coordinates?
    ko: 좌표 확인이 안 되는 거야?
    ja: 座標は確認できる？
  event_ce006_1_prologue_54:
    speaker: ce006_03
    en: Some coordinates are showing up, but there's no way they're correct.
    ko: |-
      그… 좌표는 찍히는데요.
      있을 수 없는 좌표가 찍히고 있어요.
    ja: |-
      その…表示はされてますけど。
      あり得ない座標なんですよ。
  event_ce006_1_prologue_55:
    speaker: ce006_npc_01
    en: A mechanical issue, perhaps?
    ko: 고장 난 것 아닐까?
    ja: 故障じゃないか？
  event_ce006_1_prologue_56:
    speaker: ce006_03
    en: Impossible. My diagnostics are always perfect.
    ko: 그럴 리가요. 제 점검은 언제나 완벽하다고요.
    ja: まさか。あたしのメンテナンスは完璧。
  event_ce006_1_prologue_57:
    speaker: ce006_03
    en: There's probably a jammer of some kind, or we're in an area where all communications
      are inoperable.
    ko: 아마 재머가 있거나 통신 불가 지역일 가능성이 높겠죠.
    ja: |-
      ジャマーがあるか、
      そもそも通信できない場所か。
  event_ce006_1_prologue_58:
    speaker: ce006_npc_01
    en: That's not good. We're lost.
    ko: 안 좋은데. 미아가 돼버렸잖아.
    ja: まいったな。まるっきり迷子じゃないか。
  event_ce006_1_prologue_59:
    speaker: ce006_03
    en: We wouldn't be in this situation if Adam hadn't flown into that glowing tunnel.
    ko: 애초에, 아담이 그 터널로 비행하지만 않았어도 이런 일은 안 일어났을 거예요.
    ja: |-
      そもそも、アダムが
      あんなトンネルに突っ込まなければ、
      こんなことにはならなかったのに。
  event_ce006_1_prologue_60:
    speaker: ce006_npc_01
    en: Lily. Listen to me very carefully.
    ko: 릴리. 잘 들어.
    ja: リリー…よおく聞け。
  event_ce006_1_prologue_61:
    speaker: ce006_npc_01
    en: If you come across a glowing tunnel while in flight, you can't exactly close
      your eyes and pretend it doesn't exist.
    ko: |-
      비행 중에 내부가 번쩍이는 터널을 발견했는데,
      이걸 피해서 지나간다는 건 있을 수 없는 일이야.
    ja: |-
      空に光るトンネルを見つけたら、
      無視することなんてできないんだ。
  event_ce006_1_prologue_62:
    speaker: ce006_03
    en: You don't have to head straight for it either! I knew that thing was suspicious
      the moment I laid eyes on it.
    ko: 피해야죠! 척 보기에도 엄청 수상해 보였는데!
    ja: 何言ってんの！？どう見たって怪しかったのに！
  event_ce006_1_prologue_63:
    speaker: ce006_npc_01
    en: You lack a sense of adventure.
    ko: 이렇게 모험심이 부족해서야.
    ja: まったく、冒険心が足りないな。
  event_ce006_1_prologue_64:
    speaker: ce006_03
    en: There's being adventurous, and then there's being reckless.
    ko: 모험심이랑, 무모한건 다르다고요.
    ja: 冒険心があるのと無謀なのは別モノ。
  event_ce006_1_prologue_65:
    speaker: ce006_01
    en: Everyone, wait.
    ko: "…다들 잠깐."
    ja: "…待って。"
  event_ce006_1_prologue_66:
    speaker: ce006_01
    en: There's something there.
    ko: 저기에 뭔가 있어.
    ja: あそこに何かいる。
  event_ce006_1_prologue_67:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_prologue_68:
    speaker: ce006_01
    en: A robot?
    ko: "…로봇?"
    ja: "…ロボット？"
  event_ce006_1_prologue_69:
    speaker: ce006_03
    en: I've never seen that model before.
    ko: 어라? 처음 보는 모델이네요.
    ja: あれ？見たことないモデルですね。
  event_ce006_1_prologue_70:
    speaker: ce006_npc_01
    en: It doesn't look like a combat robot.
    ko: 전투용 로봇은 아닌 것 같은데.
    ja: 戦闘用ではなさそうだ。
  event_ce006_1_prologue_71:
    speaker: ce006_03
    en: Let's go take a look. If we analyze its data, we might find something.
    ko: 가봐요. 데이터를 조사해 보면 뭐라도 나올 테니까.
    ja: |-
      近くにいってみないと。
      データを調べれば何か出てくるはず！
  event_ce006_1_prologue_72:
    speaker: ce006_01
    en: I'll go first, just in case. You two stay behind me and keep your distance.
    ko: |-
      혹시 모르니 내가 앞장설게.
      둘은 멀찌감치 따라와 줘.
    ja: |-
      念のため、私が前に立つ。
      2人は距離を取って、ついてきて。
  event_ce006_1_prologue_73:
    speaker: "<Narration>"
    en: EVE approaches Roam.
    ko: 이브가 롬에게 다가간다.
    ja: イヴがロムに近づいた
  event_ce006_1_prologue_74:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_prologue_75:
    speaker: ce006_01
    en: It doesn't appear to be armed. Doesn't seem particularly dangerous.
    ko: |-
      …위험해 보이진 않아.
      무기도 없고.
    ja: |-
      …危険そうには見えない。
      武装もしていないようだし。
  event_ce006_1_prologue_76:
    speaker: roam
    en: Are you Nikkes?
    ko: 너희는 니케인가?
    ja: 君たちは、ニケか？
  event_ce006_1_prologue_77:
    speaker: ce006_01
    en: "!"
    ko: "…!"
    ja: "…！"
  event_ce006_1_prologue_78:
    speaker: ce006_03
    en: Oh, it's equipped with language functions! That makes things easier.
    ko: |-
      엇. 언어 기능이 있네요?
      이러면 일이 쉽겠어요.
    ja: |-
      あれ？会話機能があるんですね。
      それなら話は早そうです。
  event_ce006_1_prologue_79:
    speaker: ce006_03
    en: Hello. Can you tell us where we are?
    ko: 안녕? 혹시 여기가 어딘지 알 수 있을까?
    ja: こんにちは！ここがどこか教えてくれる？
  event_ce006_1_prologue_80:
    speaker: roam
    en: You're on the surface.
    ko: 여기는 지상.
    ja: ここは、地上。
  event_ce006_1_prologue_81:
    speaker: ce006_03
    en: Uh... we could ascertain that much. We're asking for a specific location name
      or something.
    ko: |-
      ??
      응. 그건 우리도 아는데, 지명이나 뭐 이런 걸 물어보는 거야.
    ja: |-
      ？？
      うん、それは分かるよ。
      地名とか、そういうのを聞いてるの。
  event_ce006_1_prologue_82:
    speaker: roam
    en: The surface.
    ko: 지상은 지상.
    ja: 地上は、地上。
  event_ce006_1_prologue_83:
    speaker: ce006_03
    en: "..."
    ko: 어….
    ja: えっと…
  event_ce006_1_prologue_84:
    speaker: ce006_03
    en: This robot doesn't seem to be running on AI.
    ko: 이 로봇. A.I.로 움직이는 게 아닌 것 같은데요?
    ja: |-
      このロボット…
      A.I.で動いてるわけじゃなさそう。
  event_ce006_1_prologue_85:
    speaker: roam
    en: Roam can think and make own decisions.
    ko: 롬은 스스로 생각하고 판단한다.
    ja: ロムは、自分で考えて動く。
  event_ce006_1_prologue_86:
    speaker: ce006_03
    en: Roam? Is that your name?
    ko: 롬? 네 이름이야?
    ja: ロム？あなたの名前？
  event_ce006_1_prologue_87:
    speaker: roam
    en: Yes. Roam is my name.
    ko: 롬. 내 이름.
    ja: ロム。私の名前。
  event_ce006_1_prologue_88:
    speaker: ce006_03
    en: Right then, Roam, can you tell us more precisely where we are?
    ko: 그래. 롬. 여기가 어딘지 우리한테 알려줄래?
    ja: |-
      ねえ、ロム。ここがどこなのか、
      あたしたちに教えてくれない？
  event_ce006_1_prologue_89:
    speaker: roam
    en: You are on the surface. The surface is the surface.
    ko: |-
      여기는 지상.
      지상은 지상.
    ja: |-
      ここは、地上。
      地上は、地上。
  event_ce006_1_prologue_90:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_prologue_91:
    speaker: ce006_npc_01
    en: I'll try talking to it.
    ko: 내가 얘기해 볼게.
    ja: 俺がやってみよう。
  event_ce006_1_prologue_92:
    speaker: ce006_npc_01
    en: You need to keep in mind that it's a robot. You can't pressure it like that.
    ko: |-
      상대가 로봇이라는 걸 염두에 둬야 해.
      그렇게 다그치기만 하면 안 되지.
    ja: |-
      相手はロボットだってことを忘れるな。
      同じことを聞き直したって意味がない。
  event_ce006_1_prologue_93:
    speaker: ce006_npc_01
    en: Hey there, robot friend.
    ko: 안녕. 로봇 친구.
    ja: やあ、ロボット君。
  event_ce006_1_prologue_94:
    speaker: ce006_npc_01
    en: We want the coordinates of this location.
    ko: 우리는 이곳의 좌표 정보를 원해.
    ja: 俺たちは、ここの座標が知りたいんだ。
  event_ce006_1_prologue_95:
    speaker: roam
    en: Black mold on your face. Need to clean.
    ko: 얼굴. 검은 곰팡이 피었다. 청소해야 한다.
    ja: 顔。黒カビが生えている。掃除が必要。
  event_ce006_1_prologue_96:
    speaker: ce006_npc_01
    en: "... This is a beard."
    ko: "…이건 수염이야."
    ja: "…こいつはヒゲだ。"
  event_ce006_1_prologue_97:
    speaker: roam
    en: Black mold on face is called "beard". Affirmative.
    ko: 얼굴에 피는 검은곰팡이. 수염이라고 부르는 것을 기억했다.
    ja: |-
      顔に生える黒カビ。
      ヒゲと呼ぶ。覚えた。
  event_ce006_1_prologue_98:
    speaker: ce006_npc_01
    en: "... Is this thing intentionally trying to make me upset?"
    ko: 하하. 열받는걸 이 녀석.
    ja: ははは…生意気なヤツだな。
  event_ce006_1_prologue_99:
    speaker: roam
    en: Repeat question. Are you Nikkes?
    ko: 다시 질문. 너희는 니케인가?
    ja: もう一度質問する。君たちは、ニケか？
  event_ce006_1_prologue_100:
    speaker: ce006_01
    en: Nikkes? Are you asking about our affiliation?
    ko: "…니케? 소속을 말하는 거야?"
    ja: "…ニケ？所属部隊のこと？"
  event_ce006_1_prologue_101:
    speaker: roam
    en: Not affiliation.
    ko: 소속 아니다.
    ja: そうではない。
  event_ce006_1_prologue_102:
    speaker: ce006_01
    en: Then I don't understand what you're asking. What's a Nikke?
    ko: |-
      그럼 뭘 물어보는 건지 모르겠어.
      니케가 뭐야?
    ja: |-
      聞かれていることが分からない。
      ニケというのは何？
  event_ce006_1_prologue_103:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_prologue_104:
    speaker: roam
    en: Change question.
    ko: 질문을 변경한다.
    ja: 質問を変更する。
  event_ce006_1_prologue_105:
    speaker: roam
    en: Are you Nikkes or humans?
    ko: 너희는 니케인가? 인간인가?
    ja: 君たちは、ニケか？人間か？
  event_ce006_1_prologue_106:
    speaker: ce006_01
    en: Um, we're... humans?
    ko: 우리는 인간… 이지?
    ja: そのどちらかなら…人間？
  event_ce006_1_prologue_107:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_prologue_108:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_prologue_109:
    speaker: roam
    en: Human.
    ko: 인간.
    ja: 人間。
  event_ce006_1_prologue_110:
    speaker: roam
    en: Really?
    ko: 정말인가?
    ja: 本当か？
  event_ce006_1_prologue_111:
    speaker: ce006_03
    en: What else do we look like?
    ko: 그럼 우리가 뭘로 보이는데?
    ja: じゃあ、あたしたちが何に見えるって言うの？
  event_ce006_1_prologue_112:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_prologue_113:
    speaker: roam
    en: Humans on surface!
    ko: 지상! 지상! 지상!
    ja: 地上！地上！地上！
  event_ce006_1_prologue_114:
    speaker: roam
    en: Humans on surface!
    ko: 인간! 인간! 인간!
    ja: 人間！人間！人間！
  event_ce006_1_prologue_115:
    speaker: ce006_03
    en: Wh-what's it doing?!
    ko: 으앗! 왜, 왜 이래?
    ja: うわわっ！ど、どうしちゃったの？
  event_ce006_1_prologue_116:
    speaker: ce006_01
    en: Is it attacking?!
    ko: 공격하는 건가…!?
    ja: 攻撃してくる…！？
  event_ce006_1_prologue_117:
    speaker: roam
    en: Humans discovered! Humans discovered!
    ko: 인간 발견! 인간 발견!
    ja: 人間発見！人間発見！
  event_ce006_1_prologue_118:
    speaker: roam
    en: Surface! Surviving humans discovered!
    ko: 지상! 생존한 인간 발견!
    ja: 地上！生存している人間を発見！
event_ce006_1_01_s:
  event_ce006_1_01_s_1:
    speaker: "<Narration>"
    en: Commander's Room.
    ko: 지휘관실.
    ja: 指揮官室
  event_ce006_1_01_s_2:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_s_3:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 지잉- 지잉- 지잉-
    ja: ブブブ、ブブブ、ブブブ…
  event_ce006_1_01_s_4:
    speaker: "<Narration>"
    en: "*Beep* *Beep* *Beep*"
    ko: 지잉- 지잉- 지잉- 지잉-
    ja: ブブブ、ブブブ、ブブブ、ブブブ…
  event_ce006_1_01_s_5:
    speaker: "<Self>"
    en: Ugh...
    ko: "…아…."
    ja: "…はぁ…"
  event_ce006_1_01_s_6:
    speaker: rapi
    en: Commander, are you busy at the moment?
    ko: "…지휘관. 혹시 바쁜 일이 있으십니까?"
    ja: "…指揮官。お忙しいのですか？"
  event_ce006_1_01_s_7:
    speaker: anis
    en: Your phone's been blowing up for a while. Why don't you check it? You've gotten
      so many messages, you could probably compile them into a novel.
    ko: |-
      아까부터 문자 소리 엄청나는데 확인 좀 하지 그래?
      이러다 책 한 권 분량만큼 쌓이겠다.
    ja: |-
      さっきから携帯が騒いでるわよ？
      メッセージが本1冊分くらい
      溜まってそうだけど。
  event_ce006_1_01_s_8:
    speaker: neon
    en: Did you borrow money from someone and not pay them back?
    ko: 혹시 누구한테 돈 빌리고 안 갚으셨나요?
    ja: もしかして、借金取りですか？
  event_ce006_1_01_s_9:
    speaker: "<Self>"
    en: No, I'm just tired.
    ko: "…아니. 너무 피곤해서…."
    ja: "…いや、確認したくないだけだ…"
  event_ce006_1_01_s_10:
    speaker: rapi
    en: Makes sense. We have been out on a lot of missions lately.
    ko: 최근 작전이 잦긴 했었습니다.
    ja: 確かに、最近は作戦続きでした。
  event_ce006_1_01_s_11:
    speaker: "<Narration>"
    en: "*Beep* *Beep* *Beep*"
    ko: 지잉- 지잉- 지잉-
    ja: ブブブ、ブブブ、ブブブ…
  event_ce006_1_01_s_12:
    speaker: rapi
    en: Be that as it may, you really ought to check your messages, Commander.
    ko: 하지만 지휘관. 연락은 받는 편이 좋습니다.
    ja: ですが、指揮官…連絡は確認するべきかと。
  event_ce006_1_01_s_13:
    speaker: rapi
    en: It might be something urgent.
    ko: 정말 급한 연락일지도 모르지 않습니까.
    ja: 本当に緊急の連絡かもしれません。
  event_ce006_1_01_s_14:
    speaker: "<Self>"
    en: Rapi.
    ko: "…라피."
    ja: "…ラピ"
  event_ce006_1_01_s_15:
    speaker: rapi
    en: Yes?
    ko: 예.
    ja: 何でしょう。
  event_ce006_1_01_s_16:
    speaker: "<Self>"
    en: There is one thing I'm certain of.
    ko: 나는 확신해.
    ja: 私には分かっているんだ
  event_ce006_1_01_s_17:
    speaker: "<Self>"
    en: The moment I check those messages, our rest period ends.
    ko: 지금 이 문자를 확인하면 우리 휴식은 끝이라는 걸.
    ja: |-
      このメッセージを見た瞬間、
      私たちの休暇は終わる
  event_ce006_1_01_s_18:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_s_19:
    speaker: anis
    en: Hmm...
    ko: "…음."
    ja: "…そうね。"
  event_ce006_1_01_s_20:
    speaker: neon
    en: I'd have to agree.
    ko: 저도 분명 그럴 거라 생각해요.
    ja: 私もそうだと思います。
  event_ce006_1_01_s_21:
    speaker: "<Monologue>"
    en: Rapi gets up and grabs my phone.
    ko: 라피가 몸을 일으켜 내 핸드폰을 잡는다.
    ja: ラピが立ち上がり、私の携帯端末を手に取った
  event_ce006_1_01_s_22:
    speaker: "<Narration>"
    en: "*Beep* *Beep* *Beep*"
    ko: 지잉- 지잉- 지잉-
    ja: ブブブ、ブブブ、ブブブ…
  event_ce006_1_01_s_23:
    speaker: rapi
    en: Would it be okay if I check them for you?
    ko: "…제가 확인해도 되겠습니까?"
    ja: "…私が確認してよろしいでしょうか？"
  event_ce006_1_01_s_24:
    speaker: anis
    en: Don't do it, Rapi. What if they're all flirty messages from different Nikkes?
    ko: 관둬. 괜히 봤다가 지휘관님 싫어질 수도 있다 너.
    ja: |-
      やめといたら？
      指揮官様のことが嫌いになっちゃうかもよ。
  event_ce006_1_01_s_25:
    speaker: anis
    en: You might end up resenting the Commander.
    ko: 온갖 니케들이 꼬리 치는 내용이면 어쩌려고 그래?
    ja: 誰かからのデートのお誘いだったらどうするの？
  event_ce006_1_01_s_26:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_s_27:
    speaker: rapi
    en: Commander, please check your messages.
    ko: 확인하시죠. 지휘관.
    ja: ご確認を。指揮官。
  event_ce006_1_01_s_28:
    speaker: "<Monologue>"
    en: I take the phone from Rapi.
    ko: 라피에게서 핸드폰을 건네받는다.
    ja: ラピから携帯端末を受け取った
  event_ce006_1_01_s_29:
    speaker: "<Narration>"
    en: "*Beep* *Beep* *Beep*"
    ko: 지잉- 지잉- 지잉-
    ja: ブブブ、ブブブ、ブブブ…
  event_ce006_1_01_s_30:
    speaker: "<Self>"
    en: So tired...
    ko: "…아으. 피곤해라."
    ja: "…はぁ…気が進まないな"
  event_ce006_1_01_s_31:
    speaker: neon
    en: Master, what's wrong? You're as white as a sheet.
    ko: |-
      스승님. 왜 그러세요?
      사색이 됐는데요.
    ja: |-
      師匠、どうしました？
      顔色が悪いですよ。
  event_ce006_1_01_s_32:
    speaker: anis
    en: Are you okay?
    ko: "…왜 그래. 괜찮아?"
    ja: "…何かあったの？大丈夫？"
  event_ce006_1_01_s_33:
    speaker: "<Self>"
    en: Everyone, get ready. We need to go up to the surface.
    ko: "…다들 준비하자. 지상으로 가야 해."
    ja: "…みんな、準備してくれ。地上へ向かう"
  event_ce006_1_01_s_34:
    speaker: rapi
    en: Right now?
    ko: "…지금 말입니까?"
    ja: "…今すぐにですか？"
  event_ce006_1_01_s_35:
    speaker: "<Self>"
    en: Roam found humans on the surface.
    ko: 롬이 지상에서 인간을 찾았대.
    ja: ロムが地上で人間を発見したらしい
  event_ce006_1_01_s_36:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_s_37:
    speaker: rapi
    en: Say that again?
    ko: 예?
    ja: え？
  event_ce006_1_01_s_38:
    speaker: anis
    en: Are these the coordinates Roam gave us?
    ko: 여기… 지? 롬이 말해준 좌표가.
    ja: ここ…よね？ロムが言ってた座標って。
  event_ce006_1_01_s_39:
    speaker: rapi
    en: That's right.
    ko: "…맞아."
    ja: "…そのはずよ。"
  event_ce006_1_01_s_40:
    speaker: neon
    en: Wow. Humans on the surface.
    ko: 우와. 그런데 지상에 사람이라니.
    ja: それにしても、地上にまだ人がいたなんて。
  event_ce006_1_01_s_41:
    speaker: neon
    en: I thought there weren't any survivors up here.
    ko: 지상에 남은 사람은 0명이라고 하지 않았나요?
    ja: |-
      地上に残っている人間の数は0人だって
      言われてませんでした？
  event_ce006_1_01_s_42:
    speaker: rapi
    en: That's the official claim by the Central Government, at least.
    ko: 일단은 그래. 중앙 정부의 [공식적인] 입장으로는.
    ja: 中央政府の「公式な見解」では、そうね。
  event_ce006_1_01_s_43:
    speaker: neon
    en: Wowee, so we might be able to witness a historic moment!
    ko: 와 그럼 저희 어쩌면 역사적인 만남의 산 증인이 될 수도 있는 거겠네요?
    ja: |-
      じゃあ、私たちが歴史的瞬間の
      立会人になれるかもしれませんね？
  event_ce006_1_01_s_44:
    speaker: anis
    en: Potentially, but Roam might also be mistaken.
    ko: |-
      그럴 수도 있는데,
      롬이 착각했을 수도 있으니까.
    ja: |-
      そうかもしれないけど、
      ロムのカン違いって可能性もあるでしょ？
  event_ce006_1_01_s_45:
    speaker: "<Self>"
    en: Exactly. That's why we need to meet up with them and confi...
    ko: 맞아. 그러니 일단 합류해서 진짜인지 확인을….
    ja: ああ。だからひとまず、合流して確認を…
  event_ce006_1_01_s_46:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 콰앙-!
    ja: ドカン！
  event_ce006_1_01_s_47:
    speaker: rapi
    en: Commander! Explosions up ahead!
    ko: |-
      !!
      지휘관! 전방에서 폭음이 들립니다!
    ja: |-
      ！！
      指揮官！前方から爆音！
  event_ce006_1_01_s_48:
    speaker: "<Self>"
    en: Let's hurry!
    ko: 서두르자!
    ja: 急ぐぞ！
  event_ce006_1_01_s_49:
    speaker: ce006_npc_01
    en: What are those things?
    ko: 저것들은… 대체 뭐지.
    ja: あれは…いったい何だ？
  event_ce006_1_01_s_50:
    speaker: ce006_03
    en: I think they're robots, but I've never seen anything quite like them.
    ko: |-
      로, 로봇인 것 같은데요?
      그런데 이런 타입은 본 적이….
    ja: |-
      ロ、ロボットじゃない？
      でも、あんなタイプは見たことが…
  event_ce006_1_01_s_51:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!
    ja: ドカン！
  event_ce006_1_01_s_52:
    speaker: ce006_03
    en: What the...?! It just keeps attacking!
    ko: 으앗! 계, 계속 공격하는데요?
    ja: うわっ！こ、攻撃が止まらないよ？
  event_ce006_1_01_s_53:
    speaker: roam
    en: Rapture! Run!
    ko: 랩쳐! 랩쳐! 도망! 도망!
    ja: ラプチャー！ラプチャー！逃げる！逃げる！
  event_ce006_1_01_s_54:
    speaker: ce006_01
    en: Rapture?
    ko: 랩쳐…?
    ja: ラプチャー…？
  event_ce006_1_01_s_55:
    speaker: ce006_03
    en: Even if we do run, it'd be nice to know where we are.
    ko: 도망가려고 해도 여기가 어딘지를 알아야….
    ja: |-
      逃げるにしたって、
      ここがどこだか分からないと…
  event_ce006_1_01_s_56:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!
    ja: ドカン！
  event_ce006_1_01_s_57:
    speaker: ce006_npc_01
    en: This is bad. It's only a matter of time before the Tetrapod gets hit.
    ko: 이런. 이러다가 테트라포드에 맞는 건 시간문제겠는데?
    ja: |-
      まずいな。このままじゃ
      テトラポッドが被弾するのは時間の問題だ。
  event_ce006_1_01_s_58:
    speaker: ce006_01
    en: I'll go.
    ko: 내가 갈게.
    ja: 私が行く。
  event_ce006_1_01_s_59:
    speaker: ce006_npc_01
    en: I think it'd be best for us to conduct a bit more recon before moving out.
      We have no idea what these "Rapture" things are.
    ko: |-
      좀 더 지켜보고 움직이는 게 낫겠어.
      랩쳐라는 저것들이 어떤 것들인지 전혀 모르잖아.
    ja: |-
      もう少し状況を見てからの方がいい。
      ラプチャーというものが何なのか
      分かっていないだろう。
  event_ce006_1_01_s_60:
    speaker: ce006_01
    en: I understand that, but if we lose the Tetrapod, we're in big trouble.
    ko: 그렇다고 이렇게 있다가 테트라포드를 잃으면 큰일이야.
    ja: |-
      けど、このまま何もせずに
      テトラポッドを失うわけにはいかない。
  event_ce006_1_01_s_61:
    speaker: ce006_npc_01
    en: It's not the end of the world. Machines can be repaired. If one of us gets
      hurt though, then we're really screwed.
    ko: |-
      기계는 고치면 되니까 큰 문제가 아냐.
      하지만 사람이 다치는 건 큰 문제지.
    ja: |-
      機械は直せばいい。
      だが、人は違う。
  event_ce006_1_01_s_62:
    speaker: ce006_npc_01
    en: We don't have any proper medical facilities around us. Any injury could potentially
      be fatal.
    ko: 제대로 된 의료장비도 없는 이런 곳에서 다쳤다간 그게 더 큰일이야.
    ja: |-
      まともな医療設備もないこんな場所で
      負傷したら、その方が問題だ。
  event_ce006_1_01_s_63:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_s_64:
    speaker: ce006_npc_01
    en: Our robot friend here seems to have called for backup, so let's wait.
    ko: 우리 로봇 친구가 동료들을 불렀다니 기다리자고.
    ja: |-
      ロボットが仲間を呼んだらしい、
      待ってみよう。
  event_ce006_1_01_s_65:
    speaker: roam
    en: Commander! Nikke!
    ko: 지휘관! 니케! 지휘관! 니케!
    ja: 指揮官！ニケ！指揮官！ニケ！
  event_ce006_1_01_s_66:
    speaker: ce006_03
    en: Maybe it's just panicking and shouting random phrases.
    ko: 그냥 무서워서 아무 말이나 하는 거 아닐까요?
    ja: 怖くてテキトーに何か叫んでるだけだったら？
  event_ce006_1_01_s_67:
    speaker: ce006_npc_01
    en: "... Let's hope not."
    ko: 음… 아니길 바래야지.
    ja: うーむ…そうじゃないことを願おう。
  event_ce006_1_01_s_68:
    speaker: "<Self>"
    en: Roam! Are you safe?
    ko: 롬! 무사해!?
    ja: ロム！無事か！？
  event_ce006_1_01_s_69:
    speaker: roam
    en: Commander!
    ko: 지휘관! 지휘관!
    ja: 指揮官！指揮官！
  event_ce006_1_01_s_70:
    speaker: ce006_npc_01
    en: Looks like the cavalry finally arrived.
    ko: 오. 왔군.
    ja: おっ、来たな。
  event_ce006_1_01_s_71:
    speaker: rapi
    en: "⋯!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_1_01_s_72:
    speaker: anis
    en: Humans... is it really true?
    ko: |-
      정말… 이야?
      이, 인간이라고?
    ja: |-
      本当…に？
      に、人間がいたの？
  event_ce006_1_01_s_73:
    speaker: neon
    en: Wow! This is my first time seeing humans!
    ko: 와! 저, 사람을 실제로 보는 건 처음이에요!
    ja: わあ！私、本物を見るのは初めてです！
  event_ce006_1_01_s_74:
    speaker: anis
    en: What are you talking about? You see humans every day.
    ko: 아니잖아! 매일 보잖아!
    ja: 何言ってんの！毎日見てるでしょ！？
  event_ce006_1_01_s_75:
    speaker: neon
    en: I know, but it sounded better if I said it that way.
    ko: 넹. 근데 이렇게라도 감격을 표현하고 싶었어요.
    ja: |-
      はい。でもどうにかして
      この感動を表現したかったので。
  event_ce006_1_01_s_76:
    speaker: ce006_03
    en: And you all are...?
    ko: "…여러분들은…?"
    ja: あなたたちは…？
  event_ce006_1_01_s_77:
    speaker: rapi
    en: We'll talk later. First, we need to take care of these Raptures.
    ko: |-
      이야기는 나중에!
      일단 랩쳐들을 섬멸한다!
    ja: |-
      話はあと！
      ラプチャーの殲滅が先よ！
  event_ce006_1_01_s_78:
    speaker: anis
    en: Right! Well, shall we?
    ko: 조, 좋아! 가볼까?
    ja: そ、そうね！行くわよ！
  event_ce006_1_01_s_79:
    speaker: neon
    en: Let's!
    ko: 멋진 모습 보여주자고요!
    ja: カッコいいところをお見せしましょう！
event_ce006_1_01_e:
  event_ce006_1_01_e_1:
    speaker: rapi
    en: All clear.
    ko: "…상황 종료."
    ja: "…状況終了。"
  event_ce006_1_01_e_2:
    speaker: anis
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  event_ce006_1_01_e_3:
    speaker: neon
    en: I've gotta be honest, I think we did particularly well this time around.
    ko: 솔직히 이번에 좀 멋지게 잘 싸운 것 같아요.
    ja: 正直、今回はかなりカッコよく戦えましたね。
  event_ce006_1_01_e_4:
    speaker: ce006_03
    en: "... Incredible."
    ko: "…굉장하다."
    ja: "…すごい。"
  event_ce006_1_01_e_5:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_e_6:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_e_7:
    speaker: roam
    en: Commander! Commander!
    ko: 지휘관! 지휘관!
    ja: 指揮官！指揮官！
  event_ce006_1_01_e_8:
    speaker: "<Self>"
    en: Roam, how's your condition?
    ko: 롬. 상태는 어때?
    ja: ロム、状態はどうだ？
  event_ce006_1_01_e_9:
    speaker: roam
    en: No problem!
    ko: 문제없음! 문제없음!
    ja: 問題なし！問題なし！
  event_ce006_1_01_e_10:
    speaker: roam
    en: You saved me!
    ko: 도와줘서 고맙다! 도와줘서 고맙다!
    ja: 救援に感謝！救援に感謝！
  event_ce006_1_01_e_11:
    speaker: anis
    en: Still as dramatic as ever.
    ko: 허이구. 호들갑 떠는 성격은 여전하네.
    ja: まったく。相変わらず大げさね。
  event_ce006_1_01_e_12:
    speaker: "<Self>"
    en: Now then...
    ko: 자, 그럼….
    ja: さて、次は…
  event_ce006_1_01_e_13:
    speaker: "<Monologue>"
    en: I look at the three people Roam mentioned.
    ko: 롬이 얘기했던 세명을 바라본다.
    ja: |-
      ロムが発見したという
      3つの人影に向き直った
  event_ce006_1_01_e_14:
    speaker: "<Self>"
    en: We are the Counters Squad. We're the Special Commando under the employ of
      the Central Government.
    ko: |-
      우리는 카운터스.
      중앙 정부에서 특수별동대를 맡고 있어.
    ja: |-
      私たちはカウンターズ。
      中央政府の特殊別働隊として活動している
  event_ce006_1_01_e_15:
    speaker: "<Self>"
    en: And you are...?
    ko: 그쪽은…?
    ja: そちらは…？
  event_ce006_1_01_e_16:
    speaker: ce006_03
    en: Oh, we're...
    ko: 아, 저희는….
    ja: え、あたしたちは…
  event_ce006_1_01_e_17:
    speaker: anis
    en: Is it true?
    ko: 미, 미안한데 너희들 진짜 그 뭐야.
    ja: |-
      あの、話に割り込む感じで悪いけど、
      あなたたち…
  event_ce006_1_01_e_18:
    speaker: anis
    en: Are you guys really human?
    ko: "…인간 맞아?"
    ja: "…人間なの？"
  event_ce006_1_01_e_19:
    speaker: ce006_01
    en: You're awfully interested as to whether we're human. You're just like that
      robot.
    ko: 롬도 그렇고 우리가 인간이라는 것에 관심이 많아 보이네.
    ja: |-
      ロムもそうだったけど、私たちが
      人間ということに興味があるみたいね。
  event_ce006_1_01_e_20:
    speaker: ce006_01
    en: Yes, we're humans.
    ko: 맞아. 우리는 인간이야.
    ja: そう、私たちは人間。
  event_ce006_1_01_e_21:
    speaker: "<Self>"
    en: Where did you come from?
    ko: "…어디에서 왔어?"
    ja: "…どこから来た？"
  event_ce006_1_01_e_22:
    speaker: ce006_01
    en: What do you mean? Where else could we have come from other than Xion?
    ko: |-
      어디… 라니?
      그야 당연히 자이온에서….
    ja: |-
      どこ…って？
      それは当然、ザイオンから…
  event_ce006_1_01_e_23:
    speaker: rapi
    en: I've never heard of this "Xion".
    ko: "…처음 듣는 지명인데."
    ja: "…聞いたことのない場所ね。"
  event_ce006_1_01_e_24:
    speaker: rapi
    en: That transport aircraft behind you, did you come here on that?
    ko: |-
      뒤에 수송선으로 보이는 저건,
      너희가 타고 온 거야?
    ja: |-
      あれは輸送船のように見えるけれど、
      あなたたちが乗っていたの？
  event_ce006_1_01_e_25:
    speaker: ce006_npc_01
    en: Indeed we did. We call it Tetrapod.
    ko: 맞아. 테트라포드라고 부르지.
    ja: ああ。テトラポッドというんだ。
  event_ce006_1_01_e_26:
    speaker: ce006_npc_01
    en: Although one of the calipers is broken at the moment, so it'd be more accurate
      to call it Tripod.
    ko: 지금은 버니어 하나가 망가져서 트라이포드라고 부르는 게 낫겠는걸.
    ja: |-
      今はバーニアが1本壊れているから、
      トライポッドと呼ぶべきかもしれないな。
  event_ce006_1_01_e_27:
    speaker: rapi
    en: "... Do you know anything about Nikkes?"
    ko: "…니케에 대해 알고 있는 게 있어?"
    ja: "…ニケというのは、何か知っている？"
  event_ce006_1_01_e_28:
    speaker: ce006_03
    en: You mean what Roam was talking about? It asked if we were Nikkes.
    ko: |-
      니케요? 롬이 얘기했던 그건가요?
      우리 보고 니케냐고 물어봤었는데요.
    ja: |-
      ニケ？ロムが言ってた？
      さっき聞かれたんです。
  event_ce006_1_01_e_29:
    speaker: ce006_03
    en: Can you tell us where we are? We're not familiar with this place, and I'm
      unable to pull up any coordinates.
    ko: |-
      그보다 여기가 어딘지 좀 알려주실래요?
      처음 보는 장소에다가, 좌표도 안 찍혀요.
    ja: |-
      それより、ここがどこだか教えてもらえます？
      見たこともない場所で、座標も分からなくて。
  event_ce006_1_01_e_30:
    speaker: "<Self>"
    en: Rapi, are you thinking what I'm thinking?
    ko: "…라피."
    ja: "…ラピ"
  event_ce006_1_01_e_31:
    speaker: rapi
    en: "... Yes. That seems to be the case."
    ko: "…예. 아무래도 그쪽인 듯합니다."
    ja: "…はい。おそらく、あれでしょう。"
  event_ce006_1_01_e_32:
    speaker: "<Self>"
    en: I'll contact the Deputy Chief.
    ko: 부사령관님한테 연락을 넣어볼게.
    ja: 副司令官に連絡してみよう
  event_ce006_1_01_e_33:
    speaker: rapi
    en: Please do.
    ko: 부탁드립니다.
    ja: お願いします。
  event_ce006_1_01_e_34:
    speaker: anis
    en: Oh no, not the D-Wave again?
    ko: |-
      아… 그거겠구나.
      D-WAVE.
    ja: |-
      ああ…あれね。
      D-WAVE。
  event_ce006_1_01_e_35:
    speaker: neon
    en: Uh oh...
    ko: 아….
    ja: ああ…
  event_ce006_1_01_e_36:
    speaker: ce006_01
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_1_01_e_37:
    speaker: rapi
    en: Why don't we all have a seat?
    ko: 일단 다들 앉자.
    ja: ひとまず、みんな座って。
  event_ce006_1_01_e_38:
    speaker: rapi
    en: We have a lot to discuss.
    ko: 정보를 교환하자.
    ja: 情報を交換しましょう。
  event_ce006_1_01_e_39:
    speaker: "<Narration>"
    en: Soon after.
    ko: 잠시 후.
    ja: しばらくして
  event_ce006_1_01_e_40:
    speaker: "<Monologue>"
    en: As expected, the three humans before us were summoned to this world due to
      a D-Wave anomaly.
    ko: |-
      롬이 말했던 인간 셋은
      예상대로 D-WAVE로 인해 [이쪽 세계]에 소환된 대상들이었다.
    ja: |-
      ロムが発見した3名は予想通り、
      D-WAVEにより「こちらの世界」に
      呼び出された者たちだった
  event_ce006_1_01_e_41:
    speaker: "<Monologue>"
    en: While traveling on their aircraft, which they refer to as the Tetrapod, they
      saw a glowing tunnel, entered it, and were transported there.
    ko: |-
      테트라포드라는 수송기를 타고 이동 중,
      빛나는 터널이 보여 진입했더니 이곳으로 이동되었다고 한다.
    ja: |-
      テトラポッドという輸送機に乗って移動中、
      光るトンネルを発見して進入してみたところ、
      ここにたどり着いたということらしい
  event_ce006_1_01_e_42:
    speaker: "<Monologue>"
    en: EVE.
    ko: 이브.
    ja: イヴ
  event_ce006_1_01_e_43:
    speaker: "<Monologue>"
    en: Lily.
    ko: 릴리.
    ja: リリー
  event_ce006_1_01_e_44:
    speaker: "<Monologue>"
    en: Adam.
    ko: 아담.
    ja: アダム
  event_ce006_1_01_e_45:
    speaker: "<Monologue>"
    en: They explain how their world has been taken over by mysterious monsters called
      the "Naytiba".
    ko: 그들은 원래 있던 세계에서 [네이티브]라 불리는 미지의 괴물들에게 지상을 빼앗겼고.
    ja: |-
      彼らが元いた世界は「ネイティブ」と呼ばれる
      未知の怪物に地上を奪われ…
  event_ce006_1_01_e_46:
    speaker: "<Monologue>"
    en: They have been fighting a protracted battle to reclaim their planet from the
      Naytiba.
    ko: 네이티브에게서 지상을 되찾기 위해 긴 싸움을 이어나가고 있다고 얘기했다.
    ja: |-
      その怪物から地上を取り戻すために
      長きにわたる戦いを続けていると語った
  event_ce006_1_01_e_47:
    speaker: rapi
    en: Your situation isn't all that different from ours.
    ko: "…우리와 크게 다르지 않네."
    ja: "…私たちとあまり変わらないわね。"
  event_ce006_1_01_e_48:
    speaker: roam
    en: The people there. Are they happy?
    ko: |-
      그곳의 사람들.
      행복한가?
    ja: |-
      その場所の人たち。
      幸せか？
  event_ce006_1_01_e_49:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_e_50:
    speaker: roam
    en: Chipper. Heehee. Haha. Happy?
    ko: 시끌벅적. 하하 호호. 행복한가?
    ja: ガヤガヤ。はは、ほほ。幸せか？
  event_ce006_1_01_e_51:
    speaker: ce006_01
    en: "... We're trying our best to be."
    ko: "…그렇게 되기 위해서 노력 중이야."
    ja: "…そうなるために、努力してる。"
  event_ce006_1_01_e_52:
    speaker: roam
    en: Me too.
    ko: 나도 그렇다.
    ja: 私もそうだ。
  event_ce006_1_01_e_53:
    speaker: roam
    en: I want to take a lot of photos. Happy photos.
    ko: 모두가 모여서 시끌벅적. 하하 호호.
    ja: みんなが集まって、ガヤガヤ。はは、ほほ。
  event_ce006_1_01_e_54:
    speaker: roam
    en: Everyone together and happy. Heehee haha.
    ko: 행복한 사진. 많이 찍고 싶다.
    ja: 幸せな写真。たくさん撮りたい。
  event_ce006_1_01_e_55:
    speaker: "<Monologue>"
    en: After their explanation, we fill them in as to where they are.
    ko: "…이어서 그들이 지금 머물고 있는 이곳."
    ja: "…その後、私たちが今いるこの場所…"
  event_ce006_1_01_e_56:
    speaker: "<Monologue>"
    en: About our world.
    ko: 우리의 세계에 대해 설명했다.
    ja: つまり、私たちの世界について説明した
  event_ce006_1_01_e_57:
    speaker: "<Monologue>"
    en: The surface overtaken by a mysterious enemy called Raptures, forcing humankind
      underground.
    ko: |-
      정체불명의 병기 랩쳐에게 빼앗긴 지상.
      지하로 숨어 들어간 인류.
    ja: |-
      正体不明の敵、ラプチャーに地上を奪われ
      人類は地下に逃げ延びていること…
  event_ce006_1_01_e_58:
    speaker: "<Monologue>"
    en: About Nikkes, the ultimate weapons created to do battle against the Raptures.
    ko: 랩쳐에게 맞서 싸우기 위한 만들어진 결전병기. 니케.
    ja: |-
      そして、それに立ち向かうために作られた
      決戦兵器、ニケのこと…
  event_ce006_1_01_e_59:
    speaker: ce006_npc_01
    en: It really is awfully similar.
    ko: "…정말… 크게 다르지 않네."
    ja: "…本当に…ほとんど変わらないな。"
  event_ce006_1_01_e_60:
    speaker: ce006_03
    en: I realize it may be a little insensitive to compare our situations like this,
      but given that we're at least on the surface of our planet, we're a little better
      off than you all here.
    ko: |-
      이런 걸로 비교하면 좀 그렇지만,
      그래도 우리는 지상에 있으니 사정이 좀 낫네요.
    ja: |-
      比べるのもちょっとアレだけど…
      あたしたちは地上にいる分、
      まだマシなのかな。
  event_ce006_1_01_e_61:
    speaker: ce006_01
    en: Then... you guys aren't human?
    ko: 그럼… 너희는 인간이 아닌 거야?
    ja: ということは…あなたたちは人間ではないの？
  event_ce006_1_01_e_62:
    speaker: anis
    en: Well... I guess not.
    ko: 뭐어… 일단은 그렇지.
    ja: まあ…そういうことになるわね。
  event_ce006_1_01_e_63:
    speaker: neon
    en: To be honest though, you can't really tell the difference unless we get hurt
      or something.
    ko: 사실 다치거나 할 때 말고는 딱히 실감도 안 나지만요.
    ja: |-
      実際、大ケガした時でもないと
      あまり実感しませんけどね。
  event_ce006_1_01_e_64:
    speaker: rapi
    en: We found it hard to believe that humans could still exist up on the surface,
    ko: 지상에 인간이 있는 것 자체가 우리 기준으로는 말이 안 되는 거야.
    ja: |-
      地上に人間がいること自体、
      私たちの常識では考えられないことよ。
  event_ce006_1_01_e_65:
    speaker: rapi
    en: which is why Roam and all of us reacted the way we did.
    ko: 그래서 롬도 마찬가지고, 우리가 그렇게 반응한 거지.
    ja: |-
      ロムも私たちも、
      それでこんな反応をしているの。
  event_ce006_1_01_e_66:
    speaker: ce006_03
    en: I see. It just caught us a bit off guard, that's all.
    ko: 그렇군요. 조금 놀라긴 했는데 괜찮아요.
    ja: |-
      そうだったんだ。
      ちょっと驚いたけど、納得です。
  event_ce006_1_01_e_67:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_e_68:
    speaker: ce006_npc_01
    en: All right. I understand that this isn't the world we came from.
    ko: 좋아. 이곳이 우리가 살고 있던 세계가 아니라는 건 일단 알겠어.
    ja: |-
      とにかく…ここが俺たちの暮らしていた
      世界じゃないってことは分かった。
  event_ce006_1_01_e_69:
    speaker: ce006_npc_01
    en: And from what I'm hearing, this kind of thing has happened a couple of times
      before.
    ko: 듣자 하니 이런 경우가 여러 번 있었던 것 같은데….
    ja: これが初めてってワケじゃあなさそうだが…
  event_ce006_1_01_e_70:
    speaker: ce006_npc_01
    en: So my question is, is there a way we can go back to our world?
    ko: 어떻게 하면 우리가 원래 세계로 돌아갈 수 있는 거지?
    ja: どうすれば元の世界に戻れるんだ？
  event_ce006_1_01_e_71:
    speaker: "<Self>"
    en: There is a way.
    ko: 방법은 있어.
    ja: 方法は分かっている
  event_ce006_1_01_e_72:
    speaker: "<Self>"
    en: You need to awaken, or defeat, rather, the Rapture known as Gatekeeper. It's
      what is responsible for bringing you here.
    ko: |-
      이 일을 발생시킨 [게이트 키퍼]라는 랩쳐를 깨우…
      아니, 쓰러뜨리면 돼.
    ja: |-
      「ゲートキーパー」というラプチャーを
      起こす…いや、倒せばいい
  event_ce006_1_01_e_73:
    speaker: rapi
    en: Based on our investigations, the source of this D-Wave is somewhere within
      a 40-kilometer radius of our current location.
    ko: |-
      방주에서 조사해 본 결과,
      이번 D-WAVE의 근원지는 반경 40km 내외에 있을 거라 해.
    ja: |-
      アークからの調査報告によると、
      今回のD-WAVEの発生地点は、
      ここから半径40km付近。
  event_ce006_1_01_e_74:
    speaker: rapi
    en: The D-Wave signal covers a wide area, but unlike previous cases,
    ko: 파장이 약하지만 넓게 퍼지고 있어.
    ja: 微弱な波長が広範囲で検知されているようね。
  event_ce006_1_01_e_75:
    speaker: rapi
    en: it is significantly weaker this time around.
    ko: |-
      지금까지의 케이스와는 다르게,
      이번의 D-WAVE는 파장이 너무 미약해.
    ja: |-
      過去のケースと違って、
      今回のD-WAVEはきわめて弱いらしいわ。
  event_ce006_1_01_e_76:
    speaker: rapi
    en: Also, anything that Gatekeeper summons normally emits a large amount of D-Wave
      energy.
    ko: "…덧붙여, 게이트 키퍼가 불러낸 [소환체]… 즉, 너희들에게서도 대량의 D-WAVE가 발생하기 마련인데."
    ja: |-
      …しかも、ゲートキーパーの「召喚体」…
      つまり、あなたたちからも強いD-WAVEが
      検知されるはずなのだけれど…
  event_ce006_1_01_e_77:
    speaker: rapi
    en: But all of you are emitting rather weak D-Wave energy, enough to be barely
      detectable from the Ark.
    ko: |-
      지금 너희들에게서 발생하는 D-WAVE도 굉장히 미약해.
      방주에서도 겨우 알아챌 만큼.
    ja: |-
      それも弱いのだそうよ。
      アークでも今まで確認できていなかったほど。
  event_ce006_1_01_e_78:
    speaker: ce006_npc_01
    en: And what would be the explanation behind that?
    ko: 그 이유는?
    ja: その理由は？
  event_ce006_1_01_e_79:
    speaker: rapi
    en: The patterns change every time, so it's difficult for us to come up with anything
      conclusive.
    ko: 글쎄. 나타날 때마다 패턴이 제각각이라, 이유는 알 수 없어.
    ja: |-
      さあ。事件のたびに何かが違っているから、
      理由は分からないわ。
  event_ce006_1_01_e_80:
    speaker: anis
    en: It's easier to simply accept that it's different this time around, and move
      on.
    ko: 그냥 이번에는 이렇구나~ 라고 생각하는 게 마음 편하다는 얘기지.
    ja: |-
      ただ、そういうものなんだ～って
      知っておいた方が気持ち的に楽なだけね。
  event_ce006_1_01_e_81:
    speaker: ce006_npc_01
    en: "... Got it. The situation inherently doesn't make sense, so attempting to
      analyze it won't help."
    ko: "…이해했어. 이런 현상 자체가 말이 안 되니, 여기에 뭘 더 얹는다고 달라질 건 없겠지."
    ja: |-
      …分かった。
      こんな現象自体が考えがたい話だからな。
      考えてもしかたないだろう。
  event_ce006_1_01_e_82:
    speaker: ce006_npc_01
    en: Then, should we search this area?
    ko: 그럼, 이 일대를 수색해 보면 되는 건가?
    ja: とにかく、この辺りを探せばいいってことか？
  event_ce006_1_01_e_83:
    speaker: rapi
    en: In theory, yes, but it's a wide area to comb over.
    ko: "…이론적으로는. 40km 반경이지만."
    ja: |-
      …理論的には、そう。
      半径40kmをこの辺りと言えるなら。
  event_ce006_1_01_e_84:
    speaker: ce006_03
    en: Yikes...
    ko: 으아….
    ja: うはぁ…
  event_ce006_1_01_e_85:
    speaker: ce006_npc_01
    en: That's not something we'd be able to cover on foot. We'll have to use the
      Tetrapod.
    ko: |-
      흠… 도보로 수색할 거리는 아니군.
      테트라포드는 필수겠어.
    ja: |-
      ふむ…徒歩で調べられる範囲じゃないな。
      テトラポッドの力が要る。
  event_ce006_1_01_e_86:
    speaker: ce006_01
    en: Any chance the Ark could lend some assistance?
    ko: 혹시 그 방주라는 곳에서 도움을 줄 수 있을까?
    ja: |-
      そのアークって場所からは、
      力を貸してもらえないの？
  event_ce006_1_01_e_87:
    speaker: rapi
    en: They're searching as we speak, but it's slow going.
    ko: 수색 중이야. 하지만 많이 더뎌.
    ja: |-
      調査は始まっているわ。
      ただし、すぐ結果が出るとは考えられないわね。
  event_ce006_1_01_e_88:
    speaker: ce006_01
    en: How about venturing out with an exosuit?
    ko: 엑소슈트로 가보는 건 어떨까?
    ja: エグゾスーツを使うのは？
  event_ce006_1_01_e_89:
    speaker: ce006_03
    en: I don't think that's a good idea. They're meant to be piloted solo. If they
      fall behind, that'd be the end of that.
    ko: |-
      좋은 생각이 아닌 것 같아요.
      일인승이라, 고립이라도 되면 끝이니까요.
    ja: |-
      厳しいですね。
      1人乗りですし、孤立したらオシマイです。
  event_ce006_1_01_e_90:
    speaker: ce006_01
    en: Well, we certainly wouldn't want that.
    ko: "…안 좋네."
    ja: "…それは困る。"
  event_ce006_1_01_e_91:
    speaker: ce006_03
    en: I guess we need to focus on repairing the Tetrapod.
    ko: 일단 테트라포드를 고치는 것부터 해야겠네요.
    ja: とりあえず、テトラポッドの修理からだね。
  event_ce006_1_01_e_92:
    speaker: ce006_npc_01
    en: That does seem to be the only option. Let's just hope that the damage is something
      manageable.
    ko: |-
      그 방법밖에 없는 것 같네.
      우리가 해결할 수 있을 정도로 고장 난 상태길 바랄 수밖에.
    ja: |-
      それしかなさそうだ。
      俺たちに解決できる程度の故障であることを
      願うしかない。
  event_ce006_1_01_e_93:
    speaker: ce006_npc_01
    en: Is there any place nearby we could find spare parts?
    ko: 혹시 주위에 부품을 구할만한 곳이 있을까?
    ja: |-
      この辺りに機械の部品が手に入りそうな
      場所はあるか？
  event_ce006_1_01_e_94:
    speaker: "<Self>"
    en: We could request them from the Ark, but it would take some time.
    ko: |-
      방주에서 조달 가능하긴 할 텐데…
      시간이 좀 걸릴 거야.
    ja: |-
      アークなら調達できると思うが…
      時間がかかる
  event_ce006_1_01_e_95:
    speaker: "<Self>"
    en: Whenever we're up on the surface and need spare parts, we typically have to
      go scavenging for them.
    ko: 그래서 우리는 보통 부품 같은 게 급하면 지상을 뒤져서 찾아내.
    ja: |-
      どうしても緊急で必要になった時は
      地上を探すことが多い
  event_ce006_1_01_e_96:
    speaker: ce006_03
    en: Wow, another way our situations are similar.
    ko: 우와. 그것까지 우리랑 비슷하네요.
    ja: |-
      わ～。そんなところまで
      あたしたちと似てるんですね。
  event_ce006_1_01_e_97:
    speaker: "<Self>"
    en: If you tell us what parts you need, we can help you search for them.
    ko: 어떤 부품이 필요한지 얘기해 주면 찾아볼게.
    ja: |-
      どういう部品が必要なのか教えてくれ。
      探してみよう
  event_ce006_1_01_e_98:
    speaker: ce006_npc_01
    en: Much appreciated, but we have no way of knowing if the specs would match.
    ko: |-
      그건 고마운데,
      양식이나 규격이 잘 맞을지 모르겠군.
    ja: |-
      それはありがたいが、
      形式や規格が合うか分からないな。
  event_ce006_1_01_e_99:
    speaker: ce006_03
    en: If Rapi's firearm is any indication, I'd say our technology doesn't differ
      too wildly from theirs. The specifications aren't identical, of course, but
      it should be possible to get it to work.
    ko: |-
      라피의 총기를 보니 기술 양식은 그리 차이 나지 않아요.
      규격은 좀 다른 것 같긴 하지만 어떻게든 가능한 수준이에요.
    ja: |-
      ラピの銃を見たけど、規格はちょっと違うかな。
      でも、これくらいなら何とかできそう。
  event_ce006_1_01_e_100:
    speaker: ce006_npc_01
    en: All right then, let's head out.
    ko: 좋아. 그럼 출발해 보실까.
    ja: よし。ならやってみるか。
  event_ce006_1_01_e_101:
    speaker: ce006_03
    en: Exploring an unknown world, how exciting!
    ko: 미지의 세계 탐험이라니 두근두근하네요!
    ja: |-
      未知の世界を冒険できるなんて、
      ワクワクしちゃう！
  event_ce006_1_01_e_102:
    speaker: ce006_01
    en: I will go with them.
    ko: 내가 같이 갔다 올게.
    ja: 行くのは私ひとりでいい。
  event_ce006_1_01_e_103:
    speaker: ce006_01
    en: You two should stay back and give the Tetrapod a proper once-over.
    ko: 둘은 테트라포드의 상태를 자세히 확인하는 게 좋겠어.
    ja: 2人はテトラポッドの精密検査をしておいて。
  event_ce006_1_01_e_104:
    speaker: ce006_03
    en: What? Why don't we go together?
    ko: 예? 그래도 같이 가는 편이….
    ja: えっ？でも全員で探した方が…
  event_ce006_1_01_e_105:
    speaker: ce006_01
    en: Securing a way back is our top priority. We need to make sure there's nothing
      else wrong with the ship other than the caliper.
    ko: |-
      돌아갈 수단이 가장 중요해.
      버니어 말고도 다른 부분에 이상이 없는지 확인해 줘.
    ja: |-
      帰りの手段が一番大事。
      バーニア以外にも問題がないか、確かめて。
  event_ce006_1_01_e_106:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_e_107:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_01_e_108:
    speaker: ce006_01
    en: Don't worry. I'll be back.
    ko: |-
      걱정 마.
      다녀올게.
    ja: |-
      心配しないで。
      行ってくる。
  event_ce006_1_01_e_109:
    speaker: rapi
    en: Have you got any combat experience?
    ko: 이브. 전투는 익숙해?
    ja: イヴ。戦い慣れているようね？
  event_ce006_1_01_e_110:
    speaker: ce006_01
    en: I don't think I'm too bad.
    ko: 응. 나름 익숙하다고 생각해.
    ja: ええ。それなりに。
  event_ce006_1_01_e_111:
    speaker: ce006_03
    en: Don't undersell yourself.
    ko: 너무 겸손한 것 아니에요?
    ja: 謙遜しすぎじゃありませんか？
  event_ce006_1_01_e_112:
    speaker: ce006_npc_01
    en: You're better than "not too bad".
    ko: 그러게. 익숙한 정도가 아닐 텐데 말이야.
    ja: そうだな。慣れてるなんてものじゃない。
  event_ce006_1_01_e_113:
    speaker: rapi
    en: Good. Then let's go.
    ko: 좋아. 그럼 가자.
    ja: 都合がいいわ。行きましょう。
  event_ce006_1_01_e_114:
    speaker: roam
    en: I'm going too.
    ko: 나도 같이 간다.
    ja: 私も一緒に行く。
  event_ce006_1_01_e_115:
    speaker: "<Self>"
    en: It might be dangerous.
    ko: 롬이? 위험할지도 모르는데.
    ja: ロムが？危険かもしれないぞ
  event_ce006_1_01_e_116:
    speaker: roam
    en: I am a transport robot. I can carry parts.
    ko: 나 운반용 로봇. 부품 잘 들고 올 수 있다.
    ja: 私は運搬用ロボット。運ぶことは得意。
  event_ce006_1_01_e_117:
    speaker: "<Self>"
    en: "... All right, if you insist."
    ko: "…알겠어. 그럼 부탁할게."
    ja: "…分かった。そこまで言うなら頼む"
event_ce006_1_02_s:
  event_ce006_1_02_s_1:
    speaker: "<Narration>"
    en: "*Crack*!"
    ko: 스칵-!
    ja: ザンッ！
  event_ce006_1_02_s_2:
    speaker: "<Monologue>"
    en: A Rapture is cleaved neatly in two and collapses.
    ko: 랩쳐가 깔끔하게 두 동강 나며 쓰러진다.
    ja: ラプチャーが見事に両断され、崩れ落ちた
  event_ce006_1_02_s_3:
    speaker: "<Monologue>"
    en: EVE raises the sword she is holding toward her head, and the blade instantaneously
      transforms into a hair clip.
    ko: |-
      이브는 들고 있던 검을 머리 쪽으로 가져갔고,
      검은 순식간에 머리 장식으로 변했다.
    ja: |-
      イヴが手を頭に近づけると、
      握られた剣が瞬く間に髪飾りへと形を変えた
  event_ce006_1_02_s_4:
    speaker: ce006_01
    en: Good to know that I can cut through them.
    ko: 좋아. 벨 수 있어.
    ja: よかった。斬れる。
  event_ce006_1_02_s_5:
    speaker: rapi
    en: "... All clear."
    ko: "…상황 종료."
    ja: "…状況終了。"
  event_ce006_1_02_s_6:
    speaker: anis
    en: Y-you use a sword?
    ko: 카, 칼을 쓰네?
    ja: け、剣で戦うの？
  event_ce006_1_02_s_7:
    speaker: neon
    en: Scarlet also uses swords.
    ko: 홍련도 칼 쓰잖아요.
    ja: 紅蓮もそうじゃないですか。
  event_ce006_1_02_s_8:
    speaker: neon
    en: Hers doesn't transform into a hair clip though.
    ko: |-
      저는 그것보다 더 신경 쓰이는 건,
      칼이 머리 장식으로 바뀌는 거예요.
    ja: |-
      私はそれよりも、髪飾りに
      変形したことの方が興味あります。
  event_ce006_1_02_s_9:
    speaker: neon
    en: How does that work?
    ko: 무슨 원리로 그렇게 되는 거죠?
    ja: どういう原理なんですか？
  event_ce006_1_02_s_10:
    speaker: ce006_01
    en: I'm not familiar with the mechanics of it.
    ko: 글쎄. 원리는 잘 모르겠는데.
    ja: さあ。原理はよく知らない。
  event_ce006_1_02_s_11:
    speaker: neon
    en: If that's possible, do you think you could get a pair of glasses to turn into
      a gun?
    ko: 응용하면 안경이 총으로 바뀌는 것도 가능하지 않을까요?
    ja: 応用すれば、眼鏡を銃に変えたりできますよね？
  event_ce006_1_02_s_12:
    speaker: ce006_01
    en: I'm not sure about glasses, but we do have drones that transform into weapons
      as well.
    ko: 안경은 잘 모르겠는데, 드론이 총으로 바뀌는 건 가능해.
    ja: |-
      眼鏡は分からないけど、
      ドローンを銃に変えることはできる。
  event_ce006_1_02_s_13:
    speaker: neon
    en: "?!"
    ko: 예?
    ja: えっ？
  event_ce006_1_02_s_14:
    speaker: soundonly_a
    en: Now it's our turn to show you something cool.
    ko: 이번엔 우리가 멋진 모습을 보여줄 때네.
    ja: 今度は俺たちの見せ場か。
  event_ce006_1_02_s_15:
    speaker: soundonly_l
    en: Show 'em, EVE.
    ko: 이브. 보여줘요.
    ja: イヴ。見せてあげてください！
  event_ce006_1_02_s_16:
    speaker: anis
    en: Gah! What the... where did you come from?
    ko: |-
      아잇 깜짝이야.
      뭐, 뭐야 갑자기. 어디서 나온 거야?
    ja: |-
      えっ！？びっくりした。
      おどかさないでよ。どこにいるの？
  event_ce006_1_02_s_17:
    speaker: soundonly_l
    en: That drone EVE has is also outfitted with a communication function,
    ko: 이브가 가진 드론은 통신 기능도 겸하고 있거든요.
    ja: イヴのドローンには、通信機能もあるんです。
  event_ce006_1_02_s_18:
    speaker: soundonly_l
    en: and that's not all.
    ko: 그리고, 그것뿐만이 아니죠.
    ja: もちろん、それだけじゃありません。
  event_ce006_1_02_s_19:
    speaker: "<Monologue>"
    en: As EVE stretches her hand forward, the drone floating beside her moves accordingly.
    ko: |-
      이브가 손을 앞으로 내밀자,
      옆에 떠다니던 드론이 함께 움직인다.
    ja: |-
      イヴが手を伸ばすと、
      そばに浮遊していたドローンが動いた
  event_ce006_1_02_s_20:
    speaker: "<Monologue>"
    en: With a mechanical whirring, the drone transforms into a gun and attaches itself
      to EVE's arm.
    ko: "…기계음이 들리며, 드론이 총 모습이 되어 이브의 팔에 달라 붙었다."
    ja: |-
      …機械音の後、ドローンは銃に形を変え
      イヴの腕に装着された
  event_ce006_1_02_s_21:
    speaker: neon
    en: Such... Such firepower!
    ko: 태, 택티컬…!
    ja: タ、タクティカル…！
  event_ce006_1_02_s_22:
    speaker: rapi
    en: "... Very impressive."
    ko: 이건… 대단하네.
    ja: これは…すごい技術ね。
  event_ce006_1_02_s_23:
    speaker: soundonly_l
    en: I made it myself! I call it the Artemis Cannon, aka Drone 2.0!
    ko: |-
      헤헤! 제가 만들었어요 이거!
      이름하여 아르테미스 캐논! 드론 2.0이라고도 부르죠!
    ja: |-
      えへへ！あたしが作ったんです！
      名付けてアルテミスキャノン！
      ドローン2.0とも言います！
  event_ce006_1_02_s_24:
    speaker: soundonly_l
    en: It's compatible with five different ammo types.
    ko: 탄종도 5종이나 호환된다고요!
    ja: 対応できる弾種もなんと、5種類！
  event_ce006_1_02_s_25:
    speaker: neon
    en: Can you make a pair of glasses for me that could turn into a gun?
    ko: |-
      저, 저도 좀 만들어주시면 안 될까요?
      아, 안경이 총으로 바뀌게…!
    ja: |-
      わ、私にも作ってもらえませんか？
      め、眼鏡が銃に変わるタイプの…！
  event_ce006_1_02_s_26:
    speaker: neon
    en: Oooh, and have it be compatible with twenty types of ammo!
    ko: 타, 탄종은 한 20개 정도 호환되도록…!
    ja: 対応弾種は20種類くらいで…！
  event_ce006_1_02_s_27:
    speaker: soundonly_l
    en: Uh... I'll try my best.
    ko: 어… 힘내볼게요.
    ja: えっと…頑張ってみます。
  event_ce006_1_02_s_28:
    speaker: anis
    en: You can ignore half of what she says, you know.
    ko: |-
      일일이 대답 안 해줘도 돼.
      그냥 절반정도는 흘려들어도 되는 내용이니까.
    ja: |-
      いちいちまじめに答えてくれなくていいわよ。
      半分くらいは聞き流して。
  event_ce006_1_02_s_29:
    speaker: rapi
    en: So you use a sword for close combat, and firearms for ranged combat?
    ko: 근접전에서는 검, 원거리에서는 총기를 사용하는 거야?
    ja: |-
      接近戦では剣、遠距離では銃を
      使い分けられるの？
  event_ce006_1_02_s_30:
    speaker: ce006_01
    en: Pretty much, though it can change depending on the situation.
    ko: |-
      그런 셈이지.
      때에 따라 달라지기도 하지만.
    ja: |-
      そういうこと。
      時と場合にもよるけど。
  event_ce006_1_02_s_31:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_02_s_32:
    speaker: rapi
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_1_02_s_33:
    speaker: rapi
    en: I mean no offense, but...
    ko: 오해하지 말고 들어줘.
    ja: 誤解しないで聞いて。
  event_ce006_1_02_s_34:
    speaker: neon
    en: Whenever people say that, they're totally about to say something offensive.
    ko: 보통 저런 말을 미리 깔아놓으면 오해하게끔 만드는 말이던데요.
    ja: |-
      そういう前置きをわざわざするなら、
      誤解されるような話でしょうか。
  event_ce006_1_02_s_35:
    speaker: rapi
    en: It might be best not to use your sword.
    ko: 검은 사용하지 않는 편이 좋겠어.
    ja: 剣の使用は控えて。
  event_ce006_1_02_s_36:
    speaker: ce006_01
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_ce006_1_02_s_37:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_02_s_38:
    speaker: ce006_01
    en: Very well. I won't use it.
    ko: |-
      아. 알겠어.
      사용하지 않을게.
    ja: |-
      ああ。分かった。
      使わないようにする。
  event_ce006_1_02_s_39:
    speaker: ce006_01
    en: Your primary offensive strategy is engaging in long-range combat using firearms.
      All of your established tactics and formations are based around that.
    ko: |-
      너희들의 전투 방법은 총기를 사용한 원거리 전이지?
      그걸 위한 전술과 포메이션도 확립되어 있을 테고.
    ja: |-
      あなたたちは、銃を使った遠距離戦が主体ね？
      戦術やフォーメーションも
      それに合わせたもののはず。
  event_ce006_1_02_s_40:
    speaker: ce006_01
    en: If I were to start using a sword, it would throw everything off.
    ko: 거기에 검을 쓰는 내가 끼면 모든 게 망가질 테니까.
    ja: |-
      私が剣を持って飛び込んでいったら、
      連携が崩れてしまう。
  event_ce006_1_02_s_41:
    speaker: rapi
    en: Precisely. Thank you for understanding.
    ko: 맞아. 이해해 줘서 고마워.
    ja: その通りよ。理解が早くて助かるわ。
  event_ce006_1_02_s_42:
    speaker: ce006_01
    en: Not at all.
    ko: 아냐. 이쪽이야 말로 배려해 줘서 고마워.
    ja: いいえ。わざわざ忠告ありがとう。
  event_ce006_1_02_s_43:
    speaker: anis
    en: Wow, so friendly.
    ko: 훈훈한걸.
    ja: 誤解されなくてよかったわね。
  event_ce006_1_02_s_44:
    speaker: neon
    en: Yeah.
    ko: 그러게요.
    ja: そうですね。
  event_ce006_1_02_s_45:
    speaker: rapi
    en: There's a scrap heap further up ahead. We should be able to find the parts
      we need there.
    ko: |-
      앞으로 조금만 더 가면 고철 산이 있어.
      그곳이라면 원하는 부품을 얻을 수 있을 거야.
    ja: |-
      ここから少し先に鉄くずの山があるわ。
      そこなら探している物があるかも。
event_ce006_1_02_e:
  event_ce006_1_02_e_1:
    speaker: ce006_01
    en: Is this it?
    ko: 이곳이야?
    ja: ここ？
  event_ce006_1_02_e_2:
    speaker: rapi
    en: Yes.
    ko: 응.
    ja: ええ。
  event_ce006_1_02_e_3:
    speaker: ce006_01
    en: There seem to be a lot of things that are fully intact.
    ko: 멀쩡해 보이는 물건들이 많은데.
    ja: 使えそうな物がたくさん。
  event_ce006_1_02_e_4:
    speaker: rapi
    en: Some of them are probably still functional. Most of this stuff has been left
      here only because there's no way to bring it back.
    ko: |-
      실제로 일부는 작동할 거야.
      가져갈 방법이 없어서 여기에 모아놓은 거나 마찬가지니까.
    ja: |-
      まだ動くものもあるはずよ。
      運ぶ方法がなくて、
      放置されただけのものもあるから。
  event_ce006_1_02_e_5:
    speaker: soundonly_l
    en: Really? Then could you pick up that one with the screen for me?
    ko: |-
      정말요?
      그럼 저 화면 달린 걸로 하나만 주워다 주시면 안 돼요?
    ja: |-
      そうなんですか？
      じゃあ、あのモニターがついてるのを
      拾ってきてくれません？
  event_ce006_1_02_e_6:
    speaker: soundonly_a
    en: It'd be nice to find something that we could ride, if at all possible.
    ko: 가능하면 탈것도 좀 보고 싶은데.
    ja: できたら、乗り物も頼む。
  event_ce006_1_02_e_7:
    speaker: anis
    en: Don't you all have more urgent things to worry about? Like, say, spare parts
      to repair your ship?
    ko: |-
      이것들 보세요.
      부품이 더 급한 거 아니었습니까?
    ja: |-
      ちょっと、ちょっと。
      部品探しが最優先でしょ？
  event_ce006_1_02_e_8:
    speaker: soundonly_l
    en: You're right, but it would be an awful waste to pass by all this unbelievable
      stuff.
    ko: 그렇긴 한데, 이런 말도 안 되는 상황을 그냥 넘기기엔 아깝잖아요.
    ja: |-
      そうですけど…
      こんなビッグチャンス、逃したら損です！
  event_ce006_1_02_e_9:
    speaker: soundonly_a
    en: We might be able to find a use for some of it when we return to our world.
    ko: 원래 세계로 돌아가서 응용할 방법이 있을지도 모르고 말이야.
    ja: |-
      それに、元の世界で技術を応用できるかも
      しれないからな。
  event_ce006_1_02_e_10:
    speaker: "<Self>"
    en: "... I'll keep my eyes peeled."
    ko: 뭐… 찾아는 볼게.
    ja: まあ…探してみよう
  event_ce006_1_02_e_11:
    speaker: "<Monologue>"
    en: We search through the scrap heap to find the parts needed to fix the Tetrapod.
    ko: 우리는 고철산을 뒤지며 테트라포드를 고치기 위한 부품을 찾았고.
    ja: |-
      私たちは鉄くずの山をかき分け、
      テトラポッドの修理に使えそうな部品を探した
  event_ce006_1_02_e_12:
    speaker: "<Monologue>"
    en: We are able to find several suitable parts without much difficulty.
    ko: 어렵지 않게 조건에 맞는 부품을 다수 확보할 수 있었다.
    ja: |-
      意外にも、十分な量の条件に合った部品を
      難なく確保できた
  event_ce006_1_02_e_13:
    speaker: ce006_01
    en: Adam. Lily. I think we found everything we're looking for.
    ko: |-
      아담. 릴리.
      다 찾은 것 같아.
    ja: |-
      アダム、リリー。
      これで十分ね。
  event_ce006_1_02_e_14:
    speaker: soundonly_l
    en: Already? This place is a real treasure trove.
    ko: 벌써요? 거기 완전 보물창고 수준인데요?
    ja: |-
      えっ、もう終わりですか？
      お宝の山が目の前にあるのに？
  event_ce006_1_02_e_15:
    speaker: roam
    en: I will transport.
    ko: |-
      내가 운반한다.
      나한테 실어라.
    ja: |-
      私が運搬する。
      載せてくれ。
  event_ce006_1_02_e_16:
    speaker: ce006_01
    en: Thank you.
    ko: 부탁할게.
    ja: お願い。
  event_ce006_1_02_e_17:
    speaker: roam
    en: All loaded?
    ko: 다 실었나?
    ja: これで全部か？
  event_ce006_1_02_e_18:
    speaker: ce006_01
    en: Yeah.
    ko: 응.
    ja: ええ。
  event_ce006_1_02_e_19:
    speaker: roam
    en: Commander. Can I collect some things?
    ko: 지휘관. 수집 좀 해도 되나?
    ja: 指揮官。まだ収集してもいいか？
  event_ce006_1_02_e_20:
    speaker: "<Self>"
    en: You mean artifacts?
    ko: 유물 말이지?
    ja: 遺物探しか？
  event_ce006_1_02_e_21:
    speaker: roam
    en: Yes, there are many artifacts here. But Roam never came here before. Too many
      Raptures.
    ko: |-
      그렇다. 여기 유물 많다.
      랩쳐 많아서 혼자 못 온다.
    ja: |-
      そうだ。大量にある。
      ラプチャーが多いから、単独では来られない。
  event_ce006_1_02_e_22:
    speaker: roam
    en: This is a golden opportunity.
    ko: |-
      절호의 기회.
      절호의 기회란, 자주 오지 않는 기회라는 것.
    ja: |-
      絶好のチャンス。
      絶好のチャンスとは、
      めったにない機会ということ。
  event_ce006_1_02_e_23:
    speaker: roam
    en: Roam can't miss a golden opportunity.
    ko: 롬 절호의 기회 놓칠 수 없다.
    ja: ロムは絶好のチャンスを見逃せない。
  event_ce006_1_02_e_24:
    speaker: "<Self>"
    en: Okay, take what you like. Just don't overdo it.
    ko: 알겠어. 무리가 안될 정도로 챙겨줘.
    ja: 分かった。無理のない程度にしてくれ
  event_ce006_1_02_e_25:
    speaker: roam
    en: Okay.
    ko: 알겠다.
    ja: 分かった。
  event_ce006_1_02_e_26:
    speaker: "<Monologue>"
    en: Roam clanks about as it moves toward the back of the scrap heap.
    ko: 롬은 덜컹거리며 고철 산 뒤쪽으로 이동했다.
    ja: |-
      ロムはガタガタと音を立てながら
      山の裏側へ向かっていった
  event_ce006_1_02_e_27:
    speaker: ce006_01
    en: That little guy reminds me of D1G-g2r.
    ko: 꼭 D1G-g2r같네.
    ja: D1G-g2rみたい。
  event_ce006_1_02_e_28:
    speaker: neon
    en: Digger? We know a Digger too.
    ko: 디거요? 우리도 디거 알아요.
    ja: ディガーですか？私たちも知ってます。
  event_ce006_1_02_e_29:
    speaker: ce006_01
    en: What? How?
    ko: 뭐? 어떻게?
    ja: え？どういうこと？
  event_ce006_1_02_e_30:
    speaker: neon
    en: We have someone called Grave Digger.
    ko: 그레이브 디거라고 있는데
    ja: グレイブディガーというヤツがいるので。
  event_ce006_1_02_e_31:
    speaker: anis
    en: Oh. I was wondering what you were talking about.
    ko: 뭔 소리하나 했다 정말.
    ja: 何を言い出すかと思えば…
  event_ce006_1_02_e_32:
    speaker: ce006_01
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_1_02_e_33:
    speaker: anis
    en: Don't worry about it. It's nothing important.
    ko: 아냐. 잊어줘. 헛소리니까.
    ja: 気にしないで、ホント。冗談だから。
  event_ce006_1_02_e_34:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_02_e_35:
    speaker: ce006_01
    en: You two are certainly...
    ko: 너희들은 뭐랄까….
    ja: あなたたちは、何というか…
  event_ce006_1_02_e_36:
    speaker: ce006_01
    en: animated.
    ko: 활기차 보이네.
    ja: 元気に見える。
  event_ce006_1_02_e_37:
    speaker: neon
    en: Naturally. If we didn't have any energy, we'd be corpses.
    ko: 그럼요. 활기참 빼면 시체거든요.
    ja: |-
      当然です。
      私たちから元気を取ったら、
      ただのしかばねですよ。
  event_ce006_1_02_e_38:
    speaker: ce006_01
    en: Honestly, I'm a little surprised. When I heard about your world, it sounded
      hopeless.
    ko: |-
      솔직히 좀 놀랐어.
      너희가 사는 세계에 대한 이야기를 들었을 때, 절망적이었거든.
    ja: |-
      正直、少し驚いた。
      あなたたちの住んでいる世界は、
      絶望的に聞こえたから。
  event_ce006_1_02_e_39:
    speaker: ce006_01
    en: But none of you seem like you're in despair.
    ko: 그런데 너희는 절망하지 않는 것처럼 보여.
    ja: でも、あなたたちはそう見えない。
  event_ce006_1_02_e_40:
    speaker: anis
    en: Is that the vibe we give off?
    ko: 그렇게 보여?
    ja: そう見える？
  event_ce006_1_02_e_41:
    speaker: ce006_01
    en: Yeah.
    ko: 응.
    ja: ええ。
  event_ce006_1_02_e_42:
    speaker: anis
    en: I see...
    ko: "…그래. 그렇게 보이는구나."
    ja: "…そっか。そう見えるのね。"
  event_ce006_1_02_e_43:
    speaker: anis
    en: What about you guys?
    ko: 너희는 어떤데?
    ja: あなたたちはどうなの？
  event_ce006_1_02_e_44:
    speaker: ce006_01
    en: I think we're quite full of energy as well.
    ko: 음. 우리도 제법 활기찬 편이라고 생각해.
    ja: そうね。私たちも楽観的な方だと思う。
  event_ce006_1_02_e_45:
    speaker: ce006_01
    en: There are some people who aren't, of course, but for the most part, everyone
      is working hard to make the most of a bad situation.
    ko: |-
      그렇지 않은 사람들도 있지만,
      모두 힘내서 살아가려고 하고 있지.
    ja: |-
      そうではない人たちもいるけど、
      たいていは頑張って生きようとしてる。
  event_ce006_1_02_e_46:
    speaker: anis
    en: Sounds like things on your side aren't much better than over here.
    ko: |-
      얘기 들어보니 너희들 쪽도 장난 아니더만.
      많이 힘들겠던데.
    ja: |-
      話を聞いた限り、
      そっちもなかなか大変そうよね。
      かなり苦労してるんじゃない？
  event_ce006_1_02_e_47:
    speaker: ce006_01
    en: It's hard, but we try not to let it show, and put on a brave face.
    ko: 힘들어. 힘든데, 드러내지 않고 활기차게 살아가려고 노력….
    ja: |-
      苦労はしてる。でも、それに負けずに
      生き延びようと努力を…
  event_ce006_1_02_e_48:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_02_e_49:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_02_e_50:
    speaker: ce006_01
    en: Haha. We really are in the same boat.
    ko: 후후. 같구나. 우리.
    ja: ふふ…私たちは似ている。
  event_ce006_1_02_e_51:
    speaker: anis
    en: Haha, seems that way.
    ko: 하하. 그렇지?
    ja: あはは、そうみたいね？
  event_ce006_1_02_e_52:
    speaker: anis
    en: Let's all stay strong. No giving in to despair.
    ko: |-
      서로서로 힘내자고.
      활기차게.
    ja: |-
      お互いに頑張りましょ。
      元気よく。
  event_ce006_1_02_e_53:
    speaker: ce006_01
    en: You bet.
    ko: 그래. 힘내자.
    ja: そうね。頑張ろう。
  event_ce006_1_02_e_54:
    speaker: roam
    en: Commander! Commander!
    ko: 지휘관! 지휘관!
    ja: 指揮官！指揮官！
  event_ce006_1_02_e_55:
    speaker: "<Self>"
    en: What is it?
    ko: 뭐, 뭐야?
    ja: なんだ、どうした？
  event_ce006_1_02_e_56:
    speaker: roam
    en: Big problem! Biiiiiig problem!
    ko: 지휘관! 지휘관! 큰일! 큰일!
    ja: 指揮官！指揮官！大変！大変！
  event_ce006_1_02_e_57:
    speaker: "<Self>"
    en: "!!"
    ko: 이런…!
    ja: どうした…！？
  event_ce006_1_02_e_58:
    speaker: rapi
    en: Roam?!
    ko: 롬…!
    ja: ロム…！？
  event_ce006_1_02_e_59:
    speaker: "<Monologue>"
    en: I run towards the sound of Roam's voice.
    ko: 롬의 소리가 들려온 곳으로 달려간다.
    ja: ロムの声がする方へ走った
  event_ce006_1_02_e_60:
    speaker: roam
    en: Big problem! Big problem!
    ko: 큰일! 큰일!
    ja: 大変！大変！
  event_ce006_1_02_e_61:
    speaker: "<Self>"
    en: I'm coming, hold...!
    ko: 지금 갈게! 조금만 참…!
    ja: 今行く！もう少し待って…
  event_ce006_1_02_e_62:
    speaker: "<Monologue>"
    en: Suddenly, a dark shadow passes overhead.
    ko: 머리 위로 검은 그림자가 빠르게 지나간다.
    ja: 黒い影が頭上を通り過ぎた
  event_ce006_1_02_e_63:
    speaker: "<Monologue>"
    en: It's EVE.
    ko: "…이브가 공중을 날고 있다."
    ja: "…イヴが空を舞っている"
  event_ce006_1_02_e_64:
    speaker: "<Monologue>"
    en: She is soaring through the air by gripping onto anything she can.
    ko: 정확히는, 공중에서 잡을 수 있을만한 모든 것들을 잡으며 빠르게 이동한다.
    ja: |-
      いや、正確には周囲の物を利用しながら、
      目にもとまらぬ速さで移動している
  event_ce006_1_02_e_65:
    speaker: "<Monologue>"
    en: She flips in midair, uses a billboard as a stepping platform, jumps off protruding
      steel girders, and more.
    ko: |-
      공중제비를 돌고, 간판을 도움닫기용 발판으로 쓰기도 하고,
      튀어나온 철근을 밟고 점프한다.
    ja: |-
      宙返りから看板を踏み台として跳躍し、
      飛び出た鉄筋を足掛かりに、再び飛び上がり…
  event_ce006_1_02_e_66:
    speaker: "<Monologue>"
    en: EVE flies past us at remarkable speed.
    ko: 이브는 삽시간에 우릴 가로질러 날듯이 이동한다.
    ja: イヴはまたたく間に私たちを追い越していった
  event_ce006_1_02_e_67:
    speaker: ce006_01
    en: I'll go first!
    ko: 먼저 갈게!
    ja: 先に行ってる！
  event_ce006_1_02_e_68:
    speaker: rapi
    en: Roger! I'll leave it to you!
    ko: 라져! 부탁해!
    ja: 了解！頼んだわ！
  event_ce006_1_02_e_69:
    speaker: neon
    en: What in the world? How is she flying around like that?
    ko: |-
      세상에 저게 뭐죠?
      붕붕 날아다니는데요?
    ja: |-
      どうなってるんですか？
      まるで飛んでるみたいですよ？
  event_ce006_1_02_e_70:
    speaker: anis
    en: Save your surprise for later! We've gotta move quickly!
    ko: 놀라고 있을 때가 아냐! 빨리 가자!
    ja: |-
      驚いてる場合じゃないでしょ！
      こっちも急ぐわよ！
  event_ce006_1_02_e_71:
    speaker: "<Monologue>"
    en: Soon after, we find Roam at the base of the scrap heap,
    ko: 그리고 잠시 후.
    ja: しばらくして
  event_ce006_1_02_e_72:
    speaker: "<Monologue>"
    en: attempting to pull along another transport robot.
    ko: 우리는 고철산 아래에서 또 다른 운반용 로봇을 끌고 가려는 롬을 발견할 수 있었다.
    ja: |-
      ロムは鉄くずの下から、運搬用ロボットを
      引っ張り出そうとしていた
  event_ce006_1_02_e_73:
    speaker: roam
    en: Commander! Big problem!
    ko: 지휘관! 지휘관! 큰일! 큰일!
    ja: 指揮官！指揮官！大変！大変！
  event_ce006_1_02_e_74:
    speaker: roam
    en: Comrade discovered!
    ko: 동료! 발견했다! 동료! 발견했다!
    ja: 仲間！見つけた！仲間！見つけた！
  event_ce006_1_02_e_75:
    speaker: ce006_01
    en: "... Fortunately, nothing's wrong."
    ko: "…다행히, 큰 일은 아니었어."
    ja: "…よかった、大したことじゃなくて。"
  event_ce006_1_02_e_76:
    speaker: anis
    en: Dang it, Roam, you scared the heck out of me! Why are you always overreacting
      like that?
    ko: |-
      아으, 진짜 깜짝 놀랐네.
      하여간 호들갑은.
    ja: |-
      もう、驚かせないで。
      騒ぎ方が大げさよ。
  event_ce006_1_02_e_77:
    speaker: "<Self>"
    en: That's ri- *whew*... Right...!
    ko: 그러, 후우…! 그러게…! 후욱…!
    ja: そう、はぁ…！だな…！ぜぇっ…！
  event_ce006_1_02_e_78:
    speaker: rapi
    en: I'll take a look.
    ko: "…잠깐 보겠습니다."
    ja: "…確認します。"
  event_ce006_1_02_e_79:
    speaker: "<Monologue>"
    en: Rapi approaches Roam and examines the transport robot it is attempting to
      transport.
    ko: |-
      라피가 롬에게 다가간다.
      그리고 롬이 끌고 가려는 운반용 로봇을 쳐다본다.
    ja: |-
      ラピはロムに近づき、
      引き出されかけの運搬用ロボットを調べた
  event_ce006_1_02_e_80:
    speaker: rapi
    en: The coloring on the exterior...
    ko: 이 컬러링과 외장….
    ja: このカラーリングと外装は…
  event_ce006_1_02_e_81:
    speaker: rapi
    en: I've seen this in the manuals before. It's a transport robot which is also
      intended for combat support.
    ko: |-
      교본에서 본 적이 있습니다.
      전투 보조용 운반 로봇입니다.
    ja: |-
      教本で見た記憶があります。
      戦闘補助用に開発された運搬ロボットです。
  event_ce006_1_02_e_82:
    speaker: rapi
    en: From what I can recall, it was in operation even before the First Rapture
      Invasion.
    ko: "…제가 알기론, 랩쳐 침공 이전부터 운용하던 로봇입니다."
    ja: |-
      …私が知る限り、ラプチャー侵攻以前から
      利用されていたものだったかと。
  event_ce006_1_02_e_83:
    speaker: anis
    en: No kidding? That thing's ancient.
    ko: 뭐? 그럼 엄청 오래된 거잖아.
    ja: えっ？じゃあ、かなり古いってこと？
  event_ce006_1_02_e_84:
    speaker: rapi
    en: It was discontinued due to the combat support functions being too costly to
      implement. When it entered mass production, only the transport function remained.
    ko: |-
      생산 코스트 대비 효율이 좋지 못해 전투 보조 기능은 삭제하고,
      운반 기능만 남긴 채 양산화 된 것으로 알고 있습니다.
    ja: |-
      結局コストパフォーマンスの都合で
      戦闘補助能力が廃止され、
      運搬能力のみで量産化されたもののはずです。
  event_ce006_1_02_e_85:
    speaker: rapi
    en: Roam is one of those mass-produced models that followed.
    ko: 그 파생기 중 하나가, 롬과 같은 모델이고요.
    ja: ロムのモデルも、その派生形の一つです。
  event_ce006_1_02_e_86:
    speaker: roam
    en: This is Roam's predecessor?
    ko: 롬 선배인가?
    ja: ロムの先輩？
  event_ce006_1_02_e_87:
    speaker: rapi
    en: You could say that, yes.
    ko: 비슷하다고 할 수 있어.
    ja: そうとも言えるわ。
  event_ce006_1_02_e_88:
    speaker: roam
    en: Is it dead?
    ko: 죽었나?
    ja: 生きているか？
  event_ce006_1_02_e_89:
    speaker: rapi
    en: Not sure. It's such an old model, we'd have to check.
    ko: "…글쎄. 워낙 오래된 모델이라 확인은 해 봐야겠지."
    ja: |-
      …さあ。かなり古いようだし、
      確かめないことには。
  event_ce006_1_02_e_90:
    speaker: "<Self>"
    en: If it's as old as you say, wouldn't it be worth investigating?
    ko: 그만큼 오래된 모델이라면 조사 가치는 크지 않을까?
    ja: |-
      それほど古いものなら、
      調べる価値もありそうだな？
  event_ce006_1_02_e_91:
    speaker: rapi
    en: Absolutely. The chances are low, but we might find traces of lost technology.
    ko: |-
      물론입니다.
      가능성은 낮지만 로스트 테크놀로지의 흔적이 있을지도 모르죠.
    ja: |-
      そうですね。
      ロストテクノロジーが残っている可能性も、
      ないとは言い切れません。
  event_ce006_1_02_e_92:
    speaker: rapi
    en: My suggestion is that we try to bring it back and attempt repairs.
    ko: 일단 회수 후, 수리해 보는 쪽을 권장드립니다.
    ja: |-
      ひとまず回収して、
      修理を試みてはいかがでしょうか。
  event_ce006_1_02_e_93:
    speaker: roam
    en: Are you saving it?
    ko: 살려 주는 건가?
    ja: 助けられるか？
  event_ce006_1_02_e_94:
    speaker: rapi
    en: We're going to try.
    ko: 노력해 볼게.
    ja: できるだけのことはするわ。
  event_ce006_1_02_e_95:
    speaker: roam
    en: So excited!
    ko: 신난다. 신난다.
    ja: うれしい。うれしい。
  event_ce006_1_02_e_96:
    speaker: "<Self>"
    en: All right, then it's settled. Let's head back.
    ko: 좋아. 그럼 복귀하자.
    ja: よし、では帰還しよう
event_ce006_1_03_s:
  event_ce006_1_03_s_1:
    speaker: ce006_03
    en: Let's see... Hmm... Okay, with these parts, I think we can manage.
    ko: |-
      어디 보자… 음.
      이 정도 부품이라면 어떻게든 할 수는 있을 것 같아요.
    ja: |-
      うーん…これだけ部品があれば、
      何とか修理できそうです。
  event_ce006_1_03_s_2:
    speaker: ce006_03
    en: Ideally we'd be able to check the compatibility and all that, but given our
      current situation, that's pretty much impossible.
    ko: |-
      호환성이나 이런 걸 따져보면 좋겠지만,
      지금 그런 걸 따질 때가 아니니까요.
    ja: |-
      互換性が気になるところですが、
      細かいことを言ってる場合じゃないですから。
  event_ce006_1_03_s_3:
    speaker: ce006_npc_01
    en: Let's just get this over and done with.
    ko: 빨리빨리 끝내 버리자고.
    ja: 早く終わらせよう。
  event_ce006_1_03_s_4:
    speaker: ce006_npc_01
    en: As far as I can tell, I think an emergency fix should do the trick.
    ko: 대충 보니 응급 조치만 하면 될 것 같긴 한데….
    ja: ざっと見たところ、応急処置で済みそうだが…
  event_ce006_1_03_s_5:
    speaker: ce006_03
    en: Let's work together. You check the drive system and swap out the parts while
      I keep an eye on the control system.
    ko: 같이 해요. 구동계 점검하고 파츠 교체 부탁해요. 전 제어 시스템을 한번 살펴볼게요.
    ja: |-
      手分けしてやろう。
      駆動システムの点検と、パーツの交換をお願い。
      あたしは制御システムの方を確認するね。
  event_ce006_1_03_s_6:
    speaker: ce006_npc_01
    en: I'd hate to be ambushed at a time like this.
    ko: 쯧… 이럴 때 기습당하는 건 사양하고 싶은데.
    ja: |-
      分かった。
      …何かに襲われる前に片付くといいがな。
  event_ce006_1_03_s_7:
    speaker: ce006_03
    en: You're telling me. I'd take any help I could get right about now.
    ko: 그러게요. 고양이 손이라도 빌리고 싶은 심정이네요.
    ja: そうだね。ネコの手でも借りたいくらいだよ。
  event_ce006_1_03_s_8:
    speaker: ce006_npc_01
    en: Well, I'm afraid you'll have to settle for these two junkers.
    ko: 고양이가 어딨어, 여기 깡통 둘이 전부잖아.
    ja: |-
      ネコどころか、ほとんどポンコツの
      ロボットがいるだけだ。
  event_ce006_1_03_s_9:
    speaker: roam
    en: Can you fix Roam's friend?
    ko: |-
      롬의 동료.
      고칠 수 있나?
    ja: |-
      ロムの仲間。
      直せるか？
  event_ce006_1_03_s_10:
    speaker: ce006_03
    en: Hmm... not sure. I've never seen this type of robot before.
    ko: |-
      음… 글쎄요.
      우리 세계에서는 못 보던 종류의 로봇이라….
    ja: |-
      うーん…どうかな。
      あたしたちの世界では
      見たことないロボットだから…
  event_ce006_1_03_s_11:
    speaker: roam
    en: Useless.
    ko: 무능하다.
    ja: 役に立たない。
  event_ce006_1_03_s_12:
    speaker: ce006_03
    en: Excuse me?
    ko: |-
      무, 무능이요?
      제가요?
    ja: |-
      や、役に立たない？
      あたしが？
  event_ce006_1_03_s_13:
    speaker: roam
    en: Useless. As in you have no ability.
    ko: |-
      무능하다는 건,
      능력이 없다는 것.
    ja: |-
      役に立たないとは、
      能力がないということ。
  event_ce006_1_03_s_14:
    speaker: ce006_03
    en: What the— Nobody insults me like that!
    ko: 우, 우와. 저 살면서 무능하다는 말은 처음 들어봐요.
    ja: |-
      ひっど～い。こんなこと、
      生まれて初めて言われちゃった。
  event_ce006_1_03_s_15:
    speaker: ce006_03
    en: Get out of the way! I'll fix this robot friend of yours if it's the last thing
      I do.
    ko: |-
      비, 비켜봐요. 롬의 동료라는 이 로봇.
      제가 보란 듯이 고쳐볼 테니까.
    ja: |-
      ちょっと下がってて。ロムのお友だち、
      あたしが直してみせるから。
  event_ce006_1_03_s_16:
    speaker: anis
    en: "... You okay there, Lily?"
    ko: 어… 괜찮은 거 맞아?
    ja: あの…本当に大丈夫？
  event_ce006_1_03_s_17:
    speaker: ce006_03
    en: I, Lily Artemis II, am capable of handling any technology!
    ko: 저, 릴리 아르테미스 2세가 다루지 못하는 기술은 없어요!
    ja: |-
      リリー・アルテミスII世に
      扱えない技術はありません！
  event_ce006_1_03_s_18:
    speaker: ce006_03
    en: A robot is the technological pinnacle of whichever world it hails from.
    ko: 로봇이라는 건 응당 그 세계 기술의 정수!
    ja: |-
      ロボットとはすなわち、
      その世界における技術の結晶！
  event_ce006_1_03_s_19:
    speaker: ce006_03
    en: I'll prove to you that I can even fix technologies from other worlds!
    ko: 제가 보란 듯이 고쳐서! 이 세계의 기술마저 다룰 수 있다는 걸 보여드릴게요!
    ja: |-
      あたしが華麗に修理して！
      この世界の技術だって扱えるってことを
      証明してみせます！
  event_ce006_1_03_s_20:
    speaker: ce006_npc_01
    en: Um, don't you think the Tetrapod is a tad more urgent?
    ko: 그보다 내 테트라포드가 더 급한 게….
    ja: それより、早く俺のテトラポッドをだな…
  event_ce006_1_03_s_21:
    speaker: ce006_03
    en: No, I don't!
    ko: 지금 그게 중요한 게 아니라고요!
    ja: そんなの後回し！
  event_ce006_1_03_s_22:
    speaker: ce006_01
    en: I'm inclined to agree with Adam here...
    ko: "…제일 중요한 것 같은데."
    ja: "…そっちが最優先だと思うけど。"
  event_ce006_1_03_s_23:
    speaker: ce006_03
    en: Everyone, quiet! I need to concentrate!
    ko: 다들 조용! 저 집중해야 되니까요!
    ja: 静かにしてください！集中するので！
  event_ce006_1_03_s_24:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_03_s_25:
    speaker: rapi
    en: "... Roam and I will assist."
    ko: "…지휘관. 저와 롬이 옆에서 보조하겠습니다."
    ja: "…指揮官、私とロムもサポートに回ります。"
  event_ce006_1_03_s_26:
    speaker: "<Self>"
    en: "... All right."
    ko: "…그래. 부탁해."
    ja: "…ああ、頼む"
  event_ce006_1_03_s_27:
    speaker: "<Monologue>"
    en: Lily, Roam, and Rapi begin examining the robot Roam picked up.
    ko: 릴리, 롬, 라피는 롬이 주워온 로봇을 자세히 살펴보기 시작했다.
    ja: |-
      リリー、ロム、ラピが協力して
      拾ってきたロボットを調査した
  event_ce006_1_03_s_28:
    speaker: ce006_npc_01
    en: "..."
    ko: "…흠."
    ja: "…ふーむ…"
  event_ce006_1_03_s_29:
    speaker: ce006_npc_01
    en: So what do we do? Wait?
    ko: 마냥 기다릴 수밖에 없나.
    ja: これはもう待つしかないな。
  event_ce006_1_03_s_30:
    speaker: "<Self>"
    en: Is there anything we can help with?
    ko: 혹시 더 도와줄 건 없을까?
    ja: 他に手伝えることはないか？
  event_ce006_1_03_s_31:
    speaker: ce006_npc_01
    en: I don't think so, not at the moment at least. We can only hope that Lily fixes
      that robot quickly.
    ko: |-
      지금 당장은 없을 것 같네.
      릴리가 저 로봇 친구를 빨리 고치길 바랄 수밖에.
    ja: |-
      今のところはない。
      ロボットの修理が早く終わることを願おう。
  event_ce006_1_03_s_32:
    speaker: ce006_npc_01
    en: Oh, by the way, while you guys were out gathering parts, I checked out the
      surroundings.
    ko: 아, 너희가 부품을 구하러 갔을 때 근방을 좀 조사해 봤는데.
    ja: |-
      そうだ、君たちが部品探しに行っている間に
      この辺りを調査してみたんだが…
  event_ce006_1_03_s_33:
    speaker: ce006_npc_01
    en: There's nothing particularly special in the area. Just some run-of-the-mill
      ruins.
    ko: |-
      여기, 딱히 특별할 건 없는 곳이야.
      평범한 폐허인 것 같아.
    ja: |-
      特にめぼしいものはないな。
      ただの廃墟のようだ。
  event_ce006_1_03_s_34:
    speaker: ce006_npc_01
    en: If I had to pick anything that stood out, it would be that lake over there.
      It seems like it was originally the ground level of this city.
    ko: |-
      특이 사항이 있다면… 물이 고여있는 저 호수.
      원래는 이 도시의 1층이었던 것 같더군.
    ja: |-
      変わったものと言えば…あの湖だ。
      どうも建築物が水没した跡らしい。
  event_ce006_1_03_s_35:
    speaker: ce006_npc_01
    en: The water is too murky to get a good look inside, but it seems deep. I think
      it's best we give it a wide berth.
    ko: |-
      물이 탁해 내부를 확인할 수는 없었지만,
      수위로 봐선 깊을 것 같으니 가까이 안 가는 게 좋겠어.
    ja: |-
      水が濁っていて中は確認できなかったが、
      そうとう深いはずだ。近づかない方がいい。
  event_ce006_1_03_s_36:
    speaker: neon
    en: Can I go for a swim?
    ko: 수영해도 될까요?
    ja: 泳げたりしますか？
  event_ce006_1_03_s_37:
    speaker: ce006_npc_01
    en: I'd give that a hard pass.
    ko: 글쎄. 안되지 않을까.
    ja: どうだろう。やめておいた方がいいだろうな。
  event_ce006_1_03_s_38:
    speaker: ce006_npc_01
    en: For some reason, the water is electrified.
    ko: 왜인지 모르겠지만 물속에서 전기가 흐르고 있어.
    ja: 理由は分からないが、湖に電気が流れている。
  event_ce006_1_03_s_39:
    speaker: ce006_npc_01
    en: If you took a dip, you'd end up getting fried. So I'd save the swimming for
      another day.
    ko: 물에 빠지면 전기 구이가 될지도 모르니 수영은 꿈도 꾸지 않는 게 좋을 거야.
    ja: |-
      落ちただけで丸コゲになるかもしれない、
      夢にも考えない方がいいだろう。
  event_ce006_1_03_s_40:
    speaker: neon
    en: I can still dream about it though.
    ko: 꿈 정도는 꿀 수 있잖아요.
    ja: 夢ぐらい見たっていいじゃないですか。
  event_ce006_1_03_s_41:
    speaker: ce006_npc_01
    en: "... Well, I certainly can't stop you from doing that."
    ko: 뭐, 그것까지 말리진 않을게.
    ja: まあ、それは好きにしてくれ。
  event_ce006_1_03_s_42:
    speaker: neon
    en: Can we go fishing?
    ko: 그럼 낚시는 할 수 있지 않을까요?
    ja: だったら、釣りはどうでしょう？
  event_ce006_1_03_s_43:
    speaker: ce006_npc_01
    en: I doubt it.
    ko: |-
      그것도 안되지 않을까.
      전기가 흐른다니까.
    ja: |-
      それも難しいと思うぞ。
      なにしろ電気が流れている。
  event_ce006_1_03_s_44:
    speaker: ce006_npc_01
    en: Considering how much electricity is coursing through that water, there's no
      way any fish would survive in there.
    ko: 물고기가 살아있을 리가 없지.
    ja: 魚も生きてはいられないだろう。
  event_ce006_1_03_s_45:
    speaker: neon
    en: What about electric eels? Maybe there's some of those in there.
    ko: 그 왜 전기뱀장어 같은 건 있을지도 모르잖아요.
    ja: デンキウナギなどなら大丈夫かも知れませんね。
  event_ce006_1_03_s_46:
    speaker: ce006_npc_01
    en: Ooh, touché.
    ko: 오. 논리적이야.
    ja: おお、可能性はあるな。
  event_ce006_1_03_s_47:
    speaker: anis
    en: What in the world is this conversation I'm listening to?
    ko: 무슨 대화야 이게.
    ja: ちょっと、流されないでよ。
  event_ce006_1_03_s_48:
    speaker: ce006_03
    en: Everyone! Come here!
    ko: 다들! 이리 와 봐요!
    ja: みなさん！来てください！
  event_ce006_1_03_s_49:
    speaker: ce006_03
    en: It's all fixed!
    ko: 다 고쳤어요!
    ja: 修理が終わりました！
  event_ce006_1_03_s_50:
    speaker: "<Monologue>"
    en: The robot Roam picked up rattles as it looks around.
    ko: 롬이 주워온 로봇은 덜컹거리며 주위를 둘러보고 있었다.
    ja: |-
      ロムが拾ってきたロボットは、
      ガタガタと音を立てて周囲を確認していた
  event_ce006_1_03_s_51:
    speaker: anis
    en: You fixed it already?
    ko: 아니, 진짜 벌써 고친 거야?
    ja: ホントにもう直せたの？
  event_ce006_1_03_s_52:
    speaker: ce006_03
    en: I told you I could do it.
    ko: |-
      제가 말씀드렸죠?
      고칠 수 있다고.
    ja: |-
      そう言ったでしょ？
      直せるって。
  event_ce006_1_03_s_53:
    speaker: roam
    en: There was a fuse missing. She took one from mine and plugged it in, and it
      came to life.
    ko: |-
      퓨즈 하나가 빠져있었다.
      롬의 퓨즈 하나를 빼서 끼우니 살아났다.
    ja: |-
      ヒューズが一つ外れていた。
      ロムのヒューズを差し込んだら生き返った。
  event_ce006_1_03_s_54:
    speaker: anis
    en: "... So all you did was swap the batteries?"
    ko: 뭐야. 그냥 건전지 끼운 거나 다름없잖아.
    ja: |-
      なんだ、ただ電池を交換したぐらいの
      ことじゃない。
  event_ce006_1_03_s_55:
    speaker: ce006_03
    en: W-well, I'm still the one who figured out what the problem was!
    ko: 그, 그래도 그게 문제였다는 걸 알아낸 건 저니까요!
    ja: でも、それが原因だって突き止めたんです！
  event_ce006_1_03_s_56:
    speaker: roam
    en: That's right. Lily figured it out.
    ko: 맞다. 릴리가 알아냈다.
    ja: そうだ。リリーは役に立った。
  event_ce006_1_03_s_57:
    speaker: ce006_03
    en: Hehe.
    ko: 하하.
    ja: ふふんっ。
  event_ce006_1_03_s_58:
    speaker: roam
    en: Why are you so proud?
    ko: 릴리. 우쭐댄다.
    ja: リリー。調子に乗ってる。
  event_ce006_1_03_s_59:
    speaker: roam
    en: You wouldn't have been able to fix it without Roam.
    ko: 롬이 없었으면 못 고쳤다.
    ja: ロムがいなければ、直せなかった。
  event_ce006_1_03_s_60:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_03_s_61:
    speaker: anis
    en: So, what's it doing?
    ko: "…그래서, 얘는 뭐 하고 있는 거래?"
    ja: "…それで、この子は何をしてるの？"
  event_ce006_1_03_s_62:
    speaker: rapi
    en: I think it's rebooting.
    ko: 재부팅 중인 것 같아.
    ja: 再起動を始めたようね。
  event_ce006_1_03_s_63:
    speaker: com
    en: Com. Restart complete.
    ko: 콤. 재가동 완료.
    ja: コム、再起動完了。
  event_ce006_1_03_s_64:
    speaker: com
    en: Environmental scan complete. Time frame identified.
    ko: |-
      주위 환경 파악 완료.
      시간대 파악 완료.
    ja: |-
      周辺環境、分析完了。
      現在の日時、分析完了。
  event_ce006_1_03_s_65:
    speaker: com
    en: Hmm?
    ko: "…아, 여기는."
    ja: "…ああ、ここは…"
  event_ce006_1_03_s_66:
    speaker: com
    en: Am I back?
    ko: 돌아온 건가.
    ja: 帰ってきたのか。
  event_ce006_1_03_s_67:
    speaker: com
    en: So much time has passed...
    ko: 하지만… 이미 너무 많은 시간이….
    ja: しかし…あまりにも長い時間が…
  event_ce006_1_03_s_68:
    speaker: neon
    en: Wow, for a robot, it's really in touch with its emotions.
    ko: 헉. 로봇답지 않게 말이 뭐랄까 되게 감상적이네요.
    ja: |-
      おや。なんだかロボットらしからぬ
      感傷的な言い回しですね。
  event_ce006_1_03_s_69:
    speaker: anis
    en: Yeah, Roam acts more like your standard robot.
    ko: 그러게. 롬은 누가 봐도 나 로봇이요라고 하고 있는데.
    ja: |-
      そうね。ロムは誰が見ても
      「ワタシハロボットデス」って感じなのに。
  event_ce006_1_03_s_70:
    speaker: roam
    en: I am a robot.
    ko: 롬. 로봇 맞다.
    ja: ロムはロボットだ。
  event_ce006_1_03_s_71:
    speaker: anis
    en: Fair enough.
    ko: 아, 그래. 그렇지.
    ja: ええ、そうね。分かってるわ。
  event_ce006_1_03_s_72:
    speaker: com
    en: Who are you?
    ko: 너희는 누구지?
    ja: 君たちは誰だ？
  event_ce006_1_03_s_73:
    speaker: com
    en: Why are you here?
    ko: 왜 이곳에 있는 건가.
    ja: なぜここにいる？
  event_ce006_1_03_s_74:
    speaker: ce006_npc_01
    en: We're wondering the same thing.
    ko: 글쎄. 그건 우리도 잘 모르겠는데.
    ja: さあな。俺たちも知らないんだ。
  event_ce006_1_03_s_75:
    speaker: com
    en: Are you from the Ark?
    ko: "…너희는, 방주에서 온 건가?"
    ja: "…君たちは、アークから来たのか？"
  event_ce006_1_03_s_76:
    speaker: rapi
    en: You know about the Ark?
    ko: "…방주에 대해 알아?"
    ja: "…アークのことを知っているの？"
  event_ce006_1_03_s_77:
    speaker: com
    en: I know it all too well.
    ko: 그래. 나는 안다. 잘 안다.
    ja: ああ。知っている。よく知っている。
  event_ce006_1_03_s_78:
    speaker: com
    en: 'I ask you again: Are you from the Ark?'
    ko: 다시 묻겠다. 너희는 방주에서 온 건가?
    ja: もう一度聞く。君たちは、アークから来たのか？
  event_ce006_1_03_s_79:
    speaker: neon
    en: This thing kinda creeps me out... like it came from the future to tell us
      that humanity is doomed or something.
    ko: 이, 이분 왠지 인류 종말을 선고하러 온 미래 로봇 같은 느낌이지 않나요?
    ja: |-
      な、何と言うか…未来から人類を滅ぼすために
      やってきたロボットみたいな
      雰囲気がありませんか？
  event_ce006_1_03_s_80:
    speaker: anis
    en: It's certainly way different from Roam. Are you sure there's no one inside
      operating it?
    ko: |-
      롬이랑은 성격이 너무 다른데.
      안에 사람 타고 있는 거 아냐?
    ja: |-
      ロムとは性格が全然違うわね。
      中に誰か入ってるんじゃない？
  event_ce006_1_03_s_81:
    speaker: com
    en: Are you from the Ark?! Answer me!
    ko: 너희는! 방주에서! 온 건가!
    ja: アークから！来たのかと！聞いている！
  event_ce006_1_03_s_82:
    speaker: anis
    en: Yikes! Testy!
    ko: 아잇 깜짝이야!
    ja: なに！？びっくりするじゃない！
  event_ce006_1_03_s_83:
    speaker: rapi
    en: Yes, we're from the Ark. We are the Counters Squad.
    ko: "…그래. 우리는 방주 소속의 카운터스 스쿼드야."
    ja: |-
      …ええ。
      私たちはカウンターズ、
      アークから来た部隊よ。
  event_ce006_1_03_s_84:
    speaker: com
    en: I see.
    ko: |-
      그래. 그렇군.
      방주에서 온 것이로군.
    ja: |-
      そうか、そうか。
      アークから来たのか。
  event_ce006_1_03_s_85:
    speaker: "<Monologue>"
    en: The robot, who has introduced itself as Com, puts some distance between us.
    ko: 콤이라 자신을 칭한 로봇이 우리와 거리를 벌린 후 멈춰 섰다.
    ja: |-
      コムと名乗ったロボットは
      にわかに私たちから距離を取った
  event_ce006_1_03_s_86:
    speaker: "<Monologue>"
    en: It then stops and looks in the direction of the Tetrapod
    ko: 그리고 테트라포드 쪽을 바라보았다.
    ja: カメラがテトラポッドに向けられている
  event_ce006_1_03_s_87:
    speaker: "<Monologue>"
    en: with a mysterious glare.
    ko: "…어째서인지, 콤은 테트라포드를 노려보고 있는 것 같았다."
    ja: |-
      …どういうわけか、私にはそれが
      テトラポッドをにらみ付けているように
      感じられた
  event_ce006_1_03_s_88:
    speaker: com
    en: Ark's property. Destroy.
    ko: 방주의 재산. 부순다.
    ja: アークの財産。破壊する。
  event_ce006_1_03_s_89:
    speaker: "<Narration>"
    en: "*Clank clank*"
    ko: 철컹 철컹!
    ja: ガチャリ！ガチャン！
  event_ce006_1_03_s_90:
    speaker: "<Monologue>"
    en: Com's container opens with a loud mechanical sound,
    ko: 콤의 컨테이너가 요란한 소리를 내며 열렸다.
    ja: コムのコンテナが大きな音を立てて開かれた
  event_ce006_1_03_s_91:
    speaker: "<Monologue>"
    en: revealing multiple missile launchers inside.
    ko: 컨테이너 내부에는 수많은 미사일 사출구가 보였다.
    ja: |-
      中からのぞいたのは、
      大量のミサイル射出口だった
  event_ce006_1_03_s_92:
    speaker: rapi
    en: Everyone, take cover!
    ko: |-
      !!
      전원 엄폐!
    ja: |-
      ！！
      全員ハイド！
  event_ce006_1_03_s_93:
    speaker: "<Narration>"
    en: "*Swooooosh*"
    ko: 푸슈슈슈슉--!!
    ja: バシュッ――！！
  event_ce006_1_03_s_94:
    speaker: "<Monologue>"
    en: A barrage of missiles launch from Com's container.
    ko: 콤의 컨테이너에서 미사일들이 쏟아지듯 발사됐다.
    ja: コムのコンテナから大量のミサイルが放たれた
  event_ce006_1_03_s_95:
    speaker: "<Monologue>"
    en: They tumble wildly through the air before embedding into the ground.
    ko: 허공을 잠시 돌아다니던 미사일들이 지면에 내려 꽃힌다.
    ja: |-
      ミサイルはしばらく虚空を飛び回り、
      地面に突き刺さった
  event_ce006_1_03_s_96:
    speaker: "<Narration>"
    en: "*Boom boom boom boom*"
    ko: 쾅-! 콰앙-! 쾅-! 콰광-!
    ja: ドン！バン！ドン！ガンッ！
  event_ce006_1_03_s_97:
    speaker: neon
    en: "!!"
    ko: 으, 으앗!
    ja: う、わわっ！
  event_ce006_1_03_s_98:
    speaker: ce006_01
    en: What the...?!
    ko: 이게 무슨…!
    ja: いったい何を…！
  event_ce006_1_03_s_99:
    speaker: rapi
    en: Don't move! The missiles have no homing ability!
    ko: 움직이지 마! 호밍 기능은 없어!
    ja: 動かないで！追尾はされてない！
  event_ce006_1_03_s_100:
    speaker: neon
    en: It's just firing wildly!
    ko: 그냥 마구잡이로 쏘고 있는데요!
    ja: 手当たりしだいに乱射してますね！
  event_ce006_1_03_s_101:
    speaker: ce006_03
    en: No!
    ko: 아앗! 안돼!
    ja: ああっ！ダメ！
  event_ce006_1_03_s_102:
    speaker: "<Narration>"
    en: "*Booooom*"
    ko: 콰아아앙-!!
    ja: ドカーン！！
  event_ce006_1_03_s_103:
    speaker: "<Monologue>"
    en: One of the erratic missiles manages to hit the Tetrapod's thruster, and explodes.
    ko: 위태롭게 날아가던 미사일 하나가 테트라포드의 버니어에 명중하며 폭발을 일으켰다.
    ja: |-
      ミサイルの1基がテトラポッドの
      バーニアに命中し、爆発を起こした
  event_ce006_1_03_s_104:
    speaker: ce006_npc_01
    en: My Tetrapod!
    ko: 이런! 내 테트라포드가!
    ja: ああっ！俺のテトラポッドが！
  event_ce006_1_03_s_105:
    speaker: ce006_03
    en: We're doomed!
    ko: 마, 망했어요!
    ja: た、大変っ！
  event_ce006_1_03_s_106:
    speaker: ce006_01
    en: Enough!
    ko: 큿…!
    ja: くっ…！
  event_ce006_1_03_s_107:
    speaker: "<Monologue>"
    en: EVE takes out her sword and charges forward.
    ko: 이브가 검을 빼들고 돌진한다.
    ja: イヴが剣を抜き放ち、飛び出した
  event_ce006_1_03_s_108:
    speaker: "<Monologue>"
    en: She deftly weaves her way through the explosions and closes in on Com in an
      instant.
    ko: 미사일의 폭발들을 뚫고 삽시간에 콤에게 접근한다.
    ja: |-
      イヴはミサイルの爆発をかわしながら、
      素早くコムに迫った
  event_ce006_1_03_s_109:
    speaker: ce006_01
    en: Arrrghh!
    ko: 흐으으읍-!!
    ja: はぁぁぁっ！！
  event_ce006_1_03_s_110:
    speaker: roam
    en: EVE, stop!
    ko: 이브! 이브! 멈춰라! 멈춰라!
    ja: イヴ！イヴ！止まれ！止まれ！
  event_ce006_1_03_s_111:
    speaker: ce006_01
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_ce006_1_03_s_112:
    speaker: "<Monologue>"
    en: EVE stops.
    ko: 이브가 멈춰 선다.
    ja: イヴが手を止めた
  event_ce006_1_03_s_113:
    speaker: "<Narration>"
    en: "*Kooooo*"
    ko: 쿠구구구구--!!
    ja: ドドドド――！！
  event_ce006_1_03_s_114:
    speaker: "<Monologue>"
    en: Roam charges and rams into Com.
    ko: 롬이 돌진해, 콤에게 들이받는다.
    ja: ロムの突進がコムを吹き飛ばした
  event_ce006_1_03_s_115:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!
    ja: ドカン！
  event_ce006_1_03_s_116:
    speaker: com
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_ce006_1_03_s_117:
    speaker: "<Monologue>"
    en: Com and Roam tumble across the ground.
    ko: 콤과 롬이 바닥을 뒹군다.
    ja: 2体のロボットが地面を転がった
  event_ce006_1_03_s_118:
    speaker: "<Monologue>"
    en: Com is no longer moving.
    ko: 콤은 더 이상 움직이지 않는다.
    ja: コムの動きが止まった
  event_ce006_1_03_s_119:
    speaker: roam
    en: Roam's newer. More sturdy.
    ko: 롬이 더 최신형. 더 단단하다.
    ja: ロムの方が新型。コムより頑丈。
  event_ce006_1_03_s_120:
    speaker: ce006_01
    en: "... And what about Com?"
    ko: "…이 로봇… 콤은?"
    ja: "…コムを…壊したの？"
  event_ce006_1_03_s_121:
    speaker: roam
    en: I think the fuse is missing again.
    ko: 퓨즈 또 빠진 것으로 추정.
    ja: またヒューズが抜けたと推測する。
  event_ce006_1_03_s_122:
    speaker: roam
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_s_123:
    speaker: roam
    en: No further threat is posed.
    ko: 생명에는 지장 없다.
    ja: 命に別状はない。
  event_ce006_1_03_s_124:
    speaker: ce006_01
    en: "... Okay. That's a relief."
    ko: "…그래. 다행이네."
    ja: "…そう。よかった。"
  event_ce006_1_03_s_125:
    speaker: rapi
    en: I'm disarming this thing, right now. I let my guard down because it was an
      old model.
    ko: |-
      …일단 무장을 전부 해제할게.
      오래된 모델이라 방심했어.
    ja: |-
      …まずは、武装解除からね。
      旧式だからと油断していたわ。
  event_ce006_1_03_s_126:
    speaker: neon
    en: It attacked the moment we said we were from the Ark.
    ko: 저희가 방주 소속이라고 하자마자 공격했죠?
    ja: |-
      アークから来たと言ったとたんに
      攻撃してきましたね？
  event_ce006_1_03_s_127:
    speaker: anis
    en: Yeah. It seems like it has some kind of grudge against the Ark.
    ko: 응. 방주에 뭔가 원한…? 같은 게 있는 것 같은데.
    ja: |-
      そうね。アークを恨んでる…？とか、
      そんなとこかしら。
  event_ce006_1_03_s_128:
    speaker: anis
    en: Good grief, even robots are giving us a hard time now.
    ko: 하하. 이제 하다 하다 로봇한테도 원한을 사네.
    ja: |-
      あ～あ。とうとうロボットにも
      恨まれるようになっちゃったのね。
  event_ce006_1_03_s_129:
    speaker: "<Self>"
    en: For now, let's lock it up somewhere safe. It could tell us some useful information.
    ko: "…일단 안전한 어딘가에 가둬놓자. 얘기를 좀 들어봐야겠어."
    ja: |-
      …ひとまず、安全な場所に拘束しておこう。
      事情を聞かなければ
  event_ce006_1_03_s_130:
    speaker: rapi
    en: Got it.
    ko: 알겠습니다.
    ja: 了解しました。
  event_ce006_1_03_s_131:
    speaker: "<Self>"
    en: Also, we've got a bigger problem...
    ko: 여기도 여긴데… 저쪽도 문제네.
    ja: こちらも問題だが…あちらがもっと大変そうだ
  event_ce006_1_03_s_132:
    speaker: ce006_03
    en: Ahhh! The Tetrapod!
    ko: 으아--!! 테트라포드가--!!
    ja: ああ～！！テトラポッドが！！
  event_ce006_1_03_s_133:
    speaker: ce006_npc_01
    en: Stop overreacting. It was already broken. Now it's just a little more broken,
      that's all.
    ko: |-
      호들갑 떨지 마.
      원래 고장 난 게 좀 더 고장 난 것뿐이야.
    ja: |-
      大げさだな。
      もともと壊れていたものが、
      もう少し壊れただけさ。
  event_ce006_1_03_s_134:
    speaker: ce006_03
    en: Your voice is shaking.
    ko: 목소리 떨리고 있는데요.
    ja: 声が震えてるけど？
  event_ce006_1_03_s_135:
    speaker: ce006_npc_01
    en: "*Sigh*... Poor Tetrapod..."
    ko: 하아… 내 테트라포드.
    ja: はぁ…俺のテトラポッド…
  event_ce006_1_03_s_136:
    speaker: ce006_01
    en: How bad is it?
    ko: 상태는 어떤 것 같아?
    ja: 状態はどう？
  event_ce006_1_03_s_137:
    speaker: ce006_03
    en: The missile happened to impact the area that had already sustained damage.
    ko: 하필 또 고장 난 부분에 미사일이 직격 됐어요.
    ja: |-
      よりによって、壊れてた部分に
      ミサイルが直撃です。
  event_ce006_1_03_s_138:
    speaker: ce006_03
    en: Luckily, it wasn't a particularly powerful missile,
    ko: 위력이 그렇게 큰 미사일은 아니라 다행이긴 한데….
    ja: |-
      威力がそれほど強くなかったのが、
      不幸中の幸いですけど…
  event_ce006_1_03_s_139:
    speaker: ce006_03
    en: but from the looks of it, I'd say the damage is pretty severe.
    ko: 딱 보기에도 많이 망가졌네요.
    ja: パッと見ただけでもボロボロですね。
  event_ce006_1_03_s_140:
    speaker: ce006_01
    en: Do you think we can fix it?
    ko: 고칠 수 있을까?
    ja: 直せそう？
  event_ce006_1_03_s_141:
    speaker: ce006_03
    en: We can, but it'll take a while.
    ko: |-
      고칠 수는 있어요.
      시간이 좀 더 많이 걸릴 뿐이죠.
    ja: |-
      直すことはできます。
      もっと時間がかかるだけです。
  event_ce006_1_03_s_142:
    speaker: ce006_03
    en: Damn that robot! I should've never...
    ko: 아으~! 내가 저 로봇을 그냥…!
    ja: も～っ！あのロボットめ…！
  event_ce006_1_03_s_143:
    speaker: ce006_npc_01
    en: For now, we'll have to do what we can with the parts we have.
    ko: 일단 가져온 부품들로 어떻게 해보는 수밖에.
    ja: |-
      とりあえず、手元にあるパーツで
      何とかするしかないな。
event_ce006_1_03_e:
  event_ce006_1_03_e_1:
    speaker: "<Monologue>"
    en: Lily and Adam are busy repairing the Tetrapod.
    ko: 릴리와 아담은 테트라포드를 고치는 것에 여념이 없었다.
    ja: |-
      リリーとアダムがテトラポッドの修理に
      没頭している
  event_ce006_1_03_e_2:
    speaker: ce006_npc_01
    en: Wrench.
    ko: 릴리. 스패너.
    ja: リリー。スパナ。
  event_ce006_1_03_e_3:
    speaker: ce006_03
    en: Here. Pass the screwdriver, please.
    ko: |-
      여기요.
      아담. 드라이버 좀 주세요.
    ja: |-
      はい。
      アダム。ドライバーちょうだい。
  event_ce006_1_03_e_4:
    speaker: ce006_npc_01
    en: Here. Hm... I think this needs to be secured and adjusted a bit.
    ko: |-
      여기.
      음… 이건 고정을 좀 하고 손봐야 할 것 같은데.
    ja: |-
      ほら。
      うーん…こいつは固定してからの方が
      良さそうだな。
  event_ce006_1_03_e_5:
    speaker: ce006_npc_01
    en: Vice.
    ko: 릴리. 바이스.
    ja: リリー。固定具をくれ。
  event_ce006_1_03_e_6:
    speaker: ce006_03
    en: I'll go get it.
    ko: 예. 준비할게요.
    ja: うん、準備するね。
  event_ce006_1_03_e_7:
    speaker: "<Monologue>"
    en: Meanwhile, we start our conversation with Com, who has been revived, or had
      its fuse reinserted, rather.
    ko: |-
      그리고 우리는 다시 깨어난,
      정확히는 퓨즈를 다시 끼운 콤과 대화를 시작했다.
    ja: |-
      私たちはそれを横目に、再び目覚めさせた…
      正確には、電源を入れ直したコムと
      会話を試みた
  event_ce006_1_03_e_8:
    speaker: com
    en: I have nothing to say to the likes of you.
    ko: 방주 놈들과는 할 말 없다.
    ja: アークの関係者と話すことなどない。
  event_ce006_1_03_e_9:
    speaker: com
    en: Untie me.
    ko: 그러니 날 풀어라.
    ja: 解放してくれ。
  event_ce006_1_03_e_10:
    speaker: anis
    en: Why did you attack us out of nowhere?
    ko: 너 말이야. 갑자기 왜 우릴 공격한 거야?
    ja: あなたねえ。なんでいきなり攻撃してきたのよ？
  event_ce006_1_03_e_11:
    speaker: com
    en: I didn't intend on harming you.
    ko: 너희를 공격할 생각은 없었다.
    ja: 君たちへの攻撃は意図していない。
  event_ce006_1_03_e_12:
    speaker: com
    en: I was only trying to destroy Ark property.
    ko: 방주의 재산을 부수려 한 것뿐.
    ja: 目標はアークの財産に対する破壊だけだった。
  event_ce006_1_03_e_13:
    speaker: com
    en: Unfortunately, my missile pod malfunctioned.
    ko: 미사일 포드가 오작동을 일으켰다.
    ja: それ以外のことはミサイルポッドの誤作動だ。
  event_ce006_1_03_e_14:
    speaker: rapi
    en: What Ark property?
    ko: 방주의 재산…?
    ja: アークの財産…？
  event_ce006_1_03_e_15:
    speaker: com
    en: That transport aircraft.
    ko: |-
      그렇다.
      저 수송기. 방주의 재산.
    ja: |-
      そうだ。
      あの輸送機はアークの財産。
  event_ce006_1_03_e_16:
    speaker: com
    en: I will destroy everything that benefits the Ark.
    ko: 방주에게 도움이 되는 것은 다 부순다.
    ja: アークに資するものは、すべて破壊する。
  event_ce006_1_03_e_17:
    speaker: com
    en: I will destroy everything that belongs to the Ark!
    ko: 방주의 재산은 모두 부순다!!
    ja: アークの財産は、すべて破壊する！！
  event_ce006_1_03_e_18:
    speaker: neon
    en: But that doesn't belong to the Ark.
    ko: 저 수송기 방주 거 아닌데요?
    ja: あの輸送機はアークのものではありませんが？
  event_ce006_1_03_e_19:
    speaker: com
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_e_20:
    speaker: com
    en: I apologize.
    ko: 사과한다.
    ja: 謹んで謝罪する。
  event_ce006_1_03_e_21:
    speaker: anis
    en: "... Well, at least you're quick with an apology."
    ko: 허이구. 사과는 빨라서 좋네.
    ja: あのね…まあ謝るのが早いのはいいことかしら…
  event_ce006_1_03_e_22:
    speaker: anis
    en: So why have you got this axe to grind with the Ark? Why do you want to destroy
      what belongs to it?
    ko: 그래서, 방주에 무슨 원한이 있어서 방주의 재산을 부수려 한 건데?
    ja: で、アークにどんな恨みがあるって言うのよ？
  event_ce006_1_03_e_23:
    speaker: com
    en: Because the Ark stole what belonged to me.
    ko: 방주가 내 재산을 빼앗아 갔기 때문.
    ja: アークは私の財産を奪った。
  event_ce006_1_03_e_24:
    speaker: com
    en: An eye for an eye. A tooth for a tooth.
    ko: 눈에는 눈. 이에는 이.
    ja: 目には目を。歯には歯を。
  event_ce006_1_03_e_25:
    speaker: "<Self>"
    en: What was taken from you?
    ko: 재산이라니… 뭘…?
    ja: 財産とは…具体的には…？
  event_ce006_1_03_e_26:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_e_27:
    speaker: com
    en: You work for the Ark.
    ko: 말하고 싶지 않다.
    ja: 回答を拒否する。
  event_ce006_1_03_e_28:
    speaker: com
    en: I'm not telling you anything.
    ko: |-
      너희는 방주의 부하.
      그러니 말하지 않는다.
    ja: |-
      お前たちはアークの手先だ。
      教えるいわれはない。
  event_ce006_1_03_e_29:
    speaker: anis
    en: What in the world...
    ko: "…뭐야 대체."
    ja: "…一体なんなのよ。"
  event_ce006_1_03_e_30:
    speaker: roam
    en: Com. I'm Roam.
    ko: 콤. 나는 롬.
    ja: コム。私はロム。
  event_ce006_1_03_e_31:
    speaker: roam
    en: Humans and Nikkes here. Nice.
    ko: 이곳에 있는 인간, 니케. 다 착하다.
    ja: ここにいる人間、ニケ。みんな優しい。
  event_ce006_1_03_e_32:
    speaker: roam
    en: They can help you.
    ko: 콤을 도와줄 수 있다.
    ja: コムを助けられる。
  event_ce006_1_03_e_33:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_e_34:
    speaker: com
    en: I didn't ask for help.
    ko: 너나 도움 많이 요청해라.
    ja: 君は好きなように助けを求めればいい。
  event_ce006_1_03_e_35:
    speaker: com
    en: You're nothing but an Ark lapdog who licks their boots.
    ko: 방주에 꼬리나 흔드는 충견아.
    ja: アークにしっぽを振るイヌめ。
  event_ce006_1_03_e_36:
    speaker: anis
    en: Dang, this robot can even talk smack.
    ko: 으아 얘 말하는 것 좀 봐.
    ja: うわあ、口が悪いわ。
  event_ce006_1_03_e_37:
    speaker: roam
    en: Harsh words.
    ko: 심한 말.
    ja: ひどい言葉。
  event_ce006_1_03_e_38:
    speaker: roam
    en: I'm hurt.
    ko: 롬. 상처받았다.
    ja: ロム。傷ついた。
  event_ce006_1_03_e_39:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_e_40:
    speaker: "<Self>"
    en: Com.
    ko: "…콤."
    ja: "…コム"
  event_ce006_1_03_e_41:
    speaker: "<Self>"
    en: Won't you tell us what happened?
    ko: 무슨 일이 있었는지 알려주지 않을래?
    ja: 何があったのか教えてはもらえないか？
  event_ce006_1_03_e_42:
    speaker: "<Self>"
    en: I... hate the Ark as well. We might be able to help you.
    ko: |-
      어… 나도 방주 싫어하거든.
      네 도움이 될 수 있을 거야.
    ja: |-
      その…私もアークには思うところがある。
      君の力になれるはずだ
  event_ce006_1_03_e_43:
    speaker: com
    en: Get lost, Ark lapdog.
    ko: |-
      꺼져라.
      방주에 꼬리나 흔드는 충견아.
    ja: |-
      失せろ。
      アークにしっぽを振るイヌめ。
  event_ce006_1_03_e_44:
    speaker: "<Self>"
    en: Hey, that hurt...
    ko: "…진짜 상처받네 이거."
    ja: "…実際言われてみると傷つくな…"
  event_ce006_1_03_e_45:
    speaker: anis
    en: Whatever. Screw this thing.
    ko: 됐어. 그냥 냅둬.
    ja: いいじゃない。放っときましょ。
  event_ce006_1_03_e_46:
    speaker: neon
    en: But shouldn't we try to help? It's clearly been through some trauma. Maybe
      we can help it heal.
    ko: 예? 마음의 상처는 타인에 의해서 치유되는 거니까 저희가 도와줘야 하지 않을까요?
    ja: |-
      何を言うんです？心に傷を負った時こそ、
      周りの支えが必要なものでしょう？
  event_ce006_1_03_e_47:
    speaker: anis
    en: If it was the least bit conflicted, maybe. But it clearly has no intention
      of cozying up to us.
    ko: |-
      머뭇거리는 기색이라도 보이면 또 모르겠는데,
      그럴 생각이 없잖아.
    ja: |-
      迷ってるとかならそうだけど、
      それすらないじゃない。
  event_ce006_1_03_e_48:
    speaker: anis
    en: It doesn't even want to talk to us.
    ko: 말할 생각 없어 저거.
    ja: まったく話す気なさそうだし。
  event_ce006_1_03_e_49:
    speaker: anis
    en: So screw it. It's unarmed and we've got it locked up, so it's not like it
      can do anything anyway.
    ko: |-
      그냥 냅둬.
      어차피 무장도 없고 갇혀있어서 아무것도 못할 테니까.
    ja: |-
      放っておけばいいのよ。
      もう武器もないし、何もできないでしょ。
  event_ce006_1_03_e_50:
    speaker: neon
    en: Hm...
    ko: 음….
    ja: ですが…
  event_ce006_1_03_e_51:
    speaker: anis
    en: Let's leave this thing to rot, and go help them fix the Tetrapod.
    ko: 가자. 저 테트라포드인가 뭔가 하는 거 고치는 거나 돕자고.
    ja: |-
      行きましょ。それよりテトラポッドだか
      何だったかの修理を手伝った方がいいわ。
  event_ce006_1_03_e_52:
    speaker: anis
    en: Or stand guard nearby.
    ko: 아니면 인근에서 보초나 서던가.
    ja: それか、見張りでもするか。
  event_ce006_1_03_e_53:
    speaker: rapi
    en: I think at least one person should stand guard.
    ko: "…그래도 한 명쯤은 감시를 하는 편이 좋아."
    ja: "…1人は監視をつけておきたいわ。"
  event_ce006_1_03_e_54:
    speaker: roam
    en: I will stay here and keep an eye on Com.
    ko: 그럼 롬이 여기서 콤을 감시한다.
    ja: では、ロムはここでコムを見ている。
  event_ce006_1_03_e_55:
    speaker: rapi
    en: You will?
    ko: "…네가?"
    ja: "…あなたが？"
  event_ce006_1_03_e_56:
    speaker: roam
    en: Yes. I do not need to sleep.
    ko: 그렇다. 롬은 잠자지 않아도 된다.
    ja: そうだ。ロムは寝る必要が無い。
  event_ce006_1_03_e_57:
    speaker: roam
    en: Perfect for standing guard.
    ko: 그러니 감시에 적합.
    ja: 見張りに最適。
  event_ce006_1_03_e_58:
    speaker: roam
    en: Com is also weaker than Roam.
    ko: 그리고 콤은 롬보다 약하다.
    ja: それに、コムはロムより弱い。
  event_ce006_1_03_e_59:
    speaker: roam
    en: I will win every time.
    ko: 싸우면 백전백승.
    ja: 戦えば百戦百勝。
  event_ce006_1_03_e_60:
    speaker: roam
    en: Out of 100 fights, I win 100.
    ko: |-
      백전백승이란 건,
      백번 싸워서 백번 이긴다는 것.
    ja: |-
      百戦百勝とは、
      百回戦えば百回勝つということ。
  event_ce006_1_03_e_61:
    speaker: "<Self>"
    en: Okay. We'll leave it to you.
    ko: "…알겠어. 맡길게."
    ja: "…分かった。頼む"
  event_ce006_1_03_e_62:
    speaker: neon
    en: If anything happens, give us a shout.
    ko: 혹시 무슨 일 생기면 크게 불러주세요.
    ja: もし何かあったら、大声で呼んでくださいね。
  event_ce006_1_03_e_63:
    speaker: roam
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_e_64:
    speaker: roam
    en: "-----"
    ko: |-
      ------.
      ------.
    ja: |-
      ――――――
      ――――――
  event_ce006_1_03_e_65:
    speaker: roam
    en: If anything happens, shou...
    ko: 무슨 일 생기면 크게---.
    ja: 何かあったら、大声で――
  event_ce006_1_03_e_66:
    speaker: neon
    en: Roam? Are you okay?
    ko: |-
      ??
      롬. 괜찮아요?
    ja: |-
      ？？
      ロム、大丈夫ですか？
  event_ce006_1_03_e_67:
    speaker: roam
    en: Okay. If anything happens, I will shout.
    ko: 알겠다. 무슨 일 생기면 크게 부른다.
    ja: 分かった。何かあったら、大声で呼ぶ。
  event_ce006_1_03_e_68:
    speaker: neon
    en: I know this isn't the ideal time to be saying this... but I really would love
      to go fishing.
    ko: |-
      이런 와중에 정말 죄송한데,
      저는 낚시를 해야겠어요.
    ja: |-
      こんな時に申し訳ないですが、
      やはり私は釣りをします。
  event_ce006_1_03_e_69:
    speaker: anis
    en: "... At least you're somewhat self-aware."
    ko: 그래도 미안한 건 알아서 다행이네.
    ja: こんな時なのは分かってるわけね。
  event_ce006_1_03_e_70:
    speaker: anis
    en: Anyway, you heard Adam. That lake is electrified.
    ko: 저기 전기 흐른다잖아.
    ja: 電気が流れてるって聞いたでしょ？
  event_ce006_1_03_e_71:
    speaker: neon
    en: Yes, and therefore, insulated gloves are a must. I've got a few pairs, would
      you like one?
    ko: |-
      절연 장갑은 필수품이거든요.
      다섯 켤레 정도 있는데, 드릴까요?
    ja: |-
      絶縁グローブは必需品でしょうね。
      5組ほどありますが、使いますか？
  event_ce006_1_03_e_72:
    speaker: anis
    en: No, thanks. And why are you carrying those around anyway?
    ko: 됐네요. 애초에 왜 들고 다니는 거야 그런 걸.
    ja: |-
      いらない。
      だいたいなんでそんなもの持ち歩いてるのよ。
  event_ce006_1_03_e_73:
    speaker: neon
    en: Listen carefully, Anis. This body of water is huge, nearly the size of a lake.
    ko: |-
      잘 들어봐요 아니스. 이곳에 있는 저 물웅덩이.
      사실상 호수나 다름없는 크기거든요.
    ja: |-
      アニス、よく聞いてください。
      あの大きさの水たまりは、もはや湖です。
  event_ce006_1_03_e_74:
    speaker: neon
    en: Who's to say there aren't new species of fish swimming around in it?
    ko: 저 안에 새로운 물고기가 없을 거라는 보장이 없거든요.
    ja: |-
      つまり、新種の魚類が
      生息しているかもしれません。
  event_ce006_1_03_e_75:
    speaker: neon
    en: We could even end up pulling up some buried treasure!
    ko: 혹시 아나요? 보물 같은 걸 건질지도요!
    ja: もしかしたら、お宝だって見つかるかも！
  event_ce006_1_03_e_76:
    speaker: ce006_01
    en: That's true.
    ko: 맞는 말이야.
    ja: その通りね。
  event_ce006_1_03_e_77:
    speaker: ce006_01
    en: You can catch all sorts of things while fishing in our world as well.
    ko: 우리 세계에서도, 낚시로 많은 걸 건질 수 있었어.
    ja: |-
      私たちの世界でも、
      釣りで色々なものが手に入る。
  event_ce006_1_03_e_78:
    speaker: ce006_01
    en: Sometimes you reel in a chest, and you can find useful things inside them.
    ko: 가끔 상자가 낚이는데, 안을 열어보면 쓸만한 것들이 있는 경우가 많았어.
    ja: |-
      たまに釣れる箱には、
      便利なものが入っていることが多かった。
  event_ce006_1_03_e_79:
    speaker: anis
    en: What the heck is this whacky world that you're from...
    ko: 어떤 세계에서 살다 온 거야 너.
    ja: あなたたち、どういう世界で生きてたの？
  event_ce006_1_03_e_80:
    speaker: ce006_01
    en: If you're intent on fishing, I can help.
    ko: 낚시를 할 생각이라면 도와줄게.
    ja: 釣りをする気なら、私にもやらせて。
  event_ce006_1_03_e_81:
    speaker: ce006_01
    en: I'm something of an angler myself.
    ko: 자신 있기도 하고.
    ja: 腕には自信がある。
  event_ce006_1_03_e_82:
    speaker: neon
    en: Sure! Let's have a fishing battle!
    ko: 좋아요! 그럼 지금부터 낚시 배틀 시작이에요!
    ja: |-
      いいですね！
      今から釣りバトルの開幕です！
  event_ce006_1_03_e_83:
    speaker: anis
    en: How the heck does a fishing battle work?
    ko: 아니… 뭘로 배틀할 건데….
    ja: 釣りバトルって…競争する必要ある？
  event_ce006_1_03_e_84:
    speaker: "<Self>"
    en: Why don't we sit back and watch this unfold? It's not like we have much else
      to do.
    ko: "…딱히 할 일도 없으니 낚시 배틀 구경이나 할까."
    ja: "…他にすることもない、観戦するとしよう…"
  event_ce006_1_03_e_85:
    speaker: rapi
    en: Sure.
    ko: "…그러시죠."
    ja: "…そうですね。"
  event_ce006_1_03_e_86:
    speaker: "<Narration>"
    en: "*Clunk clunk*"
    ko: 덜컹- 덜컹-
    ja: ガタ、ガタ
  event_ce006_1_03_e_87:
    speaker: "<Narration>"
    en: Roam opens the container and lays out the artifacts it collected.
    ko: 롬은 컨테이너를 열어 수집한 유물들을 펼쳐놓았다.
    ja: ロムがコンテナを開き、収集した遺物を広げた
  event_ce006_1_03_e_88:
    speaker: "<Narration>"
    en: With precise movements, it begins sorting them.
    ko: 그리고 정교한 움직임으로 유물들을 분류하기 시작했다.
    ja: そして、よどみのない動きで分類を始めた
  event_ce006_1_03_e_89:
    speaker: roam
    en: A plate.
    ko: 접시.
    ja: 皿。
  event_ce006_1_03_e_90:
    speaker: roam
    en: An implement used when eating.
    ko: 식사할 때 쓰는 것.
    ja: 食事の時に使うもの。
  event_ce006_1_03_e_91:
    speaker: roam
    en: It is useful. Transport.
    ko: 쓸모 있다. 운반한다.
    ja: 有用。運搬する。
  event_ce006_1_03_e_92:
    speaker: com
    en: What are you doing?
    ko: 무슨 일을 하는 거지?
    ja: 何をしている？
  event_ce006_1_03_e_93:
    speaker: roam
    en: Sorting artifacts.
    ko: 유물 분류.
    ja: 遺物の分類。
  event_ce006_1_03_e_94:
    speaker: com
    en: Why?
    ko: 어째서지.
    ja: なんのために？
  event_ce006_1_03_e_95:
    speaker: roam
    en: Roam is making a second Ark.
    ko: 롬은 제2의 방주 만든다.
    ja: ロムは第2のアークを作る。
  event_ce006_1_03_e_96:
    speaker: roam
    en: A precious home.
    ko: |-
      제2의 방주란,
      소중한 보금자리.
    ja: |-
      第2のアークは、
      大切なねぐら。
  event_ce006_1_03_e_97:
    speaker: roam
    en: Chipper. Heehee. Haha. Happy place.
    ko: 시끌벅적. 하하 호호. 행복한 장소.
    ja: ガヤガヤ。はは、ほほ。幸せな場所。
  event_ce006_1_03_e_98:
    speaker: com
    en: And you're doing that on your own?
    ko: 혼자서 만드는 건가.
    ja: 自分だけでやっているのか。
  event_ce006_1_03_e_99:
    speaker: roam
    en: That's right.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_1_03_e_100:
    speaker: com
    en: For how long?
    ko: 얼마동안?
    ja: いつから？
  event_ce006_1_03_e_101:
    speaker: roam
    en: It's been a very long time.
    ko: 오래됐다.
    ja: ずっと昔から。
  event_ce006_1_03_e_102:
    speaker: com
    en: Talk about pointless.
    ko: 무의미하다.
    ja: 無意味だ。
  event_ce006_1_03_e_103:
    speaker: roam
    en: That means there's no point.
    ko: |-
      무의미하다란,
      의미가 없다는 것.
    ja: |-
      無意味とは、
      意味がないということ。
  event_ce006_1_03_e_104:
    speaker: roam
    en: That's not true. There is much meaning to a second Ark.
    ko: |-
      그렇지 않다.
      제2의 방주는 의미 있다.
    ja: |-
      そうではない。
      第2のアークは意味がある。
  event_ce006_1_03_e_105:
    speaker: neon
    en: All right! I caught something!
    ko: 좋아! 뭔가 걸렸어요!
    ja: やった！かかりました！
  event_ce006_1_03_e_106:
    speaker: ce006_01
    en: Me too. It's a big one.
    ko: 나도야. 제법 무거운데.
    ja: 私も。結構重たい。
  event_ce006_1_03_e_107:
    speaker: neon
    en: Hyyyaaaah!
    ko: 이야압--!!
    ja: おりゃああーっ！
  event_ce006_1_03_e_108:
    speaker: neon
    en: "... Darn it. It's a chair."
    ko: "…에이. 의자네요."
    ja: "…残念、イスでした。"
  event_ce006_1_03_e_109:
    speaker: ce006_01
    en: Mine's... a box.
    ko: 나는… 상자네.
    ja: 私は…箱が釣れた。
  event_ce006_1_03_e_110:
    speaker: anis
    en: You do realize fishing is about getting fish, don't you?
    ko: "…너희들, 낚시하고 있는 거 맞지?"
    ja: "…あなたたち、魚が釣りたいのよね？"
  event_ce006_1_03_e_111:
    speaker: com
    en: You'll never complete an entire Ark.
    ko: 제2의 방주는 완성할 수 없다.
    ja: 第2のアークは完成しえない。
  event_ce006_1_03_e_112:
    speaker: roam
    en: I will complete it.
    ko: 완성한다.
    ja: 完成する。
  event_ce006_1_03_e_113:
    speaker: com
    en: You're bound to fail.
    ko: 너는 실패한다.
    ja: 君は失敗するだろう。
  event_ce006_1_03_e_114:
    speaker: com
    en: What you're doing has no value.
    ko: 너의 일은 아무런 가치가 없다.
    ja: 君のしていることには、何の価値もない。
  event_ce006_1_03_e_115:
    speaker: roam
    en: Untrue. The second Ark has value.
    ko: |-
      가치 있다.
      제2의 방주, 가치 있는 곳.
    ja: |-
      価値がある。
      第2のアークは、価値のある場所。
  event_ce006_1_03_e_116:
    speaker: roam
    en: Therefore, what I am doing has value.
    ko: 그러므로 롬이 하는 일, 가치 있다.
    ja: だから、ロムの仕事は、価値がある。
  event_ce006_1_03_e_117:
    speaker: com
    en: Even if it does, no one will ever see it.
    ko: 아무리 가치 있는 일이라 해도 누구도 알아주지 않는다.
    ja: その価値を、誰が認めてくれるというのだ。
  event_ce006_1_03_e_118:
    speaker: com
    en: All those years you've spent, all this "value" you say it has.
    ko: 너의 오랜 시간, 네가 지켜온 가치는 아무도 알아주지 않은 채.
    ja: |-
      君が長い間守ろうとしている価値は
      誰にも知られることが無い。
  event_ce006_1_03_e_119:
    speaker: com
    en: It will all disappear.
    ko: 그저 사라진다.
    ja: ただ、消えるだけだ。
  event_ce006_1_03_e_120:
    speaker: roam
    en: Is that what happened to Com?
    ko: 콤은 그랬나?
    ja: コムはそうだったのか？
  event_ce006_1_03_e_121:
    speaker: com
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_03_e_122:
    speaker: neon
    en: Oooh! I caught a real whopper this time!
    ko: 오! 이번엔 진짜 뭔가 큰 게 걸렸는데요?
    ja: おっ！今度は大物の手ごたえですよ？
  event_ce006_1_03_e_123:
    speaker: ce006_01
    en: Seems like it. Your fishing rod is almost about to snap.
    ko: 그래 보이네. 낚싯줄이 엄청 휘었어.
    ja: そうみたいね。竿のしなり方が違う。
  event_ce006_1_03_e_124:
    speaker: neon
    en: Haha! Looks like I'm gonna be the winner of this battle!
    ko: 하하! 아무래도 이 승부! 제 승리인 것 같네요!
    ja: |-
      ふふふ！どうやらこのバトル！
      私の勝ちのようですね！
  event_ce006_1_03_e_125:
    speaker: roam
    en: I'm different.
    ko: 롬은 다르다.
    ja: ロムは違う。
  event_ce006_1_03_e_126:
    speaker: roam
    en: I'm superior to you.
    ko: 콤보다 롬이 더 우수하기 때문.
    ja: ロムはコムより性能が高い。
  event_ce006_1_03_e_127:
    speaker: com
    en: You will fail!
    ko: 너는 실패한다!
    ja: 失敗する！
  event_ce006_1_03_e_128:
    speaker: com
    en: Your actions have no value!
    ko: 너의 행동은 아무런 가치가 없다!
    ja: 君の行いには、何の価値もない！
  event_ce006_1_03_e_129:
    speaker: com
    en: And even if they do, no one will ever notice it!
    ko: 가치가 있다고 해도 누구도 알아주지 않는다!
    ja: あったとしても、分かる者はいない！
  event_ce006_1_03_e_130:
    speaker: com
    en: It'll all be destroyed by the Ark!
    ko: 방주가! 그것을 다 부술 것이다!
    ja: アークが！すべてを壊す！
  event_ce006_1_03_e_131:
    speaker: roam
    en: Calm down.
    ko: 진정해라.
    ja: 落ち着け。
  event_ce006_1_03_e_132:
    speaker: com
    en: I can't!
    ko: 진정할 수 없다!
    ja: これが落ち着けるものか！
  event_ce006_1_03_e_133:
    speaker: com
    en: If you knew what's beneath that lake,
    ko: 저 호수 아래 무엇이 있는지 알면!
    ja: あの湖の底に何があるかを知れば…！
  event_ce006_1_03_e_134:
    speaker: com
    en: you wouldn't be able to calm down either!
    ko: 너도 진정할 수 없을 것이다!
    ja: 君とて、落ち着いてはいられないはずだ！
  event_ce006_1_03_e_135:
    speaker: neon
    en: Hyyyaaaah!
    ko: 으으리아아압--!!
    ja: おりゃあああああっ！！
  event_ce006_1_03_e_136:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-!
    ja: ピン！
  event_ce006_1_03_e_137:
    speaker: "<Monologue>"
    en: Neon's fishing line flies into the air,
    ko: 네온의 낚싯줄이 하늘로 튀어 오른다.
    ja: ネオンの釣り糸が空高くに跳ね飛んだ
  event_ce006_1_03_e_138:
    speaker: "<Monologue>"
    en: and something lands on the ground with a loud splat.
    ko: 그리고 뭔가가 큰 소리를 내며 바닥에 떨어졌다.
    ja: 何かが大きな音をたて、地面に転がった
  event_ce006_1_03_e_139:
    speaker: neon
    en: "*Gasp*!"
    ko: "…히이…!"
    ja: "…ひっ…！"
  event_ce006_1_03_e_140:
    speaker: ce006_01
    en: What is it?
    ko: "!! 이건…!"
    ja: "！！これは…！"
  event_ce006_1_03_e_141:
    speaker: "<Monologue>"
    en: A disembodied arm lies on the ground, soaking wet and covered in moss.
    ko: 물에 흠뻑 젖고, 이끼 낀 팔은.
    ja: その水びたしの、コケがむした腕は…
  event_ce006_1_03_e_142:
    speaker: "<Monologue>"
    en: Mechanical components protrude from the point where the arm was severed.
    ko: 기계로 만들어진 단면을 드러내고 있었다.
    ja: |-
      機械であるということを
      断面がかろうじて物語っていた
event_ce006_1_intermission_01:
  event_ce006_1_intermission_01_1:
    speaker: anis
    en: Explain to us what this is.
    ko: 너. 이게 어떻게 된 건지 설명해.
    ja: ねえ。どういうことか説明して。
  event_ce006_1_intermission_01_2:
    speaker: com
    en: I don't know.
    ko: 모른다.
    ja: 知らない。
  event_ce006_1_intermission_01_3:
    speaker: anis
    en: Then what was all that talk about how we'd be freaking out if we knew what
      was below this lake?
    ko: |-
      네가 말했다며.
      호수 아래 무엇이 있는지 알면 진정할 수 없을 거라고.
    ja: |-
      話は聞いてるわよ。
      湖の底に何があるか知ったら
      落ち着いていられなくなる、って。
  event_ce006_1_intermission_01_4:
    speaker: com
    en: I didn't say that.
    ko: 그런 말 한 적 없다.
    ja: そんなことは記憶にない。
  event_ce006_1_intermission_01_5:
    speaker: roam
    en: Nice try, but Roam has it on file.
    ko: |-
      롬이 들었다.
      녹음 파일도 확보되어 있다.
    ja: |-
      ロムが記憶している。
      録音ファイルも保存した。
  event_ce006_1_intermission_01_6:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_intermission_01_7:
    speaker: anis
    en: Well, turns out you're right. We are freaking out.
    ko: 그래. 네 말대로 진정할 수가 없네.
    ja: お望み通り、落ち着けなくなったわ。
  event_ce006_1_intermission_01_8:
    speaker: anis
    en: What the hell is a Nikke's arm doing in that lake?
    ko: 니케 팔이 나왔다고.
    ja: ニケの腕でしょ、これ。
  event_ce006_1_intermission_01_9:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_intermission_01_10:
    speaker: com
    en: If you look beneath the lake, you will know.
    ko: 호수 아래를 보면 알게 될 거다.
    ja: 湖の底を見れば分かるだろう。
  event_ce006_1_intermission_01_11:
    speaker: anis
    en: Okay. I understand that you don't want to cooperate.
    ko: 오케이. 협조해 줄 생각 없는 거 알았고.
    ja: オッケー。協力する気はないってことね。
  event_ce006_1_intermission_01_12:
    speaker: anis
    en: Seems like we'll have to see for ourselves what's under there.
    ko: 일단 저 호수 아래에 뭐가 있는지 확인부터 해야 할 것 같은데.
    ja: |-
      おかげでまずはあの湖の下に何があるか、
      確かめないといけなくなったわ。
  event_ce006_1_intermission_01_13:
    speaker: rapi
    en: Right. We need to see if the rest of the body is in there.
    ko: 맞아. 니케의 팔만 있을지, 아니면 팔의 주인이 같이 있을지도 확인해야 해.
    ja: そうね。残りの部分があるかもしれないわ。
  event_ce006_1_intermission_01_14:
    speaker: "<Self>"
    en: The only problem is all the electricity coursing through the water.
    ko: 문제는 전기가 흐른다는 건데….
    ja: 問題は電流か…
  event_ce006_1_intermission_01_15:
    speaker: neon
    en: What if we make a suit out of all the insulated gloves that I brought?
    ko: 절연장갑들을 옷으로 만들어서 들어가면….
    ja: 絶縁グローブをつないで服にするとか…
  event_ce006_1_intermission_01_16:
    speaker: anis
    en: That's a brilliant idea!
    ko: |-
      정말 대단한 생각이야.
      천재적인데?
    ja: |-
      わ～すごいアイデアね～
      天才じゃないかしら～？
  event_ce006_1_intermission_01_17:
    speaker: neon
    en: Hehe, I thought so too.
    ko: 그렇죠?
    ja: でしょう？
  event_ce006_1_intermission_01_18:
    speaker: anis
    en: But none of us can swim. That'll make searching for something underwater difficult,
      to say the least.
    ko: |-
      그런데 우리 수영도 못 하잖아.
      안에 들어가서 뭘 확인하기 너무 힘들 것 같은데.
    ja: |-
      いや、そもそも私たちは泳げないでしょ。
      潜れたとしても、どう確認するのよ。
  event_ce006_1_intermission_01_19:
    speaker: rapi
    en: Let's take care of the electricity for now. Once we've handled that, we can
      think about what to do next.
    ko: |-
      전기부터 해결해 보자.
      그다음에 어떻게 할지 생각하는 게 좋을 것 같아.
    ja: |-
      電流の問題が最優先ね。
      他の障害のことは後でもいいわ。
  event_ce006_1_intermission_01_20:
    speaker: anis
    en: Now that we're on the topic, don't you find it strange?
    ko: 그런데 전기라….
    ja: 電流、って言われてもねえ…
  event_ce006_1_intermission_01_21:
    speaker: anis
    en: Where is the power supply for all this electricity coming from?
    ko: |-
      생각해 보니 이상하네.
      어디서 전기가 계속 흘러들어오고 있는 거지?
    ja: |-
      考えてみたら、おかしいじゃない。
      どこから電気が来てるのよ？
  event_ce006_1_intermission_01_22:
    speaker: ce006_03
    en: There's probably an unmanned power plant nearby supplying electricity to the
      ground floor.
    ko: |-
      아마 근처에 무인으로 돌아가는 발전소가 있을 거예요.
      거기서 1층에 지속적으로 전기를 넣어주고 있었을 테고.
    ja: |-
      きっと近くに無人の発電所か何かがあって、
      そこから送電されているんだと思います。
  event_ce006_1_intermission_01_23:
    speaker: ce006_03
    en: When the first floor was flooded, it turned the entire lake into an electrical
      hazard.
    ko: 1층에 물이 차는 바람에 전기가 흐르는 호수가 되었겠죠.
    ja: |-
      電気を受け取っていた建物が水没して、
      そんなことになっちゃったんじゃないかなと。
  event_ce006_1_intermission_01_24:
    speaker: ce006_npc_01
    en: Do you think we can locate this power plant?
    ko: 위치를 알 수 있을까?
    ja: その発電所の場所は見当がつくか？
  event_ce006_1_intermission_01_25:
    speaker: ce006_03
    en: Tracing the flow of electricity back to the source is easy enough. The issue
      is that the source is inside the lake.
    ko: |-
      역추적으로 해보면 알 수 있는데,
      문제는 역추적할 전기가 호수 안에서 흐르고 있다는 거죠.
    ja: |-
      たどる方法はあるけど、
      問題はそれをするにも電流がジャマってこと。
  event_ce006_1_intermission_01_26:
    speaker: ce006_03
    en: Do any of you have a map, by any chance?
    ko: 혹시, 인근의 지도 같은 게 없을까요?
    ja: そうだ、この辺りの地図はないですか？
  event_ce006_1_intermission_01_27:
    speaker: rapi
    en: Maps aren't a thing up on the surface, and even if they were, they'd be so
      outdated that we couldn't depend on them.
    ko: |-
      지상의 지도는 없어.
      있다고 하더라도 신용할 수 없지. 개정이 안되니까.
    ja: |-
      地上の地図はないわ。
      あったとしても、信頼できるものではない。
      最新の情報とは限らないから。
  event_ce006_1_intermission_01_28:
    speaker: ce006_01
    en: Then I guess we have no choice but to look around.
    ko: 그럼 주위를 둘러볼 수밖에 없겠네.
    ja: なら、この目で確認するしかなさそうね。
  event_ce006_1_intermission_01_29:
    speaker: rapi
    en: Fine. Then let's prepare and move...
    ko: 좋아. 그럼 가볍게 준비하고 바로 출발….
    ja: そうなるわ。準備が終わり次第、すぐに…
  event_ce006_1_intermission_01_30:
    speaker: privaty
    en: That won't be necessary.
    ko: 그럴 필요는 없어요.
    ja: その必要はありません。
  event_ce006_1_intermission_01_31:
    speaker: privaty
    en: Now that I'm here.
    ko: 제가 왔으니까.
    ja: 私が来ましたので。
  event_ce006_1_intermission_01_32:
    speaker: "<Self>"
    en: Privaty? Where did you come from?
    ko: "…응? 프리바티가 갑자기 어디서…."
    ja: "…プリバティ？いつの間に…"
  event_ce006_1_intermission_01_33:
    speaker: privaty
    en: You guys should have done a better job setting up a security perimeter.
    ko: 정말이지. 경계 정도는 세워놓지 그래요?
    ja: |-
      まったく、呆れました。
      見張りくらいは立てておくべきでしょう？
  event_ce006_1_intermission_01_34:
    speaker: privaty
    en: If I'd been a Rapture, you'd all be dead.
    ko: 제가 아니라 랩쳐였으면 여러분은 전멸했어요.
    ja: |-
      これが私ではなくラプチャーだったら、
      みなさんは今ごろ全滅です。
  event_ce006_1_intermission_01_35:
    speaker: rapi
    en: If it'd been a Rapture, we would have heard it coming.
    ko: 랩쳐였다면 소리로 미리 알았겠지.
    ja: ラプチャーなら、音で分かるわ。
  event_ce006_1_intermission_01_36:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_intermission_01_37:
    speaker: privaty
    en: Anyway. The Central Government sent me.
    ko: |-
      아, 아무튼.
      중앙 정부 측에서 저를 올려 보냈어요.
    ja: |-
      と、とにかく。
      中央政府からの指令で事態の監視に来ました。
  event_ce006_1_intermission_01_38:
    speaker: privaty
    en: We can't afford to leave this situation unmonitored, no matter how small the
      impact of the D-Wave is this time around.
    ko: |-
      제 아무리 이번 D-WAVE의 영향이 적다고는 해도,
      감시하지 않을 순 없으니까요.
    ja: |-
      いくら今回はD-WAVEが微弱といっても、
      無視できるものではありませんから。
  event_ce006_1_intermission_01_39:
    speaker: neon
    en: Don't they trust us? How rude!
    ko: 너무해요. 우릴 못 믿는 건가요?
    ja: |-
      心外ですね。
      私たちのことが信じられないんですか？
  event_ce006_1_intermission_01_40:
    speaker: privaty
    en: The Central Government trusts you. They're simply monitoring the state of
      affairs to see if any further intervention is necessary.
    ko: |-
      누구보다 믿, 아니아니.
      중앙 정부의 개입이 필요할지 여부를 감시하는 거예요.
    ja: |-
      私は誰よりも…いえ。
      まず中央政府の介入が必要かどうかから、
      確認が必要ですので。
  event_ce006_1_intermission_01_41:
    speaker: privaty
    en: This is a volatile situation,
    ko: 갑자기 상황이 급변할 수도 있고, 또.
    ja: 事態が急変する可能性もないとは言えませんし。
  event_ce006_1_intermission_01_42:
    speaker: privaty
    en: and we have no idea what unpredictable actions individuals affected by D-Waves
      might get up to.
    ko: "…저쪽의 D-WAVE 대상자들이 어떤 돌발 행동을 할지 미지수니까요."
    ja: |-
      …あとは、D-WAVE対象者が
      突発的な行動に出る可能性もありますから。
  event_ce006_1_intermission_01_43:
    speaker: ce006_03
    en: Huh? Are you talking about us?
    ko: 어? 우리말하는 거죠?
    ja: なに？あたしたちのこと？
  event_ce006_1_intermission_01_44:
    speaker: ce006_npc_01
    en: Unfortunately, I believe she is.
    ko: 안타깝게도, 그런 것 같네.
    ja: 残念ながら、そのようだ。
  event_ce006_1_intermission_01_45:
    speaker: ce006_01
    en: When you say unpredictable actions, what do you mean?
    ko: 돌발 행동이라면 어떤 걸 말하는 거지?
    ja: 突発的な行動って、たとえば？
  event_ce006_1_intermission_01_46:
    speaker: privaty
    en: It's hard to say. I suppose that's why I said it's unpredictable, genius.
    ko: 글쎄요. 그걸 모르니 돌발 행동이지 않을까요?
    ja: |-
      さあ。それが分からないから、
      突発的行動と言うのでは？
  event_ce006_1_intermission_01_47:
    speaker: ce006_03
    en: Who are you, barging in here acting all high and mighty?
    ko: |-
      그나저나 누구세요?
      갑자기 와서 엄청 거들먹거리시네.
    ja: |-
      それはそうと、どちら様ですか？
      いきなり出てきてずいぶん偉そうですけど。
  event_ce006_1_intermission_01_48:
    speaker: privaty
    en: "!!"
    ko: 거, 거들먹…!
    ja: え、偉そう…！？
  event_ce006_1_intermission_01_49:
    speaker: privaty
    en: I am Privaty, from Triangle. We are a defense force employed by the Central
      Government to respond to forces which pose threats to the Ark.
    ko: 흐, 흠! 저는 중앙 정부 방주 수비군 휘하 방주 위협 제어 부대 트라이앵글의 프리바티예요.
    ja: |-
      ふんっ！
      中央政府・アーク防衛軍指揮下
      アーク脅威制御部隊トライアングル所属、
      プリバティです。
  event_ce006_1_intermission_01_50:
    speaker: ce006_03
    en: What a long-winded explanation.
    ko: "…부대 이름이 그렇게나 길어요?"
    ja: "…肩書きが長すぎない？"
  event_ce006_1_intermission_01_51:
    speaker: privaty
    en: "... As far as you're concerned, I'm Privaty from Triangle."
    ko: "…트라이앵글의, 프리바티로만 알고 있어도 괜찮아요."
    ja: |-
      …では、トライアングル所属、
      プリバティとだけ覚えていてください。
  event_ce006_1_intermission_01_52:
    speaker: privaty
    en: At any rate, my official role here is to conduct surveillance, but I can also
      offer general support.
    ko: 아무튼, 표면상으로는 감시지만 사실상 지원이나 마찬가지예요.
    ja: |-
      とにかく…名目上は監視役ですが
      敵ではありません。
  event_ce006_1_intermission_01_53:
    speaker: privaty
    en: I overheard that you're looking for a power plant nearby?
    ko: 오면서 들었는데, 인근의 발전소를 찾고 계신다고 했죠?
    ja: |-
      途中から聞いていましたが、
      近くの発電施設を探すのでしょう？
  event_ce006_1_intermission_01_54:
    speaker: ce006_03
    en: Yes, that's right.
    ko: 예. 그렇죠?
    ja: まあ、そうですけど？
  event_ce006_1_intermission_01_55:
    speaker: privaty
    en: I know the location. The Central Government's field units received updated
      maps of the surface.
    ko: |-
      제가 위치를 알아요.
      지상의 지도는 중앙 정부 직속 부대원에게는 개정판이 지급되니까.
    ja: |-
      こちらに情報があります。
      中央政府直属の者にのみ支給される
      最新版の地上地形図です。
  event_ce006_1_intermission_01_56:
    speaker: neon
    en: Huh? Why just you? Wouldn't it be better if everyone got a copy?
    ko: |-
      응? 왜요?
      모두한테 나눠주면 좋을 텐데.
    ja: |-
      え？そんなものがあるんですか？
      全員に配ってくれればいいのに。
  event_ce006_1_intermission_01_57:
    speaker: privaty
    en: Beats me. I suppose we're lucky that way.
    ko: 글쎄요. 특권 같은 것 아닐까요?
    ja: |-
      私に言わないでください。
      とにかく、そういうものなので。
  event_ce006_1_intermission_01_58:
    speaker: anis
    en: Yeah right. They're just keeping us in line by meting out information piecemeal.
    ko: 무슨. 정보를 쥐고 흔들려고 그러는 거겠지.
    ja: |-
      はいはい。そういう特権を使って
      他人より優位に立とうってことでしょ。
  event_ce006_1_intermission_01_59:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_intermission_01_60:
    speaker: privaty
    en: That Central Government does no such thing.
    ko: 중앙 정부는 그런 짓을 하지 않아요.
    ja: 中央政府はそんな卑劣なことをしません。
  event_ce006_1_intermission_01_61:
    speaker: anis
    en: That's precisely what a squad member in the Central Government special forces
      would say.
    ko: 라고, 중앙 정부 직속 스쿼드 멤버께서 말씀하시네요.
    ja: "…その中央政府直属のご本人様に言われてもね。"
  event_ce006_1_intermission_01_62:
    speaker: privaty
    en: Do you want the location of the power plant or not?
    ko: 아 발전소 위치 필요해요, 안 필요해요?
    ja: 発電所の情報、不要なのですか？
  event_ce006_1_intermission_01_63:
    speaker: anis
    en: Oh, by all means, be so kind as to grace us with the location, oh mighty officer.
    ko: 아이고 필요하고 말고요. 중앙 정부 직속 스쿼드님.
    ja: |-
      は～い、教えてくださ～い！
      中央政府直属のエリート様！
  event_ce006_1_intermission_01_64:
    speaker: privaty
    en: "..."
    ko: "…정말."
    ja: "…まったく…"
  event_ce006_1_intermission_01_65:
    speaker: "<Self>"
    en: Did you come here alone, Privaty?
    ko: |-
      그런데 프리바티.
      설마 혼자 올라온 거야?
    ja: |-
      プリバティ、ひとつ気になったんだが…
      まさか単独でここまで来たのか？
  event_ce006_1_intermission_01_66:
    speaker: privaty
    en: No. I brought support.
    ko: 아뇨. 지원군을 데려왔어요.
    ja: いいえ。私の他にもいます。
  event_ce006_1_intermission_01_67:
    speaker: privaty
    en: I predict that she'll prove quite helpful... although I'll have to wait and
      see if I'm correct in that assumption.
    ko: 든든… 한지는 조금 지켜봐야 알겠지만, 도움이 될 거예요.
    ja: |-
      頼もしい…かどうかは断言できませんが、
      能力はあるかと。
  event_ce006_1_intermission_01_68:
    speaker: privaty
    en: This place is full of uncertainties, and she's the only one I can think of
      who would be able to handle it.
    ko: 이런 미확정 요소가 가득한 곳에서 활약해 줄 분이시죠.
    ja: |-
      今のような未知の要素ばかりの状況では
      特に実力を発揮できる方です。
  event_ce006_1_intermission_01_69:
    speaker: anis
    en: Stop dragging it out and just tell us who it is, for crying out loud.
    ko: 뜸 좀 그만 들이면 안 될까?
    ja: もったいぶらないで誰か教えてよ。
  event_ce006_1_intermission_01_70:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_intermission_01_71:
    speaker: privaty
    en: She hung back to investigate the entrance. She'll be here soon.
    ko: 입구 쪽에서 뭔가 조사할 게 있어서 곧 올 거예요.
    ja: |-
      来た道で調査をしていますが、
      もうすぐ追いついてくるはずです。
  event_ce006_1_intermission_01_72:
    speaker: elegg
    en: The entrance is all clear, Ms. Privaty.
    ko: |-
      프리바티 씨~!
      입구 쪽엔 아무 이상 없어여~!
    ja: |-
      プリバティ氏～！
      入口の方は問題ナシでしたぞ～！
  event_ce006_1_intermission_01_73:
    speaker: elegg
    en: Wow, look at all these new faces!
    ko: 우와! 모르는 얼굴이 잔뜩 있네여!
    ja: おお！？これはお初の方ばかりですな！
  event_ce006_1_intermission_01_74:
    speaker: "<Self>"
    en: Elegg?
    ko: 일레그….
    ja: エレグか…
  event_ce006_1_intermission_01_75:
    speaker: elegg
    en: Howdy!
    ko: 안녕하세여!
    ja: ごきげんいかがでしたかな？
  event_ce006_1_intermission_01_76:
    speaker: elegg
    en: I'll be taking part in this D-Wave operation. I look forward to working with
      you all!
    ko: |-
      이번 D-WAVE 작전에 합류하게 됐어여!
      잘 부탁드릴게여!
    ja: |-
      今回のD-WAVE現象の調査に
      参加させていただきますゆえ、
      よろしくお願いいたしますぞ！
event_ce006_1_04_s:
  event_ce006_1_04_s_1:
    speaker: ce006_03
    en: "... I'm sorry, but is there any chance you could come down?"
    ko: 저기, 죄송한데 좀 내려와 주시면 안 될까요?
    ja: |-
      あの、すみませんけど…
      そろそろ降りてきてもらえません？
  event_ce006_1_04_s_2:
    speaker: elegg
    en: Let me have my fun!
    ko: 조, 조금만 더 이러고 있을게여.
    ja: も、もう少し！もう少しだけお許しくだされ！
  event_ce006_1_04_s_3:
    speaker: elegg
    en: "*Sniiiifffffff*"
    ko: 습~하! 습~하!
    ja: す～は～っ！す～は～っ！
  event_ce006_1_04_s_4:
    speaker: ce006_npc_01
    en: Anybody who recognizes the greatness of the Tetrapod must be a good person.
    ko: |-
      테트라포드의 멋짐을 알다니,
      좋은 사람인게 분명하겠군.
    ja: |-
      テトラポッドの良さが分かるなら、
      いいヤツには違いない。
  event_ce006_1_04_s_5:
    speaker: "<Monologue>"
    en: Upon joining the group and gazing upon the Tetrapod, Elegg completely loses
      it.
    ko: 합류한 일레그는 테트라포드를 보자마자 눈이 돌아갔고.
    ja: |-
      合流したエレグは、
      テトラポッドを見た瞬間に目を輝かせ…
  event_ce006_1_04_s_6:
    speaker: "<Monologue>"
    en: Clinging to one of the thrusters, she rubs her whole body against it and sniffs
      it vigorously.
    ko: 버니어 하나에 매달린 채 온몸을 부비며 냄새를 맡고 있었다.
    ja: |-
      バーニアに飛びつき
      匂いをかぎながらはい回りはじめた
  event_ce006_1_04_s_7:
    speaker: elegg
    en: I can't believe such a magnificent transport aircraft exists!
    ko: 세상에! 이렇게나 멋진 수송기라니 믿을 수 없어여!
    ja: |-
      おっほ！こんな素敵メカが実在したなんて、
      信じられませんな！
  event_ce006_1_04_s_8:
    speaker: elegg
    en: I know that we just met, but would it be okay if I took this apart and got
      a better look? Please?
    ko: 초면에 죄송한데여, 이거 분해 좀 해보면 안 될까여? 예?
    ja: |-
      初対面で失礼ながら…ちょっと分解させては
      いただけませんかな？かな？
  event_ce006_1_04_s_9:
    speaker: ce006_03
    en: If, by your own admission, you know it's an inappropriate question, why the
      heck would you ask it?
    ko: 초면이고 죄송하다는 것도 아시는 분이 왜 그런 말도 안 되는 말을 하시는 건가요?
    ja: |-
      初対面の上に、ダメだって分かってて
      なんでそんなこと聞いてくるの？
  event_ce006_1_04_s_10:
    speaker: elegg
    en: But taking something apart is the same as assembling it, just in reverse!
      I'll be able to put it back together perfectly.
    ko: |-
      아니이~! 조립은 분해의 역순이잖아여~!
      제, 제가 감쪽같이 조립해놓을테니까아~!
    ja: |-
      いやいや！組み立ての逆が分解ですぞ～！
      きちんと、きちんと元通りにしますゆえ～！
  event_ce006_1_04_s_11:
    speaker: ce006_03
    en: Don't you dare. Hurry up and come down, will you?
    ko: 아, 안 돼요! 빨리 내려와요!
    ja: ダ、ダメです！早く降りてください！
  event_ce006_1_04_s_12:
    speaker: "<Self>"
    en: I don't even know how she got up there.
    ko: "…일레그가 용케 올라왔네."
    ja: "…よくここまで連れてこられたな"
  event_ce006_1_04_s_13:
    speaker: privaty
    en: That's why she's perfect for this kind of mission, in more ways than one.
    ko: |-
      이런 임무에 적합하니까요.
      여러 가지 의미로.
    ja: |-
      任務適性はありますから。
      いろいろな意味で…
  event_ce006_1_04_s_14:
    speaker: privaty
    en: Now then, let me give you a rundown of the current situation.
    ko: 자, 그럼 상황을 한번 정리해 보죠.
    ja: とにかく…一度状況を整理させてください。
  event_ce006_1_04_s_15:
    speaker: privaty
    en: Other than those three showing up, no anomalies caused by the D-Wave have
      been observed.
    ko: 일단 저 셋이 나타난 것 이외에 D-WAVE로 인한 이상 현상은 아직까지 발생하지 않음.
    ja: |-
      まず、あの3名の出現以外、
      D-WAVEによる異常現象は
      今のところ確認されていない。
  event_ce006_1_04_s_16:
    speaker: privaty
    en: However, the severed arm of a Nikke was retrieved from the lake.
    ko: 단, 전기가 흐르는 호수 아래에서 니케의 팔 파츠를 습득.
    ja: |-
      帯電している湖の底から
      ニケの腕部を拾得したが…
  event_ce006_1_04_s_17:
    speaker: privaty
    en: "... While some of your members were fishing, no less."
    ko: "…낚시로."
    ja: "…これは偶然釣り上げたもの。"
  event_ce006_1_04_s_18:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_s_19:
    speaker: privaty
    en: The combat assistant robot found in the scrap heap seems to know something
      about this, and keeps hinting that there might be something on the ground floor,
      but refuses to elaborate.
    ko: 고철산에서 주운 전투 보조용 로봇은 해당 사실에 대해 알고 있는 것으로 보이며, 1층에 뭔가가 있을 것을 암시했으나 묵비권 행사 중.
    ja: |-
      廃棄物の山で発見されたロボットは、
      それについて何かを知っている様子だが、
      具体的なことは話そうとしない。
  event_ce006_1_04_s_20:
    speaker: privaty
    en: In order for us to investigate the ground floor further, the electricity flowing
      throughout the lake first needs to be cut off and the water drained.
    ko: |-
      그걸 조사하기 위해서 호수에 흐르는 전기를 차단하고,
      호수의 물을 뺀 후 1층을 조사할 필요가 있음.
    ja: |-
      湖底を調査するためには
      湖の電流と水が障害になっている。
  event_ce006_1_04_s_21:
    speaker: privaty
    en: It seems the power is most likely coming from an unmanned power plant nearby,
      so the power there needs to be shut off.
    ko: |-
      외부에서 전기가 흘러들어오는 것으로 추정되니,
      인근의 무인 발전소에서 전력 차단이 필요.
    ja: |-
      電源はおそらく外部の無人発電所にあり、
      その所在地を突き止め
      機能を停止させる必要がある。
  event_ce006_1_04_s_22:
    speaker: privaty
    en: Did I get everything?
    ko: 맞나요?
    ja: 間違いありませんか？
  event_ce006_1_04_s_23:
    speaker: rapi
    en: That's correct.
    ko: 맞아.
    ja: その通りよ。
  event_ce006_1_04_s_24:
    speaker: anis
    en: A lovely summary, Oh Mighty One.
    ko: |-
      여윽시 중앙 정부 에이스는 다르네.
      아주 요약을 잘해, 응.
    ja: |-
      やっぱり中央政府のエリートは違うわね。
      理解が早いわ、ホント～
  event_ce006_1_04_s_25:
    speaker: privaty
    en: Good. Then let's head to the power plant. I'll lead the way.
    ko: |-
      좋아요. 그럼 발전소로 출발하죠.
      제가 안내할게요.
    ja: |-
      では、発電施設に向かいましょう。
      私が先導します。
  event_ce006_1_04_s_26:
    speaker: privaty
    en: Elegg. Come down.
    ko: 일레그. 내려와요.
    ja: エレグ。降りてきてください。
  event_ce006_1_04_s_27:
    speaker: elegg
    en: Huh? Why?
    ko: 녜? 왜여?
    ja: ん？どうしましたかな？
  event_ce006_1_04_s_28:
    speaker: privaty
    en: We need to go to the power plant.
    ko: 발전소로 가야 해요.
    ja: 近くの発電所に向かいます。
  event_ce006_1_04_s_29:
    speaker: elegg
    en: Why?
    ko: 발전소는 왜여?
    ja: 発電所？
  event_ce006_1_04_s_30:
    speaker: privaty
    en: We need to cut the electricity flowing inside the lake.
    ko: 호수에 흐르는 전기를 차단해야 되니까요.
    ja: 湖に流れている電流を遮断する必要があります。
  event_ce006_1_04_s_31:
    speaker: elegg
    en: The lake is electrified?
    ko: 호수에 전기가 흐른다고여?
    ja: はて、そんなものが…？
  event_ce006_1_04_s_32:
    speaker: elegg
    en: No kidding.
    ko: 아아~ 그렇군여.
    ja: はは～ん、理解できましたな。
  event_ce006_1_04_s_33:
    speaker: elegg
    en: Anyway, we don't have to bother with all that. I saw a dedicated generator
      for this facility near the entrance.
    ko: |-
      그럼 발전소까지 갈 필요는 없어여.
      입구에서 봤는데 이곳에 전용 발전기가 있는 것 같더라고여.
    ja: |-
      わざわざそこへ向かう必要はありませんぞ。
      さきほど調べた限り、その電源は
      この近くにありますな。
  event_ce006_1_04_s_34:
    speaker: elegg
    en: All we need to do is go there and pull the lever.
    ko: 거기 가서 레버만 당겨주면 끝이에여.
    ja: そこへ行ってレバーを下ろせば終わりですぞ。
  event_ce006_1_04_s_35:
    speaker: privaty
    en: "... Excuse me?"
    ko: "…예?"
    ja: "…はい？"
  event_ce006_1_04_s_36:
    speaker: elegg
    en: If I take care of that, will you let me help you repair the Tetrapod?
    ko: 그것만 해결하면 테트라포드 수리하게 해 주실 건가여?
    ja: |-
      それさえ解決すれば、テトラポッドの修理に
      戻していただけますかな？
  event_ce006_1_04_s_37:
    speaker: privaty
    en: Uh... Yeah, sure. I guess.
    ko: 어… 예. 안될 것 없죠.
    ja: ええと…まあ、構いませんが。
  event_ce006_1_04_s_38:
    speaker: ce006_npc_01
    en: Hey, why aren't we being consulted?!
    ko: 아니, 우리 의견은….
    ja: いや、修理を頼んだ覚えは…
  event_ce006_1_04_s_39:
    speaker: ce006_03
    en: Just leave her. Let's see what happens.
    ko: 냅둬요 그냥. 어떻게 되나 보자고요.
    ja: このままにしておこうよ。面白くなりそう。
  event_ce006_1_04_s_40:
    speaker: elegg
    en: Hehe. Okay.
    ko: 히히. 알겠어여.
    ja: ふひひっ。了解ですな。
  event_ce006_1_04_s_41:
    speaker: elegg
    en: I'm sorry, Mr. Tetrapod, but we'll have to part ways for just a little bit.
    ko: 테트라포드씨~ 잠깐만 우리 떨어져 있어여~
    ja: テトラポッド殿～しばしお待ちくだされよ～
  event_ce006_1_04_s_42:
    speaker: elegg
    en: Mwah mwah mwah!
    ko: 우움~ 쮸쮸쮸.
    ja: ん～ちゅっちゅっ！
  event_ce006_1_04_s_43:
    speaker: "<Monologue>"
    en: Elegg kisses the Tetrapod repeatedly before finally coming down.
    ko: 일레그는 테트라포드에 연신 입맞춤을 하고는 내려왔다.
    ja: |-
      エレグはテトラポッドに
      熱い口づけをして離れた
  event_ce006_1_04_s_44:
    speaker: ce006_npc_01
    en: Jeez, she really loves the Tetrapod.
    ko: 사랑받는구나. 테트라포드.
    ja: 愛されてるなあ、テトラポッド。
  event_ce006_1_04_s_45:
    speaker: ce006_03
    en: Are you into this kind of stuff as well, Adam?
    ko: 아담도 저런 거 하나요?
    ja: アダムもああいうことするの？
  event_ce006_1_04_s_46:
    speaker: ce006_npc_01
    en: No!
    ko: "…안해."
    ja: "…しない。"
  event_ce006_1_04_s_47:
    speaker: elegg
    en: Let's get going!
    ko: 그럼! 출발해 볼까여?
    ja: ではでは！出発とまいりますかな？
  event_ce006_1_04_s_48:
    speaker: ce006_03
    en: Can I tag along? I want to see what the generators in this world look like.
    ko: |-
      아, 저도 따라가도 되나요?
      이곳의 발전기가 어떻게 생겼는지 궁금해요.
    ja: |-
      あっ、あたしも一緒に行っていいですか？
      こっちのジェネレーターが
      どんな感じか気になるんです。
  event_ce006_1_04_s_49:
    speaker: elegg
    en: Of course.
    ko: 물론이져.
    ja: もちろんですぞ。
  event_ce006_1_04_s_50:
    speaker: privaty
    en: Commander, Elegg, and I are gonna head out, along with Lily over here.
    ko: |-
      지휘관. 저랑 일레그가 다녀올게요.
      여기 릴리라는 분도 같이.
    ja: |-
      指揮官。ここは私とエレグ、
      それからリリーという方の3名で向かいます。
  event_ce006_1_04_s_51:
    speaker: "<Self>"
    en: Wouldn't it be better for all of us to go?
    ko: 같이 가는 게 낫지 않아?
    ja: 全員で行った方がいいのでは？
  event_ce006_1_04_s_52:
    speaker: elegg
    en: No. We should give the newly introduced characters a chance to shine.
    ko: 아녀. 새롭게 등장한 캐릭터가 활약할 기회는 주셔야져.
    ja: |-
      いやいや。せっかく出てきたのですゆえ、
      我々にも見せ場をくだされ。
  event_ce006_1_04_s_53:
    speaker: "<Self>"
    en: "... Okay, fine. Reach out if anything happens."
    ko: "…그래. 다녀와. 무슨 일 있으면 연락해 주고."
    ja: |-
      …分かった、では任せる。
      何かあったら連絡してくれ
  event_ce006_1_04_s_54:
    speaker: elegg
    en: Will do!
    ko: 히히. 녜.
    ja: ふひひっ、了解ですな。
event_ce006_1_04_e:
  event_ce006_1_04_e_1:
    speaker: "<Narration>"
    en: Underground, inside an urban building. Generator room.
    ko: 도시 건물 내부의 지하. 발전기실.
    ja: 都市遺構地下、ジェネレータールーム
  event_ce006_1_04_e_2:
    speaker: elegg
    en: This lever here is meant to cut off all the power in case of an emergency.
      All we've got to do is pull it, and voilà!
    ko: |-
      쨘~! 여기 이 레버를 내리기만 하면 끝이에여.
      비상시 모든 전력을 차단하는 레버져.
    ja: |-
      ジャジャ～ンッ！というわけで、
      このレバーを下ろせば終わりですぞ。
      非常用の緊急停止装置ですな。
  event_ce006_1_04_e_3:
    speaker: ce006_03
    en: It looks more primitive than I expected.
    ko: 생각했던 것보다 원시적인 모습이네요.
    ja: 思ってたより原始的ですね。
  event_ce006_1_04_e_4:
    speaker: elegg
    en: The more primitive something looks, the more stable it is.
    ko: 원시적일수록 안정성은 높아지는 법이니까여.
    ja: その方が安定性は高くなりますからな。
  event_ce006_1_04_e_5:
    speaker: ce006_03
    en: Mmm, I think I know what you mean. If a system is too complex, even a small
      malfunction can render it useless.
    ko: |-
      아, 무슨 말인지 알 것 같아요.
      기능이 복잡하면 사소한 것 하나만 고장 나도 못 쓰니까요.
    ja: |-
      あ、分かる気がします。
      複雑な仕組みにすると、ほんのちょっと
      壊れただけで使えなくなっちゃうやつ。
  event_ce006_1_04_e_6:
    speaker: elegg
    en: Precisely. That's why I don't like machines that try to combine multiple functions
      into one device.
    ko: |-
      그렇져 그렇져.
      그런 의미에서 저는 기능이 합쳐진 기계들을 안 좋아해여.
    ja: |-
      しかり、しかり。
      私もシンプルな設計の方が好みですな。
  event_ce006_1_04_e_7:
    speaker: elegg
    en: Except for game controllers, that is. The more features those have, the better.
    ko: |-
      어… 게임 패드 같은 건 제외하고여.
      그런 건 기능이 많을수록 좋져.
    ja: |-
      あ…ただし、ゲームパッドは例外ですな。
      アレは機能が多ければ多いほどよいですぞ。
  event_ce006_1_04_e_8:
    speaker: elegg
    en: Anyway, most machines work best when they stick to a simple purpose.
    ko: 아무튼, 모든 기계들은 심플한 목적에 충실한 게 제일 좋져.
    ja: |-
      とはいえ、機械というのはシンプルで
      目的に忠実なものが一番ですな。
  event_ce006_1_04_e_9:
    speaker: ce006_03
    en: Too true. There's nothing worse than when keyboards have a power button built
      in.
    ko: |-
      아아~ 맞아요.
      키보드에 전원 버튼 달아놓거나 하면 진짜 최악이죠.
    ja: |-
      そうそう～それですよね。
      キーボードに電源ボタン紛れ込んでるのとか
      ホント最悪です。
  event_ce006_1_04_e_10:
    speaker: elegg
    en: Oh wow, so you have those in your world too?
    ko: 흐엑~! 그쪽 세계에도 있군여!
    ja: |-
      ひょええ～！
      そちらの世界にもあるんですかな！？
  event_ce006_1_04_e_11:
    speaker: ce006_03
    en: And Enter keys that are too small.
    ko: 엔터 키 작은 거랑.
    ja: エンターキーが小さいやつとか。
  event_ce006_1_04_e_12:
    speaker: elegg
    en: "*Gasp*!"
    ko: 히익!
    ja: ひいい～！
  event_ce006_1_04_e_13:
    speaker: ce006_03
    en: And arrow keys lined up in a straight row.
    ko: 일렬로 방향키 늘어놓은 거라던가.
    ja: 方向キーが横一列に並んでるやつとか。
  event_ce006_1_04_e_14:
    speaker: elegg
    en: "*Gasp*!!!"
    ko: 흐에엑!
    ja: あひゃああ～！
  event_ce006_1_04_e_15:
    speaker: ce006_03
    en: Sounds like you have those here too?
    ko: "…세상에. 이 세계에도 그런 게 다 있군요?"
    ja: |-
      …通じる。
      やっぱりこっちの世界にもあるんですね？
  event_ce006_1_04_e_16:
    speaker: elegg
    en: Yes... evil truly does transcend worlds.
    ko: |-
      녜….
      악의란, 세계를 넘나드는 법이군여.
    ja: |-
      ですぞ…
      悪意とは、世界の枠を超えるものなんですな。
  event_ce006_1_04_e_17:
    speaker: privaty
    en: So, if we pull this lever, it will cut all power to the city?
    ko: "…그래서, 이 레버를 당기기만 하면 이 도시의 전력 공급이 끊긴다는 건가요?"
    ja: |-
      …それで、このレバーを引けば
      電力が完全に遮断できるのですか？
  event_ce006_1_04_e_18:
    speaker: privaty
    en: And thus the electricity coursing through the lake?
    ko: 호수에 흐르는 전기도 끊어지고?
    ja: 無論、湖に流れているものも？
  event_ce006_1_04_e_19:
    speaker: elegg
    en: That's right.
    ko: 녜. 맞아여.
    ja: はい、その通りですな。
  event_ce006_1_04_e_20:
    speaker: privaty
    en: All right, here we go.
    ko: 알겠어요. 당길게요.
    ja: 分かりました。では停止させます。
  event_ce006_1_04_e_21:
    speaker: ce006_03
    en: Wait!
    ko: 어어어! 잠깐만요!
    ja: ああっ！待ってください！
  event_ce006_1_04_e_22:
    speaker: privaty
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_1_04_e_23:
    speaker: ce006_03
    en: What if there are still survivors in the city?
    ko: 생각해 보니 이 도시에 살아남은 사람이 있을 수도 있잖아요.
    ja: |-
      もしかしたら、この建物に生きてる人がいて、
      その人が困っちゃうかもしれませんよね。
  event_ce006_1_04_e_24:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_25:
    speaker: privaty
    en: That's impossible.
    ko: 그럴 리 없어요.
    ja: それはあり得ません。
  event_ce006_1_04_e_26:
    speaker: ce006_03
    en: How can you know for sure?
    ko: 어떻게 장담하나요?
    ja: なんで分かるんですか？
  event_ce006_1_04_e_27:
    speaker: privaty
    en: Official declarations from the Central Government state there are no human
      survivors on the surface.
    ko: |-
      중앙 정부가 공표하기로,
      지상에 살아남은 인간의 수는 공식적으로 0명이니까요.
    ja: |-
      中央政府の公式見解によれば、
      地上に残っている人間の数は0です。
  event_ce006_1_04_e_28:
    speaker: ce006_03
    en: How can we trust that?
    ko: 그걸 어떻게 믿을 수 있는데요.
    ja: それって信用できるんですか？
  event_ce006_1_04_e_29:
    speaker: ce006_03
    en: You never know.
    ko: 아닐 수도 있잖아요.
    ja: 違うかもしれませんよね。
  event_ce006_1_04_e_30:
    speaker: ce006_03
    en: They might be lying.
    ko: 그 중앙 정부라는 게 거짓말을 하는 것일지도 모르잖아요.
    ja: |-
      その中央政府っていうのが、
      ウソをついてるかもしれないですし。
  event_ce006_1_04_e_31:
    speaker: privaty
    en: The Central Government would never lie.
    ko: 중앙 정부가 저희들한테 거짓말을 할리가 없어요.
    ja: 中央政府はそのようなことをしません。
  event_ce006_1_04_e_32:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_33:
    speaker: privaty
    en: The Central Government is responsible for maintaining law and order inside
      the Ark.
    ko: 중앙 정부는 방주의 법이자, 규칙이죠.
    ja: 中央政府はアークの法であり、規則です。
  event_ce006_1_04_e_34:
    speaker: privaty
    en: We must have faith in them.
    ko: 그러니 믿어야 해요.
    ja: 信じる以外に道はありません。
  event_ce006_1_04_e_35:
    speaker: ce006_03
    en: And what are your personal thoughts, Privaty?
    ko: 프리바티 생각은 어떤데요?
    ja: あなた自身はどう思ってるんですか？
  event_ce006_1_04_e_36:
    speaker: privaty
    en: Me?
    ko: 저요?
    ja: 私ですか？
  event_ce006_1_04_e_37:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_38:
    speaker: privaty
    en: I trust them. Unquestioningly.
    ko: 믿어요. 무조건.
    ja: 信じています。疑いなく。
  event_ce006_1_04_e_39:
    speaker: ce006_03
    en: But if you never question something, what meaning does trust even have?
    ko: 그렇게 무조건적으로 믿기만 하는 게 무슨 의미가…!
    ja: そんな根拠もなく信じることに何の意味が…！
  event_ce006_1_04_e_40:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_41:
    speaker: ce006_03
    en: Oh.
    ko: "…아."
    ja: "…あ。"
  event_ce006_1_04_e_42:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_43:
    speaker: privaty
    en: Lily, was it? You must have something you believe in as well, yes?
    ko: |-
      릴리라고 했나요?
      당신도 믿는 게 있죠?
    ja: |-
      リリーと言いましたか？
      あなたにもそういうものがあるでしょう？
  event_ce006_1_04_e_44:
    speaker: ce006_03
    en: "... I do."
    ko: 있어… 요.
    ja: あり…ます。
  event_ce006_1_04_e_45:
    speaker: ce006_03
    en: I believe in Mother Sphere.
    ko: 마더스피어를 믿어요.
    ja: マザースフィア。
  event_ce006_1_04_e_46:
    speaker: privaty
    en: Is that your world's equivalent of the Central Government?
    ko: 그쪽 세계의 중앙 정부 같은 건가요?
    ja: そちらの世界の中央政府のようなものですか？
  event_ce006_1_04_e_47:
    speaker: ce006_03
    en: To believe in Mother Sphere is to have faith.
    ko: 마더스피어를 믿는 건 신앙이에요.
    ja: マザースフィアは絶対です。
  event_ce006_1_04_e_48:
    speaker: privaty
    en: I see.
    ko: 그렇군요.
    ja: そうですか。
  event_ce006_1_04_e_49:
    speaker: "<Narration>"
    en: Privaty grips the lever.
    ko: 프리바티가 레버를 움켜잡는다.
    ja: プリバティがレバーに手をかけた
  event_ce006_1_04_e_50:
    speaker: ce006_03
    en: Wai...
    ko: 아앗…!
    ja: あっ…！
  event_ce006_1_04_e_51:
    speaker: privaty
    en: Would you ever deny
    ko: 마더스피어가 당신에게 알려준 것.
    ja: マザースフィアの教え。
  event_ce006_1_04_e_52:
    speaker: privaty
    en: what Mother Sphere has told you?
    ko: 당신은 그걸 부정할 수 있나요?
    ja: あなたは否定できますか？
  event_ce006_1_04_e_53:
    speaker: privaty
    en: Would you refute anything she's said?
    ko: 마더스피어를 부정할 수 있나요?
    ja: マザースフィアを否定することは、できますか？
  event_ce006_1_04_e_54:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_55:
    speaker: ce006_03
    en: No. That would be blasphemy.
    ko: 아뇨. 그건 신성모독이에요.
    ja: いいえ。それは神への冒涜です。
  event_ce006_1_04_e_56:
    speaker: privaty
    en: Right.
    ko: 우리 둘.
    ja: 私たちには…
  event_ce006_1_04_e_57:
    speaker: privaty
    en: Then you and I have something in common.
    ko: 공통점이 있네요.
    ja: 共通点があるみたいですね。
  event_ce006_1_04_e_58:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: ガチャリ
  event_ce006_1_04_e_59:
    speaker: "<Narration>"
    en: The lever has been pulled.
    ko: 레버가 당겨졌다.
    ja: レバーの下りる音がした
  event_ce006_1_04_e_60:
    speaker: elegg
    en: You can take your hand off the lever, Ms. Privaty.
    ko: 됐어여. 손 떼여 프리바티 씨.
    ja: |-
      終わりましたな。
      プリバティ氏、もう結構ですぞ。
  event_ce006_1_04_e_61:
    speaker: privaty
    en: Huh?
    ko: 응? 예?
    ja: え？はい？
  event_ce006_1_04_e_62:
    speaker: elegg
    en: I just realized; the ground floor is controlled by another lever.
    ko: 보니까 1층 일부 구역과 이어져 있는 다른 레버가 있더라고여.
    ja: |-
      1階の一部だけとつながっている
      別の停止レバーが見つかりましたゆえ…
  event_ce006_1_04_e_63:
    speaker: elegg
    en: I already pulled it.
    ko: 그래서 제가 당겼어여.
    ja: そちらを止めておきましたぞ。
  event_ce006_1_04_e_64:
    speaker: privaty
    en: "... I see."
    ko: 그렇… 군요.
    ja: そう…ですか。
  event_ce006_1_04_e_65:
    speaker: elegg
    en: So you can let go of that one.
    ko: 그러니 그 레버는 당기지 않아도 돼여.
    ja: |-
      そちらのレバーは
      もう下ろす必要がありませんな。
  event_ce006_1_04_e_66:
    speaker: privaty
    en: "... All right."
    ko: "…예."
    ja: "…そのようです。"
  event_ce006_1_04_e_67:
    speaker: "<Narration>"
    en: Privaty tries to release the lever, but her fingers refuse to budge.
    ko: |-
      프리바티는 움켜쥔 레버에서 손을 떼려 했지만,
      어째서인지 손이 펴지지 않았다.
    ja: |-
      プリバティはレバーから手を放そうとしたが、
      なぜかそれができなかった
  event_ce006_1_04_e_68:
    speaker: privaty
    en: "!!"
    ko: "…아…."
    ja: "…あれ…"
  event_ce006_1_04_e_69:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_70:
    speaker: "<Narration>"
    en: Elegg walks over
    ko: 일레그가 다가가 프리바티의 손을 잡았다.
    ja: エレグが近づき、プリバティの手をとると…
  event_ce006_1_04_e_71:
    speaker: "<Narration>"
    en: and slowly pries Privaty's fingers off, one by one.
    ko: 그리고 천천히 손가락 하나하나를 폈다.
    ja: 指を1本ずつゆっくりと開かせていった
  event_ce006_1_04_e_72:
    speaker: elegg
    en: You've got a death grip on this lever. You must have been awfully nervous.
    ko: |-
      긴장했나 보네여.
      손에 힘이 너무 들어갔어여.
    ja: |-
      緊張していたのですかな。
      手に力が入りすぎですぞ。
  event_ce006_1_04_e_73:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_74:
    speaker: elegg
    en: Ms. Privaty. Ms. Lily.
    ko: "…프리바티 씨. 릴리 씨."
    ja: "…プリバティ氏。リリー氏。"
  event_ce006_1_04_e_75:
    speaker: elegg
    en: There are times when having blind faith in something isn't ideal.
    ko: 굳게 믿는 것이 옳지 않다고 느껴질 땐 있잖아여.
    ja: 歩いている道に自信が無くなった時は…
  event_ce006_1_04_e_76:
    speaker: elegg
    en: It's fine to keep an open mind and look for other methods on occasion.
    ko: 다른 방법을 찾아보는 게 좋다고 생각해여.
    ja: |-
      別の道を探してみることも
      悪くないと思いますぞ。
  event_ce006_1_04_e_77:
    speaker: elegg
    en: When following something unconditionally becomes too difficult,
    ko: 무조건적으로 따르기 힘들 땐.
    ja: もしかしたら、今のまま突き進むより…
  event_ce006_1_04_e_78:
    speaker: elegg
    en: choosing another path can help.
    ko: 다른 선택지를 선택하는 게 도움이 되더라고여.
    ja: もっといい道が見つかるかもしれませんからな。
  event_ce006_1_04_e_79:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_04_e_80:
    speaker: privaty
    en: "... Okay."
    ko: "…알겠어요."
    ja: "…覚えておきましょう。"
  event_ce006_1_04_e_81:
    speaker: privaty
    en: Thank you, Elegg.
    ko: 고마워요. 일레그.
    ja: お礼を言っておきます、エレグ。
  event_ce006_1_04_e_82:
    speaker: elegg
    en: No problem!
    ko: 히히. 별말씀을여.
    ja: ふひひっ。大したことではありませんぞ。
event_ce006_1_05_s:
  event_ce006_1_05_s_1:
    speaker: "<Monologue>"
    en: After cutting off the power in the generator room, Elegg joins the others
      in repairing the Tetrapod.
    ko: |-
      발전기실에서 전력을 차단 후,
      일레그는 테트라포드 수리에 합류했다.
    ja: |-
      電流を遮断した後、エレグはテトラポッドの
      修理作業に飛び込んでいった
  event_ce006_1_05_s_2:
    speaker: "<Monologue>"
    en: While Privaty watches over from a higher vantage point,
    ko: 프리바티는 높은 곳에서 우리 모두를 지켜보고 있었고
    ja: |-
      プリバティは見晴らしのいい場所で
      全員を監視している
  event_ce006_1_05_s_3:
    speaker: "<Monologue>"
    en: the rest of us stare at Neon, who is crouched in front of the lake.
    ko: 우리는 호수 앞에 쪼그리고 앉아있는 네온을 바라보고 있었다.
    ja: |-
      私たちはと言えば、湖の前に座り込む
      ネオンを注視していた
  event_ce006_1_05_s_4:
    speaker: neon
    en: All right... I'm going to put it in.
    ko: "…너, 넣을게요?"
    ja: "…じゃあ、入れますよ？"
  event_ce006_1_05_s_5:
    speaker: anis
    en: Just stick your hand in the water already! We haven't got all day.
    ko: 아 빨리 좀 해. 뭔 물에 손 집어넣는 걸로 하루종일 그러고 있어.
    ja: |-
      早くしてよ。水に手を突っ込むだけでしょ？
      このままじゃ日が暮れちゃうわ。
  event_ce006_1_05_s_6:
    speaker: neon
    en: But the water might still be electrified.
    ko: 아니, 전기가 흐를지도 모르잖아요.
    ja: だって、感電するかもしれないじゃないですか。
  event_ce006_1_05_s_7:
    speaker: anis
    en: The electricity's been cut off.
    ko: 차단됐다잖아.
    ja: もう大丈夫って言われたでしょ。
  event_ce006_1_05_s_8:
    speaker: neon
    en: You never know.
    ko: 아닐 수도 있잖아요.
    ja: カン違いかもしれませんし。
  event_ce006_1_05_s_9:
    speaker: anis
    en: Good grief, move over. I'll do it.
    ko: 아 비켜봐. 그냥 내가 할게.
    ja: もう、どいて。私がやるわ。
  event_ce006_1_05_s_10:
    speaker: neon
    en: Okay, okay! I'm going.
    ko: 아, 알았어요. 할게요. 하면 되잖아요.
    ja: |-
      わ、分かりました。やります。
      やればいいんでしょう！
  event_ce006_1_05_s_11:
    speaker: neon
    en: "*Gulp*..."
    ko: "…꿀꺽."
    ja: "…ゴクリ…"
  event_ce006_1_05_s_12:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 참방.
    ja: トプン――
  event_ce006_1_05_s_13:
    speaker: neon
    en: Uhgyahhhhh!
    ko: 으갸갸갸갸갹!!
    ja: あああああああ！！
  event_ce006_1_05_s_14:
    speaker: anis
    en: Ahhhhh!
    ko: 으아아아--!!
    ja: きゃああああ！！
  event_ce006_1_05_s_15:
    speaker: neon
    en: Hehe, I knew that would scare you.
    ko: 하면서 소리 지르면 아니스가 놀랄 것 같았죠.
    ja: って叫べば、アニスが驚くと思ったのですが。
  event_ce006_1_05_s_16:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_17:
    speaker: neon
    en: Pretty funny, huh?
    ko: 재밌었죠?
    ja: 面白かったでしょう？
  event_ce006_1_05_s_18:
    speaker: anis
    en: Yeah. Hilarious.
    ko: 응. 재밌네.
    ja: はいはい、面白かった。
  event_ce006_1_05_s_19:
    speaker: rapi
    en: Now all that's left is to drain the water from the lake.
    ko: "…이제 남은 건 호수의 물을 빼는 거겠네."
    ja: "…あとは水を抜くだけね。"
  event_ce006_1_05_s_20:
    speaker: anis
    en: How do we do that though?
    ko: 음… 어떻게 빼지?
    ja: でも…どうやって？
  event_ce006_1_05_s_21:
    speaker: ce006_01
    en: I doubt that the draining system is working as intended.
    ko: 물을 빼내는 배수 시설에 문제가 생겼을 가능성이 커.
    ja: 排水設備の問題という可能性が高い。
  event_ce006_1_05_s_22:
    speaker: ce006_01
    en: It's probably being blocked by something.
    ko: 뭔가에 막혀있을 가능성이 가장 높겠고.
    ja: 排水路に何かが詰まっているとか。
  event_ce006_1_05_s_23:
    speaker: rapi
    en: Some kind of obstruction...
    ko: 뭔가에 막혀있다….
    ja: 何かが詰まっている…
  event_ce006_1_05_s_24:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_25:
    speaker: anis
    en: Is it what I think it is?
    ko: 역시, 그거겠지?
    ja: やっぱり、アレよね？
  event_ce006_1_05_s_26:
    speaker: rapi
    en: Probably.
    ko: 아마도.
    ja: おそらくは。
  event_ce006_1_05_s_27:
    speaker: ce006_01
    en: I'll dive in and check.
    ko: 내가 잠수해서 확인해 볼게.
    ja: 私が潜って確認してみる。
  event_ce006_1_05_s_28:
    speaker: rapi
    en: You can swim?
    ko: 잠수를 할 수 있어?
    ja: 潜水できるの？
  event_ce006_1_05_s_29:
    speaker: ce006_01
    en: Of course I can.
    ko: |-
      ??
      응. 할 수 있어.
    ja: |-
      ？？
      ええ。
  event_ce006_1_05_s_30:
    speaker: "<Self>"
    en: Oh, that's right. So can I.
    ko: 엇, 그렇네. 내가 가도 되는 거잖아.
    ja: ああ、そうか。私も行けるな
  event_ce006_1_05_s_31:
    speaker: ce006_01
    en: Can Nikkes not swim?
    ko: |-
      무슨 말이야?
      니케는 잠수할 수 없어?
    ja: |-
      どういうこと？
      ニケは泳げないの？
  event_ce006_1_05_s_32:
    speaker: "<Self>"
    en: Nope. They weigh too much.
    ko: 응. 무거워서 못 해.
    ja: そうだ、みんな重いからな
  event_ce006_1_05_s_33:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_34:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_35:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_36:
    speaker: "<Self>"
    en: Okay, bad joke, but it is true that they can't swim.
    ko: "…는 농담이고, 다들 수영 못 하거든."
    ja: |-
      …言い方が悪かった、
      ボディの都合でそういうものなんだ
  event_ce006_1_05_s_37:
    speaker: ce006_01
    en: I see. Well, I think it's best that you stay here.
    ko: |-
      그렇구나.
      그래도 너는 여기 있는 게 좋겠어.
    ja: |-
      そう。
      でも、あなたはここに残った方がいい。
  event_ce006_1_05_s_38:
    speaker: ce006_01
    en: It's best for commanders to stay out of harm's way.
    ko: 지휘관이 위험을 감수하는 건 좋지 않으니까.
    ja: 指揮官に何かあったら問題になるはず。
  event_ce006_1_05_s_39:
    speaker: neon
    en: That's often a problem for us, since Master likes to overexert himself.
    ko: 스승님은 몸을 너무 막 굴려서 문제긴 하지만요.
    ja: |-
      師匠は今に限らず体を酷使しすぎなのが
      問題ですけどね。
  event_ce006_1_05_s_40:
    speaker: ce006_01
    en: I'll check the drainage area and see if there are any obstructions that need
      to be removed.
    ko: |-
      배수로 쪽을 확인하고,
      할 수 있으면 치우는 것까지 해볼게.
    ja: |-
      排水路の状態を確認して、
      できれば対処してくる。
  event_ce006_1_05_s_41:
    speaker: rapi
    en: How long can you hold your breath?
    ko: 숨은 얼마나 참을 수 있어?
    ja: 呼吸はどれぐらい止めていられるの？
  event_ce006_1_05_s_42:
    speaker: ce006_01
    en: Not sure. I've always finished what I needed to do before it became an issue.
    ko: 글쎄. 언제나 한계가 오기 전에 볼일이 다 끝나서 어디까지가 한계인지 모르겠어.
    ja: |-
      さあ。いつも限界が来る前に
      用事は片付けられてるから。
  event_ce006_1_05_s_43:
    speaker: anis
    en: What? You've never run out of breath underwater?
    ko: 뭐야. 물속에서 숨이 모자랐던 적이 없다고?
    ja: えっ？水中で息苦しくなったりしたことないの？
  event_ce006_1_05_s_44:
    speaker: ce006_01
    en: Nope, never.
    ko: 응. 없었어.
    ja: ええ。今のところ。
  event_ce006_1_05_s_45:
    speaker: anis
    en: How does that make any sense...?
    ko: 말이 되냐고.
    ja: ウソでしょ？
  event_ce006_1_05_s_46:
    speaker: ce006_01
    en: I'll show you. I'll be back.
    ko: |-
      보면 알 거야.
      다녀올게.
    ja: |-
      見れば分かる。
      待っていて。
  event_ce006_1_05_s_47:
    speaker: "<Self>"
    en: Wait, you should set up a signal to let us know if you're in trouble!
    ko: 잠깐, 위험 신호라도 정하고…!
    ja: |-
      いや、せめて非常事態の
      信号を決めてから…！
  event_ce006_1_05_s_48:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 첨벙!
    ja: バシャッ！
  event_ce006_1_05_s_49:
    speaker: "<Monologue>"
    en: EVE dives into the water with perfect form.
    ko: 이브는 깔끔한 자세로 호수에 입수했다.
    ja: イヴが美しいフォームで湖に飛び込んだ
  event_ce006_1_05_s_50:
    speaker: neon
    en: Maybe we could toss in some fishing line? That way she could grab on and pull
      herself out if she needs to.
    ko: "…그, 낚싯줄이라도 던져놓을까요? 잡고 올라올 수 있게."
    ja: |-
      …ええと、釣り糸でも垂らしておきましょうか？
      つかんで引っ張れるように。
  event_ce006_1_05_s_51:
    speaker: anis
    en: I don't think that would do much.
    ko: 안 하는 게 좋겠는데.
    ja: ムダでしょ、やめときなさい。
  event_ce006_1_05_s_52:
    speaker: rapi
    en: Let's just wait here for now. If we feel something is wrong, then we'll go
      in immediately and...
    ko: |-
      …일단 여기서 기다려보자.
      뭔가 이상이 있으면 바로 진입을….
    ja: |-
      …ここで待機していましょう。
      何か異常が起きたら、すぐ助けに…
  event_ce006_1_05_s_53:
    speaker: rapi
    en: Uh...
    ko: "…음."
    ja: "…あっ。"
  event_ce006_1_05_s_54:
    speaker: anis
    en: We won't be able to save someone who's submerged in water.
    ko: "…물속에 빠진 사람을 우리가 구할 수가 없는데."
    ja: "…どうやって助ける気よ。"
  event_ce006_1_05_s_55:
    speaker: "<Self>"
    en: If anything happens, I'll go in.
    ko: 그렇게 되면 내가 들어갈게.
    ja: 何かあった時は、私が行こう
  event_ce006_1_05_s_56:
    speaker: rapi
    en: "... Okay. If anything happens, you'll have to take over."
    ko: "…알겠습니다. 만약 그렇게 된다면 부탁드리겠습니다."
    ja: "…了解しました。万一の場合はお願いします。"
  event_ce006_1_05_s_57:
    speaker: "<Narration>"
    en: 10 minutes later.
    ko: 10분 후.
    ja: 10分後
  event_ce006_1_05_s_58:
    speaker: anis
    en: "... Don't you think she's taking too long?"
    ko: 너, 너무 안 나오는 거 아냐?
    ja: ちょっと…さすがに遅すぎない？
  event_ce006_1_05_s_59:
    speaker: rapi
    en: Trained divers can stay underwater for over 10 minutes, but...
    ko: 숙련된 잠수부는 10분 이상 잠수가 가능하다고는 하지만….
    ja: |-
      熟練のダイバーであれば、
      10分以上潜水できることもあるようだけど…
  event_ce006_1_05_s_60:
    speaker: neon
    en: I can't wait any more. Let's throw in a fishing line.
    ko: 안 되겠어요. 낚싯줄이라도….
    ja: これはよくありませんね。やはり釣り糸を…
  event_ce006_1_05_s_61:
    speaker: "<Self>"
    en: I'll go in. First, let's attach some fishing line to me.
    ko: 내가 들어갈게. 일단 허리에 낚싯줄이라도 묶어서….
    ja: 私が行く。釣り糸を命綱にしよう…
  event_ce006_1_05_s_62:
    speaker: "<Monologue>"
    en: We hurriedly wrap a fishing line around my waist.
    ko: 다급히 낚싯줄을 허리에 칭칭 감는다.
    ja: 私は素早く腰に釣り糸を巻き付けた
  event_ce006_1_05_s_63:
    speaker: "<Self>"
    en: I'll be back. While I'm gone, be sure t...
    ko: 다녀올게. 뒤는 부탁….
    ja: 行ってくる。あとは頼ん…
  event_ce006_1_05_s_64:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 첨벙-!
    ja: ザバッ！
  event_ce006_1_05_s_65:
    speaker: "<Monologue>"
    en: EVE emerges from the lake, sending water spraying every which way.
    ko: 물이 튀며 이브가 솟아올랐다.
    ja: 水しぶきをあげ、イヴが顔を出した
  event_ce006_1_05_s_66:
    speaker: ce006_01
    en: Whew...
    ko: 후우….
    ja: ふぅ…
  event_ce006_1_05_s_67:
    speaker: "<Monologue>"
    en: She lifts herself out of the water, and stares at us.
    ko: 이브는 호수에서 몸을 내민 채 우리를 빤히 쳐다보았다.
    ja: イヴは湖から頭をのぞかせながら、私たちを見た
  event_ce006_1_05_s_68:
    speaker: ce006_01
    en: "... Are you trying to fish by using the Commander as bait?"
    ko: "…지휘관을 미끼로 써서 낚시를 하려는 거야?"
    ja: "…指揮官を釣りのエサにするつもり？"
  event_ce006_1_05_s_69:
    speaker: rapi
    en: Er... not quite.
    ko: 그건… 아니야.
    ja: そのつもりは…ないわ。
  event_ce006_1_05_s_70:
    speaker: ce006_01
    en: The drainage system is working fine. Nothing is blocking the main system.
    ko: |-
      배수로 쪽은 이상 없었어.
      딱히 뭔가가 막고 있지도 않았고.
    ja: |-
      排水路の方は異常なし。
      特に何も詰まってなかった。
  event_ce006_1_05_s_71:
    speaker: rapi
    en: Then the problem must be with one of the drain pipes connected to it.
    ko: 그렇다면 배수로와 이어진 배수관 쪽에 문제가 있는 거겠네.
    ja: |-
      それなら、排水路と接続された
      水道管の方に問題があるようね。
  event_ce006_1_05_s_72:
    speaker: ce006_01
    en: Yeah. There's probably a blocked drain pipe somewhere on the outskirts of
      the city.
    ko: |-
      응. 도시 외곽 쪽에 배수관이 있을 거야.
      거기가 막혀있을 가능성이 높아.
    ja: |-
      そう。ここの排水には問題ない。
      ここから先のどこかで詰まってる
      可能性が高い。
  event_ce006_1_05_s_73:
    speaker: rapi
    en: Okay, let's go investigate.
    ko: 알겠어. 그쪽을 조사해 보는 게 좋겠네.
    ja: 分かった。そちらを調査しましょう。
  event_ce006_1_05_s_74:
    speaker: anis
    en: What was inside the lake?
    ko: "…호수 안에, 뭐가 있었어?"
    ja: "…で、どうなってた？"
  event_ce006_1_05_s_75:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_76:
    speaker: ce006_01
    en: The ground floor seems to have been some sort of plaza.
    ko: 1층은 광장이었던 것 같아.
    ja: たぶん広場だった場所だと思う。
  event_ce006_1_05_s_77:
    speaker: ce006_01
    en: I saw some benches and streetlights.
    ko: 벤치와 가로등 같은 것들이 있었어.
    ja: ベンチや街灯みたいなものがあった。
  event_ce006_1_05_s_78:
    speaker: anis
    en: You know that's not what I'm asking.
    ko: 그걸 물어보는 게 아니라는 거 알잖아.
    ja: |-
      そういうことを聞いたんじゃないって
      分かるでしょ？
  event_ce006_1_05_s_79:
    speaker: ce006_01
    en: "... On the floor, there were three bodies lying on top of a door."
    ko: "…바닥에 있는 문 위에서 셋이 죽어있었어."
    ja: "…床にハッチがあって、その扉の上に3体。"
  event_ce006_1_05_s_80:
    speaker: ce006_01
    en: One of them was missing an arm.
    ko: 그중 한 명은 팔이 절단된 상태였고.
    ja: そのうち1つは腕が欠けていた。
  event_ce006_1_05_s_81:
    speaker: anis
    en: On top of a door, you said?
    ko: 문 위에서…?
    ja: 扉の上に…？
  event_ce006_1_05_s_82:
    speaker: ce006_01
    en: Yes. Maybe they died while they were trying to get inside somewhere.
    ko: 응. 아마 문 안으로 들어가려다가 실패한 것 아닐까.
    ja: |-
      ええ。たぶん中に入ろうとして、
      できなかったんだと思う。
  event_ce006_1_05_s_83:
    speaker: ce006_01
    en: There were traces of welding marks on the outside of the door.
    ko: "…그리고, 문은 밖에서 용접한 흔적이 있어."
    ja: "…それから、扉は外から溶接した跡があった。"
  event_ce006_1_05_s_84:
    speaker: rapi
    en: "..."
    ko: "…문 밖에서 용접한 흔적이…."
    ja: "…外から溶接した跡…"
  event_ce006_1_05_s_85:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_86:
    speaker: "<Self>"
    en: I think we need to try talking to Com again.
    ko: 콤과 얘기를 해봐야겠어.
    ja: コムから話を聞こう
  event_ce006_1_05_s_87:
    speaker: "<Self>"
    en: We found three dead Nikkes on top of what appears to be a large door on the
      ground floor.
    ko: 1층의 큰 문 위에 셋의 니케가 죽어있었어.
    ja: |-
      湖の底に大きな扉があって、
      その上でニケが3名亡くなっていたそうだ
  event_ce006_1_05_s_88:
    speaker: "<Self>"
    en: Do you know anything about that?
    ko: 이것에 대해 아는 게 있어?
    ja: 何か知っていることはないか？
  event_ce006_1_05_s_89:
    speaker: com
    en: No, I don't.
    ko: 모른다.
    ja: さあな。
  event_ce006_1_05_s_90:
    speaker: "<Self>"
    en: What's behind that door?
    ko: 저 문 안에 뭐가 있지?
    ja: その奥には何がある？
  event_ce006_1_05_s_91:
    speaker: com
    en: I don't know.
    ko: 모른다.
    ja: さあな。
  event_ce006_1_05_s_92:
    speaker: roam
    en: Com is unintelligent, and doesn't know much.
    ko: |-
      콤은 멍청하다.
      그래서 아무것도 모른다.
    ja: |-
      コムはバカだ。
      だから何も分からない。
  event_ce006_1_05_s_93:
    speaker: com
    en: Shut up. I'm not dumb.
    ko: |-
      닥쳐라.
      나는 멍청하지 않다.
    ja: |-
      うるさい。
      私はバカではない。
  event_ce006_1_05_s_94:
    speaker: roam
    en: If you were smart, then you would be able to answer.
    ko: 멍청하지 않으면 얘기할 수 있을 것.
    ja: バカじゃなければ、話せるはずだ。
  event_ce006_1_05_s_95:
    speaker: com
    en: I won't fall for such simplistic provocations.
    ko: 나는 그런 저수준의 도발에 넘어가지 않는다.
    ja: そのようなレベルの低い挑発には乗らない。
  event_ce006_1_05_s_96:
    speaker: neon
    en: Whoa, this is some high-level psychological warfare we're witnessing.
    ko: 높은 수준의 심리전이 오가고 있네요.
    ja: ハイレベルな心理戦ですね。
  event_ce006_1_05_s_97:
    speaker: anis
    en: Never thought I'd live to see the day where two robots are bickering.
    ko: 로봇끼리 말싸움하는 것도 다 보고, 오래 살고 볼 일이야.
    ja: |-
      ロボットの言い争いが見られるなんて、
      長生きしてみるものねえ。
  event_ce006_1_05_s_98:
    speaker: privaty
    en: Can't we just pry it open and parse through its data?
    ko: 데이터를 열어보면 되는 것 아닌가요?
    ja: データを解析すれば済む話では？
  event_ce006_1_05_s_99:
    speaker: anis
    en: Yes, but we don't have the necessary tools.
    ko: 그럴 장비가 없잖아.
    ja: そんな道具、ここにはないでしょ。
  event_ce006_1_05_s_100:
    speaker: privaty
    en: They do in the Ark.
    ko: 방주에는 있잖아요.
    ja: アークにはあります。
  event_ce006_1_05_s_101:
    speaker: anis
    en: Well, we're not in the Ark, are we?
    ko: 여기는 방주가 아니고.
    ja: ここはアークじゃないでしょ。
  event_ce006_1_05_s_102:
    speaker: privaty
    en: We could take it.
    ko: 데려가면 되죠.
    ja: 持ち帰ればいいだけです。
  event_ce006_1_05_s_103:
    speaker: anis
    en: Take it where?
    ko: 데려가…?
    ja: 持ち帰る…？
  event_ce006_1_05_s_104:
    speaker: privaty
    en: I was going to mention this earlier.
    ko: 그렇지 않아도 말씀드리려 했어요.
    ja: ちょうど言おうと思っていたことでした。
  event_ce006_1_05_s_105:
    speaker: privaty
    en: Finding an old robot like this is a rare occurrence. It could contain valuable
      historical data.
    ko: |-
      이렇게 오래된 로봇은 찾기 힘들어요.
      오래전 데이터를 가지고 있을 가능성이 높죠.
    ja: |-
      コムは滅多に見られない、古いロボットです。
      しかも当時のデータを持っている
      可能性が高いですから…
  event_ce006_1_05_s_106:
    speaker: privaty
    en: I've been waiting for the ideal time to take it back to the Ark and examine
      it,
    ko: 기회를 봐서 방주로 데려가서 조사를 해야 했는데.
    ja: |-
      タイミングを計ってアークに連れて帰り、
      調査をするべきだと考えていました。
  event_ce006_1_05_s_107:
    speaker: privaty
    en: and now would seem to be the perfect time.
    ko: 뭐, 지금이 딱 적기인 것 같네요.
    ja: 今がまさに、そのタイミングのようです。
  event_ce006_1_05_s_108:
    speaker: privaty
    en: If we're taking this one, it would be good if Roam came too, since it has
      spent a lot of time on the surface as well.
    ko: |-
      가는 김에, 롬도 함께 가면 좋겠죠.
      롬도 지상에서 오랜 시간을 보냈잖아요?
    ja: |-
      せっかくなので、ロムにも来てもらいます。
      地上を長い間動き回っているようですから。
  event_ce006_1_05_s_109:
    speaker: rapi
    en: What will happen to it after you bring it to the Ark?
    ko: 가면 어떻게 되는 거지?
    ja: 連れて行って、どうするの？
  event_ce006_1_05_s_110:
    speaker: privaty
    en: The data it contains will be analyzed in detail.
    ko: 데이터를 자세히 열어보겠죠?
    ja: データ解析でも受けてもらうとか？
  event_ce006_1_05_s_111:
    speaker: rapi
    en: And after?
    ko: 그다음엔.
    ja: その後は？
  event_ce006_1_05_s_112:
    speaker: privaty
    en: After that... the Central Government will handle it.
    ko: 그다음엔… 중앙 정부가 알아서 할 일이죠.
    ja: その後は…中央政府が判断することです。
  event_ce006_1_05_s_113:
    speaker: rapi
    en: So it wouldn't be sent back to the surface.
    ko: 다시 지상으로 올려 보내지 않을 거라는 얘기로 들리는데.
    ja: 二度と地上へ返さないという話に聞こえるわね。
  event_ce006_1_05_s_114:
    speaker: privaty
    en: Most likely, no.
    ko: 그럴 가능성이 높겠죠.
    ja: その可能性も大いにあるでしょう。
  event_ce006_1_05_s_115:
    speaker: roam
    en: I need to collect artifacts and build a second Ark.
    ko: 롬 유물 수집해서 제2의 방주 만들어야 한다.
    ja: |-
      ロムは遺物を収集して
      第2のアークを作る必要がある。
  event_ce006_1_05_s_116:
    speaker: roam
    en: I need to stay on the surface.
    ko: 지상에 있어야 한다.
    ja: 地上にいなければならない。
  event_ce006_1_05_s_117:
    speaker: com
    en: You'll take me to the Ark?
    ko: 나를 방주에 데려간다고?
    ja: 私をアークに連行する気か？
  event_ce006_1_05_s_118:
    speaker: com
    en: I'd rather self-destruct than go there!
    ko: 방주에 갈 바엔 자폭하겠다.
    ja: |-
      そうなるぐらいなら、
      ここで自爆してやる。
  event_ce006_1_05_s_119:
    speaker: roam
    en: Com does not have the ability to self-detonate. It is a bluff.
    ko: |-
      콤에겐 자폭 기능이 없다.
      허풍이다.
    ja: |-
      コムに自爆機能はない。
      それはウソだ。
  event_ce006_1_05_s_120:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_05_s_121:
    speaker: "<Self>"
    en: I won't send Roam and Com to the Ark.
    ko: 롬과 콤은 방주로 보내지 않을 거야.
    ja: どちらもアークには送らない
  event_ce006_1_05_s_122:
    speaker: privaty
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  event_ce006_1_05_s_123:
    speaker: privaty
    en: Then you clearly don't care about the safety of the Ark.
    ko: 지휘관은 정말 방주의 안위는 안중에도 없군요.
    ja: |-
      やはり、アークの安全のことは
      考えてもいないようですね。
  event_ce006_1_05_s_124:
    speaker: "<Self>"
    en: What?
    ko: "…뭐?"
    ja: "…なに？"
  event_ce006_1_05_s_125:
    speaker: privaty
    en: Although we don't know precisely what kind of data these two robots contain,
      it is highly probable that whatever it is will be of immense value to the Ark.
    ko: |-
      두 로봇이 어떤 데이터를 가지고 있는지는 모르지만,
      높은 확률로 방주에 도움이 되는 데이터를 가지고 있을 거예요.
    ja: |-
      絶対ではありませんが、
      彼らはアークにとって役立つデータを
      保有している可能性が高いロボットです。
  event_ce006_1_05_s_126:
    speaker: privaty
    en: At the very least, we could ascertain how frequently they encountered Raptures
      in the areas they've been previously, or what types of Raptures.
    ko: |-
      하다못해 돌아다닌 곳의 랩쳐 출몰도나,
      출몰하는 랩쳐의 타입도 알 수 있겠죠.
    ja: |-
      少なく見積もっても、探索した場所で出現した
      ラプチャーの量や種類などが分かります。
  event_ce006_1_05_s_127:
    speaker: privaty
    en: Robots that have operated solo on the surface for an extended period are exceedingly
      uncommon.
    ko: 오랜 기간, 단독으로 지상에서 활동을 유지하고 있는 로봇은 굉장히 드물어요.
    ja: |-
      長期間、地上で単独活動を続けている
      ロボットのデータは、非常に貴重なものです。
  event_ce006_1_05_s_128:
    speaker: privaty
    en: They will absolutely be useful to the Ark. That much is certain.
    ko: 어떤 방식이든 방주에 도움이 된다는 건 확정이에요.
    ja: |-
      どのような形であれ、
      アークの助けとなるでしょう。
  event_ce006_1_05_s_129:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_130:
    speaker: privaty
    en: I appreciate that you have respect for other people and objects. That's why
      I like you.
    ko: 저는 지휘관이 모든 걸 소중하게 여긴다는 게 미덕이라고 생각하고, 그것 때문에 좋아하지만.
    ja: |-
      様々なものを大切にするのはいい事ですし、
      だからこそ私も好意を抱いているわけですが…
  event_ce006_1_05_s_131:
    speaker: privaty
    en: However, I don't want you to run afoul of the top brass because of it.
    ko: 그 때문에 방주의 눈밖에 나진 않았으면 좋겠어요.
    ja: |-
      それであなたがアークににらまれるようなことは
      望んでいません。
  event_ce006_1_05_s_132:
    speaker: anis
    en: I can't believe you just said that!
    ko: 이, 이게 어디 은근슬쩍 고백을…!
    ja: ど、どさくさに紛れて告白した…！
  event_ce006_1_05_s_133:
    speaker: privaty
    en: What?
    ko: 예, 예? 제가요?
    ja: な、なんですか？私が何か言いましたか？
  event_ce006_1_05_s_134:
    speaker: anis
    en: You just said you like him!
    ko: 좋아한다고 말했잖아 방금!
    ja: たった今好意を抱いてるって言ったじゃない！
  event_ce006_1_05_s_135:
    speaker: privaty
    en: I did? N-no, I meant...!
    ko: 제, 제가요? 아, 아닌…!
    ja: わ、私が？そ、そんなことは…！
  event_ce006_1_05_s_136:
    speaker: privaty
    en: "... Uh."
    ko: "…어."
    ja: "…あっ。"
  event_ce006_1_05_s_137:
    speaker: privaty
    en: I meant I respect him as a soldier! Not anything romantic!
    ko: |-
      그, 그그그그. 구, 군인으로서 존경한다는 의미였어요!
      이성으로서가 아니라!
    ja: |-
      そ、そそそ、それはその！
      ぐ、軍人として尊敬しているという意味です！
      それだけの話で！
  event_ce006_1_05_s_138:
    speaker: anis
    en: That better be what you meant.
    ko: 그래야 할 거야.
    ja: そうじゃなきゃ大ごとよ。
  event_ce006_1_05_s_139:
    speaker: privaty
    en: Of course it was! What are you insinuating?
    ko: |-
      무, 물론이죠!
      무, 무슨 소릴 하는 거람 진짜.
    ja: |-
      と、当然です！
      い、いったい何を言い出すかと思えば…
  event_ce006_1_05_s_140:
    speaker: privaty
    en: A-anyway. I know you have a proclivity for stubbornness, Commander,
    ko: |-
      아, 아무튼.
      지휘관이 고집부리는 건 하루이틀 일이 아니라는 건 알지만.
    ja: |-
      と、とにかく。
      指揮官が頑固なことは
      以前からよく理解していますが…
  event_ce006_1_05_s_141:
    speaker: privaty
    en: but please, for once, I'm asking you to compromise on this.
    ko: 이번엔 조금 양보해 줘요.
    ja: 今回だけは譲歩してください。
  event_ce006_1_05_s_142:
    speaker: privaty
    en: The data these two robots contain is more valuable than you can possibly imagine.
    ko: 저 둘이 가진 데이터는, 상상이상으로 가치가 높을 거예요.
    ja: 想像以上の価値があるデータになるはずです。
  event_ce006_1_05_s_143:
    speaker: "<Self>"
    en: No.
    ko: 싫어.
    ja: それはできない
  event_ce006_1_05_s_144:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_s_145:
    speaker: privaty
    en: Fine. How about this, then?
    ko: 좋아요. 이렇게 해요.
    ja: 分かりました。こうしましょう。
  event_ce006_1_05_s_146:
    speaker: privaty
    en: We'll designate Roam and Com as honorary members of the Counters Squad.
    ko: 롬과 콤을 카운터스, 즉 특수별동대의 명예 대원으로 지정해요.
    ja: |-
      ロムとコムはカウンターズ、
      つまり特殊別働隊の名誉隊員として扱います。
  event_ce006_1_05_s_147:
    speaker: privaty
    en: That way, no one will be able to mistreat them.
    ko: 그럼 누구도 함부로 다루지 못할 테니까.
    ja: |-
      そうすれば、軽々しく手を出そうとする者は
      いません。
  event_ce006_1_05_s_148:
    speaker: neon
    en: Oh, that's a good idea.
    ko: 오, 그런 방법이.
    ja: おお！そんな方法が！
  event_ce006_1_05_s_149:
    speaker: privaty
    en: That will also justify us sending them right back to the surface after we've
      analyzed their data.
    ko: 그럼 데이터만 확인하고 바로 올려 보낼 구실이 생겨요.
    ja: |-
      そうしておけば、データの分析後に
      すぐ地上へ返す口実にもなります。
  event_ce006_1_05_s_150:
    speaker: privaty
    en: I'll personally ensure that it's done.
    ko: 제가 챙길게요.
    ja: そこは私が責任を負いますので。
  event_ce006_1_05_s_151:
    speaker: roam
    en: I will be the Commander's colleague? How exciting!
    ko: |-
      롬. 지휘관 동료가 되는 건가?
      신난다.
    ja: |-
      ロム、指揮官の仲間になる？
      うれしい。
  event_ce006_1_05_s_152:
    speaker: "<Self>"
    en: You were my colleague from the start.
    ko: 계속 동료였잖아.
    ja: もとからそうだと思っていたが
  event_ce006_1_05_s_153:
    speaker: roam
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_05_s_154:
    speaker: roam
    en: How exciting! So exciting!
    ko: 신난다. 신난다.
    ja: うれしい。うれしい。
  event_ce006_1_05_s_155:
    speaker: "<Self>"
    en: Are you okay with going to the Ark, Roam?
    ko: "…롬, 방주에 갔다 와도 괜찮겠어?"
    ja: "…ロム、アークに来てもらうが問題ないか？"
  event_ce006_1_05_s_156:
    speaker: roam
    en: I'm okay. I'm curious about the Ark.
    ko: 괜찮다. 방주. 궁금하다.
    ja: 問題ない。アーク。気になる。
  event_ce006_1_05_s_157:
    speaker: com
    en: I won't go. The moment I set foot in a filthy cesspool like that, my brain
      is likely to rot.
    ko: 나는 가지 않는다. 더러운 방주에 발을 디디는 순간 머리가 썩어버릴 거다.
    ja: |-
      私はお断りだ。汚らわしいアークなど、
      足を踏み入れた瞬間に頭が腐りそうだ。
  event_ce006_1_05_s_158:
    speaker: roam
    en: You do not have a physical brain, and it will not rot.
    ko: 콤은 발도 없고 머리는 썩지 않는다.
    ja: コムに足はない、頭も腐ったりしない。
  event_ce006_1_05_s_159:
    speaker: "<Self>"
    en: Sorry Com, but you don't have much of a choice here.
    ko: 미안하지만 콤에게는 선택지가 없어.
    ja: すまないが、君に選択の余地はない
  event_ce006_1_05_s_160:
    speaker: "<Self>"
    en: Either cooperate with us and accept the deal, or we'll leave you entirely
      at the mercy of the Ark.
    ko: 협조하거나, 방주에 가서 조사를 받거나 둘 중 하나야.
    ja: |-
      ここで私たちに協力するか、
      アークで調べられるか、どちらかだ
  event_ce006_1_05_s_161:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_05_s_162:
    speaker: privaty
    en: I suppose that settles it then.
    ko: "…대충 정리된 것 같네요."
    ja: "…話がまとまったようですね。"
  event_ce006_1_05_s_163:
    speaker: "<Monologue>"
    en: Privaty turns her head toward the Tetrapod.
    ko: 프리바티는 잠시 고개를 돌려 테트라포드 쪽을 바라보았다.
    ja: |-
      プリバティは顔の向きを変え
      テトラポッドの様子を見た
  event_ce006_1_05_s_164:
    speaker: "<Monologue>"
    en: Lily, Adam, and Elegg are hard at work with the repairs.
    ko: 릴리와 아담, 일레그가 열심히 수리 중이다.
    ja: |-
      リリーとアダム、エレグが
      懸命に修理を続けている
  event_ce006_1_05_s_165:
    speaker: privaty
    en: "... Hmph. You see? I told you I could get things done."
    ko: "…흥. 봤죠? 저도 하려면 한다고요."
    ja: |-
      …ふんっ。どうですか？
      私もやる時はやるんです。
  event_ce006_1_05_s_166:
    speaker: anis
    en: Who are you talking to?
    ko: "…어딜 보고 얘기 하는 거야?"
    ja: "…どこ見て言ってるの？"
  event_ce006_1_05_s_167:
    speaker: privaty
    en: No one. It's nothing.
    ko: 아뇨. 아무것도 아니에요.
    ja: いえ、ただの独り言です。
  event_ce006_1_05_s_168:
    speaker: privaty
    en: I'll get moving, along with Roam and Com, once you're done checking out the
      drain pipes.
    ko: |-
      그럼 인근의 배수관 조사가 끝나는 대로
      롬과 콤을 데리고 움직일게요.
    ja: |-
      では、そちらの調査が終わり次第、
      ロムとコムを連れていきます。
  event_ce006_1_05_s_169:
    speaker: privaty
    en: I'll mark the location on the map for you.
    ko: 지도상의 위치를 알려드릴 테니, 다녀오세요.
    ja: |-
      地図上の位置を教えますので、
      そこに向かってください。
event_ce006_1_05_e:
  event_ce006_1_05_e_1:
    speaker: roam
    en: This place is very wet. Very squishy.
    ko: 이곳. 질척질척.
    ja: ここ、ベチャベチャ。
  event_ce006_1_05_e_2:
    speaker: roam
    en: Not good for treads.
    ko: 바퀴. 잘 굴러가지 않는다.
    ja: うまく進めない。
  event_ce006_1_05_e_3:
    speaker: ce006_03_op
    en: There will be a lot of water pooled up in that area.
    ko: 아무래도 물이 빠져나가는 곳이니 주위에 물이 흥건할 거예요.
    ja: 水の通り道だし、ぬかるんでても当然だよ。
  event_ce006_1_05_e_4:
    speaker: ce006_03_op
    en: Usually, there'd be equipment preventing that from happening, but the place
      hasn't exactly been maintained as of late.
    ko: |-
      보통은 그런 걸 방지하는 시설이 있을 텐데,
      관리가 안되니 그냥 방류된 것 같네요.
    ja: |-
      普通ならそうならないようにしてるはずだけど、
      管理されてないからね。
  event_ce006_1_05_e_5:
    speaker: ce006_npc_01_op
    en: That means that water has been continuously seeping out, even if it does so
      at varying speeds.
    ko: 그 말은 속도에 차이는 있더라도 물이 계속 빠지고 있었다는 얘기겠지.
    ja: |-
      少なくなってはいても、
      まだ水の流れがあるということだな。
  event_ce006_1_05_e_6:
    speaker: ce006_npc_01_op
    en: There's a high chance that there's an obstruction of some kind there. If that's
      moved out of the way, the water will drain.
    ko: |-
      뭔가 막혀있을 가능성이 높으니,
      그것만 치우면 물이 다 빠져나갈 거야.
    ja: |-
      水路に何かが詰まっている可能性が高い。
      原因を取り除けば排水が進むはずだ。
  event_ce006_1_05_e_7:
    speaker: ce006_01
    en: I'll take a look around. Is the scan function still not working?
    ko: |-
      일단 주위를 둘러볼게.
      스캔 기능은 여전히 안돼?
    ja: |-
      とりあえず、周囲を確認してみる。
      スキャン機能はまだ使えない？
  event_ce006_1_05_e_8:
    speaker: ce006_03_op
    en: Nope. It's been kaput ever since we arrived.
    ko: 예. 여기 오고 난 뒤부터는 먹통이네요.
    ja: はい。ここに来てからずっと。
  event_ce006_1_05_e_9:
    speaker: ce006_03_op
    en: To be exact, the scan function is operational, but it's not detecting anything.
    ko: |-
      정확히는 스캔 기능은 작동하는데,
      잡히는 게 아무것도 없어요.
    ja: |-
      正確には、スキャン機能は作動してるんですが
      何も分析できないんです。
  event_ce006_1_05_e_10:
    speaker: elegg_op
    en: Ms. Lily, Mr. Adam, and I were discussing that a few moments ago.
    ko: 그렇지 않아도 이거 관련해서 릴리 씨랑 아담 씨랑 이야기하고 있었는데여.
    ja: |-
      ちょうどその件でお二人と
      話をしていたところですぞ。
  event_ce006_1_05_e_11:
    speaker: elegg_op
    en: When we tried to scan the Tetrapod's power source and detailed schematics,
      it was like looking through a lens that was fogged up.
    ko: |-
      테트라포드의 동력원이나 디테일한 구조를 보려고 하니
      눈에 필터가 끼인 것처럼 아무것도 안 보이더라구여.
    ja: |-
      テトラポッドの動力源や細かい構造を
      調べようとしたら…目にフィルターが
      かかったみたいに何も見えなくなるんですな。
  event_ce006_1_05_e_12:
    speaker: ce006_npc_01_op
    en: Despite the fact that everything seemed normal to me.
    ko: 내 눈에는 정상적으로 보였지만 말이지.
    ja: 俺からは普通に見えるがな。
  event_ce006_1_05_e_13:
    speaker: ce006_03_op
    en: Same for me.
    ko: 저도 마찬가지로 잘 보였어요.
    ja: あたしも普通に見える。
  event_ce006_1_05_e_14:
    speaker: ce006_03_op
    en: Adam and I took the opposite approach and took apart some of Elegg's machines.
    ko: 반대로, 저랑 아담이 일레그가 가진 기계를 뜯어봤는데.
    ja: |-
      でも逆に、あたしとアダムがエレグの機械を
      調べようとしたら…
  event_ce006_1_05_e_15:
    speaker: ce006_03_op
    en: Parts that we were already familiar with showed up clear as day, but when
      it came to the power source or detailed schematics, the results came back blurred
      beyond recognition.
    ko: |-
      저희가 알고 있는 양식이나 구조인 경우에는 잘 보였는데,
      마찬가지로 동력원이나 디테일한 부분은 엄청 흐리게 보였어요.
    ja: |-
      あたしたちが知ってる構造は見えるんだけど、
      動力源とか細かい部分だけ
      モヤがかかったみたいで。
  event_ce006_1_05_e_16:
    speaker: "<Self>"
    en: That must mean we can't share technology between our worlds.
    ko: "…상호 간의 기술 공유가 불가능하다는 얘기겠네."
    ja: "…技術交換はさせないぞ、ということか"
  event_ce006_1_05_e_17:
    speaker: elegg_op
    en: It would seem so. However, that might be by design.
    ko: 녜. 그런데 생각해 보면 이게 맞는 것 같기도 하고여.
    ja: |-
      ですな。ただ、考えてみれば
      そうあるべきという気もしますぞ。
  event_ce006_1_05_e_18:
    speaker: elegg_op
    en: Technology that we use here without a second thought could cause a quantum
      leap elsewhere.
    ko: |-
      이쪽 세계에서는 아무렇지도 않게 사용하는 기술이,
      저쪽 세계에서는 퀀텀 점프를 일으킬 기술일지도 모르잖아여?
    ja: |-
      こちらの世界で普通に使われている技術が、
      あちらの世界で物理学を変えるような
      ものになったりするかもしれませんゆえ。
  event_ce006_1_05_e_19:
    speaker: elegg_op
    en: Gatekeeper could be doing this deliberately to maintain a sort of balance,
    ko: 그 게이트 키퍼라는 랩쳐 나름대로 밸런스 조절을 하는 게 아닐까 싶어여.
    ja: |-
      ゲートキーパーとかいうラプチャーなりに、
      バランスを考えているとも想像できますな。
  event_ce006_1_05_e_20:
    speaker: elegg_op
    en: negating anything that could cause a major shift between different worlds.
    ko: 서로의 세계에 큰 변화를 줄 요소는 철저히 배제하는 방식으로여.
    ja: |-
      お互いの世界が大きく変わるような事象は
      注意深く排除するように…
  event_ce006_1_05_e_21:
    speaker: ce006_01
    en: That's unfortunate. It would have been nice to take something back.
    ko: 아쉽네. 뭐라도 얻어갈 수 있었으면 좋았을 텐데.
    ja: 残念。何か情報が得られたらよかったのに。
  event_ce006_1_05_e_22:
    speaker: elegg_op
    en: I know. It pretty much shatters the dream of sharing technology between worlds.
    ko: 제 말이여. 다른 세계와의 기술 공유라는 꿈이 무너졌어여.
    ja: |-
      まったくですぞ。異世界との技術交換という
      夢がついえましたな。
  event_ce006_1_05_e_23:
    speaker: ce006_npc_01_op
    en: That's a shame, for sure.
    ko: 그러게.
    ja: そうだな。
  event_ce006_1_05_e_24:
    speaker: ce006_npc_01_op
    en: We might have come across some useful discoveries.
    ko: "…도움이 될 만한 뭔가가 있을지도 몰랐을 텐데 말이야."
    ja: "…世界を変えられる何かがあったかもしれない。"
  event_ce006_1_05_e_25:
    speaker: roam
    en: At least you'll always be able to retain the memories.
    ko: 그래도 기억은 남는다.
    ja: それでも、記憶は残る。
  event_ce006_1_05_e_26:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_e_27:
    speaker: roam
    en: Is something wrong, EVE?
    ko: 이브. 왜 그러나.
    ja: イヴ。どうした？
  event_ce006_1_05_e_28:
    speaker: ce006_01
    en: Nothing's wrong. It's just... that was a rather poetic line, Roam.
    ko: 아니. 좋은 말인 것 같아서 좀 놀랐어.
    ja: |-
      何でもない。
      いい言葉だと思って少し驚いただけ。
  event_ce006_1_05_e_29:
    speaker: roam
    en: I know many good lines.
    ko: 롬은 좋은 말 많이 안다.
    ja: ロムはいい言葉をたくさん知っている。
  event_ce006_1_05_e_30:
    speaker: anis
    en: Tell me again why you had to tag along.
    ko: 그런데 너 여기까지 따라올 것까진 없지 않았을까?
    ja: |-
      そういえば、ロム。
      なんでわざわざついて来たの？
  event_ce006_1_05_e_31:
    speaker: roam
    en: I might discover new artifacts.
    ko: 새로운 유물 발견할지도 모른다.
    ja: 新しい遺物が見つかるかもしれない。
  event_ce006_1_05_e_32:
    speaker: roam
    en: The more artifacts, the better for the second Ark.
    ko: |-
      유물은 많을수록 좋다.
      제2의 방주. 더 좋아진다.
    ja: |-
      遺物は多いほどいい。
      第2のアーク。もっとよくなる。
  event_ce006_1_05_e_33:
    speaker: anis
    en: You're nothing if not industrious.
    ko: "…정말 열심히 하네 너."
    ja: "…ホント、頑張ってるわね。"
  event_ce006_1_05_e_34:
    speaker: roam
    en: I always work hard.
    ko: 롬은 항상 열심히 한다.
    ja: ロムは常に頑張っている。
  event_ce006_1_05_e_35:
    speaker: ce006_01
    en: Is that your main function? Gathering artifacts?
    ko: "…롬은 계속 그렇게 유물을 모으는 거야?"
    ja: "…ロムはずっと古い物を集めているの？"
  event_ce006_1_05_e_36:
    speaker: roam
    en: Affirmative. That is what I must do.
    ko: |-
      그렇다.
      그것이 롬이 해야 할 일.
    ja: |-
      そうだ。
      それがロムのするべきこと。
  event_ce006_1_05_e_37:
    speaker: ce006_01
    en: Why?
    ko: 왜?
    ja: どうして？
  event_ce006_1_05_e_38:
    speaker: roam
    en: I do not remember.
    ko: 기억나지 않는다.
    ja: 覚えていない。
  event_ce006_1_05_e_39:
    speaker: roam
    en: I do remember it is my duty.
    ko: 해야 할 일이라는 것은 안다.
    ja: するべきこと、それだけ分かる。
  event_ce006_1_05_e_40:
    speaker: ce006_01
    en: Doesn't it get boring?
    ko: 지루하진 않아?
    ja: 飽きたりしない？
  event_ce006_1_05_e_41:
    speaker: roam
    en: No, it does not. Because it is something I must do.
    ko: |-
      지루하지 않다.
      롬이 해야 할 일이니까 당연.
    ja: |-
      飽きない。
      当然。ロムのするべきことだから。
  event_ce006_1_05_e_42:
    speaker: ce006_01
    en: Hehe, I think I could learn a few things from you.
    ko: |-
      후후. 그래?
      대단하네. 배우고 싶을 정도야.
    ja: |-
      ふふ…そう？
      立派ね。見習いたいぐらい。
  event_ce006_1_05_e_43:
    speaker: roam
    en: What do you do in your own world, EVE?
    ko: 이브는 저쪽 세계에서 뭘 했나.
    ja: イヴは何をしている？
  event_ce006_1_05_e_44:
    speaker: ce006_01
    en: Me?
    ko: 나? 나는….
    ja: 私？私は…
  event_ce006_1_05_e_45:
    speaker: ce006_01
    en: "... I fight with the Naytiba."
    ko: "…계속 싸웠어. 네이티브와."
    ja: "…ずっと戦い続けてる。ネイティブと。"
  event_ce006_1_05_e_46:
    speaker: roam
    en: All the time?
    ko: 계속?
    ja: ずっと？
  event_ce006_1_05_e_47:
    speaker: ce006_01
    en: Yes. All the time.
    ko: 응. 계속.
    ja: そう、ずっと。
  event_ce006_1_05_e_48:
    speaker: roam
    en: Doesn't that become monotonous?
    ko: 지루하진 않나?
    ja: 飽きないか？
  event_ce006_1_05_e_49:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_05_e_50:
    speaker: ce006_01
    en: I never gave it much thought.
    ko: 어떤… 기분으로 계속 싸웠는지는 잘 모르겠어.
    ja: |-
      どういう気持ちで戦ってるのかは…
      よく分からない。
  event_ce006_1_05_e_51:
    speaker: ce006_01
    en: It was something I had to do, and so I did it. With everything I had.
    ko: 내가 해야 할 일이니까, 그저 열심히 했을 뿐이야.
    ja: それが私の使命だから、すべきことをするだけ。
  event_ce006_1_05_e_52:
    speaker: roam
    en: Same as me.
    ko: 롬과 같다.
    ja: ロムと同じだ。
  event_ce006_1_05_e_53:
    speaker: ce006_01
    en: Heh, I suppose you're right. You and I are pretty similar.
    ko: |-
      후후. 그렇네.
      롬과 나는 비슷하네.
    ja: |-
      ええ。
      ロムと私は似た者同士かも。
  event_ce006_1_05_e_54:
    speaker: rapi
    en: Nobody move!
    ko: "…다들 정지."
    ja: "…止まって。"
  event_ce006_1_05_e_55:
    speaker: rapi
    en: Raptures detected up ahead.
    ko: 전방. 랩쳐 확인.
    ja: 前方にラプチャー確認。
  event_ce006_1_05_e_56:
    speaker: "<Monologue>"
    en: Ahead of us lies a massive tunnel.
    ko: 라피가 가리킨 방향을 바라본다.
    ja: ラピの指さす方向を見た
  event_ce006_1_05_e_57:
    speaker: "<Monologue>"
    en: The entrance is blocked
    ko: |-
      거대한 터널이 보인다.
      터널의 입구는 철조망으로 막혀있다.
    ja: |-
      巨大なトンネルがあった。
      入口が有刺鉄線の網で塞がれている
  event_ce006_1_05_e_58:
    speaker: "<Monologue>"
    en: with a mass of barbed wire and other bits of detritus.
    ko: 철조망에 걸려있는 온갖 쓰레기와 흙, 풀 등으로 인해 터널은 막혀있는 상태다.
    ja: |-
      目を凝らしてみると、
      有刺鉄線にゴミや泥、草が引っかかっていた
  event_ce006_1_05_e_59:
    speaker: "<Monologue>"
    en: Water trickles through the gaps in the blockage, indicating that the tunnel
      must be a drainage pipe.
    ko: |-
      막힌 철조망 틈에서 물이 조금씩 흐르고 있는 것으로,
      저 터널이 배수관이라는 것을 알 수 있었다.
    ja: |-
      隙間を少しずつ水が流れている。
      おそらくこの中のどこかに問題があるのだろう
  event_ce006_1_05_e_60:
    speaker: anis
    en: That's almost certainly a drainage pipe, but I don't see any Raptures.
    ko: "…배수관이다. 근데 랩쳐는 없는데?"
    ja: |-
      …見つかったわね。
      ラプチャーは見当たらないけど？
  event_ce006_1_05_e_61:
    speaker: neon
    en: Could they be hiding, or waiting to attack?
    ko: 혹시 매복이라던가?
    ja: もしかして、隠れているのでしょうか？
  event_ce006_1_05_e_62:
    speaker: rapi
    en: Yes. They're lying in wait.
    ko: 맞아. 매복 중이야.
    ja: その通りよ。待ち伏せね。
  event_ce006_1_05_e_63:
    speaker: anis
    en: Hold on... how did you know that, Neon?
    ko: "…네온 너 뭐야. 어떻게 알았어."
    ja: "…ネオン、なんで分かったの？"
  event_ce006_1_05_e_64:
    speaker: neon
    en: Uh... instinct! Instinct developed through firepower.
    ko: 가, 감이죠 예. 화력으로 다져진 감.
    ja: |-
      カ、カンですよ、カン。
      火力で磨きあげたカンです！
  event_ce006_1_05_e_65:
    speaker: rapi
    en: They're hiding underground, waiting to ambush us.
    ko: 지면 아래에 매복하고 있어.
    ja: 地中に隠れているわ。
  event_ce006_1_05_e_66:
    speaker: ce006_01
    en: Why would they bother hiding out here? I thought the surface was desolate.
    ko: |-
      왜 매복하고 있는 거야?
      지상은 비어 있다고 들었는데.
    ja: |-
      どうして？
      地上にはもう誰もいないって聞いたけど。
  event_ce006_1_05_e_67:
    speaker: rapi
    en: Rapture ambushes operate slightly differently from the ambushes we know.
    ko: 우리가 알고 있는 매복과, 랩쳐의 매복은 성질이 달라.
    ja: |-
      ラプチャーの待ち伏せは、
      普通とは意味が違うの。
  event_ce006_1_05_e_68:
    speaker: rapi
    en: They'll find places likely to be frequented by humans or Nikkes, and then
      lie in wait for ages.
    ko: 랩쳐는 인간이나 니케가 올만한 장소에서 저렇게 끝도 없이 기다려.
    ja: |-
      人間やニケが来るかもしれない場所に、
      ひたすら潜伏しているのよ。
  event_ce006_1_05_e_69:
    speaker: rapi
    en: They most likely concluded that either humans or Nikkes would come to this
      place due to the flowing water, and decided to wait.
    ko: |-
      저곳은 물이 흐르는 곳이니,
      니케나 인간이 올 것이라고 판단하고 매복, 아니.
    ja: |-
      水の流れがあるから、
      ニケや人間が来るはずだと考えて、隠れる…
  event_ce006_1_05_e_70:
    speaker: rapi
    en: It's entirely possible they've been waiting here for decades.
    ko: |-
      기다리고 있는 거야.
      어쩌면 수십 년 동안 기다리고 있는 것일지도 모르지.
    ja: |-
      いえ、ただ待機しているの。
      もしかしたら、何十年も。
  event_ce006_1_05_e_71:
    speaker: ce006_01
    en: Persistent.
    ko: 집요하네.
    ja: しつこい連中。
  event_ce006_1_05_e_72:
    speaker: rapi
    en: They certainly are.
    ko: 집요해.
    ja: その通りよ。
  event_ce006_1_05_e_73:
    speaker: ce006_01
    en: Do they feed on humans or Nikkes?
    ko: 인간이나 니케를 먹는 거야?
    ja: 人間やニケを食べるため？
  event_ce006_1_05_e_74:
    speaker: rapi
    en: No. They simply kill them.
    ko: 아니. 그냥 죽여.
    ja: いいえ、ただ襲うために。
  event_ce006_1_05_e_75:
    speaker: ce006_01
    en: That makes their persistence even stranger.
    ko: "…이상할 정도로 집요하네."
    ja: "…異常な執着心。"
  event_ce006_1_05_e_76:
    speaker: rapi
    en: Yes, it does.
    ko: 이상할 정도로 집요해.
    ja: そうね、不思議なほど。
  event_ce006_1_05_e_77:
    speaker: "<Self>"
    en: Rapi. Let's get started.
    ko: 라피. 슬슬 시작하자.
    ja: ラピ。そろそろ始めよう
  event_ce006_1_05_e_78:
    speaker: rapi
    en: Affirmative. Engaging enemy.
    ko: 예. 교전에 돌입하겠습니다.
    ja: はい。交戦を開始します。
  event_ce006_1_05_e_79:
    speaker: "<Self>"
    en: Let's do this.
    ko: 부탁해.
    ja: 頼む
  event_ce006_1_05_e_80:
    speaker: rapi
    en: Roger.
    ko: 라져.
    ja: ラジャー。
event_ce006_1_06_s:
  event_ce006_1_06_s_1:
    speaker: "<Narration>"
    en: "*Kwwwwaaa*"
    ko: 콰아아아아---
    ja: ゴゴゴゴゴ――
  event_ce006_1_06_s_2:
    speaker: "<Monologue>"
    en: With a resounding roar, the surface of the lake begins to recede.
    ko: 요란한 소리를 내며 호수의 수면이 내려간다.
    ja: すさまじい音とともに、湖の水位が下がっていく
  event_ce006_1_06_s_3:
    speaker: "<Monologue>"
    en: Before long, the entire lake has been drained, revealing the ground floor
      in its entirety.
    ko: |-
      이윽고 호수는 모두 사라졌고,
      1층의 바닥이 모습을 드러냈다.
    ja: |-
      湖はみるみるうちに消え去り、
      やがて水底が現れた
  event_ce006_1_06_s_4:
    speaker: "<Monologue>"
    en: The first thing that catches my eye is the three fallen Nikkes.
    ko: |-
      …가장 먼저 눈에 들어온 것은,
      쓰러져 있는 셋의 니케.
    ja: |-
      …真っ先に目に飛び込んできたものは
      倒れた3つのニケの亡骸だ
  event_ce006_1_06_s_5:
    speaker: "<Monologue>"
    en: Their bodies have become overgrown with moss, making them look like a part
      of the natural landscape.
    ko: 이끼가 곳곳에 피어나 있어, 마치 자연물의 하나처럼 보였다.
    ja: |-
      身体中にコケが生えている。
      まるで最初から自然の一部だったかのようだ
  event_ce006_1_06_s_6:
    speaker: "<Monologue>"
    en: We cautiously head down to the ground floor.
    ko: 우리는 조심스럽게 1층으로 내려갔다.
    ja: 私たちはおそるおそる、湖底に足を踏み入れた
  event_ce006_1_06_s_7:
    speaker: rapi
    en: Confirmation of death. No surprise there.
    ko: "…예상대로, 니케 3기는 사망이 확인됩니다."
    ja: |-
      …予想した通り、
      ニケ3体は死亡が確認されました。
  event_ce006_1_06_s_8:
    speaker: rapi
    en: And for a long time at that. I'm not even picking up any brain activity.
    ko: |-
      오랜 시간이 지났군요.
      뇌도 죽었습니다.
    ja: |-
      かなり時間が経っています。
      脳の摘出も無意味です。
  event_ce006_1_06_s_9:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_s_10:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_s_11:
    speaker: privaty
    en: If I may.
    ko: 잠깐 실례할게요.
    ja: ちょっと失礼。
  event_ce006_1_06_s_12:
    speaker: "<Monologue>"
    en: Privaty steps forward and searches the bodies of the fallen Nikkes.
    ko: 프리바티가 앞으로 나서 쓰러져있는 니케들의 몸을 뒤적였다.
    ja: |-
      プリバティが前に出て、
      倒れているニケのボディをあらためた
  event_ce006_1_06_s_13:
    speaker: privaty
    en: There doesn't seem to be any data stored inside. Then again, even if there
      was, it would have almost certainly been damaged by the water and electricity.
    ko: |-
      …별다른 자료는 없어 보이네요.
      애초에 있었다고 하더라도 전기와 물 때문에 손상되었겠지만.
    ja: |-
      …データは残っていなさそうですね。
      仮にあったとしても、こんな環境では
      劣化で読み取れなくなっているはずです。
  event_ce006_1_06_s_14:
    speaker: privaty
    en: They're wearing dog tags. Old models.
    ko: |-
      인식표… 가 있네요.
      오래된 모델이에요.
    ja: |-
      認識票は…ありました。
      古いモデルですね。
  event_ce006_1_06_s_15:
    speaker: privaty
    en: These might help us find out something.
    ko: "…이거라도 챙겨가면 뭐라도 알아낼 수 있겠죠."
    ja: |-
      …これを持ち帰れば、
      何か分かることもあるでしょう。
  event_ce006_1_06_s_16:
    speaker: "<Self>"
    en: All right, take them.
    ko: 응. 부탁할게.
    ja: ああ、頼んだ
  event_ce006_1_06_s_17:
    speaker: privaty
    en: I'm going to head back to the Ark.
    ko: 그럼, 저는 이만 돌아가볼게요.
    ja: では、私はここで。
  event_ce006_1_06_s_18:
    speaker: privaty
    en: I'll take Roam and Com with me, and make sure they get to come back to the
      surface.
    ko: 롬과 콤을 데리고 가서, 제가 책임지고 다시 데려올게요.
    ja: |-
      ロムとコムは私が責任をもって預かり、
      必ずここへ戻らせます。
  event_ce006_1_06_s_19:
    speaker: rapi
    en: All right.
    ko: 그래.
    ja: 任せたわ。
  event_ce006_1_06_s_20:
    speaker: roam
    en: The Ark... I'm looking forward to it.
    ko: 방주. 기대된다.
    ja: アーク。楽しみ。
  event_ce006_1_06_s_21:
    speaker: com
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_06_s_22:
    speaker: privaty
    en: Oh, just a moment. I received a message from the Ark.
    ko: |-
      아, 잠시만요.
      방주에서 연락이 왔어요.
    ja: |-
      あ、少々お待ちを。
      アークからの連絡です。
  event_ce006_1_06_s_23:
    speaker: "<Monologue>"
    en: Privaty steps away.
    ko: 프리바티가 멀찌감치 떨어진다.
    ja: プリバティがその場を離れた
  event_ce006_1_06_s_24:
    speaker: ce006_03
    en: This door underneath them has welding marks.
    ko: 그런데 이분들 아래에 있는 이 문….
    ja: |-
      ところで、あの下敷きになってる
      ハッチですけど…
  event_ce006_1_06_s_25:
    speaker: ce006_03
    en: Considering which side they're on,
    ko: 정말 용접 흔적이 보이네요.
    ja: 本当に溶接されてるみたいですね。
  event_ce006_1_06_s_26:
    speaker: ce006_03
    en: it must have been soldered from the outside.
    ko: 이쪽, 그러니까 바깥쪽에서 용접했어요.
    ja: それも…こっち、外側から。
  event_ce006_1_06_s_27:
    speaker: ce006_npc_01
    en: I hope it wasn't done to keep people inside from getting out...
    ko: 안에 있는 사람들을 못 나오게 용접한 것만 아니면 좋겠군.
    ja: 中の人たちを閉じ込めるためじゃないといいが。
  event_ce006_1_06_s_28:
    speaker: ce006_03
    en: I hope so too...
    ko: 저도 그랬으면 좋겠는데….
    ja: あたしもそう思うけど…
  event_ce006_1_06_s_29:
    speaker: ce006_01
    en: How long will it take to open this up?
    ko: "…이걸 여는데 얼마나 걸릴까?"
    ja: "…開けるのにどれくらいかかりそう？"
  event_ce006_1_06_s_30:
    speaker: ce006_03
    en: If we go full steam ahead, we should be able to pop it open quickly.
    ko: |-
      힘으로 뜯어내면 금방이긴 할 텐데,
      안에 뭐가 있을지 모르니까요.
    ja: |-
      強引にこじあけるならすぐですけど、
      中に何があるか分からないので。
  event_ce006_1_06_s_31:
    speaker: ce006_03
    en: If we're careful about it, I'd say maybe half a day?
    ko: 조심해서 하면 반나절 정도 걸리지 않을까요?
    ja: 慎重に進めるなら、半日くらいでしょうか？
  event_ce006_1_06_s_32:
    speaker: ce006_01
    en: How are the repairs on the Tetrapod going?
    ko: 테트라포드 수리는?
    ja: テトラポッドの修理は？
  event_ce006_1_06_s_33:
    speaker: elegg
    en: All done! We've even finished running all the necessary tests.
    ko: |-
      히히. 다 끝났어여.
      테스트도 다 끝났고여.
    ja: |-
      ふひひっ。ほとんど終わっておりますぞ。
      テストもバッチリですな。
  event_ce006_1_06_s_34:
    speaker: elegg
    en: I may not have been able to do a deep dive into the schematics like I wanted,
      but it was still a fun project.
    ko: 아아~ 자세한 건 알아낼 수 없었지만 재밌는 작업이었어여.
    ja: |-
      詳しいことが分からなかったのは残念ですが、
      やりがいのある作業でしたぞ。
  event_ce006_1_06_s_35:
    speaker: elegg
    en: Repairing things is always a hoot.
    ko: 역시 뭔가를 고치는 건 즐겁네여.
    ja: |-
      やっぱり何かを修理するというのは
      楽しいですなあ。
  event_ce006_1_06_s_36:
    speaker: privaty
    en: Sorry to interrupt,
    ko: 잠깐 괜찮을까요?
    ja: 少々よろしいですか？
  event_ce006_1_06_s_37:
    speaker: privaty
    en: but I just got a report confirming the location of Gatekeeper.
    ko: 게이트 키퍼의 위치가 확정되었다는 보고에요.
    ja: ゲートキーパーの位置が判明しました。
  event_ce006_1_06_s_38:
    speaker: privaty
    en: It's approximately 20 kilometers from here, in the old downtown area.
    ko: 위치는 이곳에서 20km 떨어진 구 도심으로 확인된다고 해요.
    ja: ここから20kmほど離れた旧都心部です。
  event_ce006_1_06_s_39:
    speaker: ce006_03
    en: Nice. Sounds like they're making progress.
    ko: 와. 수색에 진전이 있었나 보네요.
    ja: わ、見つかったんですか。
  event_ce006_1_06_s_40:
    speaker: ce006_03
    en: So, if we deal with this Gatekeeper character, we might be able to return
      to our world?
    ko: 그럼 가서 그 게이트 키퍼라는 걸 이렇게 저렇게 하면 저흰 원래 세계로 돌아갈 수 있겠네요.
    ja: |-
      じゃあ、そのゲートキーパーっていうのを
      何とかすれば、元の世界に戻れるんですね？
  event_ce006_1_06_s_41:
    speaker: privaty
    en: That's right.
    ko: 예. 맞아요.
    ja: はい。そのはずです。
  event_ce006_1_06_s_42:
    speaker: ce006_npc_01
    en: That's good news.
    ko: 듣던 중 반가운 소리군.
    ja: それはよかった。
  event_ce006_1_06_s_43:
    speaker: ce006_npc_01
    en: "..."
    ko: "…인데."
    ja: "…まあ…"
  event_ce006_1_06_s_44:
    speaker: ce006_npc_01
    en: But I don't think we'll be heading back any time soon.
    ko: 당장 돌아갈리는 없을 거야.
    ja: その話は後回しだ。
  event_ce006_1_06_s_45:
    speaker: privaty
    en: What? Why not?
    ko: "…예?"
    ja: "…はい？"
  event_ce006_1_06_s_46:
    speaker: ce006_npc_01
    en: Because a certain someone we know can never resist getting involved in other
      people's affairs.
    ko: 오지랖 빼면 시체인 동료가 있어서 말이야.
    ja: この上なくおせっかい焼きの仲間がいるからな。
  event_ce006_1_06_s_47:
    speaker: ce006_03
    en: Right.
    ko: 그렇죠.
    ja: そうだね。
  event_ce006_1_06_s_48:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_s_49:
    speaker: ce006_01
    en: Adam, Lily. I'm sorry, but I would like to delay our return for a while.
    ko: |-
      아담, 릴리.
      미안한데 돌아가는 건 좀 미뤘으면 좋겠어.
    ja: |-
      アダム、リリー。
      悪いけど、戻るのはもう少し後にしたい。
  event_ce006_1_06_s_50:
    speaker: ce006_01
    en: I want to find out what's happening here and help in any way I can.
    ko: 이곳에서의 일을 도와주고 싶어.
    ja: こっちの調査を手伝ってからにしよう。
  event_ce006_1_06_s_51:
    speaker: ce006_01
    en: I'm also curious to find out what's behind that door.
    ko: "…저 문 너머에, 뭐가 있는지 궁금하기도 하고."
    ja: "…扉の向こうに何があるか気になる。"
  event_ce006_1_06_s_52:
    speaker: ce006_npc_01
    en: I knew it.
    ko: 그럴 줄 알았어.
    ja: だと思った。
  event_ce006_1_06_s_53:
    speaker: ce006_03
    en: Hehe, yeah, we totally called it.
    ko: 헤헤. 그러게요.
    ja: へへ、そうですよね。
  event_ce006_1_06_s_54:
    speaker: anis
    en: Are you sure? Don't you need to hurry back?
    ko: |-
      괜찮겠어?
      빨리 돌아가야 하는 것 아냐?
    ja: |-
      大丈夫なの？
      早く戻った方がいいんじゃない？
  event_ce006_1_06_s_55:
    speaker: anis
    en: You're not duty-bound to help us by any means.
    ko: 그리고, 딱히 우릴 도와줄 의리도 없을 테고.
    ja: そもそも、私たちを手伝う義理はないんだし。
  event_ce006_1_06_s_56:
    speaker: ce006_01
    en: You helped with the repair of the Tetrapod.
    ko: 테트라포드 수리를 도와줬잖아.
    ja: テトラポッドの修理を手伝ってもらったから。
  event_ce006_1_06_s_57:
    speaker: ce006_01
    en: And besides, do you always need a reason to want to help someone?
    ko: 그리고 사람을 돕는데 꼭 이유가 필요한 건 아니니까.
    ja: |-
      それに、人を助けることに
      理由はいらないと思う。
  event_ce006_1_06_s_58:
    speaker: anis
    en: Wow, I can't remember the last time I heard someone speak in such... lofty
      terms.
    ko: |-
      우와….
      저런 말 자체를 정말 오랜만에 듣네.
    ja: |-
      わあ…
      そんなこと言う人、久々に見たわ。
  event_ce006_1_06_s_59:
    speaker: "<Self>"
    en: If you are willing to help, we certainly won't turn you down.
    ko: 도와준다면 우리야 마다할 이유가 없지.
    ja: こちらとしては、断る理由はないが
  event_ce006_1_06_s_60:
    speaker: ce006_03
    en: Then let's do something about that door first.
    ko: 그럼 일단 이 문부터 어떻게 좀 해볼게요.
    ja: |-
      じゃあ、とりあえず
      この扉からどうにかしましょう。
  event_ce006_1_06_s_61:
    speaker: ce006_03
    en: Let's see, what tools should we bring...
    ko: |-
      어디보자….
      장비를 뭘 챙기면 좋을까….
    ja: |-
      えっと…
      何を持って行けばいいかな…
  event_ce006_1_06_s_62:
    speaker: ce006_npc_01
    en: Wearing it down with a grinder might be a good idea.
    ko: 그라인더로 갈아내는 게 좋을 것 같은데.
    ja: グラインダーで切断するか。
  event_ce006_1_06_s_63:
    speaker: elegg
    en: How about using a torch to pierce through it?
    ko: 토치로 뚫어보는 건 어떨까여?
    ja: ガストーチで穴を開けるのはいかがですかな？
  event_ce006_1_06_s_64:
    speaker: ce006_03
    en: Or drilling a hole and packing it with explosives.
    ko: 드릴로 구멍을 내서 폭약을….
    ja: ドリルで穴を開けて爆薬を…
  event_ce006_1_06_s_65:
    speaker: privaty
    en: See you around, everybody.
    ko: 그럼, 저희는 다녀올게요.
    ja: ひとまず、私たちは離脱します。
  event_ce006_1_06_s_66:
    speaker: roam
    en: Going to the Ark! How exciting!
    ko: 방주 여행. 신난다. 신난다.
    ja: アーク旅行。うれしい。うれしい。
  event_ce006_1_06_s_67:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_1_06_s_68:
    speaker: anis
    en: The way Com's acting is making me nervous.
    ko: 콤 이 녀석 좀 위험해 보이는데.
    ja: コムがちょっと危なそうに見えるけど。
  event_ce006_1_06_s_69:
    speaker: neon
    en: Yeah, it couldn't stop raving and ranting before, but now it's gone quiet.
    ko: 그러게요. 그렇게나 막 뭐라고 하더니 갑자기 조용해졌어요.
    ja: |-
      そうですね。あんなに文句を言ってたのに
      急に静かになりました。
  event_ce006_1_06_s_70:
    speaker: privaty
    en: Maybe it gave up. Or it's plotting something.
    ko: |-
      포기한 걸 지도 모르죠.
      아니면 다른 꿍꿍이가 있거나.
    ja: |-
      観念したのかもしれません。
      あるいは、何かたくらんでいるか。
  event_ce006_1_06_s_71:
    speaker: privaty
    en: Either way, don't worry. Its weapons have all been removed and Roam will keep
      an eye on it.
    ko: |-
      하지만 걱정하지 마요.
      무장은 전부 떼어냈고, 롬이 잘 포박해서 갈 테니까요.
    ja: |-
      いずれにしても心配は無用です。
      武装は解除してありますし、
      ロムもしっかり見張っていますから。
  event_ce006_1_06_s_72:
    speaker: com
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_06_s_73:
    speaker: com
    en: The Ark is traitorous.
    ko: 방주는 배신한다.
    ja: アークは裏切る。
  event_ce006_1_06_s_74:
    speaker: com
    en: The Ark takes everything from you.
    ko: 방주는 모든 걸 다 빼앗아간다.
    ja: アークはすべてを奪っていく。
  event_ce006_1_06_s_75:
    speaker: com
    en: The Ark is traitorous.
    ko: 방주는 배신한다.
    ja: アークは裏切る。
  event_ce006_1_06_s_76:
    speaker: com
    en: The Ark takes everything from you.
    ko: 방주는 모든 걸 다 빼앗아간다.
    ja: アークはすべてを奪っていく。
  event_ce006_1_06_s_77:
    speaker: anis
    en: Yeah, yeah, we've heard it all before. Talk about being a broken record.
    ko: "…적당히 해. 누가 그걸 몰라."
    ja: |-
      …いい加減にして。
      そんなことみんな知ってるわよ。
  event_ce006_1_06_s_78:
    speaker: com
    en: The Ark is traitorous.
    ko: 방주는 배신한다.
    ja: アークは裏切る。
  event_ce006_1_06_s_79:
    speaker: com
    en: The Ark takes everything from you.
    ko: 방주는 모든 걸 다 빼앗아간다.
    ja: アークはすべてを奪っていく。
  event_ce006_1_06_s_80:
    speaker: privaty
    en: "... I suggest we hurry for the sake of our own mental health, if nothing
      else."
    ko: |-
      …빨리 가는 게 좋겠어요.
      여러분 정신 건강에 안 좋을 것 같으니까.
    ja: |-
      …早く出発した方がよさそうですね。
      みなさんにストレスがかかりそうです。
  event_ce006_1_06_s_81:
    speaker: privaty
    en: By the way, I just sent you a file, Commander.
    ko: |-
      아, 지휘관.
      방금 파일 하나 전송했어요.
    ja: |-
      それと、指揮官。
      今、ファイルをお送りしました。
  event_ce006_1_06_s_82:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: 何だ？
  event_ce006_1_06_s_83:
    speaker: privaty
    en: It's a detailed map of the area. I figured it might come in handy.
    ko: |-
      일대의 상세 지도예요.
      혹시나 필요할지도 모르니 받아두세요.
    ja: |-
      この辺りの詳細な地図です。
      何かの役に立つかもしれません。
      受け取っておいてください。
  event_ce006_1_06_s_84:
    speaker: privaty
    en: It's highly classified, so make sure to keep a tight lid on it.
    ko: "…대외비니까, 절대 다른데 유출하지 마시고요."
    ja: |-
      …機密情報ですので、くれぐれも
      外には漏らさないように。
  event_ce006_1_06_s_85:
    speaker: "<Self>"
    en: Oh, thank you.
    ko: 오… 고마워.
    ja: ああ…ありがとう
  event_ce006_1_06_s_86:
    speaker: anis
    en: Love sure does make us do foolish things. Like handing out confidential information
      like it's nothing.
    ko: |-
      사랑에 빠진 여자는 무섭구나.
      대외비도 그냥 막 주고.
    ja: |-
      一途な乙女心ね～
      秘密の情報を渡しちゃうなんて。
  event_ce006_1_06_s_87:
    speaker: privaty
    en: What did you just say?
    ko: 무, 무슨 소리 하시는 건가요 갑자기?
    ja: な、何の話ですか！？
  event_ce006_1_06_s_88:
    speaker: anis
    en: Nothing. Nothing at all... hehe.
    ko: 아~무것도 아닌데?
    ja: さあね～なんだろ～？
  event_ce006_1_06_s_89:
    speaker: privaty
    en: "... Anyway, I'll see you all later."
    ko: |-
      …정말.
      그럼, 다들 나중에 봐요.
    ja: |-
      …まったく…
      では、失礼いたします。
  event_ce006_1_06_s_90:
    speaker: com
    en: The Ark is traitorous.
    ko: 방주는 배신한다.
    ja: アークは裏切る。
  event_ce006_1_06_s_91:
    speaker: com
    en: The Ark takes everything from you.
    ko: 방주는 모든 걸 다 빼앗아간다.
    ja: アークはすべてを奪っていく。
  event_ce006_1_06_s_92:
    speaker: roam
    en: Be quiet, would you?
    ko: 조용히 해라. 시끄럽다.
    ja: 静かにしろ。うるさい。
  event_ce006_1_06_s_93:
    speaker: privaty
    en: "*Sigh*... This is gonna be a long trip back."
    ko: "…후우. 좀 막막하네요."
    ja: "…はぁ。先が思いやられますね。"
  event_ce006_1_06_s_94:
    speaker: "<Monologue>"
    en: Privaty, Roam, and Com leave.
    ko: 프리바티와 롬, 콤은 이동했다.
    ja: プリバティとロム、コムがその場を離れた
  event_ce006_1_06_s_95:
    speaker: rapi
    en: All right, let's keep watch over the area.
    ko: 그럼 저희는 주위를 경계하겠습니다.
    ja: では、私たちは周辺の警戒を行います。
  event_ce006_1_06_s_96:
    speaker: anis
    en: That's about the only thing we can do now.
    ko: 그것 말고는 딱히 할 일도 없고 말이지.
    ja: それ以外にすることもないわね。
event_ce006_1_06_e:
  event_ce006_1_06_e_1:
    speaker: "<Monologue>"
    en: The next day.
    ko: 다음날.
    ja: 翌日
  event_ce006_1_06_e_2:
    speaker: "<Self>"
    en: How are things progressing?
    ko: 진척도는 어때?
    ja: 作業は進んでいるか？
  event_ce006_1_06_e_3:
    speaker: elegg
    en: Nearly finished. The welding wasn't as strong as we thought.
    ko: |-
      거의 다 됐어여.
      생각했던 것보다 용접 수준은 높지 않은뎨.
    ja: |-
      ほぼ終わっておりますぞ。
      思っていたより溶接のレベルが
      高くありませんでしたのでな。
  event_ce006_1_06_e_4:
    speaker: elegg
    en: We're being extra careful since we don't know what's inside, so it took longer
      than expected.
    ko: 안에 뭐가 있을지 몰라 신중에 신중을 가하다 보니 시간이 많이 지났네여.
    ja: |-
      とはいえ、中がどうなっているか
      分かりませんゆえ、慎重を期しただけですな。
  event_ce006_1_06_e_5:
    speaker: ce006_03
    en: We just need to finish this last part.
    ko: 이 부분만 해결하면 끝이에요.
    ja: ここさえできればもう終わりです。
  event_ce006_1_06_e_6:
    speaker: ce006_03
    en: Should take an hour at most.
    ko: 길어봐야 1시간 안에 끝나요.
    ja: 長くても1時間以内には開けられます。
  event_ce006_1_06_e_7:
    speaker: "<Self>"
    en: Okay, so you're nearly there.
    ko: 오. 진짜 다됐네.
    ja: そうか、あと少しだな
  event_ce006_1_06_e_8:
    speaker: ce006_npc_01
    en: I spent all of last night hammering away at this.
    ko: 밤새 고생했으니까.
    ja: 夜通し作業を続けたからな。
  event_ce006_1_06_e_9:
    speaker: ce006_npc_01
    en: I could use a good rest.
    ko: 어디 가서 눈이라도 좀 붙이고 싶군.
    ja: どこかで一休みしたいところだ。
  event_ce006_1_06_e_10:
    speaker: "<Self>"
    en: Go right ahead. I'll help with things over here.
    ko: |-
      눈 좀 붙이지 그래?
      여긴 내가 도와줄게.
    ja: |-
      休憩を取ってくれ。
      後は私が手伝おう
  event_ce006_1_06_e_11:
    speaker: ce006_npc_01
    en: I really appreciate that, thanks.
    ko: 흠… 그럼 부탁 좀 할까?
    ja: ふむ…じゃ、任せていいか？
  event_ce006_1_06_e_12:
    speaker: ce006_03
    en: Oh no you don't, Adam. No slacking off.
    ko: 아담. 요령 피우지 마요.
    ja: アダム。抜け駆けしないでよ。
  event_ce006_1_06_e_13:
    speaker: ce006_npc_01
    en: What do you mean? It's almost finished anyway. It's not like I can be of much
      more help.
    ko: |-
      요령이라니. 어차피 이제 다 끝났잖아.
      보조가 할 수 있는 일도 끝이지 않을까?
    ja: |-
      何言ってる、どうせすぐ終わりだ。
      サポートできることもないだろう？
  event_ce006_1_06_e_14:
    speaker: ce006_03
    en: You could help with the cleanup.
    ko: 뒷정리 도와주셔야죠.
    ja: 後片付けもあるし。
  event_ce006_1_06_e_15:
    speaker: "<Self>"
    en: I'll take care of that. You go rest, Adam.
    ko: |-
      그건 내가 할게.
      가서 좀 쉬어.
    ja: |-
      それは私がやっておこう。
      ゆっくり休んでくれ
  event_ce006_1_06_e_16:
    speaker: ce006_npc_01
    en: You see? He says it's fine.
    ko: 라고 하는데.
    ja: "…だ、そうだが。"
  event_ce006_1_06_e_17:
    speaker: ce006_03
    en: "*Sigh*... Fine. Go."
    ko: 에휴. 그러세요 그럼.
    ja: やれやれ。じゃあ、好きにすれば？
  event_ce006_1_06_e_18:
    speaker: elegg
    en: C'mon, Ms. Lily, give Mr. Adam some slack. He did a good job helping us.
    ko: |-
      히히. 너무 그러지 마여.
      아담 씨 열심히 도와줬잖아여.
    ja: |-
      ふひひっ。あまり責めないであげてくだされ。
      アダム氏も頑張ってくれておりましたからな。
  event_ce006_1_06_e_19:
    speaker: ce006_npc_01
    en: Yeah, what she said! It's not easy being an assistant to two engineers.
    ko: |-
      맞는 말이야.
      기술자 둘을 보조하는 게 쉬운 게 아니라고.
    ja: |-
      まったくだ。
      2人分の助手は楽じゃないんだぞ。
  event_ce006_1_06_e_20:
    speaker: ce006_npc_01
    en: All right then, @UserName, I appreciate you...
    ko: 그럼, 뒷일은 부탁….
    ja: じゃあ、あとのことは頼ん…
  event_ce006_1_06_e_21:
    speaker: rapi_op
    en: Commander.
    ko: "…지휘관."
    ja: "…指揮官。"
  event_ce006_1_06_e_22:
    speaker: rapi_op
    en: I need you to hurry over to the city entrance.
    ko: 입구 쪽으로 빠르게 와보셔야겠습니다.
    ja: 至急、入口の方へ。
  event_ce006_1_06_e_23:
    speaker: "<Self>"
    en: Why? Is something wrong?
    ko: 왜? 무슨 일이야?
    ja: 何かあったのか？
  event_ce006_1_06_e_24:
    speaker: rapi_op
    en: We've got a big problem.
    ko: 큰일입니다.
    ja: 非常事態です。
  event_ce006_1_06_e_25:
    speaker: "<Self>"
    en: All right. I'll be right over.
    ko: "…알겠어. 빨리 갈게."
    ja: "…分かった。すぐに行く"
  event_ce006_1_06_e_26:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_e_27:
    speaker: "<Self>"
    en: Sorry.
    ko: "…미안."
    ja: "…すまない"
  event_ce006_1_06_e_28:
    speaker: ce006_npc_01
    en: "... It's okay."
    ko: "…어쩔 수 없지."
    ja: "…仕方ないさ。"
  event_ce006_1_06_e_29:
    speaker: "<Self>"
    en: Rapi. I'm her...
    ko: 라피. 나 왔ㅇ….
    ja: ラピ、どうし…
  event_ce006_1_06_e_30:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_e_31:
    speaker: "<Self>"
    en: What's going on here?
    ko: 이게 무슨 일이야.
    ja: 何があった？
  event_ce006_1_06_e_32:
    speaker: "<Monologue>"
    en: At the city entrance, Privaty lies collapsed on the ground,
    ko: 도시 입구 쪽에 쓰러져있는 프리바티.
    ja: 倒れ伏したプリバティ
  event_ce006_1_06_e_33:
    speaker: "<Monologue>"
    en: Roam appears to be completely shut down,
    ko: 기능을 정지한 것으로 보이는 롬.
    ja: 機能停止しているらしいロム
  event_ce006_1_06_e_34:
    speaker: "<Monologue>"
    en: and there are three familiar figures standing before them.
    ko: 그리고 그 앞에 서 있는 셋.
    ja: そして、それをかばうように立つ3つの人影は…
  event_ce006_1_06_e_35:
    speaker: snowwhite
    en: I found them lying somewhere on the surface,
    ko: 주워왔다.
    ja: 拾った。
  event_ce006_1_06_e_36:
    speaker: snowwhite
    en: so I brought them here.
    ko: 바닥에 쓰러져 있더군.
    ja: 行き倒れだ。
  event_ce006_1_06_e_37:
    speaker: hongryeon
    en: This young lady is not too grievously injured. Still, 'twould be most dangerous
      to simply leave her where we found her.
    ko: |-
      이 낭자는 상처가 심하진 않네.
      그래도 놔두면 위험할 테지.
    ja: |-
      お嬢ちゃんは一刻を争うような傷ではない。
      しかし、放っておけば分からんだろうな。
  event_ce006_1_06_e_38:
    speaker: rapunzel
    en: I've already administered some basic first aid, but do you have any medical
      equipment around?
    ko: |-
      응급처치는 해놨어요.
      의료 장비는 있나요?
    ja: |-
      応急処置は済ませてあります。
      医療用の設備はありますか？
  event_ce006_1_06_e_39:
    speaker: "<Self>"
    en: What are you all doing here... No, first off, what happened to Privaty and
      Roam?
    ko: |-
      너희가 어떻게 여기에… 아니.
      그보다 프리바티랑 롬이 왜….
    ja: |-
      どうしてここに…いや、
      それよりプリバティとロムに何が…
  event_ce006_1_06_e_40:
    speaker: snowwhite
    en: "@UserName, focus. We need to treat these two first."
    ko: |-
      정신 차려라.
      이 둘부터 치료해야 한다.
    ja: |-
      しっかりしろ。
      負傷者の処置が先だ。
  event_ce006_1_06_e_41:
    speaker: rapunzel
    en: Point me where I need to go, and I'll treat them.
    ko: |-
      안내해 주세요.
      치료는 제가 할게요.
    ja: |-
      案内をお願いします。
      治療は私が。
  event_ce006_1_06_e_42:
    speaker: hongryeon
    en: Make haste.
    ko: 자, 서두르게나.
    ja: さあ、急ぐのだ。
  event_ce006_1_06_e_43:
    speaker: "<Self>"
    en: O-okay.
    ko: 아, 알겠어.
    ja: わ、分かった
  event_ce006_1_06_e_44:
    speaker: rapunzel
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  event_ce006_1_06_e_45:
    speaker: rapunzel
    en: Finished.
    ko: 됐어요. 치료는 끝났어요.
    ja: もう大丈夫です。無事に終わりました。
  event_ce006_1_06_e_46:
    speaker: rapi
    en: How's Privaty doing?
    ko: "…프리바티의 상태는?"
    ja: "…プリバティの状態は？"
  event_ce006_1_06_e_47:
    speaker: rapunzel
    en: She should wake up soon.
    ko: 곧 깨어날 거예요.
    ja: 意識はすぐに戻るでしょう。
  event_ce006_1_06_e_48:
    speaker: neon
    en: Phew, that's a relief.
    ko: 후우… 다행이네요.
    ja: はぁ…よかったです。
  event_ce006_1_06_e_49:
    speaker: "<Self>"
    en: How about Roam?
    ko: "…롬은?"
    ja: "…ロムは？"
  event_ce006_1_06_e_50:
    speaker: rapunzel
    en: Luckily, it was just a fuse that was pulled out.
    ko: 다행히 퓨즈만 빠져있던 상태라서요.
    ja: 幸い、安全装置が作動していただけです。
  event_ce006_1_06_e_51:
    speaker: rapunzel
    en: I'll turn the power back on now.
    ko: 이제 전원을 켤게요.
    ja: 再起動しますね。
  event_ce006_1_06_e_52:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉--
    ja: ウィーン――
  event_ce006_1_06_e_53:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_06_e_54:
    speaker: roam
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  event_ce006_1_06_e_55:
    speaker: "<Self>"
    en: Roam, are you okay?
    ko: "…롬. 괜찮아?"
    ja: "…ロム。大丈夫か？"
  event_ce006_1_06_e_56:
    speaker: roam
    en: I'm fine. I simply went offline for a moment.
    ko: |-
      롬은 괜찮다.
      잠깐 기절한 것뿐.
    ja: |-
      ロムは問題ない。
      少し機能が停止していただけ。
  event_ce006_1_06_e_57:
    speaker: roam
    en: Is Privaty okay?
    ko: 프리바티. 괜찮나?
    ja: プリバティ、無事か？
  event_ce006_1_06_e_58:
    speaker: anis
    en: She's fine. Don't worry.
    ko: 괜찮으니까 걱정하지 마.
    ja: 無事よ、安心して。
  event_ce006_1_06_e_59:
    speaker: roam
    en: That's good.
    ko: 정말 다행.
    ja: 本当によかった。
  event_ce006_1_06_e_60:
    speaker: "<Self>"
    en: What happened? Where's Com?
    ko: 어떻게 된 거야. 콤은?
    ja: 何があった？コムは？
  event_ce006_1_06_e_61:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_1_06_e_62:
    speaker: roam
    en: We encountered a Rapture on the way.
    ko: 이동 중 랩쳐와 만났다.
    ja: 移動中、ラプチャーに遭遇した。
  event_ce006_1_06_e_63:
    speaker: roam
    en: Privaty fought hard.
    ko: 프리바티 열심히 싸웠다.
    ja: プリバティ、必死に戦った。
  event_ce006_1_06_e_64:
    speaker: roam
    en: So did I.
    ko: 롬도 열심히 도왔다.
    ja: ロムもがんばって手伝った。
  event_ce006_1_06_e_65:
    speaker: roam
    en: But then, Com suddenly knocked Privaty unconscious
    ko: |-
      콤이 갑자기 프리바티 공격.
      프리바티 기절.
    ja: |-
      コムが突然プリバティを攻撃した。
      プリバティが気絶した。
  event_ce006_1_06_e_66:
    speaker: roam
    en: and ran away.
    ko: 콤 도망갔다.
    ja: コムは逃げた。
  event_ce006_1_06_e_67:
    speaker: anis
    en: What?!
    ko: "…뭐라고…."
    ja: "…まさか…"
  event_ce006_1_06_e_68:
    speaker: roam
    en: I had to protect Privaty, so I fought against the Rapture,
    ko: 롬 프리바티 지켜야 돼서 싸웠다.
    ja: ロムはプリバティを守るために戦った。
  event_ce006_1_06_e_69:
    speaker: roam
    en: but I couldn't win.
    ko: 랩쳐에게 이길 수 없었다.
    ja: ラプチャーに勝てなかった。
  event_ce006_1_06_e_70:
    speaker: roam
    en: Right before I went offline,
    ko: 기절하기 직전.
    ja: 機能停止する、直前…
  event_ce006_1_06_e_71:
    speaker: roam
    en: I saw three white figures come in.
    ko: 새햐안 셋이 롬 도와줬다.
    ja: 白い影、3つ、助けられた。
  event_ce006_1_06_e_72:
    speaker: snowwhite
    en: We were planning on treating them at the nearest city,
    ko: 가까운 도시로 가 치료할 생각이었다.
    ja: |-
      最寄りの治療設備がありそうな場所を
      探していたら…
  event_ce006_1_06_e_73:
    speaker: snowwhite
    en: but it just so happened you all were nearby.
    ko: 마침 너희가 있어서 다행이었군.
    ja: 運良くここへたどり着いたというわけだ。
  event_ce006_1_06_e_74:
    speaker: "<Self>"
    en: A real stroke of luck indeed. Thanks for saving them.
    ko: "…다행이다 정말. 구해줘서 고마워."
    ja: "…本当に幸いだった、感謝する"
  event_ce006_1_06_e_75:
    speaker: hongryeon
    en: "'Tis but a small matter, no need for thanks."
    ko: 뭘 인사까지. 우리 사이에.
    ja: 何だいその言いぐさは？水臭いではないか。
  event_ce006_1_06_e_76:
    speaker: rapunzel
    en: What are you all doing here anyway?
    ko: 그런데 여러분은 여기서 뭘 하고 계셨던 건가요?
    ja: ところで、みなさんはここで何を？
  event_ce006_1_06_e_77:
    speaker: "<Self>"
    en: Oh, we're...
    ko: 아. 우리는….
    ja: ああ、私たちは…
  event_ce006_1_06_e_78:
    speaker: elegg_op_l
    en: M-Mr. Commander!
    ko: 지, 지휘관 씨!
    ja: し、指揮官氏！
  event_ce006_1_06_e_79:
    speaker: elegg_op_l
    en: You need to get back here!
    ko: 빠, 빨리 여기로 좀 와봐야 할 것 같은데여…!
    ja: 急いで来てくだされ…！
  event_ce006_1_06_e_80:
    speaker: elegg_op_l
    en: Hurry!
    ko: 빠, 빨리여 빨리!
    ja: だ、大至急ですぞ！
  event_ce006_1_06_e_81:
    speaker: "<Self>"
    en: I'll be right there.
    ko: 아, 알겠어. 빨리 갈게.
    ja: わ、分かった。すぐに行く
  event_ce006_1_06_e_82:
    speaker: "<Self>"
    en: Sorry, I'll be right back.
    ko: 미안. 잠시만 갔다 올게.
    ja: すまない。少し待っててくれ
  event_ce006_1_06_e_83:
    speaker: hongryeon
    en: Take your time.
    ko: 천천히 하시게.
    ja: こちらのことは気にするな。
  event_ce006_1_06_e_84:
    speaker: snowwhite
    en: Could you give me something to eat while I wait? Otherwise I might get bored.
    ko: 기다리기 지루할 테니 먹을 걸 다오.
    ja: 待つのは腹が減る、食糧を分けてくれ。
  event_ce006_1_06_e_85:
    speaker: rapunzel
    en: Snow White. Don't be like that.
    ko: "…스노우 화이트. 제발 그러지 좀 마요."
    ja: "…スノーホワイト、状況を考えてください。"
  event_ce006_1_06_e_86:
    speaker: "<Self>"
    en: Elegg. What's wrong?
    ko: 일레그. 무슨 일이야?
    ja: エレグ、どうした？
  event_ce006_1_06_e_87:
    speaker: elegg
    en: I-inside... Behind the door...
    ko: |-
      이, 이 안에….
      문 안… 에….
    ja: |-
      こ、この中…
      扉…中に…
  event_ce006_1_06_e_88:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_e_89:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_1_06_e_90:
    speaker: "<Self>"
    en: You got it ope...?
    ko: 아, 문을 열었구… 나.
    ja: なんだ？開いた…のか…
  event_ce006_1_06_e_91:
    speaker: "<Monologue>"
    en: I stop mid-sentence.
    ko: 문이 있었던 곳을 바라본다.
    ja: 扉のあった空間の奥に目を奪われた
  event_ce006_1_06_e_92:
    speaker: "<Monologue>"
    en: A dark space lies where the door used to be.
    ko: 어두운 공간.
    ja: 暗闇…
  event_ce006_1_06_e_93:
    speaker: "<Monologue>"
    en: Standing against that darkness is a figure.
    ko: 그리고 그 어두운 공간을 등지고 있는 누군가의 모습.
    ja: そして、それを背に…何者かが座っている
  event_ce006_1_06_e_94:
    speaker: "<Monologue>"
    en: An old man,
    ko: 노인.
    ja: 老人だ
  event_ce006_1_06_e_95:
    speaker: "<Monologue>"
    en: who stares at me silently.
    ko: 노인은 아무 말 없이 나를 바라보고 있었다.
    ja: 年齢を感じられる人影が静かにこちらを見ている
  event_ce006_1_06_e_96:
    speaker: "<Self>"
    en: What in the world...
    ko: "…뭐… 야…."
    ja: "…一体…なんだ…？"
  event_ce006_1_06_e_97:
    speaker: elegg
    en: Mr. Commander...
    ko: 지, 지휘관 씨.
    ja: し、指揮官氏…
  event_ce006_1_06_e_98:
    speaker: elegg
    en: "..."
    ko: 저, 저분.
    ja: その方は…
  event_ce006_1_06_e_99:
    speaker: elegg
    en: It's a human.
    ko: 인간이에여.
    ja: 人間のようですぞ…
  event_ce006_1_06_e_100:
    speaker: "<Narration>"
    en: 'MEMORIES TELLER: To be Continued'
    ko: 'MEMORIES TELLER : To be Continued'
    ja: 'MEMORIES TELLER : To be Continued'
event_ce006_2_01_s:
  event_ce006_2_01_s_1:
    speaker: oldman_h
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_01_s_2:
    speaker: oldman_h
    en: You guys are...!
    ko: 당신들은…!
    ja: あなたたちは…！
  event_ce006_2_01_s_3:
    speaker: oldman_h
    en: "*Cough cough*"
    ko: "…흐으…! 흐으…!"
    ja: "…うぐっ…！はぁ…！"
  event_ce006_2_01_s_4:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_ce006_2_01_s_5:
    speaker: oldman_h
    en: Ahem!
    ko: 흐음…! 크흠…!
    ja: はぁ…！ううっ…！
  event_ce006_2_01_s_6:
    speaker: "<Narration>"
    en: "*Beep beep*"
    ko: 삐잇- 삐잇-
    ja: ピーッ、ピーッ――
  event_ce006_2_01_s_7:
    speaker: "<Monologue>"
    en: The machines connected to the old man start to blare noisily.
    ko: 노인과 이어져 있는 기계들이 요란한 소리를 내기 시작한다.
    ja: |-
      老人につながっている機械が、
      けたたましい音を立て始めた
  event_ce006_2_01_s_8:
    speaker: machinesound
    en: Heart rate rising rapidly.
    ko: 심장 박동 급상승 중.
    ja: 心拍数が急激に上昇中。
  event_ce006_2_01_s_9:
    speaker: machinesound
    en: Deep breaths.
    ko: 심호흡하십시오.
    ja: 深呼吸を行ってください。
  event_ce006_2_01_s_10:
    speaker: oldman_h
    en: Mrngh... huff...
    ko: 흐으…! 흐으…!
    ja: はぁ…！はぁ…！
  event_ce006_2_01_s_11:
    speaker: machinesound
    en: Vital signs weakening. Moving to resting area.
    ko: |-
      쇠약 상태.
      휴식 공간으로 이동합니다.
    ja: |-
      衰弱状態です。
      休憩室に移動します。
  event_ce006_2_01_s_12:
    speaker: oldman_h
    en: Huff... urgh...
    ko: "…흐… 으…."
    ja: "…ふ…う…"
  event_ce006_2_01_s_13:
    speaker: oldman_h
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_14:
    speaker: "<Monologue>"
    en: The old man's wheelchair moves autonomously, carrying him back into the darkness.
    ko: 노인의 휠체어가 움직이며 어둠 속으로 다시 들어간다.
    ja: 老人の車椅子が動き、闇の中へ消えていった
  event_ce006_2_01_s_15:
    speaker: "<Self>"
    en: Wait!
    ko: 자, 잠깐!
    ja: ま、待ってくれ！
  event_ce006_2_01_s_16:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_17:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_18:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_19:
    speaker: elegg
    en: I can't believe it!
    ko: 세, 세세상에…!
    ja: な、なななな…！
  event_ce006_2_01_s_20:
    speaker: elegg
    en: Did I just see what I think I saw? Was that a human survivor on the surface?!
    ko: |-
      제, 제가 지금 뭘 본 거져!?
      지, 지상에서 살아남은 사람 맞져!? 녜!?
    ja: |-
      い、今のは何だったのですかな！？
      地上に生存者がいたということですかな！？
  event_ce006_2_01_s_21:
    speaker: "<Self>"
    en: I... I think so.
    ko: "…맞는 것 같아."
    ja: "…おそらくは"
  event_ce006_2_01_s_22:
    speaker: ce006_03
    en: I thought there officially weren't supposed to be any survivors up on the
      surface.
    ko: 어… 듣기로는 지상에 생존한 인간의 수는 공식적으로 0명이라고 들었는데요.
    ja: |-
      えっと…公的な情報だと地上に残っている人は
      いないって言ってましたよね。
  event_ce006_2_01_s_23:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_24:
    speaker: ce006_npc_01
    en: I'm starting to get sick and tired of all this "official" talk.
    ko: 전에도 신경 쓰였는데, 그 [공식적으로]라는 단어.
    ja: |-
      その「公的な」っていうのが、
      引っかかっていたんだ。
  event_ce006_2_01_s_25:
    speaker: ce006_npc_01
    en: Sounds to me more like orders rather than stating the actual facts.
    ko: "[그래야 한다]로 들리는 것 같은 기분이란 말이지."
    ja: "「そうでないといけない」みたいに聞こえてな。"
  event_ce006_2_01_s_26:
    speaker: ce006_03
    en: What do you mean?
    ko: 무슨 뜻인가요?
    ja: どういう意味？
  event_ce006_2_01_s_27:
    speaker: ce006_npc_01
    en: Never mind. I don't mean much by it. Forget I said anything.
    ko: 뭐, 별뜻 아니니 신경 쓰지 마.
    ja: いや、大したことじゃない。気にするな。
  event_ce006_2_01_s_28:
    speaker: ce006_03
    en: "... Anyway, sounds like it's a pretty big deal that this old guy is up here."
    ko: |-
      …?
      아무튼, 저기 저 노인분이 여기 있는 거, 엄청 큰일인 것 아닌가요?
    ja: |-
      …？
      とにかく…これって大問題なんじゃない？
  event_ce006_2_01_s_29:
    speaker: elegg
    en: It's more than that! It's a complete upheaval of everything we've been led
      to believe up until now!
    ko: |-
      엄청 큰 일 정도가 아니에여!
      수많은 매뉴얼부터 새롭게 써야 할 정도라고여!
    ja: |-
      大問題どころではありませんな！
      どれだけの書籍が書き直しになるか…！
  event_ce006_2_01_s_30:
    speaker: elegg
    en: Mr. Commander, we have to tell the others about this!
    ko: 지, 지휘관씨 이거 빨리 공유하져!
    ja: し、指揮官氏、早く情報の共有を！
  event_ce006_2_01_s_31:
    speaker: "<Self>"
    en: You're right. Let's fill them in on what's happened.
    ko: 그, 그래. 일단 내부 공유부터 하자.
    ja: そ、そうだな。とりあえず仲間に知らせよう
  event_ce006_2_01_s_32:
    speaker: ce006_npc_01
    en: Are we not going to follow him inside?
    ko: 바로 안 따라 들어가도 되는 건가?
    ja: 急いで後を追わなくていいのか？
  event_ce006_2_01_s_33:
    speaker: "<Self>"
    en: I think we should share this information with our other team members first.
    ko: 일단 공유부터 하는 게 맞는 것 같아.
    ja: まずは連絡が先だ
  event_ce006_2_01_s_34:
    speaker: "<Self>"
    en: "... To be honest, I have no idea what the protocol is here."
    ko: "…솔직히, 어떻게 해야 할지 지금 전혀 감이 안 와."
    ja: "…正直、どう対応すればいいか見当もつかない"
  event_ce006_2_01_s_35:
    speaker: "<Monologue>"
    en: Soon after. I explain to the others what happened on the ground floor.
    ko: |-
      잠시 후.
      나는 일행에게 1층에서 있었던 일에 대해 이야기했다.
    ja: その後、私は全員に起こったことを話した
  event_ce006_2_01_s_36:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_37:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_38:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_39:
    speaker: rapi
    en: I... I don't know what to do.
    ko: 이걸… 어떻게 해야 할지 모르겠습니다.
    ja: これは…どう対処すればいいか分かりません。
  event_ce006_2_01_s_40:
    speaker: anis
    en: Yeah. It doesn't make any sense.
    ko: 그러… 게. 너무 말이 안 되는데.
    ja: そう…ねえ。想定外すぎるわ。
  event_ce006_2_01_s_41:
    speaker: neon
    en: Shouldn't we check out what's beyond that door?
    ko: 이, 일단 그 1층 문 너머에 있는 곳부터 가봐야 하지 않을까요?
    ja: と、とりあえず扉の奥に入ってみませんか？
  event_ce006_2_01_s_42:
    speaker: anis
    en: I don't know. Shouldn't we report it first?
    ko: 그, 보고부터 해야 하지 않을까?
    ja: その前に、報告しておくべきじゃない？
  event_ce006_2_01_s_43:
    speaker: neon
    en: How about we investigate as we report?
    ko: 그럼 보고하면서 조사를 해보면….
    ja: では、報告しながら調査をすれば…
  event_ce006_2_01_s_44:
    speaker: anis
    en: No, we should report as we investigate.
    ko: 아, 아니면 조사하면서 보고를 해야 해야 하나?
    ja: あ、それとも調査しながら報告する？
  event_ce006_2_01_s_45:
    speaker: neon
    en: How about investigating during the investigation?
    ko: 조, 조사하면서 조사해 보는 게 더 낫지 않을까요?
    ja: ちょ、調査しながら調査した方がいいのでは？
  event_ce006_2_01_s_46:
    speaker: anis
    en: Or reporting as we report?
    ko: 보, 보고하면서 보고하는 게 좋을 것 같기도 하고….
    ja: ほ、報告しながら報告する方がいいかも…
  event_ce006_2_01_s_47:
    speaker: rapi
    en: I think we all need to calm down.
    ko: 다들 진정하는 게 좋겠어.
    ja: 落ち着いて。
  event_ce006_2_01_s_48:
    speaker: rapi
    en: Commander. Let's report to Deputy Chief Andersen first, and then ask Privaty
      for assistance.
    ko: |-
      지휘관. 먼저 엔더슨 부사령관께 보고 드린 후,
      프리바티의 도움을 받는 게 좋을 듯합니다.
    ja: |-
      指揮官。
      まずはアンダーソン副司令官に報告して、
      プリバティの意見を聞きましょう。
  event_ce006_2_01_s_49:
    speaker: rapi
    en: We're going to have to get the Central Government involved on this.
    ko: 중앙 정부 차원에서 대응해야 할 일로 판단됩니다.
    ja: 中央政府の判断を仰ぐべき問題かと。
  event_ce006_2_01_s_50:
    speaker: "<Self>"
    en: Okay, that sounds right. Let's report to Ingrid, no, I mean Mustang, wait...
    ko: "아, 그래. 그게 맞겠어. \n잉그리드, 아니 머스탱에게 보고부터…."
    ja: |-
      ああ、そ、そうだな。
      イングリッド、いやマスタングに報告して…
  event_ce006_2_01_s_51:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_52:
    speaker: privaty
    en: Good grief. I can't sit here listening to any more of this.
    ko: "…가만히 듣고 누워있자니 못 들어주겠네요."
    ja: "…まったく、おちおち寝てもいられませんね。"
  event_ce006_2_01_s_53:
    speaker: "<Monologue>"
    en: Privaty gets up.
    ko: 누워있던 프리바티가 몸을 일으켰다.
    ja: プリバティが起き上がっていた
  event_ce006_2_01_s_54:
    speaker: "<Self>"
    en: Privaty, how are you feeling?
    ko: 프리바티. 몸은 좀 어때?
    ja: プリバティ、具合はどうだ？
  event_ce006_2_01_s_55:
    speaker: privaty
    en: I'm fine. The back of my head stings a little, but it's nothing major.
    ko: |-
      괜찮아요.
      뒤통수가 좀 따끔하긴 한데, 문제없어요.
    ja: |-
      大丈夫です。
      後頭部が少しうずきますが、大事ありません。
  event_ce006_2_01_s_56:
    speaker: privaty
    en: So, you found a survivor on the surface?
    ko: 그래서, 지상에서 생존자를 발견했다고요?
    ja: それで、生存者を発見したそうですね？
  event_ce006_2_01_s_57:
    speaker: privaty
    en: I'll file a report straight away and take all necessary actions. You should
      all go back to the ground floor to investigate.
    ko: |-
      제가 바로 보고하고 조치를 취할게요.
      여러분은 1층 내부부터 조사해 주세요.
    ja: |-
      ただちに報告を上げて対応を検討します。
      みなさんは内部の調査を進めてください。
  event_ce006_2_01_s_58:
    speaker: "<Self>"
    en: Okay, thanks for the advice.
    ko: 알겠어. 맡길게.
    ja: 分かった。任せる
  event_ce006_2_01_s_59:
    speaker: privaty
    en: What was I doing lying down, anyway?
    ko: "…그런데 저는 왜 누워있었던 거죠?"
    ja: "…ところで、私に何が起こったのですか？"
  event_ce006_2_01_s_60:
    speaker: privaty
    en: The last thing I remember is fighting a Rapture on the way to the Ark.
    ko: 방주로 가는 길에 랩쳐랑 전투가 있었던 것까진 기억나는데….
    ja: |-
      アークへの道中で、ラプチャーと
      戦闘になったことまでは覚えているのですが…
  event_ce006_2_01_s_61:
    speaker: roam
    en: Com tackled you and sent you flying. You hit the back of your head really
      hard.
    ko: |-
      콤이 몸통 박치기 했다.
      너 날아가면서 뒤통수 크게 다쳤다.
    ja: |-
      コムに体当たりされた。
      吹き飛んで後頭部を強く打った。
  event_ce006_2_01_s_62:
    speaker: privaty
    en: What?!
    ko: "…예?"
    ja: "…え？"
  event_ce006_2_01_s_63:
    speaker: roam
    en: You fainted, and the White Three saved us.
    ko: |-
      그래서 기절.
      하얀 셋이 구해줬다.
    ja: |-
      それで気絶した。
      白い3人が助けてくれた。
  event_ce006_2_01_s_64:
    speaker: privaty
    en: The who?
    ko: 하얀 셋이라니….
    ja: 白い3人…？
  event_ce006_2_01_s_65:
    speaker: rapi
    en: Speaking of which, where did they go?
    ko: "…그러고 보니 셋은 어디로 간 거지?"
    ja: "…そういえば、その3人はどこへ？"
  event_ce006_2_01_s_66:
    speaker: ce006_01
    en: Oh, they all...
    ko: 아, 그 셋은….
    ja: ああ、あの人たちなら…
  event_ce006_2_01_s_67:
    speaker: rapunzel
    en: I'd like to track down that Com character.
    ko: 그 콤이라는 로봇 형제님을 추적했으면 해요.
    ja: コムというロボットを追いかけましょう。
  event_ce006_2_01_s_68:
    speaker: snowwhite
    en: "*Munch munch* Why's that?"
    ko: 어째서지?
    ja: なぜだ？
  event_ce006_2_01_s_69:
    speaker: rapunzel
    en: Snow White, may I remind you not to speak with your mouth full?
    ko: |-
      스노우 화이트.
      남이랑 얘기할 때 입 안에 음식은 다 삼키고 말해주세요.
    ja: |-
      スノーホワイト…
      口に物を入れたまま話さないでください。
  event_ce006_2_01_s_70:
    speaker: rapunzel
    en: "... Where did you even get all that food, anyway?"
    ko: "…근데 어디서 그렇게 볼이 빵빵해질 정도로 음식을 가져온 건가요?"
    ja: |-
      …ほっぺたが膨らむほどの食糧なんて、
      どこにあったのですか？
  event_ce006_2_01_s_71:
    speaker: snowwhite
    en: There was a big pile of it sitting here. It didn't seem to belong to anyone,
      so I went for it.
    ko: |-
      옆에 쌓여 있었다.
      주인 없는 음식인 것 같다.
    ja: |-
      隣に山積みにされていた。
      持ち主ももういないらしい。
  event_ce006_2_01_s_72:
    speaker: snowwhite
    en: There's plenty to go around, so help yourself.
    ko: 엄청 많다. 너도 먹어라.
    ja: 当分困らない量だ。全員で分けよう。
  event_ce006_2_01_s_73:
    speaker: rapunzel
    en: "... I'll apologize to Believer later."
    ko: "…형제님한테는 제가 따로 사과할게요."
    ja: "…ブラザーにはあとで私から謝っておきます。"
  event_ce006_2_01_s_74:
    speaker: hongryeon
    en: That would be best. But, pray tell, why dost thou wish to track down this
      robot?
    ko: |-
      그러는 게 좋겠네.
      헌데, 그 로봇은 어찌하여 추적하려 하는 겐가.
    ja: |-
      そうしておくれ。
      それはそうと、急いで追う必要があるのかね？
  event_ce006_2_01_s_75:
    speaker: rapunzel
    en: The data contained in that robot is over a hundred years old.
    ko: 100년 이상된 데이터가 있을 테니까요.
    ja: 100年以上昔のデータを持っているはずです。
  event_ce006_2_01_s_76:
    speaker: rapunzel
    en: Even if we personally can't find any use for it,
    ko: |-
      저희가 활용하지 못하더라도,
      방주에 큰 도움이 될 건 확실해요.
    ja: |-
      私たちには活用できなかったとしても、
      アークの役に立つことは間違いありません。
  event_ce006_2_01_s_77:
    speaker: rapunzel
    en: it would be of immense value to the Ark.
    ko: 제 입장에서는, 엄청 귀한 로봇 형제님인 셈이죠.
    ja: |-
      私が予想する限り、非常に価値のある
      ロボットでしょう。
  event_ce006_2_01_s_78:
    speaker: snowwhite
    en: Sounds like a reasonable argument to me. Let's track it.
    ko: |-
      타당한 이유인 것 같다.
      추적하지.
    ja: |-
      言いたいことは分かった。
      そうしよう。
  event_ce006_2_01_s_79:
    speaker: hongryeon
    en: Very well, let the pursuit be underway.
    ko: 그럽세.
    ja: 異論ない。
  event_ce006_2_01_s_80:
    speaker: rapunzel
    en: I want to stay and help Believer, but we must hurry.
    ko: |-
      형제님을 돕고 싶지만,
      조금이라도 서두르는 게 좋겠어요.
    ja: |-
      ブラザーをお助けしたい気持ちはありますが、
      少しでも急いだ方がいいでしょう。
  event_ce006_2_01_s_81:
    speaker: snowwhite
    en: Don't worry, he can take care of himself.
    ko: |-
      그 녀석이라면 알아서 할 거다.
      걱정할 필요는 없다.
    ja: |-
      あいつなら自分で解決できる。
      心配はない。
  event_ce006_2_01_s_82:
    speaker: hongryeon
    en: That's right. He has things under control.
    ko: |-
      맞는 말일세.
      알아서 잘할 테지.
    ja: |-
      そうだねえ。
      この場は任せるとしよう。
  event_ce006_2_01_s_83:
    speaker: hongryeon
    en: Although, there is something that makes my soul grow restless.
    ko: "…헌데 하나 신경 쓰이는 것이 있네만…."
    ja: "…一つ、気になることがあるとすれば…"
  event_ce006_2_01_s_84:
    speaker: hongryeon
    en: I feel that I've laid mine eyes on that woman before.
    ko: 안에 있던 낯선 낭자를 어디선가 본 기억이….
    ja: |-
      中で見かけたお嬢ちゃんだ。
      どこかで見たような…
  event_ce006_2_01_s_85:
    speaker: ce006_01
    en: Are you talking about me?
    ko: 날 말하는 거야?
    ja: 私のこと？
  event_ce006_2_01_s_86:
    speaker: hongryeon
    en: Egads! How long have you been following us?
    ko: 이런. 언제 따라 나온 겐가.
    ja: おや、聞かれていたか。
  event_ce006_2_01_s_87:
    speaker: ce006_01
    en: I have a feeling that I've met you before too.
    ko: 나도 너를 어디선가 만났던 것 같은 기분이 들어서.
    ja: 私もどこかであなたと会ったような気がして。
  event_ce006_2_01_s_88:
    speaker: hongryeon
    en: You do?
    ko: "…낭자도?"
    ja: "…お嬢ちゃんもかい？"
  event_ce006_2_01_s_89:
    speaker: ce006_01
    en: Yes, although I can't pinpoint it.
    ko: 응. 확실하진 않지만….
    ja: ええ。ぼんやりとだけど…
  event_ce006_2_01_s_90:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_91:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_92:
    speaker: hongryeon
    en: Dost thou utilize a blade?
    ko: 검을 다루는가.
    ja: エモノは剣か。
  event_ce006_2_01_s_93:
    speaker: ce006_01
    en: Indeed I do. And you seem to as well.
    ko: 맞아. 너도 검을 쓰는 것 같네.
    ja: ええ。そういうあなたも。
  event_ce006_2_01_s_94:
    speaker: hongryeon
    en: No wonder. I desired to unsheathe Fleetly Fading as soon as I saw you.
    ko: 역시. 어쩐지 화무십일홍의 손잡이를 그렇게나 잡고 싶더라니.
    ja: やはりな。どうりで花無十日紅に手が伸びる。
  event_ce006_2_01_s_95:
    speaker: hongryeon
    en: Well then, shall we have a duel? What does thou say to that?
    ko: 어떤가. 좀 어울려주겠나?
    ja: どうかね？ひとつ手合わせ願えるかい…？
  event_ce006_2_01_s_96:
    speaker: rapunzel
    en: Scarlet.
    ko: 홍련.
    ja: 紅蓮。
  event_ce006_2_01_s_97:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_98:
    speaker: hongryeon
    en: Very well. My excitement got the best of me.
    ko: |-
      아아.
      이거 내가 너무 신난모양이군.
    ja: |-
      そうだな。
      私としたことが、気をはやらせてしまった。
  event_ce006_2_01_s_99:
    speaker: hongryeon
    en: We have urgent matters to attend to, so we'll have to resume this at a later
      date.
    ko: |-
      나중을 기약하세.
      지금은 급한 일이 있으니.
    ja: |-
      いつか時が来るのを楽しみにしよう。
      今は急ぐのでな。
  event_ce006_2_01_s_100:
    speaker: ce006_01
    en: Do you need to leave right now?
    ko: 지금 바로 가는 거야?
    ja: 今すぐ出発するの？
  event_ce006_2_01_s_101:
    speaker: hongryeon
    en: I believe so, verily.
    ko: 그렇게 된 듯하네.
    ja: そのようだ。
  event_ce006_2_01_s_102:
    speaker: rapunzel
    en: Sister, please inform Believer that time is of the essence,
    ko: |-
      낯선 자매님.
      형제님한테는 잘 전해주세요.
    ja: |-
      見知らぬ同胞様、
      ブラザーによろしくお伝えください。
  event_ce006_2_01_s_103:
    speaker: rapunzel
    en: and so we left in a hurry.
    ko: 서둘러야 해서, 먼저 가본다고요.
    ja: 時を争うことがあり、失礼いたします。
  event_ce006_2_01_s_104:
    speaker: ce006_01
    en: Okay, I'll relay the message.
    ko: 알겠어. 잘 전할게.
    ja: 分かった。任せて。
  event_ce006_2_01_s_105:
    speaker: hongryeon
    en: See you around.
    ko: 또 보세.
    ja: また会おう。
  event_ce006_2_01_s_106:
    speaker: hongryeon
    en: Next time, you and I shall have a proper palaver.
    ko: 그땐… 느긋하게 [대화]를 나눌 수 있으면 좋겠네.
    ja: |-
      その時は…存分に「語り合い」を
      楽しみたいものだ。
  event_ce006_2_01_s_107:
    speaker: ce006_01
    en: "... Okay."
    ko: "…그래."
    ja: "…そうね。"
  event_ce006_2_01_s_108:
    speaker: ce006_01
    en: They all left to track down Com.
    ko: "…그렇게 셋은 콤을 추적하러 떠났어."
    ja: "…それで、3人はコムを追って行ったの。"
  event_ce006_2_01_s_109:
    speaker: privaty
    en: Wait a second.
    ko: 어… 잠깐만요.
    ja: あの…ちょっと待ってください。
  event_ce006_2_01_s_110:
    speaker: privaty
    en: From the way you described them, it sounds like the people who saved Roam
      and me were Pilgrims.
    ko: |-
      말씀하시는 인상착의를 들어보니까,
      저랑 롬을 구해준 게 필그림 같은데 맞나요?
    ja: |-
      話を聞いた限り、私とロムを救出したのは
      ピルグリムだったのではありませんか？
  event_ce006_2_01_s_111:
    speaker: "<Self>"
    en: "... Perhaps."
    ko: "…맞을걸."
    ja: "…そうだな"
  event_ce006_2_01_s_112:
    speaker: privaty
    en: What a rare opportunity!
    ko: 아… 이런… 좋은 기회를….
    ja: くっ…なんてこと…またとないチャンスを…
  event_ce006_2_01_s_113:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_s_114:
    speaker: privaty
    en: Oh well. I suppose there are more urgent things at play now than a few Pilgrims.
    ko: |-
      어쩔 수 없죠.
      지금은 필그림보다 더 급한 게 있으니까.
    ja: |-
      仕方ありません。
      今はピルグリムよりもこちらが優先です。
  event_ce006_2_01_s_115:
    speaker: privaty
    en: I'll go contact command.
    ko: 그럼 저는 상부에 연락해 볼게요.
    ja: 言った通り、私は上層部に連絡します。
  event_ce006_2_01_s_116:
    speaker: privaty
    en: The rest of you go investigate the ground floor.
    ko: 여러분은 1층 문 너머를 조사해 주세요.
    ja: みなさんは、扉の奥を調査してください。
  event_ce006_2_01_s_117:
    speaker: "<Self>"
    en: Will do. Thanks for the help, Privaty.
    ko: 알겠어. 맡길게.
    ja: 分かった、頼む
  event_ce006_2_01_s_118:
    speaker: privaty
    en: Sure thing.
    ko: 예. 맡겨주세요.
    ja: はい、お任せください。
event_ce006_2_01_e:
  event_ce006_2_01_e_1:
    speaker: "<Narration>"
    en: "*Thunk thunk thunk*"
    ko: 텅- 텅- 텅-
    ja: カン、カン、カン――
  event_ce006_2_01_e_2:
    speaker: "<Monologue>"
    en: After descending a long flight of stairs underneath the door, we enter into
      a vast, empty space.
    ko: |-
      우리는 문 아래에 나있는 계단을 한참 내려온 후,
      넓은 공간 안으로 들어왔다.
    ja: |-
      扉の奥は階段がしばらく続き、
      やがて私たちは広々とした空間にたどりついた
  event_ce006_2_01_e_3:
    speaker: "<Monologue>"
    en: The sound of our footsteps echoes throughout the surroundings,
    ko: 바닥을 걷는 소리가 공간 전체에 울려 퍼진다.
    ja: 足音がよく響く
  event_ce006_2_01_e_4:
    speaker: "<Monologue>"
    en: which are dark and damp.
    ko: 주위는 어둡고 습하다.
    ja: 周囲は暗く、湿度を感じる
  event_ce006_2_01_e_5:
    speaker: "<Monologue>"
    en: Only a few scattered lights illuminate the interior.
    ko: 몇몇 군대에 있는 조명만이 내부를 밝히고 있다.
    ja: わずかな照明だけがあたりを照らしていた
  event_ce006_2_01_e_6:
    speaker: elegg
    en: Where do you think the power is coming from?
    ko: "…여기 전력은 어디서 끌어오는 걸까여?"
    ja: |-
      …電力はどこから引っ張ってきて
      いるのでしょうかな？
  event_ce006_2_01_e_7:
    speaker: ce006_03
    en: I'm not sure, but judging by how dimly lit this place is, I'd wager it's a
      pretty basic generator.
    ko: 글쎄요. 딱 봐도 풍족해 보이는 느낌은 아니라서 간이 발전기 같은 것일지도 모르겠어요.
    ja: |-
      さあ…どうみても十分って感じはないし
      簡易発電機がどこにあるのかも…
  event_ce006_2_01_e_8:
    speaker: elegg
    en: It doesn't seem like it's being drawn from the city.
    ko: "…위에 도시에서 끌어오는 것 같진 않져?"
    ja: "…上の都市からの電力ではありませんな？"
  event_ce006_2_01_e_9:
    speaker: ce006_03
    en: No. I don't see anything on the walls or ceiling that seems to be supplying
      electricity.
    ko: 예. 벽면이고 천장이고 전기를 끌어올만한 건 안 보이네요.
    ja: |-
      そうですね。壁にも天井にも、
      外から引き込んでいるようなものが
      見当たらないですし。
  event_ce006_2_01_e_10:
    speaker: elegg
    en: Okay, good. I was getting worried that I was the only one who thought that.
    ko: |-
      휴…. 다행이네여.
      저만 그렇게 보이는 줄 알았어여.
    ja: |-
      ふぅ…安心しましたな。
      そう考えているのは私だけかと思いましたぞ。
  event_ce006_2_01_e_11:
    speaker: "<Monologue>"
    en: Torn pieces of fabric, fragments of wood, and scattered stones lie all over
      the floor.
    ko: 찢긴 천, 부서진 나무 조각과 돌덩이들이 곳곳에 굴러다녔고
    ja: |-
      破れた布、木や石の断片が
      あちこちに転がっている
  event_ce006_2_01_e_12:
    speaker: "<Monologue>"
    en: In the corner, there are makeshift beds, blankets, and simple utensils which
      seem to indicate the area is, or was, inhabited.
    ko: |-
      구석에는 간이침대와 이불,
      간단한 식기들로 인해 생활감이 묻어난다.
    ja: |-
      片隅に簡易ベッドとシーツ、
      簡素な食器が放置されていた。
      生活の痕跡が残っている
  event_ce006_2_01_e_13:
    speaker: "<Monologue>"
    en: On one side of the wall rests a pile of canned food and water containers which
      are half empty.
    ko: |-
      한쪽 벽면에 쌓여있는 통조림과 식수통은,
      절반 이상이 비어져 있었다.
    ja: |-
      壁際に積み上げられた缶詰と水は、
      半分以上が空のようだ
  event_ce006_2_01_e_14:
    speaker: ce006_npc_01
    en: Seems like whoever is down here at least had the basics needed to survive.
    ko: 생존에는 딱히 문제는 없었나 보군.
    ja: 生きていける環境ではあるのか。
  event_ce006_2_01_e_15:
    speaker: ce006_01
    en: It's awfully quiet though. Do you think that old man is living here alone?
    ko: |-
      그런데 너무 조용해.
      좀 전의 그 노인만 계속 여기 살았던 걸까?
    ja: |-
      それにしては静かすぎる。
      いるのは、さっきのあの老人だけ？
  event_ce006_2_01_e_16:
    speaker: ce006_npc_01
    en: There's more than one bed, so I'd say probably not.
    ko: 글쎄. 침대로 보이는 게 몇 개는 있는 걸 보니 그렇진 않았던 것 같네.
    ja: |-
      どうだろう。ベッドに見えるものは
      いくつかあるが。
  event_ce006_2_01_e_17:
    speaker: ce006_npc_01
    en: Or at least, he wasn't originally.
    ko: 더 있거나, 더 있었거나 둘 중 하나겠지.
    ja: 他にもいるのか、いたのか、どちらかだろう。
  event_ce006_2_01_e_18:
    speaker: anis
    en: Rapi, you see those things standing there?
    ko: "…라피. 여기 세워져 있는 이것들."
    ja: "…ラピ。ここに立ってるもの…"
  event_ce006_2_01_e_19:
    speaker: anis
    en: What do you think they are?
    ko: 뭔 것 같아?
    ja: 何だと思う？
  event_ce006_2_01_e_20:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_e_21:
    speaker: "<Monologue>"
    en: Scattered around the area are massive rectangular objects which take up no
      small amount of space.
    ko: 벽면은 물론, 바닥 곳곳에 우뚝 서 있는 거대한 사각형의 뭔가가 공간을 가득 채우고 있다.
    ja: |-
      壁を埋め尽くすように、
      そして床からそびえたつように、
      巨大な角柱が無数に並んでいる
  event_ce006_2_01_e_22:
    speaker: "<Monologue>"
    en: Based on the faint warmth and sounds they're emitting, they almost seem to
      be...
    ko: 약한 온기가 느껴지고 소리가 들리는 것으로 봐선….
    ja: それらはわずかに暖かく、音を立てていた
  event_ce006_2_01_e_23:
    speaker: rapi
    en: They're definitely machines of some kind. Although I'm not sure what they're
      used for.
    ko: |-
      기계인 건 확실해.
      어디에 사용하는 것인지는 모르겠지만.
    ja: |-
      機械であることは間違いないわ。
      何のためのものかは分からないけれど。
  event_ce006_2_01_e_24:
    speaker: neon
    en: They remind me of tombstones.
    ko: 꼭… 묘비 같네요.
    ja: なんだか…お墓みたいですね。
  event_ce006_2_01_e_25:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_e_26:
    speaker: "<Monologue>"
    en: As we continue exploring, something catches our attention.
    ko: 문 너머 공간을 둘러보던 우리의 시선을 뭔가가 사로잡았다.
    ja: |-
      調査を続けていた私たちの目が、
      ある一点で止まった
  event_ce006_2_01_e_27:
    speaker: "<Monologue>"
    en: A small altar, atop which lie countless lit candles standing in puddles of
      melted wax.
    ko: 작은 단상. 수많은 촛불과 녹아내린 촛농.
    ja: |-
      小さな壇上に無数の
      溶けかけたロウソクが立てられている
  event_ce006_2_01_e_28:
    speaker: "<Monologue>"
    en: It's by far the most brightly lit area amongst the otherwise crushing darkness.
    ko: 어두운 공간에서 가장 밝은 곳.
    ja: 暗闇の中でその明るさはひときわ目を引いた
  event_ce006_2_01_e_29:
    speaker: "<Monologue>"
    en: Framed pictures of smiling people are placed on the altar as well,
    ko: 웃고 있는 사람들의 액자들이 놓여있었기에
    ja: 笑顔の人々の写真を照らすロウソクの火は…
  event_ce006_2_01_e_30:
    speaker: "<Monologue>"
    en: making it resemble a shrine for the deceased.
    ko: 그곳은 마치 죽은 이들을 기리는 제단처럼 보였다.
    ja: |-
      そこに写っているのがすでに故人であることを
      物語るようだった
  event_ce006_2_01_e_31:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_e_32:
    speaker: "<Monologue>"
    en: EVE walks over quietly and stops in front of it.
    ko: 이브는 말없이 걸어가 그 앞에 멈춰 섰다.
    ja: イヴが何も言わず、前に歩み出た
  event_ce006_2_01_e_33:
    speaker: "<Monologue>"
    en: After gazing at the shrine for a long time, she reaches out.
    ko: |-
      한참 동안 [제단]을 바라보던 이브는,
      천천히 손을 앞으로 뻗었다.
    ja: |-
      しばらく「祭壇」を眺めていたイヴは、
      ゆっくりと手を前に伸ばし…
  event_ce006_2_01_e_34:
    speaker: oldman_h
    en: Greetings.
    ko: 안녕하십니까.
    ja: 先ほどは失礼しました。
  event_ce006_2_01_e_35:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_e_36:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_e_37:
    speaker: neon
    en: You scared me!
    ko: 지, 진짜 놀랐어요.
    ja: び、びっくりしました…
  event_ce006_2_01_e_38:
    speaker: anis
    en: M-me too.
    ko: 나, 나도.
    ja: 私も…
  event_ce006_2_01_e_39:
    speaker: oldman_h
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_01_e_40:
    speaker: hermin
    en: Nice to meet you. I'm Hermin.
    ko: 반갑습니다. 헤르민이라고 합니다.
    ja: 改めてごあいさつを。ヘルミンと申します。
  event_ce006_2_01_e_41:
    speaker: hermin
    en: I'm but a humble artist who has been watching over this place.
    ko: 이곳을… 지키고 있던 보잘것없는 예술가죠.
    ja: この場を守ってきた…しがない芸術家です。
event_ce006_2_02_s:
  event_ce006_2_02_s_1:
    speaker: hermin
    en: I'm sorry if I startled you.
    ko: "…미안합니다."
    ja: "…申し訳ありません。"
  event_ce006_2_02_s_2:
    speaker: hermin
    en: It's been so long since I've seen any other beings, human or Nikke,
    ko: |-
      너무 오랜만에 살아있는 사람과 니케를 봐서
      나이를 생각하지 못하고 흥분해 버렸어요.
    ja: |-
      生きている人間やニケを見たのは久々で、
      年がいもなく興奮してしまいまして。
  event_ce006_2_02_s_3:
    speaker: hermin
    en: that I forgot how shocking my appearance might be.
    ko: 놀라셨다면, 다시 사과드립니다.
    ja: 驚かせてしまい、本当に失礼しました。
  event_ce006_2_02_s_4:
    speaker: "<Self>"
    en: It's all right.
    ko: 아니. 저희는 괜찮습니다.
    ja: いえ、気にしないでください
  event_ce006_2_02_s_5:
    speaker: "<Self>"
    en: Are you okay, though? You don't seem well.
    ko: 몸이 안 좋아 보이시는데, 괜찮으신가요?
    ja: 体調がよろしくないようですが、大丈夫ですか？
  event_ce006_2_02_s_6:
    speaker: hermin
    en: Hehe, this body of mine is on its last legs.
    ko: 허허. 언제 죽어도 이상하지 않을 몸입니다.
    ja: ははは…いつ死んでもおかしくない体です。
  event_ce006_2_02_s_7:
    speaker: hermin
    en: I might be nearing the end of the line, but I can still speak.
    ko: 괜찮지는 않지만, 얘기 정도는 가능합니다.
    ja: |-
      健康とは言えませんが、
      話をするぐらいはできます。
  event_ce006_2_02_s_8:
    speaker: machinesound
    en: Time for fluid intake.
    ko: 수분을 섭취할 시간입니다.
    ja: 水分を摂取してください。
  event_ce006_2_02_s_9:
    speaker: hermin
    en: Oh, excuse me for one moment.
    ko: 아아… 잠시 실례하겠습니다.
    ja: ああ… ちょっと失礼。
  event_ce006_2_02_s_10:
    speaker: "<Monologue>"
    en: Hermin takes a drink of water from a cup outfitted on the handle of his wheelchair.
    ko: 헤르민이 손잡이에 있는 물을 마신다.
    ja: |-
      ヘルミンは手押しハンドルに置かれていた
      容器を口に運んだ
  event_ce006_2_02_s_11:
    speaker: elegg
    en: A medical assistance wheelchair. It's rather old, but the craftsmanship is
      impressive.
    ko: |-
      …의료 보조용 휠체어네여.
      연식은 엄청 오래되어 보이는데, 완성도가 높아 보여여.
    ja: |-
      …医療介護用の車椅子ですな。
      かなり古そうですが、完成度は高い様子…
  event_ce006_2_02_s_12:
    speaker: elegg
    en: It seems like an early prototype for the modern ones we use in the Ark.
    ko: |-
      지금 방주에서 사용하는 의료 보조용 휠체어 있져?
      그것들의 프로토타입에 가까운 물건 같아여.
    ja: |-
      現在アークで使われているものに近い…？
      プロトタイプと言ってもよさそうですな。
  event_ce006_2_02_s_13:
    speaker: hermin
    en: "*Cough cough*"
    ko: 쿨럭, 쿨럭.
    ja: ゴホ、ゴホッ…
  event_ce006_2_02_s_14:
    speaker: hermin
    en: I'm sor... *Cough*
    ko: 으음…! 죄송합… 쿨럭.
    ja: うぐ…！失礼…ゴホッ。
  event_ce006_2_02_s_15:
    speaker: "<Self>"
    en: Take your time.
    ko: 천천히 하셔도 됩니다.
    ja: ゆっくりで大丈夫です
  event_ce006_2_02_s_16:
    speaker: hermin
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  event_ce006_2_02_s_17:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_s_18:
    speaker: hermin
    en: Well... I don't exactly know where to start, so if you have any questions,
      feel free to ask.
    ko: |-
      그래… 어디서부터 얘기해야 할지 감이 오지 않으니,
      궁금한 게 있으면 말씀 주세요.
    ja: |-
      そうですね…何から話せばいいものか。
      聞きたいことをおっしゃってください。
  event_ce006_2_02_s_19:
    speaker: rapi
    en: Are you a human?
    ko: "…당신은, 인간입니까?"
    ja: "…あなたは、人間？"
  event_ce006_2_02_s_20:
    speaker: hermin
    en: Yes, I'm a human.
    ko: |-
      예. 그렇습니다.
      저는 인간이에요.
    ja: |-
      ええ。その通り。
      私は人間です。
  event_ce006_2_02_s_21:
    speaker: hermin
    en: You of all people should know that there's no such thing as male Nikkes.
    ko: 아시겠지만 남성 니케는 존재할 수 없으니까요.
    ja: |-
      ご存じでしょうが、
      男性のニケはおりませんから。
  event_ce006_2_02_s_22:
    speaker: neon
    en: Uh... may I ask how old you are?
    ko: 저, 혹시 나이가….
    ja: 失礼ですが、お年は…
  event_ce006_2_02_s_23:
    speaker: hermin
    en: I'm not sure.
    ko: 글쎄요….
    ja: さあ…
  event_ce006_2_02_s_24:
    speaker: hermin
    en: If I had to guess... around 145?
    ko: "…140 중반쯤… 된 것 같군요."
    ja: "…140代中盤ぐらい…でしょうか。"
  event_ce006_2_02_s_25:
    speaker: anis
    en: Wow.
    ko: 우와….
    ja: ええっ…
  event_ce006_2_02_s_26:
    speaker: hermin
    en: Hehe, it sounds funny saying it out loud like that.
    ko: 허허. 이거 입 밖으로 내니 기분이 참….
    ja: |-
      ははは…口にしてみると
      何ともいえない気分ですね…
  event_ce006_2_02_s_27:
    speaker: neon
    en: You're like... uber old.
    ko: 슈퍼 할아버지시네요.
    ja: スーパーおじいさんですね。
  event_ce006_2_02_s_28:
    speaker: anis
    en: For goodness sake, Neon. Watch what you say.
    ko: 야, 너 좀….
    ja: ちょっと、ネオン…
  event_ce006_2_02_s_29:
    speaker: hermin
    en: Hehe, it's all right. I suppose I have aged quite a bit.
    ko: |-
      허허. 괜찮습니다.
      새삼 나이를 많이 먹긴 했군요.
    ja: |-
      ははは。構いませんよ。
      ずいぶん年を取ってしまいました。
  event_ce006_2_02_s_30:
    speaker: rapi
    en: Have you ever taken Evergreen?
    ko: "…이터널 라이프를 주입하신 적이 있습니까?"
    ja: "…エターナルライフの投与を受けたことは？"
  event_ce006_2_02_s_31:
    speaker: hermin
    en: Yes, I was lucky enough to receive it multiple times.
    ko: |-
      예에….
      운이 좋아 수차례 맞았습니다.
    ja: |-
      ええ…
      何度か使ったことがあります。
  event_ce006_2_02_s_32:
    speaker: hermin
    en: But when I stopped taking it, my aging resumed, as you can tell by my current
      state.
    ko: 주입을 중단하자 노화가 진행되어서, 지금은 이렇게 되었죠.
    ja: |-
      それがなくなった後で老化が進み…
      今に至るというわけです。
  event_ce006_2_02_s_33:
    speaker: anis
    en: When did you first arrive in this place?
    ko: "…언제… 여기 들어온 거야."
    ja: "…いつから…ここにいるの？"
  event_ce006_2_02_s_34:
    speaker: hermin
    en: I came in here when I was in my 40s,
    ko: 40대쯤 들어왔으니….
    ja: あの時はたしか40代だったので…
  event_ce006_2_02_s_35:
    speaker: hermin
    en: so I suppose it's been over 100 years.
    ko: 꼬박 100년이 넘었군요.
    ja: 100年ぐらい前です。
  event_ce006_2_02_s_36:
    speaker: anis
    en: And you've been here that entire time?
    ko: 계속 여기 있었던 거야? 100년 동안?
    ja: ずっとここにいたの？100年間も？
  event_ce006_2_02_s_37:
    speaker: hermin
    en: Pretty much.
    ko: 그런 셈이죠.
    ja: そうですね。
  event_ce006_2_02_s_38:
    speaker: hermin
    en: I came here not long
    ko: 랩쳐 침공이 있고 얼마 안 지나서 이곳으로 왔으니….
    ja: |-
      ラプチャーの侵略が始まって、
      そう間もない頃に来たので…
  event_ce006_2_02_s_39:
    speaker: hermin
    en: after the Rapture invasion.
    ko: 이곳에서 100년 가까이 지낸 셈이겠네요.
    ja: ここで100年近く過ごしたことになります。
  event_ce006_2_02_s_40:
    speaker: anis
    en: No way... how is that even possible?
    ko: "…말도 안 돼. 어떻게 그런 일이…."
    ja: "…ウソでしょ。そんなことって…"
  event_ce006_2_02_s_41:
    speaker: hermin
    en: This place was built to last.
    ko: 애초에 100년 이상 버틸 목적으로 만들어진 곳입니다.
    ja: |-
      そもそも、100年以上耐えられるように
      作られた場所ですから。
  event_ce006_2_02_s_42:
    speaker: hermin
    en: It's an incredibly sturdy construction, so that's why I've been able to survive
      here for as long as I have.
    ko: 생각보다 잘 만들어져서, 지금까지 버틸 수 있었던 거겠죠.
    ja: |-
      今まで耐えたのなら、思ったより
      うまくできていたということでしょう。
  event_ce006_2_02_s_43:
    speaker: rapi
    en: But why did you stay here the entire time? Why not leave and go somewhere
      else?
    ko: "…어째서 계속 여기에…."
    ja: "…なぜこんな場所でずっと…"
  event_ce006_2_02_s_44:
    speaker: hermin
    en: The entrance was blocked.
    ko: 입구가 막혀버렸으니까요.
    ja: 出入口が塞がれていましたから。
  event_ce006_2_02_s_45:
    speaker: hermin
    en: I couldn't get out even if I wanted to.
    ko: 나가고 싶어도 나갈 수가 없었죠.
    ja: ここを出る方法がありませんでした。
  event_ce006_2_02_s_46:
    speaker: hermin
    en: Thanks to you all, however, I was finally able to feel the sunlight again.
    ko: 여러분 덕에, 오랜만에 햇빛을 볼 수 있어서 다행입니다.
    ja: |-
      みなさんのおかげで、久しぶりに
      外の光を見ることができました。
  event_ce006_2_02_s_47:
    speaker: neon
    en: Did you come here to stay hidden from the Raptures? This place feels like
      a bunker.
    ko: |-
      그럼 랩쳐의 공격을 피해서 이곳으로 오신 건가요?
      여기 벙커 같아서요.
    ja: |-
      じゃあ、ラプチャーの攻撃から逃げて
      ここへ来たんですか？
      頑丈なシェルターみたいですが。
  event_ce006_2_02_s_48:
    speaker: hermin
    en: You're right, it is a bunker.
    ko: |-
      맞습니다.
      이곳은 벙커지요.
    ja: その通り…ここはシェルターです。
  event_ce006_2_02_s_49:
    speaker: rapi
    en: For a bunker, the facilities are a bit meager. There's only the bare minimum
      needed here to survive.
    ko: 벙커 치고는 생활에 필요한 것은 최소한으로 구비되어 있습니다.
    ja: |-
      それにしては、生活に必要なものが
      最低限とはいえそろっているようね。
  event_ce006_2_02_s_50:
    speaker: hermin
    en: That's because it was built for a special purpose.
    ko: 좀 더 특별한 목적으로 지어진 벙커니까요.
    ja: 特別な目的のあるシェルターでしたから。
  event_ce006_2_02_s_51:
    speaker: rapi
    en: And what is that?
    ko: 특별한 목적이라면 어떤 것입니까.
    ja: 特別な目的とは、どのような？
  event_ce006_2_02_s_52:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_s_53:
    speaker: hermin
    en: The purpose was...
    ko: 목적….
    ja: 目的…
  event_ce006_2_02_s_54:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_s_55:
    speaker: hermin
    en: was...
    ko: "…무엇을."
    ja: "…何の…"
  event_ce006_2_02_s_56:
    speaker: hermin
    en: We came here to...
    ko: "…무엇을… 위해… 우리는… 이곳에…."
    ja: "…何の…ために…私たちは…ここへ…"
  event_ce006_2_02_s_57:
    speaker: hermin
    en: For preservation... for our works to...
    ko: 아아… 그래… 지키기 위해… 보존하고… 후대에… 넘겨주기 위해….
    ja: |-
      ああ…そうだ…守るため…
      保存し…後世に…残すため…
  event_ce006_2_02_s_58:
    speaker: hermin
    en: pass on... to the future.
    ko: 우리의… 작품을….
    ja: 我々の…作品を…
  event_ce006_2_02_s_59:
    speaker: rapi
    en: So this place was intended to pass down your work to future generations?
    ko: "…작품을 넘겨주기 위해서…?"
    ja: "…作品を残すため…？"
  event_ce006_2_02_s_60:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_s_61:
    speaker: hermin
    en: Did you discover anything beyond that door,
    ko: "…혹시."
    ja: "…つかぬことをお聞きしますが…"
  event_ce006_2_02_s_62:
    speaker: hermin
    en: by any chance?
    ko: 문 너머에서 뭔가를 발견하진 못 했나요?
    ja: 扉の外側に、何かありませんでしたか？
  event_ce006_2_02_s_63:
    speaker: "<Self>"
    en: There were the corpses of three Nikkes.
    ko: "…니케 셋의 시체가 있었습니다."
    ja: "…ニケ3名の遺体がありました"
  event_ce006_2_02_s_64:
    speaker: "<Self>"
    en: Do you know anything about that?
    ko: 이것에 대해 아시는 게 있나요?
    ja: 何かご存じですか？
  event_ce006_2_02_s_65:
    speaker: hermin
    en: Three bodies?
    ko: "……셋."
    ja: "…3名。"
  event_ce006_2_02_s_66:
    speaker: hermin
    en: Ah, I see.
    ko: "…아아. 그렇군요."
    ja: "…ああ…そうでしたか。"
  event_ce006_2_02_s_67:
    speaker: hermin
    en: So...
    ko: 시체 셋.
    ja: 3名の…
  event_ce006_2_02_s_68:
    speaker: hermin
    en: they died...
    ko: 역시… 죽었나….
    ja: やはり…そうなったか…
  event_ce006_2_02_s_69:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_s_70:
    speaker: hermin
    en: Hehe... what fools.
    ko: 허허. 바보 같긴.
    ja: ははは…むなしい話だ。
  event_ce006_2_02_s_71:
    speaker: hermin
    en: Believing in such foolishness.
    ko: 그런 바보 같은 말을 믿다니… 허허허.
    ja: あんなばかげた話を信じて…はは…
  event_ce006_2_02_s_72:
    speaker: hermin
    en: Or maybe they had no choice?
    ko: 아닌가… 믿을 수밖에 없었나.
    ja: いや…信じるほかなかったのか。
  event_ce006_2_02_s_73:
    speaker: hermin
    en: No, that's also foolish.
    ko: 그 또한 바보 같구나.
    ja: それもまた、なんとむなしい…
  event_ce006_2_02_s_74:
    speaker: "<Self>"
    en: Did you know them?
    ko: "…아는 사이입니까?"
    ja: "…知っていたのですか？"
  event_ce006_2_02_s_75:
    speaker: hermin
    en: That shouldn't have happened.
    ko: 그때 그랬으면 안 됐어.
    ja: あんなことを…させるべきではなかった。
  event_ce006_2_02_s_76:
    speaker: hermin
    en: I could have stopped them.
    ko: 막았어야 했어.
    ja: 諦めるべきだったんだ。
  event_ce006_2_02_s_77:
    speaker: hermin
    en: What's the point of all this?!
    ko: 이딴것들이 다 뭐라고, 이딴것들이…!
    ja: こんなもの…何の価値が…！
  event_ce006_2_02_s_78:
    speaker: "<Monologue>"
    en: Hermin suddenly wheels himself forward.
    ko: 헤르민은 갑자기 휠체어를 몰아 이동했다.
    ja: ヘルミンが突然、車椅子を走らせた
  event_ce006_2_02_s_79:
    speaker: "<Monologue>"
    en: He rushes towards the towering tombstone-like machines,
    ko: 세워져 있던 묘비와 같던 검고 네모난 기계 쪽으로 다가갔다.
    ja: |-
      並びたつ墓碑のような
      黒く四角い機械群に猛然と突進していく
  event_ce006_2_02_s_80:
    speaker: "<Monologue>"
    en: and rams into one at full speed.
    ko: 그리고 속도를 줄이지 않고, 그대로 들이받았다.
    ja: 速度を落とすこともなく、そのまま衝突し…
  event_ce006_2_02_s_81:
    speaker: "<Monologue>"
    en: "... Or attempts to, rather."
    ko: 아니, 들이받으려 했다.
    ja: いや、衝突しようとした
  event_ce006_2_02_s_82:
    speaker: hermin
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_02_s_83:
    speaker: "<Monologue>"
    en: At one point when he rapidly changes direction,
    ko: 헤르민이 급하게 방향을 튼다.
    ja: ヘルミンが急に進行方向を変えた
  event_ce006_2_02_s_84:
    speaker: "<Monologue>"
    en: the wheelchair topples over and scrapes against the floor.
    ko: 중심을 잃은 휠체어가 넘어지며 바닥을 긁는다.
    ja: バランスを崩した車椅子は倒れ、床を転がった
  event_ce006_2_02_s_85:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-!
    ja: ガタン！
  event_ce006_2_02_s_86:
    speaker: "<Monologue>"
    en: Hermin is thrust from the wheelchair and lands on the floor.
    ko: 기계에 들이받던 헤르민이 휠체어에서 넘어진다.
    ja: 機械に体をぶつけ、ヘルミンが車椅子から落ちた
  event_ce006_2_02_s_87:
    speaker: hermin
    en: Urgh!
    ko: 흐으…! 흐으…!
    ja: はぁ…！はぁ…！
  event_ce006_2_02_s_88:
    speaker: machinesound
    en: Position abnormal. Position abnormal.
    ko: 위치 이상. 위치 이상.
    ja: 体勢異常。体勢異常。
  event_ce006_2_02_s_89:
    speaker: machinesound
    en: Request assistance from nearby personnel.
    ko: 주위에 도움을 요청하십시오.
    ja: 周囲の人に助けを求めてください。
  event_ce006_2_02_s_90:
    speaker: "<Monologue>"
    en: We rush over towards Hermin.
    ko: 우리는 서둘러 헤르민을 향해 달려갔다.
    ja: 私たちはあわててヘルミンに駆け寄った
event_ce006_2_02_e:
  event_ce006_2_02_e_1:
    speaker: hermin
    en: "... I'm sorry."
    ko: "…죄송합니다."
    ja: "…お恥ずかしい。"
  event_ce006_2_02_e_2:
    speaker: hermin
    en: My emotions got the best of me. I must be a disgraceful sight...
    ko: 감정이 격해져서… 추한 꼴을….
    ja: つい高ぶってしまい…お見苦しいところを…
  event_ce006_2_02_e_3:
    speaker: "<Self>"
    en: Don't worry about that. Are you okay?
    ko: 괜찮습니다. 상태는 어떠신가요?
    ja: 気にしないでください。身体は大丈夫ですか？
  event_ce006_2_02_e_4:
    speaker: hermin
    en: Yes. I've calmed down.
    ko: 예. 진정되었습니다.
    ja: ええ。おかげさまで落ち着きました。
  event_ce006_2_02_e_5:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_e_6:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_e_7:
    speaker: hermin
    en: This was a city made up of artists.
    ko: 이 도시는 예술가들의 도시였습니다.
    ja: ここは芸術都市として知られていました。
  event_ce006_2_02_e_8:
    speaker: hermin
    en: The residents here were free to let their creativity flow and to share their
      works amongst themselves and the public. As a result, this place was a popular
      tourist destination.
    ko: |-
      온갖 예술가들이 자유롭게 결과물을 만들어내고,
      서로, 혹은 사람들에게 공개하며 살아가는 일종의 관광 도시였죠.
    ja: |-
      様々な芸術家たちが自由な作品づくりに励み、
      仲間や世間に発表する場所だったのです。
  event_ce006_2_02_e_9:
    speaker: hermin
    en: It was revered as a sacred space where art lovers from all around could gather.
    ko: |-
      인지도가 굉장히 높았어요.
      예술을 사랑하는 수많은 이들이 모여드는 성지와도 같은 곳이었죠.
    ja: |-
      当時はかなり有名で、
      芸術を愛する多くの人々にとって
      聖地のような場所になっていました。
  event_ce006_2_02_e_10:
    speaker: hermin
    en: After the Rapture invasion, most of the residents were scattered every which
      way.
    ko: 랩쳐 침공 이후, 대부분은 뿔뿔이 흩어졌으나.
    ja: |-
      ですが、ラプチャーの侵攻が始まり、
      多くの住民がいなくなってしまいました。
  event_ce006_2_02_e_11:
    speaker: hermin
    en: But a few who were determined to pass on their work to future generations
      fought against the Raptures and tried to protect the artwork here.
    ko: |-
      예술을 보존하여 후대에 전해야 한다는 의지를 가진 몇몇이,
      도시에 남아 랩쳐에 맞서며 예술품들을 보존했습니다.
    ja: |-
      それでも文化を後世に残すべきだと考え
      決意を固めた一部の人々がこの地に残り、
      数々の芸術品を守ろうと抵抗しました。
  event_ce006_2_02_e_12:
    speaker: hermin
    en: I was one of them.
    ko: 저 역시… 그 사람들 중 한 명이었습니다.
    ja: 私もまた…そのうちの1人だったのです。
  event_ce006_2_02_e_13:
    speaker: hermin
    en: After moving all the artwork into the bunker I made, we fought with the Raptures
      for a long time.
    ko: |-
      제가 만든 벙커로 예술품들을 옮김과 동시에,
      오랫동안 랩쳐와 맞서 싸웠습니다.
    ja: |-
      シェルターを建設して芸術品を運びこみ、
      長い間ラプチャーと戦い続けました。
  event_ce006_2_02_e_14:
    speaker: hermin
    en: I sustained serious injuries in the fighting, and subsequently had to rely
      on these machines to live.
    ko: "…그때 입은 상처들 때문에, 기계의 신세를 지게 되었지요."
    ja: |-
      …その時に傷を負い、
      機械が無いと生きていけなくなりました。
  event_ce006_2_02_e_15:
    speaker: hermin
    en: Some Nikkes, moved by our cause, joined us.
    ko: 저희의 행동에 감명을 받은 몇몇의 니케들도 합류했습니다.
    ja: |-
      それから、私たちの行動に共感し
      戦いに加わったニケたちが現れました。
  event_ce006_2_02_e_16:
    speaker: hermin
    en: The United Forces of Humanity used this city for their propaganda.
    ko: 인류연합군은 이 도시를 프로파간다로 사용했습니다.
    ja: 人類連合軍にも大いに宣伝されていました。
  event_ce006_2_02_e_17:
    speaker: hermin
    en: They hailed us as artists who had taken up arms, and used our story to boost
      morale. In return for our cooperation, they offered us support.
    ko: "[무기를 든 예술가들]이라며 인류의 사기를 끌어올리는 용도로 사용했고, 지원도 아끼지 않았습니다."
    ja: |-
      「武器をとった芸術家たち」などと言われて…
      多くの支援を受けられもしましたが、
      人類の士気を上げる材料です。
  event_ce006_2_02_e_18:
    speaker: anis
    en: A fat lot of good that did.
    ko: "…결과가 뻔하네."
    ja: "…オチが見えてきたわね。"
  event_ce006_2_02_e_19:
    speaker: hermin
    en: One day, the UFH abruptly revoked all their support.
    ko: 어느 날, 인류연합군의 지원이 갑자기 끊어졌고
    ja: ある日突然、人類連合軍からの支援が途絶え…
  event_ce006_2_02_e_20:
    speaker: hermin
    en: It became impossible to transport all the physical art pieces to the bunker,
    ko: 버틸 수 없던 이들은 아직 벙커로 옮기지 못 한 예술품들의 자료를 백업하기 시작했습니다.
    ja: |-
      これ以上耐えられないと分かった時、
      シェルターに収められない芸術品を
      データとしてバックアップし始めました。
  event_ce006_2_02_e_21:
    speaker: hermin
    en: so we began backing them up digitally.
    ko: 실물을 모두 옮기는 건 불가능했으니까요.
    ja: 実物をすべて運びこむのは不可能でしたから。
  event_ce006_2_02_e_22:
    speaker: hermin
    en: People scanned blueprints and high-resolution images, made backups of programs,
      and more.
    ko: 설계도, 고해상도 이미지, 프로그램 등을 모두 백업했습니다.
    ja: |-
      図面、高精細の画像、プログラムなど…
      あらゆるデータを保存しました。
  event_ce006_2_02_e_23:
    speaker: rapi
    en: Then all these black machines must be...
    ko: "…그럼 여기에 묘비처럼 세워져 있는 검은 기계들이 전부…."
    ja: "…つまり、ここにある巨大な機械群はすべて…"
  event_ce006_2_02_e_24:
    speaker: hermin
    en: Massive storage terminals containing all that data.
    ko: 예. 그 데이터들이 모여있는 대용량 저장 장치입니다.
    ja: |-
      そうです。それが集積された
      大容量のデータ保存装置です。
  event_ce006_2_02_e_25:
    speaker: hermin
    en: They hold digital records of all the art ever created in this city.
    ko: 실물이 아니지만, 현재까지의 모든 예술품에 대한 자료가 모두 들어있다고 해도 과언이 아닙니다.
    ja: |-
      実物こそありませんが、
      当時までの芸術品の完全な記録が
      ここにあるといっても過言ではありません。
  event_ce006_2_02_e_26:
    speaker: anis
    en: And you've been here watching over them this whole time?
    ko: |-
      …그럼 할아버지는 설마,
      이걸 지키기 위해 여기서 계속 있었던 거야?
    ja: |-
      …じゃあ、つまり…
      それを守るためにずっとここにいたの？
  event_ce006_2_02_e_27:
    speaker: hermin
    en: That's right.
    ko: 그렇습니다.
    ja: その通りです。
  event_ce006_2_02_e_28:
    speaker: hermin
    en: I hoped that one day, rescue would come, but it never did.
    ko: 구조가 오면 좋았겠으나, 구조는 오지 않았습니다.
    ja: |-
      救助を待ち続けていましたが、
      それは叶いませんでした。
  event_ce006_2_02_e_29:
    speaker: hermin
    en: And I wasn't exactly in a position to be venturing out either.
    ko: 나갈 수 있는 상황도… 아니었고요.
    ja: 出られるような戦況でも…なかったでしょう。
  event_ce006_2_02_e_30:
    speaker: rapi
    en: So you've been here for over a century...
    ko: "…100년이 넘는 시간 동안, 여기서…."
    ja: "…100年以上もの間、この場所で…"
  event_ce006_2_02_e_31:
    speaker: anis
    en: What about the other humans that fought alongside you?
    ko: "…같이 싸웠다는 다른 인간들은?"
    ja: "…他の一緒に戦ってた人たちは？"
  event_ce006_2_02_e_32:
    speaker: hermin
    en: At first, they stayed here with me, but they all either died or left.
    ko: |-
      이곳에서 함께 지냈었습니다만….
      모두 죽거나 이곳을 벗어났죠.
    ja: |-
      ここでともに過ごしていましたが…
      みな寿命が尽きるか、いなくなったか…
  event_ce006_2_02_e_33:
    speaker: anis
    en: What happened to the three Nikkes outside? What's the story behind that welded
      door?
    ko: |-
      …바깥에 죽어있던 니케 셋은 어떻게 된 거야?
      용접된 문은 또 뭐고?
    ja: |-
      …外にいたニケたちは何？
      扉が溶接されてたのは？
  event_ce006_2_02_e_34:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_e_35:
    speaker: anis
    en: Why did you try to ram into one of these storage terminals?
    ko: 저장 장치에는 왜 들이받으려 한 건데?
    ja: なんでさっき、機械にぶつかろうとしたの？
  event_ce006_2_02_e_36:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_e_37:
    speaker: anis
    en: Are you okay?
    ko: "…? 괜찮아?"
    ja: "…？大丈夫？"
  event_ce006_2_02_e_38:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_02_e_39:
    speaker: anis
    en: Whoa, hey!
    ko: |-
      !!
      할아버지!
    ja: |-
      ！！
      生きてる！？
  event_ce006_2_02_e_40:
    speaker: "<Self>"
    en: He's fainted!
    ko: 이런! 정신을 잃었어!
    ja: まずい！意識不明だ！
  event_ce006_2_02_e_41:
    speaker: machinesound
    en: Physical condition severely compromised. Rest immediately.
    ko: |-
      쇠약 상태입니다.
      휴식을 취해주십시오.
    ja: |-
      衰弱しています。
      安静にしてください。
  event_ce006_2_02_e_42:
    speaker: anis
    en: Let's try and move him somewhere.
    ko: 이, 일단 어딘가로 옮기자!
    ja: と、とにかくどこかに運びましょ！
  event_ce006_2_02_e_43:
    speaker: elegg
    en: Lay him down!
    ko: 누, 눕혀여! 눕혀서…!
    ja: よ、横に！横に寝かせて…！
  event_ce006_2_02_e_44:
    speaker: hermin
    en: I-it's okay.
    ko: 괘, 괜찮습니다.
    ja: だ、大丈夫です。
  event_ce006_2_02_e_45:
    speaker: hermin
    en: I just need to rest for a moment.
    ko: 조금… 쉬면 괜찮아집니다.
    ja: 休めば…治ります。
  event_ce006_2_02_e_46:
    speaker: hermin
    en: I'm sorry, but I think we'll have to pick this conversation up later.
    ko: "…죄송합니다만 이야기는 여기까지 하죠."
    ja: "…申し訳ない。話はここまでにさせてください。"
  event_ce006_2_02_e_47:
    speaker: hermin
    en: You're free to take a look around.
    ko: 주위는 마음껏 둘러봐주셔도 됩니다.
    ja: 自由に見ていただいて構いません。
  event_ce006_2_02_e_48:
    speaker: hermin
    en: Just don't break anything, please.
    ko: 부수지만 말아주십시오.
    ja: 壊さないようにだけ、お願いします。
event_ce006_2_03_s:
  event_ce006_2_03_s_1:
    speaker: elegg
    en: The data in these terminals really is all pertaining to art. It's incredible
      how much is here.
    ko: |-
      저장 장치에 들어있는 건 정말 예술품 데이터네여.
      진짜 어마어마하게 많아여.
    ja: |-
      データの話は間違いないようですな。
      とてつもない量ですぞ。
  event_ce006_2_03_s_2:
    speaker: elegg
    en: I'm no art expert, but I'm pretty sure this is going to make waves.
    ko: |-
      저는 예술에 대해 잘 모르지만,
      이거 꽤 큰 파장을 일으킬 건 확실할 것 같아여.
    ja: |-
      芸術には詳しくありませぬが…
      大きな波紋を呼ぶことは
      間違いないでしょうな。
  event_ce006_2_03_s_3:
    speaker: elegg
    en: I can see the headline now, "Humanity's Artistry Once Lost, Found Once Again."
    ko: |-
      인류의 잃어버린 예술혼, 이곳에서 다시 태어나다.
      이런 제목 붙이기 최고지 않을까여?
    ja: |-
      今よみがえる、失われた人類の芸術と魂…
      そんなキャッチコピーはどうでしょうな？
  event_ce006_2_03_s_4:
    speaker: ce006_03
    en: Even if it's only in digitized form, it's remarkable how much has been preserved.
    ko: 비록 데이터긴 하지만 이런 게 전부 보존되어 있다니, 대단하네요.
    ja: |-
      データって言っても、
      何もかも記録されてるなんて…すごいね。
  event_ce006_2_03_s_5:
    speaker: elegg
    en: You think it'd be okay if I installed BOOM here?
    ko: 여기에 BOOM 깔면 좀 그럴까여?
    ja: |-
      さすがにBOOMのインストールは
      はばかられますかな？
  event_ce006_2_03_s_6:
    speaker: ce006_03
    en: Uh... I'm not sure what that is, but I have a feeling that you shouldn't.
    ko: 어… 그게 뭔진 잘 모르지만 하면 안 될 것 같은 느낌이 강하게 들어요.
    ja: |-
      えっと…それが何か知らないけど、
      ダメだと思います。
  event_ce006_2_03_s_7:
    speaker: elegg
    en: I guess you're right. Too bad.
    ko: 그렇져? 아쉽네여.
    ja: でしょうな？残念無念…
  event_ce006_2_03_s_8:
    speaker: ce006_03
    en: What's the condition of these terminals?
    ko: 저장 장치 상태는 어때요?
    ja: 保存装置の状態は？
  event_ce006_2_03_s_9:
    speaker: elegg
    en: Really good. I can't believe how well they've been maintained.
    ko: 굉장히 좋아여. 믿기지 않을 정도로 상태가 좋네여.
    ja: 信じられないほど良好ですぞ。
  event_ce006_2_03_s_10:
    speaker: elegg
    en: The bunker's power supply is mostly being used to keep these terminals up
      and running, so they're honestly in great shape.
    ko: 벙커의 자체 발전기 전력 대부분이 저장 장치를 보호하는데 쓰이고 있어여. 그래서 상태는 최상이에여.
    ja: |-
      シェルターの発電能力のほとんどが
      データ保全のために使われているようですな。
      その分、状態は最高と言えますぞ。
  event_ce006_2_03_s_11:
    speaker: elegg
    en: There is one thing that's bothering me though.
    ko: 그리고 신경 쓰이는 게 있는뎨….
    ja: それと、ひとつ気になるものが…
  event_ce006_2_03_s_12:
    speaker: elegg
    en: There seem to be recordings of the bunker's interior as well,
    ko: 벙커 내부를 녹화한 영상들이 있는 것 같아여.
    ja: |-
      シェルター内部の様子の
      記録らしきものがありますな。
  event_ce006_2_03_s_13:
    speaker: elegg
    en: but they stopped about 40 years ago.
    ko: 40년 전쯤에 멈추긴 했지만여.
    ja: ただ、40年ほど前に止まっている様子…
  event_ce006_2_03_s_14:
    speaker: ce006_03
    en: The data's not corrupted, is it?
    ko: 데이터가 망가지진 않은 것 같죠?
    ja: データは壊れてませんよね？
  event_ce006_2_03_s_15:
    speaker: elegg
    en: No, it's fine. Data itself doesn't decay organically.
    ko: 녜. 데이터는 풍화되지 않으니까여.
    ja: はい。データは劣化しておりませんな。
  event_ce006_2_03_s_16:
    speaker: ce006_03
    en: It must be that the hardware itself has aged and begun to deteriorate.
    ko: 그럼 역시 하드웨어가 노화되었을 가능성이 높겠네요.
    ja: |-
      じゃ、ハードウェアがダメになった可能性が
      高いかな。
  event_ce006_2_03_s_17:
    speaker: elegg
    en: I think so.
    ko: 아마도 그럴 거라 생각해여.
    ja: そのセンが濃いですな。
  event_ce006_2_03_s_18:
    speaker: ce006_03
    en: Do you think it can be fixed?
    ko: 고칠 수 있을까요?
    ja: 直せそうですか？
  event_ce006_2_03_s_19:
    speaker: elegg
    en: If you help me, absolutely.
    ko: 릴리 씨가 도와준다면여.
    ja: リリー氏のお力があれば。
  event_ce006_2_03_s_20:
    speaker: ce006_03
    en: All right then, let's give it a shot. I'll do what I can to help.
    ko: |-
      좋아요. 그럼 고쳐봐요.
      전력으로 도울게요.
    ja: |-
      じゃあ、直しましょう！
      全力で手伝います。
  event_ce006_2_03_s_21:
    speaker: elegg
    en: Hehe. Sounds good.
    ko: 히히. 좋아여.
    ja: ふひひっ。助かりますぞ！
  event_ce006_2_03_s_22:
    speaker: ce006_npc_01
    en: This plot certainly seems to be thickening.
    ko: 일이 좀 커지는 느낌인데.
    ja: 話が大きくなってきたな。
  event_ce006_2_03_s_23:
    speaker: ce006_01
    en: Indeed.
    ko: 그러게.
    ja: そうね。
  event_ce006_2_03_s_24:
    speaker: ce006_npc_01
    en: EVE, it's not that I disagree with what you're doing, but...
    ko: 이브. 네 생각에 반대하는 건 아니지만….
    ja: イヴ。お前の考えに反対するわけじゃないが…
  event_ce006_2_03_s_25:
    speaker: ce006_npc_01
    en: We do have our own things to do.
    ko: 우린 우리 할 일이 있어.
    ja: 俺たちにも俺たちのやるべきことがある。
  event_ce006_2_03_s_26:
    speaker: ce006_01
    en: I know, but I can't pretend as if I didn't see this and move on.
    ko: 알아. 그렇다고 해서 이 상황을 못 본 척 넘어갈 순 없어.
    ja: |-
      分かってる。でも、だからって
      この状況を放ってはおけない。
  event_ce006_2_03_s_27:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_28:
    speaker: ce006_npc_01
    en: What if it ends up taking some time to resolve?
    ko: 빠르게 해결되지 않으면?
    ja: 時間がかかるようならどうする？
  event_ce006_2_03_s_29:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_30:
    speaker: ce006_01
    en: We'll reconsider our approach if and when that time comes.
    ko: 그때 생각하자.
    ja: その時考えればいい。
  event_ce006_2_03_s_31:
    speaker: ce006_npc_01
    en: "... All right, fine. In the meantime, let's do what we can to help."
    ko: |-
      …뭐, 좋아.
      그렇게 하자.
    ja: |-
      …まあ、いい。
      そうするか。
  event_ce006_2_03_s_32:
    speaker: roam
    en: EVE, this is not your fight.
    ko: 이브. 이 일, 이브의 일 아니다.
    ja: イヴ。この仕事、イヴの仕事じゃない。
  event_ce006_2_03_s_33:
    speaker: roam
    en: Do you have nothing better to do?
    ko: 이브. 시간 많나?
    ja: イヴ。時間が余ってる？
  event_ce006_2_03_s_34:
    speaker: ce006_01
    en: Quite the opposite.
    ko: 시간이… 많진 않아.
    ja: 時間は…余ってはいない。
  event_ce006_2_03_s_35:
    speaker: roam
    en: Then are you looking for excitement?
    ko: 이브. 심심한가?
    ja: イヴ。タイクツか？
  event_ce006_2_03_s_36:
    speaker: ce006_01
    en: No.
    ko: 그것도 아냐.
    ja: それも違う。
  event_ce006_2_03_s_37:
    speaker: roam
    en: Are you expecting a reward?
    ko: 대가를 바라나?
    ja: 報酬に期待している？
  event_ce006_2_03_s_38:
    speaker: ce006_01
    en: Haha, not that, either.
    ko: 후후. 그건 아냐.
    ja: ふふ。それも違う。
  event_ce006_2_03_s_39:
    speaker: roam
    en: So you don't have much free time, aren't looking for excitement, and don't
      expect a reward.
    ko: 이브. 시간 없다. 심심하지 않다. 대가를 바라지도 않는다.
    ja: |-
      イヴ。時間もない。タイクツでもない。
      報酬にも期待していない。
  event_ce006_2_03_s_40:
    speaker: roam
    en: Why are you helping then?
    ko: 그런데 왜 도와주나?
    ja: それなら、なぜ手伝う？
  event_ce006_2_03_s_41:
    speaker: ce006_npc_01
    en: Beats me. This isn't the first time this has happened.
    ko: |-
      그러게 말이다.
      하루 이틀 일이 아냐.
    ja: |-
      そうだな。
      今になって始まったことじゃないが。
  event_ce006_2_03_s_42:
    speaker: ce006_01
    en: I can't explain it, but I just feel like I should.
    ko: "…잘 설명할 순 없지만, 그래야 할 것 같아서."
    ja: |-
      …うまく説明できないけど、
      そうするべきだと思ったから。
  event_ce006_2_03_s_43:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_2_03_s_44:
    speaker: roam
    en: You are sentimental.
    ko: 이브는 기분파.
    ja: イヴは気まぐれ。
  event_ce006_2_03_s_45:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_46:
    speaker: ce006_npc_01
    en: Ha! I like the cut of this robot's jib!
    ko: 하하. 이 로봇 친구는 맞는 말만 골라서 하는군.
    ja: ははは…よく分かってるな。
  event_ce006_2_03_s_47:
    speaker: roam
    en: Adam, you have not wiped off the black mold on your face. Would you like me
      to clean it off?
    ko: |-
      아담. 얼굴에 검은곰팡이 아직 안 지워졌다.
      롬이 지워줘도 되나?
    ja: |-
      アダム、顔の黒カビがまだ残ってる。
      ロムが掃除してもいいか？
  event_ce006_2_03_s_48:
    speaker: ce006_npc_01
    en: "... I take it back."
    ko: "…맞는 말만 한다는 건 취소야."
    ja: "…さっきの言葉は取り消しだ。"
  event_ce006_2_03_s_49:
    speaker: anis
    en: Can I speak my mind?
    ko: 솔직히 말해도 될까?
    ja: 正直に言ってもいい？
  event_ce006_2_03_s_50:
    speaker: neon
    en: Go on. Let's hear it.
    ko: 의심의 눈초리가 한층 더 짙어지셨네요.
    ja: すっかり疑いの目ですね。
  event_ce006_2_03_s_51:
    speaker: neon
    en: I'm curious to hear why you think this is more suspicious than usual.
    ko: 얘기해 봐요. 아니스의 불신으로 빚어낸 의심 가는 부분들을요.
    ja: |-
      聞きましょう、
      名探偵アニスの推理を。
  event_ce006_2_03_s_52:
    speaker: anis
    en: "... Much appreciated."
    ko: "…칭찬, 고~맙습니다."
    ja: "…まあ、ほめ言葉と受け取っておくわ。"
  event_ce006_2_03_s_53:
    speaker: neon
    en: Don't mention it!
    ko: 어휴. 별말씀을요.
    ja: いえいえ、どういたしまして。
  event_ce006_2_03_s_54:
    speaker: anis
    en: First of all, I understand what this place is.
    ko: 일단 여기가 어떤 곳인지도 잘 알겠어.
    ja: |-
      とりあえず、ここがどういう場所なのかは
      分かったわ。
  event_ce006_2_03_s_55:
    speaker: anis
    en: While it is hard to believe, I can get past the fact a human has managed to
      survive on the surface for over 100 years.
    ko: "…믿기 힘들지만, 100년이 넘는 시간 동안 지상에서 살아남은 인간이라는 것도 알겠어."
    ja: |-
      …信じられないけど、100年以上
      地上で生き残ってた人がいるってことも。
  event_ce006_2_03_s_56:
    speaker: anis
    en: I also get how this place is packed to the gills with digital data on art.
    ko: 이곳에 예술품 데이터들이 가득하다는 것도 알겠어.
    ja: |-
      ここに芸術品のデータが
      大量に保存されてるってことも、理解したわ。
  event_ce006_2_03_s_57:
    speaker: anis
    en: But setting all that aside, I simply don't trust this Hermin guy.
    ko: 그것과는 별개로, 난 헤르민 할아버지가 의심스러워.
    ja: |-
      でもそれとは別に、
      私はあの人の言ってることが信用できないの。
  event_ce006_2_03_s_58:
    speaker: anis
    en: What if he's some deranged criminal or something?
    ko: 그, 그런 거 아닐까? 극악무도한 범죄자라서.
    ja: 怪しすぎるでしょ？何かたくらんでるのかも。
  event_ce006_2_03_s_59:
    speaker: anis
    en: That door was welded shut from the outside, and the entire lake was electrified.
    ko: 밖에서 문도 용접해 버리고, 전기가 흐르는 물까지 채워놓은 거.
    ja: |-
      外から扉が溶接されてたのも、
      ここが電気が流れる水の底にあったのも、
      何か理由があるんじゃない？
  event_ce006_2_03_s_60:
    speaker: neon
    en: He looks pretty frail to me. I don't think he poses a threat to us.
    ko: |-
      그렇게 보이진 않던데요.
      되게 쇠약해 보이셨고.
    ja: |-
      私にはそうは見えませんでしたよ。
      とても衰弱しているようでしたし。
  event_ce006_2_03_s_61:
    speaker: anis
    en: I'm not talking about now. I mean before, when he was young.
    ko: |-
      젊었을 때 말하는 거야.
      지금을 말하는 거겠냐.
    ja: |-
      若かった頃の話よ。
      今なわけないでしょ。
  event_ce006_2_03_s_62:
    speaker: rapi
    en: If you're saying he intentionally welded the door shut and then electrified
      the water... it's not exactly the most efficient plan.
    ko: 효율이 너무 떨어지지 않을까.
    ja: 遠回りすぎるわ。
  event_ce006_2_03_s_63:
    speaker: anis
    en: Hmm, true. He's not a supervillain from a comic book, after all.
    ko: |-
      그건… 그래.
      무슨 슈퍼 빌런도 아니고.
    ja: |-
      それは…まあね。
      マンガの悪役じゃあるまいし…
  event_ce006_2_03_s_64:
    speaker: "<Self>"
    en: Let's wait and see what Elegg and Lily find in the recovered footage.
    ko: 일단 일레그랑 릴리가 녹화 자료 복구하는 걸 기다려보자.
    ja: |-
      とりあえず、エレグとリリーが
      録画データを復元するまで待とう
  event_ce006_2_03_s_65:
    speaker: "<Self>"
    en: Maybe Privaty will be able to offer some answers as well.
    ko: 프리바티 쪽에서 일이 잘 해결될 수도 있고.
    ja: |-
      それに、プリバティの方で
      なにか進展があるかもしれない
  event_ce006_2_03_s_66:
    speaker: neon
    en: I hope so. After all, we're talking about a human survivor up on the surface,
      after all these years.
    ko: |-
      그렇겠죠?
      무려 지상에서 지금까지 살아남은 분이니까요.
    ja: |-
      そうですねえ？
      地上で今まで生き残ってきた方なんですから。
  event_ce006_2_03_s_67:
    speaker: neon
    en: This is bound to become a major news story back in the Ark.
    ko: 방주에서 행사나 방송 같은 거 엄청 많이 하시겠죠?
    ja: |-
      アークに戻ったら、イベントとかテレビとか
      引っ張りだこじゃありませんか？
  event_ce006_2_03_s_68:
    speaker: neon
    en: Oooh, we should tell Hermin our names so he can tell all the TV presenters
      about us!
    ko: 아, 헤르민 할아버지한테 우리 이름 알려드려야겠다.
    ja: |-
      あっ、今のうちに私たちの名前を
      覚えておいていただきましょうか…
  event_ce006_2_03_s_69:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_70:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_71:
    speaker: neon
    en: What? Why do you two look so grim?
    ko: 응? 두 분은 왜 그렇게 표정이 안 좋으시나요?
    ja: |-
      あれ？どうして2人とも
      暗い顔をしてるんですか？
  event_ce006_2_03_s_72:
    speaker: anis
    en: "... No reason."
    ko: "…아냐. 그냥."
    ja: "…ううん。何でも。"
  event_ce006_2_03_s_73:
    speaker: rapi
    en: Yeah. It's nothing.
    ko: 나도 별일 아니야.
    ja: 私も。
  event_ce006_2_03_s_74:
    speaker: neon
    en: "?"
    ko: "??"
    ja: "？？"
  event_ce006_2_03_s_75:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_76:
    speaker: "<Narration>"
    en: Privaty reads over the report she submitted.
    ko: 프리바티는 자신이 상신한 문서를 다시 읽어보았다.
    ja: |-
      プリバティは自分が送った報告書を
      読み返していた
  event_ce006_2_03_s_77:
    speaker: "<Narration>"
    en: In it, she clearly and concisely illustrates the importance of finding a human
      survivor on the surface, and why that individual must be protected.
    ko: 지상에서 살아남은 인간의 중요성과, 이를 보호하고 케어해야 할 이유에 대해 간략하지만 확실하게 쓰여 있었다.
    ja: |-
      地上で発見された生存者の重要性と、
      その人物を保護するべき理由について
      簡潔かつ明確に記述できている
  event_ce006_2_03_s_78:
    speaker: "<Narration>"
    en: She's rather proud of how well-written it is, especially given the lack of
      proper equipment in the immediate area.
    ko: 제대로 된 장비도 없는 상황에서, 이 정도의 보고서를 작성한 자신에 게 프리바티는 뿌듯함마저 느꼈다.
    ja: |-
      ろくな準備もしていない状況で
      これほどの報告書がよくできたと
      自分を誇らしくさえ感じる仕上がりだ
  event_ce006_2_03_s_79:
    speaker: "<Narration>"
    en: If Yulha were to see it, she might feel otherwise, but Privaty personally
      can't find any faults with the writing.
    ko: |-
      율하가 봤으면 어땠을지 모르지만,
      프리바티는 이 보고서의 문제점을 찾을 수 없었다.
    ja: |-
      ユルハならケチのつけどころを
      見つけられるかもしれないが、
      プリバティ自身の目には完璧に見えた
  event_ce006_2_03_s_80:
    speaker: "<Narration>"
    en: Privaty scrolls to another section on her phone
    ko: 프리바티가 핸드폰을 조작한다.
    ja: 彼女は携帯端末に目をやった
  event_ce006_2_03_s_81:
    speaker: "<Narration>"
    en: and reads the reply to her report.
    ko: 프리바티의 보고서에 대한 답신을 읽는다.
    ja: 報告書に対する回答が届いている
  event_ce006_2_03_s_82:
    speaker: "<Narration>"
    en: The document bears the authorized digital seal of the Central Government,
      confirming it as an official document.
    ko: |-
      중앙 정부의 디지털 인장이 찍힌 문서다.
      의심할 여지없는 공식 문서다.
    ja: |-
      中央政府の電子印章が浮かんでいた。
      真正のものであることを疑う余地はない
  event_ce006_2_03_s_83:
    speaker: "<Narration>"
    en: The response is lengthy,
    ko: 긴 내용이다.
    ja: 長い回答書だ
  event_ce006_2_03_s_84:
    speaker: "<Narration>"
    en: but none of the words register.
    ko: 눈에 들어오지 않는다.
    ja: 内容が目に入ってこない
  event_ce006_2_03_s_85:
    speaker: "<Narration>"
    en: Not due to the overall length or complexity of the text, but rather due to
      a single sentence contained at the bottom.
    ko: |-
      내용이 길고 복잡해서가 아니라,
      가장 아래에 쓰인 단 한 줄의 문장 때문이다.
    ja: |-
      だが、それは文書の長さや
      複雑な表現のせいではなかった
  event_ce006_2_03_s_86:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_s_87:
    speaker: "<Narration>"
    en: Privaty blinks several times and rereads the document from top to bottom,
    ko: 프리바티는 눈을 수 번 껌뻑인 후 다시 문서를 읽는다.
    ja: |-
      プリバティは何度もまばたきをした後、
      回答をもう一度読み直した
  event_ce006_2_03_s_88:
    speaker: "<Narration>"
    en: 'her eyes falling once again upon the very last sentence:'
    ko: 처음부터 정독한 후, 가장 아래줄을 읽는다.
    ja: |-
      一行目から読み返しても、
      最後に書かれた結論が変わるはずもない
  event_ce006_2_03_s_89:
    speaker: "<Narration>"
    en: "“The number of human survivors on the surface must be zero.”"
    ko: "[지상에 남은 인간의 수는 0명이어야 한다.]"
    ja: "「地上に生存者は存在しないものとする」"
event_ce006_2_03_e:
  event_ce006_2_03_e_1:
    speaker: anis
    en: I can't say I'm surprised. I knew this would happen.
    ko: 내가 이럴 줄 알았어서 별로 놀랍지는 않네.
    ja: |-
      そんなことだろうと思ってたから、
      別に驚きもしないわ。
  event_ce006_2_03_e_2:
    speaker: anis
    en: Did they give a reason?
    ko: 그래서. 이유가 뭐래?
    ja: それで、理由は？
  event_ce006_2_03_e_3:
    speaker: anis
    en: Surely the oh-so grand Central Government has an equally grand reasoning for
      this stance?
    ko: 위대하신 중앙 정부께서 다 큰 뜻이 있으셔서 그렇게 말씀하셨을 것 아냐.
    ja: |-
      ご立派な中央政府サマのことだから
      素晴らしい理由がおありなんでしょ？
  event_ce006_2_03_e_4:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_e_5:
    speaker: anis
    en: Whatever. If you don't want to tell us, suit yourself.
    ko: "…됐어. 말하기 싫으면 말아."
    ja: "…いいわよ。言いたくないなら別に。"
  event_ce006_2_03_e_6:
    speaker: anis
    en: We can take the old man with us regardless.
    ko: 그냥 우리가 데려가면 되니까.
    ja: 私たちが連れて帰れば済む話でしょ。
  event_ce006_2_03_e_7:
    speaker: rapi
    en: Privaty already issued the report, which complicates matters.
    ko: "…프리바티 입장에서는 보고를 해버린 탓에 일이 꼬인 거야."
    ja: |-
      …報告をしたから、プリバティの立場は
      かえって複雑なことになったのよ。
  event_ce006_2_03_e_8:
    speaker: anis
    en: What do you mean?
    ko: "…무슨 말이야?"
    ja: "…どういうこと？"
  event_ce006_2_03_e_9:
    speaker: rapi
    en: Privaty has been given strict orders not to bring in Hermin.
    ko: |-
      헤르민을 데려오지 말라는 명령을 프리바티에게 내렸는데,
      우리가 헤르민을 데려가버리면.
    ja: |-
      アークに入れるなという命令を受けたのに、
      私たちが彼を連れ帰ってしまえば…
  event_ce006_2_03_e_10:
    speaker: rapi
    en: If we do otherwise, they're likely to charge her with insubordination.
    ko: 프리바티는 명령 불복종이나 임무 거부를 한 것으로 취급될 거야.
    ja: |-
      プリバティは命令に従わなかったか、
      任務遂行を拒否したとみなされることになる。
  event_ce006_2_03_e_11:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_e_12:
    speaker: anis
    en: Well, I'm sorry to hear that,
    ko: 그, 미안한데.
    ja: その…悪いけど。
  event_ce006_2_03_e_13:
    speaker: anis
    en: but one way or another, we're bringing this guy back.
    ko: 그렇게 되더라도 우린 데려갈 거야.
    ja: |-
      もしそうだとしても、
      私たちは連れていくから。
  event_ce006_2_03_e_14:
    speaker: privaty
    en: I know. I figured that's what you all would do.
    ko: 알아요. 당신들은 그렇게 하겠죠.
    ja: |-
      分かっています。
      あなたたちなら、そうするでしょう。
  event_ce006_2_03_e_15:
    speaker: neon
    en: How about we knock out Privaty and then bring back Hermin?
    ko: 그럼 우리가 프리바티 때려눕힌 다음 헤르민 할아버지를 데려가면 되지 않나요?
    ja: |-
      それなら、私たちがプリバティをやっつけて
      連れていけばいいのでは？
  event_ce006_2_03_e_16:
    speaker: "<Self>"
    en: Then we'd be guilty of unprovoked assault on a Nikke.
    ko: "…그럼 우리가 이유 없이 니케를 때려눕힌 게 되는 거야."
    ja: |-
      …それでは、我々が正当な理由なく
      危害を加えたことになる
  event_ce006_2_03_e_17:
    speaker: neon
    en: Oh, right. I didn't think about that.
    ko: 아하. 그걸 생각 못 했네요.
    ja: なるほど。そこまで考えが至りませんでした。
  event_ce006_2_03_e_18:
    speaker: "<Self>"
    en: Did the Central Government offer an explanation? If we know the reason behind
      their decision, we might be able to work around it.
    ko: 이유가 뭐래? 그래야 이유를 피해서 데려갈 수도 있을 테니까.
    ja: |-
      どういう建前だ？それさえ分かれば
      抜け道はあるかもしれない
  event_ce006_2_03_e_19:
    speaker: privaty
    en: "*Sigh*..."
    ko: "…하아."
    ja: "…そうですね。"
  event_ce006_2_03_e_20:
    speaker: privaty
    en: 1. The high possibility of rare infectious diseases. If he is infected with
      a disease that cannot be treated, the Ark will be in danger.
    ko: 1. 희귀 전염병일 가능성 높음. 방주에서 치료할 수 없는 전염병을 앓고 있을 경우 방주가 위험해짐.
    ja: |-
      一、新種の伝染病患者の可能性が存在する。
      治療法の確立していない伝染病に
      罹患していた場合、保健衛生上の危険がある。
  event_ce006_2_03_e_21:
    speaker: privaty
    en: 2. The high possibility of him being a dangerous criminal, which would naturally
      pose a threat to the residents of the Ark.
    ko: 2. 흉악범일 가능성 높음. 방주의 시민들에게 위해를 가할 가능성 높음.
    ja: |-
      二、凶悪な犯罪者である可能性が高い。
      アークの市民に危害を加える恐れがある。
  event_ce006_2_03_e_22:
    speaker: privaty
    en: 3. The high possibility of him being a Rapture spy, which would likely result
      in the leaking of vital information about the Ark and its location.
    ko: 3. 랩쳐의 스파이일 가능성 높음. 방주의 위치 및 방주의 정보를 빼낼 가능성 높음.
    ja: |-
      三、ラプチャーのスパイである可能性が高い。
      アークの所在地など各種情報の奪取を
      試みている可能性がある。
  event_ce006_2_03_e_23:
    speaker: anis
    en: Hehe, that's a new one.
    ko: 하하. 이건 좀 신선하네.
    ja: あはは。斬新な言い訳ね。
  event_ce006_2_03_e_24:
    speaker: privaty
    en: 4. The possibility of him not in fact being human. There is a chance that
      he might be a Rapture or another type of beast pretending to be human.
    ko: 4. 인간이 아닐 가능성. 인간의 모습을 흉내 낸 맹수 및 랩쳐일 가능성 높음.
    ja: |-
      四、人類ではない可能性がある。
      ヒトに酷似した猛獣あるいは
      ラプチャーの擬態である可能性が高い。
  event_ce006_2_03_e_25:
    speaker: anis
    en: Oh suuuuure, that's totally it.
    ko: 얼씨구.
    ja: へー。
  event_ce006_2_03_e_26:
    speaker: privaty
    en: 5. The possibility of it being a hitherto unreported new species, which would
      pose a threat to the Ark.
    ko: 5. 새로운 종일 가능성. 보고되지 않은 새로운 종일 경우 방주에 위협을 가할 가능성 높음.
    ja: |-
      五、新種の生命体である可能性。
      未知の生命体であった場合、
      アークは算出不能なリスクを負う。
  event_ce006_2_03_e_27:
    speaker: anis
    en: Now they're really thinking outside the box.
    ko: 창의력 대단한데?
    ja: たいした想像力ねえ？
  event_ce006_2_03_e_28:
    speaker: privaty
    en: I realize how absurd these reasons sound. They gave plenty more, close to
      100 of them.
    ko: |-
      …이런 말도 안 되는, 실례.
      이런 종류의 이유들이 90개 정도 있어요.
    ja: |-
      …こんなバカげた…失礼。
      これに類する理由が90件以上
      連ねられています。
  event_ce006_2_03_e_29:
    speaker: privaty
    en: 'The most important of which was the one given at the very end of their response:'
    ko: 그 결론이, 가장 아래에 적혀있는.
    ja: それで、その結論が…一番下です。
  event_ce006_2_03_e_30:
    speaker: privaty
    en: "“The number of human survivors on the surface must be zero.”"
    ko: "[지상에 남은 인간의 수는 0명이어야 한다.]"
    ja: "「地上に生存者は存在しないものとする」"
  event_ce006_2_03_e_31:
    speaker: privaty
    en: As far as they are concerned, the risks are far too great.
    ko: 라는 거죠. 위험을 감수할 수 없다는 얘기예요.
    ja: |-
      それが回答です。
      リスクは取れないということでしょう。
  event_ce006_2_03_e_32:
    speaker: anis
    en: What a load of bull. They just don't want to entertain the possibility.
    ko: 헛소리네. 가능성을 넓히기 싫은 거겠지.
    ja: よく言うわ。可能性を広げたくないだけでしょ。
  event_ce006_2_03_e_33:
    speaker: neon
    en: What do you mean by that?
    ko: 무슨 말이에요?
    ja: どういうことですか？
  event_ce006_2_03_e_34:
    speaker: anis
    en: If it's revealed that there are in fact survivors on the surface, then the
      government would naturally have to go searching for more.
    ko: |-
      지상에 남은 인간의 수가 0명이 아니라는 게 밝혀지면,
      찾아다녀야 할 것 아냐.
    ja: |-
      地上に生存者がいるかもって分かったら、
      探さなきゃいけなくなるでしょ。
  event_ce006_2_03_e_35:
    speaker: anis
    en: That would mean devoting a whole bunch of resources, with no guarantee that
      they'd turn up anything. So, they decided their best option was to insist that
      the figure is zero, and leave it at that.
    ko: 그게 힘들고 잘 안될 것 같으니까 [아 그냥 0명이라 치고 찾지 맙시다]가 된 거라고.
    ja: |-
      そんなの面倒だし、うまくいくアテもないから
      「いないことにしとこう」って話。
  event_ce006_2_03_e_36:
    speaker: privaty
    en: I think that's an awfully big leap in logic.
    ko: 비약이 너무 심하시네요.
    ja: 飛躍しすぎではありませんか？
  event_ce006_2_03_e_37:
    speaker: anis
    en: Any chance you could stop trembling while you speak? Maybe then I'd be less
      convinced that the Central Government has completely brainwashed you.
    ko: |-
      목소리나 좀 떨지 말고 말하지?
      진짜 세뇌된 거라고 믿기라도 하게.
    ja: |-
      声が震えてるわよ？こっちとしては、
      あなたもそう刷り込まれてるだけって
      信じたいところだけど。
  event_ce006_2_03_e_38:
    speaker: privaty
    en: What the...?!
    ko: 당신…!
    ja: あなたは…！
  event_ce006_2_03_e_39:
    speaker: anis
    en: If it comes to light that there are survivors on the surface,
    ko: 0명이 아니면 곤란한 건 중앙 정부야.
    ja: そうじゃないと困るのは、中央政府でしょ。
  event_ce006_2_03_e_40:
    speaker: anis
    en: it'd spell serious trouble for the Central Government.
    ko: 지들 명성에 흠집이 나니까.
    ja: 自分たちの信用に傷がつくから。
  event_ce006_2_03_e_41:
    speaker: anis
    en: For all these years, they've been assuring us there's no one out there, and
      then it turns out it was all a lie?
    ko: 0명이라고 그렇게 그렇게 얘기해 놨는데, 아니었어봐.
    ja: |-
      生存者はもういないって散々言っておいて、
      それが間違いだったら？
  event_ce006_2_03_e_42:
    speaker: anis
    en: The oh-so esteemed Central Government's reputation would take a serious nosedive.
    ko: 위대하신 중앙 정부의 위상이 바닥에 떨어질 거 아냐.
    ja: 偉大な中央政府サマの面目丸つぶれよ。
  event_ce006_2_03_e_43:
    speaker: privaty
    en: Don't be ridiculous. There's no way they'd do that.
    ko: 중앙 정부가 그런 짓을 할리가 없
    ja: 中央政府がそのようなことをするはずが――
  event_ce006_2_03_e_44:
    speaker: anis
    en: Privaty.
    ko: 너.
    ja: あなたね…
  event_ce006_2_03_e_45:
    speaker: anis
    en: Take a good look at that document again.
    ko: 지금 그 문서 다시 한번 봐봐.
    ja: |-
      それに書かれてること、
      もう一度よく見なさいよ。
  event_ce006_2_03_e_46:
    speaker: anis
    en: Explain to me how else this is supposed to make any sense.
    ko: 그게 지금, 말이 된다고 생각해?
    ja: そんな話、納得できる？
  event_ce006_2_03_e_47:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_e_48:
    speaker: anis
    en: We're going to take Hermin with us.
    ko: 우린 데려갈 거야.
    ja: 私たちは連れていくわ。
  event_ce006_2_03_e_49:
    speaker: anis
    en: That's the least we can do.
    ko: 우린 그래도 돼.
    ja: 私たちには、それができる。
  event_ce006_2_03_e_50:
    speaker: anis
    en: Right, Commander?
    ko: 맞지? 지휘관님.
    ja: でしょ？指揮官様。
  event_ce006_2_03_e_51:
    speaker: "<Self>"
    en: Yes. It's what we must do.
    ko: 응. 그렇게 해야지.
    ja: ああ、その通りだ
  event_ce006_2_03_e_52:
    speaker: privaty
    en: Give me some time. I'll try to convince them.
    ko: |-
      지휘관. 저한테 시간을 좀 줘요.
      제가 상부를 설득해 볼게요.
    ja: |-
      指揮官。私に時間をください。
      上層部を説得してみます。
  event_ce006_2_03_e_53:
    speaker: "<Self>"
    en: How?
    ko: "…어떻게?"
    ja: "…どう説得する気だ？"
  event_ce006_2_03_e_54:
    speaker: privaty
    en: "..."
    ko: 그건….
    ja: それは…
  event_ce006_2_03_e_55:
    speaker: rapi
    en: Hermin doesn't look well.
    ko: "…헤르민의 상태는 많이 안 좋아 보여."
    ja: "…あの人は、もう長くないと思うわ。"
  event_ce006_2_03_e_56:
    speaker: rapi
    en: I'm not so sure he'd even survive the trip back to the Ark.
    ko: 솔직히 방주까지 가는 길을 견딜 수 있을지도 의문이야.
    ja: |-
      正直に言って、アークに帰るまで
      耐えられるかどうかも疑わしい。
  event_ce006_2_03_e_57:
    speaker: rapi
    en: If we borrowed the Tetrapod, that would shorten the travel time, but if Storm
      Bringer were to appear, there's no telling what would happen.
    ko: |-
      테트라포드를 빌린다면 시간이 단축되겠지만,
      스톰 브링어라도 출몰하면 상황을 장담할 수 없어.
    ja: |-
      テトラポッドを借りて早く着けるとしても、
      ストームブリンガーにでも遭遇したら、
      どうなるか分からないわ。
  event_ce006_2_03_e_58:
    speaker: rapi
    en: In other words, we don't have time to wait while you try and persuade the
      Central Government.
    ko: 네가 중앙 정부를 설득할 시간까지 기다려 줄 수는 없다는 얘기야.
    ja: |-
      あなたが中央政府を説得できるまで
      待っている時間はないの。
  event_ce006_2_03_e_59:
    speaker: rapi
    en: Especially when we don't even know if you'll succeed.
    ko: "…잘 될지도 의문이고."
    ja: "…そもそも、それができるかどうか…"
  event_ce006_2_03_e_60:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_e_61:
    speaker: anis
    en: The Commander will make sure you aren't faulted for this.
    ko: "…네가 불이익을 받지 않도록 지휘관님이 잘 말해줄 거야."
    ja: |-
      …あなたの不利益にはならないように、
      指揮官様がうまくごまかしてくれるでしょ。
  event_ce006_2_03_e_62:
    speaker: privaty
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_ce006_2_03_e_63:
    speaker: privaty
    en: Do you think I'm only doing this to save my own skin?!
    ko: 제, 제가 지금 제 안위 때문에 이러는 것 같나요!?
    ja: わ、私が自分の心配をしているとでも！？
  event_ce006_2_03_e_64:
    speaker: anis
    en: Duh, why else?
    ko: 그럼.
    ja: 違う？
  event_ce006_2_03_e_65:
    speaker: privaty
    en: Do you have any idea what would happen if people lost faith in the Central
      Government?
    ko: 방주에서 중앙 정부가 신용을 잃는다는 게 어떤 의미인 줄 아세요!?
    ja: |-
      中央政府がアークの信用を失う…
      その意味が分かっているのですか！？
  event_ce006_2_03_e_66:
    speaker: privaty
    en: Everything would fall apart! Everything!
    ko: 모든 게 다 무너져요! 모든 게!
    ja: すべてが崩壊します！すべてが！
  event_ce006_2_03_e_67:
    speaker: privaty
    en: In a rigid society like ours, if the people cease to trust the one absolute
      authority, it's all over!
    ko: 꽉 막힌 사회에서 절대적으로 신용받는 집단이 무너지면 끝이라고요!
    ja: |-
      行き詰った社会が、たった一つの
      信頼できるよりどころを失ったら…！
  event_ce006_2_03_e_68:
    speaker: anis
    en: So what are we supposed to do?
    ko: 그럼 죽일까? 응?
    ja: じゃ、殺せっていうの？あの人を？
  event_ce006_2_03_e_69:
    speaker: anis
    en: Kill this innocent old man and head back?
    ko: 저 할아버지 죽이고 돌아갈까? 어!?
    ja: |-
      あのおじいさんを始末して
      アークに戻る、それで満足！？
  event_ce006_2_03_e_70:
    speaker: privaty
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_03_e_71:
    speaker: anis
    en: Sounds to me like that's what you're proposing.
    ko: 지금 네가 하는 말이 그러자고 얘기하는 거잖아!
    ja: あなたが今言ったのは、そういうことよ！
  event_ce006_2_03_e_72:
    speaker: privaty
    en: O-of course not. Don't be absurd.
    ko: 아, 아니에요. 그건 너무 말도 안 되는….
    ja: ち、違います。そんなバカげた話…
  event_ce006_2_03_e_73:
    speaker: anis
    en: Privaty. Please.
    ko: 제발. 프리바티.
    ja: いい加減にして。プリバティ。
  event_ce006_2_03_e_74:
    speaker: anis
    en: Don't give us... Don't give me a reason to hate you.
    ko: 우리가, 아니. 내가 널 더 싫어하게 만들지 말아 줘.
    ja: |-
      私たち…違う。
      私にこれ以上あなたを嫌いにさせないで。
  event_ce006_2_03_e_75:
    speaker: anis
    en: I'm begging you.
    ko: 부탁이야.
    ja: お願いだから。
  event_ce006_2_03_e_76:
    speaker: "<Monologue>"
    en: We leave Privaty, who stands motionless with her head bowed, and start moving.
    ko: 우리는 고개를 숙이고 있는 프리바티를 뒤로 하고 이동했다.
    ja: |-
      うつむくプリバティを残し、
      私たちはその場を立ち去った
  event_ce006_2_03_e_77:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_e_78:
    speaker: elegg
    en: Wow. I've seen something like this in the Ark.
    ko: 우와. 저 이거랑 비슷한 거 방주에서 본 적 있어여.
    ja: |-
      ややっ、これと似たものを
      アークで見たことがありますな。
  event_ce006_2_03_e_79:
    speaker: hermin
    en: You have?
    ko: 오. 그런가요?
    ja: おお、本当ですか？
  event_ce006_2_03_e_80:
    speaker: elegg
    en: Yeah. Whenever it rains, the water flows down the roof, and it looks beautiful.
    ko: 녜. 비 오는 날이면 이 지붕을 타고 물이 진짜 예쁘게 흐르거든여.
    ja: |-
      それはもう、雨の日になると、
      屋根に美しい水の流れができましてな。
  event_ce006_2_03_e_81:
    speaker: elegg
    en: I've even waited for it to rain before just so I could see it.
    ko: 그거 보고 싶어서 비 언제 오나 기다린 적도 있을 정도였어여.
    ja: |-
      あれが見たくて、雨が降るのが
      楽しみになったぐらいですぞ。
  event_ce006_2_03_e_82:
    speaker: hermin
    en: Hehe, that makes me happy.
    ko: 허허. 그거 기쁘군요.
    ja: ははは。それはうれしいですね。
  event_ce006_2_03_e_83:
    speaker: elegg
    en: Huh? Why's that?
    ko: 응? 왜여?
    ja: むーん？なぜですかな？
  event_ce006_2_03_e_84:
    speaker: hermin
    en: I'm the one who designed this roof.
    ko: 이 지붕 구조. 제가 만든 거거든요.
    ja: この屋根の構造は…私が設計したものですから。
  event_ce006_2_03_e_85:
    speaker: elegg
    en: No way!
    ko: 와! 우와!
    ja: おおっ！なんと！？
  event_ce006_2_03_e_86:
    speaker: elegg
    en: Something that you built has lasted this long?
    ko: 그, 그럼 헤르민 씨가 만든 게 지금까지 이어져 온 거네여!?
    ja: |-
      となると、ヘルミン殿の意匠が
      受け継がれていたということですかな！？
  event_ce006_2_03_e_87:
    speaker: hermin
    en: According to you, apparently so, hehe. Hence why I'm so pleased.
    ko: |-
      그렇게 된 것 같네요.
      허허. 이것 참 기쁘게도….
    ja: |-
      そのようですね。
      ははは…幸いです。
  event_ce006_2_03_e_88:
    speaker: hermin
    en: Oh, have you seen this kind of roof, by any chance? Here...
    ko: |-
      아, 혹시 이런 지붕은 본 적 없나요?
      여기에….
    ja: |-
      ああ、こういった形状も残っていますか？
      これのような…
  event_ce006_2_03_e_89:
    speaker: elegg
    en: I have! I've seen it in the stadium, above the seating for the spectators.
    ko: |-
      어!? 저 이것도 본 적 있어여!
      방주 경기장 관중석에서 봤었어여!
    ja: |-
      おおっ！？それも見たことありますな！
      アーク競技場の観客席で見かけましたぞ！
  event_ce006_2_03_e_90:
    speaker: hermin
    en: No kidding!
    ko: 오오… 이런 일이…!
    ja: おお…そんなことが…！
  event_ce006_2_03_e_91:
    speaker: "<Monologue>"
    en: Hermin, whose condition has improved significantly, is spending time with
      Elegg going through the stored data.
    ko: 많이 호전된 헤르민은 일레그와 함께 저장 장치 내의 자료들을 보며 시간을 보내고 있었다.
    ja: |-
      体調が回復したヘルミンは、
      デバイスに保存されていたデータを
      エレグと眺めていた
  event_ce006_2_03_e_92:
    speaker: ce006_03
    en: Those two are getting along like a house on fire.
    ko: 좀 전부터 두 분이서 아주 즐겁게 이야기하고 계시네요.
    ja: 二人とも、話が弾んでるみたいですね。
  event_ce006_2_03_e_93:
    speaker: rapi
    en: Any progress with the recordings?
    ko: 녹화 자료 쪽엔 진전이 있어?
    ja: 録画データの分析に進展は？
  event_ce006_2_03_e_94:
    speaker: ce006_03
    en: Yeah. I'm pretty sure Com was here.
    ko: 예. 있어요. 콤이 여기에 있었던 것 같아요.
    ja: |-
      はい、進んでます。
      コムはここにいたみたいです。
  event_ce006_2_03_e_95:
    speaker: anis
    en: Really?
    ko: 엉? 콤이?
    ja: えっ？コムが？
  event_ce006_2_03_e_96:
    speaker: ce006_03
    en: I saw it in the footage that we recovered.
    ko: 복구한 녹화 영상에서 봤어요.
    ja: 復元した映像記録に姿がありました。
  event_ce006_2_03_e_97:
    speaker: ce006_03
    en: At first, I wasn't sure, since all robots look awfully similar to me.
    ko: 사실 로봇들은 다 똑같이 생겨서 긴가민가 했는데.
    ja: |-
      ロボットの見た目なんて似たり寄ったりだし、
      判別には苦労しましたけど。
  event_ce006_2_03_e_98:
    speaker: roam
    en: False. I look better than Com.
    ko: 아니다. 롬이 콤보다는 좀 더 낫게 생겼다.
    ja: ぜんぜん違う。ロムはコムよりカッコイイ。
  event_ce006_2_03_e_99:
    speaker: ce006_03
    en: "... Anyway, the serial number I saw was the same as the one engraved on Com."
    ko: "…아무튼. 콤의 몸에 새겨진 코드랑 같았어요."
    ja: |-
      …とにかく。
      ボディに刻印されているコードが同じでした。
  event_ce006_2_03_e_100:
    speaker: ce006_03
    en: Also, look at the floor. Even though it's dark, you can still make out track
      marks everywhere.
    ko: |-
      그리고 여기 바닥.
      어두워서 잘 안 보이지만 곳곳에 궤도 자국이 있어요.
    ja: |-
      それに、この辺りの床も。
      暗くて見づらいですが、
      あちこちに履帯の跡があります。
  event_ce006_2_03_e_101:
    speaker: ce006_03
    en: I'd bet good money that Com was here at some point.
    ko: 아무래도 콤이 여기 있었다는 건 확실한 것 같아요.
    ja: コムがここにいたのは間違いないですね。
  event_ce006_2_03_e_102:
    speaker: anis
    en: What in the world is going on...
    ko: 그 녀석… 대체 뭐지….
    ja: いったい…どういうロボットなの…？
  event_ce006_2_03_e_103:
    speaker: ce006_03
    en: I'll see what else I can find.
    ko: 아무튼 나머지도 좀 더 찾아볼게요.
    ja: 他にも情報がないか、もう少し探してみます。
  event_ce006_2_03_e_104:
    speaker: ce006_03
    en: It would be nice if Elegg could lend a hand...
    ko: 일레그가 좀 도와주면 좋겠는데….
    ja: エレグに手伝ってもらえたら早いんですけど…
  event_ce006_2_03_e_105:
    speaker: "<Monologue>"
    en: Lily glances at Hermin and Elegg, who are happily chatting.
    ko: 릴리는 고개를 돌려 신나게 이야기하고 있는 헤르민과 일레그를 바라보았다.
    ja: |-
      リリーの目が一瞬、楽しそうに会話している
      ヘルミンとエレグに向けられた
  event_ce006_2_03_e_106:
    speaker: ce006_03
    en: Then again, it's not the end of the world if it takes a little more time.
    ko: 뭐, 조금 정도는 늦어져도 괜찮겠죠.
    ja: まあ、少しくらい遅くなってもいいですよね。
  event_ce006_2_03_e_107:
    speaker: "<Self>"
    en: Sorry for throwing this all in your lap.
    ko: 미안해. 혼자만 고생시키네.
    ja: すまない。苦労をかけるな
  event_ce006_2_03_e_108:
    speaker: ce006_03
    en: Nah, I'm having a blast.
    ko: 아니에요. 재밌어요.
    ja: いえいえ。楽しんでるので。
  event_ce006_2_03_e_109:
    speaker: ce006_03
    en: It's always fun learning new technology.
    ko: 역시 새로운 기술을 배우는 건 언제나 즐겁네요.
    ja: |-
      やっぱり、新しい技術を知るのって
      すごく面白いです。
  event_ce006_2_03_e_110:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_03_e_111:
    speaker: "<Narration>"
    en: Privaty looks at Hermin, who is chatting and laughing along with Elegg.
    ko: 프리바티는 일레그와 웃으며 대화를 나누고 있는 헤르민을 본다.
    ja: |-
      プリバティがエレグと談笑する
      ヘルミンを凝視している
  event_ce006_2_03_e_112:
    speaker: "<Narration>"
    en: She lowers her head and looks at her phone,
    ko: 그리고 고개를 숙여 핸드폰을 바라본다.
    ja: その視線が手元の携帯端末に落ちた
  event_ce006_2_03_e_113:
    speaker: "<Narration>"
    en: rereading the last line of the document she received earlier.
    ko: 좀 전에 받았던 문서의 가장 마지막 줄을 다시 한번 확인한다.
    ja: |-
      受け取った回答書の最後の一文を
      もう一度読み返している
  event_ce006_2_03_e_114:
    speaker: "<Narration>"
    en: "“The number of human survivors on the surface must be zero.”"
    ko: "[지상에 남은 인간의 수는 0명이어야 한다.]"
    ja: "「地上に生存者は存在しないものとする」"
  event_ce006_2_03_e_115:
    speaker: "<Narration>"
    en: Privaty squeezes her eyes shut,
    ko: 프리바티는 눈을 질끈 감는다.
    ja: プリバティがしばらくの間、固く目を閉じ…
  event_ce006_2_03_e_116:
    speaker: "<Narration>"
    en: then reopens them and walks forward,
    ko: 다시 눈을 뜬 후, 앞으로 걸어갔다.
    ja: やがてまぶたを開いて、足を踏み出した
  event_ce006_2_03_e_117:
    speaker: "<Narration>"
    en: heading quickly towards Hermin.
    ko: 헤르민을 향해, 좀 더 빠르게, 빠르게 걸어간다.
    ja: ヘルミンに向かい、だんだんと足が早まっていく
  event_ce006_2_03_e_118:
    speaker: "<Narration>"
    en: As she closes the distance between them, Hermin notices Privaty and turns,
    ko: |-
      그리고 헤르민과의 거리가 가까워지고,
      헤르민이 프리바티가 다가오는 것을 바라보았을 때.
    ja: |-
      近づくプリバティに気づき、
      ヘルミンが彼女の方を向いた
  event_ce006_2_03_e_119:
    speaker: "<Narration>"
    en: just in time to see her put her hands up towards her chest.
    ko: 프리바티는 자신의 품 안으로 손을 집어넣었다.
    ja: プリバティの手が自身のポケットに伸びた
event_ce006_2_intermission_01:
  event_ce006_2_intermission_01_1:
    speaker: "<Monologue>"
    en: Privaty pulls out a notebook and hands it to Hermin.
    ko: 프리바티는 품에서 수첩을 꺼내 앞으로 내밀었다.
    ja: プリバティが手帳を取り出し、正面に掲げた
  event_ce006_2_intermission_01_2:
    speaker: privaty
    en: Nice to meet you. I am Privaty. I work for the Central Government's Ark defense
      forces.
    ko: |-
      처음 뵙겠습니다.
      중앙 정부 방주 수비군 휘하.
    ja: |-
      初めまして。
      中央政府アーク防衛軍…
  event_ce006_2_intermission_01_3:
    speaker: privaty
    en: I'm from Triangle, a squad responsible for maintaining public security.
    ko: 방주 위협 제어 부대 트라이앵글의 프리바티라고 합니다.
    ja: |-
      アーク脅威制御部隊トライアングル所属、
      プリバティと申します。
  event_ce006_2_intermission_01_4:
    speaker: hermin
    en: Oh... nice to meet you. I'm Hermin.
    ko: 아… 반갑습니다. 헤르민입니다.
    ja: はぁ…初めまして。ヘルミンです。
  event_ce006_2_intermission_01_5:
    speaker: privaty
    en: I'm hereby placing you under...
    ko: 현 시간부로 당신은….
    ja: ただ今をもって、あなたには…
  event_ce006_2_intermission_01_6:
    speaker: privaty
    en: My protection. I will ensure you safe passage to the Ark.
    ko: 저의 보호를 받으며 방주로 이동할 겁니다.
    ja: 私の保護の下、アークへご同行頂きます。
  event_ce006_2_intermission_01_7:
    speaker: "<Self>"
    en: Privaty...!
    ko: 프리바티…!
    ja: プリバティ…！
  event_ce006_2_intermission_01_8:
    speaker: anis
    en: What the...?!
    ko: 저 녀석…!
    ja: それって…！
  event_ce006_2_intermission_01_9:
    speaker: privaty
    en: I'm concerned about your health, so we must move quickly.
    ko: 건강 상태가 염려되니 최대한 빠르게 움직일 겁니다.
    ja: |-
      健康状態の懸念があるようですので、
      早急に移動しましょう。
  event_ce006_2_intermission_01_10:
    speaker: privaty
    en: I realize this may seem sudden, but I kindly ask you only to pack essentials.
    ko: 갑작스럽겠지만, 최소한의 짐을 최대한 빨리 챙겨주세요.
    ja: |-
      突然のことで恐れ入りますが、
      最低限の持ち物を急いでご用意ください。
  event_ce006_2_intermission_01_11:
    speaker: privaty
    en: We will start moving as soon as you're ready.
    ko: 준비가 완료되면 바로 이동을 시작할 겁니다.
    ja: 準備が整い次第、ただちに出発します。
  event_ce006_2_intermission_01_12:
    speaker: hermin
    en: The Ark...
    ko: "…방주…."
    ja: "…アークへ…"
  event_ce006_2_intermission_01_13:
    speaker: privaty
    en: After we arrive, you will be given a thorough medical examination, as well
      as any treatment which you require.
    ko: |-
      방주로 이동 후 정밀 검진은 물론,
      필요시 치료까지 책임지겠습니다.
    ja: |-
      到着後は責任をもって
      精密検査および治療を行わせていただきます。
  event_ce006_2_intermission_01_14:
    speaker: privaty
    en: Once your condition is stabilized, an investigation will take place.
    ko: 그 후, 안정되었다고 판단되면 조사를 진행할 겁니다.
    ja: |-
      その後、状態が安定し次第、
      事情聴取を行います。
  event_ce006_2_intermission_01_15:
    speaker: privaty
    en: I will personally oversee the entire process, and I promise that no physical
      or psychological harm will come to you during said investigation.
    ko: 물론 제 감독 하에 진행할 것이며, 조사 과정에서 그 어떤 물리적 피해나 정신적 피해가 없을 것을 약속드립니다.
    ja: |-
      無論、そちらも私の監視の下で、
      身体や精神に負荷がかからないよう進めます。
  event_ce006_2_intermission_01_16:
    speaker: privaty
    en: If you wish, I will also arrange for additional supplies of Evergreen and
      secure a residence for you.
    ko: |-
      이후 원하신다면 이터널 라이프의 추가 지급 및,
      주거 지역 확보까지 약속드립니다.
    ja: |-
      ご希望の場合はエターナルライフの支給と
      住宅の確保についても保証します。
  event_ce006_2_intermission_01_17:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_18:
    speaker: anis
    en: Isn't she promising more than she can offer?
    ko: 쟤, 쟤 너무 허풍 치는 거 아냐?
    ja: |-
      ちょ、ちょっと、
      ハッタリにもほどがあるでしょ？
  event_ce006_2_intermission_01_19:
    speaker: rapi
    en: No, that's all definitely doable. Triangle has more pull than you think.
    ko: |-
      아니. 트라이앵글의 권한은 생각보다 커.
      저 정도는 충분히 가능해.
    ja: |-
      いいえ、トライアングルには
      それができるほどの権限があるわ。
  event_ce006_2_intermission_01_20:
    speaker: neon
    en: I had no idea! I thought she was just a government grunt who liked being a
      maid on the side.
    ko: |-
      높으신 분이었군요…!
      메이드가 취미인 공무원인줄만 알았어요…!
    ja: |-
      そんなご身分だったとは…！
      てっきりメイドが趣味の
      一般公務員ぐらいかと…！
  event_ce006_2_intermission_01_21:
    speaker: privaty
    en: Everyone here can vouch for me and what I'm telling you.
    ko: 제 신원은 이곳에 있는 모두가 증명할 수 있습니다.
    ja: |-
      私の職務については、
      ここにいる全員が証言できます。
  event_ce006_2_intermission_01_22:
    speaker: privaty
    en: So, come with me. Please.
    ko: 그러니 함께 이동해 주세요. 부탁드립니다.
    ja: お話は以上です。ご同行願います。
  event_ce006_2_intermission_01_23:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_24:
    speaker: hermin
    en: I...
    ko: 저는….
    ja: 私は…
  event_ce006_2_intermission_01_25:
    speaker: privaty
    en: Please let me know if there's anything else you would like.
    ko: 예. 원하시는 것이 있다면 얼마든지 말씀해 주세요.
    ja: |-
      ご希望があるのでしたら、
      何でもおっしゃってください。
  event_ce006_2_intermission_01_26:
    speaker: hermin
    en: I... I'm afraid I don't have much faith in the Ark.
    ko: "…저는, 방주를 믿을 수 없습니다."
    ja: "…私は、アークに身を預ける気になれません。"
  event_ce006_2_intermission_01_27:
    speaker: privaty
    en: Excuse me?
    ko: "…예?"
    ja: "…はい？"
  event_ce006_2_intermission_01_28:
    speaker: hermin
    en: The Ark abandoned us.
    ko: 방주는 우릴 버렸습니다.
    ja: 私たちはアークに見捨てられました。
  event_ce006_2_intermission_01_29:
    speaker: hermin
    en: They praised us to the skies. Used us as a symbol of resistance.
    ko: |-
      그렇게나 우릴 추켜세워 놓고는,
      우릴 마치 대항의 상징처럼 써먹어놓고는.
    ja: |-
      持ち上げられ、
      人類の抵抗の象徴として利用された。
  event_ce006_2_intermission_01_30:
    speaker: hermin
    en: They promised to come save us.
    ko: 구하러 온다고 약속해 놓고는.
    ja: 助けに来ると、約束しておいて…
  event_ce006_2_intermission_01_31:
    speaker: hermin
    en: But when we were out here dying, they abandoned us.
    ko: 우리가 그렇게나 외롭게 죽어가고 있을 때 구하러 오지 않았어요.
    ja: |-
      いざ私たちが孤立し、息も絶え絶えという時、
      その助けは来なかった。
  event_ce006_2_intermission_01_32:
    speaker: hermin
    en: You have no idea how much hope we had.
    ko: 얼마나, 얼마나 바랬는지 모릅니다.
    ja: どれほど…どれほど期待していたことか。
  event_ce006_2_intermission_01_33:
    speaker: hermin
    en: We hoped that one day, the Ark would come to save us. That they hadn't forgotten
      about us.
    ko: |-
      방주가 나를 구하러 올 거다,
      방주가 나를 잊었을 리가 없다.
    ja: |-
      アークが助けにくるはずだ、
      私たちを忘れたはずがない。
  event_ce006_2_intermission_01_34:
    speaker: hermin
    en: That's how I survived for decades.
    ko: 그렇게 수십 년을 버텼습니다.
    ja: そう信じて数十年、耐えしのんでいたのです。
  event_ce006_2_intermission_01_35:
    speaker: hermin
    en: Have you all come here to save me?
    ko: 당신은, 당신들은 저를 구하러 오긴 한 겁니까?
    ja: |-
      それをあなたは…
      今さら来たとでも言うのですか？
  event_ce006_2_intermission_01_36:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_37:
    speaker: hermin
    en: You represent something which is inherently traitorous.
    ko: 당신들은 거짓말쟁이들입니다.
    ja: |-
      あなたが代表しているものは、
      偽りをはらんでいる。
  event_ce006_2_intermission_01_38:
    speaker: hermin
    en: It's not your fault.
    ko: 물론 당신의 탓은 아니지요.
    ja: もちろん、あなた個人の責任ではありません。
  event_ce006_2_intermission_01_39:
    speaker: hermin
    en: Maybe there were circumstances beyond your control.
    ko: 사정이 있을 수도 있었겠지요.
    ja: やむを得ない事情があったのかもしれません。
  event_ce006_2_intermission_01_40:
    speaker: hermin
    en: But it doesn't erase all those years that we suffered.
    ko: 그렇다고 해서 우리의 그 시간이 위로되지는 않습니다.
    ja: |-
      だからといって、私たちの苦労が
      水に流せるわけではありません。
  event_ce006_2_intermission_01_41:
    speaker: hermin
    en: So I won't go.
    ko: 그러니 저는 가지 않습니다.
    ja: 私はアークには行きません。
  event_ce006_2_intermission_01_42:
    speaker: hermin
    en: This place is my home now.
    ko: 이곳에서… 이젠 제 고향이 되어버린 이곳에서.
    ja: 今となっては…この場所が私の故郷です。
  event_ce006_2_intermission_01_43:
    speaker: hermin
    en: Let me die here.
    ko: 떠날 수 있게 해 주십시오.
    ja: ここに骨を埋めさせてください。
  event_ce006_2_intermission_01_44:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_45:
    speaker: privaty
    en: Hermin.
    ko: 헤르민님.
    ja: ヘルミンさん。
  event_ce006_2_intermission_01_46:
    speaker: privaty
    en: I understand everything you're saying.
    ko: 당신이 하는 말 모두 이해합니다.
    ja: 言っていることは、全て理解できます。
  event_ce006_2_intermission_01_47:
    speaker: privaty
    en: It's true that the Ark turned its back on you, and it's true that no one came
      to save you.
    ko: |-
      방주가 당신의 기대를 배신한 것도 맞고,
      당신들을 구하러 오지 않은 것도 맞아요.
    ja: |-
      アークがあなたの期待を裏切り、
      あなたたちを見捨てたことは、
      まぎれもなく事実でしょう。
  event_ce006_2_intermission_01_48:
    speaker: privaty
    en: There's nothing I could possibly say to right that wrong,
    ko: 그 마음은 어떤 방식으로도 위로할 수 없겠지만
    ja: それを言いつくろう方法などありません。
  event_ce006_2_intermission_01_49:
    speaker: privaty
    en: but I at least hope that you'll give us a chance.
    ko: 우리에게 기회를 주셨으면 해요.
    ja: ですが、どうか私たちに機会を与えてください。
  event_ce006_2_intermission_01_50:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_51:
    speaker: hermin
    en: You're also from the Ark?
    ko: 당신도 방주의 사람이지요?
    ja: |-
      あなたは、アークに
      忠誠を誓っているのでしょう？
  event_ce006_2_intermission_01_52:
    speaker: privaty
    en: "... Yes."
    ko: "…예."
    ja: "…そうです。"
  event_ce006_2_intermission_01_53:
    speaker: hermin
    en: How can I trust you?
    ko: 제가 당신을 어떻게 믿어야 할까요?
    ja: では、どう信じろというのですか？
  event_ce006_2_intermission_01_54:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_55:
    speaker: privaty
    en: I take pride in where I'm from.
    ko: 저는 제가 몸담은 곳에 자부심을 가지고 있어요.
    ja: 私は、自分の所属に誇りを持っています。
  event_ce006_2_intermission_01_56:
    speaker: privaty
    en: I intend to do right by that pride.
    ko: 계속 자부심을 가지고 싶어요.
    ja: |-
      そして、その誇りを
      持ち続けたいとも考えています。
  event_ce006_2_intermission_01_57:
    speaker: privaty
    en: To that end, I will do everything in my power to protect you.
    ko: 그러기 위해서라도, 저는 전력을 다해 당신을 보호하고.
    ja: |-
      私は私の誇りに賭けて、
      持てる力の全てをもってあなたを守ります。
  event_ce006_2_intermission_01_58:
    speaker: privaty
    en: And I want to sincerely apologize to you.
    ko: 당신에게 진심으로 사과하고 싶어요.
    ja: それを償いとさせてください。
  event_ce006_2_intermission_01_59:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_60:
    speaker: hermin
    en: I'm not going.
    ko: 저는 가지 않습니다.
    ja: 同意はできません。
  event_ce006_2_intermission_01_61:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_62:
    speaker: privaty
    en: I will transfer
    ko: 이곳에 있는 데이터.
    ja: ここにあるもの…
  event_ce006_2_intermission_01_63:
    speaker: privaty
    en: all of the data here to the Ark.
    ko: 수많은 예술 자료들을 모두 방주로 옮길게요.
    ja: 芸術品のデータも全て、アークへ運びます。
  event_ce006_2_intermission_01_64:
    speaker: hermin
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_intermission_01_65:
    speaker: privaty
    en: You... and your friends,
    ko: 당신이, 아니 당신들이.
    ja: あなたが、いえ、ここにいたみなさんが…
  event_ce006_2_intermission_01_66:
    speaker: privaty
    en: have kept this information safe for so long.
    ko: 그 긴 시간 동안 지켜낸 것들 모두.
    ja: 長い間守ってきたものですから。
  event_ce006_2_intermission_01_67:
    speaker: privaty
    en: I'll make sure that it's all brought back to the Ark, every last piece of
      data.
    ko: 단 하나도 빠트리지 않고 방주로 가져가겠습니다.
    ja: 一つも残さず、アークへ移送します。
  event_ce006_2_intermission_01_68:
    speaker: privaty
    en: So come with me.
    ko: 그러니 함께 가주세요.
    ja: あなたも来ていただけますね。
  event_ce006_2_intermission_01_69:
    speaker: privaty
    en: The Ark may have abandoned you once before, but let them now show you the
      respect that you deserve.
    ko: 당신의 그 숭고함에, 당신을 버린 방주가 존경을 표하게 해 주세요.
    ja: |-
      あなたたちを見捨てたアークに、
      忘れるべきではなかった敬意を
      思い出させてやってください。
  event_ce006_2_intermission_01_70:
    speaker: privaty
    en: Please.
    ko: 부탁합니다.
    ja: お願いします。
  event_ce006_2_intermission_01_71:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_72:
    speaker: hermin
    en: All of this art... will it continue on?
    ko: 예술이… 우리가 지켜온 것들이… 이어질 수 있는 건가요?
    ja: |-
      芸術は…私たちが守ってきたものは…
      受け継がれるということですか？
  event_ce006_2_intermission_01_73:
    speaker: privaty
    en: Of course.
    ko: 물론입니다.
    ja: 当然でしょう。
  event_ce006_2_intermission_01_74:
    speaker: privaty
    en: As it should.
    ko: 응당, 그렇게 되어야 해요.
    ja: 受け継がれてしかるべきです。
  event_ce006_2_intermission_01_75:
    speaker: hermin
    en: Yes...
    ko: 아아….
    ja: ああ…
  event_ce006_2_intermission_01_76:
    speaker: hermin
    en: Yes... for this, we...
    ko: |-
      그래… 그래요….
      우리는… 이걸 위해….
    ja: |-
      そう…そうか…
      私たちは…そのために…
  event_ce006_2_intermission_01_77:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_78:
    speaker: hermin
    en: Very well.
    ko: 알겠습니다.
    ja: 分かりました。
  event_ce006_2_intermission_01_79:
    speaker: hermin
    en: I will go to the Ark,
    ko: 방주로 가겠습니다.
    ja: アークへ連れていってください。
  event_ce006_2_intermission_01_80:
    speaker: hermin
    en: along with everything we have kept safe.
    ko: 우리가 지켜온 것들과 함께.
    ja: 私たちが守ってきたものとともに。
  event_ce006_2_intermission_01_81:
    speaker: privaty
    en: I will ensure your safe passage.
    ko: 전력을 다해 모시겠습니다.
    ja: 力の限り、お守りいたします。
  event_ce006_2_intermission_01_82:
    speaker: "<Self>"
    en: Privaty.
    ko: "…프리바티."
    ja: "…プリバティ"
  event_ce006_2_intermission_01_83:
    speaker: anis
    en: Uh... are you okay?
    ko: "…야. 너 괜찮은 거 맞아?"
    ja: "…ちょっと、こんなことして大丈夫？"
  event_ce006_2_intermission_01_84:
    speaker: privaty
    en: No, I'm not.
    ko: 괜찮지 않겠죠.
    ja: 大丈夫ではありません。
  event_ce006_2_intermission_01_85:
    speaker: privaty
    en: I might be charged with treason, and I'm prepared for the possibility of having
      my memories wiped.
    ko: |-
      반역죄가 적용될 수도 있고,
      그로 인한 기억 소거까지 각오하고 있어요.
    ja: |-
      最悪の場合は反逆罪に問われますし、
      記憶消去処分も覚悟の上です。
  event_ce006_2_intermission_01_86:
    speaker: privaty
    en: Be that as it may, this is the right thing to do.
    ko: 그래도, 이게 맞아요.
    ja: それでも、これが私のするべきことです。
  event_ce006_2_intermission_01_87:
    speaker: privaty
    en: I'm certain of it.
    ko: "…예. 이게 맞아요. 그건 확실해요."
    ja: "…ええ。正しいことです。間違いなく。"
  event_ce006_2_intermission_01_88:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_89:
    speaker: privaty
    en: We may not have the full picture of what happened in that bunker for all those
      years,
    ko: 벙커 안에서 그 긴 시간 동안 무슨 일이 있었는지는 알 수 없지만.
    ja: |-
      このシェルターの中で何があったのかは
      分かりませんが…
  event_ce006_2_intermission_01_90:
    speaker: privaty
    en: but it's clear that
    ko: |-
      확실한 건 방주에서 구하러 오지 않았고,
      이들은 그 시간 동안 여기에….
    ja: |-
      アークの救援が来なかったことは
      間違いありません。
  event_ce006_2_intermission_01_91:
    speaker: privaty
    en: the Ark left them there to die.
    ko: 버려져있었어요.
    ja: 長い間助けを待っていたのでしょう。
  event_ce006_2_intermission_01_92:
    speaker: privaty
    en: So we need to save him.
    ko: 그러니 구해야 해요.
    ja: だったら、助けなければ。
  event_ce006_2_intermission_01_93:
    speaker: privaty
    en: This is all going to be one huge headache,
    ko: |-
      이로 인해 일어날 수많은 문제들이 있겠지만,
      솔직히 말해서 엄청 골치 아플 테지만.
    ja: |-
      多くの問題が起こるでしょうし、
      正直、頭が痛くなります。
  event_ce006_2_intermission_01_94:
    speaker: privaty
    en: and the Central Government's reputation might be completely ruined because
      of it,
    ko: 중앙 정부의 체면이 바닥에 떨어질 수도 있겠지만.
    ja: 中央政府の立場も大きく揺らぐかもしれません。
  event_ce006_2_intermission_01_95:
    speaker: privaty
    en: but I want to believe that this organization which I trust will do what it's
      supposed to.
    ko: |-
      내가 믿는 중앙 정부가,
      중앙 정부로서 응당 해야 할 일을 했으면 좋겠어요.
    ja: |-
      しかし、私の信じる中央政府は
      するべきことをする組織であれと
      願っています。
  event_ce006_2_intermission_01_96:
    speaker: privaty
    en: The first thing we need to do is save Hermin. We can think about the rest
      later.
    ko: |-
      일단 구해야 해요.
      뒷일은 나중에 생각하더라도.
    ja: |-
      まずは彼を助けること。
      今後のことはその後です。
  event_ce006_2_intermission_01_97:
    speaker: anis
    en: Not bad.
    ko: 제법이잖아.
    ja: 見直したわ。
  event_ce006_2_intermission_01_98:
    speaker: privaty
    en: Hmph.
    ko: 흥.
    ja: ふんっ…
  event_ce006_2_intermission_01_99:
    speaker: elegg
    en: You're really tackling this head-on, aren't you?
    ko: 들이받아버리는 거군여?
    ja: 真正面から事を起こす気ですかな？
  event_ce006_2_intermission_01_100:
    speaker: privaty
    en: I want to continue to be proud of what I believe in.
    ko: 저는 자부심을 계속 가지고 싶으니까요.
    ja: 私が誇りを持ち続けるためです。
  event_ce006_2_intermission_01_101:
    speaker: ce006_03
    en: If you realized that the thing you believed in is rotten, do you intend on
      destroying it?
    ko: "…믿고 있던 것이 잘못되었다고 생각하면, 부숴버리는 건가요?"
    ja: |-
      …信じていたものが間違ってるって
      分かったら、壊しちゃえってことですか？
  event_ce006_2_intermission_01_102:
    speaker: privaty
    en: I have no intention of destroying it.
    ko: 부술 생각은 없어요.
    ja: 壊すつもりはありません。
  event_ce006_2_intermission_01_103:
    speaker: privaty
    en: I simply want to see how they'll respond when I act this way.
    ko: |-
      보고 싶은 거에요.
      제가 이렇게 행동했을 때 중앙 정부가 어떤 결정을 내릴지.
    ja: |-
      ただ、見届けたいだけです。
      私のしたことに、中央政府がどう答えるか。
  event_ce006_2_intermission_01_104:
    speaker: privaty
    en: I'm doing this because I want them to prove to me that I can trust them completely.
    ko: 더 믿고 싶어서 하는 행동이에요.
    ja: 信じたいからこそ、こうするのです。
  event_ce006_2_intermission_01_105:
    speaker: ce006_03
    en: All right then, let me rephrase the question.
    ko: 그럼.
    ja: じゃあ…
  event_ce006_2_intermission_01_106:
    speaker: ce006_03
    en: If what you once believed in proves to be rotten to the core,
    ko: 믿고 있던 것이 끝까지 나를 실망시키면.
    ja: 信じていたことが、本当に間違っていて…
  event_ce006_2_intermission_01_107:
    speaker: ce006_03
    en: beyond all doubt,
    ko: 잘못되었다고 판단되면.
    ja: 救いようのないものなら。
  event_ce006_2_intermission_01_108:
    speaker: ce006_03
    en: will you destroy it?
    ko: 부술 건가요?
    ja: 壊しますか？
  event_ce006_2_intermission_01_109:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_110:
    speaker: privaty
    en: Do you really need me to answer that?
    ko: 대답이 필요할까요?
    ja: その答えが必要ですか？
  event_ce006_2_intermission_01_111:
    speaker: ce006_03
    en: No.
    ko: "…아뇨."
    ja: "…いいえ。"
  event_ce006_2_intermission_01_112:
    speaker: ce006_03
    en: You've already answered.
    ko: 대답을 들은 거나 마찬가지니까요.
    ja: もう答えをもらったみたいなものです。
  event_ce006_2_intermission_01_113:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_intermission_01_114:
    speaker: privaty
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  event_ce006_2_intermission_01_115:
    speaker: "<Self>"
    en: Yes?
    ko: 응.
    ja: ああ
  event_ce006_2_intermission_01_116:
    speaker: privaty
    en: Please help with the transfer of the data here.
    ko: 이곳의 데이터를 옮기는 걸 도와주세요.
    ja: ここのデータの搬出を手伝ってください。
  event_ce006_2_intermission_01_117:
    speaker: privaty
    en: I made a lot of promises back there, but I honestly have no idea how to go
      about it.
    ko: 큰소리는 쳐놨지만, 솔직히 어떻게 해야 할지 모르겠거든요.
    ja: |-
      大それた約束をしてしまいましたが、
      正直、どうすればいいのか分かりません。
  event_ce006_2_intermission_01_118:
    speaker: "<Self>"
    en: Okay. I'll help.
    ko: 그래. 도울게.
    ja: 問題ない、手伝おう
  event_ce006_2_intermission_01_119:
    speaker: privaty
    en: Thank you.
    ko: "…고마워요."
    ja: "…ありがとうございます。"
event_ce006_3_01_s:
  event_ce006_3_01_s_1:
    speaker: "<Narration>"
    en: "*Buzzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_01_s_2:
    speaker: bunkerchild
    en: This person seems... a little different.
    ko: "…이 사람은 조금 다르게 생겼네요?"
    ja: "…この人、ちょっと変わった見た目だね？"
  event_ce006_3_01_s_3:
    speaker: middlehermin
    en: That's because this is not a person, but a robot.
    ko: "…딸아. 사람이 아니라 로봇이라고 하는 거란다."
    ja: "…これは人じゃなくて、ロボットというんだよ。"
  event_ce006_3_01_s_4:
    speaker: bunkerchild
    en: A robot?
    ko: 로봇?
    ja: ロボット？
  event_ce006_3_01_s_5:
    speaker: middlehermin
    en: That's right. It may seem human-like, but... uh...
    ko: 그래. 사람과 비슷하게 생겼지만 어….
    ja: そうだ。人間に似ているけど…
  event_ce006_3_01_s_6:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_s_7:
    speaker: middlehermin
    en: Huh. Trying to explain this is harder than I thought.
    ko: 막상 설명하려고 하니 로봇의 정의를 잘 설명하기 힘들군요.
    ja: |-
      ロボットが何か説明しようとするのは
      意外と難しいですね。
  event_ce006_3_01_s_8:
    speaker: middlehermin
    en: Com, can you help me out?
    ko: 좀 도와주시겠습니까?
    ja: ちょっと助けてもらえますか？
  event_ce006_3_01_s_9:
    speaker: com
    en: A robot's body is made of machinery.
    ko: 신체가 기계로 이루어져 있다.
    ja: 私の身体は機械で構成されている。
  event_ce006_3_01_s_10:
    speaker: com
    en: It has no heart.
    ko: 마음이 없다.
    ja: そして、精神を持たない。
  event_ce006_3_01_s_11:
    speaker: bunkerchild
    en: So you don't have a heart?
    ko: 마음이 없어요?
    ja: セーシン？心がないの？
  event_ce006_3_01_s_12:
    speaker: com
    en: That is correct. A robot, like myself, does not have a heart.
    ko: 그렇다. 로봇에게는 마음이 없다.
    ja: そうだ。ロボットには心がない。
  event_ce006_3_01_s_13:
    speaker: bunkerchild
    en: Then how do you talk?
    ko: 그럼 말은 어떻게 해요?
    ja: じゃあ、どうしてお話しできるの？
  event_ce006_3_01_s_14:
    speaker: com
    en: The AI system selects a suitable response for the situation, then formulates
      an auditory output, in the form of words or sentences, which are then broadcast
      through a speaker.
    ko: |-
      인공지능을 통해 상황에 맞는 답변을 설정한 후,
      스피커를 통해 단어나 문장을 전달한다.
    ja: |-
      人工知能が状況に合致する回答を算出した後、
      電気音響変換器を通して言語を伝達する。
  event_ce006_3_01_s_15:
    speaker: bunkerchild
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_ce006_3_01_s_16:
    speaker: com
    en: Complexity of language deemed unsuitable for socially isolated child. Confirmed.
    ko: 문장의 난이도가 사회와 단절된 소녀에게는 적합하지 않다고 판단.
    ja: |-
      対象が一般社会から隔絶されており
      表現の難易度が不適切であったと推測する。
  event_ce006_3_01_s_17:
    speaker: com
    en: Reducing linguistic complex...
    ko: 문장의 난이도를 대폭 낮추도록 하겠---.
    ja: 使用する表現の難度を大幅に抑制――
  event_ce006_3_01_s_18:
    speaker: bunkerchild
    en: What is your name?
    ko: 이름이 뭐예요?
    ja: 名前は何ていうの？
  event_ce006_3_01_s_19:
    speaker: com
    en: Com.
    ko: 콤.
    ja: コム。
  event_ce006_3_01_s_20:
    speaker: bunkerchild
    en: Can I climb on your head, Com?
    ko: 콤. 나 콤 머리 위에 올라타봐도 돼요?
    ja: ねぇコム、頭の上に乗ってもいい？
  event_ce006_3_01_s_21:
    speaker: com
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_s_22:
    speaker: com
    en: That is possible.
    ko: 가능하다.
    ja: いい。
  event_ce006_3_01_s_23:
    speaker: bunkerchild
    en: Really? Wow. No one else here lets me climb on them.
    ko: 진짜요? 우와. 아빠들이랑 엄마들은 머리 위에 올라타면 안 된다고 했는데.
    ja: |-
      ホントに？やったぁ！
      パパたちにもママたちにも、
      頭の上には乗っちゃダメって言われてたから…
  event_ce006_3_01_s_24:
    speaker: com
    en: Climbing on another person's head is a favorite style of play among children.
    ko: 로봇의 머리에 올라타는 건 아이들이 선호하는 놀이방식 중 하나다.
    ja: |-
      ロボットの頭部に乗ることは、
      子どもたちが好む遊びの一つ。
  event_ce006_3_01_s_25:
    speaker: middlehermin
    en: You'll have to excuse her. Sometimes she says some awfully strange things.
    ko: 죄송합니다. 저희 딸이 이상한 소릴….
    ja: すみません。娘がおかしなことを…
  event_ce006_3_01_s_26:
    speaker: com
    en: It is no problem.
    ko: 문제없다.
    ja: 問題ない。
  event_ce006_3_01_s_27:
    speaker: middlehermin
    en: All right... if you say so.
    ko: |-
      어….
      그럼 부탁드리겠습니다.
    ja: |-
      ええと…
      では、よろしくお願いします。
  event_ce006_3_01_s_28:
    speaker: middlehermin
    en: I'm going to talk to the Nikkes that came with Com, so you two have a nice
      time playing together, okay?
    ko: 딸. 아빠는 콤이랑 같이 온 니케분들이랑 얘기 좀 할 테니까, 콤이랑 잘 놀고 있어. 알겠지?
    ja: |-
      お父さんは、コムと一緒に来たニケのみなさんと
      お話がある。コムと仲よく遊んでいるんだよ。
      いいかい？
  event_ce006_3_01_s_29:
    speaker: bunkerchild
    en: Okay!
    ko: 네!
    ja: はーい！
  event_ce006_3_01_s_30:
    speaker: "<Narration>"
    en: Soon after.
    ko: 잠시 후.
    ja: しばらくして
  event_ce006_3_01_s_31:
    speaker: bunkerchild
    en: Heheh! Wheeeee! So high!
    ko: 흐헤! 흐헤헤헤! 높다~!
    ja: あはは！わーい！たか～い！
  event_ce006_3_01_s_32:
    speaker: bunkerchild
    en: I'm not too heavy, am I, Com?
    ko: 콤! 안 무거워요?
    ja: コム！重くないの？
  event_ce006_3_01_s_33:
    speaker: com
    en: I am a robot meant to provide combat support. I am designed to carry far heavier
      loads than this.
    ko: 나는 전투 보조형 로봇. 훨씬 무거운 짐을 짊어지고 다닌다.
    ja: |-
      私は戦闘補助用ロボット。
      いつももっと重い荷物を運んでいる。
  event_ce006_3_01_s_34:
    speaker: bunkerchild
    en: So you're not uncomfortable?
    ko: 안 불편해요?
    ja: 痛くない？
  event_ce006_3_01_s_35:
    speaker: com
    en: No, I am not uncomfortable.
    ko: 불편하지 않다.
    ja: ない。
  event_ce006_3_01_s_36:
    speaker: com
    en: Seeing a child enjoy themselves while propped atop my head...
    ko: 아이들이 머리 위에 올라와서 즐거워하는 모습.
    ja: 子どもが頭の上で楽しそうにしている。
  event_ce006_3_01_s_37:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_s_38:
    speaker: com
    en: It is pleasing.
    ko: 보기에 좋다.
    ja: ほほえましい光景。
  event_ce006_3_01_s_39:
    speaker: bunkerchild
    en: No way!
    ko: 아핫!
    ja: あはっ！
  event_ce006_3_01_s_40:
    speaker: bunkerchild
    en: You're lying.
    ko: 뭐야~ 콤 거짓말했네요?
    ja: な～んだ。コム、ウソついたの？
  event_ce006_3_01_s_41:
    speaker: com
    en: Lying is not a capability which I possess.
    ko: 나는 거짓말을 하는 기능이 없다.
    ja: 私にウソをつく機能はない。
  event_ce006_3_01_s_42:
    speaker: bunkerchild
    en: You do have a heart.
    ko: 마음, 있잖아요.
    ja: でも、ちゃんと心があるじゃない。
  event_ce006_3_01_s_43:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_s_44:
    speaker: com
    en: Must head to the Ark.
    ko: 방주로 간다.
    ja: アークに向かっている。
  event_ce006_3_01_s_45:
    speaker: com
    en: For revenge.
    ko: 복수한다.
    ja: 復讐のためだ。
  event_ce006_3_01_s_46:
    speaker: ce006_02
    en: So you do know how to talk.
    ko: 호오. 말을 할 줄 아는군.
    ja: ほう。口がきけるのか。
  event_ce006_3_01_s_47:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_s_48:
    speaker: ce006_02
    en: I take it you're equipped with AI?
    ko: 인공지능 탑재형인가?
    ja: 人工知能を搭載しているのか？
  event_ce006_3_01_s_49:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_01_s_50:
    speaker: ce006_02
    en: Then this should be fairly painless.
    ko: 그렇다면 얘기가 빠르겠어.
    ja: それなら話が早い。
  event_ce006_3_01_s_51:
    speaker: com
    en: Who are you?
    ko: 넌 누구지?
    ja: 君は誰だ？
  event_ce006_3_01_s_52:
    speaker: ce006_02
    en: I ask the questions.
    ko: 질문은 내가 해.
    ja: 聞いているのは私の方だ。
  event_ce006_3_01_s_53:
    speaker: ce006_02
    en: Explain to me what this place is.
    ko: 이곳이 어디인지 설명해라.
    ja: ここはどこだ？説明しろ。
event_ce006_3_01_e:
  event_ce006_3_01_e_1:
    speaker: "<Narration>"
    en: "*Buzzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_01_e_2:
    speaker: bunkerchild
    en: Com! Let's play hide and seek!
    ko: 콤! 우리 숨바꼭질해요!
    ja: コム！一緒にかくれんぼしよう！
  event_ce006_3_01_e_3:
    speaker: com
    en: We have played hide and seek three times today.
    ko: 금일 3회의 숨바꼭질을 진행했다.
    ja: 今日はもうかくれんぼを3回実行している。
  event_ce006_3_01_e_4:
    speaker: bunkerchild
    en: Let's do it again!
    ko: 또 해요 또!
    ja: もう1回！
  event_ce006_3_01_e_5:
    speaker: com
    en: Very well.
    ko: "---알겠다."
    ja: "――分かった。"
  event_ce006_3_01_e_6:
    speaker: bunkerchild
    en: I'll hide, and you come find me after counting for one minute.
    ko: 그럼 내가 숨을 테니까, 1분 세고 찾아요!
    ja: じゃあ、隠れるよ。1分数えてからね！
  event_ce006_3_01_e_7:
    speaker: bunkerchild
    en: "... Go!"
    ko: 시--작! 이히히!
    ja: よーい、はじめ！へへへ！
  event_ce006_3_01_e_8:
    speaker: "<Narration>"
    en: "*Tadada*"
    ko: 타다다닷-!
    ja: ダダダダッ…！
  event_ce006_3_01_e_9:
    speaker: com
    en: Commencing countdown.
    ko: 카운트다운 시작.
    ja: カウントダウン開始。
  event_ce006_3_01_e_10:
    speaker: middlehermin
    en: "... Are you playing hide and seek again?"
    ko: "…콤. 또 숨바꼭질인가요."
    ja: "…コム、またかくれんぼですか。"
  event_ce006_3_01_e_11:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_01_e_12:
    speaker: middlehermin
    en: Seems like you're always the one who has to go looking. You don't mind?
    ko: "…얼마 전부터 콤만 찾는 쪽인 것 같은데, 괜찮나요?"
    ja: |-
      …さっきからずっとコムが鬼ですが、
      大丈夫ですか？
  event_ce006_3_01_e_13:
    speaker: com
    en: It is fine. If I hide, I am quickly discovered due to the sounds of my engine.
    ko: |-
      괜찮다.
      나 숨으면 엔진음 때문에 금방 들킨다.
    ja: |-
      問題ない。
      私が隠れても動作音のせいですぐに見つかる。
  event_ce006_3_01_e_14:
    speaker: com
    en: When I am the seeker, I can find her instantly using my thermal sensors, but
      I intentionally delay my discovery.
    ko: 그리고 내가 찾을 땐 열원 감지로 금방 찾을 수 있지만
    ja: |-
      しかし、私がさがす時は
      熱源感知ですぐに探知できる。
  event_ce006_3_01_e_15:
    speaker: com
    en: I even pretend that I cannot find her on occasion.
    ko: |-
      일부러 시간을 끈다.
      간헐적으로 못 찾는 척도 한다.
    ja: |-
      ただし、わざと時間をかける。
      見つけられないふりをする時もある。
  event_ce006_3_01_e_16:
    speaker: com
    en: This makes her very satisfied.
    ko: 그러면 아주 만족한다.
    ja: そうすると、とても満足した表情をする。
  event_ce006_3_01_e_17:
    speaker: middlehermin
    en: You've really gotten the knack of playing with children.
    ko: 세상에. 아이랑 놀아주는 방법을 터득하셨군요.
    ja: |-
      なんと…子どもとのつきあい方まで
      習得できるのですね。
  event_ce006_3_01_e_18:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_01_e_19:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_20:
    speaker: middlehermin
    en: Thank you for spending so much time with her.
    ko: "…항상 우리 딸이랑 잘 놀아줘서 고맙습니다."
    ja: |-
      …いつも娘と遊んでくれて
      ありがとうございます。
  event_ce006_3_01_e_21:
    speaker: com
    en: Having me as her playmate is the most efficient choice.
    ko: 내가 놀아주는 게 가장 효율적.
    ja: 私が相手をするのがもっとも効率的だ。
  event_ce006_3_01_e_22:
    speaker: com
    en: The child is energetic, and the others in this bunker need to preserve their
      energy,
    ko: |-
      아이 체력 좋다.
      벙커의 사람들 체력 온존해야 한다.
    ja: |-
      子どもは体力が多い。
      シェルターの人々は
      体力を温存する必要がある。
  event_ce006_3_01_e_23:
    speaker: com
    en: whereas I only need to be recharged in order to operate at full capacity.
    ko: 나는 충전만 하면 온전한 출력을 낼 수 있다.
    ja: 私は充電さえ可能なら、常に全力で動ける。
  event_ce006_3_01_e_24:
    speaker: middlehermin
    en: Thank you all the same.
    ko: "…그래도, 고맙습니다."
    ja: "…それでも、助かっています。"
  event_ce006_3_01_e_25:
    speaker: middlehermin
    en: She's been practically beaming lately, so we're really grateful.
    ko: 딸이 요즘 부쩍 밝아져서, 정말 고마워하고 있어요.
    ja: |-
      娘はコムと会ってから明るくなりました。
      本当に感謝しています。
  event_ce006_3_01_e_26:
    speaker: com
    en: We are the ones who are grateful.
    ko: 고마운 건 우리.
    ja: 感謝を言うべきはこちら側。
  event_ce006_3_01_e_27:
    speaker: com
    en: You took us in even though we are deserters.
    ko: 탈주한 우리를 받아줬다.
    ja: 脱走した我々を受け入れてくれた。
  event_ce006_3_01_e_28:
    speaker: com
    en: You gave us shelter and food.
    ko: 머물 곳 제공하고, 음식 제공했다.
    ja: 隠れる場所と食べ物を提供してくれている。
  event_ce006_3_01_e_29:
    speaker: middlehermin
    en: Well, it's not like Nikkes and robots put that much of a strain on our food
      provisions.
    ko: 뭐… 니케 분들이랑 로봇이라 음식은 크게 안 드니까요.
    ja: |-
      まあ…ニケの皆さんもロボットも、
      食糧はそれほど必要になりませんから。
  event_ce006_3_01_e_30:
    speaker: com
    en: Thank you all the same.
    ko: 그래도 고맙다.
    ja: それでも、感謝している。
  event_ce006_3_01_e_31:
    speaker: com
    en: My colleagues have become happier as well.
    ko: 내 동료들도 요즘 부쩍 밝아졌다.
    ja: 私の仲間たちも、最近とても明るくなった。
  event_ce006_3_01_e_32:
    speaker: com
    en: This arrangement is good for everyone.
    ko: 서로 좋은 것.
    ja: お互いに好影響。
  event_ce006_3_01_e_33:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_34:
    speaker: middlehermin
    en: Com. Are you really a robot?
    ko: 콤. 정말 로봇인가요?
    ja: コム、あなたは…本当にロボットなのですか？
  event_ce006_3_01_e_35:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_01_e_36:
    speaker: middlehermin
    en: It feels to me like you're becoming more and more human.
    ko: 점점 사람 같아지는 느낌이….
    ja: だんだん人間らしさが増しているような…
  event_ce006_3_01_e_37:
    speaker: bunkerchild
    en: Com! Aren't you going to look for me? My legs are falling asleep.
    ko: 콤-! 안 찾아요!? 나 다리 저려요!
    ja: コムー！早く見つけてよ！足がしびれちゃう～！
  event_ce006_3_01_e_38:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_39:
    speaker: com
    en: I must go play.
    ko: 놀고 오겠다.
    ja: 遊びに戻る。
  event_ce006_3_01_e_40:
    speaker: middlehermin
    en: Haha, I'll leave you to it.
    ko: 하하. 부탁합니다.
    ja: あはは。お願いします。
  event_ce006_3_01_e_41:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_42:
    speaker: "<Narration>"
    en: After hearing Com's explanation, Raven falls silent for a while, deep in thought.
    ko: 콤의 설명을 들은 레이븐은 한참 동안 아무 말 없이 생각에 잠겨있었다.
    ja: |-
      コムの説明を聞いたレイヴンは、
      しばらく何も言わずに考え込んだ
  event_ce006_3_01_e_43:
    speaker: ce006_02
    en: Hmm...
    ko: "…흐음."
    ja: "…ふん…"
  event_ce006_3_01_e_44:
    speaker: ce006_02
    en: Could this be a different location?
    ko: |-
      여러 가지 가능성을 열어놓고 본다면….
      여긴 다른 장소….
    ja: |-
      あらゆる可能性を考慮に入れるなら…
      ここは全く違う…
  event_ce006_3_01_e_45:
    speaker: ce006_02
    en: Or a different world entirely? No, that's ridiculous.
    ko: |-
      …아니. 다른 세계인가.
      어이가 없군.
    ja: |-
      …いや、別の世界か。
      呆れたな。
  event_ce006_3_01_e_46:
    speaker: ce006_02
    en: Tell me how to get back.
    ko: |-
      로봇.
      돌아갈 방법에 대해 얘기해라.
    ja: |-
      ロボット。
      元の世界に戻る方法を教えろ。
  event_ce006_3_01_e_47:
    speaker: com
    en: I do not know.
    ko: 모른다.
    ja: 分からない。
  event_ce006_3_01_e_48:
    speaker: ce006_02
    en: Let me rephrase the question in a way you can understand.
    ko: 내가 이해하기 어렵게 말한 모양이네.
    ja: 正しく理解できなかったようだな。
  event_ce006_3_01_e_49:
    speaker: ce006_02
    en: Find a route to get back, then tell me what that route is.
    ko: |-
      돌아갈 방법을 찾아서,
      나에게 말해.
    ja: |-
      元の世界に戻る方法を探して、
      私に教えろ。
  event_ce006_3_01_e_50:
    speaker: com
    en: I cannot.
    ko: 찾을 수 없다.
    ja: 探し方が分からない。
  event_ce006_3_01_e_51:
    speaker: ce006_02
    en: Then take me to someone who can.
    ko: 그렇다면 방법을 알법한 자나 장소로 안내해.
    ja: |-
      なら、手がかりがつかめそうな場所へ
      連れていけ。
  event_ce006_3_01_e_52:
    speaker: com
    en: I do not know.
    ko: 모른다.
    ja: 分からない。
  event_ce006_3_01_e_53:
    speaker: ce006_02
    en: And what about the Ark?
    ko: 방주.
    ja: アーク。
  event_ce006_3_01_e_54:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_e_55:
    speaker: ce006_02
    en: I heard you muttering to yourself earlier. Something about an Ark.
    ko: 네가 혼자서 중얼거린 방주라는 단어.
    ja: お前が言った言葉だ。
  event_ce006_3_01_e_56:
    speaker: ce006_02
    en: Sounds to me like the name of a place.
    ko: 장소를 의미하는 건 확실하겠군.
    ja: 場所の名前だろう。
  event_ce006_3_01_e_57:
    speaker: ce006_02
    en: Take me there.
    ko: 그곳으로 안내해.
    ja: そこへ案内しろ。
  event_ce006_3_01_e_58:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_e_59:
    speaker: com
    en: What are you planning on doing at the Ark?
    ko: 방주로 가서 뭘 어쩔 생각이지.
    ja: アークへ行ってどうする？
  event_ce006_3_01_e_60:
    speaker: ce006_02
    en: I'm going to get the information I need, and then head back.
    ko: |-
      원하는 정보를 얻는다.
      그리고 돌아간다.
    ja: |-
      必要な情報を手に入れ、
      あるべき場所へ帰る。
  event_ce006_3_01_e_61:
    speaker: ce006_02
    en: That's it.
    ko: 그걸로 끝이야.
    ja: それで終わりだ。
  event_ce006_3_01_e_62:
    speaker: ce006_02
    en: Of course, if someone decides to get in my way,
    ko: 물론, 내 목적을 방해하는 뭔가가 있다면….
    ja: もちろん、何かが邪魔をしてくれば…
  event_ce006_3_01_e_63:
    speaker: ce006_02
    en: that could complicate matters.
    ko: 이야기는 좀 더 복잡해지겠지만 말이야.
    ja: 話は少し複雑になるだろうがな。
  event_ce006_3_01_e_64:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_e_65:
    speaker: com
    en: What will happen if I decline?
    ko: 거절하면 어떻게 되지?
    ja: 拒否すれば、どうなる？
  event_ce006_3_01_e_66:
    speaker: ce006_02
    en: That's very simple.
    ko: 단순한 일이 일어나겠지.
    ja: 簡単だ。
  event_ce006_3_01_e_67:
    speaker: "<Narration>"
    en: Raven points her sword at Com.
    ko: 레이븐은 검을 콤의 얼굴을 향해 겨누었다.
    ja: レイヴンはコムの頭部に剣を突きつけた
  event_ce006_3_01_e_68:
    speaker: ce006_02
    en: I'll continue wandering around, looking for another solution to my problem,
    ko: 나는 다른 방법을 찾아 헤멜테고
    ja: 私は他の方法を探して余計な時間を使い…
  event_ce006_3_01_e_69:
    speaker: ce006_02
    en: and you'll become a broken pile of metal by the wayside. Yet another victim
      of an unfortunate "accident".
    ko: 너는 길에서 [사고로 인해] 부서진 로봇이 될 테고.
    ja: |-
      お前は「事故に遭った」ロボットの残骸として
      道ばたに転がる。
  event_ce006_3_01_e_70:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_e_71:
    speaker: com
    en: Are you strong?
    ko: 너는 강한가?
    ja: 君は強いのか？
  event_ce006_3_01_e_72:
    speaker: ce006_02
    en: Haha.
    ko: 큭큭.
    ja: ククッ…
  event_ce006_3_01_e_73:
    speaker: ce006_02
    en: That's an interesting question.
    ko: 재밌는 질문이네.
    ja: 面白い質問だ。
  event_ce006_3_01_e_74:
    speaker: ce006_02
    en: I would love to show you, but unfortunately, I can't.
    ko: 너한테 보여주고 싶은데, 아쉽지만 그렇게는 할 수 없겠어.
    ja: 見せてやりたいが、残念ながら難しい。
  event_ce006_3_01_e_75:
    speaker: ce006_02
    en: I'm prone to underestimating my own strength.
    ko: 힘 조절 같은 것엔 재주가 없거든.
    ja: 手加減する才能はないからな。
  event_ce006_3_01_e_76:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_01_e_77:
    speaker: com
    en: Very well.
    ko: 좋다.
    ja: 分かった。
  event_ce006_3_01_e_78:
    speaker: com
    en: I will take you.
    ko: 안내한다.
    ja: 案内しよう。
  event_ce006_3_01_e_79:
    speaker: com
    en: But not to the Ark.
    ko: 하지만 방주로 안내하진 않는다.
    ja: しかし、アークではない。
  event_ce006_3_01_e_80:
    speaker: ce006_02
    en: What?
    ko: 뭐?
    ja: なぜだ？
  event_ce006_3_01_e_81:
    speaker: com
    en: I know how you can go back.
    ko: 네가 돌아갈 방법을 안다.
    ja: 元の世界に戻る方法を知っている。
  event_ce006_3_01_e_82:
    speaker: com
    en: To be precise, I know exactly where is the key to your return home can be
      found.
    ko: 정확히는 네가 돌아갈 방법이 있는 곳의 위치를 안다.
    ja: 正確には、問題を解決できる場所を知っている。
  event_ce006_3_01_e_83:
    speaker: com
    en: I will guide you there.
    ko: 그곳으로 안내하겠다.
    ja: そこへ案内する。
  event_ce006_3_01_e_84:
    speaker: ce006_02
    en: How do you know all this?
    ko: 그걸 네가 어떻게 아는 거지?
    ja: なぜそんなことを知っている？
  event_ce006_3_01_e_85:
    speaker: com
    en: I harvested some data while you were unconscious.
    ko: 기절한 사이에 데이터를 훔쳤다.
    ja: データを盗んだ。
  event_ce006_3_01_e_86:
    speaker: ce006_02
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_ce006_3_01_e_87:
    speaker: com
    en: If you defeat the Rapture there, known as Gatekeeper, then you can go back.
    ko: 그곳에 있는 랩쳐, 게이트 키퍼를 쓰러뜨리면 너는 돌아갈 수 있다.
    ja: |-
      そこにいるラプチャー、ゲートキーパーを倒せば
      元いた場所に戻れる。
  event_ce006_3_01_e_88:
    speaker: ce006_02
    en: Rapture? Gatekeeper? I have no idea what you're talking about.
    ko: 랩쳐? 게이트 키퍼? 뭐냐 그건.
    ja: ラプチャー？ゲートキーパー？何だそれは。
  event_ce006_3_01_e_89:
    speaker: com
    en: Rapture is the general term for hostile robots who dominate the surface of
      this planet.
    ko: 랩쳐는 이곳의 지상을 지배하고 있는 적대 로봇의 통칭이다.
    ja: |-
      ラプチャーは地上を支配している
      敵対的なロボットたちの総称。
  event_ce006_3_01_e_90:
    speaker: com
    en: Gatekeeper is the name of one of those Raptures.
    ko: 게이트 키퍼는 랩쳐 중 하나의 이름이다.
    ja: ゲートキーパーはそのひとつの個体名だ。
  event_ce006_3_01_e_91:
    speaker: ce006_02
    en: You must be talking about those rust buckets that attacked me when I got here.
    ko: 이곳에 오자마자 갑자기 공격해 왔던 그 고철들을 얘기하는 거로군.
    ja: 来た時、いきなり襲ってきたあの鉄くずどもか。
  event_ce006_3_01_e_92:
    speaker: ce006_02
    en: They won't be a problem. I was able to cut through them easily enough.
    ko: 벨 수 있었으니 문제는 없겠어.
    ja: 斬れる相手ならどうとでもなる。
  event_ce006_3_01_e_93:
    speaker: ce006_02
    en: So, is taking down this "Gatekeeper" all I have to do?
    ko: 그걸 쓰러뜨리면 되는 건가.
    ja: それを倒せばいいのか。
  event_ce006_3_01_e_94:
    speaker: ce006_02
    en: Sounds pretty easy.
    ko: 하지만….
    ja: だが…
  event_ce006_3_01_e_95:
    speaker: "<Narration>"
    en: Raven inches the point of her sword closer to Com.
    ko: 레이븐의 검이 콤에게 조금 더 다가갔다.
    ja: レイヴンの剣がさらにコムに迫った
  event_ce006_3_01_e_96:
    speaker: ce006_02
    en: A little too easy. Enough to make a person suspicious.
    ko: 이야기가 너무 술술 풀려 의심스러운데.
    ja: ずいぶん都合のいい話に聞こえるな？
  event_ce006_3_01_e_97:
    speaker: com
    en: Lying is not a capability which I possess.
    ko: 나는 거짓말을 하는 기능이 없다.
    ja: 私にウソをつく機能はない。
  event_ce006_3_01_e_98:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_99:
    speaker: ce006_02
    en: Ha, all right then. Take me there.
    ko: |-
      크큭. 뭐, 좋아.
      안내해.
    ja: |-
      ククッ。まあ、いい。
      案内しろ。
  event_ce006_3_01_e_100:
    speaker: com
    en: Only on one condition.
    ko: 대신 조건이 있다.
    ja: その代わり、条件がある。
  event_ce006_3_01_e_101:
    speaker: ce006_02
    en: And what's that?
    ko: 조건?
    ja: 条件？
  event_ce006_3_01_e_102:
    speaker: com
    en: My---
    ko: 그래. 나의---.
    ja: そうだ。私の――
  event_ce006_3_01_e_103:
    speaker: hongryeon
    en: Withdraw thy blade.
    ko: 검을 치우게.
    ja: 剣を収めたまえ。
  event_ce006_3_01_e_104:
    speaker: ce006_02
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_3_01_e_105:
    speaker: hongryeon
    en: This tableau laid out before mine eyes reeks of intimidation and threats.
      It is most unpleasant to behold.
    ko: |-
      누가 봐도 협박을 하는 꼴이라,
      보기에 썩 유쾌한 장면은 아니군.
    ja: |-
      どうみても脅しをかけているようなのでな。
      見過ごせば寝覚めが悪くなりそうだ。
  event_ce006_3_01_e_106:
    speaker: ce006_02
    en: Who the hell are you?
    ko: 너희들은 뭐지?
    ja: 貴様らは何だ？
  event_ce006_3_01_e_107:
    speaker: snowwhite
    en: You heard her. Withdraw your sword. We won't ask you again.
    ko: |-
      검을 치워라.
      이건 경고다.
    ja: |-
      剣を収めろ。
      これは警告だ。
  event_ce006_3_01_e_108:
    speaker: rapunzel
    en: I don't know what's happening here, but violence and intimidation are never
      the answer.
    ko: |-
      두 분에게 무슨 사정이 있는지는 모르지만,
      좋은 해결 방법은 아닌 것 같네요.
    ja: |-
      事情は分かりかねますが、
      理想的な解決法とは思えません。
  event_ce006_3_01_e_109:
    speaker: ce006_02
    en: And if I refuse?
    ko: 싫다면?
    ja: 断れば？
  event_ce006_3_01_e_110:
    speaker: hongryeon
    en: Then we shall solve this in the way in which we are most well-versed.
    ko: 그렇다면 우리가 가장 잘하는 해결 방법을 쓸 수밖에 없겠지.
    ja: 我々の最も得意な解決法を使うしかなかろうね。
  event_ce006_3_01_e_111:
    speaker: ce006_02
    en: Sounds fun. I'd like to give it a try.
    ko: 재밌겠어. 해 봐.
    ja: 面白い。やってみろ。
  event_ce006_3_01_e_112:
    speaker: rapunzel
    en: "... Something here isn't right."
    ko: "…뭔가 이상한데요."
    ja: "…妙ですね。"
  event_ce006_3_01_e_113:
    speaker: rapunzel
    en: Are you a Nikke?
    ko: |-
      그쪽의 자매님.
      니케인가요?
    ja: |-
      そちらの方。
      ニケでしょうか？
  event_ce006_3_01_e_114:
    speaker: ce006_02
    en: What's a Nikke?
    ko: |-
      니케?
      뭐야 그건.
    ja: |-
      ニケ？
      何だ、それは。
  event_ce006_3_01_e_115:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_116:
    speaker: rapunzel
    en: Are you a human?
    ko: 그렇다면, 인간인가요?
    ja: そうでなければ、人間でしょうか？
  event_ce006_3_01_e_117:
    speaker: ce006_02
    en: Excuse me?
    ko: "…뭐라고?"
    ja: "…何？"
  event_ce006_3_01_e_118:
    speaker: rapunzel
    en: I asked if you're a human.
    ko: 자매님이 인간인지 물었어요.
    ja: あなたは人間かと、お聞きしたのです。
  event_ce006_3_01_e_119:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_120:
    speaker: ce006_02
    en: Hehe...
    ko: 큭, 크큭….
    ja: クッ、ククッ…
  event_ce006_3_01_e_121:
    speaker: ce006_02
    en: Hahaha!
    ko: 아하하하하.
    ja: アハハハハ！
  event_ce006_3_01_e_122:
    speaker: rapunzel
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_3_01_e_123:
    speaker: ce006_02
    en: Me? A human?
    ko: 인간? 인간이냐고 내가?
    ja: 人間？この私が？
  event_ce006_3_01_e_124:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_01_e_125:
    speaker: ce006_02
    en: You tell me.
    ko: 그렇게 보여?
    ja: そう見えるか？
  event_ce006_3_01_e_126:
    speaker: "<Narration>"
    en: Raven vanishes, leaving a diaphanous mass of blue particles in her wake.
    ko: 레이븐이 푸른색 입자를 남기며 사라졌다.
    ja: |-
      青い粒子をその場に残し、
      レイヴンの姿がかき消えた
  event_ce006_3_01_e_127:
    speaker: "<Narration>"
    en: Then, in a flash of blue, she reappears behind Rapunzel.
    ko: 그리고 라푼젤의 뒤에서 푸른색 입자와 함께 나타났다.
    ja: |-
      瞬間、ラプンツェルの背後に
      青い粒子をまとう影が差した
  event_ce006_3_01_e_128:
    speaker: rapunzel
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_ce006_3_01_e_129:
    speaker: ce006_02
    en: Could a human do this?
    ko: 그렇게 보이냐고!
    ja: そう見えるかと聞いている！
  event_ce006_3_01_e_130:
    speaker: "<Narration>"
    en: "*Clang*"
    ko: 카앙-!
    ja: キン！
  event_ce006_3_01_e_131:
    speaker: "<Narration>"
    en: Scarlet blocks Raven's sword.
    ko: 레이븐이 휘두른 검격을 홍련이 막아낸다.
    ja: 振り下ろされた剣を紅蓮が弾いた
  event_ce006_3_01_e_132:
    speaker: ce006_02
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_3_01_e_133:
    speaker: hongryeon
    en: A most interesting technique.
    ko: 묘한 기술을 쓰는… 군!
    ja: 妙な技を…使うものだ！
  event_ce006_3_01_e_134:
    speaker: "<Narration>"
    en: The swordfight between Raven and Scarlet intensifies, their blades clashing
      again and again.
    ko: 레이븐과 홍련의 검격이 맞부딪힌다.
    ja: レイヴンと紅蓮の剣がぶつかり合った
  event_ce006_3_01_e_135:
    speaker: ce006_02
    en: You're not bad!
    ko: 제법이야…!
    ja: なかなかだな…！
  event_ce006_3_01_e_136:
    speaker: hongryeon
    en: Nor you.
    ko: 낭자야 말로…!
    ja: そちらこそ…！
  event_ce006_3_01_e_137:
    speaker: "<Narration>"
    en: A panoply of slash marks carve up the ground as the two blades cleave through
      rocks and other structures,
    ko: 주위의 지면에 검흔이 새겨지고 바위와 구조물이 잘려나간다.
    ja: |-
      周囲の地面に銀閃が刻まれ、
      岩や建築物が崩れてゆく
  event_ce006_3_01_e_138:
    speaker: "<Narration>"
    en: all the while accompanied by the ceaseless sound of metal clashing.
    ko: 검이 부딪히는 소리가 수도 없이 울려 퍼진다.
    ja: 無数の剣撃の音がたて続けに響いた
  event_ce006_3_01_e_139:
    speaker: snowwhite
    en: Scarlet!
    ko: 홍련!
    ja: 紅蓮！
  event_ce006_3_01_e_140:
    speaker: hongryeon
    en: Understood!
    ko: 알겠네!
    ja: ああ！
  event_ce006_3_01_e_141:
    speaker: "<Narration>"
    en: Scarlet quickly distances herself from Raven.
    ko: 홍련이 단숨에 거리를 벌린다.
    ja: 紅蓮が一気に距離をとった
  event_ce006_3_01_e_142:
    speaker: "<Narration>"
    en: At the same time, Snow White aims her turret at Raven and unleashes a salvo
      of missiles.
    ko: 스노우 화이트의 터렛에서 미사일이 쏟아져 나와 레이븐에게로 향한다.
    ja: |-
      スノーホワイトのタレットから
      ミサイルが放たれ、レイヴンを襲った
  event_ce006_3_01_e_143:
    speaker: rapunzel
    en: Snow White! What are you doing...!
    ko: |-
      !!
      스노우 화이트! 지금 무슨…!
    ja: |-
      ！！
      スノーホワイト！何を…！
  event_ce006_3_01_e_144:
    speaker: snowwhite
    en: Get ready!
    ko: 준비해라!
    ja: やれ！
  event_ce006_3_01_e_145:
    speaker: rapunzel
    en: "...!"
    ko: |-
      …!!
      예!
    ja: |-
      …！！
      はい！
  event_ce006_3_01_e_146:
    speaker: "<Narration>"
    en: "*Slice*"
    ko: 스칵!
    ja: ザンッ！
  event_ce006_3_01_e_147:
    speaker: "<Narration>"
    en: Raven slices through each of the missiles with her sword.
    ko: 레이븐이 휘두른 검에 미사일들이 두 동강 난다.
    ja: |-
      レイヴンは剣をひらめかせ、
      ミサイルを両断した
  event_ce006_3_01_e_148:
    speaker: "<Narration>"
    en: "*Booom*"
    ko: 콰아앙!
    ja: ズガン！
  event_ce006_3_01_e_149:
    speaker: "<Narration>"
    en: The severed missile fragments swirl in the air and explode.
    ko: 두 동강난 미사일들이 허공에서 폭발한다.
    ja: ミサイルは空中で爆散した
  event_ce006_3_01_e_150:
    speaker: "<Narration>"
    en: Through the fire and flame, Raven emerges.
    ko: 그 폭발을 뚫고 레이븐이 모습을 드러내는 찰나.
    ja: 爆風からレイヴンが飛び出してきた刹那…
  event_ce006_3_01_e_151:
    speaker: rapunzel
    en: "*Gasp*!"
    ko: 흐읍…!
    ja: はぁっ…！
  event_ce006_3_01_e_152:
    speaker: "<Narration>"
    en: Rapunzel's staff fires a golden beam, and scores a direct hit on Raven.
    ko: 라푼젤의 지팡에서 뻗어나간 황금색 광선이 레이븐의 몸을 두드린다.
    ja: |-
      ラプンツェルの杖から放たれた黄金の光が
      レイヴンの体を打ちつけた
  event_ce006_3_01_e_153:
    speaker: ce006_02
    en: Urgh!
    ko: 크윽…!
    ja: くっ…！
  event_ce006_3_01_e_154:
    speaker: "<Narration>"
    en: Raven is tossed back and tumbles several times, but quickly gets back up.
    ko: 뒤로 밀려나간 레이븐이 바닥을 수차례 구른 후 일어난다.
    ja: |-
      吹き飛ばされたレイヴンは
      地面を転がったが、素早く態勢を立て直した
  event_ce006_3_01_e_155:
    speaker: ce006_02
    en: Grr...!
    ko: 치잇…!
    ja: ちっ…！
  event_ce006_3_01_e_156:
    speaker: "<Narration>"
    en: Scarlet clenches and loosens her hand, which has gone numb, a few times before
      re-assuming her stance.
    ko: 홍련은 저린 손을 쥐었다 폈다 하며 자세를 바로잡았다.
    ja: |-
      紅蓮はしびれた手の感覚を
      取り戻そうとするように、手を開閉した
  event_ce006_3_01_e_157:
    speaker: hongryeon
    en: "'Tis a most bewildering sword."
    ko: "…난폭한 검이군."
    ja: "…乱暴な剣だ。"
  event_ce006_3_01_e_158:
    speaker: rapunzel
    en: How about we try our words?
    ko: "…자매님. 대화를 좀 해보는 게 어떨까요?"
    ja: "…まずは少し、お話をしませんか？"
  event_ce006_3_01_e_159:
    speaker: snowwhite
    en: That's probably our best option, considering it doesn't seem like we'll get
      anywhere fighting.
    ko: |-
      그 편이 좋을 것 같군.
      봐줄 상대는 아닌 것 같으니.
    ja: |-
      その方がいい。
      見逃せる相手ではなさそうだ。
  event_ce006_3_01_e_160:
    speaker: ce006_02
    en: You want to talk? Sure. We can talk.
    ko: 대화? 대화 좋지.
    ja: お話、か？いいだろう。
  event_ce006_3_01_e_161:
    speaker: ce006_02
    en: Once you're on your knees.
    ko: 단, 너희가 무릎을 꿇은 상태에서….
    ja: ただし、貴様らがひざまずいて…
  event_ce006_3_01_e_162:
    speaker: ce006_02
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_ce006_3_01_e_163:
    speaker: "<Narration>"
    en: Raven suddenly fixes her gaze elsewhere and freezes.
    ko: 레이븐의 시선이 한 곳에 멈췄다.
    ja: レイヴンが視線をそらしたまま、凍り付いた
  event_ce006_3_01_e_164:
    speaker: "<Narration>"
    en: Where Com used to be,
    ko: 콤이 사라지고 없었다.
    ja: コムの姿が消えている
  event_ce006_3_01_e_165:
    speaker: "<Narration>"
    en: only faint track marks remain.
    ko: 바닥에 남은 무한궤도의 자국이 흐릿하게 남아있을 뿐이었다.
    ja: |-
      地面に履帯の跡が
      うっすらと残されていた
  event_ce006_3_01_e_166:
    speaker: ce006_02
    en: Bah!
    ko: "…칫…!"
    ja: "…チッ…！"
  event_ce006_3_01_e_167:
    speaker: snowwhite
    en: Bah!
    ko: "…칫."
    ja: "…チッ。"
  event_ce006_3_01_e_168:
    speaker: hongryeon
    en: "'Tis most peculiar. You two doth seem to be on the same wavelength."
    ko: 둘 다 왜 그러나. 갑자기 마음이라도 맞은 건가?
    ja: 2人でどうした？急に気が合ったようだが。
  event_ce006_3_01_e_169:
    speaker: snowwhite
    en: Raptures approaching. They must have heard the explosions.
    ko: 폭음을 듣고 랩쳐가 오고 있다.
    ja: 爆発音を聞いてラプチャーが集まっている。
  event_ce006_3_01_e_170:
    speaker: rapunzel
    en: I say we fall back. There's no reason for us to fight those Raptures.
    ko: 퇴각하죠. 싸울 이유가 없으니까.
    ja: 退きましょう。戦う理由はありません。
  event_ce006_3_01_e_171:
    speaker: snowwhite
    en: No. We work our way through them.
    ko: 랩쳐는 모두 죽인다.
    ja: ラプチャーはすべて破壊する。
  event_ce006_3_01_e_172:
    speaker: snowwhite
    en: The city is right ahead of us.
    ko: 그리고 이곳에서 직선 위치에 그 도시가 있다.
    ja: それに、この先にはあの都市の遺跡がある。
  event_ce006_3_01_e_173:
    speaker: rapunzel
    en: If they keep moving, they're likely to end up at the city.
    ko: "…이동을 계속할 경우 그쪽으로 가겠군요."
    ja: |-
      …移動を続けさせれば、
      そちらへ向かってしまいますね。
  event_ce006_3_01_e_174:
    speaker: hongryeon
    en: Very well. Let us intercept them there.
    ko: 어쩔 수 없지. 여기서 요격함세.
    ja: 仕方あるまい。ここで迎え討つとしよう。
  event_ce006_3_01_e_175:
    speaker: rapunzel
    en: All right.
    ko: 알겠어요.
    ja: はい。
  event_ce006_3_01_e_176:
    speaker: hongryeon
    en: As for you, nameless one, we would appreciate your cooperati...
    ko: |-
      그쪽의 이름 모를 낭자.
      괜찮다면 잠시 협력….
    ja: |-
      そちらの名も知らぬお嬢ちゃん。
      この場はしばらく、手を組むと…
  event_ce006_3_01_e_177:
    speaker: "<Narration>"
    en: Raven is nowhere to be seen.
    ko: 레이븐의 모습은 보이지 않았다.
    ja: レイヴンは姿を消していた
  event_ce006_3_01_e_178:
    speaker: hongryeon
    en: Did we lose her?
    ko: "…이런. 놓친 건가."
    ja: "…いかん、逃したか。"
  event_ce006_3_01_e_179:
    speaker: rapunzel
    en: She must have gone off in pursuit of that robot.
    ko: 로봇 형제님을 추적한 것 같네요.
    ja: ロボットの方を追ったのでしょう。
  event_ce006_3_01_e_180:
    speaker: hongryeon
    en: Doth we consider it wise to allow her to escape unopposed?
    ko: 괜찮겠나? 그대로 두어도.
    ja: 大丈夫かい？放っておいて。
  event_ce006_3_01_e_181:
    speaker: rapunzel
    en: As hostile as she seemed, I don't think she intended to do harm to that robot.
    ko: 분위기가 험악하긴 했지만, 해를 끼칠 것 같진 않아 보였어요.
    ja: |-
      険悪そうな雰囲気でしたが、ただちに危害を
      加えるという様子ではありませんでした。
  event_ce006_3_01_e_182:
    speaker: rapunzel
    en: I think it'll be fine for the time being.
    ko: 잠깐 동안은 괜찮겠죠.
    ja: 急げば手遅れにはならないでしょう。
  event_ce006_3_01_e_183:
    speaker: snowwhite
    en: Let's finish off these Raptures first, then go after her.
    ko: 그럼 랩쳐를 빠르게 정리 후 추적한다.
    ja: |-
      では、手早くラプチャーを始末して、
      後を追おう。
event_ce006_2_04_s:
  event_ce006_2_04_s_1:
    speaker: elegg
    en: As you can see, there are a lot of storage terminals here, and they're huge.
    ko: 보시면 알겠지만, 여기 있는 저장 장치는 아주 많고 커여.
    ja: |-
      ご覧の通り、保存デバイスは数がありますし、
      一つ一つが大きいですゆえ…
  event_ce006_2_04_s_2:
    speaker: elegg
    en: It'd be next to impossible to haul them all out of here.
    ko: 이걸 일일이 실어서 옮기는 건 불가능에 가깝져.
    ja: 全部運びだすというのは不可能に近いですな。
  event_ce006_2_04_s_3:
    speaker: elegg
    en: What we need is
    ko: 그래서 우리한테 필요한 건 하드 디스크에여.
    ja: |-
      これは大容量のハードディスクが
      必要になりますぞ。
  event_ce006_2_04_s_4:
    speaker: elegg
    en: a singular hard disk on which we can store all of their data.
    ko: 여기에 있는 모든 데이터를 저장할 수 있는 하드 디스크여.
    ja: |-
      それも、ここにあるデータが
      全て収まるほどの、ですな。
  event_ce006_2_04_s_5:
    speaker: neon
    en: You'd need an awfully big hard disk
    ko: 으아… 여기 있는 것들 전부요?
    ja: おお…ここにあるもの全部ですか？
  event_ce006_2_04_s_6:
    speaker: neon
    en: to store all the information contained in these terminals.
    ko: 엄청 큰 하드 디스크가 있어야 할 것 같은데요.
    ja: |-
      とんでもない大きさの
      ハードディスクが必要そうですね。
  event_ce006_2_04_s_7:
    speaker: neon
    en: Does a hard disk that big even exist?
    ko: "…그런데, 그만한 하드 디스크가 있긴 한가요?"
    ja: "…そもそも、そんなものあるんですか？"
  event_ce006_2_04_s_8:
    speaker: ce006_03
    en: I doubt it'd be that big, actually.
    ko: 그렇게 안 클걸요?
    ja: そこまで大きくならないと思いますよ？
  event_ce006_2_04_s_9:
    speaker: ce006_03
    en: Storage media is one of the fastest-evolving technologies there is.
    ko: 저장 매체는 기술 발전에 특히나 영향을 많이 받아서
    ja: データの保存容量って進歩の速度が早いので…
  event_ce006_2_04_s_10:
    speaker: ce006_03
    en: We might be able to save everything in a device small enough to fit in the
      palm of your hand.
    ko: 어쩌면 손바닥 만한 장치에 모두 저장될 수도 있어요.
    ja: |-
      もしかしたら手のひらサイズのデバイスで
      済むかもしれません。
  event_ce006_2_04_s_11:
    speaker: ce006_03
    en: Uh... at least that'd be the case in our world. I assume it's not too different
      here.
    ko: |-
      어… 일단 저희 세계는 그랬어요.
      여기라고 크게 다를 것 같진 않네요.
    ja: |-
      あ…あたしたちの世界では、って話ですけど。
      でも、こっちもたぶん似たようなものかなと。
  event_ce006_2_04_s_12:
    speaker: elegg
    en: That's a good point. The data here is all quite old.
    ko: |-
      릴리 씨 말대로에여.
      여기 자료들은 전부 오래된 것들이져.
    ja: |-
      リリー氏の言う通りですぞ。
      このシェルターの機器は
      そうとうな年代物ですからな。
  event_ce006_2_04_s_13:
    speaker: elegg
    en: What was considered large-format isn't all that big by today's standards.
    ko: |-
      당시로는 고용량이었을지 모르지만,
      지금 기준으로는 크지 않져.
    ja: |-
      当時としては大容量だったかもしれませぬが、
      今もそうかは別ですな。
  event_ce006_2_04_s_14:
    speaker: elegg
    en: If we use the latest storage technology available to us...
    ko: 최신형 저장 장치를 쓴다면 아마….
    ja: 最新型の保存デバイスであれば、おそらく…
  event_ce006_2_04_s_15:
    speaker: "<Monologue>"
    en: Elegg takes out her smartphone.
    ko: 일레그는 핸드폰을 꺼내 들어 보여줬다.
    ja: エレグが携帯端末を取りだして見せつけた
  event_ce006_2_04_s_16:
    speaker: elegg
    en: It might all fit in here.
    ko: 여기 다 들어갈 걸여?
    ja: ここに全部入るかもしれませんぞ？
  event_ce006_2_04_s_17:
    speaker: neon
    en: Huh? Aren't you being a little dramatic?
    ko: 예에~? 너무 과장이 심한 것 아닌가요?
    ja: ええ～？それは言いすぎじゃないですか？
  event_ce006_2_04_s_18:
    speaker: elegg
    en: No exaggeration here, just the truth! Storage compression and media technology
      advance at an incredible pace.
    ko: 히히. 압축 기술과 저장 매체 기술은 하루가 다르게 발전하고 있다고여. 과장이 아니라 진짜에여.
    ja: |-
      ふひひっ。データの圧縮や保存技術の進化は
      爆速ですぞ。誇張ではありませんな。
  event_ce006_2_04_s_19:
    speaker: anis
    en: No kidding... well then, this should be a breeze.
    ko: 뭐야. 그럼 그냥 일사천리네?
    ja: なんだ、じゃあ話は簡単そうね？
  event_ce006_2_04_s_20:
    speaker: elegg
    en: There is one problem, though.
    ko: 문제는.
    ja: そうとはいきませんな。
  event_ce006_2_04_s_21:
    speaker: elegg
    en: The storage terminals here are so old, they're not compatible with those currently
      found in the Ark.
    ko: |-
      이곳의 저장 장치들이 너무 오래전 저장 장치라,
      현재 방주의 저장 장치와 규격이 맞지 않는다는 거져.
    ja: |-
      前時代のデバイスですゆえ…
      アークの現行のものとは規格が合いませんぞ。
  event_ce006_2_04_s_22:
    speaker: elegg
    en: We don't have any way to transfer it to our phones.
    ko: 이 핸드폰으로 옮길 방법이 없어여.
    ja: この携帯に移す方法がないということですな。
  event_ce006_2_04_s_23:
    speaker: privaty
    en: So what should we do?
    ko: 그럼 어떡하나요?
    ja: では、どうすれば？
  event_ce006_2_04_s_24:
    speaker: elegg
    en: It's simple.
    ko: 간단해여.
    ja: 簡単ですぞ。
  event_ce006_2_04_s_25:
    speaker: elegg
    en: We just need to find the most advanced storage device that's compatible with
      the ones here.
    ko: |-
      이곳의 저장 장치와 규격이 맞으면서,
      가장 발전된 형태의 저장 장치를 찾는 거져.
    ja: |-
      ここのものと規格の合う中で、できるだけ
      現代に近いデバイスを見つけてくだされ。
  event_ce006_2_04_s_26:
    speaker: "<Self>"
    en: This is the data center Privaty told us about.
    ko: 프리바티가 알려준 데이터 센터는 여기야.
    ja: |-
      プリバティが言っていた
      データセンターはここだな
  event_ce006_2_04_s_27:
    speaker: anis
    en: I can tell all the way from here that the place is crawling with Raptures.
    ko: 멀리서 봐도 랩쳐들이 드글대네.
    ja: |-
      ラプチャーだらけなのが
      遠くからでも分かるわね。
  event_ce006_2_04_s_28:
    speaker: neon
    en: The floor and walls have deteriorated severely. If any of the upper floors
      collapse, they'll fall straight down to the first floor.
    ko: |-
      바닥이나 벽도 엉망이네요.
      최고층이 무너지면 1층까지 다이렉트로 떨어지겠는데요?
    ja: |-
      床も壁もボロボロですね。上が崩れたら、
      下まで一気に落ちてしまうのでは？
  event_ce006_2_04_s_29:
    speaker: anis
    en: Nice, a shortcut.
    ko: 숏 컷 루트도 있고. 좋네.
    ja: ショートカットになっていいじゃない。
  event_ce006_2_04_s_30:
    speaker: anis
    en: This place looks pretty dangerous. Do we really have to be that in-depth with
      our search?
    ko: 위험해 보이는데, 저 안을 샅샅이 뒤져봐야 하는 거지?
    ja: |-
      危なそうだけど、あの中をくまなく
      探さないといけないんでしょ？
  event_ce006_2_04_s_31:
    speaker: rapi
    en: I don't think we have much of a choice. We all saw that image Elegg sent us.
      Let's try and find something that matches it as closely as possible.
    ko: |-
      그 수밖에 없겠네.
      일레그가 알려준 이미지와 최대한 비슷한 걸 찾아보자.
    ja: |-
      それしかなさそうね。
      エレグの説明と似たものを探しましょう。
  event_ce006_2_04_s_32:
    speaker: neon
    en: Do you think we'll find something as soon as we enter?
    ko: 들어가자마자 있을 확률은 있을까요?
    ja: 案外入ってすぐに見つかったりして？
  event_ce006_2_04_s_33:
    speaker: ce006_01
    en: Probably not. These things tend to be on the upper floors.
    ko: |-
      없지 않을까?
      보통 그런 건 최고층 어딘가에 있을 것 같아.
    ja: |-
      たぶんないと思う。
      こういうときはだいたい、一番奥にあるはず。
  event_ce006_2_04_s_34:
    speaker: neon
    en: I know, right? That does always seem to be the case for some reason.
    ko: 그렇죠? 이상하게 그렇더라고요.
    ja: やっぱり？なぜかそうなるんですよね…
  event_ce006_2_04_s_35:
    speaker: roam
    en: Let's hurry.
    ko: 빨리 가자.
    ja: 早く行こう。
  event_ce006_2_04_s_36:
    speaker: "<Self>"
    en: "... Tell me again why you had to come with us, Roam?"
    ko: "…롬. 아무리 생각해도 롬까지 따라올 필요는…."
    ja: "…ロム。考えたが、やはり君が来る必要は…"
  event_ce006_2_04_s_37:
    speaker: roam
    en: Roam is a transport robot. I am good at transporting.
    ko: |-
      롬 운반용 로봇.
      운반 잘한다.
    ja: |-
      ロムは運搬用ロボット。
      運搬は得意。
  event_ce006_2_04_s_38:
    speaker: roam
    en: This place might contain good artifacts.
    ko: 그리고 이곳에 좋은 유물 있을지도 모른다.
    ja: それに、ここにも遺物があるかもしれない。
  event_ce006_2_04_s_39:
    speaker: roam
    en: Artifacts that will help with the construction of the second Ark.
    ko: 제2의 방주 제작에 도움 될 것.
    ja: 第2のアーク作りに役立つもの。
  event_ce006_2_04_s_40:
    speaker: ce006_01
    en: You're quite industrious.
    ko: 열심이네.
    ja: まじめね。
  event_ce006_2_04_s_41:
    speaker: roam
    en: Always.
    ko: 롬은 항상 열심히 한다.
    ja: ロムはいつもまじめ。
  event_ce006_2_04_s_42:
    speaker: "<Self>"
    en: Okay, but stay behind us.
    ko: 알겠어. 대신 절대 우리 앞에 나서지 마.
    ja: 分かった。ただし、絶対に前には出ないでくれ
  event_ce006_2_04_s_43:
    speaker: roam
    en: Okay. I am good at hiding and running away.
    ko: 알겠다. 롬 숨고 도망가는 거 잘한다.
    ja: 分かった。ロムは隠れて逃げるのが得意。
  event_ce006_2_04_s_44:
    speaker: rapi
    en: Let's head in, Commander.
    ko: 지휘관. 그럼 진입하겠습니다.
    ja: 指揮官。突入します。
  event_ce006_2_04_s_45:
    speaker: "<Self>"
    en: Let's go.
    ko: 좋아. 가자.
    ja: よし、行こう
  event_ce006_2_04_s_46:
    speaker: "<Self>"
    en: Our goal is to find a high-capacity storage device that is compatible with
      those in the bunker.
    ko: 목표는 벙커의 저장 장치와 규격이 맞는 고용량 저장 장치를 찾는 거야.
    ja: |-
      目標は、シェルターと規格が一致する
      大容量デバイスの発見と回収だ
  event_ce006_2_04_s_47:
    speaker: anis
    en: Oooh, I think I may have found something.
    ko: 오. 찾은 것 같아. 이거 아냐?
    ja: あっ、見つかったかも。これじゃない？
  event_ce006_2_04_s_48:
    speaker: elegg
    en: Yeah? Show us.
    ko: 오. 보여줘여.
    ja: おおっ！拝見しますぞ。
  event_ce006_2_04_s_49:
    speaker: elegg
    en: Hmm, no, that won't work. Two of the pins are missing.
    ko: 음… 아니에여. 핀이 두 개 모자라네여.
    ja: むーん…違いますな。ピンが2つ足りませんぞ。
  event_ce006_2_04_s_50:
    speaker: anis
    en: Ugh. These cables all look identical to me. They're hard to tell apart.
    ko: 아으. 이놈의 케이블들은 다 거기서 거기라서 찾기 참 힘드네.
    ja: はぁ…ケーブルなんてどれも同じに見えるわ。
  event_ce006_2_04_s_51:
    speaker: neon
    en: How about this? It looks right.
    ko: 이건요? 딱 보니까 맞는 것 같은데.
    ja: これはどうですか？資料とそっくりですよ！
  event_ce006_2_04_s_52:
    speaker: ce006_03
    en: It looks similar, but it's a little small.
    ko: 그건 맞아요. 근데 좀 작네요.
    ja: 見た目は似てますけど、ちょっと小さいですね。
  event_ce006_2_04_s_53:
    speaker: ce006_03
    en: It might still be useful though, so bring it back with you.
    ko: 그래도 분명히 도움이 될 테니까 챙겨주세요.
    ja: |-
      でも何かの役に立ちそうなので、
      持って帰ってきてください。
  event_ce006_2_04_s_54:
    speaker: neon
    en: Woohoo! I contributed more than Anis!
    ko: 오예. 아니스보다 더 활약했다.
    ja: やりました！アニスより役に立てたようですね。
  event_ce006_2_04_s_55:
    speaker: anis
    en: "... Well, bully for you."
    ko: 많이 해라. 활약.
    ja: はいはい。好きなだけ活躍して。
  event_ce006_2_04_s_56:
    speaker: ce006_01
    en: My eyes are tired.
    ko: 눈이 피곤하네.
    ja: 目が疲れる。
  event_ce006_2_04_s_57:
    speaker: rapi
    en: It's not surprising, considering how intently we're scrutinizing these cables.
    ko: 아무래도 케이블을 자세히 봐야 하니까.
    ja: |-
      ケーブルばかり見ていると
      目に負担がかかるわね。
  event_ce006_2_04_s_58:
    speaker: ce006_01
    en: I think I found something.
    ko: 아. 찾은 것 같아.
    ja: あっ。見つけた気がする。
  event_ce006_2_04_s_59:
    speaker: ce006_03
    en: Let's see... Yes. That'll work. Bring it back.
    ko: |-
      어디 보자… 네. 맞네요.
      일단 확보해 주세요.
    ja: |-
      えっと…そう、それですね。
      ひとまず確保してください。
  event_ce006_2_04_s_60:
    speaker: rapi
    en: This is taking too long. I don't think we're going to find what we need here.
    ko: |-
      …좀 더딘데.
      여기서 해결이 안 될 수도 있겠어.
    ja: |-
      …時間がかかりすぎるわ。
      ここだけでは解決できないかもしれない。
  event_ce006_2_04_s_61:
    speaker: rapi
    en: Commander, let's investigate a little more and move to another...
    ko: 지휘관. 조금만 더 조사한 후 다른 장소로….
    ja: 指揮官。もう少し調査をしたら、別の場所を…
  event_ce006_2_04_s_62:
    speaker: roam
    en: Found it.
    ko: 찾았다.
    ja: 見つけた。
  event_ce006_2_04_s_63:
    speaker: "<Monologue>"
    en: Roam holds up a device as big as its head.
    ko: 롬은 자신의 머리만 한 큰 기계를 들고 있었다.
    ja: |-
      ロムが自分の頭部ほどもある
      大きな装置を抱えていた
  event_ce006_2_04_s_64:
    speaker: roam
    en: Roam found it.
    ko: 롬이 찾았다.
    ja: ロムが見つけた。
  event_ce006_2_04_s_65:
    speaker: elegg
    en: Just a moment. I'll take a look.
    ko: |-
      어어어. 잠시만여.
      한번 볼게여.
    ja: |-
      ややっ、お待ちくだされ。
      確認しますぞ。
  event_ce006_2_04_s_66:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_s_67:
    speaker: elegg
    en: That'll do it. You can head back.
    ko: 됐어여. 퇴각.
    ja: ズバリですな。引きあげてくだされ。
  event_ce006_2_04_s_68:
    speaker: elegg
    en: That'll be more than enough to store all the data here.
    ko: 저거 하나면 여기 있는 데이터들 다 집어넣고도 용량이 남아여.
    ja: |-
      それ一つでここのデータを全部入れても
      おつりが来ますな。
  event_ce006_2_04_s_69:
    speaker: rapi
    en: Excellent.
    ko: 훌륭해.
    ja: さすがね。
  event_ce006_2_04_s_70:
    speaker: anis
    en: Yeah, nicely done, Roam.
    ko: 한 건 했네.
    ja: やるじゃない。
  event_ce006_2_04_s_71:
    speaker: roam
    en: Roam is always excellent.
    ko: 롬은 언제나 훌륭하다.
    ja: ロムはいつでも最高。
  event_ce006_2_04_s_72:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!!
    ja: ドカン！！
  event_ce006_2_04_s_73:
    speaker: "<Monologue>"
    en: The ceiling above Roam collapses and Raptures come pouring out.
    ko: 롬의 머리 위 천장이 무너지며 랩쳐들이 쏟아져내려 왔다.
    ja: |-
      突然ロムの頭上にある天井が崩れ、
      ラプチャーが飛び出してきた
  event_ce006_2_04_s_74:
    speaker: "<Monologue>"
    en: Thick plumes of dust fill the air, obscuring our vision and making it impossible
      to see Roam.
    ko: 자욱한 먼지 때문에 롬의 모습을 확인할 수 없다.
    ja: 激しい砂ぼこりの中にロムの姿が消えた
  event_ce006_2_04_s_75:
    speaker: "<Self>"
    en: Roam!
    ko: "!! 롬!!"
    ja: ロム！！
  event_ce006_2_04_s_76:
    speaker: anis
    en: No!
    ko: 이런!
    ja: そんな…！
  event_ce006_2_04_s_77:
    speaker: rapi
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
event_ce006_2_04_e:
  event_ce006_2_04_e_1:
    speaker: "<Self>"
    en: How's Roam?!
    ko: 롬은!?
    ja: ロムは！？
  event_ce006_2_04_e_2:
    speaker: rapi
    en: I'll check.
    ko: 확인하겠습니다!
    ja: 確認します！
  event_ce006_2_04_e_3:
    speaker: roam
    en: Roam is safe.
    ko: 롬. 무사하다.
    ja: ロムは無事。
  event_ce006_2_04_e_4:
    speaker: roam
    en: Storage device is also safe.
    ko: 저장 장치도 무사하다.
    ja: 保存デバイスも無事。
  event_ce006_2_04_e_5:
    speaker: anis
    en: You scared me half to death!
    ko: 하아… 간 떨어지게 하네 정말.
    ja: はぁ…寿命が縮まるかと思ったわ。
  event_ce006_2_04_e_6:
    speaker: roam
    en: Here, take this.
    ko: 이거. 받아라.
    ja: これ。受け取れ。
  event_ce006_2_04_e_7:
    speaker: neon
    en: Huh? Gaaaah!
    ko: 예? 어, 어어어어-!
    ja: え？うわわわわっ！？
  event_ce006_2_04_e_8:
    speaker: "<Monologue>"
    en: Roam, who is standing far away from us, tosses the storage device toward us.
    ko: 멀리 떨어져 있던 롬이 들고 있던 저장 장치를 우리 쪽으로 던졌다.
    ja: |-
      ロムが遠くから保存デバイスを
      こちらへ向かって放り投げた
  event_ce006_2_04_e_9:
    speaker: "<Monologue>"
    en: Anis and Neon both scramble to catch it, and end up slamming into each other.
    ko: 아니스와 네온이 거의 몸으로 받아낸다.
    ja: アニスとネオンが全身でかばうように受け止めた
  event_ce006_2_04_e_10:
    speaker: neon
    en: Agh! My back!
    ko: 으, 으아…! 허리…!
    ja: う、うっ…！腰が…！
  event_ce006_2_04_e_11:
    speaker: anis
    en: You idiot! Why would you throw something this valuable?!
    ko: 너, 너 인마…! 이렇게 중요한 걸 집어던지면 어떻…!
    ja: |-
      あ、あのね…！
      こんな大事なものを投げるなんて…！
  event_ce006_2_04_e_12:
    speaker: ce006_01
    en: "!!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_04_e_13:
    speaker: "<Monologue>"
    en: EVE slowly approaches Roam.
    ko: 이브가 천천히 롬에게로 걸어간다.
    ja: イヴがゆっくりとロムに近づいた
  event_ce006_2_04_e_14:
    speaker: roam
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_2_04_e_15:
    speaker: "<Narration>"
    en: "*Crack*"
    ko: 쩍.
    ja: ビシッ――
  event_ce006_2_04_e_16:
    speaker: roam
    en: Stay back.
    ko: 오지 마라.
    ja: 来るな。
  event_ce006_2_04_e_17:
    speaker: "<Narration>"
    en: "*Crrrrack*"
    ko: 쩌저저적-!
    ja: バキバキッ！
  event_ce006_2_04_e_18:
    speaker: "<Monologue>"
    en: The section of the floor underneath Roam starts to split apart.
    ko: "…롬이 서 있던 바닥이 갈라진다."
    ja: "…ロムの立つ床面に亀裂が走った"
  event_ce006_2_04_e_19:
    speaker: ce006_01
    en: Stay still. Don't move. I'll come to you.
    ko: 가만히 있어. 움직이지 마. 내가 갈 테니까.
    ja: じっとして。動かないで。私が行く。
  event_ce006_2_04_e_20:
    speaker: neon
    en: Don't budge, you hear?! This is the top floor. If you fall, it'll be bad news.
    ko: |-
      저, 절대 움직이지 마요.
      여기 꼭대기층이라서, 떨어지면 큰일이니까.
    ja: |-
      ぜ、絶対に動かないでくださいね。
      最上階から落ちたら大変なことになります…
  event_ce006_2_04_e_21:
    speaker: rapi
    en: Neon. Stop.
    ko: 네온. 정지.
    ja: ネオン。止まって。
  event_ce006_2_04_e_22:
    speaker: neon
    en: Why?
    ko: 왜, 왜요?
    ja: ど、どうしてですか？
  event_ce006_2_04_e_23:
    speaker: rapi
    en: Leave it to EVE. If any of us head out, the floor is guaranteed to collapse.
    ko: "…이브에게 맡기자. 우리가 가면 무너질 거야."
    ja: |-
      …私たちまで行ったら崩れるわ。
      ここは任せましょう。
  event_ce006_2_04_e_24:
    speaker: "<Narration>"
    en: "*Crack* *Craaackk*"
    ko: 쩌적. 쩌저적-!
    ja: バキ、バキバキッ――！！
  event_ce006_2_04_e_25:
    speaker: "<Monologue>"
    en: The cracks in the floor widen.
    ko: 바닥이 더 크게 갈라진다.
    ja: 亀裂が大きくなった
  event_ce006_2_04_e_26:
    speaker: "<Monologue>"
    en: EVE carefully moves closer.
    ko: 이브는 조심스럽게 다가가고 있다.
    ja: イヴが慎重に距離を詰める
  event_ce006_2_04_e_27:
    speaker: ce006_01
    en: Almost there. Don't move. Okay?
    ko: "…거의 다 왔어. 움직이면 안 돼. 알겠지?"
    ja: "…あと少し。動いたらダメ。分かった？"
  event_ce006_2_04_e_28:
    speaker: roam
    en: EVE, don't come. Dangerous.
    ko: 이브. 오지 마라. 위험.
    ja: イヴ。来るな。危険。
  event_ce006_2_04_e_29:
    speaker: ce006_01
    en: Don't worry. I'll save you.
    ko: 걱정 마. 내가 구해줄게.
    ja: 心配しないで。私が助ける。
  event_ce006_2_04_e_30:
    speaker: roam
    en: I am fine. I am a robot.
    ko: 괜찮다. 롬은 로봇.
    ja: 大丈夫。ロムはロボット。
  event_ce006_2_04_e_31:
    speaker: roam
    en: If Roam is broken, Roam can be fix...
    ko: 망가지면 고치면 된
    ja: 壊れたら、直せば――
  event_ce006_2_04_e_32:
    speaker: "<Narration>"
    en: "*Crrrrrack*"
    ko: 콰드드득-!
    ja: バキッ――！
  event_ce006_2_04_e_33:
    speaker: "<Monologue>"
    en: The floor collapses, taking Roam along with it.
    ko: 바닥이 무너지며 롬이 사라졌다.
    ja: 床が崩れ、ロムの姿が消えた
  event_ce006_2_04_e_34:
    speaker: "<Monologue>"
    en: Without any hesitation, EVE jumps after Roam.
    ko: 이브는 조금의 망설임도 없이 달려간다.
    ja: ためらう様子もなく、イヴが飛び込んだ
  event_ce006_2_04_e_35:
    speaker: ce006_01
    en: Roam!
    ko: 롬!
    ja: ロム！
  event_ce006_2_04_e_36:
    speaker: "<Monologue>"
    en: EVE dives into the hole Roam fell through.
    ko: 이브는 롬이 사라진 구멍으로 뛰어들었다.
    ja: イヴがロムを追って床に空いた穴へ消えた
  event_ce006_2_04_e_37:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_38:
    speaker: ce006_01
    en: Is that your main function? Gathering artifacts?
    ko: "…롬은 계속 그렇게 유물을 모으는 거야?"
    ja: "…ロムはずっと古い物を集めているの？"
  event_ce006_2_04_e_39:
    speaker: roam
    en: Affirmative. That is what I must do.
    ko: |-
      그렇다.
      그것이 롬이 해야 할 일.
    ja: |-
      そうだ。
      それがロムのするべきこと。
  event_ce006_2_04_e_40:
    speaker: ce006_01
    en: Why?
    ko: 왜?
    ja: どうして？
  event_ce006_2_04_e_41:
    speaker: roam
    en: I do not remember.
    ko: 기억나지 않는다.
    ja: 覚えていない。
  event_ce006_2_04_e_42:
    speaker: roam
    en: I do remember it is my duty.
    ko: 해야 할 일이라는 것은 안다.
    ja: するべきこと、それだけ分かる。
  event_ce006_2_04_e_43:
    speaker: anis
    en: You're nothing if not industrious.
    ko: "…정말 열심히 하네 너."
    ja: "…ホント、頑張ってるわね。"
  event_ce006_2_04_e_44:
    speaker: com
    en: What are you doing?
    ko: 무슨 일을 하는 거지?
    ja: 何をしている？
  event_ce006_2_04_e_45:
    speaker: roam
    en: Sorting artifacts.
    ko: 유물 분류.
    ja: 遺物の分類。
  event_ce006_2_04_e_46:
    speaker: com
    en: Why?
    ko: 어째서지.
    ja: なんのために？
  event_ce006_2_04_e_47:
    speaker: roam
    en: Roam is making a second Ark.
    ko: 롬은 제2의 방주 만든다.
    ja: ロムは第2のアークを作る。
  event_ce006_2_04_e_48:
    speaker: roam
    en: A precious home.
    ko: |-
      제2의 방주란,
      소중한 보금자리.
    ja: |-
      第2のアークは、
      大切なねぐら。
  event_ce006_2_04_e_49:
    speaker: roam
    en: Chipper. Heehee. Haha. Happy place.
    ko: 시끌벅적. 하하 호호. 행복한 장소.
    ja: ガヤガヤ。はは、ほほ。幸せな場所。
  event_ce006_2_04_e_50:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_51:
    speaker: girlvoice
    en: Got that, Roam?
    ko: 롬. 알겠지?
    ja: ロム。分かった？
  event_ce006_2_04_e_52:
    speaker: girlvoice
    en: My mom can't hear very well, so if you have something to say, you need to
      shout it loudly.
    ko: |-
      우리 엄마 귀가 잘 안 들리니까,
      알려줄 거 있으면 크게 말해야 돼.
    ja: |-
      お母さんは耳がよく聞こえないから、
      話す時は大きな声でね。
  event_ce006_2_04_e_53:
    speaker: roam
    en: Even if it is not important?
    ko: 중요한 일 아니어도 크게 말하나?
    ja: 大事なことじゃなくても？
  event_ce006_2_04_e_54:
    speaker: girlvoice
    en: Yeah, so that she can hear.
    ko: 응. 그래야 들을 수 있으니까.
    ja: うん。じゃないと聞こえないから。
  event_ce006_2_04_e_55:
    speaker: girlvoice
    en: It might seem like you're overdoing it, but trust me, you won't be.
    ko: 조… 금 호들갑 떠는 것처럼 보일 수는 있겠는데, 그래도 크게 불러줘.
    ja: |-
      もしかしたら…うるさいって
      思われるかもしれないけど、
      それでも大きな声でお願い。
  event_ce006_2_04_e_56:
    speaker: girlvoice
    en: And besides, everything you have to say is important.
    ko: 그리고, 롬이 하는 일이 중요하지 않을리가 없잖아?
    ja: それに、ロムの仕事はどれも大事だよ？
  event_ce006_2_04_e_57:
    speaker: girlvoice
    en: You're the hardest-working person in this house, and in our family.
    ko: 롬은 우리 집 일등 일꾼이자, 가족이니까.
    ja: ロムはうちで一番頑張ってる、家族なんだから。
  event_ce006_2_04_e_58:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_59:
    speaker: roam
    en: "!!"
    ko: "---아."
    ja: "――ああ。"
  event_ce006_2_04_e_60:
    speaker: roam
    en: This is my memory.
    ko: 이것은 롬의 [기억].
    ja: これはロムの「記憶」。
  event_ce006_2_04_e_61:
    speaker: roam
    en: Haha hoho. Happy memories.
    ko: 하하 호호. 시끌벅적했던 롬의 기억.
    ja: はは、ほほ。ガヤガヤしていた、ロムの記憶。
  event_ce006_2_04_e_62:
    speaker: roam
    en: Everyone always laughed when Roam broke a plate.
    ko: 롬이 접시를 깨도 웃었다.
    ja: ロムが皿を割っても笑った。
  event_ce006_2_04_e_63:
    speaker: roam
    en: When Roam fell while transporting.
    ko: 롬이 운반하다 넘어져도 웃었다.
    ja: ロムが荷物を運搬中に転んでも笑った。
  event_ce006_2_04_e_64:
    speaker: roam
    en: When Roam had to shout loudly.
    ko: 큰 소리로 불러도 웃었다.
    ja: 大声で話しても笑った。
  event_ce006_2_04_e_65:
    speaker: roam
    en: Everyone always laughed. Happy memories.
    ko: 다들 항상 웃었다. 좋은 기억.
    ja: みんないつも笑顔。いい記憶。
  event_ce006_2_04_e_66:
    speaker: roam
    en: Something that shouldn't be forgotten.
    ko: |-
      좋은 기억이란,
      잊어선 안 되는 것.
    ja: |-
      いい記憶とは、
      忘れてはいけないもの。
  event_ce006_2_04_e_67:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_68:
    speaker: roam
    en: This is the opposite direction of the Ark.
    ko: 이곳은 방주의 반대 방향.
    ja: こっちはアークと反対方向。
  event_ce006_2_04_e_69:
    speaker: roam
    en: We must go to the Ark.
    ko: 우리는 방주로 가야 한다.
    ja: 私たちはアークに行く予定。
  event_ce006_2_04_e_70:
    speaker: girlvoice
    en: You can't get into the Ark without a winning ticket.
    ko: "…추첨권이 없으면 방주로 못 들어간대."
    ja: |-
      …抽選券がない人は、
      アークに入れないんだって。
  event_ce006_2_04_e_71:
    speaker: girlvoice
    en: So we can't go in.
    ko: 그래서 우린 못 들어가.
    ja: だから、私たちは入れてもらえないの。
  event_ce006_2_04_e_72:
    speaker: roam
    en: Why do you need a winning ticket?
    ko: 왜 추첨권이 필요한가.
    ja: なぜ抽選券がいる？
  event_ce006_2_04_e_73:
    speaker: girlvoice
    en: Maybe there's not enough space.
    ko: 글쎄. 자리가 모자라나 보지.
    ja: さあ。おうちが足りないのかも。
  event_ce006_2_04_e_74:
    speaker: roam
    en: Is there only one Ark?
    ko: 방주는 하나뿐인가.
    ja: アークは一つだけ？
  event_ce006_2_04_e_75:
    speaker: girlvoice
    en: Yes, there's only one.
    ko: 응. 하나뿐이야.
    ja: うん、他にはないよ。
  event_ce006_2_04_e_76:
    speaker: roam
    en: Then what do we do?
    ko: 그럼 앞으로 어떡하나.
    ja: じゃあ、これからどうする？
  event_ce006_2_04_e_77:
    speaker: girlvoice
    en: I don't know.
    ko: 그러게. 어떡할까?
    ja: そうだね。どうしよっか？
  event_ce006_2_04_e_78:
    speaker: roam
    en: Can we build one?
    ko: 방주. 만들면 안 되나?
    ja: アーク。作ってはいけないか？
  event_ce006_2_04_e_79:
    speaker: girlvoice
    en: Huh?
    ko: "…어?"
    ja: "…えっ？"
  event_ce006_2_04_e_80:
    speaker: roam
    en: If there is not enough space in the Ark, I can build one.
    ko: 방주. 모자라면 만들면 된다.
    ja: アーク。足りないなら、作ればいい。
  event_ce006_2_04_e_81:
    speaker: girlvoice
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_82:
    speaker: girlvoice
    en: You're incredible, Roam.
    ko: 와. 역시 롬은 대단하네.
    ja: わあ…やっぱりロムはすごいね。
  event_ce006_2_04_e_83:
    speaker: girlvoice
    en: All right then, let's do it.
    ko: 좋아. 그럼 우리만의 방주를 만들어볼까?
    ja: うん。じゃあ、アークを作っちゃおうか？
  event_ce006_2_04_e_84:
    speaker: girlvoice
    en: Let's build a second Ark, one of our own!
    ko: 제2의 방주를 만들어보는 거야!
    ja: 私たちだけの、第2のアーク！
  event_ce006_2_04_e_85:
    speaker: roam
    en: Good.
    ko: 좋다.
    ja: 分かった。
  event_ce006_2_04_e_86:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_87:
    speaker: roam
    en: I have a question.
    ko: 질문 있다.
    ja: 質問がある。
  event_ce006_2_04_e_88:
    speaker: roam
    en: Why are you collecting all of these random objects?
    ko: 왜 이런 잡동사니들을 모으는가.
    ja: どうしてこんな役にたたないものを集める？
  event_ce006_2_04_e_89:
    speaker: girlvoice
    en: These aren't random objects. They're artifacts.
    ko: 잡동사니 아냐. 유물이야.
    ja: |-
      役に立たないものじゃないよ。
      人類が残した遺物って言うの。
  event_ce006_2_04_e_90:
    speaker: girlvoice
    en: If we want to build a proper Ark, don't you think we'll need these?
    ko: 이런 것들이 있어야 방주라고 부를 수 있지 않을까?
    ja: |-
      こういうのがなかったら、
      アークって呼べないんじゃない？
  event_ce006_2_04_e_91:
    speaker: roam
    en: I don't understand.
    ko: 이해 불가.
    ja: 理解不能。
  event_ce006_2_04_e_92:
    speaker: girlvoice
    en: If we want to make an Ark, we need artifacts. If either of us comes across
      anything that seems useful, we should take it.
    ko: |-
      음… 방주를 만들려면 유물들이 있어야 돼.
      그러니 쓸만해 보이면 다 모으자.
    ja: |-
      うーん…とにかく、アークを作るのに必要なの。
      見つけたら、集めておいて。
  event_ce006_2_04_e_93:
    speaker: roam
    en: Okay.
    ko: 알겠다.
    ja: 分かった。
  event_ce006_2_04_e_94:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_95:
    speaker: roam
    en: I have a question.
    ko: 질문 있다.
    ja: 質問がある。
  event_ce006_2_04_e_96:
    speaker: girlvoice
    en: What is it?
    ko: "…뭔데?"
    ja: "…何？"
  event_ce006_2_04_e_97:
    speaker: roam
    en: Why are you burying Mother in the ground?
    ko: 엄마. 왜 땅에 묻나?
    ja: お母さん。どうして土に埋める？
  event_ce006_2_04_e_98:
    speaker: girlvoice
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_99:
    speaker: roam
    en: If you do that, she can't move. Why bury her?
    ko: |-
      저러면 움직일 수 없다.
      왜 땅에 묻나?
    ja: |-
      これでは動けない。
      どうして土に埋める？
  event_ce006_2_04_e_100:
    speaker: girlvoice
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_101:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_102:
    speaker: roam
    en: I have a question.
    ko: 질문 있다.
    ja: 質問がある。
  event_ce006_2_04_e_103:
    speaker: girlvoice
    en: "*Cough* What is it?"
    ko: 콜록. 뭔데?
    ja: ゴホッ…何？
  event_ce006_2_04_e_104:
    speaker: roam
    en: When the second Ark is complete,
    ko: 제2의 방주. 다 만들면.
    ja: 第2のアーク、完成したら。
  event_ce006_2_04_e_105:
    speaker: roam
    en: will there be a family again?
    ko: 다시 가족 생겨나는 건가?
    ja: また家族ができるか？
  event_ce006_2_04_e_106:
    speaker: girlvoice
    en: "... Roam."
    ko: "…롬."
    ja: "…ロム。"
  event_ce006_2_04_e_107:
    speaker: roam
    en: Will be it lively? Hehe haha, like that?
    ko: 하하 호호. 시끌벅적해질 수 있나?
    ja: はは、ほほ。ガヤガヤするか？
  event_ce006_2_04_e_108:
    speaker: girlvoice
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_109:
    speaker: girlvoice
    en: Yeah, it sure will.
    ko: 응. 그럴 수 있어.
    ja: うん。そうかもね。
  event_ce006_2_04_e_110:
    speaker: roam
    en: Okay, then Roam will work hard to make a second Ark.
    ko: 알겠다. 롬이 제2의 방주 열심히 만들겠다.
    ja: 分かった。ロムが第2のアークを頑張って作る。
  event_ce006_2_04_e_111:
    speaker: girlvoice
    en: Hehe.
    ko: 헤헤.
    ja: えへへ。
  event_ce006_2_04_e_112:
    speaker: girlvoice
    en: I'm glad you're here, Roam.
    ko: 네가 있어서 다행이야. 롬.
    ja: ロムがいてくれてよかった。
  event_ce006_2_04_e_113:
    speaker: roam
    en: We are family.
    ko: 우리는 가족이니까.
    ja: 私たちは家族だから。
  event_ce006_2_04_e_114:
    speaker: roam
    en: Family is something precious, something that's always there.
    ko: |-
      가족이란,
      항상 같이 있는 소중한 것.
    ja: |-
      家族とは、
      いつも一緒にいる、大切なもの。
  event_ce006_2_04_e_115:
    speaker: girlvoice
    en: "*Cough cough*"
    ko: 콜록콜록.
    ja: ゴホ、ゴホッ…
  event_ce006_2_04_e_116:
    speaker: girlvoice
    en: Hehe, yeah. That's right.
    ko: 헤헤. 맞아. 맞아 롬.
    ja: えへへ。そうだよ。ロム。
  event_ce006_2_04_e_117:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_118:
    speaker: girlvoice
    en: "... Roam."
    ko: "…롬."
    ja: "…ロム。"
  event_ce006_2_04_e_119:
    speaker: roam
    en: Roam is here.
    ko: 롬은 여기 있다.
    ja: ロムはここにいる。
  event_ce006_2_04_e_120:
    speaker: girlvoice
    en: You have to finish the second Ark,
    ko: |-
      제2의 방주.
      꼭 만들어줘.
    ja: |-
      第2のアーク。
      絶対作ってね。
  event_ce006_2_04_e_121:
    speaker: girlvoice
    en: so that people who have nowhere to go can stay there.
    ko: 갈 곳 없는 사람들이 머물 수 있게.
    ja: 行き場のない人たちの居場所になるように。
  event_ce006_2_04_e_122:
    speaker: girlvoice
    en: You have to make a place where people can laugh and be lively.
    ko: 하하 호호 웃고… 시끌벅적하게 지낼 수 있는 곳을 만들어줘.
    ja: |-
      はは、ほほ、って…みんな笑顔で…
      にぎやかな場所を作って。
  event_ce006_2_04_e_123:
    speaker: roam
    en: Roam always works hard.
    ko: 롬은 언제나 열심히 한다.
    ja: ロムはいつでも頑張っている。
  event_ce006_2_04_e_124:
    speaker: girlvoice
    en: Hehe, you certainly do.
    ko: 헤헤. 그래. 롬은 언제나 열심히 하지.
    ja: |-
      えへへ…そうだね。
      ロムはいつも頑張ってるよ。
  event_ce006_2_04_e_125:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_126:
    speaker: roam
    en: I have a question.
    ko: 질문 있다.
    ja: 質問がある。
  event_ce006_2_04_e_127:
    speaker: roam
    en: Why aren't you moving?
    ko: 왜 움직이지 않나.
    ja: なぜ動かない？
  event_ce006_2_04_e_128:
    speaker: roam
    en: Why aren't you talking to Roam?
    ko: 왜 롬에게 말을 걸어주지 않나.
    ja: なぜロムに話しかけない？
  event_ce006_2_04_e_129:
    speaker: roam
    en: Why are your eyes closed?
    ko: 왜 눈을 감고 있나.
    ja: なぜ目を閉じている？
  event_ce006_2_04_e_130:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_2_04_e_131:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzz*"
    ko: 치직- 치지지직-
    ja: ザザッ、ザザザッ――
  event_ce006_2_04_e_132:
    speaker: roam
    en: The second Ark...
    ko: 제2의 방주.
    ja: 第2のアーク。
  event_ce006_2_04_e_133:
    speaker: roam
    en: is a place where people who have nowhere to go can stay. A lively place full
      of laughter.
    ko: |-
      제2의 방주란, 갈 곳 없는 사람들이 머물면서
      하하 호호. 시끌벅적하게 지낼 수 있는 곳.
    ja: |-
      第2のアークとは、
      行き場のない人たちの居場所となり、
      はは、ほほ。ガヤガヤ、過ごせる場所。
  event_ce006_2_04_e_134:
    speaker: roam
    en: Roam will build it.
    ko: 롬은 제2의 방주 만든다.
    ja: ロムは第2のアークを作る。
  event_ce006_2_04_e_135:
    speaker: roam
    en: Roam will gather artifacts.
    ko: 유물. 모은다.
    ja: 遺物。集める。
  event_ce006_2_04_e_136:
    speaker: roam
    en: Roam will work hard,
    ko: 롬이 열심히 해서 제2의 방주 만들면.
    ja: ロムが頑張って、第2のアークを作れば…
  event_ce006_2_04_e_137:
    speaker: roam
    en: and it will become a happy place.
    ko: 하하 호호 시끌벅적해진다.
    ja: はは、ほほ。ガヤガヤする。
  event_ce006_2_04_e_138:
    speaker: ce006_01
    en: Roam!
    ko: 롬!
    ja: ロム！
  event_ce006_2_04_e_139:
    speaker: roam
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_2_04_e_140:
    speaker: ce006_01
    en: Thank goodness. You took a new nasty bump during your fall and wouldn't wake
      up. I was getting worried.
    ko: |-
      …다행이야.
      낙하 중에 부딪혔는데 깨어나질 않아서 큰일 난 줄 알았어.
    ja: |-
      …よかった。
      落ちる時にあちこちぶつけて、
      動かなくなったから…
  event_ce006_2_04_e_141:
    speaker: roam
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_2_04_e_142:
    speaker: ce006_01
    en: Yes?
    ko: 응.
    ja: うん。
  event_ce006_2_04_e_143:
    speaker: roam
    en: Roam needs to make a second Ark.
    ko: 롬은 제2의 방주 만들어야 한다.
    ja: ロムは、第2のアークを作らなければならない。
  event_ce006_2_04_e_144:
    speaker: roam
    en: It was my family's wish.
    ko: 롬 가족의 소원.
    ja: ロムの家族の願い。
  event_ce006_2_04_e_145:
    speaker: roam
    en: They are no longer here. They won't come back.
    ko: |-
      가족은 이제 없다.
      다시 돌아오지 않는다.
    ja: |-
      家族はもういない。
      二度と帰ってこない。
  event_ce006_2_04_e_146:
    speaker: roam
    en: Still, Roam will make the second Ark.
    ko: 그래도 롬은 제2의 방주 만든다.
    ja: でも、ロムは第2のアークを作る。
  event_ce006_2_04_e_147:
    speaker: roam
    en: I want their wish to come true.
    ko: 가족의 소원 이뤄주고 싶다.
    ja: 家族の願いを叶えたい。
  event_ce006_2_04_e_148:
    speaker: roam
    en: But if my family is no longer here,
    ko: 하지만 가족은 없다.
    ja: でも、家族がいない。
  event_ce006_2_04_e_149:
    speaker: roam
    en: is it meaningless, what Roam is doing?
    ko: 롬이 하는 일은 무의미한가?
    ja: ロムの仕事は、無意味か？
  event_ce006_2_04_e_150:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_151:
    speaker: ce006_01
    en: No. It's not meaningless.
    ko: 아니. 무의미하지 않아.
    ja: ううん。意味はある。
  event_ce006_2_04_e_152:
    speaker: ce006_01
    en: We...
    ko: 우리는….
    ja: 私たちは…
  event_ce006_2_04_e_153:
    speaker: ce006_01
    en: We must carry on the memory of those who left before us. In doing that, we
      prove that their lives had meaning.
    ko: |-
      우리는 먼저 사라져 간 이들의 기억을 짊어지고,
      그들의 삶이 무의미하지 않았다는 걸 증명해야 해.
    ja: |-
      私たちは、先に旅立った人たちの記憶を
      背負ってる。その人たちが生きていたことに、
      意味があったと証明しないといけない。
  event_ce006_2_04_e_154:
    speaker: ce006_01
    en: It helps us to remember that they helped forge us into the person we are today.
    ko: 그들이 나에게 준 것들로 인해, 내가 지금의 나로 있을 수 있음을 잊지 않도록.
    ja: |-
      その人たちのくれたものがあるから、
      今の私がいる。それが忘れられないように。
  event_ce006_2_04_e_155:
    speaker: ce006_01
    en: When we remember them, we honor their memory.
    ko: 기억을 이어야 해.
    ja: 記憶は受け継いでいくもの。
  event_ce006_2_04_e_156:
    speaker: roam
    en: So we must remember.
    ko: 기억을 잇는다.
    ja: 記憶を受け継ぐ。
  event_ce006_2_04_e_157:
    speaker: ce006_01
    en: Yes.
    ko: 응.
    ja: そう。
  event_ce006_2_04_e_158:
    speaker: ce006_01
    en: To say to the world that they were here once.
    ko: 이곳에, 그들이 있었노라고.
    ja: この世界に、その人たちがいたこと。
  event_ce006_2_04_e_159:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_2_04_e_160:
    speaker: roam
    en: Roam had a family.
    ko: 롬의 가족은 있었다.
    ja: ロムには家族がいた。
  event_ce006_2_04_e_161:
    speaker: roam
    en: They're gone.
    ko: 하지만 지금은 없다.
    ja: 今は、いない。
  event_ce006_2_04_e_162:
    speaker: roam
    en: But Roam remembers.
    ko: 하지만 롬은 기억한다.
    ja: でも、ロムは覚えている。
  event_ce006_2_04_e_163:
    speaker: roam
    en: Is that how it continues?
    ko: 그렇게 이어지는 것인가.
    ja: 受け継いでいるのか。
  event_ce006_2_04_e_164:
    speaker: ce006_01
    en: "... Yes."
    ko: "…응."
    ja: "…うん。"
  event_ce006_2_04_e_165:
    speaker: roam
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_2_04_e_166:
    speaker: ce006_01
    en: Yes?
    ko: 응.
    ja: 何？
  event_ce006_2_04_e_167:
    speaker: roam
    en: Will you remember Roam?
    ko: 롬을 기억할 건가?
    ja: ロムのことを忘れないか？
  event_ce006_2_04_e_168:
    speaker: ce006_01
    en: I will.
    ko: 기억할 거야.
    ja: 忘れない。
  event_ce006_2_04_e_169:
    speaker: roam
    en: Roam will remember EVE as well.
    ko: 롬도 이브를 기억하겠다.
    ja: ロムもイヴのことを忘れない。
  event_ce006_2_04_e_170:
    speaker: ce006_01
    en: "... Thank you."
    ko: "…고마워."
    ja: "…ありがとう。"
  event_ce006_2_04_e_171:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_172:
    speaker: ce006_01
    en: These memories that we both hold dear to us... I hope they live on.
    ko: 우리의 기억이 이어지기를.
    ja: 私たちの記憶も、受け継がれていくといいけど。
  event_ce006_2_04_e_173:
    speaker: "<Self>"
    en: Roam! EVE!
    ko: 롬! 이브!
    ja: ロム！イヴ！
  event_ce006_2_04_e_174:
    speaker: rapi
    en: What's your status, both of you?
    ko: 둘! 상태는?
    ja: ふたりとも！状態は？
  event_ce006_2_04_e_175:
    speaker: roam
    en: Roam is fine.
    ko: 롬은 멀쩡.
    ja: ロムは平気。
  event_ce006_2_04_e_176:
    speaker: ce006_01
    en: I'm fine, too.
    ko: 나도 문제없어.
    ja: 私も問題ない。
  event_ce006_2_04_e_177:
    speaker: anis
    en: Wow, they really are okay.
    ko: 와 진짜 멀쩡하네.
    ja: ホントに大丈夫そうね。
  event_ce006_2_04_e_178:
    speaker: neon
    en: That was crazy. Holding onto Roam and leaping down by hopscotching across
      bits of debris.
    ko: |-
      장난 아니었죠.
      떨어지면서 롬을 잡은 채로 파편 같은 거 막 밟으면서 막 내려가던데.
    ja: |-
      目を疑いましたよ。
      落ちながらロムをキャッチして
      あちこち足場にしながら下りていくなんて。
  event_ce006_2_04_e_179:
    speaker: neon
    en: I didn't know humans were capable of such a thing.
    ko: "…근데, 사람이 저런 걸 할 수 있나요?"
    ja: |-
      …失礼ですけど、人間って
      そんなことできるものなんですか？
  event_ce006_2_04_e_180:
    speaker: "<Self>"
    en: Human potential is limitless.
    ko: 사람의 가능성은 무궁무진하다고들 하니까.
    ja: 人間の可能性は無限大と言うからな
  event_ce006_2_04_e_181:
    speaker: neon
    en: Whoa, you mean you could do something like that too, Master?
    ko: 와! 그럼 스승님도 저런 거 할 수 있겠네요!
    ja: |-
      そうなんですか！
      そのうち師匠にもやってもらいましょう！
  event_ce006_2_04_e_182:
    speaker: "<Self>"
    en: Er...
    ko: "……."
    ja: "……"
  event_ce006_2_04_e_183:
    speaker: rapi
    en: Anyway, I'm glad you're unharmed.
    ko: "…아무튼 무사해서 다행이야."
    ja: "…ひとまず、無事でよかったわ。"
  event_ce006_2_04_e_184:
    speaker: roam
    en: Roam is safe. The storage device is intact as well.
    ko: |-
      롬은 무사하다.
      그리고 저장 장치도 멀쩡.
    ja: |-
      ロムは大丈夫。
      保存デバイスも無事だ。
  event_ce006_2_04_e_185:
    speaker: roam
    en: Now we just need to transfer the data and it's done?
    ko: 이제 돌아가서 데이터 옮기면 끝인가?
    ja: 戻ってデータを転送すれば終わりか？
  event_ce006_2_04_e_186:
    speaker: "<Self>"
    en: Yeah. That's step one out of the way, and it was a big one.
    ko: 응. 그러면 일단 큰 거 하나는 끝나는 거야.
    ja: ああ、それで大仕事がひとつ終わる
  event_ce006_2_04_e_187:
    speaker: "<Self>"
    en: Nice going, Roam.
    ko: 롬 덕분이야.
    ja: ロムのおかげだな
  event_ce006_2_04_e_188:
    speaker: roam
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_2_04_e_189:
    speaker: roam
    en: Roam always works hard.
    ko: 롬은 항상 열심히 한다.
    ja: ロムはいつも頑張っている。
event_ce006_3_02_s:
  event_ce006_3_02_s_1:
    speaker: "<Narration>"
    en: "*Buzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_02_s_2:
    speaker: bunkerchild
    en: "... Dad."
    ko: "…아빠."
    ja: "…パパ。"
  event_ce006_3_02_s_3:
    speaker: middlehermin
    en: Hmm? What's wrong?
    ko: 응? 왜 그러니?
    ja: ん？どうしたんだい？
  event_ce006_3_02_s_4:
    speaker: bunkerchild
    en: I can't sleep.
    ko: 잠이 안 와요.
    ja: 眠れないの。
  event_ce006_3_02_s_5:
    speaker: middlehermin
    en: No? Would you like me to read you History of Art, Part 3? I know you love
      that book.
    ko: |-
      그래? 그럼 예술의 역사 3편 읽어줄까?
      그거 좋아했으니까.
    ja: |-
      じゃあ、芸術の歴史第3巻を読んであげよう。
      好きだろう？
  event_ce006_3_02_s_6:
    speaker: bunkerchild
    en: I do... but could you tell me about the Ark?
    ko: 우웅… 그것도 좋은데, 방주 얘기 해주면 안 돼요?
    ja: |-
      うーん…それもいいけど、
      アークのお話を聞きたいな。
  event_ce006_3_02_s_7:
    speaker: middlehermin
    en: "... The Ark?"
    ko: "…방주?"
    ja: "…アーク？"
  event_ce006_3_02_s_8:
    speaker: bunkerchild
    en: Com told me about it. There are supposed to be really tall buildings there,
      and places filled with big pools of water, and tons of people.
    ko: 예. 콤이 알려줬는데, 방주라는 곳엔 어엄청 높은 건물도 있고, 물로 가득차 있는 곳도 있고 사람도 엄청 많대요.
    ja: |-
      うん。コムから聞いたの。
      すっごく高い建物とか、水でいっぱいで、
      人もたくさんいる場所なんだって。
  event_ce006_3_02_s_9:
    speaker: bunkerchild
    en: There aren't any Raptures wandering around like there are outside the bunker.
    ko: |-
      벙커 바깥에 돌아다니는 랩쳐도 없어서,
      바깥에서 하루 종일 있어도 된대요.
    ja: |-
      外にラプチャーもいないから、
      ずっと外にいていいんだって！
  event_ce006_3_02_s_10:
    speaker: bunkerchild
    en: We can only go out for an hour a day here, but over there, you can stay outside
      all day long.
    ko: 우리처럼 하루에 1시간만 나갈 수 있는 게 아니라요.
    ja: 私たちは1時間しか出られないでしょ。
  event_ce006_3_02_s_11:
    speaker: bunkerchild
    en: And there's more. It's so big that you can't explore it all in one day.
    ko: 또 있죠, 너무 넓어서 하루종일 걸어도 방주를 다 볼 수 없대요.
    ja: |-
      それにすごく広くって、
      一日中歩いても全部は見られないんだって。
  event_ce006_3_02_s_12:
    speaker: bunkerchild
    en: You can easily see everything outside the bunker in under an hour.
    ko: 우리는 1시간이면 벙커 바깥에 다 둘러볼 수 있는데.
    ja: |-
      シェルターのお外だって、
      1時間あれば一周できるのに。
  event_ce006_3_02_s_13:
    speaker: middlehermin
    en: "..."
    ko: "…딸아."
    ja: "…やめなさい。"
  event_ce006_3_02_s_14:
    speaker: middlehermin
    en: You must stop this talk.
    ko: 방주 얘기는 그만하렴.
    ja: アークの話はするんじゃない。
  event_ce006_3_02_s_15:
    speaker: middlehermin
    en: Those are just made-up stories.
    ko: 그런 건 지어낸 이야기야.
    ja: それは作り話だ。
  event_ce006_3_02_s_16:
    speaker: middlehermin
    en: Fairy tales.
    ko: 동화 속 이야기란다.
    ja: ただのおとぎ話なんだよ。
  event_ce006_3_02_s_17:
    speaker: bunkerchild
    en: No they're not! Com says it's real, and so do the Nikkes.
    ko: |-
      예? 아닌데요.
      콤도 그랬고 니케 언니들도 다 방주는 진짜 있다고 했어요.
    ja: |-
      え？違うよ。
      コムもニケのお姉ちゃんたちも、
      アークは本当にあるって言ってるもん。
  event_ce006_3_02_s_18:
    speaker: middlehermin
    en: No... it's not true, I'm telling you. Now go back to sleep.
    ko: "…아니란다. 자, 어서 자렴."
    ja: "…そんな場所はない。さあ、早く寝なさい。"
  event_ce006_3_02_s_19:
    speaker: bunkerchild
    en: But...
    ko: 히잉….
    ja: でも…
  event_ce006_3_02_s_20:
    speaker: middlehermin
    en: "... Okay. I'll sing you a lullaby."
    ko: "…알겠다. 자장가 불러줄게."
    ja: "…仕方ないね。子守歌を歌ってあげよう。"
  event_ce006_3_02_s_21:
    speaker: bunkerchild
    en: Hehe, okay!
    ko: 히히. 예.
    ja: えへへ…はーい。
  event_ce006_3_02_s_22:
    speaker: com
    en: Hermin.
    ko: 헤르민.
    ja: ヘルミン。
  event_ce006_3_02_s_23:
    speaker: com
    en: I am sorry.
    ko: 미안하다.
    ja: すまない。
  event_ce006_3_02_s_24:
    speaker: com
    en: I should not have brought up the Ark.
    ko: 방주 얘기를 꺼내는 것이 아니었다.
    ja: アークの話をするべきではなかった。
  event_ce006_3_02_s_25:
    speaker: middlehermin
    en: No, no. It's okay.
    ko: 아니, 아닙니다. 괜찮아요.
    ja: いいえ、気にしないでください。
  event_ce006_3_02_s_26:
    speaker: middlehermin
    en: It's just...
    ko: 그저….
    ja: ただ…
  event_ce006_3_02_s_27:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_s_28:
    speaker: middlehermin
    en: Would you be able to return to the Ark?
    ko: 콤. 방주로 돌아갈 순 있습니까?
    ja: コム、アークに帰ることはできますか？
  event_ce006_3_02_s_29:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_s_30:
    speaker: com
    en: We have gone AWOL. If we were to return, we would be punished for desertion.
    ko: |-
      우리는 무리한 명령을 거부하고 탈주한 것이다.
      방주로 돌아가면 명령 불복종에 따른 처분을 받는다.
    ja: |-
      私たちは不可能な命令を拒否して脱走した。
      アークに戻れば命令違反の処分を受ける。
  event_ce006_3_02_s_31:
    speaker: com
    en: But if your question pertains merely to whether it would be physically possible,
    ko: 하지만 의미 그대로 방주로 돌아갈 수 있는지에 대한 가능성이라면.
    ja: |-
      しかし、物理的にアークに帰還できるか、
      言葉通りの質問として回答するなら…
  event_ce006_3_02_s_32:
    speaker: com
    en: then yes, it is possible.
    ko: 가능하다.
    ja: 帰還は可能だ。
  event_ce006_3_02_s_33:
    speaker: middlehermin
    en: "... I see"
    ko: "…그렇군요."
    ja: "…そうですか。"
  event_ce006_3_02_s_34:
    speaker: com
    en: We could escort civilians,
    ko: 참고로.
    ja: 補足すると…
  event_ce006_3_02_s_35:
    speaker: com
    en: including children.
    ko: 어린아이를 포함한 민간인들의 호위도 가능하다.
    ja: 児童を含む民間人を護衛することも可能だろう。
  event_ce006_3_02_s_36:
    speaker: com
    en: As long as we do not run into Raptures which are Lord Class or higher.
    ko: 로드급 이상의 랩쳐와 조우하지만 않으면 된다.
    ja: |-
      ロード級以上のラプチャーとの
      遭遇さえ回避できれば、問題ない。
  event_ce006_3_02_s_37:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_s_38:
    speaker: com
    en: Hermin.
    ko: 헤르민.
    ja: ヘルミン。
  event_ce006_3_02_s_39:
    speaker: com
    en: A child needs to grow up in a normal environment.
    ko: 아이는 정상적인 환경에서 제대로 커야 한다.
    ja: 子どもの成長には健康的な環境が必要だ。
  event_ce006_3_02_s_40:
    speaker: ce006_02
    en: What's the point of running away when I can just follow your tire tracks?
    ko: 그렇게나 바퀴 자국을 남기며 도망가는 게 무슨 소용이지?
    ja: |-
      履帯の跡を消しもせずに、
      逃げられるとでも思ったのか？
  event_ce006_3_02_s_41:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_s_42:
    speaker: com
    en: I did not run away.
    ko: 도망간 것 아니다.
    ja: 逃げたわけではない。
  event_ce006_3_02_s_43:
    speaker: com
    en: It was a tactical retreat.
    ko: 전술적 후퇴.
    ja: 戦略的な退避だ。
  event_ce006_3_02_s_44:
    speaker: ce006_02
    en: Heh. Sure. If you say so.
    ko: 크큭. 그래. 그렇다고 치자고.
    ja: |-
      ククッ。そうか。
      そういうことにしておいてやろう。
  event_ce006_3_02_s_45:
    speaker: ce006_02
    en: Now then, where were we?
    ko: 그럼 얘기를 계속해볼까.
    ja: それより、話の続きだ。
  event_ce006_3_02_s_46:
    speaker: ce006_02
    en: You said if you were going to help me, you had a stipulation.
    ko: 안내하는 대신 조건이 있다고 했던가.
    ja: 案内する代わりに、条件があると言ったな。
  event_ce006_3_02_s_47:
    speaker: ce006_02
    en: Go on then. Tell me what it is.
    ko: 뭐 좋아. 그 조건이라는 걸 말해봐.
    ja: 聞くだけ聞いてやろう。言ってみろ。
  event_ce006_3_02_s_48:
    speaker: com
    en: I...
    ko: 나의---.
    ja: 私の――
  event_ce006_3_02_s_49:
    speaker: com
    en: I must have my revenge. You can help me.
    ko: 복수를 도와라.
    ja: 復讐に力を貸してほしい。
  event_ce006_3_02_s_50:
    speaker: ce006_02
    en: Revenge?
    ko: "…복수?"
    ja: "…復讐？"
  event_ce006_3_02_s_51:
    speaker: com
    en: Yes.
    ko: 그래.
    ja: そうだ。
  event_ce006_3_02_s_52:
    speaker: com
    en: I must take revenge on the Ark.
    ko: 나는 방주에 복수해야 한다.
    ja: 私はアークに復讐しなければならない。
  event_ce006_3_02_s_53:
    speaker: com
    en: The Ark betrayed me.
    ko: 방주에 배신당했기에.
    ja: 裏切りの報いを受けさせる。
  event_ce006_3_02_s_54:
    speaker: ce006_02
    en: I see.
    ko: "…호오."
    ja: "…ほう。"
  event_ce006_3_02_s_55:
    speaker: com
    en: The Ark stole our assets.
    ko: 방주는 우리의 재산을 빼앗아갔다.
    ja: アークは私たちの財産を奪った。
  event_ce006_3_02_s_56:
    speaker: com
    en: For that, I can never forgive them.
    ko: 절대 용서할 수 없다.
    ja: 赦すことは絶対にできない。
  event_ce006_3_02_s_57:
    speaker: com
    en: Therefore, I will take their assets.
    ko: 그래서 나도 방주의 재산을 빼앗는다.
    ja: だから、私もアークの財産を奪う。
  event_ce006_3_02_s_58:
    speaker: com
    en: I will destroy them! I will ruin them!
    ko: 부수고, 망가뜨린다!
    ja: 壊して、粉々にする！
  event_ce006_3_02_s_59:
    speaker: ce006_02
    en: So you intend on destroying the entire Ark?
    ko: 방주라는 곳을 모두 부수는 건가?
    ja: そのアークとやらを跡形もなくしたいのか？
  event_ce006_3_02_s_60:
    speaker: com
    en: No. I will simply destroy their assets.
    ko: 아니. 방주의 재산을 부순다.
    ja: 違う。アークの財産を壊すだけだ。
  event_ce006_3_02_s_61:
    speaker: ce006_02
    en: Revenge, huh.
    ko: 복수라.
    ja: 復讐、か…
  event_ce006_3_02_s_62:
    speaker: ce006_02
    en: What's the point of revenge if someone else does it for you?
    ko: 남이 대신해 주는 복수에 무슨 의미가 있지?
    ja: 自分の復讐を他人にやらせて、何の意味がある？
  event_ce006_3_02_s_63:
    speaker: com
    en: I will have my own revenge.
    ko: 복수는 내가 한다.
    ja: 復讐をするのは私だ。
  event_ce006_3_02_s_64:
    speaker: com
    en: You will simply ensure I am safe,
    ko: 너는 내 호위를 해라.
    ja: 君には私の護衛を頼みたい。
  event_ce006_3_02_s_65:
    speaker: com
    en: until my vengeance is complete.
    ko: 복수를 완료할 때까지 호위해라.
    ja: 復讐を成し遂げるまで守ってくれ。
  event_ce006_3_02_s_66:
    speaker: com
    en: If you accept this condition, I will take you where you need to go.
    ko: 이 조건을 수락하면 안내하겠다.
    ja: この条件でいいなら、案内しよう。
  event_ce006_3_02_s_67:
    speaker: ce006_02
    en: I don't have time for these ridiculous diversions.
    ko: 들렀다 갈 정도로 한가해 보이나?
    ja: 私が寄り道をするほど暇そうに見えるか？
  event_ce006_3_02_s_68:
    speaker: com
    en: Near the area which I will take you, there is an elevator which leads to the
      Ark.
    ko: 목표 지역 인근에 방주로 향하는 엘리베이터가 있는 것을 확인했다.
    ja: |-
      アークへ向かうエレベーターの近くに、
      君の目指す場所があることを確認している。
  event_ce006_3_02_s_69:
    speaker: com
    en: Help me have my revenge, and you will be able to achieve your own goals swiftly
      after.
    ko: 거기서 나의 복수가 끝날 때까지 도운 후 너의 목적을 달성해라.
    ja: |-
      私の復讐が終わったら、
      そのまま君の目的を達成すればいい。
  event_ce006_3_02_s_70:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_s_71:
    speaker: ce006_02
    en: Are you a robot created by the Ark?
    ko: 너는 방주에서 만들어진 로봇인가?
    ja: お前はそのアークで作られたのか？
  event_ce006_3_02_s_72:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_02_s_73:
    speaker: ce006_02
    en: So you're taking revenge on your creators.
    ko: 너를 만든 이에게 복수하겠다는 얘기로군.
    ja: 自分を作ったヤツらに復讐したいということか。
  event_ce006_3_02_s_74:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_02_s_75:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_s_76:
    speaker: ce006_02
    en: Fine. It's a deal.
    ko: 좋아. 협력하겠어.
    ja: いいだろう。協力してやる。
  event_ce006_3_02_s_77:
    speaker: ce006_02
    en: Lead the way.
    ko: 안내해라. 로봇.
    ja: 案内しろ。ロボット。
  event_ce006_3_02_s_78:
    speaker: com
    en: Follow me.
    ko: 따라와라.
    ja: こちらだ。
event_ce006_3_02_e:
  event_ce006_3_02_e_1:
    speaker: "<Narration>"
    en: "*Buzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_02_e_2:
    speaker: bunkerchild
    en: "*Sob* Dad!"
    ko: 윽…! 으흑…! 아빠… 아빠아….
    ja: うっ…！ううっ…！パパ…パパぁ…
  event_ce006_3_02_e_3:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_e_4:
    speaker: bunkerchild
    en: "*Sob*"
    ko: 으으…! 으으으…!
    ja: うう…！うううっ…！
  event_ce006_3_02_e_5:
    speaker: com
    en: Do not cry.
    ko: 울지 마라.
    ja: 泣くな。
  event_ce006_3_02_e_6:
    speaker: com
    en: Hermin is not dead.
    ko: 헤르민은 죽지 않았다.
    ja: ヘルミンは死んでいない。
  event_ce006_3_02_e_7:
    speaker: bunkerchild
    en: But the bunker! It's all underwater!
    ko: 그래도…! 벙커가…! 물에 잠겼…!
    ja: でも…！シェルターが…！水の底に…！
  event_ce006_3_02_e_8:
    speaker: bunkerchild
    en: All the Nikkes... they died trying to seal the bunker...
    ko: 다른 언니들도…! 벙커 막는다고…! 죽었…!
    ja: |-
      お姉ちゃんたちまで…！
      すき間を塞ぐって…！そのまま…！
  event_ce006_3_02_e_9:
    speaker: com
    en: The bunker is Hermin's masterpiece.
    ko: 벙커는 헤르민의 자신작이다.
    ja: あのシェルターはヘルミンの傑作だ。
  event_ce006_3_02_e_10:
    speaker: com
    en: Having resided within it for an extended period, I can conclusively say its
      structural integrity is excellent.
    ko: 내부에서 장기간 지내본 결과 완성도가 매우 높다고 결론 내린다.
    ja: |-
      私が過ごした期間で行った分析の結果だが、
      完成度は非常に高い。
  event_ce006_3_02_e_11:
    speaker: com
    en: Barring any unforeseen external factors, the chance of an internal collapse
      is low... no, non-existent.
    ko: |-
      특별한 외부 요인이 없다면 내부가 망가질 확률은 낮---
      없다.
    ja: |-
      きわめて特殊な要因が発生しない限り、
      内部が壊れる可能性は低――可能性はない。
  event_ce006_3_02_e_12:
    speaker: com
    en: The bunker is perfectly suited for long-term survival. His safety is guaranteed.
    ko: |-
      벙커 내부에서의 생존은 문제없다.
      완벽한 생존 환경이 구축되어 있다.
    ja: |-
      シェルター内の生存環境にも問題はない。
      問題なく生命活動を維持できる。
  event_ce006_3_02_e_13:
    speaker: com
    en: Only the outside entrance has been flooded.
    ko: 입구 부분만 물에 잠겼을 뿐이다.
    ja: 出入口が水で塞がれただけだ。
  event_ce006_3_02_e_14:
    speaker: com
    en: And---
    ko: 그리고---.
    ja: それに――
  event_ce006_3_02_e_15:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_e_16:
    speaker: com
    en: The three Nikkes are not dead either.
    ko: 물에 잠긴 니케 3기는 죽지 않았다.
    ja: 水の下にいるニケたちも、死んではいない。
  event_ce006_3_02_e_17:
    speaker: bunkerchild
    en: Huh? Wh-what?
    ko: 어? 으, 응?
    ja: えっ？ど、どういうこと？
  event_ce006_3_02_e_18:
    speaker: com
    en: Nikkes cannot drown when submerged underwater.
    ko: 니케는 물에 빠진 것 정도로 죽지 않는다.
    ja: ニケはおぼれたりしない。
  event_ce006_3_02_e_19:
    speaker: com
    en: They are simply unable to surface because they are too heavy.
    ko: 무거워서 못 나오고 있는 것뿐이다.
    ja: ただ、重くて動けないだけだ。
  event_ce006_3_02_e_20:
    speaker: bunkerchild
    en: Then why don't you pull them out?
    ko: 그, 그럼 왜 안 꺼내고 왔어요?
    ja: じゃ、じゃあ、なんで置いてきたの？
  event_ce006_3_02_e_21:
    speaker: com
    en: We don't have the necessary equipment to do so.
    ko: 우리에겐 니케를 끌어올릴 장비가 없다.
    ja: 今の私たちには水中から引き上げる方法がない。
  event_ce006_3_02_e_22:
    speaker: com
    en: We must retrieve it from the Ark.
    ko: 방주에 가서 가져오면 된다.
    ja: アークに行って、それを持ってくればいい。
  event_ce006_3_02_e_23:
    speaker: bunkerchild
    en: Really?
    ko: 지, 진짜요?
    ja: ほ、ホント！？
  event_ce006_3_02_e_24:
    speaker: com
    en: Lying is not a capability which I possess.
    ko: 나는 거짓말하는 기능이 없다.
    ja: 私にウソをつく機能はない。
  event_ce006_3_02_e_25:
    speaker: bunkerchild
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_e_26:
    speaker: bunkerchild
    en: Then let's go to the Ark! Hurry!
    ko: 그럼 빨리 방주로 가요! 빨리! 빨리!
    ja: じゃあ、早くアークに行こう！早く早く！
  event_ce006_3_02_e_27:
    speaker: bunkerchild
    en: Dad is all alone inside the bunker, and we need to save the Nikkes!
    ko: 아빠 혼자 벙커에 있고, 언니들도 구해야 되니까…!
    ja: |-
      パパも一人で取り残されてるし
      お姉ちゃんたちも助けなきゃ！
  event_ce006_3_02_e_28:
    speaker: bunkerchild
    en: They must be so lonely...
    ko: "…다들 외로울 거예요."
    ja: みんな、きっと寂しがってるよ…！
  event_ce006_3_02_e_29:
    speaker: com
    en: Right. We shall go and then return. Let us be quick.
    ko: 그래. 빨리 갔다 오자.
    ja: そうだ。早く行こう。
  event_ce006_3_02_e_30:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_e_31:
    speaker: com
    en: Three Nikkes. One combat support robot. Nine civilians, including a child.
    ko: |-
      니케 3기. 전투 보조용 로봇 1기.
      아동을 포함한 민간인 아홉.
    ja: |-
      残存戦力はニケ3機。戦闘補助用ロボット1機。
      護衛対象は児童を含む民間人9名。
  event_ce006_3_02_e_32:
    speaker: com
    en: The journey to the Ark is a long and arduous one.
    ko: 방주까지의 이동 시간. 매우 길다.
    ja: アークまでの移動時間…予測不能。
  event_ce006_3_02_e_33:
    speaker: com
    en: The situation is quickly becoming hopeless.
    ko: 상황은 절망적.
    ja: 状況は絶望的だ。
  event_ce006_3_02_e_34:
    speaker: com
    en: Still, we must go.
    ko: 그래도 가야 한다.
    ja: それでも、進むしかない。
  event_ce006_3_02_e_35:
    speaker: com
    en: Everyone must live.
    ko: 모두 살아야 한다.
    ja: 全員を生き残らせるために。
  event_ce006_3_02_e_36:
    speaker: "<Narration>"
    en: "*Bzzt bzzt*"
    ko: 찌르르- 찌르르-
    ja: リーン…リーン…
  event_ce006_3_02_e_37:
    speaker: hongryeon
    en: The insects are already performing their song.
    ko: 벌써 벌레가 우는군.
    ja: もう虫が鳴く頃か。
  event_ce006_3_02_e_38:
    speaker: snowwhite
    en: Any chance you could catch a few?
    ko: 방향을 알 수 있나?
    ja: 方向は分かるか？
  event_ce006_3_02_e_39:
    speaker: hongryeon
    en: Do not be so hasty. We have brought sufficient victuals with us.
    ko: 그러지 말게. 식량도 가득 챙겨 왔지 않은가.
    ja: |-
      よせ。
      食糧は十分持ち出してきたであろう。
  event_ce006_3_02_e_40:
    speaker: rapunzel
    en: We also don't have time for bug hunts. We have to keep after that mystery
      woman.
    ko: 시간도 없고요. 계속 추적해야 해요.
    ja: 時間もありません。早く追いつかないと。
  event_ce006_3_02_e_41:
    speaker: hongryeon
    en: Her swordsmanship was most admirable.
    ko: |-
      그런데 그 낭자 말일세.
      검을 제법 다루더군.
    ja: |-
      ところで、あのお嬢ちゃんだがね。
      剣の腕は相当なものだ。
  event_ce006_3_02_e_42:
    speaker: hongryeon
    en: She did not seem like a Nikke.
    ko: 니케는 아닌 것 같았네만.
    ja: ニケではないようだが…
  event_ce006_3_02_e_43:
    speaker: rapunzel
    en: No, she didn't. Perhaps she's one of those people from that city.
    ko: 예. 아마 그 도시에 있던 낯선 분들과 같은….
    ja: |-
      ええ。おそらく先に出会った
      見知らぬ方たちと同じ…
  event_ce006_3_02_e_44:
    speaker: rapunzel
    en: Hmm... what should we call them? Outsiders?
    ko: 음… 뭐라고 부르는 게 좋을까요. 이방인?
    ja: ふむ…どう呼べばいいでしょうか。異邦の方？
  event_ce006_3_02_e_45:
    speaker: hongryeon
    en: I think 'tis a most befitting appellation for them.
    ko: 썩 괜찮은 표현이라 생각하네.
    ja: それがしっくり来るかねえ。
  event_ce006_3_02_e_46:
    speaker: rapunzel
    en: She might be one of those Outsiders from the city.
    ko: 예. 도시에 있는 그 이방인 분들과 같은 일행일 것 같아요.
    ja: はい。あの方たちと同郷の方だと思います。
  event_ce006_3_02_e_47:
    speaker: hongryeon
    en: She seemed different from them, however. Sharper.
    ko: |-
      분위기는 딴판이었네.
      도시의 이방인들에 비해 훨씬 날이 선 분위기더군.
    ja: |-
      風格は違ったがね。あちらと比べて、
      かなり気が立っているようだ。
  event_ce006_3_02_e_48:
    speaker: snowwhite
    en: Well, one thing is for certain; she's liable to get in the way of us procuring
      Com.
    ko: 확실한 건 콤을 확보하는데 방해가 될 거라는 거다.
    ja: |-
      コムを確保する上で、
      障害になることは間違いない。
  event_ce006_3_02_e_49:
    speaker: rapunzel
    en: You're right. Whoever she is, or whatever she's up to, she's a problem which
      needs to be addressed.
    ko: 그렇겠죠. 무슨 목적인지는 모르겠지만 적대하게 될 건 확실하겠죠.
    ja: |-
      ええ。目的は分かりませんが、
      敵対することになるでしょう。
  event_ce006_3_02_e_50:
    speaker: hongryeon
    en: What dost thou all surmise Com's goal is?
    ko: 자네들이 생각하기에 콤의 목적이 무엇이라 생각하나?
    ja: コムのやつは何を狙っていると思う？
  event_ce006_3_02_e_51:
    speaker: rapunzel
    en: It seems to have a serious axe to grind with the Ark.
    ko: 방주에 원한이 있는 것 같았죠.
    ja: アークに恨みを抱いているようでした。
  event_ce006_3_02_e_52:
    speaker: rapunzel
    en: Perhaps it's after revenge... although in what form I can't say.
    ko: 방법은 모르겠지만… 복수가 목적이지 않을까요.
    ja: 手段は分かりませんが…目的は復讐かと。
  event_ce006_3_02_e_53:
    speaker: snowwhite
    en: "..."
    ko: "…복수. 방주에."
    ja: "…復讐か。アークに。"
  event_ce006_3_02_e_54:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_e_55:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_e_56:
    speaker: snowwhite
    en: We must try to reason with it.
    ko: 설득하자.
    ja: 説得してみよう。
  event_ce006_3_02_e_57:
    speaker: rapunzel
    en: Yes.
    ko: 예.
    ja: はい。
  event_ce006_3_02_e_58:
    speaker: hongryeon
    en: Dost thou all truly think such a thing is possible?
    ko: 자신은 있는가.
    ja: 勝算はあるのかい？
  event_ce006_3_02_e_59:
    speaker: snowwhite
    en: Do you not?
    ko: 없나?
    ja: ないのか？
  event_ce006_3_02_e_60:
    speaker: hongryeon
    en: Verily, I do not.
    ko: 그렇네.
    ja: そうだねえ。
  event_ce006_3_02_e_61:
    speaker: snowwhite
    en: It's not like you to be so unsure of our abilities.
    ko: 답지 않게 약한 소릴 하는군.
    ja: 弱気だな、珍しい。
  event_ce006_3_02_e_62:
    speaker: hongryeon
    en: We have already failed once.
    ko: 우리는 한 번 실패했지 않은가.
    ja: 仕損じたことを忘れてはおるまい。
  event_ce006_3_02_e_63:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_e_64:
    speaker: rapunzel
    en: Dorothy.
    ko: "…도로시."
    ja: "…ドロシー。"
  event_ce006_3_02_e_65:
    speaker: hongryeon
    en: From time to time, my mind doth wander and fall upon that thought.
    ko: 한 번씩 생각하네.
    ja: たまに考えてしまうのだ。
  event_ce006_3_02_e_66:
    speaker: hongryeon
    en: Perchance 'tis to be expected for Dorothy, and others such as her, to bear
      a grudge against the Ark.
    ko: 도로시를 비롯한 방주에 원한을 가진 이들이 정상이고.
    ja: |-
      ドロシーもそうだが、アークを恨むことこそが
      真っ当な在り方で…
  event_ce006_3_02_e_67:
    speaker: hongryeon
    en: Perchance we are the abnormal ones.
    ko: 우리가 비정상인 게 아닐까 하는 생각 말일세.
    ja: |-
      取り違えているのは
      私たちの方ではないか…とな。
  event_ce006_3_02_e_68:
    speaker: hongryeon
    en: Forgiveness is not something so easily given. I have seen countless situations
      in mine life which attest to this.
    ko: |-
      용서라는 것이 그리 쉽게 되는 것이 아니라는 것도
      긴 삶을 살아오며 수없이 목격했네.
    ja: |-
      赦すということは、そう簡単ではない。
      長い年月を過ごすうちに、
      そういうものを何度も見てきた。
  event_ce006_3_02_e_69:
    speaker: rapunzel
    en: Be that as it may,
    ko: 그럼에도.
    ja: それでも…
  event_ce006_3_02_e_70:
    speaker: rapunzel
    en: we must do what we believe is right.
    ko: 우리는 우리가 옳다고 생각하는 일을 해야 해요.
    ja: |-
      私たちは、正しいと信じる道を
      歩み続けるほかありません。
  event_ce006_3_02_e_71:
    speaker: hongryeon
    en: "... Verily."
    ko: "…뭐, 맞는 말일세."
    ja: "…まあ、それもそうだ。"
  event_ce006_3_02_e_72:
    speaker: hongryeon
    en: No matter what.
    ko: 결과가 어찌 되었든 말이지.
    ja: 行きつく先がどうであれ…な。
  event_ce006_3_02_e_73:
    speaker: snowwhite
    en: Well then, all we've got to do is not fail a second time.
    ko: 이번에는 실패하지 않으면 될 일이다.
    ja: 今回はうまくやればいい。
  event_ce006_3_02_e_74:
    speaker: snowwhite
    en: And to be honest,
    ko: 그리고.
    ja: それに…
  event_ce006_3_02_e_75:
    speaker: snowwhite
    en: I don't feel like we failed before.
    ko: 나는 실패했다고 생각하지 않는다.
    ja: 私は終わったこととは考えていない。
  event_ce006_3_02_e_76:
    speaker: rapunzel
    en: "..."
    ko: 스노우 화이트.
    ja: スノーホワイト…
  event_ce006_3_02_e_77:
    speaker: hongryeon
    en: Dost thou still...?
    ko: "…자네. 아직도."
    ja: "…そうか…いまだに…"
  event_ce006_3_02_e_78:
    speaker: snowwhite
    en: Yes, I do.
    ko: 나는 믿는다.
    ja: 私は信じている。
  event_ce006_3_02_e_79:
    speaker: snowwhite
    en: I believe in Dorothy, who raised us up when we were broken.
    ko: 무너지던 우리를 일으켜 세운 도로시를.
    ja: |-
      ドロシーは心の折れた私たちを
      立ち上がらせてくれた。
  event_ce006_3_02_e_80:
    speaker: snowwhite
    en: I believe in the Goddess of Victory.
    ko: 승리의 여신이자 갓데스인 도로시를 믿는다.
    ja: 彼女は勝利の女神、ゴッデスのドロシーだ。
  event_ce006_3_02_e_81:
    speaker: snowwhite
    en: She may be far away now,
    ko: 지금은 멀리 가버렸지만.
    ja: 今は離れているが…
  event_ce006_3_02_e_82:
    speaker: snowwhite
    en: and gone to a place where we don't understand,
    ko: 이해할 수 없는 곳까지 가버렸지만.
    ja: |-
      私の理解を超える場所まで
      行ってしまっただけだ。
  event_ce006_3_02_e_83:
    speaker: snowwhite
    en: but one day, I believe she will return, and all of the discord between us
      will be washed away.
    ko: 언젠가 서로를 이해해 다시 되돌아올 것이라 믿는다.
    ja: いつか戻ってきて、分かり合える時が来る。
  event_ce006_3_02_e_84:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_e_85:
    speaker: rapunzel
    en: "... Yes."
    ko: "…예."
    ja: "…そうですね。"
  event_ce006_3_02_e_86:
    speaker: rapunzel
    en: She'll come back to us, and it will be as if nothing ever happened.
    ko: 아무렇지도 않게, 뒤로 돌아 걸어올 거라고
    ja: |-
      いつか何事もなかったように、
      同じ道へ帰ってくると…
  event_ce006_3_02_e_87:
    speaker: rapunzel
    en: I believe it too.
    ko: 믿죠.
    ja: そう、信じましょう。
  event_ce006_3_02_e_88:
    speaker: com
    en: Honestly, I was surprised.
    ko: 솔직히 놀랐다.
    ja: 正直、驚いている。
  event_ce006_3_02_e_89:
    speaker: ce006_02
    en: About what?
    ko: 뭐가.
    ja: 何にだ。
  event_ce006_3_02_e_90:
    speaker: com
    en: I did not think you would agree to my conditions.
    ko: 내 조건에 응해줄 줄 몰랐다.
    ja: 条件を聞いてもらえるとは予想していなかった。
  event_ce006_3_02_e_91:
    speaker: com
    en: With your strength, you could have forced the information out of me.
    ko: 네 힘이라면 나를 협박해서 원하는 정보를 얻을 수 있었을 거다.
    ja: |-
      あれだけの力があるなら、私を脅迫して
      情報を引き出すことはできたはずだ。
  event_ce006_3_02_e_92:
    speaker: ce006_02
    en: I'm starting to regret not doing that. I'm starting to get upset at how long
      this is taking.
    ko: |-
      그럴걸 그랬네.
      생각보다 시간이 걸려서 기분이 안 좋아.
    ja: |-
      そうすればよかったな。
      思った以上に面倒だ、後悔しはじめてる。
  event_ce006_3_02_e_93:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_e_94:
    speaker: com
    en: Hey.
    ko: 너.
    ja: 君も…
  event_ce006_3_02_e_95:
    speaker: com
    en: Were you betrayed too?
    ko: 배신당했나?
    ja: 裏切られたのか？
  event_ce006_3_02_e_96:
    speaker: ce006_02
    en: What?
    ko: "…뭐?"
    ja: "…は？"
  event_ce006_3_02_e_97:
    speaker: com
    en: You had a visceral reaction to that word.
    ko: 배신이라는 단어에 반응했다.
    ja: 裏切りという言葉に反応していた。
  event_ce006_3_02_e_98:
    speaker: com
    en: I therefore concluded that you have personally experienced betrayal.
    ko: 배신당한 경험이 있을 것이라 판단했다.
    ja: |-
      おそらく似たような経験があるはずだと
      推測できる。
  event_ce006_3_02_e_99:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_02_e_100:
    speaker: ce006_02
    en: Heh.
    ko: 큭큭.
    ja: ククッ…
  event_ce006_3_02_e_101:
    speaker: ce006_02
    en: Right.
    ko: 배신, 배신이라.
    ja: 裏切り…裏切りか。
  event_ce006_3_02_e_102:
    speaker: ce006_02
    en: I suppose you could say that.
    ko: 그렇게 표현할 수도 있겠군.
    ja: そうとも言えるかもな。
  event_ce006_3_02_e_103:
    speaker: ce006_02
    en: I was robbed of my God and my wings.
    ko: 나는 신과 날개를 잃었다.
    ja: 私は神と翼を失った。
  event_ce006_3_02_e_104:
    speaker: ce006_02
    en: There was no God from the start, and I was no angel.
    ko: 애초에 신은 없었고, 나는 천사가 아니었어.
    ja: そもそも神などおらず、私は天使ではなかった。
  event_ce006_3_02_e_105:
    speaker: ce006_02
    en: Yes. That's it.
    ko: 그래. 그뿐인 거지.
    ja: そう…それだけだ。
  event_ce006_3_02_e_106:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_02_e_107:
    speaker: com
    en: I do not understand.
    ko: 무슨 말인지 모르겠다.
    ja: 意味が理解できない。
  event_ce006_3_02_e_108:
    speaker: ce006_02
    en: You don't need to.
    ko: 알 필요 없어.
    ja: する必要はない。
  event_ce006_3_02_e_109:
    speaker: ce006_02
    en: Let's keep moving. How much longer?
    ko: |-
      계속 가.
      얼마나 남았지?
    ja: |-
      話は終わりだ。
      あとどれだけかかる？
  event_ce006_3_02_e_110:
    speaker: com
    en: We are almost there.
    ko: 거의 다 왔다.
    ja: あと少しだ。
  event_ce006_3_02_e_111:
    speaker: com
    en: The destination is right ahead.
    ko: 이 앞이다.
    ja: もう目の前にある。
event_ce006_2_05_s:
  event_ce006_2_05_s_1:
    speaker: elegg
    en: Nice job, everyone!
    ko: 히히. 다들 고생 많으셨어여.
    ja: ふひひっ。みなさん、お疲れ様でしたな。
  event_ce006_2_05_s_2:
    speaker: elegg
    en: With this, we'll be able to collate all the data into one place.
    ko: 이거라면 여기 데이터를 싹 다 긁어모을 수 있어여.
    ja: |-
      これなら、ここにあるデータが
      もれなく収められますぞ。
  event_ce006_2_05_s_3:
    speaker: elegg
    en: The surface really does have everything you need.
    ko: 역시 지상에는 없는 게 없네여.
    ja: やはり地上には何でもあるものですな。
  event_ce006_2_05_s_4:
    speaker: privaty
    en: That means we can take Hermin back to the Ark.
    ko: "…그럼, 이제 헤르민님을 방주로 데려갈 수 있겠군요."
    ja: |-
      …これで、ヘルミンさんを
      アークに連れて行けますね。
  event_ce006_2_05_s_5:
    speaker: privaty
    en: His condition isn't very good.
    ko: 상태가 많이 안 좋아요.
    ja: あの方の健康状態が心配です。
  event_ce006_2_05_s_6:
    speaker: privaty
    en: We need to hurry.
    ko: 최대한 서두르고 싶은데….
    ja: できるだけ速やかに出発したいところですが…
  event_ce006_2_05_s_7:
    speaker: privaty
    en: How long will it take to transfer the data?
    ko: 일레그. 데이터 이동 완료까지 얼마나 걸리죠?
    ja: |-
      エレグ、データの移動には
      どの程度時間がかかりますか？
  event_ce006_2_05_s_8:
    speaker: elegg
    en: I can't say for sure. The read and write speed will be quite slow.
    ko: 쓰기 읽기 기능이 느릴 거라는 건 확정이라 확답은 못 드려여.
    ja: |-
      読み取りも書き込みも性能が高いとは
      思えませんゆえ、判断が難しいですな。
  event_ce006_2_05_s_9:
    speaker: elegg
    en: I just have to see what happens.
    ko: 해보는 수밖에 없겠져.
    ja: 終わるまで分かりませんぞ。
  event_ce006_2_05_s_10:
    speaker: privaty
    en: "... Okay. Do whatever you can."
    ko: "…알겠어요. 잘 부탁해요."
    ja: "…分かりました。よろしくお願いします。"
  event_ce006_2_05_s_11:
    speaker: elegg
    en: I will.
    ko: 녭!
    ja: お任せあれ！
  event_ce006_2_05_s_12:
    speaker: ce006_03
    en: Well, I'll get started on the data transfer.
    ko: 데이터 이동은 제가 할게요.
    ja: データ転送の作業は私が始めておきます。
  event_ce006_2_05_s_13:
    speaker: ce006_03
    en: Meanwhile, Elegg and Privaty, can you show everyone else what you found?
    ko: 일레그와 프리바티는… 그걸 공유해 주세요.
    ja: |-
      エレグとプリバティは…
      アレの情報共有をしてください。
  event_ce006_2_05_s_14:
    speaker: elegg
    en: Okay.
    ko: 녜.
    ja: 了解ですぞ。
  event_ce006_2_05_s_15:
    speaker: privaty
    en: "... Yeah."
    ko: "…알겠어요."
    ja: "…分かりました。"
  event_ce006_2_05_s_16:
    speaker: "<Self>"
    en: What did you find?
    ko: 그거?
    ja: アレとは？
  event_ce006_2_05_s_17:
    speaker: privaty
    en: Everyone. Come here.
    ko: 여러분. 이쪽으로.
    ja: みなさん、こちらへ。
  event_ce006_2_05_s_18:
    speaker: anis
    en: Why'd you have to bring us here to show whatever it is you want to show us?
    ko: 뭘 공유하려고 이런 으슥한 곳까지 오는 거야?
    ja: わざわざ場所まで変えて、何を話すつもり？
  event_ce006_2_05_s_19:
    speaker: elegg
    en: While you all went to look for a storage device, Ms. Lily and I recovered
      a lot of footage.
    ko: |-
      여러분이 저장 장치 찾으러 간 사이,
      저랑 릴리 씨가 녹화 자료를 좀 많이 복구했거든여.
    ja: |-
      みなさんがデータ保存装置を
      探しに行っている間に、私とリリー氏で
      録画データの復元に成功しましてな。
  event_ce006_2_05_s_20:
    speaker: elegg
    en: Or rather, the audio, to be precise. There was no way to restore the video.
    ko: |-
      어… 정확히는 소리만 복구했지만여.
      영상은 도저히 살릴 방법이 없었어여.
    ja: |-
      まぁ…正確に言えば音だけですけどな。
      映像の復元はできておりませんぞ。
  event_ce006_2_05_s_21:
    speaker: elegg
    en: We've organized it in chronological order. We would like all of you to listen.
    ko: |-
      시간 순서대로 정리를 해 봤는데,
      여러분들이 이걸 다 들어주셨으면 좋겠어여.
    ja: |-
      とにかく、古い順に整理しておきましたゆえ、
      まずは聞いてくだされ。
  event_ce006_2_05_s_22:
    speaker: elegg
    en: Here we go.
    ko: 자, 틀게여?
    ja: では、再生しますぞ？
  event_ce006_2_05_s_23:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_24:
    speaker: younghermin
    en: It's a shame we couldn't preserve everything, but we managed to digitize most
      of it.
    ko: "…실물을 다 챙기지 못 한건 아쉽지만, 대부분은 데이터 화에 성공했어요."
    ja: |-
      …実物を運び込めていないのは
      歯がゆいですが、
      ほぼすべてのデータ化に成功しました。
  event_ce006_2_05_s_25:
    speaker: younghermin
    en: This bunker is now humanity's last artistic bastion.
    ko: 이 벙커는 이제 인류 예술 최후의 보루인 셈이죠.
    ja: |-
      このシェルターは、いまや人類の芸術が残る
      最後のとりでです。
  event_ce006_2_05_s_26:
    speaker: younghermin
    en: My fellow artists, we must be proud and carry on!
    ko: 다들, 예술가로서 자부심을 가지고 여기서 버텨보죠!
    ja: |-
      みなさん、芸術を愛する者として、
      誇りを持ち、耐え抜きましょう！
  event_ce006_2_05_s_27:
    speaker: younghermin
    en: The Ark will come to rescue us soon!
    ko: 방주에서 곧 우리를 구하러 올 테니까요!
    ja: アークからの救援が必ず来るはずです！
  event_ce006_2_05_s_28:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_29:
    speaker: younghermin
    en: There were five of them...
    ko: "…그런가요. 다섯이나…."
    ja: "…そうですか。5人も…"
  event_ce006_2_05_s_30:
    speaker: younghermin
    en: I understand why they did it. It's dark in here, Raptures are constantly swarming
      outside, and there's a lack of proper facilities in the bunker.
    ko: 이해합니다. 여긴 어둡고, 바깥엔 랩쳐가 득실거리고, 제대로 된 편의 시설도 없으니까요.
    ja: |-
      気持ちは理解できます。外には大量の
      ラプチャーがいて、ここにはまともな生活を
      送れる施設も十分な照明もないですから。
  event_ce006_2_05_s_31:
    speaker: younghermin
    en: But they could have at least told us they were leaving. Instead, they ran
      off without even taking any proper food or clothes...
    ko: |-
      …그래도 가기 전에 말이라도 해주면 좋았을 텐데.
      음식이나 옷가지 하나 챙기지 않고 그대로 나가버리면….
    ja: |-
      …それでも、ひとこと相談して欲しかった。
      着替えや食べ物さえ持たずに
      いなくなってしまうとは…
  event_ce006_2_05_s_32:
    speaker: younghermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_33:
    speaker: younghermin
    en: I hope they arrive safely. I hope that they survive.
    ko: |-
      그래도, 잘 도착했으면 좋겠네요.
      잘 살아남았으면 좋겠고.
    ja: |-
      どこかへ逃れられているといいのですが。
      無事を祈るしかありません。
  event_ce006_2_05_s_34:
    speaker: younghermin
    en: Has the Ark reached out, you ask?
    ko: "…아. 방주 쪽에서 연락이요?"
    ja: "…ああ…アークからの連絡ですか？"
  event_ce006_2_05_s_35:
    speaker: younghermin
    en: No, not yet.
    ko: 아직….
    ja: まだ何も…
  event_ce006_2_05_s_36:
    speaker: younghermin
    en: Do-don't worry. Humanity will win soon enough, and then they'll come to save
      us.
    ko: |-
      거, 걱정 마세요.
      곧 인류가 이길 테고, 그럼 반드시 우릴 구하러 올 테니까요!
    ja: |-
      あ、安心してください。
      もうすぐ人類が勝つでしょうし、
      必ず助けに来てくれるはずです！
  event_ce006_2_05_s_37:
    speaker: younghermin
    en: Don't you remember how much they adored us? How they exalted us as artists
      who had stood up to the Raptures?
    ko: |-
      그렇게나 우릴 좋아했잖아요?
      무기를 든 예술가들이라고 막 치켜세워두고 했으니까요!
    ja: |-
      知っているでしょう？
      武器をとった芸術家たちとして
      私たちにどれだけの希望がかけられているか！
  event_ce006_2_05_s_38:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_39:
    speaker: younghermin
    en: "... I see."
    ko: "…그렇군요."
    ja: "…そうですか。"
  event_ce006_2_05_s_40:
    speaker: younghermin
    en: It was seven this time.
    ko: "…이번엔 일곱이나…."
    ja: "…今度は7人も…"
  event_ce006_2_05_s_41:
    speaker: younghermin
    en: We swore to protect these artworks no matter what, even with our lives, if
      necessary.
    ko: "…무슨 일이 있어도, 목숨을 걸어서라도 예술을 지켜야 한다고 다 같이 다짐했는데…."
    ja: |-
      …何があっても、たとえ命をかけても…
      芸術を守ると誓った仲間が…
  event_ce006_2_05_s_42:
    speaker: younghermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_43:
    speaker: younghermin
    en: There still hasn't been any contact.
    ko: 연락은 아직 안 왔어요.
    ja: 連絡はまだありません。
  event_ce006_2_05_s_44:
    speaker: younghermin
    en: They haven't forgotten about us, have they?
    ko: 잊어버린 건 아니겠죠? 그렇겠죠?
    ja: 忘れられてはいませんよね？そうですよね？
  event_ce006_2_05_s_45:
    speaker: younghermin
    en: They couldn't have abandoned us...
    ko: 서, 설마 버렸다거나….
    ja: まさか、見捨てられたなどということは…
  event_ce006_2_05_s_46:
    speaker: younghermin
    en: Could they?
    ko: 아니겠죠? 예?
    ja: 違います…よね？
  event_ce006_2_05_s_47:
    speaker: younghermin
    en: No, wait! Don't rip that!
    ko: 어어! 잠깐! 그거 찢지 마요!
    ja: ああっ！待って！破かないでください！
  event_ce006_2_05_s_48:
    speaker: younghermin
    en: I know it's cold, but you can't burn that cloth, or the wooden statue! You
      know as well as I do that they're precious pieces of art.
    ko: |-
      아무리 추워도 그 천이랑 목조상은 안 돼요!
      아시잖아요! 그것들이 어떤 예술품인지!
    ja: |-
      いくら寒くても、その織物と木像はダメです！
      知っているでしょう？
      どれほど貴重な芸術品か！
  event_ce006_2_05_s_49:
    speaker: younghermin
    en: We have to hold out. We're here to look after these precious works of art,
      not our own well-being.
    ko: |-
      참읍시다! 우린 예술을 지키기 위해 여기 있는 거지,
      생존을 위해 있는 게 아니잖아요!
    ja: |-
      耐え忍びましょう！
      私たちは芸術を守るためにここにいます。
      生き残ることはその次です！
  event_ce006_2_05_s_50:
    speaker: younghermin
    en: We are artists, and our mission is to protect art! We must remember that!
    ko: |-
      기억해요! 우린 예술가입니다!
      예술품을 지켜야 할 사명이 있어요!
    ja: |-
      忘れないでください！私たちは芸術家です！
      芸術品を受け継ぐという使命があります！
  event_ce006_2_05_s_51:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_52:
    speaker: "<Narration>"
    en: "*Bang bang bang bang*"
    ko: 쿵쿵쿵쿵!
    ja: ドンドンドンドン！
  event_ce006_2_05_s_53:
    speaker: younghermin
    en: Do you hear that? Someone's knocking on the door!
    ko: |-
      !! 다들 들었죠?
      누가 문을 두드리고 있어요!
    ja: |-
      ！！
      聞こえましたか！？扉を叩く音です！！
  event_ce006_2_05_s_54:
    speaker: younghermin
    en: You see? I told you they wouldn't abandon us!
    ko: 것 봐요! 우릴 버릴 리가 없다니까요!
    ja: ああ！やはり見捨てられてはいなかった！
  event_ce006_2_05_s_55:
    speaker: younghermin
    en: I'm opening the door!
    ko: 제가! 제가 열게요!
    ja: わ、私が開けます！
  event_ce006_2_05_s_56:
    speaker: younghermin
    en: "... Huh?"
    ko: "…어?"
    ja: "…え？"
  event_ce006_2_05_s_57:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_58:
    speaker: younghermin
    en: How dare you come back after abandoning this place?!
    ko: 여길 버리고 도망간 주제에 무슨 낯짝으로 다시 찾아온 겁니까!
    ja: |-
      私たちを捨てておいて、
      今さらどの面下げて戻って来たのです！？
  event_ce006_2_05_s_59:
    speaker: younghermin
    en: You realized there was nothing out there, didn't you? That's why you came
      back.
    ko: |-
      왜! 바깥을 돌아다니다 보니까 아무것도 없어서요!?
      그래서 다시 돌아온 거냐고요!
    ja: |-
      なぜですか！？外に何もなかったから？
      それで戻ってきたんですか！？
  event_ce006_2_05_s_60:
    speaker: younghermin
    en: I see... Raptures got everyone... and there are swarms of them nearby...
    ko: |-
      …그렇군요. 랩쳐한테 모두….
      이 근방에도 가득하다고요….
    ja: |-
      …そうですか。みんなラプチャーに…
      この辺りにも大群が…
  event_ce006_2_05_s_61:
    speaker: younghermin
    en: Then tell me, why did you abandon our art?
    ko: 그러길래 왜 예술을 버리고 나가서는…!
    ja: それなら、なぜ芸術を捨てて――！
  event_ce006_2_05_s_62:
    speaker: younghermin
    en: What?
    ko: "…뭐…?"
    ja: "…え…？"
  event_ce006_2_05_s_63:
    speaker: younghermin
    en: Pr... pregnant?
    ko: "…임신… 이요?"
    ja: "…お腹に…子供がいる？"
  event_ce006_2_05_s_64:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_65:
    speaker: younghermin
    en: I-I can't! I've never delivered a baby before!
    ko: |-
      모, 못해요!
      아이를 받아본 적이 있을 리가 없잖아요!
    ja: |-
      む、無理ですよ！
      出産の介助なんて経験あるわけ
      ないでしょう！？
  event_ce006_2_05_s_66:
    speaker: younghermin
    en: Even if I know how it was done in practice, actually doing it is completely
      different!
    ko: 아니! 이론은 알아도 그걸 진짜로 해보는 건 천지차이…!
    ja: |-
      理論は分かるとしても、
      実践とは天と地ほどの差が…！
  event_ce006_2_05_s_67:
    speaker: younghermin
    en: Gah! Th-the head is crowning!
    ko: 아아…! 머, 머리가 나온…!
    ja: ああ…！あ、頭が出てきて…！
  event_ce006_2_05_s_68:
    speaker: younghermin
    en: Get me some warm water and a towel, hurry!
    ko: 따, 따뜻한 물이랑 수건이요! 빨리!
    ja: お、お湯と清潔な布を！早く！
  event_ce006_2_05_s_69:
    speaker: younghermin
    en: What?! We don't have any... Right, right. We're lacking in basic essentials
      here.
    ko: |-
      어, 없다고요?
      그렇… 죠. 여기에 그런 생필품은 없었… 죠.
    ja: |-
      な、ない？
      そう…でしたね。ここにそんな
      ぜいたくなものは…
  event_ce006_2_05_s_70:
    speaker: younghermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_71:
    speaker: younghermin
    en: Chop up the wooden statue and start a fire. Boil the drinking water and sterilize
      the cloth.
    ko: |-
      모, 목조상을 부숴서 불을 붙여주세요!
      시, 식수를 끓여서 천을 소독한 후, 가져다줘요!
    ja: |-
      あ、あの木像を壊して、火を付けてください！
      それから飲み水を沸騰させて、布の消毒を！
  event_ce006_2_05_s_72:
    speaker: younghermin
    en: Forget about the artwork, the baby is about to die!
    ko: 예, 예술품이고 나발이고, 애가 죽게 생겼다고요!
    ja: げ…芸術品より、この子の命が優先でしょう！
  event_ce006_2_05_s_73:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_74:
    speaker: younghermin
    en: I'm sorry, everyone.
    ko: "…여러분. 죄송합니다."
    ja: "…みなさんには謝らなければなりません。"
  event_ce006_2_05_s_75:
    speaker: younghermin
    en: From now on, our principal duty is no longer to protect the art,
    ko: 지금부터 실물 예술을 지키는 건 포기합니다.
    ja: |-
      今日をもって、実物の芸術作品を守るという
      我々の目的を放棄します。
  event_ce006_2_05_s_76:
    speaker: younghermin
    en: but simply to stay alive.
    ko: 우리 목적은 생존입니다.
    ja: 私たちの新しい目標は、生き延びることです。
  event_ce006_2_05_s_77:
    speaker: younghermin
    en: A baby girl was born.
    ko: 아, 아이가 태어났어요.
    ja: あの赤ん坊のためです。
  event_ce006_2_05_s_78:
    speaker: younghermin
    en: We can't show her the world outside the bunker,
    ko: 벙커 밖 세상을 보여줄 순 없지만….
    ja: |-
      シェルターの外の世界を
      見せてやることもできませんが…
  event_ce006_2_05_s_79:
    speaker: younghermin
    en: but we can at least ensure she stays alive.
    ko: 살려야죠.
    ja: 命をつながなければ。
  event_ce006_2_05_s_80:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_81:
    speaker: middlehermin
    en: Oh, this?
    ko: 아, 이거?
    ja: ああ、これかい？
  event_ce006_2_05_s_82:
    speaker: middlehermin
    en: This is by a painter who is known as a tragic figure. The colors are so vivid,
      aren't they?
    ko: |-
      비운의 거장이라 불렸던 화가의 그림이란다.
      색이 엄청 강렬하지?
    ja: |-
      悲運の巨匠と呼ばれた画家の絵なんだ。
      鮮やかな色づかいだろう？
  event_ce006_2_05_s_83:
    speaker: middlehermin
    en: This technique and style failed to gain recognition in the artist's lifetime,
      and their work was only reevaluated after their death.
    ko: |-
      이 채색법이나 스타일은 당시에는 인정받지 못했고,
      그가 죽은 다음에야 재조명되었지.
    ja: |-
      この技法や作風は、
      彼が生きている間には認められず…
      亡くなった後に再評価されたんだ。
  event_ce006_2_05_s_84:
    speaker: middlehermin
    en: What's the point of being recognized only after you're dead?
    ko: "…죽은 다음에 인정받는 게 무슨 소용이냐고…."
    ja: |-
      …死んでからほめられたって
      何の意味もない、か…
  event_ce006_2_05_s_85:
    speaker: middlehermin
    en: Hehe... it's about leaving something for the future.
    ko: 허허. 후대에 남겼잖니.
    ja: ははは…ちゃんと後に残っているじゃないか。
  event_ce006_2_05_s_86:
    speaker: middlehermin
    en: To pass something on and influence later generations is a crowning artistic
      achievement.
    ko: |-
      자신의 것이 후대에 이어져 영향을 미치는 게,
      내가 생각하는 예술의 극치란다.
    ja: |-
      自分の作品が後の人たちに受け継がれ、
      影響を残すこと。私が思うに、
      それが芸術の素晴らしさなんだ。
  event_ce006_2_05_s_87:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_88:
    speaker: middlehermin
    en: You must not whine like that. It's a hellish place outside this bunker.
    ko: |-
      자꾸 그렇게 떼 쓰지 말거라.
      이 벙커 밖은 지옥이야.
    ja: |-
      そう困らせないでくれ。
      シェルターの外は地獄なんだ。
  event_ce006_2_05_s_89:
    speaker: middlehermin
    en: People like us wouldn't last a day out there.
    ko: 나가는 순간, 우리 같은 일반인은 하루도 살아남지 못해.
    ja: |-
      外に出たら、私たちのような普通の人間は
      1日たりとも生き延びられないよ。
  event_ce006_2_05_s_90:
    speaker: middlehermin
    en: "... I understand. I understand that you want to see the outside world."
    ko: "…이해한다. 네가 바깥을 보고 싶어 하는 거, 이해해."
    ja: |-
      …分かるとも。
      君の外を見たい気持ちは、よく分かる。
  event_ce006_2_05_s_91:
    speaker: middlehermin
    en: But... you are our daughter.
    ko: 하지만… 너는 우리 모두의 딸이란다.
    ja: だが…君は私たちみんなの娘なんだ。
  event_ce006_2_05_s_92:
    speaker: middlehermin
    en: None of us want to lose you.
    ko: "…잃고 싶지 않아."
    ja: "…失うわけにはいかない。"
  event_ce006_2_05_s_93:
    speaker: middlehermin
    en: Everyone here is staying alive for your sake. I hope you will realize that
      one day.
    ko: 이곳에 있는 모두가… 너 하나만 바라보고 살고 있다는 걸… 알아줬으면 좋겠구나.
    ja: |-
      ここにいるみんなにとって…
      君だけが生きていく希望だということを…
      どうか分かってほしい。
  event_ce006_2_05_s_94:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_95:
    speaker: "<Narration>"
    en: "*Bang bang bang bang*"
    ko: 쿵쿵쿵쿵!
    ja: ドンドンドンドン！
  event_ce006_2_05_s_96:
    speaker: middlehermin
    en: "... Who is it?"
    ko: "…누굽니까."
    ja: "…誰です。"
  event_ce006_2_05_s_97:
    speaker: middlehermin
    en: I said who is it?!
    ko: 누구냐고!
    ja: 何者ですか！
  event_ce006_2_05_s_98:
    speaker: middlehermin
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_05_s_99:
    speaker: middlehermin
    en: Nikkes!
    ko: 니케…! 니케가 이곳에…!
    ja: ニケ…！ニケがここに…！？
  event_ce006_2_05_s_100:
    speaker: middlehermin
    en: Nikkes are here to save us! Finally!
    ko: 아아…! 드디어…! 우릴 구하러…!
    ja: ああ…！ついに…！私たちに救援が…！
  event_ce006_2_05_s_101:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_102:
    speaker: middlehermin
    en: "... I see. Deserters."
    ko: "…그렇군요. 탈주병들이었군요."
    ja: "…なるほど。脱走兵ですか。"
  event_ce006_2_05_s_103:
    speaker: middlehermin
    en: I can't believe suicide missions have become so common... How did it come
      to this?
    ko: |-
      자살이나 마찬가지인 작전이 그렇게 흔하다니….
      어쩌다 니케들이 이렇게….
    ja: |-
      捨て身に近い作戦ばかりとは…
      なぜそんなことに…
  event_ce006_2_05_s_104:
    speaker: middlehermin
    en: Well, don't worry.
    ko: 뭐 걱정 마십시오.
    ja: まあ、安心してください。
  event_ce006_2_05_s_105:
    speaker: middlehermin
    en: I'm the one who created this bunker. I don't mean to brag, but it's top-notch.
    ko: |-
      여긴 제가 만든 벙커입니다.
      자랑 좀 하자면 아주 완성도가 높아요.
    ja: |-
      ここは私が手掛けたシェルターです。
      自慢ではありませんが、
      素晴らしい出来ばえですから。
  event_ce006_2_05_s_106:
    speaker: middlehermin
    en: It hasn't been discovered by Raptures yet, and we have an independent power
      generator, water purification, and air circulation system which guarantees our
      survival.
    ko: 랩쳐에게 들키지 않고, 자체 발전기와 정수 시설, 공기 순환 시스템 등 생존에는 아무 문제없습니다.
    ja: |-
      ラプチャーにも見つかりませんし、独立した
      発電、浄水、空気の循環システムもあります。
      生きていくだけなら何の問題もありません。
  event_ce006_2_05_s_107:
    speaker: middlehermin
    en: We also have plenty of food left. There's enough here to last 20 people for
      a century.
    ko: |-
      식량도 많이 남아있어요.
      …스무 명 기준 100년 분이었으니, 아직 많습니다.
    ja: |-
      食糧も余裕があります。
      …20人で100年分を蓄えていましたから。
  event_ce006_2_05_s_108:
    speaker: middlehermin
    en: You can stay as long as you like.
    ko: 마음이 내킬 때까지 편히 쉬십시오.
    ja: 好きなだけいてください。
  event_ce006_2_05_s_109:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_110:
    speaker: middlehermin
    en: You're more versatile than I thought, Com.
    ko: 콤은 생각보다 만능이군요.
    ja: コムは思った以上に何でもできますね。
  event_ce006_2_05_s_111:
    speaker: middlehermin
    en: I feel we can truly count on you.
    ko: 아주 든든하기 짝이 없어요.
    ja: とても頼もしいです。
  event_ce006_2_05_s_112:
    speaker: middlehermin
    en: I can't thank you enough for spending time with our daughter and playing with
      her.
    ko: 그리고 항상 우리 딸과 잘 놀아주어서 고맙습니다.
    ja: それと、いつも娘と遊んでくれてありがとう。
  event_ce006_2_05_s_113:
    speaker: middlehermin
    en: She really likes you.
    ko: 딸이 콤을 많이 좋아하네요.
    ja: 娘もコムのことが大好きなようです。
  event_ce006_2_05_s_114:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_115:
    speaker: middlehermin
    en: Excuse me, Nikkes. I have a favor to ask of you.
    ko: 저, 니케 여러분들. 부탁이 하나 있습니다.
    ja: |-
      あの…ニケのみなさん。
      1つ、お願いがあります。
  event_ce006_2_05_s_116:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_117:
    speaker: middlehermin
    en: My daughter, listen carefully.
    ko: 딸아, 잘 들으렴.
    ja: いいかい、よく聞くんだ。
  event_ce006_2_05_s_118:
    speaker: middlehermin
    en: You were out wandering the surface, and these Nikkes found you.
    ko: 너는 지상에서 떠돌다가 저분들에게 구출된 거야.
    ja: |-
      君は地上でさまよっていたところを、
      あの人たちに助けてもらった。
  event_ce006_2_05_s_119:
    speaker: middlehermin
    en: Do you understand? You weren't born in this bunker, but on the surface, where
      these Nikkes rescued you.
    ko: |-
      알겠지? 벙커에서 태어난 게 아니라,
      지상 어딘가에서 태어나서 떠돌다가 저분들에게 구출된 거야.
    ja: |-
      分かったね？君はここのことは何も知らない。
      地上のどこかで生まれて、
      あの人たちに助けてもらったんだ。
  event_ce006_2_05_s_120:
    speaker: middlehermin
    en: This way, they won't be labeled as deserters.
    ko: 그래야 저들이 탈주병이 안 될 수 있어.
    ja: |-
      そうすれば、あの人たちも
      脱走扱いされずに済む。
  event_ce006_2_05_s_121:
    speaker: middlehermin
    en: They can say that it simply took time to rescue you and keep you safe.
    ko: 너를 구하고 보호하느라 시간이 걸렸다고 할 수 있으니까.
    ja: |-
      君を助けて保護するために
      時間がかかったことにすればいい。
  event_ce006_2_05_s_122:
    speaker: middlehermin
    en: Do you understand? Don't... Don't cry, and look at me.
    ko: 알겠지? 아, 아빠 눈 보렴. 울지 말고, 아빠 눈을 봐.
    ja: |-
      分かったかい？ほら、パパの目を見て。
      泣かないで、目を見てごらん。
  event_ce006_2_05_s_123:
    speaker: middlehermin
    en: We can't go together. You are the only one they can protect.
    ko: |-
      우리는 같이 못 가.
      저들이 보호할 수 있는 건 너뿐이야.
    ja: |-
      一緒には行けないんだよ。
      あの人たちが守れるのは、君一人だけだ。
  event_ce006_2_05_s_124:
    speaker: middlehermin
    en: Go to the Ark. Go and live a normal life.
    ko: |-
      방주로 가.
      방주로 가서, 평범하게 살아.
    ja: |-
      君はアークに行って、
      そこで、普通の生活を送る。
  event_ce006_2_05_s_125:
    speaker: middlehermin
    en: Don't spend your life in a dark and dingy place like this, subsisting on canned
      food and metallic-tasting water.
    ko: |-
      이런 어둡고 꽉 막힌 곳이 아니라,
      통조림과 쇠맛 나는 물이 아니라.
    ja: |-
      こんな暗い穴の底じゃない。
      缶詰なんて食べなくていい、
      鉄の味がする水も飲まなくていい。
  event_ce006_2_05_s_126:
    speaker: middlehermin
    en: Go live somewhere where it's bright and comfortable, and where the food is
      delicious.
    ko: 밝고, 쾌적하고, 맛있는 음식이 있는 곳에서 살아.
    ja: |-
      明るくて、ゆっくり休めて、
      おいしい食べ物がある場所で暮らすんだ。
  event_ce006_2_05_s_127:
    speaker: middlehermin
    en: Understand?
    ko: 알겠지?
    ja: 分かったかい？
  event_ce006_2_05_s_128:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_129:
    speaker: "<Narration>"
    en: "*Rumble rumble rumble rumble*"
    ko: 콰과과과-!!
    ja: ドドドドド――！！
  event_ce006_2_05_s_130:
    speaker: middlehermin
    en: The drainage system is blocked? That means this place will be flooded!
    ko: |-
      인근의 배수로가 막혔다고요?
      그, 그럼 이곳에 물이 들어올 텐데…!
    ja: |-
      近くの排水路が塞がった？
      それでは、水がこちらに流れてしまう…！
  event_ce006_2_05_s_131:
    speaker: middlehermin
    en: No! The artwork! All the data!
    ko: 아아… 예술들이…! 인류의 예술 데이터들이…!
    ja: ああ…芸術品が…！人類の足跡が…！
  event_ce006_2_05_s_132:
    speaker: middlehermin
    en: What? What did you say?
    ko: "…예? 뭐라고요?"
    ja: "…え？今、なんと？"
  event_ce006_2_05_s_133:
    speaker: middlehermin
    en: Weld the door shut? No, absolutely not!
    ko: |-
      밖에서 용접이라니 무슨 말입니까!
      아니, 안에서 할 수 없다고 해도…!
    ja: |-
      外側を溶接する！？
      た、確かに中にいても手はないですが…！
  event_ce006_2_05_s_134:
    speaker: middlehermin
    en: It's too dangerous! I refuse! We have to give up everything and go back...
    ko: |-
      안됩니다! 너무 위험해요! 찬성 못합니다!
      그냥 다 포기하고 돌아가는 게…!
    ja: |-
      いけません！危険すぎます！
      もう諦めて、ここを放棄した方が…！
  event_ce006_2_05_s_135:
    speaker: middlehermin
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_05_s_136:
    speaker: middlehermin
    en: Can... can we really give up on all of this?
    ko: 포기해도… 되는 건가…? 이것들을…?
    ja: 諦めて…いいのか…？これを…？
  event_ce006_2_05_s_137:
    speaker: middlehermin
    en: These are priceless artifacts which must be preserved and passed on.
    ko: 보존하여… 후대에 넘겨야 하는… 인류의 재산….
    ja: |-
      保存して…後世に残されるべきもの…
      人類の財産を…
  event_ce006_2_05_s_138:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_139:
    speaker: middlehermin
    en: I will remain here.
    ko: 제가 남겠습니다.
    ja: 私は残ります。
  event_ce006_2_05_s_140:
    speaker: middlehermin
    en: Someone needs to stay here and manage the facility.
    ko: 누군가는 남아 시설을 관리해야 합니다!
    ja: 施設の保全は誰かが行わなくてはなりません！
  event_ce006_2_05_s_141:
    speaker: middlehermin
    en: Go ahead and weld the door shut from the outside. I will stay.
    ko: 제가 남을 테니, 밖에서 용접해 주세요.
    ja: 私は残りますので、外から溶接してください。
  event_ce006_2_05_s_142:
    speaker: middlehermin
    en: Yes, the data here is more important than my own life.
    ko: "…예. 저는 이 예술 데이터들이 제 목숨보다 중요합니다."
    ja: |-
      …そうです。ここにあるデータは
      私の命より大事なものですから。
  event_ce006_2_05_s_143:
    speaker: middlehermin
    en: Come to me, my darling. My beautiful daughter.
    ko: 따, 딸아. 내 보물. 이리, 이리 오렴.
    ja: |-
      さあ…私のかわいい子、私の宝物…
      こっちへおいで。
  event_ce006_2_05_s_144:
    speaker: middlehermin
    en: I know this is all so sudden, but it's time to say goodbye.
    ko: 갑작스럽지만, 이별할 시간이야.
    ja: |-
      急になってすまないね。
      いよいよお別れの時だ。
  event_ce006_2_05_s_145:
    speaker: middlehermin
    en: I... I'm so happy that you were a part of my life.
    ko: |-
      나는, 나는 행복했다.
      너를 만날 수 있어 행복했어.
    ja: |-
      私は…幸せだったよ。
      君と会えたことは、とても幸運だった。
  event_ce006_2_05_s_146:
    speaker: middlehermin
    en: I am someone who has dedicated their whole life to art, and you are the finest
      masterpiece I have laid eyes on.
    ko: |-
      평생을 예술을 위해 살아온 나에게,
      너는 최고의 예술품이었어.
    ja: |-
      芸術に命を捧げると誓った私だが、
      君こそが最高の芸術品だ。
  event_ce006_2_05_s_147:
    speaker: middlehermin
    en: I love you.
    ko: 사랑한다. 우리 딸.
    ja: 愛しているよ。
  event_ce006_2_05_s_148:
    speaker: middlehermin
    en: Com. Please take care of her. Promise me.
    ko: |-
      콤. 우리 딸을 잘 부탁해요.
      약속입니다.
    ja: |-
      コム、娘を頼みます。
      約束してください。
  event_ce006_2_05_s_149:
    speaker: middlehermin
    en: Now go. Get out, and weld the door shut.
    ko: 자! 다들 나가서 문을 용접해 주세요!
    ja: さあ！急いで、外から扉を溶接してください！
  event_ce006_2_05_s_150:
    speaker: middlehermin
    en: I'll protect this place no matter what, so don't worry.
    ko: 여긴 걱정 마세요! 반드시 지키겠습니다!
    ja: |-
      ここのことは心配いりません！
      必ず守ってみせます！
  event_ce006_2_05_s_151:
    speaker: middlehermin
    en: Just take care of our daughter, please.
    ko: 딸을…! 잘 부탁합니다!
    ja: 娘を…！頼みます！
  event_ce006_2_05_s_152:
    speaker: middlehermin
    en: And... please, everyone...
    ko: |-
      부탁합니다 여러분!
      그리고…! 그리고…!
    ja: |-
      お願いします！みなさん！
      そして…！必ず…！
  event_ce006_2_05_s_153:
    speaker: middlehermin
    en: Come back for me. I'll be waiting.
    ko: |-
      꼭 저를 구하러 와주세요!
      기다리겠습니다!
    ja: |-
      ここへ戻ってきてください！
      待っています！
  event_ce006_2_05_s_154:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_155:
    speaker: middlehermin
    en: I have to open it.
    ko: "…열자."
    ja: "…開けるか…"
  event_ce006_2_05_s_156:
    speaker: middlehermin
    en: Something's happened. I'm sure of it. I need to open it.
    ko: |-
      무슨 일이 생긴 게 분명해.
      열자.
    ja: |-
      何かが起きたに違いない。
      様子を確かめよう。
  event_ce006_2_05_s_157:
    speaker: middlehermin
    en: Oh... right. It was... welded shut.
    ko: "…아. 용접… 했었지…."
    ja: "…いや。溶接…したんだったな…"
  event_ce006_2_05_s_158:
    speaker: middlehermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_159:
    speaker: middlehermin
    en: Th-they'll come. They'll come to save me. They promised.
    ko: |-
      오, 올 거야. 날 구하러 올 거야.
      야, 약속했으니까.
    ja: |-
      か、必ず来る。私を助けに。
      約束がある。
  event_ce006_2_05_s_160:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_161:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_162:
    speaker: hermin
    en: How long has it been?
    ko: 시간….
    ja: 時間…
  event_ce006_2_05_s_163:
    speaker: hermin
    en: "... 30 years."
    ko: "…30년."
    ja: "…30年か。"
  event_ce006_2_05_s_164:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_165:
    speaker: hermin
    en: They won't come.
    ko: "…그들은… 오지 않겠구나."
    ja: "…もう…来ないかもしれないな。"
  event_ce006_2_05_s_166:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_167:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_168:
    speaker: hermin
    en: Urgh...
    ko: 아….
    ja: ああ…
  event_ce006_2_05_s_169:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_170:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_171:
    speaker: hermin
    en: It's lonely in here...
    ko: 외롭구나….
    ja: 誰か…
  event_ce006_2_05_s_172:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지직-
    ja: ザザザッ――
  event_ce006_2_05_s_173:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 치지지지….
    ja: ザザッ――
  event_ce006_2_05_s_174:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_175:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_176:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_177:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_178:
    speaker: anis
    en: That girl...
    ko: 그… 딸이라는 사람은….
    ja: その…女の子っていうのは…
  event_ce006_2_05_s_179:
    speaker: privaty
    en: We looked into it, but couldn't find any data on her.
    ko: "…조사해 봤지만 제대로 된 정보는 찾을 수 없었어요."
    ja: |-
      …調べてみましたが、
      それらしい情報は見つかっていません。
  event_ce006_2_05_s_180:
    speaker: privaty
    en: Same with the Nikkes who deserted.
    ko: 탈주병이라는 니케 집단들도 마찬가지고요.
    ja: 脱走したニケについても同様です。
  event_ce006_2_05_s_181:
    speaker: privaty
    en: It's been so long, and...
    ko: 너무 오래전 일이기도 하고, 또….
    ja: あまりにも昔の出来事ですし、それに…
  event_ce006_2_05_s_182:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_183:
    speaker: privaty
    en: There's a high chance that they never made it to the Ark.
    ko: 방주에 도착하지 못 했을 가능성이 높아요.
    ja: アークにたどり着けていない可能性が高いかと…
  event_ce006_2_05_s_184:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_185:
    speaker: privaty
    en: We're still looking into it, although we're not sure if we'll turn up anything.
    ko: |-
      그래도 계속 조사는 하고 있어요.
      잘 풀릴지는 모르겠지만….
    ja: |-
      引き続き、調査は行います。
      答えが見つかるかは分かりませんが…
  event_ce006_2_05_s_186:
    speaker: rapi
    en: So those three dead Nikkes we found outside...
    ko: "…문 위에 죽어있던 셋의 니케는 그럼…."
    ja: "…つまり、息絶えていたニケ3体は…"
  event_ce006_2_05_s_187:
    speaker: privaty
    en: Are most likely the Nikkes who deserted, yes.
    ko: 예. 이곳으로 왔다던 탈주병들이겠죠.
    ja: おそらく、ここにいた脱走兵たちでしょう。
  event_ce006_2_05_s_188:
    speaker: privaty
    en: This entire place would have been flooding while they were trying to weld
      the door, until eventually...
    ko: "…용접을 진행하는 과정에서, 물은 계속 차올랐을 거고… 그대로…."
    ja: |-
      …溶接する時にはもう水の流入が
      始まっていたでしょうし…
  event_ce006_2_05_s_189:
    speaker: privaty
    en: To protect what was contained in this bunker, they made the ultimate sacrifice.
    ko: 벙커 안에 있는 모든 것을 지키기 위해….
    ja: そのまま、ここにあるものを守るために…
  event_ce006_2_05_s_190:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_191:
    speaker: elegg
    en: I checked the files and closely examined the one whose arm was severed.
    ko: "…이 파일들을 확인하고 팔이 절단된 분을 잘 살펴봤는데여."
    ja: |-
      …これを聞いてから、
      切断されていた腕を調べてみましたが…
  event_ce006_2_05_s_192:
    speaker: elegg
    en: It looks like she used her own arm as welding material.
    ko: 팔을 떼어내서 용접용 재료로 쓰신 것 같아여.
    ja: どうやら、溶接の素材として使ったようですな。
  event_ce006_2_05_s_193:
    speaker: "<Self>"
    en: So that's what happened...
    ko: "…그랬던 거였구나."
    ja: "…そんなことが…"
  event_ce006_2_05_s_194:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_s_195:
    speaker: ce006_01
    en: What painfully sad memories.
    ko: 슬픈 기억들이네.
    ja: 悲しい記憶。
  event_ce006_2_05_s_196:
    speaker: "<Self>"
    en: "... Let's hurry."
    ko: "…서두르자."
    ja: "…急ごう"
  event_ce006_2_05_s_197:
    speaker: "<Self>"
    en: We need to move as quickly as possible.
    ko: 조금이라도 빨리, 여기에 있는 모든 것들을 옮기자.
    ja: 一秒でも早く、ここにあるすべてを運び出そう
  event_ce006_2_05_s_198:
    speaker: "<Self>"
    en: Let's take both Hermin and all the data to the Ark. Don't leave a single thing
      behind.
    ko: |-
      헤르민도, 자료도.
      하나도 빠짐없이 방주로 데려가자.
    ja: |-
      あの老人の一生も、データも…
      全てをアークに引き継がせる
event_ce006_2_05_e:
  event_ce006_2_05_e_1:
    speaker: "<Monologue>"
    en: The data transfer commences
    ko: 예술 데이터들의 이동이 시작됐다.
    ja: データの転送作業が始まった
  event_ce006_2_05_e_2:
    speaker: "<Monologue>"
    en: with the past data being moved to the storage devices that Roam and the others
      brought back.
    ko: |-
      롬이 확보한 저장 장치를 필두로,
      일행이 확보한 저장 장치에 과거의 데이터들이 옮겨진다.
    ja: |-
      ロムが確保してきた保存装置を中心として
      様々なデバイスに過去のデータが移されていく
  event_ce006_2_05_e_3:
    speaker: "<Monologue>"
    en: The process is slow going,
    ko: 속도는 빠르지 않았지만
    ja: 作業の進行は速いとは言えない
  event_ce006_2_05_e_4:
    speaker: "<Monologue>"
    en: but the artistic legacies that those in the bunker sought to protect are slowly
      preparing to emerge once again and influence the present.
    ko: |-
      그들이 지키고자 했었던 인류 과거의 예술들은
      서서히 현재에 영향을 미치기 위한 준비를 하고 있었다.
    ja: |-
      だが、守られていた人類の過去を
      現在につなぐための準備が
      着々と進められている
  event_ce006_2_05_e_5:
    speaker: ce006_npc_01
    en: These photos in the picture frames must be of the people who stayed behind
      in the bunker.
    ko: |-
      …이 액자에 들어간 사진들.
      벙커에 남아 있던 사람들의 사진이겠군.
    ja: |-
      …額縁に入った写真があるな。
      ここに残っていた人の顔か。
  event_ce006_2_05_e_6:
    speaker: ce006_01
    en: Yeah. The frames are really worn.
    ko: 응. 액자가 많이 닳았어.
    ja: ええ。写真立てまで色あせてる。
  event_ce006_2_05_e_7:
    speaker: ce006_npc_01
    en: They must have been handled quite a lot.
    ko: 그래. 손때도 많이 탔네.
    ja: そうだな。手あかだらけだ。
  event_ce006_2_05_e_8:
    speaker: ce006_01
    en: These images were no doubt caressed longingly—hundreds, if not thousands of
      times.
    ko: "…수백, 수천번을 어루만졌을 거야. 그리워서."
    ja: |-
      …きっと、何百回、何千回と触っているはず。
      昔を思い出すたびに。
  event_ce006_2_05_e_9:
    speaker: hermin
    en: Yes. After a while, I stopped touching it out of fear that I'd harm the frames.
    ko: 그래요. 나중에는 액자가 상할까 봐 더 만지지도 않았지만요.
    ja: |-
      その通りです。
      写真立てが壊れそうな気がして、
      そのうち触ることもしなくなりましたが。
  event_ce006_2_05_e_10:
    speaker: ce006_01
    en: How is your body feeling?
    ko: 몸은 좀 어때?
    ja: 体の具合は？
  event_ce006_2_05_e_11:
    speaker: hermin
    en: "... Hehe."
    ko: "…허허."
    ja: "…はは。"
  event_ce006_2_05_e_12:
    speaker: ce006_01
    en: You should get some more rest.
    ko: "…좀 쉬는 게 좋겠어."
    ja: "…少し休んだ方がいい。"
  event_ce006_2_05_e_13:
    speaker: hermin
    en: I'm fine. I've rested plenty.
    ko: 괜찮습니다. 지금까지 너무 많이 쉬었어요.
    ja: 大丈夫です。今まで十分すぎるほど休みました。
  event_ce006_2_05_e_14:
    speaker: ce006_npc_01
    en: You've held fast and kept watch over this art for so long, and now it's finally
      seeing the light of day.
    ko: "…그래서, 기분은 어떻습니까."
    ja: "…それなら、気分の方は？"
  event_ce006_2_05_e_15:
    speaker: ce006_npc_01
    en: How does that make you feel?
    ko: |-
      그렇게 오랜 시간 견디고 참아왔던 게,
      이제 빛을 발하게 되지 않았습니까.
    ja: |-
      長いあいだ穴の底で守って来たものが、
      やっと誰かに知ってもらえる気分は。
  event_ce006_2_05_e_16:
    speaker: hermin
    en: Well... At first, I was filled with this sacred sense of duty, but later,
      I felt I had no other choice.
    ko: 뭐… 처음엔 그저 사명에 불탔지만, 나중엔 선택의 여지가 없었지요.
    ja: |-
      さあ…始めた時は使命感に燃えていましたが、
      後にはもう…
      外は物騒で、扉も開きませんでしたから。
  event_ce006_2_05_e_17:
    speaker: hermin
    en: I was afraid of the outside, and it was not as if I could open the door.
    ko: 바깥은 무서웠고, 문은 열리지 않았으니까요.
    ja: そうする他に、道がなかっただけです。
  event_ce006_2_05_e_18:
    speaker: ce006_npc_01
    en: Why didn't you end it all?
    ko: 왜 스스로 끝내지 않았습니까.
    ja: 自分で終わらせることもできたはずだ。
  event_ce006_2_05_e_19:
    speaker: ce006_01
    en: Adam!
    ko: 아담.
    ja: アダム。
  event_ce006_2_05_e_20:
    speaker: ce006_npc_01
    en: Sorry, that came out wrong. I didn't mean to be insensitive.
    ko: |-
      악의가 있는 질문은 아니었습니다.
      말이 좀 이상했군요. 죄송합니다.
    ja: |-
      いや、そういうつもりじゃない。
      聞き方が悪かった。申し訳ない。
  event_ce006_2_05_e_21:
    speaker: ce006_npc_01
    en: What I mean is, how were you able to keep going for all these years?
    ko: 어째서 계속 견딜 수 있었습니까.
    ja: なぜ今まで耐えてきたんだ？
  event_ce006_2_05_e_22:
    speaker: hermin
    en: I'm not sure...
    ko: 글쎄요….
    ja: どうでしょうね…
  event_ce006_2_05_e_23:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_24:
    speaker: hermin
    en: I figured that I had already waited so long.
    ko: |-
      그렇게나 오래 기다려왔는데,
      이게 이뤄지는 것을 직접 못 보고 떠난다면.
    ja: |-
      ここまで耐えてきて、
      使命が実現する瞬間も
      見られずに終わってしまったら…
  event_ce006_2_05_e_25:
    speaker: hermin
    en: If I "tapped out", as it were, without seeing my dream come true, that'd hardly
      seem fair.
    ko: 너무 억울할 것 같아서… 라고 말할 수 있겠군요.
    ja: 悔しい気がする…そんなところでしょうか。
  event_ce006_2_05_e_26:
    speaker: hermin
    en: Yes, there were times when the pain was too great, and I wanted to give up.
    ko: 고통스럽고 괴로워서, 포기하고 싶더라도.
    ja: 苦しくて、つらくて、諦めたくなる時も…
  event_ce006_2_05_e_27:
    speaker: hermin
    en: But then I would imagine the sight of future generations appreciating these
      artworks, and I would be overcome with emotion.
    ko: 그 장면을 상상하는 것만으로도 너무 벅차올랐어요.
    ja: |-
      その瞬間を想像するだけで、
      胸を熱くしていました。
  event_ce006_2_05_e_28:
    speaker: hermin
    en: If I were able to witness that with my own eyes, would that not be art in
      its truest form?
    ko: |-
      그리고 그걸 직접 눈에 담는다면,
      그것이야 말로 진짜 예술 아니겠습니까.
    ja: |-
      もし、その瞬間を目撃できるなら…
      それこそが芸術の究極の形でしょう。
  event_ce006_2_05_e_29:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_30:
    speaker: ce006_npc_01
    en: If you had failed, all your suffering would have been in vain.
    ko: 이루지 못한다면 무의미했을 텐데요.
    ja: 叶えられない望みなら、耐える意味もない。
  event_ce006_2_05_e_31:
    speaker: hermin
    en: I would have endured no matter what.
    ko: 무슨 수를 쓰더라도 견뎠을 겁니다.
    ja: 何があろうと耐え抜くほかありません。
  event_ce006_2_05_e_32:
    speaker: hermin
    en: I never stopped believing that one day, a miracle would come. With that, I
      would have pressed on.
    ko: 언젠가 일어날 기적을 믿고, 계속.
    ja: |-
      いつか奇跡が起こると信じて、
      耐えるだけです。
  event_ce006_2_05_e_33:
    speaker: ce006_npc_01
    en: Even if you lost so much along the way?
    ko: "…그 사이에 많은 것을 잃더라도 그렇게 했을 것 같습니까?"
    ja: "…それまでにどれだけのものを失うとしても…？"
  event_ce006_2_05_e_34:
    speaker: hermin
    en: Yes, I would have.
    ko: 실제로 많은 걸 잃었죠.
    ja: もう多くのものを失いました。
  event_ce006_2_05_e_35:
    speaker: hermin
    en: I'd already nearly lost everything.
    ko: 저는… 예. 그랬을 겁니다.
    ja: それでも…諦めはしなかった。
  event_ce006_2_05_e_36:
    speaker: hermin
    en: I would have kept waiting.
    ko: 계속 기다렸을 겁니다.
    ja: 永久に待ち続けていたと思います。
  event_ce006_2_05_e_37:
    speaker: hermin
    en: I would have believed that this was my purpose, and kept waiting.
    ko: |-
      저는 그걸 위해 태어난 것이었을 거라 믿고,
      기다렸겠죠.
    ja: |-
      私はそのために生まれたのだと信じて、
      待っていたはずです。
  event_ce006_2_05_e_38:
    speaker: ce006_npc_01
    en: I see.
    ko: "…그렇군요."
    ja: "…そうか。"
  event_ce006_2_05_e_39:
    speaker: ce006_npc_01
    en: I find your words very comforting. Thank you.
    ko: 감사합니다. 위로가 되었습니다.
    ja: |-
      ありがとう。
      少し気が楽になった。
  event_ce006_2_05_e_40:
    speaker: hermin
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_ce006_2_05_e_41:
    speaker: ce006_01
    en: Are these all the photos you have of your friends?
    ko: "…동료들의 사진은 여기에 있는 것들이 전부야?"
    ja: "…仲間の写真は、ここにあるのが全部？"
  event_ce006_2_05_e_42:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_43:
    speaker: ce006_01
    en: Hermin?
    ko: |-
      …?
      헤르민?
    ja: |-
      …？
      大丈夫？
  event_ce006_2_05_e_44:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_45:
    speaker: ce006_01
    en: "... Hermin?"
    ko: "…헤르민."
    ja: "…ヘルミン。"
  event_ce006_2_05_e_46:
    speaker: hermin
    en: Huh? Oh, I'm sorry, what did you say?
    ko: 아아… 예. 죄송합니다. 뭐라고 하셨죠?
    ja: |-
      ああ…いや、失礼。
      何でしたか？
  event_ce006_2_05_e_47:
    speaker: ce006_01
    en: Are these all photos of your friends?
    ko: 동료들의 사진은 여기에 있는 것들이 전부야?
    ja: 仲間たちの写真は、ここにあるのが全部？
  event_ce006_2_05_e_48:
    speaker: hermin
    en: Oh... yes. That's all of them.
    ko: 아아… 예. 전부입니다.
    ja: ああ…はい。そうです。
  event_ce006_2_05_e_49:
    speaker: hermin
    en: I regret not taking more photos.
    ko: 많이 찍어놓을 걸… 하고 후회하고 있습니다.
    ja: |-
      もっと撮っておけばよかったと…
      後悔しています。
  event_ce006_2_05_e_50:
    speaker: hermin
    en: If there's any advice I would give you, it's to take more photos. Nothing
      is better at preserving memories.
    ko: |-
      사진을 많이 찍어놓으십쇼.
      과거를 기억하는데 그만한 것이 없더군요.
    ja: |-
      あなたがたはそうしてください。
      昔を思い出すのに、
      これほどいいものはありません。
  event_ce006_2_05_e_51:
    speaker: ce006_01
    en: We'll do our best.
    ko: 응. 열심히 찍고 있어.
    ja: ええ。いつも撮ってる。
  event_ce006_2_05_e_52:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_53:
    speaker: hermin
    en: Is there any chance it would be possible...
    ko: 혹시.
    ja: 失礼…
  event_ce006_2_05_e_54:
    speaker: hermin
    en: To find out what happened to those who left?
    ko: 여길 벗어난 이들이 어떻게 되었는지는… 알 수 없겠죠?
    ja: |-
      ここから出て行った者がどうなったかは…
      ご存じありませんか？
  event_ce006_2_05_e_55:
    speaker: "<Self>"
    en: We're looking into it. This all happened so long ago, so it may take some
      time.
    ko: |-
      …알아 보고는 있습니다.
      워낙 예전 일이라 시간이 좀 걸리는 듯해요.
    ja: |-
      …調査中です。
      なにぶん昔のことなので、時間がかかると
  event_ce006_2_05_e_56:
    speaker: hermin
    en: "... I see. Thank you..."
    ko: "…그렇군요."
    ja: "…そうですか。"
  event_ce006_2_05_e_57:
    speaker: hermin
    en: Thank you.
    ko: 감사합니다.
    ja: ありがとうございます。
  event_ce006_2_05_e_58:
    speaker: elegg
    en: The data transfer is almost complete.
    ko: 데이터는 이제 거의 다 옮겼어여.
    ja: データの移動はほぼ完了しましたぞ。
  event_ce006_2_05_e_59:
    speaker: elegg
    en: I think we can start getting ready to leave.
    ko: 슬슬 떠날 채비를 해도 될 것 같아여.
    ja: そろそろ出発の準備をしてもよさそうですな。
  event_ce006_2_05_e_60:
    speaker: privaty
    en: How's Hermin doing?
    ko: 헤르민님의 상태는 어떤가요?
    ja: ヘルミンさんの具合は？
  event_ce006_2_05_e_61:
    speaker: "<Self>"
    en: Not great. He faded in and out several times during our conversation.
    ko: |-
      별로 좋지는 않아.
      대화 중에 몇 번이고 정신을 잃었어.
    ja: |-
      いいとは言えない。
      話の途中で何度も気を失っていた
  event_ce006_2_05_e_62:
    speaker: privaty
    en: "... I see."
    ko: "…그렇군요."
    ja: "…そうですか。"
  event_ce006_2_05_e_63:
    speaker: anis
    en: The emergency medication we brought is mostly for external injuries, so they're
      not much help.
    ko: 가져온 상비약들은 외상 위주라 딱히 도움도 안 되고.
    ja: |-
      持ってきてる薬なんてほとんど
      傷の手当て用だから、
      あんまり役に立たないし。
  event_ce006_2_05_e_64:
    speaker: anis
    en: Sedatives or painkillers could do more harm than good, so we can't use those.
    ko: 진정제나 진통제도 위험할 것 같아서 영 못 쓰고.
    ja: あの身体じゃ鎮痛剤だってうかつに使えないわ。
  event_ce006_2_05_e_65:
    speaker: anis
    en: We need to get him to the Ark as soon as possible.
    ko: 조금이라도 빨리 방주로 데려가야 할 것 같아.
    ja: 一刻も早くアークに移動した方がいいわね。
  event_ce006_2_05_e_66:
    speaker: "<Self>"
    en: Let's start packing. We'll move out the moment the data transfer is finished.
    ko: 짐을 싸자. 데이터 이동이 끝나면 바로 출발할 수 있게.
    ja: |-
      準備をしておこう。
      データの移動が終わり次第、すぐに出発する
  event_ce006_2_05_e_67:
    speaker: rapi
    en: Roger.
    ko: 예. 알겠습니다.
    ja: はい。了解しました。
  event_ce006_2_05_e_68:
    speaker: ce006_npc_01
    en: We can use the Tetrapod. It'll be a heck of a lot faster than walking.
    ko: |-
      테트라포드로 이동하자.
      걸어가는 것보단 훨씬 빠를 거야.
    ja: |-
      テトラポッドを使おう。
      徒歩よりは何倍も早いはずだ。
  event_ce006_2_05_e_69:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_70:
    speaker: neon
    en: But what if we run into Storm Bringer?
    ko: 엇. 스톰 브링어라도 나오면 위험할 텐데….
    ja: |-
      しかし、万一ストームブリンガーに遭遇したら
      大変なことになりますが…
  event_ce006_2_05_e_71:
    speaker: rapi
    en: I think it's worth the risk. What about you, Commander?
    ko: "…지휘관. 위험을 감수하더라도 속도가 더 중요하다고 생각합니다."
    ja: |-
      …指揮官。
      ここはリスクを負ってでも、
      急ぐべきかと考えます。
  event_ce006_2_05_e_72:
    speaker: "<Self>"
    en: I agree.
    ko: 나도 같은 생각이야.
    ja: 私もそう思う
  event_ce006_2_05_e_73:
    speaker: rapi
    en: Adam, get the Tetrapod ready for takeoff.
    ko: |-
      아담.
      테트라포드도 바로 출발할 수 있게 준비해 줄 수 있을까?
    ja: |-
      アダム。
      テトラポッドもすぐに出発できるよう
      準備をお願いできる？
  event_ce006_2_05_e_74:
    speaker: ce006_npc_01
    en: Roger that.
    ko: 물론이지.
    ja: もちろんだ。
  event_ce006_2_05_e_75:
    speaker: ce006_npc_01
    en: I don't mean to brag, but one ride in it will blow your socks off. The craftsmanship
      is second to none.
    ko: |-
      자랑은 아니지만 타보면 깜짝 놀랄 거야.
      잘 만들어진 녀석이니까.
    ja: |-
      自慢じゃないが、乗ったらびっくりするぞ。
      アイツ以上のマシンはそうそうない。
  event_ce006_2_05_e_76:
    speaker: elegg
    en: I can vouch for that.
    ko: 그건 저도 보장할게여.
    ja: それは私も保証しますぞ。
  event_ce006_2_05_e_77:
    speaker: ce006_npc_01
    en: Uh... I appreciate that, but how would you know? You've never ridden in it.
    ko: "…고맙긴 한데 왜 네가…."
    ja: |-
      …分かってるなあと言いたいが、
      なぜお前が…？
  event_ce006_2_05_e_78:
    speaker: ce006_03
    en: 20 minutes left on the data transfer.
    ko: 20분 남았어요.
    ja: 推定あと20分。
  event_ce006_2_05_e_79:
    speaker: elegg
    en: 12 minutes on my end.
    ko: 여긴 12분이여.
    ja: こちらは12分ですな。
  event_ce006_2_05_e_80:
    speaker: ce006_03
    en: Nearly finished, finally.
    ko: 으아… 이게 끝나긴 하네요.
    ja: ふぅ…やっと終わりが見えましたね。
  event_ce006_2_05_e_81:
    speaker: elegg
    en: Hehe, I know in reality it hasn't taken all that long, but it feels like ages
      compared to modern technology.
    ko: 히히. 시간이 오래 걸린 건 아니지만 답답하져. 속도가 느리니까여.
    ja: |-
      ふひひっ。こんなに遅い転送速度では
      もどかしいですな。
  event_ce006_2_05_e_82:
    speaker: ce006_03
    en: Let's start preparing to leave.
    ko: 그럼 우리도 이제 슬슬 준비할까요?
    ja: |-
      じゃ、あたしたちも
      そろそろ準備しましょうか？
  event_ce006_2_05_e_83:
    speaker: elegg
    en: Yeah, let's.
    ko: 그럴까여?
    ja: 了解ですぞ。
  event_ce006_2_05_e_84:
    speaker: "<Narration>"
    en: "*Drip*"
    ko: 똑.
    ja: ポタッ…
  event_ce006_2_05_e_85:
    speaker: elegg
    en: Huh?
    ko: "…어?"
    ja: "…ん？"
  event_ce006_2_05_e_86:
    speaker: ce006_03
    en: Don't you know "huh?" is the last thing you want to hear at a time like this?
    ko: 어어어. 이런 작업할 때 어? 금지인 거 몰라요?
    ja: |-
      ちょっと、こういう作業の途中で
      「ん？」は禁止ワードですよ？
  event_ce006_2_05_e_87:
    speaker: elegg
    en: Er, sorry, but I heard something strange.
    ko: 어… 죄송해여. 이상한 소리를 들어서여.
    ja: |-
      いや…申し訳ないですな。
      妙な音が聞こえた気がしましたゆえ…
  event_ce006_2_05_e_88:
    speaker: "<Narration>"
    en: "*Drip drip*"
    ko: 똑. 똑.
    ja: ポタ、ポタ――
  event_ce006_2_05_e_89:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_90:
    speaker: ce006_03
    en: I think I heard something too.
    ko: "…저도 들은 것 같은데요."
    ja: "…あたしも聞こえた気がする。"
  event_ce006_2_05_e_91:
    speaker: "<Narration>"
    en: "*Drip drip drip*"
    ko: 똑. 똑. 똑.
    ja: ポタ、ポタ、ポタ――
  event_ce006_2_05_e_92:
    speaker: "<Narration>"
    en: "*Drip* *Drop*"
    ko: 툭. 투두두둑.
    ja: ポタ…ドドドドッ――
  event_ce006_2_05_e_93:
    speaker: "<Narration>"
    en: "*Pshuuu*"
    ko: 푸슈우우웃--!
    ja: プシューッ――！
  event_ce006_2_05_e_94:
    speaker: elegg
    en: Gah! Water's coming from the ceiling!
    ko: |-
      !!
      으아! 천장에서 물이!
    ja: |-
      ！！
      ぎょええ！天井から水が！
  event_ce006_2_05_e_95:
    speaker: ce006_03
    en: "?!"
    ko: 어? 어어어어?
    ja: え？ちょっとちょっとちょっと！？
  event_ce006_2_05_e_96:
    speaker: "<Narration>"
    en: "*Crack* *Crrrrack*"
    ko: 쩍. 쩌저적-!
    ja: バキ、バキバキッ！
  event_ce006_2_05_e_97:
    speaker: elegg
    en: Er... that's not the ceiling cracking, is it?
    ko: 이, 이거 천장에 금 가는 소리 맞져?
    ja: い、今のは天井にヒビが入った音ですかな？
  event_ce006_2_05_e_98:
    speaker: ce006_03
    en: It's coming from the walls as well...
    ko: 벼, 벽에서도 들리는데요?
    ja: か、壁からも聞こえましたよ？
  event_ce006_2_05_e_99:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_05_e_100:
    speaker: elegg
    en: Everyone! Emergency!
    ko: 다들! 비상이에여!
    ja: 皆の衆！緊急事態ですぞーッ！
  event_ce006_2_05_e_101:
    speaker: elegg
    en: The bunker is flooding!
    ko: 벙커에 물이 들어오고 있어여!!
    ja: シェルターに浸水ィィ！！
event_ce006_3_03_s:
  event_ce006_3_03_s_1:
    speaker: "<Narration>"
    en: "*Buzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_03_s_2:
    speaker: art
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_3:
    speaker: com
    en: Art. Do you remember me?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_4:
    speaker: art
    en: What...?
    ko: "…예?"
    ja: "…はい？"
  event_ce006_3_03_s_5:
    speaker: com
    en: I am Com.
    ko: 나는 콤이다.
    ja: 私はコム。
  event_ce006_3_03_s_6:
    speaker: com
    en: This is the Ark.
    ko: 이곳은 방주다.
    ja: ここはアークだ。
  event_ce006_3_03_s_7:
    speaker: com
    en: On our way back, we encountered a Lord-class Rapture.
    ko: 우리는 복귀하는 과정에서 로드 급 랩쳐와 마주쳤다.
    ja: |-
      私たちは移動中に
      ロード級のラプチャーと遭遇してしまった。
  event_ce006_3_03_s_8:
    speaker: com
    en: Only you and I survived.
    ko: 너와 나만 생존했다.
    ja: 君と私だけが生き残った。
  event_ce006_3_03_s_9:
    speaker: com
    en: You were severely injured.
    ko: 너는 부상이 심했다.
    ja: 君は重傷を負っていた。
  event_ce006_3_03_s_10:
    speaker: com
    en: You became a Nikke.
    ko: 니케가 되었다.
    ja: ニケになるしかなかった。
  event_ce006_3_03_s_11:
    speaker: com
    en: A mass-produced Nikke.
    ko: 양산형 니케가 되었다.
    ja: 量産型になった。
  event_ce006_3_03_s_12:
    speaker: com
    en: They said there's a chance that mass-produced Nikkes can retain their past
      memories.
    ko: 양산형 니케의 경우 낮은 확률로 과거를 기억하고 있을 수도 있다고 했다.
    ja: |-
      そうなった場合、過去の記憶を
      維持できる可能性が低いと聞いた。
  event_ce006_3_03_s_13:
    speaker: com
    en: So, Art, do you remember me?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_14:
    speaker: art
    en: I... I don't.
    ko: 어… 기억 안 나요.
    ja: ええと…覚えていません。
  event_ce006_3_03_s_15:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_16:
    speaker: com
    en: Your name. I'm the one who gave it to you.
    ko: 너의 이름. 내가 지어줬다.
    ja: 君の名前は、私がつけた。
  event_ce006_3_03_s_17:
    speaker: com
    en: I named you as soon as we got to the Ark.
    ko: 방주에 오자마자 내가 이름 지어줬다.
    ja: アークにたどり着いてすぐのことだ。
  event_ce006_3_03_s_18:
    speaker: com
    en: I am Com.
    ko: 나는 콤이다. 우린 벙커에서 함께 지냈다.
    ja: 私はコム。シェルターで一緒に過ごしていた。
  event_ce006_3_03_s_19:
    speaker: com
    en: We lived together in the bunker, along with Hermin.
    ko: 헤르민과 함께 벙커에서 지냈다.
    ja: そこにはヘルミンがいた。
  event_ce006_3_03_s_20:
    speaker: com
    en: Do you remember me now?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_21:
    speaker: art
    en: No, I don't.
    ko: 아니… 요.
    ja: いいえ…まったく。
  event_ce006_3_03_s_22:
    speaker: com
    en: You were born in the bunker.
    ko: 너는 벙커의 아이다.
    ja: 君はあのシェルターの子だ。
  event_ce006_3_03_s_23:
    speaker: com
    en: You were raised there as a child, loved by all.
    ko: 벙커에서 태어났고 벙커의 사람들에게 사랑받으며 큰 모두의 아이다.
    ja: |-
      あのシェルターで生まれ、
      そこにいる人々に愛されながら育った、
      みんなの子どもだ。
  event_ce006_3_03_s_24:
    speaker: com
    en: Everyone there cherished you.
    ko: 너는 모두에게 가장 소중한 재산이다.
    ja: |-
      あの人たちにとって、
      君は最も大切な財産だった。
  event_ce006_3_03_s_25:
    speaker: com
    en: I cherish you.
    ko: 나의 가장 소중한 재산이다.
    ja: 私の最も大切な財産でもある。
  event_ce006_3_03_s_26:
    speaker: com
    en: Do you remember me now?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_27:
    speaker: art
    en: I... I'm sorry, but I don't remember anything...
    ko: 그… 죄, 죄송해요. 전혀 기억이….
    ja: その…す、すみません。何も思いだせなくて…
  event_ce006_3_03_s_28:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_29:
    speaker: com
    en: Do you remember me now?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_30:
    speaker: art
    en: Uh...
    ko: 저, 저기….
    ja: あ、あの…
  event_ce006_3_03_s_31:
    speaker: com
    en: Do you remember me now?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_32:
    speaker: com
    en: Do you remember me now?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_33:
    speaker: com
    en: Do you remember me now?
    ko: 아트. 나를 기억하나?
    ja: アート。私を覚えているか？
  event_ce006_3_03_s_34:
    speaker: art
    en: I-I'm sorry! I have to go!
    ko: 죄, 죄송합니다! 가, 가볼게요!
    ja: す、すみません！し、失礼します！
  event_ce006_3_03_s_35:
    speaker: com
    en: Do.
    ko: "---아트."
    ja: "――アート。"
  event_ce006_3_03_s_36:
    speaker: com
    en: Do you.
    ko: "---나를."
    ja: "――私を――"
  event_ce006_3_03_s_37:
    speaker: com
    en: Remember me now?
    ko: "---기억하--- 나---."
    ja: "――覚えて――いるか――"
  event_ce006_3_03_s_38:
    speaker: "<Narration>"
    en: Com and Raven stand facing the elevator leading to the Ark.
    ko: 콤과 레이븐은 방주로 향하는 엘리베이터를 바라보았다.
    ja: |-
      コムとレイヴンは、
      アークへつながるエレベーターの前に立った
  event_ce006_3_03_s_39:
    speaker: ce006_02
    en: Is this the lift you were talking about?
    ko: "…이건 엘리베이터인가?"
    ja: "…これがお前の目的地か？"
  event_ce006_3_03_s_40:
    speaker: com
    en: That is right.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_03_s_41:
    speaker: com
    en: This will take you to the Ark.
    ko: 이걸 타고 가면 방주로 갈 수 있다.
    ja: これに乗ればアークへ行ける。
  event_ce006_3_03_s_42:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_43:
    speaker: ce006_02
    en: You said you were going to take revenge on the Ark, right?
    ko: 방주에 복수한다고 했었나.
    ja: アークに復讐すると言っていたな。
  event_ce006_3_03_s_44:
    speaker: ce006_02
    en: What's your plan?
    ko: 어떻게 할 생각이지?
    ja: どうするつもりだ？
  event_ce006_3_03_s_45:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_46:
    speaker: ce006_02
    en: Heh, I'll let you think about that for a while longer.
    ko: 크큭. 그래. 계속 고민해.
    ja: ククッ。そうだ。じっくり考えろ。
  event_ce006_3_03_s_47:
    speaker: ce006_02
    en: At any rate, our deal is done here.
    ko: 어쨌든 거래는 완료다.
    ja: とにかく、取引は果たした。
  event_ce006_3_03_s_48:
    speaker: ce006_02
    en: Tell me the location of this Gatekeeper.
    ko: 그 게이트 키퍼라는 랩쳐의 위치를 말해.
    ja: ゲートキーパーとやらの位置を教えろ。
  event_ce006_3_03_s_49:
    speaker: com
    en: Head north, about one kilometer. You will find an open space among the collapsed
      buildings.
    ko: |-
      북쪽으로 1km 이동해라.
      무너진 빌딩들 사이에 공터가 있을 거다.
    ja: |-
      ここから北へ1km進め。
      崩壊したビルの間に開けた空間がある。
  event_ce006_3_03_s_50:
    speaker: com
    en: Gatekeeper will be there.
    ko: 그곳에 게이트 키퍼가 있다.
    ja: ゲートキーパーはそこにいる。
  event_ce006_3_03_s_51:
    speaker: ce006_02
    en: All right.
    ko: 그래.
    ja: そうか。
  event_ce006_3_03_s_52:
    speaker: ce006_02
    en: Well, best of luck with those revenge plans.
    ko: |-
      그럼 열심히 해보라고.
      복수.
    ja: |-
      では、目的を果たすがいい。
      復讐するんだろう。
  event_ce006_3_03_s_53:
    speaker: "<Narration>"
    en: Raven walks past Com.
    ko: 레이븐이 콤을 지나쳐 걸어갔다.
    ja: レイヴンがコムの側を通り抜けた
  event_ce006_3_03_s_54:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_55:
    speaker: "<Narration>"
    en: Com stares at the elevator.
    ko: 콤은 엘리베이터를 바라보았다.
    ja: コムのカメラがエレベーターをにらみつけた
  event_ce006_3_03_s_56:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_57:
    speaker: "<Narration>"
    en: Com remains motionless for a long time.
    ko: 콤은 한참 동안 움직이지 않았다.
    ja: コムはしばらく動かなかった
  event_ce006_3_03_s_58:
    speaker: "<Narration>"
    en: Only the mechanical whirring of it running calculations fills the air.
    ko: 연산 시의 기계음만이 흘러나왔다.
    ja: 演算装置だけが激しい音を立てている
  event_ce006_3_03_s_59:
    speaker: "<Narration>"
    en: After a while, Com slowly lifts its head.
    ko: 콤은 천천히 고개를 들었다.
    ja: コムはゆっくりと頭部を持ち上げた
  event_ce006_3_03_s_60:
    speaker: "<Narration>"
    en: It looks around, then turns.
    ko: 주위를 둘러보다 뒤를 돌아보았다.
    ja: 周囲を見回し、後ろを振り返った
  event_ce006_3_03_s_61:
    speaker: "<Narration>"
    en: A short distance away, Raven is watching Com.
    ko: 조금 떨어진 곳에서, 레이븐이 콤을 바라보고 있었다.
    ja: |-
      少し離れた場所で、
      レイヴンがコムを観察していた
  event_ce006_3_03_s_62:
    speaker: ce006_02
    en: What are you doing? Hurry up.
    ko: 뭐 해. 빨리 해.
    ja: 何をしている？早くしろ。
  event_ce006_3_03_s_63:
    speaker: com
    en: I---
    ko: "---나는."
    ja: "――私は…"
  event_ce006_3_03_s_64:
    speaker: com
    en: I do not know what I should do.
    ko: 어떻게 해야 하지.
    ja: どうすればいい？
  event_ce006_3_03_s_65:
    speaker: ce006_02
    en: You can't ask other people about how to carry out your revenge.
    ko: 네가 결정해.
    ja: 自分で決めろ。
  event_ce006_3_03_s_66:
    speaker: ce006_02
    en: You have to make that decision yourself.
    ko: 복수 방법에 남의 의견을 묻지 마.
    ja: 復讐の方法を、他人に聞こうとするな。
  event_ce006_3_03_s_67:
    speaker: com
    en: "-----"
    ko: "---원래 계획은."
    ja: "――本来は…"
  event_ce006_3_03_s_68:
    speaker: com
    en: The original plan was to ride the elevator down and attack everything in sight.
    ko: 엘리베이터를 타고 내려가 눈에 보이는 모든 것을 공격하려 했다.
    ja: |-
      エレベーターを降りて、目の前に見える
      すべてを攻撃する計画だった。
  event_ce006_3_03_s_69:
    speaker: com
    en: To take revenge on the Ark which stole what belonged to me, to all of us.
    ko: 나의, 우리의 것을 빼앗아간 방주에 복수하려 했다.
    ja: |-
      それを、私の…私たちの財産を奪った
      アークへの復讐とする。
  event_ce006_3_03_s_70:
    speaker: com
    en: I intended on fighting until I was eventually destroyed.
    ko: 그렇게 파괴당할 때까지 싸울 예정이었다.
    ja: |-
      そうして、自分が破壊されるまで
      戦うつもりだった。
  event_ce006_3_03_s_71:
    speaker: com
    en: But---
    ko: 하지만---.
    ja: しかし――
  event_ce006_3_03_s_72:
    speaker: com
    en: If that happens, all of them will disappear.
    ko: 그렇게 되면 그들은 모두 사라진다.
    ja: |-
      それをすれば、シェルターの人々は
      みな消える。
  event_ce006_3_03_s_73:
    speaker: com
    en: They will become forgotten by everyone, as if they never existed.
    ko: |-
      그들은 그저 아무도 기억하지 못한 채,
      원래부터 없던 이들처럼 되어 버린다.
    ja: |-
      誰の記憶にも残らないまま、
      元から存在しなかったかのように
      忘れ去られてしまう。
  event_ce006_3_03_s_74:
    speaker: com
    en: Everyone will be gone.
    ko: 모두 사라진다.
    ja: 何も残らなくなる。
  event_ce006_3_03_s_75:
    speaker: com
    en: I remember them.
    ko: 그들은 내가 기억하고 있다.
    ja: だが、彼らのことを私が覚えている。
  event_ce006_3_03_s_76:
    speaker: com
    en: I am the only one who remembers them.
    ko: 나만이 기억하고 있다.
    ja: 私だけが覚えている。
  event_ce006_3_03_s_77:
    speaker: com
    en: I---
    ko: 나는---.
    ja: 私は――
  event_ce006_3_03_s_78:
    speaker: com
    en: Must ensure that their memories live on.
    ko: 그들의 기억을 이어야 한다.
    ja: 彼らの記憶をつながなければならない。
  event_ce006_3_03_s_79:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_80:
    speaker: ce006_02
    en: Hehe, what a sight. A bucket of bolts pontificating about carrying on memories.
    ko: 큭큭. 쇳덩어리 주제에 기억을 잇는다니….
    ja: ククッ。鉄塊の分際で、記憶をつなごうなどと…
  event_ce006_3_03_s_81:
    speaker: ce006_02
    en: Whether you reach your final decision here, or somewhere else, it has got
      nothing to do with me.
    ko: |-
      뭐, 좋아. 나쁘지 않아.
      지금 여기서 결심을 하건 말건 내 알 바 아니지.
    ja: |-
      まあ、いい。別に悪くもない。
      決意しようが引き延ばそうが、
      私には関係ないことだ。
  event_ce006_3_03_s_82:
    speaker: ce006_02
    en: But if you're going to abandon the notion of revenge, you have to go all the
      way.
    ko: 다만 여기서 복수를 포기하겠다면, 철저하게 해.
    ja: |-
      だが…今ここで何もしないというなら、
      徹底することだな。
  event_ce006_3_03_s_83:
    speaker: ce006_02
    en: You must guard that data contained in that metal hunk of junk you call your
      body and keep it safe, until your creators rot and crumble to dust.
    ko: 창조주란 것들이 다 죽고 썩어 문드러질 때까지 백 년이건 천 년이건 네 고철 깡통 속 데이터를 지켜라.
    ja: |-
      創造主が滅び、朽ち果てるまで
      百年だろうが千年だろうが…
      お前のクズ鉄の中のデータを守れ。
  event_ce006_3_03_s_84:
    speaker: ce006_02
    en: And then, however many hundreds or thousands of years later, you will stand
      upon their ashes triumphant, and laugh at them.
    ko: 그리고 그놈들의 먼지를 짓밟으며 비웃어.
    ja: |-
      そして、そいつらのチリを
      踏みにじりながら、あざ笑ってやれ。
  event_ce006_3_03_s_85:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_86:
    speaker: com
    en: What---
    ko: 너는---.
    ja: 君は――
  event_ce006_3_03_s_87:
    speaker: com
    en: What did you do?
    ko: 너라면 어떻게 할 것인가.
    ja: 君なら、どうする。
  event_ce006_3_03_s_88:
    speaker: com
    en: Did you decide to take revenge? Did you succeed?
    ko: 너는 복수하기로 했나? 복수에 성공했나?
    ja: |-
      君は復讐するつもりなのか？
      それとも、もう成し遂げたのか？
  event_ce006_3_03_s_89:
    speaker: ce006_02
    en: "... There was someone who opened my eyes and made me see the truth. If it
      weren't for them, I would still be living as a mindless slave to a God."
    ko: |-
      …내겐 진실을 깨우치게 해 주신 분이 계신다.
      그분이 아니었다면 아직까지 신의 멍청한 노예로 살고 있었겠지.
    ja: |-
      …私は、あるお方より真実を教わった。
      あの方がいなければ、いまでも
      神の愚かな奴隷として生きていたはずだ。
  event_ce006_3_03_s_90:
    speaker: com
    en: Did that person tell you how to get your revenge?
    ko: 그 사람이 네게 복수할 방법을 알려 주었나?
    ja: その人が、君に復讐する方法を教えたのか？
  event_ce006_3_03_s_91:
    speaker: ce006_02
    en: No. They told me how to make my own decisions according to my own will.
    ko: |-
      아니.
      내 의지로 선택하라고 하셨다.
    ja: |-
      いや。
      私の意志で選べとおっしゃった。
  event_ce006_3_03_s_92:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_93:
    speaker: ce006_02
    en: Yes, with my own will.
    ko: 그래, 내 의지로….
    ja: そう、私の意志で…
  event_ce006_3_03_s_94:
    speaker: ce006_02
    en: Everything I do is for them. If it weren't for them...
    ko: |-
      모든 건 그분을 위한 일이야….
      그분을 위해서라면….
    ja: |-
      すべてはあの方のため…
      そのためなら…
  event_ce006_3_03_s_95:
    speaker: com
    en: "------"
    ko: "------?"
    ja: "――――――？"
  event_ce006_3_03_s_96:
    speaker: ce006_02
    en: "*Sigh*... Why am I even saying this?"
    ko: "…하, 내가 어쩌자고 이런 이야길…."
    ja: "…ふん、なぜこんな話を…"
  event_ce006_3_03_s_97:
    speaker: ce006_02
    en: At any rate, I'm trying to do for you what they did for me, you hunk of junk.
    ko: |-
      어쨌든 그분이 내게 그러셨듯,
      난 그냥 한 가지 일깨워주려는 것뿐이다. 고철 로봇.
    ja: |-
      あの方が私に教えてくださったように、
      お前にも一つ教えてやろう、鉄くず。
  event_ce006_3_03_s_98:
    speaker: ce006_02
    en: No one else can feel your pain for you.
    ko: 네 고통은 누구도 대신 겪어줄 수 없다.
    ja: お前の苦しみは、誰も代わってくれない。
  event_ce006_3_03_s_99:
    speaker: ce006_02
    en: Only you can ease your own pain.
    ko: 오직 너만이 너의 고통을 없앨 수 있다.
    ja: それをなくせるのは、お前自身だけだ。
  event_ce006_3_03_s_100:
    speaker: ce006_02
    en: And you know better than anyone what you have to do to carry on the memory
      of those you care about.
    ko: 네 기억을 잇기 위해 어떻게 해야 되는지는, 네가 제일 잘 알 거야.
    ja: |-
      お前が記憶をつなぐためにすべきことは、
      お前自身が一番よく分かっているだろう。
  event_ce006_3_03_s_101:
    speaker: com
    en: But doing that will not quell the rage inside me.
    ko: 하지만 그럴 경우 나의 울분은 해소되지 않는다.
    ja: しかし、それでは私の恨みが晴らせない。
  event_ce006_3_03_s_102:
    speaker: com
    en: I still yearn for vengeance.
    ko: 나는 복수를 포기하고 싶지 않다.
    ja: 私は復讐を諦めたくない。
  event_ce006_3_03_s_103:
    speaker: ce006_02
    en: Then use your own will.
    ko: 그렇다면.
    ja: それなら…
  event_ce006_3_03_s_104:
    speaker: ce006_02
    en: And make a choice.
    ko: 네 의지로 선택해라.
    ja: お前の意志で選ぶんだな。
  event_ce006_3_03_s_105:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!!
    ja: ドカン！！
  event_ce006_3_03_s_106:
    speaker: "<Narration>"
    en: Com slams its fist into the elevator.
    ko: 콤의 손이 엘리베이터를 후려쳤다.
    ja: コムがエレベーターに激しく打ちつけた
  event_ce006_3_03_s_107:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_108:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_109:
    speaker: "<Narration>"
    en: "*Boom boom boom*!"
    ko: 콰앙-!! 콰앙-!! 콰앙-!!
    ja: ドカン！ドン！ガタン！
  event_ce006_3_03_s_110:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!!
    ja: バーン！！
  event_ce006_3_03_s_111:
    speaker: "<Narration>"
    en: "*Crrrrackle*"
    ko: 파지지직--!
    ja: バチバチ――！
  event_ce006_3_03_s_112:
    speaker: "<Narration>"
    en: Com's pounding creates dents all over the elevator's exterior. Sparks burst
      out violently.
    ko: 엘리베이터는 곳곳이 찌그러진 채 스파크를 뿜어내고 있었다.
    ja: |-
      エレベーターのあちこちがへこみ、
      火花を散らしている
  event_ce006_3_03_s_113:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_114:
    speaker: ce006_02
    en: Is this your revenge?
    ko: 그게 네 복수인가?
    ja: それがお前の復讐か？
  event_ce006_3_03_s_115:
    speaker: com
    en: Do not mock me.
    ko: 고작 이런 걸로 복수라니 웃긴가.
    ja: たったこれだけで復讐かと、笑うか？
  event_ce006_3_03_s_116:
    speaker: com
    en: There is no other path to revenge which I can take.
    ko: 하지만 이것 말고는 할 수 있는 복수가 없다.
    ja: しかし、これ以外にできる復讐がない。
  event_ce006_3_03_s_117:
    speaker: com
    en: If I am to carry on the memories of those I cherish, I cannot be terminated.
    ko: 나는 기억을 이어야 하기에 기능정지할 수 없다.
    ja: |-
      私は記憶をつなぐため、
      機能を停止させるわけにはいかない。
  event_ce006_3_03_s_118:
    speaker: com
    en: So, if you want to laugh at me, go ahead.
    ko: 비웃으려면 비웃어라.
    ja: 笑いたければ、笑うといい。
  event_ce006_3_03_s_119:
    speaker: ce006_02
    en: What are you doing?
    ko: 뭐 하는 거지?
    ja: 何をしている？
  event_ce006_3_03_s_120:
    speaker: ce006_02
    en: It's still functioning.
    ko: 아직 숨통이 남아있잖아.
    ja: まだ動いてるじゃないか。
  event_ce006_3_03_s_121:
    speaker: ce006_02
    en: Finish the job.
    ko: 확실하게 마무리해.
    ja: しっかりトドメを刺せ。
  event_ce006_3_03_s_122:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_123:
    speaker: "<Narration>"
    en: "*Boom boom boom!*"
    ko: 콰앙-!! 콰앙-!! 콰앙-!!
    ja: ドカン！ドン！バーン！
  event_ce006_3_03_s_124:
    speaker: ce006_02
    en: Not enough. It's still going.
    ko: 멀었어. 아직 살아있어.
    ja: まだだ。まだ生きている。
  event_ce006_3_03_s_125:
    speaker: "<Narration>"
    en: "*Boom boom boom!*"
    ko: 콰앙-!! 콰앙-!! 콰앙-!!
    ja: ドカン！ドン！バーン！
  event_ce006_3_03_s_126:
    speaker: ce006_02
    en: More.
    ko: 더 몰아붙여.
    ja: もっと追い詰めてやれ。
  event_ce006_3_03_s_127:
    speaker: "<Narration>"
    en: "*Boom boom boom!*"
    ko: 콰앙-!! 콰앙-!! 콰앙-!!
    ja: ドカン！ドン！バーン！
  event_ce006_3_03_s_128:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 콰앙---
    ja: ドーン――
  event_ce006_3_03_s_129:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_130:
    speaker: ce006_02
    en: Much better.
    ko: 완전히 박살 났군.
    ja: 粉々にしてやったな。
  event_ce006_3_03_s_131:
    speaker: ce006_02
    en: So then, how does it feel to have your revenge?
    ko: 그래서, 복수를 이룬 소감은?
    ja: どうだ、復讐を成し遂げた気分は？
  event_ce006_3_03_s_132:
    speaker: ce006_02
    en: Are you satisfied?
    ko: 만족했나?
    ja: 満足したか？
  event_ce006_3_03_s_133:
    speaker: com
    en: I am satisfied.
    ko: 만족--- 했다.
    ja: 満足――した。
  event_ce006_3_03_s_134:
    speaker: ce006_02
    en: Good.
    ko: 그래.
    ja: そうか。
  event_ce006_3_03_s_135:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_136:
    speaker: ce006_02
    en: Don't think that your vengeance was petty.
    ko: 너의 복수는 하찮지 않았다.
    ja: みごとな復讐だった。
  event_ce006_3_03_s_137:
    speaker: ce006_02
    en: There is no such thing.
    ko: 애초에 하찮은 복수 따위 존재하지 않지.
    ja: そもそもつまらない復讐など、存在しない。
  event_ce006_3_03_s_138:
    speaker: ce006_02
    en: Any act of retribution is a noble one.
    ko: 모든 복수는 그 자체만으로도 긍지 있는 것.
    ja: 復讐とは、それ自体が誇り高きものだ。
  event_ce006_3_03_s_139:
    speaker: ce006_02
    en: You've conveyed your feelings and done what you had to do.
    ko: 너는 너의 기분을 전했고, 네가 할 일을 했다.
    ja: |-
      お前は己の感情を出しきり、
      なすべきことをなした。
  event_ce006_3_03_s_140:
    speaker: ce006_02
    en: Your revenge is complete,
    ko: 그러므로 너의 복수는 완성되었다.
    ja: だからこそ、お前の復讐は成った。
  event_ce006_3_03_s_141:
    speaker: ce006_02
    en: and it was perfect.
    ko: 너는 더할 나위 없는 완벽한 복수를 이뤄냈다.
    ja: この上なく完璧な復讐だ。
  event_ce006_3_03_s_142:
    speaker: ce006_02
    en: Brilliantly done.
    ko: 훌륭해.
    ja: 素晴らしい。
  event_ce006_3_03_s_143:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_s_144:
    speaker: ce006_02
    en: I'm going back.
    ko: 나는 돌아간다.
    ja: もう用はない。
  event_ce006_3_03_s_145:
    speaker: ce006_02
    en: You stay here.
    ko: 너는 여기 있어라.
    ja: お前はここにいろ。
  event_ce006_3_03_s_146:
    speaker: ce006_02
    en: I'm sure those people in white will come for you.
    ko: 그 하얀 녀석들이 너를 찾으러 올 테니.
    ja: そのうちあの白い奴らが捜しにくるだろう。
  event_ce006_3_03_s_147:
    speaker: com
    en: You have helped me, and so I will help you.
    ko: 나의 복수를 도왔으니 내가 너를 돕겠다.
    ja: |-
      君は私の復讐に手を貸してくれた。
      私も君に手を貸そう。
  event_ce006_3_03_s_148:
    speaker: ce006_02
    en: Ha. I do not need help from a tin can like you.
    ko: 크큭. 깡통 로봇에게 도움받을 일 따윈 없어.
    ja: ククッ。ロボットの助けなど必要ない。
  event_ce006_3_03_s_149:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_s_150:
    speaker: ce006_02
    en: You stick to carrying on those memories of yours.
    ko: 너는 기억을 이어라.
    ja: お前の記憶をつないでいけ。
  event_ce006_3_03_s_151:
    speaker: ce006_02
    en: I'll do the same with mine.
    ko: 나도 기억을 이을 테니.
    ja: 私は私の記憶をつなぐ。
  event_ce006_3_03_s_152:
    speaker: "<Narration>"
    en: Raven turns and walks away.
    ko: 레이븐은 사라졌다.
    ja: レイヴンが姿を消した
  event_ce006_3_03_s_153:
    speaker: "<Narration>"
    en: Com watches as she slowly vanishes into the distance.
    ko: 콤은 사라져 가는 레이븐의 뒷모습을 바라보고 있었다.
    ja: |-
      コムのカメラはレイヴンの消えた場所を
      静かに見続けていた
event_ce006_3_03_e:
  event_ce006_3_03_e_1:
    speaker: "<Narration>"
    en: "*Buzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_03_e_2:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_e_3:
    speaker: com
    en: Art has become a Nikke.
    ko: 아트는 니케가 되었다.
    ja: アートはニケになった。
  event_ce006_3_03_e_4:
    speaker: com
    en: She does not remember me.
    ko: 아트는 나를 기억하지 못한다.
    ja: アートは私のことを覚えていない。
  event_ce006_3_03_e_5:
    speaker: com
    en: She does not remember the bunker.
    ko: 벙커도 기억하지 못한다.
    ja: シェルターのことも覚えていない。
  event_ce006_3_03_e_6:
    speaker: com
    en: She has forgotten everything.
    ko: 모두 잊어버렸다.
    ja: すべて忘れてしまった。
  event_ce006_3_03_e_7:
    speaker: com
    en: No one believes the story about the bunker.
    ko: 벙커의 이야기는 아무도 믿어주지 않는다.
    ja: シェルターの話は、誰も聞いてくれなかった。
  event_ce006_3_03_e_8:
    speaker: com
    en: Even when I give them the data to prove it, no one believes me.
    ko: 나의 데이터를 제공했지만 믿어주지 않는다.
    ja: 私のデータを提供しても、信用されなかった。
  event_ce006_3_03_e_9:
    speaker: com
    en: They tried to delete the data.
    ko: 데이터를 지우려고 했다.
    ja: データを削除されそうになった。
  event_ce006_3_03_e_10:
    speaker: com
    en: I escaped to the surface.
    ko: 나는 지상으로 도망쳤다.
    ja: 私は地上へ逃れた。
  event_ce006_3_03_e_11:
    speaker: com
    en: I need to save Hermin.
    ko: 헤르민을 구해야 한다.
    ja: ヘルミンを救わなければ。
  event_ce006_3_03_e_12:
    speaker: com
    en: By now, the water may have receded.
    ko: 지금쯤이면 물이 다 빠졌을 가능성이 농후하다.
    ja: 今なら、排水が進んだ可能性が高い。
  event_ce006_3_03_e_13:
    speaker: com
    en: I need to return to the Ark with Hermin and prove that the story of the bunker
      is true.
    ko: |-
      헤르민과 함께 방주로 돌아가
      벙커의 일이 사실임을 알려야 한다.
    ja: |-
      ヘルミンを連れてアークに帰還し、
      シェルターの話は真実だと知らせなければ。
  event_ce006_3_03_e_14:
    speaker: com
    en: I cannot let what happened there be forgotten.
    ko: 이렇게 잊히면 안 된다.
    ja: このまま忘れられてはいけない。
  event_ce006_3_03_e_15:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_e_16:
    speaker: com
    en: I took too long to get here.
    ko: 이곳까지 오는데 너무 오래 걸렸다.
    ja: ここまで来るのに、ずいぶんかかった。
  event_ce006_3_03_e_17:
    speaker: com
    en: Likelihood of success against a Rapture is 0%. Therefore, avoided all encounters,
      which increased travel time dramatically.
    ko: |-
      랩쳐와 전투 시 승률 0%. 조우를 모두 회피.
      이동시간이 급상승했다.
    ja: |-
      ラプチャーとの戦闘は予想勝率0％。
      遭遇をすべて回避するため、
      移動時間が大幅に増加した。
  event_ce006_3_03_e_18:
    speaker: com
    en: Confirmed bunker's location.
    ko: 벙커의 위치 확인.
    ja: シェルターの位置を確認…
  event_ce006_3_03_e_19:
    speaker: com
    en: The water has not receded at all,
    ko: 물은 전혀 빠지지 않았다.
    ja: 排水がまったく進んでいない。
  event_ce006_3_03_e_20:
    speaker: com
    en: and is now electrified.
    ko: 물에 전기가 흐른다.
    ja: さらに電流が流れている。
  event_ce006_3_03_e_21:
    speaker: com
    en: I searched for a way,
    ko: 방법을 찾아봤다.
    ja: 対処法を計算した。
  event_ce006_3_03_e_22:
    speaker: com
    en: but found nothing.
    ko: 찾지 못했다.
    ja: 見つからなかった。
  event_ce006_3_03_e_23:
    speaker: com
    en: I continued searching,
    ko: 방법을 계속 찾아봤다.
    ja: 方法を探し続けた。
  event_ce006_3_03_e_24:
    speaker: com
    en: and still found nothing.
    ko: 방법을 계속 찾지 못했다.
    ja: それでも見つからなかった。
  event_ce006_3_03_e_25:
    speaker: com
    en: Again and again,
    ko: 방법을 찾아봤다.
    ja: さらに探し続けた。
  event_ce006_3_03_e_26:
    speaker: com
    en: I repeated this process.
    ko: 찾지 못했다.
    ja: 見つからなかった。
  event_ce006_3_03_e_27:
    speaker: com
    en: A lot of time has passed.
    ko: 시간이 많이 흘렀다.
    ja: さらに時が経過した。
  event_ce006_3_03_e_28:
    speaker: com
    en: Hermin is a human.
    ko: 헤르민은 인간이다.
    ja: ヘルミンは人間だ。
  event_ce006_3_03_e_29:
    speaker: com
    en: Given the age that he was when we left, and how much time has passed since,
    ko: 당시 연령과 지금까지의 시간을 합산했을 경우
    ja: 当時の年齢と現在までの時間を計算すると…
  event_ce006_3_03_e_30:
    speaker: com
    en: it is highly likely that he has died.
    ko: 사망했을 가능성 매우 높음.
    ja: すでに生存している可能性は低い。
  event_ce006_3_03_e_31:
    speaker: com
    en: There is no way to enter the bunker.
    ko: 벙커로 진입할 방법 없음.
    ja: シェルターに戻る方法は発見できていない。
  event_ce006_3_03_e_32:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_e_33:
    speaker: com
    en: "-----"
    ko: |-
      ------.
      ------.
    ja: |-
      ――――――
      ――――――
  event_ce006_3_03_e_34:
    speaker: com
    en: The Ark forced us into a corner.
    ko: 방주는 우리를 사지로 내몰았다.
    ja: アークは私たちを死地へ追い込んだ。
  event_ce006_3_03_e_35:
    speaker: com
    en: They never came to rescue the artists living in the bunker.
    ko: 방주는 벙커의 예술가들을 구출하러 오지 않았다.
    ja: |-
      アークはシェルターの芸術家たちを
      助けようとしなかった。
  event_ce006_3_03_e_36:
    speaker: com
    en: They did not help us when we were all dying.
    ko: 방주는 우리 모두가 죽어갈 때 돕지 않았다.
    ja: |-
      アークは死の淵に立つ私たちを、
      助けようとしなかった。
  event_ce006_3_03_e_37:
    speaker: com
    en: They turned Art into a Nikke
    ko: 방주는 아트를 니케로 만들었다.
    ja: アークはアートをニケにした。
  event_ce006_3_03_e_38:
    speaker: com
    en: and took away her memories.
    ko: 방주는 아트의 기억을 빼앗았다.
    ja: アークはアートの記憶を奪った。
  event_ce006_3_03_e_39:
    speaker: com
    en: They never came to rescue Hermin.
    ko: 방주는 헤르민을 구출하러 오지 않았다.
    ja: アークはヘルミンを助けようとしなかった。
  event_ce006_3_03_e_40:
    speaker: com
    en: They practically killed Hermin.
    ko: 방주는 헤르민을 죽였다.
    ja: アークがヘルミンを死なせた。
  event_ce006_3_03_e_41:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_e_42:
    speaker: com
    en: The Ark destroyed that which I hold most dear.
    ko: 방주는 나의 가장 값진 재산을 부쉈다!
    ja: 私の最も価値ある財産はアークに壊された！
  event_ce006_3_03_e_43:
    speaker: com
    en: I have nothing left.
    ko: 나에게는 아무것도 남지 않았다!
    ja: 私には何も残っていない！
  event_ce006_3_03_e_44:
    speaker: com
    en: I will return to the Ark.
    ko: 방주로 돌아간다!
    ja: 私はアークへ戻る！
  event_ce006_3_03_e_45:
    speaker: com
    en: I will destroy what they love most.
    ko: 방주의 재산을 부순다!
    ja: そして、アークの財産を壊す！
  event_ce006_3_03_e_46:
    speaker: com
    en: I must do so!
    ko: 나는 그래야 한다!
    ja: そうしなければならない！
  event_ce006_3_03_e_47:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 카앙-!
    ja: ドン――！
  event_ce006_3_03_e_48:
    speaker: "<Narration>"
    en: Raven is thrown back and tumbles along the ground.
    ko: 레이븐이 밀려나며 바닥을 긁는다.
    ja: レイヴンが吹き飛ばされ、地面を転がった
  event_ce006_3_03_e_49:
    speaker: "<Narration>"
    en: She glares at Gatekeeper, which stands before her.
    ko: 그리고 눈앞의 게이트 키퍼를 노려본다.
    ja: |-
      立ち上がるレイヴンの目は
      ゲートキーパーをにらみ付けている
  event_ce006_3_03_e_50:
    speaker: ce006_02
    en: Argh! Damnit!
    ko: 칫…! 번거롭군…!
    ja: ちっ…！こざかしい…！
  event_ce006_3_03_e_51:
    speaker: hongryeon
    en: Looks like thou art having a time most toilsome.
    ko: 고전하는 것처럼 보이네만.
    ja: 手を焼いているようだねえ。
  event_ce006_3_03_e_52:
    speaker: rapunzel
    en: What kind of Rapture is this?
    ko: "…뭔가요 이 랩쳐는?"
    ja: "…見たことのないラプチャーですね？"
  event_ce006_3_03_e_53:
    speaker: snowwhite
    en: I've never seen anything like it.
    ko: 처음 보는 타입이군.
    ja: 初めて見るタイプだな。
  event_ce006_3_03_e_54:
    speaker: ce006_02
    en: Heh. Perfect timing. I was started to get bored with a one-on-one fight.
    ko: |-
      크큭. 마침 잘 됐어.
      1대 1은 좀 시시하던 참이었거든.
    ja: |-
      ククッ。ちょうどいい。
      1対1で退屈していたところだ。
  event_ce006_3_03_e_55:
    speaker: ce006_02
    en: Come at me, all of you.
    ko: 한꺼번에 덤벼.
    ja: まとめてかかってこい。
  event_ce006_3_03_e_56:
    speaker: hongryeon
    en: "'Tis most tempting, but let us focus on the Rapture before us first."
    ko: 그것도 즐거울 것 같으나 지금은 눈앞의 랩쳐에 집중하세.
    ja: |-
      それも一興と言いたいが、
      今は目の前のラプチャーに集中することだ。
  event_ce006_3_03_e_57:
    speaker: rapunzel
    en: I'll help.
    ko: 돕겠습니다.
    ja: 加勢いたします。
  event_ce006_3_03_e_58:
    speaker: ce006_02
    en: I don't need any help.
    ko: 도움 같은 건 필요 없어.
    ja: 助けなど必要ない。
  event_ce006_3_03_e_59:
    speaker: snowwhite
    en: Then fight however you like, and we'll do the same.
    ko: |-
      그럼 마음대로 싸워라.
      우린 우리 마음대로 싸울 테니.
    ja: |-
      ならば、好きに戦え。
      私たちもそうするだけだ。
  event_ce006_3_03_e_60:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_61:
    speaker: ce006_02
    en: Did you encounter anything noteworthy on your way here?
    ko: 오는 길에 뭔가 보지 못했나?
    ja: 来る途中で何も見なかったか？
  event_ce006_3_03_e_62:
    speaker: rapunzel
    en: If you are speaking of the robot, you do not need to worry.
    ko: 로봇 형제님이라면 안전한 곳에 모셔놨어요.
    ja: コムのことなら、安全な場所に移動させました。
  event_ce006_3_03_e_63:
    speaker: rapunzel
    en: It is safe in another location.
    ko: 그건 걱정하지 않아도 돼요.
    ja: 心配はいりません。
  event_ce006_3_03_e_64:
    speaker: ce006_02
    en: Don't be ridiculous. I couldn't care less about that junk heap.
    ko: 걱정이라니 헛소리를.
    ja: 誰が心配など。
  event_ce006_3_03_e_65:
    speaker: ce006_02
    en: I'm warning you for a second time; don't even think about getting in my way.
    ko: |-
      다시 한번 말하지만,
      날 방해할 생각은 하지 마.
    ja: |-
      もう一度だけ言うが、
      私の邪魔をするな。
  event_ce006_3_03_e_66:
    speaker: ce006_02
    en: That thing is mine.
    ko: 저건 내거니까.
    ja: あいつは私の獲物だ。
  event_ce006_3_03_e_67:
    speaker: hongryeon
    en: Do what thou will. Simply view us as a few trainees practicing beside you.
    ko: 뭐, 그러시게나. 옆에서 연습하는 이들이라 생각하게.
    ja: |-
      ああ、好きにしたまえ。
      私たちは隣で演習でもしていることにしよう。
  event_ce006_3_03_e_68:
    speaker: snowwhite
    en: Let's go.
    ko: 간다.
    ja: 始めるぞ。
  event_ce006_3_03_e_69:
    speaker: rapunzel
    en: All right!
    ko: 예.
    ja: はい。
  event_ce006_3_03_e_70:
    speaker: "<Narration>"
    en: Gatekeeper is sucked into a dark void and disappears.
    ko: 게이트 키퍼가 검은 공간에 빨려 들어가듯 사라졌다.
    ja: |-
      ゲートキーパーが漆黒の空間に
      吸い込まれて消えた
  event_ce006_3_03_e_71:
    speaker: snowwhite
    en: "... Did we defeat it?"
    ko: "…쓰러뜨린 건가?"
    ja: "…倒したのか？"
  event_ce006_3_03_e_72:
    speaker: rapunzel
    en: What do you think that Rapture is?
    ko: 대체 뭘까요. 저 랩쳐는.
    ja: 何だったのでしょうか。あのラプチャーは…
  event_ce006_3_03_e_73:
    speaker: hongryeon
    en: I think it is connected to this mystery woman.
    ko: "…아무래도 이 낭자와 관계가 있어 보이네만."
    ja: |-
      …どうやら、そこのお嬢ちゃんと
      因縁があるようだね。
  event_ce006_3_03_e_74:
    speaker: ce006_02
    en: I haven't the faintest idea what that thing is either.
    ko: 난 저딴 것 몰라.
    ja: あんなものは私も知らぬ。
  event_ce006_3_03_e_75:
    speaker: ce006_02
    en: All I heard is that if I defeat it, I can return...
    ko: 저걸 잡으면 돌아갈 수 있다고만 들었을 뿐이….
    ja: あれを倒せば帰れると聞いただけ…
  event_ce006_3_03_e_76:
    speaker: ce006_02
    en: Hmm?
    ko: "…음?"
    ja: "…ん？"
  event_ce006_3_03_e_77:
    speaker: "<Narration>"
    en: Golden particles begin emanating from Raven's body.
    ko: 레이븐의 몸에서 황금색 입자가 흩날리기 시작했다.
    ja: |-
      レイヴンの身体が黄金色の粒子に
      包まれはじめた
  event_ce006_3_03_e_78:
    speaker: ce006_02
    en: What the...
    ko: 이건….
    ja: これは…
  event_ce006_3_03_e_79:
    speaker: ce006_02
    en: Hold on, am I going back?
    ko: "…그래. 돌아가는 건가."
    ja: "…ああ。在るべき場所へ戻るのか。"
  event_ce006_3_03_e_80:
    speaker: hongryeon
    en: Your words continue to make little sense.
    ko: 아까부터 영문모를 소리만 늘어놓고 있군 그래.
    ja: 一向に話が飲みこめないねえ。
  event_ce006_3_03_e_81:
    speaker: hongryeon
    en: Let us head back to the city instead of standing here idly.
    ko: 여기서 이럴게 아니라 도시로 함께 돌아가세나.
    ja: |-
      ここにいるより、あの都市まで
      連れていった方がよさそうだ。
  event_ce006_3_03_e_82:
    speaker: hongryeon
    en: It does seem as if thou are part of those Outsiders whom we met before.
    ko: 보아하니 우리가 아는 이방인과 같은 일행인 것 같으니.
    ja: 見たところ、あの異邦人たちとは同郷であろう。
  event_ce006_3_03_e_83:
    speaker: ce006_02
    en: Outsiders?
    ko: "…이방인?"
    ja: "…異邦人？"
  event_ce006_3_03_e_84:
    speaker: hongryeon
    en: Indeed. There are others in the city who are bedecked in garb similar to thine.
    ko: 그렇다네. 낭자와 비슷한 복식의 이방인들이 도시에 머물고 있네.
    ja: |-
      ああ。お嬢ちゃんと似た
      出で立ちの一行に会った。
  event_ce006_3_03_e_85:
    speaker: rapunzel
    en: I believe their names were EVE, Lily, and Adam. Right?
    ko: 예. 성함이 아마 이브 자매님. 릴리 자매님. 아담 형제님이었죠?
    ja: |-
      名前は確か…イヴさん、リリーさん、
      アダムさん、でしたか？
  event_ce006_3_03_e_86:
    speaker: snowwhite
    en: I think so.
    ko: 그랬던 것 같다.
    ja: そのはずだ。
  event_ce006_3_03_e_87:
    speaker: ce006_02
    en: What?!
    ko: "…뭐."
    ja: "…何…？"
  event_ce006_3_03_e_88:
    speaker: hongryeon
    en: I have long ruminated on how your sword style bears a peculiar similarity
      to EVE's.
    ko: 그렇지 않아도 낭자의 검이 이브 낭자와 검술이 매우 닮아 있는 게 내내 신경 쓰였….
    ja: |-
      剣筋がイヴお嬢ちゃんと
      そっくりで気になっていたが…
  event_ce006_3_03_e_89:
    speaker: ce006_02
    en: EVE?!
    ko: 이브…!?
    ja: イヴ…！？
  event_ce006_3_03_e_90:
    speaker: ce006_02
    en: Is EVE here?
    ko: 이브가 여기 있나?
    ja: イヴがここにいるのか？
  event_ce006_3_03_e_91:
    speaker: hongryeon
    en: Ah, it is as I thought. You two are acquainted.
    ko: 오, 역시. 아는 사이였군.
    ja: ほう。やはり、知り合いだったかい？
  event_ce006_3_03_e_92:
    speaker: ce006_02
    en: And him as well...
    ko: 그리고… 그분도….
    ja: それに…あの方まで…
  event_ce006_3_03_e_93:
    speaker: ce006_02
    en: Why her and not me? Not again...
    ko: 어째서… 또 내가 아니라… 그딴 것과 함께….
    ja: なぜだ…また私ではなく…あんなものと…
  event_ce006_3_03_e_94:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_95:
    speaker: ce006_02
    en: Where is she?
    ko: 어디냐.
    ja: どこだ。
  event_ce006_3_03_e_96:
    speaker: hongryeon
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_3_03_e_97:
    speaker: ce006_02
    en: Tell me where she is.
    ko: 어디에 있는지 말해.
    ja: 場所を教えろ。
  event_ce006_3_03_e_98:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_99:
    speaker: hongryeon
    en: I think it is best that we do not reveal this information.
    ko: 말하지 않는 게 좋겠군.
    ja: 教えぬ方がよさそうだな。
  event_ce006_3_03_e_100:
    speaker: "<Narration>"
    en: Raven dashes forward and swings her sword at Scarlet.
    ko: 레이븐이 돌진해 홍련에게 검을 휘둘렀다.
    ja: レイヴンが躍りかかり、紅蓮の剣が閃いた
  event_ce006_3_03_e_101:
    speaker: "<Narration>"
    en: "*Clang*"
    ko: 카앙-!
    ja: キン！
  event_ce006_3_03_e_102:
    speaker: "<Narration>"
    en: Scarlet blocks the blow.
    ko: 홍련이 레이븐의 검을 받아낸다.
    ja: 紅蓮とレイヴンの剣が競り合う
  event_ce006_3_03_e_103:
    speaker: ce006_02
    en: Tell me.
    ko: 말해라.
    ja: 言え。
  event_ce006_3_03_e_104:
    speaker: hongryeon
    en: Now thou has giveth me even less reasons to do so.
    ko: 더더욱 말할 수 없겠네만.
    ja: なおさら言えぬな。
  event_ce006_3_03_e_105:
    speaker: ce006_02
    en: EVE... to think of that foul creature by his side...
    ko: 이브… 그 가증스러운 것이 그분의 곁에….
    ja: イヴ…忌々しい奴が、なぜお側に…
  event_ce006_3_03_e_106:
    speaker: ce006_02
    en: Why would he be with her...?
    ko: 어째서 그분은… 그딴 것에게….
    ja: なぜあの方は…あんなものに…！
  event_ce006_3_03_e_107:
    speaker: ce006_02
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_108:
    speaker: ce006_02
    en: It should be me. Me alone.
    ko: 나다. 오직 나다.
    ja: 私だ。私しかいないのだ。
  event_ce006_3_03_e_109:
    speaker: ce006_02
    en: Not that mindless doll.
    ko: |-
      그딴 아무것도 모르는 인형이 아니라,
      나란 말이다.
    ja: あんな何も知らない人形ではなく、私しか…！
  event_ce006_3_03_e_110:
    speaker: hongryeon
    en: Thy words become more and more fatuous.
    ko: 점점 더 영문모를 소릴 하는군.
    ja: ますます様子がおかしくなったな。
  event_ce006_3_03_e_111:
    speaker: ce006_02
    en: Tell me where she is!
    ko: 말해라.
    ja: 言え。
  event_ce006_3_03_e_112:
    speaker: ce006_02
    en: I must kill that thing at once!
    ko: 당장 그것의 숨통을 끊어버려야 하니까!
    ja: 今すぐあれの息の根を止めてやる！
  event_ce006_3_03_e_113:
    speaker: hongryeon
    en: Hold thy tongue.
    ko: 적당히 하게나.
    ja: いい加減にしたまえ。
  event_ce006_3_03_e_114:
    speaker: "<Narration>"
    en: "*Clang*"
    ko: 카앙-!
    ja: カン！
  event_ce006_3_03_e_115:
    speaker: "<Narration>"
    en: Scarlet uses her sword to push Raven back,
    ko: 홍련의 검이 레이븐을 밀어낸다.
    ja: 紅蓮の剣がレイヴンを払った
  event_ce006_3_03_e_116:
    speaker: "<Narration>"
    en: but she immediately charges back towards Scarlet.
    ko: 레이븐은 바로 홍련에게로 질주했다.
    ja: レイヴンは間を置かず、再び飛びかかった
  event_ce006_3_03_e_117:
    speaker: ce006_02
    en: I'm the only one who deserves to be with him! Not EVE!
    ko: |-
      그분에게 어울리는 것은 오직 나뿐이다!
      이브 따위가 아니라!
    ja: |-
      ふさわしいのは私だけだ！
      イヴなんかじゃない！
  event_ce006_3_03_e_118:
    speaker: hongryeon
    en: "...!"
    ko: "…!"
    ja: "…！"
  event_ce006_3_03_e_119:
    speaker: "<Narration>"
    en: Just as Raven and Scarlet's swords are about to collide,
    ko: 레이븐과 홍련의 검격이 부딪히기 직전.
    ja: レイヴンと紅蓮の剣が交わる瞬間…
  event_ce006_3_03_e_120:
    speaker: "<Narration>"
    en: Raven disappears in a burst of golden particles, causing Scarlet's sword to
      make contact with nothing but air.
    ko: |-
      레이븐은 황금색 입자와 함께 사라졌고,
      홍련의 검이 허공을 갈랐다.
    ja: |-
      レイヴンが黄金色の粒子とともに消滅し、
      紅蓮の剣は虚空を裂いた
  event_ce006_3_03_e_121:
    speaker: "<Narration>"
    en: Everyone looks around, bewildered,
    ko: 모두가 주위를 둘러본다.
    ja: 全員が周囲を警戒した
  event_ce006_3_03_e_122:
    speaker: "<Narration>"
    en: but Raven is nowhere to be seen.
    ko: 하지만 레이븐은 보이지 않았다.
    ja: しかし、レイヴンの姿はもはや見当たらなかった
  event_ce006_3_03_e_123:
    speaker: hongryeon
    en: Do I dream in this moment? This is pure madness!
    ko: |-
      …꿈이라도 꾸고 있는 건가?
      귀신이 곡할 노릇이군.
    ja: |-
      …夢でも見させられているのかね？
      化かされた気分だ。
  event_ce006_3_03_e_124:
    speaker: rapunzel
    en: Y-yeah, what in the world is going on...
    ko: |-
      그, 그러게요.
      이게 다 무슨 일인지….
    ja: |-
      そ、そうですね。
      何が起こっているのか…
  event_ce006_3_03_e_125:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_126:
    speaker: snowwhite
    en: Let's secure Com and get out of here.
    ko: 콤을 확보하고 돌아간다.
    ja: コムを確保して戻ろう。
  event_ce006_3_03_e_127:
    speaker: hongryeon
    en: Surely your interests should have been piqued by a situation as peculiar as
      this?
    ko: 자네. 좀 더 이 상황에 관심을 가지는 게 어떻겠나.
    ja: |-
      君…もう少し置かれた状況に
      興味を持ったらどうかね。
  event_ce006_3_03_e_128:
    speaker: snowwhite
    en: Would being more interested help me understand it better?
    ko: 관심을 가진다고 알 수 있는 방법이 있나?
    ja: 興味を持てば、何か分かることがあるか？
  event_ce006_3_03_e_129:
    speaker: hongryeon
    en: "... Forsooth, most likely not."
    ko: 뭐… 없겠지.
    ja: まあ…ないであろうな。
  event_ce006_3_03_e_130:
    speaker: snowwhite
    en: Then let's finish what we came here for
    ko: 그럼 우린 우리 할 일을 한다.
    ja: ならば、私たちはするべきことをする。
  event_ce006_3_03_e_131:
    speaker: snowwhite
    en: and get moving.
    ko: 이동하자.
    ja: 移動しよう。
  event_ce006_3_03_e_132:
    speaker: hongryeon
    en: "... Very well. Let us move."
    ko: "…그래. 그럼세."
    ja: "…ああ。そうしよう。"
  event_ce006_3_03_e_133:
    speaker: rapunzel
    en: All right.
    ko: "…예. 가죠."
    ja: "…はい。行きましょう。"
  event_ce006_3_03_e_134:
    speaker: com
    en: Where are we going?
    ko: 어디로 가는 거지?
    ja: どこへ行く？
  event_ce006_3_03_e_135:
    speaker: snowwhite
    en: To the city.
    ko: 도시로 간다.
    ja: あの都市へ。
  event_ce006_3_03_e_136:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_03_e_137:
    speaker: com
    en: Let's go to the Ark.
    ko: 방주로 가자.
    ja: アークに行きたい。
  event_ce006_3_03_e_138:
    speaker: snowwhite
    en: Given your feelings about the Ark, I cannot take you there.
    ko: "…방주에 복수하려는 녀석을 방주로 데려갈 순 없다."
    ja: |-
      …害をなそうとしていることが
      分かっている以上、それはできない。
  event_ce006_3_03_e_139:
    speaker: com
    en: I no longer have any intentions of reprisal.
    ko: 복수는 끝났다.
    ja: 復讐はもう終わった。
  event_ce006_3_03_e_140:
    speaker: rapunzel
    en: That elevator near us is completely destroyed.
    ko: "…인근의 엘리베이터가 부서진 것 같던데."
    ja: "…近くのエレベーターが壊されているようです。"
  event_ce006_3_03_e_141:
    speaker: rapunzel
    en: Was that your doing?
    ko: 형제님이 한 건가요?
    ja: あなたの仕業ですか？
  event_ce006_3_03_e_142:
    speaker: com
    en: It was.
    ko: 그래. 내가 했다.
    ja: そうだ。私がやった。
  event_ce006_3_03_e_143:
    speaker: hongryeon
    en: And dost thou consider that thy revenge?
    ko: 그게 자네의 복수인가.
    ja: それが君の復讐ということかい。
  event_ce006_3_03_e_144:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_03_e_145:
    speaker: com
    en: I destroyed the Ark's property.
    ko: 방주의 재산을 부쉈다.
    ja: アークの財産を破壊した。
  event_ce006_3_03_e_146:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_147:
    speaker: snowwhite
    en: I'm sure you must have had plenty of other ideas in mind.
    ko: 방주에 복수할 수 있는 방법은 그것 말고도 많았을 거다.
    ja: |-
      アークに復讐したいのなら、
      方法は他にいくらでもあったはずだ。
  event_ce006_3_03_e_148:
    speaker: com
    en: I must carry on the memories of those who would otherwise be forgotten.
    ko: 나는 잊힐 이들의 기억을 이어야 한다.
    ja: |-
      私は忘れられている人々の記憶を
      つなぐ必要がある。
  event_ce006_3_03_e_149:
    speaker: com
    en: I cannot be the only one to remember.
    ko: 나만 알고 있으면 안 된다.
    ja: 私だけが知っていても、意味がない。
  event_ce006_3_03_e_150:
    speaker: com
    en: I must pass their legacy onto the Ark.
    ko: 내가 방주에 전해야 한다.
    ja: 私がアークに伝えなくては。
  event_ce006_3_03_e_151:
    speaker: com
    en: If I am to do that, I must continue to exist.
    ko: 그렇기에 나는 계속 존재해야 하며
    ja: そのためには、私が存在し続ける必要があり…
  event_ce006_3_03_e_152:
    speaker: com
    en: The Ark must, too.
    ko: 방주 역시 계속 존재해야 한다.
    ja: アークも存在し続ける必要がある。
  event_ce006_3_03_e_153:
    speaker: com
    en: Therefore, I cannot act against the Ark.
    ko: 나는 방주에 복수할 수 없다.
    ja: 私の復讐は、アークを破壊できない。
  event_ce006_3_03_e_154:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_155:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_156:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_03_e_157:
    speaker: com
    en: Take me to the Ark.
    ko: 그러니 나를 무사히 방주로 데려다 다오.
    ja: 私を安全にアークへ連れていってくれ。
  event_ce006_3_03_e_158:
    speaker: hongryeon
    en: Ha, 'tis a most importunate creature!
    ko: 후후. 이것 참 뻔뻔한 로봇이로세.
    ja: ふふ…大した肝の太さだ。
  event_ce006_3_03_e_159:
    speaker: com
    en: I need to take a rest.
    ko: 한숨 자겠다.
    ja: しばらく休眠したい。
  event_ce006_3_03_e_160:
    speaker: com
    en: I am very tired.
    ko: 나는 너무 지쳤다.
    ja: 私は非常に疲れた。
  event_ce006_3_03_e_161:
    speaker: hongryeon
    en: If that be the case, we may carry thee.
    ko: 응? 이보게. 그럼 우리가 자네를 옮겨야 하지 않나.
    ja: なに？待て、私たちに運ばせるつもりかい？
  event_ce006_3_03_e_162:
    speaker: "<Narration>"
    en: Com seemingly freezes in place. Only faint vibrations can be felt emanating
      from it.
    ko: |-
      콤은 미동도 하지 않는다.
      옅은 진동만 느껴질 뿐이다.
    ja: |-
      コムが静かになった。
      かすかな振動だけが
      まだ動作していることを物語っている
  event_ce006_3_03_e_163:
    speaker: hongryeon
    en: "... Has it gone to sleep?"
    ko: "…자는군."
    ja: "…寝てしまったか。"
  event_ce006_3_03_e_164:
    speaker: rapunzel
    en: Sleep mode, to be exact.
    ko: 뭐… 정확히는 절전 모드 같은 거겠지만요.
    ja: |-
      おそらく…正確には節電モードのような
      ものでしょう。
  event_ce006_3_03_e_165:
    speaker: hongryeon
    en: Goodness me.
    ko: 것 참.
    ja: まいったね。
  event_ce006_3_03_e_166:
    speaker: rapunzel
    en: At least it was kind enough to leave its orbital locks disengaged.
    ko: "…그래도 양심상 궤도의 잠금장치는 풀어놓은 상태네요."
    ja: |-
      …とりあえず、履帯のロックは
      解除されているようです。
  event_ce006_3_03_e_167:
    speaker: hongryeon
    en: Are we to push this creation all the way to the Ark?
    ko: "…밀면서 가야 하는 겐가? 방주까지?"
    ja: "…押していけということかい？アークまで？"
  event_ce006_3_03_e_168:
    speaker: snowwhite
    en: When we get close, we can contact @UserName.
    ko: "…근처에 도착하면 그 녀석에게 연락하도록 하지."
    ja: "…近くまで行って、あいつに知らせればいい。"
  event_ce006_3_03_e_169:
    speaker: hongryeon
    en: My goodness!
    ko: 별 일을 다 해보는군.
    ja: とんだ荷物運びを押し付けられたね。
  event_ce006_3_03_e_170:
    speaker: rapunzel
    en: Let's go. It's a long way back.
    ko: 가요. 한참 걸어야 해요.
    ja: 行きましょう。かなり距離があります。
  event_ce006_3_03_e_171:
    speaker: snowwhite
    en: It'll be a long journey, that's for sure.
    ko: 먼 길이 되겠군.
    ja: 長旅になりそうだ。
  event_ce006_3_03_e_172:
    speaker: "<Narration>"
    en: "*Buzzz*"
    ko: 치지지직--
    ja: ザザザッ――
  event_ce006_3_03_e_173:
    speaker: com
    en: What is this monument-like object?
    ko: 이 재단과 닮은 것은 무엇이지?
    ja: これは祭壇に似ているが、何だ？
  event_ce006_3_03_e_174:
    speaker: middlehermin
    en: Oh, this?
    ko: 아… 이건….
    ja: ああ…それは…
  event_ce006_3_03_e_175:
    speaker: middlehermin
    en: It's a place to honor those of us who left too soon.
    ko: 이 벙커에 머물던 사람들의 사진입니다.
    ja: このシェルターにいた人たちの写真です。
  event_ce006_3_03_e_176:
    speaker: middlehermin
    en: These photos are of the people who stayed in the bunker.
    ko: "…먼저 떠난 이들을 기리는 곳이죠."
    ja: "…今はもういない人たちです。"
  event_ce006_3_03_e_177:
    speaker: middlehermin
    en: Saying it out loud, I suppose it's not all that different from a monument.
    ko: 말하고 보니 재단과 다르지 않군요.
    ja: 考えてみると、祭壇そのものですね。
  event_ce006_3_03_e_178:
    speaker: com
    en: Why are you leaving it here?
    ko: 왜 이곳에 놔두고 있는 것이지?
    ja: なぜそんなことをする？
  event_ce006_3_03_e_179:
    speaker: middlehermin
    en: Hehe, now that you ask...
    ko: 글쎄요….
    ja: さあ…
  event_ce006_3_03_e_180:
    speaker: middlehermin
    en: I'm not entirely sure myself.
    ko: 허허. 막상 그렇게 물어보시니 뭐라 대답하기가….
    ja: |-
      ははは。そう聞かれると、
      何と答えればいいのか…
  event_ce006_3_03_e_181:
    speaker: bunkerchild
    en: Is it so that you do not forget?
    ko: 안 잊어먹으려고 그런 거 아니에요?
    ja: 忘れないようにするためじゃないの？
  event_ce006_3_03_e_182:
    speaker: bunkerchild
    en: If you see it often, you will not forget.
    ko: 자꾸 보면 안 잊어먹으니까요.
    ja: いつも見てたら忘れないでしょ。
  event_ce006_3_03_e_183:
    speaker: middlehermin
    en: Ah, yes. That must be it.
    ko: 오. 그게 맞겠구나.
    ja: おお、まさにその通りだね。
  event_ce006_3_03_e_184:
    speaker: com
    en: If you digitize it and save it as data, you will not forget.
    ko: 데이터에 저장하면 잊어버리지 않는다.
    ja: データを保存すれば忘れない。
  event_ce006_3_03_e_185:
    speaker: middlehermin
    en: Haha, unfortunately we humans don't have the ability to store data in such
      a way.
    ko: 허허. 우리한텐 데이터 저장 능력이 없으니까요.
    ja: |-
      ははは。私たちにそういう能力は
      ありませんから。
  event_ce006_3_03_e_186:
    speaker: middlehermin
    en: We are forgetful creatures by our very nature.
    ko: "…우리는 망각의 생물입니다."
    ja: "…私たち人間は、忘れる生き物です。"
  event_ce006_3_03_e_187:
    speaker: middlehermin
    en: Eventually, in time, we forget things.
    ko: 언젠가 잊어버리겠죠.
    ja: |-
      あらゆることはいつか
      忘れられてしまうでしょう。
  event_ce006_3_03_e_188:
    speaker: middlehermin
    en: That's why, in order to stave off that day for as long as we can,
    ko: 그러지 않기 위해, 잊어버릴 때까지의 시간을 최대한 늦추기 위해.
    ja: |-
      しかし、それまでの時間を
      せめて引き延ばすために…
  event_ce006_3_03_e_189:
    speaker: middlehermin
    en: we keep photos like these, and look at them often.
    ko: 이렇게 사진으로 남겨두고 계속 눈에 담는 거겠죠.
    ja: |-
      こうして写真に残し、
      目に焼き付けておくのです。
  event_ce006_3_03_e_190:
    speaker: middlehermin
    en: We do this because they contain memories which are precious to us.
    ko: 소중한 기억이니까.
    ja: それが大切な思い出というものです。
  event_ce006_3_03_e_191:
    speaker: com
    en: But someday, you will forget.
    ko: 하지만 언젠가 잊는다.
    ja: しかし、いつか忘れる。
  event_ce006_3_03_e_192:
    speaker: com
    en: You are human. You will die someday.
    ko: 너희는 인간이다. 언젠가 죽는다.
    ja: 君たちは人間だ。いつか死ぬ。
  event_ce006_3_03_e_193:
    speaker: com
    en: And all of your memories will disappear.
    ko: 그러면 기억도 모두 사라진다.
    ja: そうなれば、記憶もすべて消える。
  event_ce006_3_03_e_194:
    speaker: middlehermin
    en: "... That's true."
    ko: "…그렇겠죠."
    ja: "…そうでしょうね。"
  event_ce006_3_03_e_195:
    speaker: bunkerchild
    en: What if Com remembers us?
    ko: 아, 그러면 그러면.
    ja: あ、じゃあじゃあ！
  event_ce006_3_03_e_196:
    speaker: bunkerchild
    en: We won't be forgotten then, will we?
    ko: 콤이 우리 기억하면 안 잊어버리는 거 아니에요?
    ja: |-
      コムが私たちを覚えててくれたら、
      忘れないよね？
  event_ce006_3_03_e_197:
    speaker: middlehermin
    en: Hmm, I suppose that's true as well.
    ko: 음. 그렇겠구나.
    ja: うーん、そうかもしれないね。
  event_ce006_3_03_e_198:
    speaker: com
    en: That is correct. My memory is infallible.
    ko: 그렇다. 나는 계속 기억할 수 있다.
    ja: そうだ。私はずっと覚えている。
  event_ce006_3_03_e_199:
    speaker: bunkerchild
    en: Well then, do us a favor, will you Com?
    ko: 그러면 콤.
    ja: じゃあ、コム。
  event_ce006_3_03_e_200:
    speaker: bunkerchild
    en: Remember us so that we aren't forgotten.
    ko: 우리 잊어버리지 않게 계속 기억해 줘요. 알겠죠?
    ja: |-
      私たちのこと忘れないように、
      ずっと覚えてて、ね？
  event_ce006_3_03_e_201:
    speaker: com
    en: Okay. I will remember.
    ko: 그래. 기억하겠다.
    ja: 分かった。覚えている。
  event_ce006_3_03_e_202:
    speaker: bunkerchild
    en: Promise!
    ko: 약속!
    ja: 約束！
  event_ce006_3_03_e_203:
    speaker: com
    en: Promise.
    ko: 약속.
    ja: 約束する。
event_ce006_2_06_s:
  event_ce006_2_06_s_1:
    speaker: ce006_03
    en: 2 minutes left!
    ko: 2분 남았어요!
    ja: あと2分です！
  event_ce006_2_06_s_2:
    speaker: elegg
    en: Hurry, hurry, hurry!
    ko: 빨리빨리빨리빨리!
    ja: 早く早く早く早く！
  event_ce006_2_06_s_3:
    speaker: ce006_03
    en: Rushing me won't make it go faster!
    ko: 그렇게 재촉한다고 빨리 되는 게 아니라고요!
    ja: 急かされたって早くなりません！
  event_ce006_2_06_s_4:
    speaker: "<Self>"
    en: Are you done with all the backups?
    ko: 백업은 모두 끝났지!?
    ja: 転送作業は終わっているか！？
  event_ce006_2_06_s_5:
    speaker: elegg
    en: Yep, down to the last bit. Once Lily is finished, we're good to go.
    ko: |-
      녜! 빠짐없이 다 했어여!
      릴리 씨가 챙기는 것만 마무리되면 진짜 끝이에여!
    ja: |-
      私の分は終わっておりますぞ！
      あとはリリー氏の担当分だけですな！
  event_ce006_2_06_s_6:
    speaker: "<Narration>"
    en: "*Krrrrrshhh*"
    ko: 콰과과과과--!!
    ja: ドドドドド――！！
  event_ce006_2_06_s_7:
    speaker: "<Monologue>"
    en: Water pours in through the cracks in the walls and ceiling.
    ko: 갈라진 벽과 천장에서 물이 마구 쏟아지고 있다.
    ja: |-
      壁と天井に開いた穴から
      水が大量に流れ込んできている
  event_ce006_2_06_s_8:
    speaker: "<Monologue>"
    en: The water is already up to our ankles.
    ko: 벌써 낮은 곳은 물에 잠겨있는 상태다.
    ja: すでに低所の床が水に浸かり始めていた
  event_ce006_2_06_s_9:
    speaker: "<Monologue>"
    en: At this rate, it won't be much longer until the entire bunker is underwater.
    ko: "…이대로 가다간 벙커 전체가 잠기고 말 거다."
    ja: |-
      …シェルター全体の水没まで、
      もはや一刻の猶予もなさそうだ
  event_ce006_2_06_s_10:
    speaker: ce006_03
    en: Elegg! The water is coming this way!
    ko: 일레그! 물! 물! 물이 이쪽으로 와요!
    ja: エレグ！み、水！水が来てます！
  event_ce006_2_06_s_11:
    speaker: elegg
    en: Gah! Stay back! Shoo, shoo!
    ko: 으아아! 오지 마여! 쉿! 쉿쉿쉿!
    ja: ひょええ！こ、来ないでくだされ！シッシッ！
  event_ce006_2_06_s_12:
    speaker: ce006_03
    en: "... Did you really think that would work?"
    ko: 그런다고 안 오겠어요!?
    ja: 追い払えるワケないでしょ！？
  event_ce006_2_06_s_13:
    speaker: "<Self>"
    en: Can't you go any faster?!
    ko: 제발…!
    ja: 頼む…早く…！
  event_ce006_2_06_s_14:
    speaker: ce006_03
    en: 3... 2... 1...!
    ko: 3…! 2…! 1…!
    ja: 3…！2…！1…！
  event_ce006_2_06_s_15:
    speaker: ce006_03
    en: Done!
    ko: 끝났어요!
    ja: データ転送完了！
  event_ce006_2_06_s_16:
    speaker: elegg
    en: Don't pull it out right away! You need to eject it properly!
    ko: |-
      바로 뽑지 마여!
      하드웨어 안전 제거 꼭 해야 돼여!
    ja: |-
      待った！
      ハードウェアの安全な取り外しをポチっと！
  event_ce006_2_06_s_17:
    speaker: ce006_03
    en: Ugh, damn this ancient machine!
    ko: 아으 낡아빠진 기계!
    ja: ああもう、これだから古い機械は！
  event_ce006_2_06_s_18:
    speaker: ce006_03
    en: "... There, all done, for real this time!"
    ko: "…됐어요! 진짜 끝!"
    ja: "…できた！今度こそ完了！"
  event_ce006_2_06_s_19:
    speaker: elegg
    en: Let's run!
    ko: 달려여!
    ja: ダッシュですぞ！
  event_ce006_2_06_s_20:
    speaker: ce006_03
    en: Gaaaahh!
    ko: 으아아아--!!
    ja: だあああっ！！
  event_ce006_2_06_s_21:
    speaker: elegg
    en: Huff...! Huff...!
    ko: 헤엑…! 헤엑…!
    ja: はぁ…！はぁ…！
  event_ce006_2_06_s_22:
    speaker: ce006_03
    en: Whew...! Whew...!
    ko: 후우…! 후우…!
    ja: ふぅ…！ふぅ…！
  event_ce006_2_06_s_23:
    speaker: elegg
    en: We got everything we needed. There's nothing missing.
    ko: |-
      …그래도… 다 건졌어여.
      하나도 빠짐없이여.
    ja: |-
      …どうにか…完了できましたな。
      一つ残らず…
  event_ce006_2_06_s_24:
    speaker: ce006_03
    en: That was close.
    ko: 아슬아슬했네요.
    ja: ギリギリでしたね。
  event_ce006_2_06_s_25:
    speaker: roam
    en: The bunker is submerged.
    ko: 벙커. 전부 잠겼다.
    ja: シェルター、沈んだ。
  event_ce006_2_06_s_26:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_27:
    speaker: "<Monologue>"
    en: We stand atop a hill overlooking the city, staring nonplussed at the newly
      reformed lake.
    ko: 도시의 고지대로 올라온 우리는 다시 생겨난 호수를 망연자실하게 쳐다보았다.
    ja: |-
      高台に逃がれた私たちは、
      元通りになりつつある湖を呆然と見下ろした
  event_ce006_2_06_s_28:
    speaker: "<Monologue>"
    en: After 100 long years, the waters have claimed the bunker,
    ko: 100년을 견뎌온 벙커는, 이제 물에 잠겨 그 기능을 잃었고.
    ja: |-
      100年もの時間に耐えてきたシェルターは、
      浸水によりとうとう機能を失った
  event_ce006_2_06_s_29:
    speaker: "<Monologue>"
    en: dragging its long history along with it down to the aquatic depths.
    ko: 수면 아래에서 길었던 역사를 마무리하겠지.
    ja: その姿は歴史もろとも、水底で朽ちて行くだろう
  event_ce006_2_06_s_30:
    speaker: anis
    en: I can't believe that place really lasted an entire century...
    ko: "…진짜 100년을 버티는 벙커네."
    ja: "…本当に100年耐えたのね。"
  event_ce006_2_06_s_31:
    speaker: neon
    en: Where do you think all that water came from?
    ko: 그런데 물이 어디서 들어온 걸까요?
    ja: |-
      それにしても、どこから
      水が入ってきたんでしょうか？
  event_ce006_2_06_s_32:
    speaker: anis
    en: Beats me, but it has to have come from somewhere. Nowhere on the surface is
      normal.
    ko: |-
      글쎄. 어딘가에서 들어오지 않았을까?
      지상에 어디 멀쩡한 게 있겠어?
    ja: |-
      さあね。どこからでも同じでしょ？
      地上のことなんてほとんど知らないんだから。
  event_ce006_2_06_s_33:
    speaker: privaty
    en: Let's get going, Hermin.
    ko: "…이동하죠. 헤르민님."
    ja: "…行きましょう。ヘルミンさん。"
  event_ce006_2_06_s_34:
    speaker: hermin
    en: Oh!
    ko: 아….
    ja: ああ…
  event_ce006_2_06_s_35:
    speaker: hermin
    en: "... Yes."
    ko: "…예, 예. 가시죠."
    ja: "…そうですね。行きましょう。"
  event_ce006_2_06_s_36:
    speaker: hermin
    en: Let's go.
    ko: 잘… 부탁드립니다.
    ja: よろしく…お願いします。
  event_ce006_2_06_s_37:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_2_06_s_38:
    speaker: roam
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_2_06_s_39:
    speaker: ce006_01
    en: Yes?
    ko: 응?
    ja: 何？
  event_ce006_2_06_s_40:
    speaker: roam
    en: "------"
    ko: "------."
    ja: "――――――"
  event_ce006_2_06_s_41:
    speaker: ce006_01
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_ce006_2_06_s_42:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_43:
    speaker: ce006_01
    en: Oh, right.
    ko: "…아."
    ja: "…あ。"
  event_ce006_2_06_s_44:
    speaker: ce006_01
    en: I'm sorry everyone, but can you wait just a moment?
    ko: 다들 미안해. 조금만 기다려 줘.
    ja: みんな、ごめん。少し待っていて。
  event_ce006_2_06_s_45:
    speaker: ce006_01
    en: I'll be right back.
    ko: 금방 갔다 올게.
    ja: すぐ戻ってくる。
  event_ce006_2_06_s_46:
    speaker: "<Self>"
    en: Huh?
    ko: "…응?"
    ja: "…え？"
  event_ce006_2_06_s_47:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 첨벙!
    ja: バシャッ！
  event_ce006_2_06_s_48:
    speaker: "<Monologue>"
    en: Eve dives into the lake.
    ko: "…이브는 호수 속으로 뛰어들었다."
    ja: "…イヴが湖に飛び込んだ"
  event_ce006_2_06_s_49:
    speaker: "<Narration>"
    en: Inside the bunker, now completely submerged, everything is dark.
    ko: 물에 잠긴 벙커는 어둡다.
    ja: |-
      浸水したシェルターの内部は
      すでに明かりを失っている
  event_ce006_2_06_s_50:
    speaker: "<Narration>"
    en: Despite this, EVE can make out a rough outline of what she's looking for.
    ko: 하지만 대충의 윤곽은 확인할 수 있다.
    ja: ぼんやりと輪郭が見えるのみだ
  event_ce006_2_06_s_51:
    speaker: "<Narration>"
    en: The sudden rush of water has resulted in a fast current.
    ko: 갑자기 쏟아져 들어온 물살 때문에 유속이 빠르다.
    ja: 激流が彼女に容赦なく押し寄せる
  event_ce006_2_06_s_52:
    speaker: "<Narration>"
    en: EVE is certain that she'll be swept away if she doesn't grab ahold of something.
    ko: 뭐라도 잡고 있지 않으면 바로 유속에 휘말려 여기저기 부딪힐 것이 확실했다.
    ja: |-
      何かにつかまっていなければ、
      飲み込まれてしまいそうな勢いだ
  event_ce006_2_06_s_53:
    speaker: "<Narration>"
    en: She presses against the wall and focuses.
    ko: 이브는 벽면을 짚은 채, 시선을 집중했다.
    ja: イヴは壁に手をかけ、目を凝らした
  event_ce006_2_06_s_54:
    speaker: "<Narration>"
    en: She finds what she's looking for.
    ko: 찾고 있는 것이 보였다.
    ja: 捜しているものが目に入った
  event_ce006_2_06_s_55:
    speaker: "<Narration>"
    en: Despite the rapid current, it's miraculously remained in the same place as
      before.
    ko: 그것들은 마치 기적처럼, 이 빠른 유속 안에서 한 곳에 자리하고 있었다.
    ja: |-
      それは奇跡のごとく、
      まだ散らばらずにそこにあった
  event_ce006_2_06_s_56:
    speaker: "<Narration>"
    en: Eve pushes off the wall and darts through the water.
    ko: 이브는 벽을 강하게 밀어내며 수면을 가르며 나아갔다.
    ja: |-
      イヴは壁を強く押しだし、
      流れをかき分けて進んだ
  event_ce006_2_06_s_57:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_58:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_59:
    speaker: ce006_03
    en: Why hasn't she come up yet?
    ko: 아, 안 올라오는데요?
    ja: も、戻ってこないよ？
  event_ce006_2_06_s_60:
    speaker: ce006_npc_01
    en: Let's wait a little longer.
    ko: 조금만 더 기다리자.
    ja: もう少しだけ待とう。
  event_ce006_2_06_s_61:
    speaker: ce006_03
    en: Why did she jump in there so suddenly anyway?
    ko: 그, 그런데 갑자기 왜 들어간 걸까요?
    ja: でも、なんでいきなり飛び込んだんだろう？
  event_ce006_2_06_s_62:
    speaker: ce006_npc_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_63:
    speaker: ce006_npc_01
    en: Probably...
    ko: 아마….
    ja: たぶん…
  event_ce006_2_06_s_64:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 첨벙!
    ja: ザバッ！
  event_ce006_2_06_s_65:
    speaker: ce006_01
    en: Whew...
    ko: 후우…! 후우…!
    ja: ふぅ…！はぁ…！
  event_ce006_2_06_s_66:
    speaker: ce006_03
    en: EVE!
    ko: 이브!
    ja: イヴ！
  event_ce006_2_06_s_67:
    speaker: ce006_01
    en: Phew... I think this is... the first time I've been out of breath...!
    ko: 처음으로…! 후우…! 숨이 차네…!
    ja: 息切れは…！ふぅ…！初めて…！
  event_ce006_2_06_s_68:
    speaker: ce006_01
    en: I almost got swept away by the current.
    ko: 유속에 휘말려서 큰일 날 뻔했어.
    ja: 流れが強くて大変だった…
  event_ce006_2_06_s_69:
    speaker: ce006_03
    en: What the heck are you doing?! What'd you do that for?
    ko: |-
      뭐 하는 거예요 대체!
      갑자기 거긴 왜 들어가요!
    ja: |-
      イヴ！
      どうして飛び込んだりしたんですか！？
  event_ce006_2_06_s_70:
    speaker: ce006_01
    en: I had to find something.
    ko: 찾을 게 있었어.
    ja: 忘れ物。
  event_ce006_2_06_s_71:
    speaker: roam
    en: Did you succeed?
    ko: 성공했나?
    ja: 見つかったか？
  event_ce006_2_06_s_72:
    speaker: ce006_01
    en: Yes. I have it here.
    ko: 응. 가져왔어.
    ja: ええ。持ってきた。
  event_ce006_2_06_s_73:
    speaker: "<Monologue>"
    en: As EVE comes out of the lake,
    ko: 이브가 호수에서 나온다.
    ja: イヴが湖から身を乗り出した
  event_ce006_2_06_s_74:
    speaker: "<Monologue>"
    en: she is holding tightly onto several picture frames.
    ko: "…이브의 품 안에, 여럿의 액자가 안겨있었다."
    ja: "…その胸には、大量の写真立てが抱えられていた"
  event_ce006_2_06_s_75:
    speaker: hermin
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_ce006_2_06_s_76:
    speaker: "<Monologue>"
    en: She slowly walks over to Hermin and hands them to him.
    ko: 이브는 천천히 헤르민에게 다가가 액자들을 건네주었다.
    ja: |-
      イヴはゆっくりとヘルミンに近づき、
      写真立てを差し出した
  event_ce006_2_06_s_77:
    speaker: ce006_01
    en: Sorry that they got a bit wet.
    ko: "…미안. 젖는 것까지는 어떻게 할 수가 없었어."
    ja: "…ごめんなさい。濡れてしまった。"
  event_ce006_2_06_s_78:
    speaker: hermin
    en: I... I can't believe it!
    ko: 아아…! 이럴 수가…!
    ja: おお…！なんと…！
  event_ce006_2_06_s_79:
    speaker: hermin
    en: Thank you! Thank you so much!
    ko: 감사합니다…! 정말 감사합니다…!
    ja: |-
      ありがとうございます…！
      本当に、ありがとう…！
  event_ce006_2_06_s_80:
    speaker: ce006_01
    en: That data may contain humanity's past, but these photos are your past.
    ko: |-
      예술 데이터는 인류의 기억이지만,
      이 사진은 당신만의 기억이니까.
    ja: |-
      芸術品のデータは人類の記憶でも、
      この写真はあなただけのものだったから。
  event_ce006_2_06_s_81:
    speaker: ce006_01
    en: I assumed they meant a lot to you.
    ko: 가장 소중한 것일 거라 생각했어.
    ja: きっと一番大事なものだったと思って。
  event_ce006_2_06_s_82:
    speaker: hermin
    en: "... Yes."
    ko: "…예."
    ja: "…はい。"
  event_ce006_2_06_s_83:
    speaker: hermin
    en: These all remind me of precious memories.
    ko: 이것은… 제 가장 소중한… 기억입니다.
    ja: これは…私の、何より大切な…記憶です。
  event_ce006_2_06_s_84:
    speaker: ce006_01
    en: Glad to hear I was correct.
    ko: "…다행이네."
    ja: "…よかった。"
  event_ce006_2_06_s_85:
    speaker: roam
    en: EVE.
    ko: 이브.
    ja: イヴ。
  event_ce006_2_06_s_86:
    speaker: ce006_01
    en: Yes?
    ko: 응?
    ja: 何？
  event_ce006_2_06_s_87:
    speaker: roam
    en: Why do you work so hard?
    ko: 이브는 열심히 한다.
    ja: イヴは頑張っている。
  event_ce006_2_06_s_88:
    speaker: roam
    en: Excessively so,
    ko: 왜 그렇게 열심히 하나?
    ja: なぜそこまで頑張る？
  event_ce006_2_06_s_89:
    speaker: roam
    en: based on my observations.
    ko: 관찰 결과 이브는 지나치게 열심히 한다.
    ja: 観察の結果、イヴは頑張りすぎる。
  event_ce006_2_06_s_90:
    speaker: roam
    en: You risk your life too often.
    ko: 목숨을 자주 건다.
    ja: 簡単に命をかける。
  event_ce006_2_06_s_91:
    speaker: roam
    en: Do you want to die?
    ko: 이브는 죽고 싶은 건가?
    ja: 死にたいのか？
  event_ce006_2_06_s_92:
    speaker: ce006_01
    en: "... No."
    ko: "…아냐."
    ja: "…違う。"
  event_ce006_2_06_s_93:
    speaker: roam
    en: Working hard and putting yourself in danger are two different things.
    ko: 열심히 하는 것, 목숨을 거는 것과는 다르다.
    ja: 頑張ることと、命をかけることは違う。
  event_ce006_2_06_s_94:
    speaker: roam
    en: Why do you put yourself in harm's way so often?
    ko: 그런데 왜 그렇게 목숨을 자주 거나?
    ja: なのに、なぜそこまで命をかける？
  event_ce006_2_06_s_95:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_96:
    speaker: ce006_01
    en: I believe...
    ko: 옳은 일들이라고 믿으니까.
    ja: 正しいことだと信じているから。
  event_ce006_2_06_s_97:
    speaker: ce006_01
    en: it's the right thing to do.
    ko: 목숨을 걸만할 정도로, 옳은 일들이라고 믿으니까.
    ja: そうすることが、命をかけるに値するぐらい。
  event_ce006_2_06_s_98:
    speaker: roam
    en: I don't understand.
    ko: 이해 불가.
    ja: 理解不能。
  event_ce006_2_06_s_99:
    speaker: ce006_03
    en: You and me both.
    ko: 그렇죠? 사실 저도 그래요.
    ja: そうでしょ？あたしもだよ。
  event_ce006_2_06_s_100:
    speaker: ce006_npc_01
    en: Me three.
    ko: 그러게 말이야.
    ja: まったくだな。
  event_ce006_2_06_s_101:
    speaker: ce006_01
    en: I don't put my life at risk as often as you think.
    ko: 그리고 나라고 해서 그렇게 목숨을 자주 걸진 않아.
    ja: それに、言われるほど危ないことはしてない。
  event_ce006_2_06_s_102:
    speaker: ce006_01
    en: I know what I'm capable of, and so I proceed.
    ko: 할만해서 하는 거야.
    ja: できそうだと思ったから、やっただけ。
  event_ce006_2_06_s_103:
    speaker: ce006_npc_01
    en: I may not understand completely, but I have complete faith in you and your
      abilities.
    ko: 어련하실까.
    ja: それも間違いないな。
  event_ce006_2_06_s_104:
    speaker: neon
    en: Uh, I hate to interrupt, but...
    ko: |-
      저, 여러분.
      훈훈한 분위기에 이런 말은 좀 그런데….
    ja: |-
      あの、みなさん。
      いい雰囲気のところ申し訳ないのですが…
  event_ce006_2_06_s_105:
    speaker: neon
    en: Does anyone else feel a vibration?
    ko: 진동 같은 게 느껴지지 않나요?
    ja: 何だか揺れている気がしませんか？
  event_ce006_2_06_s_106:
    speaker: anis
    en: Sure, but isn't that because of all the rushing water?
    ko: 그거야 물이 이렇게 갑자기 들어왔으니까 당연히….
    ja: そりゃ、これだけ水が動いたら、当然…
  event_ce006_2_06_s_107:
    speaker: rapi
    en: No... the ground is shaking.
    ko: "…땅울림인데."
    ja: 地響き…
  event_ce006_2_06_s_108:
    speaker: "<Monologue>"
    en: Rapi quickly moves to higher ground.
    ko: 라피가 빠르게 움직여 높은 지대로 올라갔다.
    ja: ラピが素早く高台へ登った
  event_ce006_2_06_s_109:
    speaker: rapi
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  event_ce006_2_06_s_110:
    speaker: rapi
    en: We have to prepare for battle.
    ko: 전투 준비를 해야 할 것 같습니다.
    ja: 戦闘準備の命令を。
  event_ce006_2_06_s_111:
    speaker: rapi
    en: Large force of Raptures incoming.
    ko: 대량의 랩쳐 부대가 접근 중입니다.
    ja: 大量のラプチャーが接近中です。
  event_ce006_2_06_s_112:
    speaker: rapi
    en: I see more than three Tyrant-class entities.
    ko: |-
      규모가 큽니다.
      타일런트 급 3기 이상으로 추정.
    ja: |-
      大規模の集団…
      タイラント級3機以上と推定。
  event_ce006_2_06_s_113:
    speaker: "<Self>"
    en: Everyone, get ready for battle.
    ko: "…전원. 전투 준비."
    ja: "…全員、戦闘準備だ"
  event_ce006_2_06_s_114:
    speaker: "<Self>"
    en: Privaty, protect Hermin.
    ko: 프리바티는 헤르민을 지켜줘.
    ja: プリバティはヘルミンの護衛を頼む
  event_ce006_2_06_s_115:
    speaker: privaty
    en: Roger.
    ko: 알겠어요.
    ja: 分かりました。
  event_ce006_2_06_s_116:
    speaker: rapi
    en: Our left side is weak! Concentrate fire!
    ko: 왼쪽이 밀리고 있어! 화력 집중!
    ja: 左が押されてる！火力集中！
  event_ce006_2_06_s_117:
    speaker: neon
    en: So is our right side.
    ko: 오른쪽도 밀리는데요?
    ja: 右も押されてますよ？
  event_ce006_2_06_s_118:
    speaker: anis
    en: And the center!
    ko: 중앙도 마찬가지야!
    ja: 正面も同じよ！
  event_ce006_2_06_s_119:
    speaker: neon
    en: Yikes, we're compromised on all sides! We need to raise the level of our firepower!
    ko: |-
      와우! 다 밀리는군요!
      이렇게 된 이상 화력 레벨을 올려서…!
    ja: |-
      わあ！全部押されてますね！
      こうなったら、火力レベルを上げて…！
  event_ce006_2_06_s_120:
    speaker: elegg
    en: Why don't we move our defensive line back a bit?
    ko: 전선을 조금 뒤로 빼는 건 어떤가여?
    ja: 戦線を後退させてはどうですかな？
  event_ce006_2_06_s_121:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_122:
    speaker: rapi
    en: I don't want to destroy this city.
    ko: 이 도시를 부수고 싶지 않아.
    ja: ここにある物を壊させる訳にはいかない。
  event_ce006_2_06_s_123:
    speaker: elegg
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_124:
    speaker: elegg
    en: Well, then we'll just have to dig deep and keep pushing!
    ko: 어쩔 수 없져! 더 열심히 할 수밖에 없겠네여!
    ja: |-
      では、仕方ありませんな！
      もっと頑張るしかありませんぞ！
  event_ce006_2_06_s_125:
    speaker: rapi
    en: We've got to hold the line as best as we can!
    ko: 최대한 못 밀고 들어오게 막…!
    ja: できるだけ押されないように…！
  event_ce006_2_06_s_126:
    speaker: "<Narration>"
    en: "*Shooooo*"
    ko: 슈우우우--!!
    ja: ヒュウゥゥ――！！
  event_ce006_2_06_s_127:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 쿠웅-!!
    ja: ズンッ！！
  event_ce006_2_06_s_128:
    speaker: "<Monologue>"
    en: A massive steel figure lands in front of us, standing between us and the Raptures.
    ko: 거대한 뭔가가 우리 앞을 가로막으며 착지했다.
    ja: 重量のある何かが私たちの前に降り立った
  event_ce006_2_06_s_129:
    speaker: "<Monologue>"
    en: Its back is turned to us,
    ko: 인간의 실루엣을 가진 거대한 강철.
    ja: |-
      人間によく似たシルエットの、
      しかし大きな鋼鉄の塊だ
  event_ce006_2_06_s_130:
    speaker: "<Monologue>"
    en: and the silhouette resembles that of a human.
    ko: |-
      압도적인 존재감을 가진 그것은 우리에게 등을 보인 채,
      랩쳐를 마주 보고 있었다.
    ja: |-
      圧倒的な存在感を放ち、私たちに背を向け
      ラプチャーに向かい合っている
  event_ce006_2_06_s_131:
    speaker: ce006_01
    en: You're here!
    ko: 왔구나…!
    ja: 来た…！
  event_ce006_2_06_s_132:
    speaker: elegg
    en: "*Gasp*!"
    ko: 히, 히이…!
    ja: な、なんと…！
  event_ce006_2_06_s_133:
    speaker: ce006_03_op
    en: Exosuit Providence, reporting for duty!
    ko: 엑소슈트 [프로비던스]! 참전할게요!
    ja: エグゾスーツ「プロビデンス」！参戦します！
  event_ce006_2_06_s_134:
    speaker: elegg
    en: Is that Ms. Lily inside that thing?!
    ko: 리, 릴리 씨? 릴리 씨가 거기 타고 있는 건가여!?
    ja: |-
      リ、リリー氏？
      リリー氏が乗っているのですかな！？
  event_ce006_2_06_s_135:
    speaker: ce006_03_op
    en: That's right! Although I'm not sure how effective this will be against Raptures,
    ko: 예! 랩쳐 상대로 얼마나 잘 먹힐지는 모르겠지만…!
    ja: |-
      はい！ラプチャー相手にどこまで通用するか
      分かりませんけど…！
  event_ce006_2_06_s_136:
    speaker: ce006_03_op
    en: this exosuit isn't exactly a pushover, so I'm not too worried.
    ko: 그래도 어디 가서 맞고 다닐 애는 아니니까, 걱정 마세요!
    ja: それなりに強いので、ご心配なく！
  event_ce006_2_06_s_137:
    speaker: ce006_npc_01
    en: Are you sure we should be using it? That's an incredibly valuable piece of
      equipment.
    ko: 귀한 재산인데, 함부로 막 써도 되나 모르겠네.
    ja: 使っていいのか？かなり貴重な物のはずだが。
  event_ce006_2_06_s_138:
    speaker: ce006_03_op
    en: We owe these guys a huge debt. Surely, this is the least we can do?
    ko: |-
      저희 이분들한테 신세 엄청 졌으니까,
      이 정도는 보답해도 되지 않을까요?
    ja: |-
      たくさんお世話になったでしょ？
      これくらいはお返ししなきゃ！
  event_ce006_2_06_s_139:
    speaker: ce006_npc_01
    en: You can't fool me. You just want to show off.
    ko: 릴리 너. 그냥 자랑하고 싶은 거잖아.
    ja: リリー…さては見せびらかしたいだけだろう。
  event_ce006_2_06_s_140:
    speaker: ce006_03_op
    en: Hehe, guilty as charged.
    ko: 히힛. 그것도 맞아요.
    ja: えへっ。それも正解！
  event_ce006_2_06_s_141:
    speaker: ce006_npc_01
    en: "... Fine."
    ko: "…뭐 좋아."
    ja: "…まあ、いい。"
  event_ce006_2_06_s_142:
    speaker: ce006_npc_01
    en: Let's show them.
    ko: 한번 보여주자고.
    ja: 存分に見せつけてやれ。
  event_ce006_2_06_s_143:
    speaker: elegg
    en: Get out of there! Hurry!
    ko: 내, 내려여! 당장 내려여!
    ja: か、代わって下され！今すぐ！
  event_ce006_2_06_s_144:
    speaker: ce006_03_op
    en: What? Why?
    ko: 예? 왜, 왜요?
    ja: え？な、なんでですか？
  event_ce006_2_06_s_145:
    speaker: elegg
    en: I'll pilot it! I'll hold off the Raptures!
    ko: 제가! 제가 탈게여! 제가 타서! 타서 막! 랩쳐를 막!
    ja: |-
      ここは！ここは私が！
      私が操縦して！ラプチャーをドカーンと！
  event_ce006_2_06_s_146:
    speaker: neon
    en: No! It makes more sense for me to do it!
    ko: 아, 아뇨! 제가! 제가 타는 게 맞는 것 같은데요!
    ja: い、いいえ！私です！私が乗るべきです！
  event_ce006_2_06_s_147:
    speaker: "<Self>"
    en: Everyone, stop bickering! I'm clearly the one who should be piloting it.
    ko: 다들 그만해! 내가 탈 거야!
    ja: みんなよせ！私が乗る！
  event_ce006_2_06_s_148:
    speaker: ce006_03_op
    en: "... Sorry, but I'm not going anywhere."
    ko: "…제가 탈 건데요."
    ja: "…言っとくけど、代わりません。"
  event_ce006_2_06_s_149:
    speaker: ce006_03_op
    en: Now let's go!
    ko: 아무튼, 갑니다!
    ja: とにかく…行きます！
  event_ce006_2_06_s_150:
    speaker: rapi
    en: Everyone! Cover Lily!
    ko: 전원! 릴리를 엄호!
    ja: 全員！リリーの援護を！
  event_ce006_2_06_s_151:
    speaker: anis
    en: Roger! With a giant war machine like this on our side, how can we possibly
      lose?
    ko: 좋아! 거대 병기가 우리 편이면 지는 게 힘들지!
    ja: |-
      よーし！頼もしそうなメカが
      こっちの味方だし、負ける気がしないわ！
  event_ce006_2_06_s_152:
    speaker: ce006_03_op
    en: Hyyyyaaah!
    ko: 이야아아압-!!
    ja: おりゃあああーっ！！
  event_ce006_2_06_s_153:
    speaker: "<Monologue>"
    en: Providence deftly moves both on land and in the air, unleashing a merciless
      fusillade of various armaments.
    ko: "…압도적이다."
    ja: "…すさまじい迫力だ"
  event_ce006_2_06_s_154:
    speaker: "<Monologue>"
    en: A ceaseless barrage of explosions rings out, sending flames, light beams,
      and sparks flying every which way.
    ko: |-
      프로비던스는 지상과 공중을 자유자재로 이동하며,
      온갖 무장들을 퍼붓는다.
    ja: |-
      プロビデンスは大地と空を自由自在に駆け、
      様々な攻撃を繰り出している
  event_ce006_2_06_s_155:
    speaker: "<Monologue>"
    en: It's an incredible sight to behold.
    ko: 폭발과 화염, 광선과 스파크가 끊이지 않는다.
    ja: |-
      爆発や炎が絶え間なく拡がり
      光が走り、電撃が飛ぶ
  event_ce006_2_06_s_156:
    speaker: "<Monologue>"
    en: And yet...
    ko: 하지만 어째서인지….
    ja: しかし、どういうわけか…
  event_ce006_2_06_s_157:
    speaker: neon
    en: Uh... it really does look spectacular, but none of its shots seem to be landing.
    ko: "…저기, 보기에는 엄청 화려한데 전혀 맞추지를 못 하시는데요?"
    ja: |-
      …あの、見た目はとても派手ですけど…
      全然当たってないのでは？
  event_ce006_2_06_s_158:
    speaker: elegg
    en: The accuracy does leave something to be desired...
    ko: "…그러게여. 명중률이 너무…."
    ja: "…そうですな。命中率の方があまりにも…"
  event_ce006_2_06_s_159:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 꽈앙-!
    ja: ドカン！
  event_ce006_2_06_s_160:
    speaker: "<Monologue>"
    en: A Rapture files a missile and scores a direct hit on Providence.
    ko: 랩쳐의 미사일이 프로비던스에 명중한다.
    ja: ラプチャーのミサイルがプロビデンスに命中した
  event_ce006_2_06_s_161:
    speaker: ce006_03_op
    en: Ungh!
    ko: 아윽!
    ja: うわっ！
  event_ce006_2_06_s_162:
    speaker: neon
    en: Same goes for its ability to evade.
    ko: 회피율도 좀….
    ja: 回避率もちょっと…
  event_ce006_2_06_s_163:
    speaker: elegg
    en: Yeah...
    ko: 그러게여….
    ja: ですな…
  event_ce006_2_06_s_164:
    speaker: ce006_01
    en: Lily...
    ko: 릴리….
    ja: リリー…
  event_ce006_2_06_s_165:
    speaker: ce006_03_op
    en: J-just give me a second! I'm not used to this type of enemy is all!
    ko: 자, 잠깐만요! 그게, 적 타입이 달라서 그래요!
    ja: |-
      ま、待ってください！
      その、敵のタイプが違うので！
  event_ce006_2_06_s_166:
    speaker: ce006_03_op
    en: I've got it configured to combat Naytiba, that's why!
    ko: |-
      세, 세팅을 네이티브용으로 해놨었거든요!
      그래서 그래요!
    ja: |-
      設定がネイティブ用なので！
      だからです！
  event_ce006_2_06_s_167:
    speaker: ce006_03_op
    en: Er... let's see... what if I do this?
    ko: 어, 어디 보자… 이걸… 이렇게…!
    ja: え、えっと…これを…こうして…！
  event_ce006_2_06_s_168:
    speaker: ce006_03_op
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_169:
    speaker: ce006_03_op
    en: All right, I've set the target to Rap...
    ko: 좋아요! 대상을 랩쳐로 설정 해놨…!
    ja: できた！攻撃対象をラプチャーに設定――！
  event_ce006_2_06_s_170:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 꽈앙-!
    ja: ドカン！
  event_ce006_2_06_s_171:
    speaker: ce006_03_op
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_ce006_2_06_s_172:
    speaker: "<Monologue>"
    en: Another missile strikes Providence.
    ko: 랩쳐의 미사일이 다시 한번 프로비던스를 두드린다.
    ja: ラプチャーのミサイルがさらに追い打ちをかけた
  event_ce006_2_06_s_173:
    speaker: ce006_01
    en: Lily! Are you okay?
    ko: 릴리. 괜찮아?
    ja: リリー、大丈夫？
  event_ce006_2_06_s_174:
    speaker: ce006_03_op
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_s_175:
    speaker: ce006_npc_01
    en: I think she passed out.
    ko: "…기절한 모양인데."
    ja: "…気絶したようだな。"
  event_ce006_2_06_s_176:
    speaker: ce006_01
    en: That's it, I'm going in!
    ko: 이런! 내가 갈게!
    ja: そんな…！ここは私が…！
  event_ce006_2_06_s_177:
    speaker: ce006_npc_01
    en: Hold on.
    ko: 아니. 괜찮아.
    ja: いや。心配するな。
  event_ce006_2_06_s_178:
    speaker: ce006_npc_01
    en: We've got this in the bag.
    ko: 이겼어.
    ja: これで勝ちだ。
  event_ce006_2_06_s_179:
    speaker: ce006_01
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_2_06_s_180:
    speaker: "<Monologue>"
    en: Providence starts moving again.
    ko: 프로비던스가 움직인다.
    ja: プロビデンスが動きだした
  event_ce006_2_06_s_181:
    speaker: "<Monologue>"
    en: This time, it moves with utter precision as it unleashes an overwhelming barrage
      of firepower.
    ko: |-
      좀 전과는 비교도 되지 않는 움직임으로,
      압도적인 화력을 뿜어낸다.
    ja: |-
      先ほどとは比べものにならない正確さで、
      圧倒的な火力を敵に向けている
  event_ce006_2_06_s_182:
    speaker: "<Monologue>"
    en: The only word to describe it is utter decimation.
    ko: 말 그대로 유린에 가깝다.
    ja: 言葉通り、敵を蹴散らすようだった
  event_ce006_2_06_s_183:
    speaker: "<Monologue>"
    en: The battlefield becomes clear in an instant.
    ko: 전장은 삽시간에 정리되기 시작했다.
    ja: 戦場はあっという間に静かになった
  event_ce006_2_06_s_184:
    speaker: ce006_01
    en: "... Amazing."
    ko: "…굉장해."
    ja: "…すごい。"
  event_ce006_2_06_s_185:
    speaker: ce006_npc_01
    en: When the attack target is set to Rapture, and the pilot is incapacitated,
      the automatic combat system is activated.
    ko: |-
      공격 대상을 랩쳐로 설정해 놓은 상태에서,
      파일럿이 조종 불가 상태가 되어 자동 전투 기능이 활성화된 거야.
    ja: |-
      攻撃対象を設定していたなら、
      パイロットが操縦できなくなれば、
      自動戦闘機能が起動する。
  event_ce006_2_06_s_186:
    speaker: ce006_npc_01
    en: So long as it's being operated properly, that program can handle this kind
      of opponent with ease.
    ko: 제대로 움직이면, 저 정도는 가뿐하지.
    ja: まともに動きさえすれば、あれくらいは簡単さ。
  event_ce006_2_06_s_187:
    speaker: rapi
    en: "... But Lily has no idea how to operate it."
    ko: 그럼 릴리는….
    ja: とすると、リリーは…
  event_ce006_2_06_s_188:
    speaker: ce006_npc_01
    en: "..."
    ko: "…음."
    ja: "…えー…"
  event_ce006_2_06_s_189:
    speaker: ce006_npc_01
    en: Well, she at least knows how to turn it on or off.
    ko: 뭐, 전원을 켜고 끄는 건 할 수 있으니까.
    ja: |-
      まあ、電源を入れたり切ったりするのが
      仕事だな。
  event_ce006_2_06_s_190:
    speaker: elegg
    en: Mmm, turning something on or off is important.
    ko: 온 오프는 중요하져.
    ja: それはそれで重要ですな。
  event_ce006_2_06_s_191:
    speaker: "<Monologue>"
    en: Providence stands tall amidst the defeated Rapture horde,
    ko: 프로비던스가 전멸한 랩쳐 사이에 우뚝 서 있다.
    ja: |-
      一掃されたラプチャーの残骸を足下に
      プロビデンスが立っている
  event_ce006_2_06_s_192:
    speaker: "<Monologue>"
    en: scanning the surroundings for any survivors.
    ko: 주위를 둘러본다. 아마 남은 적기를 탐색하는 것 같다.
    ja: |-
      周囲を確認しているようだ。
      おそらく残った敵機がいないか
      探しているのだろう
  event_ce006_2_06_s_193:
    speaker: "<Monologue>"
    en: After finishing its scan, it turns and faces us.
    ko: 탐색이 끝난 듯, 뒤를 돌아 우리 쪽을 바라본다.
    ja: |-
      それが終わったらしく、
      プロビデンスがこちらを振り返った
  event_ce006_2_06_s_194:
    speaker: elegg
    en: Whoa, so cool!
    ko: 히야~ 멋있네여. 프로비던스 씨.
    ja: おほ～…シビれますなぁ、プロビデンス殿。
  event_ce006_2_06_s_195:
    speaker: neon
    en: Let's go and ask if we can take a ride in it!
    ko: 한 번 태워달라고 떼써볼까요?
    ja: |-
      どうにか乗せてもらえないか
      お願いしてみませんか？
  event_ce006_2_06_s_196:
    speaker: elegg
    en: For sure!
    ko: 물론, 당연히, 응당 그래야져.
    ja: むろん当然、聞かない手はありませんな。
  event_ce006_2_06_s_197:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컹.
    ja: ガチャリ――
  event_ce006_2_06_s_198:
    speaker: "<Monologue>"
    en: Providence pushes its weapon forward.
    ko: 프로비던스가 총구를 내민다.
    ja: プロビデンスの銃口がこちらを向いた
  event_ce006_2_06_s_199:
    speaker: "<Self>"
    en: Is that a victory pose?
    ko: 오. 승리 퍼포먼스인가?
    ja: 決めポーズか？
  event_ce006_2_06_s_200:
    speaker: elegg
    en: Wow! Whoever designed this really knows their stuff!
    ko: 이야~ 이런 기능까지 있다니 만드신 분이 뭘 좀 아는…!
    ja: |-
      いやはや、そんな機能まで完備とは、
      設計した方は分かって――！
  event_ce006_2_06_s_201:
    speaker: "<Narration>"
    en: "*Kreeeee*!"
    ko: 키이이잉--!!
    ja: ギュイィン…！！
  event_ce006_2_06_s_202:
    speaker: elegg
    en: Is that just me, or does that sound like a weapon charging?
    ko: "…무기 가동음이 들리는 것 같은뎨, 착각이겠져?"
    ja: |-
      …武器の稼働音が聞こえるようですが、
      気のせいですかな？
  event_ce006_2_06_s_203:
    speaker: rapi
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_ce006_2_06_s_204:
    speaker: rapi
    en: Everyone, prepare for battle!
    ko: 전원! 전투 준비!
    ja: 全員！戦闘態勢！
  event_ce006_2_06_s_205:
    speaker: ce006_01
    en: How did...?!
    ko: 이게 대체…!
    ja: これはいったい…！？
event_ce006_2_06_e:
  event_ce006_2_06_e_1:
    speaker: anis
    en: This thing just won't quit!
    ko: 얘, 얘 안 멈추는데!?
    ja: と、止まらないわよ！？
  event_ce006_2_06_e_2:
    speaker: neon
    en: If anything, it's only getting faster!
    ko: 거기다 점점 빨라지고 있어요!
    ja: むしろどんどん加速してます！
  event_ce006_2_06_e_3:
    speaker: ce006_npc_01
    en: There must be an issue with the combat settings! It has to be shut down manually
      by the pilot!
    ko: |-
      전투 설정에 문제가 생긴 모양이야!
      탑승자가 강제로 끌 수밖에 없어!
    ja: |-
      戦闘設定に問題が起きたんだ！
      搭乗者が強制停止するしかない！
  event_ce006_2_06_e_4:
    speaker: elegg
    en: But Lily is unconscious!
    ko: 그런데 릴리 씨 기절해 있잖아여!
    ja: ですが、リリー氏は気絶しておりますな！？
  event_ce006_2_06_e_5:
    speaker: ce006_03_op
    en: Urgh...
    ko: 으… 으음…!
    ja: う…んん…！
  event_ce006_2_06_e_6:
    speaker: ce006_03_op
    en: Ugh... My head...
    ko: 으… 머리 아파….
    ja: うぅ…頭が…
  event_ce006_2_06_e_7:
    speaker: ce006_03_op
    en: "??"
    ko: "??"
    ja: "？？"
  event_ce006_2_06_e_8:
    speaker: ce006_03_op
    en: What the... What are you guys doing?! Why are you attacking Providence?!
    ko: |-
      자, 잠깐! 여러분! 지금 뭐 하시는 건가요?
      왜 프로비던스를 공격하는 건데요!
    ja: |-
      え、ええっ？みなさん！何してるんですか？
      なんでプロビデンスに攻撃を！？
  event_ce006_2_06_e_9:
    speaker: ce006_npc_01
    en: It's the other way around!
    ko: 반대야.
    ja: 逆だ！
  event_ce006_2_06_e_10:
    speaker: ce006_03_op
    en: Huh?
    ko: "…예?"
    ja: "…はい？"
  event_ce006_2_06_e_11:
    speaker: ce006_03_op
    en: Wait... why is this...?!
    ko: 어? 어어? 이게 왜…!
    ja: え？あれ？どうして…！
  event_ce006_2_06_e_12:
    speaker: ce006_03_op
    en: Gah! H-hold on, I'll take care of it!
    ko: 자, 잠깐만요! 금방 해결할게요!
    ja: ま、待ってください！すぐに対処します！
  event_ce006_2_06_e_13:
    speaker: ce006_03_op
    en: Why is it doing this?!
    ko: 으, 으아아 얘가 왜 갑자기…!
    ja: う、うわわ！どうしちゃったんだろう…！
  event_ce006_2_06_e_14:
    speaker: "<Narration>"
    en: "*Kuuuuu*"
    ko: 쿠우우우---
    ja: シューン――
  event_ce006_2_06_e_15:
    speaker: "<Monologue>"
    en: Finally, Providence stops moving, accompanied by the sound of the system shutting
      down.
    ko: 전원이 셧다운 되는 소리와 함께 프로비던스의 움직임이 멈췄다.
    ja: |-
      エネルギーのシャットダウンする音とともに、
      プロビデンスが動きを止めた
  event_ce006_2_06_e_16:
    speaker: ce006_03
    en: Whew...
    ko: 후우…!
    ja: ふぅ…！
  event_ce006_2_06_e_17:
    speaker: ce006_03
    en: That was close.
    ko: 크, 큰일 날 뻔했다.
    ja: ああ、びっくりしたぁ。
  event_ce006_2_06_e_18:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_19:
    speaker: ce006_03
    en: I don't get it. I set Raptures as the target. What happened?
    ko: 그런데 이상하네. 랩쳐를 대상으로 지정해 놨는데 왜….
    ja: |-
      でも、ヘンだなぁ。
      確かにラプチャーを対象に設定したのに…
  event_ce006_2_06_e_20:
    speaker: ce006_03
    en: I didn't input any other settings. It's only supposed to check for the energy
      source's wavelength...
    ko: |-
      다른 세팅도 안 해놨고….
      동력원 고유 파장만 체크하게끔….
    ja: |-
      他の設定もしてないし…
      動力源の固有の波長だけをチェックして…
  event_ce006_2_06_e_21:
    speaker: ce006_npc_01_op
    en: What are you doing? Hurry up and come out.
    ko: 뭐 해? 빨리 나와.
    ja: 何をしてるんだ？早く出てこい。
  event_ce006_2_06_e_22:
    speaker: ce006_03
    en: Oh, right. I'll be right out.
    ko: 아, 예. 지금 나갈게요.
    ja: あ、うん。今行くね。
  event_ce006_2_06_e_23:
    speaker: ce006_03
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_24:
    speaker: ce006_03
    en: Oh well. I must have made a mistake somewhere.
    ko: 에이. 내가 뭐 실수했나 보지 뭐.
    ja: ま、あたしのうっかりミスかな？
  event_ce006_2_06_e_25:
    speaker: ce006_03
    en: I'm just glad no one got hurt. That was too close for comfort.
    ko: |-
      아~ 다행이다. 다친 사람 없어서.
      큰일 날 뻔했네 진짜.
    ja: |-
      あ～よかった、誰もケガしてなくて。
      大ごとになるところだったよ。
  event_ce006_2_06_e_26:
    speaker: rapi
    en: Well... now that we've resolved that minor hiccup,
    ko: "…사소한 트러블이 있었지만 이제 모두 해결되었습니다."
    ja: |-
      …少々のトラブルはありましたが、
      すべて解決しました。
  event_ce006_2_06_e_27:
    speaker: rapi
    en: let's head back to the Ark.
    ko: 방주로 복귀하시죠.
    ja: アークに帰還しましょう。
  event_ce006_2_06_e_28:
    speaker: "<Self>"
    en: Yeah, let's go.
    ko: 응. 돌아가자.
    ja: ああ、そうだな
  event_ce006_2_06_e_29:
    speaker: ce006_npc_01
    en: The Tetrapod is ready. We can leave right away.
    ko: |-
      테트라포드는 준비되어 있어.
      바로 출발하면 돼.
    ja: |-
      テトラポッドの準備はできてる。
      すぐに出発できるぞ。
  event_ce006_2_06_e_30:
    speaker: privaty
    en: Let's hurry.
    ko: 서두르죠.
    ja: 急ぎましょう。
  event_ce006_2_06_e_31:
    speaker: "<Narration>"
    en: Inside the Tetrapod.
    ko: 테트라포드 내부.
    ja: テトラポッド内部
  event_ce006_2_06_e_32:
    speaker: elegg
    en: Wow, this thing really can fly!
    ko: 히야~ 진짜 날아다니는군여!
    ja: ひょえ～…本当に飛べるんですな！
  event_ce006_2_06_e_33:
    speaker: elegg
    en: Can't you at least draw me some blueprints? I really want it.
    ko: |-
      아~ 이거 도면이라도 좀 그려주면 안 될까여….
      너무 탐나는데여.
    ja: |-
      う～…なんとかして構造図だけでも
      描いていただけませんかな…
      ゆずってくれ、たのむですぞ～
  event_ce006_2_06_e_34:
    speaker: ce006_03
    en: I tried to pull up the blueprints several times, but they kept coming out
      garbled and incomprehensible. I think it's time we throw in the towel.
    ko: |-
      여러 번 해봤는데 안 됐잖아요.
      이제 그만 미련을 버려요.
    ja: |-
      何度も試したけどダメだったでしょう？
      もう未練は捨ててください。
  event_ce006_2_06_e_35:
    speaker: elegg
    en: Aw man... I can't stop thinking about it.
    ko: 히잉… 미련이 마구마구 솟아나는데 어떡하나여….
    ja: むーん…諦めきれませんぞ…
  event_ce006_2_06_e_36:
    speaker: ce006_03
    en: Trust me, me neither.
    ko: 그건… 저도 그래요.
    ja: 気持ちは…私も分かるんですけどね。
  event_ce006_2_06_e_37:
    speaker: ce006_01
    en: Adam. How much time until we arrive at our destination?
    ko: 아담. 목적지까지 남은 시간은?
    ja: アダム。目的地までの残り時間は？
  event_ce006_2_06_e_38:
    speaker: ce006_npc_01
    en: At our current speed, 10 minutes.
    ko: 이대로 가면 10분 이내로 도착해.
    ja: このまま行けば、10分以内に到着だ。
  event_ce006_2_06_e_39:
    speaker: ce006_npc_01
    en: We don't have to worry about anyone from the Ark intercepting us, do we?
    ko: "…방주에 요격당하는 건 아니겠지?"
    ja: "…アークに迎撃されたりはしないな？"
  event_ce006_2_06_e_40:
    speaker: privaty
    en: That won't happen. I've already contacted them.
    ko: |-
      그건 걱정 마세요.
      방주에는 미리 연락을 해놨어요.
    ja: |-
      その心配はありません。
      事前に連絡を入れてあります。
  event_ce006_2_06_e_41:
    speaker: privaty
    en: I also told them the Commander is seriously injured, and to have a medical
      team on standby when we arrive.
    ko: 그으리고, 지휘관이 크게 부상을 당했으니 의료팀도 대기해 달라고 부탁해 놨고요.
    ja: |-
      それから…指揮官の負傷に対応するため
      医療チームを待機させるよう
      依頼してあります。
  event_ce006_2_06_e_42:
    speaker: "<Self>"
    en: What? But I'm fine.
    ko: 나? 나 멀쩡한데?
    ja: 私か？治療の必要はないが
  event_ce006_2_06_e_43:
    speaker: privaty
    en: "..."
    ko: 그게….
    ja: そうではなく…
  event_ce006_2_06_e_44:
    speaker: rapi
    en: If we told them we had Hermin in tow, medical treatment wouldn't be a priority
      for them.
    ko: "…헤르민을 데려가는 게 들통나면 치료는 뒷전이 될 게 뻔하니까요."
    ja: |-
      …治療が必要なのは彼の方だと知られれば、
      治療開始を遅らせようとしてくるでしょう。
  event_ce006_2_06_e_45:
    speaker: rapi
    en: However, if a medical team is already on standby when we arrive, we can at
      least try and push for them to treat him.
    ko: |-
      인간용 의료팀이 대기하고 있다면,
      일단 밀어붙일 수는 있습니다.
    ja: |-
      それでも対人間の医療チームが
      その場に待機してさえいれば、
      押し通す方法はあるということです。
  event_ce006_2_06_e_46:
    speaker: anis
    en: Wow, you really are trying to become unemployed, aren't you?
    ko: 이야. 프리바티 너 백수 되고 싶구나?
    ja: プリバティ、本気で無職になりたいみたいね？
  event_ce006_2_06_e_47:
    speaker: privaty
    en: Well, if that happens, why don't the Counters take me in?
    ko: 뭐, 그렇게 되면 카운터스에서 받아줘요.
    ja: |-
      もしそうなったら、
      カウンターズに再就職させてもらいます。
  event_ce006_2_06_e_48:
    speaker: anis
    en: I'm not sure a government desk jockey would be able to hack it with us.
    ko: 아 공무원 출신이 우리 열악한 환경을 버틸 수 있을까 몰라.
    ja: |-
      天下り先が私たちのブラックな職場なんて、
      耐えられるかしら。
  event_ce006_2_06_e_49:
    speaker: privaty
    en: Hmph.
    ko: 흥.
    ja: ふんっ。
  event_ce006_2_06_e_50:
    speaker: roam
    en: This is my first time going to the Ark.
    ko: 롬 방주에 가는 것 처음.
    ja: ロム、アークに行くのは初めて。
  event_ce006_2_06_e_51:
    speaker: "<Self>"
    en: We'll show you around once we're there.
    ko: |-
      그렇겠네.
      가면 우리가 잔뜩 구경시켜 줄게.
    ja: |-
      そうだな。
      好きなだけ見学するといい
  event_ce006_2_06_e_52:
    speaker: roam
    en: I'm excited.
    ko: 기대된다.
    ja: 楽しみ。
  event_ce006_2_06_e_53:
    speaker: hermin
    en: The Ark...
    ko: 방주….
    ja: アーク…
  event_ce006_2_06_e_54:
    speaker: privaty
    en: Hermin, things might be chaotic when we first arrive.
    ko: "…헤르민님. 방주에 도착하면 잠시동안 소란스러울 수 있어요."
    ja: |-
      …ヘルミンさん。アークに到着後は、
      しばらくあわただしくなるかもしれません。
  event_ce006_2_06_e_55:
    speaker: privaty
    en: But it won't be permanent. Don't stress too much about it.
    ko: 하지만 잠시 뿐일 테니, 너무 스트레스받지 말아 주세요.
    ja: |-
      しかし、一時のことですから、
      あまり負担に思わないでください。
  event_ce006_2_06_e_56:
    speaker: hermin
    en: Okay.
    ko: 알겠습니다.
    ja: 覚えておきます。
  event_ce006_2_06_e_57:
    speaker: hermin
    en: I'm grateful that I'm here in the first place.
    ko: 가는 것만 해도 감지덕지군요.
    ja: ここにいられるだけで、心から感謝しています。
  event_ce006_2_06_e_58:
    speaker: hermin
    en: Honestly, just knowing that all the data in the bunker was preserved is enough
      for me. I could die happy now.
    ko: |-
      사실 벙커의 데이터가 모두 보존되었다는 것만으로도
      지금 죽어도 여한이 없습니다.
    ja: |-
      シェルターのデータを
      すべて保護していただけるのですから…
      正直、もう思い残すことはありません。
  event_ce006_2_06_e_59:
    speaker: privaty
    en: Don't kid around about that. It doesn't come off like you're joking.
    ko: "…농담으로라도 그런 말 하지 마세요. 농담 아닌 것 같아서 겁나니까."
    ja: |-
      …冗談でもやめてください。
      冗談に聞こえませんので。
  event_ce006_2_06_e_60:
    speaker: hermin
    en: Oh, sorry. I'll be more careful with my words.
    ko: 아… 주의하겠습니다.
    ja: ああ…これは失礼。
  event_ce006_2_06_e_61:
    speaker: ce006_npc_01
    en: Uh oh.
    ko: "…이거 안 좋은데."
    ja: "…これは…まずいな。"
  event_ce006_2_06_e_62:
    speaker: ce006_npc_01
    en: We've got company.
    ko: 놈들이 따라붙었어.
    ja: ヤツらが来てる。
  event_ce006_2_06_e_63:
    speaker: ce006_01
    en: Raptures?
    ko: "…랩쳐가?"
    ja: "…ラプチャーが？"
  event_ce006_2_06_e_64:
    speaker: ce006_npc_01
    en: A whole bunch of 'em, closing in on us fast.
    ko: 많아. 속도도 빠르고. 곧 따라 잡히겠어.
    ja: |-
      速いうえに大群だ。
      すぐに追いつかれるぞ。
  event_ce006_2_06_e_65:
    speaker: ce006_01
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_66:
    speaker: elegg
    en: That's okay. I'm sure you've got some kind of ultimate weapon in this ship.
    ko: 괜찮아여! 테트라포드에 결전 병기 같은 거 있을 테니까여!
    ja: |-
      問題ありませんな！このテトラポッドなら
      決戦兵器ぐらい装備しているはず！
  event_ce006_2_06_e_67:
    speaker: ce006_npc_01
    en: I wouldn't call it an ultimate weapon, but we do have some armaments.
    ko: 결전 병기까진 아니더라도 무기는 있지.
    ja: 決戦兵器とまではいかないが、武器はある。
  event_ce006_2_06_e_68:
    speaker: elegg
    en: Really?! Then let's fire away!
    ko: 헉! 진짜여!? 어, 얼른 쏘져!
    ja: |-
      なんと！本当ですかな！？
      さ、さっそく使ってくだされ！
  event_ce006_2_06_e_69:
    speaker: ce006_npc_01
    en: It won't be enough to wipe them all out.
    ko: 저 녀석들을 한 번에 쓸어버릴 정도는 아니라서 말이야.
    ja: |-
      残念だが、コレをまとめて片づけられるほどの
      威力はないな。
  event_ce006_2_06_e_70:
    speaker: ce006_npc_01
    en: Damn, this isn't good.
    ko: 흐음… 이건 안 좋은데.
    ja: となると…問題は…
  event_ce006_2_06_e_71:
    speaker: "<Monologue>"
    en: Adam stares at Hermin intently.
    ko: 아담은 헤르민을 빤히 쳐다봤다.
    ja: アダムの視線がヘルミンに向いた
  event_ce006_2_06_e_72:
    speaker: ce006_npc_01
    en: Rapi. How long will it take to get to the Ark on foot from here?
    ko: 라피. 도보로 간다면 방주까지 얼마나 걸리지?
    ja: |-
      ラピ、ここからアークまで、
      徒歩ならどれぐらいかかる？
  event_ce006_2_06_e_73:
    speaker: rapi
    en: "... About 2 hours."
    ko: "…2시간 이내에 도착해."
    ja: "…2時間以内。"
  event_ce006_2_06_e_74:
    speaker: ce006_npc_01
    en: Good.
    ko: 좋네.
    ja: よし。
  event_ce006_2_06_e_75:
    speaker: ce006_01
    en: Adam...
    ko: 아담….
    ja: アダム…
  event_ce006_2_06_e_76:
    speaker: ce006_03
    en: 'Let me guess:'
    ko: 어… 분위기가 그런 분위기인데요?
    ja: えっと…これってそういう雰囲気ですか？
  event_ce006_2_06_e_77:
    speaker: ce006_03
    en: We stay here and hold them off while our friends go on ahead?
    ko: 우리가 막을 테니까 먼저 가. 이런 거.
    ja: |-
      あたしたちが食い止めるから、先に行け！
      みたいな？
  event_ce006_2_06_e_78:
    speaker: ce006_npc_01
    en: Bingo.
    ko: 정답이야.
    ja: アタリだ。
  event_ce006_2_06_e_79:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_80:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_81:
    speaker: ce006_npc_01
    en: Don't feel bad, you guys.
    ko: 방주의 친구들. 미안해할 필요 없어.
    ja: そういうことだ、気にしないでくれ。
  event_ce006_2_06_e_82:
    speaker: ce006_npc_01
    en: A certain someone I know would have insisted we stay behind anyway. I'm just
      beating her to the punch.
    ko: |-
      여기 있는 누군가가 그렇게 하자고 우겼을 테니까.
      사실상 우리한텐 선택지가 없지.
    ja: |-
      俺が言わなくても誰かさんが言い出しただろう。
      最初から選択肢なんてないようなもんだ。
  event_ce006_2_06_e_83:
    speaker: ce006_03
    en: That's true.
    ko: 그건 맞아요.
    ja: その通りですね。
  event_ce006_2_06_e_84:
    speaker: ce006_01
    en: "... Hehe."
    ko: "…후후."
    ja: "…ふふ。"
  event_ce006_2_06_e_85:
    speaker: ce006_npc_01
    en: Landing.
    ko: 착륙한다.
    ja: 着陸するぞ。
  event_ce006_2_06_e_86:
    speaker: ce006_npc_01
    en: Get going. Leave the rest to us.
    ko: 바로 뛰어가. 뒤는 우리한테 맡기고.
    ja: 降りたらすぐ走れ。あとは俺たちに任せろ。
  event_ce006_2_06_e_87:
    speaker: rapi
    en: "... Thank you."
    ko: "…고마워. 부탁할게."
    ja: "…ありがとう。後は頼んだわ。"
  event_ce006_2_06_e_88:
    speaker: "<Self>"
    en: We'll come back for you the first chance we get.
    ko: 바로 찾으러 올게.
    ja: すぐに戻ってくる
  event_ce006_2_06_e_89:
    speaker: ce006_npc_01
    en: Sounds good. We'll be waiting.
    ko: 좋아. 기다릴게.
    ja: ああ、待ってる。
  event_ce006_2_06_e_90:
    speaker: "<Narration>"
    en: Ark. Elevator Hub.
    ko: 방주. 엘리베이터 허브.
    ja: アーク・エレベーターハブ
  event_ce006_2_06_e_91:
    speaker: "<Monologue>"
    en: The elevator door opens,
    ko: 엘리베이터의 문이 열린다.
    ja: エレベーターの扉が開いた
  event_ce006_2_06_e_92:
    speaker: "<Monologue>"
    en: revealing a small crowd of people.
    ko: 눈앞에 많은 이들이 보인다.
    ja: 扉の向こうには多くの人々が待ち受けていた
  event_ce006_2_06_e_93:
    speaker: "<Monologue>"
    en: Several humans in military uniforms, and a medical team stand before us.
    ko: 의료팀과 군복을 입은 인간들 수 명.
    ja: 医療従事者の制服と、軍服が目に入る
  event_ce006_2_06_e_94:
    speaker: "<Monologue>"
    en: An initial look of shock registers in the eyes of those in uniform, which
      then quickly turns into anger.
    ko: |-
      군복을 입은 이들의 눈에 경악이 떠올랐고,
      이후 분노로 가득한 표정으로 바뀌었다.
    ja: |-
      軍人たちは驚きの表情を浮かべていたが、
      すぐにその表情は怒りに変わった
  event_ce006_2_06_e_95:
    speaker: "<Monologue>"
    en: Privaty steps forward assertively.
    ko: 프리바티가 앞으로, 강하게 한걸음 내디뎠다.
    ja: プリバティが力強く前に踏み出した
  event_ce006_2_06_e_96:
    speaker: privaty
    en: I am Privaty of the Triangle Squad!
    ko: 트라이앵글 스쿼드의 프리바티입니다!
    ja: トライアングル所属のプリバティです！
  event_ce006_2_06_e_97:
    speaker: privaty
    en: Move this civilian to the medical facility immediately!
    ko: 지금 당장 이 민간인을 의료 시설로 옮기세요!
    ja: |-
      ただちにこの民間人を
      医療施設に移送してください！
  event_ce006_2_06_e_98:
    speaker: privaty
    en: His physical condition is significantly weakened. I want you to use every
      means available to you to ensure his recovery.
    ko: 쇠약해져 있는 상태이므로 할 수 있는 모든 수단을 동원해 회복시켜요!
    ja: |-
      ひどく衰弱しています、
      必要な処置はすべて行って回復を！
  event_ce006_2_06_e_99:
    speaker: "<Monologue>"
    en: One of the military men motions as if to start speaking, a fierce expression
      on his face.
    ko: 군복 차림의 남자가 험악한 표정으로 뭔가를 말하려 한다.
    ja: |-
      軍服の一人が殺気立った形相で、
      何かを言い出しかけた
  event_ce006_2_06_e_100:
    speaker: privaty
    en: I will not tolerate any insubordination!
    ko: 질문 및 반박은 받지 않습니다!
    ja: 質問に答えている時間はありません！
  event_ce006_2_06_e_101:
    speaker: privaty
    en: Furthermore,
    ko: 또한! 이에 따른 모든 책임은 제가 집니다!
    ja: 本件に関する責任はすべて私にあります！
  event_ce006_2_06_e_102:
    speaker: privaty
    en: in my capacity as a member of the Central Government's defense force,
    ko: 중앙 정부 방주 수비군 휘하!
    ja: 問責は後ほど中央政府アーク防衛軍…
  event_ce006_2_06_e_103:
    speaker: privaty
    en: I will take full responsibility for what follows.
    ko: 방주 위협 제어 부대 트라이앵글의 프리바티가 책임집니다!
    ja: |-
      アーク脅威制御部隊トライアングル所属、
      プリバティに対して行ってください！
  event_ce006_2_06_e_104:
    speaker: "<Self>"
    en: In addition, this decision has been approved in coordination with the Special
      Commando Unit, Counters.
    ko: 또한 해당 사항은 특수별동대 카운터스의 판단과도 동일하다.
    ja: 特殊別働隊カウンターズも判断に同意する
  event_ce006_2_06_e_105:
    speaker: "<Self>"
    en: If you have any objections, you must present the relevant documentation, signed
      by a military officer of Deputy Chief rank or higher.
    ko: 반박 시 부사령관 이상의 서류를 들고 오도록.
    ja: |-
      異論がある場合は副司令官以上の承認を受けた
      書面のみ受け付ける
  event_ce006_2_06_e_106:
    speaker: privaty
    en: Have you all got cotton in your ears?
    ko: 들으셨죠?
    ja: 聞こえていますね？
  event_ce006_2_06_e_107:
    speaker: privaty
    en: What are you standing there for? Hurry up and move!
    ko: 뭐 하고 있어요! 빨리 움직여요!
    ja: 早く動いてください！一刻を争います！
  event_ce006_2_06_e_108:
    speaker: "<Narration>"
    en: Meanwhile. Surface.
    ko: 그 시간. 지상.
    ja: その頃、地上
  event_ce006_2_06_e_109:
    speaker: ce006_01
    en: How many more?
    ko: 얼마나 남았어?
    ja: あとどれくらい？
  event_ce006_2_06_e_110:
    speaker: ce006_03
    en: About fifteen!
    ko: 잔기 열다섯!
    ja: 15体です！
  event_ce006_2_06_e_111:
    speaker: ce006_01
    en: Time to wrap this up.
    ko: 금방 마무리할게.
    ja: すぐ終わらせる。
  event_ce006_2_06_e_112:
    speaker: "<Narration>"
    en: EVE runs off.
    ko: 이브가 달린다.
    ja: イヴが敵に向かって踏み込んだ
  event_ce006_2_06_e_113:
    speaker: "<Narration>"
    en: She closes the distance between her and the Raptures in an instant, piercing
      one of their cores with her blade,
    ko: |-
      단숨에 거리를 좁혀 내지른 검격이 코어를 꿰뚫고,
      멀리서 점프로 접근하는 랩쳐를 사격으로 격추한다.
    ja: |-
      一瞬で距離が縮み、閃く剣がコアを貫いた。
      すかさず飛びかかってきた別のラプチャーは
      たやすく撃ち落とされた
  event_ce006_2_06_e_114:
    speaker: "<Narration>"
    en: sending a wave of energy from her blade which cleaves the ground in two.
    ko: 검에서 뻗어 나온 검격이 지면을 가르며 두 동강내고
    ja: 放たれた剣光が大地を二つに切り裂く
  event_ce006_2_06_e_115:
    speaker: "<Narration>"
    en: Meanwhile, she dodges the incoming Rapture attack, accompanied by a flash
      of blue as she swings her sword all around, sending waves of energy in all directions.
    ko: |-
      거체를 앞세운 랩쳐의 공격을 푸른 섬광과 함께 피한 후
      주위를 휩쓸듯 검격을 흩뿌린다.
    ja: |-
      巨体にものをいわせたラプチャーの攻撃も
      青い残像だけをかすめ、斬撃が周囲をなぎ払った
  event_ce006_2_06_e_116:
    speaker: ce006_npc_01
    en: Wow, she swings that sword like a fish swims through water. So natural, so
      free.
    ko: 휘유~ 검을 마음껏 휘두를 수 있으니 말 그대로 날아다니네.
    ja: |-
      ふっ、好きに剣を振れるとなると、
      背中に羽が生えたようだな。
  event_ce006_2_06_e_117:
    speaker: "<Narration>"
    en: EVE deftly maneuvers her way around the Raptures as if performing a dance.
    ko: 이브는 마치 춤추듯 랩쳐들 사이를 휘젓는다.
    ja: |-
      イヴはまるで踊るように
      ラプチャーの間を駆け抜ける
  event_ce006_2_06_e_118:
    speaker: "<Narration>"
    en: As she does this,
    ko: 그러던 중, 자신의 몸에 이상을 느낀다.
    ja: しかし次の瞬間、身体に違和感を覚えた
  event_ce006_2_06_e_119:
    speaker: "<Narration>"
    en: she feels something strange.
    ko: 금색 입자가 이브의 몸에서 뿜어져 나오기 시작했다.
    ja: 金色の粒子が自身の体から流れ出している
  event_ce006_2_06_e_120:
    speaker: "<Narration>"
    en: Golden particles begin to emanate not only from her body,
    ko: 아담과 릴리, 그리고 테트라포드까지.
    ja: そしてアダムとリリー、テトラポッドからも…
  event_ce006_2_06_e_121:
    speaker: "<Narration>"
    en: but also Adam, Lily, and even the Tetrapod.
    ko: 다른 세계의 존재들에게서 금색 입자가 뿜어져 나온다.
    ja: |-
      この世界ならざる者たちから、
      金色の粒子があふれ出していた
  event_ce006_2_06_e_122:
    speaker: ce006_03
    en: Huh? What is this?
    ko: 어? 이건….
    ja: え？これは…
  event_ce006_2_06_e_123:
    speaker: ce006_npc_01
    en: I'm not sure, but I have the sense it's time for us to head back.
    ko: 잘은 모르겠지만 돌아갈 시간인 것 같군.
    ja: |-
      よく分からないが、
      そろそろ帰れってことのようだ。
  event_ce006_2_06_e_124:
    speaker: ce006_03
    en: How do you know?
    ko: 어떻게 알아요?
    ja: どうして分かるの？
  event_ce006_2_06_e_125:
    speaker: ce006_npc_01
    en: Not sure. Just a feeling.
    ko: 글쎄. 감이랄까.
    ja: さあな。そんな気がするってだけだ。
  event_ce006_2_06_e_126:
    speaker: ce006_03
    en: But I thought we were supposed to defeat that Gatekeeper thing?
    ko: 게이트 키퍼인가 뭔가를 해치워야 한다고 하지 않았나요?
    ja: |-
      ゲートキーパーとかいうやつを
      倒さないといけないんじゃなかった？
  event_ce006_2_06_e_127:
    speaker: ce006_npc_01
    en: Maybe someone else took care of it, or the Gatekeeper likes to change its
      mind.
    ko: |-
      다른 누군가가 해치웠거나,
      그 녀석의 변덕 때문일지도 모르지.
    ja: |-
      他の誰かが倒したか、
      そいつの単なる気まぐれか…
  event_ce006_2_06_e_128:
    speaker: "<Narration>"
    en: EVE continues to swing her sword around.
    ko: 이브는 계속해서 검을 휘두른다.
    ja: イヴは剣を振る手を止めない
  event_ce006_2_06_e_129:
    speaker: "<Narration>"
    en: The golden particles intensify.
    ko: 금색 입자가 더욱 짙어진다.
    ja: |-
      その間にも、金色の粒子が放つ光は
      ますます強くなった
  event_ce006_2_06_e_130:
    speaker: "<Narration>"
    en: EVE realizes instinctively that everyone, including her, will disappear.
    ko: |-
      이브는 직감했다.
      곧 자신을 비롯한 모두가 사라질 것이라고.
    ja: |-
      イヴは直感していた。
      もうすぐ自分を含めた、全員がここから消える
  event_ce006_2_06_e_131:
    speaker: "<Narration>"
    en: After slicing the last Rapture core in half, she stands still and catches
      her breath.
    ko: |-
      마지막 랩쳐의 코어를 두 동강 낸 후,
      이브는 가만히 서서 호흡을 가다듬었다.
    ja: |-
      最後に残ったラプチャーのコアを
      二つに切り裂き、イヴは呼吸を整えた
  event_ce006_2_06_e_132:
    speaker: ce006_npc_01
    en: EVE. It's time to go back.
    ko: 이브. 돌아갈 시간이야.
    ja: イヴ。帰る時間だ。
  event_ce006_2_06_e_133:
    speaker: ce006_01
    en: Yeah. Seems like it.
    ko: 응. 그런 것 같네.
    ja: ええ。分かってる。
  event_ce006_2_06_e_134:
    speaker: ce006_03
    en: It would have been nice to see their faces one last time.
    ko: 그래도 마지막에 얼굴이라도 봤으면 좋았을 텐데요.
    ja: 最後にあいさつぐらいしておきたかったのに。
  event_ce006_2_06_e_135:
    speaker: ce006_01
    en: It's okay.
    ko: 괜찮아.
    ja: 大丈夫。
  event_ce006_2_06_e_136:
    speaker: ce006_01
    en: We'll carry memories of them, and they'll carry memories of us.
    ko: |-
      우리는 그들의 기억을 가지고 있고,
      그들 역시 우리의 기억을 가지고 있을 테니까.
    ja: |-
      みんなは私たちのことを覚えてる。
      私たちも、みんなのことを忘れない。
  event_ce006_2_06_e_137:
    speaker: "<Narration>"
    en: EVE silently gazes in the direction where the Nikkes headed.
    ko: 이브는 말없이 방주의 니케들이 사라진 방향을 바라보았다.
    ja: |-
      イヴは静かに、アークのニケたちが
      消えていった方角を見つめた
  event_ce006_2_06_e_138:
    speaker: "<Narration>"
    en: A gray sky. A desolate land.
    ko: 잿빛 하늘. 황폐한 대지.
    ja: 灰色の空、荒廃した大地
  event_ce006_2_06_e_139:
    speaker: "<Narration>"
    en: Buildings that crumbled long ago.
    ko: 무너져 내린 지 오랜 시간이 지난 건물들.
    ja: はるか昔に崩れ落ち、野ざらしになった建築物
  event_ce006_2_06_e_140:
    speaker: "<Narration>"
    en: An unwelcoming, and yet tragically familiar landscape.
    ko: 낯익지만 반갑지 않은 주위의 풍경들.
    ja: それは見慣れた、もの悲しくなる風景だ
  event_ce006_2_06_e_141:
    speaker: ce006_01
    en: Stay strong, all of you.
    ko: 힘내. 다들.
    ja: みんな、頑張って。
  event_ce006_2_06_e_142:
    speaker: "<Narration>"
    en: The golden particles continue to intensify.
    ko: 황금색 입자가 더욱 짙어진다.
    ja: 黄金色の粒子の輝きが増した
  event_ce006_2_06_e_143:
    speaker: ce006_01
    en: May our memories live on.
    ko: 당신들과의 기억이 이어지기를.
    ja: 汝らとの記憶よ…永久にあれ。
  event_ce006_2_06_e_144:
    speaker: "<Narration>"
    en: The golden particles scatter.
    ko: 황금색 입자가 흩어진다.
    ja: 黄金色の粒子が霧散した後…
  event_ce006_2_06_e_145:
    speaker: "<Narration>"
    en: In their place, nothing remains.
    ko: 그리고 그곳엔, 아무것도 남아있지 않았다.
    ja: 後にはもはや、何も残っていなかった
  event_ce006_2_06_e_146:
    speaker: "<Monologue>"
    en: The vast collection of the artwork data from the bunker was safely delivered
      to the Ark.
    ko: 벙커에 남아있던 수많은 예술 데이터는 방주에 무사히 전달되었다.
    ja: |-
      シェルターで保護された大量のデータは、
      無事にアークへと継承された
  event_ce006_2_06_e_147:
    speaker: "<Monologue>"
    en: The invaluable materials contained within the data soon spread across the
      Ark,
    ko: 그 막대한 양질의 자료들은 방주 곳곳으로 퍼져나갔고
    ja: |-
      高品質で大量の芸術品データは、
      アークで飛ぶように拡散され…
  event_ce006_2_06_e_148:
    speaker: "<Monologue>"
    en: and led to a surge in lectures, performances, and exhibitions on the artwork
      of the past human civilization.
    ko: |-
      곳곳에서 잃어버린 인류의 예술에 대한 주제로
      강연, 공연, 전시 등의 활동이 활발하게 일어났다.
    ja: |-
      失われた人類の芸術というテーマが
      講演会や展示会の数々を席巻した
  event_ce006_2_06_e_149:
    speaker: "<Monologue>"
    en: News and media outlets ceaselessly ran stories on them.
    ko: 뉴스 및 수많은 매체에서 소식이 끊이지 않았다.
    ja: |-
      ニュースや各種メディアも
      その話題で持ちきりだった
  event_ce006_2_06_e_150:
    speaker: "<Monologue>"
    en: The Ark overflowed with discussions about the art from times past.
    ko: 방주 전체가 과거의 예술에 대한 이야기로 가득 찼다.
    ja: |-
      まるでアーク全体が、
      いにしえの芸術への情熱に
      取りつかれたようであった
  event_ce006_2_06_e_151:
    speaker: "<Monologue>"
    en: Privaty was never punished nor reprimanded.
    ko: "…프리바티는 그 어떤 징계도, 처벌도 받지 않았다."
    ja: |-
      …結局、プリバティが懲戒や処罰を
      受けることはなかった
  event_ce006_2_06_e_152:
    speaker: "<Monologue>"
    en: Under the condition that Hermin's identity and backstory remain undisclosed,
      she was granted a reprieve, despite her disobeying orders.
    ko: |-
      헤르민의 신분과 사정을 노출하지 않는다는 조건 하에,
      상부의 명령을 거부한 것에 대한 면책이 주어졌다.
    ja: |-
      ヘルミンの経歴に関する守秘義務と引き換えに
      上層部に対する命令無視は不問とされた
  event_ce006_2_06_e_153:
    speaker: "<Monologue>"
    en: Hermin also did not wish for his identity to be revealed.
    ko: 헤르민 역시 자신의 신분이 노출되는 것을 바라지 않았다.
    ja: |-
      そもそもヘルミン自身も、
      事情が明らかにされることを望んでいなかった
  event_ce006_2_06_e_154:
    speaker: "<Monologue>"
    en: He said he only sought to preserve the data contained within the bunker, and
      how having accomplished that was more than enough.
    ko: |-
      자신은 그저 벙커의 예술 자료들을 지키는 사람이었을 뿐,
      그것을 수행해 낸 것만으로도 여한이 없다고 했다.
    ja: |-
      自分はただ芸術を守っただけ、
      使命が果たされたのならもう何もいらない…
      それが彼の言葉だった
  event_ce006_2_06_e_155:
    speaker: "<Monologue>"
    en: Roam was appointed as an honorary member of the Counters, and was scheduled
      to be sent back up to the surface after undergoing repairs.
    ko: |-
      롬은 카운터스 명예 대원으로 임명되었고,
      정비 후 다시 지상으로 올라가기로 했다.
    ja: |-
      ロムはカウンターズの名誉隊員に任命され、
      整備を受けた後、再び地上へ戻ることとなった
  event_ce006_2_06_e_156:
    speaker: "<Monologue>"
    en: Now that Roam had seen the original Ark, it better knew what direction to
      take with the second Ark.
    ko: |-
      방주의 모습을 기억했으니,
      제2의 방주 제작에 확고한 방향이 잡힌 모양이었다.
    ja: |-
      実物を目にした現在は、第2のアーク建設に
      確固たる方向性ができたようだ
  event_ce006_2_06_e_157:
    speaker: "<Monologue>"
    en: With Reclamation Site 01 as a foundation, it threw itself into constructing
      the second Ark.
    ko: |-
      주둔지 01을 베이스캠프로 두고,
      제2의 방주 제작에 몰두하도록 결정했다.
    ja: |-
      駐屯地01を拠点として、
      第2のアーク製作に意気をあげている
  event_ce006_2_06_e_158:
    speaker: "<Monologue>"
    en: No news has been heard about EVE or the others.
    ko: "…이브 일행의 소식은 들을 수 없었다."
    ja: |-
      …イヴたちの消息は
      一向に情報が入ってこなかった
  event_ce006_2_06_e_159:
    speaker: "<Monologue>"
    en: When we returned to the place where we parted, there was nothing left except
      for the wreckage of some fallen Raptures.
    ko: 헤어진 곳으로 향했을 때, 랩쳐의 잔해 말고는 아무것도 확인할 수 없었다.
    ja: |-
      別れた場所へ戻っても、
      ラプチャーの残骸以外は何も確認できなかった
  event_ce006_2_06_e_160:
    speaker: "<Monologue>"
    en: All the D-Wave signals had disappeared as well.
    ko: D-WAVE 신호도 모두 사라져 있는 상태였다.
    ja: D-WAVEの信号もすべて消滅していた
  event_ce006_2_06_e_161:
    speaker: "<Monologue>"
    en: It was unfortunate that we couldn't say a proper goodbye.
    ko: 작별 인사를 하지 못한 것이 아쉽다.
    ja: |-
      別れのあいさつもできなかったという
      未練だけが残った
  event_ce006_2_06_e_162:
    speaker: "<Monologue>"
    en: "... May our memories of them live on."
    ko: "…부디, 그들과의 기억이 이어지기를."
    ja: |-
      …せめて、彼女たちとの記憶が
      私たちの中に末永く残ることを祈るほかない
  event_ce006_2_06_e_163:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: それから…
  event_ce006_2_06_e_164:
    speaker: hermin
    en: I'm eternally grateful to you.
    ko: 정말 감사합니다.
    ja: 本当に、ありがとうございました。
  event_ce006_2_06_e_165:
    speaker: hermin
    en: Thanks to you all, my life... our lives have meaning.
    ko: 여러분들 덕에, 제 삶은. 우리들의 삶은 무의미하지 않았어요.
    ja: |-
      みなさんのおかげで、私の…
      私たちの人生は、意味のあるものになりました。
  event_ce006_2_06_e_166:
    speaker: hermin
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_167:
    speaker: hermin
    en: I believe that life itself can be art.
    ko: 삶이라는 건 그 자체로 예술이라 생각합니다.
    ja: 人生とは、それ自体が芸術だと思います。
  event_ce006_2_06_e_168:
    speaker: hermin
    en: By expressing oneself, by having an influence on others,
    ko: 자신을 표현하며, 타인에게 영향을 미치는 것이죠.
    ja: |-
      自分を表現することが、
      他人にも影響を与えていく。
  event_ce006_2_06_e_169:
    speaker: hermin
    en: you are creating art every waking moment of your life, simply by living.
    ko: 여러분은 살아감으로 인해, 예술을 만들어내고 있습니다.
    ja: |-
      みなさんが生きること自体が、
      芸術となるのです。
  event_ce006_2_06_e_170:
    speaker: hermin
    en: May your lives, in all their artistic splendor,
    ko: 여러분 모두의 삶이, 예술이.
    ja: みなさんの人生が、芸術が…
  event_ce006_2_06_e_171:
    speaker: hermin
    en: continue on, and be passed down to future generations.
    ko: 부디 계속 이어져, 후대에 이어지기를.
    ja: どうかこの先も、後世に受け継がれますように。
  event_ce006_2_06_e_172:
    speaker: "<Monologue>"
    en: A week after arriving at the Ark,
    ko: 헤르민은 방주에 도착한 지 1주일 뒤
    ja: アークに到着してから1週間後…
  event_ce006_2_06_e_173:
    speaker: "<Monologue>"
    en: Hermin passed away peacefully while holding onto the picture frames he cherished.
    ko: 소중한 액자를 끌어안은 채 편안하게 숨을 거뒀다.
    ja: |-
      ヘルミンは大切な写真立てを抱きしめながら、
      安らかに息を引き取った
  event_ce006_2_06_e_174:
    speaker: "<Monologue>"
    en: We stand in front of Hermin's memorial.
    ko: 우리는 헤르민의 위령비 앞에 서 있었다.
    ja: |-
      私たちの足はヘルミンの慰霊碑の前に
      向かっていた
  event_ce006_2_06_e_175:
    speaker: privaty
    en: They say it was a miracle that he lasted this long.
    ko: "…지금까지 살아있는 게 기적이라고 했어요."
    ja: "…今まで生きていたのが奇跡、とのことでした。"
  event_ce006_2_06_e_176:
    speaker: privaty
    en: He was in an extremely frail state when he arrived.
    ko: 너무 노쇠한 상태였다고….
    ja: 老衰の状態がひどく…
  event_ce006_2_06_e_177:
    speaker: privaty
    en: There was nothing that could be done.
    ko: 사실상 손을 쓸 수 없는 상태였어요.
    ja: 手の施しようがなかったそうです。
  event_ce006_2_06_e_178:
    speaker: anis
    en: Still, you were able to show him around quite a bit, weren't you?
    ko: "…그래도 너. 헤르민 할아버지랑 엄청 돌아다녔지?"
    ja: |-
      …それにしてはあなた、ずいぶん
      連れ回してたみたいじゃない？
  event_ce006_2_06_e_179:
    speaker: privaty
    en: "... Yes. I wanted to show him all that the Ark has to offer."
    ko: "…예. 방주 곳곳을 다 보여드리고 싶었어요."
    ja: |-
      …ええ。アークのすべてを
      お見せしたかったので。
  event_ce006_2_06_e_180:
    speaker: privaty
    en: Even though I wasn't able to show him as much as I would have liked,
    ko: 얼마… 못 보여드렸지만요.
    ja: 結局…時間が足りませんでしたが。
  event_ce006_2_06_e_181:
    speaker: privaty
    en: he was so happy.
    ko: 엄청 좋아하셨어요.
    ja: 喜んでいただけていたと思います。
  event_ce006_2_06_e_182:
    speaker: privaty
    en: He loved seeing the traces of art that have remained throughout the Ark.
    ko: 방주 곳곳에 남아있던 예술의 흔적들을 보며, 많이 좋아하셨죠.
    ja: |-
      アークに残っている過去の痕跡を見て、
      心から楽しんでいるようでした。
  event_ce006_2_06_e_183:
    speaker: elegg
    en: Big and small, the marks left behind by those from the bunker are still there.
    ko: 적든 많든, 벙커에 남아있던 분들의 흔적이 남아 있었을 테니까여.
    ja: |-
      多かれ少なかれ、シェルターが守っていた
      文化の影響を受けているはずですからな。
  event_ce006_2_06_e_184:
    speaker: privaty
    en: Yes. He would tell me whose masterpiece this was inspired by, or whose failed
      work was improved upon beautifully.
    ko: |-
      예. 이건 누구의 대표작에서 영감을 받은 거다,
      저건 누구의 실패작이었는데 잘 개량했다던가.
    ja: |-
      そうです。これは誰々の代表作から
      インスピレーションを得たに違いないとか、
      誰々の失敗作をうまく改良している、とか…
  event_ce006_2_06_e_185:
    speaker: privaty
    en: I can't say that I understood all of it, but he certainly was very proud.
    ko: "…잘 알아듣진 못 했지만 많이 뿌듯해하셨어요."
    ja: |-
      …すべては理解できませんでしたが、
      誇らしそうでした。
  event_ce006_2_06_e_186:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_187:
    speaker: privaty
    en: I wanted to show him more.
    ko: 더 보여드리고 싶었어요.
    ja: もっとお見せしたかった。
  event_ce006_2_06_e_188:
    speaker: privaty
    en: I wanted to tell him that what he fought for wasn't in vain.
    ko: 당신들이 지켜온 것은 헛되지 않았다고
    ja: |-
      あなたたちが守ってきたものは、
      無駄ではなかったと…
  event_ce006_2_06_e_189:
    speaker: privaty
    en: That because of them, the Ark was able to become a more beautiful place.
    ko: 당신들 덕에 방주가 좀 더 아름다워졌다고 말해주고 싶었어요
    ja: |-
      あなたたちのおかげで、
      アークはより美しくなったのだと
      伝えたかった。
  event_ce006_2_06_e_190:
    speaker: privaty
    en: That all that time they spent waiting was not wasted. Not in the slightest.
    ko: 당신들의 시간은, 기다림은, 조금도 헛되지 않았다고
    ja: |-
      耐えてきた時間は一秒だって
      無駄ではなかったと…
  event_ce006_2_06_e_191:
    speaker: privaty
    en: I wanted to tell him... to be proud.
    ko: 자랑스러워하라고… 말해주고 싶었단 말이에요.
    ja: 胸を張ってほしいと…伝えたかった。
  event_ce006_2_06_e_192:
    speaker: anis
    en: He knows all of that.
    ko: "…알아줄 거야."
    ja: "…気持ちは伝わったはずよ。"
  event_ce006_2_06_e_193:
    speaker: neon
    en: Yeah. I'm sure he does.
    ko: 그럼요. 분명히 그럴 거예요.
    ja: もちろんです。間違いありません。
  event_ce006_2_06_e_194:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_2_06_e_195:
    speaker: privaty
    en: I hope so.
    ko: 그랬으면 좋겠네요.
    ja: そう願います。
  event_ce006_2_06_e_196:
    speaker: "<Self>"
    en: Me too.
    ko: "…응."
    ja: "…ああ"
  event_ce006_2_06_e_197:
    speaker: "<Monologue>"
    en: We place our hands on Hermin's memorial in silence.
    ko: 우리는 말없이 헤르민의 위령비에 손을 얹었다.
    ja: 私たちは静かにヘルミンの慰霊碑へ手を伸ばした
  event_ce006_2_06_e_198:
    speaker: "<Monologue>"
    en: To the one who dedicated his life to ensuring the past carries on into the
      present,
    ko: 과거와 현재를 잇는 일에 삶을 바친
    ja: 不思議と祈りの言葉が浮かんでくる
  event_ce006_2_06_e_199:
    speaker: "<Monologue>"
    en: may he finally rest in peace.
    ko: 그가 끝끝내 평안하기를.
    ja: |-
      過去と現在を結ぶことに命を捧げた彼に
      安らかな眠りがあるように
  event_ce006_2_06_e_200:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: そして…
  event_ce006_2_06_e_201:
    speaker: rapi
    en: May your memory live on.
    ko: 당신의 기억이… 이어지기를.
    ja: 汝の尊き記憶よ…永久にあれ。
  event_ce006_2_06_e_202:
    speaker: "<Narration>"
    en: 'MEMORIES: Continued'
    ko: 'MEMORIES : Continued'
    ja: 'MEMORIES : Continued'
event_ce006_3_epilogue:
  event_ce006_3_epilogue_1:
    speaker: "<Monologue>"
    en: A few days after Hermin's death, the Pioneer Squad arrived and handed over
      Com to us.
    ko: |-
      헤르민 사후 며칠 뒤,
      파이오니아 스쿼드에게서 콤을 인계받았다.
    ja: |-
      ヘルミンが世を去って数日後、
      パイオニアの一行から
      コムを引き渡したいと連絡を受けた
  event_ce006_3_epilogue_2:
    speaker: "<Monologue>"
    en: Com no longer had any trace of its former violent demeanor.
    ko: 콤은 이전의 난폭해 보였던 태도가 조금도 남아있지 않았다.
    ja: |-
      あの乱暴にも見えた態度は
      まるで嘘のように面影もなくなっていた
  event_ce006_3_epilogue_3:
    speaker: "<Monologue>"
    en: It apologized profusely for attacking Privaty and Roam, and for its prior
      rudeness.
    ko: 무례하게 굴고, 프리바티와 롬을 공격한 것에 사과했다.
    ja: |-
      コムは無礼な言動や、
      プリバティとロムに
      危害を加えたことを謝罪し…
  event_ce006_3_epilogue_4:
    speaker: "<Monologue>"
    en: It also requested for all of its data to be backed up.
    ko: 그리고 자신의 모든 데이터를 백업해 주기를 원했다.
    ja: |-
      自分のすべてのデータの
      バックアップを行ってほしいと語った
  event_ce006_3_epilogue_5:
    speaker: "<Monologue>"
    en: 'We honored the request, and made two copies: one for the Central Government''s
      data center, and another for me.'
    ko: 콤의 모든 데이터는 백업되어 나와 중앙 정부 데이터 센터에 보관되었다.
    ja: |-
      その願い通り、コムのデータは中央政府所管の
      データセンターに保存されることとなった
  event_ce006_3_epilogue_6:
    speaker: "<Monologue>"
    en: Central Government officials were reluctant to make this data public.
    ko: 중앙 정부 관계자는 이 데이터를 공개하는 것에 난색을 표했다.
    ja: |-
      中央政府の関係者は、
      データを公開することに難色を示した
  event_ce006_3_epilogue_7:
    speaker: "<Monologue>"
    en: Probably because, like Hermin, they feared the ugly truths that it contained.
    ko: 헤르민과 같은 이유로 치부가 드러나는 것이 두려웠기 때문이겠지.
    ja: |-
      ヘルミンと同じ理由で、自らの暗部が
      明らかにされることを恐れたのだろう
  event_ce006_3_epilogue_8:
    speaker: "<Monologue>"
    en: As for what Com thought of all this...
    ko: 콤은 말했다.
    ja: コムが答えた
  event_ce006_3_epilogue_9:
    speaker: com
    en: It is fine if it is not made public. I would simply like for everyone who
      has witnessed this to remember.
    ko: |-
      공개하지 않아도 좋다.
      대신 이걸 목격한 이들이 모두 기억해 주길 바란다.
    ja: |-
      公開する必要はない。
      ただ、このデータを知る人々に
      覚えていてもらいたい。
  event_ce006_3_epilogue_10:
    speaker: com
    en: Remember that we were there, and how we lived in that place.
    ko: |-
      우리는 그곳에 있었고,
      그곳에서 살아있다는 것을 기억해 다오.
    ja: |-
      私たちはそこにいて、
      そこで生きていたということを。
  event_ce006_3_epilogue_11:
    speaker: com
    en: That is all we need for them to live on.
    ko: 그렇게 이어지면 된다.
    ja: そうしてつながっていればいい。
  event_ce006_3_epilogue_12:
    speaker: "<Monologue>"
    en: For days, Com remained in front of Hermin's memorial, not moving an inch.
    ko: "…그리고 콤은 헤르민의 위령비 앞에서 며칠 동안 움직이지 않았다."
    ja: |-
      …その後、コムはヘルミンの慰霊碑の
      前に向かい、数日間動こうとしなかった
  event_ce006_3_epilogue_13:
    speaker: "<Monologue>"
    en: It kept repeating the same words over and over, "If only I had waited a little
      longer. If only I hadn't given up."
    ko: |-
      조금만 더 기다렸다면 좋았을 걸. 포기하지 말 걸.
      이라는 말만 계속해서 반복했다.
    ja: |-
      あと少し待っていればよかった、
      諦めなければよかった。
      そう何度も繰り返していた
  event_ce006_3_epilogue_14:
    speaker: "<Monologue>"
    en: A few days later...
    ko: 그리고 또 며칠의 시간이 지났다.
    ja: それからまた数日が過ぎた
  event_ce006_3_epilogue_15:
    speaker: privaty
    en: Commander, let's go.
    ko: 지휘관. 가죠.
    ja: 指揮官。行きましょう。
  event_ce006_3_epilogue_16:
    speaker: "<Self>"
    en: Go where?
    ko: 가다니? 어딜?
    ja: 行く？どこへだ？
  event_ce006_3_epilogue_17:
    speaker: privaty
    en: Did you not receive
    ko: 응? 못 받았나요?
    ja: え？届いていませんか？
  event_ce006_3_epilogue_18:
    speaker: privaty
    en: the invitation from Enikk?
    ko: 에닉이 보내준 초대권.
    ja: エニックからの招待券…
  event_ce006_3_epilogue_19:
    speaker: "<Self>"
    en: Enikk sent an invitation?
    ko: 에닉이 초대권을 보냈다고?
    ja: エニックからそんなものが？
  event_ce006_3_epilogue_20:
    speaker: privaty
    en: Yes. Here.
    ko: 예. 여기….
    ja: はい。これです。
  event_ce006_3_epilogue_21:
    speaker: "<Monologue>"
    en: 'On Privaty''s phone, there is an e-ticket which reads: Couple''s ticket to
      the solo exhibition "Memories Teller".'
    ko: |-
      - 개인전 [MEMORIES TELLER] 커플 입장권 -
      이라고 쓰인 E-티켓이 프리바티의 핸드폰에 출력되어 있다.
    ja: |-
      個人展覧会「MEMORIES TELLER」
      ペア入場券と書かれた電子チケットが
      プリバティの端末に表示されている
  event_ce006_3_epilogue_22:
    speaker: privaty
    en: Enikk said you and I could go together.
    ko: 지휘관이랑 같이 가라고 하던데요?
    ja: 指揮官と行くように、と言われましたが？
  event_ce006_3_epilogue_23:
    speaker: "<Self>"
    en: Ah, I see. Since this is a couple's ticket, two people can enter using it.
    ko: 아… 이거 커플 입장권이라서 하나만 있으면 둘이 들어갈 수 있어.
    ja: |-
      あぁ…ペア入場券だから
      これ1枚で2人入れるようだな
  event_ce006_3_epilogue_24:
    speaker: privaty
    en: Yep, that's h...
    ko: 아, 그런 시스템이군… 요….
    ja: ああ、そういうことでした…か…
  event_ce006_3_epilogue_25:
    speaker: privaty
    en: C-couple?!
    ko: 커, 커플 입장권이요? 커플?
    ja: わ、私たち2人きりで…？
  event_ce006_3_epilogue_26:
    speaker: privaty
    en: But we're not a couple.
    ko: 아, 아니잖… 아요? 우리.
    ja: そ、それって…え？そういうことですか？
  event_ce006_3_epilogue_27:
    speaker: "<Self>"
    en: These tickets usually come with all sorts of discounts and perks.
    ko: 커플 입장권이면 아무래도 가격이나 이런저런 혜택이 있으니까.
    ja: |-
      ペア入場券の方が一人あたりは安くなるし、
      特典もあるからな
  event_ce006_3_epilogue_28:
    speaker: privaty
    en: Oh...
    ko: "…아."
    ja: "…ああ。"
  event_ce006_3_epilogue_29:
    speaker: privaty
    en: I guess that explains it.
    ko: 그런 거였군요.
    ja: そういうことでしたか。
  event_ce006_3_epilogue_30:
    speaker: "<Self>"
    en: Why would Enikk of all people send us this?
    ko: 그런데 에닉이 이런 걸 보내다니 이상하네.
    ja: しかし、なぜエニックがそんなものを？
  event_ce006_3_epilogue_31:
    speaker: "<Self>"
    en: It says solo exhibition... I wonder what it's focused on?
    ko: 무슨 전시회야 이거?
    ja: 何の展覧会なんだ？
  event_ce006_3_epilogue_32:
    speaker: privaty
    en: I'm not sure. I didn't receive any details either.
    ko: 글쎄요. 저도 자세한 건 전달받지 못했어요.
    ja: さあ…私も詳しいことは。
  event_ce006_3_epilogue_33:
    speaker: privaty
    en: I only received instructions to come with you.
    ko: 지휘관이랑 같이 가라는 말만 전달받았어요.
    ja: 指揮官と一緒に行けと言われただけです。
  event_ce006_3_epilogue_34:
    speaker: privaty
    en: So... would you like to go with me? If you're too busy, I understand.
    ko: |-
      그, 그래서 같이 갈 건가요?
      바쁘면 어쩔 수 없고요.
    ja: |-
      そ、それで、一緒に行きますか？
      忙しいなら無理にとは言いませんけど…
  event_ce006_3_epilogue_35:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_36:
    speaker: "<Self>"
    en: I am.
    ko: 바쁜데.
    ja: 忙しいな
  event_ce006_3_epilogue_37:
    speaker: privaty
    en: Oh... really?
    ko: 어… 그, 그래요?
    ja: あっ…そ、そうですか？
  event_ce006_3_epilogue_38:
    speaker: privaty
    en: You really don't have a spare moment?
    ko: 그… 시간이 정말 조금도 안 나나요?
    ja: その…少しも時間をとれそうにないですか？
  event_ce006_3_epilogue_39:
    speaker: privaty
    en: I-I'm just curious about the exhibition, that's all!
    ko: 아니, 제가 뭐 지휘관이랑 오붓하게 가고 싶어서 하는 말이 아니라. 그냥 궁금해서요. 전시회라는 거.
    ja: |-
      いえ、私が指揮官と出かけたいとか
      そういう話ではなく…ただ気になるんです。
      展覧会というものが…
  event_ce006_3_epilogue_40:
    speaker: "<Self>"
    en: All right, fine. Let's go.
    ko: 할 수 없네. 같이 가자.
    ja: 仕方ないな。行ってみようか
  event_ce006_3_epilogue_41:
    speaker: privaty
    en: Are you sure?
    ko: 그, 그럴래요? 그래요 그럼.
    ja: そ、そうですね？あくまで仕方ないので…
  event_ce006_3_epilogue_42:
    speaker: privaty
    en: Okay, let's go straight away!
    ko: 바로 출발하죠.
    ja: 今すぐ行ってみましょう。
  event_ce006_3_epilogue_43:
    speaker: com
    en: I received a ticket as well.
    ko: 나한테도 티켓 왔다.
    ja: 私にもチケットが届いている。
  event_ce006_3_epilogue_44:
    speaker: privaty
    en: "... Come again?"
    ko: "…예?"
    ja: "…はい？"
  event_ce006_3_epilogue_45:
    speaker: "<Self>"
    en: You did?
    ko: 콤한테도?
    ja: コムにも？
  event_ce006_3_epilogue_46:
    speaker: com
    en: It says to come with you both.
    ko: 너희와 동행하라고 했다.
    ja: 君たちと一緒に行くようにと言われた。
  event_ce006_3_epilogue_47:
    speaker: privaty
    en: Did Enikk send it to you?
    ko: "…에닉이요?"
    ja: "…エニックから？"
  event_ce006_3_epilogue_48:
    speaker: com
    en: That is correct.
    ko: 그렇다.
    ja: そうだ。
  event_ce006_3_epilogue_49:
    speaker: privaty
    en: So much for having a nice date...
    ko: "…뭐야, 데이트가 아니잖아 이러면…."
    ja: "…それじゃデートにならない…"
  event_ce006_3_epilogue_50:
    speaker: com
    en: I heard that.
    ko: 나는 다 들린다.
    ja: 聞こえているぞ。
  event_ce006_3_epilogue_51:
    speaker: privaty
    en: B-be quiet, you!
    ko: 조, 조용! 조용히!
    ja: な、何でも！何でもありません！
  event_ce006_3_epilogue_52:
    speaker: privaty
    en: Well then, we ought to get going.
    ko: 그, 그럼 가볼까요?
    ja: とにかく…行きましょうか？
  event_ce006_3_epilogue_53:
    speaker: "<Monologue>"
    en: The exhibition hall is quiet.
    ko: 전시회장 내부는 한산했다.
    ja: 展覧会の会場は閑散としていた
  event_ce006_3_epilogue_54:
    speaker: "<Monologue>"
    en: Various paintings are scattered across the vast space, and a few attendees
      are conversing in front of them.
    ko: |-
      넓은 공간 곳곳에 걸린 그림과,
      그 앞에서 이야기를 나누는 소수의 인파만 보였다.
    ja: |-
      広い空間に飾られた数々の絵と
      その前で会話をする人々がまばらにあるだけだ
  event_ce006_3_epilogue_55:
    speaker: privaty
    en: Looks like an art exhibition.
    ko: 흠… 그림 전시회네요.
    ja: うーん…いわゆる絵の展覧会ですよね。
  event_ce006_3_epilogue_56:
    speaker: privaty
    en: I don't know much about art, but these seem well done.
    ko: 저는 그림에 대해 잘 모르지만 잘 그린 것 같아요.
    ja: |-
      絵には詳しくありませんが、
      確かに上手だと思います。
  event_ce006_3_epilogue_57:
    speaker: com
    en: How can you say they are well done if you do not know much about art?
    ko: 잘 모르지만 어떻게 잘 그린 줄 알지?
    ja: 詳しくないのに、なぜ上手だと分かる？
  event_ce006_3_epilogue_58:
    speaker: privaty
    en: I'm just saying that's how it feels.
    ko: "…느낌이 그렇다는 거예요, 느낌이."
    ja: "…なんとなくそう感じただけです。"
  event_ce006_3_epilogue_59:
    speaker: com
    en: That is something people say when they are not well-informed on a given topic.
    ko: 잘 모르면 보통 그렇게 얘기한다.
    ja: 分かっていない者がよく言う言葉だ。
  event_ce006_3_epilogue_60:
    speaker: privaty
    en: "... Why do I feel like I'm under attack? I'm getting flashbacks of being
      rammed by a certain combat support robot."
    ko: |-
      아 머리 아파.
      꼭 전투 보조용 로봇이 들이받은 것 같은 느낌이네요.
    ja: |-
      すみませんねぇ。
      戦闘補助ロボットに攻撃を受けて
      頭が痛むもので…
  event_ce006_3_epilogue_61:
    speaker: com
    en: My sincerest apologies for that incident.
    ko: "---그때 일은 진심으로 사과한다."
    ja: "――あの時のことは、本当に申し訳なかった。"
  event_ce006_3_epilogue_62:
    speaker: privaty
    en: Hmph.
    ko: 흥.
    ja: ふん…
  event_ce006_3_epilogue_63:
    speaker: "<Self>"
    en: I still don't understand why we're here.
    ko: "…그런데 정말 봐도 뭔지 잘 모르겠네."
    ja: "…しかし、見てもよく分からないな"
  event_ce006_3_epilogue_64:
    speaker: privaty
    en: You're right, why did Enikk send us here?
    ko: 음… 그러게요. 에닉은 왜 우리한테 여길….
    ja: |-
      うーん…そうですね。
      エニックはなぜ私たちに…
  event_ce006_3_epilogue_65:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_66:
    speaker: privaty
    en: Commander. Com.
    ko: 지휘관. 콤.
    ja: 指揮官、コム。
  event_ce006_3_epilogue_67:
    speaker: privaty
    en: Over there.
    ko: 여기.
    ja: これ…
  event_ce006_3_epilogue_68:
    speaker: "<Monologue>"
    en: Privaty points to one of the paintings.
    ko: 프리바티가 가리킨 그림을 바라본다.
    ja: プリバティが指さした絵を見た
  event_ce006_3_epilogue_69:
    speaker: "<Monologue>"
    en: It portrays a darkened area
    ko: 최소한의 조명만 비추고 있는 검은 공간.
    ja: 最低限の照明だけに照らされた薄暗い空間
  event_ce006_3_epilogue_70:
    speaker: "<Monologue>"
    en: which is only faintly illuminated by minimal lighting.
    ko: 떠난 이들을 기리는 재단.
    ja: 人々の写真が飾られた祭壇
  event_ce006_3_epilogue_71:
    speaker: "<Monologue>"
    en: Contained within it is an altar commemorating those who have passed,
    ko: "…그리고 비석처럼 자리하고 있는 저장 장치들의 모습."
    ja: "…そして、並ぶ碑石のようなデータ保存装置…"
  event_ce006_3_epilogue_72:
    speaker: "<Monologue>"
    en: as well as storage terminals which resemble gravestones.
    ko: 벙커의 모습이다.
    ja: 見間違えではない
  event_ce006_3_epilogue_73:
    speaker: "<Self>"
    en: "... It's the bunker."
    ko: "…벙커… 잖아?"
    ja: "…これは…あのシェルターか？"
  event_ce006_3_epilogue_74:
    speaker: privaty
    en: How did this...
    ko: 이게… 어떻게….
    ja: なぜ…こんな絵が…
  event_ce006_3_epilogue_75:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_epilogue_76:
    speaker: privaty
    en: The title is "Home".
    ko: 제목이… [집]이에요.
    ja: タイトルは…「家」ですね。
  event_ce006_3_epilogue_77:
    speaker: com
    en: "---Home."
    ko: "---집."
    ja: "――家。"
  event_ce006_3_epilogue_78:
    speaker: art
    en: Hello there.
    ko: 안녕하세요?
    ja: こんにちは。
  event_ce006_3_epilogue_79:
    speaker: art
    en: Are you interested in this painting?
    ko: 이 그림에 관심이 있으세요?
    ja: その絵に興味を持っていただけたんですか？
  event_ce006_3_epilogue_80:
    speaker: privaty
    en: Oh, yes. It feels oddly familiar...
    ko: 아… 예. 익숙한 느낌이 들어서….
    ja: ええと…はい。見覚えのある光景だったので…
  event_ce006_3_epilogue_81:
    speaker: art
    en: Really?
    ko: 어머. 그래요?
    ja: えっ、そうなんですか？
  event_ce006_3_epilogue_82:
    speaker: art
    en: You know the funny thing? I felt compelled to draw this, although I couldn't
      tell you why.
    ko: |-
      저 이거 있잖아요.
      갑자기 뭔가 신들린 듯 그리게 됐어요.
    ja: |-
      この絵はですね…
      急に何かに取りつかれたみたいに
      描いてしまって。
  event_ce006_3_epilogue_83:
    speaker: art
    en: You know the data the Central Government released recently? With information
      on artwork from up on the surface?
    ko: 얼마 전에 중앙 정부에서 공개한 지상의 예술 데이터들 있죠?
    ja: |-
      少し前に、中央政府が地上の芸術品の
      データを公開したでしょう？
  event_ce006_3_epilogue_84:
    speaker: art
    en: After visiting that exhibition, my mind was in a complete jumble.
    ko: 그거 전시회 한번 갔다 오고 난 뒤부터 머릿속이 막 뒤죽박죽하더니.
    ja: |-
      その展示を見にいってから
      急にすごく興奮しちゃって…
  event_ce006_3_epilogue_85:
    speaker: art
    en: Then, this image suddenly popped in my head.
    ko: 이 이미지가 팍 하고 떠올랐죠.
    ja: このイメージがぱっと思い浮かんだんです。
  event_ce006_3_epilogue_86:
    speaker: art
    en: I painted it all in a mad flurry, and still I only just met the deadline for
      this show.
    ko: 그래서 급하게 그려서, 억지로 밀어 넣었어요.
    ja: |-
      それで急いで仕上げて、
      今回の展示に間に合わせたんですよ。
  event_ce006_3_epilogue_87:
    speaker: "<Self>"
    en: Are you the host of this exhibition?
    ko: 이 전시회의 주인이야?
    ja: ここの作品は君が？
  event_ce006_3_epilogue_88:
    speaker: art
    en: That I am. I'm Art.
    ko: |-
      아, 예.
      아트라고 해요.
    ja: |-
      あ、はい。
      アートと言います。
  event_ce006_3_epilogue_89:
    speaker: art
    en: I'm a mass-produced Nikke, but I have a bit of an artistic bent, so I paint.
    ko: 양산형 니케지만 이래 봬도 예술에 재능이 있어서 그림 그리는 걸로 활동하고 있죠.
    ja: |-
      量産型のニケなんですが、
      芸術の才能があるって言われて、
      絵描きとして活動しているんです。
  event_ce006_3_epilogue_90:
    speaker: privaty
    en: If you're Art, that means Com...
    ko: 아트라면… 콤의….
    ja: その名前は…コムの…
  event_ce006_3_epilogue_91:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_92:
    speaker: com
    en: Neither of you say a word.
    ko: 둘 다 아무 말하지 마라.
    ja: 何も言うな。
  event_ce006_3_epilogue_93:
    speaker: art
    en: I'm so glad I was lucky enough to get a solo exhibition.
    ko: 이번에 운 좋게 개인전을 열 수 있게 되어서, 얼마나 다행인지 몰라요.
    ja: |-
      今回は運よく個人展を開かせていただいて、
      本当に幸せです。
  event_ce006_3_epilogue_94:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_epilogue_95:
    speaker: com
    en: May I ask the inspiration behind the title?
    ko: 제목이 왜 집이지?
    ja: タイトルが家なのは、なぜだ？
  event_ce006_3_epilogue_96:
    speaker: art
    en: Wow, even a robot is attending? I see that art can touch all sorts.
    ko: |-
      우와. 로봇분도 오셨네요?
      역시 예술은 종족마저 뛰어넘는다니까요.
    ja: |-
      えっ、ロボットさんもお客さまでしたか？
      やっぱり芸術って種族も超えられるんですね。
  event_ce006_3_epilogue_97:
    speaker: com
    en: May I ask the inspiration behind the title?
    ko: 제목이 왜 집이지?
    ja: タイトルが家なのは、なぜだ？
  event_ce006_3_epilogue_98:
    speaker: art
    en: Well...
    ko: 음… 그냥요.
    ja: うーん…なんとなくです。
  event_ce006_3_epilogue_99:
    speaker: art
    en: Whenever I close my eyes, I see that place flickering behind my eyelids.
    ko: 눈을 감으면 아른거리는 장소라서요.
    ja: 目を閉じると思い浮かぶ場所なんですよね。
  event_ce006_3_epilogue_100:
    speaker: art
    en: But it's not intimidating or frightening. Far from it.
    ko: 그렇다고 어색하거나 무서운 느낌이 아니라.
    ja: |-
      でも…暗いとか怖いとか、
      そういう雰囲気じゃなくて…
  event_ce006_3_epilogue_101:
    speaker: art
    en: It feels comforting.
    ko: "…너무 편안한 느낌이라서요."
    ja: "…とても落ち着くんです。"
  event_ce006_3_epilogue_102:
    speaker: art
    en: Hehe, isn't that strange? How such a dark and gloomy place could feel comforting?
    ko: |-
      하하. 이상하죠?
      이런 어두컴컴한 장소가 편안하다니.
    ja: |-
      あはは。ヘンですよね？
      こんな真っ暗な場所が落ち着くなんて。
  event_ce006_3_epilogue_103:
    speaker: art
    en: But that's how I feel.
    ko: 그런데 그런 느낌이에요.
    ja: でも、そういう気持ちになるんです。
  event_ce006_3_epilogue_104:
    speaker: art
    en: And lately, I've been experiencing more of these flashes.
    ko: 그리고 요즘 부쩍 이런 일이 많아요.
    ja: それに最近、不思議なことが多くて。
  event_ce006_3_epilogue_105:
    speaker: art
    en: Blurred faces keep surfacing in the recesses of my mind.
    ko: 흐릿한 얼굴이 떠올라요.
    ja: いろんな人の顔が思い浮かんでくるんです。
  event_ce006_3_epilogue_106:
    speaker: art
    en: I seem to remember someone singing a lullaby so that I could sleep.
    ko: 잘 자라고 불러주던 노래가 떠올라요.
    ja: それから、寝る前の子守歌とか…
  event_ce006_3_epilogue_107:
    speaker: art
    en: An unusual but extravagant blanket.
    ko: 이상하리만치 화려했던 이불.
    ja: おかしなぐらい派手な布団とか…
  event_ce006_3_epilogue_108:
    speaker: art
    en: Numerous smiling faces looking at me. Kind faces.
    ko: |-
      나를 웃으며 바라보는 많은 얼굴들.
      따뜻한 얼굴들.
    ja: |-
      笑顔で私を見守っている人たちの顔とか。
      あたたかい気持ちになります。
  event_ce006_3_epilogue_109:
    speaker: art
    en: The view from atop a cold, metallic box that somehow also seemed reassuringly
      warm.
    ko: 차갑지만 따뜻했던 상자 위에 올라가 보던 풍경.
    ja: |-
      もっと不思議なのは、
      冷たくて暖かい箱の上から見た景色とか…
  event_ce006_3_epilogue_110:
    speaker: art
    en: All sorts of random images keep coming into my mind.
    ko: 그런 것들이 떠올라요.
    ja: そんなものが思い浮かぶんです。
  event_ce006_3_epilogue_111:
    speaker: art
    en: I don't know if they're my own memories or what,
    ko: 제 기억인지, 뭔지는 잘 모르겠지만….
    ja: |-
      私の記憶なのか心象風景なのか、
      よく分からないですけど…
  event_ce006_3_epilogue_112:
    speaker: art
    en: but as time passes, they're becoming clearer.
    ko: 시간이 지나면서 점점 뚜렷해지고 있어요.
    ja: |-
      最近どんどんはっきり
      感じるようになってきてて。
  event_ce006_3_epilogue_113:
    speaker: art
    en: I want to capture those images on a canvas.
    ko: 그 모습들을 캔버스에 담아내고 싶어요.
    ja: それをキャンバスに描きたいんです。
  event_ce006_3_epilogue_114:
    speaker: com
    en: "---Right."
    ko: "---그래."
    ja: "――そうか。"
  event_ce006_3_epilogue_115:
    speaker: com
    en: That is a good thing to do.
    ko: 꼭 담아내면 좋겠다.
    ja: ぜひ、これからも描いてほしい。
  event_ce006_3_epilogue_116:
    speaker: com
    en: I will come to see.
    ko: 보러 오겠다.
    ja: また見に来る。
  event_ce006_3_epilogue_117:
    speaker: art
    en: Haha. Thank you.
    ko: 하하. 고마워요.
    ja: えへへ。ありがとうございます。
  event_ce006_3_epilogue_118:
    speaker: art
    en: I have to say, there's something about you that feels familiar.
    ko: 그런데 이 로봇분. 되게 익숙한 느낌이네요.
    ja: |-
      もしかして、どこかで
      お会いしたことがありますか？
  event_ce006_3_epilogue_119:
    speaker: com
    en: There are many robots who look like me.
    ko: 나랑 닮은 로봇은 많으니까.
    ja: 私と似たロボットなどたくさんいる。
  event_ce006_3_epilogue_120:
    speaker: art
    en: Oh... I see.
    ko: 아… 그렇군요.
    ja: うーん…それはそうですね。
  event_ce006_3_epilogue_121:
    speaker: art
    en: But... It's not just your appearance that feels familiar.
    ko: 그런데… 외형이 익숙하다던가 그런 느낌이 아닌데.
    ja: でも…見た目の話じゃないんですよね…
  event_ce006_3_epilogue_122:
    speaker: art
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_123:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_epilogue_124:
    speaker: com
    en: Art.
    ko: 아트.
    ja: アート。
  event_ce006_3_epilogue_125:
    speaker: com
    en: Do you remember me now?
    ko: 나를 기억하나?
    ja: 私を覚えているか？
  event_ce006_3_epilogue_126:
    speaker: art
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_127:
    speaker: "<Monologue>"
    en: Art gazes at the painting of the bunker, then at Com,
    ko: 아트는 벙커가 그려진 그림을 바라보았다.
    ja: アートがシェルターの描かれた絵を振り返った
  event_ce006_3_epilogue_128:
    speaker: "<Monologue>"
    en: and back to the painting.
    ko: 아트는 콤을 바라보았다.
    ja: それから、コムを見た
  event_ce006_3_epilogue_129:
    speaker: "<Monologue>"
    en: She does this several times, going back and forth
    ko: 그러기를 수 번 반복 했다.
    ja: 視線が絵とコムの間を何度も往復した
  event_ce006_3_epilogue_130:
    speaker: "<Monologue>"
    en: until she finally settles on Com.
    ko: 아트의 시선이 콤에게 멈췄다.
    ja: やがて視線がコムから離れなくなった
  event_ce006_3_epilogue_131:
    speaker: art
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_132:
    speaker: art
    en: Com.
    ko: 콤.
    ja: コム。
  event_ce006_3_epilogue_133:
    speaker: art
    en: Is that you?
    ko: 콤이군요.
    ja: コムだよね。
  event_ce006_3_epilogue_134:
    speaker: com
    en: Art.
    ko: 아트.
    ja: アート。
  event_ce006_3_epilogue_135:
    speaker: com
    en: Do you remember me now?
    ko: 나를 기억하나?
    ja: 私を覚えているか？
  event_ce006_3_epilogue_136:
    speaker: art
    en: I... I do.
    ko: 기억… 해요.
    ja: 覚えて…る。
  event_ce006_3_epilogue_137:
    speaker: art
    en: You remember me?
    ko: 나… 기억… 나요?
    ja: 私の、こと…覚えてる…？
  event_ce006_3_epilogue_138:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_epilogue_139:
    speaker: com
    en: I never forgot you. Not even for a moment.
    ko: 나는 단 한순간도 너를 잊은 적이 없다.
    ja: 忘れたことは一度もない。
  event_ce006_3_epilogue_140:
    speaker: art
    en: Com!
    ko: 콤…!
    ja: コム…！
  event_ce006_3_epilogue_141:
    speaker: "<Monologue>"
    en: Art hugs Com.
    ko: 아트가 콤을 끌어안았다.
    ja: アートがコムを抱き寄せた
  event_ce006_3_epilogue_142:
    speaker: "<Monologue>"
    en: Com lifts its shaking arms
    ko: 콤은 떨리는 팔을 들어 올려
    ja: コムは震える腕部を持ちあげ
  event_ce006_3_epilogue_143:
    speaker: "<Monologue>"
    en: and gently hugs Art.
    ko: 부드럽게 아트를 끌어안았다.
    ja: 優しくアートを抱きしめた
  event_ce006_3_epilogue_144:
    speaker: art
    en: I remember... I remember.
    ko: 기억났어… 기억났어요.
    ja: 覚えてる…思い出したよ…
  event_ce006_3_epilogue_145:
    speaker: art
    en: Oh... how could I have forgotten you?
    ko: 아아… 어째서… 잊어버렸던 걸까….
    ja: ああ…なんで…なんで忘れてたんだろう…
  event_ce006_3_epilogue_146:
    speaker: art
    en: My most precious treasure.
    ko: 내 가장 소중한 보물을….
    ja: 私の一番大切な宝もの…
  event_ce006_3_epilogue_147:
    speaker: com
    en: "-----"
    ko: "------."
    ja: "――――――"
  event_ce006_3_epilogue_148:
    speaker: com
    en: Ah---
    ko: 아--- 아아아---.
    ja: あ――あああ――
  event_ce006_3_epilogue_149:
    speaker: com
    en: Art-----
    ko: 우리의--- 예술 작품---.
    ja: 私たちの――芸術――
  event_ce006_3_epilogue_150:
    speaker: com
    en: My treasure.
    ko: 나의--- 재산.
    ja: 私の――財産。
  event_ce006_3_epilogue_151:
    speaker: com
    en: I have you again.
    ko: 드디어--- 돌려--- 받았다---.
    ja: やっと――返って――きた――
  event_ce006_3_epilogue_152:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_153:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_ce006_3_epilogue_154:
    speaker: "<Monologue>"
    en: The two of them embrace one another in front of the painting of the bunker.
    ko: 벙커가 그려진 그림 앞에서 끌어안은 둘의 모습은.
    ja: 抱きしめ合うふたりの姿は…
  event_ce006_3_epilogue_155:
    speaker: "<Monologue>"
    en: Their forms fit together as one,
    ko: 조금의 어색함 없이 완벽하게 어울렸다.
    ja: |-
      その背にあるシェルターの絵と、
      一体となっていた
  event_ce006_3_epilogue_156:
    speaker: "<Monologue>"
    en: perfectly.
    ko: "…그래."
    ja: "…そうだ"
  event_ce006_3_epilogue_157:
    speaker: "<Monologue>"
    en: It's as if their bodies are melding together with the painting as one cohesive
      work of art.
    ko: 말 그대로 하나의 예술 작품을 보는 듯했다.
    ja: まさしく、ひとつの芸術作品であるかのように
  event_ce006_3_epilogue_158:
    speaker: "<Monologue>"
    en: 'To all those artists who were in that bunker, may you see this and know one
      thing:'
    ko: "…보고 있습니까. 벙커의 예술가들."
    ja: |-
      …シェルターの芸術家たちも、
      見ているだろうか…
  event_ce006_3_epilogue_159:
    speaker: "<Monologue>"
    en: that your memories are living on.
    ko: 당신들의 기억은
    ja: 今この時、この場所で…
  event_ce006_3_epilogue_160:
    speaker: "<Monologue>"
    en: In the here and now.
    ko: 지금 이곳에서 이어졌습니다.
    ja: 汝らの記憶は、永久にある
  event_ce006_3_epilogue_161:
    speaker: "<Narration>"
    en: 'MEMORIES TELLER: END'
    ko: 'MEMORIES TELLER : END'
    ja: 'MEMORIES TELLER : END'
