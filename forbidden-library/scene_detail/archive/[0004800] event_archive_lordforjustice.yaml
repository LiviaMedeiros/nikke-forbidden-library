---
event_lordforjustice_prologue:
  event_lordforjustice_prologue_1:
    speaker: "<Narration>"
    en: Undisclosed location in the Ark. Perilous Siege safe house.
    ko: 방주 모처. 시지 패러리스 안전 가옥.
    ja: アーク某所。シージペリラスの隠れ家
  event_lordforjustice_prologue_2:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_3:
    speaker: "<Narration>"
    en: K stares down with sunken eyes at the sentenced targets brought in earlier.
    ko: K는 조금 전 끌고 온 판결 대상들을 가라앉은 눈으로 내려다보고 있다.
    ja: |-
      Kは先ほど連れてきた判決の対象を
      沈鬱な目で見下ろしている
  event_lordforjustice_prologue_4:
    speaker: "<Narration>"
    en: Two men and one woman have their arms and legs tightly bound and tape sealed
      over their mouths.
    ko: 꽁꽁 묶인 채, 입에 테이프가 붙어 있는 남자 둘과 여자 하나.
    ja: |-
      手足をきつく縛られ、
      口にはテープが貼られた男が2人と女が1人
  event_lordforjustice_prologue_5:
    speaker: "<Narration>"
    en: Scattered around them are various samples of a drug prevalent in the Ark referred
      to as Mist.
    ko: 그들의 주위에는, 방주에서 [미스트]라고 불리는 약물들이 아무렇게나 널려 있다.
    ja: |-
      3人の周りには、アークで「ミスト」と
      呼ばれている薬物が散乱している
  event_lordforjustice_prologue_6:
    speaker: "<Narration>"
    en: K peels the tape off one of the man's mouth.
    ko: 잠시 후, K는 남자 중 한 명의 입에서 테이프를 떼어냈다.
    ja: |-
      しばらくして、
      Kは1人の男の口からテープをはがした
  event_lordforjustice_prologue_7:
    speaker: "<Narration>"
    en: "*Strip*"
    ko: 지익-
    ja: ベリッ…
  event_lordforjustice_prologue_8:
    speaker: afraidman
    en: "*Gasp*! Please, don't kill me!"
    ko: 제발! 뭔가 오해가 있었을 거야!
    ja: なっ、何かの誤解だ！
  event_lordforjustice_prologue_9:
    speaker: afraidman
    en: There must be some kind of misunderstanding!
    ko: 히익, 목숨만은…!
    ja: どうか命だけは…っ！
  event_lordforjustice_prologue_10:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕!
    ja: バンッ！
  event_lordforjustice_prologue_11:
    speaker: "<Narration>"
    en: "*Clink* *Thud*"
    ko: 팅. 털썩.
    ja: ピンッ。ドサッ
  event_lordforjustice_prologue_12:
    speaker: "<Narration>"
    en: As the man's body hits the floor,
    ko: K의 총에서 튀어 오른 탄피가 바닥에 떨어지는 것과 동시에.
    ja: |-
      Kの銃から飛び出した薬きょうが
      地面に落ちるのと同時に
  event_lordforjustice_prologue_13:
    speaker: "<Narration>"
    en: it is accompanied by the clink of a shell casing landing.
    ko: 남자는 그대로 바닥에 쓰러졌다.
    ja: 男はそのまま地面に倒れた
  event_lordforjustice_prologue_14:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_15:
    speaker: "<Narration>"
    en: K removes the tape from the other man's mouth.
    ko: K는 다른 남자의 입에서도 테이프를 떼어냈다.
    ja: Kは残りの男の口からもテープをはがした
  event_lordforjustice_prologue_16:
    speaker: "<Narration>"
    en: "*Strip*"
    ko: 지익-
    ja: ベリッ…
  event_lordforjustice_prologue_17:
    speaker: upsetman
    en: So this is how it ends? Getting used and then tossed to the wolves?
    ko: "…하. 이용해 먹을 만큼 이용해 먹은 뒤에 결국 이런 꼴인가."
    ja: "…はっ。利用するだけ利用して最後はこうか。"
  event_lordforjustice_prologue_18:
    speaker: upsetman
    en: You don't have a clue, do you?
    ko: 그거 아냐?
    ja: まさか、気づいてないつもりか？
  event_lordforjustice_prologue_19:
    speaker: upsetman
    en: The Judges and Perilous Siege are way worse than us.
    ko: 저지스랑 너희 시지 패러리스가 우리보다 더 악질인 거?
    ja: |-
      お前らシージペリラスとジャッジスの方が、
      俺らよりよっぽど悪どいことによぉ？
  event_lordforjustice_prologue_20:
    speaker: "<Narration>"
    en: This statement causes K, who is aiming her weapon at the man's head, to pause.
    ko: 그 말에, 남자의 머리로 총구를 가져가던 K가 멈칫했다.
    ja: |-
      その言葉を聞き、男の額に銃口を突きつけていた
      Kが一瞬たじろいだ
  event_lordforjustice_prologue_21:
    speaker: upsetman
    en: At least we're honest about being dishonest.
    ko: 우린 적어도 우리가 인간 말종에 쓰레기 새끼들이란 건 알아.
    ja: |-
      少なくとも、俺たちは人でなしで
      人間のクズだってことくらいはわきまえてる。
  event_lordforjustice_prologue_22:
    speaker: upsetman
    en: But oh no, not you.
    ko: 그런데 너희는 어떻지?
    ja: なのに、お前たちときたらどうだ？
  event_lordforjustice_prologue_23:
    speaker: upsetman
    en: You prattle on about justice, as if there's anything righteous about this
      dirty work!
    ko: 정의? 씨X 그딴 게 정의면…!
    ja: 正義？ふんっ、そんなもんが正義なら…！
  event_lordforjustice_prologue_24:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕!
    ja: バンッ！
  event_lordforjustice_prologue_25:
    speaker: "<Narration>"
    en: The bullet grazes the man's cheek, interrupting his seething tirade.
    ko: 총알이 악에 받쳐 소리치는 남자의 뺨을 스치고 지나갔다.
    ja: |-
      弾丸が男の頬をかすめ、
      暴言を吐いていた口は静寂を取り戻した
  event_lordforjustice_prologue_26:
    speaker: k
    en: Shut up.
    ko: "…닥쳐."
    ja: "…黙れ。"
  event_lordforjustice_prologue_27:
    speaker: upsetman
    en: Get it over with, will you?
    ko: "……죽여."
    ja: "……殺せ。"
  event_lordforjustice_prologue_28:
    speaker: upsetman
    en: Just kill me already!
    ko: 죽여! 죽이라고! 죽여 이 씨ㅡ
    ja: 殺せ、早く殺しちまえ！殺せっつってんだよッ！
  event_lordforjustice_prologue_29:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕!
    ja: バンッ！
  event_lordforjustice_prologue_30:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 팅.
    ja: ピンッ
  event_lordforjustice_prologue_31:
    speaker: "<Narration>"
    en: Another casing drops.
    ko: 또다시 K의 총에서 탄피가 튀어 오르고.
    ja: 再びKの銃から薬きょうが飛び出し…
  event_lordforjustice_prologue_32:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩.
    ja: ドサッ
  event_lordforjustice_prologue_33:
    speaker: "<Narration>"
    en: The man collapses, his face frozen in contorted rage.
    ko: 남자는 악에 받친 얼굴 그대로 바닥에 쓰러졌다.
    ja: 男は怒りと絶望で歪んだ顔のまま、地面に倒れた
  event_lordforjustice_prologue_34:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_35:
    speaker: "<Narration>"
    en: K looks down at the growing pool of blood with dead eyes.
    ko: 바닥에 천천히 퍼져가는 피 웅덩이를, K는 감정 없는 눈동자로.
    ja: |-
      地面に血だまりがゆっくりと広がっていく様子を
      Kは無感情な目で見つめ…
  event_lordforjustice_prologue_36:
    speaker: afraidwoman
    en: N-no...!
    ko: 으, 으으….
    ja: う、うう…
  event_lordforjustice_prologue_37:
    speaker: "<Narration>"
    en: The remaining woman who is still tied up watches with terror in her eyes.
    ko: 옆에서 묶여 있는 여자는 두려움에 찬 눈동자로, 바라보고 있다.
    ja: |-
      その横で拘束されたままの女は、
      恐怖に満ちた目で見つめていた
  event_lordforjustice_prologue_38:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_39:
    speaker: "<Narration>"
    en: After glancing her way, K pulls out a phone and dials a number.
    ko: 그런 여자에게 잠시 시선을 준 K는 주머니에서 핸드폰을 꺼내 조작했다.
    ja: |-
      残った女にわずかに視線を向けたKは、
      ポケットから携帯電話を取り出し操作した
  event_lordforjustice_prologue_40:
    speaker: "<Narration>"
    en: Before there is even a ring, the line connects with a click.
    ko: 신호음이 채 한 번 울리기도 전에, 달칵 소리와 함께 통화가 연결됐다.
    ja: |-
      呼び出し音が1回も鳴り終わらないうちに、
      カチャという音を立てて電話が繋がった
  event_lordforjustice_prologue_41:
    speaker: unknown
    en: Report.
    ko: 보고.
    ja: 報告。
  event_lordforjustice_prologue_42:
    speaker: k
    en: "... Request for stay of execution."
    ko: "…이의 요청. 집행 거부."
    ja: "…異議申し立て。執行拒否。"
  event_lordforjustice_prologue_43:
    speaker: unknown
    en: Stand by.
    ko: 대기.
    ja: 待機。
  event_lordforjustice_prologue_44:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_45:
    speaker: unknown
    en: Denied.
    ko: "…기각."
    ja: "…却下。"
  event_lordforjustice_prologue_46:
    speaker: unknown
    en: Execute immediately.
    ko: 즉시 집행할 것.
    ja: ただちに執行せよ。
  event_lordforjustice_prologue_47:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_48:
    speaker: k
    en: And if I refuse?
    ko: 거부한다면?
    ja: 拒否したら？
  event_lordforjustice_prologue_49:
    speaker: unknown
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_50:
    speaker: "<Narration>"
    en: Murmured voices can be heard on the other end.
    ko: 핸드폰 너머로 나지막이 이야기를 나누는 소리가 들리고,
    ja: |-
      携帯電話の向こうから低い声で
      何かを話し合う声が聞こえ
  event_lordforjustice_prologue_51:
    speaker: "<Narration>"
    en: A voice different from the previously monotonous tone is now coming from the
      phone; it is the voice of an elderly person.
    ko: |-
      조금 전의 무기질한 목소리와는 다른, 노인의 목소리가
      핸드폰에서 흘러나왔다.
    ja: |-
      先ほどの無機質な声とは違う、
      老人の声が携帯から響いた
  event_lordforjustice_prologue_52:
    speaker: unknown
    en: K, are you listening?
    ko: "…K. 듣고 있나?"
    ja: "…K。聞こえているかね？"
  event_lordforjustice_prologue_53:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_54:
    speaker: k
    en: X?
    ko: "…[X]?"
    ja: "…「X」か？"
  event_lordforjustice_prologue_55:
    speaker: x
    en: That's right.
    ko: 그래. X일세.
    ja: そうだ。
  event_lordforjustice_prologue_56:
    speaker: x
    en: I believe this is the first time you've heard my voice,
    ko: 목소리를 듣는 건 아마 처음인 것 같은데.
    ja: 声を聞くのは初めてのはずだろう？
  event_lordforjustice_prologue_57:
    speaker: x
    en: and yet you still recognize me?
    ko: 용케 나인 줄 알았군.
    ja: よく私だと分かったね。
  event_lordforjustice_prologue_58:
    speaker: k
    en: That's because you're the only one of the Upper Strata who still seems human.
    ko: "[윗줄] 중에 그나마 사람 같은 건 당신뿐이니까."
    ja: |-
      「上層部」の中でギリギリ常識があるのは
      お前くらいだからな。
  event_lordforjustice_prologue_59:
    speaker: x
    en: I'll take that as a compliment.
    ko: 칭찬으로 듣겠네. 그래도….
    ja: |-
      はは、褒め言葉と受け取っておくよ。
      まあ、それはさておき…
  event_lordforjustice_prologue_60:
    speaker: x
    en: However, I believe we have a misunderstanding to clear up.
    ko: 착각은, 바로잡을 필요가 있겠군.
    ja: "――勘違いはしないでほしいのだが。"
  event_lordforjustice_prologue_61:
    speaker: k
    en: "..."
    ko: "……!!"
    ja: "……！！"
  event_lordforjustice_prologue_62:
    speaker: "<Narration>"
    en: The man's voice immediately drops all pretense of warmth and shifts to a cold
      and emotionless tone.
    ko: |-
      조금 전까지의 친근한 목소리는 온데간데없는,
      감정이 느껴지지 않는 싸늘한 목소리.
    ja: |-
      先ほどまでの親しみが感じられる声は消え、
      感情が消えた冷たい声が耳元に響いた
  event_lordforjustice_prologue_63:
    speaker: "<Narration>"
    en: K can feel the hairs on her body stand on end.
    ko: K는 머리카락이 쭈뼛 서는 것을 느꼈다.
    ja: Kは髪の毛が逆立つような感覚を覚えた
  event_lordforjustice_prologue_64:
    speaker: x
    en: The Judges are a committee. Everyone has an equal say and therefore all decisions
      are impartial.
    ko: |-
      [저지스]는 위원회일세.
      그러니 모두가 평등하게 의견을 내고, 조율해야 하지.
    ja: |-
      「ジャッジス」はいわば委員会だ。
      よって全員に等しく発言権が与えられ、
      公平に決定する必要がある。
  event_lordforjustice_prologue_65:
    speaker: x
    en: However, the letters in our code names also stand for something.
    ko: 하지만 우리의 코드네임은 숫자로 되어 있다네.
    ja: |-
      一方で、我々にはコードネームとして
      数字があてがわれ…
  event_lordforjustice_prologue_66:
    speaker: x
    en: To borrow the terminology you just used, one could say we're divided into
      the Upper and Lower Strata, yes.
    ko: |-
      거기다… 그래, 자네의 표현대로라면,
      [윗줄]과 [아랫줄]이 나뉘어 있기까지 해.
    ja: |-
      …そうだな。君の表現を借りるなら、
      「上層部」と「下層部」に分かれている。
  event_lordforjustice_prologue_67:
    speaker: x
    en: So tell me, what do you think that means?
    ko: 이게 뭘 뜻하는 것 같나?
    ja: これが何を意味しているか、分かるかな？
  event_lordforjustice_prologue_68:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_69:
    speaker: x
    en: Remember what your name stands for.
    ko: 자네의 이름에 담긴 의미와 사명을 기억하고, 받아들이게.
    ja: |-
      君の名前にこめられた意味と使命を思い出し、
      受け入れるように。
  event_lordforjustice_prologue_70:
    speaker: x
    en: Accept the consequences of the choice you made.
    ko: 자네가 고른… [선택]의 결과를.
    ja: 君が選んだ、「選択」の結果を。
  event_lordforjustice_prologue_71:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_72:
    speaker: x
    en: I'm waiting for a response.
    ko: 대답은?
    ja: 返事は？
  event_lordforjustice_prologue_73:
    speaker: k
    en: "... For the sake of a righteous judgment."
    ko: "…정의로운 판결을 위하여."
    ja: "…正義ある裁きのために。"
  event_lordforjustice_prologue_74:
    speaker: "<Narration>"
    en: "*Beep beep beep*"
    ko: 뚜- 뚜- 뚜-
    ja: ツーツーツー…
  event_lordforjustice_prologue_75:
    speaker: "<Narration>"
    en: The call disconnects. K grips the phone tightly and clenches her jaw.
    ko: K는 통화가 끊긴 핸드폰을 움켜쥐며 이를 악물었다.
    ja: |-
      Kは通話が切れた携帯電話を握りしめ、
      歯を食いしばった
  event_lordforjustice_prologue_76:
    speaker: afraidwoman
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_77:
    speaker: "<Narration>"
    en: Having overheard the call, a look of resignation washes over the woman sitting
      in front of K.
    ko: K 앞의 여성은, 통화 내용을 듣고 체념한 표정으로 앉아 있다.
    ja: |-
      Kの前にいた女性は通話の内容を聞き、
      諦めた表情で座りこんでいる
  event_lordforjustice_prologue_78:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_prologue_79:
    speaker: "<Narration>"
    en: Undisclosed location in the Ark. Perilous Siege safe house.
    ko: 방주 모처. 시지 패러리스 안전 가옥에서.
    ja: アーク某所。シージペリラスの隠れ家
  event_lordforjustice_prologue_80:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕!
    ja: バンッ！
  event_lordforjustice_prologue_81:
    speaker: "<Narration>"
    en: There's the sound of a single gunshot.
    ko: 한 발의 총성과.
    ja: 一発の銃声と
  event_lordforjustice_prologue_82:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 팅.
    ja: ピンッ
  event_lordforjustice_prologue_83:
    speaker: "<Narration>"
    en: Then the echo of a shell casing rolling on the floor.
    ko: 탄피가 굴러가는 소리가 울리고.
    ja: 薬きょうが転がる音が鳴り…
  event_lordforjustice_prologue_84:
    speaker: "<Narration>"
    en: "*Bang bang bang*"
    ko: 탕! 탕! 탕!
    ja: バンッ！バンッ！バンッ！
  event_lordforjustice_prologue_85:
    speaker: "<Narration>"
    en: Then several more shots.
    ko: 몇 번의 총소리가 더 이어졌다.
    ja: 続けざまに、数回の銃声が響いた
event_lordforjustice_01_s:
  event_lordforjustice_01_s_1:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_lordforjustice_01_s_2:
    speaker: "<Monologue>"
    en: It's that peculiar time of day
    ko: 정신없는 시간을 보낸 나른함과.
    ja: 忙しく時間を過ごした後の気だるさと
  event_lordforjustice_01_s_3:
    speaker: "<Monologue>"
    en: when the weariness of a full and busy day is intermingled
    ko: 알차게 시간을 썼다는 뿌듯함이 공존하는.
    ja: 充実した時間を過ごしたという満足感が共存する
  event_lordforjustice_01_s_4:
    speaker: "<Monologue>"
    en: with the satisfaction of having spent your time well.
    ko: 하루를 마무리하는 시간.
    ja: 一日を締めくくる時間がやってきた
  event_lordforjustice_01_s_5:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삑-
    ja: ピッ
  event_lordforjustice_01_s_6:
    speaker: announcer
    en: Here is today's breaking news.
    ko: 오늘의 사고 소식입니다.
    ja: 続いて、本日のニュース速報です。
  event_lordforjustice_01_s_7:
    speaker: announcer
    en: Traces of illegal drug trafficking were found in an office in the Ark's western
      district.
    ko: 방주 서구의 한 사무실에서, 불법 약물을 유통한 흔적이 발견되었습니다.
    ja: |-
      アーク西区にある、とある事務所にて
      違法薬物の取引が行われていたと
      みられる痕跡が発見されました。
  event_lordforjustice_01_s_8:
    speaker: announcer
    en: The building in question was completely destroyed, leading the A.C.P.U. to
      suspect inter-organizational conflict...
    ko: |-
      흔적이 발견된 사무실은 완전히 파괴되어 있었으며,
      A.C.P.U.에서는 조직 간의 알력 다툼으로보고 수사를….
    ja: |-
      現場の事務所は激しく破壊されており、
      A.C.P.U.では組織間の抗争に
      よるものと見て捜査を…
  event_lordforjustice_01_s_9:
    speaker: "<Self>"
    en: Things out there are getting grim...
    ko: 흉흉하구만….
    ja: 物騒だな…
  event_lordforjustice_01_s_10:
    speaker: "<Monologue>"
    en: I absentmindedly watch the TV for a while, then get up to take a shower.
    ko: 잠시 TV를 틀어놓고 멍하니 있다가, 샤워를 하기 위해 일어났다.
    ja: |-
      しばらくテレビをぼーっと観た後、
      シャワーをするために立ち上がった
  event_lordforjustice_01_s_11:
    speaker: "<Monologue>"
    en: However...
    ko: 그런데….
    ja: ところが…
  event_lordforjustice_01_s_12:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_s_13:
    speaker: "<Monologue>"
    en: I sense that someone is already in the bathroom.
    ko: 샤워실에서 무언가 인기척이 느껴진다.
    ja: "…シャワー室から人の気配がする"
  event_lordforjustice_01_s_14:
    speaker: "<Monologue>"
    en: In the past, this would have caused me to panic.
    ko: 예전이라면 당황했겠지만….
    ja: 昔なら動揺しただろうが…
  event_lordforjustice_01_s_15:
    speaker: "<Self>"
    en: But that was then, and this is now!
    ko: "…이젠 예전의 내가 아니지!"
    ja: "…今の私は、昔の私とは違う！"
  event_lordforjustice_01_s_16:
    speaker: "<Monologue>"
    en: I smile and open the door.
    ko: 반갑게 웃으며 샤워실 문을 열었다.
    ja: |-
      そう心の中で唱え、
      笑顔でシャワー室のドアを開けた
  event_lordforjustice_01_s_17:
    speaker: k
    en: Oh, hi.
    ko: "…어. 왔냐."
    ja: "…お、帰ってきたか。"
  event_lordforjustice_01_s_18:
    speaker: "<Self>"
    en: "?!"
    ko: "!!!"
    ja: "！！！"
  event_lordforjustice_01_s_19:
    speaker: k
    en: I wanted to borrow your shower for a minute.
    ko: 잠깐 좀 빌렸어.
    ja: ちょっと借りたぞ。
  event_lordforjustice_01_s_20:
    speaker: k
    en: Don't worry. I'll be out of your hair soon enough.
    ko: 알아서 정리하고 나갈테니까, 신경 쓰지 마.
    ja: |-
      ちゃんと片付けとくから、
      安心しな。
  event_lordforjustice_01_s_21:
    speaker: "<Monologue>"
    en: K's voice seems dispirited, and I can see bloodstains on her face.
    ko: 힘없이 중얼거리듯 말하는 K의 얼굴에 핏자국이 보인다.
    ja: |-
      弱々しく呟くように話すKの顔には、
      血のあとのようなものが見えた
  event_lordforjustice_01_s_22:
    speaker: "<Self>"
    en: Are you okay? You're not hurt, are you?
    ko: 괜찮아? 다친거야?
    ja: 大丈夫か？ケガでもしたのか？
  event_lordforjustice_01_s_23:
    speaker: "<Monologue>"
    en: I rush over to check on her.
    ko: 급히 K의 상태를 확인했다.
    ja: あわててKの状態を確認しようとした
  event_lordforjustice_01_s_24:
    speaker: k
    en: Urgh... take it easy. That hurts.
    ko: 윽… 살살 좀 해. 아프다고.
    ja: っつ…！少しは加減しろって。
  event_lordforjustice_01_s_25:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_s_26:
    speaker: "<Monologue>"
    en: I'm not sensing K's usual abrasive energy.
    ko: 그렇게 말하는 K에게서는, 평소의 날 선 분위기가 느껴지지 않는다.
    ja: |-
      そう言うKからは、
      普段のとげとげしい雰囲気は感じられない
  event_lordforjustice_01_s_27:
    speaker: "<Self>"
    en: First thing first, let's tend to these injuries.
    ko: "…우선 치료부터 하자."
    ja: "…とりあえず、まずは治療を…"
  event_lordforjustice_01_s_28:
    speaker: k
    en: And how do you intend on doing that?
    ko: 치료? 어떻게?
    ja: 治療？どうやって？
  event_lordforjustice_01_s_29:
    speaker: "<Self>"
    en: I was going to call Mary or Pepper...
    ko: 메어리나 페퍼를 불러서….
    ja: メアリーやペッパーを呼んで…
  event_lordforjustice_01_s_30:
    speaker: k
    en: And notify the entire world about Perilous Siege and what we do?
    ko: 시지 패러리스 니케가 이렇게 된 걸 동네방네 광고라도 하게?
    ja: |-
      はっ…シージペリラスのニケが
      こんな有様になってますって、
      街じゅうに宣伝するつもりか？
  event_lordforjustice_01_s_31:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_s_32:
    speaker: k
    en: Don't worry about me. I'm not badly hurt.
    ko: "…됐어. 그렇게 크게 다친 건 아니니까 냅둬."
    ja: |-
      …大丈夫だって。
      大した傷じゃないし、ほっといてくれ。
  event_lordforjustice_01_s_33:
    speaker: k
    en: I just need to stay here for a moment...
    ko: 잠깐 있으면….
    ja: 少し休めば…
  event_lordforjustice_01_s_34:
    speaker: k
    en: and then... I'll be... fine...
    ko: 잠깐만… 이러고 있으면… 괜찮아질….
    ja: すぐに…よくなるは…
  event_lordforjustice_01_s_35:
    speaker: "<Self>"
    en: K!
    ko: K!
    ja: K！
  event_lordforjustice_01_s_36:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 찰박.
    ja: パシャッ…
  event_lordforjustice_01_s_37:
    speaker: "<Monologue>"
    en: K's eyes close as she slumps over, and I rush over to catch her before she
      falls.
    ko: 눈을 감은 채 기우는 K의 몸을 급히 붙잡았다.
    ja: |-
      目を閉じたまま倒れかけたKの体を
      あわてて支えた
  event_lordforjustice_01_s_38:
    speaker: "<Self>"
    en: Let me get you into the other room.
    ko: "…일단 방으로 가자. 옮겨줄게."
    ja: "…まずは部屋に行こう。運んでやる"
  event_lordforjustice_01_s_39:
    speaker: "<Monologue>"
    en: I try to lift her...
    ko: 그대로 K를 안아 올리려고 했지만.
    ja: |-
      そう言って、
      そのままKを抱き上げようとしたが…
  event_lordforjustice_01_s_40:
    speaker: "<Self>"
    en: Hnnrrgh!
    ko: 큭…?!
    ja: くっ…！？
  event_lordforjustice_01_s_41:
    speaker: "<Monologue>"
    en: but she's unexpectedly heavy.
    ko: 상상이상의 무게에 당황하고 말았다.
    ja: 想像以上の重さに、まるで持ち上がらなかった
  event_lordforjustice_01_s_42:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 찰박.
    ja: パシャッ…
  event_lordforjustice_01_s_43:
    speaker: k
    en: Careful. I'm on a mission of... great consequence.
    ko: 아서라. 나 아무래도 특급임무 중이었던 것 같거든…?
    ja: |-
      やめとけって。
      特級任務の最中だったのか…
  event_lordforjustice_01_s_44:
    speaker: k
    en: They outfit us with... special bodies for such missions.
    ko: 이럴 때 쓰는 바디는… 특수해.
    ja: 今の私のボディは…ちょっと特殊なんだよ。
  event_lordforjustice_01_s_45:
    speaker: k
    en: They're completely different from those you pick up without a care
    ko: 네가 연애하면서… 아무렇지도 않게 번쩍번쩍 들어 올리는….
    ja: お前がデート中に…平然と抱き上げるような…
  event_lordforjustice_01_s_46:
    speaker: k
    en: when you're out gallivanting with your Nikke girlfriends.
    ko: 그런 평범한… 일상용 바디랑은 비교도 안 된다고….
    ja: |-
      そういう平凡な…
      日常向けのボディとは比べ物にならないんだぞ…
  event_lordforjustice_01_s_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_s_48:
    speaker: "<Monologue>"
    en: K curls up inside the tub.
    ko: K는 다시 욕조 안에서 몸을 웅크렸다.
    ja: Kはもう一度浴槽の中でうずくまった
  event_lordforjustice_01_s_49:
    speaker: k
    en: Leave me be. I'll feel better soon, and then I'll be gone.
    ko: "…냅두라니까. 기운 좀 차리면 내 발로 나갈 테니까."
    ja: |-
      …だからほっといてくれって。
      元気になったら、自力でここから出るから。
  event_lordforjustice_01_s_50:
    speaker: k
    en: I'm sorry for making a mess of your bathroom...
    ko: 뭐. 샤워실 더럽힌 건 미안하게 됐….
    ja: |-
      まあ、シャワー室を汚しちまったのは
      悪かっ…
  event_lordforjustice_01_s_51:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩.
    ja: ドサッ
  event_lordforjustice_01_s_52:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_s_53:
    speaker: k
    en: What are you doing?
    ko: "…뭐 하냐?"
    ja: "…何してんだ？"
  event_lordforjustice_01_s_54:
    speaker: "<Self>"
    en: I'm going to stay here until you feel better.
    ko: 기운 차릴 때까지 여기 있을게.
    ja: なら、元気になるまでここで待っている
  event_lordforjustice_01_s_55:
    speaker: "<Monologue>"
    en: K stares blankly as I sit next to the tub.
    ko: K는 욕조 옆에 앉은 나를 멍하니 바라보다가.
    ja: Kは浴槽の横に座った私をぼーっと見つめ
  event_lordforjustice_01_s_56:
    speaker: k
    en: "..."
    ko: "………."
    ja: "………"
  event_lordforjustice_01_s_57:
    speaker: k
    en: Whatever. Do as you please.
    ko: "…뭐. 그러던가."
    ja: "…好きにしろ。"
  event_lordforjustice_01_s_58:
    speaker: "<Monologue>"
    en: After responding bluntly, she slowly closes her eyes.
    ko: 퉁명스럽게 대답하곤 천천히 눈을 감았다.
    ja: |-
      ぶっきらぼうにそう答えると、
      ゆっくりと目を閉じた
event_lordforjustice_01_e:
  event_lordforjustice_01_e_1:
    speaker: "<Monologue>"
    en: A while later, K has managed to clean herself up.
    ko: 잠시 후.
    ja: しばらくして
  event_lordforjustice_01_e_2:
    speaker: "<Monologue>"
    en: I then summon up every last ounce of strength I have and attempt to help move
      her.
    ko: |-
      스스로 몸을 닦을 정도로는 기운을 차린 K를,
      젖 먹던 힘까지 들여 부축한 뒤 침대까지 옮겼다.
    ja: |-
      自力で体を拭けるほどに回復したKを、
      ありったけの力を振り絞ってベッドまで運んだ
  event_lordforjustice_01_e_3:
    speaker: "<Self>"
    en: Phew...
    ko: 헉… 허억….
    ja: はあ…はああ…
  event_lordforjustice_01_e_4:
    speaker: k
    en: Are you okay?
    ko: "…괜찮냐?"
    ja: "…大丈夫か？"
  event_lordforjustice_01_e_5:
    speaker: k
    en: Sounds like you're the one who needs to lie down, not me.
    ko: 내가 아니라 네가 누워야 되는 거 아냐?
    ja: 私より、お前が休んだ方がいいんじゃないか？
  event_lordforjustice_01_e_6:
    speaker: "<Self>"
    en: I-I'm fine... Just gotta catch my breath...
    ko: 괘, 괜찮아… 잠깐만 쉬면….
    ja: だ、大丈夫だ…少し休めば…
  event_lordforjustice_01_e_7:
    speaker: k
    en: "... Fine."
    ko: "…그래 그럼."
    ja: "…じゃあ、ちょっと休め。"
  event_lordforjustice_01_e_8:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭.
    ja: ゴロン…
  event_lordforjustice_01_e_9:
    speaker: "<Monologue>"
    en: After giving a perfunctory response, K turns her back to me.
    ko: K는 힘없이 대답하곤, 내게 등을 보이고 돌아누웠다.
    ja: Kは力なく答えると、私に背を向け横になった
  event_lordforjustice_01_e_10:
    speaker: k
    en: "... @UserName."
    ko: "……@UserName."
    ja: "…@UserName。"
  event_lordforjustice_01_e_11:
    speaker: "<Self>"
    en: Yes?
    ko: 응.
    ja: なんだ？
  event_lordforjustice_01_e_12:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_13:
    speaker: k
    en: I think I've lost my memory.
    ko: "…나, 기억을 잃은 것 같아."
    ja: "…もしかしたらだけど、記憶喪失かもしれない。"
  event_lordforjustice_01_e_14:
    speaker: "<Self>"
    en: What do you mean?
    ko: "…뭐라고?"
    ja: "…何だって？"
  event_lordforjustice_01_e_15:
    speaker: k
    en: Not quite the same as Arcana.
    ko: 얼마 전에 걔.
    ja: ほら、この前機密保管庫でお前と一緒にいた…
  event_lordforjustice_01_e_16:
    speaker: k
    en: It's not all gone.
    ko: 아르카나처럼 싹 날아간 건 아닌데.
    ja: |-
      …アルカナみたいに
      丸ごと吹っ飛んだわけじゃないんだけど。
  event_lordforjustice_01_e_17:
    speaker: k
    en: But there are bits and pieces missing.
    ko: 기억이 듬성듬성 이가 빠져 있어.
    ja: なんていうか、記憶がとぎれとぎれなんだ。
  event_lordforjustice_01_e_18:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_19:
    speaker: k
    en: On top of that, I have no recollection whatsoever of the past week.
    ko: 게다가 최근 1주일 정도의 기억은 아예 없고.
    ja: |-
      しかも、この一週間くらいの記憶が
      まったくなくて。
  event_lordforjustice_01_e_20:
    speaker: k
    en: The last thing I remember is formulating a plan to collect intel for a top-level
      mission.
    ko: 특급 임무를 받고 정보 수집 계획을 세우던 게 마지막 기억이야.
    ja: |-
      特級任務を受けて、
      情報収集の計画を立ててたのを最後に
      記憶がプッツリとぎれてんだよな。
  event_lordforjustice_01_e_21:
    speaker: k
    en: The next thing I knew, I woke up inside the safe house, and everything in-between
      is a blank.
    ko: 그리고 나서 정신을 차려보니까, 방주에 있는 우리 안전 가옥이더라.
    ja: で、気がついたらアークの隠れ家にいた。
  event_lordforjustice_01_e_22:
    speaker: "<Self>"
    en: Do you remember how you got your injuries?
    ko: "…상처는 어떻게 된 거야?"
    ja: "…その傷はどうやってできたんだ？"
  event_lordforjustice_01_e_23:
    speaker: k
    en: Not a clue.
    ko: 그것도… 기억 안 나.
    ja: それも…思い出せない。
  event_lordforjustice_01_e_24:
    speaker: k
    en: They don't appear to be severe, and certainly don't inhibit my movements.
    ko: 애초에 상처 때문에 못 움직이는 것도 아니고.
    ja: |-
      そもそも、傷のせいで
      動けなかったわけじゃないっていうか…
  event_lordforjustice_01_e_25:
    speaker: "<Monologue>"
    en: Like K said, the injuries do appear only to be surface-level cuts and scrapes.
    ko: K의 말대로, 머리의 상처는 피부가 조금 찢어진 정도에 불과했다.
    ja: |-
      改めて傷の様子を見ると、Kの言う通り
      頭部の傷は皮膚が少し裂けている程度だった
  event_lordforjustice_01_e_26:
    speaker: k
    en: It's hard to explain. It's like my body is refusing to move.
    ko: 뭐랄까. 몸이 움직이는 걸 거부하는 느낌이라고 해야 되나.
    ja: |-
      なんか、おかしいんだ。
      こう…体が動くのを拒否してる感じっていうか。
  event_lordforjustice_01_e_27:
    speaker: k
    en: At any rate, that's the situation.
    ko: "…어쨌든 그런 상태였는데."
    ja: "…とにかく、そういう状態だったうえに…"
  event_lordforjustice_01_e_28:
    speaker: k
    en: I also can't get in touch with any of the Upper Strata or D.
    ko: "[윗선]이랑 D 전부 연락이 안 되더라."
    ja: |-
      「上層部」ともDとも連絡が
      取れないままなんだ。
  event_lordforjustice_01_e_29:
    speaker: "<Self>"
    en: Do you think it could be...
    ko: 설마….
    ja: まさか…
  event_lordforjustice_01_e_30:
    speaker: k
    en: I doubt it.
    ko: "…네가 생각하는 그런 건 아닐 거야."
    ja: |-
      …多分だけど、お前が考えてるようなことじゃ
      ないから。
  event_lordforjustice_01_e_31:
    speaker: k
    en: If they wanted me dead, I wouldn't be here right now.
    ko: |-
      이제 쓸모없다고 처분당할 거였으면,
      나는 지금 여기 누워있지도 못했어.
    ja: |-
      要らなくなって処分されるはずだったなら、
      今頃ここにいるはずないだろ？
  event_lordforjustice_01_e_32:
    speaker: k
    en: The Judges aren't nearly that sloppy.
    ko: "[저지스]의 일 처리가 그렇게 만만하진 않으니까."
    ja: "「ジャッジス」はそんなに甘くない。"
  event_lordforjustice_01_e_33:
    speaker: "<Self>"
    en: So what does it mean?
    ko: 그렇다는 건….
    ja: なら、いったい…
  event_lordforjustice_01_e_34:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_35:
    speaker: k
    en: Probably just one of those things.
    ko: 그냥… 흔히 있는 해프닝이겠지.
    ja: |-
      …単に、ちょっとしたアクシデントでも
      あったんだろ。
  event_lordforjustice_01_e_36:
    speaker: k
    en: Something the Judges consider perfectly normal.
    ko: 그것도 저지스에겐 상정 범위 내의.
    ja: それも、ジャッジスにとっては想定の範囲内の。
  event_lordforjustice_01_e_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_38:
    speaker: "<Choice>"
    en: You don't seem so certain.
    ko: "…확신이 없어 보이네."
    ja: "…それにしては、自信がなさそうだな"
  event_lordforjustice_01_e_39:
    speaker: "<Choice>"
    en: Do you really believe that?
    ko: "…정말로 그렇게 생각하고 있어?"
    ja: "…本当にそう思っているのか？"
  event_lordforjustice_01_e_40:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_41:
    speaker: k
    en: What other choice do I have?
    ko: 별수 없잖아. 그럼 뭐 어떡하는데.
    ja: 仕方ないだろ。他に考えられないんだから。
  event_lordforjustice_01_e_42:
    speaker: k
    en: Throw my hands up and wait for things to unfold?
    ko: 그냥 자포자기하고 기다려?
    ja: |-
      自暴自棄になって、ただボーッと
      待ってるわけにもいかないだろ？
  event_lordforjustice_01_e_43:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_44:
    speaker: k
    en: I've got to proceed like usual.
    ko: "…그냥 적당히 해결하고, 수습한 다음에."
    ja: "…テキトーに解決して、いつも通りになったら"
  event_lordforjustice_01_e_45:
    speaker: k
    en: Wrap things up, leave no loose ends, and deal with any aftermath if and when
      it comes.
    ko: 할 일을 하면 될 뿐이야.
    ja: また任務をこなす日々に戻ればいいだけさ。
  event_lordforjustice_01_e_46:
    speaker: "<Self>"
    en: Is that how you usually operate?
    ko: "…하던 대로?"
    ja: "…今まで通りにか？"
  event_lordforjustice_01_e_47:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_48:
    speaker: k
    en: Yes.
    ko: "…어. 하던 대로."
    ja: "…ああ、今まで通りにな。"
  event_lordforjustice_01_e_49:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭.
    ja: ノソ…
  event_lordforjustice_01_e_50:
    speaker: "<Monologue>"
    en: Perhaps feeling a bit more energized from our conversation, K sits up on the
      bed.
    ko: 이야기를 하면서 기운을 차렸는지, K가 침대에서 상반신을 일으켰다.
    ja: |-
      話をしているうちに体が回復したのか、
      Kはベッドから上半身を起こした
  event_lordforjustice_01_e_51:
    speaker: k
    en: Speaking of which...
    ko: "…그래서 말인데."
    ja: "…そういうわけで。"
  event_lordforjustice_01_e_52:
    speaker: "<Self>"
    en: Heading back to work?
    ko: 저번처럼 [일하러] 가자고?
    ja: "…もう「仕事」に復帰するつもりか？"
  event_lordforjustice_01_e_53:
    speaker: k
    en: You catch on quick.
    ko: 말이 빨라서 좋네.
    ja: お、話が早いね～？
  event_lordforjustice_01_e_54:
    speaker: k
    en: I guess...
    ko: 몇 번 해봤다고 이렇게 알아서 척척이라니.
    ja: さすがのお前も慣れてきたってか？
  event_lordforjustice_01_e_55:
    speaker: k
    en: humans are intuitive creatures after all.
    ko: 역시 인간은 적응의 동물이라 이건가?
    ja: まっ、人間って環境に適応する生き物らしいし？
  event_lordforjustice_01_e_56:
    speaker: "<Self>"
    en: Yeah, but I'm not so sure I want to get used to what's going on here...
    ko: 이런 거엔 별로 적응하고 싶지 않기는 한데….
    ja: こんなことに適応したくはないが…
  event_lordforjustice_01_e_57:
    speaker: "<Narration>"
    en: "*Knock knock*"
    ko: 똑똑.
    ja: コンコン
  event_lordforjustice_01_e_58:
    speaker: "<Self>"
    en: Who is it?
    ko: 누구야?
    ja: "…？誰だ？"
  event_lordforjustice_01_e_59:
    speaker: arcana
    en: Take a guess!
    ko: 누구게~요~
    ja: ふふ、誰でしょ～か？
  event_lordforjustice_01_e_60:
    speaker: "<Self>"
    en: Just a moment.
    ko: 어… 잠깐만.
    ja: "…すまない、少し待ってくれ"
  event_lordforjustice_01_e_61:
    speaker: k
    en: Tell her to come in. She already knows everything.
    ko: 들어오라 그래. 쟤는 어차피 알 거 다 알잖아.
    ja: |-
      別にいいって。
      どうせあいつももう知ってるだろ。
  event_lordforjustice_01_e_62:
    speaker: "<Self>"
    en: All right.
    ko: "…알았어."
    ja: "…分かった"
  event_lordforjustice_01_e_63:
    speaker: "<Self>"
    en: Come in.
    ko: 들어와.
    ja: 入っていいぞ
  event_lordforjustice_01_e_64:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_lordforjustice_01_e_65:
    speaker: arcana
    en: Hel... gah!
    ko: 안녀하세에에에에에에?!
    ja: こんにちぃぃぃぃ！？
  event_lordforjustice_01_e_66:
    speaker: "<Monologue>"
    en: Arcana walks in with a beaming smile, then promptly spins around upon seeing
      K.
    ko: 환하게 웃으며 들어오던 아르카나가 빙글 뒤로 돌았다.
    ja: |-
      笑顔で入ってきたアルカナが
      あわててこちらに背を向けた
  event_lordforjustice_01_e_67:
    speaker: arcana
    en: Er... Y-you two go ahead and have fun.
    ko: 조, 좋은 시간 되세요~
    ja: お、お邪魔しました～！
  event_lordforjustice_01_e_68:
    speaker: "<Self>"
    en: It's fine. Come on in.
    ko: "…괜찮으니까 들어와."
    ja: "…大丈夫だから、入ってくれ"
  event_lordforjustice_01_e_69:
    speaker: arcana
    en: Sorry, but...
    ko: 네에?! 시, 싫어요!
    ja: はい！？け、結構です！
  event_lordforjustice_01_e_70:
    speaker: arcana
    en: I kinda hoped it'd be just the two of us being intimate, whispering sweet
      nothings to each other and all that stuff.
    ko: |-
      저 처음은 그쪽이랑 단둘이,
      꽁냥꽁냥 사랑을 속삭이면서가 좋다구요!
    ja: |-
      は、ハジメテは二人きりの空間で
      いちゃいちゃしながら愛を語りたいと
      いいますかぁ…！
  event_lordforjustice_01_e_71:
    speaker: "<Self>"
    en: "... It's not what you think."
    ko: 그런 거 아니야….
    ja: だから誤解だ…
  event_lordforjustice_01_e_72:
    speaker: "<Monologue>"
    en: After a while, Arcana finally calms down and explains why she came.
    ko: 잠시 후. 겨우 진정한 아르카나에게 용건을 들었다.
    ja: |-
      …しばらくして、
      ようやく落ち着いたアルカナに用件を聞いた
  event_lordforjustice_01_e_73:
    speaker: "<Self>"
    en: There was a break-in at the library?
    ko: "…도서관에 침입이 있었다고?"
    ja: "…図書館に侵入者が現れただと？"
  event_lordforjustice_01_e_74:
    speaker: arcana
    en: The Forbidden Library, to be precise.
    ko: 정확히는 도서관이 아니라 금서고 쪽.
    ja: はい。正確には、図書館ではなく禁書庫の方で…
  event_lordforjustice_01_e_75:
    speaker: arcana
    en: My room isn't the only entrance into that place, you see.
    ko: 그거, 사실 금서고 출입구는 제 방 말고도 몇 개 더 있거든요?
    ja: |-
      禁書庫の出入口は私の仕事部屋以外にも
      いくつかありまして、
  event_lordforjustice_01_e_76:
    speaker: arcana
    en: Normally, they're tightly sealed, but...
    ko: 평소에는 엄~청 엄중하게 봉인되어 있기는 한데….
    ja: 普段は厳重に施錠されてるんですが…
  event_lordforjustice_01_e_77:
    speaker: "<Monologue>"
    en: Arcana shows us a picture of a metal door that's been split open like a sheet
      of paper.
    ko: 아르카나가 종이짝처럼 찢겨 나간 철문의 사진을 보여주었다.
    ja: |-
      アルカナがまるで引き裂かれた紙のように
      壊された金属製の扉の写真を差し出した
  event_lordforjustice_01_e_78:
    speaker: arcana
    en: One of them ended up like this.
    ko: 그중 하나가 이렇게 되어 있었어요.
    ja: |-
      そのうちの1つが、
      こんなことになっていたんです。
  event_lordforjustice_01_e_79:
    speaker: "<Self>"
    en: You call that a break-in?
    ko: 이건 침입이라기엔….
    ja: これでは侵入というより…
  event_lordforjustice_01_e_80:
    speaker: arcana
    en: I know. The word barely does it justice.
    ko: 너무 요란하죠?
    ja: はい、ずいぶん派手にこじ開けられてますよね？
  event_lordforjustice_01_e_81:
    speaker: arcana
    en: The other thing is that the alarm never went off.
    ko: 그런데요. 경보가 안 울렸어요.
    ja: なのに、警報が鳴らなかったんです。
  event_lordforjustice_01_e_82:
    speaker: arcana
    en: I only discovered it when I didn't have anything else to d... I mean, when
      I was making my rounds.
    ko: 그래서 어제 할일이 없어서… 가 아니라, 업무차 돌아보다가 우연히 발견했구요.
    ja: |-
      ちょうど昨日はヒマだったので…じゃなくて！
      業務の一環として巡回をしてたら、
      偶然発見しまして。
  event_lordforjustice_01_e_83:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_84:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_01_e_85:
    speaker: "<Monologue>"
    en: K and I exchange a silent glance.
    ko: K와 말없이 시선을 교환했다.
    ja: Kと無言で視線を交わした
  event_lordforjustice_01_e_86:
    speaker: k
    en: Let's go.
    ko: "…가보자."
    ja: "…行ってみよう。"
  event_lordforjustice_01_e_87:
    speaker: "<Self>"
    en: Are you thinking what I'm thinking?
    ko: 역시 그렇지?
    ja: やはり気になるか？
  event_lordforjustice_01_e_88:
    speaker: k
    en: Yeah.
    ko: 어.
    ja: 当たり前だろ。
  event_lordforjustice_01_e_89:
    speaker: k
    en: A break-in at the Forbidden Library, and the memories of a Perilous Siege
      member mysteriously vanishing?
    ko: 금서고에 침입자가 발생하고, 시지 패러리스 니케의 기억이 사라졌다.
    ja: |-
      禁書庫に侵入者が現れたうえに、
      シージペリラスのニケの記憶が消えている。
  event_lordforjustice_01_e_90:
    speaker: k
    en: There's no way it's all a coincidence.
    ko: 이런 사건이 우연히 겹칠 리 없지.
    ja: こんな偶然、そうそう重なるはずないだろ。
  event_lordforjustice_01_e_91:
    speaker: arcana
    en: Did you say you lost your memory?
    ko: 앗! 기억을 잃으신 거예요??
    ja: えっ、記憶を失ったんですか！？
  event_lordforjustice_01_e_92:
    speaker: arcana
    en: I've got a great method that works for me whenever my memory gets wiped.
    ko: 있죠. 제가 기억 잃었을 때 해서 효과를 본 방법이 있거든요?
    ja: |-
      でしたら、私が記憶を失った時に
      効果的だった方法がありまして…！
  event_lordforjustice_01_e_93:
    speaker: arcana
    en: If you want, I could...
    ko: 필요하시면 그거라도 알려드릴….
    ja: もしよろしければ教えて差し上げ…
  event_lordforjustice_01_e_94:
    speaker: k
    en: Keep it to yourself.
    ko: 너나 많이 해.
    ja: 余計なお世話だ。
  event_lordforjustice_01_e_95:
    speaker: arcana
    en: Oh... okay...
    ko: 힝.
    ja: しょぼん…
  event_lordforjustice_01_e_96:
    speaker: "<Self>"
    en: "... Let's head to the library."
    ko: "…일단 도서관으로 가보자."
    ja: "…とりあえず、図書館に行ってみよう"
event_lordforjustice_02_s:
  event_lordforjustice_02_s_1:
    speaker: "<Monologue>"
    en: Arcana takes us to the scene of the crime.
    ko: 아르카나의 안내를 받아 사건 현장에 도착했다.
    ja: アルカナの案内のもと、事件現場に到着した
  event_lordforjustice_02_s_2:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_s_3:
    speaker: "<Monologue>"
    en: A bulky iron door thicker than my body has been torn apart like a piece of
      cloth.
    ko: 내 몸보다도 두꺼워 보이는 철문이, 구겨지듯 찢겨 있다.
    ja: |-
      私の体よりもはるかに厚そうな鉄扉が、
      くしゃくしゃになった紙のように
      引き裂かれている
  event_lordforjustice_02_s_4:
    speaker: "<Self>"
    en: Is this passage normally unused?
    ko: "…이 통로, 평소에는 아예 안 쓰는 거야?"
    ja: "…この通路は普段は使われていないのか？"
  event_lordforjustice_02_s_5:
    speaker: arcana
    en: I personally don't use it, no.
    ko: 정확히 말하면 [저는] 안 쓰는 통로에요.
    ja: |-
      正確に言うと、
      「私は」使っていない通路になりますね。
  event_lordforjustice_02_s_6:
    speaker: "<Self>"
    en: But others do?
    ko: 다른 사람은 쓰고?
    ja: つまり、他の人は使ってると？
  event_lordforjustice_02_s_7:
    speaker: arcana
    en: During emergencies, yes.
    ko: 긴급상황일 경우에는요.
    ja: |-
      うーん…というより、
      緊急の際に使われてる感じです。
  event_lordforjustice_02_s_8:
    speaker: "<Monologue>"
    en: Arcana glances over at K, who is examining the door.
    ko: 아르카나의 시선이 철문을 살펴보고 있는 K에게 향했다.
    ja: アルカナの視線が扉を見つめるKに向けられた
  event_lordforjustice_02_s_9:
    speaker: "<Self>"
    en: You mean...
    ko: "…아."
    ja: "…そういうことか"
  event_lordforjustice_02_s_10:
    speaker: arcana
    en: Yes. This passage is occasionally used by members of Perilous Siege. It's
      connected to the path that I usually take.
    ko: |-
      네. 시지 패러리스 분들이 이용하는 통로거든요.
      중간에서 저랑 그쪽이 쓰는 통로랑 연결되어 있구요.
    ja: |-
      はい。この通路はシージペリラスの方たちが
      緊急時に使うもので、途中で私とあなたが
      使っている通路と合流する作りになってます。
  event_lordforjustice_02_s_11:
    speaker: arcana
    en: Neither I nor anyone else uses it often,
    ko: 근데 뭐 말이 그렇지, 사실상 거의 안 쓰는 곳인 거라서.
    ja: ですが、実際はほとんど使われていないので…
  event_lordforjustice_02_s_12:
    speaker: arcana
    en: so we employ additional security measures to keep an eye on it.
    ko: 그만큼 보안이 더 철저한데….
    ja: セキュリティは万全のはずなのですが…
  event_lordforjustice_02_s_13:
    speaker: "<Self>"
    en: Did you report it?
    ko: 보고는 했어?
    ja: 報告はしたのか？
  event_lordforjustice_02_s_14:
    speaker: arcana
    en: Yes, as soon as I saw it.
    ko: 그게요. 일단 보자마자 바로 보고하긴 했거든요?
    ja: はい、発見したあとすぐに報告しました。
  event_lordforjustice_02_s_15:
    speaker: arcana
    en: But for some reason, I haven't received any response yet.
    ko: 근데 무슨 일이 있는 건지, 아직 답변이 없어요.
    ja: ですがどういうわけか、まだ何の返答もなくて…
  event_lordforjustice_02_s_16:
    speaker: arcana
    en: I started wondering what I should do, and then I figured that since you're
      connected with this place as well...
    ko: 그래서 어떻게 해야 하나 하다가, 그쪽은 일단 관계자니까….
    ja: |-
      それでどうしたものかと頭を抱えたあと、
      関係者であるあなたに報告すべく訪ねたんです。
  event_lordforjustice_02_s_17:
    speaker: "<Self>"
    en: That was smart of you. I'll ask the higher-ups myself... wait.
    ko: 응. 잘했어. 나도 따로 위에다 말해볼… 아.
    ja: |-
      そういうことだったのか。
      なら、私からも報告し…
  event_lordforjustice_02_s_18:
    speaker: "<Monologue>"
    en: I suddenly remember K mentioning how she was unable to reach D.
    ko: K가 D와 연락이 되지 않는다는 말을 했던 게 떠올랐다.
    ja: |-
      そう言いかけた瞬間、KがDと連絡が取れないと
      言っていたことを思い出した
  event_lordforjustice_02_s_19:
    speaker: "<Narration>"
    en: "*Ring*"
    ko: 뚜르르르-
    ja: プルルル…
  event_lordforjustice_02_s_20:
    speaker: "<Self>"
    en: "... No answer."
    ko: "…안 받네."
    ja: "…出ないな"
  event_lordforjustice_02_s_21:
    speaker: k
    en: From D, you mean? She's probably on a mission.
    ko: D? 임무중이겠지, 뭐.
    ja: Dに掛けてんのか？任務中だろ、どうせ。
  event_lordforjustice_02_s_22:
    speaker: k
    en: She's always hard to get a hold of.
    ko: 걔는 원래 제대로 연락되는 일이 드물어.
    ja: |-
      あいつとマトモに連絡が通じたことなんて
      ほとんどなかったし。
  event_lordforjustice_02_s_23:
    speaker: "<Self>"
    en: Really? She always answers my calls.
    ko: 그래? 내 연락은 잘 받던데.
    ja: そうなのか？私が掛けた時はすぐに出ていたが…
  event_lordforjustice_02_s_24:
    speaker: arcana
    en: Maybe she's more proactive about
    ko: 음… 남편 연락이라서?
    ja: |-
      そうなんですか？
      やっぱり、夫からの電話だからでしょうか？
  event_lordforjustice_02_s_25:
    speaker: arcana
    en: answering calls from her husband.
    ko: 아무리 그래도 그건 받아야죠.
    ja: |-
      いくら何でも、夫からの電話に出ないなんて
      ありえませんし。
  event_lordforjustice_02_s_26:
    speaker: "<Self>"
    en: "... I don't think that's it."
    ko: "…그런 거 아니라니까."
    ja: そういうことではないと思うが…
  event_lordforjustice_02_s_27:
    speaker: k
    en: Anyway, let's go inside.
    ko: 됐고, 안으로 가보자.
    ja: ハイハイ、さっさと中に入るぞ。
  event_lordforjustice_02_s_28:
    speaker: arcana
    en: Inside?
    ko: 안쪽으로요?
    ja: えっ、中に入るんですか？
  event_lordforjustice_02_s_29:
    speaker: k
    en: Whoever did this didn't do it because they were bored.
    ko: 심심해서 이렇게 문을 박살 냈겠어?
    ja: |-
      あったりまえだろ？
      暇潰しのためにこんな派手に壊す奴がいる？
  event_lordforjustice_02_s_30:
    speaker: k
    en: They were looking for something.
    ko: 안에서 뭘 찾으려고 했으니까 그랬겠지.
    ja: |-
      どう見ても、中にある何かが欲しくて
      壊したに決まってるだろ？
  event_lordforjustice_02_s_31:
    speaker: arcana
    en: That's true, but...
    ko: 그건 그런데요….
    ja: それはそうですけど…
  event_lordforjustice_02_s_32:
    speaker: "<Self>"
    en: Is there anything missing from the archive?
    ko: 금서고에서 뭐 없어지거나 한 건 없어?
    ja: |-
      アルカナ、禁書庫から何か
      なくなったものはないか？
  event_lordforjustice_02_s_33:
    speaker: arcana
    en: I checked the highly classified materials first,
    ko: 급한 대로 최우선 보안 자료들부터 확인해 봤었는데,
    ja: |-
      えっと、とりいそぎ最高機密資料に
      不足がないか確認してみたんですが、
  event_lordforjustice_02_s_34:
    speaker: arcana
    en: and luckily, nothing is missing from those.
    ko: 다행히 그것들 중에는 없어진 건 없어요.
    ja: 幸いにも、なくなったものはありませんでした。
  event_lordforjustice_02_s_35:
    speaker: arcana
    en: I didn't have time to look at the other materials.
    ko: 나머지는 아직 다 돌아볼 시간이 없어서….
    ja: |-
      残りの資料については、時間がなかったので
      全部は把握できていなくて…
  event_lordforjustice_02_s_36:
    speaker: "<Self>"
    en: Then we can look together.
    ko: 그럼 같이 한번 확인해 보면 되겠다.
    ja: 分かった、なら一緒に確認してみよう
  event_lordforjustice_02_s_37:
    speaker: k
    en: Good idea. If we figure out what's gone missing or what's been damaged, that
      might clue us in as to who the intruder was.
    ko: |-
      어. 어떤 자료가 없어지거나 훼손됐는지 알아 보면,
      범인이 누군지도 대충 특정될 거야.
    ja: |-
      だな。どの資料がなくなったか、
      もしくはどの資料が破損したのかを調べれば
      おおよその犯人像は特定できるはずだし。
  event_lordforjustice_02_s_38:
    speaker: "<Narration>"
    en: "*Krrrrk*"
    ko: 그그그그그-
    ja: ゴゴゴゴゴ…
  event_lordforjustice_02_s_39:
    speaker: "<Monologue>"
    en: K pushes the iron door further open for us to go in.
    ko: K는 우리가 지나갈 수 있도록, 철문을 밀어서 조금 더 열었다.
    ja: |-
      そう言うと、Kは私たちが通れるように
      鉄扉の入り口を押し広げた
  event_lordforjustice_02_s_40:
    speaker: k
    en: Let's go.
    ko: 가자.
    ja: 行くぞ。
  event_lordforjustice_02_s_41:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ…
  event_lordforjustice_02_s_42:
    speaker: "<Monologue>"
    en: The passage eventually intersects with the corridor leading to Arcana's room.
    ko: 잠시 후 통로는 아르카나의 방에서 연결된 복도로 이어졌고,
    ja: |-
      しばらく通路を歩いていると、
      アルカナの仕事部屋から繋がっている廊下に出た
  event_lordforjustice_02_s_43:
    speaker: "<Monologue>"
    en: Upon arriving at the Forbidden Library's reading room, we commence our search.
    ko: 우리는 금서고 열람실에 도착해, 흩어져서 수색을 시작했다.
    ja: |-
      そこからさらに進んで禁書庫の閲覧室に
      到着した私たちは、それぞれ調査を始めた
  event_lordforjustice_02_s_44:
    speaker: "<Monologue>"
    en: Not long after that...
    ko: 그리고 얼마 지나지 않아서….
    ja: それからほどなくして…
  event_lordforjustice_02_s_45:
    speaker: k
    en: Well, that was less hassle than I thought it'd be.
    ko: 생각보다 금방 찾았네. 수고를 덜었어.
    ja: 思ったよりもアッサリ見つかったな。
  event_lordforjustice_02_s_46:
    speaker: arcana
    en: This room holds the documents that are one level below the most highly classified
      materials. I've already checked them.
    ko: |-
      그… 여기 자료는 처음에 확인했던 최우선 자료들 바로 다음 등급이거든요.
      순서대로 확인해 봤죠.
    ja: |-
      えっと…ここにあるのは最初に確認した
      最高機密資料の次に重要な資料なんです。
      重要度順に確認して正解でしたね。
  event_lordforjustice_02_s_47:
    speaker: "<Monologue>"
    en: I see a wooden door which resembles the one I saw before leading to the room
      where the Goddess Squad records were housed.
    ko: 저번에 갓데스 스쿼드에 대한 자료가 있던 방과 같은, 작은 나무문.
    ja: |-
      目の前には、ゴッデス部隊に関する
      資料があった部屋と同じような
      小さな木製の扉がたたずんでいる
  event_lordforjustice_02_s_48:
    speaker: "<Monologue>"
    en: On it, there is a sign that reads S-1452, along with a crude lock.
    ko: 문에는 [S-1452]라고 적힌 푯말과 함께,  투박한 자물쇠가 걸려있었지만….
    ja: |-
      扉には「S-1452」と書かれた標識と
      何の変哲もない南京錠がかかっていたが…
  event_lordforjustice_02_s_49:
    speaker: "<Self>"
    en: "... It's open."
    ko: "…열려있네."
    ja: "…開いてるぞ"
  event_lordforjustice_02_s_50:
    speaker: arcana
    en: You're right...
    ko: "…열려있네요."
    ja: "…開いてますね。"
  event_lordforjustice_02_s_51:
    speaker: "<Monologue>"
    en: The faint musty scent of old books wafts through the crack of the open door.
    ko: 열린 문틈으로 오래된 책 냄새가 옅게 느껴진다.
    ja: |-
      開かれたままの扉の隙間からは、
      古書の匂いがほのかに漂っている
  event_lordforjustice_02_s_52:
    speaker: "<Self>"
    en: What kind of records are kept here?
    ko: 여기 있던 건 어떤 기록이야?
    ja: ここにはどんな記録が保管されているんだ？
  event_lordforjustice_02_s_53:
    speaker: arcana
    en: That...
    ko: 그게….
    ja: その…
  event_lordforjustice_02_s_54:
    speaker: arcana
    en: That's where the records pertaining to Perilous Siege are stored.
    ko: "…시지 패러리스에 대한 기록이 보관된 방이에요."
    ja: "…シージペリラスに関する記録です。"
  event_lordforjustice_02_s_55:
    speaker: k
    en: What?!
    ko: "……뭐?"
    ja: "……何だって？"
  event_lordforjustice_02_s_56:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_s_57:
    speaker: "<Self>"
    en: Let's go inside.
    ko: 들어가 보자.
    ja: 入ってみよう
  event_lordforjustice_02_s_58:
    speaker: "<Monologue>"
    en: Inside, the room is in complete disarray.
    ko: 들어선 방 안은 엉망진창이었다.
    ja: 部屋の中はめちゃくちゃにされていた
  event_lordforjustice_02_s_59:
    speaker: arcana
    en: Oh my gosh!
    ko: 아아아앗!!
    ja: ああああっ！？
  event_lordforjustice_02_s_60:
    speaker: arcana
    en: Those wicked thieves! They made a complete mess of the place!
    ko: 이렇게 어질러 놓다니! 이이이 나쁜 도둑님!
    ja: |-
      ひ、ひどいっ！こんなに散らかすなんて！
      うう、悪い泥棒さんめぇ…！
  event_lordforjustice_02_s_61:
    speaker: "<Monologue>"
    en: Arcana hastily begins picking up the books scattered on the floor.
    ko: 아르카나는 황급히 바닥에 어질러진 책들을 주워들었다.
    ja: |-
      アルカナは泣き言を言いながら
      床に散らばった本を拾い始めた
  event_lordforjustice_02_s_62:
    speaker: k
    en: Forget about those for now.
    ko: "…바닥에 떨어진 거 말고도, 책이 좀 사라진 거 아냐?"
    ja: "…なあ。何かなくなったりしてないか？"
  event_lordforjustice_02_s_63:
    speaker: k
    en: More importantly, it looks to me like some of the books are missing.
    ko: 수량이 안 맞는 것 같은데.
    ja: 数が合わない気がすんだけど。
  event_lordforjustice_02_s_64:
    speaker: arcana
    en: Wh-what?!
    ko: 네, 네에?!
    ja: え、ええっ！？
  event_lordforjustice_02_s_65:
    speaker: "<Monologue>"
    en: Just as K said, some sections of the shelves are noticeably empty.
    ko: K의 말대로 책장은 꽤나 많이 비어 있다.
    ja: Kの言う通り、本棚には隙間がいくつもあった
  event_lordforjustice_02_s_66:
    speaker: "<Self>"
    en: Do you have any idea what those missing books were about, Arcana?
    ko: 아르카나. 혹시 사라진 책들이 무슨 내용이었는지 알고 있어?
    ja: アルカナ、なくなった本の内容は分かるか？
  event_lordforjustice_02_s_67:
    speaker: arcana
    en: Well,
    ko: "…그게요."
    ja: えっと…
  event_lordforjustice_02_s_68:
    speaker: arcana
    en: the records here are usually redacted before they get to us.
    ko: 여기 있는 기록들은 걸러서 주는 쪽이라서….
    ja: |-
      ここにある記録は、いずれも
      フィルタリングされた後のものなので…
      正確な内容は…
  event_lordforjustice_02_s_69:
    speaker: "<Choice>"
    en: They are?
    ko: 걸러서?
    ja: フィルタリング？
  event_lordforjustice_02_s_70:
    speaker: "<Choice>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_s_71:
    speaker: arcana
    en: I told you before.
    ko: 전에 얘기해줬잖아요.
    ja: ええ、前にも言いましたよね。
  event_lordforjustice_02_s_72:
    speaker: arcana
    en: The higher-ups censor them.
    ko: "[위에서] 걸러서 주는 쪽."
    ja: |-
      記録された内容は、上層部の
      検閲を受ける必要がある…と。
  event_lordforjustice_02_s_73:
    speaker: "<Self>"
    en: Oh...
    ko: 아….
    ja: あっ…
  event_lordforjustice_02_s_74:
    speaker: arcana
    en: But I still remember some of the titles. Let me see...
    ko: 그래도 대충 제목 정도는 기억하거든요? 음….
    ja: |-
      あっ、でも、タイトルくらいなら思い出せます！
      確か…えっと…
  event_lordforjustice_02_s_75:
    speaker: "<Monologue>"
    en: Arcana examines the gaps in the shelves.
    ko: 아르카나는 군데군데 이가 빠진 책장을 살펴보았다.
    ja: アルカナはところどころ抜けている本棚を見た
  event_lordforjustice_02_s_76:
    speaker: arcana
    en: Looks like... They're mission records for two members of Perilous Siege.
    ko: 아무래도… 시지 패러리스 두 분의 임무 내역인 것 같아요.
    ja: |-
      おそらく…なくなったのはシージペリラスの
      お二人の任務に関する記録かと。
  event_lordforjustice_02_s_77:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_s_78:
    speaker: "<Self>"
    en: So the Forbidden Library was broken into, and records related to Perilous
      Siege have gone missing.
    ko: |-
      …금서고에 침입자가 발생했고,
      시지 패러리스에 대한 기록이 사라졌어.
    ja: |-
      …禁書庫に侵入者が発生したうえ、
      シージペリラスに関する記録が消えた
  event_lordforjustice_02_s_79:
    speaker: "<Self>"
    en: Meanwhile, K has been injured and lost her memory, and D is completely M.I.A.
    ko: 그리고 K는 기억을 잃은 데다가 다쳤고, D는 연락이 안 된다….
    ja: |-
      くわえて、Kは記憶を失い負傷。
      そしてDとは、音信不通の状態が続いている…
  event_lordforjustice_02_s_80:
    speaker: k
    en: "... This isn't good."
    ko: "…심상치 않은데."
    ja: "…ただごとじゃないな。"
  event_lordforjustice_02_s_81:
    speaker: k
    en: This might go deeper than we initially thought.
    ko: 생각보다 복잡한 일일수도 있겠….
    ja: 思ったよりも、複雑な事件かもしれな…
  event_lordforjustice_02_s_82:
    speaker: "<Narration>"
    en: "*Thud thud thud*!"
    ko: 쿵! 쿵! 쿵!
    ja: ドン！ドン！ドン！
  event_lordforjustice_02_s_83:
    speaker: "<Self>"
    en: What was that?
    ko: 무슨 소리지?
    ja: 何の音だ？
  event_lordforjustice_02_s_84:
    speaker: k
    en: Is there some kind of construction going on? I heard they were expanding the
      Forbidden Library.
    ko: 뭐 공사라도 하나? 금서고 확장한다며.
    ja: |-
      …工事の音か？確か、また禁書庫が
      拡張されるって話だっただろ？
  event_lordforjustice_02_s_85:
    speaker: arcana
    en: Yeah, but that's not set to start for a while.
    ko: 그, 그건 아직 멀었는데요?
    ja: い、いえ。工事の予定はまだ先のはずです…！
  event_lordforjustice_02_s_86:
    speaker: "<Self>"
    en: Let's check it out.
    ko: "…가보자."
    ja: "…行ってみよう"
  event_lordforjustice_02_s_87:
    speaker: "<Monologue>"
    en: We hurry out of the room to follow the continuous thudding sound.
    ko: 계속해서 울리는 소리를 따라 급히 방을 나섰다.
    ja: |-
      鳴り続ける騒音を頼りに、
      私たちは急いで部屋を出た
event_lordforjustice_02_e:
  event_lordforjustice_02_e_1:
    speaker: "<Narration>"
    en: "*Thud thud thud*!"
    ko: 쿵! 쿵! 쿵!
    ja: ドン！ドン！ドン！
  event_lordforjustice_02_e_2:
    speaker: "<Monologue>"
    en: As we run, the noise continues.
    ko: 달리는 도중에도 소리는 계속 이어졌다.
    ja: 走っている間も、謎の騒音は鳴り続け…
  event_lordforjustice_02_e_3:
    speaker: "<Monologue>"
    en: When we arrive at the main reading room of the Ark Library,
    ko: 그리고 잠시 후.
    ja: 私たちがアークの図書館の大閲覧室に到着すると
  event_lordforjustice_02_e_4:
    speaker: "<Monologue>"
    en: we find what seems to be the source of the noise.
    ko: 소리의 진원지로 보이는, 방주 도서관의 대 열람실에 도착하자….
    ja: 騒音の発生源と思われる人物がそこにいた
  event_lordforjustice_02_e_5:
    speaker: moran_c
    en: Oh jeez, sorry about that!
    ko: 으아, 죄송합니다 시민 여러분…!
    ja: うう、なんでこんなことに…
  event_lordforjustice_02_e_6:
    speaker: "<Monologue>"
    en: Moran is desperately trying to straighten the bookshelves, which have fallen
      over like dominos.
    ko: 목단이 도미노처럼 쓰러진 책장들을 다시 세우고 있었다….
    ja: |-
      …モランがドミノのように
      倒れた本棚を立て直している
  event_lordforjustice_02_e_7:
    speaker: moran_c
    en: Aw man, how am I gonna clean all this up...
    ko: 아, 이거 언제 다 치우지….
    ja: ちくしょお…全部片づけてたら日が暮れちまう…
  event_lordforjustice_02_e_8:
    speaker: "<Self>"
    en: Moran?
    ko: "…목단?"
    ja: "…モラン？"
  event_lordforjustice_02_e_9:
    speaker: moran_c
    en: Cadet?
    ko: 어? 동생?
    ja: "…おお！？弟じゃねえか！"
  event_lordforjustice_02_e_10:
    speaker: moran_c
    en: Are you here to help me? How thoughtful of you!
    ko: 누님 도와주러 온 거야? 기특하네!
    ja: |-
      なんだ？ひょっとしてお姉様を助けに来たのか？
      さすがは弟！！
  event_lordforjustice_02_e_11:
    speaker: "<Choice>"
    en: What are you doing here?
    ko: "…여기서 뭐 해?"
    ja: "…何をしているんだ？"
  event_lordforjustice_02_e_12:
    speaker: "<Choice>"
    en: What's going on with your outfit?
    ko: "…그 옷은 뭐야?"
    ja: "…その服はどうしたんだ？"
  event_lordforjustice_02_e_13:
    speaker: moran_c
    en: Oh, well...
    ko: 어, 그게.
    ja: えーと、これはその…
  event_lordforjustice_02_e_14:
    speaker: "<Monologue>"
    en: Moran looks around the wrecked reading room.
    ko: 목단은 쑥대밭이 된 열람실을 돌아보았다.
    ja: モランは混沌と化した閲覧室を見渡した
  event_lordforjustice_02_e_15:
    speaker: moran_c
    en: I was doing some research...
    ko: 조, 조사를 좀 하고 있었어.
    ja: ちょ、調査中だったっていうか…？
  event_lordforjustice_02_e_16:
    speaker: moran_c
    en: My outfit?
    ko: 옷?
    ja: 服…？
  event_lordforjustice_02_e_17:
    speaker: "<Monologue>"
    en: Moran looks down at her clothes.
    ko: 목단은 자기 옷을 내려다보았다.
    ja: モランは自身の服装を見下ろした
  event_lordforjustice_02_e_18:
    speaker: moran_c
    en: What about it?
    ko: 옷이 왜?
    ja: 服がどうかしたのか？
  event_lordforjustice_02_e_19:
    speaker: "<Self>"
    en: I've never seen you wear that before.
    ko: 그렇게 입은 건 처음 봐서.
    ja: いや、そんな服を着ているのは初めて見たから…
  event_lordforjustice_02_e_20:
    speaker: moran_c
    en: Oh, what I usually wear is the Peony Association traditional garb, but this
      is just casual wear.
    ko: |-
      아아. 원래 입고 다녔던 건 우리 모란회 전통복이고,
      이건 그냥 입는 옷이지.
    ja: |-
      あ～、そういうことか！
      いつものアレは牡丹会の伝統服みたいなもんで、
      これはただ目に留まったから着てみただけだ。
  event_lordforjustice_02_e_21:
    speaker: moran_c
    en: "... I don't deserve to wear the Peony Association uniform now."
    ko: "…지금 나한텐 그 옷을 입을 자격이 없으니까."
    ja: |-
      …今の俺には、あの服を着る資格なんざ
      ねえしな。
  event_lordforjustice_02_e_22:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_23:
    speaker: moran_c
    en: "..."
    ko: 어….
    ja: "…えっと…"
  event_lordforjustice_02_e_24:
    speaker: moran_c
    en: A-anyway!
    ko: "…그, 그리고 또!"
    ja: "…そ、それにな！"
  event_lordforjustice_02_e_25:
    speaker: moran_c
    en: For this research that I'm doing,
    ko: 지금 조사하는 건 약간 몰래 하는 거랄까.
    ja: この調査は誰にも知られちゃダメっつーか…
  event_lordforjustice_02_e_26:
    speaker: moran_c
    en: it's important that people don't know that I'm from the Peony Association.
    ko: 대놓고 나 모란회라고 광고하면 안 되거든.
    ja: |-
      そういうのもあって、あんま堂々と
      牡丹会のお通りだ！って
      宣伝するのもアレっていうか…？
  event_lordforjustice_02_e_27:
    speaker: "<Self>"
    en: What kind of research would necessitate... oh.
    ko: 무슨 조사… 아.
    ja: いったい何の調査を…
  event_lordforjustice_02_e_28:
    speaker: moran_c
    en: What else?
    ko: 내가 조사할 일이 달리 뭐가 있겠어?
    ja: 俺が調査するって言ったらアレしかないだろ？
  event_lordforjustice_02_e_29:
    speaker: moran_c
    en: Sixo.
    ko: "…식스오야."
    ja: "…シックスオーだよ。"
  event_lordforjustice_02_e_30:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_31:
    speaker: "<Self>"
    en: Have you made any progress?
    ko: 진전은 좀 있었어?
    ja: "…それで、進展はあったのか？"
  event_lordforjustice_02_e_32:
    speaker: moran_c
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_33:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭.
    ja: ゴソゴソ
  event_lordforjustice_02_e_34:
    speaker: "<Monologue>"
    en: Moran pulls out an envelope from her pocket.
    ko: 목단은 주머니에서 봉투를 하나 꺼냈다.
    ja: モランはポケットから封筒を取り出した
  event_lordforjustice_02_e_35:
    speaker: "<Self>"
    en: What's this?
    ko: 이건….
    ja: これは…
  event_lordforjustice_02_e_36:
    speaker: moran_c
    en: Mist.
    ko: "[미스트]."
    ja: "「ミスト」だ。"
  event_lordforjustice_02_e_37:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_02_e_38:
    speaker: arcana
    en: This is the room I use to slack... Er, I mean,
    ko: 여기 제가 땡땡이… 가 아니라,
    ja: ここは私が仕事をサボるとき…ではなく、
  event_lordforjustice_02_e_39:
    speaker: arcana
    en: this is the room I use for brief breaks. Make yourselves comfortable.
    ko: 잠깐 쉴 때 쓰는 방이니까, 편하게들 얘기 나누세요~
    ja: |-
      休憩するときに使っている部屋なので、
      遠慮なくお話してくださいね～
  event_lordforjustice_02_e_40:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャ
  event_lordforjustice_02_e_41:
    speaker: "<Monologue>"
    en: Arcana leads us to a small room connected to the librarian's desk, whereupon
      Moran, K, and I all sit down.
    ko: 아르카나가 안내해 준, 사서석과 연결된 방에서 K, 목단과 둘러앉았다.
    ja: |-
      アルカナの案内で司書席と繋がっている部屋に
      入ると、Kとモランと私で円になって座った
  event_lordforjustice_02_e_42:
    speaker: moran_c
    en: You said your name was K?
    ko: 그런데 너… 이름이 K였지?
    ja: ところで…お前、確かKって言ったか？
  event_lordforjustice_02_e_43:
    speaker: moran_c
    en: Does Perilous Siege have an interest in this as well?
    ko: 시지 패러리스도 이거에 관심이 있어?
    ja: シージペリラスもこの件に興味があるのか？
  event_lordforjustice_02_e_44:
    speaker: k
    en: That's none of your business.
    ko: 그건 네가 알 거 없고.
    ja: お前には関係ないね。
  event_lordforjustice_02_e_45:
    speaker: moran_c
    en: Then I won't share any information with you either.
    ko: 그럼 나도 얘기 못 해주지.
    ja: ふん、じゃあ俺も話すことはないな。
  event_lordforjustice_02_e_46:
    speaker: moran_c
    en: Cadet, let's talk in private.
    ko: 동생. 나중에 둘이 따로 얘기하자.
    ja: 弟、後で2人きりで話そうぜ。
  event_lordforjustice_02_e_47:
    speaker: "<Monologue>"
    en: Moran stands up.
    ko: 목단은 자리에서 일어났다.
    ja: モランは席を立った
  event_lordforjustice_02_e_48:
    speaker: k
    en: Sit down.
    ko: 앉아.
    ja: 座れ。
  event_lordforjustice_02_e_49:
    speaker: moran_c
    en: Don't tell me what to do.
    ko: 싫어.
    ja: 断る。
  event_lordforjustice_02_e_50:
    speaker: k
    en: You little...
    ko: 아, 나 씨….
    ja: なっ…こいつ…
  event_lordforjustice_02_e_51:
    speaker: "<Self>"
    en: Both of you, calm down.
    ko: 둘 다 진정해.
    ja: 2人とも落ち着け
  event_lordforjustice_02_e_52:
    speaker: "<Self>"
    en: Didn't Rosanna mention something before about Underworld Queen and Perilous
      Siege not getting along?
    ko: |-
      …전에 로산나도 그랬는데,
      언더월드 퀸은 시지 패러리스랑 사이가 안 좋아?
    ja: |-
      …ロザンナの時もそうだったが、
      アンダーワールドクイーンとシージペリラスは
      仲が悪いのか？
  event_lordforjustice_02_e_53:
    speaker: moran_c
    en: Why would we get along
    ko: 이걸 사이가 안 좋다고 해야되나….
    ja: 仲が悪いというか…
  event_lordforjustice_02_e_54:
    speaker: moran_c
    en: with scum like them?
    ko: 나쁜 놈들이잖아, 쟤네.
    ja: こいつらは悪質な奴らだからな。
  event_lordforjustice_02_e_55:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_56:
    speaker: moran_c
    en: They say they punish evildoers, but everyone in the underworld knows the truth.
    ko: 말로는 악을 처단하네 뭐네 하지만, 뒷세계 주민들은 다 알아.
    ja: |-
      口では悪を裁くためだとか言ってるけどよ、
      裏の世界の住民はみ～んな知ってんだよ。
  event_lordforjustice_02_e_57:
    speaker: moran_c
    en: The only people who get a bullet to the head are those who get in the way.
    ko: "[방해]가 되는 녀석들이 죽는 거라고."
    ja: "「邪魔」になった奴を殺してるだけだってな。"
  event_lordforjustice_02_e_58:
    speaker: k
    en: We punish those who do wrong and make them pay the price.
    ko: 악을 저지른 자에게 대가를 치르게 하는 거야.
    ja: |-
      ふん。悪事を働いた奴には
      相応の代価を支払わせるべきだろ？
  event_lordforjustice_02_e_59:
    speaker: k
    en: That is the only path to true justice.
    ko: 그게 정의를 실현하는 길이고.
    ja: |-
      それこそが、正義の実現に続く
      唯一の道なんだ。
  event_lordforjustice_02_e_60:
    speaker: moran_c
    en: Don't talk to me about justice.
    ko: 정의 같은 소리하네.
    ja: |-
      正義うんぬんを語る資格なんて
      お前らにあんのかよ。
  event_lordforjustice_02_e_61:
    speaker: moran_c
    en: What you do is the furthest thing from jus—
    ko: 그런 건 정의가 아니….
    ja: そんなのは正義でもなんでもな…
  event_lordforjustice_02_e_62:
    speaker: "<Self>"
    en: Enough, both of you.
    ko: 그만.
    ja: そこまでだ
  event_lordforjustice_02_e_63:
    speaker: moran_c
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_64:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_65:
    speaker: "<Self>"
    en: Moran. Can you tell us what you found?
    ko: "…목단. 알아낸 걸 말해줄래?"
    ja: "…モラン。調査した内容を教えてくれるか？"
  event_lordforjustice_02_e_66:
    speaker: "<Self>"
    en: We're in a bit of a tough situation now, and any information you have could
      be helpful.
    ko: 지금… 우리 상황이 약간 난처한데, 관계가 있을지도 몰라.
    ja: |-
      今…状況があまりよくないんだが、
      打開するヒントになるかもしれない
  event_lordforjustice_02_e_67:
    speaker: moran_c
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_68:
    speaker: moran_c
    en: Fine, I'll tell you, but only because you're the one asking.
    ko: 동생 부탁이니까 들어주는 거야.
    ja: "…いいぜ、弟の頼みだから話してやるよ。"
  event_lordforjustice_02_e_69:
    speaker: "<Monologue>"
    en: Moran sits back down and pulls out a small notebook.
    ko: 목단은 다시 자리에 앉아, 주머니에서 작은 수첩을 하나 꺼냈다.
    ja: |-
      モランは椅子に戻ると、
      ポケットから小さな手帳を取り出した
  event_lordforjustice_02_e_70:
    speaker: moran_c
    en: According to a recent lead,
    ko: 실마리를 잡은 건 바로 얼마 전이야.
    ja: 手がかりを掴んだのはつい最近のことだ。
  event_lordforjustice_02_e_71:
    speaker: moran_c
    en: I found out that Mist is being distributed again in the Ark.
    ko: 방주에서 다시 [미스트]가 유통되고 있다는 정보를 얻었거든.
    ja: |-
      アークでまた「ミスト」が流通しだしたっていう
      情報を耳にして、
  event_lordforjustice_02_e_72:
    speaker: moran_c
    en: I did everything I could to track down the suppliers,
    ko: 그래서 열심히 쫓아왔는데….
    ja: 供給源を探ろうとすぐさま捜査したんだけどよ…
  event_lordforjustice_02_e_73:
    speaker: moran_c
    en: but it was like they vanished into thin air.
    ko: 갑자기 사라져 버렸어. 연기처럼.
    ja: 急に消えちまったんだ。煙みたいにな。
  event_lordforjustice_02_e_74:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_lordforjustice_02_e_75:
    speaker: moran_c
    en: I'm telling the truth!
    ko: 지, 진짜야.
    ja: う、嘘じゃねえ！
  event_lordforjustice_02_e_76:
    speaker: moran_c
    en: I hid myself out of sight and waited for them all to head into their hideout.
      Once they were inside, I raided the place immediately.
    ko: 숨어서 자기들 은신처로 들어가는 거 확인한 다음에 바로 덮쳤는데.
    ja: |-
      犯人がアジトに入るところまで確認して、
      すぐに奇襲をしかけたんだけどさ…
  event_lordforjustice_02_e_77:
    speaker: moran_c
    en: But when I did, no one was there.
    ko: 아무도 없더라니까?
    ja: もぬけの殻だったんだよ！
  event_lordforjustice_02_e_78:
    speaker: "<Self>"
    en: Could there have been a secret passage of some kind?
    ko: 뭐 비밀통로 같은 게 있는 거 아냐?
    ja: 秘密の通路とかで逃げたんじゃないか？
  event_lordforjustice_02_e_79:
    speaker: moran_c
    en: I checked for that too.
    ko: 그럴까 봐 다 확인해 봤지!
    ja: 俺もそう思って、全部確認したんだよ！
  event_lordforjustice_02_e_80:
    speaker: moran_c
    en: I ran over that place with a fine-tooth comb and smashed everything, but didn't
      turn up anything.
    ko: 전부 부숴봤는데 진짜 아무것도 없었어. 확실해.
    ja: |-
      けど、全部ぶっ壊して確認しても、
      本当に何もなかったんだ！
  event_lordforjustice_02_e_81:
    speaker: "<Self>"
    en: Could it be...
    ko: "…설마."
    ja: "…まさか"
  event_lordforjustice_02_e_82:
    speaker: announcer
    en: Here is today's breaking news.
    ko: 오늘의 사고 소식입니다.
    ja: 続いて、本日のニュース速報です。
  event_lordforjustice_02_e_83:
    speaker: announcer
    en: Traces of illegal drug trafficking were found in an office in the Ark's western
      district.
    ko: 서구의 한 사무실에서, 불법 약물을 유통한 흔적이 발견되었습니다.
    ja: |-
      アーク西区にある、とある事務所にて
      違法薬物の取引が行われていたと
      みられる痕跡が発見されました。
  event_lordforjustice_02_e_84:
    speaker: announcer
    en: The building in question was completely destroyed, leading the A.C.P.U. to
      suspect inter-organizational conflict...
    ko: |-
      해당 사무실은 완전히 파괴되어 있었으며,
      A.C.P.U.에서는 조직 간의 알력 다툼으로 보고 수사를….
    ja: |-
      現場の事務所は激しく破壊されており、
      A.C.P.U.では組織間の抗争に
      よるものと見て捜査を…
  event_lordforjustice_02_e_85:
    speaker: "<Self>"
    en: So that was you...
    ko: 목단이 한 거였구나….
    ja: モランの仕業だったのか…
  event_lordforjustice_02_e_86:
    speaker: moran_c
    en: Huh? What was that?
    ko: 응? 뭐가?
    ja: え？何のことだ？
  event_lordforjustice_02_e_87:
    speaker: "<Self>"
    en: Nothing.
    ko: "…아무것도 아냐."
    ja: "…何でもない"
  event_lordforjustice_02_e_88:
    speaker: "<Self>"
    en: So you came to the library to investigate further?
    ko: 그래서 다시 조사해 보려고 도서관에 온 거야?
    ja: それで、もう一度調査しに図書館に来たのか？
  event_lordforjustice_02_e_89:
    speaker: moran_c
    en: No.
    ko: 엥? 아니?
    ja: えっ、違うぞ？
  event_lordforjustice_02_e_90:
    speaker: moran_c
    en: I ended up apprehending the criminals.
    ko: 그다음에 다시 잡았는데?
    ja: ちゃんと犯人はそのあと捕まえたし、
  event_lordforjustice_02_e_91:
    speaker: moran_c
    en: They had some Mist on them.
    ko: 이거 미스트도 잡은 녀석이 갖고 있던 거였고.
    ja: ミストもそいつが持ってたやつだ。
  event_lordforjustice_02_e_92:
    speaker: "<Self>"
    en: What?
    ko: "…뭐?"
    ja: "…何だと？"
  event_lordforjustice_02_e_93:
    speaker: moran_c
    en: But I don't know what happened.
    ko: 그런데 무슨 일이 있었는지.
    ja: ただ、何があったのかは分かんねえけど…
  event_lordforjustice_02_e_94:
    speaker: moran_c
    en: I was chasing after three people; two men and a woman.
    ko: 내가 쫓던 건 분명 세 명이었거든? 남자 둘에 여자 하나.
    ja: |-
      俺が最初に追いかけてた時は3人いたんだよな。
      男2人に、女1人。
  event_lordforjustice_02_e_95:
    speaker: moran_c
    en: The two men disappeared, although I have no idea where, and only the woman
      was left.
    ko: 근데 남자 둘은 어디 갔는지 없고, 여자만 남아 있더라.
    ja: |-
      けど男2人はいなくなってて、
      捕まえられたのは女だけだったんだ。
  event_lordforjustice_02_e_96:
    speaker: k
    en: Wait.
    ko: 잠깐.
    ja: "…ちょっと待った。"
  event_lordforjustice_02_e_97:
    speaker: "<Monologue>"
    en: K, who had been listening silently until that point, interrupts Moran.
    ko: 계속 말없이 듣고 있던 K가 목단의 말을 잘랐다.
    ja: |-
      先ほどからずっと黙って聞いていたKが、
      突然モランの話をさえぎった
  event_lordforjustice_02_e_98:
    speaker: k
    en: Two men and one woman, you said?
    ko: 남자 둘에 여자 하나라고…?
    ja: 男2人に女1人だと…？
  event_lordforjustice_02_e_99:
    speaker: moran_c
    en: Yeah.
    ko: 어.
    ja: ああ。
  event_lordforjustice_02_e_100:
    speaker: moran_c
    en: Do you know something?
    ko: 혹시 아는 거라도 있….
    ja: もしかして、何か知ってることでも…
  event_lordforjustice_02_e_101:
    speaker: k
    en: Urgh...
    ko: "…큭."
    ja: うっ…
  event_lordforjustice_02_e_102:
    speaker: "<Monologue>"
    en: K clutches her head.
    ko: K는 머리를 부여잡았다.
    ja: Kが苦しそうに頭を抱えた
  event_lordforjustice_02_e_103:
    speaker: "<Self>"
    en: K?
    ko: "…K!"
    ja: "…K！"
  event_lordforjustice_02_e_104:
    speaker: moran_c
    en: What's wrong?
    ko: "…뭐야. 무슨 일인데."
    ja: お、おい、急にどうしたんだ？
  event_lordforjustice_02_e_105:
    speaker: moran_c
    en: Are you hurt? I didn't know Perilous Siege had feelings.
    ko: 다쳤어? 시지 패러리스가?
    ja: ケガでもしてたのか？あのシージペリラスが？
  event_lordforjustice_02_e_106:
    speaker: k
    en: Don't worry about it. Just tell me more about the three people you were tracking.
    ko: 됐… 으니까 그 찾았다는 세 명 이야기나 더 해봐.
    ja: つっ…いいから…その3人の話を続けろ。
  event_lordforjustice_02_e_107:
    speaker: k
    en: You said there's only one woman left?
    ko: 여자만… 남았다고?
    ja: 残ってたのは…女だけだって…？
  event_lordforjustice_02_e_108:
    speaker: moran_c
    en: "... Yeah."
    ko: 어, 응.
    ja: お、おう。
  event_lordforjustice_02_e_109:
    speaker: moran_c
    en: But something bad must have happened to her. She was totally out of it.
    ko: 근데 무슨 일이 있었는지. 그 여자, 제정신이 아니더라고.
    ja: |-
      あっ、ただその女、どうも正気じゃなくてさ。
      多分、何かあったんだろうな。
  event_lordforjustice_02_e_110:
    speaker: moran_c
    en: She kept rambling and saying someone killed her friends.
    ko: 막 횡설수설하면서, 누가 동료들을 죽였다는 거야.
    ja: |-
      言ってることが支離滅裂で、
      誰かが仲間を殺したとかなんとか言ってな。
  event_lordforjustice_02_e_111:
    speaker: moran_c
    en: I was barely able to get a coherent sentence out of her, but finally managed
      to get a rough description of who killed them.
    ko: 그래서 겨우 나머지 둘을 죽인 사람의 인상착의만 듣고 적어 왔어.
    ja: |-
      で、なんとかその女の仲間を殺した奴の
      人相と身なりを聞き出したあと、
  event_lordforjustice_02_e_112:
    speaker: moran_c
    en: I wrote it down, and came to the library to try to find more information.
    ko: 도서관에는 이거 보고 좀 찾아보려고 온 거고.
    ja: |-
      それをもとに図書館まで
      調査しにきたってわけだ。
  event_lordforjustice_02_e_113:
    speaker: "<Self>"
    en: Why the library?
    ko: "…도서관에서?"
    ja: "…図書館に？"
  event_lordforjustice_02_e_114:
    speaker: moran_c
    en: I'm sure the library has that kind of information.
    ko: 도서관에 그런 거 있잖아.
    ja: おう、図書館に来れば見つかるはずだろ？
  event_lordforjustice_02_e_115:
    speaker: "<Self>"
    en: "... I'm not so sure about that."
    ko: 없… 을걸?
    ja: そうだろうか…？
  event_lordforjustice_02_e_116:
    speaker: moran_c
    en: What? I thought you could find anything you needed at a library.
    ko: 엥? 도서관에서는 뭐든 다 찾을 수 있다고 그러던데?
    ja: |-
      え？図書館で探せば
      何でも見つかるんじゃないのか？
  event_lordforjustice_02_e_117:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_118:
    speaker: moran_c
    en: Anyway, now that I met up with you guys, it doesn't matter.
    ko: 근데 뭐. 그 대신 동생을 만났으니까 상관없겠지.
    ja: |-
      でもまっ、こうして弟に会えたし
      結果オーライだな！
  event_lordforjustice_02_e_119:
    speaker: moran_c
    en: Should I just tell you the description?
    ko: 이거, 인상착의도 말해주면 돼?
    ja: 人相と身なりを話せばいいんだな？
  event_lordforjustice_02_e_120:
    speaker: "<Self>"
    en: Please.
    ko: "…응. 부탁할게."
    ja: "…ああ。頼む"
  event_lordforjustice_02_e_121:
    speaker: moran_c
    en: Ahem.
    ko: 흠흠.
    ja: オホンッ…
  event_lordforjustice_02_e_122:
    speaker: "<Monologue>"
    en: Moran clears her throat and flips through her notebook.
    ko: 목단은 목을 가다듬은 뒤, 수첩을 넘겼다.
    ja: モランは咳払いをすると、手帳をめくった
  event_lordforjustice_02_e_123:
    speaker: moran_c
    en: Female with long black hair. It wasn't possible to ascertain whether she was
      human or a Nikke.
    ko: 일단 머리카락이 검고 길어. 여자였고, 니케인지 인간인지는 확실하지 않음.
    ja: |-
      まず、髪は黒くて長い。
      性別は女だが、ニケなのか人間なのかは不明だ。
  event_lordforjustice_02_e_124:
    speaker: "<Self>"
    en: Not much to go on.
    ko: 그것만으로는 너무 범위가 넓네.
    ja: それだけだと範囲が広すぎるな
  event_lordforjustice_02_e_125:
    speaker: k
    en: Exactly. Even amongst our small group, you and I already match that description.
    ko: "…그래. 그거면 나도 너도 조건에 들어가잖아."
    ja: |-
      …だね。それだけじゃ、
      私もお前も条件に当てはまるだろ。
  event_lordforjustice_02_e_126:
    speaker: k
    en: Is that it?
    ko: 그게 끝이야?
    ja: 聞き出せたのはそれだけか？
  event_lordforjustice_02_e_127:
    speaker: moran_c
    en: Of course not.
    ko: 당연히 아니지.
    ja: もちろん違うに決まってるだろ。
  event_lordforjustice_02_e_128:
    speaker: moran_c
    en: Next, she had a gun with spikes.
    ko: 그다음으로는 뭔가 가시가 박힌 권총? 기관단총?
    ja: |-
      えーと、それから…
      何かトゲが刺さったような拳銃？
      サブマシンガン？みたいな…
  event_lordforjustice_02_e_129:
    speaker: moran_c
    en: A kind of pistol, or maybe a submachine gun. A gun, in any case.
    ko: 뭐 하여튼 그런 총을 들고 있더래.
    ja: |-
      …とりあえず、
      そんな感じの銃を持ってたらしいぜ！
  event_lordforjustice_02_e_130:
    speaker: "<Self>"
    en: "..."
    ko: 어….
    ja: "……"
  event_lordforjustice_02_e_131:
    speaker: k
    en: Don't look at me like that. There are lots of other guns with spikes out there.
    ko: 뭘 그렇게 봐? 가시 박힌 총 딴 데도 많아.
    ja: |-
      何でそんな目で見るんだ？
      トゲが刺さった銃なら他にもたくさんあるだろ。
  event_lordforjustice_02_e_132:
    speaker: k
    en: Is there any more? Keep going.
    ko: 다음다음. 더 없어?
    ja: |-
      ほら、早く他の情報を吐けって。
      それともこれでおしまいか？
  event_lordforjustice_02_e_133:
    speaker: moran_c
    en: That's all I got from her.
    ko: 이, 이제 더 없는데.
    ja: こ、これで全部だ。
  event_lordforjustice_02_e_134:
    speaker: k
    en: Figures.
    ko: "…내가 이럴 줄 알았지."
    ja: "…こんなことだろうと思った。"
  event_lordforjustice_02_e_135:
    speaker: moran_c
    en: Oh, wait! There was one more thing. I just forgot to write it down.
    ko: "…아! 하나 더 있었어. 까먹고 안 적었다."
    ja: |-
      …あっ！そういえばもう1つあったぞ！
      はは、メモすんの忘れてた。
  event_lordforjustice_02_e_136:
    speaker: moran_c
    en: Apparently the woman was talking to someone on the phone,
    ko: 어떤 사람이랑 통화하면서, 뭐라더라.
    ja: 誰かと通話しながら…何だったっけな。
  event_lordforjustice_02_e_137:
    speaker: moran_c
    en: and said something about refusing to carry out an execution, and then accepting
      a choice.
    ko: 무슨 집행을 거부한다느니, 선택을 받아들인다느니.
    ja: |-
      なんかの執行を拒否するだの、
      選択を受け入れるだの…
  event_lordforjustice_02_e_138:
    speaker: moran_c
    en: A whole bunch of ominous stuff like that.
    ko: 흉흉한 말을 막 하고, 마지막에는 그.
    ja: |-
      とにかくおっかねえ言葉を連発したあと、
      最後に…えっと…
  event_lordforjustice_02_e_139:
    speaker: moran_c
    en: Then something about a righteous judgment, and... uh...
    ko: 정의로운 판결… 이 있으리? 위하여?
    ja: |-
      正義ある裁き…が下されるだろう？
      あ、じゃなくて…裁きのために？
  event_lordforjustice_02_e_140:
    speaker: moran_c
    en: Some other stu... gah?!
    ko: 뭐 그런 말을 했다고… 으앗?!
    ja: |-
      何かそんな感じのことを言ってたらし…
      うおっ！？
  event_lordforjustice_02_e_141:
    speaker: k
    en: What did you say?
    ko: "…방금 뭐라고 했어."
    ja: "…今、なんて言った？"
  event_lordforjustice_02_e_142:
    speaker: "<Monologue>"
    en: K grabs Moran's shoulders and glares at her.
    ko: K는 목단의 어깨를 붙잡고 노려보고 있다.
    ja: |-
      Kはモランの肩を勢いよく掴み、
      にらみつけている
  event_lordforjustice_02_e_143:
    speaker: k
    en: What did you just say?!
    ko: 뭐라고 했냐고!
    ja: なんて言ったかって聞いてるだろ！
  event_lordforjustice_02_e_144:
    speaker: moran_c
    en: Wh-what's gotten into you?!
    ko: 뭐, 뭔데! 왜 그러는데, 갑자기!
    ja: な、何だよいきなり…！？
  event_lordforjustice_02_e_145:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_02_e_146:
    speaker: "<Self>"
    en: Moran, can we talk with that woman now?
    ko: "…목단. 그 사람, 지금 만날 수 있어?"
    ja: "…モラン。その人物と、今から面会は可能か？"
  event_lordforjustice_02_e_147:
    speaker: moran_c
    en: Sure. I told her to go lie down for a while. I can go wake her up.
    ko: 어? 일단 잘 눕혀 놓고 왔으니까 깨우면 될걸?
    ja: |-
      ん？ああ。そのまま寝かしといたから、
      起こせば話くらいはできんじゃないか？
  event_lordforjustice_02_e_148:
    speaker: "<Self>"
    en: Let's go, quickly. Lead the way.
    ko: 그럼 빨리 가보자. 안내해 줘.
    ja: 早く行こう。案内してくれ
  event_lordforjustice_02_e_149:
    speaker: moran_c
    en: "... Okay."
    ko: "…음. 알았어."
    ja: "…まあ、弟がそう言うならいいけどよ。"
  event_lordforjustice_02_e_150:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ
  event_lordforjustice_02_e_151:
    speaker: k
    en: "... Damn."
    ko: "…젠장."
    ja: "…くそっ。"
  event_lordforjustice_02_e_152:
    speaker: k
    en: What in the hell is going on...?!
    ko: 뭐냐고, 대체…!
    ja: 何なんだよ、一体…！
event_lordforjustice_03_s:
  event_lordforjustice_03_s_1:
    speaker: "<Monologue>"
    en: Moran takes us to the point near where the Outer Rim and Ark are partitioned.
    ko: 목단의 안내를 받아 방주 외곽, 아우터림의 격벽 근처에 도착했다.
    ja: |-
      モランに案内され、アーク外縁部にある
      アウターリムの防壁近くに到着した
  event_lordforjustice_03_s_2:
    speaker: moran_c
    en: This is it.
    ko: 여기야.
    ja: ここだ。
  event_lordforjustice_03_s_3:
    speaker: "<Narration>"
    en: "*Ding dong*"
    ko: 띵-동.
    ja: ピンポーン
  event_lordforjustice_03_s_4:
    speaker: "<Monologue>"
    en: I ring the doorbell and wait for a moment, but there is no sign of anyone
      inside.
    ko: 초인종을 누르고 잠시 기다려 봤지만, 안에서는 아무런 인기척이 느껴지지 않는다.
    ja: |-
      ベルを押し、しばらく待ってみたが
      中からは何の気配も感じられない
  event_lordforjustice_03_s_5:
    speaker: "<Narration>"
    en: "*Ding dong*"
    ko: 띵-동.
    ja: ピンポーン
  event_lordforjustice_03_s_6:
    speaker: "<Monologue>"
    en: I ring the bell a second time, but nothing happens.
    ko: 재차 초인종을 눌러 보아도….
    ja: もう一度ベルを押してみたが…
  event_lordforjustice_03_s_7:
    speaker: "<Self>"
    en: Could she have left and gone somewhere?
    ko: 어디 나갔나?
    ja: "…留守か？"
  event_lordforjustice_03_s_8:
    speaker: moran_c
    en: "... Step aside for a moment."
    ko: "…동생. 잠깐 물러나."
    ja: "…弟。ちょっと下がってろ。"
  event_lordforjustice_03_s_9:
    speaker: "<Self>"
    en: Why?
    ko: 왜?
    ja: どうかしたか？
  event_lordforjustice_03_s_10:
    speaker: moran_c
    en: That woman was in no state to go anywhere.
    ko: 그 여자, 분명 어디 나갈 상태는 아니었거든?
    ja: |-
      最後にあの女を見た時は、どう考えても
      外出できるような状態じゃなかった。
  event_lordforjustice_03_s_11:
    speaker: moran_c
    en: That tells me...
    ko: 그렇다는 건….
    ja: つまり…
  event_lordforjustice_03_s_12:
    speaker: k
    en: Huh. I thought your brain was a useless lump, but you're pretty sharp.
    ko: 썩어도 언더월드 퀸이라 이건가?
    ja: |-
      へぇ、腐っても
      アンダーワールドクイーンってやつか？
  event_lordforjustice_03_s_13:
    speaker: k
    en: Guess Underworld Queen isn't so bad for a bunch of lousy chumps.
    ko: 머리까지 근육으로 되어있는 줄 알았더니, 꽤 하잖아.
    ja: |-
      脳みそまで筋肉かと思ってたけど、
      案外カンが働くじゃん。
  event_lordforjustice_03_s_14:
    speaker: moran_c
    en: Wow. I had no idea you were capable of complimenting someone.
    ko: 뭐야. 너 칭찬도 할 줄 아네?
    ja: はっ。そっちこそ、ほめ言葉とか言えるんだな。
  event_lordforjustice_03_s_15:
    speaker: moran_c
    en: Maybe you're a better person than I thought.
    ko: 혹시 생각보다 좋은 녀석이었어??
    ja: 案外いい奴だったりしてな？
  event_lordforjustice_03_s_16:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_s_17:
    speaker: moran_c
    en: You stay here and look after Cadet.
    ko: 그럼 잠깐 동생 옆에 있어.
    ja: ちょっとの間だけ、弟のことは頼んだぞ。
  event_lordforjustice_03_s_18:
    speaker: moran_c
    en: I'll go inside.
    ko: 내가 들어가 볼 테니… 까!
    ja: 俺が中に、入ってみっから…よ！
  event_lordforjustice_03_s_19:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 쾅!
    ja: バン！
  event_lordforjustice_03_s_20:
    speaker: "<Monologue>"
    en: Moran easily breaks down the flimsy door and steps inside.
    ko: 목단은 허술한 문을 손쉽게 부수고 안으로 들어갔다.
    ja: |-
      モランはみすぼらしいドアを一瞬で壊すと、
      中へと入っていった
  event_lordforjustice_03_s_21:
    speaker: "<Monologue>"
    en: Soon after...
    ko: 그리고 잠시 후.
    ja: しばらくして
  event_lordforjustice_03_s_22:
    speaker: moran_c
    en: "... We've got a small problem, Cadet."
    ko: 어… 동생. 일단 들어와 봐.
    ja: "…悪い、弟。ちょっと来てくれ。"
  event_lordforjustice_03_s_23:
    speaker: moran_c
    en: Come inside.
    ko: 문제가 좀 생겼어.
    ja: 問題が発生した。
  event_lordforjustice_03_s_24:
    speaker: k
    en: "... Damn."
    ko: "…쯧."
    ja: "…チッ。"
  event_lordforjustice_03_s_25:
    speaker: "<Self>"
    en: "... All right."
    ko: "…들어가자."
    ja: "…入ってみよう"
  event_lordforjustice_03_s_26:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_lordforjustice_03_s_27:
    speaker: "<Monologue>"
    en: Lingering inside the room is a scent I've smelled a few times before; the
      pungent, metallic scent of blood.
    ko: 방 안에는, 몇 번 맡아본 적이 있는 찐득한 피 냄새가 감돌고 있다.
    ja: |-
      部屋の中は、何度か嗅いだことがある
      生臭い血の匂いで充満していた
  event_lordforjustice_03_s_28:
    speaker: "<Monologue>"
    en: Not only that...
    ko: 그리고….
    ja: そして…
  event_lordforjustice_03_s_29:
    speaker: moran_c
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_s_30:
    speaker: k
    en: She's dead.
    ko: 죽었네.
    ja: 死んでるな。
  event_lordforjustice_03_s_31:
    speaker: "<Monologue>"
    en: The body of a woman lies on the floor.
    ko: 작은 방의 바닥에, 한 여자가 쓰러져 있다.
    ja: 小さな部屋の床に、1人の女が倒れていた
  event_lordforjustice_03_s_32:
    speaker: moran_c
    en: I was holding myself back earlier, because it's you,
    ko: "…지금까진 동생 얼굴을 봐서 참았는데."
    ja: "…今まで弟のために我慢してきたけど"
  event_lordforjustice_03_s_33:
    speaker: moran_c
    en: but this changes things.
    ko: 이젠 안 되겠어.
    ja: もう我慢できねえ。
  event_lordforjustice_03_s_34:
    speaker: moran_c
    en: Now I've gotten involved in this.
    ko: 뭔데? 무슨 일인데?
    ja: なぁ、どういうことなんだ？何があったんだ？
  event_lordforjustice_03_s_35:
    speaker: moran_c
    en: What in the world is going on?
    ko: 설명 좀 해줘 봐. 이제 나도 엮인 거잖아.
    ja: |-
      説明してくれよ。
      俺まで巻き込まれちまったじゃねえか！
  event_lordforjustice_03_s_36:
    speaker: "<Self>"
    en: I'm sorry. I didn't know when was the right time to fill you in.
    ko: "…미안. 타이밍을 못 잡았어."
    ja: |-
      …すまない。
      説明するタイミングがつかめず…
  event_lordforjustice_03_s_37:
    speaker: "<Monologue>"
    en: I begin to explain everything to Moran;
    ko: K가 기억을 잃은 것부터, 도서관 침입에 관련된 것까지.
    ja: |-
      Kが記憶を失ったこと、
      そして図書館侵入事件に関すること…
  event_lordforjustice_03_s_38:
    speaker: "<Monologue>"
    en: from K losing her memory, to the Forbidden Library being infiltrated.
    ko: 내가 목단에게 그동안의 일을 설명하는 동안.
    ja: |-
      こちらが見聞きしたことの
      一部始終をモランに説明している間
  event_lordforjustice_03_s_39:
    speaker: "<Monologue>"
    en: All the while, K silently examines the dead woman's body with sunken eyes.
    ko: K는 가라앉은 눈으로 바닥에 쓰러진 여자를 살펴보고 있었다.
    ja: Kは沈んだ瞳で床に倒れた女を見つめていた
  event_lordforjustice_03_s_40:
    speaker: moran_c
    en: I had no idea it was this serious.
    ko: 그, 그렇게 심각한 일일 줄은 몰랐는데.
    ja: そ、そんな深刻なことが起きてたのか…
  event_lordforjustice_03_s_41:
    speaker: "<Self>"
    en: I'm sorry for getting you mixed up in this. Now...
    ko: 엮이게 해서 미안. 이제는….
    ja: |-
      ああ、巻き沿えにしてすまない。
      だがここから先は…
  event_lordforjustice_03_s_42:
    speaker: moran_c
    en: Wait.
    ko: 잠깐.
    ja: ちょっと待った。
  event_lordforjustice_03_s_43:
    speaker: moran_c
    en: Just a minute. Let me think.
    ko: 잠깐만, 동생. 나 생각 좀.
    ja: |-
      悪いな、弟。
      ちょいとばかり考える時間をくれ。
  event_lordforjustice_03_s_44:
    speaker: "<Self>"
    en: "??"
    ko: 어? 어….
    ja: あ、ああ…
  event_lordforjustice_03_s_45:
    speaker: "<Monologue>"
    en: Moran closes her eyes for a few moments, then reopens them.
    ko: 목단은 잠시 감았던 눈을 부릅떴다.
    ja: |-
      そう言ってモランは目を閉じたかと思うと、
      すぐさまカッと見開いた
  event_lordforjustice_03_s_46:
    speaker: moran_c
    en: Fine. I'll help.
    ko: 좋아. 도와줄게.
    ja: "…分かった、俺も協力するぜ！"
  event_lordforjustice_03_s_47:
    speaker: "<Choice>"
    en: Are you sure?
    ko: "…괜찮겠어?"
    ja: "…いいのか？"
  event_lordforjustice_03_s_48:
    speaker: "<Choice>"
    en: What about Sixo?
    ko: "…식스오는?"
    ja: "…シックスオーのことはどうするんだ？"
  event_lordforjustice_03_s_49:
    speaker: moran_c
    en: It's okay. I'd hit a wall with that anyway.
    ko: 괜찮아. 어차피 거기서 막혀 있었으니까.
    ja: |-
      大丈夫だって。
      俺も行き詰ってたところだしな。
  event_lordforjustice_03_s_50:
    speaker: moran_c
    en: Once I finish helping you and K,
    ko: 내가 동생이랑 저기, K를 도와서 문제를 해결하고 나면,
    ja: 俺が弟と…Kを手伝って問題を解決したあと、
  event_lordforjustice_03_s_51:
    speaker: moran_c
    en: you two can return the favor and lend me a hand.
    ko: 그다음에 동생이 날 도와줘.
    ja: 弟が俺を助けてくれればいいからさ！
  event_lordforjustice_03_s_52:
    speaker: "<Self>"
    en: Okay. Thanks, Moran.
    ko: 알았어. 고마워, 목단.
    ja: "…分かった。ありがとう、モラン"
  event_lordforjustice_03_s_53:
    speaker: moran_c
    en: No need to thank me. What are friends for?
    ko: 우리 사이에 이런 걸로 뭘 고마워하고 그래.
    ja: 何言ってんだ、水臭いぞ。
  event_lordforjustice_03_s_54:
    speaker: k
    en: Are you two done?
    ko: "…다 끝났냐?"
    ja: "…話は終わった？"
  event_lordforjustice_03_s_55:
    speaker: k
    en: I hate to break up the lovefest, but perhaps you could spare a moment to look
      at this?
    ko: 이제 이거 볼 짬 나?
    ja: なら、ちょっと見てほしいのがあんだけど。
  event_lordforjustice_03_s_56:
    speaker: "<Self>"
    en: Sorry. I'm finished.
    ko: 미안. 이제 끝났어.
    ja: すまない、こちらはもう大丈夫だ
  event_lordforjustice_03_s_57:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: それで、何かあったのか？
  event_lordforjustice_03_s_58:
    speaker: k
    en: "... Look at this."
    ko: "…이거."
    ja: "…これなんだけどさ。"
  event_lordforjustice_03_s_59:
    speaker: "<Monologue>"
    en: K points to a wound where the blood is slowly congealing.
    ko: K는 서서히 피가 굳어가고 있는 상처를 가리켰다.
    ja: Kは徐々に血が固まりつつある傷を指さした
  event_lordforjustice_03_s_60:
    speaker: k
    en: Does this wound bring anything to mind?
    ko: 이 상처, 좀 익숙하지 않냐?
    ja: この傷、見覚えない？
  event_lordforjustice_03_s_61:
    speaker: "<Monologue>"
    en: While I haven't seen many corpses in my lifetime, this injury does seem familiar.
    ko: 시체를 그렇게 많이 보지는 않았지만, 이 상처는 무언가 눈에 익다.
    ja: |-
      遺体を何度も見たことがあるわけではないが、
      その傷はどこか見覚えがあるものだった
  event_lordforjustice_03_s_62:
    speaker: "<Monologue>"
    en: It's a gash, one which seems to have been caused by a knife or some type of
      heavy blade.
    ko: 칼이 아니라, 좀 더 묵직한 무언가로 내리친 것 같은 상처.
    ja: |-
      ナイフ…というより、もう少し重みのある
      何かで斬られたような…
  event_lordforjustice_03_s_63:
    speaker: "<Monologue>"
    en: Like an axe, for example.
    ko: 그래. 이를테면 도끼라던가….
    ja: "…そう。例えば、斧といった…"
  event_lordforjustice_03_s_64:
    speaker: "<Self>"
    en: No way...
    ko: "…설마."
    ja: "…まさか"
  event_lordforjustice_03_s_65:
    speaker: "<Narration>"
    en: "*Step*"
    ko: 저벅.
    ja: ザッ
  event_lordforjustice_03_s_66:
    speaker: "<Monologue>"
    en: Just then, footsteps echo behind us.
    ko: 그때, 등 뒤에서 발소리가 들렸다.
    ja: その時、背後から足音が聞こえた
  event_lordforjustice_03_s_67:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_s_68:
    speaker: "<Self>"
    en: D...
    ko: D….
    ja: D…
  event_lordforjustice_03_s_69:
    speaker: k
    en: Did you do this?
    ko: "…야. 이거, 네가 했냐?"
    ja: "…おい。これ、お前がやったのか？"
  event_lordforjustice_03_s_70:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ…
  event_lordforjustice_03_s_71:
    speaker: "<Monologue>"
    en: D doesn't answer and continues walking towards me.
    ko: D는 대답하지 않고 내게 걸어왔다.
    ja: Dは口をつぐんだまま、私の方に歩みを進めた
  event_lordforjustice_03_s_72:
    speaker: moran_c
    en: H-hold on a minute.
    ko: 어어. 잠깐잠깐.
    ja: おいおい、ちょっと待ってって。
  event_lordforjustice_03_s_73:
    speaker: moran_c
    en: Why don't we keep our distance and talk this through?
    ko: 적당히 거리를 두고 얘기하는 게 좋겠어.
    ja: 適度に距離を置いて話そうぜ、なっ？
  event_lordforjustice_03_s_74:
    speaker: "<Monologue>"
    en: Sensing the tension, Moran steps in front of me, but...
    ko: 심상치 않은 분위기에 목단이 내 앞을 가로막았지만,
    ja: |-
      ただならぬ雰囲気を感じたモランが
      とっさに私の前に立ちはだかったが…
  event_lordforjustice_03_s_75:
    speaker: d
    en: "... Take this."
    ko: "…받아."
    ja: "…受け取れ。"
  event_lordforjustice_03_s_76:
    speaker: "<Monologue>"
    en: D hands me a phone and steps back.
    ko: D는 내게 핸드폰을 건네준 뒤 물러섰다.
    ja: |-
      Dは私に携帯電話を渡すと、
      そのまま後ろに下がった
  event_lordforjustice_03_s_77:
    speaker: "<Self>"
    en: A phone? Why would you...
    ko: "…핸드폰은 왜?"
    ja: "…携帯電話？"
  event_lordforjustice_03_s_78:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 띠리리리링-
    ja: プルルル…
  event_lordforjustice_03_s_79:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_lordforjustice_03_s_80:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_s_81:
    speaker: d
    en: Answer it.
    ko: 받아.
    ja: 出ろ。
  event_lordforjustice_03_s_82:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_s_83:
    speaker: "<Monologue>"
    en: As soon as I press the button, a cold and inorganic voice emerges from the
      speaker.
    ko: 통화 버튼을 누르자, 핸드폰에서 무기질한 목소리가 흘러나왔다.
    ja: 通話ボタンを押すと、無機質な声が聞こえてきた
  event_lordforjustice_03_s_84:
    speaker: unknown
    en: "@UserName."
    ko: "@UserName."
    ja: "…@UserNameか？"
  event_lordforjustice_03_s_85:
    speaker: "<Self>"
    en: Who is this?
    ko: 누구지?
    ja: "…誰だ？"
  event_lordforjustice_03_s_86:
    speaker: vii
    en: VII.
    ko: VII.
    ja: VII、と言えば分かるか？
  event_lordforjustice_03_s_87:
    speaker: k
    en: "...!"
    ko: "…!!"
    ja: "…！！"
event_lordforjustice_03_e:
  event_lordforjustice_03_e_1:
    speaker: vii
    en: VII.
    ko: VII.
    ja: VII。
  event_lordforjustice_03_e_2:
    speaker: k
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_lordforjustice_03_e_3:
    speaker: "<Self>"
    en: The Judges...
    ko: "[저지스]…."
    ja: "「ジャッジス」…"
  event_lordforjustice_03_e_4:
    speaker: vii
    en: D. Return to your mission.
    ko: D. 임무에 복귀해라.
    ja: D。任務に戻れ。
  event_lordforjustice_03_e_5:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_e_6:
    speaker: "<Monologue>"
    en: D bites her lip and briefly glances over at K as she heads out of the room.
    ko: D는 입술을 깨물며 K를 한 번 돌아본 뒤 방을 나가다,
    ja: |-
      Dは唇を噛んだままKの方を一度振り返ると、
      部屋の出口に向かって歩き…
  event_lordforjustice_03_e_7:
    speaker: "<Monologue>"
    en: At the doorway, she stops short and stands beside me.
    ko: 문가에 있던 내 옆에 멈춰 섰다.
    ja: 出口の近くにいた私の横で、一瞬立ち止まった
  event_lordforjustice_03_e_8:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_e_9:
    speaker: d
    en: "... Please help her."
    ko: "…부탁해."
    ja: "…頼んだ。"
  event_lordforjustice_03_e_10:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_e_11:
    speaker: vii
    en: I have a mission for you, @UserName.
    ko: 임무다. @UserName.
    ja: 任務だ、@UserName。
  event_lordforjustice_03_e_12:
    speaker: vii
    en: It's something you're already quite familiar with, so no explanation will
      be necessary.
    ko: 줄곧 해왔던 일이니, 설명은 필요 없겠지.
    ja: |-
      説明は省略する。
      今回が初めてではないはずだからな。
  event_lordforjustice_03_e_13:
    speaker: "<Self>"
    en: Wait. Before that...
    ko: 잠깐. 그 전에….
    ja: "…待ってくれ。その前に…"
  event_lordforjustice_03_e_14:
    speaker: vii
    en: I'm not taking questions.
    ko: 질문은 받지 않는다.
    ja: 質問は受け付けない。
  event_lordforjustice_03_e_15:
    speaker: vii
    en: Justice has no place for it.
    ko: 그것은 [정의]의 방식이 아니다.
    ja: そこに「正義」はないからだ。
  event_lordforjustice_03_e_16:
    speaker: "<Self>"
    en: What?
    ko: 뭐…?
    ja: "…？"
  event_lordforjustice_03_e_17:
    speaker: vii
    en: We Judges pass judgment.
    ko: 우리 [저지스]는 판결을 내린다.
    ja: 我々「ジャッジス」は判決を下す。
  event_lordforjustice_03_e_18:
    speaker: vii
    en: We embody justice.
    ko: 우리 [저지스]는 정의를 실현한다.
    ja: 我々「ジャッジス」は正義を実現する。
  event_lordforjustice_03_e_19:
    speaker: vii
    en: We are...
    ko: 우리 [저지스]는….
    ja: 我々「ジャッジス」こそが…
  event_lordforjustice_03_e_20:
    speaker: vii
    en: justice itself.
    ko: 정의다.
    ja: 正義だ。
  event_lordforjustice_03_e_21:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_e_22:
    speaker: vii
    en: You must follow and respect this.
    ko: 너는 그 정의를 따라야만 한다.
    ja: ゆえに、お前はただ正義に従えばいい。
  event_lordforjustice_03_e_23:
    speaker: vii
    en: You are the Ark's salvation,
    ko: 방주의 희망으로서.
    ja: アークの希望として。
  event_lordforjustice_03_e_24:
    speaker: vii
    en: and humanity's as well.
    ko: 그리고 인류의 희망으로서.
    ja: そして、人類の希望として。
  event_lordforjustice_03_e_25:
    speaker: vii
    en: You must become an infallible, unwavering symbol of righteousness.
    ko: 한 치의 흔들림도 없는 완벽한 정의의 상징이 되어야 한다.
    ja: |-
      一寸の揺らぎもない、完璧な正義の象徴に
      ならなければならないのだ。
  event_lordforjustice_03_e_26:
    speaker: vii
    en: All of your past verdicts were the foundation.
    ko: 네가 지금까지 내린 판결은 그 밑거름이고.
    ja: お前が今まで下した判決はそのいしずえであり
  event_lordforjustice_03_e_27:
    speaker: vii
    en: Those made in the future will be the harvest.
    ko: 네가 앞으로 내릴 판결은 그 결실이다.
    ja: お前がこれから下す判決はその結実である。
  event_lordforjustice_03_e_28:
    speaker: vii
    en: And this judgment
    ko: 그리고 이번 판결이야말로.
    ja: そして今回の判決は、
  event_lordforjustice_03_e_29:
    speaker: vii
    en: will be the turning point.
    ko: 그 전환점이자,
    ja: その転換点であり、
  event_lordforjustice_03_e_30:
    speaker: vii
    en: A watershed moment, an inflection point, a divergence.
    ko: 분수령이자, 변곡점이자, 분기점이자,
    ja: |-
      分水嶺であり、変曲点であり、
      分岐点でもあるのだ。
  event_lordforjustice_03_e_31:
    speaker: vii
    en: The moment in which you realize the true meaning of justice.
    ko: 네가 정의의 진정한 의미를 깨닫는 순간이 될 것이다.
    ja: |-
      この瞬間をもって、
      お前は正義の真髄を理解することとなるだろう。
  event_lordforjustice_03_e_32:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_e_33:
    speaker: vii
    en: So make your judgment, @UserName.
    ko: 그러니 판결해라, @UserName.
    ja: |-
      さあ、判決を下せ。
      @UserName。
  event_lordforjustice_03_e_34:
    speaker: vii
    en: Deny all falsehoods.
    ko: 거짓을 부정하고,
    ja: 虚偽を否定し、
  event_lordforjustice_03_e_35:
    speaker: vii
    en: Eradicate evil.
    ko: 악을 일소하고,
    ja: 悪を一掃し、
  event_lordforjustice_03_e_36:
    speaker: vii
    en: Uphold justice.
    ko: 정의를 정립해라.
    ja: 正義をここに示すのだ。
  event_lordforjustice_03_e_37:
    speaker: vii
    en: That is your role and your duty.
    ko: 그게 네 역할이자, 의무이며.
    ja: それがお前の役目であり、義務であり、
  event_lordforjustice_03_e_38:
    speaker: vii
    en: It is your destiny.
    ko: "…운명이다."
    ja: "…運命だ。"
  event_lordforjustice_03_e_39:
    speaker: "<Monologue>"
    en: The voice brims with more than mere conviction. It seethes with madness.
    ko: 신념과 확신을 넘어, 광기마저 느껴지는 목소리.
    ja: |-
      信念などという範疇を超え、
      狂気すら感じられる声が耳元で反響する
  event_lordforjustice_03_e_40:
    speaker: "<Monologue>"
    en: I only now realize that I haven't moved this entire time, and it's only with
      considerable effort that I can open my mouth to speak.
    ko: 그것에 나도 모르게 굳어 있다가, 간신히 입을 열었다.
    ja: |-
      その声にいつの間にか固まっていた私は、
      やっとのことで口を開いた
  event_lordforjustice_03_e_41:
    speaker: "<Self>"
    en: "... Who is the target this time?"
    ko: "…그래서, 이번 타겟은 누군데?"
    ja: "…今回のターゲットは誰だ？"
  event_lordforjustice_03_e_42:
    speaker: "<Self>"
    en: Who do you want me to pass judgment on?
    ko: 누구에게 판결을 내리라는 거야?
    ja: 誰に判決を下せばいいんだ？
  event_lordforjustice_03_e_43:
    speaker: vii
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_03_e_44:
    speaker: "<Monologue>"
    en: In response to my question, VII lets out a sigh that seems both regretful,
      yet also self-satisfied.
    ko: 내 물음에 VII은 기쁜 것도, 아쉬운 것도 같은 탄식을 뱉은 뒤.
    ja: |-
      私の問いかけに対し、VIIは
      歓喜と悲嘆が混じったようなため息を吐くと…
  event_lordforjustice_03_e_45:
    speaker: vii
    en: The target this time...
    ko: 이번 타겟은.
    ja: 今回のターゲットは…
  event_lordforjustice_03_e_46:
    speaker: "<Monologue>"
    en: VII indicates the target.
    ko: "…타겟을 지목했다."
    ja: "…ターゲットを指定した"
  event_lordforjustice_03_e_47:
    speaker: vii
    en: Is me.
    ko: 바로 나다.
    ja: "――私だ。"
event_lordforjustice_intermission_01:
  event_lordforjustice_intermission_01_1:
    speaker: "<Narration>"
    en: "*Tadadak*"
    ko: 타다다닥.
    ja: タタタッ
  event_lordforjustice_intermission_01_2:
    speaker: moran_c
    en: Are you sure this is the right way?
    ko: 야. 이쪽 맞아?
    ja: おい、ホントにこっちで合ってんのか？
  event_lordforjustice_intermission_01_3:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_intermission_01_4:
    speaker: "<Monologue>"
    en: K does not respond to Moran's question.
    ko: 달리는 도중에 목단이 물었지만, K는 대답하지 않았다.
    ja: 走りながらモランが聞いたが、Kは答えなかった
  event_lordforjustice_intermission_01_5:
    speaker: moran_c
    en: Hey! I said is this the right way?!
    ko: 이쪽 맞냐니까!
    ja: こっちで合ってんのかって聞いてるだろ！
  event_lordforjustice_intermission_01_6:
    speaker: "<Self>"
    en: "... Most likely, yes."
    ko: "…맞을 거야."
    ja: "…合ってるはずだ"
  event_lordforjustice_intermission_01_7:
    speaker: "<Self>"
    en: I have a rough idea of where the safe house is, so I'll take the lead.
    ko: 안전 가옥 위치는 대충 아니까, 내가 앞장설게.
    ja: |-
      隠れ家の位置なら大体分かる。
      ついてきてくれ
  event_lordforjustice_intermission_01_8:
    speaker: moran_c
    en: "... All right."
    ko: "…알았어, 동생."
    ja: "…分かった。"
  event_lordforjustice_intermission_01_9:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_intermission_01_10:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_intermission_01_11:
    speaker: "<Monologue>"
    en: Watching K silently bite her lip reminds me of what just happened.
    ko: 말없이 입술을 깨무는 K를 보며, 조금 전 있었던 일을 떠올렸다.
    ja: |-
      無言で下唇を噛むKを見ながら、
      私は先ほどの出来事を振り返った
  event_lordforjustice_intermission_01_12:
    speaker: vii
    en: The target this time...
    ko: 이번 타겟은.
    ja: 今回のターゲットは…
  event_lordforjustice_intermission_01_13:
    speaker: vii
    en: Is me.
    ko: 바로 나다.
    ja: "――私だ。"
  event_lordforjustice_intermission_01_14:
    speaker: "<Self>"
    en: What?
    ko: 뭐라고…?
    ja: 何だって…？
  event_lordforjustice_intermission_01_15:
    speaker: vii
    en: Judges are the embodiment of justice,
    ko: "[저지스]는 정의다."
    ja: "「ジャッジス」は正義だ。"
  event_lordforjustice_intermission_01_16:
    speaker: vii
    en: and so we must always be just.
    ko: "[저지스]는 정의로워야만 한다."
    ja: "「ジャッジス」は正義でなければならない。"
  event_lordforjustice_intermission_01_17:
    speaker: vii
    en: But I have lost my way.
    ko: 그러나 나는 [악]이다.
    ja: しかし、私は「悪」だ。
  event_lordforjustice_intermission_01_18:
    speaker: vii
    en: The righteous path which I tread has become one of evil.
    ko: 내가 지금껏 믿어왔던 정의가, 이제는 악이 되었다.
    ja: 私が今まで信じてきた正義は、今や悪となった。
  event_lordforjustice_intermission_01_19:
    speaker: vii
    en: My position can only be inhabited by one with an infallible sense of justice.
    ko: 왕좌는 완전무결한 정의만을 위한 자리.
    ja: |-
      王座に座す者は、
      完全無欠の正義であらねばならない。
  event_lordforjustice_intermission_01_20:
    speaker: vii
    en: And so, I must be judged, and face judgment.
    ko: "…나는 판결을 받아야 한다. 심판을 받아야 한다."
    ja: |-
      …ゆえに、私は判決を受けねばならない。
      審判を受けなければならないのだ。
  event_lordforjustice_intermission_01_21:
    speaker: k
    en: What in the hell is this?
    ko: "…그게 대체 무슨 개소리야?"
    ja: "…何を、言ってるんだ？"
  event_lordforjustice_intermission_01_22:
    speaker: k
    en: You're telling me a Judge, one of the Upper Strata, is the target?
    ko: "[저지스]가, 그것도 윗줄이 타겟이라고?"
    ja: |-
      「ジャッジス」が…
      それも上層部がターゲットだと？
  event_lordforjustice_intermission_01_23:
    speaker: k
    en: And they're the one putting a hit out on themselves?
    ko: 게다가 스스로를 지목해?
    ja: しかも、自分自身を指定する？
  event_lordforjustice_intermission_01_24:
    speaker: k
    en: What kind of insane...
    ko: 무슨 미친 짓을….
    ja: 頭でもイカれたのか…？
  event_lordforjustice_intermission_01_25:
    speaker: vii
    en: You already know the answer to the question you're about to ask, K.
    ko: K. 너는 이미 답을 알고 있다.
    ja: K、お前はすでに答えを知っているはずだ。
  event_lordforjustice_intermission_01_26:
    speaker: k
    en: What?
    ko: 뭐…?
    ja: は…？
  event_lordforjustice_intermission_01_27:
    speaker: vii
    en: You may know the answer, but you no longer have the privilege.
    ko: 넌 답을 알고 있지만, 자격을 잃었다.
    ja: お前は答えを知っているが、資格を失った。
  event_lordforjustice_intermission_01_28:
    speaker: vii
    en: A puppet is not entitled to uphold justice.
    ko: 꼭두각시에게는 정의로울 자격이 없다.
    ja: 操り人形に、正義の資格はない。
  event_lordforjustice_intermission_01_29:
    speaker: "<Self>"
    en: Is that because K is a Nikke?
    ko: "…K가 니케라서?"
    ja: "…Kがニケだからか？"
  event_lordforjustice_intermission_01_30:
    speaker: vii
    en: It's nothing so banal as that.
    ko: 그런 건 사소한 문제다, @UserName.
    ja: |-
      そんなことはどうでもいい問題だ、
      @UserName。
  event_lordforjustice_intermission_01_31:
    speaker: vii
    en: K has failed us.
    ko: 그것과 상관없이, K는 실패했다.
    ja: Kは失敗したのだ。
  event_lordforjustice_intermission_01_32:
    speaker: vii
    en: She has forgotten her mission.
    ko: 주어진 사명을 잊고.
    ja: 与えられた使命を失い、
  event_lordforjustice_intermission_01_33:
    speaker: vii
    en: She has forsaken the name which was given to her.
    ko: 주어진 이름을 버리고.
    ja: 与えられた名前を捨て、
  event_lordforjustice_intermission_01_34:
    speaker: vii
    en: She has failed time and time again,
    ko: 실패를 거듭해,
    ja: 失敗を繰り返し、
  event_lordforjustice_intermission_01_35:
    speaker: vii
    en: and become little more than a hollow puppet.
    ko: 공허한 꼭두각시가 되었다.
    ja: 中身のない操り人形となった。
  event_lordforjustice_intermission_01_36:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 잘그락.
    ja: チャリン…
  event_lordforjustice_intermission_01_37:
    speaker: k
    en: What's this?
    ko: 이, 건…?
    ja: これは…？
  event_lordforjustice_intermission_01_38:
    speaker: "<Self>"
    en: A key?
    ko: 열쇠…?
    ja: 鍵…？
  event_lordforjustice_intermission_01_39:
    speaker: "<Monologue>"
    en: K vacantly pulls out an old key from her coat.
    ko: K는 멍하니 품속에서 낡은 열쇠 하나를 꺼냈다.
    ja: |-
      Kはぼうぜんとした表情で
      胸元から古びた鍵を取り出した
  event_lordforjustice_intermission_01_40:
    speaker: vii
    en: That will tell you about the path you've walked.
    ko: 그게 네가 걸어온 길이다.
    ja: それがお前の歩んできた道へと導くだろう。
  event_lordforjustice_intermission_01_41:
    speaker: vii
    en: It will reveal the truth and the facts.
    ko: 진실이자, 진의이자, 진상이며.
    ja: あるいは真実であり、真意であり、真相であり…
  event_lordforjustice_intermission_01_42:
    speaker: vii
    en: It will reveal my beliefs, my will...
    ko: 신념이자, 의지이며….
    ja: 信念であり、意志であり…
  event_lordforjustice_intermission_01_43:
    speaker: vii
    en: and my sense of justice.
    ko: "…내 정의였다."
    ja: "…私の正義だったものへと。"
  event_lordforjustice_intermission_01_44:
    speaker: "<Self>"
    en: K...
    ko: K….
    ja: K…
  event_lordforjustice_intermission_01_45:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 잘그락.
    ja: チャリン…
  event_lordforjustice_intermission_01_46:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_intermission_01_47:
    speaker: "<Monologue>"
    en: K clenches tightly to the old key in her hand,
    ko: K는 손에 쥔 낡은 열쇠를.
    ja: Kは手のひらに収まっている古びた鍵を
  event_lordforjustice_intermission_01_48:
    speaker: "<Monologue>"
    en: to which there is a tag attached which reads,
    ko: "[특급 기밀 보관소 S-1452] 라고 적힌 이름표가 붙어 있는 열쇠를."
    ja: |-
      「機密保管庫S-1452」と記された
      名札が貼られた鍵を
  event_lordforjustice_intermission_01_49:
    speaker: "<Monologue>"
    en: Top Secret Archive S-1452.
    ko: 부서져라 쥐었다.
    ja: 壊れそうになるほどの力で握りしめた
event_lordforjustice_04_s:
  event_lordforjustice_04_s_1:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャ…
  event_lordforjustice_04_s_2:
    speaker: "<Monologue>"
    en: We arrive at the Perilous Siege safe house located within the Ark and open
      the door.
    ko: 방주에 위치한 시지 패러리스의 안전 가옥에 도착해 문을 열었다.
    ja: |-
      アークにあるシージペリラスの隠れ家に到着し、
      ドアを開けた
  event_lordforjustice_04_s_3:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_s_4:
    speaker: "<Monologue>"
    en: A panoply of books, which have clearly been taken from the Forbidden Library,
    ko: 미리 짐작했던 듯.
    ja: そこには、Kが予想していた通りに
  event_lordforjustice_04_s_5:
    speaker: "<Monologue>"
    en: lie scattered around the safe house.
    ko: "…아니면, 이미 떠올렸던 듯."
    ja: |-
      …あるいは、思い出した記憶の通りに、
      禁書庫から盗まれたであろう本が散乱していた
  event_lordforjustice_04_s_6:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_s_7:
    speaker: "<Monologue>"
    en: K doesn't so much as flinch at the sight.
    ko: K는 안전 가옥에 널려 있는,
    ja: Kは隠れ家に広がる光景を見ても
  event_lordforjustice_04_s_8:
    speaker: "<Monologue>"
    en: It's as if she was expecting it... or already knew.
    ko: 금서고에서 가져온 것이 분명한 책들을 보고도 동요하지 않았다.
    ja: 眉一つ動かさなかった
  event_lordforjustice_04_s_9:
    speaker: moran_c
    en: Aren't those...
    ko: 이건… 그거지?
    ja: これって…あれか？
  event_lordforjustice_04_s_10:
    speaker: moran_c
    en: the records that were missing?
    ko: 그 없어졌다는 기록들?
    ja: 例の、なくなったっていう記録。
  event_lordforjustice_04_s_11:
    speaker: "<Self>"
    en: I think so.
    ko: "…그런 것 같아."
    ja: "…そうみたいだな"
  event_lordforjustice_04_s_12:
    speaker: "<Monologue>"
    en: I pick up one of the books.
    ko: 아무렇게나 널려 있는 책들 중 하나를 집어 들었다.
    ja: 無造作に置かれている本を1つ手に取った
  event_lordforjustice_04_s_13:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락.
    ja: ペラ…
  event_lordforjustice_04_s_14:
    speaker: "<Narration>"
    en: 'Mission Code: K-53 / Declassified'
    ko: "[임무 코드 : K-53 / 기밀 해제됨]"
    ja: "「任務コード：K-53 / 機密解除済み」"
  event_lordforjustice_04_s_15:
    speaker: "<Narration>"
    en: 'Target: REDACTED'
    ko: "[타겟 : -검열됨-]"
    ja: "「ターゲット：―検閲済み―」"
  event_lordforjustice_04_s_16:
    speaker: "<Narration>"
    en: Assignment of Judgment regarding REDACTED.
    ko: "[-검열됨-에 대한 판결 미션.]"
    ja: "「―検閲済み―に対する判決」"
  event_lordforjustice_04_s_17:
    speaker: "<Narration>"
    en: REDACTED emerged as a major political figure amidst the chaos that spread
      during the evacuation to the Ark.
    ko: "[-검열됨-은 방주 피난 직후 혼란한 상황을 이용해 유력한 정치가로 떠오름.]"
    ja: |-
      「―検閲済み―はアークへの避難直後、
      混乱に乗じて有力な政治家として台頭した」
  event_lordforjustice_04_s_18:
    speaker: "<Narration>"
    en: He initially appeared upright and honest,
    ko: "[초기에는 청렴한 것처럼 보였으나,]"
    ja: "「当初は清廉な人物のように見えたが」"
  event_lordforjustice_04_s_19:
    speaker: "<Narration>"
    en: but he is now believed to have become intoxicated by power, and is plotting
      to overthrow the Central Government.
    ko: "[권력의 독에 취해 중앙 정부를 전복할 계획을 세우고 있는 것으로 파악됨.]"
    ja: |-
      「権力の毒に溺れ、中央政府の転覆を
      計画しているものと見られる」
  event_lordforjustice_04_s_20:
    speaker: "<Narration>"
    en: Refer to attached evidence and conduct further investigation before delivering
      judgment.
    ko: "[별첨 된 증거 문서를 확인하고, 추가 조사를 진행한 뒤 판결을 내릴 것.]"
    ja: |-
      「別添の証拠文書を確認し、
      追加の調査を実施した後、判決を下すこと」
  event_lordforjustice_04_s_21:
    speaker: "<Narration>"
    en: For humankind. May justice prevail.
    ko: "[인류를 위한 정의를.]"
    ja: "「人類のための正義を」"
  event_lordforjustice_04_s_22:
    speaker: "<Self>"
    en: This must have been K's mission.
    ko: 이건 K의 임무… 였겠네.
    ja: これは…Kの任務、だったようだな
  event_lordforjustice_04_s_23:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락.
    ja: ペラ…
  event_lordforjustice_04_s_24:
    speaker: "<Narration>"
    en: 'Mission Code: D-77 / Declassified'
    ko: "[임무 코드 : D-77 / 기밀 해제됨]"
    ja: "「任務コード：D-77 / 機密解除済み」"
  event_lordforjustice_04_s_25:
    speaker: "<Narration>"
    en: 'Target: Bright Squad'
    ko: "[타겟 : 브라이트 스쿼드]"
    ja: "「ターゲット：ブライト部隊」"
  event_lordforjustice_04_s_26:
    speaker: "<Narration>"
    en: 'Assignment: Gather intel on Bright Squad.'
    ko: "[브라이트 스쿼드에 대한 정보 획득 미션.]"
    ja: "「ブライト部隊に関する情報獲得任務」"
  event_lordforjustice_04_s_27:
    speaker: "<Narration>"
    en: Frequent injuries and mission delays have been reported within the squad.
    ko: "[해당 스쿼드에서는 잦은 부상 이탈과 임무 지연이 발생하고 있으며,]"
    ja: |-
      「該当部隊では度重なる負傷による離脱と
      任務遅延が発生しており」
  event_lordforjustice_04_s_28:
    speaker: "<Narration>"
    en: Intel suggests the squad leader could be deliberately sabotaging missions.
    ko: "[스쿼드 리더가 고의로 태업 및 사보타주를 벌인다는 첩보가 입수됨.]"
    ja: |-
      「リーダーが故意に怠業的行為を行っているとの
      情報を入手」
  event_lordforjustice_04_s_29:
    speaker: "<Narration>"
    en: Infiltrate their ranks, go undercover on a mission to the surface, and gather
      intel.
    ko: "[해당 스쿼드의 지상 작전에 위장 잠입해 정보를 수집할 것.]"
    ja: |-
      「該当部隊の地上作戦に潜入し、
      追加の情報を収集すること」
  event_lordforjustice_04_s_30:
    speaker: "<Narration>"
    en: If the squad leader is determined to have been corrupted or otherwise overtaken,
      preauthorization for immediate disposal is granted.
    ko: |-
      [만약 스쿼드 리더가 사고 전환, 침식 등 이상 개체로 확인될 시
      즉결 처분을 사전 허가함.]
    ja: |-
      「万が一リーダーが思考転換、侵食などといった
      異常個体と確認された場合は、
      即時処分を事前に許可する」
  event_lordforjustice_04_s_31:
    speaker: "<Narration>"
    en: If not, focus on intelligence gathering.
    ko: "[그러나 그 외의 상황이라면, 단순 정보 수집에 집중할 것.]"
    ja: |-
      「ただし、それ以外のケースであった場合は、
      情報収集のみに集中すること」
  event_lordforjustice_04_s_32:
    speaker: "<Narration>"
    en: For humankind. May justice prevail.
    ko: "[인류를 위한 정의를.]"
    ja: "「人類のための正義を」"
  event_lordforjustice_04_s_33:
    speaker: "<Self>"
    en: D...
    ko: D….
    ja: D…
  event_lordforjustice_04_s_34:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락.
    ja: ペラ…
  event_lordforjustice_04_s_35:
    speaker: "<Monologue>"
    en: More and more similar entries appear in the books.
    ko: 계속 훑어본 결과, 다른 책들에도 비슷한 내용이 기록되어 있다.
    ja: |-
      その後も資料に目を通し続けたが、
      どの本も似たような内容が記録されていた
  event_lordforjustice_04_s_36:
    speaker: moran_c
    en: Cadet.
    ko: "…동생."
    ja: "…弟、ちょっといいか。"
  event_lordforjustice_04_s_37:
    speaker: moran_c
    en: I think you should take a look at this.
    ko: 이거 좀 봐야 할 것 같아.
    ja: こいつを見てくれ。
  event_lordforjustice_04_s_38:
    speaker: "<Monologue>"
    en: I open the book Moran handed over to me.
    ko: 목단이 넘겨준 책을 받아 펼쳤다.
    ja: モランに渡された本を開いた
  event_lordforjustice_04_s_39:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: パラッ…
  event_lordforjustice_04_s_40:
    speaker: "<Narration>"
    en: 'Mission Code: VII-1 / Declassified'
    ko: "[임무 코드 : VII-1 / 기밀 해제됨]"
    ja: "「任務コード：VII-1 / 機密解除済み」"
  event_lordforjustice_04_s_41:
    speaker: "<Narration>"
    en: Proposal for upholding justice within the Ark and across humanity as a whole.
    ko: "[방주와 인류의 정의를 위한 안.]"
    ja: "「アークと人類の正義のための議案」"
  event_lordforjustice_04_s_42:
    speaker: "<Narration>"
    en: Within the insular society of the Ark, the activities of Perilous Siege proved
      remarkably effective.
    ko: "[방주라는 닫힌사회 안에서 시지 패러리스의 활동은 지나치게 효과적이었고,]"
    ja: |-
      「アークという閉ざされた社会の中で
      シージペリラスの活動は非常に効果的であった」
  event_lordforjustice_04_s_43:
    speaker: "<Narration>"
    en: All traces of evil within the Ark were soon eradicated.
    ko: "[얼마 지나지 않아 방주의 악은 사멸함.]"
    ja: "「ほどなくしてアークの悪は死滅した」"
  event_lordforjustice_04_s_44:
    speaker: "<Narration>"
    en: However,
    ko: "[하지만.]"
    ja: "「しかし」"
  event_lordforjustice_04_s_45:
    speaker: "<Narration>"
    en: evil is the darker side of the coin which must exist for justice to persist.
    ko: "[정의를 위해 악은 존재해야 하므로.]"
    ja: "「正義のために、悪は存在しなければならない」"
  event_lordforjustice_04_s_46:
    speaker: "<Narration>"
    en: Therefore, a proposal to maintain justice and oversee Perilous Siege has been
      drafted,
    ko: "[정의의 영속과 시지 패러리스의 제어를 위한 계획을 제시함.]"
    ja: |-
      「よって、正義の永続とシージペリラスの
      制御のための計画を提出する」
  event_lordforjustice_04_s_47:
    speaker: "<Narration>"
    en: 'which can be seen below:'
    ko: "[아래는 그 가안임.]"
    ja: "「以下は、その仮案である」"
  event_lordforjustice_04_s_48:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_04_s_49:
    speaker: "<Narration>"
    en: 1. Formation of Slums.
    ko: "[1. 슬럼가의 형성.]"
    ja: "「1. スラム街の形成」"
  event_lordforjustice_04_s_50:
    speaker: "<Narration>"
    en: Originally intended for formation of minor criminal organizations and other
      forms of social instability,
    ko: "[군소 범죄 조직의 형성과 사회 불안 고조 등을 위한 계획을 세웠으나,]"
    ja: |-
      「小規模な犯罪組織の形成および
      社会不安の高まりなどを
      目的とした計画を立てたが」
  event_lordforjustice_04_s_51:
    speaker: "<Narration>"
    en: but determined to be unnecessary due to the current structure and atmosphere
      of the Ark.
    ko: |-
      [조사 결과 현재 방주의 사회 구조와 분위기라면,
      별도의 행동이 필요하지 않을 것으로 판단됨.]
    ja: |-
      「調査の結果、
      現在のアークの社会構造と情勢から判断し、
      別途の措置は必要ないと判断」
  event_lordforjustice_04_s_52:
    speaker: "<Narration>"
    en: Priority downgraded. Only periodic monitoring required.
    ko: "[해당 계획은 우선도를 낮추고, 정기적으로 모니터링만 진행할 예정.]"
    ja: |-
      「この計画は優先度を落とし、
      定期的にモニタリングのみを行う予定とする」
  event_lordforjustice_04_s_53:
    speaker: "<Self>"
    en: The Outer Rim...
    ko: 아우터림….
    ja: アウターリム…
  event_lordforjustice_04_s_54:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: パラッ…
  event_lordforjustice_04_s_55:
    speaker: "<Narration>"
    en: 2. Formation of Pro-Rapture Radical Group.
    ko: "[2. 랩쳐에게 호의적인 급진적 집단의 구성.]"
    ja: |-
      「2. ラプチャーに好意的な
      急進的グループへの支援」
  event_lordforjustice_04_s_56:
    speaker: "<Narration>"
    en: Public awareness of Raptures continues to decline.
    ko: "[일반 시민들의 랩쳐에 대한 경각심이 날이 갈수록 낮아지고 있음.]"
    ja: |-
      「昨今、一般市民のラプチャーに対する
      警戒心が日に日に低下している」
  event_lordforjustice_04_s_57:
    speaker: "<Narration>"
    en: The attached survey suggests this is due to the fact ordinary citizens rarely
      encounter Raptures personally.
    ko: |-
      [평범한 시민들은 랩쳐의 모습을 보기도 어렵기 때문으로 파악됨.
      첨부한 여론조사 결과 참고.]
    ja: |-
      「一般市民はラプチャーに遭遇することが
      稀なためと推測。
      詳細は添付の世論調査結果を参照」
  event_lordforjustice_04_s_58:
    speaker: "<Narration>"
    en: Therefore, pro-Rapture radical groups are to receive clandestine support
    ko: "[따라서, 랩쳐에게 호의적인 급진적인 집단의 활동을 배후에서 지원해,]"
    ja: |-
      「よって、ラプチャーに好意的な
      急進的グループの活動を裏から支援し」
  event_lordforjustice_04_s_59:
    speaker: "<Narration>"
    en: to increase awareness, and foment hostility, towards Raptures from the general
      populace.
    ko: "[일반 시민들의 랩쳐에 대한 적개심을 고취.]"
    ja: |-
      「一般市民のラプチャーに対する
      敵対心を高めること」
  event_lordforjustice_04_s_60:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_s_61:
    speaker: moran_c
    en: Let's see what's next.
    ko: "…다음도 봐봐."
    ja: "…次のも見てみろ。"
  event_lordforjustice_04_s_62:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락.
    ja: ペラ…
  event_lordforjustice_04_s_63:
    speaker: "<Narration>"
    en: 3. Conduct Surveillance on REDACTED.
    ko: "[3. -검열됨-에 대한 견제.]"
    ja: "「3. ―検閲済み―に対する牽制」"
  event_lordforjustice_04_s_64:
    speaker: "<Narration>"
    en: REDACTED is a powerful tool, but may fail to understand the Judges' concept
      of justice.
    ko: "[-검열됨-은 강력한 도구이나, 저지스의 정의를 이해하지 못할 위험성이 존재함.]"
    ja: |-
      「―検閲済み―は強力なツールではあるが、
      ジャッジスの正義を正しく理解できない
      可能性がある」
  event_lordforjustice_04_s_65:
    speaker: "<Narration>"
    en: As such, it is necessary to, through the use of up-to-date research and indirect
      means discovered by REDACTED,
    ko: "[따라서, 최근의 연구와 -검열됨-의 협력으로 가능성이 발견된 우회 루트를 활용,]"
    ja: |-
      「よって、最近の研究と―検閲済み―の
      協力によって発見された
      バイパスルートを通じて」
  event_lordforjustice_04_s_66:
    speaker: "<Narration>"
    en: find a way to prevent REDACTED from being an impediment in any way.
    ko: "[-검열됨-의 방해를 막거나, 궁극적으로 이용할 수 있는 방안의 논의가 필요함.]"
    ja: |-
      「―検閲済み―による妨害を防ぐ、
      あるいは最終的にこれを利用する
      手段についての検討が必要である」
  event_lordforjustice_04_s_67:
    speaker: "<Narration>"
    en: On July 22nd, X recommended a candidate for this plan.
    ko: "[0722 추가. X께서 해당 계획의 적임자를 추천.]"
    ja: "「0722追加。Xがこの計画の適任者を推薦」"
  event_lordforjustice_04_s_68:
    speaker: "<Narration>"
    en: 'She is a skilled hacker operating under the codename #000000.'
    ko: "[정보 및 해킹에 능한 인물로, [#000000]라는 코드네임을 사용 중.]"
    ja: |-
      「情報およびハッキングに長けた人物で、
      コードネーム『#000000』を使用中」
  event_lordforjustice_04_s_69:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_04_s_70:
    speaker: "<Narration>"
    en: Proposal passed with 6 votes in favor and 3 against, excluding the proposer.
    ko: "[적합성 논의 결과, 발의자를 제외하고 찬성 6표, 반대 3표로 가결.]"
    ja: |-
      「議論の結果、
      発議者を除き賛成6票、反対3票で可決」
  event_lordforjustice_04_s_71:
    speaker: "<Narration>"
    en: Covert contact underway.
    ko: "[비밀리에 접촉 진행 중.]"
    ja: "「内密に接触を行っている」"
  event_lordforjustice_04_s_72:
    speaker: "<Self>"
    en: I certainly didn't expect that name to show up here.
    ko: "…여기서 이 이름이 나올 줄은 몰랐는데."
    ja: "…ここでこの名前が出るとはな"
  event_lordforjustice_04_s_73:
    speaker: moran_c
    en: Neither did I...
    ko: 나도 마찬가지야. 그래도….
    ja: |-
      ああ、俺も読んだときはびっくりしたぜ。
      ま、それはさておき…
  event_lordforjustice_04_s_74:
    speaker: moran_c
    en: But at least we found a lead.
    ko: 드디어, 꼬리를 잡았어.
    ja: ようやくシッポをつかめた。
  event_lordforjustice_04_s_75:
    speaker: moran_c
    en: I can finally face the Peony Association again.
    ko: 이제야… 우리 애들 볼 면목이 서겠어.
    ja: これで…仲間にも顔向けできそうだ。
  event_lordforjustice_04_s_76:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 툭.
    ja: コンッ
  event_lordforjustice_04_s_77:
    speaker: "<Self>"
    en: K?
    ko: "…K?"
    ja: "…K？"
  event_lordforjustice_04_s_78:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_s_79:
    speaker: "<Monologue>"
    en: K drops the book that she was reading and starts to tremble.
    ko: 살펴보고 있던 책을 툭 떨어뜨린 K의 손이 벌벌 떨리고 있다.
    ja: |-
      見ていた本を落としたKの手が、
      ぶるぶると震えている
  event_lordforjustice_04_s_80:
    speaker: "<Self>"
    en: Are you okay?
    ko: 괜찮아?
    ja: 大丈夫か？
  event_lordforjustice_04_s_81:
    speaker: k
    en: "..."
    ko: "………."
    ja: "………"
  event_lordforjustice_04_s_82:
    speaker: "<Monologue>"
    en: As I move towards K, I catch sight of what was in the book that fell to the
      floor.
    ko: K에게 다가가다가, 바닥에 떨어져 펼쳐진 책의 글자가 눈에 들어왔다.
    ja: |-
      ふと、Kの足下に落ちたページが開かれたままの
      本の文字が目に入ってきた
  event_lordforjustice_04_s_83:
    speaker: "<Narration>"
    en: VII-1 Mid-Report.
    ko: "[VII-1 중간보고]"
    ja: "「VII-1 中間報告」"
  event_lordforjustice_04_s_84:
    speaker: "<Narration>"
    en: Mission success rate for general agents and Nikkes is under 50%.
    ko: "[일반 요원이나 니케를 활용한 미션의 성공률이 50%에 미치지 못하는 상황.]"
    ja: |-
      「一般要員やニケを投入した任務の成功率が
      50％に満たない状況が続いている」
  event_lordforjustice_04_s_85:
    speaker: "<Narration>"
    en: The plan itself is sound, but the method is flawed.
    ko: "[계획의 실효성은 검증되었으나, 수단에 문제가 있다고 판단됨.]"
    ja: |-
      「計画の実効性は確保されてはいるものの、
      手段に問題があると判断する」
  event_lordforjustice_04_s_86:
    speaker: "<Narration>"
    en: Therefore, one Nikke from Perilous Siege will be deployed on mission VII-1
      as a parallel agent.
    ko: "[따라서, 시지 패러리스 니케 중 1기를 VII-1 임무 병행으로 배치할 예정.]"
    ja: |-
      「よって、シージペリラスのニケのうち1機を
      VII-1任務と並行して配置予定」
  event_lordforjustice_04_s_87:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_s_88:
    speaker: "<Narration>"
    en: Codename K gladly accepted the mission.
    ko: "[코드네임 K는 기쁘게 임무를 받아들임.]"
    ja: "「コードネームKは快く任務を受諾」"
event_lordforjustice_04_e:
  event_lordforjustice_04_e_1:
    speaker: vii
    en: Have you reviewed everything?
    ko: 전부 숙지했나?
    ja: すべて把握したか？
  event_lordforjustice_04_e_2:
    speaker: k
    en: Yes.
    ko: 어.
    ja: ああ。
  event_lordforjustice_04_e_3:
    speaker: vii
    en: We have high expectations for you.
    ko: 너에게 거는 기대가 아주 크다.
    ja: お前には大いに期待している。
  event_lordforjustice_04_e_4:
    speaker: vii
    en: That means you have a great responsibility.
    ko: 바꾸어 말하면, 그만큼 책임도 막중하다는 뜻이지.
    ja: 言い換えれば、それだけ責任重大ということだ。
  event_lordforjustice_04_e_5:
    speaker: k
    en: It's to carry out justice, isn't it?
    ko: 정의를 실현하는 일이잖아?
    ja: 正義を実現するためなんだろ？
  event_lordforjustice_04_e_6:
    speaker: k
    en: I've been doing that all along. I know the weight of this burden.
    ko: 지금까지도 계속해 왔던 일이고, 그 무게도 잘 알고 있어.
    ja: |-
      今までに何度もやってきたし、
      その重さも分かってるつもりだ。
  event_lordforjustice_04_e_7:
    speaker: vii
    en: Confidence is good, but it won't be enough.
    ko: 자신감이 넘치는 것은 좋지만, 그것만으로는 부족하다.
    ja: |-
      自信があるのは結構だが、
      それだけでは十分ではないな。
  event_lordforjustice_04_e_8:
    speaker: k
    en: Then what more is needed?
    ko: 그럼 뭐가 더 필요한데?
    ja: へぇ、何が足りないって？
  event_lordforjustice_04_e_9:
    speaker: vii
    en: Conviction.
    ko: 확신.
    ja: 確信だ。
  event_lordforjustice_04_e_10:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_e_11:
    speaker: vii
    en: An unwavering belief that the path you are walking is righteous.
    ko: 이 길이 정의로운 길임을.
    ja: この道が正義の道であると
  event_lordforjustice_04_e_12:
    speaker: vii
    en: There must not be a shred of doubt.
    ko: 단 한 치의 의심도 없이 믿는, 확신.
    ja: 一寸の疑いもなく信じる、確信が必要なのだ。
  event_lordforjustice_04_e_13:
    speaker: vii
    en: Without such conviction, I cannot entrust this mission to you.
    ko: 그것이 없다면, 네게 이 임무를 맡길 수 없다.
    ja: |-
      それがなければ、
      お前にこの任務は任せられない。
  event_lordforjustice_04_e_14:
    speaker: k
    en: I thought you were going to say something else.
    ko: "…난 또 무슨 말을 하나 했네."
    ja: ハッ…そんなことか。
  event_lordforjustice_04_e_15:
    speaker: k
    en: You think I don't have conviction?
    ko: 나한테 그게 없을 것 같아?
    ja: 今さら、それが私にはないとでも？
  event_lordforjustice_04_e_16:
    speaker: k
    en: Do you think I could have done what I've done without it?
    ko: 확신 없이 그런 판결들을 내릴 수 있었겠냐고.
    ja: |-
      確信もないまま、今まであんな判決を
      下してきたと思ってんのかよ？
  event_lordforjustice_04_e_17:
    speaker: k
    en: At any rate, I've seen that they're expanding the library,
    ko: 요번에 보니까 그 도서관 증축해서 보관한다고,
    ja: "…そういや、また図書館を増築するとか言って"
  event_lordforjustice_04_e_18:
    speaker: k
    en: storing even the most minute of details.
    ko: 시시콜콜한 것까지 다 긁어가더만.
    ja: どうでもいいことまで全部記録してたな。
  event_lordforjustice_04_e_19:
    speaker: vii
    en: That's because records are important.
    ko: 기록은 중요하다.
    ja: 記録は重要だ。
  event_lordforjustice_04_e_20:
    speaker: vii
    en: Our mission is to establish a universal form of justice,
    ko: 우리가 하는 일의 목적은.
    ja: 我々の目的は
  event_lordforjustice_04_e_21:
    speaker: vii
    en: one which all of humanity can share, recognize,
    ko: 모든 인류가 공유하고, 인정하고,
    ja: すべての人類が共有し、認め、
  event_lordforjustice_04_e_22:
    speaker: vii
    en: and follow.
    ko: 따를 수 있는 [정의]를 세우는 것이니까.
    ja: 信じられる「正義」を実現することにある。
  event_lordforjustice_04_e_23:
    speaker: k
    en: Spare me the linguistic gymnastics and just let me do my thing.
    ko: 아아. 복잡한 얘기는 됐고, 그냥 맡겨.
    ja: |-
      ハイハイ…難しい話はそんくらいにして、
      あとは任せとけって。
  event_lordforjustice_04_e_24:
    speaker: k
    en: I'll show you what justice really is.
    ko: 내가 정의가 뭔지 확실하게 보여줄 테니까.
    ja: |-
      正義が何なのか、
      その目に焼きつけてやるからさ。
  event_lordforjustice_04_e_25:
    speaker: k
    en: And I'll do it by any means necessary.
    ko: "…[무슨 수를 써서라도]."
    ja: "…「どんな手を使ってでも」ね。"
  event_lordforjustice_04_e_26:
    speaker: vii
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_e_27:
    speaker: vii
    en: Understood.
    ko: "…잘 알겠다."
    ja: "…分かった。"
  event_lordforjustice_04_e_28:
    speaker: k
    en: I... I remember.
    ko: 기억… 났어.
    ja: 思い…出した。
  event_lordforjustice_04_e_29:
    speaker: k
    en: So that's what happened...
    ko: 하하… 그랬구나.
    ja: ははっ…そういうことか。
  event_lordforjustice_04_e_30:
    speaker: k
    en: I was just a puppet,
    ko: 난 그냥… 꼭두각시였어.
    ja: 私はただの…操り人形だった。
  event_lordforjustice_04_e_31:
    speaker: k
    en: completely hollow inside.
    ko: 아무것도 모르고.
    ja: 何も知らないまま、
  event_lordforjustice_04_e_32:
    speaker: k
    en: I didn't have a clue.
    ko: 속이 텅 빈 것도 모르고.
    ja: 中が空っぽなことにも気づかないまま、
  event_lordforjustice_04_e_33:
    speaker: k
    en: All I was doing was dancing to someone else's tune.
    ko: 남들이 휘두르는 대로 움직이면서.
    ja: 誰かが指示する通りに動いて…
  event_lordforjustice_04_e_34:
    speaker: k
    en: There's nothing righteous about that.
    ko: 정의가 아니라….
    ja: 正義どころか、むしろ…
  event_lordforjustice_04_e_35:
    speaker: "<Self>"
    en: K, it's not your fault.
    ko: "…K. 네 잘못이 아냐."
    ja: "…K。君のせいではない"
  event_lordforjustice_04_e_36:
    speaker: "<Self>"
    en: The Judges erased your memories so they could use you.
    ko: 저지스가 네 기억을 지우고, 이용하려고….
    ja: ジャッジスが君の記憶を消し、利用しようと…
  event_lordforjustice_04_e_37:
    speaker: k
    en: What difference does that make?
    ko: "…그런 거라면 뭐가 달라져?"
    ja: "…仮にそうだったとして、何が変わる？"
  event_lordforjustice_04_e_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_04_e_39:
    speaker: k
    en: What does it change?
    ko: 뭐가 달라지냐고.
    ja: なぁ、何が変わるのか言ってみろよ？
  event_lordforjustice_04_e_40:
    speaker: k
    en: It doesn't wash my hands of the blood I spilled for no good reason.
    ko: 내가 지금까지 손에 묻혀온 피에, 의미가 생겨?
    ja: 今まで流した血に意味が生まれんのか？
  event_lordforjustice_04_e_41:
    speaker: k
    en: It doesn't change the fact that everything which I believed was justice,
    ko: 내가 지금까지 옳다고 믿어왔던 게,
    ja: 今まで正しいと信じてきたことが…
  event_lordforjustice_04_e_42:
    speaker: k
    en: instead was evil!
    ko: 악이 아니라 정의로 바뀌냐고…!
    ja: 悪じゃなく、正義に変わんのかよ…！！
  event_lordforjustice_04_e_43:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 툭.
    ja: トンッ
  event_lordforjustice_04_e_44:
    speaker: "<Monologue>"
    en: Moran slams the book she was reading to the floor.
    ko: 목단은 훑어보고 있던 책을 대충 바닥에 던졌다.
    ja: モランは読んでいた本を床に投げた
  event_lordforjustice_04_e_45:
    speaker: moran_c
    en: Would you can it already?!
    ko: 아까부터 듣자 하니 시끄러워 죽겠네.
    ja: |-
      さっきからおとなしく聞いてれば、
      うるさくてたまったもんじゃねえな。
  event_lordforjustice_04_e_46:
    speaker: k
    en: What?
    ko: "…뭐?"
    ja: "…は？"
  event_lordforjustice_04_e_47:
    speaker: moran_c
    en: Get over here.
    ko: 와봐.
    ja: ほら、こっちこい。
  event_lordforjustice_04_e_48:
    speaker: "<Monologue>"
    en: Moran grabs K's arm and drags her out.
    ko: 목단은 K의 팔을 잡고 질질 끌고 가기 시작했다.
    ja: |-
      モランはKの腕をつかむと、
      ずるずると引っ張った
  event_lordforjustice_04_e_49:
    speaker: moran_c
    en: What the... how come you're so heavy?
    ko: 뭐, 뭐야. 너 왜 이렇게 무거워?
    ja: な、なんでこんなに重てぇんだ！？
  event_lordforjustice_04_e_50:
    speaker: "<Self>"
    en: Where are you going?
    ko: 어디 가려고?
    ja: どこに行くつもりだ？
  event_lordforjustice_04_e_51:
    speaker: moran_c
    en: I have something to show you.
    ko: 보여줄 게 있어서.
    ja: ちょっと見せたいものがあってな。
  event_lordforjustice_04_e_52:
    speaker: "<Self>"
    en: What is it?
    ko: "…뭐를?"
    ja: "…何だ？"
  event_lordforjustice_04_e_53:
    speaker: moran_c
    en: "..."
    ko: 음….
    ja: んー…言うなれば、
  event_lordforjustice_04_e_54:
    speaker: moran_c
    en: My interpretation of justice.
    ko: 내 정의.
    ja: 俺の正義、ってやつさ。
event_lordforjustice_05_s:
  event_lordforjustice_05_s_1:
    speaker: "<Monologue>"
    en: Moran ends up taking us to Fog Hollow.
    ko: "…목단이 K를 끌고 도착한 곳은 포그 할로우였다."
    ja: |-
      …モランがKを連れて到着した場所は、
      フォグホロウだった
  event_lordforjustice_05_s_2:
    speaker: jin
    en: Huh? Moran?
    ko: 어어? 누님?
    ja: おおっ？姉貴じゃないですか。
  event_lordforjustice_05_s_3:
    speaker: jin
    en: Didn't I tell you to take it easy? What are you doing here?
    ko: 쉬시라니까 왜 또 나오셨어요?
    ja: どうしてまたここに？
  event_lordforjustice_05_s_4:
    speaker: moran_c
    en: I'm just stopping by.
    ko: 그냥 잠깐 들렀어.
    ja: まあ、ちょっと立ち寄ってみたくなってさ。
  event_lordforjustice_05_s_5:
    speaker: "<Monologue>"
    en: After a brief chat with Moran, Jin leaves and Moran turns to us.
    ko: 잠시 목단과 이야기를 나누던 진이 돌아가고, 목단은 우리에게 돌아섰다.
    ja: |-
      ジンとしばらく話をして見送ったあと、
      モランが私たちの方に戻って来た
  event_lordforjustice_05_s_6:
    speaker: moran_c
    en: Here, look.
    ko: 자, 봐.
    ja: ほら、あれを見ろ。
  event_lordforjustice_05_s_7:
    speaker: k
    en: Look at what?
    ko: "…뭘 보라는 거야?"
    ja: "…何を見ろっていうんだ？"
  event_lordforjustice_05_s_8:
    speaker: moran_c
    en: That.
    ko: 저거.
    ja: あれだよ、あれ。
  event_lordforjustice_05_s_9:
    speaker: "<Monologue>"
    en: Moran points at the villagers working in tandem with members of the Peony
      Association to rebuild the town.
    ko: 목단은 한창 마을을 재건하고 있는 주민들과, 모란회 멤버들을 가리켰다.
    ja: |-
      モランはフォグホロウの再建作業で
      忙しそうな住民と牡丹会のメンバーを指さした
  event_lordforjustice_05_s_10:
    speaker: k
    en: I still don't get what your point is.
    ko: 뭐라는 거야, 아까부터…!
    ja: だから、さっきから何が言いた…！
  event_lordforjustice_05_s_11:
    speaker: moran_c
    en: Get a good look? All right, on to the next place.
    ko: 다 봤어? 그럼 다음으로 가자.
    ja: よしっ、見たか？じゃあ次に行くぞ。
  event_lordforjustice_05_s_12:
    speaker: "<Monologue>"
    en: Moran once again grasps K.
    ko: 목단은 또다시 K를 질질 끌고는.
    ja: |-
      モランは有無を言わさぬまま、
      再びKをずるずると引っ張った
  event_lordforjustice_05_s_13:
    speaker: "<Monologue>"
    en: This time, she drags her to a small hill overlooking Fog Hollow.
    ko: 포그 할로우가 내려다보이는 야트막한 언덕에 올랐다.
    ja: |-
      そうして、私たちはフォグホロウを見渡せる
      小高い丘の上にやって来た
  event_lordforjustice_05_s_14:
    speaker: moran_c
    en: Look here too.
    ko: 여기도 봐.
    ja: ほら、ここもよーく見とけ。
  event_lordforjustice_05_s_15:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_16:
    speaker: "<Monologue>"
    en: Moran points to
    ko: 목단이 가리킨 건.
    ja: モランが指さした先には…
  event_lordforjustice_05_s_17:
    speaker: "<Monologue>"
    en: what appear to be dozens of graves.
    ko: 수십 개는 되어 보이는… 무덤들이었다.
    ja: 数十基はゆうに超えていそうな墓があった
  event_lordforjustice_05_s_18:
    speaker: moran_c
    en: Tell me when you've gotten a good eyeful, then I can start talking again.
    ko: 다 보면 말해. 이야기 시작하게.
    ja: |-
      見終わったら教えろよ～？
      話の続きをするからさ。
  event_lordforjustice_05_s_19:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_20:
    speaker: k
    en: What is it that you want to say?
    ko: 무슨 말이 하고 싶은 건데?
    ja: "…何が言いたいんだ？"
  event_lordforjustice_05_s_21:
    speaker: "<Monologue>"
    en: Moran doesn't answer, and instead, picks up a bottle of alcohol placed in
      front of a grave.
    ko: 목단은 대답하지 않고, 무덤 앞에 놓여 있는 술병을 집은 뒤에.
    ja: |-
      モランは何も答えないまま、
      墓の前に置かれた酒瓶を拾うと…
  event_lordforjustice_05_s_22:
    speaker: "<Narration>"
    en: "*Trickle*"
    ko: 쪼르르륵-
    ja: トクトク…
  event_lordforjustice_05_s_23:
    speaker: "<Monologue>"
    en: She slowly weaves her way through the cemetery, pouring a bit of the liquor
      over each grave.
    ko: 천천히 걸으며, 무덤들 위에 조금씩 술을 흘렸다.
    ja: |-
      ゆっくりと歩きながら、
      墓の上に少しずつ酒をかけた
  event_lordforjustice_05_s_24:
    speaker: moran_c
    en: Did you see that? All right, then I'll start.
    ko: 다 봤지? 시작한다?
    ja: 見たな？んじゃ、話を始めるぞ？
  event_lordforjustice_05_s_25:
    speaker: moran_c
    en: This is my definition of righteousness.
    ko: "…이게 내 정의야."
    ja: "…これが俺の正義だ。"
  event_lordforjustice_05_s_26:
    speaker: k
    en: What?
    ko: 뭐…?
    ja: "…？"
  event_lordforjustice_05_s_27:
    speaker: moran_c
    en: You should know... Oh right, maybe you don't because your memory was erased.
    ko: 너도 알고 있을… 아. 기억 지워져서 모르나?
    ja: |-
      お前も知って…あ、
      記憶が消えてっから知らねえのか？
  event_lordforjustice_05_s_28:
    speaker: moran_c
    en: Anyway. This is what I consider righteous.
    ko: 아무튼. 이게 내 정의라고.
    ja: とにかく、これが俺の正義なんだよ。
  event_lordforjustice_05_s_29:
    speaker: k
    en: No, I remember.
    ko: "…기억하고 있어."
    ja: "…あの事件のことなら覚えてる。"
  event_lordforjustice_05_s_30:
    speaker: k
    en: Less than 10% of the original residents here survived.
    ko: 포그 할로우. 생존자는 원 거주민의 10%도 안 됐지.
    ja: |-
      フォグホロウでの違法薬物事件。
      生存者は、元々の住民の10％にも
      満たなかったらしいな。
  event_lordforjustice_05_s_31:
    speaker: moran_c
    en: What are you talking about? They're not dead.
    ko: 무슨 소리야? 다 살아있어.
    ja: 何言ってんだ？全員生きてるぞ？
  event_lordforjustice_05_s_32:
    speaker: k
    en: What?
    ko: 뭐…?
    ja: は…？
  event_lordforjustice_05_s_33:
    speaker: "<Monologue>"
    en: K stares at the graves, bemused.
    ko: K는 멍하니 무덤들을 바라보았다.
    ja: |-
      Ｋはよく理解できないまま、
      ぼうっと墓を見つめた
  event_lordforjustice_05_s_34:
    speaker: moran_c
    en: They're alive in here.
    ko: 여기.
    ja: ここにな。
  event_lordforjustice_05_s_35:
    speaker: "<Monologue>"
    en: Moran points to her own chest.
    ko: 목단은 자기 가슴팍을 가리켰다.
    ja: モランはトントンと、自分の胸元を指さした
  event_lordforjustice_05_s_36:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_37:
    speaker: moran_c
    en: Everything comes at a cost.
    ko: 대가는 치러야 해.
    ja: 物事には代償が付きもんだし、
  event_lordforjustice_05_s_38:
    speaker: moran_c
    en: When something is rotten, it has to be pulled out by the root.
    ko: 썩은 건 뿌리부터 뽑아내야 하고.
    ja: |-
      腐っちまったもんは
      根こそぎ引っこ抜くしかねぇ。
  event_lordforjustice_05_s_39:
    speaker: moran_c
    en: These things are true, but even so,
    ko: 그래도 그렇다고….
    ja: だからって…
  event_lordforjustice_05_s_40:
    speaker: moran_c
    en: that doesn't mean you can cut people out of your life and act as if they never
      existed. That's not how it works.
    ko: |-
      그렇게 아무렇지도 않게,
      하루아침에 딱 잘라낼 수 있는 건 아니잖아. 사람 일이라는 게.
    ja: |-
      いなくなった奴らのことを忘れて、
      何事もなかったように平然と過ごせるわけ
      なんかない。それが人情ってやつだろ？
  event_lordforjustice_05_s_41:
    speaker: k
    en: "*Sigh*... I was wondering when you'd finally get to the point."
    ko: "…하. 무슨 말을 하나 했더니."
    ja: "…はっ。何を言い出すかと思えば。"
  event_lordforjustice_05_s_42:
    speaker: k
    en: You call that righteousness? I call it hypocrisy.
    ko: 그런 건 정의가 아니라 위선…!
    ja: そんなのは正義じゃなく偽善…！
  event_lordforjustice_05_s_43:
    speaker: moran_c
    en: I wouldn't know anything about that.
    ko: 난 그딴 거 몰라!
    ja: そんなの俺の知ったこっちゃねえ！
  event_lordforjustice_05_s_44:
    speaker: k
    en: "?!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_05_s_45:
    speaker: moran_c
    en: It hurts my head to think about it...
    ko: 난 그딴 거 몰라. 머리 나쁘니까.
    ja: |-
      俺はそんなの知らないんだよ。
      なんせ、おつむが悪いからな。
  event_lordforjustice_05_s_46:
    speaker: moran_c
    en: But...
    ko: 그래도….
    ja: けどよ…
  event_lordforjustice_05_s_47:
    speaker: moran_c
    en: I don't regret it. Not one bit.
    ko: 마을을 부순 것도, 걔네들을 가슴에 묻고 살아가는 것도.
    ja: |-
      フォグホロウを壊したことも、
      あいつらを胸に抱いて生きていくことも…
  event_lordforjustice_05_s_48:
    speaker: moran_c
    en: Destroying this village was something I had to do, and now I carry those people
      in my heart.
    ko: 조금도 후회하지 않아. 해야 할 일을 한 거니까.
    ja: |-
      ちっとも後悔なんかしてねえ。
      だって俺は…
  event_lordforjustice_05_s_49:
    speaker: moran_c
    en: It was something that I had to do... as a human being.
    ko: 사람으로서… 해야 하는 일을.
    ja: |-
      人としてすべきことを…
      俺が信じる道を、やりきったからな。
  event_lordforjustice_05_s_50:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_51:
    speaker: moran_c
    en: We must fix what is wrong.
    ko: 잘못한 건 고쳐야 해. 아니….
    ja: |-
      間違ってることは直さなきゃなんねえ。
      …いや、
  event_lordforjustice_05_s_52:
    speaker: moran_c
    en: Or rather, we can fix it.
    ko: 고치면 돼.
    ja: 直せばいいんだよ。
  event_lordforjustice_05_s_53:
    speaker: moran_c
    en: If you step down the wrong path, you can always turn back around.
    ko: 길을 잘못 들면 돌아 나오면 되고.
    ja: 間違った道に進んだなら、引き返せばいい。
  event_lordforjustice_05_s_54:
    speaker: moran_c
    en: If something is unjust, then you make it right.
    ko: 정의롭지 못한 건… 바로 잡으면 되고.
    ja: |-
      正義に反することをしちまったなら、
      正せばいい。
  event_lordforjustice_05_s_55:
    speaker: moran_c
    en: If we keep doing that, then I believe that we'll make this world a better
      place to live in.
    ko: 이렇게 하다 보면, 언젠가 이 세상은 조금 더 정의롭고 살기 좋아질 거라고 믿어.
    ja: |-
      そうすればいつかは、今よりも正しくて
      生きやすい世界になるって…そう信じてる。
  event_lordforjustice_05_s_56:
    speaker: moran_c
    en: To me, that is what justice means.
    ko: 그게 내 정의야.
    ja: それが、俺の正義だ。
  event_lordforjustice_05_s_57:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_58:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_59:
    speaker: d
    en: I...
    ko: 나는….
    ja: 私は…
  event_lordforjustice_05_s_60:
    speaker: d
    en: I'm not sure if I know what being okay feels like.
    ko: 나는 한 번도 괜찮았던 적이 없어.
    ja: 大丈夫だったことなど一度もない。
  event_lordforjustice_05_s_61:
    speaker: d
    en: My life's been hard, and always will be.
    ko: 힘들었고, 힘들고, 힘들 거야.
    ja: 辛かったし、辛いし、これからも辛いはずだ。
  event_lordforjustice_05_s_62:
    speaker: d
    en: It's heavy.
    ko: 나는 무거워.
    ja: 私には重い。
  event_lordforjustice_05_s_63:
    speaker: d
    en: But I'm holding up.
    ko: 하지만 견디고 있어.
    ja: でも、耐えている。
  event_lordforjustice_05_s_64:
    speaker: d
    en: I believe that
    ko: 믿고 있으니까.
    ja: 信じているから。
  event_lordforjustice_05_s_65:
    speaker: d
    en: I'm doing the right thing.
    ko: 내가 옳은 일을 한다고.
    ja: 自分が正しいことをしていると。
  event_lordforjustice_05_s_66:
    speaker: d
    en: I believe that I'm making this world a better place.
    ko: 세상을 조금이라도 좋게 만들고 있다고.
    ja: 世界を少しでもいい方向に導いていると。
  event_lordforjustice_05_s_67:
    speaker: d
    en: It's what makes me able to endure it.
    ko: 그러니 견딜 수 있어.
    ja: だから耐えられる。
  event_lordforjustice_05_s_68:
    speaker: d
    en: It's okay.
    ko: 괜찮아.
    ja: 大丈夫だ。
  event_lordforjustice_05_s_69:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_70:
    speaker: moran_c
    en: Well, I've said my piece. I'll go and help the others with the repairs.
    ko: 그럼 난 할 말 다 했으니까 간다. 마을 고치는 거 도와야 돼.
    ja: |-
      …てことで、俺の話は以上だ！
      んじゃ、そろそろ行くぜ。
      再建作業を手伝わなきゃなんねえからな。
  event_lordforjustice_05_s_71:
    speaker: "<Self>"
    en: Thanks, Moran. We're very grateful.
    ko: "…고마워, 목단."
    ja: "…ありがとう、モラン"
  event_lordforjustice_05_s_72:
    speaker: moran_c
    en: Not as grateful as I am to you. If it weren't for you, I wouldn't have known
      what to do next.
    ko: |-
      내가 더 고맙지.
      동생 아니었으면 다음은 어떻게 해야되나 막막했을 텐데.
    ja: |-
      こっちの方こそサンキューな。
      弟のおかげで、ようやく手がかりがつかめたぜ。
  event_lordforjustice_05_s_73:
    speaker: moran_c
    en: Anyway, let me know once things are settled.
    ko: 어쨌든. 정리되면 연락해.
    ja: また落ち着いたら連絡しろよ。
  event_lordforjustice_05_s_74:
    speaker: moran_c
    en: I'll continue my investigation.
    ko: 이 누님도 누님 나름대로 또 조사해 보고 있을 테니까.
    ja: 引き続き調査して待ってっからさ！
  event_lordforjustice_05_s_75:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_s_76:
    speaker: "<Self>"
    en: What do you think of what Moran said?
    ko: 목단의 말, 어떻게 생각해?
    ja: モランの言葉をどう理解した？
  event_lordforjustice_05_s_77:
    speaker: k
    en: I...
    ko: 나는….
    ja: 私は…
  event_lordforjustice_05_s_78:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ…
  event_lordforjustice_05_s_79:
    speaker: "<Monologue>"
    en: Hearing footsteps behind me, I turn, thinking that Moran had come back.
    ko: 등 뒤에서 들리는 발소리에, 목단이 돌아오는 줄 알고 돌아보았다.
    ja: |-
      背後からモランの足音が聞こえたような
      気がした私は、疑いもなく後ろを振り返った
  event_lordforjustice_05_s_80:
    speaker: "<Self>"
    en: Did you leave something beh... huh?
    ko: 목단? 뭐 놓고 갔… 어?
    ja: モラン？忘れ物でもしたのか？
  event_lordforjustice_05_s_81:
    speaker: vii_unknown
    en: It's time.
    ko: 때가 되었다.
    ja: 時は来た。
  event_lordforjustice_05_s_82:
    speaker: vii_unknown
    en: Pass your judgment, @UserName.
    ko: 판결을 내려라, @UserName.
    ja: |-
      判決を下すのだ、
      @UserName。
  event_lordforjustice_05_s_83:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_05_s_84:
    speaker: vii
    en: Yes, it is me, VII.
    ko: 나는 VII.
    ja: 私はVII。
  event_lordforjustice_05_s_85:
    speaker: vii
    en: The evil which you must judge.
    ko: 네가 심판해야 할 [악]이다.
    ja: お前が審判すべき「悪」だ。
event_lordforjustice_05_e:
  event_lordforjustice_05_e_1:
    speaker: vii
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_2:
    speaker: "<Monologue>"
    en: VII frowns at K.
    ko: VII은 K를 보고 인상을 찌푸렸다.
    ja: VIIはKを見て顔をしかめた
  event_lordforjustice_05_e_3:
    speaker: vii
    en: You're breaking down faster this time.
    ko: "[이번]에는 다시 망가지는 게 빠르군."
    ja: "「今回」は堕落するのが早いな。"
  event_lordforjustice_05_e_4:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_5:
    speaker: "<Self>"
    en: Are you the one who erased K's memory and used her?
    ko: K의 기억을 지우고, 이용한 게 너야?
    ja: Ｋの記憶を消し、利用したのはお前か？
  event_lordforjustice_05_e_6:
    speaker: vii
    en: Yes, I am the one who erased her memories.
    ko: 지운 것은 나다.
    ja: いかにも。消したのは私だ。
  event_lordforjustice_05_e_7:
    speaker: vii
    en: I gave the order,
    ko: 지우라고 지시한 것도 나이고,
    ja: そして、消せと指示したのも私であり…
  event_lordforjustice_05_e_8:
    speaker: vii
    en: and granted her plea.
    ko: "[간청]을 들어준 것도 나다."
    ja: "「嘆願」を聞き入れたのも私である。"
  event_lordforjustice_05_e_9:
    speaker: "<Self>"
    en: What do you mean?
    ko: "…뭐?"
    ja: それは…どういう…？
  event_lordforjustice_05_e_10:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_11:
    speaker: vii
    en: I'm afraid you've been mistaken all this time.
    ko: 착각을 하고 있군.
    ja: 誤解をしているようだな。
  event_lordforjustice_05_e_12:
    speaker: vii
    en: It wasn't me, or anyone else, who chose to erase K's memories. It was her
      own decision.
    ko: 기억을 지운 건, 다름 아닌 K 자신의 선택이다.
    ja: |-
      記憶が消えたのは、
      他でもないK自身の選択によるものだ。
  event_lordforjustice_05_e_13:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_05_e_14:
    speaker: vii
    en: Becoming an agent of justice.
    ko: 정의의 대행자가 된 것
    ja: 正義の代行者になったことも。
  event_lordforjustice_05_e_15:
    speaker: vii
    en: Becoming a puppet under our control.
    ko: 꼭두각시가 된 것.
    ja: 操り人形になったことも。
  event_lordforjustice_05_e_16:
    speaker: vii
    en: Erasing her memories. It was all K's own choice.
    ko: 기억을 지운 것도 전부, K 자신의 [선택]이었다.
    ja: |-
      記憶を消したことも、
      すべてK自身の「選択」に他ならない。
  event_lordforjustice_05_e_17:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_18:
    speaker: vii
    en: And this time, she even tried to eliminate herself.
    ko: 그리고 이번에는 끝내 자살까지 시도했지.
    ja: 挙句の果てに、自殺まで試みるとはな。
  event_lordforjustice_05_e_19:
    speaker: vii
    en: Of course, an agent of justice cannot be undone by a weapon crafted to uphold
      justice,
    ko: 물론, 아무리 망가진 꼭두각시라곤 해도.
    ja: むろん、どれほど堕落し操り人形になろうと
  event_lordforjustice_05_e_20:
    speaker: vii
    en: even if that agent is a pathetically faulty instrument.
    ko: 정의의 대행자가, 정의를 실현하는 무기에 쓰러질 리 없다.
    ja: |-
      正義の代行者が、正義を実現する武器に
      倒れるはずはない。
  event_lordforjustice_05_e_21:
    speaker: "<Self>"
    en: So that wound before...
    ko: 그때 그 상처는 그럼….
    ja: なら、あの時の傷は…
  event_lordforjustice_05_e_22:
    speaker: vii
    en: Neither a pawn nor an agent of justice
    ko: 스스로 목숨을 끊는 것은.
    ja: 自ら命を絶つことは、
  event_lordforjustice_05_e_23:
    speaker: vii
    en: is permitted to take their own life.
    ko: 꼭두각시에게도, 정의의 대행자에게도 허락되지 않은 일.
    ja: |-
      操り人形にも、
      正義の代行者にも許されないことだ。
  event_lordforjustice_05_e_24:
    speaker: vii
    en: That's right, K.
    ko: "…그렇다. K."
    ja: "…そういうことだ、K。"
  event_lordforjustice_05_e_25:
    speaker: vii
    en: Your life is no longer your own.
    ko: 자신의 삶 조차, 너는 선택할 수 없다.
    ja: 自らの人生すらも、お前は選択できない。
  event_lordforjustice_05_e_26:
    speaker: vii
    en: You have relinquished control over even that.
    ko: 네 삶은 너의 것이 아니다.
    ja: お前の人生は、お前のものではないからだ。
  event_lordforjustice_05_e_27:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_28:
    speaker: "<Monologue>"
    en: K grits her teeth and lowers her head.
    ko: K는 이를 악물며 고개를 숙였다.
    ja: Kは歯を食いしばると、静かにうなだれた
  event_lordforjustice_05_e_29:
    speaker: vii
    en: The puppet show ends here.
    ko: 꼭두각시의 연극은 여기까지다.
    ja: 操り人形による喜劇もここまでだ。
  event_lordforjustice_05_e_30:
    speaker: vii
    en: I must say it made for an excellent prelude to the final judgment.
    ko: 판결 전의 여흥으로써는 훌륭했군.
    ja: 判決前の余興としては見事だった。
  event_lordforjustice_05_e_31:
    speaker: vii
    en: Now then, are you ready, @UserName?
    ko: 그럼 준비는 됐겠지, @UserName.
    ja: |-
      時間は十分に与えた。
      判決を下す準備はできているな？
      @UserName。
  event_lordforjustice_05_e_32:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_33:
    speaker: vii
    en: You have already seen the truth.
    ko: 너는 이미 진실을 보았다.
    ja: お前はすでに真実を見た。
  event_lordforjustice_05_e_34:
    speaker: vii
    en: How the once glorious institution of justice fell,
    ko: 찬란하던 정의가 실추되어,
    ja: 輝かしかった正義は失墜し、
  event_lordforjustice_05_e_35:
    speaker: vii
    en: and sank into the mire, only to be tainted and become evil.
    ko: 진흙탕에 떨어져 악이 되는 모습을 보았다.
    ja: 堕ちたる沼の中で悪へと変わるさまを。
  event_lordforjustice_05_e_36:
    speaker: vii
    en: All of the pieces are arranged on the chessboard. All that remains is for
      you to decide.
    ko: 재료는 모두 갖춰졌고, 이제 선택만이 남았다.
    ja: 材料はすべて揃った。残るは選択のみ。
  event_lordforjustice_05_e_37:
    speaker: vii
    en: So, for the cause, and to choose the new king,
    ko: "…대의와 새로운 왕을 위하여."
    ja: さあ、判決を下せ。
  event_lordforjustice_05_e_38:
    speaker: vii
    en: pass your judgment.
    ko: 판결을 내려라.
    ja: "…大義と、新しき王のために。"
  event_lordforjustice_05_e_39:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_40:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 띠리리리링-
    ja: プルルル…
  event_lordforjustice_05_e_41:
    speaker: "<Self>"
    en: "...!"
    ko: "…!"
    ja: "…！"
  event_lordforjustice_05_e_42:
    speaker: "<Monologue>"
    en: My phone abruptly starts ringing, startling me.
    ko: 나는 갑자기 울린 벨소리에 놀랐지만.
    ja: 私は突然鳴りだした着信音に驚いたが
  event_lordforjustice_05_e_43:
    speaker: "<Monologue>"
    en: VII, however, looks at me unaffected, as if he had been expecting it.
    ko: VII은 마치 예상하고 있었던 것처럼, 말없이 나를 바라보고 있다.
    ja: |-
      VIIは予想していたかのように、
      無言で私を見つめている
  event_lordforjustice_05_e_44:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_45:
    speaker: "<Monologue>"
    en: As I pick up, I hear a man's voice on the other end.
    ko: 전화를 받자, 어떤 남자의 목소리가 들렸다.
    ja: 電話に出ると、男の声が聞こえた
  event_lordforjustice_05_e_46:
    speaker: unknown
    en: Hurry up and decide.
    ko: 어서 결정하게.
    ja: さあ、早く判決を下せ。
  event_lordforjustice_05_e_47:
    speaker: unknown
    en: The stage is set, and the conditions are already met.
    ko: 무대와 조건은 이미 갖춰졌지 않은가.
    ja: 舞台と条件はすでに整えられているではないか。
  event_lordforjustice_05_e_48:
    speaker: unknown
    en: We may have skipped a few steps along the way, but the end result is the same
      as it always has been.
    ko: 과정은 조금 생략됐지만, 결과는 자네가 지금까지 해왔던 것들과 동일해.
    ja: |-
      過程は少々省略されたが、
      結果は君が今までやってきたことと同じだ。
  event_lordforjustice_05_e_49:
    speaker: unknown
    en: Now, make your choice.
    ko: 그러니 이제 [선택]하게.
    ja: よって今は、ただ「選択」すればいい。
  event_lordforjustice_05_e_50:
    speaker: "<Self>"
    en: Who are you?
    ko: 너는….
    ja: お前は…
  event_lordforjustice_05_e_51:
    speaker: unknown
    en: Oh goodness me. I'm getting ahead of myself.
    ko: 이런. 너무 마음만 앞섰군.
    ja: "…おっと。少々先走ってしまったな。"
  event_lordforjustice_05_e_52:
    speaker: unknown
    en: Forgive me. It happens once you reach a certain age.
    ko: 이해해 주게나. 나이가 들면 다 이런 법이야.
    ja: |-
      だが、どうか大目に見てほしい。
      年を取ると、皆こうなるものだ。
  event_lordforjustice_05_e_53:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_05_e_54:
    speaker: unknown
    en: It's a pleasure to meet you. Let's see... If I were in your position...
    ko: 반갑네. 어디… 그래. 지금 자네의 입장이라면.
    ja: 話ができて光栄だ。私のことは…そうだな。
  event_lordforjustice_05_e_55:
    speaker: soundonly_x
    en: I'd have you call me X.
    ko: X라고 부르게.
    ja: Xと呼んでくれたまえ。
event_lordforjustice_06_s:
  event_lordforjustice_06_s_1:
    speaker: soundonly_x
    en: I'd have you call me X.
    ko: X라고 부르게.
    ja: Xと呼んでくれたまえ。
  event_lordforjustice_06_s_2:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_3:
    speaker: soundonly_x
    en: Now, getting back to what we were discussing.
    ko: 그럼 다시 하던 이야기로 돌아가서.
    ja: では、先ほどの話に戻ろうか。
  event_lordforjustice_06_s_4:
    speaker: soundonly_x
    en: I'm sure you're used to situations like this by now.
    ko: 이런 상황은 이제 자네에게도 꽤나 익숙하지 않은가.
    ja: |-
      こういった状況は、
      もはや君にとって慣れたものだろう？
  event_lordforjustice_06_s_5:
    speaker: soundonly_x
    en: Choose, @UserName.
    ko: 선택하게, @UserName.
    ja: |-
      さあ、選択するのだ。
      @UserName。
  event_lordforjustice_06_s_6:
    speaker: soundonly_x
    en: In the name of justice,
    ko: 정의를 위해.
    ja: 正義のために。
  event_lordforjustice_06_s_7:
    speaker: soundonly_x
    en: deliver your judgment
    ko: 저 자에게.
    ja: あの者に――
  event_lordforjustice_06_s_8:
    speaker: soundonly_x
    en: to the one before you
    ko: 자네 눈앞에 있는, [정의롭지 않은 자]에게.
    ja: 君の目の前にいる、「正義に背いた者」に…
  event_lordforjustice_06_s_9:
    speaker: soundonly_x
    en: whom you deem unrighteous.
    ko: 판결을 내리게.
    ja: 判決を下すのだ。
  event_lordforjustice_06_s_10:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_11:
    speaker: "<Self>"
    en: I refuse.
    ko: "…거부하겠어."
    ja: "…断る"
  event_lordforjustice_06_s_12:
    speaker: soundonly_x
    en: Oh? And why is that?
    ko: 호오. 어째서지?
    ja: "…ほお。その理由は？"
  event_lordforjustice_06_s_13:
    speaker: "<Self>"
    en: This time will be different.
    ko: 지금까지와 이번은 상황이 달라.
    ja: 今回は、今までとは状況が違う
  event_lordforjustice_06_s_14:
    speaker: "<Self>"
    en: I won't get involved in this ridiculous political game.
    ko: 이런 말도 안 되는 정치 놀음에는 엮이지 않겠어.
    ja: |-
      こんなシャレにもならない政治的な駆け引きには
      関わりたくない
  event_lordforjustice_06_s_15:
    speaker: soundonly_x
    en: A political game, huh? I suppose that's not entirely incorrect.
    ko: 정치 놀음이라. 틀린 말은 아니로군.
    ja: |-
      政治的な駆け引きだと？
      …なるほど、一理あるな。
  event_lordforjustice_06_s_16:
    speaker: soundonly_x
    en: Very well then, allow me to help you come to a decision.
    ko: 그렇다면… 선택을 조금 도와주도록 하지.
    ja: "…ならば、少しだけ手伝ってやろう。"
  event_lordforjustice_06_s_17:
    speaker: "<Monologue>"
    en: As soon as X is finished speaking...
    ko: X의 말과 동시에.
    ja: Xがそう言うと同時に…
  event_lordforjustice_06_s_18:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: カチャ
  event_lordforjustice_06_s_19:
    speaker: vii
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_20:
    speaker: "<Monologue>"
    en: VII pulls out a handgun from his coat and aims it at K.
    ko: VII은 품속에서 권총을 꺼내 K에게 겨눴다.
    ja: |-
      VIIが懐から拳銃を取り出し、
      Kに狙いを定めた
  event_lordforjustice_06_s_21:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_lordforjustice_06_s_22:
    speaker: soundonly_x
    en: Small word of caution; don't think for a second that I'm bluffing.
    ko: 노파심에 하는 말이네만, 허세라고 생각하지는 말아주게.
    ja: |-
      ただのハッタリだとは思わないことだ。
      君にとっては余計なお世話かもしれないが…
  event_lordforjustice_06_s_23:
    speaker: soundonly_x
    en: It's a master's duty to be willing to put down a mad dog which could go wild
      at any moment.
    ko: |-
      언제든 미쳐 날뛸 가능성이 있는 사냥개를
      처분할 준비를 해두는 건, 주인의 의무니까.
    ja: |-
      暴れ狂う可能性がある猟犬を
      いつでも処分できるようにしておくのは、
      主人としての義務だろう？
  event_lordforjustice_06_s_24:
    speaker: "<Self>"
    en: You son of a...
    ko: 너….
    ja: くっ…
  event_lordforjustice_06_s_25:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_26:
    speaker: "<Monologue>"
    en: K stares emotionlessly at the gun pointed at her.
    ko: K는 자신을 겨눈 총구를 멍하니 바라보고 있다.
    ja: Kは自身を狙う銃口をぼうっと見つめている
  event_lordforjustice_06_s_27:
    speaker: soundonly_x
    en: Now, it's time to make a decision.
    ko: 자. 다시 선택의 시간이라네.
    ja: さあ、改めて選択の時間だ。
  event_lordforjustice_06_s_28:
    speaker: soundonly_x
    en: So, what's it going to be?
    ko: 결정하게나.
    ja: 君の判決を聞かせてくれ。
  event_lordforjustice_06_s_29:
    speaker: soundonly_x
    en: Which one of the unjust will you judge?
    ko: "[어떤] 정의롭지 않은 자를, 심판할 텐가?"
    ja: |-
      正義に背いた「どちら」に、
      裁きを下すのかな？
  event_lordforjustice_06_s_30:
    speaker: "<Self>"
    en: "..."
    ko: 큭….
    ja: "……"
  event_lordforjustice_06_s_31:
    speaker: "<Choice>"
    en: Kill VII.
    ko: "……VII을 죽인다."
    ja: "……VIIを処分する"
  event_lordforjustice_06_s_32:
    speaker: "<Choice>"
    en: Rescue K.
    ko: "……K를 살린다."
    ja: "……Kを生かす"
  event_lordforjustice_06_s_33:
    speaker: vii
    en: For the sake of a righteous judgment...
    ko: 정의로운 판결을 위하여.
    ja: "…正義ある裁きのために。"
  event_lordforjustice_06_s_34:
    speaker: "<Monologue>"
    en: VII lowers his weapon, and without a moment's hesitation,
    ko: VII은 총을 거두고는.
    ja: VIIは銃を下ろすと
  event_lordforjustice_06_s_35:
    speaker: "<Monologue>"
    en: turns it on himself and pulls the trigger.
    ko: 조금의 망설임도 없이 자신의 관자놀이에 방아쇠를 당겼다.
    ja: |-
      全くためらう様子を見せずに、
      自らのこめかみに向けて引き金を引いた
  event_lordforjustice_06_s_36:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 타앙-!
    ja: バン――！
  event_lordforjustice_06_s_37:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩.
    ja: ドサッ
  event_lordforjustice_06_s_38:
    speaker: "<Self>"
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_lordforjustice_06_s_39:
    speaker: k
    en: This is insane...!
    ko: 이런 미친…!
    ja: えっ、ちょっと待て…！
  event_lordforjustice_06_s_40:
    speaker: soundonly_x
    en: A splendid choice, @UserName.
    ko: 훌륭한 [선택]이었네, @UserName.
    ja: |-
      実に見事な「選択」だったぞ、
      @UserName。
  event_lordforjustice_06_s_41:
    speaker: soundonly_x
    en: Or perhaps
    ko: 아니….
    ja: いや…
  event_lordforjustice_06_s_42:
    speaker: soundonly_x
    en: I should call you VII.
    ko: VII.
    ja: VII。
  event_lordforjustice_06_s_43:
    speaker: "<Self>"
    en: What?
    ko: "…뭐라고?"
    ja: "…何だって？"
  event_lordforjustice_06_s_44:
    speaker: soundonly_x
    en: A job opening just came up.
    ko: 공교롭게도 공석이 생겨서 말이야.
    ja: 生憎だが、一つ空席ができてしまってね。
  event_lordforjustice_06_s_45:
    speaker: soundonly_x
    en: In light of the judgments you've made up until now,
    ko: 지금까지 자네의 판결을 지켜봐 온 바.
    ja: そこで、これまでの君の判決を見守った結果…
  event_lordforjustice_06_s_46:
    speaker: soundonly_x
    en: we have decided to offer you VII's position.
    ko: "[우리]는 자네에게 VII의 왕좌를 주기로 합의했네."
    ja: |-
      「我々」は君に、
      VIIの座を与えることが決定した。
  event_lordforjustice_06_s_47:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_lordforjustice_06_s_48:
    speaker: "<Monologue>"
    en: There's something strange in X's voice which makes me feel uneasy, although
      I can't quite figure out why.
    ko: "…기분 탓인지, 방금 전 X의 말에서 미묘한 위화감을 느꼈다."
    ja: |-
      …気のせいだろうか。
      今のXの言葉に妙な違和感を覚えた
  event_lordforjustice_06_s_49:
    speaker: soundonly_x
    en: You're standing at another fork in the road.
    ko: 또다시 선택의 기로로군.
    ja: さて、再び選択の岐路に立たされたな。
  event_lordforjustice_06_s_50:
    speaker: soundonly_x
    en: Accept, or decline. A binary decision.
    ko: 동의한다. 거절한다. 양자택일의 선택.
    ja: 同意する、拒否する。二者択一だ。
  event_lordforjustice_06_s_51:
    speaker: soundonly_x
    en: But... Is it really?
    ko: 하지만… 정말로 그런가?
    ja: しかし…果たして本当にそうだろうか？
  event_lordforjustice_06_s_52:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_53:
    speaker: soundonly_x
    en: People often delude themselves into thinking that they've made a choice.
    ko: 많이들 그렇게 착각하곤 하지. 자신이 [선택]한다고 말이야.
    ja: |-
      多くの者は、そうやって錯覚に陥っていく。
      これは自らの意思で「選択」したのだと。
  event_lordforjustice_06_s_54:
    speaker: soundonly_x
    en: In most situations, however, everything is already predetermined, including
      the options available to them.
    ko: |-
      하지만 대부분의 상황에서,
      그 시점에 고를 수 있는 선택지는 이미 정해져 있다네.
    ja: |-
      だがほとんどの場合において、
      選ぶことができる選択肢は
      初めから決まっている。
  event_lordforjustice_06_s_55:
    speaker: soundonly_x
    en: People simply trick themselves into believing there's an alternative.
    ko: 그저 다른 것도 고를 수 있다고 착각할 뿐.
    ja: |-
      にもかかわらず、人々は
      数ある選択肢の中から選んだのだと、
      そう思い込むのだ。
  event_lordforjustice_06_s_56:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_57:
    speaker: "<Monologue>"
    en: All decisions by the Judges are made by vote...
    ko: 분명, 저지스의 모든 의결은 투표로 이루어지고….
    ja: |-
      …確か、ジャッジスの議決は
      投票で行われていたはず…
  event_lordforjustice_06_s_58:
    speaker: soundonly_x
    en: Don't get the wrong idea. It's true that we did manipulate you.
    ko: 오해하지 말게. 우리가 자네를 이용하고, 놀아나게 만든 건 사실일세.
    ja: |-
      どうか誤解しないでほしい。
      我々が君を利用し、翻弄したのは事実だが…
  event_lordforjustice_06_s_59:
    speaker: soundonly_x
    en: But that doesn't necessarily mean it's a loss for you.
    ko: 하지만 그렇다고 해서 그게 자네에게 손해가 되는가. 그건 따져볼 여지가 있지.
    ja: |-
      しかし、それが君に不利益を与えただろうか？
      その点については、一考の余地があるはずだ。
  event_lordforjustice_06_s_60:
    speaker: soundonly_x
    en: Some food for thought, don't you think?
    ko: 그렇지 않나?
    ja: そう思わないか？
  event_lordforjustice_06_s_61:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_62:
    speaker: "<Monologue>"
    en: I've... recently come to know one of the Judges better...
    ko: 내가 최근에 알게 된 저지스의 일원 중 한 명은….
    ja: 私が最近会ったジャッジスのメンバーの1人は…
  event_lordforjustice_06_s_63:
    speaker: soundonly_x
    en: I understand how confusing, even frustrating, this must be.
    ko: 이해하네. 분하고, 혼란스러울 테지.
    ja: |-
      とはいえ、君の心情は理解する。
      さぞ混乱し、憤りを覚えていることだろう。
  event_lordforjustice_06_s_64:
    speaker: soundonly_x
    en: Nevertheless, set aside your youthful bluster for the moment.
    ko: 그래도 젊은 혈기는 잠시 접어 두게나.
    ja: |-
      だが、あまり若気の至りに
      身を任せるべきではない。
  event_lordforjustice_06_s_65:
    speaker: soundonly_x
    en: Suppress your emotions, and think rationally about which path benefits you
      the most.
    ko: 감정을 죽이고, 냉정하게. 무엇이 자신에게 이득이 되는지 판단하게.
    ja: |-
      感情を殺し、冷静になるように。
      そして何が自分にとって得なのか、
      落ち着いて判断するといい。
  event_lordforjustice_06_s_66:
    speaker: soundonly_x
    en: That is the only way you can achieve your goal, I promise you.
    ko: 그게 자네의 목적을 이루는 유일한 길일세. 내가 보장하지.
    ja: |-
      それこそが、君自身の目的を達成するための
      唯一の道だ。私が保証しよう。
  event_lordforjustice_06_s_67:
    speaker: "<Self>"
    en: "... Can I ask something?"
    ko: "…하나 물어봐도 될까?"
    ja: "…1つ聞いてもいいか？"
  event_lordforjustice_06_s_68:
    speaker: soundonly_x
    en: By all means.
    ko: 물론이네.
    ja: もちろんだ。
  event_lordforjustice_06_s_69:
    speaker: "<Self>"
    en: The decision to have me join the Judges.
    ko: "…나를 저지스에 합류시키는 거."
    ja: "…私をジャッジスに合流させるという方針は"
  event_lordforjustice_06_s_70:
    speaker: "<Self>"
    en: Was it unanimous?
    ko: 만장일치로 결정된 거야?
    ja: 満場一致で決まったことなのか？
  event_lordforjustice_06_s_71:
    speaker: soundonly_x
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_72:
    speaker: "<Self>"
    en: I'm fairly certain I know at least one member who would be opposed to it.
    ko: 내가 알기로, 적어도 한 명은 반대할 것 같은데.
    ja: |-
      私の予想では、
      少なくとも1人は反対するはずだが…
  event_lordforjustice_06_s_73:
    speaker: "<Self>"
    en: Aren't all decisions made by the Judges supposed to be unanimous?
    ko: 저지스의 의결은 만장일치여야 하는 것 아닌가?
    ja: |-
      ジャッジスの議決は、
      満場一致が原則のはずでは？
  event_lordforjustice_06_s_74:
    speaker: "<Monologue>"
    en: X remains silent for so long, that I begin to think he has hung up, but then
      he lets out a deep sigh.
    ko: 전화가 끊어졌나 싶을 정도로 말이 없던 X가, 돌연 깊은 한숨을 내쉬었다.
    ja: |-
      Xは電話が切れたかのように黙り込んでいたが、
      突然深いため息をついた
  event_lordforjustice_06_s_75:
    speaker: soundonly_x
    en: I knew it. I was too impatient.
    ko: "…역시 너무 조급했나 보군."
    ja: "…やはり、少し焦りすぎていたようだな。"
  event_lordforjustice_06_s_76:
    speaker: soundonly_x
    en: I figured that slight nudging and persuasion would be insufficient.
    ko: 쯧쯧. 적당히 분위기로 몰아붙이는 걸로는 안 될 줄 알고 있었지.
    ja: |-
      はぁ…適当に雰囲気に酔わせ、
      丸め込もうと思ったが…厳しかったか。
  event_lordforjustice_06_s_77:
    speaker: "<Monologue>"
    en: At some point, X's voice has changed, and now resembles that of the friendly
      elderly man next door.
    ko: |-
      쯧쯧 혀를 차는 X의 목소리는 어느새 평범한 옆집 할아버지 같은,
      친근함마저 느껴지는 것으로 바뀌어 있었다.
    ja: |-
      そうこぼすXの声色は
      徐々に近所に住む老人のような、
      親近感を覚えるトーンに変わっていった
  event_lordforjustice_06_s_78:
    speaker: soundonly_x
    en: Allow me to make a correction, first and foremost.
    ko: 우선 하나 정정하지.
    ja: うむ…まずは、1つ訂正しておこう。
  event_lordforjustice_06_s_79:
    speaker: soundonly_x
    en: Unanimity isn't always mandatory for us to make decisions.
    ko: 반드시 만장일치여야만 의사 결정을 내릴 수 있는 건 아니라네.
    ja: |-
      我々ジャッジスは、必ずしも
      満場一致となった場合のみ
      意思決定をするわけではないのだよ。
  event_lordforjustice_06_s_80:
    speaker: soundonly_x
    en: Sometimes majority votes are sufficient. A single person can even push a resolution
      through, albeit at a great political risk.
    ko: |-
      과반수로 의결될 수도, 아니면 정치적 부담을 무릅쓰고
      단독으로 밀어붙일 수도 있어. 잘 기억해 두게.
    ja: |-
      過半数で可決される場合もあれば、
      政治的な負担を覚悟して単独で
      押し通すこともある。よく覚えておくように。
  event_lordforjustice_06_s_81:
    speaker: soundonly_x
    en: And to that end, I must admit...
    ko: 그리고… 인정하겠네.
    ja: それから…認めるしかないな。
  event_lordforjustice_06_s_82:
    speaker: soundonly_x
    en: This was a decision that I made on my own.
    ko: 이번 일은 내 독단일세.
    ja: 今回の決定は、私の独断だ。
  event_lordforjustice_06_s_83:
    speaker: soundonly_x
    en: But as you can see, it failed miserably, so I will have to lay low for a while.
    ko: 그런데 이렇게 보기 좋게 실패했으니까, 당분간은 얌전히 있어야겠군.
    ja: |-
      まあ、ここまで無残に失敗してしまっては、
      当分は大人しくしているしかなさそうだ。
  event_lordforjustice_06_s_84:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_85:
    speaker: soundonly_x
    en: I know what you're thinking.
    ko: 무슨 생각을 하는지 알고 있네.
    ja: 君が何を考えているかは分かる。
  event_lordforjustice_06_s_86:
    speaker: soundonly_x
    en: '"Why is he confessing all of this to me?"'
    ko: "[너무 순순히 인정하는 것 아닌가?]"
    ja: |-
      「そんなあっさりと認めるのか？」
      …おおよそ、そういったところだろう？
  event_lordforjustice_06_s_87:
    speaker: soundonly_x
    en: The moment doubt rears its ugly head, it's already over, and it's simply a
      matter of time until the truth is uncovered.
    ko: |-
      하지만 조금이라도 의심이 싹튼 순간 끝이라네.
      진실에 도달하는 건 결국 시간문제일 뿐이지.
    ja: |-
      こういったことは、わずかでも疑いが
      芽生えた瞬間におしまいなのだよ。
      真実にたどりつくのも、あとは時間の問題だ。
  event_lordforjustice_06_s_88:
    speaker: soundonly_x
    en: "... Like with K."
    ko: 그래… K처럼 말일세.
    ja: そう…例えば、Kのようにね。
  event_lordforjustice_06_s_89:
    speaker: "<Self>"
    en: What do you possibly have to gain
    ko: "…나를 끌어들여서 저지스…."
    ja: "…私を引き入れてジャッジスに…"
  event_lordforjustice_06_s_90:
    speaker: "<Self>"
    en: by roping me in with the Judges?
    ko: 아니, 너에게 무슨 이득이 있는 거지?
    ja: いや、お前にどんな利益があるんだ？
  event_lordforjustice_06_s_91:
    speaker: soundonly_x
    en: A formidable successor whom I can entrust the future to.
    ko: 미래를 믿고 맡길 수 있는 든든한 후계자가 생긴다네.
    ja: |-
      安心して将来を任せられる、
      頼もしい後継者の登場。
      それが私にもたらされる利益だ。
  event_lordforjustice_06_s_92:
    speaker: "<Self>"
    en: What?
    ko: 뭐…?
    ja: は…？
  event_lordforjustice_06_s_93:
    speaker: soundonly_x
    en: Have you not been listening to me?
    ko: 내가 지금까지 한 말을 뭘로 들은 겐가?
    ja: |-
      はは、今までの私の話を
      どう理解していたのかね？
  event_lordforjustice_06_s_94:
    speaker: soundonly_x
    en: I don't have much time left, but the Ark is still in dire need of justice.
    ko: 나는 이제 살날이 얼마 남지 않았지만, 여전히 방주에는 정의가 필요하다네.
    ja: |-
      私はすでに老い先短い身だ。
      しかし、アークにはこれからも正義が必要だ。
  event_lordforjustice_06_s_95:
    speaker: soundonly_x
    en: I must impart my knowledge to a successor while I still can.
    ko: 한시라도 빨리 후계자를 가르쳐야 하지 않겠나.
    ja: |-
      なら、一日でも早く
      後継者の育成を始めておかなければだろう？
  event_lordforjustice_06_s_96:
    speaker: soundonly_x
    en: However, in attempting to do so, I have been dealt a fatal blow. What a disaster.
    ko: 그런 와중에 이렇게 한 방 먹고 말았으니 원. 이거 큰일이로군.
    ja: |-
      そんなおりに、こうして一発食わされるとはね。
      ふむ、いったいどうしたものか…
  event_lordforjustice_06_s_97:
    speaker: "<Self>"
    en: You say that, but you seem quite happy.
    ko: "…그런 것 치고는 기쁜 것 같아 보이는데."
    ja: "…その割には嬉しそうだな"
  event_lordforjustice_06_s_98:
    speaker: soundonly_x
    en: Of course I am.
    ko: 기쁘고 말고.
    ja: 嬉しいに決まっているだろう？
  event_lordforjustice_06_s_99:
    speaker: soundonly_x
    en: My successor has grown up splendidly, without me having to teach him anything.
    ko: 가르침 없이도 후계자가 이렇게나 훌륭하게 성장했으니까.
    ja: |-
      私が手ずから教育するまでもなく、
      後継者がとうに立派に成長していたのだから。
  event_lordforjustice_06_s_100:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_101:
    speaker: soundonly_x
    en: While we're on the subject, you should consider having a child at some point.
    ko: 말이 나온 김에 말이네만, 자네도 적당한 시점에 자식을 보는 게 좋을걸세.
    ja: |-
      ああ、話が出たついでに言っておくが…
      君も頃合いを見て、
      子孫を残しておく方がいいだろう。
  event_lordforjustice_06_s_102:
    speaker: soundonly_x
    en: After retirement, doting on grandchildren is all we old folks have left.
    ko: 늘그막에 은퇴하고 나면 손주 재롱이나 보는 게 유일한 낙이야.
    ja: |-
      隠居後の楽しみと言ったら、
      かわいい孫の顔を見ることくらいだからね。
  event_lordforjustice_06_s_103:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_104:
    speaker: soundonly_x
    en: There I go again, saying too much.
    ko: 이런. 쓸데없는 말이 길었군.
    ja: "…おっと。話が長くなってしまったな。"
  event_lordforjustice_06_s_105:
    speaker: soundonly_x
    en: These kinds of things happen when you get old. I hope you understand.
    ko: 뭐, 이해해 주게나. 늙으면 다들 이렇게 되는 법이야.
    ja: |-
      まあ、どうか大目に見てほしい。
      年を取ると、皆こうなるものだ。
  event_lordforjustice_06_s_106:
    speaker: soundonly_x
    en: We admire young folks and feel proud of them,
    ko: 젊은 친구들이 기특하고 대견하면서도….
    ja: 若者の頼もしさに微笑ましくなる一方で…
  event_lordforjustice_06_s_107:
    speaker: soundonly_x
    en: but we also envy them.
    ko: 시기심이 들지.
    ja: 羨ましくもなる。
  event_lordforjustice_06_s_108:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_109:
    speaker: soundonly_x
    en: So don't test my patience too much, @UserName.
    ko: 그러니까 내 인내심을 너무 시험하지는 말게, @UserName.
    ja: |-
      …そういうことだから、どうか
      私の忍耐力を試すのはほどほどにしてほしい。
  event_lordforjustice_06_s_110:
    speaker: soundonly_x
    en: I can't keep this position empty forever.
    ko: 언제까지고 왕좌를 비워 놓을 수는 없는 노릇일세.
    ja: |-
      いつまでも、王座を空けておくわけには
      いかないのでね。
  event_lordforjustice_06_s_111:
    speaker: soundonly_x
    en: Oh, and one more thing.
    ko: 아, 그리고.
    ja: ああ、それと…
  event_lordforjustice_06_s_112:
    speaker: soundonly_x
    en: I have a gift for you. Think of it as a tribute to the victor.
    ko: 선물을 하나 주겠네. 패배자가 바치는 공물 같은 거라고 생각하게.
    ja: |-
      ひとつ、私からの贈り物を受け取ってほしい。
      なに、敗者が捧げる貢ぎ物だと思ってくれ。
  event_lordforjustice_06_s_113:
    speaker: "<Self>"
    en: What is it?
    ko: "…뭐지?"
    ja: "…何だ？"
  event_lordforjustice_06_s_114:
    speaker: soundonly_x
    en: I leave K's fate in your hands.
    ko: K의 처분을 자네에게 맡기겠네.
    ja: Kの処分を、君に任せよう。
  event_lordforjustice_06_s_115:
    speaker: soundonly_x
    en: Kill her, erase her memory, make her a slave, ignore her.
    ko: 죽이든, 기억을 지우든, 노예로 삼든, 모른 척하든.
    ja: |-
      殺すも良し、記憶を消すも良し。
      あるいは奴隷にしようが、野放しにしようが…
  event_lordforjustice_06_s_116:
    speaker: soundonly_x
    en: The choice is entirely up to you.
    ko: 전부, 자네의 [선택]일세.
    ja: どうしようが、すべて君の「選択」だ。
  event_lordforjustice_06_s_117:
    speaker: "<Narration>"
    en: "*Beep beep beep*"
    ko: 뚜- 뚜- 뚜-
    ja: ツーツーツー
  event_lordforjustice_06_s_118:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_119:
    speaker: "<Monologue>"
    en: The call ends.
    ko: 그렇게 전화가 끊기고.
    ja: そうして通話が終わり…
  event_lordforjustice_06_s_120:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_s_121:
    speaker: "<Monologue>"
    en: I gaze at K, who is looking at me with sunken eyes.
    ko: 가라앉은 시선으로 나를 바라보고 있는 K와 눈이 마주쳤다.
    ja: 沈鬱な表情で私を見るKと目が合った
event_lordforjustice_06_e:
  event_lordforjustice_06_e_1:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_2:
    speaker: k
    en: Erase my memory.
    ko: 지워.
    ja: 消せ。
  event_lordforjustice_06_e_3:
    speaker: "<Self>"
    en: What?
    ko: "…뭐?"
    ja: "…え？"
  event_lordforjustice_06_e_4:
    speaker: k
    en: Or kill me.
    ko: 아니면 죽이든가.
    ja: もしくは殺せ。好きにしろ。
  event_lordforjustice_06_e_5:
    speaker: "<Self>"
    en: Most of that stuff X said was complete nonsense.
    ko: "…X가 한 말."
    ja: "…Xの話は"
  event_lordforjustice_06_e_6:
    speaker: "<Self>"
    en: "... But there was an element of truth to some of it."
    ko: 거의 다 헛소리였지만, 맞는 부분도 있어.
    ja: |-
      大半がどうでもいい内容だったが、
      一理ある部分もあった
  event_lordforjustice_06_e_7:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_8:
    speaker: "<Self>"
    en: Asking me to erase your memory is the same as asking me to kill you.
    ko: 네 기억을 지우는 건, 나보고 너를 죽이라는 말과 같아, K.
    ja: |-
      君の記憶を消すということは、
      私に君を殺させるのと同じだ
  event_lordforjustice_06_e_9:
    speaker: "<Self>"
    en: I can't make that kind of decision.
    ko: 나는… 지금의 나는 그런 선택을 할 수 없어.
    ja: "…そんな選択はできない"
  event_lordforjustice_06_e_10:
    speaker: "<Self>"
    en: That's not who I am.
    ko: 그게 [나] 니까.
    ja: それが、「私」という人間だ。だからこそ…
  event_lordforjustice_06_e_11:
    speaker: "<Choice>"
    en: I refuse to choose.
    ko: "…아무것도 선택하지 않는다."
    ja: "…何も選択しない"
  event_lordforjustice_06_e_12:
    speaker: "<Choice>"
    en: I refuse to choose.
    ko: "…아무것도 선택하지 않는다."
    ja: "…何も選択しない"
  event_lordforjustice_06_e_13:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_14:
    speaker: "<Self>"
    en: K. You are not a puppet.
    ko: K. 너는 꼭두각시가 아냐.
    ja: K、君は操り人形なんかじゃない
  event_lordforjustice_06_e_15:
    speaker: k
    en: You saw those records.
    ko: "…너도 봤잖아? 그 기록들."
    ja: "…お前も見ただろ？あの記録を。"
  event_lordforjustice_06_e_16:
    speaker: k
    en: I'm a bad person by anyone's measurement.
    ko: 누가 봐도 내가 더 나쁜 놈 아냐?
    ja: 誰がどう見ても、私は悪人そのものだ。
  event_lordforjustice_06_e_17:
    speaker: k
    en: All of those deranged orders from VII...
    ko: VII의 그런… 미친 명령들을.
    ja: VIIのあんな、話にもならないような命令を…
  event_lordforjustice_06_e_18:
    speaker: k
    en: I obsessed over how to carry them out more efficiently.
    ko: 나는 어떻게 하면 더 완벽하고 효과적으로 수행할 수 있을지 고민했어.
    ja: |-
      私はどうすればより完璧に、より効率的に
      遂行できるのか躍起になってた。
  event_lordforjustice_06_e_19:
    speaker: k
    en: I claimed to be making my own judgments, completely unaware that the outcome
      was already decided.
    ko: 답이 정해져 있는 줄도 모르고, [판결]을 내리겠다고 날뛰었어.
    ja: |-
      とっくに答えが出てることにも気づかずに、
      自らの選択で「判決」を下してるつもりに
      なってたんだよ。
  event_lordforjustice_06_e_20:
    speaker: k
    en: And...
    ko: 그리고….
    ja: その結果が…
  event_lordforjustice_06_e_21:
    speaker: "<Self>"
    en: You carried them out flawlessly.
    ko: 전부 훌륭하게 수행했지.
    ja: ああ。すべてやり遂げた
  event_lordforjustice_06_e_22:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_23:
    speaker: "<Self>"
    en: Despite all of that,
    ko: "…그래도."
    ja: "…だが"
  event_lordforjustice_06_e_24:
    speaker: "<Self>"
    en: you never gave up on life.
    ko: 그래도 죽으려고 하지는 않았잖아.
    ja: |-
      そんな状況でも、
      決して生きることを諦めなかった
  event_lordforjustice_06_e_25:
    speaker: k
    en: What?
    ko: "…뭐?"
    ja: "…は？"
  event_lordforjustice_06_e_26:
    speaker: "<Self>"
    en: Erasing your memory may be close to dying,
    ko: 기억을 지우는 것과 죽음이 비슷하다고는 해도.
    ja: 記憶を消すとことは、死と同じだと言ったが
  event_lordforjustice_06_e_27:
    speaker: "<Self>"
    en: but it's not exactly the same.
    ko: 결국 완전히 동일한 건 아니야.
    ja: 厳密には、完全には同じではない
  event_lordforjustice_06_e_28:
    speaker: "<Self>"
    en: Why is it that you chose to have your memories erased instead of being killed?
    ko: K. 넌 예전에 왜 죽음이 아니라, 기억을 지우는 걸 선택했어?
    ja: |-
      K。君はどうして死ではなく、
      記憶を消すことを選んだんだ？
  event_lordforjustice_06_e_29:
    speaker: k
    en: I-I...
    ko: 그, 그건….
    ja: それは…
  event_lordforjustice_06_e_30:
    speaker: "<Self>"
    en: You want to know my theory? I think you wanted to fix things somehow.
    ko: 나는 이렇게 생각해. K는 어떻게든 돌려놓고 싶었다고.
    ja: |-
      何としてでも、
      取り戻したいものがあったんじゃないのか？
  event_lordforjustice_06_e_31:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_32:
    speaker: "<Self>"
    en: You were in too much pain and couldn't bear it, so you erased your memories.
    ko: 너무 괴로워서, 도저히 버틸 수 없어서 기억을 지웠지만.
    ja: |-
      苦しくて、これ以上耐えきれなくて、
      記憶を消すことを選んだ一方で…
  event_lordforjustice_06_e_33:
    speaker: "<Self>"
    en: But even then, you couldn't run. You still wanted to restore justice with
      your own hands.
    ko: 위선자가 될지라도, 어떻게든 자기 손으로 다시 정의를 돌려놓고 싶었다고.
    ja: |-
      例え偽善者になろうと、自分の手でもう一度
      正義を取り戻したかったんじゃないのか？
  event_lordforjustice_06_e_34:
    speaker: k
    en: "... In life, we're faced with many imbalances."
    ko: "…살다 보면 수많은 저울을 마주하게 돼."
    ja: |-
      …生きていればたくさんの天秤と
      向き合うことになる。
  event_lordforjustice_06_e_35:
    speaker: k
    en: We pile on additional weight and remove others, attempting to balance the
      scales,
    ko: |-
      기울어져 있는 저울을 평행하게 만들기 위해
      이런저런 것을 올려보고 내려보고 하지만.
    ja: |-
      天秤を釣り合わせるために色々なものを
      載せたり下ろしたりするだろうけど
  event_lordforjustice_06_e_36:
    speaker: k
    en: but there is no such thing as perfect equilibrium.
    ko: 완벽한 평행이라는 것은 사실 존재하지 않지.
    ja: |-
      完璧に釣り合っている状態なんて
      存在しないんだ。
  event_lordforjustice_06_e_37:
    speaker: k
    en: Rather than trying too hard to make everything balanced,
    ko: |-
      그럴 때 나는 고개를 기울여.
      그럼 완벽한 평행이 되거든.
    ja: |-
      そういう時、私は自分の首を傾ける。
      そうすれば完璧に釣り合ってるように
      見えるから。
  event_lordforjustice_06_e_38:
    speaker: k
    en: in times like that, I tilt my head, and then everything looks in order.
    ko: |-
      기를 써서 평행으로 만드는 것보다,
      고개를 살짝 기울이는 것도.
    ja: |-
      必死に釣り合わせるだけじゃなくて
      軽く首を傾けるのも
  event_lordforjustice_06_e_39:
    speaker: k
    en: It's a way to get by and keep living.
    ko: 살아가는 방식 중 하나야.
    ja: 生き方の1つだな。
  event_lordforjustice_06_e_40:
    speaker: k
    en: I'm going. I'll see you later.
    ko: 간다. 다음에 또 보자.
    ja: それじゃ、またな～
  event_lordforjustice_06_e_41:
    speaker: "<Self>"
    en: Tilt your head and compromise.
    ko: 고개를 기울여서 타협하고.
    ja: 首を傾けて、妥協して…
  event_lordforjustice_06_e_42:
    speaker: "<Narration>"
    en: "*Craaack*"
    ko: 빠지지직-!
    ja: バチッ！
  event_lordforjustice_06_e_43:
    speaker: "<Monologue>"
    en: The thorns on K's gun spark ominously.
    ko: "…K의 총에 달린 가시에서 불길한 소리가 나오고 있다."
    ja: "…Kの銃についているトゲから不吉な音がした"
  event_lordforjustice_06_e_44:
    speaker: k
    en: There's no lasting damage. Just pure pain.
    ko: 아무런 후유증도 안 남기고 고통만 줄 수 있는 거야.
    ja: 後遺症は一切残さず、苦しみだけを与えるんだ。
  event_lordforjustice_06_e_45:
    speaker: k
    en: Perfect for extracting the truth.
    ko: "[진실]을 듣기에 이것 만한 게 없지."
    ja: "「真実」を聞き出すにはぴったりだろ～？"
  event_lordforjustice_06_e_46:
    speaker: d
    en: The methods used must be clean.
    ko: 수단은 깨끗해야 해.
    ja: 汚い手は使うな。
  event_lordforjustice_06_e_47:
    speaker: k
    en: There you go again. You're going to be up all night.
    ko: 또 저러네. 그러다가 날 샌다고.
    ja: またその話？それじゃ日が暮れるって。
  event_lordforjustice_06_e_48:
    speaker: d
    en: 'Remember:'
    ko: 명심해.
    ja: 肝に銘じろ。
  event_lordforjustice_06_e_49:
    speaker: d
    en: Clean methods make for a clean resolution.
    ko: 수단이 깨끗해야 결과도 깨끗해.
    ja: |-
      キレイな結果が欲しければ、
      キレイな手段を使え。
  event_lordforjustice_06_e_50:
    speaker: k
    en: All right all right, stop going on about "clean" this and "clean" that.
    ko: 아 그러셔. 댁은 계속 그렇게 깨끗하게 해.
    ja: あー、はいはい。そっちはそのやり方でどうぞ～
  event_lordforjustice_06_e_51:
    speaker: k
    en: I'll do things my own way.
    ko: 난 내 방식대로 할 테니까.
    ja: 私は私のやり方でやるからさ。
  event_lordforjustice_06_e_52:
    speaker: "<Self>"
    en: Even if the means were immoral.
    ko: 도덕적이지 못한 수단을 쓸지라도.
    ja: 道徳に反する方法を使うことになろうとも
  event_lordforjustice_06_e_53:
    speaker: "<Self>"
    en: Even if you did not act righteously, you still wanted to restore justice.
    ko: "…너 스스로가 정의롭지 않더라도, 정의를 돌려놓고 싶었던 거야."
    ja: |-
      …君自身が正義に背くことになろうとも、
      正義を取り戻したかったんじゃないのか？
  event_lordforjustice_06_e_54:
    speaker: k
    en: There's more to it than that.
    ko: "…이건 그냥 수단이 어떠니 하는 차원의 문제가 아냐."
    ja: "…もう、そういう次元の話じゃないんだよ。"
  event_lordforjustice_06_e_55:
    speaker: k
    en: I'm a villain. A bloodthirsty, vicious villain!
    ko: 나는 악인이라고. 그것도 극악무도한!
    ja: 私は悪人なんだ。それも極悪非道の！
  event_lordforjustice_06_e_56:
    speaker: k
    en: What right do I have to talk about justice?
    ko: 그런 내가 정의를…!
    ja: そんな私がどうやって正義を…！
  event_lordforjustice_06_e_57:
    speaker: "<Self>"
    en: You're on the right path as we speak.
    ko: 가고 있는 거잖아, 지금은.
    ja: "…君はまだその道の途中にいるだろう？"
  event_lordforjustice_06_e_58:
    speaker: k
    en: What?
    ko: "…뭐?"
    ja: "…は？"
  event_lordforjustice_06_e_59:
    speaker: "<Self>"
    en: Moran is a just person.
    ko: "…나는 목단이 정의롭다고 생각해."
    ja: "…私は、モランのことを正義だと思っている"
  event_lordforjustice_06_e_60:
    speaker: "<Self>"
    en: Is she a perfect person? No. She's not without her flaws.
    ko: 결점이 없는 완벽한 정의냐고 묻는다면… 아닐 수도 있겠지만.
    ja: |-
      欠点のない完璧な正義かと聞かれたら…
      違うかもしれないが
  event_lordforjustice_06_e_61:
    speaker: "<Self>"
    en: But if you were to place her on the scales, they would certainly tip towards
      the side that's just.
    ko: 그래도 천칭에 올려놓으면 분명히 정의 쪽으로 기울겠지.
    ja: |-
      だが、天秤にかければきっと
      正義の方に傾くと信じている
  event_lordforjustice_06_e_62:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_63:
    speaker: "<Self>"
    en: Even if others call her a criminal, and despite what occurred in Fog Hollow,
    ko: |-
      남들이 범죄 조직이라고 손가락질해도,
      포그 할로우 일이 있었어도.
    ja: |-
      みんなから犯罪組織だと言われても、
      フォグホロウでの事件があった後でも…
  event_lordforjustice_06_e_64:
    speaker: "<Self>"
    en: She is still a righteous person.
    ko: 목단은 여전히 정의로워. 왜냐하면….
    ja: モランは依然として正義のままだ。なぜなら…
  event_lordforjustice_06_e_65:
    speaker: "<Self>"
    en: That's because she keeps striving to uphold what she feels is right.
    ko: 정의를 향해서, 계속 나아가고 있으니까.
    ja: 正義に向かって、歩み続けているからな
  event_lordforjustice_06_e_66:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_67:
    speaker: "<Self>"
    en: Up until now, you've left all the decision-making up to me.
    ko: 지금까지 너희는 나에게 선택을 맡겼잖아?
    ja: 今まで、君たちは私に選択を委ねてきた
  event_lordforjustice_06_e_68:
    speaker: "<Self>"
    en: Now it's time for you to decide, K.
    ko: 이번에는 네가 선택할 차례야, K.
    ja: だから今度は、君が選択する番だ、K
  event_lordforjustice_06_e_69:
    speaker: "<Self>"
    en: So what's it going to be?
    ko: 네 선택은 뭐야?
    ja: 君は何を選択する？
  event_lordforjustice_06_e_70:
    speaker: "<Self>"
    en: What's your decision?
    ko: 네… 정의는 뭐야?
    ja: 君の…正義は何だ？
  event_lordforjustice_06_e_71:
    speaker: k
    en: My... my decision is...
    ko: 내… 내 정의는….
    ja: 私の…私の正義は…
  event_lordforjustice_06_e_72:
    speaker: "<Monologue>"
    en: K grits her teeth and slowly lifts her head.
    ko: 한동안 이를 악물고 있던 K가 천천히 고개를 들었다.
    ja: |-
      Kはしばらく歯を食いしばったのち、
      ゆっくりと顔を上げた
  event_lordforjustice_06_e_73:
    speaker: k
    en: "... I really can't stand this."
    ko: "…진짜, 못 들어주겠구만."
    ja: "…ったく、我慢の限界だ。"
  event_lordforjustice_06_e_74:
    speaker: k
    en: Twisting and smashing words together in to try and force meanings, even when
      it makes no sense.
    ko: 궤변에, 억지에… 말은 앞뒤가 하나도 안 맞고.
    ja: さっきからああだのこうだの…
  event_lordforjustice_06_e_75:
    speaker: k
    en: Talking like you know everything when you don't have a clue.
    ko: 아무것도 모르는 주제에, 지레짐작해서 떠들기나 하고.
    ja: 何も知らないくせに、好き勝手言いやがって。
  event_lordforjustice_06_e_76:
    speaker: k
    en: I tried to kill myself, for goodness sake. I'm too far gone.
    ko: 심지어 이번에는 죽으려고 했잖아, 나.
    ja: "…こっちは、本気で死のうとしたってのにさ。"
  event_lordforjustice_06_e_77:
    speaker: "<Self>"
    en: "..."
    ko: 하하….
    ja: はは…
  event_lordforjustice_06_e_78:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_79:
    speaker: k
    en: This is why I don't like humans.
    ko: "…이래서 인간 녀석들은 마음에 안 든다니까."
    ja: "…これだから、人間は気に食わないんだよ。"
  event_lordforjustice_06_e_80:
    speaker: "<Self>"
    en: You don't like humans?
    ko: 인간이 싫어?
    ja: 人間が嫌いか？
  event_lordforjustice_06_e_81:
    speaker: k
    en: No.
    ko: 어.
    ja: ああ。
  event_lordforjustice_06_e_82:
    speaker: k
    en: At least, not before.
    ko: "…[예전]에는 그랬어."
    ja: "…「今まで」はな。"
  event_lordforjustice_06_e_83:
    speaker: "<Choice>"
    en: I see.
    ko: 그렇구나.
    ja: そうか
  event_lordforjustice_06_e_84:
    speaker: "<Choice>"
    en: Right.
    ko: 그랬었지.
    ja: そうだな
  event_lordforjustice_06_e_85:
    speaker: "<Self>"
    en: Doesn't seem like much has changed.
    ko: 그래도… 변한 건 아무것도 없어.
    ja: |-
      …それにしては、特に変わったところは
      なさそうだが
  event_lordforjustice_06_e_86:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_06_e_87:
    speaker: k
    en: You're right. Nothing has changed, and that's a bad thing.
    ko: 그러게. 아무것도 안 변했네. 그것도 안 좋은 쪽으로.
    ja: |-
      そうだな。な～んも変わってない。
      しかも悪い部分がな。
  event_lordforjustice_06_e_88:
    speaker: k
    en: So...
    ko: 그러니까….
    ja: だから…
  event_lordforjustice_06_e_89:
    speaker: k
    en: It's time we change that. Starting now.
    ko: "…변하게 해야겠네. 앞으로."
    ja: "…これから、変わっていかないとな。"
  event_lordforjustice_06_e_90:
    speaker: "<Self>"
    en: I'll help.
    ko: 도와줄게.
    ja: なら、手伝おう
  event_lordforjustice_06_e_91:
    speaker: k
    en: You? How?
    ko: "…네가? 무슨 수로?"
    ja: "…お前が？どうやって？"
  event_lordforjustice_06_e_92:
    speaker: "<Self>"
    en: Er...
    ko: 그건, 음….
    ja: それについては、そうだな…
  event_lordforjustice_06_e_93:
    speaker: "<Self>"
    en: I'll have to think about it.
    ko: 앞으로 생각해 보지 뭐.
    ja: これからゆっくり、考えていこう
  event_lordforjustice_06_e_94:
    speaker: k
    en: "*Sigh*..."
    ko: "……하."
    ja: "…はあ。"
  event_lordforjustice_06_e_95:
    speaker: "<Monologue>"
    en: K, looking more at ease, picks the gun up from the floor.
    ko: K는 한결 가벼워진 얼굴로, 바닥에 뒹굴고 있던 총을 집어 들었다.
    ja: |-
      ついたため息とは裏腹に、
      Kは晴れ晴れとした表情で
      地面に落ちていた銃を拾い上げた
  event_lordforjustice_06_e_96:
    speaker: k
    en: Okay. Show me then. Let me see for myself.
    ko: "…그래. 그럼 보여줘 봐. 참고 좀 하게."
    ja: |-
      …なら、お前の正義とやらを
      見せてもらおうか。
  event_lordforjustice_06_e_97:
    speaker: k
    en: Show me what righteousness is to you.
    ko: 네 정의는 뭔지.
    ja: せいぜい参考にしてやるよ。
  event_lordforjustice_06_e_98:
    speaker: k
    en: And the road, for justice, I'm meant to follow.
    ko: 어떤 길을… 따라가야 하는지.
    ja: "…これから進むべき道の、しるべとしてな。"
  event_lordforjustice_06_e_99:
    speaker: "<Narration>"
    en: 'ROAD, FOR JUSTICE: BEGIN'
    ko: 'ROAD, FOR JUSTICE : BEGIN'
    ja: 'ROAD, FOR JUSTICE : BEGIN'
event_lordforjustice_epilogue:
  event_lordforjustice_epilogue_1:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅.
    ja: スタスタ…
  event_lordforjustice_epilogue_2:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_3:
    speaker: d
    en: So you couldn't bear the weight of the crown.
    ko: "…결국 왕관의 무게를 버티지 못했나."
    ja: "…結局、王冠の重さに耐えきれなかったか。"
  event_lordforjustice_epilogue_4:
    speaker: d
    en: I knew from the beginning that it would be too much for you.
    ko: 처음부터 너에겐 버거울 거라고 생각했다.
    ja: 最初からお前には無理だと思ってた。
  event_lordforjustice_epilogue_5:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ
  event_lordforjustice_epilogue_6:
    speaker: k
    en: If you'd known that from the start, you should have told me.
    ko: 처음부터 그랬으면 진작 얘기하던가.
    ja: それならそうと、最初に言ってくれよ？
  event_lordforjustice_epilogue_7:
    speaker: k
    en: Besides, I haven't removed it. I've only let someone borrow it for a while.
    ko: "…그리고 벗은 게 아니라, 잠깐 빌려준 거야."
    ja: |-
      …それと、王冠は脱いだんじゃない。
      少し貸してやってるだけだ。
  event_lordforjustice_epilogue_8:
    speaker: k
    en: Someone willing to carry it in my stead.
    ko: 같이 들어준다는 사람이 있어서.
    ja: |-
      一緒に持ってやるっていう奇特な奴が
      現れたからな。
  event_lordforjustice_epilogue_9:
    speaker: d
    en: I've got a pretty good idea who it is,
    ko: "…알만하군."
    ja: "…誰だか予想はつくな。"
  event_lordforjustice_epilogue_10:
    speaker: d
    en: but still...
    ko: 그래도….
    ja: だが…
  event_lordforjustice_epilogue_11:
    speaker: d
    en: That is very much your way of doing things.
    ko: 너다워. 너다운 방식이야.
    ja: 実にお前らしい方法だな。
  event_lordforjustice_epilogue_12:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_13:
    speaker: k
    en: Right. Instead of balancing the scales,
    ko: 그래. 천칭의 무게를 맞추는 게 아니라 고개를 기울이는,
    ja: |-
      …天秤の重さを合わせるんじゃなく、
      自分の頭を傾けるっていう…
  event_lordforjustice_epilogue_14:
    speaker: k
    en: I tilt my head.
    ko: 나다운 방식이지.
    ja: 私らしい方法だろ？
  event_lordforjustice_epilogue_15:
    speaker: k
    en: You got a problem with that?
    ko: 그래서, 불만 있냐?
    ja: で、なんか文句でもあるのか～？
  event_lordforjustice_epilogue_16:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_17:
    speaker: d
    en: Not really. Not right now.
    ko: 지금은 딱히.
    ja: 今は特にない。
  event_lordforjustice_epilogue_18:
    speaker: d
    en: What matters is whether there is conviction behind your actions.
    ko: 중요한 건 자신의 행동에 신념과 확신이 있느냐는 거니까.
    ja: |-
      重要なのは、自らの行動に
      信念と確信が伴っているかどうかだからな。
  event_lordforjustice_epilogue_19:
    speaker: k
    en: Please. Like you're so perfect.
    ko: 그래, 너 잘났다.
    ja: ハイハイ、お前が一等賞ってことで。
  event_lordforjustice_epilogue_20:
    speaker: k
    en: "... So what happened to your mission? Weren't you investigating that cult?"
    ko: |-
      …그런데 임무는 어떻게 되어가?
      그 사이비인가 뭔가 조사한댔잖아.
    ja: |-
      …それはそうと、任務の方はどうなってる？
      例のカルト集団かなんかを調査するってやつ。
  event_lordforjustice_epilogue_21:
    speaker: k
    en: I... I'm something of a free agent now,
    ko: 나 이제 어… 프리랜서라고 해야되나?
    ja: |-
      その…いわゆるフリーランサー？に
      なったわけだし、
  event_lordforjustice_epilogue_22:
    speaker: k
    en: so I decided to come and help out.
    ko: 뭐 그런 게 돼서, 너 좀 도와줄까 하는데.
    ja: 手伝ってやってもいいけど？
  event_lordforjustice_epilogue_23:
    speaker: d
    en: A free agent?
    ko: "…프리랜서?"
    ja: "…フリーランサー？"
  event_lordforjustice_epilogue_24:
    speaker: k
    en: Yeah. I'm giving this whole vigilante thing a try.
    ko: 어. 일단 자경단 느낌으로 해보란다.
    ja: |-
      ああ、まずは自警団みたいなことを
      やってみるのはどうだってなったんだよ。
  event_lordforjustice_epilogue_25:
    speaker: k
    en: He said that he'd bear all responsibility and that I could do whatever I wanted.
    ko: 책임은 전부 자기가 질 테니까, 그냥 마음 가는 대로 하라고.
    ja: |-
      「責任はすべて私が負うから心配するな」、
      だってさ～
  event_lordforjustice_epilogue_26:
    speaker: k
    en: He said he trusts me.
    ko: "…믿고, 있다고."
    ja: "…信じてるって。"
  event_lordforjustice_epilogue_27:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_28:
    speaker: k
    en: Hehe, @UserName sure is a funny guy.
    ko: 하하. @UserName, 진짜 웃기지 않냐?
    ja: ははっ。あいつ、本当に変わってるよな？
  event_lordforjustice_epilogue_29:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_30:
    speaker: "<Narration>"
    en: D does not answer and taps at her phone.
    ko: D는 대답하지 않고 핸드폰을 조작했고,
    ja: Dは返事をしないまま、携帯電話を操作した
  event_lordforjustice_epilogue_31:
    speaker: "<Narration>"
    en: "*Ring*"
    ko: 띠링-
    ja: ピロン
  event_lordforjustice_epilogue_32:
    speaker: "<Narration>"
    en: In K's pocket, her phone vibrates with a notification.
    ko: K의 주머니에서 알림음이 울렸다.
    ja: Kのポケットの中で通知音が鳴った
  event_lordforjustice_epilogue_33:
    speaker: d
    en: Investigation data. Commit it to memory.
    ko: 조사 자료. 확인하고, 숙지해.
    ja: 調査資料だ。確認して頭に入れておけ。
  event_lordforjustice_epilogue_34:
    speaker: k
    en: Hm... I guess it hasn't properly started yet.
    ko: 흠… 아직 본격적으로 시작하진 않았었나 보네.
    ja: ふーん…まだ本格的には始めてないんだ。
  event_lordforjustice_epilogue_35:
    speaker: d
    en: We need to be especially cautious with this mission.
    ko: "…이번 임무는 특히 더 신중해야 해."
    ja: |-
      …今回の任務はいつも以上に
      慎重を期す必要がある。
  event_lordforjustice_epilogue_36:
    speaker: k
    en: Right. They did say they would leave my fate to @UserName,
    ko: 그렇지. 뭐, 말은 내 처분을 @UserName에게 맡긴다고 했지만,
    ja: |-
      だろうね。口では私の処分を
      @UserNameに
      任せるとは言ってるけど、
  event_lordforjustice_epilogue_37:
    speaker: k
    en: but I'm still not convinced that they'll let me walk away from this.
    ko: 그 녀석들이 순순히 놔줄 것 같지는 않거든.
    ja: |-
      どうせあいつらのことだ。
      素直に道具を手放すとは思えないな。
  event_lordforjustice_epilogue_38:
    speaker: d
    en: You can still opt out of this if you want.
    ko: 빠져도 돼.
    ja: 今から抜けても構わないぞ。
  event_lordforjustice_epilogue_39:
    speaker: k
    en: What's gotten into you? Let's go already.
    ko: 뭐 잘못 먹었냐? 됐으니까 가자.
    ja: |-
      何、心配してくれてんの？
      いいからさっさと行こうぜ～
  event_lordforjustice_epilogue_40:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_41:
    speaker: k
    en: We have to make a righteous judgment.
    ko: 정의로운… 판결을 위하여.
    ja: "…正義ある裁きのために、な。"
  event_lordforjustice_epilogue_42:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_43:
    speaker: k
    en: What are you looking at?
    ko: "…뭐, 뭘 그렇게 봐?"
    ja: "…な、何だよじろじろ見て？"
  event_lordforjustice_epilogue_44:
    speaker: k
    en: Arcana was telling me all this stuff about self-suggestion,
    ko: 그, 아르카나가 자기암시인가 뭔가.
    ja: |-
      …今のは、アレだよ。
      自己暗示が効果的だって
      アルカナが言ってたのを思い出したから…
  event_lordforjustice_epilogue_45:
    speaker: k
    en: and it's supposed to be effective, so I'm giving it a try.
    ko: 효과 좋다길래 좀 따라 해 본 거야 그냥.
    ja: ちょっと試してみただけだ。
  event_lordforjustice_epilogue_46:
    speaker: d
    en: "... You've changed."
    ko: "…변했군."
    ja: "…変わったな。"
  event_lordforjustice_epilogue_47:
    speaker: k
    en: Yeah? @UserName said nothing changed.
    ko: 그래? @UserName 말로는 아무것도 안 변했다던데.
    ja: |-
      そう？
      @UserNameは、
      何も変わってないって言ってたけど。
  event_lordforjustice_epilogue_48:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_49:
    speaker: k
    en: Well, I guess I did.
    ko: "…뭐, 변하긴 했지."
    ja: "…まあ、少しは変わったかもな。"
  event_lordforjustice_epilogue_50:
    speaker: k
    en: Humans change. The same must go for Nikkes who used to be human.
    ko: 인간은 변해. 원래 인간이었던 니케도 마찬가지고.
    ja: |-
      人は変わる。なら、もともと人間だった
      ニケも似たようなもんだろ～？
  event_lordforjustice_epilogue_51:
    speaker: k
    en: I used to hate that.
    ko: 그래서… 되게 싫어했었는데.
    ja: "…だからこそ、毛嫌いしてたんだけどな。"
  event_lordforjustice_epilogue_52:
    speaker: k
    en: But I've decided not to let it get to me. Not anymore.
    ko: 이젠, 뭐. 신경 안 쓰기로 했어.
    ja: まっ、これからは気にしないことにしたから～
  event_lordforjustice_epilogue_53:
    speaker: d
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_54:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅.
    ja: ザッ
  event_lordforjustice_epilogue_55:
    speaker: "<Narration>"
    en: D turns around and walks away with a word.
    ko: D는 대답하지 않고 등을 돌려 걷기 시작했고,
    ja: Dは返事をすることなく、背を向けて歩き出した
  event_lordforjustice_epilogue_56:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ
  event_lordforjustice_epilogue_57:
    speaker: "<Narration>"
    en: K follows.
    ko: K도 곧 따라붙었다.
    ja: Kもその後に続いた
  event_lordforjustice_epilogue_58:
    speaker: k
    en: So, where do we start?
    ko: 그래서, 뭐부터 하는데?
    ja: で、何から始めるんだ～？
  event_lordforjustice_epilogue_59:
    speaker: d
    en: We need to find someone.
    ko: "…사람을 찾으면 돼."
    ja: "…まずは人探しだ。"
  event_lordforjustice_epilogue_60:
    speaker: k
    en: What's the name?
    ko: 사람? 이름은 알아?
    ja: 人探し？ターゲットの名前は知ってんのか？
  event_lordforjustice_epilogue_61:
    speaker: d
    en: Deipara.
    ko: 데이파라.
    ja: "…デイパラ。"
  event_lordforjustice_epilogue_62:
    speaker: "<Narration>"
    en: An old man reclines in a luxurious armchair, sipping from a glass.
    ko: 한 노인이 고급스러운 의자에 등을 기대고 앉아 술잔을 기울이고 있다.
    ja: |-
      1人の老人が高級そうな椅子に
      深々と座りながら、ワインを飲んでいる
  event_lordforjustice_epilogue_63:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 띠리리링-
    ja: プルルル…
  event_lordforjustice_epilogue_64:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャ
  event_lordforjustice_epilogue_65:
    speaker: x
    en: Speak.
    ko: 말하게나.
    ja: 話せ。
  event_lordforjustice_epilogue_66:
    speaker: "<Monologue>"
    en: A male voice flows from the antique headset the old man holds.
    ko: 노인이 들고 있는, 고풍스러운 수화기에서 어떤 남자의 목소리가 흘러나온다.
    ja: |-
      老人が手に取った年季のある受話器から、
      とある男の声が聞こえてきた
  event_lordforjustice_epilogue_67:
    speaker: x
    en: Already finished?
    ko: "…호오. 벌써 끝냈나?"
    ja: "…ほお。もう終わったのか？"
  event_lordforjustice_epilogue_68:
    speaker: x
    en: Then what's the agenda for next Monday?
    ko: 그러면, 다음 주 월요일 안건은 뭔가?
    ja: では、来週の月曜日の案件は？
  event_lordforjustice_epilogue_69:
    speaker: x
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_70:
    speaker: x
    en: Take it easy. Everyone stumbles in the beginning.
    ko: 편하게 하게나. 처음에는 다 서툰 법일세.
    ja: 肩の力を抜きたまえ。最初は誰だってそうだ。
  event_lordforjustice_epilogue_71:
    speaker: x
    en: So you understand everything that's happened thus far?
    ko: "…호오. 지금까지 해온 일들에 대해서는 완벽하게 파악하고 있다?"
    ja: |-
      …ほお。これまでの経緯については
      完璧に把握していると？
  event_lordforjustice_epilogue_72:
    speaker: x
    en: Are you referring to what VII was handling?
    ko: VII이 진행하던 일 말인가?
    ja: |-
      君が言っているのは、
      VIIが進めていた案件のことか？
  event_lordforjustice_epilogue_73:
    speaker: x
    en: "..."
    ko: "……."
    ja: "……"
  event_lordforjustice_epilogue_74:
    speaker: x
    en: You're mistaken.
    ko: 흠. 착각하고 있군.
    ja: ふむ。どうやら勘違いをしているようだな。
  event_lordforjustice_epilogue_75:
    speaker: x
    en: That's been out of our hands for some time.
    ko: 그건 이미 우리 손을 떠난 지 꽤 되었다네.
    ja: その件は我々の管轄を離れて久しい。
  event_lordforjustice_epilogue_76:
    speaker: x
    en: It's already out of our control.
    ko: 이미 통제 불능이야.
    ja: すでに統制は不可能だ。
  event_lordforjustice_epilogue_77:
    speaker: x
    en: I admire your passion, that you want to succeed again.
    ko: "…다시 성공시키겠다니, 열정은 좋군."
    ja: |-
      …今度も成功してみせるだと？
      その情熱には感心するな。
  event_lordforjustice_epilogue_78:
    speaker: x
    en: But remember.
    ko: 하지만 기억하게.
    ja: だが、覚えておくように。
  event_lordforjustice_epilogue_79:
    speaker: x
    en: They are simply tools. It does not matter whether they succeed or fail.
    ko: 그런 것들은 전부 수단일 뿐일세. 실패하든 성공하든, 아무런 상관이 없다네.
    ja: |-
      それらはすべて手段にすぎない。
      成功しようが失敗しようが、
      どうでもいいことだ。
  event_lordforjustice_epilogue_80:
    speaker: x
    en: They simply need to exist.
    ko: 그저….
    ja: ただ…
  event_lordforjustice_epilogue_81:
    speaker: x
    en: That's all.
    ko: "[존재하기만 하면] 될 뿐이지."
    ja: "「存在さえしていれば」いいのだよ。"
  event_lordforjustice_epilogue_82:
    speaker: x
    en: If you understand that, then you can get to work.
    ko: 알아들었으면 가서 일 보게.
    ja: |-
      理解できたかな？
      なら、もう切ってくれて構わない。
  event_lordforjustice_epilogue_83:
    speaker: x
    en: There have been some complications, so you'll need to work that much harder.
    ko: 계획이 조금 꼬였으니까, 그만큼 자네가 더 힘 써줘야겠어.
    ja: |-
      計画が少しずれた分、
      せいぜい君には頑張ってもらおうか。
  event_lordforjustice_epilogue_84:
    speaker: "<Narration>"
    en: "*Beep beep beep*"
    ko: 뚜- 뚜- 뚜-
    ja: ツーツーツー
  event_lordforjustice_epilogue_85:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャン…
  event_lordforjustice_epilogue_86:
    speaker: x
    en: It's been a long time since I heard someone recite slogans by rote. Certainly
      not since VII or automated voice systems.
    ko: 거, 요새보기 드문 젊은이야.
    ja: ふむ、最近の若者にしては珍しい部類だな。
  event_lordforjustice_epilogue_87:
    speaker: x
    en: Such a rare trait to find in a young person these days.
    ko: |-
      꼬박꼬박 구호 붙이는 건
      VII 녀석이랑 안내음성말고는 오랜만인데 말야.
    ja: |-
      いちいち標語を口にする奴は、
      VIIと自動音声システム以外では久しぶりだ。
  event_lordforjustice_epilogue_88:
    speaker: "<Monologue>"
    en: X pauses as he reaches again for his glass.
    ko: X는 술잔을 향해 뻗던 손을 멈칫했다.
    ja: |-
      そう言ってXはワイングラスに手を伸ばしかけ、
      ふと動きを止めた
  event_lordforjustice_epilogue_89:
    speaker: x
    en: Hmm... the more I think about it, the more I like it.
    ko: "…흠. 곱씹을수록 훌륭한 말이로군."
    ja: |-
      …ふむ。考えれば考えるほど
      素晴らしい言葉だな。
  event_lordforjustice_epilogue_90:
    speaker: x
    en: For the sake of a righteous judgment...
    ko: 정의로운 판결을… 위하여.
    ja: 正義ある裁きのために…か。
  event_lordforjustice_epilogue_91:
    speaker: "<Narration>"
    en: 'LORD, FOR JUSTICE: END'
    ko: 'LORD, FOR JUSTICE : END'
    ja: 'LORD, FOR JUSTICE : END'
