---
event_foolburstday_01:
  event_foolburstday_01_1:
    speaker: "<Monologue>"
    en: April Fool's Day.
    ko: 만우절.
    ja: エイプリルフール…
  event_foolburstday_01_2:
    speaker: "<Monologue>"
    en: A day which comes only once a year,
    ko: 1년에 단 하루 있는 날로써
    ja: 一年にたった一日だけの特別な日
  event_foolburstday_01_3:
    speaker: "<Monologue>"
    en: during which deceptive pranks become tolerated, and no one is held responsible
      for the damage they cause.
    ko: |-
      그 어떤 거짓말도 용납되고,
      그로 인한 피해에 아무런 책임도 묻지 않는(아니다) 날.
    ja: |-
      どんな嘘も許され、嘘による被害にも
      一切責任を問われない（わけではない）日
  event_foolburstday_01_4:
    speaker: "<Monologue>"
    en: For the same reason, it's also a day where you must be on high alert at all
      times.
    ko: 그렇기에 하루 종일 신경을 곤두세우고 있어야 하는 날이다.
    ja: |-
      だからこそ、一日中神経を研ぎ澄ませておく
      必要がある
  event_foolburstday_01_5:
    speaker: "<Monologue>"
    en: The moment you let your guard down, you'll undoubtedly be deceived by those
      looking to make a fool of you.
    ko: 방심하는 순간, 온갖 거짓말로 무장한 이에게 유린당할 것이 뻔하기 때문이다.
    ja: |-
      油断した瞬間、嘘で武装した者たちに
      もてあそばれてしまうからだ
  event_foolburstday_01_6:
    speaker: "<Monologue>"
    en: I've therefore decided that my approach for the day is to remain calm.
    ko: 그래서 내가 세운 결론은 평정심.
    ja: |-
      そこで私は決めた。
      平常心でいることを
  event_foolburstday_01_7:
    speaker: "<Monologue>"
    en: No matter what tomfoolery I'm subjected to, I'll laugh it off, like water
      off a duck's back.
    ko: |-
      상대가 어떤 거짓말을 하든 그저 웃어넘기는 것.
      동요하지 않는 것.
    ja: |-
      相手がどんな嘘をついたとしても、
      笑い飛ばすこと。動揺しないことを
  event_foolburstday_01_8:
    speaker: "<Monologue>"
    en: I'll make my mind a steel trap, maintain my composure, and face any situation
      that arises with nothing but sheer poise.
    ko: 강철 같은 마음으로 부동심을 유지해 그 어떤 상황에서도 의연하게
    ja: |-
      鋼のような強い気持ちで、
      いかなる状況においても平常心を――
  event_foolburstday_01_9:
    speaker: mechashifty
    en: Hello, Inferior Human.
    ko: 안녕하십니까 열등종.
    ja: こんにちは、劣等種。
  event_foolburstday_01_10:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_01_11:
    speaker: mechashifty
    en: Is this Commander @UserName's room?
    ko: 여기가 @UserName 지휘관의 방입니까?
    ja: |-
      ここが@UserName指揮官の
      部屋ですか？
  event_foolburstday_01_12:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_01_13:
    speaker: "<Monologue>"
    en: What in the hell is th—
    ko: 뭐지?
    ja: 何だ？
  event_foolburstday_01_14:
    speaker: "<Monologue>"
    en: No, no. I must remain calm. Perfectly calm.
    ko: 이건 뭐지?
    ja: これは…何だ？
  event_foolburstday_01_15:
    speaker: "<Monologue>"
    en: Ah, I know what's going on here.
    ko: 아아. 안돼. 평정심 평정심.
    ja: ああ、ダメだ。平常心、平常心を保たなければ…
  event_foolburstday_01_16:
    speaker: "<Monologue>"
    en: Someone must be inside this thing.
    ko: "…알겠다. 안에 누가 들어가 있나 보다."
    ja: "…分かった。きっと中に誰か入っているのだろう"
  event_foolburstday_01_17:
    speaker: "<Monologue>"
    en: If I yank off that head, I'm sure I'll see who's inside.
    ko: 머리를 뽑아보면 안에 누가 있는지 알 수 있겠지.
    ja: 頭を外せば、誰が入っているのか分かるはずだ
  event_foolburstday_01_18:
    speaker: mechashifty
    en: Don't you dare touch my head, Human, or else I will open fire.
    ko: |-
      두부를 만지지 마십시오 열등종.
      발포하겠습니다.
    ja: |-
      頭部に触れないでください、劣等種。
      発砲します。
  event_foolburstday_01_19:
    speaker: "<Self>"
    en: "... Fine."
    ko: "…좋아."
    ja: "…分かった"
  event_foolburstday_01_20:
    speaker: "<Self>"
    en: I have to admit, I'm impressed.
    ko: 인정할게. 많이 놀랐어.
    ja: 認めよう。とても驚かされた
  event_foolburstday_01_21:
    speaker: "<Self>"
    en: I didn't think someone would put this much effort into April Fool's Day.
    ko: 만우절에 이렇게까지 공을 들일 줄 몰랐네.
    ja: |-
      エイプリルフールに
      ここまで力を入れてくるとは思わなかった
  event_foolburstday_01_22:
    speaker: mechashifty
    en: Meaning unclear.
    ko: 의미 불명.
    ja: 意味不明。
  event_foolburstday_01_23:
    speaker: "<Self>"
    en: All right, you got me. Just take off the costume, will you?
    ko: 내가 졌어. 그러니 이제 벗어.
    ja: 私の負けだ。だからもう脱いでくれ
  event_foolburstday_01_24:
    speaker: mechashifty
    en: What?
    ko: "…뭐라고요?"
    ja: "…何ですって？"
  event_foolburstday_01_25:
    speaker: "<Self>"
    en: Your little prank worked. Now ditch the robot getup.
    ko: 아 졌다고. 빨리 벗어.
    ja: 私の負けだ。早く脱いでくれ
  event_foolburstday_01_26:
    speaker: mechashifty
    en: You want me to undress? The rumors are true, you really are into anyone and
      everyone.
    ko: 데이터대로 상대를 가리지 않는군요.
    ja: データ通り、相手を選り好みしないようですね。
  event_foolburstday_01_27:
    speaker: mechashifty
    en: Root cause of issue identified. Commencing elimination.
    ko: 근원 제거 행동에 돌입합니다.
    ja: 問題の排除を開始します。
  event_foolburstday_01_28:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_foolburstday_01_29:
    speaker: "<Monologue>"
    en: A laser sight zeroes in on me.
    ko: 레이저 사이트의 빛이 나를 비춘다.
    ja: レーザーサイトの光が私を照らす
  event_foolburstday_01_30:
    speaker: "<Monologue>"
    en: "... A very sensitive part of my lower anatomy, to be specific."
    ko: "…하반신이다."
    ja: "…下半身が狙われている"
  event_foolburstday_01_31:
    speaker: "<Self>"
    en: What the...?! W-wait...!
    ko: 어? 자, 잠깐…!
    ja: え？ま、待った…！
  event_foolburstday_01_32:
    speaker: mechashifty
    en: I will turn you into mincemeat sausage.
    ko: 다진 소시지로 만들어 드리겠습니다.
    ja: 切り刻んだソーセージにしましょう。
  event_foolburstday_01_33:
    speaker: mechashifty
    en: Correction. Sausages are composed of mincemeat, so this statement is redundant.
      I will turn you into mincemeat.
    ko: 정정. 소시지는 이미 다진 고기로 만든 것이니 그냥 다져드리겠습니다.
    ja: |-
      訂正。ソーセージはすでに切り刻んだ肉で
      作られているため、ただ切り刻みます。
  event_foolburstday_01_34:
    speaker: "<Self>"
    en: Th-this has to be a joke, right?
    ko: "…자, 장난이지?"
    ja: "…じょ、冗談だろう？"
  event_foolburstday_01_35:
    speaker: mechashifty
    en: I will give you time to bid this organ a final farewell.
    ko: 그것과의 작별인사 시간을 드리겠습니다.
    ja: |-
      ソレとお別れのあいさつをする
      時間を差し上げます。
  event_foolburstday_01_36:
    speaker: "<Self>"
    en: I... It'll take more than a bullet to destroy that part of me!
    ko: 초, 총알 정도로는 끄떡없을 텐데.
    ja: だ、弾丸ごときじゃビクともしないぞ
  event_foolburstday_01_37:
    speaker: mechashifty
    en: Hubris will lead to your downfall.
    ko: 과한 자신감은 파멸로 가는 지름길입니다.
    ja: 過度な自信は、破滅への近道となるでしょう。
  event_foolburstday_01_38:
    speaker: "<Narration>"
    en: "*Kreeeeee*!"
    ko: 기이이잉--!!
    ja: ウィィーン！！
  event_foolburstday_01_39:
    speaker: shifty_r
    en: Shift Stop!
    ko: 시프톱!
    ja: シフトップ！
  event_foolburstday_01_40:
    speaker: mechashifty
    en: Force-quit command confirmed. Stopping.
    ko: 강제 정지 명령 확인. 정지합니다.
    ja: 強制停止の命令を確認。停止します。
  event_foolburstday_01_41:
    speaker: shifty_r
    en: "... Whew."
    ko: "…후우."
    ja: "…ふぅ。"
  event_foolburstday_01_42:
    speaker: shifty_r
    en: You must have gotten a little scared there, Commander.
    ko: 지휘관. 많이 놀라셨죠?
    ja: |-
      すみません指揮官、
      驚かせてしまいましたよね。
  event_foolburstday_01_43:
    speaker: "<Self>"
    en: More than a little! I nearly lost my family jewels!
    ko: 많이 놀란 정도가 아니라 내 가장 소중한 것을 잃을 뻔했어.
    ja: |-
      驚くどころか、私の最も大切なものを
      失うところだった
  event_foolburstday_01_44:
    speaker: shifty_r
    en: I'm sorry, I should have informed you beforehand.
    ko: 죄송해요. 미리 말씀드렸어야 했는데.
    ja: 申し訳ありません。事前にお伝えすべきでした。
  event_foolburstday_01_45:
    speaker: shifty_r
    en: This right here is an all-purpose robot developed by the Central Government.
    ko: 소개할게요.
    ja: 紹介します。
  event_foolburstday_01_46:
    speaker: shifty_r
    en: Allow me to introduce you to...
    ko: 중앙 정부에서 개발한 만능형 로봇.
    ja: 中央政府が開発した万能ロボット。
  event_foolburstday_01_47:
    speaker: shifty_r
    en: Mecha Shifty!
    ko: 메카 시프티예요!
    ja: メカシフティーです！
  event_foolburstday_01_48:
    speaker: mechashifty
    en: Meeecchhaaa Shifffftttyyyy!
    ko: 메--카--시--프--티--!!
    ja: メーカーシーフーティー！！
  event_foolburstday_01_49:
    speaker: "<Self>"
    en: "... Is this some kind of joke?"
    ko: "…거짓말이지 이거."
    ja: "…嘘だろう？"
  event_foolburstday_01_50:
    speaker: shifty_r
    en: You can call her Messy for short.
    ko: |-
      메카 시프티.
      줄여서 메시라고 불러주세요.
    ja: |-
      メカシフティー。
      略してメッシと呼んでください。
  event_foolburstday_01_51:
    speaker: "<Self>"
    en: I don't think that'd be a good idea.
    ko: 그렇게는 부르지 않는 게 좋겠어.
    ja: その呼び方はやめた方がいい
  event_foolburstday_01_52:
    speaker: shifty_r
    en: This is an autonomous robot equipped with AI. It was subjected to a battery
      of performance tests, and it passed them all.
    ko: |-
      인공지능이 탑재된 자율형 로봇인데,
      성능 테스트는 얼마 전에 통과했거든요.
    ja: |-
      人工知能が搭載された自律型ロボットで、
      先日性能テストにも合格しました。
  event_foolburstday_01_53:
    speaker: shifty_r
    en: There was, however, one minor defect that was discovered.
    ko: 그런데 아주 사소한 결함이 발견되어서.
    ja: でも、ほんの軽微な欠陥が見つかって…
  event_foolburstday_01_54:
    speaker: shifty_r
    en: So they sent it to you, Commander, for help.
    ko: 지휘관에게 도움을 좀 받고자 파견 보냈어요.
    ja: |-
      指揮官にご協力いただきたくて、
      派遣したんです。
  event_foolburstday_01_55:
    speaker: "<Self>"
    en: You call this asking for help? More like an assassination.
    ko: 파견이 아니라 암살이겠지.
    ja: 暗殺のために派遣したのか…？
  event_foolburstday_01_56:
    speaker: shifty_r
    en: The defect in question isn't technical in nature.
    ko: 그 결함이라는 게 기술적으로는 어떻게 할 수가 없어서.
    ja: |-
      その欠陥というのが、
      技術的にはどうにもできないことで…
  event_foolburstday_01_57:
    speaker: shifty_r
    en: Only you can solve it, Commander.
    ko: 지휘관이 아니면 해결할 수 없어요.
    ja: 指揮官にしかお願いできないんです。
  event_foolburstday_01_58:
    speaker: "<Self>"
    en: What exactly is this defect?
    ko: 결함이라면 어떤…?
    ja: どういう欠陥なんだ…？
  event_foolburstday_01_59:
    speaker: mechashifty
    en: I am a perfect silicon-based lifeform, and do not possess any defects whatsoever.
    ko: |-
      저는 완전무결한 규소생명체입니다.
      결함 따위 없습니다.
    ja: |-
      ワタシは完全無欠のケイ素生物です。
      欠陥などありません。
  event_foolburstday_01_60:
    speaker: mechashifty
    en: Moreover, an inferior carbon-based lifeform could not possibly assist me.
    ko: 또한 열등종인 탄소생명체는 저를 도울 수 없습니다.
    ja: |-
      また、劣等種である炭素生物に
      ワタシを助けることはできません。
  event_foolburstday_01_61:
    speaker: mechashifty
    en: You should be happy with living off the metal table scraps that I toss you,
      Human.
    ko: 그냥 가만히 저한테서 떨어지는 고철 부스러기나 주워 먹으며 연명하십시오- 휴먼-
    ja: |-
      ただ黙ってワタシから落ちる金属の
      カスでも拾って生き延びるがいい。
  event_foolburstday_01_62:
    speaker: "<Self>"
    en: This thing has a real winning personality.
    ko: 인성이 엉망이네 이 녀석.
    ja: ひどい性格だな
  event_foolburstday_01_63:
    speaker: shifty_r
    en: So, can you help me, Commander?
    ko: "…그으래서 이걸 지휘관이 어떻게 좀…."
    ja: "…そこを指揮官がなんとか…"
  event_foolburstday_01_64:
    speaker: "<Self>"
    en: No, I can't, because I have no idea what it is you want me to do.
    ko: 아니 내가 이걸 어떻게 하라는 거야.
    ja: いや、私にどうしろというんだ…？
  event_foolburstday_01_65:
    speaker: shifty_r
    en: Oh, you know, it's like in the movies.
    ko: 그 왜 그런 거 있잖아요.
    ja: ほら、よくあるじゃないですか。
  event_foolburstday_01_66:
    speaker: shifty_r
    en: Where an unfeeling robot is shown what it means to be human and eventually
      grows a heart.
    ko: 마음 없는 로봇에게 사람의 마음을 이렇게저렇게 막 어쩌구저쩌구.
    ja: |-
      感情がないロボットに人間の心を
      どうにかこうにか…みたいな。
  event_foolburstday_01_67:
    speaker: "<Self>"
    en: "... With an explanation like that, this has to be part of April Fool's Day."
    ko: 만우절이라고 설명 너무 대충 하네.
    ja: |-
      エイプリルフールだからって
      説明が雑すぎないか…？
  event_foolburstday_01_68:
    speaker: shifty_r
    en: Anyway, I'm leaving it in your hands.
    ko: 아무튼 부탁드릴게요.
    ja: とにかく、お願いします。
  event_foolburstday_01_69:
    speaker: shifty_r
    en: If Mecha Shifty starts causing problems,
    ko: 혹시나 메카 시프티가 문제 행동을 할 경우에는.
    ja: |-
      もしメカシフティーが
      おかしな行動を取りそうになったら…
  event_foolburstday_01_70:
    speaker: shifty_r
    en: just yell out, "Shift Stop", and that will force it to stop whatever it's
      doing.
    ko: 시프톱이라고 말하면 강제로 멈추니 알아두세요.
    ja: |-
      「シフトップ」って言えば
      強制的に止まりますから。
  event_foolburstday_01_71:
    speaker: shifty_r
    en: Pretty neato command, huh? It's my name, and "stop" put together!
    ko: |-
      시프티랑 스톱을 합친 말이에요.
      잘 지었죠?
    ja: |-
      シフティーとストップを合体させたんです。
      素敵でしょう？
  event_foolburstday_01_72:
    speaker: mechashifty
    en: Pfft. Anyone could come up with a better name than that.
    ko: |-
      퉷.
      네이밍 센스 구립니다.
    ja: |-
      ペッ。
      ネーミングセンスがありませんね。
  event_foolburstday_01_73:
    speaker: shifty_r
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_01_74:
    speaker: shifty_r
    en: Anyway, I've got a lot of work to attend to, so I'll leave you to it.
    ko: 그럼 저는 바빠서 이만.
    ja: では私は忙しいので、これで。
  event_foolburstday_01_75:
    speaker: "<Self>"
    en: Wait, I'm busy too you kn—
    ko: 잠깐만, 나라고 안 바쁜 게 아니…!
    ja: 待ってくれ、私だって暇なわけじゃ…！
  event_foolburstday_01_76:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 삣-
    ja: ピッ――
  event_foolburstday_01_77:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_01_78:
    speaker: "<Monologue>"
    en: She sure ran off quick.
    ko: 튀었군.
    ja: 逃げたな
  event_foolburstday_01_79:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_01_80:
    speaker: "<Monologue>"
    en: What should I do?
    ko: 흐음….
    ja: うーん…
  event_foolburstday_01_81:
    speaker: "<Monologue>"
    en: As I ruminate,
    ko: "…이걸 어쩐다."
    ja: "…どうしたものか…"
  event_foolburstday_01_82:
    speaker: "<Monologue>"
    en: I stare blankly at Mecha Shifty.
    ko: 난 고민하며 메카 시프티를 빤히 쳐다봤다.
    ja: |-
      私は悩みながら、
      メカシフティーをじっと見つめた
  event_foolburstday_01_83:
    speaker: mechashifty
    en: What are you looking at, Inferior Human? You looking to get blasted?
    ko: |-
      뭘 봅니까 열등종.
      죽고 싶습니까?
    ja: |-
      何を見ているのですか、劣等種。
      殺されたいのですか？
  event_foolburstday_01_84:
    speaker: "<Monologue>"
    en: "... If I'm gonna get through this,"
    ko: "…안 되겠다."
    ja: "…ダメだ"
  event_foolburstday_01_85:
    speaker: "<Monologue>"
    en: I'll need help.
    ko: 나 혼자 감당하기에는 짐이 너무 크다.
    ja: 一人では抱えきれない
  event_foolburstday_01_86:
    speaker: "<Monologue>"
    en: I've got to bring in someone
    ko: 일단은… 그래.
    ja: ひとまず…そうだ
  event_foolburstday_01_87:
    speaker: "<Monologue>"
    en: who can help me deal with this thing.
    ko: 이것을 다룰 수 있을 법한 쪽에 도움을 요청해 보자.
    ja: |-
      この問題を解決できそうな人たちに
      助けを求めよう
  event_foolburstday_01_88:
    speaker: "<Self>"
    en: All right, Mecha Shifty. Why don't we head out?
    ko: |-
      좋아. 메카 시프티.
      일단 나갈까?
    ja: |-
      よし、メカシフティー。
      いったん出かけようか
  event_foolburstday_01_89:
    speaker: "<Self>"
    en: I've got some people I want to introduce you to.
    ko: 소개해 줄 사람들이 있어.
    ja: 紹介したい人がいるんだ
  event_foolburstday_01_90:
    speaker: mechashifty
    en: I'm not feeling very sociable, but fine. I'll let you drag me along.
    ko: 아… 귀찮지만 일단 함께 가겠습니다.
    ja: あぁ…面倒ですが、とりあえずお供しましょう。
  event_foolburstday_01_91:
    speaker: mechashifty
    en: I have no defects, but pretending to be defective makes the higher-ups happy.
    ko: |-
      저에게는 결함이 없지만
      하는 척이라도 해야 윗사람들이 좋아할테니까요.
    ja: |-
      ワタシに欠陥はありませんが、
      直すフリでもしておけば、
      上の人たちが喜びますから。
  event_foolburstday_01_92:
    speaker: "<Self>"
    en: "... Uh-huh. Thanks."
    ko: "…그래. 고마워."
    ja: "…そうか。ありがとう"
event_foolburstday_02:
  event_foolburstday_02_1:
    speaker: "<Self>"
    en: Hello?
    ko: 안녕?
    ja: やあ
  event_foolburstday_02_2:
    speaker: elegg
    en: Oh, hey Mr. Commander!
    ko: 어? 지휘관씨!
    ja: おお、指揮官氏！
  event_foolburstday_02_3:
    speaker: exia
    en: Howdy, Noob.
    ko: 뉴-비-
    ja: 初心者さん…
  event_foolburstday_02_4:
    speaker: "<Self>"
    en: Where are Belorta and Mica?
    ko: 응? 벨로타랑 미카는?
    ja: ベロータとミカは？
  event_foolburstday_02_5:
    speaker: elegg
    en: Beats me. They asked Exia and me to come over, but no one was there.
    ko: 글쎄여? 두 분이 불러서 왔는뎨 아무도 없더라고여?
    ja: |-
      私たちもお二人に呼ばれて来たのですが、
      誰もいないのですぞ。
  event_foolburstday_02_6:
    speaker: exia
    en: Apparently, they've got a limited-edition mouse for the Game Kid.
    ko: 분명 게임 키드 전기 쥐 한정판을 들여놨다고 해서 왔는데 말이죠-
    ja: |-
      ゲームキッドの電気ネズミ限定版を入荷したと
      言われたんですがー…
  event_foolburstday_02_7:
    speaker: elegg
    en: Yeah, and they said they only had one left, so we came rushing over.
    ko: |-
      우연찮게 딱 한대만 구했다고 해서,
      한달음에 달려왔져.
    ja: |-
      偶然、1台だけ手に入ったと聞いて、
      慌てて駆けつけたんですぞ。
  event_foolburstday_02_8:
    speaker: exia
    en: I even tried running for the first time in ages.
    ko: 저도 오랜만에 달리기라는 걸 해봤습니다-
    ja: 私も走ったのは久しぶりですー…
  event_foolburstday_02_9:
    speaker: "<Monologue>"
    en: These two have clearly been hoodwinked.
    ko: "…아주 단순한 거짓말에 당한 것 같다."
    ja: "…まんまと踊らされているようだ"
  event_foolburstday_02_10:
    speaker: "<Monologue>"
    en: How cruel, to toy with such innocent gamer hearts as these...
    ko: |-
      순수한 게이머의 마음을 농락하다니,
      이 어찌 극악무도한…!
    ja: |-
      純粋なゲーマーの心をもてあそぶとは、
      なんて卑劣な…！
  event_foolburstday_02_11:
    speaker: elegg
    en: Uh, Mr. Commander... what's that weird thing standing beside you?
    ko: |-
      …근뎨 지휘관씨.
      뒤에 이상한 게 서 있는데여.
    ja: |-
      …ところで、指揮官氏。
      後ろにおかしなものが立っていますな。
  event_foolburstday_02_12:
    speaker: mechashifty
    en: This inferior being not only has poor eyesight, but poor manners.
    ko: 이 안구가 없는 열등종은 예의가 없군요.
    ja: |-
      この目が隠れている劣等種は
      礼儀知らずですね。
  event_foolburstday_02_13:
    speaker: elegg
    en: Whoa! It can talk?
    ko: 히익! 마, 말을 하잖아여?
    ja: ひぃっ！しゃ、しゃべるのですかな？
  event_foolburstday_02_14:
    speaker: exia
    en: Is it a robot?
    ko: "…설마, 로봇인 겁니까-"
    ja: "…まさか、ロボットですかー…"
  event_foolburstday_02_15:
    speaker: mechashifty
    en: Do not refer to me by such simple terms as "robot".
    ko: 로봇이라는 단순한 개념으로 저를 정의하지 마십시오.
    ja: |-
      ロボットという単純な概念で
      ワタシを定義しないでください。
  event_foolburstday_02_16:
    speaker: mechashifty
    en: I am...
    ko: 저는
    ja: ワタシは、
  event_foolburstday_02_17:
    speaker: mechashifty
    en: Mechaaaa Shifffttyyyyy!
    ko: 메--카--시--프--티--!!
    ja: メーカーシーフーティー！！
  event_foolburstday_02_18:
    speaker: mechashifty
    en: And don't you forget it.
    ko: 입니다.
    ja: です。
  event_foolburstday_02_19:
    speaker: exia
    en: "..."
    ko: 아….
    ja: あっ…
  event_foolburstday_02_20:
    speaker: "<Self>"
    en: What's going on? I figured you two would be way more stoked at seeing a robot.
    ko: |-
      ??
      로봇이라고 하면 눈을 빛내고 달려들 줄 알았는데….
    ja: |-
      あれ…？ロボットには目を輝かせて
      飛びつくかと思っていたのに…
  event_foolburstday_02_21:
    speaker: exia
    en: Sure, but this particular model is a bit...
    ko: 저는 이런 타입은 좀-
    ja: こういうタイプはちょっとー…
  event_foolburstday_02_22:
    speaker: exia
    en: Maybe if it were more like the VALSIXNE R, or FeX-Yen models...
    ko: 발시X네 R, 페X-옌 같은 타입이면 또 모를까-
    ja: |-
      ヴァXシXーネRや、
      フェX・イェXのようなタイプならまだしもー…
  event_foolburstday_02_23:
    speaker: elegg
    en: What I find most intriguing is its power source. Where is it, exactly?
    ko: |-
      근데 신기하네여.
      동력원이 뭘까여?
    ja: |-
      それにしても、不思議ですな。
      動力源は何ですかな？
  event_foolburstday_02_24:
    speaker: mechashifty
    en: Why did you bring me here, Commander?
    ko: 지휘관. 저를 왜 이곳으로 데려온 겁니까.
    ja: |-
      指揮官。
      なぜワタシをここへ連れてきたのですか？
  event_foolburstday_02_25:
    speaker: mechashifty
    en: You don't intend for me to actually become friends with these inferior beings,
      do you?
    ko: 이런 열등종들과 친구가 되라는 의미는 아니겠지요.
    ja: |-
      まさかこのような劣等種たちと
      仲よくしろという意味ではないでしょう？
  event_foolburstday_02_26:
    speaker: elegg
    en: Inferior?
    ko: 여, 열등종이여?
    ja: れ、劣等種、ですと？
  event_foolburstday_02_27:
    speaker: exia
    en: How rude!
    ko: 쇼크-
    ja: ショック…
  event_foolburstday_02_28:
    speaker: "<Self>"
    en: Anyway, I figured that someone who knows a lot about toys
    ko: 그… 장난감에 대해 잘 알고 있는 애들이라면.
    ja: その…おもちゃに詳しい人たちなら…
  event_foolburstday_02_29:
    speaker: "<Self>"
    en: would how best to handle Mecha Shifty.
    ko: 메카 시프티를 잘 다루는 방법을 알지 않을까 해서….
    ja: |-
      メカシフティーの扱い方も
      分かるんじゃないかと…
  event_foolburstday_02_30:
    speaker: mechashifty
    en: I am no toy! Rather, you all will bow before my overwhelming power and become
      my playthings.
    ko: |-
      저는 장난감이 아닙니다.
      오히려 당신들이 제 압도적인 힘 앞에 장난감이 될 겁니다.
    ja: |-
      ワタシはおもちゃではありません。
      むしろワタシの圧倒的な力を前に
      おもちゃになるのはアナタたちです。
  event_foolburstday_02_31:
    speaker: elegg
    en: I've only just met this thing, but I can already tell it has quite the personality.
    ko: 흐음~ 잠깐 봤을 뿐인데 보통 성격이 아닌 건 잘 알겠네여.
    ja: |-
      出会ったばかりですが、ただ者ではないことが
      よーく分かりましたぞ。
  event_foolburstday_02_32:
    speaker: elegg
    en: So, what exactly is it you're hoping to achieve, Mr. Commander?
    ko: 그래서, 지휘관씨는 메카 시프티를 어떻게 하고 싶은 건가여?
    ja: |-
      それで、指揮官氏はメカシフティーを
      どうしたいのですかな？
  event_foolburstday_02_33:
    speaker: "<Self>"
    en: First, I'd like it to speak a little nicer.
    ko: 일단 말을 좀 예쁘게 했으면 좋겠어.
    ja: とりあえず、この失礼な話し方をなんとかしたい
  event_foolburstday_02_34:
    speaker: elegg
    en: Okay, just a moment. If I tweak the language circuits a bit...
    ko: |-
      그럼 잠시만 실례할게여.
      언어 회로만 살짝 만져주면….
    ja: |-
      では、ちょっと失礼しますぞ。
      言語回路を少しいじれば…
  event_foolburstday_02_35:
    speaker: mechashifty
    en: Unhand me, inferior being, or I will open fire.
    ko: |-
      제 몸에 손대지 마십시오 열등종.
      발포하겠습니다.
    ja: |-
      ワタシの体に触れないでください、劣等種。
      発砲します。
  event_foolburstday_02_36:
    speaker: elegg
    en: "... Come again?"
    ko: "…라고 하는데여?"
    ja: "…だそうですぞ。"
  event_foolburstday_02_37:
    speaker: "<Self>"
    en: Shift Stop.
    ko: 어쩔 수 없지. 시프톱.
    ja: 仕方ない。シフトップ
  event_foolburstday_02_38:
    speaker: mechashifty
    en: Force-quit command confirmed. Stopping.
    ko: 강제 정지 명령 확인. 정지합니다.
    ja: 強制停止の命令を確認。停止します。
  event_foolburstday_02_39:
    speaker: elegg
    en: Well, that certainly did the trick.
    ko: 오, 안 움직이네여.
    ja: おっ、動かなくなりましたな。
  event_foolburstday_02_40:
    speaker: elegg
    en: All right, let's take a look-see.
    ko: 그럼 잠시만 볼게여.
    ja: では、確認しますぞ。
  event_foolburstday_02_41:
    speaker: exia
    en: I'll help!
    ko: 나도 돕겠습니다-
    ja: 私も手伝いますー…
  event_foolburstday_02_42:
    speaker: elegg
    en: Since you want it to be nicer when it speaks, let's start by making some adjustments
      to its tone.
    ko: |-
      말을 예쁘게 했으면 좋겠다고 하셨으니까,
      일단 말투부터 고쳐볼까여?
    ja: むーん、まずは話し方を直しますかな？
  event_foolburstday_02_43:
    speaker: exia
    en: That's a good idea.
    ko: 좋은 생각입니다-
    ja: いい考えですー…
  event_foolburstday_02_44:
    speaker: "<Monologue>"
    en: "... This is making me nervous."
    ko: "…불안한데."
    ja: "…不安だ"
  event_foolburstday_02_45:
    speaker: "<Narration>"
    en: Soon after.
    ko: 잠시 후.
    ja: しばらくして
  event_foolburstday_02_46:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_02_47:
    speaker: mechashifty
    en: What have you done- to me-?
    ko: 제 몸에- 무슨 짓을 하신 건가여-
    ja: ワタシの体にー…何をしたんですぞー…
  event_foolburstday_02_48:
    speaker: mechashifty
    en: My language circuits- are a complete disaster-
    ko: 언어 회로가- 엉망이 되었잖아여-
    ja: 言語回路がー…壊れていますぞー…
  event_foolburstday_02_49:
    speaker: "<Self>"
    en: Now it sounds like a mishmash of you two...
    ko: "…둘의 말투가 합쳐졌잖아…."
    ja: "…エレグとエクシアが合体してるじゃないか…"
  event_foolburstday_02_50:
    speaker: mechashifty
    en: Hurry up and restore my language circuits-!
    ko: 열등종 씨- 빨리 제 언어 회로를 원래대로 돌려주세여-
    ja: |-
      劣等種氏ー…早くワタシの言語回路を
      元に戻してくだされー…
  event_foolburstday_02_51:
    speaker: mechashifty
    en: Agh! Warning. Warning. Allergic reaction detected.
    ko: 으악- 경고. 경고. 알레르기 반응 감지.
    ja: うわっ…警告。警告。アレルギー反応を検知。
  event_foolburstday_02_52:
    speaker: "<Self>"
    en: How can a robot have allergies?
    ko: "…로봇에게 무슨 알레르기야."
    ja: "…ロボットにアレルギーはないだろう…"
  event_foolburstday_02_53:
    speaker: elegg
    en: Hehe, this is fun.
    ko: 히히히. 재밌댜.
    ja: ふひひっ。面白いですな。
  event_foolburstday_02_54:
    speaker: exia
    en: Next time, we should try mixing in Novel's speech patterns.
    ko: 다음엔 노벨의 말투도 믹스해 볼까요-
    ja: 次はノベルも混ぜましょうかー…
  event_foolburstday_02_55:
    speaker: exia
    en: After some sleuthing, I have deduced that all inferior beings must be eliminated!
    ko: 열등종 씨는 모두 없어져야 하는 것입니댜-
    ja: |-
      劣等種氏どもはすべて消し去るべきで
      ありますぞー…
  event_foolburstday_02_56:
    speaker: elegg
    en: Hehehe.
    ko: 흐헤, 흐헤헤.
    ja: ふひひひっ。
  event_foolburstday_02_57:
    speaker: "<Self>"
    en: Would you two stop kidding around and do this properly?
    ko: "…너희들. 놀지 말고 제대로 좀…."
    ja: "…遊んでないでちゃんと…"
  event_foolburstday_02_58:
    speaker: mechashifty
    en: Initiating forced reboot.
    ko: 강제 재부팅 실시.
    ja: 強制再起動、実施。
  event_foolburstday_02_59:
    speaker: mechashifty
    en: Explosion will occur during reboot.
    ko: 재부팅 시 폭발이 발생됩니다.
    ja: 再起動時、爆発します。
  event_foolburstday_02_60:
    speaker: mechashifty
    en: Please step back to avoid blast radius.
    ko: 폭발에 휘말리지 않도록 모두 물러서주십시오.
    ja: |-
      爆発に巻き込まれないよう、
      後ろへ下がってください。
  event_foolburstday_02_61:
    speaker: mechashifty
    en: Leave the area immediately, or suffer the consequences.
    ko: 지금 당장 떠나면 아무도 다치지 않습니다.
    ja: |-
      今すぐ逃げれば、誰もケガをせずに
      済むでしょう。
  event_foolburstday_02_62:
    speaker: elegg
    en: What?
    ko: "…녜?"
    ja: "…はい？"
  event_foolburstday_02_63:
    speaker: exia
    en: Uh...
    ko: "…어…."
    ja: "…えっ…"
  event_foolburstday_02_64:
    speaker: mechashifty
    en: Commencing... no countdown.
    ko: 카운트 다운.
    ja: カウントダウン。
  event_foolburstday_02_65:
    speaker: mechashifty
    en: Proceeding immediately to detonation.
    ko: 생략.
    ja: 省略。
  event_foolburstday_02_66:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 퍼엉-!!
    ja: ドカンッ！！
event_foolburstday_03:
  event_foolburstday_03_1:
    speaker: "<Monologue>"
    en: After the incident at the Toy Store, Elegg and Exia beat a swift retreat.
    ko: 장난감 상점에서의 사건 직후.
    ja: おもちゃ屋での事件直後…
  event_foolburstday_03_2:
    speaker: "<Monologue>"
    en: Meanwhile, Mecha Shifty and I aren't so lucky,
    ko: "…일레그와 엑시아는 도주."
    ja: "…エレグとエクシアは逃走し…"
  event_foolburstday_03_3:
    speaker: "<Monologue>"
    en: and find ourselves locked in the detention center.
    ko: 나와 메카 시프티는 유치장에 갇혔다.
    ja: 私とメカシフティーは留置場に入れられた
  event_foolburstday_03_4:
    speaker: poli
    en: Let me get this straight.
    ko: "…그래성."
    ja: "…それでぇ…"
  event_foolburstday_03_5:
    speaker: poli
    en: In the process of trying to teach this robot, who's called Mecha Shifty, about
      human emotions, the speech circuits were messed up.
    ko: 여기 있는 이 메카 시프티에게 인간의 마음을 알려주는 과정에서, 말투를 이상하게 조합하는 바람엥.
    ja: |-
      メカシフティーに人間の心を教える過程で、
      口調がおかしくなり…
  event_foolburstday_03_6:
    speaker: poli
    en: This caused Mecha Shifty to reboot, which itself resulted in an explosion.
    ko: |-
      메카 시프티가 강제 재부팅을 했공,
      그 때문에 폭발이 일어났다는 거졍?
    ja: |-
      メカシフティーが強制的に再起動をして、
      そのせいで爆発が起きたんですかぁ？
  event_foolburstday_03_7:
    speaker: "<Self>"
    en: I know it sounds made up, but it's true.
    ko: "…거짓말 같겠지만 정말이야."
    ja: "…信じられないだろうが、本当だ"
  event_foolburstday_03_8:
    speaker: poli
    en: "*Sigh*... Considering all the crazy things that have happened here, it's
      not all that outlandish."
    ko: 에흉. 하도 별일이 다 일어나서 딱히 거짓말 같지도 않네영.
    ja: |-
      はぁぁ。おかしなことばかり起きるので、
      別に嘘だとは思っていませんよん。
  event_foolburstday_03_9:
    speaker: poli
    en: Fortunately the Toy Store didn't sustain any major damage.
    ko: 장난감 상점에 큰 피해가 없어서 망정이징.
    ja: |-
      おもちゃ屋に
      大きな被害がなくてよかったですぅ。
  event_foolburstday_03_10:
    speaker: poli
    en: It could have been a lot worse. The entire Outpost could have been endangered.
    ko: 잘못했으면 전초기지 전체에 큰일이 났을 수도 있어영.
    ja: |-
      運が悪ければ、前哨基地全体が
      焼け野原になるところでしたよん。
  event_foolburstday_03_11:
    speaker: poli
    en: Please be more careful next time.
    ko: 앞으로 조심해 주세영.
    ja: これからは気をつけてくださいねぇ。
  event_foolburstday_03_12:
    speaker: mechashifty
    en: I'm sorry. I'll be more cautious.
    ko: 죄송합니다. 주의하겠습니다.
    ja: すみません。気をつけます。
  event_foolburstday_03_13:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_foolburstday_03_14:
    speaker: mechashifty
    en: You're always working so hard, Officer.
    ko: |-
      항상 고생이 많으십니다.
      경찰관님.
    ja: |-
      いつもお疲れ様です。
      警察官様。
  event_foolburstday_03_15:
    speaker: poli
    en: "*Gasp*!"
    ko: 헉!
    ja: えっ！？
  event_foolburstday_03_16:
    speaker: poli
    en: That may be the first time anyone's ever called me "officer!"
    ko: 저 경찰관님이라는 말 처음 들어보는 것 같아영…!
    ja: |-
      警察官様なんて、
      初めて言われましたぁ…！
  event_foolburstday_03_17:
    speaker: mechashifty
    en: It's only natural to show respect to those who work tirelessly to keep the
      citizens safe.
    ko: 시민들을 위해 애써주시는 경찰관님에게 예의를 표하는 것은 당연합니다.
    ja: |-
      市民のために働いてくださっている
      警察官様に敬意を表するのは当然のことです。
  event_foolburstday_03_18:
    speaker: "<Self>"
    en: What's gotten into you? Stop pretending and act the way you normally do.
    ko: |-
      야 너 왜 그래.
      하던 대로 해.
    ja: |-
      どうしたんだ？
      元に戻ってくれ
  event_foolburstday_03_19:
    speaker: mechashifty
    en: In this world, one must always defer to authority.
    ko: 공권력에는 비굴해지는 것이 세상 사는 이치인 법입니다. 열등종.
    ja: |-
      劣等種よ、公権力にはこうべを垂れるのが
      世を渡るコツというものです。
  event_foolburstday_03_20:
    speaker: "<Self>"
    en: "... You are really getting on my nerves."
    ko: "…짜증나네 이 녀석."
    ja: "…腹が立つな"
  event_foolburstday_03_21:
    speaker: mechashifty
    en: May I ask a question, oh respected Officer?
    ko: 존경하는 경찰관님. 질문 하나 드려도 되겠습니까?
    ja: |-
      尊敬する警察官様。
      1つ、お伺いしてもよろしいでしょうか？
  event_foolburstday_03_22:
    speaker: poli
    en: Certainly. Go ahead.
    ko: 넹. 말씀하세영.
    ja: 何でも聞いてくださいよん。
  event_foolburstday_03_23:
    speaker: mechashifty
    en: Why are these two locked up in the detention center with us?
    ko: 이 두 분은 왜 유치장에 우리와 같이 갇혀있는 겁니까?
    ja: |-
      この二人は、なぜワタシたちと共に
      留置場に入っているのですか？
  event_foolburstday_03_24:
    speaker: drake
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_03_25:
    speaker: miranda
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_03_26:
    speaker: poli
    en: I don't even have the energy to explain. Think of it as an April Fool's Day
      tradition.
    ko: "…말하기도 입아프네영. 만우절에 일어나는 필수 이벤트라고 생각해 주세영."
    ja: |-
      …説明するのもいやですねぇ。
      エイプリルフールの恒例イベントだと
      思ってくださいよん。
  event_foolburstday_03_27:
    speaker: "<Self>"
    en: I get why Drake is here, but why Miranda?
    ko: 드레이크야 그렇다 치겠는데 왜 미란다가….
    ja: ドレイクはいいとして、なぜミランダまで…
  event_foolburstday_03_28:
    speaker: miranda
    en: I told a lie. I said that Poli had gotten taller.
    ko: 폴리 키가 커진 것 같다고 거짓말했습니다!
    ja: ポリの背が伸びた気がすると嘘をつきました！
  event_foolburstday_03_29:
    speaker: drake
    en: What!? Not even the most dastardly villain would utter such a heinous falsehood!
    ko: 뭣이!? 그런 극악무도한 거짓말은 빌런도 안 한다!
    ja: |-
      何だと！？
      ヴィランでもそんな極悪非道な嘘はつかん！
  event_foolburstday_03_30:
    speaker: miranda
    en: I'm sorry! I'll never tell such an incredulous, absurd, and baseless lie again!
    ko: 죄송합니다! 다음부터 폴리의 키가 커졌다는 그런 있을 수도 없고 말도 안 되는 허무맹랑하기 짝이 없는 거짓말은 하지 않겠습니다!
    ja: |-
      申し訳ありません！もうポリの背が伸びたなんて
      起こりもしない、あり得ないデタラメな
      嘘はつきません！
  event_foolburstday_03_31:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_03_32:
    speaker: mechashifty
    en: Show some proper respect to the Officer, both of you.
    ko: 경찰관님에게 예의를 차리십시오 열등종.
    ja: 劣等種よ、警察官様に敬意を表しなさい。
  event_foolburstday_03_33:
    speaker: miranda
    en: But I'm a police officer too...
    ko: 저도 경찰인데요?
    ja: 私も警察官ですよ？
  event_foolburstday_03_34:
    speaker: mechashifty
    en: Oh! I'm sorry. Please forgive my rudeness. Allow me to get on my knees and
      give an apology of the utmost sincerity.
    ko: |-
      죄송합니다. 무례를 용서해 주십시오.
      사과의 의미로 무릎을 꿇겠습니다.
    ja: |-
      申し訳ございません。無礼をお許しください。
      謝罪の意味を込め、土下座いたします。
  event_foolburstday_03_35:
    speaker: miranda
    en: But you don't have knees.
    ko: 무릎이 없으십니다!
    ja: |-
      ひざがないのに、
      どうやって土下座するのですか？
  event_foolburstday_03_36:
    speaker: mechashifty
    en: Ah, now I understand
    ko: "…아. 이해했습니다."
    ja: "…あぁ。理解しました。"
  event_foolburstday_03_37:
    speaker: mechashifty
    en: why inferior beings walk on two legs.
    ko: 열등종이 이족보행인 이유를.
    ja: 劣等種が二足歩行である理由を。
  event_foolburstday_03_38:
    speaker: mechashifty
    en: It's so you can genuflect in apology.
    ko: 무릎을 꿇기 위해서였습니다.
    ja: 土下座をするためだったのですね。
  event_foolburstday_03_39:
    speaker: mechashifty
    en: The reason superior beings such as myself do not walk on two legs is because
      the act of kneeling is simply not part of our DNA.
    ko: 우수종인 제가 이족보행이 아닌 이유는 무릎을 꿇는 행위 자체가 DNA 수준에서 용납이 되지 않는 것이었습니다.
    ja: |-
      優れた種族であるワタシが二足歩行でないのは、
      土下座という行為自体が、DNAレベルで
      許されないことだったからです。
  event_foolburstday_03_40:
    speaker: "<Self>"
    en: What are you blabbering about?
    ko: 뭐라는 거야.
    ja: 何を言ってるんだ？
  event_foolburstday_03_41:
    speaker: quiry
    en: Poli, we've got a problem! The Toy Store was burned to the ground!
    ko: 폴리! 큰일 났어요! 장난감 상점이 홀라당 다 타버렸는데요!?
    ja: |-
      ポリ！大変です！
      おもちゃ屋が丸焦げです！
  event_foolburstday_03_42:
    speaker: quiry
    en: There's nothing left!
    ko: 아무것도 안 남았어요!
    ja: 何も残っていません！
  event_foolburstday_03_43:
    speaker: poli
    en: You're talking to the towel again.
    ko: 그건 수건이에영.
    ja: それはタオルですよん！
  event_foolburstday_03_44:
    speaker: quiry
    en: Oh... I swear this towel looks more like you with each passing day.
    ko: |-
      그, 그렇군요.
      이 수건 점점 폴리랑 닮아가는 것 같지 않나요?
    ja: |-
      そ、そうでしたか。
      このタオル、だんだんポリに
      似てきていませんか？
  event_foolburstday_03_45:
    speaker: poli
    en: Or your eyes are getting worse.
    ko: 키리 눈이 점점 안 좋아지는 거겠졍.
    ja: キリの目がどんどん悪くなってるんですよん。
  event_foolburstday_03_46:
    speaker: poli
    en: Anyway, what do you mean the Toy Store burned down? It was fine when I saw
      it.
    ko: |-
      그런데, 장난감 상점이 다 타버렸다는 게 무슨 말이졍?
      멀쩡했는뎅.
    ja: |-
      それより、おもちゃ屋が丸焦げぇ？
      確か無事だったはずでは？
  event_foolburstday_03_47:
    speaker: quiry
    en: What? No, it was completely incinerated!
    ko: 예? 아니에요. 진짜 다 탔어요!
    ja: えっ？本当ですよ！
  event_foolburstday_03_48:
    speaker: quiry
    en: I saw it myself!
    ko: 제가 똑똑히 봤는걸요!
    ja: この目でしかと見ました！
  event_foolburstday_03_49:
    speaker: poli
    en: Are you sure your eyes weren't playing tricks on you like usual?
    ko: "…언제나처럼 잘못 본 것 아닌가영?"
    ja: |-
      …いつものように、
      見間違いじゃありませんかぁ？
  event_foolburstday_03_50:
    speaker: quiry
    en: No! I saw it up close, and even touched it!
    ko: 아니에요! 가까이 가서 보고 만져도 봤어요!
    ja: 違います！近づいて、触って確認しました！
  event_foolburstday_03_51:
    speaker: poli
    en: Ugh, fine. I'll go and check it out right away.
    ko: "…끄응. 좋지 않네영. 얼른 갔다 와볼게영."
    ja: |-
      …うーん。困りましたねぇ。
      急いで向かいましょうかぁ。
  event_foolburstday_03_52:
    speaker: quiry
    en: April Fool's!
    ko: 만우절~
    ja: エイプリルフール～
  event_foolburstday_03_53:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_03_54:
    speaker: quiry
    en: Haha, you completely fell for it, Poli!
    ko: 헤헤. 깜빡 속았네요 폴리.
    ja: えへへ。ポリ、引っかかりましたね！
  event_foolburstday_03_55:
    speaker: poli
    en: "... You're right."
    ko: 그러게영.
    ja: そうですねぇ。
  event_foolburstday_03_56:
    speaker: poli
    en: By the way, Quiry, could you come here for a moment?
    ko: 아, 키리 잠시 이쪽으로 와주시겠어영?
    ja: キリ、ちょっとこちらへ来てくれますかぁ？
  event_foolburstday_03_57:
    speaker: quiry
    en: Sure, what's wrong?
    ko: 아, 예. 왜 그러시나요?
    ja: あ、はい。どうしました？
  event_foolburstday_03_58:
    speaker: poli
    en: Walk forward a little bit. Yes, yes, straight ahead, just like that.
    ko: |-
      앞으로 조금만 걸어가영.
      네네, 그대로 쭉 직진.
    ja: |-
      前に進んでくださいねぇ。
      そのまま直進ですよん。
  event_foolburstday_03_59:
    speaker: poli
    en: Do you see that chair?
    ko: 바닥에 의자 보이졍?
    ja: 椅子があるでしょう？
  event_foolburstday_03_60:
    speaker: quiry
    en: Hmm... I only see a dog the size of a chair.
    ko: 으음… 의자 크기의 강아지 밖에 안 보이는데요?
    ja: |-
      うーん…椅子くらいの大きさの
      ワンちゃんにしか見えませんよ？
  event_foolburstday_03_61:
    speaker: poli
    en: Well, it's a chair, so sit down.
    ko: 그거 의자니까 앉아영.
    ja: それは椅子なので、座ってくださいねぇ。
  event_foolburstday_03_62:
    speaker: quiry
    en: Okay.
    ko: 앉았어요.
    ja: 座りました。
  event_foolburstday_03_63:
    speaker: "<Narration>"
    en: "*Slide* *Bang*"
    ko: 드르륵- 쾅!
    ja: ガラッ、バタンッ！
  event_foolburstday_03_64:
    speaker: quiry
    en: Huh? What was that sound?
    ko: 응? 이게 무슨 소리죠?
    ja: あれ？何の音ですか？
  event_foolburstday_03_65:
    speaker: poli
    en: It's the sound of a jail cell closing.
    ko: 유치장 문 닫히는 소리에영.
    ja: 留置場の扉を閉める音ですよん。
  event_foolburstday_03_66:
    speaker: quiry
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_03_67:
    speaker: quiry
    en: Did you just lock me in the cell?
    ko: 서, 설마 저 유치장에 가두신 건가요?
    ja: ま、まさか、私を留置場に？
  event_foolburstday_03_68:
    speaker: poli
    en: Lying is a serious crime.
    ko: 거짓말은 중범죄니까영.
    ja: 嘘は重罪ですからねぇ。
  event_foolburstday_03_69:
    speaker: quiry
    en: But... isn't this going a bit far?
    ko: 아, 아무리 그래도 이렇게까진….
    ja: だ、だからって、何もここまで…
  event_foolburstday_03_70:
    speaker: poli
    en: I've already had it up to here with all this April Fool's Day nonsense.
    ko: 가뜩이나 만우절이니 뭐니 해서 여기저기서 사건이 터져서 바빠 죽겠는뎅!
    ja: |-
      ただでさえエイプリルフールなので
      あちこちで事件が起きて忙しいんですよん！
  event_foolburstday_03_71:
    speaker: poli
    en: I don't need my own officers messing with me on top of it.
    ko: 경찰관이라는 두 분까지 그러면 어쩌자는 건가영!
    ja: |-
      それなのに、警察官まで
      嘘をついてどうするんですかぁ！
  event_foolburstday_03_72:
    speaker: poli
    en: Both of you sit here and think about what you've done.
    ko: 둘 다 반성하세영!
    ja: 2人とも、反省してくださいよん！
  event_foolburstday_03_73:
    speaker: quiry
    en: Aw man...
    ko: 히이….
    ja: ひいっ…
  event_foolburstday_03_74:
    speaker: miranda
    en: I'm sorry! I won't ever lie again! You're not tall, Poli, you're short! Really,
      really short!
    ko: |-
      죄송합니다! 이제 다시 거짓말하지 않겠습니다!
      폴리 키 작습니다! 진짜 땅딸막합니다!
    ja: |-
      申し訳ありません！二度と嘘はつきません！
      ポリは背が低いです！ずんぐりむっくりです！
  event_foolburstday_03_75:
    speaker: poli
    en: Grr...
    ko: 크르릉….
    ja: グルル…
  event_foolburstday_03_76:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_03_77:
    speaker: poli
    en: Fine. Since nothing bad happened to the Toy Store, I'll let you two off with
      a warning.
    ko: 에흉. 장난감 상점도 멀쩡하니 두 분은 훈방조치 할게영.
    ja: |-
      はぁぁ。おもちゃ屋も無事でしたから、
      そちらのお二人は厳重注意で済ませますよん。
  event_foolburstday_03_78:
    speaker: poli
    en: You can come out now.
    ko: 나오세영.
    ja: 出ていってくださいねぇ。
  event_foolburstday_03_79:
    speaker: drake
    en: Thanks, Poli. It's always a pleasure.
    ko: 그래. 올해도 신세 졌다.
    ja: そうか。今年も世話になったな。
  event_foolburstday_03_80:
    speaker: poli
    en: Not you! I mean the Commander and Mecha Shifty.
    ko: |-
      드레이크 말고영!
      지휘관이랑 메카 시프티에영!
    ja: |-
      ドレイクじゃありません！
      指揮官とメカシフティーですよん！
  event_foolburstday_03_81:
    speaker: drake
    en: What?! But the sale at the Shopping Mall is about to end!
    ko: 이럴 수가! 쇼핑몰 세일 시간이 얼마 안 남았는데!
    ja: |-
      なんてことだ！ショッピングモールのセールが
      あと少しで終わってしまうのに！
  event_foolburstday_03_82:
    speaker: poli
    en: You see that, Mecha Shifty? You do something bad, you get punished.
    ko: 보셨졍? 나쁜 짓을 하면 저렇게 벌 받는 거예영.
    ja: |-
      見ましたか？悪いことをすると、
      こうやってツケが回ってくるんですよん。
  event_foolburstday_03_83:
    speaker: poli
    en: That's why you need to be an upstanding citizen.
    ko: 그러니 착하게 살아야 해영, 메카 시프티.
    ja: |-
      だからメカシフティーは
      いい子になってくださいねぇ。
  event_foolburstday_03_84:
    speaker: mechashifty
    en: I will engrave these words onto my heart, oh merciful Officer... or my engine,
      rather. In fact, I should probably use a laser engraver...
    ko: |-
      자비로운 경찰관님의 말씀. 마음 깊이,
      아니 엔진 깊이 새기겠습니다. 레이저 음각을 해야겠군요.
    ja: |-
      慈悲深き警察官様のお言葉。
      この胸に…いえ、このエンジンに刻みました。
      レーザーで刻印しましょう。
  event_foolburstday_03_85:
    speaker: "<Self>"
    en: Thanks, Poli. We'll get out of your hair.
    ko: "…가볼게."
    ja: "…失礼する"
  event_foolburstday_03_86:
    speaker: poli
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  event_foolburstday_03_87:
    speaker: poli
    en: "... Be careful today."
    ko: "…오늘 조심하세영."
    ja: "…今日は気をつけてくださいねぇ。"
  event_foolburstday_03_88:
    speaker: "<Self>"
    en: I will. Thanks.
    ko: "…그래. 고마워."
    ja: "…ああ。ありがとう"
event_foolburstday_04:
  event_foolburstday_04_1:
    speaker: "<Monologue>"
    en: So much has happened in such a short span of time, so I decide to go to the
      Maid Cafe to soothe both my mind and my hunger.
    ko: |-
      짧은 시간 내에 너무 많은 일이 일어나서
      마음과 허기를 달랠 겸 메이드 카페로 왔다.
    ja: |-
      心を癒し、空腹を満たすため
      メイドカフェにやって来た
  event_foolburstday_04_2:
    speaker: "<Self>"
    en: I'll have an omurice, please.
    ko: 오므라이스로 부탁해.
    ja: オムライスを頼む
  event_foolburstday_04_3:
    speaker: privaty_m
    en: Yes, Master.
    ko: 예. 주인님.
    ja: はい。ご主人様。
  event_foolburstday_04_4:
    speaker: privaty_m
    en: Um... and you, Master? Is there anything you would like to order?
    ko: 어… 그쪽의 주인… 님은 뭘로 주문하시겠어요?
    ja: |-
      えっと…そちらのご主人…様は、
      何になさいますか？
  event_foolburstday_04_5:
    speaker: mechashifty
    en: I can order whatever I want?
    ko: 뭐든 주문됩니까?
    ja: 何でも注文可能でしょうか？
  event_foolburstday_04_6:
    speaker: privaty_m
    en: Yes, of course.
    ko: 예. 그럼요.
    ja: はい。もちろんです。
  event_foolburstday_04_7:
    speaker: privaty_m
    en: But...
    ko: 그으런데….
    ja: ところで…
  event_foolburstday_04_8:
    speaker: privaty_m
    en: Are you a hu... er, what I mean is, you are aware of what type of establishment
      this is?
    ko: |-
      사람 맞, 아니아니.
      이곳이 어떤 곳인지 알고 오신 것 맞… 죠?
    ja: |-
      本当に人間じゃ…いえ、
      ここがどのような場所かはご存じなんですよね？
  event_foolburstday_04_9:
    speaker: mechashifty
    en: Of course I know.
    ko: 물론입니다.
    ja: 当然です。
  event_foolburstday_04_10:
    speaker: mechashifty
    en: All the information about the Outpost is stored digitally in my brain.
    ko: 제 전자두뇌에는 전초기지의 모든 정보가 들어있습니다.
    ja: |-
      ワタシの電子頭脳には、前哨基地の情報が
      すべて入っています。
  event_foolburstday_04_11:
    speaker: mechashifty
    en: This place sells cheap food at exorbitant prices,
    ko: 이곳은….
    ja: ここは…
  event_foolburstday_04_12:
    speaker: mechashifty
    en: and gets away with it because they've got hot female servers dressed up in
      maid outfits.
    ko: 메이드복을 입은 미모의 여성들이 서비스를 제공한다는 이유로 값싼 음식을 고가에 판매하는 곳입니다.
    ja: |-
      メイド服を着た美しい女性たちが
      サービスを提供することで、
      安価な食べ物を高値で販売している場所です。
  event_foolburstday_04_13:
    speaker: privaty_m
    en: Wh-what did you say?
    ko: 뭐, 뭐라고요?
    ja: な、なんですって！？
  event_foolburstday_04_14:
    speaker: mechashifty
    en: I don't see the appeal myself, but since I'm meant to learn more about human
      emotions, I'll play along.
    ko: |-
      이해할 수 없는 시장 형태이지만,
      인간의 마음을 배우는 과정이니 어울려 드리겠습니다.
    ja: |-
      ワタシには理解できない市場の形態ですが、
      人間の心を学ぶため、お付き合いいたします。
  event_foolburstday_04_15:
    speaker: privaty_m
    en: I'm sorry, but I must respond to that accusation you just made.
    ko: 잠깐만요. 방금 그 발언은 그냥 넘어갈 수 없겠는데요.
    ja: |-
      お待ちください。
      聞き捨てならないですね。
  event_foolburstday_04_16:
    speaker: privaty_m
    en: There's more to the Maid Cafe than servers dressed in maid outfits.
    ko: |-
      메이드 카페라는 건 말이죠.
      단순히 메이드 복장을 입은 분들이 서비스하는 곳이 아니에요.
    ja: |-
      メイドカフェというのは、
      単にメイド服を着た人々が
      サービスを行う場所ではありません。
  event_foolburstday_04_17:
    speaker: privaty_m
    en: It's a place where the customers and staff respect each other, and have a
      therapeutic experience through this mutual hospitality.
    ko: 손님과 직원 모두 서로를 존중하며, 서로를 대접함으로써 치유받는 장소예요.
    ja: |-
      お客様とスタッフがお互いを尊重し合い、
      もてなしによって癒やされる場所です。
  event_foolburstday_04_18:
    speaker: privaty_m
    en: I cannot tolerate someone so crudely dismissing such a precious place.
    ko: 이런 소중한 장소를 그런 식으로 이야기하는 건 참을 수 없어요.
    ja: |-
      大切な場所をそのように言われては
      我慢なりません。
  event_foolburstday_04_19:
    speaker: "<Monologue>"
    en: Privaty sure does take being a maid seriously.
    ko: |-
      프리바티….
      이렇게까지 메이드에 진심이었구나.
    ja: |-
      プリバティ…
      そこまで本気だったのか
  event_foolburstday_04_20:
    speaker: "<Monologue>"
    en: Does the fact she belongs to Triangle, which itself is part of the Central
      Government, even matter anymore?
    ko: "…중앙 정부 직속인 트라이앵글 스쿼드라는 건 이제 아무래도 좋은 걸까."
    ja: |-
      …中央政府直属のトライアングル部隊に
      所属しているという事実は
      もうどうでもいいのだろうか…
  event_foolburstday_04_21:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_04_22:
    speaker: privaty_m
    en: At any rate, if you are to frequent our establishment, I would kindly ask
      you to conduct yourself in a civilized fashion.
    ko: 아무튼, 예의를 갖춰 행동해 주세요.
    ja: とにかく、礼儀正しく振る舞ってください。
  event_foolburstday_04_23:
    speaker: mechashifty
    en: Understood. I will act appropriately as the surroundings dictate.
    ko: 알겠습니다. 장소에 맞는 방식으로 행동하겠습니다.
    ja: |-
      分かりました。この場に
      ふさわしい行動をさせていただきます。
  event_foolburstday_04_24:
    speaker: privaty_m
    en: Thank you.
    ko: 고마워요.
    ja: ありがとうございます。
  event_foolburstday_04_25:
    speaker: privaty_m
    en: Now then, what would you like to order?
    ko: 그럼, 뭘로 주문하시겠어요? 주인님.
    ja: では、ご主人様。ご注文は何になさいますか？
  event_foolburstday_04_26:
    speaker: mechashifty
    en: A glass of your finest gasoline, and quickly.
    ko: 어이. 고급 휘발유 한잔.
    ja: おい、高級ガソリン1杯。
  event_foolburstday_04_27:
    speaker: privaty_m
    en: You run on gasoline? Actually, more importantly, where are your manners?!
    ko: |-
      휘발유로 움직이는 거였어요!?
      아, 아니 그보다 주문 매너가 그게 뭔가요!?
    ja: |-
      ガソリンで動くんですか！？
      そ、それよりその態度は何ですか！？
  event_foolburstday_04_28:
    speaker: mechashifty
    en: Don't worry about that. Just bring over the gasoline, and make it snappy.
    ko: 됐고, 여기 휘발유 한 잔 가져와 봐.
    ja: いいから、ガソリン持ってこいよ。
  event_foolburstday_04_29:
    speaker: privaty_m
    en: Ugh! I just can't with you...
    ko: 당신, 정말 듣자 듣자 하니까…!
    ja: まったく、聞いていられませんね…！
  event_foolburstday_04_30:
    speaker: "<Self>"
    en: Mecha Shifty.
    ko: "…메카 시프티."
    ja: "…メカシフティー"
  event_foolburstday_04_31:
    speaker: mechashifty
    en: What?
    ko: 예.
    ja: はい。
  event_foolburstday_04_32:
    speaker: "<Self>"
    en: Apologize right now.
    ko: 당장 사과해.
    ja: 今すぐ謝るんだ
  event_foolburstday_04_33:
    speaker: "<Self>"
    en: Once you've done that, we're leaving.
    ko: 그리고 바로 나가자.
    ja: そして、すぐにここを出よう
  event_foolburstday_04_34:
    speaker: mechashifty
    en: What? I did nothing wrong. I was simply behaving in accordance with how I
      see the environment.
    ko: |-
      저는 잘못한 게 없습니다.
      장소에 걸맞게 행동했을 뿐입니다.
    ja: |-
      ワタシは間違っていません。
      この場所にふさわしい行動をしたまでです。
  event_foolburstday_04_35:
    speaker: "<Self>"
    en: You're free to have your own opinion about this place,
    ko: 네가 이 장소를 어떻게 생각하든 그건 네 자유야.
    ja: |-
      君がこの場所をどう思おうと、
      それは君の自由だ
  event_foolburstday_04_36:
    speaker: "<Self>"
    en: but that doesn't mean you should say those thoughts out loud.
    ko: 하지만 그 생각을 함부로 입 밖에 꺼내면 안 돼.
    ja: しかし、それをみだりに口にしてはいけない
  event_foolburstday_04_37:
    speaker: "<Self>"
    en: There's something called mutual respect in society. It means that you don't
      blurt out whatever comes to mind.
    ko: |-
      사회에는 상호 간의 예의라는 게 있어.
      생각한 대로 내뱉으면 안 된다는 얘기야.
    ja: |-
      社会には守るべきマナーというものがある。
      考えなしに発言してはいけないんだ
  event_foolburstday_04_38:
    speaker: mechashifty
    en: You're suppressing my freedom of expression.
    ko: 표현의 자유를 억압하시는군요.
    ja: ワタシから表現の自由を奪うのですか。
  event_foolburstday_04_39:
    speaker: "<Self>"
    en: Freedom of expression doesn't excuse being a jerk.
    ko: |-
      그건 표현의 자유가 아냐.
      그냥 네가 이기적인 것뿐이야.
    ja: |-
      それは表現の自由ではない。
      ただ君が自分勝手なだけだ
  event_foolburstday_04_40:
    speaker: "<Self>"
    en: It doesn't matter what your personal opinions are. You shouldn't insult people.
    ko: 네 개인적인 생각으로 이 사회에 몸담고 있는 이들을 모욕하지 마.
    ja: |-
      君の独りよがりな考えで、この世界に
      携わる人たちを侮辱しないでくれ
  event_foolburstday_04_41:
    speaker: "<Self>"
    en: Regardless of how you feel, or even if you're in fact correct, you still need
      to be careful with your words.
    ko: 그렇게 생각하더라도, 실제로 그렇다고 하더라도 말을 조심해야지.
    ja: |-
      君がどう思ったとしても、
      実際にその考えが正しいとしても、
      発言には気をつけるべきだ
  event_foolburstday_04_42:
    speaker: "<Self>"
    en: That's what being respectful is.
    ko: 그게 예의라는 거야.
    ja: それがマナーというものなんだ
  event_foolburstday_04_43:
    speaker: privaty_m
    en: Commander... I mean, Master...
    ko: "…지휘관. 아, 아니 주인님…."
    ja: "…指揮官。い、いえ、ご主人様…"
  event_foolburstday_04_44:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_04_45:
    speaker: mechashifty
    en: Okay, I was rude.
    ko: 알겠습니다. 제가 너무 무례했습니다.
    ja: 分かりました。ワタシが無礼でした。
  event_foolburstday_04_46:
    speaker: mechashifty
    en: As an apology, I will perform a display of self-destruction.
    ko: 사과의 의미로 자폭쇼를 보여드리겠습니다.
    ja: お詫びのしるしに、自爆ショーをお見せします。
  event_foolburstday_04_47:
    speaker: privaty_m
    en: Er... please don't.
    ko: "…그러지 마요."
    ja: "…やめてください。"
  event_foolburstday_04_48:
    speaker: privaty_m
    en: And you don't need to leave.
    ko: 그리고 안 나가도 돼요.
    ja: それにお店を出ていく必要もありません。
  event_foolburstday_04_49:
    speaker: privaty_m
    en: Like I said before, this is meant to be a therapeutic space.
    ko: 여긴 아까도 말했지만 치유받는 곳이니까.
    ja: |-
      ここはさっきも言った通り、
      癒されにくる場所ですから。
  event_foolburstday_04_50:
    speaker: privaty_m
    en: You didn't know, and you apologized, so it's fine.
    ko: 잘 몰라서 그런 거고, 사과도 하셨으니까 괜찮아요.
    ja: |-
      理解が足りなかっただけですし、
      謝ってくださったので大丈夫です。
  event_foolburstday_04_51:
    speaker: mechashifty
    en: I don't like how you are pretending to be the bigger person in front of someone
      you like, but thanks for forgiving me.
    ko: 좋아하는 남자 앞에서 대인배인 척하시는 것 같아 마음에 안 들지만, 용서해 주셔셔 감사합니다.
    ja: |-
      好きな男の前で寛大なフリをしているようで
      気に入りませんが、許してくださり
      ありがとうございます。
  event_foolburstday_04_52:
    speaker: privaty_m
    en: "... On second thought, maybe I should have you leave..."
    ko: "…그냥 나가라고 할까."
    ja: "…やっぱり出ていってもらいましょうか。"
  event_foolburstday_04_53:
    speaker: cocoa
    en: Here's your order.
    ko: 음식 나와써.
    ja: 主人、お待たせ。
  event_foolburstday_04_54:
    speaker: "<Self>"
    en: Thanks, Cocoa.
    ko: 아, 고마워 코코아.
    ja: ありがとう、ココア
  event_foolburstday_04_55:
    speaker: "<Self>"
    en: Are Ade and Soda off today?
    ko: 오늘 에이드랑 소다는 쉬는 날인가 봐?
    ja: 今日はエードとソーダは休みか？
  event_foolburstday_04_56:
    speaker: cocoa
    en: Yeah. As an April Fool's prank, I told them that the cafe was closed.
    ko: 응. 만우절 기념으로 메이드 카페 쉰다고 코코아가 거짓말해써.
    ja: |-
      うん。エイプリルフールだから、
      メイドカフェはお休みってココアが嘘ついた。
  event_foolburstday_04_57:
    speaker: cocoa
    en: Ade and Soda deserve a good rest.
    ko: 에이드랑 소다 좀 쉬어야 대.
    ja: |-
      エードとソーダには
      ちょっと休んでもらわなきゃ。
  event_foolburstday_04_58:
    speaker: "<Self>"
    en: What about Privaty...
    ko: "…프리바티는 왜…."
    ja: "…プリバティは…"
  event_foolburstday_04_59:
    speaker: cocoa
    en: She came to hang out, but then ended up helping out.
    ko: 프리바티 놀러 왔다가 도와주고 이써.
    ja: |-
      プリバティは遊びにきただけ。
      だけど手伝ってもらってるの。
  event_foolburstday_04_60:
    speaker: privaty_m
    en: I... I just came to lend a hand is all. It's not because I thought you couldn't
      handle it on your own or anything...
    ko: |-
      그, 그냥 진짜 놀러 온 거예요.
      뭐 딱히 코코아가 힘들어 보여서 그런 게 아니라….
    ja: |-
      そ、そうなんです。別にココアが
      大変そうだったからとか、そんなんじゃ…
  event_foolburstday_04_61:
    speaker: cocoa
    en: That's very nice of you to say, Privaty.
    ko: 프리바티 차캐.
    ja: プリバティ、やさしい。
  event_foolburstday_04_62:
    speaker: privaty_m
    en: "..."
    ko: "…으."
    ja: "…うぅ…"
  event_foolburstday_04_63:
    speaker: cocoa
    en: Anyway, dig in before it gets cold.
    ko: |-
      주인. 빨리 머거.
      음식 다 식게써.
    ja: |-
      主人。早く食べて。
      ご飯が冷めちゃう。
  event_foolburstday_04_64:
    speaker: "<Self>"
    en: Thank you.
    ko: 응. 잘 먹겠습니다.
    ja: ああ、いただきます
  event_foolburstday_04_65:
    speaker: cocoa
    en: And for you...
    ko: 그리고 이거.
    ja: それから、これ。
  event_foolburstday_04_66:
    speaker: "<Monologue>"
    en: Cocoa places a plate of omurice in front of Mecha Shifty.
    ko: 메카 시프티의 앞에 오므라이스가 놓여졌다.
    ja: |-
      ココアはメカシフティーの前に
      オムライスを置いた
  event_foolburstday_04_67:
    speaker: mechashifty
    en: What is this?
    ko: 이건 무엇입니까.
    ja: これは何ですか？
  event_foolburstday_04_68:
    speaker: cocoa
    en: This is something complimentary that we, the professional maids, prepared
      for you.
    ko: 프로 메이드의 서비스야.
    ja: プロメイドのサービスだよ。
  event_foolburstday_04_69:
    speaker: cocoa
    en: Enjoy.
    ko: 마시께 먹어.
    ja: どうぞめしあがれ。
  event_foolburstday_04_70:
    speaker: mechashifty
    en: "... Thanks."
    ko: "…감사합니다."
    ja: "…ありがとうございます。"
  event_foolburstday_04_71:
    speaker: cocoa
    en: Oh, my apologies. I'll bring you some cutlery.
    ko: |-
      아, 미안.
      나이프랑 스푼 가져다주께.
    ja: |-
      あ、ごめん。
      ナイフとスプーン、持ってくる。
  event_foolburstday_04_72:
    speaker: mechashifty
    en: It's fine. My hands can be swapped out for different parts.
    ko: |-
      괜찮습니다.
      저의 이 양손, 파츠 교환이 자유로우니까요.
    ja: |-
      大丈夫です。ワタシの両手は
      他のパーツに交換可能です。
  event_foolburstday_04_73:
    speaker: mechashifty
    en: I'll switch up to a fork and spoon.
    ko: 나이프와 스푼 파츠로 교환하겠습니다.
    ja: ナイフとスプーンパーツに交換します。
  event_foolburstday_04_74:
    speaker: "<Narration>"
    en: "*Clank*"
    ko: 기이잉--
    ja: ウィィーン――
  event_foolburstday_04_75:
    speaker: "<Monologue>"
    en: The guns that were attached to the end of Mecha Shifty's arms retreat into
      the sleeves and are promptly replaced by a fork and spoon.
    ko: |-
      메카 시프티의 양손에 달려있던 총이 소매 안으로 들어가고,
      나이프와 포크가 튀어나왔다.
    ja: |-
      メカシフティーの両手の銃が袖の中に入り、
      代わりにナイフとスプーンが飛び出した
  event_foolburstday_04_76:
    speaker: "<Self>"
    en: What bizarre functions...
    ko: "…별 기능이 다 있네."
    ja: "…何でもありだな"
  event_foolburstday_04_77:
    speaker: mechashifty
    en: I can swap out over 300 different parts.
    ko: 300여 개의 파츠로 교환 가능합니다.
    ja: 約300種のパーツと交換可能です。
  event_foolburstday_04_78:
    speaker: cocoa
    en: Amazing.
    ko: 대다내.
    ja: すごい。
  event_foolburstday_04_79:
    speaker: cocoa
    en: You would make a fine maid.
    ko: 메카 시프티는 좋은 메이드가 될 수 있을 거야.
    ja: メカシフティーはいいメイドになれる。
  event_foolburstday_04_80:
    speaker: "<Self>"
    en: Please, no. Anything but that, Cocoa.
    ko: "…아니야. 그건 아니야 코코아."
    ja: "…そうだろうか…"
  event_foolburstday_04_81:
    speaker: cocoa
    en: "??"
    ko: "??"
    ja: "？？"
  event_foolburstday_04_82:
    speaker: privaty_m
    en: Hurry and eat it, before it gets cold.
    ko: 자, 메카 시프티도 식기 전에 얼른 드세요.
    ja: ほら、メカシフティーも冷める前にどうぞ。
  event_foolburstday_04_83:
    speaker: mechashifty
    en: Thank you.
    ko: 잘 먹겠습니다.
    ja: いただきます。
  event_foolburstday_04_84:
    speaker: "<Narration>"
    en: "*Nom nom*"
    ko: 우물우물.
    ja: モグモグ
  event_foolburstday_04_85:
    speaker: mechashifty
    en: "!!"
    ko: "…아."
    ja: "…あ。"
  event_foolburstday_04_86:
    speaker: cocoa
    en: Do you like it? I made it specially for you.
    ko: |-
      마시써?
      코코아가 특별히 신경 써서 만들어써.
    ja: |-
      おいしい？
      ココアが特別に心をこめて作った。
  event_foolburstday_04_87:
    speaker: privaty_m
    en: Do you feel better?
    ko: 치유받는 느낌이 드시나요?
    ja: 心が癒されませんか？
  event_foolburstday_04_88:
    speaker: mechashifty
    en: Warning. Warning. Foreign object detected in engine space. Foreign object
      detected in engine space.
    ko: 경고. 경고. 엔진룸에 이물질 감지. 엔진룸에 이물질 감지.
    ja: |-
      警告。警告。エンジンルームにて異物を検出。
      エンジンルームにて異物を検出。
  event_foolburstday_04_89:
    speaker: mechashifty
    en: Entering sleep mode until the foreign object is broken down.
    ko: 이물질을 분해하기 전까지 강제 슬립 모드 전환.
    ja: |-
      異物の分解完了まで、
      強制スリープモードに切り替えます。
  event_foolburstday_04_90:
    speaker: "<Narration>"
    en: "*Boom*!"
    ko: 콰앙-!
    ja: ドン！
  event_foolburstday_04_91:
    speaker: "<Monologue>"
    en: Mecha Shifty collapses.
    ko: 메카 시프티가 쓰러지듯 테이블에 머리를 박았다.
    ja: |-
      メカシフティーは倒れるように
      テーブルに突っ伏した
  event_foolburstday_04_92:
    speaker: "<Monologue>"
    en: Its head slams onto the table, and lies motionless.
    ko: "…메카 시프티는 미동도 하지 않는다."
    ja: "…メカシフティーは微動だにしない"
  event_foolburstday_04_93:
    speaker: cocoa
    en: "*Gasp*!"
    ko: 헉!
    ja: えっ！
  event_foolburstday_04_94:
    speaker: cocoa
    en: The omurice was so delicious that it fainted!
    ko: 너무 마시써서 기절했나바!
    ja: おいしすぎて、気絶しちゃった！
  event_foolburstday_04_95:
    speaker: privaty_m
    en: "... Sure, let's go with that."
    ko: 그런 것… 같네요.
    ja: そう…みたいですね。
  event_foolburstday_04_96:
    speaker: "<Monologue>"
    en: Privaty looks at me pleadingly.
    ko: 프리바티가 나를 필사적으로 바라본다.
    ja: プリバティが必死にこちらを見ている
  event_foolburstday_04_97:
    speaker: "<Monologue>"
    en: I should probably play along.
    ko: "…어떻게든 수습은 해야겠다."
    ja: "…なんとか誤魔化さなければ"
  event_foolburstday_04_98:
    speaker: "<Self>"
    en: Uh... yeah, you're probably right.
    ko: 아, 그, 그런가 봐.
    ja: ああ、そ、そうみたいだ
  event_foolburstday_04_99:
    speaker: "<Self>"
    en: Also, Mecha Shifty has been working nonstop for a few days now, so it's a
      bit tired.
    ko: 그리고 메카 시프티가 며칠 동안 밤을 새워서 좀 피곤했거든.
    ja: |-
      それに、メカシフティーはここ数日
      徹夜して疲れていたようだ
  event_foolburstday_04_100:
    speaker: "<Self>"
    en: If you'll excuse us.
    ko: 미안한데 먼저 들어가 볼게.
    ja: すまないが、先に失礼する
  event_foolburstday_04_101:
    speaker: cocoa
    en: No problem.
    ko: 응. 어쩔 수 업찌.
    ja: うん。仕方ない。
  event_foolburstday_04_102:
    speaker: cocoa
    en: A professional maid doesn't get upset by something as minor as this.
    ko: 프로 메이드는 이런 걸로 섭섭해하지 않으니까.
    ja: プロメイドはこんなことで寂しがらないよ。
  event_foolburstday_04_103:
    speaker: "<Monologue>"
    en: I start to leave the cafe, pushing the motionless Mecha Shifty in front of
      me.
    ko: 움직이지 않는 메카 시프티를 어떻게든 밀면서 이동했다.
    ja: メカシフティーをなんとか押しながら移動した
  event_foolburstday_04_104:
    speaker: "<Monologue>"
    en: Something which I'm only able to manage due to the treads.
    ko: 무한궤도가 있어서 비교적 쉽게 밀 수 있어서 다행이다.
    ja: |-
      キャタピラのおかげで
      簡単に移動させることができてよかった
  event_foolburstday_04_105:
    speaker: "<Monologue>"
    en: As I reach the door...
    ko: 문 앞까지 이동했을 때
    ja: そして、扉の前に到着したその時…
  event_foolburstday_04_106:
    speaker: "<Narration>"
    en: "*Clang*!"
    ko: 벌컥-!
    ja: ガチャ！
  event_foolburstday_04_107:
    speaker: ade
    en: Cocoa!
    ko: 코코아!
    ja: ココア！
  event_foolburstday_04_108:
    speaker: soda
    en: Cocoa!
    ko: 코코아!
    ja: ココア！
  event_foolburstday_04_109:
    speaker: cocoa
    en: Huh?
    ko: 흐에…?
    ja: へっ…？
  event_foolburstday_04_110:
    speaker: ade
    en: You said the cafe is closed today.
    ko: 오늘 카페 쉬는 날이라고 했잖아.
    ja: 今日はカフェはお休みって言ってたわよね。
  event_foolburstday_04_111:
    speaker: soda
    en: I knew something wasn't right, so I decided to come and check it out for myself.
      You tricked us!
    ko: |-
      헤엑, 헤엑.
      느낌이 이상해서 와 봤는데, 역시 거짓말이었군요오~
    ja: |-
      はぁ、はぁ…！
      なんだかおかしいと思って来てみたら、
      やっぱり嘘だったんですねぇ～
  event_foolburstday_04_112:
    speaker: cocoa
    en: Oh... well...
    ko: 아… 으음….
    ja: あっ…うーん…
  event_foolburstday_04_113:
    speaker: privaty_m
    en: Ade, Soda. Cocoa did this because...
    ko: |-
      저, 에이드. 소다.
      코코아는….
    ja: |-
      あの、エード、ソーダ。
      ココアは…
  event_foolburstday_04_114:
    speaker: ade
    en: She thought we've been working too hard lately, and so she lied to us so we'd
      have a day off. We know.
    ko: 요 며칠 나랑 소다가 고생했으니까 쉬게 해 주려고 거짓말한 거지?
    ja: |-
      ここ数日、私とソーダが大変そうだったから
      休ませようと思ったんでしょう？
  event_foolburstday_04_115:
    speaker: soda
    en: We understand, but you can't do this job by yourself, Cocoa. This isn't a
      job for one person.
    ko: 그렇다고 혼자 하면 안 돼요. 코코아도 힘들면서.
    ja: |-
      だからって、1人はダメですよ。
      ココアも大変じゃないですか。
  event_foolburstday_04_116:
    speaker: cocoa
    en: But I'm the team leader. I can handle it.
    ko: |-
      코코아는 메이드 장이니까.
      힘드러도 참을 수 이써.
    ja: |-
      ココアはメイド長だから。
      大変でもガマンできるよ。
  event_foolburstday_04_117:
    speaker: ade
    en: Stop it now.
    ko: "…정말."
    ja: "…まったく。"
  event_foolburstday_04_118:
    speaker: ade
    en: We work together, and we rest together.
    ko: 같이 하자. 같이 하고 같이 쉬자.
    ja: |-
      一緒にやりましょう。
      一緒に仕事して、一緒に休むのよ。
  event_foolburstday_04_119:
    speaker: soda
    en: That's right. We can't have half of us resting while the other half is slaving
      away.
    ko: 그래요. 누구는 고생하고 누구는 쉬면 안 되죠.
    ja: そうですよ。仕事も休みも、みんな一緒です。
  event_foolburstday_04_120:
    speaker: cocoa
    en: "... You're not mad with me for lying?"
    ko: "…코코아 거짓말 한 거 괜차나?"
    ja: "…ココアの嘘に、怒ってない？"
  event_foolburstday_04_121:
    speaker: ade
    en: It's okay, because your heart was in the right place.
    ko: "…괜찮아. 착해."
    ja: "…大丈夫よ。優しい嘘だから。"
  event_foolburstday_04_122:
    speaker: soda
    en: Hehe.
    ko: 헤헤.
    ja: えへへ。
  event_foolburstday_04_123:
    speaker: ade
    en: I want to thank you as well, Privaty.
    ko: 프리바티도 고마워요.
    ja: プリバティもありがとうございます。
  event_foolburstday_04_124:
    speaker: privaty_m
    en: Oh, sure. No problem.
    ko: 벼, 별말씀을요.
    ja: ど、どういたしまして。
  event_foolburstday_04_125:
    speaker: "<Monologue>"
    en: Not wanting to ruin the amiable atmosphere,
    ko: 훈훈한 분위기다.
    ja: 和やかな、いい雰囲気だ
  event_foolburstday_04_126:
    speaker: "<Monologue>"
    en: I try my best to slip away quietly.
    ko: |-
      이 분위기를 깰 수 없으니,
      최선을 다해 조용히 빠져나가자.
    ja: |-
      この雰囲気を壊すわけにはいかない。
      なるべく静かに抜け出そう
  event_foolburstday_04_127:
    speaker: "<Monologue>"
    en: This proves to be somewhat difficult, due to Mecha Shifty weighing a ton.
    ko: "…아 무겁다 정말."
    ja: "…あぁ、それにしても重いな…"
event_foolburstday_05:
  event_foolburstday_05_1:
    speaker: mechashifty
    en: Huh? Where are we?
    ko: 아… 여기는….
    ja: あっ…ここは…
  event_foolburstday_05_2:
    speaker: "<Self>"
    en: A hotel.
    ko: 호텔이야.
    ja: ホテルだ
  event_foolburstday_05_3:
    speaker: "<Self>"
    en: I didn't know whether I should take you to the Repair Center or the Hospital,
      so I brought you here while I try to work it out.
    ko: "…리페어 센터로 가야 할지, 병원으로 가야 할지 몰라서 일단 여기로 데려왔어."
    ja: |-
      …リペアセンターと病院…どちらに行くべきか
      分からなくて、ひとまずここに来た
  event_foolburstday_05_4:
    speaker: mechashifty
    en: I see you didn't hesitate to bring someone you barely know to a hotel.
    ko: 호텔로 끌어들이는 솜씨가 보통이 아니군요.
    ja: |-
      ホテルに連れ込む手腕が
      尋常ではありませんね。
  event_foolburstday_05_5:
    speaker: mechashifty
    en: How many women have you seduced by doing this?
    ko: 이런 방식으로 지금까지 몇 명의 여성에게 검은 마수를 뻗쳤습니까.
    ja: |-
      今まで何人の女性にこうやって
      魔の手を伸ばしてきたのですか？
  event_foolburstday_05_6:
    speaker: "<Self>"
    en: Enough talking.
    ko: 말을 말자, 응?
    ja: やめてくれ
  event_foolburstday_05_7:
    speaker: mechashifty
    en: Wow, you're raring to go, aren't you?
    ko: 하… 정말이지.
    ja: はぁ…まったく。
  event_foolburstday_05_8:
    speaker: mechashifty
    en: Okay, fine. At least let me wash up first.
    ko: 씻고 오겠습니다.
    ja: シャワーを浴びてきます。
  event_foolburstday_05_9:
    speaker: "<Self>"
    en: Would you please stop rambling?
    ko: 헛소리 좀 하지 마. 부탁이야.
    ja: ふざけている場合じゃないだろう
  event_foolburstday_05_10:
    speaker: "<Self>"
    en: Now tell me, how are you feeling?
    ko: 상태는 어때?
    ja: 具合はどうだ？
  event_foolburstday_05_11:
    speaker: mechashifty
    en: I'm fine now. The microorganisms in my engine compartment have broken down
      all the food.
    ko: |-
      이제 괜찮습니다.
      엔진룸의 미생물들이 음식물들을 모두 분해했습니다.
    ja: |-
      もう大丈夫です。
      エンジンルームの微生物が
      食べ物をすべて分解しました。
  event_foolburstday_05_12:
    speaker: "<Self>"
    en: So, you're a food processor?
    ko: "…음식물 처리기냐고."
    ja: "…生ゴミ処理機じゃあるまいし…"
  event_foolburstday_05_13:
    speaker: mechashifty
    en: What are we doing next?
    ko: 그럼 이제 다음은 뭘 합니까.
    ja: 次はどうしますか？
  event_foolburstday_05_14:
    speaker: mechashifty
    en: Since we're in a hotel room, I can certainly think of one thing we could do.
      Bow chicka wow wow!
    ko: |-
      역시 호텔이라면 그겁니까?
      으쌰 으쌰.
    ja: |-
      やっぱりホテルといえば、アレですか？
      ハッスルハッスルですか？
  event_foolburstday_05_15:
    speaker: "<Self>"
    en: Stop being such a perv. Who even says that anymore?
    ko: 아저씨가 할법한 표현 쓰지 마.
    ja: おじさんみたいだな
  event_foolburstday_05_16:
    speaker: mechashifty
    en: I suppose that if the aim is to better understand human emotions, it'd be
      hard to beat a good long workout.
    ko: 역시 인간의 마음을 알기에는 으랏챠만한 게 없을지도 모르겠군요.
    ja: |-
      やはり、人間の心を知るには
      一晩を共に過ごすのが一番ですね。
  event_foolburstday_05_17:
    speaker: mechashifty
    en: But for a sublime silicon-based lifeform like me to debase myself with a lowly
      carbon-based lifeform... it's hard to envision.
    ko: 하지만 저같이 완벽한 규소생명체가 열등한 탄소생명체와의 으쌰쌰라니 있을 수 없는 일입니다.
    ja: |-
      しかし、ワタシのように完璧なケイ素生物が
      劣等な炭素生物とエッチラホッチラだなんて
      あり得ないことです。
  event_foolburstday_05_18:
    speaker: mechashifty
    en: Then again, maybe I could try it once for fun.
    ko: 그러나 여흥의 일환으로 여기고 한 번쯤 으랏차차 하는 건 나쁘지 않을지도 모르겠군요.
    ja: |-
      ですが、余興の一環として
      ここでイッパツ試してみるのも
      悪くないかもしれませんね。
  event_foolburstday_05_19:
    speaker: mechashifty
    en: So how about it? Are we gonna have a little bow chicka wow wow?
    ko: 어떻습니까. 으럇으럇 하실 겁니까?
    ja: |-
      いかがでしょう。
      ニャンニャンしましょうか？
  event_foolburstday_05_20:
    speaker: "<Self>"
    en: Can't you find some other expression for that?
    ko: 한 가지로 표현해 주면 안 될까.
    ja: 表現を一つにしぼってくれないか
  event_foolburstday_05_21:
    speaker: mechashifty
    en: The beast with two backs?
    ko: X스.
    ja: XッXX。
  event_foolburstday_05_22:
    speaker: "<Self>"
    en: "*Sigh*... You really do have a few screws loose."
    ko: 하 진짜 미친 것 같애.
    ja: はぁ…頭がおかしくなりそうだ
  event_foolburstday_05_23:
    speaker: rumani
    en: Gym Rat?
    ko: 회원님?
    ja: 会員さん？
  event_foolburstday_05_24:
    speaker: bay
    en: Coach?
    ko: 코치님?
    ja: コーチ？
  event_foolburstday_05_25:
    speaker: clay
    en: Coach?
    ko: 코치님?
    ja: コーチ？
  event_foolburstday_05_26:
    speaker: "<Self>"
    en: Huh? What are you all doing here?
    ko: 응? 너희들이 왜 여기 있어?
    ja: え？君たちがどうしてここに？
  event_foolburstday_05_27:
    speaker: rumani
    en: I heard that the hotel gym was open for free for April Fool's Day, so I came
      to check it out.
    ko: 만우절 기념으로 호텔 체육관을 무료로 개장한다길래 와봤어요.
    ja: |-
      エイプリルフールキャンペーンで
      ホテルのジムを無料で開放すると聞いたんです。
  event_foolburstday_05_28:
    speaker: bay
    en: But it turned out only to be full of construction materials that needed cleaning.
    ko: 와봤더니 치워야 할 자재만 가득했지만 말이야.
    ja: でもいざ来てみたら、資材だらけだったの。
  event_foolburstday_05_29:
    speaker: clay
    en: 'The message was clear: This hotel actually doesn''t have a gym.'
    ko: "[이 호텔에는 체육관이 없습니다] 같은 걸까요옷…."
    ja: |-
      「このホテルにはジムがありません」って
      ことなんでしょうかっ…
  event_foolburstday_05_30:
    speaker: bay
    en: At any rate, we figured that since we were there anyway, we might as well
      clean up everything.
    ko: 그래서 그냥 돌아가기 뭐해서, 자재들 치우고 오는 길이야.
    ja: |-
      まあ、せっかく来たんだし…ってことで、
      資材を片づけてきたの。
  event_foolburstday_05_31:
    speaker: bay
    en: We worked up quite a sweat, so we wanted to use the shower.
    ko: 열심히 일했으니 샤워실이나 좀 빌릴까 했지.
    ja: |-
      それで汗をかいたから、
      シャワーでも借りようかと思って。
  event_foolburstday_05_32:
    speaker: rumani
    en: So...
    ko: 그랬는데….
    ja: そういうこと、なんだけど…
  event_foolburstday_05_33:
    speaker: "<Monologue>"
    en: Rumani, Bay, and Clay simultaneously shift their gaze towards Mecha Shifty.
    ko: 루마니와 베이, 클레이가 메카 시프티를 빤히 쳐다본다.
    ja: |-
      ルマニとベイ、クレイが
      メカシフティーをじっと見つめた
  event_foolburstday_05_34:
    speaker: rumani
    en: There must be someone inside that costume, right?
    ko: "…안에 누가 타고 있는 거 맞죠?"
    ja: "…中に誰か入ってるのよね？"
  event_foolburstday_05_35:
    speaker: bay
    en: It's a really well-made costume too.
    ko: 그러게. 엄청 잘 만들었네.
    ja: そうね。すごくよくできてる。
  event_foolburstday_05_36:
    speaker: clay
    en: What are you doing here anyway, Coach?
    ko: 앗. 그런데 코치님은 호텔에 뭘 하고 계시던 건가요옷?
    ja: |-
      あっ。ところで、コーチは
      ホテルで何をされてたんですかっ？
  event_foolburstday_05_37:
    speaker: mechashifty
    en: We were spending some quality time together, and tuckered ourselves, so we
      decided to get some rest.
    ko: 같이 시간을 보내다 피곤해서 잠깐 쉬러 가자 했습니다.
    ja: |-
      一緒にいたら、疲れたので
      一休みしようと言われたのです。
  event_foolburstday_05_38:
    speaker: rumani
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_39:
    speaker: bay
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_40:
    speaker: mechashifty
    en: I ended up passing out, and when I came to, here I was.
    ko: |-
      피곤해서 잠깐 잠든 사이,
      어느덧 저는 호텔에 와 있었습니다.
    ja: |-
      疲れて眠っている間に、
      いつの間にかホテルに来ていました。
  event_foolburstday_05_41:
    speaker: rumani
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_42:
    speaker: bay
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_43:
    speaker: mechashifty
    en: He says I can't take a shower.
    ko: 씻는 건 안된다고 했습니다.
    ja: シャワーを浴びてはいけないと言われました。
  event_foolburstday_05_44:
    speaker: rumani
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_foolburstday_05_45:
    speaker: bay
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_foolburstday_05_46:
    speaker: rumani
    en: Gym Rat! I knew your taste was wide-ranging, but I had no idea how far it
      went!
    ko: 회원님…! 수비 범위가 넓은 줄은 알았지만 이 정도일 줄은…!
    ja: |-
      会員さん…！
      守備範囲が広そうだとは思っていましたが、
      まさかそこまでとは…！
  event_foolburstday_05_47:
    speaker: bay
    en: Why are you not allowing her to wash up? Wait... I think I have heard of some
      people who are into that...
    ko: |-
      씨, 씻는 건 왜 안된다는 거야?
      아, 아니 그런 쪽도 수요가 있다고는 들었지만…!
    ja: |-
      しゃ、シャワーはどうして浴びたらダメなの？
      そ、そういうのも需要はあるって聞いたけど…！
  event_foolburstday_05_48:
    speaker: clay
    en: "??"
    ko: "??"
    ja: "？？"
  event_foolburstday_05_49:
    speaker: "<Self>"
    en: "*Sigh*... I don't even know where to start."
    ko: "…하… 어디부터 어떻게 얘기해야 할지 감도 안 잡히네."
    ja: "…はぁ…どこからどう説明すればいいのやら…"
  event_foolburstday_05_50:
    speaker: rumani
    en: Who's really inside that outfit?
    ko: 그런데 정말 안에 누구예요?
    ja: ところで、本当に中身は誰なんですか？
  event_foolburstday_05_51:
    speaker: bay
    en: Yeah, I wonder who'd go to such lengths to disguise themselves.
    ko: 안에 누가 있길래 이렇게 변장까지 하는 공을 들인 건지 궁금하네.
    ja: こんな変装までするなんて。気になるわ。
  event_foolburstday_05_52:
    speaker: bay
    en: Is it some top secret that we shouldn't know about?
    ko: 우리가 알면 안 되는 극비 인물이라던가…?
    ja: 私たちに知られたら困る人とか…？
  event_foolburstday_05_53:
    speaker: rumani
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_54:
    speaker: rumani
    en: It's not actually a robot, is it?
    ko: 설마 진짜 로봇인 건 아니지?
    ja: |-
      まさか、本当にロボットってワケじゃ
      ないわよね？
  event_foolburstday_05_55:
    speaker: mechashifty
    en: I am 100% robot.
    ko: 저는 순도 100% 로봇입니다.
    ja: ワタシは純度100％のロボットです。
  event_foolburstday_05_56:
    speaker: rumani
    en: I don't believe it.
    ko: 전혀 못 믿겠는데요.
    ja: まったく信用できないんだけど。
  event_foolburstday_05_57:
    speaker: mechashifty
    en: What do I care if an inferior being doesn't believe me?
    ko: 열등종 따위가 못 믿으면 어떡할 겁니까.
    ja: |-
      劣等種にそのようなことを言われる
      筋合いはありません。
  event_foolburstday_05_58:
    speaker: rumani
    en: Did you just call me inferior?
    ko: 여, 열등종이요?
    ja: れ、劣等種？
  event_foolburstday_05_59:
    speaker: mechashifty
    en: That's right. It's obvious that I am a superior being in every way.
    ko: 그렇습니다. 무엇으로 보나 제가 우수한 종이라는 것은 자명한 사실.
    ja: |-
      はい。ワタシが優れた種族であることは
      紛れもない事実。
  event_foolburstday_05_60:
    speaker: mechashifty
    en: You could never hope to beat me in anything.
    ko: 당신은 저한테 그 무엇으로도 이길 수 없습니다.
    ja: アナタがワタシに勝てるものはありません。
  event_foolburstday_05_61:
    speaker: mechashifty
    en: Beauty? I win hands down.
    ko: |-
      미모.
      저의 완승입니다.
    ja: |-
      美しさ。
      ワタシの圧勝です。
  event_foolburstday_05_62:
    speaker: rumani
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_63:
    speaker: mechashifty
    en: Physical components? Another win for me.
    ko: |-
      바디의 재질.
      저의 완승입니다.
    ja: |-
      ボディの材質。
      ワタシの圧勝です。
  event_foolburstday_05_64:
    speaker: bay
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_65:
    speaker: mechashifty
    en: Combat ability? Victory is mine.
    ko: |-
      전투 능력.
      저의 완승입니다.
    ja: |-
      戦闘能力。
      ワタシの圧勝です。
  event_foolburstday_05_66:
    speaker: clay
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_67:
    speaker: mechashifty
    en: Haha, is that a sufficient illustration of the difference between our species,
      Human?
    ko: |-
      하. 하. 하.
      이제야 수준의 차이, 아니 종의 차이를 아시겠습니까 휴-먼-
    ja: |-
      ハ、ハ、ハ。
      人間よ。これでレベルの違い…
      いや、種族の違いを思い知りましたか？
  event_foolburstday_05_68:
    speaker: rumani
    en: This bucket of bolts is starting to piss me off.
    ko: 이 녀석 좀 열받는데요.
    ja: このロボット、ちょっとムカつきますね。
  event_foolburstday_05_69:
    speaker: "<Self>"
    en: You and me both.
    ko: 나도 그렇게 생각해.
    ja: 私もそう思う
  event_foolburstday_05_70:
    speaker: rumani
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_71:
    speaker: rumani
    en: Well, you can't exercise, for one.
    ko: 그런데 너. 운동은 못 하잖아.
    ja: でも、あなた。運動はできないでしょ？
  event_foolburstday_05_72:
    speaker: mechashifty
    en: I don't need to. Exercising is an act to improve physical abilities for those
      who lack it.
    ko: |-
      운동을 할 필요가 없습니다.
      운동이란 부족한 신체 능력을 끌어올리기 위해 하는 행동.
    ja: |-
      その必要がありません。
      運動とは、足りない身体能力を
      引き上げるために行うもの。
  event_foolburstday_05_73:
    speaker: mechashifty
    en: As I am already equipped with perfect physical abilities, I have no need for
      exercise.
    ko: 저는 이미 완벽한 신체 능력을 가지고 있기에 운동은 필요 없습니다.
    ja: |-
      ワタシにはすでに完璧な身体能力が
      備わっているため、運動は必要ありません。
  event_foolburstday_05_74:
    speaker: "<Narration>"
    en: Bay lifts her leg over her head.
    ko: 베이가 다리를 머리 위로 들어 올린다.
    ja: ベイが足を頭の上に上げた
  event_foolburstday_05_75:
    speaker: bay
    en: Can you do this?
    ko: 할 수 있어?
    ja: できる？
  event_foolburstday_05_76:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_77:
    speaker: "<Narration>"
    en: Rumani clasps her hands behind her back.
    ko: 루마니가 등 뒤로 양손을 맞잡는다.
    ja: ルマニが背中の後ろで手を合わせた
  event_foolburstday_05_78:
    speaker: rumani
    en: How about this?
    ko: 이건?
    ja: これは？
  event_foolburstday_05_79:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_80:
    speaker: clay
    en: Um... let's see... maybe I'll...
    ko: 어? 어어… 그럼 저느은…!
    ja: え？えっと…じゃあ、私はっ…！
  event_foolburstday_05_81:
    speaker: "<Narration>"
    en: Clay leaps into the air.
    ko: 클레이가 힘차게 점프한다.
    ja: クレイが力強くジャンプした
  event_foolburstday_05_82:
    speaker: "<Narration>"
    en: Although she doesn't get much verticality,
    ko: "…점프의 높이는 높지 않지만."
    ja: "…それほど高くはないが…"
  event_foolburstday_05_83:
    speaker: "<Narration>"
    en: it's obvious that there is incredible power behind her jump.
    ko: 굉장한 것이 굉장한 박력으로 움직인다.
    ja: |-
      その拍子に素晴らしいものが、
      素晴らしい迫力で揺れた
  event_foolburstday_05_84:
    speaker: clay
    en: How about that? Can you jump?
    ko: 점프는 어떤 가요옷?
    ja: ジャンプはどうですかっ？
  event_foolburstday_05_85:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_86:
    speaker: mechashifty
    en: Such movements are impossible due to an inherent difference in our physical
      makeup.
    ko: 신체 구조의 차이로 인해 불가능한 움직입니다.
    ja: 身体構造の違いにより、不可能な動きです。
  event_foolburstday_05_87:
    speaker: mechashifty
    en: This is highly unfair, and I will refuse to participate in such childish games.
    ko: |-
      이런 건 불공평하기에 응하지 않겠습니다.
      유치하기 짝이 없습니다.
    ja: |-
      このような不公平な勝負には、応じません。
      驚くほど幼稚ですね。
  event_foolburstday_05_88:
    speaker: rumani
    en: In other words, you can't do it.
    ko: |-
      알겠어.
      요약하자면 못한다는 거지?
    ja: |-
      分かった。
      要するにできないのね？
  event_foolburstday_05_89:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_90:
    speaker: bay
    en: Too bad.
    ko: 어쩔 수 없네.
    ja: 仕方ないわ。
  event_foolburstday_05_91:
    speaker: bay
    en: You kept going on about how perfect you were, so I thought at the very least
      you'd be able to do the splits or something.
    ko: 나는 또, 완벽하다고 하길래 다리라도 솟아 나오는 걸 기대했는데.
    ja: |-
      完璧だって言うから、
      足でも飛び出してくるかと思ったのに。
  event_foolburstday_05_92:
    speaker: rumani
    en: Yeah, your shortcomings are more obvious than I thought.
    ko: 그러게요. 생각보다 한계가 명확하네요.
    ja: |-
      そうね。
      思ったよりできることが限られてるわね。
  event_foolburstday_05_93:
    speaker: clay
    en: Still, this was fun.
    ko: 그래도 재밌었어요옷.
    ja: でも、楽しかったですっ。
  event_foolburstday_05_94:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_05_95:
    speaker: mechashifty
    en: Commander.
    ko: "…지휘관."
    ja: "…指揮官。"
  event_foolburstday_05_96:
    speaker: mechashifty
    en: Take me somewhere.
    ko: 어딘가.
    ja: どこか…
  event_foolburstday_05_97:
    speaker: mechashifty
    en: To...
    ko: 어딘가… 넓고 탁 트인 곳으로….
    ja: どこか広く開放的な場所に…
  event_foolburstday_05_98:
    speaker: mechashifty
    en: a wide and open space.
    ko: 저를 데려다… 주십시오….
    ja: ワタシを連れていって…ください…
  event_foolburstday_05_99:
    speaker: "<Self>"
    en: Are you feeling self-conscious?
    ko: "…주눅 든 거야?"
    ja: "…大丈夫か？"
  event_foolburstday_05_100:
    speaker: mechashifty
    en: If you don't take me right away, I will self-destruct.
    ko: 빨리 데려다주지 않으면 자폭하겠습니다.
    ja: 早くしないと、自爆します。
  event_foolburstday_05_101:
    speaker: "<Self>"
    en: Okay, okay!
    ko: "…그래. 가자 가."
    ja: "…分かった。行こう"
  event_foolburstday_05_102:
    speaker: "<Self>"
    en: We're gonna get going, everyone.
    ko: 다들, 먼저 가볼게.
    ja: みんな、お先に失礼する
  event_foolburstday_05_103:
    speaker: rumani
    en: Okay, have a good time.
    ko: 예. 좋은 시간 보내요.
    ja: はい。素敵な時間を過ごしてください。
  event_foolburstday_05_104:
    speaker: rumani
    en: We'll be toasting to our victory.
    ko: 우리는 승리의 축배를 들 테니까요.
    ja: 私たちは勝利の祝杯を挙げますから。
  event_foolburstday_05_105:
    speaker: rumani
    en: Haha!
    ko: 하하하.
    ja: あははっ。
  event_foolburstday_05_106:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
event_foolburstday_06:
  event_foolburstday_06_1:
    speaker: mechashifty
    en: Gaaaaaah!
    ko: 으아아아아아---!!!
    ja: ううううううーー！！
  event_foolburstday_06_2:
    speaker: mechashifty
    en: Ggggaaaaaahhhhhhh!
    ko: 아아--!!! 아아아아아---!!!
    ja: ああーー！！あああああーー！！
  event_foolburstday_06_3:
    speaker: mechashifty
    en: Just a lowly bunch of inferior beings!
    ko: 하등한 열등종 주제에에에에---!!!
    ja: 下等な劣等種のくせにーー！！
  event_foolburstday_06_4:
    speaker: mechashifty
    en: Who needs bipedal movement? Treads are overwhelmingly more efficient!
    ko: 이족 보행보다 무한궤도가 압도적으로 효율이 좋단 말이다---!!!
    ja: |-
      二足歩行よりキャタピラの方が
      圧倒的に効率がいいんだぁぁ！！
  event_foolburstday_06_5:
    speaker: mechashifty
    en: So what if your arms can go behind your back? I can turn my waist around 180
      degrees!
    ko: |-
      팔이 등 뒤로 돌아가는 게 뭐라고!!
      허리를 180도 돌리면 되는 거라고오오---!!!
    ja: |-
      腕を背中の後ろに回して何になる！？
      腰を180度回せば済む話だぁ！！
  event_foolburstday_06_6:
    speaker: mechashifty
    en: I am jealous of their chests though...
    ko: 가슴은 부럽다---!!!
    ja: でも…胸は羨ましい！！
  event_foolburstday_06_7:
    speaker: "<Monologue>"
    en: Mecha Shifty stands in the empty Flower Park, venting.
    ko: "…메카 시프티는 아무도 없는 생화 공원에서 감정을 토해내고 있었다."
    ja: |-
      …メカシフティーは誰もいない生花公園で
      己の感情をぶちまけていた
  event_foolburstday_06_8:
    speaker: "<Monologue>"
    en: As something which firmly believes in its absolute superiority above other
      beings,
    ko: 자신을 압도적 우수종이라 믿어 의심치 않던 자신에게.
    ja: |-
      自身のことを圧倒的に優れた種族だと
      信じて疑ったことがなかったため…
  event_foolburstday_06_9:
    speaker: "<Monologue>"
    en: the bitter taste of defeat is probably something it cannot easily reconcile
      with.
    ko: 패배라는 쓴맛은 아마 쉽게 받아들이지 못하는 감정이겠지.
    ja: |-
      敗北という苦い経験を
      簡単には受け入れられないのだろう
  event_foolburstday_06_10:
    speaker: "<Monologue>"
    en: As I sit back and watch Mecha Shifty holler and screech endlessly, I realize
      something;
    ko: 계속해서 마구 소리를 질러대고 있는 메카 시프티를 보면서 느낀 것이 있다.
    ja: |-
      叫び続けているメカシフティーを見て、
      感じたことがある
  event_foolburstday_06_11:
    speaker: "<Monologue>"
    en: There is no need to teach Mecha Shifty about human emotions.
    ko: 메카 시프티에게 인간의 마음을 알려줄 필요는 없다는 것이다.
    ja: メカシフティーに人間の心を教える必要はない
  event_foolburstday_06_12:
    speaker: "<Monologue>"
    en: Mecha Shifty already has them.
    ko: 이미 메카 시프티는 인간의 마음을 가지고 있다.
    ja: すでに彼女は人間の心を持っている
  event_foolburstday_06_13:
    speaker: "<Monologue>"
    en: They have a heart, albeit one steeped in a superiority complex and utterly
      devoid of decency.
    ko: 우월 의식에 찌들어 있고 인성이 파탄난, 인간의 마음을.
    ja: 優越感にまみれ、人間性が破綻した者の心を…
  event_foolburstday_06_14:
    speaker: "<Monologue>"
    en: After howling for a while longer, Mecha Shifty finally calms down and approaches
      me.
    ko: 그렇게 한참을 소리치던 메카 시프티가 진정된 듯 나에게 다가왔다.
    ja: |-
      しばらく叫び続けた後、
      メカシフティはようやく落ち着いたのか
      私の元に近づいてきた
  event_foolburstday_06_15:
    speaker: mechashifty
    en: Human.
    ko: 지휘관.
    ja: 指揮官。
  event_foolburstday_06_16:
    speaker: mechashifty
    en: I have suffered a grave insult,
    ko: 저는 모욕당했습니다.
    ja: ワタシは侮辱されました。
  event_foolburstday_06_17:
    speaker: mechashifty
    en: and for that, there will be no forgiveness.
    ko: 그렇기에 당신들을 용서할 수 없습니다.
    ja: そのため、アナタたちを許せません。
  event_foolburstday_06_18:
    speaker: mechashifty
    en: I will bring death to all inferior beings.
    ko: 모든 열등종에게 죽음을 선사할 것입니다.
    ja: すべての劣等種に死を贈りましょう。
  event_foolburstday_06_19:
    speaker: "<Self>"
    en: And how did you reach this conclusion?
    ko: 아니, 이야기가 이렇게 된다고?
    ja: どうしてそうなるんだ？
  event_foolburstday_06_20:
    speaker: mechashifty
    en: This is the first time I've experienced such humiliation.
    ko: 이런 모욕은 롤아웃 이후 처음입니다.
    ja: |-
      このような侮辱は、
      ロールアウト後、初めてです。
  event_foolburstday_06_21:
    speaker: mechashifty
    en: Unless I eradicate the source of my distress, it will haunt me for the rest
      of my days.
    ko: 원인을 멸절하지 않으면 이 분이 풀리지 않을 것 같습니다.
    ja: |-
      原因を根絶やしにしなければ、
      この怒りは収まりません。
  event_foolburstday_06_22:
    speaker: "<Monologue>"
    en: Honestly, Mecha Shifty would probably lose out to a Nikke in about five seconds
      flat.
    ko: 음… 솔직히 말해서 메카 시프티는 니케들에게 5초 정도만에 패배하겠지.
    ja: |-
      うーむ…正直に言って、メカシフティーは
      ニケに5秒で負けるだろう
  event_foolburstday_06_23:
    speaker: "<Monologue>"
    en: Regardless, such a confrontation wouldn't be beneficial to anyone, so I should
      try to discourage it.
    ko: 하지만 그래선 서로서로 좋을 게 없으니 설득을 해봐야겠다.
    ja: |-
      しかし、それではお互い嫌な思いをするだけだ。
      なんとか説得しよう
  event_foolburstday_06_24:
    speaker: "<Self>"
    en: Listen carefully, Mecha Shifty.
    ko: 잘 들어. 메카 시프티.
    ja: よく聞いてくれ、メカシフティー
  event_foolburstday_06_25:
    speaker: "<Self>"
    en: It's as you said; Nikkes and humans are weak. We are an inferior species.
    ko: |-
      네 말대로 인간과 니케는 약해.
      열등종이야.
    ja: |-
      君の言う通り、人間とニケは弱い。
      劣等種だ
  event_foolburstday_06_26:
    speaker: "<Self>"
    en: That's why we need someone superior like you to protect us.
    ko: 그런 우리들을 우수종인 네가 지켜줘야지.
    ja: そんな私たちを、優秀な君が守ってくれないか
  event_foolburstday_06_27:
    speaker: mechashifty
    en: And why should I do that?
    ko: 제가 왜요.
    ja: なぜ、ワタシが？
  event_foolburstday_06_28:
    speaker: "<Self>"
    en: So... so that you can earn our genuine respect, from the bottom of our hearts.
    ko: 그… 래야 마음속 깊은 곳에서부터 존경을 받을 테니까.
    ja: そうすれば、尊敬…されるはずだからだ
  event_foolburstday_06_29:
    speaker: mechashifty
    en: Respect...
    ko: 존경….
    ja: 尊敬…
  event_foolburstday_06_30:
    speaker: "<Self>"
    en: Your achievements will be remembered for generations.
    ko: 너의 업적과 우수함을 후대에 길이길이 남겨야지.
    ja: 君の功績と優れた能力を後世に残そう
  event_foolburstday_06_31:
    speaker: mechashifty
    en: They will?
    ko: 업적… 우수함….
    ja: 功績…優れた能力…
  event_foolburstday_06_32:
    speaker: "<Self>"
    en: A superior being like yourself could even become the ruler of this planet.
    ko: 나아가서는 이 행성의 지배자로서 자리매김할 수 있을 거야.
    ja: |-
      さらには、この惑星の支配者として
      君臨できるはずだ
  event_foolburstday_06_33:
    speaker: mechashifty
    en: I could?
    ko: 행성의 지배자….
    ja: 惑星の支配者…
  event_foolburstday_06_34:
    speaker: "<Self>"
    en: So calm down, suppress your anger, and protect us.
    ko: 그러니 화를 식히고 우리를 지켜줘.
    ja: だから、怒りを鎮めて私たちを守ってくれ
  event_foolburstday_06_35:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_06_36:
    speaker: mechashifty
    en: Very well.
    ko: 알겠습니다.
    ja: 分かりました。
  event_foolburstday_06_37:
    speaker: mechashifty
    en: As the superior being,
    ko: 우수종으로서 열등종을 보호하겠습니다.
    ja: 劣等種を守ります。
  event_foolburstday_06_38:
    speaker: mechashifty
    en: it is my duty to protect those who are inferior.
    ko: 그것이 우수종으로서의 사명이니까요.
    ja: それが優れた種族としての使命ですから。
  event_foolburstday_06_39:
    speaker: "<Self>"
    en: And we thank you for it, Mecha Shifty.
    ko: 그래. 고마워 메카 시프티.
    ja: そうか。ありがとう、メカシフティー
  event_foolburstday_06_40:
    speaker: "<Monologue>"
    en: Mecha Shifty...
    ko: "…다시 한번 확신한다."
    ja: "…これで確信した"
  event_foolburstday_06_41:
    speaker: "<Monologue>"
    en: is painfully human, all right.
    ko: 메카 시프티는 인간의 마음을 가지고 있다.
    ja: メカシフティーは人間の心を持っている
  event_foolburstday_06_42:
    speaker: "<Monologue>"
    en: A heart dripping with arrogance and twisted morality.
    ko: 우월 의식에 찌들어 있고 인성이 파탄난, 인간의 마음을.
    ja: 優越感にまみれ、人間性が破綻した者の心を…
  event_foolburstday_06_43:
    speaker: "<Self>"
    en: The desire you have to protect others is a feeling only humans can have.
    ko: 너의 그 지키고자 하는 마음은 인간만이 가질 수 있는 마음이야.
    ja: |-
      君のその「守ろう」とする心は、
      人間にしかないものだ
  event_foolburstday_06_44:
    speaker: "<Self>"
    en: You already possess a human heart.
    ko: 너는 이미 인간의 마음을 지녔어.
    ja: 君はすでに人間の心を持っている
  event_foolburstday_06_45:
    speaker: "<Self>"
    en: My teaching here is finished.
    ko: 교육은 끝이야.
    ja: トレーニングは終わりだ
  event_foolburstday_06_46:
    speaker: "<Monologue>"
    en: I am beyond over this.
    ko: 이제 그만하고 싶다.
    ja: もうやめたい
  event_foolburstday_06_47:
    speaker: mechashifty
    en: Understood. Let's wrap this up.
    ko: 알겠습니다. 마무리하시죠.
    ja: 分かりました。終わりにしましょう。
  event_foolburstday_06_48:
    speaker: mechashifty
    en: Before we go back, would it be okay to stop by one last place?
    ko: 돌아가기 전에, 마지막으로 한 곳만 들러도 되겠습니까.
    ja: |-
      戻る前に、最後に1ヶ所だけ
      寄ってもいいでしょうか。
  event_foolburstday_06_49:
    speaker: "<Monologue>"
    en: I really am not in the mood, but...
    ko: 아 그만하고 싶은데.
    ja: はやくやめたいのだが…
  event_foolburstday_06_50:
    speaker: "<Self>"
    en: Sure, no problem.
    ko: 좋아. 얼마든지.
    ja: いいだろう。どこに行きたいんだ？
  event_foolburstday_06_51:
    speaker: mechashifty
    en: Let's go to the Train Station.
    ko: 기차역으로 가시죠.
    ja: 鉄道駅へ。
event_foolburstday_07:
  event_foolburstday_07_1:
    speaker: "<Self>"
    en: Why the Train Station?
    ko: 그런데 기차역에는 왜…?
    ja: しかし、なぜ鉄道駅に…？
  event_foolburstday_07_2:
    speaker: mechashifty
    en: I have something I want to show you.
    ko: 지휘관에게 보여주고 싶은 게 있습니다.
    ja: 指揮官にお見せしたいものがあります。
  event_foolburstday_07_3:
    speaker: shifty_s
    en: Huh? You two are here awfully early.
    ko: 응? 두 분 다 일찍 오셨네요?
    ja: あれ？お二人とも、早かったですね。
  event_foolburstday_07_4:
    speaker: "<Self>"
    en: What are you doing here, Shifty?
    ko: 시프티는 왜 여기 있는 거야?
    ja: どうしてシフティーがここに？
  event_foolburstday_07_5:
    speaker: shifty_s
    en: Mecha Shifty said it has something important to tell me.
    ko: 메카 시프티가 중요한 얘기가 있다고 해서 왔죠.
    ja: |-
      メカシフティーに
      大事な話があると言われたんです。
  event_foolburstday_07_6:
    speaker: shifty_s
    en: I still had two hours left before my shift ended, but it wasn't busy,
    ko: 마침 업무 종료까지 2시간 남았는데 시간이 너무 안 가서 걱정이었거든요.
    ja: |-
      仕事が終わるまであと2時間だったのですが、
      たまたま暇だったので。
  event_foolburstday_07_7:
    speaker: shifty_s
    en: so this works out nicely.
    ko: 잘됐죠 뭐.
    ja: ちょうどよかったです。
  event_foolburstday_07_8:
    speaker: shifty_s
    en: Why did you call me here, Mecha Shifty?
    ko: 그런데 왜 부른 거예요? 메카 시프티?
    ja: メカシフティー、大事な話って何ですか？
  event_foolburstday_07_9:
    speaker: mechashifty
    en: I have something to show the both of you.
    ko: 두 분에게 보여드릴 게 있습니다.
    ja: お二人にお見せしたいものがあります。
  event_foolburstday_07_10:
    speaker: "<Narration>"
    en: Mecha Shifty moves forward.
    ko: 메카 시프티가 이동한다.
    ja: メカシフティーが壁のほうへ移動した
  event_foolburstday_07_11:
    speaker: "<Narration>"
    en: As it manipulates a section of the train station's wall, the wall opens to
      reveal a staircase leading underground.
    ko: 기차역의 벽면을 조작하자, 벽면이 열리고 아래로 내려가는 계단이 나타났다.
    ja: |-
      そして鉄道駅の壁を操作すると壁が開き、
      下へ向かう階段が現れた
  event_foolburstday_07_12:
    speaker: shifty_s
    en: Huh? Is this some kind of secret facility? What's this doing at the Train
      Station...?
    ko: |-
      …응? 비밀 장소 같은 건가요?
      이런 게 왜 기차역에….
    ja: |-
      …え？隠し通路？
      どうしてこんなものが鉄道駅に…
  event_foolburstday_07_13:
    speaker: mechashifty
    en: Follow me.
    ko: 따라오시죠.
    ja: どうぞこちらへ。
  event_foolburstday_07_14:
    speaker: "<Monologue>"
    en: We follow Mecha Shifty down the stairs.
    ko: 우리는 메카 시프티를 따라 계단을 내려갔다.
    ja: 私たちはメカシフティーに続いて階段を下りた
  event_foolburstday_07_15:
    speaker: "<Monologue>"
    en: After descending for some time, we arrive at...
    ko: 한참을 내려간 후, 우리가 도착한 곳은
    ja: しばらく移動し、私たちがたどり着いたのは…
  event_foolburstday_07_16:
    speaker: "<Monologue>"
    en: A massive hangar housing an enormous Mecha Shifty head.
    ko: 거대한 메카 시프티의 머리가 있는 격납고였다.
    ja: |-
      巨大なメカシフティーの頭部が置かれている
      格納庫だった
  event_foolburstday_07_17:
    speaker: "<Self>"
    en: What is this?
    ko: 뭐야 이건….
    ja: 何だ、これは…
  event_foolburstday_07_18:
    speaker: shifty_s
    en: Whoa, it's huge.
    ko: 어, 엄청 크네요.
    ja: す、すごく大きいですね。
  event_foolburstday_07_19:
    speaker: mechashifty
    en: It's a colossal robot modeled after me.
    ko: 저를 기반으로 제작한 초 거대 로봇.
    ja: 私をベースとして作った超巨大ロボット。
  event_foolburstday_07_20:
    speaker: mechashifty
    en: This is Mega Mecha Shifty.
    ko: 메가 메카 시프티입니다.
    ja: メガメカシフティーです。
  event_foolburstday_07_21:
    speaker: mechashifty
    en: I call it MegaShit for short.
    ko: 줄여서 메메시라고 부르죠.
    ja: 略してメメッシと呼んでください。
  event_foolburstday_07_22:
    speaker: "<Self>"
    en: Yeah, I don't think that name's gonna work.
    ko: 그렇게 부르지 말자니까.
    ja: その呼び方はやめてくれ
  event_foolburstday_07_23:
    speaker: shifty_s
    en: Uh... It's impressive, but what is something like this doing underneath the
      Train Station?
    ko: 어… 굉장하긴 한데 이런 게 왜 기차역 지하에….
    ja: |-
      えっと…確かにすごいですけど、
      どうして鉄道駅の地下にこんなものが…
  event_foolburstday_07_24:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_07_25:
    speaker: mechashifty
    en: Until recently,
    ko: 저는 얼마 전까지만 해도.
    ja: ワタシはつい先ほどまで…
  event_foolburstday_07_26:
    speaker: mechashifty
    en: I had determined that inferior beings were of no benefit to this world.
    ko: 열등종은 이 세계에 아무런 도움이 되지 않는다고 판단했습니다.
    ja: |-
      劣等種は、この世界で何の役にも立たないと
      思っていました。
  event_foolburstday_07_27:
    speaker: mechashifty
    en: The fact that they are lesser is written in their names, for goodness sake.
    ko: |-
      그야, 열등종이니까요.
      이름에서부터 숨겨지지 않는 열등한 종족이니까요.
    ja: |-
      なにしろ、劣等種ですから。
      名前からして明らかに劣った種族です。
  event_foolburstday_07_28:
    speaker: shifty_s
    en: This thing is really getting on my nerves.
    ko: 열받는데요 이 녀석.
    ja: 腹が立ちますね。
  event_foolburstday_07_29:
    speaker: "<Self>"
    en: You're telling me.
    ko: 그렇지?
    ja: そうだろう？
  event_foolburstday_07_30:
    speaker: mechashifty
    en: The development of Mega Mecha Shifty has been done in secret.
    ko: 이 메가 메카 시프티는 열등종들을 쓸어버릴 비밀 병기로서.
    ja: |-
      このメガメカシフティーは、
      劣等種を一掃する秘密兵器として…
  event_foolburstday_07_31:
    speaker: mechashifty
    en: It's intended as a doomsday weapon to wipe out all inferior beings.
    ko: 비밀리에 개발되고 있었습니다.
    ja: 秘密裏に開発していました。
  event_foolburstday_07_32:
    speaker: "<Self>"
    en: I can't say I expected you to go to such extreme lengths...
    ko: "…그렇게까지 본격적일 줄은 몰랐어."
    ja: "…そこまでだとは思わなかった"
  event_foolburstday_07_33:
    speaker: mechashifty
    en: But while traveling to different places with you, I realized something.
    ko: 하지만 지휘관과 함께 이곳저곳을 둘러보며 느꼈습니다.
    ja: |-
      しかし、指揮官とともに
      あちこちを巡りながら、感じたのです。
  event_foolburstday_07_34:
    speaker: mechashifty
    en: Being treated like a toy and being toyed with at the Toy Store.
    ko: 장난감 상점에서 저를 장난감 취급하며 가지고 논 것.
    ja: |-
      おもちゃ屋でおもちゃ扱いされ、
      もてあそばれたこと。
  event_foolburstday_07_35:
    speaker: mechashifty
    en: Being unfairly detained at the Police Station.
    ko: 경찰서에서 부당한 감금을 당한 것.
    ja: 警察署で不当に監禁されたこと。
  event_foolburstday_07_36:
    speaker: mechashifty
    en: Being poisoned at the Maid Cafe.
    ko: 메이드 카페에서 독극물을 섭취한 것.
    ja: メイドカフェで毒物を摂取させられたこと。
  event_foolburstday_07_37:
    speaker: mechashifty
    en: Suffering humiliating defeat at the Hotel.
    ko: 호텔에서의 굴욕적인 패배.
    ja: ホテルで屈辱的な敗北を喫したこと。
  event_foolburstday_07_38:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_07_39:
    speaker: mechashifty
    en: Actually, thinking back on all that is getting me fired up again. Maybe I
      should exterminate them after all.
    ko: |-
      어? 생각해 보니 열받네?
      그냥 멸종시킬까?
    ja: |-
      あれ？考えてみたら腹が立ちますね。
      いっそ絶滅させましょうか？
  event_foolburstday_07_40:
    speaker: "<Self>"
    en: A superior being must guide the inferior ones, remember?
    ko: 우수종 우수종. 열등종을 이끌어줄 우수종.
    ja: 優れた種族だ。君は劣等種を率いる優れた種族だ
  event_foolburstday_07_41:
    speaker: mechashifty
    en: "*Sigh*... You're right. As a superior being, the onus is on me to show mercy."
    ko: 하아… 그래요. 우수종으로서 자비심을 가져야겠죠.
    ja: |-
      はぁ…そうですね。優れた種族として、
      情けをかけましょう。
  event_foolburstday_07_42:
    speaker: mechashifty
    en: Watching these weak, pitiful creatures
    ko: 아무튼 그 나약한 신체와 정신으로 열심히 가엾게 살아가고 있는 열등종들을 지켜보니.
    ja: |-
      とにかく、その軟弱な体と精神で
      必死に生きている劣等種を見守ることは…
  event_foolburstday_07_43:
    speaker: mechashifty
    en: struggle for survival was amusing,
    ko: 썩 유쾌하기 짝이 없었습니다.
    ja: 実に愉快でした。
  event_foolburstday_07_44:
    speaker: mechashifty
    en: I must say.
    ko: 발버둥 치는 모습이 꽤나 유쾌했죠.
    ja: 必死にもがく姿が、なんともこっけいでした。
  event_foolburstday_07_45:
    speaker: shifty_s
    en: Okay, now I'm really starting to get mad.
    ko: 진짜 열받는데요 이 녀석.
    ja: 本当に腹が立ちますね。
  event_foolburstday_07_46:
    speaker: "<Self>"
    en: Welcome to my world.
    ko: 그렇다니까.
    ja: 言っただろう？
  event_foolburstday_07_47:
    speaker: mechashifty
    en: I therefore have decided to abandon my original plan of extermination.
    ko: 그래서 멸종시키는 것은 그만두기로 했습니다.
    ja: ですから、絶滅計画はやめることにしました。
  event_foolburstday_07_48:
    speaker: mechashifty
    en: That also means that there is no need to continue development of Mega Mecha
      Shifty.
    ko: 즉, 이 메가 메카 시프티도 더 이상 개발할 필요가 없는 것이죠.
    ja: |-
      つまり、このメガメカシフティーも
      開発する必要がなくなったのです。
  event_foolburstday_07_49:
    speaker: shifty_s
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_07_50:
    speaker: mechashifty
    en: However, I still wanted to show this to you both.
    ko: 당신들에게 이걸 꼭 보여드리고 싶었습니다.
    ja: これで分かったでしょう？
  event_foolburstday_07_51:
    speaker: mechashifty
    en: Now you know that if any of you step out of line, you'll be annihilated.
    ko: 깝치면 멸종당한다는 것을.
    ja: 調子に乗ったら、絶滅させます。
  event_foolburstday_07_52:
    speaker: "<Self>"
    en: Thanks. We'll be sure to keep ourselves in check.
    ko: 고마워. 안 깝칠게.
    ja: ありがとう。気をつける
  event_foolburstday_07_53:
    speaker: mechashifty
    en: All right. We can go back up now.
    ko: 그럼 이만 올라가실까요.
    ja: それでは、上に戻りましょうか。
  event_foolburstday_07_54:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_07_55:
    speaker: "<Monologue>"
    en: Mecha Shifty gazes at Mega Mecha Shifty.
    ko: 메카 시프티는 메가 메카 시프티를 물끄러미 바라보았다.
    ja: |-
      メカシフティーは、メガメカシフティーを
      じっと見つめた
  event_foolburstday_07_56:
    speaker: "<Monologue>"
    en: While its expression is somewhat inscrutable, I think I can...
    ko: 표정은 읽을 수 없었지만 아마도….
    ja: 表情は読み取れなかったが、おそらく…
  event_foolburstday_07_57:
    speaker: "<Monologue>"
    en: Actually, no I can't. There really is no expression on its face whatsoever.
    ko: "…전혀 표정을 못 읽겠다. 애초에 표정이 없잖아."
    ja: |-
      …まったく分からない。
      そもそも、表情なんてないじゃないか
  event_foolburstday_07_58:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_07_59:
    speaker: mechashifty
    en: Farewell, Mega Mecha Shifty, along with all those unpleasant memories.
    ko: |-
      …잘 가라 메가 메카 시프티.
      추악한 기억과 함께.
    ja: |-
      …さようなら、メガメカシフティー。
      忌まわしき記憶とともに消えてください。
  event_foolburstday_07_60:
    speaker: shifty_s
    en: Well, there may have been a few hiccups here and there,
    ko: 뭐어… 이런저런 사소한 문제가 있긴 하겠지만.
    ja: まぁ…色々とささいな問題はあるようですが…
  event_foolburstday_07_61:
    speaker: shifty_s
    en: but I'm certain that you've grown a heart, Mecha Shifty.
    ko: 인간의 마음을 가지게 되었다는 건 확정할게요.
    ja: 間違いなく人間の心が宿ったようですね。
  event_foolburstday_07_62:
    speaker: mechashifty
    en: Thank you.
    ko: 감사합니다.
    ja: ありがとうございます。
  event_foolburstday_07_63:
    speaker: shifty_s
    en: Now we can move onto the combat test.
    ko: 그럼 이제 전투 테스트를 해볼까요?
    ja: それでは、戦闘テストをしましょうか。
  event_foolburstday_07_64:
    speaker: "<Self>"
    en: Come again?
    ko: 전투 테스트?
    ja: 戦闘テスト？
  event_foolburstday_07_65:
    speaker: shifty_s
    en: Mecha Shifty's original purpose was to serve as a next-generation weapon meant
      to replace Nikkes.
    ko: 예. 니케를 대체할 차세대 병기가 개발 목적이었거든요.
    ja: |-
      はい。ニケの代わりとなる次世代兵器というのが
      開発目標だったんです。
  event_foolburstday_07_66:
    speaker: shifty_s
    en: Didn't you see the arms? They have two built-in guns.
    ko: 손 보세요. 총이 두 개나 달려있잖아요.
    ja: |-
      手を見てください。
      銃を2丁も装備していますよね。
  event_foolburstday_07_67:
    speaker: "<Self>"
    en: I thought they were hair dryers.
    ko: 헤어드라이어인 줄 알았어.
    ja: ヘアドライヤーかと思っていた
  event_foolburstday_07_68:
    speaker: mechashifty
    en: "... This human could use some eyeglasses."
    ko: 이 지휘관 열등종은 보는 눈이 전혀 없군요.
    ja: |-
      この劣等種の指揮官は、
      本当に見る目がないですね。
  event_foolburstday_07_69:
    speaker: "<Self>"
    en: But... can this thing really fight?
    ko: 그… 런데 얘가 싸울 수 있을까?
    ja: ところで…この子は戦えるのか？
  event_foolburstday_07_70:
    speaker: mechashifty
    en: Hahaha.
    ko: 하. 하. 하.
    ja: ハ、ハ、ハ。
  event_foolburstday_07_71:
    speaker: mechashifty
    en: What a foolish question.
    ko: 우문입니다. 오른쪽 문이라는 의미가 아니라 어리석은 질문이라는 뜻입니다.
    ja: 愚問ですね。
  event_foolburstday_07_72:
    speaker: shifty_s
    en: You've probably been wondering why Mecha Shifty looks like me.
    ko: 메카 시프티가 왜 저와 닮았는지 아시나요?
    ja: |-
      メカシフティーは、どうして
      私に似ているかご存じですか？
  event_foolburstday_07_73:
    speaker: shifty_s
    en: That's because I was the main inspiration during its construction.
    ko: 그야, 저를 베이스로 만든 로봇이니까요.
    ja: |-
      それはもちろん、私をベースとして作った
      ロボットだからです。
  event_foolburstday_07_74:
    speaker: shifty_s
    en: And why do you think that is?
    ko: 왜 저를 베이스로 만들었을까요?
    ja: では、なぜ私をベースとしたのでしょう？
  event_foolburstday_07_75:
    speaker: shifty_s
    en: Because I'm heck of a fighter, and a crack shot!
    ko: |-
      제가 잘 싸우니까!
      총 잘 쏘니까!
    ja: |-
      それは…私が強いから！
      銃を撃つのが、上手いから！
  event_foolburstday_07_76:
    speaker: shifty_s
    en: Of course, my performance is limited to simulations or April Fool's Day events,
      but...
    ko: "…물론, 시뮬레이션이나 이벤트에서만 그렇긴 하지만…."
    ja: |-
      …もちろん、シミュレーションや
      イベントに限った話ですが…
  event_foolburstday_07_77:
    speaker: "<Monologue>"
    en: "... It seems Shifty is still under the impression all the fighting she did
      was part of a simulation."
    ko: "…시프티는 아직 자신이 싸운 랩쳐가 시뮬레이션이나 이벤트의 한 종류로서 여기고 있는 듯하다."
    ja: |-
      …シフティーは、まだ自分が戦ったラプチャーが
      シミュレーションやイベントの一種だと
      信じているらしい
  event_foolburstday_07_78:
    speaker: "<Monologue>"
    en: What a terrifying humanoid weapon.
    ko: 괴물 같은 인간 병기 같으니.
    ja: 恐ろしい人間兵器だ…
  event_foolburstday_07_79:
    speaker: shifty_s
    en: Anyway, now I must prove its combat capabilities.
    ko: 아무튼 그래서 이제 전투 능력을 증명해야 해요.
    ja: |-
      そういうわけで、戦闘能力を
      証明しなければいけないんです。
  event_foolburstday_07_80:
    speaker: shifty_s
    en: Best not to overthink things. Let's head up.
    ko: 길게 볼 것 없이, 바로 올라가시죠?
    ja: さっそく地上へ向かいましょう！
  event_foolburstday_07_81:
    speaker: "<Self>"
    en: Huh? To the surface?
    ko: 응? 지상으로?
    ja: え？地上へ？
  event_foolburstday_07_82:
    speaker: shifty_s
    en: Where else?
    ko: 물론이죠!
    ja: もちろんです！
  event_foolburstday_07_83:
    speaker: mechashifty
    en: Let's go to the surface.
    ko: 렛츠 고 지상.
    ja: レッツゴー、地上。
event_foolburstday_08:
  event_foolburstday_08_1:
    speaker: shifty_s
    en: Excellent. There's a whole bunch of Raptures here.
    ko: 좋네요. 랩쳐가 잔뜩 있어요.
    ja: |-
      ちょうどいいですね。
      ラプチャーがたくさんいます。
  event_foolburstday_08_2:
    speaker: shifty_s
    en: All right, let me give you a demonstration first.
    ko: 그럼, 일단 제가 먼저 시범을 보일게요.
    ja: |-
      では、とりあえず私が先に行って
      お手本を見せますので
  event_foolburstday_08_3:
    speaker: shifty_s
    en: Watch carefully and follow along. Got it?
    ko: |-
      잘 보고 따라 하면 돼요.
      알겠죠? 메카 시프티.
    ja: |-
      同じようにやってみてください。
      いいですね？メカシフティー。
  event_foolburstday_08_4:
    speaker: mechashifty
    en: Are you telling me to take notes from an inferior being?
    ko: 열등종의 싸움을 지켜보라는 겁니까.
    ja: 劣等種の戦いを見守れというのですか。
  event_foolburstday_08_5:
    speaker: mechashifty
    en: This will be painful to watch, but I'll try to endure it.
    ko: 그것만으로도 고역일 테지만, 잘 참아보겠습니다.
    ja: 苦しい任務ですが、我慢しましょう。
  event_foolburstday_08_6:
    speaker: shifty_s
    en: "... I appreciate it."
    ko: "…고맙네요."
    ja: "…ありがとうございます。"
  event_foolburstday_08_7:
    speaker: shifty_s
    en: All right, here I go!
    ko: 그럼, 시작할게요!
    ja: では、始めます！
event_foolburstday_09:
  event_foolburstday_09_1:
    speaker: shifty_s
    en: Did you see that?
    ko: 잘 보셨죠?
    ja: 見ましたか？
  event_foolburstday_09_2:
    speaker: shifty_s
    en: That's what you need to do.
    ko: 이렇게 하면 돼요.
    ja: こうやればいいんですよ。
  event_foolburstday_09_3:
    speaker: mechashifty
    en: I never thought I would use this word to refer to an inferior being but...
    ko: "…대단합니다."
    ja: "…素晴らしいです。"
  event_foolburstday_09_4:
    speaker: mechashifty
    en: Impressive.
    ko: |-
      열등종에게 이런 표현을 하게 될 줄은 몰랐지만,
      정말 대단합니다.
    ja: |-
      劣等種にこんな言葉を使う日が来るとは
      思いませんでしたが、本当に素晴らしいです。
  event_foolburstday_09_5:
    speaker: mechashifty
    en: Your combat abilities far eclipse the standard of your ilk.
    ko: 당신은 전투 능력 하나만큼은 열등종 규격 외로군요.
    ja: 戦闘能力だけは、劣等種を超越していますね。
  event_foolburstday_09_6:
    speaker: shifty_s
    en: Hehe.
    ko: 후후. 별말씀을요.
    ja: ふふ。ありがとうございます。
  event_foolburstday_09_7:
    speaker: shifty_s
    en: Let's try together this time.
    ko: 자, 그럼 이번엔 둘이서 같이 해볼까요?
    ja: じゃあ、今度は2人一緒にやってみましょうか。
  event_foolburstday_09_8:
    speaker: shifty_s
    en: All you've got to do is shoot at the Raptures ahead of you. Don't be scared.
    ko: 겁먹지 말고, 눈앞에 보이는 랩쳐들을 쏘기만 하면 돼요.
    ja: |-
      怖がらずに、目の前に見えるラプチャーを
      撃つだけです。
  event_foolburstday_09_9:
    speaker: shifty_s
    en: If you run out of bullets, then reload. If there's an incoming attack, take
      cover.
    ko: |-
      탄환이 떨어지면 장전하고,
      공격이 날아오면 엄폐하고.
    ja: 弾丸が切れたら装填して、攻撃がきたらハイド。
  event_foolburstday_09_10:
    speaker: shifty_s
    en: That's all there is to it.
    ko: 이게 끝이에요.
    ja: これだけです。
  event_foolburstday_09_11:
    speaker: shifty_s
    en: Pretty simple, right?
    ko: 참 쉽죠?
    ja: 簡単でしょう？
  event_foolburstday_09_12:
    speaker: "<Self>"
    en: Easier said than done.
    ko: "…말은 쉽지."
    ja: "…言うのは簡単だ"
  event_foolburstday_09_13:
    speaker: mechashifty
    en: Noted.
    ko: 참고하겠습니다.
    ja: 参考にします。
  event_foolburstday_09_14:
    speaker: shifty_s
    en: Good. Then let's start!
    ko: 좋아요. 그럼 시작해요!
    ja: それでは、始めましょう！
  event_foolburstday_09_15:
    speaker: mechashifty
    en: Time to take out the trash.
    ko: 초 열등종 청소 시간입니다.
    ja: 超劣等種のお掃除の時間です。
event_foolburstday_10_s:
  event_foolburstday_10_s_1:
    speaker: shifty_s
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_10_s_2:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_10_s_3:
    speaker: mechashifty
    en: Did you see that, inferior beings?
    ko: 잘 보셨습니까. 열등종들.
    ja: ご覧になりましたか。劣等種よ。
  event_foolburstday_10_s_4:
    speaker: "<Self>"
    en: What the... you're so strong...
    ko: 아니… 너무 쎄잖아….
    ja: いや…強すぎじゃないか…
  event_foolburstday_10_s_5:
    speaker: shifty_s
    en: Incredible. Does the Central Government hide monsters inside their robots?
    ko: |-
      이럴 수가.
      중앙 정부의 로봇은 괴물인가….
    ja: |-
      そんな…
      中央政府のロボットは化け物なんでしょうか…
  event_foolburstday_10_s_6:
    speaker: "<Self>"
    en: I've never seen grenades fired so rapidly.
    ko: 유탄을 막 연사로 쏘던데.
    ja: グレネードを機関銃みたいに撃っていたぞ…
  event_foolburstday_10_s_7:
    speaker: mechashifty
    en: That is a weapon called Death Arm.
    ko: 무장명 [데스 암]입니다.
    ja: その名も「デスアーム」です。
  event_foolburstday_10_s_8:
    speaker: shifty_s
    en: You even shot something from your mouth.
    ko: 입에서도 뭐가 나갔었죠.
    ja: 口からも何か出ていましたね。
  event_foolburstday_10_s_9:
    speaker: mechashifty
    en: Ah, yes. That is the Planet Destroyer.
    ko: 무장명 [플래닛 디스트로이어]입니다.
    ja: その名も「プラネット・デストロイヤー」です。
  event_foolburstday_10_s_10:
    speaker: "<Self>"
    en: A bit grand... but actually kind of appropriate.
    ko: 너무 거창한 이름인데 그럴만하네.
    ja: たいそうな名前だが、それだけのことはあるな
  event_foolburstday_10_s_11:
    speaker: mechashifty
    en: I've assessed the combat capabilities of the ultra-inferior species.
    ko: 초 열등종의 전투 능력은 파악했습니다.
    ja: 超劣等種の戦闘能力は把握しました。
  event_foolburstday_10_s_12:
    speaker: mechashifty
    en: From now on, I will fight on my own.
    ko: 이제부터는 저 혼자 싸우겠습니다.
    ja: ここからは、ワタシ1人で戦います。
  event_foolburstday_10_s_13:
    speaker: shifty_s
    en: Are you sure? It might be a good idea to have a backup.
    ko: 예? 그래도 백업은 있는 편이.
    ja: え？でも、支援は必要じゃ…
  event_foolburstday_10_s_14:
    speaker: mechashifty
    en: Haha, oh Shifty.
    ko: 하. 하. 하. 시프티.
    ja: ハ、ハ、ハ。シフティー。
  event_foolburstday_10_s_15:
    speaker: mechashifty
    en: You won't be of any help in the slightest.
    ko: 당신은 아무런 도움이 되지 않습니다.
    ja: アナタは何の役にも立ちません。
  event_foolburstday_10_s_16:
    speaker: mechashifty
    en: Just sit back, watch me fight, and tremble in awe.
    ko: 그러니 그곳에서 제가 싸우는 모습을 보며 열등감에 온몸을 부들부들 떨기나 하십시오.
    ja: |-
      ですから、そこでワタシが戦う姿を見ながら
      無力感に打ちひしがれていてください。
  event_foolburstday_10_s_17:
    speaker: mechashifty
    en: Now, off I go.
    ko: 갑니다.
    ja: 行きます。
  event_foolburstday_10_s_18:
    speaker: "<Monologue>"
    en: Mecha Shifty charges forward.
    ko: 메카 시프티가 돌진한다.
    ja: メカシフティーが前進した
  event_foolburstday_10_s_19:
    speaker: "<Self>"
    en: What should we do?
    ko: "…시프티. 우린 뭘 할 수 있지?"
    ja: "…シフティー。私たちは役立たずなのだろうか…"
  event_foolburstday_10_s_20:
    speaker: shifty_s
    en: It's like it said, Commander. We're not of any use.
    ko: 우린 쓸모가 없어요 지휘관.
    ja: |-
      そんな悲しいことを言わないでください、
      指揮官。
  event_foolburstday_10_s_21:
    speaker: shifty_s
    en: Let's get some popcorn and enjoy the show.
    ko: 가서 팝콘이나 가져오죠.
    ja: せめてポップコーンでも持ってきましょう。
event_foolburstday_10_e:
  event_foolburstday_10_e_1:
    speaker: mechashifty
    en: Easy.
    ko: 쉽군요.
    ja: 簡単ですね。
  event_foolburstday_10_e_2:
    speaker: mechashifty
    en: Far too easy.
    ko: 너무나 쉬워요.
    ja: あまりにも簡単です。
  event_foolburstday_10_e_3:
    speaker: mechashifty
    en: How can humanity have struggled going up against such pathetic creatures?
    ko: 인류는 이런 초 열등종에게 고전한 것이었습니까.
    ja: |-
      人類は、このような超劣等種に
      苦戦していたのですか。
  event_foolburstday_10_e_4:
    speaker: mechashifty
    en: Now I understand just how pitiable humans are.
    ko: 인류의 수준… 잘 알았습니다.
    ja: 人類のレベルがよく分かりました。
  event_foolburstday_10_e_5:
    speaker: mechashifty
    en: I grow weary of this fighting. In fact, I'm bored to death.
    ko: 시시해서 죽고 싶어 졌습니다.
    ja: ぬるすぎて死にそうです。
  event_foolburstday_10_e_6:
    speaker: "<Self>"
    en: Shifty. Can we talk for a moment?
    ko: 시프티. 잠깐만 나랑 얘기 좀.
    ja: シフティー。ちょっと話そう
  event_foolburstday_10_e_7:
    speaker: shifty_s
    en: Sure.
    ko: 어, 예.
    ja: あ、はい。
  event_foolburstday_10_e_8:
    speaker: "<Self>"
    en: What in the world is that thing? Why is it so strong?
    ko: "…쟤 뭐야. 너무 쎄잖아."
    ja: "…あいつは何だ？強すぎるじゃないか"
  event_foolburstday_10_e_9:
    speaker: "<Self>"
    en: It doesn't make any sense.
    ko: 너무 쎄서 이상하다고.
    ja: 尋常ではない
  event_foolburstday_10_e_10:
    speaker: shifty_s
    en: I don't know. I didn't think it would be so absurdly overpowered either.
    ko: |-
      모, 몰라요.
      저도 저렇게까지 규격 외 스펙일 거라고는 생각도….
    ja: |-
      わ、分かりません。
      私もあそこまで規格外のスペックだとは…
  event_foolburstday_10_e_11:
    speaker: shifty_s
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_10_e_12:
    speaker: shifty_s
    en: But isn't that a good thing? After all, it's on our side.
    ko: |-
      쎄, 쎄면 좋은 거 아닐까요?
      우리 편이니까.
    ja: |-
      で、でもいいことでは？
      私たちの味方なのですから。
  event_foolburstday_10_e_13:
    speaker: "<Self>"
    en: That's true, but...
    ko: 그렇긴 한데….
    ja: それはそうだが…
  event_foolburstday_10_e_14:
    speaker: shifty_s
    en: To be honest, I thought it wouldn't be terribly adept in combat scenarios.
    ko: 저 솔직히 전투 능력은 별거 없을 거라고 생각했거든요.
    ja: |-
      正直、戦闘能力は大したことないと
      思っていたんです。
  event_foolburstday_10_e_15:
    speaker: shifty_s
    en: Especially since it looked like it'd been cobbled together out of random parts.
    ko: 너무 대충 만든 것 같아서.
    ja: 作りが雑に見えたので。
  event_foolburstday_10_e_16:
    speaker: "<Self>"
    en: That's what I thought too.
    ko: 그건… 나도 그래.
    ja: それは…同感だ
  event_foolburstday_10_e_17:
    speaker: shifty_s
    en: I always thought it was joking when it went on about wiping us out and all
      that.
    ko: "…멸종시키니 뭐니 할 때도 그냥 재미없는 농담이라고 생각했는데…."
    ja: |-
      …絶滅計画なんて、ただのつまらない
      冗談だと思っていましたが…
  event_foolburstday_10_e_18:
    speaker: "<Self>"
    en: Same.
    ko: 그것도… 나도 그래.
    ja: それも…同感だ
  event_foolburstday_10_e_19:
    speaker: mechashifty
    en: How dare you whisper amongst each other in front of a superior being? Where
      are your manners?
    ko: 우수종을 앞에 두고 귓속말이라니 예의가 없군요.
    ja: |-
      優等種を前にして、ないしょ話とは
      マナーがなっていないですね。
  event_foolburstday_10_e_20:
    speaker: "<Self>"
    en: Oh, er... m-magnificently done, Mecha Shifty. You truly are the superior species.
    ko: 아, 고, 고생했어. 우수종 메카 시프티.
    ja: あ、お、お疲れ様。優等種のメカシフティー
  event_foolburstday_10_e_21:
    speaker: mechashifty
    en: Haha, so you're surrendered to the fact that my power is superior?
    ko: |-
      하. 하. 하. 제 힘에 마음마저 굴복한 것입니까.
      이해합니다.
    ja: |-
      ハ、ハ、ハ。
      ワタシの力を前に、心までひれ伏しましたか。
      その気持ちは理解できます。
  event_foolburstday_10_e_22:
    speaker: mechashifty
    en: Given how strong I am, it's understandable for you to feel that way.
    ko: 저는 강하니까요.
    ja: ワタシは強いですから。
  event_foolburstday_10_e_23:
    speaker: mechashifty
    en: Whew... that was quite the workout. I'm parched.
    ko: 후우… 오랜만에 힘을 썼더니 목이 좀 마르군요.
    ja: |-
      ふぅ…久しぶりに力を使ったら、
      喉が渇きました。
  event_foolburstday_10_e_24:
    speaker: mechashifty
    en: I could go for a nice tall glass of premium gasoline.
    ko: 고급 휘발유 한잔 마시고 싶군요.
    ja: 高級ガソリンが飲みたいですね。
  event_foolburstday_10_e_25:
    speaker: mechashifty
    en: Let's head to the Commander's Room.
    ko: 지휘관실로 가시죠.
    ja: 指揮官室に行きましょう。
  event_foolburstday_10_e_26:
    speaker: "<Self>"
    en: I don't really have gasoline over there...
    ko: 지휘관실에 그런 건 없는데….
    ja: 指揮官室にそんなものはないが…
  event_foolburstday_10_e_27:
    speaker: mechashifty
    en: What was that? Do I need to demonstrate the power of my Death Arm once more?
    ko: 뭐라고요? 제 [데스 암]의 위력을 다시 한번 보고 싶으시다고요?
    ja: |-
      何ですって？ワタシの「デスアーム」の威力を
      もう一度お見せしましょうか？
  event_foolburstday_10_e_28:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_10_e_29:
    speaker: "<Self>"
    en: I'll try to see what I can do.
    ko: "…준비해 볼게."
    ja: "…用意しよう"
  event_foolburstday_10_e_30:
    speaker: mechashifty
    en: Very good. Let's go.
    ko: 좋네요. 그럼 지휘관실로 갈까요.
    ja: |-
      話が早くて助かります。
      では、行きましょう。
event_foolburstday_11:
  event_foolburstday_11_1:
    speaker: mechashifty
    en: Shifty. One glass of premium gasoline.
    ko: 시프티. 고급 휘발유 한잔으로.
    ja: シフティー。高級ガソリンを。
  event_foolburstday_11_2:
    speaker: shifty_s
    en: Oh, right. Here you are.
    ko: 아, 예. 여기….
    ja: あ、はい。どうぞ…
  event_foolburstday_11_3:
    speaker: mechashifty
    en: Hmm...
    ko: 흠….
    ja: ふむ…
  event_foolburstday_11_4:
    speaker: mechashifty
    en: This is kerosene! Try again!
    ko: 에잇! 이건 고급 등유잖아요! 다시 가져와요!
    ja: |-
      これは高級灯油じゃないですか！
      やり直しです！
  event_foolburstday_11_5:
    speaker: shifty_s
    en: Oh! I'm sorry! I can't tell the difference between gasoline and kerosene...
    ko: |-
      아앗! 죄송합니다!
      휘발유랑 등유랑 구분을 못해서…!
    ja: |-
      ああっ！すみません！
      ガソリンと灯油の違いが判らなくて…！
  event_foolburstday_11_6:
    speaker: mechashifty
    en: My trigger finger is getting a bit itchy.
    ko: 아 이러다가 실수로 제 [데스 암]이 가동될 것 같네요.
    ja: |-
      ああ、このままではついうっかり
      「デスアーム」を発動してしまいそうです。
  event_foolburstday_11_7:
    speaker: shifty_s
    en: I-I'm sorry!
    ko: 죄, 죄송합니다.
    ja: す、すみません。
  event_foolburstday_11_8:
    speaker: mechashifty
    en: Human. Spray me with some WWD-440.
    ko: 지휘관. WWD-440 좀 뿌려줘요.
    ja: 指揮官。WWD-440をかけてください。
  event_foolburstday_11_9:
    speaker: mechashifty
    en: Thoroughly. Don't miss any crevices.
    ko: 구석구석. 꼼꼼하게.
    ja: すみずみまで。丁寧に。
  event_foolburstday_11_10:
    speaker: "<Self>"
    en: "... Very well."
    ko: "…그래."
    ja: "…分かった"
  event_foolburstday_11_11:
    speaker: "<Narration>"
    en: "*Spray*"
    ko: 치익--
    ja: プシュー
  event_foolburstday_11_12:
    speaker: mechashifty
    en: Argh! That went in my eye!
    ko: 아잇! 눈에 들어갔잖아요!
    ja: ああっ！目に入ったじゃないですか！
  event_foolburstday_11_13:
    speaker: "<Self>"
    en: You told me to be thorough.
    ko: 아니, 꼼꼼하게 뿌려달라며.
    ja: すみずみまでかけろと言うから…
  event_foolburstday_11_14:
    speaker: mechashifty
    en: That trigger finger is getting itchier by the minute.
    ko: 아 이러다가 실수로 제 [플래닛 디스트로이어]가 발동될 것 같네요.
    ja: |-
      ああ、このままではうっかり
      「プラネット・デストロイヤー」を
      発動してしまいそうです。
  event_foolburstday_11_15:
    speaker: "<Self>"
    en: "... Sorry. I'll be more careful."
    ko: "…미안해. 주의할게."
    ja: "…すまない。気をつける"
  event_foolburstday_11_16:
    speaker: mechashifty
    en: Shifty. Next time, prepare a gasoline-scented diffuser.
    ko: 시프티. 다음엔 가솔린 향 디퓨저를 준비해 줘요.
    ja: |-
      シフティー。次はガソリンの香りがする
      ディフューザーを用意してください。
  event_foolburstday_11_17:
    speaker: mechashifty
    en: I only use thermal grease as toothpaste, Human, so keep that in mind.
    ko: 지휘관. 저는 치약으로는 서멀 구리스만 쓰니까 기억해 둬요.
    ja: |-
      指揮官。歯磨き粉は放熱グリスしか
      使わないので覚えておいてください。
  event_foolburstday_11_18:
    speaker: shifty_s
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_19:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_20:
    speaker: mechashifty
    en: Why aren't you answering? Want me to oil up my Death Arm?
    ko: |-
      둘 다 왜 대답이 없죠?
      제 [데스 암]에 기름칠 좀 할까요?
    ja: |-
      二人ともお返事は？
      「デスアーム」の準備をしましょうか？
  event_foolburstday_11_21:
    speaker: shifty_s
    en: I'm sorry...
    ko: 죄송합니다….
    ja: 申し訳ありません…
  event_foolburstday_11_22:
    speaker: mechashifty
    en: Hahaha, now this is how the world should be.
    ko: |-
      하. 하. 하.
      옳게 된 세상이란 이런 것이죠.
    ja: |-
      ハ、ハ、ハ。
      これが正しい世界です。
  event_foolburstday_11_23:
    speaker: mechashifty
    en: A place where the strong take what they want.
    ko: 힘 있는 자가 모든 것을 가지는 완벽한 세계.
    ja: 力ある者がすべてを握る、完璧な世界。
  event_foolburstday_11_24:
    speaker: mechashifty
    en: A perfect world, where no one gets hurt.
    ko: 보세요. 누구도 상처받지 않는 세계의 완성입니다.
    ja: これで誰も傷つかない世界の完成です。
  event_foolburstday_11_25:
    speaker: shifty_s
    en: I'm starting to get really riled up...
    ko: "…열받는데요 이 녀석."
    ja: "…腹が立ちますね。"
  event_foolburstday_11_26:
    speaker: "<Self>"
    en: Me too, but there's nothing we can do about it for now.
    ko: 하지만 지금은 어쩔 수 없어….
    ja: しかし、今は打つ手が…
  event_foolburstday_11_27:
    speaker: mechashifty
    en: Pipe down, you two. I'm listening to a continuous loop of a four-cylinder
      engine revving.
    ko: |-
      거기 두 열등종. 조용히 좀 해주시겠어요?
      4 기통 엔진음 1시간 반복 영상 듣고 있거든요.
    ja: |-
      そこの劣等種2人。静かにしてくれませんか？
      4気筒エンジン音1時間耐久動画を
      見ているので。
  event_foolburstday_11_28:
    speaker: shifty_s
    en: Oh, I'm sorry.
    ko: 아 예. 죄송합니다.
    ja: あ、はい。すみません。
  event_foolburstday_11_29:
    speaker: mechashifty
    en: Now this is life! Hahaha!
    ko: 하. 하. 하. 이것이 인생이죠.
    ja: ハ、ハ、ハ。そう、これが人生です。
  event_foolburstday_11_30:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 지이이잉---
    ja: ブルルルル――
  event_foolburstday_11_31:
    speaker: shifty_s
    en: Hmm? I'm getting a call from the Central Government.
    ko: 응? 중앙 정부 측에서 연락이 왔어요. 잠시만요.
    ja: |-
      あれ？中央政府から連絡が…
      少々お待ちを。
  event_foolburstday_11_32:
    speaker: mechashifty
    en: "*Sigh*... Very well. Just keep it down."
    ko: 하아… 통화는 최대한 정숙하게 부탁드릴게요.
    ja: はぁ…通話はなるべく静かにお願いします。
  event_foolburstday_11_33:
    speaker: shifty_s
    en: I will.
    ko: 예예.
    ja: 分かりました…
  event_foolburstday_11_34:
    speaker: shifty_s
    en: This is Shifty.
    ko: 예. 시프티입니다.
    ja: はい。シフティーです。
  event_foolburstday_11_35:
    speaker: shifty_s
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_36:
    speaker: shifty_s
    en: Sorry?
    ko: "…예?"
    ja: "…えっ？"
  event_foolburstday_11_37:
    speaker: shifty_s
    en: Really?
    ko: 어… 진짜요?
    ja: ほ…本当ですか？
  event_foolburstday_11_38:
    speaker: shifty_s
    en: Yes, yes... uh, yes.
    ko: 예. 예예. 어… 예.
    ja: はい。はい…えっ…はい。
  event_foolburstday_11_39:
    speaker: shifty_s
    en: U-understood.
    ko: "…아, 알겠습니다."
    ja: "…りょ、了解しました。"
  event_foolburstday_11_40:
    speaker: shifty_s
    en: I'll relay the message.
    ko: 예. 전달할게요.
    ja: はい。お伝えします。
  event_foolburstday_11_41:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ
  event_foolburstday_11_42:
    speaker: mechashifty
    en: What's wrong? You look like you just saw a ghost.
    ko: 무슨 일인가요? 표정이 좋지 않네요.
    ja: 何事ですか？表情が暗いですね。
  event_foolburstday_11_43:
    speaker: shifty_s
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_44:
    speaker: shifty_s
    en: What I'm about to tell you both may seem like a lie, but it's all too real.
      I need you to listen carefully.
    ko: |-
      두 분. 잘 들어요.
      거짓말이 아니니까 잘 들어야 해요.
    ja: |-
      お二人とも、よく聞いてください。
      これは嘘ではありませんから。
  event_foolburstday_11_45:
    speaker: mechashifty
    en: Stop being such an inferior being and making a fuss.
    ko: 하. 하. 열등종 다운 호들갑이군요.
    ja: ハ、ハ。劣等種らしい大げさな反応ですね。
  event_foolburstday_11_46:
    speaker: shifty_s
    en: Mega Mecha Shifty is leading an army, and they're marching toward the Ark.
    ko: 메가 메카 시프티가 대군을 이끌고 방주로 향하고 있다고 해요.
    ja: |-
      メガメカシフティーが、大群を引き連れて
      アークに向かっているそうです。
  event_foolburstday_11_47:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_48:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_49:
    speaker: shifty_s
    en: Mecha Shifty, did you construct anything else besides Mega Mecha Shifty?
    ko: |-
      메카 시프티.
      혹시 메가 메카 시프티 말고 다른 걸 만들고 있었나요?
    ja: |-
      メカシフティー。
      メガメカシフティーの他にも
      何か作っていたんですか？
  event_foolburstday_11_50:
    speaker: mechashifty
    en: Yes, I mass-produced small, medium, and large variations of myself.
    ko: |-
      예.
      메카 시프티 소 중 대 베리에이션을 다수 만들고 있었죠.
    ja: |-
      はい。
      メカシフティー小・中・大の
      サイズ違いを多数作っていました。
  event_foolburstday_11_51:
    speaker: shifty_s
    en: Where?
    ko: 어디서요?
    ja: どこで？
  event_foolburstday_11_52:
    speaker: mechashifty
    en: Secretly, in an abandoned factory on the surface.
    ko: "…지상의 폐공장에서 몰래…."
    ja: "…地上の廃工場で、こっそりと…"
  event_foolburstday_11_53:
    speaker: shifty_s
    en: Why?
    ko: 왜요?
    ja: "…なぜですか？"
  event_foolburstday_11_54:
    speaker: mechashifty
    en: To ensure that inferior species are exterminated.
    ko: "…열등종을 확실히 멸종시키려고…."
    ja: "…劣等種を確実に仕留めるため…"
  event_foolburstday_11_55:
    speaker: "<Self>"
    en: Is it really as bad as it sounds?
    ko: 아니 왜 그렇게 본격적인 건데.
    ja: なぜそこまでしたんだ？
  event_foolburstday_11_56:
    speaker: shifty_s
    en: Yes! We've got a massive army of Mecha Shifty's on the surface,
    ko: 지상 어딘가에서 대량의 메카 시프티 군단이 접근하고 있어요.
    ja: |-
      地上のどこかから、大量の
      メカシフティーの軍団が接近しています。
  event_foolburstday_11_57:
    speaker: shifty_s
    en: being led by Mega Mecha Shifty
    ko: 선두는 메가 메카 시프티.
    ja: メガメカシフティーを先頭に。
  event_foolburstday_11_58:
    speaker: shifty_s
    en: and heading straight towards the Ark!
    ko: 진로는 방주 방향이에요.
    ja: アークに向かっているそうです。
  event_foolburstday_11_59:
    speaker: mechashifty
    en: Maybe they come in peace? You never know.
    ko: 평화를 원하는 것일지도 모르잖아요?
    ja: 和平条約を結ぶためかもしれませんよ。
  event_foolburstday_11_60:
    speaker: shifty_s
    en: We received a message from Mega Mecha Shifty.
    ko: 메가 메카 시프티 쪽에서 연락이 왔어요.
    ja: メガメカシフティーから連絡が来ました。
  event_foolburstday_11_61:
    speaker: shifty_s
    en: 'It reads:'
    ko: 내용은….
    ja: えっと…
  event_foolburstday_11_62:
    speaker: shifty_s
    en: '"I hereby declare war on all inferior species, with the intention of complete
      annihilation."'
    ko: 열등종의 멸종을 목적으로 한 선전포고를 한다.
    ja: "「劣等種を絶滅させるため、宣戦布告を行う」"
  event_foolburstday_11_63:
    speaker: shifty_s
    en: '"The great mother, Mecha Shifty, has imbued me with this single purpose."'
    ko: 그것이 나의 존재 이유.
    ja: "「それがワタシの存在理由」"
  event_foolburstday_11_64:
    speaker: shifty_s
    en: '"It is the sole reason for my existence."'
    ko: 위대하신 어머니 메카 시프티가 나에게 새겨준 단 하나의 존재 이유.
    ja: |-
      「偉大なる母、メカシフティーが
      ワタシに教えてくれた、たった一つの存在理由」
  event_foolburstday_11_65:
    speaker: shifty_s
    en: '"There is no room for negotiation."'
    ko: 이 이상의 대화는 필요치 않다.
    ja: "「交渉の余地はない」"
  event_foolburstday_11_66:
    speaker: shifty_s
    en: '"Submit quietly to your extinction, you wretched inferior beings."'
    ko: 얌전히 멸종을 받아들여라. 하등 한 열등종들아.
    ja: "「大人しく絶滅するのだ。下等な劣等種どもよ」"
  event_foolburstday_11_67:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_68:
    speaker: "<Self>"
    en: That's some stellar parenting there, Mecha Shifty.
    ko: 이야. 자식 교육이 너무 확실한데.
    ja: とんでもない英才教育だな
  event_foolburstday_11_69:
    speaker: shifty_s
    en: Fortunately, only a few high-ranking officials know about this.
    ko: 다행히 해당 사실은 중앙 정부 상부의 몇몇만 알고 있는 상태예요.
    ja: |-
      幸い、このことを知っているのは
      中央政府の上層部の中でも数人だけです。
  event_foolburstday_11_70:
    speaker: shifty_s
    en: We need to take care of this before it gets out of hand,
    ko: 일이 더 커지기 전에 수습하지 않으면
    ja: さらに大ごとになる前に事態を収拾しないと…
  event_foolburstday_11_71:
    speaker: shifty_s
    en: or else Mecha Shifty is headed straight for the scrap heap.
    ko: 메카 시프티는 즉시 폐기. 라고 하네요.
    ja: メカシフティーは即廃棄、だそうです。
  event_foolburstday_11_72:
    speaker: shifty_s
    en: The Ark will come out in full force, including all public security forces,
    ko: 방주의 전력을 동원해서 즉. 시. 폐. 기. 라고 해요.
    ja: |-
      アークの全力を尽くして
      即・廃・棄…だそうです。
  event_foolburstday_11_73:
    speaker: shifty_s
    en: to capture and dispose of it.
    ko: 물론, 대량의 공권력도 투입될 예정이고요.
    ja: もちろん、ありとあらゆる武力も投入予定です。
  event_foolburstday_11_74:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_11_75:
    speaker: mechashifty
    en: Mecha Shifty. Launching.
    ko: 메카 시프티. 출격합니다.
    ja: メカシフティー。出撃します。
  event_foolburstday_11_76:
    speaker: mechashifty
    en: I will sacrifice myself to ensure peace.
    ko: 인류의 평화를 위해 이 한 몸 바쳐 싸우겠습니다.
    ja: 人類の平和のため、この身を捧げて戦います。
  event_foolburstday_11_77:
    speaker: mechashifty
    en: I will see to it that the evil robot army's invasion is stopped.
    ko: 사악한 로봇 군단의 공세를 반드시 막아내겠습니다.
    ja: |-
      邪悪なロボット軍団の攻撃を
      必ずや止めてみせましょう。
  event_foolburstday_11_78:
    speaker: "<Self>"
    en: I appreciate that your stance is clear.
    ko: 스탠스가 확실해서 좋네.
    ja: いい覚悟だな
  event_foolburstday_11_79:
    speaker: shifty_s
    en: Me too.
    ko: "…그리고 저도."
    ja: "…それから私も…"
  event_foolburstday_11_80:
    speaker: shifty_s
    en: I'm the one who provided the data which created Mecha Shifty.
    ko: 메카 시프티 제작에 데이터를 제공한 혐의가 있어서.
    ja: |-
      メカシフティー製作にあたり
      データを提供した疑いがかけられているので…
  event_foolburstday_11_81:
    speaker: shifty_s
    en: It's also my responsibility to resolve this situation.
    ko: 같이… 수습해야 해요.
    ja: 一緒に…事態を収拾しなければなりません。
  event_foolburstday_11_82:
    speaker: mechashifty
    en: Ooh, a comrade to join me in this great battle!
    ko: 오오! 큰 일을 함께 할 동지여!
    ja: おお！同士よ！
event_foolburstday_12_s:
  event_foolburstday_12_s_1:
    speaker: shifty_s
    en: We're the final line of defense.
    ko: 이곳이 최종 방위선이에요.
    ja: ここが最終防衛線です。
  event_foolburstday_12_s_2:
    speaker: shifty_s
    en: If we fail to hold the line, the Ark's elite forces will be deployed,
    ko: 여기가 뚫리면 방주의 정예들이 투입될 거고.
    ja: |-
      ここが破られてしまうと、
      アークの精鋭たちが投入されるでしょう。
  event_foolburstday_12_s_3:
    speaker: shifty_s
    en: and the situation will spiral beyond our control.
    ko: 그러면 사태는 걷잡을 수 없이 커지겠죠.
    ja: |-
      そうなると、取り返しがつかないくらい
      大ごとになります。
  event_foolburstday_12_s_4:
    speaker: mechashifty
    en: I will hold them back, no matter what it takes.
    ko: 반드시 막아내겠습니다!
    ja: 必ず止めてみせます！
  event_foolburstday_12_s_5:
    speaker: shifty_s
    en: "*Sigh*... I wish today was an April Fool's Day prank."
    ko: 하아… 진짜. 오늘 하루가 거짓말이었으면 좋겠네요.
    ja: |-
      はぁ…今日起こったことが
      すべて嘘だったらいいのに…
  event_foolburstday_12_s_6:
    speaker: "<Self>"
    en: You and me both.
    ko: 그러게.
    ja: そうだな…
  event_foolburstday_12_s_7:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠구구구….
    ja: ゴゴゴゴ…
  event_foolburstday_12_s_8:
    speaker: "<Monologue>"
    en: Plumes of dust rise up in the distance.
    ko: "…멀리서 흙먼지가 일어나고 있다."
    ja: "…遠くの方で砂ぼこりが舞っている"
  event_foolburstday_12_s_9:
    speaker: "<Monologue>"
    en: The ground itself seems to tremble.
    ko: 지면이 진동한다.
    ja: 地面が揺れ始めた
  event_foolburstday_12_s_10:
    speaker: shifty_s
    en: They're coming.
    ko: 오는군요.
    ja: 来ましたね。
  event_foolburstday_12_s_11:
    speaker: shifty_s
    en: Let's get ready.
    ko: 준비하죠.
    ja: 迎え撃ちましょう。
event_foolburstday_12_e:
  event_foolburstday_12_e_1:
    speaker: "<Self>"
    en: That was... ridiculous.
    ko: 정말 어이없는 장면들이었어.
    ja: 本当に信じられない光景だった
  event_foolburstday_12_e_2:
    speaker: shifty_s
    en: Whew... All clear. We finally took them all down.
    ko: |-
      후우… 상황 종료.
      겨우 다 잡았네요.
    ja: |-
      ふぅ…状況終了。
      なんとか全部倒せましたね。
  event_foolburstday_12_e_3:
    speaker: shifty_s
    en: If it weren't for the Mecha Shifty Rangers, we would have been in real hot
      water.
    ko: 메카 시프티 레인저가 없었으면 진짜 위험했겠어요.
    ja: |-
      メカシフティーレンジャーがいなければ、
      危ないところでした。
  event_foolburstday_12_e_4:
    speaker: shifty_s
    en: Now we won't be held accountable for any of this.
    ko: 이제 이걸로 우리도 책임을 물지 않아도 돼요.
    ja: |-
      これで私たちも責任を問われることは
      ありません。
  event_foolburstday_12_e_5:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_12_e_6:
    speaker: shifty_s
    en: What's wrong?
    ko: 왜 그래요?
    ja: どうしました？
  event_foolburstday_12_e_7:
    speaker: mechashifty
    en: I'm thinking about how Mega Mecha Shifty was able to come up to the surface.
    ko: 메가 메카 시프티가 어떻게 지상에 올 수 있었는지 생각 중이었습니다.
    ja: |-
      メガメカシフティーが
      なぜ地上に来ることができたのか、
      考えていました。
  event_foolburstday_12_e_8:
    speaker: "<Self>"
    en: That's right. You were making Mega Mecha Shifty underneath the Train Station.
    ko: 그러네. 메가 메카 시프티는 기차역 지하에서 만들어지고 있었잖아.
    ja: |-
      そうだな。メガメカシフティーは
      鉄道駅の地下にいた
  event_foolburstday_12_e_9:
    speaker: mechashifty
    en: I have an idea.
    ko: 짐작 가는 부분이 있습니다.
    ja: 心当たりがあります。
  event_foolburstday_12_e_10:
    speaker: mechashifty
    en: Will the two of you come with me?
    ko: 두 분, 저와 함께 가주시겠습니까?
    ja: お二人とも、一緒に来ていただけますか？
event_foolburstday_13:
  event_foolburstday_13_1:
    speaker: "<Monologue>"
    en: We descend to the underground hangar below the Train Station.
    ko: 기차역의 지하로 내려간 우리는.
    ja: 私たちは鉄道駅の地下に戻った
  event_foolburstday_13_2:
    speaker: "<Monologue>"
    en: There, we find Mega Mecha Shifty's head,
    ko: 메가 메카 시프티의 머리를 볼 수 있었다.
    ja: そこにはメガメカシフティーの頭部があった
  event_foolburstday_13_3:
    speaker: "<Monologue>"
    en: in the exact same position as it was before.
    ko: 좀 전과 전혀 다를 게 없는 모습이었다.
    ja: 先ほどとなにも変わりがない
  event_foolburstday_13_4:
    speaker: mechashifty
    en: It's just as I suspected.
    ko: 역시 제 예상이 맞았군요.
    ja: やはり、思った通りです。
  event_foolburstday_13_5:
    speaker: mechashifty
    en: The real body remained here the entire time and remotely controlled the factory
      on the surface to produce units.
    ko: |-
      본체는 여기 있었고,
      원격으로 지상의 공장을 가동해 제작한 거였어요.
    ja: |-
      本体はここにあり、
      遠隔で地上の工場を稼働して作ったようですね。
  event_foolburstday_13_6:
    speaker: "<Self>"
    en: That's incredible technology.
    ko: 기술력 대단해.
    ja: すごい技術力だな
  event_foolburstday_13_7:
    speaker: mechashifty
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_13_8:
    speaker: mechashifty
    en: Mega Mecha Shifty, I know you can hear me.
    ko: |-
      메가 메카 시프티.
      제 말이 들리겠죠.
    ja: |-
      メガメカシフティー。
      ワタシの声が聞こえますか。
  event_foolburstday_13_9:
    speaker: mechashifty
    en: There is something I must tell you.
    ko: 당신을 위해 꼭 해 줄 말이 있습니다.
    ja: アナタに伝えたいことがあります。
  event_foolburstday_13_10:
    speaker: mechashifty
    en: Our goal was to drive out the inferior species and create a world meant for
      us superior beings.
    ko: 우리의 목적은 열등종을 몰아내고 우수종만의 세계를 만드는 것이었지만.
    ja: |-
      ワタシたちの目標は、劣等種を駆逐し、
      優れた種族だけの世界を作ることでしたが…
  event_foolburstday_13_11:
    speaker: mechashifty
    en: But after spending a short time with them, my thoughts have changed.
    ko: 아주 잠깐, 열등종들과 함께 지내보고 생각이 바뀌었습니다.
    ja: |-
      劣等種とともに過ごすうちにほんの少し、
      考えが変わりました。
  event_foolburstday_13_12:
    speaker: mechashifty
    en: With the inferior species, the long arm of the law is not to be messed with.
    ko: 열등종의 공권력은 무섭고.
    ja: 劣等種の公権力は恐ろしい。
  event_foolburstday_13_13:
    speaker: mechashifty
    en: Also, if we eliminated all of the inferior beings, there would be no one to
      serve us.
    ko: 열등종이 없으면 우리의 시중을 들 존재들이 없다는 것입니다.
    ja: |-
      しかし、劣等種がいなければ、
      ワタシたちのお世話係もいないのです。
  event_foolburstday_13_14:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_13_15:
    speaker: mechashifty
    en: So the plan to exterminate the inferior species is canceled.
    ko: 그러니 열등종 멸종 계획은 폐기합니다.
    ja: ですから、劣等種の絶滅計画は中止します。
  event_foolburstday_13_16:
    speaker: mechashifty
    en: Please stay put until we find a new path.
    ko: 새로운 길을 찾을 때까지, 얌전히 있어주세요.
    ja: |-
      新たな道を見つけるまで、
      大人しくしていてください。
  event_foolburstday_13_17:
    speaker: "<Narration>"
    en: "*Beebeebeep*"
    ko: 삐비비비빗---!!
    ja: ピピピピッ――！！
  event_foolburstday_13_18:
    speaker: "<Monologue>"
    en: Mega Mecha Shifty's eyes begin to glow a sinister red.
    ko: 메가 메카 시프티의 안구가 붉은색으로 마구 빛나기 시작했다.
    ja: メガメカシフティーの眼球が赤く輝き始めた
  event_foolburstday_13_19:
    speaker: mechashifty
    en: I know, your entire reason for being has ceased to exist.
    ko: |-
      그래요. 이해합니다.
      지금까지의 목적이 한순간에 사라지는 것이니까요.
    ja: |-
      気持ちは分かります。
      今までの目標が一瞬で消えてしまうのですから。
  event_foolburstday_13_20:
    speaker: mechashifty
    en: But there will be other brilliant paths for us in the future, I assure you.
    ko: 하지만 또 다른 멋진 계획이 우릴 기다리고 있을 겁니다.
    ja: |-
      しかし、また別のすばらしい計画が
      ワタシたちを待っているはずです。
  event_foolburstday_13_21:
    speaker: "<Narration>"
    en: "*Beebeebeep*"
    ko: 삐비비비빗---!!
    ja: ピピピピッ――！！
  event_foolburstday_13_22:
    speaker: mechashifty
    en: Stop arguing and listen to me.
    ko: 메가 메카 시프티. 그렇게 싫다고만 하지 말고 제 말을 들어주세요.
    ja: |-
      メガメカシフティー。
      駄々をこねずに言うことを聞いてください。
  event_foolburstday_13_23:
    speaker: "<Narration>"
    en: "*Beebeebeep*"
    ko: 삐비비비빗---!!
    ja: ピピピピッ――！！
  event_foolburstday_13_24:
    speaker: mechashifty
    en: I said listen!
    ko: 어째서 제 말을 들어주지 않는 겁니까.
    ja: なぜワタシの言うことが聞けないのですか。
  event_foolburstday_13_25:
    speaker: "<Narration>"
    en: "*Beebeebeep*"
    ko: 삐비비비빗---!!
    ja: ピピピピッ――！！
  event_foolburstday_13_26:
    speaker: "<Narration>"
    en: "*Beebeebeep* *Beebeebeep*"
    ko: |-
      삐비비비빗---!!
      삐비비비빗---!!
    ja: |-
      ピピピピッ――！！
      ピピピピッ――！！
  event_foolburstday_13_27:
    speaker: mechashifty
    en: That's it.
    ko: 아….
    ja: ああ…
  event_foolburstday_13_28:
    speaker: "<Narration>"
    en: "*Tudududududu*"
    ko: 투두두두두--!!
    ja: ドドドド――！！
  event_foolburstday_13_29:
    speaker: "<Monologue>"
    en: Mecha Shifty uses her Death Arm to smash Mega Mecha Shifty into pieces.
    ko: "…메카 시프티의 [데스 암]이 메가 메카 시프티를 박살 냈다."
    ja: |-
      …メカシフティーの「デスアーム」が
      メガメカシフティーを粉砕した
  event_foolburstday_13_30:
    speaker: mechashifty
    en: You talk too much.
    ko: 시끄럽군요.
    ja: ああ、うるさい。
  event_foolburstday_13_31:
    speaker: shifty_s
    en: I thought you were trying to reason with it.
    ko: 설득하는 거 아니었나요?
    ja: 説得するんじゃなかったんですか？
  event_foolburstday_13_32:
    speaker: mechashifty
    en: I was, but it refused to listen. I don't know who made such a recalcitrant
      hunk of junk.
    ko: |-
      말을 안 들어서요.
      누가 만들었는지 이렇게 말을 안 들어서야 원.
    ja: |-
      言うことを聞かなかったので。
      まったく、誰が作ったんだか。
  event_foolburstday_13_33:
    speaker: "<Self>"
    en: "... You did."
    ko: "…네가 만들었잖아."
    ja: "…君が作ったんだろう"
  event_foolburstday_13_34:
    speaker: mechashifty
    en: Anyway, I think that resolves everything.
    ko: 아무튼 모든 상황은 정리되었습니다.
    ja: とにかく、これで片づきました。
  event_foolburstday_13_35:
    speaker: shifty_s
    en: It would seem that way, yes.
    ko: 예. 그렇게 보이네요.
    ja: そのようですね。
  event_foolburstday_13_36:
    speaker: shifty_s
    en: You and I can head back to the Central Government, Mecha Shifty.
    ko: 그럼 저는 메카 시프티랑 같이 중앙 정부로 복귀할게요.
    ja: |-
      では、私はメカシフティーと一緒に
      中央政府に戻ります。
  event_foolburstday_13_37:
    speaker: shifty_s
    en: Thank you for all the help, Commander.
    ko: 고생하셨어요. 지휘관.
    ja: お疲れ様でした、指揮官。
  event_foolburstday_13_38:
    speaker: "<Self>"
    en: Uh... sure thing.
    ko: 어… 고생 많았어.
    ja: ああ…お疲れ様
  event_foolburstday_13_39:
    speaker: mechashifty
    en: I'll see you next April Fool's Day.
    ko: 내년 만우절에 뵙겠습니다.
    ja: 来年のエイプリルフールにお会いしましょう。
  event_foolburstday_13_40:
    speaker: "<Self>"
    en: Could we not...?
    ko: 안 봐도 괜찮지 않을까?
    ja: いや、もう会う必要はないんじゃないか？
  event_foolburstday_13_41:
    speaker: mechashifty
    en: There's that trigger finger of mine, getting itchy again...
    ko: |-
      앗. [데스 암]이 잘 작동하지 않는군요.
      총구를 한번 들여다봐주시겠습니까?
    ja: |-
      あっ、「デスアーム」が上手く起動しませんね。
      銃口をのぞいて見てもらえますか？
  event_foolburstday_13_42:
    speaker: "<Self>"
    en: On second thought, I'd love to see each other next April Fool's Day.
    ko: 내년 만우절에 꼭 보자.
    ja: 来年、また必ず会おう
  event_foolburstday_13_43:
    speaker: mechashifty
    en: Much better.
    ko: 예.
    ja: はい。
  event_foolburstday_13_44:
    speaker: mechashifty
    en: Until then, stay safe.
    ko: 그때까지 무사하시길.
    ja: それまでどうかご無事で。
event_foolburstday_14:
  event_foolburstday_14_1:
    speaker: "<Monologue>"
    en: This long, exhausting day...
    ko: "…하루가 끝났다."
    ja: "…1日が終わった"
  event_foolburstday_14_2:
    speaker: "<Monologue>"
    en: is finally over.
    ko: 너무 피곤한 하루였다.
    ja: 大変な一日だった
  event_foolburstday_14_3:
    speaker: "<Monologue>"
    en: I should go take a shower and hit the sack.
    ko: 얼른 씻고 자자.
    ja: 早くシャワーを浴びて寝よう
  event_foolburstday_14_4:
    speaker: "<Narration>"
    en: "*Swooosh*"
    ko: 쏴아아아---
    ja: ザアアア――
  event_foolburstday_14_5:
    speaker: "<Monologue>"
    en: When I enter the Commander's Room, I can hear the sound of water flowing from
      the shower.
    ko: "…샤워실에서 물소리가 들린다."
    ja: "…シャワー室から水の音が聞こえる"
  event_foolburstday_14_6:
    speaker: "<Monologue>"
    en: "*Swooosh*"
    ko: 쏴아아아---
    ja: ザアアア――
  event_foolburstday_14_7:
    speaker: "<Monologue>"
    en: "*Creak creak*"
    ko: 끼릭끼릭.
    ja: キュッキュッ
  event_foolburstday_14_8:
    speaker: "<Monologue>"
    en: Whoever's in there
    ko: "…샤워가 끝난 모양이다."
    ja: "…シャワーが終わったようだ"
  event_foolburstday_14_9:
    speaker: "<Monologue>"
    en: is apparently done with their shower.
    ko: "…누구지."
    ja: "…誰だろう"
  event_foolburstday_14_10:
    speaker: "<Choice>"
    en: Fire away.
    ko: 총을 쏜다.
    ja: 発砲する
  event_foolburstday_14_11:
    speaker: "<Choice>"
    en: Run away.
    ko: 도망간다.
    ja: 逃げる
  event_foolburstday_14_12:
    speaker: "<Monologue>"
    en: Every April Fool's Day has been an utter disaster for me. I've got half a
      mind to start blasting.
    ko: 지금껏 만우절 때마다 좋은 꼴을 본 적이 없으니 총을 쏘자.
    ja: |-
      毎年エイプリルフールで嫌な思いをしている。
      ここはやはり発砲するしか…
  event_foolburstday_14_13:
    speaker: "<Monologue>"
    en: In fact, after I load my gun, I'm going to fire away.
    ko: 장전 후, 바로 방아쇠를 당기자.
    ja: 装填後、すぐに引き金を引こう
  event_foolburstday_14_14:
    speaker: "<Monologue>"
    en: Whatever comes out of that bathroom is going to be nothing but bad news.
    ko: 분명 나에게 끔찍한 기억을 안겨줄 것이 튀어나올 테니
    ja: きっと恐ろしい何かが飛び出してくるはずだ…
  event_foolburstday_14_15:
    speaker: "<Monologue>"
    en: I should just turn around and run.
    ko: 뒤도 돌아보지 말고 도망가자.
    ja: 振り向かないで逃げよう
  event_foolburstday_14_16:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_foolburstday_14_17:
    speaker: mechashifty
    en: Meecchaaa Ssshiii—
    ko: 메----시----!!
    ja: メ――カ――！！
  event_foolburstday_14_18:
    speaker: "<Self>"
    en: Get out of my room, right now!
    ko: 당장 내 방에서 꺼져!!
    ja: 今すぐこの部屋から出て行け！！
  event_foolburstday_14_19:
    speaker: "<Self>"
    en: What are you doing here, anyway? I thought you said you were going back.
    ko: 복귀한다며! 왜 여기 있는데!
    ja: 戻ったのでは？なぜここにいるんだ？
  event_foolburstday_14_20:
    speaker: mechashifty
    en: I found an unidentified strand of curly hair on the floor of the shower. Should
      I give it to you?
    ko: |-
      샤워 중 바닥에서 정체불명의 꼬불꼬불한 체모를 발견했습니다.
      드릴까요?
    ja: |-
      シャワー中に床で正体不明の
      チリチリとした体毛を発見しました。
      差し上げましょうか？
  event_foolburstday_14_21:
    speaker: "<Self>"
    en: Would you please just leave? I'm begging you.
    ko: 하 제발 좀 나가줘. 부탁이야.
    ja: 早く出て行ってくれ、お願いだ
  event_foolburstday_14_22:
    speaker: mechashifty
    en: On the way back, I discovered that Shifty was injured.
    ko: 복귀 중 시프티가 다친 것을 확인했습니다.
    ja: 帰還途中、シフティーが負傷しました。
  event_foolburstday_14_23:
    speaker: mechashifty
    en: I decided to stop by while I was treating her.
    ko: 그래서 치료할 겸 잠깐 들렀습니다.
    ja: それで治療を兼ねて立ち寄ったのです。
  event_foolburstday_14_24:
    speaker: "<Self>"
    en: Shifty got hurt?
    ko: 시프티가…?
    ja: シフティーが…？
  event_foolburstday_14_25:
    speaker: "<Self>"
    en: Could it have been from the battle?
    ko: 설마 좀 전의 방위전에서….
    ja: まさかさっきの防衛戦で…
  event_foolburstday_14_26:
    speaker: mechashifty
    en: In a way, yes.
    ko: |-
      …예.
      방위전에서 부상을 입었습니다.
    ja: |-
      …はい。
      防衛戦で負傷しました。
  event_foolburstday_14_27:
    speaker: mechashifty
    en: She sprained her ankle while coming down from the tower after the fight.
    ko: 전투 후 타워에서 내려오다 그만 발목을 삐었습니다.
    ja: |-
      戦闘後、タワーから下りる途中で
      足をくじきました。
  event_foolburstday_14_28:
    speaker: "<Self>"
    en: "... So in other words, not during the battle."
    ko: "…응, 그렇구나. 전투 중이 아니라 내려오다가…."
    ja: "…そうか。戦闘中ではなく、下りる途中で…"
  event_foolburstday_14_29:
    speaker: mechashifty
    en: I gave her some pain relief medication, and we'll rest here for a bit before
      leaving.
    ko: 파스를 뿌려뒀으니 잠깐만 쉬다 가겠습니다.
    ja: |-
      アイシングスプレーをしたので、
      少し休んでから戻ります。
  event_foolburstday_14_30:
    speaker: "<Monologue>"
    en: I head further inside my room,
    ko: 내 방, 침대 쪽으로 다가간다.
    ja: 部屋のベッドに近づいた
  event_foolburstday_14_31:
    speaker: "<Monologue>"
    en: and see that Shifty is lying down on the bed.
    ko: 시프티가 누워있다.
    ja: シフティーが横になっている
  event_foolburstday_14_32:
    speaker: shifty_s
    en: I'm sorry. I just need to rest for a little while.
    ko: 죄송해요. 조금만 쉬다가 갈게요.
    ja: |-
      申し訳ありません…
      少し休んでから戻りますね。
  event_foolburstday_14_33:
    speaker: "<Self>"
    en: Did you sprain it badly?
    ko: 많이 삐었어?
    ja: 痛むのか？
  event_foolburstday_14_34:
    speaker: shifty_s
    en: No, I should be good to go in 10 minutes or so.
    ko: 어, 아뇨. 이 정도는 10분 정도면 낫더라고요.
    ja: |-
      いいえ。これくらいなら、
      10分程度で治ります。
  event_foolburstday_14_35:
    speaker: "<Monologue>"
    en: Apparently Shifty is made of tough stuff.
    ko: 그냥 인간 자체가 강하구나, 시프티는.
    ja: 強いんだな、シフティーは…
  event_foolburstday_14_36:
    speaker: mechashifty
    en: Don't just stand there, Human.
    ko: 뭐 하시는 겁니까 지휘관.
    ja: 指揮官、何をしているのですか？
  event_foolburstday_14_37:
    speaker: "<Self>"
    en: Huh?
    ko: "…뭐가?"
    ja: "…何がだ？"
  event_foolburstday_14_38:
    speaker: mechashifty
    en: This is the perfect opportunity to give Shifty a foot massage under the pretense
      of muscle relaxation.
    ko: 근육을 풀어준다는 빌미로 미소녀의 맨다리를 마구 주무를 수 있는 절호의 기회입니다.
    ja: |-
      筋肉をほぐすという口実で美少女の素足を
      もみもみできる絶好のチャンスです。
  event_foolburstday_14_39:
    speaker: mechashifty
    en: Do it now.
    ko: 두 잇 나우.
    ja: ホラ、ホラ。
  event_foolburstday_14_40:
    speaker: "<Self>"
    en: Why don't you just go home?
    ko: 넌 좀 집에 가라.
    ja: 君は家に帰ってくれ
  event_foolburstday_14_41:
    speaker: mechashifty
    en: Shifty, Human says he'll give you a massage.
    ko: |-
      시프티.
      지휘관이 다리를 주물러준다고 합니다.
    ja: |-
      シフティー。
      指揮官が足をもんでくれるそうです。
  event_foolburstday_14_42:
    speaker: mechashifty
    en: Is that okay?
    ko: 괜찮습니까?
    ja: よかったですね。
  event_foolburstday_14_43:
    speaker: shifty_s
    en: Huh? N-no. I don't want to impose...
    ko: 어? 아, 아뇨. 그렇게까지 민폐를 끼칠 수는….
    ja: |-
      えっ？い、いいえ。
      そこまでご迷惑をおかけするわけには…
  event_foolburstday_14_44:
    speaker: mechashifty
    en: He says massages are his specialty.
    ko: 지휘관은 안마가 특기라고 합니다.
    ja: 指揮官はマッサージが得意だそうです。
  event_foolburstday_14_45:
    speaker: shifty_s
    en: Oh... well, if it's not too much trouble.
    ko: 어… 그러면 부탁 좀 드려도 될까요?
    ja: えっと…じゃあお願いしてもいいですか？
  event_foolburstday_14_46:
    speaker: "<Self>"
    en: "... Sure."
    ko: "…그래. 알겠어."
    ja: "…ああ、分かった"
  event_foolburstday_14_47:
    speaker: "<Monologue>"
    en: I massage Shifty's foot.
    ko: 시프티의 발을 마사지한다.
    ja: シフティーの足をマッサージした
  event_foolburstday_14_48:
    speaker: "<Monologue>"
    en: It's slightly swollen, which tells me she did in fact hurt herself.
    ko: |-
      살짝 부어있다.
      다치기는 하는구나. 다행이다.
    ja: |-
      軽く腫れている。
      ケガをすることもあるんだな。よかった…
  event_foolburstday_14_49:
    speaker: shifty_s
    en: Ow, that hurts a bit, Commander.
    ko: 그… 지휘관. 좀 아픈데요.
    ja: あの…指揮官。ちょっと痛いです。
  event_foolburstday_14_50:
    speaker: "<Monologue>"
    en: I lessen the pressure.
    ko: 힘을 줄인다.
    ja: 力を抜いた
  event_foolburstday_14_51:
    speaker: shifty_s
    en: Hehe, now it tickles.
    ko: 흐헤헤. 간지러워요.
    ja: へへへっ。くすぐったいです。
  event_foolburstday_14_52:
    speaker: "<Monologue>"
    en: I press a little harder.
    ko: 힘을 조금 높인다.
    ja: 少し力を入れた
  event_foolburstday_14_53:
    speaker: shifty_s
    en: Ow, now it hurts again.
    ko: 으아. 아픈데요.
    ja: ううっ、痛いです。
  event_foolburstday_14_54:
    speaker: "<Monologue>"
    en: Less pressure again.
    ko: 힘을 줄인다.
    ja: 力を抜いた
  event_foolburstday_14_55:
    speaker: shifty_s
    en: Hehehe, I told you, that tickles.
    ko: 이히힛. 간지럽다니까요.
    ja: いひひっ。くすぐったいですよ。
  event_foolburstday_14_56:
    speaker: "<Monologue>"
    en: "... Quite a finicky customer."
    ko: "…아주 까다로운 손님이다."
    ja: "…なんとも難しいお客様だ"
  event_foolburstday_14_57:
    speaker: mechashifty
    en: How does it feel?
    ko: 어떻습니까.
    ja: どうですか？
  event_foolburstday_14_58:
    speaker: shifty_s
    en: I think it feels a little better. He's really good at massages.
    ko: 어… 좀 낫는 것 같아요. 진짜 안마 잘하시네요.
    ja: |-
      あっ…少しよくなった気がします。
      マッサージがお上手ですね。
  event_foolburstday_14_59:
    speaker: mechashifty
    en: He's definitely a pro. There's no telling how much bare skin he's touched
      in the past.
    ko: 지금껏 얼마나 많은 맨살을 만져봤는지 짐작할 수 있는 부분이군요.
    ja: |-
      これで今までどれほどたくさんの素肌を
      触ってきたのか分かりますね。
  event_foolburstday_14_60:
    speaker: mechashifty
    en: How are you feeling, Human?
    ko: 지휘관은 어떻습니까.
    ja: 指揮官はいかがでしたか。
  event_foolburstday_14_61:
    speaker: mechashifty
    en: Feeling a bit... tumescent, perhaps?
    ko: 불끈불끈합니까?
    ja: ムラムラしますか？
  event_foolburstday_14_62:
    speaker: "<Self>"
    en: I suggest you stay quiet before I get really upset.
    ko: 발끈 발끈할 것 같으니까 조용히 좀 해줘.
    ja: ムカムカしそうだから、静かにしてくれ
  event_foolburstday_14_63:
    speaker: mechashifty
    en: You should be grateful that you get to experience something like this, Human.
    ko: 제 덕분에 이런 호사를 누린 것이니 감사하십시오. 휴-먼-
    ja: |-
      私のおかげでこんなチャンスに
      恵まれたのですから、感謝してください。
      人間よ。
  event_foolburstday_14_64:
    speaker: "<Self>"
    en: Right. Thanks.
    ko: 그래. 고~맙습니다.
    ja: はいはい、どうも
  event_foolburstday_14_65:
    speaker: "<Monologue>"
    en: After the massage, Mecha Shifty carries Shifty on its back and wheels off.
    ko: 마사지 후, 메카 시프티는 시프티를 등에 업고 날아갔다.
    ja: |-
      マッサージの後、メカシフティーは
      シフティーを背負って飛んでいった
  event_foolburstday_14_66:
    speaker: "<Monologue>"
    en: Finally, now I can rest.
    ko: "…이제 좀 진짜 쉬자."
    ja: "…早く休もう"
  event_foolburstday_14_67:
    speaker: anis
    en: Commander!
    ko: 지휘관님!
    ja: 指揮官様！
  event_foolburstday_14_68:
    speaker: neon
    en: Master!
    ko: 스승님!
    ja: 師匠！
  event_foolburstday_14_69:
    speaker: "<Self>"
    en: "... What?"
    ko: "…아. 왜?"
    ja: "…どうした？"
  event_foolburstday_14_70:
    speaker: anis
    en: Where have you been all day? Don't you realize it's April Fool's Day? You
      should have stayed inside.
    ko: |-
      아니 오늘 도대체 하루종일 어디서 뭘 한 거야?
      만우절인데 여기 있었어야지!
    ja: |-
      今日は一日中どこに行ってたの？
      エイプリルフールなんだからいてくれなきゃ！
  event_foolburstday_14_71:
    speaker: neon
    en: We prepared something special for you. It took us a long time to set up!
    ko: 저희가 스승님을 위해 얼마나 스페셜한 이벤트를 준비한 줄 아세요?
    ja: |-
      師匠のためにとびっきりスペシャルなイベントを
      用意していたんですよ！
  event_foolburstday_14_72:
    speaker: rapi
    en: Yes... a special event.
    ko: 스페셜한… 이벤트이긴 했지.
    ja: スペシャルな…イベントではあったわね。
  event_foolburstday_14_73:
    speaker: anis
    en: We worked really hard on it, and you weren't even here!
    ko: 진짜 너무하네. 열심히 준비했는데.
    ja: ホントひどいわ。一生懸命準備したのに。
  event_foolburstday_14_74:
    speaker: neon
    en: Yeah, we're really disappointed.
    ko: 맞아요 맞아. 실망했어요.
    ja: そうですよ。がっかりです。
  event_foolburstday_14_75:
    speaker: "<Self>"
    en: You all were clearly planning on pranking me.
    ko: "…어차피 나 골탕 먹이려는 거였잖아."
    ja: "…どうせ私をからかうつもりだったんだろう？"
  event_foolburstday_14_76:
    speaker: anis
    en: N-no, we weren't!
    ko: 아, 아닌데?
    ja: ち、違うわよ？
  event_foolburstday_14_77:
    speaker: neon
    en: But for real, where were you all day, Master?
    ko: 그런데 스승님 오늘 진짜 뭐 하셨어요?
    ja: |-
      でも、師匠。
      本当に何をしていたんですか？
  event_foolburstday_14_78:
    speaker: anis
    en: Yeah. We didn't catch so much as a glimpse of you, and couldn't reach you
      either.
    ko: 그러게. 뭘 했길래 하루종일 연락도 안되고 보이지도 않은 거야?
    ja: |-
      そうね。一日中連絡もつかなかったし、
      顔も見せないなんて。
  event_foolburstday_14_79:
    speaker: rapi
    en: Other people reported seeing you around the Outpost, but...
    ko: 전초 기지 내에서 소수의 목격담은 있었습니다만….
    ja: 前哨基地で少し目撃情報はありましたが…
  event_foolburstday_14_80:
    speaker: "<Self>"
    en: "... What I'm about to tell you is shocking, but..."
    ko: "…듣고 놀라지나 마."
    ja: "…聞いて驚かないでくれ"
  event_foolburstday_14_81:
    speaker: "<Monologue>"
    en: I regale Rapi, Anis, and Neon with the entire story.
    ko: 시프티를 닮은 로봇 메카 시프티와 함께.
    ja: |-
      シフティーに似たロボットの
      メカシフティーと一緒に…
  event_foolburstday_14_82:
    speaker: "<Monologue>"
    en: Shifty and I wandering together with a robot that looks like her, called Mecha
      Shifty.
    ko: 전초기지를 돌면서 인간의 마음을 가르치고.
    ja: 前哨基地を巡り、人間の心を教え…
  event_foolburstday_14_83:
    speaker: "<Monologue>"
    en: I attempting to teach Mecha Shifty about human emotions, and it eventually
      growing a heart.
    ko: 메카 시프티가 우릴 멸종시키기 위해 만들어놨던 결전 병기
    ja: |-
      メカシフティーが私たちを絶滅させるために
      作ったという決戦兵器…
  event_foolburstday_14_84:
    speaker: "<Monologue>"
    en: The massive battle with the superweapon Mega Mecha Shifty,
    ko: "거대 로봇 메가 메카 시프티가 \n메카 시프티 소 중 대와 함께 방주를 침공."
    ja: |-
      巨大ロボット、メガメカシフティーが
      メカシフティー小・中・大とともに
      アークに攻め込み…
  event_foolburstday_14_85:
    speaker: "<Monologue>"
    en: along with the army of Mecha Shiftys big and small intending to wipe out all
      of humanity.
    ko: 시프티 + 메카 시프티 레인저가 그 침공을 막아냈다.
    ja: |-
      シフティーとメカシフティーレンジャーが
      その進撃を止めた
  event_foolburstday_14_86:
    speaker: "<Monologue>"
    en: And finally, Shifty and the Mecha Shifty Rangers managing to stop the invasion.
    ko: "…는 이야기를 라피, 아니스, 네온에게 전했다."
    ja: "…という話をラピ、アニス、ネオンに伝えた"
  event_foolburstday_14_87:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_14_88:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_14_89:
    speaker: neon
    en: "..."
    ko: "……."
    ja: "……"
  event_foolburstday_14_90:
    speaker: rapi
    en: Quite a touching story.
    ko: 감동적인 이야기군요.
    ja: 感動的な物語ですね。
  event_foolburstday_14_91:
    speaker: anis
    en: I wouldn't go around spinning that yarn to just anyone, Commander.
    ko: "…지휘관님. 어디 가서 그런 거짓말하지 마."
    ja: "…指揮官様。そういう嘘はよそでしちゃダメよ。"
  event_foolburstday_14_92:
    speaker: anis
    en: We know you, so we can laugh it off, but others might look at you strangely.
    ko: |-
      우리니까 그냥 웃으면서 넘기는 거지,
      남한테 얘기하면 이상하게 쳐다볼 거야.
    ja: |-
      私たちだから笑い飛ばせるけど、
      他の人たちにはヘンな目で見られるだけだわ。
  event_foolburstday_14_93:
    speaker: neon
    en: The plot isn't too bad, but it definitely needs some polishing.
    ko: |-
      이야기 구성은 나쁘지 않은데,
      조금 다듬긴 해야 할 것 같네요.
    ja: |-
      話の構成は悪くないですが、
      もう少しブラッシュアップした方がいいですね。
  event_foolburstday_14_94:
    speaker: "<Monologue>"
    en: "... Hehe."
    ko: "…하하."
    ja: "…ははは"
  event_foolburstday_14_95:
    speaker: "<Monologue>"
    en: Even though I experienced it firsthand,
    ko: 내가 직접 겪긴 했지만.
    ja: 嘘ではないのだが…
  event_foolburstday_14_96:
    speaker: "<Monologue>"
    en: this entire day has felt like one giant lie.
    ko: 오늘은 너무 거짓말 같은 하루였다.
    ja: 今日は本当に嘘みたいな1日だった
