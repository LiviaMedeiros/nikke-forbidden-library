    ko: Minor 차트에서의 그 폭발적인 성장Se!
    ja: Idolランキングでの爆発的な成長！
  event_staranis1_06_e_65:
    speaker: mustang_past
    en: To grow this fast in such a ruthless world? C'est remarquable! Honestly, it
      moved me!
    ko: |-
      솔직히 감격했습니Da!
      그런 Hard 한 환경에서 이렇게까지 Growth 한다는 건 놀라운 일이Jyo!
    ja: |-
      とても感激しましTA！
      Hardな環境で、ここまでの成長は
      実に驚くべきことDESU！
  event_staranis1_06_e_66:
    speaker: mustang_past
