  event_staranis1_04_s_71:
    speaker: "<Narration>"
    en: 'Title: Feels like these guys won''t last much longer'
    ko: '제목 : 얘들 곧 없어질 것 같은데'
    ja: タイトル：この子ら、そろそろ消えそう
  event_staranis1_04_s_72:
    speaker: "<Narration>"
    en: They keep messing up the same parts over and over. There's no way they don't
      know it. If anyone's aware of it, it's them.
    ko: |-
      실수하는 부분에서 계속 실수함.
      이걸 얘들이 모를 리가 없음. 본인들이 가장 잘 알 거야.
    ja: |-
      同じミスを何度も繰り返す
      本人たちが一番よく分かってるはず
  event_staranis1_04_s_73:
    speaker: "<Narration>"
    en: So if it's still not getting fixed, what does that tell you? They literally
      don't have time to practice.
    ko: |-
      그런데 안 고쳐진다는 말이 뭐겠어.
      얘들 지금 물리적으로 연습할 시간이 없어.
    ja: |-
      でも一向に直らない
      つまり、練習時間が全然足りてないってこと
  event_staranis1_04_s_74:
    speaker: "<Narration>"
    en: Apparently, all the staff bailed, so it's just the pop stars and their manager
      left. If one guy's handling their schedule while they're still performing, there's
      no way they've got any time.
    ko: |-
      직원들 다 빤스런해서 사장이랑 아이돌만 있다고 하는데
      일정 관리랑 공연까지 같이 하니까 시간이 있을 리가.
    ja: |-
      社長と本人たちしかいない事務所らしい
      スケジュール管理まで自分たちでやってたら、
      時間があるわけないな
  event_staranis1_04_s_75:
    speaker: "<Narration>"
    en: "- Maybe they just blew up more than their team size can handle."
    ko: ㄴ 인원수 대비 너무 잘 된 건가
    ja: ㄴ零細にしては成功してる方か
  event_staranis1_04_s_76:
    speaker: "<Narration>"
    en: '- Calling it "blew up" might be a stretch, lol.'
    ko: ㄴ 너무 잘 된 거라고 하기엔 좀ㅋㅋㅋ
    ja: ㄴ成功っていうにはあまりにもwww
  event_staranis1_04_s_77:
    speaker: "<Narration>"
    en: "- Feels more like they just got way ahead of themselves."
    ko: ㄴ 그냥 자기들 능력치를 모르는 거
    ja: ㄴ自分たちの能力が分かってないとか
  event_staranis1_04_s_78:
    speaker: "<Narration>"
    en: "- What a waste. They worked so hard and were actually fun to watch."
    ko: ㄴ 아깝네 얘들 열심히 해서 보기 좋았는데
    ja: |-
      ㄴ惜しいな、頑張ってるから
      　応援しがいがあったのに
  event_staranis1_04_s_79:
    speaker: "<Narration>"
    en: "- Seriously, why can't they get it together already? I've been rooting for
      them since day one, and now this? What a letdown."
    ko: ㄴ 아 제발 잘 좀 해라. 첫 공연 때부터 응원했는데 기분 더럽네
    ja: |-
      ㄴ頼むからちゃんとやってほしい
      　初ステージから応援してたのに、歯がゆい
  event_staranis1_04_s_80:
    speaker: yoyo
    en: That's rather petty. I expected you to be far more ruthless.
    ko: |-
      생각했던 것보다 쪼잔한 방법을 쓰시네요.
      거칠게 몰아붙일 줄 알았는데.
    ja: |-
      ずいぶん嫌らしい手を使ったんですね。
      正面からひねりつぶすのかと思っていました。
  event_staranis1_04_s_81:
    speaker: mustang_past
    en: Petty? Don't be absurd. Let's just say it's all perfectly legal.
    ko: 쪼잔은 무슨. 정당하고 합법적이라고 하는 게 좋겠군.
    ja: |-
      嫌らしいとは何だ。
      正当で合法的な手段だろうが。
  event_staranis1_04_s_82:
