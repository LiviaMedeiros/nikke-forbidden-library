    en: not just the flashy extérieur.
    ko: |-
      Outside의 화려함이 아닌,
      Inside의 아름다움을 가진 Idol을 기다리고 있었습니Da.
    ja: |-
      Outsideではなく、
      Insideの美しさを持つIdolを。
  event_staranis1_06_e_74:
    speaker: mustang_past
    en: And at last, I've found it in you,
    ko: You들이 그렇습니Da.
    ja: Youたちこそが、まさにそれDESU。
  event_staranis1_06_e_75:
