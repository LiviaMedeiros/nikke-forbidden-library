    ko: Real 이유는!
    ja: Realな理由は…！
  event_staranis1_06_e_68:
    speaker: mustang_past
    en: I was genuinely impressionné by your sincérité!
    ko: You들의 True에 감명했기 때문입니Da.
    ja: |-
      YouたちのHeartに
      感動したからDESU。
  event_staranis1_06_e_69:
    speaker: mustang_past
    en: You said you want to carry on Pretty's legacy, oui?
    ko: "…Pretty를 잇고 싶다고 하셨나Yo."
    ja: |-
      …Prettyの後を継ぎたいと、
      言っていましたNE。
  event_staranis1_06_e_70:
    speaker: mustang_past
    en: Not her glamour, but her mind, her spirit. Oui, exactly that.
    ko: Pretty의 화려함이 아니라, Mind와 Spirit을 잇고 싶다고 하셨나Yo.
    ja: |-
      それはPrettyの人気ではなく、
      MindとSpiritのこと、そうですNE？
  event_staranis1_06_e_71:
    speaker: anis_human
