      今この場でのお答えはいたしかねます。
  event_staranis1_06_e_81:
    speaker: mustang_past
    en: Oh? Then do take a look at the other contract underneath, s'il vous plaît.
    ko: Oh, 아래에 깔린 다른 계약서도 확인해주세Yo.
    ja: |-
      Oh、では契約書の別紙の内容も
      確認しておいてくださいNE。
  event_staranis1_06_e_82:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_83:
