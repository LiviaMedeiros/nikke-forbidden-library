    ko: Me와 함께, Pretty를 잇는 최고의 Idol이 되어주세Yo.
    ja: |-
      Meと共に、Prettyの意志を継ぐ
      最高のIdolを目指しまSHOW。
  event_staranis1_06_e_79:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_80:
