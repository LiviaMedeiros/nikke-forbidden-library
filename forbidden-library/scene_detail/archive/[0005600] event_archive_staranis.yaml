    ko: 예, 예.
    ja: はっ、はい。
  event_staranis1_06_e_72:
    speaker: mustang_past
    en: I've been waiting for a pop star with inner beauté,
    ko: Me는. 그런 Idol을 기다리고 있었습니Da.
    ja: |-
      Meは…そんなIdolを
      心待ちにしていましTA。
  event_staranis1_06_e_73:
