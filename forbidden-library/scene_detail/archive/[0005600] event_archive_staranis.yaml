      내가 보기에 우리 반이 일등이야.
    ja: |-
      アニス、すごく、すっごくカッコよかった。
      優勝間違いなしだよ。
  event_staranis1_04_s_133:
    speaker: anis_human
    en: Oh, stop it...
    ko: 아니… 뭘.
    ja: いや…それほどじゃ…
  event_staranis1_04_s_134:
    speaker: schoolgirl
    en: I honestly think you'd make a great pop star.
    ko: 아이돌 해도 될 것 같아. 응.
    ja: 目指しちゃいなよ。アイドル。
  event_staranis1_04_s_135:
    speaker: schoolgirl
    en: I-I really mean it.
    ko: 괘, 괜히 하는 말이 아니라 진심이야.
    ja: お、お世辞とかじゃなくて本気だからね？
  event_staranis1_04_s_136:
    speaker: anis_human
    en: "... A pop star, huh?"
    ko: "…아이돌."
    ja: "…アイドル。"
  event_staranis1_04_s_137:
    speaker: schoolgirl
    en: Yeah, i-if you ever become one, I'd want to be your manager.
    ko: 응. 마, 만약 아니스가 아이돌 하면 나 매니저 할래.
    ja: |-
      うん。も、もしアニスがアイドルになったら
      私、マネージャーやるから。
  event_staranis1_04_s_138:
    speaker: schoolgirl
    en: It'd be so much fun, traveling around, performing everywhere...
    ko: 진짜 재밌겠다. 이리저리 다니면서 공연하고 막….
    ja: |-
      そしたら絶対楽しいよ。
      いろんな所でライブして…
  event_staranis1_04_s_139:
    speaker: anis_human
    en: No way... Riss?!
    ko: 너…! 리스…!
    ja: あなた…！リス…！？
  event_staranis1_04_s_140:
    speaker: riss
    en: Y-yep, and I'm here to be your manager, like I promised.
    ko: 야, 약속대로. 아니스 매니저 하러 왔어.
    ja: |-
      へへ、約束通り、
      アニスのマネージャーをしにきたよ。
event_staranis1_04_e:
  event_staranis1_04_e_1:
    speaker: riss
    en: Um... I'll be T.T. STAR's manager starting today.
    ko: 오, 오늘부터 T.T. STAR의 매니저를 맡게 되었습니다.
    ja: |-
      きょ、今日からT.T. STARの
      マネージャーとして勤めさせていただきます。
  event_staranis1_04_e_2:
    speaker: riss
    en: I-it's nice to meet you all.
    ko: 잘… 부탁드립니다.
    ja: よろしく…お願いします。
  event_staranis1_04_e_3:
    speaker: hanson
    en: She reached out this morning and said she wanted to apply for the manager
      role.
    ko: |-
      오늘 아침에 연락이 왔어.
      모집 공고를 보고 매니저에 지원한다고.
    ja: |-
      今朝、急に応募があったんだ。
      求人情報を見て、マネージャー希望だとな。
  event_staranis1_04_e_4:
    speaker: hanson
    en: So you were Anis's classmate?
    ko: 동창이었다고? 아니스랑.
    ja: アニスと同級生だったのか？
  event_staranis1_04_e_5:
    speaker: riss
    en: Y-yes.
    ko: 예, 예.
    ja: は、はい。
  event_staranis1_04_e_6:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_04_e_7:
    speaker: mint
    en: What did you even do back in school? Your supporters just keep showing up.
    ko: |-
      너 학교 다닐 때 무슨 짓을 하고 다닌 거야?
      지원군이 계속 오네.
    ja: |-
      アニス、いったい学校で何をしてたの？
      助けてくれる人が次から次に出てくるわね。
  event_staranis1_04_e_8:
    speaker: hanson
    en: Her resume looks solid. She's worked at three places already, so she has plenty
      of experience.
    ko: |-
      경력도 좋아.
      세 군데 정도 다녀서 경험도 풍부해.
    ja: |-
      キャリアも申し分ない。
      ここより前に3ヶ所ほど、
      同業で勤めていたそうだ。
  event_staranis1_04_e_9:
    speaker: hanson
    en: Looks like she's quite capable.
    ko: 이력을 보면 일도 잘하고.
    ja: 履歴書を見る限り、実力も期待できる。
  event_staranis1_04_e_10:
    speaker: riss
    en: I-I've waited so long for this day...
    ko: 이, 이날만 기다렸거든요.
    ja: こ、この日をずっと待ってたんです。
  event_staranis1_04_e_11:
    speaker: anis_human
    en: Uh... Um...
    ko: 아… 그….
    ja: あ…その…
  event_staranis1_04_e_12:
    speaker: mint
    en: What's going on with Anis? She's been acting strange for a while now.
    ko: |-
      ??
      얘 왜 이래 아까부터?
    ja: |-
      ？？
      さっきからどうしちゃったの？
  event_staranis1_04_e_13:
    speaker: prika
    en: Right? What'd you do to her?
    ko: 그러게. 뭐 죄지었어?
    ja: そうだな。何か悪いことでもしてたのか？
  event_staranis1_04_e_14:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_04_e_15:
    speaker: riss
    en: Anis.
    ko: 아니스.
    ja: アニス。
  event_staranis1_04_e_16:
    speaker: riss
    en: Um... I'm looking forward to working with you.
    ko: 자, 잘 부탁해.
    ja: よ、よろしくね。
  event_staranis1_04_e_17:
    speaker: anis_human
    en: O-oh, yeah! Same here!
    ko: 어, 응! 자, 잘 부탁해!
    ja: あっ、うん！よ、よろしくね！
  event_staranis1_04_e_18:
    speaker: anis_human
    en: Man, I'm seriously glad you're here! Haha!
    ko: 와줘서 진짜 너어무 든든하다! 하하!
    ja: |-
      来てくれてホントに心強いな～！
      あはは…！
  event_staranis1_04_e_19:
    speaker: riss
    en: And... I look forward to working with all of you.
    ko: 다른 분들도 잘… 부탁드려요.
    ja: 他の皆さんも…よろしくお願いします。
  event_staranis1_04_e_20:
    speaker: mint
    en: Mhm, likewise.
    ko: 응. 잘 부탁해.
    ja: ええ。よろしくね。
  event_staranis1_04_e_21:
    speaker: prika
    en: No need to be all polite. We're the same age, aren't we?
    ko: 말은 놓는 게 좋겠다. 또래일 것 아냐.
    ja: タメ口でいいよ。同級生だったんだろ。
  event_staranis1_04_e_22:
    speaker: riss
    en: Oh... Uh, sure? Hehe.
    ko: 아, 그, 그럴까? 헤헤.
    ja: あっ、そ、そうする…？えへへ。
  event_staranis1_04_e_23:
    speaker: hanson
    en: "... Good."
    ko: "…좋아."
    ja: "…よし。"
  event_staranis1_04_e_24:
    speaker: hanson
    en: Sorry to ask this right as soon as you arrive, but our schedule management
      is a bit of a mess right now.
    ko: 오자마자 미안한데 지금 우리가 일정 관리가 전혀 안 되고 있어.
    ja: |-
      さっそくですまないが、
      スケジュール管理がまったく追いついていない。
  event_staranis1_04_e_25:
    speaker: hanson
    en: I'd really appreciate it if you could take charge of sorting it out.
    ko: 그걸 도맡아서 해결해 주면 좋겠어.
    ja: まずはそれを引き受けてもらえるとありがたい。
  event_staranis1_04_e_26:
    speaker: riss
    en: Y-yes. I actually saw people talking about it on the forums already.
    ko: 예, 예. 그렇지 않아도 아이돌 카페에서 얘기가 좀 있더라고요.
    ja: |-
      は、はい。アイドル掲示板でも
      色々ウワサされてたぐらいですし…
  event_staranis1_04_e_27:
    speaker: riss
    en: I'll take care of it, so please don't worry.
    ko: 제가 다 정리할 테니 이젠, 이젠 걱정 마세요.
    ja: |-
      私がしっかり管理しますので、
      安心してお任せください。
  event_staranis1_04_e_28:
    speaker: hanson
    en: That's good to hear.
    ko: 든든해 든든해.
    ja: なんて心強い言葉だ…
  event_staranis1_04_e_29:
    speaker: hanson
    en: All right, let's get going.
    ko: 자, 그럼 바로 출발하자.
    ja: とにかく、私たちは次の予定に向かおう。
  event_staranis1_04_e_30:
    speaker: "<Narration>"
    en: 'Title: T.T. STAR''s on a roll'
    ko: '제목 : TTSTAR 요즘 선방하네'
    ja: タイトル：TTSTAR、最近頑張ってるな
  event_staranis1_04_e_31:
    speaker: "<Narration>"
    en: Finally, their schedules aren't a mess. No more no-shows, and the performance
      quality has really improved.
    ko: 동선이 깔끔해. 펑크도 안 내고 공연 퀄도 많이 올랐어.
    ja: |-
      場所が追いやすくなってるな
      ドタキャンもなくなったし、
      パフォーマンスの質も上がってる
  event_staranis1_04_e_32:
    speaker: "<Narration>"
    en: Looks like someone's actually managing them now... probably after they started
      raking in some cash.
    ko: 돈 좀 벌더니 제대로 된 매니저라도 구한 모양이야.
    ja: |-
      稼げるようになったのか、
      まともなマネージャーを雇ったっぽい
  event_staranis1_04_e_33:
    speaker: "<Narration>"
    en: Honestly, it's nice to see. Keep this up, and an ad deal might actually happen.
    ko: 요즘 보기 좋네. 이대로 가면 광고 하나 받는 것도 꿈은 아닐지도?
    ja: |-
      最近いい感じだな
      この調子なら、CM出演も夢じゃないかも？
  event_staranis1_04_e_34:
    speaker: "<Narration>"
    en: "- An ad deal? Haha, like for some dog food brand?"
    ko: ㄴ 광고가 뉘 집 개 이름인 줄 아나ㅋㅋㅋㅋ
    ja: ㄴそこまで甘くはないだろwww
  event_staranis1_04_e_35:
    speaker: "<Narration>"
    en: "- You know how it goes. Once things start looking up, people suddenly appear
      to hype it."
    ko: ㄴ 하여간 꼭 조금 잘된다 싶으면 올려 치는 것들이 있어요
    ja: |-
      ㄴちょっとうまくいき始めると、
      　すぐアゲる奴がいるよな
  event_staranis1_04_e_36:
    speaker: "<Narration>"
    en: "- And of course, there's always someone ready to drag them down."
    ko: ㄴ 하여간 꼭 조금 잘된다 싶으면 까내리는 것들이 있어요
    ja: |-
      ㄴちょっとうまくいき始めると、
      　すぐサゲる奴がいるよな
  event_staranis1_04_e_37:
    speaker: anis_idol
    en: Phew... that's done.
    ko: 후우. 끝났다.
    ja: ふう…終わった。
  event_staranis1_04_e_38:
    speaker: hanson
    en: What's next, Riss?
    ko: 리스. 다음은?
    ja: リス、次は？
  event_staranis1_04_e_39:
    speaker: riss
    en: The department store plaza, in one hour.
    ko: 1시간 뒤. 백화점 광장이에요.
    ja: 1時間後、デパートの広場です。
  event_staranis1_04_e_40:
    speaker: hanson
    en: Looks like we've got plenty of time.
    ko: 시간이 제법 여유가 있네.
    ja: 少し余裕があるな。
  event_staranis1_04_e_41:
    speaker: riss
    en: The event manager there tends to hold a grudge if you don't arrive 20 minutes
      early to greet them...
    ko: 거기 행사 담당자, 20분 전에 도착해서 인사 안 해주면 뒤끝 있어요.
    ja: |-
      そこのイベント担当者ですが、
      20分前には到着してあいさつしないと
      しつこく絡んでくるそうです。
  event_staranis1_04_e_42:
    speaker: riss
    en: So we should probably go say hello first.
    ko: 빨리 가서 인사 미리 해놔야 해요.
    ja: なので、早めに到着しないといけません。
  event_staranis1_04_e_43:
    speaker: riss
    en: I heard they like milk tea, so we should bring some.
    ko: 밀크티 좋아한다니까 사가야 하고요.
    ja: |-
      好物はミルクティーだそうですので、
      差し入れとして買っていきましょう。
  event_staranis1_04_e_44:
    speaker: hanson
    en: Oh... okay.
    ko: 오… 알았어.
    ja: わ…分かった。
  event_staranis1_04_e_45:
    speaker: riss
    en: Next is the general hospital entrance. Everyone's got their safety shorts,
      right?
    ko: |-
      그 다음엔 종합 병원 앞인데,
      다들 속바지 챙겨왔지?
    ja: |-
      その次は総合病院の前だけど、
      みんなアンダースコートは持ってきた？
  event_staranis1_04_e_46:
    speaker: mint_o
    en: Oh yes, you told me to bring it, so I did. But what's it for?
    ko: 아, 응. 챙기라길래 챙겼는데, 이건 왜?
    ja: |-
      ええ、あるわ。言われたから用意したけど、
      どうして必要なの？
  event_staranis1_04_e_47:
    speaker: prika_o
    en: It's not like our choreography's ridiculously intense.
    ko: 속옷 보일 정도로 과격한 안무는 없는데.
    ja: |-
      下が見えるほど激しい振りつけは
      ないはずだ。
  event_staranis1_04_e_48:
    speaker: riss
    en: The wind between those buildings gets pretty bad.
    ko: 거기 빌딩풍이 엄청 심해.
    ja: ビル風がすごい会場なの。
  event_staranis1_04_e_49:
    speaker: riss
    en: Some fans even treat it like a prime waiting spot.
    ko: 그래서 일부 팬들한테는 명당 취급이고.
    ja: "「神会場」って言う人たちまでいるぐらい。"
  event_staranis1_04_e_50:
    speaker: riss
    en: Let's change in the car on the way there.
    ko: 이동하면서, 차에서 갈아입자.
    ja: 移動中に車の中で履いておいて。
  event_staranis1_04_e_51:
    speaker: riss
    en: You installed the privacy curtain, right?
    ko: 차에 차단막 달아놨죠?
    ja: 車のカーテンはもう取り付けてありましたよね？
  event_staranis1_04_e_52:
    speaker: hanson
    en: Oh yeah, I did.
    ko: 어, 응. 달아놨지.
    ja: ああ、取り付けは済んでいる。
  event_staranis1_04_e_53:
    speaker: riss
    en: All right, let's go.
    ko: 좋아요. 가요 그럼.
    ja: よし。では、出発しましょう。
  event_staranis1_04_e_54:
    speaker: mint_o
    en: Wow... she's incredible.
    ko: "…와. 대단해."
    ja: "…はぁ、すごいわね。"
  event_staranis1_04_e_55:
    speaker: prika_o
    en: Yeah, you can say that again.
    ko: 정말. 진짜 매니저 같아.
    ja: まったくだ。これがプロのマネージャーか。
  event_staranis1_04_e_56:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_04_e_57:
    speaker: mint_o
    en: That's when I realized what kind of manager Boss really is.
    ko: 사장님이 얼마나 막무가내 매니저였는지 알게 됐어.
    ja: |-
      社長がどれだけ
      めちゃくちゃなマネージャーだったかも、
      よく分かったわね。
  event_staranis1_04_e_58:
    speaker: prika_o
    en: Yeah. Anyway, let's head to the next venue. That's all we can do for now.
    ko: |-
      그러게.
      끝. 이제 다음으로 가자. 이것밖에 없었으니까.
    ja: |-
      そうだな。
      「終わり」「次の場所」しか言わなかったし。
  event_staranis1_04_e_59:
    speaker: hanson
    en: Guys... I'm the boss, you know. Even if I was also doubling as manager and
      producer.
    ko: "…얘들아. 난 사장이잖니. 매니저랑 프로듀서 겸업이긴 했지만."
    ja: |-
      …私はあくまで経営者だからな。
      マネージャーとプロデューサーまで
      兼任していたのは、やむを得ずだ。
  event_staranis1_04_e_60:
    speaker: "<Narration>"
    en: 'RE: Title: T.T. STAR''s on a roll'
    ko: "[RE] 제목 : TTSTAR 요즘 선방하네"
    ja: "[RE]タイトル：TTSTAR、最近頑張ってるな"
  event_staranis1_04_e_61:
    speaker: "<Narration>"
    en: All that talk about ads? Yeah, it's not just empty hype.
    ko: 광고 얘기가 그냥 호황된 이야기인 것만이 아닌 게,
    ja: CM出演なんてもうハッピーな話じゃない
  event_staranis1_04_e_62:
    speaker: "<Narration>"
    en: There are so many pop stars these days, so low-budget ads are all over the
      place.
    ko: 요즘 아이돌이 너무 많아서 저가 광고들 진짜 많음.
    ja: |-
      アイドルが多すぎて、
      ギャラの相場も下がり放題だからな
  event_staranis1_04_e_63:
    speaker: "<Narration>"
    en: T.T. STAR is sitting at number 32 on the indie charts. That's a crazy jump.
    ko: TTSTAR 지금 마이너 차트 32위임. 올라가는 속도가 장난이 아니라는 얘기임.
    ja: |-
      TTSTARはもうインディーズ32位、
      ランクアップのスピードがえげつない。
  event_staranis1_04_e_64:
    speaker: "<Narration>"
    en: The higher they climb, the more expensive they get. If I were an advertiser,
      I'd snag them now before they blow up.
    ko: 차트 올라가면 단가도 비싸지고 하니 광고주 입장에서 지금 하나 물어놓는 것도 나쁘지 않을 듯.
    ja: |-
      ランキングで上にいけば相場も上がるから、
      広告主からしたら今のうちに
      オファー出しとくのも悪くないかもな
  event_staranis1_04_e_65:
    speaker: "<Narration>"
    en: "- Empty hype? Lol."
    ko: ㄴ 호황된ㅋㅋㅋㅋ
    ja: ㄴハッピーな話www
  event_staranis1_04_e_66:
    speaker: "<Narration>"
    en: "- The combo for hype mode is ↓↘→ + Punch."
    ko: ㄴ 호황권의 커맨드는 ↓↘→ + 펀치이다.
    ja: ㄴハッピー拳のコマンドは↓↘→ +P
  event_staranis1_04_e_67:
    speaker: "<Narration>"
    en: '- Glad you didn''t go with "cheap af."'
    ko: ㄴ 저가를 X까로 안 쓴게 다행ㅋㅋㅋ
    ja: |-
      ㄴギャラの相場が下がってるって、
      　安くてどれぐらいだろうなw
  event_staranis1_04_e_68:
    speaker: "<Narration>"
    en: "- They're a bit bland, though. Hard to sell."
    ko: ㄴ 근데 얘들 특징이 없어서 광고 받기 좀 애매해
    ja: |-
      ㄴよっぽど特徴が無いと
      　CMのインパクトが薄くなるしな
  event_staranis1_04_e_69:
    speaker: "<Narration>"
    en: "- Yeah, they need something to really make them stand out."
    ko: ㄴ ㅇㅇ뭐라도 뚜렷해야 광고를 받든가 하지
    ja: |-
      ㄴ確かに、何かこれって強味がないと
      　オファーも来ないだろうな
  event_staranis1_04_e_70:
    speaker: "<Narration>"
    en: "- They're just on the indie charts, and y'all are already losing your minds."
    ko: ㄴ 마이너 차트로 호들갑은
    ja: ㄴ下層のランキングごときで大騒ぎだな
  event_staranis1_04_e_71:
    speaker: "<Narration>"
    en: That evening...
    ko: 그날 저녁.
    ja: その日の夕方
  event_staranis1_04_e_72:
    speaker: anis_human
    en: Pffft!
    ko: 푸후--!!
    ja: ブフーッ！！
  event_staranis1_04_e_73:
    speaker: "<Narration>"
    en: Anis spits out the soda she was drinking.
    ko: 아니스는 마시고 있던 탄산수를 앞으로 힘차게 내뿜었다.
    ja: |-
      アニスが飲んでいた炭酸水を
      前方へ勢いよく吹き出した
  event_staranis1_04_e_74:
    speaker: prika
    en: Seriously? I just got out of the shower.
    ko: "…나 방금 샤워하고 왔는데."
    ja: "…シャワー浴びてきたばっかりだったんだが。"
  event_staranis1_04_e_75:
    speaker: anis_human
    en: S-sorry! Soda went down the wrong pipe.
    ko: |-
      미, 미안.
      그 탄산수 샤워 이런 것도 많이 하니까. 응.
    ja: |-
      ごっ、ごめん。
      でも炭酸水シャワーって
      最近流行ってるらしいから、ハハ…
  event_staranis1_04_e_76:
    speaker: anis_human
    en: W-wait, what did you just say?
    ko: 그, 그래서. 뭐라고요?
    ja: と、とにかく…今、なんて言いました？
  event_staranis1_04_e_77:
    speaker: hanson
    en: We just landed an ad deal!
    ko: 광고가! 들어왔다!
    ja: CM出演のオファーが！来たぞ！
  event_staranis1_04_e_78:
    speaker: anis_human
    en: Pffft!
    ko: 푸후--!!
    ja: ブフーッ！！
  event_staranis1_04_e_79:
    speaker: prika
    en: You're doing that on purpose, aren't you?
    ko: 너 일부러 그러는 거지.
    ja: わざとやってないか？
  event_staranis1_04_e_80:
    speaker: anis_human
    en: No, that's not it. It's just... I still can't wrap my head around it.
    ko: 아, 아니. 몇 번을 들어도 믿어지지 않아서 그래.
    ja: |-
      ち、違うって。
      何回聞いても信じられないから…
  event_staranis1_04_e_81:
    speaker: hanson
    en: It's a soda commercial.
    ko: 탄산수 광고야.
    ja: 炭酸水のCMだ。
  event_staranis1_04_e_82:
    speaker: hanson
    en: They just launched a new drink and reached out to ask if we could be the models
      for the ad.
    ko: |-
      당연하겠지만 새롭게 런칭한 탄산수고,
      우릴 광고 모델로 쓰고 싶다고 연락이 왔어.
    ja: |-
      新しく発売される商品で、君たちを
      CMに起用したいと連絡があった。
  event_staranis1_04_e_83:
    speaker: hanson
    en: And Anis seems to be the reason they came to us.
    ko: 계기는, 아니스.
    ja: きっかけは、アニスのようだな。
  event_staranis1_04_e_84:
    speaker: anis_human
    en: Pffft!
    ko: 푸후--!!
    ja: ブフーッ！！
  event_staranis1_04_e_85:
    speaker: prika
    en: Cut it out.
    ko: 그만해라 진짜.
    ja: いい加減にしてくれ。
  event_staranis1_04_e_86:
    speaker: anis_human
    en: Wait... don't tell me it's because I'm always drinking soda?
    ko: 어… 설마 제가 맨날 탄산수만 마셔대서?
    ja: |-
      まさか…私が毎日、
      炭酸水ばっかり飲んでたから？
  event_staranis1_04_e_87:
    speaker: hanson
    en: That's right.
    ko: 그렇지.
    ja: そういうことだ。
  event_staranis1_04_e_88:
    speaker: mint
    en: Wow, don't tell me you've been drinking soda this whole time just for this?
    ko: 와 너 설마 이걸 노리고 지금까지 계속 탄산수만….
    ja: もしかして、それ狙いで炭酸水ばっかり…
  event_staranis1_04_e_89:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_04_e_90:
    speaker: anis_human
    en: Uh... Yeah, you could say it's viral marketing.
    ko: 그… 렇지. 고도의 바이럴이랄까 응.
    ja: |-
      そ…そーよ。
      これが高度なマーケティング戦略ってヤツ。
  event_staranis1_04_e_91:
    speaker: hanson
    en: The pay's not bad. For us, it's actually quite a large sum.
    ko: |-
      금액도 나쁘지 않아.
      이 정도면 우리한테는 커.
    ja: |-
      出演料も悪くない。
      今の私たちには高額とも言えるくらいだ。
  event_staranis1_04_e_92:
    speaker: hanson
    en: But honestly, what's most important is the exposure.
    ko: 사실 금액보다 인지도가 올라가는 게 더 크지.
    ja: |-
      それ以上に、知名度向上が
      私たちにとっては大きい。
  event_staranis1_04_e_93:
    speaker: hanson
    en: There's just one condition.
    ko: 대신 조건이 있어.
    ja: ただし、条件がある。
  event_staranis1_04_e_94:
    speaker: hanson
    en: For six months after the ad airs, you can only drink their sparkling water.
      Nothing too difficult, right?
    ko: 광고 이후에 반년 동안은 거기 탄산수만 마실 것. 쉽지?
    ja: |-
      CM撮影から半年の間は、
      別ブランドの炭酸水を飲まないこと。
      難しくはないな？
  event_staranis1_04_e_95:
    speaker: anis_human
    en: Wh-whoa, that's perfect.
    ko: 우, 우와. 이거 너무 딱인데.
    ja: わ、わあ。私にはピッタリね。
  event_staranis1_04_e_96:
    speaker: anis_human
    en: Does it have anything special?
    ko: 뭐 제품 특징이라던가 그런 건 없어요?
    ja: その商品の特徴とか、他の情報はないんですか？
  event_staranis1_04_e_97:
    speaker: riss
    en: I-it's not really a diet drink, but it's more for digestion.
    ko: 다, 다이어트 용이라기보단 소화 목적으로 만들어진 탄산수래.
    ja: |-
      ええと…ダイエットよりも、
      消化促進が売りの炭酸水なんだって。
  event_staranis1_04_e_98:
    speaker: riss
    en: So, um... if you drink it right before going on stage, you might end up burping
      into the mic.
    ko: 그러니까 어… 무대 올라가기 전에 마시면 마이크에 대고 브레스를 뿜게 되는 거지.
    ja: |-
      それで…ステージに上がる前に飲んだら、
      マイクに向かってゲップしちゃうかも。
  event_staranis1_04_e_99:
    speaker: riss
    en: J-just watch out for that and you should be fine.
    ko: 그, 그것만 조심하면 괜찮을 거야.
    ja: うん…それさえ気をつければ大丈夫だと思う。
  event_staranis1_04_e_100:
    speaker: anis_human
    en: Oh... Gotcha, thanks.
    ko: 아… 응. 고마워.
    ja: あー…うん。気を付けるわ。
  event_staranis1_04_e_101:
    speaker: hanson
    en: We're meeting them tomorrow to go over the details, set the schedule, and
      shoot. Sounds good?
    ko: |-
      내일 만나서 얘기 듣고, 일정 잡고 촬영할 거야.
      괜찮지?
    ja: |-
      明日、話を聞きに行って、
      スケジュールが決まり次第撮影に入る。
      問題ないな？
  event_staranis1_04_e_102:
    speaker: mint
    en: Of course. Wow, I can't believe this is actually happening.
    ko: |-
      당연히 괜찮죠.
      세상에, 이런 날이 다 오네.
    ja: |-
      もちろん大丈夫です。
      こんな日が来るなんて、信じられないわ。
  event_staranis1_04_e_103:
    speaker: prika
    en: An ad, huh? Wonder what the concept's gonna be.
    ko: 광고라, 광고. 무슨 컨셉일까.
    ja: CM、CMか。どういう雰囲気のだろうな。
  event_staranis1_04_e_104:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_04_e_105:
    speaker: mint
    en: What's wrong, Anis? Something bothering you?
    ko: 왜 그래? 뭐가 맘에 안 들어?
    ja: どうしたの？何か問題？
  event_staranis1_04_e_106:
    speaker: anis_human
    en: No, it's just...
    ko: 아니….
    ja: いや…
  event_staranis1_04_e_107:
    speaker: anis_human
    en: This feels like a dream.
    ko: 너무 꿈만 같아서.
    ja: なんだか夢みたいで…
  event_staranis1_04_e_108:
    speaker: mint
    en: If this turned out to be a dream, that'd be pretty funny, wouldn't it?
    ko: 이랬는데 진짜 꿈이면 진짜 웃기겠다. 그치?
    ja: |-
      これで本当に夢だったら、
      笑っちゃうわよね？
  event_staranis1_04_e_109:
    speaker: anis_human
    en: "... Yeah, real funny."
    ko: "…많이 웃기다 정말. 응."
    ja: "…ホント、大爆笑しちゃうかも。"
event_staranis1_05_s:
  event_staranis1_05_s_1:
    speaker: "<Narration>"
    en: Countless droplets scatter wildly across the screen.
    ko: 화면에 수많은 물방울들이 어지럽게 흩날린다.
    ja: 画面いっぱいに無数の水滴が散っている
  event_staranis1_05_s_2:
    speaker: "<Narration>"
    en: They swirl together into a single point, then burst with a lively pop.
    ko: 물방울들이 한곳에 모여들고, 이내 경쾌하게 터진다.
    ja: 水滴がひとつに集まり、たちまち弾けた
  event_staranis1_05_s_3:
    speaker: "<Narration>"
    en: Bubbles of soda rise to fill the frame as dazzling effects explode around
      them.
    ko: |-
      화면 가득 탄산수의 기포가 솟아오르고,
      화려한 효과들이 뿜어져 나온다.
    ja: |-
      炭酸水を思わせる気泡が
      画面いっぱいに立ち上り
      爽快なエフェクトが炸裂する
  event_staranis1_05_s_4:
    speaker: "<Narration>"
    en: The bubbles and light gather together, and a can of sparkling water suddenly
      springs into view.
    ko: |-
      모든 기포와 효과가 한곳으로 모여들고,
      탄산수 캔이 튀듯이 생겨난다.
    ja: |-
      気泡とエフェクトがまたひとつに集まり、
      炭酸水の缶が飛び出す
  event_staranis1_05_s_5:
    speaker: "<Narration>"
    en: A hand reaches in and grabs it.
    ko: 그 탄산수 캔을 잡는 손.
    ja: その缶をつかむ手が映った
  event_staranis1_05_s_6:
    speaker: yoyo
    en: Refreshment that bursts with flavor!
    ko: 폭발하듯 터져 나오는 상쾌함!
    ja: 弾ける爽快感！
  event_staranis1_05_s_7:
    speaker: yoyo
    en: Big Bang Soda!
    ko: 빅뱅 스파클링 워터!
    ja: ビッグバン・スパークリング・ウォーター！
  event_staranis1_05_s_8:
    speaker: "<Narration>"
    en: The next commercial starts playing.
    ko: 다음 광고가 흘러나온다.
    ja: そして、次のCMに切り替わった
  event_staranis1_05_s_9:
    speaker: "<Narration>"
    en: The members of T.T. STAR stare at the TV in a daze.
    ko: T.T. STAR는 TV를 멍하니 바라보고 있다.
    ja: |-
      T.T. STARの全員がテレビを
      驚きあきれたような表情で見つめていた
  event_staranis1_05_s_10:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_11:
    speaker: anis_human
    en: Th-that piece of shit...!
    ko: 저, 저 새X가 진짜…!
    ja: よ、よりにもよって、コイツ…！
  event_staranis1_05_s_12:
    speaker: mint
    en: "... They changed the model to Yoyo? That's a bit much."
    ko: "…바뀐 광고 모델이 요요였어? 너무하네."
    ja: |-
      …私たちの代わりに採用されたのって、
      ヨヨだったの？信じられないわ。
  event_staranis1_05_s_13:
    speaker: prika
    en: She's straight-up picking on you.
    ko: 대놓고 괴롭히네.
    ja: あからさまな嫌がらせだな。
  event_staranis1_05_s_14:
    speaker: anis_human
    en: H-hey, isn't this illegal or something? What's it called again... some kind
      of fair trade violation?
    ko: |-
      이, 이거 그런 거 아냐? 그 뭐냐.
      공정 거래 어쩌구 위반…!
    ja: |-
      こ、これってアレなんじゃないの？ほら。
      公正ナントカ法とか…！
  event_staranis1_05_s_15:
    speaker: riss
    en: L-legally, there's no issue since we never finalized the contract...
    ko: |-
      버, 법적으로는 문제없어.
      계약을 확정 지은 것도 아니었고….
    ja: |-
      ほ、法律では争えないよ。
      契約が決まってたわけじゃないから…
  event_staranis1_05_s_16:
    speaker: anis_human
    en: You've gotta be kidding me...
    ko: 아… 진짜….
    ja: ああ…もう…
  event_staranis1_05_s_17:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_18:
    speaker: anis_human
    en: Here we go... again...
    ko: 또… 이렇게….
    ja: また…そうやって…
  event_staranis1_05_s_19:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_20:
    speaker: mint
    en: Tetra wouldn't take a loss just to satisfy Yoyo's personal vendetta.
    ko: 단순히 요요의 복수심이나 이런 거로 테트라가 손해를 감수하면서 움직이진 않을 거야.
    ja: |-
      ヨヨの個人的な意地悪が理由なら、
      テトラが損を被ってまで動かないわよね。
  event_staranis1_05_s_21:
    speaker: anis_human
    en: A loss? What loss?
    ko: 손해라니 무슨 손해.
    ja: 損って、何か損してるの？
  event_staranis1_05_s_22:
    speaker: mint
    en: Yoyo's image. This isn't the kind of ad a chart-topping pop star like her
      would normally take.
    ko: |-
      요요의 이미지.
      요요 같은 탑 아이돌이 할법한 광고는 아니거든.
    ja: |-
      ヨヨのイメージ。
      トップアイドルがやるほどの
      案件じゃないもの。
  event_staranis1_05_s_23:
    speaker: mint
    en: Someone who's built her whole persona around mystique, promoting some obscure
      new product? That alone would hurt her image.
    ko: 신비주의로 무장한 요요가 저런 신생에, 인지도도 낮은 상품의 광고를 한다는 것 자체가 손해야.
    ja: |-
      謎多きアイドルってキャラで売ってるのに、
      このCMに出ること自体が損なのよ。
  event_staranis1_05_s_24:
    speaker: mint
    en: They wouldn't take that kind of loss just to mess with you.
    ko: 단순히, 널 괴롭히기 위해 손해를 감수하진 않을 거란 얘기지.
    ja: |-
      つまり、単にあなたへの嫌がらせ目的で
      こんなことはできないってこと。
  event_staranis1_05_s_25:
    speaker: anis_human
    en: Nah, that's exactly the kind of crap she'd pull. She's a nasty piece of work.
    ko: 아닐걸. 쟤는 저러고도 남아. 음침하고 지저분한 놈이라서.
    ja: |-
      どうかしら。あいつならやりかねないわ。
      陰湿で汚いヤツだったし。
  event_staranis1_05_s_26:
    speaker: mint
    en: Yoyo can't force something like this on her own. She works for Tetra, after
      all.
    ko: |-
      요요 혼자서 떼쓴다고 될 일이 아니라는 거야.
      테트라 소속의 아이돌이니까.
    ja: |-
      ひとりで好きにできる問題じゃないの。
      テトラって会社の所属アイドルだから。
  event_staranis1_05_s_27:
    speaker: mint
    en: Hmm... something about this feels off.
    ko: 흐음… 뭔가 구린 냄새가 나.
    ja: んー…何か臭うわね。
  event_staranis1_05_s_28:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_29:
    speaker: mint
    en: Didn't Boss say he used to be a director at Tetra?
    ko: 사장님 테트라에서 이사 했다고 했지?
    ja: |-
      うちの社長って、
      テトラで理事をやってたのよね？
  event_staranis1_05_s_30:
    speaker: mint
    en: What if he left on bad terms with Mustang?
    ko: 나올 때 뭐 크게 밉보인 거 아냐? 머스탱한테.
    ja: |-
      会社を離れる時、
      すごく恨みを買ったりしてないかしら？
      マスタング社長あたりに。
  event_staranis1_05_s_31:
    speaker: anis_human
    en: So what, this is some big corporate revenge scheme?
    ko: 대, 대기업에서의 복수 뭐 이런 건가?
    ja: だ、大企業ににらまれてるってこと？
  event_staranis1_05_s_32:
    speaker: prika
    en: Yeah, right. Why would Tetra even waste time on some tiny company like us?
    ko: |-
      현실성 없는 얘기야.
      테트라에서 우리 같은 작은 회사를 왜 괴롭혀.
    ja: |-
      現実味がないな。
      うちみたいな弱小事務所に
      テトラが構う理由もないだろ。
  event_staranis1_05_s_33:
    speaker: prika
    en: The client just changed their mind, that's all.
    ko: 그냥 클라이언트 쪽에 심적 변화가 있었겠지.
    ja: クライアントが急に心変わりしただけだ。
  event_staranis1_05_s_34:
    speaker: anis_human
    en: "... Good, then."
    ko: "…그럼 다행인데."
    ja: "…だったらいいんだけど。"
  event_staranis1_05_s_35:
    speaker: anis_human
    en: Anyway, where'd Boss disappear to?
    ko: 사장님은 어디 갔어?
    ja: うちの社長はどこ行ったの？
  event_staranis1_05_s_36:
    speaker: riss
    en: Oh, yeah... he said he had to step out for a bit.
    ko: 어, 응. 잠깐 외출한다고 나가셨어.
    ja: ああ、うん。ちょっと出かけてくるって。
  event_staranis1_05_s_37:
    speaker: riss
    en: But he didn't say where...
    ko: 어디 간다고는 말 안… 했고.
    ja: 行き先は…聞いてないけど。
  event_staranis1_05_s_38:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_39:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_40:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_41:
    speaker: anis_human
    en: Hey, guys! How 'bout we blow off some steam?
    ko: 몸이나 좀 풀까?
    ja: ストレッチでもしない？
  event_staranis1_05_s_42:
    speaker: mint
    en: We already performed, so what's the point of warming up again?
    ko: 됐어. 공연을 그렇게 하고 왔는데 무슨 몸을 또 풀어.
    ja: |-
      やめとくわ。ステージで動いてきた後だし、
      これ以上ほぐすところもないでしょ。
  event_staranis1_05_s_43:
    speaker: anis_human
    en: Otherwise, we'll just sit here moping around.
    ko: 안 그러면 여기서 계속 우울해하고 있을 테니까.
    ja: |-
      そうでもしないと、
      ずっとここで落ち込んだままでしょ。
  event_staranis1_05_s_44:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_45:
    speaker: anis_human
    en: C'mon, let's go dance our hearts out!
    ko: 가자. 가서 신나게 춤이나 추자.
    ja: 行きましょ。思いっきり身体を動かすの。
  event_staranis1_05_s_46:
    speaker: mint
    en: "*Sigh...*"
    ko: "…하아."
    ja: "…はぁ。"
  event_staranis1_05_s_47:
    speaker: anis_human
    en: Up, up! Let's go!
    ko: 자자, 일어나.
    ja: ほらほら、立って。
  event_staranis1_05_s_48:
    speaker: mint
    en: Hey, don't pull so hard! You're way too strong.
    ko: 아 잡아당기지 마. 힘만 쎄가지고.
    ja: 引っ張らないで。ホント、すごい力ね。
  event_staranis1_05_s_49:
    speaker: anis_human
    en: Ugh, why are you so heavy?
    ko: 근데 너 진짜 왜 이렇게 무겁냐.
    ja: ちょっと、なんでこんなに重たいのよ。
  event_staranis1_05_s_50:
    speaker: prika
    en: Well, what do you expect when she's always stuffing her face with carbs?
    ko: 맨날 탄수화물만 먹어대니까 그렇지.
    ja: 炭水化物の摂りすぎだろうな。
  event_staranis1_05_s_51:
    speaker: riss
    en: Y-you all go on ahead. I'll prepare the drinks.
    ko: 다, 다녀들 와. 마실 거 준비해 놓을게.
    ja: い、行ってきて。飲み物、準備しておくから。
  event_staranis1_05_s_52:
    speaker: anis_human
    en: All right, thanks.
    ko: "…어. 부탁해. 고마워."
    ja: "…うん、お願い。ありがと。"
  event_staranis1_05_s_53:
    speaker: "<Narration>"
    en: The three of them head into the practice room.
    ko: 셋은 연습실로 걸어 들어갔다.
    ja: 3人はトレーニングルームへ入っていった
  event_staranis1_05_s_54:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_55:
    speaker: riss
    en: Boss said he's going to Tetra Line...
    ko: 사장님. 테트라 라인으로 간다고 했었지.
    ja: 社長…テトララインに行くって言ってたけど…
  event_staranis1_05_s_56:
    speaker: riss
    en: He wouldn't be going there just to start a fight, would he...?
    ko: "…설마 따지러 간 건 아니겠지?"
    ja: "…まさか、抗議しに行ったんじゃないよね？"
  event_staranis1_05_s_57:
    speaker: hanson
    en: I must say, that's remarkably petty of you.
    ko: 믿기지 않을 정도로 옹졸하게 구시는군요.
    ja: |-
      信じられないほど、
      小物のようなことをしますね。
  event_staranis1_05_s_58:
    speaker: mustang_past
    en: "... Wh-what?"
    ko: "…뭐, 뭐?"
    ja: "…ああ、何か言ったか？"
  event_staranis1_05_s_59:
    speaker: hanson
    en: I said that's petty of you.
    ko: 옹졸하다고 말씀드렸습니다.
    ja: 小物のようだと言いました。
  event_staranis1_05_s_60:
    speaker: hanson
    en: Or perhaps you have so much time on your hands that you feel the need to trample
      a small company like ours?
    ko: 아니면 우리 같은 작은 회사를 그렇게 밟을 정도로 한가하신 겁니까?
    ja: |-
      それとも、うちのような小規模の事務所に
      いちいち構うほどヒマになったのですか？
  event_staranis1_05_s_61:
    speaker: hanson
    en: It seems age has dulled your judgment.
    ko: 나이가 들더니, 감도 다 떨어지신 모양이군요.
    ja: 年を取ると、感覚が鈍るのでしょうね。
  event_staranis1_05_s_62:
    speaker: mustang_past
    en: Have you lost your mind?
    ko: 이게 미쳤나.
    ja: 言わせておけば…
  event_staranis1_05_s_63:
    speaker: mustang_past
    en: You climb a little on some indie chart, and suddenly you're getting cocky?
    ko: 마이너 차트에서 좀 올라갔다고 아주 기고만장해졌지?
    ja: |-
      二流以下どものランキングに
      名前が入ったぐらいで、
      つけあがってるようだな？
  event_staranis1_05_s_64:
    speaker: mustang_past
    en: Want me to crush you properly?
    ko: 각 잡고 한 번 밟아 줘?
    ja: 本気で潰されたいのか？
  event_staranis1_05_s_65:
    speaker: hanson
    en: Poaching our staff, overloading our schedule, and using Yoyo to steal our
      ad deal... Did you really think I wouldn't notice?
    ko: 우리 쪽 사람을 빼간 것, 일정을 쏟아부은 것, 요요를 앞세워 광고를 채간 것, 제가 모를 거라 생각했습니까.
    ja: |-
      スタッフの引き抜き、過剰な仕事のプッシュ、
      果てにはヨヨまで使ってCM案件の奪取。
      全て分かっています。
  event_staranis1_05_s_66:
    speaker: hanson
    en: Do you want me back that badly? After all, I'll have no choice but to return
      if T.T. STAR falls apart.
    ko: |-
      제가 그렇게 탐나십니까.
      T.T. STAR가 망해야 제가 다시 돌아올 테니까.
    ja: |-
      そこまで私を取り戻したいですか？
      T.T. STARを狙うのは、それが目的でしょう。
  event_staranis1_05_s_67:
    speaker: mustang_past
    en: You're getting far too full of yourself. Know your place.
    ko: |-
      자의식과잉이 너무 과하군.
      주제 파악이나 해라.
    ja: |-
      自意識過剰だな。
      身の程をわきまえろ。
  event_staranis1_05_s_68:
    speaker: hanson
    en: No, you're the type who always needs someone by your side.
    ko: 아니요. 당신은 옆에 항상 사람이 있어야 합니다.
    ja: いいえ。あなたはどうしても隣に人が欲しい。
  event_staranis1_05_s_69:
    speaker: hanson
    en: Someone to absorb your emotions. Someone to amuse you when you get bored.
    ko: |-
      당신의 감정을 받아줄 쓰레기통이 필요하고,
      당신의 심심함을 달래주기 위한 장난감이 필요합니다.
    ja: |-
      感情を吐き捨てるゴミ箱、もしくは、
      退屈を紛らわせるおもちゃが
      必要ですから。
  event_staranis1_05_s_70:
    speaker: hanson
    en: Someone who tolerates that dreadful temper of yours, yet pushes back just
      enough to keep things interesting.
    ko: |-
      그 엿같은 성격을 다 받아주면서,
      적당히 반항도 하는 사람이 필요하단 얘깁니다.
    ja: |-
      あなたの最低な性格を受け止めた上で、
      適度に反発してくる人物でないといけない。
  event_staranis1_05_s_71:
    speaker: hanson
    en: And then, whenever it suits you, you crush them with your power and authority.
      That's what you call the joy of living, isn't it?
    ko: 그리고 그걸, 힘과 권력으로 깔아뭉개는 게 인생 사는 낙이지 않습니까.
    ja: |-
      そしてそういう人物を、
      実力と権力で従わせるのがあなたの趣味だ。
  event_staranis1_05_s_72:
    speaker: hanson
    en: Mrs. Miss and I played those roles for you perfectly well.
    ko: 미세스 미스와 제가 그 역할을 아주 잘 해냈죠.
    ja: |-
      少し前まで、それが
      ミセス・ミスと私の役割だった。
  event_staranis1_05_s_73:
    speaker: hanson
    en: But now that everyone's gone, you don't quite know what to do with yourself,
      do you?
    ko: 그런데 다들 떠나버려서, 어쩔 줄 모르는 거 아닙니까.
    ja: |-
      どちらもいなくなって、
      そうとう苦しんでいるようですね。
  event_staranis1_05_s_74:
    speaker: mustang_past
    en: Well, look at that. You've grown bold enough to spout that kind of nonsense
      to my face.
    ko: 많이 컸구나 한슨. 그딴 헛소리를 내 앞에서 지껄이는 걸 보니.
    ja: |-
      偉くなったものだな、ハンソン君。
      俺にそんな口が利けるようになるとは。
  event_staranis1_05_s_75:
    speaker: hanson
    en: Please stop.
    ko: 그만두십시오.
    ja: もうやめてください。
  event_staranis1_05_s_76:
    speaker: hanson
    en: We're managing just fine on our own.
    ko: 우리는 우리 나름대로 잘 해내 가고 있습니다.
    ja: 私たちは私たちなりに、前へ進んでいます。
  event_staranis1_05_s_77:
    speaker: hanson
    en: So please just leave us be.
    ko: 그러니 제발 가만히 좀 놔둬 주십시오.
    ja: どうか、道を塞ごうとしないでいただきたい。
  event_staranis1_05_s_78:
    speaker: mustang_past
    en: Hearing you say that just makes me want to do it even more.
    ko: 이렇게까지 말하는 걸 보니 더 그러기 싫어졌는데.
    ja: |-
      そこまで言われて、
      ますますその気が失せたぞ。
  event_staranis1_05_s_79:
    speaker: mustang_past
    en: Now then... if I break you completely, will you finally behave?
    ko: |-
      어디 보자.
      완전히 망가뜨리면 좀 고분고분해질 건가?
    ja: |-
      見せてもらおうじゃないか。
      跡形もなく潰せば
      少しは物が分かるようになるか？
  event_staranis1_05_s_80:
    speaker: mustang_past
    en: You of all people know how good I am at breaking things.
    ko: 너도 알겠지만, 내가 뭐 하나 망가뜨리는 건 정말 잘하거든.
    ja: |-
      お前は分かってるだろうが、
      俺は壊すことが大の得意だからな。
  event_staranis1_05_s_81:
    speaker: mustang_past
    en: So tell me, where should I start? Your body, or your mind?
    ko: |-
      어떻게 부숴줄까?
      몸? 마음? 뭐부터?
    ja: |-
      どこから壊されたい？
      身体か？心か？選んでいいぞ？
  event_staranis1_05_s_82:
    speaker: hanson
    en: Don't you dare lay a hand on my girls!
    ko: |-
      내 아이돌한테!
      손대지 마!
    ja: |-
      私のアイドルだ！
      指一本触るな！
  event_staranis1_05_s_83:
    speaker: mustang_past
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis1_05_s_84:
    speaker: hanson
    en: You destroy everything in your path,
    ko: 너는 모든 걸 다 부숴!
    ja: お前は何もかもぶち壊した！
  event_staranis1_05_s_85:
    speaker: hanson
    en: just for your sick amusement.
    ko: 네 즐거움 때문에, 뭐든 다 부순다고!
    ja: 己の快楽のためだけに、全部！
  event_staranis1_05_s_86:
    speaker: mustang_past
    en: You little shit...!
    ko: 이 새X…!
    ja: 貴様ッ…！
  event_staranis1_05_s_87:
    speaker: hanson
    en: Don't you dare lay a hand on my girls, you vile creature!
    ko: 내 아이돌한테 손대지 마라 역병 같은 놈…!
    ja: 私のアイドルに手を出すな。疫病神…！
  event_staranis1_05_s_88:
    speaker: hanson
    en: I won't stand by and let you get away with it!
    ko: 나도 가만히 있지만은 않을 테니까…!
    ja: これ以上は黙っちゃいない…！
  event_staranis1_05_s_89:
    speaker: mustang_past
    en: "... Heh."
    ko: "…흐."
    ja: "…フッ…"
  event_staranis1_05_s_90:
    speaker: mustang_past
    en: Hah, hahahaha!
    ko: 하하. 하하하하!
    ja: ハハハ…ハハハハッ！
  event_staranis1_05_s_91:
    speaker: mustang_past
    en: Oh, this is good. This is really good! I can't remember the last time someone
      came at me like this!
    ko: 재밌다! 재밌어! 이렇게 나한테 달려드는 놈을 보는 게 얼마 만인지 모르겠어!
    ja: |-
      いいぞ！いい！
      俺にそんなタンカを切った奴は久しぶりだ！
  event_staranis1_05_s_92:
    speaker: mustang_past
    en: And it's my own son? Heh, I can't hold back anymore!
    ko: |-
      그런데 그게 내 아들이다?
      못 참겠군…!
    ja: |-
      しかもそれが俺の息子だと？
      気が狂いそうだ…！
  event_staranis1_05_s_93:
    speaker: mustang_past
    en: Go on! Don't just stand there! I'm dying to see how this plays out!
    ko: 그래! 가만히 있지 마라! 어떻게 되는지 보고 싶어 미치겠으니까!
    ja: |-
      ああ！黙ったりしなくていい！
      先が見たくてたまらん！
  event_staranis1_05_s_94:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_95:
    speaker: hanson
    en: You've been warned.
    ko: 저는 경고했습니다.
    ja: 警告はしました。
  event_staranis1_05_s_96:
    speaker: hanson
    en: Do not touch them.
    ko: 건들지 마십시오.
    ja: どうか、手を出さないでください。
  event_staranis1_05_s_97:
    speaker: "<Narration>"
    en: Hanson turns and walks away.
    ko: 한슨이 뒤돌아 걸어간다.
    ja: ハンソンは背中を向け、歩き去ろうとした
  event_staranis1_05_s_98:
    speaker: "<Narration>"
    en: Mustang catches his ragged breathing.
    ko: 머스탱은 헐떡이는 숨을 가다듬었다.
    ja: マスタングが荒ぶる呼吸を押さえ、声をかけた
  event_staranis1_05_s_99:
    speaker: mustang_past
    en: Did you sleep with them?
    ko: 걔들이랑 잤냐?
    ja: あいつらと寝たのか？
  event_staranis1_05_s_100:
    speaker: hanson
    en: I won't dignify that with a response.
    ko: 대답할 가치도 없는 쓰레기 같은 질문입니다.
    ja: 答える価値もない、ゴミ以下の質問です。
  event_staranis1_05_s_101:
    speaker: mustang_past
    en: I got curious what you could possibly see in those dime-a-dozen heaps of scrap
      you keep dragging around, so I looked into them.
    ko: 네가 도대체 뭘 보고 그런 발에 챌 정도로 흔한 고철들을 데리고 다니는지 궁금해서 좀 찾아봤다.
    ja: |-
      お前がなんであんな鉄くずどもを
      必死に世話してるのか、
      気になって調べたんだ。
  event_staranis1_05_s_102:
    speaker: mustang_past
    en: Turns out there's nothing there.
    ko: 진짜 뭐 없더라고.
    ja: サッパリ、何もなかった。
  event_staranis1_05_s_103:
    speaker: mustang_past
    en: No pedigree. No talent. Nothing unique. Just painfully average.
    ko: |-
      출신도, 재능도, 유니크함도 없어.
      말 그대로 평범해.
    ja: |-
      生まれも、才能も、これといった個性もない。
      平凡としか言いようのない奴らだ。
  event_staranis1_05_s_104:
    speaker: mustang_past
    en: So what exactly are you counting on, keeping them around?
    ko: 도대체 뭘 믿고 그것들을 데리고 다니는 거지?
    ja: |-
      何を信じて、あんな奴らを
      連れ歩いている？
  event_staranis1_05_s_105:
    speaker: hanson
    en: You wouldn't understand even if I told you.
    ko: 말해봤자, 당신은 이해하지 못하겠죠.
    ja: |-
      答えたところで、あなたには
      理解できないと思います。
  event_staranis1_05_s_106:
    speaker: "<Narration>"
    en: Hanson steps out of the room
    ko: 한슨이 방을 나간다.
    ja: ハンソンの足が出口に向いた
  event_staranis1_05_s_107:
    speaker: "<Narration>"
    en: and runs straight into Yoyo waiting outside the door.
    ko: 문 앞에 서 있던 요요와 마주친다.
    ja: ドアの前に立っていたヨヨと鉢合わせした
  event_staranis1_05_s_108:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_109:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_110:
    speaker: hanson
    en: You must be pleased with yourself, taking an ad that someone else worked so
      hard to secure.
    ko: 아득바득 따낸 광고를 아무렇지도 않게 채가서 기분 좋으시겠습니다.
    ja: |-
      私たちが必死の思いでつかんだ案件を、
      たやすく手に入れて気分がよかったでしょう。
  event_staranis1_05_s_111:
    speaker: hanson
    en: I suppose big companies really do play by different rules.
    ko: 대기업은 뭐가 달라도 다르군요.
    ja: さすがは大企業、私たちとは違う。
  event_staranis1_05_s_112:
    speaker: yoyo
    en: "... I'm sorry about the ad deal. I didn't know either."
    ko: |-
      …광고 건은 죄송해요.
      저도 몰랐어요.
    ja: |-
      …CMの件はごめんなさい。
      私も知らなかったんです。
  event_staranis1_05_s_113:
    speaker: yoyo
    en: I never meant to take anything from T.T. STAR. I truly didn't.
    ko: |-
      T.T. STAR의 것을 빼앗을 생각은 없었어요.
      진심이에요.
    ja: |-
      T.T. STARの仕事を横取りする気なんて
      ありませんでした。本当です。
  event_staranis1_05_s_114:
    speaker: hanson
    en: Of course you didn't.
    ko: 그렇겠죠.
    ja: でしょうね。
  event_staranis1_05_s_115:
    speaker: "<Narration>"
    en: Hanson strides past Yoyo and continues down the corridor.
    ko: 한슨이 요요를 지나쳐 걸어간다.
    ja: ハンソンはヨヨの脇を通り抜けて去った
  event_staranis1_05_s_116:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_117:
    speaker: anis_human
    en: "*Sigh*"
    ko: 후우~
    ja: ふう…
  event_staranis1_05_s_118:
    speaker: "<Narration>"
    en: Anis is practically sprawled in her chair, staring up at the ceiling.
    ko: 아니스가 의자에 거의 눕듯이 앉아 천장을 바라보고 있다.
    ja: |-
      アニスは椅子にほとんど横たわった姿勢で、
      天井を見上げていた
  event_staranis1_05_s_119:
    speaker: "<Narration>"
    en: Riss walks over and hands her some soda.
    ko: 리스가 다가와 아니스에게 탄산수를 건넨다.
    ja: 近づいてきたリスが、炭酸水を渡した
  event_staranis1_05_s_120:
    speaker: riss
    en: G-good job, Anis.
    ko: 수, 수고했어, 아니스.
    ja: えと、お疲れ様、アニス。
  event_staranis1_05_s_121:
    speaker: anis_human
    en: "... Oh, thanks."
    ko: "…어, 고마워."
    ja: "…うん、ありがと。"
  event_staranis1_05_s_122:
    speaker: riss
    en: Mint's resting, and Prika went to take a shower.
    ko: 민트는 쉬러 갔고, 프리카는 샤워하러 갔어.
    ja: |-
      ミントは休憩で、
      プリカはシャワーに行ったよ。
  event_staranis1_05_s_123:
    speaker: riss
    en: Boss... hasn't come back yet either.
    ko: 사장… 님은 아직 안 왔고.
    ja: 社長は…まだ戻ってきてない。
  event_staranis1_05_s_124:
    speaker: riss
    en: So it's just you and me here for now.
    ko: 지금 여기에 나랑 아니스밖에 없어.
    ja: ここに今いるのは私とアニスだけ。
  event_staranis1_05_s_125:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_126:
    speaker: anis_human
    en: Ah, um... I've got something to take care of, so I'll head out first.
    ko: 아, 그. 나 잠깐 볼일이 있어서 먼저 일어날게.
    ja: |-
      あー、その…
      私、ちょっと用事を思い出したから…
  event_staranis1_05_s_127:
    speaker: riss
    en: Anis.
    ko: 아니스.
    ja: アニス。
  event_staranis1_05_s_128:
    speaker: anis_human
    en: Wh-what?
    ko: 왜, 왜?
    ja: な、何？
  event_staranis1_05_s_129:
    speaker: riss
    en: Why didn't you come find me?
    ko: 왜 나 안 찾아왔어?
    ja: なんで言ってくれなかったの？
  event_staranis1_05_s_130:
    speaker: riss
    en: We promised that if you became a pop star, I'd be your manager.
    ko: 약속했잖아. 아니스가 아이돌 하면 내가 매니저 한다고.
    ja: |-
      約束したのに。
      アニスがアイドルになったら、
      私がマネージャーになるって。
  event_staranis1_05_s_131:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_132:
    speaker: anis_human
    en: I forgot.
    ko: 잊어버렸어.
    ja: 忘れてたの。
  event_staranis1_05_s_133:
    speaker: riss
    en: Liar.
    ko: 거짓말.
    ja: ウソつき。
  event_staranis1_05_s_134:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_135:
    speaker: riss
    en: Why didn't you come find me?
    ko: 왜 안 찾아왔어?
    ja: どうして？
  event_staranis1_05_s_136:
    speaker: anis_human
    en: How could I...?
    ko: 어떻게… 찾아가.
    ja: 言えるわけ…ないじゃない。
  event_staranis1_05_s_137:
    speaker: riss
    en: What do you mean?
    ko: 왜?
    ja: 何を？
  event_staranis1_05_s_138:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_139:
    speaker: anis_human
    en: I didn't want you to find out I'm nothing special.
    ko: 내가 대단한 사람이 아니라는 걸 너한테는 들키기 싫었어.
    ja: |-
      アイドルだからって
      別にすごくも有名でもないって
      知ってほしくなかったから。
  event_staranis1_05_s_140:
    speaker: riss
    en: You really thought that? I didn't expect it.
    ko: 그렇게 생각했어? 의외네.
    ja: そんなふうに思ってたの？意外。
  event_staranis1_05_s_141:
    speaker: anis_human
    en: Yeah...
    ko: 맞잖아.
    ja: だってそうでしょ。
  event_staranis1_05_s_142:
    speaker: anis_human
    en: Honestly, I'm not even sure I'm cut out for being a pop star.
    ko: |-
      솔직히 나 아이돌로 잘하고 있는지도 잘 모르겠고,
      재능이 있는지도 잘 모르겠거든.
    ja: |-
      うまくアイドルやれてるかも分からないし、
      そもそも才能があるかどうかだって…
  event_staranis1_05_s_143:
    speaker: anis_human
    en: The more I do this, the more it hits me.
    ko: 하면 할수록 느껴.
    ja: やればやるほど思い知らされるの。
  event_staranis1_05_s_144:
    speaker: anis_human
    en: I'm not special.
    ko: 아, 나는 특별하지 않구나.
    ja: 私、特別でも何でもない。
  event_staranis1_05_s_145:
    speaker: anis_human
    en: I'm painfully ordinary.
    ko: 그냥 평범하기 짝이 없구나.
    ja: フツーの人なんだって。
  event_staranis1_05_s_146:
    speaker: riss
    en: For that kind of person, you sure work hard.
    ko: 그런 것 치곤 엄청 열심히 하던데.
    ja: その割には一生懸命に見えたけど。
  event_staranis1_05_s_147:
    speaker: anis_human
    en: Because that's all I've got.
    ko: 그것밖에 없으니까.
    ja: それしかないから。
  event_staranis1_05_s_148:
    speaker: anis_human
    en: Someone like me can only get anywhere by working my ass off. I don't know
      any other way.
    ko: 특별할 것 없는 내가 뭔가를 이루기 위해서는 열심히 하는 것 말고는 없으니까. 다른 방법도 모르겠고.
    ja: |-
      フツーの私が何かで成功したいと思ったら、
      一生懸命やるぐらいしかなかったの。
      他の方法も分からないし。
  event_staranis1_05_s_149:
    speaker: anis_human
    en: At first, I was going to just come straight to you,
    ko: 처음엔, 바로 찾아가려고 했어.
    ja: 本当はね、真っ先に会いに行くつもりだった。
  event_staranis1_05_s_150:
    speaker: anis_human
    en: all confident, like, "Hey, you should be our manager."
    ko: 야. 이제 너 우리 매니저 하자. 라고 당당하게 얘기하고 싶었어.
    ja: |-
      私のマネージャーになって、って
      ずうずうしく言いたかった。
  event_staranis1_05_s_151:
    speaker: anis_human
    en: But then... I don't know...
    ko: 그런데… 음….
    ja: でも…考えたら…
  event_staranis1_05_s_152:
    speaker: anis_human
    en: I was terrified you'd just say,
    ko: "[내가 왜? 너 잘 못 하던데?]"
    ja: |-
      「歌もダンスもできないくせに、
      　巻き込まないでよ」
  event_staranis1_05_s_153:
    speaker: anis_human
    en: '"Why would I? You''re not even that good."'
    ko: 이 말을 들을까 봐 너무 무서웠어.
    ja: |-
      とか、言われるかもって、
      怖くなったの。
  event_staranis1_05_s_154:
    speaker: riss
    en: Anis...
    ko: 아니스.
    ja: アニス…
  event_staranis1_05_s_155:
    speaker: anis_human
    en: That's why I couldn't come.
    ko: 그래서 못 찾아간 거야.
    ja: だから、行けなかった。
  event_staranis1_05_s_156:
    speaker: anis_human
    en: The way you looked at me, the things you said...
    ko: 네가 나를 보던 눈빛, 나한테 하던 말.
    ja: |-
      すごい人を見るみたいな目で見てくれて、
      いつも励ましてくれてたことも…
  event_staranis1_05_s_157:
    speaker: anis_human
    en: I knew you liked me, and I was so grateful...
    ko: 나를 좋아해 준다는 걸 잘 알았는데. 너무 고마웠는데.
    ja: |-
      私を好きでいてくれることは分かってたし、
      本当に感謝してるけど…
  event_staranis1_05_s_158:
    speaker: anis_human
    en: But I didn't want you to see what I really am. Just someone ordinary. Nothing
      special.
    ko: 내가 별거 아닌, 그저 그런 사람이라는 걸 보여주고 싶지 않았어.
    ja: |-
      だから私が何でもない、
      凡人だってことを見せたくなかったの。
  event_staranis1_05_s_159:
    speaker: anis_human
    en: The star you thought you were looking at... wasn't a star at all. Just a cheap
      plastic toy pretending to be one.
    ko: 네가 보던 별은, 별이 아니라 그냥 별을 흉내 낸 플라스틱 장난감일 뿐이라는 걸 들키기 싫었어.
    ja: |-
      あなたが見てたのは、星じゃなくて
      星の形になってるつもりの
      プラスチックのおもちゃだから。
  event_staranis1_05_s_160:
    speaker: anis_human
    en: I was afraid you'd be disappointed.
    ko: 나한테 실망할까 봐.
    ja: がっかりさせたくなくて。
  event_staranis1_05_s_161:
    speaker: riss
    en: It wasn't because you were special that I liked you.
    ko: |-
      내가 아니스를 좋아했던 이유가,
      아니스가 특별해서 좋아했던 게 아니야.
    ja: |-
      私がアニスを好きでいる理由は、
      アニスが特別だからじゃないよ。
  event_staranis1_05_s_162:
    speaker: anis_human
    en: See? What'd I tell you?
    ko: 거 봐. 그렇다니까.
    ja: ほら、やっぱりそうでしょ？
  event_staranis1_05_s_163:
    speaker: riss
    en: Don't take this the wrong way.
    ko: 삐딱하게 듣지 말고.
    ja: すねないで。
  event_staranis1_05_s_164:
    speaker: riss
    en: When I first saw you... um...
    ko: 처음 봤을 땐, 음….
    ja: 初めて会った時は、そう…
  event_staranis1_05_s_165:
    speaker: riss
    en: Honestly, I remember thinking, "She's not even that good, so why is she always
      the one stepping up?"
    ko: 솔직히 말하면 [쟤는 잘하지도 못하는데 왜 저렇게 나서지?]라는 생각이었다?
    ja: |-
      正直言って、「上手くもないのに
      なんで前に出たがるんだろ？」
      ぐらいに思ってたかな。
  event_staranis1_05_s_166:
    speaker: riss
    en: I felt the same way when you were the cheer captain. It never really seemed
      like you were that amazing.
    ko: |-
      응원단장 할 때도 그랬어.
      솔직히 막 엄청 잘한다는 느낌은 안 들었거든.
    ja: |-
      応援のリーダーになった時もそう。
      上手なんて思ってなかった。
  event_staranis1_05_s_167:
    speaker: anis_human
    en: Wow... that's harsh.
    ko: 추, 충격적이야.
    ja: それはそれで…ショックなんだけど。
  event_staranis1_05_s_168:
    speaker: riss
    en: But you just kept working hard.
    ko: 그런데 아니스는 계속 열심히 했어.
    ja: でも、ずっと一生懸命だった。
  event_staranis1_05_s_169:
    speaker: riss
    en: There wasn't anything particularly special about you, but you never stopped
      trying.
    ko: |-
      뭐 하나 특별할 것도 없었는데,
      계속 열심히 하더라.
    ja: |-
      特別なことなんて何もないのに、
      ずっと頑張ってたの。
  event_staranis1_05_s_170:
    speaker: riss
    en: And then one day, you suddenly pulled it off. It actually looked pretty convincing.
    ko: 그러다가 갑자기 쨘~ 하고 되게 그럴듯하게 해냈어.
    ja: |-
      それが…いつぐらいだったかな？
      急にかっこよくできるようになって。
  event_staranis1_05_s_171:
    speaker: riss
    en: Seeing that... meant a lot to me.
    ko: 그게 나한테 엄청 위로가 됐어.
    ja: それを見て、私、すごく救われたの。
  event_staranis1_05_s_172:
    speaker: riss
    en: Um... please don't take this the wrong way.
    ko: 어… 이상하게 듣지 마.
    ja: |-
      ええと…変なふうに
      受け取らないで欲しいんだけど。
  event_staranis1_05_s_173:
    speaker: riss
    en: I just thought if someone that ordinary can make it by not giving up, then
      maybe I could too.
    ko: 저렇게 평범한 아이도 포기하지 않고 열심히 하니까 해내는구나.
    ja: |-
      あんな普通の子でも、
      諦めずに頑張れば何かできるんだ。
  event_staranis1_05_s_174:
    speaker: riss
    en: I'm ordinary too. No... actually, I'm probably worse than ordinary.
    ko: 나도 이렇게 평범한데, 아니 남들보다 좀 못한데.
    ja: |-
      私もこんな凡人だけど…
      いや、普通以下だけど…
  event_staranis1_05_s_175:
    speaker: riss
    en: So maybe if I worked hard, I could do something worthwhile.
    ko: 그럼 나도 노력하면 그럴듯한 뭔가를 할 수 있지 않을까?
    ja: 努力すれば、何かを成し遂げられるのかな？
  event_staranis1_05_s_176:
    speaker: riss
    en: And maybe someday, I could become special.
    ko: |-
      그리고 언젠가,
      특별해질 수 있지 않을까?
    ja: いつか、特別になれるかな？
  event_staranis1_05_s_177:
    speaker: riss
    en: I think that's what I was thinking back then.
    ko: 이런 생각이었던 것 같아.
    ja: って、そういうふうに思ったの。
  event_staranis1_05_s_178:
    speaker: riss
    en: After that, I kept watching you. I tried to be more like you.
    ko: |-
      그때부터 아니스를 계속 봤고,
      닮으려고 노력했어.
    ja: |-
      その時からアニスを見て、
      少しでも近づくために努力を続けてる。
  event_staranis1_05_s_179:
    speaker: riss
    en: That's how I became your fan.
    ko: 팬이 됐어.
    ja: ファンになったって、そういうこと。
  event_staranis1_05_s_180:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_181:
    speaker: riss
    en: That's why I wanted to do this with you.
    ko: 그래서 같이하고 싶었던 거야.
    ja: だから、一緒にやりたかったの。
  event_staranis1_05_s_182:
    speaker: riss
    en: I thought if you ever came looking for me, I should be ready. So I became
      a manager and worked hard to learn the job.
    ko: |-
      아니스가 날 찾아올 때를 대비해서,
      매니저로 취직해서 일도 열심히 배웠어.
    ja: |-
      その日に備えて、
      マネージャーとして就職して、
      一生懸命、経験を積んできたんだ。
  event_staranis1_05_s_183:
    speaker: riss
    en: Because someday, I wanted us to become something special together.
    ko: 언젠가, 같이 특별해지고 싶어서.
    ja: いつか、一緒に特別な存在になるために。
  event_staranis1_05_s_184:
    speaker: anis_human
    en: You seriously...
    ko: 너 진짜….
    ja: あなたって…
  event_staranis1_05_s_185:
    speaker: riss
    en: Hehe, bet you're really grateful now.
    ko: 헤헤. 고마워 죽겠어?
    ja: えへへ。嬉しくて死にそう？
  event_staranis1_05_s_186:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_s_187:
    speaker: anis_human
    en: Wow, I seriously can't thank you enough.
    ko: 어. 진짜 고마워 죽겠다.
    ja: うん、そうね。嬉しくて死にそう。
  event_staranis1_05_s_188:
    speaker: riss
    en: No, Anis, I should be the one thanking you.
    ko: |-
      아니야 아니스.
      내가 더 고마워.
    ja: |-
      でもね、アニス。
      私の方が嬉しいから。ありがとう。
event_staranis1_05_e:
  event_staranis1_05_e_1:
    speaker: riss
    en: Boss... you didn't go out there and stir up trouble, did you?
    ko: "…사장님. 혹시 밖에 나가서 사고 치신 건 아니… 죠?"
    ja: |-
      …社長。外で何か騒ぎでも
      起こしてきたわけじゃ…ないですよね？
  event_staranis1_05_e_2:
    speaker: hanson
    en: No... I mean...
    ko: 아닌… 데….
    ja: そんなことは…ないと思うが…
  event_staranis1_05_e_3:
    speaker: riss
    en: Uh... that sounds like something happened...
    ko: 어… 뭔가 있는 것 같은데….
    ja: でも…何もないなんてことは…
  event_staranis1_05_e_4:
    speaker: riss
    en: W-we're getting almost three times as many performance requests.
    ko: 고, 공연 요청이 3배 가까이 많아졌어요.
    ja: |-
      だって、パフォーマンスの依頼が
      3倍ほどに増えてるんですよ。
  event_staranis1_05_e_5:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_6:
    speaker: riss
    en: T-to be honest, it's not impossible.
    ko: 소, 솔직히 불가능하진 않아요.
    ja: い、いちおう、受けきれなくはないです。
  event_staranis1_05_e_7:
    speaker: riss
    en: But even finding time to eat will be tight...
    ko: 그런데 밥 먹는 시간도… 빠듯해요.
    ja: |-
      でもそうすると…
      食事の時間もギリギリになります。
  event_staranis1_05_e_8:
    speaker: riss
    en: A-and we'd only get around four hours of sleep a night.
    ko: 잠은… 하루에 4시간 자면 많이 자게 될 테고요.
    ja: |-
      睡眠時間は…1日に4時間とれれば
      多いほうになります。
  event_staranis1_05_e_9:
    speaker: "<Narration>"
    en: Hanson clenches his fist where no one can see.
    ko: 한슨이 아무도 모르게 주먹을 꽉 쥔다.
    ja: ハンソンは他人に見えないように拳を握った
  event_staranis1_05_e_10:
    speaker: hanson
    en: This won't do. It's great that there's so much demand, but this isn't realistic.
    ko: 안 되겠네. 많이 찾아주는 건 좋지만, 너무 비현실적이야.
    ja: |-
      しかし、難しいな。
      仕事が増えたのはいいことだが、
      全部は現実的じゃない。
  event_staranis1_05_e_11:
    speaker: hanson
    en: We'll have to turn some of them down.
    ko: 적당히 거절하자.
    ja: 適度に断ろう。
  event_staranis1_05_e_12:
    speaker: riss
    en: All right...
    ko: "…예."
    ja: "…はい。"
  event_staranis1_05_e_13:
    speaker: anis_human
    en: Nah, let's do them all.
    ko: 해요.
    ja: やります。
  event_staranis1_05_e_14:
    speaker: hanson
    en: No, that would be pushing it.
    ko: 안돼. 큰일 나.
    ja: ダメだ。大変なことになるぞ。
  event_staranis1_05_e_15:
    speaker: anis_human
    en: The ad deal's already gone anyway. Might as well get our faces out there as
      much as possible.
    ko: |-
      광고도 물 건너간 판에,
      조금이라도 얼굴 더 비추는 게 맞을 거 같은데요.
    ja: |-
      CMだって横取りされたばっかりなんだから、
      少しでも顔を売らないと。
  event_staranis1_05_e_16:
    speaker: anis_human
    en: Who knows? Another opportunity might come along.
    ko: 그럼 또다시 기회가 올지도 모르고.
    ja: |-
      そうすれば、次のチャンスが
      早く来るかもしれないし。
  event_staranis1_05_e_17:
    speaker: hanson
    en: This isn't something we can force. I'm sorry, but any new requests going forward—
    ko: |-
      무리해서 될 일이 아니야.
      아쉽지만 이제 새로 들어오는 요청은….
    ja: |-
      無理をすればいいという問題じゃない。
      惜しいのは分かるが、新規の依頼は…
  event_staranis1_05_e_18:
    speaker: anis_human
    en: I gave it some serious thought.
    ko: 제가 곰곰히 생각해 봤는데.
    ja: よく考えてみたんですけど…
  event_staranis1_05_e_19:
    speaker: anis_human
    en: And then it hit me! We're Nikkes!
    ko: 이럴 수가! 우린 니케였던 거예요!
    ja: 私たちって、ニケじゃないですか！
  event_staranis1_05_e_20:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_21:
    speaker: anis_human
    en: In theory, we don't even have to sleep or eat.
    ko: 이론상 잠을 안 자도 되고, 먹지 않아도 돼요.
    ja: 食事も睡眠も、とらなくて平気なんでしょ。
  event_staranis1_05_e_22:
    speaker: anis_human
    en: Isn't that exactly what we're built for?
    ko: 이런 일에 최적인 거 아닌가요?
    ja: 活かせばいいじゃないですか。
  event_staranis1_05_e_23:
    speaker: hanson
    en: Anis, that's—
    ko: 아니스, 그건.
    ja: アニス、それは…
  event_staranis1_05_e_24:
    speaker: anis_human
    en: We know you look out for us
    ko: 사장님이 얼마나 우리 신경 써주는지 잘 알아요.
    ja: |-
      社長が私たちを気遣ってくれてることは、
      よく分かってます。
  event_staranis1_05_e_25:
    speaker: anis_human
    en: and you've always tried to treat us like humans.
    ko: 사람답게 대해주려고 노력한 것도 잘 알아요.
    ja: |-
      人として扱ってくれて、
      いろいろ頑張ってくれてることも。
  event_staranis1_05_e_26:
    speaker: anis_human
    en: But we can't let an opportunity like this slip by.
    ko: 그런데 이런 기회를 놓칠 수 없잖아요.
    ja: |-
      でも、チャンスを逃すわけには
      いかないじゃないですか。
  event_staranis1_05_e_27:
    speaker: anis_human
    en: Even if it means working ourselves to the bone, we should take it.
    ko: 몸을 진짜 막 굴리더라도, 이 기회는 잡는 게 맞는 것 같아요.
    ja: |-
      今は多少無理してでも、
      チャンスをつかみに行くべきだと思うんです。
  event_staranis1_05_e_28:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_29:
    speaker: anis_human
    en: Mint, Prika, what do you think?
    ko: 민트랑 프리카는 어때?
    ja: ミントとプリカはどう？
  event_staranis1_05_e_30:
    speaker: mint
    en: I think it's better to take things slowly. If we push too hard, something
      could go wrong.
    ko: |-
      천천히 가는 게 좋아.
      무리하면 뭐가 탈이 나도 탈이 나니까.
    ja: |-
      ゆっくりやった方がいいと思うわ。
      無理すると、あとで問題になるから。
  event_staranis1_05_e_31:
    speaker: prika
    en: I'm with Mint. We're doing just fine as we are. No need to push it.
    ko: |-
      나도 민트 의견에 동의해.
      우리 나름 잘해 나가고 있는데, 무리할 필요는 없다고 봐.
    ja: |-
      私もミントと同じ意見だ。
      いい風が吹き始めてるし、
      無理する必要はないと思う。
  event_staranis1_05_e_32:
    speaker: anis_human
    en: Oh... o-okay... I get it.
    ko: |-
      …아… 그, 그래.
      그렇… 구나.
    ja: "…え…そ、そう。そっか。"
  event_staranis1_05_e_33:
    speaker: anis_human
    en: Sorry for pushing it.
    ko: 미안. 떼써서.
    ja: ごめんね。無理言って。
  event_staranis1_05_e_34:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_35:
    speaker: prika
    en: That said, if someone here wants to crush her sooner rather than later, that's
      a different story.
    ko: 그런데, 멤버 중 누가 꼴 보기 싫은 녀석을 하루라도 빨리 밟고 싶다고 한다면 또 모르지.
    ja: |-
      ま、仲間が1日も早く因縁のライバルを
      蹴落としてやりたいって思ってるなら
      話は変わって来るけどな。
  event_staranis1_05_e_36:
    speaker: mint
    en: If that's the situation, we'll make it work. Winning matters, after all.
    ko: |-
      응. 그렇다고 한다면 못 할 것도 없지.
      이기는 건 중요하니까.
    ja: |-
      そうね。そういうことなら、
      やらないこともないわ。
      勝つって大事だから。
  event_staranis1_05_e_37:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_38:
    speaker: anis_human
    en: I...
    ko: 그….
    ja: あの…
  event_staranis1_05_e_39:
    speaker: anis_human
    en: I'm really... sorry.
    ko: 정말… 미안한데.
    ja: 本当に…悪いんだけどさ…
  event_staranis1_05_e_40:
    speaker: anis_human
    en: But I want to win.
    ko: 나 정말 이기고 싶어.
    ja: 私、絶対に勝ちたい。
  event_staranis1_05_e_41:
    speaker: anis_human
    en: I've spent my whole life just getting pushed around...
    ko: 계속… 당하고만 살아서….
    ja: ずっと…やられっぱなしだったから…
  event_staranis1_05_e_42:
    speaker: mint
    en: Did you hear that, Boss?
    ko: 그렇다는데요? 사장님?
    ja: だそうですよ？社長？
  event_staranis1_05_e_43:
    speaker: prika
    en: One of your pop stars is getting pushed around, and you're just going to sit
      there and watch?
    ko: 소속 아이돌 기가 죽는다는데, 지켜만 볼 거예요?
    ja: |-
      所属アイドルが落ち込んでるのに、
      ただ見てるだけか？
  event_staranis1_05_e_44:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_45:
    speaker: riss
    en: I-I'll work out the schedule then.
    ko: 그, 그럼 일정 짜볼게요.
    ja: と、とりあえず、スケジュール組んでみますね。
  event_staranis1_05_e_46:
    speaker: riss
    en: That's... okay, right, Boss?
    ko: 사장님. 괜찮… 죠?
    ja: 社長。それで…よろしいですか？
  event_staranis1_05_e_47:
    speaker: hanson
    en: "... All right, let's try."
    ko: "…그래. 해보자."
    ja: "…分かった、頼む。"
  event_staranis1_05_e_48:
    speaker: hanson
    en: But the moment it becomes too much, we stop. Understood?
    ko: 대신, 무리다 싶으면 바로 그만두는 거야. 알겠지?
    ja: |-
      その代わり、これ以上出来ないと感じたら
      すぐに言うんだ。いいな？
  event_staranis1_05_e_49:
    speaker: anis_human
    en: C'mon, we've got three Nikkes and the god of scheduling on our side. What
      could possibly go wrong?
    ko: 에이, 니케가 셋에. 일정 관리의 신이 있는데 그럴 일이야 있겠어요?
    ja: |-
      心配性ねえ、3人ともニケだし、
      スケジュール管理のプロもいますから
      大丈夫ですって！
  event_staranis1_05_e_50:
    speaker: "<Narration>"
    en: 'Title: Wow, How Many Bodies Does T.T. STAR Have?'
    ko: '제목 : 와 티티스타 진짜 몸이 몇 개임?'
    ja: |-
      タイトル：T.T. STARって
      体いくつあるんだ？
  event_staranis1_05_e_51:
    speaker: "<Narration>"
    en: Feels like I see them all day long, lol.
    ko: 거의 하루 종일 보이는 것 같은데ㅋㅋㅋㅋ
    ja: 1日中活動してる気がするけど
  event_staranis1_05_e_52:
    speaker: "<Narration>"
    en: They're not just striking while the iron's hot, but it's like they've strapped
      a motor on.
    ko: 물 들어올 때 노 젓는 게 아니라 거의 모터를 단 수준.
    ja: |-
      チャンスの波に乗って船を漕ぎだすどころか
      ジェットエンジン積んだレベル
  event_staranis1_05_e_53:
    speaker: "<Narration>"
    en: These girls work insanely hard.
    ko: 진짜 열심히 한다 얘들.
    ja: ずいぶん頑張ってるな
  event_staranis1_05_e_54:
    speaker: "<Narration>"
    en: "- True, but I'm kinda getting sick of them, lol."
    ko: ㄴ 인정. 근데 좀 질림ㅋㅋㅋㅋ
    ja: ㄴ同感。でもちょっと飽きたwww
  event_staranis1_05_e_55:
    speaker: "<Narration>"
    en: "- Man, if they could just land one ad deal, that'd be perfect."
    ko: ㄴ 하 광고 하나 잡으면 진짜 딱인데
    ja: ㄴCM案件の一つでも早く決まってくれ
  event_staranis1_05_e_56:
    speaker: "<Narration>"
    en: "- I think it's Anis? She's the one grinding the hardest."
    ko: ㄴ 아니스던가 걔가 진짜 열심히 함
    ja: ㄴアニスとかいう子、一生懸命すぎる
  event_staranis1_05_e_57:
    speaker: "<Narration>"
    en: "- Yeah, you can tell the others are late, and she goes up alone to stall
      with banter, lol."
    ko: ㄴ ㅇㅇ딱 봐도 멤버들 늦었는데 혼자 올라가서 만담함ㅋㅋㅋ
    ja: |-
      ㄴメンバーが遅れるからって
      　一人でステージ上がって
      　トーク始めて笑ったwww
  event_staranis1_05_e_58:
    speaker: "<Narration>"
    en: "- She's good with words, though. Good at talking and super likable."
    ko: ㄴ 말 잘하더라. 서글서글하니 넉살도 좋고
    ja: ㄴトークも悪くないよな、愛想がいいし楽しい
  event_staranis1_05_e_59:
    speaker: anis_idol
    en: Ugh...
    ko: 으어….
    ja: うう…
  event_staranis1_05_e_60:
    speaker: riss
    en: Here, have some soda.
    ko: 여기, 탄산수.
    ja: はい、炭酸水。
  event_staranis1_05_e_61:
    speaker: anis_idol
    en: Nah, I'm good. These things make me burp.
    ko: 괜찮아 괜찮아. 트림만 나올걸.
    ja: いい。ゲップ出ちゃったら困るし。
  event_staranis1_05_e_62:
    speaker: mint_o
    en: Do we have any rice balls left?
    ko: 주먹밥 남은 거 없어?
    ja: おにぎり、余ってない？
  event_staranis1_05_e_63:
    speaker: prika_o
    en: Here, but take it easy on the food. Your stomach was jiggling earlier.
    ko: |-
      여기. 너무 많이 먹지 말고.
      배 출렁거리더라 너.
    ja: |-
      ここだ。食べ過ぎるなよ？
      腹が揺れてたぞ。
  event_staranis1_05_e_64:
    speaker: mint_o
    en: You need to eat if you want the energy to keep going.
    ko: 사람이 움직이려면 밥심이 있어야 하는 거야.
    ja: 人は食べないと動けないでしょ？
  event_staranis1_05_e_65:
    speaker: anis_idol
    en: Nah, a Nikke can move on core power alone.
    ko: 아니. 니케는 코어 동력만 있으면 움직일 수 있어.
    ja: いや、ニケはコアさえあれば動けるでしょ。
  event_staranis1_05_e_66:
    speaker: prika_o
    en: Knock it off with the lame talk. Hey, pass me that milkshake.
    ko: |-
      멋없는 소리 좀 그만해.
      아, 거기 셰이크 좀 줘.
    ja: |-
      バカ言ってるんじゃない。
      ああ、そこのシェイク取ってくれ。
  event_staranis1_05_e_67:
    speaker: anis_idol
    en: You should be the one laying off the milkshakes. You drink those things all
      day.
    ko: |-
      너야말로 셰이크 좀 그만 먹어.
      뭔 하루 종일 셰이크만 먹냐?
    ja: |-
      そっちもちょっとは控えなさいよ。
      1日中シェイクばっかり飲んで。
  event_staranis1_05_e_68:
    speaker: anis_idol
    en: At this rate, you're gonna start crapping them out.
    ko: 똥 대신 셰이크 나오겠네.
    ja: うんちの代わりにシェイクが出たりして？
  event_staranis1_05_e_69:
    speaker: mint_o
    en: Ahaha!
    ko: 꺄하!
    ja: アハハ…！
  event_staranis1_05_e_70:
    speaker: anis_idol
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_staranis1_05_e_71:
    speaker: prika_o
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_staranis1_05_e_72:
    speaker: mint_o
    en: Oh, uh... I just suddenly remembered a funny video I saw yesterday.
    ko: 아, 음. 어제 봤던 영상 중 재밌던게 갑자기 생각나서.
    ja: |-
      あっ、ええと。昨日見た動画を
      急に思い出して笑っただけよ。
  event_staranis1_05_e_73:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_74:
    speaker: anis_idol
    en: Poop.
    ko: 똥.
    ja: うんち。
  event_staranis1_05_e_75:
    speaker: mint_o
    en: Ahaha! No, stop...!
    ko: 꺄하, 하, 하지 마….
    ja: アハハハッ、やっ、やめて…
  event_staranis1_05_e_76:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_77:
    speaker: hanson
    en: Come now, you're pop stars. You shouldn't be saying things like that.
    ko: "…너희들. 아이돌이 그런 얘기 하는 거 아니다."
    ja: |-
      …君たち、アイドルがそんな言葉を
      口にするんじゃない。
  event_staranis1_05_e_78:
    speaker: hanson
    en: Huh? What's this?
    ko: 엇. 뭐야.
    ja: ん、何だ？
  event_staranis1_05_e_79:
    speaker: riss
    en: R-road work... Looks like they're closing this road.
    ko: |-
      …도, 도로 공사 중이네요.
      여기도 이제 차도는 폐지할 모양이에요.
    ja: |-
      …ど、道路が工事中ですね。
      ここの車道も廃止されるみたいです。
  event_staranis1_05_e_80:
    speaker: riss
    en: Th-the map hasn't updated yet, so I didn't notice... I-I'm sorry.
    ko: |-
      아, 아직 지도가 갱신 안 돼서 미처 확인 못 했어요.
      죄송, 죄송해요.
    ja: |-
      まだ地図が更新されてなかったみたいで、
      見落としていました。
      も、申し訳ありません。
  event_staranis1_05_e_81:
    speaker: anis_idol
    en: How long will the detour take?
    ko: 돌아가면 얼마나 걸려?
    ja: 戻るのにどれくらいかかる？
  event_staranis1_05_e_82:
    speaker: riss
    en: I think we might be about... ten minutes late...
    ko: 10분 정도… 늦을 거 같은데….
    ja: 10分くらい…たぶん遅れるかも…
  event_staranis1_05_e_83:
    speaker: anis_idol
    en: I'll go up and buy you some time. Get here as fast as you can.
    ko: |-
      내가 먼저 갈게.
      무대에서 시간 좀 끌고 있을 테니까, 최대한 빨리들 와줘.
    ja: |-
      私、先に行ってるわ。
      ステージで時間を稼いでおくから、
      なるべく早く来て。
  event_staranis1_05_e_84:
    speaker: prika_o
    en: Then I'm coming with you.
    ko: 같이 가 그럼.
    ja: なら、私たちも行こう。
  event_staranis1_05_e_85:
    speaker: anis_idol
    en: Nah, you guys just get some rest.
    ko: 됐어. 조금이라도 쉬어.
    ja: 一人でいいから、少しでも休んでおいて。
  event_staranis1_05_e_86:
    speaker: anis_idol
    en: You two are a total vibe killer on stage, anyway.
    ko: |-
      그리고 너희들, 무대 위에서 진짜 재미없어서 안 돼.
      마이너스야 마이너스.
    ja: |-
      それに2人とも、
      MCは全然面白くできないでしょ。
      マイナスよ、マイナス。
  event_staranis1_05_e_87:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_88:
    speaker: anis_idol
    en: Pull over, Boss. I'll get off here.
    ko: 가 있을게. 사장님. 차 세워줘요.
    ja: じゃ、早く来てね。社長、車止めてください。
  event_staranis1_05_e_89:
    speaker: hanson
    en: You're stretching yourself too thin, Anis.
    ko: 아니스. 너 요즘 너무 무리해.
    ja: アニス。無理をしすぎだ。
  event_staranis1_05_e_90:
    speaker: anis_idol
    en: I'm fine! I'm a Nikke, remember?
    ko: 괜찮아요! 니케니까!
    ja: 平気です！ニケだから！
  event_staranis1_05_e_91:
    speaker: "<Narration>"
    en: Anis throws the door open and runs off.
    ko: 아니스가 차 문을 열고 뛰어간다.
    ja: アニスは車のドアを開き、飛び出していった
  event_staranis1_05_e_92:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_93:
    speaker: mint_o
    en: She's pushing herself too hard again.
    ko: 계속 무리하네.
    ja: ずっと無理してるわね。
  event_staranis1_05_e_94:
    speaker: prika_o
    en: Yeah, she probably thinks we'll get roped in too.
    ko: 우릴 끌어들였다고 생각할 테니까.
    ja: 私たちを巻き込んだって思ってるのかもな。
  event_staranis1_05_e_95:
    speaker: mint_o
    en: "... Realistically, do you think we stand a chance?"
    ko: "…이길 수 있을까? 현실적으로."
    ja: "…勝てるの？現実的に。"
  event_staranis1_05_e_96:
    speaker: prika_o
    en: Anis seems to think so.
    ko: 적어도 아니스는 그렇게 생각하고 있어.
    ja: 少なくとも、あいつはそう思ってる。
  event_staranis1_05_e_97:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_98:
    speaker: mint_o
    en: Okay, let's follow her lead.
    ko: 그럼 리더 따라 가야지. 가자.
    ja: |-
      じゃ、リーダーについていかないと。
      行きましょ。
  event_staranis1_05_e_99:
    speaker: prika_o
    en: Boss, we're gonna head out too. See you later.
    ko: 사장님. 우리도 먼저 갈게요. 이따 봬요.
    ja: |-
      社長、私たちも先に行く。
      またあとで。
  event_staranis1_05_e_100:
    speaker: hanson
    en: "... All right, see you later. I'm sorry."
    ko: |-
      …그래. 이따 보자.
      미안하다.
    ja: |-
      …ああ、すぐに追いつく。
      すまない。
  event_staranis1_05_e_101:
    speaker: prika_o
    en: There you go again.
    ko: 또또.
    ja: また「すまない」か。
  event_staranis1_05_e_102:
    speaker: mint_o
    en: Honestly, that's getting a little old.
    ko: 아휴 지겨워.
    ja: 聞き飽きちゃいますよ？
  event_staranis1_05_e_103:
    speaker: "<Narration>"
    en: Mint and Prika throw open the car door and run.
    ko: 민트와 프리카가 차 문을 열고 뛰어간다.
    ja: |-
      ミントとプリカが車のドアを開き、
      後を追った
  event_staranis1_05_e_104:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_105:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_106:
    speaker: riss
    en: Hehe, d-doesn't this feel like something out of a coming-of-age show?
    ko: 처, 청춘 드라마 같아서 되게 좋지 않나요? 헤헤.
    ja: せ…青春ドラマみたいですね？へへへ…
  event_staranis1_05_e_107:
    speaker: hanson
    en: "... My stomach's been killing me. I suppose that's what being an adult means."
    ko: "…나는 속이 쓰리다. 어른이라서."
    ja: "…私みたいな大人には、胸焼けしそうだ。"
  event_staranis1_05_e_108:
    speaker: "<Narration>"
    en: T.T. STAR pushes themselves to the limit, taking every performance they can
      get.
    ko: T.T. STAR는 자신들을 한계까지 몰아붙이며 닥치는 대로 공연을 진행했다.
    ja: T.T. STARは全力で活動を続けた
  event_staranis1_05_e_109:
    speaker: "<Narration>"
    en: Whenever something goes wrong, Anis jumps in and improvises to keep the schedule
      on track.
    ko: 돌발 상황으로 발생한 문제는 아니스가 직접 뛰어 임기응변으로 해결하는 것으로 일정을 소화했다.
    ja: |-
      突発的なトラブルは
      アニスが身体を張って解決し、
      次々にスケジュールを消化していった
  event_staranis1_05_e_110:
    speaker: anis_idol
    en: It's fine! Nikkes don't get tired! If you think you're tired, it's just in
      your head!
    ko: 괜찮아! 니케는 안 지쳐! 지쳤다고 생각하는 건 착각이야!
    ja: |-
      平気！ニケって疲れないし！
      疲れてる気がするのは錯覚だから！
  event_staranis1_05_e_111:
    speaker: anis_idol
    en: It's fine! I'm a Nikke! Nikkes don't even need to eat!
    ko: 괜찮아! 나 니케잖아! 니케는 안 먹어도 돼!
    ja: |-
      大丈夫！私はニケだから！
      食事なんて抜いても平気！
  event_staranis1_05_e_112:
    speaker: anis_idol
    en: Sleep? Nah, I'm totally fine. That's because I'm a Nikke!
    ko: 잠? 안 잤지. 그래도 괜찮은데? 니케잖아.
    ja: |-
      睡眠？寝てないけど？
      大丈夫でしょ、ニケだから。
  event_staranis1_05_e_113:
    speaker: anis_idol
    en: Turn the pain sensor or whatever off, and you can't even feel sore! I saw
      it online and tried it, and it actually works!
    ko: 통각 센서던가? 이거 끄니까 근육통이 안 느껴져! 인터넷에서 보고 따라 해봤는데 진짜 되네?
    ja: |-
      痛覚センサーっていうやつ？
      切ったら筋肉痛を感じなくなったの！
      ネットで見て試したら、本当に効果あったわ！
  event_staranis1_05_e_114:
    speaker: anis_idol
    en: This is awesome! It's like having unlimited time and stamina!
    ko: 최고다! 시간이랑 체력이 무한인 거 아냐!
    ja: |-
      最高よ！時間も体力も
      無限にあるってことでしょ！
  event_staranis1_05_e_115:
    speaker: anis_idol
    en: Ahh... I get it now. I finally figured out how to use this Nikke body.
    ko: 아아… 알아버렸어. 니케 바디의 사용법을.
    ja: |-
      私…分かっちゃった。
      ニケの身体の使い方。
  event_staranis1_05_e_116:
    speaker: anis_idol
    en: At this rate, becoming the ultimate pop star might actually happen, heh.
    ko: 이대로만 가면 최강의 아이돌이 되는 것도 꿈은 아니겠지. 후후.
    ja: |-
      このままいけば、最強アイドルも
      夢じゃないでしょ。ふふふっ…
  event_staranis1_05_e_117:
    speaker: anis_idol
    en: Just you wait, Yoyo... The ultimate pop star, Anis, is coming for you.
    ko: 기다려라 요요…. 최강 아이돌 아니스가 간다.
    ja: |-
      待ってなさい、ヨヨ…
      最強アイドルになった私が潰してあげるから…
  event_staranis1_05_e_118:
    speaker: anis_idol
    en: All right! That's a wrap for today!
    ko: 좋아! 오늘 일정 끝!
    ja: よし！今日のお仕事終わり！
  event_staranis1_05_e_119:
    speaker: anis_idol
    en: Let's get back to the dorm, check the monitoring, squeeze in some practice...
    ko: 얼른 숙소 돌아가서, 모니터링하고, 연습 좀 하면….
    ja: |-
      早く戻って、今日の見直しして、
      少しだけ練習したら…
  event_staranis1_05_e_120:
    speaker: anis_idol
    en: Hmm, then we can just jump straight into tomorrow's schedule.
    ko: 음. 바로 내일 스케줄 나가면 되겠다.
    ja: |-
      うん。ちょうど明日のスケジュールが
      始められるわね。
  event_staranis1_05_e_121:
    speaker: anis_idol
    en: Tomorrow starts at five, right?
    ko: 내일 아마 5시 시작이던가?
    ja: 明日って5時スタートだっけ？
  event_staranis1_05_e_122:
    speaker: mint_o
    en: Wow, you're incredible. I'm completely wiped and can't even move a finger.
    ko: |-
      와… 진짜 대단하네.
      난 지금 녹초야. 손가락 하나 까딱 못 해.
    ja: |-
      はぁ…本当にすごい。
      私、もうヘトヘトよ。指一本動かないわ。
  event_staranis1_05_e_123:
    speaker: mint_o
    en: Riss, can you give me a piggyback?
    ko: 리스. 나 좀 업어주면 안 돼?
    ja: リス、おんぶしてくれない？
  event_staranis1_05_e_124:
    speaker: riss
    en: Uh... I'll try my best.
    ko: 어… 힘내볼게.
    ja: ええと…頑張ってみます。
  event_staranis1_05_e_125:
    speaker: prika_o
    en: Don't joke about that. She'll actually do it.
    ko: |-
      농담이라도 그런 말 하지 마.
      쟤 진짜 하니까.
    ja: |-
      冗談でもそういうことは言うんじゃない。
      本気にするタイプだ。
  event_staranis1_05_e_126:
    speaker: prika_o
    en: Man... I'm beat.
    ko: 아… 그런데 진짜 지치긴 하네.
    ja: ああ…でも、確かにクタクタだ。
  event_staranis1_05_e_127:
    speaker: prika_o
    en: "... Maybe I'll just skip the shower today."
    ko: "…오늘 그냥 씻지 말까."
    ja: 今日はシャワーもやめとくか…
  event_staranis1_05_e_128:
    speaker: anis_idol
    en: What? You practically live in the shower. What happened?
    ko: 하루에도 수십번씩 샤워하던 애가 웬일이래.
    ja: |-
      1日に何十回でもシャワー浴びる潔癖症が
      一体どうしちゃったのよ。
  event_staranis1_05_e_129:
    speaker: prika_o
    en: I'm just saying. It's been kinda rough lately.
    ko: |-
      말이 그렇다는 거야 말이.
      요즘 너무 힘들어.
    ja: |-
      言ってみただけだ。
      だが、最近はそれぐらい疲れてるからな。
  event_staranis1_05_e_130:
    speaker: anis_idol
    en: I'm telling you, feeling tired is all in your head. A Nikke's body doesn't
      even get tired.
    ko: |-
      그러니까, 힘들다는 건 착각이라니까?
      니케의 바디는 힘들다거나 그런 거 몰라요.
    ja: |-
      だ～か～ら、疲れてるなんて錯覚だって。
      ニケはそんなもの感じないんだから。
  event_staranis1_05_e_131:
    speaker: anis_idol
    en: We've got unlimited power! Unlimited stamina!
    ko: 무한 동력! 무한 체력!
    ja: 無限のエネルギーと無限の体力！
  event_staranis1_05_e_132:
    speaker: anis_idol
    en: It's like... we were practically made to be pop stars!
    ko: 마치…! 아이돌이 되기 위해 만들어진 존재 같은 거지!
    ja: |-
      そう…！アイドルになるために
      作られたみたいなものじゃない！
  event_staranis1_05_e_133:
    speaker: hanson
    en: All right, let's head back. I'm tired too.
    ko: 그래그래. 복귀하자. 나도 피곤하네.
    ja: |-
      まったく、うらやましいな。
      戻ろう。私も疲れた。
  event_staranis1_05_e_134:
    speaker: anis_idol
    en: So, how are we doing on the charts lately? Did we go up much?
    ko: 그런데 요즘 우리 차트 어때요? 좀 많이 올랐어요?
    ja: |-
      そういえば、最近のチャートは？
      結構上がったんじゃないですか？
  event_staranis1_05_e_135:
    speaker: hanson
    en: Hmm... we're still at 19th. No change.
    ko: 음… 19위에서 계속 변동이 없네.
    ja: いや…19位から動かないな。
  event_staranis1_05_e_136:
    speaker: anis_idol
    en: Just keeping it going is impressive enough.
    ko: 유지하고 있는 것만 해도 대단한 거죠 뭐.
    ja: キープしてるだけでもすごいことですよ。
  event_staranis1_05_e_137:
    speaker: anis_idol
    en: It's fine, we'll just work harder.
    ko: 괜찮아요. 더 열심히 하면 되는 거니까.
    ja: 大丈夫。もっと頑張ればいいだけですから。
  event_staranis1_05_e_138:
    speaker: anis_idol
    en: C'mon, guys, let's go.
    ko: 자자. 다들 얼른 갑시다.
    ja: ほら、みんな早く！
  event_staranis1_05_e_139:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_140:
    speaker: riss
    en: Anis, wait.
    ko: 아니스. 잠깐.
    ja: アニス。ちょっと…
  event_staranis1_05_e_141:
    speaker: anis_idol
    en: Yeah?
    ko: 응?
    ja: え？
  event_staranis1_05_e_142:
    speaker: riss
    en: Stay right there.
    ko: 거기 가만히 있어.
    ja: そのままじっとしてて。
  event_staranis1_05_e_143:
    speaker: "<Narration>"
    en: Riss walks up to Anis,
    ko: 리스가 아니스에게 다가간다.
    ja: リスがアニスに近づいた
  event_staranis1_05_e_144:
    speaker: "<Narration>"
    en: and stares at her for a long while.
    ko: 한동안 빤히 아니스를 바라본다.
    ja: しばらくの間、アニスの顔をのぞき込んだ
  event_staranis1_05_e_145:
    speaker: anis_idol
    en: Wh-what's wrong?
    ko: 왜, 왜 그래?
    ja: ど、どうしたの？
  event_staranis1_05_e_146:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_147:
    speaker: riss
    en: Are you... even breathing?
    ko: 너, 지금 숨 쉬고 있어?
    ja: アニス…今、呼吸してる？
  event_staranis1_05_e_148:
    speaker: anis_idol
    en: Breathing? Yeah, obviously.
    ko: 숨? 그거야 당연히 쉬고 있지?
    ja: 呼吸？当然、してるけど？
  event_staranis1_05_e_149:
    speaker: "<Narration>"
    en: Riss points at Anis's chest.
    ko: 리스가 아니스의 가슴을 가리킨다.
    ja: リスはアニスの胸を指さした
  event_staranis1_05_e_150:
    speaker: "<Narration>"
    en: It doesn't rise or fall at all.
    ko: 조금의 움직임도 없다.
    ja: まったく動いていない
  event_staranis1_05_e_151:
    speaker: riss
    en: No, you're not.
    ko: 안 쉬잖아.
    ja: 息、してない。
  event_staranis1_05_e_152:
    speaker: anis_idol
    en: Huh? Oh, you're right.
    ko: 읭? 그러네?
    ja: あれ？ホント？
  event_staranis1_05_e_153:
    speaker: anis_idol
    en: Wait, how do you breathe again?
    ko: 어? 숨 쉬는 거 어떻게 하더라?
    ja: 呼吸ってどうやってするんだっけ？
  event_staranis1_05_e_154:
    speaker: anis_idol
    en: Hoo... haa...? Nope, that's not it.
    ko: |-
      후우, 후우.
      이거 아닌데?
    ja: |-
      ふっ…はっ…
      あれ？違う？
  event_staranis1_05_e_155:
    speaker: anis_idol
    en: "... Oh!"
    ko: "…어…."
    ja: "…あ…"
  event_staranis1_05_e_156:
    speaker: anis_idol
    en: That's right, I'm a Nikke! I don't need to breathe!
    ko: 맞아! 나 니케라서 숨 안 쉬어도 괜찮아!
    ja: |-
      そうだった！
      私、ニケだから呼吸しなくてもいいの！
  event_staranis1_05_e_157:
    speaker: anis_idol
    en: So yeah, everything's totally fine!
    ko: 그니러까 문제 아무 지금 없다습입니다!
    ja: だから、全然問題ないじゃない！
  event_staranis1_05_e_158:
    speaker: riss
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis1_05_e_159:
    speaker: "<Narration>"
    en: Riss throws herself at Anis.
    ko: 리스가 몸을 내던지듯 아니스에게 달려간다.
    ja: リスが身を投げだし、アニスに飛びかかると…
  event_staranis1_05_e_160:
    speaker: "<Narration>"
    en: She pulls something from inside her coat and jabs it into Anis's neck.
    ko: 품에서 뭔가를 꺼내, 아니스의 목에 찔러넣는다.
    ja: |-
      胸元から取り出した何かを、
      アニスの首筋に突き刺した
  event_staranis1_05_e_161:
    speaker: riss
    en: I'm sorry...!
    ko: 미안…!
    ja: ごめん…！
  event_staranis1_05_e_162:
    speaker: "<Narration>"
    en: "*Bzzzzzt!*"
    ko: 빠지지지직--!!
    ja: バチバチバチッ！！
  event_staranis1_05_e_163:
    speaker: "<Narration>"
    en: Electricity bursts out in a blinding flash, and Anis crumples to the ground.
    ko: 섬광이 번쩍하며 아니스가 쓰러진다.
    ja: 紫電が走り、アニスが倒れた
  event_staranis1_05_e_164:
    speaker: "<Narration>"
    en: Riss's hands shake violently as she shouts.
    ko: 리스는 손을 덜덜 떨며 외쳤다.
    ja: リスは手を震わせながら叫んだ
  event_staranis1_05_e_165:
    speaker: riss
    en: I-I think she's going through a Mind Switch! Hurry, we have to get her to
      the Repair Center!
    ko: |-
      사고, 사고 전환이 온 것 같아요!
      빨리, 빨리 리페어 센터로!!
    ja: |-
      し、思考転換のおそれがあります！
      早くリペアセンターへ！！
  event_staranis1_05_e_166:
    speaker: "<Narration>"
    en: At the Repair Center...
    ko: 리페어 센터.
    ja: リペアセンター
  event_staranis1_05_e_167:
    speaker: femaledoctor
    en: Fortunately, it didn't escalate into a Mind Switch.
    ko: "…다행히 사고 전환까지 오지는 않았어요."
    ja: |-
      …幸い、まだ思考転換は
      起こっていなかったようです。
  event_staranis1_05_e_168:
    speaker: femaledoctor
    en: You forced a reboot just in time, so she'll be fine.
    ko: 직전에 뇌를 강제로 재부팅해서 무사할 수 있었던 거죠.
    ja: 直前で止められたといったところですね。
  event_staranis1_05_e_169:
    speaker: femaledoctor
    en: That was the right call. Knocking her out was the best option.
    ko: 좋은 판단이었어요. 기절이라니. 강제로 꺼버리는 것만 한 게 없죠
    ja: |-
      いい判断だったと思います。
      気絶させるのが一番早いですから。
  event_staranis1_05_e_170:
    speaker: femaledoctor
    en: If you'd been any later, the damage would've been irreversible.
    ko: 조금만 늦었어도 되돌릴 수 없었을 거예요.
    ja: あと少しでも遅れていたら危ないところでした。
  event_staranis1_05_e_171:
    speaker: hanson
    en: May I ask... the reason?
    ko: 이유가… 뭡니까?
    ja: 原因は…なんでしょうか？
  event_staranis1_05_e_172:
    speaker: femaledoctor
    en: "*Sigh*"
    ko: "…하아."
    ja: "…はぁ…"
  event_staranis1_05_e_173:
    speaker: femaledoctor
    en: In theory, a Nikke doesn't need to eat or sleep.
    ko: 니케는 이론상으로 먹지도, 자지도 않아도 돼요.
    ja: |-
      ニケに食事や睡眠の必要が無い
      という説は、理論上の話です。
  event_staranis1_05_e_174:
    speaker: femaledoctor
    en: They run on an unlimited power source since everything except the brain is
      mechanical.
    ko: 무한 동력을 달고 있고, 뇌를 제외한 신체는 모두 기계니까.
    ja: |-
      確かに外部からの栄養補給は
      必須ではありませんし、
      脳以外の身体は全て機械ですから。
  event_staranis1_05_e_175:
    speaker: femaledoctor
    en: But you mustn't forget that the brain is still human.
    ko: 하지만 뇌는 인간의 것이라는 걸 잊으면 안 돼요.
    ja: |-
      ですが、脳は人間のものだということを
      忘れてはいけません。
  event_staranis1_05_e_176:
    speaker: femaledoctor
    en: When the brain reorganizes its stored information to survive extreme conditions,
      we call it a Mind Switch.
    ko: 극한의 상황을 타파하기 위해 뇌의 정보가 재조립되는 것을 사고 전환이라고 얘기해요.
    ja: |-
      思考転換というのは、
      脳が追い詰められた時に起こるものなんです。
  event_staranis1_05_e_177:
    speaker: femaledoctor
    en: Most of the time, something goes wrong during that process, and the brain
      is permanently damaged.
    ko: 보통은 재조립 과정에서 잘못되어 머리가 망가지죠.
    ja: |-
      その結果は基本的に、
      頭が壊れると思ってください。
  event_staranis1_05_e_178:
    speaker: femaledoctor
    en: The most common trigger is when a Nikke begins to strongly perceive herself
      as something other than human.
    ko: 가장 흔히 일어나는 사례가 [자신을 인간이 아닌 니케로 강하게 인지할 때]에요.
    ja: |-
      とくに、「自分は人間ではなくニケ」だと
      強く認識した時に起こりやすくなります。
  event_staranis1_05_e_179:
    speaker: femaledoctor
    en: Physically, they're almost identical to humans. They're stronger, and they
      don't age, but otherwise their bodily sensations are no different from a human's.
    ko: 몸은 당연히 인간일 때와 똑같죠. 더 튼튼하고 늙지 않는다는 것 말고는 인간의 몸과 감각적으로 차이가 없어요.
    ja: |-
      身体に対する感覚は、
      頑丈になって老化しなくなるというぐらいで、
      人間の時と変わらないのですが…
  event_staranis1_05_e_180:
    speaker: femaledoctor
    en: But when someone becomes strongly aware that she's a Nikke rather than a human,
      the brain starts to malfunction.
    ko: |-
      그런데 자신이 인간이 아니라 니케라는 것을 강하게 인지하면,
      뇌가 오작동을 일으켜요.
    ja: |-
      自分を人間ではないと
      強く意識しすぎてしまうと、
      脳が誤作動を起こします。
  event_staranis1_05_e_181:
    speaker: femaledoctor
    en: '"Huh? I''m fine even if I don''t sleep? Isn''t that supposed to be dangerous?"'
    ko: "[어? 잠을 안 자는데도 괜찮네? 잠 안 자면 큰일 나는 것 아닌가?]"
    ja: |-
      「寝てないのに平気、
      寝ないと疲れるはずなのにおかしい」
  event_staranis1_05_e_182:
    speaker: femaledoctor
    en: '"Oh right, that''s because I''m a Nikke, not a human."'
    ko: "[아, 나 니케라서 그렇지. 인간이 아니라.]"
    ja: "「そうだ、私はニケだった、人間じゃない」"
  event_staranis1_05_e_183:
    speaker: femaledoctor
    en: Thoughts like that might not matter if they only pass through your mind once
      or twice. But when they start piling up...
    ko: |-
      가끔씩 스쳐 지나가는 생각 정도라면 괜찮을지 모르는데,
      이게 쌓이고 쌓이다 보면.
    ja: |-
      これがたまに頭に浮かぶ程度なら
      問題ありませんが、
      そういう思考が何度も積み重なると…
  event_staranis1_05_e_184:
    speaker: femaledoctor
    en: you become intensely aware that you're not human. And the brain begins to
      reject the information it has always believed to be true.
    ko: |-
      자기가 인간이 아니라는 것을 강하게 인지하게 되고,
      뇌는 지금껏 자신이 알고 있던 정보를 스스로 부정해요.
    ja: |-
      いずれ頭に焼き付いてしまい、
      脳が人間として常識だったことを
      否定し始めます。
  event_staranis1_05_e_185:
    speaker: femaledoctor
    en: |-
      I am human.
      I am not human.
    ko: |-
      나는 인간이다.
      나는 인간이 아니다.
    ja: |-
      つまり、自分が人間だという思考と、
      人間ではないという思考が…
  event_staranis1_05_e_186:
    speaker: femaledoctor
    en: Those two pieces of information begin fighting inside the same brain.
    ko: 두 정보가 싸우는 거죠. 같은 뇌에서.
    ja: 互いに争い始めます。
  event_staranis1_05_e_187:
    speaker: femaledoctor
    en: Brain activity spikes to extreme levels. Far beyond what happens when it's
      simply trying to survive a crisis.
    ko: |-
      그렇게 되면 뇌가 미친 듯 활성화돼요.
      극한 상황에서 돌파구를 찾는 것 이상으로 활성화되죠.
    ja: |-
      そうすると、脳は異常に活性化します。
      突破口のない矛盾に追い詰められるわけです。
  event_staranis1_05_e_188:
    speaker: femaledoctor
    en: |-
      It affirms, then denies.
      Affirms again, then denies again.
    ko: 긍정하고, 부정하고, 긍정하고, 부정하고.
    ja: 肯定と否定を繰り返し続けて…
  event_staranis1_05_e_189:
    speaker: femaledoctor
    en: And once the brain decides it can't handle it anymore, it runs a process that
      forcibly reorganizes the stored information.
    ko: |-
      그러다 이걸 뇌에서 감당할 수 없다고 판단되면,
      특정 프로세스를 거쳐 뇌의 정보를 재조립해 버려요.
    ja: |-
      やがて耐えられなくなった脳が、
      情報を書き換えてしまう、
      そのような現象です。
  event_staranis1_05_e_190:
    speaker: femaledoctor
    en: "... There's a reason the catalyst fluid was made blood-red, and why sensations
      like pain were recreated in the first place."
    ko: |-
      …괜히 액체 촉매의 색을 피와 같은 붉은색으로 만들고,
      통각 같은 것을 재현해 놓은 게 아니에요.
    ja: |-
      …わざわざ液体触媒を血と同じ色にしたり、
      痛みを感じる機能があったりするのも、
      理由があってのことなんですよ。
  event_staranis1_05_e_191:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_192:
    speaker: femaledoctor
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_193:
    speaker: femaledoctor
    en: From the look of it, you're managing one of those Nikke groups that are everywhere
      lately.
    ko: 보아하니 요즘 많이 보이는 니케 아이돌을 운영하시는 분 같은데.
    ja: |-
      あなたも、最近よく見る
      ニケのアイドルのプロデューサーでしょう。
  event_staranis1_05_e_194:
    speaker: femaledoctor
    en: What's wrong with you people?
    ko: 당신들 대체 왜 그러는 건가요?
    ja: いったい何だと思っているんですか？
  event_staranis1_05_e_195:
    speaker: femaledoctor
    en: Nikkes aren't machines. You can't just switch them on like computers and expect
      them to run forever.
    ko: |-
      니케는 단순한 기계가 아니에요.
      컴퓨터 쓰듯이 전원만 넣는다고 무한정 쓸 수 있는 게 아니라고요.
    ja: |-
      ニケは単なる機械ではありません。
      パソコンのように、電源を入れれば
      ずっと動くというわけではないのです。
  event_staranis1_05_e_196:
    speaker: femaledoctor
    en: "... Jeez, I've already lost count of how many times I've seen this just this
      month..."
    ko: 하… 이번 달만 해도 이게 몇 번째인지….
    ja: はぁ…今月だけでも何人目か…
  event_staranis1_05_e_197:
    speaker: femaledoctor
    en: You call yourselves pop stars, yet you don't even know the kind of things
      Pretty used to say...
    ko: 아이돌이라면서, 프리티가 무슨 말을 하고 다녔는지도 모르고….
    ja: |-
      アイドルに関わっておきながら、
      プリティーが何を訴えていたのか
      まったく分かってない…
  event_staranis1_05_e_198:
    speaker: hanson
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis1_05_e_199:
    speaker: hanson
    en: I'm... sorry.
    ko: 죄송… 합니다.
    ja: 申し訳…ありません。
  event_staranis1_05_e_200:
    speaker: femaledoctor
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_201:
    speaker: femaledoctor
    en: She'll recover fully once she wakes up.
    ko: 깨어나면 아무 이상 없이 생활할 수 있을 거예요.
    ja: |-
      目を覚ました後は、
      問題なく日常に戻れるはずです。
  event_staranis1_05_e_202:
    speaker: femaledoctor
    en: Please treat her better.
    ko: 제발. 좀 아껴주세요. 부탁드릴게요.
    ja: |-
      どうか、大切に扱ってあげてください。
      お願いしますよ。
  event_staranis1_05_e_203:
    speaker: "<Narration>"
    en: The doctor leaves the room.
    ko: 여자 의사가 병실을 나갔다.
    ja: 女医が病室から出て行った
  event_staranis1_05_e_204:
    speaker: "<Narration>"
    en: Hanson watches Anis sleeping in bed, a heavy feeling settling in his chest.
    ko: 한슨은 침대에 누워 잠들어있는 아니스를 착잡한 심정으로 바라보았다.
    ja: |-
      ベッドに眠るアニスを
      ハンソンは複雑な表情で見続けた
  event_staranis1_05_e_205:
    speaker: "<Narration>"
    en: A moment later, Mint, Prika, and Riss enter.
    ko: 그리고 잠시 후, 민트와 프리카, 리스가 들어왔다.
    ja: |-
      しばらくして、
      ミント、プリカ、リスが病室に来た
  event_staranis1_05_e_206:
    speaker: riss
    en: What... did the doctor say?
    ko: "…뭐래… 요?"
    ja: "…先生は…なんと？"
  event_staranis1_05_e_207:
    speaker: hanson
    en: "... She'll be fine after some rest. I'm sorry for worrying you all."
    ko: "…좀 쉬면 괜찮아진대. 걱정 끼쳐서 미안하다."
    ja: |-
      少し休めば問題ないそうだ。
      心配をかけて申し訳ない。
  event_staranis1_05_e_208:
    speaker: hanson
    en: And thank you, Riss... If you hadn't been there, it could've been much worse.
    ko: 고맙다. 네가 아니었으면… 정말 큰일 날 뻔했어.
    ja: |-
      お礼を言わせてくれ。
      君がいなかったら…
      取り返しのつかないことになっていた。
  event_staranis1_05_e_209:
    speaker: riss
    en: N-no, it's just... I've been a little worried. Lately, Anis keeps saying she's
      a Nikke and that she's fine...
    ko: 아, 아니에요. 요즘 아니스가 걸핏하면 자기는 니케라고 괜찮다고 얘기하는 게 신경 쓰였었으니까.
    ja: |-
      いえ、気にしないでください。
      最近アニスがずっと、自分はニケだからって
      言ってて、引っ掛かってたんです。
  event_staranis1_05_e_210:
    speaker: riss
    en: They said that can be an early sign of a Mind Switch...
    ko: 사고 전환이 오는 초기 증상 중 하나라고….
    ja: それが思考転換の兆候らしいって知って…
  event_staranis1_05_e_211:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_212:
    speaker: hanson
    en: And I didn't even realize... What's wrong with me?
    ko: 그런 것도 모르고. 난 참 뭐 하는 놈인지.
    ja: |-
      そんなことも見落としていたなんて…
      自分が情けない。
  event_staranis1_05_e_213:
    speaker: mint_o
    en: Did the doctor say when she'll wake up?
    ko: 언제 일어난대요?
    ja: いつ意識が戻るんですか？
  event_staranis1_05_e_214:
    speaker: hanson
    en: I'm not sure... I was only told she'd wake up once she's had enough rest.
    ko: 글쎄. 잘 만큼 자면 일어날 거라고만 들었어.
    ja: さあ。十分に寝たら起きてくると聞いた。
  event_staranis1_05_e_215:
    speaker: prika_o
    en: I'll wait.
    ko: 기다릴게요.
    ja: ここで待たせてもらう。
  event_staranis1_05_e_216:
    speaker: hanson
    en: No, it's all right. I'll wait here. You should all get some rest.
    ko: 아니야. 내가 기다릴 테니까 다들 들어가서 쉬어.
    ja: |-
      いや。私が見ているから、
      君たちは戻って休んでくれ。
  event_staranis1_05_e_217:
    speaker: mint_o
    en: How can we?
    ko: 어떻게 그래요.
    ja: そんなこと、できません。
  event_staranis1_05_e_218:
    speaker: riss
    en: I-I've canceled everything for tomorrow.
    ko: 내, 내일 일정은 모두 취소해 놨어요.
    ja: |-
      あの、明日のスケジュールは全て
      キャンセルしておきました。
  event_staranis1_05_e_219:
    speaker: riss
    en: We might catch some flak for it, but this is more important right now.
    ko: 욕은 좀 먹겠지만, 지금은 그게 중요한 게 아니니까요.
    ja: |-
      クレームにはなると思いますけど、
      それどころじゃないですから。
  event_staranis1_05_e_220:
    speaker: prika_o
    en: I'll go grab some food and a blanket.
    ko: 나가서 먹을 거랑 덮을 거 좀 사 올게요.
    ja: |-
      何か食べ物と、
      毛布代わりになるものを買ってくる。
  event_staranis1_05_e_221:
    speaker: mint_o
    en: I'll go with you.
    ko: 아, 같이 가.
    ja: 待って、私も行くわ。
  event_staranis1_05_e_222:
    speaker: riss
    en: Um... I-I'll come too.
    ko: 아, 나, 나도.
    ja: あっ、わ、私も…
  event_staranis1_05_e_223:
    speaker: hanson
    en: "... Okay, I'll leave it to you."
    ko: "…그래. 부탁할게."
    ja: "…ああ。頼む。"
  event_staranis1_05_e_224:
    speaker: "<Narration>"
    en: The three leave the hospital room.
    ko: 셋이 병실을 나갔다.
    ja: 3人が病室から出ていった
  event_staranis1_05_e_225:
    speaker: "<Narration>"
    en: Hanson turns back to Anis, staring at her as she sleeps.
    ko: 한슨은 다시 잠든 아니스를 빤히 쳐다보았다.
    ja: ハンソンは眠るアニスに視線を戻した
  event_staranis1_05_e_226:
    speaker: hanson
    en: "... Anis,"
    ko: "…아니스."
    ja: "…アニス。"
  event_staranis1_05_e_227:
    speaker: hanson
    en: why do you push yourself so much?
    ko: 왜 그렇게 열심히 하니.
    ja: なぜそこまで頑張ろうとするんだ。
  event_staranis1_05_e_228:
    speaker: anis_idol
    en: Because that's all I can do.
    ko: 그거 말고는 할 수 있는 게 없으니까요.
    ja: それしかできることがないから。
  event_staranis1_05_e_229:
    speaker: hanson
    en: "... You're up. Try to get some more rest."
    ko: "…일어나 있었구나. 더 자."
    ja: "…起きていたのか。もう少し寝ていろ。"
  event_staranis1_05_e_230:
    speaker: anis_idol
    en: Maybe later.
    ko: 이따가요.
    ja: 話が終わったら。
  event_staranis1_05_e_231:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_232:
    speaker: anis_idol
    en: Relax, I'm not about to act tough just because I'm a Nikke. I don't want my
      head getting screwed up either.
    ko: |-
      걱정마요. 니케니까 괜찮다고 떼쓸 생각은 없으니까.
      머리가 망가지는 건 저도 싫어요.
    ja: |-
      心配しないでください。
      もうニケだから平気なんて言いません。
      私だって壊れたくないですから。
  event_staranis1_05_e_233:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_234:
    speaker: hanson
    en: Do you really want to beat Yoyo that badly?
    ko: 요요를 그렇게 이기고 싶니?
    ja: そんなにヨヨに勝ちたいのか？
  event_staranis1_05_e_235:
    speaker: anis_idol
    en: Yeah.
    ko: 예.
    ja: はい。
  event_staranis1_05_e_236:
    speaker: hanson
    en: Even if it means risking a Mind Switch?
    ko: 사고 전환 위험까지 감수할 정도로?
    ja: 思考転換のリスクを負ってでも？
  event_staranis1_05_e_237:
    speaker: anis_idol
    en: "... I keep having this dream."
    ko: "…꿈을, 되게 자주 꿔요."
    ja: "…夢を…よく見るんです。"
  event_staranis1_05_e_238:
    speaker: anis_idol
    en: I'm alone in a dark room, just sitting there... and at some point, I fall
      asleep.
    ko: 아무도 없는 어두운 방에서 혼자 시간을 보내다가, 잠에 들고.
    ja: |-
      誰もいない暗い部屋に1人ぼっちで過ごして、
      眠りについて…
  event_staranis1_05_e_239:
    speaker: anis_idol
    en: Then I wake up, I'm still alone, but somehow, I'm somewhere high up...
    ko: 아무도 없는 어두운 방에서 혼자 깨어나서, 높은 곳에 올라간 다음.
    ja: |-
      やっぱり誰もいない暗い部屋で目が覚めて、
      高いところに上がって…
  event_staranis1_05_e_240:
    speaker: anis_idol
    en: And then I fall.
    ko: 뚝 떨어지는 꿈이요.
    ja: いきなり落ちる夢。
  event_staranis1_05_e_241:
    speaker: anis_idol
    en: While I'm falling, I look up, and she's there, looking down at me,
    ko: 떨어지는 중에 위를 올려다보면, 걔가 날 쳐다보고 있어요.
    ja: |-
      落ちながら上を見ると、
      あいつが私を見てるんです。
  event_staranis1_05_e_242:
    speaker: anis_idol
    en: smiling.
    ko: 웃으면서.
    ja: 笑いながら…
  event_staranis1_05_e_243:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_244:
    speaker: anis_idol
    en: I want those dreams to stop.
    ko: 그만 꾸고 싶거든요. 그런 꿈은.
    ja: そんな夢、もう見たくなくて。
  event_staranis1_05_e_245:
    speaker: anis_idol
    en: "... Boss,"
    ko: "…사장님."
    ja: "…社長。"
  event_staranis1_05_e_246:
    speaker: anis_idol
    en: I've always wondered
    ko: 왜 저보고 아이돌이 되라고 얘기했어요?
    ja: |-
      なんで私にアイドルにならないかなんて
      言ったんですか？
  event_staranis1_05_e_247:
    speaker: anis_idol
    en: why did you tell me to become a pop star.
    ko: 예전부터 진짜 궁금했거든요.
    ja: 前からずっと気になってました。
  event_staranis1_05_e_248:
    speaker: anis_idol
    en: What did you even see in me?
    ko: 도대체 저의 뭘 보고 아이돌을 제안했는지요.
    ja: |-
      いったい私のどこを見て
      そんなこと言ったんだろうって。
  event_staranis1_05_e_249:
    speaker: anis_idol
    en: Did I really look that hopeless?
    ko: 안 돼 보여서요?
    ja: かわいそうに思ったからですか？
  event_staranis1_05_e_250:
    speaker: anis_idol
    en: Or was it just pity for the girl who died at Pretty's comeback concert?
    ko: 프리티의 복귀 공연장에서 죽은 애가 가여워서?
    ja: |-
      プリティーのライブで死なせて、
      申しわけない気がしたから？
  event_staranis1_05_e_251:
    speaker: hanson
    en: No.
    ko: 아니야.
    ja: 違う。
  event_staranis1_05_e_252:
    speaker: anis_idol
    en: Then why?
    ko: 그럼 왜요?
    ja: じゃあ、どうして？
  event_staranis1_05_e_253:
    speaker: anis_idol
    en: I hate to admit it, but I'm just average.
    ko: 인정하기 싫은데, 저 진짜 평범하잖아요.
    ja: 認めたくないけど、私って平凡ですよね。
  event_staranis1_05_e_254:
    speaker: anis_idol
    en: There's nothing I've got going for me. No star quality, no talent.
    ko: 뭐 하나 특출난 것도 없고, 스타성도 없고, 재능도 없어요.
    ja: |-
      何の取り柄もなくて、
      スターになれる才能もなくて。
  event_staranis1_05_e_255:
    speaker: anis_idol
    en: I'm not special.
    ko: 특별하지 않아요.
    ja: ぜんぜん特別なんかじゃない。
  event_staranis1_05_e_256:
    speaker: anis_idol
    en: I... don't think I can win.
    ko: 못… 이길 것 같아요.
    ja: 勝ち目なんか…ないのに。
  event_staranis1_05_e_257:
    speaker: anis_idol
    en: I-I've seen her videos,
    ko: 여, 영상 몇 번 봤는데요. 요요 영상.
    ja: 見たんです、何回も。ヨヨの動画。
  event_staranis1_05_e_258:
    speaker: anis_idol
    en: and she's... incredible. Seriously, I don't even come close.
    ko: |-
      너무, 너무 잘해요.
      나 같은 건 비교도 안 될 정도로, 너무 잘해요.
    ja: |-
      すごく…すごく上手で。
      私なんかじゃ比べ物にならないぐらい。
  event_staranis1_05_e_259:
    speaker: anis_idol
    en: I-if it weren't for this job, I would've snapped and exposed her already,
      or gone straight to her place and beat the crap out of her.
    ko: 제, 제가 아이돌이 아니었으면, 그냥 미친척하고 폭로해 버리거나 찾아가서 흠씬 두들겨 패기라도 했을 텐데.
    ja: |-
      自分がアイドルじゃなかったら、
      勢いに任せてスキャンダルをリークしたり、
      思いきり殴ったりできたかもしれないけど…
  event_staranis1_05_e_260:
    speaker: anis_idol
    en: But I am a pop star. Clawing my way up from the bottom, yeah, but I'm still
      one.
    ko: 아이돌이잖아요 저. 마이너 차트에서 아득바득 구르기만 하지만, 그래도 아이돌이잖아요.
    ja: |-
      私もアイドルじゃないですか。
      チャートの下の方でもがいてるけど、
      それでもアイドルの端くれだから。
  event_staranis1_05_e_261:
    speaker: anis_idol
    en: So I can't do that.
    ko: 그래서 못 해요, 그런 짓.
    ja: だから、そんなことできなくて。
  event_staranis1_05_e_262:
    speaker: anis_idol
    en: Because pop stars... don't get to lose it like that.
    ko: 아이돌은… 그러면 안 되니까.
    ja: アイドルは…そんなことしちゃダメだから。
  event_staranis1_05_e_263:
    speaker: anis_idol
    en: They're supposed to give people hope.
    ko: 사람들에게 희망을 줘야 하는 아이돌은… 그러면 안 되니까.
    ja: みんなに希望を与えるのが…アイドルだから。
  event_staranis1_05_e_264:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_265:
    speaker: hanson
    en: That explains it.
    ko: 그래서야.
    ja: それが理由だ。
  event_staranis1_05_e_266:
    speaker: anis_idol
    en: "... Huh?"
    ko: "…예?"
    ja: "…え…？"
  event_staranis1_05_e_267:
    speaker: hanson
    en: "... All right, I'll be honest. At first, it was pity."
    ko: |-
      …그래. 솔직하게 말할게.
      처음엔 동정심이 맞았어.
    ja: |-
      …この際、正直に言おう。
      始めは同情だった。
  event_staranis1_05_e_268:
    speaker: hanson
    en: But...
    ko: 하지만….
    ja: だが…
  event_staranis1_05_e_269:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_270:
    speaker: hanson
    en: Do you remember when we first met?
    ko: 처음 만났을 때 기억나니.
    ja: |-
      初めて会った時に言ったことは、
      覚えているか？
  event_staranis1_05_e_271:
    speaker: hanson
    en: You said you wanted to become a star like Pretty, someone who could give people
      hope.
    ko: 너는 프리티처럼, 사람들에게 희망을 주는 별이 되고 싶다고 얘기했어.
    ja: |-
      君はプリティーのように、
      人々に希望を与えられる
      スターになりたいと言っていた。
  event_staranis1_05_e_272:
    speaker: anis_idol
    en: That hasn't changed.
    ko: 그건 지금도 변함이 없어요.
    ja: それは今も同じです。
  event_staranis1_05_e_273:
    speaker: hanson
    en: Why do you want to do that?
    ko: 왜 그러고 싶은데.
    ja: なぜだ？
  event_staranis1_05_e_274:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_275:
    speaker: anis_idol
    en: For someone who's fallen into despair and given up on life,
    ko: 절망에 빠져서 삶을 포기한 사람에게.
    ja: 絶望して人生を諦めた人に…
  event_staranis1_05_e_276:
    speaker: anis_idol
    en: I want to tell them... it's okay to keep living...
    ko: 너는 살아도 된다고… 말해주고 싶어… 서.
    ja: |-
      生きていていいんだよって…
      伝えたい…から。
  event_staranis1_05_e_277:
    speaker: anis_idol
    en: I want to stay by those who have no one,
    ko: 외로운 사람의 곁을 지켜주고
    ja: 寂しい気持ちの人に寄り添って…
  event_staranis1_05_e_278:
    speaker: anis_idol
    en: and be there for the ones who are worn down.
    ko: 지친 사람을 위로해 주고 싶어요.
    ja: 疲れた人を慰めてあげたいから。
  event_staranis1_05_e_279:
    speaker: anis_idol
    en: And in the end...
    ko: 그리고 끝내.
    ja: それから、いつか…
  event_staranis1_05_e_280:
    speaker: anis_idol
    en: I want them to feel like it was worth staying alive,
    ko: 살아있기를 잘했다고 느끼게 해주고 싶어요.
    ja: 生きててよかったと感じて欲しいから。
  event_staranis1_05_e_281:
    speaker: anis_idol
    en: just like Pretty did for me.
    ko: 프리티가, 저한테 그래 줬던 것처럼.
    ja: プリティーが、私にそうしてくれたから。
  event_staranis1_05_e_282:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_283:
    speaker: hanson
    en: That's exactly why you should become a pop star.
    ko: 그래서야. 네가 아이돌이 되어야 하는 이유는.
    ja: それだ。君がアイドルになるべき理由は。
  event_staranis1_05_e_284:
    speaker: hanson
    en: You're already special.
    ko: 너는 이미 특별해.
    ja: 君はもう、特別なんだ。
  event_staranis1_05_e_285:
    speaker: hanson
    en: You just ended up working for the wrong person. That's the only reason you
      never got your chance to shine.
    ko: 사장을 잘못 만나 빛날 기회가 없었던 것뿐이야.
    ja: |-
      支える大人が不甲斐ないから、
      輝くチャンスに巡り合えていないだけだ。
  event_staranis1_05_e_286:
    speaker: anis_idol
    en: Huh, never thought of it that way.
    ko: 그렇게 생각한 적 없어요.
    ja: そんなふうに思ったことは、ないです。
  event_staranis1_05_e_287:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_288:
    speaker: hanson
    en: I'll do whatever it takes
    ko: 빛나게 해줄게.
    ja: 輝かせてやる。
  event_staranis1_05_e_289:
    speaker: hanson
    en: to make you shine.
    ko: 내가, 무슨 수를 쓰든 간에.
    ja: 私は、どんな手を使ってでも。
  event_staranis1_05_e_290:
    speaker: hanson
    en: All of you.
    ko: 널, 너흴 빛나게 해줄게.
    ja: 君を…君たちを、輝かせてみせる。
  event_staranis1_05_e_291:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_05_e_292:
    speaker: anis_idol
    en: Okay, I believe you.
    ko: 예. 믿을게요.
    ja: うん。信じてます。
  event_staranis1_05_e_293:
    speaker: hanson
    en: All right. Now, get some sleep.
    ko: 그래. 빨리 자.
    ja: さあ、早く寝るんだ。
  event_staranis1_05_e_294:
    speaker: anis_idol
    en: "... Okay."
    ko: "…예."
    ja: "…はい。"
  event_staranis1_05_e_295:
    speaker: "<Narration>"
    en: Anis closes her eyes.
    ko: 아니스는 눈을 감는다.
    ja: アニスは目を閉じた
  event_staranis1_05_e_296:
    speaker: "<Narration>"
    en: A moment later, her breathing softens, and she drifts off to sleep.
    ko: 그리고 잠시 후, 작은 숨소리와 함께 잠에 빠져들었다.
    ja: しばらくすると、小さく寝息を立て始めた
  event_staranis1_05_e_297:
    speaker: "<Narration>"
    en: Hanson lowers his head, his gaze fixed on the floor.
    ko: 한슨은 고개를 숙이고 바닥을 바라본다.
    ja: ハンソンはうつむき、床に視線を落とした
  event_staranis1_05_e_298:
    speaker: "<Narration>"
    en: He stays that way for a long while.
    ko: 그러기를 한참.
    ja: そのまましばらく時が経った
  event_staranis1_05_e_299:
    speaker: "<Narration>"
    en: Then he lifts his head, staring into empty space.
    ko: 고개를 들고 허공을 바라본다.
    ja: ハンソンは頭を上げ、虚空を見つめた後…
  event_staranis1_05_e_300:
    speaker: "<Narration>"
    en: At last, he gets up and leaves the hospital room.
    ko: 자리에서 일어나, 병실을 나간다.
    ja: 立ち上がり、病室を出た
event_staranis1_06_s:
  event_staranis1_06_s_1:
    speaker: anis_human
    en: Seriously, again?
    ko: "…또?"
    ja: "…また？"
  event_staranis1_06_s_2:
    speaker: riss
    en: Y-yeah...
    ko: "…으, 응."
    ja: "…う、うん。"
  event_staranis1_06_s_3:
    speaker: riss
    en: I-it was a yogurt commercial this time...
    ko: 이, 이번엔 요거트 광고였는데….
    ja: こ、今度のヨーグルトのCM…
  event_staranis1_06_s_4:
    speaker: riss
    en: They, um... suddenly decided to go with Yoyo instead...
    ko: 또 갑자기 요요를 쓰기로 결정했다고….
    ja: また急に、やっぱりヨヨを起用するって…
  event_staranis1_06_s_5:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_6:
    speaker: anis_human
    en: What is that, the fifth time now?
    ko: 몇 번째야?
    ja: これで何回目？
  event_staranis1_06_s_7:
    speaker: riss
    en: I-if we count the soda ad too, that makes four...
    ko: 타, 탄산수 건까지 합치면 4번째….
    ja: た、炭酸水の件も入れたら4回目…
  event_staranis1_06_s_8:
    speaker: anis_human
    en: "... This is seriously pissing me off."
    ko: "…미치겠네."
    ja: "…なんなのよ。"
  event_staranis1_06_s_9:
    speaker: mint
    en: "... I'm sure of it now. This goes beyond a personal grudge."
    ko: |-
      …이 정도면 확신이 드네.
      요요 개인의 원한이 아니야.
    ja: |-
      …ここまでされると疑いようがないわね。
      ヨヨ個人の嫌がらせじゃないわ。
  event_staranis1_06_s_10:
    speaker: prika
    en: Yeah, Tetra's got it out for us.
    ko: 응. 우리는 테트라한테 밉보였어.
    ja: そうだな。テトラにそうとう憎まれてる。
  event_staranis1_06_s_11:
    speaker: prika
    en: If they're pushing Yoyo this hard, we're definitely on their radar.
    ko: 요요를 계속 들이밀 정도면 진짜 제대로 찍힌 모양인데.
    ja: |-
      ヨヨをしつこくぶつけてくるなんて、
      完全に目をつけられてるってことだ。
  event_staranis1_06_s_12:
    speaker: mint
    en: Do you have any idea why?
    ko: 짐작 가는 건 없어?
    ja: 心当たりはない？
  event_staranis1_06_s_13:
    speaker: prika
    en: "... Beats me. Should we just ask Boss directly?"
    ko: "…글쎄. 사장님한테 대놓고 물어봐야 하나."
    ja: "…どうだろうな。社長に直接聞くしかない。"
  event_staranis1_06_s_14:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_15:
    speaker: anis_human
    en: We're done for today, right?
    ko: 우리 오늘 남은 일정 없다고 했지?
    ja: |-
      今日の予定はもう無いって
      言ってたわよね？
  event_staranis1_06_s_16:
    speaker: riss
    en: Ah, yeah. We did have one more, but it got canceled because the place caught
      fire.
    ko: 아, 응. 하나 있었는데 가게에 불이 나서 취소됐어.
    ja: |-
      ああ、うん。もう1件あったけど、
      お店の火事でキャンセルになったから。
  event_staranis1_06_s_17:
    speaker: anis_human
    en: "... Everyone made it out okay?"
    ko: "…괜찮대?"
    ja: "…大丈夫だったの？"
  event_staranis1_06_s_18:
    speaker: riss
    en: N-no one's hurt. It seems the ceiling's only slightly burnt, so I don't think
      the damage is too bad...
    ko: |-
      다, 다친 사람은 없고, 천장이 좀 그을린 모양이야.
      피해도 그렇게 안 크다고….
    ja: |-
      ケ、ケガ人はいなくて、
      天井がちょっと焦げたって。
      被害はそこまで大きくないみたい…
  event_staranis1_06_s_19:
    speaker: anis_human
    en: Phew, that's a relief.
    ko: 아, 다행이네.
    ja: はぁ、よかったわ。
  event_staranis1_06_s_20:
    speaker: riss
    en: "... Wh-where are you going?"
    ko: "…어, 어디 가려고?"
    ja: "…ど、どこ行く気？"
  event_staranis1_06_s_21:
    speaker: anis_human
    en: I'm gonna see Yoyo.
    ko: 요요랑 한 번 만나봐야겠어.
    ja: ちょっと、ヨヨに会ってくる。
  event_staranis1_06_s_22:
    speaker: mint
    en: She's not someone you can just go see whenever you want. You know that, right?
    ko: 만나고 싶다고 만날 수 있는 상대가 아니지 않아?
    ja: 会いたいからで会える相手じゃないでしょう？
  event_staranis1_06_s_23:
    speaker: anis_human
    en: I don't care. I'll stake it out if I have to.
    ko: 그래도 가서 죽치고 있어 봐야지.
    ja: 座り込んででも、話をしないと。
  event_staranis1_06_s_24:
    speaker: anis_human
    en: I need to see what's really going on.
    ko: 일이 어떻게 돌아가는 건지 한 번 물어나 봐야겠어.
    ja: どういうことなのか、しっかり聞かせてもらう。
  event_staranis1_06_s_25:
    speaker: anis_human
    en: I'm heading out. Make sure Boss knows where I'll be.
    ko: 다녀올게. 사장님한테도 잘 말해줘.
    ja: とりあえず、社長にはよろしく言っといて。
  event_staranis1_06_s_26:
    speaker: "<Narration>"
    en: Anis heads for the door.
    ko: 아니스가 사무실을 나선다.
    ja: アニスは事務所の出口へ向かった
  event_staranis1_06_s_27:
    speaker: "<Narration>"
    en: She swings it wide open, and Yoyo is standing there, right in front of her.
    ko: 문을 활짝 열자, 그 앞에 요요가 서 있었다.
    ja: 扉が開くと、目の前にヨヨが立っていた
  event_staranis1_06_s_28:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_29:
    speaker: anis_human
    en: What are you doing here...?
    ko: "…너 왜 여기…."
    ja: "…なんでここに…"
  event_staranis1_06_s_30:
    speaker: yoyo
    en: I'd like a word.
    ko: 얘기 좀 했으면 해서.
    ja: 話がしたいと思って。
  event_staranis1_06_s_31:
    speaker: anis_human
    en: Great, I've got something to say too.
    ko: 잘됐네. 나도 할 얘기 있었는데.
    ja: |-
      ちょうどよかった。
      私も聞きたいことがあったの。
  event_staranis1_06_s_32:
    speaker: yoyo
    en: I'll keep this short. I didn't have anything to do with your ads being taken.
    ko: |-
      빠르게 얘기할게.
      광고 빼앗아 간 거, 내가 원한 게 아니야.
    ja: |-
      じゃあ、私から。
      CMの話は、私の意志じゃないの。
  event_staranis1_06_s_33:
    speaker: yoyo
    en: That was the company's decision, not mine.
    ko: 회사에서 멋대로 밀어붙인 것뿐이야.
    ja: 会社にやらされてるだけ。
  event_staranis1_06_s_34:
    speaker: anis_human
    en: And what the heck am I supposed to do with that?
    ko: 뭐라는 거야. 그래서 뭐 어쩌라고?
    ja: 何を言うかと思えば…だから何？
  event_staranis1_06_s_35:
    speaker: yoyo
    en: Don't get the wrong idea.
    ko: 오해하지 말아줬으면 해.
    ja: 誤解しないでほしいの。
  event_staranis1_06_s_36:
    speaker: yoyo
    en: I know you hate me, but I still consider us colleagues chasing the same dream.
    ko: |-
      네가 나를 싫어하는 건 알지만,
      나는 우리가 같은 꿈을 꾸는 동료라고 생각하고 있으니까.
    ja: |-
      私のことが嫌いなのは知ってるけど、
      私はあなたのこと、同じ夢を見てる
      仲間だと思ってるから。
  event_staranis1_06_s_37:
    speaker: yoyo
    en: I would never stoop to something so beneath me.
    ko: 그런 비겁한 짓은 하지 않아.
    ja: あんな卑怯なマネ、したくないの。
  event_staranis1_06_s_38:
    speaker: anis_human
    en: Drop the act. It's pathetic.
    ko: 너무 속 보이는 짓 좀 하지 마. 없어 보이니까.
    ja: 見え透いたウソは止めて。みっともないわよ。
  event_staranis1_06_s_39:
    speaker: anis_human
    en: You really think we'd lose it and start exposing you over a couple of ads?
    ko: 광고를 연속으로 뺏긴 우리가 눈이 돌아서 뭐 폭로라도 할까 봐?
    ja: |-
      こんなことしておいて、
      昔話をリークされるんじゃないかって
      不安なんでしょ？
  event_staranis1_06_s_40:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_41:
    speaker: anis_human
    en: I already told you I'm not doing that.
    ko: 말했잖아. 그럴 생각 없다고.
    ja: もう言ったと思うけど。そんなつもりないから。
  event_staranis1_06_s_42:
    speaker: anis_human
    en: You're almost out of time. So brace yourself. I'm about to crush you with
      actual skill, got it?
    ko: 너 이제 얼마 안 남았다. 실력으로 밟힐 준비나 해라. 알겠냐?
    ja: |-
      あんたももうあと少しよ。
      実力で負けを認める準備でもしておけば？
  event_staranis1_06_s_43:
    speaker: yoyo
    en: Heh...
    ko: "……후."
    ja: "…はぁ…"
  event_staranis1_06_s_44:
    speaker: yoyo
    en: Don't make assumptions.
    ko: "…넘겨짚지 말아 줘."
    ja: "…勝手に決めつけないで。"
  event_staranis1_06_s_45:
    speaker: yoyo
    en: I came here to clear up a misunderstanding.
    ko: 나는 진심으로 오해를 풀었으면 해서….
    ja: 私は本気で誤解してほしくなくて…
  event_staranis1_06_s_46:
    speaker: riss
    en: You expect us to believe that?
    ko: 그걸 어떻게 믿는데?
    ja: それをどう信じろっていうの？
  event_staranis1_06_s_47:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_48:
    speaker: yoyo
    en: So you're the new manager for T.T. STAR. I'm Yoyo. Nice to meet you.
    ko: |-
      아, T.T. STAR에 새로 왔다는 매니저로군요.
      반가워요. 요요예요.
    ja: |-
      ええと、T.T. STARの
      新しいマネージャーさんでしたよね。
      初めまして、ヨヨです。
  event_staranis1_06_s_49:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_50:
    speaker: riss
    en: You don't remember me?
    ko: 기억 안 나는구나.
    ja: 覚えてないよね。
  event_staranis1_06_s_51:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_52:
    speaker: yoyo
    en: I'm sorry, should I know you...?
    ko: 죄송해요. 어디서 뵀었
    ja: ごめんなさい。どこかでお会いし…
  event_staranis1_06_s_53:
    speaker: mint
    en: Guys! Look at this!
    ko: 다들! 이거 봐!
    ja: みんな！ちょっと！
  event_staranis1_06_s_54:
    speaker: "<Narration>"
    en: Mint's urgent shout cuts through the space, and all eyes snap to the TV.
    ko: 민트의 다급한 외침에 모두의 시선이 쏠린다.
    ja: |-
      ミントのあわてた声が、
      その場にいた全員の視線を集めた
  event_staranis1_06_s_55:
    speaker: "<Narration>"
    en: A news segment on the entertainment industry is airing on the Central Government
      channel.
    ko: 중앙 정부 채널에서 연예계 관련 뉴스가 흘러나오고 있다.
    ja: |-
      中央政府のテレビチャンネルで、
      芸能ニュースが流れていた
  event_staranis1_06_s_56:
    speaker: maleannouncer
    en: If I understand what you're saying, Yoyo is number one on the major record
      charts,
    ko: |-
      그럼 지금 그 말을 요약하자면,
      메이저 랭킹 1위인 요요가.
    ja: |-
      つまり…ここまでの話をまとめますと、
      メジャーランキング1位のアイドル、ヨヨが…
  event_staranis1_06_s_57:
    speaker: maleannouncer
    en: and T.T. STAR is... where again on the indie charts?
    ko: 마이너 랭킹 10… 몇 위였죠?
    ja: インディーズの10…何位でしたっけ？
  event_staranis1_06_s_58:
    speaker: femaleannouncer
    en: 19th.
    ko: 19위요.
    ja: 19位です。
  event_staranis1_06_s_59:
    speaker: maleannouncer
    en: Right. So you're saying Yoyo's been targeting T.T. STAR, currently 19th on
      the indie charts?
    ko: 예. 마이너 랭킹 19위인 T.T. STAR를 괴롭히고 있다는 얘기잖아요?
    ja: |-
      そうでした。インディーズで
      ランキング19位のT.T. STARと
      確執があると言うことですか？
  event_staranis1_06_s_60:
    speaker: femaleannouncer
    en: That's right, she's been snatching every ad that they land,
    ko: 그렇죠. T.T. STAR가 받은 광고를 요요가 싹 다 빼앗아 가고 있어요.
    ja: |-
      その通りです。T.T. STARが
      出演する予定だったCMを
      乗っ取っているようですね。
  event_staranis1_06_s_61:
    speaker: femaleannouncer
    en: though calling them ads might be a stretch.
    ko: 뭐, 광고라고 부르기에도 민망한 것들이긴 하지만요.
    ja: それも、当てつけのような低品質のCMで。
  event_staranis1_06_s_62:
    speaker: maleannouncer
    en: Wait, why would she? It's not like she needs to.
    ko: 아니, 왜요? 뭐가 아쉬워서요?
    ja: しかし、どうしてでしょう？なぜそんなことを？
  event_staranis1_06_s_63:
    speaker: femaleannouncer
    en: Let's take a look at this.
    ko: 이거 좀 보실까요?
    ja: こちらをご覧いただけますか？
  event_staranis1_06_s_64:
    speaker: "<Narration>"
    en: A photo of a desk covered in scribbles fills the screen.
    ko: 화면에 낙서가 가득한 책상이 출력된다.
    ja: 画面に落書きだらけの机が映しだされた
  event_staranis1_06_s_65:
    speaker: maleannouncer
    en: What are we looking at?
    ko: 뭔가요 이건?
    ja: これは？
  event_staranis1_06_s_66:
    speaker: femaleannouncer
    en: This is Anis's school desk from back when she was still human.
    ko: T.T. STAR 멤버인 아니스가 사람일 때, 학생일 때 쓰던 책상이에요.
    ja: |-
      T.T. STARのメンバーの1人、
      アニスがニケになる前の、
      学校で使っていた机です。
  event_staranis1_06_s_67:
    speaker: maleannouncer
    en: Whoa... that's pretty serious. Isn't that flower what you usually see at funerals?
    ko: |-
      이야… 이건 좀 심한데요.
      국화는 죽은 사람 취급한다는 얘기겠네요.
    ja: |-
      いやぁ…これは壮絶ですね。
      この花は死者に手向けるもののはずです。
  event_staranis1_06_s_68:
    speaker: maleannouncer
    en: This just looks like full-on group bullying...
    ko: 누가 봐도 집단 괴롭힘 현장인데….
    ja: |-
      どう見ても、集団的ないじめとしか
      考えられませんが…
  event_staranis1_06_s_69:
    speaker: maleannouncer
    en: Wait, don't tell me. The one who started this is...?
    ko: 아니 설마. 이 주동자가?
    ja: まさか。この主犯格というのが…？
  event_staranis1_06_s_70:
    speaker: femaleannouncer
    en: 'You guessed it: Yoyo, the chart-topping pop star.'
    ko: 맞아요. 탑 아이돌인 요요죠.
    ja: そう、トップアイドルのヨヨです。
  event_staranis1_06_s_71:
    speaker: maleannouncer
    en: So let me get this straight. Yoyo bullied Anis back in school,
    ko: 잠깐잠깐. 그럼 요요랑 아니스는 학창 시절 때 가해자와 피해자 사이였고.
    ja: |-
      待ってください。
      では、ヨヨとアニスは学生時代から、
      いじめの加害者と被害者という関係で…
  event_staranis1_06_s_72:
    speaker: maleannouncer
    en: and that's still going on now that they're Nikkes?
    ko: 그게 니케가 된 지금까지 이어져 내려오고 있다는 건가요?
    ja: |-
      それが、ニケになった現在でも
      続いているということですか？
  event_staranis1_06_s_73:
    speaker: femaleannouncer
    en: That's the most reasonable way to read it, yes.
    ko: 그렇게 보는 게 타당하겠죠.
    ja: そう考えるのが妥当でしょう。
  event_staranis1_06_s_74:
    speaker: maleannouncer
    en: And this is from a reliable source?
    ko: 신빙성 있는 자료 맞나요?
    ja: この情報、信頼できるものなのでしょうか？
  event_staranis1_06_s_75:
    speaker: femaleannouncer
    en: Of course, we've got verified statements from most of her former classmates.
    ko: 그럼요. 인증을 마친 동창 대부분의 증언도 확보했어요.
    ja: |-
      もちろんです。しっかりと検証を行い、
      多数の同級生から証言を確保しています。
  event_staranis1_06_s_76:
    speaker: femaleannouncer
    en: See the QR code below? You can check out the interviews and related materials
      there.
    ko: |-
      아래 QR코드 보이시죠?
      여기서 인터뷰랑 자료 확인하실 수 있어요.
    ja: |-
      画面の下のQRコードは
      表示されておりますでしょうか？
      こちらから取材記録や資料をご覧いただけます。
  event_staranis1_06_s_77:
    speaker: maleannouncer
    en: Wow, that's pretty brutal... As if bullying her back in school wasn't enough,
      she still kept at it even after Anis became a Nikke.
    ko: 우와… 지독하네요. 학창 시절 때 그렇게 괴롭힌 걸로도 모자라 니케가 된 이후에도 괴롭히고 있네요.
    ja: |-
      しかし…むごいですね。
      学生時代にこんないじめをして、
      ニケになってからも続けているとは。
  event_staranis1_06_s_78:
    speaker: maleannouncer
    en: I mean... with money and fame, messing up someone's life isn't exactly hard,
      right?
    ko: 이것 참. 돈 많고 유명하면 사람 하나 엉망으로 만드는 건 진짜 일도 아니네요.
    ja: |-
      まったく、金や権力があると、
      人ひとりの人生をここまで簡単に
      めちゃくちゃにできてしまうんですね。
  event_staranis1_06_s_79:
    speaker: maleannouncer
    en: But seriously, what would Yoyo even get out of all that?
    ko: 그런데 요요가 뭐가 아쉬워서 그런 짓을 한 걸까요?
    ja: |-
      しかし、ヨヨはなぜ
      こんなことをしたのでしょうか？
  event_staranis1_06_s_80:
    speaker: femaleannouncer
    en: Who knows?
    ko: 글쎄요. 저도 그것까진 모르겠네요.
    ja: |-
      なぜでしょうね。
      そればかりは私にも分かりません。
  event_staranis1_06_s_81:
    speaker: femaleannouncer
    en: People don't always need a reason to be malicious.
    ko: 근데 이 악의라는 게, 딱히 이유가 없기도 하더란 말이죠.
    ja: |-
      ですが、悪意というものには
      確たる理由がない場合もありますから。
  event_staranis1_06_s_82:
    speaker: maleannouncer
    en: Haha, yeah, fair enough. So what's Tetra Line's take on this?
    ko: |-
      하하. 맞는 말입니다.
      테트라 라인 쪽 입장은 어떤가요?
    ja: |-
      ハハ…おっしゃる通りです。
      テトララインの見解はどうでしょう？
  event_staranis1_06_s_83:
    speaker: femaleannouncer
    en: 'Of course, they''re denying it. But here''s where things get interesting:
      we''ve come across some very telling evidence.'
    ko: |-
      당연히 부정하고 있죠.
      근데 여기서 또 재밌는 자료가 확보됐어요.
    ja: |-
      当然、否定のコメントです。
      しかし、こちらにもう一点、
      興味深い資料があります。
  event_staranis1_06_s_84:
    speaker: femaleannouncer
    en: We've confirmed that large sums were deposited into the accounts of the top
      executives behind the ads Yoyo took from T.T. STAR.
    ko: 요요가 T.T. STAR에게서 빼앗은 광고의 최고 책임자들의 통장에 거액의 돈이 꽂힌 걸 확인했어요.
    ja: |-
      問題のCMを担当していた責任者の口座に、
      巨額の振り込みがあったことも
      判明しています。
  event_staranis1_06_s_85:
    speaker: maleannouncer
    en: Wait, don't tell me Tetra Line pulled some strings?
    ko: 설마 테트라 라인에서 꽃아준겁니까?
    ja: まさか、その送金はテトラライン社から？
  event_staranis1_06_s_86:
    speaker: femaleannouncer
    en: Seems that way.
    ko: 예.
    ja: その通りです。
  event_staranis1_06_s_87:
    speaker: maleannouncer
    en: So Tetra knew what Yoyo was up to and even helped her out?
    ko: 요요의 의도를 알고 있었던 것도 모자라, 도와주기까지 했다는 얘기군요.
    ja: |-
      つまり、ヨヨの行為を把握していたどころか、
      後押ししていたようですね。
  event_staranis1_06_s_88:
    speaker: maleannouncer
    en: And you've got credible evidence for that?
    ko: 근데 이거 신빙성 있는 자료입니까?
    ja: ところで、こちらの資料の信憑性は？
  event_staranis1_06_s_89:
    speaker: femaleannouncer
    en: The data comes from Elysion and Missilis's finance teams.
    ko: 엘리시온과 미실리스 재무팀이 제공한 자료예요.
    ja: |-
      エリシオン社、ミシリス社の
      財務チームによる連名の資料です。
  event_staranis1_06_s_90:
    speaker: maleannouncer
    en: Wait, why would they provide that?
    ko: 아니, 다른 회사에서 그걸 왜 제공하죠?
    ja: |-
      待ってください、
      なぜそんなものが別の会社から？
  event_staranis1_06_s_91:
    speaker: femaleannouncer
    en: Well, it's a competitive industry, after all.
    ko: 뭐, 기업 경쟁 시대니까요.
    ja: まあ、企業も激しく争う時代ですから。
  event_staranis1_06_s_92:
    speaker: maleannouncer
    en: Wow, guess nothing stays a secret these days, huh?
    ko: 이야. 이거 뭐 비밀이 없는 사회네요.
    ja: いやはや、世の中隠しごとは出来ませんねぇ。
  event_staranis1_06_s_93:
    speaker: maleannouncer
    en: Folks, better behave yourselves. You never know what might come back to bite
      you.
    ko: |-
      시청자 여러분.
      착하게 사셔야 합니다. 나중에 무슨 일이 벌어질지 몰라요.
    ja: |-
      視聴者の皆さん、
      誠実に暮らしていきましょう。
      あとでどうなるか分かりませんよ？
  event_staranis1_06_s_94:
    speaker: maleannouncer
    en: Anyway, moving on.
    ko: 그럼, 다음 뉴스로 넘어가 볼까요?
    ja: では、次のニュースに移りましょうか？
  event_staranis1_06_s_95:
    speaker: maleannouncer
    en: Elysion's AZX has been delayed by 30 minutes. The cause is... Wow, looks like
      Nikkephobia's still a thing.
    ko: |-
      엘리시온의 AZX가 30분간 연착되는 사고가 발생했습니다.
      원인으로는… 이야 아직까지 니케포비아가 있네요?
    ja: |-
      エリシオン社の運営するAZXに
      30分の遅延が発生する事故、原因は…
      って、まだニケフォビアなんているんですね？
  event_staranis1_06_s_96:
    speaker: "<Narration>"
    en: The TV chatters on in the background, but Anis doesn't hear any of it.
    ko: TV에서 흘러나오는 소리는 귀에 들어오지 않았다.
    ja: それ以上、テレビの音は耳に入ってこなかった
  event_staranis1_06_s_97:
    speaker: "<Narration>"
    en: She turns to Yoyo, who's already staring right at her.
    ko: 아니스는 자신을 바라보고 있는 요요를 바라본다.
    ja: アニスにヨヨの視線が刺さる
  event_staranis1_06_s_98:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_99:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_100:
    speaker: yoyo
    en: You...!
    ko: 너…!
    ja: あなた…！
  event_staranis1_06_s_101:
    speaker: anis_human
    en: Wait, no...
    ko: "…아니야."
    ja: "…違う。"
  event_staranis1_06_s_102:
    speaker: "<Narration>"
    en: Yoyo takes a step back.
    ko: 요요가 뒤로 한걸음 물러선다.
    ja: ヨヨが後ずさりをした
  event_staranis1_06_s_103:
    speaker: yoyo
    en: I already told you... it was a misunderstanding!
    ko: 오해였다고… 했잖아.
    ja: 誤解だって…言ったのに。
  event_staranis1_06_s_104:
    speaker: yoyo
    en: I apologized!
    ko: 미안하다고 했잖아.
    ja: ごめんねって言ったのに。
  event_staranis1_06_s_105:
    speaker: yoyo
    en: What more do you want from me?!
    ko: 사과했잖아!
    ja: きちんと謝ったのに！
  event_staranis1_06_s_106:
    speaker: anis_human
    en: No, seriously, hear me out. We have no idea what's going on...
    ko: |-
      아니라니까. 얘기 좀 들어.
      어떻게 된 일인지 우린 아무것도 몰….
    ja: |-
      違うって。話を聞いてよ。
      どういうことか、私たちにも…
  event_staranis1_06_s_107:
    speaker: yoyo
    en: Whatever happened to crushing me with your skills alone?
    ko: 실력으로 밟아준다고?
    ja: 実力で私を落とすんじゃなかったの？
  event_staranis1_06_s_108:
    speaker: yoyo
    en: Is this what you call skill?
    ko: 이게 네가 말한 실력이야?
    ja: これがあなたの実力ってこと？
  event_staranis1_06_s_109:
    speaker: riss
    en: Hey,
    ko: 너.
    ja: あなたさぁ…
  event_staranis1_06_s_110:
    speaker: riss
    en: stop playing the victim.
    ko: 피해자인 척하지 마.
    ja: 被害者ぶるのはやめなよ。
  event_staranis1_06_s_111:
    speaker: riss
    en: I really don't get why you think you can look at us like that and say those
      things.
    ko: 지금 왜 네가 그런 표정을 짓고 그런 말을 하는지 모르겠어.
    ja: 今さらよくそんな顔ができるよね。
  event_staranis1_06_s_112:
    speaker: riss
    en: None of what they said was wrong. You bullied Anis. You stole our ads.
    ko: |-
      다 맞는 말이잖아.
      아니스 괴롭히고, 광고 빼앗아 간 거 맞잖아.
    ja: |-
      全部本当のことじゃない。
      いじめてたことも、CMを奪ったことも。
  event_staranis1_06_s_113:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_114:
    speaker: riss
    en: Did you seriously think one apology would make it all better? You must live
      a pretty cushy life if so.
    ko: |-
      말 한마디로 다 해결할 수 있을 거라고 생각했어?
      편하게도 산다.
    ja: |-
      一言謝れば何でも許してもらえると思ってる？
      ずいぶん楽な人生送ってるんだね。
  event_staranis1_06_s_115:
    speaker: yoyo
    en: "... Hah."
    ko: "…하."
    ja: "…アハハ…"
  event_staranis1_06_s_116:
    speaker: yoyo
    en: Fine, have it your way.
    ko: 그래. 됐어.
    ja: そう。もういいわ。
  event_staranis1_06_s_117:
    speaker: yoyo
    en: I had fun watching you writhe, so I played with you a little.
    ko: "…시궁창에서 구르는 꼴이 재밌어서 좀 가지고 놀아줬더니."
    ja: |-
      …泥沼でもがいてる様子が面白いから、
      ちょっと遊んでやってただけ。
  event_staranis1_06_s_118:
    speaker: yoyo
    en: I even showed mercy and let you live your little dream, but you got cocky.
    ko: |-
      꿈이라도 꾸게 해 주려고 자비를 베풀었더니.
      주제도 모르고.
    ja: |-
      夢ぐらい見させてあげようと思って
      優しくしてたのに、身の程知らずね。
  event_staranis1_06_s_119:
    speaker: yoyo
    en: All right. I'll deal with you the way I used to. Looks like that's what you
      wanted, anyway.
    ko: |-
      다시 예전처럼 대해줄게.
      너도 그걸 원하는 것 같으니까.
    ja: |-
      また昔と同じようにしてあげる。
      あなたもそれが望みみたいだから。
  event_staranis1_06_s_120:
    speaker: anis_human
    en: "... Heh, some things never change, huh?"
    ko: "…고맙네. 네가 예전 그대로여서."
    ja: |-
      …安心したわ。
      あんたが昔となんにも変わってなくて。
  event_staranis1_06_s_121:
    speaker: "<Narration>"
    en: "*Bzzz, bzzz, bzzz, bzzz*"
    ko: 지잉- 지잉- 지잉- 지잉-
    ja: ブブブ、ブブブ、ブブブ、ブブブ…
  event_staranis1_06_s_122:
    speaker: "<Narration>"
    en: Yoyo picks up her phone.
    ko: 요요가 핸드폰을 집어 든다.
    ja: ヨヨの携帯端末の呼び出しだ
  event_staranis1_06_s_123:
    speaker: yoyo
    en: Hello?
    ko: 여보세요.
    ja: はい、私です。
  event_staranis1_06_s_124:
    speaker: mustang_past_op_l
    en: Where the hell are you?! Get your ass here, right now!
    ko: 너 어디야! 당장 튀어와!
    ja: どこにいる！？今すぐ来い！
  event_staranis1_06_s_125:
    speaker: yoyo
    en: Why are you yelling?
    ko: 왜 소리를 질러요?
    ja: なんで怒ってるんですか？
  event_staranis1_06_s_126:
    speaker: yoyo
    en: I saw it too, but we can sort th—
    ko: 저도 봤어요. 근데 수습할 수 있
    ja: テレビのことなら、収拾は…
  event_staranis1_06_s_127:
    speaker: mustang_past_op_l
    en: Get over here...! Before I go and end you myself!
    ko: 튀어와라…! 찾아가서 죽여버리기 전에…!
    ja: |-
      今すぐと言ったぞ…！
      ぶち殺されたくなきゃ自分から来ることだ…！
  event_staranis1_06_s_128:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_129:
    speaker: yoyo
    en: Understood.
    ko: 알겠어요.
    ja: すぐに向かいます。
  event_staranis1_06_s_130:
    speaker: "<Narration>"
    en: Yoyo breaks into a run,
    ko: 요요가 빠르게 뛰어간다.
    ja: ヨヨが飛ぶように出ていった
  event_staranis1_06_s_131:
    speaker: "<Narration>"
    en: then glances back once and Anis meets her eyes.
    ko: 뒤를 돌아본다. 아니스는 그 눈빛을 본다.
    ja: 去り際に、振り返ってアニスを見た
  event_staranis1_06_s_132:
    speaker: "<Narration>"
    en: It's the same mocking stare
    ko: 비웃는 눈빛.
    ja: 嘲笑を浮かべて
  event_staranis1_06_s_133:
    speaker: "<Narration>"
    en: Anis always sees in her dreams.
    ko: 아니스는 꿈에서 본 눈빛을, 그대로 마주 본다.
    ja: |-
      それはアニスが何度も夢に見る顔と、
      全く同じだった
  event_staranis1_06_s_134:
    speaker: "<Narration>"
    en: After she's gone, the office is left with nothing but the sound of the TV.
    ko: TV 소리만이 사무실을 가득 채웠다.
    ja: テレビの音だけが事務所に響き続けた
  event_staranis1_06_s_135:
    speaker: "<Narration>"
    en: "*Craaash!*"
    ko: 와장창창-!!
    ja: ガシャーン！
  event_staranis1_06_s_136:
    speaker: yoyo
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis1_06_s_137:
    speaker: mustang_past
    en: You useless piece of junk!
    ko: 이런 머저리 같은 고철이!!
    ja: このクソバカ鉄くずが！！
  event_staranis1_06_s_138:
    speaker: mustang_past
    en: You said it was fine! You told me not to worry!
    ko: 괜찮다며! 걱정하지 말라며!
    ja: |-
      大丈夫、心配いらないと
      散々言っておいてこれか！？
  event_staranis1_06_s_139:
    speaker: yoyo
    en: Wh-why are you making such a fuss?! If we just release the audio, it'll all
      be fine...
    ko: |-
      왜, 왜 이래요?
      음성 파일 공개하면 깔끔하게 해결….
    ja: |-
      ど、どうしたんですか？
      あらかじめ用意してあった
      音声ファイルを公開すれば、すぐに…
  event_staranis1_06_s_140:
    speaker: mustang_past
    en: We submitted it, and they flagged it as tampered immediately!
    ko: 제출했는데! 짜깁기 한 거라고 바로 판명 났다!
    ja: |-
      出したさ！だが、つなぎ合わせの
      編集だとあっさりバレやがった！
  event_staranis1_06_s_141:
    speaker: mustang_past
    en: You know why?! Because Elysion and Missilis had their top experts verify every
      second!
    ko: 왜! 엘리시온, 미실리스의 전문가들이 붙어서 판별했으니까!
    ja: |-
      エリシオンとミシリスの
      専門家がしゃしゃり出て来てな！
  event_staranis1_06_s_142:
    speaker: yoyo
    en: Elysion... and Missilis? Why would they...?
    ko: |-
      엘리시온이랑… 미실리스요?
      아니, 왜….
    ja: |-
      エリシオンと…ミシリスの？
      いったい、なんで…
  event_staranis1_06_s_143:
    speaker: mustang_past
    en: How would I know?!
    ko: 그걸 내가 어떻게 알아!
    ja: そんなこと俺が知るか！
  event_staranis1_06_s_144:
    speaker: mustang_past
    en: You absolute moron! Why would you go out of your way to expose yourself like
      that?!
    ko: |-
      이 머저리 같은 놈!
      그러길래 왜 찾아가서 지 정체를 지가 까발리냔 말이다!
    ja: |-
      マヌケが！
      なんでわざわざ自分の正体を
      明かすようなマネをした！？
  event_staranis1_06_s_145:
    speaker: mustang_past
    en: If you were gonna do something that stupid, you might as well have gone on
      air and said it outright!
    ko: 왜! 아예 공식 방송에서도 말하지 그랬냐! 어!?
    ja: |-
      そんなに言いたきゃ最初から堂々と
      放送すりゃ良かったんだ！なあ！？
  event_staranis1_06_s_146:
    speaker: mustang_past
    en: '"Oh, that new pop star? Yeah, she''s just some poor girl I used to bully
      back in school, so be nice to her, everyone!"'
    ko: 아 지금 데뷔한 저 아이돌 제가 어렸을 때 괴롭혔던 불쌍한 애니까 잘 좀 대해주라고!
    ja: |-
      最近デビューしたアイドルは、
      学生の頃にいじめていた
      かわいそうな子で～す、よろしく～ってな！
  event_staranis1_06_s_147:
    speaker: mustang_past
    en: A weakness is something you bury, not something you dig up yourself! What
      the hell is wrong with your head, huh?!
    ko: |-
      약점을 숨겨도 모자랄판에 지가 찾아가서 까?
      머리에 뭐가 들었냐! 엉!?
    ja: |-
      弱みを隠すどころか、なぜ自分で晒す？
      頭に何が入ってんだ！？ええ！？
  event_staranis1_06_s_148:
    speaker: mustang_past
    en: You were ugly as hell, chasing after some stupid fantasy, then you get turned
      into a heap of scrap, and they redid your entire face!
    ko: |-
      엿같이 생겼던 게 이상향만 높아서,
      고철이 되었을 때 얼굴이 싹 다 바뀌었는데!
    ja: |-
      大したルックスでもないくせに
      理想像ばかり立派で、元とは見分けもつかない
      ツラの鉄くずになってただろうが！
  event_staranis1_06_s_149:
    speaker: mustang_past
    en: You got handed a clean slate on a silver platter! You could've started over!
      Instead, you go and show everyone the skeletons in your closet like a damn lunatic!
    ko: |-
      깔끔하게 세탁하고 살 수 있었을 텐데!
      왜 그걸 지가 나서서 떠벌리고 지랄이냔 말이다!!
    ja: |-
      過去をきれいに捨てる機会を！
      なんでわざわざ潰した！？
  event_staranis1_06_s_150:
    speaker: yoyo
    en: B-but... you told me to go over there and start something with them...
    ko: 사, 사장님이 가서 선전포고하고 오라고… 하셨잖아요….
    ja: |-
      しゃ、社長が宣戦布告しに行けって…
      おっしゃった、から…
  event_staranis1_06_s_151:
    speaker: mustang_past
    en: When did I ever do that?!
    ko: 내가 언제!
    ja: そんなこと言ったか！？
  event_staranis1_06_s_152:
    speaker: yoyo
    en: "!"
    ko: "!!"
    ja: "！！"
  event_staranis1_06_s_153:
    speaker: mustang_past
    en: Go on, say it.
    ko: 말해봐.
    ja: 言ってみろ。
  event_staranis1_06_s_154:
    speaker: "<Narration>"
    en: Mustang taps Yoyo on the forehead with his finger. Her head lolls, completely
      limp.
    ko: |-
      머스탱이 요요의 이마를 손가락으로 툭툭 친다.
      요요의 머리가 힘없이 흔들린다.
    ja: |-
      マスタングがヨヨの額を指でつついた。
      ヨヨの髪が力なく揺れる
  event_staranis1_06_s_155:
    speaker: mustang_past
    en: When did I say something like that, huh?
    ko: 내가 언제 그랬는데. 어?
    ja: 俺がいつ言ったかって聞いてんだ。んん？
  event_staranis1_06_s_156:
    speaker: yoyo
    en: I'm... sorry.
    ko: 죄송… 합니다.
    ja: 申し訳…ございません。
  event_staranis1_06_s_157:
    speaker: mustang_past
    en: Argh! Damn it! Damn it!
    ko: 으으아! 젠장! 젠장!
    ja: はああっ！クソッ！クソッ！
  event_staranis1_06_s_158:
    speaker: mustang_past
    en: "*Huff... huff...*"
    ko: "……후우…! 후우…!"
    ja: ふうっ…ふうっ…！
  event_staranis1_06_s_159:
    speaker: yoyo
    en: Is there... no other way?
    ko: 어떻게… 방법이 없을까요…?
    ja: 何か…解決方法は…？
  event_staranis1_06_s_160:
    speaker: mustang_past
    en: Enough, cut it out.
    ko: 됐고. 그만해라.
    ja: もういい。やめろ。
  event_staranis1_06_s_161:
    speaker: yoyo
    en: "... What?"
    ko: "…예?"
    ja: "…え？"
  event_staranis1_06_s_162:
    speaker: mustang_past
    en: I said stop. I don't know how, but now Elysion and Missilis are involved.
    ko: 그만하라고. 왜인지는 모르겠지만 엘리시온이랑 미실리스까지 붙었어.
    ja: |-
      引退しろと言ったんだ。
      なぜかは知らんが、バックに
      エリシオンとミシリスがついてやがる。
  event_staranis1_06_s_163:
    speaker: mustang_past
    en: If this were just rumors, I could've buried it. But it's not, is it?
    ko: 헛소문이면 어떻게든 수습할 수 있겠지만, 사실이잖아.
    ja: |-
      ただのデマならどうとでもできるが、
      事実だからな。
  event_staranis1_06_s_164:
    speaker: mustang_past
    en: You did bully her. You did steal those ads.
    ko: 괴롭힌 거 맞고, 광고 뺏은 거 맞잖아.
    ja: |-
      過去のいじめは事実、
      CMを妨害したのも事実だ。
  event_staranis1_06_s_165:
    speaker: mustang_past
    en: So drop it, I'm not letting Tetra get dragged down with you.
    ko: 그러니까 그만해. 너 커버치다가 우리만 욕먹는다.
    ja: |-
      他にないだろう。
      お前をかばうと、こっちまで叩かれる。
  event_staranis1_06_s_166:
    speaker: yoyo
    en: But we were... in this together, weren't we...?
    ko: 같이… 했잖아요….
    ja: ほとんど…共犯なのに…
  event_staranis1_06_s_167:
    speaker: mustang_past
    en: What are you even talking about?
    ko: 너 지금 무슨 말을 하는 거야.
    ja: ふざけた妄言だな。
  event_staranis1_06_s_168:
    speaker: mustang_past
    en: Tetra Line, the top of the industry, getting involved in some star's petty
      grudge?
    ko: |-
      엔터테인먼트의 선두 주자인 테트라 라인이,
      소속 아이돌의 개인적 원한에 동참했다고?
    ja: |-
      エンターテイメント業界トップの
      テトララインが、所属アイドルの
      個人的な復讐に手を貸した？
  event_staranis1_06_s_169:
    speaker: mustang_past
    en: Did you really think that was gonna happen?
    ko: 진짜 그렇게 생각해?
    ja: そんなことがあると本気で思ってるのか？
  event_staranis1_06_s_170:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_171:
    speaker: yoyo
    en: No... of course not.
    ko: 아니… 요.
    ja: い…いいえ。
  event_staranis1_06_s_172:
    speaker: mustang_past
    en: Exactly. It's all on you, so you're the one taking the fall.
    ko: 그래. 다 네가 한 거니까, 너만 나가면 돼.
    ja: |-
      そうだろう。全部お前がやったことだ。
      お前だけ出て行けば収まる。
  event_staranis1_06_s_173:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_174:
    speaker: yoyo
    en: P-please... just give me one more chance...
    ko: 저… 한번만 더 기회를….
    ja: あの…もう一度だけチャンスを…
  event_staranis1_06_s_175:
    speaker: mustang_past
    en: Get out!
    ko: 나가라고!
    ja: さっさと失せろ！
  event_staranis1_06_s_176:
    speaker: "<Narration>"
    en: "*Craaash!*"
    ko: 와장창창-!!
    ja: ガシャーン！
  event_staranis1_06_s_177:
    speaker: yoyo
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis1_06_s_178:
    speaker: "<Narration>"
    en: Yoyo staggers away, dazed.
    ko: |-
      요요는 넋이 나간 것 같은 표정을 한 채,
      비틀대며 걸어갔다.
    ja: |-
      ヨヨは茫然としたまま、
      おぼつかない足取りで歩き去った
  event_staranis1_06_s_179:
    speaker: "<Narration>"
    en: The door clicks shut behind her, and Mustang slams his fist on the desk.
    ko: 문이 닫히고, 머스탱은 책상을 내리쳤다.
    ja: 扉が閉ざされた後、マスタングは机を叩いた
  event_staranis1_06_s_180:
    speaker: mustang_past
    en: Damn it!
    ko: 젠장…!
    ja: クソッ…！
  event_staranis1_06_s_181:
    speaker: mustang_past
    en: "*Huff... huff...*"
    ko: "…후우…! 후우…!"
    ja: ふぅ…！ふぅ…！
  event_staranis1_06_s_182:
    speaker: mustang_past
    en: Whew...
    ko: 후우…!
    ja: はぁ…！
  event_staranis1_06_s_183:
    speaker: mustang_past
    en: That rust bucket doesn't matter. I can cut her loose anytime.
    ko: |-
      저 고철의 일은 사실상 아무런 문제가 안 돼.
      잘라내면 그만이니까.
    ja: |-
      あの鉄くずの件は、我々と一切関係がない。
      契約解除で済む話だ。
  event_staranis1_06_s_184:
    speaker: mustang_past
    en: The real problem is Elysion and Missilis.
    ko: 문제는 엘리시온이랑 미실리스다.
    ja: 問題は、エリシオンとミシリスの動き…
  event_staranis1_06_s_185:
    speaker: mustang_past
    en: Damn vultures, they actually brought in their finance team for something this
      trivial?
    ko: 망할 놈들이. 재무팀까지 써서 저런 하찮은 자료를 확보해?
    ja: |-
      クソ野郎どもめ。
      金庫番の連中を組ませてまで、
      なぜ三流ゴシップのバックアップなど…？
  event_staranis1_06_s_186:
    speaker: mustang_past
    en: What are they after? Why come after me out of nowhere?
    ko: 무슨 의도냐. 왜 갑자기 나를 공격하는 거지?
    ja: 何を企んでいる。なぜ俺にいきなり牙をむいた？
  event_staranis1_06_s_187:
    speaker: mustang_past
    en: Why get involved in something this insignificant?
    ko: 이런 해프닝 같은 일에 왜 굳이 발을 담그는 거지?
    ja: |-
      この程度のスキャンダルに、
      なんでわざわざ首を突っ込んできた？
  event_staranis1_06_s_188:
    speaker: mustang_past
    en: There's no reason for them to target me in the first place...
    ko: 애초에 나를 공격할 이유가 없을 텐데….
    ja: そもそも、攻撃するメリットが…
  event_staranis1_06_s_189:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_190:
    speaker: mustang_past
    en: Unless...
    ko: 설마….
    ja: まさか…
  event_staranis1_06_s_191:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_192:
    speaker: "<Narration>"
    en: Hanson watches the news story playing on a massive TV.
    ko: 한슨은 대형 TV에서 흘러나오고 있는 요요의 뉴스를 본다.
    ja: |-
      ハンソンの目は大型テレビから流れる、
      ヨヨのスキャンダル報道を
      注意深く見つめていた
  event_staranis1_06_s_193:
    speaker: elysionline0_op_l
    en: We've taken a keen interest in why Tetra Line hasn't collapsed.
    ko: 테트라 라인이 왜 망하지 않았는지에 대해 우리도 관심이 많았다.
    ja: |-
      テトララインがなぜ崩れないかは、
      我々も大いに興味がある。
  event_staranis1_06_s_194:
    speaker: elysionline0_op_l
    en: Mustang is... something of an anomaly.
    ko: 머스탱은 뭐랄까.
    ja: あのCEOは…何というべきか。
  event_staranis1_06_s_195:
    speaker: missilisline0_op_r
    en: Go on, say it. He's a total screw-up. No need to sugarcoat it.
    ko: 개망나니라고 얘기해. 뭘 말을 가리고 있어.
    ja: |-
      ろくでなし以外ないですね。
      今さら遠慮もいらないでしょう。
  event_staranis1_06_s_196:
    speaker: elysionline0_op_l
    en: Well, yes, there's no better way to put it.
    ko: 뭐, 그래. 그것만 한 호칭이 없지.
    ja: まあ、そうだな。それ以外に呼びようもない。
  event_staranis1_06_s_197:
    speaker: elysionline0_op_l
    en: He may be the CEO of one of the Big Three, with strong ties to the Central
      Government and V.T.C...
    ko: 3대 회사의 CEO고, 중앙 정부 및 V.T.C.에 막대한 연줄이 있다고는 하지만.
    ja: |-
      三大企業のCEOであり、
      中央政府とV.T.C.に強力な人脈を持つ、
      とはいうが…
  event_staranis1_06_s_198:
    speaker: elysionline0_op_l
    en: But I've always wondered how Tetra hasn't collapsed, considering he behaves
      like a rabid dog.
    ko: 그렇게까지 광견 마냥 날뛰는데도 테트라 라인이 망하지 않은 이유가 항상 궁금했다.
    ja: |-
      あれほど好き放題に暴れても
      テトララインが崩壊しない理由は
      常々気になっていた。
  event_staranis1_06_s_199:
    speaker: missilisline0_op_r
    en: And he's got a pretty good public image, too.
    ko: 외적으로 이미지도 좋고 말이야.
    ja: 外向きのイメージも良好ですしねぇ。
  event_staranis1_06_s_200:
    speaker: elysionline0_op_l
    en: So it was you behind all of this.
    ko: 그 배후에 네가 있다는 것을 알았다.
    ja: 支えていたのがお前だったことは分かっている。
  event_staranis1_06_s_201:
    speaker: elysionline0_op_l
    en: I assumed you were just there to fill a chair, but you've been quite skilled
      at working things from the shadows.
    ko: 그냥 대충 앉혀놓은 이사인 줄 알았더니 굉장히 능숙하게 뒷공작을 해왔더군.
    ja: |-
      理事の席に座らされているだけの
      お飾りと思っていたが、
      裏工作もそうとう手際がいいようだな。
  event_staranis1_06_s_202:
    speaker: elysionline0_op_l
    en: It's no exaggeration to say Tetra has you to thank for surviving this long.
    ko: 테트라를 지금까지 유지해 놓은 건 네 덕이라 봐도 과언이 아니겠지.
    ja: |-
      テトラが今まで持っていたのは、
      お前のおかげと言っても
      過言ではなかろう。
  event_staranis1_06_s_203:
    speaker: hanson
    en: You flatter me.
    ko: 과찬이십니다.
    ja: 身に余るお言葉です。
  event_staranis1_06_s_204:
    speaker: elysionline0_op_l
    en: I don't make a habit of saying this, but I've always been curious about you.
    ko: 이렇게 얘기하는 건 처음이지만, 우린 너라는 인간이 항상 궁금했다.
    ja: |-
      直接の連絡は初めてだが、
      我々はお前の存在を長らく
      気に留めていた。
  event_staranis1_06_s_205:
    speaker: elysionline0_op_l
    en: So when you requested a secure line, we came...
    ko: 그 한슨이 비밀 회선으로 얘기하자고 해서 와봤더니
    ja: |-
      そのハンソン本人から
      秘密回線での話があると言うものだから、
      何ごとかと思えば…
  event_staranis1_06_s_206:
    speaker: elysionline0_op_l
    en: And all you have is this? A complete waste of our time.
    ko: 들을 가치도 없는 하찮은 이야기를 하는군.
    ja: じつに聞く価値のない、くだらない話だ。
  event_staranis1_06_s_207:
    speaker: missilisline0_op_r
    en: That's cute, you actually thought we'd stick our noses into that pop star
      nonsense?
    ko: |-
      그러게.
      그런 아이돌 놀이에 우리가 발을 얹을 거라고 생각했나?
    ja: |-
      まったくです。
      アイドルなんて人形遊び、
      我々がいちいち関わると思いましたか？
  event_staranis1_06_s_208:
    speaker: hanson
    en: I know you both dislike Mustang.
    ko: 두 분은 머스탱을 싫어하시니까요.
    ja: マスタングはそうとう嫌われているようですね。
  event_staranis1_06_s_209:
    speaker: missilisline0_op_r
    en: Yeah, we're not exactly fans.
    ko: 머스탱이 마음에 들지 않은 건 사실이야.
    ja: 当たり前のことだと思いますが。
  event_staranis1_06_s_210:
    speaker: missilisline0_op_r
    en: He got lucky discovering a single pop star, Tetra's stock shot up, and now
      he's insufferably smug.
    ko: 운 좋게 아이돌 하나를 주워서 주가를 끌어올린 주제에, 잘난 척을 너무 해대니까.
    ja: |-
      たまたま拾ったアイドルが
      大当たりだったというだけで、
      勘違いをしてしまったようですからね。
  event_staranis1_06_s_211:
    speaker: missilisline0_op_r
    en: But that's a separate issue. Why should Missilis or Elysion bother digging
      up Tetra's dirty laundry?
    ko: 그런데 그것과는 별개로, 왜 미실리스와 엘리시온이 테트라의 비리 자료를 확보해야 하지?
    ja: |-
      それはそれとして、ミシリスとエリシオンが
      テトラの不正を暴くべき理由を
      聞かせてもらいましょうか？
  event_staranis1_06_s_212:
    speaker: missilisline0_op_r
    en: No need to make a corporate drama out of this.
    ko: 기업 수준에서 시비를 걸 필요까진 없어.
    ja: 企業間の揉め事を敢えて起こせという理由を。
  event_staranis1_06_s_213:
    speaker: elysionline0_op_l
    en: Besides, the data is insignificant. Any private investigator could have gotten
      it in a day.
    ko: 그리고 자료가 너무 적다. 흥신소만 써도 충분히 확보할 수 있는 자료지.
    ja: |-
      それに、素材が弱すぎる。
      この程度、探偵を使えば分かる程度のものだ。
  event_staranis1_06_s_214:
    speaker: elysionline0_op_l
    en: So there's absolutely no reason for us to waste our time on it.
    ko: 굳이 우리가 그 자료를 확보해야 할 이유가 없다.
    ja: わざわざ我々が手を動かす必要を感じないな。
  event_staranis1_06_s_215:
    speaker: hanson
    en: It'd carry much more weight coming from you than from some no-name detective
      agency.
    ko: 엘리시온과 미실리스가 그 비리 자료를 확보해서 공식적으로 유포한다면, 공신력 측면에서 흥신소 따위와는 비교도 되지 않습니다.
    ja: |-
      エリシオンとミシリス連名の
      公式発表となれば、
      信頼度は一介の探偵と比較になりません。
  event_staranis1_06_s_216:
    speaker: hanson
    en: Besides,
    ko: 그리고.
    ja: それに…
  event_staranis1_06_s_217:
    speaker: hanson
    en: it could give the impression that you're targeting Tetra Line.
    ko: 테트라 라인을 공격한다는 인상을 줄 수 있습니다.
    ja: テトララインを牽制することができます。
  event_staranis1_06_s_218:
    speaker: missilisline0_op_r
    en: So why exactly are we going after Tetra?
    ko: 그러니까 우리가 왜 테트라를 공격해야 하지?
    ja: |-
      ですから、我々がわざわざそうする
      理由を聞いているのです。
  event_staranis1_06_s_219:
    speaker: elysionline0_op_l
    en: Do you really think two companies of our scale would act on your personal
      feelings? You're still a child.
    ko: |-
      네 개인적인 감정에 두 회사가 움직일 거라 생각하나?
      아직 어리군그래.
    ja: |-
      お前の個人的な感情で、
      大企業の双角が動くと思ったか？
      まだまだ青二才だったようだな。
  event_staranis1_06_s_220:
    speaker: hanson
    en: See if you can bribe Mustang's personal physician.
    ko: 머스탱의 주치의를 매수해 보십시오.
    ja: |-
      マスタングの主治医に、
      鼻薬をかがせてみれば分かります。
  event_staranis1_06_s_221:
    speaker: elysionline0_op_l
    en: "... His personal physician?"
    ko: 주치의를…?
    ja: 主治医…？
  event_staranis1_06_s_222:
    speaker: missilisline0_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_223:
    speaker: hanson
    en: After that, you may each decide whether to assist me.
    ko: 그 이후, 각자 판단하신 후에 저를 도와줄지 말지를 결정해 주시면 됩니다.
    ja: |-
      私に協力するかどうかは、
      その後に決めてくだされば結構です。
  event_staranis1_06_s_224:
    speaker: hanson
    en: I'm confident you'll find it worthwhile.
    ko: 마음에는 드실 거라 확신합니다.
    ja: |-
      きっと気に入っていただけるものと
      確信しております。
  event_staranis1_06_s_225:
    speaker: hanson
    en: Honestly, it's not exactly profitable for me, but think of it as an investment
      in what comes next.
    ko: |-
      솔직히 제 입장에서는 수지가 맞지 않습니다만,
      나중을 위한 포석인 셈 치겠습니다.
    ja: |-
      正直なところ、私個人としては
      割に合いません。ですが、
      未来のために必要なことと覚悟しています。
  event_staranis1_06_s_226:
    speaker: elysionline0_op_l
    en: "... I've got a rough idea of what you're getting at."
    ko: "…대충 어떤 그림인지 짐작이 가는데."
    ja: "…言いたいことはおおむね見当がついた。"
  event_staranis1_06_s_227:
    speaker: elysionline0_op_l
    en: Fine. If your information proves worthwhile, we'll assist.
    ko: 좋다. 네가 제공한 정보가 정말 가치가 있다면 돕겠다.
    ja: |-
      いいだろう。お前の提供する情報に
      価値がある限りは協力する。
  event_staranis1_06_s_228:
    speaker: elysionline0_op_l
    en: After all, good intel comes at a price.
    ko: 제대로 된 정보는 값을 치러야 하니까.
    ja: |-
      有用な情報には、
      相応の値段というものがあるからな。
  event_staranis1_06_s_229:
    speaker: missilisline0_op_r
    en: All right, we'll review it, then decide.
    ko: 좋아. 미실리스도 검토 후에 결정할게.
    ja: |-
      そうですね。
      ミシリスも検討の後、回答を送ります。
  event_staranis1_06_s_230:
    speaker: hanson
    en: Understood, I'd appreciate your help.
    ko: 예. 부탁드리겠습니다.
    ja: はい。お願いいたします。
  event_staranis1_06_s_231:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_232:
    speaker: "<Narration>"
    en: Hanson pulls out his phone and logs into an online forum.
    ko: 한슨은 핸드폰을 들어 아이돌 카페에 접속한다.
    ja: |-
      ハンソンは携帯端末を手に取り、
      アイドル掲示板の様子をうかがった
  event_staranis1_06_s_233:
    speaker: "<Narration>"
    en: 'Title: I knew Yoyo would pull something like this'
    ko: '제목 : 요요 내가 이럴 줄 알았다'
    ja: タイトル：ヨヨはこうなると思ってた
  event_staranis1_06_s_234:
    speaker: "<Narration>"
    en: 'Title: Yoyo is seriously vicious'
    ko: '제목 : 요요가 진짜 악랄한 게'
    ja: タイトル：ヨヨって本当にひどいな
  event_staranis1_06_s_235:
    speaker: "<Narration>"
    en: 'Title: You really can''t judge people by their appearances'
    ko: '제목 : 사람 진짜 겉만 보고는 모르네'
    ja: タイトル：人は見かけじゃ分からないものだな
  event_staranis1_06_s_236:
    speaker: "<Narration>"
    en: 'Title: Anis must be having a rough time'
    ko: '제목 : 아니스는 진짜 살맛 안 나겠네'
    ja: タイトル：アニス、すごくつらかっただろうな
  event_staranis1_06_s_237:
    speaker: "<Narration>"
    en: 'Title: She''s still gets bullied even after dying, WTF'
    ko: '제목 : 말 그대로 죽고 나서도 괴롭힘ㄷㄷ'
    ja: タイトル：死んでからもいじめが続くってw
  event_staranis1_06_s_238:
    speaker: "<Narration>"
    en: 'Title: How did they even endure all that?'
    ko: '제목 : 와 얘들 어떻게 버텼냐 진짜'
    ja: タイトル：マジどうやって耐えたんだ
  event_staranis1_06_s_239:
    speaker: "<Narration>"
    en: Then he checks the indie charts.
    ko: 아이돌 마이너 차트를 확인한다.
    ja: ランキングを確かめた
  event_staranis1_06_s_240:
    speaker: "<Narration>"
    en: 13th place.
    ko: 13위다.
    ja: 13位に上昇していた
  event_staranis1_06_s_241:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_s_242:
    speaker: hanson
    en: Fine, I hate to admit it, but you were right.
    ko: 그래. 인정하긴 싫지만 당신의 말이 맞아.
    ja: 認めたくないが、あなたの言う通りだ。
  event_staranis1_06_s_243:
    speaker: hanson
    en: I suppose there's a part of me that enjoys watching others suffer.
    ko: 타인의 괴로움은, 나의 즐거움이군.
    ja: 他人の不幸は蜜の味、か。
  event_staranis1_06_s_244:
    speaker: mustang_past
    en: Heh... haha.
    ko: "…흐. 하하."
    ja: "…フフフ、ハハハハ…"
  event_staranis1_06_s_245:
    speaker: mustang_past
    en: So it was you, Hanson.
    ko: 그래. 한슨. 네놈이군.
    ja: そうか、ハンソン。お前か。
  event_staranis1_06_s_246:
    speaker: mustang_past
    en: No idea how you got those idiots wrapped around your finger, but this just
      got interesting.
    ko: 어떻게 그것들을 구워삶았는지는 모르겠지만, 재밌어.
    ja: どうやって動かしたかは分からんが、面白い。
  event_staranis1_06_s_247:
    speaker: mustang_past
