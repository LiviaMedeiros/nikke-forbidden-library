    en: Allez, sign it.
    ko: Sign 해주세Yo.
    ja: Signをお願いできますNE。
  event_staranis1_06_e_78:
    speaker: mustang_past
    en: Come with me, and you will become the pop star to carry on Pretty's legacy.
