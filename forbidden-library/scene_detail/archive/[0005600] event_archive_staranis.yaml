    en: Legal? If you say so.
    ko: 합법적이요? 세상에나.
    ja: 合法的？冗談でしょう。
  event_staranis1_04_s_83:
    speaker: mustang_past
    en: It would've been a shame to let good talent rot in some tiny agency, so I
      scouted them.
    ko: 좋은 인재들이 작은 사무실에서 썩는 게 아까워서 스카우트하고,
    ja: |-
      弱小事務所に飼い殺されてる
      いい人材を気の毒に思って
      ヘッドハントしてやっただけだ。
  event_staranis1_04_s_84:
    speaker: mustang_past
    en: Then I spotted a promising group of pop stars and asked a few of my connections
      to give them a little push.
    ko: 좋은 아이돌 그룹이 있어서 연줄을 통해 팍팍 밀어달라고 부탁한 게
    ja: |-
      後はいいアイドルグループがいるから
      応援してやってくれと言って回ったりな。
  event_staranis1_04_s_85:
