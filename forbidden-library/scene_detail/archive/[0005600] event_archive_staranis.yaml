    ko: "…응. 고마워."
    ja: "…うん、ありがと。"
  event_staranis1_06_e_12:
    speaker: mint
    en: But after that, we really didn't get much work, did we?
    ko: 그런데 그 일 이후로 우리 일이 엄청 줄었지?
    ja: |-
