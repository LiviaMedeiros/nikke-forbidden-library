    en: The condition is that all members of T.T. STAR have to agree.
    ko: 조건은, T.T. STAR 전원의 동의가 있을 것.
    ja: 契約条件は、T.T. STAR全員の同意…
  event_staranis1_06_e_86:
    speaker: riss
    en: If even one person disagrees, the succession will be void.
    ko: 한 명이라도 동의하지 않을 경우, 고용 승계는 무효.
    ja: 1人でも同意していない場合、この条項は無効。
  event_staranis1_06_e_87:
    speaker: anis_human
    en: "... What's that supposed to mean?"
    ko: 무슨… 말이야?
    ja: どういう…こと？
  event_staranis1_06_e_88:
    speaker: mint
    en: If the three of us sign here, Boss and Riss will come along too, with their
      roles staying exactly the same.
    ko: 우리 셋이 여기에 사인하면 사장님이랑 리스도 같이 간다는 얘기야. 직급은 그대로 유지된 채.
    ja: |-
      私たち3人全員がここにサインすれば、
      社長とリスも一緒に行けるってことみたいね。
      役職もそのままで。
  event_staranis1_06_e_89:
    speaker: prika
    en: And if even one of us doesn't sign, the whole thing's off.
    ko: 셋 중 하나라도 사인하지 않으면 무산된다는 얘기고.
    ja: |-
      ただし3人のうち1人でも
      サインしなかったら、
      この条件はなかったことになる、か。
  event_staranis1_06_e_90:
    speaker: anis_human
    en: So we either all go, or none of us do.
    ko: "…같이 가거나, 같이 안 가거나 둘 중 하나라는 얘기네."
    ja: |-
      …一緒に行くか、行かないか、
      選べってことね。
  event_staranis1_06_e_91:
    speaker: anis_human
    en: And we're calling the shots.
    ko: 그 선택권이 우리한테 있는 거고.
    ja: それを私たちが決めていいってこと。
  event_staranis1_06_e_92:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_93:
    speaker: anis_human
    en: Wait, hold on... If our boss goes to Tetra, does that make him the boss over
      there?
    ko: 응? 그럼 우리 사장님이 테트라로 가면 테트라 사장님이 되는 건가요?
    ja: |-
      あれ？てことは、社長がテトラに行ったら
      テトラの社長になるってこと？
  event_staranis1_06_e_94:
    speaker: mustang_past
    en: You may not be aware of this, mes chéris...
    ko: 한슨은, Hm… 알고 계실지 모르겠지Man.
    ja: |-
      ハンソンは、Hm…知っているか
      分かりませんGA。
  event_staranis1_06_e_95:
    speaker: mustang_past
    en: Hanson was once a member of Tetra's board.
    ko: 테트라의 이사 자리에 있던 Man입니Da.
    ja: かつてはテトラの理事だったのでSU。
  event_staranis1_06_e_96:
    speaker: mustang_past
    en: So naturally, he'll be returning to that position, bien sûr.
    ko: 당연히, 원복 되겠지Yo.
    ja: そこに戻ることになりますNE。
  event_staranis1_06_e_97:
    speaker: anis_human
    en: Boss... back as a director at some big-name company...?
    ko: "…사장님이… 대기업 이사로 다시…."
    ja: "…社長も…また大企業の理事に…"
  event_staranis1_06_e_98:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_99:
    speaker: mustang_past
    en: I'll be frank.
    ko: 솔직히 말하겠습니Da.
    ja: ストレートに言いまSHOW。
  event_staranis1_06_e_100:
    speaker: mustang_past
    en: This place is wasting your talent, vraiment.
    ko: 이 Office는 You들의 재능을 썩히고 있습니Da.
    ja: |-
      この事務所ではYouたちの才能が
      飼い殺しになっていまSU。
  event_staranis1_06_e_101:
    speaker: mustang_past
    en: You should be flying under Tetra's banner, not wasting away in a second-rate
      office, non?
    ko: 테트라의 Wing 아래에서 훨훨 Fly해야 하Jyo.
    ja: |-
      テトラのWingの下で、
      のびのびとFlyするべきDESU。
  event_staranis1_06_e_102:
    speaker: mustang_past
    en: Let's be honest, aside from T.T. STAR, this office has nothing going for it,
      n'est-ce pas?
    ko: 그래요. T.T. STAR 말고는 별 볼 일 없는 Office입니다.
    ja: |-
      実際、T.T. STAR以外は
      この事務所に見るべきものもありまSEN。
  event_staranis1_06_e_103:
    speaker: mustang_past
    en: And yet, we're prepared to bring your boss and manager along. Généreux, wouldn't
      you say?
    ko: 그럼에도 사장과 매니저 All을 고용승계 한다는 말은
    ja: |-
      それでも、社長とマネージャーまで
      まるごと引き受けさせてもらいMASU。
  event_staranis1_06_e_104:
    speaker: mustang_past
    en: That's how much we want you, compris?
    ko: 테트라가 그만큼 T.T. STAR를 Want하고 있다고 Understand해주시면 좋겠군Yo.
    ja: |-
      それだけテトラがT.T. STARを
      高く買っていると分かってもらえれば
      うれしいですNE。
  event_staranis1_06_e_105:
    speaker: mustang_past
    en: So, sign.
    ko: Sign해주세Yo.
    ja: Sign、お願いしますYO。
  event_staranis1_06_e_106:
    speaker: mustang_past
    en: You'll remain ensemble, just as you are now.
    ko: 그럼 T.T. STAR는 물론, 사장, 매니저와 계속 Together 할 수 있습니Da.
    ja: |-
      そうすればT.T. STARの仲間はもちろん、
      社長とマネージャーとも
      ずっとTogetherでやっていけまSU。
  event_staranis1_06_e_107:
    speaker: mustang_past
    en: Only this time, with the backing of Tetra Line, bien sûr.
    ko: |-
      최고의 Entertainment Company.
      테트라 라인의 Support를 받으면Seo.
    ja: |-
      しかも最高のEntertainment Company…
      テトララインのSupportのもとDE。
  event_staranis1_06_e_108:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_109:
    speaker: mint
    en: There's something I'd like to ask.
    ko: 한 가지 궁금한 게 있는데요.
    ja: 1つ、おうかがいしたいことが有ります。
  event_staranis1_06_e_110:
    speaker: mustang_past
    en: Go on, I'm all ears, ma chérie.
    ko: Yes. Talk해 주세Yo.
    ja: Yes. 何でも聞いてくだSAI。
  event_staranis1_06_e_111:
    speaker: mint
    en: I might be overthinking it, but it's felt like Tetra Line's been targeting
      us.
    ko: |-
      과장된 생각일지도 모르는데,
      테트라 라인이 우릴 괴롭힌다고 생각했어요.
    ja: |-
      考えすぎかもしれませんが、
      私たちはテトララインに嫌がらせを
      されていると思っていました。
  event_staranis1_06_e_112:
    speaker: mint
    en: Packing our schedule tighter and tighter, and taking away our ad deals.
    ko: 스케줄을 강제로 밀어 넣고, 광고를 빼앗아 가고.
    ja: |-
      仕事の依頼がなぜか急に増えたり、
      CMの案件を取られたり。
  event_staranis1_06_e_113:
    speaker: mint
    en: Would you mind explaining that?
    ko: 이것에 관해 설명해 주실 수 있나요?
    ja: きちんと説明していただけますか？
  event_staranis1_06_e_114:
    speaker: mint
    en: And if you don't mind my asking, why did our boss leave Tetra Line in the
      first place?
    ko: 그리고, 우리 사장님이 무슨 이유로 테트라 라인에서 나오게 됐는지도요.
    ja: |-
      それと、うちの社長が
      テトララインを出ていった理由も。
  event_staranis1_06_e_115:
    speaker: mustang_past
    en: Hm...
    ko: Hm….
    ja: Hm…
  event_staranis1_06_e_116:
    speaker: mustang_past
    en: Perceptive, très perceptive. I like you already.
    ko: 예리하군Yo. 더더욱 Mind에 들어Yo.
    ja: |-
      鋭いですNE。
      ますます気に入りましTA。
  event_staranis1_06_e_117:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_118:
    speaker: mustang_past
    en: Oui. If I'm bringing in a future superstar, I'll have to make it worth their
      while too, d'accord?
    ko: |-
      Yes. 미래의 Big Star를 데려오기 위해선,
      Me도 많은 것을 Give해야 겠지Yo.
    ja: |-
      Yes。未来のBig Starを迎え入れるには、
      MeもしっかりとGiveするべきですNE。
  event_staranis1_06_e_119:
    speaker: "<Narration>"
    en: Mustang turns around as the aides make their way out the door.
    ko: |-
      머스탱이 뒤를 돌아본다.
      수행원들이 문밖으로 나간다.
    ja: |-
      マスタングが振り返ると、
      お付きの者たちは扉の外へ出ていった
  event_staranis1_06_e_120:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_121:
    speaker: mustang_past
    en: Hanson is my fils.
    ko: 한슨은 제 Son입니Da.
    ja: ハンソンは…私のSonなのDESU。
  event_staranis1_06_e_122:
    speaker: anis_human
    en: What... did you just say?
    ko: 뭐… 라고요?
    ja: え…息子？
  event_staranis1_06_e_123:
    speaker: mustang_past
    en: Oui, he's my son.
    ko: Yes. My Son입니Da.
    ja: Yes。その通りDESU。
  event_staranis1_06_e_124:
    speaker: "<Narration>"
    en: Mustang lets out a deep sigh, then speaks in a low, measured voice.
    ko: |-
      머스탱은 깊은 한숨을 내쉰 뒤,
      차분히 가라앉은 톤으로 입을 열었다.
    ja: |-
      マスタングは深いため息をつくと、
      人が変わったように
      落ち着いた口調で語り始めた
  event_staranis1_06_e_125:
    speaker: mustang_past
    en: I devoted everything to entertainment
    ko: "…엔터테인먼트에 모든 걸 바친 저는."
    ja: "…私はエンターテイメントに全てを捧げ…"
  event_staranis1_06_e_126:
    speaker: mustang_past
    en: and neglected my family in the process.
    ko: 가정에 소홀했습니다.
    ja: 家庭をおろそかにしてしまいました。
  event_staranis1_06_e_127:
    speaker: mustang_past
    en: I never grew close to my son. After my wife passed away from illness, the
      distance between us only grew.
    ko: |-
      아들인 한슨과 친해질 기회는 없었고,
      아내가 병으로 사망한 이후에 사이는 더더욱 멀어졌죠.
    ja: |-
      息子であるハンソンとは折り合いが悪く、
      妻を病気で亡くしてからは
      険悪になる一方でした。
  event_staranis1_06_e_128:
    speaker: mustang_past
    en: I wanted to close that distance since he's my family, my son.
    ko: |-
      저는 한슨과 가까워지고 싶었습니다.
      가족이고, 아들이었으니까요.
    ja: |-
      私はハンソンとの距離を縮めたかった。
      家族であり、息子ですから。
  event_staranis1_06_e_129:
    speaker: mustang_past
    en: So I gave him a seat on Tetra's board and had him learn the ropes.
    ko: 그래서 테트라의 이사 자리에 앉히고, 일을 배우게 했습니다.
    ja: |-
      そのためにテトラの理事に就けて、
      仕事を学ばせようとしました。
  event_staranis1_06_e_130:
    speaker: mustang_past
    en: I thought working together might repair what had already broken...
    ko: 함께 일을 하며 벌어졌던 부자 관계를 메우고, 또.
    ja: |-
      一緒に働き続ければ、
      分かり合えることも増えると考え…
  event_staranis1_06_e_131:
    speaker: mustang_past
    en: And that he might one day succeed me.
    ko: 한슨이 테트라를 이어주길 바라면서.
    ja: |-
      いつかハンソンが、
      テトラを継いでくれることを願っていました。
  event_staranis1_06_e_132:
    speaker: mustang_past
    en: But Hanson resented me.
    ko: 하지만 한슨은 저를 원망하고 있었습니다.
    ja: しかしハンソンは、私を憎んでいました。
  event_staranis1_06_e_133:
    speaker: mustang_past
    en: To him, it was much too late.
    ko: 가정에 소홀했던 주제에, 왜 이제 와서 친한 척이냐… 같은 뉘앙스였죠.
    ja: |-
      家庭を顧みなかったくせに、
      今さら父親面するな…
      そういうことだったのでしょう。
  event_staranis1_06_e_134:
    speaker: mustang_past
    en: I didn't know how to be a father, so I treated him the only way I knew how—harshly.
    ko: |-
      저는 아들을 대하는 법을 잘 몰랐습니다.
      그래서 더욱 거칠게 대했죠.
    ja: |-
      私は息子にどう接すればいいのか分からず、
      厳しくしてしまいました。
  event_staranis1_06_e_135:
    speaker: mustang_past
    en: But that only drove him further away, until all that remained between us was
      a distance neither of us could cross.
    ko: |-
      그러다 보니 한슨과의 거리는 점점 더 멀어지고,
      끝내 메울 수 없는 감정의 깊은 골만 생겨났죠.
    ja: |-
      溝は深まる一方になり、
      とうとう埋められないほどに
      なってしまいました。
  event_staranis1_06_e_136:
    speaker: mustang_past
    en: Then I pushed harder, and he grew tired of it.
    ko: 저는 더 밀어붙였고, 한슨은 지쳤습니다.
    ja: |-
      それでも私が厳しく当たり続けたせいで、
      ハンソンは疲れ切ってしまいました。
  event_staranis1_06_e_137:
    speaker: mustang_past
    en: "... Eventually, he left the company, and I heard he's producing you now."
    ko: |-
      …회사를 나갔죠.
      여러분을 키운다고 전해 들었습니다.
    ja: |-
      …そしてついに、出て行ってしまったのです。
      皆さんを育てるつもりだと聞いていました。
  event_staranis1_06_e_138:
    speaker: mustang_past
    en: So, I'll be honest.
    ko: 예. 그래요. 솔직히 말씀드리겠습니다.
    ja: |-
      お分かりかと思いますが、そうです。
      正直にお話しします。
  event_staranis1_06_e_139:
    speaker: mustang_past
    en: I believed that if I made Hanson suffer, he would return to Tetra.
    ko: 한슨을 괴롭히면 다시 테트라로 돌아올 것이라 생각했습니다.
    ja: |-
      ハンソンを苦しい目に合わせれば、
      きっと戻ってくると考えていました。
  event_staranis1_06_e_140:
    speaker: mustang_past
    en: For what you went through as a result, you have my sincere apologies.
    ko: 그로 인해 여러분이 겪었던 일은 진심으로 죄송하게 생각합니다.
    ja: |-
      そのせいで皆さんに
      苦しい思いをさせてしまったことは、
      心からお詫びします。
  event_staranis1_06_e_141:
    speaker: mustang_past
    en: As for Yoyo, her actions are entirely her own, and she'll be dealt with accordingly.
    ko: |-
      요요의 일은 저희와 무관합니다.
      그녀는 처벌받을 겁니다.
    ja: |-
      ヨヨの件は私の
      あずかり知らぬところで起こりました。
      彼女は報いを受けることになるでしょう。
  event_staranis1_06_e_142:
    speaker: mustang_past
    en: I'm aware this offers little comfort. Still, I hope it offers some.
    ko: 큰 위로가 되진 않겠지만, 조금의 위로라도 되길 바랍니다.
    ja: |-
      大した慰めにはならないと思いますが、
      少しでも気分が晴れれば幸いです。
  event_staranis1_06_e_143:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_144:
    speaker: mustang_past
    en: I want to reconcile with Hanson.
    ko: 저는 한슨과 화해하고 싶습니다.
    ja: 私はハンソンに、帰ってきて欲しいのです。
  event_staranis1_06_e_145:
    speaker: mustang_past
    en: I'm aware there were flaws in the way I handled things, but I don't know how
      to correct them.
    ko: |-
      지금까지의 제 방식에 문제가 있다는 건 압니다.
      하지만 방법을 모르겠어요.
    ja: |-
      今までの私のやり方が
      間違っていたことは分かっています。
      ですが、どうすればいいのか分かりません。
  event_staranis1_06_e_146:
    speaker: mustang_past
    en: That's why I'm asking you to act as the bridge between us.
    ko: 여러분이 그 다리가 되어주길 바랍니다.
    ja: |-
      皆さんはその橋渡しに
      なってくれるかも知れない。
  event_staranis1_06_e_147:
    speaker: mustang_past
    en: You have the talent to become top stars. That much is undeniable.
    ko: 물론, 여러분이 톱스타의 재능을 타고난 것도 사실입니다.
    ja: |-
      もちろん、皆さんにトップスターとしての
      素質があることも事実です。
  event_staranis1_06_e_148:
    speaker: mustang_past
    en: By helping Hanson guide you into carrying on Pretty's legacy,
    ko: 저는 한슨을 도와 여러분을 프리티를 잇는 최고의 아이돌로 만드는 것으로.
    ja: |-
      今後はハンソンを助け、
      皆さんをプリティーの後を継ぐ
      最高のアイドルにすることで…
  event_staranis1_06_e_149:
    speaker: mustang_past
    en: I intend to apologize
    ko: 한슨에게 사과하고.
    ja: 今までの埋め合わせをして…
  event_staranis1_06_e_150:
    speaker: mustang_past
    en: and make amends with him.
    ko: 다시 화해하고 싶습니다.
    ja: ハンソンとの関係を取り戻したいのです。
  event_staranis1_06_e_151:
    speaker: mustang_past
    en: I don't want to be remembered as a disgrace of a father. I would prefer to
      be a proper one.
    ko: 못난 아버지가 아니라, 제대로 된 아버지로 남고 싶습니다.
    ja: |-
      不出来な父親ではなく、
      まともな父親として、
      息子の記憶に残りたいのです。
  event_staranis1_06_e_152:
    speaker: mustang_past
    en: This is my request.
    ko: 부탁입니다.
    ja: お願いします。
  event_staranis1_06_e_153:
    speaker: mustang_past
    en: Help us... no, help me.
    ko: 우릴, 아니 저를 도와주십시오.
    ja: |-
      私たちに…いや、私に、
      どうか力を貸してください。
  event_staranis1_06_e_154:
    speaker: "<Narration>"
    en: Mustang bows his head.
    ko: 머스탱이 고개를 숙인다.
    ja: マスタングが頭を下げた
  event_staranis1_06_e_155:
    speaker: "<Narration>"
    en: A ripple of shock runs through the room, and almost at once, their thoughts
      turn to Hanson.
    ko: 모두는 당황함과 동시에, 한슨을 생각한다.
    ja: |-
      話を聞いた誰もが戸惑うと同時に、
      ハンソンのことを考えた
  event_staranis1_06_e_156:
    speaker: "<Narration>"
    en: They think of all he has endured.
    ko: 그가 지금까지 겪었던 고생을 떠올린다.
    ja: 彼の重ねてきた苦労を思い浮かべた
  event_staranis1_06_e_157:
    speaker: "<Narration>"
    en: The one who wakes earlier than anyone else to take care of his pop stars,
      and stays up later than anyone, preparing for tomorrow and whatever comes next.
    ko: |-
      누구보다 일찍 일어나 자신의 아이돌을 챙기고,
      내일과 미래를 준비하며 누구보다 늦게 잠이 들었던.
    ja: |-
      誰よりも早く起きてアイドルたちを気づかい、
      明日や遠い未来の準備をしながら、
      誰よりも遅く寝ていた
  event_staranis1_06_e_158:
    speaker: "<Narration>"
    en: The one who keeps them from losing heart, who cheers them on, and lifts them
      back up.
    ko: 기죽지 않도록 응원하고, 위로하고.
    ja: 落ち込みそうになれば、励ましてくれた
  event_staranis1_06_e_159:
    speaker: "<Narration>"
    en: He bows his head to others, asks for help, gets turned away, yet still bows
      again.
    ko: 남에게 고개 숙이고, 부탁하고, 거절당하고, 다시 고개를 숙이고.
    ja: |-
      他人に頭を下げ、懇願して、
      断られ、また頭を下げて…
  event_staranis1_06_e_160:
    speaker: "<Narration>"
    en: And through it all, he never lets it show how hard it is.
    ko: 그럼에도 힘든 내색 한번 없이
    ja: それでもつらい顔を一切見せない
  event_staranis1_06_e_161:
    speaker: "<Narration>"
    en: He just endures and believes in them, without wavering.
    ko: 오직 꿋꿋하게 자신의 아이돌을 믿는 한슨을 생각한다.
    ja: |-
      どんな時も揺るがずに
      自分のアイドルを信じる
      ハンソンの顔を思い浮かべた
  event_staranis1_06_e_162:
    speaker: anis_human
    en: I...
    ko: 저는….
    ja: 私は…
  event_staranis1_06_e_163:
    speaker: anis_human
    en: I just want our boss to be happy.
    ko: 우리 사장님이 행복했으면 좋겠어요.
    ja: 社長には幸せになってほしいです。
  event_staranis1_06_e_164:
    speaker: mustang_past
    en: I feel the same.
    ko: 저도 그렇습니다.
    ja: 私もそう思っています。
  event_staranis1_06_e_165:
    speaker: "<Narration>"
    en: Hanson drags himself back to the office, exhausted.
    ko: 한슨은 지친 몸을 이끌고 사무실로 돌아왔다.
    ja: |-
      ハンソンが疲れた体を引きずり、
      事務所に戻ってきた
  event_staranis1_06_e_166:
    speaker: "<Narration>"
    en: Still, the day's results aren't bad. He's sure everyone will be pleased.
    ko: |-
      그래도 영업 성과가 나쁘지 않다.
      모두가 좋아해 줄 것이 분명하다.
    ja: |-
      営業の結果は悪くなかった。
      みんなも喜んでくれるだろう
  event_staranis1_06_e_167:
    speaker: "<Narration>"
    en: The moment he opens the door, something feels off.
    ko: 사무실의 문을 열자, 이질감이 들었다.
    ja: |-
      しかし事務所のドアを開いてすぐに、
      違和感を覚えた
  event_staranis1_06_e_168:
    speaker: "<Narration>"
    en: Things he's never seen before are laid out across the table.
    ko: 처음 보는 것들이 테이블 위에 올려져 있다.
    ja: おぼえの無い物がテーブルに積みあがっている
  event_staranis1_06_e_169:
    speaker: "<Narration>"
    en: Expensive liquor. Luxury sweets. High-end accessories.
    ko: 고급술, 고급 과자, 고급 액세서리들이 가득하다.
    ja: 高級な酒、高級な菓子、高級なアクセサリー…
  event_staranis1_06_e_170:
    speaker: "<Narration>"
    en: Hanson knows exactly how much they're worth,
    ko: 한슨은 그것들이 어느 정도의 가치를 가지는지 잘 알고 있다.
    ja: |-
      ハンソンはそれにどれほどの値打ちがあるか
      よく知っている
  event_staranis1_06_e_171:
    speaker: "<Narration>"
    en: which is precisely why they feel so out of place here.
    ko: 그렇기에, 지금 이런 것들이 사무실 안에 있다는 것에 이질감을 느꼈다.
    ja: |-
      だからこそ、それが自分の事務所にあることを
      不審に思った
  event_staranis1_06_e_172:
    speaker: "<Narration>"
    en: He looks up.
    ko: 고개를 든다.
    ja: 視線を移した
  event_staranis1_06_e_173:
    speaker: "<Narration>"
    en: All four of them are watching him, as though they might burst into tears at
      any moment.
    ko: 넷이 울 것 같은 표정으로 자신을 바라보고 있다.
    ja: |-
      待っていた4人が
      今にも泣きだしそうな顔をして
      こちらを見ている
  event_staranis1_06_e_174:
    speaker: "<Narration>"
    en: For a split second, his heart sinks,
    ko: 갑자기 심장이 덜컹 내려앉는 느낌이 들었지만
    ja: 一瞬、トラブルかと心臓が止まりかけたが…
  event_staranis1_06_e_175:
    speaker: "<Narration>"
    en: then he realizes it isn't sadness. It's joy.
    ko: 곧 그것이 기쁨에 겨운 표정이라는 것을 알아챘다.
    ja: 4人の顔は、よく見れば喜んでいるようだ
  event_staranis1_06_e_176:
    speaker: "<Narration>"
    en: Anis smiles and holds out a document.
    ko: 아니스가 웃으며 서류 한 장을 내민다.
    ja: アニスが笑顔のまま、1枚の紙を差し出してきた
  event_staranis1_06_e_177:
    speaker: "<Narration>"
    en: But Hanson can't help but wonder whether they've won the lottery.
    ko: 복권에 당첨된 건가? 한슨은 그렇게 생각했다.
    ja: |-
      宝くじでも当たったのだろうか？
      ハンソンはのんきに考えた
  event_staranis1_06_e_178:
    speaker: "<Narration>"
    en: He takes it, pulse quickening.
    ko: 기대하며 서류를 받아 든다.
    ja: 少し期待しながら、書類に目を落とした
  event_staranis1_06_e_179:
    speaker: "<Narration>"
    en: His eyes widen as soon as he sees it—the Tetra Line logo stamped boldly across
      the front.
    ko: |-
      한슨의 눈이 커진다.
      서류 표지에 테트라 라인의 로고가 너무나 큼직하다.
    ja: |-
      ハンソンの顔が凍り付いた。
      書類の表紙に大きく記されている
      テトララインのロゴが目に入ったからだ
  event_staranis1_06_e_180:
    speaker: "<Narration>"
    en: He skims through it,
    ko: 한슨은 빠르게 서류를 읽는다.
    ja: ハンソンの目が狂ったように契約書の文字を追う
  event_staranis1_06_e_181:
    speaker: "<Narration>"
    en: then looks up again, stunned.
    ko: 놀란 눈으로 고개를 든다.
    ja: がくぜんとしたまま、顔を上げた
  event_staranis1_06_e_182:
    speaker: "<Narration>"
    en: They're still watching him, on the verge of tears, but this time, it's unmistakably
      from happiness.
    ko: 넷은 여전히 기쁨에 겨워 울 것 같은 표정으로 한슨을 보고 있다.
    ja: |-
      4人は変わらず、
      喜びではちきれそうな顔で、
      ハンソンを見ていた
  event_staranis1_06_e_183:
    speaker: hanson
    en: Ah...
    ko: "…아."
    ja: "…あ…"
  event_staranis1_06_e_184:
    speaker: hanson
    en: This is...
    ko: "…아아."
    ja: "…ああ…"
  event_staranis1_06_e_185:
    speaker: "<Narration>"
    en: Hanson feels like everything is crashing down.
    ko: 한슨은 하늘이 무너지는 것 같은 기분을 느꼈다.
    ja: |-
      ハンソンはまるで、
      空が崩れ落ちてくるように感じた
  event_staranis1_06_e_186:
    speaker: "<Narration>"
    en: The room is steeped in darkness,
    ko: 어두컴컴한 방.
    ja: 薄暗い部屋の中
  event_staranis1_06_e_187:
    speaker: "<Narration>"
    en: luggage piled up in every corner.
    ko: 곳곳에 짐들이 가득 쌓여있다.
    ja: あちこちに物が散乱している
  event_staranis1_06_e_188:
    speaker: "<Narration>"
    en: The only light comes from her phone, casting a faint glow.
    ko: 방에 들어오는 불빛이라고는 핸드폰 화면에서 나오는 불빛뿐이었다.
    ja: |-
      明かりといえば、
      携帯端末の画面の光だけだ
  event_staranis1_06_e_189:
    speaker: "<Narration>"
    en: Yoyo sits motionless, eyes fixed blankly on the screen.
    ko: 요요는 멍하니 핸드폰 화면만을 들여다보고 있었다.
    ja: |-
      ヨヨがぼんやりと
      携帯の画面を見つめていた
  event_staranis1_06_e_190:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_191:
    speaker: "<Narration>"
    en: She checks her messages.
    ko: 메시지 내역을 확인한다.
    ja: メッセージ履歴を確かめた
  event_staranis1_06_e_192:
    speaker: "<Narration>"
    en: Only a few from Anis. Nothing from her colleagues. Nothing from the staff.
    ko: |-
      아니스에게 온 몇 개의 메시지만 있을 뿐,
      동료나 스태프들의 메시지는 하나도 없다.
    ja: |-
      アニスからのメッセージが何通か入っている。
      同僚やスタッフからの連絡は1通さえない
  event_staranis1_06_e_193:
    speaker: "<Narration>"
    en: She logs onto the online forums.
    ko: 아이돌 카페로 접속한다.
    ja: アイドル掲示板にアクセスした
  event_staranis1_06_e_194:
    speaker: "<Narration>"
    en: Every post is just more hate directed at her.
    ko: 아이돌 카페는 자신에 대한 욕밖에 없다.
    ja: 自分への批判であふれている
  event_staranis1_06_e_195:
    speaker: "<Narration>"
    en: Page three. Page five. Page ten. No matter how far she scrolls, it's all the
      same.
    ko: 3페이지, 5페이지, 10페이지까지 넘어가도 욕뿐이다.
    ja: |-
      3ページ、5ページ、10ページ…
      どこまでも罵倒ばかりだ
  event_staranis1_06_e_196:
    speaker: "<Narration>"
    en: Here and there, she spots posts expressing sympathy for T.T. STAR.
    ko: 중간중간 T.T. STAR에 대한 동정심을 표하는 글이 보인다.
    ja: |-
      その合間に時おり、
      T.T. STARへの同情を
      つづった投稿が目に入る
  event_staranis1_06_e_197:
    speaker: "<Narration>"
    en: Yoyo scrolls faster, digging through the flood of posts, searching for even
      one message meant for her—something comforting, something to hold onto.
    ko: |-
      요요는 그 수많은 글 중,
      자신을 위로하거나 응원하는 글이 있을까 싶어 뒤적인다.
    ja: |-
      ヨヨは大量の投稿の中に、
      自分への励ましや応援はないかと
      探し続けた
  event_staranis1_06_e_198:
    speaker: "<Narration>"
    en: There's nothing, or maybe there is. But she just can't see it.
    ko: |-
      없다.
      정확히는 눈에 들어오지 않는다.
    ja: |-
      まったくない。
      正しくは、目に入らないというべきか
  event_staranis1_06_e_199:
    speaker: "<Narration>"
    en: She stares at the screen, growing more and more fixated.
    ko: 요요는 더욱더 광적으로 핸드폰 화면을 들여다본다.
    ja: ヨヨはますます画面にのめり込んでいった
  event_staranis1_06_e_200:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_201:
    speaker: yoyo
    en: I lost everything...
    ko: 다 잃었어.
    ja: なくなっちゃった。
  event_staranis1_06_e_202:
    speaker: yoyo
    en: Is this... karma or something?
    ko: 업보… 같은 건가?
    ja: 全部…自業自得ってこと？
  event_staranis1_06_e_203:
    speaker: "<Narration>"
    en: She continues to scroll through the fan community.
    ko: 아이돌 카페를 뒤적인다.
    ja: 掲示板を漁り続けた
  event_staranis1_06_e_204:
    speaker: "<Narration>"
    en: Her name from when she was human, photos, countless personal details—everything
      is out there, spreading as if it's nothing.
    ko: 요요의 인간 시절 이름, 사진을 포함한 수많은 인적 사항들이 아무렇지도 않게 나돌아다니고 있다.
    ja: |-
      ヨヨの人間だった頃の名前や写真、
      あらゆる個人情報が当然のように出回っている
  event_staranis1_06_e_205:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_206:
    speaker: "<Narration>"
    en: Anis's personal information is already spreading online.
    ko: 아니스의 인적 사항도 돌아다닌다.
    ja: アニスの個人情報も出回っていた
  event_staranis1_06_e_207:
    speaker: "<Narration>"
    en: She taps in to check the posts. They're filled with words of sympathy and
      comfort for the lonely life Anis lived.
    ko: |-
      터치해서 내용을 확인한다.
      외로운 삶을 산 아니스에 대한 동정과 위로의 댓글들이 가득하다.
    ja: |-
      タップして内容を確認すると、
      アニスの苦労への同情や慰めの
      書き込みがあふれていた
  event_staranis1_06_e_208:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_06_e_209:
    speaker: yoyo
    en: Ah...
    ko: 아.
    ja: ああ…
  event_staranis1_06_e_210:
    speaker: yoyo
    en: I lost everything again.
    ko: 또 빼앗겼다.
    ja: また、奪われた。
  event_staranis1_06_e_211:
    speaker: yoyo
    en: She took what was mine again.
    ko: 또 얘가 내걸 다 빼앗아 갔어.
    ja: またあの子が、私のものを、全部…
  event_staranis1_06_e_212:
    speaker: "<Narration>"
    en: 'STAR ANIS: To Be Continued...'
    ko: 'STAR ANIS : To Be Continued….'
    ja: 'STAR ANIS : To Be Continued…'
event_staranis2_01_s:
  event_staranis2_01_s_1:
    speaker: "<Narration>"
    en: In T.T. STAR's waiting room.
    ko: T.T. STAR 대기실.
    ja: T.T. STARの楽屋
  event_staranis2_01_s_2:
    speaker: anis_t
    en: "*Huff... huff...*"
    ko: 하아… 하아…!
    ja: はぁ…はぁ…！
  event_staranis2_01_s_3:
    speaker: mint_i
    en: Haa... haa...
    ko: 후우…! 후우…!
    ja: はぁ…！ふぅ…！
  event_staranis2_01_s_4:
    speaker: prika_i
    en: Hooooo...
    ko: 후우우우….
    ja: ふぅぅぅ…
  event_staranis2_01_s_5:
    speaker: anis_t
    en: Hah...! Ha, haha...!
    ko: 하아…! 하, 하하…!
    ja: はあ…！アハ、ハハハ…！
  event_staranis2_01_s_6:
    speaker: anis_t
    en: Ahahaha!
    ko: 아하하!
    ja: アハハ…！
  event_staranis2_01_s_7:
    speaker: mint_i
    en: Ha, haha...!
    ko: 하, 하하…!
    ja: フフ、アハハハ…！
  event_staranis2_01_s_8:
    speaker: prika_i
    en: Heh...
    ko: 후후.
    ja: ふふっ…
  event_staranis2_01_s_9:
    speaker: "<Narration>"
    en: Anis throws both hands up
    ko: 아니스가 양손을 들어 손바닥을 내민다.
    ja: アニスが両手を上げて手のひらを差し出した
  event_staranis2_01_s_10:
    speaker: "<Narration>"
    en: and high-fives Mint and Prika.
    ko: 민트와 프리카와 하이 파이브를 한다.
    ja: ミントとプリカが応え、ハイタッチをした
  event_staranis2_01_s_11:
    speaker: anis_t
    en: We did it! We actually did it!
    ko: 했다. 드디어 했어!
    ja: やった。やったのよ！
  event_staranis2_01_s_12:
    speaker: mint_i
    en: "... Yeah, we did it."
    ko: "…응. 해냈네."
    ja: "…ええ。やったわね。"
  event_staranis2_01_s_13:
    speaker: prika_i
    en: It still doesn't feel real.
    ko: 아직까지 현실감이 너무 없어.
    ja: まだ実感が湧かないな。
  event_staranis2_01_s_14:
    speaker: mrsmiss
    en: So? How'd your first big stage feel?
    ko: |-
      어때?
      생애 첫 대규모 공연을 한 기분이?
    ja: |-
      どうだった？
      人生初めての大きなステージは。
  event_staranis2_01_s_15:
    speaker: anis_t
    en: It's freaking awesome!
    ko: 끝내 줘.
    ja: サイッコー。
  event_staranis2_01_s_16:
    speaker: prika_i
    en: So this is what it feels like.
    ko: 이런 기분이었군요.
    ja: こんな気分だとは知らなかった。
  event_staranis2_01_s_17:
    speaker: mint_i
    en: I'm still tingling all over, like I just got zapped.
    ko: |-
      몸이 아직까지 찌릿찌릿해요.
      감전된 것 같아요.
    ja: |-
      体がまだ痺れてます。
      感電したみたい。
  event_staranis2_01_s_18:
    speaker: mrsmiss
    en: Good, that's the state you should be in. Hold onto it. Take a short break,
      you're going back out soon.
    ko: |-
      긍정적인 흥분 상태야.
      잘 보관해놔. 잠깐 쉬었다가 바로 나가야 되니까.
    ja: |-
      ほどよく興奮状態ね。そのまま維持しなさい。
      少し休んだら、またすぐ出番よ。
  event_staranis2_01_s_19:
    speaker: prika_i
    en: Is it really fine to do it one song at a time like this?
    ko: 그런데 한 곡 하고 쉬고, 한 곡 하고 쉬고 이거 괜찮은 거 맞나요?
    ja: |-
      1曲ごとに休憩を挟むなんて、
      大丈夫なのか？
  event_staranis2_01_s_20:
    speaker: prika_i
    en: Wouldn't it be better to just go straight through?
    ko: 쭉 이어서 하는 게 아무래도 나을 것 같은데.
    ja: |-
      やっぱりこういうのは何曲か
      続けてやるものだっていう気がする。
  event_staranis2_01_s_21:
    speaker: mrsmiss
    en: What did you think was going to happen, working a bunch of rookies like that?
    ko: 경험도 많이 없는 초짜들을 그렇게 굴렸다가 무슨 일이 벌어질 줄 알고.
    ja: |-
      経験の浅い新人にそんなことやらせたら、
      どうなるかしらね？
  event_staranis2_01_s_22:
    speaker: mrsmiss
    en: The bigger the stage, the more careful you have to be.
    ko: 중요한 무대일수록 신중을 가해야지.
    ja: 大事なステージほど、慎重な計画が要るの。
  event_staranis2_01_s_23:
    speaker: mint_i
    en: You mentioned there'd be a guest performing while we take breaks, right?
    ko: 저희가 쉬는 동안 게스트가 나와서 도와준다고 했었죠?
    ja: |-
      休憩の間は、ゲストパフォーマンスが
      入るんですよね？
  event_staranis2_01_s_24:
    speaker: mint_i
    en: Who is it? You haven't told us yet.
    ko: |-
      누가 오는데요?
      아직 안 알려줬잖아요.
    ja: |-
      誰が来てるんですか？
      まだ聞かせてもらってなかったですよね。
  event_staranis2_01_s_25:
    speaker: anis_t
    en: Yeah, you kept dodging it every time we asked.
    ko: 그러게. 물어봐도 계속 말 돌리고 그랬지.
    ja: そうそう。聞いてもはぐらかされたし。
  event_staranis2_01_s_26:
    speaker: mrsmiss
    en: It's in your best interest.
    ko: 너희를 위해서야.
    ja: あなたたちのためよ。
  event_staranis2_01_s_27:
    speaker: anis_t
    en: I don't get why you're making such a big secret out of it.
    ko: 아니 뭐 대단한 내용이라고 그걸 숨기는 건지 모르겠네.
    ja: そこまでもったいぶるほどの大物？
  event_staranis2_01_s_28:
    speaker: mrsmiss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_29:
    speaker: mrsmiss
    en: It's Noise and Volume.
    ko: 노이즈랑 볼륨.
    ja: ノイズとボリューム。
  event_staranis2_01_s_30:
    speaker: mint_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_31:
    speaker: prika_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_32:
    speaker: anis_t
    en: Why'd it have to be those two...?
    ko: 아니 그 둘을 부르면 어떡하냐고오….
    ja: |-
      そんなの出されたら、
      私たちの立場がないじゃない…
  event_staranis2_01_s_33:
    speaker: anis_t
    en: At this rate, they're basically gonna overshadow us...
    ko: 배보다 배꼽이 더 크잖아….
    ja: |-
      主役よりもゲストの方が
      メインになっちゃうでしょ…
  event_staranis2_01_s_34:
    speaker: mint_i
    en: Oh... I guess we're not what they came for...
    ko: 어… 그럼 티켓 분별력이….
    ja: もしかして…チケットが売れたのも…
  event_staranis2_01_s_35:
    speaker: mrsmiss
    en: We've kept the guest performers under wraps.
    ko: 게스트는 계속 비밀로 해뒀어.
    ja: ゲストは完全にサプライズよ。
  event_staranis2_01_s_36:
    speaker: mrsmiss
    en: Everyone out there came to see you, so relax.
    ko: 관중석에 있는 사람들은 다 너희를 보러 온 사람들이니까 안심해.
    ja: |-
      客席にいるのはみんな、
      あなたたちを見に来た人だから
      安心しなさい。
  event_staranis2_01_s_37:
    speaker: anis_t
    en: Oh... okay.
    ko: 그, 그렇구나.
    ja: そ、そうなのね。
  event_staranis2_01_s_38:
    speaker: mrsmiss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_39:
    speaker: mrsmiss
    en: Well done.
    ko: 잘했어.
    ja: よくやってるわ。
  event_staranis2_01_s_40:
    speaker: mrsmiss
    en: On your first big stage, you didn't slip once, and you kept your nerves in
      check.
    ko: 처음으로 하는 큰 공연일 텐데, 실수도 없고 떨지도 않았어.
    ja: |-
      初めての大きなステージで、
      ミスも緊張もしてない。
  event_staranis2_01_s_41:
    speaker: mrsmiss
    en: You delivered exactly what you rehearsed.
    ko: 연습한 대로 잘 해냈고.
    ja: 練習の成果をそのまま出せたわね。
  event_staranis2_01_s_42:
    speaker: anis_t
    en: "... What's with you all of a sudden?"
    ko: "…왜 이래 갑자기."
    ja: "…急にな…んですか…？"
  event_staranis2_01_s_43:
    speaker: mrsmiss
    en: I'm praising you. Don't make me repeat myself. You'd get halfway there even
      just by standing on stage.
    ko: 칭찬하고 있잖니. 넌 참 가만히만 있어도 반은 갈 거다.
    ja: |-
      褒めてるのよ。
      あなたは黙ってればまあまあなのにねぇ…
  event_staranis2_01_s_44:
    speaker: mrsmiss
    en: I don't know everything you went through back then,
    ko: |-
      너희들이 예전에 겪었던 일,
      나는 자세히는 몰라.
    ja: |-
      とにかく、あなたたちに何があったのか、
      私も詳しくは知らないわ。
  event_staranis2_01_s_45:
    speaker: mrsmiss
    en: 'but I know this: you clawed your way here and put up with whatever it took'
    ko: 하지만 아등바등, 온갖 걸 다 참아가며 해나갔다는 건 알아.
    ja: |-
      けど、必死に耐えて
      もがき続けてきたことは分かる。
  event_staranis2_01_s_46:
    speaker: mrsmiss
    en: because you wanted a chance like this.
    ko: 이런 기회를 손에 넣고 싶어서.
    ja: |-
      それも全部、今日この日みたいな
      チャンスを手に入れるため。
  event_staranis2_01_s_47:
    speaker: mrsmiss
    en: Don't mistake this for luck.
    ko: 우연에 우연이 겹쳐서 기회를 손에 넣었다고 생각하지 마.
    ja: |-
      偶然に偶然が重なった、
      チャンスが降ってきた、なんて思わないで。
  event_staranis2_01_s_48:
    speaker: mrsmiss
    en: This is one of the results of everything you've done to get here.
    ko: 너희가 지금껏 해왔던 일의 결과 중 하나라고 생각해.
    ja: |-
      これはあなたたちが
      今まで積み重ねてきた結果のひとつなの。
  event_staranis2_01_s_49:
    speaker: mrsmiss
    en: Back then, you didn't have the means or the room to seize an opportunity like
      this. Now you do.
    ko: 그때는 기회를 잡을 힘과 여유가 없었다면, 지금은 달라.
    ja: |-
      昔はチャンスをつかむ力と余裕が
      なかったとしても、今は違う。
  event_staranis2_01_s_50:
    speaker: mrsmiss
    en: So hold on to it with everything you have, and don't let go.
    ko: 그러니 온 힘을 다해 붙잡고 매달려.
    ja: |-
      だから、全力でチャンスをつかんで
      ぶら下がりなさい。
  event_staranis2_01_s_51:
    speaker: anis_t
    en: "... Yeah, I will."
    ko: "…응."
    ja: "…はい。"
  event_staranis2_01_s_52:
    speaker: mrsmiss
    en: Good. Now get ready.
    ko: 좋아. 이제 준비해.
    ja: 分かったら、そろそろスタンバイよ。
  event_staranis2_01_s_53:
    speaker: mrsmiss
    en: And don't get cocky just because you nailed one song.
    ko: 한 곡 잘 소화했다고 우쭐대지 말고.
    ja: |-
      1曲うまくいったぐらいで、
      調子に乗らないようにね。
  event_staranis2_01_s_54:
    speaker: "<Narration>"
    en: Everyone gets to their feet,
    ko: 모두가 자리에서 일어난다.
    ja: 全員がその場で立ち上がった
  event_staranis2_01_s_55:
    speaker: "<Narration>"
    en: exchanging quick glances before heading out.
    ko: 서로 눈을 마주친 후, 걸어 나간다.
    ja: 互いに目を合わせ、足を踏み出す
  event_staranis2_01_s_56:
    speaker: "<Narration>"
    en: On the way to the stage, Mint pokes Anis in the cheek.
    ko: 스테이지로 향하는 길, 민트가 아니스의 볼을 콕 찌른다.
    ja: |-
      ステージへ向かう途中、
      ミントがアニスの頬をつついた
  event_staranis2_01_s_57:
    speaker: anis_t
    en: Huh, what the...?
    ko: 엇. 뭐야.
    ja: ちょっと、何？
  event_staranis2_01_s_58:
    speaker: mint_i
    en: C'mon, smile a little. You look like you're off to kill someone.
    ko: 웃어 웃어. 뭐 어디 사람 죽이러 가?
    ja: |-
      ほら、スマイルスマイル。
      仇討ちにでも行く気？
  event_staranis2_01_s_59:
    speaker: anis_t
    en: Man, I still can't smile naturally.
    ko: 아 이게 참. 자연스럽게 웃는 게 아직 영 안 되네.
    ja: |-
      ああ、ホント…自然に笑うのって、
      まだ全然上手くいかないわ。
  event_staranis2_01_s_60:
    speaker: prika_i
    en: You're good now.
    ko: 이제 괜찮잖아.
    ja: もう大丈夫なんだ。
  event_staranis2_01_s_61:
    speaker: mint_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_62:
    speaker: prika_i
    en: So don't hold back.
    ko: 마음껏 웃을 수 있어.
    ja: 思いっきり笑っていいんだよ。
  event_staranis2_01_s_63:
    speaker: prika_i
    en: Just smile.
    ko: 그러니 웃자.
    ja: だから、笑っていこう。
  event_staranis2_01_s_64:
    speaker: anis_t
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_65:
    speaker: anis_t
    en: Yeah, let's do it.
    ko: 그래. 웃자.
    ja: そうね、笑いましょ？
  event_staranis2_01_s_66:
    speaker: hanson
    en: Let's call this off.
    ko: 취소하자.
    ja: 取り消してくる。
  event_staranis2_01_s_67:
    speaker: hanson
    en: Even if it's already signed, we can still back out.
    ko: |-
      사인 정도라면 괜찮아.
      취소할 수 있어.
    ja: |-
      名前を書いただけなら問題ない。
      まだ取り消せる。
  event_staranis2_01_s_68:
    speaker: anis_human
    en: Huh? Wait, why?
    ko: 예? 아, 아니 왜….
    ja: えっ？でも、なんで…
  event_staranis2_01_s_69:
    speaker: hanson
    en: Let's go. We're calling this off.
    ko: 가자. 가서 취소하자.
    ja: すぐに行ってくる。この話は取り消しだ。
  event_staranis2_01_s_70:
    speaker: anis_human
    en: Uh... so, um...
    ko: 어… 그, 그게요.
    ja: あの…でも、聞いたんです。
  event_staranis2_01_s_71:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_72:
    speaker: anis_human
    en: Boss, I heard you're Mr. Mustang's son. Is that true?
    ko: 사장님. 머스탱 사장님 아들이라면서요.
    ja: マスタング社長がお父さんだったんでしょ？
  event_staranis2_01_s_73:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_74:
    speaker: anis_human
    en: I-I heard you two aren't really on good terms, and Mr. Mustang said he wants
      to make things right, so...
    ko: |-
      사, 사이 안 좋다면서요.
      머스탱 사장님이 화해하고 싶다고….
    ja: |-
      な、仲が悪いって聞きました。
      でも、マスタング社長は仲直りしたいって…
  event_staranis2_01_s_75:
    speaker: anis_human
    en: we just thought maybe we could help somehow...
    ko: 그거… 도와주고 싶어서….
    ja: 私たちも…力になりたいと思って…
  event_staranis2_01_s_76:
    speaker: anis_human
    en: get you two talking again...
    ko: 우리가… 다리를 놔줬으면 좋겠다고… 했거든요.
    ja: |-
      二人が…仲良くできるように
      なればって…思って…
  event_staranis2_01_s_77:
    speaker: hanson
    en: Anis...
    ko: "…아니스."
    ja: "…アニス…"
  event_staranis2_01_s_78:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_79:
    speaker: hanson
    en: Thank you, I really do appreciate your concern.
    ko: 그, 그래. 고맙다. 나 신경 써줘서 고마워.
    ja: |-
      そうか、そうだな。ありがとう。
      私のことを気にかけてくれたのか。
  event_staranis2_01_s_80:
    speaker: hanson
    en: I'll... I'll speak with my father and try to make things right.
    ko: 내가, 내가 아버지랑 화해할게. 잘 지내볼게.
    ja: |-
      父との和解は考えておく。
      仲良くできるように努力しよう。
  event_staranis2_01_s_81:
    speaker: hanson
    en: So, let's cancel this.
    ko: 그러니 취소하자.
    ja: だが、この契約は無しだ。
  event_staranis2_01_s_82:
    speaker: hanson
    en: That should be all right, right?
    ko: 괜찮지? 응?
    ja: それでいいだろう？な？
  event_staranis2_01_s_83:
    speaker: anis_human
    en: B-but why?
    ko: 왜, 왜 그래요?
    ja: ど、どうしてですか？
  event_staranis2_01_s_84:
    speaker: anis_human
    en: I-I mean... if Tetra's backing us, we could...
    ko: 그, 그… 테트라 지원 받으면 우리도.
    ja: だって…テトラに助けてもらえば…
  event_staranis2_01_s_85:
    speaker: anis_human
    en: seriously do way better... right?
    ko: 우리도 좀 더 잘 될 수 있지… 않을까… 요?
    ja: |-
      私たちも、もっと有名に
      なれるんじゃ…ないんです…か？
  event_staranis2_01_s_86:
    speaker: anis_human
    en: It's Tetra, after all. They're basically the heart of the entertainment world,
      so we could really—
    ko: |-
      다른 곳도 아니고, 테트라잖아요.
      엔터테인먼트의 보고 같은 곳이니까, 우리도….
    ja: |-
      だって、あのテトラじゃないですか。
      エンターテイメントって言ったら
      それ以上は他にないんだし、私たちだって…
  event_staranis2_01_s_87:
    speaker: hanson
    en: No! Tetra's nothing like that!
    ko: 테트라는! 그런 곳이 아니야!
    ja: テトラは！そんな場所じゃないんだ！
  event_staranis2_01_s_88:
    speaker: anis_human
    en: "!"
    ko: "!!"
    ja: "！！"
  event_staranis2_01_s_89:
    speaker: hanson
    en: That place treats Nikkes as nothing more than products! You must not go there!
    ko: |-
      니케를 철저히 상품으로만 보는 곳이야!
      너희는 거기에 가면 안 돼!
    ja: |-
      ニケをただの商品としてしか見ていない！
      君たちをそんなところに行かせられるか！
  event_staranis2_01_s_90:
    speaker: hanson
    en: You'll be destroyed... completely ruined!
    ko: 망가져…! 망가지고 말 거라고!
    ja: 壊れてしまう…！壊されるんだ！
  event_staranis2_01_s_91:
    speaker: hanson
    en: Th-this isn't the time. I'll go—I'll handle this myself...!
    ko: |-
      이, 이럴 때가 아니야.
      나라도, 나라도 가서…!
    ja: |-
      そうだ、こんなことしてる場合じゃない。
      一刻も早く乗り込んで…！
  event_staranis2_01_s_92:
    speaker: mint
    en: I want to do this.
    ko: 저는 하고 싶어요.
    ja: 私はやりたいです。
  event_staranis2_01_s_93:
    speaker: hanson
    en: What...?
    ko: 뭐….
    ja: 何を…
  event_staranis2_01_s_94:
    speaker: mint
    en: I want to keep going with Tetra's support.
    ko: 테트라의 지원을 받으면서, 하고 싶다고요.
    ja: テトラのサポートを受けた活動。
  event_staranis2_01_s_95:
    speaker: mint
    en: We've worked hard,
    ko: 저희 열심히 했잖아요.
    ja: 私たち、今まで頑張ってきました。
  event_staranis2_01_s_96:
    speaker: mint
    en: and I know we're not anything special.
    ko: 알아요. 우리가 특별하지 않다는 거.
    ja: |-
      分かってるんです。
      私たちは特別でも何でもないって。
  event_staranis2_01_s_97:
    speaker: mint
    en: But... maybe that can change.
    ko: 그래도 혹시나.
    ja: それでも、もしかしたら…
  event_staranis2_01_s_98:
    speaker: mint
    en: Maybe, even a little, we can become something more.
    ko: 조금이라도 특별해지지 않을까.
    ja: 少しは特別になれるかもしれない…
  event_staranis2_01_s_99:
    speaker: mint
    en: Maybe someday, we'll have our moment.
    ko: 언젠가 반짝이지 않을까.
    ja: いつか輝けるかもしれない…
  event_staranis2_01_s_100:
    speaker: mint
    en: Maybe someone will finally notice us.
    ko: 그걸 누가 알아봐 주지 않을까.
    ja: 誰かに分かってもらえるかもしれないって…
  event_staranis2_01_s_101:
    speaker: mint
    en: That's why we've kept going all this time.
    ko: 그런 마음으로 지금껏 열심히 해왔어요.
    ja: そんな気持ちでずっと。
  event_staranis2_01_s_102:
    speaker: hanson
    en: You're doing better than you realize.
    ko: 너희는, 너희는 충분히 잘하고 있어.
    ja: 君たちは…十分によく頑張っている。
  event_staranis2_01_s_103:
    speaker: hanson
    en: It's just that your efforts haven't shone through yet. There's still plenty
      of time, so—
    ko: |-
      지금 당장 빛을 보지 못하는 것뿐이야.
      시간은 많잖니. 그러니까….
    ja: |-
      まだその時じゃないというだけだ。
      時間をかけていけばいい。だから…
  event_staranis2_01_s_104:
    speaker: mint
    en: Until when...?
    ko: 언제… 까지요?
    ja: いつまで…ですか？
  event_staranis2_01_s_105:
    speaker: mint
    en: How long do we have to keep going like this?
    ko: 언제까지 해야 되는데요.
    ja: いつまでこのまま頑張ればいいんですか？
  event_staranis2_01_s_106:
    speaker: mint
    en: I-I'm not sure we'll ever really shine
    ko: |-
      화, 확신이 안 들거든요.
      우리가 반짝일 수 있을 거란 확신이.
    ja: |-
      自信が…自信が持てないんです。
      私たちがいつか輝けるなんて。
  event_staranis2_01_s_107:
    speaker: mint
    en: since we're not... special.
    ko: 특별하지… 않으니까.
    ja: 特別じゃ…ないから。
  event_staranis2_01_s_108:
    speaker: mint
    en: So does that mean...
    ko: 그럼, 그럼 특별하지 않은 우리는 그냥.
    ja: それなら、特別じゃない私たちは…
  event_staranis2_01_s_109:
    speaker: mint
    en: people like us just have to keep crawling along, inch by inch... with nothing
      to guide us?
    ko: 이렇게… 바닥을 아득바득 기면서 계속 가야 하는 건가요?
    ja: |-
      このままずっと…もがき続けないと
      いけないってことですか？
  event_staranis2_01_s_110:
    speaker: mint
    en: We're supposed to believe there's something out there waiting for us when
      we can't even see it? Do we just keep feeling our way forward, blindly?
    ko: |-
      보이지도 않는 그 반짝이는 뭔가가 있을 거라고 믿고,
      계속 이렇게 한 치 앞도 안 보이는 곳을 더듬어 나가야 해요?
    ja: |-
      見えない輝く何かが向こうにあるって信じて
      先の見えない道を進み続けないと
      いけないんですか？
  event_staranis2_01_s_111:
    speaker: mint
    en: This is a chance. If we have Tetra backing us,
    ko: 기회예요. 테트라의 지원을 받는다면.
    ja: |-
      チャンスじゃないですか。
      テトラのバックアップが受けられるなら…
  event_staranis2_01_s_112:
    speaker: mint
    en: then even ordinary people like us can become something special.
    ko: "…아무것도 아닌 우리도, 특별해질 수 있는 거잖아요."
    ja: |-
      …何もない私たちだって、
      特別になれるかもしれないのに。
  event_staranis2_01_s_113:
    speaker: hanson
    en: You're wrong, Mint. You are special.
    ko: |-
      아니야, 민트.
      너희는 이미 특별해.
    ja: |-
      そんなことはない、ミント。
      君たちはもう特別なんだ。
  event_staranis2_01_s_114:
    speaker: mint
    en: In what way...?
    ko: 어떤 게요?
    ja: どこが？
  event_staranis2_01_s_115:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_116:
    speaker: mint
    en: Wh-what exactly is so special about me? About us?
    ko: 어, 어떤 게 특별한데요?
    ja: 何が…何が特別だっていうんですか？
  event_staranis2_01_s_117:
    speaker: mint
    en: If we really are, then why are we still stuck at the bottom like this?
    ko: 뭐가 그렇게 특별해서, 이렇게 바닥만 구르고 있냐고요.
    ja: |-
      特別ならなんで、
      こんなに転げまわって苦しんでるんですか？
  event_staranis2_01_s_118:
    speaker: mint
    en: Is this what you call "special"?
    ko: 이게 특별한거예요?
    ja: 私たちのどこが特別なんですか？
  event_staranis2_01_s_119:
    speaker: hanson
    en: Mint...
    ko: 민트….
    ja: ミント…
  event_staranis2_01_s_120:
    speaker: prika
    en: I know what you're worried about, Boss.
    ko: 사장님이 뭘 걱정하는지는 알아요.
    ja: 社長の心配は分かってるつもりだ。
  event_staranis2_01_s_121:
    speaker: prika
    en: We know how tough it is for Tetra's pop stars.
    ko: 테트라 소속 아이돌이 힘들다는 거, 저희도 잘 알아요.
    ja: |-
      テトラ所属のアイドルも
      ラクじゃないってことは、
      私たちもよく知ってる。
  event_staranis2_01_s_122:
    speaker: prika
    en: But we can do this. I'm sure of it.
    ko: |-
      그런데 할 수 있어요.
      우리들이라면 할 수 있어요.
    ja: |-
      だけど、できる。
      私たちなら。
  event_staranis2_01_s_123:
    speaker: prika
    en: I don't think it's going to be that different, and we've done just fine so
      far.
    ko: |-
      별로 다르지 않다고 생각해요.
      지금껏 우리, 너무 잘해왔으니까 자신 있어요.
    ja: |-
      きっと今とそう変わらないはずだ。
      ここまで頑張ってきたから自信がある。
  event_staranis2_01_s_124:
    speaker: prika
    en: Struggling blindly won't get us anywhere.
    ko: 아무것도 보이지 않는 상태에서 버둥거리는 것보다
    ja: 何も見えない場所でもがき続けるより…
  event_staranis2_01_s_125:
    speaker: prika
    en: If we're going to struggle, I'd rather do it where there's at least a chance.
    ko: 조금이라도 가능성이 보이는 상태에서 버둥거리는 게 더 낫다고 생각해요.
    ja: |-
      少しでも可能性の見えるところで
      頑張るほうが、ずっといいと思う。
  event_staranis2_01_s_126:
    speaker: prika
    en: That's what we do best, anyway.
    ko: 버둥거리는 건 우리 특기니까.
    ja: 泥にまみれるのは私たちの得意なことだ。
  event_staranis2_01_s_127:
    speaker: hanson
    en: No... No...
    ko: 아니… 아니야….
    ja: 違う…違うんだ…
  event_staranis2_01_s_128:
    speaker: riss
    en: I-if I could just add... the training environment there is on a completely
      different level.
    ko: |-
      …제, 제 의견도 말씀드리면,
      아이돌 성장 환경이 비교가 안 될 수준이에요.
    ja: |-
      …わ、私も、成長できる環境としては
      比べ物にならないかと思います。
  event_staranis2_01_s_129:
    speaker: riss
    en: Tetra has professional trainers, top-tier facilities, and really strong support.
    ko: 테트라는 아이돌 육성을 위한 전문 트레이너와 시설, 복지가 너무 좋고.
    ja: |-
      テトラはアイドル育成の
      専門トレーナーや施設がつきますし、
      福利厚生も豊富です。
  event_staranis2_01_s_130:
    speaker: riss
    en: And since they run their own broadcast channels, they can actively promote
      us if they want.
    ko: |-
      자체 운영하는 방송용 채널이 다수 있어서,
      원한다면 대놓고 힘을 실어줄 수도 있어요.
    ja: |-
      自社運営の放送チャンネルも
      多数持っていますし、
      経験も積みたいだけ積めます。
  event_staranis2_01_s_131:
    speaker: riss
    en: Just that alone would already make us...
    ko: 그 덕을 보는 것만으로도 저희는 더….
    ja: |-
      そういうものが使えるだけでも、
      私たちには…
  event_staranis2_01_s_132:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_133:
    speaker: hanson
    en: I see. So that's how you all feel.
    ko: 그래. 다들 그렇게 생각하는구나.
    ja: |-
      ありがとう。みんなが
      よく考えてくれていることは分かった。
  event_staranis2_01_s_134:
    speaker: hanson
    en: I get where you're coming from,
    ko: 너희 생각은 잘 알았어.
    ja: 君たちの想いはしっかりと受け取らせてもらう。
  event_staranis2_01_s_135:
    speaker: hanson
    en: but this time, I'll be making the decision.
    ko: "…미안하지만, 이번엔 사장인 내가 판단할 거야."
    ja: |-
      …それでも、今回ばかりは
      社長としての私の判断に従って欲しい。
  event_staranis2_01_s_136:
    speaker: hanson
    en: The deal is off.
    ko: 거래는 취소야.
    ja: この契約は、取り消す。
  event_staranis2_01_s_137:
    speaker: anis_human
    en: Boss.
    ko: 사장님.
    ja: 社長…？
  event_staranis2_01_s_138:
    speaker: hanson
    en: Mustang and Tetra
    ko: 머스탱과 테트라는!
    ja: マスタングもテトラも…！
  event_staranis2_01_s_139:
    speaker: hanson
    en: aren't what you think they are!
    ko: 너희가 생각하는 그런 게 아니야!
    ja: 君たちが思っているような場所じゃないんだ！
  event_staranis2_01_s_140:
    speaker: hanson
    en: Even Pretty couldn't handle it. What makes you think you can?!
    ko: 프리티도 버티지 못했는데 너희라고…!
    ja: |-
      プリティーでも耐えられなかったのに、
      君たちが耐えられるわけは…！
  event_staranis2_01_s_141:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_142:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_143:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_144:
    speaker: hanson
    en: I-I'm really sorry. I wasn't trying to compare you. I truly wasn't.
    ko: 미, 미안하다. 비교하려는 건 아니었어. 진짜 미안하다.
    ja: |-
      す、すまない。比べるつもりはなかった。
      本当にすまない。
  event_staranis2_01_s_145:
    speaker: hanson
    en: B-but... no, this isn't right. I can't allow it.
    ko: 아, 아무튼. 이건 아니야. 절대 안 돼.
    ja: と、とにかく…この契約はダメだ。絶対に。
  event_staranis2_01_s_146:
    speaker: "<Narration>"
    en: Hanson straightens his clothes and heads for the door.
    ko: 한슨이 옷을 추스르며 출입문 쪽으로 다가간다.
    ja: |-
      ハンソンは身だしなみを整え直し、
      扉を出ようとした
  event_staranis2_01_s_147:
    speaker: "<Narration>"
    en: Just then, a voice from the TV cuts through the silence.
    ko: 그때, 모두의 귀에 박히는 소리가 TV에서 들려왔다.
    ja: |-
      テレビ番組の声が、
      その場にいた全員の耳を引いた
  event_staranis2_01_s_148:
    speaker: maleannouncer
    en: It's been a while, hasn't it? Since we've seen any movement on the major charts.
    ko: 이게 얼마 만이지요? 메이저 차트에 변동이 있는 게.
    ja: |-
      いつぶりでしょうね？
      メジャー側のランキングが動いたのは。
  event_staranis2_01_s_149:
    speaker: femaleannouncer
    en: The major charts have been pretty stagnant for a while now.
    ko: 사실 메이저 차트 리스트가 경직되어 있다는 건 오래전부터 대두되던 문제였어요.
    ja: |-
      メジャーチャートの顔ぶれの硬直化は、
      実は以前から問題視されていました。
  event_staranis2_01_s_150:
    speaker: femaleannouncer
    en: Unless someone from the top messes up, it's almost impossible for smaller
      groups to break through.
    ko: |-
      메이저에서 누군가가 사고를 치지 않는 이상,
      마이너가 메이저로 올라가는 건 꿈같은 얘기니까요.
    ja: |-
      メジャー側の誰かがスキャンダルでも
      起こさなければ、下からの
      格上げは夢のまた夢でしたからね。
  event_staranis2_01_s_151:
    speaker: femaleannouncer
    en: It's been a year and a half since the rankings last changed. That alone tells
      you how closed off the music scene is.
    ko: |-
      이번에 메이저 차트가 바뀐 게 1년 반 만인 거 아세요?
      그만큼 자기들끼리만 해 먹는 판이었다는 거죠.
    ja: |-
      今回はなんと1年半ぶりの変動で、
      それだけ業界に変化が
      無かったということでもあります。
  event_staranis2_01_s_152:
    speaker: maleannouncer
    en: So with Yoyo out, that opens up a spot?
    ko: 요요가 빠졌으니 한 자리가 났다?
    ja: ヨヨの活動休止が原因ですね？
  event_staranis2_01_s_153:
    speaker: femaleannouncer
    en: Exactly, everyone's scrambling to claim that spot right now.
    ko: 맞아요. 그러다 보니 지금 그 자리를 차지하려고 난리도 아니에요.
    ja: |-
      その通りです。空席になった王座を巡って、
      競争が激しくなっています。
  event_staranis2_01_s_154:
    speaker: femaleannouncer
    en: What's interesting is that Tetra's starting to pay attention to the indie
      charts too.
    ko: 재밌는 건, 테트라에서 슬슬 마이너 차트 쪽도 신경 쓰기 시작한다는 거예요.
    ja: |-
      もう一つ目を離せない動向として、
      テトラがインディーズ側のアイドルに
      注目を始めています。
  event_staranis2_01_s_155:
    speaker: maleannouncer
    en: Oh? How so?
    ko: 오, 그건 또 무슨 말이죠?
    ja: なんと、それはどういうことでしょう？
  event_staranis2_01_s_156:
    speaker: femaleannouncer
    en: Tetra has officially signed T.T. STAR, a small-time group that includes Anis,
      the victim of Yoyo's bullying.
    ko: 요요의 학폭 피해자인 아니스가 속한 마이너, T.T. STAR를 테트라가 공식적으로 지원한다고 대대적으로 발표했거든요.
    ja: |-
      ヨヨのスキャンダルで話題になった
      アニスの所属するT.T. STARに対して、
      テトラが公式な支援を大々的に発表したんです。
  event_staranis2_01_s_157:
    speaker: maleannouncer
    en: Wait, they're supporting an indie group? That's a first, isn't it?
    ko: |-
      마이너를 직접이요?
      이런 케이스는 처음인 거 아닌가요?
    ja: |-
      メジャー入りしていないアイドルを
      テトラが直々に？
      こんなケースは初めてじゃないですか？
  event_staranis2_01_s_158:
    speaker: femaleannouncer
    en: Yes, it's their first time.
    ko: 처음이죠.
    ja: 史上初です。
  event_staranis2_01_s_159:
    speaker: femaleannouncer
    en: Tetra's usual approach has been to let the smaller groups fight it out,
    ko: |-
      [마이너에서 피 터지게 싸워라.
      메이저로 올라오면 우리가 책임지고 키워주겠다.]
    ja: |-
      「インディーズ同士で激しく争わせ、
      　勝ち上がってメジャーに
      　食い込んだ者だけを拾い育てる」
  event_staranis2_01_s_160:
    speaker: femaleannouncer
    en: and only step in once one of them makes it big.
    ko: 가 테트라의 아이돌 판 운영 방식이었으니까요.
    ja: 言ってみれば、それがテトラの方針でしたから。
  event_staranis2_01_s_161:
    speaker: femaleannouncer
    en: But as I said, that hasn't happened in a year and a half.
    ko: 뭐, 1년 반 동안 그런 일은 일어나지 않았지만요.
    ja: |-
      まぁ、この1年半、そんなことは
      起こらなかったわけですけどね。
  event_staranis2_01_s_162:
    speaker: maleannouncer
    en: Some see it as a way of supporting a bullying victim.
    ko: 학폭 피해자를 위한 케어의 일환이라고 보는 시각도 있겠군요.
    ja: |-
      いじめの被害者へのケアの一環だという
      見方もあります。
  event_staranis2_01_s_163:
    speaker: femaleannouncer
    en: Yeah. Honestly, with so many groups out there that are both more skilled and
      have more potential than T.T. STAR, it's not exactly an allegation they can
      shake off.
    ko: 예. 사실 T.T. STAR보다 훨씬 잠재력 높고 잘하는 아이돌이나 그룹은 많아서, 그 의혹에서 벗어날 순 없겠죠.
    ja: |-
      そうですね。実際、他にも実力があると
      見られているアイドルは多くいますから、
      疑惑はつきまとうでしょう。
  event_staranis2_01_s_164:
    speaker: maleannouncer
    en: Hmm... the smaller groups probably won't just sit back and let this happen.
    ko: 흐음… 다른 마이너 아이돌이나 그룹이 가만있지 않겠는데요.
    ja: |-
      いやぁ～…それだと他のアイドルたちが
      黙っていないのでは？
  event_staranis2_01_s_165:
    speaker: femaleannouncer
    en: They will. No one's stupid enough to pick a fight with Tetra.
    ko: |-
      가만히 있을 거예요.
      테트라에게 대들 바보는 없을 테니까.
    ja: |-
      何も言えないでしょうね。
      テトラににらまれたくはないでしょうし。
  event_staranis2_01_s_166:
    speaker: maleannouncer
    en: Haha, fair enough.
    ko: 하하. 그건 그렇겠군요.
    ja: ハハ…それはごもっとも。
  event_staranis2_01_s_167:
    speaker: femaleannouncer
    en: If anything, most people are probably thinking, "Wait, could that be us too?"
    ko: 반대로, [어? 혹시 우리도?] 같은 생각을 하는 쪽이 압도적이겠죠.
    ja: |-
      むしろ、「もしかしたら私たちだって？」
      と考えるアイドルの方が
      圧倒的に多くなるでしょう。
  event_staranis2_01_s_168:
    speaker: maleannouncer
    en: Oh? So Tetra's setting a precedent by pulling someone up from the indie scene?
    ko: 오오. 이제 테트라가 마이너에서 직접 끌어올리는 선례를 만들었다?
    ja: |-
      なるほど。テトラ直々に引き上げられる
      前例ができたと言えますね？
  event_staranis2_01_s_169:
    speaker: femaleannouncer
    en: Yes. With Tetra backing them, this is basically a declaration that they're
      pushing the group straight into the mainstream.
    ko: |-
      예. 테트라의 지원은 절대적이에요.
      이건 메이저로 올리겠다는 선전포고와 다름없어요.
    ja: |-
      はい。テトラの影響力は絶対的ですから。
      このアイドルをメジャーに上げるという
      業界への宣戦布告も同然です。
  event_staranis2_01_s_170:
    speaker: maleannouncer
    en: Well, that's interesting.
    ko: 아무튼 재밌는 이야기네요.
    ja: とにかく、面白くなってきました。
  event_staranis2_01_s_171:
    speaker: maleannouncer
    en: Guess we'll see what Tetra's decision does to the pop star scene.
    ko: 과연 테트라의 이 선택이, 춘추 아이돌 시대에 어떤 변화를 불러올지 기대됩니다.
    ja: |-
      果たしてテトラの選択が、アイドル戦国時代に
      どのような波を起こすのか。
      これからが楽しみです。
  event_staranis2_01_s_172:
    speaker: maleannouncer
    en: All right, let's move on to the next story.
    ko: 자, 그럼 다음 뉴스로 가볼까요?
    ja: さて、次のヘッドラインは？
  event_staranis2_01_s_173:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_174:
    speaker: riss
    en: They've already... made the announcement. That was fast.
    ko: 공식 발표를… 했네요. 빠르다.
    ja: 公式発表…されちゃいましたね。早い…
  event_staranis2_01_s_175:
    speaker: riss
    en: W-we've... moved up to 11th.
    ko: 저, 저희… 11위로 올랐어요.
    ja: わ、私たち…11位に上がってます。
  event_staranis2_01_s_176:
    speaker: riss
    en: A-all they did was announce it, and... we jumped two spots.
    ko: 바, 발표 하나 했을 뿐인데… 2위나 올랐어요.
    ja: は、発表されただけで…2位も上がってる。
  event_staranis2_01_s_177:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_s_178:
    speaker: "<Narration>"
    en: Hanson yanks the door open and storms out.
    ko: 한슨은 거칠게 문을 열고 밖으로 나갔다.
    ja: ハンソンは荒々しくドアを開き、飛び出した
event_staranis2_01_e:
  event_staranis2_01_e_1:
    speaker: mustang_past
    en: Break it. That'll cost you 20 billion.
    ko: 위약금 200억.
    ja: 違約金は200億だ。
  event_staranis2_01_e_2:
    speaker: hanson
    en: Must you be so petulant again?
    ko: 또 떼를 쓰시는군요.
    ja: また無理を言いますね。
  event_staranis2_01_e_3:
    speaker: mustang_past
    en: No, that's a fair price.
    ko: 아니지. 정당한 금액이다.
    ja: 無理だと？これが妥当な相場だ。
  event_staranis2_01_e_4:
    speaker: mustang_past
    en: That's what Tetra spent on them under the contract.
    ko: 네 아이돌이 테트라의 지원을 받는다는 계약서를 기준으로 들이부은 마케팅 비용에 대한 금액이다.
    ja: |-
      テトラによる活動支援という
      契約内容に見合った
      マーケティング費用からすれば、な。
  event_staranis2_01_e_5:
    speaker: mustang_past
    en: Why would I throw that kind of money at outsiders?
    ko: 우리 가족이 아닌 것들한테 그만한 금액을 쏟을 이유가 없지.
    ja: |-
      身内でもない奴に、
      大金を使ってやる理由もない。
  event_staranis2_01_e_6:
    speaker: mustang_past
    en: Go on, break it.
    ko: 계약은 파기할 수 있다.
    ja: 契約の破棄はいつでもできるぞ。
  event_staranis2_01_e_7:
    speaker: mustang_past
    en: Just be sure you can afford the penalty.
    ko: 단, 위약금은 내야 해.
    ja: ただし、違約金は払ってもらうがな。
  event_staranis2_01_e_8:
    speaker: hanson
    en: Do you really think this would make me submit to you?
    ko: 이런다고 제가 순순히 당신 밑에 들어갈 것 같습니까?
    ja: そう言われて、私が大人しく従うとでも？
  event_staranis2_01_e_9:
    speaker: mustang_past
    en: Oh, you will.
    ko: 그럴 것 같은데.
    ja: それ以外にないだろう。
  event_staranis2_01_e_10:
    speaker: mustang_past
    en: If you want to protect those precious pop stars of yours, you'll come crawling
      back.
    ko: |-
      네 소중한 아이돌을 나한테서 지키기 위해서,
      너는 다시 돌아와야 해.
    ja: |-
      お前が大事なアイドルを守りたいなら、
      ここへ戻ってくるしかない。
  event_staranis2_01_e_11:
    speaker: mustang_past
    en: What other choice do you have?
    ko: 다른 방법이 있나?
    ja: 他に方法でもあるのか？
  event_staranis2_01_e_12:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_13:
    speaker: hanson
    en: "*Sigh*"
    ko: "…후우."
    ja: "…はぁ…"
  event_staranis2_01_e_14:
    speaker: hanson
    en: Very well,
    ko: 좋습니다.
    ja: いいでしょう。
  event_staranis2_01_e_15:
    speaker: hanson
    en: I'll return.
    ko: 다시 돌아가겠습니다.
    ja: テトラに復職します。
  event_staranis2_01_e_16:
    speaker: hanson
    en: But T.T. STAR remains under my management.
    ko: 단, T.T. STAR의 관리는 여전히 제가 합니다.
    ja: |-
      ただし、T.T. STARのマネジメントは
      今まで通り私が担当します。
  event_staranis2_01_e_17:
    speaker: mustang_past
    en: Go on. That's the deal you signed, isn't it? Do whatever you like.
    ko: 그래. 애초에 그런 계약이니까. 그건 맘대로 해라.
    ja: |-
      ああ。最初からそういう契約だ。
      そこは好きにしろ。
  event_staranis2_01_e_18:
    speaker: mustang_past
    en: But you did read the contract, right?
    ko: 단, 계약서를 봐서 알겠지만.
    ja: だが、契約書を見たなら、分かってると思うが。
  event_staranis2_01_e_19:
    speaker: mustang_past
    en: You don't get to refuse anything Tetra Line requires of you.
    ko: 테트라 라인에서 요구하는 마케팅 및 홍보 활동에 대한 거부권은 없다.
    ja: |-
      マーケティングおよび宣伝活動に関する
      テトララインからの要求に対して、
      お前たちに拒否権はない。
  event_staranis2_01_e_20:
    speaker: mustang_past
    en: The second you do, the contract's void. And you'll repay every last credit
      I invested.
    ko: |-
      어기는 순간, 계약 파기야.
      그동안 쏟아부은 돈은 다 뱉어야 하고.
    ja: |-
      拒否した瞬間、契約は破棄扱いだ。
      それまでに使った金も、
      全部返してもらうことになる。
  event_staranis2_01_e_21:
    speaker: hanson
    en: Noted.
    ko: 기억하고 있습니다.
    ja: 目を通しています。
  event_staranis2_01_e_22:
    speaker: mustang_past
    en: Good.
    ko: 좋아.
    ja: そうか。
  event_staranis2_01_e_23:
    speaker: mustang_past
    en: Let's have some fun and turn those things into the greatest pop stars this
      industry's ever seen.
    ko: 같이 힘내보자고. 그것들을 최고의 아이돌로 만들기 위해.
    ja: |-
      では、一緒に頑張っていこうじゃないか。
      あいつらを最高のアイドルにしてやるために。
  event_staranis2_01_e_24:
    speaker: hanson
    en: You've got a lot to say for someone who can't even remember their names.
    ko: 이름도 기억 못 하는 주제에 잘도 말하는군요.
    ja: |-
      名前もろくに覚えていないくせに、
      よく言えたものですね。
  event_staranis2_01_e_25:
    speaker: mustang_past
    en: Heh heh.
    ko: 하하.
    ja: ハハハ…
  event_staranis2_01_e_26:
    speaker: mustang_past
    en: I'll have those things perform.
    ko: 그것들을 위한 공연을 준비할 거다.
    ja: もうステージを準備させてある。
  event_staranis2_01_e_27:
    speaker: mustang_past
    en: Give them the best facility, the best staff,
    ko: 최고의 시설, 최고의 스태프를 붙여주지.
    ja: 最高の設備も最高のスタッフも付けてな。
  event_staranis2_01_e_28:
    speaker: mustang_past
    en: and Tetra Line Concert Hall. I'll spare no expense.
    ko: 장소는 테트라 라인 콘서트홀.
    ja: 会場はテトラライン・コンサートホール…
  event_staranis2_01_e_29:
    speaker: mustang_past
    en: And the audience? Just me.
    ko: 관객은 나 하나다.
    ja: 観客は俺一人だ。
  event_staranis2_01_e_30:
    speaker: mustang_past
    en: I want to see for myself why you're so obsessed with them.
    ko: |-
      네가 대체 뭐 때문에 그것들을 그렇게 싸고도는지,
      내 눈으로 직접 보겠다.
    ja: |-
      お前がなんでそこまで
      あんな奴らをかばうのか、
      この目で直接確かめてやる。
  event_staranis2_01_e_31:
    speaker: mustang_past
    en: After that, I'll decide how to turn them into superstars.
    ko: 그 이후, 그것들을 톱스타로 만들 방법을 궁리해 보지.
    ja: |-
      トップスターにする方法は、
      その後でじっくり考えてやろう。
  event_staranis2_01_e_32:
    speaker: hanson
    en: "... That won't be necessary. I'll handle it myself."
    ko: "…그냥 두시죠. 제가 알아서 하겠습니다."
    ja: "…構わないでください。それは私の仕事です。"
  event_staranis2_01_e_33:
    speaker: mustang_past
    en: What, you think I'd just leave them be?
    ko: 그럴 수야 있나.
    ja: そうはいかんな。
  event_staranis2_01_e_34:
    speaker: mustang_past
    en: They're my company's pop stars. Of course, I keep an eye on what's mine.
    ko: 우리 회사의 소중한 아이돌인데, 내가 신경 써야지.
    ja: |-
      我が社の大切なアイドルだ、
      俺がしっかり面倒を見てやらないと、なあ？
  event_staranis2_01_e_35:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_36:
    speaker: mustang_past
    en: Now that's a look I haven't seen in a while.
    ko: 오랜만에 보는 만족스러운 표정이군.
    ja: 久しぶりにそのツラを見せたな。
  event_staranis2_01_e_37:
    speaker: mustang_past
    en: It suits you far better.
    ko: 너는 역시 그런 표정이 어울려.
    ja: やっぱり、お前にはそういう顔がお似合いだ。
  event_staranis2_01_e_38:
    speaker: hanson
    en: Are you satisfied?
    ko: 만족하십니까.
    ja: 満足ですか？
  event_staranis2_01_e_39:
    speaker: hanson
    en: Watching me reduced to this... struggling under your control and unable to
      do anything.
    ko: |-
      당신 뜻대로 제가 당신 밑에서,
      아무것도 못 하면서 허우적대는 꼴을 봐서.
    ja: |-
      望み通り、あなたの下で何もできずに
      もがく私が見られて。
  event_staranis2_01_e_40:
    speaker: mustang_past
    en: Oh, I'm enjoying this far too much.
    ko: 그래. 더할 나위 없이.
    ja: ああ。最高の気分だ。
  event_staranis2_01_e_41:
    speaker: mustang_past
    en: If it bothers you that much, come try and take me down.
    ko: 억울하면 나를 밟아라.
    ja: 悔しければ、蹴落としてみろ。
  event_staranis2_01_e_42:
    speaker: mustang_past
    en: You're not just going to stand there and let them slip away, as you did with
      Pretty, are you?
    ko: 사랑하는 프리티처럼, 손도 못 대고 보내면 안 되잖아?
    ja: |-
      大事なプリティーのように、
      また手も出せないまま見送るのは嫌だろう？
  event_staranis2_01_e_43:
    speaker: hanson
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis2_01_e_44:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_45:
    speaker: "<Narration>"
    en: Hanson turns and leaves.
    ko: 한슨이 뒤돌아 나간다.
    ja: ハンソンは背中を向け、社長室を出ていった
  event_staranis2_01_e_46:
    speaker: "<Narration>"
    en: Mustang watches him go, clearly pleased.
    ko: 머스탱은 그 모습을 만족스럽게 바라본다.
    ja: マスタングはその背中を満足げに見送った
  event_staranis2_01_e_47:
    speaker: mustang_past
    en: Now that's entertainment.
    ko: 엔터테인먼트.
    ja: エンターテイメント。
  event_staranis2_01_e_48:
    speaker: mustang_past
    en: Stop.
    ko: Stop.
    ja: Stop.
  event_staranis2_01_e_49:
    speaker: mustang_past
    en: C'est bon, no need to go any further.
    ko: 이제 됐습니Da. 더 하지 않아도 Fine합니Da.
    ja: もう十分でSU。ここまででいいでSHOW。
  event_staranis2_01_e_50:
    speaker: "<Narration>"
    en: T.T. STAR falters, then comes to a stop mid-routine, looking bewildered.
    ko: |-
      T.T. STAR가 멈칫한다.
      어리둥절해하며 안무를 멈춘다.
    ja: |-
      T.T. STARはたじろぎ、
      戸惑いながらダンスを止めた
  event_staranis2_01_e_51:
    speaker: anis_idol
    en: Wha...? But you haven't seen the best part yet!
    ko: |-
      어… 예?
      아, 아직 하이라이트 안 보여드렸는데.
    ja: |-
      え…もう？
      ま、まだ一番いいところを
      見せられてないんですけど…
  event_staranis2_01_e_52:
    speaker: mustang_past
    en: C'est bon, I've seen enough.
    ko: |-
      괜찮습니Da.
      충분히 See 했습니Da.
    ja: |-
      大丈夫でSU。
      十分にSeeしましTA。
  event_staranis2_01_e_53:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_54:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_55:
    speaker: "<Narration>"
    en: Mustang stands up from his seat.
    ko: 머스탱이 관객석에서 일어난다.
    ja: マスタングが観客席から立ち上がった
  event_staranis2_01_e_56:
    speaker: mustang_past
    en: C'est acceptable.
    ko: 수고하셨습니Da.
    ja: お疲れ様でしTA。
  event_staranis2_01_e_57:
    speaker: "<Narration>"
    en: With that, he heads for the exit.
    ko: 머스탱이 밖으로 걸어간다.
    ja: それだけ言って、マスタングはホールを出た
  event_staranis2_01_e_58:
    speaker: "<Narration>"
    en: Onstage, Anis, Mint, and Prika freeze mid-dance, staring after him.
    ko: 무대 위에서 춤을 추고 있던 셋은 멍하니 그 모습을 바라본다.
    ja: |-
      ステージの上でダンスを止められた3人は、
      呆然とその様子を見ていることしかできなかった
  event_staranis2_01_e_59:
    speaker: "<Narration>"
    en: The music cuts off, and the staff begins clearing the stage.
    ko: 음악이 꺼지고, 스태프들이 철수한다.
    ja: 音楽が止まり、スタッフは撤収作業を始めている
  event_staranis2_01_e_60:
    speaker: anis_idol
    en: What... the...?
    ko: 뭐… 야.
    ja: どういう…こと…？
  event_staranis2_01_e_61:
    speaker: mint_o
    en: Isn't it obvious? The test's over.
    ko: 뭐긴 뭐야. 테스트 끝났다는 거지.
    ja: |-
      どういうことって、
      テストは終わりってことでしょ。
  event_staranis2_01_e_62:
    speaker: prika_o
    en: What do you think the result's gonna be?
    ko: 결과는 어떨 것 같은데?
    ja: どういう評価だと思う？
  event_staranis2_01_e_63:
    speaker: mint_o
    en: He didn't even stay to the end. That tells us everything, doesn't it? I suppose
      we're done for.
    ko: |-
      다 보지도 않고 갔으니 뻔한 거 아니겠어?
      망했지 뭐.
    ja: |-
      全部見ないで出ていくなんて、
      分かり切ってるでしょう？不合格よ。
  event_staranis2_01_e_64:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_65:
    speaker: anis_idol
    en: "... B-but Tetra really is something else, huh?"
    ko: "……그, 그래도 테트라는 다르긴 하네! 응!"
    ja: |-
      …そ、それにしても、
      テトラってやっぱ違うね！ねえ！？
  event_staranis2_01_e_66:
    speaker: anis_idol
    en: Check out this stage! The equipment's insane!
    ko: 와 무대 봐! 장비들도 다 장난 아냐!
    ja: |-
      見てよこのステージ！
      機材もやばいし！
  event_staranis2_01_e_67:
    speaker: anis_idol
    en: A-and, uh... look over here!
    ko: 그, 그리고 여기!
    ja: そ、それにさ！
  event_staranis2_01_e_68:
    speaker: "<Narration>"
    en: Anis raises her hand and gestures to the empty seats.
    ko: 아니스가 손을 들어 텅 빈 관객석을 가리킨다.
    ja: |-
      アニスは腕を上げ、
      誰もいない観客席を指さした
  event_staranis2_01_e_69:
    speaker: anis_idol
    en: Isn't this place massive?
    ko: 관객석 엄청나지 않아?
    ja: 広すぎじゃない？
  event_staranis2_01_e_70:
    speaker: anis_idol
    en: Man, if we packed this place out for a show, that would be epic, right?!
    ko: 와~ 여기 가득 채우고 공연하면 진짜 죽여주겠다! 그치?
    ja: |-
      ここをお客さんでいっぱいにして
      ライブが出来たら、感動しちゃいそう！ねえ？
  event_staranis2_01_e_71:
    speaker: mint_o
    en: "... Mhm, yeah."
    ko: 뭐… 그렇긴 하네.
    ja: まあ…確かにそうね。
  event_staranis2_01_e_72:
    speaker: prika_o
    en: Wonder when that day'll come.
    ko: 언제 올까. 그런 날이.
    ja: いつ来るんだろうな。そんな日は。
  event_staranis2_01_e_73:
    speaker: anis_idol
    en: Man, did you see that today? The staff, the equipment... These guys aren't
      playing around! We're getting there, I can feel it!
    ko: |-
      오늘 보니까 스태프며 장비며 다들 수준 장난 아니었잖아!
      곧 되겠지!
    ja: |-
      今日見た感じ、
      スタッフの人も機材も最高だったし！
      すぐに来るって！
  event_staranis2_01_e_74:
    speaker: anis_idol
    en: With Tetra's support, all that's left is to shoot straight upward!
    ko: |-
      테트라의 가호를 받은 우리는!
      이제 쭉쭉 위로 올라갈 일만 남은 거야!
    ja: |-
      私たち、テトラの加護を受けて！
      トップスター街道まっしぐらよ！
  event_staranis2_01_e_75:
    speaker: anis_idol
    en: If we do that,
    ko: 그렇게 쭉쭉 올라가다 보면!
    ja: |-
      だから、この調子でどんどん上に
      上がっていけば…
  event_staranis2_01_e_76:
    speaker: anis_idol
    en: we'll become something truly special!
    ko: 우리는 특별해질 수 있어.
    ja: きっと特別な何かになれるはず。
  event_staranis2_01_e_77:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_78:
    speaker: mint_o
    en: You're good with words, as always.
    ko: 하여간 말은.
    ja: トークだけはうまいわね。
  event_staranis2_01_e_79:
    speaker: riss
    en: G-good work, everyone. They said we can head back and rest now.
    ko: |-
      다, 다들 고생했어.
      돌아가서 휴식하면 된대.
    ja: |-
      み、みんなお疲れ様。
      戻って休んでいいって。
  event_staranis2_01_e_80:
    speaker: anis_idol
    en: Seriously? That's it?
    ko: 응? 오늘 일정은 이게 끝?
    ja: えっ？今日はこれだけ？
  event_staranis2_01_e_81:
    speaker: riss
    en: Y-yeah.
    ko: 으, 응.
    ja: う、うん。
  event_staranis2_01_e_82:
    speaker: anis_idol
    en: Whoa, this schedule's way too chill.
    ko: 우와, 스케줄 널널한 거 봐.
    ja: うわ…余裕のスケジュールってやつね。
  event_staranis2_01_e_83:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_84:
    speaker: anis_idol
    en: Oh, B-Boss!
    ko: 아, 사, 사장님.
    ja: あ、しゃ、社長。
  event_staranis2_01_e_85:
    speaker: anis_idol
    en: I didn't realize you were here, haha.
    ko: 사장님도… 계셨네요. 하하.
    ja: 社長も…いたんですね。あはは…
  event_staranis2_01_e_86:
    speaker: anis_idol
    en: Th-this place is incredible, huh? I-I've never seen anything like it before...
    ko: 여, 여기 진짜 시설 좋죠? 와아. 저 이런 거 진짜 처음 봐서 너무….
    ja: |-
      こ、ここの設備って本当にすごいですね？
      私、こんなの生まれて初めて見て…
  event_staranis2_01_e_87:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_88:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_89:
    speaker: anis_idol
    en: You still mad at us?
    ko: 아직… 화 많이 났어요?
    ja: まだ…怒ってますか？
  event_staranis2_01_e_90:
    speaker: anis_idol
    en: "... I'm sorry, we should've run it by you first."
    ko: "…미안해요. 아무리 그래도 사장님이랑 논의하고 하는게 맞았는데."
    ja: |-
      …ごめんなさい。社長と話し合ってから
      決めないといけないことだったのに。
  event_staranis2_01_e_91:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_92:
    speaker: hanson
    en: Don't worry about it. It's all in the past.
    ko: 됐어. 지난 일인데 뭘.
    ja: 気にするな。もう決まったことだ。
  event_staranis2_01_e_93:
    speaker: hanson
    en: This place is incredible. Performing here would feel like a dream.
    ko: 시설 좋다. 이런 곳에서 공연한다면 정말 꿈만 같을 거야.
    ja: |-
      いいハコだ。
      こんな場所でやれたら、夢みたいだろうな。
  event_staranis2_01_e_94:
    speaker: anis_idol
    en: R-right...?
    ko: 그, 그렇죠?
    ja: そ、そうですよね？
  event_staranis2_01_e_95:
    speaker: hanson
    en: I'll do everything I can to make that happen.
    ko: 내가 꼭 그렇게 만들어줄게.
    ja: 必ず叶えてやる。
  event_staranis2_01_e_96:
    speaker: anis_idol
    en: "... Okay."
    ko: "…알겠어요."
    ja: "…はい。"
  event_staranis2_01_e_97:
    speaker: anis_idol
    en: Um...
    ko: 그….
    ja: あの…
  event_staranis2_01_e_98:
    speaker: anis_idol
    en: Have you, um... had a chance to talk to your dad?
    ko: 아, 아버지랑은 좀 얘기해 보셨어요?
    ja: お、お父さんと話はできました？
  event_staranis2_01_e_99:
    speaker: hanson
    en: Oh... yeah.
    ko: 아… 응.
    ja: ああ…まあな。
  event_staranis2_01_e_100:
    speaker: hanson
    en: It's a little... complicated.
    ko: 아직은 좀… 쉽지 않네.
    ja: まだ…難しそうだ。
  event_staranis2_01_e_101:
    speaker: anis_idol
    en: It'll get better, I'm sure of it.
    ko: 그래도, 좋아지겠죠?
    ja: でも、きっと仲良くなれますよね？
  event_staranis2_01_e_102:
    speaker: anis_idol
    en: Blood is thicker than water, after all.
    ko: 아, 저는 부모님 얼굴도 본 적 없어서 잘 모르지만.
    ja: |-
      私、親の顔は見たことなくて
      よく分からないですけど…
  event_staranis2_01_e_103:
    speaker: anis_idol
    en: Though I wouldn't know. I've never even seen my parents.
    ko: 혈연관계라는 건 떼려야 뗄 수 없는 강한 유대감 같은 걸로 이어져 있대요.
    ja: |-
      血のつながりって、
      切っても切れない強いものだって聞いてます。
  event_staranis2_01_e_104:
    speaker: anis_idol
    en: But for you, it's going to get better. Definitely.
    ko: 그러니 좋아질 거에요. 반드시.
    ja: だから、大丈夫です。絶対。
  event_staranis2_01_e_105:
    speaker: hanson
    en: "... Yes, thank you."
    ko: "…그래. 고맙다."
    ja: "…ああ。ありがとう。"
  event_staranis2_01_e_106:
    speaker: hanson
    en: All right, everyone. You did great today. Let's get some rest and put everything
      else aside for now.
    ko: 자! 다들 수고 많았어! 오늘은 일단 아무 생각 하지 말고 쉬자!
    ja: |-
      みんな！お疲れ様だ！
      今日は何も考えずに休んでくれ！
  event_staranis2_01_e_107:
    speaker: anis_idol
    en: Aye, aye!
    ko: 예, 예!
    ja: は、はいっ！
  event_staranis2_01_e_108:
    speaker: anis_idol
    en: Wait, THIS is our room?!
    ko: 이, 이게 우리 방이라고?
    ja: こ、ここが私たちの部屋？
  event_staranis2_01_e_109:
    speaker: mint_o
    en: Wow...
    ko: 와아….
    ja: わあ…
  event_staranis2_01_e_110:
    speaker: "<Narration>"
    en: Prika strides past and disappears into the showers.
    ko: 프리카가 빠른 걸음으로 걸어가 샤워실로 들어간다.
    ja: プリカが早足で、シャワーを確かめた
  event_staranis2_01_e_111:
    speaker: "<Narration>"
    en: The water roars to life.
    ko: 쏴아아아아---
    ja: ザァァァァ――
  event_staranis2_01_e_112:
    speaker: "<Narration>"
    en: Then, a handle creaks as it turns.
    ko: 끼릭끼릭.
    ja: キュッ、キュッ
  event_staranis2_01_e_113:
    speaker: prika_o
    en: "... This shower room's on another level."
    ko: "…샤워실. 굉장하다."
    ja: "…シャワーも立派だな。"
  event_staranis2_01_e_114:
    speaker: riss
    en: S-so I heard the dorms are basically five-star hotel level.
    ko: 서, 설명 들었는데. 아이돌용 숙소는 5성급 호텔이랑 같은 퀄리티를 계속 유지한대.
    ja: |-
      せ、説明を聞いてきたけど、
      5つ星ホテルと同じぐらいの
      設備とサービスだって。
  event_staranis2_01_e_115:
    speaker: riss
    en: Th-they even have room service...
    ko: 루, 룸서비스도 된다고….
    ja: ル、ルームサービスもできるって…
  event_staranis2_01_e_116:
    speaker: mint_o
    en: Room service? They even do instant noodles?
    ko: 룸서비스? 라면 같은 것도 되는 거야?
    ja: |-
      ルームサービス？
      ラーメンの宅配みたいなものを頼めるの？
  event_staranis2_01_e_117:
    speaker: riss
    en: Y-yeah, it looks like they've got pretty much everything here.
    ko: 어, 응. 어지간한 메뉴는 다 있는가봐.
    ja: ええと、うん。だいたい何でもあるって。
  event_staranis2_01_e_118:
    speaker: riss
    en: There's a massage area, a sauna, even practice rooms downstairs...
    ko: 그리고 아래층엔 마사지 시설이랑, 사우나, 연습실이 있고….
    ja: |-
      それから下のフロアにマッサージルームと、
      サウナと、トレーニングルームがあって…
  event_staranis2_01_e_119:
    speaker: riss
    en: A-and there's a repair center inside too, so you don't even have to leave
      the building.
    ko: |-
      리, 리페어 센터도 내부에 있다고 해.
      건물 밖으로 나갈 필요가 없는 거지.
    ja: |-
      リ、リペアセンターも中にあるんだって。
      一歩も外へ出なくても過ごせるってこと。
  event_staranis2_01_e_120:
    speaker: riss
    en: There's a dressing room as well. They get new releases from major brands before
      department stores do...
    ko: |-
      그리고 드레스룸도 있어.
      유명 메이커의 신상이 백화점보다 빨리 들어온다고….
    ja: |-
      あとは、有名ブランドの新作が
      デパートより早く入ってくる
      ドレッシングルームがあって…
  event_staranis2_01_e_121:
    speaker: riss
    en: A-and they carry all sizes, so you can try on whatever you want. There aren't
      any strict restrictions on returns, either.
    ko: |-
      사, 사이즈별로 다 구비되어 있으니 마음껏 입어볼 수 있대.
      반납 제한도 딱히 없고.
    ja: |-
      サ、サイズも全部揃えてあって、
      試着も返品も自由にできるって。
  event_staranis2_01_e_122:
    speaker: anis_idol
    en: Wow...
    ko: "…와."
    ja: "…わあ。"
  event_staranis2_01_e_123:
    speaker: "<Narration>"
    en: Riss looks around the lodging.
    ko: 리스가 숙소를 둘러본다.
    ja: リスが宿所を見渡した
  event_staranis2_01_e_124:
    speaker: "<Narration>"
    en: It looks just like the luxury hotels she's only ever seen on TV.
    ko: TV나 매체에서만 보던 고급 호텔의 모습이 그대로 보인다.
    ja: |-
      どこを見てもテレビか何かの
      メディアでしか見たことのないような
      高級ホテルのたたずまいだ
  event_staranis2_01_e_125:
    speaker: riss
    en: You can rest and practice here... It's perfect for pop... stars...
    ko: 여기서 충분히 휴식을 취하면서, 연습도 할 수 있는 아이돌을 위한 완벽한 시… 설….
    ja: |-
      ゆっくり休みながら練習もできるし、
      アイドルにとって完璧な…完璧な…
  event_staranis2_01_e_126:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_127:
    speaker: riss
    en: Th-the facilities are... really... so... everyone...
    ko: 시, 시설. 시설… 이니까… 다들….
    ja: し、しせ、施設…だから…みんな…
  event_staranis2_01_e_128:
    speaker: anis_idol
    en: "... You okay, Riss?"
    ko: "…왜 그래."
    ja: "…どうしたの？"
  event_staranis2_01_e_129:
    speaker: riss
    en: S-sorry, I really didn't mean to cry...
    ko: 미, 미안. 우, 울 생각은 없었는데….
    ja: |-
      ご、ごめん。な、泣くつもりは
      なかったんだけど…
  event_staranis2_01_e_130:
    speaker: riss
    en: We've all been through so much... and now... to be treated like this... it
      just feels...
    ko: 다들… 그렇게 고생만 했는데… 이런 대우를 받는다는 게… 너무….
    ja: |-
      今まで…苦労してきたみんなが…
      こんないいところで過ごせるようになって…
  event_staranis2_01_e_131:
    speaker: riss
    en: I'm just... really, really glad...
    ko: 너무 다행이다 싶어서….
    ja: 本当によかったって思って、私…
  event_staranis2_01_e_132:
    speaker: mint_o
    en: Come on, don't cry. You're going to make me cry too.
    ko: 아 정말. 울고 그래 왜.
    ja: もう、だからって泣くことはないでしょ？
  event_staranis2_01_e_133:
    speaker: prika_o
    en: Um... I'm gonna go shower.
    ko: 그, 나는 어, 샤워하러 갈래.
    ja: わ…私はシャワー浴びてくる。
  event_staranis2_01_e_134:
    speaker: riss
    en: Y-you guys have all worked so hard.
    ko: 다들, 다들 정말 고생 많았어.
    ja: みんな、本当に本当に、お疲れ様。
  event_staranis2_01_e_135:
    speaker: riss
    en: Things are going to be good from here on out.
    ko: 앞으로는 좋은 일만 있을 거야.
    ja: これからは、いいことばっかりのはず。
  event_staranis2_01_e_136:
    speaker: "<Narration>"
    en: In a meeting room at Tetra Line's entertainment planning department.
    ko: 테트라 라인 엔터테인먼트 개발 회의실.
    ja: |-
      テトラライン
      エンターテイメント企画会議室
  event_staranis2_01_e_137:
    speaker: "<Narration>"
    en: Around twenty people are seated inside.
    ko: 스무 명 남짓한 인원이 회의실에 앉아 있다.
    ja: 20名あまりの社員が顔をそろえている
  event_staranis2_01_e_138:
    speaker: "<Narration>"
    en: At the center, Mustang watches the massive screen and begins to speak.
    ko: 머스탱은 중앙 자리에서 거대한 화면을 바라보며 말했다.
    ja: |-
      中央の席で存在感を放つマスタングが、
      巨大なスクリーンに目を向けながら、口を開いた
  event_staranis2_01_e_139:
    speaker: mustang_past
    en: Well, that about settles it.
    ko: 대충 결론은 나온 모양이군.
    ja: だいたい結論は出たようだな。
  event_staranis2_01_e_140:
    speaker: mustang_past
    en: They're not fit to be pop stars. There's nothing special about them, and their
      individual skills are downright pathetic.
    ko: |-
      아이돌로 써먹을 순 없다.
      특별할 것 하나 없고, 개개인의 기량도 너무 떨어져.
    ja: |-
      アイドルとして売り物にならん。
      これといった個性もない、
      個別のスキルも論外だ。
  event_staranis2_01_e_141:
    speaker: mustang_past
    en: That blond one is passable, but even she's only small-time at best.
    ko: |-
      그 노랑머리는 좀 괜찮은 것 같지만,
      그래봤자 마이너 수준이야.
    ja: |-
      金髪の奴は少しはマシみたいだが、
      それも二流リーグでならの話だ。
  event_staranis2_01_e_142:
    speaker: mustang_past
    en: We'll have to package them and carry them on image alone.
    ko: 이미지 메이킹으로 승부를 볼 수밖에 없겠어.
    ja: イメージ作りで勝負するしかない。
  event_staranis2_01_e_143:
    speaker: mustang_past
    en: "... Tch, that's a headache. We've already used up everything worth using."
    ko: 그런데… 쓰읍. 지금 쓸만한 건 다 썼는데.
    ja: |-
      とはいえ…それもな。
      手アカのついたネタばかりだ。
  event_staranis2_01_e_144:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_145:
    speaker: "<Narration>"
    en: Mustang taps his finger on the table.
    ko: 머스탱이 테이블을 손가락으로 톡톡 친다.
    ja: マスタングが指でテーブルを叩きはじめた
  event_staranis2_01_e_146:
    speaker: "<Narration>"
    en: For a while, the sound of soft tapping is all that fills the room.
    ko: 회의실에는 한동안 그 소리만 들려왔다.
    ja: しばらくの間、会議室にその音だけが響いた
  event_staranis2_01_e_147:
    speaker: "<Narration>"
    en: Then it stops.
    ko: 소리가 멈춘다.
    ja: ふいに、音が止まった
  event_staranis2_01_e_148:
    speaker: mustang_past
    en: Hey, you've got the Ark's stress metrics ready, right? Pull them up.
    ko: 어이. 지금 방주 내 불안도와 스트레스 수치 조사해 놓은 거 있지? 띄워봐.
    ja: |-
      おい。アークの不安度とストレス値の
      調査資料があったな？出せ。
  event_staranis2_01_e_149:
    speaker: "<Narration>"
    en: The screen changes.
    ko: 화면이 바뀐다.
    ja: スクリーンが切り替わった
  event_staranis2_01_e_150:
    speaker: mustang_past
    en: Just as I thought, the failed surface reclamation hit harder than expected.
      And on top of that, Pretty's dead.
    ko: |-
      …역시. 지상 탈환전이 실패한 게 큰가.
      거기다 프리티가 죽은 것까지.
    ja: |-
      …やはり、地上奪還戦の挫折が大きい。
      それにプリティーの事件の影響も…
  event_staranis2_01_e_151:
    speaker: mustang_past
    en: No surprise the stress is piling up. At this rate, something in the Ark is
      bound to snap.
    ko: |-
      스트레스가 상당히 쌓이고 있군.
      이대로는 방주에서 뭔 일이 일어나도 이상하지 않아.
    ja: |-
      不満がそうとう溜まってるな。
      このままじゃ、いつ爆発してもおかしくない。
  event_staranis2_01_e_152:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_01_e_153:
    speaker: mustang_past
    en: Good, we'll use them as the outlet.
    ko: 좋아. 그것들을 이걸 해소하는 쓰레기통으로 쓴다.
    ja: |-
      ちょうどいい。
      ガス抜きの道具に使ってやるとするか。
  event_staranis2_01_e_154:
    speaker: mustang_past
    en: Take those things and come up with two proposals each. I want ways to let
      the Ark's citizens vent their stress.
    ko: 그것들을 사용해 방주 시민들의 스트레스를 해소할 수 있는 방향으로, 안을 각자 2개씩 만들어와.
    ja: |-
      奴らを使った庶民のストレス解消法、
      ひとり2つずつ考えてこい。
  event_staranis2_01_e_155:
    speaker: mustang_past
    en: I don't care how far you push it. Have them ready by this time tomorrow.
    ko: |-
      수위는 상관없다.
      내일 이 시간까지 준비해 와.
    ja: |-
      どれだけ過激でも構わん。
      明日のこの時間までに用意しろ。
  event_staranis2_01_e_156:
    speaker: mustang_past
    en: I'll wire a billion to whoever I pick. Dismissed.
    ko: |-
      채택되는 녀석에겐 10억을 꽂아주지.
      해산.
    ja: |-
      採用された奴にはボーナス10億だ。
      解散。
  event_staranis2_01_e_157:
    speaker: "<Narration>"
    en: The meeting room empties in a flurry of movement.
    ko: 회의실에 앉아 있던 이들이 분주하게 움직이며 회의실을 나선다.
    ja: |-
      座っていた社員たちが
      あわただしく会議室を退出した
  event_staranis2_01_e_158:
    speaker: "<Narration>"
    en: Left alone, Mustang stares at the screen as a smile forms on his lips.
    ko: 머스탱은 텅 빈 회의실에서 모니터를 빤히 바라보며 미소 지었다.
    ja: |-
      会議室にただ一人残ったマスタングは
      スクリーンをにらみながら、口の端をゆがめた
event_staranis2_02_s:
  event_staranis2_02_s_1:
    speaker: "<Narration>"
    en: No matter who you are, no matter what you've done,
    ko: 당신이 어떤 사람이든, 어떤 짓을 하든.
    ja: あなたがどんな人でも、何をしても
  event_staranis2_02_s_2:
    speaker: "<Narration>"
    en: the pop stars of your dreams will always smile for you.
    ko: 항상 웃어주는 꿈의 아이돌.
    ja: いつも笑ってくれる夢のアイドル
  event_staranis2_02_s_3:
    speaker: "<Narration>"
    en: You're cordially invited to join T.T. STAR for the Smile Time project.
    ko: T.T. STAR와 함께하는 [스마일 박스] 프로젝트에 당신을 초대합니다.
    ja: |-
      T.T. STARプレゼンツ、
      「スマイルボックス」プロジェクトに
      あなたをご招待！
  event_staranis2_02_s_4:
    speaker: "<Narration>"
    en: Behind the outdoor stage, the same advertisement plays over and over on a
      massive screen.
    ko: |-
      야외 스테이지의 후방,
      큰 화면에는 계속해서 같은 광고가 흘러나오고 있다.
    ja: |-
      野外ステージ後方の大画面には
      同じフレーズが繰り返し流れている
  event_staranis2_02_s_5:
    speaker: "<Narration>"
    en: Anis, Mint, and Prika stand at the center stage, staring blankly ahead.
    ko: 아니스, 민트, 프리카는 무대의 중앙에 선 채 정면을 멀뚱멀뚱 바라보고 있었다.
    ja: |-
      アニス、ミント、プリカは
      ステージの中央に立ち尽くし、
      あっけに取られた顔で正面を見ていた
  event_staranis2_02_s_6:
    speaker: "<Narration>"
    en: Anis glances over her shoulder at the line of bodyguards behind them.
    ko: 아니스는 등 뒤에 서 있는 다수의 경호원들을 바라본다.
    ja: |-
      アニスが背後を見ると、
      大勢のボディガードが並んでいる
  event_staranis2_02_s_7:
    speaker: anis_idol
    en: Uh... I heard we're just supposed to smile and go along with whatever they
      want. That's gonna be okay, right?
    ko: 어… 듣기로는 그냥 다 받아주면서 웃기만 하면 된다고 들었는데, 괜찮은 거 맞겠지?
    ja: |-
      あのさ…とにかく笑顔で
      立ってればいいって話だったけど、
      大丈夫なのよね…？
  event_staranis2_02_s_8:
    speaker: prika_o
    en: Bit much with the bodyguards, don't you think?
    ko: 경호원들이 너무 많은 것 같은데.
    ja: ボディーガードが多すぎる気はするな。
  event_staranis2_02_s_9:
    speaker: mint_o
    en: I guess it really is different with big companies. They even have security
      for something like this.
    ko: 대기업은 다르네. 이런 행사에도 경호원을 붙여주고.
    ja: |-
      大企業は違うわね。
      イベントのボディーガードを
      こんなにたくさんつけてくれるなんて。
  event_staranis2_02_s_10:
    speaker: prika_o
    en: Riss, you heard anything else?
    ko: 리스. 따로 전해 들은 건 뭐 없어?
    ja: リス。他に何も聞いてないのか？
  event_staranis2_02_s_11:
    speaker: riss
    en: N-no, I was just told you only have to smile...
    ko: 으, 응. 나도 그냥 웃기만 하면 된다고 전해 들어서….
    ja: |-
      う、うん。私も、笑顔で立ってればいいとしか
      聞かせてもらえなくて…
  event_staranis2_02_s_12:
    speaker: anis_idol
    en: That's it? Heck, I'm a natural at that.
    ko: 내가 제일 잘 하는 거네.
    ja: 私の一番得意なことね。
  event_staranis2_02_s_13:
    speaker: "<Narration>"
    en: "*Thump*"
    ko: 턱.
    ja: グイッ
  event_staranis2_02_s_14:
    speaker: "<Narration>"
    en: A heavy hand lands on Anis's shoulder.
    ko: 아니스의 어깨에 두터운 손이 올려진다.
    ja: いかつい手がアニスの肩に乗り、動きを制した
  event_staranis2_02_s_15:
    speaker: "<Narration>"
    en: She jumps and spins around.
    ko: 깜짝 놀란 아니스가 뒤를 돌아본다.
    ja: 驚いたアニスは後ろを振り返った
  event_staranis2_02_s_16:
    speaker: "<Narration>"
    en: A bodyguard stares down at her with icy eyes, pressing a finger to his lips
      in a warning.
    ko: 경호원이 싸늘한 눈으로 아니스를 내려다보며 손가락으로 입을 가리는 시늉을 한다.
    ja: |-
      ボディーガードは表情の読めない顔で
      アニスを止め、指を自分の口に当てた
  event_staranis2_02_s_17:
    speaker: "<Narration>"
    en: Her chest tightens, a cold knot twisting in her stomach.
    ko: 아니스는 갑자기 가슴이 철렁 내려앉는 느낌을 받았다.
    ja: アニスは突然、胸の奥に冷たいものを感じた
  event_staranis2_02_s_18:
    speaker: "<Narration>"
    en: Forcing herself to look forward, she sees a line of people waiting.
    ko: |-
      앞을 바라본다.
      줄을 서고 대기 중인 사람들이 보인다.
    ja: |-
      正面に向き直ると、
      人々が列をなしている
  event_staranis2_02_s_19:
    speaker: "<Narration>"
    en: The first person in line steps forward.
    ko: 가장 앞에 서 있던 사람이 다가온다.
    ja: 先頭の誰かが近づいてきた
  event_staranis2_02_s_20:
    speaker: "<Narration>"
    en: They introduce themselves as a fan who's been following them since their Meet
      & Meat days,
    ko: 미트 미트에서부터 지켜봐 왔던 팬이라고 자기를 소개한다.
    ja: |-
      ミートミートの時から
      応援していたファンだと名乗り…
  event_staranis2_02_s_21:
    speaker: "<Narration>"
    en: and ask if they can take a photo with all three of them.
    ko: 셋과 함께 사진을 찍기를 원한다.
    ja: 3人と写真を撮りたいと言った
  event_staranis2_02_s_22:
    speaker: "<Narration>"
    en: Smiling, the girls pose for the picture.
    ko: 셋은 웃으며 팬과 함께 사진을 찍는다.
    ja: 3人はそのファンと一緒に、笑顔で写真を撮った
  event_staranis2_02_s_23:
    speaker: "<Narration>"
    en: The next fan steps up.
    ko: 다음 사람이 다가온다.
    ja: 次の誰かが近づいてきた
  event_staranis2_02_s_24:
    speaker: "<Narration>"
    en: They ask the three of them to form a big heart with their arms.
    ko: 셋이서 함께 팔로 큰 하트를 만들어주길 원한다.
    ja: |-
      3人で一緒に腕で大きなハートを
      作って欲しいというリクエストだった
  event_staranis2_02_s_25:
    speaker: "<Narration>"
    en: The girls smile and oblige.
    ko: 셋은 웃으며 큰 하트를 만든다.
    ja: |-
      3人は笑顔で大きなハートを作り、
      ポーズを取った
  event_staranis2_02_s_26:
    speaker: "<Narration>"
    en: Delighted, the fan snaps a photo and leaves.
    ko: 팬은 즐거워하며 사진을 찍고 돌아간다.
    ja: ファンは嬉しそうに写真を撮り、去っていった
  event_staranis2_02_s_27:
    speaker: "<Narration>"
    en: Another fan comes up.
    ko: 다음 사람이 다가온다.
    ja: 次の誰かが近づいてくる
  event_staranis2_02_s_28:
    speaker: "<Narration>"
    en: He introduces himself as Robert,
    ko: 자신의 이름이 로버라고 알려준다.
    ja: ファンはローバーと名乗った
  event_staranis2_02_s_29:
    speaker: "<Narration>"
    en: and asks Mint to shout, "I love you, Robert."
    ko: 민트에게 사랑해요 로버라고 크게 외쳐달라고 한다.
    ja: |-
      ミントに大声で「ローバー大好き」と
      叫んでほしいとリクエストした
  event_staranis2_02_s_30:
    speaker: "<Narration>"
    en: Mint flinches for a split second, then smiles and yells it out.
    ko: 민트는 잠깐 움찔했지만 웃으며 크게 외친다.
    ja: ミントは少し戸惑ったが、笑顔で応じた
  event_staranis2_02_s_31:
    speaker: "<Narration>"
    en: The fan leaves, replaying the recording again and again.
    ko: 팬은 녹음된 음성을 반복해서 들으며 퇴장한다.
    ja: |-
      録音した音声を何度も聞きながら
      退場していった
  event_staranis2_02_s_32:
    speaker: "<Narration>"
    en: The next fan steps forward.
    ko: 다음 사람이 다가온다.
    ja: 次の誰かが近づいてきた
  event_staranis2_02_s_33:
    speaker: "<Narration>"
    en: They want a photo with them standing between Anis and Prika.
    ko: 아니스와 프리카 사이에서 사진을 찍기를 원한다.
    ja: |-
      アニスとプリカの間に立って、
      写真を撮りたいとリクエストした
  event_staranis2_02_s_34:
    speaker: "<Narration>"
    en: As they move into position, they try to slip an arm around both Anis and Prika's
      waists.
    ko: 둘 사이에 선 팬이 아니스와 프리카의 허리를 감싸려 한다.
    ja: |-
      2人の間に立ったファンは、
      アニスとプリカの腰に手を回そうとした
  event_staranis2_02_s_35:
    speaker: "<Narration>"
    en: A bodyguard steps in quietly and stops them.
    ko: 경호원이 조용히 다가와 점잖게 제지한다.
    ja: |-
      静かに近づいてきたボディガードが
      さりげなく制止した
  event_staranis2_02_s_36:
    speaker: "<Narration>"
    en: With an awkward smile, Anis rests a hand on the fan's shoulder. Prika follows
      her lead, and they take the photo together.
    ko: |-
      멋쩍어하는 팬의 어깨에 손을 올리는 아니스.
      프리카도 그 모습을 보고 팬의 어깨에 손을 올리고 사진을 찍는다.
    ja: |-
      アニスが気まずそうなファンの肩に手を回すと、
      それを見たプリカもファンの肩に手を回し、
      そのまま写真が撮影された
  event_staranis2_02_s_37:
    speaker: "<Narration>"
    en: At that moment, Anis realizes she could do this all day and thinks, "So this
      is what connecting with fans feels like."
    ko: 아니스는 이런 거라면 얼마든지 할 수 있겠다고 생각했다.
    ja: |-
      アニスは、こんなことなら
      いくらでもできると心のうちで考えた
  event_staranis2_02_s_38:
    speaker: "<Narration>"
    en: The thought sends a light warmth through her chest.
    ko: |-
      [팬과 소통하는 게 이런 기분이구나]
      라며 고양감에 휩싸였다.
    ja: |-
      「ファンとのコミュニケーションって
      こんな感じなんだ」と、高揚していた
  event_staranis2_02_s_39:
    speaker: "<Narration>"
    en: Another fan approaches,
    ko: 다음 사람이 다가온다.
    ja: 次の誰かが近づいてきた
  event_staranis2_02_s_40:
    speaker: "<Narration>"
    en: glancing at the bodyguards. One of them gives an almost imperceptible nod.
    ko: |-
      경호원을 슬쩍 쳐다본다.
      경호원이 고개를 아주 작게 고개를 끄덕인다.
    ja: |-
      一瞬、ボディガードに視線を送った。
      ボディガードは首をわずかに縦に振った
  event_staranis2_02_s_41:
    speaker: "<Narration>"
    en: The fan trips, sending the coffee cup in their hand flying.
    ko: |-
      발이 엇갈려 넘어진다.
      손에 들고 있던 커피 컵이 앞으로 날아간다.
    ja: |-
      次の瞬間、足をもつれさせて転び、
      持っていたコーヒーのカップが
      前に飛んだ
  event_staranis2_02_s_42:
    speaker: "<Narration>"
    en: Coffee splashes across Prika's uniform.
    ko: 프리카의 유니폼이 커피로 인해 엉망이 된다.
    ja: プリカの衣装にコーヒーがかかった
  event_staranis2_02_s_43:
    speaker: "<Narration>"
    en: The fan panics, apologizing over and over.
    ko: 다급하게 사과하는 사람.
    ja: そのファンはあわてた様子で謝罪を始めた
  event_staranis2_02_s_44:
    speaker: "<Narration>"
    en: Watching from the side, Hanson flinches.
    ko: 지켜보던 한슨이 움찔한다.
    ja: |-
      様子を見守っていたハンソンが
      落ち着きを失くした
  event_staranis2_02_s_45:
    speaker: "<Narration>"
    en: Prika looks startled for a moment, then quickly smiles it off and reassures
      the fan that it's fine.
    ko: 프리카는 조금 당황했지만, 곧 아무렇지도 않다고 말하며 웃는다.
    ja: |-
      プリカは少し戸惑ったが、
      すぐに何事もなかったかのように笑顔で応じた
  event_staranis2_02_s_46:
    speaker: "<Narration>"
    en: The other fans hesitate. Seeing that, Anis waves them over.
    ko: |-
      머뭇거리는 팬들.
      그들을 보며 아니스가 손짓한다.
    ja: |-
      並んでいた者たちがざわめきはじめる。
      その様子を見たアニスは手招きをした
  event_staranis2_02_s_47:
    speaker: "<Narration>"
    en: They ask for certain poses and lines, snapping photos and recording short
      videos.
    ko: 팬들은 특정 포즈나 멘트를 요구하고, 사진과 짧은 영상을 남긴다.
    ja: |-
      それぞれが希望のポーズやコメントを
      リクエストし、写真や短い動画に
      記録していった
  event_staranis2_02_s_48:
    speaker: "<Narration>"
    en: And just like that, the first day of the Smile Time project comes to an end.
    ko: 스마일 박스 프로젝트의 첫날이 지나갔다.
    ja: |-
      スマイルボックスプロジェクトの初日は
      そうして終わった
  event_staranis2_02_s_49:
    speaker: anis_idol
    en: No way, we're up another spot?!
    ko: 우와. 순위가 또 하나 올랐어.
    ja: わ。順位がまたひとつ上がってる！
  event_staranis2_02_s_50:
    speaker: mint_o
    en: I didn't think an event like that would make such a difference.
    ko: 이런 홍보 활동 하나로 순위가 오르다니 믿기지 않네.
    ja: |-
      こんなイベントだけで順位が上がるなんて
      信じられないわ。
  event_staranis2_02_s_51:
    speaker: riss
    en: I-it was an event with Tetra's name all over it,
    ko: 테, 테트라의 간판이 크게 걸려있는 행사였으니까.
    ja: テ、テトラの看板をかけてるイベントだからね。
  event_staranis2_02_s_52:
    speaker: riss
    en: so it's safe to treat it as one of their official event.
    ko: 사실상 테트라의 공식 홍보 활동이라고 봐도 무방해.
    ja: |-
      実質、テトラ公認の
      プロモーションみたいなものだし。
  event_staranis2_02_s_53:
    speaker: riss
    en: I think what the fans were thinking is that T.T. STAR is going to be pushed
      into the mainstream with Tetra backing them
    ko: "[T.T. STAR는 테트라의 힘을 등에 업고 반드시 메이저가 된다.]"
    ja: |-
      「テトラがバックについたT.T. STARは
      　必ずメジャー入りする」
  event_staranis2_02_s_54:
    speaker: riss
    en: so we should take advantage of these early events while we can.
    ko: |-
      [그러니 미리미리 이런 초기 행사 때 많은 걸 해놔야 한다.]
      같은 느낌일 거야.
    ja: |-
      「だから、はじめのうちに色々やっておこう」
      って感じじゃないかな。
  event_staranis2_02_s_55:
    speaker: riss
    en: A-and later, when they really make it big, it won't be this easy to take photos
      anymore...
    ko: 나, 나중에 우리가 엄청 잘되면 사진 찍는 것도 쉽지 않으니까….
    ja: |-
      しょ、将来、皆がすごく人気になったら、
      ファンと一緒に写真なんて撮れなくなるし…
  event_staranis2_02_s_56:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_57:
    speaker: anis_idol
    en: Hey... you okay, Prika? How's the coffee spill?
    ko: |-
      어… 프리카. 괜찮아?
      커피 쏟은 건 좀 어때?
    ja: |-
      そういえば…プリカ、大丈夫だった？
      コーヒーこぼされたところ、汚れは取れた？
  event_staranis2_02_s_58:
    speaker: prika_o
    en: Yeah, I'm fine. Riss got me a new uniform right away.
    ko: 아, 응. 괜찮아. 리스가 바로 새로운 유니폼 가져다줬고.
    ja: |-
      ああ、うん。大丈夫だ。
      リスがすぐに別の衣装を出してくれたからな。
  event_staranis2_02_s_59:
    speaker: prika_o
    en: "... Something about it feels off."
    ko: "…조금 묘해서."
    ja: "…ただ、何か引っかかったんだよな…"
  event_staranis2_02_s_60:
    speaker: anis_idol
    en: Huh? What do you mean?
    ko: 응? 뭐가?
    ja: え？何かあった？
  event_staranis2_02_s_61:
    speaker: prika_o
    en: "... Nothing, I'm probably overreacting."
    ko: "…아냐. 과민반응이겠지."
    ja: "…いや、何でもない。考えすぎだろう。"
  event_staranis2_02_s_62:
    speaker: anis_idol
    en: Wait, we're not performing?
    ko: 그런데 우리 공연 같은 건 안 한대?
    ja: あと、ライブとかの予定はないの？
  event_staranis2_02_s_63:
    speaker: riss
    en: Um, yeah. For now, we're focusing on promotions. Once things start picking
      up, that's when we'll move to performances.
    ko: 어, 응. 지금은 홍보 활동에만 집중하고, 궤도에 올랐다고 판단하면 그때 한다고 해.
    ja: |-
      あ、うん。今は知名度向上に集中しろって。
      軌道に乗ったと判断できたら
      その時にやるって言ってた。
  event_staranis2_02_s_64:
    speaker: riss
    en: Th-they think it's more effective to go big once, rather than do a lot of
      smaller shows.
    ko: 자, 자잘한 공연 여러 번보다, 큰 거 한방이 더 효과가 좋다고.
    ja: |-
      小さいステージを何回もやるより、
      大きいのを1回やったほうが
      インパクトあるからって。
  event_staranis2_02_s_65:
    speaker: anis_idol
    en: "... Okay, guess we better get some practice in."
    ko: "…좋아. 그럼 연습 해놔야겠네."
    ja: |-
      …そっか。
      じゃ、鈍らないようにしとかないとね。
  event_staranis2_02_s_66:
    speaker: riss
    en: Um... they said you're not allowed to practice on days you have an event scheduled.
    ko: |-
      아, 그.
      홍보 스케줄이 있는 날은 연습 금지래.
    ja: |-
      あ、それが…
      イベントのスケジュールがある日は
      練習しちゃダメなんだって。
  event_staranis2_02_s_67:
    speaker: riss
    en: I-it's so you don't overdo it...
    ko: 커, 컨디션 조절을 위해서 금지라고….
    ja: |-
      コンディションを整えないといけないから、
      練習は禁止だって…
  event_staranis2_02_s_68:
    speaker: anis_idol
    en: Are you serious? That's crazy.
    ko: "…와. 대단해."
    ja: "…へえ。キッチリ分けてるのね。"
  event_staranis2_02_s_69:
    speaker: riss
    en: I-it's Tetra, after all. Anyway, we have an event early tomorrow morning,
      so let's call it a day.
    ko: |-
      테, 테트라니까.
      내일 아침 일찍부터 홍보 스케줄 있으니 오늘은 이만 쉬어.
    ja: |-
      テトラだからね。
      明日も朝早くからPRだし、
      今日はもう休んで。
  event_staranis2_02_s_70:
    speaker: anis_idol
    en: All right! Get some rest, we're going all out again tomorrow!
    ko: 좋아! 그럼 푹 쉬고 내일 또 열심히 해보자고!
    ja: |-
      よーし！じゃあ今日はゆっくり休んで、
      また明日も頑張りましょ！
  event_staranis2_02_s_71:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_72:
    speaker: "<Narration>"
    en: Anis is sure now.
    ko: 아니스는 확신했다.
    ja: アニスは確信した
  event_staranis2_02_s_73:
    speaker: "<Narration>"
    en: She has brushed off the drink spilled on her earlier as an accident.
    ko: 좀 전에 뿌려진 몸에 쏟아진 음료수는 우연이라고 생각했다.
    ja: |-
      最初にドリンクを体にぶちまけられたのは
      たまたまだと考えた
  event_staranis2_02_s_74:
    speaker: "<Narration>"
    en: Two days in a row? She has chalked it up to rotten luck.
    ko: 이틀 연속 비슷한 사고라니, 액땜이라고 생각했다.
    ja: |-
      2日連続で同じようなトラブルが起きたのも、
      かえって厄払いになると考えるようにした
  event_staranis2_02_s_75:
    speaker: "<Narration>"
    en: Even when sticky syrup started coming at her in strange, deliberate arcs toward
      her chest? She tells herself she was overthinking it.
    ko: 이후 묘하게 자기 가슴을 노리고 날아오는 것 같은 끈적한 시럽에 대해서는, 자신이 과민반응 한다고 생각했다.
    ja: |-
      その後まるで自分の胸を狙うかのように
      べたつくシロップを飛ばしてくるやからが
      現れたことも、考えすぎだと思っていた
  event_staranis2_02_s_76:
    speaker: "<Narration>"
    en: But now, there's no denying it.
    ko: 하지만 이번엔 확신했다.
    ja: だが、今度ばかりは疑いようもない
  event_staranis2_02_s_77:
    speaker: "<Narration>"
    en: The instant she sees the ice cream flying straight at her face, she knows.
    ko: 아니스는 자신의 얼굴로 날아오는 아이스크림을 보며 확신했다.
    ja: |-
      アニスは自分の顔めがけて飛んでくる
      アイスクリームを見て確信した
  event_staranis2_02_s_78:
    speaker: "<Narration>"
    en: This is intentional.
    ko: 이건 노린 거다.
    ja: これは偶然の事故ではない
  event_staranis2_02_s_79:
    speaker: "<Narration>"
    en: She dodges, and the ice cream hits the floor with a splat.
    ko: |-
      아니스가 아이스크림을 피한다.
      철퍽. 하고 아이스크림이 바닥에 떨어진다.
    ja: |-
      アニスはアイスクリームをかわした。
      ベシャリという音を立て、
      アイスクリームは地面に落ちた
  event_staranis2_02_s_80:
    speaker: "<Narration>"
    en: Her gaze snaps to the fan who had been grinning expectantly just moments ago.
    ko: 아니스는 좀 전까지 잔뜩 기대하는 표정을 짓고 있던 [팬]을 노려본다.
    ja: |-
      直前まで何かを期待するような顔をしていた
      「ファン」を、アニスはにらみつけた
  event_staranis2_02_s_81:
    speaker: "<Narration>"
    en: Now, that expression warps into panic. Anis strides toward them,
    ko: 당황한 표정으로 바뀐 [팬]을 향해 성큼성큼 걸어간다.
    ja: |-
      戸惑いの表情を浮かべた「ファン」に、
      猛烈な勢いで迫った
  event_staranis2_02_s_82:
    speaker: "<Narration>"
    en: or she tries to.
    ko: 아니, 걸어가려 했다.
    ja: いや、迫ろうとした
  event_staranis2_02_s_83:
    speaker: "<Narration>"
    en: A heavy hand clamps down on her shoulder.
    ko: 어깨에 올려진 두터운 손.
    ja: 肩にいかつい手が置かれた
  event_staranis2_02_s_84:
    speaker: "<Narration>"
    en: Her eyes flick to the bodyguard behind her.
    ko: 아니스는 뒤에 서 있는 경호원을 바라본다.
    ja: アニスはボディガードに向かって振り返った
  event_staranis2_02_s_85:
    speaker: "<Narration>"
    en: '"Smile," he says. Empty eyes stare back at her from behind sunglasses.'
    ko: |-
      [웃어.]라고 말하는 입.
      선글라스 너머로 보이는 영혼 없는 눈빛.
    ja: |-
      口の動きが「笑え」と威圧する。
      サングラスの奥の凍りついた目からは、
      どんな感情も見えてこない
  event_staranis2_02_s_86:
    speaker: "<Narration>"
    en: And in that instant, everything falls into place.
    ko: 아니스는 그 순간 깨달았다.
    ja: その時ようやく、アニスは悟った
  event_staranis2_02_s_87:
    speaker: "<Narration>"
    en: So that's how it is.
    ko: 아, 이런 거구나.
    ja: これは、そういうことなのだ
  event_staranis2_02_s_88:
    speaker: "<Narration>"
    en: Both Mint and Prika also reach the same conclusion.
    ko: 그 순간 민트와 프리카도 깨닫는다.
    ja: ミントとプリカも理解した
  event_staranis2_02_s_89:
    speaker: "<Narration>"
    en: They've been tossed out here like toys.
    ko: 자신들이 장난감으로 던져졌다는 것을.
    ja: 自分たちは、おもちゃにされたのだ
  event_staranis2_02_s_90:
    speaker: anis_idol
    en: Don't screw with me, you little—
    ko: 웃기지 마 이런 빌어먹…!
    ja: ふざけんじゃ…！
  event_staranis2_02_s_91:
    speaker: "<Narration>"
    en: "*Splat*"
    ko: 철퍽.
    ja: ベチャッ――
  event_staranis2_02_s_92:
    speaker: "<Narration>"
    en: Prika scoops up the fallen ice cream and smears it straight into her face.
    ko: 프리카가 바닥에 떨어진 아이스크림을 주워 자신의 얼굴에 쑤시듯 밀어 넣는다.
    ja: |-
      プリカが地面に落ちたアイスクリームを拾い、
      自分の顔に塗りつけた
  event_staranis2_02_s_93:
    speaker: "<Narration>"
    en: She grins through the mess.
    ko: 아이스크림으로 엉망이 된 얼굴로 웃는다.
    ja: |-
      そしてアイスクリームにまみれた顔で、
      笑ってみせた
  event_staranis2_02_s_94:
    speaker: prika_o
    en: Thank you for coming to Smile Time.
    ko: 스마일 박스를 이용해 주셔서 감사합니다.
    ja: |-
      スマイルボックスをご利用いただき、
      ありがとうございます…
  event_staranis2_02_s_95:
    speaker: "<Narration>"
    en: Anis and Mint watch Prika forcing a smile that's already starting to crack.
    ko: 아니스와 민트는 필사적으로 웃고 있는 프리카를 본다.
    ja: |-
      アニスとミントは、
      今にも壊れそうな笑顔を浮かべている
      プリカを見て、目を丸くした
  event_staranis2_02_s_96:
    speaker: "<Narration>"
    en: They know exactly what comes next if this falls apart.
    ko: 그리고 이 판을 부쉈을 때 자신들에게 닥쳐올 상황에 대해서 완벽하게 이해했다.
    ja: |-
      そして、このイベントで事を起こせば
      自分たちの身に何が降りかかってくるのかを
      ようやく完全に理解した
  event_staranis2_02_s_97:
    speaker: "<Narration>"
    en: Crippling penalties. Corporate retaliation.
    ko: 막대한 위약금, 대기업의 횡포.
    ja: 莫大な違約金という名の、大企業が振るう暴力を
  event_staranis2_02_s_98:
    speaker: "<Narration>"
    en: Their future comes into focus with brutal clarity.
    ko: 자신들의 미래에 대해 뚜렷하게 확신한다.
    ja: 自分たちの未来を、思い知らされた
  event_staranis2_02_s_99:
    speaker: "<Narration>"
    en: A star-shaped sticker that has been trampled into the floor until all its
      shine is gone.
    ko: 마구마구 짓밟혀 바닥에 눌어붙은, 반짝임을 잃은 별 모양 스티커.
    ja: |-
      星の形になろうとしていたステッカーは、
      地面に貼られ、踏みにじられ続け、
      汚れて輝きを失くすことが運命づけられたのだ
  event_staranis2_02_s_100:
    speaker: "<Narration>"
    en: With that in mind, the members of T.T. STAR smile.
    ko: T.T. STAR는 웃는다.
    ja: T.T. STARは笑った
  event_staranis2_02_s_101:
    speaker: "<Narration>"
    en: They swallow down the sobs clawing at their throats,
    ko: 터져 나올 것 같은 울음을 꾸역꾸역 삼키며
    ja: あふれ出しそうな涙をこらえながら
  event_staranis2_02_s_102:
    speaker: "<Narration>"
    en: forcing their trembling lips into something that almost looks real.
    ko: 떨리는 입가를 억지로 벌려 웃는다.
    ja: 震える口元を必死につり上げながら
  event_staranis2_02_s_103:
    speaker: hanson
    en: How dare you treat them like this?!
    ko: 이딴 걸 지금! 내 아이돌한테!
    ja: ふざけたマネを、よくも私のアイドルに…！
  event_staranis2_02_s_104:
    speaker: mustang_past
    en: Whoa, easy there. What's got you all riled up?
    ko: 워워. 진정해. 왜 그렇게 흥분한 거야?
    ja: |-
      どうした？落ち着けよ。
      何をそんなに興奮してる？
  event_staranis2_02_s_105:
    speaker: hanson
    en: Stop this at once! What do you think you're doing, offering them up as toys
      to the public?
    ko: |-
      당장 그만두십시오!
      불특정 다수에게 장난감으로 던져주다니 이게 무슨…!
    ja: |-
      直ちにイベントを中止してください！
      こんな玩具にするようなマネ…！
  event_staranis2_02_s_106:
    speaker: mustang_past
    en: Think you can afford the penalty?
    ko: 위약금 낼래?
    ja: 違約金を払うのか？
  event_staranis2_02_s_107:
    speaker: hanson
    en: Yes, I'll pay! Even if it takes the rest of my life, I'll pay every last bit
      of it! So we're done!
    ko: 예! 내겠습니다! 평생이 걸려도 낼 테니까, 그만두겠습니다!
    ja: |-
      ああ！払いましょう！
      一生かけてでも払う！
      だから今すぐに…！
  event_staranis2_02_s_108:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_109:
    speaker: mustang_past
    en: Well? What do you girls think?
    ko: 거기 아가씨들 생각은 어때?
    ja: しかし、本人たちが何と言うかな？
  event_staranis2_02_s_110:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_111:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_112:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_113:
    speaker: hanson
    en: Don't speak to my pop stars!
    ko: 내 아이돌한테 말걸지 마십시…!
    ja: 私のアイドルに話しかけるな…！
  event_staranis2_02_s_114:
    speaker: mustang_past
    en: Well, well, look how high you've climbed.
    ko: |-
      어이쿠, 이런.
      순위가 그사이 이만큼 올랐군.
    ja: |-
      おっと、良かったな。
      ランキングが急上昇してるぞ。
  event_staranis2_02_s_115:
    speaker: mustang_past
    en: Ninth place. Top 10 already, hm? That's a big step toward your major debut.
    ko: 9위다. TOP 10 안에 들었군. 메이저 데뷔를 향해 큰 걸음을 내디뎠어.
    ja: |-
      9位だ。TOP10入りか。
      メジャーデビューに
      大きな一歩を踏み出せたなぁ。
  event_staranis2_02_s_116:
    speaker: hanson
    en: Don't listen to him. We can always raise the rankings back up.
    ko: |-
      듣지 마.
      순위 같은 건 얼마든지 끌어올릴 수 있어.
    ja: |-
      聞くんじゃない。
      そんなもの、いくらでも上げられる。
  event_staranis2_02_s_117:
    speaker: hanson
    en: There's no reason for you to be treated like this. We can do it the right
      way.
    ko: |-
      너희가 이런 취급을 받을 이유는 없어.
      정상적인 방법으로, 얼마든지 올라갈 수 있어.
    ja: |-
      こんな仕打ちを受ける必要はない。
      堂々と勝負すれば、いくらでも上に行ける。
  event_staranis2_02_s_118:
    speaker: hanson
    en: You know this isn't right.
    ko: 너희도 알잖아. 이건 정상적인 방법이 아니라는 거.
    ja: |-
      君たちも分かっているだろう？
      こんなことあるべきじゃない。
  event_staranis2_02_s_119:
    speaker: hanson
    en: So let's stop here. We can start over.
    ko: 그러니 그만하자. 다시 시작하면 돼.
    ja: |-
      だから、もうやめるんだ。
      またやり直そう。
  event_staranis2_02_s_120:
    speaker: mustang_past
    en: You really think playing by the rules makes you special?
    ko: 정상적인 방법으로는 특별해질 수 없지.
    ja: |-
      普通にやったって、
      お前らは特別になれないぞ。
  event_staranis2_02_s_121:
    speaker: hanson
    en: Quiet, now!
    ko: 조용히 좀 하십시오!
    ja: もう何も言わないでくれ！
  event_staranis2_02_s_122:
    speaker: hanson
    en: "... Let's go, girls."
    ko: "…가자. 얘들아."
    ja: "…行こう、みんな。"
  event_staranis2_02_s_123:
    speaker: hanson
    en: We're not letting greed steer us off course. Even if it takes longer, we'll
      do this properly.
    ko: |-
      욕심 때문에 잘못된 길로 갈 순 없어.
      늦더라도, 바른길로 가자.
    ja: |-
      売れたいからと道を踏み外してはだめだ。
      たとえ時間がかかっても、正しい道を進もう。
  event_staranis2_02_s_124:
    speaker: anis_idol
    en: Um...
    ko: 어, 저기.
    ja: し…社長…
  event_staranis2_02_s_125:
    speaker: anis_idol
    en: Boss,
    ko: 그… 사장님.
    ja: わ…私…
  event_staranis2_02_s_126:
    speaker: anis_idol
    en: we—
    ko: 저희는….
    ja: 私たちは…
  event_staranis2_02_s_127:
    speaker: hanson
    en: No, Anis, don't say it.
    ko: "…아니야. 아니스. 더 말하지 마."
    ja: "…いい、アニス。それ以上言うな。"
  event_staranis2_02_s_128:
    speaker: anis_idol
    en: W-we
    ko: 저, 저희는!
    ja: わ、私たちは！
  event_staranis2_02_s_129:
    speaker: anis_idol
    en: can still keep going a little longer!
    ko: 좀 더 할 수 있을 것 같아요!
    ja: まだやれます！
  event_staranis2_02_s_130:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_131:
    speaker: mustang_past
    en: "... Heh."
    ko: "…후."
    ja: "…フン…"
  event_staranis2_02_s_132:
    speaker: anis_idol
    en: Y-yeah, some fans pulled some crap, but way more came to support us.
    ko: 지, 짓궂은 장난을 치는 팬도 있었지만, 우리 응원해 주러 오는 팬이 훨씬 많았어요.
    ja: |-
      い、意地悪な人もいますけど、
      ちゃんと応援しに来てくれてるファンの方が
      何倍も多いんです。
  event_staranis2_02_s_133:
    speaker: anis_idol
    en: And, uh... if this is all we're up against, we can handle it.
    ko: 그리고 어, 이 정도라면 어떻게든 할 수 있을 것 같아요.
    ja: |-
      それに、これぐらいのことなら
      どうにかなります。
  event_staranis2_02_s_134:
    speaker: mint_o
    en: I feel the same. This level of attention isn't something you can just ask
      for.
    ko: |-
      …저도 그렇게 생각해요.
      이렇게까지 주목받는 거, 하고 싶다고 할 수 있는 게 아니니까.
    ja: |-
      …私も。こんなに注目されるなんて、
      望んでもできることじゃないですから。
  event_staranis2_02_s_135:
    speaker: mint_o
    en: If it's simply part of what we have to endure to rise higher, then I think
      we can handle it.
    ko: 위로 올라갈 때 겪는 성장통이라 생각하면… 못 할 건 없다고 봐요.
    ja: |-
      成長するための痛みだと思えば…
      何でもやります。
  event_staranis2_02_s_136:
    speaker: prika_o
    en: And the penalty fee? Let's be real, there's no way we can ever pay that.
    ko: 그리고 위약금. 솔직히 갚을 수 있는 수준이 아니잖아요.
    ja: |-
      それに違約金だって、
      どう考えても払えるような金額じゃないだろ。
  event_staranis2_02_s_137:
    speaker: prika_o
    en: Don't worry, we're good at surviving the grind.
    ko: 걱정마세요. 우리는 구르는 건 자신 있으니까.
    ja: |-
      心配するな。
      私たち、もがくのは得意だからさ。
  event_staranis2_02_s_138:
    speaker: hanson
    en: "... You think this is as far as it goes?"
    ko: "…이걸로 끝일 거라고 생각해?"
    ja: "…これで終わると思っているのか？"
  event_staranis2_02_s_139:
    speaker: hanson
    en: They can do far worse. They will do far worse.
    ko: 더 심한 짓을 당할 수 있어. 아니, 당할 거야.
    ja: |-
      もっとひどい目に遭うかもしれないぞ…
      いや、間違いなく遭わされる。
  event_staranis2_02_s_140:
    speaker: anis_idol
    en: Pfft, that wouldn't matter. The bodyguards behind me will stop anyone from
      getting that close in the first place.
    ko: |-
      에, 에이. 그래봤자죠.
      뒤에 경호원분들이 신체 접촉은 귀신같이 막아내 주니까.
    ja: |-
      もう、大丈夫ですって。
      ボディガードの人たち、
      触られるのは絶対防いでくれてますから。
  event_staranis2_02_s_141:
    speaker: mustang_past
    en: Exactly, nothing gets through unless I allow it.
    ko: 그렇지. 철저하게 막아주지.
    ja: そうだ、お触り厳禁のイベントだからな。
  event_staranis2_02_s_142:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_143:
    speaker: anis_idol
    en: Thanks, Boss, but we've got this.
    ko: |-
      고마워요 사장님.
      하지만 우리 할 수 있어요.
    ja: |-
      ご心配ありがとうございます、社長。
      でも私たち、できますから。
  event_staranis2_02_s_144:
    speaker: anis_idol
    en: We'll handle it like we always do. Together.
    ko: |-
      지금까지 해왔던 대로 해내면 되잖아요.
      우리 같이.
    ja: |-
      今まで通り、乗り越えればいいんです。
      みんなで一緒に。
  event_staranis2_02_s_145:
    speaker: hanson
    en: Anis, let me say this again...
    ko: 아니스. 다시 한번
    ja: アニス。もう一度よく…
  event_staranis2_02_s_146:
    speaker: anis_idol
    en: The mainstream...
    ko: 메이저.
    ja: メジャーアイドル…
  event_staranis2_02_s_147:
    speaker: anis_idol
    en: I... wanna get there.
    ko: 가고… 싶어요.
    ja: なりたい…です。
  event_staranis2_02_s_148:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_149:
    speaker: "<Narration>"
    en: Mustang claps his hands so hard it echoes through the place.
    ko: 짝! 하고 머스탱이 손뼉을 강하게 친다.
    ja: マスタングの叩いた手が、かん高く音を立てた
  event_staranis2_02_s_150:
    speaker: mustang_past
    en: Good, so you've made your choice.
    ko: 좋아. 결론은 난 모양이군.
    ja: よし。決まったようだな。
  event_staranis2_02_s_151:
    speaker: mustang_past
    en: I can see the fire in all of you. I like it! As someone who runs the world
      of entertainment, this is exactly the kind of thrill I live for.
    ko: |-
      너희들의 각오는 잘 알았다.
      엔터테인먼트를 책임지는 사람으로서 감명받았어.
    ja: |-
      お前たちの覚悟はよく分かった。
      エンターテイメントの世界を
      仕切る者として、感動させてもらったぞ。
  event_staranis2_02_s_152:
    speaker: mustang_past
    en: I'll back you with everything I've got. Now let's see how you fare in the
      mainstream.
    ko: |-
      모든 힘을 다해 밀어주겠다.
      메이저로 가보자고.
    ja: |-
      全力で押し上げてやる。
      メジャーの世界へな。
  event_staranis2_02_s_153:
    speaker: anis_idol
    en: Ah... yeah, I-I'm counting on you.
    ko: 아… 예. 자, 잘 부탁드립니다.
    ja: は…はい。よ、よろしくお願いします。
  event_staranis2_02_s_154:
    speaker: "<Narration>"
    en: Mustang looks at Hanson.
    ko: 머스탱이 한슨을 바라본다.
    ja: マスタングがハンソンの顔を見た
  event_staranis2_02_s_155:
    speaker: mustang_past
    en: You'll want to hurry.
    ko: 서두르는 게 좋을 거다.
    ja: お前も焦った方がいいだろうな。
  event_staranis2_02_s_156:
    speaker: mustang_past
    en: Time's not exactly on our side.
    ko: 피차 시간이 없거든.
    ja: お互い、時間は貴重だ。
  event_staranis2_02_s_157:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_158:
    speaker: "<Narration>"
    en: T.T. STAR's dorm buzzes with energy.
    ko: T.T. STAR의 숙소에는 활기가 감돌았다.
    ja: |-
      宿所に戻ったT.T. STARの面々は
      元気にふるまっていた
  event_staranis2_02_s_159:
    speaker: "<Narration>"
    en: Hanson watches the members as they chatter excitedly about the future.
    ko: 신나서 미래에 대해 이야기하는 멤버들을 한슨은 빤히 바라본다.
    ja: |-
      楽しそうに将来のことを話すメンバーたちを
      ハンソンは見つめた
  event_staranis2_02_s_160:
    speaker: "<Narration>"
    en: It doesn't take long for him to realize they're pushing themselves, trying
      to hide their anxiety.
    ko: 그리고 곧 그것이 불안함을 감추기 위해 무리하고 있다는 것을 알아챈다.
    ja: |-
      すぐにそれは、不安を隠すために
      あえて明るくしようとしているのだと
      察しがついた
  event_staranis2_02_s_161:
    speaker: "<Narration>"
    en: Even so, he can't bring himself to cheer them on
    ko: 한슨은 그녀들을 응원할 수 없다.
    ja: ハンソンに応援などできるはずもない
  event_staranis2_02_s_162:
    speaker: "<Narration>"
    en: since he knows exactly what kind of man Mustang is and what will happen next.
    ko: |-
      한슨은 머스탱이 어떤 사람인지 잘 알고 있고,
      그로 인해 앞으로 어떤 일이 벌어질지 너무나 잘 알고 있다.
    ja: |-
      マスタングがどのような人間か、
      これから何を起こすか、
      知り尽くしているからだ
  event_staranis2_02_s_163:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_164:
    speaker: "<Narration>"
    en: There is nothing he can do.
    ko: 할 수 있는 일이 없다.
    ja: もうできることはない
  event_staranis2_02_s_165:
    speaker: "<Narration>"
    en: One after another, people fall for Mustang's empty promises, hurling themselves
      into the fire without hesitation.
    ko: 지금껏 수많은 이들이, 머스탱이 내뱉은 허황한 말에 눈이 멀어 기꺼이 자신의 몸을 던졌고.
    ja: |-
      今までも多くの人々が
      マスタングの言葉に騙され、
      喜んで身を躍らせ…
  event_staranis2_02_s_166:
    speaker: "<Narration>"
    en: And the fire consumes them all the same.
    ko: 불타 사라졌다.
    ja: その身を焼かれて消えていった
  event_staranis2_02_s_167:
    speaker: "<Narration>"
    en: The weight of helplessness presses down on him.
    ko: 한슨은 무력감을 느꼈다.
    ja: ハンソンはおのれの無力を痛感した
  event_staranis2_02_s_168:
    speaker: "<Narration>"
    en: He doesn't think he can talk those girls out of the future they're so desperate
      to believe in.
    ko: 미래에 대한 기대에 들뜬 그녀들을 설득할 자신이 없었다.
    ja: |-
      未来を向いて話をする彼女たちを
      説得できる自信はなかった
  event_staranis2_02_s_169:
    speaker: "<Narration>"
    en: Still, he has to act.
    ko: 어떻게든 해야 한다.
    ja: それでも、どうにかしなければならない
  event_staranis2_02_s_170:
    speaker: "<Narration>"
    en: He needs a way to overturn everything in a single move,
    ko: 이 판을 한 번에 뒤집을 수 있는 방법이 필요하다.
    ja: 全てを一気にひっくり返せるような一手が要る
  event_staranis2_02_s_171:
    speaker: "<Narration>"
    en: even if it means going to extremes.
    ko: 그것이 비록, 극단적일지라도.
    ja: たとえそれが、どんな手であったとしても
  event_staranis2_02_s_172:
    speaker: hanson
    en: "... Everyone, I think I'll need to be away for a while."
    ko: "…얘들아. 나는 잠시 자리를 비워야 할 것 같아."
    ja: "…みんな。すまないが、しばらく留守にする。"
  event_staranis2_02_s_173:
    speaker: anis_idol
    en: "... Huh? What for?"
    ko: "…어… 왜요?"
    ja: "…え？どうしたんですか…？"
  event_staranis2_02_s_174:
    speaker: hanson
    en: I have something important to to take care of. It's rather urgent.
    ko: 할 일이 있어. 중요한 일이야. 급한 일이기도 하고.
    ja: |-
      やらないといけないことがあってな。
      とても大事なことだ。一刻を争う。
  event_staranis2_02_s_175:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_s_176:
    speaker: anis_idol
    en: Hey, Boss. About earlier...
    ko: 저기, 사장님. 좀 전에 저희가….
    ja: あの、社長。さっき私たちが…
  event_staranis2_02_s_177:
    speaker: hanson
    en: No, it's okay. I understand. I'm sorry, I got a bit carried away.
    ko: |-
      아니야. 괜찮아. 이해해.
      나도 흥분해서 미안하다.
    ja: |-
      いや、大丈夫だ。分かっている。
      私も興奮してすまなかった。
  event_staranis2_02_s_178:
    speaker: hanson
    en: I might be hard to reach while I'm away. Will that be all right?
    ko: 자리를 비우는 동안 연락이 잘 안될 수도 있어. 그래도 괜찮겠지?
    ja: |-
      戻ってくるまで連絡がつかないことも
      あるかもしれない。
      それでも君たちだけでやれるな？
  event_staranis2_02_s_179:
    speaker: anis_idol
    en: Oh, yeah, sure.
    ko: 아, 예. 그럼요.
    ja: ええと…はい。もちろんです。
  event_staranis2_02_s_180:
    speaker: anis_idol
    en: "... Got something important to take care of?"
    ko: "…중요한 일 하러 가시나 봐요?"
    ja: "…そうとう大事なことみたいですね？"
  event_staranis2_02_s_181:
    speaker: hanson
    en: Yes, it's something I have to do.
    ko: 응. 반드시 해야 할 일이야.
    ja: ああ。何があってもやるしかない。
  event_staranis2_02_s_182:
    speaker: anis_idol
    en: "... Yeah, got it. Just make it back in one piece."
    ko: "…알겠어요. 잘 다녀와요."
    ja: "…分かりました。頑張ってください。"
  event_staranis2_02_s_183:
    speaker: anis_idol
    en: We'll manage, so don't worry.
    ko: 저희는 걱정하지 않아도 돼요.
    ja: 私たちのことは心配いりません。
  event_staranis2_02_s_184:
    speaker: hanson
    en: "... All right, get some rest."
    ko: "…그래. 그럼 푹 쉬어."
    ja: "…ああ。後はゆっくり休んでくれ。"
  event_staranis2_02_s_185:
    speaker: hanson
    en: I'll see you soon.
    ko: 나중에 보자.
    ja: すぐに戻る。
  event_staranis2_02_s_186:
    speaker: "<Narration>"
    en: That night, Hanson lies awake until morning.
    ko: 그날 저녁. 한슨은 단 한숨도 자지 못했다.
    ja: その日の夜、ハンソンは一睡もしなかった
  event_staranis2_02_s_187:
    speaker: "<Narration>"
    en: At first light, he sets out.
    ko: 아침이 되자마자 한슨은 어디론가 향한다.
    ja: 朝になってすぐ、ハンソンはどこかへ消えた
  event_staranis2_02_s_188:
    speaker: "<Narration>"
    en: His eyes burn with a resolve he's never shown before.
    ko: 그 눈엔, 지금까지 보지 못했던 결연함이 떠올랐다.
    ja: |-
      その目にかつてないほどの
      鋭い光をぎらつかせながら
event_staranis2_02_e:
  event_staranis2_02_e_1:
    speaker: mint_o
    en: Yeah, it's okay.
    ko: 응. 괜찮아.
    ja: うん。大丈夫よ。
  event_staranis2_02_e_2:
    speaker: mint_o
    en: These days, you can't get by on singing and dancing alone.
    ko: 요즘 아이돌 판은 춤과 노래만으로 승부할 수 없는 판이니까.
    ja: |-
      最近のアイドル業界はどうせ
      歌とダンスだけじゃ通用しないんだから。
  event_staranis2_02_e_3:
    speaker: mint_o
    en: This can be our chance. With Tetra's support, we can finally shape our individual
      image.
    ko: 이건 기회야. 테트라의 지원을 받아 확고한 캐릭터 메이킹이 될 테니까.
    ja: |-
      これはチャンスよ。テトラの支援があれば、
      それぞれのイメージだって固められるはず。
  event_staranis2_02_e_4:
    speaker: mint_o
    en: Then, we might actually make a name for ourselves, and a proper debut wouldn't
      feel so out of reach anymore.
    ko: |-
      그럼 유명해질 수 있어.
      메이저 데뷔도 꿈은 아니겠지.
    ja: |-
      こうしていれば有名になれる。
      メジャーデビューも夢じゃないわ。
  event_staranis2_02_e_5:
    speaker: "<Narration>"
    en: I-I'm going to spray this on your face now.
    ko: 지, 지금부터 내가 얼굴에 이걸 뿌릴 테니까
    ja: こ、これを顔にかけるから
  event_staranis2_02_e_6:
    speaker: "<Narration>"
    en: Wh-when I do, make sure you thank me and smile, okay?
    ko: 뿌, 뿌려주셔서 감사합니다라고 얘기해. 웃으면서. 알겠지?
    ja: |-
      か、かけてくれてありがとうございます、って
      笑顔で言って。いい？
  event_staranis2_02_e_7:
    speaker: "<Narration>"
    en: O-okay, and rolling.
    ko: 자, 자. 촬영한다?
    ja: じゃ、じゃあ、始めるよ？
  event_staranis2_02_e_8:
    speaker: mint_o
    en: Check the forums. These days, there's not a single person who doesn't know
      us. We're basically celebrities now.
    ko: |-
      아이돌 카페 봐봐. 요즘 우리를 모르는 팬이 없어.
      유명 인사가 됐잖아.
    ja: |-
      アイドル掲示板を見なさい。
      もう私たちを知らないファンはいないわ。
      それだけ有名になったってことよ。
  event_staranis2_02_e_9:
    speaker: mint_o
    en: There are way more Smile Time posts than T.T. STAR posts, but it's really
      all the same, so it doesn't matter.
    ko: |-
      T.T. STAR보다 스마일 박스 게시글이 훨씬 많긴 하지만,
      둘 다 같은 거니까 상관없어, 응.
    ja: |-
      T.T. STARよりスマイルボックスの方が
      圧倒的に検索ヒット数が多いけど、
      同じことだし関係ないわ。
  event_staranis2_02_e_10:
    speaker: mint_o
    en: Smiling is easy, and the fans keep saying my smile is pretty.
    ko: |-
      웃자, 웃자. 웃는 건 쉽잖아.
      그리고 나 웃는게 예쁘다고 팬들이 많이 얘기해줬고.
    ja: |-
      ほら、笑いましょ？笑うなんて簡単でしょ。
      それに私、笑顔がかわいいって
      ファンのみんなによく言われるんだから。
  event_staranis2_02_e_11:
    speaker: "<Narration>"
    en: My boss looks a lot like you, Mint. Your eyes look almost identical.
    ko: |-
      직장 상사가 민트 씨랑 닮았어요.
      특히 눈이 엄청 닮았어요.
    ja: |-
      職場の上司がミントさんに似てるんです。
      特に、目なんか本当そっくりで
  event_staranis2_02_e_12:
    speaker: "<Narration>"
    en: I confessed to her, but she reacted as if she was disgusted and turned me
      down. Then the rumors spiraled out of control, and I ended up quitting.
    ko: |-
      고백했더니 질색하며 거절했어요.
      소문이 이상하게 나서 저는 퇴사했고요.
    ja: |-
      告白したら、嫌そうな顔で振られました。
      変なウワサが立ったので退職しました
  event_staranis2_02_e_13:
    speaker: "<Narration>"
    en: I don't think it's right to trample on someone's feelings like that. So, apologize
      to me.
    ko: |-
      사람의 순정을 이렇게 짓밟으면 안 된다고 생각해요.
      그러니까 저한테 사과해요.
    ja: |-
      人の純粋な気持ちを踏みにじるのは
      最低だと思います。だから謝ってください
  event_staranis2_02_e_14:
    speaker: "<Narration>"
    en: Tell me you actually liked me, that you only turned me down because you had
      your reasons, and say it with a smile.
    ko: |-
      사실은 나 좋아했는데, 사정이 있어서 거절한 거라고 얘기해요.
      웃으면서.
    ja: |-
      本当は僕のことが好きだったけど、
      ワケあって断るしかなかったって
      言ってください。笑いながら
  event_staranis2_02_e_15:
    speaker: mint_o
    en: This is the only way. It's the only way someone like us can ever stand out...
    ko: |-
      이 방법밖에 없어.
      무엇 하나 빛나지 않는 우리가 빛날 수 있는 방법은 이것뿐이야.
    ja: |-
      これしかないのよ。
      光るものなんて何もない
      私たちが輝ける方法は…
  event_staranis2_02_e_16:
    speaker: mint_o
    en: I just have to smile more. They say I look better when I do... the fans, I
      mean.
    ko: |-
      내가 더 열심히 웃으면 돼.
      나는 웃는 게 예쁘니까. 팬들이 얘기했거든. 웃는 거 예쁘다고.
    ja: |-
      私はずっと笑ってないと。
      私は笑顔がかわいいから。
      ファンに言われてるの。笑顔がかわいいって。
  event_staranis2_02_e_17:
    speaker: mint_o
    en: That's why they're here to see me, right? Because I look pretty when I smile.
    ko: 그래서 보고 싶은 거잖아. 내가 웃는 게 예쁘니까.
    ja: |-
      だからみんな私のことを見てるの。
      私の笑顔がかわいいから。
  event_staranis2_02_e_18:
    speaker: mint_o
    en: So go on, watch me smile as much as you like...
    ko: 많이 봐. 웃는 나를 많이 봐.
    ja: 見て。笑ってる私を存分に見て…
  event_staranis2_02_e_19:
    speaker: "<Narration>"
    en: Mint, you're actually terrible. You've got nothing going for you except your
      pretty face.
    ko: |-
      근데 민트 너 진짜 못 하더라.
      얼굴 말고는 내세울 게 하나도 없어.
    ja: |-
      でも、ミントって本当にダメだな。
      顔以外に取り柄がひとつもない
  event_staranis2_02_e_20:
    speaker: "<Narration>"
    en: Don't you think you're kind of a burden?
    ko: 좀 민폐라고 생각하지 않아?
    ja: 迷惑だと思わないのか？
  event_staranis2_02_e_21:
    speaker: "<Narration>"
    en: You don't even practice in front of the mirror, do you? You just stare at
      yourself and think, "Yeah, I'm pretty. I don't need to practice."
    ko: |-
      거울 앞에서 연습은 안 하고 얼굴만 들여다보겠네.
      우웅~ 나는 예쁘니까 연습 안 해도 돼~ 하면서.
    ja: |-
      どうせ練習そっちのけで
      自分の顔ばっか見てんだろ。
      私かわいすぎ～練習なんか必要ないわ～って
  event_staranis2_02_e_22:
    speaker: "<Narration>"
    en: Hahaha, this is fun. You're re having fun too, right? That's why you're smiling
      with me.
    ko: 아하하. 아 재밌다. 너도 재밌지? 그러니까 같이 웃는 거잖아.
    ja: |-
      アハハ、ウケる。面白いだろ？
      だからお前も一緒に笑ってんだろ？
  event_staranis2_02_e_23:
    speaker: mint_o
    en: Honestly, I didn't push myself that hard. Compared to Anis and Prika, I had
      it easy.
    ko: |-
      솔직히 나는 열심히 안 했어.
      아니스랑 프리카에 비하면 설렁설렁했지.
    ja: |-
      正直、私は頑張ってなかったから。
      アニスとプリカに比べたら適当にやってたわ。
  event_staranis2_02_e_24:
    speaker: mint_o
    en: So I'm fine. If it ends up like this, so be it. Maybe this is the price for
      trying to reach the top without earning it.
    ko: |-
      그러니까 나는 괜찮아. 이렇게 되어도 괜찮아.
      노력 없이 올라가길 원한 대가일 수도 있어.
    ja: |-
      だから私はいいの。こうなっても当然。
      努力もせずに成功しようとした
      私が欲張りだっただけだから。
  event_staranis2_02_e_25:
    speaker: mint_o
    en: But those two are different. They worked for it. They gave everything they
      had. They deserve respect.
    ko: |-
      그런데 저 둘은 아니야.
      저 둘은 노력했고, 열심히 했어. 존중받아야 해.
    ja: |-
      でも、あの2人は違う。
      ずっと頑張ってた。
      あの2人をバカにしないで。
  event_staranis2_02_e_26:
    speaker: mint_o
    en: Don't touch them. If you do, I swear I'll make you regret it. Don't you dare
      drag their names through the dirt.
    ko: |-
      둘 건드리지 마. 죽여버릴 거야.
      내 아이돌들한테 오물을 뿌리지 마.
    ja: |-
      2人には手を出さないで。許さないから。
      私のアイドルたちを汚さないで。
  event_staranis2_02_e_27:
    speaker: mint_o
    en: Come to me. Come closer.
    ko: 나한테 와. 나한테 오라고.
    ja: 私のところに来て。やるなら私にして。
  event_staranis2_02_e_28:
    speaker: mint_o
    en: Look at me smiling. Isn't my smile pretty? That's right, so come to me.
    ko: 내가 웃는 걸 봐. 예쁘지? 그렇지? 그러니 나한테 와.
    ja: |-
      私の笑顔を見て。ね？かわいいでしょ？
      だから私のところにきなさいよ。
  event_staranis2_02_e_29:
    speaker: "<Narration>"
    en: So what exactly are you good at, Mint?
    ko: 민트는 도대체 특기가 뭐예요?
    ja: ミントの特技って、いったい何ですか？
  event_staranis2_02_e_30:
    speaker: "<Narration>"
    en: You're a worse dancer than Prika, and your singing doesn't measure up to Anis
      either.
    ko: 춤도 프리카보다 못 춰, 노래도 아니스보다 못 해.
    ja: |-
      ダンスもプリカよりヘタ、
      歌もアニスよりヘタ
  event_staranis2_02_e_31:
    speaker: "<Narration>"
    en: Other than your looks, you don't really have anything going for you. So why
      are you even trying to be a pop star?
    ko: 얼굴 말고는 내세울 게 없는데 왜 아이돌 한다고 하는 거예요?
    ja: |-
      顔ぐらいしか取り柄がないのに、
      なんでアイドルやってるんですか？
  event_staranis2_02_e_32:
    speaker: "<Narration>"
    en: Come on, I'm kidding. Smile a little.
    ko: 에이, 농담이에요. 웃어요 웃어.
    ja: |-
      なんちゃって、冗談です。
      ほら、笑って笑って
  event_staranis2_02_e_33:
    speaker: "<Narration>"
    en: See? You look so much prettier when you smile.
    ko: 그래요. 웃으니까 얼마나 예뻐요.
    ja: |-
      そうそう。笑顔がかわいいんだから
      笑ってなくちゃ
  event_staranis2_02_e_34:
    speaker: mint_o
    en: Sparkle, sparkle...
    ko: 반짝반짝. 반짝반짝.
    ja: キラキラ、キラキラ…
  event_staranis2_02_e_35:
    speaker: mint_o
    en: Haha, so pretty. We're shining so brightly right now, aren't we?
    ko: 하하. 예쁘다. 우리 지금 엄청 반짝이고 있겠지?
    ja: |-
      フフ…きれいでしょ。
      私たち、今とっても輝いてる？
  event_staranis2_02_e_36:
    speaker: mint_o
    en: Bright enough for anyone to see, no matter where they are...
    ko: 어디에서든 볼 수 있을 정도로 반짝이고 있겠지?
    ja: どこからでも分かるくらい輝いてるわよね？
  event_staranis2_02_e_37:
    speaker: mint_o
    en: Right? That's true, right?
    ko: 응? 그렇지? 그렇겠지? 맞지?
    ja: ねえ？そうね？そうでしょ？そうよね？
  event_staranis2_02_e_38:
    speaker: mint_o
    en: No, we're not shining at all. This isn't what it means to shine.
    ko: 아니야. 우린 지금 빛나지 않아. 이건 빛나는 게 아니야.
    ja: |-
      違う…私たちは輝いてなんかいない。
      こんなの輝きじゃない。
  event_staranis2_02_e_39:
    speaker: mint_o
    en: Sparkle, sparkle...
    ko: 반짝반짝. 반짝반짝.
    ja: 私たちの輝き、輝きは…
  event_staranis2_02_e_40:
    speaker: mint_o
    en: Hello, I'm Mint. Would you like to see me smile?
    ko: 안녕하세요? 민트에요. 저 웃는 거 볼래요?
    ja: |-
      こんにちは！ミントです。
      私の笑顔、見ていきませんか？
  event_staranis2_02_e_41:
    speaker: "<Narration>"
    en: Prika has everything going for her, but her expression is too cold.
    ko: 프리카는 다 좋은데 인상이 너무 차갑네.
    ja: |-
      プリカって歌もダンスもビジュもいいけど、
      いつも冷めた顔してるよな
  event_staranis2_02_e_42:
    speaker: "<Narration>"
    en: That's why you look best when you smile, so smile more.
    ko: 그래서 웃을 때 좋아. 더 웃어. 더.
    ja: |-
      だから笑顔が見れると嬉しいよ。
      ほら、もっと笑って
  event_staranis2_02_e_43:
    speaker: "<Narration>"
    en: There you go. Stretch your mouth until it's about to split. Yeah, just like
      that.
    ko: 그렇지. 입이 찢어질 정도로, 그래그래. 그렇게.
    ja: |-
      そうそう。口が裂けるくらいにさ。
      そんな感じそんな感じ
  event_staranis2_02_e_44:
    speaker: "<Narration>"
    en: Gosh, you look so silly. It's adorable.
    ko: 아 바보 같아서 너무 귀엽네.
    ja: ああ～、バカみたいでかわいいよ
  event_staranis2_02_e_45:
    speaker: prika_o
    en: I hate this. I really hate it. I don't want to do this kind of stuff.
    ko: 싫다. 싫어. 너무 싫어. 하기 싫어. 이런 건 싫어.
    ja: |-
      イヤだ…イヤだ。やりたくない。やりたくない。
      こんなことやりたくない。
  event_staranis2_02_e_46:
    speaker: prika_o
    en: I just want to dance and sing. Why am I even here doing this?
    ko: 나는 춤추고 노래하는 게 좋은데 왜 여기서 이러고 있어야 해?
    ja: |-
      私は歌って踊りたかったんだ。
      なんでこんな所でこんなことをやってる？
  event_staranis2_02_e_47:
    speaker: prika_o
    en: What even is this? What's "Smile Time"? Why are we doing this crap?
    ko: 이게 뭔데. 스마일 박스가 뭔데. 이딴걸 왜 하는 건데.
    ja: |-
      なんなんだよ。
      スマイルボックスって何だ。
      なんでこんなことさせるんだよ？
  event_staranis2_02_e_48:
    speaker: "<Narration>"
    en: I want you out of T.T. STAR.
    ko: 나는 네가 T.T. STAR에서 빠졌으면 좋겠어.
    ja: |-
      君にはさ、T.T. STARを
      辞めて欲しいんだよね
  event_staranis2_02_e_49:
    speaker: "<Narration>"
    en: Honestly, you ruin the lineup. You don't even fit the group. You're freakishly
      tall and not even cute.
    ko: |-
      솔직히 조합을 망친다고 생각하거든.
      안 어울려. 키만 멀대같이 크고 안 귀여우니까.
    ja: |-
      正直、グループの輪を乱してると思うんだ。
      合ってないんだよ。
      一人だけ背が高いし、愛想もないし
  event_staranis2_02_e_50:
    speaker: "<Narration>"
    en: This is seriously irritating, so can you smile and apologize?
    ko: 기분 나쁘니까, 웃으면서 죄송하다고 말해줄래?
    ja: |-
      不愉快だから、
      ごめんなさいって笑顔で謝ってくれない？
  event_staranis2_02_e_51:
    speaker: prika_o
    en: What even is this? Seriously, how is this supposed to help us?
    ko: |-
      세상에 이런 게 어딨어. 이게 대체 뭐야.
      이게 우리한테 무슨 도움이 돼?
    ja: |-
      世の中どうなってるんだ？一体なんなんだ？
      これが本当に未来につながるのか？
  event_staranis2_02_e_52:
    speaker: prika_o
    en: Stop. Just stop. Let's start over from scratch.
    ko: |-
      그만하자. 그만하자 얘들아.
      그냥 처음부터 다시 시작하자.
    ja: |-
      もうやめよう、2人とも。
      また最初からやり直そう。
  event_staranis2_02_e_53:
    speaker: prika_o
    en: Yeah, from the beginning. That's the right call. We don't even need to push
      it this far.
    ko: |-
      우리 그냥 처음부터 다시 시작하자.
      그게 맞잖아. 이렇게까지 할 필요는 없는 거잖아.
    ja: |-
      一からまた始めるんだ。
      そうだ、ここまでする必要なんてないはずだ。
  event_staranis2_02_e_54:
    speaker: "<Narration>"
    en: You almost debuted back when you were human, didn't you? Then you died in
      that accident.
    ko: |-
      사람일 때 데뷔 직전까지 갔었다며?
      그러다가 사고로 죽어버렸고.
    ja: |-
      人間の時にデビュー直前まで行ったんだって？
      なのに事故に遭って死んだらしいな
  event_staranis2_02_e_55:
    speaker: "<Narration>"
    en: Honestly? That might've been the best thing that ever happened to you. I looked
      up your clips, and you have zero talent.
    ko: |-
      그런데 너, 죽길 잘했어.
      영상 좀 찾아봤는데 진짜 재능 없더라.
    ja: |-
      でも、むしろ死んでよかったんじゃね？
      動画見たけどマジで才能なかったよ
  event_staranis2_02_e_56:
    speaker: "<Narration>"
    en: At least now that you're a Nikke, you're barely passable. Back then? You were
      just pathetic.
    ko: 그나마 니케니까 괜찮지, 사람일 때는 진짜 형편없었어.
    ja: |-
      ニケになって少しはマシになったな、
      人間の時のは見てられなかった
  event_staranis2_02_e_57:
    speaker: "<Narration>"
    en: So go on. Smile, and thank Anis and Mint. Thank them for letting you debut
      at all.
    ko: |-
      아니스랑 민트한테 웃으면서 고맙다고 해.
      아이돌로 데뷔시켜 줘서 고맙다고 하라고.
    ja: |-
      アニスとミントに笑顔でお礼言えよ。
      アイドルとしてデビューさせてくれて
      ありがとうってさ
  event_staranis2_02_e_58:
    speaker: prika_o
    en: I see, so you can't give up.
    ko: 아아. 그래. 너희는 포기할 수 없는거구나.
    ja: ああ…そうか。2人とも諦められないんだ。
  event_staranis2_02_e_59:
    speaker: prika_o
    en: Even if it's pointless, you're still clinging to it.
    ko: 이런 이상하고 말도 안 되는 짓거리지만 포기할 수 없는거구나.
    ja: |-
      こんな頭のおかしいことをやらされても、
      すがりつくしかないんだな。
  event_staranis2_02_e_60:
    speaker: prika_o
    en: You think this is your only shot, and that there won't be a second chance
      for us.
    ko: |-
      유일한 기회라고 생각하는구나.
      우리에게 다음은 없다고 생각하는구나.
    ja: |-
      これがただ一つのチャンスだって
      思ってるんだろ？私たちに次はないって。
  event_staranis2_02_e_61:
    speaker: prika_o
    en: "... You're that desperate."
    ko: 그렇게나 절실한 거구나.
    ja: だから、こんなに必死でやれるのか。
  event_staranis2_02_e_62:
    speaker: "<Narration>"
    en: T.T. STAR is going to flop. Groups that blow up on cheap gimmicks like this
      never last.
    ko: |-
      T.T. STAR는 망할 거예요.
      이런 바보 같은 기획으로 뜬 아이돌은 뻔하거든요.
    ja: |-
      T.T. STARはどうせデビュー前に解散ですよ。
      こんなバカげたイベントで出てきた
      アイドルの末路なんて、たかが知れてます
  event_staranis2_02_e_63:
    speaker: "<Narration>"
    en: If you want to survive, you should start relying on actual skill. This kind
      of noise marketing? It's embarrassing.
    ko: 실력으로 살아남을 생각을 해야지, 이런 노이즈 마케팅 진짜 별로거든요.
    ja: |-
      実力で勝負するべきです、
      こんなノイズマーケティング、
      何ひとつメリットありませんよ
  event_staranis2_02_e_64:
    speaker: "<Narration>"
    en: When I was younger, I worked until my nose bled. That's how I earned my place.
    ko: 내가 젊었을 때, 진짜 코피가 터질 정도로 열심히 해서 이 자리까지 올랐거든요.
    ja: |-
      僕は若い頃、鼻血が出るほど努力して
      上り詰めてきたものですけどね
  event_staranis2_02_e_65:
    speaker: "<Narration>"
    en: This is my book. Read from cover to cover, and I'll be back tomorrow to test
      you on it. Don't disappoint me.
    ko: |-
      이거 내가 쓴 책인데, 오늘 다 정독해요.
      내일 와서 내용 물어볼 테니까, 알겠죠?
    ja: |-
      これ、僕が書いた本です。
      今日中に全部読んでおいてください。
      明日来て確認しますよ？
  event_staranis2_02_e_66:
    speaker: prika_o
    en: Yeah, I'll do it. I'm in. I'll smile.
    ko: |-
      응. 그럼할게.
      나도 같이 할게. 웃을게.
    ja: |-
      ああ、ならやってやる。
      私も一緒にやる。笑うよ。
  event_staranis2_02_e_67:
    speaker: prika_o
    en: Not for them. For you.
    ko: |-
      저것들을 위해서 웃는 게 아니야.
      너희를 위해서 웃을게.
    ja: |-
      こんな奴らのためじゃない。
      お前たちのために笑う。
  event_staranis2_02_e_68:
    speaker: prika_o
    en: You really think that if we keep this up, we'll get what we want?
    ko: 이렇게 웃다 보면 원하는 걸 얻을 수 있을 거라 믿는 거지?
    ja: |-
      こうして愛想笑いしてれば、
      望んだ未来が手に入るって信じてるんだろ？
  event_staranis2_02_e_69:
    speaker: prika_o
    en: Then I'll believe it too.
    ko: 나도 믿을게.
    ja: 私も信じるからさ。
  event_staranis2_02_e_70:
    speaker: prika_o
    en: Come on, let's smile for my friends, for the team.
    ko: 자, 웃자. 친구들을 위해. 동료들을 위해 웃자.
    ja: |-
      ほら、笑え。みんなのために。
      仲間のために笑うんだ。
  event_staranis2_02_e_71:
    speaker: "<Narration>"
    en: Seriously, what a joke. You just go around smiling like that all day?
    ko: 아 진짜 웃긴다. 하루 종일 그렇게 웃고만 있는 거야?
    ja: |-
      マジ、ウケる。
      1日中そうやってずっと笑ってんの？
  event_staranis2_02_e_72:
    speaker: "<Narration>"
    en: How do you even live like that? Must be desperate as hell just to get by.
    ko: 왜 그러고 살아. 먹고 살기 진짜 빡빡하네.
    ja: |-
      なんでそこまでするんだ？
      食っていくのって大変なんだな
  event_staranis2_02_e_73:
    speaker: "<Narration>"
    en: If that were me, I'd rather kill myself. Seriously, do you not have any pride?
    ko: 나 같으면 자살한다. 뭐야 진짜. 자존심도 없나.
    ja: |-
      俺だったらとっくに自殺してるよ、ホント。
      マジでプライドも無ぇんだな
  event_staranis2_02_e_74:
    speaker: prika_o
    en: Lift the corners of your mouth gently. Don't force it.
    ko: 입꼬리를 부드럽게 끌어올리며, 너무 힘이 들어가지 않게 주의하고.
    ja: |-
      口の端は優しく上げて、
      あまり力を入れすぎない。
  event_staranis2_02_e_75:
    speaker: prika_o
    en: This is so stupid. What even is this? I wanna bail.
    ko: 미친 짓이야. 이딴 게 어디 있어. 도망가고 싶어.
    ja: |-
      バカバカしい…何をやってるんだ。
      逃げ出したくなる。
  event_staranis2_02_e_76:
    speaker: prika_o
    en: Ease your eyes down a little, but not too much. Just enough for a soft curve.
    ko: |-
      눈도 살짝 감듯이, 그렇다고 너무 감지 말고 조금만.
      반달 모양이 되도록.
    ja: |-
      目は軽く細めて、でもやりすぎない。
      三日月の形になるように。
  event_staranis2_02_e_77:
    speaker: prika_o
    en: I hate this. Seriously, I hate this.
    ko: 하기 싫어. 싫다고. 나는 이런 거 하기 싫어.
    ja: |-
      やりたくない。もう、うんざりだ。
      こんなことはしたくない。
  event_staranis2_02_e_78:
    speaker: prika_o
    en: Too much and it'll look fake. Keep it subtle. Stay in character. Yeah, that's
      it.
    ko: |-
      너무 과하면 억지로 웃는 게 티 날 수 있으니까, 살짝만.
      캐릭터 유지하면서. 응. 이거다.
    ja: |-
      やりすぎると、わざとらしくなるから
      あくまでさりげなく。キャラを考えて。
      そう、こんな感じだ…
  event_staranis2_02_e_79:
    speaker: prika_o
    en: I hate it. I hate it. I hate it.
    ko: 싫어. 싫어. 싫어.
    ja: やめたい。やめたい。やめたい…
  event_staranis2_02_e_80:
    speaker: prika_o
    en: Smile. Smile. Smile.
    ko: 웃자. 웃자. 웃자.
    ja: 笑顔。笑顔。笑顔…
  event_staranis2_02_e_81:
    speaker: "<Narration>"
    en: You said you were bullied. What did that feel like?
    ko: 괴롭힘당했다며? 어떡해?
    ja: |-
      いじめられてたんだって？
      どんないじめ？
  event_staranis2_02_e_82:
    speaker: "<Narration>"
    en: How did you feel back then? Did it make you resent the world?
    ko: 그때 기분이 어땠어? 세상이 원망스럽다거나 막 그랬어?
    ja: |-
      どんな気分だった？
      世の中がイヤになったりした？
  event_staranis2_02_e_83:
    speaker: "<Narration>"
    en: Did the thought of dying ever cross your mind?
    ko: 죽고 싶다는 생각은 안 들었어?
    ja: 死にたいとか思わなかったの？
  event_staranis2_02_e_84:
    speaker: anis_idol
    en: Hold it in. Hold it in. Just hold it in.
    ko: 참자. 참자. 참자.
    ja: 耐えろ。耐えろ。耐えろ…
  event_staranis2_02_e_85:
    speaker: anis_idol
    en: Mint and Prika are holding it together too. I'm the leader. I can't be the
      one who screws this up.
    ko: |-
      민트도 프리카도 참고 있잖아.
      리더인 내가 망칠 수 없어.
    ja: |-
      ミントとプリカが頑張ってるのに、
      リーダーの私がここで
      台無しにするわけにはいかない。
  event_staranis2_02_e_86:
    speaker: anis_idol
    en: They must have it worse than me.
    ko: 민트랑 프리카 힘들겠다.
    ja: ミントもプリカもつらいはずなのに。
  event_staranis2_02_e_87:
    speaker: anis_idol
    en: But neither of them's saying we should quit. That's probably because of me.
    ko: |-
      그런데 그만두자고 얘기하지 않네.
      아마 나 때문이겠지.
    ja: |-
      全然やめようって言わない。
      ぜったい私のせいだ。
  event_staranis2_02_e_88:
    speaker: anis_idol
    en: You stuck with me when I had nothing. I was too embarrassed to ever say it,
      but thank you, really.
    ko: |-
      아무것도 없는 나를 위해 계속 따라와 줬어.
      부끄러워서 말한 적은 없지만 너무 고마워. 진짜 고마워.
    ja: |-
      何もない私にずっとついてきてくれて…
      照れくさくて言えないけど、感謝してる。
      本当に本当に、ありがとう。
  event_staranis2_02_e_89:
    speaker: anis_idol
    en: I'm sorry, guys. And thank you. I can keep going because you're here.
    ko: |-
      미안해 얘들아. 고마워 얘들아.
      너희가 있어서 견딜 수 있어.
    ja: |-
      ごめんね、2人とも。それから、ありがとう。
      2人のおかげで私は耐えられてる。
  event_staranis2_02_e_90:
    speaker: anis_idol
    en: We all know we're not special.
    ko: 우리 모두 알아. 우리가 특별하지 않다는 거.
    ja: |-
      分かってるの。
      自分たちは特別でも何でもないって。
  event_staranis2_02_e_91:
    speaker: anis_idol
    en: But this is how we get there, so let's believe in that. We'll believe that.
      We have to. We will.
    ko: |-
      특별해질 수 있는 과정이라고 믿자.
      믿자. 믿자. 믿자.
    ja: |-
      これがそうなる道だって信じるの。
      信じて。信じて。信じて。
  event_staranis2_02_e_92:
    speaker: "<Narration>"
    en: Thank goodness...
    ko: 아 다행이다 정말.
    ja: ああ～、よかった
  event_staranis2_02_e_93:
    speaker: "<Narration>"
    en: My life's been such a mess, and it's been exhausting.
    ko: 내 인생이 너무 형편없어서, 진짜 너무너무너무 힘들었는데.
    ja: |-
      僕の人生って本当にみじめで、
      すごくすごくすごくつらかったけど
  event_staranis2_02_e_94:
    speaker: "<Narration>"
    en: But seeing you? It actually makes me feel better.
    ko: |-
      너흴 보니 힘이 나.
      너흴 보면 내 인생이 되게 잘나 보이거든.
    ja: |-
      君たちを見てると力がもらえるんだ。
      自分の人生が立派に思えてきてさ
  event_staranis2_02_e_95:
    speaker: "<Narration>"
    en: So please, stay right where you are at the bottom. I need someone like you
      to remind me there's still hope.
    ko: |-
      제발 그렇게 계속 시궁창에 있어 줘.
      내가 너흴 보고 희망을 가질 수 있게.
    ja: |-
      ずっとそうやって汚れててほしいな、
      僕が希望を持てるから
  event_staranis2_02_e_96:
    speaker: anis_idol
    en: But if we keep this up, will it really make us special?
    ko: 그런데 이렇게 하면 특별해질 수 있는 거 맞아?
    ja: でも、こんなことで本当に特別になれるの？
  event_staranis2_02_e_97:
    speaker: anis_idol
    en: Wait, we went up again. 6th? You've got to be kidding me.
    ko: 아, 순위 또 올랐다. 6위네. 말도 안 돼.
    ja: |-
      ああ…順位がまた上がってる。
      6位だって。信じられない。
  event_staranis2_02_e_98:
    speaker: anis_idol
    en: Yeah, just hang in there. Once we break into the mainstream, it'll all sort
      itself out.
    ko: 응. 참자. 메이저로 올라가면 다 해결될 거야.
    ja: |-
      そうよ…我慢するしかない。
      メジャーに上がったら、
      何もかも解決するはず。
  event_staranis2_02_e_99:
    speaker: anis_idol
    en: We'll make all this stupid crap worth it.
    ko: 이런 바보 같은 짓을 다 보상받을 수 있을 거야.
    ja: |-
      こんなことだって、
      頑張ったかいがあったって言える日が来る。
  event_staranis2_02_e_100:
    speaker: "<Narration>"
    en: I've been a fan since your Meet & Meat days, but what a letdown.
    ko: 미트 미트 때부터 팬이었는데, 아쉽다.
    ja: |-
      ミートミートの頃からファンだったけど、
      ガッカリだよ
  event_staranis2_02_e_101:
    speaker: "<Narration>"
    en: So in the end, you're just like every other pop star, huh? Pulling cheap stunts
      like this for attention.
    ko: |-
      결국 너희도 다른 아이돌들이랑 다를 게 없네.
      이런 말도 안 되는 짓으로 홍보나 하고.
    ja: |-
      結局お前らも他のアイドルと同じなんだ。
      こんなバカみたいなことやりだして
  event_staranis2_02_e_102:
    speaker: "<Narration>"
    en: Say you're sorry. Apologize for disappointing me
    ko: 나 실망시켜서 미안하다고 사과해.
    ja: 俺を失望させてごめんなさいって謝れよ
  event_staranis2_02_e_103:
    speaker: "<Narration>"
    en: and for wasting my support and my time. Oh, and smile while you're at it.
    ko: |-
      내 응원과 시간을 낭비시켜서 미안하다고 사과해.
      웃으면서 사과해.
    ja: |-
      俺の応援と時間を無駄に使わせて
      ごめんなさいって謝れ。
      笑顔で謝罪しろよ
  event_staranis2_02_e_104:
    speaker: anis_idol
    en: Why am I even doing this again?
    ko: 내가 이 짓을 왜 하고 있더라.
    ja: 私、なんでこんなことしてるんだろ？
  event_staranis2_02_e_105:
    speaker: anis_idol
    en: Oh right, I wanted to be like Pretty. I wanted to give people hope.
    ko: |-
      아, 프리티처럼 되고 싶어서.
      사람들한테 희망을 주고 싶어서.
    ja: |-
      そう…プリティーみたいに
      なりたかったんだっけ。
      みんなに希望を与えられる存在に…
  event_staranis2_02_e_106:
    speaker: anis_idol
    en: I wanted to become a star.
    ko: 별이 되고 싶어서.
    ja: 星に、なりたいから。
  event_staranis2_02_e_107:
    speaker: anis_idol
    en: If I do this, I can become one, right?
    ko: 이거 하면 별이 될 수 있나?
    ja: これが終われば、星になれる？
  event_staranis2_02_e_108:
    speaker: anis_idol
    en: I can, right? I mean, that is why I'm doing this, right?
    ko: 있겠지? 그러니까 이러고 있겠지?
    ja: なれるよね？だから、やることにしたはず。
  event_staranis2_02_e_109:
    speaker: "<Narration>"
    en: Be honest. You're the one who exposed Yoyo's past, right?
    ko: |-
      솔직히 말해줘.
      요요 과거 폭로한 거 너지?
    ja: |-
      正直に言えよ。
      ヨヨの過去をリークしたの、お前だろ？
  event_staranis2_02_e_110:
    speaker: "<Narration>"
    en: I heard she bullied you pretty badly. So that was payback, wasn't it?
    ko: 괴롭힘 엄청 당했다며. 그래서 그냥 엿 먹으라고 그런거 아냐?
    ja: |-
      ひどいいじめに遭ってたんだろ？
      だから復讐のためにやったんだろ？
  event_staranis2_02_e_111:
    speaker: "<Narration>"
    en: Clever. You drag Yoyo down, pick up sympathy votes, and ride that all the
      way to the top.
    ko: 머리 좋다. 요요는 떨어뜨리고, 너는 동정표를 얻어서 승승장구하고.
    ja: |-
      賢いな～お前。ヨヨを蹴落として、
      お前は同情で売れるってワケか
  event_staranis2_02_e_112:
    speaker: "<Narration>"
    en: Wow, pop stars these days really have to be smart. Oh right, you're just trash,
      not a pop star.
    ko: |-
      이야~ 역시 요즘 아이돌은 머리도 좋아야 해.
      아. 아이돌이 아니지. 쓰레기통이었지.
    ja: |-
      いや～、アイドルも最近は
      頭が切れないとやってけないよな？
      あ、お前はアイドルじゃなくてゴミ箱か
  event_staranis2_02_e_113:
    speaker: anis_idol
    en: Yeah, it'll help. It will. It has to.
    ko: |-
      응. 분명히 도움이 될 거야.
      이건 분명 도움이 돼.
    ja: |-
      そう。きっと将来のためになる。
      これだってきっと成功の糧になるはず。
  event_staranis2_02_e_114:
    speaker: anis_idol
    en: Our ranking shot up, and more people know us now.
    ko: 실제로 순위도 많이 올랐고, 알아봐 주는 사람들도 많아.
    ja: |-
      実際にランキングは上がってるし、
      知名度だって上がってる。
  event_staranis2_02_e_115:
    speaker: anis_idol
    en: Love's still love, right? Even like this.
    ko: |-
      사랑받는 형태는 다 다를 수 있잖아.
      이렇게라도 사랑받는 거에 감사하자.
    ja: |-
      愛にもいろんな形があるっていうし、
      こんな形でも愛してもらえることに
      感謝しなくちゃ。
  event_staranis2_02_e_116:
    speaker: anis_idol
    en: So we should be grateful. We should. Thanks.
    ko: 감사. 하자. 감. 사. 고맙습. 니다.
    ja: |-
      感謝。しないと。か、ん、しゃ…
      アリガトウ、ゴザイマス…
  event_staranis2_02_e_117:
    speaker: "<Narration>"
    en: I looked up every T.T. STAR video I could find.
    ko: T.T. STAR 영상을 다 찾아봤습니다.
    ja: T.T. STARの動画、全部見ました
  event_staranis2_02_e_118:
    speaker: "<Narration>"
    en: Hmm... And if I'm being honest?
    ko: 흠… 솔직한 제 감상을 말씀드리자면.
    ja: 感想を…正直にお伝えするとですね
  event_staranis2_02_e_119:
    speaker: "<Narration>"
    en: You all have zero talent, especially you, Anis. Do you even have any respect
      for what you do?
    ko: |-
      재능이 너무 없어요. 특히 당신. 아니스.
      아이돌을 얕보고 있는 것 아닙니까?
    ja: |-
      才能なさすぎです。特にアニス、あなた。
      アイドルを舐めてませんか？
  event_staranis2_02_e_120:
    speaker: "<Narration>"
    en: Your singing, your dancing, your stage presence, your whole persona... It's
      all painfully mediocre. No wonder you resort to cheap stunts like this.
    ko: |-
      노래도, 춤도, 퍼포먼스도, 캐릭터성도 모두 애매해요.
      그러니 이런 기행에 집착하는 거겠지만요.
    ja: |-
      歌も、ダンスも、キャラも全部半端です。
      だからこんなことで
      一発を狙ってるんでしょうけど
  event_staranis2_02_e_121:
    speaker: "<Narration>"
    en: Damnit, this pisses me off. You've completely ruined my mood, so I think I
      deserve some compensation.
    ko: |-
      하아… 너무 화가 나는군요.
      당신 때문에 제 기분이 너무 상해서 보상을 받아야겠습니다.
    ja: |-
      はあ…あなたを見てるとイライラします。
      あなたのせいで不快になったわけですから
      責任を取ってください
  event_staranis2_02_e_122:
    speaker: "<Narration>"
    en: Why don't you lift your skirt a little? Just a bit.
    ko: 치마 좀 들어줄 수 있어요? 살짝이라도 좋으니까.
    ja: |-
      少しは反省の態度ってものを
      見せたらどうですか？
  event_staranis2_02_e_123:
    speaker: anis_idol
    en: Thank you for loving me. I wanted that more than anything.
    ko: |-
      사랑해 줘서 고맙습니다.
      저 진짜 사랑받고 싶었거든요.
    ja: |-
      愛してくれてありがとうございます。
      私、すごく愛されたかったんです。
  event_staranis2_02_e_124:
    speaker: anis_idol
    en: I'll do better. I swear I will. I'll become a star and give back all the love
      I've been given.
    ko: |-
      잘할게요. 저.
      별이 되어서, 제가 받았던 사랑. 다 나눠드릴게요.
    ja: |-
      私、頑張ります。
      星になって、今まで受けた愛を
      全部お返しします。
  event_staranis2_02_e_125:
    speaker: anis_idol
    en: To those of you who fell into despair, who felt like giving up,
    ko: 절망에 빠져서 삶을 포기한 당신에게.
    ja: 絶望して人生を諦めた人に、
  event_staranis2_02_e_126:
    speaker: anis_idol
    en: I'll tell you it's okay to keep living.
    ko: 살아도 된다고 말해줄게요.
    ja: 生きてていいんだって伝えたいんです。
  event_staranis2_02_e_127:
    speaker: anis_idol
    en: I'll be there for you when you're lonely, when you're exhausted.
    ko: 외롭고 지친 당신을 위로해 줄게요.
    ja: 寂しくて疲れ切った人に寄り添って…
  event_staranis2_02_e_128:
    speaker: anis_idol
    en: And in the end,
    ko: 그리고 끝내.
    ja: またねって言う時には…
  event_staranis2_02_e_129:
    speaker: anis_idol
    en: I'll make sure you feel like staying alive was the right choice.
    ko: 살아있 기를잘했 다고느끼 게해줄게 요.
    ja: 生きててよかったって、感じてほしい。
  event_staranis2_02_e_130:
    speaker: riss
    en: G-good work today, everyone.
    ko: 오, 오늘도 다들 수고했어.
    ja: み、みんな、今日もお疲れ様…
  event_staranis2_02_e_131:
    speaker: riss
    en: I-I got loads of snacks for you, and um... some new bath bombs too.
    ko: |-
      가, 간식 엄청 많이 사왔어.
      아, 입욕제도 새로운 거 사 왔고.
    ja: |-
      お、おやつ、たくさん買ってきたよ。
      あっ、新しい入浴剤も。
  event_staranis2_02_e_132:
    speaker: riss
    en: Oh, and I've also changed all the bedding, and... um...
    ko: 그리고 어… 침구도 다 갈았고, 그리고….
    ja: |-
      それから、ええと…シーツも全部新品だし、
      それと…
  event_staranis2_02_e_133:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_134:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_135:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_136:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_137:
    speaker: riss
    en: Y-you made it to number 4 on the indie charts. They're saying they've never
      seen a climb this fast before.
    ko: |-
      마, 마이너 랭킹 4위까지 올랐어.
      이렇게까지 빠르게 올라간 건 처음이래.
    ja: |-
      イ、インディーズのランキング、
      4位まで上がってる。
      こんな急上昇は初めてだって。
  event_staranis2_02_e_138:
    speaker: riss
    en: I-it's all thanks to you guys working so hard. Y-you've really done an amazing
      job...
    ko: |-
      다, 다들 열심히 해 준 덕분이야.
      정말 고생 많았어.
    ja: |-
      み、みんなが一生懸命頑張ったからだよ。
      本当にお疲れ様…
  event_staranis2_02_e_139:
    speaker: "<Narration>"
    en: The room is completely silent.
    ko: 숙소에는 아무런 소리도 들리지 않았다.
    ja: 答えはどこからもない
  event_staranis2_02_e_140:
    speaker: "<Narration>"
    en: They sit scattered across beds, chairs, and the floor, staring blankly into
      space.
    ko: 각자가 침대, 의자, 바닥에 앉아 멍하니 허공만 바라보고 있다.
    ja: |-
      話しかけた相手は誰もがベッドか、
      椅子か、床に腰を下ろしたまま、
      ぼんやりと虚空を見つめている
  event_staranis2_02_e_141:
    speaker: "<Narration>"
    en: Two weeks have passed since the Smile Time project began.
    ko: 스마일 박스 프로젝트가 시작된 지 2주.
    ja: |-
      スマイルボックスプロジェクトが
      始まってから2週間…
  event_staranis2_02_e_142:
    speaker: "<Narration>"
    en: Turned into toys for the masses, T.T. STAR is already breaking apart.
    ko: 불특정 다수의 장난감이 된 T.T. STAR는 빠르게 망가졌다.
    ja: |-
      無数の悪意の的にされたT.T. STARは
      すでに壊れかけていた
  event_staranis2_02_e_143:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_144:
    speaker: riss
    en: Um... guys?
    ko: 저… 얘들아?
    ja: ねえ…みんな？
  event_staranis2_02_e_145:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_146:
    speaker: anis_idol
    en: Huh? Yeah, what's up?
    ko: 아, 응. 왜?
    ja: ああ…うん。どうしたの？
  event_staranis2_02_e_147:
    speaker: riss
    en: Should we stop?
    ko: 그만할까?
    ja: やめにしない？
  event_staranis2_02_e_148:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_149:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_150:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_151:
    speaker: riss
    en: Let's stop.
    ko: 그만하자.
    ja: やめようよ。
  event_staranis2_02_e_152:
    speaker: riss
    en: We all know this isn't right.
    ko: 다들 알잖아. 이건 아니라는 거.
    ja: |-
      みんなも思ってるでしょ、
      こんなのおかしいって。
  event_staranis2_02_e_153:
    speaker: riss
    en: Let's just stop.
    ko: 이제 그만하자.
    ja: もうやめよう？
  event_staranis2_02_e_154:
    speaker: anis_idol
    en: How... do we even stop this...?
    ko: 어떻… 게. 그만… 해?
    ja: やめられる…わけ…ないでしょ…？
  event_staranis2_02_e_155:
    speaker: riss
    en: We can deal with the penalties later.
    ko: 나중에 생각하자.
    ja: 後で考えればいいから。
  event_staranis2_02_e_156:
    speaker: riss
    en: Just set that aside for now.
    ko: 위약금이니 뭐니 생각하는 건 뒤로 미루자.
    ja: 違約金とか、そういうことは後でいいから。
  event_staranis2_02_e_157:
    speaker: riss
    en: First, we need to get out of here.
    ko: 지금 여기를 벗어나는 것부터 생각하자.
    ja: 今はここから抜け出すことだけ考えようよ。
  event_staranis2_02_e_158:
    speaker: riss
    en: We might have to start over from nothing, and maybe we won't ever make it
      back as pop stars...
    ko: |-
      처음부터 다시 시작해야겠지만,
      어쩌면 다시 아이돌로 돌아올 수 없을지도 모르지만.
    ja: |-
      また一からやり直しでも、
      アイドルに戻れなくなっても…
  event_staranis2_02_e_159:
    speaker: riss
    en: But... this isn't right.
    ko: 이건… 아니야.
    ja: こんなの…間違ってる。
  event_staranis2_02_e_160:
    speaker: riss
    en: So please... let's stop.
    ko: 그러니… 그만하자.
    ja: だから…もう…
  event_staranis2_02_e_161:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_162:
    speaker: anis_idol
    en: What about Boss...?
    ko: 사장님은…?
    ja: 社長は…？
  event_staranis2_02_e_163:
    speaker: riss
    en: Still... no word.
    ko: 아직… 연락이 없어.
    ja: まだ…連絡はないよ。
  event_staranis2_02_e_164:
    speaker: riss
    en: He's not... picking up either...
    ko: 연락도… 안 받고….
    ja: こっちからは…繋がらないし…
  event_staranis2_02_e_165:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_166:
    speaker: "<Narration>"
    en: Anis looks at Mint and Prika.
    ko: 아니스가 민트와 프리카를 바라본다.
    ja: アニスはミントとプリカの様子を見た
  event_staranis2_02_e_167:
    speaker: "<Narration>"
    en: They meet her eyes.
    ko: 둘은 아니스를 바라본다.
    ja: 2人もアニスの様子をうかがっている
  event_staranis2_02_e_168:
    speaker: "<Narration>"
    en: And only now, it hits her...
    ko: 아니스는 너무 늦었다고 생각했다.
    ja: アニスは遅すぎたと感じた
  event_staranis2_02_e_169:
    speaker: "<Narration>"
    en: It's too late.
    ko: 이 말을 꺼내기까지 너무 늦었다고 생각했다.
    ja: この言葉を口に出すのが、遅すぎた
  event_staranis2_02_e_170:
    speaker: "<Narration>"
    en: She should have said something sooner.
    ko: 진작 얘기했어야 했다.
    ja: もっと早く言うべきだった
  event_staranis2_02_e_171:
    speaker: anis_idol
    en: Can we stop...?
    ko: 그만….
    ja: やめ…
  event_staranis2_02_e_172:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピピッ――
  event_staranis2_02_e_173:
    speaker: "<Narration>"
    en: Her phone vibrates.
    ko: 핸드폰이 울린다.
    ja: 携帯が鳴った
  event_staranis2_02_e_174:
    speaker: "<Narration>"
    en: She glances at the screen.
    ko: 시선을 돌려 화면을 본다.
    ja: スクリーンの通知を見た
  event_staranis2_02_e_175:
    speaker: "<Narration>"
    en: 'A notification pops up: they''ve hit No. 1 on the indie charts.'
    ko: 마이너 아이돌 랭킹 1위 달성 알림이다.
    ja: |-
      まだメジャーではないとはいえ、
      ランキング1位達成の通知だった
  event_staranis2_02_e_176:
    speaker: "<Narration>"
    en: Everyone looks at one another.
    ko: 모두가 서로의 얼굴을 바라본다.
    ja: その場にいた誰もが顔を見合わせた
  event_staranis2_02_e_177:
    speaker: "<Narration>"
    en: Just one more step,
    ko: 여기에서 한 단계만 더 올라가면
    ja: あと一歩、もう1段上がることさえできれば…
  event_staranis2_02_e_178:
    speaker: "<Narration>"
    en: and they'll finally break into the mainstream they've been chasing for so
      long.
    ko: 그렇게나 꿈에 그리던 메이저로 간다.
    ja: |-
      夢見ていたメジャーアイドルの世界に
      足を踏み入れられる
  event_staranis2_02_e_179:
    speaker: "<Narration>"
    en: Anis turns to Riss.
    ko: 아니스가 리스의 얼굴을 본다.
    ja: アニスはリスの顔をのぞき込んだ
  event_staranis2_02_e_180:
    speaker: riss
    en: Anis...
    ko: "…아니스."
    ja: "…アニス…"
  event_staranis2_02_e_181:
    speaker: "<Narration>"
    en: Riss scans the group,
    ko: 리스는 T.T. STAR를 본다.
    ja: リスはT.T. STARのメンバーたちを見た
  event_staranis2_02_e_182:
    speaker: "<Narration>"
    en: studying their expressions.
    ko: 모두의 표정을 본다.
    ja: その表情をうかがった
  event_staranis2_02_e_183:
    speaker: riss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_02_e_184:
    speaker: riss
    en: Okay...
    ko: "…그래."
    ja: "…うん。"
  event_staranis2_02_e_185:
    speaker: riss
    en: Then...
    ko: 그럼….
    ja: じゃあ…
  event_staranis2_02_e_186:
    speaker: riss
    en: just a little longer... just a little more...
    ko: 조금만… 조금만 더 해보자.
    ja: 少しだけ…あともう少しだけ。
  event_staranis2_02_e_187:
    speaker: "<Narration>"
    en: Silence hangs over the dorm once more.
    ko: 숙소에는 또다시, 아무런 소리도 들리지 않았다.
    ja: 部屋は再び、静まり返った
  event_staranis2_02_e_188:
    speaker: "<Narration>"
    en: A faint, relentless biting sound breaks the silence.
    ko: 빠득, 빠득, 빠득.
    ja: カリ、カリ、カリ――
  event_staranis2_02_e_189:
    speaker: "<Narration>"
    en: The room is dark. The only light comes from Yoyo's phone.
    ko: 어두운 방. 요요는 핸드폰 화면만을 바라본다.
    ja: |-
      真っ暗な部屋で、
      ヨヨが携帯端末の画面をにらんでいた
  event_staranis2_02_e_190:
    speaker: "<Narration>"
    en: She stares at the screen and chews her nails down to nothing as if she can
      tear through the display with sheer will.
    ko: 손톱을 짓씹으며, 핸드폰 화면을 죽일 듯이 노려본다.
    ja: |-
      爪を噛みながら、
      すさまじい形相で画面に見入っている
  event_staranis2_02_e_191:
    speaker: "<Narration>"
    en: It's the indie charts.
    ko: 마이너 아이돌 랭킹 페이지다.
    ja: インディーズ・アイドルランキング…
  event_staranis2_02_e_192:
    speaker: "<Narration>"
    en: T.T. STAR sits at number one.
    ko: 1위에 T.T. STAR가 보인다.
    ja: そのトップにT.T. STARの名がある
  event_staranis2_02_e_193:
    speaker: "<Narration>"
    en: She refreshes. Again. And again.
    ko: 수십번 새로고침 한다.
    ja: 指は何十回と更新ボタンを押し続けていた
  event_staranis2_02_e_194:
    speaker: "<Narration>"
    en: The ranking doesn't change.
    ko: 순위에는 변동이 없다.
    ja: ランキングに変化はない
  event_staranis2_02_e_195:
    speaker: "<Narration>"
    en: She refreshes again.
    ko: 수십번 새로고침 한다.
    ja: さらに数十回、画面が更新された
  event_staranis2_02_e_196:
    speaker: "<Narration>"
    en: Still nothing changes.
    ko: 여전히 순위에는 변동이 없다.
    ja: それでも変化はなかった
  event_staranis2_02_e_197:
    speaker: "<Narration>"
    en: "*Crunch, crunch, crunch*"
    ko: 빠득, 빠득, 빠득.
    ja: カリ、カリ、カリ――
  event_staranis2_02_e_198:
    speaker: "<Narration>"
    en: The sound of her nails being gnawed raw fills the darkness again and again,
      the only thing breaking the silence.
    ko: 어두운 방에는 손톱이 뜯어지는 소리만 가득 찼다.
    ja: 暗い部屋に、爪を噛む音だけが続いた
event_staranis2_03_s:
  event_staranis2_03_s_1:
    speaker: "<Narration>"
    en: Hanson stands rigid in the hospital's spotless corridor.
    ko: 한슨은 병원의 깔끔한 복도에 꼿꼿하게 서 있다.
    ja: |-
      ハンソンは静かな病院の廊下で
      背筋を伸ばした
  event_staranis2_03_s_2:
    speaker: "<Narration>"
    en: His gaze fixes on the tightly shut door, eyes hard.
    ko: 눈앞의 굳게 닫힌 문을 노려보듯 바라본다.
    ja: |-
      目の前にある固く閉ざされた扉を
      にらみつけていた
  event_staranis2_03_s_3:
    speaker: "<Narration>"
    en: He checks his phone.
    ko: 핸드폰을 확인한다.
    ja: 携帯端末を確かめる
  event_staranis2_03_s_4:
    speaker: "<Narration>"
    en: 'A notification pops up: T.T. STAR has taken No. 1 on the indie charts.'
    ko: T.T. STAR가 마이너 아이돌 랭킹 1위에 올랐다는 알림이 뜬다.
    ja: |-
      T.T. STARが
      インディーズアイドルの
      トップに立ったという通知が表示されていた
  event_staranis2_03_s_5:
    speaker: hanson
    en: "... I'm sorry, everyone."
    ko: "…미안하다, 얘들아."
    ja: "…みんな、すまない。"
  event_staranis2_03_s_6:
    speaker: hanson
    en: Just... a little longer. Please.
    ko: 조금만. 조금만 기다려.
    ja: あと少し…あと少しだけ、待っていてくれ。
  event_staranis2_03_s_7:
    speaker: hanson
    en: It's almost over. Just hold on a bit more. I'm sorry.
    ko: 곧이야. 곧이니까. 참아 줘. 미안하다.
    ja: |-
      もうすぐだ。本当に。
      耐えてくれ…すまない。
  event_staranis2_03_s_8:
    speaker: "<Narration>"
    en: He slowly closes his eyes, replaying what just happened.
    ko: 눈을 지긋이 감고, 좀 전에 있었던 일을 회상한다.
    ja: |-
      目を閉じ、ここへ来るまでのことを
      思い起こした
  event_staranis2_03_s_9:
    speaker: elysionline0_op_l
    en: The documents came through.
    ko: 자료는 잘 전달 받았다.
    ja: "…データは受け取った。"
  event_staranis2_03_s_10:
    speaker: elysionline0_op_l
    en: I was under the impression our audit team already had a full picture of Tetra's
      misconduct, but...
    ko: 테트라의 더러운 짓거리에 대해서는 엘리시온의 감사팀도 충분히 알고 있을거라 생각했는데….
    ja: |-
      テトラの卑劣なやり口は、
      わが社の監査部で十分に
      把握できていると思っていたが…
  event_staranis2_03_s_11:
    speaker: elysionline0_op_l
    en: this goes far beyond what I expected.
    ko: 생각보다 훨씬 더 많군.
    ja: 想像以上だ、これは。
  event_staranis2_03_s_12:
    speaker: missilisline0_op_r
    en: Wow, there's a lot in here that could ruin someone. We've already cross-checked
      everything. It's solid.
    ko: |-
      치명적인 것도 엄청 많네.
      교차검증도 다 끝냈어.
    ja: |-
      致命的なものも相当ありますね。
      裏も確かに取れました。
  event_staranis2_03_s_13:
    speaker: missilisline0_op_r
    en: Now, if we make our move with this...
    ko: 이걸 들고 우리가 움직인다면….
    ja: この情報をもとに私たちが動けば…
  event_staranis2_03_s_14:
    speaker: hanson
    en: Yes, that would be the end of Tetra.
    ko: 예. 테트라는 끝이죠.
    ja: 言うまでもなく、テトラは終わります。
  event_staranis2_03_s_15:
    speaker: missilisline0_op_r
    en: Mustang too, I'd bet.
    ko: 머스탱이. 겠지.
    ja: マスタングが、ですね。
  event_staranis2_03_s_16:
    speaker: elysionline0_op_l
    en: Mustang and Tetra are one and the same. There's no difference.
    ko: |-
      머스탱이 테트라고, 테트라가 곧 머스탱이다.
      둘은 다르지 않아.
    ja: |-
      マスタングはテトラ、テトラはマスタングだ。
      同じことだろう。
  event_staranis2_03_s_17:
    speaker: elysionline0_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_s_18:
    speaker: elysionline0_op_l
    en: Good. Hanson, I'm impressed you managed to gather this much damning material
      on Tetra
    ko: 좋아. 한슨 네가 테트라에 치명적인 이 수많은 자료들을 이렇게 모아온 것엔 놀랐다.
    ja: |-
      ハンソン。お前がテトラにとって
      ここまで致命的となる
      データを握っていたことには驚いた。
  event_staranis2_03_s_19:
    speaker: elysionline0_op_l
    en: and to leave no trace behind. Your capabilities exceed my expectations.
    ko: 이걸 다 드러나지 않게 덮었다니, 수완이 대단하군.
    ja: |-
      これだけのものを全て、
      表に出ないよう隠しきっていたとは
      大した手腕だ。
  event_staranis2_03_s_20:
    speaker: hanson
    en: Thank you.
    ko: 감사합니다.
    ja: 光栄なお言葉です。
  event_staranis2_03_s_21:
    speaker: elysionline0_op_l
    en: So, you're telling us to use this to attack Tetra?
    ko: 그래서, 이 자료들을 가지고 테트라를 공격하라는 얘긴가?
    ja: |-
      それで、この情報を使って
      テトラを糾弾しろという話だったな？
  event_staranis2_03_s_22:
    speaker: missilisline0_op_r
    en: Us? Teaming up with Elysion?
    ko: 우리랑 엘리시온이 힘을 합쳐서?
    ja: 我々とエリシオンの共同で。
  event_staranis2_03_s_23:
    speaker: hanson
    en: Yes.
    ko: 예.
    ja: その通りです。
  event_staranis2_03_s_24:
    speaker: missilisline0_op_r
    en: Hmm... want the honest truth?
    ko: 흐응… 솔직히 말할까?
    ja: そうですねぇ…率直に言いましょうか？
  event_staranis2_03_s_25:
    speaker: missilisline0_op_r
    en: We've got a shot. More than a shot, actually. He's been doing some pretty
      dirty things.
    ko: |-
      승산은 있어. 솔직히 차고 넘쳐.
      어지간히 더러운 짓을 했었어야지.
    ja: |-
      勝算は立ちます。余裕をもってね。
      ここまでのものでは言い訳も利きません。
  event_staranis2_03_s_26:
    speaker: missilisline0_op_r
    en: Not like we're ones to talk... but this guy? He's basically acting like a
      king, doing whatever the hell he wants.
    ko: |-
      우리가 남 말할 처지는 아니지만… 얘는 거의 황제네.
      지가 하고 싶은 대로 다 했어.
    ja: |-
      我々が言えることでもないですが…
      まるで皇帝気取りです。
      ずいぶん好き勝手していたようだ。
  event_staranis2_03_s_27:
    speaker: missilisline0_op_r
    en: If we start shaking things up with this, Tetra'll fall apart.
    ko: 이것들을 쥐고 뒤흔든다면, 테트라는 무너질 거야.
    ja: |-
      この情報で揺さぶれば、
      テトラは崩壊するでしょう。
  event_staranis2_03_s_28:
    speaker: elysionline0_op_l
    en: More importantly, he's been working closely with V.T.C.
    ko: 결정적으로, V.T.C.와 긴밀하게 협력한 게 중요하다.
    ja: V.T.C.との関係が証明されることは致命的だ。
  event_staranis2_03_s_29:
    speaker: elysionline0_op_l
    en: and the Central Government is already at odds with them.
    ko: 중앙 정부는 이미 V.T.C.와 척을 진 상태다.
    ja: |-
      奴らは中央政府の敵と
      みなされるようになったからな。
  event_staranis2_03_s_30:
    speaker: missilisline0_op_r
    en: We already cleaned out V.T.C. once before.
    ko: 우리가 V.T.C.를 한 번 대청소 하기도 했고.
    ja: 我々も粛清に手を貸しました。
  event_staranis2_03_s_31:
    speaker: elysionline0_op_l
    en: So all that's left are stragglers.
    ko: 결국 남은 건 잔당들인 셈인데.
    ja: 生き延びているのはわずかな残党だけだが…
  event_staranis2_03_s_32:
    speaker: elysionline0_op_l
    en: And Mustang has aligned himself with them.
    ko: 머스탱은 지금 그쪽과 붙어먹고 있는 상태지.
    ja: マスタングは、それと手を組んでいる。
  event_staranis2_03_s_33:
    speaker: missilisline0_op_r
    en: That's treason and insurrection.
    ko: 반역죄, 내란죄가 성립된다는 얘기야.
    ja: |-
      反逆罪か内乱罪の、
      立派な適用条件になるでしょう。
  event_staranis2_03_s_34:
    speaker: elysionline0_op_l
    en: But...
    ko: 하지만….
    ja: しかし…
  event_staranis2_03_s_35:
    speaker: missilisline0_op_r
    en: Yeah, he's not someone you mess with.
    ko: 응. 못 건들겠지.
    ja: ええ。手出しはできないでしょうね。
  event_staranis2_03_s_36:
    speaker: hanson
    en: How so?
    ko: 어째서죠?
    ja: なぜでしょう？
  event_staranis2_03_s_37:
    speaker: elysionline0_op_l
    en: Tetra Line is one of the Ark's Big Three, and Mustang is its CEO.
    ko: |-
      테트라 라인은 방주의 3대 회사 중 하나다.
      머스탱은 그것의 CEO고.
    ja: |-
      テトララインはアーク三大企業の一角であり、
      マスタングはそのCEOだ。
  event_staranis2_03_s_38:
    speaker: elysionline0_op_l
    en: They don't just produce Nikkes or run entertainment.
    ko: 단순히 니케를 만든다거나, 엔터테인먼트 사업만 하는 게 아냐.
    ja: |-
      つまり、ニケの製造や娯楽事業だけを
      手掛けているわけではない。
  event_staranis2_03_s_39:
    speaker: elysionline0_op_l
    en: They're deeply embedded in the Ark's infrastructure.
    ko: 방주 전체의 인프라와 밀접하게 닿아있다.
    ja: |-
      三大企業はアーク全体の基盤構造と
      密接に結びついている。
  event_staranis2_03_s_40:
    speaker: elysionline0_op_l
    en: When Pretty was at her peak, Mustang used extensive lobbying to secure control
      over a significant portion of that infrastructure.
    ko: "프리티가 한창 주가를 올리고 있을 때, \n수많은 로비로 인프라 상당수의 사업권을 따냈어."
    ja: |-
      しかも奴はプリティーの影響で
      株価が跳ね上がった時期に、ロビー活動を
      重ねて基盤事業権の大半を掌握した。
  event_staranis2_03_s_41:
    speaker: elysionline0_op_l
    en: If Tetra falls, the Ark falls with it.
    ko: 테트라 라인이 무너지는 건 곧, 방주가 무너진다는 얘기와도 동일하다.
    ja: |-
      テトララインの危機は
      アークのインフラ構造の危機にも
      つながるということだ。
  event_staranis2_03_s_42:
    speaker: hanson
    en: I see... so Enikk won't just stand by and let it happen.
    ko: "…에닉이 가만히 있지 않을 거라는 얘기군요."
    ja: "…エニックが動くということですか。"
  event_staranis2_03_s_43:
    speaker: elysionline0_op_l
    en: That's right.
    ko: 그래.
    ja: そうだ。
  event_staranis2_03_s_44:
    speaker: missilisline0_op_r
    en: That's what makes him such a pain. He's running rampant, and we still can't
      lay a finger on him.
    ko: 그래서 골치아파. 머스탱이 저렇게 날뛰는데, 잡을 수 없어.
    ja: |-
      我々も頭の痛いところです。
      これほどの好き勝手をされていても、
      とがめることができない。
  event_staranis2_03_s_45:
    speaker: missilisline0_op_r
    en: If he goes down, Tetra goes down with him. That's exactly why even Enikk can't
      step in.
    ko: |-
      머스탱이 끝나면 테트라도 끝나.
      그렇기에 에닉도 어떻게 할 수가 없어.
    ja: |-
      マスタングが終われば、テトラも終わる。
      エニックも他に方法が無いと
      いうことでしょう。
  event_staranis2_03_s_46:
    speaker: missilisline0_op_r
    en: Tetra's basically his biggest shield.
    ko: 머스탱의 가장 큰 방패가 테트라인 셈이지.
    ja: |-
      テトララインの存在こそが、
      マスタングの最大の盾です。
  event_staranis2_03_s_47:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_s_48:
    speaker: elysionline0_op_l
    en: Of course, if Tetra collapses, we stand to gain a great deal.
    ko: 물론 테트라가 무너진다면 우리가 볼 득은 굉장하다.
    ja: |-
      無論、テトラが亡き者になれば
      我々は計り知れない利益を狙える。
  event_staranis2_03_s_49:
    speaker: elysionline0_op_l
    en: If one of the Big Three were to fall, it'd be nothing less than a gift from
      the heavens for Elysion and Missilis.
    ko: 3대 기업에서 하나가 빠진다는 건 엘리시온, 미실리스에게는 하늘에서 준 선물과도 같지.
    ja: |-
      三大企業が二大企業になることで
      増える取り分は、
      天からのたまわり物と言っていい。
  event_staranis2_03_s_50:
    speaker: missilisline0_op_r
    en: Problem is, we can't.
    ko: 그러지 못해서 문제지만 말이야.
    ja: 実現しようがないことを除けば、ですがね。
  event_staranis2_03_s_51:
    speaker: hanson
    en: "... I have a favor to ask of you both."
    ko: "…두 분께 부탁이 있습니다."
    ja: "…お二人にお願いしたいことがあります。"
  event_staranis2_03_s_52:
    speaker: elysionline0_op_l
    en: Go on.
    ko: 음. 말해라.
    ja: なんだ、言ってみろ。
  event_staranis2_03_s_53:
    speaker: missilisline0_op_r
    en: You went to all this effort, so sure, I'll indulge you. Go on, ask for whatever
      you want.
    ko: |-
      이 정도 자료를 준비해 줬으니까,
      뭐든 말해도 돼.
    ja: |-
      これほどのデータを用意してきたのです、
      遠慮せず何でも聞かせてください。
  event_staranis2_03_s_54:
    speaker: missilisline0_op_r
    en: You could even move your pop stars over to our company.
    ko: 네 아이돌들 데리고 우리 회사로 오는 것도, 괜찮아.
    ja: |-
      あなたのアイドルとやらごと、
      うちで引き抜いて差し上げても構いませんよ。
  event_staranis2_03_s_55:
    speaker: hanson
    en: I'd like you to arrange a meeting with Enikk.
    ko: 에닉과의 만남을 주선해 주십시오.
    ja: |-
      エニックと話をする機会を
      設けていただきたいのです。
  event_staranis2_03_s_56:
    speaker: elysionline0_op_l
    en: "... What?"
    ko: "…뭐?"
    ja: "…何だと？"
  event_staranis2_03_s_57:
    speaker: missilisline0_op_r
    en: "... Come again?"
    ko: "…뭐라고?"
    ja: "…それは…？"
  event_staranis2_03_s_58:
    speaker: "<Narration>"
    en: With a faint mechanical whir,
    ko: 지잉-
    ja: ガチャリ…
  event_staranis2_03_s_59:
    speaker: "<Narration>"
    en: the door in front of Hanson slides open, and Mustang steps out
    ko: 한슨의 앞에 있던 문이 열리며 머스탱이 걸어 나왔다.
    ja: 目の前の扉が開き、マスタングが現れた
  event_staranis2_03_s_60:
    speaker: "<Narration>"
    en: with his personal physician is at his side.
    ko: 그 옆에는 주치의가 함께 있다.
    ja: 隣に主治医を引き連れている
  event_staranis2_03_s_61:
    speaker: "<Narration>"
    en: Mustang pauses, a hint of surprise crossing his face at the sight of Hanson.
      Meanwhile, the physician fidgets uneasily.
    ko: |-
      머스탱은 한슨을 발견하고 조금 놀란 표정이 되었고,
      주치의는 안절부절못하는 표정이 되었다.
    ja: |-
      ハンソンに気づいたマスタングは
      少し驚いた顔を見せ、
      主治医はにわかに落ち着きを失くした
  event_staranis2_03_s_62:
    speaker: "<Narration>"
    en: Hanson lowers his head.
    ko: 한슨이 고개를 숙인다.
    ja: ハンソンが頭を下げた
  event_staranis2_03_s_63:
    speaker: hanson
    en: I've come to take you back to the office. Shall we go?
    ko: |-
      회사까지 모시러 왔습니다.
      가시죠.
    ja: |-
      お迎えに上がりました。
      行きましょう。
  event_staranis2_03_s_64:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_s_65:
    speaker: "<Narration>"
    en: Mustang looks at the physician.
    ko: 머스탱이 주치의를 바라본다.
    ja: マスタングの顔が主治医に向けられた
  event_staranis2_03_s_66:
    speaker: "<Narration>"
    en: Sweating heavily, he desperately avoids Mustang's gaze.
    ko: 주치의는 땀을 뻘뻘 흘리며 필사적으로 머스탱의 시선을 피한다.
    ja: |-
      主治医は冷や汗を垂れ流しながら
      必死にマスタングの視線を避けた
  event_staranis2_03_s_67:
    speaker: mustang_past
    en: All right, drive.
    ko: 좋아. 가지.
    ja: まあいい。行くか。
  event_staranis2_03_s_68:
    speaker: mustang_past
    en: Let's see if you've still got it.
    ko: 오랜만에 운전 실력 좀 볼까.
    ja: 久しぶりに運転の腕を見てやろう。
  event_staranis2_03_s_69:
    speaker: mustang_past
    en: Oi, not this way. Take a right, it's faster.
    ko: 어이. 이쪽 길이 아니야. 오른쪽이 더 빨라.
    ja: |-
      おい。そっちじゃない。
      右の方が早いだろう。
  event_staranis2_03_s_70:
    speaker: hanson
    en: The road is blocked. This is our only way through.
    ko: |-
      길이 봉쇄됐습니다.
      이 길밖에 없습니다.
    ja: |-
      もう車道は封鎖されています。
      この道しか残っていません。
  event_staranis2_03_s_71:
    speaker: mustang_past
    en: They just go around blocking everything. What, we're supposed to put up with
      it just because we've got cars?
    ko: |-
      하여간 대책 없이 막아대기만 하는군.
      차 있는 놈 서러워서 살겠나.
    ja: |-
      …ったく、ろくな対策もせずに
      封鎖ばっかり進めやがって。
      車持ちは窮屈になる一方だ。
  event_staranis2_03_s_72:
    speaker: hanson
    en: How long do you have left?
    ko: 얼마나 남았습니까.
    ja: あとどれほど？
  event_staranis2_03_s_73:
    speaker: mustang_past
    en: Two months, tops.
    ko: 길면 두 달이던가.
    ja: 長くて2ヶ月だそうだ。
  event_staranis2_03_s_74:
    speaker: mustang_past
    en: Heh, clever. You actually figured it out.
    ko: 잘도 알아냈군.
    ja: よく気づいたな。
  event_staranis2_03_s_75:
    speaker: hanson
    en: Your complexion and breathing seem different.
    ko: 안색과 호흡이 이전과는 달랐으니까요.
    ja: 顔色も呼吸も、昔と全然違いますから。
  event_staranis2_03_s_76:
    speaker: mustang_past
    en: So how'd you figure that out?
    ko: 그러니까 그걸 어떻게 알았냐고.
    ja: だから、なんでそれに気づいたんだ。
  event_staranis2_03_s_77:
    speaker: hanson
    en: Do you have any idea how many years I've spent looking at your face?
    ko: 당신 얼굴을 몇 년을 봐왔다고 생각하시는 겁니까.
    ja: 何年あなたの顔を見ていると？
  event_staranis2_03_s_78:
    speaker: mustang_past
    en: None of the others noticed.
    ko: 다른 놈들은 모르던데.
    ja: 他の奴は誰も気づきやしなかった。
  event_staranis2_03_s_79:
    speaker: hanson
    en: That's because no one ever really looked at you.
    ko: |-
      그 많은 사람 중에,
      당신의 얼굴을 제대로 본 사람은 한 명도 없었다는 얘기겠죠.
    ja: |-
      その大勢の中に、
      あなたの顔をまともに見ていた人は
      誰もいなかったということでしょう。
  event_staranis2_03_s_80:
    speaker: mustang_past
    en: "... Hmph."
    ko: "…흥."
    ja: "…フン…"
  event_staranis2_03_s_81:
    speaker: hanson
    en: You've got quite a few health issues, it seems.
    ko: 병이 한두 개가 아니던데요.
    ja: 病気も一つや二つじゃないようですね。
  event_staranis2_03_s_82:
    speaker: mustang_past
    en: Hardly surprising after all the fun I've had in Ephialtes.
    ko: 배드 드림에서 그렇게 질펀하게 놀아댔으니 멀쩡한 게 이상하겠지.
    ja: |-
      バッドドリームであれだけ遊び回ってりゃ、
      何ともない方がおかしいだろうな。
  event_staranis2_03_s_83:
    speaker: hanson
    en: You're at death's door, and you still look perfectly calm.
    ko: 죽음이 목전인데 멀쩡하시군요.
    ja: |-
      余命宣告されているにしては、
      元気に見えますが。
  event_staranis2_03_s_84:
    speaker: mustang_past
    en: Do I look calm? At this point, I've got more painkillers in me than I do blood.
    ko: |-
      멀쩡해 보이냐.
      지금 내 몸엔 피 대신 진통제가 흐르고 있을 거다.
    ja: |-
      そんなワケがあるか。
      今じゃほとんど血の代わりに
      鎮痛剤が流れてる身体だぞ。
  event_staranis2_03_s_85:
    speaker: hanson
    en: Does that mean there's no cure?
    ko: 완치는 안 되는 겁니까.
    ja: 治療の見込みは？
  event_staranis2_03_s_86:
    speaker: mustang_past
    en: There will be. A new drug's coming out soon. Just for me.
    ko: |-
      돼. 곧 신약이 나올 거다.
      내 전용으로.
    ja: |-
      ある。新しい薬の完成が近い。
      俺専用のな。
  event_staranis2_03_s_87:
    speaker: mustang_past
    en: They said it'll be ready in two weeks.
    ko: 완성까지 2주 남았다던가.
    ja: あと2週間で完成だ。
  event_staranis2_03_s_88:
    speaker: mustang_past
    en: I didn't team up with V.T.C. for nothing. Do you know how much money I've
      poured into them?
    ko: |-
      내가 괜히 V.T.C.랑 붙어먹은 게 아냐.
      돈을 얼마나 퍼부었는데.
    ja: |-
      V.T.C.と手を組んだかいがあった。
      ずいぶん金を持っていかれたがな。
  event_staranis2_03_s_89:
    speaker: hanson
    en: So you've known about this for a while, haven't you?
    ko: 병에 대해 안지는 오래되셨나보군요.
    ja: |-
      身体のことは、
      かなり以前から分かっていたようですね。
  event_staranis2_03_s_90:
    speaker: mustang_past
    en: Yeah, it's been a while. That's when I started investing.
    ko: |-
      그래. 오래됐지.
      그때부터 투자를 시작했다.
    ja: |-
      そうだな。もうずいぶん経った。
      気づいた頃から投資を始めた。
  event_staranis2_03_s_91:
    speaker: hanson
    en: If you intend to live that long, wouldn't Evergreen be the obvious choice?
    ko: 그렇게 오래 살고 싶으시면 이터널 라이프라도 맞지 그러셨습니까.
    ja: |-
      そこまで長生きしたければ、
      エターナルライフの投与も
      受ければよかったでしょう。
  event_staranis2_03_s_92:
    speaker: mustang_past
    en: That's not a cure. It only extends your lifespan.
    ko: 그건 치료제가 아니야. 수명이 길어지는 것뿐이지.
    ja: |-
      あんなもの、病気には使えん。
      ジジイになるのを遅らせるだけだ。
  event_staranis2_03_s_93:
    speaker: mustang_past
    en: And I couldn't care less about Evergreen.
    ko: 그리고 난 이터널 라이프는 관심 없다.
    ja: それに、「永遠の命」なんて面白くもない。
  event_staranis2_03_s_94:
    speaker: hanson
    en: Why? Thought you'd want to live forever?
    ko: 왜죠? 평생 해 드실 생각 아니었습니까?
    ja: |-
      なぜです？永遠に生きるつもりだと
      思っていました。
  event_staranis2_03_s_95:
    speaker: mustang_past
    en: Getting old's pathetic. Losing my edge? Even worse.
    ko: |-
      나이를 먹으면 감이 떨어지니까.
      체력과는 상관없이 머리가 굳겠지.
    ja: |-
      年を取るとな、ニブるんだ。
      体力の問題じゃない、頭が固くなる。
  event_staranis2_03_s_96:
    speaker: mustang_past
    en: But I'm not about to let some illness make me a has-been.
    ko: 퇴물 소리 듣고 싶진 않거든.
    ja: 誰にも俺が落ちぶれたなんて言わせやしない。
  event_staranis2_03_s_97:
    speaker: hanson
    en: Huh. Look at you, actually spending that much on a new drug.
    ko: 그런 분이 신약 제작에는 그렇게 또 투자하셨군요.
    ja: |-
      それでも、新薬の開発には
      大金を投資するワケですか。
  event_staranis2_03_s_98:
    speaker: mustang_past
    en: I hate getting old, and I hate trying to slow it down even more.
    ko: 늙는 건 싫다. 늙는 걸 늦추는 건 더 싫다.
    ja: |-
      自分が老いぼれるなんぞ許さん。
      引き延ばすのは、もっとゴメンだ。
  event_staranis2_03_s_99:
    speaker: mustang_past
    en: But a sickness like this still has to be dealt with.
    ko: 하지만 병은 고쳐야지.
    ja: だが、病気は治せるものだからな。
  event_staranis2_03_s_100:
    speaker: hanson
    en: You don't intend to let T.T. STAR go?
    ko: T.T. STAR를 풀어줄 생각은 없으십니까.
    ja: |-
      T.T. STARを解放するつもりは
      なさそうですね。
  event_staranis2_03_s_101:
    speaker: mustang_past
    en: Don't delude yourself. They're not going anywhere. You saw that with your
      own eyes, didn't you?
    ko: |-
      착각하지 마라.
      그것들이 나가지 않는 거야. 너도 봤잖아?
    ja: |-
      勘違いするな。
      あいつらが出て行こうとしないんだ。
      お前も見ただろう？
  event_staranis2_03_s_102:
    speaker: mustang_past
    en: Popularity through the roof, hitting number one on the indie charts, no less.
      Not bad, I'll admit.
    ko: |-
      인기도 많다며.
      마이너 1위까지 올라오다니, 대단하군.
    ja: |-
      人気もかなり出てきた。
      二流リーグとはいえ1位だ、立派じゃないか。
  event_staranis2_03_s_103:
    speaker: mustang_past
    en: We need them, in ways you probably don't even realize.
    ko: 여러 가지 의미로 그것들은 필요해.
    ja: 今さら手放してはやらん、いろんな意味でな。
  event_staranis2_03_s_104:
    speaker: mustang_past
    en: And you've been running around like a madman, pulling all these ridiculous
      stunts just to build them up. Well done.
    ko: |-
      네가 그것들을 제대로 키우기 위해
      이렇게 미친 짓을 벌이고 다니는 걸로, 증명됐지.
    ja: |-
      お前があいつらを守るために
      こんなイカレたマネをしてるんだ、
      価値は疑いようもない。
  event_staranis2_03_s_105:
    speaker: hanson
    en: Ridiculous? Hardly. It's the most direct approach.
    ko: 미친 짓이라뇨. 정공법입니다.
    ja: イカレた真似？いたって正気です。
  event_staranis2_03_s_106:
    speaker: mustang_past
    en: You sold info on my illness to Elysion and Missilis, and Yoyo paid the price.
    ko: |-
      내 병에 대한 정보를 엘리시온과 미실리스에 팔고,
      그 대가로 요요를 무너뜨렸나.
    ja: |-
      俺の健康情報を
      エリシオンとミシリスに売り渡し、
      引き換えにヨヨを落とさせた。
  event_staranis2_03_s_107:
    speaker: mustang_past
    en: Turned tragedy into comedy. Bravo, well played.
    ko: |-
      비극으로 희극을 만들었군.
      훌륭해.
    ja: |-
      他人の悲劇で自分の喜劇を作ったわけだ。
      いい仕事だな。
  event_staranis2_03_s_108:
    speaker: mustang_past
    en: So tell me, what's next?
    ko: 그래서, 다음은 뭐지?
    ja: で、次はどうする？
  event_staranis2_03_s_109:
    speaker: mustang_past
    en: Honestly, the simplest way would be to put a bullet in my head right here.
    ko: 사실 가장 간단한 방법은 지금 이 자리에서 내 머리에 총알을 박는 거다.
    ja: |-
      一番手っ取り早いのは、今ここで
      俺の頭に弾丸をぶち込むことだろうな。
  event_staranis2_03_s_110:
    speaker: mustang_past
    en: That would wrap everything up perfectly.
    ko: 그럼 모든 게 깔끔하게 해결돼.
    ja: そうすりゃ、簡単に決着がつく。
  event_staranis2_03_s_111:
    speaker: hanson
    en: That won't resolve anything. I don't want to take action that we can't remedy
      afterward.
    ko: |-
      아무것도 해결되지 않습니다.
      뒷수습이 불가능한 짓은 하고 싶지 않습니다.
    ja: |-
      それでは何の解決にもなりません。
      後始末が手に負えなくなるでしょう。
  event_staranis2_03_s_112:
    speaker: mustang_past
    en: Why not bribe the doctor and swipe the new drug? Once a man's been bought,
      the next time's even easier.
    ko: |-
      그럼 주치의를 매수해 신약을 빼돌릴 건가?
      한번 매수된 놈이니 다음은 쉬울 거다.
    ja: |-
      なら、あのクソ医者に新薬を失くさせるか？
      一度カネで転んだ奴だ、次も簡単だろう。
  event_staranis2_03_s_113:
    speaker: hanson
    en: That would certainly be the most reliable approach.
    ko: 그게 가장 확실하겠죠.
    ja: それが一番確実でしょうね。
  event_staranis2_03_s_114:
    speaker: hanson
    en: But I won't do that.
    ko: 그런데 저는 그렇게 하지 않을 겁니다.
    ja: ですが、そうするつもりはありません。
  event_staranis2_03_s_115:
    speaker: mustang_past
    en: Why not?
    ko: 왜지?
    ja: なぜ。
  event_staranis2_03_s_116:
    speaker: hanson
    en: I find it rather boring.
    ko: 시시하니까요.
    ja: 面白くないからです。
  event_staranis2_03_s_117:
    speaker: mustang_past
    en: Hahaha.
    ko: 흐하하.
    ja: ハハハ…
  event_staranis2_03_s_118:
    speaker: mustang_past
    en: "... Hanson,"
    ko: "…한슨."
    ja: "…ハンソン。"
  event_staranis2_03_s_119:
    speaker: mustang_past
    en: you really think you can save those heaps of scrap?
    ko: 네가 그 고철들을 구할 수 있을거라 생각하나?
    ja: |-
      あの鉄くずどもが
      救えるとでも思ってるのか？
  event_staranis2_03_s_120:
    speaker: hanson
    en: Yes, I will save them.
    ko: 예. 구할 겁니다.
    ja: ええ。必ず。
  event_staranis2_03_s_121:
    speaker: mustang_past
    en: You couldn't save Pretty, could you?
    ko: 프리티는 구하지 못했지.
    ja: プリティーは救えなかっただろう。
  event_staranis2_03_s_122:
    speaker: hanson
    en: "... That's why I'll save them this time."
    ko: "…그래서, 이번엔 구할 겁니다."
    ja: "…だからこそ、繰り返しません。"
  event_staranis2_03_s_123:
    speaker: mustang_past
    en: Well, good luck with that.
    ko: 뭐, 힘내라.
    ja: ま、せいぜい頑張るんだな。
  event_staranis2_03_s_124:
    speaker: mustang_past
    en: Oh, and those pop stars of yours?
    ko: 아, 그리고 그것들. 네 아이돌.
    ja: ああ、そういえば、お前のアイドルども…
  event_staranis2_03_s_125:
    speaker: mustang_past
    en: They're going mainstream next week. Thought you'd like a heads-up.
    ko: 다음 주에 메이저로 올릴 거다. 참고해라.
    ja: 来週からメジャー入りだ。覚悟しておけ。
  event_staranis2_03_s_126:
    speaker: hanson
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis2_03_s_127:
    speaker: mustang_past
    en: You know the mainstream is a whole different league.
    ko: 알겠지만, 메이저는 마이너와 차원이 달라.
    ja: |-
      分かってるだろうが、
      今までとはまったく次元が変わる。
  event_staranis2_03_s_128:
    speaker: mustang_past
    en: Anything goes, and it's all tit for tat.
    ko: 뭐든 용납되지. 서로서로 말이야.
    ja: 何でもアリの世界だ。お互いにな。
  event_staranis2_03_s_129:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_s_130:
    speaker: mustang_past
    en: Whatever it is you're planning, move fast,
    ko: 뭘 하든 서둘러야 할 거다.
    ja: |-
      何を企んでるにしても、
      のんびりしてる時間はないぞ。
  event_staranis2_03_s_131:
    speaker: mustang_past
    en: my son.
    ko: 아들아.
    ja: バカ息子が。
  event_staranis2_03_s_132:
    speaker: hanson
    en: "... Thank you for the advice, Father."
    ko: "…충고, 감사합니다. 아버지."
    ja: "…忠告、ありがとうございます。父さん。"
event_staranis2_03_e:
  event_staranis2_03_e_1:
    speaker: "<Narration>"
    en: "*Splat, splat, splat*"
    ko: 철퍽. 철퍽. 철퍽.
    ja: バシャッ、バシャッ、バシャッ――
  event_staranis2_03_e_2:
    speaker: "<Narration>"
    en: Water balloons hit Anis from all sides, bursting on impact.
    ko: 아니스의 몸 곳곳에 맞은 물풍선들이 터진다.
    ja: アニスに投げつけられた水風船が破裂する
  event_staranis2_03_e_3:
    speaker: "<Narration>"
    en: Foul-smelling, brightly colored sludge splashes across her body.
    ko: 악취와, 형형색색의 액체들이 퍼져나간다.
    ja: 悪臭が広がり、色とりどりの液体が飛び散った
  event_staranis2_03_e_4:
    speaker: "<Narration>"
    en: She tries to smile, but it won't come.
    ko: 아니스는 웃으려 애썼다. 하지만 도무지 웃음이 나지 않았다.
    ja: |-
      アニスは必死で笑顔を作ろうとしたが、
      もはやそれもできなくなっていた
  event_staranis2_03_e_5:
    speaker: "<Narration>"
    en: "... Hey, why aren't you smiling? You don't feel like it?"
    ko: "…왜 안 웃어? 하기 싫어?"
    ja: "…なんで笑わないんだよ？イヤになったのか？"
  event_staranis2_03_e_6:
    speaker: "<Narration>"
    en: Huh? That's weird. Isn't this supposed to be the Smile Time?
    ko: 어어? 이상하네? 스마일 박스라고 들었는데 왜 안 웃지?
    ja: |-
      あっれ～？おかしいな？
      スマイルボックスって名前なのに、
      笑わないんだ？
  event_staranis2_03_e_7:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_8:
    speaker: "<Narration>"
    en: Anis tries to smile, but her lips just won't budge.
    ko: 아니스는 웃으려 애썼다. 하지만 입꼬리가 조금도 올라가지 않았다.
    ja: |-
      アニスは必死で笑おうとした。
      だが、口角は少しも上がらない
  event_staranis2_03_e_9:
    speaker: "<Narration>"
    en: Hey! Seriously, this is pissing me off! Do you have any idea how hard I worked
      on this?
    ko: |-
      야! 아 진짜 짜증 나네!
      내가 이거 만들어 오느라고 얼마나 고생했는데!
    ja: |-
      何だよ！ムカつくな！
      俺がわざわざ手間をかけて
      作ってきてやったってのに！
  event_staranis2_03_e_10:
    speaker: "<Narration>"
    en: Fine, don't smile then. Just say "ah."
    ko: |-
      웃기 싫으면 웃지 마!
      대신 아 해. 아.
    ja: |-
      そんなに笑いたくなきゃ、好きにしな！
      代わりに、口を開けろ
  event_staranis2_03_e_11:
    speaker: "<Narration>"
    en: C'mon, open up. Aaaah.
    ko: 입 벌려. 아~~
    ja: ほら、早く、あ～ってな
  event_staranis2_03_e_12:
    speaker: anis_idol
    en: Ah...
    ko: "……아."
    ja: "…ああ…"
  event_staranis2_03_e_13:
    speaker: "<Narration>"
    en: Anis opens her mouth mechanically.
    ko: 아니스가 기계적으로 입을 벌린다.
    ja: アニスの口が機械のように開かれた
  event_staranis2_03_e_14:
    speaker: "<Narration>"
    en: A fan draws back their arm, about to throw a water balloon.
    ko: "[팬]이 물풍선을 힘껏 던지려 한다."
    ja: "「ファン」が水風船を手に振りかぶった"
  event_staranis2_03_e_15:
    speaker: riss
    en: Stop!
    ko: 그만---!!
    ja: やめて――！！
  event_staranis2_03_e_16:
    speaker: "<Narration>"
    en: Riss lunges forward
    ko: 리스가 달려 나간다.
    ja: リスが飛び出した
  event_staranis2_03_e_17:
    speaker: "<Narration>"
    en: and shoves the fan.
    ko: "[팬]을 밀친다."
    ja: 水風船を持ったファンが突き飛ばされた
  event_staranis2_03_e_18:
    speaker: "<Narration>"
    en: They go down hard, and the water balloon explodes across their face.
    ko: "[팬]이 넘어지며 물풍선이 자신의 얼굴 위에서 터진다."
    ja: |-
      水風船は弾け、
      持ち主の頭の上に中身をぶちまけた
  event_staranis2_03_e_19:
    speaker: "<Narration>"
    en: The fan lets out a shriek, retching and writhing on the floor.
    ko: "[팬]은 괴성을 지르며 구토하며, 바닥을 구른다."
    ja: |-
      会場に奇声が響き、
      ファンは口に入ったものを吐き出しながら
      地面を転がった
  event_staranis2_03_e_20:
    speaker: riss
    en: Stop! Just stop it!
    ko: 그만! 그만!
    ja: もうやめて！いい加減にして！
  event_staranis2_03_e_21:
    speaker: "<Narration>"
    en: Riss shouts at the fans, who stare at her in shock.
    ko: 리스는 놀란 눈으로 자신을 바라보고 있는 [팬]들을 향해 외친다.
    ja: 驚いた顔のファンに、リスが叫んだ
  event_staranis2_03_e_22:
    speaker: riss
    en: You think this is fun?!
    ko: 재밌어!? 이게 재밌어!?
    ja: 面白いの！？こんなことして！？
  event_staranis2_03_e_23:
    speaker: riss
    en: |-
      What the hell is wrong with you people?!
      You think this is okay?! You think this is normal?! Why do you keep doing this?! What's so damn fun about it?!
    ko: |-
      이게 정상이야? 이게 맞아?
      뭘 재밌다고 계속하고 있는 거야 왜!
    ja: |-
      正気？それでも人間？
      何が面白くて、こんなことするわけ！？
  event_staranis2_03_e_24:
    speaker: riss
    en: You pieces of trash, deal with your issues, your stress, your insecurities
      on your own!
    ko: 이 쓰레기들아! 너희 스트레스랑 열등감은 너희가 알아서 해!
    ja: |-
      クズばっかり！自分のストレスと劣等感くらい
      自分で何とかしなさいよ！
  event_staranis2_03_e_25:
    speaker: riss
    en: Don't you dare take it out on my pop star! Stay away from her! Don't come
      anywhere near her, you hear me?!
    ko: |-
      내 아이돌한테 풀지 마!
      내 아이돌한테 다가오지 말라고!
    ja: |-
