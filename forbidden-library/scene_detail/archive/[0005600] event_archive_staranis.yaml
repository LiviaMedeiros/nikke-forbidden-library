    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_101:
    speaker: "<Narration>"
    en: Hanson stares blankly at the list of posts Riss read on the forums before
      she died.
    ko: 한슨은 리스가 사망 전, 아이돌 게시판에서 확인한 글의 목록들을 한동안 멍하니 바라보았다.
    ja: |-
      ハンソンは、リスが最期に見ていた
      アイドル掲示板の画面を
      呆然と眺めた
  event_staranis2_03_e_102:
    speaker: "<Narration>"
    en: She died from asphyxiation caused by carotid compression.
    ko: 사인은 경동맥 압박에 의한 질식사.
    ja: 死因は頸動脈の圧迫
  event_staranis2_03_e_103:
    speaker: "<Narration>"
    en: 'Her suicide note contains only a single line:'
    ko: 유서엔 짧은 글 한 줄만이 쓰여 있었다.
    ja: 遺書はたった一言だけ
  event_staranis2_03_e_104:
    speaker: "<Narration>"
    en: '"I''m sorry for ruining everything."'
    ko: 내가 너희를 망쳐서 미안해.
    ja: "「台無しにしてごめんなさい」"
  event_staranis2_03_e_105:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_106:
    speaker: hanson
    en: I'm sorry... If I'd been there, it wouldn't have come to this...
    ko: 미안하다. 내가… 있었더라면… 이렇게까진….
    ja: |-
      すまない。
      私がその場にいれば…こんなことには…
  event_staranis2_03_e_107:
    speaker: "<Narration>"
    en: Mint and Prika are curled up in a corner of the columbarium, tears running
      down their faces.
    ko: 민트와 프리카는 납골당 구석에 쪼그리고 앉아 눈물을 흘리고 있었고.
    ja: |-
      ミントとプリカは納骨堂の隅に座り込んで
      涙を流していた
  event_staranis2_03_e_108:
    speaker: "<Narration>"
    en: Anis stands there, staring vacantly at the digital panel.
    ko: 아니스는 멍하니 디지털 패널을 바라보고 있다.
    ja: |-
      アニスは納骨堂のデジタルパネルを
      ぼんやりと眺めていた
  event_staranis2_03_e_109:
    speaker: "<Narration>"
    en: On the screen, Riss's name is displayed in cold, impersonal text.
    ko: 리스의 이름이 무미건조하게 출력되어 있다.
    ja: |-
      リスの名前が
      無機質なパネルに浮かんでいる
  event_staranis2_03_e_110:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_111:
    speaker: anis_idol
    en: You were my first fan.
    ko: 제 첫 번째 팬이었어요.
    ja: 初めての…ファンだったんです。
  event_staranis2_03_e_112:
    speaker: anis_idol
    en: You kept telling me I could shine.
    ko: 제가 빛날 수 있을 거라고, 계속 말해줬어요.
    ja: 私は輝けるって、ずっと言ってくれました。
  event_staranis2_03_e_113:
    speaker: anis_idol
    en: "... But I guess I never did."
    ko: "…아니었지만."
    ja: "…ダメだったけど。"
  event_staranis2_03_e_114:
    speaker: "<Narration>"
    en: Anis gently runs her hand over the digital panel.
    ko: 아니스가 디지털 패널을 어루만진다.
    ja: アニスの手がデジタルパネルをなぞった
  event_staranis2_03_e_115:
    speaker: anis_idol
    en: I wasn't being greedy.
    ko: 욕심내는 게 아니었어요.
    ja: 欲張らなきゃよかった。
  event_staranis2_03_e_116:
    speaker: anis_idol
    en: I just loved the way people loved me, so I wanted to give it back.
    ko: |-
      받아본 사랑이 너무 좋아서,
      그걸 다시 세상에 돌려주고 싶었어요.
    ja: |-
      求められたことがうれしすぎて、
      もらった愛をみんなに返したいなんて
      思いあがって。
  event_staranis2_03_e_117:
    speaker: anis_idol
    en: But that kind of thing was never meant for someone like me.
    ko: 그런데, 주제에 맞지 않았던 거예요.
    ja: そんなの、身の程知らずだったのに。
  event_staranis2_03_e_118:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_119:
    speaker: anis_idol
    en: You shouldn't have been nice to me.
    ko: 잘해주지 말지.
    ja: 優しくされなきゃよかった。
  event_staranis2_03_e_120:
    speaker: anis_idol
    en: I should've just stayed alone and died alone.
    ko: 주제에 맞게, 계속 외롭게 살다가 죽게 놔두지.
    ja: |-
      死ぬまでずっと寂しいままで
      いればよかったのよ。
  event_staranis2_03_e_121:
    speaker: anis_idol
    en: But she had to be kind for no reason, and I got a taste of it.
    ko: 괜히 잘 해줘서, 그 맛을 봐버린 탓에.
    ja: |-
      下手に優しくされて、
      味を知っちゃったから。
  event_staranis2_03_e_122:
    speaker: anis_idol
    en: And once I did, I wanted more. That's how things ended up like this.
    ko: 더 맛보고 싶다는 욕심 때문에 이렇게 되어버렸어.
    ja: |-
      優しさがもっと欲しいなんて思いはじめて、
      こんなことになっちゃって。
  event_staranis2_03_e_123:
    speaker: anis_idol
    en: I actually thought I could give people hope.
    ko: 사람들에게 희망을 줄 수 있을 거란 착각에 빠졌어.
    ja: みんなに希望を与えられるなんて、勘違いして。
  event_staranis2_03_e_124:
    speaker: anis_idol
    en: Like someone like me could ever do that.
    ko: 나 같은 게, 그런 걸 할 수 있을 리가 없는데.
    ja: 私みたいな奴に、できるわけないのに。
  event_staranis2_03_e_125:
    speaker: anis_idol
    en: I'm nothing special... I'm not even average. Just some pathetic, affection-starved
      nobody...
    ko: 특별할 것 하나 없는… 애정 결핍에 찌든 평범 이하인 사람일 뿐인데.
    ja: |-
      特別でも何でもない…
      愛情に飢えた、フツー以下の分際で…
  event_staranis2_03_e_126:
    speaker: anis_idol
    en: Because of someone like me... she died...
    ko: 이런 나 때문에… 죽었구나.
    ja: 私なんかのせいで…死なせた…
  event_staranis2_03_e_127:
    speaker: anis_idol
    en: Hah, haha...
    ko: 아, 하하.
    ja: あ…はは…
  event_staranis2_03_e_128:
    speaker: anis_idol
    en: That's so stupid. Seriously, so stupid.
    ko: 바보 같다. 바보 같다 정말.
    ja: バカみたい。本当に。
  event_staranis2_03_e_129:
    speaker: anis_idol
    en: You... really are an idiot.
    ko: 너… 진짜 바보 같다.
    ja: あなたも…本当に。
  event_staranis2_03_e_130:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_131:
    speaker: anis_idol
    en: I'm sorry.
    ko: 미안.
    ja: ごめんなさい。
  event_staranis2_03_e_132:
    speaker: anis_idol
    en: I was never a star.
    ko: 나는 별이 아니었어.
    ja: 私、星なんかじゃなくて。
  event_staranis2_03_e_133:
    speaker: anis_idol
    en: Just a cheap, plastic knockoff.
    ko: 플라스틱으로 만든 조잡한 별이었어.
    ja: プラスチックのおもちゃの星で。
  event_staranis2_03_e_134:
    speaker: anis_idol
    en: And you gave your life... for something like me...
    ko: 네 삶을… 나 같은 걸 위해 바쳐줘서….
    ja: |-
      私なんかのために…
      あなたの人生を犠牲にして…
  event_staranis2_03_e_135:
    speaker: anis_idol
    en: I'm sorry.
    ko: 미안해.
    ja: ごめんね…
  event_staranis2_03_e_136:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_03_e_137:
    speaker: anis_idol
    en: "... Boss, you've got something important to take care of, right?"
    ko: "…사장님. 중요한 일이 있는 거죠?"
    ja: "…社長。大事な用事って、まだかかりますか？"
  event_staranis2_03_e_138:
    speaker: hanson
    en: Yes...
    ko: "…응."
    ja: "…ああ。"
  event_staranis2_03_e_139:
    speaker: anis_idol
    en: It's really that important?
    ko: 중요한 일 맞죠?
    ja: 大事なんですよね？
  event_staranis2_03_e_140:
    speaker: hanson
    en: It is...
    ko: "…맞아."
    ja: "…そうだ。"
  event_staranis2_03_e_141:
    speaker: anis_idol
    en: "... Yeah, guess it has to be."
    ko: "…그래요. 그래야 할 거예요."
    ja: "…ですよね。社長が言うなら。"
  event_staranis2_03_e_142:
    speaker: anis_idol
    en: Go, get it sorted
    ko: 어서 가요. 가서 빨리 해결해요.
    ja: 早く行って、終わらせてきてください。
  event_staranis2_03_e_143:
    speaker: anis_idol
    en: and come straight back.
    ko: 빨리 해결하고 돌아와요.
    ja: それから、すぐに帰ってきてください。
  event_staranis2_03_e_144:
    speaker: anis_idol
    en: "... And don't be late like this again."
    ko: "…지금처럼, 늦지 말고."
    ja: "…今度は、遅くならないように。"
  event_staranis2_03_e_145:
    speaker: hanson
    en: I'm... sorry.
    ko: "…미안… 하다."
    ja: "…そうする…すまない。"
  event_staranis2_03_e_146:
    speaker: "<Narration>"
    en: Anis doesn't answer, her eyes fixed on the digital panel.
    ko: 아니스는 대답하지 않고 디지털 패널을 바라본다.
    ja: |-
      アニスは返事をせず、
      デジタルパネルを見つめ続けていた
  event_staranis2_03_e_147:
    speaker: "<Narration>"
    en: Hanson watches her for a long time, then lowers his head and walks away.
    ko: |-
      한슨은 그 모습을 한참 동안 지켜보다,
      고개를 푹 숙이고 걸어갔다.
    ja: |-
      ハンソンはその様子をしばらく見守り、
      うつむきながらその場を去った
event_staranis2_intermission_01:
  event_staranis2_intermission_01_1:
    speaker: "<Narration>"
    en: T.T. STAR temporarily halts their activities.
    ko: T.T. STAR는 잠시 동안 활동을 중지했다.
    ja: T.T. STARは活動を休止した
  event_staranis2_intermission_01_2:
    speaker: "<Narration>"
    en: For two days, no one leaves the dorm.
    ko: T.T. STAR는 이틀 동안 숙소 밖으로 나가지 않았다.
    ja: それから2日間、誰も宿所から外に出なかった
  event_staranis2_intermission_01_3:
    speaker: "<Narration>"
    en: Not a single word passes between them.
    ko: 서로 단 한마디도 나누지 않았다.
    ja: 互いに言葉を交わすこともなかった
  event_staranis2_intermission_01_4:
    speaker: "<Narration>"
    en: They lie there, staring blankly into space.
    ko: 멍하니 누워 허공만 바라볼 뿐이었다.
    ja: |-
      身を投げ出し、ただひたすら
      呆然と虚空を眺め続けた
  event_staranis2_intermission_01_5:
    speaker: "<Narration>"
    en: Tears come. Sleep follows. Then tears again. Over and over.
    ko: 울고. 자고. 울고. 자고를 반복했다.
    ja: |-
      起きては泣き、泣いては寝る。
      その繰り返しで一日が終わった
  event_staranis2_intermission_01_6:
    speaker: "<Narration>"
    en: Their ranking continues to fall.
    ko: T.T. STAR의 순위는 계속해서 내려갔다.
    ja: T.T. STARのランキング順位は落ち続けた
  event_staranis2_intermission_01_7:
    speaker: "<Narration>"
    en: Posts demanding the truth behind Riss's death flood the forums.
    ko: 리스의 사망에 대한 진상을 요구하는 글이 아이돌 카페에 빗발친다.
    ja: |-
      リスの死に関する真相を求める投稿が
      アイドル掲示板に続々と書き込まれていた
  event_staranis2_intermission_01_8:
    speaker: "<Narration>"
    en: T.T. STAR offers no response, as they no longer have the strength to do so.
    ko: |-
      T.T. STAR는 대응하지 않았다.
      대응할 여력도 남지 않았다.
    ja: |-
      T.T. STARは対応しなかった。
      する気力も残っていなかった
  event_staranis2_intermission_01_9:
    speaker: "<Narration>"
    en: They are too consumed by their grief.
    ko: 자신들의 슬픔을 추스르기에 바빴다.
    ja: |-
      自分が悲しみにおぼれないようにするだけで
      精一杯だった
  event_staranis2_intermission_01_10:
    speaker: "<Narration>"
    en: A few days later, Anis breaks down in tears as she writes a statement.
    ko: 며칠 뒤, 아니스는 눈물을 쏟으며 해명문을 작성했다.
    ja: |-
      数日が経ち、いまだ涙目の乾かないアニスが
      事情説明の文書を発表した
  event_staranis2_intermission_01_11:
    speaker: "<Narration>"
    en: Riss was a precious colleague who had been with us for a long time.
    ko: 리스는 오래전부터 우리와 함께해 온 소중한 동료이며
    ja: |-
      リスが昔から一緒に頑張ってきた
      大切な仲間だったこと
  event_staranis2_intermission_01_12:
    speaker: "<Narration>"
    en: She couldn't bear to see us suffer, so she stepped forward in our place.
    ko: 우리들이 고통받는 것을 견디지 못해, 우리 대신 나서주었다.
    ja: |-
      アニスたちが嫌がらせを
      受けていることに耐えられず、
      身を挺して止めてくれたこと
  event_staranis2_intermission_01_13:
    speaker: "<Narration>"
    en: She acted because her body moved before she could think, believing that someone
      she cared about was in danger.
    ko: 자신이 나선 것은, 소중한 친구이자 동료가 위험해 보여 몸이 먼저 움직인 것이다.
    ja: |-
      大切な友人でもある仲間が
      危ない目に遭いそうな気がして、
      考えるより先に体が動いたこと
  event_staranis2_intermission_01_14:
    speaker: "<Narration>"
    en: I sincerely apologize to the person who was affected. I acted on impulse.
      Please forgive me.
    ko: 당사자에게는 정말 죄송하다. 나도 모르게 몸이 움직였다. 용서해달라.
    ja: |-
      心からの謝罪と、悪意はなく、
      許しを求めているということ
  event_staranis2_intermission_01_15:
    speaker: "<Narration>"
    en: There was never any intention to harm or hurt anyone present.
    ko: 그곳에 모인 팬 분들을 다치게 하거나 상처를 줄 의도는 없었다.
    ja: ファンへの敵意も害意も、一切ないこと
  event_staranis2_intermission_01_16:
    speaker: "<Narration>"
    en: This incident happened because her love for us was so great. We ask that you
      forgive Riss, who found the courage to act for our sake.
    ko: |-
      우릴 사랑하는 마음이 너무 커 그런 사고가 발생한 것이기에,
      우릴 위해 용기를 내준 리스를 용서해 주었으면 한다.
    ja: |-
      リスが自分たちを大事に思っていたための
      行いであり、そのために勇気を振り絞った
      リスを許してあげてほしいということ
  event_staranis2_intermission_01_17:
    speaker: "<Narration>"
    en: We are deeply grieving the loss of our precious colleague.
    ko: 우리는 지금 소중한 동료의 죽음에 진심으로 슬퍼하고 있다.
    ja: |-
      自分たちが今、大切な仲間を失い
      心から悲しんでいること
  event_staranis2_intermission_01_18:
    speaker: "<Narration>"
    en: May she rest in peace. Please keep her in your prayers.
    ko: "부디 리스가 안식에 들길 바란다. \n명복을 빌어달라."
    ja: |-
      リスが安らかに眠れるよう、
      彼女の冥福を共に祈って欲しいということ
  event_staranis2_intermission_01_19:
    speaker: "<Narration>"
    en: Anis uploads the statement to the forum.
    ko: 와 같은 내용의 해명문을 아이돌 카페에 업로드한다.
    ja: |-
      そうした言葉が、
      アイドル掲示板にアップロードされた
  event_staranis2_intermission_01_20:
    speaker: "<Narration>"
    en: After that, the forum erupts again.
    ko: 그 이후, 아이돌 카페는 또다시 불타기 시작했다.
    ja: だが、アイドル掲示板は再び炎上を始めた
  event_staranis2_intermission_01_21:
    speaker: "<Narration>"
    en: Her statement doesn't match the apology video from before.
    ko: 이전에 올린 해명 영상과 너무 다른 내용의 해명문이라는 것이 그 이유였다.
    ja: |-
      その内容が界隈ですでに知れ渡っていた
      釈明動画とまったく違う話になっていたからだ
  event_staranis2_intermission_01_22:
    speaker: "<Narration>"
    en: 'The accusations pour in: she changed her story, she''s lying.'
    ko: 말이 바뀌었다, 가만히 생각해 보니 생각이 바뀐 거냐, 거짓말쟁이다 등등의 비난 글이 쇄도했다.
    ja: |-
      「話が違う」「考えが変わったのか？」
      「嘘つき」などと、非難のコメントが殺到した
  event_staranis2_intermission_01_23:
    speaker: "<Narration>"
    en: Anis is thrown into disarray.
    ko: 아니스는 혼란에 빠졌다.
    ja: 無論、アニスは混乱した
  event_staranis2_intermission_01_24:
    speaker: "<Narration>"
    en: What's going on? She can't make sense of any of it.
    ko: |-
      이게 다 무슨 일인가 싶었다.
      상황이 이해되지 않았다.
    ja: 何が起きているのか、理解できなかった
  event_staranis2_intermission_01_25:
    speaker: "<Narration>"
    en: An apology video? She has never uploaded anything like that. Then what do
      they mean by it's different? Why are they saying this?
    ko: |-
      올린 적 없던 해명 영상은 뭐고,
      다른 내용이라는 건 또 뭔지 혼란스러웠다.
    ja: |-
      これ以前に動画など公表した覚えはない。
      話が違うなどと言われても、
      わけが分からなかった
  event_staranis2_intermission_01_26:
    speaker: "<Narration>"
    en: None of it makes sense.
    ko: 왜 이러는지 이해되지 않았다.
    ja: |-
      どういう事態になっているのか、
      想像することさえ出来なかった
  event_staranis2_intermission_01_27:
    speaker: "<Narration>"
    en: She scrolls through the forum.
    ko: 아니스는 아이돌 카페를 뒤적인다.
    ja: アニスはアイドル掲示板のログを漁った
  event_staranis2_intermission_01_28:
    speaker: "<Narration>"
    en: No one cares about Riss's death.
    ko: 리스의 죽음에는 관심이 없다.
    ja: 死んだリスを気づかう者などどこにもいない
  event_staranis2_intermission_01_29:
    speaker: "<Narration>"
    en: They only care about who caused it.
    ko: 리스가 [누구 때문에] 죽었는지에 대해서만 관심이 있을 뿐이다.
    ja: |-
      リスは「誰のせいで」死んだのか。
      知りたがっているのはそればかりだ
  event_staranis2_intermission_01_30:
    speaker: "<Narration>"
    en: She scrolls again, almost obsessively now.
    ko: 아이돌 카페를 광적으로 뒤진다.
    ja: 読み漁るほどに、アニスの眼は血走った
  event_staranis2_intermission_01_31:
    speaker: "<Narration>"
    en: '"It must have been the group''s abuse."'
    ko: "[아이돌의 갑질 때문에 죽음을 택했을 것이다.]"
    ja: |-
      「アイドルからのパワハラに
      耐えられなくなったせいだ」
  event_staranis2_intermission_01_32:
    speaker: "<Narration>"
    en: '"The company''s unfair contract must have driven her to it."'
    ko: "[회사의 불공정 계약 때문에 죽음을 택했을 것이다.]"
    ja: "「事務所との理不尽な契約のせいだ」"
  event_staranis2_intermission_01_33:
    speaker: "<Narration>"
    en: '"It must have been Anis''s pressure that pushed her over the edge."'
    ko: "[아니스에게 지속적으로 압박받아 죽음을 택했을 것이다.]"
    ja: "「アニスからの長きに渡るいじめのせいだ」"
  event_staranis2_intermission_01_34:
    speaker: "<Narration>"
    en: Wild speculation spirals out of control.
    ko: 수많은 억측이 난무한다.
    ja: 無数の根も葉もない憶測が飛び交っている
  event_staranis2_intermission_01_35:
    speaker: "<Narration>"
    en: She scrolls again, obsessively now.
    ko: 아니스는 다시 한번 카페를 광적으로 뒤진다.
    ja: それでもアニスは、ログ漁りを止めなかった
  event_staranis2_intermission_01_36:
    speaker: "<Narration>"
    en: '"Why''s Anis still alive?"'
    ko: "[아니스는 왜 살아있냐.]"
    ja: "「アニスはなんでまだ生きてるんだ？」"
  event_staranis2_intermission_01_37:
    speaker: "<Narration>"
    en: '"Didn''t Riss die because of her?"'
    ko: "[따지고 보면 아니스 때문에 죽은 것 아니냐.]"
    ja: |-
      「そもそもマネージャーが死んだのは
      アニスのせいだろ」
  event_staranis2_intermission_01_38:
    speaker: "<Narration>"
    en: All fingers are pointed at her.
    ko: 화살은 자신에게로 향한다.
    ja: 自分を的にした言葉もある
  event_staranis2_intermission_01_39:
    speaker: "<Narration>"
    en: There's not a single post
    ko: 단 하나도 없다.
    ja: だが、そこに決して見当たらないものがある
  event_staranis2_intermission_01_40:
    speaker: "<Narration>"
    en: apologizing to Riss, grieving her, or even feeling any guilt. Nothing.
    ko: |-
      리스에게 사과하는 글, 죄책감을 느끼는 글.
      단 하나도 없다.
    ja: |-
      リスへの謝罪、気づかいの言葉、
      罪悪感を感じているような書き込みは
      ひとつもなかった
  event_staranis2_intermission_01_41:
    speaker: "<Narration>"
    en: All they care about is finding someone to blame.
    ko: 그저, 리스의 죽음을 다른 이의 탓으로 돌리기 위해 혈안이 되어 있을 뿐이었다.
    ja: 誰も彼も、リスを殺した犯人捜しがしたいだけだ
  event_staranis2_intermission_01_42:
    speaker: "<Narration>"
    en: 'Title: Is that chick actually insane or what?'
    ko: '제목 : 그 X 그거 미친 거 아냐?'
    ja: |-
      タイトル：
      あいつ、頭おかしいのか？
  event_staranis2_intermission_01_43:
    speaker: "<Narration>"
    en: 'Title: Aren''t you the manager? Why are you acting up?'
    ko: '제목 : 매니저라며? 왜 나댐?'
    ja: |-
      タイトル：
      マネージャーだって？出しゃばりすぎじゃね？
  event_staranis2_intermission_01_44:
    speaker: "<Narration>"
    en: 'Title: The manager''s attitude sucks, the pop stars can''t be any better'
    ko: '제목 : 매니저 인성 꼬라지. 아이돌 인성도 안 봐도 뻔함'
    ja: |-
      タイトル：
      人間性ヤバすぎ。アイドルの方もお察しだな
  event_staranis2_intermission_01_45:
    speaker: "<Narration>"
    en: 'Title: Like pop star, like manager'
    ko: '제목 : 그 아이돌에 그 매니저'
    ja: |-
      タイトル：
      あのアイドルにしてあのマネージャー
  event_staranis2_intermission_01_46:
    speaker: "<Narration>"
    en: 'Title: Just dug up the manager''s info, lol'
    ko: '제목 : 매니저 신상 털어왔다ㅋㅋㅋㅋ'
    ja: |-
      タイトル：
      マネージャーの情報特定したったwww
  event_staranis2_intermission_01_47:
    speaker: "<Narration>"
    en: 'Title: Damn, she was a total loner, huh?'
    ko: '제목 : 와씨 개 아싸였네'
    ja: |-
      タイトル：
      クッソ陰キャじゃん
  event_staranis2_intermission_01_48:
    speaker: "<Narration>"
    en: 'Title: "Waaah, don''t come near my pop stars!" (Pic)'
    ko: '제목 : 눼 아이돌한퉤 대개오지 말라궈어어어(사진 있음)'
    ja: |-
      タイトル：
      わたちのアイドルに
      近づかないでえええ（写真あり）
  event_staranis2_intermission_01_49:
    speaker: "<Narration>"
    en: 'Title: (Honest opinion) The manager''s ugly'
    ko: '제목 : (소신 발언) 매니저 못생김'
    ja: |-
      タイトル：
      あのマネージャー、ブサイクだよな（本音）
  event_staranis2_intermission_01_50:
    speaker: "<Narration>"
    en: 'Title: We worked our asses off to boost them, and this is how they repay
      us?'
    ko: '제목 : 진짜 개 같이 굴러서 올려놨더니 매니저가 초치네'
    ja: |-
      タイトル：
      ファンの応援を仇で返すんだな
  event_staranis2_intermission_01_51:
    speaker: "<Narration>"
    en: 'Title: Who cares if the pop stars are good when the manager''s out there
      ruining everything'
    ko: '제목 : 아이돌이 잘하면 뭐 함? 매니저가 똥 뿌리는데'
    ja: |-
      タイトル：
      アイドルが頑張っても
      マネージャーのせいで台無し
  event_staranis2_intermission_01_52:
    speaker: "<Narration>"
    en: 'Title: Heard they were friends back in school'
    ko: '제목 : 둘이 학생 때 친구였다는데'
    ja: |-
      タイトル：
      あの2人、学生時代に友人だったらしい
  event_staranis2_intermission_01_53:
    speaker: "<Narration>"
    en: 'Title: Heard they bullied the whole class together, lol'
    ko: '제목 : 얘기 들었는데 둘이서 반 전체 따돌렸다고 함ㅋㅋㅋ'
    ja: |-
      タイトル：
      2人でクラス全員をハブってたらしいwww
  event_staranis2_intermission_01_54:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_intermission_01_55:
    speaker: anis_idol
    en: You did this.
    ko: 너희가 그랬잖아.
    ja: あんたたちでしょ…
  event_staranis2_intermission_01_56:
    speaker: "<Narration>"
    en: An icy voice breaks the silence of the past few days. Mint and Prika jerk
      upright, caught off guard.
    ko: |-
      민트와 프리카는 수일간의 침묵을 깨는
      싸늘한 목소리에 벌떡 일어났다.
    ja: |-
      冷たい声が、ここ数日続いていた沈黙を破り
      ミントとプリカは跳ねるように身を起こした
  event_staranis2_intermission_01_57:
    speaker: "<Narration>"
    en: Anis glares at her phone, eyes cold.
    ko: 아니스는 핸드폰을 노려본다.
    ja: |-
      アニスが怒りに歪みきった顔で
      携帯端末をにらみ付けている
  event_staranis2_intermission_01_58:
    speaker: anis_idol
    en: You're the ones who did this...!
    ko: "…너희가 그랬잖아…!"
    ja: あんたたちでしょうが…！
  event_staranis2_intermission_01_59:
    speaker: prika_o
    en: Anis, what—
    ko: 아니스. 왜 그….
    ja: アニス。どうした…
  event_staranis2_intermission_01_60:
    speaker: anis_idol
    en: You did this!
    ko: 너희가! 그랬잖아!
    ja: 殺したのは！あんたたちでしょうが！
  event_staranis2_intermission_01_61:
    speaker: prika_o
    en: "!"
    ko: "!!"
    ja: "！！"
  event_staranis2_intermission_01_62:
    speaker: mint_o
    en: Anis, what's wrong?
    ko: 아니스! 무슨 일이야!
    ja: アニス！どうしたの！？
  event_staranis2_intermission_01_63:
    speaker: "<Narration>"
    en: Anis hurls her phone to the ground,
    ko: 아니스는 핸드폰을 내던진다.
    ja: アニスは端末を床に投げつけ…
  event_staranis2_intermission_01_64:
    speaker: "<Narration>"
    en: then stomps on it again and again.
    ko: 발로 마구 짓밟는다.
    ja: 半狂乱で踏みつけ始めた
  event_staranis2_intermission_01_65:
    speaker: "<Narration>"
    en: Mint and Prika rush in and grab her, pulling her back.
    ko: 민트와 프리카가 다가와 아니스를 끌어안는다.
    ja: |-
      ミントとプリカが駆け寄り、
      アニスを押さえた
  event_staranis2_intermission_01_66:
    speaker: anis_idol
    en: You did this! You did all of this!
    ko: 너희가! 그랬잖아! 너희가!
    ja: |-
      あんたたち！あんたたち！
      あんたたちのせいよ！！
  event_staranis2_intermission_01_67:
    speaker: anis_idol
    en: You killed her!
    ko: 니들이 죽였잖아!
    ja: あんたたちが殺したんじゃないの！
  event_staranis2_intermission_01_68:
    speaker: mint_o
    en: Anis!
    ko: 아니스!
    ja: アニス！
  event_staranis2_intermission_01_69:
    speaker: prika_o
    en: Calm down, Anis! Calm down!
    ko: 진정해, 아니스! 진정해!
    ja: 落ち着け、アニス！落ち着くんだ！
  event_staranis2_intermission_01_70:
    speaker: anis_idol
    en: You freaking killed her!
    ko: 니들이 죽였잖아아아아--!!
    ja: 人殺しはあんたたちでしょうが！！！！
  event_staranis2_intermission_01_71:
    speaker: anis_idol
    en: Argh!
    ko: 아아.
    ja: ああ…
  event_staranis2_intermission_01_72:
    speaker: anis_idol
    en: What the hell have I been doing all this time?
    ko: 난 지금까지 대체 뭘 위해서 그렇게.
    ja: 今まで何のためにこんなことしてたんだろう。
  event_staranis2_intermission_01_73:
    speaker: anis_idol
    en: Going so far
    ko: 이런 것들을 위해서 그렇게까지.
    ja: こんな奴らのために、ここまでして…
  event_staranis2_intermission_01_74:
    speaker: anis_idol
    en: for these worthless things?
    ko: 이런
    ja: こんな…
  event_staranis2_intermission_01_75:
    speaker: anis_idol
    en: I danced,
    ko: 쓰레기들을 위해
    ja: ゴミくずのために…
  event_staranis2_intermission_01_76:
    speaker: anis_idol
    en: I sang,
    ko: 춤추고
    ja: 踊ったり…
  event_staranis2_intermission_01_77:
    speaker: anis_idol
    en: and for what?
    ko: 노래했구나.
    ja: 歌ったりしてたなんて。
  event_staranis2_intermission_01_78:
    speaker: anis_idol
    en: What a waste.
    ko: 아깝다.
    ja: もったいない。
  event_staranis2_intermission_01_79:
    speaker: anis_idol
    en: Absolutely a waste.
    ko: 너무 아까워.
    ja: 全部ムダだった。
  event_staranis2_intermission_01_80:
    speaker: anis_idol
    en: My life's been such a waste.
    ko: 내 인생이 너무 아까워.
    ja: 自分の人生を、ムダにしてる。
  event_staranis2_intermission_01_81:
    speaker: "<Narration>"
    en: That evening,
    ko: 그날 저녁.
    ja: その日の夕方
  event_staranis2_intermission_01_82:
    speaker: "<Narration>"
    en: Tetra Line announces that, despite the controversy, they'll push T.T. STAR
      into the mainstream.
    ko: 테트라 라인은 논란을 감수하고도 T.T. STAR를 메이저로 올릴 것이라 발표했다.
    ja: |-
      テトララインは騒動になることを承知の上で
      T.T. STARのメジャー入りを発表した
  event_staranis2_intermission_01_83:
    speaker: "<Narration>"
    en: 'A few days later, they follow up with another statement: after their debut
      performance,'
    ko: 며칠 뒤, 메이저 데뷔를 상징하는 공연 이후
    ja: |-
      数日後に、メジャーデビューを
      記念するライブを開催し…
  event_staranis2_intermission_01_84:
    speaker: "<Narration>"
    en: T.T. STAR will be ranked at the very bottom of the major charts.
    ko: 바로 메이저 최하위로 승격될 것이라 발표했다.
    ja: |-
      その後からすぐに
      メジャーランキングに
      登録されると公表された
  event_staranis2_intermission_01_85:
    speaker: "<Narration>"
    en: The moment the news breaks, T.T. STAR shoots to the top of the indie charts.
    ko: 발표 이후, T.T. STAR의 마이너 랭킹은 삽시간에 1위가 되었다.
    ja: |-
      発表の後、T.T. STARは
      インディーズチャートで
      瞬く間に1位となるほどの注目を浴びた
  event_staranis2_intermission_01_86:
    speaker: "<Narration>"
    en: Fan communities flood the forums with posts celebrating their debut.
    ko: 아이돌 카페는 T.T. STAR의 메이저 데뷔를 축하하는 글로 가득 찼다.
    ja: |-
      アイドル掲示板はT.T. STARの
      メジャーデビューを祝う書き込みで
      埋め尽くされた
  event_staranis2_intermission_01_87:
    speaker: "<Narration>"
    en: Watching it all unfold,
    ko: 아니스는 그 모습을 보며 한참 동안
    ja: |-
      アニスはそれを知って
      しばらくそのまま画面を眺めていた
  event_staranis2_intermission_01_88:
    speaker: "<Narration>"
    en: Anis laughs through her tears for a long time.
    ko: 울면서 웃었다.
    ja: 泣き笑いの表情を浮かべながら
event_staranis2_04_s:
  event_staranis2_04_s_1:
    speaker: anis_human
    en: Forget it.
    ko: 하지 말자.
    ja: やめる。
  event_staranis2_04_s_2:
    speaker: mint
    en: Anis...
    ko: "…아니스."
    ja: "…アニス。"
  event_staranis2_04_s_3:
    speaker: anis_human
    en: Why are we even doing this?
    ko: 왜 해야 하는지 모르겠어.
    ja: やる意味が分かんなくなっちゃった。
  event_staranis2_04_s_4:
    speaker: anis_human
    en: Mainstream, indie, I don't give a damn anymore.
    ko: 메이저고 나발이고 이제 아무래도 상관없어.
    ja: メジャーも何もかも、どうでもいいわ。
  event_staranis2_04_s_5:
    speaker: anis_human
    en: I'm done.
    ko: 못 하겠어.
    ja: もうやってられない。
  event_staranis2_04_s_6:
    speaker: anis_human
    en: I'm not getting up there to sing and dance for that pack of trash.
    ko: 안팎으로 우글대는 쓰레기들 보라고 춤추고 노래하고 싶지 않아.
    ja: |-
      どこを見たってクズばっかり。
      そんな奴らのために
      歌って踊る価値なんかない。
  event_staranis2_04_s_7:
    speaker: anis_human
    en: "... Riss is gone,"
    ko: "…리스도 이제 없고."
    ja: "…リスだって、もういないし。"
  event_staranis2_04_s_8:
    speaker: anis_human
    en: and Boss hasn't shown his face in days.
    ko: 사장님은 어디 갔는지 며칠째 보이지도 않아.
    ja: |-
      社長はどこ行ったか知らないけど、
      もう何日も戻ってこないし。
  event_staranis2_04_s_9:
    speaker: anis_human
    en: So what, we just do it anyway? Wait around to get screwed over again?
    ko: 또 무슨 꼴을 당할 줄 알고 그걸 해?
    ja: |-
      また何されるかだって、
      分かったもんじゃないでしょ？
  event_staranis2_04_s_10:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_11:
    speaker: mint
    en: What if we can change it?
    ko: 우리가 바꿀 수 있지 않을까?
    ja: 私たちが変えられるんじゃないかしら？
  event_staranis2_04_s_12:
    speaker: anis_human
    en: "... Change what?"
    ko: "…뭘."
    ja: "…何を。"
  event_staranis2_04_s_13:
    speaker: mint
    en: When you're still unknown, you can disappear at any time. So you have to do
      whatever it takes just to survive.
    ko: "…마이너는 언제 사라질지 모르는 파리 목숨이라 어떻게든 살아남아야 해."
    ja: |-
      …今まではいつ消えるかも分からないような
      存在だったから、何をしてでも
      生き延びるしかなかった。
  event_staranis2_04_s_14:
    speaker: mint
    en: You have to put yourself out there, take every chance you get to win people
      over.
    ko: |-
      필사적으로 어필하고 살아남기 위해 모든 수단을 동원해야 해.
      팬을 만들고, 팬의 눈에 들기 위해.
    ja: |-
      必死でアピールして、
      生き残るためなら何でもした。
      ファンを増やすためにね。
  event_staranis2_04_s_15:
    speaker: mint
    en: That's why we ended up in such a vulnerable position.
    ko: 그렇기에 절대적 약자가 될 수밖에 없어.
    ja: |-
      今までの私たちは、
      どうあがいても弱者になるしかなかった。
  event_staranis2_04_s_16:
    speaker: mint
    en: Please don't misunderstand. I'm not saying the fans were right.
    ko: |-
      오해하진 말아 줘.
      [팬]들이 잘했다는 건 절대 아니야.
    ja: |-
      誤解しないで。
      私たちのファンを名乗ってた人たちが
      みんな正しいってことじゃないから。
  event_staranis2_04_s_17:
    speaker: mint
    en: But if we make it to the mainstream, things will be different.
    ko: 하지만 메이저가 된다면 얘기는 달라져.
    ja: でも、それはメジャー入りするまでの話。
  event_staranis2_04_s_18:
    speaker: mint
    en: We'll have people who'll stand up for us.
    ko: 우릴 위해 싸워주는 사람들이 생겨나.
    ja: |-
      これからは私たちのために
      戦ってくれる人たちも出てくる。
  event_staranis2_04_s_19:
    speaker: mint
    en: We won't just have to take it anymore.
    ko: 이렇게까지 일방적으로 두들겨 맞지는 않는다는 얘기야.
    ja: |-
      今までみたいに好き放題されっ放しじゃ
      なくなるってことよ。
  event_staranis2_04_s_20:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_21:
    speaker: mint
    en: We can change that.
    ko: "…바꿀 수 있을 거야."
    ja: "…きっと変えられるわ。"
  event_staranis2_04_s_22:
    speaker: mint
    en: Once we go mainstream, our voices will carry more weight, and people will
      begin to take notice of what we do.
    ko: |-
      메이저가 된다는 건 목소리에도 힘이 실린다는 얘기고,
      우리의 행동에 많은 사람들이 영향을 받아.
    ja: |-
      今までとは発言力も全然違うし、
      私たちの行動がもっと多くの人に
      影響を与えるようになるの。
  event_staranis2_04_s_23:
    speaker: mint
    en: It'll take time, of course.
    ko: 물론 많은 시간이 걸릴거야.
    ja: もちろん、時間はかかると思うけど。
  event_staranis2_04_s_24:
    speaker: mint
    en: But at least we won't be treated like a joke anymore.
    ko: 하지만, 지금처럼 모두가 우릴 장난감 취급하진 않아.
    ja: |-
      でも、一方的におもちゃにされることは
      もうなくなるわ。
  event_staranis2_04_s_25:
    speaker: anis_human
    en: Those idiots? Yeah, right.
    ko: 그것들이? 퍽이나.
    ja: あんな奴らが？そんなワケ。
  event_staranis2_04_s_26:
    speaker: mint
    en: Anis, not everyone in the world is like that. There are far more good people
      than you think.
    ko: |-
      아니스. 세상 모든 사람들이 쓰레기가 아니야.
      좋은 사람들이 훨씬 많아.
    ja: |-
      アニス。世の中の人全部が
      クズみたいな人ってわけじゃないの。
      いい人だってたくさんいるのよ。
  event_staranis2_04_s_27:
    speaker: anis_human
    en: Where are they, then?
    ko: 어디 있는데.
    ja: そんなのどこにいるっていうのよ。
  event_staranis2_04_s_28:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_29:
    speaker: anis_human
    en: I've never seen a single one. All I've seen is trash.
    ko: |-
      난 지금까지 한 번도 못 봤는데?
      쓰레기밖에 없던데?
    ja: |-
      そんな人見たことないけど？
      ゴミくずばっかりだったでしょ？
  event_staranis2_04_s_30:
    speaker: anis_human
    en: Fine, let's say they exist.
    ko: 어딘가에 있다고 쳐.
    ja: 百歩譲ってどっかにいるとして…
  event_staranis2_04_s_31:
    speaker: anis_human
    en: Then where the hell were they when we were getting treated like that?
    ko: 그럼 우리가 그 꼴이 될 때 어디서 뭘 하고 있었는데.
    ja: |-
      私たちがあんな目に遭ってた時、
      その人たちはどこで何してたのよ？
  event_staranis2_04_s_32:
    speaker: anis_human
    en: They weren't there. I didn't see them. So what, they just don't exist?
    ko: |-
      안 보였잖아.
      그럼 없는 거 아냐?
    ja: |-
      全然見えなかったじゃない。
      そんなのいないのと同じでしょ？
  event_staranis2_04_s_33:
    speaker: anis_human
    en: If I can't see them, why the hell should I believe in them?
    ko: 내 눈에 안 보이는데 그걸 어떻게 믿어.
    ja: 見えもしないのに、どう信じろって言うのよ。
  event_staranis2_04_s_34:
    speaker: mint
    en: Anis...
    ko: 아니… 스.
    ja: アニス…
  event_staranis2_04_s_35:
    speaker: anis_human
    en: Yeah, no, not happening. I can't.
    ko: 난 안 해. 못해.
    ja: 私はやらない。できない。
  event_staranis2_04_s_36:
    speaker: anis_human
    en: Pop star? Give me a break. That's way out of my league...
    ko: 아이돌은 무슨. 주제에 맞지도 않는 걸 그렇게….
    ja: アイドルなんて、資格も無いくせに…
  event_staranis2_04_s_37:
    speaker: mint
    en: Anis!
    ko: 아니스!
    ja: アニス！
  event_staranis2_04_s_38:
    speaker: anis_human
    en: What?!
    ko: 왜!
    ja: 何！？
  event_staranis2_04_s_39:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_40:
    speaker: mint
    en: Why do you think Riss made that choice?
    ko: 리스가… 리스가 왜 그런 선택을 한 것 같은데.
    ja: リスは…なんであんなことしたと思ってるの？
  event_staranis2_04_s_41:
    speaker: anis_human
    en: Don't you dare bring Riss into this.
    ko: 너… 리스 들먹이지 마.
    ja: リスを…盾にしないで。
  event_staranis2_04_s_42:
    speaker: mint
    en: If she really wanted us to quit, she wouldn't have done it.
    ko: 우리가 그만두길 원했으면 리스도 그런 선택을 하진 않았을 거야.
    ja: |-
      私たちが本当にやめたがってたなら、
      リスはあんなに追い詰められなかったわ。
  event_staranis2_04_s_43:
    speaker: mint
    en: She told us to stop, sure. But that wasn't how she truly felt.
    ko: 그만하자고 말했지만, 본심은 그렇지 않았을 거라고.
    ja: |-
      やめようって口で言ってても、
      本当は諦めきれてなかったから。
  event_staranis2_04_s_44:
    speaker: mint
    en: If she'd meant it, she would've just walked away. She wouldn't have gone that
      far.
    ko: |-
      진짜 그만하길 원했으면 그런 선택은 하지 않고,
      그냥 그만뒀을 거야.
    ja: |-
      リスもやめればいいと本気で思ってたなら、
      あんなことはしなかったでしょうね。
  event_staranis2_04_s_45:
    speaker: mint
    en: More than anyone... she wanted to see us up there. Shining and giving people
      hope.
    ko: 누구보다… 우리가 무대에서 빛나면서, 희망을 주는 걸 보고 싶었을 거란 말이야.
    ja: |-
      もしかしたら私たち自身より…
      私たちがステージで輝いて、
      皆に希望を与えるところが見たかったから。
  event_staranis2_04_s_46:
    speaker: mint
    en: She wanted to see us become stars.
    ko: 우리가 별이 되는 걸 보고 싶었을 거라고.
    ja: |-
      私たちが星になるところを
      見たいと思っていたから。
  event_staranis2_04_s_47:
    speaker: mint
    en: Th-that's why...
    ko: 그래서, 그래서…!
    ja: だから…だから…！
  event_staranis2_04_s_48:
    speaker: mint
    en: she did it because she didn't want us to be dragged down with her!
    ko: 우리를 더럽히기 싫어서 그렇게…!
    ja: |-
      私たちが汚れるのに耐えられなくて、
      あんなことに…！
  event_staranis2_04_s_49:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_50:
    speaker: mint
    en: Let's do it.
    ko: 하자.
    ja: やりましょう。
  event_staranis2_04_s_51:
    speaker: mint
    en: Let's become stars and say it to their faces.
    ko: 별이 되어서, 그것들한테 당당하게 얘기하자.
    ja: |-
      星になって、
      言ってやりましょうよ。
  event_staranis2_04_s_52:
    speaker: mint
    en: Don't mock effort. Don't resent growth. Don't trample the weak.
    ko: 노력을 비웃지 말고, 성장을 시기하지 말고, 약자를 짓밟지 말라고.
    ja: |-
      他人の努力を笑うな、
      成長をねたむな、
      弱い者いじめをするなって。
  event_staranis2_04_s_53:
    speaker: mint
    en: Let's rise to the top of the Ark and say it proudly
    ko: |-
      방주에서 가장 잘나가는 아이돌이 되어서,
      당당하게 얘기하자.
    ja: |-
      アークで一番の売れっ子になって、
      面と向かって言ってやるの。
  event_staranis2_04_s_54:
    speaker: mint
    en: on a stage where the whole Ark is watching.
    ko: |-
      방주 사람들 모두를 모아놓은 공연에서,
      크게 말하자.
    ja: |-
      アークの誰もが集まるぐらい、
      大きな会場で。
  event_staranis2_04_s_55:
    speaker: mint
    en: We'll give courage to those who keep trying, celebrate those who are growing,
    ko: |-
      노력하는 사람들에게 용기를 주고,
      성장하는 사람들을 칭찬하고.
    ja: |-
      頑張ってる人に勇気をあげて、
      成長する人をほめて。
  event_staranis2_04_s_56:
    speaker: mint
    en: and stand up for the weak.
    ko: 약자를 지켜주라고, 당당하게 얘기하자.
    ja: 弱い人を守れって、胸を張って言うの。
  event_staranis2_04_s_57:
    speaker: mint
    en: We'll bring hope to those in despair,
    ko: 절망에 빠진 사람들에게 희망을 주고,
    ja: 絶望してる人に希望をあげて…
  event_staranis2_04_s_58:
    speaker: mint
    en: stay beside the lonely,
    ko: 외로운 사람들의 곁을 지켜주고
    ja: 寂しい気持ちの人に寄り添って…
  event_staranis2_04_s_59:
    speaker: mint
    en: and comfort the ones who are worn down.
    ko: 지친 사람들을 위로해 주자.
    ja: 疲れた人をねぎらってあげるの。
  event_staranis2_04_s_60:
    speaker: mint
    en: We'll make people feel like it's worth staying alive.
    ko: 살아있기를 잘했다고 느끼게 해주자.
    ja: 生きててよかったって、感じてもらえるように。
  event_staranis2_04_s_61:
    speaker: mint
    en: Let's become that kind of hope. Let's become stars.
    ko: |-
      우리가 희망이 되자.
      별이 되자.
    ja: |-
      私たちがその希望に…
      星になりましょう？
  event_staranis2_04_s_62:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_63:
    speaker: anis_human
    en: Hey... that's my line, you know...
    ko: 너… 그거 내 대사잖아….
    ja: それ…私が言ったことじゃない…
  event_staranis2_04_s_64:
    speaker: mint
    en: We're on the same team, so let's share, okay? It's no big deal.
    ko: 같은 팀이니까 좀 돌려쓰자. 뭐 어때.
    ja: |-
      いいでしょ？
      同じグループの仲間なんだから。
  event_staranis2_04_s_65:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_66:
    speaker: anis_human
    en: The Ark's stars, huh... You really think we could pull that off?
    ko: 될 수 있을까. 방주의 별이.
    ja: なれるかな。アークの星。
  event_staranis2_04_s_67:
    speaker: mint
    en: I know you can... no, we can.
    ko: 너라면… 아니, 우리라면 할 수 있어.
    ja: あなたなら…ううん、私たちならなれるわ。
  event_staranis2_04_s_68:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_69:
    speaker: "<Narration>"
    en: Prika taps on her phone,
    ko: 프리카가 핸드폰을 조작한다.
    ja: プリカが携帯を操作した
  event_staranis2_04_s_70:
    speaker: "<Narration>"
    en: and an unfamiliar tune starts playing.
    ko: 낮선 음악이 흘러나온다.
    ja: 聞いた覚えのない曲が流れだした
  event_staranis2_04_s_71:
    speaker: prika
    en: Listen to this.
    ko: 이거 들어봐.
    ja: これ、聞いてくれ。
  event_staranis2_04_s_72:
    speaker: prika
    en: Not bad, right?
    ko: 좋지?
    ja: いい曲だろ？
  event_staranis2_04_s_73:
    speaker: anis_human
    en: "... What's this?"
    ko: "…뭔데 이게."
    ja: "…何これ？"
  event_staranis2_04_s_74:
    speaker: prika
    en: Our second original song.
    ko: 우리 두 번째 오리지널 곡.
    ja: 私たちのオリジナル、2曲めだ。
  event_staranis2_04_s_75:
    speaker: anis_human
    en: "... What?"
    ko: "…뭐?"
    ja: "…え？"
  event_staranis2_04_s_76:
    speaker: prika
    en: "... Riss and I worked on this whenever we had some free time. It's basically
      done now."
    ko: |-
      …리스랑 내가 틈날 때마다 작업했어.
      완성 직전 단계고.
    ja: |-
      …空いた時間を見つけて、
      リスと進めてたんだ。
      もうすぐ完成するところだった。
  event_staranis2_04_s_77:
    speaker: prika
    en: We wanted to show you once it was finished, but then this happened.
    ko: 멋지게 완성한 다음 보여주고 싶었는데, 그럴 기회가 없었어.
    ja: |-
      仕上がってから教えようと思ってたら、
      こんなことになったからな。
  event_staranis2_04_s_78:
    speaker: prika
    en: Let's use this
    ko: 이걸로 하자.
    ja: こいつをやろう。
  event_staranis2_04_s_79:
    speaker: prika
    en: for our debut stage.
    ko: 메이저 데뷔 공연.
    ja: メジャーデビューのステージで。
  event_staranis2_04_s_80:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_81:
    speaker: prika
    en: I want to sing and dance to this.
    ko: 이거 부르고, 이거에 맞춰서 춤추고 싶어.
    ja: これに歌を乗せて、踊りたい。
  event_staranis2_04_s_82:
    speaker: prika
    en: I want to show everyone just how far we can go.
    ko: 우리가 이렇게까지 할 수 있다는 거, 보여주고 싶어.
    ja: |-
      私たちはこれだけできるように
      なったってことを、見せたいんだ。
  event_staranis2_04_s_83:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_84:
    speaker: prika
    en: And Riss was supposed to hear it first...
    ko: "…리스한테 가장 먼저 보여주고 싶었는데."
    ja: |-
      …誰より先に、
      リスに見せてやりたかったんだけどな。
  event_staranis2_04_s_85:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_86:
    speaker: prika
    en: You're in, right?
    ko: 할거지?
    ja: やるだろ？
  event_staranis2_04_s_87:
    speaker: prika
    en: We're nothing special right now,
    ko: 우리는 평범해.
    ja: 私たちは平凡だ。
  event_staranis2_04_s_88:
    speaker: prika
    en: but we'll prove we're getting there, step by step.
    ko: 하지만 조금씩 특별해지고 있다는 걸 보여주자.
    ja: |-
      でも、少しずつ特別に
      なれてきてるってことを見せつけてやろう。
  event_staranis2_04_s_89:
    speaker: prika
    en: And right in front of them, we'll become better than anyone else.
    ko: 그리고 보란 듯이, 누구보다 특별해져서.
    ja: |-
      いつか誰もケチが
      つけられないぐらい
      特別な存在になって…
  event_staranis2_04_s_90:
    speaker: prika
    en: We'll become stars that shine.
    ko: 반짝반짝 빛나는 별이 되자.
    ja: ピッカピカに輝く星になるんだ。
  event_staranis2_04_s_91:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_92:
    speaker: mint
    en: Anis.
    ko: 아니스.
    ja: アニス。
  event_staranis2_04_s_93:
    speaker: prika
    en: Anis.
    ko: 아니스.
    ja: アニス。
  event_staranis2_04_s_94:
    speaker: anis_human
    en: "... This is good."
    ko: "…노래 좋다."
    ja: "…いい曲ね。"
  event_staranis2_04_s_95:
    speaker: anis_human
    en: What's it called?
    ko: 제목이 뭐야.
    ja: タイトルは？
  event_staranis2_04_s_96:
    speaker: prika
    en: Be My Star.
    ko: |-
      Be My Star.
      내 별이 되어줘.
    ja: |-
      「Be My Star」
      …私の星になって、って意味だ。
  event_staranis2_04_s_97:
    speaker: anis_human
    en: Riss... came up with that, didn't she?
    ko: 제목… 리스가 지었구나.
    ja: タイトルは…リスがつけたのね。
  event_staranis2_04_s_98:
    speaker: prika
    en: "... Yeah."
    ko: "…응."
    ja: "…ああ。"
  event_staranis2_04_s_99:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_s_100:
    speaker: anis_human
    en: Let's do it.
    ko: 하자.
    ja: やるわ。
  event_staranis2_04_s_101:
    speaker: anis_human
    en: I'm in.
    ko: 해보자.
    ja: やってみる。
  event_staranis2_04_s_102:
    speaker: "<Narration>"
    en: In the days leading up to their debut, T.T. STAR throws themselves into relentless
      practice,
    ko: T.T. STAR는 메이저 데뷔 공연을 앞두고 연습에 몰두했다.
    ja: |-
      T.T. STARはメジャー入り記念ライブに向け
      練習に没頭した
  event_staranis2_04_s_103:
    speaker: "<Narration>"
    en: determined to commit their new song, Be My Star, to muscle memory.
    ko: 새로운 곡 [Be My Star]를 몸에 익히기 위해 전력을 다했다.
    ja: |-
      新曲「Be My Star」の振り付けが
      体に染み込むまで、全力で練習を続けた
  event_staranis2_04_s_104:
    speaker: "<Narration>"
    en: And then, the big day has finally arrived.
    ko: 그리고 시간은 흘러 공연 당일.
    ja: 時は瞬く間に流れ、ライブ当日
  event_staranis2_04_s_105:
    speaker: "<Narration>"
    en: With the final rehearsal behind them, confidence radiates from every member.
    ko: T.T. STAR는 아크리온 홀로 향했다.
    ja: |-
      T.T. STARのメンバーは
      アークリアンホールに向かっていた
  event_staranis2_04_s_106:
    speaker: "<Narration>"
    en: The preparation is complete, and now, all that's left is to step onto the
      stage and showcase their skills to the world.
    ko: 연습은 완벽. 자신 있었다.
    ja: |-
      完璧に仕上げた。
      自信はある
  event_staranis2_04_s_107:
    speaker: "<Narration>"
    en: They make their way to Arkrian Hall in the vehicle provided by Tetra
    ko: 남은 건 무대 위에서 맘껏 기량을 뽐내면 될 일이었다.
    ja: |-
      あとはステージの上で
      練習の成果を存分に発揮するだけだ
  event_staranis2_04_s_108:
    speaker: "<Narration>"
    en: and headed toward the backstage area.
    ko: 테트라에서 제공한 차량으로 아크리온 홀로 이동한다.
    ja: |-
      テトラの用意した送迎車は
      アークリアンホールへ近づいた
  event_staranis2_04_s_109:
    speaker: "<Narration>"
    en: As they approach the plaza, they spot a long line of fans eagerly waiting,
    ko: 백스테이지로 이동하기 위해 광장으로 향한다.
    ja: |-
      バックステージへの道の途中にある、
      広場を通り過ぎた
  event_staranis2_04_s_110:
    speaker: "<Narration>"
    en: their anticipation hanging in the air.
    ko: 많은 관중이 줄을 서고 기다리고 있다.
    ja: 入場待ちの大勢の観客が列を成している
  event_staranis2_04_s_111:
    speaker: "<Narration>"
    en: Eyes meet for a brief moment, but no one moves.
    ko: 몇몇과 눈이 마주쳤지만, 그들은 움직이지 않았다.
    ja: 何人かと目が合ったが、騒ぐものはいなかった
  event_staranis2_04_s_112:
    speaker: "<Narration>"
    en: Then, out of the crowd, someone breaks free and rushes toward them.
    ko: 그러던 중, 줄을 빠져나온 누군가가 T.T. STAR에게 달려온다.
    ja: |-
      しかしその中で、列から飛び出した何者かが
      T.T. STAR目がけて迫った
  event_staranis2_04_s_113:
    speaker: "<Narration>"
    en: It's Yoyo, her face lighting up with a smile as she greets them.
    ko: 요요가 미소 지으며 T.T. STAR에게 인사한다.
    ja: |-
      T.T. STARに声を上げたのは、
      微笑みを浮かべるヨヨだった
event_staranis2_04_e:
  event_staranis2_04_e_1:
    speaker: "<Narration>"
    en: Four hours earlier, in Enikk's room.
    ko: 4시간 전. 에닉의 방.
    ja: 4時間前、エニックルーム
  event_staranis2_04_e_2:
    speaker: enikk
    en: All tests are now complete.
    ko: 이상으로 모든 테스트를 종료하겠습니다.
    ja: これですべての試験は終了です。
  event_staranis2_04_e_3:
    speaker: enikk
    en: Thank you for your cooperation.
    ko: 긴 시간 동안 수고 많으셨습니다.
    ja: 長時間、お疲れ様でした。
  event_staranis2_04_e_4:
    speaker: hanson
    en: I appreciate all your hard work.
    ko: 수고… 많으셨습니다.
    ja: お疲れ様…まったくだ。
  event_staranis2_04_e_5:
    speaker: enikk
    en: Initiating physical condition scan.
    ko: 바디 컨디션을 체크하겠습니다.
    ja: 身体のコンディションを確認します。
  event_staranis2_04_e_6:
    speaker: enikk
    en: Scan complete. No abnormalities detected, aside from poor hygiene.
    ko: 체크 완료. 위생상 불결하다는 것 이외에는 이상 없습니다.
    ja: |-
      チェック完了。
      やや不衛生な状態であることを除けば、
      問題ありません。
  event_staranis2_04_e_7:
    speaker: hanson
    en: Well... I haven't even been able to go outside for days with all these tests.
    ko: 그야… 며칠 동안 나가지도 못하고 계속 테스트만 했으니까요.
    ja: |-
      当然でしょう…何日も外に出られず、
      ずっとテスト続きでしたから。
  event_staranis2_04_e_8:
    speaker: hanson
    en: So, what's the verdict?
    ko: 그래서, 결론은 어떻게 되었습니까.
    ja: それで、結論は。
  event_staranis2_04_e_9:
    speaker: enikk
    en: Highly suitable.
    ko: 매우 적합합니다.
    ja: 合格です。
  event_staranis2_04_e_10:
    speaker: enikk
    en: The plan you proposed is executable.
    ko: 당신이 말한 계획을 실행하기에 충분합니다.
    ja: あなたの計画は十分に実行可能と判断します。
  event_staranis2_04_e_11:
    speaker: enikk
    en: Minor errors may occur, but no critical issues expected.
    ko: 작은 오류가 있을 수 있겠으나, 큰 문제는 아닙니다.
    ja: |-
      軽微な誤差は現れるかもしれませんが、
      大きな問題とはならないでしょう。
  event_staranis2_04_e_12:
    speaker: hanson
    en: Which would mean...
    ko: 그렇다는 말은….
    ja: それはつまり…
  event_staranis2_04_e_13:
    speaker: enikk
    en: In theory, there is no issue.
    ko: 이론상으로 문제는 없습니다.
    ja: 理論上の問題はありません。
  event_staranis2_04_e_14:
    speaker: enikk
    en: However, the subject's consent is required.
    ko: 단, 대상의 동의가 필요합니다.
    ja: ただし、当事者の承認が必要です。
  event_staranis2_04_e_15:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_16:
    speaker: hanson
    en: I thought as much.
    ko: 역시 그렇군요.
    ja: やはりそうなりますか。
  event_staranis2_04_e_17:
    speaker: enikk
    en: Affirmed. This plan cannot proceed without consent.
    ko: 예. 동의 없이 이런 일을 진행할 순 없습니다.
    ja: |-
      はい。当事者の同意なき実行は
      認められません。
  event_staranis2_04_e_18:
    speaker: enikk
    en: Consent obtained through coercion, including physical force, is invalid.
    ko: 물론, 물리적인 수단을 포함한 각종 위협 수단을 동원한 동의는 아무런 효력이 없습니다.
    ja: |-
      当然ながら、物理的なものを含む
      あらゆる脅迫行為下での同意は
      無効とされます。
  event_staranis2_04_e_19:
    speaker: enikk
    en: The subject's voluntary consent is required.
    ko: 대상의 자발적인 동의가 반드시 있어야 합니다.
    ja: 対象の自由意思による同意が必須条件です。
  event_staranis2_04_e_20:
    speaker: hanson
    en: What happens after we obtain their consent?
    ko: 동의를 구한 이후에는 어떻게 되는 겁니까.
    ja: 同意を得たあとの実行は？
  event_staranis2_04_e_21:
    speaker: enikk
    en: Upon consent, the process will proceed immediately.
    ko: 동의를 구할 경우 일은 굉장히 빠른 속도로 진행됩니다.
    ja: 同意の確認後、ただちに行われます。
  event_staranis2_04_e_22:
    speaker: enikk
    en: The estimated duration is five minutes.
    ko: 최대 5분으로 예상하고 있습니다.
    ja: 想定必要時間は、最大5分。
  event_staranis2_04_e_23:
    speaker: hanson
    en: That's fast.
    ko: 빠르군요.
    ja: 速いですね。
  event_staranis2_04_e_24:
    speaker: enikk
    en: Correct.
    ko: 그렇습니다.
    ja: そうですか。
  event_staranis2_04_e_25:
    speaker: hanson
    en: "... Understood."
    ko: "…알겠습니다."
    ja: "…分かりました。"
  event_staranis2_04_e_26:
    speaker: hanson
    en: I'll see to it that I have their consent.
    ko: 반드시 동의를 구하겠습니다.
    ja: 本人の同意は、必ず得られるでしょう。
  event_staranis2_04_e_27:
    speaker: "<Narration>"
    en: Hanson checks his watch and strides out of Enikk's room.
    ko: 한슨은 시계를 들여다보며 빠른 걸음으로 에닉의 방을 나섰다.
    ja: |-
      ハンソンは時間を確かめ、
      早足でエニックルームを出た
  event_staranis2_04_e_28:
    speaker: "<Narration>"
    en: T.T. STAR's performance is in two hours.
    ko: 현재. T.T. STAR 공연까지 2시간 전.
    ja: |-
      T.T. STARのステージが
      2時間後に迫っている
  event_staranis2_04_e_29:
    speaker: "<Narration>"
    en: In a VIP room at Tetra Line's private hospital.
    ko: 테트라 라인 임원진용 병원.
    ja: テトラライン専属病院、VIP専用室
  event_staranis2_04_e_30:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_31:
    speaker: "<Narration>"
    en: Mustang lies in bed, staring up at the ceiling.
    ko: 머스탱은 침대에 누워 천장을 바라보고 있다.
    ja: |-
      マスタングがベッドに横たわり、
      天井を見上げていた
  event_staranis2_04_e_32:
    speaker: "<Narration>"
    en: At last, the day has come. The cure for the disease that's been eating away
      at him is ready.
    ko: 생명을 갉아먹는 병의 치료제가 완성되는 날.
    ja: 自身をむしばむ病の特効薬が届く予定日
  event_staranis2_04_e_33:
    speaker: "<Narration>"
    en: He's lost count of how long he's waited for this.
    ko: 머스탱은 이날을 얼마나 기다려왔는지 모른다.
    ja: どれだけ待ち望んでいたことだろう
  event_staranis2_04_e_34:
    speaker: "<Narration>"
    en: He lets his eyes fall shut, a faint smile lingering on his lips.
    ko: 머스탱은 눈을 감고 미소 짓는다.
    ja: |-
      目を閉じたマスタングの
      口の端が吊り上がった
  event_staranis2_04_e_35:
    speaker: "<Narration>"
    en: He waits.
    ko: 머스탱은 기다린다.
    ja: マスタングは待っていた
  event_staranis2_04_e_36:
    speaker: "<Narration>"
    en: The hospital room door opens without a sound.
    ko: 병실의 문이 조용히 열린다.
    ja: 病室の扉が静かに開かれた
  event_staranis2_04_e_37:
    speaker: "<Narration>"
    en: Footsteps draw closer.
    ko: 누군가가 걸어오는 소리가 들린다.
    ja: 足音が近づいてくる
  event_staranis2_04_e_38:
    speaker: "<Narration>"
    en: His heart starts to pound faster and faster, as if it might burst from his
      chest.
    ko: 머스탱은 심장이 두근거려 미칠 것 같은 기분을 느꼈다.
    ja: |-
      マスタングは気が狂いそうなほど
      鼓動の高鳴りを感じていた
  event_staranis2_04_e_39:
    speaker: "<Narration>"
    en: The footsteps stop. Someone stands beside him.
    ko: |-
      걸음 소리가 멈추고,
      옆에 사람의 기척이 느껴진다.
    ja: 近づく足音が、枕元で止まった
  event_staranis2_04_e_40:
    speaker: "<Narration>"
    en: A feeling he hasn't known in a long time rises within him, a mix of anticipation
      and nerves. Slowly, he opens his eyes.
    ko: 머스탱은 오랜만에 느끼는 설렘, 떨림과 함께 조용히 눈을 떴다.
    ja: |-
      これほど心躍ったのはいつぶりだっただろう。
      マスタングはゆっくりと目を開いた
  event_staranis2_04_e_41:
    speaker: "<Narration>"
    en: And when he finally sees the face he's been waiting for, his smile spreads
      wider.
    ko: 그리고, 그토록 기다려왔던 이의 얼굴을 확인하고 크게 미소 짓는다.
    ja: |-
      そして目に入ったものが
      待ち望んでいた通りの顔であることを確かめ、
      心から愉快そうな笑顔を向けた
  event_staranis2_04_e_42:
    speaker: mustang_past
    en: So, you've finally arrived,
    ko: 왔구나.
    ja: 来たな…
  event_staranis2_04_e_43:
    speaker: mustang_past
    en: my son.
    ko: 아들아.
    ja: 息子よ。
  event_staranis2_04_e_44:
    speaker: hanson
    en: Yes, Father.
    ko: 예. 왔습니다.
    ja: そうです。来ました。
  event_staranis2_04_e_45:
    speaker: hanson
    en: I'm here.
    ko: 아버지.
    ja: 父さん。
  event_staranis2_04_e_46:
    speaker: "<Narration>"
    en: In Hanson's hand is a small mechanical device,
    ko: 한슨의 손에는 작은 기계 장치가 들려 있었다.
    ja: |-
      ハンソンの手には
      小さな医療機器らしきものがある
  event_staranis2_04_e_47:
    speaker: "<Narration>"
    en: a pale white liquid sloshing faintly inside.
    ko: 하얀색으로 찰랑이는 액체가 든 기계 장치.
    ja: 白色の液体がガラス越しに揺れていた
  event_staranis2_04_e_48:
    speaker: mustang_past
    en: So this is the cure.
    ko: 치료제로군.
    ja: それが治療薬か。
  event_staranis2_04_e_49:
    speaker: hanson
    en: Yes, that's correct.
    ko: 맞습니다.
    ja: そうです。
  event_staranis2_04_e_50:
    speaker: mustang_past
    en: How'd you even get your hands on that... No, no, that's a boring question.
    ko: |-
      그걸 어떻게 손에 넣었, 아니 아니.
      재미없는 질문이군.
    ja: |-
      どうやって…いや。
      聞くだけヤボだな。
  event_staranis2_04_e_51:
    speaker: mustang_past
    en: So, what now?
    ko: 그래서, 어떻게 할 생각이지?
    ja: で、どうするつもりだ？
  event_staranis2_04_e_52:
    speaker: mustang_past
    en: You're standing there with my life in your grip.
    ko: 넌 지금 내 목숨줄을 쥐고 흔들 수 있는 위치에 섰다.
    ja: |-
      お前は今、俺の命綱を握って、
      好き放題揺さぶれる。
  event_staranis2_04_e_53:
    speaker: mustang_past
    en: Go on, tell me what do you plan to do with it?
    ko: 그걸로 뭘 어떻게 할 생각인지 말해봐라.
    ja: 聞かせろよ、何をさせたいのか。
  event_staranis2_04_e_54:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_55:
    speaker: hanson
    en: Father,
    ko: 아버지.
    ja: 父さん。
  event_staranis2_04_e_56:
    speaker: hanson
    en: I ask that you die.
    ko: 죽어주십시오.
    ja: 死んでもらいます。
  event_staranis2_04_e_57:
    speaker: yoyo
    en: Anis.
    ko: 아니스.
    ja: アニス…
  event_staranis2_04_e_58:
    speaker: "<Narration>"
    en: Yoyo suddenly closes in.
    ko: 요요가 불쑥 다가온다.
    ja: ヨヨが近づいた
  event_staranis2_04_e_59:
    speaker: "<Narration>"
    en: The stench is enough to make anyone wince.
    ko: 악취에 눈살이 찌푸려진다.
    ja: |-
      顔をしかめたくなるような
      悪臭が鼻をついた
  event_staranis2_04_e_60:
    speaker: "<Narration>"
    en: She gnaws at her nails, flashing a crooked grin as she speaks.
    ko: 요요는 손톱을 잘근잘근 씹으며 히죽대며 말한다.
    ja: |-
      ヨヨは爪を噛みながら、
      意地の悪い笑みを浮かべた
  event_staranis2_04_e_61:
    speaker: yoyo
    en: So you're finally going mainstream, huh? Must be nice.
    ko: 메이저 데뷔한다며? 좋겠다.
    ja: |-
      メジャーデビューするんですって？
      よかったわね。
  event_staranis2_04_e_62:
    speaker: yoyo
    en: After everything you did to me, you still get to make it big. Happy now?
    ko: 나를 그렇게 엉망으로 만들어놓고 메이저로 가니까 좋아?
    ja: |-
      私をどん底に突き落として、
      メジャーにも行けて、嬉しい？
  event_staranis2_04_e_63:
    speaker: anis_idol
    en: Yoyo... you've got it wrong. I didn't do that.
    ko: "…요요. 오해가 있는 모양인데, 그건 정말 내가 한 게 아니야."
    ja: |-
      …ヨヨ。勘違いしてるみたいだけど、
      あれをやったのは私じゃないの。
  event_staranis2_04_e_64:
    speaker: anis_idol
    en: I'm really sorry about what happened to you.
    ko: 네 일은 안타깝게 생각해.
    ja: |-
      あんなことになったのは、
      気の毒に思ってるぐらい。
  event_staranis2_04_e_65:
    speaker: anis_idol
    en: But it wasn't me. It wasn't us.
    ko: 하지만 나는, 우리는 아냐.
    ja: でもとにかく、私でも私たちでもないから。
  event_staranis2_04_e_66:
    speaker: anis_idol
    en: That's not the kind of thing we'd ever do.
    ko: 아이돌답지 못한 짓은, 우리 방식이 아니야.
    ja: 私たち、アイドルらしくないことはしない。
  event_staranis2_04_e_67:
    speaker: yoyo
    en: Heh, and that Smile Time thing counts as acting like a pop star?
    ko: 흐응. 스마일 박스는 아이돌다운 짓이었고?
    ja: |-
      ふーん…じゃ、スマイルボックスは
      アイドルらしいことだったの？
  event_staranis2_04_e_68:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_69:
    speaker: mint_o
    en: Did you come to pick a fight?
    ko: 너, 시비 걸러 온 거야?
    ja: あなた、ケンカを売りに来たの？
  event_staranis2_04_e_70:
    speaker: mint_o
    en: Save it for after the show. We'll hear you out then.
    ko: 미안한데, 끝나고 하자. 얘기 다 들어줄게.
    ja: |-
      悪いけど、後にして。
      終わってからならいくらでも聞くわ。
  event_staranis2_04_e_71:
    speaker: prika_o
    en: This is an important day for us. So do me a favor and step back.
    ko: |-
      우리한테 중요한 날이야.
      부탁이니까, 물러가 줘.
    ja: |-
      私たちにとって大事な日なんだ。
      頼むから、下がっててくれ。
  event_staranis2_04_e_72:
    speaker: yoyo
    en: Hey, Anis.
    ko: 저기 아니스.
    ja: ねえ、アニス。
  event_staranis2_04_e_73:
    speaker: yoyo
    en: Back in school, you took everything from me.
    ko: 우리 학생 때, 네가 내 거 다 빼앗아 갔잖아.
    ja: |-
      学校にいた時も、
      あなたは私のものを
      何もかも奪っていったわよね。
  event_staranis2_04_e_74:
    speaker: yoyo
    en: You had nothing, yet you couldn't stand that I had it all. So you just took
      it.
    ko: 아무것도 없는 주제에, 다 가진 내가 부러워서 다 빼앗아 갔잖아.
    ja: |-
      何もないから、何でも持ってる私が
      うらやましくて、全部奪っていったのよね。
  event_staranis2_04_e_75:
    speaker: yoyo
    en: And that still wasn't enough? Now you've even become a Nikke... What, you
      planning to take everything again?
    ko: 그걸로 만족이 안 됐어? 왜 니케까지 되어서 그래?
    ja: |-
      それでも満足できないの？
      なんでニケになっても同じことをするの？
  event_staranis2_04_e_76:
    speaker: anis_idol
    en: "... No, that's my line."
    ko: "…내가, 할 말이야."
    ja: "…それはこっちのセリフでしょ。"
  event_staranis2_04_e_77:
    speaker: yoyo
    en: Oh, so you're saying it was all just a misunderstanding, huh?
    ko: 아아. 응. 오해가 있었다는 말이지?
    ja: ああ、そう。誤解があったってことね？
  event_staranis2_04_e_78:
    speaker: yoyo
    en: But we can't exactly clear that up, can we? We're both seeing things our way.
    ko: 근데 그거 못 풀잖아. 우리 서로서로를 오해하고 있으니까, 그렇지?
    ja: |-
      でも、仕方ないわよね。
      お互いに誤解してるんだから。
  event_staranis2_04_e_79:
    speaker: yoyo
    en: So I was thinking...
    ko: 그래서 생각해 봤는데.
    ja: それで、考えてみたんだけど。
  event_staranis2_04_e_80:
    speaker: yoyo
    en: Why don't we just pretend none of this ever happened?
    ko: 없던 걸로 하자.
    ja: なかったことにしない？
  event_staranis2_04_e_81:
    speaker: anis_idol
    en: "... What?!"
    ko: "…뭐?"
    ja: "…は？"
  event_staranis2_04_e_82:
    speaker: yoyo
    en: Yeah, let's pretend none of this ever happened.
    ko: 응. 없던 걸로 하자.
    ja: 水に流しましょ、お互い。
  event_staranis2_04_e_83:
    speaker: yoyo
    en: Let's go back to when we were students.
    ko: 학생 때로 다시 돌아가자.
    ja: 水に流して、学生時代に戻りましょ。
  event_staranis2_04_e_84:
    speaker: yoyo
    en: And this time, we do it fair and square.
    ko: 돌아가서, 처음부터 정정당당하게 경쟁하자.
    ja: それで今度は、最初から正々堂々と競い合うの。
  event_staranis2_04_e_85:
    speaker: anis_idol
    en: Did you get shot or something? What the heck are you on about?
    ko: |-
      총 맞았냐.
      헛소리를 하고 있어.
    ja: |-
      頭でも撃たれた？
      何言ってんの…？
  event_staranis2_04_e_86:
    speaker: yoyo
    en: If we could go back, I wouldn't pick on you anymore.
    ko: 다시 돌아가면 나 너 안 괴롭힐게.
    ja: |-
      学生に戻ったら、
      もうあなたをいじめないわ。
  event_staranis2_04_e_87:
    speaker: yoyo
    en: So you stay in your place and keep your hands off what's mine.
    ko: 그러니 너도 내 거 안 빼앗아 가는 걸로 하자.
    ja: |-
      だからあなたも、私のものを奪わないって
      約束して。
  event_staranis2_04_e_88:
    speaker: yoyo
    en: Then we wouldn't have to fight...
    ko: 그러면 우리 싸울 일도 없고
    ja: そうすれば、私たちはいがみ合わなくていいし…
  event_staranis2_04_e_89:
    speaker: yoyo
    en: and you wouldn't end up on that rooftop.
    ko: 네가 옥상에 올라갈 일도 없잖아.
    ja: あなたも屋上で過ごさなくてよくなるでしょ？
  event_staranis2_04_e_90:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_91:
    speaker: anis_idol
    en: You knew about that?
    ko: 너, 알고 있었냐.
    ja: 知ってたのね、あんた。
  event_staranis2_04_e_92:
    speaker: yoyo
    en: Ah, yeah. I've been watching, waiting to see when you'd go up.
    ko: 아, 응. 언제 올라갈지 계속 지켜보고 있었거든.
    ja: ええ、そうよ。ずっと見てたもの。
  event_staranis2_04_e_93:
    speaker: yoyo
    en: Anyway, if we're starting over, you'd better keep it fair this time.
    ko: 아무튼 다시 시작하면, 너도 정정당당하게 해야 해.
    ja: |-
      とにかく、やり直したら、
      今度は正々堂々勝負してね。
  event_staranis2_04_e_94:
    speaker: yoyo
    en: I gave it some thought, and the reason we're even in this mess is because
      we came from such different worlds, right?
    ko: 생각해 봤는데, 우린 태어날 때부터 가진 게 너무 달라서 이 문제가 생긴 거잖아?
    ja: |-
      考えてみたら、私たちがこうなったのって
      生まれつき持ってるものが
      違いすぎたせいじゃない？
  event_staranis2_04_e_95:
    speaker: yoyo
    en: You had nothing, and I had everything.
    ko: 너는 아무것도 없었고, 나는 다 가지고 있었으니까.
    ja: |-
      あなたは何も持ってなくて、
      私は何でも持ってたから。
  event_staranis2_04_e_96:
    speaker: yoyo
    en: So, if we both start with nothing, then there'd be no reason to fight, right?
    ko: 그럼 둘 다 아무것도 없는 상태에서 시작하면 싸울 일도 없어.
    ja: |-
      お互い何もないところから始めたら、
      平等になるでしょ。
  event_staranis2_04_e_97:
    speaker: yoyo
    en: Heh, makes sense, right? Pretty genius, don't you think?
    ko: 하하. 맞지? 천재적이지?
    ja: あはは…ね？いいアイデアだと思わない？
  event_staranis2_04_e_98:
    speaker: yoyo
    en: So no hiding behind your groupmates or anything like that.
    ko: 그러니까 비겁하게 동료 같은 것도 빼고, 둘 다 아무것도 없는 상태로.
    ja: |-
      仲間なんて卑怯なものは抜きにして、
      2人ともゼロからやるの。
  event_staranis2_04_e_99:
    speaker: yoyo
    en: Just you and me. Nothing else. A proper competition.
    ko: 너랑 나. 둘이서만 경쟁하는 거야.
    ja: あなたと私。2人だけで。
  event_staranis2_04_e_100:
    speaker: yoyo
    en: And this time, I'll show you exactly how wide the gap really is.
    ko: 내가 이번에는 정말 격의 차이를 보여줄게.
    ja: |-
      そしたら私が本気で、
      格の違いを見せつけてあげられるから。
  event_staranis2_04_e_101:
    speaker: anis_idol
    en: You're out of your damn mind.
    ko: 미친놈.
    ja: おかしくなってる…
  event_staranis2_04_e_102:
    speaker: yoyo
    en: One's already been dealt with, so now it's just the two of you.
    ko: |-
      그럼 일단 동료 중 하나는 처리했으니,
      여기 있는 둘만 치우면 되겠다.
    ja: |-
      1人はもう片付けたから、
      あとはここにいる2人だけ。
  event_staranis2_04_e_103:
    speaker: yoyo
    en: Sorry, but would you mind leaving? Anis and I have a score to settle.
    ko: |-
      너희 둘, 미안한데 이만 가줄래?
      아니스는 나랑 경쟁해야 하거든.
    ja: |-
      あなたたち、悪いけど
      この世界から消えてくれる？
      アニスと私の2人で勝負しなきゃいけないの。
  event_staranis2_04_e_104:
    speaker: anis_idol
    en: Wait... what?
    ko: "…뭐…?"
    ja: "…はぁ…？"
  event_staranis2_04_e_105:
    speaker: yoyo
    en: Come on, it's only a fair match if both of them step out. Why are you so surprised?
    ko: 에이. 둘이 빠져야 정정당당한 승부가 되잖아. 뭘 그렇게 놀라?
    ja: |-
      だって、そこの2人がいたら、
      フェアな勝負にならないでしょ？
      何をそんなに驚いてるの？
  event_staranis2_04_e_106:
    speaker: anis_idol
    en: Wait, you said you took one out... What does that even mean?
    ko: 하나는 처리했다니… 무슨 말이야.
    ja: 1人は片付けたって…どういうことよ。
  event_staranis2_04_e_107:
    speaker: yoyo
    en: Your manager, who else? I've already killed her. Now, I just need to get rid
      of these two, and then it'll be you and me.
    ko: |-
      아, 네 매니저. 내가 죽였거든.
      그러니 이제 둘만 치우면 일대일이 되는
    ja: |-
      ああ、あなたのマネージャーね…
      私が殺したの。
      だから、あとはその2人を消せば…
  event_staranis2_04_e_108:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 쩍-!
    ja: バキッ――！
  event_staranis2_04_e_109:
    speaker: "<Narration>"
    en: Anis's fist connects with Yoyo's face.
    ko: 요요의 얼굴에 아니스의 주먹이 꽂힌다.
    ja: ヨヨの顔面にアニスの拳がめり込んだ
  event_staranis2_04_e_110:
    speaker: yoyo
    en: Urgh!
    ko: 우풉…!
    ja: うぐっ…！
  event_staranis2_04_e_111:
    speaker: "<Narration>"
    en: Yoyo goes down hard.
    ko: 요요가 넘어진다.
    ja: ヨヨが吹き飛んだ
  event_staranis2_04_e_112:
    speaker: "<Narration>"
    en: Something flies from her clothes and skids across the floor.
    ko: 품에서 뭔가가 튀어나와 바닥에 떨어진다.
    ja: 胸元から何かが飛び出し、地面に転がった
  event_staranis2_04_e_113:
    speaker: "<Narration>"
    en: It's Riss's glasses.
    ko: 리스의 안경이다.
    ja: リスの眼鏡だ
  event_staranis2_04_e_114:
    speaker: anis_idol
    en: "*Gasp!*"
    ko: "---!!"
    ja: "――！！"
  event_staranis2_04_e_115:
    speaker: yoyo
    en: Wh-why are you hitting me, Ani—
    ko: 왜, 왜 때리는 거야 아니ㅅ
    ja: なっ、なんで殴るの、アニ…
  event_staranis2_04_e_116:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 퍽-!!
    ja: ドガッ！
  event_staranis2_04_e_117:
    speaker: "<Narration>"
    en: Anis grabs Yoyo by the collar, yanks her upright, and slams a fist into her
      face repeatedly.
    ko: |-
      아니스가 요요의 멱살을 잡고 일으킨 후,
      얼굴에 주먹을 꽂아 넣는다.
    ja: |-
      アニスはヨヨの胸ぐらをつかみ上げ、
      さらに顔面へ向かって拳を叩きつけた
  event_staranis2_04_e_118:
    speaker: "<Narration>"
    en: "*Wham, wham, wham, wham!*"
    ko: 퍽! 퍽! 퍽! 퍽!
    ja: 鈍い打撃の音が何度か響いた
  event_staranis2_04_e_119:
    speaker: "<Narration>"
    en: Mint and Prika are shouting, but Anis can't hear a thing.
    ko: 민트와 프리카가 소리치지만 아니스에게는 들리지 않는다.
    ja: |-
      ミントとプリカの叫びは、
      アニスに聞こえなくなっていた
  event_staranis2_04_e_120:
    speaker: yoyo
    en: Ack... Ugh... kgh...!
    ko: 엑… 으겍… 카학…!
    ja: うっ…ゲホッ…カハッ…！
  event_staranis2_04_e_121:
    speaker: classpresident
    en: You're an orphan!
    ko: 너 부모도 없다며! 고아라며!
    ja: あんた、身寄りのない孤児なんでしょ！
  event_staranis2_04_e_122:
    speaker: classpresident
    en: You only got in here on some scholarship!
    ko: 여기도 지원금 받아서 들어온 거라며!
    ja: 支援金もらって入学してるくせに！
  event_staranis2_04_e_123:
    speaker: classpresident
    en: You've got absolutely nothing, so why do you strut around like you're in charge?
    ko: 진짜 아무것도 없는 게 뭘 맨날 그렇게 잘난 듯이 대장질을 하는건데!
    ja: 偉そうにしてるからこうなるのよ！
  event_staranis2_04_e_124:
    speaker: classpresident
    en: I'm the leader! I'm the class president! Not you!
    ko: 대장은 나라고! 내가 반장이라고! 네가 아니라!
    ja: |-
      リーダーは私！私が委員長なの！
      あんたなんかじゃなくて！
  event_staranis2_04_e_125:
    speaker: "<Narration>"
    en: "*Wham, wham, wham, wham!*"
    ko: 퍽! 퍽! 퍽! 퍽!
    ja: ガスッ！バキッ！ドガッ！ドスッ！
  event_staranis2_04_e_126:
    speaker: schoolgirl
    en: Uh, hey...
    ko: 저, 저기….
    ja: ね、ねぇ…
  event_staranis2_04_e_127:
    speaker: schoolgirl
    en: A-Anis.
    ko: 아, 아니스.
    ja: ア…アニス？
  event_staranis2_04_e_128:
    speaker: schoolgirl
    en: Um...
    ko: 그… 혹시….
    ja: あのさ…もしかして…
  event_staranis2_04_e_129:
    speaker: schoolgirl
    en: D-do you like Pretty?
    ko: 프, 프리티 좋아해?
    ja: プ、プリティーのファン？
  event_staranis2_04_e_130:
    speaker: "<Narration>"
    en: "*Wham, wham, wham, wham!*"
    ko: 퍽! 퍽! 퍽! 퍽!
    ja: ガスッ！ガスッ！ガスッ！ガスッ！
  event_staranis2_04_e_131:
    speaker: schoolgirl
    en: I-I just wanted to say... I'm sorry.
    ko: 미안… 해서.
    ja: ごめんねって…謝りたくて。
  event_staranis2_04_e_132:
    speaker: schoolgirl
    en: I've been meaning to... apologize for a while...
    ko: 계속… 사과하고 싶었… 거든.
    ja: ずっと…そう言いたかったん…だけど。
  event_staranis2_04_e_133:
    speaker: schoolgirl
    en: We don't... dislike you. That part's really true... I hope you know that.
    ko: 우리… 너 안 싫어해. 그건 진짜… 알아주면 좋겠어.
    ja: |-
      私たち…別にアニスのことは嫌いじゃないの。
      それだけは…分かってほしくて。
  event_staranis2_04_e_134:
    speaker: schoolgirl
    en: Yeah, i-if you ever become one, I'd want to be your manager.
    ko: 응. 마, 만약 아니스가 아이돌 하면 나 매니저 할래.
    ja: |-
      うん。も、もしアニスがアイドルになったら
      私、マネージャーやるから。
  event_staranis2_04_e_135:
    speaker: schoolgirl
    en: It'd be so much fun, traveling around, performing everywhere...
    ko: 진짜 재밌겠다. 이리저리 다니면서 공연하고 막….
    ja: |-
      そしたら絶対楽しいよ。
      いろんな所でライブして…
  event_staranis2_04_e_136:
    speaker: schoolgirl
    en: I-it's not like your goal is just to watch the concert, right?
    ko: 그냥 단순하게 공연만 보는 게 목적은 아닐 거 아냐.
    ja: 単に楽しみたいだけじゃないんでしょ。
  event_staranis2_04_e_137:
    speaker: schoolgirl
    en: You want to learn something from it, right?
    ko: 배, 배우고 싶은 거 아냐?
    ja: 参考にしたい…違う？
  event_staranis2_04_e_138:
    speaker: schoolgirl
    en: You've been giving it some serious thought, haven't you?
    ko: 진지하게 생각하고 있잖아.
    ja: 真剣に考えてるんでしょ？
  event_staranis2_04_e_139:
    speaker: schoolgirl
    en: Then it makes sense for you to go, Anis.
    ko: 그럼 아니스가 가는 게 맞아.
    ja: だったら、行くべきだよ。
  event_staranis2_04_e_140:
    speaker: "<Narration>"
    en: "*Wham, wham, wham, wham!*"
    ko: 퍽! 퍽! 퍽! 퍽!
    ja: ガスッ！ガスッ！ガスッ！ガスッ！
  event_staranis2_04_e_141:
    speaker: riss
    en: I thought if you ever came looking for me, I should be ready. So I became
      a manager and worked hard to learn the job.
    ko: |-
      아니스가 날 찾아올 때를 대비해서,
      매니저로 취직해서 일도 열심히 배웠어.
    ja: |-
      その日に備えて、
      マネージャーとして就職して、
      一生懸命、経験を積んできたんだ。
  event_staranis2_04_e_142:
    speaker: riss
    en: Because someday, I wanted us to become something special together.
    ko: 언젠가, 같이 특별해지고 싶어서.
    ja: いつか、一緒に特別な存在になるために。
  event_staranis2_04_e_143:
    speaker: riss
    en: Don't you dare take it out on my pop star! Stay away from her! Don't come
      anywhere near her, you hear me?!
    ko: |-
      내 아이돌한테 풀지 마!
      내 아이돌한테 다가오지 말라고!
    ja: |-
      私のアイドルはゴミ箱じゃない！
      それ以上近づかないで！
  event_staranis2_04_e_144:
    speaker: riss
    en: Get lost! All of you, just get the hell away!
    ko: 꺼져! 다 꺼져!
    ja: 消えて！今すぐ！
  event_staranis2_04_e_145:
    speaker: riss
    en: I'm... I'm so sorry! I screwed everything up...!
    ko: 미안, 미안해…! 내가 망쳤어…!
    ja: |-
      ごめん…ごめんなさい…！
      私がめちゃくちゃにしちゃった…！
  event_staranis2_04_e_146:
    speaker: riss
    en: But I can't... I just can't do this anymore...!
    ko: 그런데, 그런데 이제 더는…! 못… 참겠어…!
    ja: |-
      でも…これ以上…！
      見たく…なかったの…！
  event_staranis2_04_e_147:
    speaker: riss
    en: I hate this...! No, I hate myself...! I can't stand watching you fall apart...!
    ko: 내가 싫어…! 내 우상이 망가지는 거…! 싫다고오오--!!
    ja: |-
      イヤ…！私のアイドルが壊されるなんて…！
      絶対に…！！
  event_staranis2_04_e_148:
    speaker: classpresident
    en: Puh-lease, know your place!
    ko: 제발! 주제에 좀 맞게 살아!
    ja: だから！身の程を知りなさいよ！
  event_staranis2_04_e_149:
    speaker: classpresident
    en: Just because everyone humors you doesn't mean they actually like you!
    ko: 진짜…! 맞춰주니까 다 자기 좋아하는 줄 알고…!
    ja: |-
      バカみたい…！こっちが合わせてやってたら、
      カン違いして調子に乗って…！
  event_staranis2_04_e_150:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 퍽!
    ja: ドガッ！
  event_staranis2_04_e_151:
    speaker: anis_idol
    en: Yeah, you're right.
    ko: 그래. 네 말이 맞아.
    ja: そうね、あんたの言う通りだった
  event_staranis2_04_e_152:
    speaker: anis_idol
    en: I should've stayed in my place,
    ko: 주제에 맞게 살았어야 했어.
    ja: 身の程を知るべきだったのよ
  event_staranis2_04_e_153:
    speaker: anis_idol
    en: you damn monster!
    ko: 너 이 새X!!
    ja: ざけんじゃないわよ…！
  event_staranis2_04_e_154:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 퍽!
    ja: ドガッ！
  event_staranis2_04_e_155:
    speaker: anis_idol
    en: I just wanted to be loved and to give back even a fraction of the love I was
      given.
    ko: 사랑받고 싶었고, 받았던 그 작은 사랑을 세상에 돌려주고 싶다니.
    ja: |-
      愛されたいなんて、
      もらった愛を返したいなんて
  event_staranis2_04_e_156:
    speaker: anis_idol
    en: Who did I think I was? Right?
    ko: 내가 뭐라고. 맞지?
    ja: 私なんかにできるわけなかった、そうでしょ？
  event_staranis2_04_e_157:
    speaker: anis_idol
    en: You want what I have? You can have it all!
    ko: 다 빼앗아 가도 되는데!!
    ja: 他はどうだっていいけどさ！！
  event_staranis2_04_e_158:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 퍽!
    ja: ドガッ！
  event_staranis2_04_e_159:
    speaker: anis_idol
    en: I'm done with being a pop star.
    ko: 그래서 이제 안 하려고. 아이돌.
    ja: だから、アイドルなんてもうやめる
  event_staranis2_04_e_160:
    speaker: anis_idol
    en: I was never meant to be someone special.
    ko: 애초에 나는 특별해질 수 없는 사람이었으니까.
    ja: そもそも私が特別になれるわけなかったんだから
  event_staranis2_04_e_161:
    speaker: anis_idol
    en: But that was the one thing you shouldn't have taken from me!
    ko: 그것만은 빼앗아 가지 말았어야지!!
    ja: それだけは許さない！！
  event_staranis2_04_e_162:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 퍽!
    ja: ドガッ！
  event_staranis2_04_e_163:
    speaker: anis_idol
    en: You should never have taken my star from me!
    ko: 내 별은! 빼앗아 가지 말았어야지!!
    ja: 返して！私の星を返して！！
  event_staranis2_04_e_164:
    speaker: anis_idol
    en: Now, I'm about to do something no pop star would ever do.
    ko: 그러니 아이돌답지 못한 짓. 이제 하려고.
    ja: |-
      だから今この瞬間から、
      アイドルが絶対やらないことをやってやる…
  event_staranis2_04_e_165:
    speaker: anis_idol
    en: I'm going to kill you.
    ko: 너는 내가 죽인다.
    ja: 殺してやる…！
  event_staranis2_04_e_166:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 퍽!
    ja: ドガッ！
  event_staranis2_04_e_167:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_168:
    speaker: anis_idol
    en: Who the hell do you think you are... going after my star?!
    ko: 네가 뭔데!! 내 별을!!
    ja: 何なのよ！！私の星を…！！
  event_staranis2_04_e_169:
    speaker: mint_o
    en: Anis!
    ko: 아니스으--!!
    ja: アニス――！！
  event_staranis2_04_e_170:
    speaker: prika_o
    en: That's enough! Stop!
    ko: 그만! 그만해!
    ja: やめろ！やめてくれ！
  event_staranis2_04_e_171:
    speaker: anis_idol
    en: Let go! Let go of me! I swear I'm gonna kill her!
    ko: 놔! 놔아--!! 이 새X 내가 죽여버릴 거야!
    ja: |-
      離して！！離してよ――！！
      こいつを殺さないと…！！
  event_staranis2_04_e_172:
    speaker: "<Narration>"
    en: A rapid burst of camera clicks rings out.
    ko: 찰칵 찰칵 찰칵 찰칵 찰칵!
    ja: カシャ、カシャ、カシャ、カシャ、カシャ――
  event_staranis2_04_e_173:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_04_e_174:
    speaker: "<Narration>"
    en: Anis stops punching, then Yoyo drops hard onto the ground.
    ko: |-
      아니스가 주먹질을 멈춘다.
      요요가 바닥에 쓰러진다.
    ja: |-
      アニスの拳が止まり、
      ヨヨはその場に倒れ込んだ
  event_staranis2_04_e_175:
    speaker: "<Narration>"
    en: Her face is so badly beaten that it's unrecognizable.
    ko: 얼굴을 알아볼 수 없을 정도로 엉망이 된 요요.
    ja: |-
      ヨヨの顔はすでに
      見分けもつかないほど歪んでいた
  event_staranis2_04_e_176:
    speaker: "<Narration>"
    en: By now, a crowd has gathered, closing in from all sides.
    ko: 어느새 모여든 수많은 사람들.
    ja: いつの間にか人だかりができていた
  event_staranis2_04_e_177:
    speaker: "<Narration>"
    en: Every one of them has a phone or camera raised, recording.
    ko: 단 한 명도 빠짐없이 핸드폰과 카메라를 든 채 촬영하고 있다.
    ja: 無数の携帯のカメラが向けられている
  event_staranis2_04_e_178:
    speaker: "<Narration>"
    en: "*Click, click, click, click, click!*"
    ko: 찰칵 찰칵 찰칵 찰칵 찰칵!
    ja: カシャ、カシャ、カシャ、カシャ、カシャ――
  event_staranis2_04_e_179:
    speaker: anis_idol
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis2_04_e_180:
    speaker: "<Narration>"
    en: Anis springs to her feet.
    ko: 아니스가 벌떡 일어난다.
    ja: アニスが立ち上がった
  event_staranis2_04_e_181:
    speaker: anis_idol
    en: You enjoying this?!
    ko: 재밌냐…!
    ja: 楽しい…！？
  event_staranis2_04_e_182:
    speaker: anis_idol
    en: Huh?! I'm asking you whether you're enjoying this?!
    ko: 재밌어!? 재밌냐고!
    ja: ねえ！？楽しいかって聞いてんのよ！！
  event_staranis2_04_e_183:
    speaker: anis_idol
    en: Is other people's misery really that entertaining to you?!
    ko: 남의 불행이 그렇게 즐거워!?
    ja: 人の不幸がそんなに楽しい！？
  event_staranis2_04_e_184:
    speaker: "<Narration>"
    en: Another rapid burst of camera clicks rings out.
    ko: 찰칵 찰칵 찰칵 찰칵 찰칵!
    ja: カシャ、カシャ、カシャ、カシャ、カシャ――
  event_staranis2_04_e_185:
    speaker: anis_idol
    en: Don't look at me...!
    ko: 쳐다보지 마…!
    ja: 見ないで…！
  event_staranis2_04_e_186:
    speaker: anis_idol
    en: I said don't look at me!
    ko: 나 보지 말라고!
    ja: 私を見ないで！
  event_staranis2_04_e_187:
    speaker: anis_idol
    en: Stop it!
    ko: 보지 마!!
    ja: 見るな！！
  event_staranis2_04_e_188:
    speaker: anis_idol
    en: Get the hell away from me, you damn animals!
    ko: 다 꺼져 이 개X끼들아--!!
    ja: みんな消えろ！クズ野郎――！！
event_staranis2_05_s:
  event_staranis2_05_s_1:
    speaker: maleannouncer
    en: Wow, it's been a while since we've had a story this explosive.
    ko: 이야~ 간만에 엄청 파괴적인 소식이 들려왔네요.
    ja: |-
      いやぁ～、久しぶりに衝撃的なニュースが
      飛び込んできました。
  event_staranis2_05_s_2:
    speaker: maleannouncer
    en: Anis of T.T. STAR has just turned the former chart-topping singer, Yoyo, into...
    ko: T.T. STAR 소속 아니스가 전 아이돌 랭킹 1위인 요요를 어….
    ja: |-
      T.T. STARのアニスが
      元アイドルランキング1位のヨヨに…
  event_staranis2_05_s_3:
    speaker: maleannouncer
    en: Well, mush.
    ko: 곤죽으로 만들어버린 소식이죠.
    ja: 暴行を加えたという速報です。
  event_staranis2_05_s_4:
    speaker: femaleannouncer
    en: Not something you see often these days.
    ko: 폭력 사태는 요즘에는 귀하죠.
    ja: |-
      暴力ざたなんて、
      最近めったにありませんからね。
  event_staranis2_05_s_5:
    speaker: maleannouncer
    en: Sounds like these two go way back, even from before they were Nikkes... So
      how'd it end up turning into a full-blown showdown in front of a crowd?
    ko: |-
      둘은 사람일 때부터 보통 연이 아니었던 모양인데,
      어쩌다 그 많은 사람들 앞에서 대전 액션을 하게 된 겁니까?
    ja: |-
      2人はニケになる以前から
      因縁があったようですが、
      なぜこんなことになったのでしょう？
  event_staranis2_05_s_6:
    speaker: femaleannouncer
    en: You're aware T.T. STAR's manager died, right?
    ko: T.T. STAR의 매니저가 사망했던 사실은 알고 계시죠?
    ja: |-
      T.T. STARのマネージャーが
      亡くなっていることはご存じですか？
  event_staranis2_05_s_7:
    speaker: maleannouncer
    en: Oh yeah, she caused quite a scene during the Smile Time project, and the forums
      really blew up over it.
    ko: |-
      아, 예. 스마일 박스 프로젝트 중에 난동을 피웠고.
      그 때문에 게시판이 진짜 완전 난리가 났죠.
    ja: |-
      ええ、はい。スマイルボックスプロジェクトの
      イベント中にトラブルを起こして、
      ネットも大炎上したとか。
  event_staranis2_05_s_8:
    speaker: maleannouncer
    en: From what I understand, she took responsibility and took her own life.
    ko: 그 책임을 통감해 스스로 목숨을 끊은 걸로 알고 있습니다.
    ja: |-
      その責任を苦にして、
      自ら命を絶ったそうですね。
  event_staranis2_05_s_9:
    speaker: femaleannouncer
    en: Apparently, Yoyo straight-up confessed to Anis that she killed Riss.
    ko: 그 매니저. 요요가 죽인 거라고 아니스 앞에서 자백했다고 해요.
    ja: |-
      話によると、そのマネージャーを殺害したのは
      自分だったとヨヨが言っていたそうです。
  event_staranis2_05_s_10:
    speaker: femaleannouncer
    en: So Anis lost it and beat her to a pulp.
    ko: 머리가 돌아버린 아니스가, 요요를 곤죽으로 만들었죠.
    ja: |-
      それを聞いたアニスが、
      暴行に及んだということですね。
  event_staranis2_05_s_11:
    speaker: maleannouncer
    en: Wait, what? Yoyo did what?
    ko: 예에~? 요요가요~?
    ja: ええ～？あのヨヨがですか？
  event_staranis2_05_s_12:
    speaker: maleannouncer
    en: "... Hang on, that's weird. Can a Nikke even kill a human?"
    ko: |-
      …아니. 이상한데요.
      니케가 사람을 죽일 수 있나요?
    ja: |-
      …いやいや、信じられませんね。
      ニケは人間の命を奪えないはずでは？
  event_staranis2_05_s_13:
    speaker: femaleannouncer
    en: No, they can't.
    ko: 못 죽이죠.
    ja: その通りです。
  event_staranis2_05_s_14:
    speaker: maleannouncer
    en: So how did she manage to kill her?
    ko: 그럼 어떻게 죽였죠?
    ja: すると、殺害したというのは？
  event_staranis2_05_s_15:
    speaker: femaleannouncer
    en: It was a lie.
    ko: 거짓말이었어요.
    ja: でたらめです。
  event_staranis2_05_s_16:
    speaker: femaleannouncer
    en: According to Yoyo, she did break into the manager's place to hurt her.
    ko: |-
      요요의 진술에 따르면 해코지를 하러 간 건 맞다고 해요.
      매니저의 집에 쳐들어갔죠.
    ja: |-
      情報筋によると、ヨヨは嫌がらせ目的で
      マネージャーの家に押し入ったことを
      自白しています。
  event_staranis2_05_s_17:
    speaker: femaleannouncer
    en: But by then, it was already too late. And she's the one who reported the body.
    ko: |-
      그땐 이미 늦은 상태였고요.
      최초 신고자도 요요예요.
    ja: |-
      ですが、その時にはもう
      マネージャーは亡くなっており、
      彼女が第一発見者として通報したようです。
  event_staranis2_05_s_18:
    speaker: femaleannouncer
    en: She says she just slipped the glasses into her pocket without thinking, but
      that's hardly the point.
    ko: 얼떨결에 안경을 품에 넣었다고는 하는데, 그건 뭐 중요한 건 아니겠죠.
    ja: |-
      動揺して思わず
      眼鏡を自分の胸にしまったそうですが、
      そこは大した問題ではありません。
  event_staranis2_05_s_19:
    speaker: maleannouncer
    en: So why'd she lie to Anis?
    ko: 아니 그럼 왜 아니스한테는 그런 거짓말을 한 거죠?
    ja: |-
      それなら、なぜアニスには
      殺したとウソをついたのでしょうか？
  event_staranis2_05_s_20:
    speaker: femaleannouncer
    en: She wasn't about to go down alone, obviously.
    ko: 자기만 떨어질 수 없다는 거겠죠.
    ja: 悔しかったからではないでしょうか。
  event_staranis2_05_s_21:
    speaker: femaleannouncer
    en: T.T. STAR was set to hit the mainstream right after that show.
    ko: T.T. STAR는 그날 공연 이후 메이저 데뷔가 확정되어 있었어요.
    ja: |-
      事件当日はT.T. STARの
      メジャー入りが
      決まっていた日でもありますから。
  event_staranis2_05_s_22:
    speaker: femaleannouncer
    en: So if she caused a scene right there? Of course, everything would have fallen
      apart.
    ko: |-
      거기서 깽판을 치게 하면?
      당연히 물 건너가게 되는 거죠.
    ja: |-
      もしそこで騒ぎを起こせたら？
      当然、デビューは白紙になりますね。
  event_staranis2_05_s_23:
    speaker: maleannouncer
    en: Wow, that's kinda scary. Do people actually go that far?
    ko: 이야~ 무섭네요. 보통 그렇게까지 하나요?
    ja: |-
      いや～、恐ろしい。
      普通、そこまでやりますか？
  event_staranis2_05_s_24:
    speaker: femaleannouncer
    en: People get scary when they're cornered.
    ko: 궁지에 몰린 사람은 무서운 법이니까요.
    ja: |-
      追い詰められた人は、
      何をするか分からないものです。
  event_staranis2_05_s_25:
    speaker: maleannouncer
    en: So what's next for T.T. STAR?
    ko: 그럼 T.T. STAR는 어떻게 되는 겁니까?
    ja: それで、T.T. STARの今後は？
  event_staranis2_05_s_26:
    speaker: femaleannouncer
    en: A comeback's probably not happening. Given the circumstances, she probably
      won't do any time,
    ko: |-
      복귀는 힘들 거예요.
      아니스의 폭력 사태는 정상 참작되어 실형은 받지 않겠지만.
    ja: |-
      活動継続は厳しいでしょうね。
      刑事事件としては情状酌量の余地が多く
      実刑は免れる見込みとのことですが…
  event_staranis2_05_s_27:
    speaker: femaleannouncer
    en: but her career as a pop star is over.
    ko: 아이돌로서의 생명은 끝났죠.
    ja: |-
      アイドルとしては、
      命を絶たれたと言ってもいいでしょう。
  event_staranis2_05_s_28:
    speaker: femaleannouncer
    en: T.T. STAR will likely disband.
    ko: T.T. STAR도 자연스럽게 해체될 테고요.
    ja: |-
      近いうちにT.T. STARの解散発表が
      あると思います。
  event_staranis2_05_s_29:
    speaker: maleannouncer
    en: And right before their big debut, too. Talk about timing.
    ko: 아아~ 메이저 데뷔를 코 앞에 두고 참 별일이 다 있네요.
    ja: |-
      メジャーデビューを目前に、
      残念なことになってしまいました。
  event_staranis2_05_s_30:
    speaker: maleannouncer
    en: All right, we'll leave it there for this story.
    ko: 자 그럼 이 소식은 여기까지만 다루기로 하고.
    ja: さて、次の話題ですが…
  event_staranis2_05_s_31:
    speaker: maleannouncer
    en: That's because there's actually something even bigger coming up, right?
    ko: 사실 이거보다 더 큰 일이 있죠?
    ja: |-
      これより大きなニュースが
      入っていますね？
  event_staranis2_05_s_32:
    speaker: femaleannouncer
    en: Yes, something major happened at Tetra Line.
    ko: 예. 테트라 라인에 정말 큰 일이 났으니까요.
    ja: はい。テトララインの大スキャンダルです。
  event_staranis2_05_s_33:
    speaker: femaleannouncer
    en: Big enough to shake the entire company.
    ko: 회사가 휘청일 정도로 큰일이 났죠.
    ja: 会社の存続さえ危ぶまれる事態となっています。
  event_staranis2_05_s_34:
    speaker: mustang_past
    en: If you destroy that thing in your hand, I die.
    ko: 네가 손에 든 그걸 없애면 나는 죽는다.
    ja: 手にある薬を始末すれば、俺は死ぬぞ。
  event_staranis2_05_s_35:
    speaker: mustang_past
    en: That'd solve all your problems, wouldn't it?
    ko: 그럼 모든 게 해결되나?
    ja: それで終わりじゃないのか？
  event_staranis2_05_s_36:
    speaker: hanson
    en: No, you and Tetra Line are vital to the Ark.
    ko: 아뇨. 당신과 테트라는 방주에 필요합니다.
    ja: |-
      いいえ。あなたとテトラは
      アークの基盤に食い込んでいる。
  event_staranis2_05_s_37:
    speaker: hanson
    en: If anything were to happen to you, it would collapse.
    ko: 당신이 죽으면 방주는 붕괴하겠죠.
    ja: あなたを失えば、アークも傾きます。
  event_staranis2_05_s_38:
    speaker: mustang_past
    en: And what, exactly, makes you think you can tell me to die?
    ko: 그럼 대체 뭘 믿고 나보고 죽어달라는 거지.
    ja: なら、死ねというのはどういう意味だ。
  event_staranis2_05_s_39:
    speaker: hanson
    en: I'll do it.
    ko: 제가.
    ja: これからは…
  event_staranis2_05_s_40:
    speaker: hanson
    en: I'll become Mustang.
    ko: 머스탱이 되겠습니다.
    ja: 私がマスタングとして生きます。
  event_staranis2_05_s_41:
    speaker: enikk
    en: In summary, you are requesting a change of identity to Tetra Line's CEO, Mustang.
      Is that correct?
    ko: |-
      당신의 말을 요약하자면,
      당신의 신분을 테트라 라인의 CEO로 바꿔 달라는 말씀이십니까?
    ja: |-
      簡潔に要約すると、
      テトララインCEOとしての身分を
      奪取したいということでしょうか？
  event_staranis2_05_s_42:
    speaker: hanson
    en: Yes, that's correct.
    ko: 예. 맞습니다.
    ja: はい。その通りです。
  event_staranis2_05_s_43:
    speaker: enikk
    en: Mustang, CEO of Tetra Line, is currently classified as a systemic malignancy
      within the Ark. However, removal is not feasible.
    ko: |-
      테트라 라인의 CEO 머스탱은 현재 방주의 암적인 존재입니다.
      하지만 처분할 수 없습니다.
    ja: |-
      テトララインの現CEOは、
      アークにとってがん細胞のような存在です。
      しかし、安易に排除することはできません。
  event_staranis2_05_s_44:
    speaker: enikk
    en: Therefore, the current Mustang will be eliminated, and you, his son, will
      assume his identity.
    ko: 현존하는 머스탱을 죽이고, 그의 아들인 당신이 머스탱이 되어.
    ja: |-
      現CEOを抹殺し、
      息子であるあなたがなり替わる。
  event_staranis2_05_s_45:
    speaker: enikk
    en: This action will resolve the malignant condition within the Ark.
    ko: 방주의 암을 치유하겠다는 말씀이시군요.
    ja: |-
      がん細胞の治療法として
      有効かも知れません。
  event_staranis2_05_s_46:
    speaker: hanson
    en: Yes, that's right.
    ko: 그렇습니다.
    ja: そう考えています。
  event_staranis2_05_s_47:
    speaker: enikk
    en: On a computational level, the task is simple. However, the matter does not
      end there.
    ko: |-
      전산상으로는 간단한 일입니다.
      하지만 그것만으로 끝나지는 않는다는 걸 잘 아실 겁니다.
    ja: |-
      データ上は簡単なことです。
      しかし、それだけで済まないということも
      十分に理解の上でしょうか。
  event_staranis2_05_s_48:
    speaker: hanson
    en: I know as much about Tetra Line as Mustang does.
    ko: 저는 테트라 라인의 모든 것을 머스탱만큼 알고 있습니다.
    ja: |-
      私はテトララインのすべてを、
      現CEOと同じぐらい知っています。
  event_staranis2_05_s_49:
    speaker: hanson
    en: No, I know more.
    ko: 아니, 머스탱보다 훨씬 더 많이 알고 있습니다.
    ja: |-
      いや、それ以上に知っていると、
      断言してもいい。
  event_staranis2_05_s_50:
    speaker: enikk
    en: Requesting permission to verify.
    ko: 확인해 봐도 괜찮겠습니까?
    ja: 試験を行っても構いませんか？
  event_staranis2_05_s_51:
    speaker: hanson
    en: Yes, certainly.
    ko: 예. 얼마든지.
    ja: どうぞ、いくらでも。
  event_staranis2_05_s_52:
    speaker: enikk
    en: The questioning will span several days.
    ko: 며칠에 걸친 긴 질문이 될 겁니다.
    ja: 数日間に及ぶ予定になります。
  event_staranis2_05_s_53:
    speaker: hanson
    en: That's fine. Please proceed.
    ko: 괜찮습니다. 하시죠.
    ja: 構いません。お好きなだけ。
  event_staranis2_05_s_54:
    speaker: mustang_past
    en: Ohh, I see now! So that's your play...!
    ko: 오오…! 그래, 그렇게 하겠다는 거군…!
    ja: なるほど…！そうか、そういうことか…！
  event_staranis2_05_s_55:
    speaker: mustang_past
    en: You're going to become Mustang and run Tetra Line yourself?
    ko: 네가 머스탱이 되어, 테트라 라인을 이끌겠다?
    ja: |-
      マスタングに成りすまし、
      テトララインを仕切るということだな？
  event_staranis2_05_s_56:
    speaker: hanson
    en: Yes.
    ko: 예.
    ja: そうです。
  event_staranis2_05_s_57:
    speaker: mustang_past
    en: Right, of course! You know Tetra inside out!
    ko: 그래…! 너라면 테트라에 대한 모든 걸 알고 있지!
    ja: |-
      確かにな…！
      お前はテトラのすべてを知っている！
  event_staranis2_05_s_58:
    speaker: mustang_past
    en: In the Ark, identity manipulation is easy enough...
    ko: 신분 조작 같은 건 방주에선 쉬운 일이야!
    ja: 身分の偽装ぐらい、アークじゃ造作もない！
  event_staranis2_05_s_59:
    speaker: mustang_past
    en: And you're my son, so you even resemble me!
    ko: 내 아들이니 얼굴도 닮았어!
    ja: 顔もまあ、息子だからな！
  event_staranis2_05_s_60:
    speaker: mustang_past
    en: So what, you're going to imitate me, my voice, and my mannerisms?
    ko: 그럼, 네가 내 모습을 흉내 내고, 내 말투를 흉내 내는 건가?
    ja: |-
      すると、あの格好もしゃべりも
      お前がやる気だということか？
  event_staranis2_05_s_61:
    speaker: hanson
    en: That's correct.
    ko: 맞습니다.
    ja: ええ。
  event_staranis2_05_s_62:
    speaker: mustang_past
    en: Haha! You think you can be me?!
    ko: 흐하! 네가! 나를!
    ja: ハハハ…！お前が！俺を！？
  event_staranis2_05_s_63:
    speaker: hanson
    en: It's fortunate that you've already established such a clear persona.
    ko: 캐릭터를 확실히 잡아놓으셔서 다행인 일입니다.
    ja: |-
      作り込まれたキャラクター像ですから、
      難しくないことです。
  event_staranis2_05_s_64:
    speaker: mustang_past
    en: Haha! Of course, no one pulls off a persona like I do!
    ko: 아아…! 그래! 내가 캐릭터 하나는 확실하지!
    ja: |-
      ああ…そうだろう！
      そいつは俺の特技だからな！
  event_staranis2_05_s_65:
    speaker: mustang_past
    en: But there's no way they'll miss the differences, wouldn't you agree?
    ko: 하지만 미묘한 차이를 눈치채지 못 할 리가 없을 텐데?
    ja: だが、微妙な違いで気づかれたらどうする？
  event_staranis2_05_s_66:
    speaker: hanson
    en: We can just pass it off as a new and improved version of you.
    ko: 리뉴얼 머스탱이라고 대충 둘러대면 됩니다.
    ja: |-
      ニュースタイルのマスタングだとでも
      ごまかしておきましょう。
  event_staranis2_05_s_67:
    speaker: mustang_past
    en: Haha! Yes, yes, that's exactly my style! Perfect!
    ko: 하하! 그래 그래! 그것도 [나]답군! 아주 좋아!
    ja: |-
      ハハハ！そうだ！それも「俺」らしい！
      悪くないアイデアだ！
  event_staranis2_05_s_68:
    speaker: mustang_past
    en: So what happens to Hanson, then?
    ko: 그럼, 그럼 한슨은 어떻게 되는 거지?
    ja: それで、ハンソンの方はどうする？
  event_staranis2_05_s_69:
    speaker: mustang_past
    en: If you become Mustang, where does that leave him?
    ko: 네가 머스탱이 된다면, 한슨은.
    ja: |-
      お前がマスタングになったら、
      ハンソンはどうなる。
  event_staranis2_05_s_70:
    speaker: hanson
    en: Hanson will die
    ko: 한슨은 죽습니다.
    ja: ハンソンは死にます。
  event_staranis2_05_s_71:
    speaker: hanson
    en: and cease to exist in this world.
    ko: 이 세상에 없는 사람이 되겠죠.
    ja: この世界のどこからもいなくなるでしょう。
  event_staranis2_05_s_72:
    speaker: mustang_past
    en: So that's it? You're gonna spend the rest of your life as Mustang, and Hanson's
      just gone for good?!
    ko: 평생! 한슨으로 돌아오지 못하고 머스탱으로 살겠다고!?
    ja: |-
      それじゃ一生…二度とハンソンに戻らず、
      マスタングとして生きていく気か！？
  event_staranis2_05_s_73:
    speaker: mustang_past
    en: You really think you can live like that?
    ko: 괜찮은 거냐, 응? 그렇게 살 수 있을 것 같나?
    ja: |-
      いいのか、ええ！？
      そんなことができると思ってるのか！？
  event_staranis2_05_s_74:
    speaker: hanson
    en: I can.
    ko: 저는 할 수 있습니다.
    ja: やります。
  event_staranis2_05_s_75:
    speaker: hanson
    en: I've learned how to wear a mask well enough.
    ko: 가면을 쓰는 방법은 여러 곳에서 많이 배웠습니다.
    ja: |-
      仮面の被り方は、
      今まで学んできましたから。
  event_staranis2_05_s_76:
    speaker: mustang_past
    en: Heh... hahaha!
    ko: 흐, 하하!
    ja: フフ…ハハハ！
  event_staranis2_05_s_77:
    speaker: mustang_past
    en: So what's your move with Tetra, huh?
    ko: 어떻게 할 생각이냐! 테트라를!
    ja: それからどうするつもりだ！？テトラを！
  event_staranis2_05_s_78:
    speaker: mustang_past
    en: You don't pull off something this crazy without a plan!
    ko: 생각이 있으니 이런 죽여주는 일을 생각했을 것 아니냐!
    ja: |-
      そこまで仕込みをしてるなら、
      何か考えがあるんだろう？
  event_staranis2_05_s_79:
    speaker: hanson
    en: I will turn it into a true entertainment company,
    ko: 진정한 엔터테인먼트 회사로 만들 겁니다.
    ja: |-
      テトラは
      真のエンターテイメント企業になります。
  event_staranis2_05_s_80:
    speaker: hanson
    en: because you don't entertain.
    ko: 당신의 엔터테인먼트는 잘못되었으니까요.
    ja: あなたのエンターテイメントは間違っている。
  event_staranis2_05_s_81:
    speaker: hanson
    en: You don't make people smile,
    ko: 당신은 사람들을 웃게 해주지 않아요.
    ja: あなたのやり方は人々を笑顔にしない。
  event_staranis2_05_s_82:
    speaker: hanson
    en: nor do you give them hope.
    ko: 희망을 주지 않아요.
    ja: 希望を与えることもできない。
  event_staranis2_05_s_83:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_84:
    speaker: mustang_past
    en: That's entertainment, you idiot.
    ko: 그게 엔터테인먼트다 멍청한 아들아.
    ja: |-
      エンターテイメントはそういうもんだろう、
      バカ息子が。
  event_staranis2_05_s_85:
    speaker: mustang_past
    en: You can't give anyone joy without a little misery first.
    ko: 남에게 즐거움을 주려면 그만큼의 불행이 있어야 해.
    ja: |-
      誰かが愉快な気分になるには、
      その分誰かの不幸が必要なんだ。
  event_staranis2_05_s_86:
    speaker: hanson
    en: No, I don't think that's the case.
    ko: 아니요. 저는 그렇게 생각하지 않습니다.
    ja: いいえ。私はそうは思いません。
  event_staranis2_05_s_87:
    speaker: hanson
    en: Entertainment is meant to bring joy to everyone. That's what it's all about.
    ko: |-
      엔터테인먼트는 모두에게 즐거움을 줘야 해요.
      그게 엔터테인먼트입니다.
    ja: |-
      すべての人に楽しさを届ける。
      それが本物のエンターテイメントです。
  event_staranis2_05_s_88:
    speaker: mustang_past
    en: You're dreaming.
    ko: 꿈꾸는 소릴 하고 있군.
    ja: 寝言は寝て言うんだな。
  event_staranis2_05_s_89:
    speaker: mustang_past
    en: Look at the Ark. It's nothing but a cesspool.
    ko: |-
      방주를 봐라.
      방주는 쓰레기통이다.
    ja: |-
      アークを見ろ。
      ここはゴミ箱だ。
  event_staranis2_05_s_90:
    speaker: mustang_past
    en: A place full of people who can't be happy unless someone else is miserable.
    ko: 남들의 불행이 없으면 행복해하지 않는 쓰레기들만 있는 곳이다.
    ja: |-
      人の不幸がないと幸せになれない、
      ゴミくずどもばかり溜まってやがる。
  event_staranis2_05_s_91:
    speaker: hanson
    en: There are more good people in the Ark than you think.
    ko: 방주에는 좋은 사람이 훨씬 많습니다.
    ja: 善良な人もいくらでもいます。
  event_staranis2_05_s_92:
    speaker: hanson
    en: It's for them that Pretty became a star.
    ko: 프리티는 그들을 위해 기꺼이 별이 되었고요.
    ja: |-
      プリティーはその人たちのために、
      自分が星になることを選びました。
  event_staranis2_05_s_93:
    speaker: mustang_past
    en: You really think you can pull it off?
    ko: 네가 할 수 있다고 생각하나.
    ja: お前にできるとでも？
  event_staranis2_05_s_94:
    speaker: hanson
    en: I can do it, and I will.
    ko: 할 수 있습니다. 해내고 말 겁니다.
    ja: やり遂げます。必ず。
  event_staranis2_05_s_95:
    speaker: mustang_past
    en: Hmm...
    ko: 흠….
    ja: ふん…
  event_staranis2_05_s_96:
    speaker: mustang_past
    en: That answer doesn't sit well with me.
    ko: 이건 좀 마음에 안 드는 대답이군.
    ja: 気に入らんな。
  event_staranis2_05_s_97:
    speaker: mustang_past
    en: And you think I'd just hand over Mustang to you?
    ko: "[머스탱]을 주긴 좀 힘들겠어."
    ja: そんなことで「マスタング」は譲ってやらん。
  event_staranis2_05_s_98:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_99:
    speaker: "<Narration>"
    en: Hanson steps closer to Mustang.
    ko: 한슨이 머스탱에게 다가간다.
    ja: ハンソンはマスタングに顔を近づけた
  event_staranis2_05_s_100:
    speaker: "<Narration>"
    en: He leans in, his voice dropping to a near whisper.
    ko: 얼굴 옆에서, 속삭이듯 얘기한다.
    ja: そして耳元で、ささやいた
  event_staranis2_05_s_101:
    speaker: hanson
    en: I thought you might not like it.
    ko: 그래요. 이건 마음에 들지 않아 하실 거라 생각했습니다.
    ja: でしょうね。そう言うと思っていました。
  event_staranis2_05_s_102:
    speaker: hanson
    en: But...
    ko: 그런데.
    ja: でも…
  event_staranis2_05_s_103:
    speaker: hanson
    en: don't you find it amusing?
    ko: 재밌지 않습니까?
    ja: 愉快でしょう？
  event_staranis2_05_s_104:
    speaker: mustang_past
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis2_05_s_105:
    speaker: hanson
    en: Your son will inherit your company and spend his life imitating you.
    ko: 당신의 아들이, 평생 당신 흉내를 내며, 당신의 회사를 이어받는다.
    ja: |-
      あなたの息子は、一生あなたの皮を被って、
      あなたの会社を
      引き継がなければならなくなる。
  event_staranis2_05_s_106:
    speaker: hanson
    en: Amusing, isn't it?
    ko: 이거, 재밌지 않습니까?
    ja: どうです、楽しくなってきませんか？
  event_staranis2_05_s_107:
    speaker: hanson
    en: Enough to die for.
    ko: 죽을 만큼.
    ja: 命と引き換えたくなるほど。
  event_staranis2_05_s_108:
    speaker: mustang_past
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis2_05_s_109:
    speaker: "<Narration>"
    en: Mustang snatches the device from Hanson's hand
    ko: 머스탱이 한슨의 손에 들린 기계 장치를 빠르게 낚아챈다.
    ja: |-
      マスタングはハンソンの握っていた薬を
      光のような速さで奪い取った
  event_staranis2_05_s_110:
    speaker: "<Narration>"
    en: and hurls it at the wall. It shatters on impact, spraying liquid everywhere.
    ko: |-
      벽을 향해 집어 던진다.
      부서지며 내부의 액체가 흩날린다.
    ja: |-
      奪われた薬は、壁に叩きつけられ
      入っていた液体をまき散らした
  event_staranis2_05_s_111:
    speaker: mustang_past
    en: Entertainment!
    ko: 엔터테인먼트!!
    ja: エンターテイメントーーッッ！！
  event_staranis2_05_s_112:
    speaker: mustang_past
    en: Fun! This is insanely fun!
    ko: 재밌다! 재밌어!
    ja: 最高…！最高だ…！
  event_staranis2_05_s_113:
    speaker: mustang_past
    en: Absolutely fun!
    ko: 죽여주게 재밌군!
    ja: 死んでもいいほどいい気分だ！！
  event_staranis2_05_s_114:
    speaker: mustang_past
    en: Hah! Go on, try and top this!
    ko: 그래! 어디 한번 해봐라!
    ja: やれ！やってみろ！！
  event_staranis2_05_s_115:
    speaker: mustang_past
    en: That "entertainment brings joy to everyone" nonsense you keep yapping about!
      Let's see you actually pull it off!
    ko: 네가 말한, 모두에게 즐거움만 주는 엔터테인먼트라는 거! 해봐라!
    ja: |-
      お前の言う、すべての人に楽しさを届ける
      エンターテイメントってやつをな！
  event_staranis2_05_s_116:
    speaker: hanson
    en: I will.
    ko: 할 겁니다.
    ja: 言われなくとも。
  event_staranis2_05_s_117:
    speaker: hanson
    en: And when I do, I'll spit on your grave.
    ko: 해내고 난 후. 당신의 무덤에 침을 뱉을 겁니다.
    ja: |-
      やり遂げた後は…
      あなたの墓にツバを吐きにいきます。
  event_staranis2_05_s_118:
    speaker: mustang_past
    en: Haha!
    ko: 하하…!
    ja: アッハハハハハハ…！
  event_staranis2_05_s_119:
    speaker: mustang_past
    en: Just as I thought...!
    ko: 역시…! 너는…!
    ja: やっぱり、お前は…！
  event_staranis2_05_s_120:
    speaker: mustang_past
    en: You really are my son!
    ko: 내 아들이다!!
    ja: 俺の息子だ！！
  event_staranis2_05_s_121:
    speaker: femaleannouncer
    en: Elysion and Missilis have released a large batch of files exposing Tetra Line's
      corruption.
    ko: 엘리시온과 미실리스가 대량의, 그리고 치명적인 테트라 라인의 비리 관련 자료들을 한 번에 공개했어요.
    ja: |-
      テトララインの重大な不正行為に関する
      大量の資料が、エリシオンとミシリスの
      共同チームから公開されました。
  event_staranis2_05_s_122:
    speaker: femaleannouncer
    en: Some of the material is almost unbelievable in its severity.
    ko: |-
      어마어마해요.
      어떻게 이런 일이 있을 수 있나 싶을 정도로 심한 것들도 많았죠.
    ja: |-
      あまりに衝撃的です。
      口に出すのもはばかられるような
      内容の記録も数多くありました。
  event_staranis2_05_s_123:
    speaker: femaleannouncer
    en: It begins with relatively minor issues like unfair contracts, systemic abuse,
      chart manipulation, and hidden funds...
    ko: 불공정 계약, 시스템적 학대, 차트 조작, 자금 은닉 같은 상대적으로 가벼운 것부터 시작해서.
    ja: |-
      比較的軽いと言えるものだけで、
      不公平な契約、組織ぐるみのパワハラ、
      ランキング操作、裏金作り…
  event_staranis2_05_s_124:
    speaker: femaleannouncer
    en: But it quickly escalates to human experimentation, illegal Nikke conversions,
      and even contract killings.
    ko: 인체 실험, 불법 니케화, 청부 살인 같은 것들도 줄줄이 쏟아져나오고 있어요.
    ja: |-
      重大な物では人体実験、違法なニケ化手術、
      殺人委託などの証拠が
      白日のものとなりました。
  event_staranis2_05_s_125:
    speaker: maleannouncer
    en: Huh? Where'd this evil corporation come from all of a sudden?
    ko: 예? 갑자기 악의 기업이 튀어나오네요?
    ja: |-
      ええ？突然悪の総合商社みたいに
      なってしまいましたね？
  event_staranis2_05_s_126:
    speaker: femaleannouncer
    en: They're getting hammered from all sides right now, and their stock's hit rock
      bottom.
    ko: 그래서 지금 여기저기서 두들겨 맞고 있고 주가는 바닥을 치고 있어요.
    ja: |-
      当然猛烈な批判の的となり、
      株価も底値を更新しています。
  event_staranis2_05_s_127:
    speaker: femaleannouncer
    en: Meanwhile, Elysion and Missilis are on the rise. But that's just my take,
      so take it with a grain of salt.
    ko: |-
      반대로, 엘리시온과 미실리스의 주가는 급상승 중이죠.
      이건 뭐 그냥 해본 말이니 흘려들어 주세요.
    ja: |-
      一方でエリシオン社、
      ミシリス社の株価が急上昇を…
      失礼、話題がそれてしまいました。
  event_staranis2_05_s_128:
    speaker: maleannouncer
    en: So where does that leave Tetra Line, then?
    ko: 아니 그럼 테트라 라인은 이제 어떻게 되는 겁니까.
    ja: |-
      では、テトララインはこれから
      どうなってしまうのでしょうか？
  event_staranis2_05_s_129:
    speaker: femaleannouncer
    en: Tetra Line's CEO, Mustang, hasn't issued any kind of response so far.
    ko: 머스탱 CEO는 지금 아무런 대응을 하고 있지 않은 상태예요.
    ja: |-
      マスタングCEOからの声明は、
      現在のところ発表されていません。
  event_staranis2_05_s_130:
    speaker: femaleannouncer
    en: Even for him, this isn't something he can just brush off... Hang on. What's
      this?
    ko: 제아무리 머스탱이라 할지라도 이번 건은 그냥 무시하고 지나갈 수 없을 텐… 잠시만요. 뭐죠?
    ja: |-
      いくらあのマスタングCEOでも、
      この騒ぎを知らん顔はできな…
      はい？何でしょう？
  event_staranis2_05_s_131:
    speaker: maleannouncer
    en: Oh, looks like we've got some breaking news coming in.
    ko: 오, 속보가 들어왔네요.
    ja: 突然ですが、速報のようです。
  event_staranis2_05_s_132:
    speaker: maleannouncer
    en: Let's see...
    ko: 어디….
    ja: 読み上げます…
  event_staranis2_05_s_133:
    speaker: maleannouncer
    en: "... Ah!"
    ko: "…아."
    ja: "…あっ…"
  event_staranis2_05_s_134:
    speaker: maleannouncer
    en: This just in,
    ko: 속보입니다.
    ja: "…お伝えします。"
  event_staranis2_05_s_135:
    speaker: maleannouncer
    en: Hanson, a director at Tetra Line, was found dead this afternoon.
    ko: 테트라 라인에서 이사직을 맡고 있는 한슨이 오늘 오후
    ja: テトラライン社のハンソン理事が、本日午後…
  event_staranis2_05_s_136:
    speaker: maleannouncer
    en: He was discovered in his car.
    ko: 평소 자신이 몰던 차량에서 숨진 채 발견되었다고 합니다.
    ja: |-
      乗用車の中で死亡しているのが
      発見されました。
  event_staranis2_05_s_137:
    speaker: femaleannouncer
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_138:
    speaker: maleannouncer
    en: Well, this is kind of unfortunate timing.
    ko: 아 이게 타이밍이 좀 그렇네요.
    ja: これはまた、なんというタイミングでしょう。
  event_staranis2_05_s_139:
    speaker: femaleannouncer
    en: Looks like they'll pin everything on him.
    ko: 이 모든 일의 주모자가 되겠네요.
    ja: |-
      今回の一連の出来事の
      首謀者ということになりそうですね。
  event_staranis2_05_s_140:
    speaker: maleannouncer
    en: That's a bit risky to say, isn't it?
    ko: "[되겠네]라는 말은 좀 위험하지 않을까요?"
    ja: |-
      「なりそうですね」というのは、
      少し問題のある発言になってしまうのでは？
  event_staranis2_05_s_141:
    speaker: femaleannouncer
    en: I saw that coming, so no surprise there.
    ko: 예상했던 일이라 뭐 조금도 놀랍지 않네요.
    ja: |-
      予想のつくことですし、
      驚くほどのことではありません。
  event_staranis2_05_s_142:
    speaker: femaleannouncer
    en: It's not exactly interesting, so let's move on.
    ko: 재미없으니까 다음 소식으로 넘어가죠.
    ja: それでは、次のニュースです…
  event_staranis2_05_s_143:
    speaker: elysionline0_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_144:
    speaker: missilisline0_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_145:
    speaker: mustang
    en: How intéressant! I never pegged you two for the silent type, non?
    ko: Oh. 이렇게 Silence한 분들인 줄은 몰랐군Yo.
    ja: |-
      Oh。こんなSilentになるとは
      思っていませんでしTA。
  event_staranis2_05_s_146:
    speaker: elysionline0_op_l
    en: What are you trying to pull?
    ko: 뭐 하자는 짓이지.
    ja: どういうつもりだ。
  event_staranis2_05_s_147:
    speaker: missilisline0_op_r
    en: What, is this some kind of joke?
    ko: 뭐야. 지금 장난하는 거야?
    ja: 理解に苦しみます。なんの冗談でしょう？
  event_staranis2_05_s_148:
    speaker: mustang
    en: Do we have a problème, hmm?
    ko: 무슨 Problem이라도 있나Yo?
    ja: 何かProblemがありましたKA？
  event_staranis2_05_s_149:
    speaker: elysionline0_op_l
    en: That's not even the half of it.
    ko: 한두가지가 아니다.
    ja: ないわけがないだろう。
  event_staranis2_05_s_150:
    speaker: elysionline0_op_l
    en: And now you're trying to imitate Mustang, Hanson?
    ko: 머스탱 흉내를 내겠다는 건가. 한슨.
    ja: それはマスタングの真似のつもりか、ハンソン。
  event_staranis2_05_s_151:
    speaker: mustang
    en: Mon dieu! I haven't the faintest idée what you're talking about!
    ko: 무슨 Talk인지 전혀 Understand되지 않는군Yo.
    ja: |-
      何のTalkか、さっぱりUnderstand
      できませんNE。
  event_staranis2_05_s_152:
    speaker: missilisline0_op_r
    en: I'm talking about you. Are you serious right now? What do you think you're
      doing?
    ko: 널 말하는 거야. 장난해? 지금 뭐 하는 거냐고.
    ja: |-
      君自身のことです。
      悪ふざけはもう結構。どういうつもりですか？
  event_staranis2_05_s_153:
    speaker: mustang
    en: Hmm...
    ko: Hm….
    ja: Hm…
  event_staranis2_05_s_154:
    speaker: mustang
    en: Now then, écoute bien... Listen up, oui?
    ko: 잘 Listen 하세 Yo.
    ja: よーくListenしてくだSAI。
  event_staranis2_05_s_155:
    speaker: mustang
    en: Je suis Mustang,
    ko: Me는 머스탱입니Da.
    ja: Meはマスタング。
  event_staranis2_05_s_156:
    speaker: mustang
    en: the one and only CEO of Tetra Line.
    ko: 테트라 라인의 CEO. 머스탱입니Da.
    ja: |-
      テトララインのCEO、
      マスタング以外の誰でもありまSEN。
  event_staranis2_05_s_157:
    speaker: missilisline0_op_r
    en: Look, insisting on it isn't gonna make it happen.
    ko: 그러니까 그걸 그렇게 우긴다고 될 일이 아니라고.
    ja: 言い張れば済むというものではないだろう。
  event_staranis2_05_s_158:
    speaker: mustang
    en: Our dear Hanson, now quitté from this world, told me everything about you
      two, mes amis.
    ko: World를 떠난 한슨에게 두 분에 대한 Story는 모두 전해 들었습니Da.
    ja: |-
      このWorldを去ったハンソンから、
      お二人のStoryはすべて聞いていMASU。
  event_staranis2_05_s_159:
    speaker: mustang
    en: And oui, I know all about the little deal you struck with him.
    ko: 그리고, 그 Deal 내용도 말이Jyo.
    ja: 当然、Dealの内容MO。
  event_staranis2_05_s_160:
    speaker: elysionline0_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_161:
    speaker: mustang
    en: En échange for granting Hanson's wish...
    ko: 두 분께서 한슨의 Wish를 들어주는 대Sin.
    ja: |-
      お二人がハンソンの願いを
      聞き入れる代わりNI…
  event_staranis2_05_s_162:
    speaker: mustang
    en: Tetra Line will withdraw its support from the Second Surface Reclamation War,
      bien sûr.
    ko: 테트라 라인은 Second 지상 탈환전에서 Support로 빠집니Da.
    ja: |-
      テトララインは
      Second地上奪還戦において
      支援のみに徹しまSU。
  event_staranis2_05_s_163:
    speaker: mustang
    en: And all rewards go to Elysion and Missilis. Très généreux, non?
    ko: 모든 Reward는 엘리시온과 미실리스가 독점하게 되겠Jyo.
    ja: |-
      すべてのRewardは、
      エリシオンとミシリスで
      山分けということになるでSHOW。
  event_staranis2_05_s_164:
    speaker: mustang
    en: From this point on, Tetra Line se devote itself entirely to entertainment
      and only entertainment. Rien d'autre.
    ko: |-
      이후에도, 테트라 라인은 Entertainment 사업에만 전념합니Da.
      Only Entertainment.
    ja: |-
      それ以降も、テトララインは
      Entertainment事業のみに専念しまSU。
      Only Entertainment…
  event_staranis2_05_s_165:
    speaker: mustang
    en: We won't so much as glance elsewhere.
    ko: Another에 Eye도 주지 않습니Da.
    ja: 他の事業には手を出しまSEN。
  event_staranis2_05_s_166:
    speaker: mustang
    en: Ohh, so the Ark will become le world of Elysion et Missilis? How délicieux!
    ko: Oh~~ Ark는 엘리시온과 미실리스의 World가 되겠군Yo.
    ja: |-
      Oh～、アークがエリシオンとミシリスの
      ものになってしまいますNE。
  event_staranis2_05_s_167:
    speaker: mustang
    en: A real pity, but a deal is un deal, and it was mon cher Hanson who proposed
      it. So of course, I shall honor it. Jusqu'au bout!
    ko: 아쉽지만, Me가 아꼈던 한슨이 내건 Deal이니 반드시 지킬 수밖에 없겠군Yo.
    ja: |-
      残念ですが、Meの大事なハンソンが遺した
      Dealですから、守るしかありまSEN。
  event_staranis2_05_s_168:
    speaker: missilisline0_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_169:
    speaker: mustang
    en: Is there any problème with the deal?
    ko: Deal 내용에 Wrong 한 점이 있나Yo?
    ja: |-
      Dealの内容はこれで
      間違っていませんでしたNE？
  event_staranis2_05_s_170:
    speaker: elysionline0_op_l
    en: No.
    ko: 없다.
    ja: そうだな。
  event_staranis2_05_s_171:
    speaker: missilisline0_op_r
    en: Sounds good to me. I'll play along.
    ko: 없어. 다 맞아.
    ja: そうですね。全てその通りです。
  event_staranis2_05_s_172:
    speaker: mustang
    en: Ah, parfait! Then I shall pose a question, mes amis.
    ko: 오. 그럼 Question 하겠습니Da.
    ja: |-
      Good…
      では、QuestionタイムDESU。
  event_staranis2_05_s_173:
    speaker: mustang
    en: Tell me, who am I?
    ko: Me가 누구Jyo?
    ja: Meは誰でSHOW？
  event_staranis2_05_s_174:
    speaker: elysionline0_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_175:
    speaker: missilisline0_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_s_176:
    speaker: elysionline0_op_l
    en: Mustang.
    ko: 머스탱이군.
    ja: マスタングだ。
  event_staranis2_05_s_177:
    speaker: missilisline0_op_r
    en: You're Mustang.
    ko: 머스탱이네.
    ja: マスタングですね。
  event_staranis2_05_s_178:
    speaker: mustang
    en: Hahaha! Now that's entertainment!
    ko: HaHaHa. Entertainment--!!
    ja: HaHaHa...Entertainment--!!
  event_staranis2_05_s_179:
    speaker: mustang
    en: Well then, mes amis,
    ko: 그럼, After에Do.
    ja: では、改めTE…
  event_staranis2_05_s_180:
    speaker: mustang
    en: take good care of me from here on, d'accord?
    ko: 이 머스탱을 잘 부탁드립니Da.
    ja: |-
      今後も私、マスタングを
      よろしくお願いしMASU。
event_staranis2_05_e:
  event_staranis2_05_e_1:
    speaker: mrsmiss
    en: "... Hanson?"
    ko: "…한슨…?"
    ja: ハンソン…？
  event_staranis2_05_e_2:
    speaker: mustang
    en: Non, I'm Mustang.
    ko: No. Me는 머스탱입니Da.
    ja: No…マスタングDESU。
  event_staranis2_05_e_3:
    speaker: mrsmiss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_4:
    speaker: mrsmiss
    en: What exactly do you think you're doing?
    ko: 뭐 하는 거니 대체.
    ja: いったい何のつもり。
  event_staranis2_05_e_5:
    speaker: mustang
    en: Mrs. Miss, I require your help. No refusals, oui?
    ko: 미세스 미스. You는 저를 Help해 주셔야 겠습니Da.
    ja: |-
      ミセス・ミス。
      YouのHelpが必要DESU。
  event_staranis2_05_e_6:
    speaker: mrsmiss
    en: Where's Mustang?
    ko: 머스탱은 어디 갔니.
    ja: マスタングはどこ？
  event_staranis2_05_e_7:
    speaker: mustang
    en: Right here! C'est moi, Mustang!
    ko: Here! Me가 머스탱입니Da!
    ja: 見ての通り！MeがマスタングDESU！！
  event_staranis2_05_e_8:
    speaker: mrsmiss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_9:
    speaker: mrsmiss
    en: I don't know what kind of farce this is, but what exactly do you expect me
      to do?
    ko: |-
      무슨 광대놀음인지는 모르겠는데,
      그래서 뭘 도우라는 거니.
    ja: |-
      どういう茶番なのか知りたくもないけど、
      何を手伝わせる気？
  event_staranis2_05_e_10:
    speaker: mrsmiss
    en: I'm in the middle of searching for the next star.
    ko: 나는 지금 다음 별을 찾기 위해….
    ja: 私は今、次の星を探すために…
  event_staranis2_05_e_11:
    speaker: mustang
    en: L'Ark is shrouded in darkness.
    ko: Ark는 어둡습니Da.
    ja: Arkは暗すぎMASU。
  event_staranis2_05_e_12:
    speaker: mustang
    en: No star can be born in a place like this, n'est-ce pas?
    ko: Star가 태어날 수 없Jyo.
    ja: Starが生まれるチャンスもありまSEN。
  event_staranis2_05_e_13:
    speaker: mustang
    en: And make no mistake, Tetra Line bears a grande part of the blame, oui?
