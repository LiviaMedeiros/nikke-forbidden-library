event_staranis1_01_s:
  event_staranis1_01_s_1:
    speaker: "<Narration>"
    en: Step by step, Anis climbs the stairs,
    ko: 아니스가 계단을 오른다.
    ja: アニスは階段を上がっていく
  event_staranis1_01_s_2:
    speaker: "<Narration>"
    en: her heart hammering in her chest.
    ko: 한칸 한칸 올라갈 때마다 심장이 미친 듯이 뛴다.
    ja: 一段ごとに、心臓が強く脈打つ
  event_staranis1_01_s_3:
    speaker: "<Narration>"
    en: She glances back. Her eyes meet Mint's and Prika's.
    ko: |-
      뒤를 돌아본다.
      민트, 프리카와 눈이 마주친다.
    ja: |-
      振り返れば、
      ミント、プリカと目が合った
  event_staranis1_01_s_4:
    speaker: "<Narration>"
    en: Then, she looks even further.
    ko: 좀 더 뒤를 본다.
    ja: さらにその向こうを見た
  event_staranis1_01_s_5:
    speaker: "<Narration>"
    en: Mustang is staring straight at her.
    ko: 머스탱이 자신을 똑바로 쳐다보고 있다.
    ja: マスタングがまっすぐに自分を見ている
  event_staranis1_01_s_6:
    speaker: "<Narration>"
    en: Beyond him,
    ko: 좀 더 뒤를 본다.
    ja: その背中の向こうに…
  event_staranis1_01_s_7:
    speaker: "<Narration>"
    en: she sees the path she's walked.
    ko: 걸어왔던 길이 보인다.
    ja: 歩いてきた道が見えた
  event_staranis1_01_s_8:
    speaker: "<Narration>"
    en: Memories of her time with the Counters, of moving between the surface and
      the Ark, surge forward.
    ko: 카운터스에 소속되어 지상과 방주를 오가며 겪었던 일이 떠오른다.
    ja: |-
      カウンターズの一員として、
      数々のことを地上とアークで経験してきた
  event_staranis1_01_s_9:
    speaker: "<Narration>"
    en: She looks even further back
    ko: 좀 더 뒤를 본다.
    ja: その目がさらに遠くを見る
  event_staranis1_01_s_10:
    speaker: "<Narration>"
    en: and suddenly, her first performance flashes before her.
    ko: 갑자기, 첫 공연이 떠오른다.
    ja: ふいに思い出した、初めてのステージを
  event_staranis1_01_s_11:
    speaker: anis_idol
    en: "... All right."
    ko: "…자."
    ja: "…はい。"
  event_staranis1_01_s_12:
    speaker: anis_idol
    en: Today was our very first stage performance.
    ko: 오늘은 우리의 첫 공연이었어.
    ja: 今日は私たちの初ステージ。
  event_staranis1_01_s_13:
    speaker: anis_idol
    en: The first time we finally got to show what we'd been working on to an audience
      of twenty.
    ko: 스무 명의 관중에게 지금까지 우리가 준비했던 걸 선보일 첫 공연이었지.
    ja: |-
      私たちが練習してきたことを
      20人のお客さんに見せました。
  event_staranis1_01_s_14:
    speaker: anis_idol
    en: We got on stage, sang, danced, and then it was over.
    ko: 우리는 무대에 올라갔고, 춤추면서 노래를 했고, 끝났어.
    ja: ステージに上がって、歌って踊って、おしまい。
  event_staranis1_01_s_15:
    speaker: anis_idol
    en: Well, it's done for now, anyway.
    ko: 응. 어찌 됐든 끝났지.
    ja: うん。とにかく終わったわ。
  event_staranis1_01_s_16:
    speaker: anis_idol
    en: So, what's next?
    ko: 그럼 그 다음엔 뭐겠어?
    ja: じゃあ、その次は何だと思う？
  event_staranis1_01_s_17:
    speaker: anis_idol
    en: Time to share our thoughts on the performance.
    ko: 각자의 그거, 그 뭐야. 감상 같은 걸 교환해야 할 시간이라는 거지.
    ja: |-
      それぞれの、その…感想っていうの？
      交換していきましょ。
  event_staranis1_01_s_18:
    speaker: anis_idol
    en: So, how was it?
    ko: 그래서, 어땠어?
    ja: で、どうだった？
  event_staranis1_01_s_19:
    speaker: mint_o
    en: Hard to get fired up with such a small crowd.
    ko: 관중이 너무 적어서 힘이 안 나던데.
    ja: 見てる人が少なすぎて、力が出なかったわ。
  event_staranis1_01_s_20:
    speaker: prika_o
    en: So that's your excuse for all those mistakes?
    ko: 그래서 실수를 그렇게 많이 했어?
    ja: それであんなにミスしてたのか？
  event_staranis1_01_s_21:
    speaker: mint_o
    en: They probably just thought it was cute.
    ko: 그 정도 실수는 애교로 봐줬을걸?
    ja: あれぐらいは可愛いものでしょ？
  event_staranis1_01_s_22:
    speaker: prika_o
    en: Messing up on your first performance isn't cute. It just makes you look like
      an idiot.
    ko: 첫 공연에서 실수한 건 애교가 아니라 바보 같은 짓이야.
    ja: |-
      初ステージでミスするのは愛嬌じゃなくて
      ただできてないだけだ。
  event_staranis1_01_s_23:
    speaker: mint_o
    en: Hey, you're one to talk! You've messed up plenty yourself.
    ko: 너도 실수했으면서 너무 나한테만 뭐라고 하네.
    ja: |-
      プリカだってミスしてたじゃない、
      私にばっかり言わないでよ。
  event_staranis1_01_s_24:
    speaker: prika_o
    en: Nope, I was perfect.
    ko: 나는 완벽했어.
    ja: いいや、完璧だった。
  event_staranis1_01_s_25:
    speaker: mint_o
    en: Perfect, huh? Now, who was it that shouldered me?
    ko: |-
      완벽한 태클이었지.
      나한테 어깨로 들이받은 게 누구였더라?
    ja: |-
      完璧なタックルだったものね～
      肩で突き飛ばしてきたの、誰だったかしら？
  event_staranis1_01_s_26:
    speaker: prika_o
    en: You couldn't remember the formation and were just standing there like a deer
      in headlights, so I gave you a little nudge.
    ko: 동선도 못 외워서 멍하니 서 있는 누가 안돼 보여서 살짝 밀어준 거야.
    ja: |-
      誰かさんが動線も覚えられずに
      ボーッと突っ立ってるから、
      かわいそうでフォローしてやっただけだ。
  event_staranis1_01_s_27:
    speaker: mint_o
    en: I wasn't just standing there! I was interacting with the fans!
    ko: 멍하니 안 서 있었는데? 팬 서비스하고 있었는데?
    ja: ファンサしてただけですけど？
  event_staranis1_01_s_28:
    speaker: prika_o
    en: Fans? What fans? This is our first performance. We don't have any yet.
    ko: |-
      첫 공연에 무슨 팬 서비스를 한다는 거야.
      아직 우리 팬 없잖아.
    ja: |-
      初ステージで何がファンサだよ。
      ファンなんか、まだ一人もいないだろう。
  event_staranis1_01_s_29:
    speaker: mint_o
    en: Better get a head start.
    ko: 미리미리 해놓는 거지.
    ja: 未来のファンによ。
  event_staranis1_01_s_30:
    speaker: prika_o
    en: Don't make it so obvious that you don't care about the performance. If you
      wanted all the fame for yourself, you should've become a comedian.
    ko: |-
      공연에 관심 없는 거 티 좀 내지 마.
      인기를 원하면 개그우먼이 되지 그랬어?
    ja: |-
      やる気ないの、表に出すなよ。
      注目されたいだけなら、
      バラエティにでも行ったらどうだ？
  event_staranis1_01_s_31:
    speaker: mint_o
    en: If you're going to obsess over every last move, why didn't you just become
      a trainer?
    ko: 그러는 너야말로 그렇게 실력 타령만 할 거면 트레이너를 하지 그랬어?
    ja: |-
      プリカこそ、そんなに技術が大事なら
      トレーナーにでもなったら？
  event_staranis1_01_s_32:
    speaker: anis_idol
    en: Hey, hey, chill out, you guys!
    ko: 자자, 싸우지 말고.
    ja: ほらほら、ケンカしないで。
  event_staranis1_01_s_33:
    speaker: anis_idol
    en: I know everyone was nervous since it's our first performance. But let's not
      go pointing fingers at each other.
    ko: |-
      첫 공연이라서 다들 긴장했던 건 알겠는데,
      이걸 가지고 서로 나무라지는 말자.
    ja: |-
      初めてでみんな緊張してたし、
      お互いを責めるのはやめときましょ。
  event_staranis1_01_s_34:
    speaker: anis_idol
    en: Sure, we messed up a little, but that's nothing we can't fix next time.
    ko: 아쉬운 건 아쉬운 거고, 다음에 더 잘할 생각을 해야지.
    ja: |-
      失敗したならそれはそれで、
      次にどう活かすか考えないと。
  event_staranis1_01_s_35:
    speaker: anis_idol
    en: We're a team, so cut it out with the bickering, okay?
    ko: 같은 멤버끼리 헐뜯고 그러면 어떡해?
    ja: 仲間同士で落としあってどうするの？
  event_staranis1_01_s_36:
    speaker: prika_o
    en: Anis, have you even been practicing? Why was your singing so bad?
    ko: |-
      아니스 너. 노래 연습한 거 맞아?
      노래 왜 그렇게 못 불러.
    ja: |-
      アニスもだ、歌の練習してたのか？
      なんであんなひどい声だったんだ。
  event_staranis1_01_s_37:
    speaker: mint_o
    en: You were smiling so much it looked kind of creepy. I nearly jumped when I
      saw you next to me.
    ko: |-
      너무 웃는 표정으로만 있어서 기괴하던데.
      나 옆에 보고 깜짝 놀랐잖아.
    ja: |-
      貼り付けたみたいな笑顔で不気味だったわ。
      隣で見てビックリしちゃった。
  event_staranis1_01_s_38:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_39:
    speaker: prika_o
    en: You were moving really stiffly, like a marionette.
    ko: |-
      몸 엄청 삐걱거리더라.
      누가 실로 연결해서 조종하는 줄 알았네.
    ja: |-
      体もガチガチだったな。
      糸の付いた操り人形かと思った。
  event_staranis1_01_s_40:
    speaker: mint_o
    en: You were saying hi earlier, right? You weren't flipping them off or anything,
      were you?
    ko: |-
      중간에 인사한 거 맞지?
      손가락으로 욕한 게 아니라.
    ja: |-
      途中のあれも、メンバー紹介だったのよね？
      指さして悪口言ってたわけじゃなくて。
  event_staranis1_01_s_41:
    speaker: prika_o
    en: If you're going to call yourself a leader, act like one.
    ko: |-
      말로만 리더라고 할 게 아니라,
      리더로서 실력을 좀 갖춰주면 좋겠어.
    ja: |-
      肩書きだけじゃなくて、
      リーダーとして実力をつけてほしいところだ。
  event_staranis1_01_s_42:
    speaker: mint_o
    en: If you're unsure about your expression, just stay still. It'll at least show
      you're trying.
    ko: |-
      표정에 자신 없으면 그냥 가만히 있어.
      그편이 열심히 하는걸로는 보일 테니까.
    ja: |-
      表情管理に自信ないなら、
      静かにしてた方がいいわ。
      その方が真剣に見えるから。
  event_staranis1_01_s_43:
    speaker: anis_idol
    en: Y-you little...! I'm trying to be nice, and this is what I get?!
    ko: 이, 이것들이 사람이 좋게 좋게 얘기하니까…!
    ja: |-
      なっ、何よ、二人とも！
      私が優しく言ってるからって…！
  event_staranis1_01_s_44:
    speaker: prika_o
    en: Get some practice in, will you?
    ko: 연습 좀 해 제발.
    ja: 頼むからもっと練習してくれ。
  event_staranis1_01_s_45:
    speaker: mint_o
    en: And try slimming down a bit.
    ko: 살도 좀 빼고.
    ja: 体も少し絞って。
  event_staranis1_01_s_46:
    speaker: anis_idol
    en: Hey! Give credit where it's due, and call out the mistakes if you have to.
    ko: |-
      야! 잘한 게 있으면 잘했다고 해주고!
      아쉬운 게 있으면 아쉽다고 얘기하라고 했지 누가 그렇게 욕만 하래!
    ja: |-
      いいところはほめて、よくないところは
      冷静にアドバイスしてって言ってるでしょ！？
      これじゃほとんど悪口じゃないの！
  event_staranis1_01_s_47:
    speaker: anis_idol
    en: But who told you to just trash everyone? Ever heard of a post-mortem?!
    ko: 포스트 모템 몰라? 포스트 모템!
    ja: 客観的な分析って分かる？客観的！
  event_staranis1_01_s_48:
    speaker: hanson
    en: Are you all back at it again? You're always at each other's throats.
    ko: |-
      또 싸우고 있는 거야?
      하루가 멀다하고 싸우네.
    ja: |-
      また口論か？
      毎日よく飽きないな。
  event_staranis1_01_s_49:
    speaker: anis_idol
    en: We're not! They started it first!
    ko: 싸우는 게 아니라! 얘들이 일방적으로 시비 걸었는데요!
    ja: |-
      口論じゃないです！
      あの二人が一方的に突っかかってきただけ！
  event_staranis1_01_s_50:
    speaker: mint_o
    en: You're done with the talk?
    ko: 얘기는 다 끝났어요?
    ja: 話は終わったんですか？
  event_staranis1_01_s_51:
    speaker: hanson
    en: "... Yeah, all done."
    ko: "…어. 끝났어."
    ja: "…ああ、終わった。"
  event_staranis1_01_s_52:
    speaker: prika_o
    en: So? What's the result?
    ko: 결과는요?
    ja: 結果は？
  event_staranis1_01_s_53:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_54:
    speaker: hanson
    en: Why don't we talk on the way back to the office?
    ko: 일단, 사무실에 가면서 얘기하자.
    ja: とりあえず、事務所に戻ってから話そう。
  event_staranis1_01_s_55:
    speaker: "<Narration>"
    en: Hanson's car glides along the empty road, its engine a quiet hum.
    ko: 한슨의 차가 부드럽게 한적한 도로를 달린다.
    ja: ハンソンの車が静かに車道を進んでいる
  event_staranis1_01_s_56:
    speaker: anis_idol
    en: There's not a single car out today. Feels like there have been fewer and fewer
      cars lately.
    ko: |-
      차가 한 대도 없네요.
      요즘따라 차가 영 안 보이더니 오늘은 한대도 없네.
    ja: |-
      車が全然ないですね…
      最近やけに少ないなぁって思ってたけど、
      今日は1台もないわ。
  event_staranis1_01_s_57:
    speaker: hanson
    en: The Central Government has banned private car use.
    ko: 중앙 정부 쪽에서 개인 차량 운행을 금지했으니까.
    ja: |-
      中央政府が個人車両の
      新規登録を許可しなくなったからな。
  event_staranis1_01_s_58:
    speaker: hanson
    en: Cars registered before the ban are fine, but registering a new one is practically
      impossible unless you're very high up.
    ko: |-
      예전에 등록되어 있던 것들은 괜찮은데,
      이제 신규 등록은 저 어딘가에 높으신 분들 말고는 못 해.
    ja: |-
      すでに登録済みのものはまだ使えるが、
      今後はそうとうな地位の人間でなければ
      車に乗れなくなっていくだろう。
  event_staranis1_01_s_59:
    speaker: anis_idol
    en: So you're a big shot, huh?
    ko: 그럼 사장님은 저 어딘가에 높으신 분인가요?
    ja: |-
      じゃ、社長もお偉いさんに
      入ってるってことですか？
  event_staranis1_01_s_60:
    speaker: hanson
    en: No way, this car was registered a long time ago.
    ko: |-
      그럴 리가.
      예전에 등록되어 있던 차야.
    ja: |-
      そんなわけないだろう。
      これは登録済みの車だ。
  event_staranis1_01_s_61:
    speaker: hanson
    en: Since registration is tied to the vehicle itself, cars registered today are
      going for astronomical prices.
    ko: |-
      차량 기준으로 등록되는 거라,
      지금 등록되어 있는 차 모두가 가격이 천정부지로 솟았지.
    ja: |-
      今ある車しか使えなくなったから、
      中古車の市場で天井知らずの
      値上がりが始まっている。
  event_staranis1_01_s_62:
    speaker: anis_idol
    en: So, how much would this go for now?
    ko: 그럼 이 차 지금 팔면 얼만데요?
    ja: もしこの車を売ったら、いくらぐらいに？
  event_staranis1_01_s_63:
    speaker: hanson
    en: Hmm, I've never really thought about selling it, but it's probably worth more
      than ten times what it originally sold for.
    ko: 글쎄. 안 팔거라 생각은 안 해봤지만, 아마 10배 이상은 오르지 않았을까.
    ja: |-
      そうだな…売ることは考えていないが、
      10倍以上にはなりそうな勢いだ。
  event_staranis1_01_s_64:
    speaker: mint_o
    en: Oh my, then if we sold this, we could get a new office, right?
    ko: 세상에. 그럼 이거 팔면 새 사무실 구할 수 있는 것 아니에요?
    ja: |-
      あら。この車を売ったら、
      ピッカピカの事務所が
      買えるんじゃないですか？
  event_staranis1_01_s_65:
    speaker: hanson
    en: I don't think so. At best, it'd cover some renovations.
    ko: 그렇게까진 안 돼. 인테리어 정도면 모를까.
    ja: |-
      そこまでは無理だな。
      せいぜいインテリアを良くできるぐらいだ。
  event_staranis1_01_s_66:
    speaker: prika_o
    en: Then sell it.
    ko: 팔죠 그럼.
    ja: 売ったら？
  event_staranis1_01_s_67:
    speaker: hanson
    en: No.
    ko: 안 돼.
    ja: ダメだ。
  event_staranis1_01_s_68:
    speaker: prika_o
    en: Then how about selling just one tire? That way, we'd at least be able to fix
      the showers.
    ko: 그럼 타이어라도 하나 팔아서 샤워실이라도 어떻게 좀 안될까요?
    ja: |-
      ならタイヤ一つ売るだけでもいいから、
      シャワー室だけでもなんとかしてくれないか？
  event_staranis1_01_s_69:
    speaker: anis_idol
    en: Yeah, the water's dripping like pour-over coffee.
    ko: 맞아 맞아. 물이 무슨 드립 커피처럼 나온다니까요.
    ja: |-
      そうそう。
      コーヒーのドリップかってぐらいに
      お湯が出ないの。
  event_staranis1_01_s_70:
    speaker: hanson
    en: No, this belonged to my mother.
    ko: 안 돼. 이거 어머니 유품이거든.
    ja: 悪いが、この車は母の形見なんだ。
  event_staranis1_01_s_71:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_72:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_73:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_74:
    speaker: hanson
    en: Well, that got awkward fast.
    ko: 엇. 갑자기 분위기가 이상해졌네.
    ja: ん？急に妙な空気になったな。
  event_staranis1_01_s_75:
    speaker: anis_idol
    en: Um... sorry.
    ko: 그… 죄송해요.
    ja: ええと…すみません。
  event_staranis1_01_s_76:
    speaker: hanson
    en: No, no, I didn't mean to make it awkward. That's on me.
    ko: 아냐아냐. 그럴 의도는 없었는데 내가 미안해.
    ja: |-
      いや、そんなつもりじゃなかった。
      こちらこそすまない。
  event_staranis1_01_s_77:
    speaker: hanson
    en: But there's an even bigger reason I'm not selling this car.
    ko: 그 이유도 있지만, 차를 안 파는 더 큰 이유가 있어.
    ja: |-
      とにかく、それも売れないワケのひとつだが、
      もっと大事な理由がある。
  event_staranis1_01_s_78:
    speaker: hanson
    en: When you all arrive at a venue and step out of a ride like this,
    ko: 내 아이돌들이 공연장에 딱 도착했는데.
    ja: |-
      うちのアイドルが
      どこか大きな会場に登場するという時…
  event_staranis1_01_s_79:
    speaker: hanson
    en: that's a picture-perfect moment.
    ko: 이런 차에서 슥슥 내리면 그림 나오잖아?
    ja: こういう車から降りてきたら、格好いいだろう？
  event_staranis1_01_s_80:
    speaker: anis_idol
    en: Fair enough.
    ko: 뭐… 그렇긴 하죠.
    ja: まあ…確かに、そうかも。
  event_staranis1_01_s_81:
    speaker: hanson
    en: So... how do you feel about your first performance?
    ko: "…그래서. 오늘 첫 공연을 한 소감들이 어때?"
    ja: "…それで、初ステージの感想は？"
  event_staranis1_01_s_82:
    speaker: anis_idol
    en: You saw it, didn't you?
    ko: 봐서 아시잖아요.
    ja: 見たら分かりません？
  event_staranis1_01_s_83:
    speaker: hanson
    en: I think it was good.
    ko: 좋던데?
    ja: うまくできたか？
  event_staranis1_01_s_84:
    speaker: anis_idol
    en: Good, my ass. It was full of mistakes, the audience hardly reacted...
    ko: 좋기는 무슨. 실수투성이에, 관객들 호응도 좀 많이 별로였고….
    ja: |-
      まさか。ミスは多いし、
      お客さんも静かだったし…
  event_staranis1_01_s_85:
    speaker: anis_idol
    en: and we ended up fighting afterward.
    ko: "…끝나고 싸우기나 하고."
    ja: "…終わってからは、言い争いだし。"
  event_staranis1_01_s_86:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_87:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_88:
    speaker: anis_idol
    en: So... what'd they say?
    ko: |-
      …그으래서…
      어떻게 됐어요?
    ja: "…それで…どうなったんですか？"
  event_staranis1_01_s_89:
    speaker: anis_idol
    en: Did we get a regular slot?
    ko: 정기 공연하게 해준대요?
    ja: 定期的な出演は、させてもらえるんですか？
  event_staranis1_01_s_90:
    speaker: hanson
    en: Hmm... No,
    ko: 음… 아니.
    ja: うーん…いや。
  event_staranis1_01_s_91:
    speaker: hanson
    en: they turned us down.
    ko: 거절당했어.
    ja: 断られたよ。
  event_staranis1_01_s_92:
    speaker: mint_o
    en: "... Can I ask why?"
    ko: "…왜요?"
    ja: "…どうしてですか？"
  event_staranis1_01_s_93:
    speaker: prika_o
    en: What do you mean "why"? 'Cause our performance sucked, duh.
    ko: 왜긴 왜야. 공연이 형편없었으니까 그렇지.
    ja: どうしてって、出来が悪かったからだろう。
  event_staranis1_01_s_94:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_95:
    speaker: hanson
    en: No, I wouldn't say it's bad.
    ko: 아냐. 공연은 나쁘지 않았어.
    ja: いや、パフォーマンスは悪くなかった。
  event_staranis1_01_s_96:
    speaker: anis_idol
    en: But you didn't say it's good, either.
    ko: 좋았다고는 얘기 안 하시네요.
    ja: よかった、じゃないんですね。
  event_staranis1_01_s_97:
    speaker: hanson
    en: It wasn't that bad.
    ko: 형편없지는 않았어.
    ja: 質の問題じゃない。
  event_staranis1_01_s_98:
    speaker: anis_idol
    en: Wow, thanks for the heartfelt pep talk...
    ko: 참된 위로의 말씀 감사합니다.
    ja: できる限りの励まし、ありがと～ございます。
  event_staranis1_01_s_99:
    speaker: hanson
    en: They said you lack uniqueness.
    ko: 유니크함이 없대.
    ja: 個性を感じられない、だそうだ。
  event_staranis1_01_s_100:
    speaker: anis_idol
    en: Uniqueness...
    ko: "…유니크함."
    ja: "…個性。"
  event_staranis1_01_s_101:
    speaker: hanson
    en: Everything you've done is just covers of Pretty's songs.
    ko: 곡과 안무 모두 프리티의 커버니까.
    ja: 曲もダンスも、プリティーのカバーだからな。
  event_staranis1_01_s_102:
    speaker: hanson
    en: And as you know, right now...
    ko: 그리고 너희도 알겠지만 지금은….
    ja: それに、君たちも分かってると思うが、今は…
  event_staranis1_01_s_103:
    speaker: mint_o
    en: We're in a fiercely competitive era for pop stars
    ko: 춘추 아이돌 시대라고 봐도 무방하죠.
    ja: アイドル戦国時代、ですよね。
  event_staranis1_01_s_104:
    speaker: mint_o
    en: since almost all of them are just copying Pretty.
    ko: 그리고 대부분의 아이돌이 프리티를 흉내 내고 있고.
    ja: |-
      おまけに、そのほとんどが
      プリティーのマネばかり。
  event_staranis1_01_s_105:
    speaker: hanson
    en: "... That's right."
    ko: "…그래."
    ja: "…その通りだ。"
  event_staranis1_01_s_106:
    speaker: "<Narration>"
    en: Hanson gazes at the old, worn buildings outside the window.
    ko: 한슨은 창문 너머 낡은 빌딩을 바라본다.
    ja: ハンソンは窓の向こうの古いビルに目をやった
  event_staranis1_01_s_107:
    speaker: "<Narration>"
    en: A weather-beaten banner with Pretty's face catches his attention.
    ko: 프리티의 얼굴이 그려져 있는 낡은 플래카드를 본다.
    ja: |-
      プリティーの顔が描かれた
      古いプラカードが見える
  event_staranis1_01_s_108:
    speaker: hanson
    en: Pretty was a shock to the Ark in more ways than one.
    ko: 프리티는 여러 가지 의미로 방주에 충격적인 존재였어.
    ja: 彼女は様々な意味で、アークを動かした。
  event_staranis1_01_s_109:
    speaker: hanson
    en: A star like that doesn't come around often.
    ko: 그만한 스타는 다시 나오기 힘들겠지.
    ja: あれほどのスターはもう二度と出ないだろうな。
  event_staranis1_01_s_110:
    speaker: hanson
    en: "... After Pretty was gone, many people became Nikkes"
    ko: "…프리티가 없어진 후, 많은 사람들이 스스로 니케가 됐어."
    ja: |-
      …プリティーの後を追って、
      多くの人がニケになりたがるほどになった。
  event_staranis1_01_s_111:
    speaker: hanson
    en: under Tetra, dreaming of stardom,
    ko: 테트라 소속의 니케가 되어, 스타를 꿈꿔.
    ja: テトラ所属の、スターになる夢を見てな。
  event_staranis1_01_s_112:
    speaker: hanson
    en: dreaming of becoming the next Pretty.
    ko: 포스트 프리티를 꿈꿔.
    ja: そして次代のプリティーを目指すあまり…
  event_staranis1_01_s_113:
    speaker: hanson
    en: Their songs, their dances, even their personas were modeled after Pretty.
    ko: 노래, 춤, 캐릭터성까지 프리티를 꿈꾸지.
    ja: |-
      歌やダンス、キャラクターにいたるまで、
      彼女を模倣する者ばかりになった。
  event_staranis1_01_s_114:
    speaker: hanson
    en: That's what they mean when they say we're not unique.
    ko: 그래서야. 우리한테 유니크함이 없다는 게.
    ja: |-
      それが問題ということだ。
      我々もそういう目で見られている。
  event_staranis1_01_s_115:
    speaker: anis_idol
    en: So we're just another bunch of Pretty-wannabes?
    ko: 프리티를 흉내 내는 차고 넘치는 아이돌 중 하나니까?
    ja: |-
      プリティーのマネをしてる、
      どこでも見るようなアイドルだから？
  event_staranis1_01_s_116:
    speaker: hanson
    en: Yeah.
    ko: 응.
    ja: ああ。
  event_staranis1_01_s_117:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_118:
    speaker: hanson
    en: There are just too many.
    ko: 너무 많아.
    ja: 増えすぎたんだ。
  event_staranis1_01_s_119:
    speaker: hanson
    en: Tetra handled the Nikke conversions, but it can't manage all the Nikkes.
    ko: |-
      니케화는 테트라에서 진행했지만,
      테트라에서 그 모든 니케를 관리할 수 없어.
    ja: |-
      ニケ化自体は今でもテトラがしているが、
      その後の管理が追い付かなくなった。
  event_staranis1_01_s_120:
    speaker: hanson
    en: More precisely, it's risky for a single company to control so many Nikkes.
    ko: 정확히는, 한 회사가 너무 많은 니케를 보유하는 것은 여러모로 위험해.
    ja: |-
      一社が大量のニケを
      保有しているという事実も危険視された。
  event_staranis1_01_s_121:
    speaker: hanson
    en: To keep this in check, any Nikke aiming to become a celebrity is placed under
      the Central Government's supervision.
    ko: 이걸 견제하기 위해 아이돌이나 연예인을 지망하는 니케는 모두 중앙 정부 소속이 됐지.
    ja: |-
      その状況をけん制するために、
      アイドルや芸能人志望のニケは全て、
      中央政府の所属として扱われるようになった。
  event_staranis1_01_s_122:
    speaker: hanson
    en: They're free to act as they wish, but must follow orders if the government
      issues one.
    ko: 자유롭게 행동하되, 중앙 정부에서 명령을 내리면 따라야 하는 조건이 붙었고.
    ja: |-
      一定の行動の自由が許される代わり、
      中央政府からの命令には
      絶対に従うという条件つきでな。
  event_staranis1_01_s_123:
    speaker: hanson
    en: Only the truly exceptional are directly managed by Tetra.
    ko: 그 중, 특출난 재능이나 성과가 있는 경우 테트라가 데려가 직접 관리하는 기형적인 형태가 됐어.
    ja: |-
      その中で、突出した才能や実績の認められた
      ニケだけが、テトラに拾い上げられるという
      奇妙なシステムができた。
  event_staranis1_01_s_124:
    speaker: hanson
    en: As a result, offices have sprung up everywhere, brimming with hopeful Nikkes
      chasing their dreams.
    ko: 덕분에 지금은 발에 챌 정도로 많은 사무실과 아이돌 지망 니케들이 생겨나게 된거고.
    ja: |-
      結果として、アイドルの事務所や
      アイドル志望のニケが
      掃いて捨てるほど現れた。
  event_staranis1_01_s_125:
    speaker: hanson
    en: As much as I hate to admit it, we're just one of those countless small offices.
    ko: 부정하고 싶지만, 우리도 그 발에 챌 만큼 많은 사무실 중 하나일 뿐이야.
    ja: |-
      認めたくはないが、
      私たちもそこに埋もれているとしか言えない。
  event_staranis1_01_s_126:
    speaker: anis_idol
    en: If we want to survive among all these Pretty-wannabes,
    ko: 그럼 그 차고 넘치는 가짜 프리티들 사이에서 살아남으려면.
    ja: |-
      じゃ、プリティーもどきの
      山の中で生き残るには…
  event_staranis1_01_s_127:
    speaker: anis_idol
    en: we've got no choice but to go all-in on originality.
    ko: 역시 오리지널리티로 승부를 보는 수밖에 없겠네요.
    ja: オリジナリティが必要ってことですね。
  event_staranis1_01_s_128:
    speaker: hanson
    en: Many pop stars have thought the same thing.
    ko: 그렇게 생각한 아이돌들도 엄청 많지.
    ja: 業界では誰もが、そう考えた。
  event_staranis1_01_s_129:
    speaker: hanson
    en: Naturally, the competition to recruit famous composers and songwriters is
      intense,
    ko: 자연스럽게 유명 작곡가, 작사가를 포섭하기 위한 경쟁이 치열하고.
    ja: |-
      名の知れた作曲家や作詞家の争奪戦が
      激しくなっている。
  event_staranis1_01_s_130:
    speaker: hanson
    en: and we're not in any position to take part in it.
    ko: 우리는, 그 경쟁에 낄 수 있는 상황이 아니야.
    ja: |-
      しかし、今の私たちは
      それに参加できる状況ではない。
  event_staranis1_01_s_131:
    speaker: anis_idol
    en: "'Cause we're broke?"
    ko: 돈 없어서요?
    ja: お金がないから？
  event_staranis1_01_s_132:
    speaker: hanson
    en: What are you talking about? It's not just money. We hardly have any name recognition
      either.
    ko: |-
      무슨 소리야.
      돈만 없는 줄 알아? 지명도도 엄청 낮아.
    ja: |-
      甘いな。
      金だけだと思うか？知名度だって足りない。
  event_staranis1_01_s_133:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_s_134:
    speaker: anis_idol
    en: Um...
    ko: "…그."
    ja: "…じゃあ…"
  event_staranis1_01_s_135:
    speaker: anis_idol
    en: Maybe you should let us go?
    ko: 저희를 이만 보내주는 게 어떨까요?
    ja: そろそろ私たちを解放してもらえません？
  event_staranis1_01_s_136:
    speaker: hanson
    en: No, not happening.
    ko: 에이. 안돼.
    ja: いいや、そうはいかない。
  event_staranis1_01_s_137:
    speaker: anis_idol
    en: We've got no money, no connections.
    ko: 아니. 사무실에 돈도 없어, 인맥도 없어.
    ja: だって、お金も人脈もないんでしょ。
  event_staranis1_01_s_138:
    speaker: anis_idol
    en: Aren't you ashamed of letting talent like ours rot in this dump of an office?
    ko: 이 열악한 사무실에 우리 같은 인재들을 썩히고 있는 게 미안하지도 않아요?
    ja: |-
      そんな弱小事務所で
      私たちを飼い殺しにしてるなんて、
      申し訳ないと思わないんですか？
  event_staranis1_01_s_139:
    speaker: hanson
    en: Not at all. I'm completely fine.
    ko: 안 미안해. 끄떡없어.
    ja: 思わないね。まったく平気だ。
  event_staranis1_01_s_140:
    speaker: anis_idol
    en: Well, we're not!
    ko: 아니 우리가 끄떡없지 않다고요~
    ja: 私たちが平気じゃないんですけど～
  event_staranis1_01_s_141:
    speaker: mint_o
    en: Ah... so our first performance ended up being a complete flop.
    ko: 아~ 그러면 우리 첫 공연은 허탕으로 끝난 거네요.
    ja: |-
      あ～あ…じゃあ私たちの初ステージは
      無駄骨だったってことですね。
  event_staranis1_01_s_142:
    speaker: prika_o
    en: Hopefully, that's the only time.
    ko: 한 번으로 끝나면 다행일 텐데.
    ja: これっきりにして欲しいところだ。
  event_staranis1_01_s_143:
    speaker: mint_o
    en: Let's hurry and grab something to eat. I'm starving.
    ko: |-
      빨리 가서 밥이나 먹죠.
      배고파 죽겠어요.
    ja: |-
      早く戻ってご飯にしましょ？
      お腹がペコペコです。
  event_staranis1_01_s_144:
    speaker: prika_o
    en: Step on it.
    ko: 밟아요 밟아.
    ja: ほら、アクセル踏んで。
  event_staranis1_01_s_145:
    speaker: hanson
    en: All right, all right. Since that didn't work out, let's go get some food.
    ko: |-
      그래그래.
      허탕 치느라 고생했으니 밥이나 먹자.
    ja: |-
      そうしよう。
      無駄骨を折るのに苦労したからな。
event_staranis1_01_e:
  event_staranis1_01_e_1:
    speaker: anis_idol
    en: Ugh, it's so stuffy here...
    ko: 으아 답답해.
    ja: うっ、息が詰まりそう…
  event_staranis1_01_e_2:
    speaker: mint_o
    en: Oh no, I forgot to leave the windows open before leaving.
    ko: 아. 창문 열어놓고 나가는 거 깜빡했다.
    ja: あっ、窓を開けておくの忘れてた。
  event_staranis1_01_e_3:
    speaker: prika_o
    en: The showers are going to be a sauna.
    ko: 샤워실 찜통이겠네.
    ja: シャワー室、サウナになってるだろうな。
  event_staranis1_01_e_4:
    speaker: anis_idol
    en: Where'd everyone go?
    ko: 다들 어디 갔대요?
    ja: みんなはどこ？
  event_staranis1_01_e_5:
    speaker: hanson
    en: Out running errands for work.
    ko: 영업 뛰러 갔지 뭐.
    ja: 営業だろう。
  event_staranis1_01_e_6:
    speaker: hanson
    en: There's food in the fridge. Help yourself.
    ko: 냉장고에 도시락 있으니까 꺼내 먹어.
    ja: 冷蔵庫に弁当があるから、食べてくれ。
  event_staranis1_01_e_7:
    speaker: hanson
    en: I've got to head back out.
    ko: 난 바로 나가봐야 해.
    ja: 私はまたすぐに出る。
  event_staranis1_01_e_8:
    speaker: anis_idol
    en: Huh? Where to?
    ko: 응? 어디 가는데요?
    ja: え？どこに行くんですか？
  event_staranis1_01_e_9:
    speaker: hanson
    en: Oh, just heading back to work.
    ko: 나도 영업 뛰러 가야지.
    ja: 私も仕事を取ってこないといけないからな。
  event_staranis1_01_e_10:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_11:
    speaker: anis_idol
    en: Maybe we should come along too?
    ko: 그, 아무리 생각해도 저희도 같이 가는 게 낫지 않아요?
    ja: |-
      あの…やっぱり私たちも
      一緒に回った方がいいんじゃないですか？
  event_staranis1_01_e_12:
    speaker: mint_o
    en: Exactly, putting ourselves out there a bit more could make a difference.
    ko: 맞아요. 얼굴 보여주면서 어필하면 좀 더 잘 먹히지 않을까요?
    ja: |-
      そうね。直接アピールすれば
      反応だって変わるかもしれませんよ？
  event_staranis1_01_e_13:
    speaker: prika_o
    en: Yeah, I agree. We're not the world's greatest or anything.
    ko: |-
      저도 그렇게 생각해요.
      우리가 뭐 거물도 아니고.
    ja: |-
      同感。
      まだそんな大物じゃないしな。
  event_staranis1_01_e_14:
    speaker: hanson
    en: Absolutely not.
    ko: 안돼.
    ja: ダメだ。
  event_staranis1_01_e_15:
    speaker: anis_idol
    en: Geez, you've always been way too protective of us...
    ko: |-
      아니 왜요.
      예전부터 느낀 건데 우릴 너무 아끼시네.
    ja: |-
      なんでですか？
      前から思ってましたけど、
      出し惜しみしてる感じっていうのか…
  event_staranis1_01_e_16:
    speaker: hanson
    en: I told you on the way here, didn't I? There are so many pop stars dreaming
      of becoming the next Pretty that we're in what you might call a fiercely competitive
      era.
    ko: |-
      오면서 말했지?
      포스트 프리티를 꿈꾸는 아이돌이 너무 많아서 춘추 아이돌 시대라고.
    ja: |-
      言っただろう？
      ポスト・プリティーを夢見る
      アイドルが多すぎて、今は競争が激しい。
  event_staranis1_01_e_17:
    speaker: hanson
    en: To secure a regular gig, land an advertising deal, or even appear in a single
      scene of a TV show,
    ko: 그러니 이 중에서 고정 공연을 따내기 위해, 광고를 받기 위해, 드라마에 한 컷이라도 나오기 위해.
    ja: |-
      定期的なステージ出演のため、
      広告の仕事を得るため、
      ドラマにワンシーンでも映るため…
  event_staranis1_01_e_18:
    speaker: hanson
    en: you can imagine how much maneuvering goes on behind the scenes.
    ko: 자기를 어필하기 위해 얼마나 많은 로비가 오가겠어.
    ja: |-
      その程度のことにどれだけ激しい
      売り込み合戦が繰り広げられていると思う？
  event_staranis1_01_e_19:
    speaker: hanson
    en: There are countless ways to promote yourself,
    ko: 그 로비의 종류도 다양해.
    ja: 売り込み方にはいろいろある。
  event_staranis1_01_e_20:
    speaker: hanson
    en: but the kinds that sponsors actually prefer aren't that many.
    ko: 하지만 스폰서들이 원하는 로비의 종류는 그리 다양하지 않아.
    ja: |-
      だが、スポンサーを
      その気にさせられる方法は限られる。
  event_staranis1_01_e_21:
    speaker: hanson
    en: I don't need to spell out which ones, do I?
    ko: 그 종류 중 하나를 굳이 내 입으로 얘기해야 할 필요는 없겠지?
    ja: |-
      その限られたことの中に、
      どういうものが入っているかは
      言わなくても想像がつくだろう？
  event_staranis1_01_e_22:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_23:
    speaker: hanson
    en: That's why I protect you all.
    ko: 그래서 아끼는 거야.
    ja: それが理由だ。
  event_staranis1_01_e_24:
    speaker: hanson
    en: Get famous, and then we'll be the ones calling the shots. Until then, just
      hang in there.
    ko: |-
      유명해지고, 잘나가면 우리가 갑질할 수 있어.
      그때까지 힘들어도 조금만 참자.
    ja: |-
      有名になって人気さえ出れば、
      私たちも強気に出られる。
      それまでの辛抱だ。
  event_staranis1_01_e_25:
    speaker: hanson
    en: Now, eat and get some rest. I'll be back soon.
    ko: |-
      그럼 밥들 먹고 쉬고 있어.
      금방 갔다 올게.
    ja: |-
      さあ、ご飯を食べてゆっくり休んでくれ。
      すぐに戻る。
  event_staranis1_01_e_26:
    speaker: "<Narration>"
    en: Hanson leaves the office.
    ko: 한슨은 사무실을 나섰다.
    ja: ハンソンが事務所を出た
  event_staranis1_01_e_27:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_28:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_29:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_30:
    speaker: anis_idol
    en: All right, let's eat first. Prika, you're gonna shower first, right?
    ko: |-
      일단 밥부터 먹자.
      프리카는 먼저 씻을 거지?
    ja: |-
      とりあえず、食事にしましょ。
      プリカは先にシャワーでしょ？
  event_staranis1_01_e_31:
    speaker: anis_idol
    en: Mint, you're going to change.
    ko: 민트는 옷부터 갈아입을 거고.
    ja: で、ミントは先に着替え。
  event_staranis1_01_e_32:
    speaker: anis_idol
    en: I'll heat up the food while you two do that.
    ko: 그럼 그동안 대충 데워놓을게.
    ja: その間に温めておくから。
  event_staranis1_01_e_33:
    speaker: "<Narration>"
    en: That evening,
    ko: 그날 저녁.
    ja: その日の夕方
  event_staranis1_01_e_34:
    speaker: "<Narration>"
    en: in the cramped practice room with one wall entirely of mirrors, Anis moves
      through her choreography.
    ko: 한 면이 거울로 되어 있는 좁은 연습실에서 아니스가 연습하고 있다.
    ja: |-
      壁の一面が鏡になった狭いトレーニングルームで
      アニスが練習をしている
  event_staranis1_01_e_35:
    speaker: "<Narration>"
    en: Hours have already passed, but she barely notices.
    ko: 벌써 몇 시간 째 연습인지 모른다.
    ja: もう何時間そうしているか分からない
  event_staranis1_01_e_36:
    speaker: "<Narration>"
    en: She watches herself in the mirror, going over every step and expression again
      and again.
    ko: 아니스는 거울을 바라보며 안무, 표정을 계속해서 연습한다.
    ja: |-
      アニスは鏡に映る、自分のダンスと表情を
      ひたすらに見直し続けた
  event_staranis1_01_e_37:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_38:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_39:
    speaker: "<Narration>"
    en: Through the tiny window in the practice room door, Mint and Prika watch Anis
      practice.
    ko: 민트와 프리카는 연습실 문에 난 창문을 통해 아니스의 연습을 계속 지켜본다.
    ja: |-
      ミントとプリカが
      トレーニングルームのドアの小窓から、
      アニスの様子をうかがっていた
  event_staranis1_01_e_40:
    speaker: mint
    en: I wish today had gone a little better since it was our first performance.
    ko: 오늘 좀 아쉽다. 그래도 첫 공연이었는데.
    ja: |-
      今日はちょっとショックよね。
      せっかくの初ステージだったのに。
  event_staranis1_01_e_41:
    speaker: prika
    en: The sound was off, and the stage setup left a lot to be desired, but what
      disappointed me most was our performance.
    ko: |-
      음향도 스테이지 세팅도 아쉬웠지만,
      제일 아쉬운 건 우리 퍼포먼스였지.
    ja: |-
      音響もセットも今一つだったけど、
      一番ダメだったのは
      私たちのパフォーマンスだ。
  event_staranis1_01_e_42:
    speaker: prika
    en: Honestly, it was terrible.
    ko: 솔직히 형편없었어.
    ja: 正直、思い出したくもない。
  event_staranis1_01_e_43:
    speaker: mint
    en: Hey, don't be so harsh. We'll do better next time.
    ko: |-
      에이. 너무 그러지 마.
      다음에 잘하면 되잖아.
    ja: |-
      もう、あんまり悪く言わないの。
      また次、頑張ればいいじゃない。
  event_staranis1_01_e_44:
    speaker: prika
    en: When's the next one, then?
    ko: 다음에 언제?
    ja: 次って、いつだ？
  event_staranis1_01_e_45:
    speaker: mint
    en: Hmm... maybe as early as tonight? Who knows, Boss might have something for
      us?
    ko: |-
      음… 빠르면 오늘 저녁쯤?
      사장님이 뭐라도 하나 물어오지 않을까?
    ja: |-
      うーん…早ければ今日の夕方？
      社長が何か取ってきてくれるんじゃない？
  event_staranis1_01_e_46:
    speaker: prika
    en: "... Like he said, pop stars are everywhere these days. Unless it's a total
      hole-in-the-wall, venues are giving regular gigs to them."
    ko: "…아이돌이 흘러넘쳐서 구멍가게 수준만 아니면 모두 아이돌에게 고정 공연을 주고 있어."
    ja: |-
      …世の中アイドル志望だらけで、
      よっぽどの小さい店でもなきゃ、
      とっくに誰かのスポンサーになってる。
  event_staranis1_01_e_47:
    speaker: prika
    en: The place we went today? Honestly, it was just a tiny general store,
    ko: 오늘 우리가 간 곳도 솔직히 크다고 할 수 없는 생활용품 가게였고.
    ja: |-
      今日行ったところだって、
      大きいとは言えない日用品の店だっただろう。
  event_staranis1_01_e_48:
    speaker: prika
    en: and we couldn't even land a regular gig there. Do you really think there's
      gonna be a next time for us?
    ko: 그런 곳에서도 고정 공연을 따내지 못하는데, 우리한테 다음이 있을까?
    ja: |-
      そんな店でも弾かれた私たちに、
      次なんてあるか？
  event_staranis1_01_e_49:
    speaker: mint
    en: "... Fair enough."
    ko: 그건 그래.
    ja: それはそうね。
  event_staranis1_01_e_50:
    speaker: prika
    en: Mint,
    ko: 민트.
    ja: ミント。
  event_staranis1_01_e_51:
    speaker: prika
    en: it's been nearly a year since our debut,
    ko: 우리 벌써 데뷔한 지 1년이 다 되어가.
    ja: 私たち、もうすぐデビューして1年だ。
  event_staranis1_01_e_52:
    speaker: prika
    en: and look at where we are now.
    ko: 그 결과가 이거고.
    ja: それで、今こうしてる。
  event_staranis1_01_e_53:
    speaker: mint
    en: Yeah...
    ko: 그렇네.
    ja: そうね。
  event_staranis1_01_e_54:
    speaker: mint
    en: Boss used to be a director at Tetra and was even Pretty's manager.
    ko: 사장님은 테트라 이사 출신에, 프리티의 매니저였다고 했는데.
    ja: |-
      社長はもともとテトラの理事で、
      プリティーのマネージャーだったって
      聞いてるけど…
  event_staranis1_01_e_55:
    speaker: mint
    en: But honestly, it's not as impressive as it sounds.
    ko: 생각보다 그렇게 막 뭐가 있진 않네.
    ja: 思ったほど特別って感じもしないわ。
  event_staranis1_01_e_56:
    speaker: mint
    en: There are fewer than ten people in the office,
    ko: 사무실 인원도 10명이 채 안 되고.
    ja: |-
      事務所のスタッフだって
      指で数えられるぐらいの数だし。
  event_staranis1_01_e_57:
    speaker: mint
    en: and it's not like we're some kind of miracle workers who can save this place
      overnight.
    ko: 그렇다고 우리가 진짜 무지막지한 스타성을 타고 나서, 어려운 사무실을 한 번에 구원해 줄 수 있는 것도 아니고.
    ja: |-
      そういう私たちも、小さい事務所を
      一発で有名にできるほどの
      スターの素質はないし。
  event_staranis1_01_e_58:
    speaker: mint
    en: If I'm being honest... the future doesn't exactly look bright.
    ko: 솔직히 미래가 있다고 보기엔 좀… 힘들지.
    ja: |-
      正直、未来があるかって言ったら…
      厳しいわよね。
  event_staranis1_01_e_59:
    speaker: prika
    en: So what do we do?
    ko: 어떡할 거야?
    ja: 何か考えてるのか？
  event_staranis1_01_e_60:
    speaker: mint
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_staranis1_01_e_61:
    speaker: "<Narration>"
    en: From the other side of the glass, Mint watches Anis practice.
    ko: 민트는 창문 너머, 연습하고 있는 아니스를 바라본다.
    ja: |-
      ミントは小窓の向こうで練習を続ける
      アニスを見つめた
  event_staranis1_01_e_62:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_63:
    speaker: mint
    en: Prika,
    ko: 프리카.
    ja: プリカ。
  event_staranis1_01_e_64:
    speaker: mint
    en: I got scouted.
    ko: 나 스카우트 제의 받았어.
    ja: 私、スカウトされたの。
  event_staranis1_01_e_65:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_66:
    speaker: mint
    en: It's not a huge place, but it's definitely better than here.
    ko: 대단한 곳은 아닌데, 여기보단 훨씬 낫지.
    ja: |-
      大手ってほどじゃないけど、
      ここよりはずっと大きいところ。
  event_staranis1_01_e_67:
    speaker: mint
    en: They've got around five regular shows running at the moment.
    ko: 고정 공연도 지금 다섯 개인가 굴리고 있대.
    ja: |-
      定期的なライブも5ヶ所でやってて、
      ローテーションしてるって言ってたわ。
  event_staranis1_01_e_68:
    speaker: mint
    en: The boss seems capable, well-connected and knows exactly how to develop pop
      stars.
    ko: |-
      사장이 능력이 좋나 봐.
      여기저기 발도 넓고, 아이돌을 어떻게 키워야 하는 줄도 알고.
    ja: |-
      社長の腕がいいみたい。
      顔も広いし、アイドルの育て方も
      よく分かってる。
  event_staranis1_01_e_69:
    speaker: mint
    en: If I joined, I'd be coming in as a new member. They even mentioned the center
      position, though I doubt they really mean it.
    ko: |-
      내가 들어가면, 새로운 멤버로 들어가게 되는 거래.
      센터도 염두에 두고 있다더라. 거짓말이겠지만.
    ja: |-
      私を新メンバーのセンターにすることも
      考えてるって言われたわ。
      ま、そこは信じない方が良さそうだけど。
  event_staranis1_01_e_70:
    speaker: prika
    en: Are you going to accept it?
    ko: 갈 거야?
    ja: 行くのか？
  event_staranis1_01_e_71:
    speaker: mint
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_staranis1_01_e_72:
    speaker: prika
    en: I mean... there's really no reason not to.
    ko: "…하긴, 안 갈 이유가 없겠네."
    ja: "…まあ、行かない理由はないか。"
  event_staranis1_01_e_73:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_74:
    speaker: mint
    en: No reason not to...
    ko: 안 갈 이유라….
    ja: 行かない理由ね…
  event_staranis1_01_e_75:
    speaker: "<Narration>"
    en: Mint peers through the window at Anis again.
    ko: 민트가 다시 창문 너머의 아니스를 바라본다.
    ja: ミントは再び、窓の向こうのアニスを見た
  event_staranis1_01_e_76:
    speaker: "<Narration>"
    en: She's on the floor, gasping for breath.
    ko: 아니스는 바닥에 앉아 거친 숨을 몰아쉬고 있다.
    ja: アニスは床に座り、荒く息をついている
  event_staranis1_01_e_77:
    speaker: mint
    en: She's the reason.
    ko: 쟤 때문에.
    ja: これ、かな。
  event_staranis1_01_e_78:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_79:
    speaker: mint
    en: Look at her. She messed up her debut performance, drank a can of soda, and
      immediately holed herself up in the practice room.
    ko: 쟤 봐. 오늘 첫 공연을 망치고 왔는데, 탄산수 한 캔 딱 마시더니 바로 연습실에 틀어박혔어.
    ja: |-
      見て。初ステージで失敗したばっかりなのに、
      炭酸水を飲んだだけで、
      すぐトレーニングルームに閉じこもってるの。
  event_staranis1_01_e_80:
    speaker: mint
    en: Remember when we first met her?
    ko: 처음에 쟤랑 만났을 때 기억나?
    ja: 初めて会った時のこと、覚えてる？
  event_staranis1_01_e_81:
    speaker: mint
    en: She knew nothing. She was terrible.
    ko: 진짜 아무것도 모르는 애였어. 형편없었고.
    ja: |-
      本当に何も知らなかったでしょ。
      呆れちゃうくらい。
  event_staranis1_01_e_82:
    speaker: mint
    en: And now, after all these years, just look at her.
    ko: 근데 몇 년 만에 저렇게까지 하잖아.
    ja: でも、あっという間に成長した。
  event_staranis1_01_e_83:
    speaker: prika
    en: She's got talent.
    ko: 재능 있지.
    ja: 素質がある。
  event_staranis1_01_e_84:
    speaker: mint
    en: It's not just talent.
    ko: 재능만의 얘기는 아니야.
    ja: それだけじゃないわ。
  event_staranis1_01_e_85:
    speaker: mint
    en: She works ridiculously hard. Like, stupidly hard.
    ko: 너무 열심히 해. 바보 같을 정도로.
    ja: |-
      一生懸命でしょ。
      バカみたいにひたむきで。
  event_staranis1_01_e_86:
    speaker: mint
    en: And all the while, she plays the leader perfectly—looking out for us, pushing
      us when we're running on empty, and never, not once, missing a practice.
    ko: 꼴에 리더랍시고 우리 챙겨주고, 힘에 부칠 땐 힘도 불어넣어 주고, 그 와중에 연습은 진짜 하루도 안 빼먹고.
    ja: |-
      リーダーだからって私たちに気を配って、
      落ち込んだ時は支えてくれて、
      練習は1日だって休まない。
  event_staranis1_01_e_87:
    speaker: mint
    en: Haha, I really don't get it. Why does she put in so much effort? It's crazy.
    ko: 하하. 정말. 왜 저렇게 열심히 하는 거야? 이상해.
    ja: |-
      ふふっ…ほんと、どうしてあんなに
      真剣になれるのかしら？面白いわよね。
  event_staranis1_01_e_88:
    speaker: mint
    en: Too crazy. I don't even know what to say...
    ko: |-
      너무 이상해.
      그래서 뭐라고 해야 하나….
    ja: |-
      気になるの。
      だから、なんていうか…
  event_staranis1_01_e_89:
    speaker: prika
    en: You're rooting for her?
    ko: 응원하고 싶어?
    ja: 応援したいのか？
  event_staranis1_01_e_90:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_91:
    speaker: mint
    en: Yeah,
    ko: 응.
    ja: うん。
  event_staranis1_01_e_92:
    speaker: mint
    en: I want to see her shine.
    ko: 쟤가 반짝반짝 빛나는 걸 보고 싶어.
    ja: 私は、輝いてるアニスが見たい。
  event_staranis1_01_e_93:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_94:
    speaker: mint
    en: So, Prika, why don't you just go somewhere else?
    ko: 그래서, 프리카야 말로 왜 다른데 안 가?
    ja: |-
      そういうプリカこそ、
      どうして他の事務所に行かないの？
  event_staranis1_01_e_95:
    speaker: mint
    en: Honestly, you've got the best skills, even if your whole image is a bit all
      over the place.
    ko: |-
      솔직히 실력은 제일 좋잖아.
      캐릭터성은 좀 애매하지만.
    ja: |-
      あなたの実力ならどこでも行けるでしょ。
      アイドルとしてはちょっと不愛想だけど。
  event_staranis1_01_e_96:
    speaker: prika
    en: "... Sorry if it came out vague."
    ko: 애매해서 미안하네.
    ja: 無愛想で悪かったな。
  event_staranis1_01_e_97:
    speaker: mint
    en: Anis and I both died at Pretty's comeback concert, so at least we're connected
      somehow.
    ko: 나랑 아니스야 프리티 복귀 콘서트 때 한날한시에 죽어서 어떻게든 엮인 계기라도 있는데.
    ja: |-
      私とアニスはプリティーの復帰コンサートで
      巻き込まれたって縁もあるけど…
  event_staranis1_01_e_98:
    speaker: mint
    en: But you? You were supposed to debut as a human from the start.
    ko: |-
      프리카는 안 그렇잖아?
      원래도 사람으로 데뷔할 예정이었고.
    ja: |-
      プリカはそうじゃないでしょ？
      人間の時からデビュー予定があったんだもの。
  event_staranis1_01_e_99:
    speaker: prika
    en: Mhm... but everything got canceled when I ended up dying in a traffic accident.
    ko: 뭐… 교통사고로 죽어버려서 다 무산됐지만.
    ja: ま…交通事故で台無しになったけどな。
  event_staranis1_01_e_100:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_101:
    speaker: prika
    en: Honestly, what really drew me in was Boss since he used to be a Tetra director
      and Pretty's manager.
    ko: 솔직히 말하면 사장님이 테트라 이사 출신에, 프리티의 매니저 출신이었다는 게 제일 컸어.
    ja: |-
      正直に言うと、テトラの理事出身で
      プリティーのマネージャーだったっていう
      社長の経歴が一番大きかった。
  event_staranis1_01_e_102:
    speaker: prika
    en: I figured I could make it with him since I was confident in my skills.
    ko: |-
      제대로 키워줄 수 있을 것 같았거든.
      실력에는 자신 있었고.
    ja: |-
      ちゃんと育ててくれると思ってたんだ。
      自分の実力には自信あったから。
  event_staranis1_01_e_103:
    speaker: prika
    en: But... well, look where that got me.
    ko: 그런데 뭐 보다시피.
    ja: それが結局、見てのとおりだ。
  event_staranis1_01_e_104:
    speaker: mint
    en: Looks like you got scammed, huh?
    ko: 사기당했네?
    ja: だまされたってこと？
  event_staranis1_01_e_105:
    speaker: prika
    en: "... Yeah, kind of."
    ko: 뭐어… 반쯤은 그렇다고 봐야겠네.
    ja: どうかな…半分はそうとも言えるか。
  event_staranis1_01_e_106:
    speaker: prika
    en: I was gonna quit anyway, but then I ran into you two.
    ko: 당장 그만두려 했는데, 너희를 만났어.
    ja: |-
      すぐ辞めようと思ってたところで、
      お前らに会った。
  event_staranis1_01_e_107:
    speaker: prika
    en: One's clueless as hell, and the other just coasts on her looks.
    ko: |-
      한 명은 아무것도 모르지,
      한 명은 얼굴만 믿고 열심히 안 하지.
    ja: |-
      一人は本当に何も知らないし、
      一人は見た目に甘えて手を抜いてるし…
  event_staranis1_01_e_108:
    speaker: prika
    en: Somehow, I ended up stuck practicing with both of you.
    ko: 어쩌다 보니 둘의 연습을 봐주고 있었는데.
    ja: |-
      気づいた時には、
      二人の練習を見るようになってた。
  event_staranis1_01_e_109:
    speaker: "<Narration>"
    en: Prika looks through the window at Anis, who's already on her feet and training
      hard again.
    ko: |-
      프리카가 창문 너머 아니스를 바라본다.
      아니스는 일어나 다시 연습에 열중하고 있다.
    ja: |-
      プリカが窓越しのアニスに目をやった。
      アニスは立ち上がり、練習を再開していた
  event_staranis1_01_e_110:
    speaker: prika
    en: Man, Anis is seriously working hard. She just keeps improving.
    ko: |-
      음… 아니스는 진짜 열심히 하더라.
      실력도 쭉쭉 늘고.
    ja: |-
      アニスは…本当に努力してるよ。
      スキルもどんどん身に着けてるしな。
  event_staranis1_01_e_111:
    speaker: mint
    en: What about me?
    ko: 나는?
    ja: 私は？
  event_staranis1_01_e_112:
    speaker: prika
    en: Same as always...
    ko: 그렇지 뭐.
    ja: まあ、普通だ。
  event_staranis1_01_e_113:
    speaker: mint
    en: Aw, come on.
    ko: 섭섭해라.
    ja: えー。ショック。
  event_staranis1_01_e_114:
    speaker: prika
    en: After spending all that time together...
    ko: 그렇게 같이 부대끼면서 시간을 보내다 보니까.
    ja: そうやって一緒にいろいろやってるうちに…
  event_staranis1_01_e_115:
    speaker: prika
    en: Um...
    ko: 음….
    ja: うーん…
  event_staranis1_01_e_116:
    speaker: prika
    en: I guess I got attached.
    ko: 정이 들어버렸어.
    ja: 情が移ったってヤツだろうな。
  event_staranis1_01_e_117:
    speaker: prika
    en: So yeah, that's why I can't leave.
    ko: 그래서 못 나가.
    ja: だから、よそには行かない。
  event_staranis1_01_e_118:
    speaker: mint
    en: Haha, you really walked right into the worst one, huh?
    ko: 하하. 제일 질 나쁜 거에 걸렸네?
    ja: |-
      アハハ、いちばん厄介な網に
      引っかかっちゃったわね。
  event_staranis1_01_e_119:
    speaker: prika
    en: I know, right?
    ko: 그런 셈이지.
    ja: そういうことだ。
  event_staranis1_01_e_120:
    speaker: "<Narration>"
    en: Both of them peer through the window at Anis again.
    ko: 둘은 다시 창문 너머의 아니스를 본다.
    ja: 2人の視線が、アニスに戻った
  event_staranis1_01_e_121:
    speaker: "<Narration>"
    en: She looks annoyed as if something isn't going right.
    ko: 뭐가 잘 안 풀리는지 화를 내고 있다.
    ja: |-
      何かが上手くいかないのか、
      いらだっている様子だ
  event_staranis1_01_e_122:
    speaker: prika
    en: "*Sigh...* She's doing it wrong again."
    ko: 어휴 저걸 저렇게 하니까.
    ja: はあ…あれじゃ上手くいかないだろ。
  event_staranis1_01_e_123:
    speaker: mint
    en: You going in?
    ko: 갈까?
    ja: 行きましょっか？
  event_staranis1_01_e_124:
    speaker: prika
    en: Yeah,
    ko: 그래.
    ja: ああ。
  event_staranis1_01_e_125:
    speaker: prika
    en: all we can do is give it our all.
    ko: 지금 할 수 있는 건 열심히 하는 것밖에 없으니까.
    ja: |-
      今できるのは、一生懸命
      頑張ることだけだからな。
  event_staranis1_01_e_126:
    speaker: "<Narration>"
    en: Prika opens the door.
    ko: 프리카가 문을 연다.
    ja: プリカがドアを開いた
  event_staranis1_01_e_127:
    speaker: anis_human
    en: Wh-what?
    ko: 뭐, 뭐야?
    ja: えっ、何？
  event_staranis1_01_e_128:
    speaker: prika
    en: You're trying to do a three-person routine on your own. Of course, it's not
      working.
    ko: 셋이서 해야 할 걸 혼자서 하니까 제대로 될 리가 있나.
    ja: |-
      3人で踊るものを1人でやったって、
      うまくいくわけないだろう？
  event_staranis1_01_e_129:
    speaker: prika
    en: Come on, let's do it together. I'll walk you through it.
    ko: 같이 하자. 봐줄게.
    ja: 一緒にやろう。見てやるよ。
  event_staranis1_01_e_130:
    speaker: anis_human
    en: "... Oh, thanks."
    ko: "…어. 부탁해."
    ja: "…うん。お願い。"
  event_staranis1_01_e_131:
    speaker: mint
    en: I'll take a look too. If you want to improve, start working on your expressions
      during practice.
    ko: |-
      나도 봐줄게.
      연습할 때 표정도 미리미리 지어놔야 늘어.
    ja: |-
      私も見てあげる。
      練習の時に表情まで決めておけば、
      本番で固まらないでしょ。
  event_staranis1_01_e_132:
    speaker: anis_human
    en: "... Yeah, appreciate it."
    ko: "…그래. 그것도 부탁할게."
    ja: "…うん。それもお願い。"
  event_staranis1_01_e_133:
    speaker: hanson
    en: I'm back.
    ko: 다녀왔어.
    ja: 戻ったぞ。
  event_staranis1_01_e_134:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_135:
    speaker: hanson
    en: Huh? Where'd everyone go?
    ko: "…뭐야. 다 어디 갔어?"
    ja: "…ん？みんなどこに行ったんだ？"
  event_staranis1_01_e_136:
    speaker: "<Narration>"
    en: A faint light glows in one corner of the dim office, catching Hanson's attention.
    ko: 한슨은 어둑어둑한 사무실 한구석에 불빛이 나오고 있는 것을 본다.
    ja: |-
      ハンソンは薄暗い事務所の片隅から
      明かりが漏れていることに気づいた
  event_staranis1_01_e_137:
    speaker: "<Narration>"
    en: He walks over quietly and peers through the practice room window.
    ko: 조용히 다가가 연습실의 창문 너머를 본다.
    ja: |-
      静かに近づいて、
      小窓からトレーニングルームをのぞいた
  event_staranis1_01_e_138:
    speaker: "<Narration>"
    en: Inside, the three of them are completely absorbed in practice.
    ko: 연습에 열중하고 있는 셋을 본다.
    ja: 夢中で練習している3人の姿が見えた
  event_staranis1_01_e_139:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_01_e_140:
    speaker: "<Narration>"
    en: Hanson watches them for a long moment, transfixed.
    ko: 한슨은 그 모습을 한참 동안 넋을 놓고 바라보았다.
    ja: |-
      ハンソンはその様子をしばらくの間
      とりつかれたように眺めていた
event_staranis1_02_s:
  event_staranis1_02_s_1:
    speaker: anis_human
    en: Already?
    ko: 벌써요?
    ja: もう着いたんですか？
  event_staranis1_02_s_2:
    speaker: hanson
    en: Yeah, I managed to secure one.
    ko: 응. 따왔어.
    ja: ああ。ここだ。
  event_staranis1_02_s_3:
    speaker: anis_human
    en: Ooh, where?
    ko: 어디, 어딘데요?
    ja: ここって、どこ？
  event_staranis1_02_s_4:
    speaker: hanson
    en: It's called Meet & Meat. They sell Nutrium and serve dishes made with it.
    ko: 미트 미트라고. 배양육도 팔고, 요리도 파는 곳이야.
    ja: |-
      ミートミート。
      培養肉の専門店だ。
  event_staranis1_02_s_5:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_6:
    speaker: anis_human
    en: A meat place?
    ko: 고깃집?
    ja: お肉屋さん？
  event_staranis1_02_s_7:
    speaker: hanson
    en: Yeah, it is.
    ko: 응. 고깃집.
    ja: ああ。その通りだ。
  event_staranis1_02_s_8:
    speaker: hanson
    en: You know how all those Nutrium spots have been opening lately? This one just
      launched, and they don't have the budget for proper promotion, so the timing
      lined up perfectly.
    ko: |-
      요즘 배양육 집 많이 생기고 있잖아.
      여기도 신장개업인데, 홍보비가 없다고 해서 마침 잘 맞아떨어졌지.
    ja: |-
      最近、培養肉の店が増えてきているだろう？
      ここもその一つで、プロモーション費用を
      抑えたいという利害が一致した。
  event_staranis1_02_s_9:
    speaker: hanson
    en: Two shows a day starting tomorrow, and we'll be doing it for a week.
    ko: |-
      내일부터 하루 두 타임.
      일주일 동안 하면 돼.
    ja: |-
      明日から1日2回、
      1週間の契約だ。
  event_staranis1_02_s_10:
    speaker: prika
    en: Uh... why a meat place, though...?
    ko: 어… 그런데 왜 하필 고깃집을….
    ja: でも…なんで肉屋なんだ…？
  event_staranis1_02_s_11:
    speaker: hanson
    en: You'll see.
    ko: 가보면 알아.
    ja: 行けば分かる。
  event_staranis1_02_s_12:
    speaker: mint
    en: Before anything else, what's the pay like?
    ko: 그전에, 페이는 어떻게 돼요?
    ja: その前に、ギャラはどうなってるんですか？
  event_staranis1_02_s_13:
    speaker: hanson
    en: Pay? As in money?
    ko: 페이? 돈?
    ja: ギャラ？金か？
  event_staranis1_02_s_14:
    speaker: mint
    en: Yes.
    ko: 예.
    ja: はい。
  event_staranis1_02_s_15:
    speaker: hanson
    en: Don't be too surprised.
    ko: 듣고 놀라지 마.
    ja: 聞いて驚くなよ。
  event_staranis1_02_s_16:
    speaker: hanson
    en: They'll be providing their signature Nutrium set meals twice a day.
    ko: |-
      하루 두 번 식사 제공이야.
      배양육 정식. 시그니처 메뉴.
    ja: |-
      1日2回の食事が出る。
      培養肉定食、ここの看板メニューだ。
  event_staranis1_02_s_17:
    speaker: anis_human
    en: "... Oh, I'm surprised, all right. Just not for the reason you think."
    ko: 아니, 다른 의미로 놀랐는데요.
    ja: いや、別の意味で驚かされたんですけど。
  event_staranis1_02_s_18:
    speaker: mint
    en: Who said anything about wanting free food?
    ko: 아니, 누가 공짜 밥 먹고 싶다고 했어요?
    ja: あの、食事の話なんて聞いてませんでしたよね？
  event_staranis1_02_s_19:
    speaker: prika
    en: Yeah, but still...
    ko: 아니, 그래도 그렇지.
    ja: いや、いくら何でもそれは…
  event_staranis1_02_s_20:
    speaker: hanson
    en: You three have such great chemistry at times like this.
    ko: 셋 다 이럴 땐 호흡이 되게 잘 맞는구나.
    ja: 3人とも、こういう時は息が合うんだな。
  event_staranis1_02_s_21:
    speaker: hanson
    en: What we need right now is exposure,
    ko: 지금 우리한테 필요한 건 인지도야.
    ja: 今の私たちは、とにかく知名度が必要だ。
  event_staranis1_02_s_22:
    speaker: hanson
    en: so we can't afford to be picky.
    ko: 찬밥 더운밥 가릴 때가 아니라는 얘기지.
    ja: |-
      ごちそうだろうと、冷や飯だろうと、
      食らいつくしかない。
  event_staranis1_02_s_23:
    speaker: anis_human
    en: Hey, it's not like we're asking for a feast, but we'd jump at the chance to
      eat meat and rice.
    ko: 찬밥도 아니고 더운밥도 아니고 고기랑 밥이잖아요.
    ja: |-
      ごちそうか冷や飯かっていうより、
      肉とご飯に飛びついたことになりますね。
  event_staranis1_02_s_24:
    speaker: hanson
    en: All right, all right, save your complaints until after you've given the performance
      your best.
    ko: 자자. 불평불만은 일단 공연부터 제대로 하고 난 다음에 해.
    ja: |-
      まあ、まあ。不満は後で聞くから、
      まずはパフォーマンスをやり遂げてくれ。
  event_staranis1_02_s_25:
    speaker: hanson
    en: The barbecue place owner—no, sorry, the Meet & Meat owner—might even offer
      you a regular gig if you impress her.
    ko: 고깃집 사장님, 아니아니. 미트 미트 사장님 눈에 들면 고정 공연도 할 수 있으니까.
    ja: |-
      肉屋の店主…いや、ミートミートの社長の
      お眼鏡にかなえば、長期契約も夢じゃないぞ。
  event_staranis1_02_s_26:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_27:
    speaker: hanson
    en: Is... something wrong? Do you not like it?
    ko: "…왜. 그렇게 마음에 안 들어?"
    ja: "…どうした？そこまで不満だったか？"
  event_staranis1_02_s_28:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_29:
    speaker: anis_human
    en: No way!
    ko: 아뇨!
    ja: ぜんぜん！
  event_staranis1_02_s_30:
    speaker: anis_human
    en: You went through all that trouble to get this for us.
    ko: 사장님이 열심히 뛰어서 따온 거잖아요.
    ja: |-
      社長が必死に駆け回って
      つかんできてくれたチャンスだから。
  event_staranis1_02_s_31:
    speaker: anis_human
    en: We've got no right to complain.
    ko: 우리가 불평불만 할 순 없죠.
    ja: 不満なんて言ってる場合じゃないでしょ。
  event_staranis1_02_s_32:
    speaker: mint
    en: "... She really is something else."
    ko: "…정말."
    ja: "…まったく。"
  event_staranis1_02_s_33:
    speaker: prika
    en: See? That's exactly why I can't quit.
    ko: 내가 이래서 못 그만둔다고.
    ja: これだからやめられないんだ。
  event_staranis1_02_s_34:
    speaker: hanson
    en: All right, then. Let's do this!
    ko: 좋아! 가자!
    ja: よし！行こう！
  event_staranis1_02_s_35:
    speaker: "<Narration>"
    en: In front of the Nutrium shop, Meet & Meat.
    ko: 배양육 상점, 미트 미트 앞.
    ja: 培養肉店、ミートミート正面
  event_staranis1_02_s_36:
    speaker: "<Narration>"
    en: Murmurs ripple through the crowd.
    ko: 웅성웅성.
    ja: ガヤガヤ…
  event_staranis1_02_s_37:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_38:
    speaker: "<Narration>"
    en: Anis lowers her head, studying the stage beneath her feet.
    ko: 아니스는 고개를 숙여 자신이 올라서 있는 무대의 바닥을 바라본다.
    ja: |-
      アニスは一礼をし、
      自分が立っているステージの床を見た
  event_staranis1_02_s_39:
    speaker: "<Narration>"
    en: She shifts her weight slightly to the right.
    ko: 오른쪽으로 체중을 살짝 실어본다.
    ja: 右半身に軽く体重をかける
  event_staranis1_02_s_40:
    speaker: "<Narration>"
    en: The wood answers with a slow, protesting creak.
    ko: 끼이익-
    ja: ギシッ…
  event_staranis1_02_s_41:
    speaker: "<Narration>"
    en: The plank twists under the pressure, letting out a long, dreadful groan.
    ko: 나무판자가 뒤틀리며 끔찍한 소리를 낸다.
    ja: 木板がきしみ、不快な音を立てた
  event_staranis1_02_s_42:
    speaker: mint_o
    en: You should lose some weight.
    ko: 살 좀 빼.
    ja: ダイエット必須ね。
  event_staranis1_02_s_43:
    speaker: anis_idol
    en: "... I don't think that's the problem here."
    ko: 그 문제… 가 아닌 거 같은데.
    ja: そういう問題じゃ…ないと思うけど。
  event_staranis1_02_s_44:
    speaker: "<Narration>"
    en: Anis raises her head and scans the audience gathered before the stage.
    ko: 아니스는 고개를 들어 무대 앞에 있는 관중들을 바라본다.
    ja: |-
      アニスは顔を上げ、
      ステージ前の観客を確かめた
  event_staranis1_02_s_45:
    speaker: "<Narration>"
    en: They stare back at her, their eyes showing not the slightest hint of interest.
    ko: |-
      멀뚱멀뚱 자신을 바라보고 있는 시선들.
      조금도 관심이 없는 시선들.
    ja: |-
      こちらを見る視線はぼんやりとしている。
      ほとんど興味がないという顔だ
  event_staranis1_02_s_46:
    speaker: prika_o
    en: Hmm, they don't really strike me as fans.
    ko: 음. 아무리 봐도 아이돌 팬이랑은 거리가 있어 보이지?
    ja: |-
      どう見ても、アイドルの追っかけって
      感じじゃないな？
  event_staranis1_02_s_47:
    speaker: anis_idol
    en: Uh... feels like they just popped in while they were running errands.
    ko: 그… 냥 시내에 볼일 보러 왔다가 뭐 하나 싶어 구경 온 것 같은데.
    ja: |-
      そうね…用事があって街に来たら
      何かやってるからのぞきに来たって感じ。
  event_staranis1_02_s_48:
    speaker: "<Narration>"
    en: Murmurs ripple through the crowd
    ko: 웅성웅성.
    ja: ガヤガヤ…
  event_staranis1_02_s_49:
    speaker: "<Narration>"
    en: as everyone stares blankly at Anis.
    ko: 모두가 멀뚱멀뚱 아니스를 쳐다본다.
    ja: アニスを見る観客たちの顔は冷めている
  event_staranis1_02_s_50:
    speaker: "<Narration>"
    en: Beneath those indifferent gazes, it feels like her resolve might break.
    ko: 그 무관심한 시선에 마음이 꺾일 것만 같다.
    ja: |-
      いかにも無関心という視線だけで、
      心が折れそうになった
  event_staranis1_02_s_51:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_52:
    speaker: mint_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_53:
    speaker: prika_o
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_s_54:
    speaker: anis_idol
    en: "*Takes a deep breath*"
    ko: 흐-읍-
    ja: ふぅ…
  event_staranis1_02_s_55:
    speaker: anis_idol
    en: Hello, everyone! We're the three shining stars, T.T. STAR!
    ko: |-
      안녕하세요! 빛나는 세 별!
      T.T. STAR입니다!
    ja: |-
      こんにちは～！輝く三ツ星！
      T.T. STARです！
  event_staranis1_02_s_56:
    speaker: anis_idol
    en: It stands for Twinkle Tri-Star! Bit of a mouthful, right? So just call us
      T.T. STAR!
    ko: |-
      트윙클 트라이 스타라는 뜻이에요!
      너무 길죠? 그러니 T.T. STAR라고 불러주세요!
    ja: |-
      本当はトゥインクル・トライ・スター
      って言うんですけど、
      長いのでT.T. STARって呼んでください！
  event_staranis1_02_s_57:
    speaker: anis_idol
    en: First off, thank you to everyone who came out to celebrate Meet & Meat's grand
      opening today!
    ko: 오늘! 신장개업한 미트 미트를 찾아와주신 분들 감사합니다!
    ja: |-
      皆さん！本日新装開店のミートミートに
      来てくださって、ありがとうございます！
  event_staranis1_02_s_58:
    speaker: anis_idol
    en: And a big thanks to everyone who came to hear us perform!
    ko: 그리고 저희 노래를 들어주러 오신 분들도 감사합니다!
    ja: |-
      もちろん、私たちの歌を聞きにきてくれた
      みんなも、ありがとうございます！
  event_staranis1_02_s_59:
    speaker: anis_idol
    en: Our incredibly generous owner was kind enough to give us the chance to perform
      here today!
    ko: 고맙게도 인심 좋은 사장님이 저희한테 공연을 할 수 있는 기회를 주셨어요!
    ja: |-
      ありがたいことに、このお店の社長さんから
      私たちにここでパフォーマンスする機会を
      どーんといただきました！
  event_staranis1_02_s_60:
    speaker: anis_idol
    en: And if she's that generous, I'm sure she'll be loading your plates with plenty
      of meat too, right?
    ko: 이렇게나 인심이 좋은 분이니, 당연히 고기도 많이 주시겠죠?
    ja: |-
      そんな気前のいい社長さんなので、
      きっとお肉もたっぷり大盛に
      してくれるんじゃないでしょうか？
  event_staranis1_02_s_61:
    speaker: anis_idol
    en: So give our song a listen and enjoy the food while you're at it!
    ko: |-
      저희 노래 한 번 들어보시고!
      식사도 맛있게 해주세요!
    ja: |-
      ぜひ私たちの歌を聞いて、
      おいしいお肉を食べてくださいね！
  event_staranis1_02_s_62:
    speaker: anis_idol
    en: All right, then! Let's get this started!
    ko: 그럼! 시작하겠습니다!
    ja: それでは！聞いてください！
  event_staranis1_02_s_63:
    speaker: "<Narration>"
    en: The speakers suddenly crackle and pop
    ko: 퍼버벅-!
    ja: ボンッ！！
  event_staranis1_02_s_64:
    speaker: "<Narration>"
    en: as the audio clips.
    ko: 스피커가 클리핑 되며 퍽하고 터지는 소리가 들린다.
    ja: |-
      音割れを起こしたスピーカーから、
      爆発のような音が響いた
  event_staranis1_02_s_65:
    speaker: "<Narration>"
    en: Hanson flinches and hurriedly turns the volume down.
    ko: 한슨은 화들짝 놀라며 볼륨을 낮춘다.
    ja: ハンソンがあわててボリュームを下げた
  event_staranis1_02_s_66:
    speaker: "<Narration>"
    en: Music begins to play.
    ko: 음악이 흘러나온다.
    ja: 音楽が流れ始める
  event_staranis1_02_s_67:
    speaker: "<Narration>"
    en: Anis meets Mint and Prika's eyes and gives them a small nod.
    ko: 아니스는 자신을 바라보고 있는 민트와 프리카와 눈을 맞추며 고개를 끄덕인다.
    ja: |-
      アニスは自分へ視線を送る
      ミントとプリカに目を合わせ、うなずいた
  event_staranis1_02_s_68:
    speaker: "<Narration>"
    en: Then she begins singing and dancing in time with the music.
    ko: 그리고 흘러나오는 음악에 맞춰 노래하고 춤추기 시작했다.
    ja: そして音楽に合わせ、パフォーマンスを始めた
event_staranis1_02_e:
  event_staranis1_02_e_1:
    speaker: meatmeetowner
    en: Great job, everyone!
    ko: 고생했어요 고생했어.
    ja: お疲れ様。
  event_staranis1_02_e_2:
    speaker: meatmeetowner
    en: Performing takes a lot out of you, so make sure you eat plenty.
    ko: |-
      춤추고 노래하는 게 쉬운 일이 아닐 테니,
      많이들 들어요들.
    ja: |-
      あんなに動いて大変だったでしょう？
      たくさん食べてね。
  event_staranis1_02_e_3:
    speaker: anis_idol
    en: Thanks! Can't wait to dig in!
    ko: 감사합니다! 잘 먹을게요!
    ja: ありがとうございます！いただきます！
  event_staranis1_02_e_4:
    speaker: meatmeetowner
    en: Oh my, you're the leader? Quite the firecracker!
    ko: 어이구, 이 아가씨가 대장이야? 아주 활기차네.
    ja: |-
      あら、あなたがリーダーの子？
      とっても元気ね。
  event_staranis1_02_e_5:
    speaker: meatmeetowner
    en: Want me to pile on some more meat?
    ko: 어떻게, 고기 더 줄까?
    ja: どう？もっと食べる？
  event_staranis1_02_e_6:
    speaker: anis_idol
    en: Thank you!
    ko: 고맙습니다!
    ja: ありがとうございます！
  event_staranis1_02_e_7:
    speaker: meatmeetowner
    en: Go on, eat up. I'll bring some more right over.
    ko: 그래그래. 먹고 있어요. 금방 가져다줄게.
    ja: |-
      ええ、ええ。食べてちょうだい。
      すぐに持ってくるわね。
  event_staranis1_02_e_8:
    speaker: "<Narration>"
    en: The owner of Meet & Meat walks into the kitchen with a big grin.
    ko: 미트 미트 사장이 싱글벙글 주방으로 들어간다.
    ja: |-
      ミートミートの社長は、
      にこにこと笑いながら厨房へ向かった
  event_staranis1_02_e_9:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_10:
    speaker: hanson
    en: That was a great performance today.
    ko: 오늘 공연 좋았어.
    ja: 今日はいいパフォーマンスだったな。
  event_staranis1_02_e_11:
    speaker: anis_idol
    en: Right? We totally nailed it.
    ko: 그렇죠? 실수도 안 하고 제대로 소화했어요.
    ja: |-
      そうですよね？
      ミスもなかったし、きちんとできました。
  event_staranis1_02_e_12:
    speaker: prika_o
    en: We even got used to that floor, even though it felt like it might collapse
      any second.
    ko: 부서질 것 같은 바닥도 좀 적응됐고.
    ja: 抜けそうな床にも慣れてきたしな。
  event_staranis1_02_e_13:
    speaker: mint_o
    en: We're doing this for a week, right?
    ko: 일주일 동안 하는 거였죠?
    ja: 1週間の約束でしたよね？
  event_staranis1_02_e_14:
    speaker: hanson
    en: Yes.
    ko: 응.
    ja: ああ。
  event_staranis1_02_e_15:
    speaker: mint_o
    en: I think two people showed up during our second performance.
    ko: 두 번째 공연 할 때, 두 명인가 왔어요.
    ja: 2回目の時、2人くらい来てましたね。
  event_staranis1_02_e_16:
    speaker: anis_idol
    en: Who did?
    ko: 오다니. 누가?
    ja: 来てたって、誰が？
  event_staranis1_02_e_17:
    speaker: mint_o
    en: Music fans.
    ko: 아이돌 팬.
    ja: アイドル通の人。
  event_staranis1_02_e_18:
    speaker: prika_o
    en: "... How'd you know?"
    ko: "…어떻게 알아?"
    ja: "…なんで分かるんだ？"
  event_staranis1_02_e_19:
    speaker: mint_o
    en: They have a certain look in their eyes.
    ko: 눈빛이 다르거든. 아이돌 팬은.
    ja: 目つきが違うのよ。そういう人たちは。
  event_staranis1_02_e_20:
    speaker: mint_o
    en: Since there are so many pop stars these days, the fans end up competing too.
    ko: 춘추 아이돌 시대다 보니 팬들도 경쟁이 심해.
    ja: |-
      アイドルの競争と同じぐらい、
      あっち側の争いも激しいの。
  event_staranis1_02_e_21:
    speaker: mint_o
    en: Everyone wants to say they were there from the start.
    ko: |-
      그런 게 있어.
      [내가 이 아이돌 팬 1세대다].
    ja: |-
      みんなこだわるのよ。
      「自分がこのアイドルのファン第1世代だ」
      って。
  event_staranis1_02_e_22:
    speaker: prika_o
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_staranis1_02_e_23:
    speaker: mint_o
    en: You know that feeling when you find a place that becomes your spot? Like you
      discovered it before anyone else.
    ko: |-
      그런 경험들 다 있잖아. 나만의 맛집 같은 거.
      내가 제일 먼저 이 가게의 가치를 알아냈다 같은 거.
    ja: |-
      そうねぇ、経験ない？
      自分だけが知ってるいいお店が有名になって、
      昔から知ってたんだって自慢したくなるの。
  event_staranis1_02_e_24:
    speaker: prika_o
    en: Ah, I get it.
    ko: 아. 알 것 같아.
    ja: なるほど、そういうことか。
  event_staranis1_02_e_25:
    speaker: mint_o
    en: Fans like that usually help spread the word, so for rookies like us, they
      can make a big difference.
    ko: 보통은 그런 팬들이 적극적으로 홍보도 해주기 때문에, 우리 같은 신예는 엄청 도움을 많이 받을 수 있어.
    ja: |-
      周りにも熱心に広めてくれるから、
      私たちみたいな新人アイドルにとっては
      大事なのよ。
  event_staranis1_02_e_26:
    speaker: mint_o
    en: Hmm... We didn't get much of a reaction today, but at least we caught their
      attention.
    ko: 음… 별로 큰 리액션은 없었지만 일단 눈도장은 찍은 거에 의의를 두자.
    ja: |-
      まぁ…大きなリアクションはなかったけど、
      目に留めてもらえただけで
      プラスだって思いましょ。
  event_staranis1_02_e_27:
    speaker: mint_o
    en: If I had to guess, we'll probably start seeing a few more people from tomorrow.
    ko: 내 예상인데, 내일부터 조금씩 늘어날 거야.
    ja: |-
      私の予想だけど、
      明日から少しずつ
      お客さんが増えてくるはずよ。
  event_staranis1_02_e_28:
    speaker: anis_idol
    en: Wait, what? Even after we performed right outside the meat place?
    ko: 어… 고깃집 앞에서 공연을 했는데도 그래?
    ja: でも…わざわざ肉屋まで来たりするの？
  event_staranis1_02_e_29:
    speaker: mint_o
    en: Tsk, tsk. You really don't pay attention, huh, Anis?
    ko: 쯧쯧. 아니스는 전혀 눈치채지 못했구나?
    ja: アニスったら、全然分かってないのね？
  event_staranis1_02_e_30:
    speaker: mint_o
    en: This place has an excellent location.
    ko: 여기, 위치가 너무 좋아.
    ja: ここ、すごくいい場所なのよ。
  event_staranis1_02_e_31:
    speaker: mint_o
    en: We're right in the middle of downtown, and there's tons of foot traffic.
    ko: |-
      방주 시내 한복판이야.
      유동 인구도 많고.
    ja: |-
      市街地のど真ん中で、
      いっぱい人が通ってるでしょ。
  event_staranis1_02_e_32:
    speaker: prika_o
    en: Yeah, there's people everywhere.
    ko: |-
      그건 그래.
      사람들 엄청 다니더라.
    ja: |-
      ああ。
      にぎやかだな。
  event_staranis1_02_e_33:
    speaker: anis_idol
    en: Ohh! Then we'll get noticed without even trying, right?
    ko: 오. 그럼 당연히 노출될 확률도 높아지겠네?
    ja: へえ、それだけ見られる確率も高いってことね？
  event_staranis1_02_e_34:
    speaker: mint_o
    en: That's right.
    ko: 그렇지.
    ja: そういうこと。
  event_staranis1_02_e_35:
    speaker: mint_o
    en: Oh, that reminds me, Boss...
    ko: 그래서 말인데요, 사장님.
    ja: それで気になったんですけど、社長。
  event_staranis1_02_e_36:
    speaker: mint_o
    en: How'd you manage to convince the owner?
    ko: 여기 사장님 어떻게 구워삶으신 거예요?
    ja: ここの店主さんをどうやって説得したんですか？
  event_staranis1_02_e_37:
    speaker: mint_o
    en: If she can afford a place in a location like this, it's hard to believe she
      doesn't have the budget for advertising.
    ko: 이런 장소에 가게를 낼 정도면 홍보비가 모자랐다는 건 거짓말 같고.
    ja: |-
      こんな場所に店を出せるような人が、
      宣伝費をかけられないなんて、
      らしくないですよね。
  event_staranis1_02_e_38:
    speaker: mint_o
    en: And... to be honest, she doesn't really strike me as someone who's into pop
      stars.
    ko: 어… 솔직히 말씀드리면 여기 사장님이 아이돌에 관심 있는 것 같진 않거든요.
    ja: |-
      それに…正直に言うとあの社長さん、
      アイドルにはそこまで興味なさそうですし。
  event_staranis1_02_e_39:
    speaker: hanson
    en: It's a secret.
    ko: 비밀이야.
    ja: 企業秘密だ。
  event_staranis1_02_e_40:
    speaker: mint_o
    en: Huh? Why?
    ko: 예? 왜요?
    ja: えっ？どうしてですか？
  event_staranis1_02_e_41:
    speaker: meatmeetowner
    en: My boy...
    ko: 우리 아들놈이.
    ja: うちの息子がねぇ…
  event_staranis1_02_e_42:
    speaker: "<Narration>"
    en: A bowl of Nutrium is set on the table with a dull thud.
    ko: 턱. 하고 배양육이 담긴 그릇이 테이블 위에 올려졌다.
    ja: |-
      培養肉の盛られた皿をテーブルの上に置いて
      店主は言葉を続けた
  event_staranis1_02_e_43:
    speaker: meatmeetowner
    en: He's been working at Tetra for about seven years now.
    ko: 테트라에서 일한 지 7년 정도 됐는데.
    ja: テトラに勤めて、もう7年くらいになるのよ。
  event_staranis1_02_e_44:
    speaker: meatmeetowner
    en: When he first started, he drank so much at a company dinner that he was completely
      plastered. He would've ended up sleeping on the street if this gentleman here
      hadn't taken him home.
    ko: |-
      신입 때 회식에서 얼마나 마셔댔는지 술이 완전 떡이 돼서는,
      길거리에서 드러누워 잘 뻔한 걸 이 양반이 데려다줬어요.
    ja: |-
      新人の時に飲み会で散々飲まされて、
      行き倒れになりかけてたところを、
      この人がうちまで送り届けてくれたの。
  event_staranis1_02_e_45:
    speaker: meatmeetowner
    en: Bet you were sweating buckets hauling him all the way there, huh?
    ko: 땀을 뻘뻘 흘리며 데려다줬었죠 아마?
    ja: |-
      汗をダラダラ流しながら
      運んできてくれたわね？
  event_staranis1_02_e_46:
    speaker: hanson
    en: "... That was a long time ago."
    ko: "…옛날 일이에요."
    ja: "…昔の話です。"
  event_staranis1_02_e_47:
    speaker: meatmeetowner
    en: Turns out he was a director at Tetra, would you believe it? Honestly, my boy's
      probably the only new hire who's ever been carried home on a director's back.
    ko: |-
      알고 보니 테트라 이사님이었지 뭡니까.
      세상에, 이사 등에 업혀서 집에 온 신입은 걔밖에 없을걸요.
    ja: |-
      テトラの理事だったのは後で聞いたけど、
      そんな人におんぶされて帰った新人なんて
      後にも先にもきっとあの子だけよ。
  event_staranis1_02_e_48:
    speaker: meatmeetowner
    en: And when he went in the next day, the director had even bought him some hangover
      medicine.
    ko: 다음날 출근했더니 이사님이 숙취해소제까지 사다 줬다고.
    ja: |-
      次の日に出勤したら、
      酔い覚ましの薬まで
      買ってきてくれたんですってね。
  event_staranis1_02_e_49:
    speaker: meatmeetowner
    en: After that, my son started watching everything he did, saying he couldn't
      believe someone could be that good of a person.
    ko: 그날 이후 우리 아들놈이 이사님 일거수일투족을 다 지켜봤는데, 사람이 그렇게 좋을 수가 없더래요.
    ja: |-
      その日からずっと息子が
      この人の話ばっかりするようになったのよ。
      あんないい人は他にいないって。
  event_staranis1_02_e_50:
    speaker: meatmeetowner
    en: From what I can tell, he still treats the director as a role model.
    ko: 그래서 뭐 멘토로 삼기로 했다나 뭐 그러더만요.
    ja: 今でもお手本にしてるみたいなの。
  event_staranis1_02_e_51:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_52:
    speaker: anis_idol
    en: Look at you, getting all embarrassed.
    ko: 부끄러워하네.
    ja: 照れた。
  event_staranis1_02_e_53:
    speaker: mint_o
    en: Are you feeling shy?
    ko: 부끄럽나요?
    ja: 照れてます？
  event_staranis1_02_e_54:
    speaker: prika_o
    en: Don't be shy.
    ko: 부끄러워하지 마요.
    ja: 照れなくていいのに。
  event_staranis1_02_e_55:
    speaker: hanson
    en: You guys...
    ko: 너희들….
    ja: 君たちな…
  event_staranis1_02_e_56:
    speaker: anis_idol
    en: So you used that favor to pull some strings and get us this gig?
    ko: 그럼 그때 베푼 선의를 이용해서 여기서 공연할 수 있도록 로비한 거예요?
    ja: |-
      じゃあ、その時の恩をダシにして
      交渉したってことですか？
  event_staranis1_02_e_57:
    speaker: hanson
    en: No, I didn't...
    ko: 아니야….
    ja: 違う…
  event_staranis1_02_e_58:
    speaker: meatmeetowner
    en: I saw this awkward guy wandering around with his head down and thought, "Haven't
      I seen that face somewhere before?"
    ko: 여기저기 돌아다니며 고개를 숙이고 다니는 멀쑥한 사람이 보이길래 누군가 봤더니, 아 이거 어디선가 본 얼굴인 것 같은 거예요.
    ja: |-
      あちこち頭を下げて回って
      頑張ってる人がいるなと思ってたら、
      それが見覚えのある顔でね。
  event_staranis1_02_e_59:
    speaker: meatmeetowner
    en: So I took a closer look, and it turned out to be that director from back then.
    ko: 자세히 보니 그때 그 이사님이더라고.
    ja: |-
      よく見てみたら、やっぱり
      あの時の理事さんじゃない？
  event_staranis1_02_e_60:
    speaker: meatmeetowner
    en: I figured running into him like that must've been fate, so I asked if he'd
      help promote my shop.
    ko: 이것도 인연인 것 같아서 내가 홍보 좀 부탁했어요.
    ja: これも縁だと思って、私からお願いしたのよ。
  event_staranis1_02_e_61:
    speaker: meatmeetowner
    en: But honestly, why'd you leave Tetra? If you were a director at one of the
      Big Three, you could've done just about anything you wanted.
    ko: |-
      에이그, 그런데 왜 테트라에서 나왔대?
      3대 회사 이사면 하고 싶은 거 다 할 수 있었을 텐데.
    ja: |-
      それにしても、どうして辞めちゃったの？
      三大企業の理事なら、
      やりたいことなんて何でもできたでしょうに。
  event_staranis1_02_e_62:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_63:
    speaker: hanson
    en: Because... there was nothing I could do.
    ko: 제가… 할 수 있는 게 아무것도 없어서요.
    ja: 私には…何もできなかったので…
  event_staranis1_02_e_64:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_65:
    speaker: meatmeetowner
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_66:
    speaker: meatmeetowner
    en: Well, everyone's got their own story, don't they?
    ko: 그래요. 사연 없는 사람이 어디 있겠어요?
    ja: ま、誰でも事情の一つや二つはあるわよね？
  event_staranis1_02_e_67:
    speaker: meatmeetowner
    en: Go on, dig in. And if you need more, just let me know, all right?
    ko: |-
      자자. 어서들 들어요.
      모자라면 얘기 또 하고, 응?
    ja: |-
      さあさあ、早く食べて。
      足りなかったら遠慮なく言って、ね？
  event_staranis1_02_e_68:
    speaker: anis_idol
    en: I-I mean, this is already a lot! But I'll let you know if we need more!
    ko: 지… 금도 너무 많지만, 모자라면 말씀드릴게요!
    ja: |-
      も…もう十分多い気もしますけど、
      足りなくなったら遠慮なくおかわりしますね！
  event_staranis1_02_e_69:
    speaker: meatmeetowner
    en: All right, all right.
    ko: 그래요 그래.
    ja: そうしてちょうだい。
  event_staranis1_02_e_70:
    speaker: "<Narration>"
    en: The owner disappears back into the kitchen.
    ko: 미트 미트 사장이 다시 주방으로 걸어간다.
    ja: ミートミートの社長が厨房に戻っていった
  event_staranis1_02_e_71:
    speaker: meatmeetowner
    en: Oh, right...
    ko: 아.
    ja: あ、それと。
  event_staranis1_02_e_72:
    speaker: meatmeetowner
    en: I don't know much about the music business,
    ko: 나는 아이돌이나 가수나 이런 건 잘 모르지만.
    ja: |-
      私、アイドルや歌手のことは
      よく分からないんだけど。
  event_staranis1_02_e_73:
    speaker: meatmeetowner
    en: but it's nice seeing young people work so hard. Keep it up.
    ko: |-
      열심히 하는 거 보기 좋아.
      힘내요.
    ja: |-
      一生懸命な人を見るのは好きなのよ。
      頑張ってね。
  event_staranis1_02_e_74:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_75:
    speaker: anis_idol
    en: Yes, thank you so much! We'll give it our all!
    ko: 예! 고맙습니다! 열심히 할게요!
    ja: はいっ！ありがとうございます！頑張ります！
  event_staranis1_02_e_76:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_77:
    speaker: anis_idol
    en: We'll... really give it our all.
    ko: 열심히… 할게요.
    ja: 全力で…頑張ります。
  event_staranis1_02_e_78:
    speaker: "<Narration>"
    en: A week slips by.
    ko: 일주일이라는 시간이 흘렀다.
    ja: それから1週間が経とうとしていた
  event_staranis1_02_e_79:
    speaker: "<Narration>"
    en: T.T. STAR continues performing in front of Meet & Meat, day after day.
    ko: T.T. STAR는 미트 미트 앞에서 공연을 이어갔고.
    ja: |-
      T.T. STARはミートミートの店舗前で
      ミニライブを毎日続けた
  event_staranis1_02_e_80:
    speaker: "<Narration>"
    en: Slowly, the fans Mint mentioned start trickling in, curious to watch.
    ko: 민트가 얘기한 [아이돌 팬]이 하나둘씩 무대를 보기 위해 모여들었다.
    ja: |-
      ミントの言う「アイドル通」たちの姿も
      徐々に増え続けた
  event_staranis1_02_e_81:
    speaker: "<Narration>"
    en: But nothing really changes—no buzz, no chatter, no recognition.
    ko: 하지만 별다른 소득은 이루지 못했다.
    ja: しかし、大きな手ごたえはなかった
  event_staranis1_02_e_82:
    speaker: "<Narration>"
    en: The forums where the biggest fan communities spend all their time online remain
      empty of any mention of T.T. STAR.
    ko: 가장 많은 아이돌 팬덤이 넷상에 상주한다는 아이돌 카페에는 T.T. STAR에 대한 글은 단 하나도 올라오지 않았다.
    ja: |-
      アイドルファンが集う
      最大規模の電子掲示板にも
      T.T. STARに関する情報は見当たらない
  event_staranis1_02_e_83:
    speaker: "<Narration>"
    en: And just like that, their contract comes to an end.
    ko: 그렇게 계약 기간은 끝났다.
    ja: 契約期間は終わりを迎えた
  event_staranis1_02_e_84:
    speaker: hanson
    en: Thank you for giving us this opportunity.
    ko: 기회를 주셔서 감사했습니다.
    ja: |-
      この場をお貸しいただき、
      ありがとうございました。
  event_staranis1_02_e_85:
    speaker: anis_idol
    en: "... Thanks to you, we got plenty of experience."
    ko: "…덕분에, 경험도 많이 쌓을 수 있었어요."
    ja: "…おかげで、経験がたくさん積めました。"
  event_staranis1_02_e_86:
    speaker: anis_idol
    en: Seriously, thanks a million!
    ko: 정말 감사합니다!
    ja: 本当にありがとうございます！
  event_staranis1_02_e_87:
    speaker: meatmeetowner
    en: Um...
    ko: 음….
    ja: うーん…
  event_staranis1_02_e_88:
    speaker: meatmeetowner
    en: Any chance you could stick around for just one more month?
    ko: 한 달만 더 해줄 수 있어요?
    ja: もう1ヶ月だけ、続けてもらえないかしら？
  event_staranis1_02_e_89:
    speaker: meatmeetowner
    en: I can't offer much, but I'll make sure you're paid.
    ko: 대신 많지는 않겠지만 페이도 챙겨줄게요.
    ja: 多くはないけど、今度はお金も出すわ。
  event_staranis1_02_e_90:
    speaker: hanson
    en: "... Excuse me?"
    ko: "…예?"
    ja: "…え？"
  event_staranis1_02_e_91:
    speaker: meatmeetowner
    en: I don't know if it's thanks to you folks or not, but I've been getting a lot
      more customers lately.
    ko: 댁들 덕분인지는 몰라도 손님도 제법 늘었고.
    ja: |-
      宣伝のおかげかどうかまでは
      分からないけど、お客さんが
      けっこう増えてるのよね。
  event_staranis1_02_e_92:
    speaker: meatmeetowner
    en: These days, it's hard to find people who still work their tails off, you know?
    ko: 요즘, 열심히 하는 사람 보기가 쉽지 않거든.
    ja: |-
      それに最近じゃ、あなたたちほど
      頑張ってる人なんてそう見られないから。
  event_staranis1_02_e_93:
    speaker: meatmeetowner
    en: Ever since that surface reclamation thing failed, everyone's been walking
      around looking dead inside.
    ko: 지상 탈환전인가 뭔가가 실패한 후에 다들 죽은 눈이나 하고 다니니까요.
    ja: |-
      地上奪還だか何だったかが失敗してから、
      死んだような目をしてる人ばっかりでしょ。
  event_staranis1_02_e_94:
    speaker: meatmeetowner
    en: Most of them are too busy laughing at people who try, so you hardly see anyone
      putting in real effort anymore.
    ko: |-
      열심히 하는 사람들을 비웃기나 바쁘지,
      진짜 열심히 하는 사람은 찾아보기 힘들어요.
    ja: |-
      本気でやってる人を笑うばっかりで、
      一生懸命な人がいない気がするの。
  event_staranis1_02_e_95:
    speaker: meatmeetowner
    en: But you? Watching you really fires me up.
    ko: 그리고 내가 힘이 나서 그래요.
    ja: |-
      何より、あなたたちを見てると
      元気が出てくるわ。
  event_staranis1_02_e_96:
    speaker: meatmeetowner
    en: It really does.
    ko: 보고 있으면 참 힘이 나고 그래.
    ja: 自分も頑張る気になるっていうのかしら。
  event_staranis1_02_e_97:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_98:
    speaker: meatmeetowner
    en: So think you could do me a favor?
    ko: 그래서, 부탁해도 돼요?
    ja: だから、お願いできる？
  event_staranis1_02_e_99:
    speaker: anis_idol
    en: Leave it to us!
    ko: 잘 부탁드립니다!
    ja: ぜひ、よろしくお願いします！
  event_staranis1_02_e_100:
    speaker: "<Narration>"
    en: T.T. STAR extends its contract with Meet & Meat, securing another month.
    ko: |-
      T.T. STAR는 미트 미트와의 계약을 연장.
      한 달이라는 시간을 더 확보했다.
    ja: |-
      T.T. STARとミートミートの契約は
      さらに1ヶ月継続として更新された
  event_staranis1_02_e_101:
    speaker: "<Narration>"
    en: Three days later...
    ko: 그리고 3일 뒤.
    ja: その3日後
  event_staranis1_02_e_102:
    speaker: "<Narration>"
    en: "*Craaack!*"
    ko: 우지끈-!
    ja: バキバキッ――！
  event_staranis1_02_e_103:
    speaker: anis_idol
    en: "... Huh?"
    ko: "…어?"
    ja: "…えっ？"
  event_staranis1_02_e_104:
    speaker: mint_o
    en: "!"
    ko: "!!"
    ja: "！！"
  event_staranis1_02_e_105:
    speaker: prika_o
    en: "!"
    ko: "!!"
    ja: "！！"
  event_staranis1_02_e_106:
    speaker: "<Narration>"
    en: The rickety stage isn't built to support a Nikke. The boards crack under Anis's
      weight, collapsing into a jagged hole and dropping her straight through.
    ko: |-
      열악한 무대가 니케의 무게를 이기지 못하고 구멍이 났고,
      아니스가 그 안에 빠졌다.
    ja: |-
      粗製のステージがニケの重量に耐えきれず、
      アニスが床を踏み抜いて落ちた
  event_staranis1_02_e_107:
    speaker: hanson
    en: Oh no!
    ko: 이런…!
    ja: 大丈夫か…！？
  event_staranis1_02_e_108:
    speaker: "<Narration>"
    en: Mint and Prika rush toward her in alarm, but Anis lifts a hand, stopping them
      in their tracks.
    ko: |-
      민트와 프리카가 아니스에게 다급하게 달려가려 하지만,
      아니스가 손을 들어 제지한다.
    ja: |-
      ミントとプリカがあわてて
      駆けつけようとしたが、
      アニスは手を上げて制止した
  event_staranis1_02_e_109:
    speaker: "<Narration>"
    en: From inside the hole, she starts singing and dancing.
    ko: 그리고 구멍 안에서 춤추며 노래하기 시작한다.
    ja: |-
      そしてそのまま、穴の中で
      パフォーマンスを続けた
  event_staranis1_02_e_110:
    speaker: "<Narration>"
    en: A moment later, she pops her upper body out of the hole in the floor, dancing
      and singing like nothing happened. Mint and Prika freeze at the unexpected sight.
    ko: 구멍 난 바닥 안에서 상반신만 불쑥 내밀어 춤추며 노래하는 모습에 민트와 프리카는 잠시 굳었지만.
    ja: |-
      床から上半身だけを出して歌い踊る姿に、
      ミントとプリカは困惑した
  event_staranis1_02_e_111:
    speaker: "<Narration>"
    en: But once they understand what she's doing, they keep the performance going,
      fighting with all their might to keep from laughing.
    ko: 상황을 이해한 후, 웃음을 필사적으로 참으며 공연을 이어갔다.
    ja: |-
      しかし状況を理解すると、
      笑いを必死でこらえながら
      パフォーマンスに戻った
  event_staranis1_02_e_112:
    speaker: "<Narration>"
    en: That evening, at long last,
    ko: 그리고 그날 저녁.
    ja: その日の夕方
  event_staranis1_02_e_113:
    speaker: "<Narration>"
    en: a post about T.T. STAR appears on the forum.
    ko: 그렇게나 기다리던 아이돌 카페에 T.T. STAR에 대한 글이 올라왔다.
    ja: |-
      T.T. STARに関する書き込みが
      初めて掲示板に投稿されていた
  event_staranis1_02_e_114:
    speaker: anis_human
    en: What?! What does it say?!
    ko: 뭐라고! 뭐라고 올라왔는데!
    ja: なになに！？なんて書いてあるの！？
  event_staranis1_02_e_115:
    speaker: mint
    en: Hold on, I'm reading it.
    ko: 좀 기다려봐. 보고 있잖아.
    ja: ちょっと待って。私もいま見てるんだから。
  event_staranis1_02_e_116:
    speaker: anis_human
    en: "... Uh-huh, uh-huh."
    ko: "…어, 어."
    ja: "…あ、うん。"
  event_staranis1_02_e_117:
    speaker: anis_human
    en: So what's it say? What's it about?
    ko: 뭐래? 뭐라는데?
    ja: で？なんて書いてあるの？
  event_staranis1_02_e_118:
    speaker: mint
    en: Seriously, enough already!
    ko: 아 정말 진짜 좀.
    ja: 急かさないでってば。
  event_staranis1_02_e_119:
    speaker: prika
    en: Oh, here it is.
    ko: 오. 이거다.
    ja: おっ、これか。
  event_staranis1_02_e_120:
    speaker: "<Narration>"
    en: On the screen is a picture of Anis dancing in a hole on stage.
    ko: 화면에는 구멍 난 무대에서 춤추고 있는 아니스를 찍은 사진이 있었다.
    ja: |-
      投稿されていたのは
      穴の開いたステージで踊るアニスの画像だ
  event_staranis1_02_e_121:
    speaker: "<Narration>"
    en: 'Title: A singing mole? LOL'
    ko: '제목 : 두더지냐고ㅋㅋㅋㅋ'
    ja: タイトル：モグラかよwww
  event_staranis1_02_e_122:
    speaker: "<Narration>"
    en: Went downtown today and saw some moles holding a concert, haha.
    ko: 오늘 시내에 나갔다가 두더지 봄ㅋㅋㅋ
    ja: 今日は街でモグラを見かけたwww
  event_staranis1_02_e_123:
    speaker: "<Narration>"
    en: "- Who are they?"
    ko: ㄴ ㅋㅋㅋ얘들 누구?
    ja: ㄴwwwこの子たち、誰？
  event_staranis1_02_e_124:
    speaker: "<Narration>"
    en: "- A new group called T.T. STAR."
    ko: ㄴ TTSTAR라는 신생임
    ja: ㄴT.T. STARっていう新人アイドル
  event_staranis1_02_e_125:
    speaker: "<Narration>"
    en: "- They're okay, but all they do is Pretty's covers. Nothing special."
    ko: ㄴ 열심히는 하는 거 같은데 노래랑 안무는 프리티 커버라서 특징은 없는 듯
    ja: |-
      ㄴ頑張ってる感じは伝わってきたけど、
      歌とダンスはプリティーのカバーで特徴はない
  event_staranis1_02_e_126:
    speaker: "<Narration>"
    en: "- Another cookie-cutter pop group. Got it."
    ko: ㄴ 아 양산형 아이돌 ㅇㅋ
    ja: ㄴ量産型アイドルかー
  event_staranis1_02_e_127:
    speaker: "<Narration>"
    en: "- How long are they gonna keep riding Pretty's coattails?"
    ko: ㄴ 언제까지 프리티 타령
    ja: ㄴいつまでプリティーの真似ばっかしてんだ
  event_staranis1_02_e_128:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_129:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_130:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_131:
    speaker: anis_human
    en: Eh, s-something's better than nothing, right?
    ko: 그, 그래도오… 하나라도 올라왔으니까, 응?
    ja: |-
      で、でも…ひとつでも
      書き込みされたわけだし…ねっ？
  event_staranis1_02_e_132:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_133:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_134:
    speaker: anis_human
    en: "... Hey, you guys okay?"
    ko: "…야. 너희들 괜찮아?"
    ja: "…ねえ、2人とも大丈夫？"
  event_staranis1_02_e_135:
    speaker: "<Narration>"
    en: Mint and Prika stand up without answering.
    ko: 민트와 프리카가 자리에서 일어났다.
    ja: ミントとプリカは答えずに立ち上がった
  event_staranis1_02_e_136:
    speaker: mint
    en: I'm going to sleep.
    ko: 잘래.
    ja: 寝るわ。
  event_staranis1_02_e_137:
    speaker: prika
    en: Me too.
    ko: 나도.
    ja: 私も。
  event_staranis1_02_e_138:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_139:
    speaker: anis_human
    en: Good night.
    ko: 잘 자.
    ja: おやすみ…
  event_staranis1_02_e_140:
    speaker: anis_human
    en: Um... try not to let it get to you too much, okay?
    ko: |-
      그… 너무 신경 쓰지 말고.
      알겠지?
    ja: |-
      その…あまり気にしすぎないでよ。
      分かった？
  event_staranis1_02_e_141:
    speaker: "<Narration>"
    en: As time goes by,
    ko: 시간이 흐른다.
    ja: さらに時が流れた
  event_staranis1_02_e_142:
    speaker: "<Narration>"
    en: a week passes without a single post about T.T. STAR, and the fans stop showing
      up.
    ko: |-
      일주일 동안 T.T. STAR의 글은 어디에도 올라오지 않았고,
      아이돌 팬의 발걸음은 끊겼다.
    ja: |-
      あれから1週間、
      T.T. STARに関する投稿は続かず
      アイドル通たちの影も消えていた
  event_staranis1_02_e_143:
    speaker: hanson
    en: "... There are just too many people trying to become the next Pretty."
    ko: |-
      …너무 많아.
      프리티가 되려는 사람이.
    ja: |-
      …やはり多すぎる。
      プリティーになりたがる者が。
  event_staranis1_02_e_144:
    speaker: hanson
    en: This seems like the only way...
    ko: 역시 방법은 이것뿐인가….
    ja: 結局、こうなるのか…
  event_staranis1_02_e_145:
    speaker: "<Narration>"
    en: Hanson tilts his head back, staring up at the towering building before him.
    ko: 한슨은 고개를 들어 눈앞의 큰 건물을 올려다보았다.
    ja: |-
      ハンソンは顔を上げ、
      目の前の巨大なビルを眺めた
  event_staranis1_02_e_146:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_02_e_147:
    speaker: hanson
    en: Phew...
    ko: 후우.
    ja: ふう…
  event_staranis1_02_e_148:
    speaker: "<Narration>"
    en: Hanson steps into Tetra Line's headquarters.
    ko: 한슨은 테트라 라인 본사로 걸어 들어갔다.
    ja: ハンソンはテトラライン本社のゲートをくぐった
event_staranis1_03_s:
  event_staranis1_03_s_1:
    speaker: yoyo
    en: Have you heard of T.T. STAR?
    ko: T.T. STAR라고 아시나요?
    ja: T.T. STARのことはご存じですか？
  event_staranis1_03_s_2:
    speaker: mustang_past
    en: What's that supposed to be?
    ko: 뭔데 그게.
    ja: いや、知らんな。
  event_staranis1_03_s_3:
    speaker: yoyo
    en: Um... It's the pop group Hanson put together.
    ko: 음… 한슨이 만든 아이돌 그룹이죠.
    ja: |-
      …ハンソン元理事が立ち上げた
      アイドルグループです。
  event_staranis1_03_s_4:
    speaker: mustang_past
    en: "... Hanson."
    ko: "…한슨이."
    ja: "…ハンソンか。"
  event_staranis1_03_s_5:
    speaker: mustang_past
    en: So? Where are they on the charts?
    ko: 그래서, 지금 차트는?
    ja: で、ランキングは？
  event_staranis1_03_s_6:
    speaker: yoyo
    en: They didn't even make the charts.
    ko: 차트 아웃이에요.
    ja: 圏外です。
  event_staranis1_03_s_7:
    speaker: mustang_past
    en: You mean the major charts?
    ko: 메이저 쪽?
    ja: メジャーでか？
  event_staranis1_03_s_8:
    speaker: yoyo
    en: No, the indie charts.
    ko: 아뇨. 마이너요.
    ja: いえ。インディーズの方です。
  event_staranis1_03_s_9:
    speaker: mustang_past
    en: What the hell...?
    ko: 뭐냐 그게.
    ja: なんだそりゃ…
  event_staranis1_03_s_10:
    speaker: yoyo
    en: Seems they're just covering Pretty's songs and parroting her choreography.
      Utterly unremarkable.
    ko: |-
      프리티의 안무와 곡을 커버하는 것 같더군요.
      큰 특징은 없고.
    ja: |-
      プリティーのダンスと歌を
      カバーしているだけで、
      これといった特徴もありません。
  event_staranis1_03_s_11:
    speaker: mustang_past
    en: Heh.
    ko: 하.
    ja: フン…
  event_staranis1_03_s_12:
    speaker: mustang_past
    en: So Hanson's cranking out those dime-a-dozen Pretty knockoffs now?
    ko: 썩어나는 프리티 짝퉁을 만들었다고? 한슨이?
    ja: |-
      プリティーの腐ったニセモノを
      作ってるのか？あいつが？
  event_staranis1_03_s_13:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_14:
    speaker: mustang_past
    en: He left the company for something so worthless?
    ko: 그딴 거나 하려고 회사를 나간 건가.
    ja: そんなことのために出ていったのか。
  event_staranis1_03_s_15:
    speaker: mustang_past
    en: What a damn fool.
    ko: 머저리 같은 놈.
    ja: あきれたバカだ。
  event_staranis1_03_s_16:
    speaker: yoyo
    en: You're just going to let that slide? If it were me...
    ko: |-
      그냥 놔두실 건가요?
      저 같으면….
    ja: |-
      このまま放置しておくつもりですか？
      私なら…
  event_staranis1_03_s_17:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_18:
    speaker: mustang_past
    en: Yoyo.
    ko: 요요.
    ja: ヨヨ。
  event_staranis1_03_s_19:
    speaker: yoyo
    en: "... Yes?"
    ko: "…예?"
    ja: "…はい？"
  event_staranis1_03_s_20:
    speaker: mustang_past
    en: Don't overstep. I'll be the judge of that.
    ko: |-
      주제넘게 나서지 마라.
      판단은 내가 한다.
    ja: 分をわきまえろ。決めるのは俺だ。
  event_staranis1_03_s_21:
    speaker: mustang_past
    en: You were nothing when I made you a Nikke and pushed you as Pretty's successor.
      And now you think that's because you're special?
    ko: 쥐뿔도 없는 거 니케로 만들어놓고 포스트 프리티로 밀어줬더니 왜. 그게 다 네가 잘나서 그런 것 같아?
    ja: |-
      なんの取り柄もないお前をニケにしてやって、
      ポスト・プリティーの座に就けてやったのに、
      自分の実力だと勘違いするようになったか？
  event_staranis1_03_s_22:
    speaker: yoyo
    en: "... I've never thought of it that way."
    ko: "…그렇게 생각한 적은 없어요."
    ja: "…そんなことはありません。"
  event_staranis1_03_s_23:
    speaker: mustang_past
    en: Then shut it. I've already got enough crap to deal with.
    ko: |-
      그럼 가만히 있어.
      가뜩이나 신경 쓸게 한두 개가 아니니까.
    ja: |-
      なら黙ってろ。
      こっちは考えなきゃならんことが
      いくらでもあるんだ。
  event_staranis1_03_s_24:
    speaker: yoyo
    en: "... I'll keep that in mind."
    ko: "…명심할게요."
    ja: "…気をつけます。"
  event_staranis1_03_s_25:
    speaker: mustang_past
    en: Where do you sit on the charts?
    ko: 차트는?
    ja: で、お前の方は？
  event_staranis1_03_s_26:
    speaker: yoyo
    en: Still firmly at number one,
    ko: 아직 견고하게 1위 유지 중이에요.
    ja: 危なげなく1位をキープしています。
  event_staranis1_03_s_27:
    speaker: yoyo
    en: all thanks to the great CEO. And someone like me is sitting in a spot I don't
      even deserve.
    ko: |-
      위대하신 사장님의 은혜로 인해,
      쥐뿔도 없는 제가 팔자에도 없는 1위 자리를 계속 유지하고 있죠.
    ja: |-
      偉大な社長のお力で、
      何の取り柄もない私が
      ずっと1位の座に座り続けています。
  event_staranis1_03_s_28:
    speaker: mustang_past
    en: You're nowhere near Pretty.
    ko: 넌 아직 프리티의 발끝에도 못 따라갔다.
    ja: |-
      当然だ、お前じゃまだ
      プリティーの足元にも届かないからな。
  event_staranis1_03_s_29:
    speaker: mustang_past
    en: Don't fool yourself. Either step it up or don't bother.
    ko: 아직 멀었어. 더 힘내야 할 거야.
    ja: まだまだだ。もっと努力しろ。
  event_staranis1_03_s_30:
    speaker: yoyo
    en: And how, exactly, am I supposed to try harder than this?
    ko: 이 이상 힘내는 방법에 대해 알려주시겠어요?
    ja: |-
      これ以上、何をどう頑張ればいいか
      教えていただけませんか？
  event_staranis1_03_s_31:
    speaker: mustang_past
    en: How'd you like...
    ko: 너 말이야.
    ja: お前…
  event_staranis1_03_s_32:
    speaker: mustang_past
    en: a bullet through the head?
    ko: 머리에 총 맞고 죽을 생각 없어?
    ja: 頭を撃たれて死んでみる気はないか？
  event_staranis1_03_s_33:
    speaker: yoyo
    en: "... What?"
    ko: "…뭐라고요?"
    ja: "…それはどういう…？"
  event_staranis1_03_s_34:
    speaker: mustang_past
    en: Heh... thinking about it now, the way Pretty died was a work of art.
    ko: 하… 지금 와서 생각하면 프리티가 그렇게 죽은 건 정말 예술이었어.
    ja: |-
      フ…今になって考えれば、
      プリティーの死にざまは実に芸術的だった。
  event_staranis1_03_s_35:
    speaker: mustang_past
    en: Thanks to that, Tetra's stock shot through the roof.
    ko: 덕분에 테트라 주가가 미친 듯이 치솟았으니까.
    ja: |-
      そのおかげでテトラの株価も
      狂ったように上がった。
  event_staranis1_03_s_36:
    speaker: mustang_past
    en: All she did was get taken out by some whacko, and yet the media wrapped it
      up like some grand, noble sacrifice. Beautiful, really.
    ko: 테러에 당해 죽었을 뿐인데 무슨 고귀한 죽음 마냥 포장된 게 죽여줬지.
    ja: |-
      テロに遭って死んだだけのことが、
      まるで尊い犠牲のように美化されてな。
  event_staranis1_03_s_37:
    speaker: mustang_past
    en: Even dead, she's still pulling weight for the company. Now that's what I call
      a devoted daughter.
    ko: 죽어서까지 도움이 된다니 그만한 효녀가 없다고.
    ja: |-
      死んでも役に立つなんて、
      それ以上の恩返しがあるか？
  event_staranis1_03_s_38:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_39:
    speaker: mustang_past
    en: Don't just stand there like an idiot and start using that puny brain of yours.
    ko: 그렇게 입 다물고 있지만 말고 방법을 생각해 봐.
    ja: 黙ってないで、方法を考えてみろ。
  event_staranis1_03_s_40:
    speaker: mustang_past
    en: How do you plan to surpass Pretty?
    ko: 프리티를 뛰어넘을 수 있는 방법 말이야.
    ja: プリティーを超える方法をな。
  event_staranis1_03_s_41:
    speaker: yoyo
    en: "... I'll give it some thought."
    ko: "…고민해 볼게요."
    ja: "…分かりました。"
  event_staranis1_03_s_42:
    speaker: mustang_past
    en: Yeah, yeah. Let me know if you come up with something worth my time.
    ko: 그래. 뭐 좋은 생각 나면 알려주고.
    ja: ま、何か思いついたら聞いてやる。
  event_staranis1_03_s_43:
    speaker: "<Narration>"
    en: "*Bzzzz*"
    ko: 지잉-
    ja: ブブブ…
  event_staranis1_03_s_44:
    speaker: mustang_past
    en: What now?
    ko: 뭐야.
    ja: 何だ？
  event_staranis1_03_s_45:
    speaker: "<Narration>"
    en: "*Bzzzz*"
    ko: 지잉-
    ja: ブブブ…
  event_staranis1_03_s_46:
    speaker: mustang_past
    en: Tch. I told them not to call at this hour.
    ko: 쯧. 이 시간대에는 전화하지 말랬더니.
    ja: |-
      チッ…この時間は邪魔するなって
      言っておいただろうが。
  event_staranis1_03_s_47:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ
  event_staranis1_03_s_48:
    speaker: mustang_past
    en: Yeah, it's me.
    ko: 그래. 나다.
    ja: 俺だ、どうした。
  event_staranis1_03_s_49:
    speaker: mustang_past
    en: This better be worth my time. Otherwise, don't bother showing up tomorrow.
    ko: 별거 아닌 내용이면 내일부터 나올 생각하지 마라.
    ja: |-
      くだらん用件だったら、
      明日から来なくていいからな。
  event_staranis1_03_s_50:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_51:
    speaker: mustang_past
    en: What?
    ko: 뭐?
    ja: 何だと？
  event_staranis1_03_s_52:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_53:
    speaker: mustang_past
    en: Send him in.
    ko: 들어오라고 해.
    ja: 通せ。
  event_staranis1_03_s_54:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ
  event_staranis1_03_s_55:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_56:
    speaker: yoyo
    en: What's going on?
    ko: 왜 그래요?
    ja: どうしました？
  event_staranis1_03_s_57:
    speaker: "<Narration>"
    en: With a faint smile, Mustang gazes out the window as he waits.
    ko: 머스탱은 창밖을 보며 미소 지은 채 기다린다.
    ja: |-
      マスタングは答えずに薄笑いを浮かべ、
      来訪者を待った
  event_staranis1_03_s_58:
    speaker: "<Narration>"
    en: Yoyo's gaze lingers on his face, unreadable.
    ko: 요요는 그런 머스탱의 얼굴을 빤히 바라본다.
    ja: |-
      ヨヨはマスタングの様子をうかがい、
      動けずにいた
  event_staranis1_03_s_59:
    speaker: "<Narration>"
    en: A moment later, the door opens, and Hanson walks in.
    ko: 그리고 잠시 후, 문이 열리며 한슨이 들어왔다.
    ja: |-
      やがて扉の開く音とともに、
      ハンソンが姿を現した
  event_staranis1_03_s_60:
    speaker: hanson
    en: "... Hello."
    ko: "…안녕하십니까."
    ja: "…どうも。"
  event_staranis1_03_s_61:
    speaker: mustang_past
    en: Well, well, if it isn't Hanson.
    ko: 이게 누구야.
    ja: これはこれは、誰かと思えば…
  event_staranis1_03_s_62:
    speaker: mustang_past
    en: Hanson, Hanson, my darling Hanson.
    ko: 한슨, 한슨. 내 소중한 한슨.
    ja: |-
      ハンソン、ハンソン！
      私の大切なハンソン君じゃないか。
  event_staranis1_03_s_63:
    speaker: hanson
    en: Thank you for making the time to meet with me.
    ko: 시간 내주셔서 감사합니다.
    ja: お時間をいただき、ありがとうございます。
  event_staranis1_03_s_64:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_65:
    speaker: hanson
    en: I've been enjoying your new song, Yoyo.
    ko: |-
      요요도 계셨군요.
      신곡 잘 듣고 있습니다.
    ja: |-
      ヨヨさんですね。
      新曲、いつも聞かせていただいております。
  event_staranis1_03_s_66:
    speaker: hanson
    en: Congratulations on holding the top spot on the charts. I have much to learn
      from you.
    ko: |-
      차트 1위 유지도 축하드립니다.
      많이 배우고 있습니다.
    ja: |-
      相変わらずトップを独走中のようですね。
      いろいろと勉強になります。
  event_staranis1_03_s_67:
    speaker: yoyo
    en: You flatter me.
    ko: 별말씀을.
    ja: ありがとうございます。
  event_staranis1_03_s_68:
    speaker: mustang_past
    en: So, what brings you here?
    ko: 그래서, 무슨 일로 찾아왔지?
    ja: それで、何の用だ？
  event_staranis1_03_s_69:
    speaker: mustang_past
    en: I do hope it's exactly what I'm hoping for.
    ko: 부디 내가 원하는 걸로 찾아온 거였으면 좋겠군.
    ja: 俺が時間を取る意味のあることなんだろうな。
  event_staranis1_03_s_70:
    speaker: hanson
    en: "... I need your help."
    ko: "…도움이 필요합니다."
    ja: "…力をお貸しいただきたい。"
  event_staranis1_03_s_71:
    speaker: mustang_past
    en: Of course you do.
    ko: 그렇지 그렇지.
    ja: そうか、そうか。
  event_staranis1_03_s_72:
    speaker: mustang_past
    en: Miss being under Tetra's protection, huh? I bet leaving all that behind and
      struggling out there was a real pain.
    ko: |-
      테트라의 우산 아래에 있던 때가 그립지?
      빈털터리로 나가서 그렇게 개고생해 보니까.
    ja: |-
      テトラの屋根の下にいた頃が恋しくなったか？
      一文無しで飛び出したんじゃ、
      苦労してるだろう。
  event_staranis1_03_s_73:
    speaker: mustang_past
    en: Now... what was it again?
    ko: 그… 뭐라고 했더라?
    ja: えー…何と言ったんだったかな？
  event_staranis1_03_s_74:
    speaker: yoyo
    en: T.T. STAR.
    ko: T.T. STAR 에요.
    ja: T.T. STARです。
  event_staranis1_03_s_75:
    speaker: mustang_past
    en: Ah, right, T.T. STAR.
    ko: 그래그래. T.T. STAR.
    ja: それだ、T.T. STAR。
  event_staranis1_03_s_76:
    speaker: mustang_past
    en: I heard you're the one managing them. From what I've seen, they don't seem
      all that impressive.
    ko: |-
      걔들 네가 키우고 있다며.
      딱히 뭐 대단한 건 없어 보이는 것들이던데.
    ja: |-
      お前が手をかけてるらしいな。
      パっとしないと聞いたが。
  event_staranis1_03_s_77:
    speaker: mustang_past
    en: How's it feel, handling those half-baked ones after dealing with the perfectly
      groomed Nikkes at Tetra? Must be like night and day, huh?
    ko: 관리 잘 된 테트라의 니케들만 상대하다 그런 어중이떠중이를 관리해 보니 어때? 천지 차이지?
    ja: |-
      しっかり選別されたテトラのニケの後で
      寄せ集めどもの世話をしてるなら、
      天と地の差だと分かっただろう？
  event_staranis1_03_s_78:
    speaker: mustang_past
    en: So, you want us to take them on, then?
    ko: 그래서, 걔들을 우리가 관리해 주면 되나?
    ja: |-
      で、そいつらごと
      うちに入れて欲しいってことか？
  event_staranis1_03_s_79:
    speaker: mustang_past
    en: Fine, it's no big deal, really. We can do that.
    ko: |-
      좋아. 까짓거 어려운 일도 아니지.
      그렇게 해.
    ja: |-
      いいだろう。簡単なことだ。
      思うようにすればいい。
  event_staranis1_03_s_80:
    speaker: mustang_past
    en: I'll even give you your director position back. I've been keeping it open
      just for this reason.
    ko: |-
      이사 자리도 다시 주마.
      이럴까 봐 계속 공석으로 두고 있었다.
    ja: |-
      理事の席にも戻してやる。
      どうせこうなると思って、
      空けたままにしてあるからな。
  event_staranis1_03_s_81:
    speaker: mustang_past
    en: Get them in here. Let's get the ink on paper.
    ko: |-
      걔들 바로 불러.
      도장 바로 찍게.
    ja: |-
      すぐに呼んで来い。
      この場で手続きしてやろう。
  event_staranis1_03_s_82:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_83:
    speaker: hanson
    en: I see you're still only saying what you want to say.
    ko: 여전히 본인 할 말만 하시는군요.
    ja: |-
      自分の言いたいことばかり、
      相変わらずのようですね。
  event_staranis1_03_s_84:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_85:
    speaker: mustang_past
    en: What?
    ko: 뭐?
    ja: 何だと？
  event_staranis1_03_s_86:
    speaker: hanson
    en: I'm here to purchase a song
    ko: 곡을 사러 왔습니다.
    ja: 私は曲を買いに来ただけです。
  event_staranis1_03_s_87:
    speaker: hanson
    en: that's perfect for a three-member group.
    ko: 3인조 아이돌 그룹에 잘 어울리는 곡을 사러요.
    ja: |-
      3人組のアイドルたちに合わせた、
      ふさわしい曲を。
  event_staranis1_03_s_88:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_89:
    speaker: mustang_past
    en: That's it?
    ko: 그게 다야?
    ja: それだけか？
  event_staranis1_03_s_90:
    speaker: hanson
    en: Yes, that's all.
    ko: 예. 그게 답니다.
    ja: はい。それだけです。
  event_staranis1_03_s_91:
    speaker: mustang_past
    en: Sure, twenty billion.
    ko: 200억.
    ja: 200億だ。
  event_staranis1_03_s_92:
    speaker: hanson
    en: You're being unreasonable here.
    ko: 억지를 쓰시는군요.
    ja: 無理をおっしゃいますね。
  event_staranis1_03_s_93:
    speaker: mustang_past
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis1_03_s_94:
    speaker: mustang_past
    en: You're the one being unreasonable!
    ko: 억지는 지금 네가 쓰고 있다!
    ja: 無理はお前の方だろうが！
  event_staranis1_03_s_95:
    speaker: mustang_past
    en: You stormed out of the company like it was nothing, and now you're crawling
      back asking for a song!?
    ko: |-
      이 망할 자식이 멋대로 회사를 때려치고 나가더니,
      이제 와서 곡을 내놓으라고!?
    ja: |-
      バカ野郎が、勝手に出ていったと思えば…
      今度は曲をよこせだと！？
  event_staranis1_03_s_96:
    speaker: mustang_past
    en: Do you and Mrs. Miss think I'm a damn joke?!
    ko: 미세스 미스도 그렇고, 내가 개똥으로 보여? 어!?
    ja: |-
      ミセス・ミスといいお前といい…
      俺のことをナメてるのか！？
  event_staranis1_03_s_97:
    speaker: hanson
    en: I've already shared the reason I left.
    ko: 제가 회사를 나간 이유는 말씀드렸습니다.
    ja: 私の退社理由はしっかりとお伝えしたはずです。
  event_staranis1_03_s_98:
    speaker: mustang_past
    en: "... Hah."
    ko: "…하아."
    ja: "…ハァ…"
  event_staranis1_03_s_99:
    speaker: mustang_past
    en: That damn Pretty.
    ko: 그놈의 프리티, 프리티, 프리티.
    ja: またプリティー、プリティー、プリティーか。
  event_staranis1_03_s_100:
    speaker: mustang_past
    en: She's already a corpse, and the Central Government wanted it, so I gave it
      to them. What's the issue?
    ko: 어차피 뒤진 몸뚱아리, 중앙 정부가 필요하대서 줬는데 그게 왜.
    ja: |-
      死んでボロボロのボディを
      中央政府がよこせと言うから
      引き渡してやっただけだ。それが何だ？
  event_staranis1_03_s_101:
    speaker: mustang_past
    en: I'm a victim here too, you know.
    ko: 나도 피해자다.
    ja: 被害者は俺なんだよ。
  event_staranis1_03_s_102:
    speaker: mustang_past
    en: The leftovers from V.T.C. started going crazy, trying to make enhanced weapons
      or whatever with those scrap bodies.
    ko: V.T.C.의 잔당들이 고철의 바디로 확장 무장인가 뭔가 만드는 바람에 난리가 났다고.
    ja: |-
      V.T.C.の残りカスどもが
      あの残骸を兵器に転用しやがって、
      大スキャンダルになった。
  event_staranis1_03_s_103:
    speaker: mustang_past
    en: After Pretty died, those rust buckets were recognized as living beings, and
      suddenly, everything they did was labeled as biological experimentation.
    ko: |-
      프리티가 죽은 이후 고철이 생명체로 인지되는 바람에,
      그것들이 한 짓이 생체 실험이 되어버렸다고.
    ja: |-
      あいつが死んだ後、鉄くずどもに
      人権が認められたせいで、
      奴らのしたことは生体実験扱いされた。
  event_staranis1_03_s_104:
    speaker: mustang_past
    en: Missilis took that chance and wiped the whole damn V.T.C. off the map.
    ko: 그걸 꼬투리 잡아 미실리스에서 V.T.C.를 싹 다 밀어버렸고.
    ja: それに乗ったミシリスがV.T.C.を粛清して…
  event_staranis1_03_s_105:
    speaker: mustang_past
    en: And guess who had to supply all the materials? Me. All the connections I'd
      built up, gone just like that.
    ko: 나는 그 재료를 제공한 꼴이 되어서 그렇게 공들여 닦아놓은 연줄이 대부분 날아갔어.
    ja: |-
      俺も素材を出していたなんて
      言いがかりをつけられて、
      手間暇かけて築き上げたコネが全部パァだ。
  event_staranis1_03_s_106:
    speaker: mustang_past
    en: So, tell me, who do you think took the biggest hit in all this, huh?
    ko: 여기서 가장 피해를 많이 본 게 누구 같아? 엉?
    ja: |-
      ここまで聞いて、
      一番の被害者は誰になると思う？え？
  event_staranis1_03_s_107:
    speaker: hanson
    en: You're still incapable of thinking of anyone other than yourself.
    ko: 여전히 자기밖에 모르시는군요.
    ja: |-
      相変わらず、
      自分のことしか頭にないようですね。
  event_staranis1_03_s_108:
    speaker: mustang_past
    en: That's how the entertainment world works, Hanson.
    ko: 엔터테인먼트라는 건 그런거다, 한슨.
    ja: |-
      それがエンターテイメントってもんだ、
      ハンソン。
  event_staranis1_03_s_109:
    speaker: mustang_past
    en: As long as I'm enjoying myself, that's all that matters.
    ko: 나만 즐거우면 되는 거야.
    ja: 自分さえ楽しけりゃいいんだよ。
  event_staranis1_03_s_110:
    speaker: mustang_past
    en: And enjoyment? It only comes when someone else is suffering.
    ko: 그리고 즐거움이라는 건 누군가가 괴로워해야 나오는 것이고.
    ja: |-
      その楽しみってのは、
      誰かが苦しまなきゃ生まれてこない。
  event_staranis1_03_s_111:
    speaker: mustang_past
    en: Look at you now, you're enjoying this, aren't you? Because I'm the one in
      pain.
    ko: |-
      지금 봐라.
      넌 즐겁지? 내가 괴로우니까.
    ja: |-
      お前だってそうだ。
      俺の苦労話を聞いて、
      いい気分になっただろう？
  event_staranis1_03_s_112:
    speaker: hanson
    en: I won't deny it.
    ko: 부정하진 않겠습니다.
    ja: 否定はできませんね。
  event_staranis1_03_s_113:
    speaker: mustang_past
    en: "... Ha. How nice."
    ko: "…하. 좋겠군."
    ja: "…フン。まあいい。"
  event_staranis1_03_s_114:
    speaker: mustang_past
    en: So tell me, why should I give you a song?
    ko: 그래서, 내가 너한테 곡을 줘야 하는 이유는?
    ja: |-
      それで、俺がお前に曲を出すとして、
      お前は何を出せるんだ？
  event_staranis1_03_s_115:
    speaker: hanson
    en: If you help me this time, I'll be sure to return.
    ko: 이번만 도와주시면 다시 돌아오겠습니다.
    ja: |-
      今回だけ力を貸していただければ、
      ここへ戻ります。
  event_staranis1_03_s_116:
    speaker: mustang_past
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_staranis1_03_s_117:
    speaker: hanson
    en: But that's only if things don't go well.
    ko: 단, 잘 풀리지 않았을 때 얘기입니다.
    ja: ただし、ヒットしなければ、という条件です。
  event_staranis1_03_s_118:
    speaker: mustang_past
    en: And if it does?
    ko: 잘 되면.
    ja: ヒットした時は？
  event_staranis1_03_s_119:
    speaker: hanson
    en: Consider it an investment in the Ark's next star.
    ko: 그럼 그냥 방주의 별에 투자했다고 생각해 주십시오.
    ja: |-
      アークのスターに投資できたと
      思ってください。
  event_staranis1_03_s_120:
    speaker: mustang_past
    en: "... Ha,"
    ko: "…하."
    ja: "…クク…"
  event_staranis1_03_s_121:
    speaker: mustang_past
    en: haha. You're insane,
    ko: 하하. 미친놈.
    ja: ハハハ…イカれてるな。
  event_staranis1_03_s_122:
    speaker: mustang_past
    en: but I like it.
    ko: 마음에 들어.
    ja: 面白い。
  event_staranis1_03_s_123:
    speaker: mustang_past
    en: "... If you'd played your cards right earlier, this would've been way more
      fun. Don't you think?"
    ko: "…진작에 이랬으면 더 재미있었을 텐데, 안 그래?"
    ja: |-
      …早くこうしていれば
      もっと楽しめただろうにな、そうだろう？
  event_staranis1_03_s_124:
    speaker: hanson
    en: I regret that too.
    ko: 저도 그건 좀 후회하고 있습니다.
    ja: 私もそこは少し後悔しています。
  event_staranis1_03_s_125:
    speaker: mustang_past
    en: You've really changed, Hanson.
    ko: 많이 변했구나, 한슨.
    ja: ずいぶん変わったな、ハンソン。
  event_staranis1_03_s_126:
    speaker: hanson
    en: Yes, I felt that I'd be stuck in the same place if I didn't change.
    ko: 예. 변하지 않으면 계속 같은 일을 겪을 것 같았으니까요.
    ja: |-
      ええ。変わらなければ、
      同じことが繰り返されるだけですから。
  event_staranis1_03_s_127:
    speaker: mustang_past
    en: And those girls you're managing now, you won't let them end up like Pretty?
    ko: 지금 네가 키우는 애들은 같은 결과를 맞이하게 두지 않을 거다?
    ja: お前が今育てている奴らには、そうさせないと？
  event_staranis1_03_s_128:
    speaker: hanson
    en: No, I won't.
    ko: 물론입니다.
    ja: 当然です。
  event_staranis1_03_s_129:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_130:
    speaker: mustang_past
    en: Yoyo.
    ko: 요요.
    ja: ヨヨ。
  event_staranis1_03_s_131:
    speaker: yoyo
    en: Yes?
    ko: 예?
    ja: 何でしょう？
  event_staranis1_03_s_132:
    speaker: mustang_past
    en: I'll be giving him the next song you were preparing.
    ko: 준비 중이던 네 다음 곡을 줄 거다.
    ja: |-
      お前の次の曲として進めてたもの、
      こいつに回す。
  event_staranis1_03_s_133:
    speaker: yoyo
    en: As you like.
    ko: 뭐, 그러시던지요.
    ja: はい、お好きなように。
  event_staranis1_03_s_134:
    speaker: mustang_past
    en: What's this? Why are you so compliant all of a sudden?
    ko: 뭐야. 왜 이리 고분고분해.
    ja: 何だ？やけに聞き分けがいいな。
  event_staranis1_03_s_135:
    speaker: yoyo
    en: I happen to be interested in T.T. STAR myself.
    ko: |-
      저도 개인적으로 관심 있거든요.
      T.T. STAR한테.
    ja: |-
      私も個人的に興味があるんです。
      T.T. STARには。
  event_staranis1_03_s_136:
    speaker: mustang_past
    en: A rivalry, huh? They're nowhere near your level.
    ko: |-
      라이벌 의식 같은 건가?
      수준 차이가 너무 나는데.
    ja: |-
      ライバル意識か？
      比較にもならんだろう。
  event_staranis1_03_s_137:
    speaker: yoyo
    en: It's personal. This has nothing to do with them as pop stars.
    ko: |-
      개인적인 관심이에요.
      아이돌로서가 아니라.
    ja: |-
      個人的な関心です。
      アイドルとは関係ありません。
  event_staranis1_03_s_138:
    speaker: mustang_past
    en: Hmph, looks like you've got too much time on your hands.
    ko: 흥. 한가한가 보군.
    ja: フン。スケジュールを空けすぎだな。
  event_staranis1_03_s_139:
    speaker: mustang_past
    en: You got someone who can arrange the music?
    ko: 그래서, 편곡은 할 수 있나?
    ja: それで、編曲はできるのか？
  event_staranis1_03_s_140:
    speaker: hanson
    en: Yes, we have someone who can take care of that.
    ko: 예. 할 수 있는 멤버가 있습니다.
    ja: はい。それはこちらで。
  event_staranis1_03_s_141:
    speaker: mustang_past
    en: Hah, lucky for you.
    ko: 그래. 그거참 다행이군.
    ja: そうか。ならいい。
  event_staranis1_03_s_142:
    speaker: "<Narration>"
    en: Mustang makes a call.
    ko: 머스탱이 전화를 건다.
    ja: |-
      マスタングが携帯端末を取りだし、
      通話を始めた
  event_staranis1_03_s_143:
    speaker: mustang_past
    en: Give Yoyo's next song to the guy leaving my office.
    ko: 요요 다음 곡. 그거 좀 이따 여기서 나가는 녀석한테 줘.
    ja: |-
      ヨヨの次の曲の件だ。
      もうすぐここから出てくる奴がいる。
      そいつに渡せ。
  event_staranis1_03_s_144:
    speaker: mustang_past
    en: Shut up and just do it. We're not using it.
    ko: 잔말 말고 줘. 우리는 그거 이제 안 쓴다.
    ja: いいから渡せ。もう必要ない。
  event_staranis1_03_s_145:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ
  event_staranis1_03_s_146:
    speaker: mustang_past
    en: That's enough. Get out.
    ko: 됐어. 나가봐.
    ja: さあ、とっとと行け。
  event_staranis1_03_s_147:
    speaker: mustang_past
    en: Just remember, if you fail, you'll come back.
    ko: 잊지 마라. 망하면 다시 돌아오는 거다.
    ja: |-
      忘れるんじゃないぞ。
      ヒットしなければ、家出は終わりだ。
  event_staranis1_03_s_148:
    speaker: hanson
    en: Understood.
    ko: 알겠습니다.
    ja: 分かっています。
  event_staranis1_03_s_149:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_150:
    speaker: hanson
    en: Take good care of yourself.
    ko: 건강 관리. 잘하십쇼.
    ja: 身体にはお気をつけて。
  event_staranis1_03_s_151:
    speaker: mustang_past
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_152:
    speaker: "<Narration>"
    en: Hanson dips his head slightly and turns to leave.
    ko: 한슨이 고개를 꾸벅 숙이고 뒤돌아 걸어 나간다.
    ja: ハンソンは頭を下げ、部屋を出ようとした
  event_staranis1_03_s_153:
    speaker: mustang_past
    en: That's all I get?
    ko: 인사는?
    ja: それがあいさつか？
  event_staranis1_03_s_154:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_s_155:
    speaker: mustang_past
    en: You can at least show some gratitude, you ungrateful bastard.
    ko: |-
      도와주셔서 감사합니다, 아버지.
      정도는 말해라 망할 아들 자식아.
    ja: |-
      「助けてくれてありがとう、父さん」
      ぐらいは言ったらどうだ、バカ息子が。
  event_staranis1_03_s_156:
    speaker: hanson
    en: "... Thank you for your help, Father."
    ko: "…도와주셔서 감사합니다. 아버지."
    ja: 助けてくれてありがとう、父さん。
  event_staranis1_03_s_157:
    speaker: mustang_past
    en: Hmph, don't act like I made you do it.
    ko: 흥. 엎드려 절받는 것도 아니고.
    ja: |-
      チッ。
      いかにも言わされてるような態度で言うな。
event_staranis1_03_e:
  event_staranis1_03_e_1:
    speaker: anis_human
    en: No way, an original song?
    ko: 오, 오리지널 곡?
    ja: オ、オリジナル曲？
  event_staranis1_03_e_2:
    speaker: hanson
    en: Yes, that's right.
    ko: 그래.
    ja: ああ。
  event_staranis1_03_e_3:
    speaker: anis_human
    en: Where did you even get this...?
    ko: 아니, 이걸 어디서….
    ja: そんなもの、どうやって…
  event_staranis1_03_e_4:
    speaker: hanson
    en: I managed to pull it off through some solid outreach.
    ko: 영업 뛰어서 받아왔지.
    ja: 必死に営業した結果だ。
  event_staranis1_03_e_5:
    speaker: anis_human
    en: What kind of outreach nets you a song?!
    ko: 무슨 영업을 어떻게 뛰면 곡이 나오냐고요.
    ja: |-
      どうやったら営業努力で
      曲が出てくるって言うんですか？
  event_staranis1_03_e_6:
    speaker: hanson
    en: That's a trade secret.
    ko: 기업 비밀이야.
    ja: 部外秘だ。
  event_staranis1_03_e_7:
    speaker: anis_human
    en: Aren't we on the same team?
    ko: 같은 기업 소속 아닌가요 우리.
    ja: 私たち、部外者じゃないと思いますけど。
  event_staranis1_03_e_8:
    speaker: hanson
    en: Well, the higher you go, the tighter the security gets.
    ko: 어허. 같은 기업일수록 보안은 더 철저해야 하는 법이야.
    ja: |-
      いいや。社内の人間同士こそ、
      セキュリティ上の手続きは
      より厳しく守るべきだ。
  event_staranis1_03_e_9:
    speaker: hanson
    en: Anyway, this is a solo track, so we'll need to arrange it for a trio.
    ko: |-
      그런데 이거 솔로곡인 상태야.
      3인조 곡으로 편곡해야 하는데.
    ja: |-
      とはいえ、もともとはソロの曲だ。
      これをトリオ向けに編曲する必要がある。
  event_staranis1_03_e_10:
    speaker: hanson
    en: Prika, think you can handle it?
    ko: 프리카, 할 수 있겠어?
    ja: プリカ、できそうか？
  event_staranis1_03_e_11:
    speaker: prika
    en: Yes, I can.
    ko: 예. 할 수 있어요.
    ja: もちろん、任せてくれ。
  event_staranis1_03_e_12:
    speaker: mint
    en: Wait, you know how to do that?
    ko: 뭐야. 그런 것도 할 줄 알아?
    ja: ウソ、そんなこともできるの？
  event_staranis1_03_e_13:
    speaker: prika
    en: It's literally what I majored in.
    ko: 그런 것도가 아니라, 이게 내 전공이야.
    ja: |-
      そんなこともっていうか、
      本当はこっちが私の専門なんだ。
  event_staranis1_03_e_14:
    speaker: mint
    en: In that case, make sure I get the most lines.
    ko: 그럼 내 파트 제일 많게 해줘.
    ja: なら、私のパートを一番多くして。
  event_staranis1_03_e_15:
    speaker: prika
    en: Let me have a look.
    ko: 그럼 한 번 볼게요.
    ja: とにかく、一度聞いてみる。
  event_staranis1_03_e_16:
    speaker: mint
    en: So you're just going to ignore me?
    ko: 무시하네.
    ja: 無視しないでよ～
  event_staranis1_03_e_17:
    speaker: "<Narration>"
    en: Prika plugs the USB into the computer and checks what's inside.
    ko: 프리카가 USB를 PC에 연결하고 내용물을 확인한다.
    ja: |-
      プリカがUSB端末をパソコンに接続し、
      中身を確かめた
  event_staranis1_03_e_18:
    speaker: anis_human
    en: S-so, how's it? Is it a good song?
    ko: 어, 어때? 노래 좋아?
    ja: ど、どう？よさげな曲？
  event_staranis1_03_e_19:
    speaker: prika
    en: Hmm...
    ko: "…으음."
    ja: "…んー…"
  event_staranis1_03_e_20:
    speaker: mint
    en: What's wrong? Is it bad?
    ko: 왜 그래? 별로야?
    ja: どうしたの？もしかしてイマイチ？
  event_staranis1_03_e_21:
    speaker: hanson
    en: Guys... we haven't even heard it yet.
    ko: "…얘들아. 아직 듣지도 않았잖니."
    ja: "…2人とも…まだ聞いてもいないだろう。"
  event_staranis1_03_e_22:
    speaker: prika
    en: Boss.
    ko: 사장님.
    ja: 社長。
  event_staranis1_03_e_23:
    speaker: hanson
    en: What is it?
    ko: 왜?
    ja: なんだ？
  event_staranis1_03_e_24:
    speaker: prika
    en: How much money do we have?
    ko: 우리 회삿돈 얼마나 있어요?
    ja: うちの会社、どのくらい金を持ってる？
  event_staranis1_03_e_25:
    speaker: hanson
    en: Why do you ask?
    ko: 갑자기 그건 왜.
    ja: 急にどうした。
  event_staranis1_03_e_26:
    speaker: prika
    en: If we don't have the software for this, we can't even open it, let alone edit
      it.
    ko: 이거 전용 프로그램 없으면 편집은 고사하고 열지도 못해요.
    ja: |-
      これ、専用のプログラムがないと、
      編集どころか再生もできないやつだ。
  event_staranis1_03_e_27:
    speaker: prika
    en: It's a custom program made by Tetra Line...
    ko: 테트라 라인에서 만든 전용 프로그램인데
    ja: テトラライン製のソフトウェアで…
  event_staranis1_03_e_28:
    speaker: prika
    en: "... and it's priced at around 200 million."
    ko: "…정가가 2억 정도 해요."
    ja: "…定価は2億ぐらいする。"
  event_staranis1_03_e_29:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_30:
    speaker: anis_human
    en: What kind of program costs 200 million?!
    ko: 아니 무슨 프로그램이 2억이나 해.
    ja: プログラムひとつに2億！？ありえないでしょ。
  event_staranis1_03_e_31:
    speaker: prika
    en: That's the scary thing about monopolies.
    ko: 독과점이 이래서 무서운 거야.
    ja: 独占企業の恐ろしさだな。
  event_staranis1_03_e_32:
    speaker: hanson
    en: All right, I'll figure something out.
    ko: 좋아. 내가 어떻게든 마련해 볼게.
    ja: 分かった、なんとか工面しよう。
  event_staranis1_03_e_33:
    speaker: anis_human
    en: How?
    ko: 오. 어떻게요?
    ja: え、できるんですか？
  event_staranis1_03_e_34:
    speaker: hanson
    en: I know a place I can borrow from. It's called Wow Finance.
    ko: |-
      빌릴만한 곳이 있어.
      와우와우 파이낸스라고.
    ja: |-
      借りられそうなところがある。
      ワウワウファイナンスと言ったかな。
  event_staranis1_03_e_35:
    speaker: anis_human
    en: Sounds shady as hell!
    ko: 딱 들어도 사채구만!
    ja: どう考えてもヤバい所でしょ、それ！
  event_staranis1_03_e_36:
    speaker: mint
    en: There's something I've been curious about for a while.
    ko: 그런데 저 예전부터 궁금한 게 있었는데.
    ja: ところで、前から気になってたんですけど…
  event_staranis1_03_e_37:
    speaker: mint
    en: If you were a director at Tetra, how is it that you don't seem to have much
      money?
    ko: 사장님 테트라에서 이사까지 했으면 왜 그렇게 돈이 없어요?
    ja: |-
      社長ってテトラで理事まで務めてたのに
      どうしてそんなにお金がないんですか？
  event_staranis1_03_e_38:
    speaker: hanson
    en: They told me if I was leaving, I had to hand over everything—stocks and all—so
      I did.
    ko: 나갈 거면 스톡이니 뭐니 다 내놓고 가라고 하길래 다 내놓고 왔지.
    ja: |-
      辞めるなら株も何もかも
      置いていけと言われたからな。
  event_staranis1_03_e_39:
    speaker: mint
    en: Is that legal?
    ko: 그게 그렇게 되는 거예요?
    ja: だからって、言う通りにしたんですか？
  event_staranis1_03_e_40:
    speaker: hanson
    en: I was done talking to them, so I just did as I was told and left.
    ko: 더는 말 섞기도 싫어서 그런다고 하고 나왔어.
    ja: |-
      それ以上口も利きたくなかったから、
      言われた通りにしてそのまま飛び出したんだ。
  event_staranis1_03_e_41:
    speaker: mint
    en: Why?
    ko: 왜요?
    ja: どうして？
  event_staranis1_03_e_42:
    speaker: hanson
    en: I'd rather not say.
    ko: 비밀이야.
    ja: 秘密だ。
  event_staranis1_03_e_43:
    speaker: anis_human
    en: "... Now that I think about it, you've never told us this."
    ko: "…그러고 보니 이런 얘기는 한 번도 한 적 없네요."
    ja: |-
      …そういえば、その話って一度も
      詳しく聞いたことなかったですよね。
  event_staranis1_03_e_44:
    speaker: anis_human
    en: Boss, why'd you leave Tetra?
    ko: 사장님. 왜 테트라에서 나온 거예요?
    ja: 社長、なんでテトラを辞めたんですか？
  event_staranis1_03_e_45:
    speaker: anis_human
    en: Honestly, Tetra's an amazing company, like a treasure trove of entertainment.
    ko: |-
      솔직히 테트라면 진짜 좋은 회사잖아요.
      엔터테인먼트의 보고 같은 느낌이고.
    ja: |-
      テトラって、立派な大企業じゃないですか。
      エンタメって言えば必ず出て来るし。
  event_staranis1_03_e_46:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_47:
    speaker: hanson
    en: That's really not something for kids to worry about.
    ko: |-
      어린애들이 뭘 알겠냐.
      다 어른만의 사정이 있는 거야.
    ja: |-
      まだ若い君たちには分からなくていい。
      大人の事情というものがあるんだ。
  event_staranis1_03_e_48:
    speaker: prika
    en: All right, cut the chatter. Let's figure this out.
    ko: 갑자기 수다 떨지들 말고, 이거 어떻게 할지 같이 고민해 보는 게 어떨까.
    ja: |-
      昔話より、こっちをどうするか
      早く考えた方がいいんじゃないか？
  event_staranis1_03_e_49:
    speaker: hanson
    en: What's there to worry about? I'll just borrow the money. One call and it's
      done.
    ko: |-
      뭔 고민이야. 돈 빌린다니까.
      전화 한 통이면 바로 해결돼.
    ja: |-
      心配ない。借りればいい。
      電話一本即日融資、だそうだ。
  event_staranis1_03_e_50:
    speaker: anis_human
    en: No, don't even go near those loan sharks.
    ko: 아니 사채 쓸 생각하지 말고요.
    ja: だから、そういうとこは止めてください。
  event_staranis1_03_e_51:
    speaker: yoyo
    en: Do pardon me.
    ko: 실례합니다.
    ja: 失礼します。
  event_staranis1_03_e_52:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_53:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_54:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_55:
    speaker: yoyo
    en: The door was open. Hope you don't mind.
    ko: 문이 열려있길래 그냥 들어왔는데, 괜찮나요?
    ja: |-
      ドアが開けっ放しだったので
      お邪魔してしまいましたが、
      大丈夫でしたか？
  event_staranis1_03_e_56:
    speaker: anis_human
    en: "... Who are you?"
    ko: "…누구야?"
    ja: "…誰？"
  event_staranis1_03_e_57:
    speaker: mint
    en: "... It's Yoyo."
    ko: "…요요다."
    ja: "…ヨヨ。"
  event_staranis1_03_e_58:
    speaker: anis_human
    en: Yoyo?
    ko: 요요?
    ja: ヨヨ？
  event_staranis1_03_e_59:
    speaker: prika
    en: The number-one singer on the charts.
    ko: 아이돌 랭킹 1위.
    ja: アイドルランキング1位の。
  event_staranis1_03_e_60:
    speaker: anis_human
    en: Huh...?
    ko: "…응?"
    ja: えっ…？
  event_staranis1_03_e_61:
    speaker: hanson
    en: Yoyo... what are you doing here?
    ko: "…요요 씨가 왜 여기…."
    ja: "…どうしてここへ…"
  event_staranis1_03_e_62:
    speaker: yoyo
    en: If I may.
    ko: 잠시만 실례할게요.
    ja: ちょっと失礼しますね…
  event_staranis1_03_e_63:
    speaker: "<Narration>"
    en: Yoyo strides in,
    ko: 요요가 성큼성큼 걸어온다.
    ja: |-
      ヨヨは何もおかしいことはないと
      言わんばかりの態度で部屋に入った
  event_staranis1_03_e_64:
    speaker: "<Narration>"
    en: eyes locking with Anis for a moment. Then, she passes a USB to Prika, who
      remains seated at the computer.
    ko: 아니스와 눈을 한번 마주친 후, PC 앞에 앉아 있는 프리카에게 USB를 건낸다.
    ja: |-
      彼女はアニスをちらりと横目で見た後、
      パソコンの前に座っていたプリカに
      USB端末を差し出した
  event_staranis1_03_e_65:
    speaker: prika
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_staranis1_03_e_66:
    speaker: yoyo
    en: Here's the program and manual.
    ko: 프로그램이랑 매뉴얼이에요.
    ja: 編集ソフトと操作マニュアルです。
  event_staranis1_03_e_67:
    speaker: yoyo
    en: They're all yours.
    ko: 이걸 써요.
    ja: 使ってください。
  event_staranis1_03_e_68:
    speaker: prika
    en: "?"
    ko: "??"
    ja: "？？"
  event_staranis1_03_e_69:
    speaker: mint
    en: Hang on, we don't use pirated software.
    ko: 아, 잠깐만요. 저희 불법 프로그램은 안 써요.
    ja: |-
      あの、待ってください。
      私たち、違法なものは…
  event_staranis1_03_e_70:
    speaker: yoyo
    en: Don't be ridiculous.
    ko: 불법이겠어요 이게?
    ja: そんなものを渡したりはしませんよ？
  event_staranis1_03_e_71:
    speaker: yoyo
    en: It's an unused company account I grabbed. Go ahead, use it.
    ko: 회사에 남는 계정 받아온 거니까 마음 놓고 써요.
    ja: |-
      会社で使われていない
      アカウントをもらいました。
      安心して、ご自由に使ってください。
  event_staranis1_03_e_72:
    speaker: prika
    en: Uh... Sweet, thanks?
    ko: 어… 그래. 고마… 워?
    ja: ええと…うん、ありがとう…？
  event_staranis1_03_e_73:
    speaker: yoyo
    en: Don't mention it.
    ko: 별말씀을요.
    ja: どういたしまして。
  event_staranis1_03_e_74:
    speaker: hanson
    en: Yoyo, why the sudden...?
    ko: 요요 씨. 왜 갑자기….
    ja: 失礼ながら、なぜ急に…
  event_staranis1_03_e_75:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_76:
    speaker: "<Narration>"
    en: Yoyo stares straight at Anis.
    ko: 요요가 아니스를 빤히 바라본다.
    ja: ヨヨはアニスに視線を送っていた
  event_staranis1_03_e_77:
    speaker: anis_human
    en: "?"
    ko: "??"
    ja: "？？"
  event_staranis1_03_e_78:
    speaker: yoyo
    en: Anis, mind if we talk for a moment?
    ko: 아니스. 잠깐 저랑 얘기 좀 하실까요?
    ja: アニス。ちょっといいですか？
  event_staranis1_03_e_79:
    speaker: anis_human
    en: Huh? Me?
    ko: 응? 나?
    ja: え？私？
  event_staranis1_03_e_80:
    speaker: yoyo
    en: Yes, you.
    ko: 예. 당신이요.
    ja: はい。あなたです。
  event_staranis1_03_e_81:
    speaker: "<Narration>"
    en: Anis looks around, bewildered.
    ko: 아니스가 어리둥절한 표정으로 주위를 둘러본다.
    ja: アニスはあっけに取られた顔で周囲を見回した
  event_staranis1_03_e_82:
    speaker: "<Narration>"
    en: Every face she sees mirrors her own expression.
    ko: 주위에 있는 사람들 모두 아니스와 똑같은 표정을 한 채 아니스를 본다.
    ja: |-
      周りも皆、アニスと同じような表情で
      アニスを見ている
  event_staranis1_03_e_83:
    speaker: anis_human
    en: Uh... Sure.
    ko: 어… 그래.
    ja: ええと…うん。
  event_staranis1_03_e_84:
    speaker: yoyo
    en: Let's step outside, shall we?
    ko: 밖에 나가죠.
    ja: 外でお話ししましょう。
  event_staranis1_03_e_85:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_86:
    speaker: anis_human
    en: What?
    ko: 왜, 왜?
    ja: あの、なんで？
  event_staranis1_03_e_87:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_88:
    speaker: anis_human
    en: Wh-why are you staring at me like that?
    ko: 뭐, 뭐야. 뭘 그렇게 빤히 쳐다봐?
    ja: |-
      ちょ、ちょっと。
      どうしてそんなに見てくるの？
  event_staranis1_03_e_89:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_90:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_91:
    speaker: anis_human
    en: Oh, I get it now.
    ko: 아. 알겠다.
    ja: あ、分かった。
  event_staranis1_03_e_92:
    speaker: anis_human
    en: So the charts are settled with fists, huh?
    ko: 아이돌 랭킹이라는 거, 주먹질로 결정되는 건가 보네.
    ja: アイドルランキングって、ケンカで決めるのね。
  event_staranis1_03_e_93:
    speaker: anis_human
    en: Fine, bring it on. Starting today, I'm number one.
    ko: 좋아 덤벼. 오늘부터 내가 1위다.
    ja: |-
      いいわ、かかってくれば？
      今日から私が1位よ。
  event_staranis1_03_e_94:
    speaker: yoyo
    en: What exactly are you talking about?
    ko: 무슨 소릴 하시는 건가요?
    ja: 何を言ってるの？
  event_staranis1_03_e_95:
    speaker: anis_human
    en: How the heck am I supposed to know? You don't say anything.
    ko: 아니야? 뭔 말을 안 해주니 알 수가 있나.
    ja: |-
      違った？
      何か言ってくれないと分かんないでしょ。
  event_staranis1_03_e_96:
    speaker: yoyo
    en: You don't remember me?
    ko: 저 기억 안 나요?
    ja: 私のこと、忘れちゃった？
  event_staranis1_03_e_97:
    speaker: anis_human
    en: Huh? Remember you? Have we met?
    ko: |-
      …?
      무슨 기억? 우리 만난 적이 있어?
    ja: |-
      …？忘れた？
      私たち、会ったことある？
  event_staranis1_03_e_98:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_99:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_100:
    speaker: "<Narration>"
    en: Anis stares at Yoyo's face.
    ko: 아니스는 요요의 얼굴을 빤히 바라본다.
    ja: アニスはヨヨの顔をのぞき込んだ
  event_staranis1_03_e_101:
    speaker: "<Narration>"
    en: The longer she looks, the more familiar the features seem.
    ko: 어째서인지, 익숙한 이목구비가 조금씩 보이기 시작했다.
    ja: |-
      おぼろげな記憶の中にある、
      見覚えのある面影が重なった
  event_staranis1_03_e_102:
    speaker: anis_human
    en: Wait, hold up...
    ko: "…너 설마."
    ja: "…あなた、まさか。"
  event_staranis1_03_e_103:
    speaker: anis_human
    en: You're the class president?
    ko: 반장이야?
    ja: 委員長？
  event_staranis1_03_e_104:
    speaker: yoyo
    en: "... Yeah."
    ko: "…그래."
    ja: "…そうよ。"
  event_staranis1_03_e_105:
    speaker: "<Narration>"
    en: Anis jolts, stumbling back in shock.
    ko: 아니스가 화들짝 놀라며 뒷걸음친다.
    ja: アニスは驚きに足を取られ、後ずさった
  event_staranis1_03_e_106:
    speaker: anis_human
    en: What...? Why are you—
    ko: 뭐… 야. 네가 왜….
    ja: ウソ…でしょ。なんで…
  event_staranis1_03_e_107:
    speaker: yoyo
    en: I became a Nikke too, to become a pop star.
    ko: 나도 니케가 됐어. 아이돌이 되려고.
    ja: |-
      私もニケになったのよ。
      アイドルになるために。
  event_staranis1_03_e_108:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_109:
    speaker: anis_human
    en: What, you weren't satisfied making my life hell when we were human? You wanna
      keep it up now that we're Nikkes too?
    ko: |-
      너. 사람일 때도 날 못 잡아먹어서 안달이더니,
      니케가 되어서도 그러고 싶어?
    ja: |-
      あなた…昔も私のことを
      思い通りにならない邪魔者扱いしてたけど、
      ニケになっても同じことをするつもり？
  event_staranis1_03_e_110:
    speaker: anis_human
    en: Look, I'm just trying to live my life here, all right? I'm doing the best
      I can, and even that's hard enough as it is.
    ko: |-
      나 말이야. 지금 열심히 살고 있거든?
      그런데도 많이 힘들거든?
    ja: |-
      私ね…今、一生懸命生きてるの。
      それも苦労しながら。
  event_staranis1_03_e_111:
    speaker: anis_human
    en: If you pile one more thing on top of that, I swear I'm gonna lose it.
    ko: 여기서 더 힘든 일이 생기면 진짜 돌아버릴 것 같거든?
    ja: |-
      これ以上つらいことが増えたら、
      本当におかしくなりそうなぐらい。
  event_staranis1_03_e_112:
    speaker: anis_human
    en: So do me a favor and stay the hell out of my life.
    ko: 그러니까. 제발 부탁이니까 내 인생에서 좀 꺼져줄래?
    ja: |-
      だからさ…お願いだから、
      もう私の人生に出てこないでくれない？
  event_staranis1_03_e_113:
    speaker: yoyo
    en: I'm sorry.
    ko: 미안해.
    ja: ごめんなさい。
  event_staranis1_03_e_114:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_115:
    speaker: anis_human
    en: What?
    ko: 뭐?
    ja: は？
  event_staranis1_03_e_116:
    speaker: yoyo
    en: "... I'm sorry."
    ko: "…미안해."
    ja: "…本当に、ごめんなさい。"
  event_staranis1_03_e_117:
    speaker: yoyo
    en: For the way I treated you back at school. I truly am.
    ko: 학교에서 그렇게 괴롭혔던 거, 진심으로 사과할게.
    ja: 学校の時のことは、心から謝るわ。
  event_staranis1_03_e_118:
    speaker: yoyo
    en: I'm sorry for hurting you, for being cruel.
    ko: 상처 주고, 못되게 굴었던 거 정말 미안해.
    ja: |-
      傷つけて、ひどいことして、
      本当にごめんなさい。
  event_staranis1_03_e_119:
    speaker: "<Narration>"
    en: Yoyo bows deeply as she apologizes.
    ko: 요요가 허리를 깊게 숙이며 사과한다.
    ja: ヨヨが深く頭を下げた
  event_staranis1_03_e_120:
    speaker: yoyo
    en: You were a thorn in my side.
    ko: 눈엣가시였어. 너는.
    ja: 目ざわりだと思ってたの、あなたのこと。
  event_staranis1_03_e_121:
    speaker: yoyo
    en: You showed up out of nowhere, and it felt like you were taking everything
      from me. I hated you for it.
    ko: 갑자기 나타나서 내가 가진 것들을 빼앗아 가는 것 같아서 너무 싫었어.
    ja: |-
      私が持っていた物、
      全部取られるような気がして、
      すごくイヤだったの。
  event_staranis1_03_e_122:
    speaker: yoyo
    en: Because you had nothing, yet you were taking things from people who had everything.
    ko: 아무것도 가지지 않아서, 다 가진 사람의 것을 빼앗아 간다고 생각했었어.
    ja: |-
      何にも持ってないから、何でも持ってる私から
      奪おうとしてるんだって、思ってた。
  event_staranis1_03_e_123:
    speaker: anis_human
    en: Hey, that's going a bit too far.
    ko: 이게 또 심한 말 하네.
    ja: 堂々と言ってくれるじゃない。
  event_staranis1_03_e_124:
    speaker: yoyo
    en: "... When you became a Nikke after your accident, I heard you were preparing
      to debut as a pop star."
    ko: "…네가 사고를 당해 니케가 된 후, 아이돌을 준비한다는 얘기를 전해 들었어."
    ja: |-
      …あなたが事件に巻き込まれた後ニケになって、
      アイドルを目指してるって聞いたから…
  event_staranis1_03_e_125:
    speaker: yoyo
    en: I begged my father to let me become a Nikke too. I worked myself to the bone
      just so I could crush you.
    ko: 나도 아버지를 졸라 니케가 되었고, 아이돌이 되어서 널 깔아뭉갤 생각으로만 열심히 했어.
    ja: |-
      私もパパに頼み込んでニケになったの。
      アイドルになって、あなたを
      蹴落としてやるって、必死にがんばって。
  event_staranis1_03_e_126:
    speaker: yoyo
    en: "... But somewhere along the way, I realized something."
    ko: "…그러던 중, 깨달았어."
    ja: "…そうしてるうちに、気づいたのよ。"
  event_staranis1_03_e_127:
    speaker: yoyo
    en: Just how hard you'd been working all this time,
    ko: 네가 얼마나 노력했는지.
    ja: あなたがどれだけ頑張ってたか。
  event_staranis1_03_e_128:
    speaker: yoyo
    en: how desperately you wanted to be loved, and how much effort you put in to
      earn it.
    ko: 사랑받고 싶어서, 얼마나 많은 노력을 했는지 알게 됐어.
    ja: |-
      皆から愛されたいって、
      どれだけ努力してたかよく分かったわ。
  event_staranis1_03_e_129:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_130:
    speaker: yoyo
    en: When you were the cheer captain, I pretended not to see all those hours you
      spent practicing and preparing.
    ko: 응원 단장을 맡았을 때, 그렇게 오랫동안 연습하고 준비하던 걸 못 본 척했어.
    ja: |-
      応援のリーダーになった時も、
      ずっと頑張って練習してるのは知ってたのに、
      見ないふりしてたの。
  event_staranis1_03_e_131:
    speaker: yoyo
    en: I convinced myself you were just taking what should've been mine.
    ko: 그저 내 걸 빼앗아 간다고만 생각했어.
    ja: ただ、私のものが奪われるって怖くて。
  event_staranis1_03_e_132:
    speaker: yoyo
    en: But once I tried to earn recognition myself, I finally understood
    ko: 해보니까 알겠더라.
    ja: でも、やってみて分かったわ。
  event_staranis1_03_e_133:
    speaker: yoyo
    en: how difficult it is to be acknowledged by others,
    ko: 남한테 인정받는 게 얼마나 힘든 일인지.
    ja: 誰かに認めてもらうって、どんなに大変か。
  event_staranis1_03_e_134:
    speaker: yoyo
    en: and how much you have to put on the line to make it happen.
    ko: 그걸 이뤄내려면 얼마나 많은 걸 걸어야 하는지.
    ja: |-
      そのために、どれだけのものを
      犠牲にしなきゃいけないのかも。
  event_staranis1_03_e_135:
    speaker: "<Narration>"
    en: Yoyo lifts her head.
    ko: 요요가 고개를 든다.
    ja: ヨヨが顔を上げた
  event_staranis1_03_e_136:
    speaker: yoyo
    en: I've done a lot of reflecting, and I still am.
    ko: 나 정말 많이 반성했고, 반성하고 있어.
    ja: 何度も思い返して、後悔してるの。
  event_staranis1_03_e_137:
    speaker: yoyo
    en: The program and manual... consider them a small gesture from me.
    ko: 프로그램과 매뉴얼은 내 작은 성의야.
    ja: |-
      あのプログラムとマニュアルは、
      せめてもの償いのつもりよ。
  event_staranis1_03_e_138:
    speaker: yoyo
    en: I'll help however I can from here on out, if you'll let me...
    ko: 이후에도 힘닿는 데까진 도와줄 테니까….
    ja: これからも出来るだけ、協力するから…
  event_staranis1_03_e_139:
    speaker: yoyo
    en: "... Will you forgive me?"
    ko: 나… 용서해 줄래?
    ja: 私のこと…許してもらえない？
  event_staranis1_03_e_140:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_141:
    speaker: anis_human
    en: Are you out of your damn mind?
    ko: 미쳤냐.
    ja: 正気？
  event_staranis1_03_e_142:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_143:
    speaker: anis_human
    en: If it were you, would you forgive me?
    ko: 너 같으면 용서하겠냐고.
    ja: 逆だったら許すわけ？
  event_staranis1_03_e_144:
    speaker: anis_human
    en: Huh?! Would you?!
    ko: 엉? 너 같으면 용서하겠냐고!
    ja: ねえ？あんただったら許すわけ！？
  event_staranis1_03_e_145:
    speaker: anis_human
    en: You bastard, after everything you put me through...!
    ko: 너 이 새X, 그렇게 나를…!
    ja: ふざけんじゃないわよ…！
  event_staranis1_03_e_146:
    speaker: anis_human
    en: You made me want to die, and now you think one lousy apology makes it all
      go away?!
    ko: |-
      죽고 싶을 만큼 괴롭게 했으면서!
      이제 와서 말 한마디로 퉁치자고!?
    ja: |-
      こっちは毎日死にたいぐらいだったのに！
      今さら、言葉一つで水に流せって！？
  event_staranis1_03_e_147:
    speaker: anis_human
    en: I still wake up in the middle of the night thinking about that day!
    ko: |-
      내가 요즘에도 자다가 벌떡벌떡 일어나!
      그때 일이 생각나가지고!
    ja: |-
      今でも急に目が覚めるのよ！？
      あの時のことを思い出して！
  event_staranis1_03_e_148:
    speaker: anis_human
    en: Oh, what? So you turned yourself into a Nikke just to step on me?
    ko: 아~ 나를 밟고 싶어서 니케까지 되셨어?
    ja: 私に勝つために、わざわざニケになった？
  event_staranis1_03_e_149:
    speaker: anis_human
    en: And now you're the chart-topping pop star?
    ko: 그래서 지금 아이돌 1위까지 하셨어?
    ja: それでトップアイドルになったって？
  event_staranis1_03_e_150:
    speaker: anis_human
    en: Hah, turns out the Ark's entertainment scene isn't worth shit!
    ko: 뭐야, 알고 보니 방주 아이돌 판 진짜 뭣도 아니네!
    ja: |-
      ふん、アイドル業界なんて
      全然大したことないみたいね！
  event_staranis1_03_e_151:
    speaker: yoyo
    en: Anis, I get that you're angry, but don't drag the whole industry into it.
    ko: 아니스. 화난 건 알겠는데, 이 판 전체를 모독하는 건 하지 말아 줘.
    ja: |-
      アニス、怒るのは分かるわ。
      でもアイドルの世界全部を
      悪く言うのはやめて。
  event_staranis1_03_e_152:
    speaker: anis_human
    en: You're not better than me at a single thing.
    ko: 야. 너 나보다 잘난 거 하나도 없잖아.
    ja: |-
      あなた、私よりいいとこなんて、
      何ひとつないじゃない。
  event_staranis1_03_e_153:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_154:
    speaker: anis_human
    en: You were the same when we were human. You really think becoming a Nikke suddenly
      changes that?
    ko: 사람일 때도 그랬는데, 니케가 됐다고 그게 뭐 달라질 것 같아?
    ja: |-
      人間だった時からそうだけど、
      ニケになったからって何か変わると思った？
  event_staranis1_03_e_155:
    speaker: anis_human
    en: Number one? Ha. Seriously? If this is what passes for number one, it must
      be easy.
    ko: |-
      1위? 하하, 뭐야. 진짜 쉽잖아?
      이런 게 1위를 하고 있다니.
    ja: |-
      ランキング1位？アハハ…笑わせんじゃないわ。
      あんたがトップになれるなら、
      誰でもなれるんじゃない？
  event_staranis1_03_e_156:
    speaker: "<Narration>"
    en: Anis glares menacingly at Yoyo.
    ko: 아니스가 요요를 노려본다.
    ja: アニスはヨヨをにらみつけた
  event_staranis1_03_e_157:
    speaker: anis_human
    en: I'm going to crush you.
    ko: 너, 내가 밟는다.
    ja: 落としてやるわ。
  event_staranis1_03_e_158:
    speaker: anis_human
    en: I'll grind you into the dirt and show you the difference between us.
    ko: 자근자근 밟아서, 격의 차이라는 걸 보여줄게.
    ja: |-
      私の足の下で、
      私たちは違うってことを分からせてあげる。
  event_staranis1_03_e_159:
    speaker: anis_human
    en: I'll stomp you so hard you won't even dare look at me again.
    ko: 다시는 나 쳐다보지도 못할 정도로, 밟아줄게.
    ja: 二度と私と目も合わせられないぐらいに。
  event_staranis1_03_e_160:
    speaker: yoyo
    en: Don't do this.
    ko: 이러지 마.
    ja: やめて。
  event_staranis1_03_e_161:
    speaker: yoyo
    en: We're colleagues chasing the same dream. We should be supporting each other.
    ko: 같은 꿈을 꾸는 동료끼리 서로 도와야지.
    ja: 同じ夢を見る者同士、助け合いましょう。
  event_staranis1_03_e_162:
    speaker: yoyo
    en: There's no need for us to fight. If we support each other and grow together...
    ko: |-
      서로 싸울 이유가 없어.
      서로 도우면서 함께 성장해 나가면….
    ja: |-
      いがみ合ったっていいことなんてないわ。
      お互いに助け合って、一緒に成長して…
  event_staranis1_03_e_163:
    speaker: anis_human
    en: Piss off.
    ko: 꺼져.
    ja: 消えて。
  event_staranis1_03_e_164:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_165:
    speaker: anis_human
    en: Don't worry, I'm not about to air your dirty laundry, so relax and get lost.
    ko: 과거 얘기 같은 건 어디 폭로 안 할 테니까, 안심하고 꺼져.
    ja: |-
      昔話のリークなんてしないから、
      心配しないでいいわ。
  event_staranis1_03_e_166:
    speaker: anis_human
    en: That's what you're worried about, right? Your precious reputation taking a
      hit.
    ko: |-
      어차피 그게 목적일 거 아냐.
      잘나가는 아이돌 명성에 흠집이 생길 수도 있을 테니까.
    ja: |-
      どうせ、それが怖かったんでしょ。
      トップアイドルの評判に
      傷がついたら困るでしょうから。
  event_staranis1_03_e_167:
    speaker: anis_human
    en: Sorry, but I don't play dirty like you.
    ko: 미안한데, 난 너처럼 그런 지저분한 방법은 안 써.
    ja: |-
      悪いけど、私はあんたみたいに
      汚い手は使わない。
  event_staranis1_03_e_168:
    speaker: anis_human
    en: I'll crush you with pure skill.
    ko: 내가 너, 실력으로 밟는다.
    ja: 実力で、あんたを落としてやる。
  event_staranis1_03_e_169:
    speaker: yoyo
    en: Anis... don't do this.
    ko: "…아니스, 그러지 말고…."
    ja: アニス、そんなこと言わずに…
  event_staranis1_03_e_170:
    speaker: anis_human
    en: Aaaagh! I said get the hell out!
    ko: 아아아악!! 꺼지라고오--!!
    ja: ああああっ！！もう、消えてってば！！
  event_staranis1_03_e_171:
    speaker: yoyo
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_172:
    speaker: yoyo
    en: Fine, I'm leaving.
    ko: 알겠어. 갈게.
    ja: 分かった。今日はもう行くから。
  event_staranis1_03_e_173:
    speaker: yoyo
    en: See you around.
    ko: 또 봐.
    ja: またね。
  event_staranis1_03_e_174:
    speaker: "<Narration>"
    en: Yoyo turns and walks away.
    ko: 요요가 등을 돌려 걸어간다.
    ja: ヨヨは背を向け、歩き去った
  event_staranis1_03_e_175:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_176:
    speaker: anis_human
    en: Aaaah!
    ko: 으…!
    ja: うっ…！
  event_staranis1_03_e_177:
    speaker: anis_human
    en: Agh! AAAAAGH!
    ko: 아악! 아아아아악--!!
    ja: あああっ！ああああっ！！
  event_staranis1_03_e_178:
    speaker: mint
    en: Wait... you're serious?
    ko: 엑… 진짜야?
    ja: えっ…ホントに？
  event_staranis1_03_e_179:
    speaker: anis_human
    en: Yeah, I'm serious.
    ko: 그렇다니까.
    ja: ホントだってば。
  event_staranis1_03_e_180:
    speaker: anis_human
    en: My high school nightmare turns out to be a pop star? What is this, some trashy
      novel plot?
    ko: |-
      [내 학창 시절의 악몽이 알고 보니 탑 아이돌?]
      무슨 라노벨도 아니고.
    ja: |-
      「学生時代の宿敵が、
      まさかのトップアイドル？」
      なんて、娯楽小説じゃあるまいし。
  event_staranis1_03_e_181:
    speaker: anis_human
    en: Damn it, how the hell am I supposed to take her down?
    ko: 아 미치겠네. 저걸 어떻게 조지지?
    ja: |-
      ああ、もうサイアク。
      どうしてやればいいかしら。
  event_staranis1_03_e_182:
    speaker: prika
    en: So what do we do about this program?
    ko: 그럼 이거 어떡해?
    ja: じゃ、こいつはどうする？
  event_staranis1_03_e_183:
    speaker: anis_human
    en: "... What do you mean?"
    ko: "…뭘?"
    ja: "…こいつ？"
  event_staranis1_03_e_184:
    speaker: prika
    en: The program she brought. Are we using it or not?
    ko: 쟤가 가져다준 프로그램. 써 말어?
    ja: |-
      置いていった編集ソフト。
      使わずに捨てるか？
  event_staranis1_03_e_185:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_186:
    speaker: anis_human
    en: Use it. She's the problem, not the program.
    ko: 쓰자. 애가 쓰레기지 프로그램은 잘못 없으니까.
    ja: 使いましょ。プログラムに罪はないし。
  event_staranis1_03_e_187:
    speaker: prika
    en: All right.
    ko: 좋아.
    ja: 分かった。
  event_staranis1_03_e_188:
    speaker: mint
    en: You won't tell anyone, will you?
    ko: 얘기는 안 할 거야?
    ja: リークはしないの？
  event_staranis1_03_e_189:
    speaker: anis_human
    en: Tell them what?
    ko: 뭘?
    ja: 何の？
  event_staranis1_03_e_190:
    speaker: mint
    en: If word got out that Yoyo used to bully you, the entertainment reporters would
      have a field day.
    ko: |-
      요요가 너 괴롭혔었다는 거.
      연예부 기자나 이런 사람들은 되게 좋아할 텐데.
    ja: |-
      ヨヨにいじめられてたこと。
      芸能記者でもマスコミでも
      飛びついてくるネタになると思うけど。
  event_staranis1_03_e_191:
    speaker: anis_human
    en: Forget it, I don't need to play dirty.
    ko: 됐어. 필요 없어.
    ja: 別にいいわ。そんなことしなくて。
  event_staranis1_03_e_192:
    speaker: anis_human
    en: I'll wipe the floor with her.
    ko: 실력으로 밟아서, 격의 차이를 보여줄 거야.
    ja: |-
      実力でねじ伏せて、
      違いを分からせた方がいいでしょ。
  event_staranis1_03_e_193:
    speaker: anis_human
    en: Hell, I can do it with my eyes closed!
    ko: |-
      그딴 지저분한 짓 안 해도!
      저런 것쯤 눈감고도 이긴다 내가!
    ja: |-
      告げ口みたいな汚い手は使わない。
      あんな奴、目をつぶってたって勝てるわ！
  event_staranis1_03_e_194:
    speaker: mint
    en: Well, that was fast.
    ko: 속도 좋네.
    ja: 変なところで優しいのね。
  event_staranis1_03_e_195:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_196:
    speaker: hanson
    en: How long do you think it'll take to rearrange the piece?
    ko: 편곡에는 얼마나 걸릴 것 같아?
    ja: 編曲にはどのくらいかかりそうだ？
  event_staranis1_03_e_197:
    speaker: prika
    en: We got the manual, so I'll pick it up quick.
    ko: 매뉴얼도 제대로 구비되어 있어서 금방 적응할 수 있을 거예요.
    ja: |-
      説明書もしっかりしてるし、
      すぐに使いこなせると思う。
  event_staranis1_03_e_198:
    speaker: prika
    en: One week, tops.
    ko: 일주일 안에 끝내볼게요.
    ja: 1週間で終わらせる。
  event_staranis1_03_e_199:
    speaker: hanson
    en: All right.
    ko: "…좋아."
    ja: "…よし。"
  event_staranis1_03_e_200:
    speaker: hanson
    en: Then our goal is to perform this song
    ko: 그럼 목표는 미트 미트 공연 마지막 날.
    ja: |-
      それなら、目標はミートミートでの
      パフォーマンス最終日にしよう。
  event_staranis1_03_e_201:
    speaker: hanson
    en: on our last day at Meet & Meat.
    ko: 이 곡으로 공연을 하는 거야.
    ja: そこでこの曲を出す。
  event_staranis1_03_e_202:
    speaker: hanson
    en: The schedule's tight, but can you make it?
    ko: 빠듯하겠지만, 가능할까?
    ja: タイトなスケジュールになるが、大丈夫か？
  event_staranis1_03_e_203:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_03_e_204:
    speaker: anis_human
    en: Of course!
    ko: 물론이죠!
    ja: もちろんです！
  event_staranis1_03_e_205:
    speaker: anis_t
    en: Our first song.
    ko: 우리 첫 곡.
    ja: 私たちの初めての…
  event_staranis1_03_e_206:
    speaker: anis_t
    en: The very first one we can call our own.
    ko: 우리만의 첫 곡.
    ja: 私たちだけの曲。
  event_staranis1_03_e_207:
    speaker: mint_i
    en: Honestly, I can do this in my sleep.
    ko: 솔직히 말하면, 눈 감고도 할 수 있어.
    ja: ま、目をつぶってても余裕ね。
  event_staranis1_03_e_208:
    speaker: prika_i
    en: Well, aren't you confident.
    ko: 자신만만하네?
    ja: ずいぶん自信満々だな？
  event_staranis1_03_e_209:
    speaker: mint_i
    en: Nervousness won't get you anywhere.
    ko: 떨고 있어서 될 일이 아니니까.
    ja: |-
      そうじゃないと、
      できることもできなくなるでしょ。
  event_staranis1_03_e_210:
    speaker: anis_t
    en: Everyone, get ready.
    ko: 다들. 준비해.
    ja: みんな、準備して。
  event_staranis1_03_e_211:
    speaker: "<Narration>"
    en: The countdown comes through the in-ear monitor.
    ko: 인 이어를 통해 카운트다운이 시작된다.
    ja: |-
      耳に装着されたイン・イヤー・モニターから
      カウントダウンが聞こえる
  event_staranis1_03_e_212:
    speaker: "<Narration>"
    en: 3, 2, 1.
    ko: 3, 2, 1.
    ja: 3、2、1…
  event_staranis1_03_e_213:
    speaker: "<Narration>"
    en: The stage lights blaze on.
    ko: 스테이지에 조명이 들어온다.
    ja: ステージが明るくなった
  event_staranis1_03_e_214:
    speaker: "<Narration>"
    en: Her vision goes white. When it clears, the audience is a sea of people.
    ko: |-
      확 밝아지는 시야.
      관객석을 가득 채우고 있는 사람들.
    ja: |-
      視界が広がり、
      すき間の無い観客席が目に飛び込んでくる
  event_staranis1_03_e_215:
    speaker: "<Narration>"
    en: Then the cheers erupt.
    ko: 갑자기 터져 나오는 함성.
    ja: 歓声が静けさを破った
  event_staranis1_03_e_216:
    speaker: "<Narration>"
    en: The electric jolt nearly knocks Anis off her feet,
    ko: 아니스는 찌릿찌릿한 감각에 쓰러질 뻔했다.
    ja: アニスは全身を襲う振動で倒れそうになった
  event_staranis1_03_e_217:
    speaker: "<Narration>"
    en: but the next instant, it swells into a rush of explosive exhilaration.
    ko: 하지만 그 감각은 곧, 터질듯한 고양감이 되었다.
    ja: |-
      だが、その感覚はやがて、
      今にも爆発しそうな高揚感へと変わった
  event_staranis1_03_e_218:
    speaker: anis_t
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis1_03_e_219:
    speaker: anis_t
    en: Hello everyone! We're the three shining stars, T.T. STAR!
    ko: |-
      안녕하세요! 빛나는 세 별!
      T.T. STAR입니다!
    ja: |-
      こんにちは～！輝く三ツ星！
      T.T. STARです！
  event_staranis1_03_e_220:
    speaker: anis_t
    en: Thank you so much for coming!
    ko: 모두! 와주셔서 너무 고마워요!
    ja: みんな！来てくれて、本当にありがとう！
  event_staranis1_03_e_221:
    speaker: anis_t
    en: Everyone, look right here!
    ko: 다들 잘 봐요! 우릴 잘 봐요!
    ja: |-
      私たちのこと！
      しっかり目に焼きつけていって！
  event_staranis1_03_e_222:
    speaker: anis_t
    en: We're about to shine!
    ko: 반짝반짝 빛나는 우릴!
    ja: ピッカピカに輝く私たちを！
  event_staranis1_03_e_223:
    speaker: anis_t
    en: All Eyes On Me!
    ko: All Eyes On Me!
    ja: All Eyes On Me！
  staranis:
    speaker: "<>"
    en:
    ko:
    ja:
event_staranis1_intermission_01:
  event_staranis1_intermission_01_1:
    speaker: anis_human
    en: We did it! We made the charts!
    ko: 차트인! 차트인 했어!
    ja: チャート！チャートインしてる！
  event_staranis1_intermission_01_2:
    speaker: mint
    en: We're only 98th on the indie charts, though.
    ko: 마이너 차트 98위지만 말이야.
    ja: インディーズの98位だけどね。
  event_staranis1_intermission_01_3:
    speaker: anis_human
    en: Hey! What's wrong with 98th place?
    ko: 야! 98위가 우스워?
    ja: 何よ！98位だってすごいでしょ？
  event_staranis1_intermission_01_4:
    speaker: anis_human
    en: Let's see... if the major charts go up to 50, and the indie charts go to 100...
    ko: |-
      어디 보자… 메이저 차트가 50위까지고,
      마이너 차트가 100위까지라고 했으니까….
    ja: |-
      ええと…メジャーが50位で、
      こっちが100位までだから…
  event_staranis1_intermission_01_5:
    speaker: anis_human
    en: That means we're 148th out of all the pop stars out there!
    ko: 많고 많은 아이돌 중 우리가 148번째라는 거 아냐!
    ja: |-
      たくさんいるアイドルの中で、
      私たちが148位ってことじゃない！
  event_staranis1_intermission_01_6:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_intermission_01_7:
    speaker: mint
    en: Well, when you put it that way, we really are something, huh?
    ko: 그러네. 그렇게 생각하니 우리 엄청 대단하네.
    ja: |-
      そうね。そう言われると、
      私たちってけっこういけるのかも。
  event_staranis1_intermission_01_8:
    speaker: anis_human
    en: Hehe! Damn right we are!
    ko: 흐헤헤! 대단해 대단해!
    ja: へへ！すごい！すごい！
  event_staranis1_intermission_01_9:
    speaker: anis_human
    en: Just wait, Yoyo... I'm coming for you!
    ko: 기다려라 요요…! 내가 곧 죽이러 간다…!
    ja: |-
      待ってなさい、ヨヨ…！
      すぐに息の根を止めてやるわ…！
  event_staranis1_intermission_01_10:
    speaker: mint
    en: Just don't kill anyone.
    ko: 죽이지 마.
    ja: それは止めないで。
  event_staranis1_intermission_01_11:
    speaker: hanson
    en: "*Sigh*"
    ko: "…후우."
    ja: "…はぁ…"
  event_staranis1_intermission_01_12:
    speaker: anis_human
    en: Hey, what's with the sighing? It's way too nice a day for that!
    ko: 아니! 이렇게 좋은 날 뭘 그렇게 한숨을 쉬어요?
    ja: |-
      ちょっと！こんなおめでたい時に
      なんでため息なんかつくんですか？
  event_staranis1_intermission_01_13:
    speaker: hanson
    en: No, that was a sigh of relief.
    ko: 한숨이 아니라, 안도의 한숨이야.
    ja: 安堵のため息ってやつだ。
  event_staranis1_intermission_01_14:
    speaker: anis_human
    en: So, got any other good news for us?
    ko: 그래서, 뭐 어디 좋은 소식 같은 거 없어요?
    ja: それで、他に何かいい知らせとかは？
  event_staranis1_intermission_01_15:
    speaker: hanson
    en: Wait till you hear this.
    ko: 듣고 놀라지 마.
    ja: 聞いて驚くな。
  event_staranis1_intermission_01_16:
    speaker: hanson
    en: We've already got five requests for regular gigs, and we're in talks with
      three more venues.
    ko: |-
      고정 공연 요청이 다섯 군데나 들어왔어.
      협의 중인 곳이 세 군데 더 있고.
    ja: |-
      もうパフォーマンスの依頼が5件来てる。
      それとは別に、さらに3件ほど交渉中だ。
  event_staranis1_intermission_01_17:
    speaker: prika
    en: Whoa...
    ko: "…와."
    ja: "…へえ。"
  event_staranis1_intermission_01_18:
    speaker: mint
    en: Seriously?
    ko: "…진짜요?"
    ja: "…ホントですか？"
  event_staranis1_intermission_01_19:
    speaker: anis_human
    en: Oh wow, the original song's that good?
    ko: 오, 오리지널 곡 굉장해.
    ja: これがオリジナルの力なのね…
  event_staranis1_intermission_01_20:
    speaker: "<Narration>"
    en: T.T. STAR kicks off promotions with their original track, All Eyes On Me,
      and steadily climbs into the indie charts' Top 100.
    ko: 오리지널 곡 [All Eyes On Me]로 활동을 시작한 T.T. STAR는 순조롭게 마이너 차트 TOP 100에 진입.
    ja: |-
      T.T. STARは初のオリジナル曲
      「All Eyes On Me」の発表とともに
      アイドルランキングに名を連ねた
  event_staranis1_intermission_01_21:
    speaker: "<Narration>"
    en: Fans are starting to take notice, and posts about the group are appearing
      in fan communities.
    ko: |-
      아이돌 팬들에게도 노출되기 시작했고
      아이돌 카페에서도 관련 글들이 올라온다.
    ja: |-
      アイドルファンの間での知名度も上昇し、
      アイドル通たちの集う掲示板でも
      投稿が話題を集めるようになった
  event_staranis1_intermission_01_22:
    speaker: "<Narration>"
    en: It's only a small start, but T.T. STAR is beginning to make their presence
      known.
    ko: 아주 조금이지만, T.T. STAR는 그 존재감을 드러내기 시작했다.
    ja: |-
      まだわずかではあるが、
      T.T. STARは存在感を示し始めていた
  event_staranis1_intermission_01_23:
    speaker: mustang_past
    en: Tch...
    ko: "…쳇."
    ja: "…チッ。"
  event_staranis1_intermission_01_24:
    speaker: yoyo
    en: I thought you'd be pleased to see your son coming along so nicely.
    ko: 아드님이 차근차근 해나가고 있는 걸 보고 기뻐하실 줄 알았는데요.
    ja: |-
      息子さんが着実に成功されているなら、
      喜ぶと思ってましたが。
  event_staranis1_intermission_01_25:
    speaker: mustang_past
    en: Getting a little too bold again, aren't you? Go on, call him my son one more
      time. I'm dying to see how that ends.
    ko: |-
      또 선을 넘으려고 하는군.
      한 번만 더 아드님이니 어쩌니 해봐. 어떻게 될지 나도 궁금하니까.
    ja: |-
      分をわきまえろと言ったはずだ。
      息子さん？もう一度ほざいてみろ。
      自分でもどうなるか気になるぐらいだ。
  event_staranis1_intermission_01_26:
    speaker: mustang_past
    en: So, did your declaration of war go the way you hoped?
    ko: 그래서, 선전포고는 잘했나?
    ja: で、宣戦布告は上手くいったのか？
  event_staranis1_intermission_01_27:
    speaker: yoyo
    en: Yes, perfectly.
    ko: 예. 잘했어요.
    ja: はい、完璧でした。
  event_staranis1_intermission_01_28:
    speaker: yoyo
    en: "... Honestly, I wasn't sure she was even worth the visit."
    ko: "…솔직히 굳이 인사를 하러 갈 필요까지 있나 싶었는데."
    ja: |-
      …直接会いに行った方が面白いなんて、
      少し疑っていましたけど…
  event_staranis1_intermission_01_29:
    speaker: yoyo
    en: But I'm glad I took your advice.
    ko: 사장님 말을 듣길 잘했어요.
    ja: 社長の言う通りにして大正解でした。
  event_staranis1_intermission_01_30:
    speaker: yoyo
    en: Seeing her still crawling around in the gutter... was even more satisfying
      than I imagined,
    ko: 여전히 시궁창을 기는 모습을 보니 기분이… 좋더군요. 상상 이상으로.
    ja: |-
      相変わらず泥沼でもがいてる様子…
      想像した以上に気持ちが良かったです。
  event_staranis1_intermission_01_31:
    speaker: yoyo
    en: far more than worth the risk.
    ko: 위험을 감수할 가치는 차고도 넘쳤어요.
    ja: リスクを冒した価値がありました。
  event_staranis1_intermission_01_32:
    speaker: mustang_past
    en: See? Nothing's more entertaining than someone else's misery.
    ko: 그렇다니까. 타인의 괴로움은 내 즐거움이니까.
    ja: だろう、他人の不幸は蜜の味だ。
  event_staranis1_intermission_01_33:
    speaker: mustang_past
    en: Now then, what happened with that little matter from the past?
    ko: 그럼, 옛날 일에 대한 건 어떻게 됐어.
    ja: で、昔のことはどうなった。
  event_staranis1_intermission_01_34:
    speaker: yoyo
    en: That's already been dealt with.
    ko: 그것도 잘 해결했어요.
    ja: そちらも問題なく解決しています。
  event_staranis1_intermission_01_35:
    speaker: yoyo
    en: "... Just as I expected. The slightest prod, and she reacted immediately."
    ko: "…예상대로, 조금 긁어주니 바로 반응하더라고요."
    ja: |-
      …予想通り、ちょっと傷口に塩を塗ったら
      すぐに噛みついてきました。
  event_staranis1_intermission_01_36:
    speaker: yoyo
    en: She would never stoop to leaking anything to the press.
    ko: 언론에 뿌리는 짓 같은 건 절대 안 해요.
    ja: マスコミへのリークは、絶対にありません。
  event_staranis1_intermission_01_37:
    speaker: yoyo
    en: She said she'd crush me with skill alone. Bwhahaha! Ah, pardon me, she was
      quite adamant that she'd defeat me with just talent.
    ko: |-
      실력으로 밟는다고, 푸후! 아, 실례.
      실력으로만 밟는다고 호언장담하더라고요.
    ja: |-
      実力って…フフフッ！あっ、失礼…
      私のこと、実力で落とすなんて言ってました。
  event_staranis1_intermission_01_38:
    speaker: yoyo
    en: She's a simple fool, so she'll stick to that, which makes things perfectly
      safe.
    ko: |-
      단순한 바보니, 그렇게 할 거고요.
      안전해요.
    ja: |-
      頭の回らない子だし、
      自分で言った通りにするはずです。
      心配ありません。
  event_staranis1_intermission_01_39:
    speaker: mustang_past
    en: You're awfully confident about that.
    ko: 아주 철석같이 믿는군.
    ja: ずいぶん信用してるようだな。
  event_staranis1_intermission_01_40:
    speaker: yoyo
    en: "... Well, I have my reasons for believing that."
    ko: "…뭐, 여러 가지 의미로 믿고 있기는 하죠."
    ja: "…ええ、まあいろいろな意味で。"
  event_staranis1_intermission_01_41:
    speaker: yoyo
    en: Judging by what she's been doing lately, she'll destroy herself soon enough.
    ko: 지금 하는 꼴을 봐선 금방 자멸할 게 뻔하지만요.
    ja: 今の状況じゃ、そのうち自滅するはずです。
  event_staranis1_intermission_01_42:
    speaker: yoyo
    en: She's plastering her face everywhere these days.
    ko: 여기저기서 닥치는 대로 얼굴을 팔고 다니더라고요?
    ja: 手当たり次第に顔を売ってるみたいですから。
  event_staranis1_intermission_01_43:
    speaker: yoyo
    en: It's stupid. That kind of overexposure only ruins your image.
    ko: 바보같이, 이미지가 흔해져서 좋을 게 없을 텐데.
    ja: バカみたいですよね、安く見られるだけなのに。
  event_staranis1_intermission_01_44:
    speaker: mustang_past
    en: No, that was the right call.
    ko: 아니. 제대로 된 판단이야.
    ja: いや、あっちはそれでいいんだ。
  event_staranis1_intermission_01_45:
    speaker: mustang_past
    en: People with nothing to their name need to get their faces out there as much
      as possible.
    ko: 그것들처럼 아무것도 없는 것들은 가능한 한 얼굴을 많이 비추는 게 답이다.
    ja: |-
      何もないうちは、
      とにかく顔を売らないと始まらん。
  event_staranis1_intermission_01_46:
    speaker: mustang_past
    en: Putting on airs when you've got nothing behind you just makes the fall that
      much harder.
    ko: 괜히 쥐뿔도 없으면서 콧대만 내세워봤자 고꾸라지기만 할 뿐이야.
    ja: |-
      取り柄も何もないヤツが
      プライドだけ高く持ったところで
      落ちていくだけだ。
  event_staranis1_intermission_01_47:
    speaker: mustang_past
    en: Unless you've got real power backing you, playing mysterious gets you nowhere.
    ko: 너처럼 처음부터 힘이 실리는 케이스가 아니면 신비주의는 아무런 소용이 없어.
    ja: |-
      正体隠した謎のアイドルなんて
      お高く止まった売り方、
      実力がなきゃ成立しない。
  event_staranis1_intermission_01_48:
    speaker: mustang_past
    en: Though in your case, mystique isn't a strategy. It's a necessity.
    ko: 정확히는 너 같은 경우는 신비주의가 아니면 안 된다겠지만.
    ja: |-
      ま、お前の場合は
      そうじゃないとダメだったワケだがな。
  event_staranis1_intermission_01_49:
    speaker: mustang_past
    en: Imagine how troublesome it'd be if word got around that you were behind a
      school bullying scandal.
    ko: 학교 폭력의 주범이었다느니 이런 말이 나오면 곤란하잖아.
    ja: |-
      いじめの主犯格だったなんてハナシ、
      表に出たら困るだろう。
  event_staranis1_intermission_01_50:
    speaker: mustang_past
    en: You made sure that little problem was taken care of, didn't you? Because if
      this blows up, I won't let it slide, even if it's you.
    ko: |-
      잘 해결된 거 맞겠지?
      재 뿌리면 너라도 가만 안 둬.
    ja: |-
      キッチリ解決できたんだろうな？
      俺の足を引っ張るようなら、容赦なく切るぞ。
  event_staranis1_intermission_01_51:
    speaker: "<Narration>"
    en: Yoyo pulls out a small device from inside her clothes.
    ko: 요요가 품에서 작은 기계를 꺼내 든다.
    ja: ヨヨが胸元から小さな機械を取り出した
  event_staranis1_intermission_01_52:
    speaker: yoyo
    en: I've got it all recorded.
    ko: 녹음 해놨어요.
    ja: 録音してあるんです。
  event_staranis1_intermission_01_53:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ピッ
  event_staranis1_intermission_01_54:
    speaker: yoyo
    en: '"The program and manual... consider them a small gesture from me."'
    ko: 프로그램과 매뉴얼은 내 작은 성의야.
    ja: |-
      「あのプログラムとマニュアルは、
      せめてもの償いのつもりよ」
  event_staranis1_intermission_01_55:
    speaker: yoyo
    en: '"We''re colleagues chasing the same dream. We should be supporting each other."'
    ko: 같은 꿈을 꾸는 동료끼리 서로 도와야지.
    ja: "「同じ夢を見る者同士、助け合いましょう」"
  event_staranis1_intermission_01_56:
    speaker: anis_human
    en: '"You''re not better than me at a single thing."'
    ko: 야. 너 나보다 잘난 거 하나도 없잖아.
    ja: |-
      「あなた、私よりいいとこなんて、
      何ひとつないじゃない」
  event_staranis1_intermission_01_57:
    speaker: anis_human
    en: '"Number one? Ha. Seriously? If this is what passes for number one, it must
      be easy."'
    ko: |-
      1위? 하하, 뭐야. 진짜 쉽잖아?
      이런 게 1위를 하고 있다니.
    ja: |-
      「ランキング1位？
      アハハ…笑わせんじゃないわ。
      あんたがトップになれるなら、
      誰でもなれるんじゃない？」
  event_staranis1_intermission_01_58:
    speaker: anis_human
    en: '"Hah, turns out the Ark''s entertainment scene isn''t worth shit!"'
    ko: 뭐야, 알고 보니 방주 아이돌 판 진짜 뭣도 아니네!
    ja: |-
      「ふん、アイドル業界なんて
      全然大したことないみたいね！」
  event_staranis1_intermission_01_59:
    speaker: yoyo
    en: '"Anis, I get that you''re angry, but don''t drag the whole industry into
      it."'
    ko: 아니스. 화난 건 알겠는데, 이 판 전체를 모독하는 건 하지 말아 줘.
    ja: |-
      「アニス、怒るのは分かるわ。
      でもアイドルの世界全部を
      悪く言うのはやめて」
  event_staranis1_intermission_01_60:
    speaker: anis_human
    en: '"I''m going to crush you."'
    ko: 너, 내가 밟는다.
    ja: "「落としてやるわ」"
  event_staranis1_intermission_01_61:
    speaker: anis_human
    en: '"I''ll grind you into the dirt and show you the difference between us."'
    ko: 자근자근 밟아서, 격의 차이라는 걸 보여줄게.
    ja: |-
      「私の足の下で、
      私たちは違うってことを分からせてあげる」
  event_staranis1_intermission_01_62:
    speaker: anis_human
    en: '"I''ll stomp you so hard you won''t even dare look at me again."'
    ko: 다시는 나 쳐다보지도 못할 정도로, 밟아줄게.
    ja: "「二度と私と目も合わせられないぐらいに」"
  event_staranis1_intermission_01_63:
    speaker: yoyo
    en: '"Don''t do this."'
    ko: 이러지 마.
    ja: "「やめて」"
  event_staranis1_intermission_01_64:
    speaker: anis_human
    en: '"Piss off."'
    ko: 꺼져.
    ja: "「消えて」"
  event_staranis1_intermission_01_65:
    speaker: yoyo
    en: '"Anis... don''t do this."'
    ko: "…아니스, 그러지 말고…."
    ja: "「アニス、そんなこと言わずに…」"
  event_staranis1_intermission_01_66:
    speaker: anis_human
    en: '"Aaaagh! I said get the hell out!"'
    ko: 아아아악!! 꺼지라고오--!!
    ja: "「ああああっ！！もう、消えてってば！！」"
  event_staranis1_intermission_01_67:
    speaker: yoyo
    en: The risk management team already took care of the edit.
    ko: 리스크 관리 팀에서 편집해 줬어요.
    ja: リスク管理部の人に編集してもらいました。
  event_staranis1_intermission_01_68:
    speaker: yoyo
    en: If she tries to expose it, we'll say she acted out of jealousy toward the
      top pop star.
    ko: 폭로하면 [1위 아이돌에게 열등감을 느껴 저지른 일]이라고 할 수 있겠죠.
    ja: |-
      万が一告発されても、
      「トップアイドル狙いのでっち上げ」
      で説明できます。
  event_staranis1_intermission_01_69:
    speaker: mustang_past
    en: Excellent.
    ko: 훌륭해.
    ja: そりゃ結構。
  event_staranis1_intermission_01_70:
    speaker: yoyo
    en: By the way, you're really planning to just leave T.T. STAR alone?
    ko: 그나저나 T.T. STAR를 이대로 둘 생각이신가요?
    ja: |-
      それより、このままT.T. STARを
      放っておくおつもりですか？
  event_staranis1_intermission_01_71:
    speaker: yoyo
    en: They're hardly capable of anything, but frankly, they're becoming a bit of
      a thorn in my side.
    ko: 할 수 있는 건 없겠지만, 솔직히 좀 눈엣가시거든요.
    ja: |-
      どうせ何もできないとは思いますけど、
      はっきり言って、目ざわりです。
  event_staranis1_intermission_01_72:
    speaker: mustang_past
    en: Of course not.
    ko: 그럴 리가.
    ja: 何もしないと思うのか？
  event_staranis1_intermission_01_73:
    speaker: mustang_past
    en: If there's something I want, I get it, no matter what it takes.
    ko: 나는 내가 원하는 건 무슨 수를 쓰더라도 손에 넣어야 하거든.
    ja: 俺は欲しい物を必ず手に入れる。何としてもな。
  event_staranis1_intermission_01_74:
    speaker: "<Narration>"
    en: When the four return after the performance, they stop short, staring at the
      empty office in stunned silence.
    ko: 공연을 끝내고 온 넷은 텅 빈 사무실을 보고 망연자실하게 서 있었다.
    ja: |-
      パフォーマンスを終えて
      事務所へ戻った4人は、誰もいない
      室内で呆然と立ち尽くしていた
  event_staranis1_intermission_01_75:
    speaker: mint_o
    en: "... Where did everyone go?"
    ko: "…다 어디 갔어?"
    ja: "…みんな、どこに行ったの？"
  event_staranis1_intermission_01_76:
    speaker: prika_o
    en: Wait, even the stuff's gone?
    ko: 짐도 다 빠져있는데.
    ja: 荷物も何もないな。
  event_staranis1_intermission_01_77:
    speaker: anis_idol
    en: Uh... Boss, we're screwed, aren't we?
    ko: 어… 사장님. 우리 망했나요?
    ja: ええと…社長。私たち、終わったってこと？
  event_staranis1_intermission_01_78:
    speaker: hanson
    en: Wait a moment...
    ko: "…잠시만."
    ja: "…ちょっと待っててくれ。"
  event_staranis1_intermission_01_79:
    speaker: "<Narration>"
    en: Hanson steps out of the office.
    ko: 한슨이 사무실 밖으로 나간다.
    ja: ハンソンが事務所の外へ出た
  event_staranis1_intermission_01_80:
    speaker: "<Narration>"
    en: A muffled voice drifts through the door. It sounds like he's on the phone.
    ko: 전화를 하는 듯, 목소리가 들려온다.
    ja: 誰かと通話しているらしい声が聞こえてくる
  event_staranis1_intermission_01_81:
    speaker: "<Narration>"
    en: Before long, the voice rises into shouting.
    ko: 고성이 오가기 시작한다.
    ja: 声はすぐに怒号に変わり始めた
  event_staranis1_intermission_01_82:
    speaker: "<Narration>"
    en: Listening from inside, the three of them sense that something has gone very
      wrong.
    ko: 셋은 그 소리를 들으며 뭔가 일이 잘못 돌아가는 것을 직감했다.
    ja: |-
      その声を聴き、3人は
      事態がよくないものであることを確信した
  event_staranis1_intermission_01_83:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_intermission_01_84:
    speaker: anis_idol
    en: It's probably nothing. C'mon, guys, sit down.
    ko: 별일 아닐 거야. 자자, 다들 앉자.
    ja: |-
      きっと大したことじゃないわ。
      ほら、みんな座って。
  event_staranis1_intermission_01_85:
    speaker: anis_idol
    en: I'll make some coffee. Go on, sit down. You must be wiped after that performance.
    ko: |-
      커피 타 줄게. 앉아 앉아.
      공연하고 와서 피곤할 텐데 좀 쉬어야지.
    ja: |-
      コーヒー淹れるね。座って、座って。
      仕事上がりで疲れてるんだから、休まないと。
  event_staranis1_intermission_01_86:
    speaker: anis_idol
    en: Huh...? Where's the kettle? Did they take that too?
    ko: 어… 커피포트도 없네. 이것도 가져간 건가?
    ja: |-
      あれ…コーヒーポットもないわ。
      それも持っていかれたのかしら？
  event_staranis1_intermission_01_87:
    speaker: anis_idol
    en: Never mind, I'll go grab some coffee. Wait here.
    ko: 커피 사 올게. 기다리고들 있어.
    ja: 買ってくるわね。ちょっと待ってて。
  event_staranis1_intermission_01_88:
    speaker: "<Narration>"
    en: Anis hurries forward. Just then, the door opens, and Hanson walks in.
    ko: |-
      아니스가 서둘러 움직인다.
      그때 문이 열리며 한슨이 들어온다.
    ja: |-
      アニスが動こうとすると、
      ドアが開きハンソンが戻ってきた
  event_staranis1_intermission_01_89:
    speaker: "<Narration>"
    en: A deafening silence fills the office.
    ko: 끔찍한 침묵이 사무실을 가득 채운다.
    ja: 事務所が恐ろしいほどの沈黙に飲まれた
  event_staranis1_intermission_01_90:
    speaker: hanson
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_intermission_01_91:
    speaker: hanson
    en: Um... guys,
    ko: 음, 얘들아.
    ja: 皆、事情が分かった。
  event_staranis1_intermission_01_92:
    speaker: hanson
    en: the only employees we have left are the four of us.
    ko: 우리 회사에 전 직원은 지금 여기 있는 사람들이 전부야.
    ja: |-
      我が事務所の社員は、
      今ここにいる者が全てになった。
  event_staranis1_intermission_01_93:
    speaker: hanson
    en: "... Everyone else has moved to another company."
    ko: "…다 이직했어."
    ja: "…全員、引き抜かれたようだ。"
  event_staranis1_intermission_01_94:
    speaker: anis_idol
    en: Wait, they jumped ship? Where to?
    ko: 이직… 이라니 어디로요.
    ja: 引き抜きって…いったいどこに？
  event_staranis1_intermission_01_95:
    speaker: hanson
    en: Tetra Line's entertainment planning department.
    ko: 테트라 라인 엔터테인먼트 기획부로.
    ja: テトラライン、エンターテイメント企画チーム。
  event_staranis1_intermission_01_96:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_intermission_01_97:
    speaker: anis_idol
    en: You... you can't let them leave.
    ko: 잡아… 야죠.
    ja: じゃあ…戻って来てもらわないと。
  event_staranis1_intermission_01_98:
    speaker: hanson
    en: Their salaries are nearly three times higher, and the benefits are far better
      too.
    ko: |-
      연봉이 3배 가까이 차이가 나서.
      복지야 뭐 말할 것도 없고.
    ja: |-
      給料はあっちの方が3倍近く出る。
      福利厚生の差は言うまでもない。
  event_staranis1_intermission_01_99:
    speaker: hanson
    en: We simply can't match that.
    ko: 하하. 우리는 그만큼 못 챙겨주니까.
    ja: |-
      ハハハ…うちではどうやっても
      出せない待遇だ。
  event_staranis1_intermission_01_100:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_intermission_01_101:
    speaker: anis_idol
    en: B-but money isn't everything.
    ko: 그, 그. 돈이 전부는 아니잖아요.
    ja: よ、よ、世の中、お金がすべてじゃないでしょ？
  event_staranis1_intermission_01_102:
    speaker: anis_idol
    en: Th-they all worked their butts off. I know they didn't do it just for the
      money.
    ko: |-
      다, 다들 엄청 열심히 해줬었는데,
      돈만 보고 한 일은 아니었다고 확신하거든요.
    ja: |-
      み、みんなすごく頑張ってたし、
      お金のためだけに働いてたわけじゃ…
  event_staranis1_intermission_01_103:
    speaker: anis_idol
    en: We're finally starting to get somewhere here. Just give us a little more time...
    ko: 우리 지금 커가고 있으니 조금만 기다려주면….
    ja: |-
      そ、それに私たちだって
      どんどん成長してるし、
      もう少しだけ待ってもらえればきっと…
  event_staranis1_intermission_01_104:
    speaker: hanson
    en: Anis...
    ko: "…아니스."
    ja: "…アニス。"
  event_staranis1_intermission_01_105:
    speaker: hanson
    en: Not everyone pursues the same thing.
    ko: 미안해. 모두가 같은 걸 보고 달릴 순 없어.
    ja: |-
      残念だが、誰もがみんな、
      同じものを目指して
      走っているわけじゃない。
  event_staranis1_intermission_01_106:
    speaker: hanson
    en: I don't want to shatter your ideals, but that's the reality.
    ko: 네 환상을 부수고 싶진 않지만, 현실이 그래.
    ja: |-
      君の夢を壊したくはないが、
      現実とはそういうものだ。
  event_staranis1_intermission_01_107:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_intermission_01_108:
    speaker: mint_o
    en: So what should we do now?
    ko: 그럼 이제 어떡하죠?
    ja: じゃあ、どうするんですか？
  event_staranis1_intermission_01_109:
    speaker: hanson
    en: First, we should put up a job posting.
    ko: 일단 모집 공고를 올려봐야지.
    ja: とにかく、人材探しから始めるしかない。
  event_staranis1_intermission_01_110:
    speaker: hanson
    en: I'm sorry for worrying you. It finally felt like we were getting started,
      and now this happens. I don't even know what to say.
    ko: |-
      걱정 끼쳐서 미안해.
      이제야 시작하는 느낌인데 일이 이렇게 되어버려서 할 말이 없어.
    ja: |-
      心配をかけてしまうな。
      ようやく走り出せたという時に
      こんなことになるなんて、申し訳ない。
  event_staranis1_intermission_01_111:
    speaker: hanson
    en: It might take some time, but I promise I'll make things right.
    ko: 시간은 좀 걸리겠지만 내가 반드시 해결할게.
    ja: |-
      時間は少しかかるかもしれないが、
      必ず解決してみせる。
  event_staranis1_intermission_01_112:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 삐리리리리---
    ja: プルルル…
  event_staranis1_intermission_01_113:
    speaker: "<Narration>"
    en: An office phone shrills loudly.
    ko: 사무실의 전화기가 큰 소리로 울린다.
    ja: 電話の呼び出し音が響いた
  event_staranis1_intermission_01_114:
    speaker: hanson
    en: I'll get it.
    ko: 내가, 내가 받을게.
    ja: 私が出る。
  event_staranis1_intermission_01_115:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 삐리리리리---
    ja: プルルル…
  event_staranis1_intermission_01_116:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 삐리리리리---
    ja: プルルル…
  event_staranis1_intermission_01_117:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 삐리리리리---
    ja: プルルル…
  event_staranis1_intermission_01_118:
    speaker: "<Narration>"
    en: All of a sudden, every phone in the office erupts into ringing at once.
    ko: 사무실에 있는 모든 전화기가 동시다발적으로 울린다.
    ja: 事務所にあるあらゆる電話が、同時に鳴り始めた
  event_staranis1_intermission_01_119:
    speaker: "<Narration>"
    en: "*Riiiiing*"
    ko: 삐리리리리---
    ja: プルルル…
  event_staranis1_intermission_01_120:
    speaker: "<Narration>"
    en: The harsh chorus of ringing phones echoes through the empty office, shattering
      the silence.
    ko: 아무것도 없는 사무실에서의 전화벨 소리가 크게 울려 퍼진다.
    ja: |-
      空っぽになった事務所の中で、
      電話の音はひときわ大きく響いた
event_staranis1_04_s:
  event_staranis1_04_s_1:
    speaker: "<Narration>"
    en: 'Title: T.T. STAR Update'
    ko: '제목 : T.T. STAR 근황'
    ja: タイトル：T.T. STARの近況
  event_staranis1_04_s_2:
    speaker: "<Narration>"
    en: Apparently, they've been flaking on gigs left and right lately.
    ko: 요즘 여기저기서 펑크 낸다고 소문 안 좋음.
    ja: 最近あちこちでドタキャン連発というウワサ
  event_staranis1_04_s_3:
    speaker: "<Narration>"
    en: From what I've heard, they're canceling two or three appearances a day.
    ko: 내가 들은 것만 해도 하루에 2~3번은 펑크내는 듯.
    ja: 1日に2～3件もキャンセルしてるとか聞いた
  event_staranis1_04_s_4:
    speaker: "<Narration>"
    en: Ever since their original song got a bit of traction, they've been trying
      to stick their name anywhere they can. Honestly, it's kinda embarrassing to
      watch.
    ko: 오리지널 곡으로 조금 반응 있다 싶으니까 여기저기 다 찔러보고 다니는 거 같은데 좀 보기 그럼.
    ja: |-
      新曲で少し話題になったからって
      はり切りすぎてるみたいだな、
      ちょっと見苦しい
  event_staranis1_04_s_5:
    speaker: anis_idol
    en: Next! Where to next? The park?
    ko: 다음! 다음 어디죠? 공원이던가?
    ja: 次！次はどこ！？公園でしたっけ？
  event_staranis1_04_s_6:
    speaker: hanson
    en: Yes, the park! In 20 minutes!
    ko: 공원 맞아! 20분 뒤야!
    ja: ああ、公園！20分後だ！
  event_staranis1_04_s_7:
    speaker: anis_idol
    en: Hurry! Get to the car!
    ko: 빨리! 빨리 차로 가자!
    ja: 早く！早く車に乗って！
  event_staranis1_04_s_8:
    speaker: mint_o
    en: Hold on! I just need to do this first!
    ko: 잠깐만! 이것만 좀 하고!
    ja: 待って！あとこれだけ！
  event_staranis1_04_s_9:
    speaker: prika_o
    en: Leave it, we can't take it all!
    ko: 그건 놔두고 가자! 다 못 챙겨!
    ja: |-
      置いていけ！
      全部は持ちきれないだろう！
  event_staranis1_04_s_10:
    speaker: mint_o
    en: We can't go without the lighting panels!
    ko: 그래도 조명 판은 있어야지!
    ja: でも、照明板はないと！
  event_staranis1_04_s_11:
    speaker: hanson
    en: Hey, I've got this! Get to the car! Pop stars shouldn't be doing this!
    ko: |-
      얘들아! 내가 할 테니 차에 가 있어!
      아이돌은 그런 거 하면 안 돼!
    ja: |-
      みんな！私がやるから車に乗ってくれ！
      アイドルがこんなことしなくていい！
  event_staranis1_04_s_12:
    speaker: anis_idol
    en: What are you talking about?! We're swamped here! And you can barely keep up
      as it is!
    ko: 아 무슨 소리예요! 바빠 죽겠구만! 힘도 없으면서!
    ja: |-
      何言ってるんですか！一番忙しいくせに！
      だいたい力もないでしょ！
  event_staranis1_04_s_13:
    speaker: meatmeetowner
    en: At least eat before you go!
    ko: 밥은 먹고 가야지!
    ja: ご飯も食べて行かないのかい！？
  event_staranis1_04_s_14:
    speaker: anis_idol
    en: Sorry, we'll eat when we get back!
    ko: 죄송해요! 갔다 와서 먹을게요!
    ja: ごめんなさい！帰ってきたら食べます！
  event_staranis1_04_s_15:
    speaker: "<Narration>"
    en: "- Heard they're only taking gigs that actually pay now."
    ko: ㄴ 돈 좀 되는 곳만 골라서 간다는 소문도 있음
    ja: ㄴ金になりそうな場所だけ選んでるらしい
  event_staranis1_04_s_16:
    speaker: "<Narration>"
    en: "- Source?"
    ko: ㄴ 어디서 들음? 출처 좀
    ja: ㄴどこ情報？ソースは？
  event_staranis1_04_s_17:
    speaker: "<Narration>"
    en: "- All the places they bailed on were hole-in-the-wall places."
    ko: ㄴ 펑크 난 곳이 다 구멍가게던데
    ja: ㄴドタキャンされたの、小さいとこばっかり
  event_staranis1_04_s_18:
    speaker: "<Narration>"
    en: "- They've always performed at hole-in-the-wall venues. Lol, what are you
      even talking about?"
    ko: ㄴ 애초에 구멍가게에서만 공연했는데 무슨ㅋㅋㅋ
    ja: |-
      ㄴそもそも小さい所でしかやってないのに
      　何言ってんだwww
  event_staranis1_04_s_19:
    speaker: anis_idol
    en: "... Oh crap,"
    ko: "…망했다."
    ja: "…終わった…"
  event_staranis1_04_s_20:
    speaker: anis_idol
    en: I don't think this is the right place.
    ko: 여기 아닌 것 같은데요?
    ja: ここじゃないみたいですけど？
  event_staranis1_04_s_21:
    speaker: hanson
    en: What?
    ko: "…뭐?"
    ja: "…何だって？"
  event_staranis1_04_s_22:
    speaker: hanson
    en: Oh... I must've confused it with tomorrow's schedule.
    ko: "…아. 내일 일정이랑 착각했어."
    ja: |-
      …いかん、明日のスケジュールと
      勘違いしていた。
  event_staranis1_04_s_23:
    speaker: mint_o
    en: How could you possibly get that wrong?
    ko: 그걸 착각하면 어떡해요?
    ja: |-
      そんな大事なこと、
      勘違いしてどうするんですか！？
  event_staranis1_04_s_24:
    speaker: prika_o
    en: What, you didn't even think to double-check?
    ko: 넌 안 보고 뭐 했는데.
    ja: お前だって確認してなかっただろう。
  event_staranis1_04_s_25:
    speaker: mint_o
    en: Look who's talking.
    ko: 남 말할래?
    ja: 人のこと言える？
  event_staranis1_04_s_26:
    speaker: anis_idol
    en: "... So where are we supposed to be right now?"
    ko: "…그럼 지금 우리가 있어야 할 곳은 어딘데요?"
    ja: "…それで、本当の会場はどこなんですか？"
  event_staranis1_04_s_27:
    speaker: hanson
    en: "... It's just one block over, and we're already late."
    ko: "…바로 옆 블록이었어. 이미 늦었고."
    ja: "…もう一つ隣のブロックだ。もう間に合わん。"
  event_staranis1_04_s_28:
    speaker: anis_idol
    en: Ah...
    ko: 아….
    ja: そんな…
  event_staranis1_04_s_29:
    speaker: anis_idol
    en: Argh! Seriously?!
    ko: 아아! 진짜!
    ja: ああ！もう！
  event_staranis1_04_s_30:
    speaker: hanson
    en: I'm sorry.
    ko: 미안하다.
    ja: すまない。
  event_staranis1_04_s_31:
    speaker: anis_idol
    en: Oh no, it's fine! I wasn't mad at you, Boss.
    ko: 아아. 아니에요. 사장님한테 화낸 거 아니니까.
    ja: あっ、いえ。社長に怒ったんじゃありません。
  event_staranis1_04_s_32:
    speaker: "<Narration>"
    en: 'Title: Why take on so many gigs anyway?'
    ko: '제목 : 근데 애초에 왜 그렇게 일을 많이 받음?'
    ja: タイトル：そもそも仕事受けすぎじゃね？
  event_staranis1_04_s_33:
    speaker: "<Narration>"
    en: If you know you can't handle it, why even accept them in the first place?
    ko: 스케줄을 다 소화 못 할 거면 안 받으면 되는 거 아님?
    ja: |-
      仕事がうまくさばけないなら、
      受けなきゃいい話じゃないのか？
  event_staranis1_04_s_34:
    speaker: "<Narration>"
    en: "- Loads of places these days pay upfront and just lock in the date."
    ko: ㄴ 요즘 선입금하고 막무가내로 나가는 업체들도 많아서
    ja: ㄴ最近は先入金で強引な業者も多いらしい
  event_staranis1_04_s_35:
    speaker: "<Narration>"
    en: "- Yeah, big-name pop stars get to negotiate, but groups like T.T. STAR? They
      get bossed around all the time."
    ko: ㄴ ㅇㅇ잘나가는 아이돌이야 일정 잡고 해야 되지만 TTSTAR 같은 애들은 갑질 당하기 일쑤임
    ja: |-
      ㄴ売れっ子アイドルは
      　スケジュールを押さえてからだけど、
      　新人は無理言われがちだからな
  event_staranis1_04_s_36:
    speaker: "<Narration>"
    en: "- Wait, so they pay you first and then just tell you when to show up? What
      if you don't?"
    ko: ㄴ 그럼 먼저 돈 넣어놓고 언제까지 오쇼 라고 일방적으로 통보한다는 거임? 안 가면 뭐라고 하고?
    ja: |-
      ㄴ先に金を振り込まれて「ここに来い」って
      　一方的に言われて、もし行けなかったら
      　因縁つけられるってこと？
  event_staranis1_04_s_37:
    speaker: "<Narration>"
    en: "- Exactly. Some places do it on purpose, hoping to hit you with contract
      penalties."
    ko: ㄴ ㅇㅇ맞음. 위약금 노리고 그러는 곳도 제법 있다고 들음
    ja: |-
      ㄴそうそう。違約金目当てで
      　わざと無理を言う奴もいるらしい
  event_staranis1_04_s_38:
    speaker: "<Narration>"
    en: "- And if you skip a gig? The press spins it like you're arrogant or full
      of yourself."
    ko: ㄴ 일 안 받으면 콧대가 높아졌느니 어쩌니 하면서 언플함
    ja: |-
      ㄴ断られたら調子に乗ってる～とか、
      　あらぬウワサを立てられたりとかな
  event_staranis1_04_s_39:
    speaker: "<Narration>"
    en: "- So basically... damned if you do, damned if you don't."
    ko: ㄴ 뭐야 가불기네?
    ja: ㄴ詰んでない？
  event_staranis1_04_s_40:
    speaker: "<Narration>"
    en: "- Exactly."
    ko: ㄴ ㅇㅇ가불기
    ja: ㄴそうだが？
  event_staranis1_04_s_41:
    speaker: "<Narration>"
    en: "- Sheesh, the life of a pop star sure is brutal."
    ko: ㄴ 아이돌 해 먹기 개 빡세네
    ja: ㄴアイドルって大変なんだな
  event_staranis1_04_s_42:
    speaker: "<Narration>"
    en: "- And with so many wannabes out there, weird stuff like this happens all
      the time."
    ko: ㄴ 아이돌이 너무 많아서 이상한 일도 많이 생기는 거
    ja: ㄴ競争が激しすぎて、おかしくなってるんだ
  event_staranis1_04_s_43:
    speaker: hanson
    en: "... We're very sorry. We have no excuses."
    ko: "…죄송합니다. 드릴 말씀이 없습니다."
    ja: "…誠に申し訳ございませんでした。"
  event_staranis1_04_s_44:
    speaker: hanson
    en: Yes, we'll transfer the full amount, including the penalty.
    ko: 예. 금액은 위약금까지 포함해서 입금하겠습니다.
    ja: |-
      はい。違約金も含めて、
      全額お支払いいたします。
  event_staranis1_04_s_45:
    speaker: hanson
    en: We're truly sorry. If you'd give us one more chance—
    ko: 정말 죄송합니다. 그래도 다시 한번 기회를 주신다면
    ja: |-
      たいへん申し訳ないと思っております。
      どうか挽回のチャンスを…
  event_staranis1_04_s_46:
    speaker: hanson
    en: "... They hung up."
    ko: "…끊었네."
    ja: "…切られたか。"
  event_staranis1_04_s_47:
    speaker: anis_idol
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_04_s_48:
    speaker: hanson
    en: I'm really sorry, everyone. I keep missing things when I check the schedule.
    ko: 정말 미안하다. 일정 체크에서 자꾸 미스가 생기네.
    ja: |-
      本当にすまない。
      スケジュール関連のミスが重なっているな。
  event_staranis1_04_s_49:
    speaker: anis_idol
    en: Um, Boss... You've been getting enough sleep, right?
    ko: 그, 사장님. 잠은 좀 자요?
    ja: あの、社長。最近、ちゃんと寝てます？
  event_staranis1_04_s_50:
    speaker: hanson
    en: Yeah, I'm getting enough sleep.
    ko: 어. 잘 자.
    ja: ああ。もちろんだ。
  event_staranis1_04_s_51:
    speaker: anis_idol
    en: "... Seriously, when do you even sleep? All you do is run to meetings, give
      us rides, and go over contracts."
