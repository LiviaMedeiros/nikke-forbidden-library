---
event_staranis1_prologue:
  event_staranis1_prologue_1:
    speaker: "<Narration>"
    en: Murmurs and chatter ripple through
    ko: 웅성웅성-
    ja: ザワザワ――
  event_staranis1_prologue_2:
    speaker: "<Monologue>"
    en: the crowd in front of the Arkrian Hall.
    ko: "…아크리온 홀 앞은 인파로 가득하다."
    ja: |-
      …アークリアンホールの前で、
      人々がひしめきあっている
  event_staranis1_prologue_3:
    speaker: "<Monologue>"
    en: The line snakes outward, vanishing into the distance.
    ko: 길게 늘어선 줄이 끝도 없이 이어져 있다.
    ja: |-
      入場待ちの列は
      どこまでも続いているように見えた
  event_staranis1_prologue_4:
    speaker: neon_v
    en: Wow,
    ko: 우와.
    ja: "…わあ。"
  event_staranis1_prologue_5:
    speaker: neon_v
    en: I've never seen this many people in one place before.
    ko: 저 살면서 사람이 한곳에 이렇게 많이 모여있는 건 처음 보는 것 같아요.
    ja: |-
      こんな人だかりを見るのは、
      生まれて初めてです。
  event_staranis1_prologue_6:
    speaker: rapi_red
    en: Do we really have to wait in this line...?
    ko: 이 긴 줄을 서서… 기다려야 하는 겁니까.
    ja: この列に…並ばないといけないのでしょうか。
  event_staranis1_prologue_7:
    speaker: "<Self>"
    en: Hmm... I guess so.
    ko: 음… 그래야 하지 않을까.
    ja: まあ…そうなるだろうな
  event_staranis1_prologue_8:
    speaker: neon_v
    en: Looks like we'd have to go way back to get in line.
    ko: 줄 서려면 한참 뒤로 가야 되겠는데요?
    ja: 最後尾はかなり後ろの方みたいですね？
  event_staranis1_prologue_9:
    speaker: neon_v
    en: So why are we all the way up here?
    ko: 그런데 저희는 왜 이렇게까지 앞에 와 있는 걸까요?
    ja: |-
      なんで私たち、
      こんなに前まで来ちゃったんでしょう？
  event_staranis1_prologue_10:
    speaker: "<Self>"
    en: I didn't realize this was the line for the T.T. STAR concert...
    ko: T.T. STAR 공연 줄인 줄 몰랐지….
    ja: |-
      これがT.T. STARのライブの列だとは
      思わなかった…
  event_staranis1_prologue_11:
    speaker: neon_v
    en: Oh, so you think Anis isn't popular?
    ko: 아하. 아니스 인기 없으니까?
    ja: なるほど、アニスにそこまで人気はないと？
  event_staranis1_prologue_12:
    speaker: "<Self>"
    en: No... please don't put words in my mouth...
    ko: |-
      아니야….
      그런 오해를 살만한 발언은 하지 말아 줘….
    ja: |-
      そうじゃない…
      誤解を招く言い方はよせ…
  event_staranis1_prologue_13:
    speaker: rapi_red
    en: Let's head to the back for now. The line's only getting longer.
    ko: |-
      일단 뒤로 가시죠.
      지금 이 시간에도 줄은 더 길어지고 있을 겁니다.
    ja: |-
      ひとまず最後尾へ向かいましょう。
      話している間にも列が伸びています。
  event_staranis1_prologue_14:
    speaker: neon_v
    en: C'mon, can't you pull some strings or something? It's not like we're strangers.
    ko: |-
      인맥 찬스나 뭐 이런 거 없나요?
      우리가 남도 아니고.
    ja: |-
      顔パスとかないんですか？
      赤の他人ってワケでもないですし。
  event_staranis1_prologue_15:
    speaker: rapi_red
    en: You've got a point.
    ko: 듣고 보니 맞는 말이야.
    ja: 言われてみればそうね。
  event_staranis1_prologue_16:
    speaker: rapi_red
    en: Commander, can't you use your authority to do something about it?
    ko: 지휘관. 지휘관의 권력을 이용해서 어떻게 안 되겠습니까?
    ja: |-
      指揮官。指揮官の権限で
      解決できないでしょうか？
  event_staranis1_prologue_17:
    speaker: "<Self>"
    en: Let's just hurry and get to the back of the line.
    ko: 그냥 조금이라도 빨리 뒤에 가서 줄 서자.
    ja: "…少しでも早く並ぼう"
  event_staranis1_prologue_18:
    speaker: neon_v
    en: Yeah, looks like it's going to be a long wait.
    ko: 넹. 한참 기다려야겠네요.
    ja: そうですね。かなり待つことになりそうです。
  event_staranis1_prologue_19:
    speaker: rapi_red
    en: "... It would've been nice to at least say hello to Anis."
    ko: "…아니스랑 인사라도 할 수 있으면 좋았을 텐데."
    ja: |-
      …せめてアニスに一声かけられれば
      よかったのだけれど。
  event_staranis1_prologue_20:
    speaker: avistar
    en: Oh, you're all here.
    ko: 아, 다들 여기 계셨네요.
    ja: あっ、こんな所にいらっしゃいましたか。
  event_staranis1_prologue_21:
    speaker: neon_v
    en: Hey, Avistar!
    ko: 엇. 아비스타.
    ja: おや、アビスタ。
  event_staranis1_prologue_22:
    speaker: avistar
    en: Hi, Neon.
    ko: 안녕하세요. 네온.
    ja: 探しましたよ、ネオン。
  event_staranis1_prologue_23:
    speaker: avistar
    en: You're members of the Commando Unit, right?
    ko: 특수별동대분들이시죠?
    ja: 特殊別働隊の皆さんですよね？
  event_staranis1_prologue_24:
    speaker: avistar
    en: It's a pleasure to meet you.
    ko: 처음 뵙겠습니다.
    ja: 初めてお目にかかります。
  event_staranis1_prologue_25:
    speaker: avistar
    en: I'm Avistar from the inspection unit Overseer.
    ko: 감찰부대 오버시어 소속 아비스타라고 해요.
    ja: |-
      監察部隊オーバーシアー所属、
      アビスタと申します。
  event_staranis1_prologue_26:
    speaker: rapi_red
    en: No way, could it be...?
    ko: 이 전개는 설마.
    ja: この流れは、もしかして…
  event_staranis1_prologue_27:
    speaker: avistar
    en: This way, please. Guests with special invitations can go straight in.
    ko: |-
      이쪽으로 오세요.
      특별 초대를 받은 분들은 줄 서지 않고 바로 들어가실 수 있거든요.
    ja: |-
      こちらへどうぞ。
      ご招待の方は別の入り口から
      ご案内しています。
  event_staranis1_prologue_28:
    speaker: neon_v
    en: Woohoo!
    ko: 오오!
    ja: おお！
  event_staranis1_prologue_29:
    speaker: avistar
    en: I made sure you guys have really good seats.
    ko: 자리도 좋은 곳으로 잡아놨어요.
    ja: 席も、よく見える場所をご用意してありますよ。
  event_staranis1_prologue_30:
    speaker: "<Self>"
    en: Awesome!
    ko: 오오오!
    ja: おおお！
  event_staranis1_prologue_31:
    speaker: avistar
    en: "... Anis didn't tell you?"
    ko: "…아니스가 얘기 안 해주시던가요?"
    ja: "…アニスから連絡が行っていませんでしたか？"
  event_staranis1_prologue_32:
    speaker: rapi_red
    en: No, she didn't. Guess becoming a pop star made her arrogant.
    ko: |-
      해주지 않았어.
      아이돌이 되더니 오만해졌나 봐.
    ja: |-
      いいえ、何も。
      アイドルになったからって、
      私たちのことを忘れたのかも。
  event_staranis1_prologue_33:
    speaker: avistar
    en: Anis has been the busiest of us all. She probably just didn't have a chance
      to tell you.
    ko: |-
      아니스가 제일 바빴으니까요.
      차마 챙길 여유가 없었겠죠.
    ja: |-
      誰より忙しかったですからね。
      連絡する余裕もなかったのでしょう。
  event_staranis1_prologue_34:
    speaker: avistar
    en: Now, please follow me.
    ko: 자, 절 따라와 주세요.
    ja: ひとまず、行きましょう。
  event_staranis1_prologue_35:
    speaker: "<Narration>"
    en: In the waiting room.
    ko: 대기실.
    ja: 楽屋
  event_staranis1_prologue_36:
    speaker: anis_t
    en: Ahhh...
    ko: "……아으."
    ja: "…あう。"
  event_staranis1_prologue_37:
    speaker: anis_t
    en: Ugh... Oh man... Aaahhh!
    ko: |-
      ……아으아.
      ……으으으아아아.
    ja: |-
      …あああ。
      …あわわわ…
  event_staranis1_prologue_38:
    speaker: mrsmiss
    en: "... What's gotten into her?"
    ko: "…얘 왜 이러니?"
    ja: "…ちょっと、どうしちゃったの？"
  event_staranis1_prologue_39:
    speaker: mustang
    en: Ohhh là là... The big-stage pressure is really hitting her hard, non?
    ko: Oh… Big Stage의 압박감이 아니스를 Push하고 있군Yo.
    ja: |-
      Oh…Big Stageのプレッシャーに
      潰されかけているようですNE。
  event_staranis1_prologue_40:
    speaker: mrsmiss
    en: Oh, for crying out loud, it's not like this is your first rodeo.
    ko: 나 원참. 초짜도 아니고.
    ja: 呆れた。初めてでもないでしょうに。
  event_staranis1_prologue_41:
    speaker: anis_t
    en: W-well, I'm such a total newbie...
    ko: 초, 초짜 맞는데….
    ja: は…初めてですけど…
  event_staranis1_prologue_42:
    speaker: anis_t
    en: Performing in a place this huge is something I've only ever dreamed of, so
      actually doing it feels completely unreal...
    ko: "…생각해 보니 이렇게 넓은 곳에서 공연하는 건 꿈만 꿨지, 실제로 하는 건 처음이라서…."
    ja: |-
      …こんな大きいステージ、
      夢でしか立ったことないし…
  event_staranis1_prologue_43:
    speaker: mrsmiss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_prologue_44:
    speaker: mrsmiss
    en: What about you, Mint?
    ko: 민트. 너는 어때?
    ja: ミント。あなたはどう？
  event_staranis1_prologue_45:
    speaker: mint_i
    en: Me?
    ko: 저요?
    ja: 私ですか？
  event_staranis1_prologue_46:
    speaker: mint_i
    en: I've been dreaming of this moment for as long as I can remember, so I can't
      wait to get on stage.
    ko: 저야 뭐. 언제나 꿈꿔왔던 거라서 1초라도 빨리 올라가고 싶죠.
    ja: |-
      私は…ずっと夢見てた場所ですから。
      1秒でも早くステージに立ちたいです。
  event_staranis1_prologue_47:
    speaker: mint_i
    en: There's no way I'm going to let nerves ruin such a huge opportunity.
    ko: 긴장감 같은 건 사치죠. 이런 큰 기회를 긴장감 같은 걸로 망칠 수는 없거든요.
    ja: |-
      緊張なんてぜいたくですよ。
      こんな大きなチャンス、
      そんなことで台無しにできません。
  event_staranis1_prologue_48:
    speaker: mrsmiss
    en: Good, you've got what it takes to be a star.
    ko: 좋네. 스타가 될 준비가 되어 있어.
    ja: いいわ。スターになる覚悟ができてるようね。
  event_staranis1_prologue_49:
    speaker: mint_i
    en: Of course, I've been a star since the day I was born.
    ko: 물론이죠. 저는 태어날 때부터 스타였으니까요.
    ja: |-
      当然です。
      私、生まれた時からスターなんですから。
  event_staranis1_prologue_50:
    speaker: "<Narration>"
    en: Mint picks up a water bottle from the table and brings it to her mouth.
    ko: 민트가 테이블에 올려진 물병을 집고 입으로 가져간다.
    ja: |-
      ミントがテーブルの上の
      ペットボトルに手を伸ばし、口元に寄せた
  event_staranis1_prologue_51:
    speaker: "<Narration>"
    en: "*Rattle, rattle, rattle*"
    ko: 투두두두두두.
    ja: ビシャビシャビシャ――
  event_staranis1_prologue_52:
    speaker: "<Narration>"
    en: It shakes violently in her grip, spraying water everywhere.
    ko: 물병이 격렬하게 떨리며 사방에 물을 뿌렸다.
    ja: |-
      激しく震えるペットボトルから、
      水が四方に飛び散った
  event_staranis1_prologue_53:
    speaker: mustang
    en: Oooh, le magnifique sprinkler!
    ko: Oh. Sprinkler.
    ja: Oh、スプリンクラー！
  event_staranis1_prologue_54:
    speaker: mrsmiss
    en: A born star, huh.
    ko: 태어날 때부터 스타란 말이지.
    ja: 生まれた時から…ねぇ。
  event_staranis1_prologue_55:
    speaker: anis_t
    en: What, did you slap some super-vibrating parts on your arms or something?
    ko: 뭐 팔에 초진동 파츠라도 달았냐.
    ja: 腕にマッサージ器でも着けてるの？
  event_staranis1_prologue_56:
    speaker: mint_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_prologue_57:
    speaker: mint_i
    en: Wh-wh-wh-what do I do...?
    ko: 어어어어어떡하지.
    ja: ど、どどどど、どうしましょう？
  event_staranis1_prologue_58:
    speaker: mrsmiss
    en: "*Sigh...*"
    ko: "…하아."
    ja: "…はぁ。"
  event_staranis1_prologue_59:
    speaker: mrsmiss
    en: And you, Prika?
    ko: 프리카는?
    ja: プリカは？
  event_staranis1_prologue_60:
    speaker: "<Narration>"
    en: Prika has her eyes closed, headset in place, and her foot tapping along to
      the beat.
    ko: |-
      프리카는 눈을 감고 헤드셋을 쓴 채,
      발을 까딱이며 리듬을 타고 있다.
    ja: |-
      プリカはヘッドフォンをつけたまま目を閉じ、
      足を小刻みに動かしてリズムを取っていた
  event_staranis1_prologue_61:
    speaker: mrsmiss
    en: Hmm, she's ready for anything.
    ko: 음. 저쪽은 만전이네.
    ja: ふん、こっちは大丈夫そうね。
  event_staranis1_prologue_62:
    speaker: mustang
    en: Ohoho! The inimitable cool beauty, oui oui!
    ko: Oh. 역시 Cool Beauty.
    ja: Oh。さすがはCool Beauty。
  event_staranis1_prologue_63:
    speaker: anis_t
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_prologue_64:
    speaker: "<Narration>"
    en: Anis sneaks up behind Prika and yanks off her headset,
    ko: 아니스가 슬그머니 다가가 프리카의 헤드셋을 벗긴다.
    ja: |-
      アニスが静かに近づき、
      プリカのヘッドフォンを外した
  event_staranis1_prologue_65:
    speaker: "<Narration>"
    en: letting the music blast through the room.
    ko: 헤드셋에서 흘러나오고 있는 음악이 대기실을 가득 채운다.
    ja: ヘッドフォンの大音量が楽屋に漏れた
  event_staranis1_prologue_66:
    speaker: anis_t
    en: "... Are you serious? You're listening to Buddhist chants?"
    ko: "…너 왜 불경 듣고 있냐."
    ja: "…なんでお経なんか聞いてるのよ。"
  event_staranis1_prologue_67:
    speaker: prika_i
    en: Mind. Calm.
    ko: 마음. 안정.
    ja: 心の安定のためだ。
  event_staranis1_prologue_68:
    speaker: anis_t
    en: "... Huh?"
    ko: "…뭐?"
    ja: "…はぁ？"
  event_staranis1_prologue_69:
    speaker: prika_i
    en: Calm. Focus. Perform.
    ko: 안정. 마음. 공연.
    ja: 安定、心、ライブ。
  event_staranis1_prologue_70:
    speaker: anis_t
    en: "... She's a lost cause, ain't she?"
    ko: "…얘도 글렀는데?"
    ja: "…こっちもダメそうだけど？"
  event_staranis1_prologue_71:
    speaker: mrsmiss
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis1_prologue_72:
    speaker: mint_i
    en: Th-th-that thing... Wh-what's it called again?
    ko: 그그그거 있잖아. 그거. 그거 뭐뭐였지?
    ja: ね、ねえ。あ、あ、あれって、なななんだっけ？
  event_staranis1_prologue_73:
    speaker: anis_t
    en: Wh-what's that...?
    ko: 뭐, 뭔데 그게….
    ja: 何よ、あれって…
  event_staranis1_prologue_74:
    speaker: prika_i
    en: Dance. Song. Essence.
    ko: 춤. 노래. 근원.
    ja: ダンスとは、歌とは、根源とは…
  event_staranis1_prologue_75:
    speaker: anis_t
    en: Hey, snap out of it! What are we supposed to do if you lose your marbles?!
    ko: 저, 정신 차려. 너까지 이러면 어떡하자고!
    ja: |-
      ちょっと、しっかりしてってば。
      あなたまでそんなんで、
      どうしろっていうのよ！
  event_staranis1_prologue_76:
    speaker: mrsmiss
    en: Get your act together!
    ko: 정신들 안 차릴래!
    ja: いい加減にしなさい！
  event_staranis1_prologue_77:
    speaker: "<Narration>"
    en: The room falls silent in an instant.
    ko: 대기실이 순식간에 조용해졌다.
    ja: 楽屋が一瞬で静まり返った
  event_staranis1_prologue_78:
    speaker: mrsmiss
    en: This is Arkrian Hall, the biggest stage in the Ark.
    ko: |-
      여긴 아크리온 홀이야.
      방주에서 가장 큰 무대지.
    ja: |-
      ここはアークリアンホールよ。
      アークで一番大きなステージ。
  event_staranis1_prologue_79:
    speaker: mrsmiss
    en: Every seat is sold out. People came all this way and spent their money to
      see you.
    ko: |-
      관객석이 가득 찼어.
      너희를 보기 위해 많은 돈과 시간을 들여 여기까지 온 거야.
    ja: |-
      会場は満席。
      あなたたちを見るために、多くの人が
      貴重なお金と時間を使ってここに来てるの。
  event_staranis1_prologue_80:
    speaker: mrsmiss
    en: Don't make a fool of yourselves. Being amateurs won't earn you a second of
      pity here.
    ko: |-
      꼴사나운 모습 보이지 마.
      아마추어라고 봐주는 것도 어제까지야.
    ja: |-
      みっともない姿は見せないで。
      アマチュアでいられたのは昨日までよ。
  event_staranis1_prologue_81:
    speaker: mustang
    en: This isn't just un simple comeback concert for T.T. STAR!
    ko: |-
      You들도 알고 있겠지만,
      이 Stage는 단순한 T.T. STAR의 복귀 공연이 아닙니Da!
    ja: |-
      Youたちも分かっていますNE？
