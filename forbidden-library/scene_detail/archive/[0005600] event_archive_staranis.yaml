    ja: |-
      その時、Memoryを全て
      失ってしまったようですNE。
  event_staranis2_05_e_108:
    speaker: mustang
    en: She remembers rien now.
    ko: 아무것도, Remember하지 못 합니Da.
    ja: 何もRememberしていないそうDESU。
  event_staranis2_05_e_109:
    speaker: mint
    en: "... Excuse me? But Tetra's memory preservation is among the best..."
    ko: "…예? 테트라의 기억 보존 능력은 최고 수준…."
    ja: |-
      …え？ニケの記憶保存のことなら、
      テトラは最高レベルじゃ…
  event_staranis2_05_e_110:
    speaker: mustang
    en: Ah, oui... it seems there's been un terrible accident.
    ko: 끔찍한 Accident가 있었던 모양입니Da.
    ja: 恐ろしいAccidentというものDESU。
  event_staranis2_05_e_111:
    speaker: mustang
    en: A real shame.
    ko: Yes. Accident입니Da.
    ja: そう。AccidentでしTA。
  event_staranis2_05_e_112:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_113:
    speaker: prika
    en: What about Anis?
    ko: 아니스는 어떻게 되죠?
    ja: アニスはどうなるんだ？
  event_staranis2_05_e_114:
    speaker: mustang
    en: She did assault someone. C'est indéniable.
    ko: 폭력을 휘두른 것은 True입니Da.
    ja: 乱暴をしたことは事実DESU。
  event_staranis2_05_e_115:
    speaker: mustang
    en: After a short break and a live apology, we'll make les arrangements for her
      return.
    ko: 잠시 Rest후, 사과 방송 후, 복귀할 수 있도록 조치하겠습니Da.
    ja: |-
      休養期間の後、謝罪会見を開いて、
      復帰できるように計画しまSHOW。
  event_staranis2_05_e_116:
    speaker: "<Narration>"
    en: Mint and Prika let out small sighs of relief.
    ko: 민트와 프리카는 작은 안도의 한숨을 내쉬었다.
    ja: ミントとプリカから、安堵のため息がこぼれた
  event_staranis2_05_e_117:
    speaker: anis_human
    en: I'm not doing it.
    ko: 저 안 할 건데요.
    ja: 私、やりません。
  event_staranis2_05_e_118:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_119:
    speaker: anis_human
    en: I'm done being a pop star.
    ko: 저 이제 아이돌 안 해요.
    ja: もうアイドルは辞めます。
  event_staranis2_05_e_120:
    speaker: mustang
    en: Anis.
    ko: 아니스.
    ja: アニス…
  event_staranis2_05_e_121:
    speaker: anis_human
    en: I'll stick to what actually suits a nobody like me.
    ko: 주제에 맞게 살려고요.
    ja: |-
      身の程知らずな夢は
      見ないで生きることにしました。
  event_staranis2_05_e_122:
    speaker: anis_human
    en: Me, being someone's hope? Yeah, that was never happening.
    ko: |-
      특별할 것 하나 없는 제가,
      누군가의 희망이 된다는 것 자체가 말이 안 됐어요.
    ja: |-
      特別でも何でもない私が、
      誰かの希望になりたいなんて
      最初から間違ってたんです。
  event_staranis2_05_e_123:
    speaker: anis_human
    en: And...
    ko: 그리고.
    ja: それに…
  event_staranis2_05_e_124:
    speaker: anis_human
    en: I'm not about to sing and dance for those trashy pieces of shit in the Ark.
    ko: 쓰레기 같은 방주 놈들을 위해 춤추고 노래하고 싶지 않거든요.
    ja: |-
      ゴミみたいな奴らのために
      歌って踊るなんて、もうイヤ。
  event_staranis2_05_e_125:
    speaker: mustang
    en: Anis, you're déjà special...
    ko: 아니스. You는 이미 Special….
    ja: アニス、YouはもうSpecialな…
  event_staranis2_05_e_126:
    speaker: anis_human
    en: Send me to the surface.
    ko: 지상으로 보내줘요.
    ja: 地上へ行きたいです。
  event_staranis2_05_e_127:
    speaker: anis_human
    en: I want to join a combat squad.
    ko: 전투 부대 소속으로 가고 싶어요.
    ja: 最前線の部隊に入れてください。
  event_staranis2_05_e_128:
    speaker: mint
    en: Anis...
    ko: "…아니스."
    ja: "…アニス…"
  event_staranis2_05_e_129:
    speaker: prika
    en: You seriously...
    ko: 너 정말….
    ja: お前、本気で…
  event_staranis2_05_e_130:
    speaker: anis_human
    en: I'm sorry.
    ko: 미안.
    ja: ごめん。
  event_staranis2_05_e_131:
    speaker: anis_human
    en: I can't do this anymore.
    ko: 나는 이제 정말 못 하겠어.
    ja: でも私、続けられそうにないの。
  event_staranis2_05_e_132:
    speaker: anis_human
    en: I just can't.
    ko: 하고 싶지 않아.
    ja: やりたいと思えない。
  event_staranis2_05_e_133:
    speaker: mustang
    en: Anis, ma chérie, there are far more good people in l'Ark than you think...
    ko: 아니스. Good People이 Ark에는 훨씬 많….
    ja: アニス…Good Peopleも、Arkには…
  event_staranis2_05_e_134:
    speaker: anis_human
    en: Sorry, but I don't want to hear it.
    ko: 아, 저 죄송한데 그 소리는 듣고 싶지 않아요.
    ja: |-
      悪いけど、そんな話もう
      聞きたくないんです。
  event_staranis2_05_e_135:
    speaker: anis_human
    en: I haven't found anyone like that, so I don't buy it.
    ko: 못 찾았거든요. 그런 사람.
    ja: 見たことないんです。そんな人。
  event_staranis2_05_e_136:
    speaker: anis_human
    en: All I've seen are people who treat us like toys, and the ones who killed Riss.
    ko: 우리를 장난감 취급하고, 리스를 죽인 것들 말고는 없던데요.
    ja: |-
      私たちをおもちゃにして、
      リスを死なせるような人ばっかり。
  event_staranis2_05_e_137:
    speaker: mustang
    en: Anis.
    ko: 아니스.
    ja: アニス…
  event_staranis2_05_e_138:
    speaker: anis_human
    en: Send me
    ko: 지상으로.
    ja: 地上。
  event_staranis2_05_e_139:
    speaker: anis_human
    en: to the surface.
    ko: 보내줘요.
    ja: 行かせてください。
  event_staranis2_05_e_140:
    speaker: mustang
    en: Alors... you wish to die.
    ko: "…Die할 생각이군Yo."
    ja: "…捨てるつもりですNE。"
  event_staranis2_05_e_141:
    speaker: anis_human
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_142:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_143:
    speaker: mustang
    en: I'm... too late...
    ko: 내가… 너무… 늦었… 구나.
    ja: また…遅すぎた…
  event_staranis2_05_e_144:
    speaker: mustang
    en: again...
    ko: 또….
    ja: また…
  event_staranis2_05_e_145:
    speaker: anis_human
    en: I don't blame you, Boss.
    ko: 저는 사장님 원망 안 해요.
    ja: 私は社長のこと、恨んでません。
  event_staranis2_05_e_146:
    speaker: anis_human
    en: You pulled off something big, and Tetra's doing better than ever.
    ko: |-
      큰 일을 해냈잖아요.
      테트라는 눈에 띄게 좋아지고 있고.
    ja: |-
      すごいことをしてるじゃないですか。
      テトラは生まれ変わったみたいに
      いい会社になり始めてるし。
  event_staranis2_05_e_147:
    speaker: anis_human
    en: It's finally turning into a proper entertainment company, and yeah, that's
      great.
    ko: 정말 엔터테인먼트만을 위한 회사가 되어가고 있어서, 좋다고 생각해요.
    ja: |-
      みんなが楽しくなることだけを追求する
      会社になって、よかったと思います。
  event_staranis2_05_e_148:
    speaker: anis_human
    en: But me? I'm not into that stuff anymore. There's nothing here for me.
    ko: |-
      그런데 저는 이제 엔터테인먼트 같은 거 관심 없으니까,
      여기서는 할 것도 없잖아요?
    ja: |-
      でも、私はそういうことに
      もう興味が持てないから、
      ここにいてもすることが無いんです。
  event_staranis2_05_e_149:
    speaker: anis_human
    en: So I'm going to the surface.
    ko: 그래서 지상으로 간다는 거예요.
    ja: 止めないでください。
  event_staranis2_05_e_150:
    speaker: mustang
    en: I'll wait for you, then we'll recommencer again.
    ko: Wait 할 테니, 다시 Start….
    ja: |-
      いくらでもWaitしMASU、
      もう一度Startを…
  event_staranis2_05_e_151:
    speaker: anis_human
    en: Please...
    ko: 제발.
    ja: お願いします。
  event_staranis2_05_e_152:
    speaker: anis_human
    en: just let me go.
    ko: 좀 보내줘요.
    ja: 行かせてください。
  event_staranis2_05_e_153:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_154:
    speaker: mustang
    en: Très bien, I shall honor your request.
    ko: OK. You의 요청을 받아들이겠습니Da.
    ja: 分かりましTA。そのようにしまSHOW。
  event_staranis2_05_e_155:
    speaker: mint
    en: Boss!
    ko: 사장님!
    ja: 社長！？
  event_staranis2_05_e_156:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_05_e_157:
    speaker: anis_human
    en: Thank you.
    ko: 고마워요.
    ja: 今までありがとうございました。
  event_staranis2_05_e_158:
    speaker: anis_human
    en: "... Mint, Prika,"
    ko: "…민트. 프리카."
    ja: "…ミント。プリカ。"
  event_staranis2_05_e_159:
    speaker: anis_human
    en: I'm really sorry.
    ko: 진짜 미안해.
    ja: 本当にごめんね。
  event_staranis2_05_e_160:
    speaker: anis_human
    en: But...
    ko: 그런데….
    ja: でも…
  event_staranis2_05_e_161:
    speaker: anis_human
    en: I really can't do this anymore.
    ko: 나 진짜 못 하겠어.
    ja: これ以上、できなくなっちゃった。
event_staranis2_06_s:
  event_staranis2_06_s_1:
    speaker: "<Narration>"
    en: Time slips by.
    ko: 시간이 흐른다.
    ja: 長い時が流れた
  event_staranis2_06_s_2:
    speaker: maleannouncer
    en: Tetra Line's been looking really good lately.
    ko: 테트라 라인의 최근 행보가 되게 인상적이군요.
    ja: テトラライン社の近年の動向は印象的ですね。
  event_staranis2_06_s_3:
    speaker: maleannouncer
    en: Uh... how should I put it? They've been squeaky clean.
    ko: 어… 뭐라고 해야 하나. 아주 클린해요.
    ja: |-
      その…なんと言えば良いのか。
      驚くほどクリーンです。
  event_staranis2_06_s_4:
    speaker: femaleannouncer
    en: After Director Hanson's incident, CEO Mustang said he'd overhaul the company.
    ko: |-
      한슨 이사의 일이 있고 난 후,
      머스탱 CEO가 기업 자체를 뜯어고치겠다고 선언했었죠.
    ja: |-
      ハンソン理事の一大スキャンダルの後、
      マスタングCEOは根本からの
      社内体制改革を宣言していました。
  event_staranis2_06_s_5:
    speaker: femaleannouncer
    en: No one believed him at the time, but... I suppose I'll give him that. It's
      hard to argue they're not a good company now.
    ko: |-
      아무도 안 믿었지만 지금은… 예.
      좋은 기업이라고 부르기에 손색이 없겠네요.
    ja: |-
      当時は誰も期待していませんでしたが…ねぇ。
      生まれ変わったと言ってもいいほどの
      変化を遂げています。
  event_staranis2_06_s_6:
    speaker: femaleannouncer
    en: The polls reflect that too. Tetra's public image is overwhelmingly positive.
    ko: 실제로 여론 조사 결과에서도, 테트라는 좋은 기업이다 쪽이 압도적이었으니까요.
    ja: |-
      実際、世論調査の結果からしても、
      テトラの運営体制を優良とみる意見は
      圧倒的に増加しています。
  event_staranis2_06_s_7:
    speaker: maleannouncer
    en: Wait, did everyone just forget they used to be absolutely terrible?
    ko: 이런, 과거에는 악덕 중의 악덕이었다는 건 모두 잊은 건가요?
    ja: |-
      かつて前代未聞の悪徳企業だったことは
      皆さん忘れてしまったのでしょうか？
  event_staranis2_06_s_8:
    speaker: femaleannouncer
    en: People forget things quickly, and what Tetra's doing now makes that easy.
    ko: 쉽게 잊으니까요. 그만큼 지금의 행보가 파격적이기도 하고.
    ja: |-
      忘れてしまうでしょうね。
      それほど、現在の動きは衝撃的です。
  event_staranis2_06_s_9:
    speaker: maleannouncer
    en: But they've gotten a lot weaker than the other Big Three, right?
    ko: 하지만 다른 3대 기업에 비해 힘이 많이 약해진 건 사실이죠?
    ja: |-
      しかし、三大企業のひとつとしては
      確実に勢力が弱体化しましたよね？
  event_staranis2_06_s_10:
    speaker: femaleannouncer
    en: Yes, they went through a fairly rough internal cleanup, so they've been in
      the red for a while.
    ko: |-
      예. 내부 청소가 꽤나 거칠게 진행되었으니까요.
      계속 적자를 보고 있죠.
    ja: |-
      そうですね。社内の浄化のために
      相当な出血を強いられたようです。
      赤字を計上し続けていました。
  event_staranis2_06_s_11:
    speaker: femaleannouncer
    en: That said, forecasts suggest that they should turn a profit in about two years.
    ko: 하지만 내후년쯤엔 흑자로 전환될 것이라는 전망이네요.
    ja: |-
      ですが、来年度には黒字に転じる
      見込みとの発表です。
  event_staranis2_06_s_12:
    speaker: femaleannouncer
    en: Seems like focusing solely on entertainment is finally starting to pay off.
    ko: 엔터테인먼트 사업에만 전념한 게 슬슬 과실을 맺는 거겠죠.
    ja: |-
      娯楽事業へのリソース集中が、
      ようやく実を結ぶ形となったようです。
  event_staranis2_06_s_13:
    speaker: maleannouncer
    en: That's pretty impressive.
    ko: 훌륭하네요.
    ja: 素晴らしいですね。
  event_staranis2_06_s_14:
    speaker: maleannouncer
    en: Oh right, they got rid of the indie charts a while back, didn't they?
    ko: 아. 아이돌 마이너 차트도 없어진 지 꽤 됐죠?
    ja: |-
      浄化と言えば、アイドルランキングの
      二部制も、廃止されてから
      ずいぶん経ちましたね？
  event_staranis2_06_s_15:
    speaker: femaleannouncer
    en: Yes, it's been a while now. It was a pretty harsh system.
    ko: |-
      예. 한참 됐죠.
      너무 잔인한 제도이긴 했으니까요.
    ja: |-
      そうですね。しばらく経ちます。
      過激な競争をあおるシステムでしたから。
  event_staranis2_06_s_16:
    speaker: maleannouncer
    en: Wow, Tetra Line's really something, huh? At this point, it practically feels
      like a whole new company.
    ko: |-
      이야~ 테트라 라인 대단하네요.
      이 정도면 그냥 새로운 기업인데요?
    ja: |-
      いやぁ～…近年のテトララインには驚きですね。
      ここまでくると、もうまったく別の会社では？
  event_staranis2_06_s_17:
    speaker: maleannouncer
    en: Kind of like CEO Mustang's new look, Tetra Line seems to be reinventing itself.
    ko: 머스탱 CEO의 새로운 코스튬처럼, 새롭게 태어나고 있는 테트라 라인.
    ja: |-
      マスタングCEOの新たなコスチュームと、
      生まれ変わったテトラライン。
  event_staranis2_06_s_18:
    speaker: maleannouncer
    en: Definitely one to watch going forward.
    ko: 테트라 라인의 앞으로의 행보도 기대해 보겠습니다.
    ja: テトララインの今後の動きに期待しましょう。
  event_staranis2_06_s_19:
    speaker: maleannouncer
    en: Anyway, moving on to our next story.
    ko: 다음 소식입니다.
    ja: では、次のトピックです…
  event_staranis2_06_s_20:
    speaker: mustang
    en: Hmm... so you've made your choice, oui?
    ko: Hm… 그렇게 결정했군Yo.
    ja: Hm…そう決めたのですNE。
  event_staranis2_06_s_21:
    speaker: mustang
    en: Are you sure, mes chéris?
    ko: 괜찮겠나Yo?
    ja: 本当に納得できていますKA？
  event_staranis2_06_s_22:
    speaker: mint
    en: Yes, I've had a long talk with Prika.
    ko: 예. 프리카랑 많이 얘기했어요.
    ja: ええ。プリカと時間をかけて話し合いました。
  event_staranis2_06_s_23:
    speaker: prika
    en: We'll wait for Anis.
    ko: 저희는 아니스를 기다릴게요.
    ja: 私たちはアニスを待つ。
  event_staranis2_06_s_24:
    speaker: prika
    en: When she comes back someday, we can start again.
    ko: 언젠가, 돌아왔을 때 다시 시작할 수 있게.
    ja: |-
      いつか戻ってきた時、
      また始められるように。
  event_staranis2_06_s_25:
    speaker: mint
    en: It does hurt a little since it feels as though she's leaving us behind.
    ko: 솔직히 우리 버리고 간 것 같아서 섭섭하지만.
    ja: |-
      正直、捨てられたみたいで
      寂しいしショックですけど…
  event_staranis2_06_s_26:
    speaker: mint
    en: But she worked harder than anyone, and I know how deeply she must've been
      hurt.
    ko: "…가장 열심히 했고, 그만큼 가장 많이 상처받았을 테니까요."
    ja: |-
      …誰よりも一生懸命だったから、
      誰よりも傷ついたんだと思います。
  event_staranis2_06_s_27:
    speaker: mint
    en: So I understand.
    ko: 이해할 수 있어요.
    ja: 気持ちは分かるんです。
  event_staranis2_06_s_28:
    speaker: mint
    en: That's why I'd like to ask you something.
    ko: 그래서 말인데, 부탁이 있어요.
    ja: それで、お願いがあります。
  event_staranis2_06_s_29:
    speaker: mustang
    en: Allez, do tell.
    ko: Tell Me.
    ja: Tell Me.
  event_staranis2_06_s_30:
    speaker: mint
    en: Please let us stay in the industry.
    ko: 우리를 계속 연예계에 남아있게 해주세요.
    ja: |-
      私たちに、
      芸能界で仕事をさせてください。
  event_staranis2_06_s_31:
    speaker: mint
    en: It doesn't have to be anything big.
    ko: 아주 작은 일이라도 상관없어요.
    ja: どんなに小さな仕事でも構いません。
  event_staranis2_06_s_32:
    speaker: mint
    en: As long as we're still here, Anis will know where to find us.
    ko: 이 바닥에 계속 남아있어야, 아니스가 필요할 때 우릴 찾을 수 있을 테니까요.
    ja: |-
      この世界に残ってさえいれば、
      アニスがいつか戻って来た時
      私たちを見つけられますから。
  event_staranis2_06_s_33:
    speaker: mustang
    en: Mais oui! That can be easily done, no problème at all.
    ko: |-
      OK. Hard한 일은 아니군Yo.
      문제 없습니Da.
    ja: |-
      OK…HardではありませんNE。
      ノープロブレムDESU。
  event_staranis2_06_s_34:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_35:
    speaker: mustang
    en: Are you vraiment okay with this?
    ko: You들은 괜찮나Yo?
    ja: YouたちはそれでいいのですKA？
  event_staranis2_06_s_36:
    speaker: mustang
    en: Who knows how long you'll have to wait for Anis, mes chéris?
    ko: 아니스를 위해, 얼마나 될지 모르는 긴 Time을 Wait 해야 할 수도 있습니Da.
    ja: |-
      どれほど長いTimeをWaitすることになるか、
      誰にも分かりませんYO。
  event_staranis2_06_s_37:
    speaker: mustang
    en: Starting anew as an idol... well, it might not be such a bad idée.
    ko: Idol로 시작해 보는 것도 Bad하지 않을겁니Da.
    ja: |-
      Idolとしての活動継続も
      Badではないと思いMASUけどNE。
  event_staranis2_06_s_38:
    speaker: prika
    en: I don't want that.
    ko: 그건 싫어요.
    ja: それじゃダメなんだ。
  event_staranis2_06_s_39:
    speaker: prika
    en: "... I want the three of us to stay together."
    ko: "…셋이서, 같이 하고 싶어요."
    ja: "…3人で、一緒にやりたいから。"
  event_staranis2_06_s_40:
    speaker: prika
    en: It should've been four... but that's not possible anymore...
    ko: 넷이서… 했으면 좋았겠지만 그건 이제 못 하니까….
    ja: |-
      本当は…4人って言いたかったけど、
      それはできなくなったからな…
  event_staranis2_06_s_41:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_42:
    speaker: prika
    en: We haven't done anything yet.
    ko: 우리, 아무것도 이루지 못했잖아요.
    ja: 私たち、まだ何も成し遂げられてないんだ。
  event_staranis2_06_s_43:
    speaker: prika
    en: If we start over with even one of us missing,
    ko: 한 명이라도 빠진 상태에서 다시 시작해버리면
    ja: 1人でも置き去りにして勝手にやり直したら…
  event_staranis2_06_s_44:
    speaker: prika
    en: then we're just a failed group.
    ko: 우린 그냥 실패한 채로 끝나는 거잖아요.
    ja: 失敗したまま終わったってことになる。
  event_staranis2_06_s_45:
    speaker: prika
    en: I'm not letting T.T. STAR end like that.
    ko: |-
      그렇게 끝내고 싶지 않아요.
      T.T. STAR를.
    ja: |-
      そんな形で終わらせたくないんだ。
      T.T. STARを。
  event_staranis2_06_s_46:
    speaker: mustang
    en: Très bien, I understand.
    ko: "…OK. You들의 Mind. 잘 알았습니Da."
    ja: |-
      …OK. Youたちの考えは、
      よく分かりましTA。
  event_staranis2_06_s_47:
    speaker: mustang
    en: Then, I shall wait with you,
    ko: Me도 함께 기다리겠습니Da.
    ja: Meも待ちまSHOW。
  event_staranis2_06_s_48:
    speaker: mustang
    en: mes twinkling stars.
    ko: My Twinkle Stars를.
    ja: My Twinkle Starsを。
  event_staranis2_06_s_49:
    speaker: "<Narration>"
    en: A long stretch of time passes.
    ko: 긴 시간이 흐른다.
    ja: さらに長い時が流れた
  event_staranis2_06_s_50:
    speaker: anis
    en: "... Reporting in."
    ko: "…작전 보고 합니다."
    ja: "…作戦報告です。"
  event_staranis2_06_s_51:
    speaker: anis
    en: I made it back alive, somehow.
    ko: 잘 다녀왔어요. 살아서.
    ja: 生還しました。まだ生きてます。
  event_staranis2_06_s_52:
    speaker: mustang
    en: Excellente, you're getting the hang of it, petit à petit.
    ko: Good. 점점 Battle에 익숙해지는 것 같군Yo.
    ja: |-
      Good.
      Battleにも慣れてきたようですNE。
  event_staranis2_06_s_53:
    speaker: anis
    en: "... Yeah, guess I'm still alive."
    ko: "…그러게요. 죽지도 않네."
    ja: "…そうですね。まだ死んでないし。"
  event_staranis2_06_s_54:
    speaker: mustang
    en: You really do leave a trail of trouble wherever you go, non?
    ko: 여기저기서 사고는 치는 것 같지만Yo.
    ja: |-
      あちこちでトラブルを
      起こしているそうですNE。
  event_staranis2_06_s_55:
    speaker: anis
    en: You really expect me to just follow orders like that when they don't even
      make sense?
    ko: 말 같지도 않은 명령을 내리는데 그걸 그대로 따를 순 없잖아요.
    ja: |-
      ありえない命令ばっかり出して来るのに、
      黙って従えるワケ、ないじゃないですか。
  event_staranis2_06_s_56:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_57:
    speaker: mustang
    en: Anis,
    ko: 아니스.
    ja: アニス…
  event_staranis2_06_s_58:
    speaker: mustang
    en: how long do you intend to keep thinking like that, hmm?
    ko: 언제까지, 할 Think입니Gga?
    ja: いつまで続けるつもりですKA？
  event_staranis2_06_s_59:
    speaker: anis
    en: Until I die.
    ko: 죽을 때까지요.
    ja: 死ぬまで。
  event_staranis2_06_s_60:
    speaker: mustang
    en: Oh non, that's a terrible answer, ma chérie.
    ko: Oh, No. Terrible한 대답이군Yo.
    ja: |-
      Oh, No…
      なんてTerribleな考えでSHOW。
  event_staranis2_06_s_61:
    speaker: mustang
    en: I won't let you mourir. Not on my watch.
    ko: Me가 아니스를 Die하게 두지 않을겁니Da.
    ja: MeはそんなことさせませんからNE。
  event_staranis2_06_s_62:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_63:
    speaker: anis
    en: Boss,
    ko: 저, 사장님.
    ja: あの、社長。
  event_staranis2_06_s_64:
    speaker: anis
    en: you don't have to worry about me anymore.
    ko: 저 이제 신경 안 쓰셔도 돼요.
    ja: 私のことはもう気にしないでください。
  event_staranis2_06_s_65:
    speaker: anis
    en: I appreciate it, but I'm fine now.
    ko: 마음 써 주셔서 고마운데, 이제 괜찮아요.
    ja: 気持ちはありがたいですけど、もういいんです。
  event_staranis2_06_s_66:
    speaker: anis
    en: I'm never going back.
    ko: 저는 절대 돌아가지 않을 테니까.
    ja: 私、絶対に戻りません。
  event_staranis2_06_s_67:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_68:
    speaker: mustang
    en: I have something to show you, mon Anis.
    ko: My 아니스. You에게 보여줄 게 있습니Da.
    ja: |-
      Myアニス…
      Youに見せるものがありMASU。
  event_staranis2_06_s_69:
    speaker: mustang
    en: Allez, come here.
    ko: Come Here.
    ja: Come Here.
  event_staranis2_06_s_70:
    speaker: anis
    en: "... This is...?"
    ko: "…이건…."
    ja: "…これって…？"
  event_staranis2_06_s_71:
    speaker: mustang
    en: The expansive armament Star.
    ko: 확장 무장 STAR.
    ja: 拡張武装、STAR。
  event_staranis2_06_s_72:
    speaker: mustang
    en: A monument to our sins exquisément forged from Pretty's own body.
    ko: 프리티의 Body로 만들어진, 우리 Sin의 상징입니Da.
    ja: |-
      プリティーのBodyから生み出された、
      私たちのSinの象徴。
  event_staranis2_06_s_73:
    speaker: mustang
    en: Mon dieu, it cost us an absurd amount of time and money to reclaim this.
    ko: 다시 돌려받기 위해, Many Many한 Money와 Time이 들었Jyo.
    ja: |-
      取り戻すために、Many Manyな
      MoneyとTimeが必要でしTA。
  event_staranis2_06_s_74:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_75:
    speaker: mustang
    en: Pretty's body was très particulier.
    ko: 프리티의 Body는 매우 Special한 Body 였습니Da.
    ja: |-
      プリティーのBodyは、
      とてもSpecialだったのDESU。
  event_staranis2_06_s_76:
    speaker: mustang
    en: And with that body and lost technology, voilà, we created this weapon.
    ko: 그 Body를, Lost Technology를 사용하여 확장 무장을 만들었Jyo.
    ja: |-
      そのBodyは未解明の
      Technologyにより改造され、
      拡張武装に変えられましTA。
  event_staranis2_06_s_77:
    speaker: anis
    en: So... this is Pretty's...
    ko: 이게… 프리티의….
    ja: これが…プリティーの…
  event_staranis2_06_s_78:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_79:
    speaker: anis
    en: Why are you showing me this, exactly?
    ko: 이걸… 왜 보여주시는 거예요?
    ja: なんで…見せるんですか？
  event_staranis2_06_s_80:
    speaker: mustang
    en: Because I trust you, ma chérie.
    ko: Me는, You를 Trust합니Da.
    ja: Meは、Youを信じていMASU。
  event_staranis2_06_s_81:
    speaker: mustang
    en: I haven't forgotten what you said. Not a word.
    ko: You가 했던 그 말을, 아직 Remember합니Da.
    ja: Youの言葉、今でも覚えていますYO。
  event_staranis2_06_s_82:
    speaker: mustang
    en: After all, you love the Ark, n'est-ce pas?
    ko: You는 Ark를 사랑했으니까Yo.
    ja: YouがArkを愛していたこともNE。
  event_staranis2_06_s_83:
    speaker: anis
    en: Not anymore.
    ko: 지금은 아니죠.
    ja: 今は違います。
  event_staranis2_06_s_84:
    speaker: mustang
    en: Non, one's origine doesn't change, for better or for worse.
    ko: |-
      No. Origin은 바뀌지 않습니Da.
      Good한 의미로도, Bad한 의미로도.
    ja: |-
      No. 原点は変わりまSEN。
      Goodな意味でも、Badな意味でも。
  event_staranis2_06_s_85:
    speaker: mustang
    en: I'll wait, mon Anis,
    ko: Wait하겠습니Da. My 아니스.
    ja: 待っていますYO、Myアニス。
  event_staranis2_06_s_86:
    speaker: mustang
    en: for the day you learn to love l'Ark again,
    ko: You가 다시, Ark를 사랑하게 되Go.
    ja: Youが再びArkを愛せるようになって…
  event_staranis2_06_s_87:
    speaker: mustang
    en: the day you choose to protéger it, just as Pretty once did,
    ko: 프리티가 지키려 했던, Ark를 지키기로 마음먹는 Day.
    ja: |-
      プリティーが守ろうとしたArkを
      守ると決めた時。
  event_staranis2_06_s_88:
    speaker: mustang
    en: the day you décideras to become une Goddess of Victory after casting aside
      your life as une pop star.
    ko: |-
      You가 Idol을 그만두고
      승리의 여신이 되기로 마음먹는 Day.
    ja: |-
      もしYouがIdolではなく、
      勝利の女神になると決意する時が来たRA…
  event_staranis2_06_s_89:
    speaker: mustang
    en: On that day, I will give you l'expansif armement Star.
    ko: 확장 무장 Star를 아니스에게 Give 하겠습니Da.
    ja: |-
      この拡張武装Starは
      Youに渡すと約束しまSHOW。
  event_staranis2_06_s_90:
    speaker: anis
    en: "... Why me...?"
    ko: "…왜 저한테…."
    ja: "…なんで私を…"
  event_staranis2_06_s_91:
    speaker: mustang
    en: You may be different from her, très different even...
    ko: Me는 아니스가 형태는 다를지라도
    ja: Youはプリティーとまったく似ていまSEN…
  event_staranis2_06_s_92:
    speaker: mustang
    en: But I do believe you're the girl destinée to carry on Pretty's legacy.
    ko: 프리티를 잇는 Girl이라고 Think하고 있으니까Yo.
    ja: |-
      それでも、プリティーを継ぐGirlだと
      考えていMASU。
  event_staranis2_06_s_93:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_94:
    speaker: anis
    en: Like I'd ever take this.
    ko: 제가 이걸 받을 일은 없을 거예요.
    ja: そんな時は来ません。
  event_staranis2_06_s_95:
    speaker: mustang
    en: I will wait.
    ko: Me는 기다립니Da.
    ja: Meは待ちますYO。
  event_staranis2_06_s_96:
    speaker: mustang
    en: No matter how long it takes, I will remain here and wait for you, toujours.
    ko: |-
      Me는 계속 이곳에서 Change없이 아니스를 기다리겠습니Da.
      어디에도 Go하지 않겠습니Da.
    ja: |-
      MeはここでChangeすることなく
      待っていMASU。
      どこにも行きまSEN。
  event_staranis2_06_s_97:
    speaker: mustang
    en: "... This time, I will not be late, jamais."
    ko: "…이번에는, 늦지 않도Lock."
    ja: "…今度こそ、手遅れにはしまSEN。"
  event_staranis2_06_s_98:
    speaker: "<Narration>"
    en: Anis walks through the Ark's city streets,
    ko: 아니스는 방주 시내를 걷는다.
    ja: アニスはアークの市街地を歩いた
  event_staranis2_06_s_99:
    speaker: "<Narration>"
    en: taking it in for the first time in a while.
    ko: 오랜만에 걷는 방주다.
    ja: アークを歩くのは久しぶりだ
  event_staranis2_06_s_100:
    speaker: "<Narration>"
    en: People pass her in steady streams.
    ko: 수많은 사람이 지나간다.
    ja: 多くの人とすれ違う
  event_staranis2_06_s_101:
    speaker: "<Narration>"
    en: She searches their faces, one by one.
    ko: 아니스는 그들의 얼굴을 하나하나 살핀다.
    ja: 一人ひとり、顔を見て歩いた
  event_staranis2_06_s_102:
    speaker: "<Narration>"
    en: But the ones who used to torment them back then are nowhere to be seen.
    ko: 보이지 않는다. 자신들을 그렇게 괴롭혔던 이들은 없다.
    ja: |-
      いない。
      自分たちを苦しめてきた人たちはもういない
  event_staranis2_06_s_103:
    speaker: "<Narration>"
    en: A small weight lifts off her chest, and she keeps going.
    ko: 약간의 안도감을 느끼며 아니스는 계속 걷는다.
    ja: 少し緊張の解けたアニスは、歩き続けた
  event_staranis2_06_s_104:
    speaker: "<Narration>"
    en: All of a sudden, she stops.
    ko: 그러던 중, 갑자기 멈춰선다.
    ja: 突然、足が止まった
  event_staranis2_06_s_105:
    speaker: "<Narration>"
    en: Her eyes lock onto the face of a man walking toward her.
    ko: 맞은 편에서 걸어오는 남자의 얼굴을 본다.
    ja: 向こうから歩いてくる男の顔を見た
  event_staranis2_06_s_106:
    speaker: "<Narration>"
    en: It's him. It's the same man who tormented her four times during Smile Time.
    ko: 스마일 박스 때, 4번이나 찾아와 자신을 괴롭혔던 남자다.
    ja: |-
      スマイルボックスで4回は見た、
      嫌がらせをしてきた男の顔だ
  event_staranis2_06_s_107:
    speaker: "<Narration>"
    en: His clothes and hair are different now, but there's no mistaking it. She can
      never forget his face.
    ko: 복장 스타일과 헤어 스타일이 많이 바뀌었지만 한 번에 알아볼 수 있다. 잊을 수 있을 리가 없다.
    ja: |-
      服装と髪型はかなり違うが、一目で分かる。
      忘れられるわけもない
  event_staranis2_06_s_108:
    speaker: "<Narration>"
    en: Anis freezes, her heart racing. He keeps getting closer.
    ko: |-
      아니스는 멈추어 선다.
      남자가 다가온다.
    ja: |-
      アニスは立ちすくんだ。
      男が近づいてくる
  event_staranis2_06_s_109:
    speaker: "<Narration>"
    en: Her breath quickens. Her body trembles.
    ko: 아니스는 호흡이 가빠지고 몸이 떨리는 것을 느꼈다.
    ja: 呼吸が荒くなり、体が震える
  event_staranis2_06_s_110:
    speaker: "<Narration>"
    en: Step by step, he closes the distance, and their eyes meet.
    ko: |-
      남자가 다가온다.
      아니스와 눈이 마주친다.
    ja: |-
      男がさらに近づいた。
      アニスと目が合った
  event_staranis2_06_s_111:
    speaker: "<Narration>"
    en: Without a flicker of recognition, he looks away and walks past her.
    ko: 남자는 무심하게 눈을 돌리고, 아니스를 스쳐 지나간다.
    ja: |-
      男は何気なく目をそらし、
      アニスの横を通り過ぎた
  event_staranis2_06_s_112:
    speaker: "<Narration>"
    en: Anis turns,
    ko: 아니스는 뒤를 돌아본다.
    ja: アニスは後ろを振り返った
  event_staranis2_06_s_113:
    speaker: "<Narration>"
    en: watching him as he walks forward.
    ko: 남자는 계속 걸어가고 있다.
    ja: 男はそのまま歩き去ろうとしていた
  event_staranis2_06_s_114:
    speaker: anis
    en: Um, excuse me...
    ko: 저, 저기.
    ja: あ、あの…
  event_staranis2_06_s_115:
    speaker: "<Narration>"
    en: The man turns back.
    ko: 남자가 뒤돌아본다.
    ja: 男が振り返った
  event_staranis2_06_s_116:
    speaker: "<Narration>"
    en: Their eyes meet.
    ko: 아니스와 눈이 마주친다.
    ja: アニスと目が合う
  event_staranis2_06_s_117:
    speaker: "<Narration>"
    en: Anis's breath grows ragged, cold sweat running down her face.
    ko: |-
      아니스의 호흡이 거칠어진다.
      식은땀이 줄줄 흐른다.
    ja: |-
      アニスの呼吸はさらに荒ぶり、
      冷や汗が流れ落ちた
  event_staranis2_06_s_118:
    speaker: "<Narration>"
    en: He studies her, a puzzled look in his eyes.
    ko: 남자는 의아한 표정으로 아니스를 빤히 바라본다.
    ja: |-
      男は不思議そうな顔で
      アニスを見返していた
  event_staranis2_06_s_119:
    speaker: anis
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_s_120:
    speaker: anis
    en: Ah, my bad. Thought you were someone else.
    ko: |-
      아, 미안.
      사람을 착각… 했네.
    ja: |-
      あ…すみません。
      人違い…でした。
  event_staranis2_06_s_121:
    speaker: "<Narration>"
    en: With an indifferent expression, the man turns and walks off.
    ko: 남자는 다시 무심한 표정으로 뒤로 돌아 걸어간다.
    ja: 男は再び前を向き、歩いて行った
  event_staranis2_06_s_122:
    speaker: "<Narration>"
    en: Anis steadies her breath, and soon, it evens out.
    ko: |-
      아니스는 호흡을 가다듬는다.
      곧 진정된다.
    ja: |-
      アニスは息を整え、
      自分を落ち着けた
  event_staranis2_06_s_123:
    speaker: "<Narration>"
    en: She remains there for a long while, watching people pass by.
    ko: 그곳에서 한참을 서 지나가는 사람들을 살핀다.
    ja: |-
      しばらくその場を動かず、
      行きかう人々の顔を眺め続けた
  event_staranis2_06_s_124:
    speaker: "<Narration>"
    en: Every so often, she catches glimpses of faces that are familiar and deeply
      unsettling.
    ko: 드문드문, 익숙하고도 공포스러운 얼굴이 보이지만.
    ja: 時々、見覚えのある恐ろしい顔が目に付く
  event_staranis2_06_s_125:
    speaker: "<Narration>"
    en: But no one recognizes her.
    ko: 그 누구도 아니스를 알아보지 못한다.
    ja: だが、アニスに気づく者はいなかった
  event_staranis2_06_s_126:
    speaker: "<Narration>"
    en: A faint laugh slips from her lips.
    ko: 아니스는 웃었다.
    ja: アニスは薄笑いを浮かべた
  event_staranis2_06_s_127:
    speaker: anis
    en: Heh, figures.
    ko: 하하. 이렇다니까.
    ja: あはは…やっぱり。
  event_staranis2_06_s_128:
    speaker: anis
    en: That's just how this place is.
    ko: 이런 곳이라고.
    ja: そういう所なのよ。
event_staranis2_06_e:
  event_staranis2_06_e_1:
    speaker: "<Narration>"
    en: Anis stands on a darkened stage, her gaze sweeping over the audience.
    ko: 아니스는 어두운 무대 위에서 관중석을 바라본다.
    ja: |-
      照明の消えたステージの上から、
      アニスは観客席を見た
  event_staranis2_06_e_2:
    speaker: "<Narration>"
    en: Cheers break out as their eyes move from her to her groupmates and back again.
    ko: 자신을 보며, 동료들을 보며 환호하는 관중들을 바라본다.
    ja: |-
      歓声を上げるファンたちが
      自分と仲間を見ている
  event_staranis2_06_e_3:
    speaker: anis_t
    en: I used to think
    ko: 쓰레기통.
    ja: ゴミ溜め…
  event_staranis2_06_e_4:
    speaker: anis_t
    en: this place was nothing but a garbage dump,
    ko: 이라고 생각했었어.
    ja: そう思ってた
  event_staranis2_06_e_5:
    speaker: anis_t
    en: that the Ark was rotten to the core, and that there wasn't a decent person
      in sight.
    ko: 방주는 썩어빠졌고, 좋은 사람이라고는 없는, 쓰레기통이라고 생각했어.
    ja: |-
      アークは腐りきってて、
      いい人なんか一人もいない、
      クズのたまり場だって
  event_staranis2_06_e_6:
    speaker: anis_t
    en: I thought it was all darkness with not even a glimmer of light.
    ko: 한 줌의 빛도 없는 어둠이라고 생각했어.
    ja: 光のない暗闇だと思ってた
  event_staranis2_06_e_7:
    speaker: anis_t
    en: It took me such a long time
    ko: 오래 걸렸다.
    ja: ずいぶん時間がかかった
  event_staranis2_06_e_8:
    speaker: anis_t
    en: to realize how wrong I was, to see that this wasn't a trash heap.
    ko: |-
      여기가 쓰레기통이 아니라는 것을 깨닫기까지,
      오래 걸렸어.
    ja: ここがそんな場所じゃないってことに気づくまで
  event_staranis2_06_e_9:
    speaker: anis_t
    en: After all, this is a place where people live, so there's definitely more good
      than bad.
    ko: |-
      결국엔 사람 사는 곳이었어.
      나쁜 것보단 좋은 게 훨씬 많은 게 당연한데.
    ja: |-
      ここにいるのはみんな、人。
      悪い人より、いい人の方が多くて
      当たり前だったのに
  event_staranis2_06_e_10:
    speaker: anis_t
    en: I just couldn't see it, since I was blinded by rage, amongst other things.
    ko: 분노랑 뭐 이런 거 저런 거 때문에 눈이 멀어버렸던 거야.
    ja: |-
      怒りやいろんな出来事のせいで、
      眼がくらんでた
  event_staranis2_06_e_11:
    speaker: anis_t
    en: The Ark isn't perfect. It's still filled with grime and shadows.
    ko: 물론 방주는 여전히 어둡고 지저분한 것들이 많지만.
    ja: |-
      もちろん、暗くて汚いものも
      昔からたくさんあるけど
  event_staranis2_06_e_12:
    speaker: anis_t
    en: But now, I see
    ko: 지금은 보여.
    ja: 今は見える
  event_staranis2_06_e_13:
    speaker: anis_t
    en: the stars shining in the darkness.
    ko: 어두운 곳에서 빛나는 별들이.
    ja: 暗い場所でも輝いてる星たちが。
  event_staranis2_06_e_14:
    speaker: anis_t
    en: And so,
    ko: 그러니 나는 이제
    ja: だから、私は…
  event_staranis2_06_e_15:
    speaker: anis_t
    en: I can love the Ark.
    ko: 방주를 사랑할 수 있어.
    ja: アークを好きになれる
  event_staranis2_06_e_16:
    speaker: anis_t
    en: I can dance and sing
    ko: 빛나는 그 별들을 위해
    ja: 輝いてる星たちのために
  event_staranis2_06_e_17:
    speaker: anis_t
    en: for those stars that shine.
    ko: 춤추고 노래할 수 있어.
    ja: 歌って踊ることができる
  event_staranis2_06_e_18:
    speaker: anis_t
    en: Thank you! One more song!
    ko: 앵콜! 고마워요!!
    ja: アンコールありがとうございます！！
  event_staranis2_06_e_19:
    speaker: "<Narration>"
    en: The crowd explodes into cheers.
    ko: 터져 나오는 함성들.
    ja: 歓声が沸き上がった
  event_staranis2_06_e_20:
    speaker: "<Narration>"
    en: A sea of glow sticks shimmers and dances.
    ko: 반짝이는 응원 봉.
    ja: ペンライトが揺れる
  event_staranis2_06_e_21:
    speaker: "<Narration>"
    en: So many people are here for her.
    ko: |-
      수많은 사람들.
      나를 사랑해 주는 수많은 사람들.
    ja: |-
      会場を埋め尽くしているのは、
      全て自分を愛してくれている人たちだ
  event_staranis2_06_e_22:
    speaker: "<Narration>"
    en: Anis scans the audience, desperate.
    ko: 아니스는 필사적으로 관중석을 본다.
    ja: アニスは観客席に目を凝らした
  event_staranis2_06_e_23:
    speaker: "<Narration>"
    en: There, she sees the Commander, Rapi, and Neon shouting her name at the top
      of their lungs.
    ko: |-
      지휘관과 라피와 네온이 보인다.
      목이 터져라 소리치고 있다.
    ja: |-
      指揮官とラピとネオンの姿が目に入った。
      声が枯れそうな勢いで叫んでいる
  event_staranis2_06_e_24:
    speaker: "<Narration>"
    en: Her brightest stars are calling out to her.
    ko: 나의 가장 빛나는 별들이 나를 보고 외치고 있다.
    ja: 私の一番星たちが、私を呼んでいる
  event_staranis2_06_e_25:
    speaker: "<Narration>"
    en: The ones who make her special. The ones who make her shine.
    ko: 나를 특별하게 만들어주는 빛나는 별들이 나를 비추고 있다.
    ja: |-
      私を特別にしてくれたきらめく星々が、
      自分を照らしている
  event_staranis2_06_e_26:
    speaker: "<Narration>"
    en: Strength surges through her, the rush climbing higher and higher.
    ko: |-
      아니스는 힘이 솟아오르는 것을 느꼈다.
      끝없는 고양감이 치솟는다.
    ja: |-
      アニスの身体に力がみなぎり、
      鼓動が果てしなく高まっていく
  event_staranis2_06_e_27:
    speaker: "<Narration>"
    en: She glances to the side.
    ko: 옆을 바라본다.
    ja: 左右を見た
  event_staranis2_06_e_28:
    speaker: "<Narration>"
    en: Mint and Prika meet her gaze, wearing the same look she knows is on her own
      face.
    ko: 아마도, 자신과 똑같을 것이 분명한 표정을 짓고 있는 민트와 프리카를 바라본다.
    ja: |-
      きっと自分も今、
      そこに立つ2人と同じ顔をしている
  event_staranis2_06_e_29:
    speaker: "<Narration>"
    en: Then, Anis shouts with everything she has.
    ko: 아니스가 크게 외친다.
    ja: アニスが声を張り上げた
  event_staranis2_06_e_30:
    speaker: anis_t
    en: Everyone! Thank you for coming!
    ko: 다들! 와줘서 고마워요!
    ja: みんな！来てくれてありがとー！
  event_staranis2_06_e_31:
    speaker: anis_t
    en: Thank you for loving us!
    ko: 우릴! 사랑해 줘서! 고마워요!
    ja: 私たちを！好きになってくれて！ありがとう！
  event_staranis2_06_e_32:
    speaker: anis_t
    en: I'll shine for every one of you!
    ko: 모두를 위한! 별이 될게요!
    ja: 私はみんなの！星になります！
  event_staranis2_06_e_33:
    speaker: anis_t
    en: Be! My! Star!
    ko: Be! My! Star!
    ja: Be! My! Star!
  event_staranis2_06_e_34:
    speaker: anis_t
    en: Riss... my first friend.
    ko: 리스. 내 첫 친구.
    ja: リス…私の初めての友だち
  event_staranis2_06_e_35:
    speaker: anis_t
    en: Please listen
    ko: 꼭 들어줘.
    ja: どうか聞いていて
  event_staranis2_06_e_36:
    speaker: anis_t
    en: to my last song.
    ko: 내 마지막 노래를.
    ja: 私の最後の歌
  staranis2:
    speaker: "<>"
    en:
    ko:
    ja:
  event_staranis2_06_e_37:
    speaker: anis_t
    en: "*Huff... huff... huff...*"
    ko: 하아… 하아… 하아…!
    ja: はぁ…！はぁ…！はぁ…！
  event_staranis2_06_e_38:
    speaker: mint_i
    en: "*Pant, pant*"
    ko: 후우… 후우…!
    ja: ふぅ…はぁ…！
  event_staranis2_06_e_39:
    speaker: prika_i
    en: Hoo... hoo...
    ko: 후-- 후--
    ja: はぁ…はぁ…
  event_staranis2_06_e_40:
    speaker: "<Narration>"
    en: The crowd is deafening.
    ko: 관객의 함성 소리가 굉장하다.
    ja: 大歓声が上がる
  event_staranis2_06_e_41:
    speaker: "<Narration>"
    en: T.T. STAR stares out into the audience as the lights begin to fade.
    ko: |-
      T.T. STAR는 조명이 조금씩 꺼져가는 것을 느끼며,
      관중석을 뚫어져라 바라본다.
    ja: |-
      3人は暗くなっていくステージの中で、
      観客席を見つめ続けた
  event_staranis2_06_e_42:
    speaker: "<Narration>"
    en: One by one, they dim.
    ko: 조명이 점점 꺼진다.
    ja: スポットライトが消えていく
  event_staranis2_06_e_43:
    speaker: "<Narration>"
    en: Tears threaten to spill,
    ko: 눈물이 터져 나올 것 같다.
    ja: 涙があふれそうになる
  event_staranis2_06_e_44:
    speaker: "<Narration>"
    en: but they hold them back.
    ko: 하지만 참는다.
    ja: 必死でこらえた
  event_staranis2_06_e_45:
    speaker: "<Narration>"
    en: Pop stars don't cry on stage.
    ko: 무대 위의 아이돌은, 팬에게 눈물을 보여선 안 된다.
    ja: |-
      ステージに立つアイドルが、
      ファンに涙を見せてはいけない
  event_staranis2_06_e_46:
    speaker: "<Narration>"
    en: They're here to give their fans a great time.
    ko: 그들에게 즐거움만 줘야 한다.
    ja: ファンには楽しさだけを感じてほしい
  event_staranis2_06_e_47:
    speaker: "<Narration>"
    en: That's what this is all for.
    ko: 그것이 엔터테인먼트니까.
    ja: それがエンターテイメントだから
  event_staranis2_06_e_48:
    speaker: "<Narration>"
    en: The lights fade further until the crowd is nothing but silhouettes.
    ko: |-
      조명이 꺼져간다.
      이제는 관객들의 실루엣만 보인다.
    ja: |-
      会場に暗闇が広がり、
      観客のシルエットだけが浮かび上がる
  event_staranis2_06_e_49:
    speaker: "<Narration>"
    en: And then,
    ko: 그리고 이윽고
    ja: そして、とうとう…
  event_staranis2_06_e_50:
    speaker: "<Narration>"
    en: darkness.
    ko: 조명이 꺼지고
    ja: 照明は消えた
  event_staranis2_06_e_51:
    speaker: "<Narration>"
    en: The curtain falls.
    ko: 커튼이 내려오고
    ja: 幕が下りる
  event_staranis2_06_e_52:
    speaker: "<Narration>"
    en: The show is over.
    ko: 공연이 끝났다.
    ja: ステージは終わった
  event_staranis2_06_e_53:
    speaker: "<Narration>"
    en: In an instant, all the members of T.T. STAR sink to the floor.
    ko: T.T. STAR는 주저앉았다.
    ja: |-
      その瞬間、身体から力が抜け、
      T.T. STARの全員が座り込んだ
  event_staranis2_06_e_54:
    speaker: anis_t
    en: Ngh...! Ahh...! Aaaahhh...!
    ko: 으… 아아…! 으아아아…!
    ja: う…ああ…！あああ…！
  event_staranis2_06_e_55:
    speaker: mint_i
    en: Uh... Ugh...! Nngh...!
    ko: 우… 우윽…! 으으읏…!
    ja: う…ううっ…！うううっ…！
  event_staranis2_06_e_56:
    speaker: prika_i
    en: "*Sob, sob...*"
    ko: 흑…! 흐윽…!
    ja: うっ…ヒック…！
  event_staranis2_06_e_57:
    speaker: anis_t
    en: H-hey, don't cry...!
    ko: 우, 울지, 마…!
    ja: な、泣かない…でよ…！
  event_staranis2_06_e_58:
    speaker: anis_t
    en: Why... why are you crying... o-on a day like this...?
    ko: 이렇게, 이렇게 좋은 날, 왜, 왜 울어…!
    ja: |-
      こんな、こんなうれしい日に、
      なんで泣くのよ…！
  event_staranis2_06_e_59:
    speaker: mint_i
    en: I'm... I'm trying, but... they won't stop...
    ko: 눈물이… 나는걸, 어떡, 하라… 고…!
    ja: 涙が…出るの…仕方ないでしょう…！
  event_staranis2_06_e_60:
    speaker: prika_i
    en: Ngh...! Waaaah!
    ko: 흐, 흐엉…! 흐어어엉--!
    ja: うっ…ぐすっ…！うううっ…！
  event_staranis2_06_e_61:
    speaker: "<Narration>"
    en: The three of them collapse into each other, sobbing uncontrollably.
    ko: 셋은 서로를 끌어안고 오열한다.
    ja: 3人は抱き合い、泣き崩れた
  event_staranis2_06_e_62:
    speaker: "<Narration>"
    en: Mustang makes his way toward them.
    ko: 머스탱이 다가온다.
    ja: マスタングが近づいた
  event_staranis2_06_e_63:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_e_64:
    speaker: anis_t
    en: B-Boss!
    ko: 사, 사장님…!
    ja: しゃ、社長…！
  event_staranis2_06_e_65:
    speaker: mint_i
    en: Did... did...
    ko: 우리…! 우리…!
    ja: 私たち…！私たち…！
  event_staranis2_06_e_66:
    speaker: prika_i
    en: Did we do okay?
    ko: 잘…! 했나요?
    ja: うまく…やれてたか？
  event_staranis2_06_e_67:
    speaker: mustang
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_06_e_68:
    speaker: "<Narration>"
    en: Mustang takes off his sunglasses.
    ko: 머스탱이 선글라스를 벗는다.
    ja: マスタングがサングラスを外した
  event_staranis2_06_e_69:
    speaker: "<Narration>"
    en: His eyes well up as he gazes at his pop stars.
    ko: 그렁그렁한 눈으로, 자신의 아이돌을 바라본다.
    ja: |-
      涙の浮かんだ目が、
      自分の育てたアイドルを見ていた
  event_staranis2_06_e_70:
    speaker: hanson
    en: You were amazing, Anis, Mint, Prika.
    ko: |-
      최고였어.
      아니스, 민트, 프리카.
    ja: |-
      最高だった。
      アニス、ミント、プリカ。
  event_staranis2_06_e_71:
    speaker: hanson
    en: Just like I knew you would be, my pop stars.
    ko: 역시 내 아이돌이야.
    ja: さすがは、私のアイドルだ。
  event_staranis2_06_e_72:
    speaker: anis_t
    en: "!"
    ko: "---!!"
    ja: "――！！"
  event_staranis2_06_e_73:
    speaker: "<Narration>"
    en: The three rush into Hanson's arms,
    ko: 셋이 달려들어 한슨의 품에 안긴다.
    ja: 3人は駆け寄り、ハンソンに飛びついた
  event_staranis2_06_e_74:
    speaker: "<Narration>"
    en: their grief spilling out in waves.
    ko: 슬픔을 쏟아낸다.
    ja: 悲しみは解き放たれ
  event_staranis2_06_e_75:
    speaker: "<Narration>"
    en: After pouring out all their sorrow,
    ko: 그리고 끝내.
    ja: そして、最後には…
  event_staranis2_06_e_76:
    speaker: "<Narration>"
    en: only joy remains.
    ko: 즐거움만이 남았다.
    ja: 喜びだけが残った
  event_staranis2_06_e_77:
    speaker: "<Narration>"
    en: 'Star Anis: The End'
    ko: 'STAR ANIS : END'
    ja: 'STAR ANIS : END'
event_staranis2_epilogue:
  event_staranis2_epilogue_1:
    speaker: anis_i
    en: Ah...
    ko: "…아."
    ja: "…あ…"
  event_staranis2_epilogue_2:
    speaker: anis_i
    en: Ahh...
    ko: "…아아."
    ja: "…ああ…"
  event_staranis2_epilogue_3:
    speaker: anis_i
    en: Ahhhhh...
    ko: "…아아아아아."
    ja: "…あああああ…"
  event_staranis2_epilogue_4:
    speaker: neon_v
    en: Rapi.
    ko: 라피.
    ja: ラピ。
  event_staranis2_epilogue_5:
    speaker: rapi_red
    en: Yes?
    ko: 응?
    ja: なに？
  event_staranis2_epilogue_6:
    speaker: neon_v
    en: Shouldn't we do something?
    ko: 뭐라도 해야 하지 않을까요?
    ja: どうにかした方がいいんじゃないでしょうか？
  event_staranis2_epilogue_7:
    speaker: rapi_red
    en: Do what?
    ko: 뭘?
    ja: 何を？
  event_staranis2_epilogue_8:
    speaker: neon_v
    en: She's been like that ever since the concert ended.
    ko: 공연 끝나고 난 뒤부터 계속 저러고 있잖아요.
    ja: ライブが終わってから、ずっとあの調子ですよ。
  event_staranis2_epilogue_9:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_10:
    speaker: rapi_red
    en: Perhaps, the real Anis didn't make it past that show.
    ko: 진짜 아니스는 공연 이후 성불한 것 아닐까.
    ja: |-
      きっとあのステージで
      中身が蒸発してしまったのね。
  event_staranis2_epilogue_11:
    speaker: rapi_red
    en: What's left is just a shell that looks like her.
    ko: 저기 남아있는 건 아니스의 모습을 한 빈껍데기인 거지.
    ja: あそこに残っているのは、アニスの抜け殻。
  event_staranis2_epilogue_12:
    speaker: neon_v
    en: Oh, so she's basically just an empty casing now. Just rolling around with
      nothing inside.
    ko: 아. 탄두와 화약 없이 나뒹구는 탄피가 된 거군요.
    ja: |-
      ああ、銃を撃った後に転がる、
      弾頭も火薬もない空っぽの薬きょうですか。
  event_staranis2_epilogue_13:
    speaker: rapi_red
    en: Right, Anis is just a spent shell.
    ko: 그래. 아니스는 탄피녀야.
    ja: そうね。もう弾切れ。
  event_staranis2_epilogue_14:
    speaker: neon_v
    en: Then I'll load her up with gunpowder.
    ko: 그렇다면 제가 화약을 채워드려야겠어요.
    ja: |-
      それなら、私が入れなおしてあげないと
      いけませんね。
  event_staranis2_epilogue_15:
    speaker: "<Self>"
    en: "... What are you two even talking about?"
    ko: "…너희들 대체 무슨 소릴 하고 있는 거야."
    ja: "…2人とも、何をしてるんだ？"
  event_staranis2_epilogue_16:
    speaker: neon_v
    en: Here I go. Firepower, loadi—
    ko: 갑니다! 화력--!! 충-- ㅈ…!
    ja: 行きますよ！火力――！！注にゅ…
  event_staranis2_epilogue_17:
    speaker: anis_i
    en: Aaaaaaah!
    ko: 아아아아아!!
    ja: あああああ！！
  event_staranis2_epilogue_18:
    speaker: neon_v
    en: Eeek! I think she's possessed!
    ko: 으악! 아니스가 빙의 된 모양이에요!
    ja: 大変です！アニスにアニスが取りつきました！
  event_staranis2_epilogue_19:
    speaker: rapi_red
    en: Wait, how'd we go from shell casings to ghosts?
    ko: 잠깐. 탄피에서 왜 갑자기 귀신 얘기로 넘어가는 거야.
    ja: 待って。お化けの話はしていなかったはず。
  event_staranis2_epilogue_20:
    speaker: anis_i
    en: Ughhhh!
    ko: 으으아아아아--!!
    ja: うああああ――！！
  event_staranis2_epilogue_21:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_22:
    speaker: anis_i
    en: Man, I don't wanna go up to the surface.
    ko: 아… 지상 올라가기 싫다.
    ja: あー…地上、行きたくない。
  event_staranis2_epilogue_23:
    speaker: anis_i
    en: I don't wanna fight. I just wanna be a pop star.
    ko: 싸우기 싫다. 아이돌 하고 싶다.
    ja: 戦いたくない…アイドル活動したい…
  event_staranis2_epilogue_24:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_25:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_26:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_27:
    speaker: anis_i
    en: I looked damn good at that concert. I was absolutely killing it.
    ko: 하… 공연 때 나 진짜 예뻤는데. 진짜 죽여줬었는데.
    ja: |-
      はぁ…ステージの私、
      すっごくかわいかったのに…
      世界一かわいかったのに…
  event_staranis2_epilogue_28:
    speaker: rapi_red
    en: Don't say things like that while scratching your stomach.
    ko: 배를 긁으면서 그런 말은 하지 말아 줘.
    ja: お腹をかきながら言うことじゃないわ。
  event_staranis2_epilogue_29:
    speaker: neon_v
    en: That's a lot of eye gunk you've got there.
    ko: 눈곱 굉장한데요.
    ja: 目ヤニもすごいですし。
  event_staranis2_epilogue_30:
    speaker: anis_i
    en: Ugh, I guess I have to go up.
    ko: 근데 올라가야지. 응.
    ja: でも、行かなきゃ。地上。
  event_staranis2_epilogue_31:
    speaker: anis_i
    en: Yeah, I'm with the Counters now, not T.T. STAR.
    ko: 카운터스니까. T.T. STAR가 아니라. 응.
    ja: |-
      今の私はカウンターズだから。
      T.T. STARじゃなくて。
  event_staranis2_epilogue_32:
    speaker: anis_i
    en: "... Heh, but seriously, I looked pretty damn good out there."
    ko: "…하아… 근데 진짜 나 예뻤는데 정말."
    ja: はぁ…私、本当にかわいかったのに…
  event_staranis2_epilogue_33:
    speaker: neon_v
    en: She's got it really bad.
    ko: 중증이네요.
    ja: 重症ですね。
  event_staranis2_epilogue_34:
    speaker: rapi_red
    en: She's really full of herself.
    ko: 연예인 병이야.
    ja: スポットライト症候群ね。
  event_staranis2_epilogue_35:
    speaker: "<Monologue>"
    en: With T.T. STAR's commemorative performance a success,
    ko: "…T.T. STAR의 기념 공연이 성공적으로 끝난 후."
    ja: "…T.T. STARのステージが無事に終わった後…"
  event_staranis2_epilogue_36:
    speaker: "<Monologue>"
    en: Anis quietly leaves the group.
    ko: 아니스는 조용히 T.T. STAR를 탈퇴했다.
    ja: |-
      アニスのT.T. STAR脱退が
      ひそやかに発表された
  event_staranis2_epilogue_37:
    speaker: "<Monologue>"
    en: Given her track record in the Ark, fans have already seen it coming, so the
      reaction is muted.
    ko: |-
      방주에서의 활약이 있었기 때문에,
      팬들도 예상한 바라 큰 반향은 없었고
    ja: |-
      すでにアーク中で戦歴が知られていたため、
      誰でも予想のつくことだったので、
      大きな騒ぎにはならなかった
  event_staranis2_epilogue_38:
    speaker: "<Monologue>"
    en: Before long, she earns the nickname "Combat Pop Star."
    ko: 아니스에겐 배틀 아이돌이라는 별명이 붙었다.
    ja: アニスは戦うアイドルと呼ばれるようになった
  event_staranis2_epilogue_39:
    speaker: neon_v
    en: Oh, Mint and Prika are on.
    ko: 엇. 민트랑 프리카 나와요.
    ja: あっ。ミントとプリカですよ。
  event_staranis2_epilogue_40:
    speaker: mint_i_op_r
    en: Hello! We're the two shining stars, Twinkle Twin Star! I'm Mint!
    ko: |-
      안녕하세요?
      빛나는 두 별! Twinkle Twin Star의 민트!
    ja: |-
      こんにちは！
      輝く二ツ星！
      Twinkle Twin Starのミントと！
  event_staranis2_epilogue_41:
    speaker: prika_i_op_l
    en: And I'm Prika.
    ko: 프리카에요.
    ja: プリカです。
  event_staranis2_epilogue_42:
    speaker: mint_i_op_r
    en: We may be newcomers, but we'll do our best! So we hope you'll support us!
    ko: 경력 있는 신입이지만, 잘 부탁드려요~
    ja: |-
      もうベテランの新人です、
      よろしくお願いしま～す！
  event_staranis2_epilogue_43:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_44:
    speaker: "<Monologue>"
    en: Then Mint and Prika officially debut under the new name Twinkle Twin Star.
    ko: 민트와 프리카는 Twinkle Twin Star가 되어 아이돌 그룹으로 데뷔했다.
    ja: |-
      ミントとプリカはアイドルグループとして
      Twinkle Twin Starと名を改め、
      再デビューした
  event_staranis2_epilogue_45:
    speaker: "<Monologue>"
    en: It seems they wanted to keep the T.T. STAR name alive in some way.
    ko: T.T. STAR라는 이름은 어떻게든 유지하고 싶었던 모양이다.
    ja: |-
      T.T. STARという略称は、
      変えたくなかったようだ
  event_staranis2_epilogue_46:
    speaker: "<Monologue>"
    en: After the concert, they drew in not only new fans but also former T.T. STAR
      fans, and things are taking off quickly.
    ko: 공연 이후, 새로운 팬은 물론 기존 T.T. STAR의 팬들도 흡수해 지금 꽤나 승승장구하고 있다.
    ja: |-
      新規のファンはもちろん、
      それまでのT.T. STARのファンも吸収し、
      かなり人気を伸ばしている
  event_staranis2_epilogue_47:
    speaker: "<Monologue>"
    en: Avistar and Mrs. Miss are said to be working with them, too.
    ko: 아비스타와 미세스 미스도 함께 한다고 한다.
    ja: |-
      アビスタとミセス・ミスが
      マネジメントについているらしい
  event_staranis2_epilogue_48:
    speaker: "<Monologue>"
    en: "... But Avistar is from an inspection unit. Is that really okay?"
    ko: "…아비스타. 감찰 부대인데 괜찮은 건가."
    ja: |-
      …アビスタは監察部隊所属だったはずだが、
      本業の方は大丈夫なのだろうか…
  event_staranis2_epilogue_49:
    speaker: anis_i
    en: Aaah... I'm the only one who got left out...
    ko: 아아… 나만 빠진… T.T. STAR….
    ja: ああ…私だけいない…T.T. STAR…
  event_staranis2_epilogue_50:
    speaker: anis_i
    en: I wanna be in T.T. STAR tooooo!
    ko: 나도 T.T. STAR 할래애애애애---!
    ja: 私もT.T. STARがいいぃぃぃ！！
  event_staranis2_epilogue_51:
    speaker: rapi_red
    en: You're always a star to us, Anis.
    ko: 아니스는 우리의 아이돌이야.
    ja: アニスは私たちのアイドルよ。
  event_staranis2_epilogue_52:
    speaker: neon_v
    en: Yeah, the shining star of the Counters.
    ko: 맞아요. 카운터스의 아이돌이죠.
    ja: そうですよ。カウンターズのアイドルです。
  event_staranis2_epilogue_53:
    speaker: "<Self>"
    en: Exactly.
    ko: 그럼 그럼.
    ja: その通りだな
  event_staranis2_epilogue_54:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_55:
    speaker: anis_i
    en: "*Sigh...* Fine, I'll make do with that."
    ko: 하아. 그래. 아쉬운 대로 그걸로 참지 뭐.
    ja: |-
      はあ…分かったわよ。
      残念だけど、それでガマンしてあげる。
  event_staranis2_epilogue_56:
    speaker: rapi_red
    en: What was that? That didn't sit well with me.
    ko: 뭐지. 조금 기분 나쁜데.
    ja: なぜかしら。少し不愉快ね。
  event_staranis2_epilogue_57:
    speaker: neon_v
    en: Yeah, no kidding.
    ko: 그러게요.
    ja: そうですね。
  event_staranis2_epilogue_58:
    speaker: anis_i
    en: So when are we going up?
    ko: 언제 올라가?
    ja: 次の地上行きはいつ？
  event_staranis2_epilogue_59:
    speaker: "<Self>"
    en: There's no fixed date. We can go whenever we're ready.
    ko: |-
      딱히 정해지진 않았어.
      우리가 준비되면 언제든 올라갈 수 있어.
    ja: |-
      具体的な日は決まっていない。
      準備が整い次第、いつでも行ける
  event_staranis2_epilogue_60:
    speaker: anis_i
    en: "... Really?"
    ko: "…그래?"
    ja: "…そうなの？"
  event_staranis2_epilogue_61:
    speaker: anis_i
    en: Then let's go now.
    ko: 그럼, 지금 올라가자.
    ja: じゃ、今すぐ行きましょ。
  event_staranis2_epilogue_62:
    speaker: "<Self>"
    en: Now?
    ko: 지금?
    ja: 今から？
  event_staranis2_epilogue_63:
    speaker: "<Self>"
    en: Are you sure?
    ko: 괜찮겠어?
    ja: 大丈夫なのか？
  event_staranis2_epilogue_64:
    speaker: anis_i
    en: Yeah. If I stay here, I'll just keep hanging onto it.
    ko: 응. 어차피 여기 있어봤자 미련만 계속 남을 테니까.
    ja: うん。ここにいたって、未練が残るだけだし。
  event_staranis2_epilogue_65:
    speaker: anis_i
    en: Better to head up sooner rather than later.
    ko: 조금이라도 빨리 올라가는 게 나아.
    ja: 少しでも早く出たい気分なの。
  event_staranis2_epilogue_66:
    speaker: "<Self>"
    en: "... All right, let's go then."
    ko: "…그래. 바로 올라가자."
    ja: "…そうか、それなら行こう"
  event_staranis2_epilogue_67:
    speaker: anis_i
    en: Gotcha.
    ko: 응. 가자.
    ja: うん。行きましょ！
  event_staranis2_epilogue_68:
    speaker: neon_v
    en: At least wipe your eyes before you go.
    ko: 눈곱은 좀 떼고 가시죠.
    ja: まずは目ヤニを取ってからですね。
  event_staranis2_epilogue_69:
    speaker: "<Monologue>"
    en: As the elevator rises toward the surface,
    ko: 지상으로 향하는 엘리베이터 안.
    ja: 地上へ向かうエレベーターの中
  event_staranis2_epilogue_70:
    speaker: "<Monologue>"
    en: Anis gazes out at the Ark through the glass.
    ko: 아니스는 유리창 너머로 방주를 바라보고 있다.
    ja: アニスがガラス越しにアークを見下ろしている
  event_staranis2_epilogue_71:
    speaker: "<Self>"
    en: What are you looking at?
    ko: 뭘 그렇게 보고 있어?
    ja: 何か気になるものでもあったか?
  event_staranis2_epilogue_72:
    speaker: anis_i
    en: The Ark.
    ko: 방주.
    ja: アーク…
  event_staranis2_epilogue_73:
    speaker: rapi_red
    en: Something on your mind?
    ko: 무슨 생각해?
    ja: 考え事？
  event_staranis2_epilogue_74:
    speaker: anis_i
    en: It's nothing. Just looking around.
    ko: 별생각 없어. 그냥 보는 거야.
    ja: 別に。ただ見てるだけ。
  event_staranis2_epilogue_75:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_76:
    speaker: anis_i
    en: No, scratch that, I'm actually kinda scared.
    ko: "…아니. 사실 좀 겁나서."
    ja: |-
      …ううん。
      ホントは、ちょっと怖くなってきちゃったの。
  event_staranis2_epilogue_77:
    speaker: anis_i
    en: That's what we're supposed to protect, right?
    ko: 저걸. 지켜야 한다는 거지.
    ja: 私たち…これを守ろうとしてるのよね。
  event_staranis2_epilogue_78:
    speaker: anis_i
    en: But from up here, the Ark looks huge.
    ko: 여기서 보니 새삼 엄청 넓구나. 방주.
    ja: |-
      ここから見ると、すごく大きいでしょ。
      アーク。
  event_staranis2_epilogue_79:
    speaker: anis_i
    en: "... You think we can actually do it?"
    ko: "…할 수 있을까. 우리가."
    ja: "…できると思う？私たちに。"
  event_staranis2_epilogue_80:
    speaker: rapi_red
    en: That doesn't sound like something the Ark's star would say.
    ko: 방주의 별이 약한 소릴 하네.
    ja: アークの星にしては、弱気すぎるわ。
  event_staranis2_epilogue_81:
    speaker: neon_v
    en: Yeah. If people heard their star talking like that, they'd be awfully disappointed.
    ko: 그러게요. 별을 보는 사람이 들으면 실망할 거예요.
    ja: |-
      そうです。星と思って見ている人たちを、
      がっかりさせてしまいます。
  event_staranis2_epilogue_82:
    speaker: anis_i
    en: Hey, I can show a little weakness around you guys.
    ko: 아니, 너희들 앞에서는 약한 소리 좀 할 수 있는 거잖아.
    ja: |-
      いや、あなたたちの前以外で
      こんなこと言わないわよ。
  event_staranis2_epilogue_83:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_84:
    speaker: anis_i
    en: "... No,"
    ko: "…아니다."
    ja: "…ううん。"
  event_staranis2_epilogue_85:
    speaker: anis_i
    en: I can't let myself show weakness anywhere.
    ko: 약한 소리는 어디에서든 하면 안 되지.
    ja: どこにいても、弱音は吐いちゃダメよね。
  event_staranis2_epilogue_86:
    speaker: anis_i
    en: Yeah, I'm gonna be the Ark's star, their beacon of hope.
    ko: 응. 방주의 별이 될 거니까. 희망이 될 거니까.
    ja: |-
      私たちは、アークの星。
      希望になるんだから。
  event_staranis2_epilogue_87:
    speaker: anis_i
    en: I might not be perfect, but I won't be a pathetic one.
    ko: 완벽하진 못해도, 못난 별이 될 순 없지.
    ja: |-
      たとえ完璧じゃなくても、
      頼りない星にはなれないわ。
  event_staranis2_epilogue_88:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_89:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  event_staranis2_epilogue_90:
    speaker: anis_i
    en: What's the matter? Feeling all touched now?
    ko: 왜 그래? 감동했어?
    ja: どうしたの？感動しちゃった？
  event_staranis2_epilogue_91:
    speaker: rapi_red
    en: That's not like you to say.
    ko: 그런 말 진짜 안 어울리는 거 같아서.
    ja: |-
      そういうセリフ、
      本当に似合わないと思って。
  event_staranis2_epilogue_92:
    speaker: neon_v
    en: You do one concert, and now you're going around saying all these embarrassing
      things.
    ko: 공연 한 번 하더니 낯 뜨거운 말을 막 하시네요.
    ja: |-
      アイドル活動のせいで、クサいセリフが
      クセになってしまったようですね。
  event_staranis2_epilogue_93:
    speaker: anis_i
    en: For crying out loud, you guys...
    ko: "…너 인마들아…."
    ja: あなたたちねぇ…
  event_staranis2_epilogue_94:
    speaker: "<Narration>"
    en: "*Whirrr*"
    ko: 지잉-
    ja: ウィーン――
  event_staranis2_epilogue_95:
    speaker: "<Monologue>"
    en: The elevator doors slide open.
    ko: 엘리베이터 문이 열린다.
    ja: エレベーターの扉が開いた
  event_staranis2_epilogue_96:
    speaker: "<Monologue>"
    en: Beyond them, the surface stretches into view.
    ko: 문 너머로 지상의 모습이 보인다.
    ja: ドアの向こうに、地上が広がる
  event_staranis2_epilogue_97:
    speaker: anis_i
    en: Ah, the weather's great today.
    ko: 아. 날씨 좋다 오늘.
    ja: わ。すごくいい天気。
  event_staranis2_epilogue_98:
    speaker: "<Monologue>"
    en: Anis gazes at the sky,
    ko: 아니스가 하늘을 올려다본다.
    ja: アニスは空を見上げた
  event_staranis2_epilogue_99:
    speaker: "<Monologue>"
    en: remaining still for what feels like forever.
    ko: 한참 동안, 움직이지 않는다.
    ja: そのまま、しばらく動かなかった
  event_staranis2_epilogue_100:
    speaker: "<Self>"
    en: Hey... what are you doing?
    ko: |-
      …?
      뭐해?
    ja: "…？どうした？"
  event_staranis2_epilogue_101:
    speaker: anis_i
    en: Heh... it's true.
    ko: 하… 진짜다.
    ja: ああ…ホントだったんだ。
  event_staranis2_epilogue_102:
    speaker: anis_i
    en: Even just watching the clouds drift by feels good.
    ko: 흘러가는 구름만 봐도 좋구나.
    ja: 流れる雲を見てるだけで…
  event_staranis2_epilogue_103:
    speaker: "<Monologue>"
    en: Anis breaks into a wide smile,
    ko: 아니스는 웃었다.
    ja: アニスが笑った
  event_staranis2_epilogue_104:
    speaker: "<Monologue>"
    en: one that seems to shine
    ko: 활짝 웃었다.
    ja: 弾けるような笑顔で
  event_staranis2_epilogue_105:
    speaker: "<Monologue>"
    en: as if it can light up the world.
    ko: 그 모습은, 마치 반짝이는---
    ja: その姿は、まるで輝く――
