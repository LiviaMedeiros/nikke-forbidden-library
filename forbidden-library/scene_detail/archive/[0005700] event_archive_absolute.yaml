    ja: このまま1人で救助を試みるべきか？
  event_absolute2_intermission_01_58:
    speaker: "<Narration>"
    en: Or should she find Eunhwa and Emma first, then go back for her?
    ko: 은화를, 엠마를 찾아내고 난 후, 구하러 가는 게 맞지 않을까?
    ja: |-
      それとも、ウンファやエマと先に合流してから
      助けるべきか？
  event_absolute2_intermission_01_59:
    speaker: eunhwa
    en: So,
    ko: 그러니까.
    ja: それだけだ。
  event_absolute2_intermission_01_60:
    speaker: eunhwa
    en: don't be scared.
    ko: 쫄지 마.
    ja: 恐れるな。
  event_absolute2_intermission_01_61:
    speaker: eunhwa
    en: So long as we use the most perfect tactics,
    ko: 가장 완벽한 전술로,
    ja: 誰より完璧な戦術をとり
  event_absolute2_intermission_01_62:
    speaker: eunhwa
    en: no matter the enemy or situation...
    ko: 어떤 적이든, 어떤 상황이든…!
    ja: あらゆる敵も、状況もはね返し…
  event_absolute2_intermission_01_63:
    speaker: eunhwa
    en: we will always clinch a flawless victory.
    ko: 반드시 완벽하게 승리해 내는 것.
    ja: 必ず完璧な勝利にする。
  event_absolute2_intermission_01_64:
    speaker: eunhwa
    en: That's what makes us,
    ko: 그것이 우리,
    ja: それが私たち…
  event_absolute2_intermission_01_65:
    speaker: eunhwa
    en: the Absolute Squad.
    ko: 앱솔루트다.
    ja: アブソルートだ。
  event_absolute2_intermission_01_66:
    speaker: vesti_t
    en: "... That's right."
    ko: "…맞아."
    ja: "…うん。"
  event_absolute2_intermission_01_67:
    speaker: "<Narration>"
    en: Vesti steels herself.
    ko: 베스티는 자세를 고쳐 잡았다.
    ja: ベスティーの表情が引き締まった
  event_absolute2_intermission_01_68:
    speaker: vesti_t
    en: I... I can't back down.
    ko: 난… 물러나선 안 돼.
    ja: 私…引き下がらないよ。
  event_absolute2_intermission_01_69:
    speaker: vesti_t
    en: I...!
    ko: 난…!
    ja: 私は…！
  event_absolute2_intermission_01_70:
    speaker: "<Narration>"
    en: "*Dash*"
    ko: 타탓-!
    ja: ダッ――！
  event_absolute2_intermission_01_71:
    speaker: "<Narration>"
    en: Vesti charges toward Delta.
    ko: 베스티가 델타를 향해 돌진했다.
    ja: ベスティーはデルタに向かって走った
  event_absolute2_intermission_01_72:
    speaker: delta
    en: Vesti?!
    ko: 베스티!?
    ja: ベスティー！？
  event_absolute2_intermission_01_73:
    speaker: "<Narration>"
    en: "*Screech*"
    ko: 촤아악-!
    ja: ズザッ！
  event_absolute2_intermission_01_74:
    speaker: "<Narration>"
    en: Vesti skids to a stop in front of Delta.
    ko: 베스티가 미끄러지듯 델타 앞에 멈춰 섰다.
    ja: |-
      ベスティーは勢いよく滑り込み、
      デルタの正面で止まった
  event_absolute2_intermission_01_75:
    speaker: vesti_t
    en: No matter the enemy or situation... we will always clinch a flawless victory!
    ko: 어떤 적이든, 어떤 상황이든! 완벽하게… 승리해야 하니까!
    ja: |-
      どんな敵にも、どんな状況にも…！
      完璧に…勝たなくちゃ！
  event_absolute2_intermission_01_76:
    speaker: "<Narration>"
    en: "*Growl*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_intermission_01_77:
    speaker: "<Narration>"
    en: As if on cue, glowing red eyes emerge from the room connected to the passage.
    ko: 기다렸다는 듯, 복도와 이어진 방에서 붉은 눈동자들이 나타나기 시작했다.
    ja: |-
      待ち構えていたと言うように、
      通路の死角になっていた部屋から
      紅い眼をした何かが気配を露わにした
  event_absolute2_intermission_01_78:
    speaker: vesti_t
    en: Because that's what Absolute does!
    ko: 그게 앱솔루트니까!!
    ja: それがアブソルートだから！！
  event_absolute2_intermission_01_79:
    speaker: "<Narration>"
    en: Vesti flings aside her shawl.
    ko: 베스티가 숄을 걷어 올렸다.
    ja: ベスティーがケープをめくりあげた
  event_absolute2_intermission_01_80:
    speaker: "<Narration>"
    en: Beneath, the countless scopes emit guiding lasers toward the sea of red eyes.
    ko: 그 안의 수많은 렌즈가, 각각 붉은 눈동자를 향해 가이드 레이저를 쏘아냈다.
    ja: |-
      その下にある無数のレンズから、
      紅い眼に向けてガイドレーザーが伸びる
  event_absolute2_intermission_01_81:
