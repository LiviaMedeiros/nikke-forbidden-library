    ko: 미사일이 쏘아져 나갔다.
    ja: 叫びとともに、ミサイルが勢いよく放たれた
event_absolute2_04_s:
  event_absolute2_04_s_1:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: ドカン！
  event_absolute2_04_s_2:
    speaker: eunhwa_t
    en: The sounds are getting closer...
    ko: 소리가 점점 가까워져 오고 있어….
    ja: 近くなってきたな…
  event_absolute2_04_s_3:
    speaker: eunhwa_t
    en: We're almost there.
    ko: 거의 다 온 것 같군.
    ja: もう少しだ。
  event_absolute2_04_s_4:
    speaker: emma_t
    en: Yeah, I'm picking up a signal further down the passage.
    ko: 응. 반응은 통로 안쪽에서 감지되고 있어.
    ja: そうね。この先にいるみたい。
  event_absolute2_04_s_5:
    speaker: eunhwa_t
    en: How many?
    ko: 수는?
    ja: 数は？
  event_absolute2_04_s_6:
    speaker: emma_t
    en: Not many.
    ko: 많진 않아.
    ja: 多くはないわ。
  event_absolute2_04_s_7:
    speaker: emma_t
    en: Two Predators...
    ko: "[프레데터]는 둘."
    ja: プレデターが2機…
  event_absolute2_04_s_8:
    speaker: emma_t
    en: And... two Nikkes fighting them. Though... it looks like only one of them
      is actually moving...
    ko: |-
      그를 상대하는 니케도 둘… 이야.
      정확히는 한 명만 움직이는 것 같지만….
    ja: |-
      交戦中のニケは…2人ね。
      動きがあるのは1人だけみたいだけど…
  event_absolute2_04_s_9:
    speaker: eunhwa_t
    en: Two Nikkes, but only one is moving...?
    ko: 둘인데 하나만 움직인다고…?
    ja: もう一方に動きがない…？
  event_absolute2_04_s_10:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_04_s_11:
    speaker: eunhwa_t
    en: Prepare for battle.
    ko: 전투에 바로 합류할 수 있게 준비해.
    ja: 戦闘に突入する準備をしておけ。
  event_absolute2_04_s_12:
    speaker: emma_t
    en: Roger.
    ko: 라져.
    ja: 了解。
  event_absolute2_04_s_13:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャッ
  event_absolute2_04_s_14:
    speaker: "<Narration>"
    en: With their weapons reloaded, the two enter the passage.
    ko: 각자 무기를 장전한 채, 둘은 통로로 진입했다.
    ja: |-
      2人はそれぞれ武器の状態を確認し、
      通路を進んだ
  event_absolute2_04_s_15:
    speaker: "<Narration>"
    en: At the end of the passage,
    ko: 통로의 끝.
    ja: たどりついた先で…
  event_absolute2_04_s_16:
    speaker: "<Narration>"
    en: Eunhwa sees it.
    ko: 은화는 보았다.
    ja: ウンファの目に飛び込んできたものは
  event_absolute2_04_s_17:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: ドカン！
  event_absolute2_04_s_18:
    speaker: "<Narration>"
    en: Vesti pushes an incoming enemy away with her shawl
    ko: 달려드는 적을 숄로 밀치고,
    ja: 飛びかかってくる敵を払いのけ
  event_absolute2_04_s_19:
    speaker: "<Narration>"
    en: and slams her missile launcher straight into it.
    ko: 그대로 미사일 런처를 꽂아 넣는 베스티를.
    ja: |-
      ミサイルランチャーを叩きつける
      ベスティーの姿だった
  event_absolute2_04_s_20:
    speaker: vesti_t
    en: Die.
    ko: 죽어.
    ja: 消えろ。
  event_absolute2_04_s_21:
    speaker: vesti_t
    en: Die!
    ko: 죽어!
    ja: 消えろっ！
  event_absolute2_04_s_22:
    speaker: vesti_t
    en: Diieee!
    ko: 죽어버려-!
    ja: 消えちゃえーっ！
  event_absolute2_04_s_23:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: ガスッ！
  event_absolute2_04_s_24:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: ドカッ！
  event_absolute2_04_s_25:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!
    ja: バキッ！
  event_absolute2_04_s_26:
    speaker: "<Narration>"
    en: Vesti's attack blasts off the Predator's lower jaw.
    ko: 베스티의 공격에 [프레데터]의 아래턱이 날아갔다.
    ja: |-
      ベスティーの猛攻が、
      プレデターの下あごを吹き飛ばした
  event_absolute2_04_s_27:
    speaker: "<Narration>"
    en: After confirming one enemy is down, she charges quickly at the next.
    ko: "[프레데터]가 침묵한 걸 확인한 베스티는 다음 적을 향해 빠르게 다가갔다."
    ja: |-
      目の前の敵が沈黙したのを確認すると、
      ベスティーは次の敵に向かってすばやく接近した
  event_absolute2_04_s_28:
    speaker: eunhwa_t
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_absolute2_04_s_29:
    speaker: emma_t
    en: Vesti just doesn't want to stay still.
    ko: 베스티는 멈춰있고 싶지 않은 거야.
    ja: あの子は、止まっていたくないみたいよ。
  event_absolute2_04_s_30:
    speaker: emma_t
    en: She's not like us.
    ko: 우리랑은 다르게.
    ja: 私たちとは違って。
  event_absolute2_04_s_31:
    speaker: emma_t
    en: You think that she's doomed if she doesn't have you by her side.
    ko: "은화가 함께 있지 못했으니까, \n베스티가 이미 죽었을 거라고 생각하고 있잖아."
    ja: |-
      あなたは自分が
      そばで守ってあげられなかったから、
      ベスティーが死んだって思ってる。
  event_absolute2_04_s_32:
    speaker: emma_t
    en: Because you don't trust her. No, you don't trust us.
    ko: 그 애를 못 믿어서.
    ja: あの子を信じてないから。
  event_absolute2_04_s_33:
    speaker: emma_t
    en: That's why you're pushing yourself harder than usual.
    ko: 아니, 우리를 믿지 못해서 평소보다 무리하고 있는 거잖아.
    ja: |-
      …いいえ。
      私たちのことが信じられないから、
      ずっと無理してるの。
  event_absolute2_04_s_34:
    speaker: emma_t
    en: You're the leader of the Absolute Squad...
    ko: 누구보다 앱솔루트 스쿼드가 완벽하다고 생각하고 있어야 하는,
    ja: |-
      誰よりもアブソルートのことを完璧だって
      信じてなくちゃいけない…
  event_absolute2_04_s_35:
    speaker: emma_t
    en: The one who should believe more than anyone
    ko: 앱솔루트 스쿼드의 리더가.
    ja: リーダーのあなたが。
  event_absolute2_04_s_36:
    speaker: emma_t
    en: that we're perfect.
    ko: 우리가 완벽하지 않다고 생각하고 있는 거잖아.
    ja: |-
      誰よりも、私たちのことを
      完璧じゃないって思ってる。
  event_absolute2_04_s_37:
    speaker: emma_t
    en: But you don't, do you?
    ko: 아니야?
    ja: 違った？
  event_absolute2_04_s_38:
    speaker: eunhwa_t
    en: "... Vesti."
    ko: "…베스티."
    ja: "…ベスティー。"
  event_absolute2_04_s_39:
    speaker: emma_t
    en: Eunhwa!
    ko: 은화!
    ja: ウンファ！
  event_absolute2_04_s_40:
    speaker: eunhwa_t
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_absolute2_04_s_41:
    speaker: emma_t
    en: Let's get in there.
    ko: 전투 합류할게.
    ja: さ、行きましょ。
  event_absolute2_04_s_42:
    speaker: eunhwa_t
    en: "... Yeah."
    ko: "…그래. 합류하자."
    ja: "…ああ、そうだな。"
event_absolute2_04_e:
  event_absolute2_04_e_1:
    speaker: emma_t
    en: Are you two okay?
    ko: 둘 다 무사해?
    ja: 2人とも、大丈夫？
  event_absolute2_04_e_2:
    speaker: vesti_t
    en: Eunhwa...! Emma!
    ko: 은화…! 엠마!
    ja: ウンファ…！エマ！
  event_absolute2_04_e_3:
    speaker: delta
    en: "... You're here."
    ko: "…오셨군요."
    ja: "…来てくださったんですね。"
  event_absolute2_04_e_4:
    speaker: delta
    en: Thank you... for saving me.
    ko: 구해주셔서… 감사합니다.
    ja: 救援…感謝します。
  event_absolute2_04_e_5:
    speaker: vesti_t
    en: Y-you're alive... Th-that's a relief...
    ko: 사, 살아 있었구나… 다, 다행이야….
    ja: い、生きてたんだね…よかったぁ…
  event_absolute2_04_e_6:
    speaker: "<Narration>"
    en: Vesti slumps to the ground.
    ko: 베스티가 바닥에 주저앉았다.
    ja: ベスティーは力が抜け、座り込んだ
  event_absolute2_04_e_7:
    speaker: emma_t
    en: Hehe, you were doing so well just now, so what's wrong? Feeling tired already?
    ko: |-
      후후, 아까까지 잘 싸워놓고 왜 그래~
      힘이 빠졌어?
    ja: |-
      ふふ…さっきまでの勢いは
      どこにいっちゃったのかしら～？
  event_absolute2_04_e_8:
    speaker: vesti_t
    en: I... I'm so relieved...
    ko: 헤헤, 안심해서 그런 가봐.
    ja: あ、安心しちゃって…
  event_absolute2_04_e_9:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_04_e_10:
    speaker: vesti_t
    en: Eu-Eunhwa... uh... um...
    ko: 으, 은화… 저기… 그게….
    ja: ウ、ウンファ…その…えっと…
  event_absolute2_04_e_11:
    speaker: eunhwa_t
    en: Delta, give me a damage report.
    ko: 델타, 상태는 어떻지?
    ja: デルタ、状態は？
  event_absolute2_04_e_12:
    speaker: delta
    en: "... Both my arm and leg parts are damaged."
    ko: "…팔, 다리 파츠가 모두 파손되어,"
    ja: "…腕と脚が全損しています。"
  event_absolute2_04_e_13:
    speaker: delta
    en: Moving unassisted is impossible.
    ko: 혼자서 움직이기엔 무리인 상황입니다.
    ja: 自力での移動は不可能です。
  event_absolute2_04_e_14:
    speaker: eunhwa_t
    en: "... Understood."
    ko: "…그렇군."
    ja: "…そうか。"
  event_absolute2_04_e_15:
    speaker: eunhwa_t
    en: Signal briefed me.
    ko: 시그널에게 대략적인 상황에 대해서는 들었다.
    ja: シグナルから大体の状況は聞いている。
  event_absolute2_04_e_16:
    speaker: eunhwa_t
    en: Did you find anything else of note while you were on your own?
    ko: 혼자 움직이면서 추가로 파악된 정보가 있어?
    ja: 単独行動中に分かったことはあるか？
  event_absolute2_04_e_17:
    speaker: delta
    en: Among the Predators, I identified one that stands out as an alpha.
    ko: 프레데터들 중, 명백히 상위 개체로 보이는 놈이 있다는 것을 발견했습니다.
    ja: |-
      プレデターの中には、明らかに上位個体らしき
      存在がいます。
  event_absolute2_04_e_18:
    speaker: delta
    en: When I first encountered it, it was heavily damaged and its core was exposed.
    ko: 그런데, 그게… 처음 봤었을 땐 분명, 코어가 노출되어 있을 정도로 다친 모습이었는데.
    ja: |-
      最初に見た時はコアもむき出しで、
      ボロボロの状態だったはずなのですが…
  event_absolute2_04_e_19:
    speaker: delta
    en: I lost track of it during pursuit, but when it reappeared, it had fully recovered.
    ko: 추적하던 중, 놓쳤다 다시 보니 몸이 완벽하게 회복되어 있었습니다.
    ja: |-
      追跡中に一度見失い、再び発見した時には
      完全に回復していました。
  event_absolute2_04_e_20:
    speaker: delta
    en: There may be multiple such alphas,
    ko: 상위 개체가 여러 마리인 것일지도 모릅니다만,
    ja: |-
      上位個体が複数存在する可能性も
      否定できませんが…
  event_absolute2_04_e_21:
    speaker: delta
    en: but after continued reconnaissance in this area, none others have appeared.
    ko: 이곳에서 계속 정찰해 본 결과, 그 이외의 개체가 나타난 적이 없어,
    ja: |-
      付近での偵察中には、あれ以外の
      上位個体とおぼしき存在は
      確認できていません。
  event_absolute2_04_e_22:
    speaker: delta
    en: Based on this, I assess that the damaged entity possesses regenerative ability.
    ko: 현재로서는 다쳤던 개체가 회복한 것으로 추측하고 있었습니다.
    ja: |-
      現状では、負傷した個体が
      自己修復したものと推測しています。
  event_absolute2_04_e_23:
    speaker: emma_t
    en: That must be the first one we saw...
    ko: 그거 분명히 우리가 처음 봤던….
    ja: それって、私たちが最初に見た…
  event_absolute2_04_e_24:
    speaker: eunhwa_t
    en: That's right. It devoured the alpha's core and transformed into a new alpha.
    ko: "맞아. \n상위 개체의 코어를 포식한 개체가, 새로운 상위 개체로 변했었지."
    ja: |-
      …間違いないな。
      上位個体のコアを食った個体が、
      新しい上位個体になったんだろう。
  event_absolute2_04_e_25:
    speaker: delta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_04_e_26:
    speaker: delta
    en: So that's what it was.
    ko: 그랬던 거였군요.
    ja: そういうことでしたか…
  event_absolute2_04_e_27:
    speaker: eunhwa_t
    en: That means they don't have regenerative abilities.
    ko: 그렇다는 건… 놈들의 특성 중 재생 능력은 없다는 게 되는 거로군.
    ja: |-
      つまり、急速に自己再生するような能力は
      ないはずだ。
  event_absolute2_04_e_28:
    speaker: emma_t
    en: Hehe, that's a small relief...
    ko: 후후, 불행 중 다행이네~
    ja: ふふ、不幸中の幸いね～
  event_absolute2_04_e_29:
    speaker: emma_t
    en: but we can't be sure just yet.
    ko: 아직 확정 지을 수는 없겠지만 말이야.
    ja: 確かめられるまで、油断はできないけど。
  event_absolute2_04_e_30:
    speaker: eunhwa_t
    en: "... Right."
    ko: "…그래."
    ja: "…ああ。"
  event_absolute2_04_e_31:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_04_e_32:
    speaker: eunhwa_t
    en: Vesti.
    ko: 베스티.
    ja: ベスティー。
  event_absolute2_04_e_33:
    speaker: vesti_t
    en: Y-yeah! Eu-Eunhwa, I-I was wrong...
    ko: "으, 응! 으, 은화. \n자, 잘못했…."
    ja: |-
      え、何？
      あっ、じゃなくて、ごめんな…
  event_absolute2_04_e_34:
    speaker: eunhwa_t
    en: I'm sorry.
    ko: 미안하다.
    ja: すまなかった。
  event_absolute2_04_e_35:
    speaker: vesti_t
    en: "... Huh?"
    ko: "…응?"
    ja: "…え？"
  event_absolute2_04_e_36:
    speaker: vesti_t
    en: Wh-what for?
    ko: 뭐, 뭐가…?
    ja: な、何のこと…？
  event_absolute2_04_e_37:
    speaker: eunhwa_t
    en: This was entirely my fault.
    ko: 이건 전적으로 내 판단 미스야.
    ja: すべては、私の判断ミスだ。
  event_absolute2_04_e_38:
    speaker: vesti_t
    en: Eunhwa...?
    ko: 은화…?
    ja: ウンファ…？
  event_absolute2_04_e_39:
    speaker: eunhwa_t
    en: I want you to take Delta and return to the survivors' camp.
    ko: 그러니까 넌 델타와 함께, 생존자들의 캠프로 돌아가.
    ja: |-
      デルタを連れて他の生存者がいる
      キャンプまで戻れ。
  event_absolute2_04_e_40:
    speaker: eunhwa_t
    en: If it's you as you are now, I'm sure you can handle any unexpected situation
      and get out safely.
    ko: 지금의 너라면, 어떤 돌발 상황이 발생해도 안전하게 밖으로 나갈 수 있을 거다.
    ja: |-
      今のお前なら、予測不能の事態にも
      対応できる。
  event_absolute2_04_e_41:
    speaker: eunhwa_t
    en: I'll cover you.
    ko: 뒤는 내가 엄호할게.
    ja: 後方は私が抑えておく。
  event_absolute2_04_e_42:
    speaker: vesti_t
    en: "... Why?"
    ko: "…왜?"
    ja: "…どうして？"
  event_absolute2_04_e_43:
    speaker: eunhwa_t
    en: What do you mean, why?
    ko: 왜냐니,
    ja: どうして、とは？
  event_absolute2_04_e_44:
    speaker: eunhwa_t
    en: It was my decision to come in here from the start.
    ko: 애초에 우리가 이곳에 들어온 건 내 판단이었어.
    ja: そもそも、ここへ来たことが私の判断だった。
  event_absolute2_04_e_45:
    speaker: eunhwa_t
    en: "... It's entirely my fault, so I'm the one who has to take responsibility."
    ko: |-
      …전적으로 내 탓이다.
      그러니 모든 책임은 내가 져야지.
    ja: |-
      …だから、ここで起こったことは
      全て私のせいだ。その責任は必ず取る。
  event_absolute2_04_e_46:
    speaker: vesti_t
    en: You're... taking responsibility?
    ko: 은화가… 책임을?
    ja: ウンファの…せい？
  event_absolute2_04_e_47:
    speaker: eunhwa_t
    en: I'm sor...
    ko: 미안하….
    ja: そうだ、すまなかっ…
  event_absolute2_04_e_48:
    speaker: vesti_t
    en: Stop saying you're sorry!
    ko: 미안하다고 하지 마!
    ja: 謝らないで！
  event_absolute2_04_e_49:
    speaker: vesti_t
    en: D-don't... apologize to me!
    ko: 나, 나한테… 미안하다고 하지 마!
    ja: わ、私に…謝ったりなんかしないで！
  event_absolute2_04_e_50:
    speaker: vesti_t
    en: Eunhwa, don't say things like that!
    ko: 은화가 그런 말 하지 마!
    ja: ウンファがそんなんじゃダメ！
  event_absolute2_04_e_51:
    speaker: eunhwa_t
    en: Vesti...?
    ko: 베스티…?
    ja: ベスティー…？
  event_absolute2_04_e_52:
    speaker: vesti_t
    en: That's not what you should be saying to me right now.
    ko: 은화가 지금 나한테 할 말은 그런 게 아니야.
    ja: |-
      ウンファが今言わなきゃいけないのは、
      そんなことじゃないでしょ？
  event_absolute2_04_e_53:
    speaker: vesti_t
    en: You should be yelling at me for not following your orders,
    ko: 왜 은화의 지시를 따르지 않았냐고
    ja: どうして私の指示に従わなかったんだって、
  event_absolute2_04_e_54:
    speaker: vesti_t
    en: screaming at me for ruining the whole mission!
    ko: 너 때문에 모든 작전이 어그러졌다고!
    ja: お前のせいで作戦が全部台無しだって！
  event_absolute2_04_e_55:
    speaker: vesti_t
    en: Telling me not to act on my own and make my own decisions!
    ko: 멋대로 생각하고 판단하지 말라고 호통을 치는 게!
    ja: 勝手な判断をするなって怒鳴り散らすのが…
  event_absolute2_04_e_56:
    speaker: vesti_t
    en: That's the Eunhwa I know!
    ko: 은화야!
    ja: 私の知ってるウンファだもん！
  event_absolute2_04_e_57:
    speaker: eunhwa_t
    en: "..."
    ko: "…너."
    ja: "……"
  event_absolute2_04_e_58:
    speaker: "<Narration>"
    en: Vesti looks Eunhwa in the eye.
    ko: 베스티가 은화를 마주 보았다.
    ja: ベスティーがウンファをまっすぐに見た
  event_absolute2_04_e_59:
    speaker: vesti_t
    en: So don't say things like that...
    ko: 그러니까 그렇게 말하지 마….
    ja: だから、そんなふうに言わないで…
  event_absolute2_04_e_60:
    speaker: vesti_t
    en: Don't say it was a mistake to... trust me.
    ko: 나를 믿은 게… 잘못됐다고 말하지 마.
    ja: |-
      私を信じたのは、
      間違いだったなんて言わないで。
  event_absolute2_04_e_61:
    speaker: vesti_t
    en: Don't say you thought I was weak!
    ko: 나를 약하게 생각하고 있었다고 말하지 마!
    ja: 私が弱いと思ってたとも言わないで！
  event_absolute2_04_e_62:
    speaker: vesti_t
    en: I'm not some Nikke you have to protect,
    ko: 난 네가 지켜야 할 니케가 아니라,
    ja: |-
      私はウンファに守ってもらわないといけない
      ニケじゃない。
  event_absolute2_04_e_63:
    speaker: vesti_t
    en: but instead, I'm the strongest monster you can unleash...
    ko: 은화가 쓸 수 있는 최강의 괴물이야.
    ja: ウンファと一緒に戦う最強のバケモノで…
  event_absolute2_04_e_64:
    speaker: vesti_t
    en: The best weapon you could ever ask for!
    ko: 최고의 도구라고!
    ja: 最高の武器なんだから！
  event_absolute2_04_e_65:
    speaker: eunhwa_t
    en: "... Vesti."
    ko: "…베스티."
    ja: "…ベスティー。"
  event_absolute2_04_e_66:
    speaker: "<Narration>"
    en: Emma looks Eunhwa in the eye.
    ko: 엠마가 은화를 마주 보았다.
    ja: エマもウンファをまっすぐに見た
  event_absolute2_04_e_67:
    speaker: emma_t
    en: Eunhwa.
    ko: 은화.
    ja: "…ウンファ。"
  event_absolute2_04_e_68:
    speaker: emma_t
    en: We're part of Absolute too.
    ko: 우리도 앱솔루트야.
    ja: 私たちは3人でアブソルートよ。
  event_absolute2_04_e_69:
    speaker: emma_t
    en: For our perfect selves,
    ko: 완벽한 우리를 위해,
    ja: 完璧な私たちになって…
  event_absolute2_04_e_70:
    speaker: emma_t
    en: for a perfect victory,
    ko: 완벽한 승리를 위해,
    ja: 完璧に勝つために…
  event_absolute2_04_e_71:
    speaker: emma_t
    en: we're ready to risk everything.
    ko: 모든 것을 걸 준비가 되어있어.
    ja: 私もすべてを捧げる覚悟はできてるわ。
  event_absolute2_04_e_72:
    speaker: emma_t
    en: No matter how many times we fail again and again,
    ko: 몇 번이고 실패하고 또 실패해도,
    ja: たとえ何度失敗しても…
  event_absolute2_04_e_73:
    speaker: emma_t
    en: we're ready to stand back up and risk our lives.
    ko: 다시 일어나서 목숨을 바칠 준비가 되어있다고.
    ja: 立ち上がって、もう一度命を燃やしてみせる。
  event_absolute2_04_e_74:
    speaker: eunhwa_t
    en: Emma...
    ko: 엠마….
    ja: エマ…
  event_absolute2_04_e_75:
    speaker: emma_t
    en: So, I'm going to ask you again.
    ko: 그러니 다시 물을게.
    ja: もう一度聞くわ。
  event_absolute2_04_e_76:
    speaker: emma_t
    en: Eunhwa, did we fail?
    ko: 은화. [우리]는 실패했어?
    ja: ウンファ。「私たち」は失敗したの？
  event_absolute2_04_e_77:
    speaker: emma_t
    en: When we faced countless unknown enemies
    ko: 그 강함을 측정할 수 없는,
    ja: 計り知ることもできない敵と…
  event_absolute2_04_e_78:
    speaker: emma_t
    en: whose strength we couldn't measure...
    ko: 미지의 적을 끝도 없이 상대하다가…!
    ja: いつ終わるとも知れない戦いに…！
  event_absolute2_04_e_79:
    speaker: emma_t
    en: did we end up failing in the end?
    ko: 결국 실패해 버린 거야?
    ja: 私たちは結局、負けてしまったの？
  event_absolute2_04_e_80:
    speaker: eunhwa_t
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_absolute2_04_e_81:
    speaker: emma_t
    en: If the Counters hadn't been there that day,
    ko: 그날, 카운터스 애들이 없었다면.
    ja: あの日、カウンターズがいなかったら…
  event_absolute2_04_e_82:
    speaker: emma_t
    en: do you think we would've lost?
    ko: "[우리]는 패배했을까?"
    ja: "「私たち」は負けてた？"
  event_absolute2_04_e_83:
    speaker: eunhwa_t
    en: We...
    ko: 우리는….
    ja: それは…
  event_absolute2_04_e_84:
    speaker: ingrid
    en: As you know, the surface is teeming with formidable enemies.
    ko: 알다시피 지상은 강대한 적으로 넘쳐난다.
    ja: |-
      分かっているだろう。
      地上は恐るべき脅威であふれかえっている。
  event_absolute2_04_e_85:
    speaker: ingrid
    en: Our reality as humanity is that
    ko: 그 강함을 측정할 수 없는,
    ja: 計り知ることもできない敵と…
  event_absolute2_04_e_86:
    speaker: ingrid
    en: we must endlessly face unknown foes whose strength cannot be measured.
    ko: 미지의 적을 끝도 없이 상대해야 하는 게 우리 인류의 현실이지.
    ja: |-
      いつ終わるとも知れない戦いを
      強いられているのが、我々人類の現実だ。
  event_absolute2_04_e_87:
    speaker: ingrid
    en: And yet, despite all this, do you still wish to reclaim the surface?
    ko: 그럼에도 제군은 지상을 탈환하고 싶은가.
    ja: それでも、地上の奪還を望み続けるか？
  event_absolute2_04_e_88:
    speaker: ingrid
    en: Do you intend to head up to the surface once more?
    ko: 다시 한번 지상으로 올라갈 생각인가.
    ja: もう一度、地上を目指すか？
  event_absolute2_04_e_89:
    speaker: ingrid
    en: Are you no longer afraid of failure?
    ko: 더는 실패가 두렵지 않은가.
    ja: 失敗を重ねることが怖くはないか？
  event_absolute2_04_e_90:
    speaker: ingrid
    en: Well? Answer me.
    ko: 답해라.
    ja: 答えろ。
  event_absolute2_04_e_91:
    speaker: ingrid
    en: What will you do going forward?
    ko: 제군은 앞으로 어떻게 하고 싶지?
    ja: お前たちは、どうする？
  event_absolute2_04_e_92:
    speaker: eunhwa
    en: "... I'm going to become perfect."
    ko: "…완벽해질 거다."
    ja: "…完璧になる。"
  event_absolute2_04_e_93:
    speaker: eunhwa
    en: Once I do,
    ko: 완벽해져서,
    ja: 完璧になって、
  event_absolute2_04_e_94:
    speaker: eunhwa
    en: I will surely reclaim the surface.
    ko: 난 반드시 지상을 탈환할 거다.
    ja: 必ず地上を取り戻す。
  event_absolute2_04_e_95:
    speaker: eunhwa
    en: With the most perfect tactics!
    ko: 가장 완벽한 전술로!
    ja: 誰より完璧な戦術をとり…！
  event_absolute2_04_e_96:
    speaker: eunhwa
    en: No matter the enemy, no matter the situation!
    ko: 어떤 적이든, 어떤 상황이든!
    ja: あらゆる敵も、状況もはね返し…！
  event_absolute2_04_e_97:
    speaker: eunhwa
    en: Even if I fail, even if I fall, even if this body is torn apart...
    ko: 실패하고, 넘어지고, 이 바디가 날아간다고 하더라도…!
    ja: |-
      失敗し、はいつくばり、
      このボディが砕け散ろうと…！
  event_absolute2_04_e_98:
    speaker: eunhwa
    en: I will grit my teeth, get back up, and tear the Raptures apart!
    ko: 이를 악물고 일어나, 랩쳐를 물어뜯어서라도,
    ja: |-
      歯を食いしばって立ち上がり、
      ラプチャーをかみちぎってでも…！
  event_absolute2_04_e_99:
    speaker: eunhwa
    en: I will absolutely,
    ko: 반드시.
    ja: 必ず…
  event_absolute2_04_e_100:
    speaker: eunhwa
    en: perfectly claim victory, no matter what!
    ko: 완벽하게 승리해 내고 말 거다.
    ja: 完璧に勝利する。
  event_absolute2_04_e_101:
    speaker: ingrid
    en: Good.
    ko: 좋다.
    ja: "…いいだろう。"
  event_absolute2_04_e_102:
    speaker: ingrid
    en: If that's your resolve,
    ko: 네 각오가 그렇다면,
    ja: それがお前の覚悟なら…
  event_absolute2_04_e_103:
    speaker: ingrid
    en: then I'll give you the chance to have perfect squadmates.
    ko: 제군과 함께, 절대 패배하지 않을.
    ja: 敗北を知らない仲間を紹介しよう。
  event_absolute2_04_e_104:
    speaker: ingrid
    en: A chance to fight alongside squadmates who never lose.
    ko: 가장 [완벽한] 동료들과 함께할 기회를 주겠다.
    ja: 最も「完璧」な仲間とともに戦う機会をやる。
  event_absolute2_04_e_105:
    speaker: eunhwa
    en: Perfect... squadmates?
    ko: 가장 완벽한… 동료?
    ja: 最も完璧な…仲間…？
  event_absolute2_04_e_106:
    speaker: ingrid
    en: Will you join the Absolute Squad?
    ko: 앱솔루트 스쿼드에 들어오겠나?
    ja: そうだ。アブソルートに名を連ねるか？
  event_absolute2_04_e_107:
    speaker: eunhwa
    en: "... Yes."
    ko: "…물론이야."
    ja: "…望むところだ。"
  event_absolute2_04_e_108:
    speaker: eunhwa_t
    en: "... You've been running your mouth for a while now."
    ko: "…잘도 떠들어 대기도 했군."
    ja: "…さっきから、好き放題に言ってくれる。"
  event_absolute2_04_e_109:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_04_e_110:
    speaker: eunhwa_t
    en: No, we'll never lose.
    ko: 아니. 패배하지 않아.
    ja: "…いいや。負けてなどいない。"
  event_absolute2_04_e_111:
    speaker: eunhwa_t
    en: We'll definitely win.
    ko: "[우리]는 반드시 이긴다."
    ja: "「私たち」は必ず勝つ。"
  event_absolute2_04_e_112:
    speaker: emma_t
    en: Hehe, that's more like it!
    ko: 후후, 그렇지?
    ja: ふふ、そうよね？
  event_absolute2_04_e_113:
    speaker: eunhwa_t
    en: "... *Sigh*"
    ko: "…하아."
    ja: フン…
  event_absolute2_04_e_114:
    speaker: eunhwa_t
    en: What a damn fool I was.
    ko: X신 머저리같이.
    ja: 私は大したマヌケだったな。
  event_absolute2_04_e_115:
    speaker: eunhwa_t
    en: To keep everyone safe,
    ko: 아무도 다치게 하지 않기 위해,
    ja: 誰も犠牲にしたくないからと…
  event_absolute2_04_e_116:
    speaker: eunhwa_t
    en: I took it all on myself—acting alone, fixing everything alone, and sacrificing
      myself alone...
    ko: 혼자 나서고, 혼자 해결하고, 혼자 희생하는 전술을 쓰겠다니.
    ja: |-
      1人で戦って、1人で解決して、
      1人だけ犠牲になる戦い方しか頭になかった。
  event_absolute2_04_e_117:
    speaker: eunhwa_t
    en: Honestly, this tactic is nothing but amateurish.
    ko: "…정말 삼류가 따로 없군."
    ja: "…とんだ三流だ。"
  event_absolute2_04_e_118:
    speaker: "<Narration>"
    en: "*Smack*"
    ko: 짝-!!
    ja: バチンッ！！
  event_absolute2_04_e_119:
    speaker: "<Narration>"
    en: Eunhwa slaps both her cheeks with her hands.
    ko: 은화가 손으로 자신의 양 뺨을 내리쳤다.
    ja: ウンファが両手で自身の頬を叩いた
  event_absolute2_04_e_120:
    speaker: vesti_t
    en: Eu-Eunhwa!?
    ko: 으, 은화…!?
    ja: ウ、ウンファ…！？
  event_absolute2_04_e_121:
    speaker: emma_t
    en: Oh my, are you okay?
    ko: 어머. 괜찮아?
    ja: あら、大丈夫？
  event_absolute2_04_e_122:
    speaker: eunhwa_t
    en: I'm sorry.
    ko: 미안하다.
    ja: すまなかった。
  event_absolute2_04_e_123:
    speaker: vesti_t
    en: D-don't say you're sorry...
    ko: 미, 미안하다고 하지 말라니….
    ja: あ、謝るのはやめてってば…
  event_absolute2_04_e_124:
    speaker: eunhwa_t
    en: From now on, I won't ever repeat some pathetic stunt that only a weakling
      would pull.
    ko: 앞으론 이딴 삼류 따위가 할 법한 찌질한 짓 같은 일을 반복하는 일은 없을 거다.
    ja: |-
      今後一切、そこらの三流同然の
      みっともないまねは繰り返さない。
  event_absolute2_04_e_125:
    speaker: emma_t
    en: Hehehe.
    ko: 후후후.
    ja: ふふふ。
  event_absolute2_04_e_126:
    speaker: vesti_t
    en: P-pathetic...
    ko: 찌, 찌질….
    ja: み、みっともない…？
  event_absolute2_04_e_127:
    speaker: eunhwa_t
    en: "... That's right."
    ko: "…그래. 맞아."
    ja: "…ああ、その通りだ。"
  event_absolute2_04_e_128:
    speaker: "<Narration>"
    en: Eunhwa looks at Vesti and Emma.
    ko: 은화가 베스티와 엠마를 바라보았다.
    ja: ウンファがベスティーとエマを見返した
  event_absolute2_04_e_129:
    speaker: eunhwa_t
    en: We are the best of the best.
    ko: 완벽한 건 [우리]야.
    ja: "「私たち」は完璧だ。"
  event_absolute2_04_e_130:
    speaker: eunhwa_t
    en: We are Absolute.
    ko: "[우리]가 앱솔루트지."
    ja: "「私たち」がアブソルートなんだ。"
  event_absolute2_04_e_131:
    speaker: vesti_t
    en: Yeah!
    ko: 응!
    ja: うん！
  event_absolute2_04_e_132:
    speaker: emma_t
    en: Hehe, that's right!
    ko: 후후. 그렇지~
    ja: ふふ、その通りね～
  event_absolute2_04_e_133:
    speaker: eunhwa_t
    en: We... won't fail again.
    ko: 우린… 다시는 패배하지 않아.
    ja: 私たちは…二度と負けはしない。
  event_absolute2_04_e_134:
    speaker: eunhwa_t
    en: Whether it's Behemoth, the Predators, or whatever else comes our way...
    ko: 베히모스 놈이든, 프레데터든 뭐든…!
    ja: ベヒモスにも、プレデターにも。
  event_absolute2_04_e_135:
    speaker: eunhwa_t
    en: Regardless of the enemy or the situation,
    ko: 어떤 놈들이 와도, 어떤 상황이 닥쳐도.
    ja: |-
      どんな敵が来ようと、
      どんな状況に直面しようと…
  event_absolute2_04_e_136:
    speaker: eunhwa_t
    en: we will win, no matter what.
    ko: 반드시 승리한다.
    ja: 必ず勝利する。
  event_absolute2_04_e_137:
    speaker: eunhwa_t
    en: For that perfect victory,
    ko: 그 [완벽한 승리]를 위해서라면,
    ja: "「完璧な勝利」のために…"
  event_absolute2_04_e_138:
    speaker: eunhwa_t
    en: we'll do whatever it takes to make it happen.
    ko: 할 수 있는 것은 뭐든 다 할 거다.
    ja: 使えるものはすべて使う。
  event_absolute2_04_e_139:
    speaker: emma_t
    en: Hehe, that's what I wanted to hear!
    ko: 후후, 바라던 바야~
    ja: ふふ、その言葉を待ってたわ～
  event_absolute2_04_e_140:
    speaker: vesti_t
    en: Heh, hehe...!
    ko: 헤, 헤헤…! 좋아.
    ja: へへ、えへへ…！
  event_absolute2_04_e_141:
    speaker: vesti_t
    en: Just say the word, and I'll kill them all!
    ko: |-
      말만 해.
      다 죽여버릴게!
    ja: |-
      いつでも指示して。
      全部消し飛ばしてあげるから！
  event_absolute2_04_e_142:
    speaker: eunhwa_t
    en: Let's go back.
    ko: 돌아간다.
    ja: ふん…さっさと戻るぞ。
event_absolute2_05_s:
  event_absolute2_05_s_1:
    speaker: vesti_t
    en: Equipment check... complete.
    ko: 장비 정비… 완료.
    ja: "…よし。整備完了。"
  event_absolute2_05_s_2:
    speaker: vesti_t
    en: Weapon condition... good, too.
    ko: 무장 상태도… 괜찮고.
    ja: 武器の状態も…異常なし。
  event_absolute2_05_s_3:
    speaker: vesti_t
    en: Got the map Signal gave us...
    ko: 시그널이 준 지도도 챙겼고….
    ja: シグナルがくれた地図も頭に入れたし…
  event_absolute2_05_s_4:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_05_s_5:
    speaker: vesti_t
    en: So, uh... are we all set now?
    ko: 이, 이제… 다 된 건가?
    ja: こ、これで…全部準備できたかな？
  event_absolute2_05_s_6:
    speaker: "<Narration>"
    en: Vesti looks down the passage she must take.
    ko: 베스티는 자신이 나아가야 할 복도를 바라보았다.
    ja: ベスティーは自分の進む方向を見た
  event_absolute2_05_s_7:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_05_s_8:
    speaker: "<Narration>"
    en: A few hours ago. In the temporary shelter inside the bunker.
    ko: 몇 시간 전. 벙커 내 임시거처.
    ja: 数時間前、巨大シェルター内、仮設キャンプ
  event_absolute2_05_s_9:
    speaker: delta
    en: At that time, Eunwha...
    ko: 은화가 거기서…!
    ja: "――そこでウンファが…！"
  event_absolute2_05_s_10:
    speaker: delta
    en: said stuff like "best of the best"
    ko: 완벽한 건 우리야.
    ja: "「私たち」は完璧だ。"
  event_absolute2_05_s_11:
    speaker: delta
    en: and "We're Absolute."
    ko: 우리가 앱솔루트지.
    ja: "「私たち」がアブソルートなんだ。"
  event_absolute2_05_s_12:
    speaker: delta
    en: It really was like something straight out of a movie!
    ko: "…라고 하는데! \n정말 한 편의 드라마 같았습니다!"
    ja: |-
      …って！
      本当にドラマのワンシーンのようで…！
  event_absolute2_05_s_13:
    speaker: signal
    en: Wow, no way... there was such an intense moment!
    ko: 와, 세상에… 그렇게나 뜨거운 장면이 있었다니!
    ja: |-
      す、すごい…！
      そんな熱いシーンがあったなんて…！
  event_absolute2_05_s_14:
    speaker: signal
    en: It really does sound like something straight out of a movie!
    ko: 진짜~ 드라마 같아요!
    ja: 本当にドラマみたいです…！
  event_absolute2_05_s_15:
    speaker: eunhwa_t
    en: Both of you... shut it.
    ko: 둘 다… 그 입 다물어라.
    ja: 2人とも…黙れ。
  event_absolute2_05_s_16:
    speaker: emma_t
    en: Eunhwa, are you okay? Your face is really red.
    ko: |-
      은화 괜찮아~?
      얼굴이 엄청 새빨개~
    ja: |-
      あらあら～？ウンファ、大丈夫？
      お顔が真っ赤よ～？
  event_absolute2_05_s_17:
    speaker: eunhwa_t
    en: Mind your own business!
    ko: 신경 꺼!
    ja: うるさい！
  event_absolute2_05_s_18:
    speaker: vesti_t
    en: Heh, hehe... it's been a while since I've seen Eunhwa shaking like this.
    ko: 헤, 헤헤… 오랜만에 초진동 은화다.
    ja: ぷ、ふふふ…久しぶりの超ぶるぶるウンファだ。
  event_absolute2_05_s_19:
    speaker: emma_t
    en: Hehe, it certainly has.
    ko: 후후, 그러게~
    ja: ふふ、本当ね～
  event_absolute2_05_s_20:
    speaker: eunhwa_t
    en: "*Sigh*... All right, looks like everyone's body is in working order for now,"
    ko: 하아… 일단 움직일 수 있을 만큼 각자 바디 정비들도 어느 정도 된 것 같으니.
    ja: |-
      はあ…ひとまず、全員動ける程度に
      整備は済んだようだな。
  event_absolute2_05_s_21:
    speaker: eunhwa_t
    en: so quit babbling and focus.
    ko: 쓸데없는 소리 말고, 다들 집중해.
    ja: 雑談の時間は終わりだ、集中しろ。
  event_absolute2_05_s_22:
    speaker: eunhwa_t
    en: Operation briefing starts now.
    ko: 작전 회의 시작한다.
    ja: 作戦会議を始める。
  event_absolute2_05_s_23:
    speaker: vesti_t
    en: O-okay.
    ko: 으, 응.
    ja: う、うん。
  event_absolute2_05_s_24:
    speaker: emma_t
    en: Got it!
    ko: 네에~
    ja: は～い。
  event_absolute2_05_s_25:
    speaker: eunhwa_t
    en: According to both Signal's map and what we personally saw on the way back,
    ko: 시그널이 준 지도와 돌아올 때 우리가 본 상황에 의하면,
    ja: |-
      まず脱出ルートだが、シグナルの地図と、
      私たちが得た情報を総合すると…
  event_absolute2_05_s_26:
    speaker: eunhwa_t
    en: the only exit from this bunker is...
    ko: 이 벙커에서 탈출구는….
    ja: このシェルターからの脱出口は…
  event_absolute2_05_s_27:
    speaker: "<Narration>"
    en: Eunhwa points to a spot on the map.
    ko: 은화가 지도의 한 곳을 가리켰다.
    ja: ウンファが地図の一点を指さした
  event_absolute2_05_s_28:
    speaker: eunhwa_t
    en: Here, at six o'clock.
    ko: 6시 방향의 이곳 하나뿐이다.
    ja: 6時の方向、ここだけだ。
  event_absolute2_05_s_29:
    speaker: emma_t
    en: Is that the one we came in through?
    ko: 우리가 들어왔던 곳이네~?
    ja: 私たちが入ってきた場所よね？
  event_absolute2_05_s_30:
    speaker: eunhwa_t
    en: "... Yes."
    ko: "…그래."
    ja: "…そうだ。"
  event_absolute2_05_s_31:
    speaker: eunhwa_t
    en: All the other routes had either collapsed
    ko: 다른 곳들은 전부 길이 무너져 있거나,
    ja: 他の場所はすべて崩壊しているか…
  event_absolute2_05_s_32:
    speaker: eunhwa_t
    en: or been blocked off by debris.
    ko: 장해물들로 가로막힌 상황이었다.
    ja: 障害物で道が塞がっている。
  event_absolute2_05_s_33:
    speaker: signal
    en: Oh, I see...
    ko: 아, 그랬군요…!
    ja: そんな…
  event_absolute2_05_s_34:
    speaker: eunhwa_t
    en: So here's the plan.
    ko: 그러니 지금부터.
    ja: 従って、作戦はこれから言う通りだ。
  event_absolute2_05_s_35:
    speaker: eunhwa_t
    en: Starting now, we'll escape through the exit at six o'clock
    ko: 우리는 6시 방향의 출구를 통해, 밖으로 탈출하는 것과 동시에.
    ja: まず、唯一の脱出口へ向けて突破を図る。
  event_absolute2_05_s_36:
    speaker: eunhwa_t
    en: while simultaneously blowing up this bunker.
    ko: 이 벙커를 폭파한다.
    ja: 同時に、このシェルターを爆破する。
  event_absolute2_05_s_37:
    speaker: signal
    en: Th-this place...?
    ko: 여, 여기를요…?
    ja: こ、この施設丸ごとですか…？
  event_absolute2_05_s_38:
    speaker: eunhwa_t
    en: There's still too much we don't know about these Predators.
    ko: 우린 저놈들에 대해 모르는 것이 너무 많다.
    ja: 私たちは敵について知らなすぎる。
  event_absolute2_05_s_39:
    speaker: eunhwa_t
    en: All we've managed to figure out so far is that
    ko: 지금까지 알아낸 거라곤,
    ja: これまでに判明していることは…
  event_absolute2_05_s_40:
    speaker: eunhwa_t
    en: their appearance and behavior are very wolf-like.
    ko: 저놈들은 외형에서 보이는 것처럼 늑대의 습성을 닮았다는 것.
    ja: |-
      奴らが外見通り、
      オオカミのような習性を持っていること…
  event_absolute2_05_s_41:
    speaker: eunhwa_t
    en: There seems to be an alpha among them,
    ko: 놈들 중 상위 개체가 하나 있고,
    ja: さらに上位個体が1匹存在し…
  event_absolute2_05_s_42:
    speaker: eunhwa_t
    en: and when it's in danger, a lower-ranking being devours its core and inherits
      its position.
    ko: 그 개체가 위기에 빠질 경우 하위 개체가 상위 개체의 코어를 포식하여 자리를 계승한다는 것.
    ja: |-
      上位個体が損傷すると、
      下位個体がそいつのコアを捕食し、
      新たな上位個体になるということ。
  event_absolute2_05_s_43:
    speaker: eunhwa_t
    en: The only other thing we know is that, fortunately, they don't seem to have
      regenerative abilities.
    ko: 다행히 재생 능력을 갖추고 있지 않다는 것, 정도다.
    ja: |-
      それから、幸いにも
      再生能力はないと思われることだけだ。
  event_absolute2_05_s_44:
    speaker: eunhwa_t
    en: That said, it's all still speculation. We can't be certain.
    ko: 이 또한 어디까지나 추측일 뿐, 확신할 수는 없어.
    ja: だが、これさえあくまで推測に過ぎない。
  event_absolute2_05_s_45:
    speaker: eunhwa_t
    en: The worst part is, we're right in the middle of their battlefield.
    ko: "무엇보다 최악인 점은, \n이곳이 녀석들이 짜놓은 전장 한복판이라는 거다."
    ja: |-
      ここが奴らの縄張りの
      ド真ん中だということも最悪だ。
  event_absolute2_05_s_46:
    speaker: eunhwa_t
    en: We don't even have an accurate count of how many are hiding in here.
    ko: 이곳에 숨어있는 놈들의 수조차 제대로 특정할 수 없는 상황이야.
    ja: 隠れている敵の数すら把握できていない。
  event_absolute2_05_s_47:
    speaker: eunhwa_t
    en: That's why we need to change the battlefield.
    ko: 그러니 전장을 바꾼다.
    ja: ならば、戦場を変えるしかない。
  event_absolute2_05_s_48:
    speaker: eunhwa_t
    en: We reduce their numbers as much as possible and lure them onto our ground.
    ko: 저 녀석들의 수를 최대한 줄이고, 우리의 전장으로 끌어들여야 해.
    ja: |-
      敵の戦力をできる限り削りながら、
      我々に有利な戦場へ引きずり込む。
  event_absolute2_05_s_49:
    speaker: eunhwa_t
    en: That comes first.
    ko: 그것이 첫 번째다.
    ja: これが最優先だ。
  event_absolute2_05_s_50:
    speaker: eunhwa_t
    en: And to do that... we have to take out this safe den of theirs
    ko: 그러기 위해선… 녀석들의 이 안전한 [굴]을 없애야 해.
    ja: |-
      そのためにも…奴らにとって安全な
      「巣穴」を潰す必要がある。
  event_absolute2_05_s_51:
    speaker: eunhwa_t
    en: and force them into a situation where they have no choice but to come out.
    ko: 어쩔 수 없이라도 녀석들이 이곳을 버리고 밖으로 나올 수밖에 없는 환경을 만들어야 한다.
    ja: |-
      外に出るしかない状況を作り、
      奴らにこの場を捨てさせる。
  event_absolute2_05_s_52:
    speaker: eunhwa_t
    en: Their invisibility is a headache,
    ko: 몸을 투명하게 만든다는 점이 까다롭긴 하지만,
    ja: 奴らが光学迷彩を使えることは厄介だが…
  event_absolute2_05_s_53:
    speaker: eunhwa_t
    en: but their physical specs aren't that impressive.
    ko: 결국 녀석들의 신체 스펙은 그다지 높지 않아.
    ja: ボディの能力自体はそこまで高くない。
  event_absolute2_05_s_54:
    speaker: eunhwa_t
    en: If we bring the bunker down and bury them, they won't be able to dig themselves
      out.
    ko: 벙커를 무너뜨려, 파묻어버리는 것에는 녀석들도 대처할 방도가 없을 거다.
    ja: |-
      脱出と同時にシェルターを破壊すれば、
      奴らにはどうにもできないだろう。
  event_absolute2_05_s_55:
    speaker: eunhwa_t
    en: Once we're out of here and the place is leveled,
    ko: 그렇게 이곳을 나가, 완전히 무너뜨리고 나면,
    ja: そうして、奴らの隠れ場所を潰した後…
  event_absolute2_05_s_56:
    speaker: eunhwa_t
    en: we track down the alpha and hit it with everything we've got.
    ko: 저것들의 [상위 개체]를 찾아, 집중 공격한다.
    ja: |-
      奴らの「上位個体」を探しだし、
      集中攻撃を仕掛ける。
  event_absolute2_05_s_57:
    speaker: delta
    en: The alpha...!
    ko: 상위 개체를…!
    ja: 上位個体を…！？
  event_absolute2_05_s_58:
    speaker: eunhwa_t
    en: If they truly resemble wolves,
    ko: 늑대의 특성과 닮아있는 녀석들이라면, 분명.
    ja: |-
      ああ、相手はオオカミに似た
      特性を持った奴らだ。
  event_absolute2_05_s_59:
    speaker: eunhwa_t
    en: the moment their alpha is taken down, the others will panic.
    ko: 상위 개체를 쓰러뜨리는 순간, 동요하는 기색을 보일 거다.
    ja: |-
      上位個体を撃破できれば、
      一時は統率が乱れるはずだ。
  event_absolute2_05_s_60:
    speaker: eunhwa_t
    en: That's when we strike.
    ko: 우린 그 틈을 노리는 거다.
    ja: その隙を狙う。
  event_absolute2_05_s_61:
    speaker: emma_t
    en: And if we eliminate a bunch of the lower-ranking ones when we destroy the
      bunker, that'll make our job easier later.
    ko: "벙커를 무너뜨릴 때, \n하위 개체들도 많이 없애놓으면 나중에 부담이 덜하겠네~?"
    ja: |-
      シェルターを壊す時に、
      数をいっぱい減らせれば
      もっと有利になるかもしれないわね～
  event_absolute2_05_s_62:
    speaker: eunhwa_t
    en: Precisely.
    ko: 맞아.
    ja: そうだな。
  event_absolute2_05_s_63:
    speaker: eunhwa_t
    en: So when we bring down the bunker, we have to bury as many as possible.
    ko: "그래서 벙커를 무너뜨릴 때, \n최대한 많은 놈들을 함께 묻어버려야 해."
    ja: |-
      ここを破壊する時は、
      奴らをできる限り多く巻き込みたい。
  event_absolute2_05_s_64:
    speaker: eunhwa_t
    en: As for this job...
    ko: 그러니….
    ja: その仕事は…
  event_absolute2_05_s_65:
    speaker: eunhwa_t
    en: it'll go to Vesti.
    ko: 그 역할은 베스티.
    ja: ベスティー。お前に任せる。
  event_absolute2_05_s_66:
    speaker: vesti_t
    en: Huh?
    ko: 응?
    ja: え？
  event_absolute2_05_s_67:
    speaker: eunhwa_t
    en: You'll do it.
    ko: 네가 한다.
    ja: できるな？
  event_absolute2_05_s_68:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_05_s_69:
    speaker: vesti_t
    en: D-do I just kill all of them?
    ko: 저, 전부 죽이면 되는 거야?
    ja: ぜ、全部壊しちゃっていいの？
  event_absolute2_05_s_70:
    speaker: eunhwa_t
    en: That's right. Use every last ounce of firepower you've got.
    ko: 그래. 전력을 쏟아내.
    ja: ああ。存分に暴れろ。
  event_absolute2_05_s_71:
    speaker: eunhwa_t
    en: Raze this place to the ground.
    ko: 이곳을 완전히 뭉개버려.
    ja: 跡形も残らないぐらいにやれ。
  event_absolute2_05_s_72:
    speaker: eunhwa_t
    en: Don't take your eyes off the target until it's utterly destroyed.
    ko: 완전히 뭉개는 순간까지 앞에서 시선을 떼지 마.
    ja: 完全に崩壊する瞬間までは、目を離すな。
  event_absolute2_05_s_73:
    speaker: eunhwa_t
    en: Even if it feels like your body is about to fall apart,
    ko: 온몸이 부서지는 한이 있더라도,
    ja: たとえ全身バラバラになろうと…
  event_absolute2_05_s_74:
    speaker: eunhwa_t
    en: show those monsters who the real monster is.
    ko: 괴물들에게 누가 진짜 괴물인지 보여주라고.
    ja: どちらが本物のバケモノか思い知らせてやれ。
  event_absolute2_05_s_75:
    speaker: vesti_t
    en: "... Got it!"
    ko: "…응!"
    ja: "…うん！"
  event_absolute2_05_s_76:
    speaker: eunhwa_t
    en: Emma, back Vesti up.
    ko: 엠마는 베스티를 지원해 줘.
    ja: エマはベスティーの援護を頼む。
  event_absolute2_05_s_77:
    speaker: eunhwa_t
    en: Stay alert and watch for any hostiles approaching her.
    ko: 베스티 주변에 다가오는 놈이 있는지 경계해.
    ja: 敵をベスティーに近寄らせるな。
  event_absolute2_05_s_78:
    speaker: emma_t
    en: Roger that.
    ko: 알겠어.
    ja: 分かったわ～
  event_absolute2_05_s_79:
    speaker: eunhwa_t
    en: Signal, Delta, and I will focus on getting these two out through the exit.
    ko: 나와 시그널, 델타는 저 둘을 데리고 출구 밖으로 나가는 것에 집중한다.
    ja: |-
      シグナルとデルタは、そこの2人の護衛だ。
      脱出だけに集中しろ。私も近くにいる。
  event_absolute2_05_s_80:
    speaker: eunhwa_t
    en: Signal.
    ko: 시그널.
    ja: シグナル。
  event_absolute2_05_s_81:
    speaker: signal
    en: Yes...!
    ko: 예…!
    ja: は、はい…！
  event_absolute2_05_s_82:
    speaker: eunhwa_t
    en: When you're near the entrance,
    ko: 입구 근처에 도달하면,
    ja: 脱出が完了したら…
  event_absolute2_05_s_83:
    speaker: eunhwa_t
    en: focus on sending a signal to the Unlimited squad.
    ko: 언리미티드 스쿼드에게 신호를 보내는 것에 집중해.
    ja: ただちにアンリミテッドに信号を送れ。
  event_absolute2_05_s_84:
    speaker: eunhwa_t
    en: Get them to come provide support.
    ko: 이쪽으로 지원해 올 수 있도록.
    ja: 救援要請を最優先で頼む。
  event_absolute2_05_s_85:
    speaker: signal
    en: G-got it!
    ko: 아, 알겠어요!
    ja: わ、分かりました！
  event_absolute2_05_s_86:
    speaker: eunhwa_t
    en: Delta, you focus on getting these two out.
    ko: 델타는 저 둘을 데리고 밖으로 나가는 것에만 집중해.
    ja: デルタは護衛と脱出だけに集中してくれ。
  event_absolute2_05_s_87:
    speaker: eunhwa_t
    en: You're not in any condition to be doing anything more than that.
    ko: 지금 네 바디로는 그 이상의 역할은 무리다.
    ja: それ以上の役割を任せられる状態じゃない。
  event_absolute2_05_s_88:
    speaker: delta
    en: "... Understood."
    ko: "…알겠습니다."
    ja: "…分かりました。"
  event_absolute2_05_s_89:
    speaker: scarecommander
    en: Are we really going to get out of here?
    ko: 정말 나가겠다고?
    ja: ほ、本当にここから逃げるつもりなのか？
  event_absolute2_05_s_90:
    speaker: scarecommander
    en: On our o-own?
    ko: 우, 우리 힘만으로?
    ja: 俺たちだけで？
  event_absolute2_05_s_91:
    speaker: eunhwa_t
    en: Of course. We're the only ones here, aren't we?
    ko: 그럼, 여기 우리 말고 또 누가 있지?
    ja: 当然だ。他に誰がいる？
  event_absolute2_05_s_92:
    speaker: scarecommander
    en: But if we wait for the support squad to arrive...
    ko: 지원 부대가 올 때까지 기다리면….
    ja: 救援が来るまで待った方が…
  event_absolute2_05_s_93:
    speaker: eunhwa_t
    en: Don't be a fool. How would backup even know to come here?
    ko: |-
      이 머저리가.
      지원 부대가 어떻게 여길 알고 오겠냐?
    ja: |-
      バカが。
      どうやってこの位置を知らせる？
  event_absolute2_05_s_94:
    speaker: scarecommander
    en: B-but... What if we fail trying to get out of here?
    ko: 하지만… 이대로 나갔다가… 실패하기라도 하면…!
    ja: |-
      し、しかし…このまま外に出て、
      失敗でもしたら…！
  event_absolute2_05_s_95:
    speaker: eunhwa_t
    en: So, because you're scared of failing, you won't even try?
    ko: 실패가 무서워서 시도조차 안 해보겠다고?
    ja: 失敗が怖いから何もしないのか？
  event_absolute2_05_s_96:
    speaker: scarecommander
    en: I...
    ko: 그건….
    ja: それは…
  event_absolute2_05_s_97:
    speaker: eunhwa_t
    en: If you're gonna give up, do it alone.
    ko: 포기는 너 혼자 해.
    ja: 諦めるなら勝手にしろ。
  event_absolute2_05_s_98:
    speaker: eunhwa_t
    en: You can stay behind alone for all I care.
    ko: 혼자 여기 있던가.
    ja: 1人でここに残るんだな。
  event_absolute2_05_s_99:
    speaker: scarecommander
    en: N-no way!
    ko: 그, 그건… 안 돼!
    ja: そ、それは嫌だ…！
  event_absolute2_05_s_100:
    speaker: eunhwa_t
    en: Then shut up and start moving.
    ko: 그럼 닥치고 앞으로 뛰기만 해.
    ja: だったら、黙って前に進め。
  event_absolute2_05_s_101:
    speaker: eunhwa_t
    en: That's your only job right now.
    ko: 네 역할은 그게 전부니까.
    ja: お前はそれだけできればいい。
  event_absolute2_05_s_102:
    speaker: scarecommander
    en: "... O-okay."
    ko: "…그, 그래…."
    ja: "…わ、分かった…"
  event_absolute2_05_s_103:
    speaker: eunhwa_t
    en: Eagle.
    ko: 이글.
    ja: イーグル。
  event_absolute2_05_s_104:
    speaker: soldiereg
    en: Y-yes!
    ko: 예, 예!
    ja: は、はい！
  event_absolute2_05_s_105:
    speaker: eunhwa_t
    en: Focus on protecting this weakling.
    ko: 넌 저 삼류를 지키는 것에만 집중해.
    ja: お前はその三流の護衛に集中しろ。
  event_absolute2_05_s_106:
    speaker: eunhwa_t
    en: All you need to think about is firing on any and all approaching Predators.
    ko: 접근하는 프레데터에게 총을 갈긴다고만 생각해라.
    ja: プレデターが接近したらとにかく撃て。
  event_absolute2_05_s_107:
    speaker: soldiereg
    en: G-got it!
    ko: 아, 알겠습니다!
    ja: わ、分かりました！
  event_absolute2_05_s_108:
    speaker: eunhwa_t
    en: I'll bring up the rear, watch for anyone tailing us,
    ko: 난 가장 뒤에서 뒤따라오는 녀석들이 있는지 경계하며,
    ja: 私は最後尾で追撃を警戒しつつ…
  event_absolute2_05_s_109:
    speaker: eunhwa_t
    en: and provide cover for everyone.
    ko: 모두를 지원하겠다.
    ja: 状況に応じて全体を支援する。
  event_absolute2_05_s_110:
    speaker: eunhwa_t
    en: Further specifics will be shared individually, if needed.
    ko: 나머지 세부적인 요소들은 필요시, 개별적으로 전달하도록 하지.
    ja: |-
      これ以外の細かい指示については、
      必要に応じて個別に行う。
  event_absolute2_05_s_111:
    speaker: eunhwa_t
    en: That clear to everyone?
    ko: 다들 이해했어?
    ja: 全員、理解できたか？
  event_absolute2_05_s_112:
    speaker: emma_t
    en: Roger.
    ko: 라져~
    ja: 了解よ～
  event_absolute2_05_s_113:
    speaker: signal
    en: Yes!
