  event_absolute2_05_e_64:
    speaker: vesti_t
    en: Y-yeah. This should be good enough.
    ko: 으, 응. 이쯤이면 좋을 거 같아.
    ja: う、うん。いいと思う。
  event_absolute2_05_e_65:
    speaker: "<Narration>"
    en: They stop, then turn around.
    ko: 뒤돌아 멈춰 섰다.
    ja: 振り返って、立ち止まった
  event_absolute2_05_e_66:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャリ――
  event_absolute2_05_e_67:
    speaker: "<Narration>"
    en: Emma and Vesti aim their guns toward the rear of the group.
    ko: 엠마와 베스티가 일행의 뒤를 향해 총을 겨눈다.
    ja: |-
      エマとベスティーが、
      味方の後方を見透かすように武器を構えた
  event_absolute2_05_e_68:
    speaker: emma_t
    en: The rest of you, hurry up the stairs! Leave this to us.
    ko: 자, 여기는 우리한테 맡기고 다들 얼른 뛰어 올라가~!
    ja: |-
      ここは私たちに任せて、
      みんなは早く上って～！
  event_absolute2_05_e_69:
    speaker: soldiereg
    en: A-are you two really planning on staying here?
    ko: 저, 정말 두 분은 여기에 남으시는 겁니까?
    ja: ほ、本当にお二人だけで？
  event_absolute2_05_e_70:
    speaker: emma_t
    en: Yeah. That's the plan, isn't it?
    ko: 응. 그게 작전이잖아?
    ja: そうよ。そういう作戦でしょ？
  event_absolute2_05_e_71:
    speaker: soldiereg
    en: B-but, we can't just leave you b-behind...!
    ko: 그, 그래도 어, 어떻게 두 분만 여기 두고…!
    ja: で、ですが、二人だけなんて…！
  event_absolute2_05_e_72:
    speaker: "<Narration>"
    en: Eunhwa runs towards the exit, leaving Emma and Vesti behind.
    ko: 은화는 엠마와 베스티를 뒤에 둔 채, 출입구를 향해 뛰어 올라갔다.
    ja: |-
      ウンファがエマとベスティーを背に残し、
      再び出口に向かって駆け上がり始めた
  event_absolute2_05_e_73:
    speaker: eunhwa_t
    en: What are you doing!
    ko: 뭐해!
    ja: 何をしている！
  event_absolute2_05_e_74:
    speaker: eunhwa_t
    en: Stay sharp and follow me!
    ko: 정신 팔지 말고, 따라 와!!
    ja: もたもたするな、さっさと走れ！！
  event_absolute2_05_e_75:
    speaker: scarecommander
    en: O-okay... Let's go, Eagle!
    ko: 그, 그래…! 얼른 가자, 이글!
    ja: あ、ああ…！イーグル、行くぞ！
  event_absolute2_05_e_76:
    speaker: soldiereg
    en: Wha...?
    ko: 예…?
    ja: え…？
  event_absolute2_05_e_77:
    speaker: "<Narration>"
    en: Emma and Vesti don't look back at Eunhwa's retreating figure.
    ko: 엠마와 베스티도 은화의 뒷모습을 바라보지 않았다.
    ja: |-
      エマとベスティーは、
      振り返ることもなく
      ウンファを背中で見送った
  event_absolute2_05_e_78:
    speaker: soldiereg
    en: Ahh... Okay!
    ko: 아아… 예!
    ja: は…はい！
  event_absolute2_05_e_79:
    speaker: "<Narration>"
    en: Seeing them move, Soldier E.G. also took off running outside.
    ko: 그 모습들을 바라보다, 솔져 E.G.도 밖을 향해 뛰어 올라갔다.
    ja: その様子を見たイーグルも駆けだした
  event_absolute2_05_e_80:
    speaker: emma_t
    en: It feels pretty good to be trusted, doesn't it, Vesti?
    ko: "신뢰받는 거 나쁘지 않네. \n그치, 베스티?"
    ja: |-
      信じてもらえるって悪くないかもね～
      ね、ベスティー？
  event_absolute2_05_e_81:
    speaker: vesti_t
    en: Yeah, it feels re-really great!
    ko: 응! 너, 너무 좋아…!
    ja: うん！すっごくいい気分…！
  event_absolute2_05_e_82:
    speaker: emma_t
    en: Since our leader has chosen to put her faith in us...
    ko: 그럼 우리 리더가 믿어준 만큼…!
    ja: |-
      じゃあ、私たちを信じてくれた
      リーダーのためにも…！
  event_absolute2_05_e_83:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 쾅-!
    ja: バン！
  event_absolute2_05_e_84:
    speaker: "<Narration>"
    en: Emma fires at a pair of red eyes crawling up the stairs.
    ko: 엠마가 계단을 타고 올라오는 붉은 눈동자를 향해 총을 쐈다.
    ja: |-
      エマが階下から追いついてきた
      紅い眼を撃ち抜き…
  event_absolute2_05_e_85:
    speaker: emma_t
    en: Let's go all out, huh?
    ko: 마음껏~ 날뛰어볼까?
    ja: 思いっきり暴れちゃいましょ？
  event_absolute2_05_e_86:
    speaker: "<Narration>"
    en: She proceeds to unleash a barrage of gunfire forward.
    ko: 그 후, 전방을 향해 총을 난사했다.
    ja: 休む間もなく、前方へ銃を乱射した
  event_absolute2_05_e_87:
    speaker: "<Narration>"
    en: "*Brrrrt brrrrt brrrrt*"
    ko: 투두두두두-
    ja: ズドドドドド――
  event_absolute2_05_e_88:
    speaker: "<Narration>"
    en: Red eyes start to emerge from the dark tunnel.
    ko: 어두운 굴속에 붉은 눈동자들이 생겨나기 시작했다.
    ja: |-
      暗がりの中で、
      紅い眼がひとつふたつと光り始める
  event_absolute2_05_e_89:
    speaker: "<Narration>"
    en: "*Grrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_05_e_90:
    speaker: "<Narration>"
    en: Just as dozens of red eyes are about to descend upon Emma and Vesti...
    ko: 수십 마리의 붉은 눈동자들이 엠마와 베스티를 향해 달려드는 순간,
    ja: |-
      数十の紅い眼がエマとベスティーめがけて
      迫ろうとした瞬間…
  event_absolute2_05_e_91:
    speaker: vesti_t
    en: Eunhwa believes in us, we mustn't...!
    ko: 은화가 믿고 맡긴 만큼, 반드시…!
    ja: |-
      ウンファが、信じて任せてくれた！
      だから…！
  event_absolute2_05_e_92:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 펄럭-
    ja: バサッ――
  event_absolute2_05_e_93:
    speaker: "<Narration>"
    en: Vesti flings aside her shawl.
    ko: 베스티가 숄을 걷어 올렸다.
    ja: ベスティーのケープがまくれあがる
  event_absolute2_05_e_94:
    speaker: "<Narration>"
    en: Dozens of scopes hidden underneath emit guiding lasers in all directions.
    ko: 그 안의 수많은 렌즈가 사방으로 가이드 레이저를 쏘아냈다.
    ja: |-
      隠れていた無数のレンズから
      四方にガイドレーザーが散った
  event_absolute2_05_e_95:
    speaker: "<Narration>"
    en: Dozens of red laser beams fills the entire bunker.
    ko: 수십 개의 붉은 선들이 벙커 안을 가득 메웠다.
    ja: |-
      数十もの赤い線が、
      シェルターの内側を埋め尽くしていく
  event_absolute2_05_e_96:
    speaker: vesti_t
    en: I will kill them all!!
    ko: 전부 죽여버릴 거야!!
    ja: ぜんぶ消えちゃえ！！
  event_absolute2_05_e_97:
    speaker: "<Narration>"
    en: "*Booooom*"
    ko: 콰아아아앙-!!!
    ja: ドゴォォォン！！
event_absolute2_06_s:
  event_absolute2_06_s_1:
    speaker: scarecommander
    en: We're finally outside...!
    ko: 드디어 밖이다…!
    ja: や、やっと出られた…！
  event_absolute2_06_s_2:
    speaker: scarecommander
    en: W-we made it!
    ko: 사, 살았어!
    ja: た、助かった…！
  event_absolute2_06_s_3:
    speaker: "<Narration>"
    en: "*Boom* *Boooom*"
    ko: 쾅- 콰아아앙-!!
    ja: ドーン！！ドカーン！！
  event_absolute2_06_s_4:
    speaker: "<Narration>"
    en: A massive tremor shakes the ground, followed by explosions rumbling from within
      the bunker.
    ko: 바닥을 울리는 거대한 진동과 함께, 벙커 안에서 폭음이 들려오기 시작했다.
    ja: |-
      大地を揺るがす巨大な振動とともに、
      シェルターの奥から激しい爆発音が聞こえる
  event_absolute2_06_s_5:
    speaker: scarecommander
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_06_s_6:
    speaker: soldiereg
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_06_s_7:
    speaker: soldiereg
    en: Th-that sounded so loud...!
    ko: 이, 이렇게나 큰 소리가…!
    ja: い、今の音は…！
  event_absolute2_06_s_8:
    speaker: eunhwa_t
    en: Snap out of it! Stop dawdling and move aside!
    ko: |-
      정신 안 차려?
      앞에서 얼쩡거리지 말고, 비켜!
    ja: |-
      何をぼーっとしている？
      うろうろするな、どけ！
  event_absolute2_06_s_9:
    speaker: eunhwa_t
    en: The mission isn't over yet!
    ko: 아직 작전 안 끝났어!
    ja: まだ作戦は終わってない！
  event_absolute2_06_s_10:
    speaker: soldiereg
    en: Y-yes!
    ko: 예, 예!
    ja: は、はい！
  event_absolute2_06_s_11:
    speaker: scarecommander
    en: O-okay...!
    ko: 아, 알겠어…!
    ja: わ、分かった…！
  event_absolute2_06_s_12:
    speaker: eunhwa_t
    en: Signal, Delta.
    ko: 시그널, 델타.
    ja: シグナル、デルタ！
  event_absolute2_06_s_13:
    speaker: eunhwa_t
    en: Pull back with those two and keep an eye on the perimeter.
    ko: 저 둘과 함께 뒤로 물러나서, 주변을 경계해.
    ja: |-
      そこの2人を連れて後退しろ、
      周辺の警戒を怠るな！
  event_absolute2_06_s_14:
    speaker: delta
    en: What? But we can still help with...
    ko: 예? 그래도 저희도 함께 돕는 게…!
    ja: え？危険です、私たちも一緒に…！
  event_absolute2_06_s_15:
    speaker: eunhwa_t
    en: Zip it. You might've been patched up, but you're still injured.
    ko: "아니. \n바디를 어느 정도 정비했다 하더라도, 넌 여전히 부상자다."
    ja: |-
      いや。
      多少整備したとはいえ、お前は負傷者だ。
  event_absolute2_06_s_16:
    speaker: eunhwa_t
    en: You're still far from being able to fight at full capacity.
    ko: 그 몸으로는 온전히 제 몫을 할 수 없어.
    ja: |-
      ここにいたって
      マトモに戦うことなどできん。
  event_absolute2_06_s_17:
    speaker: eunhwa_t
    en: I won't be able to protect you and fend off those things at the same time.
    ko: 그것들과 싸우면서 널 지킬 여유 따윈 없다.
    ja: 戦いながらかばってやれるほど余裕はないぞ。
  event_absolute2_06_s_18:
    speaker: delta
    en: "... Understood."
    ko: 알겠… 습니다.
    ja: 分かり…ました。
  event_absolute2_06_s_19:
    speaker: signal
    en: B-but I can at least act as an operator...!
    ko: 그, 그럼 제가 오퍼레이터라도 하는 건…!
    ja: で、では私がオペレーターを…！
  event_absolute2_06_s_20:
    speaker: eunhwa_t
    en: No. Establishing communication with the Unlimited Squad is your top priority.
    ko: "아니. \n넌 언리미티드 스쿼드와 연락하는 것을 최우선으로 생각해라."
    ja: |-
      それも不要だ。
      とにかくアンリミテッドとの通信に集中しろ。
  event_absolute2_06_s_21:
    speaker: eunhwa_t
    en: Under these conditions, that takes precedence.
    ko: 지금 상황에서는 그것이 가장 우선이야.
    ja: 今はそれが最優先だ。
  event_absolute2_06_s_22:
    speaker: signal
    en: "... Okay. Understood."
    ko: "…네. 알겠어요."
    ja: "…はい、分かりました。"
  event_absolute2_06_s_23:
    speaker: eunhwa_t
    en: Stay hidden until the Unlimited Squad arrives. Use decoys if you have to.
    ko: 언리미티드 스쿼드가 올 때까지, 데코이를 사용해서라도 몸을 숨겨라.
    ja: |-
      アンリミテッドが到着するまで、
      お前たちはデコイでも何でも使って身を隠せ。
  event_absolute2_06_s_24:
    speaker: eunhwa_t
    en: Just make sure not to set any up here.
    ko: 단, 이곳에는 절대 데코이를 설치해서는 안 돼.
    ja: ただし、私たちのことは隠すな。
  event_absolute2_06_s_25:
    speaker: eunhwa_t
    en: We're taking this bunker down.
    ko: 이곳은 우리가 마무리한다.
    ja: ここで奴らとケリをつける。
  event_absolute2_06_s_26:
    speaker: soldiereg
    en: What...? We can't deploy decoys here...?
    ko: 예…? 데코이를 쓰면 안 된다니….
    ja: えっ…？デコイを使わない…？
  event_absolute2_06_s_27:
    speaker: soldiereg
    en: But all the Raptures will congregate in this area!
    ko: 그럼, 랩쳐들이 이곳으로 몰려들 텐데…!
    ja: |-
      そ、それでは、ラプチャーが
      ここに集まってきてしまうのでは…！？
  event_absolute2_06_s_28:
    speaker: eunhwa_t
    en: That's the point.
    ko: 알아.
    ja: 理解の上だ。
  event_absolute2_06_s_29:
    speaker: scarecommander
    en: That's the point? You're gonna get yourself killed!
    ko: "안다고? \n그런데 그러다 죽을 수도 있는 걸 몰라?"
    ja: |-
      本気か？
      そんな命がけで戦って何になる？
  event_absolute2_06_s_30:
    speaker: eunhwa_t
    en: So we weren't at risk of dying all those other times?
    ko: 언제는 죽을 위기가 없었고?
    ja: 今まで命をかけてなかったとでも言うのか？
  event_absolute2_06_s_31:
    speaker: scarecommander
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_06_s_32:
    speaker: eunhwa_t
    en: Get a grip, Weakling. Failure and death have always been the surface's stalwart
      companions.
    ko: |-
      정신 차려, 삼류.
      지상은 원래 실패와 죽음으로 가득한 곳이다.
    ja: |-
      しっかりしろ、三流。
      地上はもともと敗北と死であふれた場所だ。
  event_absolute2_06_s_33:
    speaker: eunhwa_t
    en: If you're not willing to put your life on the line, you'll never achieve anything.
    ko: 목숨을 걸지 않으면, 아무것도 이뤄낼 수 없어.
    ja: 命をかけない限り、何も始まらない。
  event_absolute2_06_s_34:
    speaker: eunhwa_t
    en: You got that?
    ko: 알겠냐?
    ja: 違うか？
  event_absolute2_06_s_35:
    speaker: scarecommander
    en: That... That may be true, but...
    ko: 그건… 그렇지….
    ja: それは…そうだが…
  event_absolute2_06_s_36:
    speaker: eunhwa_t
    en: If that's gotten through your thick skull, shut your trap and scram.
    ko: 알았으면, 이제 더 떠들지 말고, 꺼져.
    ja: なら、余計な音を立てずに離れろ。
  event_absolute2_06_s_37:
    speaker: eunhwa_t
    en: Because this is our mission.
    ko: 이것은 우리의 작전이고,
    ja: ここは私たちの戦場だ。
  event_absolute2_06_s_38:
    speaker: eunhwa_t
    en: And we're going to do whatever it takes to succeed.
    ko: 우리는 반드시 승리해야 하니까.
    ja: 勝つ以外はない。
  event_absolute2_06_s_39:
    speaker: scarecommander
    en: "... O-okay."
    ko: "…그, 그래."
    ja: "…わ、分かった。"
  event_absolute2_06_s_40:
    speaker: soldiereg
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_s_41:
    speaker: delta
    en: Understood. Don't get yourself killed out there.
    ko: |-
      …알겠습니다.
      꼭 살아남으십시오.
    ja: |-
      …分かりました。
      必ず生き残ってください。
  event_absolute2_06_s_42:
    speaker: signal
    en: We'll meet up with the Unlimited Squad and return to back you up.
    ko: 언리미티드 스쿼드와 합류 후, 꼭… 지원하러 올게요!
    ja: |-
      アンリミテッドと合流次第、
      すぐに…救援に戻りますので…！
  event_absolute2_06_s_43:
    speaker: eunhwa_t
    en: Just focus on keeping yourself alive, for now.
    ko: 일단 살아남기나 해.
    ja: まずは自分たちが生き残れ。
  event_absolute2_06_s_44:
    speaker: signal
    en: "... We will!"
    ko: "…네!"
    ja: "…はい！"
  event_absolute2_06_s_45:
    speaker: delta
    en: All right, we should get going too.
    ko: 그럼, 저희도 이만 움직이지 말입니다.
    ja: では、こちらも最善を尽くします。
  event_absolute2_06_s_46:
    speaker: scarecommander
    en: "... Okay."
    ko: "…응."
    ja: "…ああ。"
  event_absolute2_06_s_47:
    speaker: "<Narration>"
    en: Signal and Delta go off to find a place to hide.
    ko: 시그널과 델타가 숨을 장소를 찾아 걸어갔다.
    ja: |-
      シグナルとデルタが、
      身を潜める場所を探すためその場を離れた
  event_absolute2_06_s_48:
    speaker: scarecommander
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_s_49:
    speaker: scarecommander
    en: They're staking their lives... for the sake of one mission...
    ko: "…목숨을… 거는… 작전."
    ja: "…命がけの…作戦…"
  event_absolute2_06_s_50:
    speaker: scarecommander
    en: I get that they're an elite squad, but... surely they don't actually think
      they stand a chance against those numbers?
    ko: "아무리 최정예 스쿼드라지만… \n정말 저 인원만으로 그것들을 이길 수 있다고 믿는다고?"
    ja: |-
      いくら最精鋭の部隊だって…
      あんな人数で勝てるわけがない…！
  event_absolute2_06_s_51:
    speaker: scarecommander
    en: I don't get it...
    ko: 이해할 수 없어….
    ja: 理解できん…
  event_absolute2_06_s_52:
    speaker: scarecommander
    en: I...
    ko: 난….
    ja: 俺は…
  event_absolute2_06_s_53:
    speaker: soldiereg
    en: Commander? Are you coming?
    ko: 지휘관? 안 가십니까?
    ja: 指揮官？どうしました？
  event_absolute2_06_s_54:
    speaker: scarecommander
    en: Oh... Yeah.
    ko: 아… 그래.
    ja: ああ…今行く。
  event_absolute2_06_s_55:
    speaker: "<Narration>"
    en: Eagle and the commander follow Signal and Delta.
    ko: 둘도 시그널과 델타를 따라 움직였다.
    ja: 2人もシグナルとデルタの後に続いた
  event_absolute2_06_s_56:
    speaker: eunhwa_t
    en: Whew... All right then.
    ko: 후우… 그럼.
    ja: フン…よし。
  event_absolute2_06_s_57:
    speaker: "<Narration>"
    en: Eunhwa quickly moves to a higher vantage point where she can see the bunker
      entrance and takes position.
    ko: 은화는 빠르게 뛰어가, 벙커의 입구가 보이는 고지에 자리를 잡았다.
    ja: |-
      ウンファは高台に駆けあがり、
      シェルターの入口が見える位置を確保した
  event_absolute2_06_s_58:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_s_59:
    speaker: "<Narration>"
    en: She points her rifle at the entrance, from which explosions can still be heard
      emanating,
    ko: 그리고 폭음이 들려오는 벙커 입구를 조준한 채,
    ja: |-
      そして、絶えず爆発音の続く
      シェルターの入口に照準を合わせ…
  event_absolute2_06_s_60:
    speaker: "<Narration>"
    en: and peers through her scope.
    ko: 스코프에 눈을 가져다 댔다.
    ja: スコープに目を当てた
  event_absolute2_06_s_61:
    speaker: eunhwa_t
    en: "... I believe."
    ko: "…믿는다."
    ja: "…信じるぞ。"
  event_absolute2_06_s_62:
    speaker: "<Narration>"
    en: Thick plumes of smoke pour out from the entrance of the bunker.
    ko: 자욱한 연기가 벙커의 입구에서 쏟아지듯 뿜어져 나온다.
    ja: |-
      シェルターの入口から
      濃い煙がもうもうと立ち上る
  event_absolute2_06_s_63:
    speaker: "<Narration>"
    en: Through her scope, the first thing Eunhwa sees...
    ko: 그리고 은화의 스코프에 가장 먼저 보인 것은
    ja: |-
      ウンファのスコープの中へ
      最初に飛び込んできたものは…
  event_absolute2_06_s_64:
    speaker: "<Narration>"
    en: Is Emma and Vesti bursting through the wall of smoke.
    ko: 연기를 뚫고 뛰쳐나오는 엠마와 베스티였다.
    ja: |-
      煙を突き破るように飛び出してきた
      エマとベスティーの姿だ
  event_absolute2_06_s_65:
    speaker: eunhwa_t
    en: "... Whew."
    ko: "…후."
    ja: "…ふぅ。"
  event_absolute2_06_s_66:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕-!
    ja: バン！
  event_absolute2_06_s_67:
    speaker: "<Narration>"
    en: The head of a Predator hot on Emma and Vesti's heels is blown apart.
    ko: 엠마와 베스티의 뒤를 쫓던 프레데터 한 기의 머리가 박살 난다.
    ja: |-
      エマとベスティーの後を追ってきた
      1機のプレデターの頭部が砕け散った
  event_absolute2_06_s_68:
    speaker: "<Narration>"
    en: Eunhwa then fires three shots in rapid succession, dropping three more Predators.
    ko: |-
      그리고 연이은 은화의 사격.
      프레데터 셋이 그대로 고꾸라진다.
    ja: |-
      ウンファの射撃音が続き、
      3機のプレデターが前のめりに倒れ込んだ
  event_absolute2_06_s_69:
    speaker: vesti_t
    en: Whoa! Even with all this smoke, she's nailing every shot!
    ko: 여, 연기가 이렇게 자욱한데 잘도 맞추네!
    ja: こ、こんな煙の中でよく当たるね！
  event_absolute2_06_s_70:
    speaker: emma_t
    en: Very impressive.
    ko: 그러게.
    ja: さすがね～
  event_absolute2_06_s_71:
    speaker: eunhwa_t
    en: Both of you, cut the chit-chat and back me up.
    ko: 잡담하지 말고 옆으로 와서 백업해!
    ja: 口より足を動かせ！
  event_absolute2_06_s_72:
    speaker: "<Narration>"
    en: Emma and Vesti climb up the slope and join Eunhwa.
    ko: 엠마와 베스티가 오르막을 올라 은화의 곁으로 이동한다.
    ja: |-
      エマとベスティーが坂を駆けあがり、
      ウンファの隣にたどりついた
  event_absolute2_06_s_73:
    speaker: "<Narration>"
    en: Vesti glances toward the bunker entrance and speaks up.
    ko: 베스티가 벙커 입구 쪽을 바라보며 말한다.
    ja: |-
      ベスティーがシェルターの入口を見ながら
      ぽつりとこぼした
  event_absolute2_06_s_74:
    speaker: vesti_t
    en: I don't see any more coming out... did we get them all?
    ko: 더, 더 안 나오네? 다 죽은 걸까?
    ja: も、もう出てこない？全部死んじゃった？
  event_absolute2_06_s_75:
    speaker: emma_t
    en: I don't think that's likely.
    ko: "…그럴 리는 없을 것 같은데."
    ja: そうは思えないわねぇ。
  event_absolute2_06_s_76:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_s_77:
    speaker: emma_t
    en: The air! It's shimmering!
    ko: "!! 공기가 일렁여!"
    ja: "！！空気が揺らいでるわ…！"
  event_absolute2_06_s_78:
    speaker: eunhwa_t
    en: They've got optical camouflage! Vesti! Make more smoke!
    ko: |-
      놈들이 광학미채를 키고 움직인다!
      베스티! 연기를 만들어!
    ja: |-
      光学迷彩だな！
      ベスティー！煙幕を！
  event_absolute2_06_s_79:
    speaker: vesti_t
    en: O-on it!
    ko: 으, 응!
    ja: う、うん！
  event_absolute2_06_s_80:
    speaker: "<Narration>"
    en: Vesti launches a missile in a straight line, the guidance system rendered
      useless by the jammer.
    ko: 재머 때문에 무용지물이 된 호밍 기능을 끈 미사일을 직사로 발사하는 베스티.
    ja: |-
      ベスティーは役に立たないと分かっている
      誘導を無効化し、ミサイルを直接狙って放った
  event_absolute2_06_s_81:
    speaker: "<Narration>"
    en: The missile strikes the ground, exploding into thick billows of smoke.
    ko: 바닥에 닿은 미사일은 폭발과 짙은 연기를 만들어냈다.
    ja: |-
      ミサイルはやはり落下し、
      爆発とともに黒い煙が巻き起こった
  event_absolute2_06_s_82:
    speaker: vesti_t
    en: Darn... I thought I'd at least take down one of them!
    ko: 이익…! 한 놈 정도는 잡을 줄 알았는데…!
    ja: |-
      うぅっ…！
      1匹ぐらいは倒せると思ったのに…！
  event_absolute2_06_s_83:
    speaker: emma_t
    en: Don't beat yourself up. The point was to create a smokescreen.
    ko: 연기를 만드는 게 목적이니까 너무 신경 쓰지 마~
    ja: 煙の方が目的だったし、気にしちゃダメよ～
  event_absolute2_06_s_84:
    speaker: eunhwa_t
    en: Emma. Can you track their movements through the smoke?
    ko: 엠마! 연기의 흐름을 보고 놈들의 움직임을 파악할 수 있겠어?
    ja: |-
      エマ！
      煙の動きで奴らの動きが分かるか？
  event_absolute2_06_s_85:
    speaker: emma_t
    en: Hmm...?
    ko: 흐응~?
    ja: あら、疑問形～？
  event_absolute2_06_s_86:
    speaker: eunhwa_t
    en: No, I mean... Track their movements!
    ko: "…아니, 파악해라!"
    ja: "…いや、奴らの動きを読め！"
  event_absolute2_06_s_87:
    speaker: emma_t
    en: Roger that!
    ko: 라~져~
    ja: ふふ、了解～
  event_absolute2_06_s_88:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 쿠웅-!
    ja: ドスン！
  event_absolute2_06_s_89:
    speaker: "<Narration>"
    en: Emma lowers the machine gun she is holding,
    ko: 엠마가 들고 있던 머신건을 내려놓는다.
    ja: エマは持っていたマシンガンを地面に置いた
  event_absolute2_06_s_90:
    speaker: "<Narration>"
    en: Then, she pulls a pistol from her coat.
    ko: 그리고 품에서 권총을 꺼내 들었다.
    ja: 代わりに拳銃を胸元から取り出した
  event_absolute2_06_s_91:
    speaker: emma_t
    en: I won't be able to land a perfect shot. You know that, right?
    ko: 정확히는 못 맞춰. 알지?
    ja: 正確な位置は分からないわ。一応ね？
  event_absolute2_06_s_92:
    speaker: eunhwa_t
    en: All I need is the direction. That'll be enough.
    ko: 방향만 알려줘도 충분해.
    ja: ああ、それでいい。
  event_absolute2_06_s_93:
    speaker: "<Narration>"
    en: Emma carefully tracks the subtle flow of the air currents in the smoke created
      by Vesti's missiles.
    ko: |-
      베스티가 만들어낸 연기에서 흐름 중,
      부자연스러운 흐름을 엠마가 눈을 쫓는다.
    ja: |-
      エマはベスティーが作った煙幕を
      目で追い、不自然な揺らぎを捉えた
  event_absolute2_06_s_94:
    speaker: "<Narration>"
    en: She fires a single shot from her pistol at a specific spot.
    ko: 그곳에 권총으로 한 발.
    ja: 狙いを定め、射撃すると…
  event_absolute2_06_s_95:
    speaker: "<Narration>"
    en: Eunhwa fires immediately after.
    ko: 은화가 이어서 사격.
    ja: ウンファの狙撃がすかさず続いた
  event_absolute2_06_s_96:
    speaker: "<Narration>"
    en: A Predator collapses as its optical camouflage dissipates.
    ko: 프레데터가 쓰러지며 광학미채가 풀린다.
    ja: プレデターが倒れ、光学迷彩が解かれた
  event_absolute2_06_s_97:
    speaker: emma_t
    en: Wow, that actually works?
    ko: 와~ 이게 되네?
    ja: ふふ、上手くいったわね～？
  event_absolute2_06_s_98:
    speaker: eunhwa_t
    en: Let's keep going. Vesti, keep firing. I don't want that smoke to disappear.
    ko: 계속 가자. 베스티. 연기가 끊어지지 않도록 계속 쏴 갈겨.
    ja: |-
      このまま続けるぞ。
      ベスティーは煙幕を維持しろ。
  event_absolute2_06_s_99:
    speaker: vesti_t
    en: Okay!
    ko: 응!
    ja: うん！
  event_absolute2_06_s_100:
    speaker: "<Narration>"
    en: The missile explosions, pistol shots, rifle blasts, and the heavy thud of
      collapsing metal echo again and again.
    ko: |-
      미사일의 폭음. 권총의 발포음. 라이플의 발포음.
      무거운 쇳덩이가 쓰러지는 소리가 반복된다.
    ja: |-
      ミサイルの爆発音、拳銃とライフルの射撃音、
      そして重い金属が地に落ちる音が繰り返された
  event_absolute2_06_s_101:
    speaker: "<Narration>"
    en: Suddenly, amongst the hellish cacophony, a new sound pierces through.
    ko: |-
      그리고 그러기를 잠시,
      지금까지 들리지 않았던 소리가 들려왔다.
    ja: |-
      しばらくして、
      戦場にそれまでとは異質の音が響いた
  event_absolute2_06_s_102:
    speaker: "<Narration>"
    en: "*Kreeeeeeeee*"
    ko: 기이이잉--!!
    ja: ウィィーン！！
  event_absolute2_06_s_103:
    speaker: emma_t
    en: It sounds like an exhaust...
    ko: "…배기음!"
    ja: "…排気音！？"
  event_absolute2_06_s_104:
    speaker: eunhwa_t
    en: Give me the location!
    ko: 위치!
    ja: エマ！
  event_absolute2_06_s_105:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕-!
    ja: バンッ！
  event_absolute2_06_s_106:
    speaker: "<Narration>"
    en: Emma fires somewhere in the smoke.
    ko: 엠마가 연기가 자욱한 어딘가를 향해 권총을 쏜다.
    ja: |-
      立ち込める煙の中の一点へ、
      エマが弾丸を撃ち込んだ
  event_absolute2_06_s_107:
    speaker: "<Narration>"
    en: Eunhwa quickly aims, and is about to pull the trigger when...
    ko: 은화가 빠르게 조준하고, 방아쇠를 당기려는 순간.
    ja: |-
      すかさずウンファが照準を定め、
      引き金に手をかけた瞬間
  event_absolute2_06_s_108:
    speaker: "<Narration>"
    en: "*Whooooosh*"
    ko: 부우우우웅--!!
    ja: ビュゥゥゥゥ…！！
  event_absolute2_06_s_109:
    speaker: "<Narration>"
    en: A strong gust of wind starts to disperse all the smoke.
    ko: 강한 바람이 일어나며 연기를 모두 흩어놓기 시작한다.
    ja: 突然吹き荒れた強風が、煙を散らしはじめた
  event_absolute2_06_s_110:
    speaker: "<Narration>"
    en: Frustrated, Eunhwa pulls the trigger.
    ko: 은화는 낭패감을 느끼면서 방아쇠를 당긴다.
    ja: ウンファは一瞬の思考の後、引き金を引いた
  event_absolute2_06_s_111:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 탕-!
    ja: バンッ！
  event_absolute2_06_s_112:
    speaker: "<Narration>"
    en: The Predator's head jerks up as her shot lands, its optical camouflage deactivating.
    ko: 탄환에 맞은 프레데터의 머리가 들리며 광학미채가 풀린다.
    ja: |-
      狙撃が命中したプレデターはひるみ、
      頭が一瞬浮かび上がった
  event_absolute2_06_s_113:
    speaker: "<Narration>"
    en: But soon after, it reactivates, and the Predator once again disappears.
    ko: 하지만 곧, 광학 미채를 키고 환경 속에 숨어들었다.
    ja: しかし、その姿がまたすぐにかき消えた
  event_absolute2_06_s_114:
    speaker: vesti_t
    en: It's the alpha!
    ko: 상위 개체야!
    ja: 上位個体だ！
  event_absolute2_06_s_115:
    speaker: emma_t
    en: As expected, it's the leader who does the heavy lifting.
    ko: 역시 큰일은 리더가 하는 법이네.
    ja: ふふ、やっぱり最後はリーダーが決めるのよね。
  event_absolute2_06_s_116:
    speaker: eunhwa_t
    en: "... Tch. Of all times, a dud."
    ko: "…칫. 하필 불발인가."
    ja: "…チッ。こんな時に不発か。"
  event_absolute2_06_s_117:
    speaker: eunhwa_t
    en: The smoke is all gone! Vesti! Keep firing!
    ko: 연기가 모두 걷혔다! 베스티! 계속 쏴!
    ja: |-
      煙幕が消えかけだ！
      ベスティー！張り直せ！
  event_absolute2_06_s_118:
    speaker: vesti_t
    en: Okay!
    ko: 알겠어!
    ja: 分かった！
  event_absolute2_06_s_119:
    speaker: "<Narration>"
    en: Vesti launches another missile.
    ko: 베스티의 미사일이 발사된다.
    ja: ベスティーは再びミサイルを発射した
  event_absolute2_06_s_120:
    speaker: "<Narration>"
    en: Instead of hitting the ground, it explodes in mid-air.
    ko: |-
      바닥에 떨어져 폭발을 일으켜야 했을 미사일은,
      공중에서 폭발을 일으켰다.
    ja: |-
      地面に落下するはずのミサイルが、
      空中で突然爆発した
  event_absolute2_06_s_121:
    speaker: "<Narration>"
    en: As the explosion goes off, a Predator is seen plummeting from the air.
    ko: 그리고 폭발과 동시에 공중에서 추락하는 프레데터의 모습이 보였다.
    ja: |-
      爆炎に紛れ、空中から
      1機のプレデターが墜落した
  event_absolute2_06_s_122:
    speaker: vesti_t
    en: Huh?
    ko: "…어?"
    ja: "…えっ？"
  event_absolute2_06_s_123:
    speaker: eunhwa_t
    en: Did it intercept the missile with its own body?!
    ko: 몸을 던져 요격했다고…!?
    ja: 体で止めたのか…！？
  event_absolute2_06_s_124:
    speaker: emma_t
    en: Eunhwa! The footprints!
    ko: 은화! 발자국이!
    ja: ウンファ！足跡が来てる！
  event_absolute2_06_s_125:
    speaker: "<Narration>"
    en: The footsteps rapidly mark the snow as they approach the vantage point occupied
      by Absolute.
    ko: |-
      앱솔루트가 점령한 고지를 향해,
      눈바닥에 발자국이 빠르게 찍히며 다가온다.
    ja: |-
      アブソルートが陣取る高台に向かい、
      すさまじい速度で足跡が近づいてくる
  event_absolute2_06_s_126:
    speaker: "<Narration>"
    en: Eunhwa fires her rifle, and the Predator's head explodes, its body sliding
      to the ground.
    ko: 은화가 방아쇠를 당기고, 머리가 박살 난 프레데터가 미끄러지듯이 쓰러진다.
    ja: |-
      ウンファが迎え撃ち、
      頭部の砕けたプレデターが滑り落ちていった
  event_absolute2_06_s_127:
    speaker: "<Narration>"
    en: At that moment, Emma spots something shimmering in the air, approaching from
      above.
    ko: 그 순간, 엠마는 공중에서 자신을 향해 다가오는 일렁이는 공기를 봤다.
    ja: |-
      その瞬間、エマは頭上間近で
      空気の揺らぎを感じた
  event_absolute2_06_s_128:
    speaker: emma_t
    en: Huh...?
    ko: 어머…?
    ja: え…？
  event_absolute2_06_s_129:
    speaker: vesti_t
    en: Hyyyyaaah!
    ko: 이이이이잇--!!
    ja: うああああぁぁー！！
  event_absolute2_06_s_130:
    speaker: "<Narration>"
    en: Vesti rushes in and puts herself between Emma and the Predator.
    ko: 베스티가 달려들어 엠마의 앞을 막아선다.
    ja: ベスティーが飛び出した
  event_absolute2_06_s_131:
    speaker: "<Narration>"
    en: The colossal weight of the creature slams into Vesti's shield.
    ko: 실드에 묵직한 무게감이 느껴진다.
    ja: シールドに重い衝撃が襲いかかった
  event_absolute2_06_s_132:
    speaker: "<Narration>"
    en: Not wasting another moment, she deploys her shield and unleashes a barrage
      of missiles.
    ko: 망설일 틈 없이, 실드를 전개해 다연장 미사일을 쏟아붓는다.
    ja: |-
      ベスティーはすかさずシールドを展開し、
      一斉にミサイルを放った
  event_absolute2_06_s_133:
    speaker: "<Narration>"
    en: The Predator is torn apart in a massive blast, and its parts scatter everywhere.
    ko: 폭음과 함께 프레데터의 산산조각 난 파츠가 드러나며 흩어진다.
    ja: |-
      爆発音とともに、粉砕された
      プレデターの断片が宙を舞った
  event_absolute2_06_s_134:
    speaker: vesti_t
    en: "*Huff... Huff...* Are you okay?"
    ko: 하아…! 하아…! 괜찮아?
    ja: はぁ…！はぁ…！大丈夫！？
  event_absolute2_06_s_135:
    speaker: emma_t
    en: I'm fine. Thanks Vesti. That was a close one.
    ko: 괜찮아. 고마워 베스티. 죽을 뻔했어.
    ja: |-
      無事よ。ありがとう、ベスティー。
      今のは危なかったわ。
  event_absolute2_06_s_136:
    speaker: eunhwa_t
    en: I could have sworn there was only one set of footprints.
    ko: 발자국은 분명 하나였는데.
    ja: 足跡は確かに1匹だったはずだ。
  event_absolute2_06_s_137:
    speaker: emma_t
    en: They rode on top of other Predators...
    ko: "…타고 온 거야."
    ja: "…乗せてきたみたいね。"
  event_absolute2_06_s_138:
    speaker: vesti_t
    en: Like the T-Town Musicians of Bremen?
    ko: 그, 브, 브레맨 음악대처럼?
    ja: ブ、ブレーメンの音楽隊…？
  event_absolute2_06_s_139:
    speaker: emma_t
    en: Actually, that's a perfect comparison. Yeah.
    ko: 음. 비유가 너무 찰떡같은걸. 맞아.
    ja: あら、ちょうどいい例えね～
  event_absolute2_06_s_140:
    speaker: eunhwa_t
    en: Did they catch onto the fact we were tracking the optical camouflage using
      their footprints?
    ko: "…발자국으로 광학미채를 쫓는 걸 알아차렸다는 건가."
    ja: "…足跡を見ていると勘づかれたか。"
  event_absolute2_06_s_141:
    speaker: "<Narration>"
    en: Eunhwa looks down.
    ko: 은화는 아래를 내려다본다.
    ja: ウンファが高台から見下ろした
  event_absolute2_06_s_142:
    speaker: "<Narration>"
    en: The alpha Predator, now fully visible, is staring at the members of Absolute.
    ko: "…상위 개체 프레데터는 광학미채를 푼 채 앱솔루트를 바라보고 있었다."
    ja: |-
      プレデターの上位個体が光学迷彩を解き、
      アブソルートを見すえている
  event_absolute2_06_s_143:
    speaker: eunhwa_t
    en: Bunch of filthy...
    ko: "…저 자식들이…."
    ja: "…バカにしやがって…"
  event_absolute2_06_s_144:
    speaker: "<Narration>"
    en: Eunhwa pulls the trigger.
    ko: 은화가 방아쇠를 당긴다.
    ja: ウンファが引き金を引いた
  event_absolute2_06_s_145:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 타앙-!
    ja: バン――！
  event_absolute2_06_s_146:
    speaker: eunhwa_t
    en: What the...?
    ko: "…뭐?"
    ja: "…なに？"
  event_absolute2_06_s_147:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 타앙-!
    ja: バンッ！
  event_absolute2_06_s_148:
    speaker: "<Narration>"
    en: "*Bang*"
    ko: 타앙-!
    ja: バンッ！
  event_absolute2_06_s_149:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_s_150:
    speaker: vesti_t
    en: Did it dodge the bullet?
    ko: 피, 피한 거야 저거?
    ja: よ、よけてる…？
  event_absolute2_06_s_151:
    speaker: emma_t
    en: Looks like it...
    ko: "…그래 보이네."
    ja: "…そうみたいね。"
  event_absolute2_06_s_152:
    speaker: eunhwa_t
    en: Is it reacting in time to the muzzle flash?
    ko: "…총구에 반응하는 건가."
    ja: "…銃口の動きを見ているのか。"
  event_absolute2_06_s_153:
    speaker: eunhwa_t
    en: The rate of their evolution is mind-boggling.
    ko: 말도 안 되는 진화 속도야.
    ja: ふざけた適応力だな。
  event_absolute2_06_s_154:
    speaker: eunhwa_t
    en: "... Tch. So much for conversation being the foundation of evolution."
    ko: "…칫. 대화는 진화의 초석이라더니."
    ja: "…チッ。対話は進化のいしずえ、だったか。"
  event_absolute2_06_s_155:
    speaker: "<Narration>"
    en: The alpha Predator slowly begins to walk forward, never taking its eyes off
      any of the Absolute Squad members.
    ko: 상위 개체 프레데터가 앱솔루트에게서 눈을 떼지 않은 채 천천히 걷기 시작한다.
    ja: |-
      上位個体はアブソルートをにらんだまま
      堂々と歩を進めた
  event_absolute2_06_s_156:
    speaker: "<Narration>"
    en: Eunhwa pulls the trigger again, but the alpha Predator sidesteps and dodges
      the bullet.
    ko: |-
      은화는 다시 한번 방아쇠를 당겼지만,
      상위 개체 프레데터는 몸을 살짝 움직여 탄환을 피했다.
    ja: |-
      ウンファは再び引き金を引いたが、
      上位個体はわずかに身体を動かすだけで
      射撃をかわした
  event_absolute2_06_s_157:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_s_158:
    speaker: eunhwa_t
    en: Let's retreat.
    ko: 퇴각한다.
    ja: ここは退くぞ。
  event_absolute2_06_s_159:
    speaker: vesti_t
    en: Huh? R-really?
    ko: 어? 지, 진짜?
    ja: え？た、戦わないの？
  event_absolute2_06_s_160:
    speaker: emma_t
    en: "... Roger."
    ko: "…라져."
    ja: "…了解。"
  event_absolute2_06_s_161:
    speaker: eunhwa_t
    en: Time to get out of here.
    ko: 가자.
    ja: 行くぞ。
event_absolute2_06_e:
  event_absolute2_06_e_1:
    speaker: eunhwa_t
    en: This isn't good. They had a countermeasure for everything we threw at them.
    ko: |-
      …좋지 않아.
      우리가 가진 수가 모두 파훼 당했어.
    ja: |-
      …打つ手がない。
      こちらの作戦が全部潰された。
  event_absolute2_06_e_2:
    speaker: emma_t
    en: The smoke we used to track the optical camouflage got blown away by the wind.
    ko: 연기를 만들어 광학미채를 쫓으려는 건, 바람으로 연기를 걷어냈고.
    ja: |-
      最初の煙幕で光学迷彩を見破る方法は、
      風で飛ばされちゃったわね。
  event_absolute2_06_e_3:
    speaker: vesti_t
    en: And they intercepted the missiles I fired with their own bodies, even before
      they struck the ground.
    ko: 여, 연기를 만들려고 쏜 미사일은 땅에 닿기도 전에 몸을 던져 막았어.
    ja: |-
      煙幕を張り直すために撃ったミサイルも、
      体当たりで止められちゃったし…
  event_absolute2_06_e_4:
    speaker: eunhwa_t
    en: They even stacked themselves vertically, so tracking their footprints was
      misleading.
    ko: |-
      발자국으로 위치를 파악하려는 수단도,
      놈들이 Z축을 활용하는 바람에 무용지물이다.
    ja: |-
      足跡で位置を把握していることも覚えられた。
      もう頼りにできん。
  event_absolute2_06_e_5:
    speaker: eunhwa_t
    en: Worst of all, they're paying attention to our muzzle flashes to dodge our
      bullets.
    ko: "…가장 성가신 건 총구에 반응해 사격을 피한다는 거야."
    ja: "…何より、銃口を見て狙撃をかわされる。"
  event_absolute2_06_e_6:
    speaker: eunhwa_t
    en: I didn't even know that was possible...
    ko: 그런 게 가능할 줄은….
    ja: こんなことが実際に可能だとはな…
  event_absolute2_06_e_7:
    speaker: vesti_t
    en: So what should we do? At this point, w-we've got no way to attack or defend
      ourselves.
    ko: |-
      어… 그럼 우리 어떡해?
      사, 사실상 공격 수단이랑 방어 수단이 다 봉쇄당한 건데….
    ja: |-
      じゃ、じゃあどうするの？
      このままだと攻めも守りも無理だけど…
  event_absolute2_06_e_8:
    speaker: emma_t
    en: Retreating and calling for reinforcements is probably the safest option.
    ko: 퇴각하고 지원군을 부르는 게 현실적일 거야.
    ja: |-
      一度撤退して、
      救援部隊を待つのが現実的だと思うわ。
  event_absolute2_06_e_9:
    speaker: eunhwa_t
    en: You're right.
    ko: 맞아.
    ja: そうだな。
  event_absolute2_06_e_10:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_11:
    speaker: eunhwa_t
    en: But that's not what we're going to do.
    ko: 하지만 이번엔 그렇게 하지 않을 거야.
    ja: だが、それはしない。
  event_absolute2_06_e_12:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_06_e_13:
    speaker: eunhwa_t
    en: We're taking them down ourselves.
    ko: 저건, [우리가] 잡는다.
    ja: あれは、「私たち」で倒す。
  event_absolute2_06_e_14:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_15:
    speaker: vesti_t
    en: Hehe. Th-that's not exactly good tactics.
    ko: 헤헤. 지, 진짜 비전술적이다.
    ja: へへ。ぜ、全然戦術的じゃないね。
  event_absolute2_06_e_16:
    speaker: eunhwa_t
    en: Hmph.
    ko: 흥.
    ja: ふん。
  event_absolute2_06_e_17:
    speaker: emma_t
    en: You landed a headshot on the alpha earlier, didn't you?
    ko: 좀 전에 상위 개체의 머리에 한 발 명중했었지?
    ja: 上位個体に一発は当ててたわよね？
  event_absolute2_06_e_18:
    speaker: eunhwa_t
    en: Yeah, but it was a dud.
    ko: 그래. 불발이었지만.
    ja: ああ。炸裂しなかった。
  event_absolute2_06_e_19:
    speaker: eunhwa_t
    en: It was supposed to be an explosive round. It was effective against Behemoth
      before, but it didn't do a damn thing this time around.
    ko: 내부 폭발탄이었어. 베히모스 전에서 유효해서 가져왔더니 정작 중요할 땐 도움이 안 되는군.
    ja: |-
      ベヒモス戦でも使った炸裂弾だ。
      実績を買ったが、肝心な時に不発とはな。
  event_absolute2_06_e_20:
    speaker: emma_t
    en: What do you mean a dud?
    ko: 불발?
    ja: 不発？
  event_absolute2_06_e_21:
    speaker: eunhwa_t
    en: The bullet is meant to explode once it's lodged in the target's body, so it
      has high stopping power. But it only detonates if enough pressure is applied.
    ko: |-
      그래. 박힌 채로 터지는 게 중요한 탄환이라 저지력이 높아.
      일정 이상의 압력이 탄두에 가해지지 않으면 폭발하지 않고.
    ja: |-
      装甲の裏側で炸裂する設計だ。
      逆に、相応の衝撃が加わらないと起爆しない。
  event_absolute2_06_e_22:
    speaker: eunhwa_t
    en: The impact angle was off.
    ko: 명중 각도가 안 좋았어.
    ja: 着弾角度が良くなかったんだろう。
  event_absolute2_06_e_23:
    speaker: emma_t
    en: Is there any way we can make it explode?
    ko: 폭발을 일으킬 방법은?
    ja: あとから爆発させられないの？
  event_absolute2_06_e_24:
    speaker: eunhwa_t
    en: There is a way to set it off manually—a striker on the back of the round.
      If we hit it, it should detonate.
    ko: |-
      강제로 폭발시키는 방법이 있긴 해.
      탄두 후면에 공이가 있어. 거기에 충격을 주면 터진다.
    ja: |-
      …理論上は方法がないわけじゃない。
      弾頭の背面に衝撃を加えればいい。
  event_absolute2_06_e_25:
    speaker: emma_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_26:
    speaker: vesti_t
    en: Whoa. S-so you've got to land a shot on the exact same spot again? Are you
      even able to pull that off, Eunhwa?
    ko: |-
      우와. 그, 그럼 쐈던 곳에 한 발 더 맞추면 되는 거야?
      은화 그런 것도 할 수 있어?
    ja: |-
      じゃあ…さっき撃った場所に
      もう一発当てればいいってこと？
      ウンファ、そんなこともできるの？
  event_absolute2_06_e_27:
    speaker: eunhwa_t
    en: What do you think? You saw it react to the muzzle flash and dodge all the
      other bullets I fired at it.
    ko: |-
      되겠냐 그게.
      애초에 저놈은 총구에 반응해서 피한다니까.
    ja: |-
      できると思うか？
      そもそも狙撃を回避してくる相手だろう。
  event_absolute2_06_e_28:
    speaker: vesti_t
    en: Th-then what should we do?
    ko: 그, 그럼 어떡할까?
    ja: じゃ、じゃあどうすればいいの？
  event_absolute2_06_e_29:
    speaker: vesti_t
    en: S-should I go up there, grab it, and pin its legs?
    ko: 내, 내가 가서 발이라도 붙잡고 늘어질까?
    ja: わ、私が脚でも押さえる？
  event_absolute2_06_e_30:
    speaker: emma_t
    en: Haha, if you could pull it off, I bet that'd be quite effective.
    ko: 후후. 되기만 하면 제법 유효하겠네.
    ja: ふふ。それができれば効果はあるかもね～
  event_absolute2_06_e_31:
    speaker: eunhwa_t
    en: Hold on... Grab it and pin it by its legs...
    ko: "…붙잡고, 늘어진다라…."
    ja: "…脚を押さえる…か…"
  event_absolute2_06_e_32:
    speaker: eunhwa_t
    en: That's a tactic it's not familiar with.
    ko: 아직, 저놈이 모르는 우리의 전술이 있어.
    ja: "…まだ奴に知られていない戦術はある。"
  event_absolute2_06_e_33:
    speaker: vesti_t
    en: Huh? Really?
    ko: 어? 진짜?
    ja: えっ？本当に？
  event_absolute2_06_e_34:
    speaker: eunhwa_t
    en: It's a primitive strategy, and one we're not very familiar with. There's no
      way to be sure it'll work.
    ko: 하지만 원시적이고 숙련도가 낮아. 잘 될지 확신할 수 없어.
    ja: |-
      ただし、原始的なうえに
      こちらも慣れていない。
      上手くいく保証はない。
  event_absolute2_06_e_35:
    speaker: eunhwa_t
    en: If we screw this up, it's curtains for us.
    ko: 실패하면 끝이다.
    ja: 失敗すれば、そこで終わりだ。
  event_absolute2_06_e_36:
    speaker: vesti_t
    en: Eunhwa, don't say such—
    ko: 은화. 그런 얘기는 하
    ja: ウ、ウンファ。そんなこと言わな…
  event_absolute2_06_e_37:
    speaker: eunhwa_t
    en: So I'm asking you both to put your lives on the line.
    ko: 그러니 목숨을 걸어줘.
    ja: だから、命をかけてくれ。
  event_absolute2_06_e_38:
    speaker: eunhwa_t
    en: We have to win, no matter what.
    ko: 반드시 이긴다.
    ja: そして私たちは、必ず勝つ。
  event_absolute2_06_e_39:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_40:
    speaker: emma_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_41:
    speaker: vesti_t
    en: Yup!
    ko: 응!
    ja: うん！
  event_absolute2_06_e_42:
    speaker: emma_t
    en: Hehe, of course.
    ko: 후후. 물론이야.
    ja: ふふ、もちろんよ～
  event_absolute2_06_e_43:
    speaker: "<Narration>"
    en: Giant bestial footprints are stamped in the snow.
    ko: 눈밭에 거대한 짐승의 발자국이 새겨졌다.
    ja: 静かな雪原に、巨大な獣の足跡だけが増えていく
  event_absolute2_06_e_44:
    speaker: "<Narration>"
    en: The alpha Predator, cloaked with the optical camouflage, follows Absolute's
      tracks.
    ko: 상위 개체 프레데터는 광학미채를 두른 채 앱솔루트의 발자국을 따라왔다.
    ja: |-
      上位個体のプレデターが光学迷彩で姿を隠し、
      退いたアブソルートを追っているのだ
  event_absolute2_06_e_45:
    speaker: "<Narration>"
    en: Uncertain what traps lay ahead, it proceeds with caution.
    ko: 어떤 함정이 있을지 모르기에 신중을 가해 움직인다.
    ja: 未知の罠を警戒し、足取りは慎重だった
  event_absolute2_06_e_46:
    speaker: "<Narration>"
    en: At a certain point, the footprints split into three diverging paths.
    ko: 발자국이 세 갈래로 갈라진다.
    ja: やがて、追っていた足跡が3方向に分かれた
  event_absolute2_06_e_47:
    speaker: "<Narration>"
    en: It traces the footprints on the left with its eye.
    ko: 왼쪽의 발자국을 따라 시선을 움직인다.
    ja: 左の足跡をたどり、視線を動かした
  event_absolute2_06_e_48:
    speaker: "<Narration>"
    en: Vesti can be seen hiding in the bushes.
    ko: 풀숲 안에 숨어있는 베스티의 모습이 보인다.
    ja: 草むらの中にベスティーが隠れている
  event_absolute2_06_e_49:
    speaker: "<Narration>"
    en: Its gaze then follows the footprints in the middle.
    ko: 중앙의 발자국을 따라 시선을 움직인다.
    ja: さらに、中央の足跡を目で追った
  event_absolute2_06_e_50:
    speaker: "<Narration>"
    en: Emma is seen crouching behind a rock.
    ko: 바위 뒤에 엄폐하고 있는 엠마의 모습이 보인다.
    ja: 岩影にエマが隠れている
  event_absolute2_06_e_51:
    speaker: "<Narration>"
    en: Finally, it shifts its gaze to trace the footprints on the right.
    ko: 오른쪽의 발자국을 따라 시선을 움직인다.
    ja: 最後に、右の足跡に沿って視線を動かした
  event_absolute2_06_e_52:
    speaker: "<Narration>"
    en: A single rock shimmers in an unusual way.
    ko: 바위 하나가 묘하게 일렁인다.
    ja: 岩がひとつ、奇妙に揺れている
  event_absolute2_06_e_53:
    speaker: "<Narration>"
    en: 'The alpha Predator analyzes the combat data it''s collected and draws a conclusion:'
    ko: 상위 개체 프레데터는 지금껏 입력된 전투 데이터를 기반으로 [계산].
    ja: |-
      上位個体は、これまでに得た
      交戦データから「演算」を始め
  event_absolute2_06_e_54:
    speaker: "<Narration>"
    en: Victory is certain.
    ko: 곧 승리라는 결론에 도달한다.
    ja: すぐさま、勝利は近いと判断した
  event_absolute2_06_e_55:
    speaker: "<Narration>"
    en: Two units have been placed as diversions, while one cloaked attacker intends
      to deal the finishing blow.
    ko: |-
      눈에 띄는 둘을 매복시켜 놔 그쪽으로 신경을 쓰게 하고,
      결정적 한 방을 노리는 한 명이 광학미채로 제대로 위장.
    ja: |-
      2ヶ所に注意を引きつけさせ、
      決定打を狙う1機だけが
      光学迷彩で偽装している
  event_absolute2_06_e_56:
    speaker: "<Narration>"
    en: It is a rudimentary tactic.
    ko: 낮은 수준의 전술이다.
    ja: きわめて単純な戦術だ
  event_absolute2_06_e_57:
    speaker: "<Narration>"
    en: The alpha Predator concludes there is nothing more to learn from Absolute.
    ko: 상위 개체 프레데터는 이제 앱솔루트에게서 [학습]할 것은 없다고 결론 내린다.
    ja: |-
      上位個体は、もはやアブソルートから
      学習するべきことはないという結論を下した
  event_absolute2_06_e_58:
    speaker: "<Narration>"
    en: It takes a step forward, moving slowly to hunt down its prey.
    ko: 그리고 사냥감들을 천천히 사냥하기 위해, 발걸음을 내디뎠다.
    ja: |-
      そして獲物を確実に仕留めるため、
      ゆっくりと踏み出した
  absolute:
    speaker: "<>"
    en:
    ko:
    ja:
  event_absolute2_06_e_59:
    speaker: alice
    en: My Queen! Everyone is over there!
    ko: 여왕님! 다들 저기 있어요!
    ja: 女王様～！みなさん、あっちにいます！
  event_absolute2_06_e_60:
    speaker: ludmilla
    en: Is everyone safe?!
    ko: 모두 무사한가!!
    ja: みんな大事はない！？
  event_absolute2_06_e_61:
    speaker: vesti_t
    en: Huh? That voice...!
    ko: 어? 이 목소리는…!
    ja: え？この声は…！
  event_absolute2_06_e_62:
    speaker: emma_t
    en: Hehe. It's Ludmilla, huh?
    ko: 후후, 루드밀라네?
    ja: ふふ、来たみたいね？
  event_absolute2_06_e_63:
    speaker: eunhwa_t
    en: "... Looks like they met up without any issues."
    ko: "…무사히 합류했나 보군."
    ja: "…合流できたか。"
  event_absolute2_06_e_64:
    speaker: "<Narration>"
    en: Eunhwa turns in the direction the voices are coming from.
    ko: 은화는 소리가 들려오는 방향을 바라보았다.
    ja: ウンファは声のした方に視線を送った
  event_absolute2_06_e_65:
    speaker: signal
    en: Eunhwa! Vesti!! Emma!!
    ko: 은화! 베스티!! 엠마-!!
    ja: ウンファ！ベスティー！！エマ！！
  event_absolute2_06_e_66:
    speaker: delta
    en: Is everyone okay?!
    ko: 다들 무사하십니까!!
    ja: みなさん、ご無事ですか…！？
  event_absolute2_06_e_67:
    speaker: "<Narration>"
    en: Emma waves her hand at the people running toward them.
    ko: 엠마가 멀리서 달려오는 이들을 향해 손을 흔들었다.
    ja: |-
      エマが遠くから駆け寄ってくる
      仲間たちに向けて手を振った
  event_absolute2_06_e_68:
    speaker: emma_t
    en: Yes, all good on our end!
    ko: 응~ 이쪽은 다 무사해~!
    ja: ええ、こっちは全員無事よ～！
  event_absolute2_06_e_69:
    speaker: eunhwa_t
    en: You're late.
    ko: 늦어.
    ja: 遅かったな。
  event_absolute2_06_e_70:
    speaker: ludmilla
    en: Sorry.
    ko: 미안하다.
    ja: 待たせてしまったわね。
  event_absolute2_06_e_71:
    speaker: ludmilla
    en: The blizzard was raging so intensely.
    ko: 눈보라가 심하게 치는 바람에,
    ja: ひどい吹雪だったのよ。
  event_absolute2_06_e_72:
    speaker: ludmilla
    en: It took some time to find the coordinates you sent.
    ko: 너희가 보내준 좌표를 찾는데, 시간이 좀 걸렸다.
    ja: ここまで来るのにずいぶん手間どったわ。
  event_absolute2_06_e_73:
    speaker: ludmilla
    en: So no injuries on your end?
    ko: 다친 곳은?
    ja: それで、負傷者は？
  event_absolute2_06_e_74:
    speaker: emma_t
    en: None. We're A-OK.
    ko: 없어~ 전원 무사해.
    ja: いないわ～、全員元気よ。
  event_absolute2_06_e_75:
    speaker: signal
    en: Thank goodness... I'm so glad everyone is safe!
    ko: 정말… 다들 무사해서 다행이에요!
    ja: 本当に…ご無事で何よりです…！
  event_absolute2_06_e_76:
    speaker: delta
    en: I'm really sorry. You came all this way to save us, but we ended up being
      of no help at all.
    ko: 저희를 구하러 와주신 건데, 하나도 도움이 못 돼 죄송합니다.
    ja: |-
      私たちを助けに来てくださったのに、
      何の役にも立てず申し訳ありません…
  event_absolute2_06_e_77:
    speaker: emma_t
    en: It's okay! You brought in the reinforcements and came back for us, didn't
      you?
    ko: 에이~ 이렇게 지원 부대를 데리고 다시 와줬잖아.
    ja: |-
      そんなことないわ～
      ちゃんと救援部隊を
      連れてきてくれたじゃない。
  event_absolute2_06_e_78:
    speaker: emma_t
    en: If more Raptures had shown up, things would've gotten hairy over here, even
      for us.
    ko: 이 이상 랩쳐가 더 꼬여버리면, 아무리 우리라고 해도 좀 힘들었을 거야~
    ja: |-
      これ以上敵が増えたら、いくら私たちでも
      危なかったもの～
  event_absolute2_06_e_79:
    speaker: vesti_t
    en: Y-yeah. To be h-honest, I'm not sure if we could have withstood another assault.
    ko: "마, 맞아. \n소, 솔직히… 한 번 더 싸우는 건 무리라고 생각했어…."
    ja: |-
      そ、そうそう！正直に言うと、
      これ以上戦うのは無理だって思ってたし…
  event_absolute2_06_e_80:
    speaker: delta
    en: "... You're all too kind."
    ko: "…그렇게 말씀해 주셔서 감사합니다."
    ja: "…そう言っていただけて光栄です。"
  event_absolute2_06_e_81:
    speaker: signal
    en: By the way, what's the latest with the P-Predator?
    ko: 아, 그러고 보니 프, 프레데터는요?
    ja: あ、そういえば…プレデターは？
  event_absolute2_06_e_82:
    speaker: eunhwa_t
    en: Look there.
    ko: 저기.
    ja: そこだ。
  event_absolute2_06_e_83:
    speaker: "<Narration>"
    en: Eunhwa gestures behind her.
    ko: 은화가 뒤를 가리켰다.
    ja: ウンファが後ろを指さした
  event_absolute2_06_e_84:
    speaker: "<Narration>"
    en: On the snowy ground lay the alpha Predator, its body broken and battered.
    ko: 설원 위, 온몸이 부서진 채 쓰러져 있는 상위 개체 프레데터의 모습이 보였다.
    ja: |-
      その先には、全身を破壊され
      雪原の上に倒れた上位個体の姿があった
  event_absolute2_06_e_85:
    speaker: alice
    en: Wow! Look at the size of that wolf, my Queen!
    ko: "와아~ 여왕님! \n엄~청 큰 늑대가 있어요!"
    ja: |-
      わあ～！女王様、
      すっごく大きなオオカミさんです！
  event_absolute2_06_e_86:
    speaker: ludmilla
    en: So that's the Predator, huh?
    ko: 저게… 프레데터라는 거로군.
    ja: あれが…例のプレデターね。
  event_absolute2_06_e_87:
    speaker: signal
    en: You... You actually did it! Incredible!
    ko: |-
      저, 정말 해내셨군요!
      진짜 대단하세요!
    ja: |-
      ほ、本当に倒したんですね…！
      すごい…！
  event_absolute2_06_e_88:
    speaker: vesti_t
    en: Hehe... they just said we were incredible...
    ko: 헤, 헤헤헤… 대, 대단하대….
    ja: えへ、えへへ…す、すごいだって…
  event_absolute2_06_e_89:
    speaker: eunhwa_t
    en: There are probably still some stragglers left, but since we destroyed their
      alpha's core, there probably won't be a successor.
    ko: |-
      잡어들이 일부 남아있을 거다.
      리더로 추정되는 놈의 코어까지 박살 냈으니 계승은 되지 않겠지만….
    ja: |-
      まだザコが残っているはずだ。
      リーダー格の奴はコアを破壊した。
      共食いはもうできないだろうが…
  event_absolute2_06_e_90:
    speaker: eunhwa_t
    en: They use optical camouflage and are highly skilled in close-quarters combat.
      But with their alpha out of the mix, they'll likely be disorganized.
    ko: |-
      광학미채와 높은 수준의 근접전을 구사하는 놈들이다.
      하지만 리더를 잃어 오합지졸인 상태일 거야.
    ja: |-
      光学迷彩と近接戦闘能力には注意しろ。
      まあ、リーダーもいない今となっては
      烏合の衆だ。
  event_absolute2_06_e_91:
    speaker: eunhwa_t
    en: We'll leave the cleanup to you.
    ko: 놈들을 처리하는 걸 부탁한다.
    ja: 後始末は頼む。
  event_absolute2_06_e_92:
    speaker: ludmilla
    en: Sure. Leave it to us.
    ko: 그래. 맡겨다오.
    ja: 分かったわ。私たちに任せて。
  event_absolute2_06_e_93:
    speaker: scarecommander
    en: You... You actually did it?
    ko: 저, 정말… 이겼다고?
    ja: ほ、本当に…勝ったのか？
  event_absolute2_06_e_94:
    speaker: scarecommander
    en: Just the three of you?
    ko: 이 인원으로…?
    ja: この人数で…？
  event_absolute2_06_e_95:
    speaker: alice
    en: Hehe, are we going off cave exploring now?
    ko: 헤헤, 그럼 우리 이제 동굴 탐험 하러 가는 건가요~?
    ja: |-
      えへへ。
      じゃあこの後は、洞窟探検ですね？
  event_absolute2_06_e_96:
    speaker: neve
    en: "*Yawn...* I'll have to be careful not to fall asleep while we're at it."
    ko: 흐암~ 조사하다가 잠들지 않게 조심해야겠네요.
    ja: |-
      ふわぁ～…
      途中で眠くならないようにしないとですね。
  event_absolute2_06_e_97:
    speaker: tove
    en: H-hold on!
    ko: 자, 잠시만요!
    ja: ちょ、ちょっと待ってください！
  event_absolute2_06_e_98:
    speaker: tove
    en: Y-you're not really going in there without taking any safety precautions,
      are you?
    ko: 저, 저기를 정말 아무런 안전장치 없이 들어가겠다고요?
    ja: |-
      な、何の安全対策もせずに
      向かうつもりですか…！？
  event_absolute2_06_e_99:
    speaker: emma_t
    en: All right, should we start heading back—
    ko: 자아~ 그럼 우리도 이만 돌아가 볼….
    ja: さてと～…私たちはそろそろ…
  event_absolute2_06_e_100:
    speaker: scarecommander
    en: Wait!
    ko: 저, 저기…!
    ja: ちょ、ちょっと待ってくれ…！
  event_absolute2_06_e_101:
    speaker: eunhwa_t
    en: What now?
    ko: 뭐야, 넌 또 왜.
    ja: 今度は何だ？
  event_absolute2_06_e_102:
    speaker: scarecommander
    en: How... How did you do it?
    ko: 어떻게… 이긴 거야?
    ja: ど、どうやって…勝ったんだ？
  event_absolute2_06_e_103:
    speaker: scarecommander
    en: How did you triumph against seemingly impossible odds?
    ko: 그 말도 안 되는 상황에서, 어떻게 이겨낼 수 있었던 거지?
    ja: |-
      あんな不利な状況から、
      どうやってひっくり返したって言うんだ？
  event_absolute2_06_e_104:
    speaker: scarecommander
    en: What kind of perfect tactics did it take to...!
    ko: 도대체 어떤 완벽한 전술을 써야…!
    ja: そんな完璧な戦術があるなんて…！
  event_absolute2_06_e_105:
    speaker: eunhwa_t
    en: What are you saying?
    ko: 뭐라는 거야?
    ja: ふん。
  event_absolute2_06_e_106:
    speaker: eunhwa_t
    en: Perfect tactics?
    ko: 완벽한 전술?
    ja: 完璧な戦術？
  event_absolute2_06_e_107:
    speaker: eunhwa_t
    en: There's no such thing.
    ko: 그딴 게 어딨어.
    ja: そんなものはない。
  event_absolute2_06_e_108:
    speaker: eunhwa_t
    en: Until you win, or until you attain what you want to achieve...
    ko: |-
      이길 때까지,
      원하는 걸 이룰 때까지,
    ja: |-
      勝って、
      目的を果たすまで…
  event_absolute2_06_e_109:
    speaker: eunhwa_t
    en: You just have to keep fighting with everything you've got, using every idea
      you can think of.
    ko: 생각할 수 있는 모든 것을 다해, 전력을 다해 부딪히는 것뿐이야.
    ja: |-
      考えられることを全てやり、
      死力を尽くして戦っただけだ。
  event_absolute2_06_e_110:
    speaker: scarecommander
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_absolute2_06_e_111:
    speaker: eunhwa_t
    en: So if you don't have it in you, don't even think about carrying out missions
      on the surface.
    ko: 그러니 그럴 각오가 없다면, 지상 임무에 나올 생각을 마라.
    ja: |-
      その覚悟ができないなら、
      地上には出ないことだな…
  event_absolute2_06_e_112:
    speaker: eunhwa_t
    en: Weakling.
    ko: 삼류.
    ja: 三流。
  event_absolute2_06_e_113:
    speaker: scarecommander
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_114:
    speaker: soldiereg
    en: Until you attain what you want to achieve...
    ko: 원하는 걸 이룰 때까지….
    ja: 目的を果たすまで…
  event_absolute2_06_e_115:
    speaker: soldiereg
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_06_e_116:
    speaker: soldiereg
    en: Uh, h-hey!
    ko: 그, 저, 저기…!
    ja: あ、その、えっと…！
  event_absolute2_06_e_117:
    speaker: soldiereg
    en: Un-Unlimited!
    ko: 어, 언리미티드 스쿼드 분들…!
    ja: ア、アンリミテッドのみなさん…！
  event_absolute2_06_e_118:
    speaker: tove
    en: Yes?
    ko: 네?
    ja: はい？
  event_absolute2_06_e_119:
    speaker: ludmilla
    en: What is it?
    ko: 뭐지?
    ja: 何かしら？
  event_absolute2_06_e_120:
    speaker: soldiereg
    en: S-sorry to bother you, but... I-if it's at all possible...
    ko: |-
      저, 정말 죄송한데,
      호, 혹시… 지, 진짜 가, 가능하시다면…!
    ja: |-
      む、無理を言っているのは承知の上で…
      も、もし…できればで、いいのですが…！
  event_absolute2_06_e_121:
    speaker: soldiereg
    en: C-could you help look for my squadmates?
    ko: 제, 제 동료를 찾아주실 수 있으십니까?
    ja: わ、私の仲間を…捜していただけませんか…！？
  event_absolute2_06_e_122:
    speaker: ludmilla
    en: Your squadmates?
    ko: 동료?
    ja: 仲間？
  event_absolute2_06_e_123:
    speaker: soldiereg
    en: Er, well...
    ko: 그… 그게….
    ja: そ…その…
  event_absolute2_06_e_124:
    speaker: soldiereg
    en: I don't r-remember the exact coordinates.
    ko: 저, 정확한 좌표는 생각나지 않는데.
    ja: せ、正確な場所は思い出せないのですが…
  event_absolute2_06_e_125:
    speaker: soldiereg
    en: But she t-told us to run while...
    ko: 저, 저희를 도, 도망가게 하고….
    ja: わ、私たちを先に逃がして…
  event_absolute2_06_e_126:
    speaker: soldiereg
    en: S-she stayed behind to fight the Predator alone.
    ko: 호, 혼자서 프레데터를 상대하고 있었습니다.
    ja: |-
      ひとりでプレデターと戦った
      仲間がいるんです。
  event_absolute2_06_e_127:
    speaker: soldiereg
    en: S-so...
    ko: 그, 그래서….
    ja: な、なので…どうか…
  event_absolute2_06_e_128:
    speaker: alice
    en: No way! Is she a brown-haired princess by any chance?
    ko: "어? 설마~ \n갈색 머리 공주님이신가요?"
    ja: |-
      …あっ！もしかして、
      茶色の髪のお姫様のことですか？
  event_absolute2_06_e_129:
    speaker: soldiereg
    en: P-princess?
    ko: 고, 공주님…?
    ja: お、お姫様…？
  event_absolute2_06_e_130:
    speaker: tove
    en: She's a Nikke, right? A Soldier FA model?
    ko: 솔져 F.A. 타입의 니케 분 맞죠?
    ja: |-
      それってソルジャーF.A.モデルの
      ニケのことじゃないですか？
  event_absolute2_06_e_131:
    speaker: tove
    en: Was she holding a teddy bear keychain?
    ko: 혹시 곰돌이 모양의 키링을 갖고 계셨던 분 맞나요?
    ja: クマのキーホルダーを着けていたような…？
  event_absolute2_06_e_132:
    speaker: soldiereg
    en: Th-that's right!
    ko: 마, 맞습니다!
    ja: そ、そうです！
  event_absolute2_06_e_133:
    speaker: soldiereg
    en: She owns a t-teddy bear keychain!
    ko: 고, 곰돌이 키링…!
    ja: ク、クマのキーホルダーの…！
  event_absolute2_06_e_134:
    speaker: "<Narration>"
    en: Tove lifts up a brain shelter.
    ko: 토브가 브레인 셸터를 들어 올렸다.
    ja: トーブがブレインシェルターを持ち上げた
  event_absolute2_06_e_135:
    speaker: tove
    en: Don't you worry. She's safe and sound.
    ko: 무사히 구출했으니, 걱정하지 마세요~
    ja: 無事に救出済みですので、ご心配なく！
  event_absolute2_06_e_136:
    speaker: soldiereg
    en: Ahhh! Oh my g...
    ko: 아, 아아아…!!
    ja: あ、あああ…！！
  event_absolute2_06_e_137:
    speaker: "<Narration>"
    en: Eagle hugs the brain shelter.
    ko: 이글이 브레인 셸터를 감싸안았다.
    ja: イーグルがブレインシェルターを抱きかかえた
  event_absolute2_06_e_138:
    speaker: soldiereg
    en: "*Sob...* Falcon!"
    ko: 흑… 팔콘…!
    ja: うぅ…ファルコン…！
  event_absolute2_06_e_139:
    speaker: scarecommander
    en: F-Falcon... she's alive... she's alive!
    ko: |-
      파, 팔콘… 살아… 있었구나.
      살아… 있었어…!
    ja: |-
      ファ、ファルコン…生きてたのか…
      本当に…生きて…！
  event_absolute2_06_e_140:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩-
    ja: ドサッ
  event_absolute2_06_e_141:
    speaker: "<Narration>"
    en: Eagle's commander drops to his knees before the brain shelter.
    ko: 이글의 지휘관이 브레인 쉘터 앞에 무릎을 꿇었다.
    ja: |-
      イーグルたちの指揮官が
      ブレインシェルターの前でひざをついた
  event_absolute2_06_e_142:
    speaker: soldiereg
    en: C-Commander?
    ko: 지, 지휘관…?
    ja: し、指揮官…？
  event_absolute2_06_e_143:
    speaker: scarecommander
    en: Thank goodness... I'm so relieved...!
    ko: 다행이다… 정말… 다행이다…!
    ja: よかった…本当に…よかった…！
  event_absolute2_06_e_144:
    speaker: soldiereg
    en: "*Sob...* Commander..."
    ko: 흑…! 지휘관…!
    ja: "…！指揮官…！"
  event_absolute2_06_e_145:
    speaker: emma_t
    en: Haha, looks like everyone there made it out okay too.
    ko: 후후, 다행히 이쪽도 잘 구해낸 것 같네.
    ja: ふふ、あっちも無事だったみたいね～
  event_absolute2_06_e_146:
    speaker: vesti_t
    en: Yeah... what a relief.
    ko: 그, 그러게… 저, 정말 다행이야.
    ja: そ、そうだね…ほ、本当によかった。
  event_absolute2_06_e_147:
    speaker: eunhwa_t
    en: One less thing to worry about.
    ko: "…신경 쓰이던 게 하나 줄었군."
    ja: "…気がかりが1つ消えたな。"
  event_absolute2_06_e_148:
    speaker: emma_t
    en: That's right, I could tell it was weighing on you, Eunhwa.
    ko: |-
      그러게~
      은화 내내 신경 쓰여 했잖아.
    ja: |-
      よかったわね～
      ず～っと気にしてたものね？
  event_absolute2_06_e_149:
    speaker: emma_t
    en: Especially considering what happened to their friend after we'd rescued them.
    ko: 우리가 구했던 애들이 그렇게 돼서.
    ja: 救出した子たちがどうなったか。
  event_absolute2_06_e_150:
    speaker: emma_t
    en: That must be why you cared so much about Eagle and the commander, yes?
    ko: 그래서 이글이랑 저 지휘관을 더 신경 써줬던 거 아니야?
    ja: |-
      だからずっと、あの2人のことを
      気にかけてたんでしょ？
  event_absolute2_06_e_151:
    speaker: eunhwa_t
    en: "... I did no such thing."
    ko: "…그런 적 없어."
    ja: "…そんな覚えはない。"
  event_absolute2_06_e_152:
    speaker: emma_t
    en: Haha, sure! If you say so.
    ko: "후후, 그래~ \n은화가 그러면 그런 거겠지."
    ja: |-
      ふふ、そう～？
      ウンファがそう言うなら、
      そういうことにしておくわ。
  event_absolute2_06_e_153:
    speaker: eunhwa_t
    en: "... At any rate, it seems like everything's finally over this time."
    ko: "…됐고, 이제 정말 다 끝난 것 같으니."
    ja: "…とにかく、これで全部終わったな。"
  event_absolute2_06_e_154:
    speaker: eunhwa_t
    en: Let's head back to the Ark.
    ko: 방주로 복귀하자.
    ja: アークに戻るぞ。
  event_absolute2_06_e_155:
    speaker: eunhwa_t
    en: Mission complete.
    ko: 임무 종료다.
    ja: 任務完了だ。
  event_absolute2_06_e_156:
    speaker: vesti_t
    en: Yeah!
    ko: 응!
    ja: うん！
  event_absolute2_06_e_157:
    speaker: "<Narration>"
    en: 'ABSOLUTE: END'
    ko: 'ABSOLUTE : END'
    ja: 'ABSOLUTE : END'
event_absolute2_epilogue:
  event_absolute2_epilogue_1:
    speaker: ingrid
    en: Eunhwa.
    ko: 은화.
    ja: ウンファ。
  event_absolute2_epilogue_2:
    speaker: ingrid
    en: Great work on the mission.
    ko: 이번 임무도 수고 많았다.
    ja: 今回の任務もご苦労だった。
  event_absolute2_epilogue_3:
    speaker: ingrid
    en: After analyzing the combat data you submitted, and the investigation data
      from the Unlimited Squad,
    ko: 제군이 보낸 교전 데이터와 언리미티드 스쿼드에서 보내온 조사 데이터를 분석해 본 결과,
    ja: |-
      お前たちの交戦データと
      アンリミテッドから受け取った
      調査データの分析が済んだ。
  event_absolute2_epilogue_4:
    speaker: ingrid
    en: we've confirmed that the Predator is a new type of Rapture which we have no
      previous records of.
    ko: 프레데터는 제군들의 추측대로 이전의 기록에서도 발견하지 못한 새로운 개체라는 것이 밝혀졌다.
    ja: |-
      結果はお前たちの推測通り、
      プレデターは過去に記録がない
      新型の個体だと判明した。
  event_absolute2_epilogue_5:
    speaker: ingrid
    en: Also, the bite mark left on Black Smith from before,
    ko: 또한, 지난번 블랙스미스에게 이빨 자국을 남긴 흔적 역시,
    ja: |-
      また、ブラックスミスに残っていた
      牙状の痕跡だが…
  event_absolute2_epilogue_6:
    speaker: ingrid
    en: it was their doing, as we suspected.
    ko: 추측대로 프레데터의 소행이라는 것이 밝혀졌다.
    ja: |-
      これも推測通り、
      プレデターによるものだと確認された。
  event_absolute2_epilogue_7:
    speaker: eunhwa_t
    en: I figured as much.
    ko: 역시 그랬나.
    ja: だろうな。
  event_absolute2_epilogue_8:
    speaker: ingrid
    en: However, upon your return from the snowfields,
    ko: 다만, 제군들이 설원에서 돌아온 이후에도,
    ja: |-
      しかし、お前たちが北部より
      帰還してから、現在に至るまで…
  event_absolute2_epilogue_9:
    speaker: ingrid
    en: there has been no sighting in that region or anywhere near the Ark,
    ko: 아직까지 설원 지역은 물론 방주 인근 어디에서도,
    ja: 北部エリアはもちろん、アーク周辺においても…
  event_absolute2_epilogue_10:
    speaker: ingrid
    en: of anything which feeds on cores and grows,
    ko: 이처럼 코어를 포식하여 성장하거나,
    ja: コアを捕食して成長する能力や…
  event_absolute2_epilogue_11:
    speaker: ingrid
    en: or anything which utilizes optical camouflage.
    ko: 광학미채를 탑재한 동물 형태의 랩쳐는 발견되지 않았다고 한다.
    ja: |-
      光学迷彩を搭載した動物型のラプチャーは
      確認されていないそうだ。
  event_absolute2_epilogue_12:
    speaker: eunhwa_t
    en: That means they must have migrated here for some unknown reason, even though
      their natural habitat is far from the Ark.
    ko: "그렇다는 건… 이들의 서식지가 방주 인근이 아닌데, \n모종의 이유로, 이쪽으로 옮겨온 것이거나,"
    ja: |-
      ならば…奴らの本来の生息地は
      アーク周辺ではなく、何らかの理由で
      移動してきたか…
  event_absolute2_epilogue_13:
    speaker: eunhwa_t
    en: That could also suggest that they're a mutation of some kind created through
      a Rapture evolutionary process we don't yet understand.
    ko: 우리가 알지 못하는 랩쳐의 진화 과정 중 발생한, 돌연변이 무리라는 말이 되겠군.
    ja: |-
      あるいは、ラプチャーの進化によって発生した
      突然変異種かもしれないということか。
  event_absolute2_epilogue_14:
    speaker: ingrid
    en: There is that possibility.
    ko: 그럴지도 모르지.
    ja: 考えられる話ではある。
  event_absolute2_epilogue_15:
    speaker: ingrid
    en: As for the bunker that they used as a base,
    ko: 그리고, 놈들이 거점으로 삼았던 그 벙커에 대한 건,
    ja: |-
      それと、奴らの巣になっていた
      シェルターについてだが…
  event_absolute2_epilogue_16:
    speaker: ingrid
    en: the Unlimited Squad found a similarly designed bunker not far from it.
    ko: 언리미티드 스쿼드가 그와 멀지 않은 곳에서, 비슷한 양식의 벙커를 발견했다고 하더군.
    ja: |-
      アンリミテッドから、そう遠くない場所で
      類似のシェルターを発見したと報告があった。
  event_absolute2_epilogue_17:
    speaker: eunhwa_t
    en: There are more of these bunkers?
    ko: 비슷한 양식의 벙커가 더 있다고?
    ja: 同じようなシェルターが他にもあるだと…？
  event_absolute2_epilogue_18:
    speaker: ingrid
    en: Yes, but their design doesn't correspond with anything that we have on record.
    ko: 하지만 과거의 어떤 기록을 찾아봐도, 그 벙커와 같은 양식은 찾아볼 수 없었다.
    ja: |-
      過去の記録を調べてはいるが、
      それらしい情報は見つからなかった。
  event_absolute2_epilogue_19:
    speaker: eunhwa_t
    en: "!"
    ko: "!!"
    ja: "！！"
  event_absolute2_epilogue_20:
    speaker: eunhwa_t
    en: That means...
    ko: 그 말은….
    ja: つまり…
  event_absolute2_epilogue_21:
    speaker: eunhwa_t
    en: Is it possible that someone other than those from the Ark created it?
    ko: 방주의 인간이 아닌 [누군가]가 만들었다고 추측할 수 있다는 건가?
    ja: |-
      アーク以外の「誰か」が作ったものと
      いうことか？
  event_absolute2_epilogue_22:
    speaker: ingrid
    en: That is a distinct possibility, yes.
    ko: "그래. \n그럴 가능성도 있게 된 셈이지."
    ja: ああ。可能性は十分に考えられる。
  event_absolute2_epilogue_23:
    speaker: ingrid
    en: There is a possibility that someone may not even be human.
    ko: 그 [누군가]가 인간이 아닐 가능성 또한 있는 것이고.
    ja: その「誰か」が、人間ではない可能性さえな。
  event_absolute2_epilogue_24:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_25:
    speaker: ingrid
    en: Moving forward, the Unlimited Squad and The Scouts will be cooperating to
      investigate further,
    ko: 뭐, 자세한 건 앞으로 언리미티드 스쿼드와 스카우팅 스쿼드가 협력하여 추적해 본다고 하니,
    ja: |-
      詳しいことは、今後アンリミテッドと
      スカウティングが合同で調査を進める。
  event_absolute2_epilogue_26:
    speaker: ingrid
    en: so we will have to wait and see.
    ko: 좀 더 기다려 봐야 할 듯하다.
    ja: 続報が来るまでは時間がかかるだろう。
  event_absolute2_epilogue_27:
    speaker: eunhwa_t
    en: Even The Scouts are being assigned?
    ko: 스카우팅 스쿼드도 간다고?
    ja: スカウティングが探索に出るのか？
  event_absolute2_epilogue_28:
    speaker: ingrid
    en: Yes.
    ko: 그래.
    ja: その通りだ。
  event_absolute2_epilogue_29:
    speaker: ingrid
    en: They said they were thankful for your help, and felt bad about requiring assistance.
    ko: 이번에 제군들에게 도움만 받은 것이, 고마우면서도 미안했다고 하더군.
    ja: |-
      お前たちに救助されたことには、
      感謝しているが申し訳ないと言っていた。
  event_absolute2_epilogue_30:
    speaker: ingrid
    en: Therefore, to further hone their reconnaissance skills,
    ko: 그래서 탐색 스쿼드로서의 기량을 조금 더 갈고닦기 위해서라도,
    ja: 偵察隊としての能力を向上するために…
  event_absolute2_epilogue_31:
    speaker: ingrid
    en: they volunteered to focus on surface exploration for a while.
    ko: 한동안은 지상 탐색에 매진해 보고 싶다며 자원했다.
    ja: しばらく地上探索の経験を積みたいとのことだ。
  event_absolute2_epilogue_32:
    speaker: eunhwa_t
    en: "... I see."
    ko: "…그렇군."
    ja: "…そうか。"
  event_absolute2_epilogue_33:
    speaker: ingrid
    en: By the way.
    ko: 아, 그러고 보니.
    ja: あとは、もう一件あったな。
  event_absolute2_epilogue_34:
    speaker: ingrid
    en: Do you remember the mass-produced Nikke squad you met last time?
    ko: 그때 제군이 만난 양산형 스쿼드를 기억하나?
    ja: |-
      お前たちが任務中に遭遇した
      量産型部隊は覚えているか？
  event_absolute2_epilogue_35:
    speaker: eunhwa_t
    en: "... I do. Why?"
    ko: "…기억하는데, 왜?"
    ja: "…覚えているが、それがどうした？"
  event_absolute2_epilogue_36:
    speaker: ingrid
    en: No changes were made to the squad members
    ko: 스쿼드 인원의 변경 없이,
    ja: 部隊の構成はそのまま維持されている。
  event_absolute2_epilogue_37:
    speaker: ingrid
    en: but they've apparently borrowed a space in Elysion Tower, and are training
      there now.
    ko: 엘리시온 타워를 빌려, 훈련 중이라고 하더군.
    ja: |-
      最近はエリシオンタワーの一角で
      訓練に励んでいるそうだ。
  event_absolute2_epilogue_38:
    speaker: eunhwa_t
    en: Training for?
    ko: 훈련?
    ja: 訓練…？
  event_absolute2_epilogue_39:
    speaker: ingrid
    en: Their purported goal is to take down Black Smith on their own someday.
    ko: 언젠가 반드시 자신들의 힘만으로, 블랙스미스를 잡는 게 목표라고 한다.
    ja: |-
      いつか自分たちの力だけで、
      ブラックスミスを倒すことが目標だそうだ。
  event_absolute2_epilogue_40:
    speaker: eunhwa_t
    en: Dreaming big, I see.
    ko: 쯧. 포부만 커서는….
    ja: ふん、夢だけは立派だな…
  event_absolute2_epilogue_41:
    speaker: ingrid
    en: According to their commander, someone apparently lit a real fire underneath
      him.
    ko: 그 지휘관에 따르면, 누군가가 확실하게 길을 제시해 준 모양이던데?
    ja: |-
      そこの指揮官からは、
      誰かに道を示されたと聞いているが？
  event_absolute2_epilogue_42:
    speaker: eunhwa_t
    en: Well, it wasn't me.
    ko: 난 그런 적 없어.
    ja: 私は何もしていない。
  event_absolute2_epilogue_43:
    speaker: eunhwa_t
    en: "... I guess he's not a complete idiot after all."
    ko: "…그래도, 영 머저리는 아니었나 보네."
    ja: |-
      …だが、そうだな。救いようのない
      マヌケ野郎じゃなかったということか。
  event_absolute2_epilogue_44:
    speaker: ingrid
    en: Well, that's all I have to say about this mission.
    ko: 뭐, 이번 임무에 대한 이야기는 여기까지다.
    ja: ひとまず、今回の報告はここまでだ。
  event_absolute2_epilogue_45:
    speaker: ingrid
    en: One thing is for certain; we're dealing with more unknown factors than we
      were before.
    ko: 하나 확실한 건, 이번 일로 우리가 모르는 미지의 영역이 조금 더 넓어졌다는 거다.
    ja: |-
      1つ確かなことは、今回の任務で
      我々の理解できていない領域が
      また少し増えたということだ。
  event_absolute2_epilogue_46:
    speaker: ingrid
    en: You did well going up against an unfamiliar foe.
    ko: 그 미지의 것과 싸우느라, 고생 많았다.
    ja: 未知の存在相手に、よく戦ってくれた。
  event_absolute2_epilogue_47:
    speaker: eunhwa_t
    en: The surface has always been that way.
    ko: 원래 지상은 그런 거였어.
    ja: もともと、地上はそういうものだろう。
  event_absolute2_epilogue_48:
    speaker: eunhwa_t
    en: A place swarming with unknown enemies.
    ko: 미지의 적으로 가득 찬 곳이었다.
    ja: 未知の敵だらけの場所だ。
  event_absolute2_epilogue_49:
    speaker: eunhwa_t
    en: This was merely the latest in the long list of threats out there.
    ko: 이번에도 그런 것과 싸웠을 뿐이야.
    ja: 今回もいつもと変わらない。
  event_absolute2_epilogue_50:
    speaker: ingrid
    en: Heh, is that so?
    ko: 후후, 그런가.
    ja: ふ…そうか。
  event_absolute2_epilogue_51:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_52:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_53:
    speaker: ingrid
    en: Eunhwa.
    ko: 은화.
    ja: ウンファ。
  event_absolute2_epilogue_54:
    speaker: ingrid
    en: You look relieved.
    ko: 후련해 보이는군.
    ja: 吹っ切れたようだな。
  event_absolute2_epilogue_55:
    speaker: eunhwa_t
    en: A little.
    ko: 조금은.
    ja: 少しはな。
  event_absolute2_epilogue_56:
    speaker: ingrid
    en: So, did you find the answer to your question from before?
    ko: 그래서 지난번 질문에 대한 답은 찾았나?
    ja: 答えは見つかったか？
  event_absolute2_epilogue_57:
    speaker: eunhwa_t
    en: What do you mean?
    ko: 뭐가 말이지?
    ja: 何のことだ？
  event_absolute2_epilogue_58:
    speaker: ingrid
    en: Are you still wondering if you could take down Behemoth without the Counters?
    ko: 아직도 카운터스 없이 베히모스를 쓰러뜨릴 수 있는지 궁금한가?
    ja: |-
      カウンターズ抜きでベヒモスを撃破できるか、
      まだ聞きたいか？
  event_absolute2_epilogue_59:
    speaker: eunhwa_t
    en: "... No."
    ko: "…아니."
    ja: "…いや。"
  event_absolute2_epilogue_60:
    speaker: eunhwa_t
    en: That was never a question to begin with.
    ko: 애초에 질문조차 되지 않는 거였다.
    ja: そもそも最初から疑問の余地などなかった。
  event_absolute2_epilogue_61:
    speaker: eunhwa_t
    en: We will win no matter what.
    ko: 우린 반드시 승리한다.
    ja: 私たちは必ず勝利する。
  event_absolute2_epilogue_62:
    speaker: eunhwa_t
    en: If we can't win at first, we'll keep fighting until we do.
    ko: 승리할 수 없다면 승리할 수 있을 때까지 싸운다.
    ja: 勝てなければ、勝つまで戦う。
  event_absolute2_epilogue_63:
    speaker: eunhwa_t
    en: That's all there is to it.
    ko: 그뿐이야.
    ja: ただそれだけだ。
  event_absolute2_epilogue_64:
    speaker: ingrid
    en: Haha, is that so.
    ko: 후후, 그런가.
    ja: ふふ、そうか。
  event_absolute2_epilogue_65:
    speaker: ingrid
    en: I'm glad you managed to find an answer.
    ko: 스스로 답을 내렸다면 다행이군.
    ja: 答えが出たならいい。
  event_absolute2_epilogue_66:
    speaker: ingrid
    en: Well then, get some rest.
    ko: 그럼, 이번에야말로 푹 쉬도록.
    ja: 今度こそ、ゆっくり休んでおけ。
  event_absolute2_epilogue_67:
    speaker: eunhwa_t
    en: All right.
    ko: 그래.
    ja: ああ。
  event_absolute2_epilogue_68:
    speaker: eunhwa_c
    en: Of all things, why would you pick this...
    ko: 하필 골라줘도 이런걸…!
    ja: よりによって、なんだこれは…！
  event_absolute2_epilogue_69:
    speaker: emma_t
    en: Wow, you're so pretty, Eunhwa!
    ko: 와아… 은화, 예쁘다~
    ja: ふふ。ウンファ、すごくキレイよ～
  event_absolute2_epilogue_70:
    speaker: vesti_t
    en: Can I take a ph-photo?
    ko: 사, 사진 찍어도 돼?
    ja: しゃ、写真撮っていい？
  event_absolute2_epilogue_71:
    speaker: eunhwa_c
    en: Both of you, shut up!
    ko: 둘 다 닥쳐…!
    ja: お前ら、いい加減に…！
  event_absolute2_epilogue_72:
    speaker: vesti_t
    en: Hehe, is there any c-chance you could wear this for the whole day?
    ko: "헤헤. 은화, \n오, 오늘은 하루 종일 이거 입고 돌아다녀 주면 안 돼?"
    ja: |-
      えへへ…ね、ねぇウンファ。
      今日は一日、これ着て過ごしたら？
  event_absolute2_epilogue_73:
    speaker: eunhwa_c
    en: You want me to walk around wearing this?
    ko: 나보고 이걸 입고 돌아다니라고?
    ja: この格好で出歩かせる気か？
  event_absolute2_epilogue_74:
    speaker: eunhwa_c
    en: What about you two?
    ko: 너희는?
    ja: そういうお前たちは？
  event_absolute2_epilogue_75:
    speaker: emma_t
    en: The chest area was a bit tight for mine, so I sent it in for alterations.
      It'll be here next week.
    ko: 나는 가슴 부분을 수선 맡겨서, 다음 주쯤이나 받을 수 있다고 하던걸~
    ja: |-
      新しい服が胸のお直しを頼んだばかりなの。
      届くのは来週あたりかしら～？
  event_absolute2_epilogue_76:
    speaker: vesti_t
    en: M-mine's being delivered to the dorm tomorrow in my chosen color.
    ko: 나, 나는 원하는 색상으로 내일 숙소로 배송해 준다고 했어.
    ja: |-
      わ、私は欲しい色がなくって、
      選んだのがまた今度届くみたいだから…
  event_absolute2_epilogue_77:
    speaker: eunhwa_c
    en: Well then, I'm not gonna—
    ko: 그럼 나도 안….
    ja: だったら私も着な…
  event_absolute2_epilogue_78:
    speaker: vesti_t
    en: But y-you look so pretty in it...
    ko: 으, 은화 이거 입은 거 너무 예쁜데….
    ja: でも、ウンファにすごく似合ってるし…
  event_absolute2_epilogue_79:
    speaker: vesti_t
    en: You never wear r-regular clothes anymore. Wh-who knows when you'll wear something
      like this again?
    ko: "요, 요즘 사복도 잘 안 입어 주니까… \n이, 이거 언제 또 입을지 모, 모르잖아."
    ja: |-
      さ、最近あんまり私服を着てくれないでしょ…
      いつまたこんなチャンスがあるか
      分からないから…
  event_absolute2_epilogue_80:
    speaker: vesti_t
    en: Can't you w-wear it, just for today?
    ko: 딱, 오, 오늘 하루만 입어주면 안 될까…?
    ja: |-
      だ、だから…今日一日だけでいいから、
      着てくれないかな…？
  event_absolute2_epilogue_81:
    speaker: eunhwa_c
    en: "*Sigh...*"
    ko: "…하아."
    ja: "…はぁ…"
  event_absolute2_epilogue_82:
    speaker: eunhwa_c
    en: Fine. I'll wear it. Satisfied?
    ko: "그래. 입어. \n입고 다니면 되잖아."
    ja: |-
      …分かった、着る。
      着ればいいんだろう。
  event_absolute2_epilogue_83:
    speaker: vesti_t
    en: R-really?!
    ko: 저, 정말?!
    ja: ほ、本当！？
  event_absolute2_epilogue_84:
    speaker: eunhwa_c
    en: So, where to next?
    ko: 그래서, 다음은 뭐하면 되는데.
    ja: それで、次は何だ。
  event_absolute2_epilogue_85:
    speaker: vesti_t
    en: We're g-going to the Toy Store!
    ko: 자, 장난감 가게에 갈 거야!
    ja: |-
      えっと、おもちゃ屋さんに
      行きたいなって…！
  event_absolute2_epilogue_86:
    speaker: eunhwa_c
    en: The Toy Store? What are you going to buy there?
    ko: 장난감? 거기서 또 뭘 사게.
    ja: おもちゃ屋？欲しい物でもあるのか。
  event_absolute2_epilogue_87:
    speaker: vesti_t
    en: I-I...
    ko: 그, 그냥…!
    ja: ううん、別に…？
  event_absolute2_epilogue_88:
    speaker: vesti_t
    en: It's fun to just look around!
    ko: 구경하면 좋으니까!
    ja: 見るだけでも楽しいでしょ！
  event_absolute2_epilogue_89:
    speaker: eunhwa_c
    en: Looking at toys... what are you, a child?
    ko: 네가 애도 아니고, 무슨 장난감을 구경하러…!
    ja: ガキでもあるまいし、おもちゃなど…！
  event_absolute2_epilogue_90:
    speaker: emma_t
    en: Come now, Eunhwa, if Vesti wants to go to the Toy Store, that's perfectly
      fine.
    ko: "에이~ 그러고 싶을 수도 있지. \n그치~ 베스티?"
    ja: |-
      そう～？たまにはいいものだと思うわ～？
      ね、ベスティー？
  event_absolute2_epilogue_91:
    speaker: vesti_t
    en: Belorta and Mica also said they had a surprise for me.
    ko: 어… 벨로타랑 미카가… 깜짝 놀랄만한 거 들어왔다고 해서….
    ja: |-
      うん…ベロータとミカがね…
      びっくりするモノを仕入れたって言ってたし…
  event_absolute2_epilogue_92:
    speaker: eunhwa_c
    en: "*Sigh...*"
    ko: 하아….
    ja: はぁ…
  event_absolute2_epilogue_93:
    speaker: eunhwa_c
    en: Fine. Let's go...
    ko: "그래. \n가자, 가…."
    ja: |-
      そうか。
      なら行くぞ、さっさと…
  event_absolute2_epilogue_94:
    speaker: emma_t
    en: Hehe! Off we go!
    ko: 후후후. 가자~
    ja: ふふふ…それじゃ、行きましょうか～
  event_absolute2_epilogue_95:
    speaker: "<Narration>"
    en: The group heads to the Toy Store.
    ko: 그렇게 그들은 장난감 가게에도 가고,
    ja: そうして、3人はおもちゃ屋へ向かった
  event_absolute2_epilogue_96:
    speaker: "<Narration>"
    en: "*Pop*"
    ko: 펑-!
    ja: パンッ！
  event_absolute2_epilogue_97:
    speaker: "<Narration>"
    en: A black cat pops out of the gift box Vesti is holding.
    ko: 베스티가 든 선물 상자에서 검은 고양이가 튀어나왔다.
    ja: |-
      おもちゃ屋でベスティーが手に取った箱から
      黒猫が飛び出した
  event_absolute2_epilogue_98:
    speaker: vesti_t
    en: Hehe! Did that s-scare you?
    ko: 까, 깜짝 놀랐지!
    ja: び、びっくりしたでしょ！
  event_absolute2_epilogue_99:
    speaker: eunhwa_c
    en: "... Was it supposed to?"
    ko: "…그걸 보고?"
    ja: "…それだけか？"
  event_absolute2_epilogue_100:
    speaker: emma_t
    en: It certainly gave me a fright!
    ko: 응~ 엄청 놀랐어~
    ja: ふふ、すごくびっくりしたわ～
  event_absolute2_epilogue_101:
    speaker: emma_t
    en: Is this what you wanted to buy?
    ko: 이걸 사고 싶었던 거야?
    ja: ベスティーが言ってたのって、これのこと？
  event_absolute2_epilogue_102:
    speaker: vesti_t
    en: Yeah! W-watch, there's more it can do!
    ko: 응! 이, 이게 다가 아니야…!
    ja: うん！でも、これだけじゃないの…！
  event_absolute2_epilogue_103:
    speaker: "<Narration>"
    en: Vesti presses the button on the box.
    ko: 베스티가 상자의 버튼을 눌렀다.
    ja: ベスティーが箱についたボタンを押した
  event_absolute2_epilogue_104:
    speaker: "<Narration>"
    en: "*Meow* *Meoooow*"
    ko: 야옹~ 야오옹~
    ja: ニャニャ、ニャーン～
  event_absolute2_epilogue_105:
    speaker: "<Narration>"
    en: As music plays, the cat begins to dance with a blank expression.
    ko: 음악 소리와 함께, 고양이가 무심한 얼굴로 춤을 추며 움직이기 시작했다.
    ja: |-
      音楽に合わせて、表情の変わらないネコが
      ダンスを踊り始めた
  event_absolute2_epilogue_106:
    speaker: emma_t
    en: Oh my, it even dances?
    ko: 어머나~ 춤도 추네?
    ja: あら～ダンスもできるのね～？
  event_absolute2_epilogue_107:
    speaker: vesti_t
    en: Isn't it a-adorable?
    ko: 귀, 귀엽지…!
    ja: か、かわいいでしょ…！
  event_absolute2_epilogue_108:
    speaker: eunhwa_c
    en: That thing...?
    ko: 저게…?
    ja: どこが…？
  event_absolute2_epilogue_109:
    speaker: emma_t
    en: Hehe, it's so cute. Actually, it reminds me of someone...
    ko: "후후, 귀엽네~ \n꼭 누구를 닮았는데~?"
    ja: |-
      ふふ、かわいいわ～
      誰かさんに似てるわね～？
  event_absolute2_epilogue_110:
    speaker: vesti_t
    en: Hehe. It d-does, doesn't it...?
    ko: 헤헤. 그, 그치…?
    ja: えへへ、で、でしょ…？
  event_absolute2_epilogue_111:
    speaker: eunhwa_c
    en: What are you two blabbering about?
    ko: |-
      ??
      뭐라는 거야.
    ja: "…？？何の話だ。"
  event_absolute2_epilogue_112:
    speaker: eunhwa_c
    en: If you're finished looking around, let's get out of here. This outfit is super
      uncomfortable.
    ko: |-
      더 볼 거 없으면, 그만 가자.
      옷 불편해.
    ja: |-
      はぁ…他にないならもう出るぞ。
      服が動きづらい。
  event_absolute2_epilogue_113:
    speaker: emma_t
    en: Come on, Eunhwa, don't be like that. Why don't you pick out something for
      yourself?
    ko: 에이~ 그러지 말고, 은화도 좀 골라봐~ 응?
    ja: |-
      え～？そんなこと言わないで、
      ウンファも何か選んでみたら～？
  event_absolute2_epilogue_114:
    speaker: eunhwa_c
    en: No.
    ko: 됐어.
    ja: いらん。
  event_absolute2_epilogue_115:
    speaker: "<Narration>"
    en: The group heads to the cafe to indulge in a parfait.
    ko: 카페에 가서 함께 파르페를 먹으며,
    ja: |-
      その後、3人はカフェに入り
      パフェを注文した
  event_absolute2_epilogue_116:
    speaker: womanstaff
    en: Your parfait is ready.
    ko: 주문하신 파르페 나왔습니다~
    ja: ご注文のパフェ、お待たせしました～
  event_absolute2_epilogue_117:
    speaker: eunhwa_c
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_absolute2_epilogue_118:
    speaker: "<Narration>"
    en: A massive, lavishly decorated parfait is placed in the center of the table.
    ko: 테이블 가운데에 거대하고 화려한 파르페가 놓였다.
    ja: テーブルの中央に目を引く巨大パフェが置かれた
  event_absolute2_epilogue_119:
    speaker: emma_t
    en: Wow, it's so big! And so pretty!
    ko: 와아~ 이 파르페 정말 크고 예쁜걸?
    ja: |-
      まあ～
      とっても大きくてキレイなパフェね～
  event_absolute2_epilogue_120:
    speaker: eunhwa_c
    en: Are the three of us meant to eat this entire thing?
    ko: 이걸… 정말 우리 셋이 다 먹는다고?
    ja: このサイズを…私たちだけで食べきる気か？
  event_absolute2_epilogue_121:
    speaker: vesti_t
    en: Yep!
    ko: 응!
    ja: うん！
  event_absolute2_epilogue_122:
    speaker: eunhwa_c
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_123:
    speaker: "<Narration>"
    en: Eunhwa stares silently at the parfait.
    ko: 은화가 물끄러미 파르페를 바라보았다.
    ja: ウンファはまじまじとパフェをにらんだ
  event_absolute2_epilogue_124:
    speaker: eunhwa_c
    en: "... There's no way."
    ko: "…불가능할 거 같은데."
    ja: "…正気か？"
  event_absolute2_epilogue_125:
    speaker: emma_t
    en: Hehe. Why not? I think we can do it.
    ko: |-
      후후~ 왜?
      난 가능할 거 같은데~
    ja: |-
      ふふ、大丈夫よ～
      これくらいなら全部食べれると思うわ～
  event_absolute2_epilogue_126:
    speaker: eunhwa_c
    en: I think it's going to be too sweet for me—
    ko: 나한텐 너무 달 것 같….
    ja: 私には甘すぎ…
  event_absolute2_epilogue_127:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵-!
    ja: カシャッ！
  event_absolute2_epilogue_128:
    speaker: eunhwa_c
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_epilogue_129:
    speaker: emma_t
    en: Oh my?
    ko: 어머나?
    ja: あら？
  event_absolute2_epilogue_130:
    speaker: eunhwa_c
    en: What the heck?
    ko: 뭐야 갑자기.
    ja: "…何だ、急に。"
  event_absolute2_epilogue_131:
    speaker: vesti_t
    en: Hehe, it's j-just... I've been wanting to come here as a group for so long,
      I w-wanted to capture the moment for posterity.
    ko: "헤헤, 그, 그냥. \n여기 꼭 다 같이 오고 싶었던 곳이라 기, 기록으로 남겨두려고…."
    ja: |-
      えへへ…ずっと、いつかみんなで
      ここに来たいなって思ってたから…
      だからその、き、記念に…
  event_absolute2_epilogue_132:
    speaker: eunhwa_c
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_133:
    speaker: eunhwa_c
    en: Fine. Take all the pictures you want.
    ko: "…그래. 많이 찍어둬라."
    ja: "…そうか。好きにしろ。"
  event_absolute2_epilogue_134:
    speaker: vesti_t
    en: R-really? Can I?!
    ko: 저, 정말 그래도 돼?!
    ja: い、いいの！？
  event_absolute2_epilogue_135:
    speaker: eunhwa_c
    en: But in return,
    ko: 대신.
    ja: ただし…
  event_absolute2_epilogue_136:
    speaker: eunhwa_c
    en: I get to change out of this ridiculous outfit.
    ko: 이 옷은 여기까지만 입고, 다시 갈아입는다.
    ja: この服はここで終わりだ。もう着替える。
  event_absolute2_epilogue_137:
    speaker: vesti_t
    en: B-but you said you'd wear it for th-the whole day...
    ko: "왜, 왜에…? \n오, 오늘 하루 동안 입어준다고…."
    ja: |-
      え、なんで…？
      きょ、今日一日ずっと着てくれるって…
  event_absolute2_epilogue_138:
    speaker: eunhwa_c
    en: I feel like a clown, and the circus ends here.
    ko: 광대 노릇은 이걸로 끝이야.
    ja: 道化はもう十分だ。
  event_absolute2_epilogue_139:
    speaker: eunhwa_c
    en: I'm changing.
    ko: 갈아입는다.
    ja: 異論は許さん。
  event_absolute2_epilogue_140:
    speaker: vesti_t
    en: O-okay...
    ko: 아, 알겠어….
    ja: わ、分かったよ…
  event_absolute2_epilogue_141:
    speaker: emma_t
    en: All right, everyone, let's settle down and try some of this parfait.
    ko: "후후, 그러지 말고~ \n두 사람 다 이것 좀 먹어봐~"
    ja: |-
      ふふ、ほらほら～
      2人ともちょっと食べてみて～
  event_absolute2_epilogue_142:
    speaker: emma_t
    en: It's absolutely scrumptious.
    ko: 너무 맛있다.
    ja: すごくおいしいわよ～
  event_absolute2_epilogue_143:
    speaker: vesti_t
    en: I have heard amazing things about the parfait here!
    ko: 헤헤. 그치~ 여기 파르페 엄청 맛있다고 했어!
    ja: |-
      へへ、でしょ…！ここのパフェ、
      すごくおいしいって評判なの！
  event_absolute2_epilogue_144:
    speaker: vesti_t
    en: T-try some, Eunhwa!
    ko: 으, 은화도 얼른 먹어…!
    ja: ほら、ウンファも早く…！
  event_absolute2_epilogue_145:
    speaker: eunhwa_c
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_146:
    speaker: "<Narration>"
    en: Eunhwa picks up one of the cookies stuck into the parfait.
    ko: 은화가 파르페 위에 꽂혀 있는 과자 하나를 집어 들었다.
    ja: |-
      ウンファがパフェの上に乗っている飾り菓子を
      つまんで食べた
  event_absolute2_epilogue_147:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 와삭-
    ja: サクッ
  event_absolute2_epilogue_148:
    speaker: eunhwa_c
    en: "... It's not bad."
    ko: "…나쁘지 않네."
    ja: "…悪くはないな。"
  event_absolute2_epilogue_149:
    speaker: vesti_t
    en: Hehe, so y-you like it?
    ko: 헤헤, 그, 그렇지?
    ja: えへへ、でしょ？
  event_absolute2_epilogue_150:
    speaker: emma_t
    en: Vesti, how about a photo of the three of us?
    ko: 베스티~ 이번엔 우리 셋이 다 같이 나오게,
    ja: ねぇベスティー、3人の写真が欲しいわ。
  event_absolute2_epilogue_151:
    speaker: emma_t
    en: Why don't we ask the staff to take the picture?
    ko: 직원분께 사진 찍어달라고 해볼까~?
    ja: お店の人にお願いして撮ってもらわない～？
  event_absolute2_epilogue_152:
    speaker: vesti_t
    en: O-okay! Great idea!
    ko: 으, 응! 좋아!
    ja: う、うん！いいね！
  event_absolute2_epilogue_153:
    speaker: "<Narration>"
    en: The three members of Absolute spend some time together.
    ko: 함께 시간을 보냈다.
    ja: そうして、3人は共にひとときを過ごした
  event_absolute2_epilogue_154:
    speaker: eunhwa_t
    en: Ahh, this is much more comfortable.
    ko: 하아… 이제야 좀 편안하네.
    ja: はあ…やっと楽になった。
  event_absolute2_epilogue_155:
    speaker: vesti_t
    en: Th-that other outfit was so pretty though... what a p-pity...
    ko: 예, 예뻤는데… 아, 아쉽네.
    ja: うぅ…似合ってたのに…残念…
  event_absolute2_epilogue_156:
    speaker: eunhwa_t
    en: Enough. Just tell me what you want to do next.
    ko: 됐고, 또 하고 싶은 거나, 말해.
    ja: 十分見ただろう。次だ、次。
  event_absolute2_epilogue_157:
    speaker: emma_t
    en: Next up was a... pajama party, wasn't it?
    ko: 음~ 다음은 파자마 파티였던가~?
    ja: |-
      確か、この後は
      パジャマパーティーだったかしら～？
  event_absolute2_epilogue_158:
    speaker: vesti_t
    en: That's right! W-we can head back to the dorm and have a pajama party!
    ko: 맞아! 수, 숙소로 가서 파, 파자마 파티하면 돼…!
    ja: うん！帰って、パジャマに着替えるだけ…！
  event_absolute2_epilogue_159:
    speaker: eunhwa_t
    en: You want me to change again?
    ko: 또 옷을 갈아입으라고?
    ja: また着替えか…
  event_absolute2_epilogue_160:
    speaker: emma_t
    en: Yep! Vesti and I picked out something absolutely lovely at the mall earlier.
    ko: 응~ 아까 베스티랑 쇼핑몰에서 예쁜 거 골라놨어~
    ja: |-
      そうよ～、ショッピングモールで
      かわいいのを選んでおいたの～
  event_absolute2_epilogue_161:
    speaker: vesti_t
    en: D-don't worry, this time, we'll all be getting changed.
    ko: 이, 이번엔 다, 다 같이 입을 거야!
    ja: こ、今度はみんな一緒だから！
  event_absolute2_epilogue_162:
    speaker: eunhwa_t
    en: "*Sigh*... All right, fine."
    ko: 하아… 그래, 그러면 됐다.
    ja: はあ…仕方ない。それならまだマシか。
  event_absolute2_epilogue_163:
    speaker: vesti_t
    en: S-so you're going to join us?
    ko: 가, 같이 해주는 거야?
    ja: じゃあ、パジャマパーティーしてくれるの？
  event_absolute2_epilogue_164:
    speaker: eunhwa_t
    en: Unless you don't want me to.
    ko: 하지 말까?
    ja: やめてもいいぞ？
  event_absolute2_epilogue_165:
    speaker: vesti_t
    en: N-no! O-of course not!
    ko: 아, 아니! 그, 그건 아닌데….
    ja: |-
      う、ううん！
      そ、そういうことじゃなくて…
  event_absolute2_epilogue_166:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_167:
    speaker: vesti_t
    en: U-uh, Eunhwa...
    ko: 저, 저기 은화….
    ja: あのさ、ウンファ…
  event_absolute2_epilogue_168:
    speaker: vesti_t
    en: Can I ask you something?
    ko: 한 가지만 물어봐도 돼?
    ja: 1つ聞いてもいい？
  event_absolute2_epilogue_169:
    speaker: eunhwa_t
    en: What?
    ko: 뭔데.
    ja: 何だ？
  event_absolute2_epilogue_170:
    speaker: vesti_t
    en: Wh-why are you being so accommodating?
    ko: 왜, 왜 이렇게 다 잘해줘?
    ja: なんで今日はこんなに優しいの？
  event_absolute2_epilogue_171:
    speaker: eunhwa_t
    en: Do you not want me to be?
    ko: 그럼 하지 말까?
    ja: そうじゃない方がいいらしいな？
  event_absolute2_epilogue_172:
    speaker: vesti_t
    en: N-no, it's not that!
    ko: 그, 그것도 아닌데…!
    ja: 違うの、そういう意味じゃなくて…！
  event_absolute2_epilogue_173:
    speaker: vesti_t
    en: I was just c-curious, that's all.
    ko: 그, 그냥… 구, 궁금해서….
    ja: ただ…気になって…
  event_absolute2_epilogue_174:
    speaker: vesti_t
    en: Y-you're being way nicer to me than usual...
    ko: 펴, 평소보다 은화가 나한테 더 잘해주는 거 같아서….
    ja: |-
      なんだか、いつものウンファより、
      優しい気がするから…
  event_absolute2_epilogue_175:
    speaker: eunhwa_t
    en: "... Tch. You ask way too many questions."
    ko: "…쯧. 별걸 다 묻네."
    ja: "…チッ。くだらないことを聞くな。"
  event_absolute2_epilogue_176:
    speaker: vesti_t
    en: S-sorry...
    ko: 미, 미안…!
    ja: ご、ごめん…！
  event_absolute2_epilogue_177:
    speaker: eunhwa_t
    en: "*Sigh...*"
    ko: 하아….
    ja: はぁ…
  event_absolute2_epilogue_178:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_179:
    speaker: eunhwa_t
    en: Because... last time...
    ko: 지난번… 했으니까.
    ja: "…かった。"
  event_absolute2_epilogue_180:
    speaker: vesti_t
    en: H-huh?
    ko: 으, 응?
    ja: え、えっ？
  event_absolute2_epilogue_181:
    speaker: vesti_t
    en: I can't hear you.
    ko: 나 잘 못 들었어.
    ja: よく聞こえなかったんだけど…
  event_absolute2_epilogue_182:
    speaker: eunhwa_t
    en: Then forget it.
    ko: 못 들었으면 됐어.
    ja: それならそれでいい。
  event_absolute2_epilogue_183:
    speaker: eunhwa_t
    en: I won't repeat myself.
    ko: 두 번은 말 안 해.
    ja: 二度は言わん。
  event_absolute2_epilogue_184:
    speaker: vesti_t
    en: What?
    ko: 뭐?
    ja: えぇ…！？
  event_absolute2_epilogue_185:
    speaker: vesti_t
    en: P-please, can you say it one m-more time? Pleaaaase?
    ko: 으, 은화~!! 하, 한 번만 더 말해줘, 응?
    ja: |-
      ウ、ウンファ～！！
      もう1回、もう1回言って？ねえ、お願い～
  event_absolute2_epilogue_186:
    speaker: eunhwa_t
    en: No.
    ko: 싫어.
    ja: 断る。
  event_absolute2_epilogue_187:
    speaker: eunhwa_t
    en: Now stop pestering me, or I'm not joining this ridiculous pajama party.
    ko: 자꾸 치대면 파자마 파티고 뭐고 안 한다.
    ja: |-
      あんまりしつこいようなら、
      パジャマパーティーも中止だ。
  event_absolute2_epilogue_188:
    speaker: vesti_t
    en: N-no...!
    ko: 그, 그건 싫어…!
    ja: そ、それはダメ…！
  event_absolute2_epilogue_189:
    speaker: "<Narration>"
    en: Eunhwa and Vesti squabble back and forth as they walk ahead.
    ko: 은화와 베스티가 티격태격하며 앞을 향해 걸어갔다.
    ja: |-
      ウンファとベスティーが、
      騒ぎながら帰り道を歩いていく
  event_absolute2_epilogue_190:
    speaker: emma_t
    en: Hehe. Oh, Eunhwa...
    ko: 후후, 정말 은화도~
    ja: ふふ、ウンファったら～
  event_absolute2_epilogue_191:
    speaker: emma_t
    en: You're terrible at speaking from the heart!
    ko: 솔직하지 못하다니까?
    ja: 素直じゃないわね？
  event_absolute2_epilogue_192:
    speaker: eunhwa_t
    en: "*Sigh...*"
    ko: 하아….
    ja: はぁ…
  event_absolute2_epilogue_193:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_epilogue_194:
    speaker: eunhwa_t
    en: Because I was sorry... for what happened last time.
    ko: 지난번엔… 미안했으니까.
    ja: 最近のことは…すまなかった。
  event_absolute2_epilogue_195:
    speaker: emma_t
    en: I was wondering how you two would ever make up...
    ko: 정말… 어떻게 화해하나 싶었는데….
    ja: |-
      ずっと…どうすれば2人が仲直りできるか
      悩んでたのよ…
  event_absolute2_epilogue_196:
    speaker: "<Narration>"
    en: Emma looks at Eunhwa and Vesti from behind.
    ko: 엠마가 은화와 베스티의 뒷모습을 바라보았다.
    ja: |-
      エマはウンファとベスティーの
      後ろ姿を見つめた
  event_absolute2_epilogue_197:
    speaker: emma_t
    en: Hehe. Thank goodness it worked out.
    ko: 후후, 다행이네.
    ja: ふふ…よかった、本当に…
  event_absolute2_epilogue_198:
    speaker: eunhwa_t
    en: Emma!
    ko: 엠마!
    ja: エマ！
  event_absolute2_epilogue_199:
    speaker: emma_t
    en: Hmm?
    ko: 응~?
    ja: なぁに～？
  event_absolute2_epilogue_200:
    speaker: "<Narration>"
    en: Eunhwa turns around and looks at Emma.
    ko: 은화가 뒤를 돌아, 엠마를 바라본다.
    ja: ウンファが振り返り、エマを見た
  event_absolute2_epilogue_201:
    speaker: eunhwa_t
    en: What are you doing back there by yourself?
    ko: 거기 혼자 서서 뭐 해.
    ja: 何をモタモタしてる？
  event_absolute2_epilogue_202:
    speaker: eunhwa_t
    en: Let's go.
    ko: 가자.
    ja: 行くぞ。
  event_absolute2_epilogue_203:
    speaker: emma_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_epilogue_204:
    speaker: emma_t
    en: Ah...
    ko: 아….
    ja: あ…
  event_absolute2_epilogue_205:
    speaker: eunhwa
    en: Emma...
    ko: "…엠마."
    ja: "…エマ。"
  event_absolute2_epilogue_206:
    speaker: emma
    en: Yes?
    ko: "…응?"
    ja: "…なぁに？"
  event_absolute2_epilogue_207:
    speaker: eunhwa
    en: "... Don't change."
    ko: "…넌 변하지 마라."
    ja: "…お前は変わるな。"
  event_absolute2_epilogue_208:
    speaker: eunhwa
    en: Never change.
    ko: 절대 변하지 마.
    ja: 絶対に。
  event_absolute2_epilogue_209:
    speaker: emma
    en: "... I guess you're really okay now."
    ko: "…이젠 정말 괜찮나 보구나."
    ja: "…もう本当に、大丈夫みたいね。"
  event_absolute2_epilogue_210:
    speaker: eunhwa_t
    en: Emma...?
    ko: 엠마…?
    ja: エマ…？
  event_absolute2_epilogue_211:
    speaker: vesti_t
    en: Em-Emma? Is something the matter?
    ko: 에, 엠마 왜 그래? 무슨 일 있어?
    ja: ど、どうしたの？ぐ、具合でも悪いの？
  event_absolute2_epilogue_212:
    speaker: emma_t
    en: Haha, it's nothing.
    ko: 후후, 아무것도 아니야~
    ja: ふふ、何でもないわ～
  event_absolute2_epilogue_213:
    speaker: emma_t
    en: I'm coming!
    ko: 나도 앞으로 갈게~!
    ja: 私も2人に並んじゃおうかしら～
  event_absolute2_epilogue_214:
    speaker: "<Narration>"
    en: Emma runs toward Eunhwa and Vesti.
    ko: 엠마가 은화와 베스티를 향해 달려갔다.
    ja: |-
      そう言って、エマは
      ウンファとベスティーのもとへ駆けだした
  event_absolute2_epilogue_215:
    speaker: emma_t
    en: Hmm... It's been a while! Shall I make something tasty for the both of you?
    ko: 음~ 그럼 오랜만에 내가 맛있는 거 해줄까?
    ja: |-
      そうだわ～久しぶりに
      おいしいものでも作ってあげるわね？
  event_absolute2_epilogue_216:
    speaker: vesti_t
    en: Er... th-that's okay!
    ko: "…어, 그, 그건 괘, 괜찮아!"
    ja: そそ、それは、大丈夫だから！
  event_absolute2_epilogue_217:
    speaker: eunhwa_t
    en: "... I'll handle the cooking."
    ko: "…요리는 내가 할게."
    ja: "…料理は私がやる。"
  event_absolute2_epilogue_218:
    speaker: vesti_t
    en: Whoa, r-really? You're gonna c-cook, Eunhwa...?
    ko: "와, 와아…! \n으, 은화가 해주는 요리다…!"
    ja: |-
      わわ…！
      ウ、ウンファの手料理だ！
  event_absolute2_epilogue_219:
    speaker: emma_t
    en: Oh my, Eunhwa is going to cook? Would you like me to help out?
    ko: "어머나, 은화가 해준다고~? \n후후, 그럼 내가 도와줄까?"
    ja: |-
      まあ、ウンファが作ってくれるの～？
      じゃあ、何か手伝いましょうか～？
  event_absolute2_epilogue_220:
    speaker: eunhwa_t
    en: No. I'll do it myself.
    ko: 됐어. 나 혼자면 돼.
    ja: いい。私一人でできる。
  event_absolute2_epilogue_221:
    speaker: vesti_t
    en: I-I think that would be better too!
    ko: 나, 나도 그러는 게 좋을 거 같아!
    ja: わ、私もその方がいいと思う！
  event_absolute2_epilogue_222:
    speaker: "<Narration>"
    en: The three members of Absolute talk as they walk forward,
    ko: 셋은 서로를 보고 이야기하며,
    ja: 3人は互いに顔を合わせ、会話に花を咲かせた
  event_absolute2_epilogue_223:
    speaker: "<Narration>"
    en: no longer stopping or turning to look back.
    ko: 더는 멈춰 서지도, 뒤돌아보지도 않고.
    ja: もう立ち止まることも、振り返ることもない
  event_absolute2_epilogue_224:
    speaker: "<Narration>"
    en: Side by side, they walked forward into the future.
    ko: 나란히 서서 앞을 향해 나아갔다.
    ja: その歩みは、並んで前へと進んでいく
  event_absolute2_epilogue_225:
    speaker: "<Narration>"
    en: 'ABSOLUTE DAYS: AND'
    ko: 'ABSOLUTE DAYS : AND'
    ja: 'ABSOLUTE DAYS : AND'
