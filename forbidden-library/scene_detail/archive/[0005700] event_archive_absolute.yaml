  event_absolute2_intermission_01_83:
    speaker: "<Narration>"
    en: The horde of Predators charges at Vesti all at once.
    ko: 프레데터들이 일제히 베스티를 향해 달려들었다.
    ja: |-
      プレデターが勢いよく
      ベスティーを狙い突進する
