    speaker: "<Narration>"
    en: Vesti and Emma climb to the midpoint of the stairs, where the Predator once
      stood.
    ko: 베스티와 엠마가 프레데터가 서 있던 계단 중반까지 올라가,
    ja: |-
      ベスティーとエマはプレデターが転がる
      階段の中央辺りまで駆け上がり…
  event_absolute2_05_e_63:
    speaker: emma_t
