---
event_absolute1_prologue:
  event_absolute1_prologue_1:
    speaker: ingrid
    en: You've failed.
    ko: 제군은 실패했다.
    ja: お前たちは失敗した。
  event_absolute1_prologue_2:
    speaker: ingrid
    en: Just as all who sought to reclaim the surface
    ko: 지상을 탈환하고자 한 모두가 그러했듯.
    ja: かつて、地上奪還を試みた者たちと同じように…
  event_absolute1_prologue_3:
    speaker: ingrid
    en: have failed before you.
    ko: 제군 역시 실패하고 만 거다.
    ja: お前たちもまた、挫折を味わった。
  event_absolute1_prologue_4:
    speaker: ingrid
    en: As you know, the surface is teeming with formidable enemies.
    ko: 알다시피 지상은 강대한 적으로 넘쳐난다.
    ja: |-
      分かっているだろう。
      地上は恐るべき脅威であふれかえっている。
  event_absolute1_prologue_5:
    speaker: ingrid
    en: Our reality as humanity is that
    ko: 그 강함을 측정할 수 없는,
    ja: 計り知ることもできない敵と…
  event_absolute1_prologue_6:
    speaker: ingrid
    en: we must endlessly face unknown foes whose strength cannot be measured.
    ko: 미지의 적을 끝도 없이 상대해야 하는 게 우리 인류의 현실이지.
    ja: |-
      いつ終わるとも知れない戦いを
      強いられているのが、我々人類の現実だ。
  event_absolute1_prologue_7:
    speaker: ingrid
    en: And yet, despite all this, do you still wish to reclaim the surface?
    ko: 그럼에도 제군은 지상을 탈환하고 싶은가.
    ja: それでも、地上の奪還を望み続けるか？
  event_absolute1_prologue_8:
    speaker: ingrid
    en: Do you intend to head up to the surface once more?
    ko: 다시 한번 지상으로 올라갈 생각인가.
    ja: もう一度、地上を目指すか？
  event_absolute1_prologue_9:
    speaker: ingrid
    en: Are you no longer afraid of failure?
    ko: 더는 실패가 두렵지 않은가.
    ja: 失敗を重ねることが怖くはないか？
  event_absolute1_prologue_10:
    speaker: eunhwa
    en: I...
    ko: "…난."
    ja: "…私は。"
  event_absolute1_prologue_11:
    speaker: "<Narration>"
    en: "*Riiiiiiiing!*"
    ko: 삐이이이------
    ja: キィィィン――
  event_absolute1_prologue_12:
    speaker: emma
    en: "... Hwa!"
    ko: "…화!"
    ja: "…ファ！"
  event_absolute1_prologue_13:
    speaker: emma
    en: Eunhwa!
    ko: 은화!
    ja: ウンファ！
  event_absolute1_prologue_14:
    speaker: eunhwa
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_absolute1_prologue_15:
    speaker: emma
    en: Eunhwa, are you awake?
    ko: 은화, 정신이 들어?
    ja: ウンファ、大丈夫？
  event_absolute1_prologue_16:
    speaker: eunhwa
    en: Wha... what just happened...?
    ko: 방금 무슨 일이….
    ja: "…っ…いったい、何が…"
  event_absolute1_prologue_17:
    speaker: "<Narration>"
    en: "*Wobble*"
    ko: 휘청-
    ja: グラッ――
  event_absolute1_prologue_18:
    speaker: eunhwa
    en: "*Cough*"
    ko: 쿨럭.
    ja: ゴホッ。
  event_absolute1_prologue_19:
    speaker: eunhwa
    en: "*Cough cough*"
    ko: 쿨럭, 쿨럭!
    ja: ゲホ、ゴホッ！
  event_absolute1_prologue_20:
    speaker: eunhwa
    en: "*Cough* System malfunction...?"
    ko: 큭. 기능 이상…?
    ja: くっ。機能に異常…？
  event_absolute1_prologue_21:
    speaker: emma
    en: Maxwell said that when the core was exposed,
    ko: 맥스웰이 그랬어.
    ja: マクスウェルが言ってたわ。
  event_absolute1_prologue_22:
    speaker: emma
    en: the Heretic's body released a highly concentrated burst of Alva Particles.
    ko: 코어가 드러난 순간, 헬레틱의 몸에서 초고농도 에블라 입자가 대량 살포됐다고.
    ja: |-
      コアが露出した瞬間、
      ヘレティックが超高濃度のエブラ粒子を
      大量にまき散らしたそうよ。
  event_absolute1_prologue_23:
    speaker: eunhwa
    en: Damn it.
    ko: 빌어먹을.
    ja: "…クソッ。"
  event_absolute1_prologue_24:
    speaker: eunhwa
    en: I thought we had her, but turns out she had something up her sleeve.
    ko: 다 잡았다고 생각했는데, 여태 이런 카드를 숨겨두고 있었나.
    ja: |-
      倒したと思わせておいて…
      切り札を残していたとはな。
  event_absolute1_prologue_25:
    speaker: eunhwa
    en: Where is she now?
    ko: 놈은 어디 있지?
    ja: 奴はどこだ？
  event_absolute1_prologue_26:
    speaker: emma
    en: Over there.
    ko: 저쪽.
    ja: あっちよ。
  event_absolute1_prologue_27:
    speaker: emma
    en: Laplace is doing her best to hold the enemy back.
    ko: 라플라스가 어떻게든 붙들어두고 있어.
    ja: ラプラスがどうにか動きを抑えているわ。
  event_absolute1_prologue_28:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャリ――
  event_absolute1_prologue_29:
    speaker: "<Narration>"
    en: Through the scope,
    ko: 스코프 너머.
    ja: ウンファは武器を構え直した
  event_absolute1_prologue_30:
    speaker: "<Narration>"
    en: Eunhwa watches Laplace take the full brunt of Indivilia's massive tail with
      her body.
    ko: 거대화한 인디빌리아가 휘두르는 꼬리를 온몸으로 받아내는 라플라스의 모습이,
    ja: |-
      スコープ越しに、
      巨大化したインディビリアの尻尾を
      全身の力で止めるラプラスの姿が見えた
  event_absolute1_prologue_31:
    speaker: "<Narration>"
    en: One of her arms is shattered, but she hurls herself forward all the same.
    ko: 팔 한쪽이 부서져, 온몸을 내던지고 있는 모습이 보였다.
    ja: |-
      ラプラスは片手を負傷している。
      すでに余裕はなさそうだ
  event_absolute1_prologue_32:
    speaker: eunhwa
    en: She won't hold out much longer.
    ko: 저래서야 얼마 버티지 못하겠군.
    ja: あれじゃそう長くはもたないな。
  event_absolute1_prologue_33:
    speaker: eunhwa
    en: Let's move. We'll support Laplace.
    ko: 가자. 라플라스를 서포트한다.
    ja: 行くぞ。ラプラスを援護する。
  event_absolute1_prologue_34:
    speaker: eunhwa
    en: Emma, unload everything you've got on Indivilia and draw her attention so
      we can close in.
    ko: 엠마, 탄을 전부 쏟아부어도 되니 우리가 접근할 수 있게 저 녀석의 시선을 끌어라.
    ja: |-
      エマ、弾切れまで撃ち続けて奴の注意を引け。
      その隙に私たちが接近する。
  event_absolute1_prologue_35:
    speaker: eunhwa
    en: Vesti, you're with me...
    ko: 베스티, 넌 나랑 같이….
    ja: ベスティー、お前は私と…
  event_absolute1_prologue_36:
    speaker: emma
    en: Vesti is unconscious.
    ko: 베스티는 의식을 잃었어.
    ja: ベスティーなら、意識が戻ってないわ。
  event_absolute1_prologue_37:
    speaker: eunhwa
    en: "... What?"
    ko: "…뭐?"
    ja: "…なに？"
  event_absolute1_prologue_38:
    speaker: emma
    en: So are Drake and Maxwell.
    ko: 드레이크랑 맥스웰도 마찬가지고.
    ja: ドレイクとマクスウェルも、同じ状況よ。
  event_absolute1_prologue_39:
    speaker: emma
    en: More importantly, Eunhwa, can you move?
    ko: 무엇보다 은화, 움직일 수 있겠어?
    ja: それにウンファも、動けるの？
  event_absolute1_prologue_40:
    speaker: eunhwa
    en: Of cour—?!
    ko: 당연…?!
    ja: とうぜ…！？
  event_absolute1_prologue_41:
    speaker: "<Narration>"
    en: Eunhwa realizes that her legs have been twisted in an unnatural direction.
    ko: 은화는 자신의 다리가 기이한 방향으로 뒤틀려 있는 것을 발견했다.
    ja: |-
      ウンファは自身の足が不自然な方向に
      曲がっていると、ようやく気が付いた
  event_absolute1_prologue_42:
    speaker: eunhwa
    en: Damnit.
    ko: "…쯧."
    ja: "…チッ。"
  event_absolute1_prologue_43:
    speaker: emma
    en: Perhaps it would be best to retreat?
    ko: 퇴각하는 게 낫겠지?
    ja: 退却した方がいいんじゃない？
  event_absolute1_prologue_44:
    speaker: eunhwa
    en: No, we won't retreat.
    ko: 아니, 퇴각은 하지 않는다.
    ja: いや、退却はしない。
  event_absolute1_prologue_45:
    speaker: eunhwa
    en: The fact that she's played her hidden card means she's cornered.
    ko: 숨겨두고 있던 카드를 꺼냈다는 건, 그만큼 놈도 궁지에 몰렸다는 거겠지.
    ja: |-
      奥の手を出してきたなら、
      奴も追い詰められているということだ。
  event_absolute1_prologue_46:
    speaker: eunhwa
    en: We'll end Indivilia right here and now.
    ko: 인디빌리아는 여기서 쓰러뜨린다.
    ja: ここで決着をつける。
  event_absolute1_prologue_47:
    speaker: emma
    en: "... Roger that."
    ko: "…라져."
    ja: "…分かったわ。"
  event_absolute1_prologue_48:
    speaker: eunhwa
    en: How much longer can we sustain this output?
    ko: 출력은 얼마나 더 끌어다 쓸 수 있지?
    ja: コアの出力はあとどれだけもつ？
  event_absolute1_prologue_49:
    speaker: emma
    en: 5 minutes. No more than that.
    ko: 5분. 그 이상은 힘들 것 같아.
    ja: 5分ね。それ以上は難しそう。
  event_absolute1_prologue_50:
    speaker: eunhwa
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_prologue_51:
    speaker: eunhwa
    en: I'll snipe the core from here.
    ko: 여기서 놈의 코어를 저격하겠다.
    ja: ここから奴のコアを狙撃する。
  event_absolute1_prologue_52:
    speaker: eunhwa
    en: Emma, join up with Laplace and lure Indivilia to face this way.
    ko: 엠마, 넌 라플라스 쪽에 합류해서 놈의 코어가 이쪽을 향하도록 유도해.
    ja: |-
      エマ、ラプラスと合流して
      奴のコアをこちらに向かせろ。
  event_absolute1_prologue_53:
    speaker: eunhwa
    en: If she gets distracted, pelt her with everything you've got.
    ko: 딴 데 한눈팔 것 같으면, 화력을 퍼붓고.
    ja: 無視されるなら、火力で注意を引け。
  event_absolute1_prologue_54:
    speaker: eunhwa
    en: If she shows signs of running, rile her up and hold her there at all costs.
    ko: 도망칠 기색이 보이면, 속을 긁어서라도 붙들어.
    ja: 逃げそうなら、挑発してでも引き留めろ。
  event_absolute1_prologue_55:
    speaker: eunhwa
    en: She's got a lot of pride, so provoking her should do the trick.
    ko: 자존심 센 놈이니, 도발엔 금방 넘어올 거다.
    ja: 奴はプライドが高い。焚きつければ乗る。
  event_absolute1_prologue_56:
    speaker: eunhwa
    en: Do you think you can do it?
    ko: 가능하겠어?
    ja: できるか？
  event_absolute1_prologue_57:
    speaker: emma
    en: I'll do my best.
    ko: 어떻게든 해볼게.
    ja: 何とかやってみるわ。
  event_absolute1_prologue_58:
    speaker: eunhwa
    en: Good. It's time we bag this Heretic for good.
    ko: 좋아. 그럼, 사냥을 이어가지.
    ja: ああ…狩りを続けるぞ。
  event_absolute1_prologue_59:
    speaker: "<Narration>"
    en: Emma runs toward Laplace and Indivilia.
    ko: 엠마가 라플라스와 인디빌리아를 향해 떠나갔다.
    ja: |-
      その言葉を合図に、
      エマが戦うラプラスたちの方へ駆け出した
  event_absolute1_prologue_60:
    speaker: "<Narration>"
    en: Eunhwa presses her eye against the scope.
    ko: 은화는 스코프에 눈을 가져다 댔다.
    ja: ウンファはスコープに目を当てた
  event_absolute1_prologue_61:
    speaker: eunhwa
    en: "*Cough*"
    ko: "…쿨럭."
    ja: "…ゲホッ。"
  event_absolute1_prologue_62:
    speaker: "<Narration>"
    en: Ignoring the steadily weakening output of her core, Eunhwa continues to look
      through the scope.
    ko: 은화는 점점 떨어지는 코어의 출력을 애써 무시한 채, 스코프만을 노려보았다.
    ja: |-
      コアの出力が徐々に低下している。
      しかしウンファは気にも留めず、
      スコープをのぞき続けた
  event_absolute1_prologue_63:
    speaker: "<Narration>"
    en: As planned, Emma succeeds in drawing Indivilia's attention.
    ko: 작전대로 엠마는 인디빌리아의 시선을 끄는 데 성공한 모습이 보였다.
    ja: |-
      作戦通り、エマがインディビリアの
      注意を引いているようだ
  event_absolute1_prologue_64:
    speaker: eunhwa
    en: Good... huh?
    ko: 좋았… 어?
    ja: 狙い通り…か？
  event_absolute1_prologue_65:
    speaker: "<Narration>"
    en: However...
    ko: 그러나.
    ja: だが、次の瞬間
  event_absolute1_prologue_66:
    speaker: "<Narration>"
    en: "*Whoooooosh*"
    ko: 슈우우우우---
    ja: シュウウウ――
  event_absolute1_prologue_67:
    speaker: "<Narration>"
    en: Indivilia begins releasing an even thicker cloud of Alva Particles.
    ko: 인디빌리아가 더 짙은 농도의 에블라 입자를 뿜어내기 시작했다.
    ja: |-
      インディビリアの体から、
      さらに高濃度のエブラ粒子が放出され始めた
  event_absolute1_prologue_68:
    speaker: eunhwa
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_prologue_69:
    speaker: "<Narration>"
    en: Laplace collapses,
    ko: 라플라스가 쓰러지고,
    ja: ラプラスが倒れた
  event_absolute1_prologue_70:
    speaker: "<Narration>"
    en: and behind her...
    ko: 그 뒤로 엠마가….
    ja: そしてエマも…
  event_absolute1_prologue_71:
    speaker: emma
    en: Eunhwa, fall back...!
    ko: 은화, 퇴각… 해…!
    ja: ウン、ファ…！退却…して…！
  event_absolute1_prologue_72:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩-
    ja: ドサッ
  event_absolute1_prologue_73:
    speaker: "<Narration>"
    en: Emma falls to the ground as well.
    ko: 쓰러져 내렸다.
    ja: 間を置かず倒れた
  event_absolute1_prologue_74:
    speaker: eunhwa
    en: Emma!
    ko: 엠마!!
    ja: エマ！！
  event_absolute1_prologue_75:
    speaker: "<Narration>"
    en: Indivilia raises her massive tail toward Emma.
    ko: 인디빌리아가 엠마를 향해 거대한 꼬리를 들어 올리는 모습이 보였다.
    ja: |-
      インディビリアがエマに向かって
      巨大な尻尾を振り上げた
  event_absolute1_prologue_76:
    speaker: eunhwa
    en: Hrngh!
    ko: 큭…!!
    ja: くっ…！！
  event_absolute1_prologue_77:
    speaker: "<Narration>"
    en: Just as Indivilia swings her tail,
    ko: 인디빌리아가 꼬리를 휘두르려는 순간.
    ja: インディビリアが尻尾を振り下ろす瞬間…
  event_absolute1_prologue_78:
    speaker: "<Narration>"
    en: Eunhwa, who is on the verge of blacking out, pulls the trigger.
    ko: 정신을 잃기 직전의 은화가 방아쇠를 당기려는 순간.
    ja: |-
      そして、気を失いかけているウンファが
      引き金を引こうとした瞬間――
  event_absolute1_prologue_79:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 우르릉-
    ja: ゴロゴロ…
  event_absolute1_prologue_80:
    speaker: "<Narration>"
    en: A blinding flash fills the scope.
    ko: 눈부신 섬광이 스코프를 가득 메웠다.
    ja: まばゆい閃光が、スコープの中の視界を覆った
  event_absolute1_prologue_81:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 쾅-!
    ja: ドカン！
  event_absolute1_prologue_82:
    speaker: "<Narration>"
    en: And when the light fades...
    ko: 그리고 빛이 사라졌을 땐….
    ja: やがて光が収まると…
  event_absolute1_prologue_83:
    speaker: "<Narration>"
    en: Vesti comes into view, but half of her body has been blown away.
    ko: "…몸의 절반이 날아간 베스티가 담겨 있었다."
    ja: |-
      …体の半分が吹き飛んだ
      ベスティーが目に映った
  event_absolute1_prologue_84:
    speaker: vesti
    en: Comm... ander... Sorry... I couldn't... win...
    ko: |-
      지휘… 관… 님….
      미안… 못… 이겼… 어….
    ja: |-
      指揮官…様…
      ごめん…勝て…なかった…
  event_absolute1_prologue_85:
    speaker: vesti
    en: Pl... ease...
    ko: 부탁… 해….
    ja: お願…い…
  event_absolute1_prologue_86:
    speaker: emma
    en: "... Vesti?"
    ko: "……베스티?"
    ja: "……ベスティー？"
  event_absolute1_prologue_87:
    speaker: eunhwa
    en: Hnrgh!
    ko: 크읏…!
    ja: くっ…！
  event_absolute1_prologue_88:
    speaker: "<Narration>"
    en: "*Bang bang!*"
    ko: 타앙-! 타앙-!
    ja: バン！バンッ！
  event_absolute1_prologue_89:
    speaker: "<Narration>"
    en: Eunhwa continues to unleash a barrage of long-distance shots,
    ko: 베히모스가 집어던진 거대한 수정 덩어리가 날아올 때까지,
    ja: |-
      ベヒモスの投げた巨大なクリスタルの塊が
      眼前に迫る瞬間まで…
  event_absolute1_prologue_90:
    speaker: "<Narration>"
    en: even as Behemoth hurls a giant chunk of crystal at her.
    ko: 은화의 저격은 계속 이어졌다.
    ja: ウンファは狙撃を続けた
  event_absolute1_prologue_91:
    speaker: "<Narration>"
    en: "*Bang bang!*"
    ko: 타앙-! 타앙-!
    ja: バン！バンッ！
  event_absolute1_prologue_92:
    speaker: "<Narration>"
    en: Even though she knows her position will be revealed, Eunhwa never stops firing.
    ko: 위치가 노출될 걸 알면서도, 은화는 저격을 멈추지 않았다.
    ja: |-
      自身の位置が露呈することは理解している。
      それでもウンファは狙撃をやめなかった
  event_absolute1_prologue_93:
    speaker: eunhwa
    en: You stay here.
    ko: 넌 여기 있어라.
    ja: お前は残れ。
  event_absolute1_prologue_94:
    speaker: vesti
    en: What? Why?
    ko: 어? 왜….
    ja: え？どうして…
  event_absolute1_prologue_95:
    speaker: eunhwa
    en: Put a bullet through that freak's head for me.
    ko: 그 괴물 자식에게 한 방 먹여.
    ja: あのバケモノに一発食らわせてやれ。
  event_absolute1_prologue_96:
    speaker: eunhwa
    en: Show her who the real monster is.
    ko: 누가 더 괴물인지 보여주라고.
    ja: どっちが本当のバケモノか見せてやるんだ。
  event_absolute1_prologue_97:
    speaker: vesti
    en: Y-yes! Got it!
    ko: 으, 응! 알겠어!
    ja: う、うん！分かった！
  event_absolute1_prologue_98:
    speaker: "<Narration>"
    en: "*Bang bang!*"
    ko: 타앙-! 타앙-!
    ja: バン！バンッ！
  event_absolute1_prologue_99:
    speaker: "<Narration>"
    en: As the crystal cluster swallows Eunhwa,
    ko: 수정 덩어리에 삼켜지는 순간.
    ja: クリスタルの塊に視界が全て飲みこまれるまで
  event_absolute1_prologue_100:
    speaker: "<Narration>"
    en: her gaze remains fixed on Vesti.
    ko: 은화의 눈엔 여전히 베스티가 담겨 있었다.
    ja: ウンファの視界に、ベスティーが浮かんだ
  event_absolute1_prologue_101:
    speaker: "<Narration>"
    en: And then, Vesti opens her mouth.
    ko: 베스티가 입을 연다.
    ja: そのベスティーが口を開いた
  event_absolute1_prologue_102:
    speaker: vesti
    en: Eun... hwa.
    ko: 은… 화.
    ja: ウン…ファ。
  event_absolute1_prologue_103:
    speaker: eunhwa
    en: "*Cough!*"
    ko: 큿…!
    ja: くっ…！
  event_absolute1_prologue_104:
    speaker: vesti
    en: I'm... sorry.
    ko: 미안… 해.
    ja: ごめん…ね…
  event_absolute1_prologue_105:
    speaker: eunhwa
    en: No, Ves...!
    ko: 아니야, 베스…!
    ja: ベスティ、待っ…！
  event_absolute1_prologue_106:
    speaker: vesti
    en: Huh? Did you call me?
    ko: 응? 나 불렀어?
    ja: え？い、今、私のこと呼んだ？
  event_absolute1_prologue_107:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_prologue_108:
    speaker: eunhwa_t
    en: "*Gasp!*"
    ko: 헉!
    ja: "…はっ！"
  event_absolute1_prologue_109:
    speaker: vesti_t
    en: Eu-Eunhwa! Are you okay?
    ko: 으, 은화! 괜찮아?
    ja: ウ、ウンファ！大丈夫？
  event_absolute1_prologue_110:
    speaker: emma_t
    en: Oh my, look at all this sweat...
    ko: 어머, 이 식은땀 좀 봐…!
    ja: まあ、すごい汗…！
  event_absolute1_prologue_111:
    speaker: emma_t
    en: Were you having a nightmare?
    ko: 악몽이라도 꾼 거야?
    ja: どうしたの～？悪い夢でも見たの？
  event_absolute1_prologue_112:
    speaker: eunhwa_t
    en: A nightmare...?
    ko: 악몽… 이라고?
    ja: 悪い…夢…だと？
  event_absolute1_prologue_113:
    speaker: "<Narration>"
    en: Eunhwa looks around.
    ko: 은화가 주위를 두리번거렸다.
    ja: 起き上がったウンファが周囲を確かめた
  event_absolute1_prologue_114:
    speaker: "<Narration>"
    en: She sees the inside of the transport aircraft.
    ko: 수송기 내부의 모습이 보였다.
    ja: 輸送機の内装だ
  event_absolute1_prologue_115:
    speaker: eunhwa_t
    en: I guess I must have fallen asleep.
    ko: 나, 잠들었나 보네.
    ja: "…眠っていたのか。"
  event_absolute1_prologue_116:
    speaker: emma_t
    en: Yeah. You looked awfully tired, so I didn't wake you.
    ko: 응. 많이 피곤해보여서 안 깨웠어.
    ja: |-
      そうよ～？すごく疲れてるみたいだったから、
      起こさずにそっとしておいたの。
  event_absolute1_prologue_117:
    speaker: emma_t
    en: After we got back from the Crystal Region, we were sent straight out again
      without even a break.
    ko: 수정 지역에 다녀온 이후로 쉬지도 못하고 바로 임무 하러 온 데다가,
    ja: |-
      クリスタル地帯から戻ってすぐで
      たて続けの任務だし…
  event_absolute1_prologue_118:
    speaker: emma_t
    en: Since this is already our third mission in a row, I just wanted to let you
      get some rest.
    ko: 임무를 세 개나 받았으니까, 좀 쉬게 해주고 싶었거든.
    ja: 同時に3件だもの。少しは休まなくちゃ。
  event_absolute1_prologue_119:
    speaker: eunhwa_t
    en: "... Yeah, that's right."
    ko: "…그래. 그랬었지."
    ja: "…ああ。そうだったな。"
  event_absolute1_prologue_120:
    speaker: vesti_t
    en: Eu-Eunhwa!
    ko: 으, 은화!
    ja: ウ、ウンファ！
  event_absolute1_prologue_121:
    speaker: vesti_t
    en: For this mission, should I head down first?
    ko: 이, 이번 임무 지역은 내가 먼저 내려갈까?
    ja: つ、次の作戦、私が先に降りてもいい？
  event_absolute1_prologue_122:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: 何だと？
  event_absolute1_prologue_123:
    speaker: vesti_t
    en: S-since you're not in the best shape,
    ko: 으, 은화 컨디션 안 좋아 보이니까,
    ja: だ、だってウンファ、具合が悪そうだし…
  event_absolute1_prologue_124:
    speaker: vesti_t
    en: I'll go ahead first and take care of everything.
    ko: 내가 먼저 가서 다 정리하고 있을게.
    ja: |-
      なら私が、先に行って
      片付けておけばいいかなって。
  event_absolute1_prologue_125:
    speaker: vesti_t
    en: You and Emma can come down slowly afterward.
    ko: 은화랑 엠마는 천천히 내려와.
    ja: ウンファとエマは、後からゆっくり来て。
  event_absolute1_prologue_126:
    speaker: emma_t
    en: Oh my, our little Vesti has become so dependable!
    ko: 어머나~ 우리 베스티, 많이 듬직해졌네~
    ja: |-
      あら～ベスティーったら、
      ずいぶん頼もしくなったわね～
  event_absolute1_prologue_127:
    speaker: eunhwa_t
    en: You'll go down first?
    ko: 먼저 내려가겠다고…?
    ja: お前が…先に…？
  event_absolute1_prologue_128:
    speaker: vesti_t
    en: S-sure! ... If you'll let me.
    ko: 으, 응! 그래도… 될까?
    ja: う、うん！どうかな…？
  event_absolute1_prologue_129:
    speaker: signal_op
    en: Everyone! We've arrived at the first mission site!
    ko: 여러분! 첫 번째 임무 지역에 도착했어요!
    ja: みなさん！1つめの作戦領域に到着しました！
  event_absolute1_prologue_130:
    speaker: signal_op
    en: Shall we move out right away?
    ko: 바로 투입하시겠어요?
    ja: 今すぐ降下しますか？
  event_absolute1_prologue_131:
    speaker: eunhwa_t
    en: Sure.
    ko: 그래.
    ja: ああ。
  event_absolute1_prologue_132:
    speaker: vesti_t
    en: R-really? I can go?
    ko: "저, 정말? \n알겠어. 나 먼저 가서 싹 다 정리하고 있을게!"
    ja: も、もう行くの？わ、分かった！
  event_absolute1_prologue_133:
    speaker: vesti_t
    en: Hehe, okay! I'll go clean things up for you guys!
    ko: 헤, 헤헤. 그럼 나 먼저 간…!
    ja: えへ、えへへ。じゃあ、先に行って…！
  event_absolute1_prologue_134:
    speaker: eunhwa_t
    en: No, you stay right here.
    ko: 아니. 가지 마.
    ja: いや、止めろ。
  event_absolute1_prologue_135:
    speaker: vesti_t
    en: H-huh? Stay here?
    ko: "으, 응? \n가, 가지 마?"
    ja: |-
      え、ええ？
      ダ、ダメ…？
  event_absolute1_prologue_136:
    speaker: eunhwa_t
    en: I'll go first.
    ko: "…내가 먼저 간다."
    ja: "…私が先に行く。"
  event_absolute1_prologue_137:
    speaker: emma_t
    en: Wait, you're going first?!
    ko: 은화가 먼저 간다고?
    ja: 大丈夫なの？
  event_absolute1_prologue_138:
    speaker: "<Narration>"
    en: "*Slide*"
    ko: 드르륵-
    ja: ガラッ――
  event_absolute1_prologue_139:
    speaker: "<Narration>"
    en: Eunhwa opens the transit aircraft's door.
    ko: 은화는 수송기의 문을 열고,
    ja: ウンファが輸送機の扉を開いた
  event_absolute1_prologue_140:
    speaker: eunhwa_t
    en: You heard me. I'm going in.
    ko: 간다.
    ja: 行ってくる。
  event_absolute1_prologue_141:
    speaker: vesti_t
    en: B-but Eunhwa...!
    ko: 으, 은화!
    ja: ウ、ウンファ！
  event_absolute1_prologue_142:
    speaker: "<Narration>"
    en: As if trying to shake off the lingering nightmare,
    ko: 뒤쫓아 오는 악몽을 떨쳐내려는 듯,
    ja: そして、追い立てる悪夢を振り払うかのように…
  event_absolute1_prologue_143:
    speaker: "<Narration>"
    en: Eunhwa hurls herself toward the mission site.
    ko: 임무 지역을 향해 몸을 던졌다.
    ja: 戦場の中へ飛び込んだ
event_absolute1_01_s:
  event_absolute1_01_s_1:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute1_01_s_2:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 펑-!
    ja: パンッ！
  event_absolute1_01_s_3:
    speaker: soldiereg
    en: Falcon! What the hell are you standing there dazing for?!
    ko: 팔콘! 거기 멍하니 서서 뭐 해!
    ja: ファルコン！何をぼーっとしてるの！？
  event_absolute1_01_s_4:
    speaker: soldiereg
    en: Owl's a lost cause! Give it up already!
    ko: 오울은 글렀으니 이만 포기해!
    ja: オウルはもう助からない、諦めて！
  event_absolute1_01_s_5:
    speaker: soldierfa
    en: No... no...
    ko: 아… 아아….
    ja: あ…ああ…
  event_absolute1_01_s_6:
    speaker: soldiereg
    en: Falcon!
    ko: 팔콘!
    ja: ファルコン！
  event_absolute1_01_s_7:
    speaker: soldierfa
    en: Ahhh...
    ko: 아아아….
    ja: あああっ…
  event_absolute1_01_s_8:
    speaker: soldiereg
    en: "*Sigh* At this rate..."
    ko: 하, 이래서야….
    ja: ああ、もう…
  event_absolute1_01_s_9:
    speaker: soldiereg
    en: Awaiting your next order, Commander.
    ko: 지휘관, 다음 지시를 내려주시겠습니까.
    ja: 指揮官、次の指示をお願いします。
  event_absolute1_01_s_10:
    speaker: scarecommander
    en: Order...?
    ko: 지시…?
    ja: 指示…？
  event_absolute1_01_s_11:
    speaker: scarecommander
    en: There... there's no point...
    ko: 그런 건 의미 없잖아….
    ja: そんなことして、何か意味があるのか…？
  event_absolute1_01_s_12:
    speaker: soldiereg
    en: Sorry?
    ko: 예?
    ja: "…はい？"
  event_absolute1_01_s_13:
    speaker: scarecommander
    en: Squad 65-04B... and Squad 71-12A...
    ko: 65-04B 스쿼드도… 71-12A 스쿼드도….
    ja: 65-04B部隊も…71-12Aも…
  event_absolute1_01_s_14:
    speaker: scarecommander
    en: They're... they're all wiped out...
    ko: 전부… 전부 전멸했어….
    ja: ぜんぶ…やられちまった…
  event_absolute1_01_s_15:
    speaker: scarecommander
    en: I was told this was supposed to be a simple resource-gathering mission...
    ko: 단순한 자원 채취 임무라고 해서 나선 건데….
    ja: ただの資源回収だって聞いてたのに…
  event_absolute1_01_s_16:
    speaker: scarecommander
    en: Why are those monsters even here?
    ko: 왜 그런 괴물이 있는 거야….
    ja: 何でこんな、バケモノがいるんだよ…
  event_absolute1_01_s_17:
    speaker: scarecommander
    en: We should've run from the start...
    ko: 처음부터 도망가야 했어….
    ja: やっぱり逃げるべきだったんだ…
  event_absolute1_01_s_18:
    speaker: scarecommander
    en: If that idiot hadn't insisted on fighting alongside us...
    ko: 그 멍청한 놈이 자기 스쿼드랑 함께 맞서 싸우자고 하지만 않았어도….
    ja: |-
      あいつが、協力して戦おうなんて
      言ってこなけりゃ…
  event_absolute1_01_s_19:
    speaker: scarecommander
    en: What could we possibly do on our own?
    ko: 우리 힘으로 뭘 할 수 있다고….
    ja: こんな…こんなことには…
  event_absolute1_01_s_20:
    speaker: scarecommander
    en: Ha... haha... we're all going to die...
    ko: 하, 하하… 우린 다 죽을 거야….
    ja: |-
      は、はは…みんな死ぬ…
      みんな死んじまう…
  event_absolute1_01_s_21:
    speaker: soldiereg
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_01_s_22:
    speaker: soldiereg
    en: Our priority is to protect the Commander and fall back to the rendezvous point.
    ko: 지휘관을 보호하며 랑데부 포인트까지 퇴각하는 걸 우선시하겠습니다.
    ja: |-
      ただいまより指揮官を護衛し、
      ランデブーポイントまで
      退却することを最優先任務とします。
  event_absolute1_01_s_23:
    speaker: soldiereg
    en: Falcon, let's move.
    ko: 팔콘, 이동하자.
    ja: ファルコン、行くよ。
  event_absolute1_01_s_24:
    speaker: soldierfa
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_absolute1_01_s_25:
    speaker: "<Narration>"
    en: At that moment, Falcon suddenly snaps out of her trance and dashes forward.
    ko: 그때, 멍하니 서 있던 팔콘이 앞으로 뛰어나갔다.
    ja: |-
      無防備に立っていたファルコンが
      突然動き出した
  event_absolute1_01_s_26:
    speaker: soldiereg
    en: Falcon! Stop! Where are you going?!
    ko: 잠깐, 팔콘! 너 어딜…?
    ja: |-
      ちょ、ファルコン！？
      どこへ…？
  event_absolute1_01_s_27:
    speaker: "<Narration>"
    en: Falcon runs toward where Owl stands slumped.
    ko: 팔콘이 뛰어가는 방향엔 오울이 축 처진 채 서 있었다.
    ja: |-
      ファルコンが向かった先に視線を向けると、
      オウルが力なく立っていた
  event_absolute1_01_s_28:
    speaker: soldiereg
    en: Owl...?
    ko: 오울…?
    ja: オウル…？
  event_absolute1_01_s_29:
    speaker: soldiereg
    en: I thought you'd been taken out earlier...
    ko: 아까 당한 게 아니었구나….
    ja: よかった、やられてなかったんだ…！
  event_absolute1_01_s_30:
    speaker: soldiereg
    en: Commander, requesting a change in objective.
    ko: 지휘관, 우선순위를 변경하겠습니다.
    ja: |-
      …指揮官、一時的な作戦保留の
      許可をお願いします。
  event_absolute1_01_s_31:
    speaker: soldiereg
    en: We will first regroup with Owl, then retreat together.
    ko: 오울과 합류. 이후, 함께 퇴각하는 방침으로 변경하고자 하는데.
    ja: まずオウルと合流したのち、退却します。
  event_absolute1_01_s_32:
    speaker: soldiereg
    en: Would that be acceptable?
    ko: 그걸로 괜찮겠습니까?
    ja: よろしいでしょうか？
  event_absolute1_01_s_33:
    speaker: scarecommander
    en: "... Do as you wish."
    ko: "……맘대로 해."
    ja: "…好きにしろ。"
  event_absolute1_01_s_34:
    speaker: soldiereg
    en: Thank you.
    ko: 감사합니다.
    ja: ありがとうございます。
  event_absolute1_01_s_35:
    speaker: "<Narration>"
    en: Eagle follows behind Falcon.
    ko: 이글은 팔콘의 뒤를 따라갔다.
    ja: イーグルはファルコンの後を追った
  event_absolute1_01_s_36:
    speaker: "<Narration>"
    en: Strangely, their distance to Owl doesn't get any closer.
    ko: 이상하게도 오울과의 거리는 좁혀지지 않았다.
    ja: だが奇妙なことに、オウルとの距離が縮まらない
  event_absolute1_01_s_37:
    speaker: "<Narration>"
    en: After moving for a long time,
    ko: 한참을 이동하고 나서야 이글은 깨달았다.
    ja: しばらく経って、イーグルはようやく気づいた
  event_absolute1_01_s_38:
    speaker: "<Narration>"
    en: Eagle realizes they've been going in circles.
    ko: 그들이 같은 장소를 빙빙 돌고 있었다는걸.
    ja: 自分たちが同じ場所を回り続けていることに
  event_absolute1_01_s_39:
    speaker: soldiereg
    en: Something isn't right...
    ko: 뭔가 이상한데…?
    ja: "…？何かがおかしい…"
  event_absolute1_01_s_40:
    speaker: soldiereg
    en: No!
    ko: 설마…!
    ja: まさか…！
  event_absolute1_01_s_41:
    speaker: soldiereg
    en: Falcon, st...!
    ko: 팔콘, 멈…!
    ja: ファルコン、そこを動か…！
  event_absolute1_01_s_42:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 탕-!
    ja: バン――
  event_absolute1_01_s_43:
    speaker: "<Narration>"
    en: A single gunshot rings out.
    ko: 한 발의 총성이 울려 퍼지고,
    ja: 一発の銃声が響いた
  event_absolute1_01_s_44:
    speaker: soldierfa
    en: O-Owl...?
    ko: 오, 울…?
    ja: オ、ウル…？
  event_absolute1_01_s_45:
    speaker: "<Narration>"
    en: Owl collapses forward.
    ko: 오울은 그대로 앞으로 고꾸라졌다.
    ja: オウルはそのまま、前のめりに倒れこんだ
  event_absolute1_01_s_46:
    speaker: eunhwa_t
    en: Clean shot.
    ko: 클리어.
    ja: クリア。
  event_absolute1_01_s_47:
    speaker: signal_op
    en: I'm detecting a high-class energy up ahead!
    ko: 전방에 하이 클래스 에너지 반응이 있어요.
    ja: 前方に高エネルギー反応を確認！
  event_absolute1_01_s_48:
    speaker: emma_t
    en: Hmm... I wonder if I can figure out what it is this time?
    ko: 음~ 이번에는 무슨 개체인지 확인할 수 있을까~?
    ja: あら、どんな個体か分かるかしら～？
  event_absolute1_01_s_49:
    speaker: signal_op
    en: 'Let''s see... It''s Codename: Black Smith!'
    ko: 음… 코드 네임 [블랙스미스]로 확인돼요.
    ja: えっと…コードネーム「ブラックスミス」です！
  event_absolute1_01_s_50:
    speaker: emma_t
    en: Ooh, lovely!
    ko: 음~ 좋아.
    ja: ええ、分かったわ～
  event_absolute1_01_s_51:
    speaker: emma_t
    en: Looks like Black Smith is our third target this week.
    ko: 이번 주 세 번째 타깃은 블랙 스미스가 됐네~
    ja: |-
      今週の3つ目のターゲットは
      ブラックスミスで決まりね～
  event_absolute1_01_s_52:
    speaker: vesti_t
    en: Hehe. Shouldn't be too difficult.
    ko: 헤헤. 어렵진 않겠네.
    ja: へへ、楽勝そうだね。
  event_absolute1_01_s_53:
    speaker: eunhwa_t
    en: Tsk, don't let your guard down.
    ko: 쯧. 방심하지 마.
    ja: チッ。油断するな。
  event_absolute1_01_s_54:
    speaker: vesti_t
    en: S-sorry...
    ko: 미, 미안….
    ja: ご、ごめん…
  event_absolute1_01_s_55:
    speaker: emma_t
    en: So, what do you think? Shall we move out now?
    ko: 그래서 어떻게 할래? 지금 바로 갈까?
    ja: |-
      さてと、どうしましょうか？
      今すぐ行っちゃう？
  event_absolute1_01_s_56:
    speaker: eunhwa_t
    en: Yes. Let's engage.
    ko: 응전한다.
    ja: ああ。応戦するぞ。
  event_absolute1_01_s_57:
    speaker: vesti_t
    en: O-okay!
    ko: 으, 응!
    ja: う、うん！
  event_absolute1_01_s_58:
    speaker: emma_t
    en: Roger.
    ko: 라져~
    ja: 了解～
  event_absolute1_01_s_59:
    speaker: "<Narration>"
    en: The transport aircraft emerges in the sky.
    ko: 곧 허공에 수송기가 모습을 드러냈다.
    ja: ほどなく輸送機がその場の上空にたどりついた
  event_absolute1_01_s_60:
    speaker: "<Narration>"
    en: And then...
    ko: 그리고….
    ja: そして…
  event_absolute1_01_s_61:
    speaker: "<Narration>"
    en: "*Thud!* *Thud!* *Thud!*"
    ko: 쿵! 쿵! 쿵!
    ja: ドン！ドン！ドン！
  event_absolute1_01_s_62:
    speaker: "<Narration>"
    en: Three Nikkes land on the ground.
    ko: 니케 셋이 지상에 내려왔다.
    ja: 3つの人影が地上に降り立った
  event_absolute1_01_s_63:
    speaker: soldiereg
    en: It's Absolute!
    ko: "…앱솔루트."
    ja: あれは…アブソルート…！
  event_absolute1_01_s_64:
    speaker: scarecommander
    en: We're saved...
    ko: 살았다….
    ja: た、助かった…
  event_absolute1_01_s_65:
    speaker: scarecommander
    en: Haha... We're going to make it!
    ko: 살았어… 이제 살았다고…!
    ja: はは…これで死なずに…！
  event_absolute1_01_s_66:
    speaker: eunhwa_t
    en: Shut up.
    ko: 시끄러워.
    ja: うるさいぞ。
  event_absolute1_01_s_67:
    speaker: eunhwa_t
    en: You're a spineless wretch who can't even manage a single Nikke under your
      command.
    ko: 휘하의 니케 하나 챙기지 못하는 삼류 주제에.
    ja: 自分の部下もろくに守れない三流が。
  event_absolute1_01_s_68:
    speaker: eunhwa_t
    en: Move aside, and stay out of the way.
    ko: 방해하지 말고, 꺼져 있어.
    ja: 邪魔をするな、どこかに隠れていろ。
  event_absolute1_01_s_69:
    speaker: scarecommander
    en: Wh-what did you just say...?
    ko: 지, 지금 뭐라고…?
    ja: え、ど、どこに行けば…？
  event_absolute1_01_s_70:
    speaker: eunhwa_t
    en: "... Tch."
    ko: "…쯧."
    ja: "…チッ。"
  event_absolute1_01_s_71:
    speaker: eunhwa_t
    en: Emma, cover that loser so he doesn't get caught in the crossfire.
    ko: 엠마, 저 삼류 놈이 휩쓸리지 않게 엄호해라.
    ja: エマ、この三流を安全な場所まで案内してやれ。
  event_absolute1_01_s_72:
    speaker: emma_t
    en: Hehe, well, you heard the lady.
    ko: 후후. 우리 리더 말 들었지?
    ja: ふふ、そういうことだから～
  event_absolute1_01_s_73:
    speaker: emma_t
    en: It's dangerous over there, so could you come this way, please?
    ko: 거긴 위험하니까 이쪽으로 올래?
    ja: ついてきてもらえるかしら？
  event_absolute1_01_s_74:
    speaker: eunhwa_t
    en: Vesti, I'll draw the tentacles and missiles.
    ko: 베스티, 촉수와 기뢰형 미사일은 내 쪽으로 유도한다.
    ja: |-
      ベスティー、
      触手とミサイルは私が引きつける。
  event_absolute1_01_s_75:
    speaker: vesti_t
    en: Huh? Y-you'll draw its attention? Again?
    ko: 어, 어? 으, 은화가? 이번에도?
    ja: え、えっ？ウ、ウンファが？また？
  event_absolute1_01_s_76:
    speaker: vesti_t
    en: Like last time... I think it's better if I do that...
    ko: 지난번도 그렇고… 그냥… 이런 건 내가 하는 게….
    ja: |-
      この前もそうだったし…
      それくらいなら私でも…
  event_absolute1_01_s_77:
    speaker: eunhwa_t
    en: You just focus on launching your own missiles.
    ko: 넌 미사일을 쏟아붓는 데에만 집중해.
    ja: お前はミサイルを撃つことだけに集中しろ。
  event_absolute1_01_s_78:
    speaker: vesti_t
    en: Uh... O-okay, got it!
    ko: 어… 으, 응! 알겠어.
    ja: うぅ…わ、分かった！
  event_absolute1_01_s_79:
    speaker: eunhwa_t
    en: Don't go full scorched earth.
    ko: 너무 망가뜨리진 마.
    ja: ただし、壊しすぎないようにしておけ。
  event_absolute1_01_s_80:
    speaker: eunhwa_t
    en: There might still be survivors in the area.
    ko: 내부에 생존자가 있을 수도 있으니.
    ja: |-
      捕らえられた奴がまだ
      生きているかもしれないからな。
  event_absolute1_01_s_81:
    speaker: vesti_t
    en: Th-then I can't go all out...
    ko: 그, 그럼 전력을 다하면 안 되겠네….
    ja: じゃ、じゃあ、全力は出しちゃダメだね…
  event_absolute1_01_s_82:
    speaker: vesti_t
    en: Okay, got it. I'll try to tone it down a bit.
    ko: 알겠어. 한 번 조절해 볼게.
    ja: 分かった。調節しながらやってみるね。
  event_absolute1_01_s_83:
    speaker: eunhwa_t
    en: Good.
    ko: 그래.
    ja: ああ。
  event_absolute1_01_s_84:
    speaker: eunhwa_t
    en: Signal, support me.
    ko: 시그널, 서포트는 부탁하지.
    ja: シグナル、サポートを頼む。
  event_absolute1_01_s_85:
    speaker: signal_op
    en: I-I'll do my best!
    ko: 여, 열심히 할게요!
    ja: が、頑張ります！
  event_absolute1_01_s_86:
    speaker: eunhwa_t
    en: Absolute, commencing combat.
    ko: 앱솔루트, 현 시간부로 전투에 돌입한다.
    ja: |-
      アブソルート、
      現時刻より交戦開始。
  event_absolute1_01_s_87:
    speaker: eunhwa_t
    en: 'Target is Tyrant 003: Black Smith.'
    ko: 목표는 타일런트 모델 003 블랙스미스.
    ja: |-
      目標はタイラントモデル003、
      ブラックスミス。
  event_absolute1_01_s_88:
    speaker: eunhwa_t
    en: Let's make this quick.
    ko: 빠르게 처리하자.
    ja: 手早く片付けるぞ。
  event_absolute1_01_s_89:
    speaker: eunhwa_t
    en: Encounter.
    ko: 인카운터.
    ja: エンカウンター。
event_absolute1_01_e:
  event_absolute1_01_e_1:
    speaker: signal_op
    en: A-all clear.
    ko: 사, 상황 종료.
    ja: じょ、状況終了。
  event_absolute1_01_e_2:
    speaker: signal_op
    en: Black Smith down.
    ko: 블랙스미스, 침묵 확인됐어요.
    ja: ブラックスミス、沈黙を確認しました。
  event_absolute1_01_e_3:
    speaker: eunhwa_t
    en: And the combat data?
    ko: 교전 데이터는?
    ja: 交戦データは？
  event_absolute1_01_e_4:
    speaker: signal_op
    en: I've secured it for now, but...
    ko: 일단 확보는 해 뒀는데요.
    ja: い、一応確保はしてありますが…
  event_absolute1_01_e_5:
    speaker: signal_op
    en: I'm not sure if data from such a short battle will be of any use...
    ko: 이렇게 빨리 끝난 교전의 데이터가 의미 있을지는….
    ja: |-
      でもこんなに短いデータじゃ、
      あまり参考には…
  event_absolute1_01_e_6:
    speaker: eunhwa_t
    en: Doesn't matter. Just send it to Ingrid.
    ko: 상관없으니, 잉그리드한테 전송해.
    ja: 関係ない。イングリッドに転送しろ。
  event_absolute1_01_e_7:
    speaker: eunhwa_t
    en: Emma, Vesti, confirm if there are any survivors, then return...
    ko: 엠마, 베스티. 생존자를 확인하는 대로 복귀한….
    ja: |-
      エマ、ベスティー。
      生存者の確認が終わり次第、撤収の…
  event_absolute1_01_e_8:
    speaker: scarecommander
    en: W-wait...
    ko: 자, 잠깐….
    ja: ちょ、ちょっと待ってくれ。
  event_absolute1_01_e_9:
    speaker: eunhwa_t
    en: What?
    ko: 뭐.
    ja: 何だ。
  event_absolute1_01_e_10:
    speaker: scarecommander
    en: I...
    ko: 그게….
    ja: その…
  event_absolute1_01_e_11:
    speaker: scarecommander
    en: Er...
    ko: 그러니까….
    ja: ええと…
  event_absolute1_01_e_12:
    speaker: eunhwa_t
    en: "... Tsk."
    ko: "…하아."
    ja: "…はぁ。"
  event_absolute1_01_e_13:
    speaker: eunhwa_t
    en: Spit it out if you've got something to say.
    ko: 할 말 있으면 똑바로 해.
    ja: 言いたいことがあるならさっさと言え。
  event_absolute1_01_e_14:
    speaker: scarecommander
    en: I was hoping maybe you could leave the cleanup to us...?
    ko: 뒤, 뒷수습은 우리한테 맡겨줄 수 없을까 해서….
    ja: あ、後始末はこちらに任せてくれないか…？
  event_absolute1_01_e_15:
    speaker: scarecommander
    en: If we return like this, we won't have anything to show in our report.
    ko: 이대로 돌아가면 작전 보고서에 적을 내용이 없거든.
    ja: |-
      このまま戻ったら、
      作戦報告書に書くことがないんだ…
  event_absolute1_01_e_16:
    speaker: scarecommander
    en: We lost all the resources we collected,
    ko: 채취한 자원은 전부 잃어버렸고.
    ja: 回収した資源は全部失くしてしまったし…
  event_absolute1_01_e_17:
    speaker: scarecommander
    en: and one of our Nikkes even got corrupted.
    ko: 니케 하나는 침식당하기까지 했으니.
    ja: 残ったニケも1機は侵食されて…
  event_absolute1_01_e_18:
    speaker: scarecommander
    en: If we want to stay on the payroll, we need to have something to report...
    ko: 우리가 먹고살려면 이런 거라도 적어 내야….
    ja: |-
      生活していくために、
      何か結果を出さないと…
  event_absolute1_01_e_19:
    speaker: eunhwa_t
    en: What an idiot.
    ko: 머저리 같긴.
    ja: あきれた野郎だ。
  event_absolute1_01_e_20:
    speaker: soldierfa
    en: P-please.
    ko: 부, 부탁드릴게요.
    ja: わ、私からもお願いします。
  event_absolute1_01_e_21:
    speaker: soldierfa
    en: Can you let our squad confirm
    ko: 생존자 확인은….
    ja: 生存者の確認は…
  event_absolute1_01_e_22:
    speaker: soldierfa
    en: whether there are any survivors?
    ko: 저희 스쿼드에게 맡겨주시면 안 될까요….
    ja: 私たちに、やらせてもらえないでしょうか…
  event_absolute1_01_e_23:
    speaker: soldierfa
    en: They fought alongside us...
    ko: 함께 싸워온 동료들이라….
    ja: い、一緒に戦ってきた仲間なんです…
  event_absolute1_01_e_24:
    speaker: soldierfa
    en: We'd like to see it through to the end...
    ko: 적어도 마무리는 해주고 싶어서….
    ja: せめて、最期だけでも私たちの手で…
  event_absolute1_01_e_25:
    speaker: soldiereg
    en: I'd like to request the same too.
    ko: 저도 부탁드리겠습니다.
    ja: 私からもお願いします。
  event_absolute1_01_e_26:
    speaker: "<Narration>"
    en: Falcon and Eagle lower their heads in supplication.
    ko: 팔콘과 이글이 머리를 숙였다.
    ja: ファルコンとイーグルが頭を下げた
  event_absolute1_01_e_27:
    speaker: eunhwa_t
    en: "... Fine."
    ko: "…쯧."
    ja: "…チッ。"
  event_absolute1_01_e_28:
    speaker: eunhwa_t
    en: We're returning to the Ark.
    ko: 방주로 복귀한다.
    ja: アークに戻るぞ。
  event_absolute1_01_e_29:
    speaker: vesti_t
    en: O-okay.
    ko: 으, 응.
    ja: う、うん。
  event_absolute1_01_e_30:
    speaker: vesti_t
    en: Uh... good luck.
    ko: 그… 히, 힘내.
    ja: が…頑張ってね。
  event_absolute1_01_e_31:
    speaker: "<Narration>"
    en: Eunhwa and Vesti board the transport aircraft.
    ko: 은화와 베스티가 수송기에 올라탔다.
    ja: ウンファとベスティーが輸送機に乗り込んだ
  event_absolute1_01_e_32:
    speaker: "<Narration>"
    en: Emma starts to follow, but then stops in front of Eagle.
    ko: 엠마는 그런 둘을 뒤따라가다 말고 이글 앞에 멈춰 섰다.
    ja: |-
      エマも続きかけたが、
      イーグルの前で立ち止まった
  event_absolute1_01_e_33:
    speaker: emma_t
    en: Here, take this.
    ko: 받아둬.
    ja: 受け取って。
  event_absolute1_01_e_34:
    speaker: soldiereg
    en: What's this...?
    ko: 이건…?
    ja: これは…？
  event_absolute1_01_e_35:
    speaker: emma_t
    en: It's a suppression round.
    ko: 제압 탄이야.
    ja: 鎮圧弾よ。
  event_absolute1_01_e_36:
    speaker: emma_t
    en: The same kind our leader used on your friend earlier.
    ko: 아까 우리 리더가 네 동료를 저격할 때 썼던 탄이랑 똑같은 탄.
    ja: |-
      さっき、私たちのリーダーが
      あなたの仲間を狙撃した時に
      使ったのと同じものね。
  event_absolute1_01_e_37:
    speaker: emma_t
    en: Keep it on you, just in case.
    ko: 혹시 모르니 갖고 있어.
    ja: 万が一に備えて持っておいて。
  event_absolute1_01_e_38:
    speaker: emma_t
    en: Judging by her eyes, it looks like it hasn't been long since she was corrupted.
    ko: 안구의 반응을 보아하니 침식당한 지 얼마 안 된 것 같던데.
    ja: |-
      あの眼球の様子なら、侵食されてから
      まだ時間が経ってないみたいだし…
  event_absolute1_01_e_39:
    speaker: emma_t
    en: So maybe there's still time. Try taking her to the Ark for a memory wipe.
    ko: 아직 늦지 않았을 수도 있으니까, 방주로 데려가서 기억소거를 받게 해 봐.
    ja: |-
      アークに連れて帰って、記憶消去を受ければ、
      まだ間に合うかもしれないわ。
  event_absolute1_01_e_40:
    speaker: emma_t
    en: "... It's better than having her disposed of, right?"
    ko: "…처분되는 것보다야 낫잖아?"
    ja: "…処分されるよりはいいわよね？"
  event_absolute1_01_e_41:
    speaker: soldiereg
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_01_e_42:
    speaker: emma_t
    en: Oh, and one more thing.
    ko: 참.
    ja: あっ、そうそう～
  event_absolute1_01_e_43:
    speaker: emma_t
    en: The Unlimited Squad should be clearing out the Raptures nearby,
    ko: 언리미티드 스쿼드가 근방의 랩쳐를 소탕해 주고 있을 거야.
    ja: |-
      アンリミテッドの皆が、
      このあたりのラプチャーは
      ある程度片付けてくれてるはずだけど…
  event_absolute1_01_e_44:
    speaker: emma_t
    en: but still, be extra careful, okay?
    ko: 그래도 조심, 또 조심해야 해. 알겠지?
    ja: それでも、油断しないで。ね？
  event_absolute1_01_e_45:
    speaker: soldiereg
    en: Roger that.
    ko: 네, 주의하겠습니다.
    ja: はい、分かりました。
  event_absolute1_01_e_46:
    speaker: emma_t
    en: Hehe, I'm off now.
    ko: 후후, 이만 가볼게~
    ja: ふふ、じゃあね～
  event_absolute1_01_e_47:
    speaker: emma_t
    en: See you again if we get the chance.
    ko: 기회가 된다면 또 보자~
    ja: 機会があったら、また会いましょ～
  event_absolute1_01_e_48:
    speaker: "<Narration>"
    en: Once Emma boards, the transport aircraft takes off.
    ko: 마침내 엠마까지 올라타자, 수송기가 이륙했다.
    ja: 輸送機はエマが乗り込むと、すぐに離陸した
  event_absolute1_01_e_49:
    speaker: soldiereg
    en: Let's move.
    ko: 이동하자.
    ja: "…私たちも移動しよう。"
  event_absolute1_01_e_50:
    speaker: soldierfa
    en: "... Okay."
    ko: "…응."
    ja: "…うん。"
  event_absolute1_01_e_51:
    speaker: "<Narration>"
    en: Eagle and Falcon lean on each other
    ko: 이글과 팔콘은 서로에게 의지한 채,
    ja: |-
      イーグルとファルコンは
      互いに肩を支え合いながら…
  event_absolute1_01_e_52:
    speaker: "<Narration>"
    en: as they make their way toward the Commander, who is busy rummaging through
      the remains of Black Smith for anything of value.
    ko: 돈이 될 만한 걸 찾기 위해 열심히 블랙스미스의 파편을 뒤지는 지휘관 쪽으로 이동했다.
    ja: |-
      金目のものを探してブラックスミスの
      残骸を漁る指揮官のもとへ向かった
  event_absolute1_01_e_53:
    speaker: "<Narration>"
    en: In the now-empty field, where no one remains...
    ko: 그렇게 아무도 남지 않게 된 벌판.
    ja: そうして、誰もいなくなった荒野には…
  event_absolute1_01_e_54:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 크르릉-
    ja: グルル…
  event_absolute1_01_e_55:
    speaker: "<Narration>"
    en: The air suddenly ripples, and a single footprint sinks deep into the ground.
    ko: 일순간 공기가 일렁이더니, 발자국 하나가 움푹 파였다.
    ja: |-
      わずかな空気の揺らめきと、
      生まれたての1つの足跡が残った
event_absolute1_02_s:
  event_absolute1_02_s_1:
    speaker: eunhwa_t
    en: How was the combat data?
    ko: 교전 데이터는 어땠지?
    ja: 交戦データはどうだ？
  event_absolute1_02_s_2:
    speaker: ingrid
    en: Hmm...
    ko: 흠….
    ja: うむ…
  event_absolute1_02_s_3:
    speaker: vesti_t
    en: W-was it... not very good?
    ko: 벼, 별로… 였어?
    ja: あ、あんまり…よくなかった？
  event_absolute1_02_s_4:
    speaker: ingrid
    en: No, it was perfect.
    ko: 아니. 완벽했다.
    ja: いや。完璧だった。
  event_absolute1_02_s_5:
    speaker: ingrid
    en: Your movements were flawless. Tactical Upgrade is a resounding success by
      any metric.
    ko: "[택티컬 업] 플랜을 가동한 제군들의 움직임엔 군더더기 하나 없더군."
    ja: |-
      タクティカル・アップ計画が完了してから、
      お前たちの動きには全く無駄がない。
  event_absolute1_02_s_6:
    speaker: ingrid
    en: Only your team could pull off such a textbook operation against a Tyrant-class
      Rapture.
    ko: 타일런트 급을 상대로 그런 정공법을 펼칠 수 있는 건 제군들뿐일 거다.
    ja: |-
      タイラント級を相手に
      ここまで堂々と戦えるのは、
      お前たちくらいだろう。
  event_absolute1_02_s_7:
    speaker: vesti_t
    en: Really?
    ko: 정말?
    ja: ほ、ホントに？
  event_absolute1_02_s_8:
    speaker: vesti_t
    en: Hehe. Eu-Eunhwa...! Only us, she says!
    ko: 헤헤. 으, 은화…! 우, 우리뿐이래!
    ja: |-
      へへ。ウ、ウンファ…！
      い、今の聞いた？
  event_absolute1_02_s_9:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_s_10:
    speaker: vesti_t
    en: "... Eunhwa?"
    ko: "…은화?"
    ja: "…ウンファ？"
  event_absolute1_02_s_11:
    speaker: ingrid
    en: However...
    ko: 다만.
    ja: ただ…
  event_absolute1_02_s_12:
    speaker: ingrid
    en: there's something I can't quite figure out.
    ko: 궁금한 점은 있다.
    ja: 聞きたいことがある。
  event_absolute1_02_s_13:
    speaker: emma_t
    en: And what's that?
    ko: 뭔데~?
    ja: あら、何かしら～？
  event_absolute1_02_s_14:
    speaker: ingrid
    en: Eunhwa.
    ko: 은화.
    ja: ウンファ。
  event_absolute1_02_s_15:
    speaker: ingrid
    en: Why did you act as bait
    ko: 왜 블랙스미스를 상대할 때,
    ja: ブラックスミスとの戦闘時、なぜ…
  event_absolute1_02_s_16:
    speaker: ingrid
    en: when facing Black Smith?
    ko: 제군이 미끼 역할을 수행한 것이지?
    ja: おとり役を買って出た？
  event_absolute1_02_s_17:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_02_s_18:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_s_19:
    speaker: ingrid
    en: Of course, even taking that into account,
    ko: 물론 이 점을 감안하고서 보더라도 결과적으로만 놓고 본다면 더할 나위 없는 완벽한 작전이었다.
    ja: |-
      もちろん、それも踏まえたうえで、
      結果的には非のつけどころのない
      完璧な作戦だった。
  event_absolute1_02_s_20:
    speaker: ingrid
    en: the operation was flawless in terms of its final outcome.
    ko: 하지만.
    ja: しかし…
  event_absolute1_02_s_21:
    speaker: ingrid
    en: But it was quite unlike your usual approach.
    ko: 평소 제군의 방식처럼 보이진 않더군.
    ja: 戦い方が普段と違うように見えたのでな。
  event_absolute1_02_s_22:
    speaker: eunhwa_t
    en: I wanted to see if there were other possibilities.
    ko: 다른 가능성을 시험해 보고 싶었을 뿐이야.
    ja: 別の可能性を試しているだけだ。
  event_absolute1_02_s_23:
    speaker: ingrid
    en: "... Is that so?"
    ko: "…그런가."
    ja: "…そうか。"
  event_absolute1_02_s_24:
    speaker: ingrid
    en: Very well. It's important to explore different tactics.
    ko: |-
      그렇다면 되었다.
      다양한 시도를 해보는 건 중요하지.
    ja: |-
      そういうことなら構わない。
      可能性の模索は重要なことだ。
  event_absolute1_02_s_25:
    speaker: ingrid
    en: That'll be all for the squad analysis.
    ko: 그럼 제군들에 대한 분석은 이쯤 하지.
    ja: 戦術評価については以上。
  event_absolute1_02_s_26:
    speaker: ingrid
    en: Let's move on.
    ko: 다음으로 넘어가서.
    ja: 次の報告に移ろう。
  event_absolute1_02_s_27:
    speaker: ingrid
    en: 'I''ll report the findings on Tyrant 003: Black Smith,'
    ko: 타일런트 모델 003, 블랙스미스의 분석 결과를 말해주겠다.
    ja: |-
      タイラントモデル003、
      ブラックスミスの分析結果だが…
  event_absolute1_02_s_28:
    speaker: ingrid
    en: which is the core of today's briefing.
    ko: 사실상 이쪽이 본론이겠군.
    ja: ここからが今回の本題だ。
  event_absolute1_02_s_29:
    speaker: emma_t
    en: Your face just darkened...
    ko: 표정이 어두워졌네.
    ja: あら、なんだか表情が暗いわね？
  event_absolute1_02_s_30:
    speaker: emma_t
    en: That means something bad, right?
    ko: 그렇다는 건….
    ja: もしかして…
  event_absolute1_02_s_31:
    speaker: ingrid
    en: It's just as we feared.
    ko: 우려했던 대로다.
    ja: 懸念していた通りだ。
  event_absolute1_02_s_32:
    speaker: ingrid
    en: By the time the battle began, Black Smith's large caliber rifle was already
      damaged.
    ko: 전투가 벌어진 시점에 블랙스미스의 대구경 라이플은 이미 손상되어 있었다.
    ja: |-
      戦闘開始時点で、ブラックスミスの
      大口径ライフルは損傷した状態だった。
  event_absolute1_02_s_33:
    speaker: emma_t
    en: Could it have been damaged by gunfire from the Nikkes on the resource-gathering
      mission?
    ko: 자원 채취 임무를 나선 니케들의 총격으로 손상됐을 가능성은?
    ja: |-
      事前の資源採取部隊との戦闘で
      損傷していた可能性は？
  event_absolute1_02_s_34:
    speaker: ingrid
    en: No, the large caliber rifle was ripped away by something sharp.
    ko: 대구경 라이플은 날카로운 무언가에 의해 찢겨 나갔다.
    ja: |-
      いや。大口径ライフルの状態からみて、
      鋭利な何かに切断されたと推定されている。
  event_absolute1_02_s_35:
    speaker: ingrid
    en: The marks left on the damaged areas looked like the bite marks of a wild beast.
    ko: 손상된 부위에 남겨진 흔적은 마치 맹수의 이빨 자국처럼 보이더군.
    ja: |-
      損傷部位付近に、
      猛獣の牙の痕のようなものが残っていた。
  event_absolute1_02_s_36:
    speaker: ingrid
    en: In other words, before encountering you,
    ko: 다시 말해 블랙스미스는 제군들과 조우하기 전.
    ja: |-
      つまり、くだんのブラックスミスは
      お前たちと遭遇する以前に…
  event_absolute1_02_s_37:
    speaker: ingrid
    en: Black Smith had once fought against an unknown entity—
    ko: 미지의 존재와,
    ja: 未知の何か…
  event_absolute1_02_s_38:
    speaker: ingrid
    en: something that wasn't a Nikke.
    ko: 그것도 니케가 아닌 무언가와 한차례 전투를 벌였다는 뜻이다.
    ja: |-
      それも、ニケではないものと
      交戦したと思われる。
  event_absolute1_02_s_39:
    speaker: emma_t
    en: So it's happened again, huh...
    ko: 이번에도 말이구나….
    ja: なんだか、この前と似てるわね…
  event_absolute1_02_s_40:
    speaker: ingrid
    en: Right.
    ko: 그래.
    ja: そうだな。
  event_absolute1_02_s_41:
    speaker: ingrid
    en: Last month, we found the shredded remains of a Rapture in the North.
    ko: 지난달, 북부에서 갈기갈기 찢긴 랩쳐의 잔해가 발견된 이후.
    ja: |-
      先月、北部でズタズタに引き裂かれた
      ラプチャーの残骸が発見されて以来…
  event_absolute1_02_s_42:
    speaker: ingrid
    en: Since then, the Unlimited Squad has reported five similar cases.
    ko: 언리미티드 스쿼드에 의해 비슷한 사례가 보고된 게 총 다섯 건.
    ja: |-
      アンリミテッド部隊から
      似たような事例の報告が5件も上がっている。
  event_absolute1_02_s_43:
    speaker: ingrid
    en: And now, we're seeing even a Tyrant-class Rapture like Black Smith with its
      large caliber rifle damaged.
    ko: 거기에 더해 이번엔 대구경 라이플이 손상된 타일런트 급 랩쳐까지 나타났지.
    ja: |-
      そして今回、大口径ライフルを損傷した
      タイラント級ラプチャーが発見されたことで…
  event_absolute1_02_s_44:
    speaker: ingrid
    en: That confirms it.
    ko: 이걸로 확실해진 것 같군.
    ja: ようやくはっきりした。
  event_absolute1_02_s_45:
    speaker: ingrid
    en: Something unknown is out there in the North, hunting Raptures.
    ko: 북부에 랩쳐를 사냥하는 [미지의 존재]가 등장했다.
    ja: |-
      北部にラプチャーを狩る
      「未知の存在」が潜んでいる。
  event_absolute1_02_s_46:
    speaker: ingrid
    en: And it's powerful enough to take on a Tyrant-class.
    ko: 그것도 타일런트 급과 맞설 수 있는 존재가.
    ja: |-
      それも、タイラント級と
      張り合えるほどの存在がな。
  event_absolute1_02_s_47:
    speaker: vesti_t
    en: D-do you think it's on our side?
    ko: 우, 우리 편일까?
    ja: わ、私たちの味方なのかな？
  event_absolute1_02_s_48:
    speaker: ingrid
    en: That's precisely what we need to figure out.
    ko: 그건 지금부터 알아봐야겠지.
    ja: それを今から調べる必要がある。
  event_absolute1_02_s_49:
    speaker: vesti_t
    en: A-are we
    ko: 지, 지금부터?
    ja: えっ、い、今から？
  event_absolute1_02_s_50:
    speaker: vesti_t
    en: heading back up North now?
    ko: 우리 다시 북부로 가는 거야?
    ja: また北部に行かなきゃいけないの？
  event_absolute1_02_s_51:
    speaker: vesti_t
    en: I-I don't like it there... It's s-so cold...
    ko: 거, 거긴 추워서 싫은데….
    ja: すごく寒いから、イヤなんだけどなぁ…
  event_absolute1_02_s_52:
    speaker: ingrid
    en: I'm sending The Scouts up North for recon.
    ko: 북부엔 스카우팅을 보낼 거다.
    ja: スカウティングが先に派遣される予定だ。
  event_absolute1_02_s_53:
    speaker: ingrid
    en: Gathering intel is the top priority.
    ko: 일단은 정보를 수집하는 게 우선으로 보이는군.
    ja: まずは情報収集が必要だからな。
  event_absolute1_02_s_54:
    speaker: ingrid
    en: While they're doing that,
    ko: 델타와 시그널.
    ja: デルタとシグナルから報告があるまで…
  event_absolute1_02_s_55:
    speaker: ingrid
    en: I won't assign you any new missions,
    ko: 그 둘이 정보를 수집하는 동안에는 임무를 맡기지 않을 생각이니,
    ja: お前たちは待機になるだろう。
  event_absolute1_02_s_56:
    speaker: ingrid
    en: so use this time to rest and recover.
    ko: 제군들은 이번 기회에 편히 쉬어라.
    ja: 今のうちにゆっくり休むように。
  event_absolute1_02_s_57:
    speaker: ingrid
    en: You just got back from the battle with the Four Beasts,
    ko: 포비스트 전을 치르고 돌아온 지 얼마 안 되었는데,
    ja: |-
      フォービースト戦から戻って
      間もないと言うのに…
  event_absolute1_02_s_58:
    speaker: ingrid
    en: and have already been on three missions back-to-back.
    ko: 단기간에 세 번이나 임무를 나가게 했으니.
    ja: 短期間で3度の出撃だ。
  event_absolute1_02_s_59:
    speaker: ingrid
    en: I'm not pushing you any harder than that.
    ko: 여기서 더 무리하게 할 순 없지.
    ja: これ以上の無理はさせられないからな。
  event_absolute1_02_s_60:
    speaker: ingrid
    en: That's all for the briefing.
    ko: 분석은 여기까지다.
    ja: 報告は以上だ。
  event_absolute1_02_s_61:
    speaker: ingrid
    en: You're dismissed.
    ko: 이만 돌아가 보도록.
    ja: 解散して構わない。
  event_absolute1_02_s_62:
    speaker: "<Narration>"
    en: Emma and Vesti leave the room.
    ko: 엠마와 베스티가 밖으로 나갔다.
    ja: エマとベスティーが退出した
  event_absolute1_02_s_63:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_s_64:
    speaker: ingrid
    en: What is it?
    ko: 뭐지?
    ja: どうした？
  event_absolute1_02_s_65:
    speaker: ingrid
    en: Do you have more to discuss with me?
    ko: 아직 볼일이 남았나.
    ja: まだ何か用があるのか？
  event_absolute1_02_s_66:
    speaker: eunhwa_t
    en: How did the combat data come out?
    ko: 교전 데이터는 어땠지?
    ja: 交戦データはどうだった？
  event_absolute1_02_s_67:
    speaker: ingrid
    en: Didn't I go through that already?
    ko: 답은 이미 줬을 텐데?
    ja: すでに聞かせたはずだが？
  event_absolute1_02_s_68:
    speaker: eunhwa_t
    en: What I'm asking about is our combat data involving Behemoth.
    ko: 내가 묻는 건, 베히모스와의 교전 데이터다.
    ja: 聞きたいのは、ベヒモスの方だ。
  event_absolute1_02_s_69:
    speaker: eunhwa_t
    en: Given our current state,
    ko: 지금의 우리라면,
    ja: 今の私たちなら…
  event_absolute1_02_s_70:
    speaker: eunhwa_t
    en: with Tactical Upgrade in effect, do you think we could take her down without
      Rapi...
    ko: "[택티컬 업] 플랜을 가동한 우리라면, 라피…."
    ja: |-
      タクティカル・アップ計画が完了した
      私たちなら、ラピ…
  event_absolute1_02_s_71:
    speaker: eunhwa_t
    en: or rather, without the Counters?
    ko: 아니, 카운터스 없이도 놈을 쓰러뜨릴 수 있을 것 같나.
    ja: いや、カウンターズ抜きで奴を倒せると思うか？
  event_absolute1_02_s_72:
    speaker: eunhwa_t
    en: Could we defeat her perfectly,
    ko: 아무런 피해 없이,
    ja: 損害を一切出さず…
  event_absolute1_02_s_73:
    speaker: eunhwa_t
    en: without suffering any casualties?
    ko: 완벽하게 놈을 쓰러뜨릴 수 있을 것 같나.
    ja: 完璧な戦果をあげられるか？
  event_absolute1_02_s_74:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_s_75:
    speaker: ingrid
    en: Eunhwa.
    ko: 은화.
    ja: ウンファ。
  event_absolute1_02_s_76:
    speaker: ingrid
    en: I'll ask you instead.
    ko: 도리어 묻겠다.
    ja: それはこちらが聞くことだ。
  event_absolute1_02_s_77:
    speaker: ingrid
    en: Do you think you can take down Behemoth without the Counters?
    ko: 제군은 카운터스 없이, 베히모스 전에서 승리할 수 있을 것 같나?
    ja: |-
      アブソルートは、カウンターズの援護なしに
      ベヒモスに勝利できるか？
  event_absolute1_02_s_78:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_s_79:
    speaker: ingrid
    en: As the leader of Absolute,
    ko: 답은 제군이 제일 잘 알고 있겠지.
    ja: 一番よく分かっているのは、お前のはずだ。
  event_absolute1_02_s_80:
    speaker: ingrid
    en: you should know best.
    ko: 앱솔루트의 리더는 제군이다.
    ja: アブソルートのリーダーはお前なのだからな。
  event_absolute1_02_s_81:
    speaker: ingrid
    en: You have to make that call yourself.
    ko: 판단은 스스로 내리도록.
    ja: その問いに対する答えは、自分自身で導き出せ。
event_absolute1_02_e:
  event_absolute1_02_e_1:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  event_absolute1_02_e_2:
    speaker: emma_t
    en: You're late.
    ko: 늦었네?
    ja: あら、遅かったわね～？
  event_absolute1_02_e_3:
    speaker: emma_t
    en: What were you and Ingrid talking about, I wonder?
    ko: 우리 리더, 잉그리드랑 단둘이 무슨 이야길 했을까~?
    ja: |-
      イングリッドと二人きりでなんて、
      どんなナイショ話～？
  event_absolute1_02_e_4:
    speaker: eunhwa_t
    en: Nothing much.
    ko: 별거 아녔어.
    ja: 大したことじゃない。
  event_absolute1_02_e_5:
    speaker: emma_t
    en: Hmm?
    ko: 흐음~?
    ja: ふ～ん？
  event_absolute1_02_e_6:
    speaker: eunhwa_t
    en: Honestly, it was nothing.
    ko: 정말 별거 아녔다니깐.
    ja: つまらないことだ。
  event_absolute1_02_e_7:
    speaker: emma_t
    en: Okay, I'll believe you.
    ko: 알겠어, 믿어줄게~
    ja: そう？ならいいけど～
  event_absolute1_02_e_8:
    speaker: eunhwa_t
    en: If you're done with your repairs, go ahead first
    ko: 정비 마쳤으면 먼저 가.
    ja: 整備が終わったなら先に行ってろ。
  event_absolute1_02_e_9:
    speaker: eunhwa_t
    en: and quit spouting nonsense next to me.
    ko: 옆에서 이상한 소리 말고.
    ja: 妙なことを聞くんじゃない。
  event_absolute1_02_e_10:
    speaker: emma_t
    en: Hey, come on now, how could I just leave you behind?
    ko: 에이~ 어떻게 은화만 놔두고 먼저 가겠어.
    ja: |-
      も～、ウンファを残して
      行けるわけないでしょ～？
  event_absolute1_02_e_11:
    speaker: emma_t
    en: Besides, Vesti said she had something to tell us.
    ko: 그리고 베스티가 우리한테 할 말 있다고 했는걸.
    ja: それに、ベスティーから話があるって～
  event_absolute1_02_e_12:
    speaker: emma_t
    en: Right, Vesti?
    ko: 그치?
    ja: ねっ？ベスティー？
  event_absolute1_02_e_13:
    speaker: vesti_t
    en: Y-yeah.
    ko: 으, 응.
    ja: う、うん。
  event_absolute1_02_e_14:
    speaker: eunhwa_t
    en: What is it?
    ko: 뭔데.
    ja: 何だ。
  event_absolute1_02_e_15:
    speaker: vesti_t
    en: W-well...
    ko: 그, 그게….
    ja: え、えっと…
  event_absolute1_02_e_16:
    speaker: vesti_t
    en: I mean, it's our first time resting in a while.
    ko: 우리 오랜만에 쉬는 거잖아.
    ja: その、休暇をもらうなんて久しぶりでしょ？
  event_absolute1_02_e_17:
    speaker: vesti_t
    en: So... um...
    ko: 그래서 말인데.
    ja: だから…えっと…
  event_absolute1_02_e_18:
    speaker: vesti_t
    en: how about if we all go somewhere together? Hehe...
    ko: 다, 다 같이 놀러 가면 어떨까 해서… 헤헤….
    ja: |-
      ひ、久しぶりに、
      みんなで一緒に遊びに行かない？えへへ…
  event_absolute1_02_e_19:
    speaker: vesti_t
    en: Um, there's, you know, all sorts of things... I think we'll have a lot to
      talk about...
    ko: 이, 이런저런… 할 얘기도 마, 많을 것 같고….
    ja: |-
      お、お互い…話したいことも
      たくさんあると思うし…
  event_absolute1_02_e_20:
    speaker: vesti_t
    en: Since we've only been on missions nonstop since we came back from the Crystal
      Region...
    ko: 수정 지역에서 돌아온 이후로 계속 임무만 했으니까….
    ja: |-
      クリスタル地帯から戻ってずっと、
      任務続きだったから…
  event_absolute1_02_e_21:
    speaker: emma_t
    en: Hehe, I'm all for it!
    ko: 후후, 난 찬성~
    ja: ふふ、私は賛成よ～
  event_absolute1_02_e_22:
    speaker: emma_t
    en: How about you, Eunhwa?
    ko: 은화는?
    ja: ウンファは？
  event_absolute1_02_e_23:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_e_24:
    speaker: eunhwa_t
    en: Count me out.
    ko: 난 됐어.
    ja: やめておく。
  event_absolute1_02_e_25:
    speaker: eunhwa_t
    en: I have no time to waste on such pointless endeavors.
    ko: 그런 쓸데없는 데 시간 보낼 여유 없어.
    ja: 無駄なことに使える時間はない。
  event_absolute1_02_e_26:
    speaker: emma_t
    en: Aw, c'mon, Eunhwa.
    ko: "…은화."
    ja: "…ウンファ。"
  event_absolute1_02_e_27:
    speaker: vesti_t
    en: I-it's not pointless!
    ko: 쓰, 쓸데없지 않아!
    ja: む、無駄なんかじゃないよ！
  event_absolute1_02_e_28:
    speaker: eunhwa_t
    en: What'd you say?
    ko: 뭐?
    ja: は？
  event_absolute1_02_e_29:
    speaker: vesti_t
    en: Talking with each other isn't pointless...
    ko: 쓸데없는 이야기… 아니야.
    ja: む、無駄なことじゃ…ないよ…
  event_absolute1_02_e_30:
    speaker: vesti_t
    en: I-I mean it... I just wanted to say something important, that's all...
    ko: 지, 진짜… 중요한 이야기를 하려고 해서 그런데….
    ja: ほ、本当に…大事な話があるの…
  event_absolute1_02_e_31:
    speaker: eunhwa_t
    en: What is it, then?
    ko: 뭔데.
    ja: 何だ？
  event_absolute1_02_e_32:
    speaker: vesti_t
    en: Huh?
    ko: 응?
    ja: え？
  event_absolute1_02_e_33:
    speaker: eunhwa_t
    en: You said it was important. So what is it?
    ko: "그 중요한 이야기. \n뭐냐고."
    ja: 大事な話というのは何だ？
  event_absolute1_02_e_34:
    speaker: vesti_t
    en: Y-you want me to say it here?
    ko: 여, 여기서 말해?
    ja: い、今言わなきゃダメ？
  event_absolute1_02_e_35:
    speaker: eunhwa_t
    en: You said it was important, didn't you?
    ko: |-
      중요한 이야기라며.
      그럼 그냥 해.
    ja: |-
      大事な話なんだろう。
      だったら今言え。
  event_absolute1_02_e_36:
    speaker: eunhwa_t
    en: Stop wasting time and just say it.
    ko: 시간 끌지 말고.
    ja: 時間がもったいない。
  event_absolute1_02_e_37:
    speaker: emma_t
    en: Yeesh, Eunhwa. You're way too impatient.
    ko: |-
      에이~ 은화.
      너무 성급하다~
    ja: |-
      あらあら～ウンファったら。
      せっかちなんだから～
  event_absolute1_02_e_38:
    speaker: emma_t
    en: Why don't we do as Vesti said and hang out together next time...
    ko: 베스티 말대로 다음에 같이 놀러 가서….
    ja: |-
      ベスティーの言う通り、
      今度遊びに…
  event_absolute1_02_e_39:
    speaker: vesti_t
    en: Wh-why are you always telling me to stay behind?
    ko: 그, 그럼… 요즘 왜 자꾸 나는 뒤에 있으라고 하는 거야?
    ja: |-
      じゃあ、言うけど…
      最近、どうして私に何もやらせてくれないの？
  event_absolute1_02_e_40:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: はぁ？
  event_absolute1_02_e_41:
    speaker: vesti_t
    en: F-for the past few missions, you've kept telling me to stay at the back a
      lot...
    ko: "이, 이번 임무들 하, 할 때 나한테 뒤에 있으라고 한 적… \n마, 많은 거 같아서…."
    ja: |-
      こ、今回の任務もそうだったけど…
      最近いつも、後ろに下がってろって
      言われてたから…
  event_absolute1_02_e_42:
    speaker: vesti_t
    en: I know you have your reasons!
    ko: 으, 은화가 다 생각이 있어서 그런 건 아는데!
    ja: |-
      ウ、ウンファが色々考えてるってことは
      分かってるよ！
  event_absolute1_02_e_43:
    speaker: vesti_t
    en: But... well... it just kind of feels like... I'm only being protected, you
      know...
    ko: 그, 그래도… 뭐, 뭐랄까… 보, 보호받기만 하는 느낌이라….
    ja: |-
      でも…なんて言うか…
      ずっと守られてばっかりな気がして…
  event_absolute1_02_e_44:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_e_45:
    speaker: vesti_t
    en: I-I've really gotten strong now... I even finished the Tactical Upgrade.
    ko: 나, 이, 이제 정말 강해졌는데… 태, 택티컬 업 플랜도 끝냈고.
    ja: |-
      わ、私だって、すごく強くなったんだよ…
      タクティカル・アップは私もやったし。
  event_absolute1_02_e_46:
    speaker: vesti_t
    en: A-and now... we actually got our revenge on Behemoth and ended...
    ko: 우, 우리 이제 베히모스에게 복수도 잘하고 끝났는….
    ja: |-
      ベヒモスのことだって、
      ちゃんとみんなでやり返せて…
  event_absolute1_02_e_47:
    speaker: eunhwa_t
    en: Ended what?
    ko: 뭐가 끝나.
    ja: やり返せたと思うか？
  event_absolute1_02_e_48:
    speaker: vesti_t
    en: H-huh?
    ko: 으, 응?
    ja: え…えっ？
  event_absolute1_02_e_49:
    speaker: eunhwa_t
    en: What revenge?
    ko: 우리가 무슨 복수를 끝냈는데.
    ja: 本当に、あれでできたと思っているのか？
  event_absolute1_02_e_50:
    speaker: eunhwa_t
    en: If it hadn't been for her, we would have...
    ko: 그 녀석이 아니었으면, 그때도 우린…!
    ja: あいつがいなかったら、あの時私たちは…！
  event_absolute1_02_e_51:
    speaker: vesti_t
    en: Her?
    ko: 그 녀석?
    ja: あいつ？
  event_absolute1_02_e_52:
    speaker: vesti_t
    en: Y-you don't mean... Rapi, do you?
    ko: 서, 설마… 라피를 말하는 거야?
    ja: そ、それって…ラピのこと？
  event_absolute1_02_e_53:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_e_54:
    speaker: vesti_t
    en: Y-yeah, just as I thought... It's Rapi... again.
    ko: |-
      마, 맞구나… 라피.
      또… 라피네.
    ja: |-
      や、やっぱりそう…
      また…ラピなんだ。
  event_absolute1_02_e_55:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_02_e_56:
    speaker: vesti_t
    en: This time too...
    ko: 이번에도… 또….
    ja: 結局…また…
  event_absolute1_02_e_57:
    speaker: vesti_t
    en: So, so the reason you kept telling me to stay back...
    ko: 그, 그럼 계속 나한테 뒤에 있으라고 한 것도….
    ja: もしかして、私に下がってろって言ってたのは…
  event_absolute1_02_e_58:
    speaker: vesti_t
    en: Is it because I'm not Rapi?
    ko: 내가 라피가 아니라서 그런 거야?
    ja: 私が、ラピじゃないから？
  event_absolute1_02_e_59:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_02_e_60:
    speaker: eunhwa_t
    en: What are you talking about?
    ko: 무슨 말을 하는 거야.
    ja: "…違う。"
  event_absolute1_02_e_61:
    speaker: vesti_t
    en: Th-then why do you always do everything on your own, Eunhwa?
    ko: 그, 그럼 왜 으, 은화가 다 하려는 거야?
    ja: |-
      じゃ、じゃあ、どうして
      全部1人でやろうとするの？
  event_absolute1_02_e_62:
    speaker: vesti_t
    en: I-I'm not who I used to be anymore.
    ko: 나, 나는 이제 이전의 그 모습이 아닌데.
    ja: 私だってもう、昔の私じゃないのに。
  event_absolute1_02_e_63:
    speaker: vesti_t
    en: So why... do you keep telling me to stay at the back?
    ko: 자꾸… 왜 뒤에만 있으라고 하는 거야?
    ja: なんで…いつも引っ込んでろって言うの？
  event_absolute1_02_e_64:
    speaker: vesti_t
    en: Is it because... when I stayed behind to fight with Behemoth...
    ko: 베히모스랑 싸우라고 남았을 때….
    ja: は、初めてベヒモスと戦った時に…
  event_absolute1_02_e_65:
    speaker: vesti_t
    en: I... I lost?
    ko: 내, 내가 져서 그래?
    ja: わ、私が負けたから？
  event_absolute1_02_e_66:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: は？
  event_absolute1_02_e_67:
    speaker: vesti_t
    en: Is that why you don't trust me anymore? Because I couldn't win back then...
    ko: 그때 이기지 못해서… 이젠 날 믿을 수 없어진 거야?
    ja: |-
      あの時勝てなかったせいで…
      私のこと、信じられなくなったの？
  event_absolute1_02_e_68:
    speaker: eunhwa_t
    en: "... Enough already."
    ko: "…시끄러워."
    ja: "…いい加減にしろ。"
  event_absolute1_02_e_69:
    speaker: eunhwa_t
    en: Stop whining, would you? You're getting in your own head.
    ko: 이상한 생각에 빠져서 어리광 부리지 마.
    ja: |-
      くだらない思い込みで、
      訳の分からないことを言うな。
  event_absolute1_02_e_70:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_02_e_71:
    speaker: emma_t
    en: Eunhwa...
    ko: 은화….
    ja: ウンファ…
  event_absolute1_02_e_72:
    speaker: eunhwa_t
    en: That's it. I'm leaving.
    ko: 됐어. 간다.
    ja: もういい。
  event_absolute1_02_e_73:
    speaker: "<Narration>"
    en: Eunhwa heads outside.
    ko: 은화가 밖으로 나갔다.
    ja: ウンファが会話を切り、立ち去った
  event_absolute1_02_e_74:
    speaker: emma_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_02_e_75:
    speaker: vesti_t
    en: I-I messed up, didn't I?
    ko: 내, 내가 잘못한 거겠지?
    ja: わ、私が悪いんだよね？
  event_absolute1_02_e_76:
    speaker: vesti_t
    en: I told Rapi...
    ko: 라피한테 그랬는데….
    ja: ラピと約束したのに…
  event_absolute1_02_e_77:
    speaker: vesti_t
    en: that we'd spend more time together...
    ko: 더 많이 시간을 보내고….
    ja: もっとたくさん一緒に過ごして…
  event_absolute1_02_e_78:
    speaker: vesti_t
    en: that we'd get closer to each other...
    ko: 더 많이 친해질 거라고 했는데….
    ja: もっと仲よくなるからねって…
  event_absolute1_02_e_79:
    speaker: vesti_t
    en: That we'd get so close,
    ko: 라피가 부러워할 정도로….
    ja: ラピがうらやましがるぐらい…
  event_absolute1_02_e_80:
    speaker: vesti_t
    en: she'd be jealous...
    ko: 친해질 거라고… 했는데….
    ja: 完璧になるって…
  event_absolute1_02_e_81:
    speaker: vesti_t
    en: That's what I said... but now...
    ko: 그랬는데….
    ja: そう…言ったのに…
  event_absolute1_02_e_82:
    speaker: emma_t
    en: Vesti...
    ko: 베스티….
    ja: ベスティー…
  event_absolute1_02_e_83:
    speaker: vesti_t
    en: "... I-I'm going to go now."
    ko: "…나, 나도 그만 갈게."
    ja: "…わ、私も、もう行くね。"
  event_absolute1_02_e_84:
    speaker: vesti_t
    en: I-I'm sorry, Emma.
    ko: 미, 미안해. 엠마.
    ja: ご、ごめんね。エマ。
  event_absolute1_02_e_85:
    speaker: emma_t
    en: Vesti!
    ko: 베스티!
    ja: ベスティー！
  event_absolute1_02_e_86:
    speaker: "<Narration>"
    en: Vesti runs off.
    ko: 베스티가 뛰어나갔다.
    ja: ベスティーはどこかに走り去っていった
  event_absolute1_02_e_87:
    speaker: emma_t
    en: "*Sigh*"
    ko: "…하아."
    ja: "…はぁ。"
  event_absolute1_02_e_88:
    speaker: fellowcommanders
    en: We'll become the saviors of humanity!
    ko: 인류는 우리 지휘관이 구원한다!
    ja: 人類は、我々指揮官が救うのだ！
  event_absolute1_02_e_89:
    speaker: fellowcommanders
    en: We are humanity's future!
    ko: 우리야말로 인류의 미래.
    ja: 我々こそが人類の未来！
  event_absolute1_02_e_90:
    speaker: fellowcommanders
    en: We'll reclaim the surface, no matter what!
    ko: 반드시 지상을 탈환한다!
    ja: 必ず地上を奪還する！
  event_absolute1_02_e_91:
    speaker: "<Narration>"
    en: At an abandoned playground near the Military Academy, the shouts of commanders-in-training
      can be heard.
    ko: 사관학교 근처, 버려진 놀이터에 예비 지휘관들의 기합 소리가 들려왔다.
    ja: |-
      士官学校近くの空き地から、
      指揮官候補生たちのかけ声が聞こえてくる
  event_absolute1_02_e_92:
    speaker: eunhwa_t
    en: "... Idiots."
    ko: "…머저리들."
    ja: "…バカどもが。"
  event_absolute1_02_e_93:
    speaker: "<Narration>"
    en: Eunhwa kicks off the ground.
    ko: 은화는 발을 굴렀다.
    ja: ウンファは毒づき、足に力を入れた
  event_absolute1_02_e_94:
    speaker: "<Narration>"
    en: "*Creak*"
    ko: 끼익-
    ja: キィ…
  event_absolute1_02_e_95:
    speaker: "<Narration>"
    en: The swing rises...
    ko: 그네가 위로 올라가고.
    ja: ブランコは大きく前に飛び出し…
  event_absolute1_02_e_96:
    speaker: "<Narration>"
    en: "*Creak*"
    ko: 끼익-
    ja: キィ…
  event_absolute1_02_e_97:
    speaker: "<Narration>"
    en: It comes back down again.
    ko: 다시 아래로 떨어진다.
    ja: また、元の位置に戻った
  event_absolute1_02_e_98:
    speaker: maddog
    en: You WILL reclaim the surface.
    ko: 넌, 반드시, 지상을, 탈환한다.
    ja: お前は、必ず、地上を奪還しろ。
  event_absolute1_02_e_99:
    speaker: maddog
    en: Got that?
    ko: 알겠나?
    ja: 分かったか？
  event_absolute1_02_e_100:
    speaker: maddog
    en: You must reclaim it without fail.
    ko: 반드시 탈환하는 거다.
    ja: 必ず取り戻せ。
  event_absolute1_02_e_101:
    speaker: maddog
    en: And we'll do it the human way!
    ko: 지상을! 우리 인간의 방식으로!
    ja: 地上を！我々人間の戦いで！
  event_absolute1_02_e_102:
    speaker: "<Narration>"
    en: "*Creak creak*"
    ko: 끼익- 끼익-
    ja: キィ…キィ…
  event_absolute1_02_e_103:
    speaker: fellowcommander
    en: I...
    ko: 난….
    ja: 私は…
  event_absolute1_02_e_104:
    speaker: fellowcommander
    en: I thought I was a hero...
    ko: 내가 영웅이라고 생각했어….
    ja: 自分のことを英雄だと思ってた…
  event_absolute1_02_e_105:
    speaker: fellowcommander
    en: I believed that reclaiming the surface...
    ko: 지상을 탈환할… 인류의 미래라고….
    ja: 地上を取り戻す…人類の未来だと…
  event_absolute1_02_e_106:
    speaker: fellowcommander
    en: was humanity's future... but...
    ko: 믿었… 는데….
    ja: そう…信じてたのに…
  event_absolute1_02_e_107:
    speaker: "<Narration>"
    en: "*Creak creak*"
    ko: 끼익- 끼익-
    ja: キィ…キィ…
  event_absolute1_02_e_108:
    speaker: newsanchor
    en: Following Absolute's victory over a Tyrant-class Rapture,
    ko: "[앱솔루트]가 타일런트 급 랩쳐를 격파하며,"
    ja: |-
      「アブソルート」がタイラント級ラプチャーの
      撃破を達成したことで…
  event_absolute1_02_e_109:
    speaker: newsanchor
    en: hopes for reclaiming the surface have once again been reignited.
    ko: 지상 탈환에 대한 가능성이 다시 한번 대두되고 있습니다.
    ja: 地上奪還の気運がさらに高まりつつあります。
  event_absolute1_02_e_110:
    speaker: newsanchor
    en: Among the citizens, Absolute is recognized as Elysion's strongest squad
    ko: 시민 사이에선 [앱솔루트]야말로 엘리시온 최강의 스쿼드이자,
    ja: |-
      市民の間でも「アブソルート部隊」こそが
      エリシオン最強との声が高く…
  event_absolute1_02_e_111:
    speaker: newsanchor
    en: and is considered by many to be the Ark's strongest squad with the potential
      to reclaim the surface someday...
    ko: 더 나아가 언젠가 지상을 탈환할 방주 최강의 스쿼드라고….
    ja: |-
      いずれ地上の奪還をも成し遂げるであろう
      アーク最強の部隊として…
  event_absolute1_02_e_112:
    speaker: "<Narration>"
    en: "*Creak creak*"
    ko: 끼익- 끼익-
    ja: キィ…キィ…
  event_absolute1_02_e_113:
    speaker: "<Narration>"
    en: Lifted by the many voices it has long carried,
    ko: 오래전부터 짊어온 수많은 목소리에 힘입어,
    ja: |-
      今まで背負ってきた無数の声に
      押し出されたかのごとく
  event_absolute1_02_e_114:
    speaker: "<Narration>"
    en: the swing soars ahead, rising ever higher.
    ko: 그네는 힘차게 앞으로 나아갔다.
    ja: ブランコは力強く前に揺れ
  event_absolute1_02_e_115:
    speaker: "<Narration>"
    en: Toward the sky above.
    ko: 저 위를 향해.
    ja: 上を目指した
  event_absolute1_02_e_116:
    speaker: "<Narration>"
    en: Toward the farthest heights of the Ark.
    ko: 드높은 방주의 하늘을 향해.
    ja: アークの高い空に向かって
  event_absolute1_02_e_117:
    speaker: "<Narration>"
    en: "*Creaaaaaaak*"
    ko: 끼- 익-
    ja: キィ…
  event_absolute1_02_e_118:
    speaker: vesti_t
    en: Th-then why do you always do everything on your own, Eunhwa?
    ko: 그, 그럼 왜 으, 은화가 다 하려는 거야?
    ja: |-
      じゃ、じゃあ、どうして
      全部1人でやろうとするの？
  event_absolute1_02_e_119:
    speaker: vesti_t
    en: I-I'm not who I used to be anymore.
    ko: 나, 나는 이제 이전의 그 모습이 아닌데.
    ja: 私だってもう、昔の私じゃないのに。
  event_absolute1_02_e_120:
    speaker: vesti_t
    en: So why... do you keep telling me to stay at the back?
    ko: 자꾸… 왜 뒤에만 있으라고 하는 거야?
    ja: なんで…いつも引っ込んでろって言うの？
  event_absolute1_02_e_121:
    speaker: vesti_t
    en: Is it because... when I stayed behind to fight with Behemoth...
    ko: 베히모스랑 싸우라고 남았을 때….
    ja: は、初めてベヒモスと戦った時に…
  event_absolute1_02_e_122:
    speaker: vesti_t
    en: I... I lost?
    ko: 내, 내가 져서 그래?
    ja: わ、私が負けたから？
  event_absolute1_02_e_123:
    speaker: vesti_t
    en: Is that why you don't trust me anymore? Because I couldn't win back then...
    ko: 그때 이기지 못해서… 이젠 날 믿을 수 없어진 거야?
    ja: |-
      あの時勝てなかったせいで…
      私のこと、信じられなくなったの？
  event_absolute1_02_e_124:
    speaker: ingrid
    en: And yet, despite all this, do you still wish to reclaim the surface?
    ko: 그럼에도 제군은 지상을 탈환하고 싶은가.
    ja: それでも、地上の奪還を望み続けるか？
  event_absolute1_02_e_125:
    speaker: ingrid
    en: Do you intend to head up to the surface once more?
    ko: 다시 한번 지상으로 올라갈 생각인가.
    ja: もう一度、地上を目指すか？
  event_absolute1_02_e_126:
    speaker: ingrid
    en: Are you no longer afraid of failure?
    ko: 더는 실패가 두렵지 않은가.
    ja: 失敗を重ねることが怖くはないか？
  event_absolute1_02_e_127:
    speaker: ingrid
    en: Well? Answer me.
    ko: 답해라.
    ja: 答えろ。
  event_absolute1_02_e_128:
    speaker: ingrid
    en: What will you do going forward?
    ko: 제군은 앞으로 어떻게 하고 싶지?
    ja: お前たちは、どうする？
  event_absolute1_02_e_129:
    speaker: "<Narration>"
    en: "*Creaak*"
    ko: 끼이익-
    ja: キィィ…
  event_absolute1_02_e_130:
    speaker: "<Narration>"
    en: The swing slowly descends.
    ko: 그네가 천천히 땅으로 내려왔다.
    ja: ブランコがゆっくりと揺れ続け――
  event_absolute1_02_e_131:
    speaker: vesti_t
    en: Comm... ander... Sorry... I couldn't... win...
    ko: |-
      지휘… 관… 님….
      미안… 못… 이겼… 어….
    ja: |-
      指揮官…様…
      ごめん…勝て…なかった…
  event_absolute1_02_e_132:
    speaker: vesti_t
    en: Pl... ease...
    ko: 부탁… 해….
    ja: お願…い…
  event_absolute1_02_e_133:
    speaker: "<Narration>"
    en: The swing comes to a stop.
    ko: 그네가 멈춰 섰다.
    ja: "――やがて止まった"
  event_absolute1_02_e_134:
    speaker: eunhwa_t
    en: I...
    ko: "…난."
    ja: "…私は…"
  event_absolute1_02_e_135:
    speaker: emma_t
    en: I knew I'd find you here.
    ko: 역시 여기 있었구나.
    ja: やっぱりここにいたのね～
  event_absolute1_02_e_136:
    speaker: eunhwa_t
    en: "... Emma?"
    ko: "…엠마?"
    ja: "…エマ？"
  event_absolute1_02_e_137:
    speaker: emma_t
    en: Mind if I sit next to you?
    ko: 옆에 앉아도 될까?
    ja: 隣、いいかしら？
  event_absolute1_02_e_138:
    speaker: eunhwa_t
    en: "... *Sigh*"
    ko: "…하아."
    ja: "…はぁ。"
  event_absolute1_02_e_139:
    speaker: eunhwa_t
    en: Suit yourself.
    ko: 맘대로 해.
    ja: 好きにしろ。
  event_absolute1_02_e_140:
    speaker: emma_t
    en: Hehe, thanks.
    ko: 후후, 고마워~
    ja: ふふ、ありがとう～
event_absolute1_03_s:
  event_absolute1_03_s_1:
    speaker: emma_t
    en: Sitting here like this... It really brings back memories, doesn't it?
    ko: 이렇게 있으니까 옛날 생각난다. 그치?
    ja: こうしてると、昔を思い出すわね～？
  event_absolute1_03_s_2:
    speaker: emma_t
    en: You remember, right? What Ingrid said back then?
    ko: 기억나? 그때 잉그리드가 했던 말.
    ja: |-
      覚えてる？
      あの時、イングリッドに言われたこと。
  event_absolute1_03_s_3:
    speaker: ingrid
    en: You've failed.
    ko: 제군은 실패했다.
    ja: お前たちは失敗した。
  event_absolute1_03_s_4:
    speaker: ingrid
    en: Just as all who sought to reclaim the surface
    ko: 지상을 탈환하고자 한 모두가 그러했듯.
    ja: かつて、地上奪還を試みた者たちと同じように…
  event_absolute1_03_s_5:
    speaker: ingrid
    en: have failed before you.
    ko: 제군 역시 실패하고 만 거다.
    ja: お前たちもまた、挫折を味わった。
  event_absolute1_03_s_6:
    speaker: ingrid
    en: As you know, the surface is teeming with formidable enemies.
    ko: 알다시피 지상은 강대한 적으로 넘쳐난다.
    ja: |-
      分かっているだろう。
      地上は恐るべき脅威であふれかえっている。
  event_absolute1_03_s_7:
    speaker: ingrid
    en: Our reality as humanity is that
    ko: 그 강함을 측정할 수 없는,
    ja: 計り知ることもできない敵と…
  event_absolute1_03_s_8:
    speaker: ingrid
    en: we must endlessly face unknown foes whose strength cannot be measured.
    ko: 미지의 적을 끝도 없이 상대해야 하는 게 우리 인류의 현실이지.
    ja: |-
      いつ終わるとも知れない戦いを
      強いられているのが、我々人類の現実だ。
  event_absolute1_03_s_9:
    speaker: ingrid
    en: And yet, despite all this, do you still wish to reclaim the surface?
    ko: 그럼에도 제군은 지상을 탈환하고 싶은가.
    ja: それでも、地上の奪還を望み続けるか？
  event_absolute1_03_s_10:
    speaker: ingrid
    en: Do you intend to head up to the surface once more?
    ko: 다시 한번 지상으로 올라갈 생각인가.
    ja: もう一度、地上を目指すか？
  event_absolute1_03_s_11:
    speaker: ingrid
    en: Are you no longer afraid of failure?
    ko: 더는 실패가 두렵지 않은가.
    ja: 失敗を重ねることが怖くはないか？
  event_absolute1_03_s_12:
    speaker: ingrid
    en: Well? Answer me.
    ko: 답해라.
    ja: 答えろ。
  event_absolute1_03_s_13:
    speaker: ingrid
    en: What will you do going forward?
    ko: 제군은 앞으로 어떻게 하고 싶지?
    ja: お前たちは、どうする？
  event_absolute1_03_s_14:
    speaker: eunhwa_t
    en: "... I remember."
    ko: "…기억나."
    ja: "…覚えている。"
  event_absolute1_03_s_15:
    speaker: emma_t
    en: Every time I come here, I remember that moment.
    ko: 후후, 여기만 오면 그 생각이 나더라.
    ja: |-
      ふふ、ここに来ると決まって
      あの日のことを思い出すのよね～
  event_absolute1_03_s_16:
    speaker: eunhwa_t
    en: You do?
    ko: 네가?
    ja: お前が？
  event_absolute1_03_s_17:
    speaker: emma_t
    en: Well... that was the first time I met you, after all.
    ko: 그야~ 그게 은화랑 처음 만난 순간이었으니까.
    ja: |-
      だって～…あの日はウンファと
      初めて会った日でもあるのよ～？
  event_absolute1_03_s_18:
    speaker: emma_t
    en: And it was also the day Absolute was formed.
    ko: 앱솔루트가 결성된 날이기도 했고.
    ja: アブソルートができた日でもあるし～
  event_absolute1_03_s_19:
    speaker: emma_t
    en: There's no way I wouldn't remember something like that, hehe.
    ko: 기억에 남을 수밖에 없지. 후후.
    ja: 記憶に残らない方がおかしいわ。ふふっ。
  event_absolute1_03_s_20:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_03_s_21:
    speaker: emma_t
    en: So Eunhwa, what's wrong?
    ko: 그래서 은화, 무슨 일이야?
    ja: それはそうと、ウンファ、何かあったの？
  event_absolute1_03_s_22:
    speaker: eunhwa_t
    en: What do you mean, "what's going on?"
    ko: 무슨 일이냐니?
    ja: "…なぜ聞く？"
  event_absolute1_03_s_23:
    speaker: emma_t
    en: You really think I don't notice you come here whenever something's bothering
      you?
    ko: 뭔가 걱정 있을 때마다 여기 오는 거, 내가 모를 줄 알고?
    ja: ここにいるってことは、そういうことでしょ？
  event_absolute1_03_s_24:
    speaker: emma_t
    en: Did Ingrid tell you something bad?
    ko: 잉그리드에게 안 좋은 이야기라도 들은 거야?
    ja: イングリッドに何か言われた？
  event_absolute1_03_s_25:
    speaker: eunhwa_t
    en: "... No, that's not it."
    ko: "…그런 건 아니고."
    ja: "…別に。"
  event_absolute1_03_s_26:
    speaker: eunhwa_t
    en: It's just...
    ko: 그냥.
    ja: お前が気にするようなことは何もない。
  event_absolute1_03_s_27:
    speaker: eunhwa_t
    en: We were sent on another mission not long after the battle with the Four Beasts,
    ko: 포비스트 전을 치르고 돌아온 지 얼마 안 돼서 임무에 나가는 바람에,
    ja: |-
      フォービーストと戦ってからずっと
      任務続きだっただろう。
  event_absolute1_03_s_28:
    speaker: eunhwa_t
    en: so I didn't get a chance to analyze the combat data myself.
    ko: 따로 교전 데이터를 분석할 시간이 없었으니까.
    ja: 交戦データの分析結果を聞く時間がなかった。
  event_absolute1_03_s_29:
    speaker: eunhwa_t
    en: I only heard the summary of the analysis.
    ko: 그 분석 내용을 들은 것뿐이야.
    ja: それを聞いただけだ。
  event_absolute1_03_s_30:
    speaker: eunhwa_t
    en: I've only heard the summary of the analysis, so I was wondering if we, in
      our current state, could...
    ko: 지금의 우리라면 아무런 피해 없이,
    ja: 今の私たちが損害を出さずに…
  event_absolute1_03_s_31:
    speaker: eunhwa_t
    en: take them down perfectly, without taking a single hit.
    ko: 완벽하게 놈들을 쓰러뜨릴 수 있을지 궁금했거든.
    ja: 奴に完勝できるか、知りたかっただけだ。
  event_absolute1_03_s_32:
    speaker: emma_t
    en: And what did Ingrid say?
    ko: 그러니까 뭐라고 하셨어?
    ja: それで、イングリッドはなんて？
  event_absolute1_03_s_33:
    speaker: eunhwa_t
    en: She said to make the judgment myself.
    ko: 판단은 스스로 내리라더라.
    ja: 答えは自分で出せ、と…
  event_absolute1_03_s_34:
    speaker: eunhwa_t
    en: Like she always does.
    ko: 언제나처럼 말이다.
    ja: 相変わらずだ。
  event_absolute1_03_s_35:
    speaker: emma_t
    en: Mmm, that certainly sounds like her.
    ko: 잉그리드답네.
    ja: ふふ、イングリッドらしいわね。
  event_absolute1_03_s_36:
    speaker: eunhwa_t
    en: Yeah, exactly.
    ko: 그래. 잉그리드답지.
    ja: ああ、そうだな。
  event_absolute1_03_s_37:
    speaker: emma_t
    en: Hmm... a flawless victory, without taking a single hit...
    ko: 흐음~ 아무런 피해 없이 완벽하게… 라.
    ja: う～ん、損害なしで…ねえ。
  event_absolute1_03_s_38:
    speaker: emma_t
    en: So that's why you're here.
    ko: "…그래서 여기 와 있던 거구나."
    ja: "…それでここに来たのね。"
  event_absolute1_03_s_39:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: は？
  event_absolute1_03_s_40:
    speaker: emma_t
    en: Haha, nothing.
    ko: 후후, 아니야.
    ja: ふふ、何でもないわ～
  event_absolute1_03_s_41:
    speaker: emma_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_03_s_42:
    speaker: emma_t
    en: Hey, remember when Rapi apologized?
    ko: 있지. 전에 라피가 사과하면서 물었잖아.
    ja: ねえ、前にラピが謝りに来てくれた時…
  event_absolute1_03_s_43:
    speaker: emma_t
    en: She asked if things might've been different if she'd said those things to
      us back then.
    ko: 그때 이 말을 너희에게 했었다면 뭔가 달라졌을까, 하고.
    ja: |-
      もっと早く話ができてたら
      結果は違ったかって、聞かれたわよね。
  event_absolute1_03_s_44:
    speaker: emma_t
    en: I feel the same way you do.
    ko: 나도 은화랑 똑같이 생각해.
    ja: 私もウンファと同じ考えよ。
  event_absolute1_03_s_45:
    speaker: emma_t
    en: If that had happened...
    ko: 그랬더라면,
    ja: もしそうだったら…
  event_absolute1_03_s_46:
    speaker: emma_t
    en: If she'd told us all that when she left Absolute...
    ko: 라피가 앱솔루트를 탈퇴하면서 그런 말들을 우리한테 했었더라면,
    ja: |-
      アブソルートをやめる前に、
      ひとこと話してくれていたら…
  event_absolute1_03_s_47:
    speaker: emma_t
    en: I really do think a lot would've been different.
    ko: 분명 많은 게 달라졌을 거야.
    ja: きっといろんなことが違ってたと思うの。
  event_absolute1_03_s_48:
    speaker: eunhwa_t
    en: Do you think so?
    ko: 그러냐.
    ja: "…そうか。"
  event_absolute1_03_s_49:
    speaker: emma_t
    en: Yeah, words that go unsaid never get through to anyone.
    ko: 응. 말하지 않으면, 전달되지 않는 법이니까.
    ja: |-
      ええ。だって、大切なことは
      口に出さないと伝わらないものね～？
  event_absolute1_03_s_50:
    speaker: eunhwa_t
    en: Why are you bringing this up all of a sudden?
    ko: 그런데 그 이야기는 갑자기 왜?
    ja: なぜ今さらそんな話を？
  event_absolute1_03_s_51:
    speaker: emma_t
    en: Hmm...
    ko: 글쎄~
    ja: さあね～？
  event_absolute1_03_s_52:
    speaker: emma_t
    en: Maybe because someone else I know is being a bit tight-lipped.
    ko: 내가 아는 누구도 입을 꾹 다물고 있어서~?
    ja: 誰かさんが口を開いてくれないからかしら～？
  event_absolute1_03_s_53:
    speaker: eunhwa_t
    en: Tsk.
    ko: 쯧.
    ja: チッ。
  event_absolute1_03_s_54:
    speaker: eunhwa_t
    en: "... How's Vesti?"
    ko: "…베스티는 어떤데."
    ja: "…ベスティーはどこだ？"
  event_absolute1_03_s_55:
    speaker: emma_t
    en: Well... I'm not sure.
    ko: 글쎄~ 나도 모르겠어.
    ja: さあ…分からないわ。
  event_absolute1_03_s_56:
    speaker: emma_t
    en: She took off running right after you left.
    ko: 은화가 간 뒤에, 혼자 뛰어가 버렸거든.
    ja: |-
      ウンファが出ていった後、
      1人でどこかに行っちゃったから…
  event_absolute1_03_s_57:
    speaker: eunhwa_t
    en: "... Is that so?"
    ko: "…그러냐."
    ja: "…そうか。"
  event_absolute1_03_s_58:
    speaker: eunhwa_t
    en: Why don't you go and comfort...
    ko: 네가 좀 잘 달래….
    ja: お前の方で先に…
  event_absolute1_03_s_59:
    speaker: emma_t
    en: You know what?
    ko: 그거 알아?
    ja: ねえ、知ってる？
  event_absolute1_03_s_60:
    speaker: emma_t
    en: After we came back from the Crystal Region, something showed up in Vesti's
      room.
    ko: 수정 지역에서 돌아온 이후, 베스티 방에 뭐가 생겼는지.
    ja: |-
      ラピとお別れしてから、
      ベスティーのお部屋、様子が変わったのよ～
  event_absolute1_03_s_61:
    speaker: eunhwa_t
    en: After we came back from the Crystal Region?
    ko: 수정 지역에서 돌아오고 나서?
    ja: あの後から？
  event_absolute1_03_s_62:
    speaker: emma_t
    en: Yeah,
    ko: 응.
    ja: ええ。
  event_absolute1_03_s_63:
    speaker: emma_t
    en: I went to her room a few days ago and saw a bunch of notes stuck all over
      her desk.
    ko: 며칠 전에 베스티 방에 가서 봤는데, 책상에 이것저것 메모가 붙어있더라고.
    ja: |-
      何日か前に行ってみたら、
      机にメモがいっぱい貼ってあったの。
  event_absolute1_03_s_64:
    speaker: emma_t
    en: They were all things she wanted to do with us.
    ko: 우리와 하고 싶은 것들이 잔뜩 적힌 메모가.
    ja: |-
      私たちと一緒にやりたいことが
      ぎっしり書いてあったわ。
  event_absolute1_03_s_65:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_03_s_66:
    speaker: emma_t
    en: She's always holed up in her room on the days we don't have missions.
    ko: 임무 나가지 않은 날마다, 방에 틀어박혀 있었잖아.
    ja: |-
      任務のない日は、
      いつも部屋に閉じこもってたでしょ？
  event_absolute1_03_s_67:
    speaker: emma_t
    en: So that's what she has been doing in there...
    ko: 그게 그거 때문이었나 봐.
    ja: あれ、メモを書くためだったみたいなの～
  event_absolute1_03_s_68:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_03_s_69:
    speaker: emma_t
    en: Remember what Vesti said that day, on our way back from the Crystal Region?
    ko: 그날, 수정 지역에서 되돌아올 때 베스티가 그랬잖아.
    ja: |-
      ねえ、あの時ベスティーが話してたこと…
      覚えてる？
  event_absolute1_03_s_70:
    speaker: vesti_t
    en: You know what?
    ko: 우리 있잖아.
    ja: 私たちはね…
  event_absolute1_03_s_71:
    speaker: vesti_t
    en: We're going to be more active from here on out.
    ko: 이제 더 많은 일을 할 거야.
    ja: これからもっと頑張るから。
  event_absolute1_03_s_72:
    speaker: vesti_t
    en: We'll be doing all sorts of missions, and spending more time together as a
      team.
    ko: 더 많은 일을 할 거고, 더 많이 시간을 보낼 거야.
    ja: もっと任務に出て、もっと一緒に過ごして…
  event_absolute1_03_s_73:
    speaker: vesti_t
    en: We're gonna become closer than ever.
    ko: 더 많이 친해질 거야.
    ja: もっと仲よくなるの。
  event_absolute1_03_s_74:
    speaker: vesti_t
    en: You may end up getting jealous.
    ko: 라피가 엄청 부러워할 정도로.
    ja: ラピがうらやましがるぐらい…
  event_absolute1_03_s_75:
    speaker: vesti_t
    en: We're going to be a well-oiled machine. We'll be perfect.
    ko: 완벽해질 거야.
    ja: 完璧になるよ。
  event_absolute1_03_s_76:
    speaker: emma_t
    en: Vesti just doesn't want to stay still.
    ko: 베스티는 멈춰있고 싶지 않은 거야.
    ja: あの子は、止まっていたくないみたいよ。
  event_absolute1_03_s_77:
    speaker: emma_t
    en: She's not like us.
    ko: 우리랑은 다르게.
    ja: 私たちとは違って。
  event_absolute1_03_s_78:
    speaker: "<Narration>"
    en: Emma pushes off with her feet, moving the swing.
    ko: 엠마는 발을 굴러 그네를 움직였다.
    ja: エマがブランコを揺らした
  event_absolute1_03_s_79:
    speaker: eunhwa_t
    en: "... Yeah."
    ko: "…그래."
    ja: "…そうか。"
  event_absolute1_03_s_80:
    speaker: emma_t
    en: Since our adorable youngest's working so hard
    ko: 귀여운 막내가 저렇게 노력하는데,
    ja: |-
      かわいい末っ子が
      あんなに頑張ってるんだもの。
  event_absolute1_03_s_81:
    speaker: emma_t
    en: we have to do our best too, right?
    ko: 우리가 멈춰있어야 하겠어~?
    ja: 私たちも、頑張らないとね～？
event_absolute1_03_e:
  event_absolute1_03_e_1:
    speaker: "<Narration>"
    en: "*Rattle*"
    ko: 달그락-
    ja: カチャ…
  event_absolute1_03_e_2:
    speaker: ludmilla
    en: Well? What do you think?
    ko: 어떠냐?
    ja: どうかしら？
  event_absolute1_03_e_3:
    speaker: alice
    en: Waaah!
    ko: 와아-!
    ja: わあ～！
  event_absolute1_03_e_4:
    speaker: alice
    en: It's sooo cozy!
    ko: 엄청 포근해요!
    ja: とってもふわふわします～！
  event_absolute1_03_e_5:
    speaker: alice
    en: So warm and...
    ko: 포근하고, 또….
    ja: ふわふわして、ええと…
  event_absolute1_03_e_6:
    speaker: alice
    en: soft...
    ko: 몽글해서….
    ja: それからもこもこしてて…
  event_absolute1_03_e_7:
    speaker: alice
    en: I feel like I'll drift off to dreamland any second now... *Yawn*
    ko: 금방이라도 꿈나라에 갈 것 같아요… 흐아암~
    ja: なんだか夢の国に行けそうです…ふわぁぁ～
  event_absolute1_03_e_8:
    speaker: ludmilla
    en: Hehe, it pleases me to see the tea leaves meet your approval. They are freshly
      imported.
    ko: 후후, 새로 공수해 온 찻잎이 마음에 드는 것 같아 다행이구나.
    ja: |-
      ふふ、新しい茶葉を
      手に入れてもらったかいが有ったわ。
  event_absolute1_03_e_9:
    speaker: ludmilla
    en: How do you find them, Tove?
    ko: 어떤가, 토브.
    ja: トーブは、どうかしら？
  event_absolute1_03_e_10:
    speaker: ludmilla
    en: Do they suit your tastes as well?
    ko: 그대 입맛에도 맞느냐?
    ja: あなたのお口には合って？
  event_absolute1_03_e_11:
    speaker: tove
    en: Yeah, the scent's really nice. Hehe.
    ko: 네, 향이 너무 좋아요. 헤헤.
    ja: はい！特に香りが気に入りました、えへへ。
  event_absolute1_03_e_12:
    speaker: tove
    en: Can I have another cup with Neve later?
    ko: 이따 네베 씨랑 한 잔 더 마셔도 될까요?
    ja: あとでネヴェさんにも分けてあげていいですか？
  event_absolute1_03_e_13:
    speaker: ludmilla
    en: Very well. I shall have it prepared for you the moment she wakes.
    ko: 그래. 깨어나는 대로 마실 수 있게 준비해 놓겠다.
    ja: |-
      ええ、もちろんよ。
      起きたらすぐに出せるよう準備しておくわ。
  event_absolute1_03_e_14:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: "[치직--]"
    ja: ザザッ…
  event_absolute1_03_e_15:
    speaker: alice
    en: Huh?
    ko: 어라?
    ja: あれっ…？
  event_absolute1_03_e_16:
    speaker: alice
    en: My Queen, I think someone wants to talk to us!
    ko: 여왕님, 저희랑 이야기하고 싶은 분이 있나 봐요!
    ja: 女王様、私たちにご用事みたいです！
  event_absolute1_03_e_17:
    speaker: ludmilla
    en: Hmm? The Ark ought not to be able to reach us during such a blizzard.
    ko: 음? 눈보라가 심할 때라 방주랑은 연락이 닿지 않을 텐데?
    ja: |-
      本当？吹雪がひどい時期は
      アークと連絡が繋がらないはずだけど…？
  event_absolute1_03_e_18:
    speaker: alice
    en: But...
    ko: 그치만….
    ja: う～ん、でも…
  event_absolute1_03_e_19:
    speaker: alice
    en: The machine is sparkling!
    ko: 기계가 반짝반짝 빛나고 있는걸요.
    ja: 機械がずっと、ぴかぴか光ってますよ…？
  event_absolute1_03_e_20:
    speaker: ludmilla
    en: Indeed.
    ko: 정말이군.
    ja: "…本当ね。"
  event_absolute1_03_e_21:
    speaker: ludmilla
    en: A castaway, perhaps?
    ko: 조난자인가.
    ja: 遭難かしら。
  event_absolute1_03_e_22:
    speaker: ludmilla
    en: Tove, I leave it to you.
    ko: 토브여, 부탁하지.
    ja: トーブ、お願いするわ。
  event_absolute1_03_e_23:
    speaker: tove
    en: Got it! Hooking up the transmission now!
    ko: 넵! 통신 연결하겠습니다.
    ja: はい！接続しますね！
  event_absolute1_03_e_24:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: "[치직--]"
    ja: ザザッ…
  event_absolute1_03_e_25:
    speaker: tove
    en: Uh...
    ko: 어….
    ja: ん～…
  event_absolute1_03_e_26:
    speaker: tove
    en: Hmm...
    ko: 음….
    ja: うう～ん…
  event_absolute1_03_e_27:
    speaker: tove
    en: The signal's acting up...
    ko: 통신 상태가 좋지 않네요….
    ja: 通信状態があまりよくありませんね…
  event_absolute1_03_e_28:
    speaker: tove
    en: Ludmilla, could you maybe take one step back?
    ko: 루드밀라 씨, 혹시 한 발짝만 뒤로 물러나 보시겠어요?
    ja: あの、1歩だけ後ろに下がっていただけますか？
  event_absolute1_03_e_29:
    speaker: ludmilla
    en: One step back, you say?
    ko: 한 발짝 뒤로?
    ja: 後ろに？
  event_absolute1_03_e_30:
    speaker: ludmilla
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_03_e_31:
    speaker: ludmilla
    en: Ah, pardon me. It seems I had my hand resting on the device.
    ko: 미안하다. 이 몸이 기기에 손을 짚고 있었구나.
    ja: |-
      気づかなかったわ。
      指が触れていたみたいね。
  event_absolute1_03_e_32:
    speaker: ludmilla
    en: Is this better now?
    ko: 이 정도면 됐나?
    ja: これくらいでいいかしら？
  event_absolute1_03_e_33:
    speaker: tove
    en: I'll try again.
    ko: 다시 한번 해볼게요.
    ja: |-
      ありがとうございます！
      もう一度やってみますね。
  event_absolute1_03_e_34:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: "[치지직--]"
    ja: ザザーッ…
  event_absolute1_03_e_35:
    speaker: tove
    en: The signal's still kinda weak, but...
    ko: 감도가 여전히 미약하긴 해도….
    ja: 信号がかなり弱いですね…
  event_absolute1_03_e_36:
    speaker: tove
    en: If I tweak this part here...
    ko: 여길 이렇게 조절하면….
    ja: ここをこうやって、調節すれば…
  event_absolute1_03_e_37:
    speaker: scarecommander
    en: "―Oh!"
    ko: "[--어!]"
    ja: "――え！"
  event_absolute1_03_e_38:
    speaker: tove
    en: Yes! I patched them through!
    ko: 네! 연결됐어요!
    ja: 繋がりました！
  event_absolute1_03_e_39:
    speaker: alice
    en: Wow, Pigeon, you're amazing!
    ko: 와~ 병아리 씨 대단해요!
    ja: わあ～！ヒヨコさん、すごいです！
  event_absolute1_03_e_40:
    speaker: tove
    en: Hehe. Let me turn on our mic...
    ko: 헤헤. 그럼, 저희 쪽 음성 켤게요.
    ja: えへへ。では、応答しますね。
  event_absolute1_03_e_41:
    speaker: tove
    en: Can you hear me?
    ko: 저기 들리실까요?
    ja: もしも～し、聞こえますか？
  event_absolute1_03_e_42:
    speaker: scarecommander
    en: Help!
    ko: "[살려줘--!!]"
    ja: 助けてくれぇ！！
  event_absolute1_03_e_43:
    speaker: tove
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_03_e_44:
    speaker: scarecommander
    en: "... I don't want to die, Eagle. I still..."
    ko: "[---죽기 싫어, 이글. 난 아직--]"
    ja: |-
      ――い、イーグル、まだ死にたくない。
      私はまだ――
  event_absolute1_03_e_45:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: "[치지직--]"
    ja: ザザーッ…
  event_absolute1_03_e_46:
    speaker: signal
    en: Test... test...
    ko: "[아아-]"
    ja: あー、あー…
  event_absolute1_03_e_47:
    speaker: signal
    en: Can you hear me?
    ko: "[드, 들리시나요?]"
    ja: き、聞こえますか？
  event_absolute1_03_e_48:
    speaker: ludmilla
    en: Signal?
    ko: 시그널?
    ja: シグナル？
  event_absolute1_03_e_49:
    speaker: ludmilla
    en: I hear you're on a mission in the North.
    ko: 북부에서 작전을 수행 중이라곤 들었다만.
    ja: 北部へ任務で来るとは聞いていたけれど…
  event_absolute1_03_e_50:
    speaker: ludmilla
    en: What's the matter?
    ko: 무슨 일이지?
    ja: 何かあったのかしら？
  event_absolute1_03_e_51:
    speaker: signal
    en: Huh?
    ko: "[어라?]"
    ja: あれ？
  event_absolute1_03_e_52:
    speaker: signal
    en: Th-the transmission's definitely connected...
    ko: "[토, 통신은 분명 연결됐는데…]"
    ja: つ、通信は繋がってるのに…
  event_absolute1_03_e_53:
    speaker: signal
    en: So why is it only sending...?
    ko: "[왜 송신밖에…]"
    ja: どうして送信しか…
  event_absolute1_03_e_54:
    speaker: tove
    en: Uh, I don't think they can hear us...
    ko: 저, 저희 목소리가 안 들리는 것 같은데요…?
    ja: |-
      こ、こちらの声は
      聞こえてないみたいですね…？
  event_absolute1_03_e_55:
    speaker: ludmilla
    en: Is there truly no way?
    ko: 방법이 없느냐?
    ja: 何か方法はないの？
  event_absolute1_03_e_56:
    speaker: tove
    en: Yeah, there's really nothing we can do on our end...
    ko: 네에… 이쪽에선 해결할 방법이….
    ja: それが…こちら側からできることは何も…
  event_absolute1_03_e_57:
    speaker: signal
    en: The signal's bad...
    ko: "[수, 수신 상태가 좋지 않으니…]"
    ja: つ、通信状態不良のため…
  event_absolute1_03_e_58:
    speaker: signal
    en: I'll quickly update you on our situation...
    ko: "[급한 대로 저희 쪽 상황을 전달할게요….]"
    ja: 至急、こちらの状況をお伝えします…
  event_absolute1_03_e_59:
    speaker: signal
    en: We've been attacked by a new Rapture. Some special type of...
    ko: "[특수 개체로 추정되는 신형 랩쳐의 습격으로…]"
    ja: |-
      特殊個体と推定される
      新型ラプチャーの襲撃により…
  event_absolute1_03_e_60:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: "[치지직--]"
    ja: ザザーッ…
  event_absolute1_03_e_61:
    speaker: signal
    en: "... Delta... Casualties..."
    ko: "[…델타… 희생…]"
    ja: "…デルタ…消息不明…"
  event_absolute1_03_e_62:
    speaker: signal
    en: "... Outer building... Isolated..."
    ko: "[…외곽의 건물에… 고립…]"
    ja: "…外縁部の建築物…孤立…"
  event_absolute1_03_e_63:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: "[치직--]"
    ja: ザザッ…
  event_absolute1_03_e_64:
    speaker: signal
    en: "... Support..."
    ko: "[…지원…]"
    ja: "…救援を…"
  event_absolute1_03_e_65:
    speaker: "<Narration>"
    en: "*Buzz* *Buzzzzzz*"
    ko: "[치직, 치지지직--]"
    ja: ザザッ、ザザザッ――
  event_absolute1_03_e_66:
    speaker: tove
    en: The transmission... cut off.
    ko: 통신… 두절됐어요….
    ja: 通信が…切れました…
  event_absolute1_03_e_67:
    speaker: ludmilla
    en: Can you pinpoint the point of origin?
    ko: 발신지는 특정할 수 있겠나.
    ja: 発信地点は分かる？
  event_absolute1_03_e_68:
    speaker: tove
    en: I tried to grab the coordinates while we were connected,
    ko: 통신 연결됐을 때, 겸사겸사 좌표를 따두긴 했는데요….
    ja: |-
      受信できているうちに、
      いちおう座標は解析しておきましたけど…
  event_absolute1_03_e_69:
    speaker: tove
    en: but the connection wasn't great, so it probably isn't very accurate...
    ko: 연결 상태가 좋지 않아서, 정확하지는 않을 거예요….
    ja: |-
      接続状態が不安定だったので、
      正確かどうかは…
  event_absolute1_03_e_70:
    speaker: ludmilla
    en: That's at least something.
    ko: 그나마 다행이군.
    ja: 何もないよりはいいわ。
  event_absolute1_03_e_71:
    speaker: ludmilla
    en: You've done well.
    ko: 잘해주었다.
    ja: いい仕事よ。
  event_absolute1_03_e_72:
    speaker: ludmilla
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_03_e_73:
    speaker: ludmilla
    en: Tove, wake Neve and head to the Ark.
    ko: 토브, 네베를 깨워 방주로 향해라.
    ja: |-
      トーブ、ネヴェを起こして
      アークへ報告を急いで。
  event_absolute1_03_e_74:
    speaker: ludmilla
    en: Inform them that The Scouts are threatened by a new type of Rapture presumed
      to be a special entity
    ko: 특수 개체로 추정되는 신형 랩쳐의 등장으로,
    ja: 特殊個体と推定される新型ラプチャーが出現、
  event_absolute1_03_e_75:
    speaker: ludmilla
    en: and are in grave danger.
    ko: 스카우팅 스쿼드가 위험에 빠졌다고 전하도록.
    ja: |-
      スカウティング部隊から
      緊急の救援要請があったと伝えて。
  event_absolute1_03_e_76:
    speaker: ludmilla
    en: Since we can't communicate directly with the Ark, this is our only way to
      request support.
    ko: 방주와 통신이 닿지 않으니, 지원을 요청하려면 이 수밖에 없겠구나.
    ja: |-
      アークとの通信が使えないいま、
      支援を要請する方法はこれしかないわ。
  event_absolute1_03_e_77:
    speaker: tove
    en: Leave it to me!
    ko: 맡겨주세요.
    ja: お任せください！
  event_absolute1_03_e_78:
    speaker: ludmilla
    en: Alice.
    ko: 앨리스여.
    ja: アリス。
  event_absolute1_03_e_79:
    speaker: ludmilla
    en: You shall accompany me on this search.
    ko: 그대는 이 몸과 수색을 나선다.
    ja: あなたは私と一緒に人探しよ。
  event_absolute1_03_e_80:
    speaker: ludmilla
    en: We cannot afford to remain idle and wait for support to arrive.
    ko: 지원을 기다리며, 가만히 있을 순 없겠지.
    ja: |-
      何もせずに支援を待っているわけには
      いかないわ。
  event_absolute1_03_e_81:
    speaker: alice
    en: Yes, my Queen!
    ko: 예, 여왕님!
    ja: はい、女王様！
  event_absolute1_03_e_82:
    speaker: ludmilla
    en: Well then, time's running out, so let's set off immediately.
    ko: 그럼, 시간이 없으니, 바로 움직이자꾸나.
    ja: 一刻を争うわ。すぐに支度をととのえて。
event_absolute1_intermission_01:
  event_absolute1_intermission_01_1:
    speaker: "<Monologue>"
    en: Dear Kitty,
    ko: 키티에게.
    ja: ミニーへ
  event_absolute1_intermission_01_2:
    speaker: "<Monologue>"
    en: do you remember
    ko: 처음 은화를 만났던 날.
    ja: 初めてウンファに会った日のこと
  event_absolute1_intermission_01_3:
    speaker: "<Monologue>"
    en: the day I first met Eunhwa?
    ko: 기억해?
    ja: 覚えてる？
  event_absolute1_intermission_01_4:
    speaker: eunhwa
    en: What are you looking at?
    ko: 뭘 봐.
    ja: 何をしている。
  event_absolute1_intermission_01_5:
    speaker: vesti
    en: H-huh?
    ko: 어, 어?
    ja: え、えっ？
  event_absolute1_intermission_01_6:
    speaker: eunhwa
    en: I asked what you're staring at.
    ko: 뭘 그렇게 뚫어지게 보고만 있냐고.
    ja: なぜ私を黙って見ているのかと聞いている。
  event_absolute1_intermission_01_7:
    speaker: eunhwa
    en: You gonna say something, or just stand there like a statue all day?
    ko: 왔으면 말을 할 것이지.
    ja: 来たならひとこと言うぐらいしろ。
  event_absolute1_intermission_01_8:
    speaker: emma
    en: Now now, Eunhwa, let's take it easy on the new arrival.
    ko: 어휴~ 이제 막 온 신입한테 뭐라고 하는 거야~
    ja: |-
      ダメよ～？せっかく来てくれた子に
      そんなこと言わないの～
  event_absolute1_intermission_01_9:
    speaker: emma
    en: Nice to meet you. You're Vesti, right?
    ko: 반가워. 네가 베스티지?
    ja: 初めまして。あなたがベスティー？
  event_absolute1_intermission_01_10:
    speaker: vesti
    en: Oh. I-I'm Vesti...
    ko: 어, 으, 응… 마, 맞아. 베스티….
    ja: |-
      あ、う、うん…私がベスティーだよ。
      初めまして…
  event_absolute1_intermission_01_11:
    speaker: emma
    en: I'm Emma. Let's get along well, okay?
    ko: "난 엠마라고 해. \n앞으로 잘 부탁해~"
    ja: |-
      私はエマ。
      これからよろしくね～
  event_absolute1_intermission_01_12:
    speaker: rapi
    en: I'm Rapi. Looking forward to working with you.
    ko: |-
      라피라고 해.
      잘 부탁해.
    ja: |-
      私はラピ。
      よろしく。
  event_absolute1_intermission_01_13:
    speaker: vesti
    en: N-nice to meet you all.
    ko: 나, 나도 잘 부탁해….
    ja: こ、こちらこそよろしくね…
  event_absolute1_intermission_01_14:
    speaker: eunhwa
    en: If you're done with the greetings, come this way.
    ko: 인사 다 했으면 이쪽으로 와.
    ja: 顔合わせが済んだらさっさとこっちに来い。
  event_absolute1_intermission_01_15:
    speaker: eunhwa
    en: We've got a mission briefing to do.
    ko: 작전 회의하게.
    ja: 作戦会議を始めるぞ。
  event_absolute1_intermission_01_16:
    speaker: emma
    en: Oh, come on, Eunhwa, you've got to introduce yourself too.
    ko: 에이. 그래도 인사는 해야지~
    ja: え～？あいさつぐらい、いいじゃない～
  event_absolute1_intermission_01_17:
    speaker: eunhwa
    en: You already know my name.
    ko: 내 이름 이미 알잖아.
    ja: ふん、名前は分かっているはずだ。
  event_absolute1_intermission_01_18:
    speaker: eunhwa
    en: I'm sure you've already been briefed on us.
    ko: 정보 이미 다 듣고 왔을 거 아니야.
    ja: 事前の情報確認ぐらいはしているだろう。
  event_absolute1_intermission_01_19:
    speaker: vesti
    en: Uh... I-I do. They told me everything.
    ko: 어… 어… 마, 맞아. 다 듣고 왔어.
    ja: あ…えっと…し、してるけど…
  event_absolute1_intermission_01_20:
    speaker: emma
    en: But still, she's going to be one of us now. So come on, say hello, okay?
    ko: "그래도. \n앞으로 우리랑 함께할 동료잖아~ 얼른. 응?"
    ja: |-
      それでもよ。
      これから一緒に戦う仲間なんだから、ねっ？
  event_absolute1_intermission_01_21:
    speaker: eunhwa
    en: "*Sigh*..."
    ko: 하아….
    ja: はぁ…
  event_absolute1_intermission_01_22:
    speaker: eunhwa
    en: I'm Eunhwa.
    ko: 은화다.
    ja: ウンファだ。
  event_absolute1_intermission_01_23:
    speaker: "<Monologue>"
    en: I really thought I wouldn't be able to get along with her.
    ko: 진짜 얘랑은 잘 지낼 수 없겠다고 생각했어.
    ja: |-
      あの時、この人とは絶対に
      仲良くできないだろうなって思ったんだよね
  event_absolute1_intermission_01_24:
    speaker: "<Monologue>"
    en: I couldn't understand why I had to be with someone like her,
    ko: 내가 왜 저런 애랑 같이 있는지,
    ja: どうしてあんな人と一緒にいなきゃいけないのか
  event_absolute1_intermission_01_25:
    speaker: "<Monologue>"
    en: why I ended up joining Absolute...
    ko: 왜 내가 앱솔루트에 들어오게 되었는지… 전부 이해할 수 없었어.
    ja: |-
      なんで私がアブソルートに配属されたのか…
      なんにも分からなかった
  event_absolute1_intermission_01_26:
    speaker: "<Monologue>"
    en: I think I wanted to run away so many times.
    ko: 몇 번이고 도망치고 싶었던 것 같아.
    ja: 何度も何度も、逃げだしたいって思った
  event_absolute1_intermission_01_27:
    speaker: "<Monologue>"
    en: But then, on the day of our first mission...
    ko: 그런데 첫 임무를 했던 날….
    ja: でも、初めての任務があった日…
  event_absolute1_intermission_01_28:
    speaker: eunhwa
    en: Hey.
    ko: 야.
    ja: おい。
  event_absolute1_intermission_01_29:
    speaker: vesti
    en: Y-yes?
    ko: 으, 응?
    ja: え…えっ？
  event_absolute1_intermission_01_30:
    speaker: eunhwa
    en: Are you scared?
    ko: 쫄았냐?
    ja: 怖いのか？
  event_absolute1_intermission_01_31:
    speaker: vesti
    en: M-me? Uh... well...
    ko: 나, 나? 그… 그게….
    ja: わ、私が？そ…それは…
  event_absolute1_intermission_01_32:
    speaker: "<Narration>"
    en: "*Tremble*"
    ko: 덜덜덜덜-
    ja: ガタガタガタ…
  event_absolute1_intermission_01_33:
    speaker: eunhwa
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_intermission_01_34:
    speaker: eunhwa
    en: I heard you got some of the highest test scores they've ever seen. Is that
      true?
    ko: 너 테스트에서 역대 최고 성적 냈다며. 아니야?
    ja: |-
      テストでは史上最高の成績だったらしいな。
      違ったか？
  event_absolute1_intermission_01_35:
    speaker: vesti
    en: Y-yeah... I did, but...
    ko: 으, 응… 그건 그런데….
    ja: え、えっと…違わないけど…
  event_absolute1_intermission_01_36:
    speaker: eunhwa
    en: Then what are you so scared of?
    ko: 그런데 뭘 그렇게 쫄고 앉았냐.
    ja: だったら、何を恐れる必要がある？
  event_absolute1_intermission_01_37:
    speaker: eunhwa
    en: I heard you're a monster on the battlefield.
    ko: 너 괴물이라며.
    ja: バケモノだと聞いている。
  event_absolute1_intermission_01_38:
    speaker: vesti
    en: N-no... that's just a nickname...
    ko: 지, 진짜… 괴, 괴물은 아니고… 벼, 별명이 그거라서….
    ja: |-
      ほ、本当にそうなんじゃなくて…
      ま、周りにそう呼ばれてるだけで…
  event_absolute1_intermission_01_39:
    speaker: vesti
    en: This is my first time on a real mission... I'm nervous that it might not go
      well...
    ko: "이, 임무를 해보는 건… 처음이니까… \n자, 잘 안될 수도 있으니까… 긴장돼서."
    ja: |-
      こ、これが初めての任務だから…
      失敗したらって思ったら…緊張しちゃって…
  event_absolute1_intermission_01_40:
    speaker: eunhwa
    en: You don't get to decide whether a mission will succeed or fail.
    ko: 임무에서 넌 될 거다, 안될 거다를 판단하지 마.
    ja: 自分がうまくやれるかなど、考えなくていい。
  event_absolute1_intermission_01_41:
    speaker: eunhwa
    en: I do.
    ko: 판단은 어차피 내가 해.
    ja: それは私が判断することだ。
  event_absolute1_intermission_01_42:
    speaker: eunhwa
    en: And my tactics always succeed.
    ko: 그리고 내 작전은 반드시 승리한다.
    ja: まあ、私たちの作戦に失敗はないがな。
  event_absolute1_intermission_01_43:
    speaker: eunhwa
    en: Even if the plan looks impossible, I'll charge in again and again
    ko: 승리할 수 없는 작전을 세웠더라도, 몇 번이고 달려들어서.
    ja: たとえ勝てない戦いだろうと、勝つまで戦う。
  event_absolute1_intermission_01_44:
    speaker: eunhwa
    en: until I turn it into a victory.
    ko: 반드시 성공한 작전으로 만들어 보일 거야.
    ja: 必ず成功させてやる。
  event_absolute1_intermission_01_45:
    speaker: vesti
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_intermission_01_46:
    speaker: eunhwa
    en: So,
    ko: 그러니까.
    ja: それだけだ。
  event_absolute1_intermission_01_47:
    speaker: eunhwa
    en: don't be scared.
    ko: 쫄지 마.
    ja: 恐れるな。
  event_absolute1_intermission_01_48:
    speaker: eunhwa
    en: So long as we use the most perfect tactics,
    ko: 가장 완벽한 전술로,
    ja: 誰より完璧な戦術をとり
  event_absolute1_intermission_01_49:
    speaker: eunhwa
    en: no matter the enemy or situation...
    ko: 어떤 적이든, 어떤 상황이든…!
    ja: あらゆる敵も、状況もはね返し…
  event_absolute1_intermission_01_50:
    speaker: eunhwa
    en: we will always clinch a flawless victory.
    ko: 반드시 완벽하게 승리해 내는 것.
    ja: 必ず完璧な勝利にする。
  event_absolute1_intermission_01_51:
    speaker: eunhwa
    en: That's what makes us,
    ko: 그것이 우리,
    ja: それが私たち…
  event_absolute1_intermission_01_52:
    speaker: eunhwa
    en: the Absolute Squad.
    ko: 앱솔루트다.
    ja: アブソルートだ。
  event_absolute1_intermission_01_53:
    speaker: vesti
    en: O-okay!
    ko: 으, 응…!
    ja: う、うん…！
  event_absolute1_intermission_01_54:
    speaker: "<Monologue>"
    en: That was...
    ko: 그때.
    ja: あの時
  event_absolute1_intermission_01_55:
    speaker: "<Monologue>"
    en: the first time Eunhwa really looked cool to me.
    ko: 처음으로 은화가 멋져 보였던 것 같아.
    ja: 初めてウンファがカッコよく見えた
  event_absolute1_intermission_01_56:
    speaker: "<Monologue>"
    en: Her eyes were filled with such confidence when she spoke of victory.
    ko: 승리를 향한 확신 어린 눈.
    ja: 勝利への確信に満ちた眼差しが…
  event_absolute1_intermission_01_57:
    speaker: "<Monologue>"
    en: Those shining eyes were just so captivating...
    ko: 그 빛나는 눈이 너무 멋져서….
    ja: あのキラキラした目が、本当にカッコよくて…
  event_absolute1_intermission_01_58:
    speaker: eunhwa
    en: All you need to do is trust me, follow my orders,
    ko: 그러니 넌 내 지시만 믿고 따라와.
    ja: |-
      お前はただ、
      私の指示を信じてついてくればいい。
  event_absolute1_intermission_01_59:
    speaker: eunhwa
    en: and use those crazy powers of yours to score a direct hit on our enemies'
      ugly mugs.
    ko: 내 지시에 따라서 그 괴물 같은 힘을,
    ja: |-
      指示する通りに、
      お前のバケモノと呼ばれる力を…
  event_absolute1_intermission_01_60:
    speaker: eunhwa
    en: Got that?
    ko: 저것들에게 한 방 제대로 먹여주기만 하면 되는 거라고. 알겠어?
    ja: |-
      思い切り1発、叩き込んでやれ。
      分かったか？
  event_absolute1_intermission_01_61:
    speaker: rapi
    en: A single hit won't be nearly enough to take down a Tyrant-class Rapture.
    ko: 은화, 한 방만 먹이는 것으로는 타일런트 급 랩쳐를 물리칠 수 없어.
    ja: ウンファ、1発でタイラント級の撃破は困難よ。
  event_absolute1_intermission_01_62:
    speaker: eunhwa
    en: You think I don't know that?
    ko: 누가 그걸 몰라서 이러는 줄 알아?
    ja: "…ものの例えだ、分かってるだろうが。"
  event_absolute1_intermission_01_63:
    speaker: emma
    en: Hehe. I see what you're doing.
    ko: 후후, 그럼 그럼~
    ja: ふふ、ウンファはね～
  event_absolute1_intermission_01_64:
    speaker: emma
    en: You're trying to comfort our new recruit.
    ko: 은화가 우리 막내를 위로해 주려고 한 거 잘 알지~
    ja: |-
      かわいい末っ子のことが
      心配でたまらないのよね～？
  event_absolute1_intermission_01_65:
    speaker: eunhwa
    en: Shut up!
    ko: 시끄러!
    ja: うるさい！
  event_absolute1_intermission_01_66:
    speaker: vesti
    en: As the youngest member...
    ko: 우리… 막내.
    ja: す…末っ子…
  event_absolute1_intermission_01_67:
    speaker: "<Monologue>"
    en: In time, I grew to really love the Absolute Squad.
    ko: 앱솔루트 스쿼드가 너무 좋아졌어.
    ja: アブソルートのことが、すごく好きになった
  event_absolute1_intermission_01_68:
    speaker: "<Monologue>"
    en: It felt amazing to belong here. I loved that.
    ko: 내가 이곳에 속해있다는 게, 너무 좋았어.
    ja: ここに配属されて、本当によかったって思った
  event_absolute1_intermission_01_69:
    speaker: eunhwa
    en: Let's go. Time to get this mission underway.
    ko: 자, 가자. 임무 시간이다.
    ja: チッ…行くぞ。仕事の時間だ。
  event_absolute1_intermission_01_70:
    speaker: emma
    en: All right!
    ko: 좋아~
    ja: は～い。
  event_absolute1_intermission_01_71:
    speaker: rapi
    en: Roger.
    ko: 라져.
    ja: ラジャー。
  event_absolute1_intermission_01_72:
    speaker: vesti
    en: O-okay!
    ko: 으, 응…!
    ja: う、うん…！
  event_absolute1_intermission_01_73:
    speaker: "<Monologue>"
    en: I wanted to become as amazing as they were,
    ko: 나도 저 애들처럼 멋지게 되고 싶다고 생각했던 것 같아.
    ja: |-
      私もこの人たちみたいに、
      カッコよくなりたいって思った
  event_absolute1_intermission_01_74:
    speaker: "<Monologue>"
    en: so I really put my best foot forward...
    ko: 그래서 정말 열심히 했는데….
    ja: そう思って、一生懸命努力してたのに…
  event_absolute1_intermission_01_75:
    speaker: ingrid
    en: Starting today, Rapi will no longer be part of Absolute.
    ko: 라피는 오늘부로 앱솔루트에서 제외한다.
    ja: |-
      本日をもって、
      ラピはアブソルートから脱退となる。
  event_absolute1_intermission_01_76:
    speaker: ingrid
    en: From now on, missions will be carried out by the three of you only.
    ko: "앞으로는 너희 세 명으로 임무에 임해야 한다. \n참고하도록."
    ja: |-
      今後の任務はお前たち3人で臨んでもらう。
      以上だ。
  event_absolute1_intermission_01_77:
    speaker: vesti
    en: R-Rapi...?! W-why?
    ko: |-
      라, 라피가…?!
      왜, 왜?
    ja: |-
      ラ、ラピが！？
      ど、どうして…？
  event_absolute1_intermission_01_78:
    speaker: eunhwa
    en: What's going on here?
    ko: 갑자기 그게 무슨 말이야.
    ja: いきなりどういうことだ。
  event_absolute1_intermission_01_79:
    speaker: eunhwa
    en: What's Rapi done? What's going to happen to Absolute?
    ko: |-
      라피가 뭐 어쨌다고?
      앱솔루트가 어떻게 된다고?
    ja: |-
      ラピが何かしたのか？
      それではアブソルートはどうなる？
  event_absolute1_intermission_01_80:
    speaker: emma
    en: Ingrid. Did something happen to Rapi?
    ko: |-
      잉그리드.
      라피에게 무슨 일이라도 있는 거야?
    ja: |-
      イングリッド。
      ラピに何かあったの？
  event_absolute1_intermission_01_81:
    speaker: emma
    en: This is all so sudden...
    ko: 왜 갑자기….
    ja: どうして急に…
  event_absolute1_intermission_01_82:
    speaker: eunhwa
    en: I won't stand for it.
    ko: 난 용납 못 해.
    ja: 私は認めないぞ。
  event_absolute1_intermission_01_83:
    speaker: eunhwa
    en: Absolute is at its strongest when it's all four of us!
    ko: 앱솔루트는 우리 넷일 때 최강…!
    ja: アブソルートは、4人揃って最強の…！
  event_absolute1_intermission_01_84:
    speaker: ingrid
    en: It was her own request.
    ko: 본인의 요청이었다.
    ja: この件は、本人の意向によるものだ。
  event_absolute1_intermission_01_85:
    speaker: emma
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_intermission_01_86:
    speaker: vesti
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_intermission_01_87:
    speaker: eunhwa
    en: What...?
    ko: 뭐…?
    ja: なに…？
  event_absolute1_intermission_01_88:
    speaker: ingrid
    en: It was what she wanted.
    ko: 본인이 원한 거다.
    ja: ラピの希望だ。
  event_absolute1_intermission_01_89:
    speaker: eunhwa
    en: What... she wanted?
    ko: 본인이… 원한 거라고?
    ja: ラピが…望んだことだと？
  event_absolute1_intermission_01_90:
    speaker: ingrid
    en: "... Yes. I tried persuading her several times, but she was stubborn."
    ko: "…그래. \n몇 번이고 설득했지만 완고했다."
    ja: |-
      …そうだ。
      説得は何度もしたが、
      意思は変えられなかった。
  event_absolute1_intermission_01_91:
    speaker: ingrid
    en: It seemed there was some reason she couldn't speak of.
    ko: 뭔가… 말할 수 없는 사연이 있는 듯했다.
    ja: 何か…口に出したくない事情があるのだろう。
  event_absolute1_intermission_01_92:
    speaker: ingrid
    en: So, please understand.
    ko: 그러니 이해해 줘라.
    ja: 分かってやってくれ。
  event_absolute1_intermission_01_93:
    speaker: emma
    en: Rapi... Oh... I see...
    ko: 라피가… 그랬… 구나.
    ja: "…そう。ラピが…"
  event_absolute1_intermission_01_94:
    speaker: vesti
    en: Rapi...
    ko: 라피….
    ja: ラピ…
  event_absolute1_intermission_01_95:
    speaker: eunhwa
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_intermission_01_96:
    speaker: eunhwa
    en: So she's leaving? Just like that?
    ko: 이렇게… 나간다고.
    ja: 何も言わずに…辞めるだと…
  event_absolute1_intermission_01_97:
    speaker: eunhwa
    en: Without any explanation?
    ko: 말할 수 없는 사정?
    ja: 口に出せない事情？
  event_absolute1_intermission_01_98:
    speaker: eunhwa
    en: No.
    ko: "…난 납득 못 해."
    ja: "…納得できない。"
  event_absolute1_intermission_01_99:
    speaker: eunhwa
    en: I can't accept that.
    ko: 아니, 안 해!
    ja: いいや、納得なんてしてやるか！
  event_absolute1_intermission_01_100:
    speaker: eunhwa
    en: Not until I hear it from her!
    ko: 난 아직 그녀석에게 아무 말도 못들었으니까!
    ja: まだ、あいつから何も聞いちゃいない！
  event_absolute1_intermission_01_101:
    speaker: "<Narration>"
    en: Eunhwa runs out.
    ko: 은화가 밖으로 뛰어나갔다.
    ja: ウンファが外に飛び出した
  event_absolute1_intermission_01_102:
    speaker: emma
    en: Eunhwa!
    ko: 은화!!
    ja: ウンファ！！
  event_absolute1_intermission_01_103:
    speaker: ingrid
    en: "*Sigh*..."
    ko: 하아….
    ja: はぁ…
  event_absolute1_intermission_01_104:
    speaker: vesti
    en: W-why did this...
    ko: 왜, 왜 이런 일이….
    ja: ど、どうしてこんなことに…
  event_absolute1_intermission_01_105:
    speaker: "<Monologue>"
    en: After Rapi left,
    ko: 라피가 나가고….
    ja: ラピが部隊を辞めた後…
  event_absolute1_intermission_01_106:
    speaker: "<Monologue>"
    en: Eunhwa kept looking for her everywhere.
    ko: 은화가 수도 없이 라피를 찾아 헤매면서.
    ja: |-
      ウンファは来る日も来る日も、
      ラピの姿を捜すようになった
  event_absolute1_intermission_01_107:
    speaker: "<Monologue>"
    en: It was as if we were frozen in time, forever stuck in the past.
    ko: 언제부턴가… 우린 계속 그날, 그 자리에 멈춰 있었던 것 같아.
    ja: |-
      気づいてみれば…私たちの時間はずっと、
      あの日、あの場所で止まっていた気がする
  event_absolute1_intermission_01_108:
    speaker: "<Monologue>"
    en: So, when they decided to carry out the Tactical Upgrade plan,
    ko: 그래서 택티컬 업 플랜을 한다고 했을 때.
    ja: |-
      だから、タクティカル・アップ計画を
      進めようって言われた時…
  event_absolute1_intermission_01_109:
    speaker: "<Monologue>"
    en: despite what happened with Behemoth, I was honestly thrilled.
    ko: 베히모스에게 그렇게나 당해놓고도, 내심 너무 기뻤어.
    ja: |-
      ベヒモスにボコボコにされた
      悔しさが吹き飛んで、
      嬉しい気持ちでいっぱいになった
  event_absolute1_intermission_01_110:
    speaker: "<Monologue>"
    en: It finally felt like we could move forward.
    ko: 우리도 앞으로 나아갈 수 있는 것 같아서.
    ja: やっと、前に進めるような気がしたから
  event_absolute1_intermission_01_111:
    speaker: "<Monologue>"
    en: Just as Rapi was.
    ko: 우리랑 다른 길을 선택했지만, 앞을 향해 나아가고 있는 라피처럼.
    ja: |-
      私たちと違う道だけど、
      前に向かって進んでるラピみたいに…
  event_absolute1_intermission_01_112:
    speaker: "<Monologue>"
    en: She'd chosen a different path, but was still moving forward. Maybe we could
      do the same.
    ko: 우리도… 앞으로 나아갈 수 있을 것 같아서.
    ja: 私たちも…もう前に進めるんだって
  event_absolute1_intermission_01_113:
    speaker: "<Monologue>"
    en: But then...
    ko: 그런데….
    ja: なのに…
  event_absolute1_intermission_01_114:
    speaker: vesti_t
    en: Th-then why do you always do everything on your own, Eunhwa?
    ko: 그, 그럼 왜 으, 은화가 다 하려는 거야?
    ja: |-
      じゃ、じゃあ、どうして
      全部1人でやろうとするの？
  event_absolute1_intermission_01_115:
    speaker: vesti_t
    en: I-I'm not who I used to be anymore.
    ko: 나, 나는 이제 이전의 그 모습이 아닌데.
    ja: 私だってもう、昔の私じゃないのに。
  event_absolute1_intermission_01_116:
    speaker: vesti_t
    en: So why... do you keep telling me to stay at the back?
    ko: 자꾸… 왜 뒤에만 있으라고 하는 거야?
    ja: なんで…いつも引っ込んでろって言うの？
  event_absolute1_intermission_01_117:
    speaker: vesti_t
    en: Is it because... when I stayed behind to fight with Behemoth...
    ko: 베히모스랑 싸우라고 남았을 때….
    ja: は、初めてベヒモスと戦った時に…
  event_absolute1_intermission_01_118:
    speaker: vesti_t
    en: I... I lost?
    ko: 내, 내가 져서 그래?
    ja: わ、私が負けたから？
  event_absolute1_intermission_01_119:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: は？
  event_absolute1_intermission_01_120:
    speaker: vesti_t
    en: Is that why you don't trust me anymore? Because I couldn't win back then...
    ko: 그때 이기지 못해서… 이젠 날 믿을 수 없어진 거야?
    ja: |-
      あの時勝てなかったせいで…
      私のこと、信じられなくなったの？
  event_absolute1_intermission_01_121:
    speaker: eunhwa_t
    en: "... Enough already."
    ko: "…시끄러워."
    ja: "…いい加減にしろ。"
  event_absolute1_intermission_01_122:
    speaker: eunhwa_t
    en: Stop whining, would you? You're getting in your own head.
    ko: 이상한 생각에 빠져서 어리광 부리지 마.
    ja: |-
      くだらない思い込みで、
      訳の分からないことを言うな。
  event_absolute1_intermission_01_123:
    speaker: "<Monologue>"
    en: When I saw Eunhwa leave,
    ko: 그때 나가버리는 은화를 보면서,
    ja: あの時、出ていったウンファの背中を見ながら…
  event_absolute1_intermission_01_124:
    speaker: "<Monologue>"
    en: I got scared that we'd end up getting stuck in the same spot again.
    ko: 또 멈추게 되는 걸까… 라고, 생각했던 거 같아.
    ja: また止まっちゃうのかな…って思った
  event_absolute1_intermission_01_125:
    speaker: "<Monologue>"
    en: Are we doomed to be like this forever?
    ko: 우린 정말 이대로 멈춰버리는 수밖에 없는 걸까?
    ja: "…本当にこのまま、止まっちゃうの？"
  event_absolute1_intermission_01_126:
    speaker: "<Monologue>"
    en: I don't want that.
    ko: 나는 그러기 싫어.
    ja: もう、そんなのはイヤ
  event_absolute1_intermission_01_127:
    speaker: vesti_t
    en: I...
    ko: 나는…!
    ja: 私は…！
  event_absolute1_intermission_01_128:
    speaker: emma_t
    en: Vesti?
    ko: 베스티는~?
    ja: ベスティー？
  event_absolute1_intermission_01_129:
    speaker: vesti_t
    en: Y-yes?
    ko: 으, 응?
    ja: え…えっ？
  event_absolute1_intermission_01_130:
    speaker: vesti_t
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_absolute1_intermission_01_131:
    speaker: emma_t
    en: Hello there, sleepyhead.
    ko: 일어났어?
    ja: 目が覚めた？
  event_absolute1_intermission_01_132:
    speaker: vesti_t
    en: E-Emma?
    ko: 에, 엠마?
    ja: エ、エマ…？
event_absolute1_04_s:
  event_absolute1_04_s_1:
    speaker: emma_t
    en: I kept calling but you wouldn't wake up, so I came to wake you myself.
    ko: 아무리 불러도 안 일어나길래, 깨우러 왔어.
    ja: いくら呼んでも起きないから、起こしに来たの～
  event_absolute1_04_s_2:
    speaker: vesti_t
    en: M-me?
    ko: 나, 나를?
    ja: わ、私を？
  event_absolute1_04_s_3:
    speaker: vesti_t
    en: "... Why?"
    ko: "…왜?"
    ja: "…どうして？"
  event_absolute1_04_s_4:
    speaker: emma_t
    en: You're the one who said
    ko: 베스티가 그랬잖아.
    ja: もう、ベスティーが言ったのよ～？
  event_absolute1_04_s_5:
    speaker: emma_t
    en: we should all go have fun today, remember?
    ko: 오늘 다 같이 놀러 가자고.
    ja: 今日はみんなで遊びに行くんだ～って。
  event_absolute1_04_s_6:
    speaker: emma_t
    en: So of course I came!
    ko: 그래서 왔지~?
    ja: それで来たのよ～？
  event_absolute1_04_s_7:
    speaker: vesti_t
    en: W-what time is it now?
    ko: 지, 지금 몇 신데?
    ja: い、いま何時？
  event_absolute1_04_s_8:
    speaker: emma_t
    en: A little past three.
    ko: 세시 좀 넘었지?
    ja: 3時をちょっと過ぎたところね～
  event_absolute1_04_s_9:
    speaker: vesti_t
    en: Th-three o'clock?!
    ko: "!! 세, 세시?"
    ja: "！！さ、3時？"
  event_absolute1_04_s_10:
    speaker: vesti_t
    en: Oh n-no!
    ko: 어, 어어 어떡해!
    ja: ど、どど、どうしよう！
  event_absolute1_04_s_11:
    speaker: vesti_t
    en: I was supposed to wake up early to get through all the stuff I wrote down...
    ko: 아침 일찍 일어나야, 적어둔 것들 다 해볼 수 있었는데.
    ja: |-
      早起きして、メモしたこと全部
      やるつもりだったのに…
  event_absolute1_04_s_12:
    speaker: emma_t
    en: The stuff you wrote down?
    ko: 적어둔 것들?
    ja: メモしたこと？
  event_absolute1_04_s_13:
    speaker: vesti_t
    en: Y-yeah.
    ko: 으, 응.
    ja: う、うん。
  event_absolute1_04_s_14:
    speaker: vesti_t
    en: I jotted down some things I wanted us to do together.
    ko: 다 같이 하려고 이것저것 적어뒀거든.
    ja: |-
      みんなで一緒にやりたいこと、
      いろいろメモしておいたの。
  event_absolute1_04_s_15:
    speaker: emma_t
    en: Hehe, I see.
    ko: 후후, 그렇구나~
    ja: ふふ、そうだったのね～
  event_absolute1_04_s_16:
    speaker: emma_t
    en: Mind if I ask what you had planned for today?
    ko: 원래 오늘 계획이 뭐였는지 물어봐도 될까?
    ja: |-
      どういう予定だったのか、
      聞いてもいいかしら～？
  event_absolute1_04_s_17:
    speaker: vesti_t
    en: W-well... nothing special, really.
    ko: 트, 특별한 건 아니고….
    ja: た、大したことじゃないけど…
  event_absolute1_04_s_18:
    speaker: vesti_t
    en: F-first, I was planning to...
    ko: 이, 일단은….
    ja: ええと、最初は…
  event_absolute1_04_s_19:
    speaker: vesti_t
    en: go shopping on Royal Road.
    ko: 로열 로드에 가서 쇼핑하려고 했어.
    ja: |-
      ロイヤルロードに行って、
      買い物をするつもりだったの。
  event_absolute1_04_s_20:
    speaker: vesti_t
    en: It's been a long time since I last saw Eunhwa in casual clothes.
    ko: 그… 은화 사복 차림 본지 오래됐잖아.
    ja: |-
      ほら…ウンファが私服着てるの、
      最近全然見てないし…
  event_absolute1_04_s_21:
    speaker: vesti_t
    en: And... you said your clothes haven't been fitting you lately, too.
    ko: 엠마도 요새 옷 사이즈가 안 맞는다고 했고.
    ja: |-
      エマも最近、服のサイズが合わないって
      言ってたから…
  event_absolute1_04_s_22:
    speaker: emma_t
    en: Oh wow, you remembered!
    ko: 어머. 기억해 주고 있었네~
    ja: まあ、覚えてくれてたのね～
  event_absolute1_04_s_23:
    speaker: vesti_t
    en: I mean, I did see one of your buttons pop right off in front of me...
    ko: 그야 눈앞에서 엠마 단추가 터지는 걸 봤으니까….
    ja: |-
      それは、目の前で服のボタンが
      弾けて飛んでいったら…
  event_absolute1_04_s_24:
    speaker: vesti_t
    en: A-anyway,
    ko: 아, 아무튼.
    ja: と、とにかく。
  event_absolute1_04_s_25:
    speaker: vesti_t
    en: I thought maybe we could pick out outfits for each other.
    ko: 이참에 서로한테 어울리는 옷 골라주면 어떨까 했어.
    ja: |-
      せっかくだから、みんなでお互いに似合う服を
      選ぶのはどうかなって。
  event_absolute1_04_s_26:
    speaker: emma_t
    en: Eunhwa in casual clothes...
    ko: 은화의 사복 차림이라~
    ja: ウンファの私服ねぇ～
  event_absolute1_04_s_27:
    speaker: emma_t
    en: It's been a while since I've seen her dressed like that.
    ko: 못 본 지 꽤 되긴 했네.
    ja: 最後に見たのはいつだったかしら～
  event_absolute1_04_s_28:
    speaker: emma_t
    en: The last time was probably when she wore that sky-blue dress, wasn't it?
    ko: 마지막으로 본 게 아마 하늘색 원피스 입었을 때였지?
    ja: 確か、あの時は水色のワンピースだったわね～？
  event_absolute1_04_s_29:
    speaker: vesti_t
    en: Y-yeah, that's right.
    ko: 마, 맞아.
    ja: そう、それ。
  event_absolute1_04_s_30:
    speaker: vesti_t
    en: She used to wear dresses a lot at the dorm because she said they were comfortable,
      but she doesn't even do that anymore.
    ko: 예전엔 편하다고 숙소에서 원피스 자주 입었었는데, 요샌 그러지도 않잖아.
    ja: |-
      前はラクだからって、
      宿所でもよく着てたけど…
      最近全然着なくなったよね。
  event_absolute1_04_s_31:
    speaker: emma_t
    en: Hmm, maybe it's because you keep trying to take pictures of her.
    ko: 음, 베스티가 자꾸만 사진 찍으려고 해서 그런 게 아닐까?
    ja: |-
      う～ん、ベスティーがしつこく
      写真を撮ろうとしたからじゃない？
  event_absolute1_04_s_32:
    speaker: vesti_t
    en: B-but it'd be such a shame if I were the only one to see her like that.
    ko: 그, 그치만 나 혼자 보기엔 아까운걸.
    ja: |-
      だ、だって、私しか知らないのは
      もったいないし…
  event_absolute1_04_s_33:
    speaker: vesti_t
    en: Also, having the pictures comes in handy for teasing her later, hehe.
    ko: 사진 갖고 있어야 나중에 놀리기에도 좋고. 헤헤.
    ja: |-
      撮っておけば、からかうのに使えるし…
      えへへ。
  event_absolute1_04_s_34:
    speaker: vesti_t
    en: It's really hard to make Eunhwa shake like that, you know.
    ko: 초진동 은화 만드는 거 어렵단 말이야.
    ja: 超ぶるぶるウンファにするのに必要なの。
  event_absolute1_04_s_35:
    speaker: emma_t
    en: Hehe, that's true.
    ko: 후후, 그건 그래.
    ja: うふふ、それはそうね～
  event_absolute1_04_s_36:
    speaker: emma_t
    en: So, what were you thinking of doing after shopping?
    ko: 쇼핑하고 나선 뭐 하려고 했어?
    ja: |-
      それで？
      買い物の後は何をするつもりだったの～？
  event_absolute1_04_s_37:
    speaker: vesti_t
    en: A-after shopping,
    ko: 쇼, 쇼핑하고 나서는….
    ja: か、買い物をした後は…
  event_absolute1_04_s_38:
    speaker: vesti_t
    en: we'd visit a toy store,
    ko: 장난감 가게 구경하고….
    ja: おもちゃ屋でぶらぶらして…
  event_absolute1_04_s_39:
    speaker: vesti_t
    en: eat parfaits at the cafe...
    ko: 카페에서 파르페도 먹고….
    ja: カフェでパフェも食べて…
  event_absolute1_04_s_40:
    speaker: vesti_t
    en: and I was thinking we could end it off with a pajama party...
    ko: 마지막은 파자마 파티로 끝낼 생각이었는데….
    ja: |-
      最後は、パジャマパーティーする
      つもりだったんだけど…
  event_absolute1_04_s_41:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_04_s_42:
    speaker: emma_t
    en: Looks like we've got a lot to do, huh?
    ko: 할 게 많네~
    ja: やることがいっぱいね～
  event_absolute1_04_s_43:
    speaker: emma_t
    en: How about we get up and get ready?
    ko: 이만 일어나서 나갈 준비 할까?
    ja: じゃあ、出かける準備をしましょ？
  event_absolute1_04_s_44:
    speaker: vesti_t
    en: O-okay!
    ko: 으, 응!
    ja: う、うん！
  event_absolute1_04_s_45:
    speaker: "<Narration>"
    en: Vesti starts to get up, then stops in her tracks.
    ko: 베스티는 몸을 일으키다가 멈춰 섰다.
    ja: |-
      ベスティーは起き上がろうとしたが、
      動きを止めた
  event_absolute1_04_s_46:
    speaker: vesti_t
    en: Uh... b-but...
    ko: 아… 그, 그런데.
    ja: あ…でも…
  event_absolute1_04_s_47:
    speaker: vesti_t
    en: I don't think... we can all go together...
    ko: 어차피… [다 같이]는 못하는 거잖아.
    ja: |-
      「みんなで一緒に」は…
      どうせ無理だよね…
  event_absolute1_04_s_48:
    speaker: vesti_t
    en: Eunhwa's... probably still mad...
    ko: 은화는… 화났을 테니까….
    ja: ウンファ…怒ってるだろうし…
  event_absolute1_04_s_49:
    speaker: emma_t
    en: Hmm, who knows?
    ko: 글쎄~
    ja: それはどうかしら～
  event_absolute1_04_s_50:
    speaker: vesti_t
    en: "... Never mind."
    ko: "…됐어."
    ja: "…や、やっぱりいい。"
  event_absolute1_04_s_51:
    speaker: vesti_t
    en: I'm just gonna sleep in.
    ko: 나 그냥 더 잘래.
    ja: もう一回寝るね。
  event_absolute1_04_s_52:
    speaker: emma_t
    en: Hmm, I guess it can't be helped.
    ko: 으음~ 어쩐다.
    ja: あら、どうしましょ～
  event_absolute1_04_s_53:
    speaker: emma_t
    en: Eunhwa was just waiting for you to wake up around lunchtime, you know.
    ko: 점심때까지만 해도, 은화가 베스티 일어나기만을 기다리고 있었는데~
    ja: |-
      お昼頃まで、ウンファも
      ベスティーが起きるのを待ってたんだけど～
  event_absolute1_04_s_54:
    speaker: vesti_t
    en: Eu-Eunhwa?
    ko: 으, 은화가?
    ja: ウ、ウンファが？
  event_absolute1_04_s_55:
    speaker: vesti_t
    en: Eunhwa was waiting for me?
    ko: 은화가 나, 나를 기다렸어?
    ja: ウンファが、わ、私を？
  event_absolute1_04_s_56:
    speaker: vesti_t
    en: She's not mad at me?
    ko: 나, 나한테 화난 거 아니었어?
    ja: お、怒ってないの？
  event_absolute1_04_s_57:
    speaker: emma_t
    en: Hmm, from what I heard, that's not really the case.
    ko: 글쎄~ 난 아니라고 들은 것 같은데~?
    ja: |-
      どうかしらね～？
      私が聞いた時は怒ってないって
      言ってた気がするけど～？
  event_absolute1_04_s_58:
    speaker: vesti_t
    en: R-really? You're not lying to me, right?
    ko: 지, 진짜야? 거, 거짓말 아니지?
    ja: ほ、本当？ウソじゃない？
  event_absolute1_04_s_59:
    speaker: emma_t
    en: Nope, Eunhwa said she'd spend the day with us.
    ko: 응. 오늘 하루 정도는 우리랑 같이 시간 보내겠다 하더라고.
    ja: |-
      ええ。一日ぐらいは私たちと一緒に
      過ごしてもいいって言ってたわよ～
  event_absolute1_04_s_60:
    speaker: emma_t
    en: After making lunch just now, she said she'd be in the Simulation Room for
      a bit
    ko: 아까 점심 만들어 놓고선
    ja: さっき、お昼ご飯を作った後に…
  event_absolute1_04_s_61:
    speaker: emma_t
    en: and asked me to let her
    ko: 잠깐 시뮬레이션 룸에 가 있을 테니,
    ja: シミュレーションルームにいるから
  event_absolute1_04_s_62:
    speaker: emma_t
    en: know as soon as you wake up...
    ko: 베스티 일어나는 대로 알려달라 했는데….
    ja: ベスティーが起きたら呼んでって言ってたわ～
  event_absolute1_04_s_63:
    speaker: emma_t
    en: Should I tell her you want to sleep a little longer?
    ko: 더 잔다고 하면 될까~?
    ja: |-
      二度寝するから行かないって
      伝えておきましょうか～？
  event_absolute1_04_s_64:
    speaker: vesti_t
    en: N-no!
    ko: 아, 아니!
    ja: ううん、行く！
  event_absolute1_04_s_65:
    speaker: vesti_t
    en: I'm awake!
    ko: 나 일어났어!
    ja: も、もうばっちり起きたから！
  event_absolute1_04_s_66:
    speaker: vesti_t
    en: I-I'll get ready super quick!
    ko: 어, 얼른 준비할게!
    ja: す、すぐに準備するね…！
  event_absolute1_04_s_67:
    speaker: "<Narration>"
    en: Vesti throws off her blanket and dashes to the shower.
    ko: 베스티가 이불을 집어 던지고 샤워실로 달려갔다.
    ja: |-
      ベスティーは布団を蹴飛ばし、
      シャワー室に飛び込んだ
  event_absolute1_04_s_68:
    speaker: emma_t
    en: Hehe, how adorable.
    ko: 후후, 귀여워라.
    ja: ふふ、かわいい。
event_absolute1_04_e:
  event_absolute1_04_e_1:
    speaker: "<Narration>"
    en: After a long battle...
    ko: 오랜 접전 끝.
    ja: 長い死闘の果て――
  event_absolute1_04_e_2:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_04_e_3:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: ズガン！
  event_absolute1_04_e_4:
    speaker: "<Narration>"
    en: Behemoth's core is pierced.
    ko: 베히모스의 코어가 꿰뚫렸다.
    ja: "――ベヒモスのコアに穴が開いた"
  event_absolute1_04_e_5:
    speaker: "<Narration>"
    en: Only after confirming that the body has fallen to pieces
    ko: 몸이 바스러지는 걸 끝까지 확인하고 나서야,
    ja: 砕け散るボディを最後まで見届け…
  event_absolute1_04_e_6:
    speaker: "<Narration>"
    en: does Eunhwa finally take her eyes away from the scope.
    ko: 은화는 스코프에서 눈을 뗐다.
    ja: ウンファがスコープから目を離した
  event_absolute1_04_e_7:
    speaker: eunhwa_t
    en: Enemy down.
    ko: 침묵 확인.
    ja: 目標沈黙。
  event_absolute1_04_e_8:
    speaker: eunhwa_t
    en: Good jo...
    ko: 고생했…
    ja: これなら…
  event_absolute1_04_e_9:
    speaker: "<Narration>"
    en: Eunhwa turns around...
    ko: 은화가 뒤를 돌아보았다.
    ja: ウンファは振り返って仲間を見ようとした
  event_absolute1_04_e_10:
    speaker: eunhwa_t
    en: "... b."
    ko: "…다."
    ja: "…くっ…"
  event_absolute1_04_e_11:
    speaker: "<Narration>"
    en: And sees Emma and Vesti collapsed on the ground.
    ko: "…쓰러져 있는 엠마와 베스티의 모습이 보였다."
    ja: "…エマとベスティーが倒れている"
  event_absolute1_04_e_12:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_04_e_13:
    speaker: "<Narration>"
    en: By now, Absolute has faced Behemoth alone dozens of times.
    ko: 앱솔루트 단독으로 베히모스와 맞서길 벌써 수십 차례.
    ja: |-
      アブソルート単独での
      対ベヒモス戦闘シミュレーション。
      繰り返すこと数十回…
  event_absolute1_04_e_14:
    speaker: "<Narration>"
    en: Even now, there's still no response from Emma or Vesti.
    ko: 이번에도 엠마와 베스티의 대답은 돌아오지 않았다.
    ja: 今回も、エマとベスティーの返事はなかった
  event_absolute1_04_e_15:
    speaker: eunhwa_t
    en: Damn it.
    ko: 제길.
    ja: クソッ。
  event_absolute1_04_e_16:
    speaker: "<Narration>"
    en: Eunhwa clenches her fist as she stares at her fallen squadmates.
    ko: 쓰러진 동료들을 바라보며 은화는 주먹을 쥐었다.
    ja: |-
      倒れ伏した仲間の姿を見て、
      ウンファは静かに拳を握った
  event_absolute1_04_e_17:
    speaker: eunhwa_t
    en: Simulation, reset.
    ko: 시뮬레이션, 초기화.
    ja: シミュレーション、初期化。
  event_absolute1_04_e_18:
    speaker: "<Narration>"
    en: The battle against Behemoth continues for quite some time afterward.
    ko: 베히모스와의 전투는 그 뒤로도 한참 이어졌고.
    ja: ウンファはシミュレーションと戦い続けた
  event_absolute1_04_e_19:
    speaker: "<Narration>"
    en: During this period, Eunhwa employs various tactics.
    ko: 그 사이 은화는 다양한 전술을 구사했다.
    ja: 様々な戦術を試した
  event_absolute1_04_e_20:
    speaker: "<Narration>"
    en: She persistently targets its joints, destroying its pincers first.
    ko: 관절부를 집요하게 노려 집게부터 파괴해 보기도 하고.
    ja: |-
      関節を集中的に狙い
      アームを優先的に破壊する作戦…
  event_absolute1_04_e_21:
    speaker: "<Narration>"
    en: She tries using the A Pillar.
    ko: A 필러를 이용해 보기도 하고.
    ja: Aピラーを利用した立ち回り…
  event_absolute1_04_e_22:
    speaker: "<Narration>"
    en: She pushes her firepower to end the fight before Behemoth grows larger, but...
    ko: 화력으로 밀어붙여 거대화하기 전에 어떻게든 전투를 끝내 보기도 했으나.
    ja: |-
      火力で畳みかけ、巨大化する前に
      戦闘を終わらせる試み…
  event_absolute1_04_e_23:
    speaker: "<Narration>"
    en: But the result is always the same.
    ko: 결과는 언제나 똑같았다.
    ja: 結果はいつも同じだった
  event_absolute1_04_e_24:
    speaker: eunhwa_t
    en: Simulation, reset.
    ko: 시뮬레이션, 초기화.
    ja: シミュレーション、初期化。
  event_absolute1_04_e_25:
    speaker: eunhwa_t
    en: Simulation, reset.
    ko: 시뮬레이션, 초기화.
    ja: シミュレーション、初期化。
  event_absolute1_04_e_26:
    speaker: eunhwa_t
    en: Simulation, reset.
    ko: 시뮬레이션, 초기화.
    ja: シミュレーション、初期化。
  event_absolute1_04_e_27:
    speaker: eunhwa_t
    en: Simulation...!
    ko: 시뮬레이션…!
    ja: シミュレーション――！
  event_absolute1_04_e_28:
    speaker: emma_t
    en: End.
    ko: 종료.
    ja: 終了～
  event_absolute1_04_e_29:
    speaker: emma_t
    en: I know it's just a simulation,
    ko: 시뮬레이션인 걸 알아도~
    ja: シミュレーションだって分かってはいるけど～
  event_absolute1_04_e_30:
    speaker: emma_t
    en: but there's no fun seeing myself fall like that. Hehe.
    ko: 내가 쓰러진 모습을 지켜보는 건 항상 힘들단 말이지. 후후.
    ja: |-
      倒れた自分を見るなんて、
      やっぱりイヤな気分ね。ふふ。
  event_absolute1_04_e_31:
    speaker: eunhwa_t
    en: What?
    ko: 뭐야.
    ja: "…何だ。"
  event_absolute1_04_e_32:
    speaker: eunhwa_t
    en: You were watching?
    ko: 지켜보고 있었냐.
    ja: 見てたのか。
  event_absolute1_04_e_33:
    speaker: emma_t
    en: Well...
    ko: 그게~
    ja: それがね～
  event_absolute1_04_e_34:
    speaker: emma_t
    en: I came to let you know Vesti's awake,
    ko: 베스티 일어났다고 알려주러 왔는데,
    ja: |-
      ベスティーが起きたって
      知らせに来たんだけど…
  event_absolute1_04_e_35:
    speaker: emma_t
    en: but it was kinda hard to find the right time to cut in.
    ko: 끼어들 타이밍 잡기가 애매하더라고.
    ja: 話しかけるタイミングがなかなかなくって。
  event_absolute1_04_e_36:
    speaker: eunhwa_t
    en: So you tried to contact me... Sorry about that.
    ko: "…연락했었군. 미안하다."
    ja: "…メッセージが来ていたな。すまない。"
  event_absolute1_04_e_37:
    speaker: vesti_t
    en: A-are the tactics not working?
    ko: 저, 전술이 잘 안 풀리는 거야?
    ja: そ、そんな難しい相手なの？
  event_absolute1_04_e_38:
    speaker: vesti_t
    en: I think the last time you stayed this long in the Simulation Room
    ko: 이렇게까지 오래 시뮬레이션 룸에 있는 건,
    ja: |-
      こんなに長くシミュレーションルームに
      こもってるのって
  event_absolute1_04_e_39:
    speaker: vesti_t
    en: was after our fight with Indivilia...
    ko: 인디빌리아랑 싸우고 나서 처음인 거 같은데….
    ja: インディビリアと戦った時以来じゃ…
  event_absolute1_04_e_40:
    speaker: eunhwa_t
    en: I'm just trying
    ko: "…그냥."
    ja: "…大したことじゃない。"
  event_absolute1_04_e_41:
    speaker: eunhwa_t
    en: to find a way to minimize our casualties.
    ko: 우리 측 피해를 최소화할 방법을 찾고 있던 것뿐이야.
    ja: |-
      損害を最小限に抑える戦術を
      模索していただけだ。
  event_absolute1_04_e_42:
    speaker: eunhwa_t
    en: But you said you wanted to hang out together, right?
    ko: 그보다 같이 시간 보내고 싶다며.
    ja: それで、遊びに行くんだったな。
  event_absolute1_04_e_43:
    speaker: eunhwa_t
    en: So, where do we start...
    ko: 뭐부터 하면….
    ja: お前の予定では…
  event_absolute1_04_e_44:
    speaker: "<Narration>"
    en: "*Beep beep beep*"
    ko: 삐삐삐-
    ja: ピピピピピ――
  event_absolute1_04_e_45:
    speaker: eunhwa_t
    en: Ingrid?
    ko: 잉그리드?
    ja: イングリッド？
  event_absolute1_04_e_46:
    speaker: eunhwa_t
    en: I'm just going to take this call quickly.
    ko: 잠시 전화 좀 받는다.
    ja: "…出てくる。"
  event_absolute1_04_e_47:
    speaker: eunhwa_t
    en: What's going on?
    ko: 무슨 일이지?
    ja: 何だ？
  event_absolute1_04_e_48:
    speaker: eunhwa_t
    en: "... What?"
    ko: "…뭐?"
    ja: "…何？"
  event_absolute1_04_e_49:
    speaker: eunhwa_t
    en: They're with me right now.
    ko: 지금 나랑 같이 있어.
    ja: ああ。ちょうどそろっている。
  event_absolute1_04_e_50:
    speaker: eunhwa_t
    en: Okay, we'll be right over.
    ko: 알겠다. 바로 가도록 하지.
    ja: 分かった。すぐに行く。
  event_absolute1_04_e_51:
    speaker: "<Narration>"
    en: Eunhwa hangs up the phone.
    ko: 은화가 전화를 끊었다.
    ja: ウンファが通話を切った
  event_absolute1_04_e_52:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_04_e_53:
    speaker: eunhwa_t
    en: We're being deployed.
    ko: 호출이다.
    ja: 呼び出しだ。
  event_absolute1_04_e_54:
    speaker: emma_t
    en: If we're being deployed,
    ko: 호출이라면….
    ja: 呼び出しって…
  event_absolute1_04_e_55:
    speaker: emma_t
    en: could that unknown entity that hunts Raptures have appeared again?
    ko: 랩쳐를 사냥하는 [미지의 존재]가 다시 나타난 걸까?
    ja: |-
      もしかして、ラプチャー狩りをしてるっていう
      「未知の存在」？
  event_absolute1_04_e_56:
    speaker: eunhwa_t
    en: Yes.
    ko: 그래.
    ja: ああ。
  event_absolute1_04_e_57:
    speaker: eunhwa_t
    en: Get ready.
    ko: 준비해.
    ja: すぐに準備しろ。
  event_absolute1_04_e_58:
    speaker: eunhwa_t
    en: We're heading to the Northern Base.
    ko: 북부 기지로 간다.
    ja: 北部の基地に向かう。
event_absolute1_05_s:
  event_absolute1_05_s_1:
    speaker: eunhwa_t
    en: While investigating the unknown entity that's been hunting Raptures,
    ko: 랩쳐를 사냥하는 [미지의 존재]에 대해 조사하던 중.
    ja: ラプチャーを狩る「未知の存在」の調査中…
  event_absolute1_05_s_2:
    speaker: eunhwa_t
    en: The Scouts were attacked by what appears to be a new type of Rapture.
    ko: 스카우팅 스쿼드는 특수 개체로 추정되는 신형 랩쳐에게 습격을 당했고.
    ja: |-
      スカウティング部隊が特殊個体と推定される
      新型ラプチャーの襲撃を受け…
  event_absolute1_05_s_3:
    speaker: eunhwa_t
    en: During the incident, Delta went missing.
    ko: 그 과정에서 델타가 행방불명.
    ja: デルタが行方不明。
  event_absolute1_05_s_4:
    speaker: eunhwa_t
    en: Signal is currently isolated inside a building somewhere,
    ko: 시그널은 지휘관으로 보이는 한 남성을 보호한 채,
    ja: |-
      残ったシグナルは、指揮官と思われる
      男性1名を保護したが
  event_absolute1_05_s_5:
    speaker: eunhwa_t
    en: protecting a man believed to be a Commander.
    ko: 어딘가에 위치한 건물에 고립되어 있다.
    ja: どこかの建築物の中で孤立している。
  event_absolute1_05_s_6:
    speaker: eunhwa_t
    en: Did I get all of that right?
    ko: 내가 제대로 파악한 게 맞겠지?
    ja: 間違いないか？
  event_absolute1_05_s_7:
    speaker: ludmilla
    en: Indeed. Precisely so.
    ko: 그래. 정확하다.
    ja: ええ、その通りよ。
  event_absolute1_05_s_8:
    speaker: eunhwa_t
    en: Tch.
    ko: 쯧.
    ja: チッ。
  event_absolute1_05_s_9:
    speaker: eunhwa_t
    en: And you haven't been able to contact Signal again?
    ko: 그 뒤로 시그널과는 통신이 연결되지 않은 건가?
    ja: シグナルとの通信は回復していないのか？
  event_absolute1_05_s_10:
    speaker: tove
    en: Yeah...
    ko: 네에….
    ja: はい…
  event_absolute1_05_s_11:
    speaker: tove
    en: We've tried several times, but we still haven't gotten through.
    ko: 여러 번 시도해 봤는데도 연결되지 않은 걸 보면,
    ja: ここまでしても繋がらないとなると…
  event_absolute1_05_s_12:
    speaker: tove
    en: There's probably something nearby messing with the signal,
    ko: 주변에 통신을 방해하는 무언가가 있거나
    ja: 通信妨害を受けているか…
  event_absolute1_05_s_13:
    speaker: tove
    en: or maybe the weather's just bad.
    ko: 기상 상태가 좋지 않은 것 같아요.
    ja: この付近特有の悪天候によるものだと思います。
  event_absolute1_05_s_14:
    speaker: eunhwa_t
    en: If there are still issues with the signal, it's safe to assume that communication
      won't be possible.
    ko: "…시그널이 여태 해결 못 했다면, 통신은 불가하다고 봐야겠군."
    ja: |-
      …シグナルでも解決できないなら、
      見込みはないだろうな。
  event_absolute1_05_s_15:
    speaker: tove
    en: Even so, I'll keep trying.
    ko: 그래도 시도는 계속해 볼게요.
    ja: いちおう、回復するまで続けてみます。
  event_absolute1_05_s_16:
    speaker: tove
    en: Who knows? We might get lucky and get through...
    ko: 혹시 모르잖아요. 기적처럼 연결될지도….
    ja: |-
      ひょっとしたら、
      奇跡的に繋がるかもしれませんし…
  event_absolute1_05_s_17:
    speaker: ludmilla
    en: Well then, it seems you have a fair understanding of the situation.
    ko: 뭐, 상황은 어느 정도 파악한 것 같은데.
    ja: ひとまず、状況報告はこれぐらいでいいわね。
  event_absolute1_05_s_18:
    speaker: ludmilla
    en: May I move on?
    ko: 다음으로 넘어가도 되겠나?
    ja: 本題に移ってもいいかしら？
  event_absolute1_05_s_19:
    speaker: emma_t
    en: Yes, please.
    ko: 응, 부탁할게.
    ja: ええ、お願い。
  event_absolute1_05_s_20:
    speaker: ludmilla
    en: Very well.
    ko: 그럼.
    ja: それでは。
  event_absolute1_05_s_21:
    speaker: ludmilla
    en: Now, I shall explain the rescue mission.
    ko: 구조 임무에 대해 설명해 주겠다.
    ja: 救助作戦の概要を説明するわ。
  event_absolute1_05_s_22:
    speaker: ludmilla
    en: Kindly direct your attention to the screen.
    ko: 잠시 화면을 보겠나.
    ja: スクリーンを見てもらえるかしら。
  event_absolute1_05_s_23:
    speaker: ludmilla
    en: Alice, if you would.
    ko: 앨리스여, 부탁하지.
    ja: アリス、お願い。
  event_absolute1_05_s_24:
    speaker: alice
    en: Okaaay!
    ko: 네~!
    ja: は～い！
  event_absolute1_05_s_25:
    speaker: "<Narration>"
    en: As Alice taps the device, a map of the North appears on the screen.
    ko: 앨리스가 단말기를 만지자, 화면에 북부의 지도가 출력됐다.
    ja: |-
      アリスが端末を操作すると、
      画面に地図が映し出された
  event_absolute1_05_s_26:
    speaker: ludmilla
    en: The location marked on the left of the screen
    ko: 지금 화면 좌측에 표시된 곳이,
    ja: 画面の左側の印が見えるわね。
  event_absolute1_05_s_27:
    speaker: ludmilla
    en: indicates the last known coordinates of Signal.
    ko: 마지막으로 잡힌 시그널의 좌표다.
    ja: 最後に確認できたシグナルの座標よ。
  event_absolute1_05_s_28:
    speaker: ludmilla
    en: Accounting for the margin of error, the area we must search
    ko: 거기서 반경 1km가 오차 범위로.
    ja: |-
      信号誤差を考慮に入れて、
      ここを中心に半径1km。
  event_absolute1_05_s_29:
    speaker: ludmilla
    en: lies within a one-kilometer radius around that point.
    ko: 우리가 수색해야 할 구역이지.
    ja: それが捜索範囲よ。
  event_absolute1_05_s_30:
    speaker: emma_t
    en: 1 km?
    ko: 1km?
    ja: 1km？
  event_absolute1_05_s_31:
    speaker: emma_t
    en: That's smaller than I expected.
    ko: 생각보다 오차 범위가 작네?
    ja: 思ったより絞れてるのね？
  event_absolute1_05_s_32:
    speaker: ludmilla
    en: If one is not accustomed to the Northern terrain, it may well seem so.
    ko: 북부의 지형에 익숙하지 않으면, 그렇게 느낄 수도 있겠군.
    ja: |-
      北部の地形に慣れていないと、
      そう感じるのも無理はないわ。
  event_absolute1_05_s_33:
    speaker: ludmilla
    en: Alice, would you be so kind as to switch the map to 3D mode?
    ko: 앨리스, 지도를 3D로 변환해 주겠나.
    ja: アリス、立体図に切り替えてちょうだい。
  event_absolute1_05_s_34:
    speaker: "<Narration>"
    en: Alice presses a button, and the map unfolds into a holographic display.
    ko: 버튼을 누르자, 지도가 홀로그램 형태로 펼쳐졌다.
    ja: |-
      アリスがボタンを押すと、
      地図が立体化された
  event_absolute1_05_s_35:
    speaker: "<Narration>"
    en: It shifts from flat to three-dimensional, and the steep mountain ranges rise
      up near the coordinates.
    ko: 평면에서 입체로 바뀌며, 좌표 부근엔 높은 산맥이 솟아났다.
    ja: |-
      平らな地図が立体映像に変わり、
      座標付近にけわしい山脈がそびえたった
  event_absolute1_05_s_36:
    speaker: ludmilla
    en: As you can see, the coordinates point to an altitude of around 1,000 meters.
    ko: 보다시피 좌표는 해발 1,000m 부근을 가리키고 있다.
    ja: 見ての通り、座標は海抜1000m付近。
  event_absolute1_05_s_37:
    speaker: ludmilla
    en: That means elevations up to 2,000 meters fall within the margin of error.
    ko: 즉, 해발 2,000m까지가 오차 범위 내에 속한다는 뜻이지.
    ja: 捜索範囲内の高低差は、およそ2000mよ。
  event_absolute1_05_s_38:
    speaker: ludmilla
    en: Add in the unforgiving terrain of the Glittering Mountains,
    ko: 글리터 산맥의 험난한 지형까지 더해지면,
    ja: グリッター山脈のけわしい地形を考えれば…
  event_absolute1_05_s_39:
    speaker: ludmilla
    en: and it's clear that this search will be anything but easy.
    ko: 수색이 쉽지만은 않을 거다.
    ja: 簡単な捜索にはならないでしょうね。
  event_absolute1_05_s_40:
    speaker: emma_t
    en: "... I see."
    ko: "…그렇구나."
    ja: "…そういうことね～"
  event_absolute1_05_s_41:
    speaker: ludmilla
    en: We shall split into two teams.
    ko: 팀은 두 개로 나누지.
    ja: 捜索チームはふた手に分けましょう。
  event_absolute1_05_s_42:
    speaker: ludmilla
    en: Alice and I will search the areas above 1,000 meters,
    ko: 해발 1,000m 이상 되는 곳은 이 몸이 앨리스와 함께 수색할 테니,
    ja: |-
      海抜1000m以上の場所は、
      私とアリスが捜索するわ。
  event_absolute1_05_s_43:
    speaker: ludmilla
    en: while the rest of you cover the remaining areas.
    ko: 그대들은 나머지 구역을 수색해라.
    ja: あなたたちは他の場所をお願い。
  event_absolute1_05_s_44:
    speaker: ludmilla
    en: Reports will be sent regularly every two hours via radio
    ko: 그리고 보고는 두 시간마다 무전을 통해,
    ja: 定期報告は2時間ごとに無線にて。
  event_absolute1_05_s_45:
    speaker: ludmilla
    en: to the Northern Base.
    ko: 여기 북부 기지에 정기적으로 보낸다.
    ja: この北部基地を通信拠点として利用する。
  event_absolute1_05_s_46:
    speaker: ludmilla
    en: Tove and Neve will remain on standby to monitor the situation.
    ko: 토브와 네베가 상시 대기하며 상황을 체크해 줄 거다.
    ja: |-
      トーブとネヴェが常時待機して、
      状況の監視を続けるわ。
  event_absolute1_05_s_47:
    speaker: ludmilla
    en: That is the plan in brief. Any questions?
    ko: 골자는 여기까지인데, 혹시 질문 있나?
    ja: ここまでの内容で質問は？
  event_absolute1_05_s_48:
    speaker: eunhwa_t
    en: Earlier, you mentioned that Signal is protecting a man who appears to be a
      Commander.
    ko: 아까 시그널이 지휘관으로 보이는 남성을 보호하고 있다고 했지.
    ja: |-
      シグナルが指揮官らしき男を
      保護していると言ったな。
  event_absolute1_05_s_49:
    speaker: eunhwa_t
    en: Do we have any further info on him?
    ko: 그 남성에 대한 정보는 더 없을까.
    ja: そいつの情報はないのか。
  event_absolute1_05_s_50:
    speaker: ludmilla
    en: Hmm...
    ko: 흠.
    ja: そうね…
  event_absolute1_05_s_51:
    speaker: ludmilla
    en: Come to think of it, he did say something like this.
    ko: 그러고 보니, 이런 말을 했던가.
    ja: そういえば、一言は聞き取れたわ。
  event_absolute1_05_s_52:
    speaker: ludmilla
    en: '"I don''t want to die, Eagle."'
    ko: "[죽기 싫어, 이글], 이라고."
    ja: "「イーグル、まだ死にたくない」…これだけね。"
  event_absolute1_05_s_53:
    speaker: emma_t
    en: Can it be...?!
    ko: "!! 설마…."
    ja: "！！まさか…"
  event_absolute1_05_s_54:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_05_s_55:
    speaker: eunhwa_t
    en: Alice, display the coordinates I'm about to give you.
    ko: 앨리스, 지금 내가 불러주는 좌표를 화면에 표시해라.
    ja: アリス、今から言う座標を画面に映してくれ。
  event_absolute1_05_s_56:
    speaker: "<Narration>"
    en: As Alice inputs the data, a point far from the Glittering Mountains appears
      on the map.
    ko: 앨리스가 기기를 조작하자 글리터 산맥에서 멀리 떨어진 곳에 좌표 하나가 출력되었다.
    ja: |-
      アリスが機器を操作すると、
      山脈から離れた場所に目印が表示された
  event_absolute1_05_s_57:
    speaker: eunhwa_t
    en: Ludmilla, we'll head there first.
    ko: "…루드밀라, 우린 저기에 먼저 가보겠다."
    ja: "…悪いが、先にこの座標を調べに行く。"
  event_absolute1_05_s_58:
    speaker: eunhwa_t
    en: Looks like there's something we need to verify before starting search.
    ko: 수색에 앞서 확인할 게 있어 보이는군.
    ja: 捜索を始める前に、確かめたいことがある。
event_absolute1_05_e:
  event_absolute1_05_e_1:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_05_e_2:
    speaker: emma_t
    en: Vesti, are you okay?
    ko: 베스티, 괜찮아?
    ja: ベスティー、大丈夫～？
  event_absolute1_05_e_3:
    speaker: emma_t
    en: You've been quiet for a while.
    ko: 아까부터 아무 말이 없는데.
    ja: さっきからずっと静かだけど…
  event_absolute1_05_e_4:
    speaker: vesti_t
    en: No, I'm not okay.
    ko: 아니, 안 괜찮아.
    ja: ううん、大丈夫じゃない…
  event_absolute1_05_e_5:
    speaker: vesti_t
    en: It's been so long since the three of us got to spend time together...
    ko: 오랜만에 셋이서 보내는 시간이었는데….
    ja: 久しぶりに3人で過ごせるチャンスだったのに…
  event_absolute1_05_e_6:
    speaker: vesti_t
    en: There's no way I could be fine with it getting ruined like this...
    ko: 이런 식으로 방해받고 괜찮을 리 없잖아….
    ja: 台無しにされちゃって…
  event_absolute1_05_e_7:
    speaker: vesti_t
    en: When we find that Rapture, let me handle it.
    ko: 그 랩쳐 만나면 내가 상대하게 해 줘.
    ja: "…ねえ、ラプチャーの相手は私にやらせて。"
  event_absolute1_05_e_8:
    speaker: vesti_t
    en: I'm going to kill it. Got that?
    ko: 죽여버릴 거니까. 알았지?
    ja: ギッタギタにしてやる。いいよね？
  event_absolute1_05_e_9:
    speaker: emma_t
    en: Sure, let's give it some proper payback.
    ko: 그래, 제대로 되갚아주자.
    ja: |-
      ふふ、そうね。
      しっかりお返ししてあげないと。
  event_absolute1_05_e_10:
    speaker: eunhwa_t
    en: Stop.
    ko: 정지.
    ja: 止まれ。
  event_absolute1_05_e_11:
    speaker: "<Narration>"
    en: Eunhwa, who was leading the way, raises her fist.
    ko: 선두에 있던 은화가 주먹을 들었다.
    ja: 先頭にいたウンファが手を上げた
  event_absolute1_05_e_12:
    speaker: "<Narration>"
    en: In front of Black Smith's shredded corpse
    ko: 블랙스미스의 사체 앞.
    ja: 視線の先に、ブラックスミスの残骸がある
  event_absolute1_05_e_13:
    speaker: "<Narration>"
    en: lie the melted bodies
    ko: 사체는 갈기갈기 찢겨 있었고,
    ja: 残骸はばらばらに引き裂かれていた
  event_absolute1_05_e_14:
    speaker: "<Narration>"
    en: of mass-produced Nikkes.
    ko: 그 사이로 녹아내린 양산형 니케들이 보였다.
    ja: |-
      そのすき間から、溶けかけた
      量産型ニケの身体がのぞいている
  event_absolute1_05_e_15:
    speaker: eunhwa_t
    en: They're all missing their cores.
    ko: 하나 같이 코어가 없군.
    ja: どいつもコアがない。
  event_absolute1_05_e_16:
    speaker: eunhwa_t
    en: Or rather, they were gnawed out.
    ko: 아니, 정확하게는 코어만 물어뜯은 건가.
    ja: いや…違うな、コアだけを食われたのか？
  event_absolute1_05_e_17:
    speaker: "<Narration>"
    en: Eunhwa takes a step forward to get a closer look at the bite marks on their
      chests.
    ko: 가슴팍에 난 이빨 자국을 자세히 들여다보기 위해, 은화는 앞으로 한 발짝 내디뎠다.
    ja: |-
      胸部に残る噛み痕らしきものを
      詳しく調べようと、
      ウンファが一歩前に歩み出た
  event_absolute1_05_e_18:
    speaker: vesti_t
    en: W-watch out!
    ko: 위, 위험해!
    ja: あ、危ない！
  event_absolute1_05_e_19:
    speaker: "<Narration>"
    en: Vesti quickly shoves Eunhwa aside.
    ko: 베스티가 은화를 다급히 밀쳤다.
    ja: ベスティーがウンファを突き飛ばした
  event_absolute1_05_e_20:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_05_e_21:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute1_05_e_22:
    speaker: "<Narration>"
    en: Bullets strike the spot where Eunhwa was standing.
    ko: 은화가 서 있던 곳에 총알이 박혔다.
    ja: |-
      ウンファが立っていた場所を、
      弾丸の嵐が襲った
  event_absolute1_05_e_23:
    speaker: "<Narration>"
    en: She instinctively returns fire in the direction the bullets came from.
    ko: 은화는 반사적으로 총알이 발포된 쪽을 향해 방아쇠를 당겼다.
    ja: |-
      ウンファは反射的に弾丸の飛来した方向へ
      銃を向け、引き金を引いた
  event_absolute1_05_e_24:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バン――！
  event_absolute1_05_e_25:
    speaker: "<Narration>"
    en: A low mechanical hum echoes from deep within the corpse.
    ko: 그러자 사체 내부 깊숙한 곳에서 낮은 기계음이 울려 퍼졌다.
    ja: 残骸の内側、奥深くから低い機械音が響いた
  event_absolute1_05_e_26:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_05_e_27:
    speaker: eunhwa_t
    en: Unknown hostile detected!
    ko: 미상의 적 객체 발견!
    ja: 正体不明の敵を確認！
  event_absolute1_05_e_28:
    speaker: eunhwa_t
    en: It's equipped with optical camouflage!
    ko: 광학미채를 탑재한 것으로 확인된다!
    ja: ターゲットは光学迷彩を搭載している！
  event_absolute1_05_e_29:
    speaker: eunhwa_t
    en: Everyone, prepare for combat!
    ko: 다들 전투에 대비해!
    ja: 全員、戦闘に備えろ！
  event_absolute1_05_e_30:
    speaker: "<Narration>"
    en: At the spot where the mechanical hum resounds,
    ko: 기계음이 울려 퍼진 곳.
    ja: 機械音のしていた辺りで空気が揺らぎ…
  event_absolute1_05_e_31:
    speaker: "<Narration>"
    en: the air ripples briefly, then a pair of red eyes flicker to life.
    ko: 일순간 공기가 일렁이더니, 붉은 눈동자가 점멸했다.
    ja: 点滅する紅い眼が浮かび上がった
  event_absolute1_05_e_32:
    speaker: "<Narration>"
    en: "*Grrrr*"
    ko: 크르릉-
    ja: グルルル…
  event_absolute1_05_e_33:
    speaker: eunhwa_t
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
event_absolute1_06_s:
  event_absolute1_06_s_1:
    speaker: "<Narration>"
    en: Through the swirling snowstorm, numerous missiles are launched.
    ko: 휘몰아치는 눈발을 뚫고, 수많은 미사일이 발사된다.
    ja: |-
      吹雪を散らすように、
      無数のミサイルが放たれた
  event_absolute1_06_s_2:
    speaker: vesti_t
    en: Die.
    ko: 죽어.
    ja: 消えろ！
  event_absolute1_06_s_3:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 퍼엉-!
    ja: ドカン！
  event_absolute1_06_s_4:
    speaker: vesti_t
    en: Die!
    ko: 죽어!
    ja: 消えろっ！
  event_absolute1_06_s_5:
    speaker: "<Narration>"
    en: "*Baaang!*"
    ko: 퍼어엉-!
    ja: ズガン！！
  event_absolute1_06_s_6:
    speaker: vesti_t
    en: Diieee!
    ko: 죽어버려!
    ja: 消えちゃえぇぇ！
  event_absolute1_06_s_7:
    speaker: "<Narration>"
    en: "*Baaanggg!*"
    ko: 퍼어어엉-!
    ja: ドカァァン！！
  event_absolute1_06_s_8:
    speaker: eunhwa_t
    en: I'll hold it in place. Emma, spray the liquid jammer around it.
    ko: 엠마, 저 녀석의 발을 묶어둘 테니 주변에 액화 재머를 분사해.
    ja: |-
      私が足止めする。
      エマ、ヤツの周囲にジャマーを散布してくれ。
  event_absolute1_06_s_9:
    speaker: eunhwa_t
    en: As soon as the jammer picks this thing up, let me know.
    ko: 재머에 녀석이 감지되면 바로 알려라.
    ja: 引っかかったら、すぐに合図しろ。
  event_absolute1_06_s_10:
    speaker: emma_t
    en: Roger.
    ko: 라져.
    ja: 了解。
  event_absolute1_06_s_11:
    speaker: "<Narration>"
    en: "*Baaanggg!*"
    ko: 퍼어어엉-!
    ja: ボンッ！
  event_absolute1_06_s_12:
    speaker: "<Narration>"
    en: Staring at the flickering red eyes through the smoke, Eunhwa raises her gun
      and takes aim.
    ko: 폭발 속 얼핏 얼핏 보이는 붉은 눈동자를 응시하며 은화는 총을 겨눴다.
    ja: |-
      雪煙の中をちらつく紅い眼をにらみ、
      ウンファは銃を構え、狙いを定めた
  event_absolute1_06_s_13:
    speaker: eunhwa_t
    en: First, we need to take out that damn optical camouflage.
    ko: 우선은 저 귀찮은 광학미채부터 해결해야겠군.
    ja: まずはあの面倒な光学迷彩の処理からだ。
  event_absolute1_06_s_14:
    speaker: eunhwa_t
    en: Vesti, fall back! I'll cover you!
    ko: 베스티! 엄호할 테니, 뒤로 물러나!
    ja: ベスティー！援護する！下がれ！
  event_absolute1_06_s_15:
    speaker: eunhwa_t
    en: I'm going to drag it out of the corpse!
    ko: 놈을 사체 밖으로 끌어낸다!
    ja: 奴を残骸の外に引きずり出す！
  event_absolute1_06_s_16:
    speaker: vesti_t
    en: O-okay!
    ko: 으, 응!
    ja: う、うん！
  event_absolute1_06_s_17:
    speaker: "<Narration>"
    en: The explosions begin to die down.
    ko: 폭발이 잦아들었다.
    ja: 間をおかず、爆風が収まった
  event_absolute1_06_s_18:
    speaker: "<Narration>"
    en: Once Eunhwa confirms that Vesti has fully retreated, she slowly steps back
      while continuing suppressive fire.
    ko: 베스티가 완전히 후퇴한 걸 확인한 은화는 천천히 뒤로 물러나며 대응 사격을 이어갔다.
    ja: |-
      ベスティーが十分に後退したことを確認し、
      ウンファは後を追って
      徐々に下がりながら射撃を続けた
  event_absolute1_06_s_19:
    speaker: "<Narration>"
    en: "*Bang!* *Bang!*"
    ko: 타앙-! 타앙-!
    ja: バン！バンッ！
  event_absolute1_06_s_20:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_06_s_21:
    speaker: "<Narration>"
    en: The low mechanical hum rapidly approaches Eunhwa.
    ko: 낮은 기계음이 순식간에 은화 앞으로 다가왔다.
    ja: |-
      うなり声とともに、機械音が
      一瞬でウンファの眼前に迫った
  event_absolute1_06_s_22:
    speaker: eunhwa_t
    en: Damn it!
    ko: 젠장!
    ja: チッ！
  event_absolute1_06_s_23:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿠웅-!
    ja: ドゴォン！
  event_absolute1_06_s_24:
    speaker: "<Narration>"
    en: The ground caves in, and snow scatters in all directions.
    ko: 땅이 움푹 파이며, 눈이 사방으로 흩날린다.
    ja: 地面に巨大な穴があき、雪が四方に飛び散った
  event_absolute1_06_s_25:
    speaker: eunhwa_t
    en: Urgh...
    ko: 큭.
    ja: くっ…！
  event_absolute1_06_s_26:
    speaker: vesti_t
    en: A-are you okay?
    ko: 괘, 괜찮아?
    ja: だ、大丈夫！？
  event_absolute1_06_s_27:
    speaker: eunhwa_t
    en: I'm fine. Just a scratch on my arm.
    ko: 팔이 좀 긁힌 정도야. 문제없어.
    ja: 腕を少しかすっただけだ。問題ない。
  event_absolute1_06_s_28:
    speaker: vesti_t
    en: That looks like more than just a scratch...
    ko: 좀 긁혔다기엔….
    ja: か、かすり傷っていうには…
  event_absolute1_06_s_29:
    speaker: "<Narration>"
    en: Despite only being slightly grazed, Eunhwa eyes her shredded left arm and
      grits her teeth.
    ko: 살짝 스쳤음에도 너덜너덜해진 왼팔을 보며, 은화는 이를 악물었다.
    ja: |-
      わずかに接触したのみでボロボロになった
      自身の左腕に一瞬だけ目を向け、
      ウンファは歯を食いしばった
  event_absolute1_06_s_30:
    speaker: eunhwa_t
    en: Vesti, I'll draw its attention.
    ko: 놈은 내가 유인한다.
    ja: 私が奴を引きつける。
  event_absolute1_06_s_31:
    speaker: eunhwa_t
    en: While I do that, hit it directly with your missiles.
    ko: 베스티. 넌 미사일을 직격시켜.
    ja: ベスティー。ミサイルで迎撃しろ。
  event_absolute1_06_s_32:
    speaker: eunhwa_t
    en: Watch the snow. Any indentations will show where it is.
    ko: 눈이 파이는 걸 보면 놈의 위치를 파악할 수 있을 거다.
    ja: |-
      雪に跡が残っている。
      位置は捕捉できるはずだ。
  event_absolute1_06_s_33:
    speaker: vesti_t
    en: Y-you're gonna lure it?
    ko: 으, 은화가 유인한다고?
    ja: お、おとりになるつもり？
  event_absolute1_06_s_34:
    speaker: vesti_t
    en: Are you sure about this?
    ko: 괜찮겠어?
    ja: 大丈夫なの…？
  event_absolute1_06_s_35:
    speaker: eunhwa_t
    en: There's no one here who can keep up with this thing but me.
    ko: 여기서 놈의 기동력을 따라갈 수 있는 건 나밖에 없잖아.
    ja: あいつの機動力に反応できるのは私だけだ。
  event_absolute1_06_s_36:
    speaker: eunhwa_t
    en: Even if it's risky, we've got to pull this off.
    ko: 괜찮지 않더라도, 어떻게든 해내야지.
    ja: リスクがどうだろうと、やるしかない。
  event_absolute1_06_s_37:
    speaker: eunhwa_t
    en: All right, let's get started!
    ko: 그럼 시작한다!
    ja: 始めるぞ！
  event_absolute1_06_s_38:
    speaker: vesti_t
    en: B-but...!
    ko: 그, 그래도…!
    ja: で、でも…！
  event_absolute1_06_s_39:
    speaker: "<Narration>"
    en: Eunhwa kicks off the ground and charges forward.
    ko: 은화는 지면을 박차고 달려 나갔다.
    ja: ウンファが銀雪を蹴って駆けだした
  event_absolute1_06_s_40:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: ダン――！
  event_absolute1_06_s_41:
    speaker: "<Narration>"
    en: She fires shot after shot at close range,
    ko: 지근거리에서 한 발 한 발 총격을 가하며.
    ja: 至近距離からの銃撃を浴びせつつ…
  event_absolute1_06_s_42:
    speaker: "<Narration>"
    en: barely maintaining a sliver of distance between her and the enemy.
    ko: 은화는 적과의 간격을 아슬아슬하게 유지했다.
    ja: |-
      ウンファは敵との間合いを
      紙一重で維持し続けた
  event_absolute1_06_s_43:
    speaker: emma_t
    en: Move to the right! It's coming from the left!
    ko: 우측으로 피해! 좌측에서 달려들 거야!
    ja: |-
      右へ！
      左から来るわ！
  event_absolute1_06_s_44:
    speaker: eunhwa_t
    en: Copy that.
    ko: 확인했다.
    ja: 了解。
  event_absolute1_06_s_45:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿠웅-!
    ja: ズン…！
  event_absolute1_06_s_46:
    speaker: "<Narration>"
    en: The moment Eunhwa moves, the ground behind her caves in.
    ko: 은화가 몸을 날리자, 뒤쪽의 땅이 움푹 파였다.
    ja: |-
      ウンファが身をひるがえした瞬間、
      背中側の地面に穴があいた
  event_absolute1_06_s_47:
    speaker: eunhwa_t
    en: Now! Fire!
    ko: 요격해!
    ja: 今だ！
  event_absolute1_06_s_48:
    speaker: vesti_t
    en: O-okay!
    ko: 으, 응!
    ja: う、うん！
  event_absolute1_06_s_49:
    speaker: "<Narration>"
    en: "*Baaanggg!*"
    ko: 퍼어어엉-!
    ja: バシュン！！
  event_absolute1_06_s_50:
    speaker: "<Narration>"
    en: After repeating this several times,
    ko: 그러길 얼마나 반복했을까.
    ja: 緊迫した攻防を数えきれないほど繰り返し…
  event_absolute1_06_s_51:
    speaker: "<Narration>"
    en: the enemy's movements grow noticeably slower, as if it's running out of energy.
    ko: 동력이 떨어졌는지, 적의 움직임이 현저히 둔해졌다.
    ja: |-
      とうとうエネルギーが底をつきはじめたのか、
      敵の動きが明らかに鈍くなった
  event_absolute1_06_s_52:
    speaker: eunhwa_t
    en: Focus fire.
    ko: 집중 타격.
    ja: 仕掛けるぞ。
  event_absolute1_06_s_53:
    speaker: "<Narration>"
    en: Everyone in Absolute opens fire.
    ko: 앱솔루트 모두가 적을 향해 총을 난사했다.
    ja: 全員の火力が見えない敵に向かって集中する
  event_absolute1_06_s_54:
    speaker: "<Narration>"
    en: "*Bang bang bang!*"
    ko: 타앙-! 타앙-! 타앙-!
    ja: ズガン！ズガン！ズガン！
  event_absolute1_06_s_55:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ズダダダダッ――
  event_absolute1_06_s_56:
    speaker: "<Narration>"
    en: "*Boom boooom!*"
    ko: 퍼엉-! 퍼어엉-!
    ja: ドン！ドカン！！
  event_absolute1_06_s_57:
    speaker: "<Narration>"
    en: And finally...
    ko: 그리고 마침내.
    ja: そして、ついに…
  event_absolute1_06_s_58:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_06_s_59:
    speaker: "<Narration>"
    en: The massive Rapture assumes the form of a giant wolf.
    ko: 거대한 늑대 형태의 랩쳐가 모습을 드러냈다.
    ja: 巨大な狼の形をした影が、姿を現した
  event_absolute1_06_s_60:
    speaker: eunhwa_t
    en: Finally showing yourself, huh?
    ko: 이제야 낯짝을 보이는군.
    ja: ようやくお目見えか。
  event_absolute1_06_s_61:
    speaker: "<Narration>"
    en: The massive wolf-shaped Rapture's eyes flash fiercely as it lunges at Eunhwa.
    ko: 거대한 늑대 형태의 랩쳐는 일순간 안광을 번뜩이더니 은화를 향해 달려들었다.
    ja: |-
      狼形のラプチャーは、
      眼光鋭くウンファを狙い突進した
  event_absolute1_06_s_62:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バァン――！
  event_absolute1_06_s_63:
    speaker: "<Narration>"
    en: Eunhwa's bullet lodged itself in its wide-open jaws...
    ko: 은화가 발사한 탄환이 한껏 크게 벌린 입에 박혔고,
    ja: |-
      ウンファがすかさず放った弾丸は
      大きく開いた口に命中し…
  event_absolute1_06_s_64:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삣-
    ja: ビシッ――
  event_absolute1_06_s_65:
    speaker: "<Narration>"
    en: In an instant, the Rapture is engulfed in a massive explosion.
    ko: 랩쳐는 그대로 거대한 폭발에 휩쓸리고 말았다.
    ja: 大爆発がラプチャーを飲みこんだ
  event_absolute1_06_s_66:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 퍼엉-!!
    ja: ドカァァン！！
  event_absolute1_06_s_67:
    speaker: eunhwa_t
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  event_absolute1_06_s_68:
    speaker: eunhwa_t
    en: Enemy down.
    ko: 적 침묵 확인.
    ja: 目標、沈黙を確認。
  event_absolute1_06_s_69:
    speaker: eunhwa_t
    en: All cle...
    ko: 상황 종….
    ja: 状況終…
  event_absolute1_06_s_70:
    speaker: emma_t
    en: Eunhwa.
    ko: 은화.
    ja: ウンファ。
  event_absolute1_06_s_71:
    speaker: emma_t
    en: I don't think we're done here yet.
    ko: 아직 상황을 종료하면 안 될 것 같아.
    ja: まだ早いみたいよ。
  event_absolute1_06_s_72:
    speaker: emma_t
    en: I'm picking up something over there...
    ko: 저편에서 무언가 감지되고 있어.
    ja: あっちの方、何かいるわ。
  event_absolute1_06_s_73:
    speaker: emma_t
    en: It feels even bigger than what we just faced.
    ko: 지금 상대한 것보다 좀 더 거대한 무언가가.
    ja: いま戦ったのより、大きな何か。
  event_absolute1_06_s_74:
    speaker: eunhwa_t
    en: "... What?"
    ko: "…뭐?"
    ja: "…なんだと？"
  event_absolute1_06_s_75:
    speaker: emma_t
    en: What should we do?
    ko: 어떻게 할 거야?
    ja: どうする？
  event_absolute1_06_s_76:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_06_s_77:
    speaker: eunhwa_t
    en: We'll track it.
    ko: 추적한다.
    ja: 追跡するぞ。
event_absolute1_06_e:
  event_absolute1_06_e_1:
    speaker: eunhwa_t
    en: What... is this?
    ko: 뭐야, 이건.
    ja: "…何だ？これは…"
  event_absolute1_06_e_2:
    speaker: "<Narration>"
    en: In a corner of the abandoned city is a massive underground passage.
    ko: 버려진 도시 구석엔 지하로 이어진 거대한 통로가 있었다.
    ja: |-
      廃墟と化した都市の片隅に、
      地下通路に通じる巨大な穴があった
  event_absolute1_06_e_3:
    speaker: vesti_t
    en: What's something like this doing here?
    ko: 여기에 왜 이런 게….
    ja: どうしてこんなものが…
  event_absolute1_06_e_4:
    speaker: emma_t
    en: The signal's coming from down there.
    ko: 반응은 저 아래에서 감지되고 있어.
    ja: 反応はこの通路の奥の方からよ。
  event_absolute1_06_e_5:
    speaker: vesti_t
    en: A-are we going down?
    ko: 내, 내려갈 거야?
    ja: い、行ってみる？
  event_absolute1_06_e_6:
    speaker: eunhwa_t
    en: I'll take the lead.
    ko: 앞장선다.
    ja: ああ。私が先行する。
  event_absolute1_06_e_7:
    speaker: vesti_t
    en: I'm scared...
    ko: 무서운데….
    ja: ちょ、ちょっと怖いね…
  event_absolute1_06_e_8:
    speaker: "<Narration>"
    en: At the end of the passage, a huge circular concourse appears.
    ko: 통로의 끝에 다다르자 거대한 원형 로비가 나왔다.
    ja: |-
      通路の反対側は
      巨大な円形の空間につながっていた
  event_absolute1_06_e_9:
    speaker: "<Narration>"
    en: The three of them see
    ko: 거기서 셋은 보았다.
    ja: 全員の目が…
  event_absolute1_06_e_10:
    speaker: "<Narration>"
    en: a wolf-shaped Rapture stationed in its center.
    ko: 로비 한가운데 자리 잡은 늑대 형태의 랩쳐를.
    ja: その中央にたたずむ狼型ラプチャーに向けられた
  event_absolute1_06_e_11:
    speaker: eunhwa_t
    en: It's even bigger than the last one.
    ko: 아까 상대한 놈보다 더 크군.
    ja: さっきの奴よりも大きいな。
  event_absolute1_06_e_12:
    speaker: emma_t
    en: Yeah. It's probably a Lord-class.
    ko: 응. 저 정도면 로드급이겠네.
    ja: |-
      そうね。
      ロード級って感じかしら。
  event_absolute1_06_e_13:
    speaker: eunhwa_t
    en: Is it unable to use optical camouflage?
    ko: 광학미채를 쓸 수 없는 건가?
    ja: こいつは光学迷彩が使えないのか？
  event_absolute1_06_e_14:
    speaker: "<Narration>"
    en: Parts of its body flicker, occasionally letting the rear corridor show through.
    ko: 랩쳐의 몸체 곳곳은 일렁이며 이따금 뒤쪽의 통로를 투과할 뿐.
    ja: |-
      ラプチャーの輪郭がところどころ揺らいでいる。
      後方にあるものが透けて見えてはいるが…
  event_absolute1_06_e_15:
    speaker: "<Narration>"
    en: Even so, it cannot fully conceal itself.
    ko: 모습을 완전히 감추진 못하고 있었다.
    ja: 完全に姿を隠すには至っていない
  event_absolute1_06_e_16:
    speaker: "<Narration>"
    en: More importantly...
    ko: 무엇보다,
    ja: 一行はさらに注意深く観察を続けた
  event_absolute1_06_e_17:
    speaker: emma_t
    en: Looks like it's already been through a fight.
    ko: 이미 한바탕 전투를 치렀나 봐.
    ja: 何かと戦闘した後みたいね。
  event_absolute1_06_e_18:
    speaker: "<Narration>"
    en: A part near its chest has fallen off, fully exposing its core.
    ko: 가슴 부근의 부품이 떨어져 나가 코어가 완전히 드러난 상태였다.
    ja: |-
      胸部周辺の外殻がはがれ、
      コアがむき出しになっている
  event_absolute1_06_e_19:
    speaker: eunhwa_t
    en: Emma, check the perimeter.
    ko: 엠마, 주변을 체크해.
    ja: エマ、周辺の探知を頼む。
  event_absolute1_06_e_20:
    speaker: eunhwa_t
    en: Whatever did this might still be inside.
    ko: 저걸 저렇게 만든 존재가 이 안에 남아 있을 수도 있으니까.
    ja: |-
      あいつをあのザマにした何かが
      まだ近くにいるかもしれない。
  event_absolute1_06_e_21:
    speaker: emma_t
    en: Got it.
    ko: 알겠어.
    ja: 分かったわ。
  event_absolute1_06_e_22:
    speaker: "<Narration>"
    en: Eunhwa warily eyes the ominous passageways around the concourse and raises
      her weapon.
    ko: 로비 곳곳에 보이는 불길한 통로를 노려보다 은화는 총을 들었다.
    ja: |-
      円形の空間には複数の通路が
      不吉に口を開けている。
      暗闇の奥をにらみ、ウンファは武器を構えた
  event_absolute1_06_e_23:
    speaker: eunhwa_t
    en: First, we take out the enemy right in front of us.
    ko: 일단 저 녀석을 쓰러뜨린다.
    ja: まずは、目の前の敵の始末だ。
  event_absolute1_06_e_24:
    speaker: eunhwa_t
    en: Then we'll figure out the rest later.
    ko: 생각은 그 이후에 하지.
    ja: 次のことは後で考える。
  event_absolute1_06_e_25:
    speaker: "<Narration>"
    en: Pressing her eye against the scope, Eunhwa slowly aims at the core.
    ko: 스코프에 눈을 가져다 댄 채, 은화는 천천히 코어를 겨냥했다.
    ja: |-
      スコープに目を当て、
      ウンファは静かにコアへ狙いを定めた
  event_absolute1_06_e_26:
    speaker: "<Narration>"
    en: Just then...
    ko: 그때.
    ja: その時
  event_absolute1_06_e_27:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_06_e_28:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_06_e_29:
    speaker: "<Narration>"
    en: A low mechanical hum resonates from behind the Rapture.
    ko: 랩쳐 뒤쪽에서 낮은 기계음이 울려 퍼졌다.
    ja: ラプチャーの背後から低い機械音が響いた
  event_absolute1_06_e_30:
    speaker: "<Narration>"
    en: Another Rapture suddenly bursts out of a passageway
    ko: 이윽고 또 다른 랩쳐가 통로에서 튀어나오더니,
    ja: |-
      一回り小型のラプチャーが
      通路から飛び出してきたのだ
  event_absolute1_06_e_31:
    speaker: "<Narration>"
    en: and lunges at a Rapture at least twice its size, sinking its teeth into the
      core.
    ko: 본인보다 두 배는 더 거대한 랩쳐에게 달려들어 코어를 물어뜯었다.
    ja: |-
      小型のラプチャーは倍ほどの体格差がある
      巨大ラプチャーに飛びつき、
      コアを勢いよく食いちぎった
  event_absolute1_06_e_32:
    speaker: eunhwa_t
    en: A Rapture's... eating another Rapture's core?
    ko: 랩쳐가… 랩쳐의 코어를 먹는다고…?
    ja: ラプチャーが…ラプチャーのコアを食らった…？
  event_absolute1_06_e_33:
    speaker: "<Narration>"
    en: "*Crunch crunch*"
    ko: 우득. 우드득.
    ja: ミシ、ミシミシッ…
  event_absolute1_06_e_34:
    speaker: "<Narration>"
    en: After devouring the core, the Rapture twists and contorts violently as it
      begins to mutate.
    ko: 코어를 먹은 랩쳐의 몸 이곳저곳이 뒤틀리며 변형되기 시작했다.
    ja: |-
      コアを捕食したラプチャーのボディが
      突然歪み、変形しはじめた
  event_absolute1_06_e_35:
    speaker: eunhwa_t
    en: What are those...
    ko: 대체 이것들은….
    ja: こいつら…いったい…
  event_absolute1_06_e_36:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_06_e_37:
    speaker: emma_t
    en: I'm picking up multiple enemies!
    ko: 다수의 적 감지!
    ja: 複数の敵を感知！
  event_absolute1_06_e_38:
    speaker: emma_t
    en: Seven of them. They're all coming this way.
    ko: 수는 일곱. 전부 이쪽으로 오고 있어.
    ja: 全部で7機、こっちに向かってきてるわ。
  event_absolute1_06_e_39:
    speaker: eunhwa_t
    en: Damn it! I thought there was only one!
    ko: 젠장! 한 마리가 아니었나.
    ja: チッ！やはり一匹じゃなかったか…！
  event_absolute1_06_e_40:
    speaker: eunhwa_t
    en: Retreat! Back to the surface!
    ko: 후퇴한다! 다시 지상으로 올라가!
    ja: 後退する！地上に戻るぞ！
  event_absolute1_06_e_41:
    speaker: emma_t
    en: Er...
    ko: 그게….
    ja: 反応は…
  event_absolute1_06_e_42:
    speaker: emma_t
    en: I'm picking up movement from every passage.
    ko: 모든 통로에서 반응이 감지되고 있어.
    ja: 全部の通路からよ。
  event_absolute1_06_e_43:
    speaker: emma_t
    en: Even the one we just came through.
    ko: 방금 내려왔던 통로에서도 반응이 감지되는 건 마찬가지고.
    ja: "…私たちが来た道も含めて。"
  event_absolute1_06_e_44:
    speaker: vesti_t
    en: F-from every passage...?
    ko: 모, 모든 통로에서…?
    ja: ど、どういうこと…？
  event_absolute1_06_e_45:
    speaker: eunhwa_t
    en: So... we've been surrounded.
    ko: "…포위당한 건가."
    ja: "…囲まれたか。"
  event_absolute1_06_e_46:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute1_06_e_47:
    speaker: eunhwa_t
    en: Formation FF.
    ko: 포메이션 FF.
    ja: フォーメーションFF。
  event_absolute1_06_e_48:
    speaker: eunhwa_t
    en: We'll launch a single-point breakthrough.
    ko: 한점 돌파를 감행한다.
    ja: 一点突破するしかない。
  event_absolute1_06_e_49:
    speaker: emma_t
    en: Sure, but where exactly?
    ko: 돌파 지점은?
    ja: どっちに進むの？
  event_absolute1_06_e_50:
    speaker: eunhwa_t
    en: Six o'clock.
    ko: 6시 방향.
    ja: 6時の方向だ。
  event_absolute1_06_e_51:
    speaker: vesti_t
    en: Y-you mean the place we came from?
    ko: 우, 우리가 내려온 곳 말이지?
    ja: そ、それって、来た道を戻るってこと？
  event_absolute1_06_e_52:
    speaker: eunhwa_t
    en: That's right.
    ko: 그래.
    ja: ああ。
  event_absolute1_06_e_53:
    speaker: eunhwa_t
    en: As soon as the path is secured, we'll head up to the surface.
    ko: 통로를 확보하는 대로 지상으로 올라간다.
    ja: 退路が開け次第、地上に戻る。
  event_absolute1_06_e_54:
    speaker: eunhwa_t
    en: We're fighting on their turf now. Getting the hell out of here is our top
      priority.
    ko: 놈들이 만든 전장에서 벗어나는 게 우선이야.
    ja: とにかくこいつらの巣穴から抜け出すのが先だ。
  event_absolute1_06_e_55:
    speaker: eunhwa_t
    en: I'll hold off the enemies from the rear. You two focus on securing the passage.
    ko: 후방에서 접근해 오는 적은 내가 저지할 테니, 너흰 곧장 통로를 확보해.
    ja: |-
      後方の敵は私が足止めする。
      お前たちは退路の確保に集中しろ。
  event_absolute1_06_e_56:
    speaker: emma_t
    en: You?
    ko: 은화가?
    ja: ウンファが？
  event_absolute1_06_e_57:
    speaker: vesti_t
    en: Eu-Eunhwa? But you usually...
    ko: 으, 은화가? 원래라면….
    ja: で、でも、いつもなら…
  event_absolute1_06_e_58:
    speaker: eunhwa_t
    en: Once I give the signal, unleash all your firepower and secure the passage.
    ko: 신호를 주면, 화력을 퍼부어서 통로부터 확보해.
    ja: |-
      合図に合わせて火力を集中、
      道を開かせ、強行突破する。
  event_absolute1_06_e_59:
    speaker: eunhwa_t
    en: Can you handle that?
    ko: 가능하겠어?
    ja: できるか？
  event_absolute1_06_e_60:
    speaker: vesti_t
    en: O-okay.
    ko: 아, 알겠어.
    ja: わ、分かった。
  event_absolute1_06_e_61:
    speaker: emma_t
    en: "... Roger."
    ko: "……라져."
    ja: "…了解。"
  event_absolute1_06_e_62:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャリ――
  event_absolute1_06_e_63:
    speaker: "<Narration>"
    en: The members of Absolute aim their weapons.
    ko: 앱솔루트가 각자 무기를 조준한다.
    ja: それぞれが武器を構えた
  event_absolute1_06_e_64:
    speaker: "<Narration>"
    en: As tension fills the air...
    ko: 긴장감이 맴도는 가운데.
    ja: 空気が張り詰める
  event_absolute1_06_e_65:
    speaker: "<Narration>"
    en: "*Grrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute1_06_e_66:
    speaker: "<Narration>"
    en: Countless red eyes glow deep within the passage.
    ko: 통로 저편에서 붉은 눈동자가 점멸했다.
    ja: 通路の奥で、無数の紅い眼が光った
  event_absolute1_06_e_67:
    speaker: eunhwa_t
    en: Encounter.
    ko: 인카운터.
    ja: エンカウンター！
  event_absolute1_06_e_68:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute1_06_e_69:
    speaker: "<Narration>"
    en: The moment the order is given, Emma's machine gun bursts to life.
    ko: 지시가 떨어지기 무섭게 엠마의 기관총이 불을 뿜었다.
    ja: |-
      合図と同時に、
      エマのマシンガンが火花を散らした
  event_absolute1_06_e_70:
    speaker: "<Narration>"
    en: Vesti follows up with a barrage of missiles, gradually pushing the enemy back.
    ko: 뒤이어 베스티가 미사일을 쏟아붓자, 적은 차츰 뒤로 물러났다.
    ja: |-
      続けてベスティーの発射したミサイルが、
      敵を押しのけていく
  event_absolute1_06_e_71:
    speaker: "<Narration>"
    en: And then...
    ko: 그 순간.
    ja: それに応えるように…
  event_absolute1_06_e_72:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_06_e_73:
    speaker: "<Narration>"
    en: Raptures begin emerging from every other passage.
    ko: 다른 모든 통로에서 랩쳐들이 모습을 드러냈다.
    ja: 別方向の通路の全てからラプチャーが姿を現した
  event_absolute1_06_e_74:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_06_e_75:
    speaker: eunhwa_t
    en: Don't worry about them! Just keep pushing forward!
    ko: 이쪽은 신경 쓰지 말고 계속 밀어붙여!
    ja: 後ろは心配するな。そのまま撃ち続けろ！
  event_absolute1_06_e_76:
    speaker: vesti_t
    en: B-but...
    ko: 그, 그치만….
    ja: で、でも…
  event_absolute1_06_e_77:
    speaker: "<Narration>"
    en: Eunhwa aims at the mutating Rapture's chest.
    ko: 은화는 변형 중인 랩쳐의 가슴 부근에 조준선을 맞췄다.
    ja: |-
      ウンファは変わらぬ落ち着きで
      変形を続けるラプチャーの胸に照準を合わせた
  event_absolute1_06_e_78:
    speaker: eunhwa_t
    en: You're first.
    ko: 우선은 네놈부터다.
    ja: まずはお前からだ。
  event_absolute1_06_e_79:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バン――！
  event_absolute1_06_e_80:
    speaker: "<Narration>"
    en: Eunhwa pulls the trigger.
    ko: 은화가 방아쇠를 당겼다.
    ja: ウンファが引き金を引いた
  event_absolute1_06_e_81:
    speaker: "<Narration>"
    en: But...
    ko: 그러나.
    ja: だが…
  event_absolute1_06_e_82:
    speaker: "<Narration>"
    en: the bullet never reaches its target.
    ko: 곧게 나아가던 탄환은 목표에 닿지 못했다.
    ja: |-
      正確に狙ったはずの弾丸は、
      目標に届かなかった
  event_absolute1_06_e_83:
    speaker: "<Narration>"
    en: Another Rapture suddenly dashes in, blocking the bullet.
    ko: 궤적을 가로막은 건, 또 다른 랩쳐.
    ja: 射線に飛び出した別のラプチャーに阻まれたのだ
  event_absolute1_06_e_84:
    speaker: "<Narration>"
    en: Even after taking the bullet, the Rapture stands its ground,
    ko: 탄에 관통당했음에도 랩쳐는 꿋꿋이 그 자리에 버티고 서 있었다.
    ja: |-
      弾丸に貫かれたラプチャーは
      それでもなお、前に立ち塞がろうとしていた
  event_absolute1_06_e_85:
    speaker: "<Narration>"
    en: as if trying to protect its comrade.
    ko: 동료를 보호하기라도 하겠다는 듯이.
    ja: まるで、仲間を守ろうとしているかのように
  event_absolute1_06_e_86:
    speaker: eunhwa_t
    en: "... It took the hit for its comrade?"
    ko: "…대신 맞았다고?"
    ja: "…かばっているのか？"
  event_absolute1_06_e_87:
    speaker: "<Narration>"
    en: A horde of Raptures charges in formation.
    ko: 랩쳐 무리가 진형을 갖춘 채 돌격해 온다.
    ja: |-
      間髪入れず、ラプチャーが
      隊列をなして向かってきた
  event_absolute1_06_e_88:
    speaker: "<Narration>"
    en: In response, Eunhwa once again presses her eye to the scope.
    ko: 그에 대응하기 위해 은화는 다시 한번 스코프에 눈을 가져다 댔다.
    ja: |-
      迎撃しようと、ウンファが
      再びスコープに目を当てた
  event_absolute1_06_e_89:
    speaker: "<Narration>"
    en: Through it, she sees...
    ko: 거기엔,
    ja: しかし…
  event_absolute1_06_e_90:
    speaker: vesti_t
    en: S-sorry,
    ko: 미, 미안.
    ja: ご、ごめん。
  event_absolute1_06_e_91:
    speaker: vesti_t
    en: I really can't
    ko: 역시 안 되겠어.
    ja: "…やっぱり、ダメみたい。"
  event_absolute1_06_e_92:
    speaker: vesti_t
    en: just stand still and do nothing.
    ko: 난 이대로 멈춰있고 싶지 않아.
    ja: このまま、立ち止まっていたくないの。
  event_absolute1_06_e_93:
    speaker: "<Narration>"
    en: Vesti comes into view.
    ko: 베스티가 비치고 있었다.
    ja: ベスティーがスコープに映った
  event_absolute1_06_e_94:
    speaker: eunhwa_t
    en: Vesti?
    ko: 베스티?
    ja: ベスティー？
  event_absolute1_06_e_95:
    speaker: vesti_t
    en: I'll take care of these first!
    ko: 저것들부터 전부 죽여버릴게!
    ja: みんな、ぶっ潰してやる！
  event_absolute1_06_e_96:
    speaker: "<Narration>"
    en: "*Whooosh!*"
    ko: 푸슈슈슉—!
    ja: ドドドドッ！
  event_absolute1_06_e_97:
    speaker: "<Narration>"
    en: A fusillade of missiles launches from Vesti's back.
    ko: 베스티의 뒤에서 수많은 미사일이 발사된다.
    ja: |-
      ベスティーの背中から、
      一斉にミサイルが発射された
  event_absolute1_06_e_98:
    speaker: "<Narration>"
    en: Then...
    ko: 그러자,
    ja: だが、次の瞬間…
  event_absolute1_06_e_99:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute1_06_e_100:
    speaker: "<Narration>"
    en: A low, menacing growl erupts from the fully mutated Rapture's mouth.
    ko: 변형을 끝마친 랩쳐의 입에서 낮고 위협적인 경고음이 울려 퍼졌고.
    ja: |-
      変形を終えたラプチャーの口が、
      威嚇するように低いうなり声をあげた
  event_absolute1_06_e_101:
    speaker: vesti_t
    en: H-huh?
    ko: 어, 어라…?
    ja: あ、あれ…！？
  event_absolute1_06_e_102:
    speaker: "<Narration>"
    en: The countless missiles cutting through the air suddenly seem to lose sight
      of their target
    ko: 허공을 가르던 미사일 무리는 갈피를 잃은 채,
    ja: |-
      放たれた無数のミサイルは
      突然目標を見失ったかのように…
  event_absolute1_06_e_103:
    speaker: "<Narration>"
    en: and all at once fall toward the ground.
    ko: 일제히 바닥을 향해 추락했다.
    ja: 一斉に床へと落下した
  event_absolute1_06_e_104:
    speaker: eunhwa_t
    en: Our missiles are being jammed!
    ko: 재밍이다!
    ja: 止められた！？
  event_absolute1_06_e_105:
    speaker: eunhwa_t
    en: Everyone, brace for impact...!
    ko: 다들 폭발에 대비…!
    ja: 全員、爆発に備え…！
  event_absolute1_06_e_106:
    speaker: "<Narration>"
    en: "*Booom!*"
    ko: 콰아아앙-!
    ja: ズガン――！
  event_absolute1_06_e_107:
    speaker: "<Narration>"
    en: A deafening explosion shakes the concourse.
    ko: 엄청난 굉음이 로비를 뒤흔든다.
    ja: 轟音が周囲一帯を揺るがした
  event_absolute1_06_e_108:
    speaker: "<Narration>"
    en: Eunhwa hastily pulls her eye away from the scope.
    ko: 은화는 황급히 스코프에서 눈을 뗐다.
    ja: ウンファは素早くスコープから目を離した
  event_absolute1_06_e_109:
    speaker: "<Narration>"
    en: At the center of the blast,
    ko: 폭발의 중심.
    ja: 爆風で崩れはじめた床の中央に…
  event_absolute1_06_e_110:
    speaker: "<Narration>"
    en: Vesti lies collapsed as the floor cracks and begins to give way.
    ko: 갈라지며 무너져 내리기 시작한 바닥 한가운데엔 베스티가 쓰러져 있었다.
    ja: 倒れたベスティーの姿が映った
  event_absolute1_06_e_111:
    speaker: "<Narration>"
    en: Just like during the battle with Behemoth.
    ko: 베히모스와 전투했던, 그때와 마찬가지로.
    ja: |-
      かつてのベヒモス戦の光景が
      ウンファの目に重なって見えた
  event_absolute1_06_e_112:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute1_06_e_113:
    speaker: "<Narration>"
    en: As heat and shockwaves sweep over her entire body,
    ko: 전신을 덮치는 열기와 충격 속에서
    ja: 焼けつく熱気と衝撃に逆らい…
  event_absolute1_06_e_114:
    speaker: "<Narration>"
    en: Eunhwa frantically reaches out.
    ko: 은화는 황급히 손을 뻗었다.
    ja: ウンファは必死に手を伸ばした
  event_absolute1_06_e_115:
    speaker: "<Narration>"
    en: But...
    ko: 하지만.
    ja: しかし…
  event_absolute1_06_e_116:
    speaker: "<Narration>"
    en: her fingers grasp nothing.
    ko: 그 손끝엔 아무것도 닿지 않았다.
    ja: 指先は空を切った
  event_absolute1_06_e_117:
    speaker: eunhwa_t
    en: "... Damn it!"
    ko: "…젠장!"
    ja: "…クソッ！"
  event_absolute1_06_e_118:
    speaker: "<Narration>"
    en: The floor collapses completely from the explosion,
    ko: 폭발의 여파로 바닥이 완전히 무너지며,
    ja: 床が完全に崩落し
  event_absolute1_06_e_119:
    speaker: "<Narration>"
    en: and everything plummets below.
    ko: 모든 것이 아래로 추락했다.
    ja: 何もかもが落ちていく
  event_absolute1_06_e_120:
    speaker: "<Narration>"
    en: Engulfed in a maelstrom of fire and smoke,
    ko: 거대한 폭발과 폭연 속.
    ja: 激しい爆発と爆炎の中で
  event_absolute1_06_e_121:
    speaker: "<Narration>"
    en: Eunhwa is swallowed by the darkness.
    ko: 은화는 그렇게 어둠에 삼켜졌다.
    ja: ウンファもまた、闇に飲まれていった
  event_absolute1_06_e_122:
    speaker: "<Narration>"
    en: 'ABSOLUTE: To be Continued'
    ko: 'ABSOLUTE : To be continued'
    ja: 'ABSOLUTE : To be continued'
event_absolute2_01_s:
  event_absolute2_01_s_1:
    speaker: "<Narration>"
    en: I remember the day I first saw Eunhwa.
    ko: 처음 은화를 봤던 그날을 기억해.
    ja: |-
      初めてウンファと会った日のことは、
      今でも覚えてるわ
  event_absolute2_01_s_2:
    speaker: "<Narration>"
    en: It was also the day I was offered a spot in Elysion's elite squad, Absolute.
    ko: 앱솔루트라는 엘리시온 정예 스쿼드에 들어오지 않겠냐는 제안을 들었던 날.
    ja: |-
      エリシオンの精鋭部隊、
      アブソルートへの入隊を
      勧められた日でもあったから
  event_absolute2_01_s_3:
    speaker: "<Narration>"
    en: Honestly, I thought joining that kind of squad would be a lot of pressure,
      so I was thinking about turning it down.
    ko: 내심 그런 스쿼드는 부담스러워서 거절하러,
    ja: 自分には合わないからと、断ろうと思って…
  event_absolute2_01_s_4:
    speaker: "<Narration>"
    en: When I went to find Ingrid, she was meeting with another potential Absolute
      member.
    ko: 또 다른 앱솔루트 스쿼드 멤버를 만나러 갔다는 잉그리드를 찾아갔던 날.
    ja: |-
      他の候補生に会いに行ったという
      イングリッドを尋ねにいったの
  event_absolute2_01_s_5:
    speaker: "<Narration>"
    en: That's when I saw Eunhwa at the playground.
    ko: 그 놀이터에서, 그 애를 봤어.
    ja: 出会いはあの公園だった
  event_absolute2_01_s_6:
    speaker: ingrid
    en: Well? Answer me.
    ko: 답해라.
    ja: 答えろ。
  event_absolute2_01_s_7:
    speaker: ingrid
    en: What will you do going forward?
    ko: 제군은 앞으로 어떻게 하고 싶지?
    ja: お前たちは、どうする？
  event_absolute2_01_s_8:
    speaker: eunhwa
    en: "... I'm going to become perfect."
    ko: "…완벽해질 거다."
    ja: "…完璧になる。"
  event_absolute2_01_s_9:
    speaker: eunhwa
    en: Once I do,
    ko: 완벽해져서,
    ja: 完全無欠の存在になって…
  event_absolute2_01_s_10:
    speaker: eunhwa
    en: I will surely reclaim the surface.
    ko: 난 반드시 지상을 탈환할 거다.
    ja: 必ず地上を取り戻す。
  event_absolute2_01_s_11:
    speaker: "<Narration>"
    en: Eyes that didn't despair at failure. Eyes that burned fiercely
    ko: 실패에 좌절하지 않고 분노를 담아내던,
    ja: 挫折にくじけるどころか、さらに燃えあがり…
  event_absolute2_01_s_12:
    speaker: "<Narration>"
    en: with anger and determination toward victory.
    ko: 승리를 향해 맹렬하게 타오르던 눈.
    ja: 勝利への情熱をたぎらせる
  event_absolute2_01_s_13:
    speaker: "<Narration>"
    en: I truly wanted to see
    ko: 그 눈을 가진 여자아이가,
    ja: そんなぎらついた目の持ち主だった
  event_absolute2_01_s_14:
    speaker: "<Narration>"
    en: the girl with those eyes reclaim the surface...
    ko: 정말로 지상을 탈환하게 되는 걸 보고 싶어서….
    ja: |-
      だから、彼女が本当に地上を奪還するところが
      見たくなった私は…
  event_absolute2_01_s_15:
    speaker: emma
    en: Why did you answer like that?
    ko: 왜 그렇게 대답한 거야?
    ja: どうして、あんなふうに答えたの？
  event_absolute2_01_s_16:
    speaker: eunhwa
    en: What?
    ko: 뭐가.
    ja: 何のことだ。
  event_absolute2_01_s_17:
    speaker: emma
    en: You said you'll become perfect and reclaim the surface.
    ko: 완벽해져서, 반드시 지상을 탈환할 거라고.
    ja: 完璧になって、地上を取り戻すって話。
  event_absolute2_01_s_18:
    speaker: eunhwa
    en: Do you really need to ask that?
    ko: 지상 탈환.
    ja: 何が疑問なんだ？
  event_absolute2_01_s_19:
    speaker: eunhwa
    en: Isn't reclaiming the surface what humanity's fighting for?
    ko: 인류는 그걸 위해 싸우는 거 아니었나.
    ja: 人類は、地上奪還のために戦っている。
  event_absolute2_01_s_20:
    speaker: emma
    en: Still, people usually don't say that out loud
    ko: 그래도 보통은 그걸 입 밖으로 내뱉진 않으니깐.
    ja: |-
      でも、誰もそんなこと、
      本気で口に出してないわ。
  event_absolute2_01_s_21:
    speaker: emma
    en: since hardly anyone really believes it's possible.
    ko: 그게 가능할 거라고 생각하는 사람은 잘 없잖아.
    ja: |-
      本当にできると思ってる人なんて、
      ほとんどいないもの。
  event_absolute2_01_s_22:
    speaker: emma
    en: And I heard you used to be a Commander, so you must've been up on the surface
      before.
    ko: 더군다나 넌 지휘관 출신이라고 들었는데, 지상에 올라갔다가 와봤을 거 아니야.
    ja: |-
      それに、元指揮官のたたき上げなんでしょ？
      地上は見たことがあるのよね。
  event_absolute2_01_s_23:
    speaker: emma
    en: Folks like you probably find it even harder to talk about something like that.
    ko: 그런 사람들은 더더욱 그런 이야기를 하기 힘들 테니까.
    ja: |-
      だったら、そんなことはもっと
      考えられないんじゃない？
  event_absolute2_01_s_24:
    speaker: eunhwa
    en: Too many people have died.
    ko: 너무 많은 사람이 죽었어.
    ja: あまりに多くの奴らが犠牲になった。
  event_absolute2_01_s_25:
    speaker: emma
    en: Huh?
    ko: 응?
    ja: え？
  event_absolute2_01_s_26:
    speaker: eunhwa
    en: Too many people have died for that damn surface reclamation.
    ko: 그 빌어먹을 지상 탈환을 위해서 너무 많은 사람이 죽었다고.
    ja: |-
      そのクソいまいましい地上を取り戻すために、
      数えきれないほどの連中が命を投げ出した。
  event_absolute2_01_s_27:
    speaker: eunhwa
    en: To make sure their deaths aren't in vain,
    ko: 그게 헛되지 않았다고 말하려면,
    ja: |-
      それが無駄死にでは無かったと
      言ってやるためには…
  event_absolute2_01_s_28:
    speaker: eunhwa
    en: someone has to take back the surface.
    ko: 누군가는 지상을 탈환해야 하니까.
    ja: 誰かが地上を取り戻すしかない。
  event_absolute2_01_s_29:
    speaker: eunhwa
    en: That's all I'm fighting for.
    ko: 그걸 위해 싸우려는 것뿐이야.
    ja: だから戦う、それだけだ。
  event_absolute2_01_s_30:
    speaker: emma
    en: "... I see."
    ko: "…그렇구나."
    ja: "…なるほどね～"
  event_absolute2_01_s_31:
    speaker: eunhwa
    en: You...
    ko: 넌….
    ja: お前は…
  event_absolute2_01_s_32:
    speaker: eunhwa
    en: No, I mean...
    ko: 아니, 우리는.
    ja: いや、私たちは…
  event_absolute2_01_s_33:
    speaker: eunhwa
    en: Are we in the same squad?
    ko: 같은 스쿼드인가?
    ja: 同じ部隊になるのか？
  event_absolute2_01_s_34:
    speaker: emma
    en: Huh?
    ko: 응?
    ja: え？
  event_absolute2_01_s_35:
    speaker: eunhwa
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_s_36:
    speaker: emma
    en: "... Yeah, I suppose."
    ko: "…응. 그래보려고."
    ja: "…ええ。そのつもりよ。"
  event_absolute2_01_s_37:
    speaker: emma
    en: I'm Emma.
    ko: 엠마라고 해.
    ja: 私、エマって言うの。
  event_absolute2_01_s_38:
    speaker: emma
    en: What's your name?
    ko: 넌 이름이 뭐야?
    ja: あなたは？
  event_absolute2_01_s_39:
    speaker: eunhwa
    en: "... Eunhwa."
    ko: "…은화."
    ja: "…ウンファ。"
  event_absolute2_01_s_40:
    speaker: eunhwa
    en: Call me Eunhwa.
    ko: 은화라고 불러.
    ja: 呼び捨てでいい。
  event_absolute2_01_s_41:
    speaker: "<Narration>"
    en: In the end, that's why I decided to join Absolute as well.
    ko: 그래서 나도 함께 앱솔루트가 되겠다고 했었지.
    ja: そうして、私はアブソルートに加入した
  event_absolute2_01_s_42:
    speaker: "<Narration>"
    en: Hehe, in some ways,
    ko: 후후, 어떤 의미로는 그래.
    ja: ふふ、言ってみれば…
  event_absolute2_01_s_43:
    speaker: "<Narration>"
    en: I think I was captivated by her.
    ko: 반했던 것 같아.
    ja: きっと私は、彼女に惹かれたのね
  event_absolute2_01_s_44:
    speaker: "<Narration>"
    en: I really thought she was amazing.
    ko: 정말 멋지다고 생각했거든.
    ja: |-
      だって、心の底から
      カッコいいって思ったんだもの
  event_absolute2_01_s_45:
    speaker: "<Narration>"
    en: In a world where failure had become the norm,
    ko: 실패가 익숙해진 세상에서,
    ja: 失敗が当たり前のことになってしまった世界で…
  event_absolute2_01_s_46:
    speaker: "<Narration>"
    en: I'd just been living day by day, settling for what I had...
    ko: 적당히 현재에 만족하면서 살아가자고 생각해 왔었는데….
    ja: |-
      ほどほどの現状に満足しながら、
      生きていこうと思っていたのに…
  event_absolute2_01_s_47:
    speaker: "<Narration>"
    en: But for the first time, it felt like I had a real goal in life.
    ko: 처음으로 삶의 목표가 생긴 것 같았어.
    ja: 初めて生きる目標ができてしまった
  event_absolute2_01_s_48:
    speaker: "<Narration>"
    en: And so, I spent my days training and going on missions alongside Eunhwa.
    ko: 그렇게 은화와 같이 훈련도 하고 임무도 함께하며 지내다가….
    ja: |-
      それから、ウンファと訓練する毎日を過ごして
      肩を並べて戦うようになった
  event_absolute2_01_s_49:
    speaker: rapi
    en: I'm Rapi.
    ko: 라피라고 해.
    ja: 私はラピ。
  event_absolute2_01_s_50:
    speaker: rapi
    en: Looking forward to working with you.
    ko: 잘 부탁할게.
    ja: よろしく。
  event_absolute2_01_s_51:
    speaker: "<Narration>"
    en: Then I met Rapi.
    ko: 라피를 만나고.
    ja: ラピに出会って
  event_absolute2_01_s_52:
    speaker: emma
    en: Nice to meet you. You're Vesti, right?
    ko: 반가워. 네가 베스티지?
    ja: 初めまして。あなたがベスティー？
  event_absolute2_01_s_53:
    speaker: vesti
    en: Oh. I-I'm Vesti...
    ko: 어, 으, 응… 마, 맞아. 베스티….
    ja: |-
      あ、う、うん…私がベスティーだよ。
      初めまして…
  event_absolute2_01_s_54:
    speaker: vesti
    en: N-nice to meet you all.
    ko: 나, 나도 잘 부탁해….
    ja: こ、こちらこそよろしくね…
  event_absolute2_01_s_55:
    speaker: "<Narration>"
    en: I also met Vesti.
    ko: 베스티를 만나고.
    ja: ベスティーに出会って
  event_absolute2_01_s_56:
    speaker: "<Narration>"
    en: As Absolute slowly took shape,
    ko: 앱솔루트가 완성되어 가면서….
    ja: 少しずつ、アブソルートは完成に近づいていった
  event_absolute2_01_s_57:
    speaker: "<Narration>"
    en: I thought my role was to be the kind of lubricant
    ko: 난 내 역할이 저 불꽃 같은 세 사람이 좀 더 타오를 수 있게 도와주는,
    ja: |-
      私の役目は、この火花のような3人が
      もっと燃え上がるようにサポートすること…
  event_absolute2_01_s_58:
    speaker: "<Narration>"
    en: that helps those three fiery ones burn even brighter.
    ko: 음~ 일종의 윤활제 역할을 하는 거라고 생각했어.
    ja: そうね、油みたいなつもりでいたの
  event_absolute2_01_s_59:
    speaker: "<Narration>"
    en: But somehow along the way...
    ko: 그런데 언제부터였을까….
    ja: でも、いつからか…
  event_absolute2_01_s_60:
    speaker: "<Narration>"
    en: I found myself burning alongside them.
    ko: 나도 함께 타오르고 있더라.
    ja: 私も一緒に燃え上がってた
  event_absolute2_01_s_61:
    speaker: "<Narration>"
    en: I threw myself into their flames.
    ko: 이 애들의 불꽃에, 나도 온몸을 내던지고 있었어.
    ja: |-
      あの子たちの火が私に燃え移って
      気づけば私も全てを捧げていた
  event_absolute2_01_s_62:
    speaker: "<Narration>"
    en: Before I knew it,
    ko: 이 애들이.
    ja: 3人のことが…
  event_absolute2_01_s_63:
    speaker: "<Narration>"
    en: the entire Absolute squad
    ko: 앱솔루트 스쿼드가.
    ja: アブソルートのことが、
  event_absolute2_01_s_64:
    speaker: "<Narration>"
    en: had become something incredibly precious to me.
    ko: 어느새, 나에게도 너무 소중한 존재가 되어 있었던 것 같아.
    ja: 私にとって、本当に大切な存在になっていた
  event_absolute2_01_s_65:
    speaker: "<Narration>"
    en: Just like everyone else in the squad...
    ko: 우리 스쿼드 애들처럼, 나도.
    ja: アブソルートのみんなのように
  event_absolute2_01_s_66:
    speaker: "<Narration>"
    en: for perfection, for victory...
    ko: 완벽함을 위해, 승리를 위해.
    ja: 完璧な勝利のためにと
  event_absolute2_01_s_67:
    speaker: "<Narration>"
    en: I, too, felt like I could burn my life away.
    ko: 목숨을 불태울 수 있을 것 같게 되어버렸지, 뭐야.
    ja: |-
      自分が命を燃やすようになるとは、
      思ってなかった
  event_absolute2_01_s_68:
    speaker: "<Narration>"
    en: But...
    ko: 그런데….
    ja: でも、結局…
  event_absolute2_01_s_69:
    speaker: emma
    en: Eunhwa...
    ko: "…은화."
    ja: "…ウンファ。"
  event_absolute2_01_s_70:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 팟-
    ja: ピッ…
  event_absolute2_01_s_71:
    speaker: "<Narration>"
    en: Emma turns on the light in the dark room.
    ko: 엠마가 어두운 방 안의 불을 켰다.
    ja: エマが暗い部屋に明かりをつけた
  event_absolute2_01_s_72:
    speaker: eunhwa
    en: Don't turn on the lights.
    ko: 불 켜지 마.
    ja: 消してくれ。
  event_absolute2_01_s_73:
    speaker: "<Narration>"
    en: Inside the room, Eunhwa's back is visible as she sits alone on the floor.
    ko: "…방 안, 홀로 바닥에 앉아 있는 은화의 뒷모습이 보였다."
    ja: |-
      …部屋の中には、ぽつんと床に座る
      ウンファの背中があった
  event_absolute2_01_s_74:
    speaker: emma
    en: What are you doing sitting in the dark?
    ko: 왜 어둡게 있어.
    ja: 明かりもつけないで、どうしたの？
  event_absolute2_01_s_75:
    speaker: emma
    en: You'll ruin your eyes.
    ko: 그러다 눈 나빠진다~
    ja: 目によくないわよ～？
  event_absolute2_01_s_76:
    speaker: eunhwa
    en: Sorry, I want to be alone.
    ko: "…미안. 혼자 있고 싶어."
    ja: "…悪いが、一人にしてくれ。"
  event_absolute2_01_s_77:
    speaker: emma
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_s_78:
    speaker: "<Narration>"
    en: After Rapi suddenly left the squad...
    ko: 라피가 갑작스레 스쿼드에서 탈퇴하고….
    ja: ラピが突然、部隊を辞めた後…
  event_absolute2_01_s_79:
    speaker: "<Narration>"
    en: Seeing Eunhwa's broken figure from behind,
    ko: 무너져 내리던 은화의 등을 보고,
    ja: 打ちひしがれたウンファの背中を見て
  event_absolute2_01_s_80:
    speaker: "<Narration>"
    en: I just knew that no words of comfort could truly heal her heart.
    ko: 어떤 위로의 말도 그 애의 마음을 치유할 수 없다고 느꼈어.
    ja: |-
      どんな言葉でも、彼女の心の傷は
      いやしてあげられないと感じた
  event_absolute2_01_s_81:
    speaker: emma
    en: "... Okay."
    ko: "…알겠어."
    ja: "…分かったわ。"
  event_absolute2_01_s_82:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 팟-
    ja: ピッ…
  event_absolute2_01_s_83:
    speaker: "<Narration>"
    en: Emma turns off the lights again.
    ko: 엠마가 다시 불을 끈 후,
    ja: エマは明かりを消し
  event_absolute2_01_s_84:
    speaker: "<Narration>"
    en: "*Plop*"
    ko: 털썩-
    ja: ガサッ――
  event_absolute2_01_s_85:
    speaker: eunhwa
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_01_s_86:
    speaker: "<Narration>"
    en: She silently sits down behind Eunhwa, her back pressed against hers.
    ko: 말없이 은화의 등 뒤에, 등을 맞댄 채 주저앉았다.
    ja: 何も言わず、ウンファと背中合わせに座った
  event_absolute2_01_s_87:
    speaker: emma
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_s_88:
    speaker: eunhwa
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_s_89:
    speaker: eunhwa
    en: "... Emma."
    ko: "…엠마."
    ja: "…エマ。"
  event_absolute2_01_s_90:
    speaker: emma
    en: "... Yes?"
    ko: "…응?"
    ja: "…なぁに？"
  event_absolute2_01_s_91:
    speaker: eunhwa
    en: "... Don't change."
    ko: "…넌 변하지 마라."
    ja: "…お前は変わるな。"
  event_absolute2_01_s_92:
    speaker: eunhwa
    en: Never change.
    ko: 절대 변하지 마.
    ja: 絶対に。
  event_absolute2_01_s_93:
    speaker: emma
    en: "... Okay."
    ko: "…응."
    ja: "…ええ。"
  event_absolute2_01_s_94:
    speaker: "<Narration>"
    en: Emma looks at the light coming in through the ajar door.
    ko: 엠마가 열린 문 사이로 들어오는 빛을 바라보았다.
    ja: |-
      エマは開いたドアの隙間から
      光がこぼれていることに気づいた
  event_absolute2_01_s_95:
    speaker: vesti
    en: "... *Sniff*"
    ko: "……흑."
    ja: "…うぅ…"
  event_absolute2_01_s_96:
    speaker: "<Narration>"
    en: Through the crack in the door, Vesti's toes are visible.
    ko: 문틈 사이로, 베스티의 발끝이 보였다.
    ja: |-
      隙間からベスティーのつま先が
      わずかにのぞいている
  event_absolute2_01_s_97:
    speaker: emma
    en: "... I won't."
    ko: "…그럴게."
    ja: "…そうね。"
  event_absolute2_01_s_98:
    speaker: emma
    en: I will never change.
    ko: 절대 변하지 않을게.
    ja: 変わらないわ、絶対。
  event_absolute2_01_s_99:
    speaker: "<Narration>"
    en: That's why... I decided to quietly watch from the sidelines
    ko: 그래서… 등 뒤에서 묵묵히 지켜봐 주기로 했지.
    ja: だから…後ろでそっと見守ることにした
  event_absolute2_01_s_100:
    speaker: "<Narration>"
    en: as someone who's always there, someone who doesn't change,
    ko: 아무 말 없이, 그저 변하지 않는 사람으로.
    ja: 何も言わず、変わらない存在として
  event_absolute2_01_s_101:
    speaker: "<Narration>"
    en: someone Eunhwa and Vesti
    ko: 은화도 베스티도,
    ja: ウンファとベスティーが…
  event_absolute2_01_s_102:
    speaker: "<Narration>"
    en: can silently lean on.
    ko: 묵묵히 기댈 수 있는 사람으로.
    ja: |-
      何も言わなくても頼ってくれるような
      存在になろうって
  event_absolute2_01_s_103:
    speaker: "<Narration>"
    en: That's how I thought things would be.
    ko: 그렇게 지내보자고 생각했어.
    ja: そう決めた
  event_absolute2_01_s_104:
    speaker: "<Narration>"
    en: But...
    ko: 그런데….
    ja: あれから時が経って…
  event_absolute2_01_s_105:
    speaker: "<Narration>"
    en: Vesti started trying to change.
    ko: 베스티가 변화를 위해 노력하기 시작하고.
    ja: ベスティーが変わるための努力を始めた
  event_absolute2_01_s_106:
    speaker: "<Narration>"
    en: After having a proper farewell with Rapi
    ko: 라피와 제대로 된 마무리를 하고,
    ja: ラピともきちんとお別れをして
  event_absolute2_01_s_107:
    speaker: "<Narration>"
    en: and gaining new strength,
    ko: 새로운 힘을 얻게 되면서,
    ja: それぞれが新しい力を手に入れた
  event_absolute2_01_s_108:
    speaker: "<Narration>"
    en: I thought maybe, just maybe, we could move forward too, just like Vesti said...
    ko: 베스티의 말대로 우리도 앞으로 나아가게 될 거라고 생각했는데….
    ja: |-
      ベスティーの言う通り、
      私たちも前に進めるようになるんだと
      思っていたのに…
  event_absolute2_01_s_109:
    speaker: vesti_t
    en: Th-then why do you always do everything on your own, Eunhwa?
    ko: 그, 그럼 왜 으, 은화가 다 하려는 거야?
    ja: |-
      じゃ、じゃあ、どうして
      全部1人でやろうとするの？
  event_absolute2_01_s_110:
    speaker: vesti_t
    en: I-I'm not who I used to be anymore.
    ko: 나, 나는 이제 이전의 그 모습이 아닌데.
    ja: 私だってもう、昔の私じゃないのに。
  event_absolute2_01_s_111:
    speaker: vesti_t
    en: So why... do you keep telling me to stay at the back?
    ko: 자꾸… 왜 뒤에만 있으라고 하는 거야?
    ja: なんで…いつも引っ込んでろって言うの？
  event_absolute2_01_s_112:
    speaker: vesti_t
    en: Is it because... when I stayed behind to fight with Behemoth...
    ko: 베히모스랑 싸우라고 남았을 때….
    ja: は、初めてベヒモスと戦った時に…
  event_absolute2_01_s_113:
    speaker: vesti_t
    en: I... I lost?
    ko: 내, 내가 져서 그래?
    ja: わ、私が負けたから？
  event_absolute2_01_s_114:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: は？
  event_absolute2_01_s_115:
    speaker: vesti_t
    en: Is that why you don't trust me anymore? Because I couldn't win back then...
    ko: 그때 이기지 못해서… 이젠 날 믿을 수 없어진 거야?
    ja: |-
      あの時勝てなかったせいで…
      私のこと、信じられなくなったの？
  event_absolute2_01_s_116:
    speaker: eunhwa_t
    en: "... Enough already."
    ko: "…시끄러워."
    ja: "…いい加減にしろ。"
  event_absolute2_01_s_117:
    speaker: eunhwa_t
    en: Stop whining, would you? You're getting in your own head.
    ko: 이상한 생각에 빠져서 어리광 부리지 마.
    ja: |-
      くだらない思い込みで、
      訳の分からないことを言うな。
  event_absolute2_01_s_118:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_01_s_119:
    speaker: emma_t
    en: Eunhwa...
    ko: 은화….
    ja: ウンファ…
  event_absolute2_01_s_120:
    speaker: "<Narration>"
    en: I know
    ko: 알아.
    ja: 分かってる
  event_absolute2_01_s_121:
    speaker: "<Narration>"
    en: this too is something our squad will overcome someday.
    ko: 이 또한, 우리 스쿼드라면 언젠가는 이겨낼 수 있는 일이라는 걸.
    ja: 私たちなら、いつかは乗り越えられる
  event_absolute2_01_s_122:
    speaker: "<Narration>"
    en: If I quietly hold my ground this time as well,
    ko: 이번에도 묵묵히 그 자리를 지키고 있어 주면,
    ja: 私は今度も静かに自分の役割を果たすだけ
  event_absolute2_01_s_123:
    speaker: "<Narration>"
    en: I'm sure those two will get back on their feet.
    ko: 분명 두 사람은 다시 일어날 수 있을 거라는 걸.
    ja: あの2人なら、また立ち上がれる
  event_absolute2_01_s_124:
    speaker: "<Narration>"
    en: But... when?
    ko: 하지만… 언제?
    ja: でも…それはいつ？
  event_absolute2_01_s_125:
    speaker: "<Narration>"
    en: Vesti...
    ko: 베스티가.
    ja: ベスティーが…
  event_absolute2_01_s_126:
    speaker: vesti
    en: Comm... ander... Sorry... I couldn't... win...
    ko: |-
      지휘… 관… 님….
      미안… 못… 이겼… 어….
    ja: |-
      指揮官…様…
      ごめん…勝て…なかった…
  event_absolute2_01_s_127:
    speaker: vesti
    en: Pl... ease...
    ko: 부탁… 해….
    ja: お願…い…
  event_absolute2_01_s_128:
    speaker: "<Narration>"
    en: Eunhwa...
    ko: 은화가.
    ja: ウンファが…
  event_absolute2_01_s_129:
    speaker: behemoth
    en: "*Sigh*... You're becoming quite irksome. Take this."
    ko: 아아. 넌 좀 번거로우니까 이거나 하고 있어.
    ja: |-
      あー、お前はちょっとメンドイから
      こっちの相手してな。
  event_absolute2_01_s_130:
    speaker: "<Narration>"
    en: "*Crack crack!*"
    ko: 카가각…! 카각…!
    ja: ガリッ…！ザクザクッ…！
  event_absolute2_01_s_131:
    speaker: eunhwa
    en: Argh!
    ko: 크읏…!
    ja: くっ…！
  event_absolute2_01_s_132:
    speaker: "<Narration>"
    en: Crystal spikes shoot up from the ground, piercing through Eunhwa's body.
    ko: 수많은 수정 가시가 바닥에서 솟아 나와 은화의 몸을 꿰뚫는다.
    ja: |-
      大量のクリスタルのトゲが地面から飛び出し、
      ウンファの体を貫いた
  event_absolute2_01_s_133:
    speaker: vesti
    en: Eunhwa!
    ko: 은화!
    ja: ウンファ！
  event_absolute2_01_s_134:
    speaker: "<Narration>"
    en: After they all died...
    ko: 모두 죽고 난 후?
    ja: "…みんなが、死んでしまってから？"
  event_absolute2_01_s_135:
    speaker: "<Narration>"
    en: what was I supposed to do?
    ko: 그럼 난 어떻게 해야 했던 걸까.
    ja: 私は、どうすればよかったのだろう
  event_absolute2_01_s_136:
    speaker: "<Narration>"
    en: Should I have thrown myself in the moment they collided and burned up with
      them?
    ko: 그때, 둘이 부딪혔던 그 순간에 끼어들어서 함께 불타오르는 것이 나았을까?
    ja: |-
      2人が衝突した時、間に割り込んで
      一緒に火花を散らせばよかった？
  event_absolute2_01_s_137:
    speaker: "<Narration>"
    en: Or would it have been better to quietly hold Eunhwa as her flame faded away?
    ko: 고요하게 불꽃이 꺼져가고 있던 은화의 등을 안아주는 것이 나았을까?
    ja: |-
      ウンファの背中を抱きしめて、
      消えかけた炎を守ってあげればよかった？
  event_absolute2_01_s_138:
    speaker: "<Narration>"
    en: Or was I right to stand back and watch from afar,
    ko: 그럼에도 은화와 베스티가 다시 앞으로 나아갈 수 있을 거라고 믿으면서,
    ja: |-
      それとも、2人ならまた
      前に進めるようになるはずだと信じて…
  event_absolute2_01_s_139:
    speaker: "<Narration>"
    en: believing that Eunhwa and Vesti would somehow find a way forward?
    ko: 멀리서 지켜보는 게 맞았던 걸까?
    ja: 遠くから見守っているだけでいいの？
  event_absolute2_01_s_140:
    speaker: "<Narration>"
    en: I...
    ko: 나는….
    ja: 私は…
  event_absolute2_01_s_141:
    speaker: signal
    en: Emma!
    ko: 엠마…!
    ja: エマ…！
  event_absolute2_01_s_142:
    speaker: emma_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_01_s_143:
    speaker: signal
    en: Are you awake...?
    ko: 저, 정신이 드시나요…?
    ja: だ、大丈夫ですか…？
  event_absolute2_01_s_144:
    speaker: emma_t
    en: Signal...?
    ko: 시그널…?
    ja: シグナル…？
event_absolute2_01_e:
  event_absolute2_01_e_1:
    speaker: emma_t
    en: "*Cough*..."
    ko: "…콜록."
    ja: "…ゴホッ。"
  event_absolute2_01_e_2:
    speaker: emma_t
    en: "*Cough cough*"
    ko: 콜록, 콜록.
    ja: ケホッ、コホッ。
  event_absolute2_01_e_3:
    speaker: signal
    en: A-are you okay?
    ko: 괘, 괜찮으신가요?
    ja: だ、大丈夫ですかっ？
  event_absolute2_01_e_4:
    speaker: emma_t
    en: Yeah, I'm fi...
    ko: 응, 난 괜찮….
    ja: え、ええ、大丈…
  event_absolute2_01_e_5:
    speaker: emma_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_01_e_6:
    speaker: "<Narration>"
    en: Emma frantically looks around.
    ko: 엠마가 다급하게 주위를 둘러보았다.
    ja: エマはあわてて周囲を見回した
  event_absolute2_01_e_7:
    speaker: signal
    en: Are you okay?
    ko: 괜찮으세요?
    ja: ほ、本当に大丈夫ですか…？
  event_absolute2_01_e_8:
    speaker: emma_t
    en: But first... where are we?
    ko: 그보다 여긴…?
    ja: ここは…？
  event_absolute2_01_e_9:
    speaker: signal
    en: A safe place from the Raptures...
    ko: 랩쳐로부터 안전한 곳이에요.
    ja: |-
      あっ、安心してください。
      ここならラプチャーは来ないはずなので…
  event_absolute2_01_e_10:
    speaker: signal
    en: I think.
    ko: 아, 아마도요….
    ja: たぶんですけど…
  event_absolute2_01_e_11:
    speaker: emma_t
    en: Where are Eunhwa and Vesti?
    ko: 은화랑 베스티는?
    ja: ウンファとベスティーは？
  event_absolute2_01_e_12:
    speaker: signal
    en: W-well...
    ko: 그, 그게요….
    ja: えっと、その…
  event_absolute2_01_e_13:
    speaker: scarecommander
    en: They're not here.
    ko: "…그 둘은 여기에 없어."
    ja: "…ここにはいないぞ。"
  event_absolute2_01_e_14:
    speaker: soldiereg
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_e_15:
    speaker: emma_t
    en: They're not here...?
    ko: 여기에 없다, 고….
    ja: "…そうなの？"
  event_absolute2_01_e_16:
    speaker: signal
    en: Yeah...
    ko: 네….
    ja: はい…
  event_absolute2_01_e_17:
    speaker: emma_t
    en: Signal.
    ko: 시그널.
    ja: シグナル。
  event_absolute2_01_e_18:
    speaker: emma_t
    en: Can you tell me what happened while I was unconscious?
    ko: 내가 기절한 사이에 무슨 일이 있었는지 들려줄 수 있어?
    ja: |-
      私が気絶している間に何があったのか、
      教えてくれる？
  event_absolute2_01_e_19:
    speaker: emma_t
    en: So, to sum it up,
    ko: 요약하자면,
    ja: つまり…
  event_absolute2_01_e_20:
    speaker: emma_t
    en: when you were investigating Black Smith's remains, you found signs of a battle.
    ko: 블랙스미스의 잔해를 조사하다가 전투가 벌어진 흔적을 발견.
    ja: |-
      ブラックスミスの残骸の調査中に、
      戦闘の痕跡を発見して…
  event_absolute2_01_e_21:
    speaker: emma_t
    en: You followed the trail here,
    ko: 그 흔적을 쫓아 여기에 다다랐다는 거지?
    ja: その痕跡をたどっていたら、ここに来たのね？
  event_absolute2_01_e_22:
    speaker: emma_t
    en: and that's when you ran into these two.
    ko: 그때, 이 둘과 만난 거고.
    ja: |-
      そこの2人とは、
      その時初めて会ったってことね。
  event_absolute2_01_e_23:
    speaker: signal
    en: Y-yeah...
    ko: 마, 맞아요….
    ja: は、はい…
  event_absolute2_01_e_24:
    speaker: signal
    en: They were fighting hard against a Predator,
    ko: "[프레데터]를 상대로 분전하고 계셔서"
    ja: "「プレデター」に苦戦されていたようなので…"
  event_absolute2_01_e_25:
    speaker: signal
    en: so The Scouts jumped right into the battle.
    ko: 저희 스카우팅도 곧장 전투에 합류했어요.
    ja: 私たちも急いで戦闘に合流したんです。
  event_absolute2_01_e_26:
    speaker: signal
    en: But it didn't really make much of a difference...
    ko: 그런다고 달라지는 건 없었지만요….
    ja: 結局、何の役にも立てませんでしたけど…
  event_absolute2_01_e_27:
    speaker: emma_t
    en: Predator?
    ko: "[프레데터]?"
    ja: "「プレデター」？"
  event_absolute2_01_e_28:
    speaker: signal
    en: That's the name we've given to
    ko: 이번 임무의 조사 대상인,
    ja: はい。今回の調査対象です。
  event_absolute2_01_e_29:
    speaker: signal
    en: the special entities we're investigating...
    ko: 특수 개체에게 임시로 붙인 명칭이에요….
    ja: 特殊個体で、名称はまだ仮のものですが…
  event_absolute2_01_e_30:
    speaker: emma_t
    en: Predator...
    ko: 포식자라….
    ja: プレデター…捕食者ね。
  event_absolute2_01_e_31:
    speaker: emma_t
    en: That's a fitting name.
    ko: 적절한 명칭이네.
    ja: 確かにぴったりの名前だわ～
  event_absolute2_01_e_32:
    speaker: emma_t
    en: So what was the outcome of the battle?
    ko: 그래서 교전 결과는?
    ja: その後、どうなったの？
  event_absolute2_01_e_33:
    speaker: signal
    en: Well...
    ko: 그게….
    ja: それが…
  event_absolute2_01_e_34:
    speaker: signal
    en: Not long after Delta and I joined,
    ko: 저랑 델타가 합류한 지 얼마 안 돼서
    ja: 私とデルタが合流した後…
  event_absolute2_01_e_35:
    speaker: signal
    en: another group of Predators suddenly ambushed us,
    ko: 또 다른 프레데터 무리가 급습하는 바람에
    ja: 新手のプレデターの群れが出現しました。
  event_absolute2_01_e_36:
    speaker: signal
    en: and things quickly went south.
    ko: 전세가 급격히 불리해졌는데요.
    ja: 急襲を受けて、戦況が大幅に悪化してしまい…
  event_absolute2_01_e_37:
    speaker: signal
    en: D-Delta said she'd try to hold them off.
    ko: 데, 델타가 발목이라도 잡아 보겠다며…
    ja: そ、それで、デルタが少しでも時間を稼ごうと…
  event_absolute2_01_e_38:
    speaker: signal
    en: She used a grenade to collapse the passage
    ko: 유탄으로 통로를 무너뜨리고,
    ja: グレネードで通路を爆破して…
  event_absolute2_01_e_39:
    speaker: signal
    en: and managed to lure the Predators away.
    ko: 프레데터를 유인해 줘서
    ja: プレデターを引きつけました。
  event_absolute2_01_e_40:
    speaker: signal
    en: Thanks to her, we barely managed to escape...
    ko: 저희만 겨우 빠져나올 수 있었어요….
    ja: 私たちはなんとか脱出できたんですが…
  event_absolute2_01_e_41:
    speaker: signal
    en: But... since then, we haven't heard anything from Delta...
    ko: 그 뒤로… 델타의 행방은 알 수 없고요….
    ja: その後から…デルタの行方が不明で…
  event_absolute2_01_e_42:
    speaker: emma_t
    en: So that's when you sent the distress signal?
    ko: 그러고 구조 신호를 보낸 거구나.
    ja: 救難信号を送ったのはそのときね。
  event_absolute2_01_e_43:
    speaker: signal
    en: Yeah... I somehow managed to find a spot with a signal,
    ko: 네… 어찌어찌 신호가 잡히는 곳을 찾았거든요….
    ja: はい…なんとか通信が確立できたので…
  event_absolute2_01_e_44:
    speaker: signal
    en: though it cut out not long after.
    ko: 그마저도 금방 끊기긴 했지만요….
    ja: それも短時間だけでしたけど…
  event_absolute2_01_e_45:
    speaker: signal
    en: After sending out the distress signal,
    ko: 구, 구조 신호를 보내고는…
    ja: とにかく、救難信号を送った後は…
  event_absolute2_01_e_46:
    speaker: signal
    en: I started looking for an exit while avoiding the Predators.
    ko: 프레데터를 피해 출구를 찾아다녔는데
    ja: |-
      プレデターとの交戦を避けながら、
      ずっと脱出方法を探していました。
  event_absolute2_01_e_47:
    speaker: signal
    en: Then, all of a sudden, I heard an explosion.
    ko: 갑자기 폭발음이 들렸어요.
    ja: 突然、爆発音が聞こえたので
  event_absolute2_01_e_48:
    speaker: signal
    en: When I headed toward the sound,
    ko: 소리가 들린 곳으로 가보니까,
    ja: 音がする方に行ってみたら…
  event_absolute2_01_e_49:
    speaker: signal
    en: I found you and Eunhwa lying there, unconscious...
    ko: 엠마랑 은화가 기절한 채로 쓰러져 있더라고요….
    ja: |-
      気絶したエマとウンファが
      倒れているのを発見して…
  event_absolute2_01_e_50:
    speaker: emma_t
    en: Just Eunhwa and I?
    ko: 나랑 은화가 기절한 채로…?
    ja: 私とウンファが…？
  event_absolute2_01_e_51:
    speaker: emma_t
    en: What about Vesti?
    ko: 베스티는?
    ja: ベスティーは？
  event_absolute2_01_e_52:
    speaker: signal
    en: I-I'm sorry...
    ko: 죄, 죄송해요….
    ja: す、すみません…
  event_absolute2_01_e_53:
    speaker: signal
    en: It was just the two of you there...
    ko: 거기엔 두 분뿐이었어요….
    ja: 見つけた時には、おふたりの姿しか…
  event_absolute2_01_e_54:
    speaker: emma_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_e_55:
    speaker: emma_t
    en: Since she's not here, I assume Eunhwa already woke up?
    ko: 여기 없는 걸 보니, 은화는 이미 깨어난 거지?
    ja: |-
      ウンファがいないってことは、
      私より先に意識が戻ってるのね？
  event_absolute2_01_e_56:
    speaker: signal
    en: Yeah...
    ko: 네….
    ja: はい…
  event_absolute2_01_e_57:
    speaker: emma_t
    en: Knowing Eunhwa, she probably left me with you guys right after she woke up,
    ko: 은화라면 깨어나자마자 날 너희한테 맡기고,
    ja: 目を覚ましてすぐ、あなたに私のことを任せて…
  event_absolute2_01_e_58:
    speaker: emma_t
    en: then went off alone to look for Vesti.
    ko: 혼자서 베스티를 찾으러 갔겠네.
    ja: 1人でベスティーを捜しに行ったのね。
  event_absolute2_01_e_59:
    speaker: signal
    en: I tried to stop her, but...
    ko: 말리려고는 했는데….
    ja: その、止めようとはしたんですが…
  event_absolute2_01_e_60:
    speaker: emma_t
    en: Hehe, I guess you couldn't get past her stubbornness.
    ko: 후후, 그 고집을 꺾을 순 없었겠지.
    ja: ふふ、そうなったら誰にも止められないわ。
  event_absolute2_01_e_61:
    speaker: emma_t
    en: "... *Sigh*"
    ko: "…후우."
    ja: "…ふぅ。"
  event_absolute2_01_e_62:
    speaker: emma_t
    en: By any chance, do you know which way Eunhwa went?
    ko: 혹시 은화가 어느 쪽으로 갔는지 알 수 있을까?
    ja: ウンファがどっちに行ったかは分かるかしら？
  event_absolute2_01_e_63:
    speaker: signal
    en: Huh?
    ko: 네…?
    ja: えっ…？
  event_absolute2_01_e_64:
    speaker: signal
    en: Y-you're going after Eunhwa?
    ko: 으, 은화를 따라가시려고요?
    ja: まさか、追いかけるおつもりですか？
  event_absolute2_01_e_65:
    speaker: signal
    en: Um... I might not be much help, but... I'd like to come along...
    ko: 그, 그럼 큰 도움은 안 되겠지만… 저라도 같이….
    ja: |-
      で、でしたら、大して役には立ちませんが…
      私も同行を…
  event_absolute2_01_e_66:
    speaker: emma_t
    en: No, someone needs to stay back here to protect these two.
    ko: 시그널. 누군가는 여기 남아서 저 둘을 지키고 있어야지~
    ja: |-
      それはダメよ。誰かはここに残って、
      あの2人を守ってないといけないもの～
  event_absolute2_01_e_67:
    speaker: emma_t
    en: I'll join up with Eunhwa,
    ko: 은화 쪽에 합류해서,
    ja: すぐにウンファと合流して…
  event_absolute2_01_e_68:
    speaker: emma_t
    en: and bring back Vesti and Delta.
    ko: 베스티랑 델타를 데려올게.
    ja: ベスティーとデルタも連れて帰ってくるわ。
  event_absolute2_01_e_69:
    speaker: emma_t
    en: Then we'll all head back to the Ark together.
    ko: 그런 다음에 다 같이 방주로 돌아갈 거니까~
    ja: みんなで一緒にアークに帰りましょ。
  event_absolute2_01_e_70:
    speaker: emma_t
    en: Keep yourself well-hidden in the meantime and lay low, okay?
    ko: 여기 잘 숨어 있어. 알겠지?
    ja: それまで隠れていて。ね？
  event_absolute2_01_e_71:
    speaker: signal
    en: B-but...
    ko: 아, 아무리 그래도….
    ja: で、ですが…
  event_absolute2_01_e_72:
    speaker: signal
    en: It's too dangerous to go alone...
    ko: 혼자서는 너무 위험….
    ja: 1人では危険すぎませんか…？
  event_absolute2_01_e_73:
    speaker: emma_t
    en: It'll be okay.
    ko: 괜찮아.
    ja: 心配ないわ。
  event_absolute2_01_e_74:
    speaker: emma_t
    en: I'm a member of Absolute, after all.
    ko: 난 [앱솔루트]니까.
    ja: 私だって「アブソルート」の一員よ。
  event_absolute2_01_e_75:
    speaker: emma_t
    en: And...
    ko: 그리고….
    ja: それに…
  event_absolute2_01_e_76:
    speaker: emma_t
    en: I've decided I'm done waiting on the sidelines.
    ko: 이제 더는 뒤에서 기다리지 않기로 했거든.
    ja: もう、後ろで待ったりしないって、決めたの。
  event_absolute2_01_e_77:
    speaker: signal
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_e_78:
    speaker: signal
    en: Okay.
    ko: 알겠어요.
    ja: 分かりました。
  event_absolute2_01_e_79:
    speaker: signal
    en: I'll protect these two.
    ko: 두 분은 제가 잘 보호할게요.
    ja: お二人のことは私にお任せください。
  event_absolute2_01_e_80:
    speaker: emma_t
    en: Hehe, okay then.
    ko: 후후, 좋아.
    ja: ふふ、ありがとう。
  event_absolute2_01_e_81:
    speaker: emma_t
    en: I'm counting on you to take good care of them.
    ko: 믿고 맡길게.
    ja: 頼もしいわ～
  event_absolute2_01_e_82:
    speaker: signal
    en: Could you wait a moment?
    ko: 잠시만 기다리시겠어요?
    ja: あっ、少々お待ちいただけますか？
  event_absolute2_01_e_83:
    speaker: signal
    en: I'll draw you a map based on what I remember from wandering around.
    ko: 돌아다녔을 때 기억을 바탕으로 지도를 그려드릴게요.
    ja: 私の記憶を元に、地図を作ってお渡しします。
  event_absolute2_01_e_84:
    speaker: emma_t
    en: Thanks, I'd appreciate that.
    ko: 부탁할게.
    ja: 助かるわ。
  event_absolute2_01_e_85:
    speaker: scarecommander
    en: Are you really going out there again?
    ko: 정말 가겠다고?
    ja: ほ、本当に行くつもりなのか？
  event_absolute2_01_e_86:
    speaker: scarecommander
    en: You're insane! It's a miracle you're even alive right now...!
    ko: 이렇게라도 살아남은 게 기적인데…!
    ja: |-
      今こうして生き残ってるだけでも
      奇跡なんだぞ…！？
  event_absolute2_01_e_87:
    speaker: scarecommander
    en: If you go back out, you'll just get yourself killed...
    ko: 나가면 결국 다 죽을 거야….
    ja: 探しに行ったって死ぬだけだ…
  event_absolute2_01_e_88:
    speaker: scarecommander
    en: Your squadmates are probably long dead!
    ko: 어차피 네 동료들도 다 죽었을 거야…!
    ja: |-
      どうせお前の仲間も、
      とっくに死んでるに決まってる…！
  event_absolute2_01_e_89:
    speaker: scarecommander
    en: F-Falcon too... she pushed it too far... and in the end... she was all alone
      out there...
    ko: 파, 팔콘도… 그렇게 무리하다가 결국… 거기서 혼자….
    ja: |-
      ファ、ファルコンだって…
      あんな無理して、結局ひとりで…
  event_absolute2_01_e_90:
    speaker: soldiereg
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_01_e_91:
    speaker: soldiereg
    en: Falcon...
    ko: "…팔콘…."
    ja: "…ファルコン…"
  event_absolute2_01_e_92:
    speaker: emma_t
    en: Still, I have to go.
    ko: 그래도 가야 해.
    ja: それでも、行くわ。
  event_absolute2_01_e_93:
    speaker: emma_t
    en: My squadmates are definitely alive
    ko: 내 동료들은 분명히~ 살아 있을 거거든.
    ja: 私の仲間が、簡単に死ぬはずないから。
  event_absolute2_01_e_94:
    speaker: emma_t
    en: because we're Absolute.
    ko: "[우린] 앱솔루트니까."
    ja: 私たち、アブソルートだもの。
  event_absolute2_01_e_95:
    speaker: emma_t
    en: I'm sure they're alive.
    ko: 분명히, 살아 있을 거야.
    ja: きっと生きてるわ。
  event_absolute2_01_e_96:
    speaker: emma_t
    en: I believe that.
    ko: 그렇게 믿어.
    ja: 信じてるの。
  event_absolute2_01_e_97:
    speaker: soldiereg
    en: Be... lieve...
    ko: 믿는… 다….
    ja: 信じる…
  event_absolute2_01_e_98:
    speaker: scarecommander
    en: D-do as you please. I-If it goes wrong... it's not on me...
    ko: |-
      마, 마음대로 해.
      자, 잘못돼도… 난 모르니까….
    ja: |-
      す、好きにしろ。
      後悔したって…知らないからな…
  event_absolute2_01_e_99:
    speaker: signal
    en: Emma, here.
    ko: 엠마, 여기요.
    ja: エマ、どうぞ。
  event_absolute2_01_e_100:
    speaker: "<Narration>"
    en: Signal hands the map to Emma.
    ko: 시그널이 지도를 엠마에게 건넸다.
    ja: シグナルがエマに地図を渡した
  event_absolute2_01_e_101:
    speaker: emma_t
    en: Hehe, thanks.
    ko: 후후, 고마워.
    ja: ふふ、ありがとう～
  event_absolute2_01_e_102:
    speaker: emma_t
    en: All right, I'll be off.
    ko: 그럼 다녀올게.
    ja: じゃあ、行ってくるわ。
event_absolute2_02_s:
  event_absolute2_02_s_1:
    speaker: eunhwa_t
    en: Based on Signal's map, it should be just past here...
    ko: 시그널이 그려준 지도대로면, 이 너머부터가….
    ja: シグナルの地図通りなら、この先は…
  event_absolute2_02_s_2:
    speaker: "<Narration>"
    en: Turning the corner, the concourse comes into view.
    ko: 모퉁이를 돌자, 저 멀리 로비가 보였다.
    ja: 角を曲がると、視線の先で空間が広がっている
  event_absolute2_02_s_3:
    speaker: "<Narration>"
    en: Alva Particle generators are installed throughout the area.
    ko: 로비 곳곳엔 에블라 입자 발생 장치가 설치되어 있다.
    ja: |-
      空間のいたるところで
      エブラ粒子の発生装置が目に入った
  event_absolute2_02_s_4:
    speaker: eunhwa_t
    en: "... The Land of the Mage, huh?"
    ko: "…[마의 지대]인가."
    ja: "…「魔の地帯」、か。"
  event_absolute2_02_s_5:
    speaker: eunhwa_t
    en: Tch.
    ko: 쯧.
    ja: チッ。
  event_absolute2_02_s_6:
    speaker: eunhwa_t
    en: I always wondered why the Land of the Mage had a 100% Alva Particle concentration,
    ko: 어째서 북부에 에블라 입자 농도 100%인 [마의 지대]가 생성됐는지 의문이었는데,
    ja: |-
      北部がなぜエブラ粒子の濃度100％なんて
      バカげた環境になるのか疑問に思っていたが…
  event_absolute2_02_s_7:
    speaker: eunhwa_t
    en: but now I get it.
    ko: 이런 이유에서였군.
    ja: こういうことだったのか。
  event_absolute2_02_s_8:
    speaker: eunhwa_t
    en: If we want to avoid the Alva Particle generators
    ko: 에블라 입자 발생 장치를 피해서,
    ja: エブラ粒子の発生装置を避けて…
  event_absolute2_02_s_9:
    speaker: eunhwa_t
    en: and get back to the point where Signal found us...
    ko: 시그널이 우릴 발견한 포인트로 가려면….
    ja: |-
      シグナルに私たちが発見された地点まで
      戻るルートは…
  event_absolute2_02_s_10:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_02_s_11:
    speaker: "<Narration>"
    en: Eunhwa enters a nearby room.
    ko: 은화가 근처의 방에 들어갔다.
    ja: ウンファが近くの部屋に入った
  event_absolute2_02_s_12:
    speaker: "<Narration>"
    en: Inside, there are various old-fashioned weapons.
    ko: 내부엔 여러 재래식 무기가 있었다.
    ja: 旧式の兵器がいくつか置き去りにされている
  event_absolute2_02_s_13:
    speaker: "<Narration>"
    en: This is already the third armory she's come across on the way here.
    ko: 지나오면서 발견한 이런 무기고만 해도 벌써 셋.
    ja: 似たような武器庫をすでに3度発見していた
  event_absolute2_02_s_14:
    speaker: "<Narration>"
    en: Most of the weapons have been left unattended for a long time and can no longer
      function properly.
    ko: 방치된 지 오래되었는지, 비치된 무기 대다수가 제대로 작동하지 않았다.
    ja: |-
      放棄されて久しいのか、
      ほとんどの武器は役に立たない状態だ
  event_absolute2_02_s_15:
    speaker: eunhwa_t
    en: First the Alva Particle generators, now these old weapons.
    ko: 에블라 입자 발생 장치부터 재래식 무기까지.
    ja: エブラ粒子の発生装置に、旧式の兵器…
  event_absolute2_02_s_16:
    speaker: eunhwa_t
    en: What exactly were they gearing up to fight?
    ko: 뭘 상대하려고 배치해 둔 거지?
    ja: いったい何と戦うために…？
  event_absolute2_02_s_17:
    speaker: eunhwa_t
    en: "... Well,"
    ko: "…뭐."
    ja: "…ふん…"
  event_absolute2_02_s_18:
    speaker: eunhwa_t
    en: I guess it doesn't matter anymore.
    ko: 지금은 중요하지 않나.
    ja: 今は後回しだ。
  event_absolute2_02_s_19:
    speaker: "<Narration>"
    en: Eunhwa picks up a sniper rifle.
    ko: 은화가 저격총을 들어 올렸다.
    ja: ウンファは狙撃銃を持ち上げ…
  event_absolute2_02_s_20:
    speaker: "<Narration>"
    en: As she shoulders it, she checks her condition.
    ko: 총을 견착하며, 은화는 자신의 상태를 체크했다.
    ja: 肩に担ぎ、自身の状態を確かめた
  event_absolute2_02_s_21:
    speaker: eunhwa_t
    en: "... Tch."
    ko: "…칫."
    ja: "…チッ。"
  event_absolute2_02_s_22:
    speaker: "<Narration>"
    en: Her injured arm trembles, barely holding on.
    ko: 일전의 전투에서 부상당한 팔이 너덜거리고 있었다.
    ja: 先の戦闘で負傷した腕に力が入らず、ぐらつく
  event_absolute2_02_s_23:
    speaker: eunhwa_t
    en: Still... I can handle the recoil.
    ko: 그래도… 반동을 견딜 수는 있어.
    ja: これなら…反動には耐えられるか。
  event_absolute2_02_s_24:
    speaker: eunhwa_t
    en: "... I can fight a little longer."
    ko: "…좀 더 싸울 수 있어."
    ja: "…まだ戦える。"
  event_absolute2_02_s_25:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャッ
  event_absolute2_02_s_26:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_02_s_27:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バン！
  event_absolute2_02_s_28:
    speaker: "<Narration>"
    en: The bullet hits a sprinkler-like device,
    ko: 총알이 스프링클러처럼 보이는 장치를 때렸다.
    ja: 弾丸がスプリンクラーのような装置に当たった
  event_absolute2_02_s_29:
    speaker: "<Narration>"
    en: but no water comes out.
    ko: 물줄기는 떨어지지 않았다.
    ja: 水は出てこない
  event_absolute2_02_s_30:
    speaker: eunhwa_t
    en: Tch.
    ko: 쯧.
    ja: チッ。
  event_absolute2_02_s_31:
    speaker: eunhwa_t
    en: Nothing useful here.
    ko: 쓸 수 있는 게 없군.
    ja: 使えないな。
  event_absolute2_02_s_32:
    speaker: eunhwa_t
    en: Now then...
    ko: 그럼….
    ja: なら…
  event_absolute2_02_s_33:
    speaker: "<Narration>"
    en: Eunhwa gently picks up a smoke grenade.
    ko: 은화가 슬쩍 연막탄을 집어 들었다.
    ja: ウンファは静かに発煙弾を拾い上げ
  event_absolute2_02_s_34:
    speaker: "<Narration>"
    en: After taking a deep breath,
    ko: 한 번의 심호흡 후,
    ja: 深呼吸をした後…
  event_absolute2_02_s_35:
    speaker: "<Narration>"
    en: she tosses it outside the room.
    ko: 방 밖으로 연막탄을 집어 던졌다.
    ja: 武器庫の外に向かって投げた
  event_absolute2_02_s_36:
    speaker: "<Narration>"
    en: "*Pshhhh*"
    ko: 스스스-
    ja: シューッ――
  event_absolute2_02_s_37:
    speaker: "<Narration>"
    en: The smoke quickly fills the passage.
    ko: 연막은 곧 복도를 완전히 메웠다.
    ja: 煙幕が瞬く間に通路を覆った
  event_absolute2_02_s_38:
    speaker: "<Narration>"
    en: Eunhwa takes cover and holds her breath.
    ko: 은화는 엄폐한 채 숨을 죽였다.
    ja: ウンファは身を隠し、息を潜めた
  event_absolute2_02_s_39:
    speaker: "<Narration>"
    en: A moment later,
    ko: 잠시 후.
    ja: "…しばらくして"
  event_absolute2_02_s_40:
    speaker: "<Narration>"
    en: the smoke slowly settles...
    ko: 희뿌연 연기가 서서히 가라앉자,
    ja: ほの白い煙が少しずつ収まりだした頃…
  event_absolute2_02_s_41:
    speaker: "<Narration>"
    en: "*Grrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_02_s_42:
    speaker: "<Narration>"
    en: A faint silhouette appears from within the smoke.
    ko: 그 사이로 희미한 실루엣이 보였다.
    ja: |-
      煙の中に、おぼろげなシルエットが
      浮かび上がった
  event_absolute2_02_s_43:
    speaker: eunhwa_t
    en: So you were here after all.
    ko: 역시 있었나.
    ja: やはりな。
  event_absolute2_02_s_44:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute2_02_s_45:
    speaker: "<Narration>"
    en: As if sensing their presence has been revealed, gunfire rains down from the
      other side.
    ko: 존재가 드러났다는 걸 인지했는지, 저편에서 총알이 날아왔다.
    ja: |-
      存在に気づかれたことを悟ったのか、
      煙の向こう側から投射物が飛来した
  event_absolute2_02_s_46:
    speaker: "<Narration>"
    en: "*Bang bang!*"
    ko: 탕-! 탕-!
    ja: バン！バン！
  event_absolute2_02_s_47:
    speaker: "<Narration>"
    en: Eunhwa returns fire and quickly scans the situation outside.
    ko: 은화는 대응 사격을 하며 방 밖의 상황을 살짝 확인했다.
    ja: |-
      ウンファは応戦しながら、
      素早く状況を確認した
  event_absolute2_02_s_48:
    speaker: "<Narration>"
    en: Three Predators appear,
    ko: 총 셋의 프레데터가 보였다.
    ja: 目視できたプレデターは3機
  event_absolute2_02_s_49:
    speaker: "<Narration>"
    en: advancing through the smoke in a formation that looks strikingly familiar
      to Eunhwa.
    ko: 프레데터 무리는 진형을 갖춘 채, 연막을 돌파할 기세였다.
    ja: |-
      プレデターの群れは訓練された兵士のごとく
      陣形を整え、煙幕の突破を試みている
  event_absolute2_02_s_50:
    speaker: eunhwa_t
    en: "... FF formation?"
    ko: "…포메이션 FF?"
    ja: "…フォーメーションFF？"
  event_absolute2_02_s_51:
    speaker: eunhwa_t
    en: They're not even Lord-class, yet these Raptures are using this kind of formation?
    ko: 로드 급도 없는데, 랩쳐 놈들이 저런 진형을 갖췄다고?
    ja: |-
      ロード級でもなさそうだが、
      戦術がとれるのか…？
  event_absolute2_02_s_52:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우웅-!!
    ja: ウォォン…！！
  event_absolute2_02_s_53:
    speaker: "<Narration>"
    en: With a low mechanical hum, the Predator in front charges fiercely at Eunhwa.
    ko: 낮은 기계음과 함께 선두의 프레데터가 은화를 향해 맹렬히 달려들었다.
    ja: |-
      低い機械音を響かせ、先頭のプレデターが
      ウンファに向かって突進した
  event_absolute2_02_s_54:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_02_s_55:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute2_02_s_56:
    speaker: "<Narration>"
    en: The other Predators stands in the way, as if providing cover.
    ko: 나머지 프레데터가 엄호하듯 막아섰다.
    ja: |-
      残ったプレデターが援護するかのように
      けん制し、道を塞ぐ
  event_absolute2_02_s_57:
    speaker: "<Narration>"
    en: Then...
    ko: 그렇게,
    ja: そして…
  event_absolute2_02_s_58:
    speaker: "<Narration>"
    en: "*Craaash!*"
    ko: 콰아아앙-!
    ja: バキッ！
  event_absolute2_02_s_59:
    speaker: "<Narration>"
    en: One slams into the wall Eunhwa had been hiding behind, and it crumbles on
      impact.
    ko: 프레데터가 들이받으며, 은화가 엄폐하고 있던 벽이 무너졌다.
    ja: |-
      先鋒のプレデターが、
      ウンファの身を隠す壁を突き破った
event_absolute2_02_e:
  event_absolute2_02_e_1:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 콰직-
    ja: バキッ――
  event_absolute2_02_e_2:
    speaker: "<Narration>"
    en: Footsteps crush broken debris underfoot.
    ko: 무너진 벽의 잔해를 밟는 소리.
    ja: 砕けた壁の残骸を踏みしめる音
  event_absolute2_02_e_3:
    speaker: "<Narration>"
    en: "*Vrrrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_02_e_4:
    speaker: "<Narration>"
    en: It's followed by a stomach-churning mechanical whir.
    ko: 듣기 싫은 기계음.
    ja: 耳障りな機械音
  event_absolute2_02_e_5:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 콰직-
    ja: バキッ――
  event_absolute2_02_e_6:
    speaker: "<Narration>"
    en: More footsteps follow,
    ko: 다시 잔해를 밟는 소리.
    ja: そして、再び残骸を踏む音
  event_absolute2_02_e_7:
    speaker: "<Narration>"
    en: then silence.
    ko: 그리고 정적.
    ja: 一瞬の静寂が広がった
  event_absolute2_02_e_8:
    speaker: "<Narration>"
    en: For a brief moment, the air seems to ripple, and a Predator emerges.
    ko: 일순간 공기가 일렁이더니, 프레데터가 모습을 드러냈다.
    ja: |-
      すぐにかすかな空気の揺らぎが静寂を破り、
      プレデターが姿を現した
  event_absolute2_02_e_9:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute2_02_e_10:
    speaker: "<Narration>"
    en: It sprays bursts of gunfire into likely hiding spots
    ko: 누군가 숨어있을 법한 공간에 기관총을 연사하면서까지,
    ja: |-
      隠れ場所を潰すように、
      容赦ない機関銃の掃射が続く
  event_absolute2_02_e_11:
    speaker: "<Narration>"
    en: as it carefully scans the armory.
    ko: 프레데터는 무기고 곳곳을 둘러보며 무언가를 확인하는 듯 움직였다.
    ja: |-
      プレデターは武器庫をめぐり、
      何かを確認するように歩き回った
  event_absolute2_02_e_12:
    speaker: "<Narration>"
    en: "*Grrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_02_e_13:
    speaker: "<Narration>"
    en: After circling the room for a while, it tilts its head...
    ko: 한동안 무기고를 돌아다니던 프레데터는 고개를 갸웃거리더니,
    ja: |-
      しばらくうろついた後、
      プレデターは首をかしげ…
  event_absolute2_02_e_14:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 콰직-
    ja: バキッ――
  event_absolute2_02_e_15:
    speaker: "<Narration>"
    en: Then, it steps over the debris and moves toward the exit.
    ko: 잔해를 밟으며 밖으로 향했다.
    ja: |-
      壁の残骸を踏みにじりながら
      出口に差しかかった
  event_absolute2_02_e_16:
    speaker: "<Narration>"
    en: At that moment...
    ko: 그 순간.
    ja: その瞬間
  event_absolute2_02_e_17:
    speaker: eunhwa_t
    en: See you in hell.
    ko: 잘 가라.
    ja: くたばれ。
  event_absolute2_02_e_18:
    speaker: "<Narration>"
    en: Eunhwa deactivates her camouflage.
    ko: 은화가 카모플라쥬를 풀었다.
    ja: ウンファのカモフラージュが解かれた
  event_absolute2_02_e_19:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バン――！
  event_absolute2_02_e_20:
    speaker: "<Narration>"
    en: An armor-piercing round bores through the Predator's chest.
    ko: 관통 탄이 프레데터의 가슴팍을 꿰뚫었다.
    ja: 放たれた一撃はプレデターの胸部を貫いた
  event_absolute2_02_e_21:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-
    ja: ドサッ
  event_absolute2_02_e_22:
    speaker: eunhwa_t
    en: One down,
    ko: 하난 처리했고,
    ja: 1匹は片付いたな。
  event_absolute2_02_e_23:
    speaker: eunhwa_t
    en: two to go.
    ko: 남은 건 둘인가.
    ja: 残り2匹か。
  event_absolute2_02_e_24:
    speaker: eunhwa_t
    en: Tch,
    ko: 쯧.
    ja: チッ。
  event_absolute2_02_e_25:
    speaker: eunhwa_t
    en: not much time before the smoke clears.
    ko: 연막이 사라지기까지 얼마 남지 않았군.
    ja: 煙幕も薄くなってきた。
  event_absolute2_02_e_26:
    speaker: eunhwa_t
    en: Better wrap this up fast.
    ko: 나머지도 서둘러 처리해야겠어.
    ja: 時間が無いな。
  event_absolute2_02_e_27:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャッ――
  event_absolute2_02_e_28:
    speaker: "<Narration>"
    en: Eunhwa steps out slowly, keeping her rifle in front of her.
    ko: 총구부터 밀어 넣으며 은화는 천천히 밖으로 나섰다.
    ja: 弾を装填し、ウンファは音もなく部屋を出た
  event_absolute2_02_e_29:
    speaker: "<Narration>"
    en: Amid the smoke,
    ko: 연기 속.
    ja: 煙の向こうに見える影は…
  event_absolute2_02_e_30:
    speaker: "<Narration>"
    en: a faint silhouette appears in the distance.
    ko: 저 멀리 희미한 실루엣이 하나 보였다.
    ja: 1つしかない
  event_absolute2_02_e_31:
    speaker: eunhwa_t
    en: Another one?!
    ko: 하나?!
    ja: なに！？
  event_absolute2_02_e_32:
    speaker: "<Narration>"
    en: "*Grrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_02_e_33:
    speaker: "<Narration>"
    en: As Eunhwa quickly twists her body, something pounces on her.
    ko: 황급히 몸을 틀자, 무언가 은화를 덮쳤다.
    ja: |-
      とっさに体の向きを変えたウンファに
      何かが飛びかかった
  event_absolute2_02_e_34:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_02_e_35:
    speaker: "<Narration>"
    en: A Predator bares its teeth and attempts to bite her.
    ko: 이빨을 드러낸 프레데터가 은화를 물어뜯기 위해 달려들었다.
    ja: |-
      牙をむき出しにしたプレデターが、
      ウンファに食らいつこうとしている
  event_absolute2_02_e_36:
    speaker: eunhwa_t
    en: Argh!
    ko: 큭!
    ja: くっ！
  event_absolute2_02_e_37:
    speaker: "<Narration>"
    en: She barely manages to shove the muzzle of her gun into its mouth, narrowly
      avoiding a fatal wound. However, she is gradually overwhelmed by its strength.
    ko: 간신히 입에 총신을 끼워 넣어 치명상은 피했으나, 점차 힘에서 밀려갔다.
    ja: |-
      プレデターの口に銃身を突っ込み
      致命傷を避けたが、すでに負傷した身だ。
      力をはね返しきれない
  event_absolute2_02_e_38:
    speaker: eunhwa_t
    en: Damnit...!
    ko: 젠장…!
    ja: チッ…！
  event_absolute2_02_e_39:
    speaker: "<Narration>"
    en: Eunhwa draws her combat knife and stabs it into the Predator's eye.
    ko: 은화는 군용 나이프를 뽑아, 프레데터의 눈을 찔렀다.
    ja: |-
      ウンファは軍用ナイフを抜き
      プレデターの眼部を突いた
  event_absolute2_02_e_40:
    speaker: "<Narration>"
    en: "*Woooooo*"
    ko: 우우우우우우-!!
    ja: ウウウウウウ…！！
  event_absolute2_02_e_41:
    speaker: "<Narration>"
    en: But the Predator doesn't back down
    ko: 그러나 프레데터 역시 물러서지 않고,
    ja: だが、プレデターはひるむ気配を見せない
  event_absolute2_02_e_42:
    speaker: "<Narration>"
    en: and aims the machine gun mounted on its shoulder at Eunhwa.
    ko: 어깻죽지에 달린 기관총을 은화에게 향했다.
    ja: 肩の機関銃がウンファに向けられた
  event_absolute2_02_e_43:
    speaker: "<Narration>"
    en: At that moment...
    ko: 그 순간.
    ja: その瞬間…
  event_absolute2_02_e_44:
    speaker: "<Narration>"
    en: "*Rat-tat-tat-tat*"
    ko: 투두두두-
    ja: ドドドドッ――
  event_absolute2_02_e_45:
    speaker: "<Narration>"
    en: "*Grrr*"
    ko: 크르릉-
    ja: グルル…
  event_absolute2_02_e_46:
    speaker: "<Narration>"
    en: The crack of gunfire rings out, driving the Predator back.
    ko: 총성과 함께 프레데터가 뒤로 밀려났다.
    ja: |-
      激しい銃声が響くと同時に、
      プレデターが飛び下がった
  event_absolute2_02_e_47:
    speaker: emma_t
    en: "*Huff, huff...*"
    ko: "…하아, 하아."
    ja: はあ、はあ…
  event_absolute2_02_e_48:
    speaker: emma_t
    en: I made it in time.
    ko: 늦진 않았네.
    ja: 間に合ったみたいね。
  event_absolute2_02_e_49:
    speaker: eunhwa_t
    en: Emma?
    ko: 엠마?
    ja: エマ？
  event_absolute2_02_e_50:
    speaker: emma_t
    en: Mind if I join in?
    ko: 응전할게.
    ja: 一緒に戦うわ。
  event_absolute2_02_e_51:
    speaker: emma_t
    en: I'll take the front,
    ko: 전열은 내가 맡을 테니.
    ja: 前は私に任せて。
  event_absolute2_02_e_52:
    speaker: emma_t
    en: so watch my back, okay?
    ko: 은화, 넌 지원 사격을 부탁해.
    ja: ウンファは後ろから援護を。
  event_absolute2_02_e_53:
    speaker: emma_t
    en: Don't worry about their optical camouflage.
    ko: 광학미채는 신경 쓰지 마.
    ja: 光学迷彩は無力化してあるわ。
  event_absolute2_02_e_54:
    speaker: emma_t
    en: I've already deployed the jammers.
    ko: 재머는 이미 뿌려뒀거든.
    ja: もう妨害をかけておいたから。
  event_absolute2_02_e_55:
    speaker: emma_t
    en: Let's do this...
    ko: 그럼….
    ja: 行くわよ…
  event_absolute2_02_e_56:
    speaker: emma_t
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
event_absolute2_03_s:
  event_absolute2_03_s_1:
    speaker: emma_t
    en: All clear.
    ko: 상황 종료.
    ja: 状況終了。
  event_absolute2_03_s_2:
    speaker: emma_t
    en: Three Predators neutralized.
    ko: 프레데터 3기, 침묵 확인.
    ja: プレデター3機、沈黙を確認。
  event_absolute2_03_s_3:
    speaker: emma_t
    en: Whew...
    ko: 후우….
    ja: ふぅ…
  event_absolute2_03_s_4:
    speaker: emma_t
    en: Are you okay?
    ko: 괜찮아?
    ja: 大丈夫だった？
  event_absolute2_03_s_5:
    speaker: eunhwa_t
    en: Well, as you can see.
    ko: 뭐, 보다시피.
    ja: ふん…見ての通りだ。
  event_absolute2_03_s_6:
    speaker: "<Narration>"
    en: Eunhwa raises her left arm with much difficulty.
    ko: 은화가 움직이기 버거운 듯, 느릿하게 왼팔을 들어 올렸다.
    ja: |-
      ウンファは見るからに動かしづらそうな様子で
      ゆっくりと左腕を持ち上げた
  event_absolute2_03_s_7:
    speaker: emma_t
    en: "... You're not looking so great."
    ko: "…상태가 좋지 않네."
    ja: "…大丈夫じゃなさそうね。"
  event_absolute2_03_s_8:
    speaker: eunhwa_t
    en: It's still moving, so I can fight just fine.
    ko: 아직 움직이긴 하니까, 전투엔 문제없어.
    ja: まだ動く。戦える。
  event_absolute2_03_s_9:
    speaker: eunhwa_t
    en: I'll replace the part after we return.
    ko: 복귀해서 파츠는 교체해야겠지만.
    ja: 帰還次第パーツ交換になるだろうがな。
  event_absolute2_03_s_10:
    speaker: emma_t
    en: Then you're not okay at all...!
    ko: 그럼 괜찮은 게 아니…!
    ja: それは戦えるって言わないの。
  event_absolute2_03_s_11:
    speaker: eunhwa_t
    en: We'll head to where Signal found us. From there, we'll track Vesti's trail
    ko: 시그널이 우릴 발견한 지점으로 가서 베스티의 흔적을 추적.
    ja: |-
      まずはシグナルに発見された地点に戻り、
      ベスティーを探す。
  event_absolute2_03_s_12:
    speaker: eunhwa_t
    en: and regroup with her.
    ko: 이후, 베스티와 합류한다.
    ja: ベスティーと合流の後は…
  event_absolute2_03_s_13:
    speaker: eunhwa_t
    en: If possible, we'll confirm Delta's status
    ko: 가능하면 델타의 생사까지 확인한 뒤,
    ja: 可能であればデルタの消息も確認する。
  event_absolute2_03_s_14:
    speaker: eunhwa_t
    en: before heading back.
    ko: 다시 거점으로 복귀하도록 하지.
    ja: 帰還はそれからだ。
  event_absolute2_03_s_15:
    speaker: emma_t
    en: You're gonna keep going in that condition?
    ko: 그 상태로 계속 가겠다고?
    ja: その状態で、作戦を続行するつもり？
  event_absolute2_03_s_16:
    speaker: eunhwa_t
    en: "... If that's clear, let's move out."
    ko: "…이해했으면, 계속 이동한다."
    ja: "…理解できたな？移動するぞ。"
  event_absolute2_03_s_17:
    speaker: "<Narration>"
    en: Eunhwa walks past Emma and steps into a dark passage.
    ko: 은화는 엠마를 지나쳐 어두운 통로로 나아갔다.
    ja: |-
      ウンファはエマの脇をすり抜け
      暗い通路に踏み出した
  event_absolute2_03_s_18:
    speaker: emma_t
    en: "... *Sigh*"
    ko: "…하아."
    ja: "…もう。"
  event_absolute2_03_s_19:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バン――！
  event_absolute2_03_s_20:
    speaker: "<Narration>"
    en: Flames belch out from the muzzle of Eunhwa's rifle.
    ko: 은화의 총구가 불을 뿜었다.
    ja: ウンファの銃が火を吹いた
  event_absolute2_03_s_21:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-
    ja: ドサッ…
  event_absolute2_03_s_22:
    speaker: "<Narration>"
    en: Another Predator collapses.
    ko: 또 하나의 프레데터가 쓰러졌다.
    ja: プレデターがまた1機倒れた
  event_absolute2_03_s_23:
    speaker: eunhwa_t
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  event_absolute2_03_s_24:
    speaker: eunhwa_t
    en: It's never-ending.
    ko: 끝도 없군.
    ja: キリがないな。
  event_absolute2_03_s_25:
    speaker: eunhwa_t
    en: Are you picking up any more of them?
    ko: 더 감지되는 놈은?
    ja: 他に感知できた個体は？
  event_absolute2_03_s_26:
    speaker: emma_t
    en: There's nothing within my detection range, at least.
    ko: 적어도 내 감지 범위 내에는 없어.
    ja: 少なくとも、私の分かる範囲内にはいないわ。
  event_absolute2_03_s_27:
    speaker: eunhwa_t
    en: Tch.
    ko: 쯧.
    ja: チッ。
  event_absolute2_03_s_28:
    speaker: eunhwa_t
    en: So it's a battle of attrition.
    ko: 소모전이 목적인가.
    ja: 消耗戦が狙いか。
  event_absolute2_03_s_29:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_03_s_30:
    speaker: "<Narration>"
    en: Eunhwa approaches the Predator's corpse.
    ko: 은화는 프레데터의 사체 앞에 다가갔다.
    ja: ウンファはプレデターの残骸に近づいた
  event_absolute2_03_s_31:
    speaker: eunhwa_t
    en: The two machine guns on their shoulders are just auxiliary weapons.
    ko: 어깨 쪽에 달린 기관총 2정은 보조 무장이고,
    ja: 両肩のマシンガンはあくまで補助武装だ。
  event_absolute2_03_s_32:
    speaker: eunhwa_t
    en: Their main weapons are blades shaped like fangs and claws.
    ko: 사실상 주 무장은 이빨과 발톱 형태의 칼날.
    ja: 本命のエモノは牙と爪のようなブレード。
  event_absolute2_03_s_33:
    speaker: eunhwa_t
    en: As long as we maintain our distance, they're not hard to handle,
    ko: 거리만 유지할 수 있으면 상대하긴 어렵지 않은데,
    ja: 間合いさえ維持できれば、相手にできる。
  event_absolute2_03_s_34:
    speaker: eunhwa_t
    en: but their optical camouflage and jamming make things tricky.
    ko: 광학미채와 재밍을 사용한다는 점이 까다롭군.
    ja: |-
      そうさせないための光学迷彩と
      ステルス機能が面倒だ。
  event_absolute2_03_s_35:
    speaker: emma_t
    en: Also...
    ko: 그리고….
    ja: その通りね…
  event_absolute2_03_s_36:
    speaker: emma_t
    en: Eunhwa, you felt it too, right?
    ko: 은화, 너도 느꼈지?
    ja: それから…ウンファも分かってるのね？
  event_absolute2_03_s_37:
    speaker: emma_t
    en: These Raptures are quite different from any we've faced before.
    ko: 지금껏 상대한 랩쳐랑은 뭔가 다르다는걸.
    ja: |-
      今まで戦ってきたラプチャーとは
      何かが違うって。
  event_absolute2_03_s_38:
    speaker: eunhwa_t
    en: Yeah.
    ko: 그래.
    ja: ああ。
  event_absolute2_03_s_39:
    speaker: eunhwa_t
    en: These things understand tactics.
    ko: 이놈들은 전술이 뭔지 이해하고 있어.
    ja: こいつらは戦術というものを理解している。
  event_absolute2_03_s_40:
    speaker: eunhwa_t
    en: They might not pull off complex maneuvers,
    ko: 복잡한 전술까진 구사하지 못해도,
    ja: 高度な戦術とは言えないにしても…
  event_absolute2_03_s_41:
    speaker: eunhwa_t
    en: but they've got the hunting strategies down.
    ko: 사냥에 필요한 전술들은 갖춘 모양이야.
    ja: 猟犬程度にはできるようだ。
  event_absolute2_03_s_42:
    speaker: eunhwa_t
    en: They've probably been hunting Raptures and Nikkes with those skills,
    ko: 그걸 바탕으로 랩쳐나 니케를 사냥해서,
    ja: それを駆使して、ラプチャーやニケを狩り…
  event_absolute2_03_s_43:
    speaker: eunhwa_t
    en: devouring their cores to grow stronger.
    ko: 코어를 먹고 성장해 왔겠지.
    ja: コアを食らって成長してきたに違いない。
  event_absolute2_03_s_44:
    speaker: emma_t
    en: Where could they have been hiding all this time?
    ko: 지금까지 어디 숨어 있다가 나온 걸까?
    ja: 今までどこにいたのかしら？
  event_absolute2_03_s_45:
    speaker: emma_t
    en: Using tactical moves is one thing,
    ko: 전술을 구사하거나,
    ja: 連携戦術を使うこともそうだし…
  event_absolute2_03_s_46:
    speaker: emma_t
    en: but I really doubt Raptures that grow by eating cores are recorded in the
      Ark database, right?
    ko: 코어를 먹고 성장하는 랩쳐의 기록은 방주에 없지 않아?
    ja: |-
      コアを捕食して成長するラプチャーなんて、
      アークの記録にはなかったはずよ？
  event_absolute2_03_s_47:
    speaker: eunhwa_t
    en: Well,
    ko: 뭐.
    ja: フン。
  event_absolute2_03_s_48:
    speaker: eunhwa_t
    en: just by looking at the map drawn by that guy aboard Mother Whale,
    ko: 마더 웨일을 타고 있던 민간인이 그렸다는 지도만 봐도 알 수 있듯이
    ja: |-
      例のマザーホエールに乗った民間人の
      地図も同じだ。
  event_absolute2_03_s_49:
    speaker: eunhwa_t
    en: you can tell the surface is full of unknowns.
    ko: 지상은 미지의 것들로 가득하니,
    ja: 地上は未知の存在だらけになっている。
  event_absolute2_03_s_50:
    speaker: eunhwa_t
    en: So it's not surprising that things like that exist.
    ko: 저런 것들이 있다고 해도 이상하진 않겠지.
    ja: なら、こういう奴らがいてもおかしくはない。
  event_absolute2_03_s_51:
    speaker: eunhwa_t
    en: After all, there were no records of Behemoth or Leviathan in the Ark until
      recently either.
    ko: 베히모스와 레비아탄의 기록도 그전까진 방주에 없었잖아.
    ja: |-
      ベヒモスやレヴィアタンも、
      アークの記録にはなかったものだ。
  event_absolute2_03_s_52:
    speaker: emma_t
    en: Hmm, I guess that's true.
    ko: 음~ 그건 그렇겠네.
    ja: うーん…言われてみればそうね。
  event_absolute2_03_s_53:
    speaker: eunhwa_t
    en: "... I'm worried about Vesti."
    ko: "……베스티가 걱정이군."
    ja: "…今の問題はベスティーだ。"
  event_absolute2_03_s_54:
    speaker: eunhwa_t
    en: We're almost at the place where Signal found us.
    ko: 곧 시그널이 우릴 발견한 포인트다.
    ja: シグナルが私たちを見つけた場所はもうすぐだ。
  event_absolute2_03_s_55:
    speaker: eunhwa_t
    en: Let's hurry.
    ko: 서두르자.
    ja: 急ぐぞ。
  event_absolute2_03_s_56:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 타앙-!
    ja: バン――！
  event_absolute2_03_s_57:
    speaker: "<Narration>"
    en: After completely destroying the core of a fallen Predator,
    ko: 쓰러진 프레데터의 코어를 완전히 파괴한 뒤,
    ja: 撃破したプレデターのコアを完全に破壊し…
  event_absolute2_03_s_58:
    speaker: "<Narration>"
    en: Eunhwa moves forward again.
    ko: 은화는 다시 앞으로 나아갔다.
    ja: ウンファはさらに前へ進んだ
  event_absolute2_03_s_59:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 터벅- 터벅-
    ja: ザッ…ザッ…
  event_absolute2_03_s_60:
    speaker: "<Narration>"
    en: Her pace is noticeably slower than before.
    ko: "…아까에 비해 현저히 느려진 걸음으로."
    ja: "…しかし、足取りは明らかに鈍くなりつつある"
  event_absolute2_03_s_61:
    speaker: emma_t
    en: Honestly... who's supposed to be worrying about whom here?
    ko: "…정말. 누가 누구보고 걱정이라는 걸까."
    ja: "…もう…自分の心配はいつも後回しね。"
event_absolute2_03_e:
  event_absolute2_03_e_1:
    speaker: "<Narration>"
    en: At the end of the passage,
    ko: 통로의 끝.
    ja: 長い通路を抜けた
  event_absolute2_03_e_2:
    speaker: "<Narration>"
    en: the ceiling has caved in, revealing a concourse torn in half.
    ko: 천장이 무너져 내려, 반토막이 난 로비가 나왔다.
    ja: 開けた空間の天井が崩落し、半壊している
  event_absolute2_03_e_3:
    speaker: emma_t
    en: "... So this is the upper floor we fell from, huh?"
    ko: "…이 위층이 우리가 떨어진 그곳인가 보네."
    ja: "…私たちが見つかった場所ね。"
  event_absolute2_03_e_4:
    speaker: emma_t
    en: Wow, we fell from that high up?
    ko: 우리 저렇게 높은 데서 떨어진 거였구나.
    ja: こんな高さから落ちたなんて…
  event_absolute2_03_e_5:
    speaker: emma_t
    en: There's gotta be a way back, right?
    ko: 돌아갈 방법이 있겠지?
    ja: 出る方法はあるのかしら。
  event_absolute2_03_e_6:
    speaker: eunhwa_t
    en: Considering that the Predators snuck up on us from behind, there must be a
      through route.
    ko: 프레데터 놈들이 따라온 걸 보면, 돌아갈 순 있겠지.
    ja: |-
      プレデターどもが追ってきたなら、
      何か道はあるはずだ。
  event_absolute2_03_e_7:
    speaker: eunhwa_t
    en: An underground facility like this has to have an exit somewhere too.
    ko: 영문 모를 시설을 이런 지하에 뚫어놨으니, 어딘가엔 출구도 있을 테고.
    ja: |-
      訳の分からない地下施設だが、
      施設である以上、出入口は作るだろう。
  event_absolute2_03_e_8:
    speaker: eunhwa_t
    en: At any rate, we'll think about that later.
    ko: 뭐. 그런 건 나중에 생각하고,
    ja: まあ、それは後で考えればいい。
  event_absolute2_03_e_9:
    speaker: eunhwa_t
    en: For now, let's focus on finding Vesti.
    ko: 일단 베스티를 찾는 데 집중하자.
    ja: ベスティーの発見が先だ。
  event_absolute2_03_e_10:
    speaker: emma_t
    en: "... Yeah."
    ko: "…그래."
    ja: "…そうね。"
  event_absolute2_03_e_11:
    speaker: "<Narration>"
    en: Even after searching every nook and cranny of the concourse,
    ko: 그러나 로비 곳곳을 샅샅이 뒤져보았음에도,
    ja: 2人は周辺をくまなく捜索したが
  event_absolute2_03_e_12:
    speaker: "<Narration>"
    en: no trace of Vesti is found.
    ko: 베스티의 흔적은 발견되지 않았다.
    ja: ベスティーの手がかりは見つからなかった
  event_absolute2_03_e_13:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_03_e_14:
    speaker: emma_t
    en: "... Eunhwa."
    ko: "…은화."
    ja: "…ウンファ。"
  event_absolute2_03_e_15:
    speaker: emma_t
    en: I don't think she's here.
    ko: 아무래도 여기엔 없는 것 같아.
    ja: ここにはいないみたいよ。
  event_absolute2_03_e_16:
    speaker: emma_t
    en: Before we move on, let's get ourselves patched up a bit first...
    ko: 다음으로 가기 전에 일단 몸을 정비하고….
    ja: これ以上捜すより、先にボディの整備を…
  event_absolute2_03_e_17:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 쿵-!
    ja: ガン！
  event_absolute2_03_e_18:
    speaker: "<Narration>"
    en: Eunhwa slams her fist into the debris.
    ko: 은화가 주먹으로 잔해더미를 내려쳤다.
    ja: ウンファが拳をがれきの山に叩きつけた
  event_absolute2_03_e_19:
    speaker: eunhwa_t
    en: Damnit...
    ko: "…젠장."
    ja: "…クソッ…"
  event_absolute2_03_e_20:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 쿵-!
    ja: ガン！
  event_absolute2_03_e_21:
    speaker: eunhwa_t
    en: Damnit!
    ko: 젠장!
    ja: クソッ！
  event_absolute2_03_e_22:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 쿵-!
    ja: バキッ！
  event_absolute2_03_e_23:
    speaker: eunhwa_t
    en: Damni...
    ko: 젠…!
    ja: クッ…！
  event_absolute2_03_e_24:
    speaker: "<Narration>"
    en: "*Grab*"
    ko: 덥석-
    ja: ガシッ――
  event_absolute2_03_e_25:
    speaker: "<Narration>"
    en: Emma grabs Eunhwa's wrist.
    ko: 엠마가 은화의 손목을 잡았다.
    ja: エマがウンファの手首を取り押さえた
  event_absolute2_03_e_26:
    speaker: emma_t
    en: Eunhwa, stop!
    ko: 은화, 그만!
    ja: "…ウンファ、やめて！"
  event_absolute2_03_e_27:
    speaker: emma_t
    en: That's enough!
    ko: 그만해!!
    ja: 落ち着いて！！
  event_absolute2_03_e_28:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_03_e_29:
    speaker: "<Narration>"
    en: "*Flop*"
    ko: 툭-
    ja: ブラッ――
  event_absolute2_03_e_30:
    speaker: "<Narration>"
    en: Eunhwa's arm hangs down limply.
    ko: 은화의 팔이 힘없이 아래로 떨어졌다.
    ja: ウンファの腕が力なく垂れさがった
  event_absolute2_03_e_31:
    speaker: eunhwa_t
    en: "... Let's move."
    ko: "…움직이자."
    ja: "…行くぞ。"
  event_absolute2_03_e_32:
    speaker: eunhwa_t
    en: We have to.
    ko: 움직여야 해.
    ja: 行かないと。
  event_absolute2_03_e_33:
    speaker: eunhwa_t
    en: Vesti must be beyond the debris. We'll find her on the other side... I'm sure
      of it.
    ko: "베스티는 잔해 너머에 있을 거다. \n분명 반대쪽에…."
    ja: |-
      きっとこのがれきの向こう側だ。
      ベスティーは先に…
  event_absolute2_03_e_34:
    speaker: emma_t
    en: Yeah, but how exactly are you going to get through all that rubble?
    ko: 저렇게 잔뜩 쌓인 잔해 너머로 어떻게 넘어가는데?
    ja: |-
      そうだとして、どうやって
      向こう側に行くつもり？
  event_absolute2_03_e_35:
    speaker: eunhwa_t
    en: We'll break through somehow.
    ko: 어떻게든 뚫고 가면 되겠지.
    ja: どうにか突き破って…
  event_absolute2_03_e_36:
    speaker: emma_t
    en: Okay, but how?
    ko: 그러니까, 어떻게?
    ja: 突破するって、具体的な方法は？
  event_absolute2_03_e_37:
    speaker: eunhwa_t
    en: We'll figure it out!
    ko: 어떻게든…!
    ja: それは…！
  event_absolute2_03_e_38:
    speaker: emma_t
    en: Eunhwa,
    ko: 은화.
    ja: ウンファ。
  event_absolute2_03_e_39:
    speaker: emma_t
    en: do you really think that's the right thing to do?
    ko: 그게 정말 옳은 판단이라고 생각해?
    ja: 冷静な判断はできてるの？
  event_absolute2_03_e_40:
    speaker: eunhwa_t
    en: We don't have time for this. Let's move...
    ko: |-
      지금 너와 이러고 있을 시간 없어.
      움직….
    ja: |-
      話している時間などない。
      早く…
  event_absolute2_03_e_41:
    speaker: emma_t
    en: We can't go...
    ko: 못 가.
    ja: 行かないわ。
  event_absolute2_03_e_42:
    speaker: emma_t
    en: No, actually, we won't.
    ko: 아니, 안 가.
    ja: いいえ、行けない。
  event_absolute2_03_e_43:
    speaker: eunhwa_t
    en: What?
    ko: 뭐?
    ja: は？
  event_absolute2_03_e_44:
    speaker: emma_t
    en: I can't follow orders from a Commander
    ko: 현재 상황도 제대로 파악하지 못하고,
    ja: 今の状況をまともに理解できてない。
  event_absolute2_03_e_45:
    speaker: emma_t
    en: who doesn't even understand the situation
    ko: 앞으로의 계획도 [어떻게든]이라고 말하는,
    ja: この先の計画も「何とかする」って言うだけ。
  event_absolute2_03_e_46:
    speaker: emma_t
    en: and says the plan is to just "figure it out somehow."
    ko: "[삼류] 지휘관의 지시는 따를 수 없어."
    ja: そんな「三流」指揮官には従えないわ。
  event_absolute2_03_e_47:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_03_e_48:
    speaker: eunhwa_t
    en: What did you just...!
    ko: 지금 뭐라고…!
    ja: 何を言うかと思えば…！
  event_absolute2_03_e_49:
    speaker: emma_t
    en: Look at the state you're in.
    ko: 지금 은화의 상태를 봐.
    ja: ウンファ、自分の状態をよく見て。
  event_absolute2_03_e_50:
    speaker: emma_t
    en: Okay, say we somehow manage to get past that rubble in our current condition
    ko: 그래. 네 말대로 어떻게든 지금의 그 상태로 저 벽을 넘어가서,
    ja: |-
      仮にあなたの言う通り、
      今の状態で何とかしてこの山を越えて…
  event_absolute2_03_e_51:
    speaker: emma_t
    en: and find Vesti.
    ko: 어떻게든 베스티를 만난다고 하자.
    ja: 何とかしてベスティーも見つかったとして。
  event_absolute2_03_e_52:
    speaker: emma_t
    en: Then what?
    ko: 그래서 뭐가 달라지는데?
    ja: その後はどうするの？
  event_absolute2_03_e_53:
    speaker: emma_t
    en: How exactly are you going to help Vesti with that wrecked arm and those slowed
      legs?
    ko: 그 너덜거리는 팔로, 느려진 다리로 어떻게 베스티를 도와줄 수 있는데?
    ja: |-
      ボロボロの腕とまともに動かない足で、
      どうやってベスティーを助けるつもり？
  event_absolute2_03_e_54:
    speaker: eunhwa_t
    en: I don't have time to worry about that.
    ko: 그딴 거 신경쓰고 있을 시간 없어.
    ja: そんなことを気にしている時間はない。
  event_absolute2_03_e_55:
    speaker: eunhwa_t
    en: If we waste even a second in a situation like this...
    ko: 이런 상황에서 시간을 지체하면…!
    ja: 今は1分1秒を争う事態なん…！
  event_absolute2_03_e_56:
    speaker: emma_t
    en: Deep down, you think Vesti's already dead, don't you?
    ko: 사실은 베스티가 이미 죽었을 거라고 생각하지?
    ja: ベスティーはもう死んだって思ってるんでしょ？
  event_absolute2_03_e_57:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_03_e_58:
    speaker: emma_t
    en: You're convinced she couldn't possibly survive on her own.
    ko: 베스티가 혼자서는 절대 살아남을 수 없을 거라고.
    ja: あの子1人じゃ絶対に生き残れないって。
  event_absolute2_03_e_59:
    speaker: emma_t
    en: That the moment she got separated from us,
    ko: 그 애는 분명 혼자 떨어졌으니,
    ja: 私たちと違って、1人で落ちていったから…
  event_absolute2_03_e_60:
    speaker: emma_t
    en: she'd be helplessly devoured by a Predator.
    ko: 속절없이 프레데터에게 잡아먹혔을 거라고 생각하고 있지?
    ja: |-
      もうとっくに、プレデターに
      食べられたって思ってるのよね？
  event_absolute2_03_e_61:
    speaker: eunhwa_t
    en: N-no...
    ko: 아니… 야.
    ja: そんな…ことは…
  event_absolute2_03_e_62:
    speaker: emma_t
    en: You think that she's doomed if she doesn't have you by her side.
    ko: "은화가 함께 있지 못했으니까, \n베스티가 이미 죽었을 거라고 생각하고 있잖아."
    ja: |-
      あなたは自分が
      そばで守ってあげられなかったから、
      ベスティーが死んだって思ってる。
  event_absolute2_03_e_63:
    speaker: emma_t
    en: Because you don't trust her. No, you don't trust us.
    ko: 그 애를 못 믿어서.
    ja: あの子を信じてないから。
  event_absolute2_03_e_64:
    speaker: emma_t
    en: That's why you're pushing yourself harder than usual.
    ko: 아니, 우리를 믿지 못해서 평소보다 무리하고 있는 거잖아.
    ja: |-
      …いいえ。
      私たちのことが信じられないから、
      ずっと無理してるの。
  event_absolute2_03_e_65:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_03_e_66:
    speaker: emma_t
    en: You're the leader of the Absolute Squad...
    ko: 누구보다 앱솔루트 스쿼드가 완벽하다고 생각하고 있어야 하는,
    ja: |-
      誰よりもアブソルートのことを完璧だって
      信じてなくちゃいけない…
  event_absolute2_03_e_67:
    speaker: emma_t
    en: The one who should believe more than anyone
    ko: 앱솔루트 스쿼드의 리더가.
    ja: リーダーのあなたが。
  event_absolute2_03_e_68:
    speaker: emma_t
    en: that we're perfect.
    ko: 우리가 완벽하지 않다고 생각하고 있는 거잖아.
    ja: |-
      誰よりも、私たちのことを
      完璧じゃないって思ってる。
  event_absolute2_03_e_69:
    speaker: emma_t
    en: But you don't, do you?
    ko: 아니야?
    ja: "…違った？"
  event_absolute2_03_e_70:
    speaker: eunhwa_t
    en: Never again!
    ko: 다시는!
    ja: っ…二度と！
  event_absolute2_03_e_71:
    speaker: eunhwa_t
    en: I never want to see someone precious to me end up like that...!
    ko: 다시는 소중한 동료가 그렇게 되는 걸 보고 싶지 않으니까.
    ja: 二度と、仲間が倒れる姿を見ないためには…！
  event_absolute2_03_e_72:
    speaker: eunhwa_t
    en: I never want to lose like that again...!
    ko: 다시는, 그런 식으로 지고 싶지 않으니까.
    ja: 二度と、あんなブザマに負けないためには…！
  event_absolute2_03_e_73:
    speaker: eunhwa_t
    en: Even if it means pushing myself too far...!
    ko: 내가 무리하는 한이 있더라도…!
    ja: そうするしかないんだ！！
  event_absolute2_03_e_74:
    speaker: eunhwa_t
    en: If it's for a perfect victory, then no one must get hurt—no one!
    ko: 완벽한 승리를 위해서라면, 아무도 다치지 않아야…!
    ja: |-
      完璧な勝利のためには、
      仲間の犠牲があっては…っ！
  event_absolute2_03_e_75:
    speaker: emma_t
    en: Why?
    ko: 왜?
    ja: どうして？
  event_absolute2_03_e_76:
    speaker: emma_t
    en: Why is it that no one is allowed to get hurt?
    ko: 왜 아무도 다쳐선 안 되는데?
    ja: 負傷なんてつきものでしょう？
  event_absolute2_03_e_77:
    speaker: eunhwa_t
    en: Well, obviously...!
    ko: 그야, 당연히…!
    ja: そんなこと、当然…！
  event_absolute2_03_e_78:
    speaker: emma_t
    en: So,
    ko: 그래서.
    ja: 分かったわ。
  event_absolute2_03_e_79:
    speaker: emma_t
    en: did we end up losing?
    ko: 결국 우리는 패배했어?
    ja: 負けたって思ってるのね？
  event_absolute2_03_e_80:
    speaker: eunhwa_t
    en: "... What?"
    ko: "…뭐?"
    ja: "…なに？"
  event_absolute2_03_e_81:
    speaker: emma_t
    en: Vesti's body got torn in half,
    ko: 베스티의 몸이 반토막이 나고,
    ja: ベスティーの体が半分吹き飛んで…
  event_absolute2_03_e_82:
    speaker: emma_t
    en: and everything's a complete mess.
    ko: 모두 엉망진창이 된 채,
    ja: みんなボロボロにされたから。
  event_absolute2_03_e_83:
    speaker: emma_t
    en: So, will Absolute lose and call it quits?
    ko: 앱솔루트는 패배하고 끝나버린 거야?
    ja: |-
      アブソルートが
      負けて終わったって思ってるのね？
  event_absolute2_03_e_84:
    speaker: eunhwa_t
    en: That's...
    ko: 그건….
    ja: それは…
  event_absolute2_03_e_85:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 쾅-!!
    ja: バァン！！
  event_absolute2_03_e_86:
    speaker: "<Narration>"
    en: With a loud explosion, part of the debris blocking the path collapses.
    ko: 폭음과 함께 길을 가로막고 있던 잔햇더미의 일부가 무너져 내렸다.
    ja: |-
      突然の爆音とともに、道を塞いでいた
      がれきの山の一部が吹き飛んだ
  event_absolute2_03_e_87:
    speaker: eunhwa_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_03_e_88:
    speaker: eunhwa_t
    en: That explosion...!
    ko: 이 폭발은…!
    ja: この爆発は…！
  event_absolute2_03_e_89:
    speaker: emma_t
    en: It's Vesti!
    ko: 베스티야!
    ja: ベスティーよ！
event_absolute2_intermission_01:
  event_absolute2_intermission_01_1:
    speaker: vesti_t
    en: Huh?
    ko: 어, 어라?
    ja: あ、あれ…？
  event_absolute2_intermission_01_2:
    speaker: vesti_t
    en: Eunhwa? Emma?
    ko: 은화? 엠마?
    ja: ウンファとエマは？
  event_absolute2_intermission_01_3:
    speaker: "<Narration>"
    en: Vesti rises from the rubble and looks up at the collapsed ceiling.
    ko: 베스티는 잔햇더미에서 몸을 일으켜 무너져 내린 천장을 바라보았다.
    ja: |-
      ベスティーはがれきの中から起き上がり、
      崩落した天井を見上げた
  event_absolute2_intermission_01_4:
    speaker: vesti_t
    en: Wha... Where am I...?
    ko: 나, 나 왜 여기에 있지…?
    ja: わ、私…どうしてこんなところに…？
  event_absolute2_intermission_01_5:
    speaker: eunhwa_t
    en: Our missiles are being jammed!
    ko: 재밍이다!
    ja: 止められた！？
  event_absolute2_intermission_01_6:
    speaker: eunhwa_t
    en: Everyone, brace for impact...!
    ko: 다들 폭발에 대비…!
    ja: 全員、爆発に備え…！
  event_absolute2_intermission_01_7:
    speaker: "<Narration>"
    en: "*Booom!*"
    ko: 콰아아앙-!
    ja: ズガン――！
  event_absolute2_intermission_01_8:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_intermission_01_9:
    speaker: vesti_t
    en: Wh-what should I do...!
    ko: 어, 어떡해…!
    ja: ど、どうしよう…！
  event_absolute2_intermission_01_10:
    speaker: vesti_t
    en: I-Is it because of me...
    ko: 나, 나 때문에….
    ja: わ、私のせいで…
  event_absolute2_intermission_01_11:
    speaker: vesti_t
    en: E-Eunhwa...? Emma?
    ko: 으, 은화…? 엠마?
    ja: ウ、ウンファ…？エマ？
  event_absolute2_intermission_01_12:
    speaker: "<Narration>"
    en: Vesti frantically looks around.
    ko: 베스티는 다급하게 주변을 살폈다.
    ja: ベスティーはあわてて辺りを見回した
  event_absolute2_intermission_01_13:
    speaker: vesti_t
    en: "... They're not here."
    ko: "…없어."
    ja: "…いない。"
  event_absolute2_intermission_01_14:
    speaker: vesti_t
    en: Eunhwa! Emma!
    ko: 은화!! 엠마!!
    ja: ウンファ！！エマ！！
  event_absolute2_intermission_01_15:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_intermission_01_16:
    speaker: vesti_t
    en: Is no one... there?
    ko: 아무도… 없는 거야?
    ja: 誰も…いないの…？
  event_absolute2_intermission_01_17:
    speaker: "<Narration>"
    en: Vesti looks up at the collapsed ceiling.
    ko: 베스티가 무너진 천장의 잔해를 바라보았다.
    ja: 崩落した天井のがれきが目に留まった
  event_absolute2_intermission_01_18:
    speaker: vesti_t
    en: N-no way... inside there...?
    ko: 서, 설마… 저기에…?
    ja: ま、まさか…この中に…？
  event_absolute2_intermission_01_19:
    speaker: vesti_t
    en: Th-they can't be... no...!
    ko: |-
      아, 아닐 거야.
      그, 그럴 리가 없어…!
    ja: |-
      ううん、そんなはずない。
      そんなはずが…！
  event_absolute2_intermission_01_20:
    speaker: vesti_t
    en: E-Eunhwa! Emma!
    ko: 으, 은화… 엠마!
    ja: ウ、ウンファ…エマ！
