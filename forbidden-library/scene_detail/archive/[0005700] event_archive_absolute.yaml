    en: Vesti desperately begins digging through the debris.
    ko: 베스티가 필사적으로 천장의 잔해들을 파헤치기 시작했다.
    ja: ベスティーは必死にがれきを掘り起こし始めた
  event_absolute2_intermission_01_25:
    speaker: vesti_t
    en: E-Emma... Eunhwa...!
    ko: 에, 엠마… 은화…!
    ja: エ、エマ…ウンファ…！
  event_absolute2_intermission_01_26:
    speaker: vesti_t
    en: Y-you're not in here... right?
    ko: 여, 여기 있는 거 아니지? 응?
    ja: 出てこないよね？違うよね？
  event_absolute2_intermission_01_27:
    speaker: "<Narration>"
    en: "*Rumble* *Crash!*"
    ko: 드르륵- 쾅!
    ja: ガラガラッ、ガシャン！
  event_absolute2_intermission_01_28:
    speaker: vesti_t
    en: You can't be here...
    ko: 여기 있으면 안 돼….
    ja: こ、ここにいちゃダメだよ…
  event_absolute2_intermission_01_29:
    speaker: "<Narration>"
    en: "*Rumble* *Crash!*"
    ko: 드륵- 쾅!
    ja: ガララッ、ガタン！
  event_absolute2_intermission_01_30:
    speaker: vesti_t
    en: You can't be!
    ko: 여기 있으면 안 돼…!
    ja: 見つからないで…！
  event_absolute2_intermission_01_31:
    speaker: "<Narration>"
    en: "*Rumble* *Crash!*"
    ko: 드륵- 쾅!
    ja: ガララッ、ドスン！
  event_absolute2_intermission_01_32:
    speaker: vesti_t
    en: "*Sob* Please..."
    ko: 흑, 제발….
    ja: うっ…お願いだから…！
  event_absolute2_intermission_01_33:
    speaker: "<Narration>"
    en: "*Rumble* *Crash!*"
    ko: 드륵- 쾅!
    ja: ガララッ、ガタン！
  event_absolute2_intermission_01_34:
    speaker: vesti_t
    en: Please... Please, please, please...!
    ko: 제발… 제발 제발 제발…!
    ja: お願い…お願いお願いお願い…！
  event_absolute2_intermission_01_35:
    speaker: unknown
