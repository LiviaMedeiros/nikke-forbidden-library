    ko: 대, 대답해!!
    ja: 返事して！！
  event_absolute2_intermission_01_22:
    speaker: "<Narration>"
    en: Vesti runs toward the rubble.
    ko: 베스티가 잔해를 향해 달려갔다.
    ja: ベスティーはがれきの山に駆け寄った
  event_absolute2_intermission_01_23:
