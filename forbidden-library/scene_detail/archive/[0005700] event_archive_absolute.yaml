    ko: "[라… 져! 조금… 버텨라…!]"
    ja: "「分かっ…わ！もう少…辛抱…！」"
  event_absolute2_05_e_59:
    speaker: signal
    en: Roger that!
    ko: 네!
    ja: はい！
  event_absolute2_05_e_60:
    speaker: emma_t
    en: Hehe, glad we got through!
    ko: 후후, 연결돼서 다행이네.
    ja: ふふ、よかったわね～
  event_absolute2_05_e_61:
