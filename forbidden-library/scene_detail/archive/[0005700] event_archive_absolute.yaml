      デルタの脚は見るからに折れていた。
      動かせる状態ではない
  event_absolute2_intermission_01_44:
    speaker: "<Narration>"
    en: Her arms are clearly damaged too as she can't even lift the gun lying beside
      her.
    ko: 팔 역시 멀쩡하지 않은지 옆에 놓인 총조차 제대로 들지 못하고 있었다.
    ja: |-
      腕も負傷しているらしく、
      手の届く場所に銃が転がったままになっている
  event_absolute2_intermission_01_45:
    speaker: vesti_t
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_absolute2_intermission_01_46:
    speaker: vesti_t
    en: Delta!
    ko: 델타!
    ja: デルタ！
  event_absolute2_intermission_01_47:
    speaker: "<Narration>"
    en: Vesti runs toward Delta.
    ko: 베스티가 델타를 향해 달려갔다.
    ja: ベスティーは近づこうとした
  event_absolute2_intermission_01_48:
    speaker: delta
    en: Vesti!
    ko: 베스티!!
    ja: ベスティー！！
  event_absolute2_intermission_01_49:
    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_intermission_01_50:
    speaker: "<Narration>"
    en: Delta raises her only working arm and signals to Vesti.
    ko: 델타가 그나마 망가지지 않은 팔을 들어 베스티에게 수신호를 보냈다.
    ja: |-
      デルタがかろうじて動かせる方の腕を上げ、
      ベスティーに手で合図を送った
  event_absolute2_intermission_01_51:
    speaker: vesti_t
    en: T-trap. Retreat...
    ko: 하, 함정. 후퇴할 것…?
    ja: わ、罠？後退しろ…？
  event_absolute2_intermission_01_52:
    speaker: "<Narration>"
    en: Vesti quickly scans the area around Delta.
    ko: 베스티가 황급히 델타 주변을 확인했다.
    ja: |-
      ベスティーは素早く
      デルタの周囲を確認したが…
  event_absolute2_intermission_01_53:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  event_absolute2_intermission_01_54:
    speaker: "<Narration>"
    en: But there's nothing in sight.
    ko: 아무것도 보이지 않았다.
    ja: それらしいものは目に入らない
  event_absolute2_intermission_01_55:
    speaker: vesti_t
