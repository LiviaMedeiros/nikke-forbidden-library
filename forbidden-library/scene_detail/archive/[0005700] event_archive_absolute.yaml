    speaker: vesti_t
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_absolute2_intermission_01_37:
    speaker: vesti_t
    en: Eunhwa?!
    ko: 은화?!
    ja: ウンファ！？
  event_absolute2_intermission_01_38:
    speaker: "<Narration>"
    en: Vesti looks in the direction the sound comes from.
    ko: 베스티가 소리가 들려온 방향을 바라보았다.
    ja: ベスティーは声のした方向を見た
  event_absolute2_intermission_01_39:
    speaker: delta
    en: "*Cough cough!*"
    ko: 큽!
    ja: くうっ！
  event_absolute2_intermission_01_40:
    speaker: "<Narration>"
    en: At the end of the passage connected to the concourse, Delta lies collapsed
      in the darkness.
    ko: 로비와 이어진 복도 끝, 짙은 어둠 속에서 쓰러진 델타의 모습이 보였다.
    ja: |-
      広い空間に繋がる通路の奥、
      暗がりの中に倒れているデルタが見えた
  event_absolute2_intermission_01_41:
    speaker: vesti_t
    en: Delta...?
    ko: 델타…?
    ja: デルタ…？
  event_absolute2_intermission_01_42:
    speaker: delta
    en: Ve... Vesti?
    ko: 베스… 티?!
    ja: ベス…ティー？
