  event_absolute2_05_e_43:
    speaker: emma_t
    en: Roger.
    ko: 라져~
    ja: 了解～
  event_absolute2_05_e_44:
    speaker: vesti_t
    en: Okay!
    ko: 알겠어!
    ja: 分かった！
  event_absolute2_05_e_45:
    speaker: "<Narration>"
    en: Eunhwa sprints forward and takes position behind Vesti and Emma.
    ko: 은화가 앞으로 뛰어나가 베스티와 엠마의 뒤에 선다.
