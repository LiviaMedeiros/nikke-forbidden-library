  event_absolute2_intermission_01_56:
    speaker: "<Narration>"
    en: Vesti hesitates.
    ko: 베스티는 망설였다.
    ja: ベスティーは迷った
  event_absolute2_intermission_01_57:
    speaker: "<Narration>"
    en: Should she go in alone and attempt to rescue Delta?
