    ko: "[조금… 잡음… 들리긴 하… 만! 들린다!]"
    ja: 少し…イズ…あるけ…聞こえるわ…！
  event_absolute2_05_e_54:
    speaker: signal
    en: This is Signal. There are seven members here, including the Absolute Squad.
    ko: 이쪽은 시그널, 앱솔루트 스쿼드를 포함한 7명의 인원이 있습니다!
