---
event_goddessfall1_prologue:
  event_goddessfall1_prologue_1:
    speaker: johan
    en: Is the Queen descending?
    ko: 퀸은 내려오고 있나?
    ja: クイーンはまだ降下中か？
  event_goddessfall1_prologue_2:
    speaker: cecil
    en: She was hovering in the stratosphere just a moment ago, approximately 48 kilometers
      above ground.
    ko: |-
      방금 성층권에 머물렀어요.
      상공 48km 정도네요.
    ja: |-
      成層圏に留まっています。
      高度はおよそ48キロメートル。
  event_goddessfall1_prologue_3:
    speaker: cecil
    en: She was in a rapid descent, but is now stationary.
    ko: 고속으로 강하하다가 지금은 멈춰선 상태예요.
    ja: |-
      一度急速に高度を落とした後は、
      現在まで変化ありません。
  event_goddessfall1_prologue_4:
    speaker: johan
    en: It's been three days now, but nothing's changed. Any idea what's going on?
    ko: |-
      벌써 3일이 지났는데도 그대로인가.
      이유에 대해 짐작 가는 게 있나?
    ja: |-
      3日経ってもそのままか。
      原因に見当はついているか？
  event_goddessfall1_prologue_5:
    speaker: noah
    en: Isn't it obvious? She's afraid of us.
    ko: 당연히 우리한테 쫄아서 그런 거 아냐?
    ja: そりゃ、私たちにビビってるんじゃない？
  event_goddessfall1_prologue_6:
    speaker: johan
    en: I don't think so.
    ko: 그건 아니겠지.
    ja: それはないだろう。
  event_goddessfall1_prologue_7:
    speaker: harran
    en: Isabel. Any chance you can do some reconnaissance?
    ko: 이사벨아. 혹시 정찰이 가능하겠니?
    ja: イサベル、偵察できるかしら？
  event_goddessfall1_prologue_8:
    speaker: isabel
    en: Not even I can reach that kind of altitude.
    ko: 아무리 나라도 저 정도 높이까지는 갈 수 없어.
    ja: いくら私でも、あんな高さまでは行けないわ。
  event_goddessfall1_prologue_9:
    speaker: harran
    en: Can you at least try to get close enough to get visual confirmation?
    ko: 육안으로 확인할 수 있는 높이까지는 가능하니?
    ja: 肉眼で確認できる高度までなら？
  event_goddessfall1_prologue_10:
    speaker: isabel
    en: Not sure... but I won't know until I try...
    ko: 글쎄… 해봐야 알겠지만….
    ja: さあ…やってみないと分からないわね…
  event_goddessfall1_prologue_11:
    speaker: noah
    en: When she puts it that way, it usually means she can.
    ko: 보통 저렇게 말하면 다 되더라.
    ja: |-
      そういうことを言ってる時は、
      だいたいできるってコトでしょ。
  event_goddessfall1_prologue_12:
    speaker: isabel
    en: Commander. Should I try to get as close as possible?
    ko: 지휘관. 가능한 만큼 접근해 볼까요?
    ja: |-
      指揮官、できるところまで
      接近してみましょうか？
  event_goddessfall1_prologue_13:
    speaker: johan
    en: Sure. Get ready.
    ko: 그래. 준비해라.
    ja: そうだな、準備してくれ。
  event_goddessfall1_prologue_14:
    speaker: noah
    en: Are you sure you're not just gonna get clobbered and knocked down after getting
      too close?
    ko: 괜히 가까이 갔다가 얻어맞고 떨어지는 거 아냐?
    ja: |-
      うかつに近寄ったりしたら、
      ボコボコにされて落っこちちゃうんじゃない？
  event_goddessfall1_prologue_15:
    speaker: isabel
    en: Haha, if I do, then you can catch me.
    ko: 후후. 그럼 노아가 받아주면 되겠네.
    ja: ふふ。その時はノアに助けてもらうわ。
  event_goddessfall1_prologue_16:
    speaker: noah
    en: Hehe. Sure. I'll catch you.
    ko: 키득키득. 그래. 까짓거 내가 받아줄게.
    ja: へへへっ。いいよ、受け止めてあげる。
  event_goddessfall1_prologue_17:
    speaker: isabel
    en: Then I'm counting on you.
    ko: 그럼 노아만 믿고 가볼게.
    ja: じゃあ、ノアを信じて行くわね。
  event_goddessfall1_prologue_18:
    speaker: johan
    en: What about Eden's Spear...?
    ko: "…에덴의 창은?"
    ja: "…エデンの槍は？"
  event_goddessfall1_prologue_19:
    speaker: cecil
    en: We've deployed all of Eden's internal power sources as well as some underground
      generators nearby.
    ko: 에덴 내부 동력 및 인근의 지하 발전기까지 모두 동원하고 있어요.
    ja: |-
      エデン内部の動力から近隣の地下発電機まで
      すべて動員しています。
  event_goddessfall1_prologue_20:
    speaker: cecil
    en: We'll be able to use it soon, although it will only be operating at 50% of
      the total output.
    ko: |-
      곧 사용할 수 있어요.
      전체 출력의 50% 정도겠지만요.
    ja: |-
      もうすぐ再使用できるようになるかと。
      最大出力の50％ほどですが。
  event_goddessfall1_prologue_21:
    speaker: johan
    en: Can you raise it any further?
    ko: 더 끌어올릴 순 없나?
    ja: それ以上には引き上げられないのか？
  event_goddessfall1_prologue_22:
    speaker: cecil
    en: It's possible, only if we sacrifice Eden in the process.
    ko: 에덴을 포기한다면 가능해요.
    ja: エデンの放棄が前提になります。
  event_goddessfall1_prologue_23:
    speaker: cecil
    en: That would result in an output close to 100%, but most of Eden's facilities
      would be destroyed.
    ko: |-
      100%에 가까운 출력을 내겠지만,
      에덴의 시설 대부분이 망가지겠죠.
    ja: |-
      100％に近い出力を出すことは可能ですが、
      エデンの設備の大部分が崩壊するでしょう。
  event_goddessfall1_prologue_24:
    speaker: johan
    en: Do it. Try to secure maximum output.
    ko: 그렇게 하지. 최대한 출력을 확보해라.
    ja: それでいい。最大出力を確保してくれ。
  event_goddessfall1_prologue_25:
    speaker: harran
    en: You plan on ending this once and for all, huh?
    ko: 호오. 여기서 끝을 볼 생각이구나.
    ja: へえ…ここで終わらせるつもりなのね。
  event_goddessfall1_prologue_26:
    speaker: johan
    en: That's what I'm hoping for.
    ko: 그러길 바라는 거다.
    ja: そうなることを願う。
  event_goddessfall1_prologue_27:
    speaker: johan
    en: The Queen is stationary right now.
    ko: 퀸은 지금 멈춰있다.
    ja: クイーンが動きを止めている。
  event_goddessfall1_prologue_28:
    speaker: johan
    en: This is the perfect chance.
    ko: 절호의 기회다.
    ja: 今以上の機会はない。
  event_goddessfall1_prologue_29:
    speaker: cecil
    en: Got it.
    ko: 알겠어요.
    ja: 分かりました。
  event_goddessfall1_prologue_30:
    speaker: noah
    en: But why is the Queen just hovering there anyway?
    ko: 근데 저 퀸이라는 거 왜 저기에 멈춰있는 거야?
    ja: でもさ、なんで止まってるの？
  event_goddessfall1_prologue_31:
    speaker: cecil
    en: I'm not sure. Maybe she lost power and is unable to descend any further. Or
      maybe there's some kind of malfunction.
    ko: |-
      글쎄요. 출력이 떨어져서 강하가 불가능한 상태일 수도 있고,
      어딘가 고장 난 상태일지도 모르죠.
    ja: |-
      降下するための出力が不足している…
      あるいは、何かの故障でしょうか。
  event_goddessfall1_prologue_32:
    speaker: cecil
    en: I've honestly no idea of her intentions.
    ko: 사실 잘 모르겠어요. 무슨 의도인지.
    ja: |-
      どのような理由があるのかは、
      正直なところ、不明です。
  event_goddessfall1_prologue_33:
    speaker: isabel
    en: Should I go and ask?
    ko: 가서 물어볼까요?
    ja: 直接聞いてみましょうか？
  event_goddessfall1_prologue_34:
    speaker: harran
    en: You're clearly having a good time if you're in the mood to crack jokes.
    ko: 농담을 다 하고, 즐거워 보이는구나.
    ja: 冗談を言うなんて、ずいぶん楽しそうね。
  event_goddessfall1_prologue_35:
    speaker: isabel
    en: Because we'll soon be taking on the Queen.
    ko: 퀸을 상대하게 될 테니까.
    ja: クイーンと戦えるのよ？
  event_goddessfall1_prologue_36:
    speaker: harran
    en: "... Right. I feel the same way too, to be honest."
    ko: "…그래. 사실 그건 나도 그렇다."
    ja: "…そうね。実は私も同じ気分よ。"
  event_goddessfall1_prologue_37:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_prologue_38:
    speaker: noah
    en: Commander, why do you look like you just swallowed some bugs?
    ko: 지휘관은 갑자기 왜 똥 씹은 표정이 됐어?
    ja: 指揮官、虫でも噛んでるの？
  event_goddessfall1_prologue_39:
    speaker: johan
    en: I did not.
    ko: 씹지 않았다.
    ja: 噛んでいない。
  event_goddessfall1_prologue_40:
    speaker: isabel
    en: Noah! Watch your language around the Commander.
    ko: 노아. 지휘관한테 무례한 발언은 하지 마.
    ja: ノア。失礼よ。
  event_goddessfall1_prologue_41:
    speaker: noah
    en: But that was the face he was making.
    ko: 근데 진짜 그런 표정인데.
    ja: でもホント、そんな顔じゃん。
  event_goddessfall1_prologue_42:
    speaker: johan
    en: Although I'm curious how you even know what that expression looks like, I'm
      not going to ask.
    ko: 어떻게 그런 표정을 아는지 궁금하지만 물어보지 않겠다.
    ja: |-
      どこでそんな顔を覚えたのか知らないが、
      聞かないでおこう。
  event_goddessfall1_prologue_43:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_prologue_44:
    speaker: johan
    en: Why isn't the Queen coming down?
    ko: 퀸은 어째서 내려오지 않는 거지?
    ja: クイーンはなぜ降りてこない？
  event_goddessfall1_prologue_45:
    speaker: cecil
    en: "Are you asking me? \nIt's your job to assess the situation, Johan."
    ko: |-
      저한테 물어보는 건가요.
      상황 판단은 당신 몫이에요, 요한.
    ja: |-
      私への質問ですか？
      状況判断はあなたの役目でしょう、ヨハン。
  event_goddessfall1_prologue_46:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_prologue_47:
    speaker: snowwhite
    en: I refuse.
    ko: 거절한다.
    ja: ダメだ。
  event_goddessfall1_prologue_48:
    speaker: nayuta
    en: Verily, I did expect thou wouldst answer thus.
    ko: 당연히 그리 대답할 줄 알았소.
    ja: まあ、そうなるでしょうねぇ。
  event_goddessfall1_prologue_49:
    speaker: hongryeon
    en: I laid aside all pursuits to respond to thy summons, and yet thou dost speak
      of an alliance with Eden? What utterance is this?
    ko: |-
      소집을 걸었길래 만사를 제쳐두고 왔다만,
      뜬금없이 에덴과의 연합이라니 무슨 말인가.
    ja: |-
      寸刻を惜しんで駆けつけてみれば…
      だしぬけにエデンに手を貸せとは、
      どういう風の吹き回しかね？
  event_goddessfall1_prologue_50:
    speaker: hongryeon
    en: As thou well knowest, the very ends we seek diverge from those of Eden.
    ko: 자네도 알다시피, 에덴과 우리는 목적 자체가 다르네.
    ja: |-
      君も知っての通り、
      エデンと私たちでは目指すものが違うのだ。
  event_goddessfall1_prologue_51:
    speaker: nayuta
    en: Our purposes are not alike.
    ko: 목적은 같지 않소.
    ja: 私には同じに見えますがねぇ。
  event_goddessfall1_prologue_52:
    speaker: rapunzel
    en: "... That's right. Our goals are the same."
    ko: "…그래요. 목적은 같죠."
    ja: "…確かに、目的は同じとも言えます。"
  event_goddessfall1_prologue_53:
    speaker: rapunzel
    en: But our approaches cannot be reconciled.
    ko: 하지만 그 수단에서 좁힐 수 없는 간극이 있어요.
    ja: |-
      ですが、その手段に
      天と地ほどの差があるのです。
  event_goddessfall1_prologue_54:
    speaker: nayuta
    en: "'Tis not as though Eden did offer the folk of the Ark as sacrifice."
    ko: 아니 뭐 에덴이 방주 사람들을 제물로 바친 것도 아니지 않소.
    ja: |-
      アークの人々をいけにえに
      捧げたりしたわけでもないでしょう。
  event_goddessfall1_prologue_55:
    speaker: rapunzel
    en: If that was a viable option, they would have done it.
    ko: 그게 유효하다면 그렇게 했겠죠.
    ja: それで目的が果たせるなら、そうしたはずです。
  event_goddessfall1_prologue_56:
    speaker: snowwhite
    en: Besides, Dorothy is in Eden.
    ko: 그리고 에덴에는 도로시가 있다.
    ja: エデンにはドロシーもいる。
  event_goddessfall1_prologue_57:
    speaker: snowwhite
    en: She could be using us for her own ends without us knowing.
    ko: 우리도 모르는 사이, 도로시의 목적에 이용될 수 있다.
    ja: |-
      気づかないうちに、
      ドロシーに利用されるかもしれない。
  event_goddessfall1_prologue_58:
    speaker: hongryeon
    en: Alas, none among us possesseth the wit to discern her machinations.
    ko: 안타깝게도, 우리 중에 그 계략을 꿰뚫을 자도 없고 말일세.
    ja: |-
      歯がゆいが、彼女に謀られれば
      我々には見抜きようがない。
  event_goddessfall1_prologue_59:
    speaker: nayuta
    en: Young Lady Dorothy is not at Eden presently.
    ko: 도로시 소저는 지금 에덴에 없소.
    ja: 今はエデンにいません。
  event_goddessfall1_prologue_60:
    speaker: nayuta
    en: I hear say she doth reside within the Ark.
    ko: 방주에 있다고 하더이다.
    ja: なんでも、アークに向かったとか。
  event_goddessfall1_prologue_61:
    speaker: snowwhite
    en: What...?
    ko: "…뭐?"
    ja: "…何？"
  event_goddessfall1_prologue_62:
    speaker: hongryeon
    en: What say'st thou? Why would Dorothy find herself within the Ark?
    ko: "…그게 무슨 소린가. 도로시가 왜 방주에…."
    ja: |-
      …どういうことだい？
      アークにドロシーの用など…
  event_goddessfall1_prologue_63:
    speaker: rapunzel
    en: Wait, don't tell me...
    ko: 설마 방주를….
    ja: まさか、アークを…
  event_goddessfall1_prologue_64:
    speaker: nayuta
    en: Maidens. Are ye aware that a breach hath opened in the Ark?
    ko: |-
      소저들.
      방주에 구멍이 난 것은 알고 있소?
    ja: |-
      皆さん、アークに穴があいたという
      事件の話は？
  event_goddessfall1_prologue_65:
    speaker: snowwhite
    en: What's that supposed to mean this time?
    ko: "…그건 또, 무슨 말이지?"
    ja: "…初耳だな、何があった？"
  event_goddessfall1_prologue_66:
    speaker: rapunzel
    en: What?!
    ko: "…예?"
    ja: "…はい？"
  event_goddessfall1_prologue_67:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_prologue_68:
    speaker: nayuta
    en: Young Lady Dorothy played no small part in the mending of that breach.
    ko: 그리고 그 구멍을 메우는데 도로시 소저가 큰 역할을 했소.
    ja: |-
      その穴を塞ぐために、
      彼女が大活躍をしたそうで。
  event_goddessfall1_prologue_69:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_prologue_70:
    speaker: snowwhite
    en: Let's go to the Ark immediately.
    ko: 당장 방주로 간다.
    ja: アークへ向かうぞ。
  event_goddessfall1_prologue_71:
    speaker: snowwhite
    en: I need to see Dorothy.
    ko: 도로시를 만나야겠어.
    ja: ドロシーに会う。
  event_goddessfall1_prologue_72:
    speaker: hongryeon
    en: That would be for the best.
    ko: 그편이 좋겠네.
    ja: それがよさそうだ。
  event_goddessfall1_prologue_73:
    speaker: rapunzel
    en: Let's leave right away.
    ko: 바로 출발하죠.
    ja: すぐに出発しましょう。
  event_goddessfall1_prologue_74:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_prologue_75:
    speaker: nayuta
    en: Maidens, are ye privy to the means of gaining entry to the Ark?
    ko: 소저들. 방주 안으로 들어가는 방법은 알고 있소?
    ja: アークへ入る方法は、ご存じなので？
  event_goddessfall1_prologue_76:
    speaker: snowwhite
    en: We don't know, but we're not planning to go inside. We just need to call Dorothy
      out.
    ko: |-
      모른다. 들어갈 생각도 없다.
      도로시를 불러내면 그만이다.
    ja: |-
      知らないが、関係ない。
      ドロシーを呼び出せばいいだけだ。
  event_goddessfall1_prologue_77:
    speaker: nayuta
    en: By what means?
    ko: 어떻게.
    ja: どのように？
  event_goddessfall1_prologue_78:
    speaker: snowwhite
    en: We can just ask him to do so.
    ko: 그 녀석에게 부탁하면 되겠지.
    ja: あいつに頼めばいい。
  event_goddessfall1_prologue_79:
    speaker: nayuta
    en: If 'tis the Great Hero thou speakest of, he is soaring through the skies upon
      the White Giant at this hour.
    ko: |-
      대협을 말하는 거라면,
      대협은 지금 백거경을 타고 하늘을 여행 중이외다.
    ja: |-
      旦那のことでしたら、
      今は白い鯨の上で空の旅をしておりますねぇ。
  event_goddessfall1_prologue_80:
    speaker: snowwhite
    en: I can't make heads or tails of what you're saying. Let's go to the Ark.
    ko: |-
      대체 무슨 말을 하는 건지 모르겠군.
      방주로 간다.
    ja: |-
      何を言っているのか分からないな。
      とにかくアークへ――
  event_goddessfall1_prologue_81:
    speaker: nayuta
    en: The Queen will descend anon.
    ko: 퀸이 내려올 거요.
    ja: クイーンが降りてきます。
  event_goddessfall1_prologue_82:
    speaker: "<Narration>"
    en: The silence that followed was so profound, it was as if time had frozen. Not
      even a breath could be heard.
    ko: 시간이 멈춘 듯, 숨소리조차 들리지 않는 정적이 주위를 감쌌다.
    ja: |-
      その一言で時が止まったかのように、
      呼吸音さえ聞こえない静寂が広がった
  event_goddessfall1_prologue_83:
    speaker: nayuta
    en: She doth hover above Eden.
    ko: 에덴의 머리 위에 있소.
    ja: 今はエデンの頭上。
  event_goddessfall1_prologue_84:
    speaker: nayuta
    en: And her altitude doth continue to decrease.
    ko: 고도가 점점 낮아지고 있소이다.
    ja: 高度を徐々に落としているようです。
  event_goddessfall1_prologue_85:
    speaker: snowwhite
    en: What... did you say?
    ko: 뭐… 라고…?
    ja: それは…本当か…？
  event_goddessfall1_prologue_86:
    speaker: nayuta
    en: Eden doth prepare to intercept the Queen. Yet, 'tis unlikely this shall end
      with but a single strike.
    ko: |-
      에덴에서 퀸을 요격할 준비를 하고 있소.
      한 번에 해결될 것이라 보기엔 힘들겠지.
    ja: |-
      エデンは迎撃態勢を整えつつあります。
      ですが、簡単に終わるとは思えません。
  event_goddessfall1_prologue_87:
    speaker: nayuta
    en: Maidens, your strength is needed.
    ko: 소저들의 힘이 필요하외다.
    ja: あなた方の力が必要になるでしょう。
  event_goddessfall1_prologue_88:
    speaker: nayuta
    en: Thus, cast aside thy vain pride—
    ko: 그러니 알량한 자존심 세울 생각은 접어두
    ja: |-
      ですので、
      ここは些細なわだかまりを置いて――
  event_goddessfall1_prologue_89:
    speaker: "<Narration>"
    en: Nayuta pauses mid-sentence and looks up at the sky.
    ko: 나유타는 말을 멈추고 하늘을 바라보았다.
    ja: ナユタが突然言葉を止め、天を見上げた
  event_goddessfall1_prologue_90:
    speaker: "<Narration>"
    en: The sky is filled with clouds.
    ko: 하늘은 구름으로 가득 차 있다.
    ja: 一面の曇り空だ
  event_goddessfall1_prologue_91:
    speaker: "<Narration>"
    en: A red glow begins to bleed through the clouds.
    ko: 그리고, 구름 사이로 붉은색 빛이 새어 나오고 있었다.
    ja: |-
      しかし、雲の隙間から
      赤みを帯びた光が漏れている
  event_goddessfall1_prologue_92:
    speaker: "<Narration>"
    en: The ominous red light grows more intense.
    ko: 그 불길한 붉은 빛은, 더욱 짙어진다.
    ja: 禍々しい赤の光は、徐々に輝きを増していた
  event_goddessfall1_prologue_93:
    speaker: nayuta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_prologue_94:
    speaker: nayuta
    en: O, what a grievous plight!
    ko: 이런 낭패…!
    ja: しまった…！
  event_goddessfall1_prologue_95:
    speaker: cecil
    en: Massive energy signature detected above. Most likely a beam bombardment.
    ko: |-
      상공에서 거대 에너지 반응.
      빔 포격으로 추정.
    ja: |-
      上空に巨大なエネルギー反応。
      ビーム砲と推定されます。
  event_goddessfall1_prologue_96:
    speaker: johan
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_prologue_97:
    speaker: cecil
    en: Its trajectory shows a direct hit on Eden. I'll activate the shields.
    ko: |-
      에덴 직격 코스입니다.
      실드를 가동할게요.
    ja: |-
      軌道予測、エデンへの直撃コース。
      シールドを展開します。
  event_goddessfall1_prologue_98:
    speaker: johan
    en: Everyone! Brace for impact!
    ko: 전원! 충격 대비!
    ja: 全員！衝撃に備えろ！
  event_goddessfall1_prologue_99:
    speaker: "<Narration>"
    en: The red beam pierces through the clouds and strikes the surface...
    ko: 구름을 뚫고 지상에 내리꽃힌 붉은색의 빛이
    ja: 雲を破り、地上へ降り注いだ赤い光は…
  event_goddessfall1_prologue_100:
    speaker: "<Narration>"
    en: Eden is engulfed in red.
    ko: 에덴을 집어삼켰다.
    ja: エデンを飲み込んだ
  event_goddessfall1_prologue_101:
    speaker: "<Narration>"
    en: A stupendous roar and flash erupted, followed by explosions and shockwaves.
    ko: 굉음과 섬광, 폭발과 충격파가 난무했고
    ja: |-
      絶え間ない轟音と閃光、
      爆発と衝撃波が嵐となった
  event_goddessfall1_prologue_102:
    speaker: "<Narration>"
    en: After the light faded...
    ko: 빛이 사그라든 후
    ja: やがて光が収まった時…
  event_goddessfall1_prologue_103:
    speaker: "<Narration>"
    en: Only the skeletal remains of Eden's structures stand in silence.
    ko: 에덴은 앙상한 구조물만 남겨둔 채 침묵했다.
    ja: |-
      エデンはもはや辛うじて面影が残るだけの
      みすぼらしい構造物となっていた
event_goddessfall1_01_s:
  event_goddessfall1_01_s_1:
    speaker: johan
    en: Assess the damage.
    ko: 피해 상황을 파악해라.
    ja: 被害状況の分析を。
  event_goddessfall1_01_s_2:
    speaker: cecil
    en: Everything's wrecked. Need a more detailed explanation?
    ko: 다 작살났어요. 더 상세한 설명이 필요할까요?
    ja: 壊滅状態です。これ以上の詳細が必要ですか？
  event_goddessfall1_01_s_3:
    speaker: johan
    en: "That's enough. \nHarran, Isabel, Noah."
    ko: |-
      충분하다.
      하란. 이사벨. 노아.
    ja: |-
      十分だ。
      ハラン、イサベル、ノア。
  event_goddessfall1_01_s_4:
    speaker: harran
    en: I'm safe.
    ko: 무사하단다.
    ja: 無事よ。
  event_goddessfall1_01_s_5:
    speaker: isabel
    en: I'm fine too.
    ko: 저도 괜찮아요.
    ja: 私も問題ありません。
  event_goddessfall1_01_s_6:
    speaker: noah
    en: Woah, what the heck happened? Are we all dead?
    ko: 와 이거 뭐야? 우리 다 죽는 거야?
    ja: |-
      ちょっと、何これ？
      私たちみんな死んじゃうんじゃないの？
  event_goddessfall1_01_s_7:
    speaker: johan
    en: We're not dead.
    ko: 죽지 않는다.
    ja: 死なない。
  event_goddessfall1_01_s_8:
    speaker: papillon
    en: What the hell?! Wait, what?! What is this?! Are we dead?!
    ko: |-
      뭐야! 뭐야 뭐야 뭐야 뭐야! 뭔데 이거!?
      우리 다 죽는 거야!?
    ja: |-
      何よ！ねえ！ちょっと、今の何！？
      私たちみんな死んじゃうの！？
  event_goddessfall1_01_s_9:
    speaker: johan
    en: I said we're not dead.
    ko: 죽지 않는다.
    ja: 死なない。
  event_goddessfall1_01_s_10:
    speaker: noah
    en: I-if we take another hit from that thing, wouldn't we all die?
    ko: 이, 이거 한 방 더 맞으면 죽는 거 아냐?
    ja: こ、こんなの…もう一発食らったら死ぬでしょ？
  event_goddessfall1_01_s_11:
    speaker: johan
    en: We would die then.
    ko: 그땐 죽겠지.
    ja: そうなったら死ぬだろう。
  event_goddessfall1_01_s_12:
    speaker: cecil
    en: "I'll mobilize all robots to begin repairs. \nOur first priority is to restore
      basic infrastructure."
    ko: |-
      로봇들을 총동원해서 수리에 들어갈게요.
      일단 기본 시설부터 살려놔야 해요.
    ja: |-
      ロボットを総動員して修復します。
      基礎設備から回復させる必要があります。
  event_goddessfall1_01_s_13:
    speaker: johan
    en: All right. How about the shields?
    ko: 부탁하지. 실드는?
    ja: 頼む。シールドは？
  event_goddessfall1_01_s_14:
    speaker: cecil
    en: Do you genuinely think the shield will work when the ceiling lights aren't
      even turned on?
    ko: 지금 천장에 형광등도 안 들어오는 마당에 실드가 켜지겠어요?
    ja: |-
      天井の明かりも付けられない状況で、
      シールドが使えると思いますか？
  event_goddessfall1_01_s_15:
    speaker: johan
    en: Point taken.
    ko: 맞는 말이군.
    ja: それもそうだ。
  event_goddessfall1_01_s_16:
    speaker: johan
    en: Once the basic infrastructure is restored, hurry and bring Eden's Spear back
      online.
    ko: 기본 시설 이후에는 에덴의 창을 수복하는 걸 서둘러라.
    ja: |-
      基本的な設備復旧の後は、
      エデンの槍の修復を優先してくれ。
  event_goddessfall1_01_s_17:
    speaker: cecil
    en: Got it.
    ko: 알겠어요.
    ja: 了解しました。
  event_goddessfall1_01_s_18:
    speaker: noah
    en: But what if another beam comes?!
    ko: 아니 한 방 더 날아오면 어떡할 건데!?
    ja: もう一発撃たれたらどうすんの！？
  event_goddessfall1_01_s_19:
    speaker: johan
    en: It won't.
    ko: 날아오지 않을 거다.
    ja: おそらく、それはない。
  event_goddessfall1_01_s_20:
    speaker: papillon
    en: L-let's run to the basement!
    ko: 지하, 지하로 도망가자!
    ja: ち、地下に避難しましょ！
  event_goddessfall1_01_s_21:
    speaker: noah
    en: Wait. Did Nihilister escape?
    ko: 잠깐, 니힐리스타 걔 뛰쳐나온 거 아냐?
    ja: |-
      待って、ニヒリスターが
      外に出ちゃってるんじゃない？
  event_goddessfall1_01_s_22:
    speaker: johan
    en: Nihilister is safely secured in the Atlas Cage.
    ko: 니힐리스타는 아틀라스 케이지에 무사히 보관 중이다.
    ja: ニヒリスターはアトラスケージの中だ。
  event_goddessfall1_01_s_23:
    speaker: papillon
    en: So we've got beams from above, and flames below. Seriously, cut us some slack!
    ko: 위에선 빔이고, 밑에선 불이라고!? 좀 봐 줘 제발!
    ja: |-
      上はビームで、下は大火事！？
      も～イヤ！
  event_goddessfall1_01_s_24:
    speaker: johan
    en: Both of you, be quiet.
    ko: 둘 다 조용히 해라.
    ja: 2人とも、静かにしろ。
  event_goddessfall1_01_s_25:
    speaker: noah
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_26:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_27:
    speaker: johan
    en: Judging by the bombardment range, it's safe to say that the attack came from
      the Queen.
    ko: 포격 거리나 사거리로 봤을 때 퀸이 공격한 것이라 봐도 무방하겠지.
    ja: |-
      射程や方向から考えて、
      クイーンの攻撃とみて間違いないな。
  event_goddessfall1_01_s_28:
    speaker: cecil
    en: That's right.
    ko: 맞아요.
    ja: そうですね。
  event_goddessfall1_01_s_29:
    speaker: johan
    en: A beam strike of this scale...
    ko: 이 정도 규모의 빔 포격이다.
    ja: この威力の砲撃だ。
  event_goddessfall1_01_s_30:
    speaker: johan
    en: I may not know much about the Queen, but she wouldn't be foolish enough to
      continuously launch attacks like that from 48 kilometers up.
    ko: 퀸이 어떤 것인지는 모르지만 48km 상공에서 대규모 빔 포격을 쏟아붓는 바보 같은 짓을 연속으로 할 순 없다.
    ja: |-
      クイーンの得体は知れないが、
      48キロメートル上空から
      あんなものを連射することはできないはずだ。
  event_goddessfall1_01_s_31:
    speaker: noah
    en: H-how can you be so sure? You just said you don't know much about the Queen.
    ko: 모, 모른다면서 어떻게 아는데?
    ja: な、なんで分かるの？
  event_goddessfall1_01_s_32:
    speaker: johan
    en: It's actually quite simple.
    ko: 간단한 일이다.
    ja: 簡単な話だ。
  event_goddessfall1_01_s_33:
    speaker: johan
    en: If another beam comes our way, we'll all be dead, which would prove my theory
      incorrect.
    ko: |-
      다시 빔 포격이 온다면 우린 모두 죽을 것이고,
      그럼 내 예상이 틀린 것일 테지.
    ja: |-
      もう一度撃たれれば私たちは全滅する。
      その時は私の予想が外れたことになるが…
  event_goddessfall1_01_s_34:
    speaker: johan
    en: At least there'll be no regrets or accusations to deal with, since I'll be
      dead by then.
    ko: |-
      하지만 그걸 후회하거나 원망을 들을 수 없다.
      이미 죽은 후일 테니까.
    ja: |-
      そうなれば悔やむこともない。
      とっくに死んでいるだろうからな。
  event_goddessfall1_01_s_35:
    speaker: johan
    en: So in a way, my judgment is correct.
    ko: 그러므로 내 판단이 옳다.
    ja: つまり、生きている限り私の判断は正しい。
  event_goddessfall1_01_s_36:
    speaker: papillon
    en: I don't get what you're saying, but it all just sounds like nonsense to me.
    ko: 잘 모르겠지만 말 같지도 않은 소릴 하는 건 알겠네.
    ja: 話にならない状況ってことだけは分かったわ。
  event_goddessfall1_01_s_37:
    speaker: isabel
    en: Papillon, don't be rude.
    ko: 파피용. 너무 무례하게 굴지 마.
    ja: パピヨン。少しは自重しなさい。
  event_goddessfall1_01_s_38:
    speaker: papillon
    en: What? I'm a hostage. I'm allowed to be a little rude, aren't I?
    ko: 인질인데 좀 무례할 수도 있지. 안 그래?
    ja: |-
      道連れにされかけてるんだし、
      いいでしょこれぐらい。
  event_goddessfall1_01_s_39:
    speaker: harran
    en: That's true.
    ko: 맞는 말이구나.
    ja: それもそうね。
  event_goddessfall1_01_s_40:
    speaker: nayuta
    en: "'Tis a comfort that, all present appear remarkably composed, notwithstanding
      the grievous loss of their abode."
    ko: 다들 집을 잃은 것 치곤 한가해 보여 다행이외다.
    ja: |-
      家が吹き飛ばされたにしては、
      余裕がありそうですねぇ。
  event_goddessfall1_01_s_41:
    speaker: nayuta
    en: Art all unharmed...?
    ko: "…모두 무사하오?"
    ja: "…皆様方、ご無事で？"
  event_goddessfall1_01_s_42:
    speaker: johan
    en: Yes. Everyone is safe.
    ko: 그래. 모두 무사하다.
    ja: ああ、全員ケガも無い。
  event_goddessfall1_01_s_43:
    speaker: cecil
    en: Eden has literally been wiped off the map though.
    ko: 에덴은 말 그대로 작살이 났지만요.
    ja: 設備はまさしく壊滅していますが。
  event_goddessfall1_01_s_44:
    speaker: nayuta
    en: Still, 'tis a relief the maidens and the Young Hero are safe.
    ko: "…그래도, 소저들과 소협만이라도 무사해서 다행이외다."
    ja: "…それでも、あなた方がご無事なら何よりです。"
  event_goddessfall1_01_s_45:
    speaker: nayuta
    en: The Forerunners have arrived.
    ko: 선구자 소저들이 도착했소.
    ja: 先駆者たちが来ています。
  event_goddessfall1_01_s_46:
    speaker: nayuta
    en: They desire a discourse with thee.
    ko: 얘기를 나누고 싶어 하오.
    ja: 話がしたい、とのことで。
  event_goddessfall1_01_s_47:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_48:
    speaker: harran
    en: "... Johan."
    ko: "…요한아."
    ja: "…ヨハン。"
  event_goddessfall1_01_s_49:
    speaker: harran
    en: Let them in.
    ko: 들이자꾸나.
    ja: 迎えてあげましょう？
  event_goddessfall1_01_s_50:
    speaker: johan
    en: If they wish, they may enter Eden.
    ko: 그들이 원한다면, 에덴 안으로 들어와도 좋다.
    ja: 先方が望むなら、エデンへの進入を許可しよう。
  event_goddessfall1_01_s_51:
    speaker: nayuta
    en: Can it yet be called Eden, in so fallen a form?
    ko: 이제 에덴이라 부르기엔 좀 민망한 꼴이지 않소?
    ja: |-
      すでにエデンと呼ぶほどのものは
      残っていない気もしますがねぇ？
  event_goddessfall1_01_s_52:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_53:
    speaker: nayuta
    en: I only spoke in jest. Pray, gaze not upon me so.
    ko: "…농담이외다, 농담. 너무 그렇게 쳐다보지 말아 주시오."
    ja: |-
      …失礼、冗談です。
      あまりにらまないでください。
  event_goddessfall1_01_s_54:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_55:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_56:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_57:
    speaker: cecil
    en: Make yourselves at home.
    ko: 어서 와요.
    ja: ようこそ。
  event_goddessfall1_01_s_58:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_59:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_60:
    speaker: noah
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_61:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_62:
    speaker: papillon
    en: It's so quiet.
    ko: 되게 조용하네.
    ja: ずいぶん静かね。
  event_goddessfall1_01_s_63:
    speaker: nayuta
    en: They say that among masters, their blades do clash a hundredfold in their
      minds ere any weapons be drawn. Is this, perchance, the very circumstance unfolding
      here?
    ko: 고수끼리는 검을 맞대기 전 수백의 합을 가상으로 겨룬다고 하지 않소. 그런 것 아니겠소?
    ja: |-
      達人同士の戦いは、ぶつかりあう前に
      幾百回と心の中で剣を交わすものだそうです。
      そのようなことでは？
  event_goddessfall1_01_s_64:
    speaker: papillon
    en: Are they fighting? Do they not get along?
    ko: 쟤들 싸워? 사이 안 좋나 봐?
    ja: |-
      斬り合いでも始めるの？
      そうとう仲悪そうだけど。
  event_goddessfall1_01_s_65:
    speaker: nayuta
    en: One's as stubborn as a mule, and the other arrogant and plagued with paranoia.
    ko: 한쪽은 옹졸한 고집쟁이고, 한쪽은 오만하고 의심병을 앓고 있기 때문이외다.
    ja: |-
      かたや頭の固い一徹者、
      かたや自尊心と猜疑心の権化ですからねぇ。
  event_goddessfall1_01_s_66:
    speaker: snowwhite
    en: Who are you calling a stubborn mule?
    ko: 누가 옹졸한 고집쟁이라는 거지.
    ja: 誰の頭が固いと言った？
  event_goddessfall1_01_s_67:
    speaker: johan
    en: Who are you calling arrogant and paranoid?
    ko: 누가 오만한 의심병 환자라는 거냐.
    ja: 誰が自尊心と猜疑心の権化だ。
  event_goddessfall1_01_s_68:
    speaker: papillon
    en: Ah, I see what you mean.
    ko: 오, 한 번에 알겠어.
    ja: わあ、分かりやす～い。
  event_goddessfall1_01_s_69:
    speaker: nayuta
    en: Haha, I thank ye both for the most illustrative demonstration.
    ko: 하하. 바로 알려주는군.
    ja: これはこれは…ていねいな自己紹介を。
  event_goddessfall1_01_s_70:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_71:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_72:
    speaker: nayuta
    en: Now, if we leave matters as they are, they shall but glare at one another
      and waste the hours. I shall intercede.
    ko: 자, 이대로 가만히 뒀다간 서로 노려보다가 시간을 다 죽일 것 같으니, 소인이 중재하겠소.
    ja: |-
      このまま放っておけば、
      にらみ合うだけで時が流れてしまいます。
      私が取り持ちましょう。
  event_goddessfall1_01_s_73:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_74:
    speaker: nayuta
    en: The Queen doth descend.
    ko: 퀸이 내려오고 있소.
    ja: クイーンが降下を始めています。
  event_goddessfall1_01_s_75:
    speaker: nayuta
    en: I trust that all know the Queen is not upon the surface, but doth drift in
      orbit, accompanied by part of the Orbital Forge.
    ko: 퀸이 지상에 있지 아니하고, 우주 정거장 일부와 함께 궤도를 떠돌고 있음은 모두가 알고 있을 것이라 믿소.
    ja: |-
      今までは地上に在らず、
      宇宙ステーションの一部と共に、
      軌道上に漂っていたことはご存じの通り。
  event_goddessfall1_01_s_76:
    speaker: papillon
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall1_01_s_77:
    speaker: nayuta
    en: Verily, it is speculated that she hath lingered in that lofty sphere for nearly
      a century.
    ko: 그러길 100여 년에 가까운 시간이 지난 것으로 추정되며
    ja: |-
      その状態が100年近く続いていたものと
      推定されます。
  event_goddessfall1_01_s_78:
    speaker: nayuta
    en: The cause for her not descending to the surface until now remaineth unknown.
    ko: 어찌하여 지금까지 지상으로 내려오지 않았는지는 불명이었소.
    ja: |-
      地上へ降下してこない理由は、
      長らく不明のまま。
  event_goddessfall1_01_s_79:
    speaker: nayuta
    en: Yet, recent happenings have made the reason plain.
    ko: 허나 얼마 전 있었던 일로 인해 그 이유가 명확히 밝혀졌소.
    ja: |-
      しかし、先日の事件によって
      その理由が明らかとなりました。
  event_goddessfall1_01_s_80:
    speaker: nayuta
    en: "'Twas a veil of liquid metal, thought to obscure the Queen's path."
    ko: 퀸의 앞을 가리고 있던 액체 금속으로 추정되는 장막 때문이었소.
    ja: |-
      液体金属とみられる何かの膜によって、
      いわば目を塞がれた状態だったのです。
  event_goddessfall1_01_s_81:
    speaker: nayuta
    en: This liquid metal, for reasons unknown, did follow the Queen and veil her
      sight.
    ko: 이 액체 금속은 어떠한 이유에서인지 퀸을 따라다니며 그 시야를 가리고 있었고
    ja: |-
      この膜はどういうわけか、付きまとうように
      クイーンの視界をさえぎっていた。
  event_goddessfall1_01_s_82:
    speaker: nayuta
    en: It is thus judged that the Queen's vision was either gravely impaired or wholly
      unfit for purpose.
    ko: 이 때문에 퀸의 시야가 매우 한정적이거나 제 기능을 하지 못하였다고 판단하고 있소.
    ja: |-
      それによって、地上を監視する能力が
      大幅に制限されていたか、
      完全に機能していなかったと推測しています。
  event_goddessfall1_01_s_83:
    speaker: nayuta
    en: However...
    ko: 그랬으나.
    ja: しかし…
  event_goddessfall1_01_s_84:
    speaker: nayuta
    en: Not long ago, the Gene Reaper used the Eden's Spear, dispersing the veil that
      obscured the Queen's path.
    ko: |-
      얼마 전 인자 살해자 소저가 에덴의 창을 사용,
      퀸의 앞을 막고 있던 장막을 치워버렸소.
    ja: |-
      奪取されたエデンの槍による攻撃で、
      目隠しは取り払われてしまった。
  event_goddessfall1_01_s_85:
    speaker: nayuta
    en: With naught now to impede the Queen's gaze, she doth descend at last to accomplish
      that which she hath long deferred.
    ko: |-
      이제 퀸의 시야를 막는 것은 아무것도 없기에,
      퀸은 지금껏 미뤄놨던 일을 하기 위해 내려오고 있소.
    ja: |-
      もはやクイーンの目を塞ぐものはありません。
      今までできなかった何かを果たすために、
      地上を目指しているのでしょう。
  event_goddessfall1_01_s_86:
    speaker: nayuta
    en: Presently, she doth linger...
    ko: 현재는 상공….
    ja: 現在位置は、上空…
  event_goddessfall1_01_s_87:
    speaker: cecil
    en: Some 48 kilometers above the surface.
    ko: 48km 부근에 머물고 있어요.
    ja: およそ48キロメートルで停止しています。
  event_goddessfall1_01_s_88:
    speaker: nayuta
    en: Verily, she doth still reside at a remarkably lofty altitude.
    ko: 그렇소. 아주 높은 곳에 머물고 있으며
    ja: |-
      そのようで。
      極めて高い位置で動きを止めています。
  event_goddessfall1_01_s_89:
    speaker: nayuta
    en: A moment hence, she did unleash a cataclysmic beam upon Eden.
    ko: 방금 에덴을 향해 말도 안 되는 규모의 빔 포격을 실시했소.
    ja: |-
      そして先ほど、エデンは規格外の
      強力な光線による砲撃を受けました。
  event_goddessfall1_01_s_90:
    speaker: nayuta
    en: To call Eden a paradise, in light of such calamity, would indeed be naught
      but a farcical jest.
    ko: 덕분에 에덴은 이제 농담으로라도 낙원이라 부를 수 없는 상태외다.
    ja: |-
      このため、お世辞にも楽園とは
      呼びがたい状態になっています。
  event_goddessfall1_01_s_91:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_92:
    speaker: nayuta
    en: The Queen's goal is plain and certain.
    ko: 퀸의 목표는 명백하다 사료되오.
    ja: クイーンがそうした理由は明白でしょう。
  event_goddessfall1_01_s_93:
    speaker: nayuta
    en: The aim is to obliterate Eden, which doth hold the Eden's Spear, a weapon
      that could well prove a threat to her.
    ko: 에덴의 창이라는, 본인에게 위협이 될 법한 무장을 지닌 에덴을 부수는 것이외다.
    ja: |-
      エデンの槍という、
      自身に害を及ぼし得る兵器の破壊。
  event_goddessfall1_01_s_94:
    speaker: nayuta
    en: And thus, she will descend unto the surface.
    ko: 그리고 지상으로 내려올 것이외다.
    ja: これは地上降下への事前段階でもあります。
  event_goddessfall1_01_s_95:
    speaker: nayuta
    en: Her assault took us most utterly unawares, and we were ill-prepared for such
      an onslaught.
    ko: 기습에 가까운 상황이라, 우리 측의 준비는 완벽하지 못하오.
    ja: |-
      こちらは奇襲を受けたに等しい状況です。
      準備は万端ではありません。
  event_goddessfall1_01_s_96:
    speaker: nayuta
    en: We did relinquish the initiative and did endure grievous losses.
    ko: 선공을 내어주어, 큰 피해를 입고 말았소.
    ja: |-
      先制攻撃を許し、
      すでに多大な損害が出てしまいました。
  event_goddessfall1_01_s_97:
    speaker: nayuta
    en: "... Nevertheless."
    ko: "…허나."
    ja: "…それでも…"
  event_goddessfall1_01_s_98:
    speaker: nayuta
    en: This is the very moment we have long yearned for.
    ko: 그토록 염원하던 순간이외다.
    ja: |-
      私たち全員が待ち望んでいた、
      悲願の瞬間です。
  event_goddessfall1_01_s_99:
    speaker: "<Narration>"
    en: Nayuta raises her hand to the sky.
    ko: 나유타는 손을 뻗어 하늘을 가리켰다.
    ja: ナユタが腕を伸ばし、空を指した
  event_goddessfall1_01_s_100:
    speaker: nayuta
    en: The Queen.
    ko: 퀸.
    ja: クイーン…
  event_goddessfall1_01_s_101:
    speaker: nayuta
    en: The Queen of the Raptures.
    ko: 랩쳐의 여왕.
    ja: ラプチャーの女王。
  event_goddessfall1_01_s_102:
    speaker: nayuta
    en: Should we succeed in bringing her low, we will make major strides in reclaiming
      the surface.
    ko: 저것을 잡아낸다면, 우리는 지상 탈환이라는 대업에 크게 다다를 것이외다.
    ja: |-
      討ち果たすことができれば、
      私たちは地上奪還という大業に
      向かって、大きく前進できる。
  event_goddessfall1_01_s_103:
    speaker: nayuta
    en: Thus, let us cast aside all discord and unite our forces to vanquish the Queen,
      at this very juncture.
    ko: |-
      그러니 서로 간의 아쉬운 마음은 뒤로 두고,
      지금 이 순간 퀸을 잡기 위해 힘을 합쳐줄 것을 간청하오.
    ja: |-
      ですからどうか、
      今この瞬間は個人的な遺恨を後にして
      力を一つにしていただきたいのです。
  event_goddessfall1_01_s_104:
    speaker: nayuta
    en: This may well be an opportunity that shall never return.
    ko: 다시는 오지 않을 기회일지도 모르오.
    ja: このような機会、二度あるかも分かりません。
  event_goddessfall1_01_s_105:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_106:
    speaker: snowwhite
    en: I'd like a tour of the facilities.
    ko: 시설을 안내받고 싶다.
    ja: 施設の案内を頼む。
  event_goddessfall1_01_s_107:
    speaker: snowwhite
    en: I need a good vantage point for an observation post.
    ko: 감제고지로 쓸법한 위치가 필요하다.
    ja: 高台を把握しておきたい。
  event_goddessfall1_01_s_108:
    speaker: hongryeon
    en: We require a place whence we may launch intercepts from any direction, and
      where resupply may be procured with ease.
    ko: 어디에서든 요격을 나갈 수 있고 보급이 용이한 장소가 필요하네.
    ja: |-
      どこへでも迎え撃ちやすく、
      補給も行いやすい場所も抑えておきたい。
  event_goddessfall1_01_s_109:
    speaker: hongryeon
    en: And should you find it within your means to bestow upon me a modicum of spirituous
      libation, that would be appreciated.
    ko: 술도 한잔 내어 주면 더할 나위 없겠고.
    ja: それから酒も出れば、ありがたい限りだ。
  event_goddessfall1_01_s_110:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_111:
    speaker: cecil
    en: I'll get right on it.
    ko: 준비할게요.
    ja: 用意しておきます。
  event_goddessfall1_01_s_112:
    speaker: snowwhite
    en: Oh? We can make requests?
    ko: |-
      !!
      요구해도 되는 건가.
    ja: |-
      ！！
      出るのか。
  event_goddessfall1_01_s_113:
    speaker: rapunzel
    en: Snow White...
    ko: 스노우 화이트….
    ja: スノーホワイト…？
  event_goddessfall1_01_s_114:
    speaker: cecil
    en: Within reason, I will try my best to see that your requests are met.
    ko: 가능한 선에서는 요구 사항에 맞춰드릴게요.
    ja: できる範囲であればお応えしましょう。
  event_goddessfall1_01_s_115:
    speaker: snowwhite
    en: I want meat and bread.
    ko: 고기와 빵을 원한다.
    ja: 肉とパンが欲しい。
  event_goddessfall1_01_s_116:
    speaker: cecil
    en: Very well. I'll have it prepared. Do you need anything else?
    ko: 알겠어요. 준비할게요. 다른 건 더 필요 없나요?
    ja: |-
      分かりました。用意しておきます。
      他にはありませんか？
  event_goddessfall1_01_s_117:
    speaker: snowwhite
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_01_s_118:
    speaker: snowwhite
    en: May I ask for some fruit as well?
    ko: 과일도 요구해도 되나?
    ja: 果物もいいか？
  event_goddessfall1_01_s_119:
    speaker: cecil
    en: All right. I'll prepare it.
    ko: 예. 준비해 드릴게요.
    ja: はい。構いません。
  event_goddessfall1_01_s_120:
    speaker: snowwhite
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_01_s_121:
    speaker: rapunzel
    en: Could you stop being so surprised by everything? People are going to think
      you've been starving.
    ko: |-
      일일이 좀 놀라지 말아 주실래요?
      누가 보면 굶기는 줄 알겠어요.
    ja: |-
      いちいち目を輝かせないでください。
      何も食べていなかったわけではないでしょう…
  event_goddessfall1_01_s_122:
    speaker: rapunzel
    en: I'll go check the infirmary and defense systems.
    ko: 저는 의무실과 방어 시설을 좀 볼게요.
    ja: 私は医療施設と防衛設備の確認を希望します。
  event_goddessfall1_01_s_123:
    speaker: johan
    en: Good. Pair up and show them around.
    ko: "…좋다. 한 명씩 붙어서 안내해 줘라."
    ja: "…分かった。1人ずつ案内役をつけよう。"
  event_goddessfall1_01_s_124:
    speaker: johan
    en: Harran, you go with Snow White.
    ko: 하란. 스노우 화이트에게 붙어라.
    ja: ハラン、スノーホワイトを頼む。
  event_goddessfall1_01_s_125:
    speaker: harran
    en: Gladly.
    ko: 기꺼이 그러마.
    ja: 分かったわ。
  event_goddessfall1_01_s_126:
    speaker: snowwhite
    en: I'm not sharing my food, just so you know.
    ko: 음식은 나눠주지 않을 거다.
    ja: 分けられる食料はないぞ。
  event_goddessfall1_01_s_127:
    speaker: harran
    en: "... Fine. I'll keep that in mind."
    ko: "…그래. 명심하마."
    ja: "…そう。よく覚えておくわ。"
  event_goddessfall1_01_s_128:
    speaker: johan
    en: Isabel, go with Scarlet.
    ko: 이사벨. 홍련에게 붙어라.
    ja: イサベルは紅蓮を。
  event_goddessfall1_01_s_129:
    speaker: isabel
    en: Roger, Commander.
    ko: 알겠어요, 지휘관.
    ja: かしこまりました、指揮官。
  event_goddessfall1_01_s_130:
    speaker: hongryeon
    en: A maiden who soars through the air, I fear our gazes may not meet in equal
      measure.
    ko: 날아다니는 낭자라 나와 눈높이가 맞을지 걱정이네만.
    ja: |-
      飛べるお嬢ちゃんか。
      目の高さが合うか心配だねえ。
  event_goddessfall1_01_s_131:
    speaker: isabel
    en: Don't worry. I'll guide you on foot.
    ko: 걱정 마. 걸어서 안내해 줄 테니까.
    ja: ご心配なく。案内は歩きよ。
  event_goddessfall1_01_s_132:
    speaker: johan
    en: Noah, you stick with Rapunzel.
    ko: 노아는 라푼젤에게 붙어라.
    ja: ノアはラプンツェルを頼む。
  event_goddessfall1_01_s_133:
    speaker: noah
    en: Heh. You want me to keep an eye on the weakest-looking one?
    ko: 켁. 제일 약해 보이는 애한테 내가 붙어?
    ja: うげっ。一番弱そうなやつ？
  event_goddessfall1_01_s_134:
    speaker: noah
    en: Well, I guess it makes sense for the strongest to escort the weakest.
    ko: 하긴, 제일 강한 내가 제일 약해 보이는 애한테 붙는 게 맞겠네.
    ja: |-
      まっ、一番強い私が
      一番弱いやつの面倒を見るのは当然か。
  event_goddessfall1_01_s_135:
    speaker: rapunzel
    en: Hehe. I'm in your hands, Noah.
    ko: 후후. 잘 부탁드려요. 노아.
    ja: ふふ。よろしくお願いします、ノア。
  event_goddessfall1_01_s_136:
    speaker: noah
    en: It is what it is then.
    ko: 어쩔 수 없네.
    ja: まったく仕方ないな～
  event_goddessfall1_01_s_137:
    speaker: noah
    en: I do have a question though...
    ko: "…근데 나 궁금한 게 있는데."
    ja: |-
      …それはそうと、気になってることが
      あるんだけど。
  event_goddessfall1_01_s_138:
    speaker: noah
    en: Shouldn't we be going after that thing?
    ko: 우리 저거 잡아야 하는 거 아냐?
    ja: クイーンを倒すんじゃないの？
  event_goddessfall1_01_s_139:
    speaker: "<Narration>"
    en: Noah points to the sky.
    ko: 노아는 하늘을 가리켰다.
    ja: ノアが空を指した
  event_goddessfall1_01_s_140:
    speaker: johan
    en: That's right. We need to take down the Queen.
    ko: 맞다. 퀸을 잡아야 하지.
    ja: そうだ。クイーンを討つ。
  event_goddessfall1_01_s_141:
    speaker: noah
    en: Then, instead of setting up a position here, shouldn't we be figuring out
      how to get up there and how to bring her down?
    ko: 그럼 올라갈 방법을 찾거나 저걸 떨어뜨릴 생각을 해야지 왜 자리를 잡아?
    ja: |-
      じゃあ、上に行く方法とか
      撃ち落とす方法とか、
      考えないといけないんじゃない？
  event_goddessfall1_01_s_142:
    speaker: johan
    en: It's impossible to do so until Eden's Spear is repaired.
    ko: 에덴의 창이 수리되기 전에는 불가능하다.
    ja: |-
      エデンの槍の修復が終わるまでは
      どうにもならない。
  event_goddessfall1_01_s_143:
    speaker: johan
    en: Until it's repaired, we need to focus on defense.
    ko: 그러니 수리되기 전까지 방위전에 집중해야 한다.
    ja: それまでは防衛戦に集中する。
  event_goddessfall1_01_s_144:
    speaker: noah
    en: Defense? What for?
    ko: 방위전? 무슨 방위전?
    ja: 防衛戦？何か来るの？
  event_goddessfall1_01_s_145:
    speaker: snowwhite
    en: Raptures will be swarming in.
    ko: 랩쳐가 몰려올 거다.
    ja: ラプチャーの大群だ。
  event_goddessfall1_01_s_146:
    speaker: snowwhite
    en: Especially after such a commotion, they'll be swarming in numbers.
    ko: 그만한 소동이 났으니 많이 몰려오겠지.
    ja: |-
      これだけの騒ぎになれば、
      相当の数が集まってくる。
  event_goddessfall1_01_s_147:
    speaker: cecil
    en: As a matter of fact, they already are. From every direction.
    ko: 말이 끝나기가 무섭게 전방위에서 엄청 몰려오고 있어요.
    ja: 噂をすれば、正面に多数の反応です。
  event_goddessfall1_01_s_148:
    speaker: cecil
    en: I'm counting on you guys.
    ko: 다들 부탁할게요.
    ja: みなさん、交戦の準備を。
  event_goddessfall1_01_s_149:
    speaker: papillon
    en: Uh, sorry to interrupt...
    ko: 그, 이야기 중에 미안한데.
    ja: あのさ、話し中のところ悪いんだけど。
  event_goddessfall1_01_s_150:
    speaker: papillon
    en: But considering the Queen might fire another beam from up there, and we've
      got Raptures swarming in, is defending this place really the right move?
    ko: |-
      저 위에서 퀸이 엄청 큰 빔을 언제 쏠지도 모르는 상황에서
      여길 방어하는 게 맞아? 랩쳐도 몰려오고 있고.
    ja: |-
      上からビームが降ってくるかもしれない状況で
      ここを守るのが正解なの？
      ラプチャーも集まってきてるし。
  event_goddessfall1_01_s_151:
    speaker: papillon
    en: Shouldn't we be evacuating?
    ko: 도망가야 하는 거 아냐?
    ja: 逃げた方がいいんじゃない？
  event_goddessfall1_01_s_152:
    speaker: snowwhite
    en: No.
    ko: 아니다.
    ja: 違うな。
  event_goddessfall1_01_s_153:
    speaker: papillon
    en: Why not?
    ko: 왜?
    ja: なんで？
  event_goddessfall1_01_s_154:
    speaker: snowwhite
    en: If we lose Eden's Spear, we're completely out of options.
    ko: 에덴의 창을 잃으면 방법이 없으니까.
    ja: エデンの槍を失えば、打つ手が無くなる。
  event_goddessfall1_01_s_155:
    speaker: snowwhite
    en: It's also unlikely that the Queen can carry out such large-scale attacks any
      time she wants.
    ko: 그리고 그 정도 규모의 공격을 쓰고 싶을 때 쓸 수 있을 리가 없다.
    ja: |-
      クイーンもあれほどの火力を
      簡単に出せるはずがない。
  event_goddessfall1_01_s_156:
    speaker: hongryeon
    en: Verily, this bombardment possesseth the might not only to obliterate a single
      facility, but a small city.
    ko: 맞네. 시설… 이라기 보단 작은 도시 하나를 집어삼킬 정도의 포격이었네.
    ja: |-
      そうだねぇ。建物どころか…
      町をまるごと消し飛ばせそうな威力であった。
  event_goddessfall1_01_s_157:
    speaker: hongryeon
    en: To discharge such destructive force with abandon is sheer absurdity.
    ko: 그런 걸 마구 쏜다는 건 어불성설일세.
    ja: 易々と連射できるものではあるまい。
  event_goddessfall1_01_s_158:
    speaker: papillon
    en: Okay, but that's all an assumption on your part. What will you do if she does
      fire again?
    ko: |-
      아니 지금 다들 그럴 거라 믿는 것뿐이잖아.
      진짜 쏘면 어떡하려고 그래?
    ja: |-
      そんなの希望的観測でしょ？
      撃たれたらどうするのよ？
  event_goddessfall1_01_s_159:
    speaker: snowwhite
    en: If another beam does strike, we'll all die, and that means our assumption
      was wrong.
    ko: |-
      다시 빔 포격이 온다면 우린 모두 죽을 것이고,
      그럼 우리 판단이 틀린 거다.
    ja: |-
      そうなれば、私たちは全滅し、
      判断が間違っていたと証明される。
  event_goddessfall1_01_s_160:
    speaker: snowwhite
    en: And since we'll all be dead, in theory, we won't have any regrets.
    ko: 하지만 그땐 우린 죽어있을 테니 이론상 후회할 수 없다.
    ja: |-
      しかし、すでに死んだ後だ。
      後悔する必要もない。
  event_goddessfall1_01_s_161:
    speaker: nayuta
    en: Haha. Thy words mirror those of Young Hero Johan to the letter.
    ko: 하하. 요한 소협과 똑같은 소릴 하는구려.
    ja: ははは…ヨハンも同じご意見でしたねぇ。
  event_goddessfall1_01_s_162:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_s_163:
    speaker: papillon
    en: You all have lost your marbles.
    ko: "…미쳤네 다들."
    ja: "…みんな、おかしいわよ。"
  event_goddessfall1_01_s_164:
    speaker: nayuta
    en: Oh, art thou not aware?
    ko: 오, 모르셨소?
    ja: おや、ご存じありませんでしたか？
  event_goddessfall1_01_s_165:
    speaker: nayuta
    en: All those who stand here are of unsound mind, verily.
    ko: |-
      지금 이곳에 있는 자들은,
      모두 미친 자들이외다.
    ja: |-
      ここに集まっている者たちはみな、
      おかしいのですよ。
event_goddessfall1_01_e:
  event_goddessfall1_01_e_1:
    speaker: nayuta
    en: It seemeth all have taken their places. 'Tis mine turn now.
    ko: |-
      다들 자리는 잡은 것 같으니,
      이제 소인의 차례요.
    ja: |-
      おのおの持ち場は決まったようですし、
      次は私の番ですねぇ。
  event_goddessfall1_01_e_2:
    speaker: johan
    en: I don't trust your combat skills.
    ko: 네 전투 능력은 신용하지 않는다.
    ja: お前は戦力として信用できない。
  event_goddessfall1_01_e_3:
    speaker: nayuta
    en: I thank thee for reminding me of that which I myself am well aware.
    ko: 소인도 알고 있는 사실을 다시 상기시켜 주어 감사하외다.
    ja: |-
      私もよく理解している事実を
      思い出させていただき、ありがたいですねぇ。
  event_goddessfall1_01_e_4:
    speaker: nayuta
    en: I do intend to accompany Fire Dragon.
    ko: 소인, 화룡 소저와 동행할까 하오.
    ja: ですので、私は火竜に同行しようかと。
  event_goddessfall1_01_e_5:
    speaker: johan
    en: Nihilister...?
    ko: "…니힐리스타와."
    ja: "…ニヒリスター？"
  event_goddessfall1_01_e_6:
    speaker: johan
    en: "... I see now. You're planning on retrieving Lilith's body."
    ko: 그래. 릴리스의 바디를 찾으러 가겠다는 거로군.
    ja: そうか。リリスのボディ探しだな。
  event_goddessfall1_01_e_7:
    speaker: nayuta
    en: The Queen shall fall.
    ko: 퀸은 떨어질 것이외다.
    ja: クイーンは降りてくるでしょう。
  event_goddessfall1_01_e_8:
    speaker: nayuta
    en: She shall surely descend into the realm of our grasp.
    ko: 우리의 손이 닿는 영역까지 반드시 떨어지외다.
    ja: 私たちの手が届く場所まで、必ず。
  event_goddessfall1_01_e_9:
    speaker: nayuta
    en: We must needs prepare a poisoned chalice for that hour.
    ko: 그때를 위한, 독잔을 준비해야 하오.
    ja: その時に備えて、毒杯を用意しておかなければ。
  event_goddessfall1_01_e_10:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_11:
    speaker: johan
    en: I oppose this plan.
    ko: 반대다.
    ja: いい案だとは思えないな。
  event_goddessfall1_01_e_12:
    speaker: johan
    en: The amount of Raptures we're dealing with is no joke.
    ko: 랩쳐들의 수가 보통이 아니다.
    ja: ラプチャーの数が尋常ではない。
  event_goddessfall1_01_e_13:
    speaker: johan
    en: Inherit and Pioneer could probably hold them off...
    ko: 인헤르트와 파이오니아라면 막아낼 순 있겠지만….
    ja: |-
      インヘルトとパイオニアの戦力なら、
      防衛はできるだろう。だが…
  event_goddessfall1_01_e_14:
    speaker: johan
    en: But the problem is what's up there.
    ko: 문제는 저 위에 있는 것이다.
    ja: 問題は上だ。
  event_goddessfall1_01_e_15:
    speaker: nayuta
    en: You are most assuredly correct. We know not what deeds the Queen may yet undertake.
    ko: |-
      옳은 말씀이오.
      퀸이 무슨 짓을 할지 알 수 없소.
    ja: |-
      もっともな考えです。
      クイーンが何をしてくるか分かりません。
  event_goddessfall1_01_e_16:
    speaker: johan
    en: She could even dive down on us at any moment.
    ko: 지금 당장 급강하해 내려올지도 모를 일이지.
    ja: 突然降下を再開する可能性もある。
  event_goddessfall1_01_e_17:
    speaker: johan
    en: In the face of the unexpected, it's better to have some strength available.
    ko: |-
      예상외의 상황이 벌어졌을 때,
      전력은 조금이라도 있는 편이 좋다.
    ja: |-
      予想外の事態に対応できるよう、
      今は少しの戦力でも惜しい。
  event_goddessfall1_01_e_18:
    speaker: nayuta
    en: Verily, that may be so...
    ko: 그것도 그렇소만….
    ja: 筋の通った考えではありますが…
  event_goddessfall1_01_e_19:
    speaker: nayuta
    en: Mine greatest concern is with the state of Fire Dragon.
    ko: 가장 심려되는 것은, 화룡 소저의 상태요.
    ja: いま最大の不安要素は、火竜の状態です。
  event_goddessfall1_01_e_20:
    speaker: johan
    en: Nihilister can't harm anyone, not the way she is now. She's little more than
      a walking corpse.
    ko: |-
      니힐리스타는 지금 아무런 해를 끼칠 수 없다.
      걸어다니는 송장과 다르지 않지.
    ja: |-
      ニヒリスターは何もできない。
      今は歩くしかばねも同然だ。
  event_goddessfall1_01_e_21:
    speaker: johan
    en: You, however, are useful.
    ko: 하지만 너는 쓸만하다.
    ja: しかし、お前にはできることがある。
  event_goddessfall1_01_e_22:
    speaker: nayuta
    en: What sort of entity dost thou suppose the Queen to be?
    ko: 퀸이 어떤 존재라 생각하오.
    ja: クイーンについては、どのような見立てですか？
  event_goddessfall1_01_e_23:
    speaker: johan
    en: What's with the sudden question, Monk? Continue with your story.
    ko: |-
      갑자기 무슨 질문이냐 승려.
      얘기를 계속해라.
    ja: |-
      話が読めないな。
      詳しく聞こう。
  event_goddessfall1_01_e_24:
    speaker: nayuta
    en: In the hierarchy of Raptures, the Queen of Raptures standeth as the pinnacle.
    ko: |-
      퀸이란. 랩쳐의 여왕.
      랩쳐의 정점이란 말이외다.
    ja: |-
      クイーンとは、ラプチャーの女王。
      ラプチャーの上に君臨する者です。
  event_goddessfall1_01_e_25:
    speaker: nayuta
    en: She hath descended after a century.
    ko: 100여 년 만에 내려온, 여왕.
    ja: その女王が、100年ぶりに帰ってきた。
  event_goddessfall1_01_e_26:
    speaker: nayuta
    en: How can we be sure that Fire Dragon, upon beholding her, shall not falter?
    ko: 화룡 소저가 그 모습을 보고 마음이 흔들리지 않을 것이란 보장이 있소?
    ja: |-
      その姿を見た火竜が
      考えを変えないと信用できますか？
  event_goddessfall1_01_e_27:
    speaker: johan
    en: Are you saying there's a chance she might betray us?
    ko: 배신할 가능성을 말하는 건가.
    ja: 裏切る可能性があると言いたいのか。
  event_goddessfall1_01_e_28:
    speaker: johan
    en: "... No. She was never our ally to begin with."
    ko: "…아니지. 애초에 동맹도 아니었으니."
    ja: "…いや。そもそも仲間でもなかったな。"
  event_goddessfall1_01_e_29:
    speaker: nayuta
    en: All the more cause to doubt her trustworthiness.
    ko: 그런 만큼 믿을 수 없소.
    ja: そう、信用できる相手ではない。
  event_goddessfall1_01_e_30:
    speaker: nayuta
    en: That is why, ere any misfortune befall Fire Dragon...
    ko: 그러니 화룡 소저에게 무슨 일이 생기기 전에.
    ja: ですので、火竜が問題になる前に…
  event_goddessfall1_01_e_31:
    speaker: nayuta
    en: We must needs secure the body of Lilith.
    ko: 릴리스의 바디를 우리가 확보해야 하오.
    ja: |-
      リリスのボディは
      我々で確保する必要があります。
  event_goddessfall1_01_e_32:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_33:
    speaker: johan
    en: Monk.
    ko: 승려.
    ja: 仙人。
  event_goddessfall1_01_e_34:
    speaker: johan
    en: What do you plan on doing with Nihilister after you retrieve Lilith's body?
    ko: 릴리스의 바디를 찾은 후 니힐리스타를 어떻게 할 생각이지?
    ja: |-
      用済みになったニヒリスターは
      どうするつもりだ？
  event_goddessfall1_01_e_35:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_36:
    speaker: johan
    en: Tsk.
    ko: 쯧.
    ja: ふん…
  event_goddessfall1_01_e_37:
    speaker: johan
    en: You're no different from the rest.
    ko: 너도 다를 바 없군.
    ja: お前も同類のようだな。
  event_goddessfall1_01_e_38:
    speaker: nayuta
    en: I am resolved to undertake any measures necessary to claim victory.
    ko: 소인은 이기기 위해서라면 무슨 짓이든 할 것이외다.
    ja: 勝つためなら手段は選ばぬ覚悟ですので。
  event_goddessfall1_01_e_39:
    speaker: johan
    en: "... Fine."
    ko: "…좋다."
    ja: "…そうか。"
  event_goddessfall1_01_e_40:
    speaker: johan
    en: Go retrieve Lilith's body.
    ko: 릴리스의 바디를 찾아와라.
    ja: リリスのボディは任せる。
  event_goddessfall1_01_e_41:
    speaker: isabel
    en: What do you think about a passageway at this elevation?
    ko: 이 정도 높이의 통로라면 어때?
    ja: この高さの通路なら、どう？
  event_goddessfall1_01_e_42:
    speaker: hongryeon
    en: Hmm. It's not bad. Though it may strain me, I could spring downward or upward
      if the occasion demands.
    ko: 흠. 나쁘지 않네. 조금 무리는 해야겠지만 뛰어내리는 것도, 뛰어오르는 것도 가능하겠어.
    ja: |-
      ふむ。悪くない。
      少し無理はするが、上にも下にも届く。
  event_goddessfall1_01_e_43:
    speaker: hongryeon
    en: Isabel, thou art adept in the arts of aerial combat. Dost thou truly believe
      that joining forces with me won't impede thy prowess?
    ko: 이사벨 낭자는 공중전이 특기인데, 괜히 나와 엮여 손해를 보는 것 아닌가?
    ja: |-
      そちらは空中戦が特技と言っていたかい？
      私と組んでは生かせないのではないかね。
  event_goddessfall1_01_e_44:
    speaker: isabel
    en: I've got a short-range weapon anyway, so I need to engage in close-quarters
      combat. But it's not a big deal, so don't worry.
    ko: |-
      무장의 사거리가 짧아 반쯤은 접근전을 해야 해.
      손해 볼 것까지는 아니니 걱정 마.
    ja: |-
      武器の射程の都合で、半分は接近戦よ。
      相性は悪くないと思うわ、心配しないで。
  event_goddessfall1_01_e_45:
    speaker: hongryeon
    en: Verily, we find ourselves united in this endeavor. Let us devote our utmost
      efforts to the cause.
    ko: 뭐, 몸으로 같이 구르는 처지에 함께 힘내보세.
    ja: |-
      ふむ、ならば白兵戦を生き抜く者同士、
      息を合わせて参るとしよう。
  event_goddessfall1_01_e_46:
    speaker: isabel
    en: "... All right. I'm trusting in you."
    ko: "…그래. 잘 부탁해."
    ja: "…そうね。よろしく。"
  event_goddessfall1_01_e_47:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_48:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_49:
    speaker: hongryeon
    en: Thy countenance doth reveal a mind brimming with curiosity.
    ko: 궁금한 게 많은 얼굴이군.
    ja: 聞きたいことがあるという顔だね。
  event_goddessfall1_01_e_50:
    speaker: hongryeon
    en: Our alliance might be fleeting, but should any questions arise, hesitate not
      to ask.
    ko: 잠시동안의 동맹이겠으나, 궁금한 게 있다면 괘념치말고 물어보시게.
    ja: |-
      一時的とはいえ、背中を預ける関係だ。
      遠慮は無用といこう。
  event_goddessfall1_01_e_51:
    speaker: isabel
    en: What will you do once we defeat the Queen?
    ko: 퀸을 쓰러뜨리면 어떻게 할 거야?
    ja: クイーンを倒した後は、どうするつもり？
  event_goddessfall1_01_e_52:
    speaker: hongryeon
    en: What is this? Dost thou speak of the aftermath of a battle not yet commenced?
    ko: 이런. 시작도 하지 않은 싸움의 뒤를 이야기하는 건가.
    ja: |-
      おやおや…戦いも始まってもいないというのに、
      その後のことかい？
  event_goddessfall1_01_e_53:
    speaker: hongryeon
    en: Such speech may surely bring about one's demise.
    ko: 죽기 십상일세, 그런 비빌 언덕을 만들어 놓는 것은.
    ja: そのような話、死地に向かう者がすることだ。
  event_goddessfall1_01_e_54:
    speaker: isabel
    en: Just consider it casual chit-chat.
    ko: 작은 잡담이라고 생각해 줘.
    ja: 単なる他愛のない雑談よ。
  event_goddessfall1_01_e_55:
    speaker: hongryeon
    en: Well... 'tis likely I shall live out my days toiling the land.
    ko: 뭐… 아마 밭이나 일구며 살아가지 않겠나.
    ja: まあ…畑でも耕しながら過ごすであろうな。
  event_goddessfall1_01_e_56:
    speaker: hongryeon
    en: I shall forsake my sword and take up the hoe.
    ko: 검을 버리고, 농기구를 손에 들걸세.
    ja: 剣を捨て、クワを取る。
  event_goddessfall1_01_e_57:
    speaker: isabel
    en: Why haven't you done that already?
    ko: 지금까지는 왜 그렇게 하지 않았어?
    ja: 今までそうしなかったのは、なぜ？
  event_goddessfall1_01_e_58:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_59:
    speaker: isabel
    en: Why do you fight for humanity?
    ko: 왜 인류를 위해 싸우지?
    ja: あくまで人類のために戦う理由は？
  event_goddessfall1_01_e_60:
    speaker: isabel
    en: Why don't you stop wielding your sword?
    ko: 왜 검을 멈추지 않아?
    ja: なぜ剣を手放さないの？
  event_goddessfall1_01_e_61:
    speaker: hongryeon
    en: This doth not constitute mere trifling discourse.
    ko: 작은 잡담이 아니지 않은가.
    ja: 他愛のない雑談ではなかったのかね？
  event_goddessfall1_01_e_62:
    speaker: isabel
    en: I just feel like I won't have another chance to ask you this.
    ko: 지금이 아니면 물어볼 기회가 없을 것 같아서.
    ja: 今しか聞く機会がないと思って。
  event_goddessfall1_01_e_63:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_64:
    speaker: hongryeon
    en: I desire to partake in drink with those whom I cherish.
    ko: 좋아하는 이들과 술 한잔하고 싶어서네.
    ja: 気の合う者たちと酒を酌み交わしたいからさ。
  event_goddessfall1_01_e_65:
    speaker: isabel
    en: You can drink anytime you want.
    ko: 술이라면 얼마든지 마실 수 있잖아.
    ja: |-
      お酒なら今だって、
      好きなように飲めるでしょう？
  event_goddessfall1_01_e_66:
    speaker: hongryeon
    en: With naught but peace in mind.
    ko: 아무런 걱정 없이.
    ja: 何の心配もなく…
  event_goddessfall1_01_e_67:
    speaker: hongryeon
    en: I long to partake of drink with naught a care in all the world.
    ko: 그저 느긋하게 마시고 싶네.
    ja: ただ、ゆったりと飲みたいのだ。
  event_goddessfall1_01_e_68:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_69:
    speaker: hongryeon
    en: Not to drown my pain, nor out of loneliness, nor to wallow in nostalgia.
    ko: |-
      괴로움을 잊기 위해서도 아니고,
      외로워서도 아니고, 과거가 그리워서도 아닌.
    ja: |-
      つらさを忘れる酒でもなく、
      寂しさをまぎらわす酒でもなく、
      昔を恋しく思って飲む酒でもない。
  event_goddessfall1_01_e_70:
    speaker: hongryeon
    en: I seek only to drink, laugh, and talk at ease.
    ko: 그저 마시며 웃고 떠들기 위한 술을 마시고 싶네.
    ja: ただ…飲んで笑って、騒ぐ酒が飲みたい。
  event_goddessfall1_01_e_71:
    speaker: hongryeon
    en: Art thou aware?
    ko: 그거 알고 있나?
    ja: 知っているかい？
  event_goddessfall1_01_e_72:
    speaker: hongryeon
    en: When one partakes of libations whilst beset by the looming specters of future
      concerns, the flavor doth turn most insufferably vile.
    ko: |-
      미래에 대한 걱정을 끌어안은 채 술을 마시면,
      그 맛이 그렇게도 끔찍하기 짝이 없다네.
    ja: |-
      未来への憂いが混ざった酒は、
      実にひどい味がするのだ。
  event_goddessfall1_01_e_73:
    speaker: hongryeon
    en: In this regard, mayhap I have yet to know the true savor of liquor.
    ko: 그런 의미에서, 나는 아직 제대로 된 술맛을 모르는 것일지도 모르지.
    ja: |-
      そう考えると、私はまだ本当の酒を
      味わったことはないのかも知れないねえ。
  event_goddessfall1_01_e_74:
    speaker: isabel
    en: I don't really understand.
    ko: 이해가 잘 안 가는데.
    ja: 私にはよく分からないわ。
  event_goddessfall1_01_e_75:
    speaker: hongryeon
    en: Maiden, dost thou have a taste for the drink?
    ko: 낭자, 술은 좀 하는가?
    ja: お嬢ちゃん、酒はいける口かい？
  event_goddessfall1_01_e_76:
    speaker: isabel
    en: Not really.
    ko: 별로.
    ja: あまり。
  event_goddessfall1_01_e_77:
    speaker: hongryeon
    en: Then partake of this cup.
    ko: 그럼 이거 한 잔 받게.
    ja: ならば、一杯受け取っておくれ。
  event_goddessfall1_01_e_78:
    speaker: isabel
    en: Drinking before a battle? Are you out of your mind?
    ko: "…전투 직전에 술이라니 무슨 생각이야."
    ja: "…戦いの前にお酒なんて、何を考えているの？"
  event_goddessfall1_01_e_79:
    speaker: hongryeon
    en: A modest libation 'tis said to enhance thine blood circulation.
    ko: |-
      응? 모르는 건가.
      술 한잔하면 혈액순환에 도움이 되네.
    ja: |-
      おや？知らないのかい？
      少しの酒は血の巡りをよくするのだ。
  event_goddessfall1_01_e_80:
    speaker: hongryeon
    en: Art thou aware of what that means?
    ko: 그 말이 무엇이겠는가.
    ja: それはつまり…
  event_goddessfall1_01_e_81:
    speaker: hongryeon
    en: It signifies that thine blood doth boil with fervor.
    ko: 피가 끓는다 이 말일세.
    ja: 血がたぎってくるということさ。
  event_goddessfall1_01_e_82:
    speaker: hongryeon
    en: It speaks of readiness for battle, with fire coursing through their veins.
    ko: 더 잘 싸울 수 있다는 이야기와 일맥상통하는 것이지.
    ja: 戦うには都合がいい。
  event_goddessfall1_01_e_83:
    speaker: isabel
    en: "... I'll pass."
    ko: 난… 됐어.
    ja: 私は…結構よ。
  event_goddessfall1_01_e_84:
    speaker: hongryeon
    en: I thank thee for thy refusal. 'Tis a most admirable liquor, indeed.
    ko: |-
      거절해 줘서 고맙네.
      좋은 술이거든, 이거.
    ja: |-
      それならそれでありがたい。
      いい酒なのだ、これは。
  event_goddessfall1_01_e_85:
    speaker: "<Narration>"
    en: "*Gulp, gulp*"
    ko: 꿀꺽, 꿀꺽.
    ja: ゴク、ゴクッ――
  event_goddessfall1_01_e_86:
    speaker: hongryeon
    en: Ahhh, exquisite.
    ko: 후우~ 일품이로세.
    ja: あぁ～…たまらないねぇ。
  event_goddessfall1_01_e_87:
    speaker: isabel
    en: "... You really are crazy."
    ko: "…미쳤네, 역시."
    ja: "…聞いてはいたけど、おかしな人ね。"
  event_goddessfall1_01_e_88:
    speaker: rapunzel
    en: I heard you are regarded as the strongest shield on the surface, Sister Noah.
    ko: 노아 자매님은 지상 최강의 방패라고 불리고 있다죠?
    ja: |-
      確か、あなたは地上最強の盾と
      呼ばれているのでしたね？
  event_goddessfall1_01_e_89:
    speaker: noah
    en: Ah, so that truth-packed rumor has reached your ears, huh?
    ko: 오. 그 진실로 가득한 소문이 거기까지 흘러 들어갔어?
    ja: おっ。そっちで聞くほどウワサになってるの？
  event_goddessfall1_01_e_90:
    speaker: noah
    en: I was trying to hide it, but I guess it can't be helped.
    ko: 숨기려 했는데 어쩔 수 없네.
    ja: 隠そうかと思ってたけど、仕方ないな～
  event_goddessfall1_01_e_91:
    speaker: noah
    en: Yes. I am the strongest shield on the surface.
    ko: 맞아. 내가 바로 그 지상 최강의 방패야.
    ja: そ、私こそが地上最強の盾。
  event_goddessfall1_01_e_92:
    speaker: rapunzel
    en: Hehe. Impressive.
    ko: 후후. 대단하네요.
    ja: ふふ、ご立派ですね。
  event_goddessfall1_01_e_93:
    speaker: noah
    en: But what are you good at?
    ko: 근데 넌 뭘 잘해?
    ja: そっちこそ、得意なこととかあるの？
  event_goddessfall1_01_e_94:
    speaker: rapunzel
    en: Me? I... am confident with healing and defense.
    ko: 저요? 저는… 회복이랑 방어에는 자신 있어요.
    ja: |-
      私ですか？
      私は…回復と防御には自信があります。
  event_goddessfall1_01_e_95:
    speaker: noah
    en: Pfft! You're... confident when it comes to defense?
    ko: 푸훕-! 방. 어. 에. 자. 신. 이. 있. 어. 요?
    ja: プーッ！防御には自信があります～？
  event_goddessfall1_01_e_96:
    speaker: rapunzel
    en: Of course. I can block anything.
    ko: 그럼요. 뭐든 막아낼 수 있어요.
    ja: ええ。何でも防いでみせますよ。
  event_goddessfall1_01_e_97:
    speaker: noah
    en: What could you possibly block with that rusty old body of yours?
    ko: 그 낡아빠진 바디로 뭘 어떻게 다 막아낼 수 있다는 건데?
    ja: |-
      そんなボロボロのボディで
      何でも防げるっていうの？
  event_goddessfall1_01_e_98:
    speaker: rapunzel
    en: Haha. Are you aware of this, Sister Noah?
    ko: |-
      후후. 노아 자매님.
      그거 아시나요?
    ja: ふふ…知っていますか？
  event_goddessfall1_01_e_99:
    speaker: rapunzel
    en: A shield which is raised to protect something precious...
    ko: 소중한 것을 지키기 위해 펼쳐지는 방패는.
    ja: 大切なものを守るために掲げられた盾は…
  event_goddessfall1_01_e_100:
    speaker: rapunzel
    en: It can block anything.
    ko: 뭐든 막아낼 수 있어요.
    ja: どんなものでも防ぐことができるのです。
  event_goddessfall1_01_e_101:
    speaker: noah
    en: What is this?
    ko: 뭔데 그게.
    ja: なにそれ。
  event_goddessfall1_01_e_102:
    speaker: noah
    en: Are you trying to convert me to some weird religion or something?
    ko: 너 막 이상한 종교 같은 거 전도하려는 거 아냐?
    ja: ヘンな宗教でも広めに来たの？
  event_goddessfall1_01_e_103:
    speaker: rapunzel
    en: Hehe. Are you fond of those from Inherit, Sister Noah?
    ko: |-
      후후. 노아 자매님.
      인헤르트의 분들은 좋아하시나요?
    ja: |-
      いいえ。
      インヘルトの皆さんのことは好きですか？
  event_goddessfall1_01_e_104:
    speaker: noah
    en: Huh? Why are you asking that all of a sudden?
    ko: 뭐, 뭐래 갑자기.
    ja: な、何なの急に…
  event_goddessfall1_01_e_105:
    speaker: rapunzel
    en: You also like Eden, right?
    ko: 에덴도 좋아하죠?
    ja: エデンのことも？
  event_goddessfall1_01_e_106:
    speaker: noah
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_107:
    speaker: rapunzel
    en: Then some day, raise the surface's mightiest shield for them.
    ko: 그럼 언젠가, 그 지상 최강의 방패를 그분들을 위해 들어봐요.
    ja: |-
      でしたらいつか、地上最強の盾を
      その人たちのために掲げてください。
  event_goddessfall1_01_e_108:
    speaker: rapunzel
    en: Then that shield, as the rumors say, will truly be the strongest and most
      unbreakable shield there is.
    ko: 그 방패는, 말 그대로 그 무엇도 뚫을 수 없는 최강의 방패가 될 테니까요.
    ja: |-
      その時きっと、あなたの盾は
      何にも破られない最強の盾になります。
  event_goddessfall1_01_e_109:
    speaker: noah
    en: You say such embarrassing things without a second thought.
    ko: "…그런 낯 뜨거운 말을 아무렇지도 않게 하네."
    ja: |-
      …そんなこっ恥ずかしいこと、
      よく堂々と言えるね。
  event_goddessfall1_01_e_110:
    speaker: noah
    en: You really are crazy.
    ko: 미쳤나 봐 진짜.
    ja: ホント、おかしいって。
  event_goddessfall1_01_e_111:
    speaker: snowwhite
    en: Let's go here.
    ko: 여기로 하지.
    ja: ここがいい。
  event_goddessfall1_01_e_112:
    speaker: snowwhite
    en: We can hold the high ground and provide cover from all directions.
    ko: 이곳이면 고지를 점령할 수 있으면서 전방위를 커버할 수 있다.
    ja: 高台を抑えながら、全方向をカバーできる。
  event_goddessfall1_01_e_113:
    speaker: snowwhite
    en: The terrain's slightly unstable, but it's manageable.
    ko: 바닥이 불안정하지만, 그 정도는 감안할 만하다.
    ja: |-
      足下が少し不安定だが、
      この程度なら許容範囲だ。
  event_goddessfall1_01_e_114:
    speaker: harran
    en: I'm surprised that you're even helping.
    ko: 용케 도와줄 마음이 들었구나.
    ja: よく手を貸す気になったわね。
  event_goddessfall1_01_e_115:
    speaker: snowwhite
    en: We need to take down the Queen.
    ko: 퀸을 잡아야 하니까.
    ja: クイーンを倒すためだ。
  event_goddessfall1_01_e_116:
    speaker: harran
    en: Don't you hate us?
    ko: 너는 우릴 싫어하지 않니?
    ja: 私たちのことが嫌いなのでしょう？
  event_goddessfall1_01_e_117:
    speaker: snowwhite
    en: I do.
    ko: 싫어한다.
    ja: そうだ。
  event_goddessfall1_01_e_118:
    speaker: harran
    en: I've always wondered why that is.
    ko: 나는 예전부터 그것이 궁금했단다.
    ja: 昔から気になっていたのよ。
  event_goddessfall1_01_e_119:
    speaker: harran
    en: We both want to defeat the Queen and return the surface to humankind, don't
      we?
    ko: 퀸을 잡고 인류에게 지상을 돌려준다는 목적은 같지 않니.
    ja: |-
      クイーンを討ち、人類に地上を取り戻す。
      目的は同じはずよ。
  event_goddessfall1_01_e_120:
    speaker: snowwhite
    en: Your goal is to take revenge on humanity.
    ko: 너희는 인류에게 복수하는 것이 목적이니까.
    ja: お前たちの目的は、人類への復讐だ。
  event_goddessfall1_01_e_121:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_122:
    speaker: snowwhite
    en: You want to achieve what humanity couldn't and then trample over them.
    ko: |-
      인류가 하지 못 한 일을 너희가 해낸 다음,
      인류를 깔아뭉개는 것이 목적이니까.
    ja: |-
      人類ができなかったことを成し遂げた後、
      ねじ伏せて潰すことが目的だ。
  event_goddessfall1_01_e_123:
    speaker: harran
    en: We were all betrayed by the Ark.
    ko: 우리 모두는 방주에 배신당했단다.
    ja: |-
      エデンにいる誰もが、
      アークに裏切られているの。
  event_goddessfall1_01_e_124:
    speaker: harran
    en: But then again.
    ko: 하지만 그건.
    ja: でも、それは…
  event_goddessfall1_01_e_125:
    speaker: harran
    en: Wasn't it true for all of you too?
    ko: 너희도 마찬가지지 않니?
    ja: お前たちも同じことでしょう？
  event_goddessfall1_01_e_126:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_01_e_127:
    speaker: harran
    en: In fact, you all suffered even worse than we did.
    ko: 오히려 우리보다 지독하게 당했더구나.
    ja: |-
      むしろ、私たちよりひどい裏切られ方と
      言ってもいいわ。
  event_goddessfall1_01_e_128:
    speaker: snowwhite
    en: Did Dorothy tell you that?
    ko: 도로시가 이야기해 주던가?
    ja: ドロシーに聞かされたのか？
  event_goddessfall1_01_e_129:
    speaker: harran
    en: That's right.
    ko: 그렇단다.
    ja: ええ。
  event_goddessfall1_01_e_130:
    speaker: snowwhite
    en: I didn't realize she was so talkative.
    ko: 말이 많은 성격인 줄은 몰랐군.
    ja: 話したがりだとは知らなかったな。
  event_goddessfall1_01_e_131:
    speaker: harran
    en: Why don't you want vengeance?
    ko: 왜 복수하지 않니?
    ja: 復讐を選ばないのは、なぜ？
  event_goddessfall1_01_e_132:
    speaker: snowwhite
    en: Because humanity is more important than us.
    ko: 우리보다 인류가 중요하니까.
    ja: 私たちより、人類の方が重要だからだ。
  event_goddessfall1_01_e_133:
    speaker: harran
    en: Then why don't you go back to the Ark?
    ko: 그럼 왜 방주로 돌아가지 않니?
    ja: それなら、なぜアークに戻ろうとしないの？
  event_goddessfall1_01_e_134:
    speaker: snowwhite
    en: Because we haven't achieved anything. If we returned to the Ark now, we'd
      only be making things worse for them.
    ko: |-
      우리는 아무것도 이루지 못했다.
      이대로 돌아가면 방주가 곤란해질 테니까.
    ja: |-
      私たちはまだ何も成し遂げていない。
      このまま戻れば、アークが困るだろう。
  event_goddessfall1_01_e_135:
    speaker: harran
    en: Why is that?
    ko: 어째서니.
    ja: 困る？
  event_goddessfall1_01_e_136:
    speaker: snowwhite
    en: There must be a reason why they cast us out.
    ko: 우릴 그렇게 쳐낸 것에는 이유가 있을 거다.
    ja: 私たちを追放した理由が、何かあるはずだ。
  event_goddessfall1_01_e_137:
    speaker: snowwhite
    en: I want to know that reason, but I also don't want to go back simply to demand
      answers.
    ko: |-
      그 이유는 궁금하지만,
      굳이 찾아가서 따지고 싶지는 않다.
    ja: |-
      知りたくはあるが、
      あえて問い詰めたいとも思わない。
  event_goddessfall1_01_e_138:
    speaker: harran
    en: So, even though the Ark betrayed all of you, you still refuse to return because
      you might cause them trouble.
    ko: |-
      너흴 배신한 방주지만,
      너희는 방주가 곤란할까 봐 찾아가지도 않고.
    ja: |-
      裏切られた相手を困らせたくもないから、
      尋ねもしない…
  event_goddessfall1_01_e_139:
    speaker: harran
    en: And you're wandering the surface trying to capture the Queen for humanity
      and for the Ark?
    ko: 방주를, 인류를 위해 퀸을 잡으러 지상을 떠도는 것이니?
    ja: |-
      クイーンを討つのは、アークと人類のため。
      それで地上を彷徨っているというのね？
  event_goddessfall1_01_e_140:
    speaker: snowwhite
    en: That's right.
    ko: 그래.
    ja: そうだ。
  event_goddessfall1_01_e_141:
    speaker: harran
    en: Snow White.
    ko: 스노우 화이트야.
    ja: スノーホワイト。
  event_goddessfall1_01_e_142:
    speaker: harran
    en: Do you still love humanity?
    ko: 아직도 인류를 사랑하니?
    ja: まだ人類への愛があるの？
  event_goddessfall1_01_e_143:
    speaker: snowwhite
    en: I do.
    ko: 그래.
    ja: そうだ。
  event_goddessfall1_01_e_144:
    speaker: harran
    en: Hehe.
    ko: 후후.
    ja: ふふ…
  event_goddessfall1_01_e_145:
    speaker: harran
    en: You guys really are crazy.
    ko: 역시 너흰 미쳤구나.
    ja: 思った通り。狂っているわ、お前たち。
event_goddessfall1_02_s:
  event_goddessfall1_02_s_1:
    speaker: "<Narration>"
    en: "*Swoosh*"
    ko: 푸슉-
    ja: プシューッ――
  event_goddessfall1_02_s_2:
    speaker: "<Narration>"
    en: The gate to the Atlas Cage opens.
    ko: 아틀라스 케이지의 문이 열렸다.
    ja: アトラスケージの扉が開かれた
  event_goddessfall1_02_s_3:
    speaker: nayuta
    en: Thou art liberated, Fire Dragon.
    ko: 출소요. 화룡 소저.
    ja: 出ますよ、火竜。
  event_goddessfall1_02_s_4:
    speaker: nihilister_a
    en: The Queen...
    ko: "…퀸은."
    ja: "…クイーンは？"
  event_goddessfall1_02_s_5:
    speaker: nayuta
    en: She doth reside at an altitude of... Uh...
    ko: 상공… 어….
    ja: 上空…ええー…
  event_goddessfall1_02_s_6:
    speaker: cecil
    en: Like I said, it's 48 kilometers. Your sense of distance is appalling.
    ko: |-
      48km라니까요.
      거리 감각이 궤멸적이시네요.
    ja: |-
      48キロメートルです。
      距離感覚が壊滅していますね。
  event_goddessfall1_02_s_7:
    speaker: nayuta
    en: She hath taken position at an altitude of 48 kilometers, and assailed Eden.
      Eden hath suffered much destruction as a result.
    ko: |-
      그래그래. 상공 48km에 진을 치고 있소.
      에덴을 향해 공격을 했고, 에덴이 많이 부서졌소.
    ja: |-
      そうですねぇ。48キロメートル上空です。
      エデンは攻撃を受け、甚大な被害が出ました。
  event_goddessfall1_02_s_8:
    speaker: nihilister_a
    en: No other movements since then?
    ko: 그 이후에 다른 움직임은 없고?
    ja: その後の動きは？
  event_goddessfall1_02_s_9:
    speaker: nayuta
    en: Indeed.
    ko: 그렇소.
    ja: ないですねぇ。
  event_goddessfall1_02_s_10:
    speaker: nihilister_a
    en: "... Good."
    ko: "…좋아."
    ja: "…そうか。"
  event_goddessfall1_02_s_11:
    speaker: nihilister_a
    en: I'll guide you. Phony Monk.
    ko: 안내해 주지. 땡중.
    ja: 案内してやるぜ。クソ仙人。
  event_goddessfall1_02_s_12:
    speaker: nihilister_a
    en: I'll take you to where Lilith's body is.
    ko: 릴리스의 바디가 있는 곳으로.
    ja: リリスのボディがある場所までな。
  event_goddessfall1_02_s_13:
    speaker: cecil
    en: It's best if you put this on.
    ko: 이걸 착용하고 가는 게 좋을 거예요.
    ja: これを身につけていてください。
  event_goddessfall1_02_s_14:
    speaker: nihilister_a
    en: What is this?
    ko: 뭔데 이게.
    ja: 何だこりゃ。
  event_goddessfall1_02_s_15:
    speaker: cecil
    en: It's a cloak made of signal-blocking material from the Atlas Cage.
    ko: 아틀라스 케이지의 신호 차단 물질로 만든 망토예요.
    ja: |-
      アトラスケージと同じ、
      信号を遮断する物質で作られたマントです。
  event_goddessfall1_02_s_16:
    speaker: cecil
    en: If you wear this, the other Heretics won't be able to detect you, and you
      won't be able to detect them.
    ko: |-
      이걸 뒤집어쓰고 있으면 다른 헬레틱이 당신을 감지할 수도,
      당신이 다른 헬레틱을 감지할 수도 없겠죠.
    ja: |-
      他のヘレティックから感知されることも、
      その逆も防ぎます。
  event_goddessfall1_02_s_17:
    speaker: cecil
    en: It's not a sure thing though, since we don't know precisely how you Heretics
      share your location data.
    ko: |-
      확실하진 않아요.
      당신들이 무슨 원리로 위치를 공유하는지 알 수 없으니까.
    ja: |-
      ただし、絶対という保証はできません。
      あなたたちが互いを感知できる原理には
      不明な部分が多いですから。
  event_goddessfall1_02_s_18:
    speaker: nihilister_a
    en: "... Give it to me."
    ko: "…줘봐."
    ja: "…貸せ。"
  event_goddessfall1_02_s_19:
    speaker: "<Narration>"
    en: "*Flutter*"
    ko: 펄럭-
    ja: バサッ
  event_goddessfall1_02_s_20:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_s_21:
    speaker: nayuta
    en: Ah, thou dost bear the semblance of a vagrant. Most apt indeed for thee, Fire
      Dragon.
    ko: 오. 꼭 부랑자 같은 것이 화룡 소저와 퍽이나 어울리외다.
    ja: おお。ボロボロのあなたにはお似合いですねえ。
  event_goddessfall1_02_s_22:
    speaker: nihilister_m
    en: Shut up.
    ko: 닥쳐라 좀.
    ja: ちょっと黙ってろ。
  event_goddessfall1_02_s_23:
    speaker: cecil
    en: How about taking a step outside?
    ko: 나와 보시겠어요?
    ja: 外に出てみてください。
  event_goddessfall1_02_s_24:
    speaker: "<Narration>"
    en: Nihilister sets one foot outside of the Atlas Cage.
    ko: 니힐리스타는 아틀라스 케이지에서 한 걸음 밖으로 나왔다.
    ja: |-
      ニヒリスターがアトラスケージから
      足を踏み出した
  event_goddessfall1_02_s_25:
    speaker: cecil
    en: Well, what do you think?
    ko: 어떤 것 같아요?
    ja: どうですか？
  event_goddessfall1_02_s_26:
    speaker: nihilister_m
    en: "... I don't sense the others."
    ko: "…다른 놈들이 느껴지진 않네."
    ja: "…他の奴らは感じられないな。"
  event_goddessfall1_02_s_27:
    speaker: nihilister_m
    en: Although I can't know if the others can sense me.
    ko: 다른 놈들이 날 느끼지 못할지 어떨지는 모르겠지만.
    ja: |-
      他の奴らが俺を感じないかどうかは、
      知らねぇけど。
  event_goddessfall1_02_s_28:
    speaker: cecil
    en: At least we know for certain it's half working.
    ko: 일단 절반은 된 셈이네요.
    ja: ひとまず半分は成功していますね。
  event_goddessfall1_02_s_29:
    speaker: nayuta
    en: We possess not the luxury of time to test it, thus let us proceed forthwith.
    ko: 검증할 시간은 없으니 이대로 출발하겠소.
    ja: |-
      検証している時間はありません。
      このまま向かいましょう。
  event_goddessfall1_02_s_30:
    speaker: nihilister_m
    en: "Do you have transportation? \nIt takes two weeks on foot."
    ko: |-
      타고 갈 건 있냐?
      걸어가면 2주는 걸린다고.
    ja: |-
      乗り物でもあんのか？
      歩きじゃ2週間はかかるぞ。
  event_goddessfall1_02_s_31:
    speaker: cecil
    en: Launching an aircraft right now would be suicide with the Raptures swarming
      in.
    ko: 랩쳐들이 몰려오고 있어서 수송선을 띄우는 건 자살행위예요.
    ja: |-
      ラプチャーが殺到していますので、
      輸送機の使用は自殺行為です。
  event_goddessfall1_02_s_32:
    speaker: nayuta
    en: Do not distress thyself, for I have a plan.
    ko: 그건 소인에게 수가 있으니 걱정 마시오.
    ja: そこは私に考えがありますので、ご心配なく。
  event_goddessfall1_02_s_33:
    speaker: nayuta
    en: Now, let us depart.
    ko: 자, 그럼 출발합시다.
    ja: では、出発しましょう。
  event_goddessfall1_02_s_34:
    speaker: nihilister_m
    en: "... All right. Let's go."
    ko: "…그래. 가보자고."
    ja: "…ああ。行くとするか。"
  event_goddessfall1_02_s_35:
    speaker: nihilister_m
    en: What is this?
    ko: "…뭐냐 이건."
    ja: "…何だぁ、こいつは。"
  event_goddessfall1_02_s_36:
    speaker: nayuta_m
    en: This is Mantra. A cherished companion who serves as my very feet.
    ko: |-
      만트라라고 하외다.
      소인의 발이 되어주는 소중한 친우요.
    ja: |-
      マントラといいます。
      私の足であり、大切な親友です。
  event_goddessfall1_02_s_37:
    speaker: nihilister_m
    en: That's a camel.
    ko: 낙타잖아.
    ja: ラクダじゃねえか。
  event_goddessfall1_02_s_38:
    speaker: nayuta_m
    en: Is there aught wrong with it being a camel?
    ko: 낙타인 것이 무슨 문제라도 되오?
    ja: 何か問題でも？
  event_goddessfall1_02_s_39:
    speaker: nihilister_m
    en: It'll take ages on such a slow animal. By the time we're back, the Queen might
      have already conquered the entire world.
    ko: |-
      느려터진 낙타로 갔다간 한세월이야.
      돌아올 때쯤엔 퀸이 세계 정복도 했겠는데.
    ja: |-
      そんなモンじゃ一年かかるぞ。
      帰る頃にはクイーンに世界征服されてるな。
  event_goddessfall1_02_s_40:
    speaker: nayuta_m
    en: "'Tis a folly to judge by mere appearances. Take a seat upon it, then speak
      thy mind."
    ko: |-
      외형만으로 판단하다니 아둔하오.
      일단 타고 말씀하시오.
    ja: |-
      見た目で侮るとは、浅薄ですねぇ。
      まずは乗ってみてください。
  event_goddessfall1_02_s_41:
    speaker: nihilister_m
    en: You sit in front.
    ko: 네가 앞에 타라.
    ja: お前が前に乗れよ。
  event_goddessfall1_02_s_42:
    speaker: nayuta_m
    en: Do not jest. Shouldst thou embark upon any mischief, I shall be compelled
      to snap thy neck. Thus, doth it not stand to reason that I ride behind thee,
      Fire Dragon?
    ko: 농담도. 허튼 짓을 하면 바로 목을 꺾어버려야 하니, 소인이 화룡 소저의 뒤에 타는 게 맞지 않겠소?
    ja: |-
      ご冗談を。あなたが何か軽挙に及んだ時、
      すぐに始末できないといけません。
      私は背中を見ている必要がありますねぇ。
  event_goddessfall1_02_s_43:
    speaker: nihilister_m
    en: "... Tsk."
    ko: "…쯧."
    ja: "…チッ。"
  event_goddessfall1_02_s_44:
    speaker: johan_op_l
    en: The Raptures will be within range in 10 minutes. Everyone, get ready.
    ko: |-
      10분 뒤 랩쳐들이 사정거리 안으로 들어온다.
      다들 준비해라.
    ja: |-
      10分後にラプチャーが射程距離に入る。
      準備してくれ。
  event_goddessfall1_02_s_45:
    speaker: snowwhite
    en: Got it.
    ko: 그래.
    ja: 分かった。
  event_goddessfall1_02_s_46:
    speaker: johan_op_l
    en: Also, the Monk is leaving Eden.
    ko: 그리고 승려가 에덴을 나선다.
    ja: その隙をついて、仙人がエデンを離脱する。
  event_goddessfall1_02_s_47:
    speaker: snowwhite
    en: Nayuta? Why?
    ko: 나유타가? 어째서지?
    ja: ナユタが？なぜだ？
  event_goddessfall1_02_s_48:
    speaker: johan_op_l
    en: She's going to secure a secret weapon.
    ko: "…비밀 병기를 확보하러 간다고 보면 되겠군."
    ja: "…切り札の確保に向かうと考えてくれ。"
  event_goddessfall1_02_s_49:
    speaker: snowwhite
    en: Okay. I'll provide cover.
    ko: 좋다. 엄호하겠다.
    ja: 分かった。援護する。
  event_goddessfall1_02_s_50:
    speaker: johan_op_l
    en: She's leaving through the north corridor.
    ko: 북쪽 통로로 나간다.
    ja: 北側からだ。
  event_goddessfall1_02_s_51:
    speaker: snowwhite
    en: Roger that.
    ko: 라져.
    ja: 了解した。
  event_goddessfall1_02_s_52:
    speaker: "<Narration>"
    en: Snow White turns her rifle northward.
    ko: 스노우 화이트는 총구를 북쪽 통로 쪽으로 돌린다.
    ja: スノーホワイトが銃口を北へ向けた
  event_goddessfall1_02_s_53:
    speaker: "<Narration>"
    en: From her high vantage point, Snow White looks down across the vast plains.
    ko: |-
      까마득한 높이에 위치하고 있던 스노우 화이트는,
      아래로 보이는 넓은 평야를 바라본다.
    ja: 高台から見下ろす広大な平野には…
  event_goddessfall1_02_s_54:
    speaker: "<Narration>"
    en: It seems like the approaching Raptures are converging into a single point.
    ko: 다가오고 있는 랩쳐의 무리가 뭉쳐진 점으로 보인다.
    ja: |-
      押し寄せるラプチャーの群れが、
      一つの黒点のように見える
  event_goddessfall1_02_s_55:
    speaker: "<Narration>"
    en: Snow White places her finger on the trigger.
    ko: 스노우 화이트는 방아쇠에 손가락을 걸었다.
    ja: スノーホワイトの指が引き金にかかった
  event_goddessfall1_02_s_56:
    speaker: "<Narration>"
    en: At that moment, a black silhouette shoots out of Eden.
    ko: 그 순간, 검은 실루엣이 발사되듯 에덴에서 뛰쳐나갔다.
    ja: |-
      一瞬、黒い影が銃弾のごとく
      エデンから飛び出した
  event_goddessfall1_02_s_57:
    speaker: "<Narration>"
    en: Snow White's reflexes nearly cause her to fire.
    ko: 스노우 화이트는 반사적으로 방아쇠를 당길 뻔했다.
    ja: スノーホワイトは反射的にスコープを向けた
  event_goddessfall1_02_s_58:
    speaker: "<Narration>"
    en: But soon, she realizes it's Nayuta riding a camel, with someone in a hood
      sitting in front of her.
    ko: 하지만 곧, 그것이 낙타에 타고 있는 나유타와 후드를 뒤집어쓴 누군가라는 사실을 알아챘다.
    ja: |-
      しかし、それはナユタとフードを被った誰かが
      何かの背に乗って飛び出していったものだと
      すぐに理解した
  event_goddessfall1_02_s_59:
    speaker: "<Narration>"
    en: Mantra carries Nayuta and Nihilister at breakneck speed, almost too fast to
      follow with the naked eye.
    ko: |-
      만트라는 나유타와 니힐리스타를 태우고,
      눈으로 쫓기 힘든 속도로 평야를 질주했다.
    ja: |-
      影はナユタとニヒリスターを乗せたまま、
      目にも止まらぬ速さで平野を駆け抜けていった
  event_goddessfall1_02_s_60:
    speaker: harran
    en: What is that thing...?
    ko: "…저게 뭐니."
    ja: "…今のは何？"
  event_goddessfall1_02_s_61:
    speaker: snowwhite
    en: Are they taking Mantra? Then there's no need to provide cover.
    ko: 만트라를 타고 가는 건가. 저거라면 엄호할 수 없다. 할 필요도 없고.
    ja: |-
      マントラだ。
      あれは援護できない。する必要もない。
  event_goddessfall1_02_s_62:
    speaker: snowwhite
    en: It's too fast.
    ko: 너무 빨라.
    ja: 速すぎる。
  event_goddessfall1_02_s_63:
    speaker: harran
    en: Isn't it a camel?
    ko: 낙타잖니.
    ja: ラクダのようね。
  event_goddessfall1_02_s_64:
    speaker: snowwhite
    en: It's an incredibly fast camel.
    ko: 빠른 낙타다.
    ja: 速いラクダだ。
  event_goddessfall1_02_s_65:
    speaker: harran
    en: I see.
    ko: 그렇구나.
    ja: なるほどねぇ。
  event_goddessfall1_02_s_66:
    speaker: snowwhite
    en: Who's that riding in front of Nayuta?
    ko: 나유타의 앞에 타고 있는 건 누구지?
    ja: ナユタの前に乗っていたのは誰だ？
  event_goddessfall1_02_s_67:
    speaker: harran
    en: That's Nihilister.
    ko: 니힐리스타란다.
    ja: ニヒリスターよ。
  event_goddessfall1_02_s_68:
    speaker: snowwhite
    en: What...?
    ko: "…뭐?"
    ja: "…何？"
  event_goddessfall1_02_s_69:
    speaker: harran
    en: She has agreed to help us take down the Queen.
    ko: 퀸 공략에 힘을 보태주기로 했다더구나.
    ja: クイーン討伐に力を貸してくれるそうよ。
  event_goddessfall1_02_s_70:
    speaker: snowwhite
    en: You must be mental, joining forces with a Rapture.
    ko: 랩쳐와 손을 잡다니 무슨 생각이지.
    ja: ラプチャーと手を組むなど、正気か？
  event_goddessfall1_02_s_71:
    speaker: harran
    en: By that logic, Marian must be a Rapture too.
    ko: 그럼 마리안도 랩쳐겠구나.
    ja: それなら、マリアンは違うのかしら？
  event_goddessfall1_02_s_72:
    speaker: snowwhite
    en: "... How did you know that?"
    ko: "…그걸 어떻게 알지?"
    ja: "…なぜ知っている？"
  event_goddessfall1_02_s_73:
    speaker: harran
    en: We know a lot more than you think.
    ko: 우린 너희 생각보다 많은 걸 알고 있단다.
    ja: |-
      お前の想像以上に、
      私たちは多くのことを知っているのよ。
  event_goddessfall1_02_s_74:
    speaker: snowwhite
    en: Marian did not kill a Nikke.
    ko: 마리안은 니케를 죽이지 않았다.
    ja: マリアンはニケを殺さなかった。
  event_goddessfall1_02_s_75:
    speaker: harran
    en: If killing a Nikke is the criterion for calling someone a Rapture...
    ko: 니케를 죽인 것으로 랩쳐를 구분하는 거라면
    ja: |-
      ニケを殺すかどうかを
      ラプチャーの判断基準にするなら…
  event_goddessfall1_02_s_76:
    speaker: harran
    en: Then the Ark is one massive Rapture.
    ko: 방주는 정말 거대한 랩쳐로구나.
    ja: |-
      アークは巨大なラプチャーということに
      なるわねぇ。
  event_goddessfall1_02_s_77:
    speaker: harran
    en: Are you guys sacrificing yourselves for the Raptures?
    ko: 너희는 랩쳐를 위해 그렇게 희생하고 있는 것이니?
    ja: |-
      ラプチャーのために身を捧げているとでも
      言うつもり？
  event_goddessfall1_02_s_78:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_s_79:
    speaker: harran
    en: Hehe. Sorry for being petty.
    ko: 후후. 유치한 심술을 부려서 미안하구나.
    ja: ふふ…子どもじみた意地悪をしてしまったわね。
  event_goddessfall1_02_s_80:
    speaker: harran
    en: But it might be a good idea to remember who we're up against, Snow White.
    ko: |-
      하지만 스노우 화이트야.
      지금 우리가 누굴 상대하고 있는지 상기하면 좋겠구나.
    ja: |-
      忘れていないでしょう、スノーホワイト。
      私たちが何に戦いを挑もうとしているのか。
  event_goddessfall1_02_s_81:
    speaker: harran
    en: This isn't the time to make such distinctions.
    ko: 가릴 처치가 아니라는 뜻이란다.
    ja: 今はより好みしている場合じゃないの。
  event_goddessfall1_02_s_82:
    speaker: snowwhite
    en: "... They're in range."
    ko: "…사거리 안으로 들어왔다."
    ja: "…射程内に入った。"
  event_goddessfall1_02_s_83:
    speaker: snowwhite
    en: Let's engage.
    ko: 공격하겠다.
    ja: 攻撃を開始する。
  event_goddessfall1_02_s_84:
    speaker: harran
    en: Right. Let's wipe them out.
    ko: 그래. 쓸어버리자꾸나.
    ja: ええ。片づけましょう。
  event_goddessfall1_02_s_85:
    speaker: "<Narration>"
    en: Nayuta and Nihilister race across the wilderness on the back of Mantra.
    ko: 나유타와 니힐리스타를 실은 만트라가 황야를 질주하고 있다.
    ja: |-
      マントラがナユタとニヒリスターを乗せ、
      荒野を疾走している
  event_goddessfall1_02_s_86:
    speaker: nihilister
    en: Head in the 3 o'clock direction.
    ko: 여기서 3시 방향이다.
    ja: 3時の方向だ。
  event_goddessfall1_02_s_87:
    speaker: nayuta
    en: Understood.
    ko: 알겠소.
    ja: 分かりました。
  event_goddessfall1_02_s_88:
    speaker: "<Narration>"
    en: Mantra veers in that direction.
    ko: 만트라의 방향이 꺾인다.
    ja: マントラが進路を変えた
  event_goddessfall1_02_s_89:
    speaker: nayuta
    en: It doth appear the beginning is upon us...
    ko: "…시작한 모양이외다."
    ja: "…始まったようですねぇ。"
  event_goddessfall1_02_s_90:
    speaker: nihilister
    en: Probably.
    ko: 그렇겠지.
    ja: みてぇだな。
  event_goddessfall1_02_s_91:
    speaker: nihilister
    en: The sound of battle will keep drawing in more.
    ko: 전투 중 들리는 소음으로 계속 몰려올 거다.
    ja: 戦ってる音でいつまでも集まって来るだろうよ。
  event_goddessfall1_02_s_92:
    speaker: nihilister
    en: That's why you, human imposters, won't ever reclaim the surface.
    ko: 그게, 너희 유사 인간이 지상을 탈환할 수 없는 이유지.
    ja: |-
      ま、お前ら人間もどきが
      地上を取り返せない理由がこれだ。
  event_goddessfall1_02_s_93:
    speaker: nihilister
    en: Your only recourse is defense.
    ko: 방어전 말고는 할 수 있는 일이 없고
    ja: せいぜい防衛して、一時しのぎが出来るだけ。
  event_goddessfall1_02_s_94:
    speaker: nihilister
    en: Since you are finite while we are infinite.
    ko: 너희는 유한하고 우리는 무한하니까.
    ja: 限りがあるお前らと違って、俺たちは底なしだ。
  event_goddessfall1_02_s_95:
    speaker: nayuta
    en: I thank thee for thy words of encouragement.
    ko: 응원의 말씀 감사하외다.
    ja: 熱烈な激励に感謝しておきましょう。
  event_goddessfall1_02_s_96:
    speaker: nayuta
    en: How much further?
    ko: 얼마나 남았소.
    ja: あとどれ程ですか？
  event_goddessfall1_02_s_97:
    speaker: nihilister
    en: At this speed, we will arrive by tomorrow morning.
    ko: 이 속도라면 아침에는 도착할 거다.
    ja: このスピードなら朝には着けるぜ。
  event_goddessfall1_02_s_98:
    speaker: nihilister
    en: This is one hell of a camel.
    ko: 터무니없는 낙타네.
    ja: とんでもねえ脚だ。
  event_goddessfall1_02_s_99:
    speaker: nayuta
    en: Why dost thou seek to dispatch the Queen?
    ko: 퀸은 왜 죽이려고 드는 것이오.
    ja: なぜクイーンを狙うのです？
  event_goddessfall1_02_s_100:
    speaker: nayuta
    en: She is, in essence, thine own mother.
    ko: 사실상 그대들의 어머니이지 않소.
    ja: あなた方にとっては母親のようなものでしょう。
  event_goddessfall1_02_s_101:
    speaker: nihilister
    en: I'm not traveling with you in order to gossip, so just pay attention to the
      road.
    ko: 너랑 수다나 떨려고 같이 가는 게 아니니 운전이나 해.
    ja: |-
      テメーとおしゃべりするために
      行くわけじゃねぇ。制御に集中しとけ。
  event_goddessfall1_02_s_102:
    speaker: nayuta
    en: What difference doth it make? Verily, 'tis better than naught but the sound
      of breath.
    ko: |-
      뭐 어떻소.
      숨소리만 들리는 것보다는 낫지 않겠소.
    ja: |-
      つれないですねぇ。
      互いの息づかいだけを聞いているよりは
      いいでしょう？
  event_goddessfall1_02_s_103:
    speaker: nayuta
    en: Besides.
    ko: 그리고.
    ja: それに…
  event_goddessfall1_02_s_104:
    speaker: nayuta
    en: I find myself still unable to place mine trust in thee, Fire Dragon.
    ko: 소인은 아직 화룡 소저를 신용하지 못하오.
    ja: 私にはまだ、火竜を信用する材料がありません。
  event_goddessfall1_02_s_105:
    speaker: nayuta
    en: I would be deeply grateful for any cause, however small, to place mine trust
      in thee, even were it but mere words.
    ko: 한낱 말뿐이라도, 소인이 화룡 소저를 신용할 여지를 주면 고맙겠소.
    ja: |-
      ほんの一言でも、信用するに足る言葉が
      欲しいものでしてねぇ。
  event_goddessfall1_02_s_106:
    speaker: nihilister
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_s_107:
    speaker: nihilister
    en: Because I don't like her.
    ko: 마음에 안 들어서.
    ja: 気に入らねぇからだ。
  event_goddessfall1_02_s_108:
    speaker: nihilister
    en: I don't like the fact that she gets to be above me just because she's the
      Queen.
    ko: 퀸이라는 이유로, 내 머리 위에 있다는 게 마음에 안 들거든.
    ja: |-
      クイーンだからってだけで、
      俺の頭の上にいやがるのが。
  event_goddessfall1_02_s_109:
    speaker: nihilister
    en: I've never fought with her.
    ko: 나는 그것과 싸워본 적 없어.
    ja: 戦ったことはねぇけどよ…
  event_goddessfall1_02_s_110:
    speaker: nihilister
    en: But I'm sure I'm stronger.
    ko: 분명 내가 더 강해.
    ja: 絶対に俺の方が強い。
  event_goddessfall1_02_s_111:
    speaker: nayuta
    en: There is much room for rebuttal, but I shall refrain. Pray, continue.
    ko: 반론의 여지가 차고 넘치지만 굳이 입 밖으로 꺼내진 않겠소. 계속하시오.
    ja: |-
      口を挟みたくなることばかりですが、
      今は聞くに徹しましょう。続きを。
  event_goddessfall1_02_s_112:
    speaker: nihilister
    en: I despise having to bow my head to someone who's weaker than me,
    ko: 나보다 약한 놈한테, 타고나길 그렇게 타고났다는 이유로.
    ja: |-
      ただ生まれつきクイーンだったってだけだろ？
      そのくせ、俺より弱い奴なんかに…
  event_goddessfall1_02_s_113:
    speaker: nihilister
    en: just because I happened to be born one way, and she another.
    ko: 대가리를 숙여야 하는 게 너무 마음에 안 들어.
    ja: |-
      頭を下げろって言われんのは、
      とにかく気に入らねえ。
  event_goddessfall1_02_s_114:
    speaker: nihilister
    en: That's the reason.
    ko: 그게 이유다.
    ja: そういう理由だ。
  event_goddessfall1_02_s_115:
    speaker: nayuta
    en: Pray tell, why didst thou not endeavor to challenge her?
    ko: 한번 싸움을 걸어보지 그려셨소.
    ja: 戦いを挑んでみようとは思わなかったのですか？
  event_goddessfall1_02_s_116:
    speaker: nihilister
    en: How do I challenge someone who's off in space?
    ko: 우주에 있는 놈한테 무슨 수로 싸움을 걸어.
    ja: |-
      宇宙に引っ込んでるヤツと、
      どうやり合えってんだ？
  event_goddessfall1_02_s_117:
    speaker: nihilister
    en: Anyway...
    ko: "…그리고."
    ja: "…それだけじゃねえ。"
  event_goddessfall1_02_s_118:
    speaker: nihilister
    en: Even if she were right in front of me, I probably wouldn't be able to start
      a fight.
    ko: 아마 눈앞에 있다고 해도 싸움을 걸어보진 못했을 거다.
    ja: |-
      もし目の前にいやがったとしても、
      それはできねえはずだ。
  event_goddessfall1_02_s_119:
    speaker: nayuta
    en: Is it because thou wert thus born...?
    ko: "…그렇게 타고났기 때문이오?"
    ja: "…そのように生まれたから？"
  event_goddessfall1_02_s_120:
    speaker: nihilister
    en: Right. I know even without trying.
    ko: 그래. 안 해봐도 알 수 있어.
    ja: ああ。分かりきったことだろ。
  event_goddessfall1_02_s_121:
    speaker: nihilister
    en: I can't challenge the Queen.
    ko: 나는 퀸에게 싸움을 걸 수 없어.
    ja: 俺はクイーンにケンカを売れねえ。
  event_goddessfall1_02_s_122:
    speaker: nihilister
    en: I'll just blindly follow her orders like a fool.
    ko: 그저 머저리같이 시키는 걸 할 뿐이겠지.
    ja: バカみてーに従わされるだけだ。
  event_goddessfall1_02_s_123:
    speaker: nihilister
    en: That's the power of the Queen's control.
    ko: 퀸의 지배력이라는 건 그런 거다.
    ja: |-
      クイーンの支配力ってのは、
      そういうもんなんだよ。
  event_goddessfall1_02_s_124:
    speaker: nayuta
    en: Ah, thou hast thus veered thy way through such nefarious schemes as poison.
    ko: 아하. 그래서 이렇게 독살 같은 호작질로 방향을 튼 것이구려.
    ja: |-
      なるほど。それゆえ策を巡らせ、
      毒を盛ろうということですか。
  event_goddessfall1_02_s_125:
    speaker: nihilister
    en: Haha, right. I do whatever it takes to win.
    ko: |-
      하하. 그래.
      나는 이기기 위해서는 무슨 짓이든 하거든.
    ja: |-
      へっ。そうさ。
      俺は勝つためなら何だってする。
  event_goddessfall1_02_s_126:
    speaker: nayuta
    en: Yet, thou art truly formidable.
    ko: 허나 대단하외다.
    ja: しかし、見上げたものですねぇ。
  event_goddessfall1_02_s_127:
    speaker: nayuta
    en: The fact that thou hast conceived such a mind, and brought it to execution.
    ko: 그런 마음을 먹었다는 것과, 그걸 실행에 옮겼다는 것은.
    ja: |-
      そのような決心をして、
      実際に行動しているというのは。
  event_goddessfall1_02_s_128:
    speaker: nayuta
    en: Art thou not denying thy born disposition?
    ko: 타고난 기질을 거부하는 것 아니겠소.
    ja: まさに生来の性質を拒むことに等しい。
  event_goddessfall1_02_s_129:
    speaker: nihilister
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_s_130:
    speaker: nayuta
    en: Through such favor, even we may glean the scraps, and for that I find it pleasing.
    ko: 그 덕에 소인들도 콩고물을 받아먹을 수 있고, 좋구려.
    ja: |-
      おかげで私たちもおこぼれに
      預かれるわけですから、
      ありがたい限りですねぇ。
  event_goddessfall1_02_s_131:
    speaker: nihilister
    en: Stop talking so much and steer.
    ko: 시끄러우니까, 운전이나 해.
    ja: うるせえな。黙って前見てろ。
  event_goddessfall1_02_s_132:
    speaker: nayuta
    en: Art thou not curious about mine own tale?
    ko: 소인의 이야기는 안 궁금하오?
    ja: 私の話は気にならないのですか？
  event_goddessfall1_02_s_133:
    speaker: nihilister
    en: No, I'm not. Just focus on steering.
    ko: 안 궁금하니까, 운전이나 하라고.
    ja: 気にならねえから、集中しろって。
event_goddessfall1_02_e:
  event_goddessfall1_02_e_1:
    speaker: nayuta
    en: Is this...
    ko: "…여긴."
    ja: "…ここは…"
  event_goddessfall1_02_e_2:
    speaker: nihilister_m
    en: This is it. I left it here.
    ko: 여기야. 여기에 뒀어.
    ja: ここだ。ここに置いてある。
  event_goddessfall1_02_e_3:
    speaker: nayuta
    en: A civilian camp by the entrance of the Ark?!
    ko: "…방주 입구 인근의 민간 캠프…."
    ja: "…アーク入口間近の民間キャンプ…？"
  event_goddessfall1_02_e_4:
    speaker: nihilister_m
    en: What are you mumbling about? Hurry up and look.
    ko: 뭘 중얼거리고 있는 거야. 빨리 찾아.
    ja: 何ぶつくさ言ってんだ？早く探すぞ。
  event_goddessfall1_02_e_5:
    speaker: nayuta
    en: Where might it be, pray?
    ko: 어디 있는 것이오.
    ja: どこに隠したのです？
  event_goddessfall1_02_e_6:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_7:
    speaker: nihilister_m
    en: I buried it underneath a pile of human imposters' bodies.
    ko: 유사 인간들의 시체 산 아래 파묻었다.
    ja: |-
      人間もどきの残骸の山の下だ…
      あそこに埋めてある。
  event_goddessfall1_02_e_8:
    speaker: nihilister_m
    en: Follow me.
    ko: 따라와라.
    ja: ついて来い。
  event_goddessfall1_02_e_9:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_10:
    speaker: nihilister_m
    en: It's up ahead.
    ko: 이 앞에 가면 있다.
    ja: この先だ。
  event_goddessfall1_02_e_11:
    speaker: "<Narration>"
    en: Nayuta follows behind Nihilister.
    ko: 니힐리스타의 뒤를 나유타가 따른다.
    ja: ナユタがニヒリスターの後を追った
  event_goddessfall1_02_e_12:
    speaker: "<Narration>"
    en: Soon, they arrive at a place,
    ko: 잠시 후, 둘이 도착한 곳은
    ja: しばらくして、2人がたどりついた場所には…
  event_goddessfall1_02_e_13:
    speaker: "<Narration>"
    en: at a place where a mountain formed by Nikke corpses lies.
    ko: 니케의 시체로 만들어진 산이 가득한 장소였다.
    ja: |-
      ニケの残骸の山が
      いくつもそびえたっていた
  event_goddessfall1_02_e_14:
    speaker: nayuta
    en: What... in the name of all that is holy...?
    ko: "…이게… 대체…."
    ja: "…これは…いったい…"
  event_goddessfall1_02_e_15:
    speaker: nihilister_m
    en: What else did you think happened to all the human imposters that were left
      behind after the Ark was sealed?
    ko: "…방주 밀봉 이후 지상에 남아있던 유사 인간들이 어떻게 행동했을 것 같아?"
    ja: |-
      …アークが封鎖された後、
      地上に取り残された人間もどきは
      どうしたと思う？
  event_goddessfall1_02_e_16:
    speaker: nihilister_m
    en: They kept banging on the door to the Ark, hoping that it might open.
    ko: 혹시나 열릴지도 모를 방주의 입구를 두드렸다.
    ja: |-
      もしかしたら開くかもしれないと思って、
      アークの入口を叩き続けたのさ。
  event_goddessfall1_02_e_17:
    speaker: nihilister_m
    en: This is the result of that.
    ko: 그 결과가 이거야.
    ja: その結果がこれだ。
  event_goddessfall1_02_e_18:
    speaker: nihilister_m
    en: The door didn't open, and they all died.
    ko: 문은 열리지 않았고, 다 죽었다.
    ja: 結局扉は開かずに、全員くたばった。
  event_goddessfall1_02_e_19:
    speaker: nayuta
    en: Their cores hath been wholly torn asunder. What is the cause thereof?
    ko: 코어가 모두 뜯겨나갔소. 무슨 연유요.
    ja: |-
      すべてコアが抜かれていますね。
      なぜでしょう。
  event_goddessfall1_02_e_20:
    speaker: nihilister_m
    en: Without a core, the bodies of human imposters are worthless to the Raptures.
    ko: 코어가 없는 유사 인간의 바디는 랩쳐에게 아무런 가치가 없으니까.
    ja: |-
      コアがなきゃ、人間もどきのボディは
      ラプチャーにとって何の価値もねえ。
  event_goddessfall1_02_e_21:
    speaker: nihilister_m
    en: Someone must have done it in hopes they wouldn't be defiled after death.
    ko: |-
      죽은 이후에라도 농락당하지 않았으면 하는 마음에,
      누군가가 그렇게 했겠지.
    ja: |-
      どこかの誰かが、死んだあとぐらい
      ゆっくり休ませてやりてぇと思って
      やったんだろ。
  event_goddessfall1_02_e_22:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_23:
    speaker: nayuta
    en: Was it you, Fire Dragon?
    ko: 화룡 소저.
    ja: あなたですか。
  event_goddessfall1_02_e_24:
    speaker: nihilister_m
    en: Yes. It was.
    ko: 그래. 내가 했다.
    ja: そうだ。俺がやった。
  event_goddessfall1_02_e_25:
    speaker: nayuta
    en: I see thou dost remember the past.
    ko: 기억하는구려. 과거를.
    ja: 忘れていないのですね。過去を。
  event_goddessfall1_02_e_26:
    speaker: nihilister_m
    en: Yes. A pathetic past I would rather erase.
    ko: 지우고 싶은 약해빠진 과거지만 말이지.
    ja: |-
      ショボかった昔のことなんて、
      消してえぐらいだけどな。
  event_goddessfall1_02_e_27:
    speaker: nihilister_m
    en: Lilith's body is underneath all this.
    ko: 릴리스의 바디는 이 밑에 있다.
    ja: リリスのボディはこの下にある。
  event_goddessfall1_02_e_28:
    speaker: nihilister_m
    en: Find it.
    ko: 찾아.
    ja: 探しな。
  event_goddessfall1_02_e_29:
    speaker: nayuta
    en: Wouldst thou not lend a hand...?
    ko: "…좀 거들어주지 그러오."
    ja: "…少しは手伝ってください。"
  event_goddessfall1_02_e_30:
    speaker: nihilister_m
    en: I'm not in the mood.
    ko: 그럴 기분 아니야.
    ja: そんな気分じゃねえ。
  event_goddessfall1_02_e_31:
    speaker: nihilister_m
    en: Besides, you all turned me into a living corpse, I have no strength left to
      spare.
    ko: 그리고 네놈들이 날 산송장으로 만들어놔서 힘도 없어.
    ja: |-
      だいたい、お前らのせいで
      力が出せねえんだろうが。
  event_goddessfall1_02_e_32:
    speaker: nayuta
    en: There are far too many bodies, methinks.
    ko: 너무 많지 않소.
    ja: 一人ではキリがありませんねぇ。
  event_goddessfall1_02_e_33:
    speaker: nihilister_m
    en: Not my problem. Go figure it out.
    ko: 몰라. 알아서 해.
    ja: 知るかよ。勝手にしな。
  event_goddessfall1_02_e_34:
    speaker: nayuta
    en: "*Sigh* I am not well-versed in the labor of the body."
    ko: 하아… 몸을 쓰는 건 자신 없소만.
    ja: はぁ…力仕事は私の領分ではないというのに…
  event_goddessfall1_02_e_35:
    speaker: "<Narration>"
    en: Nayuta walks toward the mountain of corpses and extracts a Nikke from beneath.
    ko: |-
      나유타는 시체의 산을 향해 걸어간 후,
      아래에 깔려있는 니케를 끄집어냈다.
    ja: |-
      ナユタは残骸の山に近づき、
      ニケを引っぱり出した
  event_goddessfall1_02_e_36:
    speaker: nihilister_m
    en: Just yank them out. Why are you handling them like holy relics?
    ko: 팍팍 끄집어내. 뭘 신줏단지 모시듯 그러냐.
    ja: |-
      もっと力入れろよ。
      別に大事なモノでもねぇんだ。
  event_goddessfall1_02_e_37:
    speaker: nayuta
    en: "'Tis no easy feat. I wish not to wound nor break them."
    ko: 쉽지 않소. 부수거나 상처를 입히고 싶지 않으니.
    ja: |-
      そうもいきません。
      壊したり傷をつけたりはしたくないのです。
  event_goddessfall1_02_e_38:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_39:
    speaker: "<Narration>"
    en: Nayuta lays the body she extracted to the side with great care.
    ko: |-
      나유타는 조심스럽게 시체를 꺼낸 후,
      옆에 반듯하게 눕혔다.
    ja: |-
      ナユタは慎重に亡骸を取り出し、
      自分のそばに寝かせた
  event_goddessfall1_02_e_40:
    speaker: "<Narration>"
    en: Then she presses her hands together in a short prayer before heading back
      toward the mountain of bodies.
    ko: |-
      그리고 짧은 합장으로 명복을 빌어준 뒤
      다시 시체의 산으로 향했다.
    ja: |-
      それから短く手を合わせた後、
      次のニケを引き抜き始めた
  event_goddessfall1_02_e_41:
    speaker: nihilister_m
    en: We're gonna be here all day.
    ko: 날 새겠군.
    ja: 当分かかりそうだな。
  event_goddessfall1_02_e_42:
    speaker: nayuta
    en: Be silent.
    ko: 조용히 하시오.
    ja: 静粛に。
  event_goddessfall1_02_e_43:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_44:
    speaker: nihilister_m
    en: Tsk.
    ko: 쯧.
    ja: チッ。
  event_goddessfall1_02_e_45:
    speaker: "<Narration>"
    en: Nihilister walks over to Nayuta.
    ko: 니힐리스타가 나유타에게 다가간다.
    ja: ニヒリスターがナユタに近づいた
  event_goddessfall1_02_e_46:
    speaker: nihilister_m
    en: Grab that.
    ko: 거기 잡아.
    ja: そっちを持て。
  event_goddessfall1_02_e_47:
    speaker: nayuta
    en: "... I thank thee."
    ko: "…고맙소."
    ja: "…助かります。"
  event_goddessfall1_02_e_48:
    speaker: "<Narration>"
    en: Several bodies lay neatly next to Nayuta and Nihilister.
    ko: 나유타와 니힐리스타의 옆에 반듯이 눕힌 시체들이 나열되었다.
    ja: |-
      ナユタとニヒリスターの脇に、
      寝かされたニケの亡骸が並び始めて
      しばらく後…
  event_goddessfall1_02_e_49:
    speaker: nayuta
    en: How didst thou come by Lilith's body?
    ko: |-
      어디에서 손에 넣은 것이오.
      릴리스의 바디는.
    ja: |-
      どこで手に入れたのですか？
      リリスのボディは。
  event_goddessfall1_02_e_50:
    speaker: nihilister_m
    en: Far up north. It was trapped in a glacier.
    ko: 북부 아래다. 빙하에 갇혀있었어.
    ja: 北の氷河の中深くで眠ってた。
  event_goddessfall1_02_e_51:
    speaker: nihilister_m
    en: It took some effort to locate.
    ko: 찾는다고 고생 좀 했지.
    ja: 探すのには苦労したぜ。
  event_goddessfall1_02_e_52:
    speaker: nayuta
    en: "... Was it Gene Reaper, perchance, who sent forth Lilith's head to the Queen?"
    ko: "…릴리스의 머리를 퀸에게 올려보낸 건 인자 살해자 소저가 맞소?"
    ja: |-
      …リリスの頭部をクイーンに捧げたのは、
      因子を刈る彼女で間違いありませんね？
  event_goddessfall1_02_e_53:
    speaker: nihilister_m
    en: Yes. It was the Great Mother's wish.
    ko: 그래. 위대하신 어머니의 바램이었으니까.
    ja: |-
      ああ。何しろ偉大なるオカアサマの
      願いだからな。
  event_goddessfall1_02_e_54:
    speaker: nayuta
    en: Had it not been for that, the Queen would have perished ages past.
    ko: 그 일만 아니었으면 일찌감치 퀸은 죽었을 것이오.
    ja: |-
      それさえなければ、クイーンは
      とうの昔に滅びていたでしょうねえ。
  event_goddessfall1_02_e_55:
    speaker: nihilister_m
    en: Yeah. Since her brain was already dying.
    ko: 맞아. 뇌가 죽어가고 있었으니까.
    ja: だろうな。脳が死にかけてたんだ。
  event_goddessfall1_02_e_56:
    speaker: nihilister_m
    en: For some reason, the station the Queen was in detached from the orbital elevator.
    ko: 어째서인지는 모르겠지만 퀸이 머물고 있던 스테이션이 궤도 엘리베이터에서 분리되고.
    ja: |-
      なんでかは知らねえけど、
      クイーンのいる宇宙ステーションが
      軌道エレベーターから切り離された。
  event_goddessfall1_02_e_57:
    speaker: nihilister_m
    en: The Queen and the station drifted through space together.
    ko: 퀸은 스테이션과 함께 우주 공간을 떠돌았지.
    ja: |-
      それからずっと、クイーンはステーションごと
      宇宙を漂ってんのさ。
  event_goddessfall1_02_e_58:
    speaker: nihilister_m
    en: By then, her brain was already failing.
    ko: 그때, 이미 퀸은 뇌가 맛이 가고 있었어.
    ja: そん時にゃ、もうクイーンの脳は壊れかけてた。
  event_goddessfall1_02_e_59:
    speaker: nihilister_m
    en: Haha. How badly must she have wanted to live to say, "Hey, send up a head,"
      all the way into space.
    ko: 하하. 얼마나 살고 싶었으면 우주에서 [머리 좀 올려보내 줘~] 라고 했겠어?
    ja: |-
      ヘッ、宇宙から「頭を送ってくれ～」なんて、
      どれだけ必死だったんだろうな？
  event_goddessfall1_02_e_60:
    speaker: nihilister_m
    en: And even in that state, she only wanted the finest human imposter. How greedy
      our Great Mother is, huh?
    ko: |-
      그런 주제에 최고급 유사 인간을 원하다니,
      위대하신 어머니는 욕심도 참 많으셔. 응?
    ja: |-
      そのくせ、最高級の人間もどきがいいと来た。
      大したワガママなお母様だ、なぁ？
  event_goddessfall1_02_e_61:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_62:
    speaker: nihilister_m
    en: Liberalio cut off Lilith's head and sent it to the Queen.
    ko: 리버렐리오는 릴리스의 머리를 잘라, 퀸에게 쏘아 보냈다.
    ja: |-
      リバーレリオはリリスの頭を切って、
      クイーンに向けて打ち上げた。
  event_goddessfall1_02_e_63:
    speaker: nihilister_m
    en: But then guess what? Later, she even wanted the body.
    ko: 그런데 웬걸, 나중에는 바디까지 원했지.
    ja: |-
      そしたら今度は、
      急にボディも欲しいとかぬかし始めた。
  event_goddessfall1_02_e_64:
    speaker: nihilister_m
    en: She kept repeating it ad nauseam, "Find Lilith's body. Find Lilith's body."
    ko: 릴리스의 바디를 찾아라. 릴리스의 바디를 찾아라. 노래를 불렀어.
    ja: |-
      リリスのボディを探せ、探せって、
      ひたすらそればっかりだ。
  event_goddessfall1_02_e_65:
    speaker: nihilister_m
    en: Liberalio scrambled to look for it, but failed.
    ko: 허둥지둥 릴리스의 바디를 찾으러 간 리버렐리오는 허탕을 친 거야.
    ja: |-
      あわてて取りに帰ったリバーレリオは、
      ひっくり返った。
  event_goddessfall1_02_e_66:
    speaker: nihilister_m
    en: It wasn't where it was originally.
    ko: 원래 있던 곳에 없었거든.
    ja: あるはずの場所から消えてたからな。
  event_goddessfall1_02_e_67:
    speaker: nihilister_m
    en: I don't know what intentions they had, but someone went far up north to hide
      Lilith's body.
    ko: 누가 어떤 의도로 그 먼 북부까지 가서 릴리스의 바디를 숨겼는지는 모르지만.
    ja: |-
      誰が何のために北の果てまで行って
      わざわざボディを隠したのかは
      想像もつかねぇが…
  event_goddessfall1_02_e_68:
    speaker: nihilister_m
    en: Now that I think about it, that was probably for the best.
    ko: 지금 와서는 참 잘된 일이지.
    ja: こっちにとっちゃ、いい方に転がったな。
  event_goddessfall1_02_e_69:
    speaker: nayuta
    en: By what means didst thou come upon the remains of Lilith, Fire Dragon?
    ko: 화룡 소저는 어떻게 릴리스의 바디를 찾을 수 있었소.
    ja: どうやって見つけだしたのですか？
  event_goddessfall1_02_e_70:
    speaker: nihilister_m
    en: Not sure. Just a gut feeling?
    ko: 글쎄. 감?
    ja: さあな。カンってヤツか？
  event_goddessfall1_02_e_71:
    speaker: nayuta
    en: Thou surely hast a conspirator amongst thy ranks. A fellow Heretic yearning
      for the Queen's downfall.
    ko: "…협력자가 있겠군. 퀸의 멸망을 바라는 다른 헬레틱이."
    ja: |-
      …他にもいるのですね。
      クイーンの滅びを望むヘレティックが。
  event_goddessfall1_02_e_72:
    speaker: nihilister_m
    en: Haha, you're free to think that.
    ko: 하하. 마음껏 상상해 봐.
    ja: ハハッ。勝手に想像してやがれ。
  event_goddessfall1_02_e_73:
    speaker: nihilister_m
    en: Anyway, Liberalio was frantic.
    ko: 아무튼 리버렐리오는 아주 안달이 났어.
    ja: とにかく、リバーレリオは大あわてさ。
  event_goddessfall1_02_e_74:
    speaker: nihilister_m
    en: She scoured everywhere for Lilith's body.
    ko: 릴리스의 바디를 찾기 위해 온갖 곳을 헤집고 다녔지.
    ja: |-
      リリスのボディを探して、
      あちこちうろつき回ってた。
  event_goddessfall1_02_e_75:
    speaker: nihilister_m
    en: But in the midst of that, the Queen's voice suddenly went quiet.
    ko: 그러던 중, 갑자기 퀸의 목소리가 들리지 않게 된 거야.
    ja: |-
      そんな時に、いきなりクイーンの声が
      聞こえなくなった。
  event_goddessfall1_02_e_76:
    speaker: nihilister_m
    en: Because of what you guys called the "veil".
    ko: 너희가 [장막]이라 부르는 그거 때문이다.
    ja: お前らが「膜」って呼んでたもののせいだな。
  event_goddessfall1_02_e_77:
    speaker: nihilister_m
    en: After that...
    ko: 그 이후 우리는….
    ja: それからの俺たちは…
  event_goddessfall1_02_e_78:
    speaker: nihilister_m
    en: We've been wandering the surface, abandoned.
    ko: 버려진 채 지상을 떠돌았지.
    ja: 置き去りにされて、地上を彷徨ってるんだ。
  event_goddessfall1_02_e_79:
    speaker: nayuta
    en: For one of thy plight, thou has been exceedingly rambunctious.
    ko: 그런 것 치곤 아주 날뛰고 다니지 않았소.
    ja: |-
      それにしては、ずいぶん
      好き放題に暴れているようですがねえ。
  event_goddessfall1_02_e_80:
    speaker: nihilister_m
    en: What can you expect from children who've lost their mother?
    ko: 어머니가 부재중인 아이들이니, 어쩔 수 없지 않겠어?
    ja: |-
      母親に見張られてねえガキなんざ、
      そんなもんだろ？
  event_goddessfall1_02_e_81:
    speaker: nayuta
    en: I "remember" the Gene Reaper's goal was to set things in proper order before
      the Queen descends.
    ko: "…인자 살해자 소저의 목적은 퀸이 내려오기 전에 정리를 하는 것이라 [기억]하오."
    ja: |-
      …彼女は、クイーンが降りてくる前に
      片づけをすると言っていたという
      「記憶」があります。
  event_goddessfall1_02_e_82:
    speaker: nayuta
    en: Dost thou know what this doth mean?
    ko: 이게 무슨 의미인지 아시오?
    ja: どういう意味かは見当がつきますか？
  event_goddessfall1_02_e_83:
    speaker: nihilister_m
    en: It's simple.
    ko: 간단해.
    ja: 簡単だ。
  event_goddessfall1_02_e_84:
    speaker: nihilister_m
    en: She was paving the way for the return of her beloved mother, whom she had
      not been able to see.
    ko: 너무나 사랑했지만 지금까지 볼 수 없었던 어머니가 집으로 돌아올 수 있는 길을 닦아놨어.
    ja: |-
      大好きだけど長い間会えなかった母親が、
      帰って来るっていうんだ。
  event_goddessfall1_02_e_85:
    speaker: nihilister_m
    en: If her mother returns to find the house a mess, she'd be mighty upset.
    ko: |-
      그 어머니가 집으로 돌아왔을 때,
      집이 엉망이면 어머니의 기분이 얼마나 나쁘겠어?
    ja: |-
      その時に家がめちゃくちゃだったら
      お母様が悲しい気分になっちまう、だろ？
  event_goddessfall1_02_e_86:
    speaker: nihilister_m
    en: She was obsessed with getting everything in order to welcome Mother.
    ko: 깨끗하게 만들어놓고 어머니를 맞이하고 싶은 거야. 그놈은.
    ja: |-
      だから、お家をきれ～にお片付けしてから、
      お迎えしたいってことさ。
  event_goddessfall1_02_e_87:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_88:
    speaker: nihilister_m
    en: In other words, she's crazy.
    ko: 미친놈이라는 얘기다.
    ja: 要するに、イカれてるんだ。
  event_goddessfall1_02_e_89:
    speaker: nayuta
    en: I do agree.
    ko: 동의하외다.
    ja: 意見が合いますねぇ。
  event_goddessfall1_02_e_90:
    speaker: nihilister_m
    en: Here. It's right here.
    ko: 여기다. 여기 있어.
    ja: あった。こいつだ。
  event_goddessfall1_02_e_91:
    speaker: "<Narration>"
    en: Amid the corpses, an old stone coffin can be seen.
    ko: 시체들 사이, 낡은 석관이 보였다.
    ja: 亡骸の山の間から、古い石棺がのぞいた
  event_goddessfall1_02_e_92:
    speaker: "<Narration>"
    en: Nayuta slowly approaches and carefully opens the lid.
    ko: 나유타는 천천히 걸어가 조심스럽게 석관의 뚜껑을 열었다.
    ja: |-
      ナユタはゆっくりと近づき、
      慎重にふたを開いた
  event_goddessfall1_02_e_93:
    speaker: "<Narration>"
    en: Inside lies a fragile body in a white dress.
    ko: 하얀색 옷을 입고 누워있는 가냘픈 몸.
    ja: 白い服、横たわる細身の体
  event_goddessfall1_02_e_94:
    speaker: "<Narration>"
    en: Her hands are neatly gathered together.
    ko: 가지런히 모아져 있는 손.
    ja: きれいに重ねられた手
  event_goddessfall1_02_e_95:
    speaker: "<Narration>"
    en: The flowers that once filled the coffin, crumbled even at the slightest breeze.
    ko: 관을 가득 채우고 있었을 것이 분명한 꽃들은 작은 바람에도 바스러졌다.
    ja: |-
      かつて棺を埋め尽くしていたであろう
      花の残骸が、わずかな風に吹かれて崩れた
  event_goddessfall1_02_e_96:
    speaker: "<Narration>"
    en: The headless goddess.
    ko: 머리 없는 여신.
    ja: 頭のない女神
  event_goddessfall1_02_e_97:
    speaker: "<Narration>"
    en: Liliweiss' body lay there.
    ko: 릴리바이스의 몸은 그곳에 있었다.
    ja: リリーバイスの身体だ
  event_goddessfall1_02_e_98:
    speaker: nayuta
    en: Lili...weiss...
    ko: 릴리… 바이스….
    ja: リリー…バイス…
  event_goddessfall1_02_e_99:
    speaker: nayuta
    en: Lili...weiss...
    ko: 우리의… 승리의… 여신…!
    ja: 我々の…勝利の女神…！
  event_goddessfall1_02_e_100:
    speaker: nayuta
    en: "*Sob... sob...*"
    ko: 윽…! 으흑…!
    ja: うっ…！ううっ…！
  event_goddessfall1_02_e_101:
    speaker: nihilister_m
    en: Why are you crying and making a scene?
    ko: 질질 짜고 난리야.
    ja: 何で泣いてんだよ。
  event_goddessfall1_02_e_102:
    speaker: nayuta
    en: F-forgive me. Wouldst thou lend me thy assistance in extricating her?
    ko: 미, 미안하오. 꺼내는 걸 도와주시겠소?
    ja: |-
      これは失礼…取り出すのを
      手伝っていただけますか？
  event_goddessfall1_02_e_103:
    speaker: nayuta
    en: I desire to treat her with the utmost gentleness possible.
    ko: 최대한, 소중히 다루고 싶소.
    ja: できるだけ、丁寧に扱いたいのです。
  event_goddessfall1_02_e_104:
    speaker: nihilister_m
    en: All right. Let's do it this way then.
    ko: 이렇게 하면 되겠군.
    ja: そんなもん、これでいいだろ。
  event_goddessfall1_02_e_105:
    speaker: "<Narration>"
    en: Nihilister leans down and scoops up Liliweiss' body.
    ko: 니힐리스타가 허리를 숙여 릴리바이스의 몸을 끌어안는다.
    ja: |-
      ニヒリスターが腰を落とし、
      リリーバイスの身体をかつぎ上げ…
  event_goddessfall1_02_e_106:
    speaker: "<Narration>"
    en: Just like that, she lifts Liliweiss' body.
    ko: 그리고 그대로 몸을 일으켰다.
    ja: 勢いよく立ち上がった
  event_goddessfall1_02_e_107:
    speaker: "<Narration>"
    en: Liliweiss' body hangs limp.
    ko: 릴리바이스의 몸이 힘없이 흔들린다.
    ja: リリーバイスの体が弱々しく揺れ、垂れ下がる
  event_goddessfall1_02_e_108:
    speaker: nayuta
    en: Thou dost not understand the meaning of treating her with care...
    ko: "…소중히 다룬다는 말의 의미를 모르시는구려."
    ja: "…丁寧に扱うという言葉の意味はご存じで？"
  event_goddessfall1_02_e_109:
    speaker: nihilister_m
    en: Of course I do.
    ko: 잘~ 알지.
    ja: よ～く分かってるさ。
  event_goddessfall1_02_e_110:
    speaker: "<Narration>"
    en: "*Crack! Craack!*"
    ko: 우득! 우드득!
    ja: バキッ！メリメリッ！
  event_goddessfall1_02_e_111:
    speaker: "<Narration>"
    en: Liliweiss' body disappears as though it were being absorbed into Nihilister.
    ko: 릴리바이스의 몸이 니힐리스타의 몸으로 빨려 들어가듯 사라졌다.
    ja: |-
      リリーバイスの体が、
      ニヒリスターの体へ吸い込まれるように消えた
  event_goddessfall1_02_e_112:
    speaker: "<Narration>"
    en: "*Thuuud*"
    ko: 드드드드득-!!
    ja: ミシミシミシッ――！！
  event_goddessfall1_02_e_113:
    speaker: nayuta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_02_e_114:
    speaker: nihilister_m
    en: "*Sigh* Finally."
    ko: 하아…! 됐다.
    ja: ふぅ…！これでヨシっと。
  event_goddessfall1_02_e_115:
    speaker: nayuta
    en: Thou scoundrel!
    ko: 네 이놈-!!
    ja: き、貴様…！！
  event_goddessfall1_02_e_116:
    speaker: nihilister_m
    en: Woah, don't get so worked up.
    ko: 아아. 너무 흥분하지 마.
    ja: おいおい、そんな興奮すんなって。
  event_goddessfall1_02_e_117:
    speaker: nihilister_m
    en: I didn't actually absorb her. I'm just storing her inside my body.
    ko: |-
      흡수한 거 아니야.
      말 그대로 몸 안에 보관만 하고 있을 뿐이라고.
    ja: |-
      吸収したわけじゃねえ。
      体ん中に入れてあるだけだぜ。
  event_goddessfall1_02_e_118:
    speaker: nihilister_m
    en: Well... She might be a little beaten up once I spit her out, but at least
      she's safe, right? There's no risk of losing her too.
    ko: |-
      뭐… 뱉어냈을 때 조금 부서져 있긴 하겠지만 안전하잖아?
      분실 위험도 없고.
    ja: |-
      ま…吐き出す時にちょっと壊れるかも
      しんねえけど？落とす危険もねえし安全だろ？
  event_goddessfall1_02_e_119:
    speaker: nihilister_m
    en: Like you said, we need to treat her with "utmost" care, don't we?
    ko: 네 말대로 [소중히] 다뤄야 하니까. 안 그래?
    ja: |-
      お前の言った通り、「丁寧に」扱わないと…
      なあ？
  event_goddessfall1_02_e_120:
    speaker: nayuta
    en: I'll end thy life this instant, thou vile fiend!
    ko: 당장에 명줄을 끊어버리겠다! 이 외도 놈!
    ja: この場で命を絶ってやろう！外道め！
  event_goddessfall1_02_e_121:
    speaker: nihilister_m
    en: If I die, then Lilith's body will turn to dust.
    ko: 내가 죽으면 릴리스의 바디도 가루가 될 뿐이야.
    ja: |-
      俺が死ねば、リリスのボディも
      木っ端みじんだぜ。
  event_goddessfall1_02_e_122:
    speaker: nihilister_m
    en: Are you sure that's what you want?
    ko: 그래도 괜찮겠어?
    ja: それでいいのか？
  event_goddessfall1_02_e_123:
    speaker: nayuta
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall1_02_e_124:
    speaker: nihilister_m
    en: I have to make sure I come out of this alive, don't I?
    ko: 나도 살아야지. 안 그래?
    ja: 俺だって生きなきゃなんねぇからさ。なぁ？
  event_goddessfall1_02_e_125:
    speaker: nihilister_m
    en: If I simply gave you Lilith's body, I'll only be a liability to you.
    ko: 릴리스의 바디를 넘겨주면, 나는 너희 입장에서는 불안 요소일 뿐이잖아.
    ja: |-
      リリスのボディを渡しちまったら、
      俺はただの不安要素だ。
  event_goddessfall1_02_e_126:
    speaker: nihilister_m
    en: There's nothing guaranteeing that I'd be kept safe from harm.
    ko: 내가 무사할 것이라는 보장이 없다고.
    ja: このまま生かされる保証がねえ。
  event_goddessfall1_02_e_127:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_128:
    speaker: nihilister_m
    en: Just think of this in simpler terms. The transport vessel has changed, that's
      all.
    ko: |-
      운반 케이스가 달라진 것뿐이야.
      간단하게 생각하라고.
    ja: |-
      運搬ケースが変わっただけだ。
      難しく考えんなよ。
  event_goddessfall1_02_e_129:
    speaker: nihilister_m
    en: Our little "truce" is still in effect. Nothing has changed.
    ko: 아직 우리 [협력]은 유효해. 아무것도 바뀌지 않았어.
    ja: |-
      まだ「協力関係」は有効だ。
      何も変わっちゃいねえ。
  event_goddessfall1_02_e_130:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_02_e_131:
    speaker: nayuta
    en: "*Sigh*"
    ko: "…후우."
    ja: "…ふぅーっ…"
  event_goddessfall1_02_e_132:
    speaker: nayuta
    en: Very well. Let's return to Eden.
    ko: 좋소. 에덴으로 돌아가겠소.
    ja: エデンへ。急ぎましょう。
  event_goddessfall1_02_e_133:
    speaker: nihilister_m
    en: There, that's better. You see, calming down helps you think straight.
    ko: 그래그래. 흥분을 가라앉히니 상황 파악이 냉정하게 되지?
    ja: |-
      そうそう。落ち着いてた方が
      正しい判断ができるってヤツだ。
  event_goddessfall1_02_e_134:
    speaker: nayuta
    en: Please...!
    ko: 제발…!
    ja: 後生です…
  event_goddessfall1_02_e_135:
    speaker: nayuta
    en: Do be silent...!
    ko: 좀 닥치시오…!
    ja: 黙っていてください…！
  event_goddessfall1_02_e_136:
    speaker: nihilister_m
    en: Haha, a while ago, you were all about small talk. Now you want me to shut
      up?
    ko: 하하. 그렇게나 말 시키더니만 이젠 닥치라 하네.
    ja: |-
      ハハッ…あれだけしゃべりたがってたくせに
      今度は黙れってか。
event_goddessfall1_03_s:
  event_goddessfall1_03_s_1:
    speaker: "<Narration>"
    en: A few days prior, in the Crown Kingdom.
    ko: 며칠 전, 크라운 왕국.
    ja: 数日前、クラウン王国
  event_goddessfall1_03_s_2:
    speaker: chime
    en: Y-Your Highness! Your Highneeesss!!
    ko: 아, 아가씨-! 아가씨이이이--!!
    ja: お、お嬢さま！！お嬢さまぁ！！
  event_goddessfall1_03_s_3:
    speaker: crown
    en: What is the matter, Chime?
    ko: 무슨 일이신가요. 차임.
    ja: 何事です、チャイム。
  event_goddessfall1_03_s_4:
    speaker: chime
    en: "'Tis a calamity! A veritable calamity!"
    ko: 크, 큰일! 큰일 났습니다요-!
    ja: た、大変！大変でございます！
  event_goddessfall1_03_s_5:
    speaker: crown
    en: Calamity...?
    ko: "…큰일?"
    ja: "…大変？"
  event_goddessfall1_03_s_6:
    speaker: crown
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_7:
    speaker: crown
    en: Don't tell me we're having spikes for dinner again...?
    ko: "…설마 오늘 저녁 메뉴가 스파이크 코스인가요…?"
    ja: |-
      …まさか、夕食のメニューが
      スパイクのフルコースなのですか…？
  event_goddessfall1_03_s_8:
    speaker: kilo
    en: Eek! Another s-spider course?!
    ko: 히, 히이--!! 스, 스파이더 코스라고요-!?
    ja: ひっ…！！ス、スパイダーですか！？
  event_goddessfall1_03_s_9:
    speaker: kilo
    en: Save me, T.A.L.O.S.!
    ko: 타, 탈로스! 도와줘!
    ja: タロス！助けて！
  event_goddessfall1_03_s_10:
    speaker: talos
    en: |-
      Loading response to avoid the spider course.
      Options have been recently updated from 7 to 12.
    ko: |-
      스파이더 코스 회피용 답변 로드 중.
      최근 7종에서 12종으로 업데이트되었습니다.
    ja: |-
      緊急回避用の回答をロード中。
      7種類から12種類にアップデートされました。
  event_goddessfall1_03_s_11:
    speaker: kilo
    en: Er... wh-which number did I choose last time?
    ko: 저, 저번에 몇 번으로 대답했더라?
    ja: こ、この間は何番で答えたっけ？
  event_goddessfall1_03_s_12:
    speaker: talos
    en: Crown chose 2, Chime chose 5, and Kilo chose 2.
    ko: 크라운이 2번, 차임이 5번, 킬로가 2번이었습니다.
    ja: |-
      クラウンが2番、チャイムが5番、
      キロが2番です。
  event_goddessfall1_03_s_13:
    speaker: talos
    en: Due to Crown and Kilo choosing the same number, we failed to avoid the spider
      course.
    ko: |-
      크라운과 킬로가 같은 답변을 한 탓에,
      스파이더 코스를 회피하지 못했습니다.
    ja: |-
      クラウンとキロの回答が重複したため、
      回避に失敗しました。
  event_goddessfall1_03_s_14:
    speaker: kilo
    en: O-οkay...  this time, I'll pick a good number!
    ko: 조, 좋아. 이번에는 잘 정해서…!
    ja: よ、よし。今度はちゃんと作戦を…！
  event_goddessfall1_03_s_15:
    speaker: crown
    en: I'm gonna go with 2.
    ko: 그럼 저는 2번으로 하겠습니다.
    ja: では、私は2番にします。
  event_goddessfall1_03_s_16:
    speaker: kilo
    en: That's the same exact number you chose last time!
    ko: 저번이랑 똑같잖아요!
    ja: この間と同じじゃないですか！
  event_goddessfall1_03_s_17:
    speaker: crown
    en: Er...  hehe! You're as sharp as always, Kilo. Your memory is so good, it's
      most reassuring.
    ko: |-
      호, 호호! 역시 킬로는 명석하군요.
      기억력이 좋아 아주 든든하답니다.
    ja: |-
      お、おほほほ！やはりキロは賢いですわね。
      記憶力のよさが頼もしいですわ。
  event_goddessfall1_03_s_18:
    speaker: chime
    en: That be not the calamity I speak of, Your Highness!
    ko: 그 큰일이 아닙니다요 아가씨!
    ja: そんなことではございません、お嬢さま！
  event_goddessfall1_03_s_19:
    speaker: kilo
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_20:
    speaker: kilo
    en: Are you saying... there's a new menu...?
    ko: 설마… 신메뉴가…?
    ja: まさか…新メニュー…？
  event_goddessfall1_03_s_21:
    speaker: chime
    en: Marian has vanished to whither unknown!
    ko: 마리안이 어디론가 사라졌습니다요!
    ja: マリアンがいずこかへ向かったのでございます！
  event_goddessfall1_03_s_22:
    speaker: crown
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_23:
    speaker: crown
    en: W-Whither Unknown sounds like a great place.
    ko: 어, 어디론가는 좋은 곳이죠.
    ja: |-
      ええ…イズコカとは、
      素敵な場所なのでしょうね。
  event_goddessfall1_03_s_24:
    speaker: chime
    en: Your Highness! Whither unknown is a place I know not of.
    ko: 아가씨. 어디론가는 어디인지 모르는 장소라는 뜻입니다요.
    ja: |-
      お嬢さま…いずこかとは、
      どこか分からないという意味でございます。
  event_goddessfall1_03_s_25:
    speaker: crown
    en: You've even memorized the name of every place. You truly are impressive, Chime.
    ko: 모든 지명을 다 외우고 있다니 역시 대단하군요, 차임.
    ja: |-
      そのような場所を知っているとは、
      さすがですわね、チャイム。
  event_goddessfall1_03_s_26:
    speaker: kilo
    en: Uh...  Maybe she's gone for another long walk?
    ko: 어… 이번에도 멀리 산책 가신 것 아닌가요?
    ja: |-
      ええと…今回も遠くまで
      お散歩に行ったんじゃないですか？
  event_goddessfall1_03_s_27:
    speaker: kilo
    en: She's been doing that rather often lately.
    ko: 요즘 좀 잦던데.
    ja: 最近よくそうしてるみたいですけど…
  event_goddessfall1_03_s_28:
    speaker: chime
    en: She usually apprises us of her jaunts, but not a word was uttered this time.
    ko: |-
      산책을 나가더라도 얘기는 하고 가는 녀석인데,
      이번엔 그런 것도 없습니다요.
    ja: |-
      それなら声を掛けてから出るはずなのに、
      今回は何も言われていないのだ。
  event_goddessfall1_03_s_29:
    speaker: chime
    en: She has been absent since the morn and remains unseen to this hour.
    ko: 아침부터 보이질 않더니 지금까지 계속 안 보입니다요.
    ja: |-
      朝から姿を見ないと思ったら…
      帰ってきてもいないようなのだ。
  event_goddessfall1_03_s_30:
    speaker: kilo
    en: T.A.L.O.S...
    ko: "…탈로스."
    ja: "…タロス。"
  event_goddessfall1_03_s_31:
    speaker: talos
    en: Roger. I'll go outside the walls and scan the area.
    ko: 예. 성벽 밖으로 나가 스캔해 보겠습니다.
    ja: はい。城壁の外でスキャンを実行します。
  event_goddessfall1_03_s_32:
    speaker: talos
    en: Let's go, Kilo.
    ko: 가시죠. 킬로.
    ja: 行きましょう。キロ。
  event_goddessfall1_03_s_33:
    speaker: kilo
    en: Okay, let's.
    ko: 응. 가자.
    ja: うん。行こう。
  event_goddessfall1_03_s_34:
    speaker: crown
    en: Wait a moment.
    ko: 잠깐만요.
    ja: 待つのです。
  event_goddessfall1_03_s_35:
    speaker: crown
    en: Chime... have you noticed anything strange about Marian recently?
    ko: "…차임. 최근 마리안에게서 특이한 점은 보이지 않았나요?"
    ja: |-
      …チャイム。最近マリアンに変わったことは
      ありませんでしたか？
  event_goddessfall1_03_s_36:
    speaker: chime
    en: By strange... doth thou mean...
    ko: 특이한… 점이라면….
    ja: 変わったこと…といいますと…
  event_goddessfall1_03_s_37:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_38:
    speaker: chime
    en: Not moons hence, did a great light shoot down from a most distant place.
    ko: 얼마 전, 어어어엄청 먼 곳에서 빛이 솟아오른 적이 있습니다요.
    ja: |-
      先日、かなり遠くの方で、
      何かが光っておりました。
  event_goddessfall1_03_s_39:
    speaker: chime
    en: The look in Marian's eyes when she gazed upon it was most unusual.
    ko: 그걸 보는 마리안의 눈빛이 심상치 않았습죠.
    ja: |-
      それを見ていたマリアンの目が、
      普通では無かったような…
  event_goddessfall1_03_s_40:
    speaker: chime
    en: Then she spoke of strange matters. About going hither or taking yonder. Words
      whose meaning I knew not.
    ko: 그리고 뭐 가봐야 한다느니, 빼앗아야 한다느니 이런 영문 모를 말들을 했습니다요.
    ja: |-
      あとは、行かないと、とか、奪い取るとか…
      よく分からないことをつぶやいておりました…
  event_goddessfall1_03_s_41:
    speaker: chime
    en: Uh...  And that she didst love me...
    ko: 그… 사랑한다고도….
    ja: それから…あ、愛していると…
  event_goddessfall1_03_s_42:
    speaker: kilo
    en: Now that you mention it, she told T.A.L.O.S. and me that she loved us yesterday.
    ko: 그러고 보니 저랑 탈로스한테도 어제 사랑한다고….
    ja: それ、私とタロスも昨日、言われたよね…
  event_goddessfall1_03_s_43:
    speaker: talos
    en: That was the first time I've heard such direct expressions of affection. It
      was nice.
    ko: |-
      그와 같은 직설적인 애정 표현은 처음 들어봤습니다.
      좋았습니다.
    ja: |-
      初めて聞く直接的な愛情表現でした。
      素晴らしいものです。
  event_goddessfall1_03_s_44:
    speaker: kilo
    en: You liked it, huh?
    ko: 좋았냐, 응?
    ja: 嬉しかったってこと、それ？
  event_goddessfall1_03_s_45:
    speaker: talos
    en: I love you, Kilo.
    ko: 사랑합니다, 킬로.
    ja: 愛しています、キロ。
  event_goddessfall1_03_s_46:
    speaker: kilo
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_47:
    speaker: crown
    en: Chime, do you remember which direction it was?
    ko: "…차임. 방향이 어디인지 기억하나요?"
    ja: "…チャイム。方角は覚えていますか？"
  event_goddessfall1_03_s_48:
    speaker: chime
    en: Yes. Marian said um...  ummm...
    ko: 예. 마리안이 음… 으음….
    ja: はい。マリアンが…その…えー…
  event_goddessfall1_03_s_49:
    speaker: chime
    en: I-is there not a place known as Busty Mountain?
    ko: 빠, 빵빵 가슴 산이라 부르는 곳 있지 않습니까요.
    ja: |-
      ほ、豊満な双丘と呼んでいる場所が
      ございまして…
  event_goddessfall1_03_s_50:
    speaker: chime
    en: The light came forth from between those peaks.
    ko: 그 사이에서 빛이 솟아올랐습니다요.
    ja: そちらの方角でございます。
  event_goddessfall1_03_s_51:
    speaker: crown
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_52:
    speaker: crown
    en: I should probably head over there.
    ko: 그쪽으로 가봐야겠어요.
    ja: では、そこへ参りましょう。
  event_goddessfall1_03_s_53:
    speaker: chime
    en: But Your Highness...
    ko: "…아가씨."
    ja: "…お嬢さま。"
  event_goddessfall1_03_s_54:
    speaker: chime
    en: "'Tis Eden that lieth in that direction."
    ko: 그 방향에는 에덴이 있습니다요.
    ja: あちらはエデンの方角でございます。
  event_goddessfall1_03_s_55:
    speaker: crown
    en: Even better. I'll stop by and say hello while I'm there.
    ko: 잘됐네요. 가는 김에 인사도 할 겸 가보죠.
    ja: |-
      ちょうどいいですわ。せっかくですから、
      ごあいさつもしておきましょう。
  event_goddessfall1_03_s_56:
    speaker: crown
    en: I'll be back. Take good care of Crown Kingdom while I'm away, Chime, Kilo
      and T.A.L.O.S.
    ko: |-
      다녀오겠습니다.
      크라운 왕국을 부탁해요. 차임, 킬로, 탈로스.
    ja: |-
      すぐに発ちます。
      留守の間、クラウン王国を頼みますわ。
      チャイム、キロ、タロス。
  event_goddessfall1_03_s_57:
    speaker: chime
    en: Thou planning to go by thy lonesome?
    ko: 호, 혼자 가시는 겁니까?
    ja: お、お一人で行かれるのでございますか？
  event_goddessfall1_03_s_58:
    speaker: crown
    en: Yes. Riding astride Trombe by myself would be fastest.
    ko: 예. 저 혼자 트롬베를 타고 가는 게 가장 빠르니까요.
    ja: ええ。トロンベは一人乗りの方が速いですわ。
  event_goddessfall1_03_s_59:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_60:
    speaker: kilo
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_61:
    speaker: talos
    en: Chime and Kilo are worried about Marian and wish to accompany you. But they
      are holding back because they are concerned they will slow you down.
    ko: 차임과 킬로는 지금 마리안의 안부가 걱정되어 동행하고 싶지만 속도가 느려질 것을 염려해 말을 아끼고 있는 것이라 판단됩니다.
    ja: |-
      チャイムとキロは同行を希望していますが、
      移動が遅くなるため発言を控えているものと
      推測します。
  event_goddessfall1_03_s_62:
    speaker: talos
    en: I feel the same way.
    ko: 저도 마찬가지입니다.
    ja: 私も同じ思考です。
  event_goddessfall1_03_s_63:
    speaker: crown
    en: "... You've all reminded me once again what fine retainers I have."
    ko: "…저는 좋은 신하들을 뒀군요. 새삼 느낍니다."
    ja: |-
      …私は臣下に恵まれておりますわ。
      改めてそう感じました。
  event_goddessfall1_03_s_64:
    speaker: crown
    en: Let us go together.
    ko: 함께 가죠.
    ja: では、共に行きましょう。
  event_goddessfall1_03_s_65:
    speaker: chime
    en: U-understood! I shall prepare forthwith!
    ko: 아, 알겠습니다요! 금방 정리하고 오겠습니다요!
    ja: |-
      か、かしこまりました！
      ただちに支度を整えてまいります！
  event_goddessfall1_03_s_66:
    speaker: chime
    en: We may yet be separated, so I shall make preparations for such occasions!
    ko: 엇갈릴 수 있으니, 그때를 대비해 놓겠습니다요!
    ja: |-
      そうとなれば、入れ違いにも
      備えておかなければ！
  event_goddessfall1_03_s_67:
    speaker: kilo
    en: I'll post notices on the walls!
    ko: 제가 벽보 붙일게요!
    ja: 張り紙をしておきますね！
  event_goddessfall1_03_s_68:
    speaker: chime
    en: Indeed! D-do not forget to write that the grubs lie in the cupboard, furthest
      to the left, in the deepest recesses!
    ko: 그래! 그, 굼벵이는 찬장 왼쪽 가장 끝 가장 깊숙한 곳에 있다고 꼭 적어두거라!
    ja: |-
      うむ！例の幼虫は棚の左端の一番奥にあると
      書いておくのだ！
  event_goddessfall1_03_s_69:
    speaker: kilo
    en: We'll only be gone for about five days at most. Should I just write down to
      wait for us?
    ko: 길어도 한 5일 정도 걸릴 테니 기다리고 있으라고 적어놓으면 되겠죠?
    ja: |-
      あとは長くて5日くらいで戻るから、
      待っててって書けばいいですか？
  event_goddessfall1_03_s_70:
    speaker: chime
    en: Right, right! That shall suffice!
    ko: 그래그래! 그 정도면 충분하다!
    ja: うむうむ！それだけ書いてあれば十分なのだ！
  event_goddessfall1_03_s_71:
    speaker: chime
    en: Place the food in the ice box and lay out some towels, and...
    ko: 음식들은 냉동고에 넣어놓고, 수건 내어놓고, 또….
    ja: |-
      食べ物は冷蔵庫の中、
      タオルは置いてある、あとは…
  event_goddessfall1_03_s_72:
    speaker: talos
    en: I'll physically reinforce the security of the superfood storage.
    ko: 저는 하이퍼 푸드 창고의 물리적 보안을 강화해 놓겠습니다.
    ja: |-
      私はハイパーフード保管庫のセキュリティを
      物理的に強化しておきます。
  event_goddessfall1_03_s_73:
    speaker: chime
    en: Much appreciated!
    ko: 부탁하마!
    ja: 頼むのだ！
  event_goddessfall1_03_s_74:
    speaker: kilo
    en: I'll refill the water supply!
    ko: 식수 채워놓을게요!
    ja: お水もいっぱいにしておきますね！
  event_goddessfall1_03_s_75:
    speaker: crown
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_76:
    speaker: crown
    en: Marian...
    ko: "…마리안."
    ja: "…マリアン…"
  event_goddessfall1_03_s_77:
    speaker: "<Narration>"
    en: Present time. On the surface, near Eden.
    ko: 현재, 에덴 인근의 지상.
    ja: 現在、地上・エデン近辺
  event_goddessfall1_03_s_78:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 쿠웅-!!
    ja: ズンッ！！
  event_goddessfall1_03_s_79:
    speaker: "<Narration>"
    en: Chatterbox's massive body lands with a resounding thud that shakes the ground.
    ko: 토커티브의 거체가 지면에 추락하듯이 착지한다.
    ja: |-
      空から降ったトーカティブの巨体が、
      大地を踏みつけた
  event_goddessfall1_03_s_80:
    speaker: "<Narration>"
    en: The earth cracks, sending rocks and dust flying.
    ko: 지면이 뒤집어지고 흙먼지가 돌덩이가 날린다.
    ja: 地表がえぐれ、土ぼこりが巻き起こる
  event_goddessfall1_03_s_81:
    speaker: "<Narration>"
    en: Chatterbox crouches again, then kicks off the ground.
    ko: |-
      토커티브는 다시 한번 자세를 낮춘 후,
      지면을 박차며 도약했다.
    ja: |-
      トーカティブはさらに姿勢を低くし、
      土を蹴ってもう一度跳躍した
  event_goddessfall1_03_s_82:
    speaker: "<Narration>"
    en: From atop Chatterbox's shoulder, Marian blankly watches the landscape flash
      by.
    ko: |-
      마리안은 토커티브의 어깨 위에서
      순식간에 스쳐 지나가는 풍경을 넋 놓고 바라보았다.
    ja: |-
      その肩にはマリアンが乗り、
      目にも留まらぬ速さで通り過ぎる
      風景の先を見つめていた
  event_goddessfall1_03_s_83:
    speaker: marian_q
    en: I hear gunfire and explosions.
    ko: 총성과 폭음이 들리네요.
    ja: 銃声と爆音が聞こえますね。
  event_goddessfall1_03_s_84:
    speaker: marian_q
    en: There must be a battle going on.
    ko: 역시 전투가 벌어지고 있는 걸까요?
    ja: もう戦闘が始まっているのでしょうか？
  event_goddessfall1_03_s_85:
    speaker: indivilia
    en: The Queen is descending. The human imposters must be trying to stop her.
    ko: |-
      퀸이 내려오고 있을 테니까요.
      유사 인간들이 그걸 막아내려 하고 있을 테고.
    ja: |-
      クイーンが降下を始めましたから。
      人間もどきはそれを防ごうとしているはずです。
  event_goddessfall1_03_s_86:
    speaker: talkative
    en: The sound is coming from Eden. Eden and the Queen may be fighting one another.
    ko: |-
      [소리가 들려온 방향은 에덴입니다.
      에덴과 퀸이 전투 중일지도 모릅니다.]
    ja: |-
      「戦闘音はエデンの方角からだ。
      エデンとクイーンが
      直接戦闘している可能性もある」
  event_goddessfall1_03_s_87:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_88:
    speaker: marian_q
    en: Sorry to ask, but can you quicken the pace, Chatterbox?
    ko: 토커티브. 좀 더 서둘러주세요. 죄송해요.
    ja: |-
      トーカティブ、悪いですが、
      もう少し急いでください。
  event_goddessfall1_03_s_89:
    speaker: talkative
    en: As you command, Queen.
    ko: "[분부대로 하겠습니다. 여왕님.]"
    ja: "「仰せのままに、我らが女王」"
  event_goddessfall1_03_s_90:
    speaker: indivilia
    en: I was surprised when you summoned us, but I didn't think you would propose
      attacking the original Queen.
    ko: |-
      갑자기 우릴 부르길래 무슨 일인가 했는데,
      원래의 퀸을 치자고 제안할 줄은 몰랐어요.
    ja: |-
      突然私たちを呼び出したかと思えば、
      まさか元のクイーンを倒そうなどと…
  event_goddessfall1_03_s_91:
    speaker: indivilia
    en: Hehe. I'm sorry, but you didn't seem like the type.
    ko: 후후. 실례지만 그럴 것 같은 이미지는 아니었거든요.
    ja: |-
      ふふ…失礼ながら、このようなことをする
      性格とは思っておりませんでした。
  event_goddessfall1_03_s_92:
    speaker: marian_q
    en: And what type did I seem like, exactly?
    ko: 어떤 이미지였나요.
    ja: どういうイメージだったんですか？
  event_goddessfall1_03_s_93:
    speaker: indivilia
    en: Because the first thing you did after the Queen Gene awakened was to tell
      us not to attack the kingdom.
    ko: |-
      퀸 인자를 각성하자마자 가장 처음 한 일이,
      왕국을 공격하지 말라는 것이었으니까요.
    ja: |-
      クイーン因子が目覚めて最初の命令が、
      王国に手を出すな、でしたから。
  event_goddessfall1_03_s_94:
    speaker: indivilia
    en: I had you pegged as a hopeless pacifist...
    ko: 답 없는 평화주의자… 라고 생각했었죠.
    ja: |-
      救いようのない平和主義者…
      そう思っておりました。
  event_goddessfall1_03_s_95:
    speaker: marian_q
    en: Is that so?
    ko: 그런가요.
    ja: そうでしたか。
  event_goddessfall1_03_s_96:
    speaker: marian_q
    en: I was a little surprised as well.
    ko: 저도 조금 의외이긴 해요.
    ja: 私も少し、意外に思っています。
  event_goddessfall1_03_s_97:
    speaker: marian_q
    en: You were subjects of the original Queen.
    ko: 당신들은 원래 퀸의 종속이었던 자들이죠.
    ja: |-
      ところで、あなたたちは本来なら
      クイーンに従っているはずですよね。
  event_goddessfall1_03_s_98:
    speaker: marian_q
    en: Just as I sensed her presence, you must have too.
    ko: 제가 원래의 퀸을 느꼈듯, 당신들도 그 존재를 느꼈을 텐데.
    ja: |-
      私がクイーンの存在を感じ取れたように、
      あなたたちも感じ取っているはずです。
  event_goddessfall1_03_s_99:
    speaker: marian_q
    en: So why are you obeying my requests and commands?
    ko: 어째서 제 부탁, 명령을 듣는 거죠?
    ja: なぜ、私のお願い…いえ、命令に従うんですか？
  event_goddessfall1_03_s_100:
    speaker: indivilia
    en: Hehe, not sure.
    ko: 후후. 글쎄요.
    ja: ふふ…なぜでしょうね。
  event_goddessfall1_03_s_101:
    speaker: indivilia
    en: Maybe because you were so quick to fill the void?
    ko: 선점 효과 같은 것 아닐까요?
    ja: 優先権のような問題では？
  event_goddessfall1_03_s_102:
    speaker: indivilia
    en: When the original Queen's influence was gone, your control took effect on
      us instead.
    ko: |-
      원래의 퀸이 행사하던 지배력이 공석일 때,
      당신의 지배력이 우리에게 행사되었다… 인 것 같네요.
    ja: |-
      元来のクイーンの支配権が失われ、
      あなたの支配力がそれに代わった…
      そんなところでしょう。
  event_goddessfall1_03_s_103:
    speaker: indivilia
    en: It's very interesting, and also very unpleasant, for one's heart to be so
      easily swayed.
    ko: |-
      신기하고 불쾌하군요.
      마음이라는 걸 이렇게나 편한 대로 부리다니.
    ja: |-
      奇妙で不愉快な気分です。
      自分の意志を誰かが好き勝手に
      書き変えられるということは。
  event_goddessfall1_03_s_104:
    speaker: marian_q
    en: This must be the fate of a Rapture.
    ko: 랩쳐의 숙명 같은 것이겠죠.
    ja: それがラプチャーの宿命なんでしょうね。
  event_goddessfall1_03_s_105:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 쿠웅-!!
    ja: ズンッ！！
  event_goddessfall1_03_s_106:
    speaker: "<Narration>"
    en: After landing, Chatterbox leaps again.
    ko: 토커티브가 착지 후, 다시 뛰어오른다.
    ja: トーカティブが大地を蹴り、再び飛び上がった
  event_goddessfall1_03_s_107:
    speaker: indivilia
    en: Can I ask you something?
    ko: 한 가지 물어봐도 될까요?
    ja: 1つ聞いてもよろしいですか？
  event_goddessfall1_03_s_108:
    speaker: marian_q
    en: Ask away.
    ko: 얼마든지요.
    ja: いくつでも構いません。
  event_goddessfall1_03_s_109:
    speaker: indivilia
    en: Why didn't you ask the human imposters in the kingdom you were residing in
      for help?
    ko: 어째서 당신이 머물던 왕국의 유사 인간들에게 협력을 요구하지 않았죠?
    ja: |-
      なぜあなたがいた王国の人間もどきたちに
      助けを求めなかったのですか？
  event_goddessfall1_03_s_110:
    speaker: indivilia
    en: I'm sure they would have undoubtedly risked their lives for you.
    ko: 그들이라면 응당, 당신을 위해 목숨을 걸 텐데.
    ja: |-
      きっと、命を懸けてでも
      当然のように力を貸したはずです。
  event_goddessfall1_03_s_111:
    speaker: marian_q
    en: Well...
    ko: "…그건."
    ja: "…それは…"
  event_goddessfall1_03_s_112:
    speaker: marian_q
    en: I could still ask them for help after taking down the original Queen.
    ko: 원래의 퀸을 치고 난 다음에 해도 늦지 않으니까요.
    ja: クイーンを倒してからでも、遅くないからです。
  event_goddessfall1_03_s_113:
    speaker: indivilia
    en: "... Oh."
    ko: "…오."
    ja: "…へえ。"
  event_goddessfall1_03_s_114:
    speaker: indivilia
    en: I see.
    ko: 그렇군요.
    ja: そうですか。
  event_goddessfall1_03_s_115:
    speaker: indivilia
    en: You want to keep it hidden from them.
    ko: 당신은 그들에게 알리고 싶지 않은 것이군요.
    ja: 知られたくないのですね。
  event_goddessfall1_03_s_116:
    speaker: indivilia
    en: The fact that you're the Raptures' Queen.
    ko: 자신이 랩쳐의 퀸이라는 걸.
    ja: ラプチャーのクイーンとして目覚めたことを。
  event_goddessfall1_03_s_117:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_118:
    speaker: indivilia
    en: Haha. You acknowledge what you are so firmly, yet at the same time, try to
      deny it.
    ko: 후후. 그렇게나 자신에 대해 강하게 인식하면서, 그걸 동시에 부정하다니.
    ja: |-
      ふふ…それほど自身のことを理解していながら、
      目を背けようとするなんて。
  event_goddessfall1_03_s_119:
    speaker: indivilia
    en: How fragile you are, my Queen.
    ko: 나약하시군요. 퀸이시여.
    ja: 軟弱ですね、クイーン。
  event_goddessfall1_03_s_120:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_s_121:
    speaker: indivilia
    en: If I may give you a piece of advice.
    ko: 한 가지 충고를 드리자면.
    ja: 1つ忠告しておきます。
  event_goddessfall1_03_s_122:
    speaker: indivilia
    en: With such weakness, it'll be impossible.
    ko: 그런 나약함으로는 절대.
    ja: そのような弱さを抱えていては、絶対に…
  event_goddessfall1_03_s_123:
    speaker: indivilia
    en: You will never be able to defeat what hovers above.
    ko: 저 위에 머문 것을 이길 수 없답니다.
    ja: 空の上のあれには勝てません。
  event_goddessfall1_03_s_124:
    speaker: indivilia
    en: Unless you fight it as a Queen, there is no hope of victory.
    ko: 퀸으로서 맞서 싸우지 않으면, 승산은 없어요.
    ja: |-
      クイーンとして立ち向かうしか、
      方法はありませんよ。
  event_goddessfall1_03_s_125:
    speaker: marian_q
    en: "... Thanks for the advice."
    ko: "…충고. 고마워요."
    ja: "…ありがとうございます。覚えておきます。"
event_goddessfall1_03_e:
  event_goddessfall1_03_e_1:
    speaker: talkative
    en: It would be best if we proceed cautiously from here.
    ko: "[이쯤에서 경계하며 접근하는 게 좋겠습니다.]"
    ja: |-
      「ここから先は、
      慎重に進んだ方がよろしいかと」
  event_goddessfall1_03_e_2:
    speaker: talkative
    en: My movements are too conspicuous.
    ko: "[제 이동 방식은 너무 눈에 띕니다.]"
    ja: "「私が飛んでいると目立ちすぎる」"
  event_goddessfall1_03_e_3:
    speaker: marian_q
    en: Okay. Thank you, Chatterbox.
    ko: 그래요. 고마워요 토커티브.
    ja: |-
      分かりました。
      ありがとうございます、トーカティブ。
  event_goddessfall1_03_e_4:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_03_e_5:
    speaker: indivilia
    en: Now, then.
    ko: 자, 그럼.
    ja: さて、そろそろ…
  event_goddessfall1_03_e_6:
    speaker: indivilia
    en: How do you plan on defeating the original Queen up there?
    ko: 어떻게 저 위에 있는 원래의 퀸을 쓰러뜨릴 생각이시죠?
    ja: |-
      どうやって空高くにいるクイーンを討つか、
      聞かせていただきましょうか？
  event_goddessfall1_03_e_7:
    speaker: indivilia
    en: Tell me your plan.
    ko: 계획을 들려줘요.
    ja: 計画を教えてください。
  event_goddessfall1_03_e_8:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_9:
    speaker: marian_q
    en: Chatterbox. You said that Eden was a base built by the Nikkes to fight the
      Queen, right?
    ko: 토커티브. 에덴은 니케들이 퀸을 치기 위해 지어놓은 기지라고 했었죠?
    ja: |-
      トーカティブ。エデンはクイーンを倒すために
      建てられた基地なんですよね？
  event_goddessfall1_03_e_10:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_03_e_11:
    speaker: talkative
    en: That's correct.
    ko: "[그렇습니다.]"
    ja: "「その通り」"
  event_goddessfall1_03_e_12:
    speaker: indivilia
    en: Don't tell me...
    ko: "…설마."
    ja: "…まさか。"
  event_goddessfall1_03_e_13:
    speaker: indivilia
    en: Ha! N-no way!
    ko: 후, 후후. 설마, 설마 아니겠죠.
    ja: ふ、ふふ。まさか。私の考えすぎでしょう？
  event_goddessfall1_03_e_14:
    speaker: indivilia
    en: You're not suggesting that we ally with Eden to fight the Queen, are you?
    ko: 에덴과 연합해서 원래의 퀸을 치자는 이야기는 아니시겠죠?
    ja: |-
      エデンと手を組むなどという話では
      ありませんね？
  event_goddessfall1_03_e_15:
    speaker: marian_q
    en: I am.
    ko: 맞아요.
    ja: いいえ、それです。
  event_goddessfall1_03_e_16:
    speaker: marian_q
    en: Isn't it better to increase our chances of victory, even just a little...
    ko: 조금이라도 승산을 높이는 편이….
    ja: 勝算を少しでも高めるためには…
  event_goddessfall1_03_e_17:
    speaker: indivilia
    en: No. Absolutely not.
    ko: 아니죠. 그건 아니죠.
    ja: 無理ですね。不可能です。
  event_goddessfall1_03_e_18:
    speaker: indivilia
    en: An alliance with human imposters? What a joke, and a bad one at that.
    ko: 유사 인간과의 연합이라니, 웃기지도 않는 소릴 하시는군요.
    ja: |-
      人間もどきと協力するなんて、
      笑えない冗談です。
  event_goddessfall1_03_e_19:
    speaker: indivilia
    en: You don't even want to reveal that you're the Queen.
    ko: 당신은 당신이 퀸이라는 걸 알리고 싶어 하지 않았잖아요.
    ja: |-
      ご自分がクイーンであることは
      知られたくないのでしょう？
  event_goddessfall1_03_e_20:
    speaker: marian_q
    en: "... Because the people of Eden don't know me."
    ko: "…에덴의 분들은 저를 모를 테니까요."
    ja: |-
      …エデンの人たちは、
      私のことを知らないはずですから。
  event_goddessfall1_03_e_21:
    speaker: indivilia
    en: What kind of childish ideas are those...?
    ko: 그 무슨… 어린애 같은 발상을…!
    ja: |-
      呆れてしまいますね…
      子どものような考えを…！
  event_goddessfall1_03_e_22:
    speaker: talkative
    en: Indivilia. Mind your tone before the Queen.
    ko: "[인디빌리아. 여왕님께 예의를 갖춰라.]"
    ja: "「インディビリア。女王の前だ、わきまえろ」"
  event_goddessfall1_03_e_23:
    speaker: indivilia
    en: "*Sigh*"
    ko: 후우….
    ja: はぁ…
  event_goddessfall1_03_e_24:
    speaker: indivilia
    en: Fine. Okay.
    ko: 그래. 좋아요.
    ja: 分かりました。
  event_goddessfall1_03_e_25:
    speaker: indivilia
    en: Let's assume that's the plan.
    ko: 일단은 그렇다 치죠.
    ja: 協力は実現できるものと仮定します。
  event_goddessfall1_03_e_26:
    speaker: indivilia
    en: Then let me ask you one thing.
    ko: 그럼 한 가지만 물어볼게요.
    ja: それなら、もう1つだけ聞かせてください。
  event_goddessfall1_03_e_27:
    speaker: indivilia
    en: As the "Queen", what kind of world do you envision?
    ko: 당신이 [퀸]으로서 그리는 세계는 무엇인가요?
    ja: |-
      あなたは「クイーン」として、
      どのような世界を描くのですか？
  event_goddessfall1_03_e_28:
    speaker: indivilia
    en: After taking down the Queen above and absorbing her essence...
    ko: |-
      저 위에 있는 퀸을 쓰러뜨린 후,
      인자를 흡수한 후.
    ja: 上にいるあれを倒し、因子を取り込んだ後…
  event_goddessfall1_03_e_29:
    speaker: indivilia
    en: What kind of world do you want to create?
    ko: 어떤 세계를 만들고 싶나요?
    ja: 世界をどうするというのです？
  event_goddessfall1_03_e_30:
    speaker: marian_q
    en: I...
    ko: "…저는."
    ja: "…私は…"
  event_goddessfall1_03_e_31:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_32:
    speaker: marian_q
    en: I want to create a world where everyone can love one another.
    ko: 모두가 모두를 사랑할 수 있는 세계를 만들고 싶어요.
    ja: |-
      みんなが、お互いに愛することができる世界を
      作りたいです。
  event_goddessfall1_03_e_33:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_34:
    speaker: indivilia
    en: What?
    ko: 뭐?
    ja: 何ですか、それは？
  event_goddessfall1_03_e_35:
    speaker: marian_q
    en: Nikkes, humans, Raptures. I want to create a world where everyone can all
      love each other.
    ko: |-
      니케도, 사람도, 랩쳐도.
      모두 서로를 사랑할 수 있는 세계를 만들고 싶어요.
    ja: |-
      ニケも、人間も、ラプチャーも…
      誰もがお互いに愛し合える。
  event_goddessfall1_03_e_36:
    speaker: marian_q
    en: That's the world I will create.
    ko: 그게 제가 만들 세계예요.
    ja: それが、私の作りたい世界です。
  event_goddessfall1_03_e_37:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_38:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_03_e_39:
    speaker: indivilia
    en: Ha, haha.
    ko: 후, 후후.
    ja: ふ、ふふふ…
  event_goddessfall1_03_e_40:
    speaker: indivilia
    en: Hahahahaha!
    ko: 아하하하하하.
    ja: あはははははっ…！
  event_goddessfall1_03_e_41:
    speaker: indivilia
    en: This is hopeless.
    ko: 이건 안 되겠네요.
    ja: ダメそうですねえ、これは。
  event_goddessfall1_03_e_42:
    speaker: indivilia
    en: To think that this half-baked thing is the Queen!
    ko: 이런, 이런 되다 만 것이 퀸이라니…!
    ja: |-
      こんな…こんな半端者が
      クイーンだなんて…！
  event_goddessfall1_03_e_43:
    speaker: indivilia
    en: Did I hear that right? Love? Everyone loving each other?
    ko: 사랑? 사랑이요? 모두가 모두를?
    ja: 愛？愛する！？誰もがお互いに！？
  event_goddessfall1_03_e_44:
    speaker: indivilia
    en: How would you achieve that? Huh?
    ko: 어떻게요? 예?
    ja: そんなこと、どうやると？
  event_goddessfall1_03_e_45:
    speaker: marian_q
    en: I'll figure it out as I go.
    ko: "…방법은 차차 생각할 거예요."
    ja: "…方法は、ゆっくり考えます。"
  event_goddessfall1_03_e_46:
    speaker: indivilia
    en: Hah... You've gotta be kidding me. We finally get a Queen...
    ko: |-
      아아… 이럴 수가….
      기껏 생겨난 퀸이 이런….
    ja: |-
      ああ…なんということ…
      ようやく生まれた新たなクイーンが…
  event_goddessfall1_03_e_47:
    speaker: indivilia
    en: But she's some naive idealist.
    ko: 머저리 같은 이상주의자라니.
    ja: こんな、バカげた理想主義者だなんて。
  event_goddessfall1_03_e_48:
    speaker: indivilia
    en: I'm sorry, but I can't go along with this.
    ko: 죄송하지만 저는 당신과 함께 가지 않겠어요.
    ja: 残念ですが、私はこれ以上付き合いきれません。
  event_goddessfall1_03_e_49:
    speaker: indivilia
    en: An alliance with human imposters is absurd enough, but your entire worldview
      is utter nonsense.
    ko: |-
      유사 인간과의 연합도 말이 안 되는데,
      세계관도 말이 안 되는군요.
    ja: |-
      人間もどきと手を組むだけでも
      論外だというのに、
      その後に描く世界までこれでは。
  event_goddessfall1_03_e_50:
    speaker: indivilia
    en: Just hearing it makes my ears bleed!
    ko: 귀가… 썩어버릴 것 같아요…!
    ja: |-
      これ以上聞いたら…
      耳が腐ってしまいそうです！
  event_goddessfall1_03_e_51:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_03_e_52:
    speaker: "<Narration>"
    en: "*Kreeeeeee*"
    ko: 키이이이잉--
    ja: キィィィン――
  event_goddessfall1_03_e_53:
    speaker: marian_q
    en: You don't have a choice.
    ko: 당신에게는 선택권이 없어요.
    ja: 選ばせてあげることはできません。
  event_goddessfall1_03_e_54:
    speaker: marian_q
    en: You will defeat the Queen with me.
    ko: 저와 함께, 퀸을 쓰러뜨려요.
    ja: 私と一緒に、クイーンを倒してください。
  event_goddessfall1_03_e_55:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_56:
    speaker: indivilia
    en: I refuse.
    ko: 거절할게요.
    ja: お断りです。
  event_goddessfall1_03_e_57:
    speaker: "<Narration>"
    en: "*Kreeeeeee*"
    ko: 키이이이잉--
    ja: キィィィン――
  event_goddessfall1_03_e_58:
    speaker: marian_q
    en: I said, you don't have a choice.
    ko: 선택권이 없다고 말했을 텐데요.
    ja: 選ばせてあげられないと言いました。
  event_goddessfall1_03_e_59:
    speaker: indivilia
    en: "*Sigh*"
    ko: 하아….
    ja: はぁ…
  event_goddessfall1_03_e_60:
    speaker: indivilia
    en: Damn Heretic.
    ko: 빌어먹을 헬레틱.
    ja: 忌々しいヘレティック…
  event_goddessfall1_03_e_61:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_62:
    speaker: indivilia
    en: For the first time, I want to curse my own existence.
    ko: 처음으로, 제 존재를 저주하고 싶군요.
    ja: この身を呪いたくなったのは、初めてです。
  event_goddessfall1_03_e_63:
    speaker: "<Narration>"
    en: "*Kreeeeeee*"
    ko: 키이이이이이이이잉---!!
    ja: キィィィィィン――！！
  event_goddessfall1_03_e_64:
    speaker: "<Narration>"
    en: An ear-piercing sound rings out in an instant, filling the space.
    ko: 그 순간, 귀를 찌르는 듯한 소리가 공간을 가득 메우듯 울려 퍼졌다.
    ja: |-
      その時、耳をつんざく音が
      世界を埋めつくすように鳴り響いた
  event_goddessfall1_03_e_65:
    speaker: "<Narration>"
    en: A suffocating pressure follows immediately after.
    ko: 그리고 바로 느껴지는 중압감.
    ja: 同時に、重圧感が身体を襲った
  event_goddessfall1_03_e_66:
    speaker: "<Narration>"
    en: Marian feels a crushing weight forcing her to bow.
    ko: 마리안은 절로 허리가 숙여지는 듯한 압력을 느꼈다.
    ja: マリアンはあまりの圧力に、思わず膝を折った
  event_goddessfall1_03_e_67:
    speaker: "<Narration>"
    en: She quickly realizes that the sound is imbued with the dominance of the Queen
      above.
    ko: 그리고 곧, 그것이 하늘의 퀸이 내뿜은 지배력을 담은 소리라는 것을 알아챘다.
    ja: |-
      そしてすぐさま、それが空の彼方にいる
      クイーンの放つ支配の力であることに気づいた
  event_goddessfall1_03_e_68:
    speaker: marian_q
    en: Such... domineering power...!
    ko: 이 정도의…! 지배력이라니…!
    ja: これほどの…！力が…！
  event_goddessfall1_03_e_69:
    speaker: "<Narration>"
    en: As the crushing pressure eases, Marian slowly lifts her head.
    ko: 숨이 막힐 것 같은 압력이 잦아들자, 마리안은 천천히 고개를 들었다.
    ja: |-
      息の詰まるような力がわずかに和らぎ、
      マリアンはゆっくりと天を仰いだ
  event_goddessfall1_03_e_70:
    speaker: "<Narration>"
    en: Indivilia stands before her, blocking Marian's path.
    ko: 인디빌리아가 마리안의 앞을 가로막고 바라보고 있었다.
    ja: |-
      気づけばインディビリアが立ちはだかり、
      視線をマリアンに向けていた
  event_goddessfall1_03_e_71:
    speaker: "<Narration>"
    en: She grins oddly as her tail sways about.
    ko: 묘한 웃음. 살랑이는 꼬리.
    ja: 含みのある笑みを浮かべ、尻尾を揺らしながら
  event_goddessfall1_03_e_72:
    speaker: indivilia
    en: Heh...
    ko: "…후."
    ja: "…ふん。"
  event_goddessfall1_03_e_73:
    speaker: "<Narration>"
    en: She licks her lips.
    ko: 입술을 핥는 혀.
    ja: インディビリアは舌を出し、唇をなめた
  event_goddessfall1_03_e_74:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_03_e_75:
    speaker: marian_q
    en: Indivilia.
    ko: 인디빌리아.
    ja: インディビリア。
  event_goddessfall1_03_e_76:
    speaker: marian_q
    en: Step aside right now.
    ko: 지금 당장 내 앞에서 물러나요.
    ja: 下がってください。
  event_goddessfall1_03_e_77:
    speaker: indivilia
    en: "... Haha."
    ko: "…후후."
    ja: "…ふふ。"
  event_goddessfall1_03_e_78:
    speaker: "<Narration>"
    en: "*Kreeeeeee*"
    ko: 키이이이잉--
    ja: キィィィン――
  event_goddessfall1_03_e_79:
    speaker: marian_q
    en: Are you deaf—
    ko: 제 말이 들리지 않
    ja: 私の言うことが聞こえ――
  event_goddessfall1_03_e_80:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 쉭-!
    ja: シュッ――！
  event_goddessfall1_03_e_81:
    speaker: "<Narration>"
    en: In Marian's eyes, which are glowing strangely...
    ko: 기묘한 안광을 뿜어내던 마리안의 두 눈동자에.
    ja: 不思議な光を放っていたマリアンの両眼が…
  event_goddessfall1_03_e_82:
    speaker: "<Narration>"
    en: A long slash wound forms.
    ko: 가로로 길게 그어진 자상이 생겨났다.
    ja: 横なぎに斬り付けられた
  event_goddessfall1_03_e_83:
    speaker: "<Narration>"
    en: Fresh blood pours out in waves of crimson.
    ko: 그리고, 붉은 선혈이 뿜어져 나왔다.
    ja: そして、鮮やかな赤い液体が飛び散った
event_goddessfall1_intermission_01:
  event_goddessfall1_intermission_01_1:
    speaker: nayuta_m
    en: Pray tell, what in heaven's name was that shrill cry...!
    ko: 방금 그 괴성은 대체…!
    ja: 今の音はいったい…！
  event_goddessfall1_intermission_01_2:
    speaker: nayuta_m
    en: Verily, it seemed to have cometh from the Queen...
    ko: 퀸에게서 온 소리 같았소만….
    ja: クイーンからのようでしたが…
  event_goddessfall1_intermission_01_3:
    speaker: nayuta_m
    en: Fire Dragon, might thou possess knowledge of...?
    ko: 화룡 소저. 혹시 아는 것이 있….
    ja: 火竜、何か分かることは――
  event_goddessfall1_intermission_01_4:
    speaker: nihilister_m
    en: "... Damn."
    ko: "…젠장."
    ja: "…クソッ…"
  event_goddessfall1_intermission_01_5:
    speaker: nayuta_m
    en: Ho! Art thou well?
    ko: "…이보시오. 괜찮소?"
    ja: "…どうしたのです、大丈夫ですか？"
  event_goddessfall1_intermission_01_6:
    speaker: nihilister_m
    en: Damn! Damn! Damn!
    ko: 젠장! 젠장! 젠장!
    ja: クソ！クソ！クソッ！
  event_goddessfall1_intermission_01_7:
    speaker: nihilister_m
    en: Damn you, Mother!
    ko: 빌어쳐먹을 어머니!
    ja: 何がお母様だ！
  event_goddessfall1_intermission_01_8:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_intermission_01_9:
    speaker: nihilister_m
    en: Kill me, Imposter Monk! Kill me!
    ko: 죽여라 땡중! 나를 죽여!
    ja: 殺せ、クソ仙人！俺を殺せ！
  event_goddessfall1_intermission_01_10:
    speaker: nayuta_m
    en: Fire Dragon...
    ko: "…화룡 소저."
    ja: "…火竜？"
  event_goddessfall1_intermission_01_11:
    speaker: nihilister_m
    en: Kill me! The Queen has "reclaimed" us! We can't resist!
    ko: 죽여! 퀸이 우릴 [거둬갔다]! 우리는 거부할 수 없다고!
    ja: |-
      早く！クイーンが俺たちを「奪いやがった」！
      俺たちには逆らえねえ！
  event_goddessfall1_intermission_01_12:
    speaker: nihilister_m
    en: We've become the Queen's playthings...! We have no choice but to do what she
      tells us...!
    ko: |-
      퀸의 장난감이 되어서…! 시키는 건 다 할 수밖에 없는…!
      꼭두각시가 되는 것밖에 안 남았다고…!
    ja: |-
      クイーンのおもちゃにされて…！
      従うしかねえ…！操り人形になるしか…！
  event_goddessfall1_intermission_01_13:
    speaker: nayuta_m
    en: Dominance...!
    ko: 지배력…!
    ja: クイーンの支配…！
  event_goddessfall1_intermission_01_14:
    speaker: nihilister_m
    en: Since we're at a fair distance, there's some delay. But soon...!
    ko: 거리가 있어 진행이 늦어! 하지만 곧이야!
    ja: |-
      遠くにいるから効くのが遅れてる！
      だが時間の問題だ！
  event_goddessfall1_intermission_01_15:
    speaker: nihilister_m
    en: Once I cross over, then Lilith's body will cross over with me.
    ko: 내가 저쪽으로 넘어가면 릴리스의 바디도 같이 넘어가!
    ja: |-
      俺があっちについちまったら、
      リリスのボディを持っていかれる！
  event_goddessfall1_intermission_01_16:
    speaker: nihilister_m
    en: I won't be able to make the poisoned chalice!
    ko: 독잔을 만들 수 없다고!
    ja: 計画が台無しだ！
  event_goddessfall1_intermission_01_17:
    speaker: nihilister_m
    en: If that's the case... then just kill me and take Lilith's body!
    ko: 그럴 바엔…! 그럴 바엔 날 죽이고 릴리스의 바디를 가져가라!
    ja: |-
      構いやしねえ…！
      俺を殺してリリスのボディを持って行け！
  event_goddessfall1_intermission_01_18:
    speaker: nayuta_m
    en: Ugh...!
    ko: 크읏…!
    ja: くっ…！
  event_goddessfall1_intermission_01_19:
    speaker: nihilister_m
    en: What are you doing? Hurry up and kill me!
    ko: 뭐 해! 빨리 죽이라고!!
    ja: 何してんだ！早くしろ！！
  event_goddessfall1_intermission_01_20:
    speaker: "<Narration>"
    en: Nayuta places her palm in front of Nihilister's forehead.
    ko: 니힐리스타의 머리 앞에 나유타의 손바닥이 위치한다.
    ja: ナユタはニヒリスターの頭に手のひらを向けた
  event_goddessfall1_intermission_01_21:
    speaker: "<Narration>"
    en: Nayuta's wrist glows.
    ko: 나유타의 손목이 빛을 발한다.
    ja: ナユタの手首が輝き始める
  event_goddessfall1_intermission_01_22:
    speaker: nayuta_m
    en: "... Canst thou not break free of it?"
    ko: "…벗어날 순 없는 것이오?"
    ja: "…抜け出すことはできないのですか？"
  event_goddessfall1_intermission_01_23:
    speaker: nihilister_m
    en: As long as I'm a Rapture, as long as I'm a Heretic... it's impossible.
    ko: 랩쳐인 이상…! 헬레틱인 이상…! 불가능해…!
    ja: |-
      俺がラプチャーである限り…！
      ヘレティックである限りは…！できねえよ…！
  event_goddessfall1_intermission_01_24:
    speaker: nihilister_m
    en: Haha... we were born like this, after all!
    ko: 하, 하하…! 그래…! 결국 우린 이렇게 타고난 거지…!
    ja: |-
      ハ…ハハ…！そうだ…！
      結局、俺たちはそういうふうに
      生まれちまってるんだ…！
  event_goddessfall1_intermission_01_25:
    speaker: nihilister_m
    en: Damn it all to hell...
    ko: "…엿같아."
    ja: "…ヘドが出るぜ…"
  event_goddessfall1_intermission_01_26:
    speaker: nayuta_m
    en: Arrrgggh!!
    ko: 크으…!!
    ja: くっ…！！
  event_goddessfall1_intermission_01_27:
    speaker: nayuta
    en: Their cores hath been wholly torn asunder. What is the cause thereof?
    ko: 코어가 모두 뜯겨나갔소. 무슨 연유요.
    ja: |-
      すべてコアが抜かれていますね。
      なぜでしょう。
  event_goddessfall1_intermission_01_28:
    speaker: nihilister_m
    en: Without a core, the bodies of human imposters are worthless to the Raptures.
    ko: 코어가 없는 유사 인간의 바디는 랩쳐에게 아무런 가치가 없으니까.
    ja: |-
      コアがなきゃ、人間もどきのボディは
      ラプチャーにとって何の価値もねえ。
  event_goddessfall1_intermission_01_29:
    speaker: nihilister_m
    en: Someone must have done it in hopes they wouldn't be defiled after death.
    ko: |-
      죽은 이후에라도 농락당하지 않았으면 하는 마음에,
      누군가가 그렇게 했겠지.
    ja: |-
      どこかの誰かが、死んだあとぐらい
      ゆっくり休ませてやりてぇと思って
      やったんだろ。
  event_goddessfall1_intermission_01_30:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_intermission_01_31:
    speaker: nayuta
    en: Was it you, Fire Dragon?
    ko: 화룡 소저.
    ja: あなたですか。
  event_goddessfall1_intermission_01_32:
    speaker: nihilister_m
    en: Yes. It was.
    ko: 그래. 내가 했다.
    ja: そうだ。俺がやった。
  event_goddessfall1_intermission_01_33:
    speaker: nayuta
    en: I see thou dost remember the past.
    ko: 기억하는구려. 과거를.
    ja: 忘れていないのですね。過去を。
  event_goddessfall1_intermission_01_34:
    speaker: nihilister_m
    en: Yes. A pathetic past I would rather erase.
    ko: 지우고 싶은 약해빠진 과거지만 말이지.
    ja: |-
      ショボかった昔のことなんて、
      消してえぐらいだけどな。
  event_goddessfall1_intermission_01_35:
    speaker: johan
    en: Monk.
    ko: 승려.
    ja: 仙人。
  event_goddessfall1_intermission_01_36:
    speaker: johan
    en: What do you plan on doing with Nihilister after you retrieve Lilith's body?
    ko: 릴리스의 바디를 찾은 후 니힐리스타를 어떻게 할 생각이지?
    ja: |-
      用済みになったニヒリスターは
      どうするつもりだ？
  event_goddessfall1_intermission_01_37:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_intermission_01_38:
    speaker: johan
    en: Tsk.
    ko: 쯧.
    ja: ふん…
  event_goddessfall1_intermission_01_39:
    speaker: johan
    en: You're no different from the rest.
    ko: 너도 다를 바 없군.
    ja: お前も同類のようだな。
  event_goddessfall1_intermission_01_40:
    speaker: nayuta
    en: I am resolved to undertake any measures necessary to claim victory.
    ko: 소인은 이기기 위해서라면 무슨 짓이든 할 것이외다.
    ja: 勝つためなら手段は選ばぬ覚悟ですので。
  event_goddessfall1_intermission_01_41:
    speaker: nayuta_m
    en: Cursed be it.
    ko: 아, 이런.
    ja: ああ、私は…
  event_goddessfall1_intermission_01_42:
    speaker: nayuta_m
    en: What renders me thus feeble?
    ko: 어찌 이리도 나약한가.
    ja: どうしてこうも、弱いのでしょう…
  event_goddessfall1_intermission_01_43:
    speaker: nihilister_m
    en: You idiot!!
    ko: 이 멍청한 놈!!
    ja: 大バカ野郎が！！
  event_goddessfall1_intermission_01_44:
    speaker: "<Narration>"
    en: With a deafening roar, Storm Bringer charges in.
    ko: 굉음과 함께 스톰 브링어가 강습한다.
    ja: |-
      どこからともなく、轟音とともに飛来した
      ストームブリンガーが…
  event_goddessfall1_intermission_01_45:
    speaker: "<Narration>"
    en: It snatches Nihilister and disappears.
    ko: 니힐리스타를 낚아챈 후, 사라진다.
    ja: ニヒリスターをさらい、空に消えた
  event_goddessfall1_intermission_01_46:
    speaker: "<Narration>"
    en: Nayuta stands frozen as this unfolds before her.
    ko: 나유타는 그 모습을 멍하니 바라보았다.
    ja: ナユタはただ呆然と、虚空を見上げた
  event_goddessfall1_intermission_01_47:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_intermission_01_48:
    speaker: nayuta_m
    en: Prithee, forgive me, all.
    ko: 다들, 미안하외다.
    ja: 皆さん、申し訳ありません…
  event_goddessfall1_intermission_01_49:
    speaker: nayuta_m
    en: I... have failed.
    ko: 소인… 실패했소.
    ja: 私には…できませんでした。
  event_goddessfall1_intermission_01_50:
    speaker: marian_q
    en: Ugh... Ahh...
    ko: 으… 아아….
    ja: う…あああ…！
  event_goddessfall1_intermission_01_51:
    speaker: indivilia
    en: Having trouble regenerating?
    ko: 재생이 잘 안되나 보군요.
    ja: 上手く再生できないようですね。
  event_goddessfall1_intermission_01_52:
    speaker: indivilia
    en: For a Queen, your eyes are really slow to heal.
    ko: 제아무리 퀸이라도 안구는 회복이 더딘가 보네요.
    ja: |-
      いかにクイーンでも、
      眼球の修復には時間がかかるようで。
  event_goddessfall1_intermission_01_53:
    speaker: indivilia
    en: Ah, my bad.
    ko: 아, 실례.
    ja: ああ、失礼…
  event_goddessfall1_intermission_01_54:
    speaker: indivilia
    en: Not a true Queen, but one that's half-baked.
    ko: 퀸이 아니라 되다 만 것으로 정정하죠.
    ja: |-
      クイーンではなく、
      なり損ないと呼ぶべきでしたね。
  event_goddessfall1_intermission_01_55:
    speaker: marian_q
    en: How could... why you...!
    ko: 어떻게… 이런…!
    ja: どうして…こんな…！
  event_goddessfall1_intermission_01_56:
    speaker: "<Narration>"
    en: "*Craaaaack*"
    ko: 카가가가가각--!!
    ja: ズガガガガガッ…！！
  event_goddessfall1_intermission_01_57:
    speaker: marian_q
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_intermission_01_58:
    speaker: "<Narration>"
    en: Indivilia's tail lashes wildly.
    ko: 인디빌리아의 꼬리가 난무한다.
    ja: インディビリアの尻尾が狂ったように躍り…
  event_goddessfall1_intermission_01_59:
    speaker: "<Narration>"
    en: Marian collapses, blood spraying in all directions.
    ko: 마리안은 피를 흩뿌리며 쓰러졌다.
    ja: |-
      マリアンは全身から
      血をまき散らし、倒れた
  event_goddessfall1_intermission_01_60:
    speaker: indivilia
    en: Your authority has been overridden by the original Queen above.
    ko: |-
      당신의 지배력을 덮어썼어요.
      저 위에 있는 원래의 퀸이.
    ja: |-
      あなたの支配が上書きされたようです。
      上空にいる本来のクイーンに。
  event_goddessfall1_intermission_01_61:
    speaker: indivilia
    en: Since you've experienced it yourself, you should know how pathetic your attempt
      at dominance was.
    ko: |-
      직접 겪어보니 알겠네요.
      당신의 지배력이 얼마나 보잘것없었는지.
    ja: |-
      実際に体験して、よく分かりました。
      あなたの支配力がどれほど
      取るに足らないものか。
  event_goddessfall1_intermission_01_62:
    speaker: indivilia
    en: I still may not like that I'm being manipulated, but it's better to be ruled
      by something complete rather than something half-baked like you.
    ko: |-
      지배를 받는 건 여전히 마음에 안 들지만….
      되다 만 것보다는 온전한 것의 지배를 받는 게 훨씬 낫네요.
    ja: |-
      いいように操られるのは、気に入りませんが…
      半端ななり損ないよりは、完全なクイーンに
      支配されていた方がはるかにマシです。
  event_goddessfall1_intermission_01_63:
    speaker: marian_q
    en: Ah... Ahhh...
    ko: 아… 아아….
    ja: う…ああ…
  event_goddessfall1_intermission_01_64:
    speaker: indivilia
    en: Oh no, you don't.
    ko: 으음~ 안 되죠 안돼.
    ja: おや、いけませんね。
  event_goddessfall1_intermission_01_65:
    speaker: "<Narration>"
    en: "*Craaaaack*"
    ko: 카가가가가각--!!
    ja: ズガガガガガッ…！！
  event_goddessfall1_intermission_01_66:
    speaker: marian_q
    en: Ugh...! Aaaagh!
    ko: 윽…! 카학!
    ja: うっ…！カハッ…！
  event_goddessfall1_intermission_01_67:
    speaker: indivilia
    en: I won't give you time to regenerate.
    ko: 재생할 틈 같은 건 주지 않을 거예요.
    ja: 再生するスキなど与えません。
  event_goddessfall1_intermission_01_68:
    speaker: indivilia
    en: Well then, let's see...
    ko: 그럼 어디 보자….
    ja: どうしたものでしょうね…
  event_goddessfall1_intermission_01_69:
    speaker: indivilia
    en: Chatterbox.
    ko: 토커티브.
    ja: トーカティブ。
  event_goddessfall1_intermission_01_70:
    speaker: indivilia
    en: Eat her.
    ko: 이걸 먹어요.
    ja: 食べてしまってください。
  event_goddessfall1_intermission_01_71:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_intermission_01_72:
    speaker: indivilia
    en: You already devoured Nihilister. Once you consume this Queen... I mean this
      half-baked one, you'll become even more beautiful.
    ko: 니힐리스타에 이어 퀸, 아니 되다 만 것까지 먹은 당신은 한층 더 아름다워질 테죠.
    ja: |-
      ニヒリスターに続いて、クイーン…
      いえ、そのなり損ないも食らったのなら、
      あなたは一層美しくなるはずです。
  event_goddessfall1_intermission_01_73:
    speaker: indivilia
    en: How exciting! Go on, hurry!
    ko: |-
      너무 기대되네요.
      자, 어서.
    ja: |-
      とても楽しみですね。
      さあ、早く。
  event_goddessfall1_intermission_01_74:
    speaker: talkative
    en: I refuse.
    ko: "[거절한다.]"
    ja: "「それはできん」"
  event_goddessfall1_intermission_01_75:
    speaker: indivilia
    en: How? Are you still under this half-baked one's control?
    ko: 어째서죠? 아직 이 되다 만 것의 지배를 받고 있나요?
    ja: |-
      なぜです？まだなり損ないの支配から
      抜けられていないのですか？
  event_goddessfall1_intermission_01_76:
    speaker: indivilia
    en: Haha, is this some kind of kinship between half-baked goods?
    ko: 후후. 되다 만 것끼리의 유대, 뭐 이런 건가요?
    ja: ふふ…それとも、似た者同士の同情ですか？
  event_goddessfall1_intermission_01_77:
    speaker: talkative
    en: I must protect Marian.
    ko: "[나는 마리안을 지켜야 하니까.]"
    ja: "「マリアンを壊すわけにはいかない」"
  event_goddessfall1_intermission_01_78:
    speaker: indivilia
    en: "... What did you say?"
    ko: "…뭐라고요?"
    ja: "…どういうことです？"
  event_goddessfall1_intermission_01_79:
    speaker: talkative
    en: Marian will be the Queen's next vessel.
    ko: "[마리안은 퀸의 다음 몸이 될 것이다.]"
    ja: "「マリアンは、クイーンの次のボディになる」"
  event_goddessfall1_intermission_01_80:
    speaker: talkative
    en: That means her body has to be kept in one piece.
    ko: "[온전해야 할 필요가 있다는 얘기지.]"
    ja: "「完全な状態で残しておく必要がある」"
  event_goddessfall1_intermission_01_81:
    speaker: indivilia
    en: Oh... I see.
    ko: 오… 그렇군요.
    ja: なるほど…そうでしたか。
  event_goddessfall1_intermission_01_82:
    speaker: talkative
    en: Marian has awakened as the Queen.
    ko: "[마리안은 퀸으로 각성했다. 준비가 되었다는 얘기다.]"
    ja: |-
      「マリアンはクイーンとして覚醒している。
      下準備はできたということだ」
  event_goddessfall1_intermission_01_83:
    speaker: talkative
    en: She's ready… to be the Queen's next vessel.
    ko: "[퀸의 다음 몸이 될 준비가.]"
    ja: "「クイーンの次のボディになるためのな」"
  event_goddessfall1_intermission_01_84:
    speaker: indivilia
    en: Heh, so that's why you cherished her so.
    ko: 후후. 그래서 그렇게 애지중지했던 것이군요.
    ja: |-
      ふふ…だからそんなに
      大切にしていたということですか。
  event_goddessfall1_intermission_01_85:
    speaker: indivilia
    en: What you needed... was a vessel capable of containing the Queen Gene.
    ko: 퀸 인자를 담을 수 있는 그릇… 이 필요했던 것이군요.
    ja: 必要だったものは…クイーン因子の器。
  event_goddessfall1_intermission_01_86:
    speaker: indivilia
    en: In other words... in addition to her brain, the Queen up there is also nearing
      the end of her body's lifespan?
    ko: 그렇다는 말은… 저 위에 있는 퀸께선 뇌에 이어 육체까지 그 수명이 다해가고 있다고 생각해도 되겠죠?
    ja: |-
      つまり…空の上のクイーンは、
      脳に続いて身体も寿命に近づいていると
      いうことですね？
  event_goddessfall1_intermission_01_87:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_intermission_01_88:
    speaker: indivilia
    en: Did you know? You always go silent when it comes to giving a difficult yes.
    ko: 그거 아시나요? 당신은 곤란한 긍정에는 언제나 입을 다문다는 걸.
    ja: |-
      知っていますか？あなたが静かになるのは、
      図星を突かれた時だけです。
  event_goddessfall1_intermission_01_89:
    speaker: indivilia
    en: Very well, I understand your glorious mission.
    ko: 좋아요. 당신의 빛나는 사명에 대해서는 잘 알았어요.
    ja: |-
      いいでしょう。あなたの輝かしく大事な
      使命については、よく分かりました。
  event_goddessfall1_intermission_01_90:
    speaker: indivilia
    en: But still...
    ko: 하지만….
    ja: しかし…
  event_goddessfall1_intermission_01_91:
    speaker: "<Narration>"
    en: "*Craaaaack!*"
    ko: 카가가가가각--!!
    ja: ズガガガガガッ…！！
  event_goddessfall1_intermission_01_92:
    speaker: marian_q
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_intermission_01_93:
    speaker: indivilia
    en: Surely, it wouldn't hurt...
    ko: 한 입.
    ja: 一口ぐらい…
  event_goddessfall1_intermission_01_94:
    speaker: indivilia
    en: to take a bite, now would it?
    ko: 정도는 괜찮잖아요?
    ja: それなら、問題ないでしょう？
  event_goddessfall1_intermission_01_95:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_intermission_01_96:
    speaker: indivilia
    en: The Queen Gene is contained in the core and the brain.
    ko: 퀸 인자가 담기는 곳은 코어와 뇌.
    ja: |-
      クイーン因子の器には、
      コアと脳さえあれば足ります。
  event_goddessfall1_intermission_01_97:
    speaker: indivilia
    en: As long as I avoid those, it should be fine.
    ko: 그곳만 피해서 먹는다면 문제없잖아요.
    ja: そこさえ避けておけば、問題ないはず。
  event_goddessfall1_intermission_01_98:
    speaker: indivilia
    en: She'll regenerate anyway, don't you think?
    ko: 어차피 재생할 텐데. 안 그래요?
    ja: どうせ再生しますから。でしょう？
  event_goddessfall1_intermission_01_99:
    speaker: indivilia
    en: And you're curious too, aren't you?
    ko: 그리고 당신도 기대되잖아요?
    ja: それに、あなたも興味があるのでは？
  event_goddessfall1_intermission_01_100:
    speaker: indivilia
    en: Think back to when Nihilister sprouted from your arm and incinerated those
      repulsive Pilgrims.
    ko: |-
      당신의 팔에서 돋아난 니힐리스타가,
      가증스러운 순례자들을 다 태워버린 때를 떠올려봐요.
    ja: |-
      あなたが腕からニヒリスターを生やして、
      鬱陶しいピルグリムどもを
      焼き払った時のこと、思い出してください。
  event_goddessfall1_intermission_01_101:
    speaker: indivilia
    en: What happens if you eat a body perfected as a Queen?
    ko: |-
      퀸으로 완성된 바디를 먹으면,
      어떻게 되는 거지?
    ja: |-
      クイーンとして完成したボディを食べれば、
      何が起こるのでしょう？
  event_goddessfall1_intermission_01_102:
    speaker: indivilia
    en: Aren't you dying to know?
    ko: 궁금하지 않나요?
    ja: 気になりませんか？
  event_goddessfall1_intermission_01_103:
    speaker: talkative
    en: That's... rather tempting.
    ko: "[그건… 구미가 당기는군.]"
    ja: "「確かに…興味はあるな」"
  event_goddessfall1_intermission_01_104:
    speaker: indivilia
    en: Hehe, right? Then where shall I begin...?
    ko: 후후. 그렇죠? 그럼 어디로 할까….
    ja: |-
      ふふ。そうでしょう？
      では、どこにしましょうか…
  event_goddessfall1_intermission_01_105:
    speaker: indivilia
    en: How about the arm?
    ko: 가볍게 팔부터 시작해 볼까요?
    ja: 手始めに、腕などはどうです？
  event_goddessfall1_intermission_01_106:
    speaker: "<Narration>"
    en: "*Slash!*"
    ko: 스칵!
    ja: ザシュッ！
  event_goddessfall1_intermission_01_107:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 툭.
    ja: ドサッ…
  event_goddessfall1_intermission_01_108:
    speaker: indivilia
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_goddessfall1_intermission_01_109:
    speaker: "<Narration>"
    en: Indivilia's tail falls to the ground.
    ko: 인디빌리아의 꼬리가 땅바닥에 떨어졌다.
    ja: インディビリアの尻尾が地面に落ちていた
  event_goddessfall1_intermission_01_110:
    speaker: "<Narration>"
    en: The severed portion twitches.
    ko: 잘려 나간 꼬리가 땅바닥에서 꿈틀댄다.
    ja: |-
      切断された尻尾が地をはうように
      うごめいている
  event_goddessfall1_intermission_01_111:
    speaker: indivilia
    en: "... What the...?"
    ko: "…뭐죠?"
    ja: "…何が…？"
  event_goddessfall1_intermission_01_112:
    speaker: indivilia
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall1_intermission_01_113:
    speaker: "<Narration>"
    en: "*Slash!*"
    ko: 스칵!
    ja: ザンッ！
  event_goddessfall1_intermission_01_114:
    speaker: "<Narration>"
    en: Indivilia jerks her head to the side.
    ko: 인디빌리아가 다급히 머리를 기울인다.
    ja: インディビリアが素早く頭をそらした
  event_goddessfall1_intermission_01_115:
    speaker: "<Narration>"
    en: A line slices across her neck,
    ko: 인디빌리아의 목에 선이 그어진다.
    ja: 首筋に引っかかれたような痕が伸びた
  event_goddessfall1_intermission_01_116:
    speaker: "<Narration>"
    en: and blood bursts from the half-severed wound.
    ko: 절반 정도 잘려 나간 목에서 피가 솟구쳐 나왔다.
    ja: |-
      それは首の半分ほどに及ぶ切り傷となり、
      液体を噴き出した
  event_goddessfall1_intermission_01_117:
    speaker: indivilia
    en: Urgh...! Hngh...!
    ko: 윽…! 크윽…!
    ja: うっ…！ぐっ…！
  event_goddessfall1_intermission_01_118:
    speaker: talkative
    en: "... What is this?"
    ko: "[…뭐냐 이건.]"
    ja: "「…何だ、これは」"
  event_goddessfall1_intermission_01_119:
    speaker: janghwa_n
    en: Now, don't move.
    ko: 자~ 움직이지 마.
    ja: ダメよ～、動かないで。
  event_goddessfall1_intermission_01_120:
    speaker: janghwa_n
    en: If you leave Marian as she is, I won't have to be rough with you.
    ko: 마리안을 그대로 두고 간다면, 거칠게 대하진 않을게.
    ja: |-
      その子を置いていけば、
      これ以上手荒なマネはしないわ。
  event_goddessfall1_intermission_01_121:
    speaker: talkative
    en: A human imposter...? What are you—
    ko: "[유사 인간…? 네놈은 뭐]"
    ja: "「人間もどきだと…？何者だ――」"
  event_goddessfall1_intermission_01_122:
    speaker: "<Narration>"
    en: "*Slash!*"
    ko: 스칵!
    ja: ザンッ！
  event_goddessfall1_intermission_01_123:
    speaker: "<Narration>"
    en: Chatterbox's head is split right down the middle.
    ko: 토커티브의 머리가 세로로 쪼개진다.
    ja: トーカティブの頭部が縦に割れた
  event_goddessfall1_intermission_01_124:
    speaker: talkative
    en: Hngh! Grrk...! Grrrkkk...!
    ko: "[그윽! 그륵…! 그르륵…!]"
    ja: "「ぐっ！うっ…！がぁっ…！」"
  event_goddessfall1_intermission_01_125:
    speaker: indivilia
    en: "... What the hell is going on?!"
    ko: "…이건 또 뭐야…."
    ja: "…何が起こっているのです…？"
  event_goddessfall1_intermission_01_126:
    speaker: "<Narration>"
    en: Rose steps forward.
    ko: 장화가 한 걸음 앞으로 내디딘다.
    ja: 薔花が一歩前に踏み出した
  event_goddessfall1_intermission_01_127:
    speaker: janghwa_n
    en: You're not running away?
    ko: 안 가는 거야?
    ja: 逃げないの？
  event_goddessfall1_intermission_01_128:
    speaker: janghwa_n
    en: Wow... For hybrids, you've got some serious guts.
    ko: 와아~ 잡종들치곤 제법 근성이 있네?
    ja: へえ～…雑種にしては、なかなか根性あるわね？
  event_goddessfall1_intermission_01_129:
    speaker: janghwa_n
    en: Well then, I guess I'll join in as well.
    ko: 그럼 나도 조금.
    ja: じゃあ、私もちょっとだけ…
  event_goddessfall1_intermission_01_130:
    speaker: janghwa_n
    en: Shall I give it my all?
    ko: 진심을 다해볼까.
    ja: 本気を出しちゃおうかしら。
  event_goddessfall1_intermission_01_131:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_intermission_01_132:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_intermission_01_133:
    speaker: "<Narration>"
    en: Indivilia and Chatterbox vanish in an instant.
    ko: 인디빌리아와 토커티브는 순식간에 사라졌다.
    ja: |-
      インディビリアとトーカティブが
      瞬く間に姿を消した
  event_goddessfall1_intermission_01_134:
    speaker: "<Narration>"
    en: Rose sheathes her broken sword.
    ko: 장화는 부러진 검을 검집에 집어넣었다.
    ja: 薔花が折れた剣をさやに収めた
  event_goddessfall1_intermission_01_135:
    speaker: janghwa_n
    en: It's over.
    ko: 끝났어.
    ja: 終わったわ。
  event_goddessfall1_intermission_01_136:
    speaker: janghwa_n
    en: Whew… I was wondering what I'd do if they had stayed.
    ko: 후우~ 안 가고 버티면 어쩔까 했네.
    ja: ふぅ～…粘られるかと思って焦っちゃった。
  event_goddessfall1_intermission_01_137:
    speaker: mirror_r
    en: Good job.
    ko: 수고하셨어요.
    ja: お疲れ様でした。
  event_goddessfall1_intermission_01_138:
    speaker: mirror_r
    en: Hmm... Marian doesn't look well.
    ko: 으음~ 마리안의 상태가 안 좋네요.
    ja: ですが、マリアンの状態がよくありませんね。
  event_goddessfall1_intermission_01_139:
    speaker: mirror_r
    en: Should we move her for now?
    ko: 일단 옮길까요?
    ja: ひとまず、運んでもらえますか？
  event_goddessfall1_intermission_01_140:
    speaker: janghwa_n
    en: You want me to do it?
    ko: 내가 해?
    ja: 私がやるの？
  event_goddessfall1_intermission_01_141:
    speaker: mirror_r
    en: That's not something I can do.
    ko: 제가 할 순 없으니까요.
    ja: 他にできる者がいませんから。
  event_goddessfall1_intermission_01_142:
    speaker: janghwa_n
    en: "*Sigh*... I've grown quite weary of getting blood on me."
    ko: 하아… 피 묻는 건 이제 질색인데.
    ja: はぁ…血が付くのはもうウンザリ。
event_goddessfall1_04_s:
  event_goddessfall1_04_s_1:
    speaker: "<Narration>"
    en: Carrying Nayuta, Mantra tears across the ground.
    ko: 만트라가 나유타를 싣고 지면을 달린다.
    ja: ナユタを乗せて、マントラが大地を駆けている
  event_goddessfall1_04_s_2:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_3:
    speaker: nayuta_m
    en: Foolish. So foolish.
    ko: 어리석도다. 어리석어.
    ja: なんと、なんと愚かな…
  event_goddessfall1_04_s_4:
    speaker: nayuta_m
    en: To falter in that instant... to be swayed by petty attachments ere a grand
      undertaking...
    ko: |-
      거기에서 손속을 두다니….
      대업을 앞에 두고 사사로운 정에 흔들리다니.
    ja: |-
      肝心の時に手を止めてしまった…
      大業を前にして、
      些細な情けにほだされるとは…
  event_goddessfall1_04_s_5:
    speaker: nayuta_m
    en: "... All these years hast been lived in vain."
    ko: "…그간의 세월을 헛되이 살았구나."
    ja: "…長い歳月を、むざむざ徒にしてしまった。"
  event_goddessfall1_04_s_6:
    speaker: "<Narration>"
    en: From afar, she watches the Raptures attacking Eden, and the flashes and explosions
      that repel them.
    ko: 먼 곳. 에덴을 공격하는 랩쳐들과 그를 막아내는 섬광과 폭발을 바라본다.
    ja: |-
      はるか彼方に、閃光と爆発が見えた。
      エデンとラプチャーの争いはまだ続いている
  event_goddessfall1_04_s_7:
    speaker: "<Narration>"
    en: Nayuta lowers her head.
    ko: 나유타의 고개가 떨구어진다.
    ja: ナユタは力なくうなだれた
  event_goddessfall1_04_s_8:
    speaker: nayuta_m
    en: "... I offer my deepest apologies... everyone."
    ko: "…모두… 송구하외다."
    ja: "…皆様…申し訳ない。"
  event_goddessfall1_04_s_9:
    speaker: "<Narration>"
    en: Mantra keeps running.
    ko: 만트라가 계속 달린다.
    ja: マントラは走り続けた
  event_goddessfall1_04_s_10:
    speaker: "<Narration>"
    en: As the landscape whips past in a rapid blur, Nayuta catches a glimpse of red
      streaking past her.
    ko: 빠르게 지나가는 풍경 속, 나유타는 붉은색이 스쳐 지나가는 것을 보았다.
    ja: |-
      通り過ぎる景色の中に、
      赤い影がまぎれていたような気がした
  event_goddessfall1_04_s_11:
    speaker: "<Narration>"
    en: She twists around and peers behind, but sees nothing.
    ko: 다급히 고개를 돌려 뒤를 바라보았지만 아무것도 보이지 않았다.
    ja: |-
      ナユタは急いで振り返ったが、
      それらしきものは見当たらない
  event_goddessfall1_04_s_12:
    speaker: "<Narration>"
    en: Mantra continues its relentless run.
    ko: 만트라가 계속 달린다.
    ja: マントラは構わず、さらに走り続けた
  event_goddessfall1_04_s_13:
    speaker: "<Narration>"
    en: Still, the red continues to flicker persistently on the edge of her vision.
    ko: 시선 한켠에 붉은색이 계속 스쳐 지나간다.
    ja: ナユタの視界の片隅に、何度も赤い影が映った
  event_goddessfall1_04_s_14:
    speaker: "<Narration>"
    en: Then, she spots a figure in the far distance, waving at her.
    ko: 그러기를 잠시, 나유타는 저 멀리서 자신을 향해 손을 흔들고 있는 누군가를 보았다.
    ja: |-
      しばらくして、ナユタは自身に向かって
      遠くから手を振る人影があることに気が付いた
  event_goddessfall1_04_s_15:
    speaker: "<Narration>"
    en: Without hesitation, Nayuta brings Mantra to a stop.
    ko: 나유타는 만트라를 멈춰 세웠다.
    ja: ナユタはマントラを止めた
  event_goddessfall1_04_s_16:
    speaker: nayuta_m
    en: "... Young Lady Mirror."
    ko: "…미러 소저."
    ja: "…ミラー。"
  event_goddessfall1_04_s_17:
    speaker: mirror_r
    en: It's been a while, Nayuta.
    ko: 오랜만이네요. 나유타.
    ja: お久しぶりですね、ナユタ。
  event_goddessfall1_04_s_18:
    speaker: nayuta_m
    en: "... Methinks there lieth some purpose in thy appearing afore me at this most
      particular juncture."
    ko: "…이 타이밍에 소인의 앞에 나타난 건 이유가 있을 것 같소만."
    ja: |-
      …今この時に私の前へ現れるというなら、
      何か理由があるのでしょう。
  event_goddessfall1_04_s_19:
    speaker: mirror_r
    en: That's correct.
    ko: 맞아요.
    ja: その通りです。
  event_goddessfall1_04_s_20:
    speaker: mirror_r
    en: Rose, will you bring her here?
    ko: 장화. 데려다주겠어요?
    ja: 薔花、渡してあげてください。
  event_goddessfall1_04_s_21:
    speaker: janghwa_n
    en: All right, all right.
    ko: 그래그래.
    ja: は～い。
  event_goddessfall1_04_s_22:
    speaker: "<Narration>"
    en: Rose appears from the bush, carrying Marian on her back.
    ko: 장화가 마리안을 둘러업고 수풀 안에서 나타났다.
    ja: マリアンを背負った薔花が、物陰から現れた
  event_goddessfall1_04_s_23:
    speaker: "<Narration>"
    en: She lays Marian on the ground.
    ko: 마리안이 바닥에 뉘어진다.
    ja: 薔花はマリアンを地面に下ろし、横たわらせた
  event_goddessfall1_04_s_24:
    speaker: nayuta_m
    en: "... Young Lady... Marian."
    ko: "…마리안… 소저."
    ja: "…これは…マリアンでは…"
  event_goddessfall1_04_s_25:
    speaker: nayuta_m
    en: What brings her hither... in thy company...? She was at the Crown Kingdom...
    ko: |-
      어째서 마리안 소저가 여기에… 그대들과….
      크라운 왕국에 있었던 것이….
    ja: |-
      なぜ彼女がここに…あなた方と…
      王国にいるはずでは…
  event_goddessfall1_04_s_26:
    speaker: nayuta_m
    en: And how came these injuries about...?
    ko: 그리고 이 상처는 대체….
    ja: それに、この傷はいったい…
  event_goddessfall1_04_s_27:
    speaker: mirror_r
    en: She was betrayed...
    ko: 배신당했거든요.
    ja: 裏切られた結果です。
  event_goddessfall1_04_s_28:
    speaker: mirror_r
    en: by Indivilia and Chatterbox.
    ko: 인디빌리아와 토커티브에게.
    ja: インディビリアとトーカティブに。
  event_goddessfall1_04_s_29:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_30:
    speaker: nayuta_m
    en: Young Lady Marian?
    ko: 마리안 소저가?
    ja: マリアンが？
  event_goddessfall1_04_s_31:
    speaker: nayuta_m
    en: Nay, I cannot fathom thy meaning.
    ko: 아니. 지금 당최 무슨 소리인지 이해가 가지 않소만.
    ja: いや、まるで話が見えませんね。
  event_goddessfall1_04_s_32:
    speaker: nayuta_m
    en: Betrayed, thou sayest? Those twain did assail the Crown Kingdom from the outset...
    ko: 배신이라니. 그 둘은 애초에 크라운 왕국을 습격….
    ja: |-
      裏切る以前の問題です。
      確か彼奴等は王国を襲撃して…
  event_goddessfall1_04_s_33:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_34:
    speaker: nayuta_m
    en: Verily, it cannot be...
    ko: 설마.
    ja: まさか…
  event_goddessfall1_04_s_35:
    speaker: mirror_r
    en: As expected of a bystander, you seem to catch on quickly.
    ko: 역시 방관자답게 상황 파악은 잘 되시나 봐요.
    ja: あなたらしい状況理解の速さですね。
  event_goddessfall1_04_s_36:
    speaker: nayuta_m
    en: Has Young Lady Marian... truly become the Queen?
    ko: 마리안 소저가… 퀸이 된 것이오?
    ja: マリアンは…クイーンに？
  event_goddessfall1_04_s_37:
    speaker: mirror_r
    en: Yes.
    ko: 예.
    ja: ええ。
  event_goddessfall1_04_s_38:
    speaker: mirror_r
    en: She has awakened. The Queen Gene has been activated.
    ko: |-
      각성했어요.
      퀸 인자가 활성화되었거든요.
    ja: |-
      彼女は覚醒しました。
      クイーン因子が活性化しています。
  event_goddessfall1_04_s_39:
    speaker: nayuta_m
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_04_s_40:
    speaker: mirror_r
    en: Because of the battle in the Crown Kingdom, Marian awakened the Queen Gene.
    ko: 크라운 왕국에서의 전투로 인해 마리안은 퀸 인자를 각성.
    ja: |-
      クラウン王国での戦いが
      きっかけとなったようですね。
  event_goddessfall1_04_s_41:
    speaker: mirror_r
    en: With Indivilia and Chatterbox under her command, she sensed the original Queen
      and came here.
    ko: |-
      인디빌리아와 토커티브를 거둬간 후,
      원래의 퀸을 느끼고는 이곳으로 왔어요.
    ja: |-
      本来のクイーンの存在を感じ取り、
      インディビリアとトーカティブを従えて
      ここまで来ていたのです。
  event_goddessfall1_04_s_42:
    speaker: mirror_r
    en: Heh... utterly reckless, but it shows she is fully aware of her role as the
      Queen.
    ko: 후후. 무모하기 짝이 없지만, 퀸으로서의 자각은 충분히 있다는 얘기겠죠.
    ja: |-
      ふふ…無謀この上ないですが、
      クイーンとしての自覚が
      十分な証拠とも言えるでしょう。
  event_goddessfall1_04_s_43:
    speaker: mirror_r
    en: She must have come to absorb and integrate the original Queen's genes.
    ko: 원래의 퀸이 가진 인자를 흡수 통합하기 위해서 온 것일 테니까.
    ja: |-
      彼女は本来のクイーンが持つ因子を吸収し、
      統合しようとしていたはず。
  event_goddessfall1_04_s_44:
    speaker: mirror_r
    en: Hmm... judging by her current state, that probably wasn't the wisest decision...
    ko: 뭐… 지금 상태로 봐선 옳은 판단은 아니었던 것 같지만….
    ja: |-
      まあ…この状態を見る限り、
      判断を誤ったようですが…
  event_goddessfall1_04_s_45:
    speaker: mirror_r
    en: Nevertheless, her intentions are admirable, don't you think?
    ko: 그 의도가 너무 기특하지 않나요?
    ja: それでも、立派な決意だと思いませんか？
  event_goddessfall1_04_s_46:
    speaker: nayuta_m
    en: Doth she yet live?
    ko: 살아 있소?
    ja: 命はまだ？
  event_goddessfall1_04_s_47:
    speaker: mirror_r
    en: Of course, she's only just awakened the Queen Gene, but she's still a Heretic.
    ko: 그럼요. 퀸 인자를 갓 깨우쳤다 뿐이지, 헬레틱은 헬레틱이니까요.
    ja: |-
      もちろんです。因子に目覚めただけで、
      ヘレティックには変わりありません。
  event_goddessfall1_04_s_48:
    speaker: mirror_r
    en: She's badly beaten and recovering slowly, but she's not dead.
    ko: 엉망으로 당해 회복이 더딜 뿐, 죽진 않았어요.
    ja: |-
      ダメージが大きく、
      回復が追いついていないだけです。
  event_goddessfall1_04_s_49:
    speaker: mirror_r
    en: Take her.
    ko: 데려가요.
    ja: 連れていってください。
  event_goddessfall1_04_s_50:
    speaker: mirror_r
    en: Take her with you, and protect her.
    ko: 데려가서, 보호해 줘요.
    ja: そして、守ってあげてください。
  event_goddessfall1_04_s_51:
    speaker: mirror_r
    en: Just so you know, it seems Marian wants to keep the fact that she's the Queen
      a secret.
    ko: |-
      혹시나 해서 말씀드리는 거지만,
      마리안은 퀸이라는 사실을 숨기고 싶어 하는 것 같으니.
    ja: |-
      念のために忠告しておきますが、
      クイーンであるという事実は
      隠したがっているようです。
  event_goddessfall1_04_s_52:
    speaker: mirror_r
    en: So please, don't go telling anyone once you get to Eden.
    ko: 괜히 에덴에 가서 발설하지 마시고요.
    ja: |-
      エデンでは秘密にしておいた方が
      いいでしょうね。
  event_goddessfall1_04_s_53:
    speaker: nayuta_m
    en: I shall bear that in mind.
    ko: 명심하겠소.
    ja: 肝に銘じておきましょう。
  event_goddessfall1_04_s_54:
    speaker: mirror_r
    en: Is there any other news?
    ko: 혹시 다른 소식은 없나요?
    ja: 何か、私が聞いておくべきことは？
  event_goddessfall1_04_s_55:
    speaker: nayuta_m
    en: Verily, I recall the Maleficent Beast Quartet is creating a Queen.
    ko: 사마수도 퀸을 만들고 있다고 [기억]하외다.
    ja: |-
      四魔獣もクイーンを
      生み出そうとしているという
      「記憶」があります。
  event_goddessfall1_04_s_56:
    speaker: mirror_r
    en: Oh, you mean the Four Beasts?
    ko: 아아. 포비스트요?
    ja: ああ、フォービーストですか…？
  event_goddessfall1_04_s_57:
    speaker: mirror_r
    en: That's fine. There's no way something like that could be made so easily.
    ko: 그건 괜찮아요. 그렇게 쉽게 만들어질 리가 없잖아요.
    ja: |-
      あちらは気にしないでください。
      そう簡単に生み出せるものではありません。
  event_goddessfall1_04_s_58:
    speaker: mirror_r
    en: A Queen isn't something you can create with such childish play, hehe.
    ko: 퀸이라는 게 그딴 소꿉장난으로 만들어질 리가. 후후.
    ja: 子どものおままごとではありませんから…ふふ。
  event_goddessfall1_04_s_59:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_60:
    speaker: nayuta_m
    en: "... Then comes the awakening of the Great Hero's gene..."
    ko: "…그렇다면 대협의 인자 각성은…."
    ja: "…とすると、旦那の因子が活性化していたのは…"
  event_goddessfall1_04_s_61:
    speaker: nayuta_m
    en: "... Might it be that it hath responded to Young Lady Marian?"
    ko: "…그런가. 마리안 소저에 반응한 것인가."
    ja: "…そうか、こちらに呼応したのか…"
  event_goddessfall1_04_s_62:
    speaker: mirror_r
    en: "??"
    ko: "??"
    ja: "？？"
  event_goddessfall1_04_s_63:
    speaker: nayuta_m
    en: Pray, hast thou any inkling of Young Lady Marian's awakening unto Queenhood?
    ko: 마리안 소저의 퀸 각성에 대해 짐작 가는 것이 있소?
    ja: 彼女の覚醒について、他に分かっていることは？
  event_goddessfall1_04_s_64:
    speaker: mirror_r
    en: I'd like to hear your thoughts first, Nayuta.
    ko: 나유타의 의견부터 들어보고 싶네요.
    ja: まずはあなたの考察を聞きましょうか。
  event_goddessfall1_04_s_65:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_66:
    speaker: nayuta_m
    en: The Queen beyond the heavens hath been absent for too long, so the Raptures
      upon Earth sought a new Queen.
    ko: |-
      천외의 퀸이 장시간 부재하여,
      지상의 랩쳐는 새로운 퀸을 원했소.
    ja: |-
      天外のクイーンが沈黙してから幾星霜、
      地上のラプチャーたちは
      新たなクイーンを望んだ。
  event_goddessfall1_04_s_67:
    speaker: nayuta_m
    en: The Queen Gene manifested within both Raptures and Heretics, thereby bestowing
      upon them the right to Queenship.
    ko: |-
      퀸 인자라는 것이 랩쳐와 헬레틱에게서 발현되어,
      퀸이 될 자격을 손에 넣었소.
    ja: |-
      やがてラプチャーやヘレティックの中から、
      クイーン因子、すなわち
      クイーンとなる資格を発現する個体が現れた。
  event_goddessfall1_04_s_68:
    speaker: nayuta_m
    en: Yet the Gene Reaper could not remain idle whilst this came to pass.
    ko: 하지만 인자 살해자 소저가 그것을 가만히 두고 보지 않았지.
    ja: |-
      しかし、新たなクイーンの出現を許さず、
      刈り取る者が存在する。
  event_goddessfall1_04_s_69:
    speaker: nayuta_m
    en: Whether she sensed, or perchance heard, the Queen Gene's emergence, none can
      say.
    ko: 퀸 인자가 발현된 객체를 느끼고, 아니 들은 것인가.
    ja: |-
      クイーン因子が発現した個体を感じ取る…
      いや、聞くといっていましたか。
  event_goddessfall1_04_s_70:
    speaker: nayuta_m
    en: Be that as it may, the Gene Reaper hath, unto this day, annihilated all who
      exhibited the Queen Gene.
    ko: 아무튼 인자 살해자 소저는 퀸 인자가 발현된 객체를 지금껏 남김없이 죽여왔소.
    ja: |-
      ともあれ、彼女は
      クイーン因子が発現した個体を、
      現在までひとつ残らず排除してきた。
  event_goddessfall1_04_s_71:
    speaker: nayuta_m
    en: If Young Lady Marian likewise manifested this Queen Gene, the Gene Reaper
      would ne'er have remained idle.
    ko: |-
      마리안 소저 역시 퀸 인자를 발현하였다면,
      인자 살해자 소저가 좌시하지 않았을 터인데.
    ja: |-
      マリアンがクイーン因子を発現したのであれば、
      当然彼女が黙っていないはず…
  event_goddessfall1_04_s_72:
    speaker: mirror_r
    en: Hmm... since you've deduced that far, the answer should be obvious, don't
      you think?
    ko: 음. 거기까지 추리하셨으면 답은 나와 있는 것 아닌가요?
    ja: |-
      あら。そこまで分かっているのなら、
      答えも出せるのでは？
  event_goddessfall1_04_s_73:
    speaker: nayuta_m
    en: "... The Queen Gene hath evolved."
    ko: "…진화한 거로군. 퀸 인자가."
    ja: "…進化したということですか。クイーン因子が。"
  event_goddessfall1_04_s_74:
    speaker: mirror_r
    en: That's correct.
    ko: 정답이에요.
    ja: その通りです。
  event_goddessfall1_04_s_75:
    speaker: mirror_r
    en: To survive the crazed Gene Reaper, it evolved to manifest itself in secret.
    ko: |-
      미치광이 같은 인자 살해자에게서 살아남기 위해,
      몰래 발현하는 방향으로 진화한 거죠.
    ja: |-
      恐るべき因子キラーの手から生き延びるため、
      密かに発現するよう進化したのでしょう。
  event_goddessfall1_04_s_76:
    speaker: mirror_r
    en: That shows how desperately the surface longed for a Queen.
    ko: 그만큼, 지상은 퀸을 원하고 있었으니까요.
    ja: |-
      それほどまでに、
      新たなクイーンは待ち望まれていたのです。
  event_goddessfall1_04_s_77:
    speaker: mirror_r
    en: Heh, and yet... the original Queen is descending from the sky.
    ko: 후후. 그런데. 하늘에서 원래의 퀸이 내려오고 있어요.
    ja: |-
      ふふ、ですが…空から元来のクイーンが
      還ってきてしまいました。
  event_goddessfall1_04_s_78:
    speaker: mirror_r
    en: Things are getting quite interesting.
    ko: 그림이 아주 재미있게 굴러가네요.
    ja: とても面白い構図です。
  event_goddessfall1_04_s_79:
    speaker: nayuta_m
    en: Thou findest all this interesting, verily?
    ko: 재밌소? 이 상황이.
    ja: 面白い？この状況が？
  event_goddessfall1_04_s_80:
    speaker: mirror_r
    en: Of course.
    ko: 그럼요.
    ja: そうでしょう？
  event_goddessfall1_04_s_81:
    speaker: mirror_r
    en: The sacrificial lamb for the coronation is coming down of her own accord.
      Isn't this delightful?
    ko: |-
      [대관]을 위한 제물이 스스로 내려오고 있으니까요.
      즐겁고 재밌지 않나요?
    ja: |-
      「戴冠」に必要ないけにえが、
      向こうから来てくれるのですから。
      都合が良すぎて笑いが出そうです。
  event_goddessfall1_04_s_82:
    speaker: mirror_r
    en: Nayuta, take good care of Marian until the day of the coronation.
    ko: |-
      그럼 나유타. 마리안을 잘 지켜줘요.
      대관의 그날까지.
    ja: |-
      では、ナユタ。マリアンを
      守ってあげてください。
      冠を戴くその日まで。
  event_goddessfall1_04_s_83:
    speaker: nayuta_m
    en: "... Verily, I shall."
    ko: "…그리하겠소."
    ja: "…言われずとも。"
  event_goddessfall1_04_s_84:
    speaker: mirror_r
    en: Then we'll continue observing from a distance.
    ko: 그럼 저희는 이만 또 먼발치에서 지켜볼게요.
    ja: 私たちは見物に戻ります。
  event_goddessfall1_04_s_85:
    speaker: nayuta_m
    en: Mightst thou consider offering thy assistance?
    ko: 도와줄 생각은 없으시오?
    ja: 助けようという気はないのですか？
  event_goddessfall1_04_s_86:
    speaker: mirror_r
    en: Don't make me laugh.
    ko: 농담도.
    ja: そんなことはしません。
  event_goddessfall1_04_s_87:
    speaker: mirror_r
    en: I want to be both a bystander and someone who intervenes at the decisive moment—
    ko: 저는 방관자임과 동시에, 결정적인 순간에 도움을 주는 포지션이 되길 원하거든요.
    ja: |-
      私は全てを眺めながら、
      決定的な瞬間に力を貸すだけでいいのです。
  event_goddessfall1_04_s_88:
    speaker: mirror_r
    en: just like right now.
    ko: 지금처럼요.
    ja: ちょうど、今のように。
  event_goddessfall1_04_s_89:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_90:
    speaker: mirror_r
    en: Let's go, Rose.
    ko: 가요. 장화.
    ja: 行きますよ、薔花。
  event_goddessfall1_04_s_91:
    speaker: janghwa_n
    en: Where are we going?
    ko: 어디로 가?
    ja: どこに？
  event_goddessfall1_04_s_92:
    speaker: mirror_r
    en: To the place with the best view of everything that's happening.
    ko: 이 모든 상황이 가장 잘 보이는 곳으로요.
    ja: 全てが見渡せる特等席へ。
  event_goddessfall1_04_s_93:
    speaker: nayuta_m
    en: "... I understand, Young Lady Mirror, but can Swordwarden aid us in the least?"
    ko: |-
      …미러 소저야 그렇다 치지만,
      호위 무사께선 좀 도와줄 수 있지 않겠소?
    ja: |-
      …あなた自身はともかくとして、
      お付きの方を貸していただけませんか？
  event_goddessfall1_04_s_94:
    speaker: nayuta_m
    en: Thy agility doth far surpass the ordinary, and thou wouldst prove of great
      assistance.
    ko: 몸놀림이 예사 수준이 아니었으니, 큰 도움이 될 것이외다.
    ja: |-
      尋常ならざる身のこなし、
      腕の立つ方とお見受けします。
  event_goddessfall1_04_s_95:
    speaker: janghwa_n
    en: No.
    ko: 싫어.
    ja: ダメよ。
  event_goddessfall1_04_s_96:
    speaker: janghwa_n
    en: If I step in, Scarlet will only be miserable.
    ko: 내가 나서면 련이가 불행해질 거야.
    ja: 私が関わったらレンが不幸になっちゃうもの。
  event_goddessfall1_04_s_97:
    speaker: nayuta_m
    en: She doth not seem particularly happy right now either.
    ko: 지금이라고 딱히 행복해보이진 않소만, 홍련 소저는.
    ja: |-
      紅蓮ですか？
      今もそれほど幸せそうには見えませんがねぇ。
  event_goddessfall1_04_s_98:
    speaker: janghwa_n
    en: At least, relatively speaking.
    ko: 상대적으로. 라는 의미야.
    ja: 今と比べて、ってこと。
  event_goddessfall1_04_s_99:
    speaker: janghwa_n
    en: If she sees me, she'll certainly be far worse off than she is now.
    ko: |-
      날 보면 련이는 반드시 불행해질 테니까.
      지금보다 훨씬.
    ja: |-
      私の姿を見たら、レンは必ず不幸になるわ。
      今よりずっと。
  event_goddessfall1_04_s_100:
    speaker: nayuta_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_s_101:
    speaker: janghwa_n
    en: That's why I don't want to.
    ko: 그래서 싫어.
    ja: だから、ダメ。
event_goddessfall1_04_e:
  event_goddessfall1_04_e_1:
    speaker: janghwa_n
    en: I have a question.
    ko: 질문이 있어.
    ja: 聞きたいことがあるの。
  event_goddessfall1_04_e_2:
    speaker: mirror_r
    en: Oh my, you have a question? That's quite unlike you.
    ko: 어머. 답지 않게 질문을 하시고.
    ja: あら。珍しいですね。
  event_goddessfall1_04_e_3:
    speaker: janghwa_n
    en: Now that the Queen has come into play, I can't just let it go.
    ko: |-
      퀸이라는 큰 소재가 생겼잖아.
      그냥 그렇구나하고 넘어갈 순 없을 것 같아서.
    ja: |-
      クイーンなんて、
      話が大きくなってきたから。
      さすがに「ふ～ん」では済まないでしょ。
  event_goddessfall1_04_e_4:
    speaker: mirror_r
    en: Fine, I'll answer as best I can.
    ko: 좋아요. 아는 선 안에서는 대답해 드릴게요.
    ja: |-
      いいでしょう。
      知識の及ぶ範囲でお答えします。
  event_goddessfall1_04_e_5:
    speaker: janghwa_n
    en: What is this "coronation" you speak of?
    ko: 대관이 뭐야?
    ja: 戴冠ってどういうこと？
  event_goddessfall1_04_e_6:
    speaker: mirror_r
    en: It's when one puts on the crown.
    ko: 왕관을 쓰는 것이죠.
    ja: 王冠を頭にいただくことです。
  event_goddessfall1_04_e_7:
    speaker: janghwa_n
    en: So, what you're saying is, you're helping Marian become the Queen?
    ko: 그렇다는 말은, 너는 마리안이 퀸이 되도록 돕는다는 거야?
    ja: |-
      つまり、あなたはマリアンを
      クイーンにしたいってこと？
  event_goddessfall1_04_e_8:
    speaker: mirror_r
    en: That's right.
    ko: 그래요.
    ja: ええ。
  event_goddessfall1_04_e_9:
    speaker: janghwa_n
    en: Why?
    ko: 왜?
    ja: なんで？
  event_goddessfall1_04_e_10:
    speaker: mirror_r
    en: Given the gravity of what we're discussing, could you put a bit more thought
      into your questions?
    ko: 규모가 큰 이야기를 하는데 좀 성의 있게 물어봐 주시면 안 되나요?
    ja: |-
      重大な話ですよ、
      もう少し真剣に尋ねてもらえませんか？
  event_goddessfall1_04_e_11:
    speaker: janghwa_n
    en: Whyyyyyy?
    ko: 왜에에에~?
    ja: なんでなんで～？
  event_goddessfall1_04_e_12:
    speaker: mirror_r
    en: What I meant was for you to add your own deductions, piece the situation together,
      and ask questions as you do so.
    ko: 본인의 추리를 섞어, 상황을 정리해 보며 질문해달라는 의미였어요.
    ja: |-
      理解していることを整理して、
      あなた自身の推理を聞かせてください。
  event_goddessfall1_04_e_13:
    speaker: janghwa_n
    en: Are all these things related to Scarlet?
    ko: 이 일련의 일들이 련이랑 관계있어?
    ja: クイーン絡みのことって、レンと関係ある？
  event_goddessfall1_04_e_14:
    speaker: mirror_r
    en: Probably not, I think.
    ko: 없을걸요. 아마.
    ja: ありません。おそらくは。
  event_goddessfall1_04_e_15:
    speaker: janghwa_n
    en: Then it's fine. I'm not interested.
    ko: 그럼 됐어. 관심 없어.
    ja: じゃ、いいわ。興味なーい。
  event_goddessfall1_04_e_16:
    speaker: mirror_r
    en: "... *Sigh*"
    ko: "…하아."
    ja: "…はぁ。"
  event_goddessfall1_04_e_17:
    speaker: mirror_r
    en: Listen carefully, Rose.
    ko: 잘 들어요 장화.
    ja: よく聞いてください、薔花。
  event_goddessfall1_04_e_18:
    speaker: janghwa_n
    en: Hehe. So eager to speak, aren't you?
    ko: 후후. 말하고 싶어 안달 난 주제에.
    ja: ふふ。話したくて仕方ないんでしょ。
  event_goddessfall1_04_e_19:
    speaker: mirror_r
    en: Because I'm tired of this. And I'm disappointed.
    ko: 질려서요. 실망했고.
    ja: 私はウンザリしたのです。それと失望も。
  event_goddessfall1_04_e_20:
    speaker: janghwa_n
    en: Disappointed in the Queen?
    ko: 퀸에게?
    ja: クイーンに？
  event_goddessfall1_04_e_21:
    speaker: mirror_r
    en: Yes.
    ko: 예.
    ja: ええ。
  event_goddessfall1_04_e_22:
    speaker: mirror_r
    en: Well... I understand she drifted through space for over a century because
      of an accident.
    ko: 뭐… 불의의 사고로 인해 우주 공간을 100여 년 동안 떠돈 건 알겠어요.
    ja: |-
      まあ…思わぬ成り行きで宇宙を100年もの間、
      漂うことになったという事情は分かります。
  event_goddessfall1_04_e_23:
    speaker: mirror_r
    en: I understand her brain was failing, and she needed a new one.
    ko: 뇌가 죽어가서 다른 뇌를 원한 것도 알겠어요.
    ja: |-
      脳に限界が来て、
      取り替える必要ができてしまったことも。
  event_goddessfall1_04_e_24:
    speaker: mirror_r
    en: Unfortunate, certainly. Unexpected, perhaps.
    ko: 불행한 일이죠. 예상 못 한 일이기도 했을 테고.
    ja: |-
      不幸な事故と言っていいでしょう。
      予測できる事態ではありません。
  event_goddessfall1_04_e_25:
    speaker: mirror_r
    en: But you see... since then, the Queen has become a coward.
    ko: 그런데 있잖아요. 그때 이후로 퀸은 겁쟁이가 되어버렸어요.
    ja: |-
      ですが、それからのクイーンは
      たいへんな臆病者になってしまいました。
  event_goddessfall1_04_e_26:
    speaker: mirror_r
    en: She could've corrected her orbit and descended to the surface right away.
    ko: 당장에 궤도를 수습해 지상으로 내려올 수 있었어요.
    ja: |-
      軌道を修正して地上に降下することは、
      すぐにでもできたはずです。
  event_goddessfall1_04_e_27:
    speaker: mirror_r
    en: But she didn't.
    ko: 그런데 그렇게 안 했어요.
    ja: でも、そうはしませんでした。
  event_goddessfall1_04_e_28:
    speaker: mirror_r
    en: Why? Because she was afraid.
    ko: 왜냐. 무서워서.
    ja: なぜでしょう？怖かったからです。
  event_goddessfall1_04_e_29:
    speaker: mirror_r
    en: '"What if Cinderella is still alive?"'
    ko: 신데렐라가 아직 살아있으면 어떡하지?
    ja: もし、シンデレラがまだ自分を狙っていたら？
  event_goddessfall1_04_e_30:
    speaker: mirror_r
    en: '"What if there''s something stronger than Cinderella?"'
    ko: 신데렐라보다 더욱 강한 뭔가가 있으면 어떡하지?
    ja: シンデレラよりも強い何かがいたら？
  event_goddessfall1_04_e_31:
    speaker: mirror_r
    en: Those fears stopped her from acting.
    ko: 라는 두려움 때문에 그러지 않았어요.
    ja: クイーンは恐れていたのです。
  event_goddessfall1_04_e_32:
    speaker: mirror_r
    en: As for the veil over her eyes, she could have torn it away if she truly wanted
      to.
    ko: 눈을 가리고 있던 장막… 물거품은 사실상 퀸이 마음만 먹었으면 부술 수 있었죠.
    ja: |-
      目隠しとなっていた水泡…膜も、
      その気になれば壊せたでしょう。
  event_goddessfall1_04_e_33:
    speaker: mirror_r
    en: But she didn't.
    ko: 그런데 그렇게 안 했어요.
    ja: しかし、それもしませんでした。
  event_goddessfall1_04_e_34:
    speaker: mirror_r
    en: Why? Because she was afraid.
    ko: 왜냐. 무서워서.
    ja: なぜでしょう？恐れているからです。
  event_goddessfall1_04_e_35:
    speaker: mirror_r
    en: '"What if I''m attacked while weakened, after lifting the veil?"'
    ko: 물거품을 부순 후 힘이 빠진 자신을 누가 어딘가에서 공격하면 어떡하지?
    ja: |-
      壊すために力を使った隙に、
      誰かに攻撃されたら？
  event_goddessfall1_04_e_36:
    speaker: mirror_r
    en: That fear left her frozen.
    ko: 라는 두려움 때문에 그러지 않았어요.
    ja: それを恐れて、動くことができません。
  event_goddessfall1_04_e_37:
    speaker: mirror_r
    en: Even with her vision blocked, she could have descended to the surface.
    ko: 시야가 가려졌어도 그대로 지상에 내려올 수 있었어요.
    ja: |-
      仮に目隠しをされたままでも、
      地上に戻ることはできたでしょう。
  event_goddessfall1_04_e_38:
    speaker: mirror_r
    en: Just adjusting her orbit would have been enough.
    ko: 사실상 궤도만 수정하면 되는 일이었으니까.
    ja: 実際、軌道さえ修正すればできることです。
  event_goddessfall1_04_e_39:
    speaker: mirror_r
    en: But she didn't.
    ko: 그런데 그렇게 안 했어요.
    ja: しかし、それもしませんでした。
  event_goddessfall1_04_e_40:
    speaker: mirror_r
    en: Why? Because she was afraid.
    ko: 왜냐. 무서워서.
    ja: なぜでしょう？恐れているからです。
  event_goddessfall1_04_e_41:
    speaker: mirror_r
    en: '"What if I fall because I can''t see?"'
    ko: 앞이 안 보여서 추락하면 어떡하지?
    ja: 目隠しのせいで、墜落したら？
  event_goddessfall1_04_e_42:
    speaker: mirror_r
    en: '"What if I land among them?"'
    ko: 앞이 안 보여서 착지한 곳에 [그것들]이 있으면 어떡하지?
    ja: 着陸した場所に「あれ」が待ち構えていたら？
  event_goddessfall1_04_e_43:
    speaker: janghwa_n
    en: Who are "they"?
    ko: "[그것들]?"
    ja: "「あれ」？"
  event_goddessfall1_04_e_44:
    speaker: mirror_r
    en: Oh, never mind that.
    ko: 아, 이건 잊어주세요.
    ja: いえ、その話は置いておきましょう。
  event_goddessfall1_04_e_45:
    speaker: mirror_r
    en: Anyway, she didn't come down to the surface because she was scared.
    ko: 아무튼 무서워서 지상으로 내려오지도 않았어요.
    ja: |-
      とにかく、クイーンは恐れのために、
      地上へ戻ることさえできませんでした。
  event_goddessfall1_04_e_46:
    speaker: mirror_r
    en: It was like that back then, and it's still the same now.
    ko: 지금도 마찬가지죠.
    ja: 今も同じです。
  event_goddessfall1_04_e_47:
    speaker: mirror_r
    en: She could come down this very instant and turn the tables, but instead, she
      just watches from way up above.
    ko: |-
      당장에 내려와서 뒤집어놓을 수 있음에도
      아득한 상공에서 상태를 지켜보고만 있잖아요.
    ja: |-
      今すぐ降下して戦うことも出来るはずなのに、
      はるかな空から様子を見守っているだけ。
  event_goddessfall1_04_e_48:
    speaker: mirror_r
    en: Why? Because she's a coward.
    ko: 왜냐. 겁쟁이라서.
    ja: なぜでしょう？臆病者だからです。
  event_goddessfall1_04_e_49:
    speaker: mirror_r
    en: '"What if Eden''s Spear is fired again?"'
    ko: 에덴의 창이 한 번 더 발사되면 어떡하지?
    ja: エデンの槍をもう一度撃たれたら？
  event_goddessfall1_04_e_50:
    speaker: mirror_r
    en: '"What if there''s more than one?"'
    ko: 에덴의 창이 하나가 아니면 어떡하지?
    ja: エデンの槍が一つだけでは無かったら？
  event_goddessfall1_04_e_51:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_52:
    speaker: mirror_r
    en: "... Because of Cinderella, the Queen lost her nerve."
    ko: "…신데렐라 때문에 퀸은 겁쟁이가 되어 버렸어요."
    ja: |-
      …シンデレラとの一件があった後、
      クイーンは臆病者になってしまいました。
  event_goddessfall1_04_e_53:
    speaker: mirror_r
    en: That fear left the surface with no Queen for far too long.
    ko: 퀸의 그 두려움 때문에 지상은 너무 오랫동안 퀸의 자리가 공석이 되었고.
    ja: |-
      クイーンが怖がっているせいで、
      地上を統制する者は長らく存在しません。
  event_goddessfall1_04_e_54:
    speaker: mirror_r
    en: The Raptures and Heretics started to run rampant.
    ko: 랩쳐는 물론 헬레틱들이 다들 멋대로 날뛰기 시작했죠.
    ja: |-
      ラプチャーはおろか、
      ヘレティックまで好き放題に暴れ始めました。
  event_goddessfall1_04_e_55:
    speaker: mirror_r
    en: I worked tirelessly to restore order.
    ko: 저는 그걸, 열심히 수습했고.
    ja: 私は必死に、その収拾を図ってきました。
  event_goddessfall1_04_e_56:
    speaker: janghwa_n
    en: Ugh, cleaning up after others is honestly the worst.
    ko: 저런. 남 뒷수습하는 게 정말 최악인데.
    ja: あ～…他人の後始末って最悪よね。
  event_goddessfall1_04_e_57:
    speaker: mirror_r
    en: You're telling me.
    ko: 그러게 말이예요.
    ja: まったくです。
  event_goddessfall1_04_e_58:
    speaker: mirror_r
    en: After spending far too much time doing that,
    ko: 그렇게 오래 지내다 보니.
    ja: そうして、長く過ごすうちに…
  event_goddessfall1_04_e_59:
    speaker: mirror_r
    en: I couldn't take it anymore.
    ko: 아 이거 못 하겠다 싶더라고요.
    ja: 私は見切りを付けました。
  event_goddessfall1_04_e_60:
    speaker: janghwa_n
    en: Yeah, that makes sense.
    ko: 응. 그럴 수 있지.
    ja: うーん…分かるわ、その気持ち。
  event_goddessfall1_04_e_61:
    speaker: mirror_r
    en: So I took it upon myself to make a Queen.
    ko: |-
      그래서 퀸을 만들기로 했어요.
      제 손으로.
    ja: |-
      そうして、新たなクイーンを
      生み出すことにしたのです。
      私自身の手で。
  event_goddessfall1_04_e_62:
    speaker: mirror_r
    en: Then... I tried a little of this and that.
    ko: 그래서 뭐… 이것저것 했죠.
    ja: その後は…様々な試行錯誤を重ねました。
  event_goddessfall1_04_e_63:
    speaker: mirror_r
    en: Fortunately, a Queen came into being.
    ko: 운이 좋아 마리안이라는 퀸이 탄생한 거고.
    ja: |-
      しかし幸い、マリアンという
      新たなクイーンの誕生まで
      たどり着くことができました。
  event_goddessfall1_04_e_64:
    speaker: mirror_r
    en: That's why I want to make Marian the Queen, no matter what it takes.
    ko: 저는 이 마리안을 무슨 수를 써서라도 퀸으로 만들고 싶거든요.
    ja: |-
      私は彼女を、どのような手を使ってでも
      クイーンにしたいのです。
  event_goddessfall1_04_e_65:
    speaker: janghwa_n
    en: And you don't want to be the Queen yourself?
    ko: 네가 직접 퀸이 될 생각은 없고?
    ja: 自分がクイーンになればいいんじゃないの？
  event_goddessfall1_04_e_66:
    speaker: mirror_r
    en: Pfft, as if.
    ko: 어머. 농담도.
    ja: あら。冗談ですよね？
  event_goddessfall1_04_e_67:
    speaker: mirror_r
    en: For starters, I'm nothing but a data-based lifeform with no corporeal body.
    ko: 일단 저는 데이터 생명체에 불과해서 실체가 없어요.
    ja: 私は実体を持たない、情報生命体に過ぎません。
  event_goddessfall1_04_e_68:
    speaker: mirror_r
    en: This form is just a mimic of the person whose personality data I'm based on.
    ko: 지금 이 모습도 제 인격 데이터의 기반이 된 것의 모습을 흉내 내고 있을 뿐이고요.
    ja: |-
      この姿さえ、基盤となっている人格の姿を
      模倣しているだけです。
  event_goddessfall1_04_e_69:
    speaker: mirror_r
    en: Honestly, that's just an excuse.
    ko: 뭐 사실 이건 대충 둘러대기용 답변이고.
    ja: |-
      とはいえ…実のところ、
      これはもっともらしい言い訳にすぎませんが。
  event_goddessfall1_04_e_70:
    speaker: mirror_r
    en: The truth is, I want someone I can control to be the Queen,
    ko: |-
      저는 제가 제어할 수 있는 존재가,
      퀸이 되길 원해요.
    ja: |-
      私は、私の制御が及ぶ存在を
      クイーンとして仕立て上げたいのです。
  event_goddessfall1_04_e_71:
    speaker: mirror_r
    en: so I can watch from the sidelines while still intervening at crucial moments.
    ko: 제가 방관자가 됨과 동시에, 결정적인 순간에 도움을 줄 수 있게.
    ja: |-
      私自身は傍観者であると同時に、
      決定的な時だけ背中を押す存在として。
  event_goddessfall1_04_e_72:
    speaker: janghwa_n
    en: In other words, you want a puppet?
    ko: 꼭두각시가 필요한 거구나?
    ja: 操り人形が欲しいってことね？
  event_goddessfall1_04_e_73:
    speaker: mirror_r
    en: That's right.
    ko: 그렇죠.
    ja: その通りです。
  event_goddessfall1_04_e_74:
    speaker: janghwa_n
    en: Like me?
    ko: 나 같은?
    ja: 私みたいな？
  event_goddessfall1_04_e_75:
    speaker: mirror_r
    en: Don't put yourself down like that.
    ko: 무슨 섭섭한 말씀을.
    ja: そう言われてしまうと寂しいですね。
  event_goddessfall1_04_e_76:
    speaker: mirror_r
    en: The reason why I revived you is very obvious.
    ko: 제가 장화 당신을 되살린 이유는 명확해요.
    ja: |-
      あなたを選んだことには、
      明確な理由があるのですよ。
  event_goddessfall1_04_e_77:
    speaker: mirror_r
    en: You can cut down Raptures, human imposters, and humans alike.
    ko: 당신은 랩쳐든, 유사 인간이든, 인간이든 모두 벨 수 있으니까.
    ja: |-
      あなたはラプチャーも、人間もどきも、
      そして人間も、すべてを斬ることができる。
  event_goddessfall1_04_e_78:
    speaker: mirror_r
    en: You are, quite literally, my bodyguard and my sword.
    ko: 말 그대로, 제 호위 무사이자 제 검인 셈이죠.
    ja: 私の護衛、私の剣として、ふさわしい存在です。
  event_goddessfall1_04_e_79:
    speaker: janghwa_n
    en: Isn't that what you'd call a puppet?
    ko: 그걸 꼭두각시라고 하지 않아?
    ja: それこそ操り人形ってことじゃない？
  event_goddessfall1_04_e_80:
    speaker: mirror_r
    en: I prefer the term "proxy".
    ko: 대행. 이라고 해두죠.
    ja: 代行者、とでも呼んでおきましょう。
  event_goddessfall1_04_e_81:
    speaker: mirror_r
    en: Hehe. Do you know the one thing I learned from my base personality data?
    ko: 후후. 제가 제 인격 데이터의 기반에서 유일하게 배운 게 뭔지 아시나요?
    ja: |-
      ふふ…私の基盤となった人物から
      たった一つ学んだことがあります。
      何か分かりますか？
  event_goddessfall1_04_e_82:
    speaker: mirror_r
    en: Never lose your patience, and never take matters into your own hands at critical
      moments.
    ko: 결정적인 순간에 참지 못하고 직접 나서지 말 것. 이예요.
    ja: |-
      大事な瞬間には、
      自分を抑えて前に出ないこと。
      これだけです。
  event_goddessfall1_04_e_83:
    speaker: mirror_r
    en: If someone else had handled it from the start, there would have been no risk
      at all.
    ko: 애초부터, 남한테 시켰으면 위험할 일도 없었을 텐데 말이죠.
    ja: |-
      最初から誰かに任せていれば、
      破滅することもなかったでしょうに。
  event_goddessfall1_04_e_84:
    speaker: janghwa_n
    en: Now who's the coward?
    ko: 여기 겁쟁이가 또 하나 있네.
    ja: 臆病者がここにもいるみたいね。
  event_goddessfall1_04_e_85:
    speaker: mirror_r
    en: I'm not like that coward up there.
    ko: 저는 저 위의 겁쟁이와는 달라요.
    ja: 私は、空の上のあれとは違います。
  event_goddessfall1_04_e_86:
    speaker: mirror_r
    en: I don't just tremble in fear. Instead, I prepare for what comes next.
    ko: |-
      그저 겁만 내는 것이 아니라,
      뒤를 준비하고 있죠.
    ja: |-
      ただ恐れるのではなく、
      未来に向けて備えているのですから。
  event_goddessfall1_04_e_87:
    speaker: mirror_r
    en: Isn't that far more forward-thinking?
    ko: 훨씬 진취적이지 않나요?
    ja: はるかに前向きだと思いませんか？
  event_goddessfall1_04_e_88:
    speaker: papillon
    en: Supplies are here!
    ko: 보급 왔어!
    ja: 補給よ！
  event_goddessfall1_04_e_89:
    speaker: harran
    en: Oh, thank you. Place them there.
    ko: 오, 고맙구나. 거기 두렴.
    ja: あら、助かるわ。そこに置いて。
  event_goddessfall1_04_e_90:
    speaker: snowwhite
    en: How about the bread and meat?
    ko: 빵과 고기는?
    ja: パンと肉は？
  event_goddessfall1_04_e_91:
    speaker: papillon
    en: Open wide! Here it comes!
    ko: 입벌려! 던진다!
    ja: 口開けなさい！投げるわよ！
  event_goddessfall1_04_e_92:
    speaker: "<Narration>"
    en: "*Chomp!*"
    ko: 텁-!
    ja: パクッ――！
  event_goddessfall1_04_e_93:
    speaker: snowwhite
    en: |-
      !!
      Delicious!
    ko: |-
      !!
      맛있군!
    ja: |-
      ！！
      うまい！
  event_goddessfall1_04_e_94:
    speaker: papillon
    en: Do you have enough ingredients?
    ko: 에센스 재료는 충분해?
    ja: エッセンスの素材は足りてる？
  event_goddessfall1_04_e_95:
    speaker: harran
    en: I'm fine for now. Do bring some next time, if you please.
    ko: |-
      지금은 괜찮단다.
      다음에 올 때 챙겨주면 고맙겠구나.
    ja: |-
      今は十分よ。
      次に来た時はあると助かるわ。
  event_goddessfall1_04_e_96:
    speaker: harran
    en: They're in my room—
    ko: 위치는 내 방
    ja: 場所は私の部屋の――
  event_goddessfall1_04_e_97:
    speaker: papillon
    en: It's the second one from the bottom in the biggest box, right? I'll grab it
      next time.
    ko: 제일 큰 상자 아래에서 두 번째에 있지? 다음에 올 때 챙겨올게!
    ja: |-
      一番大きな箱の下から2番目でしょ？
      次に持ってくるわ！
  event_goddessfall1_04_e_98:
    speaker: harran
    en: "... How did you know that?"
    ko: "…어떻게 아니?"
    ja: "…なぜ知っているの？"
  event_goddessfall1_04_e_99:
    speaker: papillon
    en: Don't you remember? I'm a spy!
    ko: 몰랐어? 나 스파이잖아!
    ja: 知らなかった？私、スパイだから！
  event_goddessfall1_04_e_100:
    speaker: papillon
    en: Anyhoo, I'm off! Take care!
    ko: 간다! 수고해!
    ja: じゃ！頑張って！
  event_goddessfall1_04_e_101:
    speaker: "<Narration>"
    en: Harran absentmindedly watches Papillon run off, laden with supplies.
    ko: 하란은 짐을 잔뜩 짊어진 채 뛰어가는 파피용을 물끄러미 바라보았다.
    ja: |-
      ハランは大量の荷物を背負って駆けまわる
      パピヨンを凝視していた
  event_goddessfall1_04_e_102:
    speaker: harran
    en: Hmm...
    ko: "…흐음."
    ja: "…へえ…"
  event_goddessfall1_04_e_103:
    speaker: snowwhite
    en: If you have coolant, hand it over.
    ko: 냉각수가 있다면 다오.
    ja: 冷却水があれば、くれ。
  event_goddessfall1_04_e_104:
    speaker: harran
    en: Snow White, that's not for consumption.
    ko: 스노우 화이트야. 그건 먹으면 안 된단다.
    ja: スノーホワイト、飲み物じゃないのよ。
  event_goddessfall1_04_e_105:
    speaker: snowwhite
    en: "... It's to keep me from overheating; I'm not going to consume it."
    ko: "…과열을 식히기 위해서다. 안 먹는다."
    ja: "…飲まない。冷却用だ。"
  event_goddessfall1_04_e_106:
    speaker: harran
    en: "... Oh, sorry."
    ko: "…아. 미안하구나."
    ja: "…あら、失礼。"
  event_goddessfall1_04_e_107:
    speaker: harran
    en: Hmm. It hardly seems to be decreasing.
    ko: 흠. 좀처럼 줄어들지 않는구나.
    ja: まったく…なかなか減らないわねえ。
  event_goddessfall1_04_e_108:
    speaker: snowwhite
    en: Yeah. They keep coming endlessly.
    ko: 그래. 끝없이 몰려오는군.
    ja: ああ。キリがないな。
  event_goddessfall1_04_e_109:
    speaker: "<Narration>"
    en: Harran swings her scythe.
    ko: 하란이 낫을 휘두른다.
    ja: ハランが鎌を振りかざした
  event_goddessfall1_04_e_110:
    speaker: "<Narration>"
    en: A black mist spreads out, visibly slowing the Raptures.
    ko: 검은 안개가 퍼져나가자, 랩쳐들의 움직임이 눈에 띄게 둔해진다.
    ja: |-
      黒い霧が広がり、ラプチャーの動きが
      見てわかるほどに鈍くなった
  event_goddessfall1_04_e_111:
    speaker: harran
    en: Guess we'll need one hell of a big shot to turn this around, huh?
    ko: 뒤집으려면 역시 큰 거 한방이 필요하겠지?
    ja: 戦況を変えるには…大きな一撃が必要よね？
  event_goddessfall1_04_e_112:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰아앙-!!
    ja: ドゴォン――
  event_goddessfall1_04_e_113:
    speaker: "<Narration>"
    en: Snow White's Seven Dwarves spew fire, and the Raptures are swept away.
    ko: |-
      스노우 화이트의 세븐스 드워프가 불을 내뿜는다.
      랩쳐들이 쓸려나간다.
    ja: |-
      すかさず放たれたスノーホワイトの
      セブンスドワーフによる一撃が、
      ラプチャーをなぎ払った
  event_goddessfall1_04_e_114:
    speaker: snowwhite
    en: Do we have any way to handle this?
    ko: 수단이 있나?
    ja: 手立てがあるのか？
  event_goddessfall1_04_e_115:
    speaker: harran
    en: Hmm, doesn't seem like there's anything right now.
    ko: 글쎄. 지금으로서는 딱히 없는 것 같구나.
    ja: どうかしら。今のところは思いつかないわね。
  event_goddessfall1_04_e_116:
    speaker: snowwhite
    en: Then all we can do is hold them off until someone finds a solution.
    ko: 그럼 누군가가 답을 찾기 전까지 막아낼 뿐이다.
    ja: ならば、誰かが思いつくまで防ぐのみだ。
  event_goddessfall1_04_e_117:
    speaker: harran
    en: All right. Let's give it our all, shall we?
    ko: 좋구나. 힘내보자꾸나.
    ja: そうね。張り切っていきましょう？
  event_goddessfall1_04_e_118:
    speaker: papillon
    en: Supplies are here!
    ko: 보급이야!
    ja: 補給よ！
  event_goddessfall1_04_e_119:
    speaker: isabel
    en: Bring the energy packs over here.
    ko: 에너지 팩은 이리로 줘.
    ja: エネルギーパックをこっちにちょうだい。
  event_goddessfall1_04_e_120:
    speaker: papillon
    en: Where's Scarlet?
    ko: 홍련은?
    ja: 紅蓮は？
  event_goddessfall1_04_e_121:
    speaker: isabel
    en: Over there.
    ko: 저기.
    ja: あそこよ。
  event_goddessfall1_04_e_122:
    speaker: "<Narration>"
    en: Papillon looks toward where Isabel is pointing.
    ko: 이사벨이 가리킨 곳을 파피용이 바라본다.
    ja: パピヨンはイサベルの指さす先を見た
  event_goddessfall1_04_e_123:
    speaker: "<Narration>"
    en: Scarlet swings her sword like she's dancing at the center of the Rapture horde.
    ko: 홍련은 랩쳐의 무리 중심에서 춤을 추듯 검을 휘두르고 있다.
    ja: |-
      紅蓮がラプチャーの群れの中心で、
      踊るように剣を振るっている
  event_goddessfall1_04_e_124:
    speaker: papillon
    en: "... She's still out there? Isn't she gonna get some supplies?"
    ko: "…쟤 계속 저기에 나가 있는 거야? 보급받으러 안 와?"
    ja: "…ずっとあんなとこで戦ってるの？補給は？"
  event_goddessfall1_04_e_125:
    speaker: isabel
    en: She already came back twice.
    ko: 두 번 왔었어.
    ja: 2回取りに戻って来たわ。
  event_goddessfall1_04_e_126:
    speaker: isabel
    en: Each time, she had a drink and went back out.
    ko: 와서, 술 한잔 마시고 다시 나갔지.
    ja: ついでにお酒も飲んでいったわね。
  event_goddessfall1_04_e_127:
    speaker: papillon
    en: So alcohol is basically her fuel?
    ko: 그 정도면 술이 연료인 것 아냐?
    ja: お酒を燃料にしてるのかしら？
  event_goddessfall1_04_e_128:
    speaker: isabel
    en: I suppose so.
    ko: 그럴지도.
    ja: そうかもしれないわ。
  event_goddessfall1_04_e_129:
    speaker: papillon
    en: Oh. Hold still, I've got this.
    ko: 아, 가만있어. 내가 할게.
    ja: ああ、貸して。私がやるわ。
  event_goddessfall1_04_e_130:
    speaker: "<Narration>"
    en: Papillon lifts an energy pack and injects it into Isabel's feather.
    ko: 파피용이 에너지 팩을 들어 이사벨의 페더에 주입한다.
    ja: |-
      パピヨンがエネルギーパックを
      イサベルのフェザーに装填した
  event_goddessfall1_04_e_131:
    speaker: isabel
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ。"
  event_goddessfall1_04_e_132:
    speaker: papillon
    en: Tired?
    ko: 힘들어?
    ja: キツい？
  event_goddessfall1_04_e_133:
    speaker: isabel
    en: I am.
    ko: 힘들어.
    ja: そうね。
  event_goddessfall1_04_e_134:
    speaker: papillon
    en: You've got this.
    ko: 힘내.
    ja: 頑張って。
  event_goddessfall1_04_e_135:
    speaker: isabel
    en: "... What's come over you?"
    ko: "…무슨 바람이 분 거야?"
    ja: "…どういう風の吹き回し？"
  event_goddessfall1_04_e_136:
    speaker: papillon
    en: Nothing much. Just doing my thing.
    ko: |-
      무슨 바람이 불어.
      그냥 하는 거지.
    ja: |-
      風も何もないわ。
      できることをやってるだけよ。
  event_goddessfall1_04_e_137:
    speaker: papillon
    en: As you know, combat isn't my specialty.
    ko: 알다시피 나는 전투는 전공이 아니거든.
    ja: 知ってると思うけど、戦闘は専門外だし。
  event_goddessfall1_04_e_138:
    speaker: papillon
    en: So I'll run supplies until my feet are sore, or do whatever grunt work Cecil
      gives me.
    ko: |-
      발바닥에 땀나도록 보급이나 뛰어야지.
      세실이 시키는 허드렛일이나 하고.
    ja: |-
      補給の手伝いで走り回るぐらいはしなきゃ。
      あとは、セシルに頼まれた雑用もあるわね。
  event_goddessfall1_04_e_139:
    speaker: isabel
    en: You could always run away.
    ko: 도망가는 방법도 있어.
    ja: 逃げるという手もあるわ。
  event_goddessfall1_04_e_140:
    speaker: papillon
    en: You want me to cross that sea of Raptures? Don't be ridiculous. I'm no Pilgrim.
    ko: |-
      저 랩쳐들의 바다를 건너서 도망가라고?
      농담하지 마. 어딘가의 필그림이 아니라고 나는.
    ja: |-
      あんなラプチャーの海を抜けて？
      冗談でしょ、私はピルグリムじゃないの。
  event_goddessfall1_04_e_141:
    speaker: isabel
    en: There is a route. You can see it too, can't you?
    ko: 루트는 있어. 너도 보면 알잖아.
    ja: |-
      抜け道はあるわ。
      あなたなら見れば分かるはずよ。
  event_goddessfall1_04_e_142:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_143:
    speaker: isabel
    en: Aren't you running away?
    ko: 왜 도망 안 가?
    ja: なぜ逃げないの？
  event_goddessfall1_04_e_144:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_145:
    speaker: papillon
    en: If I manage to see the Queen, I could get fast-tracked for promotion, right?
    ko: 퀸을 보고 가면 고속 승진할 수 있을 테니까?
    ja: |-
      クイーンを見てから戻れば、
      大手柄にできるから？
  event_goddessfall1_04_e_146:
    speaker: papillon
    en: Eden, a Pilgrim, and the Queen—that's gotta be worth a triple rank jump, don't
      you think?
    ko: 에덴에, 필그림에, 퀸이면 3계급 정도는 점프하지 않겠어?
    ja: |-
      エデンに、ピルグリムに、クイーンの情報で…
      3階級くらいは飛ばせそうでしょ？
  event_goddessfall1_04_e_147:
    speaker: isabel
    en: Haha, I suppose so.
    ko: 후후. 그렇겠네.
    ja: ふふ…そうね。
  event_goddessfall1_04_e_148:
    speaker: isabel
    en: How's Eden doing?
    ko: 에덴의 상태는 어때?
    ja: エデンの状況は？
  event_goddessfall1_04_e_149:
    speaker: papillon
    en: They say Eden's Spear will be ready in about two hours.
    ko: 2시간 정도면 쓸 수 있다고 해. 에덴의 창.
    ja: |-
      あと2時間ぐらいで使えるらしいわ。
      エデンの槍。
  event_goddessfall1_04_e_150:
    speaker: isabel
    en: "... Two hours."
    ko: "…2시간."
    ja: "…2時間。"
  event_goddessfall1_04_e_151:
    speaker: papillon
    en: That should be doable, right? Since you're all nutjobs, anyway.
    ko: |-
      2시간이면 할만하지?
      너희들 다 미쳤잖아.
    ja: |-
      2時間ぐらいならやれるでしょ？
      あなたたち、みーんなイカれてるもの。
  event_goddessfall1_04_e_152:
    speaker: isabel
    en: Of course.
    ko: 물론이야.
    ja: もちろんよ。
  event_goddessfall1_04_e_153:
    speaker: "<Narration>"
    en: "*Beep beep*"
    ko: 삐빗-
    ja: ピピッ――
  event_goddessfall1_04_e_154:
    speaker: papillon
    en: All right, recharge complete.
    ko: 좋아. 충전 완료.
    ja: はい、チャージ完了。
  event_goddessfall1_04_e_155:
    speaker: isabel
    en: Than—
    ko: 고마
    ja: ありが――
  event_goddessfall1_04_e_156:
    speaker: "<Narration>"
    en: "*Slap!*"
    ko: 짜악-!
    ja: パチーン！
  event_goddessfall1_04_e_157:
    speaker: "<Narration>"
    en: Papillon smacks Isabel hard on the butt.
    ko: 파피용이 이사벨의 엉덩이를 후려쳤다.
    ja: パピヨンがイサベルの尻を勢いよく叩いた
  event_goddessfall1_04_e_158:
    speaker: papillon
    en: All right! Let's get moving!
    ko: 좋아! 출발!
    ja: はい！行ってらっしゃい！
  event_goddessfall1_04_e_159:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_160:
    speaker: papillon
    en: "... Did that hurt?"
    ko: "…아팠어?"
    ja: "…強すぎた？"
  event_goddessfall1_04_e_161:
    speaker: isabel
    en: "... Next time, give me a heads-up."
    ko: "…다음부턴 얘기하고 해."
    ja: "…次は声をかけてからにして。"
  event_goddessfall1_04_e_162:
    speaker: "<Narration>"
    en: Isabel shoots up into the sky in an instant.
    ko: 이사벨이 순식간에 하늘로 솟아오른다.
    ja: イサベルが瞬く間に空中へ飛び上がり
  event_goddessfall1_04_e_163:
    speaker: "<Narration>"
    en: Heading toward the battlefield, she tears through the sky.
    ko: 전장으로 향한 후, 하늘을 헤집는다.
    ja: 戦場の空へ舞い戻った
  event_goddessfall1_04_e_164:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_165:
    speaker: "<Narration>"
    en: Scarlet lands in front of Papillon.
    ko: 홍련이 파피용의 앞에 착지한다.
    ja: |-
      入れ替わりに跳び下がってきた紅蓮が
      パピヨンの前に降りた
  event_goddessfall1_04_e_166:
    speaker: hongryeon
    en: Hah... Since Lady Isabel hath come, I'll bide me here a spell and take mine
      ease.
    ko: 후우… 이사벨 낭자가 온 김에 잠깐만 쉬었다 가겠네.
    ja: |-
      ふぅ…イサベルお嬢ちゃんに代わってもらって
      少しだけ休むとしよう。
  event_goddessfall1_04_e_167:
    speaker: papillon
    en: Do you need supplies?
    ko: 보급 필요해?
    ja: 補給はいる？
  event_goddessfall1_04_e_168:
    speaker: hongryeon
    en: Pray, pour me a drink.
    ko: 술 좀 주게.
    ja: 酒をもらおうかね。
  event_goddessfall1_04_e_169:
    speaker: papillon
    en: Here. I've warmed it up for you.
    ko: 여기. 데워놨어.
    ja: はい。温めてあるから。
  event_goddessfall1_04_e_170:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_171:
    speaker: papillon
    en: "... Something wrong?"
    ko: "…왜 그래?"
    ja: "…どうしたの？"
  event_goddessfall1_04_e_172:
    speaker: hongryeon
    en: To sip warm spirits in the midst of battle, 'tis indeed a rare luxury.
    ko: 전투 중 뜨거운 술을 마실 수 있다니, 이것 참 호사스럽군.
    ja: |-
      戦場で熱かんをいただけるとは、
      ぜいたくだねぇ。
  event_goddessfall1_04_e_173:
    speaker: hongryeon
    en: I shall partake most gratefully, Lady Papillon.
    ko: 감사히 마시겠네, 파피용 낭자.
    ja: 礼を言おう、お嬢ちゃん。
  event_goddessfall1_04_e_174:
    speaker: papillon
    en: Take your time. I'll head to my next post.
    ko: |-
      천천히 마시고 가.
      난 다음으로 갈 테니까.
    ja: |-
      ゆっくり飲んで。
      私は次の場所に行くから。
  event_goddessfall1_04_e_175:
    speaker: hongryeon
    en: Heh, thou hadst a rough time.
    ko: 그래. 고생이 많네.
    ja: ああ、ご苦労様だね。
  event_goddessfall1_04_e_176:
    speaker: "<Narration>"
    en: Scarlet absentmindedly watches Papillon run off, laden with supplies.
    ko: 홍련은 짐을 잔뜩 짊어진 채 뛰어가는 파피용을 물끄러미 바라보았다.
    ja: |-
      紅蓮は大量の荷物を背負って駆け去る
      パピヨンの背中を見送った
  event_goddessfall1_04_e_177:
    speaker: hongryeon
    en: "*Sip*"
    ko: 후룩.
    ja: ゴクッ――
  event_goddessfall1_04_e_178:
    speaker: hongryeon
    en: Ahh...
    ko: "…크으."
    ja: "…くぅ～…"
  event_goddessfall1_04_e_179:
    speaker: hongryeon
    en: Well then, let us take up our sport anew.
    ko: 자, 그럼 또 가보실까.
    ja: さて、戻るとしようか。
  event_goddessfall1_04_e_180:
    speaker: "<Narration>"
    en: Scarlet sets her cup down, adjusts her grip on her sword, and charges at the
      Raptures.
    ko: 홍련은 잔을 내려놓은 채, 검을 고쳐 쥐고 랩쳐들을 향해 달려 나갔다.
    ja: |-
      紅蓮は杯を置いて剣をつかみ、
      ラプチャーの群れに飛び込んでいった
  event_goddessfall1_04_e_181:
    speaker: papillon
    en: Supplies!
    ko: 보급!
    ja: 補給！
  event_goddessfall1_04_e_182:
    speaker: papillon
    en: "*Pant!* *Pant!* Why are you all the way up here?!"
    ko: 헥…! 헥…! 너희는 왜 이만큼 꼭대기에 있는 거야…!
    ja: |-
      はぁ…！はぁ…！
      あんたたち、なんでこんな
      高いところにいるのよ…！？
  event_goddessfall1_04_e_183:
    speaker: rapunzel
    en: We never know when the Queen might fire her beam.
    ko: 퀸이 언제 빔 포격을 할지도 모르니까요.
    ja: クイーンの砲撃がいつ来るか分かりませんから。
  event_goddessfall1_04_e_184:
    speaker: noah
    en: Pfft, of course we'll block it.
    ko: 뭐 당연히 막아내겠지만.
    ja: まっ、ラクショーで防げるけどね。
  event_goddessfall1_04_e_185:
    speaker: papillon
    en: "... You two are going to block that? That thing's huge! How's that even possible?"
    ko: |-
      …그걸 너희 둘이서 막는다고?
      가능해? 엄청 크던데.
    ja: |-
      …2人だけで？
      本当に大丈夫なの？あんなヤバいもの。
  event_goddessfall1_04_e_186:
    speaker: rapunzel
    en: At the very least, we should be able to protect Eden's Spear.
    ko: 적어도 에덴의 창은 지킬 수 있을 테니까요.
    ja: 少なくとも、エデンの槍は守れるはずです。
  event_goddessfall1_04_e_187:
    speaker: rapunzel
    en: "... Well, that is if we actually manage to block it."
    ko: "…뭐, 막아냈을 때 얘기지만요."
    ja: "…防ぎきれれば、の話ではありますが…"
  event_goddessfall1_04_e_188:
    speaker: noah
    en: What's the matter? Losing your nerve? All that high-and-mighty preaching,
      and now you're scared?
    ko: |-
      뭐야? 자신 없어?
      그렇게 잘난 듯 설교하더니 쫄았네?
    ja: |-
      あれ？自信ないの？
      あんな偉そ～なこと言っといて、
      ビビっちゃった～？
  event_goddessfall1_04_e_189:
    speaker: rapunzel
    en: Hehe, I'm always scared.
    ko: 후후. 저는 언제나 쫄아있답니다.
    ja: ふふ…怖いのはいつものことです。
  event_goddessfall1_04_e_190:
    speaker: noah
    en: Hmph. Pathetic.
    ko: 흥. 한심하긴.
    ja: ふんっ。なっさけな。
  event_goddessfall1_04_e_191:
    speaker: "<Narration>"
    en: Papillon peeks over the railing, looking down.
    ko: 파피용은 난간 너머, 아래를 슬쩍 쳐다봤다.
    ja: パピヨンは手すり越しに下を盗み見た
  event_goddessfall1_04_e_192:
    speaker: "<Narration>"
    en: The height makes her dizzy. Below, a swarm of Raptures gathers.
    ko: 아찔한 높이. 아래에는 몰려드는 랩쳐로 가득하다.
    ja: |-
      目がくらむような高さだ。
      その底にラプチャーがひしめいている
  event_goddessfall1_04_e_193:
    speaker: papillon
    en: "... Can your attacks even reach them from here?"
    ko: "…너희 여기서 저것들한테 공격이 닿긴 해?"
    ja: "…ここから攻撃が届くの？"
  event_goddessfall1_04_e_194:
    speaker: noah
    en: Barely. We're mainly targeting the aerial-type ones flying this way, but even
      that's... well...
    ko: |-
      거의 안 닿아.
      여기로 날아오는 공중형들을 주로 잡는데, 그마저도….
    ja: |-
      そんなのムリでしょ。
      ここまで飛んでくる空中型の
      相手してるぐらいだけど…
  event_goddessfall1_04_e_195:
    speaker: "<Narration>"
    en: A swarm of aerial-type Raptures suddenly charges at breakneck speed.
    ko: 공중형 랩쳐 한 무리가 맹렬한 속도로 돌진해 오기 시작했다.
    ja: |-
      空中型ラプチャーの集団が、
      猛スピードで接近してきた
  event_goddessfall1_04_e_196:
    speaker: "<Narration>"
    en: Isabel deploys her feathers and slices through the horde in a single motion.
    ko: 페더를 전개한 이사벨이 랩쳐 무리를 단숨에 베며 날아간다.
    ja: |-
      しかし、フェザーを展開したイサベルに
      一瞬で斬り落とされていった
  event_goddessfall1_04_e_197:
    speaker: noah
    en: She's got them all covered.
    ko: 쟤가 다 잡아 줘.
    ja: それもイサベルが倒してくれるから。
  event_goddessfall1_04_e_198:
    speaker: papillon
    en: Perfect. I guess I'll stay here.
    ko: |-
      꿀이네.
      나 여기 있어야겠다.
    ja: |-
      最高ね。
      ここにいよっと。
  event_goddessfall1_04_e_199:
    speaker: noah
    en: I guess the safest place would be wherever the strongest shield is.
    ko: 지상 최강의 방패가 있는 곳이 제일 안전하긴 하겠지.
    ja: |-
      地上最強の盾の側が一番安全なのは
      トーゼンでしょ。
  event_goddessfall1_04_e_200:
    speaker: "<Narration>"
    en: Papillon looks over the railing once more.
    ko: 파피용은 난간 너머를 다시 한번 바라보았다.
    ja: パピヨンはもう一度下の様子を確かめた
  event_goddessfall1_04_e_201:
    speaker: papillon
    en: "... So that means the four Pilgrims are keeping all those Raptures down there
      at bay."
    ko: "…그럼 필그림 넷이서 저 랩쳐들을 다 막아내고 있다는 얘기겠네."
    ja: |-
      …じゃあ、ピルグリム4人で
      あの数のラプチャーを
      全部食い止めてるってワケね。
  event_goddessfall1_04_e_202:
    speaker: rapunzel
    en: Hehe, that's about right.
    ko: 후후. 그런 셈이죠.
    ja: ふふ。そうなりますね。
  event_goddessfall1_04_e_203:
    speaker: papillon
    en: "... You guys are absolute lunatics."
    ko: "…미친것들 진짜."
    ja: "…ホントぶっ飛んでるわね。"
  event_goddessfall1_04_e_204:
    speaker: papillon
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_goddessfall1_04_e_205:
    speaker: papillon
    en: Hey, over there.
    ko: 어, 저기.
    ja: ねえ、あそこ。
  event_goddessfall1_04_e_206:
    speaker: rapunzel
    en: Is something there?
    ko: 뭔가 있나요?
    ja: 何かありましたか？
  event_goddessfall1_04_e_207:
    speaker: papillon
    en: Nayuta's coming. On a camel.
    ko: 나유타가 온다. 낙타 타고 있어.
    ja: ナユタが来てる。ラクダに乗ってるわ。
  event_goddessfall1_04_e_208:
    speaker: rapunzel
    en: My, you've got such sharp eyes.
    ko: 와. 눈이 되게 좋으시네요.
    ja: まあ、よい目をお持ちですね。
  event_goddessfall1_04_e_209:
    speaker: papillon
    en: A spy's gotta have good eyesight, after all.
    ko: 스파이는 기본적으로 시력이 좋아야 되거든.
    ja: スパイの目が節穴だったら務まらないでしょ。
  event_goddessfall1_04_e_210:
    speaker: papillon
    en: And behind her... is that Nihilister being carried?
    ko: 뒤에… 실려있는 건 니힐리스타… 인가?
    ja: 後ろに乗ってるのは…ニヒリスター…あれ？
  event_goddessfall1_04_e_211:
    speaker: papillon
    en: No, I don't think so...
    ko: 아닌 것 같….
    ja: 何か違うような…
  event_goddessfall1_04_e_212:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_213:
    speaker: papillon
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_04_e_214:
    speaker: papillon
    en: Here... tic...
    ko: 헬레… 틱….
    ja: ヘレティック…
  event_goddessfall1_04_e_215:
    speaker: papillon
    en: It's Modernia!
    ko: 헬레틱 모더니아!
    ja: ヘレティック・モダニア！？
  event_goddessfall1_04_e_216:
    speaker: rapunzel
    en: "... Excuse me?"
    ko: "…예?"
    ja: "…はい？"
  event_goddessfall1_04_e_217:
    speaker: papillon
    en: M-Modernia! She's carrying Modernia!
    ko: 모, 모더니아야! 모더니아를 싣고 오는데?
    ja: ま、間違いないわ！どう考えてもモダニアよ！？
  event_goddessfall1_04_e_218:
    speaker: papillon
    en: The outfit's a bit different, but those bandages and that hair color...!
    ko: 보, 복장이 좀 다르긴 하지만, 저 붕대랑 머리색…!
    ja: |-
      見た目がちょっと変わってる気もするけど、
      あの包帯と髪の色は…！
  event_goddessfall1_04_e_219:
    speaker: papillon
    en: It's definitely Modernia!
    ko: 분명히 모더니아야!
    ja: モダニア以外ありえないわ！
  event_goddessfall1_04_e_220:
    speaker: rapunzel
    en: What in the world...!?
    ko: 그게 무슨…!
    ja: それはどういう…！？
  event_goddessfall1_04_e_221:
    speaker: papillon
    en: Yikes...! She's really been put through the wringer...! A total mess...!
    ko: |-
      으아…! 엉망으로 당했네…!
      아주 난도질을 당했….
    ja: |-
      うっ…！ボロボロじゃない…！
      斬られたのかしら…
  event_goddessfall1_04_e_222:
    speaker: rapunzel
    en: Who!? Marian!?
    ko: 누가요!? 마리안이요!?
    ja: 誰がです！？マリアンがですか！？
  event_goddessfall1_04_e_223:
    speaker: papillon
    en: Marian? Oh, you mean Modernia.
    ko: 마리안? 아아, 모더니아말이구나.
    ja: マリアン？ああ、モダニアのことね。
  event_goddessfall1_04_e_224:
    speaker: papillon
    en: Yeah, she's a total wreck. At this point, you could almost say she's been
      minced—
    ko: 응. 아주 엉망이야. 저 정도면 거의 다져놨다고 봐도 무방….
    ja: |-
      ええ。そうみたい。
      バラバラになりかけみたいな感じだけど…
  event_goddessfall1_04_e_225:
    speaker: rapunzel
    en: Noah! Sorry! I'll be back in a sec!
    ko: 노아! 미안해요! 잠시만 갔다 올게요!
    ja: 申し訳ありません！様子を見てきます！
  event_goddessfall1_04_e_226:
    speaker: noah
    en: Huh? Uh... s-sure.
    ko: 어? 으, 응. 그래.
    ja: えっ？ああ、うん…
  event_goddessfall1_04_e_227:
    speaker: noah
    en: It's not like I get anxious being alone... not at all.
    ko: 뭐… 나 혼자 있다고 불안하다거나 그런 건 아니니까, 응.
    ja: |-
      べ…別に私一人じゃ不安とか
      そんなワケじゃないし？
  event_goddessfall1_04_e_228:
    speaker: papillon
    en: I'll stay here. You go quickly.
    ko: "…내가 있을게. 빨리 가봐."
    ja: "…私がここに残るから。早く行ってあげて。"
  event_goddessfall1_04_e_229:
    speaker: rapunzel
    en: Okay! Thank you!
    ko: 알겠어요! 고마워요!
    ja: 分かりました！お願いします！
  event_goddessfall1_04_e_230:
    speaker: "<Narration>"
    en: Rapunzel darts off.
    ko: 라푼젤이 빠르게 뛰어갔다.
    ja: ラプンツェルが飛び出していった
  event_goddessfall1_04_e_231:
    speaker: noah
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_232:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_04_e_233:
    speaker: noah
    en: Why are you here if you're no help?
    ko: 너 왜 여기 있는데. 도움도 안 되면서.
    ja: なんで？どうせ役に立たないくせに。
  event_goddessfall1_04_e_234:
    speaker: papillon
    en: I don't like being alone. It freaks me out.
    ko: 난 혼자 있는 거 무서워서 싫거든~
    ja: 一人でいるのは怖いしイヤなのよ。
  event_goddessfall1_04_e_235:
    speaker: noah
    en: "... Hmph."
    ko: "…흥."
    ja: "…ふんっ。"
event_goddessfall1_05_s:
  event_goddessfall1_05_s_1:
    speaker: johan
    en: "... What's this?"
    ko: "…뭐냐 이건."
    ja: "…どういうことだ、これは。"
  event_goddessfall1_05_s_2:
    speaker: nayuta
    en: No time remains for words. I beseech thee for thy protection.
    ko: |-
      얘기할 시간 없소.
      보호를 부탁하외다.
    ja: |-
      説明している時間がありません。
      保護をお願いします。
  event_goddessfall1_05_s_3:
    speaker: johan
    en: Did you trade Nihilister for Modernia?
    ko: 니힐리스타를 모더니아와 교환해 왔나?
    ja: ニヒリスターとモダニアを取り替えて来たのか？
  event_goddessfall1_05_s_4:
    speaker: johan
    en: What became of Nihilister? And Liliweiss' body?
    ko: |-
      니힐리스타는 어떻게 됐지?
      릴리스의 바디는?
    ja: |-
      ニヒリスターはどうした？
      リリスのボディは？
  event_goddessfall1_05_s_5:
    speaker: nayuta
    en: "... Through mine own negligence, I have failed. I pray thy forgiveness."
    ko: "…소인의 불찰로 인해 실패했소. 송구하외다."
    ja: |-
      …私の落ち度です。失敗しました。
      申し訳ありません。
  event_goddessfall1_05_s_6:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_s_7:
    speaker: johan
    en: Bring her inside for now. Cecil.
    ko: |-
      일단 안으로 들인다.
      세실.
    ja: |-
      とにかく、入れ。
      セシル。
  event_goddessfall1_05_s_8:
    speaker: cecil_op_l
    en: So, this makes the third Heretic you've let inside. This will surely go down
      in history.
    ko: |-
      헬레틱을 셋이나 안에 들인 셈이군요.
      이 정도면 역사에 길이길이 남을 정도지 않을까요.
    ja: |-
      こんな短期間でヘレティックを
      3体も収容することになるとは、
      とうぶん更新されない記録になりそうです。
  event_goddessfall1_05_s_9:
    speaker: cecil_op_l
    en: Have them taken to the weapons development lab. It's the most heavily fortified
      area, and it held up relatively well against the beam.
    ko: |-
      무기 개발실로 가주세요.
      강도가 가장 강한 곳이라서, 빔 포격에서 비교적 멀쩡했어요.
    ja: |-
      武器開発室へ向かってください。
      耐久性が高く作られていたので、
      砲撃の被害が比較的少なくすんでいます。
  event_goddessfall1_05_s_10:
    speaker: cecil_op_l
    en: You won't need the infirmary, in any case.
    ko: 어차피 의무실이 필요한 건 아닐 거잖아요?
    ja: 通常の医療設備はどうせ役に立たないでしょう？
  event_goddessfall1_05_s_11:
    speaker: nayuta
    en: Many thanks.
    ko: 고맙소.
    ja: かたじけない。
  event_goddessfall1_05_s_12:
    speaker: nayuta
    en: Young Hero, prithee, show us the way.
    ko: 요한 소협. 안내 부탁하외다.
    ja: ヨハン、案内を頼めますか？
  event_goddessfall1_05_s_13:
    speaker: johan
    en: Find it yourself. I'm busy.
    ko: |-
      알아서 찾아가라.
      나는 바쁘다.
    ja: |-
      勝手に探してくれ。
      こちらも手いっぱいだ。
  event_goddessfall1_05_s_14:
    speaker: nayuta
    en: Verily, I am not without sense of direction, yet Eden's interior is labyrinthine,
      and its structure hath been greatly altered by the beam...
    ko: 아니 소인이 길치는 아니오만 아무래도 에덴의 내부 시설은 복잡한 데다 빔 포격으로 구조가 많이 바뀌….
    ja: |-
      方向感覚に自信がないわけではありませんが、
      もともと複雑だったエデンの構造に、
      砲撃で崩された後では…
  event_goddessfall1_05_s_15:
    speaker: rapunzel
    en: Nayuta!
    ko: 나유타!
    ja: ナユタ！
  event_goddessfall1_05_s_16:
    speaker: nayuta
    en: Oh, Persinette.
    ko: 오, 금장발 소저.
    ja: これは、髪長の。
  event_goddessfall1_05_s_17:
    speaker: "<Narration>"
    en: Rapunzel's gaze falls upon the battered Marian.
    ko: 라푼젤의 시선이 엉망이 된 마리안에게 향했다.
    ja: |-
      ラプンツェルの視線は、
      素早くボロボロのマリアンに向けられた
  event_goddessfall1_05_s_18:
    speaker: rapunzel
    en: Marian...! What happened?!
    ko: 마리안…! 어째서 이렇게…!
    ja: マリアン…！なぜこんなことが…！
  event_goddessfall1_05_s_19:
    speaker: rapunzel
    en: Let's move her!
    ko: 일단 옮길게요!
    ja: ひとまず、運びます！
  event_goddessfall1_05_s_20:
    speaker: nayuta
    en: I shall assist thee.
    ko: 돕겠소.
    ja: 手伝いましょう。
  event_goddessfall1_05_s_21:
    speaker: nayuta
    en: I bear ill tidings, Young Hero.
    ko: 요한 소협. 좋지 못한 소식이 있소.
    ja: それと、ヨハン。よくない知らせがあります。
  event_goddessfall1_05_s_22:
    speaker: johan
    en: Out with it.
    ko: 말해라.
    ja: 聞こう。
  event_goddessfall1_05_s_23:
    speaker: nayuta
    en: The Maiden of Thunder and the Loquacious One shall verily join the fray.
    ko: 뇌전 소저와 수다쟁이가 합류할 것이외다.
    ja: 雷電とおしゃべりが敵戦力に加わります。
  event_goddessfall1_05_s_24:
    speaker: johan
    en: "... Are you talking about Indivilia and Chatterbox?"
    ko: "…인디빌리아와 토커티브 말인가?"
    ja: "…インディビリアとトーカティブか？"
  event_goddessfall1_05_s_25:
    speaker: rapunzel
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_05_s_26:
    speaker: nayuta
    en: So it is. And should the worst come to pass,
    ko: 그렇소. 그리고 최악의 경우.
    ja: そうです。さらに最悪の場合…
  event_goddessfall1_05_s_27:
    speaker: nayuta
    en: Fire Dragon may verily join them as well.
    ko: 화룡 소저도 저쪽에 합류할지도 모르오.
    ja: 火竜も合流する可能性があります。
  event_goddessfall1_05_s_28:
    speaker: johan
    en: "... It must be because of that signal that's similar to the calling signal
      the Queen emitted earlier."
    ko: "…좀 전에 퀸에게서 발생했던 콜링 시그널과 비슷한 신호 때문이겠군."
    ja: |-
      …クイーンが出していた
      あのコーリングシグナルのようなもののせいか。
  event_goddessfall1_05_s_29:
    speaker: nayuta
    en: Truly so.
    ko: 정확히 봤소이다.
    ja: ご明察。
  event_goddessfall1_05_s_30:
    speaker: johan
    en: Fine, I'll make the preparations.
    ko: 좋다. 대비하겠다.
    ja: 分かった。対策を考える。
  event_goddessfall1_05_s_31:
    speaker: nayuta
    en: I would entreat it of thee.
    ko: 부탁하오.
    ja: お願いします。
  event_goddessfall1_05_s_32:
    speaker: rapunzel
    en: "... She's recovering, albeit slowly."
    ko: |-
      …일단 회복은 되고 있어요.
      속도가 느리지만요.
    ja: |-
      …ひとまず、回復は進んでいるようです。
      速度は早くありませんが…
  event_goddessfall1_05_s_33:
    speaker: nayuta
    en: "'Tis simply for that she hath sustained a grievous wound. So formidable an
      adversary did she face, verily."
    ko: |-
      단순히 큰 상처를 입어 그런 것 같소.
      상대가 상대이니.
    ja: |-
      単純に傷が深すぎるせいでしょう。
      ひどくやられていますから。
  event_goddessfall1_05_s_34:
    speaker: rapunzel
    en: Judging by the wounds, this must be Indivilia's doing.
    ko: 자상인 것으로 봐선 인디빌리아가 한 짓이겠군요.
    ja: 傷痕から見て、インディビリアの仕業ですね。
  event_goddessfall1_05_s_35:
    speaker: nayuta
    en: So it seems.
    ko: 아마 그렇겠지.
    ja: おそらく。
  event_goddessfall1_05_s_36:
    speaker: rapunzel
    en: "... What happened?"
    ko: "…어떻게 된 일이죠?"
    ja: "…何があったのですか？"
  event_goddessfall1_05_s_37:
    speaker: rapunzel
    en: Why is Marian here by herself?
    ko: 왜 마리안이 이곳에 혼자 있는 건가요.
    ja: なぜマリアンが一人で…
  event_goddessfall1_05_s_38:
    speaker: nayuta
    en: "... I know not. Perchance she came, having beheld Eden's Spear."
    ko: "…모르겠소. 에덴의 창을 보고 온 것일지도 모르오."
    ja: |-
      …見当もつきません。エデンの槍を見て、
      駆けつけようとしたという可能性も…
  event_goddessfall1_05_s_39:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_s_40:
    speaker: rapunzel
    en: Nayuta.
    ko: 나유타.
    ja: ナユタ？
  event_goddessfall1_05_s_41:
    speaker: nayuta
    en: "... I humbly apologize. By mine own lips, I cannot reveal the reason."
    ko: "…송구하외다. 소인의 입으로는 이유를 밝힐 수 없소."
    ja: |-
      …申し訳ありません。
      私の口から明かすことはできないのです。
  event_goddessfall1_05_s_42:
    speaker: nayuta
    en: Unless Young Lady Marian herself chooses to disclose it, I may not speak of
      it.
    ko: |-
      마리안 소저가 직접 밝히지 않는 이상,
      소인이 입 밖으로 꺼낼 수는 없소.
    ja: |-
      マリアンが自ら明かさぬ限り、
      言えることはありません。
  event_goddessfall1_05_s_43:
    speaker: rapunzel
    en: "... All right."
    ko: "…알겠어요."
    ja: "…分かりました。"
  event_goddessfall1_05_s_44:
    speaker: rapunzel
    en: For now, all we can do is force power into Marian's core.
    ko: 일단 마리안은 코어에 동력을 강제 주입하는 것 말고는 할 수 있는 게 없겠어요.
    ja: |-
      今できることは、マリアンのコアに
      エネルギーを強制的に注入することだけです。
  event_goddessfall1_05_s_45:
    speaker: rapunzel
    en: We'll have to trust her self-healing ability to do the rest.
    ko: 자기 치유력에 기댈 수밖에 없네요.
    ja: 本人の再生能力に頼るしかありません。
  event_goddessfall1_05_s_46:
    speaker: nayuta
    en: Very well. I shall keep watch over her.
    ko: 알겠소. 소인이 보겠소.
    ja: 分かりました。様子は私が見ておきましょう。
  event_goddessfall1_05_s_47:
    speaker: nayuta
    en: I am presently engaged in my preparations, and thus on this battlefield there
      is naught I may accomplish save for trifling tasks...
    ko: 소인은 지금 준비 중이라 이 전장에서 할 수 있는 것이라곤 허드렛일 말고는 없으니….
    ja: |-
      支度が整うまでは、
      私にこの場でできることといえば、
      雑用だけですので…
  event_goddessfall1_05_s_48:
    speaker: rapunzel
    en: "... I'll leave it in your hands. And now, I'll return to Sister Noah."
    ko: "…부탁해요. 저는 노아 자매님이 있는 곳으로 돌아갈게요."
    ja: |-
      …お願いします。
      私は持ち場に戻ります。
  event_goddessfall1_05_s_49:
    speaker: nayuta
    en: May your toil bear fruit.
    ko: 수고해 주시오.
    ja: ご武運を。
  event_goddessfall1_05_s_50:
    speaker: rapunzel
    en: See you lat—
    ko: 예. 이따 뵈
    ja: はい。また後ほど――
  event_goddessfall1_05_s_51:
    speaker: cecil_op_l
    en: The Queen's energy signature detected.
    ko: 퀸에게서 에너지 반응 확인.
    ja: クイーンより高エネルギー反応を確認。
  event_goddessfall1_05_s_52:
    speaker: johan_op_r
    en: Everyone, prepare for bombardment!
    ko: 전원! 빔 포격 대비!
    ja: 全員！砲撃に備えろ！
  event_goddessfall1_05_s_53:
    speaker: rapunzel
    en: Oh no...!
    ko: "!! 이런…!"
    ja: "！！そんな…！？"
  event_goddessfall1_05_s_54:
    speaker: "<Narration>"
    en: Rapunzel runs off.
    ko: 라푼젤이 뛰어갔다.
    ja: ラプンツェルが走り去った
  event_goddessfall1_05_s_55:
    speaker: "<Narration>"
    en: Nayuta glances between Rapunzel's retreating figure and Marian,
    ko: 나유타는 라푼젤의 뒷모습과, 마리안을 번갈아 쳐다보았다.
    ja: |-
      ナユタはラプンツェルの後ろ姿と
      マリアンを交互に見た
  event_goddessfall1_05_s_56:
    speaker: "<Narration>"
    en: then squeezes her eyes shut.
    ko: 그리고 눈을 질끈 감았다.
    ja: そして、固く目を閉じた
  event_goddessfall1_05_s_57:
    speaker: nayuta
    en: "... By my word, how much longer must we tarry...?"
    ko: "…젠장. 얼마나 더 기다려야 하는가…."
    ja: "…ああ、あとどれほどかかるのか…"
  event_goddessfall1_05_s_58:
    speaker: papillon
    en: Y-you mean that thing's coming again!? Seriously?!
    ko: 그, 그게 한 번 더 온다고!? 진짜!?
    ja: あ、あれがもう一発来るって！？本当に！？
  event_goddessfall1_05_s_59:
    speaker: noah
    en: Ah, so you heard it too, huh?
    ko: 아 너도 들었을 것 아냐!
    ja: 聞こえてたでしょ！？
  event_goddessfall1_05_s_60:
    speaker: papillon
    en: Wow, if we can't block this, Eden's totally screwed.
    ko: 와 이거 못 막으면 에덴 진짜 끝이겠네?
    ja: 防げなかったらエデンはおしまいよね？
  event_goddessfall1_05_s_61:
    speaker: noah
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_s_62:
    speaker: papillon
    en: Can you really block it?
    ko: 막을 수 있어? 진짜?
    ja: 防ぎきれるの？本気で？
  event_goddessfall1_05_s_63:
    speaker: noah
    en: Quit whining right beside me and go!
    ko: 너 그렇게 옆에서 자꾸 칭얼대지 말고 가!
    ja: |-
      隣でゴチャゴチャ言ってないで、
      さっさとどっか行って！
  event_goddessfall1_05_s_64:
    speaker: noah
    en: You're nothing but a nuisance here!
    ko: 옆에 있으면 괜히 거추장스럽기만 하니까!
    ja: ジャマになるだけだから！
  event_goddessfall1_05_s_65:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_s_66:
    speaker: papillon
    en: "... Go where?"
    ko: "…어디로?"
    ja: "…行くって、どこに？"
  event_goddessfall1_05_s_67:
    speaker: noah
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_s_68:
    speaker: "<Narration>"
    en: The sky turns red.
    ko: 하늘이 붉어진다.
    ja: 空が赤く染まった
  event_goddessfall1_05_s_69:
    speaker: "<Narration>"
    en: The deepening crimson light gradually dyes the clouds an ominous hue.
    ko: 점점 짙어지는 붉은색 빛은, 이윽고 구름을 불길한 색으로 물들였다.
    ja: |-
      刻一刻と濃度を増す赤が、
      やがて雲を不気味に染め上げた
  event_goddessfall1_05_s_70:
    speaker: rapunzel
    en: Noah!
    ko: 노아!
    ja: ノア！
  event_goddessfall1_05_s_71:
    speaker: noah
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_05_s_72:
    speaker: noah
    en: Mo-move it, will ya?!
    ko: 빠, 빨리빨리 좀 다녀!
    ja: もう、もっと早く来てよ！
  event_goddessfall1_05_s_73:
    speaker: rapunzel
    en: I'm sorry!
    ko: 미안해요!
    ja: 申し訳ありません！
  event_goddessfall1_05_s_74:
    speaker: noah
    en: Are you ready?
    ko: 준비됐어?
    ja: 準備できてる？
  event_goddessfall1_05_s_75:
    speaker: rapunzel
    en: Yes!
    ko: 예!
    ja: はい！
  event_goddessfall1_05_s_76:
    speaker: noah
    en: Then let's block this thing!
    ko: 막아보자고!
    ja: やるよ！
  event_goddessfall1_05_s_77:
    speaker: rapunzel
    en: All right, let's go!
    ko: 가요!
    ja: 行きましょう！
  event_goddessfall1_05_s_78:
    speaker: "<Narration>"
    en: Before long, a crimson pillar of light
    ko: 이윽고 구름을 꿰뚫으며
    ja: ほどなくして、雲を突き破り…
  event_goddessfall1_05_s_79:
    speaker: "<Narration>"
    en: pierces through the clouds and pours down.
    ko: 붉은색의 빛기둥이 쏟아져 내려왔다.
    ja: 赤い光の柱が降った
  event_goddessfall1_05_s_80:
    speaker: noah
    en: I-it's huge...!
    ko: 크, 크다…!
    ja: で、でかい…！
  event_goddessfall1_05_s_81:
    speaker: rapunzel
    en: Normally, size trumps all, but not this time!
    ko: |-
      큰 것에는 패배하는 게 정석이지만,
      이번엔 예외예요!
    ja: |-
      大きなモノに敗北するのは定番ですが、
      今回ばかりは例外です！
  event_goddessfall1_05_s_82:
    speaker: noah
    en: Huh? What are you on about?
    ko: 엑? 무슨 소리?
    ja: えっ？何の話？
  event_goddessfall1_05_s_83:
    speaker: "<Narration>"
    en: From Noah's two shields, a wide electromagnetic field spreads out.
    ko: 노아의 두 개의 방패에서 전자기장 실드가 넓게 전개된다.
    ja: |-
      ノアの2枚の盾から展開された電磁場が
      巨大なシールドを形成した
  event_goddessfall1_05_s_84:
    speaker: "<Narration>"
    en: Rapunzel lifts her staff, unfolding a golden barrier before her.
    ko: 라푼젤이 지팡이를 들어 황금색 장벽을 전개한다.
    ja: |-
      ラプンツェルも杖を掲げ、
      黄金色のシールドを重ねた
  event_goddessfall1_05_s_85:
    speaker: "<Narration>"
    en: An ominous red light strikes both shield and barrier,
    ko: 불길한 붉은색의 빛이, 방패와 장벽을 두드린다.
    ja: 禍々しい赤色の光柱が、二重の盾を打ちつけた
  event_goddessfall1_05_s_86:
    speaker: "<Narration>"
    en: its impact scattering fragments of light in all directions.
    ko: 벽에 가로막힌 빛이 사방으로 비산한다.
    ja: 盾に衝突した光が、四方に飛散する
  event_goddessfall1_05_s_87:
    speaker: "<Narration>"
    en: The deflected beam rain down,
    ko: 튕겨 나간 빔의 파편들이 지면으로 떨어진다.
    ja: 飛び散った光は、周囲の大地を襲った
  event_goddessfall1_05_s_88:
    speaker: "<Narration>"
    en: scorching the earth and melting the Raptures that rush in.
    ko: 땅을 태우고, 몰려든 랩쳐들을 녹인다.
    ja: |-
      一帯が焼き払われ、押し寄せていた
      ラプチャーまでもが溶かされていった
  event_goddessfall1_05_s_89:
    speaker: noah
    en: Hrrrnggh...!
    ko: 으그그그극…!
    ja: うぐぐぐっ…！
  event_goddessfall1_05_s_90:
    speaker: rapunzel
    en: It's... okay! We... can block it!
    ko: 괜찮… 아요! 막아낼 수… 있어요!
    ja: 大丈夫…です！防げ…ます！
  event_goddessfall1_05_s_91:
    speaker: noah
    en: You bet... we can!
    ko: 당연… 하지!!
    ja: 当ったり前…でしょ！！
  event_goddessfall1_05_s_92:
    speaker: "<Narration>"
    en: The Queen's beam does not stop.
    ko: 퀸이 뿜어내는 빔은 멈추지 않는다.
    ja: 光の勢いは衰える様子がない
  event_goddessfall1_05_s_93:
    speaker: "<Narration>"
    en: It continues to aim at Eden in an unbroken stream.
    ko: 지속된 연사로, 에덴을 노리고 계속 내뻗어온다.
    ja: 休む間もなく、エデンに光が降り注ぐ
  event_goddessfall1_05_s_94:
    speaker: "<Narration>"
    en: Papillon sits on the ground, watching the two holding back the red light pouring
      down over them.
    ko: 파피용은 바닥에 주저앉은 채 자신의 머리 위에 쏟아져 내려오는 붉은색 빛을 막아내고 있는 둘의 모습을 본다.
    ja: |-
      パピヨンは力なく座り込み、
      自身の頭上に迫る赤い光と
      それを防ぐ2人の背を見つめていた
  event_goddessfall1_05_s_95:
    speaker: "<Narration>"
    en: Their posture lowers. Their breathing grows ragged. Their faces twist.
    ko: |-
      점점 낮아지는 자세. 거칠어지는 호흡.
      구겨지는 표정을 본다.
    ja: |-
      2人の姿勢は時が経つほど低くなり、
      呼吸も荒くなっていった。
      表情のゆがみも増している
  event_goddessfall1_05_s_96:
    speaker: "<Narration>"
    en: This isn't going to work.
    ko: 안 될 것 같다.
    ja: ダメなんじゃないか――
  event_goddessfall1_05_s_97:
    speaker: "<Narration>"
    en: 'A grim thought crosses Papillon''s mind:'
    ko: 불길한 생각이 파피용의 머리를 스쳐 지나갔다.
    ja: 不吉な予感がパピヨンの脳裏をよぎった
  event_goddessfall1_05_s_98:
    speaker: "<Narration>"
    en: why isn't anyone coming to help?
    ko: 왜 아무도 도와주러 오지 않지?
    ja: なぜ誰も助けに来てくれないのだろう？
  event_goddessfall1_05_s_99:
    speaker: "<Narration>"
    en: She doesn't even know what they could do, but they could at least try.
    ko: |-
      어떻게 도와줘야 하는지는 잘 모르겠지만,
      와서 뭐든 할 수 있는 거잖아.
    ja: |-
      どう助かるのかも想像できないけど、
      助けてもらえるなら何だってするのに
  event_goddessfall1_05_s_100:
    speaker: "<Narration>"
    en: Papillon crawls to the edge and peers out.
    ko: 파피용은 엉금엉금 기어 난간 밖을 바라본다.
    ja: |-
      パピヨンは頭の片隅で考えながら、
      手すりに這いより、下の様子をうかがった
  event_goddessfall1_05_s_101:
    speaker: "<Narration>"
    en: The deflected beam falls around Eden
    ko: 벽에 막혀 비산하는 빔은, 에덴의 주위에 마치 비처럼 내리고 있었다.
    ja: |-
      シールドに防がれた光の余波が、
      エデンの周囲に雨のごとく降り注いでいる
  event_goddessfall1_05_s_102:
    speaker: "<Narration>"
    en: like a rain of fire.
    ko: 말 그대로 불의 비나 다름 없다.
    ja: そこは文字通り、火の海だった
  event_goddessfall1_05_s_103:
    speaker: "<Narration>"
    en: And beneath that fiery downpour, they fight.
    ko: |-
      그리고 그 불의 비 아래에서,
      그녀들은 싸우고 있었다.
    ja: |-
      しかしその火の海のただ中で、
      戦い続ける人影があった
  event_goddessfall1_05_s_104:
    speaker: "<Narration>"
    en: Snow White, covered in something, fires without pause. Harran scatters some
      strange powder.
    ko: |-
      뭔가를 뒤집어쓴 채 사격을 멈추지 않는 스노우 화이트.
      수상한 가루를 흩뿌리고 있는 하란.
    ja: |-
      何かで頭を覆い、
      射撃を続けるスノーホワイト、
      正体不明の粉塵を散布するハラン
  event_goddessfall1_05_s_105:
    speaker: "<Narration>"
    en: Scarlet cuts through Raptures under the flames. Isabel weaves through the
      fire, harrying the Raptures behind enemy lines.
    ko: |-
      불의 비를 맞으며 랩쳐를 베어내는 홍련.
      불의 비 사이를 피해 다니며 적진을 농락하는 이사벨.
    ja: |-
      火の雨の中で踊り、
      ラプチャーを斬る紅蓮、
      敵を翻弄するイサベル
  event_goddessfall1_05_s_106:
    speaker: "<Narration>"
    en: Meanwhile, Papillon is paralyzed with fear.
    ko: 파피용은 공포에 질렸다.
    ja: パピヨンはかえって恐怖を覚えた
  event_goddessfall1_05_s_107:
    speaker: papillon
    en: They're... crazy...
    ko: 미친… 것들….
    ja: こんなの…正気じゃない…
  event_goddessfall1_05_s_108:
    speaker: "<Narration>"
    en: "*Fwoooom!*"
    ko: 카가가가가가각--!!
    ja: ガガガガガッ――！！
  event_goddessfall1_05_s_109:
    speaker: "<Narration>"
    en: The Queen's beam intensifies.
    ko: 퀸의 빛이 한층 더 강해진다.
    ja: クイーンからの光は強さを増していた
  event_goddessfall1_05_s_110:
    speaker: "<Narration>"
    en: Rapunzel and Noah are pushed back.
    ko: 라푼젤과 노아가 밀려난다.
    ja: ラプンツェルとノアが見るからに押され始めた
  event_goddessfall1_05_s_111:
    speaker: "<Narration>"
    en: Without thinking, Papillon catches them by the waist.
    ko: 파피용은 자기도 모르게 그 둘의 허리를 받쳤다.
    ja: |-
      パピヨンは思わず
      2人の背中に手を伸ばし、支えた
  event_goddessfall1_05_s_112:
    speaker: papillon
    en: Keep blocking, you lunatics!
    ko: 막아내 봐 이 미친 것들아-!!
    ja: |-
      防いでみせなさいよ、
      あんたたちのおかしな力で――！！
  event_goddessfall1_05_s_113:
    speaker: rapunzel
    en: Hnnnngh!
    ko: 으으으으읏--!!
    ja: くううううっ！！
  event_goddessfall1_05_s_114:
    speaker: noah
    en: Urrrrgh!
    ko: 이야아아아--!!
    ja: はぁぁぁぁっ！！
  event_goddessfall1_05_s_115:
    speaker: "<Narration>"
    en: Rapunzel's golden barrier flares even brighter.
    ko: 라푼젤의 황금색 벽이 한층 더 강하게 발광한다.
    ja: |-
      ラプンツェルの展開していたシールドが
      一段と強く光を放った
  event_goddessfall1_05_s_116:
    speaker: "<Narration>"
    en: In that instant, she realizes that her core's power is depleted.
    ko: 그리고 그 순간, 라푼젤은 코어의 동력이 바닥난 것을 확신했다.
    ja: |-
      その瞬間、ラプンツェルは
      コアの動力が底をついたと悟った
  event_goddessfall1_05_s_117:
    speaker: "<Narration>"
    en: Just before she collapses forward, she feels someone tug at her collar.
    ko: 앞으로 고꾸러지기 전, 누군가가 자신의 옷깃을 잡아당기는 것을 느꼈다.
    ja: |-
      倒れ込みそうになった身体が、
      誰かに引っ張られるのを感じた
  event_goddessfall1_05_s_118:
    speaker: "<Narration>"
    en: Noah grabs Rapunzel and hurls her behind herself.
    ko: |-
      노아는 쓰러지기 직전의 라푼젤을 잡아끌어,
      자신의 뒤로 던지듯 내팽개쳤다.
    ja: |-
      倒れる寸前のラプンツェルを、
      ノアが自身の後ろに放り投げたのだ
  event_goddessfall1_05_s_119:
    speaker: rapunzel
    en: Sis... ter No... ah!
    ko: 노… 아 자매… 님…!
    ja: ノ…ノア…！
  event_goddessfall1_05_s_120:
    speaker: noah
    en: Hey! You said it!
    ko: 야! 네가 말했지!
    ja: ふん！あんたの言ってたことでしょ！
  event_goddessfall1_05_s_121:
    speaker: noah
    en: A shield that protects someone can block anything!
    ko: 누군가를 지키는 방패는 뭐든 막아낼 수 있다고!
    ja: 誰かを守るための盾は、何でも防げるって！
  event_goddessfall1_05_s_122:
    speaker: noah
    en: What a load of nonsense! There's no such thing!
    ko: 헛소리하지 마! 그딴 게 어딨어!
    ja: |-
      バッカじゃない！？
      そんなのどこにあるっての！？
  event_goddessfall1_05_s_123:
    speaker: noah
    en: I'm the strongest, you hear me? I'm the strongest!
    ko: 내가 최강이다! 내가 최강이야!
    ja: 私が最強！最強なのはこの私！
  event_goddessfall1_05_s_124:
    speaker: noah
    en: I'm not protecting anything! I just need to prove that I'm the strongest!
    ko: 나는 아무도 안 지켜! 내가 최강인 것만 증명하면 되는 거야!
    ja: |-
      誰も守ったりなんかしない！
      私は私が最強だって証明するだけ！
  event_goddessfall1_05_s_125:
    speaker: noah
    en: So you lot better cling to me and pray you make it out alive!
    ko: |-
      그러니 너희는 나한테 빌붙으면서!
      목숨이나 건지길 기도하라고!
    ja: |-
      せいぜい必死に私にすがりついて…！
      命ごいでもしてればいいの！
  event_goddessfall1_05_s_126:
    speaker: rapunzel
    en: Noah! If you increase your output any further...!
    ko: 노아! 그 이상 출력을 올리면…!
    ja: いけません！それ以上出力を上げたら…！
  event_goddessfall1_05_s_127:
    speaker: noah
    en: Me!
    ko: 내가 바로!
    ja: この私が…！
  event_goddessfall1_05_s_128:
    speaker: noah
    en: I'm the strongest shield on the surface!!
    ko: 지상 최강의 방패다아아아--!!
    ja: 地上最強の盾だああああッ！！
  event_goddessfall1_05_s_129:
    speaker: "<Narration>"
    en: The ominous crimson light halts, and the rain of fire ceases.
    ko: 불길한 붉은 빛이 멎고, 불의 비가 그쳤다.
    ja: 不吉な赤い光が消え、火の雨がやんだ
  event_goddessfall1_05_s_130:
    speaker: noah
    en: "... Heh, too bad Firepower Four Eyes didn't get to see that."
    ko: "…하. 이걸 화력 안경이 봤어야 됐는데."
    ja: |-
      …あははっ…火力眼鏡に
      見せつけてやりたかったな…
  event_goddessfall1_05_s_131:
    speaker: cecil_op_l
    en: "... Defense complete. Damage to Eden is minimal."
    ko: "…방어 완료. 에덴의 피해는 경미해요."
    ja: "…防御成功。エデンの損害は軽微です。"
  event_goddessfall1_05_s_132:
    speaker: johan_op_r
    en: Well done, Noah.
    ko: 수고했다. 노아.
    ja: よくやった、ノア。
  event_goddessfall1_05_s_133:
    speaker: papillon
    en: Wh-whoa, whoa, whoa, whoa!
    ko: 우, 우와! 우와 우와 우와!
    ja: わ、わわ！うわあああ！
  event_goddessfall1_05_s_134:
    speaker: papillon
    en: You actually blocked it?!
    ko: 지, 진짜 막았잖아!?
    ja: ほ、ホントに防いだじゃない！？
  event_goddessfall1_05_s_135:
    speaker: papillon
    en: You arrogant brat, you really are incred—
    ko: 야 건방진 꼬맹이 너 진짜 대단…!
    ja: 生意気なチビだと思ってたけど、見直し…！
  event_goddessfall1_05_s_136:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-
    ja: ドサッ――
  event_goddessfall1_05_s_137:
    speaker: "<Narration>"
    en: Noah goes rigid and collapses backward.
    ko: 노아가 굳은 채 뒤로 쓰러진다.
    ja: |-
      ノアの体が固まったままの姿勢で、
      後ろに倒れこんだ
  event_goddessfall1_05_s_138:
    speaker: rapunzel
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_05_s_139:
    speaker: papillon
    en: "... *Gasp!*"
    ko: "…허억…!"
    ja: "…っ…！？"
  event_goddessfall1_05_s_140:
    speaker: "<Narration>"
    en: Noah's entire front is scorched black.
    ko: 노아의 앞부분은 온통 검었다.
    ja: ノアの正面は黒焦げになっていた
  event_goddessfall1_05_s_141:
    speaker: "<Narration>"
    en: Her eyes, nose, and mouth—every feature has been burned away. Only a charred
      body remains.
    ko: |-
      눈, 코, 입 그 무엇도 보이지 않았다.
      오로지 검었다.
    ja: |-
      目、鼻、口…
      何も識別できないほどに
  event_goddessfall1_05_s_142:
    speaker: "<Narration>"
    en: Where her core should be, there's nothing but a gaping, hollow cavity.
    ko: 코어가 있어야 할 자리에는 움푹 들어간 공허한 구멍만이 있을 뿐이었다.
    ja: コアがあるはずの場所に、空洞が広がっている
  event_goddessfall1_05_s_143:
    speaker: "<Narration>"
    en: She doesn't move an inch.
    ko: 노아는 조금도 움직이지 않았다.
    ja: 身動き一つする気配もない
  event_goddessfall1_05_s_144:
    speaker: papillon
    en: "... Hey, you arrogant brat, what's wro—"
    ko: "…야. 건방진 꼬맹이. 너 이거 왜 이ㄹ…."
    ja: "…ちょっと、ノア。どうし――"
  event_goddessfall1_05_s_145:
    speaker: "<Narration>"
    en: Papillon gently shakes Noah's body.
    ko: 파피용이 노아의 몸을 살짝 흔든다.
    ja: パピヨンがノアの体を軽く揺さぶった
  event_goddessfall1_05_s_146:
    speaker: "<Narration>"
    en: "*Psshh*"
    ko: 파스스.
    ja: ブワッ――
  event_goddessfall1_05_s_147:
    speaker: "<Narration>"
    en: Black ashes scatter from Noah's body.
    ko: 검은 재가 노아의 몸에서 흩날린다.
    ja: 黒色の灰が舞い上がった
  event_goddessfall1_05_s_148:
    speaker: "<Narration>"
    en: Noah is completely still, like something hardened into stone.
    ko: 노아는 딱딱하게 굳은 무언가처럼, 미동도 하지 않았다.
    ja: ノアは物言わぬ塊となっていた
  event_goddessfall1_05_s_149:
    speaker: "<Narration>"
    en: Papillon collapses to the ground, landing on her rear.
    ko: 파피용은 엉덩방아를 찧으며 주저앉았다.
    ja: パピヨンは力が抜け、尻もちをついた
  event_goddessfall1_05_s_150:
    speaker: papillon
    en: Wha...
    ko: "…뭐야."
    ja: "…何？"
  event_goddessfall1_05_s_151:
    speaker: papillon
    en: Wh-what is this?
    ko: 뭐, 뭐야 이거.
    ja: ど、どうなってるの、これ…
  event_goddessfall1_05_s_152:
    speaker: rapunzel
    en: Ugh...!
    ko: 으윽…!
    ja: くっ…！
  event_goddessfall1_05_s_153:
    speaker: "<Narration>"
    en: Rapunzel carries Noah and runs,
    ko: 라푼젤이 노아를 들고 달린다.
    ja: |-
      ラプンツェルがノアの身体を
      抱きかかえ、駆けだそうとした
  event_goddessfall1_05_s_154:
    speaker: "<Narration>"
    en: but her staggering steps cause her to fall.
    ko: 휘청이는 걸음으로 인해 바닥에 넘어진다.
    ja: しかし足元がおぼつかず、転んでしまった
  event_goddessfall1_05_s_155:
    speaker: "<Narration>"
    en: On impact, Noah's arm shatters like charred wood.
    ko: 그 충격으로, 노아의 팔이 숯이 된 나무처럼 부서진다.
    ja: |-
      落とされた衝撃で、ノアの腕が
      まるで木炭かのように易々と折れた
  event_goddessfall1_05_s_156:
    speaker: "<Narration>"
    en: Trembling, Rapunzel lifts Noah again and keeps running.
    ko: 라푼젤은 후들거리는 몸을 일으켜 다시 노아를 들고 달렸다.
    ja: |-
      ラプンツェルがふらつきながら立ち上がり、
      再びノアを抱えて走り出した
  event_goddessfall1_05_s_157:
    speaker: "<Narration>"
    en: Meanwhile, Papillon can only stare blankly, screaming in desperation.
    ko: 파피용은 그 모습을 그저 멍하니 바라보다, 발악하듯 외쳤다.
    ja: |-
      パピヨンはその姿を呆然と見送り、
      悲鳴のような声をあげた
  event_goddessfall1_05_s_158:
    speaker: papillon
    en: Cecil! Cecilllll!
    ko: 세실! 세시이일--!!
    ja: セシル！セシル！！
  event_goddessfall1_05_s_159:
    speaker: papillon
    en: Rapunzel and Noah are heading to the infirmary! Hurry!
    ko: 의무실! 의무실로 라푼젤과 노아가 가고 있어! 빨리!
    ja: |-
      医務室！ラプンツェルとノアが
      向かってるの！早く…！
  event_goddessfall1_05_s_160:
    speaker: cecil_op_l
    en: Got it, I'll make the necessary preparations.
    ko: 알겠어요. 준비할게요.
    ja: 分かりました。準備しておきます。
  event_goddessfall1_05_s_161:
    speaker: johan_op_r
    en: "... Everyone, conduct maintenance and resupply."
    ko: "…전원. 정비 및 보급을 실시해라."
    ja: "…全員、整備と補給を急げ。"
  event_goddessfall1_05_s_162:
    speaker: johan_op_r
    en: Another Rapture attack is imminent.
    ko: 랩쳐의 공격이 온다.
    ja: ラプチャーの襲撃が来る。
  event_goddessfall1_05_s_163:
    speaker: johan_op_r
    en: Indivilia and Chatterbox have been confirmed.
    ko: 인디빌리아, 토커티브의 참전이 확인된다.
    ja: |-
      インディビリアとトーカティブの存在が
      確認されている。
  event_goddessfall1_05_s_164:
    speaker: johan_op_r
    en: Nihilister as well.
    ko: 그리고, 니힐리스타도.
    ja: ニヒリスターもいるようだ。
  event_goddessfall1_05_s_165:
    speaker: papillon
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
event_goddessfall1_05_e:
  event_goddessfall1_05_e_1:
    speaker: indivilia
    en: You truly do not know?
    ko: 정말 모르나요?
    ja: 本当に何も知らないのですか？
  event_goddessfall1_05_e_2:
    speaker: nihilister_m
    en: No. How the hell would I know?
    ko: 모른다고. 내가 어떻게 알아.
    ja: 知らねえって。知ってるワケねえだろうが。
  event_goddessfall1_05_e_3:
    speaker: indivilia
    en: I suggest you think carefully once more. Do you truly know nothing of the
      sword-wielding human imposters?
    ko: |-
      다시 한번 잘 생각하는 게 좋을 거예요.
      검을 쓰는 유사 인간에 대해 정말 아는 게 없나요?
    ja: |-
      もう一度よく考えるべきです。
      剣を使う人間もどきですよ。
      何も思い当たらないのですか？
  event_goddessfall1_05_e_4:
    speaker: nihilister_m
    en: You mean Scarlet, or whatever her name is?
    ko: 홍련인가 뭔가 하는 놈이겠지.
    ja: 紅蓮だか何だかって奴じゃねえのか？
  event_goddessfall1_05_e_5:
    speaker: indivilia
    en: No, that's impossible. I would have recognized her.
    ko: 그럴 리가요. 제가 그분을 못 알아볼 리가 없어요.
    ja: いいえ。それなら私も知っています。
  event_goddessfall1_05_e_6:
    speaker: nihilister_m
    en: Hell if I know. Go ask her yourself.
    ko: 모른다고. 저기 가서 물어보던가.
    ja: |-
      じゃあ何も知らねえよ。
      テメーで聞きに行きゃいいだろ。
  event_goddessfall1_05_e_7:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_8:
    speaker: indivilia
    en: Well, fine. It's just one more human imposter anyway.
    ko: 뭐 좋아요. 그래봤자 유사 인간 하나가 더 늘어난 것뿐이니까요.
    ja: |-
      まあ、いいでしょう。
      人間もどきが1匹増えただけです。
  event_goddessfall1_05_e_9:
    speaker: nihilister_m
    en: That's big talk considering you both came crawling back here with your heads
      barely attached.
    ko: 둘 다 대가리를 겨우 붙이면서 온 주제에 허세는.
    ja: 命からがら逃げてきたくせに、よく言うぜ。
  event_goddessfall1_05_e_10:
    speaker: indivilia
    en: "... It was merely a surprise attack. If we remain vigilant, it shall not
      occur again."
    ko: |-
      …기습을 당했을 뿐이에요.
      경계하면 다시 일어나지 않을 일이죠.
    ja: |-
      …不意を打たれただけです。
      分かっていれば二度と同じ手は通じません。
  event_goddessfall1_05_e_11:
    speaker: talkative
    en: Losing Marian is a major setback.
    ko: "[마리안을 잃은 건 좀 크군.]"
    ja: "「だが、マリアンを失った」"
  event_goddessfall1_05_e_12:
    speaker: indivilia
    en: Indeed, it would have been most satisfying to take a full bite.
    ko: 그러게요. 한 입 크게 베어 물었으면 좋았을 텐데.
    ja: |-
      そうですね。
      さっさと一口かじっておけばよかったのです。
  event_goddessfall1_05_e_13:
    speaker: talkative
    en: That's not it. She should've been the Queen's next vessel, and we screwed
      it up.
    ko: "[그 얘기가 아니다. 퀸의 다음 바디가 되어야 하는데, 그걸 놓쳤다.]"
    ja: |-
      「その問題ではない。
      クイーンの新たなボディを手放してしまった」
  event_goddessfall1_05_e_14:
    speaker: nihilister_m
    en: Screwed it up? She bolted after getting just one slash. Speak properly, will
      you?
    ko: |-
      놓치기는. 칼 한 방 맞았다고 줄행랑친 거지.
      말은 똑바로 해야 하지 않겠어?
    ja: |-
      手放した？ちょっと斬られたぐらいで
      ビビッて投げ捨てて来たんだろ。
      表現は正確にした方がいいぜ。
  event_goddessfall1_05_e_15:
    speaker: indivilia
    en: "... Well, that matters little. There is ample time."
    ko: "…뭐 상관없어요. 시간은 충분해요."
    ja: |-
      …大した問題ではありません。
      まだ時間は十分にあります。
  event_goddessfall1_05_e_16:
    speaker: indivilia
    en: The Queen above still appears to be in good health.
    ko: 저 위에 계신 퀸께서는 아직 정정해 보이니까.
    ja: |-
      天にましますクイーンは、
      まだご健在のようですから。
  event_goddessfall1_05_e_17:
    speaker: nihilister_m
    en: Haha, you mean the Queen who doesn't even bother to show her face?
    ko: 하하. 코빼기도 안 보이는 퀸께서 말이지.
    ja: ヘッ。ツラも見せねぇ女王様か。
  event_goddessfall1_05_e_18:
    speaker: indivilia
    en: "... So, how does it feel to be back in the Queen's embrace,"
    ko: |-
      …그래서.
      다시 퀸의 품 안으로 들어온 기분이 어떤가요?
    ja: |-
      …それで…
      クイーンの元に戻ってきた気分は
      いかがですか？
  event_goddessfall1_05_e_19:
    speaker: indivilia
    en: Nihilister?
    ko: 니힐리스타.
    ja: ニヒリスター。
  event_goddessfall1_05_e_20:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_21:
    speaker: indivilia
    en: My, my, you were chattering away just a moment ago, and now you've gone unusually
      quiet.
    ko: 어머. 좀 전까지 그렇게 떠들어대더니 오늘따라 조용하네요.
    ja: |-
      おやおや。たった今までの威勢の良さは
      どこに行ったのでしょう。
  event_goddessfall1_05_e_22:
    speaker: indivilia
    en: Is it because you're barely more than a corpse?
    ko: 송장이나 다름없어서 그런 건가요?
    ja: しかばね同然だからでしょうか？
  event_goddessfall1_05_e_23:
    speaker: nihilister_m
    en: Shut your trap, you damn scorpion.
    ko: 닥쳐라 전갈 자식.
    ja: 黙れ、サソリ野郎。
  event_goddessfall1_05_e_24:
    speaker: indivilia
    en: And if I refuse? What can you possibly do?
    ko: 싫다면요? 당신이 뭘 할 수 있는데요?
    ja: 断ると言ったら？あなたに何ができるのですか？
  event_goddessfall1_05_e_25:
    speaker: nihilister_m
    en: I'll rip your jaw right off your face.
    ko: 네놈의 입을 뜯어버릴 순 있겠지.
    ja: その口を引きちぎってやる。
  event_goddessfall1_05_e_26:
    speaker: indivilia
    en: I'm afraid I won't allow you to feast on Raptures. Not that you could, in
      that corpse-like state of yours.
    ko: |-
      안타깝지만 저는 당신이 랩쳐들을 포식하게 두지 않을 거예요.
      그 송장 같은 꼴로는 할 수도 없겠지만.
    ja: |-
      おあいにく様。
      ラプチャーの捕食などさせません。
      いずれにせよ今のあなたには不可能でしょう。
  event_goddessfall1_05_e_27:
    speaker: indivilia
    en: And neither I nor Chatterbox could be eaten. So you would be dead with a mere
      flick of my finger.
    ko: |-
      그리고 저나 토커티브를 먹을 수도 없죠.
      지금의 당신은 손가락 하나로도 죽일 수 있으니까.
    ja: |-
      私やトーカティブには、
      なおさら手のだしようがありませんね。
      今のあなたは指一本で倒せますから。
  event_goddessfall1_05_e_28:
    speaker: indivilia
    en: So then, how do you plan to rip my mouth off?
    ko: 자, 그럼 어떻게 제 입을 뜯을 생각이신가요?
    ja: |-
      それで、どうやって私の口を引きちぎる
      つもりでしょうねえ？
  event_goddessfall1_05_e_29:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_30:
    speaker: indivilia
    en: I know, I know. You don't want to be around Chatterbox and me after we made
      a meal of you.
    ko: |-
      알아요 알아.
      당신을 잡아먹은 저나 토커티브와 같이 있기 싫다는 거.
    ja: |-
      もちろん分かっていますよ。
      私ともトーカティブとも
      一緒にいたくなどないでしょう。
  event_goddessfall1_05_e_31:
    speaker: indivilia
    en: 'But you must understand: the Queen commanded us to act together. She wants
      Eden destroyed by our hands.'
    ko: |-
      그런데 퀸께서 명령하셨잖아요.
      다 함께 에덴을 파괴하라고.
    ja: |-
      しかし、これはクイーンの命令です。
      協力してエデンを破壊せよ、と。
  event_goddessfall1_05_e_32:
    speaker: indivilia
    en: So, let us cooperate. Do you understand?
    ko: |-
      그러니 사이좋게 잘 지내봐요.
      알겠죠?
    ja: |-
      ですから、仲よく過ごしましょう？
      分かっていますね？
  event_goddessfall1_05_e_33:
    speaker: nihilister_m
    en: You... I'll kill you if that's the last thing I do!
    ko: 너… 내가 반드시 죽여버린다.
    ja: テメー…絶対に俺が殺してやる。
  event_goddessfall1_05_e_34:
    speaker: indivilia
    en: I told you, it cannot be done. You insist regardless.
    ko: 안된다니까 자꾸 그러시네.
    ja: 無理だと、何度も言っているでしょう。
  event_goddessfall1_05_e_35:
    speaker: indivilia
    en: While we remain under the Queen's command, we cannot fight among ourselves.
    ko: 퀸의 지배를 받는 사이에, 우리끼리는 싸울 수 없어요.
    ja: |-
      クイーンの支配下にある者同士、
      互いに刃を向けることはできません。
  event_goddessfall1_05_e_36:
    speaker: indivilia
    en: Besides... fighting corpses is hardly my pastime.
    ko: 그리고… 송장과 싸우는 건 제 취미도 아니고요.
    ja: それに…死体と戦う趣味はありませんし。
  event_goddessfall1_05_e_37:
    speaker: nihilister_m
    en: "... Damn you!"
    ko: "…빌어먹을."
    ja: "…クソが。"
  event_goddessfall1_05_e_38:
    speaker: talkative
    en: Enough. Don't provoke her anymore.
    ko: "[그만해라. 더 이상 자극하지 마라.]"
    ja: "「やめろ。これ以上刺激するな」"
  event_goddessfall1_05_e_39:
    speaker: indivilia
    en: Why not? It's fun.
    ko: 왜요? 재밌잖아요.
    ja: なぜですか？こんなに楽しいのに。
  event_goddessfall1_05_e_40:
    speaker: talkative
    en: I get that, but we're about to go into battle. Now's not the time to sow doubt.
    ko: "[그건 동의하지만 전투를 앞두고 있는 상태에서 불안 요소를 만들 필요는 없다.]"
    ja: |-
      「否定はしないが、戦場に向かっている今、
      余計なリスクを増やす必要はない」
  event_goddessfall1_05_e_41:
    speaker: indivilia
    en: There is no cause for concern, Chatterbox.
    ko: 불안 요소는 없어요, 토커티브.
    ja: トーカティブ、リスクなどありません。
  event_goddessfall1_05_e_42:
    speaker: indivilia
    en: Under the Queen's rule, our will carries little weight.
    ko: 퀸의 지배 아래에서 우리의 의지는 중요하지 않으니까.
    ja: |-
      クイーンの支配下にある限り、
      私たちの意志など取るに足らないものです。
  event_goddessfall1_05_e_43:
    speaker: indivilia
    en: Nihilister may speak boldly, yet she cannot strike us.
    ko: 니힐리스타도 말은 저렇게 하지만, 정작 우릴 공격할 수 없어요.
    ja: |-
      ニヒリスターが何を言おうと、
      実際に手を出すことはできません。
  event_goddessfall1_05_e_44:
    speaker: indivilia
    en: The same goes for us
    ko: 뭐, 우리도 마찬가지지만.
    ja: まあ、そこはお互い様ですが。
  event_goddessfall1_05_e_45:
    speaker: indivilia
    en: since we have been given orders.
    ko: 그렇게, [명령받았으니까]요.
    ja: そういう「命令」ですから。
  event_goddessfall1_05_e_46:
    speaker: nihilister_m
    en: Damn this control.
    ko: 엿같은 지배력.
    ja: クソみてえな力だ。
  event_goddessfall1_05_e_47:
    speaker: indivilia
    en: So, whatever grievances or grudges we may have with one another, let's try
      to get along, shall we?
    ko: 그러니 뭐, 서로 섭섭하거나 아쉬운 게 있어도 잘 지내봐요 우리.
    ja: |-
      そういうわけですから、
      互いに思うところはあるかもしれませんが、
      仲よくやっていきましょう。
  event_goddessfall1_05_e_48:
    speaker: indivilia
    en: Now then, would you mind fetching me a glass of water?
    ko: 아, 일단 저기 가서 물 한 잔만 떠와 주실래요?
    ja: |-
      そうですね、まずは近場から
      水でも探してきてもらえますか？
  event_goddessfall1_05_e_49:
    speaker: indivilia
    en: We ought to cooperate, don't you think?
    ko: 협력해야죠. 안 그래요?
    ja: 協力関係ですから。ねえ？
  event_goddessfall1_05_e_50:
    speaker: indivilia
    en: Since we'll be the ones doing all the hard fighting, you—who can't do anything—should
      at least try to be helpful.
    ko: |-
      열심히 싸우게 될 우리를 위해,
      아무것도 못 할 당신이 협력 좀 해주세요.
    ja: |-
      私たちはこれから命懸けで戦うのですから、
      何もできない方にもそれぐらいの
      仕事はしていただかないと。
  event_goddessfall1_05_e_51:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_52:
    speaker: indivilia
    en: There is one thing I truly wonder.
    ko: 그런데 저 진짜 궁금한 게 하나 있는데.
    ja: |-
      それはそうと、
      気になっていたことがあるのですが。
  event_goddessfall1_05_e_53:
    speaker: indivilia
    en: Why did you bring us out of the Ark?
    ko: 방주에서 저흴 꺼낸 이유가 뭔가요?
    ja: なぜ私たちをアークから解放したのですか？
  event_goddessfall1_05_e_54:
    speaker: indivilia
    en: Surely it was not for some ulterior motive that required comrades.
    ko: |-
      뭔가 다른 꿍꿍이가 있고,
      그걸 위한 동료가 필요했던 건 아닐 테고.
    ja: |-
      何かをするのに仲間が欲しかったという
      わけでもないでしょう？
  event_goddessfall1_05_e_55:
    speaker: indivilia
    en: Perhaps you merely desired a special treat? How ironic that you have become
      the treat yourself.
    ko: |-
      특식이 먹고 싶어졌다던가?
      본인이 특식이 되어버렸지만요.
    ja: |-
      たまには変わったものが食べたくなったとか？
      結局自分が食べられる結果になりましたが。
  event_goddessfall1_05_e_56:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_57:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_58:
    speaker: indivilia
    en: Surely that can't be true? You needed comrades?
    ko: |-
      설마 진짜인가요?
      동료가 필요해서?
    ja: |-
      まさか、本当に？
      仲間が必要だったのですか？
  event_goddessfall1_05_e_59:
    speaker: indivilia
    en: Heh, hehe... Ahahaha...
    ko: 후, 후후. 아하하하.
    ja: ふ、ふふ…あはははっ…
  event_goddessfall1_05_e_60:
    speaker: indivilia
    en: Nihilister, Nihilister, you foolish fire dragon.
    ko: |-
      니힐리스타, 니힐리스타.
      바보 같은 화룡.
    ja: |-
      ああ、ニヒリスター、ニヒリスター。
      愚かな火竜…
  event_goddessfall1_05_e_61:
    speaker: indivilia
    en: There's no way something like that could exist between us.
    ko: 우리 사이에 그딴 게 성립될 리가 없잖아요.
    ja: |-
      私たちの間にそんな関係が
      成立するはずないでしょう？
  event_goddessfall1_05_e_62:
    speaker: indivilia
    en: We are all merely...
    ko: 우리 모두는 그저.
    ja: 私たちは、所詮…
  event_goddessfall1_05_e_63:
    speaker: "<Narration>"
    en: Indivilia looks up at the sky.
    ko: 인디빌리아가 하늘을 본다.
    ja: インディビリアが天を仰いだ
  event_goddessfall1_05_e_64:
    speaker: indivilia
    en: scraps of that thing.
    ko: 저것의 찌꺼기일 뿐인데.
    ja: あれの残りかすに過ぎないのですから。
  event_goddessfall1_05_e_65:
    speaker: papillon
    en: "... How's Noah doing?"
    ko: "…노아는?"
    ja: "…ノアは？"
  event_goddessfall1_05_e_66:
    speaker: rapunzel
    en: She overused her core's power, causing it to overheat.
    ko: 코어의 동력을 너무 과하게 써서 오버히트가 일어났어요.
    ja: |-
      コアの出力過多によって
      オーバーヒートを起こしたようです。
  event_goddessfall1_05_e_67:
    speaker: rapunzel
    en: "... The core was destroyed, and even her body was scorched."
    ko: "…코어는 소실, 바디까지 타버릴 정도로."
    ja: "…コアが焼失し、ボディも…"
  event_goddessfall1_05_e_68:
    speaker: papillon
    en: Is her brain... intact?
    ko: 뇌… 는 무사하지?
    ja: 脳は…無事なのよね？
  event_goddessfall1_05_e_69:
    speaker: rapunzel
    en: "... We moved it to a brain shelter."
    ko: "…브레인 셸터로 옮겼어요."
    ja: "…ブレインシェルターに収納しました。"
  event_goddessfall1_05_e_70:
    speaker: papillon
    en: Th-that's a relief.
    ko: 다, 다행이네. 응.
    ja: はあ、よかったわ…
  event_goddessfall1_05_e_71:
    speaker: papillon
    en: She can be revived as long as she gets a new body, right?
    ko: 새 바디만 있으면 다시 살아날 수 있는 거잖아.
    ja: |-
      新しいボディさえあれば、
      まだ生きられるってことでしょ？
  event_goddessfall1_05_e_72:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_73:
    speaker: rapunzel
    en: Her brain overheated too, so this might be hard.
    ko: 뇌까지 가열되어서, 힘들 수도 있어요.
    ja: |-
      過熱の影響が脳に及んでいれば、
      難しいかもしれません。
  event_goddessfall1_05_e_74:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_75:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_goddessfall1_05_e_76:
    speaker: johan
    en: All of you, get ready. The battle is about to begin.
    ko: 다들 준비해라. 전투가 시작될 거다.
    ja: 全員、戦闘準備だ。次が来る。
  event_goddessfall1_05_e_77:
    speaker: papillon
    en: Johan.
    ko: 요한.
    ja: ヨハン…
  event_goddessfall1_05_e_78:
    speaker: johan
    en: What is it?
    ko: 뭐지.
    ja: 何だ？
  event_goddessfall1_05_e_79:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_80:
    speaker: papillon
    en: Never mind. It's nothing.
    ko: 아냐. 아무것도.
    ja: ううん、何でもない。
  event_goddessfall1_05_e_81:
    speaker: johan
    en: All of you, move out.
    ko: 다들 나가봐라.
    ja: 2人とも、急げ。
  event_goddessfall1_05_e_82:
    speaker: rapunzel
    en: "... Yes."
    ko: "…예."
    ja: "…はい。"
  event_goddessfall1_05_e_83:
    speaker: papillon
    en: "... Roger that."
    ko: "…응."
    ja: "…うん。"
  event_goddessfall1_05_e_84:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_goddessfall1_05_e_85:
    speaker: "<Narration>"
    en: Rapunzel and Papillon leave the infirmary.
    ko: 라푼젤과 파피용이 의무실을 나갔다.
    ja: ラプンツェルとパピヨンが医務室を後にした
  event_goddessfall1_05_e_86:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_87:
    speaker: "<Narration>"
    en: Johan looks back and forth between Noah's half-burned body
    ko: 요한은 몸의 절반이 타버린 노아의 바디와.
    ja: ヨハンは、焼け残ったノアのボディの残骸と…
  event_goddessfall1_05_e_88:
    speaker: "<Narration>"
    en: and the brain shelter across from him.
    ko: 맞은 편에 있는 브레인 셸터를 번갈아 쳐다봤다.
    ja: |-
      向かい側へ置かれた
      ブレインシェルターに視線を送った
  event_goddessfall1_05_e_89:
    speaker: johan
    en: "... *Sigh*"
    ko: "…하아."
    ja: "…ふん…"
  event_goddessfall1_05_e_90:
    speaker: johan
    en: I don't even know where I should start patting her.
    ko: 어딜 쓰다듬어야 할지도 모르겠군.
    ja: |-
      どちらをなでてやればいいのかも、
      分からないな。
  event_goddessfall1_05_e_91:
    speaker: "<Narration>"
    en: Johan raises both hands, resting one on the body's head
    ko: |-
      요한은 양손을 들어,
      하나는 바디의 머리를.
    ja: |-
      ヨハンは両手を伸ばした。
      一方はボディの頭に…
  event_goddessfall1_05_e_92:
    speaker: "<Narration>"
    en: and the other on the brain shelter.
    ko: 남은 하나는 브레인 셸터에 가져다 댔다.
    ja: もう一方の手は、ブレインシェルターに触れた
  event_goddessfall1_05_e_93:
    speaker: johan
    en: You followed my orders well and acted on your own judgment.
    ko: 스스로 판단해 움직이라는 내 지시를 잘 따라줬다.
    ja: |-
      各自の判断で動けという指示を完遂したな。
      よくやってくれた。
  event_goddessfall1_05_e_94:
    speaker: johan
    en: Thanks to you, Eden didn't take so much as a scratch, and repairs on Eden's
      Spear are progressing smoothly.
    ko: |-
      네 덕분에 에덴에는 생채기 하나 나지 않았고,
      에덴의 창은 순조롭게 수리되고 있다.
    ja: |-
      お前のおかげでエデンには
      傷一つ付かなかった。
      槍の修復も順調に進んでいる。
  event_goddessfall1_05_e_95:
    speaker: johan
    en: The Monk and the Spy made it out alive, too.
    ko: 성녀와, 스파이의 목숨도 무사하다.
    ja: 聖女とスパイも無事だ。
  event_goddessfall1_05_e_96:
    speaker: johan
    en: So...
    ko: 그러니….
    ja: あとは…
  event_goddessfall1_05_e_97:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_98:
    speaker: johan
    en: I will have my revenge
    ko: 꼭 복수하겠다.
    ja: 復讐は、必ず果たす。
  event_goddessfall1_05_e_99:
    speaker: johan
    en: on that arrogant thing watching us from above.
    ko: 저 위에서 우릴 오만하게 내려다보고 있는 저것에게.
    ja: |-
      空の上で私たちを見下している、
      おごった奴にな。
  event_goddessfall1_05_e_100:
    speaker: johan
    en: I'll bring it down.
    ko: 반드시 복수하겠다.
    ja: 果たしてみせる。
  event_goddessfall1_05_e_101:
    speaker: johan
    en: Mark my words.
    ko: 지켜봐라.
    ja: 見ていてくれ。
  event_goddessfall1_05_e_102:
    speaker: johan
    en: "... Good work."
    ko: "…수고 많았다."
    ja: "…ご苦労だった。"
  event_goddessfall1_05_e_103:
    speaker: marian_q
    en: "... This place is...?"
    ko: "…여긴."
    ja: "…ここは…"
  event_goddessfall1_05_e_104:
    speaker: nayuta
    en: Eden it is, Young Lady Marian.
    ko: 에덴이외다. 마리안 소저.
    ja: エデンの内部です、マリアン。
  event_goddessfall1_05_e_105:
    speaker: marian_q
    en: Eden...
    ko: 에덴….
    ja: エデン…
  event_goddessfall1_05_e_106:
    speaker: marian_q
    en: Who are you?
    ko: 누구신가요?
    ja: どちら様ですか？
  event_goddessfall1_05_e_107:
    speaker: nayuta
    en: I go by Nayuta, the fourth member of the Forerunner.
    ko: 선구자, 파이오니아의 네 번째 식객, 나유타라 하외다.
    ja: |-
      先駆者…いえ、パイオニアの4番目の居候、
      ナユタと申します。
  event_goddessfall1_05_e_108:
    speaker: marian_q
    en: "... Like Snow White, Scarlet, and Rapunzel..."
    ko: "…스노우 화이트, 홍련, 라푼젤과 같은…."
    ja: |-
      …じゃあ、スノーホワイトと、紅蓮と、
      ラプンツェルの…
  event_goddessfall1_05_e_109:
    speaker: nayuta
    en: So it is. They are all here...
    ko: 그렇소. 모두 여기 있소.
    ja: いかにも。全員この場に揃っています。
  event_goddessfall1_05_e_110:
    speaker: nayuta
    en: assembled to vanquish the Queen.
    ko: "…퀸을 잡기 위해 이곳에 모였소."
    ja: "…クイーンを討つため、集結しました。"
  event_goddessfall1_05_e_111:
    speaker: nayuta
    en: Their purpose is as thine own, Young Lady Marian.
    ko: 마리안 소저와 같은 목적이외다.
    ja: あなたと同じ目的です。
  event_goddessfall1_05_e_112:
    speaker: marian_q
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_05_e_113:
    speaker: nayuta
    en: Young Lady Marian.
    ko: 자, 마리안 소저.
    ja: さて、マリアン…
  event_goddessfall1_05_e_114:
    speaker: nayuta
    en: Though this be our first acquaintance, I would fain proffer unto thee some
      counsel.
    ko: 소인. 마리안 소저와는 초면이오만 제안을 하나 할까 하외다.
    ja: |-
      初対面でぶしつけながら、
      ひとつ忠告しておくべきことがあります。
  event_goddessfall1_05_e_115:
    speaker: nayuta
    en: Should any inquisitive soul inquire how thou camest hither unaccompanied,
      or why the Maiden of Thunder struck thee down,
    ko: |-
      소저가 어찌하여 혼자 이곳으로 왔는지,
      어찌하여 뇌전 소저에게 난도질을 당했는지에 대해서 누가 묻거든.
    ja: |-
      なぜあなたが1人でここへ来たのか、
      なぜあのような状態だったのか、
      誰かから聞かれた時に備えて…
  event_goddessfall1_05_e_116:
    speaker: nayuta
    en: be steadfast in declaring it naught but mere happenstance.
    ko: 이것을 모두 우연의 일치라고 바락바락 우기거나.
    ja: すべて偶然そうなっただけと言い張るか…
  event_goddessfall1_05_e_117:
    speaker: nayuta
    en: Or else, reveal thy true name and purpose. 'Twere most prudent to pursue but
      one of these courses.
    ko: |-
      소저의 정체와 목적에 대해 밝히거나.
      둘 중 하나만 하는 것이 좋을 것이외다.
    ja: |-
      それとも、あなたの正体と目的を明かすか、
      方針を決めておいた方がいいでしょう。
  event_goddessfall1_05_e_118:
    speaker: marian_q
    en: "... Do you know what I am?"
    ko: "…제가 어떤 존재인지 알고 계시나요?"
    ja: "…私がどういう存在か知っているんですか？"
  event_goddessfall1_05_e_119:
    speaker: nayuta
    en: Verily, I am aware.
    ko: 알고 있소.
    ja: ええ。
  event_goddessfall1_05_e_120:
    speaker: marian_q
    en: Who do you think I am?
    ko: 제가 뭔데요.
    ja: 私って、何なんですか？
  event_goddessfall1_05_e_121:
    speaker: nayuta
    en: The Queen.
    ko: 퀸.
    ja: クイーン。
  event_goddessfall1_05_e_122:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_123:
    speaker: marian_q
    en: Please keep it a secret. I beg you.
    ko: 비밀로 해주세요. 부탁이에요.
    ja: 秘密にしてください。お願いです。
  event_goddessfall1_05_e_124:
    speaker: nayuta
    en: Should that be thy choice, I shall honor it forthwith.
    ko: 알겠소. 그것이 소저의 선택이라면 존중하겠소.
    ja: |-
      分かりました。
      それがあなたの意志であれば、
      尊重しましょう。
  event_goddessfall1_05_e_125:
    speaker: nayuta
    en: Yet, in sooth,
    ko: 허나.
    ja: ですが…
  event_goddessfall1_05_e_126:
    speaker: nayuta
    en: given the present state of affairs, information doth overflow.
    ko: 상황이 상황인 만큼 정보가 흘러넘치고 있소.
    ja: |-
      今は状況が状況です。
      流言も信用されかねません。
  event_goddessfall1_05_e_127:
    speaker: nayuta
    en: Should they hear from the enemy's mouth who thou art,
    ko: 이런 와중에, 적의 입에서 소저가 어떤 존재인지 듣는다면.
    ja: |-
      いざという時、敵の口から
      この話を出されてしまえば…
  event_goddessfall1_05_e_128:
    speaker: nayuta
    en: the chaos that ensueth may prove most dire.
    ko: 그로 인해 일어난 혼란은 치명적일 수 있소이다.
    ja: 命取りとなる混乱が起きる可能性もあります。
  event_goddessfall1_05_e_129:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_130:
    speaker: marian_q
    en: If I tell them what I am,
    ko: 제가 어떤 존재인지 입 밖으로 꺼낸다면.
    ja: 私の正体を知ったら…
  event_goddessfall1_05_e_131:
    speaker: marian_q
    en: do you really think they would just leave me be?
    ko: 모두가 저를 가만히 놔둘까요?
    ja: みなさんは、どう思うでしょうか？
  event_goddessfall1_05_e_132:
    speaker: marian_q
    en: These are people who have spent years roaming the surface to kill the Queen.
    ko: 퀸을 죽이기 위해 그렇게 오랜 시간 지상을 떠돌았던 분들이에요.
    ja: |-
      クイーンを倒すために、
      長い間地上をさすらっている人たちです。
  event_goddessfall1_05_e_133:
    speaker: marian_q
    en: I don't believe that spending a little time together would weaken their purpose.
    ko: |-
      잠깐 같이 지냈다고 해서,
      그 목적이 희석될 것이라고는 생각하지 않아요.
    ja: |-
      少し一緒に過ごしていたぐらいで、
      私を信じてくれるなんて…
  event_goddessfall1_05_e_134:
    speaker: nayuta
    en: I have known the Forerunners but a short while, and my sojourn in Eden has
      been yet briefer.
    ko: |-
      소인. 선구자 소저들과 같이 지낸 시간은 길지 않소.
      에덴은 더욱더 짧다고 할 수 있소.
    ja: |-
      正直なところ…
      私と先駆者たちの付き合いも長くはない。
      エデンとはさらに短いものです。
  event_goddessfall1_05_e_135:
    speaker: nayuta
    en: Yet I do, verily, pride myself on mine own discerning eye for people.
    ko: 허나 소인은 사람 보는 눈 하나만은 확실하다고 자부하오.
    ja: |-
      しかし、人を見る目だけは確かだと
      自負しています。
  event_goddessfall1_05_e_136:
    speaker: marian_q
    en: Your eyes are closed, you know.
    ko: 눈 감고 계신데요.
    ja: 目を閉じてるのに？
  event_goddessfall1_05_e_137:
    speaker: nayuta
    en: "... Verily, does this suffice?"
    ko: "…이러면 되었소?"
    ja: "…これでよいでしょうか？"
  event_goddessfall1_05_e_138:
    speaker: marian_q
    en: You have beautiful eyes.
    ko: 예쁜 눈이네요.
    ja: きれいな目ですね。
  event_goddessfall1_05_e_139:
    speaker: nayuta
    en: Pray, let us return to the matter at hand.
    ko: 아무튼 돌아와서.
    ja: とにかく、話を戻しますが…
  event_goddessfall1_05_e_140:
    speaker: nayuta
    en: Dost thou think that they would lose all reason and seek to take thy life
      if they knew thee to be the Queen?
    ko: |-
      마리안 소저가 보기에 그들이,
      마리안 소저가 퀸이라 하면 눈이 뒤집혀서 죽이려 들 것 같소?
    ja: |-
      あなたからみて、彼女たちは
      自分がクイーンだと明かした瞬間
      目の色を変えて襲ってきそうに見えますか？
  event_goddessfall1_05_e_141:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_142:
    speaker: nayuta
    en: Surely thou knowest the answer.
    ko: 답은 알지 않소.
    ja: 答えはご自分でお分かりでしょう。
  event_goddessfall1_05_e_143:
    speaker: marian_q
    en: "... I... can't say for sure."
    ko: "…확신이… 들지 않아요."
    ja: "…確信は…持てません。"
  event_goddessfall1_05_e_144:
    speaker: nayuta
    en: 'Very well. Then I shall grant thee a promise:'
    ko: 좋소. 그럼 소인 약속 하나 드리오.
    ja: |-
      たいへん結構。
      では、1つ約束してさしあげましょう。
  event_goddessfall1_05_e_145:
    speaker: nayuta
    en: should either the Forerunners or Eden lay gun or blade upon thee,
    ko: |-
      선구자와 에덴 그 어느 쪽이든,
      마리안 소저에게 총이나 칼을 들이댄다면.
    ja: |-
      先駆者であれ、エデンであれ、
      あなたが武器を向けられた時は…
  event_goddessfall1_05_e_146:
    speaker: nayuta
    en: I shall defend thee, even at the cost of mine own life.
    ko: 소인이 목숨을 걸고 막아주겠소.
    ja: 私の命をかけてお守りしましょう。
  event_goddessfall1_05_e_147:
    speaker: marian_q
    en: "... But we've only just met."
    ko: "…저희는 오늘 처음 만났는데요."
    ja: "…私たち、今日初めて会いましたよね。"
  event_goddessfall1_05_e_148:
    speaker: nayuta
    en: Did I not speak unto thee? Mine eye for people is most discerning.
    ko: |-
      말하지 않았소.
      사람 보는 눈 하나는 확실하다고.
    ja: |-
      言いませんでしたか？
      人を見る目には自信があるのです。
  event_goddessfall1_05_e_149:
    speaker: nayuta
    en: Thou art... aye,
    ko: 소저는… 그래.
    ja: あなたこそが…
  event_goddessfall1_05_e_150:
    speaker: nayuta
    en: I have no doubt that thou art one who holdeth the fate of this realm with
      thine hands.
    ko: 이 세계의 명운을 쥐고 있는 존재임과 동시에.
    ja: この世界の命運を握っていると同時に…
  event_goddessfall1_05_e_151:
    speaker: nayuta
    en: And at once, one destined to bring forth true peace. Verily, I doubt it not.
    ko: 진정한 의미의 평화를 가져다줄 존재라고 믿어 의심치 않소.
    ja: |-
      真の意味で平和をもたらす存在だと
      信じているからです。
  event_goddessfall1_05_e_152:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_153:
    speaker: nayuta
    en: 'And prithee, keep this a secret:'
    ko: 그리고 이건 비밀이오만.
    ja: 秘密はもう一つありまして。
  event_goddessfall1_05_e_154:
    speaker: nayuta
    en: I do possess thousands of lives. Thus, I shall protect you countless times
      over.
    ko: |-
      소인, 목숨이 수천 개는 된다오.
      그러니 마리안 소저를 수천 번은 지켜줄 수 있다는 얘기지.
    ja: |-
      実のところ、私の命はいくつもあるのです。
      命と引き換えでも幾千回は守れますよ。
  event_goddessfall1_05_e_155:
    speaker: marian_q
    en: Pfft.
    ko: 푸후-
    ja: ふふっ。
  event_goddessfall1_05_e_156:
    speaker: nayuta
    en: Hohoho, verily, this is no jest.
    ko: 허허. 농담이 아니거늘.
    ja: ははっ…冗談ではないのですがねぇ。
  event_goddessfall1_05_e_157:
    speaker: nayuta
    en: Pray, ponder it well.
    ko: 아무튼, 잘 생각해 보시오.
    ja: とにかく、よくお考えになってください。
  event_goddessfall1_05_e_158:
    speaker: nayuta
    en: Would it not be a thing most splendid?
    ko: 그리고 멋지지 않겠소?
    ja: それに、その方が美しいと思いませんか？
  event_goddessfall1_05_e_159:
    speaker: marian_q
    en: What would?
    ko: 뭐가요?
    ja: 何がですか？
  event_goddessfall1_05_e_160:
    speaker: nayuta
    en: To stand before all,
    ko: 모두가 보는 앞에서.
    ja: 誰にも隠さず堂々と…
  event_goddessfall1_05_e_161:
    speaker: nayuta
    en: and proclaim
    ko: 본인이 랩쳐의 퀸이외다.
    ja: 自分がラプチャーのクイーンです。
  event_goddessfall1_05_e_162:
    speaker: nayuta
    en: thyself the Queen of the Raptures.
    ko: 라고 말하는 것 말이오.
    ja: そう明かせる方が。
  event_goddessfall1_05_e_163:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_164:
    speaker: nayuta
    en: I shall take my leave now.
    ko: 소인은 이만 가보겠소.
    ja: では、これにて失礼。
  event_goddessfall1_05_e_165:
    speaker: nayuta
    en: Thy wounds shall mend in due time, so come forth at thy leisure.
    ko: 몸은 조금 지나면 다 나을 테니, 천천히 나오시오.
    ja: |-
      身体は時が経てば治るでしょう。
      急ぐ必要はありません。
  event_goddessfall1_05_e_166:
    speaker: marian_q
    en: Uh... Nayuta?
    ko: 저… 나유타?
    ja: ええと…ナユタ、でしたか？
  event_goddessfall1_05_e_167:
    speaker: nayuta
    en: Do tell.
    ko: 말씀하시오.
    ja: 何でしょう？
  event_goddessfall1_05_e_168:
    speaker: marian_q
    en: "... Thank you."
    ko: "…고마워요."
    ja: "…ありがとうございます。"
  event_goddessfall1_05_e_169:
    speaker: nayuta
    en: "... Hoho."
    ko: "…허허."
    ja: "…はは…"
  event_goddessfall1_05_e_170:
    speaker: nayuta
    en: Behold. Did I not say mine eyes are keen?
    ko: 그것 보시오. 소인, 보는 눈이 좋다 하지 않았소.
    ja: やはり、私には見る目があるようです。
  event_goddessfall1_05_e_171:
    speaker: isabel_op_l
    en: Harran. Noah has—
    ko: 하란. 노아가….
    ja: ハラン。ノアが…
  event_goddessfall1_05_e_172:
    speaker: harran
    en: I heard.
    ko: 들었단다.
    ja: 聞いたわ。
  event_goddessfall1_05_e_173:
    speaker: harran
    en: She put up quite a fight. Quite well, too.
    ko: 힘냈더구나. 잘 해냈고.
    ja: 頑張ったそうね。よくやってくれたわ。
  event_goddessfall1_05_e_174:
    speaker: isabel_op_r
    en: "... Yeah."
    ko: "…응."
    ja: "…ええ。"
  event_goddessfall1_05_e_175:
    speaker: harran
    en: There is neither time to grieve nor wallow in sorrow.
    ko: 애도를 표할 시간도, 슬픔에 잠겨있을 시간도 없단다.
    ja: |-
      今は嘆いている時間も、
      悲しみに浸る余裕もないわ。
  event_goddessfall1_05_e_176:
    speaker: harran
    en: You know full well that should you surrender to such feelings now, death will
      swiftly claim you.
    ko: 알잖니. 지금 그 감정에 휩싸이면 죽을 것이라는 걸.
    ja: |-
      分かるでしょう。
      そんな感情に飲まれれば終わりよ。
  event_goddessfall1_05_e_177:
    speaker: isabel_op_r
    en: Yeah, I know.
    ko: 알아.
    ja: 分かってるわ。
  event_goddessfall1_05_e_178:
    speaker: isabel_op_r
    en: I just wanted to tell her how amazing she was.
    ko: 대단했다고, 말해주고 싶어서.
    ja: 立派だったって、言ってあげたかっただけ。
  event_goddessfall1_05_e_179:
    speaker: isabel_op_r
    en: It looked even better from up in the air.
    ko: 공중에서는 더 잘 보였거든.
    ja: 空からよく見えたの。
  event_goddessfall1_05_e_180:
    speaker: harran
    en: Is that so? That must have been quite the spectacle.
    ko: 그렇니. 그거참 장관이었겠구나.
    ja: そう。壮観だったでしょうね。
  event_goddessfall1_05_e_181:
    speaker: isabel_op_r
    en: Yeah, it really was magnificent.
    ko: 응. 정말 멋졌어.
    ja: ええ。本当に格好良かったわ。
  event_goddessfall1_05_e_182:
    speaker: harran
    en: Haha, she truly proved herself as the strongest shield that she could've hoped
      for.
    ko: 후후. 지상 최강의 방패라는 것을 증명하고야 말았구나.
    ja: |-
      ふふ…地上最強の盾が誰か、
      証明されてしまったわね。
  event_goddessfall1_05_e_183:
    speaker: harran
    en: "... How admirable."
    ko: "…장하기도 해라."
    ja: "…立派だった。"
  event_goddessfall1_05_e_184:
    speaker: isabel_op_r
    en: Exactly. It was impressive.
    ko: 맞아. 장해.
    ja: ええ。本当に。
  event_goddessfall1_05_e_185:
    speaker: harran
    en: Then I shall take my leave.
    ko: 이만 끊겠다.
    ja: 切るわね。
  event_goddessfall1_05_e_186:
    speaker: isabel_op_r
    en: Yeah, take care.
    ko: 응. 수고해.
    ja: ええ。頑張って。
  event_goddessfall1_05_e_187:
    speaker: harran
    en: You too.
    ko: 그래.
    ja: あなたも。
  event_goddessfall1_05_e_188:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_189:
    speaker: snowwhite
    en: Don't just stand there.
    ko: 멍하니 있지 마라.
    ja: ぼんやりするな。
  event_goddessfall1_05_e_190:
    speaker: harran
    en: Oh, forgive me.
    ko: 아, 미안하구나.
    ja: あら…ごめんなさい。
  event_goddessfall1_05_e_191:
    speaker: harran
    en: "... Snow White, have you ever lost a comrade?"
    ko: "…스노우 화이트야. 동료를 잃은 적이 있니?"
    ja: "…スノーホワイト。仲間を失ったことはある？"
  event_goddessfall1_05_e_192:
    speaker: snowwhite
    en: Many times.
    ko: 많다.
    ja: 何度もある。
  event_goddessfall1_05_e_193:
    speaker: harran
    en: So time really healed it?
    ko: 시간이 해결해 주더니?
    ja: 時間が解決してくれるのかしら？
  event_goddessfall1_05_e_194:
    speaker: snowwhite
    en: No.
    ko: 아니.
    ja: いいや。
  event_goddessfall1_05_e_195:
    speaker: snowwhite
    en: I fought on despite the pain.
    ko: 괴로워하면서 계속 싸웠다.
    ja: 苦しみながら戦っている。
  event_goddessfall1_05_e_196:
    speaker: harran
    en: Heh, not so easy, huh?
    ko: 후후. 쉽지 않구나.
    ja: ふふ。大変そうね。
  event_goddessfall1_05_e_197:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_198:
    speaker: snowwhite
    en: Be strong.
    ko: 힘내라.
    ja: 頑張れ。
  event_goddessfall1_05_e_199:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_05_e_200:
    speaker: harran
    en: I plan to.
    ko: 그럴 생각이란다.
    ja: そのつもりよ。
  event_goddessfall1_05_e_201:
    speaker: "<Narration>"
    en: Harran swings her scythe at the Raptures.
    ko: 하란의 낫이 랩쳐들을 향해 휘둘러졌다.
    ja: |-
      ハランがラプチャーに向かって、
      鎌を振りあげた
event_goddessfall1_06_s:
  event_goddessfall1_06_s_1:
    speaker: "<Narration>"
    en: In Eden, Nayuta sits cross-legged on the railing, surveying the battlefield.
    ko: 나유타는 에덴의 난간에 정좌를 틀고 앉은 채 전장을 지켜보고 있었다.
    ja: |-
      ナユタはエデンの欄干の上に
      姿勢を正して座り、
      戦場の様子をうかがっていた
  event_goddessfall1_06_s_2:
    speaker: "<Narration>"
    en: The Raptures are pressing in on Eden from all directions.
    ko: 랩쳐들은 사방에서 끊임없이 에덴으로 다가오고 있다.
    ja: |-
      ラプチャーは絶えることなく、
      四方からエデンに迫っている
  event_goddessfall1_06_s_3:
    speaker: "<Narration>"
    en: Their movements are unnervingly unified—perfectly in sync.
    ko: 이상할 정도로 맹목적이고 일사불란한 모습.
    ja: |-
      その動きは奇妙なほどに偏執的で、
      統率がとれていた
  event_goddessfall1_06_s_4:
    speaker: nayuta
    en: "... So it is. The Queen's sway could not have reached the Heretics alone."
    ko: "…그래. 퀸의 지배력이 헬레틱에게만 영향을 미쳤을 리가 없지."
    ja: |-
      …クイーンの支配による影響は、
      ヘレティックだけが受けたのではない、か…
  event_goddessfall1_06_s_5:
    speaker: "<Narration>"
    en: The Pioneer and Inherit squads are fighting brilliantly.
    ko: 파이오니아 스쿼드와 인헤르트 스쿼드는 잘 싸워주고 있다.
    ja: |-
      パイオニアとインヘルトの面々は、
      懸命に戦闘を続けていた
  event_goddessfall1_06_s_6:
    speaker: "<Narration>"
    en: No, they're far better than anyone could have imagined.
    ko: 아니, 믿을 수 없을 정도로 싸워주고 있다.
    ja: むしろ、信じがたいほどに善戦している
  event_goddessfall1_06_s_7:
    speaker: "<Narration>"
    en: Though only five in number, they are holding back the massive horde of Raptures.
    ko: 고작 다섯으로 저 많은 랩쳐들의 대군을 막아내고 있다.
    ja: |-
      わずか5名の戦力で、
      無数のラプチャーを押し返しているのだから
  event_goddessfall1_06_s_8:
    speaker: nayuta
    en: Yet...
    ko: "…허나."
    ja: "…しかし…"
  event_goddessfall1_06_s_9:
    speaker: "<Narration>"
    en: Tyrant-class Raptures haven't joined yet,
    ko: 아직 타일런트 급이 합류하지 않았다.
    ja: まだタイラント級は戦線に合流していない
  event_goddessfall1_06_s_10:
    speaker: "<Narration>"
    en: and neither have the Heretics.
    ko: 그리고, 헬레틱도.
    ja: むろん、ヘレティックも
  event_goddessfall1_06_s_11:
    speaker: nayuta
    en: "... Is it but a matter of time ere they be overrun?"
    ko: "…밀리는 건 시간문제인가."
    ja: "…時間の問題か。"
  event_goddessfall1_06_s_12:
    speaker: "<Narration>"
    en: Nayuta looks toward the horizon.
    ko: 나유타는 지평선을 바라보았다.
    ja: ナユタは遠く地平線に目を向けた
  event_goddessfall1_06_s_13:
    speaker: nayuta
    en: I beseech you, do not be late.
    ko: 부디, 늦지 않기를.
    ja: どうか、間に合ってくれ…
  event_goddessfall1_06_s_14:
    speaker: "<Narration>"
    en: Two hours later.
    ko: 2시간 후.
    ja: 2時間後
  event_goddessfall1_06_s_15:
    speaker: cecil
    en: Eden's Spear is ready to fire.
    ko: 에덴의 창. 발사 가능해요.
    ja: エデンの槍、発射可能です。
  event_goddessfall1_06_s_16:
    speaker: johan
    en: Good. Get it ready.
    ko: 좋다. 준비해라.
    ja: よし。準備を進めてくれ。
  event_goddessfall1_06_s_17:
    speaker: cecil
    en: We'll have to aim and fire manually since the bombardment damaged the remote
      system.
    ko: |-
      조준과 발사는 수동으로 해야 해요.
      포격으로 원격 기능이 망가졌어요.
    ja: |-
      照準と発射は手動です。
      砲撃により誘導能力は喪失しています。
  event_goddessfall1_06_s_18:
    speaker: cecil
    en: I'll send you the coordinates
    ko: 좌표 전달할게요.
    ja: 目標とできるものは…
  event_goddessfall1_06_s_19:
    speaker: cecil
    en: for the Queen
    ko: 좌표는 퀸과.
    ja: クイーン…
  event_goddessfall1_06_s_20:
    speaker: cecil
    en: and the Heretics encamped in front of Eden.
    ko: 에덴 앞에 진을 치고 있는 헬레틱이예요.
    ja: |-
      もしくは、エデンの正面に集結している
      ヘレティックの一団です。
  event_goddessfall1_06_s_21:
    speaker: cecil
    en: You'll need to make a choice.
    ko: 선택해 주시면 되겠네요.
    ja: 選択してください。
  event_goddessfall1_06_s_22:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_s_23:
    speaker: hongryeon
    en: Hup!
    ko: 흐읍!
    ja: はぁっ！
  event_goddessfall1_06_s_24:
    speaker: "<Narration>"
    en: Scarlet's blade slashes through a Harvester's leg.
    ko: 홍련의 검격이 하베스터의 다리를 베었다.
    ja: 紅蓮の剣がハーベスターの脚部を切断した
  event_goddessfall1_06_s_25:
    speaker: "<Narration>"
    en: As it staggers, Isabel drives a feather into its head.
    ko: |-
      자세가 무너지며 휘청이는 하베스터의 머리에,
      이사벨이 페더를 꽂아 넣는다.
    ja: |-
      体勢を崩したハーベスターの頭部に
      イサベルがフェザーを突き刺した
  event_goddessfall1_06_s_26:
    speaker: "<Narration>"
    en: The massive creature collapses, sending up dust that blankets the area.
    ko: 하베스터의 거체가 무너지며 흙먼지가 일대를 가득 매웠다.
    ja: 巨体が倒れ、砂ぼこりが周囲に広がった
  event_goddessfall1_06_s_27:
    speaker: isabel
    en: You actually cut through a Harvester's leg with that sword?
    ko: "…검으로 하베스터의 다리를 베었단 말이야?"
    ja: "…剣で斬れるものなの？"
  event_goddessfall1_06_s_28:
    speaker: hongryeon
    en: Well, fortune smiles upon me, it seems.
    ko: 뭐, 운이 좋았
    ja: まあ、運がよかっ――
  event_goddessfall1_06_s_29:
    speaker: "<Narration>"
    en: "*Thuk!*"
    ko: 푸욱-!
    ja: ドスッ――！
  event_goddessfall1_06_s_30:
    speaker: hongryeon
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall1_06_s_31:
    speaker: "<Narration>"
    en: A golden blade pierces Scarlet's abdomen.
    ko: 홍련의 복부에 금색 칼날이 박힌다.
    ja: 紅蓮の腹を突き破り、金色の刃が飛び出した
  event_goddessfall1_06_s_32:
    speaker: "<Narration>"
    en: As the smoke clears, Indivilia emerges from within.
    ko: 연기가 걷어지고, 그 안에서 인디빌리아가 모습을 드러냈다.
    ja: |-
      薄れゆく砂ぼこりの中から、
      インディビリアの姿が浮かび上がった
  event_goddessfall1_06_s_33:
    speaker: indivilia
    en: To think you can use a Tyrant-class Rapture as bait. These mass assaults really
      are too convenient.
    ko: |-
      타일런트 급을 미끼로 쓸 수 있다니,
      물량전은 너무 편하네요.
    ja: |-
      タイラント級をおとりにしていいなんて、
      数の暴力は楽でいいですね。
  event_goddessfall1_06_s_34:
    speaker: hongryeon
    en: A sneak attack...! Just the sort of trick I might expect of thee...!
    ko: 기습인가…! 자네가 할 법한 일이군…!
    ja: 不意打ちか…！相変わらずだねぇ…！
  event_goddessfall1_06_s_35:
    speaker: indivilia
    en: What, were you hoping for a one-on-one duel? Heh, dream on.
    ko: |-
      일대일 진검승부라도 하고 싶으신 건가요?
      후후. 그런 건 꿈에서나 하세요.
    ja: |-
      一対一の真剣勝負でもしたかったのですか？
      ふふ…そういうものは夢の中でどうぞ。
  event_goddessfall1_06_s_36:
    speaker: isabel
    en: Indivilia!
    ko: 인디빌리아!
    ja: インディビリア！
  event_goddessfall1_06_s_37:
    speaker: "<Narration>"
    en: Isabel dives toward Indivilia.
    ko: 이사벨이 인디빌리아를 향해 강하한다.
    ja: イサベルがインディビリアに向かって急降下した
  event_goddessfall1_06_s_38:
    speaker: indivilia
    en: I'm afraid I have no interest in a direct duel with any of you.
    ko: 죄송하지만 저는 당신들과 정면 승부 같은 건 관심이 없어요.
    ja: |-
      あいにく、私は正々堂々なんて
      趣味はありませんので。
  event_goddessfall1_06_s_39:
    speaker: indivilia
    en: I do hope you survive this endless sea of Raptures,
    ko: 부디, 이 무한한 랩쳐들의 바다에서 살아남기를 바랄게요.
    ja: |-
      この無限のラプチャーの海を、
      頑張って泳ぎ切ってください。
  event_goddessfall1_06_s_40:
    speaker: indivilia
    en: and me as well.
    ko: 그리고, 저에게서도.
    ja: もちろん、私も見ているだけではありませんよ。
  event_goddessfall1_06_s_41:
    speaker: "<Narration>"
    en: Indivilia slips into the cloud of dust.
    ko: 인디빌리아가 먼지구름 사이로 몸을 숨겼다.
    ja: インディビリアの姿が砂ぼこりの中にかき消えた
  event_goddessfall1_06_s_42:
    speaker: harran
    en: The situation is grim. Indivilia has joined the fray,
    ko: |-
      상황이 안 좋구나.
      인디빌리아가 참전했어.
    ja: |-
      よくない状況ね。
      インディビリアが戦線に出てきたわ。
  event_goddessfall1_06_s_43:
    speaker: harran
    en: and even Tyrant-class Raptures are pouring in. We're also losing ground from
      a lack of firepower.
    ko: 타일런트 급까지 대량 참전해 화력 부족으로 밀리고 있구나.
    ja: |-
      タイラント級も多数出現。
      火力不足で押され始めてるわね。
  event_goddessfall1_06_s_44:
    speaker: harran
    en: Snow White, what are you going to do?
    ko: 스노우 화이트야. 어떡할 거니?
    ja: スノーホワイト。何か策はある？
  event_goddessfall1_06_s_45:
    speaker: snowwhite
    en: Advance.
    ko: 전진한다.
    ja: 前進する。
  event_goddessfall1_06_s_46:
    speaker: harran
    en: What nonsense are you spouting?
    ko: 무슨 미친 소리니.
    ja: どういう意味？
  event_goddessfall1_06_s_47:
    speaker: snowwhite
    en: We need to move in closer and take out more of them.
    ko: 좀 더 가까이에서 좀 더 많은 놈들을 맞추면 된다.
    ja: 敵により接近し、より多くの敵を倒す。
  event_goddessfall1_06_s_48:
    speaker: harran
    en: How convenient.
    ko: 그거참 편리한 전술이구나.
    ja: できるなら最高の戦術ね。
  event_goddessfall1_06_s_49:
    speaker: papillon
    en: Sorry to be a buzzkill, but we're running low on supplies.
    ko: |-
      찬물 끼얹는 것 같아서 미안한데,
      슬슬 보급이 속도를 못 따라가.
    ja: |-
      水を差すようで悪いけど、そろそろ補給も
      追いつかなくなってきてるわ。
  event_goddessfall1_06_s_50:
    speaker: snowwhite
    en: Then I'll take down two per shot.
    ko: 그럼 한발에 두 놈씩 잡으면 되겠군.
    ja: なら、一発で2体ずつ倒せばいい。
  event_goddessfall1_06_s_51:
    speaker: harran
    en: Heh, you say such crazy things as if it's nothing.
    ko: 후후. 정신 나간 소릴 아무렇지도 않게 하는구나.
    ja: ふふ…とんでもないことを真顔で言うわね。
  event_goddessfall1_06_s_52:
    speaker: harran
    en: Fine, I'll humor you.
    ko: 좋다. 어울려주마.
    ja: いいわ。付き合ってあげましょう。
  event_goddessfall1_06_s_53:
    speaker: snowwhite
    en: I'm going. Follow me, Papillon.
    ko: 간다. 따라와라, 파피용.
    ja: 行くぞ。遅れるな、パピヨン。
  event_goddessfall1_06_s_54:
    speaker: papillon
    en: Eh? I'm going too? Come on, cut me some slack!
    ko: 엑? 나도 가는 거야? 좀 봐주라~
    ja: えっ？私も行くの？カンベンしてよ～
  event_goddessfall1_06_s_55:
    speaker: snowwhite
    en: We can't win without supplies.
    ko: 보급 없이는 이길 수 없다.
    ja: 補給がなければ勝てない。
  event_goddessfall1_06_s_56:
    speaker: papillon
    en: "... Just so you know, I'm staying in the safe zone. I'll only dip one toe
      into this crazy plan of yours."
    ko: |-
      …말해놓는데, 난 안전 지역에만 있을 거야.
      미친 짓에는 한발만 담글 거라고.
    ja: |-
      …言っとくけど、安全なところまでだからね。
      片足突っ込むだけでも
      ゴメンだってぐらいなのに…
  event_goddessfall1_06_s_57:
    speaker: snowwhite
    en: Very well.
    ko: 그래.
    ja: それでいい。
  event_goddessfall1_06_s_58:
    speaker: harran
    en: I don't know how long that safe zone will last, though.
    ko: 그 안전 지역이 얼마나 갈진 모르겠지만 말이다.
    ja: 安全な場所なんて、いつまであるかしらねぇ。
  event_goddessfall1_06_s_59:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_s_60:
    speaker: "<Narration>"
    en: Johan stands before Eden's Spear's aiming controls, lost in thought.
    ko: 요한은 에덴의 창 조준 장치 앞에서 생각에 잠겨있었다.
    ja: |-
      ヨハンはエデンの槍の照準装置の前で
      静かに考え込んでいた
  event_goddessfall1_06_s_61:
    speaker: rapunzel
    en: Brother Johan.
    ko: 요한 형제님.
    ja: ヨハン。
  event_goddessfall1_06_s_62:
    speaker: johan
    en: What is it?
    ko: 뭐냐.
    ja: 何だ。
  event_goddessfall1_06_s_63:
    speaker: rapunzel
    en: What are you hesitating about?
    ko: 뭘 망설이고 있나요.
    ja: 何か迷っておられるようですね。
  event_goddessfall1_06_s_64:
    speaker: johan
    en: I'm deciding where to fire Eden's Spear.
    ko: 에덴의 창을 어디에 쏠지 고민 중이다.
    ja: 槍をどこに向けるかだ。
  event_goddessfall1_06_s_65:
    speaker: johan
    en: The front line's crumbling.
    ko: 전선은 밀리고 있다.
    ja: 戦線は押されつつある。
  event_goddessfall1_06_s_66:
    speaker: johan
    en: The Queen is right above us.
    ko: 머리 위에는 퀸이 있지.
    ja: 頭上にはクイーンが浮かんでいる。
  event_goddessfall1_06_s_67:
    speaker: johan
    en: And we only have one shot.
    ko: 에덴의 창은 한발뿐이다.
    ja: 槍は一つだけだ。
  event_goddessfall1_06_s_68:
    speaker: rapunzel
    en: What is there to hesitate about?
    ko: 망설일 게 뭐 있나요.
    ja: 迷うところがあるでしょうか。
  event_goddessfall1_06_s_69:
    speaker: rapunzel
    en: Even if we fail, there will surely be someone to carry on.
    ko: 우리가 잘못되어도, 분명히 이어줄 사람이 있을 거예요.
    ja: |-
      私たちがどうなろうと、
      後を託せる人がいるはずです。
  event_goddessfall1_06_s_70:
    speaker: johan
    en: Who?
    ko: 누가.
    ja: そんな奴がいたか？
  event_goddessfall1_06_s_71:
    speaker: rapunzel
    en: Believer @UserName.
    ko: "@UserName 형제님이요."
    ja: ブラザー@UserNameです。
  event_goddessfall1_06_s_72:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_s_73:
    speaker: johan
    en: Right, if it's that guy...
    ko: 그래. 그 녀석이라면….
    ja: そうか。あいつなら…
  event_goddessfall1_06_s_74:
    speaker: cecil_op_l
    en: Isabel is critically damaged and retreating with Scarlet.
    ko: 이사벨 대파. 홍련과 함께 복귀해요.
    ja: イサベルが負傷。紅蓮と共に後退します。
  event_goddessfall1_06_s_75:
    speaker: cecil_op_l
    en: The defensive line has been breached. Snow White and Harran are repositioning.
      Papillon as well.
    ko: |-
      저지선 돌파.
      스노우 화이트와 하란. 위치를 이동합니다. 파피용도요.
    ja: |-
      防衛線に亀裂。
      スノーホワイトとハランが後退します。
      パピヨンも同行しているようです。
  event_goddessfall1_06_s_76:
    speaker: johan
    en: How about the Monk?
    ko: 승려는.
    ja: 仙人は？
  event_goddessfall1_06_s_77:
    speaker: cecil_op_l
    en: Currently meditating on the railing.
    ko: 난간에서 명상 중이에요.
    ja: 瞑想中のようです。
  event_goddessfall1_06_s_78:
    speaker: johan
    en: Must be nice.
    ko: 팔자 좋군.
    ja: たいしたご身分だな。
  event_goddessfall1_06_s_79:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_s_80:
    speaker: cecil_op_l
    en: Multiple heat signatures approaching.
    ko: 다수의 열원 접근 중.
    ja: 接近中の熱源反応を多数検知。
  event_goddessfall1_06_s_81:
    speaker: cecil_op_l
    en: Approximately... 2,000 in number.
    ko: 수는 대략… 2000개 정도네요.
    ja: 数はおよそ…2000。
  event_goddessfall1_06_s_82:
    speaker: johan
    en: "... So this is it?"
    ko: "…여기까진가."
    ja: "…ここまでか。"
  event_goddessfall1_06_s_83:
    speaker: johan
    en: I'll use Eden's Spear on the Queen.
    ko: 에덴의 창은 퀸에게 쓰겠다.
    ja: エデンの槍はクイーンに向ける。
  event_goddessfall1_06_s_84:
    speaker: cecil_op_l
    en: Understood.
    ko: 알겠어요.
    ja: 了解しました。
  event_goddessfall1_06_s_85:
    speaker: cecil_op_l
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_goddessfall1_06_s_86:
    speaker: cecil_op_l
    en: Of the approaching heat signatures, one is moving at high speed.
    ko: 접근 중인 열원 중, 한기가 고속 이동 중.
    ja: |-
      検知した反応のうち、
      1つが高速で移動しています。
  event_goddessfall1_06_s_87:
    speaker: cecil_op_l
    en: It is heading for Indivilia's position.
    ko: 헬레틱 인디빌리아의 위치로 이동합니다.
    ja: |-
      ヘレティック・インディビリアに
      接近しているようです。
  event_goddessfall1_06_s_88:
    speaker: cecil_op_l
    en: Now within identification range.
    ko: 식별 가능 범위로 접근.
    ja: 識別可能圏内、識別開始。
  event_goddessfall1_06_s_89:
    speaker: cecil_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_s_90:
    speaker: cecil_op_l
    en: "... What's that supposed to be?"
    ko: "…뭐죠 저건?"
    ja: "…これは？"
  event_goddessfall1_06_s_91:
    speaker: indivilia
    en: Just in time, more reinforcements arrive.
    ko: 마침 또 지원군이 오는군요.
    ja: また援軍が来ているようですね。
  event_goddessfall1_06_s_92:
    speaker: indivilia
    en: Hoho, the Queen truly knows nothing of mercy, does she?
    ko: 후후. 퀸께선 자비라는 걸 모르는 건가요?
    ja: |-
      ふふ…クイーンは情けというものを
      知らないのでしょうか？
  event_goddessfall1_06_s_93:
    speaker: indivilia
    en: Of course, I, too, am rather fond of sweeping my foes aside with sheer numbers.
    ko: 물론, 저 역시 압도적인 물량으로 밀어버리는 것을 선호하긴 한답니다.
    ja: |-
      まぁ、私も圧倒的な数で押しつぶす方が
      好みではありますが…
  event_goddessfall1_06_s_94:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_s_95:
    speaker: indivilia
    en: Nihilister, why don't you at least say something?
    ko: 니힐리스타. 뭐라도 좋으니까 말이라도 좀 하지 그래요?
    ja: ニヒリスター。なぜ黙っているのです？
  event_goddessfall1_06_s_96:
    speaker: indivilia
    en: You're powerless and silent. At this rate, a scarecrow would've served better.
    ko: |-
      힘도 없는데 말도 없으니,
      이럴 바엔 허수아비라도 세워놓는 게 낫겠어요.
    ja: |-
      戦力にもならない上に頭も使えないなんて、
      カカシの方が役に立ちそうですね。
  event_goddessfall1_06_s_97:
    speaker: nihilister_m
    en: Would you just shut up already, huh?
    ko: 좀 닥쳐라. 응?
    ja: うっせぇな…放っとけよ。
  event_goddessfall1_06_s_98:
    speaker: indivilia
    en: Heh, I'm afraid I must decline.
    ko: 후후. 싫은걸요.
    ja: ふふ。お断りです。
  event_goddessfall1_06_s_99:
    speaker: talkative
    en: "... Indivilia."
    ko: "[…인디빌리아.]"
    ja: "「…インディビリア」"
  event_goddessfall1_06_s_100:
    speaker: indivilia
    en: Yes, what is it?
    ko: 예. 뭐죠?
    ja: ええ、何か？
  event_goddessfall1_06_s_101:
    speaker: talkative
    en: Whatever's coming doesn't look like Raptures.
    ko: "[오고 있는 것들. 랩쳐가 아닌 것 같다.]"
    ja: "「来たのはラプチャーではないようだぞ」"
  event_goddessfall1_06_s_102:
    speaker: indivilia
    en: "... What?"
    ko: "…예?"
    ja: "…え？"
  event_goddessfall1_06_s_103:
    speaker: "<Narration>"
    en: Indivilia turns around
    ko: 인디빌리아는 뒤를 돌아봤다.
    ja: インディビリアが後ろを振り返った
  event_goddessfall1_06_s_104:
    speaker: "<Narration>"
    en: and sees a thick cloud of dust. It's clearly a massive army,
    ko: 자욱한 먼지구름. 대군일 게 분명하다.
    ja: |-
      激しく立ちのぼる砂ぼこりが、
      間違いなく大群の到来を示している
  event_goddessfall1_06_s_105:
    speaker: "<Narration>"
    en: yet she senses nothing.
    ko: 하지만 아무것도 느껴지지 않는다.
    ja: だが、向こうから何の反応も返ってこない
  event_goddessfall1_06_s_106:
    speaker: indivilia
    en: "... Then what could possibly be here in such numbers...?"
    ko: "…그럼 뭐가 이렇게 많이…."
    ja: "…では、何がこれほど大量に…"
  event_goddessfall1_06_s_107:
    speaker: "<Narration>"
    en: Something shoots out from the cloud of dust.
    ko: 먼지구름에서 뭔가가 쏘아지듯 튀어나왔다.
    ja: |-
      舞い上がる砂ぼこりを貫き、
      何かが勢いよく飛び出した
  event_goddessfall1_06_s_108:
    speaker: "<Narration>"
    en: Indivilia furrows her brow, trying to make out what it is.
    ko: 무엇인지 파악하기 위해 눈살을 찌푸리던 인디빌리아는.
    ja: |-
      その正体を確かめようと
      目をこらしたインディビリアは…
  event_goddessfall1_06_s_109:
    speaker: "<Narration>"
    en: She soon realizes it's something she's seen before,
    ko: 그것이 곧, 언젠가 봤었던 것이라는 걸 알아챘다.
    ja: それが、見覚えのあるものだと気が付いた
  event_goddessfall1_06_s_110:
    speaker: "<Narration>"
    en: but by the time it dawns on her, it's already too late.
    ko: 하지만 알아채는 것이 너무 늦었다.
    ja: しかし、理解するのがあまりにも遅すぎた
  event_goddessfall1_06_s_111:
    speaker: "<Narration>"
    en: "*Boooom!*"
    ko: 콰아아아앙-!!
    ja: ドガッ――！！
  event_goddessfall1_06_s_112:
    speaker: indivilia
    en: Argh!
    ko: 크헉!
    ja: ぐはっ！？
  event_goddessfall1_06_s_113:
    speaker: "<Narration>"
    en: Mounted on Trombe, Crown's lance pierces straight through Indivilia.
    ko: 트롬베에 탑승한 크라운의 창이, 인디빌리아를 꿰뚫었다.
    ja: |-
      トロンベを駆るクラウンの槍が、
      インディビリアを貫いた
  event_goddessfall1_06_s_114:
    speaker: "<Narration>"
    en: Indivilia rolls across the ground, struggling to get back up.
    ko: 인디빌리아는 바닥을 구른 후, 몸을 일으키기 위해 애썼다.
    ja: |-
      インディビリアは地面を転がり、
      体勢を立て直そうとした
  event_goddessfall1_06_s_115:
    speaker: crown
    en: Pleasure to see you again.
    ko: 반가워요.
    ja: ごきげんよう。
  event_goddessfall1_06_s_116:
    speaker: indivilia
    en: How many times... must this farce... be repeated...!?
    ko: 같은 짓거리를… 몇… 번이나…!
    ja: 同じ手を…ぐっ…またしても…！
  event_goddessfall1_06_s_117:
    speaker: crown
    en: I genuinely thought you'd manage to dodge that this time. Has your stamina
      been a bit lacking today?
    ko: |-
      이번엔 진짜 피할 줄 알았거든요.
      지구력이 너무 산만한 것 아닌가요?
    ja: |-
      今度こそ避けられると思っておりましたが…
      持久力が散漫だったようですわね？
  event_goddessfall1_06_s_118:
    speaker: chime
    en: The word be "focus," Your Highness!
    ko: 주의력입니다요 아가씨!
    ja: "「注意力」でございます、お嬢さま！"
  event_goddessfall1_06_s_119:
    speaker: crown
    en: Ah, yes... quite so, hehe.
    ko: 아, 음. 그랬었죠. 호호.
    ja: ああ、ええと…そうでしたわね。おほほっ。
  event_goddessfall1_06_s_120:
    speaker: talkative
    en: You wretches!
    ko: "[네놈들--!]"
    ja: "「貴様ら――！」"
  event_goddessfall1_06_s_121:
    speaker: "<Narration>"
    en: Chatterbox charges at Crown.
    ko: 토커티브가 크라운에게 달려든다.
    ja: トーカティブがクラウンに飛びかかろうとした
  event_goddessfall1_06_s_122:
    speaker: kilo_op_r
    en: T.A.L.O.S.! Body slam!
    ko: 탈로스! 몸통 박치기다!
    ja: タロス！たいあたり！
  event_goddessfall1_06_s_123:
    speaker: talos
    en: Talo talo!
    ko: 탈로탈로!
    ja: タロタロ！
  event_goddessfall1_06_s_124:
    speaker: "<Narration>"
    en: "*Wham!*"
    ko: 꽈앙-!
    ja: ドカッ！
  event_goddessfall1_06_s_125:
    speaker: "<Narration>"
    en: T.A.L.O.S. slams into Chatterbox's abdomen,
    ko: 탈로스의 태클이 토커티브의 복부를 두드린다.
    ja: |-
      飛び出したタロスの胴体が
      トーカティブの脇腹に衝突した
  event_goddessfall1_06_s_126:
    speaker: "<Narration>"
    en: sending him tumbling backward and putting some distance between them.
    ko: 토커티브는 뒤로 나동그라지며 거리를 벌렸다.
    ja: |-
      トーカティブは後方へ転がるように
      倒れこみ、距離を取った
  event_goddessfall1_06_s_127:
    speaker: talkative
    en: "... Human imposters of the kingdom...!"
    ko: "[…왕국의 유사 인간들…!]"
    ja: "「…王国の人間もどきども…！」"
  event_goddessfall1_06_s_128:
    speaker: kilo_op_r
    en: '... T.A.L.O.S., what''s this "Talo talo"?'
    ko: "…탈로탈로는 뭐야 탈로스."
    ja: "…今のタロタロって何？"
  event_goddessfall1_06_s_129:
    speaker: talos
    en: I learned it from a game you like.
    ko: 킬로가 좋아하는 게임에서 학습했습니다.
    ja: キロが好きなゲームから学習しました。
  event_goddessfall1_06_s_130:
    speaker: kilo_op_r
    en: Oh, okay.
    ko: 아, 그래.
    ja: ああ、そうなんだ…？
  event_goddessfall1_06_s_131:
    speaker: talos
    en: The body slam knocked the target back, but inflicted only minor damage. Special
      entity Chatterbox remains strong.
    ko: |-
      몸통 박치기로 밀어냈으나 피해는 경미합니다.
      특수 개체 토커티브는 여전히 강합니다.
    ja: |-
      押しのけることは出来ましたが、
      効果はいまひとつのようです。
      特殊個体トーカティブは依然として強力です。
  event_goddessfall1_06_s_132:
    speaker: talos
    en: Calculating...
    ko: 연산 중.
    ja: 演算中…
  event_goddessfall1_06_s_133:
    speaker: talos
    en: Had the golden arm been properly equipped, significant damage would have been
      dealt.
    ko: 황금 팔만 제대로 장착했으면 유의미한 피해를 입혔을겁니다.
    ja: |-
      金ぴかの腕に換装できていれば、
      有効な打撃を与えられたはずです。
  event_goddessfall1_06_s_134:
    speaker: kilo_op_r
    en: Oh, come on! How many times do you have to go on about that golden arm?!
    ko: 아 그만 좀 해! 그놈의 황금 팔 얘기는 대체 몇 번을 하는 거야!
    ja: |-
      その話はもういいって！
      今する話じゃないでしょ？
  event_goddessfall1_06_s_135:
    speaker: talos
    en: But you promised to replace it with a golden arm.
    ko: |-
      하지만 킬로가 약속했었습니다.
      황금 팔로 바꿔준다고요.
    ja: |-
      しかし、金ぴかの腕に替えてくれるという、
      キロとの約束です。
  event_goddessfall1_06_s_136:
    speaker: kilo_op_r
    en: I'm working as hard as I can to get to it, so can we stop already?
    ko: |-
      지금 열심히 모으고 있으니까,
      그만하자 응?
    ja: |-
      頑張って素材を集めてるから。
      その話は後にして。ね？
  event_goddessfall1_06_s_137:
    speaker: talos
    en: Roger.
    ko: 라져.
    ja: 了解しました。
  event_goddessfall1_06_s_138:
    speaker: talkative
    en: So you've come to die?
    ko: "[죽으러 온 건가?]"
    ja: "「死にに来たのか？」"
  event_goddessfall1_06_s_139:
    speaker: crown
    en: Far from it.
    ko: 그럴 리가요.
    ja: いいえ。
  event_goddessfall1_06_s_140:
    speaker: talkative
    en: You think the likes of you can turn the tide of this battle? Think again.
    ko: "[고작 너희들로 이 전황을 뒤집을 수 있다고 판단한 모양이라면, 오산이다.]"
    ja: |-
      「お前たちだけで戦況をくつがえせると
      考えたなら、誤算だったな」
  event_goddessfall1_06_s_141:
    speaker: kilo_op_r
    en: That's totally wrong, right, T.A.L.O.S.?
    ko: 정말 오산이야 탈로스?
    ja: タロス、どう思う？
  event_goddessfall1_06_s_142:
    speaker: talos
    en: No.
    ko: 아니요.
    ja: いいえ。
  event_goddessfall1_06_s_143:
    speaker: talos
    en: Calculating...
    ko: 연산 중.
    ja: 演算中…
  event_goddessfall1_06_s_144:
    speaker: talos
    en: The outcome depends on the target's combat capabilities, but purely in terms
      of numbers, our chances of victory are significantly higher.
    ko: |-
      객체의 전투력에 따라 다르겠지만,
      수량만으로 계산한다면 저희 측 승률이 훨씬 높습니다.
    ja: |-
      個体の戦闘力にもよりますが、
      数的な戦力ではこちらの勝率が
      はるかに上です。
  event_goddessfall1_06_s_145:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_06_s_146:
    speaker: indivilia
    en: What did you say? Have you lost your mi—
    ko: 뭐라고요? 정신이 나갔….
    ja: この期に及んで、世迷い言を――
  event_goddessfall1_06_s_147:
    speaker: "<Narration>"
    en: The cloud of dust behind them begins to settle.
    ko: 뒤에서 피어나던 먼지구름이 잦아진다.
    ja: 言葉のそばから、砂ぼこりが引いた
  event_goddessfall1_06_s_148:
    speaker: "<Narration>"
    en: Countless Nayutas now come into view,
    ko: 그리고 지평선을 가득 메울 정도로 빽빽이 들어선
    ja: 地平線を埋め尽くしていたのは…
  event_goddessfall1_06_s_149:
    speaker: "<Narration>"
    en: packed so tightly they stretch across the entire horizon.
    ko: 수많은 나유타들의 모습이 드러났다.
    ja: 大量に並んだナユタの姿だった
  event_goddessfall1_06_s_150:
    speaker: nayuta
    en: Verily, I have arrived at last.
    ko: 드디어 당도했도다.
    ja: ようやく来ましたか。
  event_goddessfall1_06_s_151:
    speaker: indivilia
    en: "... What is this?"
    ko: "…뭔가요 이게."
    ja: "…どういうことですか、これは。"
  event_goddessfall1_06_s_152:
    speaker: nihilister_m
    en: "... How the hell... are there this many...?"
    ko: "…땡중이… 이렇게나…?"
    ja: "…クソ仙人が…こんなに…？"
  event_goddessfall1_06_s_153:
    speaker: talkative
    en: "..."
    ko: "[…….]"
    ja: "「……」"
  event_goddessfall1_06_s_154:
    speaker: talos
    en: 2,000 Nayuta clones...
    ko: 니케 나유타의 분신 개체 2000기.
    ja: ニケ・ナユタの分身2000体…
  event_goddessfall1_06_s_155:
    speaker: talos
    en: Calculating...
    ko: 연산 중.
    ja: 演算中…
  event_goddessfall1_06_s_156:
    speaker: talos
    en: Against several thousand Raptures.
    ko: 대 랩쳐 수천 기.
    ja: 敵ラプチャー、数千機。
  event_goddessfall1_06_s_157:
    speaker: kilo
    en: Don't just estimate.
    ko: 대충 세지 마.
    ja: しっかり数えてよ。
  event_goddessfall1_06_s_158:
    speaker: talos
    en: Odds of victory are satisfactory.
    ko: 승률은 충분합니다.
    ja: すでに十分な勝率です。
  event_goddessfall1_06_s_159:
    speaker: chime
    en: Very well! Let us be off then!
    ko: 좋다! 그럼 가보자꾸나!
    ja: よし！ならばやるのだ！
  event_goddessfall1_06_s_160:
    speaker: crown
    en: Let us proceed.
    ko: 가죠.
    ja: 参りましょう。
  event_goddessfall1_06_s_161:
    speaker: indivilia
    en: Damn... these human imposters...!
    ko: 이… 유사 인간들 따위가…!
    ja: この…人間もどきども…！
  event_goddessfall1_06_s_162:
    speaker: "<Narration>"
    en: Black light bursts out from Indivilia's body.
    ko: 인디빌리아의 몸에서 검은색 빛이 뿜어져 나왔다.
    ja: インディビリアの体から黒い光があふれ出した
  event_goddessfall1_06_s_163:
    speaker: talos
    en: Transformation detected.
    ko: 거대화 감지.
    ja: 巨大化を検知。
  event_goddessfall1_06_s_164:
    speaker: chime
    en: A mere trifle! Fear not,
    ko: 거대화고 나발이고!
    ja: 巨大化だろうが、何だろうが…
  event_goddessfall1_06_s_165:
    speaker: chime
    en: numbers shall ever triumph!
    ko: 쪽수에는 장사 없느니라!
    ja: 数の暴力には敵わないのだ！
event_goddessfall1_06_e:
  event_goddessfall1_06_e_1:
    speaker: nayuta
    en: I possess but one rather insignificant talent.
    ko: 소인에겐 보잘것없는 재주가 하나 있소.
    ja: 私のつまらぬ能力と言いましょうかねぇ…
  event_goddessfall1_06_e_2:
    speaker: nayuta
    en: I can fashion replicas of myself, identical in form, and grant unto them a
      portion of my NIMPH.
    ko: |-
      소인과 똑같은 분신을 만들어,
      그들에게 소인의 NIMPH 일부를 나누어 주는 것이외다.
    ja: |-
      私はNIMPHの一部を分け与えた、
      己の分身を作り出せるのです。
  event_goddessfall1_06_e_3:
    speaker: nayuta
    en: Once the NIMPH setteth within a replica, there existeth no whit of difference
      betwixt it and myself.
    ko: NIMPH가 안착한 소인의 분신은 사실상 소인과 다를 것이 없소.
    ja: |-
      NIMPHを定着させた私の分身は、
      本来の私と何ら変わりありません。
  event_goddessfall1_06_e_4:
    speaker: nayuta
    en: They are able to think and to act of their own accord.
    ko: 자율적으로 판단하고, 자율적으로 행동하외다.
    ja: 自律的な判断を行い、自律的に行動する。
  event_goddessfall1_06_e_5:
    speaker: nayuta
    en: As for their number...
    ko: 총수는….
    ja: 全部で…
  event_goddessfall1_06_e_6:
    speaker: nayuta
    en: Well, I ceased counting after three thousand and two hundred. The greater
      their multitude, the more wondrous it be, wouldst thou not agree?
    ko: |-
      글쎄올시다. 삼천이백 이후로는 세지 않았소.
      다다익선 아니겠소.
    ja: |-
      どれだけでしょうねぇ。3200以降は
      数えていないもので…
      まあ、多ければ多いほどよいでしょう。
  event_goddessfall1_06_e_7:
    speaker: nayuta
    en: These replicas wander the world, gathering whatsoever knowledge they may procure—
    ko: 분신들은 세계 곳곳을 돌아다니며 정보를 모으는 것을 목표로 하오.
    ja: |-
      分身たちは世界中を巡り、情報を集めることを
      使命としています。
  event_goddessfall1_06_e_8:
    speaker: nayuta
    en: the Queen's movements, the Heretics' designs, the changes that befall the
      land, and the like.
    ko: 퀸의 이동 루트, 헬레틱의 동향, 세계의 변화 등등의 정보들을 닥치는 대로 끌어모으오.
    ja: |-
      クイーンの現在地、ヘレティックの動向、
      世界の変化など…あらゆる情報を
      手当たりしだいに集めているのです。
  event_goddessfall1_06_e_9:
    speaker: nayuta
    en: 'Now, thou mayest wonder: how is all this knowledge made one?'
    ko: 자, 그럼 모은 정보는 어떻게 통합하는가 궁금할 것이오.
    ja: 集めた情報を、どう統合するのかといいますと…
  event_goddessfall1_06_e_10:
    speaker: nayuta
    en: When a replica perisheth, or when I so will it, the NIMPH within returneth
      unto me.
    ko: 분신이 죽거나, 본체인 소인이 원하면 분신에 안착한 NIMPH가 소인을 찾아오오.
    ja: |-
      定着させたNIMPHは分身が死ぬか、
      本体である私の意志で戻ってきます。
  event_goddessfall1_06_e_11:
    speaker: nayuta
    en: And with it, the knowledge it hath borne doth flow unto me.
    ko: 그럼 본체인 소인에게 해당 정보가 들어오게 되는 것이오.
    ja: |-
      その時、本体たる私に
      情報が統合されるのです。
  event_goddessfall1_06_e_12:
    speaker: nayuta
    en: A replica bereft of its NIMPH, alas, is naught but a hollow shell, stripped
      of all its faculties.
    ko: NIMPH가 소실된 분신은, 안타깝지만 모든 기능을 상실하외다.
    ja: |-
      NIMPHが失われた分身の機能は、
      残念ながら全て失われてしまいます。
  event_goddessfall1_06_e_13:
    speaker: nayuta
    en: Thus, they are not so formidable as they might seem.
    ko: 생각보다 만능은 아니라는 얘기외다.
    ja: それほど万能ではないということですねえ。
  event_goddessfall1_06_e_14:
    speaker: nayuta
    en: Yet gathering knowledge is not their sole purpose.
    ko: 그리고 물론, 정보 수집만이 목표는 아니오.
    ja: |-
      とはいえ、情報収集しか
      できないという訳でもありません。
  event_goddessfall1_06_e_15:
    speaker: nayuta
    en: Among them are those trained chiefly for battle.
    ko: 개중에는 전투 능력만을 연마한 분신들도 있소.
    ja: 分身に戦闘能力をひたすら磨かせれば…
  event_goddessfall1_06_e_16:
    speaker: nayuta
    en: Dost thou grasp the meaning I endeavor to impart?
    ko: 자, 소인이 무슨 말을 하려는지 아시겠소?
    ja: これで、言わんとすることは伝わりましたか？
  event_goddessfall1_06_e_17:
    speaker: nayuta
    en: These two thousand replicas now assembled upon this battlefield
    ko: 지금 이 전장에 모여든 이천의 분신들은.
    ja: この戦場に集結させた二千の分身は…
  event_goddessfall1_06_e_18:
    speaker: nayuta
    en: are precisely those honed for combat.
    ko: 전투 능력만을 연마한 분신들이란 말이외다.
    ja: 戦いのために鍛え上げていたものです。
  event_goddessfall1_06_e_19:
    speaker: nayuta
    en: Though they may not rival the exalted Forerunners nor the Inherit,
    ko: 선구자 소저들이나 인헤르트 소저들만큼은 아니겠지만.
    ja: |-
      先駆者やインヘルトの
      猛者たちには及びませんが…
  event_goddessfall1_06_e_20:
    speaker: nayuta
    en: they are by no means trifling foes.
    ko: 어디 가서 맞고 다닐 이들은 아니라는 얘기외다.
    ja: 易々と討たれる器でもありません。
  event_goddessfall1_06_e_21:
    speaker: nayuta
    en: So then, thou seest I have not idled away my time in vain.
    ko: 자, 이제 소인이 놀고만은 있지 않았다는 걸 알겠소?
    ja: |-
      今なら、私が遊んでいたわけではないと
      信じていただけますかねぇ？
  event_goddessfall1_06_e_22:
    speaker: nayuta
    en: "... Embarrassing though it be to confess, all my replicas—save for mine own
      self—are grievously inept at finding our way."
    ko: |-
      …부끄러우나 소인을 제외한 모든 분신들은 길치라,
      신호를 따라가지 않으면 어디 오지로 가 있을 게 분명하오.
    ja: |-
      …恥ずかしながら、分身たちは
      私と違って方向音痴なもので…
      信号がなければ、どこへ迷いつくことやら。
  event_goddessfall1_06_e_23:
    speaker: nayuta
    en: Without a guiding signal, we should surely stray into some desolate place.
    ko: 소인, 이곳에서 놀고먹는 것처럼 보였겠으나 분신들을 위한 신호를 열심히 보내고 있었소.
    ja: |-
      ですので、遊んでいたのではなく、
      分身が来られるよう必死に
      信号を送っていたというわけです。
  event_goddessfall1_06_e_24:
    speaker: nayuta
    en: Though I may have appeared idle, I assure thee I have been diligently dispatching
      signals to steer their course. Therefore, I beseech thee, judge me not too harshly.
    ko: 그러니 너무 나무라지 말아 주시면 고맙겠소.
    ja: おとがめはご容赦いただけると助かりますねぇ。
  event_goddessfall1_06_e_25:
    speaker: cecil
    en: I understand. Now come down. We are about to fire Eden's Spear.
    ko: |-
      알았으니 내려와요.
      이제 곧 에덴의 창을 발사할 거예요.
    ja: |-
      もういいですから、降りてきてください。
      すぐにエデンの槍が発射されます。
  event_goddessfall1_06_e_26:
    speaker: cecil
    en: Remain there, and you'll end up a thoroughly roasted monk.
    ko: 거기 있다간 바싹 구워진 승려가 될 거예요.
    ja: そこにいては仙人の黒焼きが出来上がりますよ。
  event_goddessfall1_06_e_27:
    speaker: nayuta
    en: "... Verily, 'twas not that I sought words of gratitude, yet this—"
    ko: "…것 참. 고맙다는 말을 듣고 싶은 건 아니었지만 이건 너무."
    ja: |-
      …いやはや。感謝の言葉までは望みませんが、
      それはあまりにも…
  event_goddessfall1_06_e_28:
    speaker: cecil
    en: Step on it.
    ko: 빨리. 서둘러요.
    ja: 早く。急いでください。
  event_goddessfall1_06_e_29:
    speaker: nayuta
    en: As you wish.
    ko: 알겠소 알겠소.
    ja: はい、はい。
  event_goddessfall1_06_e_30:
    speaker: "<Narration>"
    en: The clones dash across the plains.
    ko: 승려들이 평원을 달린다.
    ja: ナユタの群れが平原を駆ける
  event_goddessfall1_06_e_31:
    speaker: "<Narration>"
    en: One sends Raptures flying with a palm strike,
    ko: 장(掌)으로 랩쳐를 날려 보내는 승려.
    ja: 手のひらでラプチャーを吹き飛ばす者
  event_goddessfall1_06_e_32:
    speaker: "<Narration>"
    en: while another crushes a Rapture's armor with a swing of a stone staff.
    ko: 석장을 휘둘러 랩쳐의 장갑을 짓뭉개는 승려.
    ja: 錫杖を振るい、ラプチャーの装甲を打ち砕く者
  event_goddessfall1_06_e_33:
    speaker: "<Narration>"
    en: A third pierces a core with a spear.
    ko: 창으로 코어를 꿰뚫는 승려.
    ja: 槍でコアを貫く者
  event_goddessfall1_06_e_34:
    speaker: "<Narration>"
    en: Two thousand clones overwhelm the Raptures with their own weapons and techniques.
    ko: 이천의 승려들은 각자의 방법과 무장으로 랩쳐들을 압도한다.
    ja: |-
      二千もの人影が、それぞれの戦法と武装で
      ラプチャーを圧倒してゆく
  event_goddessfall1_06_e_35:
    speaker: crown
    en: "... Quite the sight to bedeck."
    ko: "…관장이군요."
    ja: "…観壮ですわね。"
  event_goddessfall1_06_e_36:
    speaker: chime
    en: Behold... It's behold, Your Highness.
    ko: 장관… 입니다요 아가씨.
    ja: 壮観でございます…お嬢さま。
  event_goddessfall1_06_e_37:
    speaker: kilo
    en: "... Amazing. This is really..."
    ko: "…굉장하다. 이건 정말…."
    ja: "…すごい。これなら本当に…"
  event_goddessfall1_06_e_38:
    speaker: "<Narration>"
    en: Bullets spray from one clone,
    ko: 기관총을 난사하는 승려.
    ja: さらにマシンガンを乱射する者
  event_goddessfall1_06_e_39:
    speaker: "<Narration>"
    en: rockets blast from another.
    ko: 로켓 런쳐를 발사하는 승려.
    ja: ロケットランチャーを発射する者
  event_goddessfall1_06_e_40:
    speaker: "<Narration>"
    en: One hurls grenades,
    ko: 수류탄을 던지는 승려.
    ja: 手榴弾を投てきする者
  event_goddessfall1_06_e_41:
    speaker: "<Narration>"
    en: while another lays mines.
    ko: 지뢰를 매설하는 승려.
    ja: 地雷を埋めはじめる者…
  event_goddessfall1_06_e_42:
    speaker: kilo_op_r
    en: Uh, don't they seem to be fighting a little too recklessly?
    ko: 그, 너어무 좀 자유롭게 싸우는 것 같지 않나요?
    ja: あの、ちょっと自由すぎませんか…？
  event_goddessfall1_06_e_43:
    speaker: talos
    en: Affirmative.
    ko: 동의합니다.
    ja: 同じ意見です。
  event_goddessfall1_06_e_44:
    speaker: chime
    en: S-so long as we triumph, that is all that needeth be!
    ko: 이, 이기면 그만이다 이기면!
    ja: か、勝てればいいのだ、勝てれば！
  event_goddessfall1_06_e_45:
    speaker: indivilia
    en: "... Tsk."
    ko: "…칫."
    ja: "…チッ…"
  event_goddessfall1_06_e_46:
    speaker: nihilister_m
    en: Oi! What the hell are you doing?
    ko: 야. 뭐해?
    ja: おい、何してんだよ？
  event_goddessfall1_06_e_47:
    speaker: indivilia
    en: What of it?
    ko: 뭘요.
    ja: 何か？
  event_goddessfall1_06_e_48:
    speaker: nihilister_m
    en: You should be running for your life, not clicking your tongue.
    ko: 꽁무니 빠지게 도망가야지. 뭘 칫칫 거리고 있냐.
    ja: 舌打ちしてる場合かよ。さっさと退こうぜ。
  event_goddessfall1_06_e_49:
    speaker: talkative
    en: "... Agreed. We can't take them down now. There aren't enough of us Raptures."
    ko: |-
      […동의한다. 지금 이것들을 이길 방법은 없다.
      랩쳐의 수가 모자란다.]
    ja: |-
      「…その通りだ。今は分が悪い。
      こちらの数が足りない」
  event_goddessfall1_06_e_50:
    speaker: indivilia
    en: "... Very well, let's do so."
    ko: "…그래요. 그러죠."
    ja: "…そうですね。ここは退きます。"
  event_goddessfall1_06_e_51:
    speaker: indivilia
    en: I trust the exalted one above will see to it.
    ko: 저 위에 계신 위대하신 분께서 어떻게 해주겠죠.
    ja: |-
      空の上の偉大なお方が
      どうにかしてくださるでしょう。
  event_goddessfall1_06_e_52:
    speaker: crown
    en: Running away, are we? That is one thing you truly excel at.
    ko: |-
      도망가는 건가요?
      다른 건 몰라도 그것 하나는 정말 잘하시네요.
    ja: |-
      お逃げになるのですか？
      他はともかく、そこはお上手ですわね。
  event_goddessfall1_06_e_53:
    speaker: talos
    en: Kilo, do you know?
    ko: 킬로. 아십니까?
    ja: キロ。知っていますか？
  event_goddessfall1_06_e_54:
    speaker: kilo_op_r
    en: What?
    ko: 뭘?
    ja: 何を？
  event_goddessfall1_06_e_55:
    speaker: talos
    en: We are two-for-two against Chatterbox. Our win rate is 100%.
    ko: |-
      저흰 토커티브 전에서 2전 2승입니다.
      승률 100%입니다.
    ja: |-
      我々の対トーカティブ戦績は2戦2勝。
      勝率100％です。
  event_goddessfall1_06_e_56:
    speaker: kilo_op_r
    en: Oh, yeah! That guy's super weak.
    ko: 어? 그러네? 쟤 진짜 약하네?
    ja: |-
      あ、言われてみれば？
      ホントは大したことないのかな？
  event_goddessfall1_06_e_57:
    speaker: talkative
    en: Grr!
    ko: "[그으으으…!!]"
    ja: "「グウウウ…！！」"
  event_goddessfall1_06_e_58:
    speaker: nihilister_m
    en: Don't take the bait! Just run!
    ko: 도발에 넘어가지 말고 빨리 튀자고!
    ja: 乗せられんじゃねぇ！さっさとずらかるぞ！
  event_goddessfall1_06_e_59:
    speaker: "<Narration>"
    en: With a roar, Storm Bringer descends,
    ko: 굉음과 함께 스톰 브링어가 강하한다.
    ja: |-
      轟音と共に急降下してきた
      ストームブリンガーが…
  event_goddessfall1_06_e_60:
    speaker: "<Narration>"
    en: snatches up Indivilia, Nihilister, and Chatterbox, then takes to the sky
    ko: 인디빌리아, 니힐리스타, 토커티브를 잡아채며 날아올랐다.
    ja: |-
      インディビリア、ニヒリスター、
      トーカティブを回収し、素早く飛び去った
  event_goddessfall1_06_e_61:
    speaker: "<Narration>"
    en: and vanishes beyond the horizon.
    ko: 스톰 브링어는 지평선 너머로 사라졌다.
    ja: |-
      ストームブリンガーは
      地平線の向こうへと消えていった
  event_goddessfall1_06_e_62:
    speaker: kilo_op_r
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ…"
  event_goddessfall1_06_e_63:
    speaker: chime
    en: By my stars! I ne'er thought Nayuta could devise such a trick.
    ko: 나원 참. 나유타 녀석, 이런 재주가 있을 줄은 몰랐구나.
    ja: |-
      まったく…ナユタのやつめ、
      こんな力を隠しているとは思わなかったのだ。
  event_goddessfall1_06_e_64:
    speaker: chime
    en: Following the swarm of replicas was indeed the right course.
    ko: 분신들이 떼를 지어 가길래 동행한 게 정답이었다.
    ja: |-
      分身の大軍団がどこかに向かっていたから
      ついてきてみれば…
  event_goddessfall1_06_e_65:
    speaker: chime
    en: That means Nayuta is hereabouts.
    ko: 그 말은 즉, 나유타 녀석이 여기 있다는 말이렷다.
    ja: |-
      これは間違いなく、
      ナユタが近くにいる証拠なのだ。
  event_goddessfall1_06_e_66:
    speaker: chime
    en: Splendid! This shall give us a chance to learn more about the Naked King...
    ko: 잘 되었다. 이 기회에 네이키드 킹에 대해….
    ja: |-
      ちょうどいいのだ。
      この機会にネイキッドキングのことも…
  event_goddessfall1_06_e_67:
    speaker: crown
    en: Chime, Kilo, T.A.L.O.S., direct your gaze to the sky.
    ko: 차임. 킬로. 탈로스. 하늘을.
    ja: チャイム、キロ、タロス。空を。
  event_goddessfall1_06_e_68:
    speaker: "<Narration>"
    en: The party from the Crown Kingdom gazes up at the sky.
    ko: 크라운 왕국의 일행들이 하늘을 바라본다.
    ja: クラウン王国の一行が空を見上げた
  event_goddessfall1_06_e_69:
    speaker: "<Narration>"
    en: The clouds are turning red.
    ko: 구름이 붉어지고 있었다.
    ja: 雲が赤く染まっている
  event_goddessfall1_06_e_70:
    speaker: cecil_op_r
    en: Another beam from the Queen is descending.
    ko: 퀸의 빔 포격이 옵니다.
    ja: クイーンの砲撃が来ます。
  event_goddessfall1_06_e_71:
    speaker: harran_op_r
    en: "... This is simply beyond belief."
    ko: "…이것 참. 믿을 수가 없구나."
    ja: "…驚いたわ。信じがたいわね。"
  event_goddessfall1_06_e_72:
    speaker: isabel_op_l
    en: Does she have unlimited energy or what?
    ko: 출력이 무한이라도 되는 거야?
    ja: 本当に無限の力でもあるというの？
  event_goddessfall1_06_e_73:
    speaker: papillon_op_l
    en: Wh-what do we do?
    ko: 어, 어떻게 해?
    ja: ど、どうする気！？
  event_goddessfall1_06_e_74:
    speaker: johan
    en: We strike first with Eden's Spear.
    ko: 에덴의 창으로 선수를 친다.
    ja: エデンの槍で先手を打つ。
  event_goddessfall1_06_e_75:
    speaker: cecil_op_r
    en: Based on my calculations, we are 10 seconds behind the Queen.
    ko: 계산상, 우리가 10초 늦어요.
    ja: 計算上、私たちの方が10秒遅れます。
  event_goddessfall1_06_e_76:
    speaker: rapunzel
    en: I'll hold her off for just 10 seconds.
    ko: 10초 정도는, 제가 버텨볼게요.
    ja: 10秒でいいなら、私が防いでみせましょう。
  event_goddessfall1_06_e_77:
    speaker: johan
    en: Impossible. There's no way your core power has recovered yet.
    ko: 무리다. 코어 동력이 회복됐을 리가 없다.
    ja: |-
      無理だ。前回使った分も
      まだ回復していないだろう。
  event_goddessfall1_06_e_78:
    speaker: rapunzel
    en: I'll do it anyway!
    ko: 그래도 합니다!
    ja: それでもです！
  event_goddessfall1_06_e_79:
    speaker: johan
    en: "... Fine, I'm entrusting this to you."
    ko: "…그래. 부탁하겠다."
    ja: "…分かった。頼む。"
  event_goddessfall1_06_e_80:
    speaker: johan
    en: Cecil, report to me immediately when you're ready.
    ko: 세실. 준비가 되면 바로 얘기해라.
    ja: セシル、準備が完了次第撃てるようにしてくれ。
  event_goddessfall1_06_e_81:
    speaker: cecil_op_r
    en: Understood.
    ko: 예.
    ja: はい。
  event_goddessfall1_06_e_82:
    speaker: "<Narration>"
    en: Rapunzel steps forward
    ko: 라푼젤이 앞으로 걸어 나간다.
    ja: ラプンツェルは前に歩み出し…
  event_goddessfall1_06_e_83:
    speaker: "<Narration>"
    en: and looks up at the sky.
    ko: 하늘을 올려다본다.
    ja: 空を見上げた
  event_goddessfall1_06_e_84:
    speaker: "<Narration>"
    en: The clouds gradually redden.
    ko: 점점 붉어지는 구름.
    ja: 雲が次第に赤く染まっている
  event_goddessfall1_06_e_85:
    speaker: "<Narration>"
    en: After a brief prayer, she raises her staff.
    ko: 라푼젤은 짧은 기도 후, 지팡이를 들어 올렸다.
    ja: |-
      ラプンツェルは短い祈りを捧げた後、
      杖を掲げた
  event_goddessfall1_06_e_86:
    speaker: rapunzel
    en: I will block it, no matter what!
    ko: 반드시 막아냅니다!
    ja: 必ず守ってみせます！
  event_goddessfall1_06_e_87:
    speaker: "<Narration>"
    en: A golden barrier spreads out.
    ko: 황금색 장벽이 펼쳐졌다.
    ja: 黄金色の光が広がる
  event_goddessfall1_06_e_88:
    speaker: "<Narration>"
    en: Through the clouds, crimson light pours down.
    ko: 구름을 뚫고, 붉은색 빛이 쏟아져 내렸다.
    ja: 雲が突き破られ、赤い光があふれ出した
  event_goddessfall1_06_e_89:
    speaker: "<Narration>"
    en: "*Fwoooom!*"
    ko: 카가가가가가각--!!
    ja: ガガガガガ――！！
  event_goddessfall1_06_e_90:
    speaker: rapunzel
    en: Urrgh... Hrrnnghh...!
    ko: 크… 으윽…!
    ja: くっ…ううっ…！
  event_goddessfall1_06_e_91:
    speaker: "<Narration>"
    en: Her limit comes faster than expected.
    ko: 한계는 예상보다 빨리 찾아왔다.
    ja: 限界は予想よりも早く訪れた
  event_goddessfall1_06_e_92:
    speaker: "<Narration>"
    en: Even so, Rapunzel makes up her mind that she'll burn her core if that's what
      it takes to block the attack.
    ko: 라푼젤은 코어를 태워서라도, 이 공격을 막아내기로 마음먹었다.
    ja: |-
      ラプンツェルは
      己のコアを焼ききってでも
      防ぎきる覚悟を固め…
  event_goddessfall1_06_e_93:
    speaker: marian_q
    en: Rapunzel.
    ko: 라푼젤.
    ja: ラプンツェル。
  event_goddessfall1_06_e_94:
    speaker: rapunzel
    en: Marian!
    ko: "!! 마리안!"
    ja: "！！マリアン！？"
  event_goddessfall1_06_e_95:
    speaker: marian_q
    en: I'll help you.
    ko: 제가 도울게요.
    ja: 私も手伝います。
  event_goddessfall1_06_e_96:
    speaker: rapunzel
    en: What the...! Stay back, Marian!
    ko: 무슨…! 물러서요 마리안!
    ja: 何を言って…！下がってください！
  event_goddessfall1_06_e_97:
    speaker: marian_q
    en: It's okay.
    ko: 괜찮아요.
    ja: 大丈夫です。
  event_goddessfall1_06_e_98:
    speaker: marian_q
    en: This power is like mine.
    ko: 이 힘은 제힘과 성질이 같으니까.
    ja: あれは、私と同じ力ですから。
  event_goddessfall1_06_e_99:
    speaker: marian_q
    en: I can do it.
    ko: 할 수 있어요.
    ja: 心配しないでください。
  event_goddessfall1_06_e_100:
    speaker: rapunzel
    en: "... Pardon?"
    ko: "…예?"
    ja: "…え…？"
  event_goddessfall1_06_e_101:
    speaker: "<Narration>"
    en: Light begins to emit from Marian's bandages
    ko: 마리안의 붕대가 빛을 발한다.
    ja: マリアンの包帯が輝いた
  event_goddessfall1_06_e_102:
    speaker: "<Narration>"
    en: as crimson light is drawn in.
    ko: 붉은빛이 마리안의 붕대 안으로 빨려 들어간다.
    ja: 赤い光がマリアンの包帯に吸収され始めた
  event_goddessfall1_06_e_103:
    speaker: "<Narration>"
    en: "*Thrum thrum thrum*"
    ko: 쿠구구구구구구---
    ja: ゴゴゴゴゴゴゴゴ――
  event_goddessfall1_06_e_104:
    speaker: rapunzel
    en: What...?
    ko: 뭐….
    ja: 何が…
  event_goddessfall1_06_e_105:
    speaker: "<Narration>"
    en: A strange light gleams in Marian's eyes.
    ko: 마리안의 안광이 기묘한 광채를 뿜어낸다.
    ja: マリアンの眼は奇妙な輝きを帯びている
  event_goddessfall1_06_e_106:
    speaker: "<Narration>"
    en: She absorbs every trace of the ominous crimson light from the sky.
    ko: 하늘에서 내려온 불길한 붉은빛을, 마리안이 모두 빨아들이고 있다.
    ja: |-
      空から降る不吉な赤い光が
      ことごとくマリアンに吸い込まれていく
  event_goddessfall1_06_e_107:
    speaker: rapunzel
    en: What... in the world is this...?
    ko: 이게… 대체….
    ja: これは…いったい…
  event_goddessfall1_06_e_108:
    speaker: cecil_op_l
    en: Johan! Now!
    ko: 요한! 지금!
    ja: ヨハン！今です！
  event_goddessfall1_06_e_109:
    speaker: johan
    en: Hrngh!
    ko: "…흐읍!"
    ja: "…よし！"
  event_goddessfall1_06_e_110:
    speaker: "<Narration>"
    en: Johan yanks the lever with all his strength.
    ko: 요한이 힘껏 레버를 당긴다.
    ja: ヨハンが力強くレバーを引いた
  event_goddessfall1_06_e_111:
    speaker: "<Narration>"
    en: It erupts with a thunderous boom, sparks and flames flying everywhere.
    ko: 콰앙-! 하는 소리와 불꽃과 스파크가 레버에서 터져 나온다.
    ja: 激しい衝撃と音が響き、レバーが火花を散らした
  event_goddessfall1_06_e_112:
    speaker: "<Narration>"
    en: He's thrown back, tumbling across the floor as Eden shakes.
    ko: 요한이 뒤로 나동그라짐과 동시에, 에덴이 흔들린다.
    ja: |-
      ヨハンは後方に倒れこみ、
      同時にエデンがもう一度大きく震えた
  event_goddessfall1_06_e_113:
    speaker: "<Narration>"
    en: A massive blue spear tears across the sky.
    ko: 그리고 거대한 푸른색의 창이, 천공을 가로지른다.
    ja: 放たれた巨大な青い槍が天空に伸びた
  event_goddessfall1_06_e_114:
    speaker: "<Narration>"
    en: Marian's bandages blaze brighter than ever.
    ko: 마리안의 붕대가 더욱 강한 빛을 발한다.
    ja: 一瞬、マリアンの包帯の輝きが増した
  event_goddessfall1_06_e_115:
    speaker: "<Narration>"
    en: As the light dims, a black sphere rises above her palm.
    ko: 붕대의 빛이 잦아들었고, 마리안의 손바닥 위에 검은 구체가 떠오른다.
    ja: |-
      すぐに光は収まり、マリアンの手のひらの上に
      黒い球体が浮かんだ
  event_goddessfall1_06_e_116:
    speaker: "<Narration>"
    en: She releases it into the air,
    ko: 마리안은 그것을, 허공에 풀어놓듯이 던졌다.
    ja: |-
      マリアンはそれを投げるかのような動作で、
      虚空へと解き放った
  event_goddessfall1_06_e_117:
    speaker: "<Narration>"
    en: and a beam of black light shoots toward the sky.
    ko: 하늘을 향해 검은색의 빛이 내달린다.
    ja: 黒い光は天に向かって勢いよく昇っていく
  event_goddessfall1_06_e_118:
    speaker: "<Narration>"
    en: The clouds are torn apart, and the sky is painted in shades of blue and black.
    ko: 모든 구름이 찢기고 하늘의 색이 푸른색과 검은색으로 물든다.
    ja: 雲を吹き散らし、空が青と黒に染まった
  event_goddessfall1_06_e_119:
    speaker: snowwhite
    en: "... Marian."
    ko: "…마리안."
    ja: "…マリアン…"
  event_goddessfall1_06_e_120:
    speaker: hongryeon
    en: Pray... what might this be?
    ko: 이것이… 뭐란 말인가.
    ja: いったい何だい…これは…？
  event_goddessfall1_06_e_121:
    speaker: cecil_op_l
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_e_122:
    speaker: cecil_op_l
    en: Confirmed hits on the Queen from both Eden's Spear
    ko: 에덴의 창. 퀸에게 명중 확인.
    ja: エデンの槍、クイーンへの命中を確認。
  event_goddessfall1_06_e_123:
    speaker: cecil_op_l
    en: and Marian Cannon.
    ko: 마리안 캐논. 퀸에게 명중 확인.
    ja: 併せてマリアン砲、クイーンに命中を確認。
  event_goddessfall1_06_e_124:
    speaker: johan
    en: What's Marian Cannon?
    ko: 마리안 캐논은 뭐냐.
    ja: マリアン砲？
  event_goddessfall1_06_e_125:
    speaker: cecil_op_l
    en: A working title.
    ko: 가칭이예요.
    ja: 仮の名称です。
  event_goddessfall1_06_e_126:
    speaker: cecil_op_l
    en: The Queen is rapidly losing altitude. Presumed to be crashing.
    ko: 퀸. 고도 급강하 중. 추락 중으로 추정.
    ja: |-
      クイーンの高度、急速で下降中。
      墜落するものと推定します。
  event_goddessfall1_06_e_127:
    speaker: cecil_op_l
    en: She will enter visual range shortly.
    ko: 곧 가시거리에 들어옵니다.
    ja: まもなく視認可能です。
  event_goddessfall1_06_e_128:
    speaker: "<Narration>"
    en: Something black is falling from the sky.
    ko: 하늘에서 검은 무언가가 내려온다.
    ja: |-
      はるか上空から
      黒い何かが地上に近づきつつある
  event_goddessfall1_06_e_129:
    speaker: "<Narration>"
    en: The Queen, as if foreboding and malice themselves had taken form,
    ko: 불길함과 악의가 그대로 형태를 갖춘 듯한
    ja: それは禍々しさと悪意をそのまま形にしたような
  event_goddessfall1_06_e_130:
    speaker: "<Narration>"
    en: descends upon the skies above the surface.
    ko: 퀸이 지상의 하늘에 강림했다.
    ja: クイーンの姿に他ならなかった
  event_goddessfall1_06_e_131:
    speaker: johan
    en: "... So, that's... the Queen."
    ko: "…저것이… 퀸."
    ja: "…あれが…クイーンか。"
  event_goddessfall1_06_e_132:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_e_133:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_e_134:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_e_135:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_e_136:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall1_06_e_137:
    speaker: "<Narration>"
    en: As everyone looks up at the sky with bated breath,
    ko: 모두가 숨죽인 채 하늘을 바라보고 있을 때.
    ja: 誰もが息を殺して空を見上げていた、その時…
  event_goddessfall1_06_e_138:
    speaker: "<Narration>"
    en: Marian opens her mouth to speak.
    ko: 마리안이 입을 열었다.
    ja: マリアンが口を開いた
  event_goddessfall1_06_e_139:
    speaker: marian_q
    en: Everyone,
    ko: 여러분.
    ja: 皆さん…
  event_goddessfall1_06_e_140:
    speaker: marian_q
    en: please listen.
    ko: 들어주세요.
    ja: 聞いてください。
  event_goddessfall1_06_e_141:
    speaker: marian_q
    en: I am
    ko: 저는
    ja: 私は…
  event_goddessfall1_06_e_142:
    speaker: marian_q
    en: the Queen of the Raptures.
    ko: 랩쳐의 퀸입니다.
    ja: ラプチャーのクイーンです。
  event_goddessfall1_06_e_143:
    speaker: marian_q
    en: I have come here to claim the crown.
    ko: 왕관을 빼앗기 위해, 이곳에 왔습니다.
    ja: 王冠を奪うために、ここへ来ました。
  event_goddessfall1_06_e_144:
    speaker: "<Narration>"
    en: 'GODDESS FALL: To Be Continued...'
    ko: 'GODDESS FALL : To Be Continued….'
    ja: 'GODDESS FALL : To Be Continued….'
event_goddessfall2_01_s:
  event_goddessfall2_01_s_1:
    speaker: mirror_r
    en: Hmm, this isn't looking good.
    ko: 아 이거 안 좋은데요.
    ja: これはよくない展開ですね。
  event_goddessfall2_01_s_2:
    speaker: janghwa_n
    en: What do you mean?
    ko: 뭐가?
    ja: 何が？
  event_goddessfall2_01_s_3:
    speaker: mirror_r
    en: Marian went and revealed that she's the Queen.
    ko: 마리안이 자기가 퀸이라는 걸 밝혀버렸어요.
    ja: |-
      マリアンは、自分がクイーンであると
      明かしてしまったようです。
  event_goddessfall2_01_s_4:
    speaker: janghwa_n
    en: And why's that a bad thing?
    ko: 그게 왜 안 좋은데?
    ja: それが何か問題？
  event_goddessfall2_01_s_5:
    speaker: mirror_r
    en: The original plan was for Marian to keep the fact that she's the Queen hidden
    ko: 원래 계획은 마리안이 퀸이라는 걸 꼭꼭 숨긴 채 있으면
    ja: |-
      クイーンであることは
      隠そうとすると想定していましたので…
  event_goddessfall2_01_s_6:
    speaker: mirror_r
    en: while I subtly leak it to the other side.
    ko: 그 사실을 제가 저쪽에 은근슬쩍 흘릴 예정이었거든요.
    ja: |-
      頃合いを見て、
      密かに事実を流す予定でした。
  event_goddessfall2_01_s_7:
    speaker: mirror_r
    en: Then everyone would give her hell,
    ko: 그럼 모두가 마리안을 못살게 굴 테고,
    ja: その後責め立てられ、孤立したマリアンを…
  event_goddessfall2_01_s_8:
    speaker: mirror_r
    en: and once she broke down, I'd swoop in and sweet-talk her.
    ko: 멘탈이 무너진 마리안을 제가 살짝 구슬리려고 했죠.
    ja: |-
      心の隙につけいって、
      私の手に収めようと考えていたのですが。
  event_goddessfall2_01_s_9:
    speaker: janghwa_n
    en: Up to some nasty business, were you?
    ko: 못된 짓 하려 했구나?
    ja: また悪だくみしてたのね？
  event_goddessfall2_01_s_10:
    speaker: mirror_r
    en: '"Nasty business," you say? I prefer the term strategy.'
    ko: |-
      못된 짓이라뇨.
      전략이라고 해주시겠어요?
    ja: |-
      悪だくみ？
      戦略と言ってほしいところですね。
  event_goddessfall2_01_s_11:
    speaker: mirror_r
    en: Turning someone into a puppet isn't something that happens overnight. You
      have to take your time with it...
    ko: |-
      꼭두각시로 만드는 건 하루아침에 되는 게 아니에요.
      천천히 시간을 들여야 하죠.
    ja: |-
      操り人形を仕立てあげることは
      簡単ではありません。
      じっくりと時間をかける必要があるのです。
  event_goddessfall2_01_s_12:
    speaker: mirror_r
    en: Would you like to know how to brainwash someone? I do have a few methods.
    ko: |-
      혹시 세뇌하는 방법에 대해 알려드릴까요?
      몇 가지 방법이 있는데.
    ja: |-
      コツを知りたいですか？
      方法もいくつかありますが…
  event_goddessfall2_01_s_13:
    speaker: janghwa_n
    en: I'm not interested.
    ko: 관심 없어.
    ja: 興味なーい。
  event_goddessfall2_01_s_14:
    speaker: mirror_r
    en: Well, that was my plan...
    ko: 아무튼 그랬는데….
    ja: ともあれ、そのような算段だったのですが…
  event_goddessfall2_01_s_15:
    speaker: mirror_r
    en: but she went and said it first. At that level, it's practically a public announcement.
    ko: |-
      본인이 먼저 말해버렸네요.
      저 정도면 거의 공표죠.
    ja: |-
      本人に先を越されてしまいました。
      隠し事はなくなったも同然です。
  event_goddessfall2_01_s_16:
    speaker: janghwa_n
    en: I guess they might try to kill Marian. She's the Queen, after all.
    ko: 쟤들이 마리안을 죽이려 들 수도 있겠네. 일단은 퀸이니까.
    ja: |-
      みんなマリアンを倒そうとするかもね。
      クイーンには違いないんだし。
  event_goddessfall2_01_s_17:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_18:
    speaker: nayuta
    en: "... Thus concludes mine account of Young Lady Marian."
    ko: "…이상으로, 마리안 소저에 대한 설명을 마치겠소."
    ja: "…マリアンに関して、私の知ることは以上です。"
  event_goddessfall2_01_s_19:
    speaker: marian_q
    en: "... Thank you, Nayuta."
    ko: "…고마워요. 나유타."
    ja: "…ありがとうございます、ナユタ。"
  event_goddessfall2_01_s_20:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_21:
    speaker: marian_q
    en: Um... Everyone, I—
    ko: "…여러분. 저기… 저는…."
    ja: "…皆さん、その…私は…"
  event_goddessfall2_01_s_22:
    speaker: snowwhite
    en: Nothing's changed.
    ko: 바뀌는 건 없다.
    ja: 作戦に変更はない。
  event_goddessfall2_01_s_23:
    speaker: hongryeon
    en: I concur.
    ko: 동의하네.
    ja: 同じ意見だ。
  event_goddessfall2_01_s_24:
    speaker: rapunzel
    en: I already had some suspicions when she aimed a gun at us back in the Crown
      Kingdom.
    ko: |-
      이전에 크라운 왕국에서 저희한테 총구를 겨눴을 때,
      어느 정도 짐작하기도 했었고요.
    ja: |-
      クラウン王国で銃口を向けられた時から、
      ある程度予想はできていました。
  event_goddessfall2_01_s_25:
    speaker: rapunzel
    en: And, after all, our target is that Queen over there.
    ko: 그리고 우리 목표는 어디까지나 저기 있는 퀸이에요.
    ja: |-
      今の私たちの目標は、
      あくまで空の上にいるあのクイーンです。
  event_goddessfall2_01_s_26:
    speaker: snowwhite
    en: What matters now is what comes next.
    ko: 이후가 중요하다.
    ja: 重要なのはそこから先だ。
  event_goddessfall2_01_s_27:
    speaker: snowwhite
    en: Marian, will you have the Raptures destroy humanity?
    ko: 마리안. 너는 랩쳐들로 인류를 멸망시킬 건가?
    ja: |-
      マリアン。お前はラプチャーを従えて
      人類を滅ぼすつもりか？
  event_goddessfall2_01_s_28:
    speaker: marian_q
    en: No.
    ko: 아니요.
    ja: いいえ。
  event_goddessfall2_01_s_29:
    speaker: snowwhite
    en: And what guarantee is there that it won't happen?
    ko: 그렇게 되지 않을 거라는 보장은?
    ja: そうならないという保証は？
  event_goddessfall2_01_s_30:
    speaker: marian_q
    en: If that does happen, I want you to kill me.
    ko: 만약 그렇게 된다면, 여러분이 저를 죽여주세요.
    ja: もしそうなったら、私を殺してください。
  event_goddessfall2_01_s_31:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_32:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_33:
    speaker: snowwhite
    en: "... Noted."
    ko: "…알겠다."
    ja: "…そうか。"
  event_goddessfall2_01_s_34:
    speaker: nayuta
    en: Do the maidens of the Crown Kingdom harbor any objection to this, prithee?
    ko: 크라운 왕국의 소저들도 이견 없으시오?
    ja: |-
      クラウン王国の皆様方からは、
      何かご意見は？
  event_goddessfall2_01_s_35:
    speaker: chime
    en: T.A.L.O.S.
    ko: 탈로스야.
    ja: タロス。
  event_goddessfall2_01_s_36:
    speaker: talos
    en: Yes.
    ko: 예.
    ja: はい。
  event_goddessfall2_01_s_37:
    speaker: "<Narration>"
    en: T.A.L.O.S. grabs Chime and lifts her up.
    ko: 탈로스가 차임의 몸을 잡고 위로 들어 올린다.
    ja: タロスがチャイムの胴をつかみ、持ち上げた
  event_goddessfall2_01_s_38:
    speaker: "<Narration>"
    en: Chime locks eyes with Marian.
    ko: 차임이 마리안과 눈을 맞춘다.
    ja: チャイムの目の高さがマリアンと合った
  event_goddessfall2_01_s_39:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_40:
    speaker: marian_q
    en: "... Chime."
    ko: "…차임."
    ja: "…チャイム…"
  event_goddessfall2_01_s_41:
    speaker: "<Narration>"
    en: "*Smack!*"
    ko: 빡!
    ja: ベシッ！
  event_goddessfall2_01_s_42:
    speaker: "<Narration>"
    en: Chime whacks Marian on the head.
    ko: 차임이 마리안의 머리를 쥐어박았다.
    ja: チャイムがマリアンの頭を小突いた
  event_goddessfall2_01_s_43:
    speaker: marian_q
    en: Ow!
    ko: 아윽!
    ja: あうっ！
  event_goddessfall2_01_s_44:
    speaker: chime
    en: Queen or no, I care not! Ye're naught but a subject of the Crown Kingdom!
    ko: |-
      네놈이 퀸이든 뭐든 상관없다!
      네놈은 어차피 크라운 왕국의 신하니라!
    ja: |-
      クイーンだろうが何だろうが知らないのだ！
      お前はクラウン王国の民なのだ！
  event_goddessfall2_01_s_45:
    speaker: chime
    en: Thou need'st only tell me where thou art and what thou dost in good time!
    ko: 네놈은 그저 네가 어디에서 뭘 하는지 제때제때 보고나 하면 될 일이다!
    ja: |-
      どこかへ出かけるなら
      きちんと知らせるべきなのだ！
  event_goddessfall2_01_s_46:
    speaker: chime
    en: So...!
    ko: 그러니…!
    ja: だから…！
  event_goddessfall2_01_s_47:
    speaker: chime
    en: Act on thy own again without a word,
    ko: 한 번만 더 아무 말도 하지 않고, 이렇게 멋대로 군다면!
    ja: 今度何も言わずに、こんな勝手なことをしたら…
  event_goddessfall2_01_s_48:
    speaker: chime
    en: and I shall give thee a proper thrashing, mark my words!
    ko: 진짜 크게 혼쭐이 날 줄 알거라!
    ja: |-
      その時こそ大目玉を食らわせてやるから、
      覚悟するのだ！
  event_goddessfall2_01_s_49:
    speaker: marian_q
    en: "... Got it. Thanks, Chime."
    ko: "…알겠어요. 고마워요 차임."
    ja: "…分かりました。ありがとうございます。"
  event_goddessfall2_01_s_50:
    speaker: crown
    en: I trust you are in good health?
    ko: 몸은 괜찮은 건가요.
    ja: 身体の具合はよいのですか？
  event_goddessfall2_01_s_51:
    speaker: marian_q
    en: "... Yes, I'm fine now."
    ko: "…예. 이제 괜찮아요."
    ja: "…はい。もう大丈夫です。"
  event_goddessfall2_01_s_52:
    speaker: crown
    en: Then, there is no cause for worry.
    ko: 그렇다면 아무 문제 없군요.
    ja: でしたら、もう言うことはありませんわね。
  event_goddessfall2_01_s_53:
    speaker: kilo
    en: I didn't realize you were a person of high status, Marian.
    ko: 높으신 분이셨군요. 마리안.
    ja: そんなすごい人だったんですね、マリアン…
  event_goddessfall2_01_s_54:
    speaker: marian_q
    en: I... suppose so.
    ko: 그러… 게요.
    ja: そう…でしょうか。
  event_goddessfall2_01_s_55:
    speaker: kilo
    en: Would you consider taking me on as your subordinate? Everyone else already
      has a position, so it feels a bit lonely being just a commoner.
    ko: |-
      저 부하 좀 영입해 주시면 안 되나요?
      저 빼고 다 한자리하고 있어서, 일반 백성은 좀 외롭네요.
    ja: |-
      あの、私を部下ってことにしてもらえません？
      私の周り、みんなすごい肩書きばっかりで
      ただの一般人としては肩身が狭いかな～って…
  event_goddessfall2_01_s_56:
    speaker: talos
    en: You have me, Kilo.
    ko: 킬로에겐 제가 있지 않습니까.
    ja: キロには私がいるではありませんか。
  event_goddessfall2_01_s_57:
    speaker: kilo
    en: Ugh, you've been like this a lot lately. It's a bit much.
    ko: 아으. 얘 요즘 너무 이래서 좀 부담스럽네.
    ja: ううっ、こっちはこっちで最近何か圧が強いし…
  event_goddessfall2_01_s_58:
    speaker: mirror_r
    en: They might try to kill Marian...
    ko: 저들이 마리안을 죽일 수도 있다….
    ja: 彼女たちがマリアンを倒そうとする…？
  event_goddessfall2_01_s_59:
    speaker: mirror_r
    en: Hehe, that could never happen. Absolutely not.
    ko: |-
      후후. 그럴 리가요.
      절대 그럴 일은 없어요.
    ja: |-
      ふふ…まさか。
      そのようなことは絶対に起こりません。
  event_goddessfall2_01_s_60:
    speaker: mirror_r
    en: Those who took care of and protected her would never abandon her. Parents
      don't turn their backs on their children,
    ko: |-
      키우고, 보호했던 이들이에요.
      부모와 같은 이들이 자식을 버릴 리가 없죠.
    ja: |-
      彼女たちはマリアンを育て、守ってきた
      親のような存在です。
      我が子を捨てられるはずがないでしょう？
  event_goddessfall2_01_s_61:
    speaker: mirror_r
    en: no matter what form the child takes or what hardships they face. They stand
      by their children... and hold them close.
    ko: |-
      자식이 어떤 모습이든, 어떤 상황이든.
      부모는 자식의 편이고… 보듬죠.
    ja: |-
      どのような姿や状況になろうと、
      親として子どもを…かばおうとするでしょう。
  event_goddessfall2_01_s_62:
    speaker: mirror_r
    en: Even if the child makes mistakes, even if it could cast a shadow over their
      own future,
    ko: 설령 자식이 잘못했더라도, 그로 인해 자신들의 미래에 먹구름이 드리울 것이라고 확신하더라도.
    ja: |-
      たとえその子が悪い子で、
      守ろうとすることが自分たちの未来に
      闇をもたらすと分かっていても。
  event_goddessfall2_01_s_63:
    speaker: mirror_r
    en: parents close their eyes, shut out the world, and stay by their child's side.
      They never abandon them.
    ko: |-
      부모는 눈을 감고 귀를 닫은 채 자식의 편을 들고,
      버리지 않아요.
    ja: |-
      目を閉じ、耳を塞ぎ、
      何があっても我が子を見捨てない。
  event_goddessfall2_01_s_64:
    speaker: "<Narration>"
    en: Mirror gazes at the distant crimson clouds.
    ko: 미러는 저 멀리 붉게 물든 구름을 바라보았다.
    ja: ミラーは赤く染まった、彼方の雲を見つめた
  event_goddessfall2_01_s_65:
    speaker: mirror_r
    en: It's only natural, wouldn't you agree, Mother?
    ko: |-
      그게 당연한 거잖아요.
      안 그래요? 어머니.
    ja: |-
      そういうものです。
      ねえ？お母様。
  event_goddessfall2_01_s_66:
    speaker: janghwa_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_67:
    speaker: mirror_r
    en: Still, even if that holds true for the Pioneers and the Crown Kingdom, Eden
      might see things differently.
    ko: |-
      근데 파이오니아와 크라운 왕국은 그렇다 쳐도,
      에덴의 입장은 다를지 모르죠.
    ja: |-
      ですが、パイオニアと
      クラウン王国はそうでも、
      エデンは違うかもしれません。
  event_goddessfall2_01_s_68:
    speaker: mirror_r
    en: They don't know Marian well—they have no understanding of what she truly is,
      or the nature of her being.
    ko: |-
      에덴은 마리안에 대해 잘 몰라요.
      어떤 존재인지, 어떤 성격인지 잘 모르죠.
    ja: |-
      エデンにとってマリアンは未知の存在です。
      実態も、どのような性格かも分からないまま。
  event_goddessfall2_01_s_69:
    speaker: mirror_r
    en: To them, she is little more than a Nikke who became a Heretic, and then awakened
      her Queen Gene.
    ko: 그들로선 니케에서 헬레틱, 헬레틱에서 퀸 인자를 각성한 그 무언가.
    ja: |-
      ニケからヘレティックとなり、
      ヘレティックとして
      クイーン因子を発現させた何者か…
  event_goddessfall2_01_s_70:
    speaker: mirror_r
    en: Nothing more, nothing less.
    ko: 그 이상도 이하도 아니죠.
    ja: それ以上でもそれ以下でもありません。
  event_goddessfall2_01_s_71:
    speaker: mirror_r
    en: A being steeped in peril.
    ko: 위험천만한 존재라는 얘기예요.
    ja: 危険な存在に見えていることでしょうね。
  event_goddessfall2_01_s_72:
    speaker: johan
    en: "... Done with your tearful reunion?"
    ko: "…눈물 나는 재회는 끝났나?"
    ja: "…感動の再会は終わったか？"
  event_goddessfall2_01_s_73:
    speaker: johan
    en: Then get back to your posts.
    ko: 그럼 다들 위치로 돌아가라.
    ja: それなら各自、持ち場に戻れ。
  event_goddessfall2_01_s_74:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_75:
    speaker: johan
    en: Nikkes of the Crown Kingdom, follow Cecil.
    ko: 크라운 왕국의 니케들은 세실을 따라가라.
    ja: |-
      クラウン王国のニケたちは、
      セシルの案内に従え。
  event_goddessfall2_01_s_76:
    speaker: johan
    en: We'll review your specialties and specs afterward...
    ko: 주특기와 스펙 확인 후….
    ja: 主要な能力と性能を確認した後…
  event_goddessfall2_01_s_77:
    speaker: "<Narration>"
    en: Johan gazes beyond them at the crimson-stained sky.
    ko: 요한은 저 너머, 붉게 물든 하늘을 바라보았다.
    ja: ヨハンが赤く染まった空に目をやった
  event_goddessfall2_01_s_78:
    speaker: johan
    en: We'll commence the assault on the Queen.
    ko: 퀸 공략에 들어가겠다.
    ja: クイーン攻略作戦を開始する。
  event_goddessfall2_01_s_79:
    speaker: johan
    en: Cecil, any change in her position?
    ko: 세실. 퀸의 위치는 변동 없나?
    ja: セシル、クイーンの動きは？
  event_goddessfall2_01_s_80:
    speaker: cecil
    en: The Queen is currently positioned 10 kilometers from Eden at 3 o'clock. She
      remains in the air,
    ko: |-
      현재 퀸은 에덴에서 3시 방향 10km 거리에 위치하고 있어요.
      상공에 머물고 있는 상태고요.
    ja: |-
      現在、クイーンはエデンから3時の方向、
      距離10キロメートルの上空で
      静止しています。
  event_goddessfall2_01_s_81:
    speaker: cecil
    en: but at a low altitude. Isabel should be capable of attacking her at this height.
    ko: |-
      높이는 높지 않아요.
      이사벨이라면 공격은 가능하겠죠.
    ja: |-
      ここまで高度が下がれば、
      イサベルの攻撃が届きます。
  event_goddessfall2_01_s_82:
    speaker: cecil
    en: As observed, she is taking no action, not even deploying Raptures.
    ko: 보시다시피, 아무런 행동도 하고 있지 않고 랩쳐도 보내지 않고 있죠.
    ja: |-
      今のところ他の動きはなく、
      ラプチャーの変化も見られません。
  event_goddessfall2_01_s_83:
    speaker: cecil
    en: She's likely performing repairs after sustaining hits from Eden's Spear and
      Marian Cannon.
    ko: |-
      에덴의 창과 마리안 캐논에 맞은 직후라,
      정비를 하고 있는 것일지도 모르죠.
    ja: |-
      エデンの槍とマリアン砲が
      直撃しているはずですので、
      修復を優先している可能性もあります。
  event_goddessfall2_01_s_84:
    speaker: nayuta
    en: Or perchance she is afeard, and doth but watch how events unfold.
    ko: 아니면, 겁을 먹고 상황을 지켜보고 있을지도 모르오.
    ja: |-
      もしくは、怯えて様子を見ることに
      したのかもしれませんねぇ。
  event_goddessfall2_01_s_85:
    speaker: johan
    en: Your overactive imagination will be your downfall, Monk.
    ko: 상상력이 너무 풍부한 것도 독이 된다, 승려.
    ja: 想像力が豊かすぎるのは考えものだな。
  event_goddessfall2_01_s_86:
    speaker: nayuta
    en: "'Twas but a thought I voiced."
    ko: 뭐, 그냥 해본 소리외다.
    ja: はは…言ってみただけです。
  event_goddessfall2_01_s_87:
    speaker: johan
    en: What's your plan for those clones out there?
    ko: 밖의 분신들은 어찌할 셈이지.
    ja: 外の分身どもはどうするつもりだ？
  event_goddessfall2_01_s_88:
    speaker: nayuta
    en: For now, I shall leave them thus, for it is not possible to bring them into
      Eden.
    ko: |-
      일단 그대로 둘 생각이외다.
      에덴에 들일 수는 없는 노릇이니.
    ja: |-
      ひとまずは、このままです。
      エデンには受け入れて
      いただけないでしょうからねえ。
  event_goddessfall2_01_s_89:
    speaker: johan
    en: Right. I refuse to let any more unknowns inside.
    ko: 그래. 더 이상 뭔지 모를 것을 들이고 싶진 않다.
    ja: |-
      そうだな。これ以上得体の知れないものを
      増やしたくはない。
  event_goddessfall2_01_s_90:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_s_91:
    speaker: johan
    en: Everyone, perform maintenance and remain vigilant until further orders.
    ko: 모두, 별도 명령이 있기 전까지 정비와 동시에 경계해라.
    ja: |-
      全員、次の命令があるまで整備と、
      同時に警戒を怠るな。
  event_goddessfall2_01_s_92:
    speaker: nayuta
    en: "... Young Hero and maidens of Inherit."
    ko: "…요한 소협. 그리고 인헤르트의 소저들."
    ja: "…ヨハン、それからインヘルトの皆様方。"
  event_goddessfall2_01_s_93:
    speaker: nayuta
    en: If it so pleaseth thee, I would fain converse with thee for but a moment.
    ko: 괜찮으면 소인과 잠깐 얘기를 나눌 수 있겠소?
    ja: よろしければ、私と少し話をしませんか？
  event_goddessfall2_01_s_94:
    speaker: johan
    en: "... Very well."
    ko: "…그러지."
    ja: "…いいだろう。"
event_goddessfall2_01_e:
  event_goddessfall2_01_e_1:
    speaker: nayuta
    en: Young Hero, is there aught thou wouldst say?
    ko: 요한 소협. 따로 할 얘기가 있지 않소?
    ja: ヨハン。言いたいことがあるのでは？
  event_goddessfall2_01_e_2:
    speaker: johan
    en: What nonsense are you spouting?
    ko: 뭘 말하는 거지.
    ja: 何の話だ。
  event_goddessfall2_01_e_3:
    speaker: nayuta
    en: I cannot fathom the significance that Young Lady Marian holds for thee, yet
      a Queen is still a Queen.
    ko: 마리안이 너희들에게 어떤 존재인지는 모르나, 퀸은 퀸이다.
    ja: |-
      マリアンがお前たちにとって
      どのような存在かは知らないが、
      クイーンはクイーン…
  event_goddessfall2_01_e_4:
    speaker: nayuta
    en: A Queen is not to be forgiven. Eden's warriors shall slay the wicked Queen
      without fail, or something of the sort.
    ko: 퀸은 용서하지 않는다. 우리 에덴의 용사들은 반드시 극악무도한 퀸을 죽일 것이다. 에덴 만세. 뭐 이런 거요.
    ja: |-
      クイーンの存在は許されない。
      エデンの勇者は、悪しきクイーンを打ち倒す。
      エデン万歳。そういったことです。
  event_goddessfall2_01_e_5:
    speaker: harran
    en: What choice do we have?
    ko: 선택의 여지가 있니?
    ja: 選択の余地があるのかしら？
  event_goddessfall2_01_e_6:
    speaker: nayuta
    en: "... None, verily."
    ko: "…없소."
    ja: "…ないでしょうねぇ。"
  event_goddessfall2_01_e_7:
    speaker: harran
    en: You see? We've got no choice.
    ko: 그래. 우리에겐 선택의 여지가 없단다.
    ja: |-
      そう。私たちは
      選り好みしている場合ではないの。
  event_goddessfall2_01_e_8:
    speaker: harran
    en: The Queen's right there, a threat plain as day
    ko: 당장에 위협이 되는 퀸이 저 앞에 진을 치고 있단다.
    ja: 私たちの存在を脅かすものが、空の上にある。
  event_goddessfall2_01_e_9:
    speaker: harran
    en: and casually firing beams from heights most weapons couldn't even dream of
      reaching.
    ko: 까마득한 높이에서 빔 포격을 아무렇지도 않게 쏟아내는 퀸이 말이다.
    ja: |-
      はるかな空の上から、
      無慈悲に光を降らせるクイーンがね。
  event_goddessfall2_01_e_10:
    speaker: harran
    en: And, for reasons I can't quite figure... Marian sent it right back.
    ko: |-
      그리고 무슨 영문인지는 모르나,
      마리안은 그 공격을 [되돌려] 줬다.
    ja: |-
      そして、どういう事情かは知らないけれど、
      彼女はその攻撃を「跳ね返して」くれた。
  event_goddessfall2_01_e_11:
    speaker: harran
    en: Not just a little push, she hit with enough force to actually tip the scales
      of the battle.
    ko: |-
      전력으로 유의미한 수준이 아니라,
      전황에 크게 영향을 미칠 정도의 능력을 갖추고 있다는 얘기지.
    ja: |-
      戦力になるどころか、
      戦況を一人で変える力を持っているわ。
  event_goddessfall2_01_e_12:
    speaker: isabel
    en: "... And"
    ko: "…그리고."
    ja: "…それに…"
  event_goddessfall2_01_e_13:
    speaker: isabel
    en: if we try to move against Marian, we'll end up fighting both the Pioneers
      and the Crown Kingdom.
    ko: |-
      마리안을 우리가 어떻게 하려는 순간,
      파이오니아와 크라운 왕국을 상대해야 해.
    ja: |-
      マリアンと敵対すれば、
      その瞬間からパイオニアとクラウンたちも
      敵に回すことになるでしょうね。
  event_goddessfall2_01_e_14:
    speaker: isabel
    en: A fight among ourselves right now could be the end of us.
    ko: 지금 상황에서 내분은 치명적이야.
    ja: この状況で仲間割れなんて致命的よ。
  event_goddessfall2_01_e_15:
    speaker: johan
    en: Marian isn't a problem for now.
    ko: 마리안의 경우 [지금은] 아무 문제가 되지 않는다.
    ja: マリアンは「今のところ」脅威にならない。
  event_goddessfall2_01_e_16:
    speaker: johan
    en: That could change later, but for the moment, she isn't.
    ko: 추후, 무슨 문제가 생길지는 모르나 지금은 아니다.
    ja: |-
      先のことは知らないが、
      今は優先するべきことがある。
  event_goddessfall2_01_e_17:
    speaker: johan
    en: Therefore, we'll exploit her fully.
    ko: 그러므로 전력으로 활용한다.
    ja: 戦力として使えるものはすべて使う。
  event_goddessfall2_01_e_18:
    speaker: johan
    en: What I want is to reproach Marian for the pathetic weakness that made her
      conceal her true identity.
    ko: |-
      마리안에게 따지고 싶은 것은.
      정체를 숨기고 싶어 한 그 알량한 나약함 때문에.
    ja: |-
      だが、あえて言いたいことがあるとするなら、
      彼女が正体を隠そうと迷った弱さのせいで…
  event_goddessfall2_01_e_19:
    speaker: johan
    en: Because of it, she arrived late to Eden, and we lost Noah.
    ko: 에덴으로 오는 시간이 늦어졌고, 그 탓에 노아를 잃었다는 것뿐이다.
    ja: |-
      エデンへの到着が遅れ、
      その時間差がノアの損失につながった。
  event_goddessfall2_01_e_20:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_21:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_22:
    speaker: johan
    en: But I won't speak of it.
    ko: 하지만 입 밖으로 꺼내진 않겠다.
    ja: だが、本人に言おうとは思わない。
  event_goddessfall2_01_e_23:
    speaker: johan
    en: I can't gauge the depth of her struggles, so I won't speak lightly of them.
    ko: 그 고민의 깊이를 가늠할 수 없으니, 함부로 말할 수 없다.
    ja: |-
      私に彼女の苦悩は計り知れない。
      軽々しく問い詰めるべきことではないだろう。
  event_goddessfall2_01_e_24:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_25:
    speaker: nayuta
    en: Permit me to add but one word.
    ko: 소인. 한 마디 더해도 되겠소?
    ja: 一言だけ、よろしいでしょうか？
  event_goddessfall2_01_e_26:
    speaker: johan
    en: Go ahead.
    ko: 해라.
    ja: 好きにしろ。
  event_goddessfall2_01_e_27:
    speaker: nayuta
    en: Pray, lend thy strength that we might raise Young Lady Marian to the throne
      of Queen.
    ko: 마리안 소저를 퀸으로 만드는 것에 힘을 빌려주시오.
    ja: |-
      マリアンをクイーンにするため、
      どうか力をお貸しください。
  event_goddessfall2_01_e_28:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_29:
    speaker: johan
    en: Do you believe the world Marian spoke of, one where all will love one another,
      will ever come?
    ko: 마리안이 말한 모두가 모두를 사랑하는 세계가 올 것이라 믿나?
    ja: |-
      彼女が言うような、互いに愛し合える世界が
      訪れるとでも信じているのか？
  event_goddessfall2_01_e_30:
    speaker: nayuta
    en: "... Such a thing shall never come to pass."
    ko: "…그럴 리가 있겠소."
    ja: "…そうだと思いますか？"
  event_goddessfall2_01_e_31:
    speaker: johan
    en: "..."
    ko: |-
      …….
      …….
    ja: |-
      ……
      ……
  event_goddessfall2_01_e_32:
    speaker: johan
    en: "...!"
    ko: "…!"
    ja: "…！"
  event_goddessfall2_01_e_33:
    speaker: johan
    en: You're no different from them, Monk.
    ko: "…너도 다를 바 없다, 승려."
    ja: "…やはりお前も似たようなものか。"
  event_goddessfall2_01_e_34:
    speaker: johan
    en: No, you're worse.
    ko: 아니. 더 최악이군.
    ja: いや、それ以下だ。
  event_goddessfall2_01_e_35:
    speaker: johan
    en: Utter scum.
    ko: 쓰레기 같은 놈.
    ja: 救いようのないクズめ。
  event_goddessfall2_01_e_36:
    speaker: nayuta
    en: Did I not say it ere?
    ko: 소인. 말씀드리지 않았소.
    ja: おや、すでにお教えしていたはずですが。
  event_goddessfall2_01_e_37:
    speaker: nayuta
    en: Verily, this humble self shall do whatever is needful to achieve victory.
    ko: 소인은 이기기 위해선 무슨 일이든 할 것이외다.
    ja: 私は勝つためなら手段は選ばぬ覚悟です。
  event_goddessfall2_01_e_38:
    speaker: mirror_r
    en: But Eden won't make a move against Marian.
    ko: 하지만 에덴은 마리안을 치지 않을 거예요.
    ja: |-
      …とはいえ、エデンもマリアンには
      手を出そうとしないでしょう。
  event_goddessfall2_01_e_39:
    speaker: mirror_r
    en: Or rather, it's more accurate to say they simply can't.
    ko: 그럴 수 없다. 에 가깝지만요.
    ja: 手を出せない、と言う方が正確ですね。
  event_goddessfall2_01_e_40:
    speaker: mirror_r
    en: "... The one we should be watching is Nayuta."
    ko: "…불안 요소는, 나유타."
    ja: "…不安要素となるのは…ナユタ。"
  event_goddessfall2_01_e_41:
    speaker: mirror_r
    en: It's just a hunch, but I believe she has another agenda.
    ko: 감이긴 한데 다른 꿍꿍이속이 있는 것 같단 말이죠.
    ja: |-
      確証はありませんが、
      まだ何か隠しているような気がするのです。
  event_goddessfall2_01_e_42:
    speaker: janghwa_n
    en: |-
      What other agenda could she have?
      The two possibilities are either Marian becomes Queen or she gets killed when the Queen Gene is taken from her.
    ko: |-
      다른 꿍꿍이속?
      마리안은 퀸이 되거나 인자를 흡수당해 죽거나 둘 중 하나인 것 아냐?
    ja: |-
      何か隠してるって？
      マリアンは自分がクイーンになるか、
      因子を吸収されて死ぬかじゃなかった？
  event_goddessfall2_01_e_43:
    speaker: mirror_r
    en: Yes, but...
    ko: 그렇죠. 그런데….
    ja: それはそうです。ですが…
  event_goddessfall2_01_e_44:
    speaker: mirror_r
    en: I have a feeling that Nayuta was the one who planted the idea in Marian's
      head.
    ko: 아무래도 마리안에게 바람을 넣은 게 나유타 같단 말이죠.
    ja: |-
      マリアンをそそのかしたのは
      ナユタに違いありません。
  event_goddessfall2_01_e_45:
    speaker: mirror_r
    en: Because of that, she arranged some strong protectors for Marian—not just for
      Marian herself, but for Queen Marian.
    ko: |-
      그 덕에 마리안에게 든든한 보호자들을 만들었어요.
      그냥 마리안이 아닌, 퀸 마리안의 보호자를요.
    ja: |-
      結果、マリアンには頼もしい保護者が
      できました。彼女がクイーン・マリアンだと
      知った上で守る者が。
  event_goddessfall2_01_e_46:
    speaker: mirror_r
    en: There's no reason for her to be that proactive otherwise...
    ko: 이렇게 적극적일 이유가 없을 텐데….
    ja: わざわざそう仕向ける理由は…
  event_goddessfall2_01_e_47:
    speaker: janghwa_n
    en: Weren't you allies?
    ko: 동맹 아니었어?
    ja: 同盟を結んでるんじゃなかったの？
  event_goddessfall2_01_e_48:
    speaker: mirror_r
    en: We are, but our ultimate goals differ.
    ko: 그렇긴 한데 최종 목적은 다르죠.
    ja: |-
      取り決めはありますが、
      最終的な目的は異なりますから。
  event_goddessfall2_01_e_49:
    speaker: mirror_r
    en: I require a puppet Queen, whereas Nayuta desires a surface without one.
    ko: |-
      저는 꼭두각시 퀸이 필요한 거고,
      나유타는 퀸이 없는 지상을 원할 테니까.
    ja: |-
      私の望むものは操り人形としてのクイーン。
      ナユタの望みはクイーンのいない地上です。
  event_goddessfall2_01_e_50:
    speaker: mirror_r
    en: From Nayuta's perspective, a Queen under my control is still one she can negotiate
      with, which is why we formed an alliance.
    ko: 저를 위한 꼭두각시 퀸이 생겨나면, 그 퀸은 나유타 입장에서는 협의가 가능한 퀸인 셈이니, 동맹을 맺은 거죠.
    ja: |-
      操り人形のクイーンは、ナユタからすれば
      話の通じるクイーンとも言えます。
      それで手を結ぶことにしたのでしょう。
  event_goddessfall2_01_e_51:
    speaker: janghwa_n
    en: When the time comes, will you agree to Nayuta's terms?
    ko: 그때가 오면, 나유타의 협의를 들어줄 거야?
    ja: もしその時が来たら、ナユタと話し合うの？
  event_goddessfall2_01_e_52:
    speaker: mirror_r
    en: Of course, there's no reason I wouldn't.
    ko: 물론이죠. 안 그럴 이유가 없는걸요.
    ja: そうですね。断る理由もありませんし。
  event_goddessfall2_01_e_53:
    speaker: janghwa_n
    en: Ah, that explains why Nayuta is being so proactive.
    ko: 그럼 나유타가 적극적인 것도 설명이 되네.
    ja: |-
      じゃあ、ナユタはそのために
      頑張ってるだけじゃない？
  event_goddessfall2_01_e_54:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_55:
    speaker: mirror_r
    en: Hmm...
    ko: "…흠."
    ja: "…ふむ…"
  event_goddessfall2_01_e_56:
    speaker: mirror_r
    en: Well, we shall see soon enough.
    ko: 뭐, 두고 보면 알 일이겠죠.
    ja: まあ、いずれ分かることでしょう。
  event_goddessfall2_01_e_57:
    speaker: mirror_r
    en: But isn't that quite a sight?
    ko: 그나저나 저거, 장관이지 않나요?
    ja: それにしても、面白い眺めではありませんか？
  event_goddessfall2_01_e_58:
    speaker: mirror_r
    en: All those Nayuta look-alikes assembled just like that.
    ko: 나유타랑 똑같이 생긴 유사 인간들이 저렇게 진을 치고 있는 거.
    ja: |-
      ナユタとまったく同じ姿の人間もどきが
      ああして陣を構えている様子は…
  event_goddessfall2_01_e_59:
    speaker: janghwa_n
    en: I find it a bit unsettling.
    ko: 난 좀 징그러워.
    ja: 私はちょっと気味悪く感じるかな。
  event_goddessfall2_01_e_60:
    speaker: mirror_r
    en: It's effective, that much is certain.
    ko: 하지만 효과는 확실하죠.
    ja: ですが、威圧効果はあります。
  event_goddessfall2_01_e_61:
    speaker: mirror_r
    en: The great and merciful Mother is scared stiff again, merely watching from
      afar!
    ko: 위대하고 자애로우신 어머니께서 겁을 집어먹고 또! 저 멀리서 상황만 지켜보고 계시잖아요.
    ja: |-
      偉大で慈しみ深い我がお母様ときたら…
      また怯えて、遠くから様子を
      うかがうだけになったでしょう？
  event_goddessfall2_01_e_62:
    speaker: mirror_r
    en: Haha. Honestly,
    ko: 하하. 정말이지.
    ja: ふふ…まったく…
  event_goddessfall2_01_e_63:
    speaker: mirror_r
    en: it's utterly pathetic.
    ko: 한심해 죽겠다니까요.
    ja: 実に情けない臆病者です。
  event_goddessfall2_01_e_64:
    speaker: nayuta
    en: Hmm... This doth prove a difficult matter. All the Alva particles I had gathered
      are now exhausted.
    ko: |-
      …음. 이건 어렵겠소.
      모아놓은 에블라 입자를 모두 소진했구려.
    ja: |-
      …うーん。これは難しいですねぇ。
      集積していたエブラ粒子を
      使い果たしてしまっているとは…
  event_goddessfall2_01_e_65:
    speaker: chime
    en: "... Aye, the Naked King may not be used upon this battlefield. A shame it
      is."
    ko: |-
      …그래. 네이키드 킹을 이 전장에서 쓸 수는 없겠구나.
      아쉽다.
    ja: |-
      …うーむ。こんな大決戦の時に
      ネイキッドキングを使えないとは…
      無念なのだ。
  event_goddessfall2_01_e_66:
    speaker: crown
    en: It's all right, Chime. I remain strong even without it.
    ko: 괜찮아요 차임. 그런 것 없이도 저는 강하답니다.
    ja: |-
      構いませんわ、チャイム。
      そのようなものに頼らずとも、
      私は強いのですから。
  event_goddessfall2_01_e_67:
    speaker: chime
    en: I know it well, of course.
    ko: 물론 알고 있습니다요.
    ja: それは十分に承知しております。
  event_goddessfall2_01_e_68:
    speaker: chime
    en: Yet, to think that I might never gaze upon thy majestic presence again...
    ko: 그래도 아가씨의 그 압도적인 위용을 다시 못 본다 생각하니….
    ja: |-
      しかし、お嬢さまの圧倒的なご威光が
      再び目にできる機会を
      逃してしまったかと思うと…
  event_goddessfall2_01_e_69:
    speaker: nayuta
    en: Verily, all hope is not utterly lost.
    ko: 방도가 아예 없는 것은 아니외다.
    ja: 全く使いようがないわけではありません。
  event_goddessfall2_01_e_70:
    speaker: nayuta
    en: For but an instant—an instant most fleeting—I could transmute the Alva particles
      thus gathered into a heat shockwave.
    ko: 일순. 정말 일순이라면 지금까지 모아놓은 에블라 입자를 열 충격파로 전환할 수 있소.
    ja: |-
      一瞬…ほんの一瞬であれば、
      かき集めたエブラ粒子を
      どうにか熱衝撃波に転換できるでしょう。
  event_goddessfall2_01_e_71:
    speaker: nayuta
    en: Yet, I would not counsel such a course.
    ko: 허나 추천 드리지 않소.
    ja: ただ、おすすめはできませんねぇ。
  event_goddessfall2_01_e_72:
    speaker: nayuta
    en: With but a single motion shall all be spent, the ill effects shall descend
      upon thee in their full measure.
    ko: |-
      손짓 한 번이면 모두 소진될 것이고,
      그로 인한 부작용은 고스란히 받을 터이니.
    ja: |-
      一度手をかざせば使い切り、
      副作用だけは一人前、となりますから。
  event_goddessfall2_01_e_73:
    speaker: chime
    en: "... Still, best have it ready, for it may yet serve in times of dire need,
      so say I."
    ko: |-
      …그래도 준비해 주면 좋겠구나.
      정말 아쉬울 때 도움이 될지도 모르니.
    ja: |-
      …それでも頼むのだ。
      万一の備えというヤツなのだ。
  event_goddessfall2_01_e_74:
    speaker: chime
    en: Oho! What curious things hast thou found?
    ko: 그래서 말인데, 뭐 또 다른 신기한 보구는 없느냐?
    ja: それはそうと、他に面白そうな宝具はないのだ？
  event_goddessfall2_01_e_75:
    speaker: chime
    en: I should be pleased were this one meant for me!
    ko: 이왕이면, 이번엔 나를 위한 것이면 좋겠구나!
    ja: |-
      せっかくなら、
      今度は私が使えるものが欲しいのだ！
  event_goddessfall2_01_e_76:
    speaker: nayuta
    en: "... Nay, I am no coffer that doth spit forth riches at a mere tap."
    ko: "…없소이다. 소인은 두드리면 보물을 내뱉는 존재가 아니오."
    ja: |-
      …ありませんねぇ。私とて、なんでも
      好きなように出せるわけではありませんよ。
  event_goddessfall2_01_e_77:
    speaker: chime
    en: Eh? Was it not thus?
    ko: 응? 아니었더냐?
    ja: なに？違ったのだ？
  event_goddessfall2_01_e_78:
    speaker: nayuta
    en: Nay, verily.
    ko: 아니오.
    ja: とんでもない。
  event_goddessfall2_01_e_79:
    speaker: "<Narration>"
    en: Papillon leans against the railing, gazing out at the Nayutas that fill the
      space before Eden.
    ko: |-
      파피용은 난간에 기댄 채,
      에덴의 앞을 가득 채우고 있는 나유타들을 바라보고 있었다.
    ja: |-
      パピヨンは手すりに体重を預け、
      エデンの前にひしめく
      ナユタたちを観察していた
  event_goddessfall2_01_e_80:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_81:
    speaker: nayuta_n_03
    en: Lamentably, I lost 820 of them in the preceding fray.
    ko: 좀 전의 격전으로 820의 소인을 잃었소.
    ja: 先ほどの激戦で、820の私を失った。
  event_goddessfall2_01_e_82:
    speaker: nayuta_n_02
    en: "'Twas fewer than I had feared, for which I am relieved..."
    ko: 예상했던 것보다 적어서 다행이외다.
    ja: 予想より少なくてよかったですねぇ。
  event_goddessfall2_01_e_83:
    speaker: nayuta_n_01
    en: Yet 'tis more than I had hoped, a grievous matter indeed.
    ko: 예상했던 것보다 많아서 큰일이외다.
    ja: 予想より多くて大変ですねぇ。
  event_goddessfall2_01_e_84:
    speaker: nayuta_n_04
    en: Ah! Behold yonder, a butterfly!
    ko: 아! 저기 나비가 날아가오!
    ja: おや！蝶が飛んでいる！
  event_goddessfall2_01_e_85:
    speaker: nayuta_n_05
    en: Pray, why dost thou make such a loud clamor?
    ko: 이 소인은 왜 이리 목소리가 큰 게요.
    ja: |-
      こちらの私はなぜこんなに
      声が大きいのか…
  event_goddessfall2_01_e_86:
    speaker: nayuta_n_03
    en: I heard thy auditory sensors suffered ill from thy long sojourn beside a waterfall.
    ko: 폭포 옆에서 오랜 기간 머물러서 청각 센서가 망가졌다 들었소.
    ja: |-
      滝のそばに長いあいだ留まっていたせいで、
      聴覚センサーに不具合があるそうで。
  event_goddessfall2_01_e_87:
    speaker: nayuta_n_03
    en: Thou seemest skilled with firearms. Pray, are they of any worth?
    ko: 그쪽 소인은 보아하니 총기를 쓰는 것 같던데, 그거 쓸만하오?
    ja: |-
      そちらの私は見たところ、
      銃をお使いのようで。
      使い心地はいかがですか？
  event_goddessfall2_01_e_88:
    speaker: nayuta_n_05
    en: In the western lake lurks a fearsome beast.
    ko: 서쪽 호수엔 괴물이 산다오.
    ja: 西の湖には怪物が住んでいるようです。
  event_goddessfall2_01_e_89:
    speaker: nayuta_n_03
    en: A spear far surpasseth a gun. Take this, and do give it a whirl.
    ko: 총보단 창이 훨씬 낫소. 이걸 휘둘러 보시오.
    ja: |-
      銃よりも槍の方が素晴らしいですよ。
      試しに振ってご覧なさい。
  event_goddessfall2_01_e_90:
    speaker: nayuta_n_04
    en: Yet truly, whether spear or gun, explosives reign supreme. Didst thou not
      witness mine prowess in action?
    ko: |-
      총이든 창이든 폭탄이 최고외다.
      소인이 활약하는 걸 보지 못했소?
    ja: |-
      銃に槍？いやいや、爆弾が一番ですねぇ。
      よもや私の活躍を見ておられない？
  event_goddessfall2_01_e_91:
    speaker: nayuta_n_07
    en: Ah, two days without sustenance... mine belly clings to mine spine!
    ko: 이런, 이틀을 굶었더니 뱃가죽이 등에 달라붙었소이다.
    ja: |-
      おっと。2日間も空腹で過ごしていたら
      お腹と背中がくっつきそうですねぇ。
  event_goddessfall2_01_e_92:
    speaker: nayuta_n_06
    en: Didst thou know this curious fact? The male deer casteth off his antlers in
      winter. I have seen it with mine own eyes.
    ko: |-
      그거 알고 있소?
      숫사슴은 겨울에 자기 뿔을 직접 끊어내오. 소인이 봤소.
    ja: |-
      知っていますか？
      牡ジカは冬に自分のツノを
      切り落とすのです。この目で見ました。
  event_goddessfall2_01_e_93:
    speaker: nayuta_n_05
    en: Behold, here is a golden axe I did pull forth from beneath the lake...
    ko: |-
      이것들 봐주시오.
      소인이 저어기 호수 아래에서 구한 금으로 된 도끼이온데….
    ja: |-
      これを見てください。
      私が遠くの湖の底で手に入れた
      金の斧なのですが…
  event_goddessfall2_01_e_94:
    speaker: nayuta_n_03
    en: I did misstep upon the lava, and an ankle I have lost!
    ko: 소인 용암을 잘못 밟아 한쪽 발목을 잃었소.
    ja: |-
      うっかり溶岩を踏んでしまい、
      足首を失いました。
  event_goddessfall2_01_e_95:
    speaker: nayuta_n_02
    en: Prithee, doth any among thee possess a spare eyeball?
    ko: 혹시 남는 안구 있는 소인 계시오?
    ja: 余っている眼球をお持ちの私はいませんか？
  event_goddessfall2_01_e_96:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_01_e_97:
    speaker: papillon
    en: I feel like I'm about to lose my mind...
    ko: 저, 정신 나갈 것 같아….
    ja: あ、頭がおかしくなりそう…
  event_goddessfall2_01_e_98:
    speaker: cecil_op_r
    en: Papillon, your break is over, isn't it?
    ko: 파피용. 휴식은 끝났나요?
    ja: パピヨン。休憩は終わりましたか？
  event_goddessfall2_01_e_99:
    speaker: papillon
    en: Oh, coming.
    ko: 아, 바로 갈게.
    ja: あっ、すぐ行くわ。
  event_goddessfall2_01_e_100:
    speaker: papillon
    en: But when will long-range comms be restored?
    ko: 근데 장거리 통신은 언제 회복돼?
    ja: ところで、長距離通信っていつ復旧しそう？
  event_goddessfall2_01_e_101:
    speaker: cecil_op_r
    en: It's already been restored.
    ko: 기능은 회복되었어요.
    ja: すでに復旧しています。
  event_goddessfall2_01_e_102:
    speaker: papillon
    en: Really? That's fast.
    ko: 진짜? 수리가 진짜 빠르구나.
    ja: ホント？ずいぶん早いわね。
  event_goddessfall2_01_e_103:
    speaker: cecil_op_r
    en: Each of Eden's facilities and functions was designed to operate as independently
      as possible, minimizing reliance on external systems.
    ko: 에덴의 각 시설과 기능은 연동성을 줄이고 최대한 독립적으로 제작했으니까요.
    ja: |-
      エデンの各施設と機能はあえて連動させず、
      できる限り独立するように
      設計されていますから。
  event_goddessfall2_01_e_104:
    speaker: papillon
    en: "... So that means we can get in touch with the outside?"
    ko: "…그럼, 외부에 연락할 수도 있겠네?"
    ja: "…じゃあ、もう外に連絡できるってことよね？"
  event_goddessfall2_01_e_105:
    speaker: cecil_op_r
    en: Regrettably, that's impossible.
    ko: 안타깝지만 불가능해요.
    ja: 残念ながらそれは不可能です。
  event_goddessfall2_01_e_106:
    speaker: cecil_op_r
    en: The Queen is jamming our systems.
    ko: 퀸이 재머를 뿌려대고 있거든요.
    ja: クイーンの通信妨害を受けています。
  event_goddessfall2_01_e_107:
    speaker: papillon
    en: "... Ugh, this sucks."
    ko: "…최악이네 정말."
    ja: "…ホント最悪ね。"
  event_goddessfall2_01_e_108:
    speaker: papillon
    en: Looks like hauling supplies is all I can do for now...
    ko: 당장은 열심히 짐을 나르는 것 말고는 할 일이 없
    ja: |-
      結局今は、荷物運びぐらいしか
      することが――
  event_goddessfall2_01_e_109:
    speaker: cecil_op_r
    en: Brace for impact.
    ko: 충격 대비.
    ja: 衝撃に備えてください。
  event_goddessfall2_01_e_110:
    speaker: cecil_op_r
    en: Attack incoming.
    ko: 공격이 옵니다.
    ja: 攻撃が来ます。
  event_goddessfall2_01_e_111:
    speaker: papillon
    en: What?!
    ko: 뭣…!
    ja: なっ…！
  event_goddessfall2_01_e_112:
    speaker: "<Narration>"
    en: Papillon hurriedly ducks under the railing and looks across.
    ko: 파피용은 다급히 난간 아래로 몸을 숙이며 저편을 바라보았다.
    ja: |-
      パピヨンはあわてて物陰に身を隠し、
      様子をうかがった
  event_goddessfall2_01_e_113:
    speaker: "<Narration>"
    en: Countless red lights are flying toward Eden.
    ko: 수많은 붉은색 빛이, 에덴을 향해 날아오고 있었다.
    ja: |-
      数え切れないほどの赤い光が、
      エデンに向かって降り注いでいた
event_goddessfall2_02_s:
  event_goddessfall2_02_s_1:
    speaker: nayuta
    en: How doth the situation fare?
    ko: 상황은 어떻소?
    ja: 状況は？
  event_goddessfall2_02_s_2:
    speaker: johan
    en: Isn't it obvious? The Queen is bombarding Eden with her beam.
    ko: |-
      보면 모르나?
      퀸이 빔 병기를 에덴을 향해 난사하고 있다.
    ja: |-
      見れば分かるだろう？
      クイーンから光学兵器の
      一斉射撃を受けている。
  event_goddessfall2_02_s_3:
    speaker: "<Narration>"
    en: "*Bang!* *Boom!*"
    ko: 쾅! 콰앙!
    ja: バン！ドカン！
  event_goddessfall2_02_s_4:
    speaker: nayuta
    en: Is all well with Eden?
    ko: 에덴은 괜찮소?
    ja: エデンはもちますか？
  event_goddessfall2_02_s_5:
    speaker: johan
    en: The shield over all of Eden is holding. Not all attacks are blocked, but it's
      sufficiently effective.
    ko: |-
      성녀가 에덴 전체에 실드를 전개해 막아내고 있다.
      모두 막아내진 못하지만 제법 유효하다.
    ja: |-
      聖女がエデンに広くシールドを展開している。
      すべてを防ぐとはいかないが、有効だ。
  event_goddessfall2_02_s_6:
    speaker: nayuta
    en: "... So, it doth pale before that savage beam of yore."
    ko: "…이전의 그 무지막지한 빔 포격만큼은 아니라는 얘기구려."
    ja: |-
      …あの強力なビーム砲だけでは
      なかったということですか。
  event_goddessfall2_02_s_7:
    speaker: johan
    en: Right. That means Eden's Spear and Marian Can—Marian's counterstrike were
      effective.
    ko: 그래. 에덴의 창과 마리안 캐ㄴ, 마리안의 되돌리기가 유효했다는 얘기겠지.
    ja: |-
      ああ。エデンの槍とマリアンほ…
      マリアンの反射が効いたのだろう。
  event_goddessfall2_02_s_8:
    speaker: johan
    en: The Queen can't use her large-caliber beam for now.
    ko: 퀸은 지금 대구경 빔 포격을 사용할 수 없다.
    ja: |-
      クイーンは今のところ、
      あの大型ビーム砲を使用できない。
  event_goddessfall2_02_s_9:
    speaker: nayuta
    en: Perchance she doth restrain herself, mindful of Young Lady Marian's counterstrike.
    ko: 혹은 마리안 소저의 되돌리기를 의식해서 사용하지 않는 것일지도 모르오.
    ja: |-
      あるいは、反射されることを恐れて
      使えないのかもしれませんねえ。
  event_goddessfall2_02_s_10:
    speaker: nayuta
    en: Therefore, she chooseth not a single mighty blow, but many lesser ones.
    ko: 그래서 큰 한방이 아니라, 작게 여럿을 쏘는 것일 테지.
    ja: |-
      だから大きな一発ではなく、
      小さいものを大量に撃ってきている。
  event_goddessfall2_02_s_11:
    speaker: nayuta
    en: In either case, 'tis certain the Queen seeketh to curb our movements.
    ko: 어느 쪽이든, 퀸은 지금 이쪽을 견제하고 있는 게 분명하오.
    ja: いずれにせよ、これは牽制に違いありません。
  event_goddessfall2_02_s_12:
    speaker: "<Narration>"
    en: "*Bang!* *Boom!*"
    ko: 쾅! 콰앙!
    ja: バン！ドカン！
  event_goddessfall2_02_s_13:
    speaker: johan
    en: So it seems that your observation that the Queen is afraid may be correct.
    ko: 그래. 네가 말한 퀸이 겁을 먹었다는 게 정말일지도 모른다는 생각이 든다.
    ja: |-
      そうだな。恐れているという見方も
      間違いではないかもしれん。
  event_goddessfall2_02_s_14:
    speaker: johan
    en: Even with her overwhelming forces and power, she still restrains herself.
    ko: 저만큼의 병력과, 본인의 압도적인 스펙이 있음에도 견제 중이다.
    ja: |-
      これだけの兵力差と、
      自身の圧倒的な能力がありながら、
      回りくどい手を使っている。
  event_goddessfall2_02_s_15:
    speaker: nayuta
    en: Let us advance.
    ko: 치고 나갑시다.
    ja: 打って出ましょう。
  event_goddessfall2_02_s_16:
    speaker: johan
    en: How many clones remain?
    ko: 분신은 얼마나 남았지?
    ja: 分身はどれだけ残っている？
  event_goddessfall2_02_s_17:
    speaker: nayuta
    en: Verily, those who survived the recent defensive battle number 1,180.
    ko: 좀 전의 방위전에서 살아남은 건, 1180인이외다.
    ja: 防衛戦を生き残ったのは、1000と180。
  event_goddessfall2_02_s_18:
    speaker: johan
    en: "... This is doable."
    ko: "…해볼 만하군."
    ja: "…試す価値はあるな。"
  event_goddessfall2_02_s_19:
    speaker: johan
    en: Indivilia and Chatterbox can be countered by Inherit, Pioneer, and White Knight.
    ko: 인디빌리아와 토커티브는 인헤르트, 파이오니아, 바이스리터로 대처 가능하다.
    ja: |-
      インディビリアとトーカティブは
      インヘルト、パイオニア、ヴァイスリッターで
      対処できる。
  event_goddessfall2_02_s_20:
    speaker: nayuta
    en: Verily, should our special forces confront theirs, and the lesser foes be
      entrusted unto mine replicas.
    ko: 그렇소. 저쪽의 특수 병력은 이쪽의 특수 병력으로 맞서고, 나머지 잡졸전은 소인들에게 맡긴다면.
    ja: |-
      そうですねぇ。特殊戦力同士をぶつけて、
      残りの掃討を私が引き受ければ…
  event_goddessfall2_02_s_21:
    speaker: nayuta
    en: "... Thus shall we reach the place where the Queen abideth."
    ko: "…퀸이 있는 곳에 당도할 수 있소."
    ja: "…クイーンの足下まではたどり着けるでしょう。"
  event_goddessfall2_02_s_22:
    speaker: "<Narration>"
    en: "*Bang!* *Boom!*"
    ko: 쾅! 콰앙!
    ja: バン！ドカン！
  event_goddessfall2_02_s_23:
    speaker: nayuta
    en: The problem, verily, lieth in how shall we draw the Queen within our grasp...
    ko: 문제는, 퀸을 어떻게 우리의 손이 닿는 곳까지 끌어내리느냐 일터….
    ja: |-
      問題は、クイーンをいかにして
      引きずり下ろすか…
  event_goddessfall2_02_s_24:
    speaker: nayuta
    en: Are the chains by which we erstwhile dragged down the White Giant no longer
      serviceable?
    ko: 일전에 거경을 끌어내린 사슬들은 사용 불가능하오?
    ja: 以前、大クジラを引きずり下ろしたという鎖は？
  event_goddessfall2_02_s_25:
    speaker: johan
    en: She's out of range. No doubt she accounted for that when choosing her drop
      point.
    ko: |-
      사거리가 나오지 않는다.
      분명 그것까지 염두에 두고 강하 포인트를 잡은 거겠지.
    ja: |-
      射程が足りない。
      おそらくそこまで計算の上で
      降下地点を決めているのだろう。
  event_goddessfall2_02_s_26:
    speaker: nayuta
    en: "... So it is, she is afeard—"
    ko: "…역시, 겁 먹은 게 확실하"
    ja: "…これは本当に、怯えているのやも――"
  event_goddessfall2_02_s_27:
    speaker: "<Narration>"
    en: "*Bang!* *Boom!*"
    ko: 쾅! 콰앙!
    ja: バン！ドカン！
  event_goddessfall2_02_s_28:
    speaker: nayuta
    en: She doth fire most vigorously, verily.
    ko: 것 참 어지간히도 쏴대는군.
    ja: それにしても、キリがありませんねぇ。
  event_goddessfall2_02_s_29:
    speaker: nayuta
    en: When shall Young Lady Isabel return from her scouting?
    ko: 탐색을 나간 이사벨 소저는 언제 돌아오오.
    ja: 偵察に出たイサベルはまだ？
  event_goddessfall2_02_s_30:
    speaker: johan
    en: She will be back soon.
    ko: 곧 돌아올 거다.
    ja: もうすぐ戻るはずだ。
  event_goddessfall2_02_s_31:
    speaker: cecil_op_r
    en: Isabel is falling your way.
    ko: 이사벨. 그쪽으로 추락합니다.
    ja: イサベルがそちらに墜落します。
  event_goddessfall2_02_s_32:
    speaker: nayuta
    en: "... What sayest thou?"
    ko: "…뭐요?"
    ja: "…なんと？"
  event_goddessfall2_02_s_33:
    speaker: "<Narration>"
    en: "*Whoooosh*"
    ko: 슈우우우---
    ja: ヒュウ――
  event_goddessfall2_02_s_34:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 콰앙-!!
    ja: ドカン！！
  event_goddessfall2_02_s_35:
    speaker: "<Narration>"
    en: Isabel plummets onto the runway with a loud crash.
    ko: 이사벨이 요란한 소리를 내며 활주로에 추락했다.
    ja: イサベルが轟音とともに開けた滑走路へ落ちた
  event_goddessfall2_02_s_36:
    speaker: isabel
    en: Ugh...! Comman... der...!
    ko: 크윽…! 지휘… 관…!
    ja: ううっ…！指揮…官…！
  event_goddessfall2_02_s_37:
    speaker: johan
    en: How bad is the damage?
    ko: 파손 정도는?
    ja: 負傷レベルは？
  event_goddessfall2_02_s_38:
    speaker: isabel
    en: I'm... fine. Just lost two feathers.
    ko: |-
      괜찮… 아요.
      페더 2개가 당했을 뿐이니까.
    ja: |-
      大したことは…ありません。
      フェザーを2機損失しただけです。
  event_goddessfall2_02_s_39:
    speaker: "<Narration>"
    en: Isabel struggles to get up.
    ko: 이사벨이 힘겹게 몸을 일으킨다.
    ja: イサベルが息も絶え絶えの様子で体を起こした
  event_goddessfall2_02_s_40:
    speaker: isabel
    en: Whew...
    ko: "…후우."
    ja: "…ふぅ…"
  event_goddessfall2_02_s_41:
    speaker: johan
    en: Did you get hit by the beam?
    ko: 지금 뿌려대고 있는 빔에 당한 건가?
    ja: このビームにやられたのか？
  event_goddessfall2_02_s_42:
    speaker: isabel
    en: "... No."
    ko: "…아뇨."
    ja: "…いいえ。"
  event_goddessfall2_02_s_43:
    speaker: "<Narration>"
    en: 10 minutes ago.
    ko: 10분 전.
    ja: 10分前
  event_goddessfall2_02_s_44:
    speaker: "<Narration>"
    en: Isabel flies through the air, dodging the Queen's continuous stream of beams.
    ko: 이사벨은 퀸의 뿌려대고 있는 빔을 회피하며 공중을 날고 있었다.
    ja: |-
      イサベルはビームの雨をかわしながら
      空からの偵察を続けていた
  event_goddessfall2_02_s_45:
    speaker: "<Narration>"
    en: There are many of them, but their trajectory and timing are consistent.
    ko: 빔의 수는 많지만 사선과 타이밍이 일정하다.
    ja: |-
      ビームは数こそ多いが、
      射線や発射タイミングは一定している
  event_goddessfall2_02_s_46:
    speaker: isabel
    en: "... These are just to keep us in check."
    ko: "…견제용 그 이상도 이하도 아니야."
    ja: |-
      …ただの牽制射撃、
      それ以上でも以下でもない…
  event_goddessfall2_02_s_47:
    speaker: isabel
    en: The problem is...
    ko: 문제는….
    ja: 問題は…
  event_goddessfall2_02_s_48:
    speaker: "<Narration>"
    en: Isabel rolls to evade another beam.
    ko: 이사벨이 롤링하며 빔을 회피한다.
    ja: イサベルは身体を回転させ、ビームを避け…
  event_goddessfall2_02_s_49:
    speaker: "<Narration>"
    en: Far ahead, the Queen looms in the distance.
    ko: 저 멀리 퀸의 모습이 보인다.
    ja: 遠方にクイーンの姿をとらえた
  event_goddessfall2_02_s_50:
    speaker: "<Narration>"
    en: Below her, Raptures press in tight, shoulder to shoulder.
    ko: 그리고 그 아래, 빽빽이 들어선 랩쳐들의 모습이 보인다.
    ja: その下にラプチャーの群れがひしめいている
  event_goddessfall2_02_s_51:
    speaker: "<Narration>"
    en: And still they come, pouring in ceaselessly from the distant edges of the
      battlefield.
    ko: 랩쳐들은 쉴 틈 없이 저 너머에서 다가와 합류한다.
    ja: |-
      ラプチャーは続々と集結し、
      数を増やし続けていた
  event_goddessfall2_02_s_52:
    speaker: isabel
    en: "... There're just too many."
    ko: "…너무 많아."
    ja: "…多すぎる…"
  event_goddessfall2_02_s_53:
    speaker: "<Narration>"
    en: Isabel looks to the Queen once more.
    ko: 이사벨은 다시 퀸을 바라본다.
    ja: イサベルは、再びクイーンを見すえた
  event_goddessfall2_02_s_54:
    speaker: "<Narration>"
    en: Dozens of thick cables snake from her body, trailing upward and vanishing
      into the clouds above.
    ko: 퀸의 몸에서 뻗어 나와 구름과 이어진 수많은 전선.
    ja: |-
      クイーンの本体とおぼしき物から
      大量のケーブルらしき線が伸び、
      その先は雲に隠されている
  event_goddessfall2_02_s_55:
    speaker: "<Narration>"
    en: Curiosity grips her—she wants to know what those wires are connected to.
    ko: 이사벨은 하늘로 뻗은 저 전선이 무엇과 이어져 있는지 확인하고 싶어졌다.
    ja: |-
      イサベルは雲に隠れた線の先を
      確かめようと高度を上げた
  event_goddessfall2_02_s_56:
    speaker: "<Narration>"
    en: She ascends. Her sensors flare with warnings, her temperature and pressure
      readings in chaos.
    ko: |-
      고도를 높인다.
      온도 센서와 기압 센서가 요동친다.
    ja: |-
      高空の温度と気圧に耐えきれず、
      センサーが悲鳴を上げ始める
  event_goddessfall2_02_s_57:
    speaker: "<Narration>"
    en: But she has time. Just enough.
    ko: 하지만 잠깐이라면 가능하다.
    ja: しかし、一瞬ならば問題ないだろう
  event_goddessfall2_02_s_58:
    speaker: "<Narration>"
    en: Isabel surges upward, breaking through the clouds.
    ko: 이사벨은 구름을 뚫고 솟아올랐다.
    ja: イサベルは雲を突き抜け、一気に飛び上がった
  event_goddessfall2_02_s_59:
    speaker: isabel
    en: "... What's this?"
    ko: "…뭐야 이건."
    ja: "…あれは…何？"
  event_goddessfall2_02_s_60:
    speaker: "<Narration>"
    en: A massive black object is tethered to the Queen by thick, winding cables.
    ko: 퀸의 전선과 이어져 있는 거대한 검은 무언가.
    ja: |-
      クイーンから伸びた線は
      巨大な黒い物体につながっていた
  event_goddessfall2_02_s_61:
    speaker: "<Narration>"
    en: Its purpose is unclear. It's just a dark, hulking mass with no discernible
      form.
    ko: |-
      무엇인지 파악할 수 없다.
      그건 그저 검은 덩어리 그 이상도 이하도 아니었다.
    ja: |-
      その正体は判然とせず、
      目視ではただ黒い塊としか捉えられない
  event_goddessfall2_02_s_62:
    speaker: "<Narration>"
    en: From two open cavities, smoke curls upward, lit by bursts of erratic sparks.
    ko: 뚫려있는 거대한 두 개의 구멍에서는 스파크와 연기가 뿜어져 나왔다.
    ja: |-
      だが、巨大な2つの穴が
      火花を散らし、煙を吹き出していた
  event_goddessfall2_02_s_63:
    speaker: isabel
    en: "... Are those from Eden's Spear and Marian Cannon...?"
    ko: "…에덴의 창과 마리안 캐논에 당한 흔적… 인가?"
    ja: "…エデンの槍とマリアン砲の跡…？"
  event_goddessfall2_02_s_64:
    speaker: isabel
    en: Then this must be...
    ko: 그렇다면 이건….
    ja: それなら、これは…
  event_goddessfall2_02_s_65:
    speaker: "<Narration>"
    en: The black mass opens its eyes,
    ko: 검은 덩어리가 눈을 떴다.
    ja: 黒い塊が目を開いた
  event_goddessfall2_02_s_66:
    speaker: "<Narration>"
    en: or at least, that's how it feels to Isabel.
    ko: 적어도 이사벨은 그렇게 느꼈다.
    ja: 少なくとも、イサベルにはそう感じられた
  event_goddessfall2_02_s_67:
    speaker: "<Narration>"
    en: Dozens of glowing red cores reveal themselves across its surface.
    ko: 검은 덩어리에서 수많은 붉은색의 코어가 드러났다.
    ja: それは露出した大量のコアの赤色だった
  event_goddessfall2_02_s_68:
    speaker: "<Narration>"
    en: Instinct takes over. She whips her body around
    ko: 이사벨은 본능적으로 몸을 돌렸다.
    ja: イサベルは本能的に体をひるがえした
  event_goddessfall2_02_s_69:
    speaker: "<Narration>"
    en: just as the cores begin to fire in unison.
    ko: 붉은색의 코어들이 일제히 이사벨을 향해 빔을 뿜어내기 시작했다.
    ja: |-
      赤いコアがイサベルに向かって
      一斉に光を放った
  event_goddessfall2_02_s_70:
    speaker: "<Narration>"
    en: A beam grazes her, instantly melting one of her feathers to vapor.
    ko: 빔이 이사벨의 페더 한 장을 순식간에 녹인다.
    ja: |-
      ビームの嵐に飲まれたイサベルのフェザーが
      瞬く間に溶けた
  event_goddessfall2_02_s_71:
    speaker: isabel
    en: Argh...!
    ko: 크읏…!
    ja: くっ…！
  event_goddessfall2_02_s_72:
    speaker: "<Narration>"
    en: She drops altitude, weaving through the deadly rain of beams.
    ko: 고도를 낮추며 쏟아지는 빔을 회피한다.
    ja: |-
      イサベルは急降下しながら、
      降り注ぐビームをかわし続けた
  event_goddessfall2_02_s_73:
    speaker: "<Narration>"
    en: Heat sensors blare nonstop, but they mean nothing now.
    ko: |-
      열감지 센서가 쉴 틈 없이 경고를 보낸다.
      사실상 의미 없는 수준이다.
    ja: |-
      温度センサーのけたたましい警告が響き続ける。
      もはや測定値には何の意味もない
  event_goddessfall2_02_s_74:
    speaker: "<Narration>"
    en: Reflex takes over. She dodges on instinct alone, accelerating with everything
      she's got.
    ko: 이사벨은 본능에 의존해 회피하며, 전력으로 속도를 올렸다.
    ja: |-
      イサベルは本能を頼りに攻撃を避け、
      限界まで速度を上げた――
  event_goddessfall2_02_s_75:
    speaker: isabel
    en: "... The shape has changed a lot, but that was definitely the space station.
      I'm sure of it."
    ko: "…형태는 많이 바뀌긴 했지만, 그건 분명 스테이션이었어요."
    ja: |-
      …形は面影もありませんでしたが、
      あれはどう考えてもステーションです。
  event_goddessfall2_02_s_76:
    speaker: nayuta
    en: "... Art thou speaking of the orbital forge?"
    ko: "…우주 정거장을 말하는 것이오?"
    ja: "…というと、宇宙ステーションのことですか？"
  event_goddessfall2_02_s_77:
    speaker: isabel
    en: Yes.
    ko: 그래.
    ja: ええ。
  event_goddessfall2_02_s_78:
    speaker: isabel
    en: The Queen is currently linked to it,
    ko: 지금 퀸은 스테이션에 이어져 있는 상태야.
    ja: 宇宙ステーションが要塞に改造されているわ。
  event_goddessfall2_02_s_79:
    speaker: isabel
    en: and the space station's been retrofitted as a fortress.
    ko: 그리고 스테이션은 요새로 개조되어 있어.
    ja: クイーンはそれに接続されていたの。
  event_goddessfall2_02_s_80:
    speaker: nayuta
    en: "... She hath descended with the orbital forge still whole..."
    ko: "…궤도를 떠돌던 스테이션 채로 내려온 것이란 말인가."
    ja: |-
      …軌道を漂っていた宇宙ステーションごと
      降りてきた…
  event_goddessfall2_02_s_81:
    speaker: nayuta
    en: and wrought it into a fortress... Verily, such prodigious firepower is thus
      accounted for.
    ko: 거기다 요새로 개조라… 말도 안 되는 출력이 설명되는군.
    ja: |-
      そのうえ要塞化…
      とすれば、不可思議な出力の説明もつく…
  event_goddessfall2_02_s_82:
    speaker: isabel
    en: The fortress looks badly damaged, but it's holding its altitude just fine.
    ko: |-
      요새는 큰 손상을 입은 것 같았지만,
      고도를 유지하는 것에는 이상 없어 보였어.
    ja: |-
      かなりダメージがありそうだけど、
      高度の維持ぐらいは問題なくできるようね。
  event_goddessfall2_02_s_83:
    speaker: isabel
    en: It's packed with multiple automated interception weapons.
    ko: 그리고 자동 요격 무장들을 다수 탑재 중이야.
    ja: それから、大量の迎撃兵器を確認したわ。
  event_goddessfall2_02_s_84:
    speaker: isabel
    en: The moment I got too close, it started firing beams.
    ko: 일정 거리 안으로 접근하니 빔이 날아왔어.
    ja: |-
      たぶん、一定距離まで近づくと起動する
      自律兵器ね。
  event_goddessfall2_02_s_85:
    speaker: isabel
    en: I managed to dodge and pull back, but there's no way I can take it on alone.
    ko: |-
      어떻게든 피하면서 퇴각했지만,
      단신으로 돌입할 수는 없는 수준이야.
    ja: |-
      どうにか逃げてきたけど、
      あんなものがあったら単独での接近は無理よ。
  event_goddessfall2_02_s_86:
    speaker: isabel
    en: I'm not sure how far those weapons reach, but they can easily hit the surface.
    ko: |-
      사거리가 어디까지인지는 잘 모르지만,
      지상까지는 가볍게 닿아.
    ja: |-
      射程距離は分からなかったけど、
      地上までは余裕をもって届くでしょうね。
  event_goddessfall2_02_s_87:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_88:
    speaker: johan
    en: This is vexing.
    ko: 답답하군.
    ja: 隙が無いな。
  event_goddessfall2_02_s_89:
    speaker: nayuta
    en: Verily, she doth pursue naught but the safest course.
    ko: 그렇소. 저쪽은 최대한 안전한 방법만을 취하고 있소.
    ja: |-
      まったくです…ひたすら安全策を
      選んでいる様子。
  event_goddessfall2_02_s_90:
    speaker: nayuta
    en: Should the Queen unleash her full force, or any other stratagem of aggression,
      perchance we might catch her unawares.
    ko: 퀸이 물량전을 걸든 뭘 하든 적극적인 공세를 퍼붓는다면 허를 찌를 수 있을 터인데.
    ja: |-
      物量を頼みに押して来るか、
      積極的な攻めの動きを見せてくるなら、
      つけ入りようもありますが…
  event_goddessfall2_02_s_91:
    speaker: nayuta
    en: Yet she maketh full use of her advantage, restraining herself all the same.
      Most vexing, verily.
    ko: 자신들이 유리하다는 것을 적극 활용하고 있으니 답답하기 짝이 없소이다.
    ja: |-
      向こうは己の有利を存分に活用している。
      盤石の構えです。
  event_goddessfall2_02_s_92:
    speaker: nayuta
    en: Should we allow this affair to linger, defeat shall befall us. She shall continue
      her convalescence and gather Raptures, whilst we...
    ko: |-
      시간을 끌면 우리는 반드시 패배하오.
      저쪽은 회복하면서 랩쳐들을 끌어모을 테지만, 우리는….
    ja: |-
      長引かせれば勝ち目はありません。
      あちらは回復し、ラプチャーも押し寄せる。
      私たちは…
  event_goddessfall2_02_s_93:
    speaker: nayuta
    en: "... must needs bring this matter to a close with all haste..."
    ko: "…어떻게든 단기간에 승부를 내지 않으면…."
    ja: "…どうにか、短期決戦の手を打たねば…"
  event_goddessfall2_02_s_94:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_95:
    speaker: johan
    en: "... Monk."
    ko: "…승려."
    ja: "…仙人。"
  event_goddessfall2_02_s_96:
    speaker: johan
    en: Are all your clones sentient?
    ko: 네놈의 분신들은 모두 인격체인가.
    ja: お前の分身とやらに、人格はあるのか？
  event_goddessfall2_02_s_97:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_98:
    speaker: johan
    en: Enough. Say no more.
    ko: 됐다. 더 말할 필요 없다.
    ja: いや、それ以上の答えは不要だ。
  event_goddessfall2_02_s_99:
    speaker: johan
    en: Everyone, gather.
    ko: 다들 모인다.
    ja: 全員揃っているな。
  event_goddessfall2_02_s_100:
    speaker: johan
    en: 'Here is the current situation:'
    ko: 현재 상황을 정리하겠다.
    ja: 現在の状況を整理する。
  event_goddessfall2_02_s_101:
    speaker: johan
    en: Part of the space station is confirmed to be linked to the Queen.
    ko: 스페이스 스테이션의 일부가 퀸과 연결되어 있는 것을 확인했다.
    ja: |-
      クイーンは宇宙ステーションと
      接続されていることが確認された。
  event_goddessfall2_02_s_102:
    speaker: johan
    en: It is concealed above the clouds and has been remodeled into a fortress.
    ko: 스테이션은 현재 구름 위에 가려져 있고, 요새로 개조되어 있는 상태다.
    ja: |-
      今は雲に隠れて目視できないが、
      要塞化されている。
  event_goddessfall2_02_s_103:
    speaker: johan
    en: Any attempt to approach is met with automated interception fire.
    ko: 스테이션의 자동 요격 무장으로 인해, 근처에 접근할 시 빔에 요격된다.
    ja: |-
      迎撃能力も有し、偵察したイサベルが
      ビーム砲群の攻撃を受けた。
  event_goddessfall2_02_s_104:
    speaker: johan
    en: Its range easily reaches the surface, though not Eden.
    ko: |-
      그 사거리는 지상까지 거뜬히 닿을 정도지만,
      에덴까지 닿지는 못하는 것으로 추정된다.
    ja: |-
      迎撃兵器に関しては
      射程距離は地上まで及ぶものの、
      エデンは射程外と思われる。
  event_goddessfall2_02_s_105:
    speaker: johan
    en: The Queen has fortified her position to block all access while she gathers
      Raptures.
    ko: 즉, 현재 퀸은 우리가 절대 접근할 수 없도록 방어를 견고히 한 상태로, 랩쳐들을 모으고 있는 상태다.
    ja: |-
      現在のところ、クイーンは
      我々が接近できないよう徹底して防御を固め、
      ラプチャーを集結させている。
  event_goddessfall2_02_s_106:
    speaker: johan
    en: Once she deems their numbers sufficient, she will launch her offensive.
    ko: 퀸이 만족할 만큼 랩쳐를 모으면, 공세를 시작하겠지.
    ja: |-
      絶対の戦力差が生まれるまで
      ラプチャーを集め、
      その後に攻撃を開始するつもりだろう。
  event_goddessfall2_02_s_107:
    speaker: johan
    en: Furthermore, as you all know—
    ko: 추가로, 모두 알고 있겠지만.
    ja: さらに、全員分かっていると思うが…
  event_goddessfall2_02_s_108:
    speaker: "<Narration>"
    en: "*Bang!* *Boom!*"
    ko: 쾅! 콰앙!
    ja: バン！ドカーン！
  event_goddessfall2_02_s_109:
    speaker: johan
    en: "... she has been firing long-range beams repeatedly, making it impossible
      to leave the Monk's shield."
    ko: "…이딴 식으로 장거리에서 빔을 연사해 성녀가 쳐놓은 실드 바깥으로 함부로 나갈 수도 없게 만들어놓은 상태다."
    ja: |-
      …この通り、遠距離からの射撃によって
      シールドの外にはうかつに出られない。
  event_goddessfall2_02_s_110:
    speaker: johan
    en: We are trapped. We cannot advance.
    ko: 우리는 가둬져 있는 상태고, 전진할 수 없다.
    ja: |-
      こちらは身動きが取れず、
      前に進むことも出来ない状態だ。
  event_goddessfall2_02_s_111:
    speaker: johan
    en: The Queen is simultaneously recovering and accumulating Raptures.
    ko: 퀸은 랩쳐를 모음과 동시에 회복하고 있다.
    ja: |-
      一方のクイーンはラプチャーを
      集結させると同時に、
      自己修復を進めているだろう。
  event_goddessfall2_02_s_112:
    speaker: johan
    en: The longer this continues, the slimmer our chances of survival.
    ko: 시간이 지나면 지날수록 우리 승산은 희박해진다.
    ja: 時間が経つほど、私たちの勝算は薄くなる。
  event_goddessfall2_02_s_113:
    speaker: johan
    en: Eden's Spear will be ready in three hours.
    ko: 에덴의 창은 사용하기까지 3시간은 걸린다.
    ja: エデンの槍の再使用には3時間必要だ。
  event_goddessfall2_02_s_114:
    speaker: johan
    en: I don't expect the Queen will give us that long.
    ko: 그때까지 퀸이 기다려 줄 것 같진 않군.
    ja: |-
      それまでクイーンが
      大人しくしているとも考え難い。
  event_goddessfall2_02_s_115:
    speaker: papillon
    en: Then... what should we do?
    ko: 그럼… 어떻게 해?
    ja: じゃあ…どうするの？
  event_goddessfall2_02_s_116:
    speaker: papillon
    en: Sh-shouldn't we retreat?
    ko: 후, 후퇴해야 하는 것 아냐?
    ja: もう、さっさと逃げた方がいいんじゃない？
  event_goddessfall2_02_s_117:
    speaker: johan
    en: That's one of the options.
    ko: 선택지 중 하나다.
    ja: それも選択肢のうちだ。
  event_goddessfall2_02_s_118:
    speaker: crown
    en: Retreat does not exist in my vocabulary.
    ko: 제 사전에 후퇴는 없습니다.
    ja: 私の辞書に後退の二文字はありません。
  event_goddessfall2_02_s_119:
    speaker: chime
    en: Aye! We may turn about and march onward, but retreat? 'Tis naught that I know!
    ko: 맞습니다요. 뒤로 돌아서 전진할 수는 있어도 후퇴는 없습죠.
    ja: |-
      おっしゃる通りでございます。
      後ろを向いて前進することはあっても、
      後退などありえません！
  event_goddessfall2_02_s_120:
    speaker: kilo
    en: Isn't that retreat...?
    ko: 그게 그 말 아닌가요.
    ja: それを後退って言うんじゃ…？
  event_goddessfall2_02_s_121:
    speaker: snowwhite
    en: If we fall back now, who knows when we'll get another chance at the Queen?
    ko: 지금 물러서면 언제 또 기회가 올지 모른다.
    ja: |-
      ここで引き下がれば、
      次の機会があるかも分からない。
  event_goddessfall2_02_s_122:
    speaker: snowwhite
    en: Meanwhile, her forces will only grow stronger.
    ko: 그리고 그 사이, 퀸의 세력은 더욱 강해져있겠지.
    ja: 時が経てば、クイーンの戦力は強化される。
  event_goddessfall2_02_s_123:
    speaker: hongryeon
    en: Yet now doth she suffer us not to draw nigh.
    ko: 허나 지금은 접근마저 허락하지 않는 상황일세.
    ja: しかし、近づくことさえ出来ぬのであろう？
  event_goddessfall2_02_s_124:
    speaker: hongryeon
    en: Upon the ground lie Raptures and Heretics. In the heavens abide the Queen
      and the Station.
    ko: |-
      지상에는 랩쳐와 헬레틱.
      하늘에는 퀸과 스테이션이 있네.
    ja: |-
      地にはラプチャーとヘレティック、
      空にはクイーンと要塞と来られては…
  event_goddessfall2_02_s_125:
    speaker: isabel
    en: An aerial approach is out of the question.
    ko: 공중으로의 접근도 불가능해.
    ja: 空からの接近も不可能ね。
  event_goddessfall2_02_s_126:
    speaker: isabel
    en: There are too many interception weapons, and they're all far too precise.
      Not even I could dodge them.
    ko: |-
      자동 요격 무장의 수가 너무 많고 정밀도가 높아.
      나도 피할 수 없어.
    ja: |-
      迎撃兵器の数が多すぎるし、
      精度も高かったわ。
      私でも避けきるのが難しかったもの。
  event_goddessfall2_02_s_127:
    speaker: isabel
    en: Over five Storm Bringers have been spotted. Approaching in a transport ship
      would be suicide.
    ko: |-
      스톰 브링어도 다섯 기 이상 확인돼.
      수송기로 접근하는 건 자살 행위야.
    ja: |-
      ストームブリンガーも
      5機以上確認されているし、
      輸送機での接近は自殺も同然よ。
  event_goddessfall2_02_s_128:
    speaker: harran
    en: Johan, it seems we have no means left at our disposal.
    ko: 요한아. 우리가 쓸 수 있는 수단이 없구나.
    ja: 打つ手がないようね、ヨハン。
  event_goddessfall2_02_s_129:
    speaker: harran
    en: What do you intend to do, my Commander?
    ko: 어떻게 할 생각이니? 나의 지휘관아.
    ja: それで、どうするつもり？私たちの指揮官は。
  event_goddessfall2_02_s_130:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_131:
    speaker: marian_q
    en: I'll take the lead.
    ko: 제가 선봉에 설게요.
    ja: 私が先頭に立ちます。
  event_goddessfall2_02_s_132:
    speaker: marian_q
    en: I can withstand all of the Queen's attacks.
    ko: 퀸의 공격은 제가 다 받아낼 수 있어요.
    ja: |-
      クイーンの攻撃は
      すべて受け止められるはずです。
  event_goddessfall2_02_s_133:
    speaker: marian_q
    en: You can form up around me and advance slowly...
    ko: |-
      저를 중심으로 진형을 갖추고,
      서서히 접근하면….
    ja: |-
      私が盾になる形で隊列を組んで、
      着実に近づいていけば…
  event_goddessfall2_02_s_134:
    speaker: nayuta
    en: Yet do Heretics and Raptures abide, and thou alone, Young Lady Marian, canst
      not withstand the multitude of those automated interception armaments.
    ko: |-
      헬레틱과 랩쳐들이 있소.
      그리고 그 많은 자동 요격 무장을 마리안 소저 혼자서 감당할 수 없소.
    ja: |-
      ヘレティックやラプチャーが
      それを許さないでしょうねぇ。
      単独で要塞の攻撃を抑えきれるかどうかも…
  event_goddessfall2_02_s_135:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_136:
    speaker: nayuta
    en: Take heed of thy safety, Young Lady Marian. Should all go awry, thou alone
      must survive.
    ko: |-
      마리안 소저는 몸을 최대한 온전히 유지해 주시오.
      만약 일이 잘못되어도, 소저만은 살아야 하오.
    ja: |-
      マリアン、あなたはできる限り
      力を温存してください。何が起こるとしても、
      あなたには生きてもらう必要があります。
  event_goddessfall2_02_s_137:
    speaker: marian_q
    en: There's no way I could...!
    ko: 그럴 수는…!
    ja: そういうわけには…！
  event_goddessfall2_02_s_138:
    speaker: johan
    en: We are abandoning Eden.
    ko: 에덴을 버린다.
    ja: エデンを捨てる。
  event_goddessfall2_02_s_139:
    speaker: marian_q
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall2_02_s_140:
    speaker: papillon
    en: So... we're retreating?
    ko: 퇴각… 한다는 얘기야?
    ja: ここから…逃げるってこと？
  event_goddessfall2_02_s_141:
    speaker: papillon
    en: Y-yeah, that's a good idea. No matter how important this place is, when it's
      time to retreat, you retreat...
    ko: |-
      그, 그래. 잘 생각했어.
      아무리 중요해도 물러설 때는 물러서는 게….
    ja: |-
      そ、そうね。立派な決断よ。
      いくらチャンスでも、退く時は退かないと…
  event_goddessfall2_02_s_142:
    speaker: johan
    en: We'll overload Eden's main power source and trigger a self-destruction.
    ko: 에덴의 메인 동력원에 과부하를 걸어 자폭시킨다.
    ja: |-
      エデンの主動力源に
      過負荷を引き起こし、自爆させる。
  event_goddessfall2_02_s_143:
    speaker: johan
    en: Everything within 10 km will be reduced to rubble.
    ko: 10km는 쑥대밭으로 만들 수 있지.
    ja: |-
      半径10キロメートルは
      焼け野原にできるだろう。
  event_goddessfall2_02_s_144:
    speaker: johan
    en: We'll lure them in as close as possible, and then detonate.
    ko: 놈들을 최대한 끌어들인 다음, 자폭한다.
    ja: そのために奴らを最大限引きつける。
  event_goddessfall2_02_s_145:
    speaker: johan
    en: Then we'll leave the rest up to him.
    ko: 그리고 뒷일은 그 녀석에게 맡긴다.
    ja: 後のことは、あいつに託そう。
  event_goddessfall2_02_s_146:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_147:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_148:
    speaker: isabel
    en: It seems that's the only way for now.
    ko: 지금으로서는 그 방법밖에 없는 거군요.
    ja: それ以上の方法は思いつきません。
  event_goddessfall2_02_s_149:
    speaker: harran
    en: Hmph, even a mere scratch would please me.
    ko: 뭐, 좋다. 생채기라도 낼 수 있으면 좋겠구나.
    ja: |-
      ええ…そうね。
      かすり傷ぐらいはつけておきたいわ。
  event_goddessfall2_02_s_150:
    speaker: papillon
    en: What... are you talking about? You want to lure them in and self-destruct?
    ko: |-
      무슨… 소리야.
      최대한 끌어당긴 다음 자폭이라니.
    ja: |-
      な…何言ってんのよ。
      なるべく引きつけてから自爆する？
  event_goddessfall2_02_s_151:
    speaker: papillon
    en: Wh-who's supposed to do the luring? And what happens to the poor soul who
      actually does it?
    ko: |-
      누, 누가 끌어당길 건데.
      그리고 끌어당긴 사람은 어떻게 되는 거야?
    ja: |-
      そ、そんなこと誰がやるの？
      引き寄せて、その人はどうするのよ？
  event_goddessfall2_02_s_152:
    speaker: johan
    en: "... Inherit will lure them in. Feigning the launch of Eden's Spear is an
      option."
    ko: |-
      …인헤르트가 끌어당긴다.
      에덴의 창을 발사할 것처럼 구는 것도 한 방법이다.
    ja: |-
      …インヘルトが引き付ける。
      エデンの槍の発射を偽装することも
      視野に入れておく。
  event_goddessfall2_02_s_153:
    speaker: johan
    en: The rest, withdraw at once.
    ko: 나머지는 현 시간부로 모두 퇴각해라.
    ja: |-
      それ以外の全員は、
      現時刻をもってただちに離脱してくれ。
  event_goddessfall2_02_s_154:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_155:
    speaker: papillon
    en: I'll go. Nayuta, can I borrow that insanely fast camel of yours?
    ko: |-
      내가 갈게.
      그 엄청 빠른 낙타 있지? 그거, 그거 좀 빌려줘.
    ja: |-
      私にアイデアがあるわ。
      すっごく速いラクダがいたでしょ？
      あれ、貸してよ。
  event_goddessfall2_02_s_156:
    speaker: papillon
    en: I'll go ask the Ark for support.
    ko: 내가 가서, 방주한테 지원을 요청할게.
    ja: 私がアークに支援を要請してくるから。
  event_goddessfall2_02_s_157:
    speaker: papillon
    en: Sounds way better than blowing ourselves up, don't you think?
    ko: 그게 더 낫잖아? 자폭이라니 멋없게 무슨 짓이야.
    ja: |-
      その方がいいんじゃない？
      自爆して終わりなんて、みじめすぎるでしょ。
  event_goddessfall2_02_s_158:
    speaker: johan
    en: We don't need the Ark's help.
    ko: 방주의 도움은 필요 없다.
    ja: アークの手は借りない。
  event_goddessfall2_02_s_159:
    speaker: papillon
    en: What nonsense is that when we're about to die?! We have to survive first!
    ko: 죽게 생긴 마당에 무슨 헛소리야. 살고 봐야지.
    ja: |-
      死んじゃうのよ？
      意地を張ってる場合じゃないわ。
  event_goddessfall2_02_s_160:
    speaker: johan
    en: There are things more important than mere survival.
    ko: 살고 보는 것보다 더 중요한 게 있을 수 있는 법이다.
    ja: ただ生きるより、大切なことがある。
  event_goddessfall2_02_s_161:
    speaker: papillon
    en: Would you cut it out with that crazy talk? What could possibly matter more
      than staying alive?
    ko: |-
      미친 소리 좀 작작 해.
      사는 것보다 중요한 게 어딨어?
    ja: |-
      いい加減にしてよ。
      命より大事なものなんてある？
  event_goddessfall2_02_s_162:
    speaker: johan
    en: There is.
    ko: 있다.
    ja: ある。
  event_goddessfall2_02_s_163:
    speaker: papillon
    en: There's no way something like that exists...!
    ko: 그딴 게 이 세상에 있을 리가 없…!
    ja: そんなの、この世の中のどこに…！
  event_goddessfall2_02_s_164:
    speaker: nayuta
    en: Young Hero Johan,
    ko: 요한 소협.
    ja: ヨハン。
  event_goddessfall2_02_s_165:
    speaker: nayuta
    en: there remains another course.
    ko: 방도가 하나 더 있지 않소.
    ja: もう1つ考えている方法があるでしょう。
  event_goddessfall2_02_s_166:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_s_167:
    speaker: johan
    en: That is not an option.
    ko: 그건 선택지에 없다.
    ja: それは選択肢に入れていない。
  event_goddessfall2_02_s_168:
    speaker: nayuta
    en: This humble one knows not how often these words have been spoken unto thee,
      Young Hero Johan, yet once more shall they be uttered.
    ko: 소인. 벌써 요한 소협에게 이 말을 몇 번이나 하는지 모르겠소만 또 한 번 하겠소.
    ja: |-
      いいえ。すでに何度この言葉をお聞かせしたか
      覚えていませんが、
      もう一度言わせていただきます。
  event_goddessfall2_02_s_169:
    speaker: nayuta
    en: I... nay,
    ko: 소인은, 아니.
    ja: 私は、いや…
  event_goddessfall2_02_s_170:
    speaker: nayuta
    en: we...
    ko: "[소인들]은."
    ja: "「私たち」は…"
  event_goddessfall2_02_s_171:
    speaker: nayuta
    en: shall do whatsoever is needed to prevail.
    ko: 이기기 위해서라면 무슨 짓이든 할 것이외다.
    ja: 勝つためなら手段は選ばぬ覚悟だと。
event_goddessfall2_02_e:
  event_goddessfall2_02_e_1:
    speaker: "<Narration>"
    en: A monk dashes forward, staff gripped tightly in hand.
    ko: 지팡이를 든 승려가 달린다.
    ja: 杖を持ったナユタが飛び出した
  event_goddessfall2_02_e_2:
    speaker: "<Narration>"
    en: Dodging the crimson light pouring from above and ahead, she swings her staff
      at the Rapture before her.
    ko: |-
      정면과 위에서 쏟아지는 붉은 빛을 피하며,
      눈앞의 랩쳐에게 지팡이를 휘두른다.
    ja: |-
      正面からも上からも降り注ぐ赤い光をかわし、
      目の前のラプチャーに杖を打ち付けた
  event_goddessfall2_02_e_3:
    speaker: "<Narration>"
    en: The Rapture's armor shatters, revealing the core beneath. Without pause, she
      drives the staff deep into it.
    ko: 랩쳐의 장갑이 부서지며 드러난 코어에 지팡이를 찔러넣는다.
    ja: |-
      ラプチャーの装甲が砕け、
      むき出しになったコアを杖が貫いた
  event_goddessfall2_02_e_4:
    speaker: "<Narration>"
    en: Even as another Rapture lunges from the side, her eyes snap toward it. The
      staff follows, arcing in a swift, practiced strike.
    ko: 옆에서 덤벼드는 랩쳐에게로 시선을 돌림과 동시에 지팡이를 휘두른다.
    ja: |-
      すかさず側面から襲いかかってきた
      ラプチャーに視線を向け、杖を振り下ろし…
  event_goddessfall2_02_e_5:
    speaker: "<Narration>"
    en: The crimson light engulfs her upper body, melting it away without a trace.
    ko: 승려의 상반신이 붉은빛에 흔적도 없이 녹는다.
    ja: 上半身が赤い光に跡形もなく溶かされた
  event_goddessfall2_02_e_6:
    speaker: "<Narration>"
    en: Blue flames bloom across what remains of her, leaving behind only a shimmer
      of golden particles.
    ko: 승려의 몸이 푸르게 타오르며 사라지고 금색 입자만을 남긴다.
    ja: |-
      溶け残りの身体が青い火に焼かれて消滅し、
      金色の粒子がその場に浮かび上がった
  event_goddessfall2_02_e_7:
    speaker: "<Narration>"
    en: The golden particles scatter like dust in the wind, drifting far before entering
      the monk, who is seated calmly in meditation.
    ko: |-
      금색 입자는 바람에 흩날리듯 날아가,
      멀리 정좌를 트고 앉은 승려에게 들어간다.
    ja: |-
      粒子は風に吹かれるように漂い、
      彼方で座禅を組むナユタのもとへたどり着いた
  event_goddessfall2_02_e_8:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_e_9:
    speaker: "<Narration>"
    en: Memories begin to flow in.
    ko: "[기억]이 흘러 들어온다."
    ja: "「記憶」が流れ込んでくる"
  event_goddessfall2_02_e_10:
    speaker: "<Narration>"
    en: That clone once had a herd of deer she cared for.
    ko: "[그 나유타]는 돌보던 사슴 무리가 있었다."
    ja: |-
      「このナユタ」には、
      面倒を見ているシカの群れがいた
  event_goddessfall2_02_e_11:
    speaker: "<Narration>"
    en: She fed them, tended to the fawns, and protected them from predators.
    ko: 먹이를 주고, 새끼를 돌보고, 맹수들의 습격에서 보호했다.
    ja: |-
      エサを与え、子ジカの世話をし、
      猛獣の襲撃から守った
  event_goddessfall2_02_e_12:
    speaker: "<Narration>"
    en: One newborn fawn was in poor health, and she watched over it with utmost care.
    ko: |-
      갓 태어난 새끼는 건강이 좋지 않았다.
      [그 나유타]는 새끼를 정성껏 돌봤다.
    ja: |-
      生まれたばかりの子ジカが病弱で、
      「このナユタ」はずいぶん手間をかけて助けた
  event_goddessfall2_02_e_13:
    speaker: "<Narration>"
    en: The fawn clung to the clone as if she were its mother, and the doe regarded
      her as family.
    ko: |-
      새끼 사슴은 [그 나유타]를 어미처럼 따랐다.
      어미 사슴은 [그 나유타]를 가족처럼 여겼다.
    ja: |-
      子ジカは「このナユタ」になついていた。
      母ジカも「このナユタ」を家族と
      認めていたようだ
  event_goddessfall2_02_e_14:
    speaker: "<Narration>"
    en: The image of the fawn growing up, the longing for the herd, and the searing
      pain when the upper body melted away—all come through in full force.
    ko: 새끼 사슴이 성장한 모습에 대한 상상, 사슴 무리에 대한 그리움, 그리고 상반신이 녹아내릴 때의 고통이 온전히 전해졌다.
    ja: |-
      子ジカの成長を心待ちにする気持ち、
      シカたちへの未練、
      そして上半身を溶かされる苦痛
  event_goddessfall2_02_e_15:
    speaker: "<Narration>"
    en: Nayuta erases the memory, leaving only information about the terrain.
    ko: 나유타는 지형의 정보만을 남기고 그 [기억]을 지운다.
    ja: |-
      克明に伝わってくる「記憶」から、
      ナユタは地理情報だけを残し、
      それ以外を消し去った
  event_goddessfall2_02_e_16:
    speaker: "<Narration>"
    en: Like a raging warlord, another monk tears through the horde of Rapture.
    ko: 수라처럼 랩쳐의 무리를 헤집으며 승려가 달린다.
    ja: |-
      修羅の形相をしたナユタが
      ラプチャーの群れを蹴散らしてゆく
  event_goddessfall2_02_e_17:
    speaker: "<Narration>"
    en: Along the path forward, twenty had already fallen, crushed beneath unstoppable
      might.
    ko: |-
      이미 전진하는 길에 스물의 랩쳐를 파괴했다.
      그 육체는 만물을 부술듯한 기세로 휘둘러졌다.
    ja: |-
      すでに20ものラプチャーを打ち砕いている。
      その肉体は万物を打ち砕く勢いだった
  event_goddessfall2_02_e_18:
    speaker: "<Narration>"
    en: Though she lost an arm to the crimson light blazing ahead, she presses on
      without pause.
    ko: 정면의 붉은 빛에 팔 하나를 잃었지만 승려는 멈추지 않는다.
    ja: |-
      正面からの赤い光に腕を1本奪われた。
      それでも彼女は止まらない
  event_goddessfall2_02_e_19:
    speaker: "<Narration>"
    en: Narrowly dodging the fiery beams raining down from above, she loses her footing
      and collapses.
    ko: |-
      하늘에서 내리꽂히는 붉은 빛을 아슬아슬하게 피했지만,
      중심을 잃고 쓰러진다.
    ja: |-
      空から降る赤い光を紙一重でかわしたものの、
      とうとう態勢を崩し、倒れた
  event_goddessfall2_02_e_20:
    speaker: "<Narration>"
    en: A Rapture's leg slams down, crushing her.
    ko: 랩쳐의 다리가 승려를 뭉갠다.
    ja: |-
      その身体はたちまち
      ラプチャーの足に踏みにじられた
  event_goddessfall2_02_e_21:
    speaker: "<Narration>"
    en: Blue flames bloom across what remains of her, leaving behind only a shimmer
      of golden particles.
    ko: 승려의 몸이 푸르게 타오르며 사라지고 금색 입자만을 남긴다.
    ja: |-
      身体が青く燃えあがって消滅し、
      金色の粒子が浮かび上がった
  event_goddessfall2_02_e_22:
    speaker: "<Narration>"
    en: The golden particles scatter like dust in the wind, drifting far before entering
      the monk, who is seated calmly in meditation.
    ko: |-
      금색 입자는 바람에 흩날리듯 날아가,
      멀리 정좌를 트고 앉은 승려에게 들어간다.
    ja: |-
      粒子は風に吹かれるように漂い、
      彼方で座禅を組むナユタのもとへたどり着いた
  event_goddessfall2_02_e_23:
    speaker: "<Narration>"
    en: Memories begin to flow in.
    ko: "[기억]이 흘러 들어온다."
    ja: "「記憶」が流れ込んでくる"
  event_goddessfall2_02_e_24:
    speaker: "<Narration>"
    en: That clone had once met a lost Nikke by chance and taken on the role of guiding
      her north.
    ko: "[그 나유타]는 길잃은 니케와 우연찮게 만나 북부까지 안내하는 역할을 맡은 적이 있었다."
    ja: |-
      「このナユタ」は道に迷ったニケと出会い、
      北部まで案内しようとしたことがあった
  event_goddessfall2_02_e_25:
    speaker: "<Narration>"
    en: A sudden ambush by a swarm of Raptures claimed the Nikke's life, and the clone
      could only curse at her own powerlessness.
    ko: 랩쳐 무리의 습격을 받아 길잃은 니케는 목숨을 잃었고, [그 나유타]는 자신에게 힘이 없음을 한탄했다.
    ja: |-
      ラプチャーの群れに襲撃され、
      迷子だったニケは命を落とし、
      「このナユタ」は己の無力さを嘆いた
  event_goddessfall2_02_e_26:
    speaker: "<Narration>"
    en: She pushed herself through endless training, determined to prevent it from
      ever happening again.
    ko: |-
      수련을 거듭하고 거듭했다.
      다시는 같은 일이 일어나지 않기를 바라며.
    ja: |-
      それからひたすらに修行を重ね、
      同じ悲劇を繰り返さないと誓っていた
  event_goddessfall2_02_e_27:
    speaker: "<Narration>"
    en: Nayuta erases the memory, leaving only information about the martial techniques.
    ko: 나유타는 체술에 대한 정보만을 남기고 그 [기억]을 지운다.
    ja: |-
      ナユタは体術の知識だけを残し、
      その「記憶」を消し去った
  event_goddessfall2_02_e_28:
    speaker: "<Narration>"
    en: A memory of a clone who broke down in tears before the grave of someone whose
      name she never knew.
    ko: 이름 모를 누군가의 무덤 앞에서 이유 없이 오열했던 [어떤 나유타의 기억].
    ja: |-
      名もなき誰かの墓の前で、
      訳もなく泣いた「ナユタ」の記憶
  event_goddessfall2_02_e_29:
    speaker: "<Narration>"
    en: A memory of a clone who lived her entire life consumed by hatred, killing
      Raptures and nothing more.
    ko: 평생을 랩쳐를 죽이기 위한 증오로 살아왔던 [어떤 나유타의 기억].
    ja: |-
      ラプチャーへの憎しみだけを
      生きる支えとしていた「ナユタ」の記憶
  event_goddessfall2_02_e_30:
    speaker: "<Narration>"
    en: A memory of a clone who befriended a scarecrow in a wheat field and promised
      she would return.
    ko: 밀밭의 허수아비와 친구가 되어, 꼭 돌아오겠다 약속했던 [어떤 나유타의 기억].
    ja: |-
      麦畑のカカシと友情を深め、
      必ず戻ると約束した「ナユタ」の記憶
  event_goddessfall2_02_e_31:
    speaker: "<Narration>"
    en: A memory of a clone who built a house by the sea and spent her days staring
      endlessly at the waves.
    ko: 해변가에 집을 짓고 하염없이 파도만 보고 살았던 [어떤 나유타의 기억].
    ja: |-
      海辺に小屋を建て、ぼんやりと波を眺めながら
      過ごしていた「ナユタ」の記憶
  event_goddessfall2_02_e_32:
    speaker: "<Narration>"
    en: All these memories flow into Nayuta,
    ko: 그 모든 기억이 나유타에게로 흘러 들어온다.
    ja: あらゆる記憶がナユタに流れ込んでくる
  event_goddessfall2_02_e_33:
    speaker: "<Narration>"
    en: but she erases all the personal memories of each clone.
    ko: 그리고 나유타는 그 모든 사적인 기억들을 지운다.
    ja: |-
      しかしナユタは、
      個体それぞれの私的な記憶を
      全て消していった
  event_goddessfall2_02_e_34:
    speaker: "<Narration>"
    en: Tears fall.
    ko: 나유타는 눈물을 흘린다.
    ja: 涙を流しながら
  event_goddessfall2_02_e_35:
    speaker: "<Narration>"
    en: She mourns the traces left by those countless clones.
    ko: 그 어떤 나유타들의 삶의 흔적을 [기억]하며 비탄에 빠진다.
    ja: |-
      生きていたという痕跡だけを
      「記憶」に残し、嘆いた
  event_goddessfall2_02_e_36:
    speaker: "<Narration>"
    en: She grieves, knowing she is too small a vessel to hold all their memories.
      So she laments and erases them.
    ko: 그 어떤 나유타들의 모든 기억을 수용할 수 없는 자신의 작은 그릇에 한탄하며 [기억]을 지운다.
    ja: |-
      全ての記憶を受け止めきることができない
      己の器の小ささを悔やみ、
      「記憶」を消していく
  event_goddessfall2_02_e_37:
    speaker: "<Narration>"
    en: And as the tears fall, she watches helplessly
    ko: 나유타는 눈물을 흘리며, 랩쳐의 무리를 향해 달려가고 있는
    ja: |-
      そして涙にぬれた目で、
      ラプチャーの群れに向かって駆けてゆく…
  event_goddessfall2_02_e_38:
    speaker: "<Narration>"
    en: as countless clones—each living their own life, yet so like herself—vanish
      into red light.
    ko: 자신과 너무나도 닮은, 하지만 각자의 삶을 살아온
    ja: |-
      自分と瓜二つの、しかしそれぞれの道を
      歩んできたナユタたちの背中が…
  event_goddessfall2_02_e_39:
    speaker: "<Narration>"
    en: And all the while, they charge toward the horde of Raptures.
    ko: 수많은 나유타들이 붉은빛에 사그라드는 것을 하염없이 바라보고 있었다.
    ja: |-
      赤い光の中に消えていく様子を、
      遠くから見送った
  event_goddessfall2_02_e_40:
    speaker: "<Narration>"
    en: 20 minutes ago.
    ko: 20분 전.
    ja: 20分前
  event_goddessfall2_02_e_41:
    speaker: nayuta
    en: I shall dispatch all my replicas in unison to charge, that they may at once
      contend with the Raptures,
    ko: 소인의 분신들을 일제히 돌격시켜, 랩쳐와 싸움과 동시에.
    ja: |-
      私の分身で総攻撃を仕掛け、
      ラプチャーと戦わせると同時に…
  event_goddessfall2_02_e_42:
    speaker: nayuta
    en: and serve as bulwarks against the Queen's interception arms.
    ko: 퀸의 자동 요격 무장의 방패가 되겠소.
    ja: クイーンの攻撃からの盾にします。
  event_goddessfall2_02_e_43:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_e_44:
    speaker: snowwhite
    en: What do you mean by a shield?
    ko: 방패가 되다니 무슨 뜻이지?
    ja: 盾にするとはどういう意味だ？
  event_goddessfall2_02_e_45:
    speaker: hongryeon
    en: Surely thou art not...
    ko: 설마 자네. 분신들을….
    ja: まさか、分身を…
  event_goddessfall2_02_e_46:
    speaker: nayuta
    en: The muzzles of these automatic armaments number scarcely a thousand.
    ko: 자동 요격 무장의 총구가 1000개는 넘지 않을 것 아니오.
    ja: |-
      迎撃兵器は、あっても
      1000門は越えないでしょう。
  event_goddessfall2_02_e_47:
    speaker: nayuta
    en: Should we draw nigh, my replicas shall serve as...
    ko: 접근해서, 자동 요격 무장의….
    ja: 射程内に飛び込ませ、迎撃兵器に…
  event_goddessfall2_02_e_48:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_e_49:
    speaker: nayuta
    en: the bait.
    ko: 희생양이 되겠소.
    ja: 撃たせます。
  event_goddessfall2_02_e_50:
    speaker: hongryeon
    en: Surely thou meanest not to use thy replicas as naught but cannon fodder?
    ko: 설마 자네, 지금 분신들을 육벽으로 쓰겠다는 이야기인가?
    ja: 使い捨てようというのかい？
  event_goddessfall2_02_e_51:
    speaker: nayuta
    en: Verily so.
    ko: 그렇소.
    ja: いかにも。
  event_goddessfall2_02_e_52:
    speaker: hongryeon
    en: A most reckless deed.
    ko: 미친 짓이네.
    ja: 正気の沙汰とは思えないね。
  event_goddessfall2_02_e_53:
    speaker: snowwhite
    en: A pointless sacrifice. Nothing will come of it.
    ko: 의미 없는 희생이다. 얻을 수 있는 게 없다.
    ja: 意味のない犠牲だ。得られるものがない。
  event_goddessfall2_02_e_54:
    speaker: nayuta
    en: Verily, there is.
    ko: 얻을 것이 있소.
    ja: 得られるものはあります。
  event_goddessfall2_02_e_55:
    speaker: nayuta
    en: Whilst all automated interceptors do assail my replicas,
    ko: 자동 요격 무장이 모두 소인의 분신들을 공격하고 있을 때.
    ja: 迎撃兵器が、分身たちに向けられている間に…
  event_goddessfall2_02_e_56:
    speaker: nayuta
    en: "'tis thy task to lay waste unto the orbital forge."
    ko: 우주 정거장을 격파하는 것이외다.
    ja: 宇宙ステーションを狙える。
  event_goddessfall2_02_e_57:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_e_58:
    speaker: nayuta
    en: Pray, dost thou deem this inhumane?
    ko: 왜. 너무 비인도적이오?
    ja: よもや、人倫にもとるとお考えですか？
  event_goddessfall2_02_e_59:
    speaker: johan
    en: Yes.
    ko: 그래.
    ja: よく分かったな。
  event_goddessfall2_02_e_60:
    speaker: nayuta
    en: Fret not. Mine replicas are wrought from mine NIMPH. Though each hath lived
      its own separate experiences,
    ko: 걱정마시오. 소인의 분신은 소인의 NIMPH를 기반으로 증식해 각자 별도의 경험을 가지고는 있지만.
    ja: |-
      ご心配なく。私のNIMPHから
      増殖させた分身は、それぞれ独自に
      学習をしていきますが…
  event_goddessfall2_02_e_61:
    speaker: nayuta
    en: they lack the refinement to be deemed full-fledged personalities.
    ko: 인격체라 부를 수 있을 정도로 성숙하진 않소이다.
    ja: 人格を持つと言えるほどのものではありません。
  event_goddessfall2_02_e_62:
    speaker: nayuta
    en: Regard them as mere mechanical effigies in mine likeness.
    ko: 단순히 소인의 모습을 한 기계인형이라 보아도 무방하오.
    ja: 単に私の形をした機械と変わりない。
  event_goddessfall2_02_e_63:
    speaker: nayuta
    en: There need be no concern for them.
    ko: 그러니 그렇게 마음 쓸 필요는 없소.
    ja: |-
      ですので、そこまで気に病んでいただく
      必要はありません。
  event_goddessfall2_02_e_64:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_e_65:
    speaker: johan
    en: "... Fine."
    ko: "…좋다."
    ja: "…そうか。"
  event_goddessfall2_02_e_66:
    speaker: johan
    en: I'll trust you, Monk.
    ko: 네 말을 믿겠다, 승려.
    ja: お前がそう言ったと、信じるしかない。
  event_goddessfall2_02_e_67:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_02_e_68:
    speaker: nayuta
    en: I thank thee, Young Hero Johan.
    ko: 고맙소. 요한 소협.
    ja: 恩に着ます、ヨハン。
  event_goddessfall2_02_e_69:
    speaker: nayuta
    en: Once I send forth my replicas towards the Queen, I beseech thee to follow
      closely in their wake.
    ko: 자, 그럼 소인이 분신들을 퀸이 있는 곳으로 돌진시키면 그 뒤를 따라주시오.
    ja: |-
      では、分身がクイーンに向けて突撃した後、
      その後ろに続いてください。
  event_goddessfall2_02_e_70:
    speaker: nayuta
    en: We possess but a single opportunity;
    ko: 기회는 한 번뿐이외다.
    ja: 勝機は一度限りです。
  event_goddessfall2_02_e_71:
    speaker: nayuta
    en: while the intercepting arms are fixed upon the ground forces,
    ko: 그 사이, 자동 요격 무장이 지상의 병력에게 집중되고 있을 때.
    ja: 迎撃兵器がおとりに向けられている間に…
  event_goddessfall2_02_e_72:
    speaker: nayuta
    en: direct thine efforts to render the orbital forge powerless.
    ko: 우주 정거장을 무력화해 주시오.
    ja: 宇宙ステーションを無力化してください。
  event_goddessfall2_02_e_73:
    speaker: nayuta
    en: Upon its destruction, we shall pour forth the entirety of our prowess.
    ko: 우주 정거장이 파괴되면, 우린 우리의 모든 기량을 쏟을 수 있소.
    ja: |-
      それさえ成れば、全戦力が制限されず
      戦えるようになります。
  event_goddessfall2_02_e_74:
    speaker: isabel
    en: Harran.
    ko: 하란.
    ja: ハラン。
  event_goddessfall2_02_e_75:
    speaker: harran
    en: I know.
    ko: 그래.
    ja: ええ。
  event_goddessfall2_02_e_76:
    speaker: harran
    en: None but you and I can do this.
    ko: 너와 내가 아니면 할 수 있는 이가 없겠구나.
    ja: それができる者は、私たちのほかにいないわね。
  event_goddessfall2_02_e_77:
    speaker: "<Narration>"
    en: At present.
    ko: 현재.
    ja: そして、現在――
  event_goddessfall2_02_e_78:
    speaker: "<Narration>"
    en: Isabel is flying alongside Harran.
    ko: 이사벨은 하란과 함께 하늘을 날고 있었다.
    ja: イサベルが空を飛び、ハランを運んでいる
  event_goddessfall2_02_e_79:
    speaker: isabel
    en: We'll be near the space station shortly.
    ko: 곧 스테이션에 접근해.
    ja: もうすぐよ。
  event_goddessfall2_02_e_80:
    speaker: harran
    en: Yeah, I can see it.
    ko: 그래. 모습이 보이는구나.
    ja: ええ。見えているわ。
  event_goddessfall2_02_e_81:
    speaker: harran
    en: "... This will not be easy."
    ko: "…쉽지 않겠는걸."
    ja: "…たやすい相手ではないでしょうね。"
  event_goddessfall2_02_e_82:
    speaker: isabel
    en: You'll manage it, won't you?
    ko: 그래도 해낼 수 있지?
    ja: でも、できるでしょう？
  event_goddessfall2_02_e_83:
    speaker: harran
    en: Of course.
    ko: 물론이란다.
    ja: 当然ね。
  event_goddessfall2_02_e_84:
    speaker: "<Narration>"
    en: Isabel picks up speed.
    ko: 이사벨이 속도를 높인다.
    ja: イサベルが速度を上げた
  event_goddessfall2_02_e_85:
    speaker: "<Narration>"
    en: The space station looms ever closer,
    ko: 스테이션의 모습이 점점 가까워진다.
    ja: 要塞が次第に迫る
  event_goddessfall2_02_e_86:
    speaker: "<Narration>"
    en: its colossal structure growing more imposing by the second.
    ko: 가까이 갈수록 그 위용이 더욱 짙어진다.
    ja: 近づくほどに、威圧感は増していった
  event_goddessfall2_02_e_87:
    speaker: "<Narration>"
    en: As they draw even nearer,
    ko: 그리고 거리가 더욱 가까워졌을 때.
    ja: さらに距離が縮んだ
  event_goddessfall2_02_e_88:
    speaker: "<Narration>"
    en: some of the countless red cores that had been looking down turn their gaze
      toward Isabel and Harran.
    ko: 아래를 보고 있던 수많은 붉은 코어 중 일부가 이사벨과 하란을 바라보았다.
    ja: |-
      地上を向いていた大量の赤いコアの一部が、
      イサベルとハランに向けられた
  event_goddessfall2_02_e_89:
    speaker: harran
    en: We've been spotted.
    ko: 들켰구나.
    ja: 見つかったようね。
  event_goddessfall2_02_e_90:
    speaker: isabel
    en: We can break through from here.
    ko: 이 정도 거리라면 뚫을 수 있어.
    ja: ここまで近づけば突破できるわ。
  event_goddessfall2_02_e_91:
    speaker: isabel
    en: Hang on tight.
    ko: 꽉 잡아.
    ja: しっかりつかまって。
  event_goddessfall2_02_e_92:
    speaker: harran
    en: All right. Let's go.
    ko: 그래. 가보자꾸나.
    ja: ええ。行くわよ。
event_goddessfall2_03_s:
  event_goddessfall2_03_s_1:
    speaker: "<Narration>"
    en: Moments before the assault on the Queen's space station.
    ko: 퀸 스테이션 공략전 직전.
    ja: 宇宙ステーション攻略戦、開始直前
  event_goddessfall2_03_s_2:
    speaker: snowwhite
    en: I'll go.
    ko: 내가 가겠다.
    ja: 私が行く。
  event_goddessfall2_03_s_3:
    speaker: snowwhite
    en: I'm better at annihilation battles than you.
    ko: 너보단 내가 더 섬멸전에 능숙하다.
    ja: 殲滅戦なら私の方が得意だ。
  event_goddessfall2_03_s_4:
    speaker: harran
    en: You're deluding yourself, Snow White.
    ko: 착각하고 있구나, 스노우 화이트야.
    ja: 勘違いしているようね、スノーホワイト。
  event_goddessfall2_03_s_5:
    speaker: harran
    en: You may fight well, but by raw specs, you're no match for me.
    ko: |-
      너는 잘 싸우는 것뿐이란다.
      단순 스펙으로 본다면 나와 비교할 수준은 아니지.
    ja: |-
      お前は戦い方が上手なだけ。
      性能だけでは私と比べものにならないわ。
  event_goddessfall2_03_s_6:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_7:
    speaker: harran
    en: This space station is no match for your clever tricks. It will be a contest
      of raw strength.
    ko: |-
      스테이션은 네가 기교를 부릴 상대가 아니란다.
      단순한 힘의 싸움이 될 테지.
    ja: |-
      この戦いは技量の勝負にならない。
      単純な力比べよ。
  event_goddessfall2_03_s_8:
    speaker: harran
    en: And I have no intention of making Isabel carry someone as heavy as you.
    ko: 그리고, 이사벨에게 너만큼 무거운 아이를 싣고 가게 하고 싶진 않구나.
    ja: それに、あまり重いとイサベルが大変だもの。
  event_goddessfall2_03_s_9:
    speaker: snowwhite
    en: Harran.
    ko: 하란.
    ja: ハラン。
  event_goddessfall2_03_s_10:
    speaker: snowwhite
    en: You might die.
    ko: 죽을지도 모른다.
    ja: 死ぬかもしれないぞ。
  event_goddessfall2_03_s_11:
    speaker: harran
    en: That's precisely why I should go.
    ko: 그렇기에 더욱 내가 가야 하는 거란다.
    ja: それなら、なおさら私が行くべきね。
  event_goddessfall2_03_s_12:
    speaker: harran
    en: You... all of you... must survive until the very end.
    ko: 너는, 너희는 끝까지 살아남아야 해.
    ja: お前は…お前たちは、最後まで生き残りなさい。
  event_goddessfall2_03_s_13:
    speaker: harran
    en: You're, hehe...
    ko: 너희는, 후후.
    ja: 何と言っても…ふふ。
  event_goddessfall2_03_s_14:
    speaker: harran
    en: utterly mad, after all.
    ko: 진짜 미쳐있으니까.
    ja: お前たちほど狂っている者はいないもの。
  event_goddessfall2_03_s_15:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_16:
    speaker: harran
    en: I deem your way superior to Eden's—an ideal, indeed.
    ko: |-
      우리 에덴의 방식보다 너희의 방식이 더 좋다고는 생각한단다.
      이상적이지.
    ja: |-
      エデンのやり方よりも、
      お前たちのやり方のほうが立派だと思うわ。
      それが理想的なのでしょうね。
  event_goddessfall2_03_s_17:
    speaker: harran
    en: Yet you have forgiven the Ark, something we could never bring ourselves to
      do.
    ko: |-
      하지만 우리는 방주를 용서할 수 없고,
      너희는 방주를 용서했단다.
    ja: |-
      それでも、私たちはアークを許せない。
      お前たちはアークを許した。
  event_goddessfall2_03_s_18:
    speaker: harran
    en: In that, you are the madder ones.
    ko: 그런 의미에서 너희는 더욱 미쳐있어.
    ja: より狂気に近いのはどちらかしら。
  event_goddessfall2_03_s_19:
    speaker: harran
    en: You neither despise the Ark nor cherish it enough to extend a hand, and still
      you burden yourselves with its troubles, sparing them even the smallest inconvenience.
    ko: 방주를 증오하지도 않고, 사랑하면서도 손을 내밀지도 않고, 혹여나 그들이 곤란해할까 봐 너희들끼리 해결하려는 것은
    ja: |-
      アークを憎むでもなく、愛していながら
      手も伸ばさず、迷惑が及ばないよう
      何もかも自分たちだけで解決しようとする。
  event_goddessfall2_03_s_20:
    speaker: harran
    en: Only one truly consumed by madness could live so.
    ko: 어지간히 미치지 않고서는 불가능한 일이지.
    ja: 正気でいてはできないことよ。
  event_goddessfall2_03_s_21:
    speaker: harran
    en: That very madness is my ideal. But I am not as mad as you.
    ko: |-
      미친 너희는 나의 이상이란다.
      하지만 나는 너희만큼 미치지 못했단다.
    ja: |-
      そんなお前たちの有りようこそが
      なりたかった自分の姿だったというのに、
      私はそこへ至ることができなかった。
  event_goddessfall2_03_s_22:
    speaker: harran
    en: I could not cast aside my own feelings for the sake of some greater design.
    ko: 개인적인 감정을 대의를 위해 희생할 수 없었어.
    ja: |-
      個人的な感情を、大義のために
      捨てることができなかったから。
  event_goddessfall2_03_s_23:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_24:
    speaker: harran
    en: You are most worthy of bearing that glorious title—of that there can be no
      doubt.
    ko: 너희는 진정으로 그 [영광스런 칭호]를 짊어지기에 부족함이 없단다.
    ja: |-
      お前たちは、真に「誇り高き称号」を
      背負うに値する存在よ。
  event_goddessfall2_03_s_25:
    speaker: harran
    en: As for us, we shall never claim it.
    ko: 우리는 그 칭호를 받을 수 없겠지.
    ja: 私たちには手が届かない。
  event_goddessfall2_03_s_26:
    speaker: harran
    en: How lamentable... yet what can be done? We are not quite so mad as you.
    ko: |-
      그것은 좀 아쉽지만 어쩌겠니.
      우린 너희처럼 미치지 않았으니.
    ja: |-
      残念な気もするけれど、仕方ないでしょう？
      私たちは、そこまで狂いきることが
      できなかった。
  event_goddessfall2_03_s_27:
    speaker: harran
    en: So remain as you are—mad. Bear that glorious title. Become true Pioneers,
      as your very name proclaims.
    ko: |-
      계속 그렇게 미쳐있으렴.
      그 영광스런 칭호를 짊어진 채, 이름 그대로 선구자가 되어.
    ja: |-
      お前たちはそのままでいなさい。
      誇り高き称号を背負い、
      名前通りに、誰より先を駆ける者となって…
  event_goddessfall2_03_s_28:
    speaker: harran
    en: Drive all who follow you mad,
    ko: 너희의 등을 바라보는 이들을 미치게 만들렴.
    ja: その背中で、見る者たちを熱狂させるのよ。
  event_goddessfall2_03_s_29:
    speaker: harran
    en: for it is always the mad who change the world.
    ko: 세상이라는 것은 보통, 미친 이들이 바꾸는 법이니까.
    ja: |-
      世界というものは、
      たいていどこかおかしな人たちが
      変えていくものだから。
  event_goddessfall2_03_s_30:
    speaker: harran
    en: I'll leave the Queen to you all.
    ko: 퀸은 맡기마.
    ja: その代わり、クイーンのことは任せたわ。
  event_goddessfall2_03_s_31:
    speaker: harran
    en: See to it that her head strikes the ground.
    ko: 반드시 그 목을 바닥에 떨궈주렴.
    ja: 必ず、あいつの首を落としなさい。
  event_goddessfall2_03_s_32:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_33:
    speaker: snowwhite
    en: I promise.
    ko: 약속하겠다.
    ja: 約束しよう。
  event_goddessfall2_03_s_34:
    speaker: hongryeon
    en: So, thou art going?
    ko: 가는겐가.
    ja: 行くのかね。
  event_goddessfall2_03_s_35:
    speaker: isabel
    en: Yes, this is something only I can do.
    ko: 그래. 나만 할 수 있는 일이니까.
    ja: ええ。私にしかできないことだから。
  event_goddessfall2_03_s_36:
    speaker: hongryeon
    en: Wouldst thou quaff a cup afore thou takest thy leave?
    ko: 가기 전에 술 한잔함이 어떤가.
    ja: その前に一杯どうだい？
  event_goddessfall2_03_s_37:
    speaker: isabel
    en: Sorry, no drunk driving.
    ko: 음주 운전은 안 돼.
    ja: 飲酒運転はしたくないわ。
  event_goddessfall2_03_s_38:
    speaker: hongryeon
    en: Aye, then I shall ready me one of mine choicest bottles.
    ko: 그렇군. 그럼 내 맛 좋은 녀석으로 하나 준비해 놓겠네.
    ja: |-
      それもそうだ。
      では、とびきりのものを
      用意しておくとしよう。
  event_goddessfall2_03_s_39:
    speaker: hongryeon
    en: When thou returnest, we shall quaff a cup together.
    ko: 돌아오면 함께 한 잔 하세.
    ja: 戻ってからなら問題あるまい。
  event_goddessfall2_03_s_40:
    speaker: isabel
    en: You really think I'll come back?
    ko: 돌아올 거라 생각하는거야?
    ja: 戻ると思うの？
  event_goddessfall2_03_s_41:
    speaker: hongryeon
    en: Ho! Was't thy desire to perish so?
    ko: 이런. 죽을 셈이던가?
    ja: おや。戻らないつもりかい？
  event_goddessfall2_03_s_42:
    speaker: isabel
    en: I'm not planning on it, but the chances of survival are slim.
    ko: 그럴 생각은 없지만, 생존 확률이 낮아.
    ja: そのつもりはないけど、見込みは薄いわ。
  event_goddessfall2_03_s_43:
    speaker: hongryeon
    en: "'Tis a mighty draught for one to quaff alone, methinks."
    ko: 혼자 마시기엔 많은 양일세.
    ja: 1人で飲むには多すぎるのでねえ。
  event_goddessfall2_03_s_44:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_45:
    speaker: isabel
    en: Then don't drink it just yet, save it.
    ko: 그럼, 괜히 먼저 마시지 말고 남겨둬.
    ja: それなら、残しておいて。
  event_goddessfall2_03_s_46:
    speaker: isabel
    en: If you're bragging that it's so good, it must be really something.
    ko: 그렇게 맛있다고 자랑했으니, 좋은 술이겠지.
    ja: |-
      あなたがそう言うからには、
      きっと美味しいのでしょう？
  event_goddessfall2_03_s_47:
    speaker: hongryeon
    en: Aye, I shall be waiting.
    ko: 그래. 기다리겠네.
    ja: ああ。待っているよ。
  event_goddessfall2_03_s_48:
    speaker: hongryeon
    en: Off with thee, then.
    ko: 다녀오게.
    ja: 武運を祈る。
  event_goddessfall2_03_s_49:
    speaker: isabel
    en: Okay.
    ko: 응.
    ja: ええ。
  event_goddessfall2_03_s_50:
    speaker: "<Narration>"
    en: Scarlet walks away.
    ko: 홍련이 뒤로 걸어갔다.
    ja: 紅蓮が立ち去った
  event_goddessfall2_03_s_51:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_52:
    speaker: isabel
    en: Papillon.
    ko: 파피용.
    ja: パピヨン。
  event_goddessfall2_03_s_53:
    speaker: papillon
    en: My, you're like a ghost. How'd you know I was here?
    ko: 세상에. 귀신이네. 있는 줄 어떻게 알았어?
    ja: ウソ、なんで分かったの？
  event_goddessfall2_03_s_54:
    speaker: isabel
    en: You haven't stopped staring at me ever since the mission was decided.
    ko: 작전이 정해지고 난 뒤부터 나를 계속 쳐다봤으니까.
    ja: |-
      作戦が決まってから、
      ずっと私のことを見ていたでしょう。
  event_goddessfall2_03_s_55:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_56:
    speaker: isabel
    en: Weren't you going to say something to me?
    ko: 할 말이 있는 것 아니었어?
    ja: 言いたいことがあるんじゃないの？
  event_goddessfall2_03_s_57:
    speaker: papillon
    en: Well... I don't really know. Must've slipped my mind.
    ko: 글쎄. 잘 모르겠는걸. 까먹었나 봐.
    ja: |-
      どうだったかしら。よく分かんない。
      忘れちゃった。
  event_goddessfall2_03_s_58:
    speaker: isabel
    en: Papillon.
    ko: 파피용.
    ja: パピヨン…
  event_goddessfall2_03_s_59:
    speaker: isabel
    en: Go back to the Ark.
    ko: 방주로 돌아가.
    ja: アークに帰って。
  event_goddessfall2_03_s_60:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_61:
    speaker: isabel
    en: This isn't a defensive mission anymore. It's an all-out assault.
    ko: 이제부터는 방위전이 아니라 특공에 가까운 일이야.
    ja: |-
      ここから先は、守る戦いじゃないわ。
      捨て身の戦いよ。
  event_goddessfall2_03_s_62:
    speaker: isabel
    en: You don't need to risk your life just because you're a hostage.
    ko: 인질로 잡혀있는 네가 목숨을 걸 필요까진 없어.
    ja: |-
      巻き込まれたあなたまで
      命をかける必要はないわ。
  event_goddessfall2_03_s_63:
    speaker: papillon
    en: You haven't trusted me this entire time, and now you're letting me go?
    ko: 그렇게나 날 의심하더니 이젠 풀어준다고?
    ja: あれだけ私を疑っといて、解放するって？
  event_goddessfall2_03_s_64:
    speaker: papillon
    en: Did you plant a bomb on me or something? I'm not gonna blow up when I get
      to the Ark, am I?
    ko: |-
      몸에 폭탄이라도 심어놨어?
      방주에 가면 터트리게?
    ja: |-
      体に爆弾でも埋めこんだ？
      アークに行ったらドカーンとか？
  event_goddessfall2_03_s_65:
    speaker: isabel
    en: That's actually a good idea.
    ko: 좋은 생각이네.
    ja: 悪くないアイデアね。
  event_goddessfall2_03_s_66:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_67:
    speaker: isabel
    en: I admit I doubted you.
    ko: 의심한 건 사실이야.
    ja: 疑ってたのは事実よ。
  event_goddessfall2_03_s_68:
    speaker: isabel
    en: You came across as frivolous and entirely self-absorbed.
    ko: 너는 가볍고, 욕심에만 눈먼 사람처럼 보였으니까.
    ja: |-
      あなたはいかにも軽薄で、
      欲が深そうな人に見えたから。
  event_goddessfall2_03_s_69:
    speaker: papillon
    en: And I don't anymore?
    ko: 지금이라고 안 그럴까.
    ja: 今だって同じでしょ。
  event_goddessfall2_03_s_70:
    speaker: isabel
    en: You didn't run.
    ko: 넌 도망가지 않았어.
    ja: あなたは逃げてないわ。
  event_goddessfall2_03_s_71:
    speaker: isabel
    en: I don't know why, but you didn't.
    ko: 왜 그랬는지는 모르겠지만, 도망가지 않았고.
    ja: |-
      なぜかは知らないけど、
      ここにいることを選んだ。
  event_goddessfall2_03_s_72:
    speaker: isabel
    en: You stood your ground and fought with us.
    ko: 우리와 함께 싸웠어.
    ja: そして私たちと一緒に戦った。
  event_goddessfall2_03_s_73:
    speaker: isabel
    en: "... Maybe it was the desperation of the moment, but I really liked seeing
      that."
    ko: "…극한의 상황이어서 그런가, 난 그게 그렇게 보기가 좋더라."
    ja: |-
      …こんな状況だからかしら。
      それがまぶしく見えたの。
  event_goddessfall2_03_s_74:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_75:
    speaker: isabel
    en: That's why I'm letting you go.
    ko: 그래서 보내주는 거야.
    ja: だから解放してあげるわ。
  event_goddessfall2_03_s_76:
    speaker: isabel
    en: I don't want you to die.
    ko: 네가 안 죽었으면 좋겠어.
    ja: あなたに死んでほしくないから。
  event_goddessfall2_03_s_77:
    speaker: papillon
    en: You've actually developed some camaraderie in such a short time?
    ko: 그 짧은 시간에 전우애라도 생긴 거야?
    ja: それだけのことで戦友だとでも思い始めたの？
  event_goddessfall2_03_s_78:
    speaker: isabel
    en: Maybe.
    ko: 그럴지도.
    ja: そうかもしれないわね。
  event_goddessfall2_03_s_79:
    speaker: isabel
    en: No—actually, yeah. I think everyone feels the same.
    ko: |-
      아니, 그래.
      아마 모두가 그렇게 느끼고 있을 거야.
    ja: |-
      ええ、きっとそう。
      他の皆もそう感じているはずよ。
  event_goddessfall2_03_s_80:
    speaker: papillon
    en: Well, aren't you easy to please.
    ko: 진짜 쉽구나, 너희.
    ja: あなたたち、本当に甘いのね。
  event_goddessfall2_03_s_81:
    speaker: isabel
    en: It may seem that way to you.
    ko: 네가 보기엔 그럴지도 모르지.
    ja: そう見えるかもしれないわね。
  event_goddessfall2_03_s_82:
    speaker: isabel
    en: Go on, then.
    ko: 가.
    ja: 行って。
  event_goddessfall2_03_s_83:
    speaker: isabel
    en: But promise me one thing.
    ko: 그리고 약속 하나만 해줘.
    ja: ただし、1つだけ約束してちょうだい。
  event_goddessfall2_03_s_84:
    speaker: isabel
    en: You can tell the Ark whatever you want,
    ko: 방주로 돌아가서 뭐든 얘기해도 돼.
    ja: アークに帰って、何を話しても構わないわ。
  event_goddessfall2_03_s_85:
    speaker: isabel
    en: just don't say a word about Eden.
    ko: 에덴에 관해서만 얘기하지 말아 줘.
    ja: でも、エデンのことは秘密にして。
  event_goddessfall2_03_s_86:
    speaker: isabel
    en: This place was built by people who dreamed of paradise,
    ko: 여긴 모두가 낙원을 꿈꾸며 만든 곳이야.
    ja: ここは私たちが楽園を作ろうとした場所だから…
  event_goddessfall2_03_s_87:
    speaker: isabel
    en: and I don't want anyone trampling through it.
    ko: 누군가가 흙발로 들어오는 것만은 피하고 싶어.
    ja: 誰にも踏み荒らされたくないの。
  event_goddessfall2_03_s_88:
    speaker: isabel
    en: Can you promise me that?
    ko: 약속해 줄 수 있어?
    ja: お願いできる？
  event_goddessfall2_03_s_89:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_90:
    speaker: papillon
    en: Wouldn't it be better if you just killed me?
    ko: 날 죽이는 게 낫지 않아?
    ja: なら、私を殺しておいた方がいいんじゃない？
  event_goddessfall2_03_s_91:
    speaker: isabel
    en: It's not easy, but I'm doing it because you seem like a good person.
    ko: |-
      그러기 쉽지 않아서 그러는 거야.
      넌 좋은 사람 같으니까.
    ja: |-
      それができそうにないから聞いてるの。
      あなたはいい人だと思うから。
  event_goddessfall2_03_s_92:
    speaker: papillon
    en: Me?
    ko: 내가?
    ja: 私が？
  event_goddessfall2_03_s_93:
    speaker: papillon
    en: But I'm a spy.
    ko: 나는 스파이야.
    ja: 私はスパイなのよ？
  event_goddessfall2_03_s_94:
    speaker: papillon
    en: I side with whoever gives me the most benefit.
    ko: 내 이득을 위해서라면 여기 붙었다 저기 붙었다 하는.
    ja: |-
      自分が得するためなら
      約束なんていくらでも破るわ。
  event_goddessfall2_03_s_95:
    speaker: isabel
    en: You're a much better person than you give yourself credit for.
    ko: 너는 네가 생각하는 것보다 훨씬 좋은 사람이야.
    ja: 自分で考えているよりずっといい人よ、あなた。
  event_goddessfall2_03_s_96:
    speaker: isabel
    en: I'll take that as your promise.
    ko: 약속받은 거라고 생각할게.
    ja: 約束はしたことにするわね。
  event_goddessfall2_03_s_97:
    speaker: isabel
    en: I've just sent you a safe route.
    ko: 안전 루트를 방금 보냈어.
    ja: 脱出ルートを送っておいたわ。
  event_goddessfall2_03_s_98:
    speaker: isabel
    en: If you're alone, you should be able to slip out of this area without much
      trouble.
    ko: 한 명이라면 무리 없이 이 근방에서 빠져나갈 수 있을 거야.
    ja: 1人なら無理なく抜け出せるはずよ。
  event_goddessfall2_03_s_99:
    speaker: isabel
    en: Go now.
    ko: 빨리 가.
    ja: 早く行って。
  event_goddessfall2_03_s_100:
    speaker: isabel
    en: And don't die.
    ko: 죽지 말고.
    ja: 生き残りなさい。
  event_goddessfall2_03_s_101:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_s_102:
    speaker: papillon
    en: Will... I get to see you again?
    ko: 또… 볼 수 있을까?
    ja: また…会えるかしら？
  event_goddessfall2_03_s_103:
    speaker: isabel
    en: "... Hard to say."
    ko: "…글쎄."
    ja: "…さあね。"
event_goddessfall2_03_e:
  event_goddessfall2_03_e_1:
    speaker: "<Narration>"
    en: Isabel's right shoulder and arm are swallowed by a surge of crimson light.
    ko: 이사벨의 오른쪽 어깨와 팔이 붉은빛에 집어삼켜진다.
    ja: イサベルの右肩と腕を赤い光がかすめた
  event_goddessfall2_03_e_2:
    speaker: "<Narration>"
    en: Her flight falters as parts of her upper body melt away in an instant.
    ko: 삽시간에 녹아내린 상체의 일부로 인해 비행이 휘청인다.
    ja: |-
      上半身の一部が形を失い、
      飛行姿勢が大きく揺らいだ
  event_goddessfall2_03_e_3:
    speaker: isabel
    en: Argh...!
    ko: 큭…!
    ja: くっ…！
  event_goddessfall2_03_e_4:
    speaker: harran
    en: We are nearly there. Do hang in a little longer.
    ko: 얼마 남지 않았다. 힘내렴.
    ja: あと少しよ。こらえて。
  event_goddessfall2_03_e_5:
    speaker: isabel
    en: I will...!
    ko: 물론이야…!
    ja: もちろんよ…！
  event_goddessfall2_03_e_6:
    speaker: "<Narration>"
    en: Isabel pushes her speed even further.
    ko: 이사벨이 속도를 더욱 높인다.
    ja: イサベルがさらに速度を上げた
  event_goddessfall2_03_e_7:
    speaker: "<Narration>"
    en: She feels it—her limit approaching fast—until control slips away.
    ko: 이사벨은 한계를 느낀다. 신체가 제어 되지 않는다.
    ja: |-
      制御の効かなくなった身体が
      限界を訴えてくる
  event_goddessfall2_03_e_8:
    speaker: "<Narration>"
    en: A torrent of crimson light crashes down.
    ko: 쏟아지는 붉은 빛.
    ja: 赤い光は絶え間なく降り注いだ
  event_goddessfall2_03_e_9:
    speaker: "<Narration>"
    en: 'Then, the realization hits: her lower half is gone,'
    ko: 이사벨은 하체가 사라졌음을 느꼈다.
    ja: |-
      イサベルは自分が下半身を
      失っていることに気づいた
  event_goddessfall2_03_e_10:
    speaker: "<Narration>"
    en: and her core power drops precipitously.
    ko: 코어의 동력이 급격하게 떨어짐을 느낀다.
    ja: コアの動力が急激に低下している
  event_goddessfall2_03_e_11:
    speaker: isabel
    en: Harran!
    ko: 하란!
    ja: ハラン！
  event_goddessfall2_03_e_12:
    speaker: harran
    en: Leave the rest to me.
    ko: 뒤는 맡기렴.
    ja: あとは任せなさい。
  event_goddessfall2_03_e_13:
    speaker: isabel
    en: Ahhhhhh!
    ko: 아아아아아--!!
    ja: はぁぁぁぁっ――！！
  event_goddessfall2_03_e_14:
    speaker: "<Narration>"
    en: With what is certain to be her final burst of speed,
    ko: 마지막이 될 것이 확실한 가속.
    ja: イサベルは最後と確信し、加速をかける
  event_goddessfall2_03_e_15:
    speaker: "<Narration>"
    en: Isabel surges into the downpour of crimson light.
    ko: 이사벨은 쏟아지는 붉은 빛들 사이를 돌진한다.
    ja: 降り注ぐ赤い光の中へと身を躍らせ…
  event_goddessfall2_03_e_16:
    speaker: "<Narration>"
    en: Twisting her body mid-flight, she launches Harran into the air.
    ko: 그리고 몸을 뒤틀어 하란을 허공에 집어 던진다.
    ja: 身体をひねり、ハランを虚空へと放り投げた
  event_goddessfall2_03_e_17:
    speaker: "<Narration>"
    en: Harran lands on the space station's outer wall.
    ko: 하란이 스테이션의 외피에 착지한다.
    ja: |-
      要塞の外壁へ降り立ったハランに、
      一瞬思考がよぎる
  event_goddessfall2_03_e_18:
    speaker: "<Narration>"
    en: Should she turn back?
    ko: 뒤를 돌아봐야 하나.
    ja: 振り向くべきか？
  event_goddessfall2_03_e_19:
    speaker: "<Narration>"
    en: No, only regret and rage wait there.
    ko: 아니, 돌아봤자 미련과 분노만 남을 뿐이다.
    ja: |-
      いや、確かめたところで、
      未練と怒りが生まれるだけだ
  event_goddessfall2_03_e_20:
    speaker: "<Narration>"
    en: Harran swings her scythe, breaking through the station's outer wall, and leaps
      into the crack.
    ko: |-
      하란은 낫을 휘둘러 스테이션의 외피를 부순 후,
      내부를 향해 몸을 던졌다.
    ja: |-
      ハランは鎌を振るって外壁を打ち破り、
      亀裂に飛び込んだ
  event_goddessfall2_03_e_21:
    speaker: "<Narration>"
    en: Isabel watches. Once she's sure Harran has made it, she gently closes her
      eyes.
    ko: |-
      이사벨은 그런 하란의 모습을 확인한 후,
      천천히 눈을 감았다.
    ja: |-
      イサベルはハランの背中を見送り、
      ゆっくりと目を閉じた
  event_goddessfall2_03_e_22:
    speaker: "<Narration>"
    en: Then, the crimson light comes for her, in endless streams.
    ko: 수많은 붉은 빛이 이사벨을 향해 다가온다.
    ja: 無数の赤い光がイサベルに迫る
  event_goddessfall2_03_e_23:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_e_24:
    speaker: isabel
    en: Darling.
    ko: 사랑스러운 분.
    ja: 愛しいあなた。
  event_goddessfall2_03_e_25:
    speaker: isabel
    en: To see you once more...
    ko: 당신을 다시 한번
    ja: あなたにもう一度――
  event_goddessfall2_03_e_26:
    speaker: "<Narration>"
    en: The crimson light engulfs Isabel.
    ko: 붉은빛이 이사벨을 삼킨다.
    ja: 光がイサベルを飲み込んだ
  event_goddessfall2_03_e_27:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_e_28:
    speaker: harran
    en: What a squalid, damp place.
    ko: 지저분하고, 습한 곳이구나.
    ja: 汚らわしい、湿った場所ね。
  event_goddessfall2_03_e_29:
    speaker: harran
    en: Hehe, how perfectly it suits a hideous wretch like you.
    ko: 후후. 추한 네놈과 참으로 잘 어울리는구나.
    ja: ふふ…醜い主には似つかわしいわ。
  event_goddessfall2_03_e_30:
    speaker: "<Narration>"
    en: Harran swings her scythe.
    ko: 하란이 낫을 휘둘렀다.
    ja: ハランが鎌を振りかざす
  event_goddessfall2_03_e_31:
    speaker: "<Narration>"
    en: Powder scatters in the air.
    ko: 가루가 퍼져나간다.
    ja: 周囲に粉状の何かが舞い散った
  event_goddessfall2_03_e_32:
    speaker: harran
    en: Be grateful to my comrades fighting beneath you.
    ko: 지금 네 아래에서 싸우고 있는 우리의 동료들에게 감사하렴.
    ja: 下で戦っている私の仲間たちに感謝しなさい。
  event_goddessfall2_03_e_33:
    speaker: harran
    en: I would have delighted in tormenting you further, but that would put their
      lives at risk.
    ko: |-
      네놈을 최대한 괴롭게 하고 싶었으나,
      그랬다간 그들의 목숨이 위험하니.
    ja: |-
      お前はなるべく苦しめてやるつもりだったの。
      でも、あの子たちの命を危うくしたくないわ。
  event_goddessfall2_03_e_34:
    speaker: harran
    en: A pity... but I shall end this swiftly.
    ko: 아쉽지만 금방 끝내도록 하겠다.
    ja: 面白くないけど、一瞬で終わらせてあげる。
  event_goddessfall2_03_e_35:
    speaker: "<Narration>"
    en: The powder spreads further.
    ko: 가루가 더욱 퍼져나간다.
    ja: 粉塵がさらに広がっていく
  event_goddessfall2_03_e_36:
    speaker: "<Narration>"
    en: Sparks jump and crackle across the space, and an ominous sound reverberates
      all around.
    ko: 곳곳에서 스파크가 튀며 불길한 소리가 울려 퍼진다.
    ja: いたる所で火花が散り、不吉な音が響きはじめた
  event_goddessfall2_03_e_37:
    speaker: harran
    en: This is a self-replicating, predatory virus I prepared just for you.
    ko: 특별히 준비한 포식 증식형 바이러스란다.
    ja: 特別製の捕食性自己増殖型ウイルスよ。
  event_goddessfall2_03_e_38:
    speaker: harran
    en: The more foolishly large you are, the more there is to feed on, and the more
      ferociously it multiplies.
    ko: 이렇게 바보같이 크면 클수록 포식할 것이 많아 더욱 맹렬히 증식하지.
    ja: |-
      大きいということは、
      それだけエサが多いということ。
      あっという間に増えるでしょうね。
  event_goddessfall2_03_e_39:
    speaker: harran
    en: Now then,
    ko: 자, 그럼.
    ja: もう言うこともないわ。
  event_goddessfall2_03_e_40:
    speaker: harran
    en: fall.
    ko: 떨어져라.
    ja: 落ちなさい。
  event_goddessfall2_03_e_41:
    speaker: chime
    en: Ah, Your Highness! Methinks the Nayutas in the area have dwindled greatly!
    ko: 아, 아가씨! 주위에 있던 나유타가 많이 줄었습니다요!
    ja: |-
      お、お嬢さま！ナユタの数が
      ずいぶん減ってきております！
  event_goddessfall2_03_e_42:
    speaker: crown
    en: Then the spice station will fall soon.
    ko: 그럼 곧 스페이스가 떨어지겠군요.
    ja: |-
      では、もうすぐ宇宙スペースが
      落ちてきますわね。
  event_goddessfall2_03_e_43:
    speaker: chime
    en: "'Tis the space station, Your Highness! And yet, after all this time, naught
      has happened...!"
    ko: 스테이션입니다요! 그리고 이만큼이나 시간이 지났는데 아직 아무 일도 일어나지 않은 건…!
    ja: |-
      「宇宙ステーション」でございます！
      しかしこれだけ時が経っても、
      まだ何も起きないということは…！
  event_goddessfall2_03_e_44:
    speaker: crown
    en: Believe in them, Chime.
    ko: 믿어요, 차임.
    ja: 信じるのです、チャイム。
  event_goddessfall2_03_e_45:
    speaker: crown
    en: They have placed their very lives on the line to defeat the Queen.
    ko: 퀸을 쓰러뜨리기 위해 목숨을 건 이들입니다.
    ja: |-
      ここにいるのはクイーンを討つため
      命を賭けている者たちばかり。
  event_goddessfall2_03_e_46:
    speaker: crown
    en: And when one stakes life itself, miracles are wont to follow.
    ko: 그리고, 목숨을 걸었을 때 기적은 일어나는 법이죠.
    ja: 奇跡とは、命を賭ける者が起こすことです。
  event_goddessfall2_03_e_47:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_03_e_48:
    speaker: chime
    en: Understood! I, Chime, have foolishly imagined defeat and spouted nonsense!
    ko: |-
      알겠습니다요!
      이 차임! 잠시 패배를 상상하고 망발을 내뱉었습니다요!
    ja: |-
      私が愚かでございました！
      この不肖チャイム！敗北の想像にとらわれ、
      恐るべき妄言を吐いてしまうなど…！
  event_goddessfall2_03_e_49:
    speaker: chime
    en: I shall trust you and fight!
    ko: 믿고, 싸우겠습니다요!
    ja: もはや、何も疑わず戦ってまいります！
  event_goddessfall2_03_e_50:
    speaker: crown
    en: Yes, let us do precisely that.
    ko: 예. 믿고 싸우죠.
    ja: ええ。戦い抜きましょう。
  event_goddessfall2_03_e_51:
    speaker: "<Narration>"
    en: Crown and Chime ride atop Trombe, tearing through the battlefield with unstoppable
      force.
    ko: 트롬베에 올라탄 크라운과 차임은 전장을 헤집고 있었다.
    ja: |-
      クラウンとチャイムを乗せたトロンベが
      戦場を駆けまわる
  event_goddessfall2_03_e_52:
    speaker: "<Narration>"
    en: With each sweep of her spear, Crown shatters and pierces any Rapture that
      dares to block their path,
    ko: 크라운이 앞세운 창은 앞을 가로막는 랩쳐들을 산산조각내며 꿰뚫었고,
    ja: |-
      クラウンの槍が
      立ちふさがるラプチャーを貫き…
  event_goddessfall2_03_e_53:
    speaker: "<Narration>"
    en: while Chime hurls bomb after bomb, sending enemies flying in all directions.
    ko: 차임이 던져대는 폭탄은 랩쳐들을 날려보내고 있었다.
    ja: |-
      チャイムの投げる爆弾が、
      ラプチャーを四方に吹き飛ばした
  event_goddessfall2_03_e_54:
    speaker: "<Narration>"
    en: Crimson light rains down from above, but not a single one touches Trombe.
    ko: 공중에서 쏟아지는 붉은 빛들은 트롬베에게 전혀 닿지 않았다.
    ja: |-
      空から降り注ぐ赤い光でさえ、
      トロンベには届かない
  event_goddessfall2_03_e_55:
    speaker: chime
    en: Your Highness!
    ko: "!! 아가씨!"
    ja: "！！お嬢さま！"
  event_goddessfall2_03_e_56:
    speaker: chime
    en: Indivilia lieth before us!
    ko: 전방에 인디빌리아가 있습니다요!
    ja: 正面にインディビリアでございます！
  event_goddessfall2_03_e_57:
    speaker: "<Narration>"
    en: At the end of the rapidly changing scenery, Indivilia looks at Crown with
      a smile.
    ko: |-
      빠르게 바뀌는 풍경의 끝.
      인디빌리아가 미소 지으며 크라운을 바라보고 있었다.
    ja: |-
      目まぐるしく飛びゆく風景の先で、
      インディビリアが微笑を浮かべ
      クラウンを見すえている
  event_goddessfall2_03_e_58:
    speaker: crown
    en: Shall we hold her here?
    ko: 이쯤에서 잡아두도록 할까요.
    ja: この辺りで押さえておきましょう。
  event_goddessfall2_03_e_59:
    speaker: chime
    en: All righty!
    ko: 좋습니다요!
    ja: かしこまりました！
  event_goddessfall2_03_e_60:
    speaker: crown
    en: Hold on tight, Chime. We ride at full speed.
    ko: 꽉 잡아요 차임. 전속력으로 갑니다.
    ja: |-
      しっかりつかまっているのですよ。
      全速力を出します。
  event_goddessfall2_03_e_61:
    speaker: crown
    en: Forward, Trombe!
    ko: 달려요, 트롬베!
    ja: 行きなさい、トロンベ！
  event_goddessfall2_03_e_62:
    speaker: "<Narration>"
    en: Trombe slams its hooves harder into the ground, surging forward with explosive
      force.
    ko: 트롬베가 지면을 더욱 강하게 박차며 달려 나간다.
    ja: トロンベが大地を力強く蹴り、駆けた
  event_goddessfall2_03_e_63:
    speaker: "<Narration>"
    en: The acceleration is so great, the surrounding landscape dissolves into a blur.
    ko: 주위의 풍경을 인식할 수 없을 만큼 가속도가 붙은 찰나.
    ja: |-
      もはや風景が見分けもつかないほどの
      速度になった瞬間…
  event_goddessfall2_03_e_64:
    speaker: "<Narration>"
    en: In that split second, a massive chunk of metal crashes down in Trombe's path.
    ko: 트롬베의 앞에 거대한 철 덩어리가 떨어졌다.
    ja: トロンベの目の前に巨大な鉄塊が突き刺さった
  event_goddessfall2_03_e_65:
    speaker: "<Narration>"
    en: The impact sends a deep tremor through the earth, and thick dust billows up
      in its wake.
    ko: 큰 진동과 자욱한 먼지가 피어오른다.
    ja: |-
      地面を揺るがす轟音と共に、
      激しい砂ぼこりが舞いあがる
  event_goddessfall2_03_e_66:
    speaker: "<Narration>"
    en: Crown's gaze snaps skyward.
    ko: 크라운은 반사적으로 하늘을 바라본다.
    ja: クラウンは反射的に空を見上げた
  event_goddessfall2_03_e_67:
    speaker: "<Narration>"
    en: Beyond the blood-red clouds, rusted, broken fragments of steel rain down like
      a storm.
    ko: |-
      붉은색으로 물든 구름 너머에서,
      녹슬고 부서진 강철 덩어리들이 비처럼 쏟아진다.
    ja: |-
      赤く染まった雲の中から、
      錆びて砕けた鋼の断片が降っている
  event_goddessfall2_03_e_68:
    speaker: "<Narration>"
    en: The Queen is descending—slowly, steadily, drawing closer to the surface.
    ko: 퀸이 조금씩 지상과 가까워진다.
    ja: クイーンの高度が少しずつ下がっていた
  event_goddessfall2_03_e_69:
    speaker: "<Narration>"
    en: And then, all at once, the relentless barrage of crimson light comes to a
      halt.
    ko: 그리고 그와 동시에, 쉴 틈 없이 쏟아지고 있던 붉은 빛이 멎었다.
    ja: |-
      ほとんど同時に、今まで止むことの無かった
      赤い光の雨が止まった
  event_goddessfall2_03_e_70:
    speaker: crown
    en: It seems it has fallen.
    ko: 떨어뜨렸군요.
    ja: 落とせたようですわね。
  event_goddessfall2_03_e_71:
    speaker: kilo
    en: We did it!
    ko: 작전 성공이네요!
    ja: 作戦成功ですね！
  event_goddessfall2_03_e_72:
    speaker: talos
    en: Space station neutralized.
    ko: 스테이션의 무력화를 확인.
    ja: 宇宙ステーションの無力化を確認。
  event_goddessfall2_03_e_73:
    speaker: talos
    en: Initiating deathblow sequence.
    ko: 다음 플랜, [큰 거 한방]으로 이행해야 합니다.
    ja: |-
      次のプラン、「大きな一撃」に
      移行する必要があります。
  event_goddessfall2_03_e_74:
    speaker: crown
    en: "... Do remind me, what was that again?"
    ko: "…뭐였죠 그게?"
    ja: "…どういうことでしょう？"
  event_goddessfall2_03_e_75:
    speaker: chime
    en: Fall back! We must retreat, Your Highness!
    ko: 뒤로! 뒤로 퇴각해야 합니다요 아가씨!
    ja: |-
      後方へ！退却するということでございます、
      お嬢さま！
  event_goddessfall2_03_e_76:
    speaker: chime
    en: Should we be ensnared, all is lost!
    ko: 휘말리면 끝입니다요!
    ja: 巻き込まれたら一巻の終わりでございます！
  event_goddessfall2_03_e_77:
    speaker: crown
    en: Ah, so that was the plan.
    ko: 아. 그 작전이었죠.
    ja: ああ、そういう作戦でしたわね。
  event_goddessfall2_03_e_78:
    speaker: crown
    en: Very well. Fall back.
    ko: 좋아요. 뒤로 물러서
    ja: いいでしょう。後ろに――
  event_goddessfall2_03_e_79:
    speaker: "<Narration>"
    en: "*Slash!*"
    ko: 스칵!
    ja: ザンッ！
  event_goddessfall2_03_e_80:
    speaker: "<Narration>"
    en: The chunk of steel in Trombe's way is sliced in half and crashes to the ground.
    ko: 트롬베의 앞을 가로막고 있던 강철 덩어리가 두 동강 나며 쓰러진다.
    ja: |-
      トロンベの前に落ちていた
      鉄の塊が真っ二つに割れた
  event_goddessfall2_03_e_81:
    speaker: "<Narration>"
    en: From beyond the wreckage, Indivilia's tail comes whipping forward,
    ko: 그리고 그 너머에서 인디빌리아의 꼬리가
    ja: その奥から、インディビリアの尻尾が…
  event_goddessfall2_03_e_82:
    speaker: "<Narration>"
    en: aimed directly at Chime's neck.
    ko: 차임의 목을 향해 휘둘러진다.
    ja: チャイムの首めがけて伸びた
  event_goddessfall2_03_e_83:
    speaker: indivilia
    en: There is still a matter of revenge I must see through.
    ko: 저도 복수라는 걸 해야 해서요.
    ja: 私も借りを作ったままではいられませんので。
  event_goddessfall2_03_e_84:
    speaker: crown
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall2_03_e_85:
    speaker: "<Narration>"
    en: Crown turns sharply, thrusting her spear up just in time to shield Chime's
      side.
    ko: 크라운이 다급히 방향을 틀어, 창을 세워 차임의 옆을 막아낸다.
    ja: |-
      クラウンが素早く向きを変えて槍を構え、
      チャイムをかばうため横に立った
  event_goddessfall2_03_e_86:
    speaker: indivilia
    en: Heh...! Just as I thought...!
    ko: 후후…! 역시…!
    ja: ふふ…！やはり…！
  event_goddessfall2_03_e_87:
    speaker: "<Narration>"
    en: Indivilia launches a relentless assault on Chime.
    ko: 인디빌리아가 차임을 향해 맹공을 퍼붓는다.
    ja: |-
      インディビリアはチャイムを狙って
      猛攻を浴びせてくる
  event_goddessfall2_03_e_88:
    speaker: "<Narration>"
    en: The air cracks with piercing shrieks as blades and spears collide in a clash
      of metal.
    ko: 공기를 찢는 파열음, 칼날과 창이 부딪히는 소리가 울려 퍼진다.
    ja: |-
      空気を裂く破裂音と、
      刃と槍の弾かれ合う音が響く
  event_goddessfall2_03_e_89:
    speaker: "<Narration>"
    en: Crown intercepts every strike, shielding Chime without fail.
    ko: 차임을 향한 인디빌리아의 공격을 크라운이 모두 막아낸다.
    ja: |-
      チャイムを狙うインディビリアの攻撃を
      クラウンがすべて受け止めていた
  event_goddessfall2_03_e_90:
    speaker: chime
    en: U-ugh...!
    ko: 흐, 흐아…!
    ja: ひ、ひぃっ…！
  event_goddessfall2_03_e_91:
    speaker: crown
    en: Worry not, Chime. I will ensure you are safe.
    ko: 걱정마요 차임. 제가 다 막습니다.
    ja: |-
      心配ありません、チャイム。
      私がすべて受け止めます。
  event_goddessfall2_03_e_92:
    speaker: indivilia
    en: Ah, yes! You are truly suited to die for others!
    ko: 그래요! 당신은 역시 남을 위해 죽는 게 어울려요!
    ja: |-
      あなたはやはり、
      誰かのために死ぬのがお似合いです！
  event_goddessfall2_03_e_93:
    speaker: indivilia
    en: Continue shouldering their lives and missions until your death!
    ko: 계속 그렇게 타인의 목숨과 사명을 짊어지다 죽어요!
    ja: |-
      そうやって他人の命と使命を背負いながら、
      命を落とすといい！
  event_goddessfall2_03_e_94:
    speaker: "<Narration>"
    en: "*Claaang!*"
    ko: 카가가가강--!!
    ja: ガガガガッ――！！
  event_goddessfall2_03_e_95:
    speaker: "<Narration>"
    en: Indivilia's blade gains terrifying speed and locks onto Chime like a predator,
      relentless in its pursuit.
    ko: |-
      인디빌리아의 칼날이 더욱 가속한다.
      차임을 집요하게 노린다.
    ja: |-
      チャイムを執拗に狙うインディビリアの攻撃は
      さらに勢いを増していく
  event_goddessfall2_03_e_96:
    speaker: crown
    en: Hrnggh...!
    ko: 크윽…!
    ja: くっ…！
  event_goddessfall2_03_e_97:
    speaker: "<Narration>"
    en: Chime curses herself for being powerless as the battle raged on before her.
    ko: 차임은 격전의 뒤에서 아무것도 하지 못하는 자신을 저주했다.
    ja: |-
      激しい応酬の陰で、
      チャイムは無力な自分を呪った
  event_goddessfall2_03_e_98:
    speaker: "<Narration>"
    en: And yet, at the same time, she feels a flicker of relief
    ko: 그와 동시에 안심하며 바라보았다.
    ja: 同時に、安心感を覚えていた
  event_goddessfall2_03_e_99:
    speaker: "<Narration>"
    en: as she watches the king's back, standing before her and blocking everything.
    ko: 자신의 앞을 가로막은 채 모든 것을 막아내고 있는 왕의 뒷모습을.
    ja: |-
      自身の前に立ち、
      すべてを受け止める王の背中に…
  event_goddessfall2_03_e_100:
    speaker: "<Narration>"
    en: "*Swoooosh!*"
    ko: 쎄에에에엑--!!
    ja: ヒュンッ――！！
  event_goddessfall2_03_e_101:
    speaker: "<Narration>"
    en: Indivilia's tail sweeps in a vicious arc, aiming not at Crown, but at Chime
      behind her.
    ko: 인디빌리아의 꼬리가 크게 호를 그리며 크라운의 뒤에 있는 차임을 노리고 휘둘러진다.
    ja: |-
      インディビリアの尻尾が大きく弧を描き
      クラウンの背後に隠れるチャイムを狙った
  event_goddessfall2_03_e_102:
    speaker: "<Narration>"
    en: It's a devastating blow. Crown sees it coming and knows that if she can block
      this, the moment to counter will be hers.
    ko: 큰 공격이다. 크라운은 이 공격을 막아내면 반격의 기회가 있을 것이라 확신했다.
    ja: |-
      大ぶりな攻撃だ。クラウンはこれを防げば
      反撃の隙が生まれると見切った
  event_goddessfall2_03_e_103:
    speaker: "<Narration>"
    en: "*Clang!*"
    ko: 카앙-!!
    ja: カン！！
  event_goddessfall2_03_e_104:
    speaker: "<Narration>"
    en: Crown's spear meets the tail's blade.
    ko: 크라운의 창이 꼬리의 칼날을 막아낸다.
    ja: クラウンの槍が尻尾を弾いた
  event_goddessfall2_03_e_105:
    speaker: "<Narration>"
    en: As she adjusts her stance for a swift retaliation, a strange sensation creeps
      over her.
    ko: |-
      빠른 반격을 위한 자세를 다듬는 순간,
      크라운은 묘한 이질감을 느꼈다.
    ja: |-
      反撃の構えを取ろうとした瞬間、
      クラウンは違和感を覚えた
  event_goddessfall2_03_e_106:
    speaker: "<Narration>"
    en: Her body feels sluggish.
    ko: 몸이 둔하다.
    ja: 身体が重い
  event_goddessfall2_03_e_107:
    speaker: indivilia
    en: I've been sprinkling the Alva particles you like, letting them seep in.
    ko: |-
      당신이 좋아하는 에블라 입자를 뿌리고 있었어요.
      스며들듯이.
    ja: |-
      あなたの大好きなエブラ粒子を
      撒いておきました。
      ゆっくりと効いてくるように。
  event_goddessfall2_03_e_108:
    speaker: indivilia
    en: Does it please you?
    ko: 맘에 드나요?
    ja: お気に召しましたか？
  event_goddessfall2_03_e_109:
    speaker: crown
    en: Chime! Retreat...!
    ko: "!! 차임! 퇴각을…!"
    ja: "！！チャイム！退却を…！"
  event_goddessfall2_03_e_110:
    speaker: indivilia
    en: It's already too late.
    ko: 늦었어요.
    ja: させませんよ。
  event_goddessfall2_03_e_111:
    speaker: "<Narration>"
    en: Indivilia's tail lashes toward Chime once more.
    ko: 인디빌리아의 꼬리가 다시 차임을 향해 크게 휘둘러진다.
    ja: インディビリアの尻尾が再びチャイムを狙った
  event_goddessfall2_03_e_112:
    speaker: "<Narration>"
    en: But Crown steps in to block it.
    ko: 크라운이 막아선다.
    ja: クラウンがチャイムの前に立ちはだかった
  event_goddessfall2_03_e_113:
    speaker: indivilia
    en: Indeed. I expected you would do that.
    ko: 그래요. 당신은 그럴 줄 알았어요.
    ja: でしょうね。あなたなら。
  event_goddessfall2_03_e_114:
    speaker: "<Narration>"
    en: The tail, once sweeping horizontally through the air, suddenly shifts course
      in a heartbeat.
    ko: 가로로 휘둘러지던 꼬리의 궤적이 삽시간에 바뀐다.
    ja: |-
      横なぎに払われていた尻尾が
      突然軌道を変えた
  event_goddessfall2_03_e_115:
    speaker: "<Narration>"
    en: Its blade at the tip surges skyward, then crashes down with lethal force.
    ko: 하늘로 솟은 꼬리 끝의 칼날이 내려쳐진다.
    ja: |-
      尻尾は空高くに跳ね上がり、
      上段から先端の刃を振り下ろした
  event_goddessfall2_03_e_116:
    speaker: "<Narration>"
    en: Indivilia's strike buries itself into Crown's shoulder,
    ko: 인디빌리아의 칼날이 크라운의 어깨를 파고든다.
    ja: 刃先がクラウンの肩をえぐった
  event_goddessfall2_03_e_117:
    speaker: "<Narration>"
    en: carving a ruthless path downward.
    ko: 그대로 아래를 향해 그어진 칼날은
    ja: 勢いの乗った刃はそのまま止まらず…
  event_goddessfall2_03_e_118:
    speaker: "<Narration>"
    en: The blade doesn't stop until it has slashed clean through to her waist—only
      then does it tear free from her body.
    ko: 크라운의 허리춤까지 내려온 다음에야, 크라운의 몸에서 떨어져나왔다.
    ja: 腰近くまでを裂いて、クラウンの身体を抜けた
  event_goddessfall2_03_e_119:
    speaker: "<Narration>"
    en: At that very moment, Indivilia steps back, putting distance between them.
    ko: 그와 동시에 인디빌리아가 거리를 벌린다.
    ja: |-
      反撃の隙も与えず、
      インディビリアは素早く距離を取った
  event_goddessfall2_03_e_120:
    speaker: crown
    en: "*Cough*"
    ko: 쿨럭.
    ja: ゲホッ…
  event_goddessfall2_03_e_121:
    speaker: chime
    en: Your Hiiighness!
    ko: 아가씨이이--!!
    ja: お嬢さまぁぁ！！
  event_goddessfall2_03_e_122:
    speaker: indivilia
    en: Hehe... Ahahaha!
    ko: 후후. 아하하하.
    ja: ふふふ…あははは！
  event_goddessfall2_03_e_123:
    speaker: indivilia
    en: As I thought, that foolish power of yours is no longer yours to command.
    ko: 역시, 예전의 그 바보 같은 힘은 사용할 수 없는 모양이군요.
    ja: |-
      やはり、あの時のふざけた力は
      使えないようですね。
  event_goddessfall2_03_e_124:
    speaker: indivilia
    en: And congratulations.
    ko: 그리고 축하해요.
    ja: それに、喜んでください。
  event_goddessfall2_03_e_125:
    speaker: indivilia
    en: To lay down your life for another... Surely, there is no greater honor for
      you.
    ko: 타인을 위해 죽는 것. 당신에겐 더없는 영광일 테니.
    ja: |-
      他人のために死ねるのです。
      あなたにとっては本望でしょう？
  event_goddessfall2_03_e_126:
    speaker: kilo
    en: Arrgghh!
    ko: 아아아아--!!
    ja: はあああっ！！
  event_goddessfall2_03_e_127:
    speaker: "<Narration>"
    en: With a sharp kick, T.A.L.O.S. sends the Rapture he'd been facing flying, then
      charges straight at Indivilia.
    ko: 대치 중이던 랩쳐를 걷어찬 탈로스가 인디빌리아에게 돌진한다.
    ja: |-
      対峙していたラプチャーを蹴り飛ばし、
      タロスがインディビリアに突進した
  event_goddessfall2_03_e_128:
    speaker: "<Narration>"
    en: She lowers her stance with a smile, calm and unfazed.
    ko: 인디빌리아는 웃으며 자세를 낮춘다.
    ja: インディビリアは笑みを浮かべ、姿勢を落とした
  event_goddessfall2_03_e_129:
    speaker: "<Narration>"
    en: At that moment, Trombe slams into T.A.L.O.S.
    ko: 그 순간, 트롬베가 탈로스를 들이받는다.
    ja: その瞬間、タロスはトロンベに突き飛ばされた
  event_goddessfall2_03_e_130:
    speaker: kilo
    en: Wha...!?
    ko: 어헉…!?
    ja: うっ…！？
  event_goddessfall2_03_e_131:
    speaker: chime
    en: We shall retreat!
    ko: 퇴각한다!
    ja: ここは退くのだ！
  event_goddessfall2_03_e_132:
    speaker: kilo
    en: Crown! Crowwwn!
    ko: 크라운이! 크라운이이--!!
    ja: クラウン！クラウンは！？
  event_goddessfall2_03_e_133:
    speaker: chime
    en: Rapunzel is here! She shall save her at all costs!
    ko: 라푼젤이 있다! 반드시 살린다!
    ja: ラプンツェルがいる！助けられるのだ！
  event_goddessfall2_03_e_134:
    speaker: chime
    en: Retreeeeaaat!
    ko: 퇴각한다아아아--!!
    ja: 早く、退却するのだぁぁぁ！！
  event_goddessfall2_03_e_135:
    speaker: kilo
    en: Ack...! Uuuuugh...!
    ko: 윽…! 으으으으윽…!
    ja: うっ…！ううううっ…！
  event_goddessfall2_03_e_136:
    speaker: "<Narration>"
    en: Indivilia casts a glare over her shoulder at Trombe and T.A.L.O.S., who are
      trying to retreat.
    ko: 인디빌리아는 등을 돌린 채 퇴각하는 트롬베와 탈로스를 빤히 바라보았다.
    ja: |-
      インディビリアは背中越しに
      退却しようとするトロンベとタロスをにらんだ
  event_goddessfall2_03_e_137:
    speaker: indivilia
    en: Preposterous.
    ko: 어이가 없어서.
    ja: 呆れてしまいますね。
  event_goddessfall2_03_e_138:
    speaker: indivilia
    en: Who gave you leave to retreat?
    ko: 누가 퇴각하게 둔다고 했었나요?
    ja: 誰が帰すといいましたか？
  event_goddessfall2_03_e_139:
    speaker: "<Narration>"
    en: Just as Indivilia is just about to dash after lowering her stance,
    ko: 인디빌리아가 자세를 숙이고 달려 나가려는 순간.
    ja: |-
      インディビリアが姿勢を低く構え、
      飛びかかろうとした瞬間…
  event_goddessfall2_03_e_140:
    speaker: "<Narration>"
    en: something in the corner of her eye catches her attention, and she stops.
    ko: 인디빌리아는 시야 한편을 차지한 뭔가를 보고 멈췄다.
    ja: 視界の片隅に映った何かを見て、動きを止めた
  event_goddessfall2_03_e_141:
    speaker: indivilia
    en: "... What, exactly, is that?"
    ko: "…뭔가요 저건."
    ja: "…何ですか、あれは？"
  event_goddessfall2_03_e_142:
    speaker: "<Narration>"
    en: Marian looks to the sky.
    ko: 마리안은 하늘을 본다.
    ja: マリアンが空を仰いだ
  event_goddessfall2_03_e_143:
    speaker: "<Narration>"
    en: A sky stained in crimson.
    ko: 붉게 물든 하늘.
    ja: 赤く染まった空
  event_goddessfall2_03_e_144:
    speaker: "<Narration>"
    en: Fragments of steel pour down like rain.
    ko: 비처럼 쏟아지는 강철 조각들.
    ja: 降り注ぐ鋼の欠片
  event_goddessfall2_03_e_145:
    speaker: "<Narration>"
    en: She let her gaze drift to the battlefield.
    ko: 마리안은 전장을 바라본다.
    ja: マリアンは戦場に視線を移した
  event_goddessfall2_03_e_146:
    speaker: "<Narration>"
    en: To the Nayutas who have fallen. To those still dying.
    ko: 죽어간, 죽어가는 나유타들.
    ja: 死にゆく無数のナユタ
  event_goddessfall2_03_e_147:
    speaker: "<Narration>"
    en: To Isabel and Harran who are risking their lives.
    ko: 목숨을 건 이사벨과 하란.
    ja: 空に消えたイサベルとハラン
  event_goddessfall2_03_e_148:
    speaker: "<Narration>"
    en: To the Nikkes of the Crown Kingdom letting out battle cries as they fight.
    ko: 악을 쓰며 싸우고 있는 크라운 왕국의 니케들.
    ja: 苦闘を繰り広げるクラウン王国のニケたち
  event_goddessfall2_03_e_149:
    speaker: "<Narration>"
    en: To the Raptures...
    ko: 죽어가는
    ja: 死にゆく…
  event_goddessfall2_03_e_150:
    speaker: "<Narration>"
    en: dying by the dozens.
    ko: 랩쳐들.
    ja: ラプチャーたち
  event_goddessfall2_03_e_151:
    speaker: "<Narration>"
    en: Everything Marian holds dear is locked in a desperate battle to the death.
    ko: 마리안의 소중한 것들이 서로 목숨을 걸고 싸우고 있다.
    ja: |-
      自分にとって大切な存在が、
      互いに命を奪いあっている
  event_goddessfall2_03_e_152:
    speaker: "<Narration>"
    en: She feels a sorrow so heavy it presses on her chest.
    ko: 마리안은 이 모든 상황이 너무 슬펐다.
    ja: 彼女は深い悲しみを覚えた
  event_goddessfall2_03_e_153:
    speaker: "<Narration>"
    en: At the same time, a surge of anger begins to boil within her.
    ko: 동시에, 끓어오르는 분노를 느꼈다.
    ja: 同時に、心の底で怒りが沸き上がった
  event_goddessfall2_03_e_154:
    speaker: "<Narration>"
    en: She lifts her head once more to the sky.
    ko: 마리안은 다시 고개를 들어 하늘을 바라본다.
    ja: マリアンは再び頭を上げ、空をにらんだ
  event_goddessfall2_03_e_155:
    speaker: "<Narration>"
    en: Her eyes fall on the thing suspended upon the wires stretched across the clouds.
    ko: 구름 너머까지 뻗어있는 전선에 몸을 맡기고 있는 그것을 바라본다.
    ja: 雲から伸びた線に身を預け…
  event_goddessfall2_03_e_156:
    speaker: "<Narration>"
    en: The Queen watches the carnage below with cold indifference.
    ko: 아무렇지도 않게 아래를 내려다보고 있는, 퀸을.
    ja: クイーンが平然と地上を見下ろしている
  event_goddessfall2_03_e_157:
    speaker: marian_q
    en: "... It's you."
    ko: "…너구나."
    ja: "…あなたが…"
  event_goddessfall2_03_e_158:
    speaker: marian_q
    en: So it really was you.
    ko: 너였어.
    ja: あなたが。
  event_goddessfall2_03_e_159:
    speaker: "<Narration>"
    en: Black light bursts out from Marian's body.
    ko: 마리안의 몸에서 검은빛이 뿜어져 나왔다.
    ja: マリアンの体から黒い光がこぼれ出した
  event_goddessfall2_03_e_160:
    speaker: "<Narration>"
    en: Black particles scatter into the air as the ground shakes beneath her.
    ko: 검은 입자가 흩날린다. 지면이 흔들린다.
    ja: 黒い粒子が舞い散り、大地が激しく揺れた
  event_goddessfall2_03_e_161:
    speaker: marian_q
    en: Because of you...!
    ko: 너 때문에…!
    ja: あなたのせいで…！
  event_goddessfall2_03_e_162:
    speaker: marian_q
    en: Because of you, we!
    ko: 너 때문에 우리들은!
    ja: あなたのせいで私たちは！
  event_goddessfall2_03_e_163:
    speaker: marian_q
    en: We...!
    ko: 우리들은---!!
    ja: 私たちは――！！
  event_goddessfall2_03_e_164:
    speaker: "<Narration>"
    en: Black light bursts forth.
    ko: 검은 빛이 터져나왔다.
    ja: 黒い光があふれ出した
  event_goddessfall2_03_e_165:
    speaker: "<Narration>"
    en: Instinctively, Indivilia takes a step back.
    ko: 인디빌리아는 자기도 모르게 뒤로 한걸음 물러섰다.
    ja: インディビリアは思わず一歩引き下がった
  event_goddessfall2_03_e_166:
    speaker: "<Narration>"
    en: All of a sudden, a massive figure appears on the battlefield.
    ko: 전장에 갑자기 나타난 거체.
    ja: 戦場に突如出現した巨体…
  event_goddessfall2_03_e_167:
    speaker: "<Narration>"
    en: She knows exactly what it is—more than anyone.
    ko: 인디빌리아는 저것이 무엇인지, 그 누구보다 확실히 알고 있었다.
    ja: それが何か、誰よりもよく理解しているからだ
  event_goddessfall2_03_e_168:
    speaker: indivilia
    en: Transformation...!
    ko: 거대화…!
    ja: 巨大化…！
event_goddessfall2_intermission_01:
  event_goddessfall2_intermission_01_1:
    speaker: nayuta
    en: Young Lady Marian,
    ko: 마리안 소저.
    ja: マリアン。
  event_goddessfall2_intermission_01_2:
    speaker: nayuta
    en: canst thou accomplish it?
    ko: 할 수 있겠소?
    ja: できますか？
  event_goddessfall2_intermission_01_3:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_4:
    speaker: nayuta
    en: If it pleaseth thee not, I shall not compel thee.
    ko: 내키지 않는다면 강요하진 않겠소.
    ja: |-
      気が進まないというならば、
      無理強いはできません。
  event_goddessfall2_intermission_01_5:
    speaker: marian_q
    en: To be honest, I don't want to.
    ko: 솔직히 싫어요.
    ja: やりたくはありません。
  event_goddessfall2_intermission_01_6:
    speaker: marian_q
    en: I don't want to see anyone die, be it Raptures or any of you.
    ko: 랩쳐도, 여러분도, 죽는 걸 보고 싶지 않아요.
    ja: |-
      ラプチャーにも、皆さんにも、
      死んでほしくありません。
  event_goddessfall2_intermission_01_7:
    speaker: marian_q
    en: I don't want to have to kill Raptures.
    ko: 랩쳐를 죽이고 싶지 않아요.
    ja: ラプチャーを殺したいとは思えません。
  event_goddessfall2_intermission_01_8:
    speaker: marian_q
    en: But...
    ko: 하지만….
    ja: でも…
  event_goddessfall2_intermission_01_9:
    speaker: "<Narration>"
    en: Marian stares straight at Nayuta.
    ko: 마리안은 나유타의 모습을 빤히 바라보았다.
    ja: マリアンはナユタの顔をのぞいた
  event_goddessfall2_intermission_01_10:
    speaker: "<Narration>"
    en: Her eyes are still glazed with sorrow, tear streaks etched down her cheeks.
    ko: 나유타의 눈과 뺨에는 눈물 자국이 남아있었다.
    ja: 目と頬に涙の跡が残っている
  event_goddessfall2_intermission_01_11:
    speaker: marian_q
    en: "... I shouldn't be saying something like this to you, Nayuta."
    ko: "…나유타 앞에서, 할 말은 아니죠."
    ja: "…あなたの前で、言えることではありません。"
  event_goddessfall2_intermission_01_12:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_13:
    speaker: marian_q
    en: Those clones of yours aren't just mechanical robots, are they?
    ko: 분신 분들은 말씀하신 것처럼 단순한 기계인형이 아니죠?
    ja: 本当は、単なる機械じゃないんでしょう？
  event_goddessfall2_intermission_01_14:
    speaker: marian_q
    en: They're... living beings, right?
    ko: 다들… [살아있는] 분들이죠?
    ja: 分身は…みんな「生きている」んですよね？
  event_goddessfall2_intermission_01_15:
    speaker: nayuta
    en: Verily, it doth depend upon how one doth define life itself...
    ko: 살아있다를 무엇으로 정의하느냐에 따라 다르겠지만….
    ja: |-
      何をもって「生きている」とするか、
      定義にもよるでしょうが…
  event_goddessfall2_intermission_01_16:
    speaker: nayuta
    en: "... Yet, in the common conceit, thou may'st so say."
    ko: "…일반적인 개념으로는, 그렇다고 할 수 있소."
    ja: "…一般的には、そう考えられるでしょう。"
  event_goddessfall2_intermission_01_17:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_18:
    speaker: marian_q
    en: I'll do it.
    ko: 할게요.
    ja: やります。
  event_goddessfall2_intermission_01_19:
    speaker: marian_q
    en: Everyone's out there fighting, putting everything on the line.
    ko: 모두가 모든 걸 걸며, 자신을 깎아내리며 싸우고 있어요.
    ja: |-
      誰もが全てをかけて、
      自分を削りながら戦っています。
  event_goddessfall2_intermission_01_20:
    speaker: marian_q
    en: I'll do the same.
    ko: 저도, 그렇게 할게요.
    ja: 私も、そうしないと。
  event_goddessfall2_intermission_01_21:
    speaker: marian_q
    en: I'll give it my all.
    ko: 모든 걸 걸게요.
    ja: すべてを賭けて戦います。
  event_goddessfall2_intermission_01_22:
    speaker: marian_q
    en: Fall...!
    ko: 떨어져라…!
    ja: いけっ…！
  event_goddessfall2_intermission_01_23:
    speaker: "<Narration>"
    en: The giant rains bullets and missiles down on the Queen's space station.
    ko: 거신이 퀸의 스테이션에 탄환과 미사일을 쏟아붓는다.
    ja: |-
      鋼の巨体から放たれた弾丸とミサイルが
      宇宙ステーションを襲った
  event_goddessfall2_intermission_01_24:
    speaker: "<Narration>"
    en: Stripped of its weaponry, the station is left utterly defenseless, unable
      to do anything but endure the barrage.
    ko: 공격 수단을 잃은 스테이션은 무기력하게 공격에 노출된다.
    ja: |-
      すでに攻撃手段を失っていたステーションは、
      無抵抗のまま攻撃にさらされた
  event_goddessfall2_intermission_01_25:
    speaker: "<Narration>"
    en: A thunderous explosion tears through it, and its shattered components come
      falling down like deadly hail.
    ko: 거대한 폭발과 함께 스테이션의 부품들이 지면으로 낙하한다.
    ja: 巨大な爆発と共に、断片が地面に降り注いだ
  event_goddessfall2_intermission_01_26:
    speaker: "<Narration>"
    en: Countless Raptures are obliterated beneath the crashing wreckage.
    ko: 수많은 랩쳐들이 떨어진 부품들에 의해 박살 난다.
    ja: |-
      断片の巻き添えにされたラプチャーが
      粉々に砕け散っていく
  event_goddessfall2_intermission_01_27:
    speaker: "<Narration>"
    en: The giant pulls back, then deploys the particle cannon mounted on her shoulder.
    ko: 거신이 거리를 벌린 후, 어깨의 입자포를 전개한다.
    ja: 巨体は距離を広げ、肩の砲塔を展開した
  event_goddessfall2_intermission_01_28:
    speaker: "<Narration>"
    en: Light begins to pool inside the barrel, quickly reaching critical mass. The
      air ripples as particles quiver on the brink of release.
    ko: |-
      포신에 빛이 모여들고 곧 임계점을 넘는다.
      입자가 당장이라도 튀어 나갈 듯 일렁인다.
    ja: |-
      砲身が光を凝縮し、臨界点に近づいた。
      今にも弾けそうな光が震えた
  event_goddessfall2_intermission_01_29:
    speaker: marian_q
    en: Fall...!
    ko: 떨어져라…!
    ja: 落ちてっ…！
  event_goddessfall2_intermission_01_30:
    speaker: indivilia
    en: It is you who shall fall.
    ko: 떨어지는 건 당신입니다!
    ja: 落ちるのはあなたです！
  event_goddessfall2_intermission_01_31:
    speaker: "<Narration>"
    en: Having taken the form of a gigantic centipede, Indivilia unleashes a bolt
      of lightning
    ko: 거대한 지네가 거신을 향해 전격을 내뿜는다.
    ja: |-
      巨大なムカデの姿と化したインディビリアが
      電撃を放った
  event_goddessfall2_intermission_01_32:
    speaker: "<Narration>"
    en: that tears through the sky, stretching toward the giant's body.
    ko: 전격이 창공을 갈라, 거신의 몸을 향해 뻗어나간다.
    ja: 電光が虚空を裂き、マリアンに向かって伸びた
  event_goddessfall2_intermission_01_33:
    speaker: "<Narration>"
    en: In an instant, Marian's massive body vanishes, as if it had never been there
      in the first place.
    ko: 마리안의 거신은, 처음부터 그곳에 없었다는 듯 사라졌다.
    ja: |-
      瞬間、巨体の姿が初めから
      存在しなかったかのようにかき消えた
  event_goddessfall2_intermission_01_34:
    speaker: indivilia
    en: What is this...?!
    ko: "…뭐죠?"
    ja: なっ…！？
  event_goddessfall2_intermission_01_35:
    speaker: "<Narration>"
    en: Without warning, Marian's massive form appears behind the Queen's space station.
    ko: 사라진 마리안의 거신이 퀸의 스테이션 뒤에서 갑자기 모습을 드러낸다.
    ja: |-
      消えた巨体は、宇宙ステーションの影に
      再び突然姿を現した
  event_goddessfall2_intermission_01_36:
    speaker: indivilia
    en: Particle disassembly and reassembly…?
    ko: 입자 분해 및 재배치…!
    ja: 分解と再配置…！
  event_goddessfall2_intermission_01_37:
    speaker: indivilia
    en: So you've forsaken both your humanity and Rapture selves alike, you incomplete
      abomination!
    ko: |-
      유사 인간이기도, 랩쳐이기도 포기한 모양이군요!
      이 되다 만 것!
    ja: |-
      人間もどきであることも、
      ラプチャーであることも諦めたのですか！
      なりそこないが！
  event_goddessfall2_intermission_01_38:
    speaker: marian_q
    en: Faaaaall!
    ko: 떨어져라아아--!!
    ja: くらえええ！！
  event_goddessfall2_intermission_01_39:
    speaker: "<Narration>"
    en: The particle cannon emits a blast of light.
    ko: 입자포가 빛을 내뿜는다.
    ja: 粒子砲が光を放ち…
  event_goddessfall2_intermission_01_40:
    speaker: "<Narration>"
    en: It pierces through the station,
    ko: 스테이션을 관통한다.
    ja: ステーションを貫いた
  event_goddessfall2_intermission_01_41:
    speaker: "<Narration>"
    en: then skims across the ground.
    ko: 빛이 지면을 긁는다.
    ja: 光は地表まで届き…
  event_goddessfall2_intermission_01_42:
    speaker: "<Narration>"
    en: Raptures caught in its path shatter and melt under the searing beam.
    ko: 랩쳐들이 부서지고 녹아내린다.
    ja: 流れ弾となってラプチャーを溶かした
  event_goddessfall2_intermission_01_43:
    speaker: indivilia
    en: Curse it...!
    ko: 이런…!
    ja: バカな…！
  event_goddessfall2_intermission_01_44:
    speaker: "<Narration>"
    en: The giant centipede swings its tail with crushing force.
    ko: 거대한 지네의 꼬리가 휘둘러진다.
    ja: 巨大なムカデの尾が伸びた
  event_goddessfall2_intermission_01_45:
    speaker: "<Narration>"
    en: Marian's body reels from the blow, her stance faltering.
    ko: 큰 충격과 함께 마리안의 거신이 흐트러진다.
    ja: 大きな衝撃が、巨体を揺らした
  event_goddessfall2_intermission_01_46:
    speaker: "<Narration>"
    en: In a flash, the giant centipede coils its long body around her frame,
    ko: 거대한 지네가 거신의 몸을 휘감는다.
    ja: 巨大なムカデはマリアンに巻きつき…
  event_goddessfall2_intermission_01_47:
    speaker: "<Narration>"
    en: then unleashes a violent surge of electricity.
    ko: 그리고 그대로 전격을 내뿜는다.
    ja: 電撃を放った
  event_goddessfall2_intermission_01_48:
    speaker: marian_q
    en: Urrrggh...!
    ko: 크으으윽…!
    ja: ぐううっ…！
  event_goddessfall2_intermission_01_49:
    speaker: indivilia
    en: I shall either roast you as you stand or crush you outright!
    ko: 이대로 구워주거나, 으스러뜨려 드리죠!
    ja: |-
      このまま焼けるか、
      ひねりつぶされるといい！
  event_goddessfall2_intermission_01_50:
    speaker: harran
    en: Your Queen has fallen, and yet you still linger in the air.
    ko: 너의 여왕은 떨어졌는데, 너는 아직 하늘에 있구나.
    ja: |-
      お前の女王は降りたというのに、
      まだ空にいるのね。
  event_goddessfall2_intermission_01_51:
    speaker: harran
    en: Truly, a most disloyal servant.
    ko: 불충한 신하로다.
    ja: 頭が高い臣下だこと。
  event_goddessfall2_intermission_01_52:
    speaker: "<Narration>"
    en: A battered Harran plummets from above and lands atop the giant centipede's
      head.
    ko: 만신창이가 된 채 낙하한 하란이 거대 지네의 머리에 착지한다.
    ja: |-
      満身創痍で落下してきたハランが、
      巨大なムカデの頭に降りた
  event_goddessfall2_intermission_01_53:
    speaker: "<Narration>"
    en: Without the slightest hesitation, she drives her scythe into the centipede's
      forehead.
    ko: 조금의 망설임 없이, 이마에 낫을 박아 넣는다.
    ja: わずかな迷いもない鎌の一撃が額に突き刺さった
  event_goddessfall2_intermission_01_54:
    speaker: "<Narration>"
    en: Then, a surge of lightning lashes out, racing along the blade.
    ko: 뻗어 나온 전격이 낫을 타고 올라온다.
    ja: 放たれた電撃が鎌を伝わる
  event_goddessfall2_intermission_01_55:
    speaker: harran
    en: Now it's your turn to fall.
    ko: 자, 너도 떨어지거라.
    ja: さあ、お前も落ちなさい。
  event_goddessfall2_intermission_01_56:
    speaker: "<Narration>"
    en: Black powder erupts like an explosion.
    ko: 검은색 가루가 폭발하듯이 터져 나온다.
    ja: 黒い粉末が爆発的に飛び散った
  event_goddessfall2_intermission_01_57:
    speaker: "<Narration>"
    en: The giant centipede's body rusts away in an instant,
    ko: 거대 지네의 신체가 삽시간에 녹슨다.
    ja: |-
      巨大なムカデが飲みこまれ、
      瞬く間に錆びついた
  event_goddessfall2_intermission_01_58:
    speaker: "<Narration>"
    en: crumbling as if weathered by centuries.
    ko: 수백 년의 세월이 지난 듯, 풍화되듯 무너져 내린다.
    ja: |-
      そして数百年が一瞬で経過したかのごとく、
      風化して崩れ去った
  event_goddessfall2_intermission_01_59:
    speaker: "<Narration>"
    en: At the same time, rust begins to spread across Harran's body.
    ko: 그와 동시에, 하란의 몸도 녹슬기 시작한다.
    ja: ハランの体もまた、錆び始めていた
  event_goddessfall2_intermission_01_60:
    speaker: harran
    en: Can my immunity not keep up anymore?
    ko: 내성을 유지하지 못할 정도로 망가진 건가.
    ja: 耐性を保てないほど壊れてしまったのね。
  event_goddessfall2_intermission_01_61:
    speaker: harran
    en: Very well.
    ko: 뭐, 되었다.
    ja: まあ、いいわ。
  event_goddessfall2_intermission_01_62:
    speaker: harran
    en: Johan... my Commander.
    ko: 요한. 나의 지휘관아.
    ja: ヨハン…私たちの指揮官。
  event_goddessfall2_intermission_01_63:
    speaker: johan_op_c
    en: I'm listening.
    ko: 듣고 있다.
    ja: 聞いている。
  event_goddessfall2_intermission_01_64:
    speaker: harran
    en: Have we completed our mission, then?
    ko: 우리의 임무는 완수된 거니?
    ja: 私たちの仕事は終わったかしら？
  event_goddessfall2_intermission_01_65:
    speaker: johan_op_c
    en: Mission complete, Inherit.
    ko: 인헤르트. 임무 완료다.
    ja: インヘルトは作戦目標を完遂した。
  event_goddessfall2_intermission_01_66:
    speaker: harran
    en: I'm glad to hear it.
    ko: 그래. 다행이구나.
    ja: そう。よかったわ。
  event_goddessfall2_intermission_01_67:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_68:
    speaker: harran
    en: I know it may be greedy of me,
    ko: 과욕이라는 건 안단다.
    ja: 強欲だとは分かっているけど…
  event_goddessfall2_intermission_01_69:
    speaker: harran
    en: but for the first and last time, would you bestow upon us that glorious title?
    ko: |-
      하지만 처음이자 마지막으로,
      우리에게 그 영광스런 칭호를 내려줄 수 있겠니?
    ja: |-
      最初で最後だもの…
      私たちにあの称号を授けてくれる？
  event_goddessfall2_intermission_01_70:
    speaker: johan_op_c
    en: Well done,
    ko: 수고 많았다.
    ja: ご苦労だった。
  event_goddessfall2_intermission_01_71:
    speaker: johan_op_c
    en: Goddesses of Victory.
    ko: 승리의 여신들.
    ja: 勝利の女神たちよ。
  event_goddessfall2_intermission_01_72:
    speaker: harran
    en: Heh...
    ko: 후후….
    ja: ふふ…
  event_goddessfall2_intermission_01_73:
    speaker: harran
    en: How... wonderful it is... to hear...
    ko: 그것 참… 듣기에… 좋… 은…
    ja: 悪くない…気分だ…わ…
  event_goddessfall2_intermission_01_74:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_75:
    speaker: harran
    en: Follower... I leave the rest...
    ko: 종자야… 뒤는 부탁….
    ja: 従者…あとは任せ…
  event_goddessfall2_intermission_01_76:
    speaker: "<Narration>"
    en: Harran crumbles into dust and vanishes.
    ko: 하란이 바스러지며 사라진다.
    ja: ハランが塵となって消えた
  event_goddessfall2_intermission_01_77:
    speaker: "<Narration>"
    en: In the next moment, nothing remains.
    ko: 이윽고, 아무것도 남지 않았다.
    ja: 後には何も残らなかった
  event_goddessfall2_intermission_01_78:
    speaker: "<Narration>"
    en: At the same time, the giant centipede also disintegrates.
    ko: 동시에 거대 지네 역시 바스러진다.
    ja: ムカデの姿も塵と化した
  event_goddessfall2_intermission_01_79:
    speaker: "<Narration>"
    en: Freed from the armor that was the centipede, Indivilia begins to fall.
    ko: 거대 지네라는 갑옷이 벗겨진 인디빌리아는 낙하한다.
    ja: |-
      巨大な鎧を失った
      インディビリアが落ちてゆく
  event_goddessfall2_intermission_01_80:
    speaker: "<Narration>"
    en: As she does, she gazes up at the sky—
    ko: 인디빌리아는 떨어지며, 멀어지는 하늘을 바라본다.
    ja: 彼女の目に、遠ざかる空が映った
  event_goddessfall2_intermission_01_81:
    speaker: "<Narration>"
    en: the exploding space station, the falling Queen,
    ko: 터져나가는 스테이션, 떨어지는 퀸.
    ja: 爆発する宇宙ステーション、落ちゆくクイーン
  event_goddessfall2_intermission_01_82:
    speaker: "<Narration>"
    en: and the giant Marian tearing through the Raptures with relentless fury.
    ko: 그리고 랩쳐들에게 공격을 퍼붓는 마리안의 거신.
    ja: |-
      そしてラプチャーを圧倒する
      巨神と化したマリアン
  event_goddessfall2_intermission_01_83:
    speaker: "<Narration>"
    en: For the first time in this battle, the notion of defeat enters Indivilia's
      mind.
    ko: 인디빌리아는 처음으로, 이 전장에서 패배라는 단어를 떠올렸다.
    ja: |-
      この戦いが始まってから始めて、
      インディビリアは敗北という言葉を
      思い浮かべた
  event_goddessfall2_intermission_01_84:
    speaker: "<Narration>"
    en: Elsewhere, Chime drives Trombe at full speed across the battlefield.
    ko: 차임은 트롬베를 몰며 전속력으로 전장을 가로지르고 있었다.
    ja: |-
      トロンベに乗ったチャイムが
      全速力で戦場を駆け抜ける
  event_goddessfall2_intermission_01_85:
    speaker: "<Narration>"
    en: Thunderous crashes and blinding flashes erupt behind her, but she never once
      looks back.
    ko: 뒤에서 요란한 소리들이 들려오고 섬광이 난무했지만 단 한 번도 뒤를 돌아보지 않았다.
    ja: |-
      後方の轟音にも飛び交う閃光にも、
      一度たりとて振り返らなかった
  event_goddessfall2_intermission_01_86:
    speaker: "<Narration>"
    en: Clinging desperately to what remains of Crown's tattered upper body in the
      seat ahead, she presses the ruined form close.
    ko: 차임은 앞에 앉은 크라운의 너덜거리는 상반신을 필사적으로 붙잡고, 몸쪽으로 붙이고 있었다.
    ja: |-
      チャイムは前にもたれるクラウンの
      垂れ下がった上半身を必死に支え、
      胴体に押し付けていた
  event_goddessfall2_intermission_01_87:
    speaker: "<Narration>"
    en: It seems impossible to hold on, yet Chime refuses to let go.
    ko: 붙을 리는 없다. 그럼에도 차임은 손에 힘을 놓지 않았다.
    ja: |-
      それで接着できるはずもない。
      だが、チャイムは必死に力を加え続けた
  event_goddessfall2_intermission_01_88:
    speaker: chime
    en: Your Highness! I pray thee, hold on... but a little longer!
    ko: 아가씨! 조금만… 조금만 참아주십시오!
    ja: |-
      お嬢さま！あと少し…
      あと少しの辛抱でございます！
  event_goddessfall2_intermission_01_89:
    speaker: chime
    en: We shall anon reach where Rapunzel dwelleth!
    ko: 곧 라푼젤이 있는 곳에 도착합니다요!
    ja: すぐにラプンツェルのもとへ参ります！
  event_goddessfall2_intermission_01_90:
    speaker: crown
    en: Chi... me... *Cough*
    ko: 차… 임… 쿨럭.
    ja: チャ…イム…ゲホッ。
  event_goddessfall2_intermission_01_91:
    speaker: chime
    en: Aye! Aye, Your Highness! I am listening!
    ko: 예! 예 아가씨! 듣고 있습니다요!
    ja: はい！聞いております！お嬢さま！
  event_goddessfall2_intermission_01_92:
    speaker: "<Narration>"
    en: Crown grabs Chime's hand.
    ko: 크라운이 차임의 손을 잡았다.
    ja: クラウンがチャイムの手を握った
  event_goddessfall2_intermission_01_93:
    speaker: "<Narration>"
    en: Feeling the lack of strength in Crown's grasp, Chime struggles to hold back
      the sobs threatening to spill.
    ko: 힘이 느껴지지 않는 손끝에, 차임은 울음이 터져 나오려는 것을 필사적으로 참았다.
    ja: |-
      指先の力が感じられず、
      チャイムは泣き出しそうになるのを
      必死にこらえた
  event_goddessfall2_intermission_01_94:
    speaker: "<Narration>"
    en: Meanwhile, Trombe presses onward.
    ko: 트롬베가 달린다.
    ja: トロンベは駆け続けた
  event_goddessfall2_intermission_01_95:
    speaker: "<Narration>"
    en: Not far ahead, Snow White, Scarlet, and Rapunzel come into view.
    ko: 멀지 않은 곳, 스노우 화이트, 홍련, 라푼젤이 보인다.
    ja: |-
      そう遠くない場所に、スノーホワイト、紅蓮、
      そしてラプンツェルの姿が見えた
  event_goddessfall2_intermission_01_96:
    speaker: chime
    en: W-we are nigh there, Your Highness!
    ko: 다, 다 왔습니다요 아가씨!
    ja: あ、あと少しでございます、お嬢さま！
  event_goddessfall2_intermission_01_97:
    speaker: chime
    en: Just a little more, pray endure a moment longer...!
    ko: 조금만, 조금만 참…!
    ja: 今しばらくの辛抱を――！
  event_goddessfall2_intermission_01_98:
    speaker: "<Narration>"
    en: Suddenly, Chime remembers the conversation she had with them before charging
      in.
    ko: 차임은 갑자기 진입 전, 그들과 나눴던 대화를 기억했다.
    ja: |-
      作戦開始前の会話が、
      チャイムの脳裏をよぎった
  event_goddessfall2_intermission_01_99:
    speaker: nayuta
    en: White Snow, Young Lady Scarlet, and Persinette, pray remain as far removed
      from the battlefield as ye may.
    ko: 백설 소저, 홍련 소저, 금장발 소저는 최대한 전장과 떨어진 곳에서 대기해 주시오.
    ja: |-
      あなたがた3名は、できるだけ戦場から
      離れた場所で待機してください。
  event_goddessfall2_intermission_01_100:
    speaker: rapunzel
    en: Are you saying we're supposed to just sit back until then?
    ko: 그 말은, 그전까지 우리는 소극적으로 대응만 하시라는 얘기인가요?
    ja: まさか、戦闘は最小限にするということですか？
  event_goddessfall2_intermission_01_101:
    speaker: rapunzel
    en: We've already given up on defending Eden. Now that the shield's down, there's
      no reason for us not to be sent in...
    ko: |-
      에덴의 방어는 포기했잖아요.
      실드도 거둬들인 마당에 저희가 투입되지 않을 이유는….
    ja: |-
      エデンの防衛は捨てていますし、
      シールド展開の必要もありません。
      私たちを戦線に投入しない理由は…
  event_goddessfall2_intermission_01_102:
    speaker: nayuta
    en: "'Tis for naught else but to face the Queen."
    ko: 퀸을 상대하기 위함이외다.
    ja: クイーンにぶつけるためです。
  event_goddessfall2_intermission_01_103:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_104:
    speaker: nayuta
    en: "... This may well become a war of attrition. Grievous losses shall we endure,"
    ko: |-
      …아마도, 소모전이 될 것이오.
      우리측이 잃는 것이 많겠지.
    ja: |-
      …間違いなく、消耗戦になります。
      こちらが失うものの方が多いはず。
  event_goddessfall2_intermission_01_105:
    speaker: nayuta
    en: yet the Queen is fated to fall unto the surface.
    ko: 하지만 반드시 퀸은 지상에 떨어지오.
    ja: しかし、クイーンは必ず地上に落ちる。
  event_goddessfall2_intermission_01_106:
    speaker: nayuta
    en: Naught know we of her true capabilities.
    ko: 퀸의 능력은 미지수 그 자체요. 아무것도 모르오.
    ja: |-
      その能力は未知数です。
      誰にも分かっておりません。
  event_goddessfall2_intermission_01_107:
    speaker: nayuta
    en: Thus, none but ye three may confront her.
    ko: 그걸 상대할 수 있는 것은, 소저들 셋 이외에는 없소이다.
    ja: |-
      相手にできる戦力があるとすれば、
      あなた方のほかにない。
  event_goddessfall2_intermission_01_108:
    speaker: nayuta
    en: I beseech thee, preserve thy strength until that appointed hour.
    ko: 그러니 만전의 상태를 유지해 주시오.
    ja: ですから、万全の状態を保ってください。
  event_goddessfall2_intermission_01_109:
    speaker: hongryeon
    en: Are we then to do naught but stand idle and behold?
    ko: 그때까지 지켜보고만 있으라는 얘기인가.
    ja: それまで、座して見ていろというのかね？
  event_goddessfall2_intermission_01_110:
    speaker: nayuta
    en: "... So it is."
    ko: "…그렇소."
    ja: "…そうなります。"
  event_goddessfall2_intermission_01_111:
    speaker: rapunzel
    en: How can we do that when everyone is out there risking their lives?!
    ko: 모두가 목숨을 걸고 싸우고 있는 마당에 그럴 수는…!
    ja: |-
      誰もが命懸けで戦っている時に、
      そんなことは…！
  event_goddessfall2_intermission_01_112:
    speaker: crown
    en: You have greater matters to attend to.
    ko: 여러분은 더 큰 일을 해줘야 합니다.
    ja: あなた方には果たすべき大業があるのです。
  event_goddessfall2_intermission_01_113:
    speaker: crown
    en: Leave the lesser ones to us.
    ko: 잡졸은 저희에게 맡겨주세요.
    ja: 露払いは私たちにお任せを。
  event_goddessfall2_intermission_01_114:
    speaker: crown
    en: See to it that the Queen is defeated.
    ko: 그러니 여러분은 반드시 퀸을 쓰러뜨려 주세요.
    ja: |-
      必ずクイーンを討ち果たすことが、
      あなた方の勤めです。
  event_goddessfall2_intermission_01_115:
    speaker: chime
    en: Had the Naked King been fully charged, it would have sufficed for Her Highness
      alone...
    ko: 네이키드 킹만 충전되어 있었다면 아가씨 혼자만으로도 충분했겠지만….
    ja: |-
      ネイキッドキングさえ使えれば、
      お嬢さまお一人で十分だったのだが…
  event_goddessfall2_intermission_01_116:
    speaker: chime
    en: but 'tis as it is, so I shall yield for now.
    ko: 어쩔 수 없으니 지금은 양보해 주마.
    ja: やむを得ん、今回は譲ってやるのだ。
  event_goddessfall2_intermission_01_117:
    speaker: chime
    en: See that thou triumphest.
    ko: 꼭 이기거라.
    ja: ただし、絶対勝つのだ。
  event_goddessfall2_intermission_01_118:
    speaker: chime
    en: I trust in thee.
    ko: 믿겠다.
    ja: お前たちを信じるのだ。
  event_goddessfall2_intermission_01_119:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_120:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_121:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_122:
    speaker: snowwhite
    en: Without fail.
    ko: 반드시.
    ja: 必ず。
  event_goddessfall2_intermission_01_123:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_124:
    speaker: crown
    en: Chi... me...
    ko: 차… 임….
    ja: チャ…イム…
  event_goddessfall2_intermission_01_125:
    speaker: "<Narration>"
    en: Crown tightens her grip on Chime's hand,
    ko: 크라운이 차임의 손을 더욱 강하게 잡는다.
    ja: チャイムの手を握るクラウンの力が強くなった
  event_goddessfall2_intermission_01_126:
    speaker: "<Narration>"
    en: with all the strength she can muster.
    ko: 아마도 크라운이 현재 낼 수 있는 가장 큰 힘일 것이다.
    ja: |-
      おそらく、これがクラウンに残っている
      全力なのだろう
  event_goddessfall2_intermission_01_127:
    speaker: chime
    en: I unde... I understand, Your Highness.
    ko: 알겠… 알겠습니다요 아가씨.
    ja: か…かしこまりました…お嬢さま。
  event_goddessfall2_intermission_01_128:
    speaker: kilo_op_l
    en: "... Chime, here."
    ko: "…차임. 이걸."
    ja: "…チャイム、これを。"
  event_goddessfall2_intermission_01_129:
    speaker: "<Narration>"
    en: T.A.L.O.S. produces some camouflage tarp from its backpack.
    ko: 탈로스의 백팩에서 위장포가 나온다.
    ja: タロスのバックパックから迷彩柄の布が出てきた
  event_goddessfall2_intermission_01_130:
    speaker: "<Narration>"
    en: Chime takes it and covers Crown's torso.
    ko: 차임은 그것을 받아, 크라운의 상체를 덮었다.
    ja: |-
      チャイムはそれを受け取り、
      クラウンの上半身を隠した
  event_goddessfall2_intermission_01_131:
    speaker: crown
    en: My... thanks.
    ko: 고마… 워요.
    ja: ええ…感謝します。
  event_goddessfall2_intermission_01_132:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_133:
    speaker: "<Narration>"
    en: Trombe skids to a halt before the Pioneers.
    ko: 트롬베가 파이오니아 앞에 멈춘다.
    ja: トロンベがパイオニアの面前で立ち止まった
  event_goddessfall2_intermission_01_134:
    speaker: chime
    en: "... Good grief, what an easy life you've got."
    ko: "…팔자 좋은 녀석들이구나."
    ja: "…まったく、いいご身分なのだ。"
  event_goddessfall2_intermission_01_135:
    speaker: chime
    en: The Queen hath fallen. Go on, fetch her head at once.
    ko: 퀸이 떨어졌다. 얼른 가서 퀸의 목을 가져오거라.
    ja: |-
      クイーンは地上に落ちたのだ。
      早く行って、やつの首をとるのだ。
  event_goddessfall2_intermission_01_136:
    speaker: snowwhite
    en: We will.
    ko: 물론이다.
    ja: 言うまでもない。
  event_goddessfall2_intermission_01_137:
    speaker: hongryeon
    en: "'Tis about time we toddle off."
    ko: 이제 슬슬 가지.
    ja: 行くとしようか。
  event_goddessfall2_intermission_01_138:
    speaker: rapunzel
    en: "... Is Crown all right?"
    ko: "…크라운은 괜찮나요?"
    ja: "…クラウンもご無事ですか？"
  event_goddessfall2_intermission_01_139:
    speaker: chime
    en: Ah, worry not. She hath merely gone to cool herself after exerting far too
      much.
    ko: |-
      아아. 걱정말거라.
      너무 격하게 활약하셔서 잠깐 몸을 식히러 가는 길이다.
    ja: |-
      ああ、心配いらないのだ。
      獅子奮迅の大活躍をされた後で、
      少しお休みいただいているだけなのだ。
  event_goddessfall2_intermission_01_140:
    speaker: chime
    en: Linger not, lest Her Highness return and take the Queen's head herself! If
      thou wouldst keep thy glory, make haste, I say.
    ko: |-
      머뭇대다간 복귀한 아가씨께서 퀸의 목을 칠 것이니,
      공을 빼앗기고 싶지 않다면 서두르거라.
    ja: |-
      グズグズしてたら、休み終わったお嬢さまが
      クイーンの首をとってしまうのだ。
      手柄を奪われたくなければ急ぐのだ。
  event_goddessfall2_intermission_01_141:
    speaker: hongryeon
    en: That shall not do. Let us make haste.
    ko: 그건 싫군. 바로 가겠네.
    ja: それはたまらないねえ。急ぐとしよう。
  event_goddessfall2_intermission_01_142:
    speaker: chime
    en: Righty-o, off with thee!
    ko: 그래그래. 얼른 가거라.
    ja: うむ。さっさとするのだ！
  event_goddessfall2_intermission_01_143:
    speaker: snowwhite
    en: We'll be back.
    ko: 다녀오겠다.
    ja: 行ってくる。
  event_goddessfall2_intermission_01_144:
    speaker: "<Narration>"
    en: Snow White, Scarlet, and Rapunzel move forward,
    ko: 스노우 화이트, 홍련, 라푼젤이 앞으로 걸어 나간다.
    ja: |-
      スノーホワイト、紅蓮、
      ラプンツェルが前に踏み出し…
  event_goddessfall2_intermission_01_145:
    speaker: "<Narration>"
    en: crouching low as they run.
    ko: 자세를 숙이고 달려 나간다.
    ja: 腰を落とした姿勢で、戦場に駆けていった
  event_goddessfall2_intermission_01_146:
    speaker: "<Narration>"
    en: Chime watches them and shouts loudly.
    ko: 차임은 그 모습을 바라보며, 크게 외쳤다.
    ja: チャイムは背中を見送り、大声で叫んだ
  event_goddessfall2_intermission_01_147:
    speaker: chime
    en: Thou...! Must win...!
    ko: 꼭…! 이기거라…!
    ja: 勝つのだ…！必ず…！
  event_goddessfall2_intermission_01_148:
    speaker: chime
    en: Absolutely! Absolutely! Absolutely must win!
    ko: 반드시! 반드시다! 반드시 이겨라!
    ja: 絶対に！絶対に！絶対に勝つのだ！
  event_goddessfall2_intermission_01_149:
    speaker: chime
    en: Dost thou hear meee?!
    ko: 알겠느냐아아--!!
    ja: 分かってるのだぁぁ！？
  event_goddessfall2_intermission_01_150:
    speaker: "<Narration>"
    en: Snow White gives a thumbs up.
    ko: 스노우 화이트가 엄지손가락을 치켜세운다.
    ja: スノーホワイトが親指を立てた
  event_goddessfall2_intermission_01_151:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_152:
    speaker: chime
    en: Let us go to Eden! I shall make use of the infirmary!
    ko: 에덴으로 가자꾸나! 의무실을 쓰겠다!
    ja: エデンに向かうのだ！医務室を使うのだ！
  event_goddessfall2_intermission_01_153:
    speaker: kilo
    en: Got it!
    ko: 예!
    ja: はい！
  event_goddessfall2_intermission_01_154:
    speaker: nayuta
    en: Verily, I shall take a look.
    ko: 소인이 보겠소.
    ja: 私が診ましょう。
  event_goddessfall2_intermission_01_155:
    speaker: chime
    en: Nayuta...!
    ko: 나유타…!
    ja: ナユタ…！
  event_goddessfall2_intermission_01_156:
    speaker: nayuta
    en: Though I may possess not Persinette's skill in the healing arts,
    ko: 금장발 소저만큼은 안 되겠지만 응급처치 정도는 가능하외다.
    ja: |-
      髪長には及びませんが、
      応急処置程度はできます。
  event_goddessfall2_intermission_01_157:
    speaker: nayuta
    en: I can tend to urgent wounds and see her safely borne to Eden.
    ko: 급한 불만 끄고 에덴으로 옮기겠소.
    ja: 処置を済ませてから、エデンへ運びましょう。
  event_goddessfall2_intermission_01_158:
    speaker: chime
    en: "... Your Highness."
    ko: "…아가씨."
    ja: "…お嬢さま。"
  event_goddessfall2_intermission_01_159:
    speaker: crown
    en: Do not... worry.
    ko: 걱정마… 요.
    ja: 心配は…いりませんわ。
  event_goddessfall2_intermission_01_160:
    speaker: chime
    en: "... Very well, it is."
    ko: "…알겠습니다요."
    ja: "…分かっております。"
  event_goddessfall2_intermission_01_161:
    speaker: chime
    en: Though combat be not my forte, I shall return anon, and smite at least one
      Rapture's head myself, I swear.
    ko: 이 차임. 비록 전투는 특기가 아니지만 돌아가서 랩쳐 한 놈의 목이라도 치겠습니다요.
    ja: |-
      不肖チャイム、戦いは専門外でございますが、
      せめて一つでもラプチャーの首を…！
  event_goddessfall2_intermission_01_162:
    speaker: crown
    en: He... re...
    ko: 이… 걸.
    ja: これ…を。
  event_goddessfall2_intermission_01_163:
    speaker: "<Narration>"
    en: Crown extends her hand toward Chime,
    ko: 크라운이 차임에게 손을 내민다.
    ja: クラウンがチャイムに手を伸ばした
  event_goddessfall2_intermission_01_164:
    speaker: "<Narration>"
    en: who reaches out and takes what is offered.
    ko: 차임은 손을 내밀어 그것을 받는다.
    ja: チャイムは手の中のものを受け取った
  event_goddessfall2_intermission_01_165:
    speaker: chime
    en: This... may be...
    ko: 이… 건….
    ja: これ…は…
  event_goddessfall2_intermission_01_166:
    speaker: crown
    en: lacking... but... just this once...
    ko: 부족… 하지만… 한 번은….
    ja: 足りず…とも…一度なら…
  event_goddessfall2_intermission_01_167:
    speaker: chime
    en: N-no, I can't, Your Highness! How could I ever dare...!
    ko: 아, 안됩니다요 아가씨! 제가 어찌 감히…!
    ja: い、いけません、お嬢さま！私などには…！
  event_goddessfall2_intermission_01_168:
    speaker: crown
    en: Because it's you... you can.
    ko: 차임이니까… 할 수 있어요.
    ja: チャイムにしか…できませんわ。
  event_goddessfall2_intermission_01_169:
    speaker: crown
    en: Chime, you are... my aide... and the finest... in all of Crown Kingdom...
    ko: 차임은 제… 비서이자… 가장 훌륭한… 크라운 왕국의….
    ja: |-
      チャイムは私の…秘書であり…
      最も素晴らしい…クラウン王国の…
  event_goddessfall2_intermission_01_170:
    speaker: crown
    en: "*Cough*"
    ko: 쿨럭.
    ja: ゲホッ…
  event_goddessfall2_intermission_01_171:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_172:
    speaker: chime
    en: V-very well. I shall try.
    ko: 아, 알겠습니다요. 해보겠습니다요.
    ja: |-
      か、かしこまりました。
      やってみるのでございます！
  event_goddessfall2_intermission_01_173:
    speaker: chime
    en: "... No! I shall accomplish it!"
    ko: "…아니! 반드시 해내겠습니다요!"
    ja: "…いいえ！必ずやり遂げてご覧に入れます！"
  event_goddessfall2_intermission_01_174:
    speaker: crown
    en: I believe in you, Chime.
    ko: 믿어요. 차임.
    ja: 信じていますわ、チャイム。
  event_goddessfall2_intermission_01_175:
    speaker: chime
    en: Right!
    ko: 예!
    ja: ははぁっ！
  event_goddessfall2_intermission_01_176:
    speaker: chime
    en: Kilo! Away we go!
    ko: 킬로! 가자꾸나!
    ja: キロ！行くのだ！
  event_goddessfall2_intermission_01_177:
    speaker: kilo_op_l
    en: "... Yes!"
    ko: "…예!"
    ja: "…はい！"
  event_goddessfall2_intermission_01_178:
    speaker: kilo_op_l
    en: You're Nayuta, right?
    ko: 나유타라고 했었나요?
    ja: ナユタ…でしたよね？
  event_goddessfall2_intermission_01_179:
    speaker: kilo_op_l
    en: Please take good care of Crown.
    ko: 크라운을 잘 부탁드릴게요.
    ja: クラウンのこと、どうかお願いします。
  event_goddessfall2_intermission_01_180:
    speaker: kilo_op_l
    en: She's the one who showed me where I truly belong... and someone really precious
      to me.
    ko: 저에게 있어야 할 곳을 알려준… 정말 소중한 분이세요.
    ja: |-
      私に居るべき場所を教えてくれた…
      本当に大切な方なんです。
  event_goddessfall2_intermission_01_181:
    speaker: kilo_op_l
    en: I'm counting on you!
    ko: 잘 부탁드립니다!
    ja: お願いします！
  event_goddessfall2_intermission_01_182:
    speaker: nayuta
    en: Understood. I shall see to it mineself that she liveth, verily.
    ko: 알겠소. 소인이 책임지고 반드시 살리겠소.
    ja: |-
      承りました。
      責任を持って治療にあたります。
  event_goddessfall2_intermission_01_183:
    speaker: "<Narration>"
    en: Chime, Kilo, and T.A.L.O.S. nod and dash onto the battlefield without a moment's
      hesitation.
    ko: |-
      고개를 끄덕인 차임과 킬로, 탈로스는
      한 치의 망설임 없이 전장으로 달려 나갔다.
    ja: |-
      うなずいたチャイム、キロとタロスは
      わずかな迷いも見せず、戦場へ戻っていった
  event_goddessfall2_intermission_01_184:
    speaker: "<Narration>"
    en: Meanwhile, Nayuta watches them quietly.
    ko: 나유타는 그 모습을 물끄러미 바라본다.
    ja: ナユタはその背中を静かに見送った
  event_goddessfall2_intermission_01_185:
    speaker: nayuta
    en: "... Now then, Young Lady Crown, pray endure but a little longer."
    ko: "…자, 크라운 소저. 조금만 참아주시오."
    ja: |-
      …さあ、私たちも行きましょう。
      もう少しの辛抱です。
  event_goddessfall2_intermission_01_186:
    speaker: nayuta
    en: This humble one shall exert all mine utmost strength to grasp thy thread of
      life.
    ko: 소인이 전력을 다해 명줄을 붙잡겠소.
    ja: 私の全力をもって命を繋ぎ止めてみせましょう。
  event_goddessfall2_intermission_01_187:
    speaker: crown
    en: Nayu... ta.
    ko: 나유… 타.
    ja: ナユ…タ。
  event_goddessfall2_intermission_01_188:
    speaker: crown
    en: Why do you... merely stand and watch?
    ko: 당신은 왜… 바라만 보나요.
    ja: なぜ…距離を置こうとするのです。
  event_goddessfall2_intermission_01_189:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_190:
    speaker: crown
    en: Why... do you not run out to join them?
    ko: 왜… 달려 나가지 않나요.
    ja: なぜ…並び立とうとしないのですか。
  event_goddessfall2_intermission_01_191:
    speaker: nayuta
    en: "... Pray, refrain from discourse. I must needs devote myself wholly to thy
      treatment."
    ko: "…자, 더 말하지 마시오. 소인 치료에 집중해야 하니."
    ja: |-
      …しゃべろうとしないでください。
      今は安静に。
  event_goddessfall2_intermission_01_192:
    speaker: crown
    en: Are you... afraid?
    ko: 두려운… 가요.
    ja: 恐れ…ですか。
  event_goddessfall2_intermission_01_193:
    speaker: crown
    en: You know so much... yet you cannot decide.
    ko: 많은 걸 알고 있… 지만 결정할 수 없나요.
    ja: 多くを知りながら…決められないのですか。
  event_goddessfall2_intermission_01_194:
    speaker: crown
    en: Is that why you keep... keep... standing by?
    ko: 그래서 계속… 계속… 방관만 하는 건가요.
    ja: ただ…遠くから…眺めているだけなのは。
  event_goddessfall2_intermission_01_195:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_196:
    speaker: nayuta
    en: Verily, I am beset with fear. To know more than others doth not ever bring
      advantage.
    ko: |-
      그렇소. 소인은 두렵소.
      남들보다 많이 아는 것이 좋기만은 한 것이 아니외다.
    ja: |-
      いかにも。私は恐れている。
      知りすぎるのも考えものですねぇ。
  event_goddessfall2_intermission_01_197:
    speaker: nayuta
    en: Should matters go awry... I do fear the fault shall rest upon me.
    ko: 일이 잘못되면… 그것조차 소인의 잘못인 것 같아서, 두렵소.
    ja: |-
      何かあれば…すべては自分のせいという
      気がして、怖くなるのです。
  event_goddessfall2_intermission_01_198:
    speaker: nayuta
    en: Therefore... I am unable to decide.
    ko: 그래서… 결정을 하지… 못 하겠소.
    ja: そうして…決めかねています。
  event_goddessfall2_intermission_01_199:
    speaker: crown
    en: Hmm... how clever... of you.
    ko: 헛… 똑똑이… 로군요.
    ja: うわべだけ…ですわね。
  event_goddessfall2_intermission_01_200:
    speaker: nayuta
    en: "... So it would seem."
    ko: "…그런가 보오."
    ja: "…返す言葉もありません。"
  event_goddessfall2_intermission_01_201:
    speaker: crown
    en: Nayu... ta...
    ko: 나유… 타.
    ja: ナユ…タ…
  event_goddessfall2_intermission_01_202:
    speaker: crown
    en: Merely standing by and watching... won't change... a thing.
    ko: 보고만 있어서는… 아무것도 바뀌지 않… 아요.
    ja: 見ているだけでは…変えられません…何も…
  event_goddessfall2_intermission_01_203:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_intermission_01_204:
    speaker: nayuta
    en: Verily, I am aware.
    ko: 소인도 알고 있소.
    ja: 知っています。
  event_goddessfall2_intermission_01_205:
    speaker: papillon
    en: Huff...! Huff...!
    ko: 하아…! 하아…!
    ja: ハァ…！ハァ…！
  event_goddessfall2_intermission_01_206:
    speaker: "<Narration>"
    en: Papillon sprints across the surface,
    ko: 파피용이 지상을 달리고 있다.
    ja: パピヨンが地上を走る
  event_goddessfall2_intermission_01_207:
    speaker: "<Narration>"
    en: constantly checking the safe route displayed on her phone.
    ko: 핸드폰에 띄워진 안전 루트를 확인하며 계속해서 달린다.
    ja: |-
      携帯端末が示す逃走ルートを頼りに
      ただひたすら足を動かしていた
  event_goddessfall2_intermission_01_208:
    speaker: papillon
    en: Huff...! Huff...!
    ko: 하아…! 하아…!
    ja: ハァ…！ハァ…！
  event_goddessfall2_intermission_01_209:
    speaker: "<Narration>"
    en: The safe route Isabel gave her has proven reliable. She hasn't run into a
      single Rapture so far.
    ko: |-
      이사벨이 준 안전 루트는 확실했다.
      지금껏 단 한 번도 랩쳐와 마주치지 않았다.
    ja: |-
      イサベルの情報は正確だったようだ。
      ここまで一度もラプチャーと遭遇していない
  event_goddessfall2_intermission_01_210:
    speaker: "<Narration>"
    en: At this pace, she's confident she'll make it to the Ark without incident.
    ko: 이대로만 간다면 방주까지는 무리 없이 갈 수 있을 것 같다는 확신이 들었다.
    ja: |-
      この調子なら、難なくアークまで
      たどり着けるだろうという確信が生まれた
  event_goddessfall2_intermission_01_211:
    speaker: papillon
    en: Hah...! Haha...! Ahahaha...!
    ko: 하아…! 하하…! 아하하하…!
    ja: はぁ…！はは…！あははは…！
  event_goddessfall2_intermission_01_212:
    speaker: papillon
    en: Hahahahahaha!
    ko: 하하하하하!
    ja: あはははは！
  event_goddessfall2_intermission_01_213:
    speaker: "<Narration>"
    en: Papillon laughs.
    ko: 파피용은 웃었다.
    ja: パピヨンは笑った
  event_goddessfall2_intermission_01_214:
    speaker: papillon
    en: Hahaha! Those idiots...!
    ko: |-
      하하하!
      그 바보들…!
    ja: |-
      あはは！
      バカな人たち…！
  event_goddessfall2_intermission_01_215:
    speaker: papillon
    en: Those lunatics...!
    ko: 그 미친것들…!
    ja: ホント、おかしいったら…！
  event_goddessfall2_intermission_01_216:
    speaker: papillon
    en: I show them a little kindness, and they're ready to give me everything...
      Haha!
    ko: 조금 잘 해줬더니 간이며 쓸개며 다 빼주려고… 하하!
    ja: |-
      ちょっと親切にしてあげるだけで、
      何でもホイホイ出しちゃって…あはは！
  event_goddessfall2_intermission_01_217:
    speaker: papillon
    en: Honestly, it's almost too easy!
    ko: 진짜, 진짜 쉽다니까!
    ja: 甘いわ、甘すぎるのよ！
  event_goddessfall2_intermission_01_218:
    speaker: papillon
    en: I knew it...! Lady Luck's on my side!
    ko: 역시 난…! 운이 좋아!
    ja: やっぱり私は…！ツイてるわ！
  event_goddessfall2_intermission_01_219:
    speaker: papillon
    en: Hahahaha!
    ko: 하하하하!
    ja: あははははは！
event_goddessfall2_04_s:
  event_goddessfall2_04_s_1:
    speaker: "<Narration>"
    en: Papillon runs
    ko: 파피용은 달린다.
    ja: パピヨンは走り続けた
  event_goddessfall2_04_s_2:
    speaker: "<Narration>"
    en: as she recalls the events before she escaped from Eden.
    ko: 그리고 에덴에서 빠져나오기 전의 일을 회상했다.
    ja: |-
      道すがら、エデンを離れる前の
      出来事を思い返した
  event_goddessfall2_04_s_3:
    speaker: papillon
    en: I'll be running away.
    ko: 나는 도망갈 거야.
    ja: 私、出ていくわ。
  event_goddessfall2_04_s_4:
    speaker: cecil
    en: I see.
    ko: 그렇군요.
    ja: そうですか。
  event_goddessfall2_04_s_5:
    speaker: cecil
    en: Has Isabel provided you with the safe route?
    ko: 이사벨에게 안전 루트는 전해 받았나요?
    ja: イサベルに脱出ルートのことは聞いていますか？
  event_goddessfall2_04_s_6:
    speaker: papillon
    en: "... You knew?"
    ko: "…알고 있었어?"
    ja: "…知ってたの？"
  event_goddessfall2_04_s_7:
    speaker: cecil
    en: Of course. I'm the one who plotted the route.
    ko: 예. 루트는 제가 짰으니까요.
    ja: ええ。私が検討したルートですから。
  event_goddessfall2_04_s_8:
    speaker: papillon
    en: "... Oh, right."
    ko: "…그래."
    ja: "…そうだったの。"
  event_goddessfall2_04_s_9:
    speaker: cecil
    en: Farewell. There's much I'd prefer you not disclose when you return, but I
      doubt it matters anymore.
    ko: |-
      잘 가요. 돌아가서 발설하지 말았으면 하는 게 많은데,
      딱히 의미는 없겠네요.
    ja: |-
      お気をつけて。
      口外してほしくない情報は多いですが、
      もう口封じは意味がないでしょう。
  event_goddessfall2_04_s_10:
    speaker: cecil
    en: Whether you speak of it or not is entirely up to you.
    ko: 말하고 말고는 당신의 자유니까요.
    ja: どうするかは、あなたが決めることです。
  event_goddessfall2_04_s_11:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_12:
    speaker: papillon
    en: Aren't you going to stop me?
    ko: 안 붙잡아?
    ja: 引き止めないの？
  event_goddessfall2_04_s_13:
    speaker: cecil
    en: Do you want me to?
    ko: 붙잡아 줬으면 하나요?
    ja: 止めてほしいのですか？
  event_goddessfall2_04_s_14:
    speaker: papillon
    en: I'm not sure.
    ko: 글쎄.
    ja: さあ。
  event_goddessfall2_04_s_15:
    speaker: cecil
    en: For a hostage, you were surprisingly helpful.
    ko: 인질로 있던 것 치곤 많이 도와줬어요.
    ja: |-
      人質扱いしていたにも関わらず、
      ずいぶん助けていただきました。
  event_goddessfall2_04_s_16:
    speaker: cecil
    en: I appreciate that, but no further involvement will be permitted.
    ko: 고맙죠. 하지만 더 이상은 안 돼요.
    ja: ありがたいことですが、それ以上は望めません。
  event_goddessfall2_04_s_17:
    speaker: papillon
    en: Aw, c'mon, you could have said something like, "Now that we're comrades, how
      about risking your life for us just this once?"
    ko: |-
      왜? [에이~ 우리 동료니까 목숨 한 번 걸어주라? 응?]
      이렇게 얘기할 수 있잖아.
    ja: |-
      そう？
      「仲間でしょ～最期までつきあって～」
      ぐらい言えるんじゃない？
  event_goddessfall2_04_s_18:
    speaker: cecil
    en: I don't speak in such a saccharine fashion.
    ko: 저는 그렇게 아양 떨면서 얘기하지 않아요.
    ja: 私はそのように媚びた話し方をしません。
  event_goddessfall2_04_s_19:
    speaker: papillon
    en: Saccharine...?!
    ko: 아양…!
    ja: 媚びたって、あんたね…！
  event_goddessfall2_04_s_20:
    speaker: cecil
    en: Moreover, one cannot compel another to risk their life.
    ko: 그리고 목숨을 걸어달라는 말은 강요할 수 없어요.
    ja: |-
      それに、他人に命をかけろと
      強いることなどできません。
  event_goddessfall2_04_s_21:
    speaker: cecil
    en: Only you can determine the value of your own life.
    ko: 자기 목숨의 가치는 자기가 정할 수 있는 거니까요.
    ja: 自分の命の価値は、自分自身が決めるものです。
  event_goddessfall2_04_s_22:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_23:
    speaker: papillon
    en: So, you're fine with putting your life on the line here?
    ko: 그럼 너희 목숨은, 여기서 거는 걸로 괜찮아?
    ja: |-
      じゃ、あなたたちは、
      ここでかけるってことでいいの？
  event_goddessfall2_04_s_24:
    speaker: papillon
    en: That's how much you think your life is worth?
    ko: 너희 목숨의 가치를 그렇게 정했어?
    ja: これが命の使い時ってこと？
  event_goddessfall2_04_s_25:
    speaker: cecil
    en: Yes, that is my decision.
    ko: 예. 그렇게 정했어요.
    ja: はい。そう決めました。
  event_goddessfall2_04_s_26:
    speaker: papillon
    en: "... Cecil, I'll be frank. Wouldn't it be smarter to fall back, regroup, and
      then fight again?"
    ko: |-
      …세실. 냉정하게 말할게.
      퇴각한 다음에 재정비하고 다시 싸우는 게 낫지 않아?
    ja: |-
      …セシル、はっきり言わせてもらうけど…
      逃げて体勢を立て直してから
      また戦った方がいいんじゃない？
  event_goddessfall2_04_s_27:
    speaker: papillon
    en: This isn't your only chance, after all.
    ko: 기회가 지금만 있는 건 아닐 거 아냐.
    ja: チャンスなんて今だけじゃないでしょ。
  event_goddessfall2_04_s_28:
    speaker: cecil
    en: No, this is our only chance. While they fear us, there is much we can accomplish.
    ko: |-
      지금밖에 없어요.
      저쪽이 우릴 겁낼 때 할 수 있는 게 많을 테니까요.
    ja: |-
      いいえ、今しかありません。
      私たちが恐れられている時にしか
      できないことは多いですから。
  event_goddessfall2_04_s_29:
    speaker: cecil
    en: To retreat would be to reveal our hand, and then next time, they would act
      far more boldly.
    ko: |-
      퇴각한다는 건 밑천이 드러난다는 얘기예요.
      그럼 저쪽은 다음에 훨씬 과감하게 움직이겠죠.
    ja: |-
      一度退けば、こちらの限界を知られます。
      そうなれば、不必要な警戒など
      しなくなるでしょう。
  event_goddessfall2_04_s_30:
    speaker: cecil
    en: And the Queen has already taken considerable damage. There's no guarantee
      we'll ever be able to inflict this much harm on her again.
    ko: |-
      그리고 지금 퀸은 피해가 제법 커요.
      다음에도 이만큼 해낼 수 있을지 의문이죠.
    ja: |-
      それに今、クイーンは
      大きなダメージを受けています。
      次もここまで追いつめられる保証はありません。
  event_goddessfall2_04_s_31:
    speaker: papillon
    en: "... Why are you all going to such lengths?"
    ko: "…너희. 왜 이렇게까지 하는 거야?"
    ja: "…あなたたち、なんでそこまでするの？"
  event_goddessfall2_04_s_32:
    speaker: papillon
    en: Th-this is strange. What can possibly be more important than your own lives...?
    ko: 이, 이상하잖아. 목숨보다 중요한 게 어딨다고 이렇게까지….
    ja: |-
      だって、おかしいでしょ？
      命より大事なものなんてないのに…
  event_goddessfall2_04_s_33:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_34:
    speaker: cecil
    en: Who knows?
    ko: 글쎄요.
    ja: なぜでしょうね。
  event_goddessfall2_04_s_35:
    speaker: cecil
    en: Perhaps it's just as you said,
    ko: 당신의 말대로.
    ja: あなたが言った通り…
  event_goddessfall2_04_s_36:
    speaker: cecil
    en: we've all gone mad.
    ko: 우리 모두 미쳐있어서 그런 걸지도 모르죠.
    ja: 私たちは全員おかしいからかもしれません。
  event_goddessfall2_04_s_37:
    speaker: papillon
    en: Huff...! Huff...!
    ko: 하아…! 하아…!
    ja: ハァ…！ハァ…！
  event_goddessfall2_04_s_38:
    speaker: papillon
    en: Insane... every last one of them...! Haha...!
    ko: 미친… 것들…! 하하…!
    ja: ホント…おかしな奴ら…！あははっ…！
  event_goddessfall2_04_s_39:
    speaker: papillon
    en: Huff...! Huff...!
    ko: 후우…! 후우…!
    ja: ふぅ…！ふぅ…！
  event_goddessfall2_04_s_40:
    speaker: "<Narration>"
    en: Papillon steadies her ragged breathing and looks up.
    ko: 파피용은 거친 숨을 고르며 위를 올려다보았다.
    ja: パピヨンは弾んだ息を整え、空を見上げた
  event_goddessfall2_04_s_41:
    speaker: "<Narration>"
    en: A radio tower looms overhead.
    ko: 전파탑이 우뚝 솟아 있다.
    ja: そびえ立つ電波塔が見えた
  event_goddessfall2_04_s_42:
    speaker: papillon
    en: Huff...
    ko: "…후우."
    ja: "…はぁ。"
  event_goddessfall2_04_s_43:
    speaker: "<Narration>"
    en: She activates the tower's terminal and connects it to her phone.
    ko: 전파탑의 단말기를 열어 자신의 핸드폰과 연결한다.
    ja: |-
      パピヨンは操作盤を開き、
      自身の携帯端末に接続すると…
  event_goddessfall2_04_s_44:
    speaker: "<Narration>"
    en: After tapping the phone a few times, Papillon brings it to her ear.
    ko: |-
      그리고 파피용은 핸드폰을 조작한 후,
      귀에 가져다 댄다.
    ja: 端末を操作し、耳に当てた
  event_goddessfall2_04_s_45:
    speaker: papillon
    en: Haah... Haha...
    ko: 하아… 하하….
    ja: はぁ…あははっ…
  event_goddessfall2_04_s_46:
    speaker: papillon
    en: What am I even doing right now... Seriously...
    ko: 내가… 지금 뭐 하는 거지… 진짜.
    ja: ホント…何してんのよ…私。
  event_goddessfall2_04_s_47:
    speaker: "<Narration>"
    en: The signal goes through.
    ko: 신호가 간다.
    ja: 通話信号が届いた
  event_goddessfall2_04_s_48:
    speaker: "<Narration>"
    en: Soon after, a voice can be heard from the other end.
    ko: 그리고 잠시 후, 핸드폰 건너편에서 목소리가 들려왔다.
    ja: |-
      しばらくの呼び出しの後、
      端末の向こうからの声が聞こえた
  event_goddessfall2_04_s_49:
    speaker: dorothy_op_r
    en: How bold of you to call me.
    ko: 전화를 걸다니 과감하시네요.
    ja: 直接の通話とは、恐れ知らずですね。
  event_goddessfall2_04_s_50:
    speaker: dorothy_op_r
    en: This better be something important.
    ko: 중요한 이야기여야 할 거예요.
    ja: それほど重要な話ですか？
  event_goddessfall2_04_s_51:
    speaker: papillon
    en: Come to Eden. Hurry.
    ko: 에덴으로 와 빨리.
    ja: エデンに来て。早く。
  event_goddessfall2_04_s_52:
    speaker: dorothy_op_r
    en: I have no time for that right now.
    ko: 저는 지금 그럴 여유가 없
    ja: 今はそのような余裕は――
  event_goddessfall2_04_s_53:
    speaker: papillon
    en: Listen to me, there's no time.
    ko: 시간 없으니까 잘 들어.
    ja: 時間がないからよく聞いて。
  event_goddessfall2_04_s_54:
    speaker: papillon
    en: The Queen has descended. Eden has been decimated. The Pioneers and White Knights
      have joined the fray. Inherit has been wiped out.
    ko: 퀸이 내려왔어. 에덴은 작살났고. 파이오니아가 합류했고 바이스리터가 합류했어. 인헤르트는 전멸했어.
    ja: |-
      クイーンが降りてきて、エデンは壊滅。
      パイオニアとヴァイスリッターが合流、
      インヘルトが全滅したわ。
  event_goddessfall2_04_s_55:
    speaker: dorothy_op_r
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_56:
    speaker: dorothy_op_r
    en: "... What did you just say?"
    ko: "…뭐라고요?"
    ja: "…何ですって？"
  event_goddessfall2_04_s_57:
    speaker: papillon
    en: I'm not joking! Hurry over here and help, or else everyone will die!
    ko: |-
      농담하는 거 아니니까 빨리 튀어와!
      다 죽는다고! 와서 도와!
    ja: |-
      嘘じゃないわ、急いできて！
      みんな死んじゃいそうなの！早く助けて！
  event_goddessfall2_04_s_58:
    speaker: dorothy_op_r
    en: Wait, who did you say was wiped out?
    ko: 잠깐만요. 지금 누가 전멸했다고
    ja: 待ってください。全滅というのは――
  event_goddessfall2_04_s_59:
    speaker: papillon
    en: Shut up and just get over here!
    ko: 닥치고! 빨리! 오라고!
    ja: 黙って！いいから！早く来て！
  event_goddessfall2_04_s_60:
    speaker: "<Narration>"
    en: Papillon yanks the CombiLink from her phone
    ko: 파피용은 거칠게 핸드폰에 이어진 커넥팅 디바이스를 뽑는다.
    ja: |-
      パピヨンは携帯端末の接続デバイスを
      力任せに引き抜いた
  event_goddessfall2_04_s_61:
    speaker: "<Narration>"
    en: and looks toward the wasteland she ran through.
    ko: 그리고 자신이 뛰어온 황무지를 바라본다.
    ja: そして、自分が走ってきた荒地へ視線を向けた
  event_goddessfall2_04_s_62:
    speaker: papillon
    en: "... Haha."
    ko: "…하하."
    ja: "…アハハ…"
  event_goddessfall2_04_s_63:
    speaker: papillon
    en: Really, this is absurd.
    ko: 진짜, 어이가 없어서.
    ja: まったく、呆れちゃうわね。
  event_goddessfall2_04_s_64:
    speaker: "<Narration>"
    en: Papillon runs,
    ko: 파피용이 달린다.
    ja: パピヨンは再び走り出した
  event_goddessfall2_04_s_65:
    speaker: "<Narration>"
    en: retracing her steps toward Eden.
    ko: |-
      자신이 달려왔던 곳을 향해,
      에덴을 향해 달린다.
    ja: 来た道を戻り、エデンへ向かって
  event_goddessfall2_04_s_66:
    speaker: "<Narration>"
    en: And without even realizing it, she's laughing.
    ko: 파피용은 자신도 모르게 웃고 있었다.
    ja: 唇の端はつり上がっていた
  event_goddessfall2_04_s_67:
    speaker: papillon
    en: Ha...! I've lost it...! I must've lost my mind...!
    ko: 하하…! 미쳤어…! 미쳤나 봐…!
    ja: あはは…！ホント…！バカみたい…！
  event_goddessfall2_04_s_68:
    speaker: papillon
    en: I've really gone insane...!
    ko: 진짜 미쳤나 봐 나…!
    ja: 何やってんのよ、私…！
  event_goddessfall2_04_s_69:
    speaker: nayuta
    en: How dost thou fare?
    ko: 좀 어떠시오.
    ja: 具合はいかがですか？
  event_goddessfall2_04_s_70:
    speaker: crown
    en: I... do not feel as if I am dying.
    ko: 죽을 것… 같진 않아요.
    ja: 死にそう…ではありませんわね。
  event_goddessfall2_04_s_71:
    speaker: nayuta
    en: I have administered merely rudimentary first aid. 'Tis best that thou return
      to Eden for proper care.
    ko: 응급처치일 뿐이라 제대로 된 치료는 에덴으로 가는 게 좋을 것이오.
    ja: |-
      あくまで応急処置です。
      本格的な治療にはエデンの設備が
      必要でしょう。
  event_goddessfall2_04_s_72:
    speaker: nayuta
    en: Here, allow me to support thee.
    ko: 소인이 부축하겠소.
    ja: 立てますか？支えます。
  event_goddessfall2_04_s_73:
    speaker: johan
    en: No, I'll do it.
    ko: 됐다. 내가 한다.
    ja: その必要はない。私がやろう。
  event_goddessfall2_04_s_74:
    speaker: nayuta
    en: Young Hero Johan? And what of Eden... that thou hast come hither...?
    ko: 요한 소협? 에덴은 어찌하고 여기까지….
    ja: ヨハン？なぜここに…エデンは…
  event_goddessfall2_04_s_75:
    speaker: johan
    en: Now, the decision is theirs. Only one task remains for me.
    ko: |-
      이제 저들의 판단에 맡기는 때다.
      내가 할 일은 하나밖에 남지 않았다.
    ja: |-
      後は彼女たちの判断に任せる時だ。
      私がするべきことは1つしか残っていない。
  event_goddessfall2_04_s_76:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_77:
    speaker: johan
    en: Monk.
    ko: 승려.
    ja: 仙人。
  event_goddessfall2_04_s_78:
    speaker: "<Narration>"
    en: Johan points toward the battlefield.
    ko: 요한은 손을 뻗어 전장을 가리켰다.
    ja: ヨハンが腕を伸ばし、戦場を指した
  event_goddessfall2_04_s_79:
    speaker: johan
    en: Go.
    ko: 가라.
    ja: 行け。
  event_goddessfall2_04_s_80:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_81:
    speaker: nayuta
    en: This humble one—
    ko: 소인은….
    ja: 私は…
  event_goddessfall2_04_s_82:
    speaker: johan
    en: What, you don't want to?
    ko: 가고 싶지 않나.
    ja: 行きたくないのか。
  event_goddessfall2_04_s_83:
    speaker: johan
    en: Go.
    ko: 가라.
    ja: 行け。
  event_goddessfall2_04_s_84:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_85:
    speaker: johan
    en: Even if things go wrong, even if all our plans fail,
    ko: 일이 잘못되어도, 모든 계획이 실패하더라도.
    ja: |-
      仮に問題が起きようと、
      計画がすべて失敗しようと…
  event_goddessfall2_04_s_86:
    speaker: johan
    en: someone will see it through.
    ko: 반드시 이어줄 이가 있다.
    ja: 必ず繋いでくれる者がいる。
  event_goddessfall2_04_s_87:
    speaker: johan
    en: You need not bear the burden of failure by yourself.
    ko: 실패의 책임을 너 따위가 홀로 짊어질 필요는 없다.
    ja: 失敗の責任をお前1人で背負う必要はない。
  event_goddessfall2_04_s_88:
    speaker: nayuta
    en: "... But"
    ko: "…허나."
    ja: "…しかし…"
  event_goddessfall2_04_s_89:
    speaker: nayuta
    en: this humble one had made many jump into the jaws of death up until now.
    ko: 소인은 이미 많은 이들을 소인의 손으로 떠밀었소.
    ja: |-
      私は、今まで多くの人々を
      死地に飛び込ませてきました。
  event_goddessfall2_04_s_90:
    speaker: nayuta
    en: Aye, I made it seem as though they had a choice when in truth, I compelled
      them.
    ko: |-
      소인은, 그래.
      마치 그들에게 선택지가 있는 것 마냥 강요했소.
    ja: |-
      そう…
      まるで選ぶことができると言わんばかりに。
  event_goddessfall2_04_s_91:
    speaker: nayuta
    en: I preyed upon their pride.
    ko: 그들의 긍지를 이용했소.
    ja: 私は彼らの誇りを利用した。
  event_goddessfall2_04_s_92:
    speaker: nayuta
    en: I burdened them with the decision that ought to have been mine.
    ko: 그리고 진짜 선택은 그들에게 미뤘소.
    ja: 選択はいつも誰かにさせてきた。
  event_goddessfall2_04_s_93:
    speaker: nayuta
    en: I was but a bystander.
    ko: 소인은 방관자요.
    ja: 私は傍観者にしかなれない。
  event_goddessfall2_04_s_94:
    speaker: nayuta
    en: Cowardice stayed mine hand from choosing, and so I wielded knowledge as a
      blade, driving them into mortal peril.
    ko: |-
      그 어느 것 하나 결정할 용기가 없어,
      많은 것을 알고 있다는 것을 무기 삼아 그들을 사지로 내몰았소.
    ja: |-
      何一つ決める勇気もなく、
      知識があることを盾に
      犠牲になることを他人に選ばせてきた。
  event_goddessfall2_04_s_95:
    speaker: nayuta
    en: Thus, it is I who must bear the consequence.
    ko: |-
      그러니 소인은 책임져야하오.
      만에 하나 그들이 실패했을 때.
    ja: |-
      せめて、卑劣な傍観者としての
      責任を取らねばなりません。
      私が追いこんだ者たちが失敗した時…
  event_goddessfall2_04_s_96:
    speaker: nayuta
    en: Should they fail—even by the narrowest chance—this craven observer must inherit
      their will and prepare for the next appointed hour...
    ko: 비겁한 방관자는 그들의 의지를 이어 다음에 있을 때를 준비해야….
    ja: その遺志を継いで、次に備えるために…
  event_goddessfall2_04_s_97:
    speaker: crown
    en: Nayu... ta.
    ko: 나유… 타.
    ja: ナユ…タ。
  event_goddessfall2_04_s_98:
    speaker: crown
    en: I'm sorry... but I don't... understand a word you're saying...
    ko: 죄송… 한데 무슨 말인지… 전혀 모르겠… 군요.
    ja: |-
      申し訳…ありませんが…
      何のお話か…分かりませんわね。
  event_goddessfall2_04_s_99:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_100:
    speaker: johan
    en: Do you not wish to fight
    ko: 가서, 같이 싸우고 싶지 않나.
    ja: ともに戦いたいのではないのか。
  event_goddessfall2_04_s_101:
    speaker: johan
    en: with them?
    ko: 저들과.
    ja: お前の仲間たちと。
  event_goddessfall2_04_s_102:
    speaker: nayuta
    en: This humble one... wish to.
    ko: 그러… 고 싶소.
    ja: 私は…戦いたい。
  event_goddessfall2_04_s_103:
    speaker: johan
    en: Then go.
    ko: 그럼 가라.
    ja: ならば、行け。
  event_goddessfall2_04_s_104:
    speaker: johan
    en: Fight alongside them.
    ko: 함께 싸워라.
    ja: 肩を並べて戦ってこい。
  event_goddessfall2_04_s_105:
    speaker: nayuta
    en: Alas... how could one such as I...?
    ko: 소인이… 어찌….
    ja: 私…などが…
  event_goddessfall2_04_s_106:
    speaker: nayuta
    en: Verily, I am unworthy of such...
    ko: 소인에겐 그럴 자격이….
    ja: 私にそんな資格は…
  event_goddessfall2_04_s_107:
    speaker: crown
    en: There is no such thing as... being worthy... of fighting alongside... others.
    ko: 함께 싸우는… 것에… 자격 같은 건 없어… 요.
    ja: |-
      ともに…戦うことに…
      資格など…いりません。
  event_goddessfall2_04_s_108:
    speaker: johan
    en: "... I agree, to an extent."
    ko: "…그 말에 어느 정도는 동의한다."
    ja: "…ある程度は同じ意見だ。"
  event_goddessfall2_04_s_109:
    speaker: johan
    en: What you must take responsibility for is not what comes after failure,
    ko: 지금 네가 책임져야 할 것은 실패한 이후가 아니다.
    ja: |-
      お前がここで負うべき責任は、
      失敗した後のことではない。
  event_goddessfall2_04_s_110:
    speaker: johan
    en: but victory itself.
    ko: 승리를 책임져라.
    ja: ここで勝つことへの責任だ。
  event_goddessfall2_04_s_111:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_112:
    speaker: johan
    en: If by chance you fail, someone will take your place.
    ko: |-
      만에 하나 실패하면,
      뒤를 이어줄 이가 있다.
    ja: 何かあっても、後を継ぐ者がいる。
  event_goddessfall2_04_s_113:
    speaker: johan
    en: So now, put everything on the line.
    ko: |-
      그러니 지금.
      모든 걸 걸어라.
    ja: |-
      だから、今だ。
      今この場に全てを賭けろ。
  event_goddessfall2_04_s_114:
    speaker: johan
    en: When everyone has risked their all, you must do the same.
    ko: |-
      모두가 모든 걸 걸었을 때,
      너도 함께 걸어라.
    ja: |-
      仲間が全てを賭けている時、
      お前も同じように賭ける。
  event_goddessfall2_04_s_115:
    speaker: johan
    en: That's what it means to be a comrade.
    ko: "[전우]란 그런 것이다."
    ja: それが「戦友」というものだ。
  event_goddessfall2_04_s_116:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_117:
    speaker: nayuta
    en: Ah... Great Hero.
    ko: 아아… 대협.
    ja: ああ…旦那。
  event_goddessfall2_04_s_118:
    speaker: nayuta
    en: That I should be fated to encounter thee—
    ko: 소인이 대협을 만난 것은 어쩌면….
    ja: |-
      私が旦那と出会っていたのは、
      もしかしたら…
  event_goddessfall2_04_s_119:
    speaker: johan
    en: Take this.
    ko: 가져가라.
    ja: 持っていけ。
  event_goddessfall2_04_s_120:
    speaker: "<Narration>"
    en: Johan throws something at Nayuta.
    ko: 요한이 뭔가를 나유타에게 던진다.
    ja: ヨハンが何かをナユタに投げ渡した
  event_goddessfall2_04_s_121:
    speaker: "<Narration>"
    en: It is a red-tipped bullet.
    ko: 탄두가 붉은 탄환이다.
    ja: 先端の赤い弾丸だ
  event_goddessfall2_04_s_122:
    speaker: nayuta
    en: "... Vapaus."
    ko: "…언체인드."
    ja: "…アンチェインド。"
  event_goddessfall2_04_s_123:
    speaker: johan
    en: Use it as you will.
    ko: 어디에 어떻게 쓰든 네 자유다.
    ja: どこにどう使おうと、お前の自由だ。
  event_goddessfall2_04_s_124:
    speaker: johan
    en: But don't waste it.
    ko: 허공에 날리는 짓만 하지 마라.
    ja: ムダ弾にだけはするな。
  event_goddessfall2_04_s_125:
    speaker: nayuta
    en: Verily, this responsibility is most grievous...
    ko: 이건 너무 책임이 막중…
    ja: これは、責任があまりにも重大な…
  event_goddessfall2_04_s_126:
    speaker: johan
    en: All the more reason for you to make the decision yourself.
    ko: 이럴 때인 만큼, 네가 선택해라.
    ja: ここは、お前が選択するべき時だ。
  event_goddessfall2_04_s_127:
    speaker: johan
    en: Don't leave it to others.
    ko: 남에게 미루지 말고.
    ja: 誰かに決めさせようとするな。
  event_goddessfall2_04_s_128:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_s_129:
    speaker: johan
    en: Cecil, clear the infirmary. One Nikke is incoming.
    ko: 세실. 의무실을 비워놔라. 니케 한 기가 간다.
    ja: |-
      セシル、医務室を空けておけ。
      ニケを1体送る。
  event_goddessfall2_04_s_130:
    speaker: cecil_op_l
    en: Got it.
    ko: 알겠어요.
    ja: 了解。
  event_goddessfall2_04_s_131:
    speaker: "<Narration>"
    en: Nayuta hesitates, then takes a step forward.
    ko: 나유타는 머뭇거리며 앞으로 한 걸음 내디뎠다.
    ja: ナユタはためらいつつ、一歩踏み出した
  event_goddessfall2_04_s_132:
    speaker: "<Narration>"
    en: Slowly, she begins to walk.
    ko: 그리고 천천히 걷기 시작했다.
    ja: そして、ゆっくりとした歩きが…
  event_goddessfall2_04_s_133:
    speaker: "<Narration>"
    en: Then all at once, she is running.
    ko: 뛴다.
    ja: 疾走になった
  event_goddessfall2_04_s_134:
    speaker: "<Narration>"
    en: The silver monk sprints ahead, moving with a speed she has never used before.
    ko: 은색의 승려는 지금껏 단 한 번도 내본 적 없는 속도로 달려 나갔다.
    ja: |-
      それは彼女が今まで
      一度も出したことがない速さだった
event_goddessfall2_04_e:
  event_goddessfall2_04_e_1:
    speaker: marian_q
    en: Hyahhh...!
    ko: 흐읍…!
    ja: はぁっ…！
  event_goddessfall2_04_e_2:
    speaker: "<Narration>"
    en: The giant Marian opens fire, pouring out a maelstrom of bullets and beams.
    ko: 마리안의 거신이 탄환과 빔을 쏟아붓는다.
    ja: |-
      鋼の巨神と化したマリアンが
      閃光と弾の雨を降らせている
  event_goddessfall2_04_e_3:
    speaker: "<Narration>"
    en: Raptures crumble under the onslaught, defenseless before the merciless barrage.
    ko: 랩쳐들이 속수무책으로 부서진다.
    ja: |-
      ラプチャーの陣形はなすすべもなく
      崩れつつあった
  event_goddessfall2_04_e_4:
    speaker: "<Narration>"
    en: Before the sheer might of her massive frame, they're outgunned, outmatched,
      and utterly crushed.
    ko: 압도적인 거체에서 뿜어내는 압도적인 화력 앞에서 랩쳐들은 제대로 된 반응도, 반항도 하지 못한 채 쓸려나갔다.
    ja: |-
      圧倒的な巨体から放たれる圧倒的な火力が、
      抵抗も反応も許さずラプチャーをなぎ払う
  event_goddessfall2_04_e_5:
    speaker: "<Narration>"
    en: In an instant, the tide of battle turns.
    ko: 전장의 판도가 뒤집혔다.
    ja: 戦場の流れが一変した
  event_goddessfall2_04_e_6:
    speaker: "<Narration>"
    en: The once-endless horde of Raptures begins to thin.
    ko: 물량으로 밀어붙이던 랩쳐의 수가 눈에 띄게 줄어들기 시작했다.
    ja: |-
      無限の物量で攻め立てていたはずの
      ラプチャーが、目に見えて減り始めた
  event_goddessfall2_04_e_7:
    speaker: marian_q
    en: That should do it...!
    ko: 이쯤이면 됐어…!
    ja: これくらいで十分…！
  event_goddessfall2_04_e_8:
    speaker: marian_q
    en: Now for the Queen...!
    ko: 이제 퀸을…!
    ja: 次はクイーンを…！
  event_goddessfall2_04_e_9:
    speaker: "<Narration>"
    en: To Marian, the Queen is not her top priority.
    ko: 마리안에게 퀸은 우선순위가 아니었다.
    ja: |-
      それまでのマリアンにとって、
      クイーンは最優先では無かった
  event_goddessfall2_04_e_10:
    speaker: "<Narration>"
    en: Nayuta's clones are gradually dwindling, and with Raptures all around, a proper
      fight cannot even take place.
    ko: |-
      나유타의 분신은 점점 줄어들고 있었고,
      사방이 랩쳐여선 싸움 자체가 성립하지 않는다.
    ja: |-
      ナユタの分身の数が減らされ、
      ラプチャーに包囲されてしまっては
      戦い自体が成立しない
  event_goddessfall2_04_e_11:
    speaker: "<Narration>"
    en: Only after she has destroyed well over half their forces does Marian finally
      turn her gaze toward the Queen.
    ko: |-
      마리안은 절반이 훨씬 넘는 랩쳐들을 파괴한 후에야,
      퀸에게로 시선을 돌렸다.
    ja: |-
      マリアンがクイーンに視線を向けたのは、
      半数を優に超えるラプチャーを
      破壊した後だった
  event_goddessfall2_04_e_12:
    speaker: "<Narration>"
    en: It is then something unfamiliar stirred inside her.
    ko: 그제서야, 마리안은 묘한 기분을 느꼈다.
    ja: その時になって初めて、マリアンは疑問を抱いた
  event_goddessfall2_04_e_13:
    speaker: marian_q
    en: "... Why hasn't she shown any reaction yet...?"
    ko: "…왜 아직까지 아무런 반응을…."
    ja: "…どうして今まで何の反応も…"
  event_goddessfall2_04_e_14:
    speaker: "<Narration>"
    en: Marian looks at the Queen.
    ko: 마리안이 퀸을 바라본다.
    ja: マリアンはクイーンを見た
  event_goddessfall2_04_e_15:
    speaker: "<Narration>"
    en: The Queen meets her gaze,
    ko: 퀸은 마리안을 빤히 쳐다보고 있었다.
    ja: 凝視するクイーンの視線を感じた
  event_goddessfall2_04_e_16:
    speaker: "<Narration>"
    en: eyes locked not on her massive form, but on Marian herself.
    ko: 마리안의 거신이 아닌, 마리안을 바라보고 있었다.
    ja: |-
      それは巨神ではなく、
      本体のマリアンを見通していた
  event_goddessfall2_04_e_17:
    speaker: marian_q
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall2_04_e_18:
    speaker: "<Narration>"
    en: With a grotesque sound, the Queen's mouth opens.
    ko: 기괴한 소리를 내며 퀸의 입이 열린다.
    ja: 奇怪な音を立て、クイーンの口が開く
  event_goddessfall2_04_e_19:
    speaker: "<Narration>"
    en: A thin, threadlike red beam that's almost imperceptible to the eye
    ko: 가느다란 붉은색 빛이 뻗어 나온다.
    ja: 中から細く赤い光が伸びた
  event_goddessfall2_04_e_20:
    speaker: "<Narration>"
    en: shoots forth and slices across the giant Marian.
    ko: 눈으로 인식하기도 힘든, 실과 같은 그 빛은 마리안의 거신의 몸통을 긋고 지나갔다.
    ja: |-
      かろうじて見える糸のような光が、
      巨神の胴体をなぞっていった
  event_goddessfall2_04_e_21:
    speaker: "<Narration>"
    en: Moments later, her massive frame begins to split in two at the torso.
    ko: 잠시 후, 마리안의 거신이 두 동강 나기 시작했다.
    ja: 一瞬の間をおいて、巨神は真っ二つに断たれた
  event_goddessfall2_04_e_22:
    speaker: marian_q
    en: "... Oh no...!"
    ko: "…이런…!!"
    ja: "…そんな…！！"
  event_goddessfall2_04_e_23:
    speaker: "<Narration>"
    en: The giant crumbles beneath the crushing force of the beam. Inside, Marian
      prepares one last strike.
    ko: |-
      극도로 압축된 빔에 의해 무너져가는 거신의 안에서,
      마리안은 마지막 공격을 다짐했다.
    ja: |-
      それは極限まで圧縮されたビームだった。
      崩壊する巨神の中で、
      マリアンはとっさに最後の攻撃を構えた
  event_goddessfall2_04_e_24:
    speaker: "<Narration>"
    en: Light gathers at the cannons on her shoulders.
    ko: 어깨의 포신에 빛이 모여든다.
    ja: 肩の砲身に光が集まる
  event_goddessfall2_04_e_25:
    speaker: "<Narration>"
    en: Twin beams lance toward the Queen,
    ko: 거신은 두 줄기의 빛을 퀸에게 뿜어냈고,
    ja: 2筋の光がクイーンに放たれ…
  event_goddessfall2_04_e_26:
    speaker: "<Narration>"
    en: who raises her hand and begins to absorb them.
    ko: 퀸은 손을 내밀어 두 줄기의 빛을 빨아들이기 시작했다.
    ja: クイーンが伸ばした腕に、吸い込まれていった
  event_goddessfall2_04_e_27:
    speaker: marian_q
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall2_04_e_28:
    speaker: marian_q
    en: The Queen can... do this too...?!
    ko: 내가 할 수 있는 일은… 퀸도…!
    ja: 私ができることは…クイーンにも…！
  event_goddessfall2_04_e_29:
    speaker: "<Narration>"
    en: A massive red beam erupts from the Queen's hand,
    ko: 퀸의 손에서 거대한 붉은 빛이 뿜어져 나온다.
    ja: クイーンの手から巨大な赤い光があふれ出した
  event_goddessfall2_04_e_30:
    speaker: "<Narration>"
    en: engulfing Marian in its light.
    ko: 마리안의 거신이 빛에 삼켜진다.
    ja: 巨神の残骸は光に飲み込まれてゆく
  event_goddessfall2_04_e_31:
    speaker: "<Narration>"
    en: She feels her body falling.
    ko: 마리안은 자신의 몸이 낙하하고 있음을 느꼈다.
    ja: |-
      マリアンは自身の身体が
      重力に引かれていることを感じた
  event_goddessfall2_04_e_32:
    speaker: "<Narration>"
    en: But her eyes can't open, and her body is completely battered.
    ko: |-
      눈을 뜰 수 없다.
      몸이 만신창이다.
    ja: |-
      目も開けられない。
      満身創痍で身体はいうことを聞かない
  event_goddessfall2_04_e_33:
    speaker: "<Narration>"
    en: At that moment, she feels someone grab her.
    ko: 그때, 자신을 누군가가 잡아채는 것을 느꼈다.
    ja: 突然、何かに引っ張られた
  event_goddessfall2_04_e_34:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 쿵-!
    ja: ドスッ！
  event_goddessfall2_04_e_35:
    speaker: "<Narration>"
    en: She feels herself land on the ground.
    ko: 지면에 착지함을 느낀다.
    ja: 着地の衝撃を感じた
  event_goddessfall2_04_e_36:
    speaker: "<Narration>"
    en: With every last ounce of strength, Marian forces her eyes open.
    ko: 마리안은 있는 힘껏 눈을 뜬다.
    ja: マリアンは力を振り絞り、目を開けた
  event_goddessfall2_04_e_37:
    speaker: talkative
    en: You cannot die here.
    ko: "[너는 이곳에서 죽어선 안 된다.]"
    ja: "「お前はここでは死なせない」"
  event_goddessfall2_04_e_38:
    speaker: marian_q
    en: "... Chatterbox...?"
    ko: "…토커티브…?"
    ja: "…トーカティブ…？"
  event_goddessfall2_04_e_39:
    speaker: talkative
    en: Your body must become the Queen's next vessel.
    ko: "[너의 몸은 퀸의 다음 바디가 되어야 한다.]"
    ja: "「お前の身体は、クイーンの次なるボディだ」"
  event_goddessfall2_04_e_40:
    speaker: talkative
    en: You exist for that alone.
    ko: "[그것만을 위해 너는 존재한다.]"
    ja: "「そのためだけに、お前は存在する」"
  event_goddessfall2_04_e_41:
    speaker: talkative
    en: So...
    ko: "[그러니.]"
    ja: "「そのためにも…」"
  event_goddessfall2_04_e_42:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 우득!
    ja: バキッ！
  event_goddessfall2_04_e_43:
    speaker: marian_q
    en: Argh...!
    ko: 커헉…!
    ja: がはっ…！
  event_goddessfall2_04_e_44:
    speaker: talkative
    en: Stop this pointless act,
    ko: "[쓸데없는 짓은 이제 그만해라.]"
    ja: "「つまらん抵抗はしないことだ」"
  event_goddessfall2_04_e_45:
    speaker: talkative
    en: and don't even think about pointing your gun at the Queen.
    ko: "[퀸께 총구를 들이밀지도 마라.]"
    ja: "「クイーンに銃を向けようとするな」"
  event_goddessfall2_04_e_46:
    speaker: talkative
    en: You exist only as a vessel for the Queen Gene.
    ko: "[너는 그저, 퀸 인자를 담을 수 있는 그릇으로서 존재하기만 하면 된다.]"
    ja: |-
      「お前はただ、
      クイーン因子の器としてあるだけでいい」
  event_goddessfall2_04_e_47:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 우득!
    ja: バキッ！
  event_goddessfall2_04_e_48:
    speaker: marian_q
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall2_04_e_49:
    speaker: talkative
    en: How I long to crush your skull, yet I must restrain myself lest the vessel
      break.
    ko: "[머리를 뭉개놓고 싶지만, 그릇이 망가질 수 있으니 참겠다.]"
    ja: |-
      「頭を踏みつぶしておきたいところだが、
      壊してしまうわけにもいかん」
  event_goddessfall2_04_e_50:
    speaker: "<Narration>"
    en: "*Craaacck!*"
    ko: 우드드득!
    ja: バキィッ！
  event_goddessfall2_04_e_51:
    speaker: marian_q
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_e_52:
    speaker: talkative
    en: Hm. Unconscious already? To think this is the Queen's vessel...
    ko: "[흠. 정신을 잃었나. 이런게 퀸의 그릇이라니….]"
    ja: |-
      「ふん。気を失ったか。
      これがクイーンの器とは…」
  event_goddessfall2_04_e_53:
    speaker: talkative
    en: "... Shall I remove her eyes, ears, and mouth,"
    ko: "[…만약을 대비해, 눈과 귀, 입은 없애도 되겠군.]"
    ja: "「…念のため、目と耳と口を潰しておくか」"
  event_goddessfall2_04_e_54:
    speaker: talkative
    en: just to be safe?
    ko: "[없애둘까.]"
    ja: "「問題はあるまい」"
  event_goddessfall2_04_e_55:
    speaker: mirror_r
    en: Don't do that. What if you end up breaking her?
    ko: 그러지 마요. 망가지면 어떻게 하려고 해요?
    ja: |-
      やめてください。使い物にならなくなったら
      どうするつもりですか？
  event_goddessfall2_04_e_56:
    speaker: talkative
    en: "... Mirror."
    ko: "[…미러.]"
    ja: "「…ミラー」"
  event_goddessfall2_04_e_57:
    speaker: mirror_r
    en: You followed my orders and retrieved Marian... well, "safely," if we're being
      generous with that term.
    ko: 제 지시대로 마리안을 무사히… 음. 무사히의 정의가 뭔지부터 재정립할 필요는 있어 보이지만.
    ja: |-
      私の指示通り、マリアンを無事に…ふむ…
      「無事」の定義は見直す必要が
      ありそうですが…
  event_goddessfall2_04_e_58:
    speaker: mirror_r
    en: Nicely done, anyway.
    ko: 아무튼 잘 확보해 놨네요.
    ja: とにかく、うまく確保してくれました。
  event_goddessfall2_04_e_59:
    speaker: talkative
    en: Can she really become the Queen's new body?
    ko: "[정말 이것이 퀸의 새로운 바디가 될 수 있는 건가?]"
    ja: |-
      「本当に、これがクイーンの
      新しいボディになるというのか？」
  event_goddessfall2_04_e_60:
    speaker: mirror_r
    en: Of course, the Queen is old.
    ko: |-
      물론이에요.
      퀸은 노쇠했으니까.
    ja: |-
      その通りです。
      クイーンは老朽化していますから。
  event_goddessfall2_04_e_61:
    speaker: mirror_r
    en: More importantly, she herself says she wants a new body.
    ko: |-
      무엇보다, 퀸이 말하고 계시잖아요.
      새로운 몸을 원한다고.
    ja: |-
      何より、クイーン自身のご命令でしょう？
      新しい身体が欲しいということは。
  event_goddessfall2_04_e_62:
    speaker: talkative
    en: "... I can't hear the Queen's voice."
    ko: "[…나에게는 퀸의 목소리가 들리지 않는다.]"
    ja: "「…私にクイーンの声は聞こえない」"
  event_goddessfall2_04_e_63:
    speaker: mirror_r
    en: There's nothing we can do about that. Only Heretics, or entities above that
      level, can hear her voice.
    ko: |-
      그건 어쩔 수 없죠.
      헬레틱이나 그 이상의 고위 개체들만 목소리를 들을 수 있으니까요.
    ja: |-
      では仕方ありませんね。
      聞けるのはヘレティックかそれに匹敵する
      高位の個体だけですから。
  event_goddessfall2_04_e_64:
    speaker: mirror_r
    en: In any case, do not harm her.
    ko: 아무튼, 절대 망가뜨리지 말아요.
    ja: |-
      とにかく、万一にも
      傷つけないようにして下さい。
  event_goddessfall2_04_e_65:
    speaker: mirror_r
    en: No one can guarantee what effect it might have on the vessel.
    ko: 그릇에 어떤 영향이 있을지, 그 누구도 장담할 수 없다고요.
    ja: |-
      器にどのような影響があるか、
      誰にも分からないのですから。
  event_goddessfall2_04_e_66:
    speaker: mirror_r
    en: So stick to the original plan and protect Marian.
    ko: 그러니 원래 계획대로, 마리안을 잘 보호해요.
    ja: 本来の計画通り、しっかりと保護してください。
  event_goddessfall2_04_e_67:
    speaker: mirror_r
    en: My goodness, I heard you even tried to eat her?
    ko: 세상에, 먹으려고까지 했다면서요?
    ja: |-
      それどころか、恐れ知らずにも、
      盗み食いしようとしていたとか？
  event_goddessfall2_04_e_68:
    speaker: mirror_r
    en: That would have been a disaster. If the Queen found out, your head wouldn't
      be the only thing at risk.
    ko: 큰일 나요 진짜. 퀸께서 알면 당신, 머리가 날아가는 정도로 끝나지 않을 거예요.
    ja: |-
      大変なことをしてしまいましたね。
      クイーンに知られれば、
      頭が吹き飛ぶ程度では済まないでしょう。
  event_goddessfall2_04_e_69:
    speaker: mirror_r
    en: She might even exile you.
    ko: 내칠지도 모른다고요?
    ja: 見捨てられてしまうかもしれませんね？
  event_goddessfall2_04_e_70:
    speaker: talkative
    en: "!!"
    ko: "[!!]"
    ja: "「！！」"
  event_goddessfall2_04_e_71:
    speaker: mirror_r
    en: Do you understand now how serious this is? I'll cover for you this time, but
      never do that again.
    ko: 아시겠나요? 사태가 심각해요. 다져놓고 부러뜨린 건 제가 잘 수습할 테니, 다음부턴 절대 그러지 마요.
    ja: |-
      分かりましたか？それほど重大なのです。
      今までのことは取り計らっておきますから、
      これ以上は絶対に危害を加えないことです。
  event_goddessfall2_04_e_72:
    speaker: mirror_r
    en: You want the Queen's recognition... and to hear her voice, don't you?
    ko: 당신은 퀸에게 인정받고… 퀸의 목소리를 들어야 하잖아요?
    ja: |-
      クイーンに認められて…
      声を聞きたいのでしょう？
  event_goddessfall2_04_e_73:
    speaker: talkative
    en: "... Fine, I'll be careful."
    ko: "[…그래. 주의하지.]"
    ja: "「…分かった。心しておく」"
  event_goddessfall2_04_e_74:
    speaker: mirror_r
    en: Yes, please make sure to do that.
    ko: 그래요. 꼭 그렇게 해주세요.
    ja: ええ。くれぐれもお願いしますね。
  event_goddessfall2_04_e_75:
    speaker: mirror_r
    en: Oh, now that I think about it, how about the Vapaus?
    ko: 아, 그러고보니 언체인드는요?
    ja: あとは…そういえば、アンチェインドは？
  event_goddessfall2_04_e_76:
    speaker: mirror_r
    en: Did you find it?
    ko: 찾았어요?
    ja: 見つかりましたか？
  event_goddessfall2_04_e_77:
    speaker: talkative
    en: I found out which body it's in. It's only a matter of time before we secure
      it.
    ko: "[어느 몸에 있는지는 찾았다. 확보하는 건 시간문제다.]"
    ja: |-
      「どの体にあるのかは分かった。
      確保は時間の問題だ」
  event_goddessfall2_04_e_78:
    speaker: mirror_r
    en: "... I see."
    ko: "…그래요."
    ja: "…そうですか。"
  event_goddessfall2_04_e_79:
    speaker: mirror_r
    en: As you know, Chatterbox, the Queen's body has aged, but the greater concern
      lies with her brain.
    ko: |-
      아시겠지만 토커티브.
      퀸은 육체도 노쇠했지만 더 큰 문제는 뇌예요.
    ja: |-
      あなたも知っているかもしれませんが、
      クイーンにとってボディよりも
      脳の衰えの方が深刻な問題です。
  event_goddessfall2_04_e_80:
    speaker: mirror_r
    en: She has overwritten Liliweiss' brain with her own data,
    ko: 퀸께서는 릴리스의 뇌에 자신의 정보를 덮어썼지만.
    ja: |-
      クイーンがリリスの脳に
      自分の情報を上書きした後…
  event_goddessfall2_04_e_81:
    speaker: mirror_r
    en: but the remnants of Liliweiss' NIMPH continue to attack her.
    ko: 릴리스의 뇌에 남은 NIMPH가 계속 퀸을 공격하고 있거든요.
    ja: |-
      リリスの脳に残っていたNIMPHから
      攻撃を受け続けているのです。
  event_goddessfall2_04_e_82:
    speaker: mirror_r
    en: Of course, the Queen is hardly one to be defeated by such a thing... Nevertheless,
      it is wise to remove any lingering threats.
    ko: 물론 퀸께서 패배할 리는 없겠지만… 불안 요소는 없애놓는 게 좋죠.
    ja: |-
      当然、クイーンが敗北することはありませんが…
      リスクは排除しておく方がいいでしょう。
  event_goddessfall2_04_e_83:
    speaker: mirror_r
    en: In any case, she must purge it to become the true Queen.
    ko: 아무튼 그걸 없애야, 퀸께서는 진정한 퀸이 될 수 있어요.
    ja: |-
      解決できればようやく、
      真のクイーンが生まれるのです。
  event_goddessfall2_04_e_84:
    speaker: mirror_r
    en: Now that the Queen has descended, please act swiftly.
    ko: 퀀께서 강림하셨으니, 이제 바쁘게 움직여주세요.
    ja: |-
      クイーンが地上に降り立った以上、
      これからはもっと仕事を急いで下さい。
  event_goddessfall2_04_e_85:
    speaker: talkative
    en: Yeah, got it.
    ko: "[그래. 알겠다.]"
    ja: "「ああ。分かった」"
  event_goddessfall2_04_e_86:
    speaker: mirror_r
    en: That's a fine answer.
    ko: 대답은 잘하시네요.
    ja: 返事はいいですね。
  event_goddessfall2_04_e_87:
    speaker: mirror_r
    en: Hmm...
    ko: "…음."
    ja: "…あら…"
  event_goddessfall2_04_e_88:
    speaker: mirror_r
    en: Looks like everyone's here.
    ko: 다 왔네.
    ja: 来たようです。
  event_goddessfall2_04_e_89:
    speaker: mirror_r
    en: Then, I'll be on my way.
    ko: 그럼 저는 이만 가볼게요.
    ja: では、私はここで。
  event_goddessfall2_04_e_90:
    speaker: mirror_r
    en: You understand, don't you? Never, ever harm Marian. You're to cherish her
      dearly and keep her safe.
    ko: |-
      아시겠죠? 마리안을 절대 망가뜨리지 말아요.
      애지중지하면서 잘 보호하란 말이에요.
    ja: |-
      分かっていますね？
      マリアンには傷一つつけないこと。
      心しておいてください。
  event_goddessfall2_04_e_91:
    speaker: talkative
    en: Got it, I'll be careful.
    ko: "[알겠다. 주의하지.]"
    ja: "「分かっている。よく覚えておく」"
  event_goddessfall2_04_e_92:
    speaker: "<Narration>"
    en: Mirror crackles with static and vanishes.
    ko: 미러가 지직거린 후 사라졌다.
    ja: |-
      砂嵐のようなノイズとともに、
      ミラーが姿を消した
  event_goddessfall2_04_e_93:
    speaker: "<Narration>"
    en: Chatterbox looks down at the battered Marian.
    ko: 토커티브는 만신창이가 된 마리안을 내려다보았다.
    ja: トーカティブは傷だらけのマリアンを見下ろした
  event_goddessfall2_04_e_94:
    speaker: "<Narration>"
    en: Just as he reaches out for her, a thunderous roar erupts.
    ko: |-
      마리안을 향해 손을 뻗으려는 순간,
      굉음이 들려왔다.
    ja: |-
      手を伸ばそうとした瞬間、
      すさまじい音がした
  event_goddessfall2_04_e_95:
    speaker: "<Narration>"
    en: He lifts his head toward the source of the sound.
    ko: 토커티브가 고개를 들어 굉음이 들려온 곳을 바라보자
    ja: トーカティブが顔を上げ、音のした方を見ると…
  event_goddessfall2_04_e_96:
    speaker: "<Narration>"
    en: There, three figures with eyes burning with wrath are racing toward him like
      mad.
    ko: |-
      그곳에는 노기에 서린 눈빛을 한 채,
      미친 듯 달려오고 있는 셋이 있었다.
    ja: |-
      嵐のような勢いで迫りくる
      殺気をはらんだ目をした3つの影があった
  event_goddessfall2_04_e_97:
    speaker: snowwhite
    en: Chatterbox!
    ko: 토커티브--!!
    ja: トーカティブ！！
  event_goddessfall2_04_e_98:
    speaker: hongryeon
    en: Thou shalt see no morrow alive...!
    ko: 살아서 돌아갈 생각은 말게나…!
    ja: 生きて帰れると思うでないぞ…！
  event_goddessfall2_04_e_99:
    speaker: rapunzel
    en: I will never forgive you... not ever!
    ko: 절대, 용서하지 않습니다!
    ja: 絶対に…許しません！
  event_goddessfall2_04_e_100:
    speaker: talkative
    en: Piiilgrims!
    ko: "[순례자아아--!!]"
    ja: "「巡礼者ども――！！」"
  event_goddessfall2_04_e_101:
    speaker: "<Narration>"
    en: Chatterbox's hand writhes grotesquely.
    ko: 토커티브의 손이 기괴하게 꿈틀댄다.
    ja: トーカティブの手が奇妙にうねる
  event_goddessfall2_04_e_102:
    speaker: "<Narration>"
    en: Crimson light ripples across it as it slowly takes the form of a dragon's
      head.
    ko: 붉은빛이 일렁이던 손은, 이윽고 화룡의 머리 모양을 한다.
    ja: |-
      揺らめく赤い光を宿した腕が、
      やがて火竜の頭部の形をとった
  event_goddessfall2_04_e_103:
    speaker: talkative
    en: You pests are always getting in my damn way...!
    ko: "[네놈들은 사사건건 나를…!]"
    ja: "「お前たちは、いつもいつも…！」"
  event_goddessfall2_04_e_104:
    speaker: "<Narration>"
    en: The dragon's head gathers fire in its mouth,
    ko: 화룡의 머리가 불을 머금는다.
    ja: 火竜の頭が炎を浮かべる――
  event_goddessfall2_04_e_105:
    speaker: "<Narration>"
    en: but Scarlet's blade slices through it.
    ko: 홍련의 검이 화룡의 머리를 잘라낸다.
    ja: |-
      その間もなく、
      紅蓮の剣が竜の頭を切り落とした
  event_goddessfall2_04_e_106:
    speaker: "<Narration>"
    en: Rapunzel's golden light pierces Chatterbox's neck,
    ko: 라푼젤의 금색 빛이 토커티브의 목을 꿰뚫는다.
    ja: |-
      すかさず、ラプンツェルの放った金色の光が
      トーカティブの首を打ち貫いた
  event_goddessfall2_04_e_107:
    speaker: "<Narration>"
    en: while Snow White swings her rifle with all her weight behind it.
    ko: 스노우 화이트가 체중을 실어 라이플을 휘두른다.
    ja: |-
      さらにスノーホワイトが体重を乗せ
      ライフルを振るった
  event_goddessfall2_04_e_108:
    speaker: "<Narration>"
    en: "*Crack!* A sickening sound resonates as Chatterbox's head is torn free."
    ko: 콰직! 하는 끔찍한 소리와 함께 토커티브의 머리가 뽑혀 나간다.
    ja: |-
      鈍くおぞましい音と共に
      トーカティブの頭が吹き飛んだ
  event_goddessfall2_04_e_109:
    speaker: talkative
    en: What... the... hell...!
    ko: "[이… 게… 뭐…!]"
    ja: "「何…だ…と…！」"
  event_goddessfall2_04_e_110:
    speaker: "<Narration>"
    en: "*Bang!* *Bang!* *Bang!* *Bang!*"
    ko: 탕! 탕! 탕! 탕!
    ja: ダン！ダン！ダン！ダン！
  event_goddessfall2_04_e_111:
    speaker: "<Narration>"
    en: Snow White's gun spits fire,
    ko: 스노우 화이트의 총이 불을 뿜는다.
    ja: スノーホワイトのライフルが火を放った
  event_goddessfall2_04_e_112:
    speaker: "<Narration>"
    en: blasting Chatterbox's head to pieces.
    ko: 토커티브의 뽑혀 나간 머리가 너덜너덜해진다.
    ja: |-
      吹き飛ばされたトーカティブの頭は
      すでにボロボロになっている
  event_goddessfall2_04_e_113:
    speaker: "<Narration>"
    en: Then she stomps on what's left.
    ko: 스노우 화이트는 그것을 짓밟는다.
    ja: スノーホワイトは転がる頭を踏みつけた
  event_goddessfall2_04_e_114:
    speaker: snowwhite
    en: You talk too much.
    ko: 너는 말이 너무 많아.
    ja: お前は口が動きすぎる。
  event_goddessfall2_04_e_115:
    speaker: hongryeon
    en: Rapunzel, how fares Marian?
    ko: 라푼젤. 마리안의 상태는 어떤가.
    ja: ラプンツェル、マリアンの具合は？
  event_goddessfall2_04_e_116:
    speaker: rapunzel
    en: She's sustained severe external damage, and her core output has dropped significantly.
    ko: 외상이 심해요. 코어의 출력도 많이 떨어졌고요.
    ja: |-
      重度の外傷です。
      コアの出力もかなり落ちています。
  event_goddessfall2_04_e_117:
    speaker: snowwhite
    en: Can she be moved?
    ko: 옮길 수 있나?
    ja: 運べるか？
  event_goddessfall2_04_e_118:
    speaker: rapunzel
    en: I don't think this is the right time for that.
    ko: 지금은 그럴 때가 아닌 것 같네요.
    ja: 今は別の問題がありますね。
  event_goddessfall2_04_e_119:
    speaker: hongryeon
    en: Lo, she cometh.
    ko: 그래. 오는군.
    ja: ああ。来たようだ。
  event_goddessfall2_04_e_120:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_04_e_121:
    speaker: "<Narration>"
    en: Snow White raises her head
    ko: 스노우 화이트는 고개를 든다.
    ja: スノーホワイトは頭を上げた
  event_goddessfall2_04_e_122:
    speaker: "<Narration>"
    en: and looks at the Queen.
    ko: 퀸을 바라본다.
    ja: 視線の先にクイーンがいる
  event_goddessfall2_04_e_123:
    speaker: "<Narration>"
    en: The Queen looks back at them.
    ko: 퀸도 그녀들을 바라본다.
    ja: クイーンも彼女たちを凝視していた
  event_goddessfall2_04_e_124:
    speaker: "<Narration>"
    en: At last, the white Pilgrims...
    ko: 백색의 순례자들이 마침내.
    ja: 白き巡礼者たちは、ついに…
  event_goddessfall2_04_e_125:
    speaker: "<Narration>"
    en: stand before the jet-black Queen.
    ko: 칠흑의 여왕 앞에 섰다.
    ja: 漆黒の女王の前に立った
  event_goddessfall2_04_e_126:
    speaker: snowwhite
    en: The Queen...!
    ko: 퀸…!
    ja: クイーン…！
  event_goddessfall2_04_e_127:
    speaker: hongryeon
    en: I shall sever thy neck.
    ko: 그 목, 베어주겠네.
    ja: その首、もらい受ける。
  event_goddessfall2_04_e_128:
    speaker: rapunzel
    en: This is the end, Queen.
    ko: 끝입니다. 퀸.
    ja: これで終わりです。クイーン。
event_goddessfall2_05_s:
  event_goddessfall2_05_s_1:
    speaker: janghwa_n
    en: That's different from what you told Nayuta.
    ko: 나유타에게 했던 말과는 다르네?
    ja: ナユタに言ってたことと違わない？
  event_goddessfall2_05_s_2:
    speaker: mirror_r
    en: What do you mean?
    ko: 뭐가요?
    ja: 何がでしょう？
  event_goddessfall2_05_s_3:
    speaker: janghwa_n
    en: About Marian.
    ko: 마리안 얘기야.
    ja: マリアンのこと。
  event_goddessfall2_05_s_4:
    speaker: janghwa_n
    en: You told Nayuta she's the next Queen, but to Chatterbox, you said she's only
      the next vessel for the Queen.
    ko: |-
      나유타에게는 차기 퀸.
      토커티브에게는 퀸의 다음 바디.
    ja: |-
      ナユタには次のクイーンって言って、
      トーカティブにはクイーンの次のボディ。
  event_goddessfall2_05_s_5:
    speaker: janghwa_n
    en: So, which is it?
    ko: 어느 쪽이 맞는 거야?
    ja: どっちが正しいの？
  event_goddessfall2_05_s_6:
    speaker: mirror_r
    en: Well, of course...
    ko: 그야 당연히.
    ja: それは、当然…
  event_goddessfall2_05_s_7:
    speaker: mirror_r
    en: what I told Nayuta.
    ko: 나유타 쪽이 맞죠.
    ja: ナユタに言ったことです。
  event_goddessfall2_05_s_8:
    speaker: janghwa_n
    en: So you tricked Chatterbox?
    ko: 토커티브를 속인 거네?
    ja: トーカティブはだましてるってこと？
  event_goddessfall2_05_s_9:
    speaker: mirror_r
    en: Yes, there's no reason not to.
    ko: 예. 안 그럴 이유가 없거든요.
    ja: ええ。利用しない手はありません。
  event_goddessfall2_05_s_10:
    speaker: mirror_r
    en: Poor Chatterbox is desperately seeking the Queen's approval.
    ko: 가여운 토커티브는 퀸에게 인정받기 위해 애쓰고 있어요.
    ja: |-
      かわいそうなトーカティブは、
      クイーンに認められようと必死ですから。
  event_goddessfall2_05_s_11:
    speaker: mirror_r
    en: Believing he has already been recognized and saved by her, he will do anything
      for her...
    ko: |-
      자신은 퀸에게 인정받고 구원받았으니,
      퀸을 위해 뭐든 해서 인정받고 싶다는….
    ja: |-
      自分はクイーンに認められて救われた。
      だから今度はクイーンのために尽くし、
      もっと認められたい…
  event_goddessfall2_05_s_12:
    speaker: mirror_r
    en: He's burning with a sense of purpose, however hopelessly misguided it may
      be.
    ko: 거짓된 사명에 불타고 있죠.
    ja: そういうありもしない使命に燃えているのです。
  event_goddessfall2_05_s_13:
    speaker: janghwa_n
    en: The Queen would never acknowledge Chatterbox.
    ko: 퀸이 토커티브를? 그럴 리가.
    ja: クイーンがトーカティブを？ありえないでしょ。
  event_goddessfall2_05_s_14:
    speaker: janghwa_n
    en: So you lied to him?
    ko: 네가 거짓말했구나?
    ja: そこからウソってこと？
  event_goddessfall2_05_s_15:
    speaker: mirror_r
    en: Yes, I lied and told him the Queen said so.
    ko: 예. 퀸이 그러더라~ 라고 거짓말했죠.
    ja: |-
      ええ。クイーンがそう言っていると
      吹き込んだだけです。
  event_goddessfall2_05_s_16:
    speaker: mirror_r
    en: He really fell for it easily.
    ko: 참 쉽게 넘어오더라고요.
    ja: とても簡単でした。
  event_goddessfall2_05_s_17:
    speaker: mirror_r
    en: Since Chatterbox isn't a Heretic, he can't hear the Queen's voice anyway.
      So it was really easy.
    ko: 헬레틱이 아니다 보니 퀸의 목소리를 들을 리도 없으니까, 진짜 쉬웠어요.
    ja: |-
      ヘレティックではないものに、
      クイーンの声は聞こえませんから。
  event_goddessfall2_05_s_18:
    speaker: mirror_r
    en: From my perspective, the more protectors Marian has, the better.
    ko: 제 입장에서는 마리안의 보호자가 하나라도 더 있는 게 좋아요.
    ja: |-
      私としては、マリアンの保護者は
      少しでも多い方がいいですしね。
  event_goddessfall2_05_s_19:
    speaker: mirror_r
    en: He didn't seem to understand what being a protector means, so I had to remind
      him, but it should be fine now.
    ko: 보호자의 의미를 잘 모르는 것 같아 멋대로 굴었지만, 다시 얘기해 놨으니 이젠 괜찮겠죠.
    ja: |-
      保護の意味がよく分かっていなかったようで、
      少々行き過ぎな部分もありましたが…
      釘を刺しておきましたし、問題ないでしょう。
  event_goddessfall2_05_s_20:
    speaker: mirror_r
    en: And besides, Chatterbox has ties with the Heretics, so he brings me all sorts
      of information.
    ko: |-
      거기다 토커티브는 헬레틱들과 연이 있으니,
      정보도 이것저것 물어오고요.
    ja: |-
      それにヘレティックとつながりもありますし、
      情報源としても役に立ちますから。
  event_goddessfall2_05_s_21:
    speaker: mirror_r
    en: Such a pitiful little creature, so very easy to manipulate.
    ko: 아주 이용해먹기 쉬운 가여운 존재죠.
    ja: 利用されやすい、哀れな存在ですね。
  event_goddessfall2_05_s_22:
    speaker: janghwa_n
    en: And if he goes telling the other Heretics... what then?
    ko: 다른 헬레틱들에게 얘기하면 어떡하려고 그래?
    ja: |-
      他のヘレティックに本当のことを
      言われたらどうするの？
  event_goddessfall2_05_s_23:
    speaker: mirror_r
    en: He won't. He thinks doing so might cost him the Queen's recognition.
    ko: 절대 안 해요. 그러면 퀸에게 받을 인정을 빼앗길 수 있다고 생각할 테니까요.
    ja: |-
      絶対に信じません。
      大事な手柄を横取りしようとしているのかも
      しれないでしょう？
  event_goddessfall2_05_s_24:
    speaker: mirror_r
    en: Hehe, he really is something. I hope the next Queen turns out like that too.
    ko: 후후. 참 좋다니까요. 다음 퀸도 저랬으면 좋겠어요.
    ja: |-
      ふふ。扱いやすくて素敵です。
      次のクイーンもこうだといいのですが。
  event_goddessfall2_05_s_25:
    speaker: mirror_r
    en: Oh, there was one time he was a bit of a headache.
    ko: 아, 딱 한 번 골치 아팠던 적이 있었는데.
    ja: ああ、一度だけ困ったことがありました。
  event_goddessfall2_05_s_26:
    speaker: mirror_r
    en: Nihilister once ordered Chatterbox to find Vapaus,
    ko: 니힐리스타가 토커티브한테 언체인드를 찾으라고 시켰었거든요.
    ja: |-
      ニヒリスターがトーカティブに
      アンチェインド探しを命令した時です。
  event_goddessfall2_05_s_27:
    speaker: mirror_r
    en: and I had to rack my brain to find a way to clean that up.
    ko: 그거 수습한다고 머리를 좀 굴렸죠.
    ja: あれは対応に少し頭を悩ませました。
  event_goddessfall2_05_s_28:
    speaker: mirror_r
    en: Other than that, there's no puppet quite like him.
    ko: 그것 말고는, 저만한 꼭두각시가 또 없어요.
    ja: |-
      その時を除けばずっと、
      これ以上ない最高の傀儡です。
  event_goddessfall2_05_s_29:
    speaker: janghwa_n
    en: I'm realizing all over again what a nasty piece of work you are.
    ko: 새삼 느끼는 거지만, 진짜 못됐네 너.
    ja: |-
      改めて感じたけど…
      ほんとサイッテーね、あなた。
  event_goddessfall2_05_s_30:
    speaker: mirror_r
    en: I, too, would do anything to win.
    ko: 저 역시, 이기기 위해선 무엇이든 할 수 있으니까요.
    ja: |-
      私だって、勝つためなら
      手段は選ばない覚悟ですから。
  event_goddessfall2_05_s_31:
    speaker: "<Narration>"
    en: Trombe, Mantra, and T.A.L.O.S. run side by side.
    ko: 트롬베와 만트라, 탈로스가 나란히 달린다.
    ja: |-
      トロンベとマントラ、タロスが
      並んで戦場を駆け抜ける
  event_goddessfall2_05_s_32:
    speaker: "<Narration>"
    en: The surviving Nayuta clones had their eyes fixed on that sight.
    ko: 살아남은 나유타들이 그 모습을 바라본다.
    ja: |-
      生き残っていたナユタたちの視線は、
      その姿に集中していた
  event_goddessfall2_05_s_33:
    speaker: "<Narration>"
    en: One lifts a hand in farewell. Another lowers her head in a solemn bow. A third
      clasps her hands in silent prayer.
    ko: 손을 흔들어주는 나유타, 고개 숙여 인사하는 나유타, 합장하는 나유타.
    ja: |-
      手を振るナユタ、頭を下げるナユタ、
      合掌するナユタ…
  event_goddessfall2_05_s_34:
    speaker: "<Narration>"
    en: Though their voices don't reach them, their meaning is clear.
    ko: 말은 들려오지 않았지만 무엇을 얘기하는지는 알 수 있었다.
    ja: |-
      声は届かないが、
      伝えようとしていることは理解できる
  event_goddessfall2_05_s_35:
    speaker: nayuta_m
    en: 'Our charge is clear:'
    ko: 우리 목표는 단순하외다.
    ja: 私たちの目標は、ただ一つ。
  event_goddessfall2_05_s_36:
    speaker: nayuta_m
    en: to vanquish the Maiden of Thunder.
    ko: 뇌전 소저를 쓰러뜨리는 것.
    ja: 雷電…インディビリアを倒すこと。
  event_goddessfall2_05_s_37:
    speaker: nayuta_m
    en: Verily, Young Lady Harran's strike hath surely left her frame marred beyond
      measure.
    ko: 하란 소저의 공격에 의해 몸은 이미 망가질 대로 망가졌을 것이오.
    ja: |-
      ハランの攻撃で、すでに身体には
      深手を負っているはずです。
  event_goddessfall2_05_s_38:
    speaker: nayuta_m
    en: Yet our foe is a Heretic, whose gift of regeneration must not be scorned.
    ko: |-
      허나 상대는 어디까지나 헬레틱.
      재생 능력을 얕볼 수 없소.
    ja: |-
      ただし、相手はあくまでヘレティック。
      再生能力はあなどれません。
  event_goddessfall2_05_s_39:
    speaker: nayuta_m
    en: Ere she be made whole anew, we must needs bring her down.
    ko: 온전해지기 전에, 우리가 마무리를 지어야 하오.
    ja: |-
      完全に復活される前に、
      私たちの手で引導を渡す必要があります。
  event_goddessfall2_05_s_40:
    speaker: nayuta_m
    en: Thus shall the Forerunner maidens contend with one hindrance fewer in their
      strife.
    ko: 그래야 선구자 소저들의 싸움에 변수가 줄어들 테니.
    ja: |-
      それが成れば、先駆者たちの戦いも
      易くなるはず。
  event_goddessfall2_05_s_41:
    speaker: kilo_op_l
    en: Um, what should we do about Chatterbox?
    ko: 저, 토커티브는 어떻게 하나요?
    ja: あの、トーカティブはどうするんですか？
  event_goddessfall2_05_s_42:
    speaker: nayuta_m
    en: You need not trouble thyself over the Loquacious One.
    ko: 수다쟁이는 신경 쓸 것 없소.
    ja: あちらは無視して構いません。
  event_goddessfall2_05_s_43:
    speaker: nayuta_m
    en: "... He is naught but a mere pawn, subject to the whims of more puissant hands."
    ko: "…휘둘리는 나약한 자일 뿐이외다."
    ja: "…しょせん振り回されるだけの、哀れな者です。"
  event_goddessfall2_05_s_44:
    speaker: nayuta_m
    en: He shall pose no threat. Verily, he mayhap hath already met his demise.
    ko: |-
      위협이 되진 않을 것이오.
      어쩌면 지금쯤 나가떨어졌을지도 모르는 일이지.
    ja: |-
      ここでの脅威にはならないでしょう。
      すでに離脱している可能性もあります。
  event_goddessfall2_05_s_45:
    speaker: talos
    en: I strongly agree. The special entity Chatterbox is not strong.
    ko: |-
      격하게 동감합니다.
      특수 개체 토커티브는 강하지 않습니다.
    ja: |-
      強く同意します。
      特殊個体トーカティブは脅威ではありません。
  event_goddessfall2_05_s_46:
    speaker: kilo_op_l
    en: Well... that's two wins out of two. Yeah, that's right.
    ko: 그… 야 2전 2승이니까. 응. 그렇네.
    ja: それは…2戦2勝だから？まあ、そうかも…
  event_goddessfall2_05_s_47:
    speaker: kilo_op_l
    en: And if push comes to shove...
    ko: 그리고 여차하면….
    ja: もし、いざとなったら…
  event_goddessfall2_05_s_48:
    speaker: talos
    en: "I will no longer connect our cores. \nThe risk is too great."
    ko: |-
      직렬연결은 이제 사용하지 않습니다.
      리스크가 너무 높습니다.
    ja: |-
      コアの直列接続は使用しません。
      リスクが高すぎます。
  event_goddessfall2_05_s_49:
    speaker: kilo_op_l
    en: I'll only use it if I have to... if I really have to.
    ko: 여차하면 쓰겠다는 거야, 여차하면.
    ja: 万が一の話だよ、万が一の。
  event_goddessfall2_05_s_50:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_51:
    speaker: nayuta_m
    en: Art thou nervous, Young Lady Chime?
    ko: 차임 소저. 긴장한 것이오?
    ja: チャイム。緊張ですか？
  event_goddessfall2_05_s_52:
    speaker: chime
    en: "'Tis not so!"
    ko: 그럴 리가 있겠느냐.
    ja: そんなことあるはずがないのだ。
  event_goddessfall2_05_s_53:
    speaker: nayuta_m
    en: Pray, why art thou so silent?
    ko: 헌데 어찌 그리 말이 없으시오?
    ja: では、なぜ静かなのです？
  event_goddessfall2_05_s_54:
    speaker: chime
    en: Speak not to me!
    ko: 말 걸지 말거라.
    ja: 話しかけるんじゃないのだ。
  event_goddessfall2_05_s_55:
    speaker: "<Narration>"
    en: Nayuta closes her mouth and gazes silently at Chime's profile.
    ko: 나유타는 입을 다물고 차임의 옆모습을 물끄러미 바라보았다.
    ja: ナユタは何も言わず、チャイムの横顔を眺めた
  event_goddessfall2_05_s_56:
    speaker: "<Narration>"
    en: At first glance, she seems tense, but her expression is clearly...
    ko: 얼핏 보면 긴장한 것처럼 보이지만, 그 표정은 분명히….
    ja: 緊張のようにも見えるが、その表情は明らかに…
  event_goddessfall2_05_s_57:
    speaker: nayuta_m
    en: Hmm...
    ko: "…호오."
    ja: "…なるほど。"
  event_goddessfall2_05_s_58:
    speaker: nihilister_m
    en: Haha. Serves you right.
    ko: 하하. 꼴 좋네.
    ja: アハハッ。いいザマだ。
  event_goddessfall2_05_s_59:
    speaker: indivilia
    en: Shut up...!
    ko: 닥쳐요…!
    ja: 黙りなさい…！
  event_goddessfall2_05_s_60:
    speaker: nihilister_m
    en: You can't even transform?
    ko: 거대화도 못 해?
    ja: 巨大化もできなくなってんのか？
  event_goddessfall2_05_s_61:
    speaker: nihilister_m
    en: Huh... looks like I might actually be able to beat you.
    ko: 이거 잘하면 내가 너 이길 수도 있겠는걸?
    ja: こりゃ、今の俺でも勝てるかもしれねえな？
  event_goddessfall2_05_s_62:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_63:
    speaker: "<Narration>"
    en: Indivilia's tail lashes out,
    ko: 인디빌리아의 꼬리가 휘둘러진다.
    ja: インディビリアが尻尾を振るった
  event_goddessfall2_05_s_64:
    speaker: "<Narration>"
    en: leaving a long gash across Nihilister's cheek.
    ko: 니힐리스타의 뺨에 길게 그어진 상처가 생겨났다.
    ja: ニヒリスターの頬に長いひっかき傷が生まれた
  event_goddessfall2_05_s_65:
    speaker: indivilia
    en: Ah, my apologies. My body isn't quite cooperative, so my control is off.
    ko: |-
      아, 이런. 미안해요.
      몸이 안 좋아서 제어가 잘 안되네요.
    ja: |-
      ああ、失礼。
      体調が優れず、制御が利かないのです。
  event_goddessfall2_05_s_66:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_67:
    speaker: indivilia
    en: Did you see my tail just now? No?
    ko: |-
      근데 제 꼬리가 보이셨나요?
      아니죠?
    ja: |-
      それはそうと、私の尻尾が見えましたか？
      見えなかったでしょう？
  event_goddessfall2_05_s_68:
    speaker: indivilia
    en: Then I suggest you stop uttering such nonsense.
    ko: 그러니 그딴 말도 안 되는 소리는 그만 하세요.
    ja: |-
      そういうことですから、
      冗談はやめておいた方がいいでしょうね。
  event_goddessfall2_05_s_69:
    speaker: nihilister_m
    en: So just give me an arm already.
    ko: 그러니까 팔 하나만 달라니까.
    ja: いいから、腕1本よこせよ。
  event_goddessfall2_05_s_70:
    speaker: nihilister_m
    en: I'll regenerate and help you out.
    ko: 재생해서 도와줄 테니까.
    ja: 再生さえできりゃ手伝ってやるからさ。
  event_goddessfall2_05_s_71:
    speaker: nihilister_m
    en: Right now, I'm practically a walking corpse. Even if I wanted to help, I couldn't.
    ko: 지금은 뭐, 산송장이나 다름없어서 도와주려야 도와줄 수가 없네.
    ja: 今の状態じゃ、助けたくたって助けようがねえ。
  event_goddessfall2_05_s_72:
    speaker: nihilister_m
    en: I'd love to obey our Great Mother like a loyal mutt,
    ko: 나도 위대하신 어머니의 명령을 개 마냥 충실히 따르고 싶은데 말이야.
    ja: |-
      あ～、俺も偉大なるオカアサマに尻尾振って、
      忠犬みてえに従いてぇんだけどな～？
  event_goddessfall2_05_s_73:
    speaker: nihilister_m
    en: just like you.
    ko: 너처럼.
    ja: お前みたいにさ。
  event_goddessfall2_05_s_74:
    speaker: indivilia
    en: "... You're best suited to remain a fool who can do nothing in this fight."
    ko: "…당신은 그냥 이 싸움에서 아무것도 하지 못하는 머저리로 있어 주는 게 가장 어울려요."
    ja: |-
      …あなたは戦いに参加することも出来ない
      道化でいることがお似合いです。
  event_goddessfall2_05_s_75:
    speaker: indivilia
    en: And that's exactly what you'll continue to be.
    ko: 앞으로도 그럴 거고요.
    ja: これからもそのままでいてください。
  event_goddessfall2_05_s_76:
    speaker: nihilister_m
    en: Haha, you actually think you've got what it takes
    ko: 하하. 너 그런데 자신은 있냐?
    ja: ヘッ…お前、自信あんのかよ？
  event_goddessfall2_05_s_77:
    speaker: nihilister_m
    en: to take them on?
    ko: 저것들 상대할 자신.
    ja: あいつらを一人で相手にする自信がさ。
  event_goddessfall2_05_s_78:
    speaker: indivilia
    en: What is there to fear? The Queen is with us.
    ko: 퀸이 있는데 무슨 걱정인가요.
    ja: |-
      クイーンの前で、
      他に恐れるべきものなどありません。
  event_goddessfall2_05_s_79:
    speaker: nihilister_m
    en: Well, I'll be... such control.
    ko: 그것 참 대단하네. 지배력.
    ja: マジですげえな。支配の力ってヤツは。
  event_goddessfall2_05_s_80:
    speaker: nihilister_m
    en: To think someone who ran wild like you would follow orders so well.
    ko: 그렇게 제멋대로였던 네가 말을 이렇게나 잘 듣다니 말이야.
    ja: |-
      あんなに自分勝手だったお前が、
      こ～んないい子ちゃんになるなんて。
  event_goddessfall2_05_s_81:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_82:
    speaker: "<Narration>"
    en: Indivilia snaps her head around, irritation flaring.
    ko: 인디빌리아는 신경질적으로 고개를 돌렸다.
    ja: |-
      インディビリアは
      いらだちを隠せない様子で振り返った
  event_goddessfall2_05_s_83:
    speaker: "<Narration>"
    en: A swirling cloud of dust is approaching.
    ko: 먼지구름이 다가온다.
    ja: 砂ぼこりがあがっている
  event_goddessfall2_05_s_84:
    speaker: indivilia
    en: "... Human imposters."
    ko: "…유사 인간들이군요."
    ja: "…人間もどき。"
  event_goddessfall2_05_s_85:
    speaker: nihilister_m
    en: Let's see.
    ko: 어디 보자.
    ja: どれどれ…
  event_goddessfall2_05_s_86:
    speaker: nihilister_m
    en: "... Haha."
    ko: "…하하."
    ja: "…アハハ…"
  event_goddessfall2_05_s_87:
    speaker: nihilister_m
    en: Hahaha!
    ko: 하하하!
    ja: ハハハハ！
  event_goddessfall2_05_s_88:
    speaker: nihilister_m
    en: A little brat, a hunk of scrap, and a damn monk?
    ko: 꼬맹이 하나에, 로봇에, 땡중이잖아?
    ja: チビに、ガラクタに、クソ仙人じゃねえか？
  event_goddessfall2_05_s_89:
    speaker: nihilister_m
    en: Hey, looks like they're here for you.
    ko: 야, 쟤들 너 잡으러 왔나 보다.
    ja: あいつら、お前を倒しに来てるんだぜ。
  event_goddessfall2_05_s_90:
    speaker: nihilister_m
    en: And you know what that means, right?
    ko: 이게 무슨 말이겠어?
    ja: どういうことか分かるか？
  event_goddessfall2_05_s_91:
    speaker: nihilister_m
    en: Those nobodies actually think they can take you down!
    ko: 저런 어중이떠중이들이, 너 잡을 수 있을 거라고 생각하고 오는 거잖아 지금!
    ja: |-
      あんな寄せ集めのザコどもで、
      相手になるって思われてんだぞ！
  event_goddessfall2_05_s_92:
    speaker: nihilister_m
    en: What the hell have you been up to that even those losers are coming after
      you?
    ko: 너 도대체 어디서 뭘 하고 다녔길래 저런 것들까지 널 잡으러 오냐? 응?
    ja: |-
      どこで何してきたんだよ？
      あんな奴らにナメられるなんてさ！ええ？
  event_goddessfall2_05_s_93:
    speaker: nihilister_m
    en: Hahaha! You're seriously pathetic, you know that?
    ko: 하하하! 진짜, 진짜 형편없네 너!
    ja: ハハハハ！マジでお笑いだ！
  event_goddessfall2_05_s_94:
    speaker: "<Narration>"
    en: Indivilia's tail lashes out,
    ko: 인디빌리아의 꼬리가 휘둘러진다.
    ja: インディビリアが尻尾を振るった
  event_goddessfall2_05_s_95:
    speaker: "<Narration>"
    en: the blade at its tip stopping a breath away from Nihilister's neck.
    ko: 그 끝의 칼날이 니힐리스타의 목 바로 앞에서 멈췄다.
    ja: 先端がニヒリスターの首筋の手前で止まった
  event_goddessfall2_05_s_96:
    speaker: "<Narration>"
    en: Unfazed, Nihilister runs her fingers along the blade.
    ko: 니힐리스타는 여유롭게 그 칼날을 어루만졌다.
    ja: |-
      ニヒリスターは余裕の表情を浮かべ
      尻尾の先端をなでた
  event_goddessfall2_05_s_97:
    speaker: nihilister_m
    en: Great Mother said no fighting, remember?
    ko: 위대하신 어머니가 싸움 금지라고 했잖아. 잊었어?
    ja: |-
      仲間同士の戦いは禁止だって
      言われてるだろ？忘れたのか？
  event_goddessfall2_05_s_98:
    speaker: indivilia
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_99:
    speaker: nihilister_m
    en: Hey, they're coming.
    ko: 야. 쟤들 온다.
    ja: それより、あいつらだ。
  event_goddessfall2_05_s_100:
    speaker: nihilister_m
    en: Better get ready to die.
    ko: 너 이제 죽을 준비해라.
    ja: 自分の首でも洗っとけよ。
  event_goddessfall2_05_s_101:
    speaker: nihilister_m
    en: I'll even say a prayer for you, heh.
    ko: 명복은 빌어줄게.
    ja: 冥福ぐらいは祈ってやるぜ。
  event_goddessfall2_05_s_102:
    speaker: indivilia
    en: "... Very well."
    ko: "…좋아요."
    ja: "…いいでしょう。"
  event_goddessfall2_05_s_103:
    speaker: indivilia
    en: How fortuitous.
    ko: 마침 잘됐네요.
    ja: ちょうどよかった。
  event_goddessfall2_05_s_104:
    speaker: indivilia
    en: I have been in need of a vessel for my ire.
    ko: 저도 화풀이 상대가 필요했으니까.
    ja: |-
      いらだちをぶつける相手が
      欲しかったところです。
  event_goddessfall2_05_s_105:
    speaker: nayuta_m
    en: Behold, the Maiden of Thunder and Fire Dragon standeth before us.
    ko: 뇌전 소저와 화룡 소저가 보이오.
    ja: 雷電と火竜ですね。
  event_goddessfall2_05_s_106:
    speaker: chime
    en: I shall go first.
    ko: 먼저 가마.
    ja: 私が先に行くのだ。
  event_goddessfall2_05_s_107:
    speaker: kilo_op_l
    en: Huh? Ch-Chime! What are you gonna do all by yourself...?!
    ko: 예? 차, 차임! 혼자서 뭘 어떻게…!
    ja: えっ？チャイム！？1人で何を…！
  event_goddessfall2_05_s_108:
    speaker: chime
    en: Hie thee, Trombe!
    ko: 달리거라! 트롬베!
    ja: 行くのだ！トロンベ！
  event_goddessfall2_05_s_109:
    speaker: "<Narration>"
    en: Trombe gallops ahead with Chime on its back.
    ko: 차임을 실은 트롬베가 질주한다.
    ja: チャイムを乗せたトロンベが速度を上げた
  event_goddessfall2_05_s_110:
    speaker: "<Narration>"
    en: In an instant, it puts distance between itself and T.A.L.O.S. and Mantra.
    ko: 탈로스와 만트라와의 거리가 삽시간에 멀어진다.
    ja: タロスとマントラが一瞬で突き放される
  event_goddessfall2_05_s_111:
    speaker: kilo_op_l
    en: Chime! Wait! What kind of reckless stunt is this...?!
    ko: 차임! 기다려요! 이게 무슨 무모한…!
    ja: |-
      チャイム！待ってください！
      なんでそんな無茶な…！
  event_goddessfall2_05_s_112:
    speaker: chime
    en: Thou villain! Indivilia!
    ko: 네 이놈--!! 인디빌리아--!!
    ja: 貴様ぁぁ！！インディビリア！！
  event_goddessfall2_05_s_113:
    speaker: chime
    en: How darest thou! How darest thou wound Her Highness' sacred body?!
    ko: 감히! 감히 네놈이! 아가씨의 옥체에 상처를 냈겠다!
    ja: よくも…よくも！お嬢さまのお体に傷を！
  event_goddessfall2_05_s_114:
    speaker: chime
    en: That grievous crime... e'en a hundred deaths shall not atone for it!
    ko: 그 죄! 수백 번 죽어도 용서받지 못한다!
    ja: その罪！万死を以ても償えぬのだ！
  event_goddessfall2_05_s_115:
    speaker: chime
    en: I shall take thy head, mark my words,
    ko: 내 반드시!
    ja: この手で、必ず！
  event_goddessfall2_05_s_116:
    speaker: chime
    en: though it be the last thing I do!
    ko: 네놈의 수급을 가져가고야 말것이니라아아아--!!
    ja: 貴様の首をとってやるのだぁぁぁぁ！！
  event_goddessfall2_05_s_117:
    speaker: kilo_op_l
    en: Chime, you've got to calm down, or—
    ko: 차임! 그렇게 흥분해서는…!
    ja: チャイム！そんなに興奮したら…！
  event_goddessfall2_05_s_118:
    speaker: indivilia
    en: Come to think of it, I owe you one.
    ko: 그러고 보니 당신에겐 빚이 있었죠.
    ja: |-
      誰かと思えば、
      あなたには借りを作ったままでしたね。
  event_goddessfall2_05_s_119:
    speaker: indivilia
    en: Allow me to exact my due.
    ko: 복수해 드리죠.
    ja: ここで返すとしましょう。
  event_goddessfall2_05_s_120:
    speaker: "<Narration>"
    en: The distance between Indivilia and Chime narrows.
    ko: 인디빌리아와 차임의 거리가 좁혀진다.
    ja: インディビリアとチャイムの距離が縮む
  event_goddessfall2_05_s_121:
    speaker: "<Narration>"
    en: Chime, still astride Trombe, suddenly leaps forward as if throwing herself.
    ko: 트롬베의 등에 올라타 있던 차임이 앞으로 몸을 던지듯 뛰어오른다.
    ja: |-
      トロンベの背中に立ったチャイムが、
      前方へ身を投げるように飛び上がった
  event_goddessfall2_05_s_122:
    speaker: "<Narration>"
    en: Indivilia smiles, as though she had expected it all along, confident in her
      victory.
    ko: 인디빌리아는 이것을 예상했다는 듯, 미소 지으며 승리를 확신한다.
    ja: |-
      インディビリアは予想していたというように、
      勝利を確信した笑みを浮かべた
  event_goddessfall2_05_s_123:
    speaker: "<Monologue>"
    en: Aye, keep smiling so.
    ko: 그래. 그렇게 웃어두거라.
    ja: "――そうだ、そうやって笑うがいい"
  event_goddessfall2_05_s_124:
    speaker: "<Monologue>"
    en: Thou'lt surely aim for my throat.
    ko: 네놈은 반드시 나의 목을 노린다.
    ja: 必ず私の首を狙ってくる
  event_goddessfall2_05_s_125:
    speaker: "<Monologue>"
    en: That is thy way, after all.
    ko: 그런 녀석이니까.
    ja: それが貴様の性質なのだ
  event_goddessfall2_05_s_126:
    speaker: "<Monologue>"
    en: As I struck at thine, so shalt thou strike at mine.
    ko: 내가 네놈의 목을 베었을 때와 같이, 내 목을 베려 들 것이니라.
    ja: 代わり映えもなく、この首を斬ろうとするはず
  event_goddessfall2_05_s_127:
    speaker: "<Monologue>"
    en: I have no skill to dodge thy blow,
    ko: 나에게 네놈의 공격을 보고 피할 재주는 없다.
    ja: 攻撃を見切ってかわすような才は、私にはない
  event_goddessfall2_05_s_128:
    speaker: "<Monologue>"
    en: yet I trust it shall come to pass.
    ko: 그저 그럴 것이라 믿을 뿐이니라.
    ja: ただ、己の読みを信じるのみ――
  event_goddessfall2_05_s_129:
    speaker: "<Narration>"
    en: Chime flips through the air.
    ko: 차임이 공중제비를 돈다.
    ja: チャイムが空中で姿勢を変えた
  event_goddessfall2_05_s_130:
    speaker: "<Narration>"
    en: Indivilia's blade passes through where her neck had been.
    ko: 차임의 목이 있던 곳을 인디빌리아의 칼날이 지나간다.
    ja: |-
      首があったはずの位置を、
      インディビリアの刃が通り抜けた
  event_goddessfall2_05_s_131:
    speaker: "<Narration>"
    en: Instead, her back takes the blow, but it isn't deep.
    ko: 차임의 등이 베인다. 하지만 깊지 않다.
    ja: |-
      チャイムの背中をかすめて傷が走ったものの、
      深くはない
  event_goddessfall2_05_s_132:
    speaker: indivilia
    en: "... What...!?"
    ko: "…뭣…!?"
    ja: "…なっ…！？"
  event_goddessfall2_05_s_133:
    speaker: "<Narration>"
    en: Chime's spin comes to a halt, and her eyes lock with Indivilia's.
    ko: 회전을 마친 차임의 눈이 인디빌리아와 마주친다.
    ja: |-
      一回転したチャイムの眼が、
      インディビリアをとらえた
  event_goddessfall2_05_s_134:
    speaker: chime
    en: Now, 'tis my only chance.
    ko: 지금이다. 유일한 기회다.
    ja: この瞬間こそ、千載一遇の時…
  event_goddessfall2_05_s_135:
    speaker: chime
    en: Indivilia...!
    ko: 인디빌리아…!
    ja: インディビリア…！
  event_goddessfall2_05_s_136:
    speaker: chime
    en: The glorious power Her Highness hast granted me...!
    ko: 아가씨가 나에게 넘겨준 영광스러운 힘…!
    ja: |-
      お嬢さまが私に預けてくださった、
      誇り高き力…！
  event_goddessfall2_05_s_137:
    speaker: chime
    en: I shall pour it all upon thee...!
    ko: 네놈에게 쏟아주마…!
    ja: 味わうといいのだ…！
  event_goddessfall2_05_s_138:
    speaker: "<Narration>"
    en: Alva Particle Conversion-Type Expansive Armament.
    ko: 에블라 입자 전환형 확장 무장.
    ja: エブラ粒子転換式拡張武装
  event_goddessfall2_05_s_139:
    speaker: "<Narration>"
    en: Naked King, activate.
    ko: |-
      네이키드 킹.
      액티브.
    ja: |-
      ネイキッドキング：
      アクティブ
  event_goddessfall2_05_s_140:
    speaker: indivilia
    en: This...!
    ko: 이건…!
    ja: これは…！
  event_goddessfall2_05_s_141:
    speaker: chime
    en: A prize the King has bestoweth upon me!
    ko: 왕께서 하사하시는 상이니라!
    ja: 王からの賜り物である！
  event_goddessfall2_05_s_142:
    speaker: chime
    en: Take it gloriouslyyyyy!
    ko: 영광스럽게! 받거라아아아--!!
    ja: つつしんで受け取るのだぁぁぁ！！
  event_goddessfall2_05_s_143:
    speaker: "<Narration>"
    en: Clad in radiant royal robes, Chime swings her fist.
    ko: 빛나는 왕복을 걸친 차임의 주먹이 휘둘러진다.
    ja: |-
      輝く玉衣をまとったチャイムが
      拳を振り下ろした
  event_goddessfall2_05_s_144:
    speaker: "<Narration>"
    en: The impact triggers a massive shockwave that crashes into Indivilia.
    ko: 거대한 충격파가 인디빌리아를 덮친다.
    ja: 強烈な衝撃波がインディビリアを襲った
  event_goddessfall2_05_s_145:
    speaker: "<Narration>"
    en: Overwhelmed by a pain she knows all too well, she drops to the ground.
    ko: |-
      인디빌리아는 익숙하지만 끔찍한 그 고통을 상기하며,
      바닥에 주저앉았다.
    ja: |-
      インディビリアは
      過去に受けた恐怖と苦痛を思い出しながら、
      地面にひざをついた
  event_goddessfall2_05_s_146:
    speaker: "<Narration>"
    en: Moments later, Chime plummets, her body hitting the ground like a falling
      meteor.
    ko: 차임이 바닥에 추락하듯 쓰러진다.
    ja: チャイムもそのまま地に落ち、倒れた
  event_goddessfall2_05_s_147:
    speaker: kilo_op_l
    en: T.A.L.O.S.! Finish her!
    ko: 날려버려! 탈로스!
    ja: 吹っ飛ばして！タロス！
  event_goddessfall2_05_s_148:
    speaker: talos
    en: Roger. I will blow her all the way into space.
    ko: 라져. 우주까지 날려버리겠습니다.
    ja: 了解。宇宙まで吹き飛ばします。
  event_goddessfall2_05_s_149:
    speaker: "<Narration>"
    en: T.A.L.O.S. charges in, grabs Indivilia by the tail, and hurls her into the
      air with all its might.
    ko: 탈로스가 돌진, 인디빌리아의 꼬리를 잡고 공중으로 힘껏 던진다.
    ja: |-
      タロスが突進し、
      インディビリアの尻尾をつかむと、
      力強く空へほうり投げた
  event_goddessfall2_05_s_150:
    speaker: "<Narration>"
    en: Indivilia plummets, completely out of control.
    ko: 공중에서 제어를 잃은 채 낙하하는 인디빌리아.
    ja: |-
      空中で制御できず、
      インディビリアが落下を始める
  event_goddessfall2_05_s_151:
    speaker: "<Narration>"
    en: Meanwhile, Nayuta positions herself at the spot where she expects Indivilia
      to fall.
    ko: 나유타는 인디빌리아의 낙하 예상 지점에서 자리를 잡았다.
    ja: 落下した先にはナユタが待ち構えていた
  event_goddessfall2_05_s_152:
    speaker: nayuta_m
    en: Howbeit mine outward seeming, this humble one is full well versed in the noble
      art of self-defense... soothly!
    ko: 이래 봬도 소인이 호신술에는 조예가 깊… 소!
    ja: こう見えても、護身術の心得がありまして…ね！
  event_goddessfall2_05_s_153:
    speaker: "<Narration>"
    en: Nayuta swings her arms in a circle.
    ko: 나유타의 양 팔이 원을 그린다.
    ja: ナユタの両腕が円を描いた
  event_goddessfall2_05_s_154:
    speaker: "<Narration>"
    en: The falling Indivilia begins to spin as if being pulled into it.
    ko: 추락하던 인디빌리아는 마치 그 원 안으로 빨려가듯 회전한다.
    ja: |-
      落下していたインディビリアは、
      円に吸い込まれるように回転し…
  event_goddessfall2_05_s_155:
    speaker: "<Narration>"
    en: Her head crashes into the ground at terrifying speed.
    ko: 가속도를 잔뜩 머금은 인디빌리아의 머리가 지면에 처박히며 추락한다.
    ja: 勢いを加速させ、頭から地面に叩き落とされた
  event_goddessfall2_05_s_156:
    speaker: "<Narration>"
    en: A massive shockwave ripples outward, accompanied by a deafening boom.
    ko: 큰 충격파와 굉음이 터져 나온다.
    ja: 大きな衝撃が走り、轟音が響く
  event_goddessfall2_05_s_157:
    speaker: "<Narration>"
    en: The impact on her weakened body leaves Indivilia's mind swimming in haze.
    ko: |-
      약해진 신체에 가해진 충격으로 인해,
      인디빌리아는 정신이 몽롱해진다.
    ja: |-
      もともと弱っていた身体に大打撃を受け、
      インディビリアは意識を失いかけた
  event_goddessfall2_05_s_158:
    speaker: kilo_op_l
    en: "... Chime!"
    ko: "…차임!"
    ja: "…チャイム！"
  event_goddessfall2_05_s_159:
    speaker: chime
    en: Uh... Ugghh...!
    ko: 으… 으윽…!
    ja: うっ…ううっ…！
  event_goddessfall2_05_s_160:
    speaker: "<Narration>"
    en: T.A.L.O.S. drapes a camouflage tarp over Chime, who lies bare on the ground.
    ko: 탈로스가 알몸으로 바닥에 쓰러져 있는 차임에게 위장포를 덮어준다.
    ja: |-
      丸裸で地面に倒れ伏すチャイムに
      タロスが迷彩柄の布をかけた
  event_goddessfall2_05_s_161:
    speaker: kilo_op_l
    en: Are you okay?
    ko: 괜찮아요?
    ja: 大丈夫ですか？
  event_goddessfall2_05_s_162:
    speaker: chime
    en: My... whole body... aches...
    ko: 온… 몸이… 아프구나….
    ja: 身体じゅうが…痛むのだ…
  event_goddessfall2_05_s_163:
    speaker: chime
    en: Her Highness is most wondrous... I cannot fathom how she doth wield this with
      such ease...
    ko: 역시 아가씨는 대단하다… 이런 걸 그렇게 자유자재로 다루시다니….
    ja: |-
      やはりお嬢さまは違うのだ…
      こんなものを自在に扱えるとは…
  event_goddessfall2_05_s_164:
    speaker: kilo_op_l
    en: You're incredible too, Chime! I didn't think you could actually use the Naked
      King...!
    ko: 차임도 대단해요! 진짜 네이키드 킹을 쓸 줄은…!
    ja: |-
      チャイムだってすごいですよ！
      本当にネイキッドキングを使えるなんて…！
  event_goddessfall2_05_s_165:
    speaker: chime
    en: Ha... ha. As the kingdom's foremost vassal... 'tis but... natural.
    ko: 하... 하. 왕국 제일의 신하라면… 당연한 일이니… 라.
    ja: はは…王国一の臣下として…当然…なのだ。
  event_goddessfall2_05_s_166:
    speaker: indivilia
    en: Ah... urgh...!
    ko: 어… 흑…!
    ja: うっ…くっ…！
  event_goddessfall2_05_s_167:
    speaker: nayuta_m
    en: "... Thou art still conscious? How impressive."
    ko: "…아직 정신이 남아있다니 대단하외다."
    ja: "…まだ意識があるとは、さすがですねぇ。"
  event_goddessfall2_05_s_168:
    speaker: indivilia
    en: Nihi... lister...!
    ko: 니힐… 리스타…!
    ja: ニヒリ…スター…！
  event_goddessfall2_05_s_169:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_170:
    speaker: indivilia
    en: Fi... ght...!
    ko: 싸워… 요…!
    ja: あなたも…戦いなさい…！
  event_goddessfall2_05_s_171:
    speaker: nihilister_m
    en: What the hell do you want me to do?
    ko: 뭘 어쩌라는 거야 나보고.
    ja: どうしろってんだよ。
  event_goddessfall2_05_s_172:
    speaker: indivilia
    en: You... useless...!
    ko: 이… 쓸모 없는…!
    ja: この…使えない…！
  event_goddessfall2_05_s_173:
    speaker: nihilister_m
    en: Heh, you're the one who made me this way.
    ko: 하하. 지가 그렇게 만들어놓고 무슨.
    ja: ハハッ。おかげ様でな。
  event_goddessfall2_05_s_174:
    speaker: kilo_op_l
    en: Nihi... lister is really weak right now, right?
    ko: 니힐… 리스타는 지금 정말 약한 상태인 것 맞죠?
    ja: ニヒリスター…本当に弱ってるんですよね？
  event_goddessfall2_05_s_175:
    speaker: kilo_op_l
    en: If she's even a little recovered, there's no way we could handle her on our
      own...!
    ko: 만약 조금이라도 회복한 상태라면 우리들만으로는…!
    ja: |-
      もし少しでも回復されてたら、
      私たちだけじゃ…！
  event_goddessfall2_05_s_176:
    speaker: nihilister_m
    en: "... Damn it."
    ko: "…젠장."
    ja: "…チッ。"
  event_goddessfall2_05_s_177:
    speaker: "<Narration>"
    en: Nihilister takes a step forward.
    ko: 니힐리스타가 앞으로 한 걸음 내딛는다.
    ja: ニヒリスターが一歩前に踏み出した
  event_goddessfall2_05_s_178:
    speaker: "<Narration>"
    en: She clenches and unclenches her fist, shakes out her legs, and rolls her neck
      with a sharp crack.
    ko: |-
      주먹을 쥐었다 폈다 한다.
      다리를 풀고, 목을 돌린다.
    ja: |-
      拳の感覚を確かめ、足をほぐし、
      首をひと回ししている
  event_goddessfall2_05_s_179:
    speaker: kilo_op_l
    en: I-it seems like she actually wants to fight?
    ko: 싸, 싸울 생각으로 가득한데요?
    ja: た、戦う気満々みたいですけど…？
  event_goddessfall2_05_s_180:
    speaker: talos
    en: The detected output is low. However, it is unknown whether she possesses any
      hidden abilities.
    ko: |-
      감지되는 출력은 미약합니다.
      하지만 어떤 비장의 수가 있을지 불명입니다.
    ja: |-
      検知できる出力は微弱です。
      ただし、力を隠しているのかもしれません。
  event_goddessfall2_05_s_181:
    speaker: nihilister_m
    en: "... Hey, damn Monk."
    ko: "…야, 땡중."
    ja: "…よう、クソ仙人。"
  event_goddessfall2_05_s_182:
    speaker: nayuta_m
    en: Yes, Fire Dragon. Speak thy mind.
    ko: 예. 화룡 소저.
    ja: ごあいさつですねぇ。何でしょう。
  event_goddessfall2_05_s_183:
    speaker: nihilister_m
    en: I have to fight you.
    ko: 나 너희랑 싸워야 해.
    ja: 俺は、お前らと戦わなきゃならねえ。
  event_goddessfall2_05_s_184:
    speaker: nihilister_m
    en: I know I don't stand a chance, that it'll just be a meaningless death to stall
      for time.
    ko: 아무런 승산도 없고, 그냥 단순히 시간 끌기밖에 안 되는 개죽음인데.
    ja: |-
      勝ち目もねぇし、ちょっと時間稼ぐための
      犬死にだろうがな。
  event_goddessfall2_05_s_185:
    speaker: nihilister_m
    en: But I have to fight.
    ko: 그래도 싸워야 해.
    ja: それでも戦うしかねえんだ。
  event_goddessfall2_05_s_186:
    speaker: nihilister_m
    en: It's an order—
    ko: "[명령]이거든."
    ja: "「命令」なんだよ。"
  event_goddessfall2_05_s_187:
    speaker: nihilister_m
    en: a damn order I can't refuse.
    ko: 거부할 수 없는, 거지 같은 명령.
    ja: イヤとも言えねえ、クソみてえな命令だ。
  event_goddessfall2_05_s_188:
    speaker: nihilister_m
    en: Ha! The oh-so Great Mother commands me to fight to the death.
    ko: 하하. 죽음을 각오하고 싸우라신다. 위대하신 어머니께서.
    ja: |-
      ヘッ。死ぬ気で戦えってさ。
      偉大なるオカアサマが。
  event_goddessfall2_05_s_189:
    speaker: "<Narration>"
    en: Nihilister kicks the fallen Indivilia.
    ko: 니힐리스타가 쓰러져있는 인디빌리아를 툭 걷어찬다.
    ja: |-
      ニヒリスターが、
      倒れているインディビリアを軽く蹴り飛ばした
  event_goddessfall2_05_s_190:
    speaker: nihilister_m
    en: Hey, that's just how it is for us.
    ko: 야. 우리는 그냥 이런 거야.
    ja: なあ、俺たちはこういう存在なんだ。
  event_goddessfall2_05_s_191:
    speaker: nihilister_m
    en: This is the way we live, and the way we die. Got it?
    ko: 이렇게 살다가 죽는 거라고. 알겠어?
    ja: |-
      こうやって生きて、死ぬもんなんだ。
      分かってるか？
  event_goddessfall2_05_s_192:
    speaker: "<Narration>"
    en: Nihilister takes another step forward.
    ko: 니힐리스타가 앞으로 한 걸음 더 내디딘다.
    ja: ニヒリスターがさらに一歩踏み出した
  event_goddessfall2_05_s_193:
    speaker: nayuta_m
    en: Fire Dragon.
    ko: 화룡 소저.
    ja: 火竜、ニヒリスター…
  event_goddessfall2_05_s_194:
    speaker: nihilister_m
    en: What?
    ko: 왜.
    ja: 何だよ。
  event_goddessfall2_05_s_195:
    speaker: nayuta_m
    en: How long wilt thou continue living thus?
    ko: 언제까지 그따위로 살 거요.
    ja: いつまでそうして生きるつもりなのですか。
  event_goddessfall2_05_s_196:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_197:
    speaker: nihilister_m
    en: What of it?
    ko: 그러게.
    ja: そうだなぁ…
  event_goddessfall2_05_s_198:
    speaker: nayuta_m
    en: Let us desist.
    ko: 그만합시다.
    ja: いえ、やはりやめましょう。
  event_goddessfall2_05_s_199:
    speaker: nayuta_m
    en: Verily, 'tis somewhat mortifying to behold.
    ko: 솔직히 보고 있는 소인이 좀 창피하오.
    ja: 正直に言って、見ていられません。
  event_goddessfall2_05_s_200:
    speaker: nihilister_m
    en: "... Is that so?"
    ko: "…그렇냐."
    ja: "…そうかよ。"
  event_goddessfall2_05_s_201:
    speaker: nayuta_m
    en: Indeed.
    ko: 그렇소.
    ja: ええ。
  event_goddessfall2_05_s_202:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_203:
    speaker: nihilister_m
    en: What else can I do? I was born this way.
    ko: 이렇게 태어난 걸 어쩌겠어.
    ja: |-
      こんな風に生まれちまったんだから、
      仕方ねえだろ？
  event_goddessfall2_05_s_204:
    speaker: "<Narration>"
    en: Nayuta silently points at Indivilia
    ko: 나유타가 아무 말 없이 손가락을 뻗어 인디빌리아를 가리킨다.
    ja: ナユタが何も言わず、インディビリアを指した
  event_goddessfall2_05_s_205:
    speaker: "<Narration>"
    en: and nods her head.
    ko: 그리고 고개를 끄덕인다.
    ja: そして、頭を縦に振った
  event_goddessfall2_05_s_206:
    speaker: "<Narration>"
    en: Nihilister's gaze falters.
    ko: 니힐리스타의 눈동자가 흔들린다.
    ja: ニヒリスターの瞳が揺らいだ
  event_goddessfall2_05_s_207:
    speaker: indivilia
    en: What... are you doing...?!
    ko: 지금…! 뭘 하고 있는 건가요…!
    ja: 何を…！しているのです…！
  event_goddessfall2_05_s_208:
    speaker: "<Narration>"
    en: Indivilia staggers to her feet.
    ko: 인디빌리아가 비틀대며 일어난다.
    ja: インディビリアがよろめきつつ、立ち上がった
  event_goddessfall2_05_s_209:
    speaker: "<Narration>"
    en: Kilo and T.A.L.O.S. immediately assume combat stances.
    ko: 킬로와 탈로스는 바로 전투태세를 취했다.
    ja: キロとタロスが瞬時に身構えた
  event_goddessfall2_05_s_210:
    speaker: indivilia
    en: Who told you to... chat the day away...?
    ko: 누가 사이좋게…! 사담이나 나누라고 했나요…!
    ja: |-
      敵とムダ話をしろなどと…！
      言った覚えはありません…！
  event_goddessfall2_05_s_211:
    speaker: indivilia
    en: I said fight...! Fight! I command you to fight!
    ko: 싸워요…! 싸워요! 싸우라고요!
    ja: 戦え…戦いなさい！戦うのです！
  event_goddessfall2_05_s_212:
    speaker: indivilia
    en: If you can't manage that... at least be a meat shield...
    ko: 못 하겠으면…! 제가 도망갈 수 있게…!
    ja: できないなら…！せめて私を逃がすために…！
  event_goddessfall2_05_s_213:
    speaker: indivilia
    en: so I can escape...!
    ko: 고기 방패라도 하시던가요…!
    ja: 盾にぐらいなりなさい…！
  event_goddessfall2_05_s_214:
    speaker: nihilister_m
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_s_215:
    speaker: "<Narration>"
    en: Nihilister stares intently at Indivilia, who is trembling in front of her.
    ko: 니힐리스타는 자신의 앞에서 부들대며 서 있는 인디빌리아를 빤히 쳐다보았다.
    ja: |-
      ニヒリスターは目の前で震えながら立つ
      インディビリアをにらんだ
  event_goddessfall2_05_s_216:
    speaker: "<Monologue>"
    en: Wait...
    ko: 잠깐만.
    ja: 待てよ？
  event_goddessfall2_05_s_217:
    speaker: "<Monologue>"
    en: hold on a sec. You actually ate me before, didn't you?
    ko: 생각해 보니 이 녀석 나 잡아먹었었잖아?
    ja: 考えてみたら、俺はこいつに喰われたよな？
  event_goddessfall2_05_s_218:
    speaker: "<Monologue>"
    en: I went all out to save you, even handed over my weapons,
    ko: 내가 무장까지 줘가면서 실컷 살려놨더니.
    ja: 俺の武装までくれて、生き返らせてやったのに…
  event_goddessfall2_05_s_219:
    speaker: "<Monologue>"
    en: and this is how you repay me?! Betrayed by you, of all people!
    ko: 배신당했었지, 나.
    ja: 裏切られたんだよな、俺は
  event_goddessfall2_05_s_220:
    speaker: indivilia
    en: Nihilister...! Can you not hear me?!
    ko: 니힐리스타…! 내 말이 안 들리나요!?
    ja: ニヒリスター…！聞こえないのですか！？
  event_goddessfall2_05_s_221:
    speaker: "<Monologue>"
    en: The hell's your problem?
    ko: 그런데 이 자식은 대체 왜.
    ja: そのくせ、コイツは…
  event_goddessfall2_05_s_222:
    speaker: "<Monologue>"
    en: Getting mad at me
    ko: 나한테 화를 내고 있는 거지?
    ja: どうして俺に怒鳴ってんだ？
  event_goddessfall2_05_s_223:
    speaker: "<Monologue>"
    en: and ordering me around?
    ko: 왜 나한테 명령질이지?
    ja: なんで俺に命令できるんだ？
  event_goddessfall2_05_s_224:
    speaker: indivilia
    en: You useless corpse...! Do something!
    ko: 이 쓸모없는 산송장이…! 뭐라도 하라고요!
    ja: この役立たず…！いいから動くのです！
  event_goddessfall2_05_s_225:
    speaker: "<Monologue>"
    en: Argh...
    ko: 아, 하~아.
    ja: ああ…
  event_goddessfall2_05_s_226:
    speaker: "<Monologue>"
    en: This is pissing me off!
    ko: 열받네.
    ja: 気に入らねぇな
  event_goddessfall2_05_s_227:
    speaker: "<Narration>"
    en: Something snaps
    ko: 니힐리스타의 머릿속에서
    ja: その時、ニヒリスターの頭の中で
  event_goddessfall2_05_s_228:
    speaker: "<Narration>"
    en: inside Nihilister's head.
    ko: 뭔가가 끊어졌다.
    ja: 何かが弾けた
  event_goddessfall2_05_s_229:
    speaker: "<Narration>"
    en: "*Snap!*"
    ko: 콰직-!!
    ja: バキッ――！
  event_goddessfall2_05_s_230:
    speaker: indivilia
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall2_05_s_231:
    speaker: "<Narration>"
    en: Nihilister's sharp teeth
    ko: 니힐리스타의 날카로운 이빨이
    ja: ニヒリスターの鋭い牙は…
  event_goddessfall2_05_s_232:
    speaker: "<Narration>"
    en: sink into Indivilia's neck.
    ko: 인디빌리아의 목덜미를 파고들었다.
    ja: インディビリアの首筋に食い込んでいた
  event_goddessfall2_05_s_233:
    speaker: nihilister_m
    en: Hey,
    ko: 야.
    ja: なあ。
  event_goddessfall2_05_s_234:
    speaker: nihilister_m
    en: you'll make a fine snack.
    ko: 넌 그냥 내 밥이나 돼라.
    ja: お前、俺のメシになれよ。
event_goddessfall2_05_e:
  event_goddessfall2_05_e_1:
    speaker: nayuta
    en: Young Lady Kilo, unto thee do I entrust Young Lady Chime.
    ko: 킬로 소저. 차임 소저를 부탁하외다.
    ja: キロ、チャイムを頼みます。
  event_goddessfall2_05_e_2:
    speaker: nayuta
    en: She is sore wearied, and to leave her thus would be perilous.
    ko: 탈진 상태요. 놔두면 위험하오.
    ja: 衰弱しています。放置しては危険です。
  event_goddessfall2_05_e_3:
    speaker: nayuta
    en: "... And verily, naught of good shall come of beholding this sight."
    ko: "…그리고, 이 모습을 봐서 득 될 것이 없소."
    ja: |-
      …それに今、この有り様を見せるべきでは
      ないでしょう。
  event_goddessfall2_05_e_4:
    speaker: "<Narration>"
    en: Indivilia's low screams and groans
    ko: 인디빌리아의 낮은 비명과 신음소리.
    ja: インディビリアが低い悲鳴をあげ、うめいた
  event_goddessfall2_05_e_5:
    speaker: "<Narration>"
    en: blend with the hideous sounds of something snapping, tearing, and spilling
      that echo all around.
    ko: 뭔가가 부러지는 소리, 뜯겨나가는 소리, 쏟아지는 소리들이 끔찍하게 울려 퍼졌다.
    ja: |-
      何かが折れる音、引きちぎられる音…
      おぞましい音が辺りに響いている
  event_goddessfall2_05_e_6:
    speaker: "<Narration>"
    en: And among them, the sound that stands out most is
    ko: 그리고 그 소리들 중, 가장 잘 들리는 소리는.
    ja: 中でも最も強い存在感を放つ音は…
  event_goddessfall2_05_e_7:
    speaker: "<Narration>"
    en: Nihilister's ragged breathing
    ko: 니힐리스타의 헐떡이는 소리였다.
    ja: ニヒリスターの荒い息づかいだ
  event_goddessfall2_05_e_8:
    speaker: "<Narration>"
    en: and the frantic, ravenous noise of devouring.
    ko: |-
      무엇인가를 허겁지겁 먹는 소리.
      게걸스러운 소리.
    ja: |-
      それはまさに飢えた獣が
      獲物をむさぼり食らう音そのものだった
  event_goddessfall2_05_e_9:
    speaker: nayuta
    en: Go forth, now. Worry thou not for what shall follow.
    ko: 자, 어서. 뒷일은 걱정말고.
    ja: さあ、早く。あとのことはお任せください。
  event_goddessfall2_05_e_10:
    speaker: kilo_op_l
    en: B-but what about Nihilister...?
    ko: 하, 하지만 니힐리스타가….
    ja: で、でも、ニヒリスターが…
  event_goddessfall2_05_e_11:
    speaker: chime
    en: Th-there's no way we can win if she attacks...
    ko: 저, 저놈이 덤벼들면 이길 방법이 없….
    ja: ヤ、ヤツと戦いになったら、勝ち目は――
  event_goddessfall2_05_e_12:
    speaker: nayuta
    en: All shall be well. So place thy trust in me.
    ko: 괜찮소. 믿어주시오.
    ja: 大丈夫です。信じてください。
  event_goddessfall2_05_e_13:
    speaker: nayuta
    en: T.A.L.O.S., I entreat thee to perform thy calculation.
    ko: 탈로스 소저. 부탁하외다.
    ja: タロス、頼みます。
  event_goddessfall2_05_e_14:
    speaker: talos
    en: Calculating...
    ko: 연산 중.
    ja: 演算中…
  event_goddessfall2_05_e_15:
    speaker: talos
    en: Acknowledged. Initiating retreat.
    ko: 라져. 퇴각합니다.
    ja: 了解。退却します。
  event_goddessfall2_05_e_16:
    speaker: "<Narration>"
    en: T.A.L.O.S. retreats, carrying Chime in both hands.
    ko: 탈로스가 차임을 양손에 든 채 퇴각한다.
    ja: タロスが両手でチャイムを抱え、退却した
  event_goddessfall2_05_e_17:
    speaker: "<Narration>"
    en: Meanwhile, Nayuta remains behind, silently observing Nihilister's grotesque
      feast.
    ko: 나유타는 조용히 니힐리스타의 [식사]를 지켜봤다.
    ja: |-
      ナユタは静かにニヒリスターの
      「食事」を見届けた
  event_goddessfall2_05_e_18:
    speaker: "<Narration>"
    en: A final, resounding gulp echoes,
    ko: 그리고 뭔가를 크게 삼키는 소리를 끝으로.
    ja: やがて、大きな何かを飲み込む音を最後に…
  event_goddessfall2_05_e_19:
    speaker: "<Narration>"
    en: and then everything goes silent.
    ko: 모든 소리가 멎었다.
    ja: すべての音が止まった
  event_goddessfall2_05_e_20:
    speaker: nayuta
    en: "... Was the repast to thy liking?"
    ko: "…식사는, 마음에 드셨소?"
    ja: "…どうでしたか、食事は？"
  event_goddessfall2_05_e_21:
    speaker: nihilister_m
    en: Damn, that's disgusting.
    ko: 더럽게 맛없었어.
    ja: クソみてぇにまずかった。
  event_goddessfall2_05_e_22:
    speaker: nayuta
    en: For that, thou seemest in good health.
    ko: 그런 것 치곤, 혈색이 좋아 보이오.
    ja: それにしては、血色がいいようで。
  event_goddessfall2_05_e_23:
    speaker: "<Narration>"
    en: Nihilister removes her cloak and hurls it aside.
    ko: 니힐리스타가 망토를 벗은 후 집어던진다.
    ja: ニヒリスターがマントを脱ぎ捨てた
  event_goddessfall2_05_e_24:
    speaker: "<Narration>"
    en: "*Craaaack!*"
    ko: 우드드드득--!!
    ja: ミシミシミシッ！！
  event_goddessfall2_05_e_25:
    speaker: "<Narration>"
    en: Weapons sprout from Nihilister's back.
    ko: 니힐리스타의 등 뒤에서 무장이 솟아오른다.
    ja: ニヒリスターの背後から武装が生えた
  event_goddessfall2_05_e_26:
    speaker: nihilister
    en: Whew... That's more like it.
    ko: 후우… 이제야 무게 중심이 좀 맞는 느낌이네.
    ja: はぁ…やっとバランスが取れたぜ。
  event_goddessfall2_05_e_27:
    speaker: nayuta
    en: Verily, thou hast undone the Queen's dominion.
    ko: 지배력을 용케 풀었소.
    ja: 断ち切れたのですか。
  event_goddessfall2_05_e_28:
    speaker: nihilister
    en: Damn it, she's really getting on my nerves.
    ko: 열받게 하잖아 이게.
    ja: だってムカつくだろ、コイツ。
  event_goddessfall2_05_e_29:
    speaker: "<Narration>"
    en: Nihilister glares at the ground in annoyance.
    ko: 니힐리스타는 짜증을 내며 바닥을 바라보았다.
    ja: |-
      ニヒリスターは不満をむき出しにして、
      地面をにらみつけた
  event_goddessfall2_05_e_30:
    speaker: nihilister
    en: And now she's gone.
    ko: 아, 이제 없지.
    ja: あ、もうなくなったか。
  event_goddessfall2_05_e_31:
    speaker: nayuta
    en: To rend asunder the fate thou wert born unto by thine own might alone... verily,
      most wondrous.
    ko: 타고난 운명을 본인의 힘으로 부수다니, 참으로 대단하외다.
    ja: |-
      生まれ持った運命を、
      自らの力で打ち破るとは…実に見事です。
  event_goddessfall2_05_e_32:
    speaker: nayuta
    en: "... Pray, how didst thou accomplish such a feat?"
    ko: "…그런데, 어떻게 한 것이오?"
    ja: "…しかし、どうやって…？"
  event_goddessfall2_05_e_33:
    speaker: nihilister
    en: No idea.
    ko: 몰라.
    ja: さあな。
  event_goddessfall2_05_e_34:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_e_35:
    speaker: nayuta
    en: "... The sole elucidation that cometh to mine mind is that... a sudden surge
      of fervent emotion hath loosed the reins of control."
    ko: "…격한 감정이 지배력을 풀었다… 라고 생각할 수밖에 없는데."
    ja: |-
      …激しい感情に任せて打ち勝った…
      と、考えるしかありませんが…
  event_goddessfall2_05_e_36:
    speaker: nayuta
    en: Methinks that control is more feeble than I had erewhile surmised.
    ko: 생각보다 허술한 모양이외다. 그 지배력이라는 것은.
    ja: |-
      思ったよりお粗末なものなのでしょうか。
      クイーンの支配力というものは。
  event_goddessfall2_05_e_37:
    speaker: nihilister
    en: Weak? No.
    ko: 그럴 리가.
    ja: んなわけねえだろ。
  event_goddessfall2_05_e_38:
    speaker: nihilister
    en: I'm the one who's strong.
    ko: 내가 강한 거야.
    ja: 俺が強ぇだけだ。
  event_goddessfall2_05_e_39:
    speaker: nayuta
    en: So it is, that I do grant thee.
    ko: 뭐, 그건 인정하오.
    ja: まあ、そこは認めざるを得ません。
  event_goddessfall2_05_e_40:
    speaker: nayuta
    en: Pray, what wilt thou do henceforth?
    ko: 해서, 앞으로의 계획은 무엇이오?
    ja: それで、どうするのです？
  event_goddessfall2_05_e_41:
    speaker: nihilister
    en: I'm going to kill the Queen,
    ko: 뻔하잖아.
    ja: 分かりきったことだろ。
  event_goddessfall2_05_e_42:
    speaker: nihilister
    en: duh.
    ko: 퀸을 죽인다.
    ja: クイーンをブッ殺す。
  event_goddessfall2_05_e_43:
    speaker: nayuta
    en: Oh, 'tis a relief. I did fear that thou mightst have harbored a change of
      heart upon regaining thy strength.
    ko: |-
      오, 그거 다행이외다.
      소인은 또 힘을 찾은 화룡 소저가 다른 마음을 먹었을까 봐 불안했소.
    ja: |-
      そうですか、安心しました。
      力を取り戻せば心変わりするのではないかと
      思っていましたので。
  event_goddessfall2_05_e_44:
    speaker: nihilister
    en: So those guys are tangling with the Queen, huh?
    ko: 지금 그 하얀 놈들이 퀸을 상대하고 있지?
    ja: 今ごろあいつら、クイーンとやり合ってんだろ？
  event_goddessfall2_05_e_45:
    speaker: nihilister
    en: I'm joining, but
    ko: 합류할 테니, 네가 잘 말해.
    ja: |-
      手を貸してやるから、
      うまいこと説明してくれよ。
  event_goddessfall2_05_e_46:
    speaker: nihilister
    en: make sure they know not to shoot me.
    ko: 나를 쏘면 안 될 것 아냐.
    ja: 俺には攻撃すんなってさ。
  event_goddessfall2_05_e_47:
    speaker: nayuta
    en: "... As for that matter, this humble one has a word to declare."
    ko: "…관련하여 할 말이 있소."
    ja: |-
      …それについては、
      言っておかねばならないことがあります。
  event_goddessfall2_05_e_48:
    speaker: nayuta
    en: All mine own replicas have partaken in the assault upon the Queen, yet...
    ko: 소인의 분신 전부가 퀸 공략에 참여했으나.
    ja: 私の分身もこの戦いに加わっていたのですが…
  event_goddessfall2_05_e_49:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_e_50:
    speaker: nihilister
    en: What is it? Spit it out.
    ko: "…뭔데. 말해."
    ja: "…何だ。言えよ。"
  event_goddessfall2_05_e_51:
    speaker: nayuta
    en: Verily, the matter at hand doth bode ill.
    ko: 상황이 좋지 않소.
    ja: 旗色はよくありません。
  event_goddessfall2_05_e_52:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_e_53:
    speaker: hongryeon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_e_54:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_05_e_55:
    speaker: snowwhite
    en: Where are Nayuta's clones?
    ko: 나유타의 분신들은?
    ja: ナユタの分身たちは？
  event_goddessfall2_05_e_56:
    speaker: rapunzel
    en: "... They're all gone."
    ko: "…모두 떠나셨어요."
    ja: "…もうここにはいません。"
  event_goddessfall2_05_e_57:
    speaker: snowwhite
    en: "... I see."
    ko: "…그런가."
    ja: "…そうか。"
  event_goddessfall2_05_e_58:
    speaker: snowwhite
    en: "... The situation isn't good."
    ko: "…상황이 좋지 않다."
    ja: "…状況が悪いな。"
  event_goddessfall2_05_e_59:
    speaker: hongryeon
    en: Aye, ne'er have I witnessed such...
    ko: |-
      그렇다네.
      이렇게나….
    ja: |-
      そのようだ。
      これほどまでの…
  event_goddessfall2_05_e_60:
    speaker: hongryeon
    en: pure might of the flesh.
    ko: 순수하게 신체의 힘이 강한 건 처음일세.
    ja: |-
      単純な強さというものは
      初めて見せられたねぇ…
  event_goddessfall2_05_e_61:
    speaker: "<Narration>"
    en: The Pioneer squad joins the assault on the Queen, fighting alongside Nayuta's
      clones.
    ko: 파이오니아 스쿼드는 나유타의 분신들과 함께 퀸 공략에 참여했다.
    ja: |-
      パイオニア部隊は、ナユタの分身たちと共に
      クイーンとの戦いに挑んだ
  event_goddessfall2_05_e_62:
    speaker: "<Narration>"
    en: The Queen's attacks are swift and brutal, but not impossible to dodge or block.
    ko: 퀸의 공격은 강했고 빨랐으나, 피할 수 있었고 막아낼 수 있었다
    ja: |-
      クイーンの攻撃は確かに強力で、しかも早い。
      だが回避することはできる
  event_goddessfall2_05_e_63:
    speaker: "<Narration>"
    en: But the real problem lies in her seemingly limitless power...
    ko: 문제는 그 끝을 알 수 없는 출력과.
    ja: 真の障害は、底の見えない出力…
  event_goddessfall2_05_e_64:
    speaker: "<Narration>"
    en: and her ability to regenerate.
    ko: 재생 능력.
    ja: そして、再生能力だった
  event_goddessfall2_05_e_65:
    speaker: "<Narration>"
    en: Hundreds of clean hits land on her, inflicting real damage.
    ko: 파이오니아 스쿼드의 공격은 수백 번, 퀸에게 닿았고 유효한 피해를 입혔으나.
    ja: |-
      彼女たちの攻撃は、
      すでに何百回とクイーンに届いていた。
      打撃は与えられているはずだが…
  event_goddessfall2_05_e_66:
    speaker: "<Narration>"
    en: But as if mocking their efforts, she restores every wound without pause.
    ko: 퀸은 아무렇지도 않다는 듯 모든 파손 부위를 재생했다.
    ja: クイーンは平然と再生してくるのだ
  event_goddessfall2_05_e_67:
    speaker: "<Narration>"
    en: Snow White's Seven Dwarves I fires at maximum output,
    ko: 스노우 화이트의 세븐스 드워프 I의 최대 출력도,
    ja: |-
      最大出力を出した
      スノーホワイトのセブンスドワーフIも…
  event_goddessfall2_05_e_68:
    speaker: "<Narration>"
    en: Scarlet delivers a full-force sword strikes,
    ko: 홍련의 전력을 다한 검격도,
    ja: 全力を振り絞った紅蓮の会心の一閃も…
  event_goddessfall2_05_e_69:
    speaker: "<Narration>"
    en: Rapunzel unleashes her strongest beams,
    ko: 라푼젤의 최대 출력을 담은 빔도,
    ja: |-
      あらん限りの力をこめた
      ラプンツェルのビームも…
  event_goddessfall2_05_e_70:
    speaker: "<Narration>"
    en: and Nayuta's clones rain down endless attacks.
    ko: 나유타의 분신들이 쏟아낸 공격들 모두가
    ja: ナユタの分身たちが叩き込んだあらゆる攻撃も…
  event_goddessfall2_05_e_71:
    speaker: "<Narration>"
    en: All of them hit. All of them hurt.
    ko: 퀸에게 명중했고 큰 피해를 입혔으나
    ja: |-
      すべてクイーンに命中し、
      その瞬間は大きなダメージを与えていたが…
  event_goddessfall2_05_e_72:
    speaker: "<Narration>"
    en: Yet moments later, the Queen is whole again,
    ko: 잠시 후 퀸은 모든 피해를 재생했다.
    ja: |-
      しばらくすると、
      何ごとも無かったかのように回復されている
  event_goddessfall2_05_e_73:
    speaker: "<Narration>"
    en: and striking back just as fiercely.
    ko: 그리고 조금도 줄어들지 않은 출력으로 공격을 퍼부었다.
    ja: |-
      一方でクイーンの出力は
      まったく落ちた様子を見せず、
      激しい攻撃が変わらず続いた
  event_goddessfall2_05_e_74:
    speaker: "<Narration>"
    en: Nayuta's clones fall one by one, until none remain.
    ko: 나유타의 분신들은 전멸.
    ja: ナユタの分身たちはすでに全滅
  event_goddessfall2_05_e_75:
    speaker: "<Narration>"
    en: The Pioneer squad begins to wither under the pressure, slowly but surely being
      worn down.
    ko: 파이오니아 스쿼드는 서서히 소모되고 있었다.
    ja: パイオニア部隊も全員が徐々に消耗していた
  event_goddessfall2_05_e_76:
    speaker: snowwhite
    en: "... She had this much power, and yet she just watched?"
    ko: "…이 정도의 힘을 가지고 있었으면서 지켜보기만 했단 건가."
    ja: |-
      …これほどの力を持っていながら、
      今まで様子を見ていただけだというのか…
  event_goddessfall2_05_e_77:
    speaker: hongryeon
    en: "'Tis a queen most lacking in confidence, indeed."
    ko: 어지간히도 자신감이 없는 여왕이로군.
    ja: よほど自分に自信がないようだねぇ。
  event_goddessfall2_05_e_78:
    speaker: rapunzel
    en: "... Everyone..."
    ko: "…여러분."
    ja: "…2人とも…"
  event_goddessfall2_05_e_79:
    speaker: rapunzel
    en: At this rate, we're just being whittled down. In the end, we'll be the ones
      to fall.
    ko: |-
      이대로라면 저희는 점점 소모되기만 할 뿐,
      끝내 쓰러지는 건 저희가 될 거예요.
    ja: |-
      このまま消耗戦を続けていては、
      私たちに勝ち目はありません。
  event_goddessfall2_05_e_80:
    speaker: hongryeon
    en: Nay, we shall prevail.
    ko: 아니. 우리는 반드시 이길걸세.
    ja: いいや、必ず勝つ。
  event_goddessfall2_05_e_81:
    speaker: snowwhite
    en: It may sound improbable, but that's the truth.
    ko: 현실감이 떨어지는 얘기기는 하지만, 그렇다.
    ja: 現実味のない話だが、そうだ。
  event_goddessfall2_05_e_82:
    speaker: hongryeon
    en: Answer with naught but yea or nay, prithee.
    ko: 긍정이나 부정 하나만 해주게나.
    ja: 乗るか乗らないか、どちらかにしておくれ。
  event_goddessfall2_05_e_83:
    speaker: rapunzel
    en: "... Let's use that."
    ko: "…그걸 쓰죠."
    ja: "…あれを使いましょう。"
  event_goddessfall2_05_e_84:
    speaker: snowwhite
    en: Right now?
    ko: 지금?
    ja: ここでか？
  event_goddessfall2_05_e_85:
    speaker: hongryeon
    en: Hark, now that all the auto-interceptors art rent asunder, 'tis surely the
      most opportune hour, eh?
    ko: 하긴, 자동 요격 무장이 모두 떨어져 나간 지금이 적기인가.
    ja: |-
      確かに、迎撃兵器を落とした今が
      使い時かもしれないねえ。
  event_goddessfall2_05_e_86:
    speaker: rapunzel
    en: Buy me some time. I'll take the lead.
    ko: 시간을 벌어줘요. 제가 가이드 합니다.
    ja: 時間を稼いでください。誘導は私がします。
  event_goddessfall2_05_e_87:
    speaker: hongryeon
    en: A daring request... thou dost make!
    ko: 힘든 요구를 하는… 군!
    ja: なんとも難しい…頼み事だ！
  event_goddessfall2_05_e_88:
    speaker: "<Narration>"
    en: Scarlet dashes forward,
    ko: 홍련이 돌진한다.
    ja: 紅蓮が猛然とクイーンに向かい距離を詰めた
  event_goddessfall2_05_e_89:
    speaker: "<Narration>"
    en: dodging the countless crimson beams the Queen unleashes. She swings her blade
      at the hand reaching for her.
    ko: |-
      퀸에게서 쏟아지는 수많은 붉은 빛을 피하며,
      자신을 향해 뻗어오는 손을 향해 검을 휘두른다.
    ja: |-
      迎え討つ大量の赤い光をかわし、
      伸ばされた手に剣を走らせる
  event_goddessfall2_05_e_90:
    speaker: "<Narration>"
    en: Three of the Queen's fingers are severed, only to regenerate immediately as
      if nothing had happened.
    ko: |-
      퀸의 손가락 3개가 잘려 나가지만,
      그런 일은 없었다는 듯 곧바로 재생된다.
    ja: |-
      3本の指を奪い取ったものの、
      傷は瞬く間に再生された
  event_goddessfall2_05_e_91:
    speaker: "<Narration>"
    en: Scarlet lets out a short groan, then continues the exchange of blows.
    ko: |-
      홍련은 짧은 신음을 흘린 후,
      계속해서 공방을 이어갔다.
    ja: 紅蓮は短く息を吐き、さらに攻め立てた
  event_goddessfall2_05_e_92:
    speaker: "<Narration>"
    en: At the same time, Snow White pours her firepower onto what she believes is
      the Queen's weak spot.
    ko: 스노우 화이트는 퀸의 약점이라 생각되는 부분에 화력을 퍼부었다.
    ja: |-
      スノーホワイトも
      クイーンの弱点とおぼしき部分に
      火力を叩き込み続けた
  event_goddessfall2_05_e_93:
    speaker: "<Narration>"
    en: Several strikes land, enough to make her think she has the upper hand.
    ko: "[이건 잡았다]라고 확신이 들만한 공격이 수 번 명중했다."
    ja: |-
      並の相手なら致命打だと
      確信するような手ごたえが何度もあった
  event_goddessfall2_05_e_94:
    speaker: "<Narration>"
    en: But once again, the Queen restores all damage in an instant.
    ko: 하지만 퀸은 모든 피해를 단숨에 수복했다.
    ja: しかし、それさえもすぐさま回復されてしまう
  event_goddessfall2_05_e_95:
    speaker: "<Narration>"
    en: Using the smallest movements possible, Snow White intercepts every incoming
      missile and avoids the streaking crimson beams.
    ko: 스노우 화이트는 날아오는 미사일을 요격하고, 뻗어 나오는 붉은 빛을 최소한의 동작으로 피한다.
    ja: |-
      スノーホワイトは飛来するミサイルを迎撃し、
      降り注ぐ赤い光を最低限の動きで回避した
  event_goddessfall2_05_e_96:
    speaker: "<Narration>"
    en: The tips of her toes singed slightly, and she senses her focus slipping.
    ko: |-
      발끝이 살짝 탄다.
      집중력이 흐트러지고 있다는 것을 느낀다.
    ja: |-
      しかし、足先についた軽い焦げが
      集中力の乱れを物語っている
  event_goddessfall2_05_e_97:
    speaker: "<Narration>"
    en: Rapunzel centers her mind.
    ko: 라푼젤은 정신을 집중한다.
    ja: ラプンツェルは精神を集中させた
  event_goddessfall2_05_e_98:
    speaker: "<Narration>"
    en: For a long time, the Pioneer squad scoured the surface, leaving no stone unturned.
    ko: 오랜 시간 파이오니아 스쿼드는 지상을 말 그대로 샅샅이 뒤졌다.
    ja: |-
      長い時間をかけ、
      パイオニアは地上を隅々まで探索している
  event_goddessfall2_05_e_99:
    speaker: "<Narration>"
    en: Convinced the Queen is not on the surface, they turned their attention to
      space.
    ko: 그 결과, 지상에는 퀸이 없다는 것을 확신했고 시선을 우주로 돌렸다.
    ja: |-
      そしてクイーンが
      地上に存在しないことを確信し、
      視線を宇宙へ向けていた
  event_goddessfall2_05_e_100:
    speaker: "<Narration>"
    en: While Nayuta's countless clones are stationed across the surface to track
      the Queen's orbit,
    ko: 나유타의 수많은 분신이 지상 각지에 위치하며 퀸의 궤도를 쫓는 사이
    ja: |-
      ナユタが大量の分身を使い
      地上の各地からクイーンの行方を
      追っている間…
  event_goddessfall2_05_e_101:
    speaker: "<Narration>"
    en: Snow White, Scarlet, and Rapunzel roam from place to place, gathering intelligence
      on the Queen
    ko: 스노우 화이트, 홍련, 라푼젤은 지상 곳곳을 돌아다니며 퀸에 대한 정보를 수집함과 동시에
    ja: |-
      スノーホワイトたちは
      地上を巡ってクイーンに関する
      情報収集を進め…
  event_goddessfall2_05_e_102:
    speaker: "<Narration>"
    en: and simultaneously deploying remotely operated weapons across the land.
    ko: 각지에 원격으로 동작하는 병기들을 배치했다.
    ja: 各地に遠隔操作できる兵器を隠していたのだ
  event_goddessfall2_05_e_103:
    speaker: "<Narration>"
    en: These weapons are meant for the inevitable day of the final battle—
    ko: 언젠가 올 결전의 순간에 대비하기 위한 병기들이었다.
    ja: いずれ来たる決戦のための兵器…
  event_goddessfall2_05_e_104:
    speaker: "<Narration>"
    en: 6,000 missiles in total.
    ko: 미사일 6000발.
    ja: その数、ミサイル6000発
  event_goddessfall2_05_e_105:
    speaker: "<Narration>"
    en: 'The cannons of every emplacement turn in unison toward a single target:'
    ko: 지상 곳곳에 위치한 병기들의 포문이 일제히 한 곳을 향한다.
    ja: 地上の至る所で一斉に発射台が動き出した
  event_goddessfall2_05_e_106:
    speaker: "<Narration>"
    en: the Queen,
    ko: 라푼젤이 가리키고 있는 곳
    ja: 放たれたミサイルはラプンツェルが指し示す地点
  event_goddessfall2_05_e_107:
    speaker: "<Narration>"
    en: where Rapunzel points.
    ko: 퀸에게로.
    ja: すなわち、クイーンに向かった
  event_goddessfall2_05_e_108:
    speaker: rapunzel
    en: Incoming!
    ko: 곧 옵니다!
    ja: 着弾します！
  event_goddessfall2_05_e_109:
    speaker: rapunzel
    en: Everyone, this way!
    ko: 모두! 이쪽으로!
    ja: 2人とも！こちらへ！
  event_goddessfall2_05_e_110:
    speaker: "<Narration>"
    en: Rapunzel deploys her shield. Snow White and Scarlet hurry inside.
    ko: |-
      라푼젤이 실드를 전개한다.
      스노우 화이트와 홍련이 다급히 그 안으로 이동한다.
    ja: |-
      ラプンツェルが展開するシールドの中へ、
      スノーホワイトと紅蓮が素早く移動した
  event_goddessfall2_05_e_111:
    speaker: "<Narration>"
    en: The Queen stares, clearly puzzled by their sudden move.
    ko: |-
      퀸은 지금 이 행동이 이해가 가지 않는다는 듯,
      그녀들을 빤히 쳐다봤다.
    ja: |-
      クイーンは状況を理解できず、
      彼女たちの様子をうかがった
  event_goddessfall2_05_e_112:
    speaker: "<Narration>"
    en: 'Moments later, she sees it:'
    ko: 그리고 잠시 후, 퀸은 보았다.
    ja: そしてわずかな時の後、クイーンは気づいた
  event_goddessfall2_05_e_113:
    speaker: "<Narration>"
    en: a second horizon line hovering above the real one.
    ko: 지평선 위에 그어진 또 하나의 지평선을.
    ja: 地平線が二重に見える
  event_goddessfall2_05_e_114:
    speaker: "<Narration>"
    en: The sky is, quite literally, raining missiles.
    ko: 그것은 말 그대로 미사일의 비였다.
    ja: 文字通り、ミサイルの雨が迫っていた
  event_goddessfall2_05_e_115:
    speaker: "<Narration>"
    en: Crimson light radiates from the Queen's body,
    ko: 퀸은 온몸에서 붉은색 빛을 내뿜었다.
    ja: クイーンは全身から赤い光を放出し、迎え撃った
  event_goddessfall2_05_e_116:
    speaker: "<Narration>"
    en: but even so, she cannot intercept the overwhelming fusillade of 6,000 missiles.
    ko: 하지만 6000발이라는 압도적인 수의 미사일을 전부 요격하기엔 역부족이었다.
    ja: |-
      しかし、6000発ものミサイルを
      全て撃ち落とすには及ばない
  event_goddessfall2_05_e_117:
    speaker: "<Narration>"
    en: Explosions and flashes erupt without end.
    ko: 폭발과 섬광이 끊이지 않는다.
    ja: 爆発と閃光が絶え間なく続いた
  event_goddessfall2_05_e_118:
    speaker: "<Narration>"
    en: Flames roar as if to burn the sky itself.
    ko: 하늘을 태워버릴 것 같은 불꽃이 타오른다.
    ja: 空を焼き尽くしそうなほどの炎が上がる
  event_goddessfall2_05_e_119:
    speaker: "<Narration>"
    en: A thick, choking cloud from the massive blast engulfs the area.
    ko: 자욱한 폭연이 일대를 가득 메운다.
    ja: あたり一面が煙に巻かれた
  event_goddessfall2_05_e_120:
    speaker: "<Narration>"
    en: Only the Queen's skeletal frame remains.
    ko: 퀸은 앙상한 뼈대만이 남았다.
    ja: クイーンは無残に痩せ細った骨格と化した
  event_goddessfall2_05_e_121:
    speaker: "<Narration>"
    en: But yet again, she begins to regenerate.
    ko: 하지만, 또다시 재생한다.
    ja: しかし、それさえも時を置かず再生された
  event_goddessfall2_05_e_122:
    speaker: rapunzel
    en: "... Even that wasn't enough...?!"
    ko: "…이것마저…!"
    ja: "…これでも…！"
  event_goddessfall2_05_e_123:
    speaker: hongryeon
    en: "... By my troth, doth her might know no bounds?"
    ko: "…이것 참. 정말 출력이 무한이라는 말인가?"
    ja: "…いやはや…本当に無尽蔵ということかい？"
  event_goddessfall2_05_e_124:
    speaker: snowwhite
    en: Nothing lasts forever! Keep going!
    ko: 세상에 무한한 것은 없다! 계속 간다!
    ja: 無限のものなどない！続けるぞ！
  event_goddessfall2_05_e_125:
    speaker: hongryeon
    en: Good! Keep slicing, slicing, and slicing yet again, and anon she shall fall!
    ko: 좋네! 베고 베고 또 베다 보면, 언젠가는 쓰러질걸세!
    ja: |-
      応！斬って斬って、斬り続ければ
      いつかは斬りきれるであろう！
  event_goddessfall2_05_e_126:
    speaker: rapunzel
    en: Yes! Absolutely! We'll take her down right here!
    ko: 예! 반드시! 여기서 쓰러뜨립니다!
    ja: はい！必ず！ここで倒します――
  event_goddessfall2_05_e_127:
    speaker: "<Narration>"
    en: "*Roooaaaaar!*"
    ko: 쿠우우우우우---!!
    ja: ゴゴゴゴゴゴ――！！
  event_goddessfall2_05_e_128:
    speaker: "<Narration>"
    en: A thunderous roar echoes from the distance.
    ko: 먼 곳에서 굉음이 들려온다.
    ja: その時突然、彼方から轟音が聞こえてきた
  event_goddessfall2_05_e_129:
    speaker: "<Narration>"
    en: Heads snap toward the sound.
    ko: 모두의 고개가 돌아간다.
    ja: 誰もが音のする方へ視線を向けた
  event_goddessfall2_05_e_130:
    speaker: "<Narration>"
    en: The thick curtain of smoke shreds apart in an instant.
    ko: 자욱했던 폭연이 단숨에 흩어진다.
    ja: 爆煙を吹き散らし、近づきつつあったのは…
  event_goddessfall2_05_e_131:
    speaker: "<Narration>"
    en: And then, a red, two-headed dragon charges forward, skimming the ground like
      a missile.
    ko: |-
      머리 두 개 달린 붉은 용이,
      지면을 타듯이 돌진해 오고 있었다.
    ja: |-
      地を這うような低空を滑り飛ぶ
      双頭の赤い竜だった
  event_goddessfall2_05_e_132:
    speaker: snowwhite
    en: Nihilister...!
    ko: 니힐리스타…!
    ja: ニヒリスター…！
event_goddessfall2_06_s:
  event_goddessfall2_06_s_1:
    speaker: nayuta
    en: The Queen's regenerative powers surpass all that we hath ever imagined.
    ko: 퀸의 재생 능력은 우리의 상상을 훨씬 웃도오.
    ja: |-
      クイーンの再生能力は、
      私たちの想像をはるかに上回るものです。
  event_goddessfall2_06_s_2:
    speaker: nayuta
    en: Though her assaults reach us not, so long as ours avail her not,
    ko: |-
      퀸의 공격이 우리에게 닿지 않아도,
      우리의 공격이 통하지 않는다면.
    ja: |-
      いくら攻撃をかわし続けても、
      こちらが決め手を持たないのであれば…
  event_goddessfall2_06_s_3:
    speaker: nayuta
    en: we shall be drawn into a war of attrition, and our defeat shall be assured.
    ko: 소모전으로 흘러갈 것이고, 그렇다면 우리의 패배는 확정이외다.
    ja: |-
      削り合いへともつれ込み、
      敗北は必然となります。
  event_goddessfall2_06_s_4:
    speaker: nayuta
    en: She is a being who hath wandered the expanse of the cosmos these hundred years
      past. Who can fathom the measure of power which she hath amassed therein?
    ko: |-
      100여 년을 우주에서 떠돈 존재요.
      얼마만큼 힘을 비축해 놓았을지 미지수요.
    ja: |-
      しかも100年余り宇宙を
      漂っていたのですから、
      どれほどの力を蓄えているかは未知数。
  event_goddessfall2_06_s_5:
    speaker: nihilister
    en: So, what are you trying to say?
    ko: 그래서, 하고 싶은 말이 뭔데?
    ja: で、何が言いたいんだ？
  event_goddessfall2_06_s_6:
    speaker: nayuta
    en: 'We must needs seal her regenerative powers. There is but a single means to
      do so:'
    ko: |-
      재생 능력을 봉해야 하오.
      그 방법은 하나뿐이외다.
    ja: |-
      再生能力を封じる必要があります。
      その方法はただ一つ…
  event_goddessfall2_06_s_7:
    speaker: nayuta
    en: to fashion a chalice of poison.
    ko: 독잔을 만드는 것.
    ja: 毒を盛ること。
  event_goddessfall2_06_s_8:
    speaker: nayuta
    en: Yet a mundane chalice shall perish ere it e'er touch the Queen.
    ko: 허나 평범한 독잔은 퀸에게 닿기도 전에 소멸할 것이외다.
    ja: |-
      しかし、並大抵の器では、
      クイーンに届くことさえなく
      砕かれるでしょう。
  event_goddessfall2_06_s_9:
    speaker: nihilister
    en: So what are we supposed to do...?
    ko: 그래서 뭘 어떻게….
    ja: なら、どうしろって…
  event_goddessfall2_06_s_10:
    speaker: "<Narration>"
    en: Nayuta stares straight at Nihilister.
    ko: 나유타는 니힐리스타를 빤히 쳐다봤다.
    ja: ナユタがニヒリスターをまっすぐに見すえた
  event_goddessfall2_06_s_11:
    speaker: "<Narration>"
    en: Meeting her gaze, Nihilister lets out a loud, mocking laugh.
    ko: 나유타의 눈을 바라보던 니힐리스타는, 너털웃음을 터트렸다.
    ja: |-
      ナユタの目を見たニヒリスターが、
      高笑いをあげた
  event_goddessfall2_06_s_12:
    speaker: nihilister
    en: Hah, you crazy monk!
    ko: 하하! 이 개같은 땡중 자식아.
    ja: ハハ…！クソ仙人サンよ。
  event_goddessfall2_06_s_13:
    speaker: nihilister
    en: You really think trusting me is a good idea? Huh?
    ko: 너 나 믿을 수 있겠냐? 엉?
    ja: 俺のことを信じられるってんのか？ああん？
  event_goddessfall2_06_s_14:
    speaker: nayuta
    en: May I place my trust in thee, Fire Dragon?
    ko: 믿어도 되겠소? 화룡 소저.
    ja: 信じて構いませんか？火竜。
  event_goddessfall2_06_s_15:
    speaker: nihilister
    en: You should only trust those worth trusting.
    ko: 믿을 놈을 믿어야지.
    ja: もっと信用できるヤツにしとけよ。
  event_goddessfall2_06_s_16:
    speaker: nayuta
    en: So it is.
    ko: 그건 그렇소이다.
    ja: それはその通りです。
  event_goddessfall2_06_s_17:
    speaker: "<Narration>"
    en: Nayuta takes out a red-tipped bullet from her bosom and tosses it to Nihilister.
    ko: |-
      나유타가 품에서 탄두가 붉은 탄환을 꺼내,
      니힐리스타에게 던진다.
    ja: |-
      ナユタが懐から弾頭の赤い弾丸を取り出し、
      ニヒリスターに投げた
  event_goddessfall2_06_s_18:
    speaker: nayuta
    en: Use it as thou wilt.
    ko: 화룡 소저의 뜻대로 하시오.
    ja: あなたのお好きなように。
  event_goddessfall2_06_s_19:
    speaker: nihilister
    en: Haha, you crazy monk!
    ko: 하하! 빌어먹을 땡중 놈아.
    ja: ヘッ！テメーはマジでクソッタレだ。
  event_goddessfall2_06_s_20:
    speaker: nihilister
    en: Must be thrilled that everything's gone your way, huh?
    ko: 다 네 뜻대로 되어서 좋겠다. 어?
    ja: 何もかも思い通りに動いてうれしいか？ええ？
  event_goddessfall2_06_s_21:
    speaker: nihilister
    en: 'But you better remember this:'
    ko: 그런데 너 이거 하나는 확실히 알아둬라.
    ja: だが、これだけはよく覚えとけよ。
  event_goddessfall2_06_s_22:
    speaker: nihilister
    en: I'm the one who chose this.
    ko: 이걸 선택한 건, 나라는 걸.
    ja: こうすることを選んだのは、俺だ。
  event_goddessfall2_06_s_23:
    speaker: nayuta
    en: Verily, I shall ne'er forget it.
    ko: 절대 잊지 않겠소.
    ja: 絶対に忘れはしません。
  event_goddessfall2_06_s_24:
    speaker: "<Narration>"
    en: The red dragon charges.
    ko: 붉은 용이 돌진한다.
    ja: 赤き竜が突進する
  event_goddessfall2_06_s_25:
    speaker: "<Narration>"
    en: The Queen looms closer.
    ko: 퀸의 모습이 가까워진다.
    ja: その身がクイーンに迫った
  event_goddessfall2_06_s_26:
    speaker: "<Narration>"
    en: Nihilister bites down on the red-tipped bullet wedged between her teeth
    ko: 니힐리스타는 어금니에 끼워놓은 탄두가 붉은 탄환을
    ja: ニヒリスターは奥歯で押さえていた弾丸を…
  event_goddessfall2_06_s_27:
    speaker: "<Narration>"
    en: and shatters it.
    ko: 깨물어 부쉈다.
    ja: 噛み砕いた
  event_goddessfall2_06_s_28:
    speaker: "<Narration>"
    en: Then the red dragon charges at the Queen.
    ko: 붉은 용이 여왕에게 돌진한다.
    ja: 赤い竜は勢いを止めず…
  event_goddessfall2_06_s_29:
    speaker: nihilister
    en: Eaaat this, Motherrr!
    ko: 이거나 쳐드십쇼--!! 어머니--!!
    ja: これでも食っとけ！クソババア――！！
  event_goddessfall2_06_s_30:
    speaker: "<Narration>"
    en: The red dragon becomes a poisoned chalice
    ko: 붉은 용은 스스로가 독잔이 되어.
    ja: 自らを毒の入った杯と化し
  event_goddessfall2_06_s_31:
    speaker: "<Narration>"
    en: and hurls herself at her Great Mother.
    ko: 위대하신 어머니의 몸에 달려들었다.
    ja: クイーンのボディへと飛びこんだ
  event_goddessfall2_06_s_32:
    speaker: "<Narration>"
    en: "*Bangggg!*"
    ko: 콰아아아앙--!!
    ja: ドカン！！
  event_goddessfall2_06_s_33:
    speaker: "<Narration>"
    en: The two-headed red dragon rams into the Queen,
    ko: 머리 둘의 붉은 용이 퀸에게 들이받는다.
    ja: 双頭の竜がクイーンに激突した
  event_goddessfall2_06_s_34:
    speaker: "<Narration>"
    en: and Nihilister's body begins to break apart.
    ko: 니힐리스타의 신체가 부서진다.
    ja: ニヒリスターの身体が崩れはじめる
  event_goddessfall2_06_s_35:
    speaker: "<Narration>"
    en: At the same time, all of the Queen's arms spread wide
    ko: 그리고 그와 동시에 퀸의 모든 팔이 벌려진다.
    ja: クイーンが腕を広げた
  event_goddessfall2_06_s_36:
    speaker: "<Narration>"
    en: as if to embrace a child she has not seen for a long time.
    ko: 마치, 오랜 시간 만나지 못한 아이를 끌어안듯.
    ja: |-
      まるで、長い間生き別れとなっていた
      子どもを抱き寄せるかのように
  event_goddessfall2_06_s_37:
    speaker: "<Narration>"
    en: She holds the disintegrating Nihilister close,
    ko: 부서져 가는 니힐리스타를 끌어안는다.
    ja: クイーンが崩壊するニヒリスターを抱きしめた
  event_goddessfall2_06_s_38:
    speaker: "<Narration>"
    en: and the latter is absorbed into the Queen's body.
    ko: 니힐리스타는, 퀸의 몸 안으로 스며들어 갔다.
    ja: |-
      崩れた身体が、
      クイーンの体内へ吸い込まれていく
  event_goddessfall2_06_s_39:
    speaker: snowwhite
    en: A suicide attack...!?
    ko: 특공인가…!
    ja: 自爆した…！？
  event_goddessfall2_06_s_40:
    speaker: hongryeon
    en: But prithee, for what cause...?!
    ko: 허나 어째서…!
    ja: しかし、なぜ…！？
  event_goddessfall2_06_s_41:
    speaker: snowwhite
    en: Surely she didn't heal the Queen...!
    ko: 설마 회복시켜 준 건가…!
    ja: 回復させるためか…！？
  event_goddessfall2_06_s_42:
    speaker: rapunzel
    en: Everyone! Look!
    ko: |-
      !!
      여러분! 저걸!
    ja: |-
      ！！
      あれを！
  event_goddessfall2_06_s_43:
    speaker: "<Narration>"
    en: The Queen's body begins to creak,
    ko: 퀸의 몸이 삐걱대기 시작한다.
    ja: クイーンの体がきしみ始めた
  event_goddessfall2_06_s_44:
    speaker: "<Narration>"
    en: then tremble violently.
    ko: 진동하듯 부들댄다.
    ja: 制御を失い震えている
  event_goddessfall2_06_s_45:
    speaker: "<Narration>"
    en: "*Thunk* *Plop*"
    ko: 툭. 투둑.
    ja: バキ、ボキッ…
  event_goddessfall2_06_s_46:
    speaker: "<Narration>"
    en: As black liquid oozes out, parts of the Queen fall away.
    ko: 검은색 액체와 함께, 퀸의 파츠들이 떨어져 나간다.
    ja: |-
      垂れ落ちる黒い液体と共に、
      クイーンのパーツがはがれ落ちた
  event_goddessfall2_06_s_47:
    speaker: rapunzel
    en: This...! Could it be...?
    ko: 이건…! 설마…!
    ja: 今のは…！まさか…！
  event_goddessfall2_06_s_48:
    speaker: nayuta
    en: Her power of regeneration hath been sealed. Verily, the hour of our opportunity
      hath now cometh.
    ko: 재생 능력을 봉했소. 지금이 기회요.
    ja: 再生能力を封じました。今が好機です。
  event_goddessfall2_06_s_49:
    speaker: snowwhite
    en: Nayuta, what's going on here?
    ko: 나유타. 이게 어떻게 된 일이지?
    ja: ナユタ、どういうことだ？
  event_goddessfall2_06_s_50:
    speaker: nayuta
    en: Verily, a foul stratagem have I wrought, yet mine own hands remain unsullied.
    ko: 소인이 소인의 손을 더럽히지 않는 더러운 술수를 썼소이다.
    ja: 自分の手を汚さない、卑劣な手を使いました。
  event_goddessfall2_06_s_51:
    speaker: snowwhite
    en: "... Is that so."
    ko: "…그런가."
    ja: "…そうか。"
  event_goddessfall2_06_s_52:
    speaker: nayuta
    en: There be no certainty how long this effect shall endure;
    ko: 효과가 얼마나 갈진 알 수 없소.
    ja: いつまで効くかは分かりません。
  event_goddessfall2_06_s_53:
    speaker: nayuta
    en: now is the very instant wherein all our fortunes must be laid upon the venture...
    ko: 지금이야말로 모든 것을 걸….
    ja: 今こそ、すべての力を――
  event_goddessfall2_06_s_54:
    speaker: cecil
    en: Everyone, stay put.
    ko: 다들, 거기서 움직이지 말아요.
    ja: 全員、動かないでください。
  event_goddessfall2_06_s_55:
    speaker: cecil
    en: I've got a clear line of fire.
    ko: 사선 클리어.
    ja: 射線クリア。
  event_goddessfall2_06_s_56:
    speaker: johan
    en: It's been exactly 3 hours.
    ko: 정확히 3시간이다.
    ja: 3時間、誤差ゼロだ。
  event_goddessfall2_06_s_57:
    speaker: johan
    en: Eden's Spear. Fire.
    ko: 에덴의 창. 발사.
    ja: エデンの槍、発射。
  event_goddessfall2_06_s_58:
    speaker: "<Narration>"
    en: A flash appears in the distance,
    ko: 저편이 번쩍인다.
    ja: 彼方の空が輝いた
  event_goddessfall2_06_s_59:
    speaker: "<Narration>"
    en: and a blue beam of light strikes the Queen.
    ko: 푸른색의 빛줄기가 퀸을 덮친다.
    ja: 青い光がクイーンを貫いた
  event_goddessfall2_06_s_60:
    speaker: "<Narration>"
    en: As the light fades, the staggering Queen comes into view.
    ko: 빛이 사그라들고, 덜컥대는 퀸이 모습을 드러냈다.
    ja: |-
      光の消えた後には、
      ボロボロになったクイーンが残った
  event_goddessfall2_06_s_61:
    speaker: cecil
    en: "... I hate to say it, but this is truly a monster."
    ko: "…이런 말은 하고 싶지 않은데, 정말 괴물 같군요."
    ja: |-
      …認めたくはありませんが、
      本当に怪物のようです。
  event_goddessfall2_06_s_62:
    speaker: johan
    en: "... We've done everything we can. The rest is up to you."
    ko: "…할 수 있는 모든 수단은 썼다. 뒷일은 맡긴다."
    ja: "…使える手段はすべて使った。あとは頼む。"
  event_goddessfall2_06_s_63:
    speaker: johan
    en: Win.
    ko: 이겨라.
    ja: 勝て。
  event_goddessfall2_06_s_64:
    speaker: nayuta
    en: We shall see it done.
    ko: 맡겨두시오.
    ja: お任せを。
  event_goddessfall2_06_s_65:
    speaker: hongryeon
    en: Yet thou answerst quickest, though thou wert the last to join us.
    ko: 가장 늦게 합류했으면서 대답은 가장 빠르군그래.
    ja: 遅参しておいて、返事は一番かね？
  event_goddessfall2_06_s_66:
    speaker: rapunzel
    en: Yeah, someone might think you've been fighting alongside us from the very
      beginning.
    ko: 그러게요. 누가 보면 처음부터 같이 싸운 줄 알겠어요.
    ja: |-
      まったくです。
      最初から戦っていたような口ぶりですね。
  event_goddessfall2_06_s_67:
    speaker: snowwhite
    en: Next time, don't be late.
    ko: 일찍 일찍 좀 다녀라.
    ja: もっと早く動いてくれ。
  event_goddessfall2_06_s_68:
    speaker: nayuta
    en: Dost thou think I have been idly wandering? Even I, in mine own fashion, have
      hither and thither run, much occupied with mine affairs—
    ko: |-
      소인이 어디서 놀고 온 것 같소?
      소인도 소인 나름대로 이리 뛰고 저리 뛰며 얼마나….
    ja: |-
      今まで遊んでいたとでも？
      これでも私なりに飛び回って…
  event_goddessfall2_06_s_69:
    speaker: snowwhite
    en: Cut the chatter. We're in combat.
    ko: 전투 중이다. 잡담은 삼가라.
    ja: 戦闘中だ。私語は後にしろ。
  event_goddessfall2_06_s_70:
    speaker: hongryeon
    en: Thou still lackest the faintest sense of battle, verily.
    ko: 아직까지 저렇게 전투에 대한 감이 없어서야 원.
    ja: まだまだ戦場には慣れておらぬようだ。
  event_goddessfall2_06_s_71:
    speaker: rapunzel
    en: You were late, so make sure to work twice as hard.
    ko: 늦은 만큼 열심히 해주세요.
    ja: 遅れた分は取り戻してくださいね。
  event_goddessfall2_06_s_72:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_s_73:
    speaker: nayuta
    en: Very well, I shall do my utmost.
    ko: 알겠소. 최선을 다하겠소.
    ja: 当然です。最善を尽くしましょう。
  event_goddessfall2_06_s_74:
    speaker: snowwhite
    en: "... Moving out."
    ko: "…간다."
    ja: "…行くぞ。"
  event_goddessfall2_06_s_75:
    speaker: snowwhite
    en: Encounter!
    ko: 인카운터!
    ja: エンカウンター！
event_goddessfall2_06_e:
  event_goddessfall2_06_e_1:
    speaker: hongryeon
    en: Lo, she harbors no thought of falling...!
    ko: 도무지 쓰러질 생각을 하지 않는군…!
    ja: 往生際の悪い奴だ…！
  event_goddessfall2_06_e_2:
    speaker: snowwhite
    en: Don't stop your attacks!
    ko: 공격을 멈추지 마라!
    ja: 手を緩めるな！
  event_goddessfall2_06_e_3:
    speaker: rapunzel
    en: She's clearly stopped regenerating... and yet...!
    ko: 재생 능력은 분명히 멈췄는데…! 이렇게나…!
    ja: |-
      再生能力は確かに抑えているはず…！
      なぜまだ…！
  event_goddessfall2_06_e_4:
    speaker: nayuta
    en: "... Ah...!"
    ko: "…크으…!"
    ja: "…くっ…！"
  event_goddessfall2_06_e_5:
    speaker: nayuta
    en: I do beg thy pardon, yet prithee, hold her but a little while longer!
    ko: 송구하나, 조금만 시간을 끌어주시오!
    ja: |-
      申し訳ありませんが、
      今しばらく時を稼いでください！
  event_goddessfall2_06_e_6:
    speaker: hongryeon
    en: Even now thou liest in idle leisure? Truly, thy carefreeness doth make me
      envious!
    ko: |-
      이럴 때 마저 게으름을 피우는겐가?
      그것 참 태평해서 부럽군!
    ja: |-
      もう休みたくなったのかい？
      まったく、のんきなものだねぇ！
  event_goddessfall2_06_e_7:
    speaker: snowwhite
    en: Work harder!
    ko: 열심히 좀 해라!
    ja: 本気を出せ！
  event_goddessfall2_06_e_8:
    speaker: rapunzel
    en: Go take a short rest, okay? Don't overdo it!
    ko: 조금만 쉬고 오세요! 아시겠죠!?
    ja: 休むのは少しだけですよ！いいですね！？
  event_goddessfall2_06_e_9:
    speaker: nayuta
    en: "... Dost thou think I seek repose?"
    ko: "…소인이 쉬려고 그러겠소? 응?"
    ja: "…そんなふうに思われているのですか、私は？"
  event_goddessfall2_06_e_10:
    speaker: nayuta
    en: Nay, I yet hold a trump concealed!
    ko: 비장의 수가 남아있소이다!
    ja: とにかく、切り札があるのです！
  event_goddessfall2_06_e_11:
    speaker: nayuta
    en: Though it may not prove decisive, I shall endeavor to fashion an opening for
      thee all.
    ko: 결정적일수는 없겠으나, 틈 정도는 만들어낼 수 있소!
    ja: 決め手にはならずとも、隙は作れる！
  event_goddessfall2_06_e_12:
    speaker: "<Narration>"
    en: Without a word, the three give a brief nod and take off toward Queen.
    ko: 셋은 대답 없이 고개를 끄덕인 후, 퀸에게로 달려갔다.
    ja: 3人が無言でうなずき、クイーンに攻勢をかけた
  event_goddessfall2_06_e_13:
    speaker: "<Narration>"
    en: Nayuta spins on her heel and runs the other way.
    ko: 나유타는 뒤를 돌아 달렸다.
    ja: ナユタは背を向け、その場を離れると…
  event_goddessfall2_06_e_14:
    speaker: "<Narration>"
    en: She finds flat ground and sits in a meditative posture.
    ko: 평평한 위치를 찾아 정좌를 틀고 앉는다.
    ja: |-
      開けた場所にたどりつき、
      腰を下ろした
  event_goddessfall2_06_e_15:
    speaker: "<Narration>"
    en: Amid the rising clamor around her, she forces herself to shut it out.
    ko: |-
      요란스러운 소리가 들려오는 와중,
      나유타는 애써 정신을 가다듬는다.
    ja: |-
      修羅場の喧騒の中で、
      ナユタは必死に心を落ち着けた
  event_goddessfall2_06_e_16:
    speaker: "<Narration>"
    en: Closing her eyes, she gathers herself.
    ko: 눈을 감고 정신을 집중했다.
    ja: 目を閉じ、精神を集中する
  event_goddessfall2_06_e_17:
    speaker: "<Narration>"
    en: Her consciousness spreads outward, connecting with her other clones across
      the surface.
    ko: 지상에 퍼져있는 자신의 분신들과 의식을 잇는다.
    ja: そして地上を漂う分身たちの意識へと…
  event_goddessfall2_06_e_18:
    speaker: "<Narration>"
    en: And then, she makes her proposal.
    ko: 그리고 제안한다.
    ja: 呼びかけた
  event_goddessfall2_06_e_19:
    speaker: nayuta
    en: "... I shall consign thine lives to flame;"
    ko: "…그대들의 목숨. 태우겠소."
    ja: "…あなた方の命を…ここで燃やし尽くします。"
  event_goddessfall2_06_e_20:
    speaker: nayuta
    en: and all sins that shall arise therefrom,
    ko: 그로 인한, 모든 죄는
    ja: 罪の重みはすべて…
  event_goddessfall2_06_e_21:
    speaker: nayuta
    en: I shall bear.
    ko: 소인이 짊어지겠소.
    ja: この身で背負いましょう。
  event_goddessfall2_06_e_22:
    speaker: "<Narration>"
    en: In an instant, all the linked consciousnesses are severed.
    ko: 이어져 있던 의식이 삽시간에 끊어진다.
    ja: 刹那、意識の繋がりが断たれた
  event_goddessfall2_06_e_23:
    speaker: "<Narration>"
    en: Nayuta watches as swarms of golden particles drift toward her
    ko: 나유타는 자신에게로 다가오는 금색 입자의 무리들을 바라보며
    ja: |-
      ナユタは自身に集まりくる
      大量の黄金色の粒子を眺めながら…
  event_goddessfall2_06_e_24:
    speaker: "<Narration>"
    en: and sheds tears.
    ko: 눈물을 흘렸다.
    ja: 涙を流した
  goddessfall:
    speaker: "<>"
    en:
    ko:
    ja:
  event_goddessfall2_06_e_25:
    speaker: "<Narration>"
    en: That which takes Liliweiss's form fixes its eyes on Marian.
    ko: 릴리바이스의 모습을 한 그것이 마리안을 바라본다.
    ja: |-
      リリーバイスの形をした何かが、
      マリアンを見すえた
  event_goddessfall2_06_e_26:
    speaker: "<Narration>"
    en: Struggling to steady herself, Marian meets its gaze.
    ko: 마리안은 비틀거리는 몸을 추스르며 그것을 본다.
    ja: |-
      マリアンはふらつく身体を支えながら、
      それを見返した
  event_goddessfall2_06_e_27:
    speaker: "<Narration>"
    en: Slowly, it advances.
    ko: 그것은 마리안에게로 천천히 다가간다.
    ja: だんだんと近寄ってくる
  event_goddessfall2_06_e_28:
    speaker: "<Narration>"
    en: An unknown energy presses down on her, freezing her in place.
    ko: 마리안은 알 수 없는 기운에 짓눌려 꼼짝도 하지 못한다.
    ja: |-
      マリアンは得体の知れない気迫に圧され、
      一切の身動きができなかった
  event_goddessfall2_06_e_29:
    speaker: "<Narration>"
    en: It lays a hand on her chest—
    ko: 그것이 마리안의 가슴에 손을 댄다.
    ja: マリアンの胸に腕が伸びた
  event_goddessfall2_06_e_30:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 콰직-!
    ja: ズシャッ――！
  event_goddessfall2_06_e_31:
    speaker: "<Narration>"
    en: Its hand drives through her chest,
    ko: 그것의 손이 마리안의 가슴을 꿰뚫는다.
    ja: 胸を貫かれたマリアンが…
  event_goddessfall2_06_e_32:
    speaker: "<Narration>"
    en: and Marian crumples to the ground.
    ko: 마리안이 쓰러진다.
    ja: 倒れた
  event_goddessfall2_06_e_33:
    speaker: "<Narration>"
    en: The figure stares at the red core glowing in its grasp, clearly pleased.
    ko: 붉게 빛나는 코어를, 그것은 만족스럽다는 듯 바라본다.
    ja: それは赤く輝くコアを、満足げに眺めた
  event_goddessfall2_06_e_34:
    speaker: "<Narration>"
    en: 'GODDESS: FALL'
    ko: 'GODDESS : FALL'
    ja: 'GODDESS : FALL'
  event_goddessfall2_06_e_35:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 탕-!
    ja: バンッ！
  event_goddessfall2_06_e_36:
    speaker: "<Narration>"
    en: Its head jerks slightly
    ko: 그것의 머리가 살짝 흔들린다.
    ja: 頭が軽く揺れた
  event_goddessfall2_06_e_37:
    speaker: "<Narration>"
    en: and turns around.
    ko: 그것이 고개를 돌린다.
    ja: それが振り返る
  event_goddessfall2_06_e_38:
    speaker: "<Narration>"
    en: Papillon pants heavily,
    ko: 파피용은 거친 숨을 몰아쉬며
    ja: すでに息を切らしているパピヨンは…
  event_goddessfall2_06_e_39:
    speaker: "<Narration>"
    en: tasting a fear she has never known before.
    ko: 지금껏 느껴보지 못한 공포를 맛보았다.
    ja: 今まで感じたことのない恐怖を味わっていた
  event_goddessfall2_06_e_40:
    speaker: papillon
    en: Wha—hey, you.
    ko: 뭐… 야 너.
    ja: 何…あなた…
  event_goddessfall2_06_e_41:
    speaker: papillon
    en: What are you? What even are you?!
    ko: 너 뭐야! 대체 뭐야!
    ja: いったい何なの！？
  event_goddessfall2_06_e_42:
    speaker: "<Narration>"
    en: The figure closes in on Papillon.
    ko: 그것이 파피용에게로 다가간다.
    ja: それが近づいてくる
  event_goddessfall2_06_e_43:
    speaker: "<Narration>"
    en: She fires wildly, panic rising with every shot. But it doesn't so much as
      flinch.
    ko: 파피용은 발악하듯 총을 갈겨댔지만, 그것은 미동도 하지 않는다.
    ja: |-
      パニックを起こしたパピヨンが
      銃を乱射するものの、
      まるで効き目はなかった
  event_goddessfall2_06_e_44:
    speaker: "<Narration>"
    en: Just as it draws near,
    ko: 그것이 점점 다가오고 있을 때.
    ja: さらに距離が近づき…
  event_goddessfall2_06_e_45:
    speaker: "<Narration>"
    en: Dorothy lands between them.
    ko: 파피용과 그것 사이에 도로시가 착지했다.
    ja: 両者の間に立ちはだかる影が差した
  event_goddessfall2_06_e_46:
    speaker: papillon
    en: Doro... thy, you came...
    ko: 도로… 시. 왔구나….
    ja: ドロシー…やっと…
  event_goddessfall2_06_e_47:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_48:
    speaker: dorothy
    en: Lili...weiss...
    ko: 릴리… 바이스….
    ja: リリー…バイス…
  event_goddessfall2_06_e_49:
    speaker: "<Narration>"
    en: The figure looks at Dorothy.
    ko: 그것은 도로시를 바라본다.
    ja: それがドロシーを見た
  event_goddessfall2_06_e_50:
    speaker: "<Narration>"
    en: Her chest tightens as tears threaten to spill.
    ko: 도로시는 눈물이 터져 나올 것 같은 감정을 느꼈다.
    ja: ドロシーの胸に感情がこみあげた
  event_goddessfall2_06_e_51:
    speaker: "<Narration>"
    en: Every part of her wants to run forward and embrace it.
    ko: 당장에라도 달려가 그것을 끌어안고 싶어 했다.
    ja: |-
      今すぐにでも駆け寄って、
      抱きしめたくなるほどに
  event_goddessfall2_06_e_52:
    speaker: "<Narration>"
    en: But...
    ko: 하지만.
    ja: だが…
  event_goddessfall2_06_e_53:
    speaker: dorothy
    en: "... No."
    ko: "…아니야."
    ja: "…いいえ。"
  event_goddessfall2_06_e_54:
    speaker: dorothy
    en: Liliweiss is dead.
    ko: 릴리바이스는 죽었어요.
    ja: リリーバイスはもういません。
  event_goddessfall2_06_e_55:
    speaker: dorothy
    en: The dead cannot return.
    ko: 죽은 자는 다시 돌아올 수 없어요.
    ja: 死者は二度と還らない。
  event_goddessfall2_06_e_56:
    speaker: dorothy
    en: Who are you?
    ko: 당신, 누군가요?
    ja: 何者です、あなたは？
  event_goddessfall2_06_e_57:
    speaker: "<Narration>"
    en: The figure remains silent.
    ko: 그것은 말이 없다.
    ja: 沈黙が降りた
  event_goddessfall2_06_e_58:
    speaker: dorothy
    en: Who are you, to dare wear her form?
    ko: 누군데 감히 그 모습을 하고 있는 건가요.
    ja: それが誰の姿か分かっているのですか？
  event_goddessfall2_06_e_59:
    speaker: dorothy
    en: Answer me.
    ko: 대답해요.
    ja: 答えは。
  event_goddessfall2_06_e_60:
    speaker: "<Narration>"
    en: Once again, silence settles over them.
    ko: 그것은 말이 없다.
    ja: 再び沈黙が降りた
  event_goddessfall2_06_e_61:
    speaker: dorothy
    en: "... Answer me."
    ko: "…대답해요."
    ja: "…答えなさい。"
  event_goddessfall2_06_e_62:
    speaker: dorothy
    en: I said, answer me!
    ko: 대답하라고!
    ja: "…答えは！"
  event_goddessfall2_06_e_63:
    speaker: "<Narration>"
    en: Sure enough, there was no response.
    ko: 그것은 말이 없다.
    ja: やはり、答えは無かった
  event_goddessfall2_06_e_64:
    speaker: "<Narration>"
    en: Light bursts from Dorothy's gun.
    ko: 도로시의 총구가 빛을 내뿜는다.
    ja: ドロシーの銃が光を放った
  event_goddessfall2_06_e_65:
    speaker: "<Narration>"
    en: The figure's head snaps upward.
    ko: 그것의 머리가 젖혀진다.
    ja: それが頭をそり返らせた
  event_goddessfall2_06_e_66:
    speaker: "<Narration>"
    en: Slowly, it lifts a hand to its forehead where the light grazed.
    ko: 그것은 손을 들어 자신이 이마를 짚는다.
    ja: 光のかすめた額に、それが手を当てた
  event_goddessfall2_06_e_67:
    speaker: "<Narration>"
    en: One red drop smears across the glove.
    ko: 붉은색 액체 한 방울이 장갑에 묻어났다.
    ja: 手袋に一滴の赤いものが染みついた
  event_goddessfall2_06_e_68:
    speaker: dorothy
    en: Fine. If you have no intention of answering,
    ko: 대답할 생각이 없다면, 좋아요.
    ja: 答える気が無いなら、構いません。
  event_goddessfall2_06_e_69:
    speaker: dorothy
    en: then die.
    ko: 죽어요.
    ja: 殺します。
  event_goddessfall2_06_e_70:
    speaker: dorothy
    en: Just standing there before me looking like that
    ko: 그 모습을 한 채, 내 앞에 섰다는 것만으로도.
    ja: その姿で私の前に立った。
  event_goddessfall2_06_e_71:
    speaker: dorothy
    en: is reason enough for me to kill you.
    ko: 당신이 죽을 이유는 충분하니까.
    ja: 死に値して余りある行いです。
  event_goddessfall2_06_e_72:
    speaker: "<Narration>"
    en: Its eyes lock with Dorothy's.
    ko: 그것은 도로시를 바라본다.
    ja: それがドロシーを見返した
  event_goddessfall2_06_e_73:
    speaker: "<Narration>"
    en: Slowly, it glances down at the smear of red on its glove.
    ko: 그것은 자신의 장갑에 묻은 붉은 액체를 바라본다.
    ja: そして手袋を染めた赤い液体に視線を移した
  event_goddessfall2_06_e_74:
    speaker: "<Narration>"
    en: With a burst of motion, it kicks off the ground
    ko: 그것은 지면을 박차며 단숨에 도약했다.
    ja: 次の瞬間、それは地面を蹴って跳躍し…
  event_goddessfall2_06_e_75:
    speaker: "<Narration>"
    en: and vanishes beyond the horizon.
    ko: 그리고 지평선 너머로 사라졌다.
    ja: 瞬く間に地平線の彼方へ消えた
  event_goddessfall2_06_e_76:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_77:
    speaker: cecil_op_r
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  event_goddessfall2_06_e_78:
    speaker: dorothy
    en: Cecil, I see you've made it safely.
    ko: 세실. 무사했군요.
    ja: セシル。無事でしたか。
  event_goddessfall2_06_e_79:
    speaker: johan
    en: Gather the wounded.
    ko: 부상자들을 수습한다.
    ja: 負傷者たちを回収する。
  event_goddessfall2_06_e_80:
    speaker: johan
    en: "... There may be fatalities."
    ko: "…사망자가 있을지도 모르겠군."
    ja: "…負傷ではない者もいるかもしれない。"
  event_goddessfall2_06_e_81:
    speaker: papillon
    en: I-I'll help too.
    ko: 나도, 나도 도울게.
    ja: わ、私も手伝うわ。
  event_goddessfall2_06_e_82:
    speaker: johan
    en: "... Good."
    ko: "…부탁하지."
    ja: "…頼む。"
  event_goddessfall2_06_e_83:
    speaker: johan
    en: Eden's optical camouflage is fully operational.
    ko: 에덴의 광학미채는 정상 가동하고 있는 상태다.
    ja: エデンの光学迷彩は正常に回復している。
  event_goddessfall2_06_e_84:
    speaker: johan
    en: Still, our commotion will draw the Raptures here quickly.
    ko: 그럼에도 불구하고 워낙 큰 소란이 있었으니 랩쳐들이 몰려올거다.
    ja: |-
      だが、これほどの騒ぎだ。
      ラプチャーどもが押し寄せてくるだろう。
  event_goddessfall2_06_e_85:
    speaker: johan
    en: Have the remaining forces defend Eden. It'll be enough if we can hold out
      for two days.
    ko: |-
      잔존 병력은 에덴을 방위해라.
      이틀 정도 막아낸다면 문제없을 거다.
    ja: |-
      残存戦力でエデンの防衛を行う。
      2日しのぎきれば問題ないはずだ。
  event_goddessfall2_06_e_86:
    speaker: kilo
    en: U-understood.
    ko: 아, 알겠습니다.
    ja: わ、分かりました。
  event_goddessfall2_06_e_87:
    speaker: crown
    en: "... What an extraordinary turn of events."
    ko: "…믿을 수 없는 일들이 벌어졌군요."
    ja: "…信じられないことになりましたわね。"
  event_goddessfall2_06_e_88:
    speaker: chime
    en: "... Hast we won, Your Highness?"
    ko: "…우린, 이긴 걸까요? 아가씨."
    ja: "…お嬢さま、我々は…勝ったのでございますか？"
  event_goddessfall2_06_e_89:
    speaker: crown
    en: I'm not sure yet. It's too early to jump to reckonings.
    ko: 아직 모릅니다. 속셈하긴 일러요.
    ja: |-
      まだ分かりません。
      きわめつけるのは早いですわ。
  event_goddessfall2_06_e_90:
    speaker: chime
    en: Methinks the word be "conclusions."
    ko: 속단… 입니다요.
    ja: お嬢さま…「決めつける」でございます。
  event_goddessfall2_06_e_91:
    speaker: papillon
    en: "... What's become of everyone?"
    ko: "…다들 어떻게 됐어?"
    ja: "…あれからみんな、どうなったの？"
  event_goddessfall2_06_e_92:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_93:
    speaker: johan
    en: "... Inherit has been wiped out."
    ko: "…인헤르트는 전멸했다."
    ja: "…インヘルトは全滅した。"
  event_goddessfall2_06_e_94:
    speaker: dorothy
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall2_06_e_95:
    speaker: papillon
    en: "... Wiped out?"
    ko: "…전멸."
    ja: "…全滅って…"
  event_goddessfall2_06_e_96:
    speaker: johan
    en: Only Noah's brain is being stored in the brain shelter.
    ko: 노아의 뇌만 브레인 셸터에 보관 중이다.
    ja: |-
      ノアの脳はブレインシェルターに
      保管されている。
  event_goddessfall2_06_e_97:
    speaker: johan
    en: As for Isabel and Harran... they have fallen.
    ko: 이사벨과 하란은… 전사했다.
    ja: イサベルとハランは…戦死した。
  event_goddessfall2_06_e_98:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_99:
    speaker: papillon
    en: I... see.
    ko: 그렇… 구나.
    ja: そう…なのね。
  event_goddessfall2_06_e_100:
    speaker: johan
    en: Marian has lost her core and is in a comatose state.
    ko: 마리안은 코어가 소실되어 혼수 상태다.
    ja: マリアンはコアを失い、昏睡している。
  event_goddessfall2_06_e_101:
    speaker: johan
    en: She remains alive for now, but her condition is unstable.
    ko: 죽진 않았지만, 언제 무슨 일이 일어날지 모른다.
    ja: |-
      生きてはいるようだが、
      いつ何が起こるかは予想できない。
  event_goddessfall2_06_e_102:
    speaker: johan
    en: As a Heretic, she's difficult to treat.
    ko: 헬레틱이다 보니 치료도 쉽지 않다.
    ja: ヘレティックである以上、治療も困難だ。
  event_goddessfall2_06_e_103:
    speaker: johan
    en: We have no choice but to rely on her regeneration.
    ko: 자연 치유력을 믿을 수밖에.
    ja: 本人の再生力に頼るしかない。
  event_goddessfall2_06_e_104:
    speaker: johan
    en: Rapunzel's body was completely destroyed, save for a portion of her head.
    ko: 라푼젤은 두부 일부를 제외하고는 산산조각 났다.
    ja: ラプンツェルは頭の一部を除いて粉砕された。
  event_goddessfall2_06_e_105:
    speaker: johan
    en: Her brain has been stored.
    ko: 뇌만 보관 중이다.
    ja: 脳だけは回収している。
  event_goddessfall2_06_e_106:
    speaker: johan
    en: Scarlet is heavily damaged, and her condition is too unstable to allow for
      brain extraction.
    ko: 홍련은 대파됐다. 너무 심하게 망가져 아직 뇌를 꺼내지 못했다.
    ja: |-
      紅蓮も大破した。
      損傷が激しく、脳を取り出せていない。
  event_goddessfall2_06_e_107:
    speaker: johan
    en: She's in the most critical condition.
    ko: 가장 위험한 상태다.
    ja: 最も危険な状態だ。
  event_goddessfall2_06_e_108:
    speaker: johan
    en: Nayuta sustained moderate injuries. After releasing her power, her physical
      durability increased, preventing fatal injury.
    ko: |-
      나유타는 중파 상태다.
      힘을 해방한 이후 신체 강도가 높아져 치명적인 부상을 입진 않았다.
    ja: |-
      ナユタも軽くない傷を負った。
      だが力を解放して防御力が上がっていたのか、
      致命傷は免れたようだ。
  event_goddessfall2_06_e_109:
    speaker: johan
    en: She will be cleared for duty soon.
    ko: 곧 복귀 가능하다.
    ja: 遠くないうちに復帰できるだろう。
  event_goddessfall2_06_e_110:
    speaker: johan
    en: Snow White was cleanly severed.
    ko: 스노우 화이트는 몸이 깨끗하게 절단됐다.
    ja: スノーホワイトはボディが両断されていた。
  event_goddessfall2_06_e_111:
    speaker: johan
    en: Due to the precision of the cut, her injuries are minimal.
    ko: 너무 깨끗해서 오히려 부상의 정도가 가장 적다.
    ja: |-
      だがきれいに切断されていたため、
      最も軽傷で済んだとも言える。
  event_goddessfall2_06_e_112:
    speaker: johan
    en: Cecil is repairing her, so she should be back on her feet soon.
    ko: 세실이 수리 중이니, 곧 복귀 가능하다.
    ja: |-
      セシルの修理が終われば、
      すぐにでも復帰するだろう。
  event_goddessfall2_06_e_113:
    speaker: johan
    en: "... That's all."
    ko: "…이상이다."
    ja: "…以上だ。"
  event_goddessfall2_06_e_114:
    speaker: dorothy
    en: Johan.
    ko: 요한.
    ja: ヨハン。
  event_goddessfall2_06_e_115:
    speaker: johan
    en: Don't, Dorothy.
    ko: 말하지 마라. 도로시.
    ja: 口を塞いでいろ、ドロシー。
  event_goddessfall2_06_e_116:
    speaker: johan
    en: I don't wish to talk to you right now.
    ko: 지금 너와 대화를 나누고 싶지 않다.
    ja: 今はお前と話す気分ではない。
  event_goddessfall2_06_e_117:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_118:
    speaker: johan
    en: I'm going to rest for ten minutes.
    ko: 10분만 쉬겠다.
    ja: 10分間の休憩とする。
  event_goddessfall2_06_e_119:
    speaker: "<Narration>"
    en: Johan staggers off
    ko: 요한은 비틀대며 어디론가 걸어갔다.
    ja: ヨハンは力のない足取りで、どこかへ歩き去った
  event_goddessfall2_06_e_120:
    speaker: "<Narration>"
    en: as Dorothy watches him go in silence.
    ko: 도로시는 그 모습을 말없이 지켜봤다.
    ja: ドロシーは何も言えず、その姿を見送った
  event_goddessfall2_06_e_121:
    speaker: cecil
    en: Reattachment is complete.
    ko: 접합은 완료됐어요.
    ja: 接合は完了しました。
  event_goddessfall2_06_e_122:
    speaker: cecil
    en: It may sound strange, but the cut was so clean that reassembly posed no difficulty.
    ko: 이상하게 들리겠지만, 너무 깔끔하게 잘려 나가서 쉬웠어요.
    ja: |-
      皮肉な話ですが、
      切断面がきれいで簡単でした。
  event_goddessfall2_06_e_123:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_124:
    speaker: cecil
    en: "... Hey, are you all right?"
    ko: "…이봐요. 괜찮아요?"
    ja: "…具合は、大丈夫ですか？"
  event_goddessfall2_06_e_125:
    speaker: snowwhite
    en: "... I remember it all."
    ko: "…모두, 기억났다."
    ja: "…何もかも、思い出した。"
  event_goddessfall2_06_e_126:
    speaker: cecil
    en: What exactly do you remember?
    ko: 기억났다니, 뭐가요?
    ja: 思い出したとは、何のことですか？
  event_goddessfall2_06_e_127:
    speaker: snowwhite
    en: About Lilith.
    ko: 언니에 대해.
    ja: お姉ちゃんのことだ。
  event_goddessfall2_06_e_128:
    speaker: cecil
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_goddessfall2_06_e_129:
    speaker: snowwhite
    en: Cecil.
    ko: 세실.
    ja: セシル。
  event_goddessfall2_06_e_130:
    speaker: cecil
    en: Yes?
    ko: 예.
    ja: はい。
  event_goddessfall2_06_e_131:
    speaker: snowwhite
    en: Give me some weapons and equipment.
    ko: 나에게 무장과 장비를 다오.
    ja: 強い武器と装備をくれ。
  event_goddessfall2_06_e_132:
    speaker: snowwhite
    en: There's no way I can beat her with what I've got now.
    ko: 지금의 무장과 장비로는 언니를 이길 수 없어.
    ja: 今のままでは、お姉ちゃんに勝てない。
  event_goddessfall2_06_e_133:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_134:
    speaker: snowwhite
    en: "... I have no money, so put it on my tab."
    ko: "…돈은 없다. 외상하겠다."
    ja: "…出せるものはない。ツケにしてくれ。"
  event_goddessfall2_06_e_135:
    speaker: cecil
    en: "... Perhaps you don't know this,"
    ko: "…그거 아시나요?"
    ja: "…知っていましたか？"
  event_goddessfall2_06_e_136:
    speaker: cecil
    en: but Eden has plans for weapons and equipment reserved exclusively for the
      Pioneers.
    ko: 에덴에는 당신들, 그러니까 파이오니아의 전용이라고 부를만한 장비와 무장에 대한 플랜이 있어요.
    ja: |-
      エデンにはあなた方…つまり、
      パイオニア専用と言っても過言ではない
      兵器や装備のプランがあります。
  event_goddessfall2_06_e_137:
    speaker: cecil
    en: They're meant as a gift
    ko: 언젠가, 그 언젠가 당신들과 힘을 합치는 날이 올 때.
    ja: もしいつか、共闘できる時が来たら…
  event_goddessfall2_06_e_138:
    speaker: cecil
    en: for the day we might one day fight together.
    ko: 선물로 주기 위해 준비해 놓았던 것이죠.
    ja: それを贈るつもりでした。
  event_goddessfall2_06_e_139:
    speaker: cecil
    en: Johan is the one who prepared them.
    ko: 요한이 준비했어요.
    ja: ヨハンが直々に進めていた計画です。
  event_goddessfall2_06_e_140:
    speaker: snowwhite
    en: Why weren't these given to us sooner?
    ko: 왜 진작 주지 않았지?
    ja: なぜこの戦いに出さなかった？
  event_goddessfall2_06_e_141:
    speaker: cecil
    en: As I said, we're still in the planning stage.
    ko: 플랜이라니까요.
    ja: あくまで計画ですから。
  event_goddessfall2_06_e_142:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_143:
    speaker: snowwhite
    en: When can you complete them?
    ko: 언제 완성할 수 있지?
    ja: 完成はいつになる？
  event_goddessfall2_06_e_144:
    speaker: cecil
    en: If you cooperate, two weeks will be enough.
    ko: 당신이 잘 협조한다면, 2주면 가능해요.
    ja: あなたが協力的であれば、2週間で足ります。
  event_goddessfall2_06_e_145:
    speaker: snowwhite
    en: All right,
    ko: 그래.
    ja: 分かった。
  event_goddessfall2_06_e_146:
    speaker: snowwhite
    en: I'm counting on you.
    ko: 부탁하지.
    ja: よろしく頼む。
  event_goddessfall2_06_e_147:
    speaker: cecil
    en: The same to you.
    ko: 저야말로 잘 부탁해요.
    ja: こちらこそ。
  event_goddessfall2_06_e_148:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_06_e_149:
    speaker: "<Narration>"
    en: Snow White closes her eyes,
    ko: 스노우 화이트는 눈을 감는다.
    ja: スノーホワイトは目を閉じ…
  event_goddessfall2_06_e_150:
    speaker: "<Narration>"
    en: reaching into the recesses of her memories.
    ko: 그리고 기억을 더듬는다.
    ja: 記憶をたどった
  event_goddessfall2_06_e_151:
    speaker: "<Narration>"
    en: A white landscape flickers into view—
    ko: 새하얀 풍경이 아른거린다.
    ja: あたり一面の白
  event_goddessfall2_06_e_152:
    speaker: "<Narration>"
    en: a field overflowing with white lilies,
    ko: 들판을 가득 채운, 바람에 흔들리는
    ja: 野原いっぱいに咲き、風になびく…
  event_goddessfall2_06_e_153:
    speaker: "<Narration>"
    en: swaying gently in the wind.
    ko: 아름다운 릴리바이스.
    ja: 美しい白百合の花
  event_goddessfall2_06_e_154:
    speaker: snowwhite
    en: "... Lilith."
    ko: "…언니."
    ja: "…お姉ちゃん。"
  event_goddessfall2_06_e_155:
    speaker: "<Narration>"
    en: A crimson landscape flickers before her eyes...
    ko: 붉은 풍경이 아른거린다.
    ja: 赤く染まった風景
  event_goddessfall2_06_e_156:
    speaker: "<Narration>"
    en: Reeds dancing under the blazing sun,
    ko: 갈대밭, 타는 듯한 태양.
    ja: 風吹く草原、燃えるような太陽
  event_goddessfall2_06_e_157:
    speaker: "<Narration>"
    en: an old melody carried by the wind.
    ko: 들려오는 오래된 노래.
    ja: 聞こえてくる古くさい歌
  event_goddessfall2_06_e_158:
    speaker: "<Narration>"
    en: She recalls their final farewell,
    ko: 그녀와의 마지막 이별을 떠올린다.
    ja: 彼女との最後の別れ
  event_goddessfall2_06_e_159:
    speaker: "<Narration>"
    en: and tears roll down her cheek.
    ko: 스노우 화이트는 눈물을 흘린다.
    ja: スノーホワイトの眼から涙がこぼれた
  event_goddessfall2_06_e_160:
    speaker: snowwhite
    en: "... Red Hood."
    ko: "…레드 후드."
    ja: "…レッドフード。"
event_goddessfall2_epilogue:
  event_goddessfall2_epilogue_1:
    speaker: nayuta
    en: We must needs borrow the strength of the Ark.
    ko: 방주의 힘을 빌려야 하오.
    ja: アークの力が必要です。
  event_goddessfall2_epilogue_2:
    speaker: johan
    en: We will do no such thing.
    ko: 방주의 힘은 빌리지 않는다.
    ja: アークの力は借りない。
  event_goddessfall2_epilogue_3:
    speaker: cecil
    en: I'd really rather not.
    ko: 정말 내키지 않네요.
    ja: 私も賛成しかねます。
  event_goddessfall2_epilogue_4:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_5:
    speaker: nayuta
    en: Hmmm... I did reckon this matter would not be met with welcome, yet ne'er
      did I foresee so chill a reception.
    ko: 음… 환영받을 얘기는 아니었다 생각했건만 이 정도로 싸늘할 줄은 예상 외요.
    ja: |-
      うーむ…歓迎されない話と
      分かってはおりましたが、
      ここまでにべもないとは…
  event_goddessfall2_epilogue_6:
    speaker: nayuta
    en: Pray, attend closely.
    ko: 하지만 잘 들어보시오.
    ja: しかし、聞いていただかねばなりません。
  event_goddessfall2_epilogue_7:
    speaker: nayuta
    en: How it came to pass I cannot rightly discern, but from the Queen's body did
      Liliweiss appear.
    ko: |-
      어떻게 된 일인지는 잘 모르겠으나,
      퀸의 몸에서 릴리바이스가 나타났소.
    ja: |-
      詳しい因果は不明ですが、
      クイーンのボディから
      リリーバイスらしき人影が出現しました。
  event_goddessfall2_epilogue_8:
    speaker: nayuta
    en: "... By her state and demeanor, 'tis plain she is not the true Liliweiss."
    ko: "…상태와 태도로 봐선 그것은 진짜 릴리바이스가 아니외다."
    ja: "…状況から考えて、本人とは考えがたい。"
  event_goddessfall2_epilogue_9:
    speaker: nayuta
    en: The most reasonable supposition is that the Queen hath... by some means, seized
      the body of Liliweiss.
    ko: 생각할 수 있는 건, 퀸이 릴리바이스의 바디를 강탈했다… 가 맞겠소.
    ja: |-
      もっとも可能性が高いのは、
      リリーバイスのボディが
      クイーンに奪取された疑い…
  event_goddessfall2_epilogue_10:
    speaker: nayuta
    en: In sooth, the Queen yet abideth.
    ko: 즉, 퀸은 아직 건재하다는 얘기외다.
    ja: |-
      すなわち、クイーンは
      いまだ健在ということです。
  event_goddessfall2_epilogue_11:
    speaker: nayuta
    en: "... Meanwhile, grievous losses have we suffered,"
    ko: "…반면, 우리는 많은 것을 잃었소."
    ja: "…一方で、こちらは多くのものを失っています。"
  event_goddessfall2_epilogue_12:
    speaker: nayuta
    en: and the strength we once possessed returneth not.
    ko: 이전만큼의 전력은 낼 수 없겠지.
    ja: 二度と同じ戦力は出せないでしょう。
  event_goddessfall2_epilogue_13:
    speaker: nayuta
    en: Moreover, the Queen is a foe the Ark must needs vanquish;
    ko: 그리고 퀸은 방주 입장에서도 반드시 쓰러뜨려야 할 대상이오.
    ja: |-
      クイーンはアークにとっても
      必ず討ち取るべき敵です。
  event_goddessfall2_epilogue_14:
    speaker: nayuta
    en: there lieth no cause for us to forbear alliance with them.
    ko: 방주와 손을 잡지 않을 이유가 없소이다.
    ja: 手を組まない理由がありません。
  event_goddessfall2_epilogue_15:
    speaker: johan
    en: I refuse.
    ko: 거절한다.
    ja: 断る。
  event_goddessfall2_epilogue_16:
    speaker: johan
    en: If we strike after thorough preparation, victory is certain.
    ko: 좀 더 확실히 준비해 공격한다면 이길 수 있다.
    ja: 確実な準備と攻撃手段があれば、勝てる相手だ。
  event_goddessfall2_epilogue_17:
    speaker: nayuta
    en: What manner of preparation dost thou speak?
    ko: 어떤 준비.
    ja: 準備とは、どのような？
  event_goddessfall2_epilogue_18:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_19:
    speaker: nayuta
    en: In the present plight, naught remaineth for us but to clasp hands with the
      Ark, else victory is beyond our reach. This, verily, is certain.
    ko: |-
      지금 상황에서 방주와 손을 잡는 것 이외에는 승산이 없소.
      이건 확실하지.
    ja: |-
      今の状況では、
      アークと手を組むほかに勝算はありません。
      それは確かです。
  event_goddessfall2_epilogue_20:
    speaker: nayuta
    en: "... So it is. Whether ye oppose or consent, 'tis of little concern to me."
    ko: |-
      …뭐, 좋소이다.
      그대들이 반대하든 말든 소인이 알 바는 아니오.
    ja: |-
      …まあ、それでも結構。
      あなた方に反対されようとも、
      私が従う必要はありません。
  event_goddessfall2_epilogue_21:
    speaker: nayuta
    en: All that behoveth is that I hie me unto the Ark and entreat their succour.
    ko: 소인이 방주에 가서 도움을 요청하면 그만인 일이요.
    ja: |-
      私がアークに助けを求めれば、
      それで済むことです。
  event_goddessfall2_epilogue_22:
    speaker: johan
    en: Do as you please.
    ko: 맘대로 해라.
    ja: 好きにしろ。
  event_goddessfall2_epilogue_23:
    speaker: cecil
    en: Consider yourself fortunate if you're not scrapped.
    ko: 분해라도 당하지 않으면 다행이겠네요.
    ja: 分解されないといいですね。
  event_goddessfall2_epilogue_24:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_25:
    speaker: nayuta
    en: Pride hath no place at this hour. Use what means thou must...
    ko: |-
      자존심 세울 때가 아니오.
      무슨 수를 쓰더라도….
    ja: |-
      自尊心を天秤にかけている時ではありません。
      いかなる手を使ってでも…
  event_goddessfall2_epilogue_26:
    speaker: johan
    en: I said we have no need of them, Monk.
    ko: 필요 없다고 말했다. 승려.
    ja: 必要ないと言っている。
  event_goddessfall2_epilogue_27:
    speaker: cecil
    en: I agree.
    ko: 저도 동의해요.
    ja: 私も同じ意見です。
  event_goddessfall2_epilogue_28:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_29:
    speaker: nayuta
    en: Cast thine eyes out the window, Young Hero Johan.
    ko: 요한 소협. 창밖을 보시오.
    ja: ヨハン、外を見てください。
  event_goddessfall2_epilogue_30:
    speaker: nayuta
    en: What dost thou see?
    ko: 뭐가 보이시오.
    ja: 何が見えますか？
  event_goddessfall2_epilogue_31:
    speaker: johan
    en: The surface.
    ko: 지상이 보인다.
    ja: 地上が見える。
  event_goddessfall2_epilogue_32:
    speaker: nayuta
    en: Pray, how doth thou find it?
    ko: 감상이 어떻소.
    ja: どう見えますか？
  event_goddessfall2_epilogue_33:
    speaker: nayuta
    en: Is it delightful to behold nature at peace and in resplendent blossom?
    ko: 자연이 만개하고 고요해서 보기 좋소?
    ja: 自然が広がり、静かでいいとお思いですか？
  event_goddessfall2_epilogue_34:
    speaker: johan
    en: Get to the point.
    ko: 무슨 말을 하고 싶은 거냐.
    ja: 何が言いたい。
  event_goddessfall2_epilogue_35:
    speaker: nayuta
    en: I abhor it.
    ko: 소인은 싫소.
    ja: 私は嫌いです。
  event_goddessfall2_epilogue_36:
    speaker: nayuta
    en: The sight thereof doth fill me with loathing.
    ko: 저 지상의 모습이 혐오감이 들 정도로 싫소.
    ja: この地上の有り様に、憎しみさえ覚えるほど。
  event_goddessfall2_epilogue_37:
    speaker: nayuta
    en: I delight in great buildings rising skyward, carriages coursing hither and
      thither, and the throngs of mankind in lively commotion.
    ko: 소인은 저곳에 큰 건물이 들어서고, 자동차가 다니며, 사람들로 북적거리는 것이 좋소.
    ja: |-
      地上には巨大な建築物が立ち並び、
      車が走り、人々で賑わっているべきです。
  event_goddessfall2_epilogue_38:
    speaker: nayuta
    en: This desolate world, I tell thee, is a spectacle most vile.
    ko: 이 텅 빈 세계는 꼴도 보기 싫단 말이외다.
    ja: こんな空しい世界は見たくもない。
  event_goddessfall2_epilogue_39:
    speaker: nayuta
    en: Pray, what deemest thou hath rendered this place so forlorn?
    ko: 왜 여기가 이렇게 텅 비었다고 생각하시오.
    ja: そして、世界がこうなった元凶がある。
  event_goddessfall2_epilogue_40:
    speaker: nayuta
    en: "'Tis on account of them."
    ko: 그것. 그것들 때문이오.
    ja: 全てはあれ。彼奴らのせいです。
  event_goddessfall2_epilogue_41:
    speaker: nayuta
    en: Raptures and their Queen.
    ko: 랩쳐. 그리고 랩쳐의 퀸.
    ja: ラプチャーと、そのクイーン。
  event_goddessfall2_epilogue_42:
    speaker: nayuta
    en: By their hand is the world thus brought low.
    ko: 그것들 때문에! 이 꼴이 되었단 말이오.
    ja: やつらこそが、世界をこのようにしてしまった。
  event_goddessfall2_epilogue_43:
    speaker: nayuta
    en: Hast thou grown accustomed thereto?
    ko: 익숙하오?
    ja: 慣れてしまいましたか？
  event_goddessfall2_epilogue_44:
    speaker: nayuta
    en: After decades upon this barren surface, hath this wretched scene become familiar
      unto thee?
    ko: 이미 수십 년에 가까운 시간을 지상에서 살았으니 이 풍경이 익숙하오?
    ja: |-
      もう何十年とこの地上で過ごして、
      見慣れてしまったのですか？
  event_goddessfall2_epilogue_45:
    speaker: nayuta
    en: As for me, I shall ne'er grow fond of it!
    ko: 소인은 도무지 좋아지지 않소!
    ja: 私はまったく好きになれない！
  event_goddessfall2_epilogue_46:
    speaker: nayuta
    en: Though thousands of mine replicas have gazed upon this land a countless number
      of times, still do I hold it in abhorrence!
    ko: 수천의 소인들이 지상의 모습을 수없이 눈에 담았으나, 좋아지지 않소!
    ja: |-
      幾千の私が地上の姿をこの目に収め、
      それでもなお！
  event_goddessfall2_epilogue_47:
    speaker: nayuta
    en: No spot doth invite my gaze; all appeareth loathsome unto mine eyes!
    ko: 단 한 곳도! 소인의 눈에 담아두기 싫을 정도로 싫단 말이외다!
    ja: |-
      ただの1ヶ所でさえ！
      見慣れた景色にはしたくありません！
  event_goddessfall2_epilogue_48:
    speaker: nayuta
    en: Dost thou spurn the aid of the Ark? Out of pride? Or because thou canst not
      forgive their trespasses?
    ko: |-
      방주의 힘을 빌리는 것이 싫다고?
      자존심이 상해서? 용서할 수 없어서?
    ja: |-
      アークの力を借りたくない？
      自尊心ですか？それとも赦せないからですか？
  event_goddessfall2_epilogue_49:
    speaker: nayuta
    en: Awaken thyselves! Now is no hour for trifling with petty matters!
    ko: 정신들 차리시오! 찬밥 더운밥 가릴 때가 아니란 말이오!
    ja: |-
      正気を保ってください！
      選り好みをしている時ではありません！
  event_goddessfall2_epilogue_50:
    speaker: nayuta
    en: The Queen hath descended, and she hath seized the body of the strongest Nikke,
      Liliweiss!
    ko: 퀸은 내려왔고, 최강의 니케인 릴리바이스의 몸을 강탈했소!
    ja: |-
      クイーンが地上に戻り、
      最強のニケ、リリーバイスが
      乗っ取られているのですよ！
  event_goddessfall2_epilogue_51:
    speaker: nayuta
    en: Seest thou any prospect of triumph? E'en the slightest chance thereof?
    ko: 승산이 보이시오? 단 1리의 승산이라도 보이시냔 말이오!
    ja: |-
      勝算がありますか？
      万に一つの勝算でも！
  event_goddessfall2_epilogue_52:
    speaker: nayuta
    en: Nay! Thou seest it not!
    ko: 안 보이잖소!
    ja: あるはずもない！
  event_goddessfall2_epilogue_53:
    speaker: nayuta
    en: And yet thou persistest in prating of reclaiming the surface by thine own
      strength. What hubris...!
    ko: 그런 와중에 그대들만으로 지상을 탈환하다니 그 무슨 오만한…!
    ja: |-
      それでも自力で地上を取り戻せると思うなら、
      もはや自惚れです…！
  event_goddessfall2_epilogue_54:
    speaker: nayuta
    en: Hast thy wits been undone by too long a sojourn upon this forsaken land?
    ko: 지상에서 너무 오래 살아 머리가 미쳐버린 것이오?
    ja: |-
      地上で長く過ごしすぎて、
      判断力を失っているのでは？
  event_goddessfall2_epilogue_55:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_56:
    speaker: nayuta
    en: Prithee... behold the truth.
    ko: 제발… 현실을 직시해 주시오.
    ja: どうか…現実に向かい合ってください。
  event_goddessfall2_epilogue_57:
    speaker: nayuta
    en: How can folk of thy stature be thus...
    ko: 그대들 정도 되는 이들이 어찌 이렇게….
    ja: あなた方ほどの器が、なぜこのような…
  event_goddessfall2_epilogue_58:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_59:
    speaker: dorothy
    en: There is a way.
    ko: 방법이 있어요.
    ja: 方法はあります。
  event_goddessfall2_epilogue_60:
    speaker: nayuta
    en: "... Pray... a way to what?"
    ko: "…무슨… 방법 말이오."
    ja: "…どのような…？"
  event_goddessfall2_epilogue_61:
    speaker: dorothy
    en: A method to wield the Ark's power without borrowing it.
    ko: |-
      방주의 힘을 빌리지 않으면서,
      방주의 힘을 이용할 수 있는 방법이.
    ja: |-
      手を借りる必要はありません。
      利用すればいいのです。
  event_goddessfall2_epilogue_62:
    speaker: nayuta
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_goddessfall2_epilogue_63:
    speaker: dorothy
    en: The Ark is currently preparing for the Third Surface Reclamation War.
    ko: 방주는 지금 3차 지상 탈환전을 준비하고 있어요.
    ja: アークは第三次地上奪還戦を計画中です。
  event_goddessfall2_epilogue_64:
    speaker: dorothy
    en: They're enamored with their new technology and have been quietly amassing
      power in secret.
    ko: 신기술에 취해, 비밀리에 힘을 비축하고 있죠.
    ja: |-
      手に入った新技術に目をくらませ、
      密かに力を蓄えています。
  event_goddessfall2_epilogue_65:
    speaker: johan
    en: New technology...?
    ko: 신기술….
    ja: 新技術…
  event_goddessfall2_epilogue_66:
    speaker: dorothy
    en: Yes, Eden's technology.
    ko: 예. 에덴의 기술이죠.
    ja: そうです、エデンからの。
  event_goddessfall2_epilogue_67:
    speaker: cecil
    en: "... So that's why you've been smuggling out data."
    ko: "…자료들을 퍼다 나른 이유가 거기에 있었군요."
    ja: "…漏洩させていた理由は、それですか。"
  event_goddessfall2_epilogue_68:
    speaker: dorothy
    en: I'm fanning the flames.
    ko: 바람을 넣고 있어요.
    ja: 私は風を吹き込んだにすぎません。
  event_goddessfall2_epilogue_69:
    speaker: dorothy
    en: If the Queen is their goal, that makes stoking the fire even easier.
    ko: 퀸이라는 목표가 있다면, 그 바람을 넣는 게 더 수월하겠죠.
    ja: |-
      クイーンという終着点が見えれば、
      きっとますます燃えあがるはずです。
  event_goddessfall2_epilogue_70:
    speaker: dorothy
    en: When the time comes, we'll use that to our advantage.
    ko: 때가 오면, 우린 그걸 이용하면 돼요.
    ja: 時が来たら、私たちはそれを利用するだけ。
  event_goddessfall2_epilogue_71:
    speaker: dorothy
    en: The Ark will pour everything they have into the surface.
    ko: 방주는 모든 힘을 지상에 쏟아부을 테고.
    ja: アークは全力をあげて地上を目指すでしょう。
  event_goddessfall2_epilogue_72:
    speaker: dorothy
    en: And whatever they gain from wasting their strength,
    ko: 그들이 힘을 낭비해서 얻어낸 것을.
    ja: そうして手に入れたものを…
  event_goddessfall2_epilogue_73:
    speaker: dorothy
    en: we can take it from them.
    ko: 우리가 빼앗으면 되는 일이죠.
    ja: 私たちは横からさらえばいいのです。
  event_goddessfall2_epilogue_74:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_75:
    speaker: johan
    en: That is far worse.
    ko: 더 최악이다.
    ja: 余計に悪いな。
  event_goddessfall2_epilogue_76:
    speaker: dorothy
    en: Why?
    ko: 어째서죠?
    ja: なぜですか？
  event_goddessfall2_epilogue_77:
    speaker: johan
    en: That is utterly despicable.
    ko: 너무 지저분하니까.
    ja: 卑劣なやり方だ。
  event_goddessfall2_epilogue_78:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_79:
    speaker: nayuta
    en: Cease thy lamentations. Rather than disparaging each notion, I entreat thee
      to henceforth proffer thine own counsel.
    ko: 싫다 싫다 떼만 쓰지 말고 방법을 제시해 보시오.
    ja: |-
      あくまで拒むと仰るなら、
      代案を聞かせていただきたいところです。
  event_goddessfall2_epilogue_80:
    speaker: nayuta
    en: To charge into a conflict bereft of all hope of triumph doth not, verily,
      constitute a sound stratagem.
    ko: 이대로 승산 없는 싸움을 거는 건 방법이 아니오.
    ja: |-
      勝算のない戦いを続けたい訳では
      ないのでしょう？
  event_goddessfall2_epilogue_81:
    speaker: johan
    en: We will borrow his power.
    ko: 그 녀석의 힘을 빌린다.
    ja: あいつに力を借りる。
  event_goddessfall2_epilogue_82:
    speaker: nayuta
    en: Dost thou speak of the Great Hero?
    ko: 대협을 말하는 것이오?
    ja: "…もしや、旦那の？"
  event_goddessfall2_epilogue_83:
    speaker: johan
    en: Yes.
    ko: 그래.
    ja: そうだ。
  event_goddessfall2_epilogue_84:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_85:
    speaker: nayuta
    en: So it is. I make no objection thereto.
    ko: 좋소. 그것에는 이견이 없소이다.
    ja: 分かりました。反対はしません。
  event_goddessfall2_epilogue_86:
    speaker: nayuta
    en: Yet—
    ko: 단.
    ja: ただし…
  event_goddessfall2_epilogue_87:
    speaker: johan
    en: If he refuses to cooperate, or cooperation is impossible,
    ko: |-
      그 녀석이 협력하지 않는다거나,
      협력할 수 없는 상황이거나.
    ja: |-
      あいつの協力が得られない、
      あるいは協力できない状況の時、
  event_goddessfall2_epilogue_88:
    speaker: johan
    en: or even with his help, there's no chance of victory...
    ko: 협력했음에도 승산이 없을 땐.
    ja: そして、協力を得ても勝算が立たない時。
  event_goddessfall2_epilogue_89:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_90:
    speaker: johan
    en: Then we turn to the Ark for aid.
    ko: 그래. 방주의 힘을 빌린다.
    ja: その時は、アークの力を借りよう。
  event_goddessfall2_epilogue_91:
    speaker: nayuta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goddessfall2_epilogue_92:
    speaker: johan
    en: "... I hate it too."
    ko: "…나도 싫다."
    ja: "…私も嫌いだ。"
  event_goddessfall2_epilogue_93:
    speaker: johan
    en: This hollow world.
    ko: 이 텅 빈 세계는.
    ja: こんな空しい世界は。
  event_goddessfall2_epilogue_94:
    speaker: nayuta
    en: "... Understood. My thanks to thee."
    ko: "…알겠소. 고맙소이다."
    ja: "…分かりました。感謝の念に堪えません。"
  event_goddessfall2_epilogue_95:
    speaker: johan
    en: Make preparations.
    ko: 정비해라.
    ja: 整備に戻れ。
  event_goddessfall2_epilogue_96:
    speaker: johan
    en: I'll be the one to contact him.
    ko: 그 녀석에겐 내가 연락하겠다.
    ja: あいつへの連絡は私がしておく。
  event_goddessfall2_epilogue_97:
    speaker: "<Narration>"
    en: Johan turns around and walks away.
    ko: 요한이 등을 돌리고 걸어간다.
    ja: ヨハンは背を向け、立ち去った
  event_goddessfall2_epilogue_98:
    speaker: dorothy
    en: "... Johan."
    ko: "…요한."
    ja: "…ヨハン。"
  event_goddessfall2_epilogue_99:
    speaker: dorothy
    en: Harran, Isabel, and Noah...
    ko: 하란, 이사벨, 노아는….
    ja: ハランと、イサベルと、ノアは…
  event_goddessfall2_epilogue_100:
    speaker: johan
    en: Dorothy,
    ko: 도로시.
    ja: ドロシー。
  event_goddessfall2_epilogue_101:
    speaker: johan
    en: you are hereby expelled from both Inherit and Eden.
    ko: 너는 인헤르트에서, 에덴에서 제명되었다.
    ja: お前はインヘルト及び、エデンから除名された。
  event_goddessfall2_epilogue_102:
    speaker: johan
    en: You are not to return.
    ko: 다시는 찾아오지 마라.
    ja: 二度と顔を見せるな。
  event_goddessfall2_epilogue_103:
    speaker: dorothy
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_goddessfall2_epilogue_104:
    speaker: johan
    en: Why are you so surprised? If you didn't see this coming,
    ko: |-
      뭘 놀라는 거지.
      예상하지 못했나?
    ja: |-
      何を驚いている。
      予想もできなかったか？
  event_goddessfall2_epilogue_105:
    speaker: johan
    en: you're dumber than I thought.
    ko: 그럼 머릿속이 꽃밭인 거다.
    ja: |-
      それなら、頭の中はそうとうな
      花畑だったようだな。
  event_goddessfall2_epilogue_106:
    speaker: johan
    en: Leave.
    ko: 가라.
    ja: 消えろ。
  event_goddessfall2_epilogue_107:
    speaker: johan
    en: As you said, only the chosen may set foot in paradise.
    ko: 네 말대로, 낙원에는 선택받은 자만 발을 들일 수 있으니까.
    ja: |-
      お前が言った通り、
      楽園の門をくぐれるのは選ばれた者だけだ。
  event_goddessfall2_epilogue_108:
    speaker: papillon
    en: Are they all... going to make it?
    ko: 다들… 살아날 수 있을까?
    ja: みんな…生きられるかしら？
  event_goddessfall2_epilogue_109:
    speaker: chime
    en: Marian, Scarlet, and Rapunzel shall manage somehow, it seemeth.
    ko: 마리안과 홍련, 라푼젤은 어떻게든 할 수 있을 것 같다더구나.
    ja: |-
      マリアンと紅蓮とラプンツェルは
      何とかなりそうなのだ。
  event_goddessfall2_epilogue_110:
    speaker: chime
    en: But... that child Noah...
    ko: 허나… 그 노아라는 아이는….
    ja: しかし…ノアという子は…
  event_goddessfall2_epilogue_111:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_112:
    speaker: chime
    en: Ah, nay. Perchance I heard amiss.
    ko: 아, 아니다. 내가 잘못 들었느니라.
    ja: い、いや。私の聞き間違いだったのだ。
  event_goddessfall2_epilogue_113:
    speaker: chime
    en: "'Tis said all goes smoothly, yea. 'Tis said they shall live."
    ko: 순조롭다고 들었다, 응. 살 수 있다고 들었다.
    ja: みんな順調だと聞いたのだ。助かるはずなのだ。
  event_goddessfall2_epilogue_114:
    speaker: papillon
    en: "... Okay, that's a relief."
    ko: "…그래. 다행이네."
    ja: "…そう。よかった。"
  event_goddessfall2_epilogue_115:
    speaker: chime
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_116:
    speaker: crown
    en: Papillon, was it?
    ko: 파피용이라고 했나요?
    ja: パピヨン、でしたか？
  event_goddessfall2_epilogue_117:
    speaker: papillon
    en: Yes, Crown.
    ko: 그래. 크라운.
    ja: そうよ。
  event_goddessfall2_epilogue_118:
    speaker: crown
    en: May I offer you a cup of tea?
    ko: 차나 한잔하실까요.
    ja: お茶でもいかがでしょう。
  event_goddessfall2_epilogue_119:
    speaker: papillon
    en: "... Tea, is it?"
    ko: "…차?"
    ja: "…お茶？"
  event_goddessfall2_epilogue_120:
    speaker: crown
    en: Yes.
    ko: 예.
    ja: ええ。
  event_goddessfall2_epilogue_121:
    speaker: papillon
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_122:
    speaker: papillon
    en: "... Sure. No point just sitting here twiddling our thumbs. It won't change
      a thing."
    ko: "…그래. 여기 이러고 있어봤자 할 수 있는 것도 없고 달라질 것도 없으니까."
    ja: |-
      …そうね。ここでウジウジしてたって
      何も変わらないわ。
  event_goddessfall2_epilogue_123:
    speaker: papillon
    en: Come on, let's have some tea and a little chat.
    ko: 차나 한잔하면서 수다나 떨자.
    ja: お茶でも飲みながら話しましょ。
  event_goddessfall2_epilogue_124:
    speaker: crown
    en: That would be lovely.
    ko: 좋아요.
    ja: その通りですわ。
  event_goddessfall2_epilogue_125:
    speaker: crown
    en: Kilo, please prepare the picnic set.
    ko: 킬로. 피크닉 세트를 부탁해요.
    ja: キロ、ピクニックセットを。
  event_goddessfall2_epilogue_126:
    speaker: kilo
    en: T.A.L.O.S., could you prepare Picnic Set F?
    ko: 탈로스. 피크닉 세트 F로 부탁해.
    ja: タロス、ピクニックセットFをお願い。
  event_goddessfall2_epilogue_127:
    speaker: talos
    en: Roger, setting up now.
    ko: 라져. 세팅하겠습니다.
    ja: 了解。セットします。
  event_goddessfall2_epilogue_128:
    speaker: papillon
    en: You go around carrying stuff like this?
    ko: 그런 걸 챙기고 다니는 거야?
    ja: そんなもの持ち歩いてるの？
  event_goddessfall2_epilogue_129:
    speaker: kilo
    en: Yes, you never know what might happen.
    ko: 예. 언제 무슨 일이 생길지 모르니까요.
    ja: はい。いつ何が起きるか分からないので。
  event_goddessfall2_epilogue_130:
    speaker: kilo
    en: And there's really nothing better than this to calm your nerves.
    ko: 마음 추스리는 데는 이만한 게 없거든요.
    ja: 心を落ち着かせるには、これが一番なんです。
  event_goddessfall2_epilogue_131:
    speaker: papillon
    en: "... Right."
    ko: "…그래."
    ja: "…そう…"
  event_goddessfall2_epilogue_132:
    speaker: papillon
    en: So the mind is the problem.
    ko: 마음이 문제다. 마음이 문제야.
    ja: 確かに、気持ちの問題ね。
  event_goddessfall2_epilogue_133:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_134:
    speaker: dorothy
    en: So in the end...
    ko: 그래. 결국엔….
    ja: やはり、結局は…
  event_goddessfall2_epilogue_135:
    speaker: snowwhite
    en: Dorothy.
    ko: 도로시.
    ja: ドロシー。
  event_goddessfall2_epilogue_136:
    speaker: dorothy
    en: "... Yes, Snow White?"
    ko: "…스노우 화이트."
    ja: "…スノーホワイト。"
  event_goddessfall2_epilogue_137:
    speaker: snowwhite
    en: Come back.
    ko: 돌아와라.
    ja: 戻ってこい。
  event_goddessfall2_epilogue_138:
    speaker: snowwhite
    en: 'We have a common goal: the Queen.'
    ko: 퀸이라는 공통의 목표가 생겼다.
    ja: クイーンという共通の目標ができた。
  event_goddessfall2_epilogue_139:
    speaker: snowwhite
    en: So stop that disgraceful work, and fight alongside me.
    ko: 그러니 그런 지저분한 짓은 그만두고, 같이 가자.
    ja: もう、そんなことは止めて、一緒に行こう。
  event_goddessfall2_epilogue_140:
    speaker: dorothy
    en: Disgraceful... work?
    ko: 지저분한… 짓이요.
    ja: そんなこと…ですか。
  event_goddessfall2_epilogue_141:
    speaker: dorothy
    en: Do you also think what I'm doing is disgraceful?
    ko: 당신도 제가 하는 일이 지저분하다고 생각하나요?
    ja: |-
      あなたも、私のやっていることが
      卑劣だと思うのですか？
  event_goddessfall2_epilogue_142:
    speaker: dorothy
    en: I'm doing this for all of you...!
    ko: 저는 당신들을 위해…!
    ja: 私は、あなたたちのために…！
  event_goddessfall2_epilogue_143:
    speaker: snowwhite
    en: No, you're doing it for yourself.
    ko: 너를 위해서겠지.
    ja: 自分のためだろう。
  event_goddessfall2_epilogue_144:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_145:
    speaker: snowwhite
    en: We have forgiven them.
    ko: 우리는 용서했다.
    ja: 私たちは赦した。
  event_goddessfall2_epilogue_146:
    speaker: snowwhite
    en: Now it's your turn to forgive.
    ko: 너도 용서해라.
    ja: お前もそうしろ。
  event_goddessfall2_epilogue_147:
    speaker: dorothy
    en: Go ahead and forgive them as much as you like.
    ko: 많이 용서하세요.
    ja: 好きにすればいいでしょう。
  event_goddessfall2_epilogue_148:
    speaker: dorothy
    en: I, however, shan't.
    ko: 저는 싫거든요.
    ja: 私はお断りです。
  event_goddessfall2_epilogue_149:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_150:
    speaker: snowwhite
    en: The Queen...
    ko: 퀸은.
    ja: クイーンは…
  event_goddessfall2_epilogue_151:
    speaker: snowwhite
    en: is defiling one of our own.
    ko: 언니를 모독하고 있다.
    ja: お姉ちゃんを冒涜した。
  event_goddessfall2_epilogue_152:
    speaker: dorothy
    en: What... did you just say?
    ko: 뭐… 라고요?
    ja: 今…なんと？
  event_goddessfall2_epilogue_153:
    speaker: snowwhite
    en: I'll never forgive her for this.
    ko: 절대 용서할 수 없다.
    ja: 赦すことは絶対にできない。
  event_goddessfall2_epilogue_154:
    speaker: snowwhite
    en: Lilith should be sleeping peacefully in her resting place,
    ko: 관 안에서 편히 잠들었어야 할, 언니의 몸을.
    ja: |-
      安らかに眠っているべき、
      お姉ちゃんの身体を…
  event_goddessfall2_epilogue_155:
    speaker: snowwhite
    en: but that monster stole her.
    ko: 놈은 빼앗았다.
    ja: 奴は奪った。
  event_goddessfall2_epilogue_156:
    speaker: dorothy
    en: You... remember...!?
    ko: 당신…! 설마 기억이…!
    ja: スノーホワイト…！まさか、記憶が…！
  event_goddessfall2_epilogue_157:
    speaker: snowwhite
    en: So, Dorothy,
    ko: 그러니 도로시.
    ja: だから、ドロシー。
  event_goddessfall2_epilogue_158:
    speaker: snowwhite
    en: come and fight with me.
    ko: 함께 가자.
    ja: 一緒に行こう。
  event_goddessfall2_epilogue_159:
    speaker: snowwhite
    en: Let's kill the guy
    ko: 릴리바이스라는 세상에서 가장 아름다운 꽃을
    ja: リリーバイスという世界で一番美しい花を
  event_goddessfall2_epilogue_160:
    speaker: snowwhite
    en: who so casually snapped off Lilith,
    ko: 아무렇지도 않게 꺾어버린 그놈을.
    ja: 悪びれもせず踏みにじった奴に…
  event_goddessfall2_epilogue_161:
    speaker: snowwhite
    en: the most beautiful flower in the world.
    ko: 죽이자.
    ja: 報いを。
  event_goddessfall2_epilogue_162:
    speaker: dorothy
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_163:
    speaker: dorothy
    en: There isn't much time left.
    ko: 얼마 남지 않았어요.
    ja: あと少しです。
  event_goddessfall2_epilogue_164:
    speaker: dorothy
    en: Really, not much. So...
    ko: 진짜 얼마 남지 않았으니까, 그러니까.
    ja: 本当に、あと少しなのです。ですから…
  event_goddessfall2_epilogue_165:
    speaker: snowwhite
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_166:
    speaker: snowwhite
    en: You...
    ko: 너는….
    ja: お前は…
  event_goddessfall2_epilogue_167:
    speaker: snowwhite
    en: have changed a lot.
    ko: 정말 많이 변했구나.
    ja: 本当に、変わってしまった。
  event_goddessfall2_epilogue_168:
    speaker: "<Narration>"
    en: Dorothy flies away, disappearing into the air.
    ko: 도로시는 날아갔다.
    ja: ドロシーが飛び去った
  event_goddessfall2_epilogue_169:
    speaker: "<Narration>"
    en: Snow White lingers, staring blankly at her retreating figure
    ko: 스노우 화이트는 그런 도로시의 뒷모습을
    ja: スノーホワイトはドロシーの背中を
  event_goddessfall2_epilogue_170:
    speaker: "<Narration>"
    en: for a long moment.
    ko: 한참 동안 멍하니 바라보았다.
    ja: 呆然と見送った
  event_goddessfall2_epilogue_171:
    speaker: "<Narration>"
    en: 'A sad realization dawns on her:'
    ko: 스노우 화이트는 서글픈 확신이 들었다.
    ja: スノーホワイトは胸に、物悲しい確信を抱いた
  event_goddessfall2_epilogue_172:
    speaker: "<Narration>"
    en: those days are gone, never to return.
    ko: 이제 다시는, 그런 일은 없을 것이라고.
    ja: もう二度と、昔には戻れない
  event_goddessfall2_epilogue_173:
    speaker: "<Narration>"
    en: The once-brilliant past has now completely faded.
    ko: 빛났던 과거는, 이제 완전히 바래버렸다고.
    ja: |-
      輝かしき過去は、
      すっかり色あせてしまったのだと…
  event_goddessfall2_epilogue_174:
    speaker: "<Narration>"
    en: 'GODDESS FALL: END'
    ko: 'GODDESS FALL : END'
    ja: 'GODDESS FALL : END'
  event_goddessfall2_epilogue_175:
    speaker: mirror_r
    en: Something extraordinary has occurred.
    ko: 굉장한 일이 일어나버렸네요.
    ja: 驚きましたね。
  event_goddessfall2_epilogue_176:
    speaker: nayuta
    en: Verily, 'tis even so.
    ko: 소인의 말이 그 말이오.
    ja: 他に言いようがありません。
  event_goddessfall2_epilogue_177:
    speaker: mirror_r
    en: So this is why you were so desperate to get to Liliweiss's body.
    ko: 이래서 그렇게나 릴리스의 바디를 원했던 거군요.
    ja: |-
      だからあれほどまでに
      リリスのボディを望んでいたのですね。
  event_goddessfall2_epilogue_178:
    speaker: mirror_r
    en: I never expected the Vapaus to only destroy the Queen's main body. Considering
      how concentrated it must have been,
    ko: |-
      언체인드가 퀸의 본체만 붕괴시키는 것에 그칠 줄은 몰랐어요.
      농도가 엄청 진했을 텐데도.
    ja: |-
      クイーンの本体だけが崩壊するなんて…
      アンチェインドの濃度は十分以上だったはず。
  event_goddessfall2_epilogue_179:
    speaker: mirror_r
    en: it must be because her physical body was truly, in every sense, a monster.
    ko: 퀸의 본체가 진짜 말 그대로 괴물이었던 탓이겠죠.
    ja: |-
      古いボディのままでも、
      かなりの規格外だったということでしょう。
  event_goddessfall2_epilogue_180:
    speaker: mirror_r
    en: "... *Sigh* Who would've thought the lie I told Chatterbox would actually
      come true... I really didn't see this coming."
    ko: |-
      …하아. 토커티브한테 했던 거짓말이 진짜가 될 줄이야….
      이건 정말 예상 못 했어요.
    ja: |-
      …それにしても…
      トーカティブに言ったことが現実になるとは、
      思いもよりませんでした。
  event_goddessfall2_epilogue_181:
    speaker: nayuta
    en: Verily, this may give rise unto other unforeseen events as well.
    ko: 그로 인해 다른 예상 못 할 일이 생겨날 수도 있는 일이요.
    ja: |-
      今回の事態が別の予期せぬ連鎖を
      引き起こすかもしれません。
  event_goddessfall2_epilogue_182:
    speaker: mirror_r
    en: I do hope so.
    ko: 그랬으면 좋겠네요.
    ja: その方が望ましいです。
  event_goddessfall2_epilogue_183:
    speaker: janghwa_n
    en: What about Scarlet?
    ko: 련이는?
    ja: レンは？
  event_goddessfall2_epilogue_184:
    speaker: nayuta
    en: She doth not fare exceedingly well.
    ko: 상태가 가장 좋지 않소.
    ja: ひどい状態です。
  event_goddessfall2_epilogue_185:
    speaker: nayuta
    en: "'Tis said she must needs be remade from the very foundations."
    ko: 처음부터 새로 만들어야 하는 수준이라 하더이다.
    ja: ほぼ作り直しと変わらないとか。
  event_goddessfall2_epilogue_186:
    speaker: janghwa_n
    en: From scratch? What happens then?
    ko: 처음부터? 그럼 어떻게 되는 건데.
    ja: 作り直し？じゃあ、どうなるの？
  event_goddessfall2_epilogue_187:
    speaker: janghwa_n
    en: Will her memories be intact? Will—
    ko: 기억은? 기억은 그대로 유지될 수 있
    ja: 記憶は？記憶は残って――
  event_goddessfall2_epilogue_188:
    speaker: "<Narration>"
    en: Rose's body goes limp, like a puppet with severed strings.
    ko: 장화의 몸이 실이 끊어진 인형처럼 축 늘어졌다.
    ja: |-
      薔花の体が、糸の切れた人形のように
      力なく崩れ落ちた
  event_goddessfall2_epilogue_189:
    speaker: mirror_r
    en: Really now... Why interrupt an important discussion?
    ko: |-
      정말….
      중요한 얘기 중인데 끼어들면 어떡하나요.
    ja: |-
      いけませんね…
      大事な話に割り込まないでください。
  event_goddessfall2_epilogue_190:
    speaker: mirror_r
    en: This is precisely why having too strong a sense of self can be a problem.
    ko: 이래서 자아가 너무 강해도 문제라니까요.
    ja: 自我が強すぎるのも善し悪しですね。
  event_goddessfall2_epilogue_191:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_192:
    speaker: mirror_r
    en: What about Marian?
    ko: 그래서, 마리안은요?
    ja: それで、マリアンは？
  event_goddessfall2_epilogue_193:
    speaker: nayuta
    en: It doth appear that she may indeed be sustained by the affixing of a pseudo-core.
    ko: 유사 코어를 붙이는 식으로 어떻게든 될 것 같소.
    ja: 疑似的なコアを使う形でどうにかできそうです。
  event_goddessfall2_epilogue_194:
    speaker: nayuta
    en: Yet, since 'tis not her proper core, its vigour shall not be infinite, nor
      her output without bounds.
    ko: |-
      물론 원래의 코어가 아닌 만큼,
      무한 동력도 아니고 출력에도 한계가 있겠지.
    ja: |-
      当然、本来のコアではありませんので
      出力は大きく制限されるでしょう。
  event_goddessfall2_epilogue_195:
    speaker: nayuta
    en: "... Verily, 'tis more a measure to clutch at the thread of her life than
      aught else."
    ko: "…명줄 붙잡기 용이오."
    ja: "…死んではいない、というだけです。"
  event_goddessfall2_epilogue_196:
    speaker: mirror_r
    en: Thank goodness, her brain remains intact. Some Queen Gene may yet remain.
    ko: |-
      그래도 다행히 뇌를 뜯기지는 않았어요.
      퀸 인자가 남아있긴 하네요.
    ja: |-
      脳が無事だったことは幸いです。
      クイーン因子も残っているようですね。
  event_goddessfall2_epilogue_197:
    speaker: nayuta
    en: Verily, the Queen hath absorbed Young Lady Marian's Queen Gene.
    ko: 퀸이, 마리안 소저의 인자를 흡수한 상태요.
    ja: 因子を吸収されてしまいました。
  event_goddessfall2_epilogue_198:
    speaker: nayuta
    en: Her dominion as a Queen is now beyond all compare.
    ko: 퀸으로서의 지배력은 이제 비교가 불가한 수준이외다.
    ja: |-
      クイーンとしての支配の影響力は、
      もはや比較にもなりません。
  event_goddessfall2_epilogue_199:
    speaker: mirror_r
    en: The Queen Gene isn't entirely gone, is it? Then something can still be done.
    ko: |-
      인자의 잔량이 0은 아니잖아요.
      그럼 어떻게든 할 수 있겠죠.
    ja: |-
      残ってはいるのでしょう？
      でしたら、どうとでもなります。
  event_goddessfall2_epilogue_200:
    speaker: mirror_r
    en: Of course, that "something" is a problem for you to solve.
    ko: 물론, 그 어떻게든은 당신들이 해결해야 할 숙제겠지만요.
    ja: |-
      無論、どうとでもする方法は
      あなたたちの課題になりますが。
  event_goddessfall2_epilogue_201:
    speaker: mirror_r
    en: But really, how do you plan on dealing with this?
    ko: 근데 진짜 어떻게 할 생각인가요?
    ja: |-
      それはさておき、
      本当にこれからどうするのですか？
  event_goddessfall2_epilogue_202:
    speaker: mirror_r
    en: The Queen, who now has the body of the strongest Nikke, Liliweiss...
    ko: 최강의 니케 릴리바이스의 바디를 가진 퀸….
    ja: |-
      最強のニケ、リリーバイスの
      ボディを持つクイーン。
  event_goddessfall2_epilogue_203:
    speaker: mirror_r
    en: How do you intend to defeat her?
    ko: 당신들은, 그것을 상대로 어떻게 이길 생각인가요?
    ja: 戦うつもりなのでしょう？勝算は？
  event_goddessfall2_epilogue_204:
    speaker: nayuta
    en: "... This I do ponder."
    ko: "…생각 중이오."
    ja: "…検討中です。"
  event_goddessfall2_epilogue_205:
    speaker: mirror_r
    en: You really should think things through—
    ko: 많이 생각하셔야 할 거예요.
    ja: 存分に悩んでください。
  event_goddessfall2_epilogue_206:
    speaker: mirror_r
    en: carefully, patiently, until you're absolutely sure.
    ko: 정말 많이, 신중하게, 그리고 확실하게 생각하셔야 해요.
    ja: |-
      悩み抜いて、慎重に、
      確実な手を打つ必要がありますよ。
  event_goddessfall2_epilogue_207:
    speaker: mirror_r
    en: As for me... heh,
    ko: 저는… 후후.
    ja: 私は…ふふ…
  event_goddessfall2_epilogue_208:
    speaker: mirror_r
    en: I can return to the Queen anytime...
    ko: 아무렇지도 않게, 퀸에게, 언제든.
    ja: |-
      何事もなかったフリをして、
      クイーンのひざ元に…
  event_goddessfall2_epilogue_209:
    speaker: mirror_r
    en: as if nothing happened.
    ko: 돌아갈 수 있거든요.
    ja: いつでも帰ることができますから。
  event_goddessfall2_epilogue_210:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_211:
    speaker: mirror_r
    en: If I see that Marian has no chance, then I suppose I must.
    ko: 마리안에게 승산이 보이지 않는다면, 그래야겠죠.
    ja: |-
      マリアンの勝算が立たなければ、
      そうするしかありません。
  event_goddessfall2_epilogue_212:
    speaker: nayuta
    en: If that be so, would it not be wise to dissolve the alliance forthwith?
    ko: 그럴 거면 지금 동맹을 파기하는 게 좋지 않겠소?
    ja: |-
      そのつもりなら、ここで我々の関係を
      終わりとした方がよいのでは？
  event_goddessfall2_epilogue_213:
    speaker: nayuta
    en: Verily, I discern that no further advantage may be had from thee henceforth.
    ko: 솔직히 말하자면, 이제부턴 미러 소저의 덕을 볼 수 있을 것이라는 생각이 들지 않는구려.
    ja: |-
      正直に言えば、今後のことを考えると
      互いに利益があるとは思えないのです。
  event_goddessfall2_epilogue_214:
    speaker: mirror_r
    en: Oh my, I suppose you're right.
    ko: 어머. 그렇네요.
    ja: 言われてみると、もっともですね。
  event_goddessfall2_epilogue_215:
    speaker: nayuta
    en: I have a proposition, verily.
    ko: 제안이 있소.
    ja: ひとつ提案があります。
  event_goddessfall2_epilogue_216:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_217:
    speaker: mirror_r
    en: All right. Given the circumstances, that does seem like our best chance.
    ko: 좋아요. 지금 상황에서는 그게 가장 승산이 높겠네요.
    ja: |-
      いいでしょう。
      今の状況では、一番見込みがありそうです。
  event_goddessfall2_epilogue_218:
    speaker: nayuta
    en: "'Tis fortunate thou art quick of perception."
    ko: 눈치가 빨라 다행이오.
    ja: 話が早くて助かります。
  event_goddessfall2_epilogue_219:
    speaker: mirror_r
    en: I'll stay close to the Queen
    ko: 퀸에게 붙을게요.
    ja: 私はクイーンのもとへ向かいます。
  event_goddessfall2_epilogue_220:
    speaker: mirror_r
    en: and send you the latest intel as it comes in, so be sure to make good use
      of it.
    ko: 최신 정보를 바로바로 전달해 드릴 테니 잘 받아먹으세요.
    ja: |-
      最新情報を適宜お届けしますから、
      有効に活用してください。
  event_goddessfall2_epilogue_221:
    speaker: mirror_r
    en: Oh, right. You don't have any clones left, right? You obliterated them all.
    ko: 아. 당신 이제 분신 없죠? 다 태웠잖아요.
    ja: |-
      あら、そういえばもう分身がいませんね？
      すべて使い切ってしまったはず。
  event_goddessfall2_epilogue_222:
    speaker: mirror_r
    en: Then how am I supposed to deliver this top-grade intel to you?
    ko: 그럼 최신의 고급 정보를 어떻게 전달하죠?
    ja: 情報はどう伝えればいいでしょう？
  event_goddessfall2_epilogue_223:
    speaker: nayuta
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_224:
    speaker: mirror_r
    en: "..."
    ko: "……."
    ja: "……"
  event_goddessfall2_epilogue_225:
    speaker: mirror_r
    en: You still have some left, don't you?
    ko: 아직 남아있군요?
    ja: まだ残していたのですね？
  event_goddessfall2_epilogue_226:
    speaker: nayuta
    en: So it is.
    ko: 그렇소.
    ja: よくお分かりで。
  event_goddessfall2_epilogue_227:
    speaker: mirror_r
    en: How many?
    ko: 얼마나?
    ja: どれほどですか？
  event_goddessfall2_epilogue_228:
    speaker: nayuta
    en: Ever shall I remain beside thee, so let thy mind be untroubled.
    ko: 언제나 소저 주위에 있을 테니 그건 신경 쓰지 마시오.
    ja: |-
      常にあなたの近くにいるようにしますので、
      ご心配なく。
  event_goddessfall2_epilogue_229:
    speaker: mirror_r
    en: Haha, just how many of these did you make?
    ko: 후후. 대체 얼마나 찍어냈던 건가요?
    ja: ふふ…いったいどれだけ増やしたのでしょう？
  event_goddessfall2_epilogue_230:
    speaker: mirror_r
    en: All right then, time to get moving.
    ko: 좋아요. 그럼 슬슬 움직여볼게요.
    ja: ともあれ…話はまとまりました。
  event_goddessfall2_epilogue_231:
    speaker: mirror_r
    en: Let's give it everything we've got
    ko: 서로서로 힘내자고요.
    ja: お互い、力を尽くしましょう。
  event_goddessfall2_epilogue_232:
    speaker: mirror_r
    en: for our Queen.
    ko: 우리의 [퀸]을 위해.
    ja: 私たちの「クイーン」のために。
