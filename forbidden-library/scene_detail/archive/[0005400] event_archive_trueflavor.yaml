    speaker: crust
    en: She mentioned how Bready looked unhappy.
    ko: 브래디가 불행한 표정을 지었다고.
    ja: ブレッディが悲しそうな顔をしていたと。
  event_trueflavor_05_s_56:
    speaker: crust
    en: She questioned whether I was really making these dishes for Bready.
    ko: 정말 브래디를 위해서 만드는 것이 맞냐고 말이에요.
    ja: 本当にブレッディのために作ったのか、と…
  event_trueflavor_05_s_57:
    speaker: crust
    en: I don't understand it.
    ko: 어째서….
    ja: どうして…
  event_trueflavor_05_s_58:
    speaker: crust
