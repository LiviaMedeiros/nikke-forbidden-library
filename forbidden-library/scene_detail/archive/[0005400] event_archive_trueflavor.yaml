    ja: |-
      クラストは食べやすくカットしたステーキを
      フォークで刺し、ブレッディの口元へ運んだ
  event_trueflavor_06_e_51:
    speaker: "<Narration>"
    en: "*Shake shake shake*"
    ko: 덜덜덜-
    ja: ガタガタガタ…
  event_trueflavor_06_e_52:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_53:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_54:
    speaker: bready
    en: I asked you to sit in front of me to ease your nerves,
    ko: 긴장을 풀어주려고 앞에 앉힌 건데.
    ja: |-
      緊張をほぐしてもらいたくて、
      前に座らせたのに…
  event_trueflavor_06_e_55:
    speaker: bready
    en: but apparently, all I did was make you more nervous.
    ko: 더 긴장하게 만들어버렸네.
    ja: 余計緊張させちゃったわね。
  event_trueflavor_06_e_56:
    speaker: crust
    en: I-I guess it can't be helped.
    ko: 어, 어쩔 수 없지.
    ja: し、仕方ないよっ。
  event_trueflavor_06_e_57:
    speaker: crust
    en: Being judged always makes you nervous.
    ko: 평가를 당하는 건 언제나 긴장되니까아….
    ja: 評価されるのって、毎回緊張するから…
  event_trueflavor_06_e_58:
    speaker: crust
    en: Phew...phoo...
    ko: 후! 하! 후! 하!
    ja: すー！はー！すー！はー！
  event_trueflavor_06_e_59:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_60:
    speaker: bready
    en: Well, I'll dig in.
    ko: 잘 먹을게.
    ja: いただきます。
  event_trueflavor_06_e_61:
    speaker: bready
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_06_e_62:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_63:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_64:
    speaker: crust
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクリ――
  event_trueflavor_06_e_65:
    speaker: crust
    en: H-how is it?
    ko: 어, 어, 어때…?
    ja: ど、ど、どう…？
  event_trueflavor_06_e_66:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_67:
    speaker: bready
    en: Hahaha!
    ko: "…아핫!"
    ja: "…あはっ！"
  event_trueflavor_06_e_68:
    speaker: bready
    en: I was going to try and hide it for a while, but I can't help it.
    ko: 마지막까지 숨기려고 했는데, 안 되겠네.
    ja: |-
      最後まで隠し通そうと思ったんだけど、
      やっぱりダメね。
  event_trueflavor_06_e_69:
    speaker: crust
    en: Huh?
    ko: 으응…?
    ja: えっ…？
  event_trueflavor_06_e_70:
    speaker: bready
    en: It's as I expected. The taste of your cooking hasn't changed.
    ko: 역시, 크러스트가 해준 음식의 맛은 바뀌지 않아.
    ja: |-
      クラストが作ってくれた料理の味は
      変わらないわ。
  event_trueflavor_06_e_71:
    speaker: bready
    en: It's delicious, adorable, and makes me happy.
    ko: 맛있고, 귀엽고, 행복한 맛이야.
    ja: おいしくて、かわいくて、幸せな味よ。
  event_trueflavor_06_e_72:
    speaker: bready
    en: I missed it.
    ko: 그리웠어.
    ja: 恋しかったわ。
  event_trueflavor_06_e_73:
    speaker: bready
    en: That's why I was eager for you to be done with all this silly research business.
    ko: 그래서 빨리 연구가 끝나길 기다리고 있었는데.
    ja: だから、早く研究が終わってほしかった。
  event_trueflavor_06_e_74:
    speaker: bready
    en: Now that I know you were doing that for me...
    ko: 그 연구가 나를 위한 거였다니, 너도 참.
    ja: |-
      でもまさか、
      その研究が私のためだったなんてね。
  event_trueflavor_06_e_75:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_76:
    speaker: crust
    en: D-delicious? Adorable?
    ko: 마, 맛있어…? 귀여워…?
    ja: お、おいしい…？かわいい…？
  event_trueflavor_06_e_77:
    speaker: crust
    en: And did you say... you're happy?
    ko: 해, 행복해 브래디?
    ja: し、幸せなの？ブレッディ？
  event_trueflavor_06_e_78:
    speaker: bready
    en: I am.
    ko: 응.
    ja: うん。
  event_trueflavor_06_e_79:
    speaker: bready
    en: I'm always happy whenever I get to eat your food.
    ko: 난, 크러스트의 음식을 먹을 때마다 행복했어.
    ja: |-
      私はクラストの料理を食べるたびに、
      幸せだった。
  event_trueflavor_06_e_80:
    speaker: bready
    en: The fact that you cooked with so much joy always piqued my curiosity.
    ko: 어떻게 매번 이렇게 즐겁게 요리를 할 수 있을까, 늘 궁금했고.
    ja: |-
      なんでいつも、こんなに楽しく
      料理ができるんだろうって
      ずっと気になってたわ。
  event_trueflavor_06_e_81:
    speaker: bready
    en: But today, you planned out this entire meal for me, invitation and all.
    ko: 그런데 오늘은 나만을 위한 초대장, 시간, 요리를 만들어줬잖아.
    ja: |-
      でも今日は私だけの招待状と、時間と、
      料理を作ってくれたでしょ？
  event_trueflavor_06_e_82:
    speaker: bready
    en: That makes me even more happy.
    ko: 더 행복해.
    ja: だからいつも以上に、幸せだったわ。
  event_trueflavor_06_e_83:
    speaker: crust
    en: Oh my gosh...
    ko: 으….
    ja: う…
  event_trueflavor_06_e_84:
    speaker: crust
    en: "..."
    ko: 으으으….
    ja: うぅぅ…！
  event_trueflavor_06_e_85:
    speaker: crust
    en: I-I'm sorry.
    ko: 미, 미안해애….
    ja: ごめんね…
  event_trueflavor_06_e_86:
    speaker: crust
    en: For making you eat all that terrible food.
    ko: 맛없는 음식 먹여서 미안해….
    ja: おいしくない料理を食べさせて…
  event_trueflavor_06_e_87:
    speaker: crust
    en: For making you feel so unhappy.
    ko: 불행한 표정 짓게 만들어서 미안해애….
    ja: 悲しそうな顔までさせちゃって…
  event_trueflavor_06_e_88:
    speaker: crust
    en: For being so greedy.
    ko: 욕심부려서 미안해…!
    ja: 意地張って、ごめんなさい…！
  event_trueflavor_06_e_89:
    speaker: crust
    en: You've always had such a happy expression on your face, and I...
    ko: 브래디는 언제나 행복한 표정을 지어줬는데에에…!
    ja: |-
      ブレッディはいつも、
      幸せそうだったのにぃ…！
  event_trueflavor_06_e_90:
    speaker: crust
    en: "*Sob*"
    ko: 크흡…! 끄흑…!
    ja: ううっ…！うぇぇん…！
  event_trueflavor_06_e_91:
    speaker: crust
    en: I had no idea! And I did all of these ridiculous things...
    ko: |-
      나, 나는 그것도 모르고오…! 끄윽…!
      이상한 짓들이나 하고오…!
    ja: |-
      ブ、ブレッディの気も知らないで…！ううっ…！
      私、おかしなことばっかりしちゃって…！
  event_trueflavor_06_e_92:
    speaker: crust
    en: You must have been so disappointed in me.
    ko: 나, 나한테 실망하진 않았어…?
    ja: が、がっかりしなかった…？
  event_trueflavor_06_e_93:
    speaker: bready
    en: How could I be disappointed in someone who just wanted to make me happy?
    ko: 나를 행복하게 만들어주고 싶었다는 사람에게 어떻게 실망을 해.
    ja: |-
      私を幸せにしたいって人に対して、
      がっかりするはずないでしょ？
  event_trueflavor_06_e_94:
    speaker: bready
    en: But next time you start feeling this way, please let me know.
    ko: 하지만 이런 일이 있으면 다음부터는 꼭 직접 말해줘.
    ja: でも、次は必ず相談してね。
  event_trueflavor_06_e_95:
    speaker: bready
    en: Don't launch off into your own research. We can work our way through it together.
    ko: 혼자 연구하지 말고, 같이 연구하자.
    ja: 1人で研究しないで、一緒にしましょ。
  event_trueflavor_06_e_96:
    speaker: crust
    en: Y-yeah... *sniff*...
    ko: 응…! 으응…! 쿨쩍!
    ja: うん…！うんっ…！ずびっ！
  event_trueflavor_06_e_97:
    speaker: bready
    en: Also, don't forget.
    ko: 그리고.
    ja: それから…
  event_trueflavor_06_e_98:
    speaker: bready
    en: Your research was a success.
    ko: 연구는 성공이야.
    ja: 研究は成功よ。
  event_trueflavor_06_e_99:
    speaker: crust
    en: I-it was?
    ko: 서, 성공…?
    ja: せ、成功…？
  event_trueflavor_06_e_100:
    speaker: bready
    en: Yes.
    ko: 응.
    ja: うん。
  event_trueflavor_06_e_101:
    speaker: bready
    en: You cooked a dish that made me happy.
    ko: 내가 행복하게 먹을 수 있는 음식을 만들었잖아.
    ja: |-
      私が幸せに食べられる料理を
      作ったでしょ？
  event_trueflavor_06_e_102:
    speaker: bready
    en: If I were to grade this dish, I'd give it a perfect score.
    ko: 이 음식의 점수는 만점이야.
    ja: この料理は満点よ。
  event_trueflavor_06_e_103:
    speaker: bready
    en: You worked hard, Crust.
    ko: 고생 많았어, 크러스트.
    ja: お疲れ様、クラスト。
  event_trueflavor_06_e_104:
    speaker: crust
    en: "...!"
    ko: "……!!!"
    ja: "……！！！"
  event_trueflavor_06_e_105:
    speaker: crust
    en: I'm so glad to hear that!
    ko: 다, 다행이다…!
    ja: よ、よかった…！
  event_trueflavor_06_e_106:
    speaker: crust
    en: Hehe... Hehehe.
    ko: 헤, 헤헤… 헤헤헤.
    ja: え、へへ…えへへ…
  event_trueflavor_06_e_107:
    speaker: bready
    en: Why are you laughing suddenly?
    ko: 갑자기 왜 웃어?
    ja: どうして笑うの？
  event_trueflavor_06_e_108:
    speaker: crust
    en: I'm... I'm just so happy!
    ko: 헤헤… 그냥, 행복해서~ 헤헤헤.
    ja: えへへ…ただ、幸せで…
  event_trueflavor_06_e_109:
    speaker: crust
    en: I can't stop laughing, hehehe.
    ko: 계속 웃음이 나와, 헤헤헤.
    ja: 笑いが止まらないの。えへへ…
  event_trueflavor_06_e_110:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_111:
    speaker: bready
    en: Good.
    ko: 그렇네.
    ja: そうね。
  event_trueflavor_06_e_112:
    speaker: bready
    en: Thanks for letting me taste something made from the heart.
    ko: 진심이 담긴 맛을 느끼게 해줘서, 고마워.
    ja: |-
      真心がこもった味を感じさせてくれて、
      ありがとう。
  event_trueflavor_06_e_113:
    speaker: bready
    en: The flavor of this is one I won't ever forget.
    ko: 이것 또한 잊을 수 없는 맛이 될 것 같아.
    ja: これも忘れられない味になりそうよ。
  event_trueflavor_06_e_114:
    speaker: bready
    en: Now, am I allowed back in the kitchen?
    ko: 나, 이제 주방에 편하게 와도 되는 거지?
    ja: もう気軽にキッチンに来てもいいんでしょ？
  event_trueflavor_06_e_115:
    speaker: crust
    en: Yes, yes! Now that the research is over!
    ko: 응! 연구는 끝났으니까!
    ja: うん！研究は終わったから！
  event_trueflavor_06_e_116:
    speaker: bready
    en: 'I am curious though:'
    ko: 그런데, 연구를 어떤 식으로 진행했던 거야?
    ja: ところで、どんなふうに研究を進めてたの？
  event_trueflavor_06_e_117:
    speaker: bready
    en: How exactly did you conduct your research?
    ko: 궁금해.
    ja: 気になるわ。
  event_trueflavor_06_e_118:
    speaker: crust
    en: I thought that if I used Mr. Gourmand, maybe I could make food that tasted
      like him.
    ko: |-
      음, 미식가님을 이용하면
      미식가님 맛이 나는 음식을 만들 수 있지 않을까- 싶어서.
    ja: |-
      えっと、グルメ様を利用すれば、
      グルメ様の味がする料理を
      作れるんじゃないかと思って…
  event_trueflavor_06_e_119:
    speaker: crust
    en: He rubbed his hands on the food, and I even had him put in some of his hair.
    ko: 음식을 손으로 문질러도 보고, 머리카락도 넣어보고 그랬어.
    ja: |-
      料理を指でこすっていただいたり、
      髪の毛を入れたりしてみたの。
  event_trueflavor_06_e_120:
    speaker: bready
    en: Hmm...
    ko: 음.
    ja: ふぅん…
  event_trueflavor_06_e_121:
    speaker: bready
    en: That's not a bad approach, actually.
    ko: 나쁘지 않은 접근인데?
    ja: 悪くないアプローチね。
  event_trueflavor_06_e_122:
    speaker: crust
    en: I thought so!
    ko: 그치?!
    ja: でしょ！？
  event_trueflavor_06_e_123:
    speaker: "<Self>"
    en: What the...?!
    ko: 뭐?
    ja: 何だって？
  event_trueflavor_06_e_124:
    speaker: bready
    en: Instead of hair, how about collecting some saliva or sweat?
    ko: 머리카락이 아니라, 침이나 땀 같은 걸 모아보는 건?
    ja: 髪の毛じゃなくて、ツバや汗はどう？
  event_trueflavor_06_e_125:
    speaker: crust
    en: Darn, I didn't think that far.
    ko: 거기까지는 생각 못 했어.
    ja: わあ、そこまでは思いつかなかったよ…！
  event_trueflavor_06_e_126:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_trueflavor_06_e_127:
    speaker: "<Monologue>"
    en: Crust and Bready quietly stare at me.
    ko: 두 사람이 조용히 나를 쳐다본다.
    ja: 2人はゆっくりと私のほうに顔を向けた
  event_trueflavor_06_e_128:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_trueflavor_06_e_129:
    speaker: "<Monologue>"
    en: It seems like the cooking research will continue for a while yet.
    ko: 당분간 주방에서의 요리 연구는 계속될 듯하다.
    ja: |-
      もうしばらく、
      キッチンでの料理研究は続きそうだ
  event_trueflavor_06_e_130:
    speaker: "<Monologue>"
    en: Although no one knows whether it will succeed.
    ko: 성공할 수 있을지 없을지는 모르겠지만.
    ja: 成功するかどうかは分からないが…
  event_trueflavor_06_e_131:
    speaker: "<Monologue>"
    en: That process itself will become a vital factor towards determining the flavors
      they create.
    ko: |-
      그 과정조차 그들에게는
      맛을 내는 재료로 사용될 것이다.
    ja: |-
      その過程さえ、彼女たちにとっては
      いい素材となるだろう
  event_trueflavor_06_e_132:
    speaker: "<Monologue>"
    en: After all, the two most indispensable culinary ingredients are sincerity and
      happiness.
    ko: 진심과 행복이라는 음식의 재료가.
    ja: 真心も幸せも、立派な料理の素材になるのだから
  event_trueflavor_06_e_133:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_06_e_134:
    speaker: "<Monologue>"
    en: Although I might not have such a fun time, personally.
    ko: 나는 조금 불행할지도 모르겠지만 말이다.
    ja: 私は少し、不幸になるかもしれないが…
event_trueflavor_epilogue:
  event_trueflavor_epilogue_1:
    speaker: "<Narration>"
    en: "*Ding Dong Dang Dong*"
    ko: 딩- 동- 댕- 동-
    ja: キーンコーンカーンコーン――
  event_trueflavor_epilogue_2:
    speaker: crust
    en: Hello, students!
    ko: 안녕하세요, 학생 여러분!
    ja: みなさん、こんにちは！
  event_trueflavor_epilogue_3:
    speaker: crust
    en: I'm Crust from the Cooking Oil Squad, and I'll be your instructor for today.
    ko: |-
      오늘 특별 수업을 맡게 된
      쿠킹오일 스쿼드의 크러스트입니다!
    ja: |-
      今日の特別授業を担当する
      クッキングオイル所属のクラストです！
  event_trueflavor_epilogue_4:
    speaker: crust
    en: It's been a long time since I saw you last.
    ko: 오랜만이에요~!
    ja: お久しぶりです～！
  event_trueflavor_epilogue_5:
    speaker: students
    en: Hello, Miss Crust!
    ko: 와아아~!
    ja: わあ～！
  event_trueflavor_epilogue_6:
    speaker: crust
    en: And this is Bready.
    ko: 그리고 여기는~
    ja: そして、こちらは～
  event_trueflavor_epilogue_7:
    speaker: crust
    en: She'll be the one tasting your dishes.
    ko: 여러분들이 만든 음식을 맛봐줄 시식 담당, 브래디예요!
    ja: |-
      みなさんが作った料理の試食を担当する、
      ブレッディです！
  event_trueflavor_epilogue_8:
    speaker: bready
    en: Hello.
    ko: 안녕.
    ja: こんにちは。
  event_trueflavor_epilogue_9:
    speaker: bready
    en: I'm Bready, and I'm also part of Cooking Oil.
    ko: 쿠킹오일의 브래디야.
    ja: クッキングオイルのブレッディよ。
  event_trueflavor_epilogue_10:
    speaker: students
    en: Hello, Miss Bready!
    ko: 안녕하세요~!
    ja: こんにちは～！
  event_trueflavor_epilogue_11:
    speaker: crust
    en: Today, we'll learn how to make delicious meals using ostensibly flavorless
      combat rations.
    ko: |-
      오늘은, 맛없는 전투 식량을 이용해
      맛있는 음식을 만드는 법을 배울 거예요.
    ja: |-
      今日は味がイマイチな戦闘糧食を
      おいしくアレンジする方法を教えます。
  event_trueflavor_epilogue_12:
    speaker: crust
    en: 'I already know what you''re thinking: Why bother learning a recipe when we
      can just eat the rations as is?'
    ko: 전투 식량을 먹으면 되는데 왜 굳이 이런 걸 배우냐!
    ja: |-
      わざわざ面倒なことをしないで、
      普通に戦闘糧食を食べればいいって
      思うかもしれませんが…
  event_trueflavor_epilogue_13:
    speaker: crust
    en: 'And the answer is: Wouldn''t it be better if they tasted good? Hehe.'
    ko: 맛있으면 좋잖아요~? 헤헤.
    ja: やっぱりおいしい方がいいですよね～？えへへ。
  event_trueflavor_epilogue_14:
    speaker: ein
    en: That's a good point. If you were deployed on the surface for a month and had
      to eat those rations the entire time,
    ko: |-
      하긴. 지상에 한 달 올라갔는데,
      매일 전투 식량만 먹으라고 하면….
    ja: |-
      確かに。1ヶ月地上に行くとして、
      戦闘糧食だけを食べ続けろって言われたら…
  event_trueflavor_epilogue_15:
    speaker: ein
    en: I'd go out of my mind!
    ko: 우웩, 진짜 싫을 듯요.
    ja: うげ～っ、マジうんざりです…
  event_trueflavor_epilogue_16:
    speaker: rei
    en: Me too.
    ko: 맞아!
    ja: うんうん！
  event_trueflavor_epilogue_17:
    speaker: rei
    en: Then can you make a parfait with combat rations?
    ko: 그럼 전투 식량으로 파르페도 만들 수 있을까?
    ja: えへへ、戦闘糧食でパフェも作れるのかな？
  event_trueflavor_epilogue_18:
    speaker: ein
    en: You dork, of course that's not possible.
    ko: 있겠냐고요.
    ja: それはムリですよ～
  event_trueflavor_epilogue_19:
    speaker: tia
    en: I'm not a big fan of combat rations either.
    ko: 나도 전투 식량은 별로야아.
    ja: 私も戦闘糧食はあんまり好きじゃないかもぉ～
  event_trueflavor_epilogue_20:
    speaker: tia
    en: None of them are sweet in the slightest.
    ko: 달콤한 맛이 없잖아~
    ja: だって、甘くないんだもん～
  event_trueflavor_epilogue_21:
    speaker: naga
    en: I don't think they're that bad,
    ko: 난 나쁘지는 않지만.
    ja: そう？私はそこまで嫌いじゃないけど。
  event_trueflavor_epilogue_22:
    speaker: naga
    en: but if there's a way to make them tastier, I certainly wouldn't complain.
    ko: 더 맛있게 먹는 법이 있다면, 그렇게 먹는 게 좋지.
    ja: |-
      でも、もっとおいしく食べられる方法があるなら
      そっちの方がいいよね。
  event_trueflavor_epilogue_23:
    speaker: crust
    en: Let me show you an example first. Just do exactly as I do.
    ko: 제가 시범을 보여드릴 테니~ 똑같이 따라 해 주세요!
    ja: |-
      では、私がお手本を見せるので
      同じようにマネしてくださいね！
  event_trueflavor_epilogue_24:
    speaker: students
    en: Yes, Miss Crust.
    ko: 네에에~
    ja: はぁ～い！
  event_trueflavor_epilogue_25:
    speaker: rei
    en: I'm done!
    ko: 다 만들었어!
    ja: できたー！
  event_trueflavor_epilogue_26:
    speaker: rei
    en: I knew you'd be quick, Naru.
    ko: 역시 나루야, 빨라빨라.
    ja: さすがナル、手際いいね。
  event_trueflavor_epilogue_27:
    speaker: bready
    en: May I taste it?
    ko: 그럼, 맛을 볼까?
    ja: じゃあ、味見するわね。
  event_trueflavor_epilogue_28:
    speaker: rei
    en: Of course! Enjoy.
    ko: 응! 맛있게 먹어~!
    ja: うん！召し上がれ～！
  event_trueflavor_epilogue_29:
    speaker: bready
    en: Let's see what we have here.
    ko: 잘 먹을게.
    ja: いただきます。
  event_trueflavor_epilogue_30:
    speaker: bready
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_epilogue_31:
    speaker: bready
    en: Hmm...
    ko: 음.
    ja: うーん。
  event_trueflavor_epilogue_32:
    speaker: bready
    en: Hmmmm...
    ko: 으음….
    ja: これは…
  event_trueflavor_epilogue_33:
    speaker: bready
    en: Rei, did you try this after you'd finished making it?
    ko: 라이, 다 만들고 맛은 봤어?
    ja: ライ、完成してから味見はした？
  event_trueflavor_epilogue_34:
    speaker: rei
    en: No.
    ko: 아니, 안 봤어!
    ja: ううん、してないよ！
  event_trueflavor_epilogue_35:
    speaker: bready
    en: Be sure to do that next time.
    ko: 이따가 꼭 먹어봐.
    ja: じゃあ、あとで食べてみて。
  event_trueflavor_epilogue_36:
    speaker: bready
    en: Naru 2 also kept adding random seasonings and ingredients, so maybe it would
      be best to redistribute the roles.
    ko: |-
      그리고 나루 2호가 계속 양념이랑 재료를
      멋대로 추가해서 넣으니까, 역할 분배를 다시 해주는 게 좋겠어.
    ja: |-
      それからナル2号が
      ソースと食材を勝手に追加してるから、
      役割分担を見直した方がいいわ。
  event_trueflavor_epilogue_37:
    speaker: rei
    en: Oh my goodness! Really?
    ko: 헉! 진짜야?
    ja: えっ！ホント？
  event_trueflavor_epilogue_38:
    speaker: naru2
    en: Guilty...
    ko: 뜨끔?
    ja: ドキッ？
  event_trueflavor_epilogue_39:
    speaker: bready
    en: Still,
    ko: 그래도.
    ja: でも…
  event_trueflavor_epilogue_40:
    speaker: bready
    en: you worked hard.
    ko: 열심히 만들었네.
    ja: 頑張って作ったのね。
  event_trueflavor_epilogue_41:
    speaker: bready
    en: Tasting this was a very pleasant experience. Thank you.
    ko: 즐거운 맛이야, 잘 먹었어.
    ja: 楽しい味よ。ごちそうさま。
  event_trueflavor_epilogue_42:
    speaker: rei
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_trueflavor_epilogue_43:
    speaker: rei
    en: Thank you! Hehe.
    ko: 으응! 고마워!! 헤헤.
    ja: うん！ありがとう！えへへっ。
  event_trueflavor_epilogue_44:
    speaker: tia
    en: Done!
    ko: 완서엉~
    ja: できたぁ～
  event_trueflavor_epilogue_45:
    speaker: tia
    en: I made mine into something sweet again, hehe.
    ko: 이번에도 달콤한 음식으로 바꿔봤어~ 헤헤.
    ja: 今回も甘いレシピに変えてみたよぉ～えへへ。
  event_trueflavor_epilogue_46:
    speaker: naga
    en: You're unstoppable!
    ko: 정말 못 말린다니까~
    ja: もうっ、ティアったら～
  event_trueflavor_epilogue_47:
    speaker: naga
    en: Then again, it is only a small portion of the grade.
    ko: 뭐, 성적에 들어가는 비율은 낮으니까.
    ja: まっ、ほとんど成績に反映されないし。
  event_trueflavor_epilogue_48:
    speaker: naga
    en: As long as you get an average grade, it should be fine.
    ko: 중간 점수만 받아도 안전할 거야.
    ja: 半分くらいの点数でも大丈夫かな。
  event_trueflavor_epilogue_49:
    speaker: tia
    en: Yeah.
    ko: 우웅~
    ja: そうだねぇ～
  event_trueflavor_epilogue_50:
    speaker: bready
    en: May I taste it?
    ko: 맛을 봐도 될까?
    ja: ふふ、味見してもいいかしら？
  event_trueflavor_epilogue_51:
    speaker: tia
    en: Oh, hi Bready.
    ko: 어어~ 브래디다.
    ja: あ～ブレッディだぁ。
  event_trueflavor_epilogue_52:
    speaker: tia
    en: Go ahead. It should be pretty sweet.
    ko: 많이 달 거야아.
    ja: すごく甘いから、気をつけてねぇ。
  event_trueflavor_epilogue_53:
    speaker: bready
    en: Very well.
    ko: 알겠어, 잘 먹을게.
    ja: 分かったわ、いただきます。
  event_trueflavor_epilogue_54:
    speaker: bready
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_epilogue_55:
    speaker: bready
    en: Hmm...
    ko: 음.
    ja: うーん。
  event_trueflavor_epilogue_56:
    speaker: bready
    en: It's abundantly clear what kind of flavors you enjoy, Tia.
    ko: 티아가 무슨 맛을 좋아하는지, 잘 알 것 같아.
    ja: ティアが好きな味…よく分かったわ。
  event_trueflavor_epilogue_57:
    speaker: bready
    en: And you were quite happy as you made this.
    ko: 그리고 행복한 마음으로 만들었네.
    ja: それから、幸せな気持ちで作ったのね。
  event_trueflavor_epilogue_58:
    speaker: bready
    en: Especially when you sprinkled the sugar on top.
    ko: 특히 설탕을 뿌릴 때.
    ja: 特に砂糖をかける時。
  event_trueflavor_epilogue_59:
    speaker: tia
    en: I certainly was! Just imagining the taste was enough to make me giddy.
    ko: 맞아아~ 맛을 상상했더니 행복해지는 거 있지이.
    ja: |-
      そうだよぉ～
      味を想像したら、幸せな気分になったのぉ。
  event_trueflavor_epilogue_60:
    speaker: tia
    en: I'm going to eat it later, along with the dessert I bought from the cafe,
      hehe.
    ko: 이따, 카페에서 사 온 디저트랑 같이 먹으려구~ 헤헤.
    ja: |-
      あとで、カフェで買ってきたスイーツと一緒に
      食べるつもりなんだぁ。えへへ。
  event_trueflavor_epilogue_61:
    speaker: bready
    en: That sounds nice.
    ko: 응.
    ja: うん。
  event_trueflavor_epilogue_62:
    speaker: bready
    en: This was a very pleasant dish that made me happy. Thank you.
    ko: 기분 좋은 맛이야, 잘 먹었어.
    ja: |-
      幸せな気分にさせてくれる味ね。
      ごちそうさま。
  event_trueflavor_epilogue_63:
    speaker: tia
    en: Thank you!
    ko: 고마워어~
    ja: ありがとぉ～
  event_trueflavor_epilogue_64:
    speaker: crust
    en: What's your impression overall, Bready?
    ko: 브래디, 좀 어때?
    ja: ブレッディ、どう？
  event_trueflavor_epilogue_65:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_epilogue_66:
    speaker: bready
    en: Even students who are not professionals in the kitchen are able to cook with
      different emotions.
    ko: 요리에 서툰 학생들이, 다양한 감정을 갖고 요리를 해.
    ja: |-
      料理に慣れていない学生たちが、
      色々な気持ちを抱えながら料理をしているわ。
  event_trueflavor_epilogue_67:
    speaker: bready
    en: All of those emotions create distinct new stories and tastes.
    ko: 그 모든 것들이 새로운 이야기와 맛을 내고 있어.
    ja: 新しい物語と味が、たくさんあるの。
  event_trueflavor_epilogue_68:
    speaker: bready
    en: It's good.
    ko: 좋아.
    ja: いい感じね。
  event_trueflavor_epilogue_69:
    speaker: crust
    en: I'm glad to hear you enjoyed it!
    ko: 헤헤! 다행이야~!
    ja: えへへ！よかった～！
  event_trueflavor_epilogue_70:
    speaker: crust
    en: You haven't forgotten where we're going after this, did you?
    ko: 끝나고 거기 가기로 한 거, 안 잊었지?
    ja: |-
      終わったらあそこに行くって約束、
      忘れてないよね？
  event_trueflavor_epilogue_71:
    speaker: bready
    en: I remember.
    ko: 물론.
    ja: もちろんよ。
  event_trueflavor_epilogue_72:
    speaker: "<Narration>"
    en: "*Ring*"
    ko: 딸랑-
    ja: チリン――
  event_trueflavor_epilogue_73:
    speaker: ade
    en: Welcome, Ladies.
    ko: 다녀오셨어요, 아가씨들.
    ja: |-
      お帰りなさいませ、
      クラストお嬢様、ブレッディお嬢様。
  event_trueflavor_epilogue_74:
    speaker: ade
    en: I'll prepare the usual for you.
    ko: 늘 드시던 걸로 준비해 드리겠습니다.
    ja: いつものメニューをご用意いたしますね。
  event_trueflavor_epilogue_75:
    speaker: crust
    en: Thank you, Ade.
    ko: 고마워요, 에이드!
    ja: ありがとうございます！
  event_trueflavor_epilogue_76:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_epilogue_77:
    speaker: bready
    en: Even I never fully realized the extent to which happiness can exist.
    ko: 나도 인식하지 못했는데.
    ja: 私も初めて知ったけど…
  event_trueflavor_epilogue_78:
    speaker: bready
    en: It can assume so many different forms.
    ko: |-
      행복의 맛이라는 건,
      생각보다 다양한 형태로 존재하고 있나 봐.
    ja: |-
      幸せの味って、
      思ったより色んな形で存在しているのね。
  event_trueflavor_epilogue_79:
    speaker: bready
    en: So much so that now, tasting food isn't simply a boring routine for me anymore.
    ko: |-
      그래서 이제 음식을 맛보는 게,
      마냥 지루하지만은 않아졌어.
    ja: |-
      だからもう、料理の味見も
      退屈じゃなくなったわ。
  event_trueflavor_epilogue_80:
    speaker: bready
    en: I have you to thank for that, Crust.
    ko: 고마워, 크러스트.
    ja: ありがとう、クラスト。
  event_trueflavor_epilogue_81:
    speaker: crust
    en: Huh? What are you thanking me for?
    ko: 으응?! 갑자기?!
    ja: ふぇっ！？急にどうしたの…！？
  event_trueflavor_epilogue_82:
    speaker: bready
    en: I only came to this realization thanks to the research that you did.
    ko: 크러스트가 한 연구에서 파생된 결과니까.
    ja: だって、このことに気づけたのは…
  event_trueflavor_epilogue_83:
    speaker: bready
    en: Only then was I able to realize what cooking from the heart feels like.
    ko: 진심이라는 맛을 알게 된 덕분이야.
    ja: |-
      クラストの研究によって、
      「真心」という味を
      知ることができたおかげだもの。
  event_trueflavor_epilogue_84:
    speaker: crust
    en: Hehe, you're gonna make me blush...
    ko: 헤헤, 부끄러워라.
    ja: えへへ、照れちゃうよ～！
  event_trueflavor_epilogue_85:
    speaker: crust
    en: If I had known happiness could assume so many different forms, I would have
      gone out to eat with you more often.
    ko: |-
      이렇게 다양한 행복이 있는 줄 알았으면,
      같이 더 많이 먹으러 다니는 건데.
    ja: |-
      こんなにたくさんの幸せがあるって知ってたら、
      もっと一緒に食べ歩いたのになぁ。
  event_trueflavor_epilogue_86:
    speaker: bready
    en: We can do that from here on out.
    ko: 앞으로 많이 다니면 되지.
    ja: これからやればいいのよ。
  event_trueflavor_epilogue_87:
    speaker: crust
    en: Yeah, let's do that!
    ko: 응! 꼭 그러자~!
    ja: うん！えへへ…
  event_trueflavor_epilogue_88:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 달그락-
    ja: コトン――
  event_trueflavor_epilogue_89:
    speaker: ade
    en: Here's the omurice you ordered.
    ko: 주문하신 오므라이스 나왔습니다.
    ja: |-
      お待たせいたしました。
      オムライスでございます。
  event_trueflavor_epilogue_90:
    speaker: ade
    en: Shall we say the magic spell today as well?
    ko: 오늘도 주문을 외워볼까요?
    ja: 今日もご一緒に、呪文をお願いできますか？
  event_trueflavor_epilogue_91:
    speaker: bready
    en: Ooey gooey goodness,
    ko: 맛있어져라~ 맛있어져라~
    ja: ええ。おいしくな～れ、おいしくな～れ…
  event_trueflavor_epilogue_92:
    speaker: bready
    en: make this omurice delicious!
    ko: 몽글몽글 큥!
    ja: ふわふわキュン！
  event_trueflavor_epilogue_93:
    speaker: ade
    en: You're a natural at this point, Miss Bready.
    ko: 이제 자연스럽게 잘하시네요, 브래디 아가씨!
    ja: |-
      ふふ。すっかりお上手になりましたね、
      ブレッディお嬢様。
  event_trueflavor_epilogue_94:
    speaker: bready
    en: Hehe.
    ko: 응.
    ja: うん。
  event_trueflavor_epilogue_95:
    speaker: bready
    en: 'That''s because I realize now that this spell is also an integral ingredient
      in the recipe: happiness!'
    ko: 이 주문도 행복의 재료라는 걸 알았으니까.
    ja: |-
      この呪文も、幸せを作る要素の
      一部だって分かったから。
  event_trueflavor_epilogue_96:
    speaker: crust
    en: Hehe.
    ko: 헤헤.
    ja: えへへ。
  event_trueflavor_epilogue_97:
    speaker: crust
    en: Well then, let's dig in.
    ko: 그럼 잘 먹겠습니다~!
    ja: じゃあ、いっただきま～す！
  event_trueflavor_epilogue_98:
    speaker: bready
    en: Let's.
    ko: 잘 먹을게.
    ja: いただきます。
  event_trueflavor_epilogue_99:
    speaker: "<Narration>"
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_epilogue_100:
    speaker: "<Narration>"
    en: 'TRUE FLAVOR: END'
    ko: 'TRUE FLAVOR : END'
    ja: 'TRUE FLAVOR : END'
