    ja: えへへ、よかったです。
  event_trueflavor_01_e_60:
    speaker: crust
    en: I'm glad you like it.
    ko: 맛있게 드셔주셔서 감사해요.
    ja: おいしく召し上がってもらえてなによりです！
  event_trueflavor_01_e_61:
    speaker: "<Self>"
    en: I'm the one who's glad, considering I get to try such heavenly cuisine.
    ko: |-
      아냐, 나야말로 고맙지.
      냠냠.
    ja: |-
      いや、こちらこそありがとう。
      もぐもぐ…
  event_trueflavor_01_e_62:
    speaker: "<Self>"
    en: By the way, you mentioned earlier that today's episode was a rerun?
    ko: 그런데 아까 방송, 재방으로 나간다고 했잖아.
    ja: |-
      ところでさっき、
      今日は再放送の予定だと言っていたが…
  event_trueflavor_01_e_63:
    speaker: "<Self>"
    en: Did something happen? *Nom nom nom*
    ko: |-
      혹시 무슨 일 있었어?
      냠냠냠.
    ja: |-
      何かあったのか？
      もぐもぐ…
  event_trueflavor_01_e_64:
    speaker: crust
    en: Oh, there wasn't any traumatic accident or anything.
    ko: 아, 무슨 일이 있는 건 아니구요.
    ja: あ、そういうわけではないんですが…
  event_trueflavor_01_e_65:
    speaker: crust
    en: I simply decided to close down the kitchen and cancel all my plans so that
      I could focus on cooking research.
    ko: |-
      요리 연구에 집중하기 위해서
      주방도 닫고, 외부 일정도 다 취소한 거예요.
    ja: |-
      料理の研究に専念するために
      キッチンを閉めて、
      他の予定も全部キャンセルしたんです。
  event_trueflavor_01_e_66:
    speaker: "<Self>"
    en: Cooking research? *Chomp chomp*
    ko: |-
      요리 연구?
      쩝쩝.
    ja: |-
      料理の研究？
      ぱくぱく…
  event_trueflavor_01_e_67:
    speaker: crust
    en: Yes.
    ko: 네.
    ja: はい。
  event_trueflavor_01_e_68:
    speaker: crust
    en: As a chef,
    ko: 저는 요리사로서.
    ja: 私のシェフとしての目標は…
  event_trueflavor_01_e_69:
    speaker: crust
    en: my first goal was always to create food that Bready would be happy with.
    ko: |-
      브래디가 행복하게 맛을 볼 수 있는 음식을 만드는 게
