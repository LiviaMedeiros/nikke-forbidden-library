  event_trueflavor_04_e_35:
    speaker: crust
    en: Let me know when you're ready,
    ko: 다 드시고 나면 말씀해주세요~!
    ja: 食べ終わったら教えてくださいね～！
  event_trueflavor_04_e_36:
    speaker: crust
    en: and I'll bring out the dessert.
    ko: 디저트 놔드릴게요~
    ja: デザートをお出ししますので！
  event_trueflavor_04_e_37:
