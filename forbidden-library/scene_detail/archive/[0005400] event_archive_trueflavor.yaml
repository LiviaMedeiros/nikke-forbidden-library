  event_trueflavor_intermission_01_13:
    speaker: tia_s
    en: It's certainly not what I expected.
    ko: 기대했던 맛이 아니예요오….
    ja: 期待していた味じゃないですねぇ…
  event_trueflavor_intermission_01_14:
    speaker: crust
    en: Yeah?
    ko: 그래요?
    ja: そ、そうなんですか？
  event_trueflavor_intermission_01_15:
    speaker: crust
    en: That's good! In that case...
    ko: 좋아, 이거라면…!
    ja: じゃあ、これなら…！
  event_trueflavor_intermission_01_16:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 댕-!
    ja: チーン！
  event_trueflavor_intermission_01_17:
    speaker: "<Monologue>"
    en: Crust rings the bell.
    ko: 크러스트는 콜벨을 손으로 가볍게 내리쳤고.
    ja: クラストがベルを軽く叩くと…
  event_trueflavor_intermission_01_18:
    speaker: "<Monologue>"
    en: Soon after, Bready enters.
    ko: 이내, 브래디가 들어왔다.
    ja: ブレッディがやってきた
  event_trueflavor_intermission_01_19:
    speaker: crust
    en: Welcome back, Bready.
    ko: 브래디! 어서 와~!
    ja: ブレッディ！いらっしゃい！
  event_trueflavor_intermission_01_20:
    speaker: crust
    en: I'd like for you to taste the dish that we came up with today.
    ko: 오늘 연구한 요리도 맛을 봐줬으면 좋겠어!
    ja: 今日研究した料理も食べてみてくれる？
  event_trueflavor_intermission_01_21:
    speaker: bready
    en: Sure.
    ko: 응.
    ja: うん。
  event_trueflavor_intermission_01_22:
    speaker: bready
    en: I see we have a guest?
    ko: 오늘은 다른 사람이 있네.
    ja: 今日は他の人もいるのね。
  event_trueflavor_intermission_01_23:
    speaker: tia_s
    en: Hello, I'm Tia!
    ko: 안녕, 티아라고 해~
    ja: こんにちはぁ、ティアだよぉ～
  event_trueflavor_intermission_01_24:
    speaker: bready
    en: I'm Bready.
    ko: 나는 브래디야.
    ja: 私はブレッディよ。
  event_trueflavor_intermission_01_25:
    speaker: bready
    en: Thank you for coming to help Crust.
    ko: 크러스트를 도와주러 와줘서 고마워.
    ja: クラストを手伝ってくれてありがとう。
  event_trueflavor_intermission_01_26:
    speaker: tia_s
    en: Hehe, no problem.
    ko: 헤헤, 천만에~
    ja: えへへ、どういたしまして～
  event_trueflavor_intermission_01_27:
    speaker: tia_s
    en: I hope you enjoy what we made.
    ko: 입맛에 맞았으면 좋겠네에.
    ja: 口に合うといいんだけどぉ。
  event_trueflavor_intermission_01_28:
    speaker: crust
    en: Yeah, yeah!
    ko: 끄덕끄덕!
    ja: コクコク！
  event_trueflavor_intermission_01_29:
    speaker: bready
    en: So you made a cake?
    ko: 오늘은 케이크구나.
    ja: 今日はケーキなのね。
  event_trueflavor_intermission_01_30:
    speaker: bready
    en: "*Sniff sniff*"
    ko: 킁킁.
    ja: クンクン。
  event_trueflavor_intermission_01_31:
    speaker: bready
    en: It doesn't smell terribly sweet.
    ko: 음, 달콤한 냄새는 안 나네.
    ja: でも、甘い香りがしないわ。
  event_trueflavor_intermission_01_32:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_intermission_01_33:
    speaker: bready
    en: I'll see what it tastes like.
    ko: 일단, 잘 먹을게.
    ja: とりあえず、食べてみるわね。
  event_trueflavor_intermission_01_34:
    speaker: bready
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_intermission_01_35:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_intermission_01_36:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_intermission_01_37:
    speaker: tia_s
    en: "..."
    ko: 헤헤.
    ja: えへへ。
  event_trueflavor_intermission_01_38:
    speaker: bready
    en: Hmm...
    ko: 으음.
    ja: うーん。
  event_trueflavor_intermission_01_39:
    speaker: bready
    en: Tia.
    ko: 티아?
    ja: ティア？
  event_trueflavor_intermission_01_40:
    speaker: tia_s
    en: Yes?
    ko: 우웅? 왜애?
    ja: ん？なあに～？
  event_trueflavor_intermission_01_41:
    speaker: bready
    en: It's obvious that you really enjoy desserts.
    ko: 디저트를 정말 좋아하는구나.
    ja: スイーツのことが大好きなのね。
  event_trueflavor_intermission_01_42:
    speaker: bready
    en: I can easily pick up on the love and joy that you experienced while making
      this.
    ko: |-
      이 디저트를 향한 애정과 즐거움이
      만들면서 듬뿍 흘러나온 것 같아.
    ja: |-
      このスイーツに対する愛や楽しさが
      あふれ出ているわ。
  event_trueflavor_intermission_01_43:
    speaker: tia_s
    en: Wow, you can detect all that? I did have a great time making it!
    ko: 와아~ 맞아.
    ja: えへへ、そうなのぉ。
  event_trueflavor_intermission_01_44:
    speaker: tia_s
    en: The recipe was completely different from what I'm used to seeing, so I was
      a bit surprised.
    ko: 내가 알던 요리법이랑 전혀 달라서 조금 놀랐지마안~
    ja: |-
      私の思ってた作り方と全然違ったから、
      ちょっとびっくりしたけどぉ～
  event_trueflavor_intermission_01_45:
    speaker: tia_s
    en: But I figured that if this is how someone else likes it, then it's my responsibility
      to make it that way.
    ko: |-
      이걸 먹는 사람은 이렇게 만든 음식을 좋아하는구나아~
      하고 열심히 만들었어.
    ja: |-
      これを食べる人は、こういうスイーツが
      好きなんだぁ～って思いながら
      頑張って作ったんだぁ。
  event_trueflavor_intermission_01_46:
    speaker: tia_s
    en: Of course, I was only here to assist. Miss Crust made most of it.
    ko: |-
      물론 나는 보조라서,
      크러스트 선생님이 거의 다 만드셨지마안.
    ja: |-
      あ、でも、私はちょっと手伝っただけで、
      ほとんどクラスト先生が作ったんだけどねぇ。
  event_trueflavor_intermission_01_47:
    speaker: bready
    en: The taste is very enjoyable, to be sure.
    ko: 충분히 즐거운 맛이었어.
    ja: ふふ、すごく楽しい味だったわ。
  event_trueflavor_intermission_01_48:
    speaker: crust
    en: Hmm...
    ko: 흐음.
    ja: うーん…
  event_trueflavor_intermission_01_49:
    speaker: crust
    en: When you eat, you sense the emotions that were present when the dish was being
      made. This complicates things...
    ko: 음식을 먹으면 만든 순간의 감정도 알아버리니까 곤란하네….
    ja: |-
      料理を作った瞬間の感情も
      分かっちゃうんだもんね…
  event_trueflavor_intermission_01_50:
    speaker: crust
    en: Maybe I shouldn't cook it myself?
    ko: 직접 만들면 안 되는 건가…?
    ja: いっそ、私が作らないほうがいいのかな…？
  event_trueflavor_intermission_01_51:
    speaker: bready
    en: Having said that, there's next to no sweetness here.
    ko: 그런데 그거랑 별개로.
    ja: "…でも、それとは別に…"
  event_trueflavor_intermission_01_52:
    speaker: bready
    en: Just a vaguely cake-like texture.
    ko: 단맛이 전혀 없어, 식감만 살아있네.
    ja: |-
      甘みがまったくなかったわ。
      いいのは食感だけね。
  event_trueflavor_intermission_01_53:
    speaker: bready
    en: I would hardly call this a proper cake.
    ko: 이걸 케이크라고 할 수 있을까?
    ja: はたして、これをケーキと呼べるのかしら？
  event_trueflavor_intermission_01_54:
    speaker: crust
    en: "!!"
    ko: 아…!
    ja: "…！"
  event_trueflavor_intermission_01_55:
    speaker: crust
    en: But at least the taste isn't ordinary like the ones from before!
    ko: 맛이 평범하진 않지? 헤헤.
    ja: 変わった味でしょ？えへへ。
  event_trueflavor_intermission_01_56:
    speaker: crust
    en: That tells me I'm making progress!
    ko: 그래도 방금 걸로 연구에 진척이 생겼어!
    ja: でも、今ので研究に進展があったよ！
  event_trueflavor_intermission_01_57:
    speaker: crust
    en: I'm going to switch up some things and make it again.
    ko: 방법을 좀 바꿔서 만들어 보려구.
    ja: 次はやり方を少し変えて作ってみるね。
  event_trueflavor_intermission_01_58:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_intermission_01_59:
    speaker: bready
    en: Crust, I...
    ko: 크러스트, 난….
    ja: クラスト、私は…
  event_trueflavor_intermission_01_60:
    speaker: crust
    en: Yes?
    ko: 응?
    ja: ん？
  event_trueflavor_intermission_01_61:
    speaker: bready
    en: "... Nothing."
    ko: "…아니, 아무것도 아냐."
    ja: "…ううん、何でもない。"
  event_trueflavor_intermission_01_62:
    speaker: bready
    en: I hope you'll be finished with your research soon.
    ko: 연구가 빨리 끝났으면 좋겠네.
    ja: 早く研究が終わるといいわね。
  event_trueflavor_intermission_01_63:
    speaker: crust
    en: I hope so too!
    ko: 응! 나도 빨리 마무리하고 싶어!
    ja: うん！私もそう思う！
  event_trueflavor_intermission_01_64:
    speaker: bready
    en: I presume I should leave now?
    ko: 난 다시 돌아가 있으면 되는 거, 맞지?
    ja: 私は待機していた方がいいのよね？
  event_trueflavor_intermission_01_65:
    speaker: crust
    en: If you could. Thanks, Bready.
    ko: 응, 응! 고마워, 브래디~
    ja: うん！ありがとう、ブレッディ！
  event_trueflavor_intermission_01_66:
    speaker: tia_s
    en: "..."
    ko: 흐우웅.
    ja: う～ん…
  event_trueflavor_intermission_01_67:
    speaker: tia_s
    en: Miss Crust.
    ko: 크러스트 선생님.
    ja: ねぇ、クラスト先生。
  event_trueflavor_intermission_01_68:
    speaker: crust
    en: Yes?
    ko: 네?
    ja: はい？
  event_trueflavor_intermission_01_69:
    speaker: tia_s
    en: You're trying to cook a dish that Bready can eat, right?
    ko: |-
      오늘, 브래디가 맛있게 먹을 수 있는 음식을
      만들던 거 아니었나요오?
    ja: |-
      今日は、ブレッディがおいしく食べられる料理を
      作ったんじゃなかったんですかぁ？
  event_trueflavor_intermission_01_70:
    speaker: crust
    en: That's right!
    ko: 당연히 맞죠~!
    ja: そうですよ！
  event_trueflavor_intermission_01_71:
    speaker: tia_s
    en: But...
    ko: 그런데에….
    ja: でもぉ…
  event_trueflavor_intermission_01_72:
    speaker: tia_s
    en: Bready didn't enjoy it.
    ko: 브래디, 맛있게 먹지도 않았고.
    ja: ブレッディ、おいしそうでもなかったし…
  event_trueflavor_intermission_01_73:
    speaker: tia_s
    en: She didn't look terribly happy.
    ko: 행복해 보이지도 않았어요오.
    ja: 幸せそうにも見えませんでしたぁ。
  event_trueflavor_intermission_01_74:
    speaker: crust
    en: I realize that. That's why I'm trying to come up with a dish that will make
      her happy.
    ko: |-
      맞아요, 그래서 브래디가 행복하게 먹을 수 있는 요리를
      연구하고 있는 거였어요~!
    ja: |-
      はい！だからブレッディが幸せになれる料理を
      研究しているんです～！
  event_trueflavor_intermission_01_75:
    speaker: tia_s
    en: That's not really what I'm getting at.
    ko: 흐우우웅… 그게 아니라아.
    ja: うぅぅ～ん…そうじゃなくてぇ。
  event_trueflavor_intermission_01_76:
    speaker: tia_s
    en: I realize that you're still in the middle of the process, but if the person
      you're trying to please looks so unhappy at this point,
    ko: |-
      아직 중간 과정이라고 해도,
      먹는 사람이 저렇게 불행한 표정을 지으며언….
    ja: |-
      まだ途中だとしても、食べた人が
      あんな悲しそうな顔をしたらぁ…
  event_trueflavor_intermission_01_77:
    speaker: tia_s
    en: don't you think that indicates you're headed in the wrong direction?
    ko: 방향이 잘못된 거 아닐까아~ 해서요오.
    ja: |-
      方向性が間違ってるんじゃ～って
      思ったんですぅ。
  event_trueflavor_intermission_01_78:
    speaker: crust
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_trueflavor_intermission_01_79:
    speaker: crust
    en: Do you really think she looked that unhappy?
    ko: 불행한 표정을 지었나…? 브래디가…?
    ja: ブレッディが…悲しそうな顔を…？
  event_trueflavor_intermission_01_80:
    speaker: tia_s
    en: Yes.
    ko: 네에.
    ja: そうですよぉ。
  event_trueflavor_intermission_01_81:
    speaker: tia_s
    en: Are you sure you're really making this for her?
    ko: 이거 정말… 브래디를 위해서 만드는 것 맞나요오?
    ja: |-
      これって本当に、ブレッディのために
      作ってるんですかぁ…？
event_trueflavor_04_s:
  event_trueflavor_04_s_1:
    speaker: tia_s
    en: If you ask me, if the person on the receiving end doesn't want what they're
      being given,
    ko: 저는요오.
    ja: 私はぁ、
  event_trueflavor_04_s_2:
    speaker: tia_s
    en: it can make even good intentions feel malicious.
    ko: |-
      상대방이 원하지 않으면,
      호의도 악의로 느껴질 수 있다고 생각해요오.
    ja: |-
      相手が望まないなら、
      好意も悪意になると思うんですぅ。
  event_trueflavor_04_s_3:
    speaker: tia_s
    en: That's why I'm always sure to ask these questions before I set out to do something.
    ko: 그래서, 이거 어때~? 하고 먼저 물어보는 거구요오.
    ja: |-
      だから、これどう～？って、
      先に聞くんですよぉ。
  event_trueflavor_04_s_4:
    speaker: tia_s
    en: All this research you're doing right now, is this what Bready wanted?
    ko: |-
      지금 연구하시는 거,
      브래디도 원했던 것인가요오?
    ja: |-
      この研究は、ブレッディも
      望んでることなんですかぁ…？
  event_trueflavor_04_s_5:
    speaker: crust
    en: Uh...
    ko: 그….
    ja: それは…
  event_trueflavor_04_s_6:
    speaker: crust
    en: Not exactly, but...
    ko: 그건 아니긴 한데요….
    ja: 違うかもしれませんが…
  event_trueflavor_04_s_7:
    speaker: crust
    en: But I know she'll be happy with it when I succeed! I can already see the expression
      on her face!
    ko: |-
      이 연구에 성공했을 때
      어떤 표정을 지을지는 알고 있어요!
    ja: |-
      研究が成功したら、
      どんな顔を浮かべてくれるかは分かっています！
  event_trueflavor_04_s_8:
    speaker: crust
    en: I've seen it before.
    ko: 제가 봤거든요, 헤헤.
    ja: 前に見たことがあるんです、えへへ。
  event_trueflavor_04_s_9:
    speaker: tia_s
    en: I see.
    ko: 그렇군요오.
    ja: そうですかぁ。
  event_trueflavor_04_s_10:
    speaker: tia_s
    en: Still, I think it would be a good idea to let her know the exact purpose of
      what you're doing here.
    ko: |-
      그래도, 어떤 연구를 하고 있는지는
      말씀을 드리는 게 더 좋을 거라 생각해요오.
    ja: |-
      でも、どんな研究をしているのかは
      伝えた方がいいと思いますぅ。
  event_trueflavor_04_s_11:
    speaker: tia_s
    en: Not knowing for so long might make her feel upset.
    ko: 나중에 서운해할 수도 있으니까요, 헤헤.
    ja: 寂しい思いをさせちゃうかもしれませんよぉ。
  event_trueflavor_04_s_12:
    speaker: crust
    en: Okay, I'll fill her in.
    ko: 네! 꼭 그러도록 할게요!
    ja: はい！そうしますね！
  event_trueflavor_04_s_13:
    speaker: crust
    en: Thanks for your help today, Tia.
    ko: 오늘 도와줘서 너무 고마웠어요~!
    ja: |-
      今日は手伝ってくれて、
      本当にありがとうございました！
  event_trueflavor_04_s_14:
    speaker: crust
    en: Be safe on your way back home.
    ko: 조심히 들어가세요!!
    ja: 気をつけて帰ってくださいね！
  event_trueflavor_04_s_15:
    speaker: tia_s
    en: I had a good time.
    ko: 저도 즐거웠어요오.
    ja: 私も楽しかったですぅ。
  event_trueflavor_04_s_16:
    speaker: tia_s
    en: I'll be rooting for you!
    ko: 응원할게요오~ 헤헤.
    ja: 応援してますねぇ～、えへへ。
  event_trueflavor_04_s_17:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_trueflavor_04_s_18:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_04_s_19:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_04_s_20:
    speaker: "<Self>"
    en: Crus...
    ko: 크러스….
    ja: クラス…
  event_trueflavor_04_s_21:
    speaker: crust
    en: "!"
    ko: 저!
    ja: 私！
  event_trueflavor_04_s_22:
    speaker: crust
    en: This next time, rather than making it myself, I'll use a machine.
    ko: |-
      이번에는 제가 직접 만드는 게 아니라,
      기계로 만들어 보려고 해요.
    ja: |-
      次は手作りじゃなくて、
      機械で作ってみようと思います。
  event_trueflavor_04_s_23:
    speaker: crust
    en: That way, Bready won't detect any emotions in the dish.
    ko: 그러면 브래디가 아무런 감정을 느끼지 못하겠죠?
    ja: |-
      そうすれば、ブレッディが
      感情を読み取ることもないですよね。
  event_trueflavor_04_s_24:
    speaker: "<Self>"
    en: Even if she doesn't sense any of the emotions, she'll still detect the nutritional
      components and each individual ingredient.
    ko: |-
      감정을 못 느끼더라도,
      영앙 성분, 재료 하나하나를 다 느끼잖아.
    ja: |-
      感情は伝わらなくても、
      成分や食材は感じ取れるんじゃないか？
  event_trueflavor_04_s_25:
    speaker: crust
    en: Oh...
    ko: 아….
    ja: あっ…
  event_trueflavor_04_s_26:
    speaker: crust
    en: B-but if she doesn't feel the emotions, wouldn't there be a chance that she
      won't know all those other details?
    ko: |-
      가, 감정을 못 느끼면
      그런 정보들도 모를 가능성이 있지 않을까요?
    ja: |-
      か、感情が伝わらなければ、
      そういう情報も分からなくなるかも…！
  event_trueflavor_04_s_27:
    speaker: crust
    en: At any rate, I've never tried it, so I'll experiment!
    ko: 해본 적이 없으니까, 한 번 연구를…!
    ja: 試したことがないので、一度研究を…！
  event_trueflavor_04_s_28:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_04_s_29:
    speaker: crust
    en: I'm sorry. I know that I'm being impulsive.
    ko: "…죄송해요, 방금은 너무 막무가내였죠."
    ja: |-
      …すみません。無茶苦茶なことを
      言ってしまって…
  event_trueflavor_04_s_30:
    speaker: "<Self>"
    en: It's all right.
    ko: 아냐.
    ja: そんなことはない
  event_trueflavor_04_s_31:
    speaker: crust
    en: It's just that I was really shocked by what Tia said earlier.
    ko: "…아까, 티아가 한 말을 듣고 너무 놀랐어요."
    ja: |-
      …ティアの話を聞いた時、
      自分にビックリしちゃったんです。
  event_trueflavor_04_s_32:
    speaker: crust
    en: I said I wanted to make food that Bready would be happy eating,
    ko: |-
      브래디가 행복하게 먹을 수 있는 음식을
      만들고 싶다고 했으면서.
    ja: |-
      ブレッディを幸せにする料理を
      作りたいって言っておきながら…
  event_trueflavor_04_s_33:
    speaker: crust
    en: but I never bothered to check what kind of expression she was making while
      eating.
    ko: |-
      정작 음식을 먹는 브래디가
      어떤 표정을 짓고 있는지 궁금해하지도 않았어요.
    ja: |-
      料理を食べているブレッディが
      どんな表情をしていたのかすら、
      ちゃんと見ていなかったんだなって…
  event_trueflavor_04_s_34:
    speaker: crust
    en: I figured that as long as I did my research, her liking it was a given.
    ko: 제가 연구를 하면 당연히 좋아해 줄 거라고 생각했고요.
    ja: |-
      私が研究をしたら喜んでくれるはずだと、
      勝手に思い込んでました。
  event_trueflavor_04_s_35:
    speaker: crust
    en: Why is this so difficult...?
    ko: "…왜 이렇게 어려운 걸까요…?"
    ja: "…どうしてこんなに、難しいんでしょうか…？"
  event_trueflavor_04_s_36:
    speaker: crust
    en: The more I try, the less I seem to know.
    ko: 하면 할수록, 방법을 모르겠어요.
    ja: やればやるほど、分からなくなって…
  event_trueflavor_04_s_37:
    speaker: "<Self>"
    en: Crust...
    ko: 크러스트….
    ja: クラスト…
  event_trueflavor_04_s_38:
    speaker: crust
    en: I know this might sound childish,
    ko: 철없는 말이라는 거 아는데요.
    ja: ワガママだって分かってるんですが…
  event_trueflavor_04_s_39:
    speaker: crust
    en: but I'm a little jealous of you at the moment, hehe.
    ko: 지금은, 미식가님이 조금 부럽네요~ 헤헤.
    ja: |-
      今は、グルメ様のことが
      うらやましいです。えへへ…
  event_trueflavor_04_s_40:
    speaker: "<Self>"
    en: "... I know someone whose cooking makes everyone happy."
    ko: "…행복한 음식만 만드는 사람을 알고 있는데."
    ja: "…幸せな料理しか作らない知り合いがいる"
  event_trueflavor_04_s_41:
    speaker: "<Self>"
    en: How about I ask her to come and help?
    ko: 한 번 초대해 보는 건 어떨까?
    ja: 一度招待してみないか？
  event_trueflavor_04_s_42:
    speaker: crust
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_trueflavor_04_s_43:
    speaker: crust
    en: If you could, I'd be super grateful!
    ko: 그, 그래 주시면 감사하죠!
    ja: ぜ、ぜひお願いします！
  event_trueflavor_04_s_44:
    speaker: crust
    en: She sounds incredible!
    ko: 행복한 음식만 만드는 분이 계시다니, 신기하네요…!
    ja: |-
      幸せな料理しか作らないなんて、
      すごいですね…！
  event_trueflavor_04_s_45:
    speaker: "<Self>"
    en: It's another person whom you know as well.
    ko: 크러스트도 아는 사람이야.
    ja: クラストも知っている人だ
  event_trueflavor_04_s_46:
    speaker: crust
    en: Another one?
    ko: 이번에도요?!
    ja: 今回もですか！？
  event_trueflavor_04_s_47:
    speaker: crust
    en: That's amazing, considering I don't know that many people.
    ko: 제, 제가 그렇게 아는 분이 많지는 않은데… 신기하네요!
    ja: |-
      そ、そんなに知り合いが多い方では
      ないんですが…不思議ですね！
  event_trueflavor_04_s_48:
    speaker: crust
    en: Will they also be here to assist me, like Tia did today?
    ko: |-
      내일 보조로서 도와주시게 되는 걸까요?
      오늘의 티아 처럼?
    ja: |-
      明日サポートを頼むんですか？
      今日のティアみたいに？
  event_trueflavor_04_s_49:
    speaker: "<Self>"
    en: This is only my personal opinion,
    ko: 음, 이건 그냥 내 의견인데.
    ja: うーん、これは私の意見だが…
  event_trueflavor_04_s_50:
    speaker: "<Self>"
    en: but I'd suggest inviting her as a guest.
    ko: 이번엔 손님으로 초대해 보는 건 어때?
    ja: 次はお客様として招待してみないか？
  event_trueflavor_04_s_51:
    speaker: crust
    en: As a guest?
    ko: 손님으로요?
    ja: お客様として…ですか？
  event_trueflavor_04_s_52:
    speaker: crust
    en: Hmm...
    ko: 으으음….
    ja: うーーん…
  event_trueflavor_04_s_53:
    speaker: "<Self>"
    en: You could take this opportunity to make some normal dishes again.
    ko: 크러스트도 간만에 평범한 요리들을 좀 만들어 보고.
    ja: 久しぶりに普通の料理を作って…
  event_trueflavor_04_s_54:
    speaker: "<Self>"
    en: This person could act as a sounding board for what you make and offer their
      feedback.
    ko: 그 사람의 평도 들어보고 하면 좋지 않을까?
    ja: |-
      その人からの感想を
      聞いてみたらいいんじゃないか？
  event_trueflavor_04_s_55:
    speaker: crust
    en: Hmm...
    ko: 음…!
    ja: なるほど…！
  event_trueflavor_04_s_56:
    speaker: crust
    en: Yeah, that sounds good!
    ko: 네, 알겠어요!
    ja: 分かりました！
  event_trueflavor_04_s_57:
    speaker: crust
    en: A completely new approach could be just the ticket.
    ko: 리프레시도 되고, 좋을 것 같아요!
    ja: 気分転換にもなって、よさそうですね！
  event_trueflavor_04_s_58:
    speaker: "<Self>"
    en: Then let's wrap things up for today, and I'll see you tomorrow.
    ko: 그럼 오늘은 여기서 정리하고, 내일 보자.
    ja: |-
      じゃあ、今日はこれくらいにして
      また明日会おう
  event_trueflavor_04_s_59:
    speaker: crust
    en: Oh! Wait a moment. Let me give you an invitation.
    ko: 아! 잠시만요, 제가 초대장을 드릴게요.
    ja: |-
      あっ！お待ちください…！
      招待状をお渡ししますね。
  event_trueflavor_04_s_60:
    speaker: crust
    en: I always personally write out an invitation for any guests that are invited
      to our kitchen.
    ko: |-
      저희 주방에 손님으로 초대를 받으신 분들에게는
      꼭 초대장을 직접 만들어 드리거든요~ 헤헤.
    ja: |-
      キッチンにお客様として招待する方には、
      必ず招待状を手作りしているんです。えへへ。
  event_trueflavor_04_s_61:
    speaker: "<Self>"
    en: Why?
    ko: 왜?
    ja: どうしてだ？
  event_trueflavor_04_s_62:
    speaker: crust
    en: Isn't it obvious?
    ko: 그야, 당연히~
    ja: それは、もちろん！
  event_trueflavor_04_s_63:
    speaker: crust
    en: So that they feel special!
    ko: 설렘과 행복을 드리기 위해서죠!
    ja: |-
      期待感でドキドキワクワクする気持ちと、
      幸せをお届けするためです！
  event_trueflavor_04_s_64:
    speaker: "<Self>"
    en: If you know that, why are you doing this with Bready...
    ko: "…잘 알고 있구나."
    ja: "…よく分かっているんだな"
  event_trueflavor_04_s_65:
    speaker: crust
    en: Sorry? What was that?
    ko: 네? 뭐라고 하셨나요?
    ja: えっ？今、何と…？
  event_trueflavor_04_s_66:
    speaker: "<Self>"
    en: "...Nothing. I'm sure she'll like it."
    ko: 아니, 분명 좋아할 거야.
    ja: いや、きっと喜ぶはずだ
  event_trueflavor_04_s_67:
    speaker: crust
    en: I certainly hope so, hehe!
    ko: 네! 그러셨으면 좋겠어요~! 헤헤.
    ja: そうだと嬉しいです～！えへへ。
  event_trueflavor_04_s_68:
    speaker: "<Narration>"
    en: Next day.
    ko: 다음 날.
    ja: 翌日
  event_trueflavor_04_s_69:
    speaker: crust
    en: Hmm...
    ko: 흠흠~
    ja: ふんふ～ん。
  event_trueflavor_04_s_70:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 보글보글-
    ja: グツグツ――
  event_trueflavor_04_s_71:
    speaker: crust
    en: Bubble bubble, let's boil the stew!
    ko: 보글보글~ 찌개를 끓여봐요~
    ja: グツグツ～お鍋を煮込みましょう～
  event_trueflavor_04_s_72:
    speaker: "<Narration>"
    en: "*Sizzle*"
    ko: 치이익-
    ja: ジューッ――
  event_trueflavor_04_s_73:
    speaker: crust
    en: Ssss, ssss, let's grill up the meat!
    ko: 칙- 칙- 고기를 구워봐요~
    ja: ジュ～ジュ～お肉を焼きましょう～
  event_trueflavor_04_s_74:
    speaker: "<Self>"
    en: You look like you're having fun.
    ko: 즐거워 보이네.
    ja: 楽しそうだな
  event_trueflavor_04_s_75:
    speaker: crust
    en: Hehe, you bet I am!
    ko: 헤헤, 네~!
    ja: えへへ、はい！
  event_trueflavor_04_s_76:
    speaker: crust
    en: Welcoming a new guest is always a thrill.
    ko: 새로운 손님을 맞이하는 건 언제나 즐거우니까요.
    ja: |-
      新しいお客様をお迎えするのは、
      いつもワクワクしますから。
  event_trueflavor_04_s_77:
    speaker: crust
    en: I'm so curious who it's going to be! My heart is racing!
    ko: 어떤 분이실지 너무 궁금하네요~ 두근두근!
    ja: どんな方か気になります～ドキドキ！
  event_trueflavor_04_s_78:
    speaker: "<Narration>"
    en: "*Knock knock*"
    ko: 똑똑.
    ja: コンコン
  event_trueflavor_04_s_79:
    speaker: crust
    en: Oh, there they are!
    ko: 앗! 오셨나 봐요…!
    ja: あっ！いらっしゃったみたいです…！
  event_trueflavor_04_s_80:
    speaker: crust
    en: Pfooo...
    ko: 후우….
    ja: すぅ…
  event_trueflavor_04_s_81:
    speaker: crust
    en: Welcome!
    ko: 들어오세요오~!!
    ja: どうぞ～～！
  event_trueflavor_04_s_82:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_trueflavor_04_s_83:
    speaker: crust
    en: Welcome to the Cooking Oil kitchen,
    ko: 어서 오세요~
    ja: いらっしゃいませ～
  event_trueflavor_04_s_84:
    speaker: crust
    en: where the air is filled with the aroma of delicious food.
    ko: |-
      맛있는 향기가 가득한 이곳이 바로,
      쿠킹오일의 주방이랍니다~!
    ja: |-
      おいしい匂いでいっぱいのココが、
      クッキングオイルのキッチンで～す！
  event_trueflavor_04_s_85:
    speaker: unknown
    en: Hello.
    ko: 안녕하세요.
    ja: ごきげんよう。
  event_trueflavor_04_s_86:
    speaker: crust
    en: "?"
