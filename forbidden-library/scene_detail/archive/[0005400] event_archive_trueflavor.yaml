      ここまで来て私の料理を
      召し上がってくださったことへの、
      感謝の気持ちをこめました！
  event_trueflavor_04_e_27:
    speaker: ade_c
    en: It's incredibly well done. Like a work of art.
    ko: 예술적이라는 생각이 들 정도로, 멋진 글씨네요.
    ja: 芸術的に思えるほど、素敵な文字ですね。
  event_trueflavor_04_e_28:
    speaker: ade_c
    en: Well then, I'll start.
    ko: 잘 먹겠습니다.
    ja: いただきます。
  event_trueflavor_04_e_29:
    speaker: ade_c
