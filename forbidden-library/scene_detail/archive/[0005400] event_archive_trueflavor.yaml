  event_trueflavor_04_e_45:
    speaker: ade_c
    en: but if you ask me, I'd say you've already succeeded.
    ko: 제가 보기엔 충분한 것 같거든요.
    ja: |-
      私からすると、すでに
      完成しているように思えました。
  event_trueflavor_04_e_46:
    speaker: crust
    en: R-really?
    ko: 그, 그래요?
    ja: そ、そうですか？
  event_trueflavor_04_e_47:
    speaker: crust
