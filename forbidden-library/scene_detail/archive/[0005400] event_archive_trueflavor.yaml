      心がぽかぽかして、
      つい口元が緩んじゃうような…
  event_trueflavor_05_s_8:
    speaker: crust
    en: So this is how happiness tastes.
    ko: "…행복한 맛이에요."
    ja: "…幸せな味です。"
  event_trueflavor_05_s_9:
    speaker: crust
    en: Your cooking really does bring out the happiness in people, Ade.
    ko: 에이드는 정말 행복한 음식만 만드시는군요!
    ja: |-
      エードは本当に幸せな料理しか
      作らないんですね！
  event_trueflavor_05_s_10:
