---
event_trueflavor_prologue:
  event_trueflavor_prologue_1:
    speaker: bready
    en: My mind doesn't feel overwhelmed.
    ko: 머리가 복잡하지 않아.
    ja: 頭の中がスッキリしてる。
  event_trueflavor_prologue_2:
    speaker: bready
    en: It's not some strangely exotic or stimulating flavor, but...
    ko: 새로운 맛, 자극적인 맛… 그런 말로 표현할 수 없어.
    ja: |-
      新しいとか、刺激的とか…
      そんな言葉じゃ言い表せない。
  event_trueflavor_prologue_3:
    speaker: bready
    en: I...
    ko: 이건….
    ja: 本当に…
  event_trueflavor_prologue_4:
    speaker: bready
    en: I can actually taste it!
    ko: 정말 맛이 느껴져!!
    ja: 本当に味を感じるの！
  event_trueflavor_prologue_5:
    speaker: bready
    en: At long last, I've finally found it.
    ko: 드디어, 드디어 찾았어.
    ja: やっと…やっと見つけたわ。
  event_trueflavor_prologue_6:
    speaker: bready
    en: The taste I've been searching for all my life.
    ko: 내가 원하던 맛.
    ja: 私が欲しかった味。
  event_trueflavor_prologue_7:
    speaker: bready
    en: One beautiful beyond all comprehension.
    ko: 내가 평생 맛보고 싶었던 온전한 맛.
    ja: ずっと探してた味。
  event_trueflavor_prologue_8:
    speaker: bready
    en: Pure and untainted by information.
    ko: 정보에서 벗어난 아름다운 맛!
    ja: 余計な情報がない純粋な味！
  event_trueflavor_prologue_9:
    speaker: bready
    en: It's divine! Bonne Bouche!
    ko: 이게… 이게 바로, 미미!!
    ja: これが…まさしく、美味！！
  event_trueflavor_prologue_10:
    speaker: crust
    en: Really?
    ko: 정말이야?!
    ja: 本当…！？
  event_trueflavor_prologue_11:
    speaker: crust
    en: Congratulations, Bready!
    ko: 축하해, 브래디!
    ja: おめでとう、ブレッディ！
  event_trueflavor_prologue_12:
    speaker: crust
    en: Have your taste buds transformed, you think?
    ko: 아예 입맛이 달라진 거야?
    ja: もしかして、食の好みが変わったの？
  event_trueflavor_prologue_13:
    speaker: bready
    en: No, I don't think so.
    ko: 그건 아닌 것 같아.
    ja: ううん、それは違うと思うわ。
  event_trueflavor_prologue_14:
    speaker: bready
    en: It's only the Comman...
    ko: 지휘관….
    ja: 指揮官…
  event_trueflavor_prologue_15:
    speaker: bready
    en: No, I should call him Bonne Bouche from now on.
    ko: 아니, 이제 미미라고 부르기로 했지.
    ja: じゃなくて、美味って呼ぶことにしたのよね。
  event_trueflavor_prologue_16:
    speaker: bready
    en: Bonne Bouche is the only one I get this flavor from.
    ko: 미미한테서만 이 맛을 느낄 수 있어.
    ja: この味を感じられるのは、美味からだけなの。
  event_trueflavor_prologue_17:
    speaker: crust
    en: I see.
    ko: 그렇구나.
    ja: そっか…！
  event_trueflavor_prologue_18:
    speaker: crust
    en: And here I was hoping my meals would be the pathway to your happiness.
    ko: 내가 한 음식을 먹고 행복해하는 브래디를 보고 싶었는데….
    ja: |-
      私の料理を食べて喜ぶブレッディが
      見たかったけど…
  event_trueflavor_prologue_19:
    speaker: crust
    en: Hehe, looks like I lost out to Mr. Gourmand.
    ko: 헤헤, 미식가님에게 져버렸네.
    ja: えへへ、グルメ様に負けちゃったね。
  event_trueflavor_prologue_20:
    speaker: crust
    en: At any rate, seeing you this happy while you're eating makes me happy,
    ko: |-
      어찌 됐든, 브래디가 음식을 먹고
      이렇게까지 행복해하는 걸 보니까~
    ja: |-
      でも、何かを食べてこんなに幸せそうにしてる
      ブレッディが見られて…
  event_trueflavor_prologue_21:
    speaker: crust
    en: so this is a positive development!
    ko: 너무 기뻐! 잘됐다~!
    ja: すっごく嬉しい！よかった～！
  event_trueflavor_prologue_22:
    speaker: crust
    en: Let's throw a party as a celebration.
    ko: 기념으로, 파티를 열자!
    ja: 記念に、パーティーしようよ！
  event_trueflavor_prologue_23:
    speaker: crust
    en: I made a bunch of tasty treats.
    ko: 맛있는 것들도 잔뜩 만들어 놨어.
    ja: おいしいもの、たくさん作ってあるの！
  event_trueflavor_prologue_24:
    speaker: bready
    en: Hmm...
    ko: 음.
    ja: うーん。
  event_trueflavor_prologue_25:
    speaker: bready
    en: Will Bonne Bouche be coming too?
    ko: 미미도 오는 거야?
    ja: 美味も来るの？
  event_trueflavor_prologue_26:
    speaker: crust
    en: Not sure.
    ko: 글쎄~
    ja: えっ？う～ん…
  event_trueflavor_prologue_27:
    speaker: crust
    en: I suppose if we want to be certain, we can invite him.
    ko: 초대하면 와주지 않으실까?
    ja: 招待したら、来てくださるかも？
  event_trueflavor_prologue_28:
    speaker: crust
    en: But then again, he has been awfully busy lately...
    ko: 아닌가? 요새 많이 바쁘신가….
    ja: |-
      でも、どうだろう…？
      お忙しいかもしれないし…
  event_trueflavor_prologue_29:
    speaker: bready
    en: Has he?
    ko: 그래? 흐음.
    ja: そっか。うーん…
  event_trueflavor_prologue_30:
    speaker: bready
    en: "... Sorry, but I'll have to take a raincheck on that party."
    ko: 미안한데, 나는 파티에서 빼줘.
    ja: 悪いけど、パーティーは私抜きでやって。
  event_trueflavor_prologue_31:
    speaker: crust
    en: Huh?
    ko: 응?
    ja: えっ？
  event_trueflavor_prologue_32:
    speaker: crust
    en: Why? Are you sick?
    ko: 왜? 어디 아파?
    ja: どうして？具合でも悪いの？
  event_trueflavor_prologue_33:
    speaker: bready
    en: No, I'm fine.
    ko: 아니, 그런 건 아냐.
    ja: ううん、そうじゃないの。
  event_trueflavor_prologue_34:
    speaker: crust
    en: Then how come you don't want to be a part of the festivities?
    ko: 그럼 왜 빠지려고 하는 거야?
    ja: じゃあ、どうして…？
  event_trueflavor_prologue_35:
    speaker: crust
    en: This party is supposed to be for you.
    ko: 이건 브래디를 위한 파티인데….
    ja: ブレッディのために開くパーティーなのに…
  event_trueflavor_prologue_36:
    speaker: bready
    en: It's just...
    ko: 그야.
    ja: それは…
  event_trueflavor_prologue_37:
    speaker: bready
    en: I have no reason to ingest any of your food anymore.
    ko: 이제 크러스트의 음식을 먹을 이유가 없으니까.
    ja: |-
      クラストの料理を食べる理由が
      なくなったからよ。
  event_trueflavor_prologue_38:
    speaker: crust
    en: Wha...
    ko: 으, 응…?
    ja: えっ…？
  event_trueflavor_prologue_39:
    speaker: crust
    en: What do you mean?
    ko: 그게 무슨 말이야?
    ja: どういうこと？
  event_trueflavor_prologue_40:
    speaker: bready
    en: I've found a new taste, and that's all I want to experience now.
    ko: 나는 새로운 맛을 찾아냈고, 그것만 맛보고 싶어.
    ja: |-
      新しい味を見つけたんだもの。
      それだけを味わいたいの。
  event_trueflavor_prologue_41:
    speaker: crust
    en: Are you talking about Mr. Gourmand?
    ko: 미식가님을 말하는 거야?
    ja: それって、グルメ様のこと？
  event_trueflavor_prologue_42:
    speaker: bready
    en: Yeah.
    ko: 응.
    ja: うん。
  event_trueflavor_prologue_43:
    speaker: bready
    en: So if Bonne Bouche doesn't come to the party, there's no point in me attending.
    ko: 그러니, 파티에 미미가 오지 않는다면 의미가 없지.
    ja: |-
      だから、美味のいないパーティーなんて
      意味がないの。
  event_trueflavor_prologue_44:
    speaker: bready
    en: I'm already familiar with the taste of your food,
    ko: 비슷한 맛만 나는 크러스트의 음식은….
    ja: 似たような味しかしないクラストの料理じゃ…
  event_trueflavor_prologue_45:
    speaker: bready
    en: so it isn't new, and it doesn't bring out joy in me.
    ko: 새롭지도 않고, 행복해지지도 않으니까.
    ja: 新鮮さも、幸せも感じられないから。
  event_trueflavor_prologue_46:
    speaker: crust
    en: "...!"
    ko: "……!!!"
    ja: "……！！！"
  event_trueflavor_prologue_47:
    speaker: crust
    en: But..
    ko: 나….
    ja: わ…
  event_trueflavor_prologue_48:
    speaker: crust
    en: But I...
    ko: 나는….
    ja: 私は…
  event_trueflavor_prologue_49:
    speaker: bready
    en: You'll have to enjoy the party without me, Crust.
    ko: 파티 즐겁게 해, 크러스트.
    ja: パーティー楽しんでね、クラスト。
  event_trueflavor_prologue_50:
    speaker: crust
    en: "!"
    ko: 어어…!
    ja: あっ…！
  event_trueflavor_prologue_51:
    speaker: crust
    en: W-wait!
    ko: 자, 잠깐만!
    ja: ま、待って！
  event_trueflavor_prologue_52:
    speaker: crust
    en: Bready!
    ko: 브래디이이!
    ja: ブレッディ！
  event_trueflavor_prologue_53:
    speaker: crust
    en: Huh?
    ko: 어어…?
    ja: "…あれ…？"
  event_trueflavor_prologue_54:
    speaker: crust
    en: Hold on... I'm in my room...
    ko: "…여긴, 내 방…?"
    ja: "…ここは…私の部屋…？"
  event_trueflavor_prologue_55:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_prologue_56:
    speaker: crust
    en: Whew... it was all just a dream.
    ko: 휴우~ 꿈이었구나.
    ja: な～んだ、夢だったんだ！
  event_trueflavor_prologue_57:
    speaker: crust
    en: Man, the weird stuff that my mind conjures up.
    ko: 나도 참, 괜히 이상한 생각을 해서는~!
    ja: こんな夢を見ちゃうなんて、ヘンなの！
  event_trueflavor_prologue_58:
    speaker: crust
    en: Anyway, this is a critical moment!
    ko: 이럴수록, 더 열심히 준비해서!
    ja: 正夢にならないように、頑張って準備して…
  event_trueflavor_prologue_59:
    speaker: crust
    en: I've gotta bust my butt and cook something that Bready will find delicious!
    ko: 브래디가 맛있게 먹을 수 있는 요리를 만들어 줘야지~
    ja: |-
      ブレッディにおいしい料理を
      作ってあげなきゃっ！
  event_trueflavor_prologue_60:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 보글보글-
    ja: グツグツ――
  event_trueflavor_prologue_61:
    speaker: crust
    en: Bubble bubble, let's boil the stew!
    ko: 보글보글~ 찌개를 끓여봐요~
    ja: グツグツ～お鍋を煮込みましょう～
  event_trueflavor_prologue_62:
    speaker: "<Narration>"
    en: "*Sizzle*"
    ko: 치이익-
    ja: ジューッ――
  event_trueflavor_prologue_63:
    speaker: crust
    en: Ssss, ssss, let's grill up the meat!
    ko: 칙- 칙- 고기를 구워봐요~
    ja: ジュ～ジュ～お肉を焼きましょう～
  event_trueflavor_prologue_64:
    speaker: "<Narration>"
    en: "*Clink clink*"
    ko: 달그락- 달그락-
    ja: カチャカチャ――
  event_trueflavor_prologue_65:
    speaker: crust
    en: Now we plate it up nicely, and...
    ko: 예쁘게 플레이팅을 하고 나면~
    ja: きれいにお皿を並べたら～
  event_trueflavor_prologue_66:
    speaker: crust
    en: Ta-da! The special multi-course breakfast is complete!
    ko: 짠! 모닝 특별 코스 요리 완성!
    ja: ジャーン！モーニングスペシャルコースの完成！
  event_trueflavor_prologue_67:
    speaker: crust
    en: Enjoy, Bready!
    ko: 맛있게 먹어, 브래디!
    ja: ブレッディ、どうぞ召し上がれ！
  event_trueflavor_prologue_68:
    speaker: bready
    en: "... Isn't this a bit overkill?"
    ko: "…양이 너무 많은데."
    ja: "…多すぎるわ。"
  event_trueflavor_prologue_69:
    speaker: crust
    en: Hehe, I got excited while cooking and maybe I did go a bit overboard.
    ko: 헤헤, 만들다 보니 신나서 많이 만들어버렸어.
    ja: えへへ、楽しくてつい作りすぎちゃった。
  event_trueflavor_prologue_70:
    speaker: crust
    en: If there are any leftovers, I'll pack them up in a lunchbox for you.
    ko: 남으면 도시락에다 싸줄게!
    ja: 残ったらお弁当にしてあげるね！
  event_trueflavor_prologue_71:
    speaker: bready
    en: Okay.
    ko: 응, 알겠어.
    ja: 分かったわ。
  event_trueflavor_prologue_72:
    speaker: bready
    en: Thanks for this.
    ko: 잘 먹을게.
    ja: それじゃ、いただきます。
  event_trueflavor_prologue_73:
    speaker: crust
    en: Sure thing!
    ko: 으응…!!
    ja: うんっ…！
  event_trueflavor_prologue_74:
    speaker: bready
    en: "*Chomp*"
    ko: 냠.
    ja: もぐ。
  event_trueflavor_prologue_75:
    speaker: bready
    en: Hmm...
    ko: 으음.
    ja: うん。
  event_trueflavor_prologue_76:
    speaker: bready
    en: The combination of ingredients is remarkable, and the flavor balance is impeccable.
    ko: 재료 조합도, 맛의 밸런스도 완벽해.
    ja: 食材の組み合わせも、味のバランスも完璧ね。
  event_trueflavor_prologue_77:
    speaker: bready
    en: You clearly were more emotionally invested in this than usual.
    ko: 게다가 오늘은 더 신나서 만들었네.
    ja: |-
      それに、今日はいつも以上に
      作るのが楽しかったみたいね。
  event_trueflavor_prologue_78:
    speaker: bready
    en: It's very cute, I must say.
    ko: 귀여워라.
    ja: かわいいわね。
  event_trueflavor_prologue_79:
    speaker: crust
    en: Okay, but what about the taste?
    ko: 마, 맛은…?
    ja: あ、味は…？
  event_trueflavor_prologue_80:
    speaker: crust
    en: What do you think?
    ko: 맛은 어때?
    ja: 味はどう？
  event_trueflavor_prologue_81:
    speaker: bready
    en: Hm...
    ko: 응.
    ja: うん。
  event_trueflavor_prologue_82:
    speaker: bready
    en: It's nice.
    ko: 늘 먹던 맛이야.
    ja: いつもの味よ。
  event_trueflavor_prologue_83:
    speaker: bready
    en: The taste is identical to what it usually is.
    ko: 맛있어.
    ja: おいしいわ。
  event_trueflavor_prologue_84:
    speaker: crust
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_trueflavor_prologue_85:
    speaker: crust
    en: So it hasn't changed...?
    ko: "…늘 먹던 맛."
    ja: "…いつもの味、かぁ。"
  event_trueflavor_prologue_86:
    speaker: crust
    en: Okay, that's it. I've decided.
    ko: |-
      응, 좋아.
      결정했어.
    ja: "…よし、決めた！"
  event_trueflavor_prologue_87:
    speaker: bready
    en: Decided what?
    ko: 뭘?
    ja: "…？何を？"
  event_trueflavor_prologue_88:
    speaker: crust
    en: I, Crust,
    ko: 나, 크러스트.
    ja: 私、クラストは…
  event_trueflavor_prologue_89:
    speaker: crust
    en: will be closing the kitchen!
    ko: 오늘부터 주방을 닫고!
    ja: 今日からキッチンを閉めて！
  event_trueflavor_prologue_90:
    speaker: crust
    en: Starting today, I will dedicate myself to researching food further!
    ko: 요리 연구에 들어가겠어!
    ja: 料理の研究に専念します！
  event_trueflavor_prologue_91:
    speaker: bready
    en: Where's this coming from all of a sudden?
    ko: "…갑자기?"
    ja: "…なんで急に？"
  event_trueflavor_prologue_92:
    speaker: crust
    en: And until my research is finished,
    ko: 그리고 연구가 끝날 때까지.
    ja: それと、研究が終わるまで…
  event_trueflavor_prologue_93:
    speaker: crust
    en: you, Bready, are banned from the kitchen!
    ko: 브래디는 주방에 출입 금지야!
    ja: ブレッディはキッチン立ち入り禁止ね！
  event_trueflavor_prologue_94:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_prologue_95:
    speaker: bready
    en: Excuse me?
    ko: 에엑?
    ja: ええっ？
event_trueflavor_01_s:
  event_trueflavor_01_s_1:
    speaker: "<Narration>"
    en: "*Ding Dong Dang Dong*"
    ko: 딩- 동- 댕- 동-
    ja: キーンコーンカーンコーン――
  event_trueflavor_01_s_2:
    speaker: crust
    en: Hello, students!
    ko: 안녕하세요, 학생 여러분!
    ja: みなさん、こんにちは！
  event_trueflavor_01_s_3:
    speaker: crust
    en: It's nice to meet you all.
    ko: |-
      저는 오늘 특별 수업을 맡게 된
      쿠킹오일 스쿼드의 크러스트라고 합니다!
    ja: |-
      今日の特別授業を担当する、
      クッキングオイル所属のクラストです！
  event_trueflavor_01_s_4:
    speaker: crust
    en: I'm Crust from the Cooking Oil Squad, and I've got a special lesson prepared
      for you today.
    ko: 만나서 반갑습니다~
    ja: お会いできて嬉しいです～
  event_trueflavor_01_s_5:
    speaker: students
    en: Whoooo!
    ko: 와아아~!
    ja: わあ～！
  event_trueflavor_01_s_6:
    speaker: crust
    en: And what's so special about today's lesson you ask?
    ko: 그리고 여기는~
    ja: そして、こちらは～
  event_trueflavor_01_s_7:
    speaker: crust
    en: We'll be having an assistant helping us today!
    ko: 오늘 저희를 도와주실 보조 선생님이세요!
    ja: 今日の授業のお手伝いをしてくれる先生です！
  event_trueflavor_01_s_8:
    speaker: "<Self>"
    en: Hello, everyone.
    ko: 안녕 얘들아.
    ja: こんにちは
  event_trueflavor_01_s_9:
    speaker: students
    en: Hello!
    ko: 안녕하세요~!
