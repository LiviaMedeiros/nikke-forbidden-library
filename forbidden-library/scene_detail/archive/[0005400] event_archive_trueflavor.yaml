    ko: 어째서 다들 그런 걸 물어보시는 거죠…?
    ja: どうしてお二人とも、同じことを…？
  event_trueflavor_05_s_59:
    speaker: crust
    en: I thought I knew what I was doing!
    ko: 저는 분명…!
    ja: 私は、ブレッディのために…！
  event_trueflavor_05_s_60:
    speaker: ade_c
    en: I think you've misunderstood the correlation between food and happiness.
    ko: 크러스트 아가씨는, 행복의 맛을 오해하고 계세요.
