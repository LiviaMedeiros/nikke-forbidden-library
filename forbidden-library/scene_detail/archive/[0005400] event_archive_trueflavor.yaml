    ja: |-
      エードはこの招待状を受け取ってから、
      期待と幸せを感じてたって言ってましたから！
  event_trueflavor_05_e_72:
    speaker: crust
    en: So when Bready arrives with her invitation in hand, I'll serve her a dish
      that will make her feel absolutely blissful.
    ko: |-
      그렇게 브래디가 초대장을 들고 도착하면,
