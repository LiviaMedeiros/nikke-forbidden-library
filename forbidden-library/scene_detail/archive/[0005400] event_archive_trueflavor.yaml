  event_trueflavor_05_s_78:
    speaker: crust
    en: And on top of that, the food was delicious.
    ko: 거기에 음식도 맛 있으니까….
    ja: それに、お料理もおいしかったから…
  event_trueflavor_05_s_79:
    speaker: crust
    en: "..."
    ko: 아….
    ja: あっ…
  event_trueflavor_05_s_80:
    speaker: crust
    en: "!!"
    ko: 아…!
    ja: そっか…！
  event_trueflavor_05_s_81:
    speaker: ade_c
