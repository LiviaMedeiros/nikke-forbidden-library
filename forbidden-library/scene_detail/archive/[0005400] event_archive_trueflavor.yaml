    ko: 달그락.
    ja: カチャ…
  event_trueflavor_04_e_39:
    speaker: ade_c
    en: I believe I'm finished.
    ko: 잘 먹었습니다.
    ja: ごちそうさまでした。
  event_trueflavor_04_e_40:
    speaker: "<Monologue>"
    en: After finishing the dessert, Ade puts her spoon down on the table.
    ko: |-
      디저트까지 전부 맛을 본 에이드는,
      스푼을 테이블에 내려놓았다.
    ja: |-
      食後のデザートまで味わったエードは、
      スプーンをテーブルに置いた
  event_trueflavor_04_e_41:
    speaker: ade_c
    en: That was an incredibly satisfying meal.
    ko: 정말 만족스러운 식사었어요.
    ja: 本当にすばらしいお料理ですね。
  event_trueflavor_04_e_42:
    speaker: ade_c
