  event_trueflavor_04_e_79:
    speaker: crust
    en: You make a heart with your hands like this, and...
    ko: 이렇게, 손을 하트 모양으로 만든 다음에~
    ja: こうして、手でハートを作って～
  event_trueflavor_04_e_80:
    speaker: crust
    en: Ooey gooey goodness,
