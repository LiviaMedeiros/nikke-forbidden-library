    en: Now... I'm not sure.
    ko: 지금은… 잘 모르겠어.
    ja: 今は…よく分からない。
  event_trueflavor_05_e_25:
    speaker: crust
    en: What were the feelings coursing through me during my research?
    ko: 최근에 내가 어떤 기분으로 요리를 연구했지?
