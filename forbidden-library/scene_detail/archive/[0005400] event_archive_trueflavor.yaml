      ありがとうございました！
  event_trueflavor_01_e_19:
    speaker: "<Self>"
    en: It was a fun experience for me too.
    ko: 나도 즐거운 경험이었어.
    ja: 私も楽しかった
  event_trueflavor_01_e_20:
    speaker: crust
    en: Where are you off to now?
    ko: 미식가님은 이제 어디로 가시나요?
    ja: えへへ…ところで、グルメ様はこの後どちらへ？
  event_trueflavor_01_e_21:
    speaker: "<Self>"
    en: I don't have any real plans, so I was planning on returning to the Commander's
      Room.
    ko: 오늘 일정은 더 없으니까, 지휘관실로 돌아갈 예정이야.
    ja: |-
      今日はもう予定がないから、
      指揮官室に戻るつもりだ
  event_trueflavor_01_e_22:
    speaker: crust
    en: I see.
    ko: 그렇군요.
    ja: そ、そうなんですね！
  event_trueflavor_01_e_23:
    speaker: crust
    en: Uh...
    ko: 그….
    ja: その…
  event_trueflavor_01_e_24:
    speaker: crust
    en: Are you hungry, by any chance?
    ko: 혹시, 배 안 고프신가요?!
    ja: お腹、空いてませんか！？
  event_trueflavor_01_e_25:
    speaker: "<Self>"
    en: Well, now that you mention it...
    ko: 배?
    ja: お腹？
  event_trueflavor_01_e_26:
    speaker: "<Monologue>"
    en: I've been smelling delicious food all day, but haven't been able to eat anything.
    ko: |-
      …그러고 보니, 하루 종일 맛있는 냄새만 맡고
      아무것도 먹지 못했다.
    ja: |-
      …そういえば、一日中おいしそうな匂いを
      かいでいたのに、何も食べていなかったな
  event_trueflavor_01_e_27:
    speaker: "<Narration>"
    en: "*Growl*"
    ko: 꼬르륵~
    ja: グゥゥ…
  event_trueflavor_01_e_28:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_trueflavor_01_e_29:
    speaker: crust
    en: Hehe, that tells me you're hungry, all right.
    ko: 헤헤, 배고프시군요!
    ja: あはは、お腹が空いているみたいですね！
  event_trueflavor_01_e_30:
    speaker: crust
    en: I at least got to sample the dishes the students made throughout the day,
      but you didn't get to eat anything.
    ko: |-
      저는 맛을 보느라 학생들의 음식들을 먹었는데,
      미식가님은 드시지 못하셨잖아요.
    ja: |-
      私は味見でみんなの料理を食べましたが、
      グルメ様は食べてませんよね。
  event_trueflavor_01_e_31:
    speaker: crust
    en: If you're free,
    ko: 그러니까 시간이 괜찮으시다면!
    ja: ですから、お時間さえよろしければ！
  event_trueflavor_01_e_32:
    speaker: crust
    en: would you like to come to my kitchen and have something to eat?
    ko: 저희 주방으로 가서 뭐라도 좀 드시겠어요?
    ja: キッチンに行って、何か召し上がりませんか？
  event_trueflavor_01_e_33:
    speaker: "<Self>"
    en: Would that be okay?
    ko: 와, 그래도 돼?
    ja: いいのか？
  event_trueflavor_01_e_34:
    speaker: crust
    en: Of course!
    ko: 물론이죠!
    ja: もちろんです！
  event_trueflavor_01_e_35:
    speaker: crust
    en: This was my first time working with students, and you were kind enough to
      agree to be my assistant.
    ko: |-
      학생들을 다루는 건 처음이라,
      보조 선생님으로 오셔서 도와달라고 제가 부탁했었으니까.
    ja: |-
      学生への授業は初めてだからと、
      サポートをお願いしてしまいましたし…
  event_trueflavor_01_e_36:
    speaker: crust
    en: Being able to repay you for that would be my pleasure.
    ko: 보답을 해드리고 싶거든요!
    ja: 何かお返しがしたいんです！
  event_trueflavor_01_e_37:
    speaker: "<Self>"
    en: Then allow me to graciously accept your offer.
    ko: 그럼 감사히 얻어먹어 볼까?
    ja: じゃあ、ありがたくいただこう
  event_trueflavor_01_e_38:
    speaker: crust
    en: Hehe, wonderful!
    ko: 와아아~! 좋아요!
    ja: わあ～！ぜひぜひ！
  event_trueflavor_01_e_39:
    speaker: crust
    en: Let's go!
    ko: 가시죠~!
    ja: では、さっそく行きましょう！
  event_trueflavor_01_e_40:
    speaker: crust
    en: Ta-da!
    ko: 짠!
    ja: ジャーン！
  event_trueflavor_01_e_41:
    speaker: crust
    en: Welcome to the Cooking Oil kitchen, where the air is filled with the aroma
      of delicious food.
    ko: 맛있는 향기가 가득한, 쿠킹오일의 주방에 도착했어요!
    ja: |-
      おいしい匂いでいっぱいの、
      クッキングオイルのキッチンに到着です！
  event_trueflavor_01_e_42:
    speaker: crust
    en: Have a seat over here, if you would.
    ko: 자, 여기 앉으시구요!
    ja: ささ、こちらへお掛けください！
  event_trueflavor_01_e_43:
    speaker: crust
    en: Wait just a minute, and I'll whip up something nice and special for you.
    ko: 금방 만들어서 드릴 테니, 조금만 기다려 주세요!
    ja: すぐ作るので、ちょっと待っててくださいね！
  event_trueflavor_01_e_44:
    speaker: "<Self>"
    en: No worries, you can take your time.
    ko: 천천히 해.
    ja: ゆっくりでいい
  event_trueflavor_01_e_45:
    speaker: crust
    en: Actually, I intended on inviting you here all along,
    ko: 정말 금방 나올 거예요.
    ja: |-
      えへへ、ありがとうございます。
      でも、あっという間に出来ますから！
  event_trueflavor_01_e_46:
    speaker: crust
    en: so I planned out the meal and prepped all the ingredients earlier.
    ko: 사실 오늘 미식가님을 초대하고 싶어서….
    ja: 実は今日、グルメ様を招待したくて…
  event_trueflavor_01_e_47:
    speaker: crust
    en: It really won't take any time at all.
    ko: 미리 코스도 다 짜고, 재료 손질까지 다 해놨거든요!
    ja: |-
      あらかじめコースも全部考えて、
      材料の下ごしらえも済ませておいたんです！
  event_trueflavor_01_e_48:
    speaker: "<Self>"
    en: I see!
    ko: 오오…!
    ja: おお…！
  event_trueflavor_01_e_49:
    speaker: crust
    en: Today's menu is a special seafood course.
    ko: 오늘은 해산물 특제 코스예요.
    ja: 今日は、海鮮スペシャルコースです！
  event_trueflavor_01_e_50:
    speaker: crust
    en: I'll start you off with a light appetizer.
    ko: 가벼운 애피타이저 먼저 준비해 드릴게요~
    ja: 前菜からご用意しますね～
  event_trueflavor_01_e_51:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 달그락.
    ja: カチャ…
  event_trueflavor_01_e_52:
    speaker: "<Monologue>"
    en: 'With cooking as wonderful as Crust''s, you need to experience it with multiple
      senses:'
    ko: 눈으로 한 번, 코로 한 번, 입으로 한 번.
    ja: 目で1回、鼻で1回、口で1回…
  event_trueflavor_01_e_53:
    speaker: "<Monologue>"
    en: First with sight, then smell, and then taste.
    ko: 크러스트의 요리는 이렇게 세 번 맛을 봐야 한다.
    ja: クラストの料理は、こうして3回は味わうべきだ
  event_trueflavor_01_e_54:
    speaker: "<Monologue>"
    en: To do anything less would be a disservice to such fine cuisine.
    ko: 그렇지 않으면 너무 아깝기 때문이다.
    ja: じゃないと、すごくもったいない気がする
  event_trueflavor_01_e_55:
    speaker: "<Self>"
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_01_e_56:
    speaker: "<Self>"
    en: It's... the best thing I've ever tasted.
    ko: 흑흑… 최고다.
    ja: ううっ…最高だ
  event_trueflavor_01_e_57:
    speaker: crust
    en: So you like it?
    ko: 맛은 괜찮으신가요?
    ja: お味はいかがですか？
  event_trueflavor_01_e_58:
    speaker: "<Self>"
    en: It's divine.
    ko: 너무 맛있어… 천상의 맛이야.
    ja: おいしすぎる…極上の味だ
  event_trueflavor_01_e_59:
    speaker: crust
    en: Hehe,
