    ko: 어쨌든, 더 시간을 뺏으면 안 되겠네요.
    ja: でも、お忙しい中ありがとうございました。
  event_trueflavor_01_e_14:
    speaker: marciana
    en: Everything's been taken care of, so you're free to leave whenever you like.
    ko: |-
      마무리까지 깔끔하게 해 주셨으니,
      이만 들어가 보셔도 좋을 것 같습니다.
    ja: |-
      片づけもきれいにしてくださったので、
      もうお帰りいただいても大丈夫ですよ。
  event_trueflavor_01_e_15:
    speaker: crust
    en: All right. Thank you again for the opportunity!
    ko: 네! 감사합니다!
    ja: はい！ありがとうございました！
  event_trueflavor_01_e_16:
    speaker: "<Self>"
    en: See you next time, Marciana.
    ko: 다음에 보자, 마르차나.
    ja: またな、マルチャーナ
