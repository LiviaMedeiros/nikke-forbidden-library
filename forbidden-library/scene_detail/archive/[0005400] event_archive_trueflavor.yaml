  event_trueflavor_01_e_78:
    speaker: "<Self>"
    en: What is it?
    ko: 어떤 부탁인데?
    ja: 何を手伝えばいいんだ？
  event_trueflavor_01_e_79:
    speaker: crust
    en: Well...
    ko: 으으음.
    ja: ええと…
  event_trueflavor_01_e_80:
    speaker: crust
    en: First...
    ko: 이, 일단….
    ja: と…とりあえず…
  event_trueflavor_01_e_81:
    speaker: crust
    en: Could I... lick you? Just once?
    ko: 저, 미식가님을 한 번 핥아봐도 될까요?!
    ja: あの、グルメ様をなめてみてもいいですか！？
  event_trueflavor_01_e_82:
    speaker: "<Self>"
    en: What?!
    ko: 뭐…?
    ja: え…？
  event_trueflavor_01_e_83:
    speaker: "<Self>"
    en: Not you too!
    ko: 크러스트, 너마저…!
    ja: クラスト…君まで…！
  event_trueflavor_01_e_84:
    speaker: crust
    en: It's not what you think!
    ko: 그, 그런 게 아녜요!
    ja: そ、そういうんじゃないんです！
  event_trueflavor_01_e_85:
    speaker: crust
    en: My taste certainly diverges from Bready's,
    ko: 저랑 브래디는 맛을 보는 기능이 다르긴 하지만.
    ja: |-
      私とブレッディは、
      味を感じる機能こそ違いますが…
  event_trueflavor_01_e_86:
    speaker: crust
    en: but I'm curious what it is about you that has Bready so obsessed with your
      flavor.
    ko: |-
      대체 미식가님에게 어떤 맛이 나길래
      브래디가 이렇게 좋아하는 걸까… 궁금해서요.
    ja: |-
      ブレッディがあそこまで喜ぶなんて、
      グルメ様からはどんな味がするんだろうって
      気になって気になって…
  event_trueflavor_01_e_87:
    speaker: "<Self>"
    en: Hm.
    ko: 아하.
    ja: なるほど
  event_trueflavor_01_e_88:
    speaker: "<Self>"
    en: So this is for research purposes, then?
    ko: 이것도 연구를 위해서구나.
    ja: それも研究のためか
  event_trueflavor_01_e_89:
    speaker: crust
    en: Precisely!
    ko: 그렇죠!
    ja: はい！
  event_trueflavor_01_e_90:
    speaker: crust
    en: If I taste you I might get some inspiration.
    ko: 미식가님을 맛보면 아이디어가 떠오르지 않을까 싶어서요, 헤헤.
    ja: |-
      グルメ様を味わったら、
      アイデアが浮かぶかもしれないので。えへへ。
  event_trueflavor_01_e_91:
    speaker: "<Self>"
    en: If that's the case, help yourself.
    ko: 그런 거라면, 알겠어.
    ja: そういうことなら、分かった
  event_trueflavor_01_e_92:
    speaker: "<Monologue>"
    en: After washing my hands in the sink, I hold them out to Crust.
    ko: |-
      나는 싱크대에서 손을 씻은 후,
      크러스트에게 내밀었다.
    ja: |-
      私は流し台で手を洗うと、
      クラストに差し出した
  event_trueflavor_01_e_93:
    speaker: "<Self>"
    en: Here you are.
    ko: 자, 여기.
    ja: さあ、どうぞ
  event_trueflavor_01_e_94:
    speaker: crust
    en: Wow!
    ko: 와아!
    ja: わあ！
  event_trueflavor_01_e_95:
    speaker: crust
    en: Thanks for agreeing to this.
    ko: 흔쾌히 허락해 주셔서 감사해요.
    ja: ご快諾くださり、ありがとうございます。
  event_trueflavor_01_e_96:
