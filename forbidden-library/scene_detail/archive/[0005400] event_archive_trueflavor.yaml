    ko: 초대해 주셔서 감사해요.
    ja: 本日はお招きいただき、ありがとうございます。
event_trueflavor_04_e:
  event_trueflavor_04_e_1:
    speaker: crust
    en: Wow!
    ko: 우와아…!
    ja: わああ…！
  event_trueflavor_04_e_2:
    speaker: crust
    en: I almost didn't recognize you without the maid uniform.
    ko: |-
      메, 메이드 복이 아니라 사복이어서
      못 알아볼 뻔했어요!
    ja: |-
      メ、メイド服じゃなくて私服だったので
      一瞬分かりませんでした！
  event_trueflavor_04_e_3:
    speaker: "<Self>"
    en: This is my first time seeing you in casual dress as well, Ade.
    ko: 그러게, 나도 사복 에이드는 처음인데.
    ja: ああ、私も私服のエードは初めて見た
  event_trueflavor_04_e_4:
    speaker: ade_c
    en: Today, I'm simply a guest who's come to taste Miss Crust's cooking.
    ko: 오늘은, 크러스트 아가씨의 음식을 먹기 위해 방문한 손님이니까요.
    ja: |-
      今日は、クラストお嬢様のお料理をいただく
      訪問客としてまいりましたので…
  event_trueflavor_04_e_5:
    speaker: ade_c
    en: I therefore dressed accordingly.
    ko: 그에 걸맞은 의상을 착용해 보았어요.
    ja: それにふさわしい装いにしてみました。
  event_trueflavor_04_e_6:
    speaker: ade_c
    en: I don't look strange, do I?
    ko: 이상하지는 않나요?
    ja: おかしくありませんか？
  event_trueflavor_04_e_7:
    speaker: "<Self>"
    en: Not at all. You look great.
    ko: 정말 잘 어울려.
    ja: とてもよく似合っている
  event_trueflavor_04_e_8:
    speaker: ade_c
    en: Thank you, Master.
    ko: 감사합니다, 주인님.
    ja: ありがとうございます、ご主人様。
  event_trueflavor_04_e_9:
    speaker: ade_c
    en: Is it all right if I sit here, Miss Crust?
    ko: 크러스트 아가씨, 저는 여기에 앉으면 될까요?
    ja: |-
      クラストお嬢様、
      こちらに座ってもよろしいでしょうか？
  event_trueflavor_04_e_10:
    speaker: crust
    en: Oh, yes...!
    ko: 아, 네…!
    ja: あ、はい…！
  event_trueflavor_04_e_11:
    speaker: crust
    en: Please, make yourself comfortable.
    ko: 편하게 앉으세요~!
    ja: お好きな席へどうぞ～！
  event_trueflavor_04_e_12:
    speaker: ade_c
    en: It's an honor to have the opportunity to taste your cooking.
    ko: 아가씨의 음식을 맛볼 수 있는 기회를 주신다니, 영광이에요.
    ja: |-
      お嬢様の料理を味わう機会を
      いただけるなんて、光栄です。
  event_trueflavor_04_e_13:
    speaker: ade_c
    en: I'm sure I'll enjoy myself.
    ko: 즐겁게 식사하겠습니다.
    ja: 大切に味わわせていただきますね。
  event_trueflavor_04_e_14:
    speaker: crust
    en: I poured my heart and soul into these dishes, so please enjoy!
    ko: 헤헤, 열심히 준비했으니 맛있게 드셔주세요!!
    ja: |-
      えへへ、たくさん用意したので
      ぜひ召し上がってください！
  event_trueflavor_04_e_15:
    speaker: "<Narration>"
    en: "*Clink clink*"
    ko: 달그락- 달그락-
    ja: カチャカチャ…
  event_trueflavor_04_e_16:
    speaker: "<Monologue>"
    en: Crust begins to serve a multi-course meal, starting with the appetizer.
    ko: |-
      크러스트의 코스 요리는,
      에피타이저부터 순차적으로 나왔고.
    ja: |-
      クラストのコース料理は、
      前菜から順番に提供され…
  event_trueflavor_04_e_17:
    speaker: "<Monologue>"
    en: One by one, Ade carefully tastes each dish as they're presented to her.
    ko: |-
      에이드는 하나, 하나
      신중하게 맛을 보았다.
    ja: |-
      その一つ一つを、
      エードはじっくりと味わった
  event_trueflavor_04_e_18:
    speaker: crust
    en: I can see now why you insisted that I prepare this specific dish, Mr. Gourmand.
    ko: |-
      이래서 미식가님이
      이 음식을 꼭 준비해달라고 하셨군요.
    ja: |-
      えへへ、グルメ様がこの料理を
      リクエストされた理由が分かった気がします。
  event_trueflavor_04_e_19:
    speaker: "<Self>"
    en: Mmm.
    ko: 맞아.
    ja: そうか
  event_trueflavor_04_e_20:
    speaker: ade_c
    en: And what dish would that be?
    ko: 어떤 음식인가요?
    ja: ふふ、どのようなお料理ですか？
  event_trueflavor_04_e_21:
    speaker: crust
    en: 'This here is the main entrée:'
    ko: 헤헤~ 그건 바로바로오~
    ja: えへへ～それはぁ～
  event_trueflavor_04_e_22:
    speaker: crust
