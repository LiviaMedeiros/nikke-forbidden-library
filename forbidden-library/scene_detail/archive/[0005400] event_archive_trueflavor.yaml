    ko: 이 세상에 없는 새로운 디저트를 만들어야겠네요오.
    ja: |-
      この世にはない新しいスイーツを
      作らなきゃですねぇ。
  event_trueflavor_03_e_77:
    speaker: crust
    en: Yes! That's exactly what we should do!
    ko: 네, 그거예요!
    ja: その通りです！
  event_trueflavor_03_e_78:
    speaker: crust
    en: The only thing is...
    ko: 그런데 그렇게 되면….
    ja: でも、そうなると…
  event_trueflavor_03_e_79:
    speaker: crust
    en: If we do that, it might end up tasting like nothing special.
    ko: 그냥 평범하게 맛이 나는 디저트가 되어버려서 안 돼요.
    ja: |-
      普通の味がするスイーツになってしまうから
      ダメなんです。
  event_trueflavor_03_e_80:
    speaker: crust
    en: I've got to make something that will really knock her socks off.
    ko: |-
      제가 만들어야 하는 건,
      더 특별해야 하거든요.
    ja: |-
      私が作らなきゃいけないのは、
      もっと特別なものなので…
  event_trueflavor_03_e_81:
    speaker: tia_s
    en: I see...
    ko: 우웅….
    ja: う～ん…
  event_trueflavor_03_e_82:
    speaker: "<Monologue>"
    en: Tia peruses through the ingredients lined up on the kitchen table.
    ko: 티아는 주방 테이블에 줄지어 있는 재료들 훑어보았다.
    ja: |-
      ティアはキッチンテーブルに並んでいる
      食材をざっと確認した
  event_trueflavor_03_e_83:
    speaker: tia_s
    en: I dunno, this all looks special enough to me...
    ko: "…충분히 특별해 보이는 데에…."
    ja: "…十分、特別に見えるけどぉ…"
  event_trueflavor_03_e_84:
    speaker: crust
    en: Anyway, I'll take the lead, and you can pitch in whenever possible.
    ko: |-
      아무튼, 제가 메인으로 진행할 테니까
      옆에서 많이 도와주세요!
    ja: |-
      とにかく、私がメインで進めるので
      隣でたくさんお手伝いをお願いします！
  event_trueflavor_03_e_85:
    speaker: crust
    en: Oh, and feel free to tell me any suggestions you have at any point.
    ko: |-
      아! 의견 같은 거 있으면
      언제든 말씀해 주시구요~!
    ja: |-
      あっ！いいアイデアがあれば
      いつでも言ってくださいね～！
  event_trueflavor_03_e_86:
    speaker: tia_s
    en: Sure thing.
    ko: 네에~
    ja: は～い！
  event_trueflavor_03_e_87:
    speaker: crust
    en: Oh, and one more thing before we begin.
    ko: 아, 요리를 시작하기 전에!
    ja: じゃあ、料理を始める前に！
  event_trueflavor_03_e_88:
    speaker: crust
    en: Tia, could you perhaps lick Mr. Gourmand and explain what he tastes like?
    ko: |-
      티아, 혹시 미식가님을 한 번 핥아보고
      어떤 맛이 나는지 설명해 주실 수 있나요?
    ja: |-
      ティア、グルメ様を一度なめて、
      どんな味がするか教えてくれませんか？
  event_trueflavor_03_e_89:
    speaker: tia_s
    en: "... Excuse me?"
    ko: "…네에~?"
    ja: "…はい～？"
  event_trueflavor_03_e_90:
    speaker: "<Self>"
    en: Here we go again...
    ko: 하아….
    ja: はぁ…
