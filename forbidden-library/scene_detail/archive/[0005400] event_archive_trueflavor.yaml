    ja: |-
      ブレッディお嬢様が召し上がると考えて、
      お料理を作っていただけますか？
  event_trueflavor_05_s_18:
    speaker: crust
    en: R-right now?
    ko: 지, 지금요?
    ja: い、今からですか？
  event_trueflavor_05_s_19:
    speaker: crust
