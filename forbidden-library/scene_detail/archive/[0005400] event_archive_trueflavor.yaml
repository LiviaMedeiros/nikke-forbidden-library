    ko: 네! 궁금해요!
    ja: はい！気になります！
  event_trueflavor_05_s_13:
    speaker: crust
    en: I'm dying to know!
    ko: 저는 진심으로….
    ja: 私は絶対…
  event_trueflavor_05_s_14:
    speaker: crust
    en: I want nothing more than for Bready to feel happy when eating my cooking.
    ko: 브래디가 제 음식을 행복하게 먹어주면 좋겠거든요!
    ja: ブレッディを私の料理で幸せにしたいんです！
  event_trueflavor_05_s_15:
