    ja: |-
      でも、私が幸せな味を届けたい相手は、
      食の好みがちょっと特殊なんです。
  event_trueflavor_04_e_53:
    speaker: ade_c
    en: I see.
    ko: 그렇군요.
    ja: さようですか。
  event_trueflavor_04_e_54:
    speaker: ade_c
    en: Hmm...
    ko: 음.
    ja: うーん…
  event_trueflavor_04_e_55:
    speaker: ade_c
    en: If it's okay, could I serve you a plate of omurice?
    ko: |-
      혹시, 제가 아가씨에게
      오므라이스 한 접시를 대접해 드려도 괜찮을까요?
    ja: |-
      …よければ、今度は私がお嬢様に
      オムライスを作ってもよろしいでしょうか？
  event_trueflavor_04_e_56:
    speaker: crust
    en: You want to make me some omurice?
    ko: 에이드가요?
    ja: 私に…ですか？
  event_trueflavor_04_e_57:
    speaker: ade_c
    en: Yes.
    ko: 네.
    ja: はい。
  event_trueflavor_04_e_58:
    speaker: ade_c
    en: I intended on remaining simply a guest today,
    ko: 오늘은 손님 역할에 충실하려고 했지만….
    ja: 今日はお客様役に徹しようと思いましたが…
  event_trueflavor_04_e_59:
    speaker: ade_c
    en: but after eating such a delicious meal, it just doesn't sit well with me.
    ko: |-
      이렇게 맛있는 음식을 먹었는데
      가만히 있을 수는 없을 것 같아요.
    ja: |-
      こんなにおいしいお料理を食べたら、
      じっとしていられませんね。
  event_trueflavor_04_e_60:
    speaker: ade_c
    en: Last time you came to the Maid Cafe, you left having eaten subpar omurice.
    ko: |-
      그리고, 지난번에 오셨을 때는
      맛없는 오므라이스만 드시고 가셨으니까요.
    ja: |-
      それに、この前お越しいただいた時は
      おいしくないオムライスを
      提供してしまったので。
  event_trueflavor_04_e_61:
    speaker: crust
    en: All right, if you insist...
    ko: 그, 그렇게까지 얘기하시면….
    ja: そ、そこまでおっしゃるのでしたら…
  event_trueflavor_04_e_62:
