    ja: えっと…
  event_trueflavor_04_s_87:
    speaker: crust
    en: You look awfully familiar...
    ko: 당신은, 어디선가 많이 봤는데….
    ja: あなたは、どこかで…
  event_trueflavor_04_s_88:
    speaker: crust
    en: Hey!
    ko: 어어?!
    ja: "…あっ！？"
  event_trueflavor_04_s_89:
    speaker: crust
    en: You're that maid from before!
    ko: 지난번에 뵀던, 메이드시군요!!
    ja: 先日お会いした、メイドさんですか！？
  event_trueflavor_04_s_90:
    speaker: ade_c
    en: That's right.
    ko: 네, 맞아요.
    ja: ええ。
  event_trueflavor_04_s_91:
    speaker: ade_c
    en: My name is Ade, and I work at the Maid Cafe.
    ko: 메이드 카페에서 일하고 있는, 에이드랍니다.
    ja: メイドカフェで働いているエードと申します。
  event_trueflavor_04_s_92:
    speaker: ade_c
