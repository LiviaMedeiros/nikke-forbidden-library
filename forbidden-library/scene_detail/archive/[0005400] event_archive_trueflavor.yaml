    ko: 그렇다면 다행이네요….
    ja: それならよかったです…！
  event_trueflavor_04_e_52:
    speaker: crust
    en: but the person I want to make happy has quite a unique palate.
    ko: |-
      하지만 제가 행복한 맛을 느끼게 해주고 싶은 사람은
