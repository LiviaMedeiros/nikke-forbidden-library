  event_trueflavor_04_e_68:
    speaker: crust
    en: Wow,
    ko: 와아….
    ja: わあ…
  event_trueflavor_04_e_69:
    speaker: crust
    en: I've never sat in my own kitchen and watched someone cook before.
    ko: 저, 여기에 앉아서 누군가 요리하는 모습을 보는 건 처음이에요!
