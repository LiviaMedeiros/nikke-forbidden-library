    ko: 그럼 부디, 맛있게 드셔주세요.
    ja: では、どうぞお召し上がりください。
  event_trueflavor_04_e_85:
    speaker: crust
    en: All right!
    ko: 네! 잘 먹겠습니다~
    ja: はい！いただきま～す！
  event_trueflavor_04_e_86:
    speaker: crust
    en: "*Chomp*"
    ko: 와압~!!
    ja: あむっ！
  event_trueflavor_04_e_87:
    speaker: crust
    en: "*Nom nom*"
    ko: 우물우물….
    ja: もぐもぐ…
  event_trueflavor_04_e_88:
    speaker: crust
    en: "...?!"
    ko: "……?!"
    ja: "……！？"
event_trueflavor_05_s:
  event_trueflavor_05_s_1:
    speaker: crust
    en: Oh my goodness!
    ko: 와아…!
    ja: わあ…！
  event_trueflavor_05_s_2:
    speaker: crust
    en: It... it's sublime!
    ko: 너, 너무 맛있어요!
    ja: と、とてもおいしいです！
  event_trueflavor_05_s_3:
    speaker: crust
    en: It's better than I could have ever expected!
    ko: 생각했던 것보다, 더요!
    ja: 思っていたよりも、ずっと！
  event_trueflavor_05_s_4:
    speaker: crust
    en: The texture is out of this world, and it's been seasoned to perfection.
    ko: 식감도 너무 좋고, 간도 딱 맞아요!
    ja: 食感もよくて、味付けもばっちりです！
  event_trueflavor_05_s_5:
    speaker: ade_c
    en: That's all thanks to the spell you cast.
    ko: 아가씨께서 거신 마법의 주문 덕분이랍니다.
    ja: お嬢様が唱えた魔法の呪文のおかげです。
  event_trueflavor_05_s_6:
    speaker: crust
    en: It really does feel like I'm under a spell.
    ko: 네… 정말 마법에라도 걸린 것 같아요.
    ja: はい…本当に魔法にでもかかったみたいです。
  event_trueflavor_05_s_7:
    speaker: crust
    en: My heart feels like it's overflowing, and I have this goofy grin on my face.
    ko: 마음이 따뜻해지고, 저도 모르게 웃음이 지어져요.
