    ko: 에이드는 행복함을 느끼셨나요?
    ja: 幸せな気分になりましたか？
  event_trueflavor_04_e_48:
    speaker: ade_c
    en: Ever since I received that invitation from you yesterday, I've felt a sense
      of joy,
    ko: 네, 어제 초대장을 받은 이후에는 계속 설렜고.
    ja: |-
      はい。昨日、招待状を受け取ってから
      ずっとワクワクしていました。
  event_trueflavor_04_e_49:
    speaker: ade_c
    en: and that's continued all the way through the entire meal today.
    ko: 오늘 음식을 맛보는 내내, 계속 행복했어요.
    ja: |-
      そして今日、お料理をいただいている間…
      ずっと幸せな気持ちに包まれておりました。
  event_trueflavor_04_e_50:
    speaker: ade_c
    en: Even your own enthusiasm while preparing the food was infectious, and made
      me feel cheerful.
    ko: |-
      바로 옆에서 신나게 준비하시는
      아가씨의 모습을 보는 것조차 말이에요.
    ja: |-
      隣で楽しそうに準備されている
      お嬢様の姿を見るだけでも胸がいっぱいです。
  event_trueflavor_04_e_51:
    speaker: crust
