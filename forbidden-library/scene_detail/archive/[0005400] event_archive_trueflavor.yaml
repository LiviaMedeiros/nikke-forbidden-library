    en: Front row seats to the show. How exciting!
    ko: 엄청 설레는 자리였군요, 여기~!
    ja: こんなにワクワクする席だったんですね！
  event_trueflavor_04_e_71:
    speaker: "<Self>"
    en: Seeing someone else cook for you naturally lifts your spirits.
    ko: |-
      응, 나를 위해 요리해 주는 사람을 보고 있으면
