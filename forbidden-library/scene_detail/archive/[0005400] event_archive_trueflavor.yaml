  event_trueflavor_04_e_82:
    speaker: ade_c
    en: Perfect!
    ko: 정확하세요!
    ja: その通りです！
  event_trueflavor_04_e_83:
    speaker: crust
    en: Hehe.
    ko: 헤헤~
    ja: えへへ～
  event_trueflavor_04_e_84:
    speaker: ade_c
