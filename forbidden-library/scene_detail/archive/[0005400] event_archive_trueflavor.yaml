    ko: 먹어보실 거라면 참는 게 좋으실 거예요.
    ja: 食べるのは我慢した方がいいと思います…
  event_trueflavor_05_s_45:
    speaker: crust
    en: Bready has rather unusual tastes, so I used some unorthodox methods.
    ko: |-
      브래디의 입맛이 좀 특이해서,
