    ko: 저는 점수도 높게 받지 못했었는데, 헤헤.
    ja: あんまりいい成績じゃなかったのにぃ、えへへ。
  event_trueflavor_03_e_17:
    speaker: crust
    en: Well, the score is based on a set system of criteria, so while I may not have
      been able to give you a high score,
    ko: 점수는… 정해진 기준이 있어서 높게 드리지 못했어요.
    ja: |-
      それは…決められた基準があるので、
      高得点をつけるのが難しくて…
  event_trueflavor_03_e_18:
    speaker: crust
    en: the fact that you made a dish which perfectly suited you impressed me.
    ko: 하지만, 본인의 입맛에 딱 맞는 음식을 만들었다는 점이.
    ja: |-
      でも、自分の好みにぴったり合った
      料理を作ったことや、
  event_trueflavor_03_e_19:
    speaker: crust
    en: I also found it moving you made another dish tailored to a friend's taste.
    ko: |-
      또, 다른 친구의 입맛에 맞춘 음식도 따로 만들었다는 점이
      정말 기억에 남았어요.
    ja: |-
      友だちの好みに合わせた料理まで
      作ったことがすごく印象的で…
  event_trueflavor_03_e_20:
    speaker: crust
    en: In fact, that's the reason I'm here right now.
    ko: 저도 오늘 그런 요리를 하려고 나온 거거든요!
    ja: 私も今日は、そんな料理がしたいんです！
  event_trueflavor_03_e_21:
    speaker: tia
    en: Ah!
    ko: 아하아~
    ja: なるほどぉ～
  event_trueflavor_03_e_22:
    speaker: tia
    en: In that case, I think I might be able to help.
    ko: 그런 거라면 제가 도와드릴 수 있을 것 같아요~
    ja: それなら、役に立てそうですねぇ～
  event_trueflavor_03_e_23:
    speaker: crust
    en: Glad to hear it!
    ko: 헤헤, 엄청 든든하네요!
    ja: えへへ、とても心強いです！
  event_trueflavor_03_e_24:
    speaker: crust
    en: Then do you want to get changed first?
    ko: 그럼, 옷부터 갈아입을까요?
    ja: じゃあ、まずは着替えましょうか。
  event_trueflavor_03_e_25:
    speaker: tia
