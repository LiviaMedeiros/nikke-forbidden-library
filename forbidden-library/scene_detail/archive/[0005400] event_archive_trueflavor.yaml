    en: All right... here I go.
    ko: 그, 그럼 핥아볼게요…!
    ja: じゃ、じゃあ失礼します…！
  event_trueflavor_01_e_97:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_01_e_98:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_trueflavor_01_e_99:
    speaker: crust
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_trueflavor_01_e_100:
    speaker: "<Self>"
    en: How is it?
    ko: 어때?
    ja: どうだ？
  event_trueflavor_01_e_101:
    speaker: crust
    en: "..."
    ko: 으음~
    ja: んん～
  event_trueflavor_01_e_102:
    speaker: crust
    en: I'm not sure.
    ko: 잘 모르겠어요!
    ja: よく分かりません！
  event_trueflavor_01_e_103:
    speaker: crust
    en: Nothing's really standing out to me.
    ko: 저는 아무런 맛도 느껴지지 않아요.
    ja: 私は何の味も感じませんね。
  event_trueflavor_01_e_104:
    speaker: crust
    en: I figured that'd be the case.
    ko: 역시….
    ja: やっぱり…
  event_trueflavor_01_e_105:
    speaker: crust
    en: Hmm...
    ko: 흐으음.
    ja: う～ん。
  event_trueflavor_01_e_106:
    speaker: crust
    en: Mr. Gourmand,
    ko: 미식가님!
    ja: グルメ様！
  event_trueflavor_01_e_107:
    speaker: crust
    en: can I ask you for one more favor?
    ko: 하나 더 부탁드려도 될까요?
    ja: もう一つお願いしてもいいですか？
  event_trueflavor_01_e_108:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: 何だ？
  event_trueflavor_01_e_109:
    speaker: crust
    en: Could you write down everything Bready said after tasting you?
    ko: |-
      브래디가 미식가님을 맛보고 나서 하는 말들을
      기록해 주실 수 있나요?
    ja: |-
      ブレッディがグルメ様を味見した後に
      言う言葉を、記録してくれませんか？
  event_trueflavor_01_e_110:
    speaker: "<Self>"
    en: Er... all of it?
    ko: 그, 그걸 따로 기록하라고?
    ja: き、記録？
  event_trueflavor_01_e_111:
    speaker: crust
    en: Yes, please!
    ko: 네!
    ja: はい！
  event_trueflavor_01_e_112:
    speaker: crust
    en: It's not too much of an imposition, is it?
    ko: 혹시… 곤란하실까요?
    ja: その…ご迷惑でしょうか？
  event_trueflavor_01_e_113:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_01_e_114:
    speaker: "<Self>"
    en: Okay, I'll try.
    ko: 알겠어, 노력해 볼게….
    ja: 分かった。努力してみよう…
event_trueflavor_02_s:
  event_trueflavor_02_s_1:
    speaker: "<Narration>"
    en: A few days after receiving Crust's request.
    ko: "…크러스트의 부탁을 받고, 며칠 후."
    ja: "…クラストに頼まれてから、数日後"
  event_trueflavor_02_s_2:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_trueflavor_02_s_3:
    speaker: "<Narration>"
    en: "*Lick lick*"
    ko: 할짝- 할짝-
    ja: ペロッ、ペロッ――
  event_trueflavor_02_s_4:
    speaker: bready
    en: Mmm, so sweet.
    ko: 으음, 달콤해.
    ja: うーん、甘いわ。
  event_trueflavor_02_s_5:
    speaker: bready
    en: Your hand is delectable when it's covered in chocolate.
    ko: 초콜릿을 뿌린 미미의 손, 너무 맛있어.
    ja: チョコをふりかけた美味の手、すごくおいしい。
  event_trueflavor_02_s_6:
    speaker: "<Self>"
    en: Haven't you already tried this with chocolate before?
    ko: "…초콜릿은 지난번에 먹어봤잖아."
    ja: "…チョコはこの間も食べただろう？"
  event_trueflavor_02_s_7:
    speaker: bready
    en: Last time was with dark chocolate. Today it's milk chocolate.
    ko: |-
      그때는 다크 초콜릿이었고,
      오늘은 밀크 초콜릿이야.
    ja: |-
      この間はダークチョコで、
      今日はミルクチョコよ。
  event_trueflavor_02_s_8:
    speaker: bready
    en: This is sweeter, so it's even better than before.
    ko: 이쪽이 더 달아서 좋네.
    ja: こっちの方が甘くていいわ。
  event_trueflavor_02_s_9:
    speaker: bready
    en: Could I spend the whole day licking your hand?
    ko: 오늘 하루 종일 핥아도 돼?
    ja: 一日中、なめててもいい？
  event_trueflavor_02_s_10:
    speaker: "<Self>"
    en: Absolutely not.
    ko: 절대 안 돼.
    ja: 絶対にダメだ
  event_trueflavor_02_s_11:
    speaker: bready
    en: Too bad.
    ko: 아쉬워라.
    ja: そう？残念。
  event_trueflavor_02_s_12:
    speaker: "<Self>"
    en: Don't you need to go back to the kitchen at some point?
    ko: 브래디야말로 주방에 안 가봐도 돼?
    ja: 今日はキッチンに行かなくていいのか？
  event_trueflavor_02_s_13:
    speaker: bready
    en: Quite the opposite. I couldn't go even if I wanted to.
    ko: 음, 가고 싶어도 못 가.
    ja: それが、行きたくても行けないの。
  event_trueflavor_02_s_14:
    speaker: bready
    en: Crust is apparently doing some cooking-related research, and told me I'm banned
      until it's finished.
    ko: |-
      크러스트가 요리 연구를 하는데,
      연구가 끝날 때까지 출입 금지래.
    ja: |-
      クラストが料理の研究をしているんだけど、
      研究が終わるまでは入っちゃダメだって。
  event_trueflavor_02_s_15:
    speaker: "<Self>"
    en: She won't even allow you inside the kitchen?
    ko: 출입 금지라고?
    ja: 入っちゃダメ？
  event_trueflavor_02_s_16:
    speaker: bready
    en: Nope.
    ko: 응.
    ja: うん。
  event_trueflavor_02_s_17:
    speaker: bready
    en: To be honest, I'm a little startled. Nothing like this has ever happened before.
    ko: 이런 적은 처음이라 조금 당황스러워.
    ja: |-
      今までこんなことなかったから、
      私もどうしたらいいのか。
  event_trueflavor_02_s_18:
    speaker: bready
    en: Do you think something might be wrong?
    ko: 무슨 일 있는 건 아니겠지?
    ja: 何かあったのかしら？
  event_trueflavor_02_s_19:
    speaker: "<Self>"
    en: Have you heard anything more from Crust after the ban?
    ko: 크러스트에게 뭐 들은 건 없었고?
    ja: クラストは何も？
  event_trueflavor_02_s_20:
    speaker: bready
    en: Not a word.
    ko: 응, 없었어.
    ja: うん。
  event_trueflavor_02_s_21:
    speaker: bready
    en: She said that if she needed anything, she'd call me.
    ko: 도움이 필요할 때 부르겠다는 말 빼고는.
    ja: 手伝ってほしい時は呼ぶねって言われただけ。
  event_trueflavor_02_s_22:
    speaker: "<Self>"
    en: I see.
    ko: 그랬구나.
    ja: そうだったのか
  event_trueflavor_02_s_23:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_s_24:
    speaker: bready
    en: Still, I do like that I get more time to taste you, Bonne Bouche.
    ko: 그래도, 미미의 맛을 볼 수 있는 시간이 길어져서 그건 좋아.
    ja: でも、美味を味わう時間が増えたのは嬉しいわ。
  event_trueflavor_02_s_25:
    speaker: "<Self>"
    en: I think you've licked off all the chocolate by now...
    ko: 이미 초콜릿이 묻은 부분은 다 핥은 것 같은데….
    ja: |-
      もうチョコがついた部分は
      全部なめた気がするが…
  event_trueflavor_02_s_26:
    speaker: bready
    en: Let me taste a little bit more.
    ko: 조금만 더 맛보게 해줘.
    ja: うーん、もう少しだけ味わわせて。
  event_trueflavor_02_s_27:
    speaker: "<Narration>"
    en: "*Lick lick*"
    ko: 할짝- 할짝-
    ja: ペロッ、ペロッ――
  event_trueflavor_02_s_28:
    speaker: bready
    en: Absolutely divine.
    ko: 맛있어.
    ja: ふふ、おいしいわ。
  event_trueflavor_02_s_29:
    speaker: bready
    en: The taste is completely unique to me, completely pure.
    ko: 새로운 맛이야… 온전한 맛이야….
    ja: こんな味初めて…純粋な味だわ…
  event_trueflavor_02_s_30:
    speaker: bready
    en: I'm so happy!
    ko: 행복해~
    ja: 幸せ。
  event_trueflavor_02_s_31:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_s_32:
    speaker: "<Monologue>"
    en: If I let Crust know the full extent of Bready's reactions and descriptions,
    ko: 다른 건 모르겠고, 이 소리를 크러스트가 들을 거라고 생각하니.
    ja: |-
      味のことは分からないが、この発言を
      クラストが知ることになると思うと…
  event_trueflavor_02_s_33:
    speaker: "<Monologue>"
    en: something tells me it'd break her heart.
    ko: 진지하게 죽을 맛이었다.
    ja: 身を切られるような思いがした
  event_trueflavor_02_s_34:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_s_35:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_s_36:
    speaker: crust
    en: "*Sigh*..."
    ko: 하아….
    ja: ふう…
  event_trueflavor_02_s_37:
    speaker: crust
    en: I knew it.
    ko: 역시 그렇군요.
    ja: やっぱり、そうだったんですね。
  event_trueflavor_02_s_38:
    speaker: "<Self>"
    en: W-wait, don't get the wrong idea!
    ko: 그, 이상한 오해는 하지 말고-
    ja: その、変な誤解は――
  event_trueflavor_02_s_39:
    speaker: crust
    en: Thank you, Mr. Gourmand.
    ko: 감사해요 미식가님.
    ja: ありがとうございます、グルメ様。
  event_trueflavor_02_s_40:
    speaker: crust
    en: Now I know for sure.
    ko: 이제 확실히 알았어요.
    ja: これではっきりしました。
  event_trueflavor_02_s_41:
    speaker: "<Self>"
    en: Know what?
    ko: 응? 뭘?
    ja: ん？何がだ？
  event_trueflavor_02_s_42:
    speaker: crust
    en: Bready doesn't care about normal food or how it tastes.
    ko: 브래디에게 일반적인 음식의 맛은 중요하지 않아요.
    ja: |-
      ブレッディが求めてるのは、
      普通の食べ物の味じゃない。
  event_trueflavor_02_s_43:
    speaker: crust
    en: She needs something pure,
    ko: 기억도 정보도 없는 맛이 필요한 거예요.
    ja: 記憶も情報もない味なんです。
  event_trueflavor_02_s_44:
    speaker: crust
    en: where information doesn't even factor into the equation.
    ko: 가능할지는 모르겠지만.
    ja: できるかどうかは分かりませんが…
  event_trueflavor_02_s_45:
    speaker: crust
    en: I'm going to try and create a dish which has the taste that she craves!
    ko: 저는 그런 맛이 나는 요리를 만들어 보겠어요!
    ja: 私は、そんな味がする料理を作ってみせます！
  event_trueflavor_02_s_46:
    speaker: "<Self>"
    en: Are you sure you can make something like that?
    ko: 그런 걸 만들 수 있어?
    ja: そんなものが作れるのか？
  event_trueflavor_02_s_47:
    speaker: crust
    en: To be honest...
    ko: 글쎄요….
    ja: どうでしょう…
  event_trueflavor_02_s_48:
    speaker: crust
    en: I'm not sure, hehe.
    ko: 솔직히 자신은 없어요, 헤헤….
    ja: 正直、自信はありません。えへへ…
  event_trueflavor_02_s_49:
    speaker: crust
    en: I may not be brimming with confidence, but I'm gonna give it a shot regardless!
    ko: 그래도 한 번 시도해 보는 거죠~!
    ja: でも、試してみたいんです！
  event_trueflavor_02_s_50:
    speaker: crust
    en: I want to make food with my own hands that will make Bready happy!
    ko: |-
      제 손으로 브래디를 행복하게 만들 음식을
      만들고 싶으니까요!
    ja: この手でブレッディを幸せにする料理を…
  event_trueflavor_02_s_51:
    speaker: crust
    en: Something meant just for her!
    ko: 브래디만을 위한 요리를요!
    ja: ブレッディのためだけの料理を！
  event_trueflavor_02_s_52:
    speaker: "<Self>"
    en: Sounds impressive.
    ko: 대단하네.
    ja: すごいな
  event_trueflavor_02_s_53:
    speaker: "<Self>"
    en: Let me know if there's anything I can help with.
    ko: 내가 도울 게 있으면 언제든 말해줘, 알았지?
    ja: 手伝えることがあったら、いつでも言ってくれ
  event_trueflavor_02_s_54:
    speaker: crust
    en: Well,
    ko: 앗, 정말요?
    ja: えへへ、本当ですか？
  event_trueflavor_02_s_55:
    speaker: crust
    en: since you offered...
    ko: 그러면 으음….
    ja: じゃあ、うーん…
  event_trueflavor_02_s_56:
    speaker: crust
    en: Would you be interested in being my cooking assistant?
    ko: 혹시 요리 보조로 저를 좀 도와주실 수 있나요?
    ja: 助手をしていただけませんか？
  event_trueflavor_02_s_57:
    speaker: "<Self>"
    en: I'm not that good at cooking...
    ko: 나 요리 잘 못 하는데….
    ja: 料理はからきしなんだが…
  event_trueflavor_02_s_58:
    speaker: crust
    en: That's okay.
    ko: 괜찮아요!
    ja: 大丈夫です！
  event_trueflavor_02_s_59:
    speaker: crust
    en: Actually, you're essential for the recipe I'm working on.
    ko: 미식가님이 꼭 필요한 조리법을 구상 중이거든요.
    ja: |-
      グルメ様無しじゃ作れない
      レシピを考案中なので！
  event_trueflavor_02_s_60:
    speaker: "<Self>"
    en: Really?
    ko: 그래?
    ja: 私なしでは作れないレシピ？
  event_trueflavor_02_s_61:
    speaker: "<Self>"
    en: Very well then, I'll do what I can.
    ko: 좋아, 나도 힘내볼게.
    ja: "…分かった、努力しよう"
  event_trueflavor_02_s_62:
    speaker: crust
    en: Thank you!
    ko: 네! 감사합니다!
    ja: はい！ありがとうございます！
  event_trueflavor_02_s_63:
    speaker: "<Narration>"
    en: "*Bang bang*"
    ko: 탕! 탕!
    ja: トントンッ！
  event_trueflavor_02_s_64:
    speaker: "<Narration>"
    en: "*Scrape scrape*"
    ko: 스윽- 스윽-
    ja: サッ、サッ――
  event_trueflavor_02_s_65:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_s_66:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 보글보글-
    ja: グツグツ――
  event_trueflavor_02_s_67:
    speaker: "<Narration>"
    en: "*Sizzle*"
    ko: 치이익-
    ja: ジューッ――
  event_trueflavor_02_s_68:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_s_69:
    speaker: "<Narration>"
    en: "*Cut cut*"
    ko: 사악- 사악-
    ja: コトコト――
  event_trueflavor_02_s_70:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 덜그럭.
    ja: カチャッ
  event_trueflavor_02_s_71:
    speaker: "<Self>"
    en: Uh...
    ko: 그….
    ja: その…
  event_trueflavor_02_s_72:
    speaker: "<Self>"
    en: Shouldn't I be doing more than sitting back and watching you?
    ko: 나는 계속 이렇게 구경만 하는 거야?
    ja: ただ見ているだけでいいのか？
  event_trueflavor_02_s_73:
    speaker: crust
    en: Oh, sorry, Mr. Gourmand, I forgot you were there.
    ko: 아! 미식가님.
    ja: あっ、グルメ様！
  event_trueflavor_02_s_74:
    speaker: crust
    en: You can help me now.
    ko: 지금이에요, 저를 도와주세요.
    ja: 今です！手伝ってください！
  event_trueflavor_02_s_75:
    speaker: "<Self>"
    en: What do I need to do?
    ko: 오! 뭘 하면 되는데?
    ja: おっ！何をすればいいんだ？
  event_trueflavor_02_s_76:
    speaker: crust
    en: Rub your fingers
    ko: 완성된 소스랑 음식들을.
    ja: 完成したソースと料理を…
  event_trueflavor_02_s_77:
    speaker: crust
    en: in everything that I've made.
    ko: 손가락으로 문질러주세요!
    ja: 指でこすってください！
  event_trueflavor_02_s_78:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……ん？"
event_trueflavor_02_e:
  event_trueflavor_02_e_1:
    speaker: crust
    en: Bready said that food touched by your hands tastes pure to her.
    ko: |-
      브래디는 분명, 미식가님의 손에 묻은 음식들은
      온전한 맛이 난다고 했었어요.
    ja: |-
      前にブレッディが、グルメ様の手についた
      食べ物は純粋な味がするって言ってたんです。
  event_trueflavor_02_e_2:
    speaker: crust
    en: So I figured if we go backwards from there,
    ko: 그러니, 반대로 생각해서.
    ja: だから、逆転の発想で…
  event_trueflavor_02_e_3:
    speaker: crust
    en: perhaps you touching this food will imbue it
    ko: |-
      미식가님의 손으로 음식들을 만지면,
      그 음식들은 온전한 맛으로 바뀌지 않을까요?
    ja: |-
      グルメ様が触れた料理は、
      純粋な味になるんじゃないかと思って。
  event_trueflavor_02_e_4:
    speaker: crust
    en: with the taste that Bready yearns for.
    ko: 그걸 시도해 보는 거예요!
    ja: それを試してみようかと！
  event_trueflavor_02_e_5:
    speaker: crust
    en: I think it'll make for a fantastic experiment, don't you?
    ko: 어때요, 아주 멋진 아이디어죠?
    ja: とても素敵なアイデアだと思いませんか？
  event_trueflavor_02_e_6:
    speaker: "<Self>"
    en: Um... sure.
    ko: 으, 으응….
    ja: そ、そうだな…
  event_trueflavor_02_e_7:
    speaker: crust
    en: The soups and stews are still hot, so you can start with the other dishes
      first.
    ko: 국이랑 수프는 뜨거우니까, 나머지 것들 먼저 부탁드려요!
    ja: |-
      スープは熱いので、
      他のものを先にお願いします！
  event_trueflavor_02_e_8:
    speaker: "<Self>"
    en: You really want me to rub my hands over these?
    ko: 꼭 문질러야 해?
    ja: 本当にこすらないとダメか？
  event_trueflavor_02_e_9:
    speaker: crust
    en: I certainly do! It'll be the perfect way to imbue them with your flavor.
    ko: 네! 그래야 효과가 좋지 않을까요?
    ja: はい！その方が効果的な気がしませんか？
  event_trueflavor_02_e_10:
    speaker: "<Self>"
    en: Isn't that a hygiene issue?
    ko: 위생은 괜찮은 거야?
    ja: 衛生的には問題ないのか？
  event_trueflavor_02_e_11:
    speaker: crust
    en: It'll be fine.
    ko: 괜찮지 않을까요?
    ja: 大丈夫だと思いますよ？
  event_trueflavor_02_e_12:
    speaker: crust
    en: Bready slurps on your fingers without the thought of hygiene ever crossing
      her mind.
    ko: |-
      브래디는 미식가님을
      그런 거 신경 쓰지 않고 핥으니까요~!
    ja: |-
      ブレッディがグルメ様をなめる時は、
      そんなことを気にしてなさそうでしたから！
  event_trueflavor_02_e_13:
    speaker: "<Monologue>"
    en: Seeing the glint in Crust's eye, I can tell she is being completely serious.
    ko: |-
      반짝반짝한 눈으로 바라보는 크러스트를 보니,
      농담은 아닌 듯하다.
    ja: |-
      クラストはキラキラしたまなざしを向けている。
      冗談ではなさそうだ
  event_trueflavor_02_e_14:
    speaker: "<Self>"
    en: "*Sigh*..."
    ko: 하아….
    ja: はぁ…
  event_trueflavor_02_e_15:
    speaker: "<Monologue>"
    en: I reluctantly start to caress the food before me,
    ko: 나는 부디 이걸로 크러스트가 원하는 요리가 나오길 빌며.
    ja: |-
      クラストが望む料理になることを
      願いながら…
  event_trueflavor_02_e_16:
    speaker: "<Monologue>"
    en: hoping that it will lead to the results Crust is after.
    ko: 음식들에 손을 대기 시작했다.
    ja: 意を決して料理に触れた
  event_trueflavor_02_e_17:
    speaker: crust
    en: Very good.
    ko: 좋아요, 완성했어요!
    ja: ありがとうございます、これで完成です！
  event_trueflavor_02_e_18:
    speaker: crust
    en: Now, for the taste test.
    ko: 맛을 한 번 봐볼게요!
    ja: さっそく味見してみますね！
  event_trueflavor_02_e_19:
    speaker: "<Self>"
    en: You're going to taste it as well?
    ko: 그, 그걸 크러스트 너도 먹게?
    ja: ク、クラストも食べるのか？
  event_trueflavor_02_e_20:
    speaker: crust
    en: Of course!
    ko: 당연하죠!
    ja: 当然です！
  event_trueflavor_02_e_21:
    speaker: crust
    en: Tasting the final product is essential.
    ko: 요리를 완성하고 맛을 보는 건, 필수라구요.
    ja: 完成した料理の味見は欠かせませんから。
  event_trueflavor_02_e_22:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_e_23:
    speaker: crust
    en: Thanks for your "special ingredient", Mr. Gourmand, hehe!
    ko: 헤헤, 잘 먹겠습니다!
    ja: えへへ、いただきます！
  event_trueflavor_02_e_24:
    speaker: crust
    en: "*Slurp*"
    ko: 호로록-
    ja: ゴクッ
  event_trueflavor_02_e_25:
    speaker: crust
    en: "*Crunch crunch* *Nom nom nom*"
    ko: 우적우적, 냠냠냠….
    ja: ぱくぱく、もぐもぐ…
  event_trueflavor_02_e_26:
    speaker: crust
    en: Hmm... still tastes ordinary to me.
    ko: 음, 맛은 평범하네요.
    ja: うーん、味は普通ですね。
  event_trueflavor_02_e_27:
    speaker: crust
    en: There's no major difference from the food I usually make.
    ko: 평소에 만들던 거랑 크게 차이는 없어요.
    ja: |-
      いつも作っているものと
      それほど変わりありません。
  event_trueflavor_02_e_28:
    speaker: crust
    en: Still, the last step is to have Bready come and taste it!
    ko: 그럼, 이제 이 음식을 먹어줄 브래디만 오면 돼요!
    ja: あとは、ブレッディが来るのを待つだけですね！
  event_trueflavor_02_e_29:
    speaker: "<Self>"
    en: Didn't you ban her from the kitchen for a while?
    ko: 브래디는 당분간 주방 출입 금지 아니었어?
    ja: |-
      ブレッディはしばらくキッチンに
      立ち入り禁止じゃなかったのか？
  event_trueflavor_02_e_30:
    speaker: crust
    en: I did, but if I want her to taste this stuff, she needs to be here.
    ko: 맛을 볼 때는 있어야 하니까요.
    ja: 味見をする時は別ですよ～！
  event_trueflavor_02_e_31:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 댕-!
    ja: チーン！
  event_trueflavor_02_e_32:
    speaker: "<Monologue>"
    en: Crust gingerly rings the bell.
    ko: 크러스트는 콜벨을 손으로 가볍게 내리쳤고.
    ja: クラストが手で軽くベルを鳴らすと…
  event_trueflavor_02_e_33:
    speaker: "<Monologue>"
    en: Shortly after, Bready enters.
    ko: 얼마 되지 않아, 브래디가 들어왔다.
    ja: すぐにブレッディがやってきた
  event_trueflavor_02_e_34:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_trueflavor_02_e_35:
    speaker: bready
    en: Wow.
    ko: 와아.
    ja: わあ。
  event_trueflavor_02_e_36:
    speaker: bready
    en: It's only been a few days, but it feels like it's been ages since I was in
      the kitchen.
    ko: 주방, 며칠 못 왔다고 엄청 오랜만이네.
    ja: |-
      キッチンに来るの、
      すごく久しぶりな気がするわ。
  event_trueflavor_02_e_37:
    speaker: bready
    en: Is your research finished?
    ko: 연구는 다 끝난 거야?
    ja: 研究は終わったの？
  event_trueflavor_02_e_38:
    speaker: crust
    en: For the moment, yes.
    ko: 일단은.
    ja: とりあえずはね！
  event_trueflavor_02_e_39:
    speaker: crust
    en: I want you to taste what I came up with.
    ko: 그래서 브래디가 맛을 봐줬으면 해.
    ja: だから、ブレッディに味見してほしいの。
  event_trueflavor_02_e_40:
    speaker: bready
    en: Sure.
    ko: 응, 알겠어.
    ja: 分かったわ。
  event_trueflavor_02_e_41:
    speaker: bready
    en: I didn't imagine I'd see you here, Bonne Bouche.
    ko: 그런데 미미는 여기서 뭐 하고 있어?
    ja: ところで、美味はここで何を？
  event_trueflavor_02_e_42:
    speaker: "<Self>"
    en: Oh... I was just lending Crust a hand.
    ko: 아… 크러스트를 좀 도와줬어.
    ja: "…その、クラストを手伝っていたんだ"
  event_trueflavor_02_e_43:
    speaker: bready
    en: I see.
    ko: 그렇구나.
    ja: そうなのね。
  event_trueflavor_02_e_44:
    speaker: bready
    en: No wonder there was no one in the Commander's Room.
    ko: 어쩐지, 지휘관실에 찾아가도 아무도 없더라니.
    ja: どうりで、指揮官室にいないわけだわ。
  event_trueflavor_02_e_45:
    speaker: bready
    en: "... *Gulp*"
    ko: "…꿀꺽."
    ja: "…ゴクッ。"
  event_trueflavor_02_e_46:
    speaker: crust
    en: Here it is!
    ko: 자, 여기 있어!
    ja: はい、どうぞ！
  event_trueflavor_02_e_47:
    speaker: bready
    en: You made quite a spread.
    ko: 엄청 많이 했네?
    ja: たくさん作ったのね。
  event_trueflavor_02_e_48:
    speaker: bready
    en: I've actually been missing your cooking.
    ko: 안 그래도 크러스트가 해준 음식이 그리웠거든.
    ja: |-
      ちょうど、クラストの料理が
      食べたいと思ってたの。
  event_trueflavor_02_e_49:
    speaker: bready
    en: Well, cheers.
    ko: 잘 먹을게.
    ja: いただきます。
  event_trueflavor_02_e_50:
    speaker: bready
    en: "*Nom nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_02_e_51:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_e_52:
    speaker: crust
    en: "..."
    ko: 흐으으….
    ja: ふぅぅ…
  event_trueflavor_02_e_53:
    speaker: crust
    en: How is it?
    ko: 어, 어때?
    ja: ど、どう？
  event_trueflavor_02_e_54:
    speaker: bready
    en: Hmm...
    ko: 으음.
    ja: うーん。
  event_trueflavor_02_e_55:
    speaker: bready
    en: The taste is a little different...
    ko: 맛이 좀 다른데….
    ja: 少し味が違うような…
  event_trueflavor_02_e_56:
    speaker: crust
    en: I knew it! I knew you'd pick up on that.
    ko: 그치?! 역시 브래디는 바로 눈치챌 줄 알았어!
    ja: |-
      でしょ！？
      ブレッディならすぐ気づいてくれると思った！
  event_trueflavor_02_e_57:
    speaker: crust
    en: Does it taste pure?
    ko: 그래서, 온전한 맛이 느껴져?
    ja: 純粋な食べ物の味が感じられる？
  event_trueflavor_02_e_58:
    speaker: crust
    en: Are you happy?
    ko: 행복해?
    ja: 今、幸せ？
  event_trueflavor_02_e_59:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_e_60:
    speaker: bready
    en: I'm afraid not.
    ko: 아니, 아니야.
    ja: ううん。
  event_trueflavor_02_e_61:
    speaker: bready
    en: This isn't quite the flavor I envisioned in my mind.
    ko: 이건 내가 생각했던 맛이 아니야.
    ja: 私が思っていた味とは違うわ。
  event_trueflavor_02_e_62:
    speaker: crust
    en: Oh... maybe because I'm still in the early stages of my research.
    ko: 연구용 요리라서 그런 걸 거야~
    ja: きっと研究用の料理だからだよ～
  event_trueflavor_02_e_63:
    speaker: bready
    en: Maybe...
    ko: 그래…?
    ja: そうかしら…？
  event_trueflavor_02_e_64:
    speaker: crust
    en: That has to be it, definitely!
    ko: 응, 응!
    ja: うんっ！
  event_trueflavor_02_e_65:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_e_66:
    speaker: bready
    en: Okay, I'll give my evaluation.
    ko: 알겠어, 그럼 평가를 내릴게.
    ja: 分かったわ。じゃあ、正直に言うわね。
  event_trueflavor_02_e_67:
    speaker: bready
    en: To be honest, I'm not entirely sure what kind of flavor you were aiming for.
    ko: 솔직히 무슨 맛을 내고 싶은 건지 잘 모르겠어.
    ja: |-
      どんな味を伝えたいのかが、
      よく分からなかったわ。
  event_trueflavor_02_e_68:
    speaker: bready
    en: For something that you made, this is all oddly flat in terms of taste and
      the emotion behind it.
    ko: |-
      크러스트가 한 것 치고는
      맛도 감정도 모두 평범해.
    ja: |-
      クラストが作ったにしては、
      味も感情も普通すぎた。
  event_trueflavor_02_e_69:
    speaker: bready
    en: Nothing in particular stands out.
    ko: 뭔가 특별히 느껴지는 것도 없고.
    ja: 特別なものも感じなかったし。
  event_trueflavor_02_e_70:
    speaker: crust
    en: Mmm, I see.
    ko: 음! 그렇구나!
    ja: なるほど…！そっか！
  event_trueflavor_02_e_71:
    speaker: crust
    en: I appreciate the evaluation.
    ko: 평가해 줘서 고마워!
    ja: 正直に言ってくれてありがとう！
  event_trueflavor_02_e_72:
    speaker: crust
    en: I'll get back to it and call you when I'm ready.
    ko: 좀 더 연구를 한 다음에 다시 부를게.
    ja: もう少し研究したら、また感想を聞かせて。
  event_trueflavor_02_e_73:
    speaker: bready
    en: Okay.
    ko: 응.
    ja: うん。
  event_trueflavor_02_e_74:
    speaker: bready
    en: But, may I ask what kind of research you're doing?
    ko: 그런데, 무슨 연구를 하고 있는 건지 물어봐도 될까?
    ja: ねえ、一体何の研究をしているの？
  event_trueflavor_02_e_75:
    speaker: crust
    en: I'm afraid I can't tell you.
    ko: 아니, 그건 말해줄 수 없어.
    ja: それは言えないの。
  event_trueflavor_02_e_76:
    speaker: crust
    en: If I accomplish what I'm after, you'll know what I was aiming for as soon
      as you eat it.
    ko: |-
      왜냐하면, 연구를 성공하게 되면
      브래디가 먹자마자 바로 알 수 있을 거거든!
    ja: |-
      研究がうまくいけば、
      食べた瞬間すぐに分かるはずだから！
  event_trueflavor_02_e_77:
    speaker: bready
    en: Hmm...
    ko: 음.
    ja: うーん。
  event_trueflavor_02_e_78:
    speaker: bready
    en: You're right.
    ko: 그래.
    ja: 分かった。
  event_trueflavor_02_e_79:
    speaker: bready
    en: I've never seen you this motivated before.
    ko: 크러스트가 간만에 요리 연구에 대한 의욕이 불타나 보네.
    ja: |-
      クラスト、久しぶりに
      料理の研究に燃えてるのね。
  event_trueflavor_02_e_80:
    speaker: bready
    en: Very well. I hope you succeed.
    ko: 나도 응원하고 있을게.
    ja: なら、応援してるわ。
  event_trueflavor_02_e_81:
    speaker: crust
    en: Thanks, and wait for my call.
    ko: 응! 기다려줘, 브래디!
    ja: うん！待っててね、ブレッディ！
  event_trueflavor_02_e_82:
    speaker: "<Monologue>"
    en: Bready smiles before leaving the kitchen,
    ko: 크러스트는 팔을 붕붕 흔들었고.
    ja: クラストは腕をぶんぶん振り…
  event_trueflavor_02_e_83:
    speaker: "<Monologue>"
    en: and Crust waves goodbye excitedly.
    ko: 브래디는 가볍게 웃으며, 식당을 나갔다.
    ja: |-
      ブレッディは軽く微笑みながら、
      食堂を後にした
  event_trueflavor_02_e_84:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_02_e_85:
    speaker: "<Monologue>"
    en: Despite her outward enthusiasm,
    ko: 하지만 나도 모르게.
    ja: "…しかし、気のせいだろうか"
  event_trueflavor_02_e_86:
    speaker: "<Monologue>"
    en: I can't help but feel that Bready looks a bit lonely.
    ko: 브래디의 뒷모습이, 조금은 쓸쓸해 보인다고 생각했다.
    ja: ブレッディの後ろ姿が、少し寂しそうに見えた
event_trueflavor_03_s:
  event_trueflavor_03_s_1:
    speaker: crust
    en: "..."
    ko: 음!
    ja: はぁ～！
  event_trueflavor_03_s_2:
    speaker: crust
    en: I had figured it wouldn't succeed on the first attempt.
    ko: 역시 한 번에 되지는 않는군요.
    ja: やっぱり、1回じゃ無理でしたね。
  event_trueflavor_03_s_3:
    speaker: crust
    en: But what could've been the problem?
    ko: 뭐가 문제였을까요.
    ja: 何が問題だったんでしょうか…？
  event_trueflavor_03_s_4:
    speaker: crust
    en: Hmm...
    ko: 흐으으음….
    ja: う～～ん…
  event_trueflavor_03_s_5:
    speaker: crust
    en: Maybe we need more than just your touch, Mr. Gourmand.
    ko: 미식가님의 손길이 닿는 정도는 안 되는 걸까요?
    ja: グルメ様が触るくらいじゃダメなんでしょうか？
  event_trueflavor_03_s_6:
    speaker: "<Self>"
    en: I think the methodology was flawed to begin with.
    ko: 애초에 방법이 잘못된 것 같은데….
    ja: そもそも、方法が間違っているような…
  event_trueflavor_03_s_7:
    speaker: crust
    en: Oh, I've got it!
    ko: 아!
    ja: あ！
  event_trueflavor_03_s_8:
    speaker: crust
    en: There might be too many ingredients.
    ko: 너무 많은 재료가 들어가서 그럴 수도 있어요.
    ja: |-
      ひょっとしたら、
      食材が多すぎたのかもしれません！
  event_trueflavor_03_s_9:
    speaker: crust
    en: If purity is what you're after, you've got to do away with all the extraneous
      emotions, information, and stories.
    ko: 감정, 정보, 이야기들이 없어야 온전한 맛이 날 테니까요.
    ja: |-
      感情や情報、物語があると
      純粋な味を感じられませんから。
  event_trueflavor_03_s_10:
    speaker: crust
    en: This time,
    ko: 좋아요, 그렇다면!
    ja: "…うん、そういうことなら！"
  event_trueflavor_03_s_11:
    speaker: crust
    en: I'll make something that focuses on a singular taste.
    ko: 이번에는 한 가지 맛에 집중할 수 있는 걸 만들어 보겠어요!
    ja: |-
      今度は1つの味に集中できるものを
      作ってみますね！
  event_trueflavor_03_s_12:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 덜그럭- 덜그럭-
    ja: コトコト――
  event_trueflavor_03_s_13:
    speaker: "<Narration>"
    en: "*Sizzle*"
    ko: 치이이익-
    ja: ジュウウッ――
  event_trueflavor_03_s_14:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 댕-!
    ja: チーン！
  event_trueflavor_03_s_15:
    speaker: crust
    en: How about this, Bready?
    ko: 이건 어때, 브래디?
    ja: ブレッディ、これはどう？
  event_trueflavor_03_s_16:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_17:
    speaker: bready
    en: To put it nicely, it's keeping things simple.
    ko: 좋게 말하면 담백해.
    ja: よく言えば、シンプルね。
  event_trueflavor_03_s_18:
    speaker: bready
    en: To put it bluntly, it seems unfinished.
    ko: 나쁘게 말하면 미완성인 것 같아.
    ja: 悪く言えば、未完成って感じよ。
  event_trueflavor_03_s_19:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 덜그럭- 덜그럭-
    ja: コトコト――
  event_trueflavor_03_s_20:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 보글보글-
    ja: グツグツ――
  event_trueflavor_03_s_21:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 댕-!
    ja: チーン！
  event_trueflavor_03_s_22:
    speaker: crust
    en: Here, this one should be better.
    ko: 자, 이건 좀 괜찮을 거야!
    ja: 今回はうまくいったかも！
  event_trueflavor_03_s_23:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_24:
    speaker: bready
    en: It doesn't really taste like much.
    ko: 별맛이 없어.
    ja: あんまり味がしないわ。
  event_trueflavor_03_s_25:
    speaker: bready
    en: It's a bit of a stretch to even call this food.
    ko: 요리라고 하기에도 참 애매하네.
    ja: 料理と言えるのかさえ、微妙なところね。
  event_trueflavor_03_s_26:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 덜그럭- 덜그럭-
    ja: コトコト――
  event_trueflavor_03_s_27:
    speaker: "<Narration>"
    en: "*Bang bang*"
    ko: 탕- 탕-
    ja: トン、トン――
  event_trueflavor_03_s_28:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 댕-!
    ja: チーン！
  event_trueflavor_03_s_29:
    speaker: crust
    en: H-how about this?
    ko: "…이, 이건 어때?"
    ja: "…こ、これはどう？"
  event_trueflavor_03_s_30:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_31:
    speaker: bready
    en: "*Sigh*"
    ko: 하아.
    ja: はあ。
  event_trueflavor_03_s_32:
    speaker: bready
    en: Crust, I appreciate your enthusiasm.
    ko: 크러스트, 의욕이 넘치는 건 좋은데.
    ja: クラスト、やる気があるのはいいことだけど…
  event_trueflavor_03_s_33:
    speaker: bready
    en: But the plates you're giving me are seeming less and less like proper food.
    ko: 점점 음식이 아닌 게 나오는 것 같아.
    ja: だんだん料理から遠ざかってる気がするわ。
  event_trueflavor_03_s_34:
    speaker: crust
    en: It may seem that way,
    ko: 그렇게 보일 수도 있지만…!
    ja: そ、そう見えるかもしれないけど…！
  event_trueflavor_03_s_35:
    speaker: crust
    en: but at least you can taste it!
    ko: 브래디는 맛을 느낄 수 있을 테니까.
    ja: ブレッディなら、味を感じられるはずだから！
  event_trueflavor_03_s_36:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_37:
    speaker: bready
    en: Is your research about trying to make a dish with only one ingredient?
    ko: 한 가지 재료로 제대로 된 음식을 만드는 연구인 건가…?
    ja: |-
      1つの食材で本格的な料理を作る
      研究なのかしら...？
  event_trueflavor_03_s_38:
    speaker: crust
    en: Huh? What was that?
    ko: 으응? 뭐라고 했어, 브래디?
    ja: ん？ブレッディ、何か言った？
  event_trueflavor_03_s_39:
    speaker: bready
    en: Nothing. I'll try it.
    ko: 아무것도 아니야, 먹어볼게.
    ja: 何でもない。食べてみるわね。
  event_trueflavor_03_s_40:
    speaker: bready
    en: "*Nom*"
    ko: 냠.
    ja: もぐ…
  event_trueflavor_03_s_41:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_42:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_43:
    speaker: bready
    en: I am picking up the natural flavor of the ingredients.
    ko: 재료 본연의 맛이 확실하게 느껴져.
    ja: 素材本来の味が確かに感じられるわ。
  event_trueflavor_03_s_44:
    speaker: bready
    en: It has enough nutrients, and the texture isn't too bad.
    ko: 영양소도 충분하고, 식감도 나쁘지 않아.
    ja: 栄養素も豊富で、食感も悪くない。
  event_trueflavor_03_s_45:
    speaker: bready
    en: The portion size isn't too big, and it's nice and light.
    ko: 크기도 작고, 무게도 가벼워.
    ja: それに、小さくて軽いわね。
  event_trueflavor_03_s_46:
    speaker: bready
    en: I don't know if this is what your research is about, but this could potentially
      be useful as an emergency ration for when we go up to the surface.
    ko: |-
      이걸 위한 연구였는지는 모르겠지만,
      지상에 올라갈 때 비상식량으로 유용하겠어.
    ja: |-
      このための研究だったのかは分からないけど、
      地上に行った時の非常食としてよさそうね。
  event_trueflavor_03_s_47:
    speaker: crust
    en: Oh, really?
    ko: 아… 그, 그래?!
    ja: あっ…そ、そう！？
  event_trueflavor_03_s_48:
    speaker: crust
    en: Well, since it's an ingredient that doesn't spoil easily, that might not be
      a bad idea, hehe.
    ko: |-
      금방 상하는 재료는 아니라서,
      나쁘지 않을지도 모르겠다~ 헤헤.
    ja: |-
      腐りやすい食材でもないから、
      悪くないかもね！えへへ。
  event_trueflavor_03_s_49:
    speaker: bready
    en: Mmm.
    ko: 응.
    ja: うん。
  event_trueflavor_03_s_50:
    speaker: bready
    en: "... But that's not what you were after, was it?"
    ko: "…연구의 방향이 이쪽은 아니었구나."
    ja: "…このための研究じゃなかったのね。"
  event_trueflavor_03_s_51:
    speaker: crust
    en: Thank you for your help today, Bready!
    ko: 오늘 도와줘서 고마워, 브래디!
    ja: 今日も手伝ってくれてありがとう、ブレッディ！
  event_trueflavor_03_s_52:
    speaker: crust
    en: Thanks to your insightful commentary, I've realized I still have a way to
      go.
    ko: 덕분에 아직 부족하다는 걸 알았어.
    ja: |-
      おかげで、まだまだ課題は
      山積みってことが分かったよ。
  event_trueflavor_03_s_53:
    speaker: crust
    en: I'll be in touch once I've made some more improvements.
    ko: 조금 더 보완한 다음에, 다시 부를게!
    ja: もう少し工夫したら、また呼ぶね！
  event_trueflavor_03_s_54:
    speaker: bready
    en: Are you going to keep at it today?
    ko: 오늘, 연구 더 할 거야?
    ja: 今日も遅くまで研究するの？
  event_trueflavor_03_s_55:
    speaker: crust
    en: No, I've been cooking all day, so I'm tired.
    ko: 아니… 하루 종일 연구하고 요리하고 했더니 피곤해.
    ja: ううん…研究続きで少し疲れちゃった。
  event_trueflavor_03_s_56:
    speaker: crust
    en: It's getting late too, so I should get some rest.
    ko: 시간도 많이 늦었고, 쉬어야지.
    ja: もう夜も遅いし、休まなきゃ。
  event_trueflavor_03_s_57:
    speaker: bready
    en: Yes,
    ko: 응.
    ja: そっか。
  event_trueflavor_03_s_58:
    speaker: bready
    en: be sure to rest properly while you're doing all this.
    ko: 쉬어가면서 해.
    ja: あんまり無理しないでね。
  event_trueflavor_03_s_59:
    speaker: bready
    en: I'm still not entirely sure what you're doing here, but whatever it is, you
      don't need to be in a hurry.
    ko: |-
      뭔지는 모르겠지만,
      이렇게 급하게 할 필요는 없을 테니까.
    ja: |-
      詳しいことは分からないけど、
      そんなに急ぐ必要はなさそうだから。
  event_trueflavor_03_s_60:
    speaker: crust
    en: Okay!
    ko: 알겠어!
    ja: うん、ありがとう！
  event_trueflavor_03_s_61:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_trueflavor_03_s_62:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_63:
    speaker: crust
    en: "*Sigh*... I knew this wouldn't be easy."
    ko: 흐아아아~ 역시 쉽지 않네요.
    ja: ひゃ～、やっぱり手強いですね。
  event_trueflavor_03_s_64:
    speaker: crust
    en: I knew I wouldn't be able to simply snap my fingers and solve this all in
      a day,
    ko: 하루 만에 짠~ 하고 될 거라곤 생각 안 했긴 했는데요.
    ja: |-
      はい、完成！ってわけにはいかないと
      思ってましたが、
  event_trueflavor_03_s_65:
    speaker: crust
    en: but if I'm being honest, I had a little hope there near the end.
    ko: 솔직히 아주 조오오금은 기대했거든요.
    ja: 正直、すこ～～し期待してたんです。
  event_trueflavor_03_s_66:
    speaker: crust
    en: No matter which parts of you that we used, the dishes were all failures!
    ko: 미식가님의 여러 가지를 이용하는 건 실패였어요…!
    ja: |-
      でも、グルメ様の一部を使うのは
      失敗でしたね…！
  event_trueflavor_03_s_67:
    speaker: "<Self>"
    en: I could have told you that adding my hair to the food wouldn't help things...
    ko: "…내 머리카락을 넣은 건, 정말 아니었다고 생각해."
    ja: "…私の髪を入れたのは、本当にどうかと思う"
  event_trueflavor_03_s_68:
    speaker: crust
    en: Hey, this is research, after all! We've got to try anything and everything.
    ko: 연구니까 이런 거 저런 거 시도를 해봤던 거죠, 헤헤….
    ja: 研究ですから、色々試してみたくって。えへへ…
  event_trueflavor_03_s_69:
    speaker: crust
    en: Still, I'm sorry for inconveniencing you like this.
    ko: 당황스럽게 해드려서 죄송해요.
    ja: 困らせてしまってすみません。
  event_trueflavor_03_s_70:
    speaker: crust
    en: Thanks for all the help today.
    ko: 그리고 오늘 도와주셔서 감사했어요!
    ja: |-
      今日はお手伝いいただき、
      ありがとうございました！
  event_trueflavor_03_s_71:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_s_72:
    speaker: "<Self>"
    en: Crust.
    ko: 크러스트.
    ja: クラスト
  event_trueflavor_03_s_73:
    speaker: crust
    en: Yes?
    ko: 네~?
    ja: はい？
  event_trueflavor_03_s_74:
    speaker: "<Self>"
    en: Why are you hiding the purpose of this research from Bready?
    ko: |-
      그런데 왜 무슨 연구를 하는 건지
      브래디에게 숨기는 거야?
    ja: |-
      どうしてブレッディに
      研究内容を言わないんだ？
  event_trueflavor_03_s_75:
    speaker: crust
    en: Erm... well...
    ko: 그, 그거야…!
    ja: そ、それは…！
  event_trueflavor_03_s_76:
    speaker: crust
    en: I want to surprise her.
    ko: 브래디를 깜짝 놀라게 해 주고 싶어서죠.
    ja: ブレッディを驚かせたくて…
  event_trueflavor_03_s_77:
    speaker: crust
    en: Once I manage to make a dish that is beautiful and pure, she'll be over the
      moon!
    ko: |-
      온전한 맛을 느낄 수 있는 음식을 만들었다고 하면,
      분명 행복해할 테니까요~!
    ja: |-
      純粋な味を感じられる料理が完成すれば、
      きっと幸せになれるはずですから！
  event_trueflavor_03_s_78:
    speaker: crust
    en: Besides, I told her the point of this was so I could make a dish for her.
    ko: 그리고, 저는 브래디를 위한 음식을 만들고 있다고 했지만.
    ja: |-
      それに、私が料理を作るのは
      ブレッディのためだと言いましたが…
  event_trueflavor_03_s_79:
    speaker: crust
    en: When I look back,
    ko: 지금 생각해 보면, 제가 만든 음식은.
    ja: いま思えば、私が作ってきた料理は…
  event_trueflavor_03_s_80:
    speaker: crust
    en: all the food I've made are things that other people would enjoy, but not Bready.
    ko: |-
      반대로, 브래디를 제외한 다른 사람들이
      맛있게 먹을 수 있는 음식이었던 것 같아요.
    ja: |-
      ブレッディ以外のみんなが
      おいしいと思えるようなものだったなって…
  event_trueflavor_03_s_81:
    speaker: crust
    en: That's why I want it to be a big surprise when I make something specifically
      with her in mind, hehe.
    ko: |-
      그러니, 온전히 브래디를 위한 요리를 만들어서
      놀라게 해주고 싶어요, 헤헤.
    ja: |-
      ですから、ブレッディのための料理を作って
      驚かせたいんです。えへへ。
  event_trueflavor_03_s_82:
    speaker: "<Self>"
    en: I see.
    ko: 그렇구나.
    ja: そうか
  event_trueflavor_03_s_83:
    speaker: crust
    en: So there you have it!
    ko: 네!
    ja: はい！
  event_trueflavor_03_s_84:
    speaker: "<Self>"
    en: Are you going to work alone tomorrow?
    ko: 내일부터는 혼자 하려고?
    ja: 明日からは1人で作るのか？
  event_trueflavor_03_s_85:
    speaker: crust
    en: I guess so.
    ko: 아무래도 그래야겠죠.
    ja: そうですね。
  event_trueflavor_03_s_86:
    speaker: crust
    en: I'm planning on doing as much as I can on my own.
    ko: 혼자서 할 수 있는 만큼 해보려구요!
    ja: |-
      とりあえず、
      1人でできるところまでやってみます！
  event_trueflavor_03_s_87:
    speaker: "<Self>"
    en: I know someone who would make a good assistant.
    ko: 음.
    ja: "…そうか"
  event_trueflavor_03_s_88:
    speaker: "<Self>"
    en: Should I bring her?
    ko: |-
      내가 보조로 괜찮을 것 같은 사람을 알고 있는데,
      혹시 데려와도 될까?
    ja: |-
      …力になれそうな人に心当たりがあるんだが、
      連れてきてもいいか？
  event_trueflavor_03_s_89:
    speaker: crust
    en: Um...
    ko: 어….
    ja: えっと…
  event_trueflavor_03_s_90:
    speaker: crust
    en: I really appreciate the offer, but our kitchen is off-limits to non-staff.
    ko: |-
      말씀은 너무 감사하지만,
      기본적으로 저희 주방은 관계자 외 출입이 금지되어 있어서요.
    ja: |-
      お気持ちはありがたいですが、
      基本的にこのキッチンは関係者以外
      立ち入り禁止なんです。
  event_trueflavor_03_s_91:
    speaker: crust
    en: I could invite them in, but they would have to be treated as a guest rather
      than an assistant.
    ko: |-
      물론 초대를 해드리면 되지만,
      그러면 보조가 아니라 손님으로써 대접을 해드려야….
    ja: |-
      もちろん招待することはできますが、
      そうなると助っ人ではなくお客様になるので…
  event_trueflavor_03_s_92:
    speaker: "<Self>"
    en: It's someone who you already know quite well.
    ko: 크러스트도 아는 사람이야.
    ja: クラストも知っている人だ
  event_trueflavor_03_s_93:
    speaker: crust
    en: Oh, really?
    ko: 엇, 정말요?
    ja: えっ、本当ですか？
  event_trueflavor_03_s_94:
    speaker: crust
    en: In that case, sure.
    ko: 그렇다면, 좋아요!
    ja: それなら、大丈夫です！
  event_trueflavor_03_s_95:
    speaker: crust
    en: If it's someone that you personally vouch for, and I already know them,
    ko: 미식가님이 추천해 주시고, 저도 알고 있는 분이라면.
    ja: グルメ様の推薦で、私も知っている方なら…
  event_trueflavor_03_s_96:
    speaker: crust
    en: I'm sure they'll be perfect for the job.
    ko: 분명 좋은 분이실 테니까요~!
    ja: きっと素敵な方でしょうから！
event_trueflavor_03_e:
  event_trueflavor_03_e_1:
    speaker: "<Narration>"
    en: The next day.
    ko: 다음 날.
    ja: 翌日
  event_trueflavor_03_e_2:
    speaker: "<Monologue>"
    en: Along with the person I've selected to be Crust's assistant, I head to the
      kitchen.
    ko: |-
      나는 크러스트의 요리를 보조해 줄 이와 함께,
      크러스트의 주방으로 향했다.
    ja: |-
      私はクラストの料理を手伝う助っ人と一緒に、
      クラストのキッチンへ向かった
  event_trueflavor_03_e_3:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_trueflavor_03_e_4:
    speaker: crust
    en: Hi, Mr. Gourmand.
    ko: 아, 미식가님! 오셨어요?
    ja: あっ、グルメ様！
  event_trueflavor_03_e_5:
    speaker: crust
    en: Who was it that you brought with y...
    ko: 그리고, 옆에 계신 건….
    ja: 隣にいらっしゃるのは…
  event_trueflavor_03_e_6:
    speaker: tia
    en: Wowee!
    ko: 흐우웅~
    ja: ふふふ～
  event_trueflavor_03_e_7:
    speaker: tia
    en: So this is Miss Crust's kitchen.
    ko: 여기가 크러스트 선생님의 주방이군요오~
    ja: ここがクラスト先生のキッチンなんですねぇ～
  event_trueflavor_03_e_8:
    speaker: crust
    en: Oh!
    ko: 어엇!
    ja: ああっ！
  event_trueflavor_03_e_9:
    speaker: crust
    en: Tia! You were in the special class I gave a while ago.
    ko: 얼마 전 특별 수업에서 봤던, 티아군요!
    ja: 先日の特別授業で会った、ティアですね！
  event_trueflavor_03_e_10:
    speaker: tia
    en: Hehe, hello.
    ko: 헤헤~ 안녕하세요오~
    ja: えへへ～こんにちはぁ～
  event_trueflavor_03_e_11:
    speaker: tia
    en: I came here at Teacher's request.
    ko: 선생님의 부탁으로 오게 되었어요.
    ja: 先生に頼まれて来ましたぁ。
  event_trueflavor_03_e_12:
    speaker: tia
    en: I may not be much help, but I'll do my best.
    ko: 부족하지만, 잘 부탁드립니다아~
    ja: 頼りないですが、よろしくお願いしますぅ～
  event_trueflavor_03_e_13:
    speaker: crust
    en: I'm excited to have you here!
    ko: 저야말로 잘 부탁드려요!
    ja: こちらこそ、よろしくお願いします！
  event_trueflavor_03_e_14:
    speaker: crust
    en: You left quite an impression during the class.
    ko: 안 그래도 수업 날, 엄청 인상 깊었거든요.
    ja: |-
      実は、授業でのティアが
      とても印象に残ってるんです。
  event_trueflavor_03_e_15:
    speaker: tia
    en: I did?
    ko: 제가요오?
    ja: そうなんですかぁ？
  event_trueflavor_03_e_16:
    speaker: tia
