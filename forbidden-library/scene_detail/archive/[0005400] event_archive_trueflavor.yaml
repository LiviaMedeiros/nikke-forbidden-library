  event_trueflavor_05_e_26:
    speaker: crust
    en: "... I think I was impatient."
    ko: 음… 조급했던 것 같아.
    ja: どこか、焦ってたような気がする…
  event_trueflavor_05_e_27:
    speaker: crust
    en: "..."
    ko: 그리고….
    ja: それに…
  event_trueflavor_05_e_28:
    speaker: crust
    en: I felt a little frustrated that
    ko: 내 음식을 먹고 행복해하지 않는 브래디가 조금은 답답했어.
    ja: |-
      私の料理を食べても
      幸せそうじゃないブレッディを見て、
      なんだかもどかしい気持ちになって…
  event_trueflavor_05_e_29:
    speaker: crust
    en: she wasn't feeling happy while eating my food.
    ko: "……?"
    ja: "……？"
  event_trueflavor_05_e_30:
    speaker: crust
    en: I'm sure she felt all those negative,
    ko: 행복해하지 않아?
    ja: 幸せそうじゃない？
  event_trueflavor_05_e_31:
    speaker: crust
    en: 'doubting emotions running through my mind as I was cooking:'
    ko: 브래디가?
    ja: ブレッディが？
  event_trueflavor_05_e_32:
    speaker: crust
    en: Bready isn't happy?
    ko: 아.
    ja: あっ。
  event_trueflavor_05_e_33:
    speaker: crust
    en: Oh... I see...
    ko: 그렇구나….
    ja: そっか…
  event_trueflavor_05_e_34:
    speaker: crust
    en: It's no wonder
    ko: |-
      브래디는 요리하는 나의 감정을, 이야기를, 맛을
      전부 느꼈겠지.
    ja: |-
      ブレッディは、料理を作る私の感情を…物語を…
      味を…すべて感じてたんだよね。
  event_trueflavor_05_e_35:
    speaker: crust
    en: she wasn't happy all this time.
    ko: "…그래서 행복하지 않았구나."
    ja: "…だから幸せになれなかったんだ。"
  event_trueflavor_05_e_36:
    speaker: crust
    en: It's because I wasn't happy.
    ko: 나처럼.
    ja: 私と同じ気持ちに、なってたんだ…
  event_trueflavor_05_e_37:
    speaker: "<Self>"
    en: Crust.
    ko: 크러스트.
    ja: クラスト
  event_trueflavor_05_e_38:
    speaker: "<Self>"
    en: Are you okay?
    ko: 크러스트, 괜찮아?
    ja: クラスト、大丈夫か？
  event_trueflavor_05_e_39:
    speaker: crust
    en: "..."
    ko: "…으."
    ja: "…うう。"
  event_trueflavor_05_e_40:
    speaker: crust
    en: I...
    ko: 흐으….
    ja: ふぅ…
  event_trueflavor_05_e_41:
    speaker: crust
    en: I realize it now, Mr. Gourmand.
    ko: 미식가님… 이제 알았어요.
    ja: グルメ様…ようやく分かりました。
  event_trueflavor_05_e_42:
    speaker: crust
    en: I was being selfish.
    ko: 저는, 저는 욕심을 냈던 거예요.
    ja: わ…私…意地になっていたんです。
  event_trueflavor_05_e_43:
    speaker: crust
    en: Once I saw the expression Bready made after tasting you,
    ko: 브래디가 미식가님을 맛보고 나서 지은 표정을 보고….
    ja: |-
      ブレッディがグルメ様の味見をした後に見せる
      表情を見て…
  event_trueflavor_05_e_44:
    speaker: crust
    en: I wanted to see her feel the same thing when eating my food.
    ko: 제 음식을 먹고도 저런 표정을 지어줬으면 좋겠다고 생각했어요.
    ja: |-
      私の料理を食べた時も、あんな顔を
      してくれたらいいのにって。
  event_trueflavor_05_e_45:
    speaker: crust
    en: That look I saw on her face was one of true joy.
    ko: 그게 진짜 행복한 표정이라고.
    ja: |-
      あんな、本当に幸せな顔を
      浮かべてくれたらいいのにって…
  event_trueflavor_05_e_46:
    speaker: crust
    en: In that moment, I forgot everything.
    ko: 그렇게 단정 지었어요.
    ja: そんな思いで、いっぱいになってました。
  event_trueflavor_05_e_47:
    speaker: crust
    en: All the moments in the past when she'd smiled and been perfectly happy eating
      my food.
    ko: "…브래디는 늘 제 음식을 행복하게 먹어줬는데."
    ja: |-
      …ブレッディは、いつも私の料理を
      幸せそうに食べてくれていたのに。
  event_trueflavor_05_e_48:
    speaker: crust
    en: She always smiled.
    ko: 웃어줬는데.
    ja: 笑ってくれたのに。
  event_trueflavor_05_e_49:
    speaker: crust
    en: I forgot all of it, like a complete fool.
    ko: 바보같이, 그 순간들을 다 지워버렸어요.
    ja: |-
      バカですね…私、こんなに大事なことを
      すっかり忘れていたなんて。
  event_trueflavor_05_e_50:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_05_e_51:
    speaker: crust
    en: Every time the bell rang, Bready must have come walking in filled with anticipation
      as to what I would serve her,
    ko: |-
      벨을 울릴 때마다,
      브래디는 어떤 음식이 나올까 기대하면서 왔을 텐데.
    ja: |-
      ベルを鳴らすたびに、
      ブレッディはどんな料理が出てくるか
      期待しながら来てくれていたはずなのに…
  event_trueflavor_05_e_52:
    speaker: crust
    en: but I kept giving her bizarre experimental dishes instead.
    ko: 이상한 실험 요리들만 주고….
    ja: 私、変な実験料理ばっかり出して…
  event_trueflavor_05_e_53:
    speaker: crust
    en: What should I do?
    ko: 어떡하죠…?
    ja: どうしたらいいんでしょう…？
  event_trueflavor_05_e_54:
    speaker: crust
    en: Bready must be so disappointed in me.
    ko: 브래디가 많이 실망했을 거예요.
    ja: きっと、がっかりさせちゃいましたよね。
  event_trueflavor_05_e_55:
    speaker: "<Self>"
    en: You can cook for her again.
    ko: 그럼 다시 요리를 해주면 되지.
    ja: また料理を作ればいいじゃないか
  event_trueflavor_05_e_56:
    speaker: crust
    en: Do you think I can?
    ko: 요리를요…?
    ja: 料理を…？
  event_trueflavor_05_e_57:
    speaker: "<Self>"
    en: Of course you can.
    ko: 응.
    ja: ああ
  event_trueflavor_05_e_58:
    speaker: "<Self>"
    en: You can make the dishes you usually made before. The ones that made Bready
      happy.
    ko: 브래디가 행복하게 먹었던, 크러스트의 원래 요리들을.
    ja: |-
      ブレッディが幸せそうに食べていた、
      クラスト自身の料理を作ればいいんだ
  event_trueflavor_05_e_59:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_05_e_60:
    speaker: crust
    en: Would that be enough?
    ko: 그걸로 괜찮을까요…?
    ja: それでいいんでしょうか…？
  event_trueflavor_05_e_61:
    speaker: "<Self>"
    en: Of course.
    ko: 당연하지.
    ja: ああ
  event_trueflavor_05_e_62:
    speaker: "<Self>"
    en: You've also learned a lot from Tia and Ade.
    ko: 그리고 티아와 에이드에게도 많은 걸 배웠잖아.
    ja: |-
      ティアとエードからも
      たくさんのことを教わっただろう？
  event_trueflavor_05_e_63:
    speaker: crust
    en: "... You're right."
    ko: "…맞아요."
    ja: "…そうですね。"
  event_trueflavor_05_e_64:
    speaker: crust
    en: They taught me that when emotions are one-sided, even something like kindness
      can feel like malice.
    ko: 일방적인 호의는, 악의로 느껴질 수 있다는 것도 배우고.
    ja: 一方的な好意は、悪意にもなってしまうこと…
  event_trueflavor_05_e_65:
    speaker: crust
    en: And I've learned how to make someone feel happy while eating.
    ko: 음식을 먹을 때 행복해지는 방법도 배웠어요.
    ja: |-
      そして、料理を食べる時に
      幸せになる方法も分かりました。
  event_trueflavor_05_e_66:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_05_e_67:
    speaker: crust
    en: Okay, I've made up my mind.
    ko: 좋아요, 결심했어요.
    ja: "…よし、決めました！"
  event_trueflavor_05_e_68:
    speaker: crust
    en: I'm going to write an invitation for Bready.
    ko: 저, 브래디에게 초대장을 쓸래요!
    ja: ブレッディに招待状を送ります！
  event_trueflavor_05_e_69:
    speaker: crust
    en: Come to think of it, I've never officially invited Bready here before.
    ko: |-
      생각해 보니까,
      브래디를 한 번도 정식으로 초대한 적이 없었거든요.
    ja: |-
      …えへへ、そういえば、
      正式に招待するのは初めてかもしれません。
  event_trueflavor_05_e_70:
    speaker: crust
    en: Of course, it's because I never really needed to,
    ko: 물론 그럴 필요가 없어서 그랬던 거기도 하지만….
