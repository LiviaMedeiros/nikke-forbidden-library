    ja: |-
      ブレッディが幸せになれる料理を
      作ることでした。
  event_trueflavor_01_e_70:
    speaker: crust
    en: But instead, you're the one who achieved that.
    ko: 그런데 미식가님이 그걸 해내셨잖아요?
    ja: |-
      でも、それはグルメ様が
      達成しちゃいましたよね。
  event_trueflavor_01_e_71:
    speaker: "<Self>"
    en: Er... It would seem that way, yes.
    ko: 아… 어쩌다 보니 그렇게 됐지.
    ja: あぁ…確かに、気づけばそうなってたな
  event_trueflavor_01_e_72:
    speaker: crust
    en: So that means I need to get my butt in gear!
    ko: 그러니, 이대로 가만히 있을 수는 없어요!
    ja: |-
      だから、このままじっとしているわけには
      いかないんです！
  event_trueflavor_01_e_73:
    speaker: crust
    en: I'm going to develop dishes that will make Bready happy too!
    ko: 저도, 브래디가 행복하게 먹을 수 있는 요리를 개발할 거예요!
    ja: |-
      私も、この手でブレッディが
      幸せになれる料理を開発してみせます！
  event_trueflavor_01_e_74:
    speaker: "<Self>"
    en: "..."
    ko: 오오….
    ja: おお…
  event_trueflavor_01_e_75:
    speaker: crust
    en: So, Mr. Gourmand,
    ko: 그래서, 미식가님!
    ja: そういうわけで、グルメ様！
  event_trueflavor_01_e_76:
    speaker: crust
    en: I have a few things to ask of you for my research.
    ko: 요리 연구를 위해 부탁드리고 싶은 것들이 좀 있는데요.
