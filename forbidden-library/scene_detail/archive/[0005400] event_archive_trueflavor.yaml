      誤解されているようですね。
  event_trueflavor_05_s_61:
    speaker: crust
    en: I... I have?
    ko: 제, 제가요…?
    ja: わ、私がですか…？
  event_trueflavor_05_s_62:
    speaker: ade_c
    en: Yes.
    ko: 네.
    ja: はい。
  event_trueflavor_05_s_63:
    speaker: ade_c
    en: It takes more than taste alone for someone
    ko: 행복의 맛은, 음식의 맛에서만 느낄 수는 없어요.
    ja: |-
      幸せの味は、単に
      食べ物の味のことではありません。
  event_trueflavor_05_s_64:
    speaker: ade_c
    en: to derive happiness from food.
    ko: 절대.
    ja: これは断言できます。
  event_trueflavor_05_s_65:
    speaker: ade_c
