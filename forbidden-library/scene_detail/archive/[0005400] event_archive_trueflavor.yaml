    ko: "……."
    ja: "……"
  event_trueflavor_04_e_31:
    speaker: "<Monologue>"
    en: Crust watches Ade with an excited expression.
    ko: 크러스트는 설레는 표정으로 에이드를 바라보았다.
    ja: クラストはドキドキしながらエードを見つめた
  event_trueflavor_04_e_32:
    speaker: ade_c
    en: Hmm...
    ko: 으음.
    ja: "…ふふ。"
  event_trueflavor_04_e_33:
    speaker: "<Monologue>"
    en: Ade smiles subtly as she nods her head.
    ko: 에이드는 가볍게 미소 지으며 고개를 끄덕였다.
    ja: エードは軽く微笑みながら頷いた
  event_trueflavor_04_e_34:
    speaker: crust
