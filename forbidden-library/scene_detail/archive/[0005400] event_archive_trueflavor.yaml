    ko: 그리고, 정말 행복한 시간이었구요.
    ja: そして、とても幸せな時間でした。
  event_trueflavor_04_e_43:
    speaker: ade_c
    en: The entire time I was eating, I kept wondering about something.
    ko: 그래서 먹는 내내 의문이 들었어요.
    ja: しかし、だからこそ疑問に思ったのです。
  event_trueflavor_04_e_44:
    speaker: ade_c
    en: I heard that you're attempting to create dishes which invoke happiness in
      others,
    ko: |-
      크러스트 아가씨는,
      남을 행복하게 해주는 요리를 연구 중이라고 들었는데….
