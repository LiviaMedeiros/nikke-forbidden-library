    ko: 옷이요?
    ja: 着替えですかぁ？
  event_trueflavor_03_e_26:
    speaker: crust
    en: Of course.
    ko: 네!
    ja: はい！
  event_trueflavor_03_e_27:
    speaker: crust
    en: Whenever you cook, you need an apron that matches the occasion.
    ko: 요리를 하려면, 그에 걸맞은 앞치마가 필요한 법이니까요!
    ja: 料理をするなら、エプロンが必要なので！
  event_trueflavor_03_e_28:
    speaker: crust
    en: If you go inside the back room, there are plenty of aprons to choose from.
    ko: 저기 안쪽 방에 가면, 여분의 앞치마들이 있을 거예요~
    ja: 奥の部屋に余っているエプロンがあるはずです。
  event_trueflavor_03_e_29:
    speaker: crust
    en: Pick whichever one you want and come back once you're ready.
    ko: 아무거나 두르고 오세요!
    ja: お好きなものを使ってください！
  event_trueflavor_03_e_30:
    speaker: tia
    en: Okay!
    ko: 네에~
    ja: は～い！
  event_trueflavor_03_e_31:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_e_32:
    speaker: crust
    en: I'm feeling good today.
    ko: 저, 오늘은 뭔가 느낌이 좋아요.
    ja: えへへ、今日は何だかいい感じですね。
  event_trueflavor_03_e_33:
    speaker: crust
    en: I think I just might succeed!
    ko: 성공할 것만 같아요!
    ja: 上手くいく気がします！
  event_trueflavor_03_e_34:
    speaker: crust
    en: Thank you for sending me such a great assistant, Mr. Gourmand.
    ko: 멋진 보조를 보내주셔서 감사해요, 미식가님!
    ja: |-
      グルメ様、素敵な助っ人を
      連れてきてくださりありがとうございます！
  event_trueflavor_03_e_35:
    speaker: "<Self>"
    en: Sure thing. I'll be watching from the sidelines, cheering you on.
    ko: 응, 나도 옆에서 응원할게.
    ja: ああ、私も隣で応援している
  event_trueflavor_03_e_36:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_e_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_03_e_38:
    speaker: tia_s
    en: I'm done changing!
    ko: 헤헤~ 다 갈아입었어요오.
    ja: えへへ～着替え終わりましたぁ。
  event_trueflavor_03_e_39:
    speaker: tia_s
    en: Do I look okay?
    ko: 괜찮아 보이나요?
    ja: どうですかぁ？
  event_trueflavor_03_e_40:
    speaker: crust
    en: Uh... the apron looks good,
    ko: 그… 괘, 괜찮긴 한데요.
    ja: その…い、いいんですけど…
  event_trueflavor_03_e_41:
    speaker: crust
    en: but why did you take off your school uniform?
    ko: 왜 교복이랑 다 벗고 앞치마를 두르신 건지 여쭤봐도 될까요?
    ja: |-
      制服を脱いでエプロンを着けた
      理由を聞いてもいいですか？
  event_trueflavor_03_e_42:
    speaker: tia_s
    en: Oh, well,
    ko: 아아~
    ja: あっ、これはですねぇ…
  event_trueflavor_03_e_43:
    speaker: tia_s
    en: when I wore the apron on top of my school uniform, it didn't fit properly
      and felt a bit uncomfortable.
    ko: |-
      교복 위에 입으니까,
      사이즈가 안 맞아서 너무 답답하더라구요.
    ja: |-
      制服の上から着けると、
      サイズが合わないから苦しくてぇ。
  event_trueflavor_03_e_44:
    speaker: tia_s
    en: So I changed into something more comfortable, and wore the apron over it.
    ko: |-
      그래서 편한 옷으로 갈아입고,
      그 위에 앞치마를 둘렀어요.
    ja: |-
      だから動きやすい服に着替えて、
      その上からエプロンを着けたんですぅ。
  event_trueflavor_03_e_45:
    speaker: crust
    en: I see...
    ko: 그렇… 군요!
    ja: そっ、そうでしたか！
  event_trueflavor_03_e_46:
    speaker: crust
    en: Well, as long as you're comfortable.
    ko: 뭐, 티아가 편하다면 그걸로 된 거죠~!
    ja: |-
      ティアにとって楽な格好なら、
      それで大丈夫です！
  event_trueflavor_03_e_47:
    speaker: crust
    en: Now then, let's start cooking!
    ko: 자! 그럼, 요리를 시작해 봅시다~!
    ja: さあ！それでは、料理を始めましょう～！
  event_trueflavor_03_e_48:
    speaker: tia_s
    en: Yippee!
    ko: 와아~
    ja: わあ～
  event_trueflavor_03_e_49:
    speaker: crust
    en: What kind of food would you like to cook, Tia?
    ko: 티아는 어떤 음식을 만들어 보고 싶어요?
    ja: ティアはどんな料理を作りたいですか？
  event_trueflavor_03_e_50:
    speaker: tia_s
    en: I'm feeling a dessert of some kind.
    ko: 저는 디저트요오~
    ja: やっぱり、スイーツですかねぇ～
  event_trueflavor_03_e_51:
    speaker: tia_s
    en: I want to make something nice and sweet that I can eat.
    ko: 달콤하게 만들어서 먹고 싶어요오~
    ja: あま～いのを作って、食べたいですぅ～
  event_trueflavor_03_e_52:
    speaker: crust
    en: All right, then today we'll look into desserts.
    ko: 좋아요! 오늘은 디저트로 연구를 해보겠어요!
    ja: |-
      いいですね！今日はスイーツを
      研究してみましょうか！
  event_trueflavor_03_e_53:
    speaker: tia_s
    en: Hmm?
    ko: 흐웅?
    ja: あれぇ？
  event_trueflavor_03_e_54:
    speaker: tia_s
    en: Didn't you say we had to make something for someone specific?
    ko: 누군가의 입맛에 맞춘 요리를 해야 한다고 하지 않으셨나요오~?
    ja: |-
      今日って、誰かの好みに合わせた料理を
      作るんですよねぇ～？
  event_trueflavor_03_e_55:
    speaker: tia_s
    en: It is really okay for me to make something that I want?
    ko: 제가 먹고 싶은 걸로 만들어도 되는 건가요?
    ja: 私が作りたいものを作ってもいいんですかぁ？
  event_trueflavor_03_e_56:
    speaker: crust
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_trueflavor_03_e_57:
    speaker: crust
    en: Oh...
    ko: 그… 그렇죠.
    ja: そ…そうでした…！
  event_trueflavor_03_e_58:
    speaker: crust
    en: I-I guess you're right.
    ko: 세상에.
    ja: 考えてみたら、私…
  event_trueflavor_03_e_59:
    speaker: crust
    en: Wow, I never really considered that.
    ko: 생각해 보니 전, 맛을 만들어 내기 전에.
    ja: 味がどうこう以前に…
  event_trueflavor_03_e_60:
    speaker: crust
    en: Before setting about creating an ideal flavor, I never thought about what
      kind of food Bready actually would want to eat!
    ko: |-
      브래디가 어떤 음식을 제일 먹고 싶어 하는지조차
      모르고 있었어요!!
    ja: |-
      ブレッディが
      どんな料理を食べたがっているのか…
      それさえ知らずにいました！！
  event_trueflavor_03_e_61:
    speaker: crust
    en: I'm such a dumb dumb!
    ko: 쿠구구궁!!!
    ja: ガーン！！
  event_trueflavor_03_e_62:
    speaker: tia_s
    en: What? You mean you don't know what kind of food this person likes?
    ko: 우웅? 그 사람이 좋아하는 음식을 모르시는 건가요오?
    ja: |-
      えっとぉ、相手が好きな食べ物を
      知らないんですかぁ…？
  event_trueflavor_03_e_63:
    speaker: crust
    en: I... I think I do.
    ko: 그런… 것 같아요.
    ja: そう…みたいです。
  event_trueflavor_03_e_64:
    speaker: crust
    en: I know that she'd like something bold. Something new.
    ko: 자극적이고, 새로운 이야… 아니, 맛을 좋아한다는 건 알지만요.
    ja: |-
      刺激的で、新しい物語…
      いえ、味が好きだってことは知ってるんですが…
  event_trueflavor_03_e_65:
    speaker: tia_s
    en: Hmm, that's a toughie.
    ko: 흐웅, 어렵네요.
    ja: うーん、難しいですねぇ。
  event_trueflavor_03_e_66:
    speaker: tia_s
    en: Is there anything in particular that she eats often?
    ko: 평소에 많이 드시는 음식은 따로 없으셨나요오?
    ja: その人がよく食べているものはありますかぁ？
  event_trueflavor_03_e_67:
    speaker: crust
    en: She usually eats whatever I make without any complaints.
    ko: 제가 해주는 건 뭐든 잘 먹어서….
    ja: |-
      私が作ったものは、
      何でもよく食べてくれるので…
  event_trueflavor_03_e_68:
    speaker: tia_s
    en: Then she must be a fan of your cooking.
    ko: |-
      그럼, 크러스트 선생님이 해주시는 음식을
      다 좋아하나 봐요오~
    ja: |-
      じゃあ、クラスト先生の料理が
      大好きなんですねぇ～
  event_trueflavor_03_e_69:
    speaker: crust
    en: Do you think so?
    ko: 그런 걸까요…?
    ja: そうなんでしょうか…？
  event_trueflavor_03_e_70:
    speaker: tia_s
    en: Of course.
    ko: 네에.
    ja: そうですよぉ。
  event_trueflavor_03_e_71:
    speaker: tia_s
    en: In that case, I think we'll be okay making a dessert.
    ko: 그러니까 디저트를 만들어도 되겠어요오~
    ja: |-
      だったら、スイーツを作っても
      問題ないですねぇ～
  event_trueflavor_03_e_72:
    speaker: crust
    en: Yeah, you're right!
    ko: 그, 그렇죠?!
    ja: そ、そうですよね！？
  event_trueflavor_03_e_73:
    speaker: crust
    en: Bready will enjoy anything that we give her, as long as it's made by us!
    ko: 맞아요! 브래디는 뭘 만들어줘도 맛있게 먹을 거예요!
    ja: |-
      ブレッディは何を作っても、
      おいしく食べてくれるはずです！
  event_trueflavor_03_e_74:
    speaker: tia_s
    en: All right,
    ko: 그다음은~
    ja: それからぁ～
  event_trueflavor_03_e_75:
    speaker: tia_s
    en: you said this Bready person likes bold and new flavors, yes?
    ko: 아까 자극적이고 새로운 맛을 좋아한다고 하셨으니까아~
    ja: |-
      さっき刺激的で新しい味が好きって
      言ってたからぁ～
  event_trueflavor_03_e_76:
    speaker: tia_s
    en: In that case, you should make a dessert unlike anything this world has ever
