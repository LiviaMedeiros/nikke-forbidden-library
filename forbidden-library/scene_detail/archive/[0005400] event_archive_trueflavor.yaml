    en: It's the same as what I usually eat.
    ko: 늘 먹던 맛이야.
    ja: いつもの味よ。
  event_trueflavor_05_e_15:
    speaker: bready
    en: It's delicious.
    ko: 맛있어.
    ja: おいしいわ。
  event_trueflavor_05_e_16:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_05_e_17:
    speaker: crust
    en: Bready would always smile
    ko: 웃었어.
    ja: 笑ってた。
  event_trueflavor_05_e_18:
    speaker: crust
