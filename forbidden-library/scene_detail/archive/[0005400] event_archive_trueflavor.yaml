    ko: 네, 맛 보지 않아도 알 것 같아요.
    ja: ええ、食べなくても分かります。
  event_trueflavor_05_s_48:
    speaker: ade_c
    en: I don't need to try it to know that it will taste bad.
    ko: 이 음식은, 맛이 있을 수가 없으니까요.
    ja: このお料理が、おいしいはずありません。
  event_trueflavor_05_s_49:
    speaker: crust
    en: Huh?
    ko: 네?
    ja: えっ…？
  event_trueflavor_05_s_50:
    speaker: ade_c
    en: Because you didn't make this dish for Miss Bready.
    ko: 왜냐하면, 브래디 아가씨를 위해서가 아니라.
    ja: |-
      なぜならこれは、
      ブレッディお嬢様のためではなく…
  event_trueflavor_05_s_51:
    speaker: ade_c
    en: You made it for yourself.
    ko: 크러스트 아가씨를 위해 만든 음식이니까요.
    ja: |-
      クラストお嬢様のために
      作られたお料理ですから。
  event_trueflavor_05_s_52:
    speaker: crust
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_trueflavor_05_s_53:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_trueflavor_05_s_54:
    speaker: crust
