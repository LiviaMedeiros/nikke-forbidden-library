    ko: 네!
    ja: はい！
  event_trueflavor_04_e_26:
    speaker: crust
    en: I wanted to express my gratitude for you coming here and sampling my food.
    ko: 와주셔서, 그리고 드셔주셔서 감사하다는 마음을 담았어요!
