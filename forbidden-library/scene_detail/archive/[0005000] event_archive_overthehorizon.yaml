---
event_overthehorizon_prologue:
  event_overthehorizon_prologue_1:
    speaker: sora
    en: Oh no, Captain,
    ko: 캡틴~♥
    ja: キャプテ～ン♥
  event_overthehorizon_prologue_2:
    speaker: sora
    en: not like that. ♥
    ko: 이러면 안 돼요~ 안 돼.
    ja: こらこら、ダメですよ～ダメダメ。
  event_overthehorizon_prologue_3:
    speaker: sora
    en: Your seatbelt is all wrong. ★
    ko: 안전벨트는…★
    ja: シートベルトは…★
  event_overthehorizon_prologue_4:
    speaker: "<Monologue>"
    en: Sora reaches out her hand.
    ko: 소라가 손을 뻗어왔다.
    ja: ソラがこちらに手を伸ばした
  event_overthehorizon_prologue_5:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャッ
  event_overthehorizon_prologue_6:
    speaker: sora
    en: After it clicks perfectly into place... ♥
    ko: 이렇게~ 잘 맞물려 준 다음에…♥
    ja: こうやって～しっかり固定して～♥
  event_overthehorizon_prologue_7:
    speaker: "<Narration>"
    en: "*Schnick*"
    ko: 지익-!
    ja: グイッ！
  event_overthehorizon_prologue_8:
    speaker: sora
    en: To make it tight...
    ko: 꽈악~
    ja: ギュゥ～っと～
  event_overthehorizon_prologue_9:
    speaker: "<Self>"
    en: Urgh!
    ko: 윽…!
    ja: うっ…！
  event_overthehorizon_prologue_10:
    speaker: sora
    en: You gotta pull it. ♥
    ko: 당겨줘야 한다고요♥
    ja: 締めておかないと♥
  event_overthehorizon_prologue_11:
    speaker: "<Self>"
    en: It's not exactly comfortable...
    ko: 조금 아픈데….
    ja: 少し痛いのだが…
  event_overthehorizon_prologue_12:
    speaker: sora
    en: Oh, I'm sorry!
    ko: 많이 아프셨어요?
    ja: 痛かったですか？
  event_overthehorizon_prologue_13:
    speaker: sora
    en: Does it hurt? ♥
    ko: 죄송해요♥
    ja: ごめんなさい♥
  event_overthehorizon_prologue_14:
    speaker: sora
    en: Here, let me loosen it up a little. ★
    ko: 그럼 조금만 풀어줘야겠다~★
    ja: じゃあ、ちょっとだけ緩めますね～★
  event_overthehorizon_prologue_15:
    speaker: "<Monologue>"
    en: Sora reaches out her hand again.
    ko: 소라가 다시 손을 뻗어왔다.
    ja: ソラが再びこちらに手を伸ばした
  event_overthehorizon_prologue_16:
    speaker: anis
    en: Hey! Quit being so handsy with the Commander, would you?
    ko: 야! 너 지휘관님한테 손 떼!
    ja: ちょっと！指揮官様にベタベタ触らないの！
  event_overthehorizon_prologue_17:
    speaker: rapi
    en: Are you all right, Commander? I heard you cry out in pain just now...
    ko: 지휘관? 방금 고통스러워하시는 소리가….
    ja: |-
      指揮官？さきほど苦しそうな声が
      聞こえましたが…
  event_overthehorizon_prologue_18:
    speaker: sora
    en: Huh? What are you all doing here?
    ko: 어라? 둘 다 지금 자리에서 이탈하신 거 아니에요?
    ja: あれれ？お二人とも、なんでこちらに？
  event_overthehorizon_prologue_19:
    speaker: sora
    en: Your assigned seats are in another area. ★
    ko: 여긴 두 분 구역이 아닌데~★
    ja: お席はあちらですよ～★
  event_overthehorizon_prologue_20:
    speaker: anis
    en: Who gives a flying crap about assigned seats right now?!
    ko: 아니 지금 구역이고 나발이고를 지킬 때야?
    ja: 席の指定なんかどうでもいいでしょ？
  event_overthehorizon_prologue_21:
    speaker: neon
    en: Yeah, exactly!
    ko: 옳소 옳소!
    ja: そうですよ！
  event_overthehorizon_prologue_22:
    speaker: neon
    en: We wanna sit beside Master too!
    ko: 저희도 스승님 옆에 앉아서 가고 싶은데요!
    ja: 私たちも師匠の隣を希望します！
  event_overthehorizon_prologue_23:
    speaker: rapi
    en: Is everything okay, Commander?
    ko: "…지휘관, 괜찮으십니까?"
    ja: "…指揮官、大丈夫ですか？"
  event_overthehorizon_prologue_24:
    speaker: "<Self>"
    en: "... I'm fine."
    ko: "…괜찮아."
    ja: "…ああ"
  event_overthehorizon_prologue_25:
    speaker: "<Self>"
    en: I'm just... a little tired, that's all.
    ko: 아주 조금… 피곤해서 그래.
    ja: 少し…疲れただけだ
  event_overthehorizon_prologue_26:
    speaker: "<Monologue>"
    en: I'm in a fine mess at the moment.
    ko: 이 사태의 원인은….
    ja: この騒動の発端は…
  event_overthehorizon_prologue_27:
    speaker: "<Monologue>"
    en: It all started a week ago, with the sudden arrival of an official document.
    ko: 일주일 전, 갑작스레 날아온 한 통의 공문으로부터 시작된다.
    ja: 1週間前に届いた公文書だった
event_overthehorizon_01_s:
  event_overthehorizon_01_s_1:
    speaker: "<Narration>"
    en: One week ago.
    ko: 일주일 전.
    ja: 1週間前
  event_overthehorizon_01_s_2:
    speaker: "<Self>"
    en: Flight training?
    ko: 비행 교육?
    ja: 航空教育？
  event_overthehorizon_01_s_3:
    speaker: rapi
    en: Yes.
    ko: 예.
    ja: はい。
  event_overthehorizon_01_s_4:
    speaker: rapi
    en: It doesn't happen often,
    ko: 자주 있는 일은 아닙니다만,
    ja: あまり頻繁に起こることではありませんが…
  event_overthehorizon_01_s_5:
    speaker: rapi
    en: but on rare occasions—specialized missions,
    ko: 특수한 목적을 지닌 작전이나,
    ja: 特殊な任務のために必要となる時や…
  event_overthehorizon_01_s_6:
    speaker: rapi
    en: large-scale surface reclamation ops,
    ko: 대규모 지상 탈환 작전이나,
    ja: 大規模な地上作戦、
  event_overthehorizon_01_s_7:
    speaker: rapi
    en: urgent emergency support for other squads—
    ko: 급하게 타 스쿼드를 지원해야만 하는 중요한 일이 발생할 경우.
    ja: |-
      あるいは、不測の事態により
      一刻を争う他の部隊への救援が
      必要となった場合などに…
  event_overthehorizon_01_s_8:
    speaker: rapi
    en: we need to travel using transport aircraft.
    ko: 수송기를 이용한 이동을 하는 경우가 발생합니다.
    ja: 輸送機を利用することになる場合があります。
  event_overthehorizon_01_s_9:
    speaker: rapi
    en: To prepare for these situations, the Central Government
    ko: 이를 대비하여, 중앙 정부는 오버 더 호라이즌 스쿼드를 통해,
    ja: |-
      そのような事態に備えて、
      中央政府はオーバー・ザ・ホライズン部隊による
  event_overthehorizon_01_s_10:
    speaker: rapi
    en: has the Over the Horizon Squad provide basic flight theory lessons and in-flight
      safety training.
    ko: 간단한 비행 이론 교육 및 수송기 내 안전 교육 훈련을 진행하는데.
    ja: |-
      基礎的な航空理論の教育および
      輸送機内での安全教育と訓練を行っています。
  event_overthehorizon_01_s_11:
    speaker: rapi
    en: Looks like we've been selected for it this time.
    ko: 이번에는 저희가 그 대상자가 된 듯합니다.
    ja: 今回は、私たちがその対象になったようです。
  event_overthehorizon_01_s_12:
    speaker: anis
    en: It's far from our most common mode of transportation,
    ko: 자주 탈 수 있는 건 아니지만,
    ja: 毎日使うようなものじゃないけど
  event_overthehorizon_01_s_13:
    speaker: anis
    en: but we might end up having to take to the skies in an emergency.
    ko: 긴급한 상황이라면 우리도 신세 질 수 있을 테니까.
    ja: いざって時に役に立つかもしれないし
  event_overthehorizon_01_s_14:
    speaker: anis
    en: So there's no harm in beefing up our knowledge beforehand.
    ko: 미리 알아둬서 나쁠 건 없겠지.
    ja: 知っておいた方がいいかもね。
  event_overthehorizon_01_s_15:
    speaker: rapi
    en: I believe you've gone through this training before, haven't you, Commander?
    ko: 그런데 지휘관은 먼저 들어보신 적이 있지 않습니까?
    ja: 指揮官はすでにご存じなのでは？
  event_overthehorizon_01_s_16:
    speaker: "<Self>"
    en: I have?
    ko: 내가?
    ja: 私が？
  event_overthehorizon_01_s_17:
    speaker: anis
    en: Oh yeah, Rapi is right.
    ko: 어, 맞네?
    ja: あ、そういえば…
  event_overthehorizon_01_s_18:
    speaker: anis
    en: Come to think of it, you've been on a transport plane before, right?
    ko: 그러고 보니까 지휘관님도 수송기 타본 적 있지?
    ja: 指揮官様は輸送機に乗ったことあったわよね？
  event_overthehorizon_01_s_19:
    speaker: anis
    en: Though it didn't exactly end well...
    ko: 끝이 좋진 않았지만….
    ja: まあ、着陸がちょっとアレだったけど…
  event_overthehorizon_01_s_20:
    speaker: "<Self>"
    en: "... Yeah."
    ko: "…그렇지."
    ja: "…そうだな"
  event_overthehorizon_01_s_21:
    speaker: neon
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_01_s_22:
    speaker: neon
    en: Did something happen?
    ko: 무슨 일이 있으셨나요?
    ja: 何があったんですか？
  event_overthehorizon_01_s_23:
    speaker: anis
    en: It's a long story.
    ko: 음~ 말하자면 긴 일이 있어.
    ja: う～ん。まあ、色々あったのよ。
  event_overthehorizon_01_s_24:
    speaker: anis
    en: I'll tell you some other time.
    ko: 나중에 말해줄게.
    ja: また今度話してあげる。
  event_overthehorizon_01_s_25:
    speaker: neon
    en: "...?"
    ko: "…??"
    ja: "…？？"
  event_overthehorizon_01_s_26:
    speaker: rapi
    en: Do you remember anything from your training then?
    ko: 그때 받았던 교육 내용이 기억나지 않으십니까?
    ja: |-
      その時に受けた授業内容は
      覚えていらっしゃいますか？
  event_overthehorizon_01_s_27:
    speaker: "<Self>"
    en: For some odd reason, I can't clearly remember anything from before that day.
    ko: 이상하게 그날 이전의 기억은 잘 떠오르지 않아서.
    ja: |-
      どういうわけか、あの日以前のことは
      あまり思い出せないんだ
  event_overthehorizon_01_s_28:
    speaker: anis
    en: Oh...
    ko: 아, 그랬구나….
    ja: あ、そうだったのね…
  event_overthehorizon_01_s_29:
    speaker: anis
    en: Well, this is the perfect opportunity to relearn it!
    ko: 그럼 다시 배우면 되지 뭐!
    ja: まあ、またいちから勉強し直せば済む話よ！
  event_overthehorizon_01_s_30:
    speaker: rapi
    en: That's right.
    ko: 맞습니다.
    ja: そうね。
  event_overthehorizon_01_s_31:
    speaker: rapi
    en: Our class will also include practical training, such as emergency formations
      we can utilize inside the aircraft,
    ko: "어차피 이번에는 실전 교육 및 \n기내 긴급 포메이션 관련으로도 배워 본다고 하니까,"
    ja: |-
      それに、今回は実戦教育だけでなく、
      機内での緊急フォーメーションについても
      学ぶ予定とのことですので
  event_overthehorizon_01_s_32:
    speaker: rapi
    en: so there should be new material, even for someone like yourself who's been
      through this before.
    ko: 이전에 들었다고 하더라도 상관없으실 듯합니다.
    ja: 前に聞いていたとしても、学ぶことはあるかと。
  event_overthehorizon_01_s_33:
    speaker: "<Self>"
    en: When does the training start?
    ko: 그럼, 언제 가야 하는데?
    ja: それで、いつから始まるんだ？
  event_overthehorizon_01_s_34:
    speaker: rapi
    en: In one week.
    ko: 기간은 일주일 뒤라고 합니다.
    ja: 1週間後だそうです。
  event_overthehorizon_01_s_35:
    speaker: "<Self>"
    en: One week, huh...
    ko: 일주일 뒤라….
    ja: 1週間後、か…
  event_overthehorizon_01_s_36:
    speaker: "<Self>"
    en: I hope it's fun.
    ko: 재미있었으면 좋겠네.
    ja: 有意義なものになるといいが…
  event_overthehorizon_01_s_37:
    speaker: "<Narration>"
    en: One week later.
    ko: 일주일 후.
    ja: 1週間後
  event_overthehorizon_01_s_38:
    speaker: cielo_unknown
    en: Welcome, Counters Squad!
    ko: 카운터스 스쿼드 여러분, 어서 오세요!
    ja: ようこそ！カウンターズの皆様！
  event_overthehorizon_01_s_39:
    speaker: cielo_unknown
    en: So happy you're here for flight training!
    ko: 비행 교육에 오신 여러분을 환영합니다!
    ja: |-
      私たち航空教育の関係者一同、
      心より歓迎いたします！
  event_overthehorizon_01_s_40:
    speaker: neon
    en: Wowzers!
    ko: 와아아~
    ja: わああ～
  event_overthehorizon_01_s_41:
    speaker: anis
    en: Woohoo!
    ko: 와아아!
    ja: わああ！
  event_overthehorizon_01_s_42:
    speaker: rapi
    en: Whoa...
    ko: 와… 아아….
    ja: わ…ああ…
  event_overthehorizon_01_s_43:
    speaker: "<Choice>"
    en: Whoa...?
    ko: 와아…?
    ja: わあ…？
  event_overthehorizon_01_s_44:
    speaker: "<Choice>"
    en: Holy moly!
    ko: 와아…!
    ja: わあ…！
  event_overthehorizon_01_s_45:
    speaker: cielo_unknown
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_s_46:
    speaker: cielo_unknown
    en: W-wow!
    ko: 세, 세상에…!
    ja: まあ…！
  event_overthehorizon_01_s_47:
    speaker: cielo_unknown
    en: You're so enthusiastic!
    ko: 호응이 정말 좋으신 분들이네요!
    ja: なんて気持ちのこもった歓迎…！
  event_overthehorizon_01_s_48:
    speaker: cielo_unknown
    en: I've never seen anyone react like this before!
    ko: 이런 반응을 보이신 분들은 여러분들이 처음이에요…!
    ja: |-
      こんな反応を見せてくださったのは
      皆様が初めてです…！
  event_overthehorizon_01_s_49:
    speaker: cielo_unknown
    en: I'm... *Sniff*... totally touched!
    ko: "정말… 흑…! \n감동이네요!"
    ja: |-
      本当に…うぅ…！
      感動しました！
  event_overthehorizon_01_s_50:
    speaker: rapi
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_s_51:
    speaker: anis
    en: Uh... Are you crying?
    ko: 지, 지금… 우는 거야?
    ja: えっ、まさか…泣いてるの？
  event_overthehorizon_01_s_52:
    speaker: neon
    en: That was enough to get the waterworks started? She must be really emotional.
    ko: 이런 일로 감동하다니, 감수성이 풍부한 분이시네요.
    ja: |-
      こんなことで涙が出るなんて、
      とても繊細な方なんですね。
  event_overthehorizon_01_s_53:
    speaker: "<Self>"
    en: Apparently so...
    ko: 그러게….
    ja: そうだな…
  event_overthehorizon_01_s_54:
    speaker: unknown
    en: Cielo!
    ko: 시엘로~
    ja: シエロったら～
  event_overthehorizon_01_s_55:
    speaker: unknown
    en: Haha, I'm glad you're so happy, but how about taking a moment to introduce
      yourself? ♥
    ko: "후후, 기뻐하는 건 좋지만, \n자기소개부터 하고 감동해야죠~♥"
    ja: |-
      ふふ。喜ぶのもいいですが、
      まずは自己紹介を済ませましょうか。
      感動はその後にとっておきましょうね♥
  event_overthehorizon_01_s_56:
    speaker: unknown
    en: O-oh my gosh!
    ko: 어, 어머어머어머…!
    ja: あ、ああああああ…！
  event_overthehorizon_01_s_57:
    speaker: unknown
    en: Sorry! I can't believe I did that...!
    ko: |-
      죄송해요!!
      제가 눈치도 없이…!
    ja: |-
      失礼しました！！
      私ったらもうっ…！
  event_overthehorizon_01_s_58:
    speaker: cielo
    en: Hi, everyone! I'm Cielo from the Over the Horizon Squad!
    ko: |-
      안녕하세요!
      오버 더 호라이즌 스쿼드의 승무원인 시엘로라고 합니다~
    ja: |-
      初めまして！
      オーバー・ザ・ホライズン部隊で
      乗務員を務めています、シエロで～す。
  event_overthehorizon_01_s_59:
    speaker: sora
    en: I'm Sora, a fellow crew member, and... Eh?
    ko: 저도~ 승무원 일을 하는 소라라고 합니… 음?
    ja: 同じく乗務員のソラで…あれ？
  event_overthehorizon_01_s_60:
    speaker: sora
    en: Oh wow, look who it is! ♡
    ko: 와~ 이게 누구야♡
    ja: わぁ～、誰かと思ったら♡
  event_overthehorizon_01_s_61:
    speaker: sora
    en: Fancy seeing you here, Captain. ☆
    ko: 여기서 또 뵙네요~ 캡틴☆
    ja: またお会いしましたね～キャプテン☆
  event_overthehorizon_01_s_62:
    speaker: sora
    en: So, you're finally here for training?
    ko: 드디어 교육받으러 오신 거예요?
    ja: やっと来てくださったんですね。
  event_overthehorizon_01_s_63:
    speaker: "<Self>"
    en: Sora...?
    ko: 소라…?
    ja: ソラ…？
  event_overthehorizon_01_s_64:
    speaker: sora
    en: Hehe, it's been a while, Captain! ♥
    ko: 후후, 오랜만이에요 캡틴~♥
    ja: ふふ。お久しぶりですキャプテン～♥
  event_overthehorizon_01_s_65:
    speaker: sora
    en: I've been thinking about those wonderful days we had together,
    ko: 캡틴과 좋았던 그날의 기억을 떠올리면서,
    ja: |-
      キャプテンと過ごした
      幸せな日のことを思い出しながら
  event_overthehorizon_01_s_66:
    speaker: sora
    en: and eagerly waiting for the day we'd meet again! ♥
    ko: 다시 만날 날을 기다리고 있었어요~♥
    ja: またお会いできる時を待ってたんですよ～♥
  event_overthehorizon_01_s_67:
    speaker: anis
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_s_68:
    speaker: rapi
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_s_69:
    speaker: cielo
    en: S-Sora...? What do you mean by that?!
    ko: |-
      소, 소라…?
      그게 무슨 말이에요?!
    ja: |-
      ソ、ソラ…？
      それってどういうことですか！？
  event_overthehorizon_01_s_70:
    speaker: sora
    en: Hehe, we share a verrrry special memory that only we know about. Right, Captain?
      ♥
    ko: |-
      후후, 저희만 아는 아주~ 소중했던 추억이 있어요♥
      그쵸, 캡틴~♥
    ja: |-
      ふふ。私たちだけのと～っても
      大切な思い出があるんです♥
      ね～？キャプテ～ン♥
  event_overthehorizon_01_s_71:
    speaker: "<Self>"
    en: Uh... yeah, that's right.
    ko: 으, 응. 그렇지.
    ja: あ、ああ。そうだな
  event_overthehorizon_01_s_72:
    speaker: anis
    en: "... Ugh, somehow I've got a feeling that today's gonna be a long day."
    ko: "…아, 나 왠지 오늘 좀 피곤할 거 같은데."
    ja: "…あ、何だか今日はすごく疲れそうな予感。"
  event_overthehorizon_01_s_73:
    speaker: rapi
    en: "... Me too."
    ko: "…그러게."
    ja: "…そうね。"
  event_overthehorizon_01_s_74:
    speaker: neon
    en: Why? What's going on?
    ko: 왜요?
    ja: え？どうしてですか？
  event_overthehorizon_01_s_75:
    speaker: anis
    en: Don't you worry your pretty little head about it.
    ko: |-
      넌… 아니야.
      몰라도 돼.
    ja: |-
      ネオンは…気にしないで。
      知らない方がいいわ。
  event_overthehorizon_01_s_76:
    speaker: cielo
    en: I-I'm a bit curious myself...
    ko: 저, 저도 궁금한데….
    ja: わ、私も気になります…
  event_overthehorizon_01_s_77:
    speaker: sky
    en: What are you all doing standing in the hallway?
    ko: 다들 복도에서 뭘 하고 계시나요?
    ja: 皆さん、廊下で一体何を？
  event_overthehorizon_01_s_78:
    speaker: cielo
    en: Oh, Sky!
    ko: 어머, 스카이~!
    ja: あら、スカイじゃないですか～！
  event_overthehorizon_01_s_79:
    speaker: cielo
    en: Well, you see, Sora...
    ko: 그게 있잖아요~ 소라가…!
    ja: 聞いてください～ソラが…！
  event_overthehorizon_01_s_80:
    speaker: sky
    en: Save it for later.
    ko: |-
      시엘로.
      사담은 나중에.
    ja: |-
      シエロ。
      勤務中の私語は慎んでください。
  event_overthehorizon_01_s_81:
    speaker: sky
    en: It's time for training.
    ko: 교육 시간이 다 되었어요.
    ja: そろそろ時間ですよ。
  event_overthehorizon_01_s_82:
    speaker: cielo
    en: Already?
    ko: 어, 어머나… 시간이 벌써 그렇게…!
    ja: ま、まあ…！もうこんな時間…！
  event_overthehorizon_01_s_83:
    speaker: sora
    en: Sorry, Sky. ★ I got so excited seeing the Captain that I completely lost track
      of time and kept chatting away.
    ko: |-
      후후, 미안해요~★ 스카이.
      캡틴을 보니까 너무 좋아서~ 시간도 잊고 떠들었네요.
    ja: |-
      ふふ、ごめんなさ～い★
      キャプテンに会えたのが嬉しくて～
      時間も忘れておしゃべりしちゃいました。
  event_overthehorizon_01_s_84:
    speaker: sky
    en: Hello, passengers. I'm Sky, leader of the Over the Horizon Squad and a pilot.
    ko: |-
      승객 여러분 반갑습니다.
      오버 더 호라이즌 스쿼드의 리더이자, 기장인 스카이라고 합니다.
    ja: |-
      ご搭乗の皆様、こんにちは。
      オーバー・ザ・ホライズン部隊の
      リーダー兼機長、スカイと申します。
  event_overthehorizon_01_s_85:
    speaker: sky
    en: It's time for your training, so shall we all head inside?
    ko: "교육 시간이 다 되었으니, \n이만 안으로 들어가시겠습니까?"
    ja: |-
      予定の開始時刻が迫っておりますので、
      そろそろ中へお進みいただけますか？
  event_overthehorizon_01_s_86:
    speaker: rapi
    en: All right.
    ko: 그래. 들어갈게.
    ja: 分かったわ。
  event_overthehorizon_01_s_87:
    speaker: rapi
    en: Let's go, Commander.
    ko: 가시죠, 지휘관.
    ja: 行きましょう、指揮官。
  event_overthehorizon_01_s_88:
    speaker: "<Self>"
    en: Okay.
    ko: 그래. 다들 움직이자.
    ja: ああ。移動しよう
  event_overthehorizon_01_s_89:
    speaker: sky
    en: Sora, please show them the way.
    ko: 소라, 안내 부탁드립니다.
    ja: ソラ、案内をお願いします。
  event_overthehorizon_01_s_90:
    speaker: sora
    en: All righty! ★
    ko: 네에~★
    ja: は～い★
  event_overthehorizon_01_s_91:
    speaker: sora
    en: Now then, shall we have our lovely passengers come in one by one?
    ko: 자, 그럼 승객분들 차례대로 입장해 보실까요?
    ja: |-
      さあ。それでは乗客の皆様、
      順番にお入りください。
event_overthehorizon_01_e:
  event_overthehorizon_01_e_1:
    speaker: "<Monologue>"
    en: Following Sora's lead, we enter the classroom.
    ko: 소라의 안내에 따라 강의실 안으로 들어온 우리는,
    ja: ソラに案内され、講義室に入った
  event_overthehorizon_01_e_2:
    speaker: "<Monologue>"
    en: Cielo and Sky stand at the front, ready to begin the flight theory lesson.
    ko: 강연대 앞에 선, 시엘로와 스카이에게 비행 이론 교육을 듣기 시작했다.
    ja: |-
      シエロとスカイが演台の前に立ち、
      航空理論の授業が始まった
  event_overthehorizon_01_e_3:
    speaker: cielo
    en: While the Over the Horizon Squad is responsible for aerial combat,
    ko: "저희 오버 더 호라이즌 스쿼드는 \n비행기를 이용한 공중전을 담당하고 있는 스쿼드라고 할 수 있는데요~"
    ja: |-
      私たちオーバー・ザ・ホライズンは、
      航空戦を専門とする部隊です。
  event_overthehorizon_01_e_4:
    speaker: cielo
    en: there's actually a secret mission we've been assigned that no one knows about!
    ko: 사실은 그 이면에, 대외적으로는 숨겨져 있는 임무가 있답니다!
    ja: |-
      …ですが、それは表の顔。
      実は、裏では秘密の使命も
      遂行しているんですよ！
  event_overthehorizon_01_e_5:
    speaker: cielo
    en: Curious? Wanna hear more?
    ko: 어때요, 궁금하지 않으신가….
    ja: どうです？気になるでしょう？
  event_overthehorizon_01_e_6:
    speaker: sora
    en: Hehe. ♥
    ko: 후후♥
    ja: ふふ♥
  event_overthehorizon_01_e_7:
    speaker: "<Self>"
    en: Sora, why are you sitting with us?
    ko: "…소라는 왜 우리랑 같이 앉아 있는 거야?"
    ja: "…ソラはなぜこちら側で一緒に座ってるんだ？"
  event_overthehorizon_01_e_8:
    speaker: sora
    en: Because I want to be close to you!
    ko: 그냥~ 캡틴이랑 같이 있고 싶어서요?
    ja: ただキャプテンと一緒にいたいからで～す。
  event_overthehorizon_01_e_9:
    speaker: "<Self>"
    en: Uh-huh...
    ko: 그렇… 구나.
    ja: そうか…
  event_overthehorizon_01_e_10:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_01_e_11:
    speaker: anis
    en: "... Ahem."
    ko: "…크흠."
    ja: "…コホン。"
  event_overthehorizon_01_e_12:
    speaker: cielo
    en: Um... Hey, everyone? You're all listening, right?
    ko: |-
      저… 저기, 여러분~?
      듣고 계신 거죠?
    ja: |-
      あ…あのぉ、皆さ～ん？
      私の話、聞いてますか？
  event_overthehorizon_01_e_13:
    speaker: anis
    en: Uh, y-yeah! We're listening!
    ko: 그, 그럼~! 듣고 있지!
    ja: も、もっちろん！聞いてるわよ！
  event_overthehorizon_01_e_14:
    speaker: neon
    en: Yes, teacher!
    ko: 네! 선생님!
    ja: はい！先生！
  event_overthehorizon_01_e_15:
    speaker: cielo
    en: T-teacher...?
    ko: 서, 선생님…!
    ja: せ、先生っ…！
  event_overthehorizon_01_e_16:
    speaker: cielo
    en: "*Sniff* Such touching words...!"
    ko: 흑, 이렇게나 감동적인 말이…!
    ja: うぅ、何て感動的な言葉…！
  event_overthehorizon_01_e_17:
    speaker: sora
    en: Cielo, please. You're in public.
    ko: "시엘로★ \n아직 승객 여러분 앞이에요~"
    ja: |-
      シエロ～★
      乗客の皆様の前ですよ～
  event_overthehorizon_01_e_18:
    speaker: cielo
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_e_19:
    speaker: cielo
    en: Oh, right! Ahem!
    ko: 아, 그렇죠! 흠흠!
    ja: あ、そうでした！オホン、コホン！
  event_overthehorizon_01_e_20:
    speaker: cielo
    en: To continue,
    ko: 말을 이어가자면,
    ja: 話を戻しますと…
  event_overthehorizon_01_e_21:
    speaker: cielo
    en: our ultimate goal is...
    ko: 저희의 궁극적인 목표는…!
    ja: 私たちの究極の目標…！
  event_overthehorizon_01_e_22:
    speaker: cielo
    en: to find the legendary aircraft!
    ko: 전설의 비행기를 찾는 거예요!
    ja: |-
      それは、伝説の空飛ぶ船を
      見つけることなんです！
  event_overthehorizon_01_e_23:
    speaker: "<Self>"
    en: Legendary aircraft?
    ko: 전설의 비행기?
    ja: 伝説の空飛ぶ船？
  event_overthehorizon_01_e_24:
    speaker: cielo
    en: Yeah!
    ko: 예!
    ja: はい！
  event_overthehorizon_01_e_25:
    speaker: cielo
    en: It's an aircraft that was used in the 1st Rapture Invasion
    ko: 과거 1차 랩쳐 침공 당시에 사용되었던 전설의 비행기가 있다고 해요.
    ja: |-
      一説によれば、
      第一次ラプチャー侵攻の時代には
      ある飛空艇が活躍していたそうなんです。
  event_overthehorizon_01_e_26:
    speaker: cielo
    en: and it's called Wings of Victory!
    ko: 이름은 [승리의 날개 호]!
    ja: その名も「勝利の翼号」！
  event_overthehorizon_01_e_27:
    speaker: rapi
    en: Wings of Victory...?
    ko: 승리의 날개 호…?
    ja: 勝利の翼号…？
  event_overthehorizon_01_e_28:
    speaker: anis
    en: Cool name!
    ko: 오, 이름 멋진데?
    ja: へえ、名前は悪くないんじゃない？
  event_overthehorizon_01_e_29:
    speaker: neon
    en: Yeah, super cool!
    ko: 그러게요!
    ja: パワーを感じます！
  event_overthehorizon_01_e_30:
    speaker: cielo
    en: Right?! I see that you all have good taste! I've always felt the same way.
    ko: |-
      그렇죠!! 역시 뭘 좀 아시는군요!
      저도 늘 그렇게 생각했어요~
    ja: |-
      でしょう？
      名前の良さが分かるなんてお目が高いです！
      私もまったく同じ意見ですね～
  event_overthehorizon_01_e_31:
    speaker: cielo
    en: But...
    ko: 하지만….
    ja: ですが…
  event_overthehorizon_01_e_32:
    speaker: cielo
    en: Right now, we're not able to take on missions to find that, sadly.
    ko: 지금 저희는 그것을 찾는 업무는 못하고 있는 상황이랍니다.
    ja: |-
      そちらの任務はほぼ立ち消えに
      なってるんですよね…
  event_overthehorizon_01_e_33:
    speaker: neon
    en: Why's that?
    ko: 왜요?
    ja: どうしてですか？
  event_overthehorizon_01_e_34:
    speaker: neon
    en: Isn't an aerial search way easier than searching from the ground?
    ko: 하늘에서 탐색하는 건 지상에서 찾는 것보다는 더 쉽지 않나요?
    ja: 空から探せば簡単そうですけど。
  event_overthehorizon_01_e_35:
    speaker: cielo
    en: Well...
    ko: 그게~
    ja: そういうわけにもいかないんです～
  event_overthehorizon_01_e_36:
    speaker: sky
    en: That's because of the Tyrant-class Rapture, Storm Bringer.
    ko: 타일런트 급 랩쳐, 스톰 브링어 때문이에요.
    ja: |-
      空にはタイラント級ラプチャー、
      ストームブリンガーがいますから。
  event_overthehorizon_01_e_37:
    speaker: sky
    en: Going up against it with just a transport ship is basically a suicide mission.
    ko: 과거에 사용되었다고 하는 [승리의 날개 호]와 같은,
    ja: それこそ伝説に残る「勝利の翼号」のように…
  event_overthehorizon_01_e_38:
    speaker: sky
    en: Unless it is a huge, fully armed airship like Wings of Victory that was used
      in the past,
    ko: 무장 시설을 완벽히 갖춘 거대한 비행선이 아닌 이상.
    ja: 完全に武装した飛行戦艦でもないと。
  event_overthehorizon_01_e_39:
    speaker: sky
    en: there is almost no chance of winning.
    ko: 수송선만으로 그것과 싸워서 이기는 것은 불가능에 가깝죠.
    ja: 輸送機だけじゃ戦いにもなりません。
  event_overthehorizon_01_e_40:
    speaker: sky
    en: That's why flight missions are usually limited to areas without anti-air weaponry,
    ko: 그렇기에, 일반적으로 비행 작전은 대공 화기가 없는 곳에서,
    ja: |-
      それで、一般的な飛行任務において
      対空火器がない空域での飛行は…
  event_overthehorizon_01_e_41:
    speaker: sky
    en: and even then, flight time is capped at around an hour max.
    ko: 최대 1시간 정도까지만 비행하는 것으로 제한되어 있어요.
    ja: 長くても1時間程度に制限されてます。
  event_overthehorizon_01_e_42:
    speaker: sky
    en: At higher speeds, the engine noise gets too loud to hide,
    ko: 그마저도 빠른 속도로 이동 시, 커지는 엔진음을 숨길 수 없어,
    ja: しかも、エンジン音を抑えないといけないので…
  event_overthehorizon_01_e_43:
    speaker: sky
    en: so we can't move as fast as we would like.
    ko: 빠르게 움직이지도 못하고요.
    ja: 速度の方も大幅に制限されるんです。
  event_overthehorizon_01_e_44:
    speaker: sky
    en: Basically, proper search missions have become impossible.
    ko: 그래서 수색은… 불가능한 상황이라고 할 수 있죠.
    ja: |-
      そういう事情で、空からの探索は
      不可能なんですよね。
  event_overthehorizon_01_e_45:
    speaker: "<Self>"
    en: I see.
    ko: "…그랬구나."
    ja: "…なるほど"
  event_overthehorizon_01_e_46:
    speaker: cielo
    en: So, right now,
    ko: 그래서 현재 저희 스쿼드의 주 업무는~!
    ja: ですので、私たちの現在の最優先任務は～！
  event_overthehorizon_01_e_47:
    speaker: cielo
    en: our squad's main job is to provide support for resource-gathering squads.
    ko: 자원 채집 부대가 찾은 물건들을 무사히 가져올 수 있도록,
    ja: |-
      資源採集部隊が回収したものを
      安全に運搬すること。
  event_overthehorizon_01_e_48:
    speaker: cielo
    en: We help make sure all the stuff they find gets safely transported back without
      any trouble.
    ko: 수송 지원 업무를 하고 있답니다~
    ja: つまり、輸送支援が主な任務なんです～
  event_overthehorizon_01_e_49:
    speaker: neon
    en: That's still pretty darn cool!
    ko: 그것도 정말 멋진 일이네요!
    ja: それもすごく素敵なお仕事ですね！
  event_overthehorizon_01_e_50:
    speaker: cielo
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_e_51:
    speaker: cielo
    en: Wow, today... I've heard so many things for the first time! I'm really happy
      that there are people who appreciate what we do!
    ko: |-
      오늘 정말… 처음 듣는 말이 너무 많네요…!
      알아주시는 분이 있다니 너무 기뻐요!
    ja: |-
      今日は本当に…初めてのことばかりです…！
      分かってくださる方がいるなんて！
  event_overthehorizon_01_e_52:
    speaker: cielo
    en: Lately, there have been cases where the amount of resources found on the surface
    ko: 요즘 지상에서 발견된 물자의 숫자와
    ja: 最近は地上で回収してきた物資の数が
  event_overthehorizon_01_e_53:
    speaker: cielo
    en: and the amount that actually arrives at the Ark after inspection don't match
      up,
    ko: 방주에 들어와서 검문을 받을 때 물자의 숫자가 다른 일이 발견돼서,
    ja: アークで検査した時に合わないことがあって…
  event_overthehorizon_01_e_54:
    speaker: cielo
    en: and that's been really upsetting me.
    ko: 마음이 너무 심란했거든요~
    ja: 悔しい気持ちで過ごしていたところなんですよ～
  event_overthehorizon_01_e_55:
    speaker: "<Self>"
    en: So the resources that are initially being found aren't all showing up in the
      Ark?
    ko: 발견된 물자의 숫자와 검문받을 때의 숫자가 다르다고?
    ja: 物資の数が合わない？
  event_overthehorizon_01_e_56:
    speaker: cielo
    en: Yeah, that's right.
    ko: 네~ 달랐어요.
    ja: はい～そうなんです。
  event_overthehorizon_01_e_57:
    speaker: cielo
    en: Like I said earlier, since our flight time is limited,
    ko: 뭐, 아까 말씀드렸듯 비행 작전 시간도 한정되어 있다 보니까,
    ja: |-
      まあ、先ほど言った通り
      飛行作戦は時間の制約が厳しいですし…
  event_overthehorizon_01_e_58:
    speaker: cielo
    en: we don't really have enough time on the surface to get an exact count of the
      resources.
    ko: 지상에서 완벽하게 물자의 수를 파악할 시간이 없다 보니,
    ja: |-
      地上で物資の数をきっちり確認する
      余裕もありませんので。
  event_overthehorizon_01_e_59:
    speaker: cielo
    en: So there are sometimes tiny differences, like a missing item or two.
    ko: 아주 미묘하게 한두 개 정도는 다른 경우가 있긴 했는데요.
    ja: |-
      多少の誤差が生じることは
      新しいことでもないんですけどね。
  event_overthehorizon_01_e_60:
    speaker: cielo
    en: This time was pretty much the same.
    ko: 이번에도 그 정도 숫자이기는 했는데,
    ja: 今回もその程度の誤差には収まっていますが…
  event_overthehorizon_01_e_61:
    speaker: cielo
    en: But the thing is, the gatherers actually confirmed that all the stuff they
      found was there and accounted for.
    ko: 문제는 자원 채집 부대원이 찾은 물건들은 모두 제대로 있다는 걸 알게 되었다는 거죠.
    ja: |-
      問題は、資源採集部隊からの物資は、
      ちゃんと全部あるということなんです。
  event_overthehorizon_01_e_62:
    speaker: neon
    en: Huh? But why would that be a problem?
    ko: 음? 그런데 그게 왜 문제가 되는 거죠?
    ja: え？どうしてそれが問題になるんですか？
  event_overthehorizon_01_e_63:
    speaker: neon
    en: Isn't it a good thing that nothing was stolen?
    ko: 도둑맞은 물건이 없으니 좋은 거 아닌가요?
    ja: 何も盗まれてないなら、問題ないのでは？
  event_overthehorizon_01_e_64:
    speaker: rapi
    en: Put simply, the problem is that unknown items have made it into the Ark and
      are now unaccounted for.
    ko: 반대로 말하면, 내용물을 알 수 없는 물건이 방주에 들어오면서 사라졌다는 거니까 문제가 되겠지.
    ja: |-
      中身の分からない荷物が
      アークで姿を消しているということね。
  event_overthehorizon_01_e_65:
    speaker: "<Self>"
    en: Smuggling, you mean?
    ko: 밀수했다는 거야?
    ja: 何かが密輸されている？
  event_overthehorizon_01_e_66:
    speaker: cielo
    en: Exactly!
    ko: 맞아요!
    ja: そうなんです！
  event_overthehorizon_01_e_67:
    speaker: cielo
    en: That's how the suspicion that there might be smugglers started to grow.
    ko: 그래서 혹시나 밀수범이 있는 것이 아닌가~ 하는 의심이 싹트기 시작한 거죠.
    ja: |-
      当然、誰かがこっそり何かを
      運び込んでるんじゃないか〜って
      疑いが出始めたんですよ。
  event_overthehorizon_01_e_68:
    speaker: cielo
    en: Because of that, inspections were tightened up,
    ko: 그래서 검문도 강화되고~
    ja: 検査も強化されましたし。
  event_overthehorizon_01_e_69:
    speaker: cielo
    en: and all the supplies we brought in this time got stuck piled up in G12. It
      really upsets me!
    ko: 이번에 들여온 물자가 이동을 못하고 g12에 쌓아두게 되어서, 마음이 정말 심란했는데!
    ja: |-
      最近運び込んだ物資も
      g12で止められてしまって…
      もう私、もどかしくて仕方が無くて！
  event_overthehorizon_01_e_70:
    speaker: cielo
    en: But honestly, now that you're all here, all that gloomy feeling just seems
      to vanish all at once...
    ko: 그 우울했던 감정들이 한꺼번에 사라지는 느낌이….
    ja: |-
      でも、皆さんのおかげで、
      スーッと気持ちが楽になっていくような…
  event_overthehorizon_01_e_71:
    speaker: sky
    en: Ahem!
    ko: 흐, 흠!
    ja: オホンッ！
  event_overthehorizon_01_e_72:
    speaker: sky
    en: Cielo. Could you please brief everyone on the other mission as well?
    ko: "시엘로. \n다른 임무도 말씀드려야죠."
    ja: |-
      シエロ。
      他の任務についても説明しましょうか。
  event_overthehorizon_01_e_73:
    speaker: cielo
    en: Oh my, where's my head today?
    ko: 어머어머, 제 정신 좀 봐~!
    ja: あらあら、私としたことが～！
  event_overthehorizon_01_e_74:
    speaker: cielo
    en: Besides that,
    ko: 그 외에도,
    ja: この他には…
  event_overthehorizon_01_e_75:
    speaker: cielo
    en: we also handle large-scale surface reclamation missions, rush out to support
      in special emergency situations,
    ko: |-
      대규모 지상 탈환 작전이나,
      긴급하게 지원 요청을 위해 움직이는 특수한 상황이 발생할 경우.
    ja: |-
      大規模な地上作戦や緊急支援など、
      特殊な状況下での必要に応じて
  event_overthehorizon_01_e_76:
    speaker: cielo
    en: and sometimes airlifting large numbers of personnel.
    ko: 수송기로 대규모 인원을 수송하는 업무를 하기도 한답니다~
    ja: |-
      輸送機による大規模な
      人員輸送をすることもあります。
  event_overthehorizon_01_e_77:
    speaker: sky
    en: This is all to say that there may well be times
    ko: 그래서 여러분도 혹시나,
    ja: ですから、皆さんがいつか…
  event_overthehorizon_01_e_78:
    speaker: sky
    en: when you require help from us,
    ko: 저희의 도움을 받아서 움직일 경우가 있을 수 있으니,
    ja: |-
      私たちとそういった任務で
      ご一緒することがあるかもしれませんので
  event_overthehorizon_01_e_79:
    speaker: sky
    en: and that's precisely what this training is meant for.
    ko: 그때를 대비해서 교육을 받으시는 거예요.
    ja: |-
      その時に備えて、事前の教育を
      行っているというわけです。
  event_overthehorizon_01_e_80:
    speaker: "<Self>"
    en: Understood.
    ko: 그런 거였구나.
    ja: なるほどな
  event_overthehorizon_01_e_81:
    speaker: cielo
    en: On that note,
    ko: 그런 의미에서~!
    ja: そういうことですので～！
  event_overthehorizon_01_e_82:
    speaker: cielo
    en: let me go into more detail!
    ko: 저도 열심히 설명해 드릴게요!
    ja: 私も全力で説明させていただきます！
  event_overthehorizon_01_e_83:
    speaker: "<Monologue>"
    en: Cielo begins explaining proper conduct during aerial operations.
    ko: 시엘로가 비행 작전 시 행동 요령에 대해 설명을 이어 나가기 시작했다.
    ja: |-
      続いてシエロが飛行作戦時の
      行動について説明を始めた
  event_overthehorizon_01_e_84:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_01_e_85:
    speaker: "<Monologue>"
    en: I can feel someone's eyes burning in the back of my head.
    ko: 계속 누군가의 시선이 느껴진다.
    ja: 先ほどからずっと誰かに見られている気がする
  event_overthehorizon_01_e_86:
    speaker: "<Monologue>"
    en: I turn my head toward where it's coming from.
    ko: 시선이 느껴지는 방향으로 고개를 돌렸다.
    ja: 視線を感じる方向に顔を向けた
  event_overthehorizon_01_e_87:
    speaker: sora
    en: "... ☆"
    ko: "…☆"
    ja: "…☆"
  event_overthehorizon_01_e_88:
    speaker: "<Monologue>"
    en: My eyes meet Sora's.
    ko: 소라와 눈이 마주쳤다.
    ja: ソラと目が合った
  event_overthehorizon_01_e_89:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_01_e_90:
    speaker: "<Monologue>"
    en: Sora shakes her head, as if telling me there's nothing to worry about.
    ko: 소라가 아무것도 아니라는 듯 고개를 저었다.
    ja: ソラが何でもないという様子で顔を横に振った
  event_overthehorizon_01_e_91:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_01_e_92:
    speaker: "<Monologue>"
    en: I look ahead again.
    ko: 다시 앞을 바라보았다.
    ja: 再び前を向いた
  event_overthehorizon_01_e_93:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_overthehorizon_01_e_94:
    speaker: "<Monologue>"
    en: Once again, I feel eyes on me.
    ko: 또다시 누군가의 시선이 느껴진다.
    ja: まだ視線を感じる
  event_overthehorizon_01_e_95:
    speaker: "<Monologue>"
    en: I turn my head toward where it's coming from.
    ko: 시선이 느껴지는 방향으로 고개를 돌렸다.
    ja: 視線を感じる方向に顔を向けた
  event_overthehorizon_01_e_96:
    speaker: sora
    en: "... ★"
    ko: "…★"
    ja: "…★"
  event_overthehorizon_01_e_97:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_01_e_98:
    speaker: "<Monologue>"
    en: 'Sora silently mouths to me:'
    ko: 소라가 소리 없이 입을 벌렸다.
    ja: ソラが声を出さずに口を開いた
  event_overthehorizon_01_e_99:
    speaker: "<Monologue>"
    en: '"Captain. ♥"'
    ko: "[캡 틴 ♥]"
    ja: "「キャプテン♥」"
  event_overthehorizon_01_e_100:
    speaker: "<Narration>"
    en: "*Smooch*"
    ko: 쪽-
    ja: チュッ
  event_overthehorizon_01_e_101:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_01_e_102:
    speaker: "<Monologue>"
    en: I quickly turn back around.
    ko: 황급히 고개를 돌렸다.
    ja: 私はあわてて顔を背けた
  event_overthehorizon_01_e_103:
    speaker: sora
    en: Hehe. ♥
    ko: 하하♥
    ja: ふふ♥
  event_overthehorizon_01_e_104:
    speaker: anis
    en: Hey! What's the big idea, flirting with the Commander?!
    ko: "이… 이이이…! \n저게 자꾸 여우짓을…!"
    ja: |-
      ぬ…ぬぬぬ…！
      なんて女狐…何度も何度も…！
  event_overthehorizon_01_e_105:
    speaker: sora
    en: Sorry? What do you mean?
    ko: 네? 뭐가요?
    ja: え？何のことですか？
  event_overthehorizon_01_e_106:
    speaker: sora
    en: I was just admiring how handsome the Captain is.
    ko: 전 그냥 우리 잘생긴 캡틴을 보고 있었을 뿐인걸요?
    ja: |-
      私はただイケメンなキャプテンを
      見てただけですけど？
  event_overthehorizon_01_e_107:
    speaker: anis
    en: You could at least try listening during the lesson, y'know?
    ko: 교육 시간엔 그냥 교육 좀 들으시지?
    ja: 授業中でしょ、集中したら？
  event_overthehorizon_01_e_108:
    speaker: sora
    en: I already know all this stuff... ★
    ko: 전 이미 다 아는 이야기라서…★
    ja: 私は全部知ってることですし…★
  event_overthehorizon_01_e_109:
    speaker: anis
    en: Just be quiet and listen, will you?!
    ko: 그래도 더 들어!
    ja: それでも、ちゃんと聞いときなさいよ！
  event_overthehorizon_01_e_110:
    speaker: cielo
    en: Er... settle down, everyone...
    ko: "어, 어어… 여러분~! \n진정하시고…!"
    ja: |-
      あ、ああ…皆さん～！
      落ち着いてください…！
  event_overthehorizon_01_e_111:
    speaker: sky
    en: "... What a mess."
    ko: "…난장판이군요."
    ja: "…めちゃくちゃですね。"
  event_overthehorizon_01_e_112:
    speaker: sky
    en: Cielo.
    ko: 시엘로.
    ja: シエロ。
  event_overthehorizon_01_e_113:
    speaker: cielo
    en: Yes?
    ko: 네?
    ja: はい？
  event_overthehorizon_01_e_114:
    speaker: sky
    en: Let's move on.
    ko: 다음으로 진행하죠.
    ja: 次の項目に移りましょう。
  event_overthehorizon_01_e_115:
    speaker: sora
    en: Hehe, I think that'd be for the best as well. ♥
    ko: 하하♥ 나도 그게 좋을 거 같아~
    ja: ふふ♥私も賛成～
  event_overthehorizon_01_e_116:
    speaker: "<Self>"
    en: What's next?
    ko: 다음…?
    ja: 次…？
  event_overthehorizon_01_e_117:
    speaker: cielo
    en: A-all right.
    ko: 조, 좋아요~!
    ja: わ、分かりました～！
  event_overthehorizon_01_e_118:
    speaker: cielo
    en: Now then, everyone, we're going to head off to the practical training.
    ko: 자, 그럼 여러분 이제 실전 훈련을 하러 가실 건데요~
    ja: |-
      それでは、皆様。
      次は実戦訓練です～
  event_overthehorizon_01_e_119:
    speaker: cielo
    en: But, um... is it okay if we move now?
    ko: 지금… 이동해도 괜찮으실까요?
    ja: 今から移動しますが、よろしいでしょうか？
  event_overthehorizon_01_e_120:
    speaker: "<Self>"
    en: Okay.
    ko: "…부탁할게."
    ja: "…ああ"
  event_overthehorizon_01_e_121:
    speaker: cielo
    en: Okay, please follow me!
    ko: 네~ 그러면 모시겠습니다~!
    ja: は～い、それではご案内しま～す！
event_overthehorizon_02_s:
  event_overthehorizon_02_s_1:
    speaker: "<Monologue>"
    en: We move to the Simulation Room for practical training,
    ko: 그렇게 우리는 실전 훈련을 위해,
    ja: そうして私たちは実戦訓練のために
  event_overthehorizon_02_s_2:
    speaker: "<Monologue>"
    en: which has been designed to mimic the interior of a transport aircraft.
    ko: 진짜 수송기 내부처럼 꾸며진 시뮬레이션 룸으로 이동했고….
    ja: |-
      本物の輸送機の内部が忠実に再現された
      シミュレーションルームへと移動した
  event_overthehorizon_02_s_3:
    speaker: sora
    en: Oh no, Captain,
    ko: 캡틴~♥
    ja: キャプテ～ン♥
  event_overthehorizon_02_s_4:
    speaker: sora
    en: not like that. ♥
    ko: 이러면 안 돼요~ 안 돼.
    ja: こらこら、ダメですよ～ダメダメ。
  event_overthehorizon_02_s_5:
    speaker: sora
    en: Your seatbelt is all wrong. ★
    ko: 안전벨트는…★
    ja: シートベルトは…★
  event_overthehorizon_02_s_6:
    speaker: "<Monologue>"
    en: Sora reaches out her hand.
    ko: 소라가 손을 뻗어왔다.
    ja: ソラがこちらに手を伸ばした
  event_overthehorizon_02_s_7:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャッ
  event_overthehorizon_02_s_8:
    speaker: sora
    en: After it clicks perfectly into place... ♥
    ko: 이렇게~ 잘 맞물려 준 다음에…♥
    ja: こうやって～しっかり固定して～♥
  event_overthehorizon_02_s_9:
    speaker: "<Narration>"
    en: "*Schnick*"
    ko: 지익-!
    ja: グイッ！
  event_overthehorizon_02_s_10:
    speaker: sora
    en: To make it tight...
    ko: 꽈악~
    ja: ギュゥ～っと～
  event_overthehorizon_02_s_11:
    speaker: "<Self>"
    en: Urgh!
    ko: 윽…!
    ja: うっ…！
  event_overthehorizon_02_s_12:
    speaker: sora
    en: You gotta pull it. ♥
    ko: 당겨줘야 한다고요♥
    ja: 締めておかないと♥
  event_overthehorizon_02_s_13:
    speaker: "<Self>"
    en: It's not exactly comfortable...
    ko: 조금 아픈데….
    ja: 少し痛いのだが…
  event_overthehorizon_02_s_14:
    speaker: sora
    en: Oh, I'm sorry!
    ko: 많이 아프셨어요?
    ja: 痛かったですか？
  event_overthehorizon_02_s_15:
    speaker: sora
    en: Does it hurt? ♥
    ko: 죄송해요♥
    ja: ごめんなさい♥
  event_overthehorizon_02_s_16:
    speaker: sora
    en: Here, let me loosen it up a little. ★
    ko: 그럼 조금만 풀어줘야겠다~★
    ja: じゃあ、ちょっとだけ緩めますね～★
  event_overthehorizon_02_s_17:
    speaker: "<Monologue>"
    en: Sora reaches out her hand again.
    ko: 소라가 다시 손을 뻗어왔다.
    ja: ソラが再びこちらに手を伸ばした
  event_overthehorizon_02_s_18:
    speaker: anis
    en: Hey! Quit being so handsy with the Commander, would you?
    ko: 야! 너 지휘관님한테 손 떼!
    ja: ちょっと！指揮官様にベタベタ触らないの！
  event_overthehorizon_02_s_19:
    speaker: rapi
    en: Are you all right, Commander? I heard you cry out in pain just now...
    ko: 지휘관? 방금 고통스러워하시는 소리가….
    ja: |-
      指揮官？さきほど苦しそうな声が
      聞こえましたが…
  event_overthehorizon_02_s_20:
    speaker: sora
    en: Huh? What are you all doing here?
    ko: 어라? 둘 다 지금 자리에서 이탈하신 거 아니에요?
    ja: あれれ？お二人とも、なんでこちらに？
  event_overthehorizon_02_s_21:
    speaker: sora
    en: Your assigned seats are in another area. ★
    ko: 여긴 두 분 구역이 아닌데~★
    ja: お席はあちらですよ～★
  event_overthehorizon_02_s_22:
    speaker: anis
    en: Who gives a flying crap about assigned seats right now?!
    ko: 아니 지금 구역이고 나발이고를 지킬 때야?
    ja: 席の指定なんかどうでもいいでしょ？
  event_overthehorizon_02_s_23:
    speaker: neon
    en: Yeah, exactly!
    ko: 옳소 옳소!
    ja: そうですよ！
  event_overthehorizon_02_s_24:
    speaker: neon
    en: We wanna sit beside Master too!
    ko: 저희도 스승님 옆에 앉아서 가고 싶은데요!
    ja: 私たちも師匠の隣を希望します！
  event_overthehorizon_02_s_25:
    speaker: rapi
    en: Is everything okay, Commander?
    ko: "…지휘관, 괜찮으십니까?"
    ja: "…指揮官、大丈夫ですか？"
  event_overthehorizon_02_s_26:
    speaker: "<Self>"
    en: "... I'm fine."
    ko: "…괜찮아."
    ja: "…ああ"
  event_overthehorizon_02_s_27:
    speaker: "<Self>"
    en: I'm just... a little tired, that's all.
    ko: 아주 조금… 피곤해서 그래.
    ja: 少し…疲れただけだ
  event_overthehorizon_02_s_28:
    speaker: "<Monologue>"
    en: It's in the Simulation Room where I find myself in my current predicament.
    ko: "…이 상황을 마주하게 되었다."
    ja: "…そうして、今に至る"
  event_overthehorizon_02_s_29:
    speaker: "<Narration>"
    en: "*Bzz*"
    ko: 치직-
    ja: ザザッ…
  event_overthehorizon_02_s_30:
    speaker: sky_op_r
    en: Cielo, Sora. Have the passengers been seated?
    ko: "시엘로, 소라. \n승객분들의 안내를 완료했나요?"
    ja: |-
      シエロ、ソラ。
      乗客の皆様は、無事にご案内できましたか？
  event_overthehorizon_02_s_31:
    speaker: cielo
    en: Well, we directed them to their seats, but...
    ko: 음~ 안내를 드리긴 했는데, 그게….
    ja: うーん、ご案内はしましたが、その…
  event_overthehorizon_02_s_32:
    speaker: "<Monologue>"
    en: Sora raises both of her hands.
    ko: 소라가 양손을 들어 올렸다.
    ja: ソラが両手を上げてみせた
  event_overthehorizon_02_s_33:
    speaker: sora
    en: Okay, okay, I get it. ♥
    ko: |-
      워워~♥
      후후, 알겠으니까~
    ja: |-
      まあまあ～♥
      ふふ、分かりましたから～
  event_overthehorizon_02_s_34:
    speaker: sora
    en: Everyone, can we please settle down and take our assigned seats?
    ko: |-
      승객 여러분은 흥분을 가라앉히고,
      모두 자리에 착석해 주세요~
    ja: |-
      乗客の皆様、まずは落ち着いて
      お席にお座りくださ～い。
  event_overthehorizon_02_s_35:
    speaker: rapi
    en: "... Let's go, Anis."
    ko: "…아니스."
    ja: "…アニス。"
  event_overthehorizon_02_s_36:
    speaker: anis
    en: Don't you try any funny business, you hear me?!
    ko: 너어… 이상한 짓 하지 마!
    ja: |-
      あんたね…また変な真似したら、
      ただじゃ置かないわよ！
  event_overthehorizon_02_s_37:
    speaker: sora
    en: I wouldn't dream of it.
    ko: 그럼요~
    ja: 分かってますって～
  event_overthehorizon_02_s_38:
    speaker: "<Monologue>"
    en: Anis storms off in a huff.
    ko: 아니스가 씩씩거리며 떠나갔다.
    ja: アニスは、肩をいからせながらその場を離れた
  event_overthehorizon_02_s_39:
    speaker: sora
    en: Hehe, I have to admit that it's fun getting a rise out of them. ♥
    ko: 후후, 정말 놀리는 재미가 있는 분들이네요~♥
    ja: |-
      ふふ、ホントに
      からかい甲斐のある人たちですね～♥
  event_overthehorizon_02_s_40:
    speaker: "<Self>"
    en: You shouldn't tease them so much.
    ko: 너무 놀리지는 마.
    ja: ほどほどに頼む
  event_overthehorizon_02_s_41:
    speaker: sora
    en: I wouldn't dare! Passengers ought to be treated with the utmost respect.
    ko: 그럼요~ 소중한 승객분들인데 아껴드려야죠.
    ja: |-
      分かってますよ～
      大事なお客様ですから。
      しっかりおもてなししますね。
  event_overthehorizon_02_s_42:
    speaker: sora
    en: But I wasn't just teasing you, okay? ★
    ko: 하지만 전부 놀리기 위한 말은 아니었어요★
    ja: |-
      でも、さっきの話。
      全部が全部、冗談ってわけじゃないんですよ★
  event_overthehorizon_02_s_43:
    speaker: sora
    en: I really am
    ko: 전 정말로~★
    ja: 私は正真正銘～★
  event_overthehorizon_02_s_44:
    speaker: sora
    en: a Nikke assigned to protect the Captain on this flight, you know?
    ko: 이 비행기 안에서 캡틴을 지켜야 하는 임무를 맡은 니케랍니다?
    ja: |-
      この飛行機の中にいる限り
      キャプテンをお守りするために
      いるんですから。
  event_overthehorizon_02_s_45:
    speaker: sora
    en: So...
    ko: 그러니….
    ja: ですので～
  event_overthehorizon_02_s_46:
    speaker: sora
    en: you'll be sticking close to me for the whole trip. ♥
    ko: 오늘 비행은 저와 함께 있으셔야 해요♥
    ja: |-
      今日のフライトでは、
      私のそばにいてくださいね♥
  event_overthehorizon_02_s_47:
    speaker: "<Self>"
    en: Got it.
    ko: 알겠어.
    ja: 分かった
  event_overthehorizon_02_s_48:
    speaker: sora
    en: Have you ever flown in a transport aircraft before?
    ko: 캡틴은 수송기 타본 적 있으세요?
    ja: ところで、輸送機に乗ったことはありますか？
  event_overthehorizon_02_s_49:
    speaker: "<Self>"
    en: Yeah, I have.
    ko: 응. 있어.
    ja: ああ
  event_overthehorizon_02_s_50:
    speaker: sora
    en: Oh, really? What kind of aircraft was it?
    ko: 어머나~ 어떤 비행기였어요?
    ja: わあ～、どんな飛行機だったんですか？
  event_overthehorizon_02_s_51:
    speaker: sora
    en: I'm jealous that your "first time" was with someone else!
    ko: 캡틴을 태우고 날았다니, 부럽네~♥
    ja: |-
      キャプテンを乗せて飛んだなんて、
      うらやましい～♥
  event_overthehorizon_02_s_52:
    speaker: "<Self>"
    en: It was during my first mission,
    ko: 첫 임무 때였어.
    ja: 初任務の時だったな
  event_overthehorizon_02_s_53:
    speaker: "<Self>"
    en: but it didn't end well, though...
    ko: 끝은 좋지 않았지만….
    ja: まあ、最後は散々だったが…
  event_overthehorizon_02_s_54:
    speaker: sora
    en: It didn't?
    ko: 끝이 좋지 않았다고요?
    ja: え？散々？
  event_overthehorizon_02_s_55:
    speaker: "<Narration>"
    en: "*Bzz*"
    ko: 치직-
    ja: ザザッ…
  event_overthehorizon_02_s_56:
    speaker: sky_op
    en: Cielo, Sora, are you ready?
    ko: |-
      시엘로, 소라.
      아직인가요?
    ja: |-
      シエロ、ソラ。
      まだですか？
  event_overthehorizon_02_s_57:
    speaker: sky_op
    en: It's time to depart.
    ko: 이제 출발할 시간이에요.
    ja: 出発しますよ。
  event_overthehorizon_02_s_58:
    speaker: sora
    en: Oh dear, what a shame. We're out of time.
    ko: |-
      에구, 어쩔 수 없네요.
      시간이 없으니~
    ja: |-
      あら、仕方ありませんね。
      今は時間がありませんので～
  event_overthehorizon_02_s_59:
    speaker: sora
    en: Hehe, I'll save this precious little story for later. ♥
    ko: 후후, 이 귀중한 얘긴 나중에 듣도록 할게요~♥
    ja: |-
      ふふ、貴重なお話は
      また後でゆっくり聞かせてくださいね～♥
  event_overthehorizon_02_s_60:
    speaker: "<Self>"
    en: Sure.
    ko: 그래.
    ja: ああ
  event_overthehorizon_02_s_61:
    speaker: sora
    en: Now then...
    ko: 자~ 그럼.
    ja: それでは～
  event_overthehorizon_02_s_62:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삐빅-
    ja: ピピーッ
  event_overthehorizon_02_s_63:
    speaker: sora
    en: Ready when you are, Sky! ♥
    ko: |-
      스카이~♥
      준비 완료예요!
    ja: |-
      スカイ～♥
      準備完了です！
  event_overthehorizon_02_s_64:
    speaker: sky_op_c
    en: Roger that.
    ko: 좋아요.
    ja: ラジャー。
  event_overthehorizon_02_s_65:
    speaker: sky_op_c
    en: Ahem. Attention, all passengers.
    ko: 아아. 승객 여러분께 안내 말씀드립니다.
    ja: 乗客の皆様にご案内申し上げます。
  event_overthehorizon_02_s_66:
    speaker: sky_op_c
    en: Today's flight simulation will cover
    ko: "오늘 체험해 볼 비행은, \n난기류에 만났을 때 우리는 어떻게 대처할 것인가."
    ja: |-
      本日の体験飛行では、
      乱気流を体験させてや…
  event_overthehorizon_02_s_67:
    speaker: sky_op_c
    en: what you should do when you encounter turbulence.
    ko: "…라는 거예요."
    ja: "…体験していただきます。"
  event_overthehorizon_02_s_68:
    speaker: sky_op_c
    en: In short, you're in for some headbanging.
    ko: 한 마디로, 미친 듯이 헤드뱅잉을 한다는 거겠죠?
    ja: |-
      簡単に申しますと、
      イカれたみてぇに頭を振りやがれ…
      ということです。
  event_overthehorizon_02_s_69:
    speaker: sky_op_c
    en: You might end up blowing chunks,
    ko: 조금 구토가 나올 수 있겠지만,
    ja: |-
      多少、気分が悪くなる方も
      いらっしゃるでしょうが、
  event_overthehorizon_02_s_70:
    speaker: sky_op_c
    en: but that's not my problem.
    ko: 뭐. 그건 제 사정 아니니까.
    ja: こっちの知ったこっちゃねぇ…です。
  event_overthehorizon_02_s_71:
    speaker: sky_op_c
    en: You can spew all you want, but I have no intention of stopping this flight
      for anything.
    ko: 제 비행을 멈출 생각은 조금도 없으니,
    ja: フライトに中止などありません。
  event_overthehorizon_02_s_72:
    speaker: sky_op_c
    en: If you feel like you're gonna die, grab a nearby crew member and ask her to
      knock you out.
    ko: 뒤질 것 같으면, 주변에 있는 승무원을 잡고 기절시켜달라고 해보시던가!
    ja: |-
      くたばりそうになったら、近くの乗務員に
      気絶させてもらうなり何なり…
      勝手にどうにかしろってこった！
  event_overthehorizon_02_s_73:
    speaker: "<Self>"
    en: What in the world...
    ko: 뭔가 스카이의 말투가….
    ja: 機長の様子がおかしい気がするが…
  event_overthehorizon_02_s_74:
    speaker: sora
    en: She got a little wild, huh?
    ko: 와일드해졌죠~?
    ja: ワイルドになりましたよね～？
  event_overthehorizon_02_s_75:
    speaker: sora
    en: Sky tends to get that way whenever she's behind the wheel. ★
    ko: 우리 스카이는 운전대만 잡으면, 와일드해지는 편이라서요~★
    ja: |-
      うちのスカイは、ハンドルを握ると
      ああなるタイプなんです～★
  event_overthehorizon_02_s_76:
    speaker: "<Self>"
    en: That means...
    ko: 그렇다는 건….
    ja: それはつまり…
  event_overthehorizon_02_s_77:
    speaker: sora
    en: Yeah, she flies like a total lunatic too.
    ko: 맞아요. 운전도 험하게 한다는 거겠죠?
    ja: |-
      そうですね～
      操縦もあんな感じになりますよ？
  event_overthehorizon_02_s_78:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_02_s_79:
    speaker: sora
    en: So, you better buckle up! ♥
    ko: 그러니 잘 적응하셔야 해요~♥
    ja: ですから、ちゃんと慣れておいてくださいね～♥
  event_overthehorizon_02_s_80:
    speaker: "<Narration>"
    en: "*Vroooooom*"
    ko: 부우우웅-
    ja: ブゥゥゥン…
  event_overthehorizon_02_s_81:
    speaker: "<Narration>"
    en: With a loud roar, the aircraft's interior begins to shake.
    ko: 거대한 굉음과 함께 비행기 내부가 흔들리기 시작했다.
    ja: |-
      地響きのような轟音と共に、
      機体が激しく揺れだした
  event_overthehorizon_02_s_82:
    speaker: sky_op_c
    en: Let's get this bird off the ground!
    ko: 후후후, 그럼 출발합니다?
    ja: ふふふ、それでは出発しますよ？
event_overthehorizon_02_e:
  event_overthehorizon_02_e_1:
    speaker: "<Narration>"
    en: "*Ziiiiing*"
    ko: 지기지기징징-
    ja: ギュイーン！ ギュギュギュギュイーン！
  event_overthehorizon_02_e_2:
    speaker: "<Monologue>"
    en: Electric guitars blast like they'll burst your eardrums.
    ko: 고막을 터뜨릴 것만 같은 일렉트릭 기타 소리.
    ja: 耳をつんざくエレキギターの爆音
  event_overthehorizon_02_e_3:
    speaker: "<Narration>"
    en: "*Boom boom boom*"
    ko: 두구두구두구-
    ja: ズダダダダダン！
  event_overthehorizon_02_e_4:
    speaker: "<Monologue>"
    en: Drums pound relentlessly against your chest.
    ko: 가슴을 끊임없이 내리치는 드럼 소리.
    ja: 胸を圧迫するドラムの音
  event_overthehorizon_02_e_5:
    speaker: "<Narration>"
    en: Flyyyyyyyyyyy!!!
    ko: 플라이이이야아아아아아-!!!
    ja: フラーーイィィヤアアアアアーーーッ！！
  event_overthehorizon_02_e_6:
    speaker: "<Monologue>"
    en: High-pitched vocals make you want to shake your head right now.
    ko: 당장에라도 머리를 흔들어야 할 것 같은 고음의 노랫소리.
    ja: 思わず頭を振りたくなる甲高いシャウト
  event_overthehorizon_02_e_7:
    speaker: "<Monologue>"
    en: The music feels like it's piercing through your heart and brain...
    ko: 심장을, 뇌를 뚫고 올라갈 것만 같은 이 음악은…!
    ja: |-
      心臓から脳まで揺さぶられるような、
      この音楽は…
  event_overthehorizon_02_e_8:
    speaker: anis
    en: Why the hell is she blasting rock music at a time like this?
    ko: 아니, 무슨 임무 도중에 록을 틀어!
    ja: なんで任務中にロックなんてかけるのよ！
  event_overthehorizon_02_e_9:
    speaker: neon
    en: Owww... my ears feel like they're gonna burst.
    ko: 으으… 귀가 터질 것 같아요.
    ja: うう…鼓膜が破れそうです…
  event_overthehorizon_02_e_10:
    speaker: rapi
    en: Cielo, are you sure this is standard procedure?
    ko: 시엘로, 이게 정말 정규 훈련 방식이 맞아?
    ja: シエロ。これは本当に、正規の訓練方式？
  event_overthehorizon_02_e_11:
    speaker: cielo
    en: It is, but...
    ko: 음~ 그게… 맞기는 한데….
    ja: えっとぉ～その…一応そうなんですけど…
  event_overthehorizon_02_e_12:
    speaker: cielo
    en: Sky seems especially excitable today.
    ko: 오늘 유난히 스카이가 더 신이 난 것 같은 느낌이….
    ja: 今日はスカイの機嫌がいいようで…
  event_overthehorizon_02_e_13:
    speaker: "<Monologue>"
    en: Everyone's shouting echoes through the cabin.
    ko: 모두의 아우성이 들린다.
    ja: 隊員たちの絶叫が聞こえる
  event_overthehorizon_02_e_14:
    speaker: "<Self>"
    en: So... this is what training's like.
    ko: 음… 훈련이 이런거였구나.
    ja: "…こんな訓練になるとは…"
  event_overthehorizon_02_e_15:
    speaker: sora
    en: Ahaha! ♥
    ko: 아하하♥
    ja: あはは♥
  event_overthehorizon_02_e_16:
    speaker: sora
    en: Looks like everyone's having a great time!
    ko: 다들 재미있게 즐겨주고 계시네요~
    ja: |-
      皆さん、楽しんでくれているみたいで、
      ホントに良かったです～
  event_overthehorizon_02_e_17:
    speaker: "<Choice>"
    en: Are you sure...?
    ko: 저게…?
    ja: どこがだ…？
  event_overthehorizon_02_e_18:
    speaker: "<Choice>"
    en: That's right.
    ko: 그렇네.
    ja: そうだな
  event_overthehorizon_02_e_19:
    speaker: sora
    en: Come on, doesn't it look like everyone's having a blast chatting away?
    ko: 에이~ 다들 즐겁게 떠들고 있는 것 같지 않나요?
    ja: |-
      よく見てくださいよ～
      皆さん楽しく騒いでるでしょ？
  event_overthehorizon_02_e_20:
    speaker: sora
    en: They're not at all tense like they were before.
    ko: 아까처럼 험악한 기색도 없고~
    ja: さっきまでのよそよそしい雰囲気が消えて～
  event_overthehorizon_02_e_21:
    speaker: sora
    en: At this moment, they're of one heart and one mind. ♥
    ko: |-
      한마음 한뜻으로♥
      한목소리를 내고 있으니까요.
    ja: |-
      心はひとつ♥って感じで、
      みんなで声を張り上げてるじゃないですか。
  event_overthehorizon_02_e_22:
    speaker: sora
    en: "... ♡"
    ko: "…♡"
    ja: "…♡"
  event_overthehorizon_02_e_23:
    speaker: sora
    en: I knew you'd have a good time with us!
    ko: 역시 캡틴은 이 재미를 함께 즐겨주실 거라고 생각했어요~
    ja: |-
      キャプテンなら分かってくださると
      思ってました～
  event_overthehorizon_02_e_24:
    speaker: sky_op
    en: Hehe, how's everyone digging the tunes?
    ko: 후후후, 이 정도면 다들 적응하셨죠?
    ja: |-
      ふふふ、この調子なら皆さん
      問題なさそうですね。
  event_overthehorizon_02_e_25:
    speaker: sky_op
    en: Let those pulse-pounding rhythms light a fire under your booty
    ko: 이 터질 것 같은 고동을.
    ja: 破裂しそうなこの鼓動を。
  event_overthehorizon_02_e_26:
    speaker: sky_op
    en: and ignite a burning desire to reach the sky!
    ko: 하늘을 향한 이 열망을…!
    ja: 大空への飽くなき渇望を…！
  event_overthehorizon_02_e_27:
    speaker: sky_op
    en: You all ready to rock n' roll?!
    ko: 모두 함께 느끼시고 있겠죠?
    ja: みなさん、感じてますか？
  event_overthehorizon_02_e_28:
    speaker: sora
    en: Yeah! ★
    ko: 예에~★
    ja: イェーイ★
  event_overthehorizon_02_e_29:
    speaker: anis
    en: Don't speak for me!
    ko: 예에는 무슨 예에야!
    ja: イェーイじゃないでしょ！
  event_overthehorizon_02_e_30:
    speaker: anis
    en: Stop this madness this instant!
    ko: 당장 안 멈춰?!
    ja: 今すぐ止めて！
  event_overthehorizon_02_e_31:
    speaker: sky_op
    en: Heh heh heh. I don't take any complaints.
    ko: 후후후. 비난은 듣지 않습니다.
    ja: ふふふ。本フライトはノンストップ。
  event_overthehorizon_02_e_32:
    speaker: sky_op
    en: Anyone who doesn't vibe with the majesty of rock
    ko: ROCK의 울림을 이해하지 못하는 자,
    ja: ロックが理解できねえなら…
  event_overthehorizon_02_e_33:
    speaker: sky_op
    en: can go kick rocks!
    ko: 지하 바닥에나 영영 처박혀 계시죠.
    ja: 一生地下に引っ込んでやがれってことです。
  event_overthehorizon_02_e_34:
    speaker: anis
    en: What the...?!
    ko: 저, 저게…!
    ja: な、なんなのよ…！
  event_overthehorizon_02_e_35:
    speaker: rapi
    en: "*Sigh*..."
    ko: "…하아."
    ja: "…はぁ。"
  event_overthehorizon_02_e_36:
    speaker: sky_op
    en: All right, the wait is over!
    ko: 더 기다려줄 여유 없습니다!
    ja: ああ！もう限界です！
  event_overthehorizon_02_e_37:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ギュイーーーーーン
  event_overthehorizon_02_e_38:
    speaker: sky_op
    en: Next up on the setlist, we have... Rapture Attack!
    ko: 다음 곡, 랩쳐의 습격!
    ja: 次のナンバーは、ラプチャー・アタック！
  event_overthehorizon_02_e_39:
    speaker: neon
    en: Rapture Att—?!
    ko: 랩쳐요?
    ja: ラプチャーですか？
  event_overthehorizon_02_e_40:
    speaker: "<Narration>"
    en: "*Boom*"
    ko: 쾅-!!!
    ja: ドドドドドドドドド！！
  event_overthehorizon_02_e_41:
    speaker: "<Monologue>"
    en: The inside of the aircraft begins to shake violently.
    ko: 비행기 내부가 격렬히 흔들리기 시작했다.
    ja: 機内が激しく揺れ始めた
  event_overthehorizon_02_e_42:
    speaker: neon
    en: Gaaaaaah!
    ko: 으, 으아아!!
    ja: う、うわあ！！
  event_overthehorizon_02_e_43:
    speaker: cielo
    en: All passengers, please remain in your seats.
    ko: |-
      승객 여러분~?
      각자 위치를 유지하시고~
    ja: |-
      皆様～！
      座席にお戻りの上、シートベルトを
      しっかりとお締めください。
  event_overthehorizon_02_e_44:
    speaker: "<Monologue>"
    en: Secure your... safety harnesses...
    ko: 안전장치… 꽉 붙잡으세….
    ja: シートベルトを…しっかりと…
  event_overthehorizon_02_e_45:
    speaker: "<Monologue>"
    en: This... doesn't make... sense...!
    ko: 이… 말… 안 돼…!
    ja: ったく…冗談…じゃ…わ…！
  event_overthehorizon_02_e_46:
    speaker: "<Monologue>"
    en: Command... Okay...!
    ko: 지휘… 괜찮…!!
    ja: 指揮…大丈…！！
  event_overthehorizon_02_e_47:
    speaker: "<Monologue>"
    en: Fire... Recharge...!
    ko: 화ㄹ… 충전…!
    ja: 火りょ…チャージ…！
  event_overthehorizon_02_e_48:
    speaker: "<Monologue>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  event_overthehorizon_02_e_49:
    speaker: "<Monologue>"
    en: Something's not right.
    ko: 이상하다.
    ja: おかしい
  event_overthehorizon_02_e_50:
    speaker: "<Monologue>"
    en: Everyone's voices are starting to sound muffled.
    ko: 모두의 목소리가 점점 먹먹하게 느껴진다.
    ja: 周囲の声が、どんどん遠ざかっていく
  event_overthehorizon_02_e_51:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: それに…
  event_overthehorizon_02_e_52:
    speaker: "<Self>"
    en: Huff... Puff...
    ko: 후… 하….
    ja: はぁ…はぁ…
  event_overthehorizon_02_e_53:
    speaker: "<Monologue>"
    en: It's getting harder to breathe.
    ko: 점점 숨이 답답하게 느껴진다.
    ja: 呼吸ができなくなってきた
  event_overthehorizon_02_e_54:
    speaker: "<Self>"
    en: Huff... What's... going on?
    ko: 후우… 왜 이러… 지?
    ja: はぁ…一体…何、が…？
  event_overthehorizon_02_e_55:
    speaker: sora
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_02_e_56:
    speaker: sora
    en: Captain. Why's your breathing...
    ko: 캡틴. 왜 이렇게 숨을….
    ja: |-
      キャプテン、どうしたんですか？
      なんだか呼吸が…
  event_overthehorizon_02_e_57:
    speaker: "<Monologue>"
    en: My vision is getting blurrier,
    ko: 앞이 점점 뿌옇게 변하고,
    ja: 目の前が次第にかすむ
  event_overthehorizon_02_e_58:
    speaker: "<Monologue>"
    en: and I feel dizzy.
    ko: 어지럽다.
    ja: めまいが…
  event_overthehorizon_02_e_59:
    speaker: "<Self>"
    en: I feel... nauseous...
    ko: 속도… 울렁거려….
    ja: 気持ち…悪…
  event_overthehorizon_02_e_60:
    speaker: sora
    en: Nauseous?
    ko: 속이요?
    ja: え？気持ち悪い？
  event_overthehorizon_02_e_61:
    speaker: sora
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_02_e_62:
    speaker: "<Narration>"
    en: "*Slide*"
    ko: 촤륵-
    ja: カチャッ――
  event_overthehorizon_02_e_63:
    speaker: "<Monologue>"
    en: Sora unbuckles her seatbelt, kneels in front of me, and looks into my eyes.
    ko: 소라가 안전벨트를 풀고, 내 의자 앞에 무릎을 꿇은 채 눈을 마주쳤다.
    ja: |-
      ソラはシートベルトを外すと
      私の目の前で膝をつき、静かに私を観察した
  event_overthehorizon_02_e_64:
    speaker: sora
    en: You're breaking out in cold sweat...
    ko: 식은땀 좀 봐….
    ja: すごい汗…
  event_overthehorizon_02_e_65:
    speaker: sora
    en: Did the same thing happen the last time you were in the air?
    ko: "…혹시 이전에 수송기를 탔을 때도 이랬나요?"
    ja: |-
      …もしかして、以前輸送機に乗った時も
      こうなりましたか？
  event_overthehorizon_02_e_66:
    speaker: "<Self>"
    en: I... don't know.
    ko: 모르… 겠어.
    ja: 思い出せ…ない
  event_overthehorizon_02_e_67:
    speaker: "<Self>"
    en: I don't have... any memories... before the crash.
    ko: 수송기… 추락하기 전의 기억… 잘 없어서.
    ja: 輸送機が…落ちる前の記憶…が…
  event_overthehorizon_02_e_68:
    speaker: sora
    en: Crash?
    ko: 수송기에서 추락?
    ja: 輸送機が墜落？
  event_overthehorizon_02_e_69:
    speaker: sora
    en: So that's what you meant
    ko: 설마 아까 끝이 안 좋았다는 얘기가….
    ja: まさか、散々な最後って言ってたのは…
  event_overthehorizon_02_e_70:
    speaker: sora
    en: when you said things didn't end well?
    ko: 예전에 타셨을 때 추락하셨던 건가요?
    ja: 墜落したってことですか？
  event_overthehorizon_02_e_71:
    speaker: "<Self>"
    en: "*Pant* Yeah."
    ko: 후우… 응.
    ja: ふぅ…ああ
  event_overthehorizon_02_e_72:
    speaker: sora
    en: You must have trauma...
    ko: 트라우마… 인가.
    ja: トラウマ反応…かしら。
  event_overthehorizon_02_e_73:
    speaker: "<Monologue>"
    en: The longer this goes on, the heavier my chest feels.
    ko: "…시간이 지날수록 속이 점점 더 답답해져 온다."
    ja: "…時間が経つにつれて、吐き気もひどくなった"
  event_overthehorizon_02_e_74:
    speaker: "<Self>"
    en: "*Gasp* *Gasp*"
    ko: 허억… 허억….
    ja: ハァ…ハァ…
  event_overthehorizon_02_e_75:
    speaker: sora
    en: Breathe, Captain.
    ko: 자아~ 캡틴.
    ja: さあ、キャプテン。
  event_overthehorizon_02_e_76:
    speaker: sora
    en: Follow me, okay?
    ko: 저를 따라 해보실래요?
    ja: 私の真似をしてみてください。
  event_overthehorizon_02_e_77:
    speaker: sora
    en: Hooo... haaaaa...
    ko: 후우~ 하아~
    ja: すぅ～…はぁ～…
  event_overthehorizon_02_e_78:
    speaker: "<Self>"
    en: H-hooo...
    ko: 후, 후우우….
    ja: ふ、ふぅぅ…
  event_overthehorizon_02_e_79:
    speaker: "<Self>"
    en: "*Gasp* I-I... can't do it..."
    ko: 헉… 자, 잘… 안 되는 것 같아….
    ja: はぁ…だ、だめだ…できない…
  event_overthehorizon_02_e_80:
    speaker: sora
    en: All right then, I don't have much choice.
    ko: "…어쩔 수 없네."
    ja: "…仕方ありません。"
  event_overthehorizon_02_e_81:
    speaker: "<Narration>"
    en: Sora pulls a blanket out from under the seat.
    ko: 소라가 의자 밑에서 담요를 꺼내 들었다.
    ja: ソラが座席の下から毛布を取り出した
  event_overthehorizon_02_e_82:
    speaker: sora
    en: Excuse me for a moment. ♥
    ko: 잠깐만 실례할게요♥
    ja: ちょっと失礼しますね♥
  event_overthehorizon_02_e_83:
    speaker: "<Narration>"
    en: "*Swoosh*"
    ko: 펄럭-
    ja: バサッ
  event_overthehorizon_02_e_84:
    speaker: "<Monologue>"
    en: My vision goes dark.
    ko: 눈앞이 어두워졌다.
    ja: 目の前が真っ暗になった
  event_overthehorizon_02_e_85:
    speaker: "<Monologue>"
    en: Then, on my lips...
    ko: 그리고 입술에….
    ja: そして唇に…
  event_overthehorizon_02_e_86:
    speaker: "<Narration>"
    en: "*Mwah*"
    ko: 츕-
    ja: チュッ
  event_overthehorizon_02_e_87:
    speaker: "<Monologue>"
    en: Another pair of lips press against mine.
    ko: 입술이 닿았다.
    ja: 唇が触れた
  event_overthehorizon_02_e_88:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_02_e_89:
    speaker: sora
    en: Hehe, don't freak out!
    ko: 후후, 너무 놀라지 마시고,
    ja: ふふ、そんなに驚かないでください。
  event_overthehorizon_02_e_90:
    speaker: sora
    en: Just think of it as treatment and focus on the air I'm passing to you, okay?
    ko: |-
      치료다~ 생각하고 숨을 넘겨드린 것에 집중해 주세요.
      알겠죠?
    ja: |-
      治療だと思って、今は息を吸うことに
      集中してください。いいですか？
  event_overthehorizon_02_e_91:
    speaker: "<Monologue>"
    en: Did I nod my head?
    ko: 고개를 끄덕였던가?
    ja: 私はうなずいた、のだろうか？
  event_overthehorizon_02_e_92:
    speaker: sora
    en: Okay, one more time...
    ko: 후후, 그럼 한 번 더….
    ja: ふふ、ではもう一度…
  event_overthehorizon_02_e_93:
    speaker: "<Narration>"
    en: "*Mwah*"
    ko: 츕-
    ja: チュッ
  event_overthehorizon_02_e_94:
    speaker: sora
    en: Breathe in now... a little more...
    ko: 하아… 조금 더… 들이쉬고….
    ja: はぁ…もう少し…息を吸って…
  event_overthehorizon_02_e_95:
    speaker: "<Narration>"
    en: "*Mwah*"
    ko: 츄웁-
    ja: チュゥ
  event_overthehorizon_02_e_96:
    speaker: "<Monologue>"
    en: I take in the air Sora passes me and slowly steady my breathing.
    ko: 소라가 넘겨주는 숨을 받으며, 천천히 호흡을 진정시켰다.
    ja: |-
      ソラに息を吹き込まれ、
      徐々に呼吸が落ち着きを取り戻した
  event_overthehorizon_02_e_97:
    speaker: "<Self>"
    en: Whew...
    ko: 후우….
    ja: すぅ…
  event_overthehorizon_02_e_98:
    speaker: sora
    en: There we go. You seem to have calmed down a little.
    ko: 음… 그래도 조금은 안정된 것 같네요~
    ja: うん…少しは落ち着いたみたいですね～
  event_overthehorizon_02_e_99:
    speaker: "<Narration>"
    en: "*Flap*"
    ko: 펄럭-
    ja: バサッ
  event_overthehorizon_02_e_100:
    speaker: "<Monologue>"
    en: The blanket lifts.
    ko: 담요가 걷혔다.
    ja: 毛布がはがされた
  event_overthehorizon_02_e_101:
    speaker: sora
    en: Now, why don't you be a big boy and try taking this?
    ko: 자~ 그럼 우리 착한 어른은 이걸 먹어볼까요?
    ja: |-
      さあ～。よい子のお兄さんは、
      これを飲みましょうね。
  event_overthehorizon_02_e_102:
    speaker: "<Monologue>"
    en: Sora holds out a pill.
    ko: 소라가 알약을 내밀었다.
    ja: ソラが錠剤を差し出した
  event_overthehorizon_02_e_103:
    speaker: "<Self>"
    en: What's this...?
    ko: 약…?
    ja: 薬…？
  event_overthehorizon_02_e_104:
    speaker: sora
    en: A pill that's easy to swallow. ♡
    ko: 물 없이 먹을 수 있는 알약이에요♡
    ja: はい、水なしで飲める錠剤です♡
  event_overthehorizon_02_e_105:
    speaker: sora
    en: You'll feel a little better after taking it. ☆
    ko: 먹으면 좀 편해질 거예요☆
    ja: 飲めば少し楽になりますよ☆
  event_overthehorizon_02_e_106:
    speaker: sora
    en: I get that medicine can be a little off-putting,
    ko: 약이라서 거부감이 든다는 건 알지만,
    ja: こんな時に薬なんて、怖いかもしれません。
  event_overthehorizon_02_e_107:
    speaker: sora
    en: but trust me.
    ko: 믿어주세요.
    ja: でも信じてください。
  event_overthehorizon_02_e_108:
    speaker: sora
    en: I would never hurt you, Captain.
    ko: 전 절대 캡틴에게 해를 끼치지 않을 거예요.
    ja: |-
      私は絶対、キャプテンに
      危害を加えるようなことはしませんから。
  event_overthehorizon_02_e_109:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…그래."
    ja: "…分かった"
  event_overthehorizon_02_e_110:
    speaker: "<Monologue>"
    en: I take the pill from Sora.
    ko: 소라에게 약을 받았다.
    ja: ソラから薬を受け取った
  event_overthehorizon_02_e_111:
    speaker: "<Narration>"
    en: "*Swallow*"
    ko: 꿀꺽-
    ja: ゴクリ――
  event_overthehorizon_02_e_112:
    speaker: sora
    en: There we go. What a good patient you are! ♥
    ko: 아이~ 잘 먹는다~♥
    ja: わあ～良くできましたね、えらいえらい♥
  event_overthehorizon_02_e_113:
    speaker: "<Self>"
    en: Th-thanks.
    ko: 고마… 워.
    ja: ありが…とう
  event_overthehorizon_02_e_114:
    speaker: sora
    en: You're welcome! ★
    ko: 별말씀을요★
    ja: どういたしまして★
  event_overthehorizon_02_e_115:
    speaker: "<Monologue>"
    en: As the medicine takes effect, I feel all the noise around me fade into the
      distance.
    ko: 약 효과가 도는지 주변의 시끄러운 소리가 멀어지는 느낌이 들었다.
    ja: |-
      薬が効きはじめたのか、
      周囲の喧騒が遠のいていくように感じた
  event_overthehorizon_02_e_116:
    speaker: sora
    en: Now then, what should we talk about while we wait for the medicine to kick
      in? ☆
    ko: 흠~ 효과가 돌 때까지 무슨 얘기를 해보는 게 좋을까~☆
    ja: |-
      さ～て、完全に効くまで、
      どんなお話をしましょうか～☆
  event_overthehorizon_02_e_117:
    speaker: sora
    en: "... ★"
    ko: "…★"
    ja: "…★"
  event_overthehorizon_02_e_118:
    speaker: sora
    en: How about we take this time to get to know each other a little better?
    ko: 서로에 대해 조금 더 알아가는 시간을 가져볼까요?
    ja: |-
      お互いを知るための
      質問コーナーなんてどうでしょう？
  event_overthehorizon_02_e_119:
    speaker: "<Self>"
    en: Sure.
    ko: "…그래."
    ja: "…そうだな"
  event_overthehorizon_02_e_120:
    speaker: sora
    en: What's your favorite food?
    ko: 캡틴은 좋아하는 음식이 뭐예요?
    ja: キャプテンが好きな食べ物は何ですか？
  event_overthehorizon_02_e_121:
    speaker: "<Choice>"
    en: I'm not a particularly picky eater.
    ko: 딱히 가리는 것 없어.
    ja: 好き嫌いはしない
  event_overthehorizon_02_e_122:
    speaker: "<Choice>"
    en: I don't really have a favorite.
    ko: 좋아하는 건 없어.
    ja: 特に好物はない
  event_overthehorizon_02_e_123:
    speaker: "<Choice>"
    en: I like pretty much everything.
    ko: 먹는 건 다 좋아.
    ja: 食べ物なら何でも好きだ
  event_overthehorizon_02_e_124:
    speaker: sora
    en: Oh yeah? Same with me.
    ko: 어? 그건 저도 그래요.
    ja: え？私もそうなんですよ～
  event_overthehorizon_02_e_125:
    speaker: sora
    en: Food is a precious commodity, so why be picky? That'd just be such a waste!
      ♥
    ko: "후후, 음식은 다 귀한 건데. \n뭘 가려먹어요~ 아깝게♥"
    ja: |-
      ふふ、食べ物はみんな貴重なのに
      好き嫌いがあるなんて、
      もったいないですもんね♥
  event_overthehorizon_02_e_126:
    speaker: "<Monologue>"
    en: My vision starts to blur more and more.
    ko: 점점 눈앞이 뿌옇게 흐려진다.
    ja: だんだんと視界がかすんできた
  event_overthehorizon_02_e_127:
    speaker: "<Self>"
    en: Ri... ght...
    ko: 그렇… 지….
    ja: そうだ…な…
  event_overthehorizon_02_e_128:
    speaker: "<Self>"
    en: I... I feel a little sleepy.
    ko: 음… 나 좀 졸린 것 같아.
    ja: 強烈な…眠気が…
  event_overthehorizon_02_e_129:
    speaker: sora
    en: That means the medicine's working. ♡
    ko: 그런 약이니까요♡
    ja: そういうお薬ですから♡
  event_overthehorizon_02_e_130:
    speaker: sora
    en: When your body and mind are exhausted,
    ko: 몸과 마음이 힘들 땐,
    ja: 心も体も苦しいときは、
  event_overthehorizon_02_e_131:
    speaker: sora
    en: there's nothing better than sleep.
    ko: 잠자는 것만큼 좋은 건 없잖아요?
    ja: 眠っちゃうのが一番でしょう？
  event_overthehorizon_02_e_132:
    speaker: "<Self>"
    en: Y-yeah...?
    ko: 그런가….
    ja: そうか…
  event_overthehorizon_02_e_133:
    speaker: "<Narration>"
    en: I can barely keep my eyelids open.
    ko: 점점 눈이 감겨온다.
    ja: 次第にまぶたが下がる
  event_overthehorizon_02_e_134:
    speaker: sora
    en: Looks like the medicine's working just fine! ★
    ko: 다행히 약효가 잘 도나 보네요★
    ja: |-
      よかった、お薬がちゃんと
      効いてるみたいですね★
  event_overthehorizon_02_e_135:
    speaker: sora
    en: All righty then...
    ko: 그럼~
    ja: では…
  event_overthehorizon_02_e_136:
    speaker: "<Narration>"
    en: "*Flap*"
    ko: 펄럭-
    ja: バサッ
  event_overthehorizon_02_e_137:
    speaker: "<Monologue>"
    en: Sora covers me with a blanket.
    ko: 소라가 내 몸 위에 담요를 덮어주었다.
    ja: ソラに毛布をかけられた
  event_overthehorizon_02_e_138:
    speaker: sora
    en: Sleep well. ♡
    ko: 안녕히 주무세요~♡
    ja: おやすみなさい～♡
  event_overthehorizon_02_e_139:
    speaker: "<Monologue>"
    en: I let the drug take over and close my eyes.
    ko: 약기운에 몸을 맡기고 눈을 감았다.
    ja: 薬の作用に身を委ね、私は目を閉じた
event_overthehorizon_03_s:
  event_overthehorizon_03_s_1:
    speaker: sky
    en: I-I'm sorry...
    ko: 죄, 죄송합니다.
    ja: も、申し訳ありません。
  event_overthehorizon_03_s_2:
    speaker: sky
    en: I went a little crazier than usual up there,
    ko: 제, 제가… 평소보다 더 험하게 운행해서,
    ja: わ、私の操縦が…いつもより荒かったせいで…
  event_overthehorizon_03_s_3:
    speaker: sky
    en: and ended up sending you to the infirmary...
    ko: 의무실까지 오게 만들다니….
    ja: 医務室送りにしてしまうなんて…
  event_overthehorizon_03_s_4:
    speaker: "<Self>"
    en: It's okay. That's what the training was for, right?
    ko: 괜찮아. 그러기 위한 훈련이었잖아.
    ja: 気にするな。本番でそうならないための訓練だ
  event_overthehorizon_03_s_5:
    speaker: sky
    en: I suppose, but still...
    ko: 그래도….
    ja: でも…
  event_overthehorizon_03_s_6:
    speaker: "<Self>"
    en: Don't worry.
    ko: 걱정하지 마.
    ja: 心配いらない
  event_overthehorizon_03_s_7:
    speaker: sky
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_03_s_8:
    speaker: "<Self>"
    en: And thanks for the music.
    ko: 그리고 음악 잘 들었어.
    ja: 音楽も悪くなかった
  event_overthehorizon_03_s_9:
    speaker: sky
    en: Huh?
    ko: 네?
    ja: はい？
  event_overthehorizon_03_s_10:
    speaker: "<Self>"
    en: It helped me stay relaxed and enjoy the training.
    ko: 덕분에 긴장하지 않고 재미있게 훈련했던 것 같아.
    ja: おかげで緊張せず、楽しく訓練できた
  event_overthehorizon_03_s_11:
    speaker: sky
    en: Really?
    ko: 네? 아….
    ja: はい？あ…
  event_overthehorizon_03_s_12:
    speaker: sky
    en: "... You're welcome."
    ko: 감사… 합니다.
    ja: ありがとう…ございます。
  event_overthehorizon_03_s_13:
    speaker: sora
    en: Wow...
    ko: 와~
    ja: わぁ～
  event_overthehorizon_03_s_14:
    speaker: sora
    en: You captured Sky's heart so easily! ♥
    ko: 이렇게나 쉽게 스카이를 함락시켜 버리시네요~♥
    ja: |-
      そんな簡単にスカイと
      仲良くなっちゃうなんて～♥
  event_overthehorizon_03_s_15:
    speaker: sky
    en: That's enough, Sora.
    ko: "…소라."
    ja: "…ソラ。"
  event_overthehorizon_03_s_16:
    speaker: sora
    en: Hahaha, okay! ♡
    ko: 아하하. 알겠어요~♡
    ja: あはは。冗談ですよ～♡
  event_overthehorizon_03_s_17:
    speaker: sora
    en: I won't tease you anymore.
    ko: 더는 안 놀릴게요.
    ja: これぐらいにしておきます。
  event_overthehorizon_03_s_18:
    speaker: sora
    en: But Sky, you still gotta file that follow-up report, y'know. ☆
    ko: 스카이도 얼른 후속 보고 하러 가야죠~☆
    ja: ほら、スカイも早く報告しに行かないと～☆
  event_overthehorizon_03_s_19:
    speaker: sky
    en: All right.
    ko: 그럴게요.
    ja: ええ。
  event_overthehorizon_03_s_20:
    speaker: sky
    en: You did good out there...
    ko: 정말, 고생 많으셨습니다.
    ja: あの、本当にお疲れ様でした。
  event_overthehorizon_03_s_21:
    speaker: sky
    en: C-Captain.
    ko: 캐… 캡틴.
    ja: キャ…キャプテン。
  event_overthehorizon_03_s_22:
    speaker: "<Monologue>"
    en: Sky rushes out of the infirmary.
    ko: 스카이가 다급하게 의무실 밖으로 떠나갔다.
    ja: スカイが慌てて医務室から飛び出していった
  event_overthehorizon_03_s_23:
    speaker: sora
    en: Well, would you look at that! She actually called you Captain! ☆
    ko: 스카이가 캡틴이라고 불러주다니~☆
    ja: スカイが「キャプテン」って呼ぶなんて～☆
  event_overthehorizon_03_s_24:
    speaker: sora
    en: She must really like you.
    ko: 캡틴이 정말 마음에 들었나 봐요
    ja: |-
      キャプテンのことが
      本当に気に入ったみたいですね。
  event_overthehorizon_03_s_25:
    speaker: "<Self>"
    en: Glad to hear that.
    ko: 그랬다면 다행이네.
    ja: それはよかった
  event_overthehorizon_03_s_26:
    speaker: sora
    en: Hmmm... Any more rivals and I'd be in real trouble.
    ko: 흠~♥ 이 이상으로 경쟁자가 늘어나는 건 좀 곤란한데.
    ja: |-
      うーん♥これ以上ライバルが増えても
      困るんですけどね。
  event_overthehorizon_03_s_27:
    speaker: sora
    en: But I guess it's fine since we'll just have one more thing in common, right?
    ko: 뭐, 스카이랑 같이 좋아하는 게 하나 더 늘어날 뿐이니까 괜찮나?
    ja: |-
      まあ、スカイと共通の話題が増えるだけなら
      よしとしましょうか。
  event_overthehorizon_03_s_28:
    speaker: "<Self>"
    en: Thanks for earlier.
    ko: 아까는 고마웠어.
    ja: さっきは助かった
  event_overthehorizon_03_s_29:
    speaker: sora
    en: Er... ☆
    ko: 아까…☆
    ja: さっき…☆
  event_overthehorizon_03_s_30:
    speaker: sora
    en: What about it?
    ko: 뭐가요?
    ja: 何のことですか？
  event_overthehorizon_03_s_31:
    speaker: "<Self>"
    en: You gave me a sleeping pill, remember?
    ko: 수면제를 챙겨줬잖아.
    ja: 睡眠薬のことだ
  event_overthehorizon_03_s_32:
    speaker: sora
    en: Oh, that? I was just doing my job.
    ko: 그거야~ 승무원으로서 당연한 일인 걸요?
    ja: |-
      いえいえ～乗務員として
      当たり前のことをしたまでです。
  event_overthehorizon_03_s_33:
    speaker: "<Self>"
    en: Thank you all the same.
    ko: 그래도.
    ja: そうだとしても
  event_overthehorizon_03_s_34:
    speaker: "<Self>"
    en: I appreciate you taking care of me.
    ko: 챙겨줘서 고마워.
    ja: 世話をかけた、ありがとう
  event_overthehorizon_03_s_35:
    speaker: sora
    en: "... ☆"
    ko: "…☆"
    ja: "…☆"
  event_overthehorizon_03_s_36:
    speaker: sora
    en: You're gonna make me go soft at this rate...
    ko: 이러면 조금 마음 약해지는데….
    ja: そんなこと言われたら、余計に…
  event_overthehorizon_03_s_37:
    speaker: "<Self>"
    en: Huh? What did you say?
    ko: 응? 뭐라고?
    ja: ん？何か言ったか？
  event_overthehorizon_03_s_38:
    speaker: sora
    en: Haha, nothing.
    ko: 후후, 아무것도 아니에요~
    ja: ふふ、何でもありませんよ～
  event_overthehorizon_03_s_39:
    speaker: sora
    en: Let's see... ♡
    ko: 그래도…♡
    ja: でも…♡
  event_overthehorizon_03_s_40:
    speaker: "<Monologue>"
    en: Sora reaches out and touches my forehead.
    ko: 소라가 이마를 향해 손을 뻗어왔다.
    ja: ソラが額に手を伸ばしてきた
  event_overthehorizon_03_s_41:
    speaker: sora
    en: Your fever's gone, and you're looking a lot better now. ♡
    ko: 이제 열도 안 나는 것 같고, 혈색도 많이 돌아왔네요♡
    ja: |-
      熱も下がったようですし、
      顔色もだいぶよくなりましたね♡
  event_overthehorizon_03_s_42:
    speaker: sora
    en: Do you feel ready to get up,
    ko: 지금 바로 일어나실래요?
    ja: そろそろ大丈夫そうですか？
  event_overthehorizon_03_s_43:
    speaker: sora
    en: or do you wanna rest a bit longer?
    ko: 아님 조금 더 쉬었다 가실래요?
    ja: それとも、もう少し休まれますか？
  event_overthehorizon_03_s_44:
    speaker: "<Self>"
    en: I'll rest a little more.
    ko: 조금만 더 있다가 갈게.
    ja: もう少し休ませてもらおう
  event_overthehorizon_03_s_45:
    speaker: sora
    en: Okay. ♥
    ko: 좋아요♥
    ja: 分かりました♥
  event_overthehorizon_03_s_46:
    speaker: sora
    en: You should rest when you can. ★
    ko: 쉴 수 있을 때, 잔뜩 쉬었다 가야죠★
    ja: 休める時に、ゆっくり休んでいってくださいね★
  event_overthehorizon_03_s_47:
    speaker: sora
    en: Well, I'll get going and leave you be. ♥
    ko: 그럼 전 이만 센스 있게 먼저 퇴장해 볼게요~♥
    ja: では私はこれで～♥
  event_overthehorizon_03_s_48:
    speaker: "<Monologue>"
    en: Sora leaves the infirmary.
    ko: 소라가 의무실 밖으로 떠나갔다.
    ja: ソラが医務室を出ていった
  event_overthehorizon_03_s_49:
    speaker: "<Self>"
    en: "*Sigh*..."
    ko: 하아….
    ja: はぁ…
  event_overthehorizon_03_s_50:
    speaker: "<Self>"
    en: I'll just rest a little more...
    ko: 조금만 더 쉬었다가 갈….
    ja: もう少し休んだら行くか…
  event_overthehorizon_03_s_51:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブブ…
  event_overthehorizon_03_s_52:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_03_s_53:
    speaker: "<Monologue>"
    en: I look at my phone.
    ko: 핸드폰을 바라보았다.
    ja: 携帯電話を手に取った
  event_overthehorizon_03_s_54:
    speaker: "<Self>"
    en: Sora?
    ko: "…소라?"
    ja: "…ソラ？"
event_overthehorizon_03_e:
  event_overthehorizon_03_e_1:
    speaker: "<Monologue>"
    en: I receive a message from Sora.
    ko: 소라에게 메시지가 와있다.
    ja: ソラからメッセージが来ている
  event_overthehorizon_03_e_2:
    speaker: "<Self>"
    en: Bringing stuff in?
    ko: 이게 대체 무슨 얘기지…?
    ja: これは一体どういうことだ…？
  event_overthehorizon_03_e_3:
    speaker: "<Self>"
    en: What does that mean?
    ko: 몰래 가져온다니….
    ja: こっそり持ち出す…？
  event_overthehorizon_03_e_4:
    speaker: cielo
    en: But the thing is, the gatherers actually confirmed that all the stuff they
      found was there and accounted for.
    ko: 문제는 자원 채집 부대원이 찾은 물건들은 모두 제대로 있다는 걸 알게 되었다는 거죠.
    ja: |-
      問題は、資源採集部隊からの物資は、
      ちゃんと全部あるということなんです。
  event_overthehorizon_03_e_5:
    speaker: neon
    en: Huh? But why would that be a problem?
    ko: 음? 그런데 그게 왜 문제가 되는 거죠?
    ja: え？どうしてそれが問題になるんですか？
  event_overthehorizon_03_e_6:
    speaker: neon
    en: Isn't it a good thing that nothing was stolen?
    ko: 도둑맞은 물건이 없으니 좋은 거 아닌가요?
    ja: 何も盗まれてないなら、問題ないのでは？
  event_overthehorizon_03_e_7:
    speaker: rapi
    en: Put simply, the problem is that unknown items have made it into the Ark and
      are now unaccounted for.
    ko: 반대로 말하면, 내용물을 알 수 없는 물건이 방주에 들어오면서 사라졌다는 거니까 문제가 되겠지.
    ja: |-
      中身の分からない荷物が
      アークで姿を消しているということね。
  event_overthehorizon_03_e_8:
    speaker: "<Self>"
    en: Smuggling, you mean?
    ko: 밀수했다는 거야?
    ja: 何かが密輸されている？
  event_overthehorizon_03_e_9:
    speaker: cielo
    en: Exactly!
    ko: 맞아요!
    ja: そうなんです！
  event_overthehorizon_03_e_10:
    speaker: cielo
    en: That's how the suspicion that there might be smugglers started to grow.
    ko: 그래서 혹시나 밀수범이 있는 것이 아닌가~ 하는 의심이 싹트기 시작한 거죠.
    ja: |-
      当然、誰かがこっそり何かを
      運び込んでるんじゃないか〜って
      疑いが出始めたんですよ。
  event_overthehorizon_03_e_11:
    speaker: cielo
    en: Because of that, inspections were tightened up,
    ko: 그래서 검문도 강화되고~
    ja: 検査も強化されましたし。
  event_overthehorizon_03_e_12:
    speaker: cielo
    en: and all the supplies we brought in this time got stuck piled up in G12. It
      really upsets me!
    ko: 이번에 들여온 물자가 이동을 못하고 g12에 쌓아두게 되어서, 마음이 정말 심란했는데!
    ja: |-
      最近運び込んだ物資も
      g12で止められてしまって…
      もう私、もどかしくて仕方が無くて！
  event_overthehorizon_03_e_13:
    speaker: "<Self>"
    en: That must mean...
    ko: 그렇다는 말은….
    ja: これはつまり…
  event_overthehorizon_03_e_14:
    speaker: "<Monologue>"
    en: I read the messages again.
    ko: 다시 메시지를 들여다보았다.
    ja: もう一度メッセージを確認した
  event_overthehorizon_03_e_15:
    speaker: "<Self>"
    en: Sora is... the smuggler?
    ko: 소라가… 밀수범이라고?
    ja: ソラが…犯人？
  event_overthehorizon_03_e_16:
    speaker: sora
    en: I get that medicine can be a little off-putting,
    ko: 약이라서 거부감이 들만하다는 건 알지만,
    ja: こんな時に薬なんて、怖いかもしれません。
  event_overthehorizon_03_e_17:
    speaker: sora
    en: but trust me.
    ko: 믿어주세요.
    ja: でも信じてください。
  event_overthehorizon_03_e_18:
    speaker: sora
    en: I would never hurt you, Captain.
    ko: 전 절대 캡틴에게 해를 끼치지 않을 거예요.
    ja: |-
      私は絶対、キャプテンに
      危害を加えるようなことはしませんから。
  event_overthehorizon_03_e_19:
    speaker: "<Self>"
    en: "... I can't jump to conclusions yet."
    ko: "…아직 단정 지을 수는 없어."
    ja: "…まだ断定はできない"
  event_overthehorizon_03_e_20:
    speaker: "<Monologue>"
    en: I get up
    ko: 자리에서 일어났다.
    ja: ベッドから起き上がり…
  event_overthehorizon_03_e_21:
    speaker: "<Monologue>"
    en: and read at the messages again.
    ko: 그리고 다시 문자를 들여다보았다.
    ja: もう一度メッセージを確認した
  event_overthehorizon_03_e_22:
    speaker: "<Narration>"
    en: 6 o'clock. G15.
    ko: "[6시], [g15]."
    ja: "「6時」と「g15」"
  event_overthehorizon_03_e_23:
    speaker: "<Self>"
    en: Wherever this G15 is...
    ko: 6시에… g15라는 곳에서 보기로 한 건가….
    ja: |-
      6時に…g15という場所で
      会うということだな…
  event_overthehorizon_03_e_24:
    speaker: "<Self>"
    en: I need to go and check it out.
    ko: 찾아가 보자.
    ja: 行ってみよう
  event_overthehorizon_03_e_25:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ウィーン――
  event_overthehorizon_03_e_26:
    speaker: "<Monologue>"
    en: I step out of the infirmary.
    ko: 의무실 밖으로 나섰다.
    ja: 医務室の外に出た
event_overthehorizon_intermission_01:
  event_overthehorizon_intermission_01_1:
    speaker: "<Monologue>"
    en: I stand absentmindedly in front of the map posted in the corridor.
    ko: 멍하니 의무실 앞, 복도에 설치된 지도를 바라보았다.
    ja: |-
      ぼんやりと医務室の前の廊下に貼られた
      地図を見た
  event_overthehorizon_intermission_01_2:
    speaker: "<Self>"
    en: The only thing is...
    ko: "…그런데."
    ja: "…それはそうと"
  event_overthehorizon_intermission_01_3:
    speaker: "<Self>"
    en: Where is G15?
    ko: g15가 어디지…?
    ja: g15はどこだ…？
  event_overthehorizon_intermission_01_4:
    speaker: "<Monologue>"
    en: No matter how hard I look,
    ko: 하지만 아무리 찾아도,
    ja: いくら目を凝らしても…
  event_overthehorizon_intermission_01_5:
    speaker: "<Monologue>"
    en: there doesn't seem to be any place labeled G15.
    ko: "[g15]라고 적힌 장소는 보이지 않았다."
    ja: "「g15」と書かれた場所は見当たらない"
  event_overthehorizon_intermission_01_6:
    speaker: "<Self>"
    en: There's no G12 that Cielo mentioned either.
    ko: "…시엘로가 말하던 g12도 없네."
    ja: "…シエロが言っていたg12もないな"
  event_overthehorizon_intermission_01_7:
    speaker: "<Self>"
    en: Is it some kind of abbreviation?
    ko: 뭔가의 줄임말 같은 건가.
    ja: 略語なのか？
  event_overthehorizon_intermission_01_8:
    speaker: "<Monologue>"
    en: I look closely at the map again.
    ko: 다시 지도를 자세히 들여다보았다.
    ja: もう一度、地図をじっくりと調べた
  event_overthehorizon_intermission_01_9:
    speaker: "<Monologue>"
    en: Maintenance rooms numbered 1 through 10 are lined up along the right side
      of the building,
    ko: 1번부터 10번까지의 정비실이 건물 우측에 쭉 배치되어 있었고,
    ja: |-
      1番から10番までのメンテナンスハンガーが
      右手側に並んでいる
  event_overthehorizon_intermission_01_10:
    speaker: "<Monologue>"
    en: with storage rooms 1 through 6 placed in between them.
    ko: 그 사이사이에 1번부터 6번까지의 창고가 배치되어 있었다.
    ja: その間に1番から6番までの倉庫がある
  event_overthehorizon_intermission_01_11:
    speaker: "<Monologue>"
    en: The Simulation Room we trained in, the lecture hall we took classes in,
    ko: 우리가 훈련했던 시뮬레이션 룸과 교육을 받았던 강의실,
    ja: |-
      訓練で使用したシミュレーションルームと、
      授業を受けた講義室、
  event_overthehorizon_intermission_01_12:
    speaker: "<Monologue>"
    en: and the infirmary I'm in now are all on the left side under what's labeled
      as the residential area.
    ko: 그리고 지금 있는 의무실이 건물 좌측에 생활관이라는 이름으로, 배치되어 있었다.
    ja: |-
      それからさっきいた医務室が左手側の
      「生活棟」という建物にある
  event_overthehorizon_intermission_01_13:
    speaker: "<Self>"
    en: I don't see anything related to 12 or 15, either.
    ko: "…12나 15와 관련된 것도 안 보이는데."
    ja: |-
      …12や15という数字のついたものは、
      見当たらない
  event_overthehorizon_intermission_01_14:
    speaker: "<Monologue>"
    en: I lift my phone and check the time.
    ko: 핸드폰을 들어, 시간을 확인했다.
    ja: 携帯端末で時間を確認した
  event_overthehorizon_intermission_01_15:
    speaker: "<Narration>"
    en: 5:20 PM.
    ko: "[오후 5 : 20]"
    ja: "「午後5:20」"
  event_overthehorizon_intermission_01_16:
    speaker: "<Self>"
    en: There's not enough time to search this entire place.
    ko: 전부 돌아다녀 보기엔 시간이 너무 없고.
    ja: 全部見て回るには、時間がなさすぎる
  event_overthehorizon_intermission_01_17:
    speaker: "<Self>"
    en: I need to figure something out...
    ko: 어떻게든 알아내야 하는데….
    ja: どうにか範囲を絞らないと…
  event_overthehorizon_intermission_01_18:
    speaker: "<Monologue>"
    en: I stare at my phone.
    ko: 핸드폰을 들여다보았다.
    ja: 端末の画面を眺めた
  event_overthehorizon_intermission_01_19:
    speaker: "<Self>"
    en: Maybe I should ask someone...
    ko: 다른 사람한테라도 연락해서 물어봐야 하나.…
    ja: 誰かに連絡して、聞いてみるべきだろうか…
  event_overthehorizon_intermission_01_20:
    speaker: "<Self>"
    en: but that would mean telling them everything about Sora.
    ko: 하지만 그랬다간… 소라의 일을 전부 말해야 하겠지.
    ja: |-
      だがそうなると…
      ソラのことを全部話さなければいけなくなる…
  event_overthehorizon_intermission_01_21:
    speaker: "<Monologue>"
    en: I put my phone away.
    ko: 핸드폰을 집어넣었다.
    ja: 私は携帯端末をしまいこんだ
  event_overthehorizon_intermission_01_22:
    speaker: "<Self>"
    en: No, I can't do that yet. I need to keep looking...
    ko: |-
      …아직은 안 돼.
      조금 더 찾아보….
    ja: |-
      …今はまだダメだ。
      もう少し探して…
  event_overthehorizon_intermission_01_23:
    speaker: sora
    en: Hey! It's been a long time! ★
    ko: |-
      아하하★
      오랜만이에요~!
    ja: |-
      あはは★
      お久しぶりで～す！
  event_overthehorizon_intermission_01_24:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_overthehorizon_intermission_01_25:
    speaker: "<Monologue>"
    en: Voices echo from down the opposite end of the corridor.
    ko: 반대편 복도 쪽에서 시끌시끌한 목소리들이 들려온다.
    ja: 背中越しの廊下からにぎやかな声が聞こえた
  event_overthehorizon_intermission_01_26:
    speaker: womanstaff
    en: I heard you were on a mission. I didn't expect you to be back so soon.
    ko: 임무 나갔다고 들었던 것 같은데, 금방 돌아오셨나 보네요!
    ja: |-
      任務中と聞いていましたが、
      もう戻られたんですね！
  event_overthehorizon_intermission_01_27:
    speaker: sora
    en: Yeah, turns out it was a fairly short assignment. ★
    ko: |-
      그렇죠~★
      오래 걸리는 임무는 아니었으니까요~
    ja: |-
      そうなんです～★
      すぐ終わるものだったので～
  event_overthehorizon_intermission_01_28:
    speaker: sora
    en: Plus, this time around...
    ko: 게다가 이번 임무에서….
    ja: それに今回は…
  event_overthehorizon_intermission_01_29:
    speaker: "<Narration>"
    en: "*Click clack*"
    ko: 또각- 또각-
    ja: コツ、コツ――
  event_overthehorizon_intermission_01_30:
    speaker: "<Monologue>"
    en: They're heading this way.
    ko: 이쪽으로 다가오고 있다…!
    ja: こちらに近づいてくる…！
  event_overthehorizon_intermission_01_31:
    speaker: "<Self>"
    en: "!!"
    ko: 이런…!
    ja: まずい…！
  event_overthehorizon_intermission_01_32:
    speaker: "<Monologue>"
    en: I quickly duck back into the infirmary.
    ko: "…몸을 숨기기 위해 황급히 다시 의무실 안으로 몸을 숨겼다."
    ja: "…とっさに医務室の中へ戻り、身を隠した"
  event_overthehorizon_intermission_01_33:
    speaker: "<Monologue>"
    en: The voices grow closer and closer.
    ko: 사람들의 목소리가 점점 가까워지고 있다.
    ja: 話し声が次第に近づいてくる
  event_overthehorizon_intermission_01_34:
    speaker: "<Monologue>"
    en: I open the door slightly and concentrate on the voices outside.
    ko: 문을 살짝 열고, 바깥의 소리에 집중했다.
    ja: ドアを少し開け、外の音に耳をすませた
  event_overthehorizon_intermission_01_35:
    speaker: sora
    en: "... So all the stuff I brought back this time is stuck in G12."
    ko: "…그래서 이번에 가져온 물건들은 전부 g12에 묶여 있어요~"
    ja: |-
      …そういうわけで今回持ってきたものは全部
      g12で足止めを食らってまして～
  event_overthehorizon_intermission_01_36:
    speaker: womanstaff
    en: G12? Where's that?
    ko: |-
      g12요?
      그게 어딘데요?
    ja: |-
      g12？
      どこのことですか？
  event_overthehorizon_intermission_01_37:
    speaker: sora
    en: Oh, right! You said you're fairly new here, right? ★
    ko: |-
      맞다~★
      여기 오신 지 얼마 안 되셨었죠~
    ja: |-
      あ、そうか～★
      ここに来たばかりでしたよね～
  event_overthehorizon_intermission_01_38:
    speaker: sora
    en: G12 is Storage Room 2.
    ko: |-
      g12는 그거예요.
      2번 창고.
    ja: g12っていうのは、2番倉庫のことなんです。
  event_overthehorizon_intermission_01_39:
    speaker: sora
    en: It used to be Maintenance Room 12.
    ko: 예전에 2번 창고 자리가 12번 정비소였거든요.
    ja: |-
      昔は、2番倉庫の場所に
      12番整備所があったらしくて。
  event_overthehorizon_intermission_01_40:
    speaker: sora
    en: So, people who have been working here for a while still call it G12.
    ko: 그래서 이곳에서 일한 지 오래된 사람들은 아직도 거길 g12라고 부르고 있어요~
    ja: |-
      だから、ここで長く働いている人たちは、
      今でもそこをg12って呼んでるんですよ～
  event_overthehorizon_intermission_01_41:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_intermission_01_42:
    speaker: womanstaff
    en: Oh, I didn't know that.
    ko: |-
      아… 그랬군요.
      저게 그건 잘 몰랐….
    ja: |-
      あ…そうなんですね。
      初めて知りまし…
  event_overthehorizon_intermission_01_43:
    speaker: "<Monologue>"
    en: The voices fade away.
    ko: 소리가 점점 멀어진다.
    ja: ソラの声が徐々に遠ざかる
  event_overthehorizon_intermission_01_44:
    speaker: "<Monologue>"
    en: Once I'm certain that they're gone, I step back out.
    ko: 모두가 떠난 걸 확인한 뒤, 다시 밖으로 나왔다.
    ja: 誰もいなくなったのを確認し、もう一度外に出た
  event_overthehorizon_intermission_01_45:
    speaker: "<Self>"
    en: If G12 is Storage Room 2, then G15...
    ko: g12가 2번 창고라면… 아마 g15는….
    ja: g12が2番倉庫なら…g15は…
  event_overthehorizon_intermission_01_46:
    speaker: "<Monologue>"
    en: My eyes stop on a spot on the map.
    ko: 지도의 한 곳에 시선을 멈췄다.
    ja: 私は地図上にあたりを付けた
  event_overthehorizon_intermission_01_47:
    speaker: "<Self>"
    en: Must be here.
    ko: 여기겠네.
    ja: ここか
  event_overthehorizon_intermission_01_48:
    speaker: "<Self>"
    en: Could that be...
    ko: "…여기가."
    ja: "…ここだな"
  event_overthehorizon_intermission_01_49:
    speaker: "<Monologue>"
    en: I see a door labeled Storage Room 5.
    ko: 5번 창고의 문이 보였다.
    ja: 5番倉庫のドアが見える
  event_overthehorizon_intermission_01_50:
    speaker: "<Self>"
    en: Where G15 is?
    ko: g15 인가…?
    ja: 本当にここがg15なのか…？
  event_overthehorizon_intermission_01_51:
    speaker: "<Monologue>"
    en: I lift my phone and check the time.
    ko: 핸드폰을 들어, 시간을 확인했다.
    ja: 端末で時間を確認した
  event_overthehorizon_intermission_01_52:
    speaker: "<Narration>"
    en: 5:50 PM.
    ko: "[오후 5 : 50]"
    ja: "「午後5:50」"
  event_overthehorizon_intermission_01_53:
    speaker: "<Self>"
    en: There's no time to check anywhere else.
    ko: 다른 데 가기엔 너무 늦었어.
    ja: 他の場所に行っている時間はない
  event_overthehorizon_intermission_01_54:
    speaker: "<Self>"
    en: I'm going in.
    ko: "…들어가 보자."
    ja: "…中に入ってみよう"
  event_overthehorizon_intermission_01_55:
    speaker: "<Narration>"
    en: "*Screech*"
    ko: 끼익-
    ja: キィ…
  event_overthehorizon_intermission_01_56:
    speaker: "<Monologue>"
    en: I cautiously step inside the storage room.
    ko: 조심스레 창고 안으로 들어섰다.
    ja: 慎重に倉庫の中へ足を踏み入れた
  event_overthehorizon_intermission_01_57:
    speaker: "<Monologue>"
    en: Only darkness and silence fill the air.
    ko: 어둠과 정적만이 가득했다.
    ja: 暗闇と静寂だけが満ちている
  event_overthehorizon_intermission_01_58:
    speaker: "<Monologue>"
    en: I slowly look around the storage room,
    ko: 창고 안을 천천히 둘러보았다.
    ja: 倉庫の中をゆっくりと見回した
  event_overthehorizon_intermission_01_59:
    speaker: "<Monologue>"
    en: but Sora is nowhere to be seen.
    ko: "…소라의 모습은 보이지 않았다."
    ja: "…ソラの姿はない"
  event_overthehorizon_intermission_01_60:
    speaker: "<Self>"
    en: I guess she's not here yet.
    ko: "…아직 안 왔나 보네."
    ja: "…まだ来ていないようだな"
  event_overthehorizon_intermission_01_61:
    speaker: "<Self>"
    en: Where can I hide...
    ko: 숨어있을 만한 곳이….
    ja: 隠れられそうな場所は…
  event_overthehorizon_intermission_01_62:
    speaker: "<Monologue>"
    en: A pile of large boxes sits in the corner of the storage room.
    ko: 창고 구석에 큰 상자들이 모여 있다.
    ja: 倉庫の隅に、大きな箱が積み重なっている
  event_overthehorizon_intermission_01_63:
    speaker: "<Monologue>"
    en: Behind them, I see a gap big enough for someone to slip through.
    ko: "…뒤에 사람이 들어가 있을 만한 틈이 보인다."
    ja: "…その後ろに、十分な隙間が見えた"
  event_overthehorizon_intermission_01_64:
    speaker: "<Self>"
    en: Could that work?
    ko: 저기면 되려나?
    ja: あそこなら大丈夫だろう
  event_overthehorizon_intermission_01_65:
    speaker: "<Narration>"
    en: "*Screech*"
    ko: 끼익-
    ja: ギィ…
  event_overthehorizon_intermission_01_66:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_intermission_01_67:
    speaker: "<Monologue>"
    en: I quickly hide behind the boxes.
    ko: 서둘러 상자 뒤에 몸을 숨겼다.
    ja: 急いで箱の後ろに身を隠した
  event_overthehorizon_intermission_01_68:
    speaker: sora
    en: Hmm... where is he? ♥
    ko: 흐음~♥ 아직 안 왔나?
    ja: あれ～♥まだ来てないのかぁ～
  event_overthehorizon_intermission_01_69:
    speaker: "<Narration>"
    en: "*Click clack*"
    ko: 또각- 또각-
    ja: コツ、コツ
  event_overthehorizon_intermission_01_70:
    speaker: "<Monologue>"
    en: I sense Sora slowly looking around inside the storage room.
    ko: 소라가 창고 안을 천천히 둘러보는 듯한 기척이 느껴졌다.
    ja: |-
      ソラはどうやら、倉庫の中を
      ゆっくりと歩き回っているようだ
  event_overthehorizon_intermission_01_71:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_intermission_01_72:
    speaker: sora
    en: Hmm... ★
    ko: 흠~★
    ja: うーん★
  event_overthehorizon_intermission_01_73:
    speaker: sora
    en: I guess he's not here yet. ♥
    ko: 안 왔나 보네♥
    ja: まだ来てないみたいね♥
  event_overthehorizon_intermission_01_74:
    speaker: sora
    en: I should ask him where he is.
    ko: 어디까지 왔나~ 물어볼까?
    ja: 今どの辺なのか聞いてみようかな？
  event_overthehorizon_intermission_01_75:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブブ…
  event_overthehorizon_intermission_01_76:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_overthehorizon_intermission_01_77:
    speaker: "<Monologue>"
    en: Sora just sent me another message!
    ko: 소라가 또 메시지를 보내왔다!
    ja: ソラからまたメッセージが届いた
  event_overthehorizon_intermission_01_78:
    speaker: sora
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_intermission_01_79:
    speaker: sora
    en: What's that?
    ko: 뭐지?
    ja: あれ？
  event_overthehorizon_intermission_01_80:
    speaker: sora
    en: I heard something.
    ko: 무슨 소리가 났는데…?
    ja: なんか音がしなかった…？
  event_overthehorizon_intermission_01_81:
    speaker: "<Monologue>"
    en: I frantically hide further behind the boxes.
    ko: 황급히 상자들 뒤로 몸을 숨겼다.
    ja: あわてて箱の後ろに隠れた
  event_overthehorizon_intermission_01_82:
    speaker: sora
    en: Hmmm... ★
    ko: 흐응~★
    ja: あれ～★
  event_overthehorizon_intermission_01_83:
    speaker: sora
    en: Maybe it's nothing.
    ko: 아무것도 아닌가~?
    ja: 気のせいかな～？
  event_overthehorizon_intermission_01_84:
    speaker: "<Monologue>"
    en: I quickly check my phone before Sora sends another message.
    ko: 소라가 또 메시지를 보내기 전에, 얼른 열어보았다.
    ja: |-
      ソラがさらにメッセージを送ってくる前に、
      急いで確認した
  event_overthehorizon_intermission_01_85:
    speaker: sora
    en: Hm... I guess he's busy.
    ko: 흐음… 바쁜가 보네.
    ja: う～ん…忙しいみたいね。
  event_overthehorizon_intermission_01_86:
    speaker: sora
    en: Oh well. ☆
    ko: 어쩔 수 없지~☆
    ja: しょうがないか～☆
  event_overthehorizon_intermission_01_87:
    speaker: sora
    en: Guess I'll meet him another time.
    ko: 다음에 만나야겠다.
    ja: また今度にしよーっと。
  event_overthehorizon_intermission_01_88:
    speaker: "<Monologue>"
    en: Sora casually saunters off.
    ko: 소라가 유유히 떠나갔다.
    ja: ソラがゆっくりとその場から去っていった
  event_overthehorizon_intermission_01_89:
    speaker: "<Self>"
    en: Phew...
    ko: 후우….
    ja: ふぅ…
  event_overthehorizon_intermission_01_90:
    speaker: "<Monologue>"
    en: I slump to the ground
    ko: 바닥에 주저앉았다.
    ja: 私は地面に座り込んだ
  event_overthehorizon_intermission_01_91:
    speaker: "<Monologue>"
    en: and recall the message from earlier.
    ko: 그리고 조금 전에 본 메시지를 떠올렸다.
    ja: そして先ほどのメッセージを思い出した
  event_overthehorizon_intermission_01_92:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_intermission_01_93:
    speaker: "<Self>"
    en: We'll have to reschedule...
    ko: 다음 약속이라….
    ja: 日を改めて…か
event_overthehorizon_04_s:
  event_overthehorizon_04_s_1:
    speaker: "<Monologue>"
    en: I pick up my phone.
    ko: 핸드폰을 들어 올렸다.
    ja: 携帯電話を取り出した
  event_overthehorizon_04_s_2:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_s_3:
    speaker: "<Monologue>"
    en: It's been three days since I came back from flight training,
    ko: 비행 교육을 마치고 돌아온 지, 3일이 흘렀다.
    ja: 航空教育の修了から3日が過ぎた
  event_overthehorizon_04_s_4:
    speaker: "<Monologue>"
    en: and I haven't received a single message from Sora.
    ko: 하지만, 그 이후 소라에게서는 아무런 메시지가 오지 않고 있었다.
    ja: あの日以来、ソラから何の音沙汰もない
  event_overthehorizon_04_s_5:
    speaker: "<Self>"
    en: "*Sigh*"
    ko: 하아….
    ja: はぁ…
  event_overthehorizon_04_s_6:
    speaker: rapi
    en: Is something on your mind, Commander?
    ko: 지휘관, 무슨 고민이라도 있으십니까?
    ja: 指揮官、何か悩み事でも？
  event_overthehorizon_04_s_7:
    speaker: anis
    en: Oh right, ever since we finished flight training, all you do is stare at your
      phone.
    ko: "맞아. \n지난번에 비행 교육 다녀온 뒤로 계속 핸드폰만 보고,"
    ja: |-
      あるに決まってるわ。
      航空教育の後からずーっと携帯見てるし、
  event_overthehorizon_04_s_8:
    speaker: anis
    en: And you just sigh all the time.
    ko: 한숨만 푹푹 쉬네.
    ja: ため息ばっかりついてるもの。
  event_overthehorizon_04_s_9:
    speaker: anis
    en: Does it... have anything to do with your trip to the infirmary?
    ko: 혹시 그… 의무실 다녀왔던 일 때문에 그래?
    ja: "…もしかして、まだ調子悪いの？"
  event_overthehorizon_04_s_10:
    speaker: neon
    en: Come to think of it, I still don't feel 100% myself.
    ko: |-
      아, 맞아요.
      저는 좀 아직도 불편한 거 같아요.
    ja: |-
      あ、そうかもしれません。
      私もまだ胸のあたりが少しムカムカします。
  event_overthehorizon_04_s_11:
    speaker: neon
    en: The motion sickness on that flight was brutal...
    ko: 그때 비행기 멀미를 너무 해서….
    ja: |-
      どうもあの時、
      飛行機に酔ってしまったみたいで…
  event_overthehorizon_04_s_12:
    speaker: anis
    en: Oh please, wasn't it because you were headbanging like crazy from excitement?
    ko: 어휴, 넌 거기서 신난다고 진짜 헤드뱅잉을 해서 그런 거 아니야!
    ja: |-
      はぁ…あんたは調子に乗って
      ヘドバンしてたせいでしょ！
  event_overthehorizon_04_s_13:
    speaker: rapi
    en: Commander, are you still experiencing discomfort anywhere?
    ko: 지휘관, 혹시 아직 불편하신 곳이라도 있으신 겁니까?
    ja: 指揮官、まだ体調がすぐれないのですか？
  event_overthehorizon_04_s_14:
    speaker: "<Self>"
    en: No, I actually feel quite...
    ko: 아니야. 이제 몸은 정말 괜찮….
    ja: いや。体調はもう全然大丈…
  event_overthehorizon_04_s_15:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブブ…
  event_overthehorizon_04_s_16:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_04_s_17:
    speaker: "<Monologue>"
    en: I quickly look at my phone.
    ko: 황급히 핸드폰을 들여다보았다.
    ja: 急いで携帯を確認した
  event_overthehorizon_04_s_18:
    speaker: "<Self>"
    en: Sorry. I'm just gonna head out for a bit...!
    ko: 미안. 나 좀 나갔다 올…!
    ja: すまない。少し出かけて――
  event_overthehorizon_04_s_19:
    speaker: "<Monologue>"
    en: I freeze in place.
    ko: 자리에 멈춰 섰다.
    ja: 私はその場で立ち止まった
  event_overthehorizon_04_s_20:
    speaker: "<Self>"
    en: I can't go meet her looking like this.
    ko: "…이대로 가도 되나?"
    ja: "…このまま行っていいのか？"
  event_overthehorizon_04_s_21:
    speaker: rapi
    en: Commander?
    ko: 지휘관?
    ja: 指揮官？
  event_overthehorizon_04_s_22:
    speaker: anis
    en: What's wrong? Are you feeling sick?
    ko: |-
      지휘관님 갑자기 왜 그래.
      어디 아파?
    ja: |-
      指揮官様、急にどうしたの？
      どこか痛いの？
  event_overthehorizon_04_s_23:
    speaker: neon
    en: Maybe he changed his mind and doesn't want to go out?
    ko: 갑자기 나가기 싫어지신 거 아닐까요?
    ja: 出かけるのが嫌になったのでしょうか？
  event_overthehorizon_04_s_24:
    speaker: "<Self>"
    en: I don't mean to be an inconvenience, but...
    ko: 미안한데.
    ja: すまないが…
  event_overthehorizon_04_s_25:
    speaker: "<Self>"
    en: Could you all help me disguise myself?
    ko: 나 좀 변장시켜 줄 수 있을까?
    ja: 変装を手伝ってくれないか？
  event_overthehorizon_04_s_26:
    speaker: neon
    en: Huh?
    ko: 예?
    ja: はい？
  event_overthehorizon_04_s_27:
    speaker: anis
    en: Y-you want us to do what?
    ko: 뭐, 뭘 해달라고?
    ja: な、何を手伝えって？
  event_overthehorizon_04_s_28:
    speaker: rapi
    en: A disguise?
    ko: 변장… 말입니까?
    ja: 変装…ですか？
  event_overthehorizon_04_s_29:
    speaker: "<Self>"
    en: That's right. So that no one will recognize me.
    ko: 응. 절대 나라는 걸 모르도록.
    ja: ああ。誰にも気づかれないような――
  event_overthehorizon_04_s_30:
    speaker: manstaff
    en: Everybody! It's time for Cosmo Taste! ★
    ko: Everybody! Cosmo Taste~★
    ja: Everybody! Cosmo Taste~★
  event_overthehorizon_04_s_31:
    speaker: manstaff
    en: Welcome to Cosmo Burger! May I take your order? ★
    ko: "어서 오세요~ 코스모 버거입니다~★ \n무엇을 주문하시겠습니까?"
    ja: |-
      いらっしゃいませ～
      コスモバーガーへようこそ～★
      ご注文はお決まりですか？
  event_overthehorizon_04_s_32:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_s_33:
    speaker: "<Monologue>"
    en: This is bad.
    ko: 큰일이다.
    ja: 困ったことになった
  event_overthehorizon_04_s_34:
    speaker: "<Monologue>"
    en: Between the sunglasses Rapi gave me,
    ko: 라피가 씌워준 선글라스.
    ja: ラピにかけられたサングラス
  event_overthehorizon_04_s_35:
    speaker: "<Monologue>"
    en: the wide-brimmed hat Anis plopped on my head,
    ko: 아니스가 씌워준 챙이 넓은 모자.
    ja: アニスに被せられたつばの広い帽子
  event_overthehorizon_04_s_36:
    speaker: "<Monologue>"
    en: the mustache Neon stuck on,
    ko: 네온이 붙여준 콧수염.
    ja: ネオンにつけられた口ひげ
  event_overthehorizon_04_s_37:
    speaker: "<Monologue>"
    en: and the high-collared trench coat I hurriedly threw on...
    ko: 옷장에서 급하게 주워 입은 깃이 높은 코트 때문에….
    ja: |-
      クローゼットから適当につかみだした
      えりの高いコートのせいで…
  event_overthehorizon_04_s_38:
    speaker: "<Monologue>"
    en: I can't even see the menu.
    ko: 메뉴판이 잘 보이지 않는다.
    ja: メニューがよく見えない
  event_overthehorizon_04_s_39:
    speaker: manstaff
    en: Uh... do you need some help reading the menu, sir?
    ko: "저… 손님? \n메뉴가 잘 안 보이실까요~?"
    ja: あのぉ…お客様？大丈夫ですか～？
  event_overthehorizon_04_s_40:
    speaker: "<Self>"
    en: "... Just give me whatever's most popular here."
    ko: "…여기서 제일 잘 나가는 메뉴로."
    ja: "…一番人気のものを"
  event_overthehorizon_04_s_41:
    speaker: manstaff
    en: The Happy Meteor Set is our most popular menu item. Would you like that?
    ko: 가장 잘나가는 메뉴는 해피 메테오 세트인데, 그걸로 드릴까요~?
    ja: |-
      かしこまりました！当店で一番人気のメニューは
      ハッピーメテオセットになります。
      そちらでよろしいでしょうか～？
  event_overthehorizon_04_s_42:
    speaker: "<Monologue>"
    en: I hurriedly nod in agreement.
    ko: 황급히 고개를 끄덕였다.
    ja: これ以上何か言われる前に首を縦に振った
  event_overthehorizon_04_s_43:
    speaker: manstaff
    en: Okay, we'll have that ready in just a moment!
    ko: 네~ 조금만 기다려 주세요~!
    ja: かしこまりました。少々お待ちくださいませ～！
  event_overthehorizon_04_s_44:
    speaker: "<Monologue>"
    en: After that ordeal, I finally got my order and sat down. But no matter how
      long I waited...
    ko: 그렇게 우여곡절 끝에, 시킨 메뉴를 가져와 아무리 기다려도….
    ja: |-
      何とか注文を終え、
      注文したメニューを持って席に座った
  event_overthehorizon_04_s_45:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 와삭-
    ja: ガブッ
  event_overthehorizon_04_s_46:
    speaker: "<Monologue>"
    en: Even after I've finished half my burger...
    ko: 햄버거를 반 이상 먹어 치웠는데도….
    ja: だが、ハンバーガーを半分以上食べ終えても…
  event_overthehorizon_04_s_47:
    speaker: "<Monologue>"
    en: Sora still hasn't shown up.
    ko: "…소라가 오지 않는다."
    ja: "…ソラは来ない"
  event_overthehorizon_04_s_48:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_s_49:
    speaker: "<Monologue>"
    en: I check the time on my phone.
    ko: 핸드폰을 들어, 시간을 확인했다.
    ja: 端末で時間を確認した
  event_overthehorizon_04_s_50:
    speaker: "<Narration>"
    en: 3:02 PM.
    ko: "[오후 3 : 02]"
    ja: "「午後3：02」"
  event_overthehorizon_04_s_51:
    speaker: "<Self>"
    en: Did I get the location wrong?
    ko: 내가 지점을 잘못 알았나?
    ja: 店を間違えたか？
  event_overthehorizon_04_s_52:
    speaker: "<Narration>"
    en: "*Jingle*"
    ko: 딸랑~
    ja: チリン～
  event_overthehorizon_04_s_53:
    speaker: sora
    en: Ahhh, Cosmo Burger! ★
    ko: 흐흥~ 코스모~ 버거~★
    ja: フンフフン～コスモ～バーガー★
  event_overthehorizon_04_s_54:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_overthehorizon_04_s_55:
    speaker: "<Monologue>"
    en: Sora walks into the restaurant.
    ko: 소라가 가게 안으로 들어왔다.
    ja: ソラが店の中に入ってきた
  event_overthehorizon_04_s_56:
    speaker: manstaff
    en: Everybody! It's time for Cosmo Taste! ★
    ko: Everybody! Cosmo Taste~★
    ja: Everybody! Cosmo Taste~★
  event_overthehorizon_04_s_57:
    speaker: manstaff
    en: Welcome to Cosmo Burger! ★
    ko: 어서 오세요~ 코스모 버거입니다~★
    ja: |-
      いらっしゃいませ～
      コスモバーガーへようこそ～★
  event_overthehorizon_04_s_58:
    speaker: sora
    en: Hi there!
    ko: 안녕하세요~
    ja: こんにちは～
  event_overthehorizon_04_s_59:
    speaker: "<Monologue>"
    en: Sora slowly looks around the restaurant.
    ko: 소라가 가게 안을 천천히 둘러본다.
    ja: ソラが店内をゆっくりと見回した
  event_overthehorizon_04_s_60:
    speaker: sora
    en: "... ★"
    ko: "…★"
    ja: "…★"
  event_overthehorizon_04_s_61:
    speaker: manstaff
    en: May I take your order?
    ko: 주문하시겠습니까?
    ja: ご注文はお決まりですか？
  event_overthehorizon_04_s_62:
    speaker: sora
    en: Oh, sorry.
    ko: 아, 죄송해요~
    ja: あ。ごめんなさい、注文忘れてた。
  event_overthehorizon_04_s_63:
    speaker: "<Monologue>"
    en: Sora looks at the menu.
    ko: 소라가 메뉴판을 들여다보았다.
    ja: ソラがメニューをのぞき込んだ
  event_overthehorizon_04_s_64:
    speaker: sora
    en: Can I have this, this, and that to go, please?
    ko: 이거랑 이거랑 이걸 포장해 주실 수 있을까요~?
    ja: |-
      これとこれとこれ、
      テイクアウトでお願いしま～す。
  event_overthehorizon_04_s_65:
    speaker: sora
    en: Oh, and could I also get this set meal, but packed separately?
    ko: 아, 그리고 이 세트만 따로 담아주실 수 있을까요?
    ja: |-
      あ、それとこのセットだけ
      別にしてもらえますか？
  event_overthehorizon_04_s_66:
    speaker: manstaff
    en: Sure, we can do that for you.
    ko: 네. 가능합니다~
    ja: はい。かしこまりました～
  event_overthehorizon_04_s_67:
    speaker: sora
    en: Great, thanks.
    ko: 그러면 그렇게 부탁드려요~
    ja: 全部でおいくらですか～？
  event_overthehorizon_04_s_68:
    speaker: "<Self>"
    en: She's getting it to go?
    ko: "…포장?"
    ja: "…テイクアウト？"
  event_overthehorizon_04_s_69:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブブ…
  event_overthehorizon_04_s_70:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_04_s_71:
    speaker: "<Self>"
    en: The park from before...?
    ko: 그… 공원?
    ja: "…この前のあの公園？"
  event_overthehorizon_04_s_72:
    speaker: manstaff
    en: Your order is ready!
    ko: 주문하신 메뉴 나왔습니다~
    ja: お待たせいたしました～
  event_overthehorizon_04_s_73:
    speaker: sora
    en: Wow! Thanks! ☆
    ko: 와아~ 감사해요~☆
    ja: わあ～ありがとうございます～☆
  event_overthehorizon_04_s_74:
    speaker: "<Monologue>"
    en: Sora picks up the bags of food.
    ko: 소라가 포장된 음식 봉투를 집어 들었다.
    ja: ソラはテイクアウト用の紙袋を持ち上げると
  event_overthehorizon_04_s_75:
    speaker: sora
    en: La de da de da... ♥
    ko: 흠흠~♥
    ja: フンフフン～♥
  event_overthehorizon_04_s_76:
    speaker: "<Monologue>"
    en: She then takes some fries from one of the bags and starts munching away.
    ko: 그리고는 음식 봉투 하나에서 감자튀김을 꺼내먹었다.
    ja: 袋の中からポテトを取り出し口に入れた
  event_overthehorizon_04_s_77:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 와작-
    ja: ぱくっ
  event_overthehorizon_04_s_78:
    speaker: sora
    en: Ahhh, nothing beats freshly fried fries. ♥
    ko: 역시~ 갓 튀겨 나온 감자튀김이 최고라니까~♥
    ja: おいし～い！やっぱポテトは揚げたてだよね～♥
  event_overthehorizon_04_s_79:
    speaker: manstaff
    en: Have a nice day!
    ko: 안녕히 가십시오~
    ja: またのご利用をお待ちしております～
  event_overthehorizon_04_s_80:
    speaker: "<Monologue>"
    en: Sora walks out.
    ko: 소라가 밖으로 나갔다.
    ja: ソラが店の外に出た
  event_overthehorizon_04_s_81:
    speaker: "<Self>"
    en: I can't lose her!
    ko: "…놓치면 안 돼…!"
    ja: "…逃がすか…！"
  event_overthehorizon_04_s_82:
    speaker: "<Monologue>"
    en: After frantically shoving the rest of the burger in my mouth and throwing
      away my trash,
    ko: 햄버거를 입에 욱여넣고 자리를 정리한 후,
    ja: |-
      残りのハンバーガーを口に詰め込み、
      急いでテーブルを片付け…
  event_overthehorizon_04_s_83:
    speaker: "<Monologue>"
    en: I quickly follow Sora outside.
    ko: 황급히 밖으로 따라 나갔다.
    ja: ソラのあとを追って店を飛び出した
event_overthehorizon_04_e:
  event_overthehorizon_04_e_1:
    speaker: "<Monologue>"
    en: After leaving Cosmo Burger,
    ko: 코스모 버거에서 나온 후,
    ja: コスモバーガーを出て周囲を見渡すと
  event_overthehorizon_04_e_2:
    speaker: "<Monologue>"
    en: I'm relieved to find that Sora hasn't ventured too far.
    ko: 다행히 멀리 가지 않은 소라를 발견했다.
    ja: 幸いにもソラはすぐ近くにいた
  event_overthehorizon_04_e_3:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 와작-
    ja: ガブッ
  event_overthehorizon_04_e_4:
    speaker: "<Monologue>"
    en: Sora takes a big bite out of her burger.
    ko: 소라가 햄버거를 한 입 크게 베어 물었다.
    ja: ソラがハンバーガーを一口ほおばった
  event_overthehorizon_04_e_5:
    speaker: sora
    en: Mmm! This new burger is amazing! ☆
    ko: 음~ 이 신메뉴 진자 너무 맛있어☆
    ja: う～ん、この新メニュー最高☆
  event_overthehorizon_04_e_6:
    speaker: sora
    en: It's not greasy at all, thanks to all this hot sauce. ☆
    ko: 핫소스 많이 뿌려서 느끼하지도 않고☆
    ja: チリソースのおかげで全然しつこくないし☆
  event_overthehorizon_04_e_7:
    speaker: sora
    en: I bet the kids would love this.
    ko: 흐흥~ 애들도 좋아하겠지?
    ja: フフ～ン、みんなも喜んでくれそう。
  event_overthehorizon_04_e_8:
    speaker: "<Monologue>"
    en: Sora starts to walk again.
    ko: 소라가 다시 이동하기 시작했다.
    ja: ソラが再び歩き出した
  event_overthehorizon_04_e_9:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_e_10:
    speaker: "<Monologue>"
    en: I began secretly tailing Sora.
    ko: 몰래 소라의 뒤를 쫓기 시작했다.
    ja: 私はこっそりと尾行を開始した
  event_overthehorizon_04_e_11:
    speaker: sonboy
    en: Mom, look at what that man's wearing! He must be melting in this heat!
    ko: 엄마! 저 아저씨 엄청 더울 거 같아!
    ja: ママ！あのおじさん、すっごく暑そう！
  event_overthehorizon_04_e_12:
    speaker: momwoman
    en: Shh. It's better to stay away from people like that.
    ko: 쉿. 저런 사람이랑 엮이면 안 돼.
    ja: シーッ。目を合わせちゃダメよ。
  event_overthehorizon_04_e_13:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_e_14:
    speaker: "<Monologue>"
    en: I pull my hat down as far as it will go to hide my face and quicken my pace.
    ko: 모자를 최대한 눌러, 얼굴을 가린 채 빠르게 걸음을 옮겼다.
    ja: |-
      誰にも見られたくない一心で、
      帽子を深く被り足早に歩いた
  event_overthehorizon_04_e_15:
    speaker: "<Monologue>"
    en: Sora eventually arrives at the orphanage.
    ko: 그 후, 소라는 보육원에 가고….
    ja: しばらく歩くと、孤児院に辿り着いた
  event_overthehorizon_04_e_16:
    speaker: sora
    en: All right, everyone, I brought you a little gift! ☆
    ko: |-
      자~ 여러분~
      선물 왔어요~☆
    ja: |-
      さあ、みんな～
      プレゼントがありますよ～☆
  event_overthehorizon_04_e_17:
    speaker: "<Monologue>"
    en: Sora hands the bag of food to the children.
    ko: 소라가 아이들에게 음식 봉투를 내밀었다.
    ja: そう言って、ソラは子どもたちに袋を渡した
  event_overthehorizon_04_e_18:
    speaker: children
    en: Cosmo Burger!
    ko: 코스모 버거다~!
    ja: コスモバーガーだ～！
  event_overthehorizon_04_e_19:
    speaker: children
    en: Yaaaaay!
    ko: 우와~
    ja: わぁ～
  event_overthehorizon_04_e_20:
    speaker: children
    en: You're the best, Miss Sora!
    ko: 언니 최고!
    ja: お姉ちゃん、大好き～！
  event_overthehorizon_04_e_21:
    speaker: "<Monologue>"
    en: The children surround Sora.
    ko: 아이들이 소라에게 몰려들었다.
    ja: 子どもたちがソラをぐるりと囲んだ
  event_overthehorizon_04_e_22:
    speaker: boy03
    en: Miss Sora,
    ko: 누나.
    ja: ねえ、お姉ちゃん。
  event_overthehorizon_04_e_23:
    speaker: boy03
    en: where's that man from before?
    ko: 전에 그 형은?
    ja: この前のお兄ちゃんは？
  event_overthehorizon_04_e_24:
    speaker: sora
    en: Oh, he's a little busy today, so he couldn't make it. ☆
    ko: 음~ 그 오빠는 오늘은 바빠서 같이 못 왔어요☆
    ja: ん～…あのお兄ちゃんはね、今日は忙しいって☆
  event_overthehorizon_04_e_25:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_e_26:
    speaker: sora
    en: I'll make sure that he comes along next time. ☆
    ko: 다음에 꼭 같이 올게요☆
    ja: 次は絶対、一緒に来るね☆
  event_overthehorizon_04_e_27:
    speaker: boy03
    en: Okay!
    ko: 응!
    ja: うん！
  event_overthehorizon_04_e_28:
    speaker: boy03
    en: Can we fly airplanes again next time?
    ko: 다음에 또 같이 비행기 하면서 놀자!
    ja: |-
      お兄ちゃんとまた、
      飛行機ごっこして遊ぶんだ～！
  event_overthehorizon_04_e_29:
    speaker: sora
    en: Of course! ☆
    ko: 좋아요~☆
    ja: オッケー☆
  event_overthehorizon_04_e_30:
    speaker: sora
    en: By the way, isn't it usually a bit more crowded in here?
    ko: 음, 근데 평소보다 인원이 적은 것 같은데,
    ja: あれ、そういえば他のみんなは？
  event_overthehorizon_04_e_31:
    speaker: sora
    en: Where is everyone?
    ko: 다들 어디 갔나요?
    ja: 姿が見えませんが…
  event_overthehorizon_04_e_32:
    speaker: boy03
    en: Oh, they went to the park to play, not knowing that you'd be here today.
    ko: 아, 누나 오는지 모르고 공원 가서 놀고 있는 애들 있어.
    ja: |-
      あ、お姉ちゃんが来るって知らなくて、
      公園に遊びに行っちゃったの。
  event_overthehorizon_04_e_33:
    speaker: boy03
    en: Should I go get them?
    ko: 가서 데려올까?
    ja: 連れてこようか？
  event_overthehorizon_04_e_34:
    speaker: sora
    en: |-
      Hehe, no, it's okay.
      I'll go there to meet them. ☆
    ko: |-
      후후, 아니에요~
      제가 갈게요~☆
    ja: |-
      ふふ、大丈夫。
      こっちから行くから～☆
  event_overthehorizon_04_e_35:
    speaker: "<Monologue>"
    en: Sora heads to the nearby park and begins playing with the other children there.
    ko: 근처 공원에 가서, 또 다른 아이들과 놀아주기 시작했다.
    ja: |-
      ソラは近くの公園に移動すると、
      別の子どもたちと遊び始めた
  event_overthehorizon_04_e_36:
    speaker: sora
    en: Instead of airplanes today, how about we do something else?
    ko: 오늘은 비행기 말고, 다른 거 하면서 놀까요~?
    ja: |-
      今日は飛行機ごっこじゃなくて、
      他のことをして遊びましょうね～☆
  event_overthehorizon_04_e_37:
    speaker: children
    en: Hehe, okay!
    ko: 헤헤, 좋아요!
    ja: えへへっ！はぁ～～い！
  event_overthehorizon_04_e_38:
    speaker: "<Monologue>"
    en: Watching her play with the children...
    ko: 그 모습을 멍하니 보고 있다 보니….
    ja: 私はその様子を、ただぼんやりと眺めた
  event_overthehorizon_04_e_39:
    speaker: "<Self>"
    en: "... Really gives me a sense of peace."
    ko: "…평화롭네."
    ja: "…平和だな"
  event_overthehorizon_04_e_40:
    speaker: "<Monologue>"
    en: Between that burger and all the walking I've done, I'm starting to feel a
      bit drowsy.
    ko: 밥을 먹고 산책까지 해서 그런지, 소화도 잘돼서 잠이 몰려왔다….
    ja: |-
      満腹感と散歩後の軽い疲労感からか、
      眠気が押し寄せてきた…
  event_overthehorizon_04_e_41:
    speaker: "<Self>"
    en: "*Yawn*"
    ko: 하암….
    ja: ふわぁ…
  event_overthehorizon_04_e_42:
    speaker: sora
    en: Hehe, this time I'm coming to catch you! ♡
    ko: "크아아~♡ \n이번엔 언니가 잡으러 갈 거예요~"
    ja: |-
      ガオ～♡
      今度はお姉ちゃんが鬼だぞ～
  event_overthehorizon_04_e_43:
    speaker: children
    en: Ehehehe!
    ko: 꺄하하하하!
    ja: キャハハハハ！
  event_overthehorizon_04_e_44:
    speaker: "<Self>"
    en: This doesn't look like someone who's about to make a smuggling deal...
    ko: 이게 정말… 밀수 거래를 하러 가는 사람이 맞나?
    ja: |-
      しかし…どう見ても、これから後ろ暗い取引に
      行くようには見えないが…
  event_overthehorizon_04_e_45:
    speaker: "<Monologue>"
    en: I re-read the text exchange I've had with Sora.
    ko: 다시 소라와 이야기했던 메시지들을 읽어보았다.
    ja: もう一度、ソラとのメッセージを確認した
  event_overthehorizon_04_e_46:
    speaker: "<Self>"
    en: I can't help but be suspicious given the content of these messages...
    ko: 이 메시지의 내용은 그걸 의심할 수밖에 없는데….
    ja: メッセージだけを見れば、疑いようがないが…
  event_overthehorizon_04_e_47:
    speaker: "<Self>"
    en: But I also can't keep following her around like this forever.
    ko: "…언제까지 이렇게 따라다닐 수도 없고."
    ja: |-
      …このままずっと
      尾行を続けるわけにもいかないし…
  event_overthehorizon_04_e_48:
    speaker: "<Narration>"
    en: I put my phone away and stand up.
    ko: 핸드폰을 집어넣고 몸을 일으켰다.
    ja: 携帯電話をしまい、立ち上がった
  event_overthehorizon_04_e_49:
    speaker: "<Self>"
    en: This won't do. I should go and talk to Sora.
    ko: 안 되겠다. 가서, 소라와 얘기를 해봐야겠….
    ja: よし、ソラと話をしてみ…
  event_overthehorizon_04_e_50:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブブ…
  event_overthehorizon_04_e_51:
    speaker: "<Self>"
    en: "?!"
    ko: "?!"
    ja: "！？"
  event_overthehorizon_04_e_52:
    speaker: sora
    en: All right, kiddos, I have things to do, so I've gotta go.
    ko: 언니는 일이 있어서 먼저 갈게요~
    ja: |-
      お姉ちゃんはお仕事があるから、
      もう行かなくちゃ～
  event_overthehorizon_04_e_53:
    speaker: sora
    en: I'll see you next time, okay?
    ko: 다음에 또 봐요~☆
    ja: またね～☆
  event_overthehorizon_04_e_54:
    speaker: "<Monologue>"
    en: After receiving a flurry of goodbyes from the children,
    ko: 소라가 아이들에게 인사를 잔뜩 받은 후,
    ja: 子どもたちの「またね」の声に送られながら
  event_overthehorizon_04_e_55:
    speaker: "<Monologue>"
    en: Sora leisurely sets out from the park.
    ko: 유유히 걸어가기 시작했다.
    ja: ソラがゆっくりと孤児院を離れた
  event_overthehorizon_04_e_56:
    speaker: "<Monologue>"
    en: I should keep following her.
    ko: 그 뒤를 따라, 이동하자….
    ja: 見失わないよう、後を追うと…
  event_overthehorizon_04_e_57:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_overthehorizon_04_e_58:
    speaker: "<Self>"
    en: This is...!
    ko: 여긴…!
    ja: ここは…！
  event_overthehorizon_04_e_59:
    speaker: "<Monologue>"
    en: The Outer Rim's Partition comes into view.
    ko: 아우터 림의 격벽이 보였다.
    ja: アウターリムの防壁が目に入った
  event_overthehorizon_04_e_60:
    speaker: announcement
    en: The gate to the Outer Rim will open soon.
    ko: 잠시 후, 아우터 림으로 들어가는 게이트가 열립니다.
    ja: |-
      ご注意ください。
      アウターリムのゲートが開放されます。
  event_overthehorizon_04_e_61:
    speaker: announcement
    en: The Central Government has designated the area inside the gate as a danger
      zone.
    ko: 게이트 내부는 중앙 정부에서 지정한 [위험 구역]이오니,
    ja: |-
      ゲートの内部は中央政府が指定した
      「危険区域」となります。
  event_overthehorizon_04_e_62:
    speaker: announcement
    en: Citizens are advised to exercise caution and avoid entering the area by mistake.
      Thank you.
    ko: |-
      시민들께서는 착오로 진입하는 일이 없도록 주의해 주시기 바랍니다.
      고맙습니다.
    ja: |-
      市民の皆様は誤って進入することのないよう、
      お気をつけください。
  event_overthehorizon_04_e_63:
    speaker: "<Narration>"
    en: "*Rumble*"
    ko: 쿠구구구….
    ja: ゴゴゴゴ――
  event_overthehorizon_04_e_64:
    speaker: "<Monologue>"
    en: The heavy gate begins to slowly open.
    ko: 투박한 게이트가 천천히 열리기 시작했다.
    ja: 無骨なゲートがゆっくりと開き始めた
  event_overthehorizon_04_e_65:
    speaker: sora
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_04_e_66:
    speaker: "<Monologue>"
    en: Sora heads through the doors and out into the Outer Rim.
    ko: 열리는 문 사이로, 소라가 아우터 림을 향해 걸어 들어갔다.
    ja: |-
      開いたゲートを通過し、
      ソラがアウターリムに向かって歩いていった
  event_overthehorizon_04_e_67:
    speaker: "<Self>"
    en: "... I can't let her out of my sight."
    ko: "…가야 해."
    ja: "…行くしかない"
  event_overthehorizon_04_e_68:
    speaker: "<Monologue>"
    en: I follow her inside.
    ko: 그 뒤를 쫓았다.
    ja: 私はその後を追った
event_overthehorizon_05_s:
  event_overthehorizon_05_s_1:
    speaker: "<Monologue>"
    en: After following Sora into the Outer Rim,
    ko: 소라를 따라, 아우터 림 안으로 들어가자.
    ja: ソラに続いてアウターリムの中に入ると…
  event_overthehorizon_05_s_2:
    speaker: "<Monologue>"
    en: the surroundings suddenly grow dark.
    ko: 순식간에 주위가 어두워지기 시작했다.
    ja: あっという間に辺りが暗くなった
  event_overthehorizon_05_s_3:
    speaker: "<Monologue>"
    en: It felt too dangerous to keep going with my vision impaired, so I took off
      my sunglasses.
    ko: 이대로 앞을 제대로 보지 않는 것은 위험할 것 같아 선글라스를 벗었다.
    ja: |-
      このままでは何も見えずに危険だと思い、
      サングラスを外した
  event_overthehorizon_05_s_4:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_05_s_5:
    speaker: "<Monologue>"
    en: Looking up at the sky,
    ko: 하늘을 올려다보자,
    ja: 見上げると…
  event_overthehorizon_05_s_6:
    speaker: "<Monologue>"
    en: it's nothing like the brightly-lit Ark.
    ko: 빛으로 가득한 방주와는 명백히 다른,
    ja: 光に満ちたアークとは対照的だ
  event_overthehorizon_05_s_7:
    speaker: "<Monologue>"
    en: Here, the ceiling is nothing but blackness.
    ko: 이곳이 땅 밑이라고 명확하게 보여주는,
    ja: ここが地の底であると思い出させるような
  event_overthehorizon_05_s_8:
    speaker: "<Monologue>"
    en: A clear reminder that this place is underground.
    ko: 어둠으로 가득한 천장이 보였다.
    ja: 暗闇が頭上に広がっている
  event_overthehorizon_05_s_9:
    speaker: "<Self>"
    en: They must not have their own Dome of Eternity here.
    ko: "…이터널 스카이가 없는 곳이어서 이렇게 어두운 것이겠지."
    ja: |-
      …エターナルスカイがないから
      こんなに暗いのだろう
  event_overthehorizon_05_s_10:
    speaker: "<Monologue>"
    en: As I look around
    ko: 주변을 둘러보자,
    ja: あたりを見回すと、
  event_overthehorizon_05_s_11:
    speaker: "<Monologue>"
    en: between the worn-down buildings and flickering lights,
    ko: 낡고 부서진 건물에 깜박이는 전등 사이로,
    ja: 古びて壊れた建物の中、ちらつく照明の間から
  event_overthehorizon_05_s_12:
    speaker: "<Monologue>"
    en: I see people sitting in the shadows stealing glances in my direction.
    ko: 어둠 속에 앉아, 이쪽을 힐끔거리는 사람들의 모습이 보인다.
    ja: 暗闇に座り、こちらをうかがう人々の姿が見える
  event_overthehorizon_05_s_13:
    speaker: "<Monologue>"
    en: Amidst them, Sora walks in casually, humming a tune.
    ko: 그 사이로 아무렇지 않게, 노래를 흥얼거리며 소라가 걸어 들어간다.
    ja: その中を、ソラは歌を口ずさみながら歩いていく
  event_overthehorizon_05_s_14:
    speaker: sora
    en: Let's fly, fly up high! ♥
    ko: 높이높이~ 날아가 볼까요~♥
    ja: 高く高く飛んでけ～♪
  event_overthehorizon_05_s_15:
    speaker: sora
    en: Doo dee doo! ★
    ko: 흐흐흥~★
    ja: フンフフン～★
  event_overthehorizon_05_s_16:
    speaker: "<Monologue>"
    en: I'm careful not to look anyone in the eye,
    ko: 최대한 주변 사람들과 눈을 마주치지 않게 조심하며,
    ja: 周囲と目を合わせないように注意しながら
  event_overthehorizon_05_s_17:
    speaker: "<Monologue>"
    en: as I continue to tail after her.
    ko: 그 뒤를 조심스레 따라 걸었다.
    ja: 気取られないようソラの後を追った
  event_overthehorizon_05_s_18:
    speaker: "<Monologue>"
    en: Sora confidently weaves through the labyrinthian series of alleyways.
    ko: 소라가 미로와 같은 골목길을 누비며, 망설임 없이 앞으로 걸어간다.
    ja: |-
      ソラは迷路のような路地を縫うように、
      迷うことなく歩いていく
  event_overthehorizon_05_s_19:
    speaker: sora
    en: Blue skies and aeroplanes! ☆
    ko: 푸른~ 하늘과 비행기~☆
    ja: 青い～空と飛行機～☆
  event_overthehorizon_05_s_20:
    speaker: sora
    en: Where are you flying to? ★
    ko: 어디로 날아갔나~★
    ja: どこに飛んでったの～★
  event_overthehorizon_05_s_21:
    speaker: "<Monologue>"
    en: It's even darker here than it was at the entrance of the partition, and I
      nearly lose track of her several times,
    ko: 골목 사이사이는 격벽 입구 쪽보다 더 어두워서 몇 번이고 놓칠 뻔했지만,
    ja: |-
      入ってきた場所よりもさらに暗い。
      何度もソラを見失いかけたが、
  event_overthehorizon_05_s_22:
    speaker: "<Monologue>"
    en: but I manage to stay on her thanks to the sound of her singing,
    ko: 마치 따라오라는 듯 들리는 소라의 노랫소리를 따라,
    ja: 道しるべのようなソラの歌声のおかげで
  event_overthehorizon_05_s_23:
    speaker: "<Monologue>"
    en: as I follow her between the alleyways for what feels like a long time.
    ko: 골목 사이로 한참을 따라 들어갔다.
    ja: 路地の奥深くまでたどり着いた
  event_overthehorizon_05_s_24:
    speaker: "<Self>"
    en: Something... feels really strange...
    ko: 좀… 이상한데….
    ja: "…妙だな"
  event_overthehorizon_05_s_25:
    speaker: sora
    en: Dee dee dah ★
    ko: 으흐흥~★
    ja: フンフフン～★
  event_overthehorizon_05_s_26:
    speaker: "<Monologue>"
    en: Sora turns a corner into another alley.
    ko: 소라가 코너를 돌아, 다른 골목을 향해 들어갔다.
    ja: ソラが角を曲がり、別の路地へと入っていく
  event_overthehorizon_05_s_27:
    speaker: "<Monologue>"
    en: I follow her around the corner too...
    ko: 그 뒤를 따라, 코너를 돌아갔….
    ja: 後を追い、角を曲がると…
  event_overthehorizon_05_s_28:
    speaker: "<Self>"
    en: "?!!"
    ko: "?!!"
    ja: "！！？"
  event_overthehorizon_05_s_29:
    speaker: "<Monologue>"
    en: But no one is there.
    ko: 아무도 없다.
    ja: 誰もいない
  event_overthehorizon_05_s_30:
    speaker: "<Monologue>"
    en: Her singing can no longer be heard.
    ko: 노랫소리도 들리지 않는다.
    ja: 歌声も聞こえなくなった
  event_overthehorizon_05_s_31:
    speaker: "<Self>"
    en: Where did she...
    ko: 어디 갔…!
    ja: どこに行っ…！
  event_overthehorizon_05_s_32:
    speaker: sora
    en: Hi-yah! ♥
    ko: 쉿♥
    ja: シーッ♥
  event_overthehorizon_05_s_33:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_05_s_34:
    speaker: "<Monologue>"
    en: Someone hugs me from behind.
    ko: 누군가가 뒤에서 껴안아 왔다.
    ja: 誰かに後ろから抱きつかれた
  event_overthehorizon_05_s_35:
    speaker: sora
    en: Gotcha! ♡
    ko: 잡았다♡
    ja: 捕まえた♡
event_overthehorizon_05_e:
  event_overthehorizon_05_e_1:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 우당탕탕-
    ja: ドスン、ガタン――
  event_overthehorizon_05_e_2:
    speaker: "<Monologue>"
    en: Sora shoves me, and I topple to the ground.
    ko: 소라에게 떠밀려 바닥으로 넘어졌다.
    ja: ソラに突き飛ばされ、地面に倒れこんだ
  event_overthehorizon_05_e_3:
    speaker: "<Self>"
    en: Urgh...
    ko: "…윽."
    ja: "…うぅっ"
  event_overthehorizon_05_e_4:
    speaker: sora
    en: Well well, who do we have here? ♥
    ko: 이게 누구야~♥
    ja: これはこれは～♥
  event_overthehorizon_05_e_5:
    speaker: sora
    en: Captain?
    ko: 캡틴이었군요?
    ja: キャプテンでしたか～
  event_overthehorizon_05_e_6:
    speaker: "<Self>"
    en: "... Sora."
    ko: "…소라."
    ja: "…ソラ"
  event_overthehorizon_05_e_7:
    speaker: sora
    en: Hehe, what's with the getup?
    ko: 후후, 이 모자랑, 옷이랑 콧수염은 다 뭐예요~
    ja: |-
      ふふ、どうしたんですか～？
      ヘンなカッコ～
  event_overthehorizon_05_e_8:
    speaker: "<Self>"
    en: Well...
    ko: 그게….
    ja: これは…
  event_overthehorizon_05_e_9:
    speaker: sora
    en: Haha, you're so cute! ♥
    ko: 후후. 귀여워라♥
    ja: あはは。かわいい♥
  event_overthehorizon_05_e_10:
    speaker: sora
    en: You even came disguised. ♥
    ko: 이렇게 변장까지 하시고~
    ja: そんな変装してくるなんて～
  event_overthehorizon_05_e_11:
    speaker: sora
    en: You've been following me for a while, haven't you?
    ko: 아까부터 계속 저 쫓아오신 거 맞죠?
    ja: ずっと、私のことをツケてたんですよね？
  event_overthehorizon_05_e_12:
    speaker: "<Self>"
    en: "... Yes."
    ko: "…그래."
    ja: "…そうだ"
  event_overthehorizon_05_e_13:
    speaker: sora
    en: Hmm.
    ko: 흠~
    ja: う～ん。
  event_overthehorizon_05_e_14:
    speaker: sora
    en: You could have just asked to come along, you know. ★
    ko: 그랬으면 당당하게 같이 가자고 말씀하셨으면 됐을 텐데★
    ja: 堂々と声をかけてくれればよかったのに★
  event_overthehorizon_05_e_15:
    speaker: sora
    en: What are you doing, following me around?
    ko: 왜 이렇게 뒤를 졸졸 쫓아오셨어요.
    ja: なんでこっそりついて来てたんですか？
  event_overthehorizon_05_e_16:
    speaker: sora
    en: You made me wanna give you a good scare. ♥
    ko: 놀라게 하고 싶게♥
    ja: |-
      そんなことされたら、逆に
      びっくりさせたくなっちゃう♥
  event_overthehorizon_05_e_17:
    speaker: "<Self>"
    en: Because it seems like you're hiding something, Sora.
    ko: 소라가 숨기고 있는 게 있을 거 같아서.
    ja: 何か隠しごとがあるだろう
  event_overthehorizon_05_e_18:
    speaker: sora
    en: Me?
    ko: 제가요?
    ja: 私にですか？
  event_overthehorizon_05_e_19:
    speaker: sora
    en: Hmm... What could I possibly be hiding?
    ko: 음~ 뭘 숨기고 있었을까요?
    ja: う～ん、何を隠すっていうんですか？
  event_overthehorizon_05_e_20:
    speaker: "<Self>"
    en: You're smuggling something.
    ko: 밀수.
    ja: 違法な仕事だ
  event_overthehorizon_05_e_21:
    speaker: sora
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_05_e_22:
    speaker: sora
    en: Smuggling? ★
    ko: 밀수★
    ja: 違法な仕事★
  event_overthehorizon_05_e_23:
    speaker: sora
    en: What's that?
    ko: 그게 뭔데요~?
    ja: 何のことですか～？
  event_overthehorizon_05_e_24:
    speaker: "<Self>"
    en: That's what happened during training.
    ko: 교육 시간에 그랬잖아.
    ja: 航空教育の時に聞いた
  event_overthehorizon_05_e_25:
    speaker: "<Self>"
    en: There was an incident where some supplies that had been brought from the surface
      disappeared.
    ko: 지상에서 갖고 온 물자가 사라진, 밀수 사건이 있었다고.
    ja: |-
      地上から持ち込んだはずの物資が
      消えているそうだな
  event_overthehorizon_05_e_26:
    speaker: sora
    en: Oh? You don't say.
    ko: 흐음~ 그랬죠?
    ja: あ～、そうでしたね。
  event_overthehorizon_05_e_27:
    speaker: "<Self>"
    en: You were the one who did it, weren't you?
    ko: "그거. \n소라가 범인이지?"
    ja: その犯人は、君だろう？
  event_overthehorizon_05_e_28:
    speaker: sora
    en: What makes you think that?
    ko: 왜 그렇게 생각하시는데요?
    ja: どうしてそう思うんですか？
  event_overthehorizon_05_e_29:
    speaker: "<Self>"
    en: Because of this.
    ko: 이걸 봤으니까.
    ja: これを見たからだ
  event_overthehorizon_05_e_30:
    speaker: "<Monologue>"
    en: I show Sora the first message I received from her.
    ko: 소라에게 처음 받았던 메시지를 내밀었다.
    ja: |-
      一番最初にソラから受け取った
      メッセージを見せた
  event_overthehorizon_05_e_31:
    speaker: sora
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_05_e_32:
    speaker: "<Self>"
    en: You accidentally sent this message to me instead.
    ko: 소라가 보낸 메시지, 내가 받았거든.
    ja: 私のところに誤送信されてきた
  event_overthehorizon_05_e_33:
    speaker: sora
    en: "... I see. ★"
    ko: "…그랬군요★"
    ja: "…そうだったんですね★"
  event_overthehorizon_05_e_34:
    speaker: "<Monologue>"
    en: Sora stares at the phone.
    ko: 소라가 핸드폰을 빤히 바라보았다.
    ja: ソラが携帯をじっと見つめた
  event_overthehorizon_05_e_35:
    speaker: sora
    en: '"You have no idea how difficult it was sneaking this stuff through."'
    ko: "[몰래 갖고 들어오는데 얼마나 힘들었는 줄 알아요?]"
    ja: |-
      「これを持ち出すのに
      どれだけ苦労したか分かります？」
  event_overthehorizon_05_e_36:
    speaker: sora
    en: '"Things didn''t go smoothly this time, so they''re really cracking down with
      inspections. ★"'
    ko: "[이번에 일이 좀 안 좋게 풀려서 검문도 삼엄해져서★]"
    ja: |-
      「今回は結構手こずったんですよ。
      検査も厳しくなっちゃって★」
  event_overthehorizon_05_e_37:
    speaker: sora
    en: '"It''s getting harder and harder to bring stuff in."'
    ko: "[점점 몰래 들여오는 것도 힘들어지고 있다고요]"
    ja: |-
      「こっそり持ち出すのも
      だんだん難しくなってきました」
  event_overthehorizon_05_e_38:
    speaker: sora
    en: "... Oops. ★"
    ko: "…라니★"
    ja: "…ですって★"
  event_overthehorizon_05_e_39:
    speaker: sora
    en: Hehe, guess I'm all out of excuses.
    ko: 후후, 변명할 여지가 없네요.
    ja: ふふ、これは言い逃れできなさそうですね～
  event_overthehorizon_05_e_40:
    speaker: sora
    en: Looks like you've got some pretty damning evidence...
    ko: 이렇게나 확실한 걸 들고 계시다니….
    ja: これだけの証拠を握られてしまった以上…
  event_overthehorizon_05_e_41:
    speaker: sora
    en: You leave me with no choice. ★
    ko: 어쩔 수 없네요★
    ja: 仕方ない★
  event_overthehorizon_05_e_42:
    speaker: sora
    en: It's time to silence you.
    ko: 입막음해 버려야겠다.
    ja: 口封じしかありませんね。
  event_overthehorizon_05_e_43:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_05_e_44:
    speaker: sora
    en: Just kidding, hehe. ♡
    ko: "~는 농담이고요♡"
    ja: "…なんちゃって。冗談ですよ♡"
  event_overthehorizon_05_e_45:
    speaker: sora
    en: Hmm, what's the best way to handle this? ★
    ko: 어떻게 하는 게 좋으려나~★
    ja: どうしよっかな～★
  event_overthehorizon_05_e_46:
    speaker: sora
    en: If I show you something cool,
    ko: 재미있는 걸 보여주는 대신에,
    ja: 面白いものを見せてあげるので…
  event_overthehorizon_05_e_47:
    speaker: sora
    en: will you keep this all a secret then?
    ko: 비밀로 해주실 수 있을까요?
    ja: 黙っててもらえませんか？
  event_overthehorizon_05_e_48:
    speaker: "<Self>"
    en: Are you trying to cut a deal with me?
    ko: 거래하자는 거야?
    ja: 取り引きのつもりか？
  event_overthehorizon_05_e_49:
    speaker: sora
    en: That's right, I am. ♡
    ko: 네♡ 거래해요.
    ja: はい♡取り引きです。
  event_overthehorizon_05_e_50:
    speaker: sora
    en: I can't let the world know my secret. Not yet.
    ko: 제가 아직은 이 비밀을 세상에 공개할 수 없는 상황이라서요★
    ja: まだバレるわけにはいかないので★
  event_overthehorizon_05_e_51:
    speaker: "<Self>"
    en: And why is that?
    ko: 그 이유가 뭔데?
    ja: なぜだ？
  event_overthehorizon_05_e_52:
    speaker: sora
    en: Hmm?
    ko: 네?
    ja: はい？
  event_overthehorizon_05_e_53:
    speaker: "<Self>"
    en: Why can't you let the world know what you're doing?
    ko: 세상에 말할 수 없는 이유가 뭔지.
    ja: まだ、とは？
  event_overthehorizon_05_e_54:
    speaker: "<Self>"
    en: Tell me why you're smuggling,
    ko: 왜 밀수를 하는 건지 말해줘.
    ja: なぜこんなことをしているのか聞かせてくれ
  event_overthehorizon_05_e_55:
    speaker: "<Self>"
    en: and then I'll think about whether or not I'll take the deal.
    ko: 그러면 거래를 받아들일지 말지, 생각해 볼게.
    ja: |-
      取り引きを飲むかどうかは
      それを聞いてからだ
  event_overthehorizon_05_e_56:
    speaker: sora
    en: Is the reason so important?
    ko: 그 이유가 중요한가요?
    ja: なんでそんなこと気にするんですか？
  event_overthehorizon_05_e_57:
    speaker: sora
    en: After all, it's easy to ignore just another sob story from a heartless smuggler.
    ko: "악덕 밀수범의 사정 같은 건 그냥~ \n무시해도 되는 것 아니었나요?"
    ja: |-
      ワルい奴の事情なんて～
      どうでもいいじゃないですか。
  event_overthehorizon_05_e_58:
    speaker: "<Self>"
    en: It's important to me.
    ko: 나에겐 중요해.
    ja: 私には重要だ
  event_overthehorizon_05_e_59:
    speaker: "<Self>"
    en: It's why I followed you all this way.
    ko: 그 이유를 알기 위해, 계속 따라다닌 거니까.
    ja: そうでなければわざわざ尾行などしない
  event_overthehorizon_05_e_60:
    speaker: sora
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  event_overthehorizon_05_e_61:
    speaker: sora
    en: Hehe. I see.
    ko: "…후후, 그렇군요."
    ja: "…ふふ、そうですか。"
  event_overthehorizon_05_e_62:
    speaker: sora
    en: I wasn't expecting this reply out of you...
    ko: 이런 대답은 생각 못 했는데….
    ja: まさか、そんなことを言われるなんて…
  event_overthehorizon_05_e_63:
    speaker: "<Self>"
    en: Are you going to tell me or not?
    ko: "…말해줄 수 있어?"
    ja: "…話してくれるか？"
  event_overthehorizon_05_e_64:
    speaker: sora
    en: Hmm...
    ko: 음~
    ja: う～ん。
  event_overthehorizon_05_e_65:
    speaker: "<Monologue>"
    en: Sora bends down and leans in close.
    ko: 소라가 몸을 숙여 가까이 다가왔다.
    ja: ソラが身をかがめ、近づいてきた
  event_overthehorizon_05_e_66:
    speaker: sora
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  event_overthehorizon_05_e_67:
    speaker: sora
    en: Fine. ♡
    ko: 좋아요♡
    ja: 分かりました♡
  event_overthehorizon_05_e_68:
    speaker: "<Narration>"
    en: "*Smooch* ♡"
    ko: 쪽-♡
    ja: チュッ♡
  event_overthehorizon_05_e_69:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_05_e_70:
    speaker: "<Monologue>"
    en: Sora straightens up.
    ko: 소라가 몸을 일으켰다.
    ja: そして体を伸ばすと…
  event_overthehorizon_05_e_71:
    speaker: sora
    en: It's a deal then. ♥
    ko: 그렇게 하기로 해요♥
    ja: お話します♥
  event_overthehorizon_05_e_72:
    speaker: sora
    en: Now then. ♥
    ko: 자~♥
    ja: さ～てと♥
  event_overthehorizon_05_e_73:
    speaker: "<Monologue>"
    en: Sora reaches out her hand.
    ko: 그리고 손을 뻗어왔다.
    ja: こちらに手を差し出した
  event_overthehorizon_05_e_74:
    speaker: sora
    en: Let me help you up.
    ko: 잡고 일어나세요.
    ja: じゃあ、立ってください。
  event_overthehorizon_05_e_75:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…그래."
    ja: "…ああ"
  event_overthehorizon_05_e_76:
    speaker: "<Monologue>"
    en: I take her hand and stand up.
    ko: 그 손을 잡고 일어났다.
    ja: ソラの手をつかみ、立ち上がった
  event_overthehorizon_05_e_77:
    speaker: sora
    en: Shall we get going?
    ko: 그럼 가시겠어요?
    ja: さっそく、行きましょうか？
  event_overthehorizon_05_e_78:
    speaker: "<Self>"
    en: Go? Where?
    ko: 간다고? 어딜?
    ja: 行くとは、どこへ？
  event_overthehorizon_05_e_79:
    speaker: sora
    en: To my secret hideout. ♥
    ko: 제 비밀 아지트로요♥
    ja: 秘密のアジトです♥
  event_overthehorizon_05_e_80:
    speaker: sora
    en: I'll show you everything
    ko: 캡틴이 궁금해하셨던 전부를,
    ja: キャプテンが知りたがってたことぜ～んぶ…
  event_overthehorizon_05_e_81:
    speaker: sora
    en: that you've been so curious about.
    ko: 직접 보여드릴게요.
    ja: お見せしますね。
event_overthehorizon_06_s:
  event_overthehorizon_06_s_1:
    speaker: "<Monologue>"
    en: Sora confidently bobs and weaves her way through the alleyways of the Outer
      Rim,
    ko: 다시 아우터 림의 골목을 망설이지 않고 걷던 소라가,
    ja: |-
      ソラが再び、アウターリムの路地を
      迷いなく歩き始めた
  event_overthehorizon_06_s_2:
    speaker: "<Monologue>"
    en: We stop in front of an old, worn-down building.
    ko: 어떤 낡은 건물 앞에 멈춰 섰다.
    ja: その足が古びた建物の前で止まった
  event_overthehorizon_06_s_3:
    speaker: "<Self>"
    en: This is your hideout?
    ko: 여기가… 아지트?
    ja: ここが…アジトか？
  event_overthehorizon_06_s_4:
    speaker: sora
    en: Oh heavens no. ★
    ko: 아니요~★
    ja: ブッブ～★
  event_overthehorizon_06_s_5:
    speaker: sora
    en: This is just one of the entrances.
    ko: 여긴 아지트로 가기 위한 입구 중 하나에요.
    ja: 入口の1つってとこですね。
  event_overthehorizon_06_s_6:
    speaker: "<Self>"
    en: An entrance?
    ko: 입구?
    ja: 入口？
  event_overthehorizon_06_s_7:
    speaker: sora
    en: That's right. This is just one of several entrances. ★
    ko: 네. 수많은 입구 중 하나죠★
    ja: はい。たくさんあるうちの1つです★
  event_overthehorizon_06_s_8:
    speaker: sora
    en: Would you like to come in?
    ko: 안쪽으로 들어오시겠어요?
    ja: 中へどうぞ～
  event_overthehorizon_06_s_9:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…그래."
    ja: "…ああ"
  event_overthehorizon_06_s_10:
    speaker: "<Monologue>"
    en: Following Sora's lead, I step into the building.
    ko: 소라의 안내에 따라 건물 안으로 들어섰다.
    ja: ソラに促され、建物の中へ入った
  event_overthehorizon_06_s_11:
    speaker: "<Monologue>"
    en: Shortly afterwards...
    ko: 그러자….
    ja: そこには…
  event_overthehorizon_06_s_12:
    speaker: sora
    en: Ta-da! ♥
    ko: 짜잔~♥
    ja: ジャジャーン♥
  event_overthehorizon_06_s_13:
    speaker: "<Monologue>"
    en: A surface elevator comes into view.
    ko: 지상용 엘리베이터가 보였다.
    ja: 地上との往来に使うエレベーターがあった
  event_overthehorizon_06_s_14:
    speaker: "<Self>"
    en: Isn't this...?
    ko: 이건…!
    ja: これは…！
  event_overthehorizon_06_s_15:
    speaker: sora
    en: As you might already know,
    ko: 아실 수도 있겠지만,
    ja: ご存じかもしれませんけど…
  event_overthehorizon_06_s_16:
    speaker: sora
    en: there are actually a surprising number of abandoned surface elevators left
      in the Outer Rim. ♥
    ko: "아우터 림에는 은근히 버려져 있는 \n지상 엘리베이터가 많이 남아 있어서요♥"
    ja: |-
      この辺りって放棄された
      地上行きエレベーターが結構残ってるんです♥
  event_overthehorizon_06_s_17:
    speaker: sora
    en: This is one of them.
    ko: 이것도 그것 중 하나에요.
    ja: これもそのうちの1つですね。
  event_overthehorizon_06_s_18:
    speaker: sora
    en: No one maintains it, or really gives it a second thought,
    ko: 아무도 관리하고 있지 않고,
    ja: 誰も管理してなくて、
  event_overthehorizon_06_s_19:
    speaker: sora
    en: so it's free for anyone to use. ☆
    ko: 아무도 신경 쓰지 않아서 자유롭지만☆
    ja: 誰も見てないから、使うのは自由☆
  event_overthehorizon_06_s_20:
    speaker: sora
    en: The only trade-off is that you put your life in on the line whenever you ride
      it. ★
    ko: 대신 목숨을 걸고 타야만 하는★
    ja: その代わり、乗る時は命懸け★
  event_overthehorizon_06_s_21:
    speaker: sora
    en: This is the elevator that the Collectors use.
    ko: "…콜렉터들의 엘리베이터."
    ja: |-
      …そういうコレクター御用達の
      エレベーターです。
  event_overthehorizon_06_s_22:
    speaker: "<Self>"
    en: The Collectors...?
    ko: 콜렉터들…?
    ja: コレクター…？
  event_overthehorizon_06_s_23:
    speaker: sora
    en: Yup. ★
    ko: 네★
    ja: はい★
  event_overthehorizon_06_s_24:
    speaker: sora
    en: Many Collectors load themselves into this massive, rusty iron box,
    ko: 수많은 콜렉터가 이 거대한 철의 상자에 몸을 싣고,
    ja: |-
      たくさんの人たちが
      この大きな鉄の箱に乗り込んで…
  event_overthehorizon_06_s_25:
    speaker: sora
    en: risking their lives as they ride it up to the surface, all in hopes of making
      a living.
    ko: 살아남기 위한 수단을 찾기 위해 목숨을 걸고 지상에 올라가죠.
    ja: 生きるために命がけで地上に向かうんです。
  event_overthehorizon_06_s_26:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_06_s_27:
    speaker: sora
    en: Of all the elevators around, this one is said to be the sturdiest, and therefore
      the safest. ★
    ko: 그 중, 이곳이 가장 튼튼하고 안전하다고 알려진 곳이랍니다~★
    ja: |-
      その中ではこれが一番
      丈夫で安全って評判で～す★
  event_overthehorizon_06_s_28:
    speaker: sora
    en: On that note.
    ko: 그런 의미에서.
    ja: そういうわけなので。
  event_overthehorizon_06_s_29:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삑-
    ja: ピッ――
  event_overthehorizon_06_s_30:
    speaker: "<Monologue>"
    en: Sora presses the elevator button.
    ko: 소라가 엘리베이터의 버튼을 눌렀다.
    ja: ソラがエレベーターの操作盤に触れた
  event_overthehorizon_06_s_31:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 띵-
    ja: チーン…
  event_overthehorizon_06_s_32:
    speaker: sora
    en: Why don't we take a ride up too?
    ko: 우리도 타고 올라가 볼까요?
    ja: 行きましょうか？
  event_overthehorizon_06_s_33:
    speaker: sora
    en: You don't need to worry about getting into an accident. ★
    ko: 아, 사고 날 걱정은 안 하셔도 돼요★
    ja: あ、事故の心配なら大丈夫です★
  event_overthehorizon_06_s_34:
    speaker: sora
    en: We've already done multiple safety checks on this one.
    ko: 여긴 저희가 몇 번이고 안전 체크를 완료한 거니까요.
    ja: あらかじめ安全チェックはしてありますから。
  event_overthehorizon_06_s_35:
    speaker: sora
    en: And besides, even if there was a malfunction,
    ko: 그리고 사고가 일어난다고 해도,
    ja: それに、もし事故が起きても…
  event_overthehorizon_06_s_36:
    speaker: sora
    en: I'd do everything to make sure you're safe. ★
    ko: 무슨 일이 있어도 반드시 지켜드릴게요★
    ja: |-
      キャプテンのことは何があっても
      必ず守りますから★
  event_overthehorizon_06_s_37:
    speaker: "<Self>"
    en: All right.
    ko: 그래.
    ja: 信じるぞ
  event_overthehorizon_06_s_38:
    speaker: "<Narration>"
    en: "*Vrrm*"
    ko: 지잉-
    ja: ウィーン――
  event_overthehorizon_06_s_39:
    speaker: "<Monologue>"
    en: The elevator door opens.
    ko: 엘리베이터의 문이 열렸다.
    ja: エレベーターのドアが開いた
  event_overthehorizon_06_s_40:
    speaker: "<Self>"
    en: Hop in.
    ko: 들어가자.
    ja: 乗ろう
  event_overthehorizon_06_s_41:
    speaker: "<Monologue>"
    en: I get into the elevator with Sora.
    ko: 소라와 함께 엘리베이터에 올라탔다.
    ja: ソラとエレベーターに乗り込んだ
  event_overthehorizon_06_s_42:
    speaker: sora
    en: Okay then. ♡
    ko: 자아~ 그럼♡
    ja: ではでは～♡
  event_overthehorizon_06_s_43:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삑-
    ja: ピッ――
  event_overthehorizon_06_s_44:
    speaker: "<Narration>"
    en: "*Clunk*"
    ko: 덜컹-
    ja: ガタン…
  event_overthehorizon_06_s_45:
    speaker: "<Monologue>"
    en: The elevator door closes.
    ko: 엘리베이터의 문이 닫혔다.
    ja: エレベーターのドアが閉じた
  event_overthehorizon_06_s_46:
    speaker: sora
    en: Off we go. ★
    ko: 출발합니다~★
    ja: 出発いたしま～す★
  event_overthehorizon_06_s_47:
    speaker: "<Narration>"
    en: "*Whirrr*"
    ko: 위잉-
    ja: ブーン…
  event_overthehorizon_06_s_48:
    speaker: "<Monologue>"
    en: The elevator begins to ascend toward the surface.
    ko: 엘리베이터가 지상을 향해 올라가기 시작했다.
    ja: エレベーターが上昇していく
  event_overthehorizon_06_s_49:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_06_s_50:
    speaker: sora
    en: Your face tells me that you have a lot of questions. ♡
    ko: 음~ 뭔가 물어보고 싶은 게 많은 얼굴이네요♡
    ja: あれあれ～？何だか色々聞きたそうな顔ですね♡
  event_overthehorizon_06_s_51:
    speaker: sora
    en: Go ahead and ask.
    ko: 물어보셔도 돼요.
    ja: 何でも聞いちゃってください。
  event_overthehorizon_06_s_52:
    speaker: sora
    en: A deal's a deal. ★
    ko: 아까 말했듯~★
    ja: さっき言った通りです★
  event_overthehorizon_06_s_53:
    speaker: sora
    en: I'll tell you everything you want to know,
    ko: 거래를 하기로 한 사이니,
    ja: これは取り引きですから。
  event_overthehorizon_06_s_54:
    speaker: sora
    en: except for information about the hideout we're going to. ♥
    ko: 곧 도착할 아지트에 관한 것만 제외하곤 전부 말씀드릴게요♥
    ja: |-
      アジトのことはどうせもうすぐ着きますし、
      それ以外なら何でもお話しますよ♥
  event_overthehorizon_06_s_55:
    speaker: "<Self>"
    en: I'm surprised how familiar you seem to be with the Outer Rim.
    ko: 아우터 림에 대해 너무 잘 알고 있는 것 같아서 놀랐어.
    ja: アウターリムに詳しいようで驚いた
  event_overthehorizon_06_s_56:
    speaker: sora
    en: Hehe, well... ★
    ko: "아하~ \n그건…★"
    ja: |-
      あ～
      それですか…★
  event_overthehorizon_06_s_57:
    speaker: sora
    en: That's because I'm from the Outer Rim. ★
    ko: 제가 아우터 림 출신이니까요★
    ja: 私、アウターリムの出身ですから★
  event_overthehorizon_06_s_58:
    speaker: sora
    en: Before I was a Nikke,
    ko: 니케 바디를 받기 전에는,
    ja: ニケのボディになる前は…
  event_overthehorizon_06_s_59:
    speaker: sora
    en: I, like many other people in the Outer Rim, had no idea where I was born.
    ko: "아우터 림의 대다수 사람이 그렇듯 \n태어난 건 어디서 태어났는지 모르지만,"
    ja: |-
      アウターリムのほとんどの人と同じで、
      生まれた場所も分かりません。
  event_overthehorizon_06_s_60:
    speaker: sora
    en: But I did grow up in the Outer Rim. ★
    ko: 자라기를 아우터 림에서 자랐어요~★
    ja: ずっとアウターリムで育ちました★
  event_overthehorizon_06_s_61:
    speaker: sora
    en: That's why I know it so well.
    ko: 그래서 잘 알고 있는 거예요.
    ja: だから、よく知ってるんです。
  event_overthehorizon_06_s_62:
    speaker: sora
    en: I know the Outer Rim like the back of my hand,
    ko: 아우터 림 어디에 뭐가 있는지☆
    ja: アウターリムのどこに何があるか、とか☆
  event_overthehorizon_06_s_63:
    speaker: sora
    en: and I'm familiar with all its hidden secrets. ★
    ko: 어떤 곳에 가면 뭐가 숨겨져 있는지★
    ja: どこに何が隠されてる、とか★
  event_overthehorizon_06_s_64:
    speaker: "<Self>"
    en: "... I see."
    ko: "…그랬구나."
    ja: "…そうだったのか"
  event_overthehorizon_06_s_65:
    speaker: sora
    en: Anything else you'd like to ask?
    ko: 또 물어보고 싶은 건요?
    ja: 他に聞きたいことはありますか？
  event_overthehorizon_06_s_66:
    speaker: "<Self>"
    en: When did you start doing this?
    ko: 언제부터 이런 일을 시작했던 거야?
    ja: この商売はいつから？
  event_overthehorizon_06_s_67:
    speaker: sora
    en: You mean the smuggling?
    ko: 밀수를 말씀하시는 거죠?
    ja: 密輸のことですよね？
  event_overthehorizon_06_s_68:
    speaker: "<Monologue>"
    en: I nod.
    ko: 고개를 끄덕였다.
    ja: 首を縦に振った
  event_overthehorizon_06_s_69:
    speaker: sora
    en: Quite a while ago. ★
    ko: 꽤 오래됐어요★
    ja: 結構長くなりますね★
  event_overthehorizon_06_s_70:
    speaker: sora
    en: Umm... Maybe a year or two after I joined the squad. ★
    ko: "음~★ \n스쿼드에 들어오고 나서, 한 1~2년 정도 지났을 때쯤?"
    ja: |-
      ん～★
      部隊に入って、1～2年ぐらい経ってたかな？
  event_overthehorizon_06_s_71:
    speaker: "<Self>"
    en: Did you join Over the Horizon specifically for that reason?
    ko: 그러기 위해 오버 더 호라이즌 스쿼드에 들어갔던 거야?
    ja: そのために今の部隊に入ったのか？
  event_overthehorizon_06_s_72:
    speaker: sora
    en: I know this may be hard to believe, but no.
    ko: 후후, 믿어주실지 모르겠지만 그건 정말 아니에요.
    ja: |-
      ふふ…信じてもらえるかどうか
      知りませんけど、そうじゃないです。
  event_overthehorizon_06_s_73:
    speaker: sora
    en: Ever since I was little, I was fascinated by the sky. ☆
    ko: 그냥, 아주 어렸을 때부터 하늘이 너무 좋았거든요☆
    ja: ただ、ちっちゃい頃から空が大好きだったので☆
  event_overthehorizon_06_s_74:
    speaker: sora
    en: That's why I joined Over the Horizon.
    ko: 그래서 이 스쿼드에 들어온 것 같아요.
    ja: それで今の部隊にいるんだと思います。
  event_overthehorizon_06_s_75:
    speaker: "<Self>"
    en: The sky?
    ko: 하늘?
    ja: 空？
  event_overthehorizon_06_s_76:
    speaker: sora
    en: Yes. ♡
    ko: 네♡
    ja: はい♡
  event_overthehorizon_06_s_77:
    speaker: sora
    en: Not the Dome of Eternity, mind you. ☆
    ko: 이터널 스카이가 아니라…☆
    ja: エターナルスカイじゃないですよ☆
  event_overthehorizon_06_s_78:
    speaker: sora
    en: The real sky.
    ko: 진짜 하늘.
    ja: 本物の空です。
  event_overthehorizon_06_s_79:
    speaker: sora
    en: I've always found it so beautiful.
    ko: 예전부터 그게 너무 아름답다고 생각했거든요.
    ja: 昔から、すごくキレイだなって。
  event_overthehorizon_06_s_80:
    speaker: "<Self>"
    en: The real sky...
    ko: 진짜… 하늘.
    ja: 本物の…空か
  event_overthehorizon_06_s_81:
    speaker: sora
    en: I get it. It's hard to believe a word that comes out of a criminal's mouth,
      right?
    ko: 역시 범죄자의 말은 믿기 어려우시죠?
    ja: 悪い人の言うことなんて信じませんよね？
  event_overthehorizon_06_s_82:
    speaker: "<Self>"
    en: "... No, I believe you."
    ko: "…아니, 믿어."
    ja: "…いや、信じるさ"
  event_overthehorizon_06_s_83:
    speaker: sora
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_06_s_84:
    speaker: sora
    en: Haha. ♡
    ko: 하하♡
    ja: ふふ♡
  event_overthehorizon_06_s_85:
    speaker: sora
    en: I really like this side of you, Captain. ♡
    ko: 전 캡틴의 이런 모습이 참 좋더라~♡
    ja: そういうところがイイんですよね～♡
  event_overthehorizon_06_s_86:
    speaker: "<Narration>"
    en: "*Ding*"
    ko: 띵-
    ja: チーン…
  event_overthehorizon_06_s_87:
    speaker: sora
    en: Here we are. ★
    ko: 아, 도착했나 봐요★
    ja: あ、着いたみたいです★
  event_overthehorizon_06_s_88:
    speaker: sora
    en: Time to get off.
    ko: 이제 내려볼까요?
    ja: 行きましょうか？
  event_overthehorizon_06_s_89:
    speaker: sora
    en: Ta-da! ★
    ko: 짜잔~★
    ja: ジャジャーン★
  event_overthehorizon_06_s_90:
    speaker: sora
    en: Allow me to introduce you to my hideout. ★
    ko: 저희의 아지트를 소개합니다~★
    ja: こちらが私のアジトでございま～す★
  event_overthehorizon_06_s_91:
    speaker: "<Monologue>"
    en: I look towards the direction Sora is pointing at.
    ko: 소라가 가리킨 방향을 바라보았다.
    ja: ソラが示すものを見た
  event_overthehorizon_06_s_92:
    speaker: "<Monologue>"
    en: In between the crumbling buildings,
    ko: 무너져가는 건물들 사이에,
    ja: 崩れかけの建物だ
  event_overthehorizon_06_s_93:
    speaker: "<Monologue>"
    en: I see a mountain of piled up junk and discarded items.
    ko: 온갖 물건들이 가득 쌓여있는 쓰레기 산의 모습이 보였다.
    ja: |-
      そのすき間を埋めるように
      様々なものが積み上がったゴミの山が見える
  event_overthehorizon_06_s_94:
    speaker: "<Self>"
    en: This is... your hideout?
    ko: 여기가… 아지트?
    ja: ここが…？
event_overthehorizon_06_e:
  event_overthehorizon_06_e_1:
    speaker: sora
    en: Haha, don't be so shocked. Here, come closer.
    ko: 후후, 그렇게 놀라지 말고, 이쪽으로 와보실래요?
    ja: |-
      ふふ、そんなに驚かないでください。
      こっちに来てもらえますか？
  event_overthehorizon_06_e_2:
    speaker: sora
    en: It may look like a huge pile of trash, but the real treasures are inside.
      ♥
    ko: 쓰레기가 쌓여 있는 것처럼 보여도, 안에 진짜가 있으니까요♥
    ja: |-
      見た目はただのゴミの山ですけど、
      中にアタリがあるんです♥
  event_overthehorizon_06_e_3:
    speaker: "<Self>"
    en: Real treasures?
    ko: 진짜?
    ja: 本当に？
  event_overthehorizon_06_e_4:
    speaker: sora
    en: Right this way! ♥
    ko: 자아~ 이쪽으로~♥
    ja: は～いこちらで～す♥
  event_overthehorizon_06_e_5:
    speaker: "<Monologue>"
    en: Sora takes my hand and leads me deeper into the junk pile.
    ko: 소라가 내 손을 잡아끌고, 쓰레기 산 안쪽으로 향했다.
    ja: ソラに手を引かれ、ゴミ山の中へと向かった
  event_overthehorizon_06_e_6:
    speaker: "<Monologue>"
    en: Suddenly...
    ko: 그러자….
    ja: やがて…
  event_overthehorizon_06_e_7:
    speaker: "<Self>"
    en: Huh? Is that...?
    ko: |-
      ??
      저건….
    ja: |-
      ？？
      あれは…
  event_overthehorizon_06_e_8:
    speaker: "<Monologue>"
    en: Buried deep in the mountain of trash, I see a small one-story building.
    ko: 쓰레기 산속에 파묻힌 단층의 작은 건물이 보였다.
    ja: ゴミにまぎれた小さな平屋が見えた
  event_overthehorizon_06_e_9:
    speaker: sora
    en: Let's head in.
    ko: 들어가 볼까요?
    ja: 入りましょうか。
  event_overthehorizon_06_e_10:
    speaker: "<Monologue>"
    en: I follow Sora into the small building surrounded by a mountain of trash.
    ko: 소라를 따라, 쓰레기 산 안에 있는 작은 건물 안으로 들어섰다.
    ja: ソラと中へ入ると…
  event_overthehorizon_06_e_11:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_overthehorizon_06_e_12:
    speaker: "<Monologue>"
    en: The walls are plastered from top to bottom
    ko: 벽면을 가득 메우고 있는 수많은 비행기 사진과,
    ja: |-
      壁一面に貼られた数えきれないほどの
      航空機の写真
  event_overthehorizon_06_e_13:
    speaker: "<Monologue>"
    en: with photos of planes and of the sky.
    ko: 하늘 사진.
    ja: 空の写真
  event_overthehorizon_06_e_14:
    speaker: "<Monologue>"
    en: One particular photo portrays a massive aircraft.
    ko: "[거대한 비행선]의 사진과,"
    ja: それから「空に浮かぶ巨大な軍艦」の写真と…
  event_overthehorizon_06_e_15:
    speaker: "<Monologue>"
    en: Scattered amongst the photos are dozens of notes left by someone.
    ko: 누군가가 남긴, 수많은 작은 메모들이 보였다.
    ja: |-
      何かが書き込まれた大量の小さなメモ用紙が
      目に入った
  event_overthehorizon_06_e_16:
    speaker: "<Self>"
    en: What aircraft is this?
    ko: 저 비행선은… 뭐야?
    ja: この艦は…何だ？
  event_overthehorizon_06_e_17:
    speaker: sora
    en: That's the Wings of Victory. ★
    ko: 저게 [승리의 날개 호]에요★
    ja: それは「勝利の翼号」です★
  event_overthehorizon_06_e_18:
    speaker: "<Self>"
    en: When you say the Wings of Victory, do you mean...
    ko: 승리의 날개 호라면….
    ja: 勝利の翼号というのは…
  event_overthehorizon_06_e_19:
    speaker: sora
    en: Yes. The aircraft that was used a long time ago during the 1st Rapture Invasion.
    ko: 아주 오래전, 제1차 랩쳐 침공 당시 사용했다는 비행선이자.
    ja: |-
      はるか昔、第一次ラプチャー侵攻の時代に
      使用されていたという飛行戦艦です。
  event_overthehorizon_06_e_20:
    speaker: sora
    en: The same vessel that our squad is attempting to find.
    ko: 저희 스쿼드가 궁극적으로 찾아서,
    ja: 私たちの部隊にとって究極の目標であり…
  event_overthehorizon_06_e_21:
    speaker: sora
    en: It's a very precious thing,
    ko: 인류를 위해 다시 하늘 위로 날아 올려야 하는.
    ja: 人類のために再び空へ上がるべき…
  event_overthehorizon_06_e_22:
    speaker: sora
    en: one that must take to the skies again, for the sake of humanity.
    ko: 아주아주 [귀한 것]이죠.
    ja: とても、とても貴重な「人類の財産」です。
  event_overthehorizon_06_e_23:
    speaker: "<Self>"
    en: I see...
    ko: 귀한 것….
    ja: 貴重な人類の財産…
  event_overthehorizon_06_e_24:
    speaker: sora
    en: I'm sure Cielo covered this during your training. ★
    ko: 교육 시간에 시엘로에게 들어서 아시겠지만★
    ja: 教育の時にシエロから聞いたと思いますが★
  event_overthehorizon_06_e_25:
    speaker: sora
    en: But because of Storm Bringer, our squad has been grounded for a long time.
    ko: 저희 스쿼드는 스톰 브링어 때문에 오랫동안 날 수 없다는 이유로,
    ja: |-
      ストームブリンガーがいるせいで、
      航空機は長時間空を飛べません。
  event_overthehorizon_06_e_26:
    speaker: sora
    en: Since no one can even attempt to look for the Wings of Victory anymore,
    ko: 이것을 찾을 생각은커녕,
    ja: 宝さがしなんて夢のまた夢です。
  event_overthehorizon_06_e_27:
    speaker: sora
    en: all we can do is keep supporting the resource-gathering squad.
    ko: 자원 채집 부대를 지원하는 일만 계속하고 있어요☆
    ja: |-
      今は資源採集部隊のサポートという仕事で
      なんとか続けてる状態ですね☆
  event_overthehorizon_06_e_28:
    speaker: sora
    en: Of course, if you ask if that kind of work is meaningless...
    ko: 물론, 그 일이 아무 의미 없는 일이냐? 라고 물으면야….
    ja: |-
      もちろん、今の仕事では
      役に立ってないのかと聞かれたら…
  event_overthehorizon_06_e_29:
    speaker: sora
    en: Well, I wouldn't say it is meaningless. ☆
    ko: 뭐, 그렇진 않다고 말할 수 있겠지만☆
    ja: いちおう、そんなことはないですけどね☆
  event_overthehorizon_06_e_30:
    speaker: sora
    en: But, for the sake of our true goal, we can't just focus on one thing. ★
    ko: 저희의 궁극적인 목표를 위해선, 그 일에만 안주할 수는 없어서요★
    ja: |-
      でも、私たちの究極の目標を達成するためには、
      現状に満足するわけにはいきません★
  event_overthehorizon_06_e_31:
    speaker: "<Self>"
    en: We?
    ko: 저희?
    ja: 私たち？
  event_overthehorizon_06_e_32:
    speaker: sora
    en: Yes. We...
    ko: 네. 저희….
    ja: そうですよ。私たち…
  event_overthehorizon_06_e_33:
    speaker: sora
    en: The Collectors.
    ko: 콜렉터들이요.
    ja: つまり、コレクターです。
  event_overthehorizon_06_e_34:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_overthehorizon_06_e_35:
    speaker: sora
    en: You see these messages?
    ko: 이 메시지들 보이시나요?
    ja: 読んでみてもらえます？
  event_overthehorizon_06_e_36:
    speaker: "<Monologue>"
    en: Sora points to the numerous notes posted beside the photo of the Wings of
      Victory.
    ko: 소라가 [거대한 비행선] 사진의 옆에 달린 수많은 메모들을 가리켰다.
    ja: |-
      ソラが「空飛ぶ軍艦」の写真の脇にある
      無数のメモを指した
  event_overthehorizon_06_e_37:
    speaker: "<Narration>"
    en: '"E. 211.05 Desert. Traces found."'
    ko: "[E 211.05 사막. 흔적 발견.]"
    ja: "「E211.05砂漠。痕跡発見」"
  event_overthehorizon_06_e_38:
    speaker: "<Narration>"
    en: '"Checked coordinates. No traces of the aircraft found. Only ran into Raptures."'
    ko: "[위 좌표 가봄. 애초에 비행기 흔적도 없더만, 랩쳐만 만났네.]"
    ja: |-
      「例の座標に到達、航空機の残骸さえなし、
      ラプチャーのみ遭遇」
  event_overthehorizon_06_e_39:
    speaker: "<Narration>"
    en: '"W 6.053 City. Traces found."'
    ko: "[W 6.053 도시. 흔적 발견.]"
    ja: "「W6.053都市。痕跡発見」"
  event_overthehorizon_06_e_40:
    speaker: "<Narration>"
    en: '"Learn to tell the difference between a car and an aircraft, you morons."'
    ko: "[자동차랑 비행기랑 제발 구분 좀 하자. 멍청한 XX.]"
    ja: |-
      「車と飛行機の区別くらいつけろ、
      このバカ」
  event_overthehorizon_06_e_41:
    speaker: "<Narration>"
    en: '"S 77.221 Forest. Traces? Something that looks like a broken-off piece of
      a wing."'
    ko: "[S 77.221 숲. 흔적? 뭔가 부서진 날개 파편이 있는 것 같아.]"
    ja: |-
      「S77.221森。痕跡か？
      壊れた翼の断片らしきもの」
  event_overthehorizon_06_e_42:
    speaker: "<Narration>"
    en: '"Seems like it could be from a different aircraft. Not sure."'
    ko: "[다른 비행기인 거 같은데. 잘 모르겠어.]"
    ja: "「無関係の航空機のようだ。詳しくは不明」"
  event_overthehorizon_06_e_43:
    speaker: "<Narration>"
    en: '"There are too many Raptures nearby. Let''s head there together next time."'
    ko: "[근처에 랩쳐가 너무 많으니까, 다음에 다 같이 가보자.]"
    ja: |-
      「周辺にラプチャーが多すぎる。
      調べるにも頭数が欲しい」
  event_overthehorizon_06_e_44:
    speaker: "<Self>"
    en: Hang on, are you saying the aircraft they're looking for is...
    ko: 여기서 찾는 비행기라는 게 설마…
    ja: 何かを探しているようだが、まさか…
  event_overthehorizon_06_e_45:
    speaker: sora
    en: That's right. ♡
    ko: 맞아요♡
    ja: ピンポ～ン♡
  event_overthehorizon_06_e_46:
    speaker: sora
    en: These are all records of our past searches for the Wings of Victory.
    ko: 전부 승리의 날개 호를 찾아다닌 기록이에요.
    ja: 全部、勝利の翼号の探索メモです。
  event_overthehorizon_06_e_47:
    speaker: "<Self>"
    en: I didn't expect the Collectors to be searching for such a thing.
    ko: 콜렉터들이 그걸 찾아다니고 있다니…!
    ja: |-
      コレクターたちが
      そんなものを探していたとは…！
  event_overthehorizon_06_e_48:
    speaker: sora
    en: |-
      We are,
      and we have been for quite some time. ☆
    ko: 찾아다닌 지는 좀 됐어요☆
    ja: 結構昔からなんですよ☆
  event_overthehorizon_06_e_49:
    speaker: sora
    en: Hmm... ★
    ko: 음~★
    ja: う～ん★
  event_overthehorizon_06_e_50:
    speaker: sora
    en: Maybe a year or two after I joined the squad?
    ko: 스쿼드에 들어오고 나서, 한 1~2년 정도 지났을 때쯤?
    ja: 部隊に入って1～2年目ぐらいからかな？
  event_overthehorizon_06_e_51:
    speaker: "<Self>"
    en: Isn't that the same time you said you started smuggling?
    ko: 아까 분명 밀수를 시작했다고 했던 게, 그쯤이지 않았어?
    ja: 裏の仕事を始めた時期と重なるようだが…？
  event_overthehorizon_06_e_52:
    speaker: sora
    en: That's right. ♡
    ko: 그랬죠♡
    ja: そうですね♡
  event_overthehorizon_06_e_53:
    speaker: "<Self>"
    en: So, could it be that you were smuggling...?
    ko: 그럼 설마 밀수를 한 것도….
    ja: まさか、この仕事を始めたのも…
  event_overthehorizon_06_e_54:
    speaker: sora
    en: Can you turn around?
    ko: 뒤를 돌아보시겠어요?
    ja: 後ろ、見てもらえます？
  event_overthehorizon_06_e_55:
    speaker: "<Monologue>"
    en: At Sora's request, I turn around.
    ko: 소라의 말에 뒤를 돌아보았다.
    ja: ソラに言われて後ろを振り返った
  event_overthehorizon_06_e_56:
    speaker: "<Monologue>"
    en: In one corner of the room, a stack of crates catches my eye.
    ko: 방 한쪽에 쌓여있는 상자들이 보였다.
    ja: 部屋の片隅に箱が積まれている
  event_overthehorizon_06_e_57:
    speaker: "<Monologue>"
    en: One of the boxes is open, revealing medical supplies and blood-stained bandages
      inside.
    ko: 그리고 그 중 열려 있는 상자의 사이로 구급약과 피 묻은 붕대들이 보였다.
    ja: |-
      蓋のすき間がある箱から、
      救急用の薬と血のついた包帯がのぞいていた
  event_overthehorizon_06_e_58:
    speaker: "<Self>"
    en: Are those...
    ko: 이건….
    ja: あれは…
  event_overthehorizon_06_e_59:
    speaker: sora
    en: They're the supplies I smuggled in from the surface. ☆
    ko: 제가 몰래 밀반입한 물자들이에요☆
    ja: 私がこっそり運びだした荷物です☆
  event_overthehorizon_06_e_60:
    speaker: sora
    en: I just grabbed anything that looked useful,
    ko: 지상에서 쓸만해 보이는 것들을 모아온 건데,
    ja: 地上で使えそうなものを集めてたら…
  event_overthehorizon_06_e_61:
    speaker: sora
    en: and look, I've got quite a collection. ★
    ko: 벌써 저렇게나 쌓였네요★
    ja: いつの間にか溜まってました★
  event_overthehorizon_06_e_62:
    speaker: "<Self>"
    en: Is it all medical equipment?
    ko: "…전부 의료 도구인 거야?"
    ja: "…全部医療用品か？"
  event_overthehorizon_06_e_63:
    speaker: sora
    en: Medical equipment, food supplies,
    ko: 의료 도구도 있고, 식량도 있고★
    ja: それもありますけど、あとは食料とか★
  event_overthehorizon_06_e_64:
    speaker: sora
    en: and exploration tools, ☆
    ko: 탐험 도구들도 있고☆
    ja: 探検に必要な道具とか☆
  event_overthehorizon_06_e_65:
    speaker: sora
    en: and well, all sorts of other things too! ★
    ko: 뭐, 이것저것 많아요★
    ja: 他にも色々です★
  event_overthehorizon_06_e_66:
    speaker: "<Self>"
    en: If it's just stuff like this, it'd be better to get it properly as official
      support supplies rather than smuggling...
    ko: 이런 것 정도라면, 밀수가 아니라 차라리 정당하게 지원 물품을 받는 게…!
    ja: |-
      そんなものばかりなら、
      正式に支援を申請した方が…！
  event_overthehorizon_06_e_67:
    speaker: sora
    en: From who?
    ko: 누구에게요?
    ja: どこに頼むんですか？
  event_overthehorizon_06_e_68:
    speaker: sora
    en: The Central Government?
    ko: 중앙 정부요?
    ja: 中央政府？
  event_overthehorizon_06_e_69:
    speaker: sora
    en: Haha, you know that's not possible.
    ko: 후후, 그게 가능할 리 없다는 거 아시잖아요.
    ja: ふふ…聞いてもらえないって分かってますよね？
  event_overthehorizon_06_e_70:
    speaker: "<Self>"
    en: But surely, Ingrid could help you?
    ko: 잉그리드라면…!
    ja: それでもイングリッドなら…！
  event_overthehorizon_06_e_71:
    speaker: sora
    en: You're right. ★
    ko: 사장님…★
    ja: 社長ですか…★
  event_overthehorizon_06_e_72:
    speaker: sora
    en: The Boss definitely would've helped us behind the scenes. ★
    ko: "그렇죠★ \n사장님이라면… 분명 뒤에서라도 도와주실 수 있었을 거예요★"
    ja: |-
      そうですね★
      社長は…裏で助けようとしてくれる方です★
  event_overthehorizon_06_e_73:
    speaker: sora
    en: But our squad's already gotten plenty of help from her when it comes to searching
      for the Wings of Victory.
    ko: 하지만, 이미 저희 스쿼드가 승리의 날개 호를 찾겠다고 사장님의 도움을 받은 적이 있어서요.
    ja: |-
      実は、もう勝利の翼号の捜索がらみで、
      お願いしたことがあるんですよね。
  event_overthehorizon_06_e_74:
    speaker: sora
    en: She was the one who pushed the Central Government to let us do short aerial
      searches, just an hour each.
    ko: 한 시간씩 비행해서라도 찾게 해달라고 중앙 정부 측에 이야기했을 때,
    ja: |-
      1時間でいいから捜索の許可がほしいって、
      中央政府に頼みこんだ時…
  event_overthehorizon_06_e_75:
    speaker: sora
    en: She really went all out for us.
    ko: 사장님이 정말로 엄청 많은 힘을 써주셨거든요?
    ja: |-
      社長には本当にいろいろと
      力添えをいただいたんですよ？
  event_overthehorizon_06_e_76:
    speaker: sora
    en: But somehow, the Central Government flat-out rejected even that.
    ko: 그런데… 그때 이상하리만큼, 중앙 정부 측에서 그것을 거부했다고 해요.
    ja: |-
      でも…中央政府から異常なほどの
      拒絶を受けたらしいです。
  event_overthehorizon_06_e_77:
    speaker: sora
    en: They refused so strongly, not even the Boss could make them budge.
    ko: 더 이상 사장님이 손쓸 도리가 없을 만큼, 완강하게요.
    ja: |-
      社長でもそれ以上何もできないぐらい、
      ガッチガチに。
  event_overthehorizon_06_e_78:
    speaker: sora
    en: And after that, they started piling us with support missions,
    ko: 게다가… 그 일이 있고 나서, 저희에게 딴생각하지 말라는 듯,
    ja: |-
      おまけにその後…余計なことが
      できないようにって感じで
  event_overthehorizon_06_e_79:
    speaker: sora
    en: just to keep us from even thinking about aerial searches again. ★
    ko: 자원 채집 부대 지원 임무가 급격하게 늘어나지 뭐예요~★
    ja: |-
      資源採集部隊の仕事が
      思いっきり増やされました～★
  event_overthehorizon_06_e_80:
    speaker: "<Self>"
    en: "... They really went that far?"
    ko: "…그렇게까지 했다고?"
    ja: "…そこまでの拒否反応が？"
  event_overthehorizon_06_e_81:
    speaker: sora
    en: Yeah. ★ It's strange, isn't it?
    ko: 네★ 너무 이상하죠?
    ja: はい★怪しすぎますよね？
  event_overthehorizon_06_e_82:
    speaker: sora
    en: But come on, how could I possibly ask the Boss for even more help in a situation
      like this? ★
    ko: 이런 상황에서 어떻게 더 사장님께 손을 벌릴 수가 있겠어요★
    ja: そんなわけで、社長には頼めません★
  event_overthehorizon_06_e_83:
    speaker: sora
    en: And if something were to happen to her just because she tried to help us…
      I'd never be able to forgive myself.
    ko: |-
      저도 염치가 있지.
      사장님이 괜히 저희를 도와주시다 탈이라도 나면, 너무 죄송하잖아요.
    ja: |-
      私だってバカじゃないですから。
      社長には迷惑をかけられません。
  event_overthehorizon_06_e_84:
    speaker: sora
    en: As for anyone else who could help us...
    ko: 사장님을 제외하고 도와줄 사람은… 글쎄요.
    ja: |-
      社長以外で私たちを助けてくれるような人は…
      そうですね～
  event_overthehorizon_06_e_85:
    speaker: sora
    en: Collectors are viewed as dangerous, even by those in the Outer Rim.
    ko: 콜렉터는 아우터 림에서도 위험한 존재들이라며,
    ja: アウターリムでもヤバい人たちって評判で…
  event_overthehorizon_06_e_86:
    speaker: sora
    en: Well, let's just say we're not exactly seen in the best light.
    ko: 취급이 제법 안 좋은 쪽에 속하는 사람들이라서요.
    ja: 敬遠されてる、コレクターの集団とか。
  event_overthehorizon_06_e_87:
    speaker: sora
    en: No one in the Ark would ever dream of helping folks as dangerous as us.
    ko: 방주에서 이렇게나 위험한 저희를 도울 사람이 있을 리가~ 없겠죠?
    ja: |-
      アークの中でこんな危ない橋を
      渡ってくれる人がいると思います？
  event_overthehorizon_06_e_88:
    speaker: sora
    en: We tried using our own money at first and everything we could think of...
      ★
    ko: 그래도 처음엔 사비도 털어보고 뭐, 이것저것 해봤는데…★
    ja: |-
      最初は自分のお金で調達したり、
      いろいろ手は尽くしてたんですけど…★
  event_overthehorizon_06_e_89:
    speaker: sora
    en: But it just wasn't nearly enough. ♥
    ko: 그것만으로는 턱없이 부족하더라고요♥
    ja: それだけでは全然足りませんでした★
  event_overthehorizon_06_e_90:
    speaker: sora
    en: I know it sounds like I'm just making excuses, but... that's why I had to
      resort to this.
    ko: 변명 같지만… 그래서 이런 방법을 쓰게 됐어요.
    ja: |-
      言い訳っぽいですけど…
      こうするしかなかったんです。
  event_overthehorizon_06_e_91:
    speaker: "<Self>"
    en: Sorry for thinking of it so simply...
    ko: "…쉽게 말해서 미안."
    ja: "…簡単に言ってすまなかった"
  event_overthehorizon_06_e_92:
    speaker: sora
    en: Hehe, it's okay.
    ko: 후후, 아니에요.
    ja: ふふ、気にしないでください。
  event_overthehorizon_06_e_93:
    speaker: sora
    en: |-
      I know full well this isn't exactly a justified
      act. ★
    ko: 이것이 정당한 행위가 아니라는 건, 저도 잘 알고 있어요★
    ja: |-
      胸を張れるようなことじゃないって、
      私も分かってますから★
  event_overthehorizon_06_e_94:
    speaker: sora
    en: But if we didn't do this,
    ko: 하지만.
    ja: でも…
  event_overthehorizon_06_e_95:
    speaker: sora
    en: there's no way we Collectors would last as long as they do up on the surface.
    ko: "이렇게라도 하지 않으면, \n니케도 살아남기 힘든 이 지상에서,"
    ja: |-
      こうしてなければ、
      ニケでも生き残るのが大変な地上では…
  event_overthehorizon_06_e_96:
    speaker: sora
    en: After all, we're talking about a place where it's difficult even for Nikkes
      to survive.
    ko: 장기간 탐색을 해야 하는 콜렉터들은 지금보다 더 살아남을 수 없었다는 걸 알아주셨으면 해요.
    ja: |-
      長い間出歩かなきゃいけない
      コレクターの人たちは、
      もっと生き残るのが難しくなると思います。
  event_overthehorizon_06_e_97:
    speaker: "<Self>"
    en: Why are the Collectors taking such a risk to search for the Wings of Victory?
    ko: 어째서 콜렉터들이 이런 위험을 감수하고, 그걸 찾고 있는 거야?
    ja: しかし、なぜそこまでするんだ？
  event_overthehorizon_06_e_98:
    speaker: sora
    en: "'Cause we want to live in the light. ★"
    ko: 빛 아래에서 살아가고 싶으니까요★
    ja: 光の下で生きていきたいからです★
  event_overthehorizon_06_e_99:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_overthehorizon_06_e_100:
    speaker: sora
    en: Don't people say that where there's a will, there's a way?
    ko: 뭐든 간절한 사람이 찾는다고 하잖아요?
    ja: 欲しいもののために必死って言うんですか？
  event_overthehorizon_06_e_101:
    speaker: sora
    en: Well, we're no different. ♥
    ko: 저희도 마찬가지예요♥
    ja: 私たちがそれです♥
  event_overthehorizon_06_e_102:
    speaker: sora
    en: We want to live under the real sky,
    ko: 누구에게나 공평하게 빛을 내려주는,
    ja: 誰にでも平等に降り注ぐ光のある…
  event_overthehorizon_06_e_103:
    speaker: sora
    en: where the light shines equally upon everyone.
    ko: 지상의 하늘 아래에서 살아가고 싶으니까요.
    ja: 本物の空の下で生きていきたい。
  event_overthehorizon_06_e_104:
    speaker: sora
    en: To make that happen, we have to reclaim the surface. ★
    ko: 그러기 위해선 지상 탈환이 현실이 되어야 할 테고★
    ja: そのためには地上を取り戻さないと★
  event_overthehorizon_06_e_105:
    speaker: sora
    en: And for that, we absolutely need the Wings of Victory.
    ko: 그걸 위해, 승리의 날개 호는 꼭 필요하고.
    ja: |-
      勝利の翼号は地上奪還のために
      不可欠の戦力です。
  event_overthehorizon_06_e_106:
    speaker: sora
    en: Without a doubt, we're the ones in the Ark who want it the most.
    ko: 분명, 방주에서 그것이 가장 간절한 사람은 저희일 테니까,
    ja: |-
      そして、アークで誰より地上奪還を
      願っているのも私たち。
  event_overthehorizon_06_e_107:
    speaker: sora
    en: That's why we decided to search for it ourselves.
    ko: 저희가 직접 찾아보자고 한 거였어요☆
    ja: だったら、私たちが探すしかないですよね☆
  event_overthehorizon_06_e_108:
    speaker: "<Self>"
    en: I... see.
    ko: 그렇… 구나.
    ja: そういうこと…だったのか
  event_overthehorizon_06_e_109:
    speaker: sora
    en: Welp, that's all there is to my secret. ★
    ko: 이게 제 비밀의 전부고★
    ja: これが私の秘密です★
  event_overthehorizon_06_e_110:
    speaker: sora
    en: That's all I've got to say.
    ko: 제가 드릴 이야기는 여기까지예요.
    ja: 話すことはもう何もありません。
  event_overthehorizon_06_e_111:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_06_e_112:
    speaker: sora
    en: Now, do you want to make a deal with me?
    ko: 이제 저와 거래할 마음이 생기셨을까요?
    ja: 私と取り引き、する気になりましたか？
  event_overthehorizon_06_e_113:
    speaker: "<Self>"
    en: Um...
    ko: 거래….
    ja: 取り引きか…
  event_overthehorizon_06_e_114:
    speaker: "<Monologue>"
    en: I recall everything from the moment I met Sora during flight training up until
      now.
    ko: 비행 교육에서 소라를 만났을 때부터, 지금까지의 기억을 떠올렸다.
    ja: |-
      航空教育でソラに初めて会った瞬間から
      今までのことを思い返した
  event_overthehorizon_06_e_115:
    speaker: "<Monologue>"
    en: The memories of flying paper airplanes with her,
    ko: 과거, 소라와 만나서 종이비행기를 날렸던 기억들.
    ja: |-
      いつだったか、ソラと一緒に
      紙飛行機を飛ばしたこと
  event_overthehorizon_06_e_116:
    speaker: "<Monologue>"
    en: the way she saved me when I was in trouble during the turbulence training,
    ko: 흔들리던 비행 훈련 속에서 위기에 빠진 날 구해줬던 소라의 행동들.
    ja: |-
      過酷な飛行訓練で危機に陥った時
      私を助けたソラの行動
  event_overthehorizon_06_e_117:
    speaker: "<Monologue>"
    en: receiving that message she accidentally sent me,
    ko: 잘못 보낸 밀수 메시지를 받았던 것과,
    ja: 誤送信されたメッセージ
  event_overthehorizon_06_e_118:
    speaker: "<Monologue>"
    en: and every moment I spent tracking her afterward.
    ko: 그 후 소라를 추적했던 모든 순간.
    ja: ソラを尾行した時の数々の出来事
  event_overthehorizon_06_e_119:
    speaker: "<Monologue>"
    en: I remember the moment she suggested we make a deal,
    ko: 거래를 하자고 했던 순간.
    ja: 取り引きを持ちかけられたあの瞬間
  event_overthehorizon_06_e_120:
    speaker: "<Monologue>"
    en: and the secrets I learned about her after coming here.
    ko: 이곳에 와서 봤던 소라의 비밀들을 떠올렸다.
    ja: ここで目にしたソラの秘密
  event_overthehorizon_06_e_121:
    speaker: "<Monologue>"
    en: Suddenly, a thought strikes me.
    ko: 그러자 문득 그런 생각이 들었다.
    ja: ふと、ひとつの疑念が思い浮かんだ
  event_overthehorizon_06_e_122:
    speaker: "<Monologue>"
    en: "... Is all of this really just a coincidence?"
    ko: "…이것이 정말 우연일까?"
    ja: "…これは全て、本当にただの成り行きか？"
  event_overthehorizon_06_e_123:
    speaker: sora
    en: Are you having trouble deciding?
    ko: 고민되시나요?
    ja: 決められませんか？
  event_overthehorizon_06_e_124:
    speaker: "<Self>"
    en: Can I ask you something?
    ko: 한 가지만 물어도 될까?
    ja: 1つ、聞いていいか？
  event_overthehorizon_06_e_125:
    speaker: sora
    en: Of course. ☆
    ko: 얼마든지요☆
    ja: いくつでもどうぞ☆
  event_overthehorizon_06_e_126:
    speaker: "<Self>"
    en: That message you sent to me by mistake.
    ko: 나한테 잘못 보냈다던 그 메시지.
    ja: 私に誤送信されてきたメッセージは…
  event_overthehorizon_06_e_127:
    speaker: "<Self>"
    en: Did you actually mean to send that to me?
    ko: 사실은 잘못 보낸 게 아니었던 거 아니야?
    ja: 間違って送られたものじゃないな？
  event_overthehorizon_06_e_128:
    speaker: sora
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_overthehorizon_06_e_129:
    speaker: sora
    en: What makes you say that?
    ko: 왜 그렇게 생각하시는 걸까요?
    ja: なんでそう思ったんですか？
  event_overthehorizon_06_e_130:
    speaker: "<Self>"
    en: I figured out everything very easily. Too easily.
    ko: 우연치고는 너무 쉽게 모든 걸 알게 되었으니까.
    ja: 偶然にしてはタイミングがよすぎる
  event_overthehorizon_06_e_131:
    speaker: "<Self>"
    en: You've never been caught smuggling before,
    ko: 이번 일이 있기 전에는 한 번도 밀수가 걸려본 적 없던 소라치고는,
    ja: |-
      それに今までの長い間、
      このことを隠し通してこられたソラにしては…
  event_overthehorizon_06_e_132:
    speaker: "<Self>"
    en: so I think everything was handled way too carelessly this time.
    ko: 너무 허술하게 모든 일이 진행되었다고 생각해.
    ja: 何もかも詰めが甘い
  event_overthehorizon_06_e_133:
    speaker: sora
    en: Wow, you really think so highly of me!
    ko: 와, 저에 대한 평가가 높으시군요~
    ja: わぁ～高く評価してもらえてるみたいですね～
  event_overthehorizon_06_e_134:
    speaker: sora
    en: Hehe, but you got that right. I sent it on purpose. ★
    ko: 후후, 정답이에요★
    ja: ふふ、大正解です★
  event_overthehorizon_06_e_135:
    speaker: "<Self>"
    en: Why... would you do that?
    ko: 왜… 그런 거야?
    ja: なぜ…こんなことを？
  event_overthehorizon_06_e_136:
    speaker: sora
    en: That's because... ♥
    ko: 음~ 그야♥
    ja: えっと～それはですね♥
  event_overthehorizon_06_e_137:
    speaker: sora
    en: I just really wanted to show you this, Captain.
    ko: 캡틴에게 이걸 꼭 보여주고 싶었고,
    ja: キャプテンにはぜひ知って欲しかったのと…
  event_overthehorizon_06_e_138:
    speaker: sora
    en: I wanted it to be a memory you'd never forget.
    ko: 절대 잊히지 않는 기억으로 남겨드리고 싶었으니까요.
    ja: |-
      一生忘れられない記憶に
      してほしかったからです。
  event_overthehorizon_06_e_139:
    speaker: "<Self>"
    en: Why me?
    ko: 왜 나야?
    ja: なぜ私だったんだ？
  event_overthehorizon_06_e_140:
    speaker: sora
    en: Well... ♥
    ko: 그야~♥
    ja: それはもちろん～♥
  event_overthehorizon_06_e_141:
    speaker: sora
    en: If the Wings of Victory ever takes flight again, I figured you'd be the one
      piloting it.
    ko: "승리의 날개 호가 날아오른다면, \n그것의 캡틴은 캡틴일 것 같았으니까요?"
    ja: |-
      勝利の翼号が見つかったら、
      その艦長になるのはきっとキャプテンだから♥
  event_overthehorizon_06_e_142:
    speaker: "<Self>"
    en: Now you're pulling my leg.
    ko: 농담하지 말고.
    ja: 冗談はよせ
  event_overthehorizon_06_e_143:
    speaker: sora
    en: I'm not! ♥
    ko: 농담 아닌데~♥
    ja: 冗談じゃないです～♥
  event_overthehorizon_06_e_144:
    speaker: sora
    en: I really mean it!
    ko: 진심이에요.
    ja: 私は本気ですよ？
  event_overthehorizon_06_e_145:
    speaker: sora
    en: I truly believe you'll be the one flying that legendary aircraft.
    ko: 전 정말로 그것의 캡틴은 당신이 될 거라고 확신하고 있어요.
    ja: |-
      本気で勝利の翼号を指揮するのは
      あなただと思っています。
  event_overthehorizon_06_e_146:
    speaker: "<Self>"
    en: Why would you go that far... for me?
    ko: 왜 그렇게까지, 나를….
    ja: 買い被りすぎじゃないか、私を…
  event_overthehorizon_06_e_147:
    speaker: sora
    en: Hmm, well...
    ko: 음~ 글쎄요.
    ja: う～ん、そうですかね。
  event_overthehorizon_06_e_148:
    speaker: sora
    en: Just looking at what you've pulled off with the Counters, I could list a ton
      of reasons. ★
    ko: "카운터스 스쿼드와 함께 이뤄낸 실적만 생각해도, \n근거로 들건 많지만…★"
    ja: |-
      カウンターズの実績だけを見ても
      十分な理由になると思いますけど…★
  event_overthehorizon_06_e_149:
    speaker: sora
    en: But if I'm being honest… maybe it's just a hunch?
    ko: 역시 감 때문이었달까요?
    ja: あとは私のカン？
  event_overthehorizon_06_e_150:
    speaker: sora
    en: Maybe it's because I used to be a Collector too. ☆
    ko: 저도 콜렉터 출신이어서 그런지, 잘 알거든요☆
    ja: |-
      こう見えてもコレクター出身なんで、
      目利きには自信があるんです☆
  event_overthehorizon_06_e_151:
    speaker: sora
    en: I can tell, y'know? Who's shining the brightest in the Ark right now,
    ko: 지금 방주에서 누가 가장 반짝이는 지☆
    ja: 誰が今のアークで一番キラキラしてるのか☆
  event_overthehorizon_06_e_152:
    speaker: sora
    en: and who will actually treat us like human beings. ☆
    ko: 누가 우리를 인간으로서 대해줄지.
    ja: |-
      それと、誰が私たちを
      人間として見てくれそうか。
  event_overthehorizon_06_e_153:
    speaker: "<Self>"
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  event_overthehorizon_06_e_154:
    speaker: sora
    en: That's why I want you on our side. ★
    ko: 그래서 줄을 대려고 하는 거예요★
    ja: |-
      ってことで、今から仲良くしておいた方が
      いいかなと思いまして★
  event_overthehorizon_06_e_155:
    speaker: sora
    en: Even if I had to make it look like a mistake, I was going to send that message,
      no matter what.
    ko: 실수인 척 메시지를 보내서라도, 반드시.
    ja: メッセージを送るリスクを取ってでも…
  event_overthehorizon_06_e_156:
    speaker: sora
    en: I wanted to grab onto the most promising lifeline we had
    ko: 가장 빛나는 동아줄을 잡아서,
    ja: 一番光ってる命綱をつかんで…
  event_overthehorizon_06_e_157:
    speaker: sora
    en: and show them what we're really after.
    ko: 저희가 어떤 일을 하고 있는지 보여주고 싶었어요.
    ja: |-
      私たちがしていることを
      見せておきたかったんです。
  event_overthehorizon_06_e_158:
    speaker: "<Self>"
    en: Is that why you call me Captain?
    ko: 그래서 날 캡틴이라고 부르는 거야?
    ja: だから私のことをキャプテンと呼ぶのか？
  event_overthehorizon_06_e_159:
    speaker: sora
    en: Yes and no. ♥
    ko: 반은 맞고~♡ 반은 틀려요♥
    ja: 半分アタリで～♡半分ハズレです♥
  event_overthehorizon_06_e_160:
    speaker: sora
    en: Yeah, I really do believe you're the one who'll lead us,
    ko: 정말로 저희를 이끌어줄 사람이어서이기도 하지만,
    ja: 仕事上、そういう意味もありますけど…
  event_overthehorizon_06_e_161:
    speaker: sora
    en: but there's more to it than that. ★
    ko: "이 정도로 애정을 담아 부르게 된 건, \n처음 만났던 그때부터 정했던 거라서요★"
    ja: |-
      気持ちをこめて呼ぶようになったのは、
      初めて会った時からです★
  event_overthehorizon_06_e_162:
    speaker: sora
    en: The first time we met, it honestly was just by chance.
    ko: 첫 만남은 정말 우연이었거든요.
    ja: |-
      最初に会った時は本当に
      偶然だったんですけどね。
  event_overthehorizon_06_e_163:
    speaker: sora
    en: You came into my life at the most unexpected moment.
    ko: 전혀 의도하지 않았던 순간에, 우연히 만나서….
    ja: あの時の、思わぬ出会いで…
  event_overthehorizon_06_e_164:
    speaker: sora
    en: As silly as it sounds, I guess you could say it was love at first sight for
      me. ♥
    ko: 정말 우습게도 한눈에 반해버렸지 뭐예요~♥
    ja: フシギなことに、一目ぼれってやつです～♥
  event_overthehorizon_06_e_165:
    speaker: sora
    en: That's why I started calling you Captain, and why I say it with so much affection.
    ko: 그래서 캡틴이라고 부르게 됐어요.
    ja: それで、キャプテンって呼ぶことにしました。
  event_overthehorizon_06_e_166:
    speaker: sora
    en: On that day, right then and there, I just knew it had to be you.
    ko: "그날, 그 순간. \n이 사람이 아니면 안 되겠다고 생각했어요."
    ja: |-
      あの日のあの瞬間に、
      この人しかないって思ったんです。
  event_overthehorizon_06_e_167:
    speaker: sora
    en: Sounds crazy, right?
    ko: 후후, 이 말을 믿을 수 있으시겠나요?
    ja: ふふ…私の話、信じられます？
  event_overthehorizon_06_e_168:
    speaker: "<Monologue>"
    en: I look at Sora's face.
    ko: 소라의 얼굴을 마주 본다.
    ja: ソラの顔をまっすぐに見た
  event_overthehorizon_06_e_169:
    speaker: "<Monologue>"
    en: The same face that gave me medicine
    ko: 그날, 호흡 곤란에 빠졌던 내게 약을 건넸던 그 얼굴이.
    ja: あの日、息も絶え絶えの私に薬をくれた時の顔
  event_overthehorizon_06_e_170:
    speaker: "<Monologue>"
    en: on that day I struggled to breathe.
    ko: 그곳에 있었다.
    ja: それがそこにある
  event_overthehorizon_06_e_171:
    speaker: "<Self>"
    en: "... Yeah, I believe you."
    ko: "…응. 믿어."
    ja: "…ああ。信じよう"
  event_overthehorizon_06_e_172:
    speaker: "<Self>"
    en: I believe that what you've told me so far is true.
    ko: 이것만큼은 아무런 거짓이 없다고, 믿을게.
    ja: 少なくとも、この話はな
  event_overthehorizon_06_e_173:
    speaker: sora
    en: "... Thank you."
    ko: "…감사해요."
    ja: "…ありがとうございます。"
  event_overthehorizon_06_e_174:
    speaker: sora
    en: Anyway, that's why I wanted to show you this place, Captain. ☆
    ko: 어쨌든, 이런 이유로☆
    ja: とにかく、そういうわけなので☆
  event_overthehorizon_06_e_175:
    speaker: sora
    en: Because I trust you. Because I care for you.
    ko: 전 애정과 믿음을 담아, 캡틴에게 이곳을 보여주고 싶었어요.
    ja: |-
      愛と信頼の証として、
      キャプテンにこの場所を
      お見せしようと思ったんです。
  event_overthehorizon_06_e_176:
    speaker: sora
    en: And now that
    ko: 그런 의미에서 캡틴★
    ja: でも、ここからが本題です★
  event_overthehorizon_06_e_177:
    speaker: sora
    en: you know everything,
    ko: 이왕 이렇게 모든 걸 아시게 된 거.
    ja: 全てを知っていただきましたから…
  event_overthehorizon_06_e_178:
    speaker: sora
    en: I'm not asking for some half-assed deal where you just turn a blind eye to
      the illegal things I've done.
    ko: 부정한 일을 저지른 걸 눈감아 주시는, 그런 얄팍한 거래가 아니라.
    ja: |-
      不正に見て見ぬふりするなんて、
      薄っぺらい取り引きじゃなくて。
  event_overthehorizon_06_e_179:
    speaker: sora
    en: I want you to make a real deal with me.
    ko: 저와 [진짜 거래]를 하지 않으실래요?
    ja: 私と「本当の取り引き」をしてくれませんか？
  event_overthehorizon_06_e_180:
    speaker: "<Self>"
    en: What do you mean, "a real deal"?
    ko: 진짜 거래?
    ja: 本当の取り引き？
  event_overthehorizon_06_e_181:
    speaker: sora
    en: Feel free to report me to the Central Government
    ko: 제가 밀수를 하고 있다는걸,
    ja: 私が不正を働いていることについては…
  event_overthehorizon_06_e_182:
    speaker: sora
    en: or the A.C.P.U. for smuggling. ☆
    ko: 중앙 정부든 A.C.P.U.든 누구에게라도 고발하셔도 좋아요☆
    ja: |-
      中央政府でもA.C.P.U.でも
      好きなだけ告発してくださって構いません☆
  event_overthehorizon_06_e_183:
    speaker: sora
    en: I'll leave that entirely up to you, Captain.
    ko: 그건 전적으로 캡틴에게 맡길게요.
    ja: それはキャプテンの好きにしちゃってください。
  event_overthehorizon_06_e_184:
    speaker: sora
    en: But no matter what, even if it costs us our lives,
    ko: 대신, 저희가 어떻게 해서라도, 목숨을 걸고서라도.
    ja: |-
      でも、私たちは何をしてでも、
      たとえ命を投げ捨ててでも…
  event_overthehorizon_06_e_185:
    speaker: sora
    en: we will find the Wings of Victory.
    ko: 반드시 승리의 날개 호를 찾아낼 테니.
    ja: 必ず勝利の翼号を見つけ出します。
  event_overthehorizon_06_e_186:
    speaker: sora
    en: So when the day comes that the Wings of Victory soars again,
    ko: 언젠가 승리의 날개가 다시 날아오를 때가 되었을 때.
    ja: |-
      そしていつか、勝利の翼が
      もう一度空に羽ばたく日が来たら…
  event_overthehorizon_06_e_187:
    speaker: sora
    en: all I ask is that you don't forget the efforts that we made.
    ko: 부디 저희의 노력을 잊지만 말아 주세요.
    ja: |-
      どうか、私たちの払った犠牲を
      覚えていてください。
  event_overthehorizon_06_e_188:
    speaker: sora
    en: Remember the blood, sweat, and tears of those who wandered the surface to
      make this happen,
    ko: 목숨을 걸고, 지상을 헤맨 이들의 피와 땀을 기억하고,
    ja: |-
      命をかけて地上をさまよった人たちの
      血と汗の記憶を…
  event_overthehorizon_06_e_189:
    speaker: sora
    en: and take us with you.
    ko: 함께 데려가 주세요.
    ja: 一緒に連れていってください。
  event_overthehorizon_06_e_190:
    speaker: sora
    en: Take us to that brilliant world beyond the horizon,
    ko: 누구에게나 공평하게 빛이 내려오는,
    ja: 誰にも公平に光が降り注ぐ…
  event_overthehorizon_06_e_191:
    speaker: sora
    en: where the light shines down equally on everyone!
    ko: 찬란한 지평선 위의 세계로…!
    ja: 輝く地平線の彼方へ。
  event_overthehorizon_06_e_192:
    speaker: "<Monologue>"
    en: I see Sora looking at me with a face full of trust.
    ko: 신뢰에 가득 찬 얼굴로, 나를 보는 소라를 보았다.
    ja: ソラが信頼に満ちた眼差しで私を見ている
  event_overthehorizon_06_e_193:
    speaker: "<Monologue>"
    en: I see countless messages from Collectors plastered on the walls, all desperate
      to find the Wings of Victory.
    ko: 벽면을 가득 채운, 승리의 날개 호를 찾아 헤매는 콜렉터들의 수많은 메시지를 보았다.
    ja: |-
      壁一面に貼られた、勝利の翼号の行方を追う
      コレクターたちのメモ書きを見た
  event_overthehorizon_06_e_194:
    speaker: "<Monologue>"
    en: My eyes fall on the crates of medical supplies Sora smuggled past inspections.
    ko: 소라가 검문을 피해, 몰래 밀반입해 왔을 수많은 의료 물품이 보았다.
    ja: ソラが持ち出した医療品の入った箱の山を見た
  event_overthehorizon_06_e_195:
    speaker: "<Monologue>"
    en: And between those boxes, a bloodstained bandage lies draped.
    ko: 그리고 그 상자들 사이에, 걸쳐있는 피 묻은 붕대를 보았다.
    ja: |-
      箱の間をまたぐように引っかかった
      包帯ににじむ血の色を見た
  event_overthehorizon_06_e_196:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_overthehorizon_06_e_197:
    speaker: "<Monologue>"
    en: I can see their longing clearly, right before my eyes.
    ko: 그들의 간절함을 두 눈에 담았다.
    ja: |-
      私は彼らの切なる思いの証拠を
      両目にしっかりと焼きつけた
  event_overthehorizon_06_e_198:
    speaker: "<Self>"
    en: Fine. Let's make a deal.
    ko: 그래. 거래하자.
    ja: 分かった。取り引きしよう
  event_overthehorizon_06_e_199:
    speaker: "<Self>"
    en: I'll turn a blind eye to the smuggling until we find the Wings of Victory.
    ko: 밀수를 하는 것도, 승리의 날개 호를 찾을 때까지는 모른 척 눈을 감고 있을게.
    ja: |-
      勝利の翼号が見つかるまで、
      このことは誰にも言わないでおく
  event_overthehorizon_06_e_200:
    speaker: sora
    en: I swear that
    ko: 저도 맹세할게요.
    ja: 私も誓います。
  event_overthehorizon_06_e_201:
    speaker: sora
    en: once we find the Wings of Victory,
    ko: 승리의 날개 호를 찾은 이후엔,
    ja: 勝利の翼号が見つかった後は…
  event_overthehorizon_06_e_202:
    speaker: sora
    en: I'll never do anything like this ever again.
    ko: 절대 같은 일을 반복하지 않겠다고.
    ja: 二度とこんな事はしません。
  event_overthehorizon_06_e_203:
    speaker: "<Self>"
    en: Also...
    ko: 그리고….
    ja: それから…
  event_overthehorizon_06_e_204:
    speaker: "<Self>"
    en: When the Wings of Victory take flight once again,
    ko: 언젠가 승리의 날개가 다시 날아오를 때,
    ja: いつか勝利の翼号がもう一度空を飛ぶ時…
  event_overthehorizon_06_e_205:
    speaker: "<Self>"
    en: I won't forget you, and I'll be with you,
    ko: 절대로 잊지 않고 너희와 함께할게.
    ja: 絶対に忘れず君たちを連れていこう
  event_overthehorizon_06_e_206:
    speaker: "<Self>"
    en: no matter what.
    ko: "…반드시."
    ja: "…必ず"
  event_overthehorizon_06_e_207:
    speaker: sora
    en: Hehe, all right! ☆
    ko: 후후, 좋아요☆
    ja: ふふ、取り引き成立ですね☆
  event_overthehorizon_06_e_208:
    speaker: sora
    en: I'll be waiting eagerly for the day we find the Wings of Victory for you,
      Captain,
    ko: 캡틴을 위한 승리의 날개를 찾아서,
    ja: 勝利の翼号を見つけ出して…
  event_overthehorizon_06_e_209:
    speaker: sora
    en: and fly across the horizon together. ☆
    ko: 함께 지평선 위를 날아오를 그날을 기다리고 있을게요☆
    ja: |-
      キャプテンと一緒に地平線の彼方へ
      飛んでいける日を楽しみにしています☆
event_overthehorizon_epilogue:
  event_overthehorizon_epilogue_1:
    speaker: "<Monologue>"
    en: A long time after that.
    ko: 그로부터 오랜 시간이 지난 어느 날….
    ja: それから長い時間がたったある日のこと…
  event_overthehorizon_epilogue_2:
    speaker: sora
    en: Now, let's see... what messages came in today?
    ko: "어디 보자~ \n오늘 연락 온 게…."
    ja: |-
      えっと～
      今日来てる連絡は…
  event_overthehorizon_epilogue_3:
    speaker: "<Narration>"
    en: Sora scrolls through her phone
    ko: 소라는 핸드폰을 뒤적거리다,
    ja: ソラが携帯をいじっている
  event_overthehorizon_epilogue_4:
    speaker: "<Narration>"
    en: and stops at a message labeled "Captain♡".
    ko: "[캡틴♡]이라고 쓰여 있는 메시지에서, 멈춰 섰다."
    ja: |-
      「キャプテン♡」と書かれた
      メッセージで、手が止まった
  event_overthehorizon_epilogue_5:
    speaker: sora
    en: Oh yeah, I remember now, hehe.
    ko: 후후, 그랬지.
    ja: ふふ、思い出しちゃった。
  event_overthehorizon_epilogue_6:
    speaker: sora
    en: That really happened, huh?
    ko: "…그런 일이 있었지."
    ja: "…そんなことがあったっけ。"
  event_overthehorizon_epilogue_7:
    speaker: "<Narration>"
    en: For a long while, Sora can't take her eyes off the Captain's profile picture.
    ko: 소라는 한동안 [캡틴♡]의 프로필 사진에서 시선을 떼지 못했다.
    ja: |-
      ソラは「キャプテン♡」の
      プロフィール画像から
      しばらく目を離さなかった
  event_overthehorizon_epilogue_8:
    speaker: sora
    en: Hmm...
    ko: 음~
    ja: う～ん…
  event_overthehorizon_epilogue_9:
    speaker: sora
    en: Looking at this makes me miss him even more.
    ko: 이렇게 보고 있으니까 더 보고 싶네~
    ja: |-
      写真だけじゃなくて
      本物に会いたくなっちゃうな～
  event_overthehorizon_epilogue_10:
    speaker: sora
    en: I heard he's on a mission up on the surface.
    ko: 지상으로 임무 나가셨다고 들었는데,
    ja: 地上に出てるって聞いたけど…
  event_overthehorizon_epilogue_11:
    speaker: sora
    en: I wonder when he'll be back?
    ko: 언제쯤 돌아오시려나~
    ja: いつ帰ってくるんだろ～
  event_overthehorizon_epilogue_12:
    speaker: cielo
    en: "??"
    ko: "??"
    ja: "？？"
  event_overthehorizon_epilogue_13:
    speaker: cielo
    en: Sora, what are you doing over there by yourself?
    ko: 소라, 거기서 혼자서 뭐 하세요?
    ja: ソラ、1人で何してるんですか？
  event_overthehorizon_epilogue_14:
    speaker: sora
    en: Oh, nothing.
    ko: 후후, 그냥~
    ja: ふふ、気にしないで～
  event_overthehorizon_epilogue_15:
    speaker: sora
    en: I just miss the Captain, that's all. ♥
    ko: 캡틴이 보고 싶어져서요~♥
    ja: キャプテンに会いたいな～って♥
  event_overthehorizon_epilogue_16:
    speaker: cielo
    en: The Captain? Y-yeah... me too.
    ko: 캡틴이요? 저, 저도….
    ja: キャプテンですか？あ、わ、私も…
  event_overthehorizon_epilogue_17:
    speaker: cielo
    en: Oh! By the way,
    ko: 어, 그러고 보니까!
    ja: あ、そうそう！
  event_overthehorizon_epilogue_18:
    speaker: cielo
    en: have you seen the news, Sora?
    ko: 소라 그 소식 보셨어요?
    ja: ソラ、あのニュース、聞きましたか？
  event_overthehorizon_epilogue_19:
    speaker: sora
    en: No, what is it?
    ko: 그 소식?
    ja: あのニュース？
  event_overthehorizon_epilogue_20:
    speaker: cielo
    en: It's about Reclamation Site 01!
    ko: 주둔지 01 말이에요!
    ja: 駐屯地01のことですよ！
  event_overthehorizon_epilogue_21:
    speaker: sora
    en: What's that?
    ko: 그게 뭔데요?
    ja: 何それ？
  event_overthehorizon_epilogue_22:
    speaker: cielo
    en: Oh my goodness! You haven't heard the big news? Here, let me tell you what
      happened.
    ko: |-
      어머어머 그 귀한 소식을 아직 못 들으셨나 보군요?
      제가 어떤 이야기인지 지금 설명해 드릴….
    ja: |-
      え？大ニュースになってるじゃないですか？
      どこかに説明が…
  event_overthehorizon_epilogue_23:
    speaker: sky
    en: Here you go.
    ko: 이거예요.
    ja: これです。
  event_overthehorizon_epilogue_24:
    speaker: "<Narration>"
    en: Sky holds out her phone.
    ko: 스카이가 핸드폰을 내밀었다.
    ja: スカイが携帯端末の画面を見せた
  event_overthehorizon_epilogue_25:
    speaker: announcer
    en: The Counters Squad has fulfilled the Ark's long-held dream by reclaiming a
      portion of the surface.
    ko: "[카운터스 스쿼드가 방주의 오랜 염원이었던 지상 일부를 되찾았다는 소식입니다.]"
    ja: |-
      「カウンターズがアークの宿願、
      地上の一部の奪還に成功」
  event_overthehorizon_epilogue_26:
    speaker: announcer
    en: Since the founding of the Ark, has there ever been another Commander who has
      achieved so much?
    ko: "[방주 설립 이후, 이 정도의 성과를 올린 지휘관이 또 있었을까요!]"
    ja: |-
      「アーク建設以来、
      前代未聞の成果を上げた指揮官が出現！」
  event_overthehorizon_epilogue_27:
    speaker: announcer
    en: The Central Government has named this reclaimed area Reclamation Site 01
    ko: "[중앙 정부는 이번에 되찾은 이 지상의 지역을 '주둔지 01'이라고 칭하고,]"
    ja: |-
      「中央政府は今回奪還された地域を
      『駐屯地01』と命名し…」
  event_overthehorizon_epilogue_28:
    speaker: announcer
    en: and highly praised the Commander responsible for this accomplishment...
    ko: "[이를 이뤄낸 지휘관의 공을 높이 평가했….]"
    ja: "「立役者となった指揮官の功績を高く評価…」"
  event_overthehorizon_epilogue_29:
    speaker: sora
    en: Reclaiming the surface... ☆
    ko: 지상 탈환이라니…☆
    ja: 地上を取り戻したなんて…☆
  event_overthehorizon_epilogue_30:
    speaker: sora
    en: Wow, that's amazing news!
    ko: 정말 엄청난 소식이네요!
    ja: 本当に大ニュースですね～！
  event_overthehorizon_epilogue_31:
    speaker: cielo
    en: I know, right? It's amazing!
    ko: |-
      그쵸!
      엄청나죠!!
    ja: |-
      そうでしょう！
      すごいですよね！！
  event_overthehorizon_epilogue_32:
    speaker: sky
    en: It's an accomplishment only the Captain could pull off.
    ko: 정말 캡틴만이 이뤄낼 수 있는 성과라고 할 수 있죠.
    ja: キャプテンにしかできない成果です。
  event_overthehorizon_epilogue_33:
    speaker: sora
    en: Hehe, the Captain can do anything! ♡
    ko: 후후, 우리 캡틴은 대단하다니까~♡
    ja: ふふ、キャプテンはやっぱりすご～い♡
  event_overthehorizon_epilogue_34:
    speaker: "<Narration>"
    en: "*Vrrr*"
    ko: 지잉-
    ja: ブルルル――
  event_overthehorizon_epilogue_35:
    speaker: sora
    en: "... Huh?"
    ko: "…전화?"
    ja: "…あれ、電話？"
  event_overthehorizon_epilogue_36:
    speaker: sora
    en: Who's calling me at this hour?
    ko: 왜… 이 시간에….
    ja: "…誰…こんな時間に…？"
