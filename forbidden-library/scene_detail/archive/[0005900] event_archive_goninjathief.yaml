---
event_goninjathief_prologue:
  event_goninjathief_prologue_1:
    speaker: "<Narration>"
    en: A hush falls over the night as darkness settles in.
    ko: 어둠이 내려앉은 조용한 밤.
    ja: 静かな闇が包む夜
  event_goninjathief_prologue_2:
    speaker: "<Narration>"
    en: As the world sleeps,
    ko: 모두가 잠에 든 그 시간에.
    ja: 誰もが眠るその時に…
  event_goninjathief_prologue_3:
    speaker: "<Narration>"
    en: a band of few begin their work.
    ko: 활동을 시작하는 이들이 있다.
    ja: 動き始める者たちがいる
  event_goninjathief_prologue_4:
    speaker: "<Narration>"
    en: "*Flutter*"
    ko: 펄럭~
    ja: ヒラッ
  event_goninjathief_prologue_5:
    speaker: phantom
    en: Hmm...
    ko: 음.
    ja: ふん…
  event_goninjathief_prologue_6:
    speaker: phantom
    en: How fine the wind sings.
    ko: 바람의 울림이 좋군.
    ja: 風の音がいい。
  event_goninjathief_prologue_7:
    speaker: phantom
    en: A perfect wind to cloak my footsteps.
    ko: 나의 발소리를 묶어줄 완벽한 바람이오.
    ja: 私の足音を消してくれる、完璧な風だ。
  event_goninjathief_prologue_8:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컹-
    ja: ガタッ…
  event_goninjathief_prologue_9:
    speaker: quency_e
    en: Hmm...
    ko: 음~
    ja: う～ん。
  event_goninjathief_prologue_10:
    speaker: quency_e
    en: Holes everywhere!
    ko: 여기저기 구멍들이 많네.
    ja: あちこち穴だらけね。
  event_goninjathief_prologue_11:
    speaker: quency_e
    en: This is the perfect spot to carve out a new route!
    ko: 새로운 루트를 뚫기에 완벽한 장소인걸?
    ja: |-
      新しいルートを見つけるのに
      うってつけの場所だわ！
  event_goninjathief_prologue_12:
    speaker: "<Narration>"
    en: "*Tap tap tap*"
    ko: 다다다다-
    ja: ダダダダッ――
  event_goninjathief_prologue_13:
    speaker: miranda_c
    en: Hmm...
    ko: 음.
    ja: ふぅ…
  event_goninjathief_prologue_14:
    speaker: miranda_c
    en: It's dangerous at night, so we really should head back early!
    ko: 밤에는 위험하니, 일찍 들어가야 합니다!
    ja: 夜は危険です。早く戻らねばなりません！
  event_goninjathief_prologue_15:
    speaker: quency_e
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_prologue_16:
    speaker: quency_e
    en: That's not the right line, Miranda.
    ko: 미란다, 대사 그거 아니었잖아.
    ja: ミランダ、セリフ間違ってるわよ～？
  event_goninjathief_prologue_17:
    speaker: miranda_c
    en: Huh?
    ko: 네?
    ja: えっ？
  event_goninjathief_prologue_18:
    speaker: miranda_c
    en: Uh...
    ko: 어….
    ja: えーと…
  event_goninjathief_prologue_19:
    speaker: miranda_c
    en: Ah, I remember now!
    ko: 아, 생각났습니다!
    ja: あっ、思い出しました！
  event_goninjathief_prologue_20:
    speaker: miranda_c
    en: Silence has descended on the streets.
    ko: 거리에 고요가 찾아왔습니다.
    ja: 街に静寂が訪れました。
  event_goninjathief_prologue_21:
    speaker: miranda_c
    en: The moment has come to deliver my justice!
    ko: 저의 정의를 완벽하게 보여줄 때입니다!
    ja: 我々の正義を見せつける時です！
  event_goninjathief_prologue_22:
    speaker: "<Narration>"
    en: "*Step, step*"
    ko: 저벅- 저벅-
    ja: スタスタ…
  event_goninjathief_prologue_23:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_prologue_24:
    speaker: "<Self>"
    en: O-oh...
    ko: 아, 아악….
    ja: あ、ああ…
  event_goninjathief_prologue_25:
    speaker: "<Self>"
    en: It is the hour of the wicked...!
    ko: 악한 자들의 시간이다…!
    ja: 時は訪れた
  event_goninjathief_prologue_26:
    speaker: "<Self>"
    en: A perfect stage, prepared just for us...!
    ko: 우리들을 위한 완벽한 무대라는 것이지…!!
    ja: 我々のための完璧な舞台だ…！
  event_goninjathief_prologue_27:
    speaker: phantom
    en: Excellent.
    ko: 좋소.
    ja: よし。
  event_goninjathief_prologue_28:
    speaker: phantom
    en: All four members of the Thieves of Justice are present.
    ko: 정의 괴도단, 넷이 다 모였군.
    ja: 正義の怪盗団、4人全員揃ったな。
  event_goninjathief_prologue_29:
    speaker: phantom
    en: And now... I shall present to you the newest member of our troupe.
    ko: 그리고 여기에서, 우리 괴도단의 새로운 괴도를 소개하도록 하겠소.
    ja: |-
      ではここで、我が怪盗団の
      新たな仲間を紹介しよう。
  event_goninjathief_prologue_30:
    speaker: phantom
    en: Step forth!
    ko: 나오시오!
    ja: 出てきたまえ！
  event_goninjathief_prologue_31:
    speaker: "<Narration>"
    en: "*Swish*"
    ko: 슈슉-
    ja: シュシュッ
  event_goninjathief_prologue_32:
    speaker: delta_n
    en: Hmm...
    ko: 음.
    ja: ええと…
  event_goninjathief_prologue_33:
    speaker: delta_n
    en: Night has fallen.
    ko: 해가 완전히 졌습니다.
    ja: 日が完全に沈みました。
  event_goninjathief_prologue_34:
    speaker: delta_n
    en: The shadows now work in my favor.
    ko: 제 모습을 가려줄 완벽한 어둠입니다.
    ja: この身を隠すのに完璧な暗闇です。
  event_goninjathief_prologue_35:
    speaker: delta_n
    en: Nin-nin!
    ko: 닌닌!
    ja: ニンニン！
  event_goninjathief_prologue_36:
    speaker: phantom
    en: As you know, Delta is still a trainee.
    ko: 알겠지만, 델타는 아직 수습이오.
    ja: |-
      さて、みんな。怪盗団に加わったとはいえ、
      デルタはまだ見習いの身だ。
  event_goninjathief_prologue_37:
    speaker: phantom
    en: She will likely fall short in many ways, so I ask that you assist her well
      by her side.
    ko: 많이 부족할 테니, 옆에서 잘 도와주도록 하시오.
    ja: |-
      独り立ちするまでは、
      彼女のサポートをしてあげてくれ。
  event_goninjathief_prologue_38:
    speaker: delta_n
    en: I am counting on your guidance, seniors.
    ko: 잘 부탁드립니다, 선배님들.
    ja: 先輩方、よろしくお願いいたします。
  event_goninjathief_prologue_39:
    speaker: miranda_c
    en: Don't worry, just leave it to us!
    ko: 저희만 믿으세요!
    ja: 遠慮せず頼ってくださいね！
  event_goninjathief_prologue_40:
    speaker: quency_e
    en: Yup, yup!
    ko: 맞아, 맞아~
    ja: そうそう～
  event_goninjathief_prologue_41:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_prologue_42:
    speaker: phantom
    en: And so the Thieves of Justice are now five.
    ko: 그럼, 다섯이 된 정의 괴도단.
    ja: では、完全体となった正義の怪盗団。
  event_goninjathief_prologue_43:
    speaker: phantom
    en: To protect the justice in the Ark,
    ko: 방주의 정의를 지키기 위해.
    ja: アークの正義を守るため…
  event_goninjathief_prologue_44:
    speaker: phantom
    en: we shall resume our duties as a team!
    ko: 완전체로 다시 활동을 시작하도록 하겠소!
    ja: 今宵の活動を始めるとしよう！
  event_goninjathief_prologue_45:
    speaker: miranda_c
    en: Yaaaay!
    ko: 예에에!!!
    ja: イェーイ！！
  event_goninjathief_prologue_46:
    speaker: quency_e
    en: Woohoo!
    ko: 와아아~!!
    ja: ひゅ～ひゅ～！
  event_goninjathief_prologue_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_prologue_48:
    speaker: "<Self>"
    en: Ugh, what a pain...
    ko: 아, 진짜 싫다.
    ja: ああ、まいったな…
event_goninjathief_01_s:
  event_goninjathief_01_s_1:
    speaker: "<Self>"
    en: Ugh, so tired...
    ko: 으, 피곤하다….
    ja: はぁ、疲れた…
  event_goninjathief_01_s_2:
    speaker: "<Monologue>"
    en: Just when I'm getting ready to sleep after work...
    ko: 일이 끝나고, 잠에 들 준비를 하던 중.
    ja: 仕事を終え、寝る準備をしていると
  event_goninjathief_01_s_3:
    speaker: "<Narration>"
    en: "*Knock, knock*"
    ko: 똑똑.
    ja: コンコン
  event_goninjathief_01_s_4:
    speaker: "<Monologue>"
    en: Someone knocks at the door of the Commander's Room.
    ko: 누군가가 지휘관실의 문을 두드렸다.
    ja: 誰かが指揮官室のドアを叩いた
  event_goninjathief_01_s_5:
    speaker: "<Self>"
    en: Aw, come on... I was just about to fall asleep.
    ko: 아… 잠들기 직전이었는데.
    ja: "…ちょうど休むところだったのだが…"
  event_goninjathief_01_s_6:
    speaker: "<Self>"
    en: Who is it?
    ko: 누구야?
    ja: 誰だ？
  event_goninjathief_01_s_7:
    speaker: delta
    en: Hello, Commander.
    ko: 안녕하십니까, 지휘관.
    ja: お疲れ様です、指揮官。
  event_goninjathief_01_s_8:
    speaker: delta
    en: Apologies for disturbing you at this hour.
    ko: 늦은 시간에 죄송합니다.
    ja: 夜分遅くに申し訳ございません。
  event_goninjathief_01_s_9:
    speaker: delta
    en: May I enter for a moment?
    ko: 잠시 들어가도 되겠습니까?
    ja: 入ってもよろしいでしょうか？
  event_goninjathief_01_s_10:
    speaker: "<Monologue>"
    en: "... What's Delta doing here at this time of night?"
    ko: "…델타가 이 시간에?"
    ja: "…デルタ？こんな時間にどうしたのだろうか…"
  event_goninjathief_01_s_11:
    speaker: "<Self>"
    en: Sure, come in.
    ko: 그래, 들어와.
    ja: ああ、構わない
  event_goninjathief_01_s_12:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_goninjathief_01_s_13:
    speaker: "<Self>"
    en: What brings you here?
    ko: 무슨 일로 왔어?
    ja: どうしたんだ？
  event_goninjathief_01_s_14:
    speaker: delta
    en: I was unsure when you would summon me, so I've been waiting.
    ko: 저를 언제쯤 불러주실지 몰라, 기다리던 중.
    ja: いつ招集を受けるのか分からなかったため、
  event_goninjathief_01_s_15:
    speaker: delta
    en: I thought it best to come and ask you in person.
    ko: 직접 찾아가서 여쭤보는 게 나을 것 같아 방문했습니다.
    ja: |-
      直接お伺いしたほうがよいと思い、
      お邪魔した次第です。
  event_goninjathief_01_s_16:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_goninjathief_01_s_17:
    speaker: "<Self>"
    en: What do you mean?
    ko: 그게 뭔 소리야?
    ja: 何のことだ？
  event_goninjathief_01_s_18:
    speaker: delta
    en: You said I could also become a phantom thief. Is that correct?
    ko: 저도 괴도가 될 수 있다고 말씀하셨지 말입니다.
    ja: 私も怪盗になれるとおっしゃっていましたよね。
  event_goninjathief_01_s_19:
    speaker: "<Self>"
    en: Oh...
    ko: 아…?
    ja: あっ…
  event_goninjathief_01_s_20:
    speaker: "<Monologue>"
    en: This story goes back quite a ways
    ko: 이야기는 한참 전으로 돌아가.
    ja: 話はずいぶん前にさかのぼる
  event_goninjathief_01_s_21:
    speaker: "<Monologue>"
    en: to the day Arcana tried to recruit Delta in the Commander's Room.
    ko: 아르카나가 지휘관실에서 델타에게 영업을 하던 날.
    ja: |-
      あれは、アルカナが指揮官室で
      デルタの運勢を占った日のこと――
  event_goninjathief_01_s_22:
    speaker: delta
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_01_s_23:
    speaker: delta
    en: What's all this about phantom thieves?
    ko: 괴도… 말입니까?
    ja: 怪盗…ですか？
  event_goninjathief_01_s_24:
    speaker: phantom
    en: "!!"
    ko: "!!!!!"
    ja: "！！！！！"
  event_goninjathief_01_s_25:
    speaker: phantom
    en: How the...?!
    ko: 어, 어째서…?
    ja: なっ…どういうことだ…？
  event_goninjathief_01_s_26:
    speaker: phantom
    en: I didn't sense your presence at all!
    ko: 분명 아무런 기척도 느끼지 못했소만…!
    ja: 何の気配も感じなかったぞ…！
  event_goninjathief_01_s_27:
    speaker: miranda_c
    en: Me neither!
    ko: 저도 그렇습니다!
    ja: 私もです！
  event_goninjathief_01_s_28:
    speaker: quency_e
    en: How interesting!
    ko: 신기하다~
    ja: 不思議ね～
  event_goninjathief_01_s_29:
    speaker: quency_e
    en: Would you like to join the Thieves of Justice?
    ko: 같이 정의 괴도단 할래?
    ja: ねぇ、正義の怪盗団に入らない？
  event_goninjathief_01_s_30:
    speaker: delta
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_01_s_31:
    speaker: delta
    en: Can I really become a phantom thief?
    ko: "…저도 괴도가 될 수 있습니까?"
    ja: "…私も怪盗になれますか？"
  event_goninjathief_01_s_32:
    speaker: phantom
    en: Anyone who is righteous is welcome.
    ko: 정의로운 이라면 누구나 환영이오.
    ja: 正義感のある者なら、誰でも歓迎だ。
  event_goninjathief_01_s_33:
    speaker: arcana
    en: Uh oh...
    ko: 오오?
    ja: おおっ？
  event_goninjathief_01_s_34:
    speaker: "<Self>"
    en: Here we go again...
    ko: "……제발."
    ja: "…これ以上私を巻き込まないでくれ…"
  event_goninjathief_01_s_35:
    speaker: "<Monologue>"
    en: Ah.
    ko: 아.
    ja: そう
  event_goninjathief_01_s_36:
    speaker: "<Monologue>"
    en: Right, there was a day like that.
    ko: 그래, 그런 날이 있었다.
    ja: そんなことがあった
  event_goninjathief_01_s_37:
    speaker: "<Monologue>"
    en: But...
    ko: 아니, 그런데….
    ja: いや、それにしても…
  event_goninjathief_01_s_38:
    speaker: "<Self>"
    en: You're seriously asking that at such a late hour?
    ko: 그걸 이 늦은 시간에 와서 굳이 물어본다고?
    ja: |-
      それを聞くために、
      わざわざこんな夜遅くに来たのか？
  event_goninjathief_01_s_39:
    speaker: delta
    en: I was told the phantom thieves operate at night.
    ko: 괴도는 밤에 활동한다고 들었습니다.
    ja: 怪盗は夜に活動するものだと聞きました。
  event_goninjathief_01_s_40:
    speaker: delta
    en: In accordance with that, I have come at night as well.
    ko: 그에 맞춰, 저도 밤에 방문하게 되었습니다.
    ja: なので、夜に訪ねたのです。
  event_goninjathief_01_s_41:
    speaker: "<Self>"
    en: Oh...
    ko: 아….
    ja: "……"
  event_goninjathief_01_s_42:
    speaker: "<Self>"
    en: So you really want to be a phantom thief?
    ko: 진심으로 괴도가 되고 싶었던 거야?
    ja: 怪盗になりたいというのは本気だったのか？
  event_goninjathief_01_s_43:
    speaker: delta
    en: Since you have seen potential in me for righteous deeds, I do not wish to
      disappoint you.
    ko: |-
      정의로운 일에 대한 가능성을 봐주신 만큼,
      실망하게 해드리고 싶지 않았습니다.
    ja: |-
      私の正義感を見込んでくださった以上、
      失望させたくはありません。
  event_goninjathief_01_s_44:
    speaker: delta
    en: So, how long must I wait?
    ko: 그래서, 저는 언제까지 대기하면 됩니까?
    ja: |-
      それで、私はいつまで
      待機すればいいのでしょうか？
  event_goninjathief_01_s_45:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_01_s_46:
    speaker: "<Monologue>"
    en: Now what do I do...?
    ko: 이걸 어떡하지.
    ja: さて、どうしたものか…
  event_goninjathief_01_s_47:
    speaker: "<Self>"
    en: Uh...
    ko: 어어.
    ja: ええと…その件なんだが
  event_goninjathief_01_s_48:
    speaker: "<Self>"
    en: It's not really my call.
    ko: 일단 내가 결정할 일은 아닌 것 같아서.
    ja: 私の一存では決められないから、
  event_goninjathief_01_s_49:
    speaker: "<Self>"
    en: I'll ask the Thieves of Justice and get back to you.
    ko: 내일 괴도단 애들한테 물어보고 연락 줄게.
    ja: 明日、怪盗団のみんなに聞いてからまた連絡する
  event_goninjathief_01_s_50:
    speaker: delta
    en: Understood. Thank you.
    ko: 알겠습니다, 감사합니다.
    ja: 分かりました。ありがとうございます。
  event_goninjathief_01_s_51:
    speaker: delta
    en: Very well, I shall take my leave.
    ko: 그럼, 저는 이만 들어가 보겠-
    ja: では、私はこれで…
  event_goninjathief_01_s_52:
    speaker: "<Narration>"
    en: "*Clack*"
    ko: 덜컹.
    ja: ガタンッ
  event_goninjathief_01_s_53:
    speaker: phantom
    en: There's no need for that.
    ko: 굳이 그럴 필요는 없소.
    ja: その必要はない。
  event_goninjathief_01_s_54:
    speaker: phantom
    en: As you can see, we are already here.
    ko: 우리는 이미 이곳에 있으니 말이오.
    ja: なぜなら、私たちはここにいるのだからな。
  event_goninjathief_01_s_55:
    speaker: miranda_c
    en: Greetings! It is I, Miranda, the Phantom Police!
    ko: 안녕하십니까, 괴도 경찰 미란다입니다!
    ja: こんばんは！怪盗警察ミランダです！
  event_goninjathief_01_s_56:
    speaker: "<Self>"
    en: Hey, when did you guys get here?
    ko: 뭐야, 너희들 언제 왔어?
    ja: "…いつからそこに？"
  event_goninjathief_01_s_57:
    speaker: quency_e
    en: Just got here a bit ago, but looks like you already have a guest.
    ko: 조금 전에 도착해서 들어오려고 했는데, 선객이 있지 뭐야~
    ja: |-
      さっき着いたところよ。
      でも先客がいるみたいだから、
      そのまま待機してたの～
  event_goninjathief_01_s_58:
    speaker: quency_e
    en: And as luck would have it, you two were talking about us!
    ko: 그런데 마침 또 우리 얘기를 하고 있잖아.
    ja: |-
      そしたら私たちの話になったから、
      出てきちゃった。
  event_goninjathief_01_s_59:
    speaker: quency_e
    en: Hiya, Delta! It's been ages!
    ko: 안녕~ 오랜만이야 델타.
    ja: ヤッホ～。久しぶりね、デルタ。
  event_goninjathief_01_s_60:
    speaker: delta
    en: Greetings.
    ko: 안녕하십니까.
    ja: こんばんは。
  event_goninjathief_01_s_61:
    speaker: phantom
    en: As it happens, Delta, I had intended to pay you a visit.
    ko: 안 그래도 델타, 당신을 찾아가려고 했었소.
    ja: デルタ、ちょうど君を探していたのだ。
  event_goninjathief_01_s_62:
    speaker: delta
    en: I see...
    ko: 아.
    ja: えっ…
  event_goninjathief_01_s_63:
    speaker: "<Self>"
    en: Looks like you're really looking forward to it, Delta. You seem happy.
    ko: |-
      델타, 제법 기대했었나 보네?
      기뻐 보여.
    ja: |-
      内心ではだいぶ期待していたみたいだな。
      デルタ、よかったな
  event_goninjathief_01_s_64:
    speaker: miranda_c
    en: Lies!
    ko: 거짓말입니다!
    ja: それはウソです！
  event_goninjathief_01_s_65:
    speaker: miranda_c
    en: Didn't you just say in the passageway that you forgot?
    ko: 조금 전에 통로 안에서 까먹었다고 말씀하시지 않았습니까!
    ja: |-
      先ほど待機中に、
      「あ、忘れてた」と言っていました！
  event_goninjathief_01_s_66:
    speaker: miranda_c
    en: Lying is bad!
    ko: 거짓말은 나쁩니다!
    ja: ウソはいけません！
  event_goninjathief_01_s_67:
    speaker: quency_e
    en: Yeah, exactly!
    ko: 옳소 옳소~
    ja: まあまあ～
  event_goninjathief_01_s_68:
    speaker: delta
    en: Uh...
    ko: 아….
    ja: えっ…
  event_goninjathief_01_s_69:
    speaker: "<Self>"
    en: Well, that's disappointing...
    ko: 아, 실망했다.
    ja: なんだ、そういうことか…
  event_goninjathief_01_s_70:
    speaker: phantom
    en: Ahem!
    ko: 크흠!
    ja: コホンッ！
  event_goninjathief_01_s_71:
    speaker: phantom
    en: That is of no importance.
    ko: 중요한 건 그게 아니오.
    ja: 重要なのはそこではない。
  event_goninjathief_01_s_72:
    speaker: phantom
    en: What truly matters is that we have come together here.
    ko: 지금 여기, 우리가 만났다는 사실이 중요한 거지.
    ja: |-
      今ここで、我々が巡り合ったということが
      重要なのさ。
  event_goninjathief_01_s_73:
    speaker: quency_e
    en: Heh, you're quite the talker.
    ko: 말은 참 잘해~
    ja: 口は達者なんだから～
  event_goninjathief_01_s_74:
    speaker: phantom
    en: Delta, allow me to properly introduce myself.
    ko: 델타, 정식으로 인사하겠소.
    ja: デルタ、正式に挨拶しよう。
  event_goninjathief_01_s_75:
    speaker: phantom
    en: I am known as Phantom, the Phantom Thief.
    ko: 나는 괴도 팬텀이라 하오.
    ja: 私は怪盗ファントム。
  event_goninjathief_01_s_76:
    speaker: phantom
    en: Would you do me the honor of joining our noble band, the Thieves of Justice?
    ko: 부디, 정의 괴도단과 함께 하겠소?
    ja: 君も正義の怪盗団に入らないか？
  event_goninjathief_01_s_77:
    speaker: "<Monologue>"
    en: Phantom holds out her hand to Delta.
    ko: 팬텀이 델타에게 손을 내밀었다.
    ja: ファントムはデルタに手を差しだした
  event_goninjathief_01_s_78:
    speaker: delta
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_01_s_79:
    speaker: delta
    en: Yes,
    ko: 예.
    ja: はい。
  event_goninjathief_01_s_80:
    speaker: delta
    en: I shall join you.
    ko: 함께 하겠습니다.
    ja: 喜んで。
  event_goninjathief_01_s_81:
    speaker: "<Narration>"
    en: "*Clap!*"
    ko: 탁!
    ja: ガシッ！
  event_goninjathief_01_s_82:
    speaker: phantom
    en: Good. Most excellent.
    ko: 좋소, 아주 좋소.
    ja: いいだろう。
  event_goninjathief_01_s_83:
    speaker: phantom
    en: But know this!
    ko: 하지만!
    ja: だが、しかし！
  event_goninjathief_01_s_84:
    speaker: phantom
    en: The Thieves of Justice are not a band one may join so easily.
    ko: 우리 정의 괴도단은, 이렇게 쉽게 입단할 수 있는 곳이 아니오.
    ja: |-
      正義の怪盗団は誰でも
      簡単に入れるものではない。
  event_goninjathief_01_s_85:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  event_goninjathief_01_s_86:
    speaker: quency_e
    en: Wow, so that's how it was...!
    ko: 와~ 그랬구나….
    ja: わあ、そうだったんだ～？
  event_goninjathief_01_s_87:
    speaker: miranda_c
    en: That's not true!
    ko: 그렇지 않습니다!
    ja: そんなことはありません！
  event_goninjathief_01_s_88:
    speaker: miranda_c
    en: I nailed it on my first—
    ko: 저는 한 번에 바로-
    ja: 私は一発で…
  event_goninjathief_01_s_89:
    speaker: phantom
    en: Quency, if you would.
    ko: 퀀시, 부탁하오.
    ja: クエンシー、そちらは頼んだ。
  event_goninjathief_01_s_90:
    speaker: quency_e
    en: On it!
    ko: 네, 네~
    ja: は～い。
  event_goninjathief_01_s_91:
    speaker: miranda_c
    en: My first try—mmph!
    ko: 입단을… 우읍!!
    ja: 入団…もがっ！！
  event_goninjathief_01_s_92:
    speaker: quency_e
    en: Sorry, Miranda! Hang in there a bit, even if it's a little stuffy.
    ko: |-
      미안해, 미란다~
      답답해도 조금만 참아.
    ja: |-
      ミランダ、ごめんね～
      ちょ～っとだけガマンしてて？
  event_goninjathief_01_s_93:
    speaker: quency_e
    en: The great phantom thief has spoken, so there's nothing I can do. Hehe!
    ko: 위대하신 괴도 팬텀 님의 명령이라 어쩔 수 없네~ 히힛!
    ja: |-
      偉大な怪盗ファントム様の
      ご命令には背けないの～。ふふっ！
  event_goninjathief_01_s_94:
    speaker: miranda_c
    en: Mmph! Mmmph?!
    ko: 읍! 으으읍?!
    ja: むぐっ！んんん～っ！？
  event_goninjathief_01_s_95:
    speaker: phantom
    en: Ahem. Miranda can be a bit... boisterous. I ask for your understanding.
    ko: 크흠, 미란다가 조금 소란스러운 아이라… 양해를 부탁하오.
    ja: |-
      オホンッ。少々騒がしい子でな…
      気にしないでくれ。
  event_goninjathief_01_s_96:
    speaker: phantom
    en: Now then...
    ko: 아무튼.
    ja: とにかく。
  event_goninjathief_01_s_97:
    speaker: phantom
    en: To join the Thieves of Justice, one must begin as a trainee.
    ko: 정의 괴도단에 입단하려면, 수습부터 시작해야 하오.
    ja: |-
      怪盗団に入りたいのであれば、
      見習いから始める必要がある。
  event_goninjathief_01_s_98:
    speaker: phantom
    en: Should you pass all the tests, you shall be welcomed into our ranks as a full-fledged
      phantom thief.
    ko: |-
      모든 테스트에 통과하게 된다면,
      정식 괴도로서, 정의 괴도단에 들어오게 될 것이오.
    ja: |-
      これから君にいくつかテストを課す。
      そのすべてに合格すれば、
      正式な怪盗として入団を認めよう。
  event_goninjathief_01_s_99:
    speaker: delta
    en: Understood.
    ko: 이해했습니다.
    ja: 分かりました。
  event_goninjathief_01_s_100:
    speaker: delta
    en: I shall do my utmost to pass the trainee period.
    ko: 수습에 통과하기 위해, 최선을 다하겠습니다.
    ja: 合格を目指して頑張ります。
  event_goninjathief_01_s_101:
    speaker: phantom
    en: Hmm, a fine mindset.
    ko: 음, 좋은 마음가짐이오.
    ja: うむ、いい心意気だ。
  event_goninjathief_01_s_102:
    speaker: phantom
    en: 'Now, the first test:'
    ko: 그럼 첫 번째 테스트.
    ja: では、最初のテストは…
  event_goninjathief_01_s_103:
    speaker: phantom
    en: your outfit!
    ko: 바로, 의상이오!
    ja: 衣装だ！
  event_goninjathief_01_s_104:
    speaker: delta
    en: Hmm...
    ko: 음.
    ja: あ…
  event_goninjathief_01_s_105:
    speaker: delta
    en: Come to think of it, I am the only one without a mask.
    ko: 그러고 보니, 저만 가면을 쓰고 있지 않습니다.
    ja: |-
      そういえば、
      私だけ仮面をつけていませんでした。
  event_goninjathief_01_s_106:
    speaker: phantom
    en: Indeed.
    ko: 그렇소.
    ja: その通り。
  event_goninjathief_01_s_107:
    speaker: phantom
    en: Phantom thieves who roam the shadows must wear attire befitting their role.
    ko: |-
      어둠을 누비고 다니는 괴도들은,
      그에 맞는 괴도복이 필요하오.
    ja: |-
      闇を駆ける怪盗には、
      それにふさわしい衣装が必要なのだ。
  event_goninjathief_01_s_108:
    speaker: phantom
    en: And so, I shall prepare an attire that shall suit you, Delta...
    ko: 그러니 내가 델타에게 어울릴만한 괴도복을-
    ja: そこで私が、君に似合う怪盗の衣装を…
  event_goninjathief_01_s_109:
    speaker: delta
    en: Understood.
    ko: 알겠습니다.
    ja: 了解しました。
  event_goninjathief_01_s_110:
    speaker: delta
    en: I shall prepare it at the earliest possible time.
    ko: 최대한 빠른 시일 내에 준비해 보겠습니다.
    ja: ただちに用意してまいります。
  event_goninjathief_01_s_111:
    speaker: phantom
    en: Huh?
    ko: 잉?
    ja: ん？
  event_goninjathief_01_s_112:
    speaker: delta
    en: Is there anything additional I should prepare?
    ko: 추가적으로 필요한 것들이 있습니까?
    ja: 他に必要なものはございますか？
  event_goninjathief_01_s_113:
    speaker: phantom
    en: Uh...
    ko: 어….
    ja: えーと…
  event_goninjathief_01_s_114:
    speaker: phantom
    en: "... Is there anything you might wish to add?"
    ko: "…혹시 뭐 생각나는 것 있소?"
    ja: "…何か思いつくものはあるかい？"
  event_goninjathief_01_s_115:
    speaker: quency_e
    en: Nah, not really.
    ko: 딱히 없는 것 같은데~
    ja: う～ん、特にないかも～？
  event_goninjathief_01_s_116:
    speaker: miranda_c
    en: Mmph! Mmmmph!
    ko: 읍! 읍으으읍!
    ja: んんっ！んむむむっ！
  event_goninjathief_01_s_117:
    speaker: phantom
    en: And what think you of it, Monsieur?
    ko: 그대 생각은 어떻소?
    ja: 君はどう思う？
  event_goninjathief_01_s_118:
    speaker: "<Self>"
    en: I'd just like everyone to leave.
    ko: 다들 나가줬으면 좋겠어.
    ja: 全員、そろそろ出ていってくれ…
  event_goninjathief_01_s_119:
    speaker: phantom
    en: Very well. For now, we shall proceed with preparing only your phantom thief
      outfit.
    ko: 그렇다면, 일단 괴도복만 준비하는 것으로 하겠소.
    ja: |-
      よし。ならまずは、
      怪盗の衣装を用意してきてくれたまえ。
  event_goninjathief_01_s_120:
    speaker: phantom
    en: We shall reconvene in one week. Same time, same place.
    ko: 일주일 후, 같은 시간 같은 장소에서 만나지.
    ja: 1週間後、同じ時間に同じ場所で会おう。
  event_goninjathief_01_s_121:
    speaker: phantom
    en: And should you require any assistance in acquiring an outfit—
    ko: 아, 혹시 괴도복을 찾는 중 도움이 필요하다면-
    ja: ああ、もし衣装探しで困ったことがあれば…
  event_goninjathief_01_s_122:
    speaker: delta
    en: Understood.
    ko: 이해했습니다.
    ja: 分かりました。
  event_goninjathief_01_s_123:
    speaker: delta
    en: I have much to prepare, so I shall take my leave.
    ko: 준비할 것이 많아, 먼저 들어가 보겠습니다.
    ja: 準備があるので、お先に失礼いたします。
  event_goninjathief_01_s_124:
    speaker: "<Monologue>"
    en: Delta bows politely, then leaves the Commander's Room.
    ko: 델타는 깍듯하게 인사를 한 후, 지휘관실을 빠져나갔다.
    ja: |-
      デルタは丁寧に挨拶をすると、
      そのまま指揮官室を出ていった
  event_goninjathief_01_s_125:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_01_s_126:
    speaker: phantom
    en: Strange, it feels as though my words are being cut off.
    ko: 묘하게 말이 끊기는 기분이오.
    ja: なんだか話をさえぎられている気がするのだが…
  event_goninjathief_01_s_127:
    speaker: quency_e
    en: Nah, it's all in your head.
    ko: 기분 탓이야 기분 탓~
    ja: 気のせいよ、気のせい～
  event_goninjathief_01_s_128:
    speaker: miranda_c
    en: Mmph, mmph!
    ko: 읍읍~!
    ja: んん～っ！
  event_goninjathief_01_s_129:
    speaker: "<Self>"
    en: Miranda, isn't that uncomfortable...?
    ko: 미란다, 안 불편한가….
    ja: ミランダ、息苦しくはないのか…？
  event_goninjathief_01_s_130:
    speaker: "<Self>"
    en: Never mind, let's not worry about it...
    ko: 아냐, 신경을 끄자 그냥.
    ja: いや、気にしないでおこう…
event_goninjathief_01_e:
  event_goninjathief_01_e_1:
    speaker: "<Narration>"
    en: One week later, in the Commander's Room.
    ko: 일주일 후, 지휘관실.
    ja: 1週間後、指揮官室
  event_goninjathief_01_e_2:
    speaker: "<Self>"
    en: "*Sigh* Has it already been a week since then...?"
    ko: 아, 일주일 벌써 지났어. 아….
    ja: あれからもう1週間か…
  event_goninjathief_01_e_3:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컹-
    ja: ガタン…
  event_goninjathief_01_e_4:
    speaker: phantom
    en: Ah, what a splendid evening.
    ko: 후, 멋진 저녁이오.
    ja: ふむ、今宵も素敵な夜だな。
  event_goninjathief_01_e_5:
    speaker: quency_e
    en: Hi, Instructor!
    ko: 교관님, 안녕~
    ja: 教官様、ヤッホ～
  event_goninjathief_01_e_6:
    speaker: miranda_c
    en: Hello!
    ko: 안녕하십니까!
    ja: こんばんは！
  event_goninjathief_01_e_7:
    speaker: "<Self>"
    en: Oh, you guys really showed up...
    ko: 아, 진짜 왔어. 아….
    ja: 本当に来たのか…
  event_goninjathief_01_e_8:
    speaker: phantom
    en: Is Delta not here yet?
    ko: 델타는 아직인 것이오?
    ja: デルタはまだなのか？
  event_goninjathief_01_e_9:
    speaker: phantom
    en: Hmm... punctuality is of the utmost importance for a phantom thief.
    ko: 흐음, 괴도에게 시간 약속은 매우 중요한 것이거늘.
    ja: 困ったな…時間厳守は怪盗の鉄則なのだが。
  event_goninjathief_01_e_10:
    speaker: phantom
    en: I suppose we, the fully-fledged thieves who arrived on time, can only wai—
    ko: 어쩔 수 없지, 정식 괴도인 우리가 기다릴 수 밖-
    ja: |-
      仕方ない。
      正式な怪盗である私たちが待つとする…
  event_goninjathief_01_e_11:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 탁.
    ja: タンッ
  event_goninjathief_01_e_12:
    speaker: "<Monologue>"
    en: Suddenly, someone drops from the ceiling and lands on their feet.
    ko: 갑자기 천장에서 누군가가 떨어져 착지했다.
    ja: 突然、誰かが上から現れ、華麗に着地した
  event_goninjathief_01_e_13:
    speaker: quency_e
    en: Gah! You scared me!
    ko: 으앗, 깜짝이야~!
    ja: きゃっ！びっくりした～！
  event_goninjathief_01_e_14:
    speaker: quency_e
    en: Wait... who's that?
    ko: 뭐야? 누구야?
    ja: もう、いったい誰なの？
  event_goninjathief_01_e_15:
    speaker: delta_n
    en: It's me, Delta.
    ko: 델타입니다.
    ja: デルタです。
  event_goninjathief_01_e_16:
    speaker: delta_n
    en: I am now wearing the phantom thief costume you instructed me to prepare.
    ko: 준비해 오라고 하셨던 괴도복을 착용했습니다.
    ja: 言われた通り、怪盗の衣装を着てきました。
  event_goninjathief_01_e_17:
    speaker: quency_e
    en: Wow, you look like a whole new person!
    ko: 와~! 이렇게 입으니까 완전 다른 사람 같네!
    ja: わぁ～！まるで別人みたいね！
  event_goninjathief_01_e_18:
    speaker: phantom
    en: Oh...
    ko: 호오….
    ja: ほう…
  event_goninjathief_01_e_19:
    speaker: phantom
    en: And what manner of concept might this be?
    ko: 그건 어떤 컨셉이오?
    ja: その衣装のコンセプトは何だい？
  event_goninjathief_01_e_20:
    speaker: delta_n
    en: A ninja.
    ko: 닌자입니다.
    ja: 忍者です。
  event_goninjathief_01_e_21:
    speaker: delta_n
    en: 'While investigating phantom thieves, I identified a key trait of theirs:
      they move silently and with stealth.'
    ko: |-
      괴도에 대해 조사한 결과,
      은밀하고 조용하게 움직여야 한다는 특징을 발견했습니다.
    ja: |-
      怪盗について調べたところ、
      人知れず活動するのが特徴だと知りました。
  event_goninjathief_01_e_22:
    speaker: delta_n
    en: Ninjas share the same trait.
    ko: 또한, 해당 특징을 닌자도 동일하게 갖고 있었습니다.
    ja: そしてその特徴は、忍者にも当てはまります。
  event_goninjathief_01_e_23:
    speaker: delta_n
    en: As such, I selected this ninja thief attire.
    ko: 그래서 저는 괴도 닌자복을 택했습니다.
    ja: なので怪盗忍者の衣装を選んでみました。
  event_goninjathief_01_e_24:
    speaker: "<Self>"
    en: Wait, were you clinging to my ceiling this whole time?
    ko: 잠깐만, 그래서 계속 내 방 천장에 붙어있었던 거야?
    ja: まさか、ずっと天井に張りついていたのか…？
  event_goninjathief_01_e_25:
    speaker: delta_n
    en: Correct.
    ko: 맞습니다.
    ja: はい。
  event_goninjathief_01_e_26:
    speaker: delta_n
    en: I have confirmed that ninjas primarily remain on the ceiling while waiting.
    ko: 닌자는 주로 천장에서 대기한다는 정보를 확인했습니다.
    ja: 忍者は天井で待機するものだそうですので。
  event_goninjathief_01_e_27:
    speaker: "<Self>"
    en: How long have you been like that?
    ko: 언제부터 붙어있었는데?
    ja: いつから張りついていたんだ？
  event_goninjathief_01_e_28:
    speaker: delta_n
    en: I had been on standby for about an hour before you returned.
    ko: 지휘관이 지휘관실로 복귀하기 약 1시간 전부터 대기했습니다.
    ja: |-
      指揮官が指揮官室に戻られる
      1時間ほど前からです。
  event_goninjathief_01_e_29:
    speaker: delta_n
    en: A ninja must never be detected.
    ko: 닌자는 들켜서는 안 되기 때문입니다.
    ja: 忍者は人に見られてはいけませんから。
  event_goninjathief_01_e_30:
    speaker: "<Self>"
    en: So you entered my room and stuck yourself to my ceiling without asking?
    ko: |-
      그러니까 내 허락도 없이 내 방에 들어와서,
      천장에 계속 붙어있었다는 거지?
    ja: |-
      つまり、許可なく私の部屋に入って
      ずっと天井に張りついていたんだな…？
  event_goninjathief_01_e_31:
    speaker: delta_n
    en: Affirmative.
    ko: 맞습니다.
    ja: その通りです。
  event_goninjathief_01_e_32:
    speaker: "<Self>"
    en: Hey, that's trespassing...!
    ko: 무단 침입이야 이거…!
    ja: それは不法侵入だ…！
  event_goninjathief_01_e_33:
    speaker: miranda_c
    en: That's illegal!
    ko: 무단 침입은 안 됩니다!
    ja: 不法侵入はいけません！
  event_goninjathief_01_e_34:
    speaker: miranda_c
    en: I'm putting you under arrest!
    ko: 체포하겠습니다!
    ja: 逮捕します！
  event_goninjathief_01_e_35:
    speaker: "<Self>"
    en: Good job, Miranda.
    ko: 잘 한다, 미란다~!
    ja: いいぞ、ミランダ！
  event_goninjathief_01_e_36:
    speaker: delta_n
    en: I was told this is the base of the Thieves of Justice.
    ko: 이곳은 정의 괴도단의 기지라고 들었지 말입니다.
    ja: ここは正義の怪盗団の隠れ家だと聞きました。
  event_goninjathief_01_e_37:
    speaker: delta_n
    en: As a trainee, I assumed there would be no issue in visiting.
    ko: 수습 괴도로서, 기지 방문에 문제가 없다고 생각했습니다.
    ja: |-
      見習いとはいえ怪盗団の一員のため、
      隠れ家に入っても問題ないと判断したのですが…
  event_goninjathief_01_e_38:
    speaker: miranda_c
    en: Oooh!
    ko: 오오!
    ja: "…！"
  event_goninjathief_01_e_39:
    speaker: miranda_c
    en: You're absolutely right!
    ko: 맞는 말씀입니다!
    ja: おっしゃる通りです！
  event_goninjathief_01_e_40:
    speaker: miranda_c
    en: This is our hideout,
    ko: 여기는 괴도들의 공용 공간입니다.
    ja: ここは怪盗団全員のための場所。
  event_goninjathief_01_e_41:
    speaker: miranda_c
    en: so it doesn't count as trespassing!
    ko: 무단 침입이 아닙니다!
    ja: なので、不法侵入ではありません！
  event_goninjathief_01_e_42:
    speaker: delta_n
    en: Acknowledged. Thank you.
    ko: 확인, 감사드립니다.
    ja: ご理解いただき、ありがとうございます。
  event_goninjathief_01_e_43:
    speaker: "<Self>"
    en: What the... You sure changed your tune fast.
    ko: 태세 전환 뭔데.
    ja: ミランダはどちらの味方なんだ…？
  event_goninjathief_01_e_44:
    speaker: phantom
    en: A ninja thief, is it...
    ko: 괴도 닌자라.
    ja: 怪盗忍者か。
  event_goninjathief_01_e_45:
    speaker: phantom
    en: How...
    ko: 이것 참….
    ja: これはまた…
  event_goninjathief_01_e_46:
    speaker: phantom
    en: utterly unexpected.
    ko: 생각지도 못한 컨셉이군.
    ja: 斬新なコンセプトだな。
  event_goninjathief_01_e_47:
    speaker: phantom
    en: You pass the first test!
    ko: 괴도복 테스트는 합격이오!
    ja: よし。最初のテストは合格とする！
  event_goninjathief_01_e_48:
    speaker: delta_n
    en: Thank you.
    ko: 감사합니다.
    ja: ありがとうございます。
  event_goninjathief_01_e_49:
    speaker: delta_n
    en: May I ask what the next test is?
    ko: 그럼, 다음 테스트는 무엇인지 여쭤봐도 되겠습니까.
    ja: 次はどのようなテストでしょうか。
  event_goninjathief_01_e_50:
    speaker: phantom
    en: The next test
    ko: 다음 테스트는.
    ja: 次のテストは…
  event_goninjathief_01_e_51:
    speaker: phantom
    en: shall be conducted by my assistant, Quency.
    ko: 나의 조수, 퀀시가 봐줄 것이오.
    ja: 私の助手、クエンシーが担当する。
  event_goninjathief_01_e_52:
    speaker: delta_n
    en: I will be under your guidance.
    ko: 잘 부탁드립니다.
    ja: よろしくお願いいたします。
  event_goninjathief_01_e_53:
    speaker: quency_e
    en: Hehe, I'm really good at breaking ou... I mean, making escape routes.
    ko: 히힛~ 나는 탈옥… 이 아니라, 탈출 루트를 잘 뚫거든.
    ja: |-
      よろしくね～
      私は脱獄…じゃなくて、
      移動ルートを見つけるのが得意なの。
  event_goninjathief_01_e_54:
    speaker: quency_e
    en: For phantom thieves like us, who have to keep our identities secret while
      delivering justice, it's an essential skill.
    ko: |-
      우리처럼 정체를 숨기면서 정의 활동을 해야 하는 괴도들에게
      필수적으로 필요한 능력이지.
    ja: |-
      正体を隠しながら活動する怪盗にとって、
      欠かせない能力よ。
  event_goninjathief_01_e_55:
    speaker: quency_e
    en: But first, I need to see what you're capable of.
    ko: 델타의 능력을 먼저 확인해야 하니까~
    ja: |-
      ということで、
      デルタのポテンシャルを確かめるために～
  event_goninjathief_01_e_56:
    speaker: quency_e
    en: So, if you were to make an escape route from your room to our base, how would
      you do it? Think it over and get back to me by tomorrow.
    ko: |-
      만약 델타의 방에서 기지까지 탈출 루트를 뚫는다면
      어떤 식으로 뚫을 건지, 내일까지 고민해 봐.
    ja: |-
      デルタの部屋から隠れ家までの移動ルートを
      明日までに考えてきてくれるかしら？
  event_goninjathief_01_e_57:
    speaker: delta_n
    en: Understood.
    ko: 알겠습니다.
    ja: 分かりました。
  event_goninjathief_01_e_58:
    speaker: delta_n
    en: I have much to prepare, so I shall take my leave.
    ko: 준비할 것이 많아, 먼저 들어가 보겠습니다.
    ja: 準備があるので、お先に失礼いたします。
  event_goninjathief_01_e_59:
    speaker: quency_e
    en: Much to prepare?
    ko: 준비할 게 많다고?
    ja: 準備？
  event_goninjathief_01_e_60:
    speaker: quency_e
    en: I get it for the outfit, but this really doesn't need much—
    ko: 옷이야 그렇다 쳐도, 이건 딱히 준비할 거-
    ja: 衣装はともかく、ルートなら別に準備は…
  event_goninjathief_01_e_61:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 펑-!!
    ja: ボンッ！！
  event_goninjathief_01_e_62:
    speaker: quency_e
    en: Ahh!
    ko: 으악!
    ja: きゃっ！
  event_goninjathief_01_e_63:
    speaker: quency_e
    en: What the...!?
    ko: 이게 뭐야!
    ja: な、何これ…！？
  event_goninjathief_01_e_64:
    speaker: phantom
    en: "*Cough, cough!*"
    ko: 콜록! 콜록!
    ja: ケホッ！ケホッ！
  event_goninjathief_01_e_65:
    speaker: phantom
    en: A smoke bomb...!
    ko: 이건 연막탄이오…!
    ja: え、煙幕だ…！
  event_goninjathief_01_e_66:
    speaker: "<Self>"
    en: Are you crazy!? Why'd you throw something like that in my room!?
    ko: |-
      아니 미친!
      이걸 내 방에서 갑자기 왜…!
    ja: なぜ私の部屋で…！？
  event_goninjathief_01_e_67:
    speaker: miranda_c
    en: Huh? Delta's gone!
    ko: 엇, 델타가 없어졌습니다!
    ja: あっ…！デルタがいません！
  event_goninjathief_01_e_68:
    speaker: miranda_c
    en: She vanished without making a sound! She really is a ninja!
    ko: 닌자라서 정말 은밀하고 조용하게 사라졌나 봅니다!
    ja: 忍者なので人知れずそっと去ったようです！
  event_goninjathief_01_e_69:
    speaker: "<Self>"
    en: You call that not making a sound?!
    ko: 뭐가 은밀하고 조용하게야…!
    ja: 何が人知れずそっとだ…！
  event_goninjathief_01_e_70:
    speaker: "<Self>"
    en: Open the windows, quick!
    ko: 창문 열어, 창문!
    ja: 窓、窓を…！
  event_goninjathief_01_e_71:
    speaker: "<Monologue>"
    en: I finally get all the smoke from the smoke grenade out.
    ko: 간신히 연막탄의 연기를 다 빼낸 나는.
    ja: その後、私はやっとのことで煙を除去し
  event_goninjathief_01_e_72:
    speaker: "<Monologue>"
    en: By the time I can sleep, it's already late.
    ko: 늦은 시간에 간신히 잠들 수 있었고.
    ja: 夜遅くにようやく眠りについたのだった
  event_goninjathief_01_e_73:
    speaker: "<Narration>"
    en: "*Boooom!*"
    ko: 콰아아앙-!!!!
    ja: ドォォォーン！！！
  event_goninjathief_01_e_74:
    speaker: "<Monologue>"
    en: And of course, first thing in the morning, I wake up to some ungodly explosion
      going off nearby.
    ko: 이른 아침, 근처에서 들리는 어마어마한 폭발음에 잠에서 깼다.
    ja: |-
      …しかし、ようやく手に入れた安眠は、
      早朝のけたたましい爆発音とともに破られた
event_goninjathief_02_s:
  event_goninjathief_02_s_1:
    speaker: "<Self>"
    en: Zzz...
    ko: 쿨….
    ja: ぐう…
  event_goninjathief_02_s_2:
    speaker: "<Narration>"
    en: "*Boooom!*"
    ko: 콰아아앙-!!!!
    ja: ドォォォーン！！！
  event_goninjathief_02_s_3:
    speaker: "<Self>"
    en: Ahh! Wha-what's going on?
    ko: 으아악! 뭐야, 뭔데!
    ja: うわあっ！な、なんだ！？
  event_goninjathief_02_s_4:
    speaker: "<Self>"
    en: Terrorists? Raptures? Heretics?
    ko: 테러? 랩쳐? 헬레틱?!
    ja: テロ？ラプチャー？ヘレティック！？
  event_goninjathief_02_s_5:
    speaker: "<Monologue>"
    en: Worried there might be another explosion, I duck for cover and call Rapi.
    ko: |-
      나는 추가적인 폭발이 있을까 싶어,
      몸을 숨기며 라피에게 연락을 했고.
    ja: |-
      さらなる爆発に備え、
      私は身を隠しながら急いでラピに連絡した
  event_goninjathief_02_s_6:
    speaker: "<Monologue>"
    en: Moments later, the door to my room opens.
    ko: 잠시 후, 지휘관실의 문이 열렸다.
    ja: しばらくして、指揮官室のドアが開いた
  event_goninjathief_02_s_7:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_goninjathief_02_s_8:
    speaker: rapi
    en: Commander, are you okay?!
    ko: 지휘관, 괜찮으십니까?!
    ja: 指揮官、ご無事ですか！？
  event_goninjathief_02_s_9:
    speaker: "<Self>"
    en: Ah, Rapi...
    ko: 아… 라피.
    ja: あ、ああ…
  event_goninjathief_02_s_10:
    speaker: "<Self>"
    en: I'm fine, but what's going on? Are we under attack?
    ko: |-
      괜찮긴 한데, 대체 뭐야?
      공격이라도 받은 거야?
    ja: |-
      大丈夫だが、いったい何が起きているんだ？
      基地が攻撃でも受けたのか？
  event_goninjathief_02_s_11:
    speaker: rapi
    en: I'm not sure of the exact cause either.
    ko: 저도 정확한 원인은 잘 모르겠습니다만.
    ja: 詳しい原因は私もよく分かりません。
  event_goninjathief_02_s_12:
    speaker: rapi
    en: For now, all that's been confirmed is that an explosion occurred in Delta's
      room.
    ko: 우선 델타의 숙소에서 폭발이 일어났다는 것만 확인되었습니다.
    ja: |-
      ですが、デルタの宿所で爆発が発生した
      ということだけは確認できました。
  event_goninjathief_02_s_13:
    speaker: "<Self>"
    en: "... Whose room?"
    ko: "…누구의 숙소라고?"
    ja: "…誰の宿所だって？"
  event_goninjathief_02_s_14:
    speaker: rapi
    en: Delta of The Scouts.
    ko: 스카우팅 스쿼드의 델타입니다.
    ja: スカウティング部隊のデルタです。
  event_goninjathief_02_s_15:
    speaker: rapi
    en: Fortunately, the dorm is empty, so there appear to be no casualties.
    ko: 다행히 숙소는 비어 있어, 부상자는 없는 듯합니다.
    ja: |-
      幸い宿所には誰もおらず、
      負傷者は出ませんでした。
  event_goninjathief_02_s_16:
    speaker: rapi
    en: Would you like to confirm it yourself?
    ko: 확인하러 가시겠습니까.
    ja: 確かめに行かれますか？
  event_goninjathief_02_s_17:
    speaker: "<Self>"
    en: "... Yeah, let's go."
    ko: 어… 가자, 가야지.
    ja: "…ああ、行こう"
  event_goninjathief_02_s_18:
    speaker: "<Monologue>"
    en: It's a mess.
    ko: 처참했다.
    ja: 現場は悲惨だった
  event_goninjathief_02_s_19:
    speaker: "<Monologue>"
    en: The ceiling of Delta's room has collapsed, leaving a massive hole.
    ko: 델타의 방 천장이 거대한 구멍과 함께 무너져있었다.
    ja: |-
      爆発が起きたであろうデルタの部屋の天井は、
      大きな穴とともに派手に崩れていた
  event_goninjathief_02_s_20:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_s_21:
    speaker: rapi
    en: We need to find the culprit.
    ko: 범인 색출이 필요할 것 같군요.
    ja: 犯人を探す必要がありますね。
  event_goninjathief_02_s_22:
    speaker: rapi
    en: An explosion this big at the Outpost... terrorism can't be ruled out.
    ko: |-
      전초기지에서 이 정도의 폭발이라니…
      테러의 가능성도 있을 거라 봅니다.
    ja: |-
      前哨基地でこれほどの爆発となると…
      テロの可能性もあります。
  event_goninjathief_02_s_23:
    speaker: rapi
    en: But why Delta's room of all places?
    ko: 그나저나 왜 하필 델타의 방이었을까요.
    ja: |-
      ですが、なぜデルタの部屋だけが
      狙われたのでしょう…？
  event_goninjathief_02_s_24:
    speaker: rapi
    en: We should check with her first...
    ko: 델타에게 우선 확인을….
    ja: まずはデルタに話を…
  event_goninjathief_02_s_25:
    speaker: "<Self>"
    en: No, it's fine. I don't think it was a terrorist attack.
    ko: |-
      아냐, 괜찮아.
      테러는 아닐 거야.
    ja: いや、大丈夫だ。おそらくテロではない
  event_goninjathief_02_s_26:
    speaker: "<Self>"
    en: I'll check on Delta, so can you take care of the clean-up, Rapi...?
    ko: |-
      델타한테는 내가 확인해 볼테니까,
      라피는 여기를 좀 정리해 줄 수 있을까…?
    ja: |-
      デルタには私から話を聞くから、
      ここの後始末を頼めるだろうか…？
  event_goninjathief_02_s_27:
    speaker: rapi
    en: "..."
    ko: 아.
    ja: "……"
  event_goninjathief_02_s_28:
    speaker: rapi
    en: Yes, understood.
    ko: 예, 알겠습니다.
    ja: はい、分かりました。
  event_goninjathief_02_s_29:
    speaker: rapi
    en: Shall I contact Delta and have her come see you?
    ko: 델타에게 지휘관을 찾아가 보라고 따로 연락을 넣어 둘까요?
    ja: |-
      指揮官が呼んでいると
      デルタに連絡しておきましょうか？
  event_goninjathief_02_s_30:
    speaker: "<Self>"
    en: No, that's fine. I think I know where she is.
    ko: 아니, 어디 있는지 알 것 같아서 괜찮아.
    ja: いや、居場所はだいたい分かる
  event_goninjathief_02_s_31:
    speaker: rapi
    en: Are you referring to Delta?
    ko: 델타를 말입니까?
    ja: デルタのですか？
  event_goninjathief_02_s_32:
    speaker: "<Self>"
    en: Yeah, I heard something last night, actually.
    ko: 응, 어젯밤에 들은 게 좀 있거든.
    ja: ああ…昨夜、いろいろあってな
  event_goninjathief_02_s_33:
    speaker: rapi
    en: Last night...?
    ko: 어젯밤….
    ja: 昨夜…
  event_goninjathief_02_s_34:
    speaker: rapi
    en: "... It's no wonder you've been so tired lately, Commander."
    ko: "…지휘관, 최근 잠이 부족하다며 피곤해하셨던 이유가 있으셨군요."
    ja: |-
      …指揮官。最近寝不足で疲れていらっしゃるのは
      そのせいだったのですね。
  event_goninjathief_02_s_35:
    speaker: rapi
    en: Even with your stamina, you still have to get some sleep.
    ko: 아무리 체력이 좋으셔도, 잠은 주무시면서 하셔야 합니다.
    ja: |-
      体力に自信があるのは構いませんが、
      ちゃんと睡眠はとってください。
  event_goninjathief_02_s_36:
    speaker: "<Self>"
    en: I don't know what's going on in your head, but it's not like that...
    ko: 뭘 상상하는지 모르겠지만, 그런 거 아냐….
    ja: |-
      何を想像しているのかは
      分からないが、勘違いだ…
  event_goninjathief_02_s_37:
    speaker: rapi
    en: Very well, I'll leave Delta with you.
    ko: 그럼, 델타는 지휘관에게 맡기고.
    ja: では、デルタの方は指揮官にお任せいたします。
  event_goninjathief_02_s_38:
    speaker: rapi
    en: I'll send a separate report on the repair costs later.
    ko: 수리에 필요한 비용은 따로 산정해서 전달 드리겠습니다.
    ja: 修理費用についてはあとでお伝えしますね。
  event_goninjathief_02_s_39:
    speaker: "<Self>"
    en: Okay, thanks.
    ko: 그래, 부탁할게.
    ja: ああ、頼む
  event_goninjathief_02_s_40:
    speaker: "<Monologue>"
    en: I leave Rapi to handle the aftermath and head straight back to my office.
    ko: 라피에게 뒷일을 맡긴 나는, 그대로 지휘관실에 돌아갔다.
    ja: ラピに後のことを任せ、指揮官室に戻った
  event_goninjathief_02_s_41:
    speaker: "<Self>"
    en: Come out.
    ko: 나와.
    ja: 出てこい
  event_goninjathief_02_s_42:
    speaker: "<Narration>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_s_43:
    speaker: "<Self>"
    en: I said, come out.
    ko: 나오라고.
    ja: 出てこいと言った
  event_goninjathief_02_s_44:
    speaker: "<Narration>"
    en: "*Clunk*"
    ko: 덜컹-
    ja: ガタン…
  event_goninjathief_02_s_45:
    speaker: quency_e
    en: Hehe, how did you know I was here?
    ko: 히힛, 나 있는 거 어떻게 알았어?
    ja: えへっ、どうしてここにいるって分かったの？
  event_goninjathief_02_s_46:
    speaker: quency_e
    en: I heard that huge explosion and came to check it out, but you caught me right
      away.
    ko: |-
      어마무시한 소리가 들리길래 구경하러 왔는데,
      바로 들켜버렸네.
    ja: |-
      大きな音が聞こえたから見に来たんだけど、
      すぐに見つかっちゃったわね～
  event_goninjathief_02_s_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_s_48:
    speaker: "<Self>"
    en: I know you're here, Delta. Come on out.
    ko: |-
      델타, 여기 있는 거 다 알아.
      나와.
    ja: |-
      デルタ、そこにいるのは分かっている。
      出てこい
  event_goninjathief_02_s_49:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컥-
    ja: ガタッ
  event_goninjathief_02_s_50:
    speaker: "<Narration>"
    en: "*Swish* *Thud*"
    ko: 슈슉- 탁.
    ja: シュシュッ…タッ
  event_goninjathief_02_s_51:
    speaker: delta_n
    en: As expected of you, Commander.
    ko: 역시 지휘관이십니다.
    ja: さすがは指揮官ですね。
  event_goninjathief_02_s_52:
    speaker: delta_n
    en: I thought I had concealed myself perfectly.
    ko: 완벽하게 숨었다고 생각했지 말입니다.
    ja: 完璧に隠れたと思っていたのですが。
  event_goninjathief_02_s_53:
    speaker: quency_e
    en: Huh? What? Delta, where did you even come from?!
    ko: |-
      어? 뭐야?
      델타, 너 어디서 나온 거야?
    ja: えっ、デルタ？どこから出てきたの？
  event_goninjathief_02_s_54:
    speaker: delta_n
    en: I came down from the ceiling.
    ko: 천장에서 나왔습니다.
    ja: 天井裏からです。
  event_goninjathief_02_s_55:
    speaker: "<Monologue>"
    en: I look up at the ceiling
    ko: 고개를 올려 천장을 바라보자.
    ja: 天井を見上げると
  event_goninjathief_02_s_56:
    speaker: "<Monologue>"
    en: and notice a square panel that's been left open.
    ko: 네모난 뚜껑이 열려있는 것을 발견했다.
    ja: そこには四角いフタが開いていた
  event_goninjathief_02_s_57:
    speaker: "<Self>"
    en: "... Did you put a hole in my ceiling?"
    ko: "…내 방 천장을 뚫은 거야?"
    ja: "…私の部屋の天井をぶち抜いたのか？"
  event_goninjathief_02_s_58:
    speaker: delta_n
    en: Correct.
    ko: 맞습니다.
    ja: はい。
  event_goninjathief_02_s_59:
    speaker: delta_n
    en: This is one of a ninja's stealth techniques.
    ko: 닌자의 은신술 중 하나입니다.
    ja: 忍者の隠れ身の術の1つです。
  event_goninjathief_02_s_60:
    speaker: delta_n
    en: A phantom thief must move discreetly and silently. Above all, their identity
      must not be exposed.
    ko: |-
      괴도는 은밀하고 조용하게 움직여야 하고,
      정체를 들켜서는 안 됩니다.
    ja: |-
      怪盗は人知れず活動するもの。
      決して正体がバレてはなりませんので。
  event_goninjathief_02_s_61:
    speaker: "<Self>"
    en: "... Except to us, I suppose?"
    ko: 우리한테는 들켜도 되잖아….
    ja: 仲間うちなら構わないと思うが…
  event_goninjathief_02_s_62:
    speaker: delta_n
    en: One must never let their guard down.
    ko: 언제든 경계를 풀어서는 안 됩니다.
    ja: 常に警戒を緩めてはならない。
  event_goninjathief_02_s_63:
    speaker: delta_n
    en: That is what it means to be a ninja thief.
    ko: 그것이 괴도 닌자입니다.
    ja: それが怪盗忍者なのです。
  event_goninjathief_02_s_64:
    speaker: "<Self>"
    en: Do you have to be out of your mind to be a phantom thief?
    ko: 괴도는 다 제정신이 아니어야 하는 거야?
    ja: まともなやつは怪盗になれないのか…？
  event_goninjathief_02_s_65:
    speaker: quency_e
    en: Aw, come on, Instructor! Don't be like that!
    ko: |-
      에이, 교관님!
      그런 섭섭한 말 하지 말고~
    ja: もう、教官様～！そんなこと言わないでよ～
  event_goninjathief_02_s_66:
    speaker: quency_e
    en: So, what was that explosion just now?
    ko: 그래서, 아까 그 폭발은 대체 무슨 일이었던 건데?
    ja: それで、さっきの爆発はどういうことなの？
  event_goninjathief_02_s_67:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_s_68:
    speaker: "<Self>"
    en: Delta, explain.
    ko: 델타, 설명해.
    ja: デルタ、説明してくれ
  event_goninjathief_02_s_69:
    speaker: delta_n
    en: After disbanding last night, I considered escape routes from my room to the
      base until approximately 0600 hours.
    ko: |-
      어제 해산 후, 약 06시까지
      제 방에서 기지까지의 탈출 루트를 고민.
    ja: |-
      昨夜の解散後、朝の6時頃まで自分の部屋から
      ここまでの移動ルートを考えていたのですが…
  event_goninjathief_02_s_70:
    speaker: delta_n
    en: Upon devising an appropriate method, I attempted it.
    ko: 적절한 방안이 생각나서 시도하였습니다.
    ja: |-
      いい方法を思いついたので、
      実際に試してみました。
  event_goninjathief_02_s_71:
    speaker: "<Self>"
    en: And what method did you come up with?
    ko: 그게 뭐였는데?
    ja: "…どんな方法なんだ？"
  event_goninjathief_02_s_72:
    speaker: delta_n
    en: Blast a hole that reaches here with explosives.
    ko: 발파용 폭약으로 구멍을 내서 이곳까지 연결하는 것입니다.
    ja: |-
      発破用の爆薬で穴を開け、
      部屋をつなげるのです。
  event_goninjathief_02_s_73:
    speaker: "<Self>"
    en: Wait, I thought you're supposed to be quiet and sneaky... So why did you use
      explosives?
    ko: 조용하고 은밀하게 움직여야 한다면서, 폭약을 던져?
    ja: 人知れず活動するのに、爆薬だと？
  event_goninjathief_02_s_74:
    speaker: delta_n
    en: Causing a disturbance when necessary is also a method to divert attention,
    ko: |-
      필요시 소란 또는 소음을 일으키는 것 또한
      주변의 시선을 분산시키는 방법 중 하나이며,
    ja: |-
      必要に応じて騒ぎを起こすのも
      周りの注意をそらす方法の1つであり、
  event_goninjathief_02_s_75:
    speaker: delta_n
    en: thereby enabling quieter and more covert movement.
    ko: 조용하고 은밀하게 움직이기 위한 수단입니다.
    ja: 人知れず活動するための手段でもあります。
  event_goninjathief_02_s_76:
    speaker: "<Self>"
    en: "*Sigh* I can't with this..."
    ko: 하… 머리야.
    ja: はぁ…頭が…
  event_goninjathief_02_s_77:
    speaker: quency_e
    en: "... Wow,"
    ko: "…와."
    ja: "…わあ。"
  event_goninjathief_02_s_78:
    speaker: quency_e
    en: you're totally crazy, hehe!
    ko: 진짜 제정신이 아니네! 킥킥.
    ja: もしかして、ホンモノのやばい人かも～！？
event_goninjathief_02_e:
  event_goninjathief_02_e_1:
    speaker: rapi
    en: Here is the report.
    ko: 보고드립니다.
    ja: ご報告いたします。
  event_goninjathief_02_e_2:
    speaker: rapi
    en: Fortunately, thanks to the building's sturdy construction from the start,
      there was no additional damage.
    ko: |-
      다행히, 처음 지을 때부터 워낙 튼튼하게 지어진 터라
      다른 추가 피해는 없었습니다.
    ja: |-
      幸い、もともと頑丈な建物なので
      他の被害はありませんでした。
  event_goninjathief_02_e_3:
    speaker: rapi
    en: It also coincided with a scheduled inspection, so Mighty Tools is already
      handling the repairs.
    ko: |-
      마침 건물 점검 및 타이밍이라,
      마이티 툴즈가 공사를 진행 중입니다.
    ja: |-
      ちょうど建物の点検時期と重なっていたため、
      現在マイティツールズが修繕工事を
      行っているところです。
  event_goninjathief_02_e_4:
    speaker: "<Self>"
    en: I'm really glad that everything worked out...
    ko: 진짜 다행이다….
    ja: 本当によかった…
  event_goninjathief_02_e_5:
    speaker: rapi
    en: Yes, but we can't allow something like this to happen again.
    ko: 예, 다시는 이런 일이 반복되면 안 되겠지만요.
    ja: |-
      はい。今後、二度とこのようなことが
      起きてはなりません。
  event_goninjathief_02_e_6:
    speaker: rapi
    en: Have you spoken with Delta?
    ko: 그래서, 델타와는 이야기 나눠보셨습니까.
    ja: それで、デルタと話はできましたか。
  event_goninjathief_02_e_7:
    speaker: "<Self>"
    en: Uh... well...
    ko: 어어… 그-
    ja: ああ…それが…
  event_goninjathief_02_e_8:
    speaker: "<Self>"
    en: Delta isn't really sure who did it either.
    ko: 누가 그랬는지 델타도 잘 모르겠대.
    ja: 誰がやったのか、デルタも分からないらしい
  event_goninjathief_02_e_9:
    speaker: "<Self>"
    en: She said it looked like the work of some masked phantom thieves.
    ko: 가면을 쓴 괴도들이 한 짓 같다고 하던데.
    ja: |-
      仮面をつけた怪盗たちの
      しわざかもしれないと言っていた
  event_goninjathief_02_e_10:
    speaker: rapi
    en: Phantom thieves?
    ko: 괴도 말입니까.
    ja: 怪盗…ですか。
  event_goninjathief_02_e_11:
    speaker: "<Self>"
    en: Yeah...
    ko: 응….
    ja: ああ
  event_goninjathief_02_e_12:
    speaker: rapi
    en: You're saying that Delta actually mentioned phantom thieves?
    ko: 그 델타가, 괴도를 언급했단 말씀이시죠.
    ja: デルタ本人がそう言っていたのですね。
  event_goninjathief_02_e_13:
    speaker: "<Self>"
    en: Yeah...
    ko: 으응….
    ja: ああ…
  event_goninjathief_02_e_14:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_e_15:
    speaker: rapi
    en: Understood. I'll assume you handled it well.
    ko: 알겠습니다, 지휘관이 알아서 잘 얘기하신 걸로 알겠습니다.
    ja: 了解しました。指揮官を信じます。
  event_goninjathief_02_e_16:
    speaker: rapi
    en: I'll be going now.
    ko: 이만 들어가 보겠습니다.
    ja: では、失礼いたします。
  event_goninjathief_02_e_17:
    speaker: "<Self>"
    en: Okay, thanks for your hard work.
    ko: 그래, 고생 많았어.
    ja: ああ、お疲れ様
  event_goninjathief_02_e_18:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_goninjathief_02_e_19:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_e_20:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컹-
    ja: ガタン…
  event_goninjathief_02_e_21:
    speaker: phantom
    en: Hah, well now.
    ko: 훗, 이것 참.
    ja: ふっ。いやはや…
  event_goninjathief_02_e_22:
    speaker: phantom
    en: It seems we've recruited quite the extraordinary trainee.
    ko: 우리가 대단한 수습 괴도를 데려와 버린 듯하오.
    ja: |-
      どうやら私たちは、すばらしい見習い怪盗を
      スカウトしてしまったようだな。
  event_goninjathief_02_e_23:
    speaker: quency_e
    en: I know, right? Truly impressive in so many ways. Hehe.
    ko: 그러게~ 여러모로 대단하긴 하네. 킥킥.
    ja: そうね～、いろいろな意味ですばらしいわね。
  event_goninjathief_02_e_24:
    speaker: miranda_c
    en: Truly!
    ko: 정말입니다!
    ja: その通りです！
  event_goninjathief_02_e_25:
    speaker: miranda_c
    en: Hiding one's identity while still warning others of danger—that's exactly
      the sort of thing the Phantom Police would do!
    ko: |-
      정체를 숨기고 위험을 알려주는 것은,
      괴도 경찰이 할 법한 일입니다!
    ja: |-
      正体を隠して危険を伝える…
      まさに怪盗警察が取る方法です！
  event_goninjathief_02_e_26:
    speaker: miranda_c
    en: Amazing!
    ko: 대단합니다!
    ja: 本当にすばらしいです！
  event_goninjathief_02_e_27:
    speaker: phantom
    en: Now then, Quency, what say you?
    ko: 자! 그렇다면, 퀀시.
    ja: ならば、クエンシー。
  event_goninjathief_02_e_28:
    speaker: phantom
    en: Has Delta passed the test?
    ko: 어떻소, 델타의 테스트는 합격이오?
    ja: どうだ？デルタは合格か？
  event_goninjathief_02_e_29:
    speaker: quency_e
    en: Puh-lease!
    ko: 에이~ 아무리 그래도.
    ja: もぉ～、いくら何でも。
  event_goninjathief_02_e_30:
    speaker: quency_e
    en: There's no way
    ko: 합격일 리가-
    ja: 合格なわけ…
  event_goninjathief_02_e_31:
    speaker: quency_e
    en: she'd NOT pass!
    ko: 있지!
    ja: あるわ！
  event_goninjathief_02_e_32:
    speaker: "<Self>"
    en: What?
    ko: 뭣.
    ja: "！？"
  event_goninjathief_02_e_33:
    speaker: quency_e
    en: Escape is all about the spirit of challenge!
    ko: 탈출의 기본은, 도전 정신!
    ja: 脱出の基本は、チャレンジ精神！
  event_goninjathief_02_e_34:
    speaker: quency_e
    en: '"Can I escape if I do this...?"'
    ko: 이렇게 한다고 해서 나갈 수 있을까…?
    ja: こうやれば脱出できるかな…？
  event_goninjathief_02_e_35:
    speaker: quency_e
    en: '"Is this the right path...?"'
    ko: 이 길이 맞긴 한 걸까…?
    ja: このルートで合ってるかな…？
  event_goninjathief_02_e_36:
    speaker: quency_e
    en: Questions like that only slow you down!
    ko: 그런 고민이 탈출구를 만드는 속도를 늦춘다는 사실!
    ja: そんな悩みが脱出を遅らせてしまうの！
  event_goninjathief_02_e_37:
    speaker: quency_e
    en: Sure, her methods were a little over the top, but I loved how she didn't hesitate
      for a second!
    ko: |-
      방법이 조~금 과하긴 했지만,
      주저하지 않는 모습이 아주 좋았어!
    ja: |-
      やり方はちょ～っと過激だったけど、
      大胆な行動がとってもよかったわ！
  event_goninjathief_02_e_38:
    speaker: quency_e
    en: So, it's a pass!
    ko: 그러니까~ 합격!
    ja: だから、合格～！
  event_goninjathief_02_e_39:
    speaker: "<Monologue>"
    en: I thought Quency had at least some common sense...
    ko: 퀀시, 조금은 지성인이라고 생각했는데….
    ja: |-
      クエンシーのことは知性派だと
      思っていたのだが…
  event_goninjathief_02_e_40:
    speaker: "<Monologue>"
    en: I see now she's just like the rest of the Thieves of Justice.
    ko: 너도 결국 똑같은 정의 괴도단이었구나.
    ja: 結局、似た者同士の集まりということか…
  event_goninjathief_02_e_41:
    speaker: delta_n
    en: Thank you. I shall continue to improve diligently.
    ko: 감사합니다, 더욱 정진하겠습니다.
    ja: ありがとうございます。さらに精進いたします。
  event_goninjathief_02_e_42:
    speaker: quency_e
    en: But no more explosives!
    ko: 단, 앞으로 폭발물 사용은 안 돼.
    ja: でも、もう爆薬は使っちゃダメよ～？
  event_goninjathief_02_e_43:
    speaker: quency_e
    en: They're lethal and way too loud.
    ko: 살상용 무기인 데다가, 소리가 너무 커.
    ja: 殺傷用の武器だし、音が大きすぎるから。
  event_goninjathief_02_e_44:
    speaker: quency_e
    en: All escape attempts have to be quiet and sneaky,
    ko: 탈출 역시 은밀하고 조용하게 해야 하는 법이니까.
    ja: 脱出も人知れずやってこそ、ね。
  event_goninjathief_02_e_45:
    speaker: quency_e
    en: okay?
    ko: 알겠지~?
    ja: 分かった～？
  event_goninjathief_02_e_46:
    speaker: delta_n
    en: Understood.
    ko: 이해했습니다.
    ja: 分かりました。
  event_goninjathief_02_e_47:
    speaker: delta_n
    en: I will dispose of all grenades and explosives in my possession.
    ko: 소지 중인 수류탄 및 폭발물 등은 모두 폐기 하겠습니다.
    ja: |-
      所持中の手榴弾と爆薬は
      すべて処分いたします。
  event_goninjathief_02_e_48:
    speaker: "<Self>"
    en: Why would you throw them away? They're supplies issued to you.
    ko: 보급받은 거잖아, 뭔 폐기야.
    ja: 補給品を処分するのはどうかと思うが…
  event_goninjathief_02_e_49:
    speaker: delta_n
    en: But that is something supplied under Delta's name.
    ko: 그것은 델타의 이름으로 보급받은 것입니다.
    ja: あれはデルタ宛てに補給されたものです。
  event_goninjathief_02_e_50:
    speaker: "<Self>"
    en: Then... who are you?
    ko: 그럼 너는 누군데?
    ja: "…どういう意味だ？"
  event_goninjathief_02_e_51:
    speaker: delta_n
    en: I am the ninja thief.
    ko: 저는 괴도 닌자입니다.
    ja: 今の私は怪盗忍者。
  event_goninjathief_02_e_52:
    speaker: delta_n
    en: I consider them entirely separate entities.
    ko: 엄연히 다른 존재라 생각합니다.
    ja: あくまで別の存在ですので。
  event_goninjathief_02_e_53:
    speaker: miranda_c
    en: Exactly!
    ko: 맞습니다!
    ja: その通りです！
  event_goninjathief_02_e_54:
    speaker: miranda_c
    en: I'm also the Phantom Police!
    ko: 저도 괴도 경찰입니다!
    ja: 私も今は怪盗警察ですので！
  event_goninjathief_02_e_55:
    speaker: miranda_c
    en: Normally, Miranda can freely walk in and out of the police station!
    ko: 원래 미란다는 경찰서에 마음껏 드나들 수 있습니다!
    ja: 本来のミランダは警察署に出入りできますが！
  event_goninjathief_02_e_56:
    speaker: miranda_c
    en: But if the Phantom Police tried that, it would be a huge problem!
    ko: 하지만 괴도 경찰인 채로 경찰서에 들어가면 큰일 납니다!
    ja: |-
      怪盗警察の姿で警察署に入れば
      大問題になります！
  event_goninjathief_02_e_57:
    speaker: miranda_c
    en: They're entirely different entities!
    ko: 엄연히 다른 존재입니다!
    ja: なので、別の存在です！
  event_goninjathief_02_e_58:
    speaker: "<Self>"
    en: Okay, never mind.
    ko: 아 됐고.
    ja: "……"
  event_goninjathief_02_e_59:
    speaker: "<Self>"
    en: What's the next test?
    ko: 다음 테스트 뭔데.
    ja: それで、次のテストの内容は？
  event_goninjathief_02_e_60:
    speaker: phantom
    en: Miranda shall oversee
    ko: 다음 테스트는.
    ja: 次のテストは…
  event_goninjathief_02_e_61:
    speaker: phantom
    en: the next test.
    ko: 미란다가 봐줄 것이오.
    ja: ミランダが担当する。
  event_goninjathief_02_e_62:
    speaker: delta_n
    en: I will be under your guidance.
    ko: 잘 부탁드립니다.
    ja: よろしくお願いいたします。
  event_goninjathief_02_e_63:
    speaker: miranda_c
    en: Delta, a phantom thief must be righteous.
    ko: 델타, 괴도는 정의로워야 합니다.
    ja: |-
      よろしくお願いいたします！
      さっそくですが、怪盗は正義の味方ですので…
  event_goninjathief_02_e_64:
    speaker: miranda_c
    en: So, you're going to take the justice test!
    ko: 그러니 정의 테스트를 볼 겁니다!
    ja: |-
      次のテストではデルタの正義感を
      チェックいたします！
  event_goninjathief_02_e_65:
    speaker: delta_n
    en: How will this be conducted?
    ko: 어떤 식으로 진행됩니까.
    ja: 具体的には、何をすればいいのでしょうか？
  event_goninjathief_02_e_66:
    speaker: miranda_c
    en: You have to return the citizens' lost items without anyone finding out who
      you are!
    ko: |-
      정체를 들키지 않고,
      시민들이 잃어버린 물건을 찾아주면 됩니다!
    ja: |-
      正体がバレることなく、
      市民の捜し物を見つけてください！
  event_goninjathief_02_e_67:
    speaker: miranda_c
    en: I've only managed it once myself so far!
    ko: 저도 지금까지 딱 한 번 성공했습니다.
    ja: 私も成功したのは今までで一度だけです。
  event_goninjathief_02_e_68:
    speaker: miranda_c
    en: This is going to be a really tough test, I tell you!
    ko: 어려운 테스트가 될 겁니다!
    ja: それだけ今回は難しいですよ！
  event_goninjathief_02_e_69:
    speaker: delta_n
    en: Understood.
    ko: 이해했습니다.
    ja: 分かりました。
  event_goninjathief_02_e_70:
    speaker: delta_n
    en: I have much to prepare, so I shall take my leave.
    ko: 준비할 것이 많아, 먼저 들어가 보겠습니다.
    ja: 準備があるので、お先に失礼いたします。
  event_goninjathief_02_e_71:
    speaker: "<Self>"
    en: Wa-wait!
    ko: 자, 잠깐!
    ja: ま、待った！
  event_goninjathief_02_e_72:
    speaker: "<Self>"
    en: Don't use a smoke—
    ko: 연막탄은 안ㄷ….
    ja: 煙幕はやめ――
  event_goninjathief_02_e_73:
    speaker: "<Narration>"
    en: "*Whoooosh*"
    ko: 피유우우웅~
    ja: ヒュゥゥゥン！
  event_goninjathief_02_e_74:
    speaker: "<Narration>"
    en: "*Bang!* *Pop, pop!*"
    ko: 펑! 퍼펑!
    ja: パン、パパン！
  event_goninjathief_02_e_75:
    speaker: miranda_c
    en: Wow...!
    ko: 와…!
    ja: わあ…！
  event_goninjathief_02_e_76:
    speaker: miranda_c
    en: Fireworks are going off outside!
    ko: 밖에 폭죽이 터지고 있습니다!
    ja: 外から花火の音がします！
  event_goninjathief_02_e_77:
    speaker: miranda_c
    en: Did a festival start or something?
    ko: 무슨 축제라도 열렸습니까?
    ja: お祭りでもやっているのでしょうか？
  event_goninjathief_02_e_78:
    speaker: phantom
    en: Ho, how lovely.
    ko: 호오, 아름답소.
    ja: おお、きれいだな。
  event_goninjathief_02_e_79:
    speaker: quency_e
    en: Huh?
    ko: 음~?
    ja: う～ん…？
  event_goninjathief_02_e_80:
    speaker: quency_e
    en: But... where did these fireworks even come from?!
    ko: 그런데 갑자기 웬 폭죽?
    ja: でも、どうして急に花火が…？
  event_goninjathief_02_e_81:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컥-
    ja: ガタッ
  event_goninjathief_02_e_82:
    speaker: phantom
    en: Hah...! Delta has vanished!
    ko: 헛…! 델타가 사라졌소.
    ja: ハッ…！デルタがいないぞ…！？
  event_goninjathief_02_e_83:
    speaker: phantom
    en: I see now.
    ko: 그렇군.
    ja: "…なるほど。"
  event_goninjathief_02_e_84:
    speaker: phantom
    en: 'So this, too, is the art of a ninja thief: to steal our attention and vanish
      without a sound.'
    ko: |-
      이 또한, 우리의 시선을 뺏은 후 소리 없이 떠나는
      괴도 닌자의 이동술인가 보오.
    ja: |-
      相手の注意をそらして去る…
      これも怪盗忍者の移動手段なのだろう。
  event_goninjathief_02_e_85:
    speaker: phantom
    en: My word... truly an extraordinary fellow!
    ko: 이것 참…! 정말 물건이구만!
    ja: 実に見事だ…！
  event_goninjathief_02_e_86:
    speaker: "<Narration>"
    en: "*Whoooosh*"
    ko: 피유우우웅~
    ja: ヒュゥゥゥン！
  event_goninjathief_02_e_87:
    speaker: "<Narration>"
    en: "*Bang!* *Pop, pop!*"
    ko: 펑! 펑! 퍼펑!
    ja: パン！パン！パパパーン！
  event_goninjathief_02_e_88:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_02_e_89:
    speaker: "<Self>"
    en: So pretty...
    ko: 예쁘다….
    ja: きれいだな…
event_goninjathief_03_s:
  event_goninjathief_03_s_1:
    speaker: miranda_c
    en: This is where today's test will take place!
    ko: 오늘의 테스트 장소는, 이곳입니다!
    ja: 本日のテスト会場はこちらです！
  event_goninjathief_03_s_2:
    speaker: miranda_c
    en: The park's really cool at night and perfect for a stroll.
    ko: 밤 공원은 아주 시원합니다, 그리고 산책하기 좋습니다.
    ja: 夜の公園は涼しいため、散歩にうってつけです。
  event_goninjathief_03_s_3:
    speaker: miranda_c
    en: So lots of people come here,
    ko: 그래서 시민들이 많이 몰립니다.
    ja: 市民がたくさん集まる場であり…
  event_goninjathief_03_s_4:
    speaker: miranda_c
    en: and naturally, quite a few things end up getting lost!
    ko: 그만큼, 분실물도 많이 나옵니다.
    ja: |-
      そのぶん落とし物や忘れ物が
      出やすいということでもあります！
  event_goninjathief_03_s_5:
    speaker: delta_n
    en: Understood.
    ko: 확인했습니다.
    ja: 分かりました。
  event_goninjathief_03_s_6:
    speaker: delta_n
    en: I shall do my utmost.
    ko: 최선을 다하겠습니다.
    ja: ベストを尽くします。
  event_goninjathief_03_s_7:
    speaker: "<Monologue>"
    en: Delta puts on her mask and starts darting between the trees, scanning the
      surroundings.
    ko: |-
      델타는 가면을 착용한 후,
      나무 사이를 뛰어다니며 주변을 둘러보기 시작했다.
    ja: |-
      デルタは仮面をつけると、
      木々の間を駆けながら周囲を見回した
  event_goninjathief_03_s_8:
    speaker: "<Self>"
    en: "... Did she actually take ninja classes or something?"
    ko: "…진짜 닌자 수업이라도 받았나?"
    ja: "…本当に忍者の修行でもしてきたのか？"
  event_goninjathief_03_s_9:
    speaker: quency_e
    en: Look closely and you'll see sparks flying from her toes.
    ko: 잘 보면, 발끝에서 불꽃이 터지는 게 보여.
    ja: 見て、足元で火花が散ってるわ。
  event_goninjathief_03_s_10:
    speaker: quency_e
    en: Guess she's using them for propulsion?
    ko: 저걸로 추진력을 얻고 있는 것 같은데?
    ja: あれが推進力になってるんじゃない？
  event_goninjathief_03_s_11:
    speaker: quency_e
    en: If you're curious, ask her about it later!
    ko: 궁금하면 이따 자세히 물어보지 그래~?
    ja: 気になるなら後で聞いてみれば～？
  event_goninjathief_03_s_12:
    speaker: "<Self>"
    en: No, it's okay...
    ko: 아냐, 됐어….
    ja: いや、いい…
  event_goninjathief_03_s_13:
    speaker: littlegirl
    en: Waah! Waaaaaah!
    ko: 우엥~ 우에엥~
    ja: うう、ぐすっ…
  event_goninjathief_03_s_14:
    speaker: littlegirl
    en: Buy it for me! Pweeease!
    ko: 나 이거 사줘~ 사줘어~
    ja: ママぁ～！買ってってばぁ～！
  event_goninjathief_03_s_15:
    speaker: whitewoman
    en: Tsk!
    ko: 쓰읍!!
    ja: もうっ！
  event_goninjathief_03_s_16:
    speaker: whitewoman
    en: I already told you no!
    ko: 엄마가 안 된다고 했지?!
    ja: ダメだって言ったでしょう！？
  event_goninjathief_03_s_17:
    speaker: "<Narration>"
    en: "*Swish!*"
    ko: 슈슉!
    ja: シュシュッ！
  event_goninjathief_03_s_18:
    speaker: littlegirl
    en: Eek?!
    ko: 흐익…?!
    ja: ひっ…！？
  event_goninjathief_03_s_19:
    speaker: delta_n
    en: Little girl, what is the reason you are crying?
    ko: 소녀, 울고 있는 이유가 무엇입니까.
    ja: どうして泣いているのですか？
  event_goninjathief_03_s_20:
    speaker: delta_n
    en: Have you perhaps lost something?
    ko: 혹시 무언가를 잃어버렸습니까?
    ja: もしかして、何かなくしましたか？
  event_goninjathief_03_s_21:
    speaker: littlegirl
    en: Wa-waaah...
    ko: 후, 훌쩍….
    ja: ぐすっ…
  event_goninjathief_03_s_22:
    speaker: littlegirl
    en: M-Mommy promised to buy me a treat,
    ko: 어, 엄마가 분명 붕어빵 사준댔는데…!
    ja: ママがたい焼き買ってくれるって言ったのに…！
  event_goninjathief_03_s_23:
    speaker: littlegirl
    en: but she didn't...! Waaah...!
    ko: 안 사줘서…! 흐윽…!
    ja: 買ってくれないんだもん…！ひっく…！
  event_goninjathief_03_s_24:
    speaker: whitewoman
    en: When did I ever say that?
    ko: 엄마가 언제 그랬어!
    ja: ママはそんなこと言ってません！
  event_goninjathief_03_s_25:
    speaker: whitewoman
    en: Hey, don't worry about it and just go on your way...
    ko: 저기요, 괜히 신경 쓰지 마시고 그냥 갈 길 가….
    ja: あの、どうぞ気になさらないでくださ…
  event_goninjathief_03_s_26:
    speaker: delta_n
    en: Understood.
    ko: 확인했습니다.
    ja: 分かりました。
  event_goninjathief_03_s_27:
    speaker: "<Narration>"
    en: "*Swoooosh* *Thunk!*"
    ko: 슈루루루룩- 탁!
    ja: シュッ、ポトッ！
  event_goninjathief_03_s_28:
    speaker: "<Monologue>"
    en: Delta hurls something square and familiar.
    ko: 델타가 익숙하게 생긴 네모난 무언가를 던졌고.
    ja: デルタが四角い何かを投げると…
  event_goninjathief_03_s_29:
    speaker: "<Monologue>"
    en: It skids to a stop right at the girl's feet.
    ko: 그것은 여자아이의 발 앞에서 멈췄다.
    ja: 女の子の足元に落ちた
  event_goninjathief_03_s_30:
    speaker: delta_n
    en: Combat rations.
    ko: 전투 식량입니다.
    ja: 戦闘糧食です。
  event_goninjathief_03_s_31:
    speaker: delta_n
    en: This will allow you reclaim the fullness you have lost.
    ko: 잃어버린 배부름을 찾을 수 있을 겁니다.
    ja: なくした満腹感が見つかるはずです。
  event_goninjathief_03_s_32:
    speaker: littlegirl
    en: Huh...?
    ko: 에…?
    ja: えっ…？
  event_goninjathief_03_s_33:
    speaker: delta_n
    en: I will take my leave.
    ko: 그럼, 이만.
    ja: では、失礼。
  event_goninjathief_03_s_34:
    speaker: "<Narration>"
    en: "*Whooosh!*"
    ko: 슉!
    ja: シュッ！
  event_goninjathief_03_s_35:
    speaker: littlegirl
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_03_s_36:
    speaker: whitewoman
    en: Combat... rations...?
    ko: 전투… 식량…?
    ja: 戦闘…糧食…？
  event_goninjathief_03_s_37:
    speaker: littleboy
    en: Wow, Dad! Look! A toy sword!
    ko: 와! 아빠, 저기 장난감 칼!
    ja: わあ…！パパ見て！おもちゃの剣だよ！
  event_goninjathief_03_s_38:
    speaker: littleboy
    en: I want it!
    ko: 저거 갖고 싶어요!
    ja: ボク、あれほしい！
  event_goninjathief_03_s_39:
    speaker: glassesman
    en: Hmm, it's a bit too pricey to buy it here.
    ko: 음, 여기서 사는 건 너무 비싼데.
    ja: うーん…ここで買うと高いんだよな…
  event_goninjathief_03_s_40:
    speaker: glassesman
    en: How about we get one at the supermarket tomorrow?
    ko: 내일 아빠랑 마트 가서 사자, 어때?
    ja: よし、明日パパとスーパーに行こう。
  event_goninjathief_03_s_41:
    speaker: littleboy
    en: Ahh! Noooo!
    ko: 아아~! 싫어요!
    ja: ええ～！ヤダヤダ！
  event_goninjathief_03_s_42:
    speaker: littleboy
    en: I want that one!
    ko: 저는 저게 갖고 싶다고요~!
    ja: ボクあれがほしいの～！
  event_goninjathief_03_s_43:
    speaker: "<Narration>"
    en: "*Swish!*"
    ko: 슈슉!
    ja: シュシュッ！
  event_goninjathief_03_s_44:
    speaker: littleboy
    en: Whoa!
    ko: 헐.
    ja: わっ…！
  event_goninjathief_03_s_45:
    speaker: littleboy
    en: Where did you just come from? Are you a hero or something?
    ko: 누나, 방금 어디서 날아왔어요? 히어로 같은 거예요?
    ja: |-
      お姉ちゃん、どこから出てきたの？
      もしかしてヒーロー？
  event_goninjathief_03_s_46:
    speaker: delta_n
    en: Little boy, what is the reason you are throwing a tantrum?
    ko: 소년, 떼를 쓰는 이유가 무엇입니까.
    ja: どうして駄々をこねていたのですか？
  event_goninjathief_03_s_47:
    speaker: delta_n
    en: Have you perhaps lost something?
    ko: 혹시 무언가를 잃어버렸습니까?
    ja: もしかして、何かなくしましたか？
  event_goninjathief_03_s_48:
    speaker: littleboy
    en: What? Oh...
    ko: 네? 아….
    ja: えっ？あ…
  event_goninjathief_03_s_49:
    speaker: littleboy
    en: I just wanted that sword...
    ko: 저 그냥 저 칼이 갖고 싶어서….
    ja: あの剣が欲しくて…
  event_goninjathief_03_s_50:
    speaker: delta_n
    en: Understood.
    ko: 확인했습니다.
    ja: 分かりました。
  event_goninjathief_03_s_51:
    speaker: "<Narration>"
    en: "*Thud* *Tink, tink*"
    ko: 툭- 툭툭-
    ja: ガサガサッ…
  event_goninjathief_03_s_52:
    speaker: "<Narration>"
    en: "*Clang!* *Crash!*"
    ko: 챙그랑~! 챙그랑~!
    ja: カシャンッ、ドサドサ…！
  event_goninjathief_03_s_53:
    speaker: littleboy
    en: Wowee!
    ko: 우와…!!!
    ja: うわぁ…！！
  event_goninjathief_03_s_54:
    speaker: glassesman
    en: "...?"
    ko: "……???"
    ja: "……？？？"
  event_goninjathief_03_s_55:
    speaker: littleboy
    en: Shuriken, chains, grappling hooks, ink, scrolls...
    ko: 수리검, 쇠사슬, 갈고리, 먹물, 두루마리….
    ja: 手裏剣に鎖、フックにイカスミ、それに巻物…？
  event_goninjathief_03_s_56:
    speaker: littleboy
    en: What's all this?!
    ko: 이게 다 뭐예요?!
    ja: お姉ちゃん、これは…？
  event_goninjathief_03_s_57:
    speaker: delta_n
    en: Weapons have been supplied.
    ko: 무기 보급입니다.
    ja: 武器の補給です。
  event_goninjathief_03_s_58:
    speaker: delta_n
    en: They may be impractical for actual combat,
    ko: 실전에서 사용하기엔 무리가 있지 말입니다.
    ja: 実戦で使えるものではありませんが…
  event_goninjathief_03_s_59:
    speaker: delta_n
    en: but they will prove more effective than those toys.
    ko: 적어도 저 장난감들보다는 효과가 좋을 겁니다.
    ja: おもちゃよりは役に立つかと思います。
  event_goninjathief_03_s_60:
    speaker: glassesman
    en: N-no, miss, we really don't need thi—
    ko: 아, 아니 저희는 이런 거 필요 없-
    ja: べ、別にいりませ…
  event_goninjathief_03_s_61:
    speaker: delta_n
    en: These will allow you to reclaim the combat power you have lost.
    ko: 잃어버린 전투력을 찾을 수 있을 겁니다.
    ja: なくした戦闘力が見つかるはずです。
  event_goninjathief_03_s_62:
    speaker: "<Narration>"
    en: "*Whooosh!*"
    ko: 슉!
    ja: シュッ！
  event_goninjathief_03_s_63:
    speaker: glassesman
    en: Hey! Hey...?!
    ko: 저기요! 저기요…?!
    ja: ちょっ、ちょっと…！？
  event_goninjathief_03_s_64:
    speaker: littleboy
    en: Woooooow! This is awesome!
    ko: 와아아~!! 신난다!
    ja: わあぁ～い！！やったー！
  event_goninjathief_03_s_65:
    speaker: drunkman
    en: Ughhh...
    ko: 으어어~~
    ja: うう～…
  event_goninjathief_03_s_66:
    speaker: drunkman
    en: Feels like my head's splitting open...
    ko: 머리 깨지겠네~~
    ja: 頭が割れそうだぁ～…
  event_goninjathief_03_s_67:
    speaker: drunkman
    en: Bring me booze, now! If I stop drinking, I'll sober up and the hangover'll
      kill meee!!
    ko: |-
      술 가져와, 술!
      술을 못 마시니까 술이 깨면서 숙취가 오잖아아악!!
    ja: |-
      酒だ！酒を持ってこ～い！
      酒が切れると頭が痛くなるんだよぉ！！
  event_goninjathief_03_s_68:
    speaker: "<Narration>"
    en: "*Swish!*"
    ko: 슈슉!
    ja: シュシュッ！
  event_goninjathief_03_s_69:
    speaker: drunkman
    en: Huh?
    ko: 의?
    ja: ん？
  event_goninjathief_03_s_70:
    speaker: delta_n
    en: Have you perhaps lost something?
    ko: 혹시 무언가를 잃어버렸습니까?
    ja: もしかして、何かなくしましたか？
  event_goninjathief_03_s_71:
    speaker: drunkman
    en: I sure did! I lost my booze!
    ko: 그래! 술 잃어버렸다!
    ja: ああ！酒をなくして困ってるところだ！
  event_goninjathief_03_s_72:
    speaker: drunkman
    en: Quick, bring it here!
    ko: 어서 갖고 와~!
    ja: 早く持ってこーい！
  event_goninjathief_03_s_73:
    speaker: delta_n
    en: Understood.
    ko: 확인했습니다.
    ja: 分かりました。
  event_goninjathief_03_s_74:
    speaker: "<Narration>"
    en: "*Thump* *Thump, thump*"
    ko: 툭- 투투툭-
    ja: ドサッ、ドサドサッ
  event_goninjathief_03_s_75:
    speaker: drunkman
    en: Wh-what's this...?
    ko: 이, 이게 뭐여…?
    ja: な、なんだこれは…？
  event_goninjathief_03_s_76:
    speaker: delta_n
    en: These are scrolls for learning various jutsu.
    ko: 다양한 술법들을 익힐 수 있는 술책들입니다.
    ja: さまざまな忍術が学べる本です。
  event_goninjathief_03_s_77:
    speaker: drunkman
    en: Scrolls...? Why're you givin' me these?
    ko: 책…? 책을 왜 주는 건데?
    ja: 本…？俺は酒を持ってこいって言ったはずだぞ？
  event_goninjathief_03_s_78:
    speaker: delta_n
    en: It seems you have not lost alcohol, but your composure.
    ko: |-
      술을 잃어버린 게 아니라
      온화함을 잃어버린 것 같지 말입니다.
    ja: |-
      なくしたのはお酒ではなく、
      穏やかな心のようでしたので。
  event_goninjathief_03_s_79:
    speaker: delta_n
    en: By reading, you can calm your mind and regain the composure you have lost.
    ko: |-
      독서를 하며 마음을 편하게 만들면,
      잃어버린 온화함을 찾게 되실 겁니다.
    ja: |-
      読書で気持ちを落ち着かせれば、
      なくした穏やかな心が見つかるはずです。
  event_goninjathief_03_s_80:
    speaker: delta_n
    en: I have already read them all, so I shall give them to you.
    ko: 저는 이미 다 읽었으므로, 드리겠습니다.
    ja: 私は全部読みましたので、差し上げます。
  event_goninjathief_03_s_81:
    speaker: drunkman
    en: "...?"
    ko: "……?"
    ja: "…？"
  event_goninjathief_03_s_82:
    speaker: drunkman
    en: "... What the heck is this crap?"
    ko: "…뭔 헛소리야?"
    ja: "…何言ってんだ？"
  event_goninjathief_03_s_83:
    speaker: "<Monologue>"
    en: Delta zips around the park, returning things that people must have lost...
    ko: |-
      델타는 빠른 속도로 돌아다니며,
      사람들이 잃어버린….
    ja: |-
      その後もデルタは公園を駆け回り、
      人々がなくした…
  event_goninjathief_03_s_84:
    speaker: "<Monologue>"
    en: or maybe things they did not even realize were missing.
    ko: "…게 맞는지 모르겠는 것들을 뿌리며 다녔다."
    ja: "…かどうか分からないものを配っていった"
  event_goninjathief_03_s_85:
    speaker: miranda_c
    en: Ah...
    ko: 아….
    ja: あ…
  event_goninjathief_03_s_86:
    speaker: miranda_c
    en: Uh...!
    ko: 아아…!
    ja: ああ…！
event_goninjathief_03_e:
  event_goninjathief_03_e_1:
    speaker: delta_n
    en: The test lasted for about an hour.
    ko: 약 1시간 동안 테스트를 진행하였습니다.
    ja: 1時間ほどテストを行い…
  event_goninjathief_03_e_2:
    speaker: delta_n
    en: In total, I have returned lost items to 38 people.
    ko: 총 38명의 사람에게 분실물을 돌려주었습니다.
    ja: 全部で38人に遺失物を返還いたしました。
  event_goninjathief_03_e_3:
    speaker: delta_n
    en: Having confirmed that there are no longer any visitors in the park, I, the
      ninja thief, have returned.
    ko: |-
      더 이상 해당 공원의 유동 인구가 없는 것을 확인,
      괴도 델타 복귀했습니다.
    ja: |-
      公園での人の出入りがなくなったため、
      怪盗デルタ、ただいま戻りました。
  event_goninjathief_03_e_4:
    speaker: "<Self>"
    en: You're the reason everyone left the park...
    ko: 너 때문에 공원에서 사람들이 다 나갔잖아….
    ja: 人がいなくなったのはデルタのせいだと思うが…
  event_goninjathief_03_e_5:
    speaker: miranda_c
    en: D-Delta...!
    ko: 데, 델타…!
    ja: デ、デルタ…！
  event_goninjathief_03_e_6:
    speaker: miranda_c
    en: That...
    ko: 정말….
    ja: 本当に…
  event_goninjathief_03_e_7:
    speaker: miranda_c
    en: was incredible!
    ko: 정말 대단합니다!!
    ja: 本当にすばらしいです！
  event_goninjathief_03_e_8:
    speaker: miranda_c
    en: So many people lost things tonight, and you returned every single one!
    ko: |-
      시민들이 오늘따라 많은 것을 잃어버렸는데,
      그걸 전부 돌려주었습니다!
    ja: |-
      今日は一段と遺失物が多かったはずですが、
      それを全部返しきるなんて…！
  event_goninjathief_03_e_9:
    speaker: miranda_c
    en: I really respect you!
    ko: 존경스럽습니다!
    ja: 心から尊敬いたします！
  event_goninjathief_03_e_10:
    speaker: delta_n
    en: "... You flatter me."
    ko: "…칭찬 부끄럽지 말입니다."
    ja: "…お褒めに預かり恐縮です。"
  event_goninjathief_03_e_11:
    speaker: miranda_c
    en: No, really, you deserve all the praise today!
    ko: 아닙니다, 오늘의 델타는 정말 존경받아도 됩니다.
    ja: |-
      かしこまらないでください！
      今日のデルタの活躍は尊敬に値するものです！
  event_goninjathief_03_e_12:
    speaker: miranda_c
    en: You're the very embodiment of justice!
    ko: 정의로웠습니다!
    ja: まさに正義の味方でした！
  event_goninjathief_03_e_13:
    speaker: phantom
    en: Even I must marvel at your speed and judgment.
    ko: 나조차도 감탄할 수준의 속도와 판단력이었소.
    ja: |-
      ああ、この私も感心するほどの
      行動力と判断力だった。
  event_goninjathief_03_e_14:
    speaker: delta_n
    en: Thank you.
    ko: 감사합니다.
    ja: ありがとうございます。
  event_goninjathief_03_e_15:
    speaker: phantom
    en: Well then, Miranda, what's your verdict?
    ko: 그래, 어떻소 미란다.
    ja: ミランダ、どうだい？
  event_goninjathief_03_e_16:
    speaker: phantom
    en: Has she passed the test?
    ko: 테스트는 합격이오?
    ja: テストは合格か？
  event_goninjathief_03_e_17:
    speaker: miranda_c
    en: Of course!
    ko: 물론입니다!
    ja: もちろんです！
  event_goninjathief_03_e_18:
    speaker: miranda_c
    en: Delta absolutely must become a phantom thief!
    ko: 델타는 반드시 괴도가 되어야 합니다!
    ja: デルタは怪盗になるべきです！
  event_goninjathief_03_e_19:
    speaker: phantom
    en: Yes, most satisfactory!
    ko: 흠! 아주 좋소.
    ja: ふむ、よろしい。
  event_goninjathief_03_e_20:
    speaker: "<Self>"
    en: Hmm? Where's Quency?
    ko: 응? 그런데 퀀시는 어디 갔어?
    ja: "…ん？クエンシーはどこに行ったんだ？"
  event_goninjathief_03_e_21:
    speaker: delta_n
    en: A short while ago, she glanced back and entered the manhole.
    ko: |-
      조금 전, 뒤를 보시더니
      맨홀 구멍 안으로 들어갔지 말입니다.
    ja: |-
      つい先ほど、後ろを振り返るなり
      マンホールの中に入っていきました。
  event_goninjathief_03_e_22:
    speaker: "<Self>"
    en: Huh? What's back there...?
    ko: 뒤? 뒤에 뭐가 있는….
    ja: 後ろ？後ろに何が…
  event_goninjathief_03_e_23:
    speaker: poli
    en: So, there are reports of a suspicious woman giving out suspicious items here?
    ko: |-
      그러니까, 여기서 수상한 여자가
      수상한 물건을 준다는 신고가 들어왔다고영?
    ja: |-
      つまり、ここで怪しい女性が怪しいものを
      配っていた…ということですかぁ？
  event_goninjathief_03_e_24:
    speaker: quiry
    en: That's right,
    ko: 맞아요.
    ja: そのようです。
  event_goninjathief_03_e_25:
    speaker: quiry
    en: there are 16 reports in total.
    ko: 16건의 신고가 들어왔어요.
    ja: 似たような通報が16件もありました。
  event_goninjathief_03_e_26:
    speaker: quiry
    en: Most people said the items they got seemed pretty useful...
    ko: 대부분은 그럴싸한 걸 얻어서 나쁘지 않았다고는 하지만….
    ja: |-
      それなりに欲しかったものをもらえたためか、
      悪い気はしなかったそうですが…
  event_goninjathief_03_e_27:
    speaker: quiry
    en: but since they came from some suspicious masked person in black, they were
      a bit uneasy about it.
    ko: |-
      검은 옷에 가면을 쓴 수상한 사람이 준 거라
      아무래도 찜찜하다 하시네요.
    ja: |-
      黒ずくめに仮面の怪しい人物だったので、
      少し気味が悪かった…とのことです。
  event_goninjathief_03_e_28:
    speaker: poli
    en: 16 cases already and it hasn't even been an hour... This is bad.
    ko: 1시간도 안 돼서 16건이라닝… 심각하네영.
    ja: |-
      1時間もしないうちに16件とは…
      深刻ですねぇ。
  event_goninjathief_03_e_29:
    speaker: poli
    en: I'll take the left, so Quiry, you cover the right.
    ko: 제가 왼쪽을 볼 테니깡, 키리가 오른쪽을 봐줘영.
    ja: |-
      私は左側を捜しますので、
      キリは右側をお願いしますねぇ。
  event_goninjathief_03_e_30:
    speaker: quiry
    en: Will do!
    ko: 네, 알겠습니다!
    ja: 了解しました！
  event_goninjathief_03_e_31:
    speaker: miranda_c
    en: Oh!
    ko: 어!
    ja: あっ！
  event_goninjathief_03_e_32:
    speaker: miranda_c
    en: Poli, Quir—
    ko: 폴리이~ 키ㄹ….
    ja: ポリ！キ…
  event_goninjathief_03_e_33:
    speaker: miranda_c
    en: Mmph! Mmmph...!
    ko: 읍! 으읍…!!
    ja: んぐっ！んんんっ…！！
  event_goninjathief_03_e_34:
    speaker: "<Self>"
    en: Be quiet, Miranda...!
    ko: 조용히 해, 미란다…!
    ja: 静かにしてくれ、ミランダ…！
  event_goninjathief_03_e_35:
    speaker: miranda_c
    en: Mmmmphh...!
    ko: 으으으읍…!
    ja: ううううっ…！
  event_goninjathief_03_e_36:
    speaker: "<Self>"
    en: Save the hugs for the police station.
    ko: 안아주는 건 다음에 경찰서에서 해.
    ja: ハグなら今度警察署ですればいいだろう？
  event_goninjathief_03_e_37:
    speaker: "<Self>"
    en: Do you want to write another 10 disciplinary reports?!
    ko: 또 시말서 10장 쓰고 싶어…?!
    ja: また始末書を10枚書きたいのか…！？
  event_goninjathief_03_e_38:
    speaker: miranda_c
    en: Mmmph...!
    ko: 읍…!
    ja: むぐっ…！
  event_goninjathief_03_e_39:
    speaker: miranda_c
    en: Ugghhh...
    ko: 으우….
    ja: うう…
  event_goninjathief_03_e_40:
    speaker: phantom
    en: "*Gasp!* They're coming this way."
    ko: 헛…! 이쪽으로 오고 있소.
    ja: むっ、こちらに向かってくるぞ。
  event_goninjathief_03_e_41:
    speaker: phantom
    en: We'd best make our escape.
    ko: 도망가는 게 좋겠소.
    ja: 私たちも逃げよう。
  event_goninjathief_03_e_42:
    speaker: "<Narration>"
    en: "*Whoooosh*"
    ko: 슈슈슉-
    ja: サササッ――
  event_goninjathief_03_e_43:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_03_e_44:
    speaker: poli
    en: "*Sniff* *Sniff sniff*"
    ko: 킁, 킁킁.
    ja: クン、クンクン。
  event_goninjathief_03_e_45:
    speaker: poli
    en: Hmmmmm...
    ko: 흐으으음….
    ja: う～～ん…
  event_goninjathief_03_e_46:
    speaker: phantom
    en: Ahem.
    ko: 크흠.
    ja: コホン。
  event_goninjathief_03_e_47:
    speaker: phantom
    en: Delta, never before has anyone passed the test in so short a span.
    ko: 이렇게 단기간에 테스트를 통과한 건, 델타가 최초요.
    ja: |-
      こんな短期間でテストに合格したのは
      デルタが初めてだ。
  event_goninjathief_03_e_48:
    speaker: "<Monologue>"
    en: Figures, it's their first time running these tests, after all...
    ko: 그렇겠지, 테스트 처음 해보는 거니까….
    ja: 当たり前だ。テスト自体が初めてなのだから…
  event_goninjathief_03_e_49:
    speaker: phantom
    en: And now, the time has come for my test.
    ko: 그리고, 드디어 나의 테스트 차례가 왔소.
    ja: 次はついに私のテストだ。
  event_goninjathief_03_e_50:
    speaker: phantom
    en: It shall unfold amidst actual fieldwork.
    ko: 내 테스트는, 실전과 함께 진행될 것이오.
    ja: |-
      私のテストでは、
      実践能力をチェックさせてもらう。
  event_goninjathief_03_e_51:
    speaker: delta_n
    en: "... This is a real mission?"
    ko: "…실전 말입니까."
    ja: 実践…ですか。
  event_goninjathief_03_e_52:
    speaker: phantom
    en: Quite so.
    ko: 그렇소.
    ja: いかにも。
  event_goninjathief_03_e_53:
    speaker: delta_n
    en: What sort of test is it?
    ko: 어떤 것입니까.
    ja: どのような内容でしょうか？
  event_goninjathief_03_e_54:
    speaker: phantom
    en: For this,
    ko: 바로.
    ja: ずばり！
  event_goninjathief_03_e_55:
    speaker: phantom
    en: you are to send a calling card!
    ko: 예고장을 보내는 것이오!!
    ja: 予告状の送り方だ！！
  event_goninjathief_03_e_56:
    speaker: delta_n
    en: A calling card...
    ko: 예고장이라면….
    ja: 予告状、と言いますと…
  event_goninjathief_03_e_57:
    speaker: delta_n
    en: Am I to take it as a warning notice sent to the enemy?
    ko: 적들에게 보내는 경고문이라 생각하면 됩니까.
    ja: 敵に送る警告文のようなものでしょうか？
  event_goninjathief_03_e_58:
    speaker: phantom
    en: Something like that, yes.
    ko: 뭐, 비슷하오.
    ja: まあ、似たようなものだ。
  event_goninjathief_03_e_59:
    speaker: phantom
    en: 'To explain the situation precisely:'
    ko: 상황을 정확히 설명하자면.
    ja: さっそくだが、詳細を説明しよう。
  event_goninjathief_03_e_60:
    speaker: phantom
    en: the one upon whom we shall carry out justice is a pickpocket, who stole a
      man's bag the other day.
    ko: |-
      우리가 정의를 행할 자는 소매치기로,
      지난번에 한 남성의 가방을 훔쳤다고 하오.
    ja: |-
      今回の悪人はスリの常習犯だ。
      先日、とある男性がバッグを盗まれたらしい。
  event_goninjathief_03_e_61:
    speaker: phantom
    en: It was said to contain many precious things.
    ko: |-
      아주 소중한 것들이 많이 있는,
      그런 가방이었다고 했지.
    ja: 中には大事な物がたくさん入っているそうだ。
  event_goninjathief_03_e_62:
    speaker: phantom
    en: We intend to steal it back and return it to its rightful owner, so compose
      your calling card with that in mind.
    ko: |-
      우리는 그 가방을 다시 훔쳐 주인에게 돌려줄 예정이니,
      관련된 내용으로 쓰면 될 것이오.
    ja: |-
      我々はそのバッグを盗み、持ち主に
      返すつもりだ。その予告状を書いてほしい。
  event_goninjathief_03_e_63:
    speaker: phantom
    en: Now then, allow me to show you the ones I have used in the past.
    ko: 그럼, 기존에 사용했던 예고장들을 보여주겠소.
    ja: 参考として、以前書いたものをお見せしよう。
  event_goninjathief_03_e_64:
    speaker: "<Narration>"
    en: "*Slide*"
    ko: 스윽-
    ja: スッ――
  event_goninjathief_03_e_65:
    speaker: "<Narration>"
    en: '"Tonight, we Phantom Thieves will retrieve the real item which has caused the rightful owner so much distress."'
    ko: |-
      [오늘 밤, 다른 이의 눈물을 흘리게 했던
      진짜 물건을 되찾아 가겠소.]
    ja: |-
      「今宵、ある者に涙を流させた
      本物の指輪をいただきに参上する」
  event_goninjathief_03_e_66:
    speaker: "<Narration>"
    en: '"Thieves of Justice"'
    ko: "[정의 괴도단.]"
    ja: "「正義の怪盗団」"
  event_goninjathief_03_e_67:
    speaker: delta_n
    en: Understood.
    ko: 확인했습니다.
    ja: 分かりました。
  event_goninjathief_03_e_68:
    speaker: delta_n
    en: This calling card carries significant meaning.
    ko: 상당히 많은 의미가 내포되어 있는 예고장이지 말입니다.
    ja: 色々な意味が読み取れる予告状ですね。
  event_goninjathief_03_e_69:
    speaker: phantom
    en: The more refined one's literary skill, the more elegant a calling card one
      may compose.
    ko: |-
      문학적 소양이 뛰어날수록,
      수려한 예고장을 쓸 수 있는 법이오.
    ja: |-
      文学的センスが高いほど
      秀逸な予告状が書けるものだ。
  event_goninjathief_03_e_70:
    speaker: phantom
    en: Now then, I look forward to seeing what kind of calling card you will pen—
    ko: 어디, 델타는 어떤 예고장을 써내려 갈지 기대가-
    ja: 君がどんな予告状を書くのか期待して…
  event_goninjathief_03_e_71:
    speaker: delta_n
    en: I have much to prepare, so I shall take my leave.
    ko: 준비할 것이 많아, 먼저 들어가 보겠습니다.
    ja: 準備があるので、お先に失礼いたします。
  event_goninjathief_03_e_72:
    speaker: "<Narration>"
    en: "*Swish!*"
    ko: 슈슉-!
    ja: シュシュッ！
  event_goninjathief_03_e_73:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_03_e_74:
    speaker: phantom
    en: It seems I'm not merely imagining that my words are being cut off.
    ko: 내 말이 끊기는 건 기분 탓이 아닌 것 같소.
    ja: |-
      話をさえぎられるのは、
      やはり気のせいではないようだな…
  event_goninjathief_03_e_75:
    speaker: phantom
    en: To listen to another's words in their entirety is, too, a virtue a phantom
      thief ought to possess!
    ko: |-
      온전히 다른 사람의 말을 끝까지 듣는 것 또한
      괴도로서 가져야 할 소양이거늘!
    ja: |-
      人の話を最後まで聞くのは、
      怪盗として欠かせない素養なのに…！
  event_goninjathief_03_e_76:
    speaker: "<Self>"
    en: You always cut off my—
    ko: 내 말은 맨날 끊으면ㅅ….
    ja: 私の話はいつもさえぎ…
  event_goninjathief_03_e_77:
    speaker: phantom
    en: Next time I see her, I shall give her a stern talking-to.
    ko: 다음에 보면 따끔하게 이야기해야겠소.
    ja: 今度会ったら、しっかりと言い聞かせなくては。
  event_goninjathief_03_e_78:
    speaker: phantom
    en: In any case, you two have done well today.
    ko: 아무튼, 두 분도 오늘 수고 많았소.
    ja: |-
      さて…何はともあれ、
      2人とも今日はご苦労だった。
  event_goninjathief_03_e_79:
    speaker: phantom
    en: When the Thieves of Justice next mobilize, let us meet then.
    ko: |-
      다음은 정의 괴도단, 출동이니
      그때 만나도록 하세.
    ja: |-
      次はいよいよ正義の怪盗団の出動だ。
      その時にまた会おう。
  event_goninjathief_03_e_80:
    speaker: miranda_c
    en: Today was really wonderful!
    ko: 정말 멋진 하루였습니다!
    ja: はい！今日もとてもいい1日でした！
  event_goninjathief_03_e_81:
    speaker: miranda_c
    en: I'll see you all next time!
    ko: 다음에 뵙겠습니다!
    ja: またお会いしましょう！
  event_goninjathief_03_e_82:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컹-
    ja: ガタン…
  event_goninjathief_03_e_83:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_03_e_84:
    speaker: "<Self>"
    en: No one listens to me anymore...
    ko: 내 말은 아무도 안 들어주네.
    ja: 私の話は誰も聞いてくれないのだな…
  event_goninjathief_03_e_85:
    speaker: "<Self>"
    en: They don't even bother using the door...
    ko: 이제 문으로는 다니지도 않네.
    ja: もうドアも通らないのか…
  event_goninjathief_03_e_86:
    speaker: "<Self>"
    en: I feel so lonely...
    ko: 외롭다 외로워….
    ja: なんなんだ、この寂しい気持ちは…
event_goninjathief_intermission_01:
  event_goninjathief_intermission_01_1:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 휘이잉~
    ja: ヒュウゥ…
  event_goninjathief_intermission_01_2:
    speaker: phantom
    en: Now that it seems everyone is here,
    ko: 다 모인 것 같으니.
    ja: みんな、集まったようだな。
  event_goninjathief_intermission_01_3:
    speaker: phantom
    en: let us first take a look at the calling card Delta has prepared.
    ko: 델타가 준비해 온 예고장을 먼저 보도록 하겠소.
    ja: まずはデルタが作った予告状を見るとしよう。
  event_goninjathief_intermission_01_4:
    speaker: delta_n
    en: Here it is, as ordered.
    ko: 여기 있습니다.
    ja: どうぞ。
  event_goninjathief_intermission_01_5:
    speaker: phantom
    en: Hmm?
    ko: 음?
    ja: "…ん？"
  event_goninjathief_intermission_01_6:
    speaker: phantom
    en: The quantity seems rather excessive.
    ko: 양이 너무 많은 것 같소만.
    ja: ずいぶんな量だな。
  event_goninjathief_intermission_01_7:
    speaker: phantom
    en: Did you, by any chance, write this knowing that it would need to be thrown
      multiple times?
    ko: 혹시 여러 번 던져야 한다는 것을 알고 이렇게 작성한 것이오?
    ja: |-
      何度も投げることを想定して
      多めに用意したのかい？
  event_goninjathief_intermission_01_8:
    speaker: delta_n
    en: The calling card was too small to contain my full intent.
    ko: |-
      제 의도를 전부 작성하기에는
      예고장의 크기가 너무 작았습니다.
    ja: |-
      いえ、私の思いをすべて書くには
      予告状は小さすぎたので…
  event_goninjathief_intermission_01_9:
    speaker: delta_n
    en: Therefore, I divided the content across several cards.
    ko: 그래서 일부 내용을 나누어서 작성하였습니다.
    ja: 複数に分けて書いてきました。
  event_goninjathief_intermission_01_10:
    speaker: phantom
    en: Oho,
    ko: 오호.
    ja: ほう。
  event_goninjathief_intermission_01_11:
    speaker: phantom
    en: Miranda, read it out loud.
    ko: 미란다, 큰 소리로 읽어보시오.
    ja: ミランダ、大きな声で読んでみたまえ。
  event_goninjathief_intermission_01_12:
    speaker: miranda_c
    en: Got it!
    ko: 알겠습니다!
    ja: 分かりました！
  event_goninjathief_intermission_01_13:
    speaker: miranda_c
    en: '"Be warned!"'
    ko: 예! 고! 장!
    ja: "「予告状」！！！"
  event_goninjathief_intermission_01_14:
    speaker: miranda_c
    en: '"I am one who walks in the shadows—a thief of truth, taking darkness as my
      ally."'
    ko: |-
      나는 그림자 속을 걷는 자요,
      어둠을 벗 삼아 진실을 빼앗는 자입니다!
    ja: |-
      「我こそは影を歩き、
      闇と語らい真実を奪う者」！
  event_goninjathief_intermission_01_15:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔랑.
    ja: パラッ
  event_goninjathief_intermission_01_16:
    speaker: miranda_c
    en: '"Through secret investigation and relentless pursuit, I have confirmed that
      what you now hold is not yours,"'
    ko: |-
      나의 은밀한 조사와 치밀한 추적 끝에,
      그대가 현재 소유하고 있는 것이!
    ja: |-
      「秘密裏に行った、緻密な調査と追跡により、
      貴方の所有するバッグは」！
  event_goninjathief_intermission_01_17:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔랑.
    ja: パラッ
  event_goninjathief_intermission_01_18:
    speaker: miranda_c
    en: '"and have come into your hands through unjust means!"'
    ko: |-
      그대의 것이 아니며, 불의한 경로를 거쳐
      손에 들어갔음을 확인하게 되었습니다!
    ja: |-
      「貴方自身の物ではなく、不正な手段を通じて
      手に入れたことが判明した」！
  event_goninjathief_intermission_01_19:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔랑.
    ja: パラッ
  event_goninjathief_intermission_01_20:
    speaker: miranda_c
    en: '"Ill-gotten gains must be returned to their rightful place. This principle
      stands beneath both moonlight and sunlight alike."'
    ko: |-
      부당이득은 반드시 제자리로 돌아가야 하며,
      이 원칙은 달빛 아래서도 햇빛 아래서도 같습니다!
    ja: |-
      「不当に手に入れたものは元の持ち主に
      返さなくてはならない。
      その原則はどこであろうと変わることはない」！
  event_goninjathief_intermission_01_21:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔랑.
    ja: パラッ
  event_goninjathief_intermission_01_22:
    speaker: miranda_c
    en: '"Justice is such that, at times, one must first set foot into darkness before
      the light may be reached!"'
    ko: |-
      정의란 때로 빛이 움직이기 전에
      어둠 속에서 먼저 발을 떼야 하는 법입니다!
    ja: |-
      「正義とは、時に光が届く前に
      闇の中で執行されるもの」！
  event_goninjathief_intermission_01_23:
    speaker: "<Self>"
    en: Just a sec...
    ko: 잠깐만.
    ja: 待ってくれ
  event_goninjathief_intermission_01_24:
    speaker: miranda_c
    en: Yes, Commander?
    ko: 예, 지휘관!
    ja: はい！なんでしょうか、指揮官！
  event_goninjathief_intermission_01_25:
    speaker: "<Self>"
    en: How many cards are left?
    ko: 몇 장 남았어?
    ja: あと何枚あるんだ…？
  event_goninjathief_intermission_01_26:
    speaker: miranda_c
    en: Let me count now!
    ko: 바로 세어보겠습니다!
    ja: いま数えてみますね！
  event_goninjathief_intermission_01_27:
    speaker: miranda_c
    en: One, two, three, four...
    ko: 하나, 둘, 셋, 넷….
    ja: いち、に、さん、し…
  event_goninjathief_intermission_01_28:
    speaker: "<Self>"
    en: Or rather, roughly how many are left?
    ko: 아니, 대략 몇 장 남았어?
    ja: いや、だいたいで大丈夫だ
  event_goninjathief_intermission_01_29:
    speaker: miranda_c
    en: About 40!
    ko: 대략 40장 정도 남았습니다!
    ja: ええと…あと40枚ほどあります！
  event_goninjathief_intermission_01_30:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_intermission_01_31:
    speaker: quency_e
    en: Pfft!
    ko: 푸흡…!
    ja: ププッ…！
  event_goninjathief_intermission_01_32:
    speaker: quency_e
    en: A calling card? Please... this is practically a letter!
    ko: 이건 예고장이 아니라 편지 아냐~?
    ja: もはや予告状じゃなくて手紙じゃな～い？
  event_goninjathief_intermission_01_33:
    speaker: phantom
    en: Hmm...
    ko: 흠.
    ja: ふっ…
  event_goninjathief_intermission_01_34:
    speaker: phantom
    en: Delta, I must acknowledge your skill with words, yet this seems rather long.
    ko: |-
      델타, 당신의 글솜씨는 인정하는 부분이지만
      이건 너무 긴 것 같소.
    ja: |-
      デルタ。君の文才は認めるが、
      これでは長すぎる。
  event_goninjathief_intermission_01_35:
    speaker: phantom
    en: Do you see that open window over there?
    ko: 저기 열린 창문이 보이시오?
    ja: あそこの開いている窓が見えるかい？
  event_goninjathief_intermission_01_36:
    speaker: delta_n
    en: Yes.
    ko: 잘 보입니다.
    ja: はい、見えます。
  event_goninjathief_intermission_01_37:
    speaker: phantom
    en: You'll need to throw several calling cards through that, in hopes that at
      least one gets through.
    ko: |-
      저 안으로 예고장을 여러 번 던져서
      하나라도 들어갈 수 있게 해야 하오.
    ja: |-
      予告状はあの窓に向かって何度も投げて、
      1通入ればいいんだ。
  event_goninjathief_intermission_01_38:
    speaker: phantom
    en: Since not all of them will, everything must be written on a single card...
    ko: |-
      그런데 이 모든 예고장이 다 들어갈 수는 없으니,
      한 장에 내용이 다 들어가도록 해야만….
    ja: |-
      100通投げて100通入るわけではない。
      だから1通だけで内容が伝わるように書く…
  event_goninjathief_intermission_01_39:
    speaker: "<Narration>"
    en: "*Flick, flick*"
    ko: 팔랑- 팔랑-
    ja: ヒラヒラ…
  event_goninjathief_intermission_01_40:
    speaker: quency_e
    en: Uh... if you toss it like that, it's never gonna make it through the window!
    ko: |-
      어, 그렇게 공중에 던져버리면
      창문 안에 안 들어갈 텐데?
    ja: |-
      あっ！そんなふうに空中に投げたら
      窓に入らな――
  event_goninjathief_intermission_01_41:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 슉-!!
    ja: シュッ！
  event_goninjathief_intermission_01_42:
    speaker: "<Narration>"
    en: "*Flick* *Thunk!*"
    ko: 촤라라락, 탁!
    ja: "…タンッ！"
  event_goninjathief_intermission_01_43:
    speaker: quency_e
    en: Wow! That's epic!
    ko: 헐, 대박.
    ja: えっ、すごっ！！
  event_goninjathief_intermission_01_44:
    speaker: miranda_c
    en: Wow...!
    ko: 와…!
    ja: わあ…！
  event_goninjathief_intermission_01_45:
    speaker: miranda_c
    en: Th-that's amazing!
    ko: 대, 대단합니다!
    ja: す、すごいです！
  event_goninjathief_intermission_01_46:
    speaker: phantom
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_goninjathief_intermission_01_47:
    speaker: "<Monologue>"
    en: Delta flings the calling cards into the air.
    ko: 하늘을 향해 예고장들을 던진 델타는.
    ja: デルタは宙に予告状をばらまくと
  event_goninjathief_intermission_01_48:
    speaker: "<Monologue>"
    en: Then she throws a rod-shaped shuriken, puncturing and pinning the cards mid-flight.
    ko: |-
      창수형 수리검을 던져,
      예고장들을 맞추었고.
    ja: 矢じり型の手裏剣を投げて予告状に命中させた
  event_goninjathief_intermission_01_49:
    speaker: "<Monologue>"
    en: The shuriken flies through the window with the cards, and lodges itself in
      the wall.
    ko: 수리검은 그대로 창문 안으로 들어가, 벽에 꽂혔다.
    ja: |-
      手裏剣はそのまま窓を通り抜け、
      壁へと突き刺さった
  event_goninjathief_intermission_01_50:
    speaker: delta_n
    en: This should let you fit them all in.
    ko: 이렇게 하면 전부 넣을 수 있습니다.
    ja: こうすればすべて送りつけることができます。
  event_goninjathief_intermission_01_51:
    speaker: phantom
    en: Ho ho! Truly splendid!
    ko: 호, 호오오! 이것 참 대단하오!
    ja: おおお…！すばらしい！
  event_goninjathief_intermission_01_52:
    speaker: phantom
    en: Ahem... very good. You've passed the calling card test.
    ko: |-
      크흠, 아주 좋소.
      예고장 테스트도 합격이오.
    ja: |-
      コホンッ…実に見事だった。
      予告状を送るテストは合格だ。
  event_goninjathief_intermission_01_53:
    speaker: phantom
    en: Now, Delta, exactly when did you say you would carry out your phantom thief
      missions?
    ko: |-
      그럼, 델타.
      정확히 언제 괴도 활동을 하겠다고 예고를 했소?
    ja: |-
      ところで、デルタ。
      予告状にはいつ盗みに行くと書いたんだい？
  event_goninjathief_intermission_01_54:
    speaker: phantom
    en: Usually, one would write tonight, or perhaps tomorrow night.
    ko: 보통 오늘 밤, 또는 내일 밤으로 쓰긴 했었는데 말이오.
    ja: 通常は今宵、あるいは明日の夜と書くのだが。
  event_goninjathief_intermission_01_55:
    speaker: delta_n
    en: I judged that the sooner the better, so I wrote "tonight."
    ko: 빠를수록 좋을 것 같아, 오늘 밤으로 작성했습니다.
    ja: |-
      早ければ早いほどいいと思い、
      今宵と書きました。
  event_goninjathief_intermission_01_56:
    speaker: phantom
    en: Very well.
    ko: 알겠소.
    ja: 分かった。
  event_goninjathief_intermission_01_57:
    speaker: phantom
    en: Tonight, the Thieves of Justice shall convene once more to bring justice to
      evil.
    ko: |-
      오늘 밤, 정의 괴도단은 다시 한번 모여서
      악을 처단하게 될 것이오.
    ja: |-
      今宵、再び集結した正義の怪盗団が
      悪に裁きを下そう。
  event_goninjathief_intermission_01_58:
    speaker: delta_n
    en: Please wait a moment.
    ko: 잠시 기다려 주시지 말입니다.
    ja: その前に、少しよろしいでしょうか？
  event_goninjathief_intermission_01_59:
    speaker: phantom
    en: Hmm? Might there be a problem?
    ko: 음? 무슨 문제라도 있소?
    ja: ん？何か問題でもあるのかい？
  event_goninjathief_intermission_01_60:
    speaker: delta_n
    en: I have not yet formally joined the Thieves of Justice.
    ko: 저는 아직 정의 괴도단에 정식으로 입단하지 못했습니다.
    ja: |-
      私はまだ、正義の怪盗団に
      正式に入団していません。
  event_goninjathief_intermission_01_61:
    speaker: phantom
    en: Well... you're still a trainee, after all.
    ko: 뭐… 아직 수습이니, 그렇소.
    ja: ああ…君はまだ見習いだからな。
  event_goninjathief_intermission_01_62:
    speaker: delta_n
    en: Therefore, I did not compose the calling card in the name of the Thieves of
      Justice.
    ko: 그래서 정의 괴도단의 이름으로 예고장을 작성하지 않았습니다.
    ja: |-
      ですので、正義の怪盗団の名で
      予告状を書いておりません。
  event_goninjathief_intermission_01_63:
    speaker: quency_e
    en: Huh? So what'd you write?
    ko: 엥? 그럼 뭐라고 썼는데?
    ja: えっ…？じゃあ、なんて書いたの？
  event_goninjathief_intermission_01_64:
    speaker: delta_n
    en: I wrote "Trainee Ninja Thief."
    ko: 수습 괴도 닌자라고 작성했습니다.
    ja: 見習い怪盗忍者と書きました。
  event_goninjathief_intermission_01_65:
    speaker: phantom
    en: Ah...
    ko: 아….
    ja: えっ…
  event_goninjathief_intermission_01_66:
    speaker: phantom
    en: Well, that's quite all right!
    ko: 뭐, 괜찮소!
    ja: "…ま、まあいいとも！"
  event_goninjathief_intermission_01_67:
    speaker: phantom
    en: From my prior investigation, it seems this wicked fellow is always away from
      home during the day,
    ko: |-
      내가 미리 조사해 봤을 때,
      여기 사는 악한 자는 낮에는 집을 계속 비웠었소.
    ja: |-
      調べたところによると、ここに住む悪人は
      日中は留守にしていることが多い。
  event_goninjathief_intermission_01_68:
    speaker: phantom
    en: likely roaming about to pickpocket others.
    ko: |-
      다른 이들을 소매치기하려고
      돌아다니는 것이라 생각되오.
    ja: |-
      どうやら、日中はスリのターゲットを
      探しに街に出ているようだ。
  event_goninjathief_intermission_01_69:
    speaker: phantom
    en: So, if we were to slip inside now and amend the calling card—
    ko: |-
      그러니, 지금 집으로 잠입해서
      예고장 내용을 수정 해두면-
    ja: |-
      ゆえに、今すぐ家に潜入して
      予告状を修正すれば…
  event_goninjathief_intermission_01_70:
    speaker: miranda_c
    en: Oh no! The homeowner's back!
    ko: 어! 집주인이 방에 들어왔습니다.
    ja: あっ！家主らしき人が帰ってきました！
  event_goninjathief_intermission_01_71:
    speaker: phantom
    en: That can't be!
    ko: 그럴리가!
    ja: なんだと！？
  event_goninjathief_intermission_01_72:
    speaker: miranda_c
    en: He's found the calling card!
    ko: 예고장을 발견했습니다!
    ja: 予告状を見つけました！
  event_goninjathief_intermission_01_73:
    speaker: miranda_c
    en: Oh... ohhh...!
    ko: 오. 오오오…!
    ja: あ、あああ…！
  event_goninjathief_intermission_01_74:
    speaker: miranda_c
    en: He's making a call!
    ko: 어디론가 전화를 합니다!
    ja: どこかに電話をかけています！
  event_goninjathief_intermission_01_75:
    speaker: "<Narration>"
    en: "♪♬♪♬♪♬"
    ko: "♪~ ♬~"
    ja: "♪~ ♬~"
  event_goninjathief_intermission_01_76:
    speaker: miranda_c
    en: Oh! That's the A.C.P.U. emergency line ringtone!
    ko: 엇, 이건 A.C.P.U. 신고 전화 전용 벨소리입니다!
    ja: |-
      あっ！これはA.C.P.U.の
      通報専用ダイヤルの着信音です！
  event_goninjathief_intermission_01_77:
    speaker: miranda_c
    en: I'll just answer this real quick!
    ko: 저 잠시 전화 좀 받고 오겠습니다!
    ja: 少し電話に出てきますね！
  event_goninjathief_intermission_01_78:
    speaker: "<Narration>"
    en: "*Tap tap tap*"
    ko: 다다다다-
    ja: ダダダダッ――
  event_goninjathief_intermission_01_79:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_intermission_01_80:
    speaker: quency_e
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_intermission_01_81:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_intermission_01_82:
    speaker: "<Narration>"
    en: "*Tap tap tap*"
    ko: 다다다다-
    ja: ダダダダッ――
  event_goninjathief_intermission_01_83:
    speaker: miranda_c
    en: Oh no! We're in trouble!
    ko: 크, 큰일 났습니다!
    ja: た、大変です！
  event_goninjathief_intermission_01_84:
    speaker: miranda_c
    en: Someone reported that the trainee ninja thief is coming tonight!
    ko: 오늘 밤, 수습 괴도 닌자가 찾아올 거라는 신고가 들어왔습니다!
    ja: |-
      見習い怪盗忍者が今夜、
      民家に盗みに入るという通報がありました！
  event_goninjathief_intermission_01_85:
    speaker: miranda_c
    en: "... What should we do now?"
    ko: "…이제 어떡합니까?"
    ja: "…どうしましょう？"
event_goninjathief_04_s:
  event_goninjathief_04_s_1:
    speaker: phantom
    en: This...
    ko: 정말….
    ja: ふむ…
  event_goninjathief_04_s_2:
    speaker: phantom
    en: is truly troubling.
    ko: 정말 곤란하오.
    ja: 実に困ったことになったな。
  event_goninjathief_04_s_3:
    speaker: phantom
    en: Delta is still just a trainee, and yet she must go in alone...
    ko: 아직 수습인 델타 혼자서 들어가야 한다니 말이오…!
    ja: |-
      まさか、見習いのデルタ一人で
      行くことになるとは…！
  event_goninjathief_04_s_4:
    speaker: "<Self>"
    en: Hold on...
    ko: 아니, 근데.
    ja: |-
      見習い怪盗忍者というのは
      あくまで呼称の一つなのだから
  event_goninjathief_04_s_5:
    speaker: "<Self>"
    en: Even if it says "Trainee Ninja Thief," can't the Thieves of Justice just step
      in?
    ko: |-
      수습 괴도 닌자라고 썼어도
      그냥 정의 괴도단이 나서면 되는 거 아냐?
    ja: 正義の怪盗団全員で行けばいいんじゃないのか？
  event_goninjathief_04_s_6:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 쾅!!
    ja: バン！！
  event_goninjathief_04_s_7:
    speaker: phantom
    en: What nonsense are you saying, Monsieur!?
    ko: 그게, 무슨 소리오 그대!
    ja: 何を言っているんだ、君は！！
  event_goninjathief_04_s_8:
    speaker: phantom
    en: Don't you remember our oath beneath the peach tree?
    ko: 우리 모두 복숭아나무 아래에서 약속하지 않았소!
    ja: 桃の木の下で誓いを立てただろう！
  event_goninjathief_04_s_9:
    speaker: phantom
    en: Once a Thief of Justice, always a Thief of Justice!
    ko: 한 번 정의 괴도단은 영원한 정의 괴도단!!
    ja: 正義の怪盗団は永久に不滅だと！！
  event_goninjathief_04_s_10:
    speaker: "<Self>"
    en: I never swore to anything like that.
    ko: 한 적 없어 그런 거.
    ja: 作り話をするな
  event_goninjathief_04_s_11:
    speaker: phantom
    en: Anyway, to act under a multitude of names is a violation of the Thief Code.
    ko: |-
      아무튼, 여러 가지 이름을 써가며 활동을 하는 것은
      괴도의 수칙에 벗어나는 행동이오.
    ja: |-
      とにかく！その時々で異なる名を語るのは
      怪盗のルールに反する行為だ。
  event_goninjathief_04_s_12:
    speaker: phantom
    en: The Thieves of Justice cannot step forth under the name of the trainee ninja
      thief.
    ko: |-
      수습 괴도 닌자의 이름으로
      정의 괴도단이 나설 수는 없소.
    ja: |-
      見習い怪盗忍者として
      正義の怪盗団が出るわけにはいかない。
  event_goninjathief_04_s_13:
    speaker: quency_e
    en: Oh wow, that's the first I've heard of a rule like that, hehe.
    ko: 그런 수칙이 있다는 건 처음 알았네~ 킥킥.
    ja: クスクス。そんなルール、初耳なんだけど～？
  event_goninjathief_04_s_14:
    speaker: "<Self>"
    en: How about just not showing up?
    ko: 그냥 예고장 보내놓고 안 가는 거는?
    ja: それなら、行かなければいいんじゃないのか？
  event_goninjathief_04_s_15:
    speaker: "<Self>"
    en: Delta's never actually done any phantom thief missions, so they might brush
      it off as a prank.
    ko: |-
      델타는 한 번도 괴도 활동을 한 적이 없으니까,
      그냥 장난인 줄 알고 넘어가지 않을까?
    ja: |-
      デルタは一度も怪盗の活動をしたことがないし、
      ただのイタズラだと思われて終わるだろう
  event_goninjathief_04_s_16:
    speaker: delta_n
    en: I cannot allow my resolve to become a phantom thief to be dismissed a mere
      prank.
    ko: |-
      괴도가 되기 위한 제 마음을
      장난으로 넘길 수는 없습니다.
    ja: |-
      怪盗を目指すこの気持ちを
      イタズラ扱いされたくありません。
  event_goninjathief_04_s_17:
    speaker: delta_n
    en: Since I said I would do it, I intend to see it through.
    ko: 하겠다고 한 이상, 해내고 싶습니다.
    ja: |-
      やると決めた以上、
      最後までやり遂げさせてください。
  event_goninjathief_04_s_18:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_s_19:
    speaker: phantom
    en: Then, the Thieves of Justice have no choice
    ko: 그럼 어쩔 수 없소.
    ja: ならば仕方ない。
  event_goninjathief_04_s_20:
    speaker: phantom
    en: but to step in.
    ko: 정식 정의 괴도단이 나설 수밖에.
    ja: "「正義の怪盗団」も出るまでだ。"
  event_goninjathief_04_s_21:
    speaker: quency_e
    en: How are you gonna do that?
    ko: 어떻게 할 건데?
    ja: どうするの？
  event_goninjathief_04_s_22:
    speaker: phantom
    en: We shall send a calling card of our own.
    ko: 우리도 예고장을 보내는 거요.
    ja: 我々も予告状を送ろう。
  event_goninjathief_04_s_23:
    speaker: phantom
    en: When the time comes, we shall keep to the shadows and aid Delta discreetly.
    ko: |-
      그리고 최대한 나서지 말고,
      뒤에서 델타를 도와주는 것이오.
    ja: |-
      なるべく表にでることなく、
      裏でデルタをサポートするんだ。
  event_goninjathief_04_s_24:
    speaker: miranda_c
    en: That sounds like a great idea!
    ko: 좋은 생각인 것 같습니다!
    ja: おお…！名案です！
  event_goninjathief_04_s_25:
    speaker: delta_n
    en: Hmm...
    ko: 흠….
    ja: "……"
  event_goninjathief_04_s_26:
    speaker: "<Self>"
    en: What's the matter, Delta?
    ko: 델타, 왜 그래?
    ja: デルタ、どうかしたか？
  event_goninjathief_04_s_27:
    speaker: delta_n
    en: I believe I can manage this on my own.
    ko: 저 혼자서도 충분히 해낼 수 있을 것 같습니다.
    ja: |-
      これくらいならば、
      私1人でもやり遂げられます。
  event_goninjathief_04_s_28:
    speaker: delta_n
    en: Please leave it to me.
    ko: 믿고 맡겨주시지 말입니다.
    ja: どうぞお任せください。
  event_goninjathief_04_s_29:
    speaker: phantom
    en: Hmm...
    ko: 흐음….
    ja: うぅむ…
  event_goninjathief_04_s_30:
    speaker: phantom
    en: Your growth has been almost unbelievable...
    ko: 믿을 수 없을 정도의 성장 속도기는 했소만.
    ja: 確かに目を見張るほどの成長速度ではあったが…
  event_goninjathief_04_s_31:
    speaker: phantom
    en: Are you confident you can do this, Delta?
    ko: 자신 있소, 델타?!
    ja: 自信はあるのかい？
  event_goninjathief_04_s_32:
    speaker: delta_n
    en: I have completed all the tests and now stand before the real mission.
    ko: |-
      테스트는 모두 완료하였고,
      실전을 앞두고 있습니다.
    ja: |-
      これまでのテストは無事に合格しましたので、
      あとは実践という名のテストのみです。
  event_goninjathief_04_s_33:
    speaker: delta_n
    en: A ninja is a creature of shadows.
    ko: 또한, 닌자는 그림자 속의 존재입니다.
    ja: それに、忍者は影に潜む存在。
  event_goninjathief_04_s_34:
    speaker: delta_n
    en: The fewer the companions, the greater the efficiency.
    ko: 혼자 움직일수록 더 효율이 좋습니다.
    ja: 1人で動くほうが有利かと思います。
  event_goninjathief_04_s_35:
    speaker: delta_n
    en: So I am confident, yes.
    ko: 자신, 있지 말입니다.
    ja: 自信はあります。
  event_goninjathief_04_s_36:
    speaker: phantom
    en: "... Very well."
    ko: "…알겠소."
    ja: "…よろしい。"
  event_goninjathief_04_s_37:
    speaker: phantom
    en: I shall entrust this phantom thief mission to you.
    ko: 이번 괴도 활동은, 델타에게 맡기겠소.
    ja: 今回の活動は、デルタに任せるとしよう。
  event_goninjathief_04_s_38:
    speaker: phantom
    en: In the name of the ninja thief and the Thieves of Justice, I trust you to
      carry it out well.
    ko: |-
      괴도 닌자와 정의 괴도단의 이름을 걸고,
      잘 부탁드리겠소.
    ja: |-
      怪盗忍者と正義の怪盗団の名に恥じぬよう、
      よろしく頼むよ。
  event_goninjathief_04_s_39:
    speaker: delta_n
    en: I shall do my utmost.
    ko: 최선을 다하겠습니다.
    ja: 最善を尽くします。
  event_goninjathief_04_s_40:
    speaker: delta_n
    en: Then, as I have much to prepare, I shall take my leave.
    ko: |-
      그럼, 준비할 것들이 많아
      먼저 일어나보겠지 말입니다.
    ja: では、準備があるのでお先に失礼いたします。
  event_goninjathief_04_s_41:
    speaker: "<Narration>"
    en: "*Swish!*"
    ko: 슈슉-!!
    ja: シュシュッ！
  event_goninjathief_04_s_42:
    speaker: "<Monologue>"
    en: Delta vanishes, only leaving behind a single leaf.
    ko: 델타가 나뭇잎 하나를 남기고는 사라졌다.
    ja: デルタは1枚の木の葉を残して立ち去った
  event_goninjathief_04_s_43:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_s_44:
    speaker: quency_e
    en: Are you sure it's really fine to send her in alone?
    ko: 진짜 혼자 보내도 괜찮은 거야~?
    ja: 本当に1人で行かせて大丈夫なの～？
  event_goninjathief_04_s_45:
    speaker: phantom
    en: "*Sigh* How could that possibly be?"
    ko: 후우, 그럴 리가 있겠소.
    ja: はぁ…大丈夫ではないな。
  event_goninjathief_04_s_46:
    speaker: phantom
    en: Arrogance begets mistakes, and mistakes beget failure.
    ko: 자만은 실수를 낳고, 실수는 실패는 낳소.
    ja: 自惚れはミスを生み、ミスは失敗を呼ぶもの。
  event_goninjathief_04_s_47:
    speaker: phantom
    en: And... I do not wish to let Delta experience failure.
    ko: 그리고 난… 델타에게 실패를 안겨주고 싶지 않소.
    ja: |-
      それに私は…デルタに失敗を
      味わわせたくはない。
  event_goninjathief_04_s_48:
    speaker: phantom
    en: Thieves of Justice, set forth!
    ko: 정의 괴도단, 출동이오!
    ja: |-
      よって…
      正義の怪盗団、出動だ！
  event_goninjathief_04_s_49:
    speaker: phantom
    en: But we shall move with utmost stealth, lest Delta catch sight of us.
    ko: 단, 델타에게 들키지 않도록 은밀하게 말이오.
    ja: ただし、デルタに気づかれないよう秘密裏にな。
  event_goninjathief_04_s_50:
    speaker: miranda_c
    en: All right!
    ko: 좋습니다!
    ja: 了解しました！
  event_goninjathief_04_s_51:
    speaker: phantom
    en: Oh, Miranda.
    ko: 아, 미란다.
    ja: 待て、ミランダ。
  event_goninjathief_04_s_52:
    speaker: phantom
    en: Since this matter has already been reported to the police, it would be best
      for you to sit this one out.
    ko: |-
      신고가 들어갔으니
      미란다는 이번에 빠지는 게 좋을 것 같소만.
    ja: |-
      通報が入るかもしれない、
      今回君は外れたほうがいい。
  event_goninjathief_04_s_53:
    speaker: miranda_c
    en: Wha...!
    ko: 아…!
    ja: えっ…！？
  event_goninjathief_04_s_54:
    speaker: miranda_c
    en: B-but...
    ko: 하, 하지만….
    ja: で、ですが…
  event_goninjathief_04_s_55:
    speaker: quency_e
    en: Don't push it too far, Miranda.
    ko: 그래, 무리하지 마 미란다.
    ja: そうそう、無茶はダメ。
  event_goninjathief_04_s_56:
    speaker: quency_e
    en: If you get caught this time, it won't end with just a disciplinary report,
      right?
    ko: 이번에 걸리면 시말서 정도로 안 끝날 걸~?
    ja: 今度は始末書どころじゃ済まないわよ～？
  event_goninjathief_04_s_57:
    speaker: miranda_c
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_s_58:
    speaker: miranda_c
    en: Got it!
    ko: 알겠습니다.
    ja: 分かりました。
  event_goninjathief_04_s_59:
    speaker: miranda_c
    en: I, Phantom Police,
    ko: 괴도 경찰 미란다, 이번 작전에서는.
    ja: 怪盗警察ミランダ、今回の作戦は…
  event_goninjathief_04_s_60:
    speaker: miranda_c
    en: will participate in this mission as Police Officer Miranda!
    ko: 경찰 미란다로 참여하겠습니다!!
    ja: 警察ミランダとして参加いたします！！
  event_goninjathief_04_s_61:
    speaker: quency_e
    en: Oooh!
    ko: 오!
    ja: わお！
  event_goninjathief_04_s_62:
    speaker: quency_e
    en: That'd be awesome!
    ko: 그러면 완전 든든하지.
    ja: それは頼もしいわ～！
  event_goninjathief_04_s_63:
    speaker: quency_e
    en: You could tell us where the other cops are ahead of time, and if we get caught,
      you could stall for us a bit too!
    ko: |-
      미리 다른 경찰들의 위치도 알려주고~
      혹시나 걸리면 시간도 좀 끌어주고.
    ja: |-
      じゃあじゃあ、他の警察官たちの
      位置を教えてくれる？
      もし見つかったら時間稼ぎもできるし。
  event_goninjathief_04_s_64:
    speaker: miranda_c
    en: I don't know about all that, but I'll do my best!
    ko: 잘 모르겠지만, 최선을 다해보겠습니다!
    ja: よく分かりませんが、最善を尽くします！
  event_goninjathief_04_s_65:
    speaker: phantom
    en: Very well, then. Let us begin.
    ko: 그럼, 다들 시작하시오.
    ja: では、行動開始だ。
  event_goninjathief_04_s_66:
    speaker: "<Monologue>"
    en: Phantom hastily scribbles out a calling card.
    ko: 팬텀은 다급하게 예고장을 작성했고.
    ja: ファントムが急いで予告状を作ったあと
  event_goninjathief_04_s_67:
    speaker: "<Monologue>"
    en: At Phantom's signal, we fold them into paper airplanes and start tossing them
      through the crack of the window.
    ko: |-
      우리는 팬텀의 신호에 따라,
      예고장으로 비행기를 접어 창문 틈으로 던지기 시작했다.
    ja: |-
      私たちはファントムの合図に合わせて
      予告状の紙飛行機を窓に飛ばした
  event_goninjathief_04_s_68:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 톡-
    ja: ポトッ
  event_goninjathief_04_s_69:
    speaker: "<Narration>"
    en: "*Thud thud*"
    ko: 톡- 톡-
    ja: ポトッ、ポトッ
  event_goninjathief_04_s_70:
    speaker: quency_e
    en: Hmm... maybe Delta really is better than us?
    ko: 음~ 진짜로 델타가 우리보다 나을 수도?
    ja: うーん、やっぱりデルタのほうが上手かも？
  event_goninjathief_04_s_71:
    speaker: "<Self>"
    en: "... At least when it comes to sending calling cards, Delta is far better."
    ko: "…적어도 예고장 보내는 것만큼은 델타 쪽이 훨씬 나아."
    ja: |-
      …少なくとも、予告状を送るのは
      デルタのほうがうまいみたいだな
  event_goninjathief_04_s_72:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 톡-
    ja: ポトッ
  event_goninjathief_04_s_73:
    speaker: "<Narration>"
    en: "*Fwoosh*"
    ko: 슝~
    ja: シュッ――
  event_goninjathief_04_s_74:
    speaker: phantom
    en: Ah, it went in!
    ko: 오, 들어갔소!
    ja: おおっ、入ったぞ！
  event_goninjathief_04_s_75:
    speaker: phantom
    en: We should return to the base and make preparations.
    ko: 자, 우리도 준비를 하러 기지로 돌아가는 게 좋겠소.
    ja: |-
      さあ、私たちも準備をしに
      隠れ家に戻るとしよう。
  event_goninjathief_04_s_76:
    speaker: quency_e
    en: By the way, great phantom thief,
    ko: 그런데, 위대하신 괴도 팬텀님.
    ja: ところで、偉大な怪盗ファントム様。
  event_goninjathief_04_s_77:
    speaker: quency_e
    en: did you run a spell check on that calling card?
    ko: 맞춤법 검사기는 돌렸어~?
    ja: 誤字脱字のチェックはした～？
  event_goninjathief_04_s_78:
    speaker: phantom
    en: Ah, drat.
    ko: 아.
    ja: あっ…
event_goninjathief_04_e:
  event_goninjathief_04_e_1:
    speaker: poli
    en: Hm...
    ko: 흠….
    ja: うーん…
  event_goninjathief_04_e_2:
    speaker: poli
    en: Even the Thieves of Justice sent out a calling card.
    ko: 정의 괴도단도 예고장을 보냈던뎅.
    ja: 正義の怪盗団も予告状を送ってきましたねぇ。
  event_goninjathief_04_e_3:
    speaker: poli
    en: Miranda, don't you have to go too?
    ko: 미란다는 안 가봐도 되나영.
    ja: ミランダは行かなくていいんですかぁ？
  event_goninjathief_04_e_4:
    speaker: miranda
    en: I've decided to sit this one out!
    ko: 저는 빠지기로 했습니다!
    ja: 私は外れることになりました！
  event_goninjathief_04_e_5:
    speaker: miranda
    en: They said that if I get caught by the police this time, it won't end with
      just a disciplinary report!
    ko: |-
      이번에 폴리에게 잡히면
      시말서 쓰는 걸로 끝나지 않을 거라 했습니다!
    ja: |-
      またポリに捕まったら
      始末書どころじゃ済まないからとのことです！
  event_goninjathief_04_e_6:
    speaker: poli
    en: That's a wise choice.
    ko: 현명했네영.
    ja: 賢明ですねぇ。
  event_goninjathief_04_e_7:
    speaker: poli
    en: But, do you happen to know anything about this trainee ninja thief, hmm?
    ko: 그런뎅, 혹시 수습 괴도 닌자에 대해 알고 있는 게 있으신가영?
    ja: |-
      ところで、見習い怪盗忍者については
      何か知っていますかぁ？
  event_goninjathief_04_e_8:
    speaker: miranda
    en: Eep!
    ko: 딸꾹!
    ja: ヒック！
  event_goninjathief_04_e_9:
    speaker: miranda
    en: Wh-why do you ask?
    ko: 그, 그건 왜 물어보십니까?
    ja: ど、どうしてそんなことを？
  event_goninjathief_04_e_10:
    speaker: poli
    en: I've got a bad feeling.
    ko: 뭔가 예감이 안 좋아서영.
    ja: 悪い予感がするんですよねぇ。
  event_goninjathief_04_e_11:
    speaker: poli
    en: When you weren't around a few nights ago, we got soooo many reports from the
      park!
    ko: |-
      며칠 전 밤에 미란다가 없던 날,
      공원에서 신고가 엄청 들어왔었거든영.
    ja: |-
      この間、ミランダがいなかった日の夜に
      公園から何件もの通報があったんですよぉ。
  event_goninjathief_04_e_12:
    speaker: poli
    en: They said there was this suspicious person in black with a mask... I think
      it might be the trainee ninja thief who wrote the calling card.
    ko: |-
      검은 옷에 가면을 쓴 수상한 사람이 있었다고 했는뎅,
      그 사람이 예고장을 쓴 수습 괴도 닌자일 것 같아서영.
    ja: |-
      仮面をつけた黒ずくめの怪しい人物…
      その人が予告状を書いた
      見習い怪盗忍者な気がするんですよねぇ。
  event_goninjathief_04_e_13:
    speaker: miranda
    en: But she helped the citizens find their lost belongings!
    ko: 시민들에게 잃어버린 물건을 찾아줬습니다!
    ja: 彼女は市民の落とし物を届けただけです！
  event_goninjathief_04_e_14:
    speaker: miranda
    en: So she's a truly righteous person!
    ko: 정의로운 사람입니다!
    ja: 正義感あふれる人です！
  event_goninjathief_04_e_15:
    speaker: poli
    en: Yeah, but the gunpowder smell was so strong back then.
    ko: 라고 하기엔, 그때 화약 냄새가 엄청 많이 났었거든영.
    ja: |-
      そうは言っても、現場には
      火薬の匂いが充満してたんですよん。
  event_goninjathief_04_e_16:
    speaker: poli
    en: If she's handling guns or some kind of weapon, then she's probably super dangerous!
    ko: 총이나 무기를 다루는 자라면 위험인물일 확률이 높아영.
    ja: 銃や武器を扱う危険人物の可能性も否めません。
  event_goninjathief_04_e_17:
    speaker: miranda
    en: But a phantom thief acts in the name of justice...!
    ko: 괴도는 정의를 위해서 움직입니다…!
    ja: |-
      か、怪盗は、
      正義のために活動しているんです…！
  event_goninjathief_04_e_18:
    speaker: poli
    en: Based on what the Thieves of Justice usually get up to, that sounds about
      right.
    ko: 정의 괴도단의 행적으로 봤을 때는 그랬었졍.
    ja: 正義の怪盗団の場合はそうでしょうねぇ。
  event_goninjathief_04_e_19:
    speaker: poli
    en: But a Trainee Phantom Ninja... I've never heard of one before!
    ko: 하지만, 수습 괴도 닌자는 이번에 처음 들어보는 걸영.
    ja: ですが、見習い怪盗忍者は初めて聞きましたぁ。
  event_goninjathief_04_e_20:
    speaker: poli
    en: It could even be some naughty criminal pretending to be a phantom thief.
    ko: 괴도를 사칭하는 못된 범죄자일 수도 있어영.
    ja: 怪盗を名乗る犯罪者かもしれません。
  event_goninjathief_04_e_21:
    speaker: miranda
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_goninjathief_04_e_22:
    speaker: poli
    en: So, we gotta be careful,
    ko: 그러니까, 조심해야 해영.
    ja: ですので、慎重にいきますよぉ。
  event_goninjathief_04_e_23:
    speaker: poli
    en: got it?
    ko: 아셨졍?
    ja: いいですねぇ？
  event_goninjathief_04_e_24:
    speaker: miranda
    en: Yes...
    ko: 네에….
    ja: はい…
  event_goninjathief_04_e_25:
    speaker: phantom
    en: 'Our goal is but one:'
    ko: 우리의 목표는 단 하나.
    ja: 私たちの目標はただ一つ。
  event_goninjathief_04_e_26:
    speaker: phantom
    en: to help Delta successfully steal the bag.
    ko: 델타가 무사히 가방을 훔칠 수 있도록 도와주는 것이오.
    ja: |-
      デルタが無事にバッグを
      盗めるようにすることだ。
  event_goninjathief_04_e_27:
    speaker: phantom
    en: In doing so, we must avoid, as much as possible, encounters with her, the
      police, and the villain himself.
    ko: 되도록 델타, 경찰, 악한 자들과 마주치지 않고 말이오.
    ja: |-
      なるべくデルタ、警察、そして悪人に
      遭遇しないよう気をつけてくれたまえ。
  event_goninjathief_04_e_28:
    speaker: quency_e
    en: That's not gonna be easy.
    ko: 쉽지 않겠네~
    ja: 簡単じゃなさそうね～
  event_goninjathief_04_e_29:
    speaker: "<Self>"
    en: But shouldn't we find Delta first?
    ko: 그런데, 그러려면 일단 델타를 먼저 찾아야 하지 않을까?
    ja: |-
      そのためには、まずはデルタを見つける
      必要があるんじゃないか？
  event_goninjathief_04_e_30:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_e_31:
    speaker: quency_e
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_e_32:
    speaker: phantom
    en: That is a sharp insight, Monsieur.
    ko: 아주 날카로운 지적이었소, 그대.
    ja: ふっ…なかなかに鋭い指摘だ。
  event_goninjathief_04_e_33:
    speaker: phantom
    en: It would be best to move separately until Delta is found.
    ko: 델타를 찾을 때까지는, 따로 움직이는 게 좋겠소.
    ja: |-
      デルタを見つけるまでは
      別行動のほうがよさそうだな。
  event_goninjathief_04_e_34:
    speaker: phantom
    en: Any being leaves traces when they pass through, so I shall track Delta's trail
      myself.
    ko: |-
      어떤 존재든 지나가면 흔적이 남기 마련이니,
      나는 델타의 흔적을 찾도록 하겠소.
    ja: |-
      どんな存在であれ、動けば痕跡が残るもの。
      私はデルタの痕跡を捜すとしよう。
  event_goninjathief_04_e_35:
    speaker: quency_e
    en: In that case,
    ko: 그렇다면~
    ja: じゃあ私は～
  event_goninjathief_04_e_36:
    speaker: quency_e
    en: we'll end up at the final destination anyway, so I'll go look for the bag!
    ko: |-
      결국 최종 목적지로 갈 수밖에 없으니까,
      난 가방이 있는 곳을 찾아볼게.
    ja: |-
      バッグのありかを捜そうかしら。
      同じ目標を追っていれば、
      デルタも見つかるかもしれないし。
  event_goninjathief_04_e_37:
    speaker: "<Self>"
    en: I will...
    ko: 나는….
    ja: なら私は…
  event_goninjathief_04_e_38:
    speaker: Choice
    en: Hide so I don't get seen!
    ko: 들키면 안 되니까 숨어있을게!
    ja: 見つからないように隠れていよう
  event_goninjathief_04_e_39:
    speaker: Choice
    en: Check the police's whereabouts and patrol routes!
    ko: 경찰들의 위치와 동선을 확인해 볼게!
    ja: 警察の位置と動線を確かめておこう
  event_goninjathief_04_e_40:
    speaker: phantom
    en: Monsieur, it would be wise for you to accompany me.
    ko: 그대는 나와 함께 다니는 게 좋겠소.
    ja: 君は私と一緒に来てくれ。
  event_goninjathief_04_e_41:
    speaker: phantom
    en: As Delta is a ninja thief, tracking her will prove no easy task.
    ko: |-
      델타는 괴도 닌자인 만큼,
      흔적을 찾는 게 쉽지 않을 테니 말이오.
    ja: |-
      デルタは怪盗忍者だ。その痕跡を
      見つけるのはそう簡単ではないだろうからな。
  event_goninjathief_04_e_42:
    speaker: "<Self>"
    en: Is there any point in me even saying anything...?
    ko: 내가 대사를 치는 의미가 있나….
    ja: もはや発言の意味すらないのか…？
  event_goninjathief_04_e_43:
    speaker: quency_e
    en: Got it! Let me know if anything comes up!
    ko: 알겠어, 무슨 일 있으면 연락해~
    ja: 了解～。何かあったら連絡してね～
  event_goninjathief_04_e_44:
    speaker: "<Monologue>"
    en: Quency slips into a hole.
    ko: 퀀시는 구멍 안으로 들어갔고.
    ja: |-
      クエンシーは目の前の抜け穴の中へと
      入っていき…
  event_goninjathief_04_e_45:
    speaker: phantom
    en: I think we ought to proceed this way, Monsieur.
    ko: 그대, 우리는 이쪽으로 가보는 게 좋을 것 같소.
    ja: よし、私たちはこちらに行こう。
  event_goninjathief_04_e_46:
    speaker: "<Monologue>"
    en: Phantom and I crawl into a hole in the opposite direction.
    ko: 나와 팬텀은 반대 방향에 있는 구멍으로 기어갔다.
    ja: |-
      私とファントムは反対側の抜け穴へと
      入っていった
  event_goninjathief_04_e_47:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_e_48:
    speaker: "<Narration>"
    en: Delta finds herself confronted with an unforeseen problem.
    ko: 델타에겐 예상치 못한 변수가 생겼다.
    ja: その頃、デルタに予想外の出来事が起きていた
  event_goninjathief_04_e_49:
    speaker: "<Narration>"
    en: She means to move along the ceiling, only to realize this is an apartment
      complex.
    ko: |-
      천장에 숨어 움직이려 하였으나,
      이곳은 아파트였던 것이다.
    ja: |-
      天井裏で身を潜めながら動こうと
      目標の建物に侵入したが、
      なんとそこはマンションだったのだ
  event_goninjathief_04_e_50:
    speaker: delta_n
    en: I have brought a concealment cloth in preparation for situations like this.
    ko: 이럴 때를 대비하여, 은신용 천을 가져왔습니다.
    ja: |-
      こんな時のために、
      隠れ身の布を持ってきて正解でしたね。
  event_goninjathief_04_e_51:
    speaker: delta_n
    en: It scans the background precisely and replicates it perfectly. If I hide beneath
      it, no one will see me.
    ko: |-
      뒤에 배경을 정확하게 스캔해 똑같이 보여주기 때문에,
      이 천을 앞에 두고 은신하면 아무도 저를 인식하지 못할 겁니다.
    ja: |-
      背景をスキャンして同化するので、
      この布で身を隠せば誰も私を認識できません。
  event_goninjathief_04_e_52:
    speaker: "<Narration>"
    en: "*Step, step*"
    ko: 저벅- 저벅-
    ja: スタスタ…
  event_goninjathief_04_e_53:
    speaker: delta_n
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_goninjathief_04_e_54:
    speaker: "<Narration>"
    en: Hearing footsteps approaching, Delta quickly lifts the cloth.
    ko: 다가오는 발소리를 들은 델타는 천을 들어 올렸고.
    ja: 近くで足音を聞いたデルタが布を広げると
  event_goninjathief_04_e_55:
    speaker: "<Narration>"
    en: It shifts to match the wall's color and pattern exactly, perfectly hiding
      Delta from view.
    ko: |-
      천이 뒤의 벽과 같은 색과 무늬로 바뀌면서,
      델타의 모습이 감쪽같이 숨겨졌다.
    ja: |-
      布は後方の壁と同じ色と模様になり、
      デルタの姿を完全に隠した
  event_goninjathief_04_e_56:
    speaker: quiry
    en: Hmm...
    ko: 으음!
    ja: う～ん…！
  event_goninjathief_04_e_57:
    speaker: quiry
    en: No one's here.
    ko: 다행히 아무도 없네.
    ja: よかった、誰もいないようですね。
  event_goninjathief_04_e_58:
    speaker: quiry
    en: But! Every time I do this, I end up losing the suspect...
    ko: 하지만! 매번 이렇게 했다가 범인을 놓쳐버리기 십상이었지.
    ja: |-
      でも、毎回こうやって
      犯人を取り逃がしちゃうんですよね…
  event_goninjathief_04_e_59:
    speaker: quiry
    en: Crazy as it sounds, they could even be hiding inside the walls...
    ko: 말도 안 되지만, 벽 안에 숨었을 수도 있는 거니까.
    ja: |-
      ありえないとは思うけど、
      壁の中に隠れてたりして…
  event_goninjathief_04_e_60:
    speaker: quiry
    en: Like this, for example!
    ko: 예를 들면, 이렇게!
    ja: えいっ！
  event_goninjathief_04_e_61:
    speaker: "<Narration>"
    en: "*Tap!*"
    ko: 탁!
    ja: タンッ！
  event_goninjathief_04_e_62:
    speaker: quiry
    en: Hehe, as I thought, it's just a wall.
    ko: 헤헤, 역시 벽이네.
    ja: えへへ、やっぱり壁だった。
  event_goninjathief_04_e_63:
    speaker: quiry
    en: This side too!
    ko: 이쪽도!
    ja: こっちも！
  event_goninjathief_04_e_64:
    speaker: "<Narration>"
    en: "*Tap!*"
    ko: 탁!
    ja: タンッ！
  event_goninjathief_04_e_65:
    speaker: quiry
    en: "*Sigh* Being alone makes me do all sorts of silly things."
    ko: 에휴~ 혼자 있으니 별별 짓을 다 하게 되네.
    ja: |-
      へへっ…1人だと
      つい思ったことを全部試しちゃいますね。
  event_goninjathief_04_e_66:
    speaker: quiry
    en: One last spot!
    ko: 마지막으로, 여기도!
    ja: 最後に、ここも！
  event_goninjathief_04_e_67:
    speaker: "<Narration>"
    en: "*Squish*"
    ko: 물컹-
    ja: ぷにっ
  event_goninjathief_04_e_68:
    speaker: quiry
    en: Huh?
    ko: 응?
    ja: あれ？
  event_goninjathief_04_e_69:
    speaker: quiry
    en: Uh...?
    ko: 으응…?
    ja: なんだろ…？
  event_goninjathief_04_e_70:
    speaker: "<Narration>"
    en: "*Squish*"
    ko: 물컹-
    ja: ぷにっ
  event_goninjathief_04_e_71:
    speaker: quiry
    en: Strange... This is definitely a wall.
    ko: 이상하네, 여기는 분명 벽인데.
    ja: おかしいなぁ、ただの壁なのに…
  event_goninjathief_04_e_72:
    speaker: quiry
    en: So why does it feel so soft?
    ko: 왜 이렇게 감촉이 좋지?
    ja: なんでこんなに触り心地がいいんでしょう…？
  event_goninjathief_04_e_73:
    speaker: quiry
    en: Hmmm...
    ko: 으으음….
    ja: う～～ん…
  event_goninjathief_04_e_74:
    speaker: quiry
    en: No matter how I look at it, it's a wall...
    ko: 아무리 봐도 벽인데….
    ja: どう見ても壁なんですが…
  event_goninjathief_04_e_75:
    speaker: "<Narration>"
    en: "*Squish, squish*"
    ko: 물컹- 말랑-
    ja: むにゅっ、ぷにっ
  event_goninjathief_04_e_76:
    speaker: quiry
    en: Is this the latest interior design trend?
    ko: 요새 유행하는 인테리어 스타일인가.
    ja: 最近はやってるインテリアなのかな？
  event_goninjathief_04_e_77:
    speaker: quiry
    en: Interesting.
    ko: 신기하네.
    ja: 不思議ですね～
  event_goninjathief_04_e_78:
    speaker: poli_op
    en: Notice anything weird or out of place, Quiry?
    ko: 키리, 혹시 수상한 사람이나 이상한 점은 없었나영.
    ja: |-
      キリ、怪しい人やおかしな点は
      見つかりましたかぁ？
  event_goninjathief_04_e_79:
    speaker: quiry
    en: Yeah, there's nothing in the hallway.
    ko: 네, 복도에는 아무것도 없어요.
    ja: いえっ、廊下は特に異常ありませんでした！
  event_goninjathief_04_e_80:
    speaker: quiry
    en: Oh! But wait,
    ko: 아! 근데 말이죠.
    ja: あっ！でもですね。
  event_goninjathief_04_e_81:
    speaker: quiry
    en: there's this wall here that feels really nice.
    ko: 여기에 엄청 감촉이 좋은 벽이 있어요.
    ja: ここに触り心地のいい壁がありました。
  event_goninjathief_04_e_82:
    speaker: quiry
    en: It's super squishy, like a stress ball. It actually makes me feel really calm.
    ko: |-
      되게 물컹하고 말랑한 느낌이었는데,
      마음이 평온해진 느낌이었어요.
    ja: とっても柔らかくて、触ると癒されるんです～
  event_goninjathief_04_e_83:
    speaker: poli_op
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_goninjathief_04_e_84:
    speaker: poli_op
    en: Was it only that wall?
    ko: 그 벽만 그랬나영?
    ja: その壁だけですかぁ？
  event_goninjathief_04_e_85:
    speaker: quiry
    en: Yeah! Right here—
    ko: 네! 여기만-
    ja: はい！ここだけ…
  event_goninjathief_04_e_86:
    speaker: "<Narration>"
    en: "*Tap!*"
    ko: 탁!
    ja: タンッ！
  event_goninjathief_04_e_87:
    speaker: quiry
    en: H-huh?
    ko: 어, 어라?
    ja: あ、あれ…？
  event_goninjathief_04_e_88:
    speaker: quiry
    en: It was super soft and squishy just a moment ago...
    ko: 조금 전까지 엄청 부드럽고 말랑했는데….
    ja: ついさっきまで、すごくぷにぷにしてたのに…
  event_goninjathief_04_e_89:
    speaker: quiry
    en: and now it's hard again!
    ko: 다시 딱딱해졌어요!
    ja: 固くなってしまいました！
  event_goninjathief_04_e_90:
    speaker: quiry
    en: Is it a wall that changes texture...?
    ko: 재질이 바뀌는 벽, 그런 건가요…?
    ja: 感触が変わる壁なんですかね…？
  event_goninjathief_04_e_91:
    speaker: poli_op
    en: That was a person!
    ko: 그거, 사람이예영!
    ja: それ、人ですよん！
  event_goninjathief_04_e_92:
    speaker: poli_op
    en: It's gotta be the ninja thief, I tell you!
    ko: 분명 괴도 닌자였을 거예영.
    ja: そこにいたのは怪盗忍者に違いありません。
  event_goninjathief_04_e_93:
    speaker: poli_op
    en: Go chase her!
    ko: 쫓아영!!
    ja: 今すぐ追ってくださぁい！！
  event_goninjathief_04_e_94:
    speaker: quiry
    en: Wh-what?!
    ko: 네, 네?!
    ja: は、はい！？
  event_goninjathief_04_e_95:
    speaker: quiry
    en: But...
    ko: 하지만….
    ja: でも…
  event_goninjathief_04_e_96:
    speaker: quiry
    en: there's no one here.
    ko: 아무도 없는데요?
    ja: 誰もいませんよ？
  event_goninjathief_04_e_97:
    speaker: poli_op
    en: Keep tapping the walls while you search!
    ko: 계속 벽을 쳐보면서 찾아보세영!!
    ja: 壁を触りながら見つけてください！！
  event_goninjathief_04_e_98:
    speaker: poli_op
    en: I'll catch up with you soon!
    ko: 저도 금방 합류할게영!
    ja: 私もすぐに合流しますのでぇ！
  event_goninjathief_04_e_99:
    speaker: quiry
    en: O-okay!
    ko: 아, 알겠어요!
    ja: わ、分かりました！
  event_goninjathief_04_e_100:
    speaker: "<Narration>"
    en: "*Tap, tap!*"
    ko: 탁! 탁!
    ja: タンッ！タンッ！
  event_goninjathief_04_e_101:
    speaker: "<Narration>"
    en: Quiry keeps moving while holding onto the wall.
    ko: 키리는 계속 벽을 짚으며 이동했고.
    ja: キリは壁を叩きながら移動した
  event_goninjathief_04_e_102:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_04_e_103:
    speaker: "<Narration>"
    en: Delta matches her steps to Quiry's, moving one step at a time while holding
      the cloth.
    ko: |-
      델타는 그 소리에 맞춰, 천을 든 채로
      한 발짝씩 움직였다.
    ja: |-
      デルタはその音に合わせ、
      布を持ったまま一歩ずつ動いた
event_goninjathief_05_s:
  event_goninjathief_05_s_1:
    speaker: quiry
    en: I'm sorry, I think I lost her...
    ko: 죄송해요, 놓친 것 같아요….
    ja: すみません、取り逃がしたようです…
  event_goninjathief_05_s_2:
    speaker: poli
    en: It's okay.
    ko: 괜찮아영.
    ja: 大丈夫ですよん。
  event_goninjathief_05_s_3:
    speaker: poli
    en: Predicting a phantom thief's moves isn't exactly easy.
    ko: 괴도들의 움직임을 예측하는 건 쉬운 일이 아니니까영.
    ja: 怪盗の動きは予測するのが難しいですからねぇ。
  event_goninjathief_05_s_4:
    speaker: poli
    en: But this new ninja thief sure lives up to her name.
    ko: 하지만 이번에 새로 나온 괴도 닌자는.
    ja: 今回、新たに現れた怪盗忍者は…
  event_goninjathief_05_s_5:
    speaker: poli
    en: Seems like she's an especially stealthy one, so stay extra alert for any signs
      of her, okay?
    ko: |-
      그 이름에 맞춰서 더 은밀하게 움직이는 것 같으닝,
      좀 더 유심히 살펴보졍.
    ja: |-
      その名の通り、影のように動くようなので
      慎重に捜してくださいよん。
  event_goninjathief_05_s_6:
    speaker: quiry
    en: Okay!
    ko: 네!
    ja: はい！
  event_goninjathief_05_s_7:
    speaker: "<Narration>"
    en: Pushing her disappointment aside, Poli heads back to the room Miranda was
      in.
    ko: 아쉬움을 뒤로한 채, 폴리는 다시 미란다가 있던 방으로 돌아갔다.
    ja: |-
      わずかに肩を落としながら、
      ポリは再びミランダのいる部屋に戻った
  event_goninjathief_05_s_8:
    speaker: miranda
    en: Did you find the ninja thief?
    ko: 괴도 닌자를 발견하셨습니까?
    ja: あ、ポリ！怪盗忍者は見つかりましたか？
  event_goninjathief_05_s_9:
    speaker: poli
    en: Nope, we lost her.
    ko: 아녕, 놓쳤어영.
    ja: いいえ、逃しましたぁ。
  event_goninjathief_05_s_10:
    speaker: miranda
    en: What a relief!
    ko: 그거 다행입니다!
    ja: それはよかったです！
  event_goninjathief_05_s_11:
    speaker: poli
    en: Grrrr!!
    ko: 크르르릉…!!!
    ja: グルルル…！
  event_goninjathief_05_s_12:
    speaker: miranda
    en: But where's the homeowner right now?
    ko: 그런데, 이 집의 주인은 지금 어디에 있습니까?
    ja: |-
      ところで、家主の方は
      今どこにいるのでしょうか？
  event_goninjathief_05_s_13:
    speaker: poli
    en: Why, are you gonna tell your friends in the Thieves of Justice?
    ko: |-
      왜영, 정의 괴도단 친구들에게
      말해주기라도 하려고영?!
    ja: |-
      なぜそんなことを聞くんですかぁ？
      まさか、正義の怪盗団に
      教えるつもりですかぁ！？
  event_goninjathief_05_s_14:
    speaker: miranda
    en: N-no...!
    ko: 아, 아닙니다…!
    ja: い、いいえ…！
  event_goninjathief_05_s_15:
    speaker: miranda
    en: I was just curious, that's all.
    ko: 정말 주인의 행방이 궁금했을 뿐입니다.
    ja: 単に家主の行方が気になっただけです！
  event_goninjathief_05_s_16:
    speaker: miranda
    en: I haven't seen him once since we got here.
    ko: 여기에 와서 한 번도 만나지 못했으니 말입니다.
    ja: ここに来てから一度も見かけていないので…
  event_goninjathief_05_s_17:
    speaker: poli
    en: "... I offered to guard him personally, but he refused, y'know."
    ko: "…직접 옆에서 경호해 주겠다고 했는데도 거절하시더라고용."
    ja: |-
      …身辺警護をすると本人に言ったら、
      断られましたぁ。
  event_goninjathief_05_s_18:
    speaker: poli
    en: He said he'd keep watch of the bag himself
    ko: 가방도 본인이 갖고 있겠다고 했고영.
    ja: バッグも自分で持っておくそうですよん。
  event_goninjathief_05_s_19:
    speaker: poli
    en: and told me not to worry since he'd be hiding safely in his room alone.
    ko: |-
      혼자 방에 숨어있을 테니 걱정하지 말래성,
      그러라고 했어영.
    ja: |-
      1人で部屋に隠れるから
      心配いらないとのことでしたので、
      そうしてもらうことにしましたぁ。
  event_goninjathief_05_s_20:
    speaker: miranda
    en: So, how are we even supposed to catch him?
    ko: 그러면 저희는 어떻게 집주인을 잡습니까?
    ja: それだと、どうやって家主を捕まえるのですか？
  event_goninjathief_05_s_21:
    speaker: poli
    en: Why on earth would we be catching him?
    ko: 집주인을 왜 잡아영?
    ja: 捕まえる？どうしてですかぁ？
  event_goninjathief_05_s_22:
    speaker: miranda
    en: Because he's a pickpocket!
    ko: 집주인은 소매치기입니다!
    ja: ここの家主はスリの常習犯です！
  event_goninjathief_05_s_23:
    speaker: miranda
    en: That's why the Thieves of Justice are trying to retrieve the bag!
    ko: 그래서 정의 괴도단이 가방을 되찾아 주려고 하는 것입니다!
    ja: |-
      正義の怪盗団は、盗まれたバッグを
      取り返そうとしているだけなんです！
  event_goninjathief_05_s_24:
    speaker: poli
    en: Hmm...
    ko: 흠….
    ja: ふむ…
  event_goninjathief_05_s_25:
    speaker: poli
    en: Given the Thieves of Justice's past antics, it's pretty likely this is true!
    ko: |-
      지금까지 있었던 정의 괴도단 사건들을 봤을 때,
      사실일 확률이 높겠네영.
    ja: |-
      正義の怪盗団がこれまでに起こしてきた事件の
      傾向からして、事実である確率が高いですねぇ…
  event_goninjathief_05_s_26:
    speaker: poli
    en: Then we better secure the bag before the phantom thieves do!
    ko: 그렇다면, 괴도들보다 저희가 먼저 가방을 확보해야겠군영!
    ja: |-
      それなら、怪盗より先に私たちで
      バッグを確保しますよん！
  event_goninjathief_05_s_27:
    speaker: poli
    en: I'll go check it out. Miranda, you stay here and watch for any sign of the
      phantom thieves.
    ko: |-
      제가 다녀올 테닝,
      미란다는 여기서 괴도들이 오는지 지켜봐 주세영.
    ja: |-
      私が家主のところに行ってきますので、
      ミランダは怪盗が来ないか
      ここで見張っててくださいねぇ。
  event_goninjathief_05_s_28:
    speaker: poli
    en: Especially!
    ko: 특히!
    ja: 特に！
  event_goninjathief_05_s_29:
    speaker: poli
    en: If you spot that trainee ninja thief, you must absolutely catch her, got it?
    ko: 수습 괴도 닌자를 발견하면 꼭 잡아야 해영, 아셨졍?
    ja: |-
      見習い怪盗忍者を見つけたら
      必ず捕まえてください。
      いいですねぇ？
  event_goninjathief_05_s_30:
    speaker: miranda
    en: Yes! Understood!
    ko: 예! 알겠습니다!
    ja: はい！分かりました！
  event_goninjathief_05_s_31:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_32:
    speaker: phantom
    en: Did you see that, Monsieur?
    ko: 그대, 혹시 보셨소?
    ja: 君、見たかい？
  event_goninjathief_05_s_33:
    speaker: phantom
    en: Quiry's hands are roaming over Delta...
    ko: 키리가 손으로 델타의 이곳저곳을….
    ja: |-
      キリがデルタのあんなところや
      こんなところを手で…
  event_goninjathief_05_s_34:
    speaker: "<Self>"
    en: No, I don't want to know!
    ko: 아악! 설명하지 마.
    ja: 言わなくていい
  event_goninjathief_05_s_35:
    speaker: phantom
    en: Ahem...!
    ko: 크흠…!
    ja: "…コホン！"
  event_goninjathief_05_s_36:
    speaker: phantom
    en: In any case, it seems Delta has gone through that door.
    ko: 아무튼, 델타는 저쪽 문으로 이동한 듯하오.
    ja: |-
      とにかく、デルタはあちらのドアに
      向かったようだ。
  event_goninjathief_05_s_37:
    speaker: phantom
    en: We should follow.
    ko: 우리도 이동하는 게 좋겠소.
    ja: 私たちも向かおう。
  event_goninjathief_05_s_38:
    speaker: "<Self>"
    en: Yeah...
    ko: 그래….
    ja: ああ…
  event_goninjathief_05_s_39:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_40:
    speaker: delta_n
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_goninjathief_05_s_41:
    speaker: poli
    en: I'm heading out, so make sure you don't slack off, okay?
    ko: 그럼 다녀올 테니까, 잘 지키고 있어영!
    ja: |-
      では、行ってきますねぇ。
      見張り、頼みましたよぉ！
  event_goninjathief_05_s_42:
    speaker: miranda
    en: Got it!
    ko: 알겠습니다!
    ja: お任せください！
  event_goninjathief_05_s_43:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_44:
    speaker: "<Monologue>"
    en: Seeing Poli move to another room, Delta carefully opens the door to the room
      where Miranda is.
    ko: |-
      폴리가 다른 방으로 이동하는 것을 본 델타는,
      조심스럽게 미란다가 있는 방문을 열었다.
    ja: |-
      ポリが別の部屋へ移動するのを見たデルタは、
      ミランダがいる部屋のドアを慎重に開けた
  event_goninjathief_05_s_45:
    speaker: "<Narration>"
    en: "*Creeeaaak*"
    ko: 끼이이-
    ja: キイイィ…
  event_goninjathief_05_s_46:
    speaker: miranda
    en: Huh?
    ko: 어?
    ja: "…？"
  event_goninjathief_05_s_47:
    speaker: miranda
    en: Huh?! You're the trainee ninja thief!
    ko: 어?! 수습 괴도 닌자입니다!
    ja: あっ！見習い怪盗忍者を発見しました！
  event_goninjathief_05_s_48:
    speaker: miranda
    en: Nice to see you, Delt—
    ko: 델타, 반갑습-
    ja: デルタ、やっと会え…
  event_goninjathief_05_s_49:
    speaker: "<Narration>"
    en: "*Whoosh* *Tap!*"
    ko: 슉- 탁!
    ja: シュッ…タンッ！
  event_goninjathief_05_s_50:
    speaker: miranda
    en: Eeek!
    ko: 흐이이…!
    ja: ひょぁぁ！？
  event_goninjathief_05_s_51:
    speaker: miranda
    en: Wh-why are you throwing shurikens all of a sudden...?
    ko: 가, 갑자기 왜 수리검을 던지시는 겁니까…?
    ja: ど、どうして急に手裏剣を…！？
  event_goninjathief_05_s_52:
    speaker: delta_n
    en: You've betrayed the phantom thieves and defected to the police.
    ko: 괴도를 배신하고 경찰로 넘어가셨지 말입니다.
    ja: 怪盗団を裏切り、警察に寝返ったからです。
  event_goninjathief_05_s_53:
    speaker: miranda
    en: I've always been a police officer!
    ko: 저는 원래 경찰이었습니다!
    ja: 私はもともと警察官です！
  event_goninjathief_05_s_54:
    speaker: miranda
    en: I didn't betray anyone!
    ko: 배신하지 않았습니다!
    ja: 裏切ってなんかいません！
  event_goninjathief_05_s_55:
    speaker: delta_n
    en: You were attempting to apprehend me just now, were you not?
    ko: 방금, 저를 잡으려고 두 팔을 벌렸지 말입니다.
    ja: |-
      今まさに、私を捕まえようと
      両腕を広げたではありませんか。
  event_goninjathief_05_s_56:
    speaker: miranda
    en: No, no! I was just so happy to see you that I tried to hug you!
    ko: 그건 반가움을 담아서 안아주려고 했던 겁니다!
    ja: |-
      こ、これは、会えたのがうれしくて
      抱きしめようとしただけです！
  event_goninjathief_05_s_57:
    speaker: delta_n
    en: I will not be deceived by such shallow lies.
    ko: 그런 얄팍한 거짓말에 속지 않습니다.
    ja: そんな見え透いたウソには騙されません。
  event_goninjathief_05_s_58:
    speaker: delta_n
    en: 'Ninjutsu: Binding Technique!'
    ko: 닌자 포박술!
    ja: 忍法、捕り縄の術！
  event_goninjathief_05_s_59:
    speaker: miranda
    en: I-is that... a grenade?!
    ko: 이, 이건…! 수류탄?!
    ja: "…！？"
  event_goninjathief_05_s_60:
    speaker: "<Narration>"
    en: Delta hurls a grenade at Miranda.
    ko: 델타는 미란다에게 수류탄을 던졌고.
    ja: デルタはミランダに手榴弾を投げた
  event_goninjathief_05_s_61:
    speaker: "<Narration>"
    en: It splits in half midair, and ropes burst out.
    ko: |-
      그 순간, 수류탄이 반으로 갈라지며
      안에서 밧줄들이 튀어나왔다.
    ja: |-
      次の瞬間、手榴弾は半分に割れ、
      中からロープが飛び出してきた
  event_goninjathief_05_s_62:
    speaker: miranda
    en: Ack!
    ko: 으악!
    ja: わあぁっ！？
  event_goninjathief_05_s_63:
    speaker: miranda
    en: What's this?!
    ko: 이게 뭡니까?!
    ja: な、なんですかこれは！？
  event_goninjathief_05_s_64:
    speaker: delta_n
    en: A jutsu that binds evildoers with a rope.
    ko: 밧줄을 이용해 악인을 봉인하는 술법입니다.
    ja: ロープを使って悪人の動きを封じる忍術です。
  event_goninjathief_05_s_65:
    speaker: delta_n
    en: No one can escape it by their own strength.
    ko: 혼자의 힘으로는 절대 풀 수 없지 말입니다.
    ja: 決して自力で解くことはできません。
  event_goninjathief_05_s_66:
    speaker: delta_n
    en: And finally, the gag—
    ko: 마지막으로 재갈을-
    ja: 最後に、口を布で…
  event_goninjathief_05_s_67:
    speaker: miranda
    en: Ca-can you wait a moment?
    ko: 자, 잠시만 기다려 주실 수 있습니까?
    ja: ちょ、ちょっと待ってください！
  event_goninjathief_05_s_68:
    speaker: miranda
    en: There's something I want to tell you.
    ko: 델타에게 하고싶은 말이 있습니다.
    ja: その前にお伝えしたいことがあります！
  event_goninjathief_05_s_69:
    speaker: delta_n
    en: State your business, traitor.
    ko: 무엇입니까, 배신자.
    ja: なんでしょうか、裏切り者。
  event_goninjathief_05_s_70:
    speaker: miranda
    en: Poli said she's going to get the bag.
    ko: 폴리가 가방을 가지러 간다고 했습니다.
    ja: |-
      ポリがバッグを確保しに行くと
      言っていました。
  event_goninjathief_05_s_71:
    speaker: miranda
    en: So it'd be better to look for her, not the homeowner.
    ko: |-
      그러니, 이 집의 주인 말고
      폴리를 찾으시는 게 나을 겁니다.
    ja: |-
      なので、ここの家主ではなく
      ポリを捜したほうがいいと思います！
  event_goninjathief_05_s_72:
    speaker: delta_n
    en: "...!"
    ko: "…!"
    ja: "…！"
  event_goninjathief_05_s_73:
    speaker: delta_n
    en: That may be a lie.
    ko: 거짓말일 수도 있지 말입니다.
    ja: そうやってウソであざむくつもりですか？
  event_goninjathief_05_s_74:
    speaker: miranda
    en: I never, ever lie!
    ko: 저는 거짓말을 하지 않습니다!
    ja: 私はウソなんてつきません！
  event_goninjathief_05_s_75:
    speaker: delta_n
    en: Then, why is it that you are helping me?
    ko: 그렇다면 왜 저를 도와주시는 겁니까.
    ja: なら、どうして助言を？
  event_goninjathief_05_s_76:
    speaker: miranda
    en: Because I want to see justice done!
    ko: 정의를 위해서입니다!
    ja: 正義のためです！
  event_goninjathief_05_s_77:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_78:
    speaker: delta_n
    en: There is a way to counter every trick.
    ko: 모든 술법과 술식에는 파훼법이 있는 법입니다.
    ja: すべての忍術は破ることができます。
  event_goninjathief_05_s_79:
    speaker: delta_n
    en: I shall take my leave, then.
    ko: 그럼, 가보겠습니다.
    ja: では、失礼します。
  event_goninjathief_05_s_80:
    speaker: "<Narration>"
    en: "*Creak* *Click*"
    ko: 끼익- 달칵.
    ja: キィィ…バタン
  event_goninjathief_05_s_81:
    speaker: miranda
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_82:
    speaker: miranda
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_83:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 덜컹-
    ja: ガタン…
  event_goninjathief_05_s_84:
    speaker: "<Narration>"
    en: Quency pushes the cabinet aside and steps inside.
    ko: 퀀시가 장식장을 밀며 방 안으로 들어왔다.
    ja: クエンシーが飾り棚を押して部屋に入った
  event_goninjathief_05_s_85:
    speaker: quency_e
    en: I wonder where this leads...
    ko: 여기는 어디로 이어지는 걸까~
    ja: さぁて、ここはどこにつながってるのかな～？
  event_goninjathief_05_s_86:
    speaker: quency_e
    en: Huh? Miranda?
    ko: 으응? 미란다?
    ja: "…あれ？ミランダ？"
  event_goninjathief_05_s_87:
    speaker: miranda
    en: Wa-waaaah...!
    ko: 흐, 흐으으…!
    ja: う、うううっ…！
  event_goninjathief_05_s_88:
    speaker: miranda
    en: Que-Quency! Hi!
    ko: 쿼, 퀀시! 안녕하십니까!
    ja: "…あっ、クエンシー！お疲れさまです！"
  event_goninjathief_05_s_89:
    speaker: miranda
    en: I... Ahem... Could you possibly lend me a hand?
    ko: 저…! 흐윽…! 혹시 손 좀 빌려주실 수 있으십니까?!
    ja: |-
      あの…！ううっ…！
      少し手を貸していただけませんか！？
  event_goninjathief_05_s_90:
    speaker: quency_e
    en: Mi-Miranda...! Are you crying?!
    ko: 미, 미란다…! 울어?!
    ja: え、ええ…っ！？泣いてるの！？
  event_goninjathief_05_s_91:
    speaker: quency_e
    en: Oh my, who on earth tied you up like this?
    ko: 세상에, 대체 누가 이렇게 묶어둔 거야?
    ja: も～、いったい誰がこんなにキツく縛ったの？
  event_goninjathief_05_s_92:
    speaker: quency_e
    en: You must have been so uncomfortable! I'll untie you!
    ko: 많이 불편했지? 풀어줄게!
    ja: 苦しかったでしょ？今ほどくわね～！
  event_goninjathief_05_s_93:
    speaker: miranda
    en: N-no, not that...
    ko: 그, 그것보다는….
    ja: そ、それより…
  event_goninjathief_05_s_94:
    speaker: miranda
    en: My nose...!
    ko: 코…!
    ja: 鼻を…！
  event_goninjathief_05_s_95:
    speaker: quency_e
    en: Your nose?
    ko: 코?
    ja: 鼻？
  event_goninjathief_05_s_96:
    speaker: miranda
    en: My nose is so itchy! It's been torture not being able to scratch it!
    ko: 코 옆이 너무 가려운데 못 긁어서 너무 괴롭습니다!
    ja: 鼻の横がかゆいのに、かけなくてつらいんです！
  event_goninjathief_05_s_97:
    speaker: miranda
    en: Can you please scratch it for me...? Hrrrgh!
    ko: 대신 좀 긁어주시면 감사하겠습니다…! 흐으으!
    ja: ううっ…代わりにかいてくれませんか…！？
  event_goninjathief_05_s_98:
    speaker: quency_e
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_s_99:
    speaker: quency_e
    en: "... Fine, I'll untie you. Scratch it yourself!"
    ko: "…그냥 밧줄 풀어줄게~ 직접 긁어!"
    ja: "…すぐにほどいてあげるから、自分でかいて！"
  event_goninjathief_05_s_100:
    speaker: miranda
    en: Thank you! Thank you so much!
    ko: 감사합니다, 정말 감사합니다!
    ja: |-
      ありがとうございます、
      本当にありがとうございます…！！
event_goninjathief_05_e:
  event_goninjathief_05_e_1:
    speaker: "<Self>"
    en: Oh, Delta came out alone.
    ko: 어, 델타 혼자 나왔어.
    ja: "…ん？デルタが1人で出てきたぞ"
  event_goninjathief_05_e_2:
    speaker: phantom
    en: The one in that room must be Miranda.
    ko: 저 방에 있던 것은 미란다였을 것이오.
    ja: あの部屋にはミランダもいたはずだ。
  event_goninjathief_05_e_3:
    speaker: phantom
    en: "... I hope nothing untoward occurred."
    ko: "…별일 없었기를 바라오."
    ja: "…何事もないことを祈ろう。"
  event_goninjathief_05_e_4:
    speaker: "<Self>"
    en: Wait, isn't that the room Poli went into?
    ko: 잠깐, 저 문은 폴리가 들어간 곳 아냐?
    ja: |-
      待て、デルタが向かった方向には
      ポリがいるんじゃないか？
  event_goninjathief_05_e_5:
    speaker: phantom
    en: Indeed.
    ko: 맞소.
    ja: そのようだな。
  event_goninjathief_05_e_6:
    speaker: phantom
    en: If Delta were to enter completely unaware and encounter Poli, getting caught
      is inevitable...!
    ko: |-
      만약 이대로 아무것도 모른 채 들어가서
      폴리와 마주치고 체포당한다면…!
    ja: |-
      もしあのまま同じ部屋に入り、
      ポリと出くわして逮捕でもされたら…！
  event_goninjathief_05_e_7:
    speaker: phantom
    en: Not only would her mission fail, but our newest member of the Thieves of Justice
      would be confined to prison for all eternity!
    ko: |-
      임무 실패는 물론이고, 정의 괴도단의 새로운 멤버는
      영영 감옥 안에 갇혀 사는 것이오!!
    ja: |-
      任務失敗どころか、
      正義の怪盗団の新メンバーは
      一生牢屋で過ごすことになってしまう！
  event_goninjathief_05_e_8:
    speaker: phantom
    en: Ah, our ninja thief...!
    ko: 아아, 우리의 괴도 닌자 델타여…!!
    ja: ああ、怪盗忍者デルタよ…！！
  event_goninjathief_05_e_9:
    speaker: "<Self>"
    en: Keep it down, or we'll get caught!
    ko: 조용히 해, 들키겠어!
    ja: 静かにしろ、見つかるぞ！
  event_goninjathief_05_e_10:
    speaker: phantom
    en: This won't do.
    ko: 안 되겠소.
    ja: こうしてはいられない。
  event_goninjathief_05_e_11:
    speaker: phantom
    en: Monsieur, I shall keep watch over Poli. Might I trouble you to hold Delta
      back for a while?
    ko: |-
      그대, 내가 폴리 쪽을 지켜볼 테니,
      델타의 발을 잡아둘 수 있겠소?
    ja: |-
      私がポリを見張っておくから、
      デルタの足止めをお願いできるかい？
  event_goninjathief_05_e_12:
    speaker: "<Self>"
    en: Me?
    ko: 내가?
    ja: 私が？
  event_goninjathief_05_e_13:
    speaker: phantom
    en: Then, I shall entrust this to you.
    ko: 그럼, 부탁드리오.
    ja: ああ、頼んだよ。
  event_goninjathief_05_e_14:
    speaker: "<Monologue>"
    en: Phantom bolts toward the far side of the hole.
    ko: 팬텀이 다급하게 구멍의 반대쪽으로 달려갔고.
    ja: |-
      ファントムは急いで抜け穴の反対側へと
      向かった
  event_goninjathief_05_e_15:
    speaker: "<Monologue>"
    en: And then...
    ko: 그때.
    ja: その直後
  event_goninjathief_05_e_16:
    speaker: "<Narration>"
    en: "*Swoooosh* *Thunk!*"
    ko: 슈루룩- 탁!!
    ja: シュルルル――タッ！
  event_goninjathief_05_e_17:
    speaker: "<Monologue>"
    en: A sharp shuriken flies through the gap in the vent cover just inches from
      my face and hits hard.
    ko: |-
      눈 앞을 가린 환풍구의 틈 사이로,
      날카로운 수리검이 날아와 박히는 것이 보였다.
    ja: |-
      目の前の通気口の隙間から
      手裏剣が勢いよく飛びだし壁に刺さった
  event_goninjathief_05_e_18:
    speaker: "<Self>"
    en: A-aah...
    ko: 히, 히익….
    ja: ひっ…！？
  event_goninjathief_05_e_19:
    speaker: delta_n
    en: The air feels strangely restless.
    ko: 공기가 묘하게 소란스럽지 말입니다.
    ja: なんだか妙に騒がしいですね。
  event_goninjathief_05_e_20:
    speaker: delta_n
    en: You in the vent, it would be best if you come out quietly.
    ko: 거기 환풍구 안, 순순히 나오시는 게 좋을 겁니다.
    ja: |-
      通気口の中にいるのは分かっています。
      大人しく出てきてください。
  event_goninjathief_05_e_21:
    speaker: "<Monologue>"
    en: "... Doesn't feel right to just go out like this..."
    ko: "…이대로 순순히 나가는 것도 좀 그렇겠지?"
    ja: "…このまま出ていくのは、ちょっとアレだよな？"
  event_goninjathief_05_e_22:
    speaker: "<Monologue>"
    en: I fumble through my pockets, looking for something to throw.
    ko: 나는 주머니에 던질만한 것들이 없나, 살펴보았고.
    ja: 何か投げられる物がないかポケットを探ると
  event_goninjathief_05_e_23:
    speaker: "<Monologue>"
    en: All I can find are Phantom's calling cards—ones that never got to do their
      job and ended up scattered on the floor.
    ko: |-
      미처 제 역할을 하지 못하고 바닥에 떨어졌던
      팬텀의 예고장들을 꺼내 들었다.
    ja: |-
      窓に届くことなく落ちた
      ファントムの予告状が入っていた
  event_goninjathief_05_e_24:
    speaker: "<Narration>"
    en: "*Rustle rustle*"
    ko: 바스락- 바스락-
    ja: ガサガサ…
  event_goninjathief_05_e_25:
    speaker: "<Monologue>"
    en: I crumple them up and toss them at Delta one by one.
    ko: 그리고 예고장을 하나씩 구겨서, 델타에게 던졌다.
    ja: |-
      その予告状を1つずつ折ると、
      デルタに向かって投げた
  event_goninjathief_05_e_26:
    speaker: "<Narration>"
    en: "*Whoosh* *Thunk!*"
    ko: 휙- 툭!
    ja: シュッ！パサッ！
  event_goninjathief_05_e_27:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_e_28:
    speaker: delta_n
    en: This is a calling card from the Thieves of Justice.
    ko: 이건, 정의 괴도단의 예고장이지 말입니다.
    ja: これは…正義の怪盗団の予告状ですね。
  event_goninjathief_05_e_29:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 바스락-
    ja: ガサッ…
  event_goninjathief_05_e_30:
    speaker: delta_n
    en: "... There are sentences here I can't make sense of."
    ko: "…게다가 알 수 없는 문장들이 쓰여 있습니다."
    ja: "…それに、謎の文章が書いてあります。"
  event_goninjathief_05_e_31:
    speaker: delta_n
    en: So Miranda wasn't the only one who betrayed me?
    ko: 배신한 건 미란다뿐만이 아니었다는 것입니까.
    ja: |-
      裏切り者はミランダ以外にもいる
      ということでしょうか…
  event_goninjathief_05_e_32:
    speaker: delta_n
    en: Or is this all some kind of test?
    ko: 아니면, 이 모든 게 테스트를 위한 시련인 것입니까.
    ja: |-
      それとも、これもテストのうちだという
      ことでしょうか…？
  event_goninjathief_05_e_33:
    speaker: delta_n
    en: "... Hmph."
    ko: "…후우."
    ja: "…ふぅ。"
  event_goninjathief_05_e_34:
    speaker: delta_n
    en: Either way, I'll accept it.
    ko: 뭐가 됐든, 받아들이겠습니다.
    ja: なんであれ、全力で臨むのみです。
  event_goninjathief_05_e_35:
    speaker: "<Self>"
    en: Huh...? Wait—
    ko: 어…? 잠깐만-
    ja: ん…？ちょっとまっ――
  event_goninjathief_05_e_36:
    speaker: delta_n
    en: 'Ninjutsu: Sound Extinction!'
    ko: 인법, 음멸!
    ja: 忍法、音滅！
  event_goninjathief_05_e_37:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 펑!!
    ja: パンッ！！
  event_goninjathief_05_e_38:
    speaker: "<Narration>"
    en: "*Whoooosh*"
    ko: 촤아아아아-
    ja: ボフンッ…
  event_goninjathief_05_e_39:
    speaker: "<Monologue>"
    en: Powder bursts out, spreading through the air. It clings to the walls and ceiling,
      then starts to expand.
    ko: 가루들이 퍼지더니, 벽과 천장에 붙어 부풀기 시작했다.
    ja: |-
      謎の粉が勢いよくまかれ、
      壁と天井に付着するや大きく膨れあがった
  event_goninjathief_05_e_40:
    speaker: delta_n
    en: This is a jutsu that silences everything.
    ko: 모든 음을 사라지게 하는 인술입니다.
    ja: すべての音を消す忍術です。
  event_goninjathief_05_e_41:
    speaker: delta_n
    en: From now on, no one will hear a sound from this place.
    ko: 이제 이곳에서 나는 소리를 아무도 듣지 못하게 되지 말입니다.
    ja: これでもう、ここの音は誰にも聞こえません。
  event_goninjathief_05_e_42:
    speaker: "<Self>"
    en: You just made it into a soundproof booth...!
    ko: 그냥 방음부스처럼 만든 거잖아…!
    ja: ただ防音ブースを作っただけじゃないか…！
  event_goninjathief_05_e_43:
    speaker: delta_n
    en: Even if you scream for help, no one will come.
    ko: 소리치고 도움을 구해도, 올 사람은 없을 겁니다.
    ja: 叫んで助けを求めてもムダです。
  event_goninjathief_05_e_44:
    speaker: delta_n
    en: Show yourself now.
    ko: 순순히 정체를 드러내시지 말입니다.
    ja: 大人しく正体を明かしてください。
  event_goninjathief_05_e_45:
    speaker: delta_n
    en: If not...
    ko: 그렇지 않으면….
    ja: さもなくば…
  event_goninjathief_05_e_46:
    speaker: "<Narration>"
    en: "*Swoooosh* *Thunk!* *Thunk!*"
    ko: 슈루룩- 탁!! 탁!!
    ja: シュルル――タタンッ！
  event_goninjathief_05_e_47:
    speaker: delta_n
    en: I will attack.
    ko: 공격하겠습니다.
    ja: 攻撃します。
  event_goninjathief_05_e_48:
    speaker: "<Self>"
    en: You're already attacking!
    ko: 이미 했잖아!
    ja: もうしてるだろ！
  event_goninjathief_05_e_49:
    speaker: delta_n
    en: For your information, the shurikens I just threw are rigged with expl—
    ko: 참고로 방금 던진 수리검에는 폭탄이 부착되어 있-
    ja: ちなみに、今投げた手裏剣には爆弾がついて…
  event_goninjathief_05_e_50:
    speaker: "<Narration>"
    en: "*Boom!* *Kaboom!*"
    ko: 쾅! 우당탕!
    ja: ドカァァン！
  event_goninjathief_05_e_51:
    speaker: "<Monologue>"
    en: I yelp and tumble out of the vent.
    ko: 나는 기겁을 하며 환풍구에서 구르듯 뛰쳐나왔다.
    ja: |-
      驚きのあまり、悲鳴を上げながら
      通気口から転がるように飛び出した
  event_goninjathief_05_e_52:
    speaker: "<Self>"
    en: I'm out! I'm out!
    ko: 나왔어! 나왔다고!
    ja: で、出た！出たから勘弁してくれ！
  event_goninjathief_05_e_53:
    speaker: "<Self>"
    en: What the hell? Are you seriously trying to kill me?
    ko: 왜 이러는 거야, 진짜 사람을 죽일 셈이야?
    ja: どういうつもりだ？本当に殺す気か…！？
  event_goninjathief_05_e_54:
    speaker: "<Narration>"
    en: "*Whooosh*"
    ko: 푸슈우욱~
    ja: プシュゥゥゥ…
  event_goninjathief_05_e_55:
    speaker: "<Narration>"
    en: "*Bang!* *Pop, pop!*"
    ko: 펑! 퍼퍼펑~!
    ja: パン！パパパーン！！
  event_goninjathief_05_e_56:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_e_57:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_e_58:
    speaker: delta_n
    en: I modified the fireworks into bombs to disorient the enemy.
    ko: |-
      적들을 교란에 빠지게 하기 위해,
      폭죽을 폭탄 모양으로 개조했지 말입니다.
    ja: |-
      …いますが、敵を混乱に陥らせるため、
      爆竹を爆弾の形に改造したものです。
  event_goninjathief_05_e_59:
    speaker: "<Self>"
    en: No, I... *Sigh*
    ko: 아니, 하아….
    ja: はぁ…
  event_goninjathief_05_e_60:
    speaker: delta_n
    en: But why are you here, Commander?
    ko: 그런데 지휘관이 왜 여기 계시는 겁니까?
    ja: ところで、なぜ指揮官がここに？
  event_goninjathief_05_e_61:
    speaker: delta_n
    en: Surely...
    ko: 설마….
    ja: まさか…
  event_goninjathief_05_e_62:
    speaker: delta_n
    en: you didn't come all this way because you don't think I'm reliable?
    ko: 제가 미덥지 못해서 여기까지 오신 겁니까?
    ja: |-
      私のことが信用できず、
      後を追ってきたのですか？
  event_goninjathief_05_e_63:
    speaker: "<Self>"
    en: It's not like that—
    ko: 그게 아니라-
    ja: そうではなくてだな…
  event_goninjathief_05_e_64:
    speaker: delta_n
    en: I do not consider myself capable of becoming a full phantom thief just yet.
    ko: |-
      저도 스스로가,
      당장 괴도가 될 정도로 뛰어나다고 생각하진 않습니다.
    ja: |-
      すぐに怪盗になれるほどの
      実力ではないことは自分でも分かっています。
  event_goninjathief_05_e_65:
    speaker: delta_n
    en: But I did not expect to be trusted so little...
    ko: 하지만, 이렇게까지 신뢰를 받지 못할 거라고는….
    ja: ですが、ここまで信用されていないとは…
  event_goninjathief_05_e_66:
    speaker: "<Self>"
    en: No, no, that's not it!
    ko: 그, 그게 아니라!
    ja: ご、誤解だ！
  event_goninjathief_05_e_67:
    speaker: "<Self>"
    en: Even if this is supposed to be "for real," it's still a test...
    ko: 실전이라곤 해도 이건 테스트잖아…?
    ja: 実践とはいえ、これはテストだろう…？
  event_goninjathief_05_e_68:
    speaker: "<Self>"
    en: that's why I came to give you a hint!
    ko: 그래서 힌트를 주러 온 거야!
    ja: だからヒントを与えに来たんだ！
  event_goninjathief_05_e_69:
    speaker: delta_n
    en: A hint?
    ko: 힌트 말입니까?
    ja: ヒント…ですか？
  event_goninjathief_05_e_70:
    speaker: "<Self>"
    en: Yep! If you found me hiding, you'd get a hint!
    ko: |-
      그래, 숨어있는 나를 찾으면
      힌트를 받을 수 있는 이벤트였던 거지!
    ja: |-
      ああ。隠れている私を見つけたら
      ヒントがもらえるという仕組みだ！
  event_goninjathief_05_e_71:
    speaker: delta_n
    en: Understood.
    ko: 확인했습니다.
    ja: そういうことでしたか。分かりました。
  event_goninjathief_05_e_72:
    speaker: delta_n
    en: What hint is it?
    ko: 어떤 힌트입니까?
    ja: それで、ヒントはなんでしょうか？
  event_goninjathief_05_e_73:
    speaker: "<Self>"
    en: Wa-watch out for Poli!
    ko: 포… 폴리를 조심해!
    ja: ポ…ポリには気をつけろ！
  event_goninjathief_05_e_74:
    speaker: "<Self>"
    en: You'll be running into her soon.
    ko: 곧 만나게 될 거야.
    ja: おそらく、もうすぐ鉢合わせるはずだ
  event_goninjathief_05_e_75:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_e_76:
    speaker: delta_n
    en: Miranda said the same thing.
    ko: 미란다와 비슷한 말씀을 하시지 말입니다.
    ja: ミランダと同じようなことを言うのですね。
  event_goninjathief_05_e_77:
    speaker: delta_n
    en: Was she also tasked with giving hints...?
    ko: 미란다도 사실 힌트를 주는 역할이었던 것입니까….
    ja: |-
      つまりミランダも、ヒントを伝えるために
      来たということですか…
  event_goninjathief_05_e_78:
    speaker: "<Self>"
    en: Huh? Miranda did what?
    ko: 응? 미란다가 뭐 어쨌다고?
    ja: ん？ミランダがどうした？
  event_goninjathief_05_e_79:
    speaker: delta_n
    en: I must apologize to her later.
    ko: 추후에 사과드려야 하지 말입니다.
    ja: いえ。あとで謝らなくてはなりませんね。
  event_goninjathief_05_e_80:
    speaker: delta_n
    en: In any case, I understand.
    ko: 어쨌든, 이해했습니다.
    ja: とにかく、分かりました。
  event_goninjathief_05_e_81:
    speaker: delta_n
    en: Though it is a real mission, it is ultimately still a test.
    ko: 실전이라곤 했지만, 결국은 테스트지 말입니다.
    ja: |-
      実践とはいえ、
      テストはテスト…ということですね。
  event_goninjathief_05_e_82:
    speaker: delta_n
    en: Thank you for your assistance.
    ko: 도움에 감사드립니다.
    ja: ヒントをありがとうございました。
  event_goninjathief_05_e_83:
    speaker: "<Self>"
    en: One more thing, Delta.
    ko: 그리고, 델타.
    ja: いや…それと、もう一ついいか？
  event_goninjathief_05_e_84:
    speaker: delta_n
    en: Yes, I am listening.
    ko: 네, 듣고 있지 말입니다.
    ja: はい、なんでしょうか。
  event_goninjathief_05_e_85:
    speaker: "<Self>"
    en: Doing this solo isn't what's important.
    ko: 혼자 잘하는 건 중요하지 않아.
    ja: 1人で頑張ろうとするな
  event_goninjathief_05_e_86:
    speaker: "<Self>"
    en: The Thieves of Justice work together, so if you need help, just let us know.
    ko: |-
      정의 괴도단은 함께니까,
      도움이 필요하면 언제든 말해.
    ja: |-
      正義の怪盗団は全員で一つのチームなんだ。
      助けが必要な時は、いつでも言ってくれ
  event_goninjathief_05_e_87:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_e_88:
    speaker: delta_n
    en: Understood.
    ko: 알겠습니다.
    ja: 分かりました。
  event_goninjathief_05_e_89:
    speaker: "<Monologue>"
    en: Delta peels away the swollen solids from the door, then cautiously moves to
      the next door.
    ko: |-
      델타는 문에 붙은 부푼 고체들을 떼어낸 후,
      조심스레 다음 문으로 이동했다.
    ja: |-
      デルタはドアについた膨らんだ物体をはがすと、
      慎重に隣のドアへと移動した
  event_goninjathief_05_e_90:
    speaker: "<Self>"
    en: Whew...
    ko: 후우….
    ja: ふぅ…
  event_goninjathief_05_e_91:
    speaker: quency_e
    en: "\"Doing this solo isn't what's important."
    ko: 혼좌 잘 하는 권 중요하쥐 아나.
    ja: 1人で頑張ろうとするな。
  event_goninjathief_05_e_92:
    speaker: quency_e
    en: The Thieves of Justice work together, so if you need help, just let us know."
    ko: |-
      정의 괴도단은 함께뉘까,
      도움이 필요하묜 언줴든 말훼.
    ja: |-
      正義の怪盗団は全員で一つのチームなんだ。
      助けが必要な時は、いつでも言ってくれ。
  event_goninjathief_05_e_93:
    speaker: quency_e
    en: Woooow, that's so cool, Instructor!
    ko: 크으으으~ 멋지다 교관님~!
    ja: くぅぅぅ～！！教官様、カッコイイ～！
  event_goninjathief_05_e_94:
    speaker: quency_e
    en: I didn't know you cared this much about the Thieves of Justice, hehe!
    ko: 우리 괴도단을 이렇게까지 생각하고 있었구나~ 키킥!
    ja: |-
      まさか怪盗団のこと、
      そこまで考えてくれてたなんて～！ふふっ！
  event_goninjathief_05_e_95:
    speaker: miranda
    en: Whoa, amazing!
    ko: 정말 멋집니다!
    ja: ううっ…本当に感動しました！
  event_goninjathief_05_e_96:
    speaker: miranda
    en: The Thieves of Justice are one!
    ko: 정의 괴도단은 함께입니다!
    ja: 正義の怪盗団は、みんなで一つです！
  event_goninjathief_05_e_97:
    speaker: miranda
    en: Together, we are strong!
    ko: 뭉치면 강해집니다!
    ja: 団結すれば最強です！
  event_goninjathief_05_e_98:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_05_e_99:
    speaker: "<Monologue>"
    en: I just want this to end...
    ko: 죽고 싶다….
    ja: もう、消えてしまいたい…
event_goninjathief_06_s:
  event_goninjathief_06_s_1:
    speaker: "<Narration>"
    en: The pickpocket is in utter panic.
    ko: 소매치기는 매우 당황한 상태이다.
    ja: その頃、スリの男はひどく動揺していた
  event_goninjathief_06_s_2:
    speaker: "<Narration>"
    en: All of a sudden, it all makes sense—the bag he stole is filled to the brim
      with valuable items. Could it be that the phantom thieves are planning to take
      it all back?
    ko: |-
      어쩐지 훔친 가방 안에 값진 물건들이 가득 있더라니,
      괴도들이 도로 가져가겠다는 것이 아닌가!
    ja: |-
      盗んだバッグの中に高価な物が
      たっぷり詰まっていたせいで
      怪盗から予告状が届いたに違いない！
  event_goninjathief_06_s_3:
    speaker: "<Narration>"
    en: It's only after he frantically calls the police that he realizes he himself
      is the thief.
    ko: |-
      그는 놀라서 경찰에게 신고를 하고 난 후에야
      본인이 소매치기라는 것을 깨달았고.
    ja: |-
      そう思いあわてて警察に通報した直後、
      自身が窃盗犯だということを思い出したのだった
  event_goninjathief_06_s_4:
    speaker: "<Narration>"
    en: Whether or not the real thieves show up, just having the police at his doorstep
      has already turned this into a huge disaster.
    ko: |-
      진짜 괴도가 오든 말든,
      일단 본인 집에 경찰들이 왔다는 것만으로도 큰 일이 된 것이다.
    ja: |-
      本当に怪盗が来ようが来まいが、
      自宅に警察がやって来たというだけで
      犯罪者にとっては一大事である
  event_goninjathief_06_s_5:
    speaker: pickpocket
    en: Right...
    ko: 그래….
    ja: ああ…
  event_goninjathief_06_s_6:
    speaker: pickpocket
    en: Gotta get outta here!
    ko: 지금이라도 도망가자.
    ja: 今からでも逃げねえと…
  event_goninjathief_06_s_7:
    speaker: pickpocket
    en: Just grab the stuff in this bag and bolt!
    ko: 이 가방 안에 내용물만 빼내서 튀는 거야.
    ja: バッグの中身だけ持ってここを出るか…？
  event_goninjathief_06_s_8:
    speaker: "<Narration>"
    en: "*Rustle* *Clatter*"
    ko: 부스럭- 잘그랑-
    ja: ガサゴソ、ジャラッ――
  event_goninjathief_06_s_9:
    speaker: "<Narration>"
    en: The man starts picking out the expensive accessories from the bag and stuffing
      them into his pockets.
    ko: |-
      소매치기는 가방에서 값비싼 액세서리들을 골라내
      주머니에 넣기 시작했다.
    ja: |-
      男はバッグの中から高価そうなアクセサリーを
      選ぶと、ポケットの中にしまった
  event_goninjathief_06_s_10:
    speaker: pickpocket
    en: "*Sigh* But is it really right to just abandon this house?"
    ko: 하… 그렇다고 집을 버리는 게 맞나?
    ja: はぁ…本当に家を捨てちまっていいのか…？
  event_goninjathief_06_s_11:
    speaker: pickpocket
    en: I mean, I did steal it, but I could always say that there was only this stuff
      inside!
    ko: |-
      그냥, 훔친 거 맞긴 한데
      안에는 이것들밖에 없었어요! 하는 게 더 낫지 않나?
    ja: |-
      いっそ盗んだことは認めて、
      「盗んだのはこれだけです！」って
      シラを切っちまえばいいんじゃねえか？
  event_goninjathief_06_s_12:
    speaker: pickpocket
    en: Ugh...! What should I do...?
    ko: 으으으…! 어떡하지…!
    ja: うぅぅ…どうすればいいんだ…！
  event_goninjathief_06_s_13:
    speaker: "<Narration>"
    en: "*Knock, knock*"
    ko: 똑똑.
    ja: コンコン
  event_goninjathief_06_s_14:
    speaker: pickpocket
    en: Eeek!
    ko: 흐이이익!!!
    ja: ひいいいっ！！
  event_goninjathief_06_s_15:
    speaker: pickpocket
    en: Wh-wh-who's there?!
    ko: 누, 누, 누구야?!
    ja: だ、だ、誰だ！？
  event_goninjathief_06_s_16:
    speaker: poli
    en: Hello, it's A.C.P.U.!
    ko: 안녕하세영, A.C.P.U.입니당.
    ja: こんばんはぁ～。A.C.P.U.ですぅ。
  event_goninjathief_06_s_17:
    speaker: poli
    en: Can I come in for a moment?
    ko: 잠시 들어가도 될까영?
    ja: 入ってもよろしいでしょうかぁ？
  event_goninjathief_06_s_18:
    speaker: pickpocket
    en: Th-the police...!
    ko: 겨, 경찰…!
    ja: け、警察…！
  event_goninjathief_06_s_19:
    speaker: pickpocket
    en: Wh-what's going on...? I can keep the bag safe myself...!
    ko: |-
      무, 무슨 일로…?
      가방은 제가 잘 지키고 있습니다…!
    ja: |-
      な、何かご用ですか…？
      バッグなら自分で管理しますので…！
  event_goninjathief_06_s_20:
    speaker: poli
    en: Since it's hard to predict the phantom thieves' moves, it's even more dangerous
      if you're on your own.
    ko: |-
      괴도는 일반적인 방법으로 이동하지 않아성,
      그렇게 따로 계시면 더 위험할 것 같아영.
    ja: |-
      怪盗がどんな手を使って
      侵入してくるか分かりませんので、
      離れているほうが危険ですよん。
  event_goninjathief_06_s_21:
    speaker: poli
    en: How about letting us hold onto the bag for you?
    ko: 가방은 저희가 맡을 테닝 주시는 게 어떠실까 해서영.
    ja: |-
      バッグは私たちのほうで預かりますので、
      渡していただけませんかぁ？
  event_goninjathief_06_s_22:
    speaker: pickpocket
    en: N-no, it's fine! I can handle it, so don't worry!
    ko: |-
      괘, 괜찮습니다.
      제가 잘 지킬 테니 신경 쓰지 마세요!
    ja: |-
      だ、大丈夫です！
      自分で守れるので、気にしないでください！
  event_goninjathief_06_s_23:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_24:
    speaker: phantom
    en: Hmm...
    ko: 음….
    ja: "…おっと。"
  event_goninjathief_06_s_25:
    speaker: phantom
    en: A fork in the path...
    ko: 갈림길이라….
    ja: 分かれ道か…
  event_goninjathief_06_s_26:
    speaker: phantom
    en: To reach the room Poli entered, was it the right, or the left...?
    ko: 폴리가 들어간 방으로 가려면 오른쪽인가, 왼쪽인가….
    ja: ポリのいる部屋は右か、左か…
  event_goninjathief_06_s_27:
    speaker: phantom
    en: I distinctly recall it... being the left...
    ko: 분명… 왼쪽이라고 기억하고 있소만….
    ja: 確か、左だったはずだが…
  event_goninjathief_06_s_28:
    speaker: phantom
    en: Hmm...
    ko: 흠….
    ja: ふむ…
  event_goninjathief_06_s_29:
    speaker: phantom
    en: Hmmmmmm!
    ko: 흐으으음!
    ja: ふ～～む！
  event_goninjathief_06_s_30:
    speaker: phantom
    en: Yet, since I never seem to arrive at my intended destination, this time I
      shall proceed contrary to my own thoughts!
    ko: |-
      그렇기엔 매번 원하던 목적지에 도달하지 못했으니,
      이번에는 생각과 다르게 나아가보겠소!
    ja: |-
      こちらだと思ったほうに進むと、
      いつもたどり着けないからな…
      今回は逆を行くとしよう！
  event_goninjathief_06_s_31:
    speaker: "<Narration>"
    en: And with that, Phantom takes the right path at the fork.
    ko: 그렇게, 팬텀은 갈림길에서 오른쪽으로 나아갔고.
    ja: ファントムは分かれ道を右に進んだ
  event_goninjathief_06_s_32:
    speaker: phantom
    en: Could this truly be it...?
    ko: 과연 여기가 맞…!
    ja: さあ、吉と出るか…！
  event_goninjathief_06_s_33:
    speaker: "<Narration>"
    en: "*Creak*"
    ko: 끼익-!
    ja: キィ…
  event_goninjathief_06_s_34:
    speaker: "<Narration>"
    en: Phantom pushes a clock aside and climbs out of the hole.
    ko: 팬텀은 시계를 뒤로 밀며 구멍에서 나왔고.
    ja: |-
      ファントムは目の前の時計を横にずらすと、
      抜け穴から出た
  event_goninjathief_06_s_35:
    speaker: poli
    en: This seems really fishy... I'm gonna force the door open!
    ko: 너무 수상해영, 강제로 문을 열겠…!
    ja: |-
      むむ…怪しすぎますぅ。こうなったら、
      無理やりにでも入らせていただきますよん！
  event_goninjathief_06_s_36:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 쾅!
    ja: バン！
  event_goninjathief_06_s_37:
    speaker: "<Narration>"
    en: At the same time, Poli unlocks the door and barges in with a hard push.
    ko: 그와 동시에, 폴리가 문의 잠금을 풀고 강하게 밀며 들어왔다.
    ja: |-
      それと同時に、ポリがドアの鍵を開けて
      勢いよく入ってきた
  event_goninjathief_06_s_38:
    speaker: pickpocket
    en: Eeek!
    ko: 히이이익-!!!
    ja: ひいぃぃっ！！？
  event_goninjathief_06_s_39:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_40:
    speaker: phantom
    en: Hmm, I was right, but I fear my entrance was rather too audacious.
    ko: 음, 맞았지만 너무 당당하게 들어와 버렸소.
    ja: |-
      …どうやら合っていたようだが、
      タイミングが悪かったようだな。
  event_goninjathief_06_s_41:
    speaker: poli
    en: Hello, Phantom.
    ko: 안녕하세영, 팬텀.
    ja: こんばんはぁ～、ファントム。
  event_goninjathief_06_s_42:
    speaker: poli
    en: We meet again.
    ko: 여기서 또 만나네영.
    ja: また会いましたねぇ。
  event_goninjathief_06_s_43:
    speaker: phantom
    en: Glad to see you.
    ko: 반갑소.
    ja: これはどうも。
  event_goninjathief_06_s_44:
    speaker: phantom
    en: Perhaps we might share a hug of greeting?
    ko: 혹시, 반가움의 포옹이라도 나누겠소?
    ja: 再会のハグでも交わすかい？
  event_goninjathief_06_s_45:
    speaker: poli
    en: I don't think now's really the time.
    ko: 지금은 그럴 때가 아닌 것 같아영.
    ja: 今はそんな場合じゃありません。
  event_goninjathief_06_s_46:
    speaker: poli
    en: I need to arrest you, and I've got something to discuss with this gentleman
      too.
    ko: 저는 팬텀을 체포해야 하공, 이 분과도 할 얘기가 있거든영.
    ja: |-
      あなたを逮捕して、
      この方とお話をしなければならないのでぇ。
  event_goninjathief_06_s_47:
    speaker: phantom
    en: Arrest me? Have we no loyalty between us...? Surely that is too cruel.
    ko: 체포라니, 우리 사이에 의리가 있지… 너무한 것 아니오.
    ja: 逮捕とはひどいな。私たちの仲じゃないか。
  event_goninjathief_06_s_48:
    speaker: poli
    en: Grrrr!
    ko: 크르르릉!
    ja: グルルル！
  event_goninjathief_06_s_49:
    speaker: poli
    en: There's no such thing!
    ko: 그런 거 없어영!
    ja: おふざけはそこまでですよん！
  event_goninjathief_06_s_50:
    speaker: pickpocket
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_51:
    speaker: "<Narration>"
    en: "*Pad, pad*"
    ko: 살금- 살금-
    ja: そろり…そろり…
  event_goninjathief_06_s_52:
    speaker: phantom
    en: By the way...
    ko: 그런데 말이오.
    ja: ところで。
  event_goninjathief_06_s_53:
    speaker: phantom
    en: it seems that wicked one is attempting to make his escape, would you not agree?
    ko: 지금 저 악한 자가 도망가는 것 같은데, 맞소?
    ja: 悪人が逃げようとしているが、いいのかい？
  event_goninjathief_06_s_54:
    speaker: poli
    en: What?!
    ko: 뭐라구영?!
    ja: 何ですってぇ！？
  event_goninjathief_06_s_55:
    speaker: pickpocket
    en: Uh... something urgent came up.
    ko: 제, 제가 급한 일이 생겨서요.
    ja: ちょ、ちょっと急用を思い出しまして。
  event_goninjathief_06_s_56:
    speaker: pickpocket
    en: I-I left the bag in there, so feel free to take it!
    ko: 그, 가방은 거기에 뒀으니까 편하게 가져가세요!
    ja: |-
      バッグならそこにあるので、
      持っていってください！
  event_goninjathief_06_s_57:
    speaker: pickpocket
    en: Well, I'll be going then.
    ko: 그럼 전 이만.
    ja: では、失礼します！
  event_goninjathief_06_s_58:
    speaker: "<Narration>"
    en: "*Slam!*"
    ko: 쾅!
    ja: バタン！
  event_goninjathief_06_s_59:
    speaker: "<Narration>"
    en: The pickpocket darts out, slamming the door behind him.
    ko: 소매치기가 빠른 속도로 문을 닫으며 나갔다.
    ja: 男は急いでドアを閉めて出ていった
  event_goninjathief_06_s_60:
    speaker: poli
    en: Grrrrr!
    ko: 크르르릉!
    ja: グルルル！
  event_goninjathief_06_s_61:
    speaker: phantom
    en: Hmm...
    ko: 흠.
    ja: ふむ。
  event_goninjathief_06_s_62:
    speaker: phantom
    en: This bag contains only odds and ends.
    ko: 가방에는 잡동사니들만 들었소.
    ja: バッグの中はガラクタばかりだな。
  event_goninjathief_06_s_63:
    speaker: phantom
    en: The original contents appear to have been taken elsewhere.
    ko: 원래 들어있던 건 따로 빼간 것 같소.
    ja: もともと入っていた物は持っていったようだ。
  event_goninjathief_06_s_64:
    speaker: poli
    en: Quiry! Miranda!
    ko: 키리, 미란다!
    ja: キリ、ミランダ！
  event_goninjathief_06_s_65:
    speaker: poli
    en: The homeowner ran off! We gotta catch him!
    ko: 집주인이 도망갔어영, 잡아야 해영!
    ja: 家主が逃げましたぁ！捕まえてくださぁい！
  event_goninjathief_06_s_66:
    speaker: quiry_op
    en: The homeowner?
    ko: 집주인이요?
    ja: えっ、家主がですか？
  event_goninjathief_06_s_67:
    speaker: quiry_op
    en: Why did he run away?
    ko: 집주인이 왜 도망을 가나요?
    ja: どうしてそんな…？
  event_goninjathief_06_s_68:
    speaker: miranda_op_r
    en: That's because the homeowner is a pickpocket! A really bad guy!
    ko: 집주인은 소매치기입니다! 아주 나쁜 사람입니다!
    ja: 家主はスリの常習犯なんです！極悪人なんです！
  event_goninjathief_06_s_69:
    speaker: poli
    en: We don't have any proof yet, but seeing him run off like that is kinda suspicious.
    ko: 증거는 없지만, 저를 보고 도망간 걸 보니 수상하긴 해영.
    ja: |-
      証拠はありませんが、私を見るなり
      逃げだしたので怪しいのは間違いありません！
  event_goninjathief_06_s_70:
    speaker: poli
    en: Let's catch him first!
    ko: 일단 잡아영!
    ja: ひとまず捕まえてくださぁい！
  event_goninjathief_06_s_71:
    speaker: quiry_op
    en: Oh...! Got it!
    ko: 아…! 네, 알겠어요!
    ja: あっ、はい！分かりました！
  event_goninjathief_06_s_72:
    speaker: poli
    en: This is just a temporary truce, Phantom.
    ko: 잠시 휴전이에영, 팬텀.
    ja: ファントム、しばし休戦ですぅ。
  event_goninjathief_06_s_73:
    speaker: phantom
    en: You are not my enemy, so this can scarcely be called a truce.
    ko: |-
      내 적은 당신이 아니기 때문에,
      애초에 휴전이라고 할 수도 없소.
    ja: |-
      そもそも戦いすら始まっていないだろう？
      私は君と敵対する気はないのだからね。
  event_goninjathief_06_s_74:
    speaker: phantom
    en: Once we have reclaimed the item, we shall be on our way.
    ko: 물건만 되찾으면 우린 빠질 테니 말이오.
    ja: |-
      目的の物さえ取り返せば、
      すぐにでもこの場を去ろう。
  event_goninjathief_06_s_75:
    speaker: poli
    en: We'll talk about that later! Let's go catch him!
    ko: 그 얘긴 이따 하공, 쫓아가졍!
    ja: その話は後にして、早く追いますよん！
  event_goninjathief_06_s_76:
    speaker: miranda
    en: The pickpocket's getting away!
    ko: 소매치기가 도망가고 있다고 합니다!
    ja: 極悪人が逃げたそうです！
  event_goninjathief_06_s_77:
    speaker: miranda
    en: We have to catch him!
    ko: 잡아야 합니다!
    ja: 急いで捕まえなくては！
  event_goninjathief_06_s_78:
    speaker: "<Self>"
    en: There are two passages. Let's go this way.
    ko: 통로는 2개니까, 이쪽으로 들어가자.
    ja: 道が二手に分かれているな。ならこちらに行こう
  event_goninjathief_06_s_79:
    speaker: quiry
    en: "*Pant pant*"
    ko: 헤엑! 헤엑!
    ja: はぁ、はぁっ…！
  event_goninjathief_06_s_80:
    speaker: quiry
    en: Huh? Commander?!
    ko: 어? 괴도 지휘관이시네요?!
    ja: わっ、怪盗…の指揮官…！？
  event_goninjathief_06_s_81:
    speaker: "<Self>"
    en: Ah! You startled me!
    ko: 악, 깜짝이야!
    ja: うわっ、びっくりした！
  event_goninjathief_06_s_82:
    speaker: quiry
    en: Um... do we have to arrest him?
    ko: 잡… 아야 하나요?!
    ja: |-
      えっと…
      こういう時は逮捕すべきでしょうか…！？
  event_goninjathief_06_s_83:
    speaker: miranda
    en: I really missed you, Quiry!
    ko: 보고 싶었습니다, 키리!
    ja: キリ！会いたかったです！
  event_goninjathief_06_s_84:
    speaker: quiry
    en: Oh, Miranda! I didn't even see you there!
    ko: 아, 미란다! 옆에 계셨군요~
    ja: あっ、ミランダ！隣にいたんですね！
  event_goninjathief_06_s_85:
    speaker: quiry
    en: Have you been doing okay?
    ko: 별일 없으셨나요?
    ja: 無事でしたか？
  event_goninjathief_06_s_86:
    speaker: miranda
    en: Other than getting tied up by that ninja thief, everything went just fine!
    ko: 수습 괴도 닌자에게 몸이 묶였던 것 빼고는, 없었습니다!
    ja: |-
      はい！見習い怪盗忍者に体を縛られたこと以外は
      特に問題ありません！
  event_goninjathief_06_s_87:
    speaker: quiry
    en: Whaaaat?!
    ko: 네에에?!
    ja: ええぇっ！？
  event_goninjathief_06_s_88:
    speaker: quency_e
    en: No wayyy!
    ko: 뭐어어?
    ja: えっ、そうだったの？
  event_goninjathief_06_s_89:
    speaker: quency_e
    en: You got taken down by her? I had no idea!
    ko: 그쪽한테 당한 거였어? 몰랐네~
    ja: まさかそっちにやられたなんて思わなかったわ～
  event_goninjathief_06_s_90:
    speaker: quiry
    en: Oh, Quency, you're here too!
    ko: 아, 퀀시도 옆에 계셨군요!
    ja: あっ、クエンシーもいたんですね！
  event_goninjathief_06_s_91:
    speaker: quiry
    en: Uh... Should I apprehend her?
    ko: 잡아야… 할까요?
    ja: 逮捕…すべきでしょうか…？
  event_goninjathief_06_s_92:
    speaker: quency_e
    en: Hehe, shouldn't we be after the pickpocket first?
    ko: 키킥, 지금은 소매치기가 먼저지 않을까~?
    ja: |-
      クスクス。今は逃走中のワルモノを捕まえるのが
      先じゃないかしら～？
  event_goninjathief_06_s_93:
    speaker: quency_e
    en: We can't let him get away, now can we?
    ko: 이러다가 놓쳐버리면 안 되잖아?
    ja: このまま取り逃がしたらマズいでしょ？
  event_goninjathief_06_s_94:
    speaker: quiry
    en: Hmm...
    ko: 으으음…!
    ja: ううっ…！
  event_goninjathief_06_s_95:
    speaker: quiry
    en: Alrighty, let's head over to the hallway!
    ko: 알겠어요, 복도 방으로 넘어가죠!
    ja: |-
      分かりました。
      ではこちらの廊下から追いましょう！
  event_goninjathief_06_s_96:
    speaker: delta_n
    en: This is a problem.
    ko: 곤란하지 말입니다.
    ja: 困りましたね。
  event_goninjathief_06_s_97:
    speaker: delta_n
    en: I cannot use the ceiling, so I have no choice but to go through the front.
    ko: |-
      천장을 통해 갈 수 없으니,
      정문으로 들어갈 수밖에 없지 말입니다.
    ja: |-
      天井裏から侵入できない以上、
      正面から入るしかありません。
  event_goninjathief_06_s_98:
    speaker: delta_n
    en: If I do, I cannot avoid running into Poli—
    ko: 그렇게 되면 폴리랑 마주치는 건 어쩔 수 없는-
    ja: |-
      ですがそうなると、
      ポリと鉢合わせるかもしれな…
  event_goninjathief_06_s_99:
    speaker: "<Narration>"
    en: "*Crash!*"
    ko: 쾅!
    ja: バン！
  event_goninjathief_06_s_100:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_101:
    speaker: pickpocket
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_102:
    speaker: "<Narration>"
    en: The fleeing pickpocket dashes out of the room and runs straight into Delta.
    ko: 급하게 방에서 도망쳐 나온 소매치기와 델타가 마주쳤다.
    ja: |-
      あわてた様子で部屋から出てきた男と
      デルタが出くわした
  event_goninjathief_06_s_103:
    speaker: pickpocket
    en: H-hello.
    ko: 아, 안녕하세요.
    ja: ど、どうも。
  event_goninjathief_06_s_104:
    speaker: delta_n
    en: Greetings.
    ko: 안녕하십니까.
    ja: こんばんは。
  event_goninjathief_06_s_105:
    speaker: delta_n
    en: Are you the owner of this house?
    ko: 혹시 집 주인 되십니까.
    ja: もしかして、ここの家主の方ですか？
  event_goninjathief_06_s_106:
    speaker: pickpocket
    en: Er... no, I was just passing by.
    ko: |-
      아… 아뇨.
      그냥 지나가던 사람입니다.
    ja: い…いえ。ただの通りすがりです。
  event_goninjathief_06_s_107:
    speaker: delta_n
    en: Is that so?
    ko: 그렇습니까.
    ja: そうですか。
  event_goninjathief_06_s_108:
    speaker: pickpocket
    en: Yeah, haha.
    ko: 네, 하하.
    ja: ええ、ははは…
  event_goninjathief_06_s_109:
    speaker: pickpocket
    en: Coming through!
    ko: 그럼, 잠시 지나가겠습니다.
    ja: では、ちょっと前を失礼しますね。
  event_goninjathief_06_s_110:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_111:
    speaker: pickpocket
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_112:
    speaker: "<Narration>"
    en: "*Bump*"
    ko: 툭.
    ja: トンッ
  event_goninjathief_06_s_113:
    speaker: pickpocket
    en: Oh, sorry! I didn't mean to bump you! I'm in a bit of a hurry...
    ko: 아, 죄송합니다! 제가 좀 급해서 실수로 부딪혀버렸네요….
    ja: |-
      あっ、すみません！
      急ぐあまり、ぶつかってしまいました…
  event_goninjathief_06_s_114:
    speaker: delta_n
    en: One moment.
    ko: 그런데 말입니다.
    ja: ところで。
  event_goninjathief_06_s_115:
    speaker: delta_n
    en: Was there no one in that room?
    ko: 저 방 안에 아무도 없었습니까?
    ja: 今出てきた部屋に誰かいませんでしたか？
  event_goninjathief_06_s_116:
    speaker: pickpocket
    en: Ah... there's this one fluffy cop inside.
    ko: 아… 무슨 복실복실한 경찰 한 분이 계시던데요.
    ja: あっ…モフモフした警察の方が1人いましたよ。
  event_goninjathief_06_s_117:
    speaker: pickpocket
    en: She said a phantom thief coming to the house, or something along that line.
      Haha.
    ko: 이 집에 괴도가 온대나 뭐라나, 하하.
    ja: |-
      この家に怪盗が来るとかなんとか
      言ってましたね…あはは。
  event_goninjathief_06_s_118:
    speaker: delta_n
    en: Is that so?
    ko: 그렇습니까.
    ja: そうですか。
  event_goninjathief_06_s_119:
    speaker: delta_n
    en: 'Ninjutsu: Eyes of the Watcher!'
    ko: 인법! CCTV의 눈!
    ja: 忍法！監視カメラの術！
  event_goninjathief_06_s_120:
    speaker: pickpocket
    en: Eek?!
    ko: 흐이이?!
    ja: ひぃぃ！？
  event_goninjathief_06_s_121:
    speaker: delta_n
    en: "... I have confirmed there are two individuals inside."
    ko: |-
      …직접 확인한 결과,
      안에는 두 명의 인원이 있지 말입니다.
    ja: |-
      …確認したところ、
      部屋にいるのは2人のようですね。
  event_goninjathief_06_s_122:
    speaker: delta_n
    en: You're lying.
    ko: 당신은 지금 거짓말을 했습니다.
    ja: つまり、あなたは今、ウソをつきました。
  event_goninjathief_06_s_123:
    speaker: pickpocket
    en: H-how did you know that?!
    ko: 그, 그걸 어떻게!
    ja: ど、どうしてそれを…！？
  event_goninjathief_06_s_124:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 벌컥!
    ja: バン！
  event_goninjathief_06_s_125:
    speaker: poli
    en: Stop right there!
    ko: 거기 서세영!
    ja: 動くな！
  event_goninjathief_06_s_126:
    speaker: phantom
    en: Hand over the contents of your bag at once!
    ko: 어서 가방 내용물을 내놓으시오!
    ja: おとなしくバッグの中身を渡すんだ！
  event_goninjathief_06_s_127:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 벌컥!
    ja: バン！
  event_goninjathief_06_s_128:
    speaker: miranda
    en: A.C.P.U. and the Thieves of Justice!
    ko: A.C.P.U.와 정의 괴도단입니다!
    ja: |-
      動くな！
      A.C.P.U.および正義の怪盗団です！
  event_goninjathief_06_s_129:
    speaker: quency_e
    en: You've got nowhere to run, so give up now!
    ko: 도망칠 곳은 없으니까 포기하는 게 좋을 걸~?
    ja: 逃げ道はないから諦めたほうがいいわよ～？
  event_goninjathief_06_s_130:
    speaker: quiry
    en: Who's who...?
    ko: 누가 누구지….
    ja: うう、どっちが警察でどっちが怪盗なのか…
  event_goninjathief_06_s_131:
    speaker: "<Self>"
    en: Wow, everyone's here.
    ko: 와, 결국 다 모였네.
    ja: 結局、全員集まったようだな…
  event_goninjathief_06_s_132:
    speaker: pickpocket
    en: Eeek!
    ko: 흐이이익!
    ja: ひいいいっ！！
  event_goninjathief_06_s_133:
    speaker: pickpocket
    en: No, wait! Why are there so many people in my house!?
    ko: 아, 아니! 우리 집에 뭐 이리 사람이 많아!
    ja: なんで俺の家にこんなに人がいるんだ！？
  event_goninjathief_06_s_134:
    speaker: delta_n
    en: Your house?
    ko: 우리 집이라 하셨습니까.
    ja: 今、「俺の家」と言いましたか？
  event_goninjathief_06_s_135:
    speaker: delta_n
    en: I seem to recall you said earlier that you were merely passing by.
    ko: 분명 아까는 지나가는 사람이라고 하셨지 말입니다.
    ja: 先ほどは通りすがりだと言っていましたが…
  event_goninjathief_06_s_136:
    speaker: pickpocket
    en: Who the hell just "passes by" inside someone's house?!
    ko: 집 안을 그냥 지나가는 사람이 있겠냐?!
    ja: 家の中に通りすがりなんているわけねえだろ！
  event_goninjathief_06_s_137:
    speaker: pickpocket
    en: Dammit, guess there's no turning back now!
    ko: 이익…! 이판사판이다!
    ja: くそっ…！もう、どうにでもなれ！
  event_goninjathief_06_s_138:
    speaker: "<Monologue>"
    en: The pickpocket raises his hand.
    ko: 소매치기는 손을 들어 올렸다.
    ja: 男は手を挙げた
  event_goninjathief_06_s_139:
    speaker: pickpocket
    en: When I bumped into you, I swiped this!
    ko: 아까 부딪혔을 때, 슬쩍 한 물건이다!
    ja: さっきぶつかった時に盗んだ物だ！
  event_goninjathief_06_s_140:
    speaker: pickpocket
    en: Seeing how carefully you were holding it, it must be important!
    ko: 품에 소중히 넣고 있던 걸 보니, 소중한 것이겠지!
    ja: |-
      懐にしまいこんでたくらいなんだから、
      大事な物なんだろ！
  event_goninjathief_06_s_141:
    speaker: pickpocket
    en: If you want it back, then you've gotta let me go!
    ko: 돌려받고 싶으면, 날 순순히 보내줘!
    ja: 返してほしけりゃ、このまま俺を見逃せ！
  event_goninjathief_06_s_142:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_143:
    speaker: "<Self>"
    en: Do you even know what you're holding?
    ko: 그게 뭔지는 보고 말하는 건가요?
    ja: それが何か、よく見たのか？
  event_goninjathief_06_s_144:
    speaker: pickpocket
    en: Huh? What's this?
    ko: 뭐? 이게 뭔데?!
    ja: は…？
  event_goninjathief_06_s_145:
    speaker: pickpocket
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_s_146:
    speaker: pickpocket
    en: Ahhh! A g-grenade?!
    ko: 으아악! 수, 수류탄!!
    ja: うわああっ！しゅ、手榴弾！？
  event_goninjathief_06_s_147:
    speaker: pickpocket
    en: Heh...
    ko: 아….
    ja: あっ…
  event_goninjathief_06_s_148:
    speaker: pickpocket
    en: Hahaha! Oh, this is perfect!
    ko: 크, 크큭! 오히려 잘 됐어!
    ja: い、いや…！むしろ好都合だ！
  event_goninjathief_06_s_149:
    speaker: pickpocket
    en: Everyone back off, unless you wanna get blown to smithereens!
    ko: 죽고 싶지 않으면 다들 비키는 게 좋을 거야!!
    ja: 死にたくなけりゃ、全員ここから離れるんだな！
  event_goninjathief_06_s_150:
    speaker: pickpocket
    en: I'll throw it! I swear, I'll throw it! And we're all gonna die together!
    ko: |-
      던진다! 으잉?! 던진다고!!
      같이 죽는 거야!!
    ja: |-
      い、いいか？本気で投げるからな！
      そうなりゃ全員あの世行きだ！
  event_goninjathief_06_s_151:
    speaker: "<Narration>"
    en: "*Whoosh*"
    ko: 슉-
    ja: シュッ！
  event_goninjathief_06_s_152:
    speaker: "<Narration>"
    en: "*Ting*"
    ko: 팅~
    ja: ピンッ
  event_goninjathief_06_s_153:
    speaker: pickpocket
    en: Gah!
    ko: 흐익?!
    ja: ひいっ！？
  event_goninjathief_06_s_154:
    speaker: "<Monologue>"
    en: Delta's shuriken strikes perfectly, snapping the pin off the grenade.
    ko: 델타가 던진 수리검이 정확히 수류탄의 안전핀을 뽑았고.
    ja: |-
      デルタの投げた手裏剣が手榴弾に命中し、
      安全ピンが抜けた
  event_goninjathief_06_s_155:
    speaker: pickpocket
    en: Ahhhh!
    ko: 으아아!!
    ja: うわああ！！
  event_goninjathief_06_s_156:
    speaker: "<Monologue>"
    en: The startled pickpocket hurls it toward us.
    ko: 놀란 소매치기는 우리를 향해 수류탄을 던졌다.
    ja: |-
      驚いた男がこちらに向かって
      手榴弾を投げた
  event_goninjathief_06_s_157:
    speaker: poli
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goninjathief_06_s_158:
    speaker: poli
    en: Everyone, take cover!
    ko: 다들 피해영!!
    ja: 全員、逃げてくださぁい！！
  event_goninjathief_06_s_159:
    speaker: "<Narration>"
    en: "*Boom!*"
    ko: 펑-!!
    ja: ボンッ！！
event_goninjathief_06_e:
  event_goninjathief_06_e_1:
    speaker: "<Self>"
    en: "*Cough, cough!*"
    ko: 콜록! 콜록!!
    ja: ゲホッ！ゲホッ！！
  event_goninjathief_06_e_2:
    speaker: "<Monologue>"
    en: The thick smoke clears, and as I lift my head...
    ko: 자욱한 연기가 걷히고, 고개를 들자.
    ja: 凄まじい煙が立ち込めたあと、顔を上げると…
  event_goninjathief_06_e_3:
    speaker: "<Self>"
    en: Huh...? Wh-what's this?
    ko: 으…? 이, 이게 뭐야?
    ja: な…何だこれは？
  event_goninjathief_06_e_4:
    speaker: "<Monologue>"
    en: The hallway is packed with countless Deltas.
    ko: 수많은 델타가 복도를 가득 채우고 있었다.
    ja: 大勢のデルタが廊下を埋め尽くしていた
  event_goninjathief_06_e_5:
    speaker: delta_n
    en: 'Ninjutsu:'
    ko: 인법.
    ja: 忍法。
  event_goninjathief_06_e_6:
    speaker: delta_n
    en: Hologram Clone!
    ko: 홀로그램 분신술!
    ja: ホログラム分身の術！
  event_goninjathief_06_e_7:
    speaker: pickpocket
    en: Wh-what the...!?
    ko: 으, 으아악?!
    ja: う、うわあっ！？
  event_goninjathief_06_e_8:
    speaker: delta_n
    en: The grenade you just threw was no ordinary one.
    ko: 방금 던지신 건, 그냥 수류탄이 아니지 말입니다.
    ja: |-
      今あなたが投げたのは、
      ただの手榴弾ではありません。
  event_goninjathief_06_e_9:
    speaker: delta_n
    en: Now that my clones are blocking the path, you will not be able to escape easily.
    ko: |-
      이제 제 분신들이 길을 막고 있으니,
      쉽게 도망가지는 못할 것입니다.
    ja: |-
      私の分身が道を塞いでいるので、
      簡単に逃げられると思わないでください。
  event_goninjathief_06_e_10:
    speaker: pickpocket
    en: You've gotta be kidding me...
    ko: 마, 말도 안 돼….
    ja: ウ…ウソだろ…
  event_goninjathief_06_e_11:
    speaker: miranda
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_e_12:
    speaker: miranda
    en: I've got a question!
    ko: 질문이 있습니다!
    ja: 質問があります！
  event_goninjathief_06_e_13:
    speaker: miranda
    en: If they're just holograms, then you can just walk right through them, right?
    ko: 홀로그램이면 그냥 지나가도 되는 것 아닙니까?
    ja: |-
      ホログラムということは、
      すり抜けられるということでしょうか？
  event_goninjathief_06_e_14:
    speaker: delta_n
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goninjathief_06_e_15:
    speaker: pickpocket
    en: Wait...
    ko: 어?
    ja: "…ん？"
  event_goninjathief_06_e_16:
    speaker: pickpocket
    en: Y-you're right!
    ko: 그, 그렇네?
    ja: た、確かにそうだな？
  event_goninjathief_06_e_17:
    speaker: pickpocket
    en: Ah, geez! I got scared for no reason! Hahaha!
    ko: 아 뭐야! 괜히 놀랐잖아~ 하하하…!
    ja: ははっ…なんだよ、驚いたじゃねえか！
  event_goninjathief_06_e_18:
    speaker: delta_n
    en: "... You've discovered the flaw in this jutsu. Well done."
    ko: "…바로 이 술법의 구멍을 파훼하다니, 제법이지 말입니다."
    ja: |-
      …この忍術の穴を見破るとは、
      なかなか鋭いですね。
  event_goninjathief_06_e_19:
    speaker: poli
    en: Wait a moment,
    ko: 잠시만영.
    ja: ちょっと確認なんですがぁ…
  event_goninjathief_06_e_20:
    speaker: poli
    en: are you the trainee ninja thief?!
    ko: 당신이 바로 수습 괴도 닌자인가영?!
    ja: あなたが例の見習い怪盗忍者ですかぁ！？
  event_goninjathief_06_e_21:
    speaker: delta_n
    en: That is correct.
    ko: 그렇지 말입니다.
    ja: そうです。
  event_goninjathief_06_e_22:
    speaker: phantom
    en: Del—no, Trainee Ninja Thief!
    ko: 델… 아니, 수습 괴도 닌자여!
    ja: デル…いや、見習い怪盗忍者よ！
  event_goninjathief_06_e_23:
    speaker: phantom
    en: Let's join forces to catch that pickpocket, reclaim the items, and then make
      our exit.
    ko: |-
      힘을 합쳐서 저 소매치기를 잡고,
      물건만 회수하고 우리는 빠지는 게 좋겠소.
    ja: |-
      ここは力を合わせて悪人を捕らえ、バッグと
      その中身を回収したら退散といかないか？
  event_goninjathief_06_e_24:
    speaker: phantom
    en: After all, that's what it means to be a phantom thief!
    ko: 그것이 괴도니까 말이오!
    ja: 我々は同じ怪盗なのだから！
  event_goninjathief_06_e_25:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_e_26:
    speaker: delta_n
    en: I apologize.
    ko: 죄송합니다.
    ja: 申し訳ありません。
  event_goninjathief_06_e_27:
    speaker: delta_n
    en: I wish to prove that I can accomplish this on my own,
    ko: 저는 혼자의 힘으로 해낼 수 있다는 것을 보여드리고 싶습니다.
    ja: |-
      私は自分一人の力でも
      やり遂げられることを証明し、
  event_goninjathief_06_e_28:
    speaker: delta_n
    en: so that I can officially join the Thieves of Justice!
    ko: 그래서, 당당하게 정의 괴도단에 정식으로 들어가고 싶습니다!
    ja: |-
      胸を張って正義の怪盗団に
      正式に入団したいのです！
  event_goninjathief_06_e_29:
    speaker: delta_n
    en: Hyaaah!
    ko: 히야아압-!!!
    ja: はぁっ――
  event_goninjathief_06_e_30:
    speaker: delta_n
    en: What...?!
    ko: 엇…?!
    ja: "…！？"
  event_goninjathief_06_e_31:
    speaker: "<Monologue>"
    en: Delta tries to throw a shuriken at the pickpocket,
    ko: 델타는 수리검을 던져 소매치기에게 던지려고 했지만.
    ja: |-
      デルタは手裏剣を男に向かって
      投げようとしたが
  event_goninjathief_06_e_32:
    speaker: "<Monologue>"
    en: but her holographic clones block her vision, and she can't see a thing.
    ko: 델타 홀로그램 분신 때문에 시야가 가려서 아무것도 보이지 않는다.
    ja: |-
      ホログラム分身の術が邪魔をし
      ろくに狙いを定められないことに気づいた
  event_goninjathief_06_e_33:
    speaker: quency_e
    en: Can't you dismiss your clones, Trainee Ninja Thief?
    ko: 수습 괴도 닌자님, 이 분신들 좀 다시 들어가게 할 순 없을까?
    ja: |-
      ねぇ、見習い怪盗忍者さ～ん。
      この分身たち、消せないかしら～？
  event_goninjathief_06_e_34:
    speaker: delta_n
    en: Uh...
    ko: 그….
    ja: そ…
  event_goninjathief_06_e_35:
    speaker: delta_n
    en: That cannot be done...
    ko: 그건 불가능하지 말입니다….
    ja: それはできません…
  event_goninjathief_06_e_36:
    speaker: "<Self>"
    en: But we can't even see a thing.
    ko: 이거 우리끼리도 시야가 전혀 안 나오는데?
    ja: このままだと、私たちも何も見えないぞ…？
  event_goninjathief_06_e_37:
    speaker: delta_n
    en: Do not worry. I shall apprehend him myself.
    ko: 걱정 마시지 말입니다, 제가 직접 잡겠습니다!
    ja: 心配は無用です。あとは私にお任せください！
  event_goninjathief_06_e_38:
    speaker: "<Monologue>"
    en: Delta runs in the other direction.
    ko: 델타가 반대편으로 달려들었고.
    ja: |-
      そう言うと、デルタは男とは逆方向へと
      走っていった
  event_goninjathief_06_e_39:
    speaker: "<Narration>"
    en: "*Tap tap tap*"
    ko: 다다다다-!
    ja: ダダダダッ…！
  event_goninjathief_06_e_40:
    speaker: "<Monologue>"
    en: Taking advantage of the poor visibility, the pickpocket charges straight at
      us.
    ko: |-
      불편한 시야를 이용해,
      되려 소매치기가 우리 쪽을 향해 달려들었다.
    ja: |-
      その瞬間、視界が不明瞭になったのを
      逆手に取った男がこちらに向かって走ってきた
  event_goninjathief_06_e_41:
    speaker: "<Self>"
    en: He's trying to make a run for the door behind us!
    ko: 우리 뒤에 있는 문으로 도망가려는 거야!
    ja: 後ろのドアから逃げる気か…！？
  event_goninjathief_06_e_42:
    speaker: quiry
    en: Ahhh! I can't see a thing!
    ko: 으아아! 하나도 안 보여요!
    ja: ううっ…何も見えません…！
  event_goninjathief_06_e_43:
    speaker: "<Narration>"
    en: "*Bump*"
    ko: 툭.
    ja: ドンッ
  event_goninjathief_06_e_44:
    speaker: quency_e
    en: Kyaa!
    ko: 꺄악~
    ja: きゃあっ！
  event_goninjathief_06_e_45:
    speaker: pickpocket
    en: Urgh!
    ko: 크윽…!
    ja: くっ…！
  event_goninjathief_06_e_46:
    speaker: quency_e
    en: Wow, you just bump into me and don't even say sorry?
    ko: 와~ 부딪혀 놓고 사과도 없네.
    ja: |-
      ひど～い。
      ぶつかっておいて謝罪の一言もないの～？
  event_goninjathief_06_e_47:
    speaker: miranda
    en: Quency, are you okay?
    ko: 퀀시, 괜찮으십니까?!
    ja: クエンシー、大丈夫ですか！？
  event_goninjathief_06_e_48:
    speaker: quency_e
    en: As I thought, Miranda's the only one who cares about me.
    ko: 역시 나 걱정해 주는 건 미란다뿐이라니까~
    ja: |-
      ありがとう～
      私を心配してくれるのはミランダだけよ～
  event_goninjathief_06_e_49:
    speaker: "<Monologue>"
    en: As she says so, she winks at me.
    ko: 그렇게 말을 하며, 퀀시는 나를 향해 윙크를 날렸다.
    ja: |-
      そう言いながら、
      クエンシーはこちらにウインクした
  event_goninjathief_06_e_50:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_goninjathief_06_e_51:
    speaker: poli
    en: Go after that pickpocket, Quiry!
    ko: 저 소매치기를 따라가영, 키리!
    ja: キリ！窃盗犯を追ってくださぁい！
  event_goninjathief_06_e_52:
    speaker: quiry
    en: O-okay!
    ko: 아, 알겠어요!!
    ja: わ、分かりました！！
  event_goninjathief_06_e_53:
    speaker: quiry
    en: I'll follow his footsteps!
    ko: 발소리를 따라갈게요!
    ja: 足音をたどります！
  event_goninjathief_06_e_54:
    speaker: poli
    en: Miranda, keep watch at the doorway.
    ko: 미란다는 문 앞을 계속 지키고 계세영.
    ja: ミランダはドアの前を見張っててください！
  event_goninjathief_06_e_55:
    speaker: miranda
    en: Got it!
    ko: 네, 알겠습니다!
    ja: はいっ、分かりました！
  event_goninjathief_06_e_56:
    speaker: poli
    en: I'll be arresting the Thieves of Justice and the trainee ninja thief too!
    ko: 저는 정의 괴도단 여러분과, 수습 괴도 닌자를 체포하겠어영!
    ja: |-
      私は正義の怪盗団のみなさんと
      見習い怪盗忍者を逮捕しますぅ！
  event_goninjathief_06_e_57:
    speaker: "<Monologue>"
    en: Poli slowly approaches us.
    ko: 폴리는 서서히 우리를 향해 다가왔다.
    ja: ポリはゆっくりと私たちのほうに近づいた
  event_goninjathief_06_e_58:
    speaker: delta_n
    en: Th-this can't be...
    ko: 이, 이럴 수가….
    ja: そ、そんな…
  event_goninjathief_06_e_59:
    speaker: delta_n
    en: In the end, I let him slip away...
    ko: 결국 놓치고 말았지 말입니다.
    ja: まさか、取り逃がしてしまうなんて…
  event_goninjathief_06_e_60:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_e_61:
    speaker: delta_n
    en: I...
    ko: 저는….
    ja: 私は…
  event_goninjathief_06_e_62:
    speaker: phantom
    en: Trainee Ninja Thief,
    ko: 수습 괴도 닌자여.
    ja: 見習い怪盗忍者よ。
  event_goninjathief_06_e_63:
    speaker: phantom
    en: the items have already been retrieved. You need not worry.
    ko: 물건은 이미 회수했으니 걱정 마시오.
    ja: バッグの中身なら回収した。安心したまえ。
  event_goninjathief_06_e_64:
    speaker: delta_n
    en: "...?!"
    ko: "…?!"
    ja: "…！？"
  event_goninjathief_06_e_65:
    speaker: delta_n
    en: Is that really the case?
    ko: 그게 정말입니까?
    ja: い、いったいどうやって…？
  event_goninjathief_06_e_66:
    speaker: quency_e
    en: I'm pretty dexterous myself.
    ko: 나도 손재주가 좀 좋은 편이거든~
    ja: 実は私も、手先がけっこう器用なの～
  event_goninjathief_06_e_67:
    speaker: quency_e
    en: Snagged it when we bumped into each other earlier, hehe.
    ko: 아까 부딪혔을 때 가져왔지~ 키킥.
    ja: |-
      だからさっき、ぶつかった時にくすねちゃった。
      ふふっ。
  event_goninjathief_06_e_68:
    speaker: phantom
    en: That's why we deliberately stood all together in one corner.
    ko: 그것을 노리고, 일부러 한쪽에 몰아서 서 있었던 것이오.
    ja: |-
      わざと一ヶ所に集まったのもそのためだったが、
      うまくいったな。
  event_goninjathief_06_e_69:
    speaker: "<Monologue>"
    en: I was just standing there without thinking... When did that plan even start?
    ko: 그냥 생각 없이 서 있었는데, 언제부터 그런 계획이…?
    ja: |-
      何も考えていなかったはずだが、
      いつの間にそんな作戦を…？
  event_goninjathief_06_e_70:
    speaker: phantom
    en: Even Miranda blocking the door was really meant to give us a chance to escape.
    ko: |-
      미란다가 문을 막고 있는 것도,
      사실은 우리를 도망가게 해주려는 것이오.
    ja: |-
      ミランダがドアの見張りについたのも、
      我々を逃がすためでね。
  event_goninjathief_06_e_71:
    speaker: "<Monologue>"
    en: No way...
    ko: 거짓말….
    ja: 絶対ウソだ…
  event_goninjathief_06_e_72:
    speaker: phantom
    en: The Thieves of Justice are not just one person.
    ko: 정의 괴도단은 한 명이 아니오.
    ja: 正義の怪盗団は1人ではなく
  event_goninjathief_06_e_73:
    speaker: phantom
    en: It is all of us together.
    ko: 우리 모두인 것이오.
    ja: 全員で一つなのだからな。
  event_goninjathief_06_e_74:
    speaker: phantom
    en: The mission is a success, so it is best we return now.
    ko: 임무는 성공이오, 그러니 이만 돌아가는 게 좋겠소.
    ja: 任務は成功だ。そろそろ戻るとしよう。
  event_goninjathief_06_e_75:
    speaker: delta_n
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_e_76:
    speaker: delta_n
    en: In that case,
    ko: 그렇다면.
    ja: それなら…
  event_goninjathief_06_e_77:
    speaker: delta_n
    en: I shall clear the path for you.
    ko: 길을 뚫어드리겠습니다.
    ja: 私が逃げ道を作ります。
  event_goninjathief_06_e_78:
    speaker: phantom
    en: What in the world?!
    ko: 뭣이…?!
    ja: えっ…？
  event_goninjathief_06_e_79:
    speaker: delta_n
    en: Someone has to hold Poli back.
    ko: 폴리를 막아줄 사람이 한 명 정도는 있어야 하지 말입니다.
    ja: |-
      誰か1人はここに残って
      ポリを足止めしなければなりません。
  event_goninjathief_06_e_80:
    speaker: delta_n
    en: I shall draw her attention to allow everyone to escape unharmed!
    ko: 제가 시선을 끌 테니, 반드시 무사하셔야 합니다!
    ja: |-
      であれば、その役目は私が担います。
      みなさんはどうか無事に逃げてください！
  event_goninjathief_06_e_81:
    speaker: "<Monologue>"
    en: Delta holds out a hand.
    ko: 델타는 한 손을 내밀었다.
    ja: そう言うと、デルタは手のひらを差し出した
  event_goninjathief_06_e_82:
    speaker: poli
    en: Wh-what's this?!
    ko: "!! 뭐졍?!"
    ja: "！！何のマネですか？"
  event_goninjathief_06_e_83:
    speaker: delta_n
    en: I control my energy, gather it at my fingertips, and make it spin.
    ko: 기를 컨트롤 해서, 손끝으로 모아서 회전시킵니다.
    ja: |-
      気をコントロールし、
      手のひらの上に集めて回転させます。
  event_goninjathief_06_e_84:
    speaker: delta_n
    en: Then I compress it and spin it faster... to amplify its power...!
    ko: |-
      그리고 그 기를 압축해서 회전은 빠르게…!
      위력은 강하게 만듭니다…!!
    ja: |-
      その気を球状に圧縮して回転を上げ…！
      威力を高めれば…！！
  event_goninjathief_06_e_85:
    speaker: delta_n
    en: Haaah...!
    ko: 흐아아아…!!
    ja: ふぅぅぅ…！！
  event_goninjathief_06_e_86:
    speaker: delta_n
    en: Hyaaaah!!!!
    ko: 하아아아아앗!!!!
    ja: はああああっ！！！
  event_goninjathief_06_e_87:
    speaker: poli
    en: "... Watcha doing?"
    ko: "…뭐예영."
    ja: "……"
  event_goninjathief_06_e_88:
    speaker: poli
    en: I don't see anything.
    ko: 아무것도 없는데영.
    ja: "…何も起きませんね？"
  event_goninjathief_06_e_89:
    speaker: delta_n
    en: Darn it...!
    ko: 크읏…!
    ja: くっ…！
  event_goninjathief_06_e_90:
    speaker: delta_n
    en: Am I still unfit to use this jutsu...?
    ko: 아직 이 술법은 제가 사용하기엔 부족한 것입니까…!
    ja: |-
      今の私では使えない
      忍術だったということですか…！？
  event_goninjathief_06_e_91:
    speaker: "<Narration>"
    en: Just then...
    ko: 그때.
    ja: その時
  event_goninjathief_06_e_92:
    speaker: "<Narration>"
    en: One after another, the Thieves of Justice come forward and place their hands
      on Delta's.
    ko: 정의 괴도단이 한 사람씩, 그 위에 손을 얹기 시작했다.
    ja: |-
      正義の怪盗団が次々と
      デルタの手のひらに手を重ねていった
  event_goninjathief_06_e_93:
    speaker: phantom
    en: If one person's energy is insufficient, we shall lend our aid!
    ko: 한 사람의 기로 부족하다면, 우리가 돕겠소!
    ja: |-
      1人では力が足りないのなら、
      みんなで力を合わせればいい！
  event_goninjathief_06_e_94:
    speaker: quency_e
    en: Gather your energy at your fingertips!
    ko: 기를 손끝에 모아서…!!
    ja: 気を手のひらに集めて…！！
  event_goninjathief_06_e_95:
    speaker: miranda
    en: And make it spin really fast!!
    ko: 빠르게 회전시킵니다아!!
    ja: 回転を上げていきます…！！
  event_goninjathief_06_e_96:
    speaker: "<Monologue>"
    en: Ugh, I really don't want to do this...
    ko: 아, 진짜 하기 싫다.
    ja: ああ、やりたくない…
  event_goninjathief_06_e_97:
    speaker: "<Self>"
    en: Hyaaaah!! Take this!!
    ko: |-
      흐랴아아앗!!
      가자아아아아-!!!
    ja: うおおおおお！！行くぞぉぉぉ！！
  event_goninjathief_06_e_98:
    speaker: delta_n
    en: "!!"
    ko: "!!!"
    ja: "！！！"
  event_goninjathief_06_e_99:
    speaker: delta_n
    en: Everyone...
    ko: 다들…!
    ja: みんな…！
  event_goninjathief_06_e_100:
    speaker: delta_n
    en: "... I can sense tremendous power!"
    ko: "…엄청난 힘이 느껴집니다."
    ja: "…とてつもない力を感じます。"
  event_goninjathief_06_e_101:
    speaker: delta_n
    en: So this is... the power of the Thieves of Justice?
    ko: 이게 바로… [정의 괴도단의 힘]?
    ja: これが…「正義の怪盗団の力」…？
  event_goninjathief_06_e_102:
    speaker: delta_n
    en: Phew...
    ko: 후우….
    ja: ふぅ…
  event_goninjathief_06_e_103:
    speaker: delta_n
    en: Very well. With everyone's strength gathered,
    ko: 좋습니다, 모두의 힘을 모아서.
    ja: 全員の力が合わさった今、
  event_goninjathief_06_e_104:
    speaker: delta_n
    en: I shall give this jutsu a new name!
    ko: 이것의 이름을 새로 명명하겠습니다!
    ja: ここに命名します！
  event_goninjathief_06_e_105:
    speaker: delta_n
    en: Hyaaah! Brace yourselves for my final strike!
    ko: |-
      흐아아압!!!
      제 마지막 일격을 받으시지 말입니다!!
    ja: トドメの一撃を受けてみよ！
  event_goninjathief_06_e_106:
    speaker: delta_n
    en: 'Secret Jutsu: Thieves of Justice, Spiral—'
    ko: 비기! 정의 괴도단, 나선-
    ja: 秘技！正義の怪盗団、渦巻き…
  event_goninjathief_06_e_107:
    speaker: phantom
    en: Thieves of Justice, withdraw!
    ko: 정의 괴도단, 퇴장이오!!!
    ja: 正義の怪盗団、退散！！
  event_goninjathief_06_e_108:
    speaker: "<Monologue>"
    en: We grab Delta's hand
    ko: 우리는 그대로 델타의 손을 잡고.
    ja: 私たちはそのままデルタの手を握ると
  event_goninjathief_06_e_109:
    speaker: "<Monologue>"
    en: and bolt straight out of the house.
    ko: 냅다 집 밖으로 달려갔다.
    ja: 全速力でその場を去った
  event_goninjathief_06_e_110:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_e_111:
    speaker: poli
    en: So...
    ko: 그러니깡.
    ja: つまり…
  event_goninjathief_06_e_112:
    speaker: poli
    en: that was just to draw my attention so they can escape?!
    ko: 진짜 제 시선만 끌고, 다 같이 도망치는 작전이었다는 거졍?
    ja: |-
      私の注意を引いて、その隙に全員で
      逃げる作戦だったということですねぇ？
  event_goninjathief_06_e_113:
    speaker: poli
    en: Grrrr...
    ko: 크르르….
    ja: グルル…
  event_goninjathief_06_e_114:
    speaker: poli
    en: Grrrrrr!
    ko: 크르르르릉!!!
    ja: グルルルルン！
  event_goninjathief_06_e_115:
    speaker: poli
    en: And why did Miranda have to go running off with them toooo!!
    ko: 그리고, 미란다는 왜 같이 도망가는 거냐고여어엉!!
    ja: |-
      しかも、どうしてミランダまで
      一緒に逃げてるんですかぁ！！
  event_goninjathief_06_e_116:
    speaker: quiry_op
    en: Poli, I caught him!
    ko: 폴리, 잡았어요!
    ja: ポリ！言われた通りに捕まえました！
  event_goninjathief_06_e_117:
    speaker: quiry_op
    en: From what he's saying, he really is a pickpocket,
    ko: 얘기를 들어 보니까, 진짜 소매치기가 맞더라구요.
    ja: |-
      取り調べをしたところ、
      本当にスリの常習犯だったようです。
  event_goninjathief_06_e_118:
    speaker: quiry_op
    en: but he claims the stuff he took out of the bag isn't there. And he keeps yelling
      for us to
    ko: |-
      그런데 가방에서 따로 뺀 물건들이 안 보인다고,
      아까 그 괴도 소매치기를 잡아야 한다고….
    ja: ただ、先ほどからずっと
  event_goninjathief_06_e_119:
    speaker: quiry_op
    en: catch the phantom thief...
    ko: 옆에서 엄청 소리 지르고 계세요.
    ja: |-
      バッグから抜き取った物がなくなったから
      さっきの怪盗を捕まえろと叫んでいまして…
  event_goninjathief_06_e_120:
    speaker: poli
    en: "*Sigh*"
    ko: 에흉….
    ja: はぁぁ…
  event_goninjathief_06_e_121:
    speaker: poli
    en: Good work. I'll be there soon.
    ko: 고생 많았어영, 곧 갈게영.
    ja: お疲れ様ですぅ。すぐそちらに行きますねぇ。
  event_goninjathief_06_e_122:
    speaker: poli
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_06_e_123:
    speaker: poli
    en: What should I do about
    ko: 정말 어쩌면 좋을까영.
    ja: 正義の怪盗団…
  event_goninjathief_06_e_124:
    speaker: poli
    en: the Thieves of Justice...?
    ko: 정의 괴도단….
    ja: いったい、どうしたらいいんでしょうかぁ…
  event_goninjathief_06_e_125:
    speaker: phantom
    en: Good work out there, everyone.
    ko: 모두, 고생 많았소.
    ja: みんな、今回もご苦労だった。
  event_goninjathief_06_e_126:
    speaker: phantom
    en: The recovered items were safely returned to their owners, and it seems the
      pickpocket was taken away by the police.
    ko: |-
      되찾은 물건은 주인에게 무사히 돌아갔고,
      그 소매치기도 경찰이 잡아간 것 같소.
    ja: |-
      取り返したバッグとその中身を
      無事に持ち主のもとに戻せたうえ、
      例の悪人も警察に捕まったようだ。
  event_goninjathief_06_e_127:
    speaker: quency_e
    en: Heehee, that was so much fun!
    ko: 다행이다~ 재미있었어~!
    ja: |-
      ふふ、よかった～！
      今回もすごく楽しかったわ～！
  event_goninjathief_06_e_128:
    speaker: miranda
    en: As I expected, the A.C.P.U. is impressive!
    ko: 역시, A.C.P.U.는 유능합니다!
    ja: さすがはA.C.P.U.です！
  event_goninjathief_06_e_129:
    speaker: "<Self>"
    en: Are you gonna be okay, Miranda?
    ko: 미란다, 괜찮겠어?
    ja: ミランダ…大丈夫なのか？
  event_goninjathief_06_e_130:
    speaker: miranda
    en: No worries! I'll put my all into writing the disciplinary report!
    ko: 괜찮습니다! 시말서 열심히 쓰겠습니다!
    ja: |-
      ご心配なく！
      戻りましたら頑張って始末書を書きます！
  event_goninjathief_06_e_131:
    speaker: quency_e
    en: So...
    ko: 그래서~
    ja: それはそうと～
  event_goninjathief_06_e_132:
    speaker: quency_e
    en: Did Delta pass today's test?
    ko: 오늘 테스트는 합격이야?
    ja: 今日のテストは合格ってことでいいかしら～？
  event_goninjathief_06_e_133:
    speaker: quency_e
    en: Is she really going to join the Thieves of Justice for real?
    ko: 이제 델타도 정식으로 정의 괴도단에 들어오는 거야~?
    ja: これでデルタも、正式に怪盗団の一員～？
  event_goninjathief_06_e_134:
    speaker: phantom
    en: Ahem.
    ko: 크흠.
    ja: コホン。
  event_goninjathief_06_e_135:
    speaker: phantom
    en: Very well, I shall announce the results.
    ko: 그럼 결과를 발표하겠소.
    ja: では、結果を発表しよう。
  event_goninjathief_06_e_136:
    speaker: delta_n
    en: Please wait a moment.
    ko: 잠시만 기다려주시지 말입니다.
    ja: その前に、少しよろしいですか？
  event_goninjathief_06_e_137:
    speaker: phantom
    en: There is no need for undue nervousness.
    ko: 너무 그리 긴장하지 않아도 되오.
    ja: ん？そう緊張する必要はないさ。
  event_goninjathief_06_e_138:
    speaker: phantom
    en: You have passed—
    ko: 그대는 합격이니-
    ja: 君は合格…
  event_goninjathief_06_e_139:
    speaker: delta_n
    en: I wish to remain a trainee.
    ko: 저는 수습으로 남겠습니다.
    ja: |-
      入団の件ですが、
      見習いのままでいることに決めました。
  event_goninjathief_06_e_140:
    speaker: phantom
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_goninjathief_06_e_141:
    speaker: phantom
    en: Why is that?
    ko: 어째서 말이오?
    ja: り、理由を聞いても？
  event_goninjathief_06_e_142:
    speaker: delta_n
    en: It is only today do I realize that
    ko: 오늘에서야 깨달았습니다.
    ja: 今回の件を経て、ようやく気づいたのです。
  event_goninjathief_06_e_143:
    speaker: delta_n
    en: I am still far from ready and require more training.
    ko: 저는 한참 멀었고, 수련이 필요하다는 것을 말입니다.
    ja: |-
      自分はまだまだ未熟で、
      修行が必要な身であることに。
  event_goninjathief_06_e_144:
    speaker: delta_n
    en: Since I do not yet truly understand the power of comrades, it is right for
      me to remain as a trainee.
    ko: |-
      아직 진정한 동료의 힘을 모르는 전,
      수습으로 남아있는 게 맞습니다.
    ja: |-
      仲間との絆の真の力を知らないうちは、
      まだ見習いでいるべきだと判断しました。
  event_goninjathief_06_e_145:
    speaker: phantom
    en: I see...
    ko: 아….
    ja: むむ…
  event_goninjathief_06_e_146:
    speaker: phantom
    en: Delta, if that's how you feel, then it can't be helped.
    ko: 델타, 당신이 그리 생각한다면 어쩔 수 없지.
    ja: 君がそう決めたのであれば仕方ないな。
  event_goninjathief_06_e_147:
    speaker: phantom
    en: "*Sigh* My dream of filling our base with phantom thieves is—"
    ko: 하아, 정의 괴도단으로 전초기지를 가득 채우려는 나의 꿈이….
    ja: |-
      はぁ…正義の怪盗団で前哨基地を
      埋め尽くすという夢が…
  event_goninjathief_06_e_148:
    speaker: "<Self>"
    en: What are you talking about?
    ko: 뭐라는 거야.
    ja: 何を言っているんだ…？
  event_goninjathief_06_e_149:
    speaker: delta_n
    en: Therefore,
    ko: 그러니.
    ja: ですので、
  event_goninjathief_06_e_150:
    speaker: delta_n
    en: I would be grateful if you continued to take me along as a trainee.
    ko: 앞으로도 수습인 저를, 데리고 다녀주시면 감사하지 말입니다!
    ja: |-
      これからも見習いとして、
      怪盗団の活動に同行させていただけませんか？
  event_goninjathief_06_e_151:
    speaker: delta_n
    en: I shall assist you to the best of my ability.
    ko: 최선을 다해 보좌하겠습니다!
    ja: 全力でサポートいたします！
  event_goninjathief_06_e_152:
    speaker: phantom
    en: Oh...!
    ko: 오…!
    ja: "…！"
  event_goninjathief_06_e_153:
    speaker: phantom
    en: Then, does this mean you intend to join the Thieves of Justice?
    ko: 그럼, 어쨌든 우리 정의 괴도단에 함께 하겠다는 것이오?
    ja: |-
      つまり、引き続き正義の怪盗団に
      参加してくれるということだな？
  event_goninjathief_06_e_154:
    speaker: delta_n
    en: Affirmative.
    ko: 맞습니다!
    ja: はい！
  event_goninjathief_06_e_155:
    speaker: phantom
    en: So the five of us may actually carry out phantom thief missions together?
    ko: 다섯이 함께 괴도 활동을 할 수 있는 것이오?!
    ja: 5人で怪盗の活動ができるということだな！？
  event_goninjathief_06_e_156:
    speaker: delta_n
    en: Correct.
    ko: 맞습니다!
    ja: その通りです！
  event_goninjathief_06_e_157:
    speaker: phantom
    en: I am very pleased.
    ko: 나는 매우 좋소.
    ja: そうか、なら私は大歓迎だとも。
  event_goninjathief_06_e_158:
    speaker: phantom
    en: What are your thoughts?
    ko: 여러분의 의견은 어떻소?
    ja: みんなの意見はどうかな？
  event_goninjathief_06_e_159:
    speaker: quency_e
    en: Heck yeah! It's fun, so I'm all for it!
    ko: 나야~ 당연히 재미있으니까 좋지!
    ja: 楽しそうだから、もちろん賛成～！
  event_goninjathief_06_e_160:
    speaker: miranda
    en: Sounds great to me! The more people upholding justice out there, the better!
    ko: 저도 좋습니다! 정의로운 사람이 많을수록 좋습니다!
    ja: |-
      同じく賛成です！
      正義の味方は多ければ多いほどいいですので！
  event_goninjathief_06_e_161:
    speaker: "<Self>"
    en: I don't really care anymore.
    ko: 난 이제 뭐든 상관없어.
    ja: 私はもうどうでもいい
  event_goninjathief_06_e_162:
    speaker: phantom
    en: Then it is unanimous!
    ko: 만장일치군!
    ja: よし、満場一致だな！
  event_goninjathief_06_e_163:
    speaker: phantom
    en: I entrust you to our cause.
    ko: 잘 부탁하오.
    ja: |-
      本日をもって、正式に君を
      正義の怪盗団の見習い怪盗忍者に
      任命しよう！
  event_goninjathief_06_e_164:
    speaker: phantom
    en: I hereby officially pronounce you the trainee ninja thief of the Thieves of
      Justice!
    ko: 정의 괴도단의 정식 수습 괴도 닌자, 델타!
    ja: 今後ともよろしく頼むよ。
  event_goninjathief_06_e_165:
    speaker: delta_n
    en: I shall learn as much as possible.
    ko: 많이 배우겠습니다!
    ja: はい！精一杯頑張ります！
  event_goninjathief_06_e_166:
    speaker: quency_e
    en: What a beautiful night!
    ko: 아름다운 밤이네~
    ja: 美しい夜ね～
  event_goninjathief_06_e_167:
    speaker: miranda
    en: The night is always beautiful!
    ko: 밤은 언제나 아름답습니다!
    ja: 夜はいつも美しいです！
  event_goninjathief_06_e_168:
    speaker: "<Self>"
    en: I guess I'd better go to bed.
    ko: 슬슬 자야지.
    ja: そろそろ寝たいんだが…
  event_goninjathief_06_e_169:
    speaker: phantom
    en: In that case!
    ko: 그럼!
    ja: では！
  event_goninjathief_06_e_170:
    speaker: phantom
    en: The Thieves of Justice shall disband here for today.
    ko: 오늘의 정의 괴도단, 여기서 해산이오.
    ja: 正義の怪盗団、本日はこれにて解散とする。
  event_goninjathief_06_e_171:
    speaker: phantom
    en: Everyone, take care!
    ko: 모두, 잘 지내시오!
    ja: みんな、元気で！
  event_goninjathief_06_e_172:
    speaker: "<Narration>"
    en: As the shadows recede, the world begins to stir from its slumber.
    ko: 어둠이 걷히고, 사람들은 잠에서 깨어나기 시작한다.
    ja: 闇が消え、人々は眠りから覚める
  event_goninjathief_06_e_173:
    speaker: "<Narration>"
    en: Those who once danced beneath the stars slip back to their rightful places.
    ko: 밤하늘을 누비던 이들은 본래의 자리로 돌아가고.
    ja: |-
      夜空を駆け回っていた彼女たちは、
      本来いるべき場所に戻り…
  event_goninjathief_06_e_174:
    speaker: "<Narration>"
    en: As though nothing ever occurred, the day begins anew.
    ko: 아무 일 없었다는 듯, 하루는 또 시작될 것이다.
    ja: |-
      何もなかったかのように、
      また1日が始まるのだろう
  event_goninjathief_06_e_175:
    speaker: "<Narration>"
    en: And now five in number, the Thieves of Justice
    ko: 그리고, 이제는 다섯이 된 정의 괴도단.
    ja: 5人となった正義の怪盗団が
  event_goninjathief_06_e_176:
    speaker: "<Narration>"
    en: await the day they will come together once more.
    ko: 그들이 다시 모이는 그날을 기약하며.
    ja: 再び、一堂に会する日を願って…
  event_goninjathief_06_e_177:
    speaker: "<Narration>"
    en: 'GO! NINJA THIEF!: END'
    ko: 'GO! NINJA THIEF! : END'
    ja: 'GO! NINJA THIEF! : END'
event_goninjathief_epilogue:
  event_goninjathief_epilogue_1:
    speaker: phantom
    en: Now that Delta has officially joined us as a trainee, I've conducted extensive
      research on ninjas myself.
    ko: |-
      델타가 정의 괴도단의 정식 수습으로 들어온 만큼,
      나도 닌자에 대해 많은 조사를 해보았소.
    ja: |-
      デルタが正式に見習いとして
      正義の怪盗団に加わったのをきっかけに、
      私も忍者について調べてみたよ。
  event_goninjathief_epilogue_2:
    speaker: quency_e
    en: Oh? Really now?
    ko: 오~ 웬일이래?
    ja: ふぅん、珍しいわね～？
  event_goninjathief_epilogue_3:
    speaker: phantom
    en: Ahem! Reading is a pastime of mine, believe it or not.
    ko: 크흠, 이래 봬도 독서가 취미라오.
    ja: コホンッ。こう見えて、読書が趣味なものでね。
  event_goninjathief_epilogue_4:
    speaker: phantom
    en: In any case,
    ko: 아무튼!
    ja: とにかく！
  event_goninjathief_epilogue_5:
    speaker: phantom
    en: Delta, you have overlooked a most crucial detail.
    ko: 델타, 그대는 아주 큰 부분을 빠트리고 있었소.
    ja: デルタ。君は大事なことを見落としている。
  event_goninjathief_epilogue_6:
    speaker: delta_n
    en: What is it?
    ko: 그게 무엇입니까.
    ja: "…？それは何でしょうか？"
  event_goninjathief_epilogue_7:
    speaker: delta_n
    en: I thought I had read almost every book on ninjutsu.
    ko: 각종 술법이 쓰인 책들은 거의 다 읽었다고 생각했지 말입니다.
    ja: 忍術に関する本は、すべて読んだはずですが…
  event_goninjathief_epilogue_8:
    speaker: phantom
    en: It's your manner of speaking.
    ko: 말투 말이오.
    ja: ずばり、話し方だ。
  event_goninjathief_epilogue_9:
    speaker: phantom
    en: According to a book I read, ninjas often use the word "nin-nin."
    ko: 내가 읽은 책에 따르면, [닌닌] 이라는 단어를 쓰더군.
    ja: |-
      私が読んだ本によると、忍者は
      「ニンニン」という言葉を使うらしい。
  event_goninjathief_epilogue_10:
    speaker: delta_n
    en: Nin-nin?
    ko: "[닌닌] 말입니까."
    ja: "「ニンニン」…ですか？"
  event_goninjathief_epilogue_11:
    speaker: delta_n
    en: That's the first I've heard of it.
    ko: 저는 처음 들어보지 말입니다.
    ja: 初めて聞きました。
  event_goninjathief_epilogue_12:
    speaker: phantom
    en: It appears to be used either when giving a reply, or when affixed to the end
      of a sentence.
    ko: |-
      대답을 할 때 사용하거나,
      말끝에 붙임으로써 사용하는 것 같소.
    ja: いわく、返事をする時や語尾に用いるそうだ。
  event_goninjathief_epilogue_13:
    speaker: delta_n
    en: I shall give it a try.
    ko: 응용해 보겠지 말입니다.
    ja: 分かりました。さっそく使ってみます。
  event_goninjathief_epilogue_14:
    speaker: delta_n
    en: Nin-nin.
    ko: 닌닌.
    ja: ニンニン。
  event_goninjathief_epilogue_15:
    speaker: delta_n
    en: Is that correct?
    ko: 이렇게 말입니까?
    ja: こうでしょうか？
  event_goninjathief_epilogue_16:
    speaker: phantom
    en: It should sound a bit more solemn.
    ko: 뭔가, 좀 더 비장하면 좋을 것 같소.
    ja: |-
      うーん…なんというか、こう…
      少し力強さが足りないな。
  event_goninjathief_epilogue_17:
    speaker: phantom
    en: Make a hand sign as you say it.
    ko: 인을 맺으며 말이오.
    ja: 語気を強めてみたまえ。
  event_goninjathief_epilogue_18:
    speaker: delta_n
    en: Nin-nin!
    ko: 닌닌!
    ja: ニンニン！
  event_goninjathief_epilogue_19:
    speaker: delta_n
    en: Is it said like this?
    ko: 이렇게 말입니까?
    ja: こうでしょうか？
  event_goninjathief_epilogue_20:
    speaker: phantom
    en: Oh, you look like quite the ninja.
    ko: 오오, 꽤나 멋진 닌자 같소.
    ja: おお！カッコいい忍者らしくなったな。
  event_goninjathief_epilogue_21:
    speaker: quency_e
    en: I'd say she's more cute than cool.
    ko: 멋지다기보단, 좀 귀엽지 않아?
    ja: |-
      う～ん。カッコよさより
      かわいさのほうが増した気がするけど…？
  event_goninjathief_epilogue_22:
    speaker: quency_e
    en: Since Miranda is a police officer, should she say "po-po"? Hehe.
    ko: 괴도 경찰 미란다는, 경경! 해야 하는 건가? 키킥~
    ja: |-
      怪盗警察のミランダに語尾を足すなら、
      「ケイケイ！」かしら？クスクス。
  event_goninjathief_epilogue_23:
    speaker: quency_e
    en: Oh, but Miranda isn't here yet?
    ko: 어, 그런데 미란다가 안 왔네?
    ja: そういえば、ミランダがまだ来てないわね～？
  event_goninjathief_epilogue_24:
    speaker: quency_e
    en: Did she forget we were supposed to meet today?
    ko: 오늘 만나기로 한 거 까먹었나?
    ja: 今日の約束、忘れてるのかしら？
  event_goninjathief_epilogue_25:
    speaker: delta_n
    en: I heard she won't be able to make it for a while.
    ko: 미란다는 당분간 못 온다고 들었지 말입니다.
    ja: |-
      ミランダでしたら、
      しばらくは活動に参加できないとのことでした。
  event_goninjathief_epilogue_26:
    speaker: quency_e
    en: Really? Why's that?
    ko: 그래? 왜?
    ja: そうなの？どうして？
  event_goninjathief_epilogue_27:
    speaker: delta_n
    en: Apparently, her workload increased so much that she had to work overtime.
    ko: 갑자기 야근까지 할 정도로 일이 늘어났다고 했지 말입니다.
    ja: |-
      残業をしなければならないほど
      急に仕事が増えたそうです。
  event_goninjathief_epilogue_28:
    speaker: "<Self>"
    en: A perfect leash for someone as diligent as Miranda.
    ko: 성실한 미란다에겐 최고의 족쇄겠네.
    ja: まじめなミランダには最高の足かせだな
  event_goninjathief_epilogue_29:
    speaker: quency_e
    en: Poli's sooo smart!
    ko: 폴리는 똑똑하다니깐~
    ja: ポリったら、ホント賢いんだから～
  event_goninjathief_epilogue_30:
    speaker: delta_n
    en: So does that mean there will be no phantom thief missions for the time being?
      Nin-nin?
    ko: 그럼, 당분간 괴도 활동은 없는 겁니까? 닌닌?
    ja: |-
      では、しばらくは活動は休止でしょうか？
      ニンニン？
  event_goninjathief_epilogue_31:
    speaker: phantom
    en: I cannot say for certain.
    ko: 글쎄.
    ja: どうだろうね。
  event_goninjathief_epilogue_32:
    speaker: phantom
    en: But if those in need of help and justice should call upon us,
    ko: 하지만, 도움과 정의를 필요로 하는 이들이 우리를 찾는다면.
    ja: |-
      だが、もし正義による救いの手を
      必要とする者が私たちを呼ぶのなら…
  event_goninjathief_epilogue_33:
    speaker: phantom
    en: Miranda will surely come.
    ko: 미란다는 반드시 올 것이오.
    ja: ミランダはきっと来るはずだ。
  event_goninjathief_epilogue_34:
    speaker: phantom
    en: That is the way of the Thieves of Justice.
    ko: 그게 정의 괴도단이니 말이오.
    ja: それが正義の怪盗団だからね。
  event_goninjathief_epilogue_35:
    speaker: delta_n
    en: As expected, we are the strongest team, nin-nin!
    ko: 역시, 최강의 팀이지 말입니다. 닌닌!
    ja: |-
      さすがは正義の怪盗団。
      最高のチームですね。ニンニン！
  event_goninjathief_epilogue_36:
    speaker: delta_n
    en: Today, I have learned something new once again, nin-nin!
    ko: 오늘 또 한 번 배웠지 말입니다. 닌닌!
    ja: 今日もひとつ勉強になりました。ニンニン！
  event_goninjathief_epilogue_37:
    speaker: "<Self>"
    en: I think you're overdoing it with the "nin-nin" thing.
    ko: 닌닌 너무 자주 한다.
    ja: ニンニン言いすぎだ
  event_goninjathief_epilogue_38:
    speaker: "<Self>"
    en: How about only using it at important moments?
    ko: 중요한 순간에만 하는 게 어때.
    ja: ここぞという時にだけ使ったらどうだ？
  event_goninjathief_epilogue_39:
    speaker: delta_n
    en: What do you consider an important moment?
    ko: 중요한 순간의 기준은 어떤 것입니까?
    ja: 具体的には、どういった場面でしょうか？
  event_goninjathief_epilogue_40:
    speaker: "<Self>"
    en: Like when you're using a jutsu, or when all eyes are on you...
    ko: 기술을 쓴다거나, 주목받는 순간이라거나….
    ja: 技を使う時とか、注目されたい時とか…
  event_goninjathief_epilogue_41:
    speaker: delta_n
    en: Understood.
    ko: 이해했습니다.
    ja: なるほど…分かりました。
  event_goninjathief_epilogue_42:
    speaker: phantom
    en: Very well, then.
    ko: 자, 그럼.
    ja: さて、それでは。
  event_goninjathief_epilogue_43:
    speaker: phantom
    en: Let us conclude today's meeting here.
    ko: 오늘의 회의는 여기서 끝이오.
    ja: 今日の会議はここまでとしよう。
  event_goninjathief_epilogue_44:
    speaker: phantom
    en: If nothing of note occurs, we shall meet again at this place, at this time,
      next month.
    ko: |-
      별다른 일이 없다면,
      다음 달 이 시간, 이곳에서 다시 만나는 것이오.
    ja: |-
      特に何もなければ、
      来月の同じ時間にここでまた会おう。
  event_goninjathief_epilogue_45:
    speaker: delta_n
    en: Understood.
    ko: 알겠습니다.
    ja: 分かりました。
  event_goninjathief_epilogue_46:
    speaker: quency_e
    en: Okay!
    ko: 오케이~
    ja: オッケ～！
  event_goninjathief_epilogue_47:
    speaker: "<Self>"
    en: Get home safe.
    ko: 조심히 들어가.
    ja: みんな、気をつけて帰ってくれ
  event_goninjathief_epilogue_48:
    speaker: "<Monologue>"
    en: Phantom leaves through the window, as always.
    ko: 팬텀은 여전히 창문으로.
    ja: |-
      その後、ファントムはいつものごとく
      窓から出ていき…
  event_goninjathief_epilogue_49:
    speaker: "<Monologue>"
    en: Quency crawls through the hole she made in my room.
    ko: 퀀시는 지휘관실 안에 내놓은 구멍으로 들어갔다.
    ja: |-
      クエンシーは指揮官室に作った
      抜け穴の中へと入っていった
  event_goninjathief_epilogue_50:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_epilogue_51:
    speaker: delta_n
    en: Why are you staring at me like that?
    ko: 왜 그리 빤히 보고 계십니까.
    ja: どうしてじっと見つめているのですか？
  event_goninjathief_epilogue_52:
    speaker: "<Self>"
    en: I was wondering how you'd make your exit.
    ko: 델타는 어떻게 퇴장할까 궁금해서.
    ja: |-
      いや、デルタがどうやって出ていくのか
      気になってな
  event_goninjathief_epilogue_53:
    speaker: delta_n
    en: "... Heh."
    ko: "…훗."
    ja: "…ふっ。"
  event_goninjathief_epilogue_54:
    speaker: delta_n
    en: No matter what you say, Commander, you truly do have affection for the Thieves
      of Justice.
    ko: |-
      이러니저러니 해도, 역시 지휘관은
      이 괴도단을 애정하고 계시지 말입니다.
    ja: |-
      何だかんだと言いつつ、やはり指揮官は
      怪盗団に愛情をお持ちなのですね。
  event_goninjathief_epilogue_55:
    speaker: "<Self>"
    en: Me? Nah.
    ko: 내가 뭘.
    ja: 別に愛情なんて…
  event_goninjathief_epilogue_56:
    speaker: delta_n
    en: I, the trainee ninja thief,
    ko: 수습 괴도 닌자, 델타.
    ja: 見習い怪盗忍者、デルタ。
  event_goninjathief_epilogue_57:
    speaker: delta_n
    en: shall return again.
    ko: 다시 돌아오겠습니다.
    ja: またここに戻ってまいります。
  event_goninjathief_epilogue_58:
    speaker: delta_n
    en: Nin-nin!
    ko: 닌닌!
    ja: ニンニン！
  event_goninjathief_epilogue_59:
    speaker: "<Narration>"
    en: "*Whoosh!*"
    ko: 슈슉!!
    ja: シュシュッ！
  event_goninjathief_epilogue_60:
    speaker: "<Self>"
    en: Oh...!
    ko: 오오…!
    ja: おお…！
  event_goninjathief_epilogue_61:
    speaker: "<Monologue>"
    en: Delta vanishes in the blink of an eye.
    ko: 델타는 거짓말처럼 빠른 속도로 사라졌고.
    ja: デルタが尋常ではない速さで姿を消したあと
  event_goninjathief_epilogue_62:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵-
    ja: カタッ
  event_goninjathief_epilogue_63:
    speaker: "<Monologue>"
    en: Something snaps shut in the ceiling above.
    ko: 천장에서 무언가 닫히는 소리가 들렸다.
    ja: 天井から何かを閉じる音が聞こえた
  event_goninjathief_epilogue_64:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_goninjathief_epilogue_65:
    speaker: "<Self>"
    en: Oh, right. I almost forgot she drilled a hole in my ceiling.
    ko: 아, 내 방 천장도 뚫었었지 참.
    ja: |-
      そういえば、部屋の天井にも
      穴を開けられていたんだったな…
  event_goninjathief_epilogue_66:
    speaker: "<Narration>"
    en: A hush falls over the night as darkness settles in.
    ko: 어둠이 내려앉은 조용한 밤.
    ja: 静かな闇が包む夜
  event_goninjathief_epilogue_67:
    speaker: "<Narration>"
    en: As the world sleeps,
    ko: 모두가 잠에 든 그 시간에.
    ja: 誰もが眠るその時に…
  event_goninjathief_epilogue_68:
    speaker: "<Narration>"
    en: a band of few begin their work.
    ko: 활동을 시작하는 이들이 있다.
    ja: 動き始める者たちがいる
  event_goninjathief_epilogue_69:
    speaker: "<Narration>"
    en: In the name of justice, they will soar through the night sky once again.
    ko: |-
      그들은 오늘도 정의를 위해,
      밤하늘을 누빌 것이다.
    ja: |-
      彼女たちは今日も正義のために、
      夜空を駆け回るだろう
