---
event_arcanearchive_prologue:
  event_arcanearchive_prologue_1:
    speaker: ingrid
    en: Will you be okay?
    ko: "…괜찮겠나?"
    ja: "…本当に大丈夫なのか？"
  event_arcanearchive_prologue_2:
    speaker: arcana
    en: Sorry?
    ko: 네?
    ja: はい？
  event_arcanearchive_prologue_3:
    speaker: ingrid
    en: I'm sure you already know that you're quickly reaching your limit.
    ko: 슬슬 한계라는 걸 너도 알고 있을 텐데.
    ja: |-
      そろそろ限界だということは
      お前自身も分かっているはずだ。
  event_arcanearchive_prologue_4:
    speaker: arcana
    en: "...?"
    ko: "…??"
    ja: "…？？"
  event_arcanearchive_prologue_5:
    speaker: arcana
    en: You've said that several times already.
    ko: 그 얘기는 몇 번이나 했잖아요.
    ja: そのお話なら、もう何度もしましたよね。
  event_arcanearchive_prologue_6:
    speaker: arcana
    en: This is my job.
    ko: 그게 제 일인걸요.
    ja: これが私のお仕事ですので。
  event_arcanearchive_prologue_7:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_prologue_8:
    speaker: ingrid
    en: Okay. If that's what you want.
    ko: 알았다. 네가 그렇다면.
    ja: |-
      …分かった。
      お前がそう言うのなら。
  event_arcanearchive_prologue_9:
    speaker: arcana
    en: All right, I'm going to lie down.
    ko: 그럼 누울게요?
    ja: では、横になりますね。
  event_arcanearchive_prologue_10:
    speaker: "<Narration>"
    en: Arcana lies down on the bed extending out from the large cylindrical machine.
    ko: 아르카나는 커다란 원통형 기계 밖으로 뻗어 나온 침상에 누웠다.
    ja: |-
      アルカナは大きな円筒状の機械から
      飛び出しているベッドに横たわった
  event_arcanearchive_prologue_11:
    speaker: arcana
    en: Yikes, cold.
    ko: 앗 차거.
    ja: きゃっ、冷たい！
  event_arcanearchive_prologue_12:
    speaker: arcana
    en: Can't you at least outfit this thing with some heating?
    ko: 으으. 이거 열선 같은 것 좀 깔아주시면 안 돼요?
    ja: |-
      うう…これ、ヒーターを入れたりは
      できませんか？
  event_arcanearchive_prologue_13:
    speaker: arcana
    en: It's always freezing.
    ko: 맨날 너무 차가운데.
    ja: いつも、すっごく冷たいんです。
  event_arcanearchive_prologue_14:
    speaker: ingrid
    en: I'll think about it.
    ko: "…고려해 보지."
    ja: "…考慮しよう。"
  event_arcanearchive_prologue_15:
    speaker: ingrid
    en: Anyway, let's begin.
    ko: 그럼 시작하겠다.
    ja: では、始めるぞ。
  event_arcanearchive_prologue_16:
    speaker: arcana
    en: All right.
    ko: 네에~
    ja: は～い。
  event_arcanearchive_prologue_17:
    speaker: arcana
    en: Oh, wait!
    ko: "…앗! 자, 잠깐만요!"
    ja: "…あっ！や、やっぱり待ってください！"
  event_arcanearchive_prologue_18:
    speaker: ingrid
    en: It's okay if you're scared.
    ko: "…그래. 역시 겁이 나겠지."
    ja: "…ああ。やはり怖いだろう。"
  event_arcanearchive_prologue_19:
    speaker: ingrid
    en: You're doing the right thing.
    ko: 그래도 잘 생각했다.
    ja: それでも、今までよく頑張ってくれ…
  event_arcanearchive_prologue_20:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵.
    ja: カシャッ
  event_arcanearchive_prologue_21:
    speaker: arcana
    en: Just let me take a few selfies, for proof y'know?
    ko: 잠깐 인증샷 좀.
    ja: えへ、ちょっと記念写真を。
  event_arcanearchive_prologue_22:
    speaker: "<Narration>"
    en: "*Click click click*"
    ko: 찰칵. 찰칵. 찰칵.
    ja: カシャカシャッ、カシャッ
  event_arcanearchive_prologue_23:
    speaker: "<Narration>"
    en: Arcana strikes a couple of different poses as she takes a few snaps with her
      phone.
    ko: 아르카나는 여러 가지 포즈를 취하며 핸드폰으로 자신의 사진을 찍었다.
    ja: |-
      アルカナは様々なポーズをとりながら
      携帯電話で自撮りを行った
  event_arcanearchive_prologue_24:
    speaker: arcana
    en: Hehe, sorry about that.
    ko: 헤헷. 죄송합니다~
    ja: えへへっ、お待たせしました～
  event_arcanearchive_prologue_25:
    speaker: arcana
    en: All done now.
    ko: 이제 됐어요.
    ja: もう大丈夫です！
  event_arcanearchive_prologue_26:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_prologue_27:
    speaker: "<Narration>"
    en: As Ingrid presses the button, the machine hums to life.
    ko: 잉그리드가 버튼을 누르자, 기계가 작동하기 시작했다.
    ja: |-
      イングリッドがボタンを押すと、
      装置が動き出した
  event_arcanearchive_prologue_28:
    speaker: "<Narration>"
    en: "*Vrrrmmmm*"
    ko: 우우웅-
    ja: ウウウン…
  event_arcanearchive_prologue_29:
    speaker: notification
    en: Memory wipe procedure initiated.
    ko: "[기억 소거 절차 개시]"
    ja: "「記憶消去プロセス、開始」"
  event_arcanearchive_prologue_30:
    speaker: ingrid
    en: We're only within the authorized limits by a hair...
    ko: "…아슬아슬하게 권한 안쪽…."
    ja: "…ギリギリ権限内…"
  event_arcanearchive_prologue_31:
    speaker: ingrid
    en: No, wait. It's the opposite.
    ko: 아니, 반대인가.
    ja: "…いや。"
  event_arcanearchive_prologue_32:
    speaker: ingrid
    en: We're just outside it.
    ko: 아슬아슬하게 권한 바깥쪽이로군.
    ja: ギリギリ権限外だな。
  event_arcanearchive_prologue_33:
    speaker: "<Narration>"
    en: Arcana lies inside the operating machine with her eyes closed peacefully.
    ko: 아르카나는 작동하는 기계 안에서 평온하게 눈을 감고 있다.
    ja: |-
      アルカナは動き出した装置の中で
      穏やかに目を閉じている
  event_arcanearchive_prologue_34:
    speaker: ingrid
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_prologue_35:
    speaker: "<Narration>"
    en: Ingrid takes out her phone.
    ko: 그 모습을 바라보던 잉그리드는 휴대폰을 꺼내 조작했다.
    ja: |-
      その姿を見ていたイングリッドは、
      おもむろに携帯電話を取り出して操作した
  event_arcanearchive_prologue_36:
    speaker: notification
    en: Please provide authentication code.
    ko: "[인증 코드를 말씀해 주십시오]"
    ja: "「認証コードをどうぞ」"
  event_arcanearchive_prologue_37:
    speaker: ingrid
    en: "..."
    ko: "…[I]."
    ja: "…「I」。"
  event_arcanearchive_prologue_38:
    speaker: notification
    en: Authenticating user...
    ko: "[사용자 인증 진행 중…]"
    ja: "「ユーザー認証中…」"
  event_arcanearchive_prologue_39:
    speaker: ingrid
    en: "... You do what you have to do."
    ko: "…너는 네가 해야 할 일을 해라."
    ja: "…お前は、お前がすべきことをしろ。"
  event_arcanearchive_prologue_40:
    speaker: ingrid
    en: I'll do the same.
    ko: 나도 내가 해야 할 일을 하겠다.
    ja: 私も、私がすべきことをする。
  event_arcanearchive_prologue_41:
    speaker: notification
    en: "... Authentication complete."
    ko: "[…인증되었습니다]"
    ja: "「…認証が完了しました」"
  event_arcanearchive_prologue_42:
    speaker: notification
    en: 'User Code: I'
    ko: "[사용자 코드, I]"
    ja: "「ユーザーコード、I」"
  event_arcanearchive_prologue_43:
    speaker: notification
    en: For a righteous judgment.
    ko: "[정의로운 판결을 위하여]"
    ja: "「正義ある裁きのために」"
event_arcanearchive_01_s:
  event_arcanearchive_01_s_1:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_arcanearchive_01_s_2:
    speaker: phantom
    en: Monsieur! Stay right where you are!
    ko: 그대! 그대 자리에 있소!
    ja: "@UserName君はいるか！？"
  event_arcanearchive_01_s_3:
    speaker: "<Choice>"
    en: What's wrong?
    ko: 무슨 일이야?
    ja: "…ファントム？どうかしたのか？"
  event_arcanearchive_01_s_4:
    speaker: "<Choice>"
    en: Is it time for the Thieves of Justice to make a move?
    ko: "…정의 괴도단이 출격할 시간인가!"
    ja: "…正義の怪盗団の出番か！？"
  event_arcanearchive_01_s_5:
    speaker: phantom
    en: Unfortunately, not this time.
    ko: 아쉽지만 이번엔 아니오.
    ja: 残念だが、今回は違う。
  event_arcanearchive_01_s_6:
    speaker: "<Self>"
    en: Then what is it?
    ko: 그러면?
    ja: なら、いったい…？
  event_arcanearchive_01_s_7:
    speaker: phantom
    en: I need your help.
    ko: "…그대의 도움이 필요하오."
    ja: "…突然ですまないが、君の力を貸してほしい。"
  event_arcanearchive_01_s_8:
    speaker: "<Monologue>"
    en: A stranger appears from behind Phantom.
    ko: 팬텀의 뒤로 처음 보는 사람이 나타났다.
    ja: ファントムの後ろから、見知らぬ人物が現れた
  event_arcanearchive_01_s_9:
    speaker: phantom
    en: Let me introduce you to someone.
    ko: 소개하겠소.
    ja: 紹介しよう。
  event_arcanearchive_01_s_10:
    speaker: phantom
    en: This is Arcana. She's also from the Best Seller Squad.
    ko: 우리 베스트셀러 스쿼드의 아르카나라고 하오.
    ja: 私と同じ、ベストセラー部隊のアルカナだ。
  event_arcanearchive_01_s_11:
    speaker: arcana
    en: Hello!
    ko: 안녕하세요~
    ja: こんにちは～
  event_arcanearchive_01_s_12:
    speaker: "<Self>"
    en: Nice to meet you, Arcana.
    ko: 반가워, 아르카나.
    ja: あ、ああ。よろしく、アルカナ
  event_arcanearchive_01_s_13:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_01_s_14:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_arcanearchive_01_s_15:
    speaker: arcana
    en: "?"
    ko: "?"
    ja: "？"
  event_arcanearchive_01_s_16:
    speaker: arcana
    en: Oh, you were talking to me?
    ko: 아, 아! 저한테 인사하신 거였군요?
    ja: "…あっ！今、私に挨拶されたんですか？"
  event_arcanearchive_01_s_17:
    speaker: arcana
    en: Nice to meet you too.
    ko: 네. 저도 반가워요~
    ja: |-
      えへへ、すみません。
      よろしくお願いしま～す。
  event_arcanearchive_01_s_18:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_01_s_19:
    speaker: phantom
    en: Allow me to apologize on her behalf.
    ko: 내가 대신 사과드리겠소.
    ja: "…すまない。代わりに詫びよう。"
  event_arcanearchive_01_s_20:
    speaker: phantom
    en: She's not usually like this.
    ko: 그래도 원래 이런 건 아니니까 오해하지는 말아 주시오.
    ja: |-
      普段はこうじゃないんだ。
      どうか勘違いしないでくれ。
  event_arcanearchive_01_s_21:
    speaker: phantom
    en: She lost her memory.
    ko: "…아르카나는 지금 기억을 잃은 상태요."
    ja: "…今の彼女は、記憶を失っているんだ。"
  event_arcanearchive_01_s_22:
    speaker: "<Self>"
    en: What do you mean? As in she underwent a memory wipe?
    ko: 기억을 잃었다고?
    ja: 記憶を…？
  event_arcanearchive_01_s_23:
    speaker: phantom
    en: That's right.
    ko: 그렇소.
    ja: そうだ。
  event_arcanearchive_01_s_24:
    speaker: phantom
    en: I'm not sure if you remember,
    ko: 혹시 기억하고 있소?
    ja: 以前話したことを覚えているかい？
  event_arcanearchive_01_s_25:
    speaker: phantom
    en: but due to the sensitive and secretive nature of our work,
    ko: 비밀을 다루는 업무의 특성상,
    ja: 機密情報を扱う任務に就いているため…
  event_arcanearchive_01_s_26:
    speaker: phantom
    en: the members of Best Seller have to undergo regular memory wipes.
    ko: 우리 베스트셀러 스쿼드는 주기적으로 기억 소거를 받고 있다는 것 말이오.
    ja: |-
      ベストセラー部隊では、
      定期的に記憶消去を行っているということを。
  event_arcanearchive_01_s_27:
    speaker: "<Choice>"
    en: Right.
    ko: 그랬지.
    ja: ああ、そうだったな
  event_arcanearchive_01_s_28:
    speaker: "<Choice>"
    en: I see.
    ko: 그렇구나.
    ja: そうなのか…？
  event_arcanearchive_01_s_29:
    speaker: arcana
    en: Secretive...?
    ko: 비밀…?
    ja: 機密情報…？
  event_arcanearchive_01_s_30:
    speaker: phantom
    en: I receive my fair share of memory wipes,
    ko: 나도 기억 소거를 자주 받지만.
    ja: 私もよく記憶消去を受けているが…
  event_arcanearchive_01_s_31:
    speaker: phantom
    en: but it's nothing compared to what Arcana goes through.
    ko: 아르카나는 훨씬 더 자주 받는다오.
    ja: アルカナはとりわけ、その頻度が高いのだ。
  event_arcanearchive_01_s_32:
    speaker: "<Self>"
    en: How often does she have to get it done?
    ko: 얼마나 자주?
    ja: どれくらいの頻度なんだ？
  event_arcanearchive_01_s_33:
    speaker: phantom
    en: On a daily basis.
    ko: 거의 매일 받는 걸로 알고 있소.
    ja: ほぼ毎日のはずだ。
  event_arcanearchive_01_s_34:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_01_s_35:
    speaker: phantom
    en: Even though it's become a daily routine,
    ko: 그렇게 계속, 기억 소거를 받아 오다가….
    ja: そうして記憶消去を受け続けていたのだが…
  event_arcanearchive_01_s_36:
    speaker: phantom
    en: something went wrong this time.
    ko: 이번에 일이 터진 것이지.
    ja: 今回、問題が発生してしまってね。
  event_arcanearchive_01_s_37:
    speaker: "<Self>"
    en: Like lasting side effects?
    ko: 부작용 같은 거야?
    ja: 副作用みたいなものか？
  event_arcanearchive_01_s_38:
    speaker: phantom
    en: I guess you could say that.
    ko: 그렇다고 할 수 있겠소.
    ja: そうとも言えるだろう。
  event_arcanearchive_01_s_39:
    speaker: phantom
    en: We're supposed to only forget the information we handle,
    ko: 원래는 자신이 취급한 정보에 대해서만 잊어야 하오.
    ja: |-
      本来忘れるのは自分が取り扱った
      情報だけのはずなのだが…
  event_arcanearchive_01_s_40:
    speaker: phantom
    en: but right now, Arcana has forgotten who she even is.
    ko: 하지만 아르카나는 지금 자기가 누구인지조차 잊고 말았소.
    ja: |-
      今回の記憶消去で、アルカナは
      自分自身のことまで忘れてしまったんだ。
  event_arcanearchive_01_s_41:
    speaker: phantom
    en: The Boss asked me to do whatever I could to try and bring her memories back,
      but nothing had worked so far.
    ko: 사장님에게 부탁받아서, 내가 어떻게든 해보려 했지만… 역부족이었소.
    ja: |-
      それで社長に頼まれ、
      解決しようと努めたが…できなかった。
  event_arcanearchive_01_s_42:
    speaker: phantom
    en: Please, Monsieur, I need you to help Arcana regain her memory.
    ko: 부탁이오. 부디 아르카나가 기억을 되찾을 수 있도록 도와주시오.
    ja: |-
      だから、どうか頼む。
      アルカナが記憶を取り戻せるよう、
      力を貸してはもらえないだろうか？
  event_arcanearchive_01_s_43:
    speaker: "<Self>"
    en: Hm...
    ko: 음….
    ja: うーん…
  event_arcanearchive_01_s_44:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_01_s_45:
    speaker: phantom
    en: Are you not in a position to help?
    ko: 혹시 그대도 돕기 어려운 것이오…?
    ja: もしや、君でも無理なのか…？
  event_arcanearchive_01_s_46:
    speaker: "<Self>"
    en: No, it's not that.
    ko: 아니, 그런 게 아니라.
    ja: いや、そうではなく…
  event_arcanearchive_01_s_47:
    speaker: "<Self>"
    en: I'm just thinking about what we could do to help her regain her memory.
    ko: 어떻게 해야 기억을 돌아오게 할 수 있을지 생각을….
    ja: どうすれば記憶を取り戻せるのか、考えて…
  event_arcanearchive_01_s_48:
    speaker: arcana
    en: Name.
    ko: "…이름."
    ja: "…名前。"
  event_arcanearchive_01_s_49:
    speaker: "<Self>"
    en: "??"
    ko: 응?
    ja: えっ？
  event_arcanearchive_01_s_50:
    speaker: arcana
    en: I remember my name.
    ko: 제 이름… 기억났어요.
    ja: 私の名前…思い出しました。
  event_arcanearchive_01_s_51:
    speaker: arcana
    en: And what my job was.
    ko: 그리고 원래 하던 일도요.
    ja: それから、自分のお仕事も。
  event_arcanearchive_01_s_52:
    speaker: "<Self>"
    en: You do? Well, that's something.
    ko: 그래? 다행이네.
    ja: そうなのか？ならよかっ…
  event_arcanearchive_01_s_53:
    speaker: arcana
    en: My name is Arcana.
    ko: "…제 이름은 아르카나."
    ja: "…私の名前はアルカナ。"
  event_arcanearchive_01_s_54:
    speaker: arcana
    en: I'm a detective.
    ko: 탐정이에요.
    ja: 探偵です！
event_arcanearchive_01_e:
  event_arcanearchive_01_e_1:
    speaker: arcana
    en: My name is Arcana.
    ko: "…제 이름은 아르카나."
    ja: "…私の名前はアルカナ。"
  event_arcanearchive_01_e_2:
    speaker: arcana
    en: I'm a detective.
    ko: 탐정이에요.
    ja: 探偵です！
  event_arcanearchive_01_e_3:
    speaker: "<Choice>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_01_e_4:
    speaker: "<Choice>"
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_arcanearchive_01_e_5:
    speaker: arcana
    en: Phantom mentioned secrets earlier,
    ko: 조금 전에 팬텀이 비밀이라고 했을 때.
    ja: さっき、ファントムが「機密情報」と言った時…
  event_arcanearchive_01_e_6:
    speaker: arcana
    en: and something clicked in my mind.
    ko: 뭔가 핑- 하고 오는 게 있었거든요.
    ja: ピンと来るものがあったんです。
  event_arcanearchive_01_e_7:
    speaker: arcana
    en: Also, the word "detective" sounds familiar.
    ko: 탐정이라는 단어도 좀 익숙하구요.
    ja: |-
      探偵というワードも、
      なんだか馴染みがあります。
  event_arcanearchive_01_e_8:
    speaker: arcana
    en: Therefore, I must be...
    ko: 그러니까 저는 분명히…!
    ja: ですから、私はきっと…！
  event_arcanearchive_01_e_9:
    speaker: phantom
    en: That's probably because you played the role of the detective when we all practiced
      being thieves.
    ko: "…그건 나와 괴도 연습을 할 때 탐정 역할을 맡아서 그럴 것이오."
    ja: |-
      …馴染みがあるのは、私が怪盗の練習を
      していた時に探偵役を務めていたからだろうな。
  event_arcanearchive_01_e_10:
    speaker: arcana
    en: Oh, is that it?
    ko: 앗. 그런가요?
    ja: あっ、そうなんですか？
  event_arcanearchive_01_e_11:
    speaker: phantom
    en: That's right.
    ko: 그렇소.
    ja: ああ。
  event_arcanearchive_01_e_12:
    speaker: "<Self>"
    en: At least you got your name right.
    ko: 그래도 이름은 기억났나 보네….
    ja: だが、名前は思い出せたみたいだな
  event_arcanearchive_01_e_13:
    speaker: phantom
    en: Arcana, try and remember.
    ko: "…아르카나. 부디 떠올리시오."
    ja: "…アルカナ。どうか思い出してくれ。"
  event_arcanearchive_01_e_14:
    speaker: phantom
    en: We are the Best Seller Squad.
    ko: 우리는 베스트셀러 스쿼드.
    ja: 私たちはベストセラー部隊。
  event_arcanearchive_01_e_15:
    speaker: phantom
    en: Librarians in the Ark, entrusted with the noble duty of preserving knowledge.
    ko: 방주 도서관의 사서이자, 지식을 수호하는 숭고한 사명을 지닌 자들이오.
    ja: |-
      アーク図書館の司書であり、
      知識を守るという崇高な使命を
      持つ者だということを。
  event_arcanearchive_01_e_16:
    speaker: arcana
    en: You can explain it all you want, but I still don't remember.
    ko: 그렇게 말씀하셔도….
    ja: そう言われましても…
  event_arcanearchive_01_e_17:
    speaker: "<Self>"
    en: Is there anything you could tell her which would jog her memory?
    ko: 혹시 단서가 될 만한 건 없어?
    ja: 何か、手がかりになるようなものはないのか？
  event_arcanearchive_01_e_18:
    speaker: phantom
    en: To be honest, I'm not really sure.
    ko: "…나도 잘 모르오."
    ja: "…すまないが、心当たりがないんだ。"
  event_arcanearchive_01_e_19:
    speaker: "<Choice>"
    en: Why not?
    ko: 어째서?
    ja: なぜだ？
  event_arcanearchive_01_e_20:
    speaker: "<Choice>"
    en: But aren't you both from the same squad?
    ko: 같은 스쿼드인데도?
    ja: 同じ部隊の仲間なのに？
  event_arcanearchive_01_e_21:
    speaker: phantom
    en: We're both a part of Best Seller,
    ko: 우리는 같은 베스트셀러 스쿼드지만,
    ja: 私たちは同じベストセラー部隊の所属だが、
  event_arcanearchive_01_e_22:
    speaker: phantom
    en: yes, but we don't actually know much about each other's work.
    ko: 서로가 구체적으로 어떤 업무를 하는지는 알지 못하오.
    ja: |-
      お互いの具体的な任務については
      知らないんだ。
  event_arcanearchive_01_e_23:
    speaker: "<Self>"
    en: Because it's classified?
    ko: 기밀 사항인 거야?
    ja: それも機密事項なのか？
  event_arcanearchive_01_e_24:
    speaker: phantom
    en: That's right. Other than personal matters, we don't know much else about each
      other.
    ko: 그렇소. 사적인 부분 외에는 거의 아는 것이 없소.
    ja: |-
      ああ。
      プライベート以外は、ほぼ何も知らない。
  event_arcanearchive_01_e_25:
    speaker: phantom
    en: When it comes to our professional roles,
    ko: 업무적으로는 그저,
    ja: おそらく、彼女は任務で…
  event_arcanearchive_01_e_26:
    speaker: phantom
    en: I can only assume that Arcana handles even more secretive material than the
      rest of us.
    ko: 아르카나가 특히 더 깊은 비밀을 다루는 게 아닐지 추측하는 정도요.
    ja: |-
      私よりも機密性が高い情報を
      取り扱っているのだろう。
  event_arcanearchive_01_e_27:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: そうか…
  event_arcanearchive_01_e_28:
    speaker: phantom
    en: But I do know where she usually spends her time,
    ko: 그래도 아르카나가 평소에 지내는 곳은 알고 있소.
    ja: |-
      それでも、アルカナが普段
      過ごしている場所くらいは知っている。
  event_arcanearchive_01_e_29:
    speaker: phantom
    en: which is in her workshop.
    ko: 아마 그곳이 아르카나의 작업실이겠지.
    ja: |-
      おそらく、その場所こそが
      アルカナの仕事部屋だろう。
  event_arcanearchive_01_e_30:
    speaker: phantom
    en: Why don't we go there and try to find some clues?
    ko: 우선 그곳으로 가서 단서를 찾아보는 게 어떻겠소?
    ja: まずはそこに行って、手がかりを探さないか？
  event_arcanearchive_01_e_31:
    speaker: phantom
    en: My thief instincts are pointing in that direction.
    ko: 내 괴도의 감이 그곳을 가리키고 있소.
    ja: |-
      私の怪盗のカンが、
      そこに何かがあると告げているんだ。
  event_arcanearchive_01_e_32:
    speaker: "<Self>"
    en: I suppose that's the only viable option we have.
    ko: "…지금은 그 방법밖에 없겠네."
    ja: "…分かった。今は他に打つ手もないしな"
  event_arcanearchive_01_e_33:
    speaker: "<Self>"
    en: Are you okay with that, Arcana?
    ko: 아르카나. 괜찮겠어?
    ja: アルカナ、それでもいいか？
  event_arcanearchive_01_e_34:
    speaker: arcana
    en: With what?
    ko: 네? 뭐가요?
    ja: はい？何がですか？
  event_arcanearchive_01_e_35:
    speaker: "<Self>"
    en: We're planning on going to your room.
    ko: 지금부터 네 방에 가 보려고 하는데.
    ja: 今から君の部屋に行きたいんだが…
  event_arcanearchive_01_e_36:
    speaker: arcana
    en: Oh.
    ko: 아….
    ja: えっ…
  event_arcanearchive_01_e_37:
    speaker: arcana
    en: I dunno, that's a bit...
    ko: 그건… 좀….
    ja: それは…ちょっと…
  event_arcanearchive_01_e_38:
    speaker: "<Self>"
    en: What's making you hesitant?
    ko: 왜?
    ja: なぜだ？
  event_arcanearchive_01_e_39:
    speaker: arcana
    en: I'm a bit of a neat freak.
    ko: 제가 좀 깔끔떠는 성격이라… 가 아니라.
    ja: 私ってキレイ好きなので…あっ、じゃなくて。
  event_arcanearchive_01_e_40:
    speaker: arcana
    en: Or at least... I think I was?
    ko: 제가 좀 깔끔떠는 성격이었던 것 같아서요.
    ja: |-
      キレイ好きだったんじゃないかな～って
      思うので。
  event_arcanearchive_01_e_41:
    speaker: phantom
    en: That's true.
    ko: 그건 맞소.
    ja: ふむ、確かにそうだな。
  event_arcanearchive_01_e_42:
    speaker: phantom
    en: You never did have so much as a hair out of place.
    ko: 아르카나는 항상 깔끔하게 꾸민 모습이었으니까.
    ja: アルカナはいつもキレイに着飾っていた。
  event_arcanearchive_01_e_43:
    speaker: phantom
    en: Looks like that hasn't changed.
    ko: 지금도 그렇지 않소?
    ja: 今もそうだろう？
  event_arcanearchive_01_e_44:
    speaker: arcana
    en: Hehe, I guess not.
    ko: 에헤헤. 그쵸?
    ja: えへへ…ですよね？
  event_arcanearchive_01_e_45:
    speaker: arcana
    en: Maybe that's why when I hear that other people will be entering my room,
    ko: 그래서 그런지, 다른 분들이 방에 들어오신다고 하니까.
    ja: |-
      そのせいなのか、誰かが
      自分の部屋に入ると思うと…
  event_arcanearchive_01_e_46:
    speaker: arcana
    en: I feel this sense of resistance.
    ko: 저항감이라고 해야 하나? 조금 싫은 느낌이에요.
    ja: |-
      抵抗があるというか、
      ちょっとイヤな感じがするんです。
  event_arcanearchive_01_e_47:
    speaker: "<Self>"
    en: But if we don't check it out, we won't turn up any clues.
    ko: 그러면 단서를 찾아볼 수가 없는데….
    ja: だが、それだと手がかりを探せないな…
  event_arcanearchive_01_e_48:
    speaker: arcana
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_arcanearchive_01_e_49:
    speaker: arcana
    en: How about this?
    ko: 그럼 이렇게 해요.
    ja: では、こうしましょう。
  event_arcanearchive_01_e_50:
    speaker: "<Monologue>"
    en: Arcana lifts her pinky finger.
    ko: 아르카나는 내게 새끼손가락을 내밀었다.
    ja: アルカナは私に小指を差し出した
  event_arcanearchive_01_e_51:
    speaker: arcana
    en: Promise me something.
    ko: 약속.
    ja: 約束。
  event_arcanearchive_01_e_52:
    speaker: "<Self>"
    en: Promise what?
    ko: 약속?
    ja: 約束？
  event_arcanearchive_01_e_53:
    speaker: arcana
    en: That you won't make too much of a mess.
    ko: 너무 어지럽히진 말기로 약속.
    ja: |-
      はい。
      あまり散らかさないって、約束してください。
  event_arcanearchive_01_e_54:
    speaker: arcana
    en: If you do that, I might feel better about all this.
    ko: 그러면 괜찮을 것 같아요.
    ja: それなら大丈夫だと思います。
  event_arcanearchive_01_e_55:
    speaker: "<Self>"
    en: Uh... sure.
    ko: 으, 응.
    ja: あ、ああ
  event_arcanearchive_01_e_56:
    speaker: "<Monologue>"
    en: I hook my pinky together with Arcana's.
    ko: 어쩔 수 없이 아르카나와 손가락을 걸었다.
    ja: 仕方なくアルカナと指切りをした
  event_arcanearchive_01_e_57:
    speaker: arcana
    en: All right, let's go.
    ko: 그럼 이제 갈까요?
    ja: じゃあ、行きましょうか。
  event_arcanearchive_01_e_58:
    speaker: "<Monologue>"
    en: Arcana strides confidently out the door...
    ko: 아르카나는 척척 문밖으로 나갔다.
    ja: アルカナはすたすたと指揮官室の外に出ていった
  event_arcanearchive_01_e_59:
    speaker: "<Monologue>"
    en: And then promptly comes back.
    ko: "…가 다시 돌아왔다."
    ja: "…と思った次の瞬間に、戻ってきた"
  event_arcanearchive_01_e_60:
    speaker: arcana
    en: Where is my workshop, by the way?
    ko: 그런데 제 작업실이 어디죠?
    ja: ところで、私の仕事部屋ってどこでしょうか？
  event_arcanearchive_01_e_61:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_01_e_62:
    speaker: phantom
    en: I'll lead the way.
    ko: "…내가 안내하겠소."
    ja: "…私が案内しよう。"
event_arcanearchive_02_s:
  event_arcanearchive_02_s_1:
    speaker: "<Monologue>"
    en: After arriving at the library,
    ko: 잠시 후 도서관에 도착한 우리는,
    ja: しばらくして、図書館に到着した私たちは…
  event_arcanearchive_02_s_2:
    speaker: "<Monologue>"
    en: we proceed to follow Phantom deeper inside the building, past the reading
      room...
    ko: 팬텀을 따라 열람실을 지나 안쪽으로 들어가서….
    ja: |-
      ファントムに続いて閲覧室を通り過ぎたあと、
      さらに奥へと進み…
  event_arcanearchive_02_s_3:
    speaker: "<Monologue>"
    en: Until we reach a door at the end of a secluded hallway.
    ko: 구석진 복도 끝에 있는 문에 도착했다.
    ja: 廊下の突き当たりにあるドアにたどり着いた
  event_arcanearchive_02_s_4:
    speaker: phantom
    en: This is it.
    ko: 이곳이오.
    ja: ここだ。
  event_arcanearchive_02_s_5:
    speaker: phantom
    en: This should be Arcana's workshop, although I've never been inside.
    ko: 들어가 본 적은 없지만, 이곳이 바로 아르카나의 작업실일 거요.
    ja: |-
      入ったことはないが、
      おそらくここがアルカナの仕事部屋だろう。
  event_arcanearchive_02_s_6:
    speaker: "<Self>"
    en: Looks quite secretive.
    ko: 꽤 비밀스러워 보이는데?
    ja: ずいぶん分かりにくい場所にあるんだな
  event_arcanearchive_02_s_7:
    speaker: arcana
    en: Hmm?
    ko: "…아?"
    ja: "…あれ？"
  event_arcanearchive_02_s_8:
    speaker: arcana
    en: This must have been written by me.
    ko: 이거, 제가 쓴 거겠죠?
    ja: これって、私が書いたんでしょうか？
  event_arcanearchive_02_s_9:
    speaker: "<Monologue>"
    en: Arcana points to a note stuck on the door which reads "Authorized Personnel
      Only!".
    ko: |-
      아르카나가 문에 붙어 있는,
      [관계자 외 출입 금지!]라고 적힌 메모지를 가리켰다.
    ja: |-
      アルカナはドアに貼ってある
      「関係者以外立ち入り禁止！」と書かれた
      メモを指さした
  event_arcanearchive_02_s_10:
    speaker: phantom
    en: That's definitely your handwriting.
    ko: 그렇소. 아르카나의 글씨가 맞소.
    ja: ああ、間違いなく君の文字だな。
  event_arcanearchive_02_s_11:
    speaker: arcana
    en: Hehe...
    ko: 헤에….
    ja: へぇ…
  event_arcanearchive_02_s_12:
    speaker: arcana
    en: Hey, you know what?
    ko: 저기요 저기요.
    ja: あの、あの。
  event_arcanearchive_02_s_13:
    speaker: "<Monologue>"
    en: Arcana pokes my side.
    ko: 아르카나가 내 옆구리를 콕콕 찔렀다.
    ja: アルカナが私の脇腹をツンツンした
  event_arcanearchive_02_s_14:
    speaker: "<Self>"
    en: What?
    ko: 왜?
    ja: どうかしたか？
  event_arcanearchive_02_s_15:
    speaker: arcana
    en: Given how hidden this location is,
    ko: 여기 위치도 그렇고.
    ja: 仕事部屋がこんな場所にあるってことは、
  event_arcanearchive_02_s_16:
    speaker: arcana
    en: I must have been working on something that was a huge secret.
    ko: 아무래도 저는 엄청 비밀스러운 일을 했나 봐요.
    ja: |-
      やっぱり私、ベールに包まれたお仕事を
      してたみたいですね。
  event_arcanearchive_02_s_17:
    speaker: arcana
    en: If I'm not a detective, then...
    ko: 탐정이 아니라면, 혹시….
    ja: なおかつ探偵以外となると、ひょっとして…
  event_arcanearchive_02_s_18:
    speaker: "<Self>"
    en: Then...?
    ko: 혹시?
    ja: ひょっとして？
  event_arcanearchive_02_s_19:
    speaker: arcana
    en: Maybe I'm an assassin?
    ko: 암살자라던가?
    ja: "…殺し屋とか？"
  event_arcanearchive_02_s_20:
    speaker: arcana
    en: Or a fixer? Something like that?
    ko: 아니면 해결사? 뭐 그런 거?
    ja: それとも万屋？みたいな職業でしょうか？
  event_arcanearchive_02_s_21:
    speaker: "<Self>"
    en: I highly doub...
    ko: 그럴 리는… 음.
    ja: そんなはずは…
  event_arcanearchive_02_s_22:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_23:
    speaker: "<Monologue>"
    en: It's not entirely impossible...
    ko: 꼭 말이 안 되는 건 아닌가….
    ja: いや、あり得ないとも言い切れないか…
  event_arcanearchive_02_s_24:
    speaker: "<Self>"
    en: "... Actually, that might be true."
    ko: "…그럴 수도 있겠다."
    ja: "…その可能性もなくはないな"
  event_arcanearchive_02_s_25:
    speaker: arcana
    en: You think so too?
    ko: 그쵸그쵸?
    ja: ですよね！
  event_arcanearchive_02_s_26:
    speaker: arcana
    en: Let's hurry inside!
    ko: 얼른 들어가 봐요.
    ja: ささっ、早く入りましょう。
  event_arcanearchive_02_s_27:
    speaker: arcana
    en: We might find a weapon stash.
    ko: 안에 무기 같은 게 잔뜩 들어 있을지도 몰라요.
    ja: 中は武器だらけかもしれませんよ～？
  event_arcanearchive_02_s_28:
    speaker: arcana
    en: Knives, guns, all sorts of stuff!
    ko: 막 칼이랑 총이랑….
    ja: ナイフとか、銃とか～…
  event_arcanearchive_02_s_29:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: ガチャ
  event_arcanearchive_02_s_30:
    speaker: arcana
    en: Huh?
    ko: 어라?
    ja: あれ？
  event_arcanearchive_02_s_31:
    speaker: "<Narration>"
    en: "*Click click*"
    ko: 철컥철컥.
    ja: ガチャ、ガチャ
  event_arcanearchive_02_s_32:
    speaker: "<Monologue>"
    en: Arcana jiggles the door handle, but the door doesn't budge.
    ko: 아르카나가 손잡이를 당겼지만, 문은 꿈쩍도 하지 않는다.
    ja: |-
      アルカナはドアノブを引っ張ったが、
      ドアはびくともしない
  event_arcanearchive_02_s_33:
    speaker: arcana
    en: It's locked?
    ko: 잠겨있는데요…?
    ja: 鍵がかかってますね…
  event_arcanearchive_02_s_34:
    speaker: "<Self>"
    en: There's something next to the doorframe.
    ko: "…옆에 뭐 있네."
    ja: "…横に何かあるな"
  event_arcanearchive_02_s_35:
    speaker: arcana
    en: Hmm?
    ko: 오?
    ja: んん？
  event_arcanearchive_02_s_36:
    speaker: "<Monologue>"
    en: Beside the door, a small device the size of a fist is affixed to the wall.
    ko: 문 옆, 벽에는 주먹만 한 장치가 달려 있다.
    ja: ドア横の壁には、こぶし大の機械がついていた
  event_arcanearchive_02_s_37:
    speaker: "<Self>"
    en: It looks like a biometric scanner.
    ko: 생체 인식 장치인 것 같아.
    ja: 生体認証システムのようだな
  event_arcanearchive_02_s_38:
    speaker: arcana
    en: Wow, you can tell that just by looking at it?
    ko: 우와. 보기만 해도 알아요?
    ja: わあ、見ただけで分かるんですか？
  event_arcanearchive_02_s_39:
    speaker: "<Self>"
    en: I've seen something similar a few times before.
    ko: 몇 번 비슷한 걸 본 기억이 있어서.
    ja: 何度か似たようなものを見たことがある
  event_arcanearchive_02_s_40:
    speaker: arcana
    en: "*Gasp*!"
    ko: "…헉!"
    ja: "…ハッ！"
  event_arcanearchive_02_s_41:
    speaker: arcana
    en: Are you an assassin as well?!
    ko: 혹시 그쪽도 암살자?!
    ja: もしや、あなたも殺し屋ですか！？
  event_arcanearchive_02_s_42:
    speaker: "<Self>"
    en: "... I saw it at the Central Government HQ."
    ko: "…중앙 정부에서 본 거야."
    ja: "…中央政府で見たんだ"
  event_arcanearchive_02_s_43:
    speaker: arcana
    en: Oh, right. Phantom told me that you're a commander.
    ko: 맞다. 그쪽, 지휘관이라고 했죠? 팬텀한테 들었어요.
    ja: |-
      あっ、そういえば指揮官なんでしたっけ？
      ファントムから聞きました。
  event_arcanearchive_02_s_44:
    speaker: "<Self>"
    en: Try scanning your fingerprint.
    ko: 응. 우선 지문 인증부터 해봐.
    ja: ああ。まずは指紋認証から試そう
  event_arcanearchive_02_s_45:
    speaker: "<Monologue>"
    en: Following my instructions, Arcana places her finger on the scanner and brings
      her face toward the device.
    ko: 아르카나는 내 말을 따라 인식 장치에 지문을 찍고, 얼굴을 가져다 댔다.
    ja: |-
      アルカナは言われた通り、認証システムに
      指をかざして顔を近づけた
  event_arcanearchive_02_s_46:
    speaker: "<Narration>"
    en: Identification confirmed.
    ko: "[확인되었습니다]"
    ja: "「確認しました」"
  event_arcanearchive_02_s_47:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: ガチャ
  event_arcanearchive_02_s_48:
    speaker: arcana
    en: It opened!
    ko: 아, 열렸다.
    ja: あっ、開いた。
  event_arcanearchive_02_s_49:
    speaker: arcana
    en: Thanks for the tip.
    ko: 알려줘서 고마워요.
    ja: 教えてくれてありがとうございます～
  event_arcanearchive_02_s_50:
    speaker: "<Self>"
    en: No problem. Let's head inside.
    ko: 아냐. 그럼 들어가보자.
    ja: |-
      大したことじゃない。
      よし、さっそく入ろう
  event_arcanearchive_02_s_51:
    speaker: arcana
    en: Wait. Just a moment.
    ko: 네… 앗, 잠깐만요.
    ja: はい…あっ、待ってください。
  event_arcanearchive_02_s_52:
    speaker: arcana
    en: Don't forget our promise.
    ko: 약속했던 거 잊으시면 안 돼요. 알았죠?
    ja: 約束、忘れてませんよね？
  event_arcanearchive_02_s_53:
    speaker: arcana
    en: No making a mess!
    ko: 어지럽히지 말기!
    ja: けっして散らかさないように！
  event_arcanearchive_02_s_54:
    speaker: "<Monologue>"
    en: Upon entering the room, the interior space, to put it charitably, has a "lived-in"
      feel.
    ko: 그렇게 들어간 방은.
    ja: そうして入ったアルカナの仕事部屋は…
  event_arcanearchive_02_s_55:
    speaker: "<Monologue>"
    en: To put it bluntly...
    ko: 좋게 말해 생활감이 있고, 나쁘게 말하면….
    ja: よく言えば生活感があり、悪く言えば…
  event_arcanearchive_02_s_56:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_57:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_58:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_59:
    speaker: "<Monologue>"
    en: It's a total pigsty.
    ko: "…몹시도 어질러진 방이었다."
    ja: "…散らかり放題の部屋だった"
  event_arcanearchive_02_s_60:
    speaker: "<Self>"
    en: Well, I think we can rule out you being an assassin.
    ko: "…일단 암살자가 아닌 건 알겠어."
    ja: "…とりあえず、殺し屋ではないことは分かった"
  event_arcanearchive_02_s_61:
    speaker: arcana
    en: Er... well...
    ko: 아, 음. 그게….
    ja: あ、えっと。その…
  event_arcanearchive_02_s_62:
    speaker: "<Monologue>"
    en: Piles of clothes lie scattered everywhere.
    ko: 이곳저곳에 널브러진 옷가지와,
    ja: あちこちに散乱している服
  event_arcanearchive_02_s_63:
    speaker: "<Monologue>"
    en: Books are stacked up in impossibly high towers.
    ko: 아무렇게나 쌓여 있는 두꺼운 책들.
    ja: 乱雑に積み上げられた分厚い本…
  event_arcanearchive_02_s_64:
    speaker: "<Monologue>"
    en: One entire wall is covered with an array of photos.
    ko: 한쪽 벽면을 빼곡히 메우고 있는 사진들에,
    ja: 壁一面を埋め尽くしている写真に…
  event_arcanearchive_02_s_65:
    speaker: "<Monologue>"
    en: A motley assortment of occult artifacts are peppered throughout the disarray,
      their purpose unclear.
    ko: 용도를 알 수 없는 오컬트 물품들까지.
    ja: |-
      使い道が分からないオカルトグッズと、
      あらゆるもので部屋は混沌と化していた
  event_arcanearchive_02_s_66:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_67:
    speaker: arcana
    en: Maybe...
    ko: 호, 혹시 여기.
    ja: も、もしかしてここって…
  event_arcanearchive_02_s_68:
    speaker: arcana
    en: Maybe this isn't my room?
    ko: 제 방이 아닌 건 아닐까요…?
    ja: 他の人の部屋だったりして…？
  event_arcanearchive_02_s_69:
    speaker: "<Self>"
    en: Those pictures on the wall, are those selfies of you?
    ko: 저기 벽에 붙어 있는 사진들, 전부 아르카나 셀카인데?
    ja: |-
      …あの壁に貼ってある写真は、
      全部アルカナの自撮りだろう？
  event_arcanearchive_02_s_70:
    speaker: arcana
    en: Uh...
    ko: 그, 그게….
    ja: えっと、その～…
  event_arcanearchive_02_s_71:
    speaker: arcana
    en: Wait, I've got it! A thief must have broken in!
    ko: 그래, 도둑! 도둑이 든 거예요!
    ja: |-
      …そう、泥棒！
      きっと泥棒に入られたんですよ！
  event_arcanearchive_02_s_72:
    speaker: arcana
    en: Some dastardly criminal busted in and trashed my room!
    ko: 못된 도둑님! 소중한 내 방을 이렇게 어질러놓다니!
    ja: |-
      まったくもう、泥棒さんったら！
      大切な私の部屋を散らかすなんて！
  event_arcanearchive_02_s_73:
    speaker: "<Self>"
    en: The door was locked, and from the looks of it, can only opened with your biometric
      data.
    ko: "…문이 잠겨있다가 생체 인식으로 열렸잖아."
    ja: 生体認証でドアが開いたが…
  event_arcanearchive_02_s_74:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_75:
    speaker: arcana
    en: A locked-room ransacking, perhaps?
    ko: "…밀실어지름사건?"
    ja: "…密室散らかし事件、とか？"
  event_arcanearchive_02_s_76:
    speaker: phantom
    en: This library is one of the most secure places in the entire Ark.
    ko: 도서관은 방주에서 보안 등급이 가장 높은 곳 중 하나라오.
    ja: |-
      図書館は、アークでセキュリティレベルが
      最も高い場所の一つだ。
  event_arcanearchive_02_s_77:
    speaker: phantom
    en: No run-of-the-mill cat burglar could get in here.
    ko: 좀도둑 같은 건 절대로 들어올 수 없소.
    ja: コソ泥は絶対に入ってこられないだろうな。
  event_arcanearchive_02_s_78:
    speaker: phantom
    en: Only a phantom thief would even have a chance of breaking in.
    ko: 괴도라면 모를까.
    ja: まあ、怪盗ならその限りではないが。
  event_arcanearchive_02_s_79:
    speaker: arcana
    en: "..."
    ko: 으앙.
    ja: ううっ。
  event_arcanearchive_02_s_80:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_81:
    speaker: arcana
    en: "*Ahem*"
    ko: 으흠, 흠.
    ja: オ、オホンッ。
  event_arcanearchive_02_s_82:
    speaker: arcana
    en: Well, doesn't it feel nice and... homey?
    ko: 그, 그래도 사람 사는 것 같고 좋지 않나요?
    ja: で、でも、生活感があっていいですよね！
  event_arcanearchive_02_s_83:
    speaker: phantom
    en: "... I suppose you could say that."
    ko: "…그렇게도 볼 수 있겠소."
    ja: "…まあ、そうとも言えなくもないな。"
  event_arcanearchive_02_s_84:
    speaker: phantom
    en: At least there's no garbage strewn about.
    ko: 일단 쓰레기는 없는 것 같으니.
    ja: ひとまず、ゴミはなさそうだ。
  event_arcanearchive_02_s_85:
    speaker: arcana
    en: Of course there isn't! What do you take me for?
    ko: 다, 당연하죠! 사람을 뭘로 보시는 거예요!
    ja: |-
      も、もちろんです！
      私を何だと思ってるんですか！
  event_arcanearchive_02_s_86:
    speaker: phantom
    en: Having said that, you should really try and put your clothes away properly.
    ko: 그래도 앞으로는 옷을 벗었으면 제대로 정리하는 게 좋겠소.
    ja: |-
      とはいえこれからは、
      脱いだ服はきちんと片づけた方がいい。
  event_arcanearchive_02_s_87:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_88:
    speaker: phantom
    en: And get in the habit of putting books back on the shelf after reading them.
    ko: 책도 읽고 나서 다시 책꽂이에 꽂아 두는 습관을 기르시오.
    ja: |-
      それから、読み終わった本を
      本棚に戻す習慣をつけてくれ。
  event_arcanearchive_02_s_89:
    speaker: phantom
    en: I should mention that you were like this even before you lost your memory.
    ko: 참고로 이건 기억을 잃기 전, 평소에도 그랬었소.
    ja: |-
      ちなみに今言ったことは、
      記憶を失う前からの君の癖だ。
  event_arcanearchive_02_s_90:
    speaker: arcana
    en: "... I see."
    ko: 네, 네에….
    ja: き、気をつけま～す…
  event_arcanearchive_02_s_91:
    speaker: "<Self>"
    en: Forget clues. We need to clean this place up first.
    ko: "…단서고 뭐고, 일단 정리부터 좀 하자."
    ja: "…手がかりは置いといて、まずは片づけよう"
  event_arcanearchive_02_s_92:
    speaker: arcana
    en: W-wait!
    ko: 자, 잠깐만요!
    ja: ま、待ってください！
  event_arcanearchive_02_s_93:
    speaker: arcana
    en: You're already going out of your way to help me. Having you clean my room
      is a step too far.
    ko: 아무리 그래도 도와주시는 분한테 방 청소까지 시킬 수는 없어요.
    ja: |-
      いくら何でも、記憶を取り戻すのを
      手伝ってくださる方に
      お部屋のお掃除まで頼めません！
  event_arcanearchive_02_s_94:
    speaker: arcana
    en: How about you go outside for a moment?
    ko: 잠~시만 나가서 기다려 줄래요?
    ja: |-
      なのでちょ～っとだけ、
      外で待っててくれますか？
  event_arcanearchive_02_s_95:
    speaker: arcana
    en: I'll clean this place up. It won't be long.
    ko: 금방 치울 테니까. 응?
    ja: すぐに片づけますので、ねっ？
  event_arcanearchive_02_s_96:
    speaker: "<Self>"
    en: If you insist.
    ko: "…알았어."
    ja: "…分かった"
  event_arcanearchive_02_s_97:
    speaker: phantom
    en: We'll be in the reading room.
    ko: 열람실에 가 있겠소.
    ja: |-
      ふむ。では、終わるまで
      閲覧室で待っているとするか。
  event_arcanearchive_02_s_98:
    speaker: phantom
    en: Call us when you're fin...
    ko: 끝나면 부르….
    ja: 終わったら呼ん…
  event_arcanearchive_02_s_99:
    speaker: arcana
    en: Uh, actually...
    ko: 저, 저기….
    ja: あ、あの…
  event_arcanearchive_02_s_100:
    speaker: phantom
    en: What's wrong?
    ko: 왜 그러시오?
    ja: どうした？
  event_arcanearchive_02_s_101:
    speaker: arcana
    en: Erm...
    ko: 팬텀은… 그….
    ja: ファントムは…その…
  event_arcanearchive_02_s_102:
    speaker: arcana
    en: Could you actually help me a little, Phantom? Hehe...
    ko: 좀 도와주면 안 될까요? 헤헷.
    ja: お掃除、手伝ってくれませんか？えへっ。
  event_arcanearchive_02_s_103:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_104:
    speaker: phantom
    en: Fine.
    ko: 알겠소.
    ja: ああ、分かった。
  event_arcanearchive_02_s_105:
    speaker: "<Self>"
    en: "... Call me when you're done."
    ko: "…끝나면 불러줘."
    ja: "…終わったら呼んでくれ"
  event_arcanearchive_02_s_106:
    speaker: "<Monologue>"
    en: I spend about 30 minutes in the reading room, perusing various books before
      returning to the Arcana's workshop.
    ko: 30분 정도 열람실에서 책을 읽으며 시간을 때웠다.
    ja: 30分ほど閲覧室で本を読みながら時間を潰した
  event_arcanearchive_02_s_107:
    speaker: "<Self>"
    en: Nothing seems to have changed?
    ko: 별로 달라진 것 같진 않은데…?
    ja: "…あまり変わっていないような…？"
  event_arcanearchive_02_s_108:
    speaker: arcana
    en: What do you mean? I got rid of the clothes, and organized all sorts of stuff!
    ko: 네에? 옷이랑 이거랑 저거 다 정리했잖아요!
    ja: |-
      ええっ？お洋服も、あれもこれも
      ぜーんぶ片づけたじゃないですか！
  event_arcanearchive_02_s_109:
    speaker: phantom
    en: "... I did my best."
    ko: "…나는 최선을 다했소."
    ja: "…私はベストを尽くした。"
  event_arcanearchive_02_s_110:
    speaker: "<Self>"
    en: The table looks exactly like it did before.
    ko: 저건 그대로잖아.
    ja: あの辺りなんか、そのままじゃないか
  event_arcanearchive_02_s_111:
    speaker: "<Monologue>"
    en: As before, the table is cluttered with stacks of cards, a crystal ball, and
      thick, mysterious-looking books.
    ko: |-
      테이블 위에 어수선하게 늘어 놓인 카드 뭉치와 수정구,
      신비로워 보이는 두꺼운 책들이 보인다.
    ja: |-
      視線の先にあるテーブルの上には、
      無造作に置かれたカードの束や水晶玉、
      そして神秘的な雰囲気が漂う厚い本があった
  event_arcanearchive_02_s_112:
    speaker: arcana
    en: Oh, that stuff?
    ko: 아! 저건 말이죠.
    ja: あっ！あれはですね…
  event_arcanearchive_02_s_113:
    speaker: "<Monologue>"
    en: Arcana picks up a deck of cards from the table.
    ko: 아르카나는 테이블 위에 놓인 카드 뭉치를 집어 들었다.
    ja: |-
      アルカナはテーブルの上にある
      カードの束を手に取った
  event_arcanearchive_02_s_114:
    speaker: arcana
    en: While we were cleaning, these brought back memories.
    ko: 방 정리하면서 하나는 기억났거든요.
    ja: |-
      お部屋を片づけながら、
      1つ思い出したことがあるんです。
  event_arcanearchive_02_s_115:
    speaker: "<Choice>"
    en: What are they?
    ko: 뭔데?
    ja: それは何だ？
  event_arcanearchive_02_s_116:
    speaker: "<Choice>"
    en: Tarot cards?
    ko: 타로 카드?
    ja: タロットカード？
  event_arcanearchive_02_s_117:
    speaker: arcana
    en: Tarot cards.
    ko: 타로 카드.
    ja: ふふ、タロットカードです。
  event_arcanearchive_02_s_118:
    speaker: arcana
    en: Oh, so you're familiar?
    ko: 오? 아시네요?
    ja: あら？ご存じなんですか？
  event_arcanearchive_02_s_119:
    speaker: "<Self>"
    en: I know they're tarot cards, but that's about it.
    ko: 그냥 그게 타로라는 것만 알아.
    ja: ああ。詳しくはないが…
  event_arcanearchive_02_s_120:
    speaker: "<Monologue>"
    en: Arcana skillfully shuffles the deck.
    ko: 아르카나는 능숙하게 카드를 섞었다.
    ja: |-
      アルカナが慣れた手さばきで
      カードをシャッフルした
  event_arcanearchive_02_s_121:
    speaker: arcana
    en: Correct me if I'm wrong,
    ko: 제… 부업이라고 해야 할까?
    ja: 私の…副業とでも言いましょうか。
  event_arcanearchive_02_s_122:
    speaker: arcana
    en: but I'm pretty sure I used to do tarot readings as a side gig?
    ko: 타로점을 봐주곤 했던 것 같아요. 그렇죠?
    ja: |-
      タロット占いをしてたようなんです。
      ですよね？
  event_arcanearchive_02_s_123:
    speaker: phantom
    en: That's correct.
    ko: 맞소.
    ja: そうだ。
  event_arcanearchive_02_s_124:
    speaker: phantom
    en: You even ran a small fortune-telling shop in the Ark.
    ko: 방주 시내에서 작은 점집도 운영하고 있었지.
    ja: |-
      アルカナは、アークの市街地で
      小さな占い屋も経営していたんだ。
  event_arcanearchive_02_s_125:
    speaker: arcana
    en: What?!
    ko: 네에?
    ja: ええっ？
  event_arcanearchive_02_s_126:
    speaker: arcana
    en: This is huge! Why are you only telling me this now?
    ko: 그런 중요한 걸 왜 이제야 말해주시는 거예요!
    ja: |-
      そんな大事な情報、
      どうして今まで黙ってたんですか！？
  event_arcanearchive_02_s_127:
    speaker: phantom
    en: I did. I told you about five times earlier.
    ko: 아까 다섯 번 정도 말해줬었소.
    ja: もう5回は言ったはずだが…
  event_arcanearchive_02_s_128:
    speaker: arcana
    en: Oh. Sorry.
    ko: 죄송합니닷.
    ja: えっ！？す、すみませんっ。
  event_arcanearchive_02_s_129:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_130:
    speaker: phantom
    en: Still, at least you're remembering things, even if it isn't at the fastest
      pace.
    ko: 그래도 차츰 기억이 돌아오는 것 같아서 다행이오.
    ja: |-
      それでも、少しずつ記憶を
      取り戻しているようだな。
  event_arcanearchive_02_s_131:
    speaker: phantom
    en: Do you remember anything else?
    ko: 또 기억 난 건 없소?
    ja: 他には何か思い出せないか？
  event_arcanearchive_02_s_132:
    speaker: arcana
    en: Not yet.
    ko: 음… 아직 없는 것 같아요.
    ja: うーん…特に何も…
  event_arcanearchive_02_s_133:
    speaker: arcana
    en: Just...
    ko: 그냥….
    ja: ただ…
  event_arcanearchive_02_s_134:
    speaker: "<Monologue>"
    en: Arcana flips over a card and carefully places it on the table.
    ko: 아르카나가 카드 한 장을 뒤집어 살포시 테이블에 내려놓았다.
    ja: |-
      アルカナはカードを1枚めくり、
      そっとテーブルの上に置いた
  event_arcanearchive_02_s_135:
    speaker: arcana
    en: I do remember that before heading to work, I would do a reading for myself.
    ko: 일하기 전에 한 번씩, 스스로 점을 치곤 했다는 것 정도만….
    ja: |-
      仕事を始める前に、たまに
      自分のことを占っていたような気が…
  event_arcanearchive_02_s_136:
    speaker: "<Monologue>"
    en: On the card, it reads "Death".
    ko: 카드에는 [DEATH]라고 쓰여있다.
    ja: カードには「DEATH」と書かれていた
  event_arcanearchive_02_s_137:
    speaker: "<Self>"
    en: Death?
    ko: 죽음?
    ja: 死神？
  event_arcanearchive_02_s_138:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_139:
    speaker: "<Choice>"
    en: What does it mean?
    ko: 이건 무슨 뜻이야?
    ja: これはどういう意味なんだ？
  event_arcanearchive_02_s_140:
    speaker: "<Choice>"
    en: I take it that's a bad sign?
    ko: 안 좋은 뜻 같은데?
    ja: 死神って…悪い意味じゃないのか？
  event_arcanearchive_02_s_141:
    speaker: arcana
    en: Well...
    ko: "…그게 말이죠."
    ja: えっと…
  event_arcanearchive_02_s_142:
    speaker: "<Monologue>"
    en: Arcana hesitates for a while.
    ko: 아르카나는 한동안 뜸을 들이다가,
    ja: アルカナはしばらく間を置いたのち
  event_arcanearchive_02_s_143:
    speaker: arcana
    en: It means...
    ko: 그건….
    ja: これはぁ…
  event_arcanearchive_02_s_144:
    speaker: "<Monologue>"
    en: After a few moments, she utters something which takes me aback.
    ko: "…충격적인 대답을 내놓았다."
    ja: "…衝撃的な答えを出した"
  event_arcanearchive_02_s_145:
    speaker: arcana
    en: I... I have no idea what it means.
    ko: 모르겠어요!
    ja: 分かりません！
  event_arcanearchive_02_s_146:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_s_147:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
event_arcanearchive_02_e:
  event_arcanearchive_02_e_1:
    speaker: "<Narration>"
    en: 15 minutes later.
    ko: 15분 뒤.
    ja: 15分後
  event_arcanearchive_02_e_2:
    speaker: "<Monologue>"
    en: After flipping through one of the formidable tomes for a while, Arcana suddenly
      lifts her head.
    ko: 한참 동안 두꺼운 책을 뒤적이던 아르카나가 고개를 들었다.
    ja: |-
      しばらく分厚い本とにらめっこしていた
      アルカナがようやく顔を上げた
  event_arcanearchive_02_e_3:
    speaker: arcana
    en: I found it!
    ko: 찾았다!
    ja: あった！
  event_arcanearchive_02_e_4:
    speaker: arcana
    en: The upright Death card,
    ko: 흠흠. 그러니까….
    ja: ふむふむ…なるほど…
  event_arcanearchive_02_e_5:
    speaker: arcana
    en: despite its ominous appearance,
    ko: 정방향 죽음 카드는 불길해 보이는 느낌과는 달리.
    ja: |-
      正位置の死神は、
      不吉そうなイメージとは異なり…
  event_arcanearchive_02_e_6:
    speaker: arcana
    en: in fact signifies new beginnings and rebirth.
    ko: 새로운 시작과 재탄생을 뜻하는 긍정적인 의미가 강하며….
    ja: |-
      新しい始まりや生まれ変わりを暗示する
      ポジティブな意味合いが強く…
  event_arcanearchive_02_e_7:
    speaker: "<Self>"
    en: Phantom.
    ko: 저기, 팬텀.
    ja: "…ファントム"
  event_arcanearchive_02_e_8:
    speaker: phantom
    en: Yes?
    ko: 듣고 있소.
    ja: 何だ？
  event_arcanearchive_02_e_9:
    speaker: "<Self>"
    en: Do tarot readings usually involve reading from a book?
    ko: 타로란 게 원래 책을 보고 읽어주는 거야?
    ja: |-
      タロット占いって、
      本を見ながら解説するものなのか？
  event_arcanearchive_02_e_10:
    speaker: phantom
    en: Pretty sure that's a no.
    ko: "…물론 아니오."
    ja: "…そんなわけないだろう？"
  event_arcanearchive_02_e_11:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_e_12:
    speaker: phantom
    en: This is worse than I thought.
    ko: 후우… 내가 생각했던 것보다 훨씬 더 중증이오.
    ja: ふぅ…私が思っていたよりずっと重症のようだ。
  event_arcanearchive_02_e_13:
    speaker: phantom
    en: I really made the right choice asking for your help.
    ko: 그대에게 부탁하길 정말 잘한 것 같소.
    ja: やはり、君に頼んで正解だった。
  event_arcanearchive_02_e_14:
    speaker: "<Self>"
    en: You think so?
    ko: 역시 그런 거지?
    ja: そう思うか？
  event_arcanearchive_02_e_15:
    speaker: phantom
    en: Yeah.
    ko: 그렇소.
    ja: ああ。
  event_arcanearchive_02_e_16:
    speaker: phantom
    en: I can't believe she completely forgot about tarot. That's one of her favorite
      things!
    ko: 그렇게 좋아하던 타로까지 완전히 잊었을 줄은….
    ja: |-
      あんなに好きだったタロット占いまで
      忘れてしまうとは…
  event_arcanearchive_02_e_17:
    speaker: "<Self>"
    en: I'm not so concerned about that.
    ko: "…그게 아니라,"
    ja: "…いや、それは…"
  event_arcanearchive_02_e_18:
    speaker: "<Self>"
    en: What I want to know is... has she always been like this, personality-wise?
    ko: 원래 저런 성격인지….
    ja: 元からああいう感じなのでは…？
  event_arcanearchive_02_e_19:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 띠링-
    ja: プルル…
  event_arcanearchive_02_e_20:
    speaker: phantom
    en: Sorry, I've got to take this.
    ko: 미안하오. 잠시 실례하겠소.
    ja: すまない。少し失礼する。
  event_arcanearchive_02_e_21:
    speaker: "<Self>"
    en: Go ahead.
    ko: 응. 괜찮아.
    ja: ああ、どうぞ
  event_arcanearchive_02_e_22:
    speaker: "<Monologue>"
    en: Phantom leaves the room with her phone in hand.
    ko: 팬텀은 핸드폰을 들고 방 밖으로 나갔다.
    ja: ファントムは携帯電話を持って部屋を出た
  event_arcanearchive_02_e_23:
    speaker: arcana
    en: "... So, in conclusion."
    ko: "…그러니까 결론적으로!"
    ja: "…つまり、ここから導き出される結論は！"
  event_arcanearchive_02_e_24:
    speaker: arcana
    en: I'm bubbly and approachable on the outside,
    ko: 저는 겉으로는 이렇게나 예쁘고 활기차지만!
    ja: |-
      私は、見た目こそ
      こんなにキレイで明るいけれど！
  event_arcanearchive_02_e_25:
    speaker: arcana
    en: but inside, I'm a cold, ruthless, and sophisticated professional.
    ko: 속은 냉정냉혹세련된, 프로페셔널한 사람이라는 거죠!
    ja: |-
      中身はクールでスマートで
      プロフェッショナルということです！
  event_arcanearchive_02_e_26:
    speaker: arcana
    en: Voila!
    ko: 와아~ 짝짝짝!
    ja: わあ～パチパチパチ！
  event_arcanearchive_02_e_27:
    speaker: "<Self>"
    en: I see.
    ko: 그, 그렇구나.
    ja: そ、そうか
  event_arcanearchive_02_e_28:
    speaker: arcana
    en: Would you like me to give you a reading?
    ko: 그쪽도 봐드릴까요?
    ja: |-
      ふふん、よければあなたのことも
      占いましょうか？
  event_arcanearchive_02_e_29:
    speaker: "<Self>"
    en: No th...
    ko: 나는 괜찮….
    ja: いや、私は大丈…
  event_arcanearchive_02_e_30:
    speaker: "<Monologue>"
    en: Outside the room, I can faintly hear Phantom on the phone.
    ko: 통화를 하는 건지, 문밖에서 팬텀의 목소리가 옅게 들려오고 있다.
    ja: |-
      通話中なのか、ドアの外からファントムの声が
      わずかに聞こえてきた
  event_arcanearchive_02_e_31:
    speaker: "<Self>"
    en: Actually, we may have to wait for Phantom, so go ahead.
    ko: 아니다. 어차피 기다려야 할 것 같으니 봐줘.
    ja: |-
      …いや、ファントムの用事が終わるまで
      まだ時間がかかりそうだから、占ってくれ
  event_arcanearchive_02_e_32:
    speaker: arcana
    en: Excellent!
    ko: 잘 생각하셨어요.
    ja: ふふ、賢明な判断ですね。
  event_arcanearchive_02_e_33:
    speaker: arcana
    en: Even if it's not always 100% accurate, fortune-telling can still be quite
      useful.
    ko: |-
      이 점이라는 게 말이죠,
      꼭 들어맞지 않더라도 은근히 도움이 되거든요.
    ja: |-
      占いというのはですね、
      正確に当たらなくても意外と役に立つんですよ。
  event_arcanearchive_02_e_34:
    speaker: arcana
    en: You could consider it a form of advice.
    ko: 일종의 카운셀링이랄까?
    ja: 一種のカウンセリングみたいな？
  event_arcanearchive_02_e_35:
    speaker: "<Monologue>"
    en: Arcana shuffles the deck and spreads the cards across the table.
    ko: 아르카나는 카드를 섞은 뒤, 테이블 위에 촤르륵 펼쳤다.
    ja: |-
      アルカナはカードをシャッフルした後、
      テーブルの上にざっと広げた
  event_arcanearchive_02_e_36:
    speaker: arcana
    en: Now, select three cards.
    ko: 자. 세 장 뽑아 보세요.
    ja: では、ここから3枚引いてください。
  event_arcanearchive_02_e_37:
    speaker: "<Monologue>"
    en: I reach out, draw three cards, then flip them over.
    ko: 손이 가는 대로 카드 세 장을 뽑아 뒤집었다.
    ja: 気の向くままにカードを3枚選んでめくった
  event_arcanearchive_02_e_38:
    speaker: arcana
    en: Emperor, Wheel of Fortune, and a reversed Hanged Man.
    ko: "[황제], [운명의 수레바퀴], 역방향 [매달린 사람]…."
    ja: |-
      「皇帝」、「運命の輪」、
      逆位置の「吊るされた男」…
  event_arcanearchive_02_e_39:
    speaker: "<Monologue>"
    en: Arcana looks at the cards, blinking vacantly.
    ko: 아르카나는 카드를 보고 잠시 눈을 깜빡였다.
    ja: アルカナはカードを見てまばたきをした
  event_arcanearchive_02_e_40:
    speaker: "<Self>"
    en: Do you need a moment to consult the book?
    ko: 책 봐야되면 잠깐 기다려줄까?
    ja: "…本を確認してもらっても構わないぞ"
  event_arcanearchive_02_e_41:
    speaker: arcana
    en: N-no! I remember!
    ko: 이, 이제 다 기억났거든요?!
    ja: も、もう全部思い出したので大丈夫です！
  event_arcanearchive_02_e_42:
    speaker: arcana
    en: Hm...
    ko: 음….
    ja: うーん…
  event_arcanearchive_02_e_43:
    speaker: arcana
    en: You have had a few things on your mind as of late.
    ko: 그쪽, 요새 고민이 좀 있네요?
    ja: 最近、悩みごとがあるようですね？
  event_arcanearchive_02_e_44:
    speaker: "<Choice>"
    en: "..!"
    ko: "……!!"
    ja: "……！！"
  event_arcanearchive_02_e_45:
    speaker: "<Choice>"
    en: That could apply to anyone.
    ko: 고민이야 다들 있지 뭐.
    ja: 悩みくらい、誰にでもあるだろう？
  event_arcanearchive_02_e_46:
    speaker: arcana
    en: It seems that you are struggling especially with human interaction.
    ko: 특히 사람 문제로 힘들어하고 있는 것 같고요.
    ja: 特に、人間関係で苦しんでいますね。
  event_arcanearchive_02_e_47:
    speaker: "<Choice>"
    en: Wha... How did you know that?
    ko: 어, 어떻게 알았어?
    ja: ど、どうして分かったんだ？
  event_arcanearchive_02_e_48:
    speaker: "<Choice>"
    en: Once again, this is all pretty general...
    ko: 사회생활 하면 보통 사람 문제로 힘들지.
    ja: |-
      …社会生活をしていたら、
      人間関係の悩みくらいあるだろう？
  event_arcanearchive_02_e_49:
    speaker: arcana
    en: Hehe, I know everything.
    ko: 후후. 저는 다 알고 있어요.
    ja: ふふ、私にはすべてお見通しです。
  event_arcanearchive_02_e_50:
    speaker: arcana
    en: Mmm, very true.
    ko: 음음. 그렇죠.
    ja: うーん、そうですねぇ…
  event_arcanearchive_02_e_51:
    speaker: arcana
    en: And...
    ko: 그리고….
    ja: それから…
  event_arcanearchive_02_e_52:
    speaker: arcana
    en: You recently parted ways with someone precious to you.
    ko: 소중한 사람과 헤어졌군요.
    ja: 最近、大切な人と別れていますね。
  event_arcanearchive_02_e_53:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_arcanearchive_02_e_54:
    speaker: arcana
    en: Surface... Battle... Struggle...
    ko: 지상… 전투… 투쟁….
    ja: 地上…戦闘…闘争…
  event_arcanearchive_02_e_55:
    speaker: arcana
    en: You have been fighting ceaselessly all this time, without reprieve.
    ko: 당신은 지금까지 끝없이 싸워왔어요.
    ja: あなたは今まで、何度も戦ってきました。
  event_arcanearchive_02_e_56:
    speaker: "<Self>"
    en: Arcana? Are you okay?
    ko: 아르카나? 괜찮은….
    ja: "…アルカナ？大丈…"
  event_arcanearchive_02_e_57:
    speaker: arcana
    en: Chatterbox.
    ko: "…토커티브."
    ja: "…トーカティブ。"
  event_arcanearchive_02_e_58:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_02_e_59:
    speaker: arcana
    en: Nihilister, Indivilia.
    ko: 니힐리스타, 인디빌리아.
    ja: ニヒリスター、インディビリア。
  event_arcanearchive_02_e_60:
    speaker: arcana
    en: Countless enemies whom you have defeated.
    ko: 그리고 그 외에도, 당신은 수많은 적들을 쓰러뜨렸지만.
    ja: |-
      そして、その他にも
      あなたは多くの敵を倒しましたが…
  event_arcanearchive_02_e_61:
    speaker: arcana
    en: However,
    ko: 앞으로도 이보다 더 강대한 적들이….
    ja: これからもさらなる強敵が…
  event_arcanearchive_02_e_62:
    speaker: arcana
    en: even stronger foes will stand in your way going forward.
    ko: 당신의 앞을 가로막겠죠.
    ja: あなたの前に立ちはだかるでしょう。
  event_arcanearchive_02_e_63:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_e_64:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_e_65:
    speaker: arcana
    en: Current data shows your success rate in battle as 82%.
    ko: 현재까지의 기록상, 지휘관 @UserName의 승률은 82%.
    ja: 今までの記録から、あなたの勝率は82％。
  event_arcanearchive_02_e_66:
    speaker: arcana
    en: If we exclude tactical retreats and successful withdrawals,
    ko: 작전상 후퇴 및 성공적인 철수를 제외할 경우….
    ja: |-
      戦略的撤退および
      撤収に成功したケースをのぞくと…
  event_arcanearchive_02_e_67:
    speaker: arcana
    en: 100%.
    ko: "…100%."
    ja: "…100％。"
  event_arcanearchive_02_e_68:
    speaker: arcana
    en: After analyzing your combat records from your initial commission to your latest
      mission,
    ko: 임관부터 최종 업데이트 시점까지의 데이터를 근거로 계산한.
    ja: |-
      指揮官就任から最終アップデート時点までの
      データに基づいて計算した…
  event_arcanearchive_02_e_69:
    speaker: arcana
    en: your future is...
    ko: 당신의 미래는….
    ja: あなたの未来は…
  event_arcanearchive_02_e_70:
    speaker: arcana
    en: Urgh!
    ko: "…아윽."
    ja: "…ううっ。"
  event_arcanearchive_02_e_71:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_02_e_72:
    speaker: "<Monologue>"
    en: Arcana staggers back, clutching her head. I reach out to support her.
    ko: 머리를 짚으며 비틀거리는 아르카나를 부축했다.
    ja: 頭を抱えながらふらつくアルカナを支えた
  event_arcanearchive_02_e_73:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_e_74:
    speaker: arcana
    en: Huh...?
    ko: 아…?
    ja: あれ…？
  event_arcanearchive_02_e_75:
    speaker: "<Self>"
    en: Are you okay?
    ko: 괜찮아?
    ja: 大丈夫か？
  event_arcanearchive_02_e_76:
    speaker: arcana
    en: Oh, yes...
    ko: 아, 네…
    ja: あ、はい…
  event_arcanearchive_02_e_77:
    speaker: arcana
    en: I just got a little dizzy all of a sudden.
    ko: 그냥 갑자기 좀 어지러워져서….
    ja: 急にめまいがして…
  event_arcanearchive_02_e_78:
    speaker: "<Monologue>"
    en: With her head resting against my shoulder, Arcana looks up at me.
    ko: 어깨에 머리를 기대고 있던 아르카나가 나를 올려다봤다.
    ja: |-
      私の肩にもたれかかっていたアルカナが、
      ふと顔を上げた
  event_arcanearchive_02_e_79:
    speaker: arcana
    en: Hey.
    ko: 있죠.
    ja: あの…
  event_arcanearchive_02_e_80:
    speaker: arcana
    en: Doesn't this make me seem like a fragile damsel in distress?
    ko: 이러니까 저, 병약 미소녀 같지 않아요?
    ja: |-
      …こうしていると、
      なんだか病弱な美少女みたいですね？
  event_arcanearchive_02_e_81:
    speaker: "<Choice>"
    en: Fragile?
    ko: "…병약?"
    ja: "…病弱？"
  event_arcanearchive_02_e_82:
    speaker: "<Choice>"
    en: Like a princess?
    ko: "…소녀?"
    ja: "…少女？"
  event_arcanearchive_02_e_83:
    speaker: arcana
    en: Yeah. You know, fair maidens of delicate constitution who are prone to fainting
      daintily and the like.
    ko: 네. 현기증 나서 아아~ 하고 쓰러지고 막.
    ja: はい。めまいがして、ああ～って倒れて。
  event_arcanearchive_02_e_84:
    speaker: arcana
    en: When did I ever say princess?
    ko: 제가 언제 소녀라고 했어요?
    ja: もうっ、私がいつ「少女」って言いました？
  event_arcanearchive_02_e_85:
    speaker: arcana
    en: I said damsel.
    ko: 미소녀라고 했지.
    ja: "「美少女」って言いましたよね？"
  event_arcanearchive_02_e_86:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_02_e_87:
    speaker: arcana
    en: At any rate, thanks for keeping me upright.
    ko: 그래도 고마워요, 부축해 줘서.
    ja: |-
      でも、ありがとうございます。
      とっさに支えてくださって。
  event_arcanearchive_02_e_88:
    speaker: arcana
    en: I'm fine now.
    ko: 이제 괜찮아.
    ja: もう大丈夫ですので。
  event_arcanearchive_02_e_89:
    speaker: "<Self>"
    en: What in the world just happened?
    ko: "…아르카나. 방금 전에 뭐였어?"
    ja: "…アルカナ。さっきのは何だったんだ？"
  event_arcanearchive_02_e_90:
    speaker: arcana
    en: What do you mean?
    ko: 네? 뭐가요?
    ja: はい？何のことですか？
  event_arcanearchive_02_e_91:
    speaker: arcana
    en: Did I make your heart flutter?
    ko: 혹시 두근거렸어요?
    ja: |-
      あっ！もしかして、
      ドキッとしちゃいましたか？
  event_arcanearchive_02_e_92:
    speaker: "<Self>"
    en: You certainly did, but not for the reason you're thinking.
    ko: 다른 의미로 두근거리기는 했는데….
    ja: 別の意味でドキッとしたが…
  event_arcanearchive_02_e_93:
    speaker: arcana
    en: "??"
    ko: "??"
    ja: "？？"
  event_arcanearchive_02_e_94:
    speaker: "<Monologue>"
    en: It seems Arcana has no memory of what just transpired.
    ko: "…아무래도 아르카나는 방금 전의 일을 기억하지 못하는 것 같다."
    ja: |-
      …どうやら、アルカナは先ほどの出来事を
      覚えていないようだ
  event_arcanearchive_02_e_95:
    speaker: phantom
    en: Did something happen?
    ko: 무슨 일 있었소?
    ja: 何かあったのか？
  event_arcanearchive_02_e_96:
    speaker: "<Self>"
    en: No, it's nothing.
    ko: "…아니. 별일 없었어."
    ja: "…いや、何でもない"
  event_arcanearchive_02_e_97:
    speaker: "<Self>"
    en: What was the call about?
    ko: 무슨 전화였어?
    ja: 何の電話だったんだ？
  event_arcanearchive_02_e_98:
    speaker: phantom
    en: "..."
    ko: "…그게 말이오."
    ja: "…それがだね。"
  event_arcanearchive_02_e_99:
    speaker: phantom
    en: I don't think I can leave the library unattended any longer.
    ko: 더 이상 도서관을 비워두기는 힘들 것 같소.
    ja: これ以上、持ち場を離れるのは難しいようだ。
  event_arcanearchive_02_e_100:
    speaker: "<Self>"
    en: So it was regarding work?
    ko: 일 관련한 연락이었구나?
    ja: 仕事関係の連絡だったのか
  event_arcanearchive_02_e_101:
    speaker: phantom
    en: Indeed it was.
    ko: 그렇소.
    ja: ああ。
  event_arcanearchive_02_e_102:
    speaker: phantom
    en: So I was wondering...
    ko: 그래서 말이오만….
    ja: そこでなのだが…
  event_arcanearchive_02_e_103:
    speaker: "<Self>"
    en: Don't worry. Leave it to me.
    ko: 알았어. 이제 나한테 맡겨둬.
    ja: 分かった。あとは私に任せてくれ
  event_arcanearchive_02_e_104:
    speaker: phantom
    en: Thank you.
    ko: "…정말 고맙소."
    ja: "…本当にありがとう。"
  event_arcanearchive_02_e_105:
    speaker: phantom
    en: If you need help with anything, you can contact me anytime.
    ko: 그래도 뭔가 도움이 필요하면 언제든 연락하시오.
    ja: |-
      もし困ったことがあったら、
      いつでも連絡してくれ。
  event_arcanearchive_02_e_106:
    speaker: "<Self>"
    en: Will do.
    ko: 응.
    ja: ああ
  event_arcanearchive_02_e_107:
    speaker: "<Self>"
    en: Let's head out of here for now, Arcana.
    ko: 아르카나. 일단 나가자.
    ja: アルカナ、とりあえず出よう
  event_arcanearchive_02_e_108:
    speaker: arcana
    en: Okay.
    ko: 앗, 네.
    ja: あっ、はい。
  event_arcanearchive_02_e_109:
    speaker: phantom
    en: What do you plan on doing now?
    ko: 이제 어떻게 할 생각이시오?
    ja: これからどうするつもりだ？
  event_arcanearchive_02_e_110:
    speaker: "<Self>"
    en: First off...
    ko: 일단….
    ja: ひとまず…
  event_arcanearchive_02_e_111:
    speaker: "<Self>"
    en: I think we need to have you get a thorough examination.
    ko: "…정밀 검사를 좀 받아봐야 할 것 같아."
    ja: "…精密検査を受けた方がよさそうだ"
event_arcanearchive_03_s:
  event_arcanearchive_03_s_1:
    speaker: "<Monologue>"
    en: Despite Arcana grumbling about how she is fine, I insist on taking her to
      the hospital.
    ko: 자기는 정상이라며 투덜대는 아르카나를 데리고 병원에 도착했다.
    ja: |-
      問題ないと言い張るアルカナを連れ、
      病院にやってきた
  event_arcanearchive_03_s_2:
    speaker: "<Monologue>"
    en: After having her go through a medical examination, I head into the consultation
      room to hear the results from Mary.
    ko: 바로 정밀 검사를 받게 한 뒤, 진료실에서 메어리와 마주 앉았다.
    ja: |-
      すぐに精密検査を受けさせたあと、
      診察室でメアリーと対面した
  event_arcanearchive_03_s_3:
    speaker: "<Self>"
    en: How'd it go?
    ko: 결과는 어때?
    ja: 結果はどうだ？
  event_arcanearchive_03_s_4:
    speaker: mary
    en: You say you're potentially suffering permanent memory loss due to repeated
      memory wipes?
    ko: 거듭된 기억 소거로 인한 기억 상실… 이라고 하셨죠?
    ja: 度重なる記憶消去による記憶喪失…でしたよね？
  event_arcanearchive_03_s_5:
    speaker: arcana
    en: That's what we think, yes.
    ko: 아마도요?
    ja: おそらく…？
  event_arcanearchive_03_s_6:
    speaker: mary
    en: There is a high chance that your memories will return.
    ko: 일단… 당장은 곧 기억이 돌아올 가능성이 높아 보여요.
    ja: |-
      とりあえず…今のところは
      すぐに記憶が戻る可能性が高いと思います。
  event_arcanearchive_03_s_7:
    speaker: mary
    en: Wouldn't you say that
    ko: 아르카나. 처음 정신이 들었을 때.
    ja: アルカナ。最初に気がついた時…
  event_arcanearchive_03_s_8:
    speaker: mary
    en: you remember more now than you did when you first regained consciousness?
    ko: |-
      그러니까, [본인이 기억을 잃었다는 것]을 인지했을 때보다는
      더 많이 기억나지 않으셨나요?
    ja: |-
      …つまり、「記憶を失っている」と
      認識した時よりは記憶が戻っているのですよね？
  event_arcanearchive_03_s_9:
    speaker: arcana
    en: I think so.
    ko: 그런 것 같아요.
    ja: そうみたいですね。
  event_arcanearchive_03_s_10:
    speaker: arcana
    en: Some stuff about tarot is also coming back to me.
    ko: 조금 전에 타로 관련한 것도 조금 기억났고요.
    ja: |-
      さっき、タロット占いに関することも
      少し思い出しましたので。
  event_arcanearchive_03_s_11:
    speaker: mary
    en: All right. Now, if I could direct your attention to this.
    ko: 네. 여기 보시면.
    ja: |-
      分かりました。
      では、こちらを見てください。
  event_arcanearchive_03_s_12:
    speaker: "<Monologue>"
    en: Mary points at the monitor.
    ko: 메어리가 모니터를 가리켰다.
    ja: メアリーがモニターを指さした
  event_arcanearchive_03_s_13:
    speaker: mary
    en: Your brainwave activity and neural responses are returning to normal.
    ko: 뇌파 및 뇌세포의 활성도가 정상치로 돌아오고 있어요.
    ja: |-
      脳波と脳細胞の活性度は、
      すでに正常値に戻っています。
  event_arcanearchive_03_s_14:
    speaker: mary
    en: The NIMPH also appears to be reacting accordingly to those changes, so I think
      you will be okay.
    ko: NIMPH도 그에 맞춰 반응하고 있는 걸로 보이니까, 곧 괜찮아질 거예요.
    ja: |-
      NIMPHもそれに合わせて反応しているので、
      じきによくなるかと。
  event_arcanearchive_03_s_15:
    speaker: arcana
    en: Okay...
    ko: 네에….
    ja: なるほど…
  event_arcanearchive_03_s_16:
    speaker: mary
    en: One more thing. You said you visited your old room, yes?
    ko: 또, 원래 지내던 방에 가보셨다고 하셨죠?
    ja: それから、仕事部屋に行かれたんですよね？
  event_arcanearchive_03_s_17:
    speaker: mary
    en: Being in familiar locations like that and engaging in activities you did before
      are effective methods for regaining your memories.
    ko: |-
      그렇게 익숙한 장소나, 자주 하던 일을 해보는 건,
      기억을 되살리는 좋은 방법 중 하나에요.
    ja: |-
      なじみのある場所に行ったり、
      普段の行動を模倣したりするのは
      記憶を取り戻すうえでいいアプローチです。
  event_arcanearchive_03_s_18:
    speaker: mary
    en: Keep at it, but be careful not to overdo it.
    ko: 무리하지 않는 선에서 계속해 보세요.
    ja: 無理のない程度に続けてみてください～
  event_arcanearchive_03_s_19:
    speaker: arcana
    en: I knew it!
    ko: "…역시."
    ja: ふっふっふっ…どうですか？
  event_arcanearchive_03_s_20:
    speaker: arcana
    en: You see?
    ko: 봤죠?
    ja: すごいでしょう？
  event_arcanearchive_03_s_21:
    speaker: "<Self>"
    en: Phantom was the one who suggested going to that room, not you.
    ko: "…방에는 팬텀이 가자고 했었잖아."
    ja: "…部屋に行こうと言ったのはファントムだ"
  event_arcanearchive_03_s_22:
    speaker: arcana
    en: "... Hehe."
    ko: 헤헷.
    ja: えへっ。
  event_arcanearchive_03_s_23:
    speaker: mary
    en: However.
    ko: "…다만."
    ja: "…ただし。"
  event_arcanearchive_03_s_24:
    speaker: mary
    en: This might be the last time where you'll have a chance to return to normal.
    ko: 이번이 마지막일 수도 있어요. [정상]으로 돌아오는 건.
    ja: |-
      「正常」に戻るのは、
      今回が最後かもしれません。
  event_arcanearchive_03_s_25:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_26:
    speaker: "<Self>"
    en: Could you explain that in more detail?
    ko: "…자세히 설명해 줄 수 있어?"
    ja: "…詳しく説明してくれないか？"
  event_arcanearchive_03_s_27:
    speaker: mary
    en: We have a case in our database of another patient with similar symptoms.
    ko: 과거에 비슷한 증상을 보였던 환자분의 기록이 데이터베이스에 남아 있어요.
    ja: |-
      似た症状の患者の記録が
      データベースに残っていました。
  event_arcanearchive_03_s_28:
    speaker: "<Monologue>"
    en: Mary turns the monitor so that we can see.
    ko: 메어리는 우리가 볼 수 있도록 모니터를 돌렸다.
    ja: |-
      メアリーは私たちに見えるように
      モニターの向きを変えた
  event_arcanearchive_03_s_29:
    speaker: mary
    en: After experiencing intermittent memory loss,
    ko: 간헐적 기억 상실 증세를 보이다,
    ja: |-
      記録によると、その患者は
      ときおり記憶喪失になり…
  event_arcanearchive_03_s_30:
    speaker: mary
    en: she eventually suffered a complete and total loss of memory.
    ko: 종국에는 아무것도 기억하지 못하는 백지 상태가 되어 버렸고,
    ja: |-
      最終的に、何も記憶できない
      白紙状態になったそうです。
  event_arcanearchive_03_s_31:
    speaker: mary
    en: The test results indicated that her NIMPH had been reset,
    ko: 검사 결과, NIMPH가 초기화 된 것으로 파악.
    ja: 検査の結果、NIMPHが初期化したと判明。
  event_arcanearchive_03_s_32:
    speaker: mary
    en: the cause of which was
    ko: 그리고 그 원인은….
    ja: そして、その原因は…
  event_arcanearchive_03_s_33:
    speaker: mary
    en: excessively frequent memory wipes.
    ko: "…잦은 빈도의 기억 소거로 추정."
    ja: |-
      …度重なる記憶消去によるものと
      推定されました。
  event_arcanearchive_03_s_34:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_35:
    speaker: mary
    en: When repeatedly exposed to certain stimuli, the brain adapts and becomes accustomed
      to them.
    ko: "…반복되는 자극과 경험에는 결국 익숙해지고, 적응하기 마련이죠."
    ja: |-
      …繰り返される刺激や経験には、
      いずれ慣れて適応してしまうものです。
  event_arcanearchive_03_s_36:
    speaker: mary
    en: NIMPH functions in the same fashion.
    ko: 그건 작용 기제가 뇌와 유사한 NIMPH도 마찬가지예요.
    ja: |-
      そしてそれは、
      脳と似た仕組みのNIMPHも同様です。
  event_arcanearchive_03_s_37:
    speaker: mary
    en: The NIMPH mistakenly registers an absence of memory as the default state.
      As normal.
    ko: NIMPH는 [기억이 없는 상태]가 정상이라고 착각하게 되고,
    ja: |-
      NIMPHは「記憶がない状態」こそが
      正常だと錯覚すると…
  event_arcanearchive_03_s_38:
    speaker: mary
    en: It subsequently independently begins to erase memories that it shouldn't.
    ko: 지워져서는 안 되는 기억들도 [알아서] 지워버려요.
    ja: |-
      消してはいけない記憶も
      「勝手に」消してしまいます。
  event_arcanearchive_03_s_39:
    speaker: mary
    en: In other words, it becomes accustomed to the absence of memories.
    ko: "…말하자면, 익숙해지는 거죠. 기억이 사라진 상태에."
    ja: |-
      …要するに、慣れてしまうのです。
      記憶が何もない状態に。
  event_arcanearchive_03_s_40:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_41:
    speaker: mary
    en: While I don't think it will go to the extent of shutting down your essential
      survival functions,
    ko: 그렇다고 생존에 필수적인 요소까지 꺼버리진 않을 거라고 생각하지만….
    ja: |-
      だからといって、生存に必要な要素まで
      消してしまうことはないと思いますが…
  event_arcanearchive_03_s_42:
    speaker: mary
    en: if this keeps up, you will almost certainly lose all of your memories.
    ko: 이대로 계속된다면 모든 기억을 잃어버리고,
    ja: |-
      このままの状態が続けば、
      いずれは記憶をすべて失い…
  event_arcanearchive_03_s_43:
    speaker: mary
    en: Permanently.
    ko: 원래 기억을 다시 찾지 못하게 될 거예요.
    ja: 元の記憶は戻らなくなるでしょう。
  event_arcanearchive_03_s_44:
    speaker: "<Self>"
    en: This sounds a lot like...
    ko: 메어리. 그건 꼭….
    ja: メアリー、それはまるで…
  event_arcanearchive_03_s_45:
    speaker: mary
    en: Yes.
    ko: 네.
    ja: はい。
  event_arcanearchive_03_s_46:
    speaker: mary
    en: We call this a Mind Switch.
    ko: 우리는 그걸, 사고 전환이라고 부르죠.
    ja: 私たちはそれを、思考転換と呼んでいます。
  event_arcanearchive_03_s_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_48:
    speaker: mary
    en: Technically, it's a bit different, but the end result is the same.
    ko: 엄밀히 말하면 약간 다르지만… 결과적으로는 같죠.
    ja: |-
      厳密に言うと、少し異なりますが…
      結果的には同じようなものです。
  event_arcanearchive_03_s_49:
    speaker: mary
    en: You become a totally different person.
    ko: 완전히 다른 사람이 되어버린다는 거니까.
    ja: まるっきり別人になってしまうわけですから。
  event_arcanearchive_03_s_50:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_51:
    speaker: mary
    en: I'll run a few more tests.
    ko: "…아르카나. 몇 가지만 더 검사를 해 볼게요."
    ja: "…アルカナ。もう一つだけ検査をしますね。"
  event_arcanearchive_03_s_52:
    speaker: mary
    en: Pepper will guide you.
    ko: 페퍼가 안내해 드릴 거예요.
    ja: |-
      ペッパーが案内しますので、
      ついていってください。
  event_arcanearchive_03_s_53:
    speaker: arcana
    en: Okay, thank you...
    ko: 네에, 감사합니다….
    ja: はい、ありがとうございます…
  event_arcanearchive_03_s_54:
    speaker: "<Monologue>"
    en: Arcana leaves the consultation room.
    ko: 아르카나는 진료실을 나갔다.
    ja: アルカナが診察室を出ていった
  event_arcanearchive_03_s_55:
    speaker: mary
    en: Commander.
    ko: "…지휘관."
    ja: "…指揮官。"
  event_arcanearchive_03_s_56:
    speaker: mary
    en: You said Arcana was part of the Best Seller Squad?
    ko: 저분, 베스트셀러 스쿼드 소속이라고 하셨죠?
    ja: あの方、ベストセラー部隊の方ですよね？
  event_arcanearchive_03_s_57:
    speaker: "<Self>"
    en: Yes. She said she handles records.
    ko: 맞아. 방주 도서관에서 기록을 관리한대.
    ja: |-
      ああ。アークの図書館で
      機密情報を管理しているらしい
  event_arcanearchive_03_s_58:
    speaker: mary
    en: And every time she has to handle classified information, her memory is erased.
    ko: 새어나가서는 안 되는 기록을 취급할 때마다 기억을 지우고요?
    ja: |-
      つまり、外部に流出してはいけない情報を
      扱うたびに記憶を消去されているのですか？
  event_arcanearchive_03_s_59:
    speaker: "<Self>"
    en: Correct.
    ko: "…응."
    ja: "…ああ"
  event_arcanearchive_03_s_60:
    speaker: mary
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_61:
    speaker: mary
    en: She's strong.
    ko: 강한 분이시네요.
    ja: "…本当に、強い方ですね。"
  event_arcanearchive_03_s_62:
    speaker: "<Self>"
    en: What do you mean?
    ko: 강하다고?
    ja: それはどういう…？
  event_arcanearchive_03_s_63:
    speaker: mary
    en: Do you know when the Ark's library was established?
    ko: 방주의 도서관. 언제 개관했는지 아시나요?
    ja: |-
      アークの図書館が、
      いつ開館したかご存じですか？
  event_arcanearchive_03_s_64:
    speaker: "<Self>"
    en: Uh...
    ko: 어… 글쎄?
    ja: いや…
  event_arcanearchive_03_s_65:
    speaker: mary
    en: It's been around since the Ark's inception.
    ko: 방주가 지어질 때부터 있었어요.
    ja: |-
      あれは、アークができた時から
      あったものなんです。
  event_arcanearchive_03_s_66:
    speaker: mary
    en: Of course, I don't know if Arcana has been working there from the beginning,
    ko: 물론 아르카나도 그때부터 일을 했는지는 모르지만.
    ja: |-
      彼女が当時から
      働いていたのかどうかは分かりませんが…
  event_arcanearchive_03_s_67:
    speaker: mary
    en: but I'm sure she's been there for quite a while.
    ko: 적어도 하루이틀 한 건 아닐 거예요.
    ja: 少なくとも、ここ最近からではないはずです。
  event_arcanearchive_03_s_68:
    speaker: mary
    en: It's not a job that most people would be willing to undertake.
    ko: "…못할 일이죠, 보통은."
    ja: "…普通なら、耐えられません。"
  event_arcanearchive_03_s_69:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_70:
    speaker: "<Monologue>"
    en: Mary organized the charts in her folder.
    ko: 메어리는 서류철에 차트를 정리했다.
    ja: メアリーはカルテを整理した
  event_arcanearchive_03_s_71:
    speaker: mary
    en: First and foremost, my opinion as a medical professional is that she shouldn't
      undergo any more memory wipes.
    ko: |-
      일단 의사로서의 권고 사항은,
      앞으로는 기억 소거를 절대 시행하지 말 것… 이기는 한데요.
    ja: |-
      ひとまず医師として忠告できることは、
      今後は記憶消去を決して行わないこと…
      ですね。
  event_arcanearchive_03_s_72:
    speaker: "<Self>"
    en: That may be difficult. It's not exactly up to her.
    ko: "…어렵겠지. 자기 맘대로 할 수 있는 게 아닐 거야."
    ja: |-
      …難しいだろうな。
      自分の意志では決められないはずだ
  event_arcanearchive_03_s_73:
    speaker: mary
    en: I see.
    ko: 그렇겠죠.
    ja: そうでしょうね。
  event_arcanearchive_03_s_74:
    speaker: mary
    en: That means you have to take good care of her.
    ko: "…그러니까 지휘관이 잘 보살펴 주세요."
    ja: "…ですから、指揮官が支えてあげてください。"
  event_arcanearchive_03_s_75:
    speaker: mary
    en: She may not show it, but I'm sure she's feeling quite anxious.
    ko: 겉으로는 괜찮은 척해도, 아마 많이 불안할 테니까요.
    ja: |-
      表向きは平気そうに見えても、
      きっとすごく不安でしょうから。
  event_arcanearchive_03_s_76:
    speaker: "<Self>"
    en: "... All right. Thank you, Mary."
    ko: "…응. 고마워, 메어리."
    ja: "…ああ。ありがとう、メアリー"
  event_arcanearchive_03_s_77:
    speaker: "<Monologue>"
    en: I head to the consultation room and wait for Arcana. After finishing her tests,
      Arcana comes skipping over.
    ko: 진료실에서 나와 조금 기다리자, 추가 검사를 마친 아르카나가 달려왔다.
    ja: |-
      診察室を出て待っていると、
      追加の検査を終えたアルカナが走ってきた
  event_arcanearchive_03_s_78:
    speaker: "<Self>"
    en: Did it go well?
    ko: 잘 끝났어?
    ja: もう終わったのか？結果は？
  event_arcanearchive_03_s_79:
    speaker: arcana
    en: Yes. Nothing too serious.
    ko: 네. 막 심각한 분위기는 아니었어요.
    ja: |-
      はい、そんなに深刻そうな雰囲気では
      ありませんでした。
  event_arcanearchive_03_s_80:
    speaker: "<Self>"
    en: "... Arcana."
    ko: "……아르카나."
    ja: "…アルカナ"
  event_arcanearchive_03_s_81:
    speaker: arcana
    en: Yes?
    ko: 네?
    ja: はい？
  event_arcanearchive_03_s_82:
    speaker: "<Self>"
    en: Mary said it wouldn't be good if you keep getting your memory wiped.
    ko: 메어리가 앞으로는 기억 소거를 안 받는 게 좋겠다고 했어.
    ja: |-
      メアリーが、今後は記憶消去を
      しない方がいいと言っていた
  event_arcanearchive_03_s_83:
    speaker: arcana
    en: I know...
    ko: 음….
    ja: うーん…
  event_arcanearchive_03_s_84:
    speaker: arcana
    en: But it's not like I can help it, can I?
    ko: 그건 좀 어렵지 않을까요?
    ja: それは難しくありませんか？
  event_arcanearchive_03_s_85:
    speaker: "<Self>"
    en: You're right,
    ko: 맞아. 사정이 있겠지.
    ja: "…そうだろうな。事情があるんだろう？"
  event_arcanearchive_03_s_86:
    speaker: "<Self>"
    en: but perhaps if I say something to the higher-ups...
    ko: 그래도 내가 얘기해 보면….
    ja: でも、私が説得すれば…
  event_arcanearchive_03_s_87:
    speaker: arcana
    en: Oh no, I didn't say that as a way of asking for your help.
    ko: 아뇨. 그런 게 아니라.
    ja: いえ、そういうことではなく。
  event_arcanearchive_03_s_88:
    speaker: arcana
    en: I chose this job, and all that it entails.
    ko: 분명 제가 선택한 일일 테니까요.
    ja: |-
      きっと今の状況は、
      私が納得して選択した結果だと思うので。
  event_arcanearchive_03_s_89:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_90:
    speaker: arcana
    en: No one knows me better than myself.
    ko: 저는 제가 잘 알아요.
    ja: 自分のことは、自分が一番よく分かってます。
  event_arcanearchive_03_s_91:
    speaker: arcana
    en: I realize my memory is a bit screwy at the moment,
    ko: 지금은 기억이 좀 이상하지만, 그래도.
    ja: 今は少し記憶に問題がありますが、それでも。
  event_arcanearchive_03_s_92:
    speaker: arcana
    en: but I know that I'm someone who only dedicates herself to things that she
      believes in.
    ko: 저는 제가 하고 싶은 일만 하고 사는 사람일 거라고 생각하거든요.
    ja: |-
      私は、自分がしたいことだけをして
      生きていたいタイプだと思うんです。
  event_arcanearchive_03_s_93:
    speaker: arcana
    en: And you know why?
    ko: 왜냐하면.
    ja: なぜなら…
  event_arcanearchive_03_s_94:
    speaker: "<Narration>"
    en: "*Swoosh*"
    ko: 처억.
    ja: パッ
  event_arcanearchive_03_s_95:
    speaker: "<Monologue>"
    en: Arcana takes out a tarot card.
    ko: 아르카나가 타로 카드 한 장을 꺼냈다.
    ja: アルカナはタロットカードを1枚取り出した
  event_arcanearchive_03_s_96:
    speaker: "<Self>"
    en: Wheel of Fortune?
    ko: "[운명의 수레바퀴]?"
    ja: "「運命の輪」…？"
  event_arcanearchive_03_s_97:
    speaker: arcana
    en: Whoops. Wrong side.
    ko: 아. 잘못 뒤집었다.
    ja: あっ、間違えちゃった。
  event_arcanearchive_03_s_98:
    speaker: "<Monologue>"
    en: Arcana turns over the card.
    ko: 아르카나가 카드를 뒤집었다.
    ja: アルカナはカードを裏返した
  event_arcanearchive_03_s_99:
    speaker: "<Monologue>"
    en: 'On the back side, the following words are written:'
    ko: 카드의 뒷면에는 [내 운명의 주인은 바로 나!]라고 적힌 메모지가 붙어 있다.
    ja: |-
      カードの裏面には、
      「自分の運命は自分で決める！」と
      書かれた付せんが貼られている
  event_arcanearchive_03_s_100:
    speaker: arcana
    en: You are the master of your own fate.
    ko: 제 운명의 주인은 저 자신이니까.
    ja: 私の運命の主役は、私自身ですから。
  event_arcanearchive_03_s_101:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_102:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_103:
    speaker: arcana
    en: I thought you'd be a little more impressed.
    ko: 감동 받거나 감탄해야 하는 타이밍 아니에요?
    ja: |-
      あの～…？
      ここって感動するタイミングでは？
  event_arcanearchive_03_s_104:
    speaker: "<Self>"
    en: About what?
    ko: 그래도….
    ja: しかし…
  event_arcanearchive_03_s_105:
    speaker: arcana
    en: This is a message left to me by my past self!
    ko: 그래도라뇨! 이건 과거의 내가 남긴 메시지라구요!
    ja: |-
      しかしもだがしもありません！
      これは過去の私が残したメッセージなんですよ！
  event_arcanearchive_03_s_106:
    speaker: arcana
    en: Isn't that amazing? Aren't you on tenterhooks?
    ko: 엄청난 서스펜스가 느껴지지 않아요?
    ja: とってもワクワクしませんか！？
  event_arcanearchive_03_s_107:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_s_108:
    speaker: arcana
    en: Now then.
    ko: 그러니까.
    ja: だから…
  event_arcanearchive_03_s_109:
    speaker: "<Monologue>"
    en: Arcana smiles and reaches out her hand.
    ko: 아르카나가 웃으며 손을 내밀었다.
    ja: アルカナが笑顔で手を差し出した
  event_arcanearchive_03_s_110:
    speaker: arcana
    en: May I?
    ko: "…응?"
    ja: "…ねっ？"
  event_arcanearchive_03_s_111:
    speaker: "<Self>"
    en: "... You may."
    ko: "…알았어."
    ja: "…分かった"
  event_arcanearchive_03_s_112:
    speaker: "<Monologue>"
    en: I take Arcana's hand, and she begins to lead me somewhere.
    ko: 손을 잡자, 아르카나는 나를 끌고 어디론가 걷기 시작했다.
    ja: |-
      手を繋ぐと、アルカナは私を引っ張って
      どこかへと歩き始めた
event_arcanearchive_03_e:
  event_arcanearchive_03_e_1:
    speaker: "<Monologue>"
    en: A few moments later, we arrive at the downtown area of the Ark.
    ko: 잠시 후 도착한 곳은 방주 시내였다.
    ja: |-
      しばらくして、
      到着したのはアークの市街地だった
  event_arcanearchive_03_e_2:
    speaker: "<Self>"
    en: What are you planning on doing?
    ko: 이제 어쩔 생각이야?
    ja: これからどうするんだ？
  event_arcanearchive_03_e_3:
    speaker: arcana
    en: The doctor said it would help if I do things that I did before, right?
    ko: 아까 의사 선생님이, 평소에 하던 일을 해보면 도움이 될 거라고 했잖아요?
    ja: |-
      さっきお医者さんが、普段の行動をマネするのは
      いい方法だって言ってましたので…
  event_arcanearchive_03_e_4:
    speaker: arcana
    en: Well, that's precisely what I'm trying out.
    ko: 그래서 그렇게 해보려구요.
    ja: それを試してみようかな～と。
  event_arcanearchive_03_e_5:
    speaker: "<Self>"
    en: You remember activities you used to do?
    ko: 평소에 뭘 했는지도 기억났어?
    ja: 普段の様子を思い出したのか？
  event_arcanearchive_03_e_6:
    speaker: arcana
    en: No.
    ko: 아뇨.
    ja: いいえ。
  event_arcanearchive_03_e_7:
    speaker: arcana
    en: But there are ways that could help me find out.
    ko: 그래도 다 방법이 있어요.
    ja: でも、方法はあります。
  event_arcanearchive_03_e_8:
    speaker: "<Monologue>"
    en: Arcana holds out her phone.
    ko: 아르카나가 휴대폰을 내밀었다.
    ja: アルカナが携帯電話を差し出した
  event_arcanearchive_03_e_9:
    speaker: arcana
    en: In our modern society, it's not unreasonable to say that just about everything
      concerning us is tied to our phones.
    ko: |-
      현대 방주인의 생활은,
      전부 이 핸드폰에 묶여 있다고 해도 과언이 아니죠.
    ja: |-
      アークに住む人たちの生活は、
      すべて携帯電話に紐付けられていると
      言っても過言ではありません。
  event_arcanearchive_03_e_10:
    speaker: arcana
    en: So with that in mind, if I look at my past purchases...
    ko: 그러니까 요렇게, 결제 내역을 확인해 보면…!
    ja: だからこうやって、支払い履歴を確認すれば…！
  event_arcanearchive_03_e_11:
    speaker: "<Monologue>"
    en: Arcana scrolls through her phone.
    ko: 아르카나는 핸드폰 화면을 슥슥 스크롤 했다.
    ja: アルカナは携帯の画面をスクロールした
  event_arcanearchive_03_e_12:
    speaker: arcana
    en: I'll be able to find out exactly what I was doing!
    ko: 제가 평소에 뭘 하고 다녔는지, 전부 알아낼 수 있다는 말씀!
    ja: 普段の私の行動が丸わかりというわけです！
  event_arcanearchive_03_e_13:
    speaker: "<Choice>"
    en: Uh-huh.
    ko: 오….
    ja: おおっ…
  event_arcanearchive_03_e_14:
    speaker: "<Choice>"
    en: Wow, maybe you really were a detective before.
    ko: 설마 진짜 탐정이었어…?
    ja: まさか、本当に探偵だったのか…？
  event_arcanearchive_03_e_15:
    speaker: arcana
    en: Hehe.
    ko: 에헴.
    ja: えっへん。
  event_arcanearchive_03_e_16:
    speaker: arcana
    en: All right, let's go.
    ko: 그럼 어서 가요.
    ja: ということで、さっそく行きましょう。
  event_arcanearchive_03_e_17:
    speaker: arcana
    en: Our first destination is none other than...
    ko: 첫 번째 목적지는 바로바로…!
    ja: 最初の目的地は、ずばり…！
  event_arcanearchive_03_e_18:
    speaker: arcana
    en: Blech!
    ko: 으웩.
    ja: うえっ。
  event_arcanearchive_03_e_19:
    speaker: arcana
    en: Too bitter.
    ko: 너무 써어….
    ja: 苦すぎるぅ…
  event_arcanearchive_03_e_20:
    speaker: "<Choice>"
    en: "... It's a latte. You really think that's too bitter?"
    ko: 라떼인데도 써?
    ja: ラテなのに？
  event_arcanearchive_03_e_21:
    speaker: "<Choice>"
    en: Guess you're not a fan of bitter flavors.
    ko: 쓴 거 잘 못 먹는구나?
    ja: 苦いものが苦手なのか？
  event_arcanearchive_03_e_22:
    speaker: arcana
    en: Yes!
    ko: 네….
    ja: はい…
  event_arcanearchive_03_e_23:
    speaker: arcana
    en: Apparently not.
    ko: 그런가 봐요….
    ja: そうみたいです…
  event_arcanearchive_03_e_24:
    speaker: arcana
    en: I figured that since I'd bought something at a cafe, it would have been a
      coffee, but I guess not.
    ko: 카페라서 당연히 커피인 줄 알았는데 아닌가…?
    ja: |-
      カフェといえば、
      当然コーヒー系だと思ったのにぃ…
  event_arcanearchive_03_e_25:
    speaker: "<Self>"
    en: Try ordering something else at the same price.
    ko: 가격이 똑같은 다른 메뉴를 시켜봐.
    ja: 同じ値段の別のメニューを試してみたらどうだ？
  event_arcanearchive_03_e_26:
    speaker: arcana
    en: That's genius!
    ko: "…그쪽, 혹시 천재?"
    ja: "…さては、天才ですか？"
  event_arcanearchive_03_e_27:
    speaker: arcana
    en: Wait a moment. I'll be right back.
    ko: 잠시만요. 금방 갔다 올게요.
    ja: 同じ値段というと…すぐ戻ってきますね！
  event_arcanearchive_03_e_28:
    speaker: arcana
    en: This has to be the one. It's delicious.
    ko: 이거 맞는 것 같은데요? 맛있다.
    ja: おいしい～！これが正解かもしれません！
  event_arcanearchive_03_e_29:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: 何を頼んだんだ？
  event_arcanearchive_03_e_30:
    speaker: arcana
    en: Lemon tea.
    ko: 레몬 티.
    ja: レモンティーです。
  event_arcanearchive_03_e_31:
    speaker: arcana
    en: Want to try some?
    ko: 마셔볼래요?
    ja: 一口飲んでみますか？
  event_arcanearchive_03_e_32:
    speaker: "<Monologue>"
    en: Arcana holds out her cup.
    ko: 아르카나가 컵을 내밀었다.
    ja: アルカナがレモンティーを差し出した
  event_arcanearchive_03_e_33:
    speaker: "<Choice>"
    en: Sure.
    ko: 응.
    ja: ああ
  event_arcanearchive_03_e_34:
    speaker: "<Choice>"
    en: No thanks, I'm okay.
    ko: 아니, 괜찮아.
    ja: いや、大丈夫だ
  event_arcanearchive_03_e_35:
    speaker: arcana
    en: Here.
    ko: 여기요.
    ja: ふふ、どうぞ。
  event_arcanearchive_03_e_36:
    speaker: "<Monologue>"
    en: I take a sip of the lemon tea.
    ko: 레몬 티를 한 모금 맛 봤다.
    ja: レモンティーを一口飲んだ
  event_arcanearchive_03_e_37:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_arcanearchive_03_e_38:
    speaker: arcana
    en: How is it?
    ko: 어때요?
    ja: どうですか？
  event_arcanearchive_03_e_39:
    speaker: "<Self>"
    en: I think I prefer coffee.
    ko: 나는 그냥 커피가 나은 것 같아.
    ja: 私はコーヒーの方がいいな
  event_arcanearchive_03_e_40:
    speaker: arcana
    en: Blech. How can you drink something so bitter?
    ko: 으으. 그렇게 쓴 걸 어떻게 먹어요?
    ja: えぇっ…そんな苦いもの、よく飲めますね？
  event_arcanearchive_03_e_41:
    speaker: "<Self>"
    en: I don't think it's all that bitter...
    ko: 그정도로 쓴가?
    ja: そうでもないと思うが…
  event_arcanearchive_03_e_42:
    speaker: arcana
    en: Are you telling me that the coffee you have isn't bitter?
    ko: 그쪽 거는 안 쓴 거예요?
    ja: あなたのは苦くないんですか？
  event_arcanearchive_03_e_43:
    speaker: arcana
    en: Can I try yours?
    ko: 그럼 그쪽 거 마셔볼래.
    ja: "…じゃあ、一口もらってもいいですか？"
  event_arcanearchive_03_e_44:
    speaker: "<Self>"
    en: Wait, you may think it's...
    ko: 어, 이거….
    ja: いや、これは…
  event_arcanearchive_03_e_45:
    speaker: "<Monologue>"
    en: Arcana takes a sip of my coffee.
    ko: 아르카나는 내 커피잔을 집어 들고 한 모금 홀짝였다.
    ja: |-
      アルカナは私のコーヒーを手に取ると、
      一口飲んだ
  event_arcanearchive_03_e_46:
    speaker: arcana
    en: Blech!
    ko: 으웨엑….
    ja: うええっ…
  event_arcanearchive_03_e_47:
    speaker: "<Self>"
    en: I was going to tell you it was bitter.
    ko: "…쓰다니까."
    ja: |-
      …君にとっては苦いだろうと
      言おうと思ったんだが…
  event_arcanearchive_03_e_48:
    speaker: arcana
    en: Well, why didn't you tell me sooner?!
    ko: 좀만 더 일찍 말해주지.
    ja: もっと早く言ってくださいよぉ…
  event_arcanearchive_03_e_49:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_50:
    speaker: arcana
    en: Anyway, are there always this many people here?
    ko: 근데 여기, 원래 이렇게 사람 많아요?
    ja: |-
      ところでここ、どうしてこんなに
      混んでるんでしょうか。
  event_arcanearchive_03_e_51:
    speaker: arcana
    en: The place seems familiar, but it feels weird seeing this many people.
    ko: 공간 자체는 익숙한데, 막 테이블 꽉 차 있는 모습은 되게 어색한 것 같아.
    ja: |-
      この場所自体は見覚えがあるんですが、
      満席の状態はなんだか違和感があって…
  event_arcanearchive_03_e_52:
    speaker: "<Self>"
    en: I'm surprised you remember so much.
    ko: 그것도 기억 난 거야?
    ja: そんなことまで思い出したのか？
  event_arcanearchive_03_e_53:
    speaker: arcana
    en: What do you mean?
    ko: 뭐가요?
    ja: えっ？
  event_arcanearchive_03_e_54:
    speaker: "<Self>"
    en: You just said it feels weird for this place to be packed. Doesn't that mean
      you remember it usually being not so busy?
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_55:
    speaker: arcana
    en: "?"
    ko: "??"
    ja: "？？"
  event_arcanearchive_03_e_56:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_57:
    speaker: arcana
    en: Oh! I see what you mean!
    ko: 아, 아!
    ja: あっ！
  event_arcanearchive_03_e_58:
    speaker: arcana
    en: Uh... no, sorry. I don't really remember anything concrete.
    ko: 아뇨오? 아직 별다른 건 없는데요??
    ja: |-
      いえその、なんとなくそう思っただけで、
      特に思い出したわけじゃないというか…！
  event_arcanearchive_03_e_59:
    speaker: "<Self>"
    en: So you didn't remember after all...
    ko: 까먹고 있었구나….
    ja: なんだ、私はてっきり…
  event_arcanearchive_03_e_60:
    speaker: arcana
    en: What would be weird is if all my memories came rushing back from a single
      drink at a cafe.
    ko: |-
      카, 카페 와서 음료 한 잔 마셨다고 짠! 하고
      바로 기억나는 게 더 이상하지 않아요?
    ja: |-
      か、カフェで1杯飲んだだけで
      すぐに思い出せる方がすごくないですか？
  event_arcanearchive_03_e_61:
    speaker: arcana
    en: We still have a lot more places to go.
    ko: 아직 갈 데 많다구요.
    ja: まだまだ先は長いですよ～
  event_arcanearchive_03_e_62:
    speaker: "<Self>"
    en: I know, but...
    ko: 그렇기는 한데….
    ja: それはそうだが…
  event_arcanearchive_03_e_63:
    speaker: arcana
    en: Look at this.
    ko: 봐봐요.
    ja: ほらこれ、見てください！
  event_arcanearchive_03_e_64:
    speaker: "<Monologue>"
    en: Arcana pulls out a note from her pocket crammed full of densely written text.
    ko: 아르카나는 주머니에서 작은 글씨가 빼곡히 적혀 있는 메모지를 꺼냈다.
    ja: |-
      アルカナはポケットから
      小さい文字で埋め尽くされている
      メモ用紙を取り出した
  event_arcanearchive_03_e_65:
    speaker: "<Monologue>"
    en: On the very top is written "Places to Visit Today".
    ko: 가장 위에는 [오늘 놀러 갈 곳!]이라고 적혀있….
    ja: |-
      …一番上には、「今日遊びに行く場所！」と
      書かれている
  event_arcanearchive_03_e_66:
    speaker: arcana
    en: Actually, on second thought...
    ko: 앗!
    ja: はっ！
  event_arcanearchive_03_e_67:
    speaker: "<Narration>"
    en: "*Scribble scribble*"
    ko: 슥슥슥.
    ja: ザッ、ザッ
  event_arcanearchive_03_e_68:
    speaker: "<Monologue>"
    en: Arcana hurriedly takes out a pen and scratches out the heading,
    ko: 아르카나는 황급히 펜을 꺼내 제목을 지우고는.
    ja: |-
      アルカナは慌ててペンを取り出して
      タイトルを消すと…
  event_arcanearchive_03_e_69:
    speaker: "<Monologue>"
    en: 'replacing it instead with "Operation: Memory Recovery!"'
    ko: "[기억 찾기 대작전!] 이라고 고쳐 썼다."
    ja: "「記憶探し大作戦！」と書き直した"
  event_arcanearchive_03_e_70:
    speaker: arcana
    en: That's better!
    ko: 헤헷. 실수.
    ja: えへっ。ついうっかり。
  event_arcanearchive_03_e_71:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_72:
    speaker: arcana
    en: Anyway, these are all the places we still have to check out.
    ko: 어쨌든! 갈 데는 이렇게나 많이 남았다구요.
    ja: |-
      と、とにかく！
      行き先はまだこんなに残ってるんですからね！
  event_arcanearchive_03_e_73:
    speaker: "<Monologue>"
    en: 'The note includes locations such as the cafe, and many others:'
    ko: 메모지에는 카페를 포함해서,
    ja: メモには、今いるカフェを含め…
  event_arcanearchive_03_e_74:
    speaker: "<Monologue>"
    en: A famous dessert shop that I've heard about, an accessory store,
    ko: 나도 이름을 알 정도로 유명한 디저트 전문점, 액세서리 가게.
    ja: |-
      私でも名前を知っているほど有名な
      スイーツ専門店やアクセサリーショップ
  event_arcanearchive_03_e_75:
    speaker: "<Monologue>"
    en: a nail salon, a hair salon, several popular restaurants, and more.
    ko: 네일아트 숍, 미용실, 맛집 등이….
    ja: |-
      さらにはネイルショップや美容室、
      飲食店などが書かれ…
  event_arcanearchive_03_e_76:
    speaker: "<Self>"
    en: Hold on.
    ko: "…잠깐!"
    ja: "…待ってくれ"
  event_arcanearchive_03_e_77:
    speaker: arcana
    en: Yes?
    ko: 네?
    ja: はい？
  event_arcanearchive_03_e_78:
    speaker: "<Self>"
    en: You intend on visiting all these places?
    ko: 여길 다 들르려고?
    ja: "…まさか、全部行くつもりか？"
  event_arcanearchive_03_e_79:
    speaker: arcana
    en: Of course. I have to regain my memories, don't I?
    ko: 그럼요. 기억 찾아야죠.
    ja: もちろんです。記憶を取り戻さないと。
  event_arcanearchive_03_e_80:
    speaker: arcana
    en: Why, are you busy?
    ko: 혹시 바빠요?
    ja: もしかして、お忙しいですか？
  event_arcanearchive_03_e_81:
    speaker: "<Self>"
    en: It's not that, it's...
    ko: 그런 문제는 아니야.
    ja: いや、そういうことではなく…
  event_arcanearchive_03_e_82:
    speaker: arcana
    en: Don't worry about money. I've got it covered.
    ko: 아, 돈은 걱정 마세요. 당연히 제가 낼 거니까.
    ja: |-
      あ、お金のことならご心配なく。
      ちゃーんと私が出しますから！
  event_arcanearchive_03_e_83:
    speaker: "<Self>"
    en: It's not that either.
    ko: 그런 문제도 아니기는 한데….
    ja: そういう問題でもないが…
  event_arcanearchive_03_e_84:
    speaker: arcana
    en: Then what's the problem?
    ko: 그럼 문제없는 거죠?
    ja: じゃあ、何が問題なんです？
  event_arcanearchive_03_e_85:
    speaker: arcana
    en: I trust you to see this through to the end.
    ko: 끝까지 잘 부탁해요.
    ja: ふふっ…最後までよろしくお願いしますね？
  event_arcanearchive_03_e_86:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_87:
    speaker: "<Monologue>"
    en: I am subsequently dragged around by Arcana for the entire afternoon.
    ko: 그렇게 한나절 내내 아르카나에게 끌려다니고.
    ja: こうして半日、アルカナに連れ回され…
  event_arcanearchive_03_e_88:
    speaker: "<Monologue>"
    en: 'At long last, we arrive at our last stop: a photo sticker booth.'
    ko: 마지막으로 스티커 사진 가게에 도착했다.
    ja: 最後に、プリントシール機の店に到着した
  event_arcanearchive_03_e_89:
    speaker: arcana
    en: This is it!
    ko: 이쪽이요, 이쪽.
    ja: こっちです、こっち！
  event_arcanearchive_03_e_90:
    speaker: "<Choice>"
    en: Okay.
    ko: 아, 알았어.
    ja: わ、分かった
  event_arcanearchive_03_e_91:
    speaker: "<Choice>"
    en: Uh...
    ko: 으어어.
    ja: はぁ…
  event_arcanearchive_03_e_92:
    speaker: "<Monologue>"
    en: Before I can say anything more, the camera snaps and takes a photo,
    ko: 뭐라고 말할 틈도 없이, 순식간에 함께 사진을 찍었다.
    ja: |-
      状況に流されるがまま、
      あっという間に一緒に写真を撮った
  event_arcanearchive_03_e_93:
    speaker: "<Monologue>"
    en: despite my not being ready.
    ko: "…아니, 찍혔다."
    ja: "…正確には、撮られた"
  event_arcanearchive_03_e_94:
    speaker: arcana
    en: Okay, let's see if we got any good ones...
    ko: 잠깐만요. 골라줄게요.
    ja: ふふ、よさそうなのを選んであげますね～
  event_arcanearchive_03_e_95:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_96:
    speaker: arcana
    en: Oooh, this one!
    ko: 아. 이게 좋겠다.
    ja: ん～、これがいいかな？
  event_arcanearchive_03_e_97:
    speaker: arcana
    en: Here you go.
    ko: 자요.
    ja: はい、どうぞ。
  event_arcanearchive_03_e_98:
    speaker: "<Self>"
    en: Thanks.
    ko: 고, 고마워.
    ja: あ、ありがとう
  event_arcanearchive_03_e_99:
    speaker: "<Monologue>"
    en: Arcana hands me a photo.
    ko: 아르카나가 건넨 사진을 받았다.
    ja: アルカナから写真を受け取った
  event_arcanearchive_03_e_100:
    speaker: "<Monologue>"
    en: In it, I can be seen in acute discomfort.
    ko: 영혼이 빠져나간 것 같은 나와,
    ja: 写真には、魂が抜けたような私と…
  event_arcanearchive_03_e_101:
    speaker: "<Monologue>"
    en: Meanwhile, Arcana is awkwardly positioned at an odd angle.
    ko: 이상한 포즈를 취한 아르카나의 모습이 찍혀 있다.
    ja: |-
      おかしなポーズをとっている
      アルカナの姿が写っている
  event_arcanearchive_03_e_102:
    speaker: arcana
    en: You don't like it, do you?
    ko: 별로 마음에 안 들어요?
    ja: イマイチでしたか？
  event_arcanearchive_03_e_103:
    speaker: arcana
    en: All right, next we... Agh!
    ko: 그럼 다시… 윽.
    ja: それなら、もう一度…うっ。
  event_arcanearchive_03_e_104:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_arcanearchive_03_e_105:
    speaker: "<Monologue>"
    en: Arcana once again starts to stagger, and I hold her up.
    ko: 비틀거리는 아르카나를 부축했다.
    ja: ふらつくアルカナをとっさに支えた
  event_arcanearchive_03_e_106:
    speaker: arcana
    en: Ugh... I don't think I'll ever get used to that.
    ko: 아으… 몇 번 겪어도 안 익숙해지네요.
    ja: うう…何度経験しても慣れませんね。
  event_arcanearchive_03_e_107:
    speaker: arcana
    en: It's like someone is taking a vacuum cleaner to my brain.
    ko: 막 머릿속에 청소기 돌리는 이 느낌.
    ja: 頭の中で、掃除機をかけられてる気分です。
  event_arcanearchive_03_e_108:
    speaker: "<Self>"
    en: Are you okay?
    ko: "…괜찮아?"
    ja: "…大丈夫か？"
  event_arcanearchive_03_e_109:
    speaker: arcana
    en: Not really, but at least it's benefiting me somehow.
    ko: 별로 안 괜찮기는 한데… 그래도 소득은 있으니까요.
    ja: |-
      あまり大丈夫ではないですが…
      収穫はありましたので。
  event_arcanearchive_03_e_110:
    speaker: "<Monologue>"
    en: Every time she visits a new location, Arcana gets a splitting headache and
      regains a bit of her memory.
    ko: |-
      새로운 곳에 방문할 때마다,
      아르카나는 두통과 함께 조금씩 기억을 되찾고 있다.
    ja: |-
      新しい場所を訪れるたびに、
      アルカナは頭痛とともに
      少しずつ記憶を取り戻していっている
  event_arcanearchive_03_e_111:
    speaker: arcana
    en: Apparently, this is the pose I like to make when taking photos.
    ko: "…응. 저는 사진 찍을 때 요렇게 포즈 취하는 걸 좋아해요."
    ja: |-
      …うん。私は写真を撮る時に、こうやって
      ポーズを決めるのが好きだったみたいですね。
  event_arcanearchive_03_e_112:
    speaker: arcana
    en: It was like my body was moving on its own.
    ko: 어쩐지 몸이 저절로 움직인다 했어.
    ja: どうりで、体が自然と動くわけです。
  event_arcanearchive_03_e_113:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_114:
    speaker: "<Monologue>"
    en: The dishes she eats. The clothing styles she's fond of. Movies that left a
      deep impression on her.
    ko: "…먹었던 메뉴. 좋아하는 스타일. 감명 깊게 봤던 영화와 같은."
    ja: |-
      …食べたものや好きなファッション、
      面白かった映画など…
  event_arcanearchive_03_e_115:
    speaker: "<Monologue>"
    en: They are everyday things, but they seem to be helping her.
    ko: 아주 시시콜콜하고 일상적인 것들이긴 했지만.
    ja: |-
      どれもささいなことに過ぎないが、
      彼女にとっては大切な情報になっているようだ
  event_arcanearchive_03_e_116:
    speaker: "<Self>"
    en: There were quite a lot of pictures in your room.
    ko: 사진 찍는 거 좋아했었나 보네.
    ja: 部屋にもたくさん貼ってあったのを見るに…
  event_arcanearchive_03_e_117:
    speaker: "<Self>"
    en: It seems you were a fan of taking photos.
    ko: 방에도 사진 많이 붙어 있었잖아.
    ja: 写真を撮るのが好きだったみたいだな
  event_arcanearchive_03_e_118:
    speaker: arcana
    en: Yeah, even when it's not a particularly special occasion.
    ko: 네. 별다른 일 없을 때도 사진… 을….
    ja: はい。なんでもない時でも、写真…を…
  event_arcanearchive_03_e_119:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_03_e_120:
    speaker: "<Self>"
    en: Is something wrong?
    ko: 아르카나?
    ja: アルカナ？
  event_arcanearchive_03_e_121:
    speaker: "<Monologue>"
    en: Arcana stares at me with the same vacant expression she had during the tarot
      reading.
    ko: 타로점을 쳤을 때처럼 멍한 눈으로 나를 바라본 아르카나는.
    ja: |-
      タロット占いをした時のように、
      アルカナはうつろな目で私を見つめた
  event_arcanearchive_03_e_122:
    speaker: "<Self>"
    en: Arcana?
    ko: 아르카나!
    ja: アルカナ！
  event_arcanearchive_03_e_123:
    speaker: "<Monologue>"
    en: Arcana proceeds to head outside,
    ko: 내 부름이 들리지 않는 것처럼,
    ja: そしてまるで私の声が聞こえていないかのように
  event_arcanearchive_03_e_124:
    speaker: "<Monologue>"
    en: completely ignoring me calling out to her.
    ko: 그대로 가게 밖으로 나갔다.
    ja: そのまま店の外へと出て行った
event_arcanearchive_intermission_01:
  event_arcanearchive_intermission_01_1:
    speaker: "<Monologue>"
    en: I follow Arcana inside the library. She is still in what seems to be a fugue
      state.
    ko: 여전히 멍한 상태인 아르카나를 따라 도서관으로 돌아왔다.
    ja: |-
      ぼんやりした様子で移動するアルカナを追って、
      図書館まで戻ってきた
  event_arcanearchive_intermission_01_2:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_intermission_01_3:
    speaker: "<Narration>"
    en: Identification confirmed.
    ko: "[확인되었습니다]"
    ja: "「確認しました」"
  event_arcanearchive_intermission_01_4:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥.
    ja: ガチャ…
  event_arcanearchive_intermission_01_5:
    speaker: "<Monologue>"
    en: After arriving at the entrance of her workspace, Arcana casually verifies
      her identity and opens the door.
    ko: 작업실 앞에 도착해, 익숙한 모습으로 인증을 하고 방문을 연 아르카나는.
    ja: |-
      仕事部屋の前に到着し、慣れた様子で
      認証を済ませてドアを開けたアルカナは…
  event_arcanearchive_intermission_01_6:
    speaker: "<Monologue>"
    en: She approaches the wall covered in photographs.
    ko: 사진이 빼곡히 붙어 있는 벽으로 다가섰다.
    ja: 写真で埋め尽くされている壁に近づいた
  event_arcanearchive_intermission_01_7:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_intermission_01_8:
    speaker: "<Monologue>"
    en: As Arcana flips over a photo...
    ko: 아르카나가 사진 중 하나를 거꾸로 뒤집자….
    ja: アルカナがそのうちの1枚をひっくり返すと…
  event_arcanearchive_intermission_01_9:
    speaker: "<Narration>"
    en: "*Woong*"
    ko: 우웅-
    ja: ウゥン…
  event_arcanearchive_intermission_01_10:
    speaker: "<Self>"
    en: What the...?!
    ko: 책장이…?
    ja: 本棚が…
  event_arcanearchive_intermission_01_11:
    speaker: "<Monologue>"
    en: The entire bookshelf moves to the side, revealing an old but sturdy-looking
      door.
    ko: 책장이 옆으로 밀려나고, 오래됐지만 튼튼해 보이는 문이 드러났다.
    ja: 本棚が横に動き、古くて丈夫そうな扉が現れた
  event_arcanearchive_intermission_01_12:
    speaker: arcana
    en: Death.
    ko: "…죽음."
    ja: "…死。"
  event_arcanearchive_intermission_01_13:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 또각.
    ja: コツ…
  event_arcanearchive_intermission_01_14:
    speaker: arcana
    en: Rebirth.
    ko: "…재탄생."
    ja: "…再生。"
  event_arcanearchive_intermission_01_15:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 또각.
    ja: コツ…
  event_arcanearchive_intermission_01_16:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_intermission_01_17:
    speaker: arcana
    en: New beginning.
    ko: 새로운, 시작을.
    ja: 新たな始まり。
  event_arcanearchive_intermission_01_18:
    speaker: "<Monologue>"
    en: Arcana disappears beyond the door.
    ko: 아르카나는 그대로 문 안쪽으로 사라져 버렸다.
    ja: |-
      そうつぶやくと、
      アルカナは扉の中へと消えていった
  event_arcanearchive_intermission_01_19:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_intermission_01_20:
    speaker: "<Monologue>"
    en: I follow her through the door.
    ko: 아르카나의 뒤를 쫓아 문 안으로 들어갔다.
    ja: 彼女の後を追って扉の中へ入った
  event_arcanearchive_intermission_01_21:
    speaker: "<Monologue>"
    en: As I pass into the dark hallway...
    ko: 어두컴컴한 복도를 지나자….
    ja: そのまま暗い廊下を通り抜けると…
  event_arcanearchive_intermission_01_22:
    speaker: "<Self>"
    en: "... A reading room?"
    ko: "…열람실?"
    ja: "…閲覧室？"
  event_arcanearchive_intermission_01_23:
    speaker: "<Monologue>"
    en: Inside, there is a reading room which appears even older than those found
      in the library.
    ko: 방주 도서관 것보다 오래되어 보이는 열람실 가운데에.
    ja: |-
      アークの図書館よりも
      年季の入った閲覧室の中央に…
  event_arcanearchive_intermission_01_24:
    speaker: "<Monologue>"
    en: Arcana stands in the middle, the same blank expression on her face.
    ko: 아르카나가 멍하니 서 있었다.
    ja: アルカナがぼんやりと立っていた
  event_arcanearchive_intermission_01_25:
    speaker: arcana
    en: Hmm?
    ko: 아…?
    ja: えっ…？
  event_arcanearchive_intermission_01_26:
    speaker: "<Self>"
    en: Arcana, are you okay?
    ko: 아르카나. 괜찮아?
    ja: アルカナ、大丈夫か？
  event_arcanearchive_intermission_01_27:
    speaker: arcana
    en: You're...
    ko: 그쪽은….
    ja: あなたは…
  event_arcanearchive_intermission_01_28:
    speaker: arcana
    en: Urgh. So dizzy. Wait a moment.
    ko: 으으. 어지러워라. 잠깐만요.
    ja: うう、頭がくらくらする…少々お待ちを…
  event_arcanearchive_intermission_01_29:
    speaker: "<Monologue>"
    en: Once she has gotten a hold of herself, Arcana lifts her face.
    ko: 잠시 비틀거리며 머리를 짚었던 아르카나가 고개를 들었다.
    ja: |-
      アルカナはしばらく頭を抱えながら
      ふらふらとしていたが、ゆっくりと顔を上げた
  event_arcanearchive_intermission_01_30:
    speaker: arcana
    en: Phew... okay. I'm fine now.
    ko: 휴우. 됐어요. 이제 괜찮아.
    ja: "…ふぅ。もう大丈夫です。"
  event_arcanearchive_intermission_01_31:
    speaker: arcana
    en: This was a pretty severe episode. Worse than the others.
    ko: 이번에는 아까보다 좀 심했네요.
    ja: 今回は、さっきよりひどかったですね。
  event_arcanearchive_intermission_01_32:
    speaker: "<Self>"
    en: Do you think you've regained your memory?
    ko: "…기억이 돌아온 거야?"
    ja: "…記憶が戻ったのか？"
  event_arcanearchive_intermission_01_33:
    speaker: arcana
    en: Hmm... maybe?
    ko: 음… 아마도요?
    ja: うーん…おそらく？
  event_arcanearchive_intermission_01_34:
    speaker: "<Self>"
    en: Maybe?
    ko: 아마도?
    ja: おそらく？
  event_arcanearchive_intermission_01_35:
    speaker: arcana
    en: While it's true that I now remember things that I couldn't before,
    ko: 아까는 기억 못 하던 게 많이 기억 난 건 맞는데,
    ja: 確かに、たくさんのことを思い出しましたが…
  event_arcanearchive_intermission_01_36:
    speaker: arcana
    en: I can't say for certain whether it's everything.
    ko: 그게 전부인지는 지금의 전 모르니까요.
    ja: |-
      全部思い出せたかどうかは、
      今の私には分からないというか…
  event_arcanearchive_intermission_01_37:
    speaker: arcana
    en: But it probably is, right?
    ko: 그래도… 맞겠죠, 뭐.
    ja: でも…多分、そうかなと。
  event_arcanearchive_intermission_01_38:
    speaker: "<Self>"
    en: I'm not sure about that...
    ko: 아니….
    ja: "…そうか"
  event_arcanearchive_intermission_01_39:
    speaker: arcana
    en: Anyways...
    ko: 그나저나… 어?
    ja: それより…あれ？
  event_arcanearchive_intermission_01_40:
    speaker: arcana
    en: Huh?
    ko: 으, 응? 여기 설마…?
    ja: えっ？ここって、まさか…？
  event_arcanearchive_intermission_01_41:
    speaker: "<Monologue>"
    en: Arcana frantically looks around the surroundings.
    ko: 아르카나는 황급히 주변을 두리번거렸다.
    ja: アルカナはあわてて周りを見回した
  event_arcanearchive_intermission_01_42:
    speaker: arcana
    en: How did you get in here?
    ko: 그쪽. 여기는 어떻게 들어온 거예요?
    ja: 指揮官様、どうやってここに…？
  event_arcanearchive_intermission_01_43:
    speaker: "<Self>"
    en: I just followed you... Whoa!
    ko: 그냥 뒤따라 왔는… 어?
    ja: ただ君の後を追って…えっ？
  event_arcanearchive_intermission_01_44:
    speaker: "<Monologue>"
    en: Arcana grabs my hand and starts walking back the way we came in.
    ko: 아르카나는 내 손을 잡고, 들어왔던 복도를 향해 걷기 시작했다.
    ja: |-
      アルカナは突然私の手を取ると、
      先ほど通った廊下に向かって歩き始めた
  event_arcanearchive_intermission_01_45:
    speaker: arcana
    en: You can't be here. It'll only lead to trouble.
    ko: 여기 있으면 안 돼요. 큰일 나.
    ja: |-
      ここにいてはいけません。
      大変なことになっちゃいます。
  event_arcanearchive_intermission_01_46:
    speaker: arcana
    en: Hurry and get out. I'll explain lat...!
    ko: 우선 얼른 나가요. 설명은 나중에 해줄… 아.
    ja: 早く出ましょう、説明は後でし…あっ。
  event_arcanearchive_intermission_01_47:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅. 저벅.
    ja: ザッ、ザッ
  event_arcanearchive_intermission_01_48:
    speaker: "<Monologue>"
    en: Footsteps echo from the other end of the hallway.
    ko: 어두운 복도 저편에서 발소리가 들려온다.
    ja: 暗い廊下の奥から足音が聞こえる
  event_arcanearchive_intermission_01_49:
    speaker: arcana
    en: A-already...?
    ko: 버, 벌써…?
    ja: も、もう来たの…？
  event_arcanearchive_intermission_01_50:
    speaker: arcana
    en: Oh no, we're too late... what should I do?!
    ko: 아니지. 오히려 좀 늦은 건가? 어떡하지…!
    ja: |-
      ううん、むしろ遅い方？
      じゃなくて、どうしよう…！
  event_arcanearchive_intermission_01_51:
    speaker: "<Monologue>"
    en: Arcana grabs me by the arms and looks me in the eye.
    ko: 아르카나가 내 양팔을 잡고 눈을 맞췄다.
    ja: |-
      アルカナは私の両腕を掴むと、
      真剣な様子で私を見つめた
  event_arcanearchive_intermission_01_52:
    speaker: arcana
    en: Listen carefully.
    ko: 잘 들어요.
    ja: よく聞いてください。
  event_arcanearchive_intermission_01_53:
    speaker: arcana
    en: Let me handle this. Just stay quiet, don't say anything, and stay still.
    ko: 제가 잘 말해볼 테니까, 그쪽은 아무 말도 하지 말고 가만히 있기.
    ja: |-
      この場は私が説明するので、
      あなたは何も言わず大人しくしててください。
  event_arcanearchive_intermission_01_54:
    speaker: arcana
    en: Understand?
    ko: 알았죠?
    ja: いいですね？
  event_arcanearchive_intermission_01_55:
    speaker: "<Self>"
    en: What in the world is g...
    ko: 아르카나. 이게 대체….
    ja: 待て、いったい何が…
  event_arcanearchive_intermission_01_56:
    speaker: arcana
    en: Do you understand?!
    ko: "…알았죠?"
    ja: "…いいですね？"
  event_arcanearchive_intermission_01_57:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…알았어."
    ja: "…分かった"
  event_arcanearchive_intermission_01_58:
    speaker: arcana
    en: Phew... just gotta calm down...
    ko: 후우… 침착하자, 나야….
    ja: ふぅ…落ち着け、落ち着け…
  event_arcanearchive_intermission_01_59:
    speaker: "<Monologue>"
    en: Arcana steps in front of me as if to protect me.
    ko: 아르카나가 나를 보호하듯 앞으로 나선 직후.
    ja: |-
      アルカナが私を守るように
      一歩前に出たその瞬間…
  event_arcanearchive_intermission_01_60:
    speaker: "<Monologue>"
    en: Meanwhile, the individual responsible for the clacking footsteps emerges.
    ko: 발소리의 주인공들이 모습을 드러냈다.
    ja: 足音の主たちが暗闇から姿を現した
  event_arcanearchive_intermission_01_61:
    speaker: k
    en: Uh?
    ko: 엥?
    ja: "…はっ？"
  event_arcanearchive_intermission_01_62:
    speaker: d_w
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_intermission_01_63:
    speaker: "<Self>"
    en: "??"
    ko: "…어?"
    ja: "…えっ？"
event_arcanearchive_04_s:
  event_arcanearchive_04_s_1:
    speaker: "<Self>"
    en: "??"
    ko: "…어?"
    ja: "…えっ？"
  event_arcanearchive_04_s_2:
    speaker: arcana
    en: H-hello. It's been a while.
    ko: 아, 안녕하세요~ 오랜만에 뵙네요.
    ja: こ、こんにちは～。お久しぶりですね？
  event_arcanearchive_04_s_3:
    speaker: arcana
    en: Wow, I've never seen you dressed so casually, D.
    ko: 와아, D 님 사복 차림은 처음 보는 것 같은데.
    ja: わあ～！D様の私服姿、初めて見ました～！
  event_arcanearchive_04_s_4:
    speaker: arcana
    en: It really suits you. You've got quite a nice figure.
    ko: 엄청 잘 어울려요~ 몸매도 진짜 좋으시다.
    ja: |-
      とってもお似合いです～
      スタイル抜群なんですねっ。
  event_arcanearchive_04_s_5:
    speaker: "<Monologue>"
    en: Although Arcana is maintaining a neutral expression while greeting D and K...
    ko: D와 K에게 인사를 하는 아르카나는 아무렇지도 않은 얼굴이었지만.
    ja: |-
      DとKに挨拶をするアルカナは、
      平静を装っていたが…
  event_arcanearchive_04_s_6:
    speaker: arcana
    en: He... hehe...
    ko: 아, 아하하….
    ja: あ、あはは…
  event_arcanearchive_04_s_7:
    speaker: "<Monologue>"
    en: Her legs are trembling like twigs.
    ko: 다리가 덜덜 떨리고 있다.
    ja: 足はガクガクと震えていた
  event_arcanearchive_04_s_8:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_9:
    speaker: "<Self>"
    en: Arcana.
    ko: 아르카나.
    ja: アルカナ
  event_arcanearchive_04_s_10:
    speaker: arcana
    en: Ssssh!
    ko: 쉿.
    ja: シーッ。
  event_arcanearchive_04_s_11:
    speaker: "<Self>"
    en: Arcana, it's okay.
    ko: "…아르카나. 괜찮아."
    ja: "…アルカナ、大丈夫だ"
  event_arcanearchive_04_s_12:
    speaker: arcana
    en: What do you mean?!
    ko: 괜찮긴 뭐가요…!!
    ja: 何がですか…！？
  event_arcanearchive_04_s_13:
    speaker: arcana
    en: We're in serious trouble here!
    ko: 진짜 큰일 난다니까요?!
    ja: 本当に大変なことになりますよ！？
  event_arcanearchive_04_s_14:
    speaker: arcana
    en: Do you have any idea how dangerous these people a... Gah!
    ko: 저분들 얼마나 무서운 분들인… 꺅.
    ja: この方たちが、どれほど恐ろしいか…きゃっ。
  event_arcanearchive_04_s_15:
    speaker: "<Monologue>"
    en: I grab Arcana's wrist, pull her back, and step forward.
    ko: 아르카나의 손목을 잡아 뒤로 당기고, 앞으로 나섰다.
    ja: アルカナの手首を引っ張り、一歩前に出た
  event_arcanearchive_04_s_16:
    speaker: "<Self>"
    en: Hel... gah!
    ko: 안녕… 으앗?!
    ja: やあ、ふたりと…うわっ！？
  event_arcanearchive_04_s_17:
    speaker: arcana
    en: Listen to what I'm telling you!!!
    ko: 말 좀 들어요!!!
    ja: 言うことを聞いてください！！
  event_arcanearchive_04_s_18:
    speaker: "<Monologue>"
    en: Arcana is grabbing me by the pants and yanking me backward.
    ko: "…아르카나는 말 그대로, 내 바짓가랑이를 붙잡고 늘어지고 있다."
    ja: |-
      …アルカナは、私のズボンの股下を
      思いっきりつかみながら引っ張っている
  event_arcanearchive_04_s_19:
    speaker: arcana
    en: You're gonna get yourself killed!
    ko: 그러다 진짜 죽는다니까요?!
    ja: 本当に死んじゃいますってば！
  event_arcanearchive_04_s_20:
    speaker: arcana
    en: They're gonna knock your block off!
    ko: 머리에 뿅 하고 구멍이 난다구요!!!
    ja: 頭に穴が開いちゃいます！！
  event_arcanearchive_04_s_21:
    speaker: k
    en: Wait. What is this?
    ko: 아니. 뭐야 또 이건.
    ja: 何だこりゃ。
  event_arcanearchive_04_s_22:
    speaker: k
    en: What are you doing here?
    ko: 네가 왜 여기에 있어?
    ja: どうしてお前がここにいるんだ？
  event_arcanearchive_04_s_23:
    speaker: d_w
    en: Honey?
    ko: "…여보?"
    ja: "…あら、あなた？"
  event_arcanearchive_04_s_24:
    speaker: "<Narration>"
    en: Arcana promptly stops yanking me backwards and bolts upright.
    ko: 벌떡.
    ja: バッ
  event_arcanearchive_04_s_25:
    speaker: arcana
    en: Honey?!
    ko: 여보?!
    ja: あ、あなた！？
  event_arcanearchive_04_s_26:
    speaker: arcana
    en: Are you two an item?
    ko: 그쪽, 유부남이었어요?!
    ja: 指揮官様って、既婚者だったんですか！？
  event_arcanearchive_04_s_27:
    speaker: "<Self>"
    en: N-no, that's not...
    ko: 아, 아니. 그게 아니라….
    ja: い、いや。そうではなく…
  event_arcanearchive_04_s_28:
    speaker: d_w
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_29:
    speaker: "<Self>"
    en: It's complicated.
    ko: "…설명하기 좀 복잡해."
    ja: "…少し、複雑な事情があってな"
  event_arcanearchive_04_s_30:
    speaker: arcana
    en: Complicated?!
    ko: 보, 복잡한 관계…?!
    ja: ふ、複雑な関係…！？
  event_arcanearchive_04_s_31:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_32:
    speaker: d_w
    en: We were out on a mission, but dropped everything because we got an intruder
      alert.
    ko: "…특급 침입자 경보가 떨어져서 임무 중에 바로 달려왔는데."
    ja: |-
      …侵入者がいるという警報を聞きつけて、
      任務中に駆けつけたんだが…
  event_arcanearchive_04_s_33:
    speaker: d_w
    en: I never imagined
    ko: 침입자가 여보….
    ja: しかし、まさか侵入者があなた…
  event_arcanearchive_04_s_34:
    speaker: d_w
    en: it'd be you, Honey.
    ko: "…너일 줄은 몰랐네."
    ja: "…お前とは思わなかった。"
  event_arcanearchive_04_s_35:
    speaker: k
    en: You shouldn't have come here.
    ko: 쯧. 하필이면 이런 데에 기어 들어오다니.
    ja: |-
      チッ。よりによってこんなところに
      入り込むとはね～？
  event_arcanearchive_04_s_36:
    speaker: k
    en: It's unfortunate that it has to end this way, especially since we had some
      good times in the past—huh?
    ko: 그동안 나름대로 즐거웠… 엥?
    ja: |-
      お前とも今日でオサラバだな。
      今までそれなりに楽しかっ…あん？
  event_arcanearchive_04_s_37:
    speaker: "<Monologue>"
    en: D and K each put their hand on their ear as if receiving a communication.
    ko: 통신을 하는듯, D와 K는 한동안 귓가에 손을 대고 있었다.
    ja: |-
      通信をしているのか、
      DとKはしばらく耳元に手を当てていた
  event_arcanearchive_04_s_38:
    speaker: k
    en: Stand down?
    ko: "…대기 명령?"
    ja: "…待機命令？"
  event_arcanearchive_04_s_39:
    speaker: k
    en: Call off termination?
    ko: 최종 처분 허가가 아니라?
    ja: 最終処分の許可じゃなくて？
  event_arcanearchive_04_s_40:
    speaker: "<Self>"
    en: Termination?!
    ko: 최종 처분…?
    ja: 最終処分…？
  event_arcanearchive_04_s_41:
    speaker: d_w
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_42:
    speaker: "<Choice>"
    en: Do you mean to tell me I just nearly got offed?
    ko: "…혹시 나 방금 죽을 뻔한 거야?"
    ja: "…もしかして、私は危ないところだったのか？"
  event_arcanearchive_04_s_43:
    speaker: "<Choice>"
    en: Can someone please tell me what's going on?
    ko: "…무슨 일인지 설명 좀 해줄래?"
    ja: "…どういうことか説明してくれないか？"
  event_arcanearchive_04_s_44:
    speaker: d_w
    en: Correct.
    ko: 맞아.
    ja: そうだ。
  event_arcanearchive_04_s_45:
    speaker: d_w
    en: 'I''ll tell you what''s going on: You just came this close to losing your
      life.'
    ko: 죽을 뻔한 거야.
    ja: あと一歩で死ぬところだった、ということだ。
  event_arcanearchive_04_s_46:
    speaker: k
    en: What utter nonsense...
    ko: 아니 이게 무슨 말도 안 되는….
    ja: そんな、ふざけたことって…
  event_arcanearchive_04_s_47:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_48:
    speaker: d_w
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_49:
    speaker: k
    en: Did you hear the orders?
    ko: 들었냐?
    ja: 聞いたか？
  event_arcanearchive_04_s_50:
    speaker: d_w
    en: Yes.
    ko: 응.
    ja: ああ。
  event_arcanearchive_04_s_51:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_arcanearchive_04_s_52:
    speaker: d_w
    en: Situation all clear. Resuming previous mission.
    ko: 상황 종료. 나는 임무로 복귀하겠어.
    ja: 状況終了。私は任務に戻る。
  event_arcanearchive_04_s_53:
    speaker: d_w
    en: I'll let you do the explaining.
    ko: 설명은 맡긴다.
    ja: 説明は任せた。
  event_arcanearchive_04_s_54:
    speaker: "<Monologue>"
    en: As D passes by, she stops for a moment and leans in close to my ear.
    ko: 지나쳐 가던 D가 걸음을 멈추고, 귓가에 얼굴을 가까이했다.
    ja: |-
      通り過ぎようとしたDが歩みを止め、
      私の耳元に顔を近づけた
  event_arcanearchive_04_s_55:
    speaker: d_w
    en: Honey.
    ko: "…왕관의 무게."
    ja: "…王冠の重さ。"
  event_arcanearchive_04_s_56:
    speaker: d_w
    en: If you consult the materials in this place,
    ko: 여기에 있는 것들을 참고하면, 이겨내는 데에 도움이 될 거예요.
    ja: |-
      ここにあるものを紐解けば、
      その重さを乗り越えるのに
      役立つかもしれませんよ。
  event_arcanearchive_04_s_57:
    speaker: d_w
    en: perhaps the crown upon your head won't weigh so heavily.
    ko: 여보.
    ja: あなた。
  event_arcanearchive_04_s_58:
    speaker: k
    en: What the... does she think I was sitting around twiddling my thumbs before
      this?
    ko: 아니 누구는 놀고 있었던 줄 아나.
    ja: はぁ？こっちだってヒマじゃないんだけど？
  event_arcanearchive_04_s_59:
    speaker: k
    en: I was in the middle of a mission too!
    ko: 나도 임무 중이었다고!
    ja: 任務中だったのはお互い様だろ！
  event_arcanearchive_04_s_60:
    speaker: k
    en: I had finally managed to infiltrate another location, which was no small feat,
      but had to drop everything in order to come running over here.
    ko: 겨우 잠입해서 본격적으로 시작하려다 다 내팽개치고 왔는데 진짜.
    ja: |-
      ようやく潜入して、
      さあ始めるかってところで呼び出されて…
  event_arcanearchive_04_s_61:
    speaker: "<Self>"
    en: K.
    ko: "…K."
    ja: "…K"
  event_arcanearchive_04_s_62:
    speaker: k
    en: What?
    ko: 왜.
    ja: 何だよ？
  event_arcanearchive_04_s_63:
    speaker: "<Self>"
    en: An explanation. Please.
    ko: 설명 좀 부탁할게.
    ja: 説明を頼む
  event_arcanearchive_04_s_64:
    speaker: k
    en: Bah. If it weren't for that order, I would just leave.
    ko: 아 씨. 명령만 아니었어도 그냥 가는데.
    ja: はぁ…命令じゃなけりゃ、無視できんのに。
  event_arcanearchive_04_s_65:
    speaker: k
    en: "..."
    ko: "…그러니까."
    ja: "…要するに～"
  event_arcanearchive_04_s_66:
    speaker: k
    en: This is a top-secret facility, where any unauthorized intruders are liable
      to get their head lopped off.
    ko: 여기는 비관계자가 들어오면 바로 목 날아가는 특급 기밀 시설이라서.
    ja: |-
      ここは関係者以外のニンゲンが
      足を踏み入れた時点で
      すぐに首が飛ぶ最高の機密施設なワケ。
  event_arcanearchive_04_s_67:
    speaker: k
    en: Arcana is the administrator, and she's the only one who can enter this place.
    ko: 원래 저기 아르카나가 관리자고, 쟤만 출입할 수 있거든?
    ja: |-
      アルカナはここの管理者で、
      基本こいつしか出入りできないってのに…
  event_arcanearchive_04_s_68:
    speaker: k
    en: That is, until now. You were just granted authorization.
    ko: 그런데 방금 너한테도 출입 허가가 내려졌어.
    ja: |-
      それなのに、どういうワケか
      たった今お前にも許可が出たんだよ。
  event_arcanearchive_04_s_69:
    speaker: "<Self>"
    en: And what does that mean?
    ko: "…그래서?"
    ja: つまり…？
  event_arcanearchive_04_s_70:
    speaker: k
    en: You can read the information contained here, or whatever else you want.
    ko: 여기서 정보를 열람하든, 살림을 차리든.
    ja: |-
      ここで情報を閲覧してもいいし、
      ここで暮らしてもいい。
  event_arcanearchive_04_s_71:
    speaker: k
    en: You could live in here for all I care.
    ko: 네 맘대로 해도 된다고.
    ja: お前の好きにしな。
  event_arcanearchive_04_s_72:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_73:
    speaker: "<Self>"
    en: What exactly is this place?
    ko: "…여기가 뭐 하는 곳인데?"
    ja: "…ここは何のための場所なんだ？"
  event_arcanearchive_04_s_74:
    speaker: k
    en: "..."
    ko: 뭐….
    ja: それは…
  event_arcanearchive_04_s_75:
    speaker: "<Monologue>"
    en: Momentarily at a loss for words, K soon comes back to her senses.
    ko: 한동안 말을 잇지 못하던 K가 다시 정신을 차렸다.
    ja: |-
      Kは一瞬言葉を詰まらせたが、
      すぐにこちらへと向き直った
  event_arcanearchive_04_s_76:
    speaker: k
    en: Before I say anything more, I want to know something.
    ko: "…일단 한 번 물어본다."
    ja: "…一応聞くけど。"
  event_arcanearchive_04_s_77:
    speaker: k
    en: When you came in here, did you have any idea what kind of place this was?
    ko: 너. 여기 뭐 하는 곳인지도 모르고 들어왔냐?
    ja: お前、ここがどんな場所かも知らずに来たのか？
  event_arcanearchive_04_s_78:
    speaker: "<Choice>"
    en: No.
    ko: 응.
    ja: ああ
  event_arcanearchive_04_s_79:
    speaker: "<Choice>"
    en: Isn't it a library?
    ko: 도서관 아냐?
    ja: 図書館じゃないのか？
  event_arcanearchive_04_s_80:
    speaker: k
    en: "..."
    ko: 뭐 이런….
    ja: "……"
  event_arcanearchive_04_s_81:
    speaker: "<Self>"
    en: My coming here was more accidental than anything, honestly.
    ko: 근데 진짜로 몰라. 어쩌다가 들어오게 된 거라.
    ja: |-
      本当に知らないんだ。
      アルカナを追って偶然来てしまっただけで…
  event_arcanearchive_04_s_82:
    speaker: k
    en: "*Sigh*..."
    ko: 하….
    ja: はぁ…
  event_arcanearchive_04_s_83:
    speaker: "<Self>"
    en: I'm sorry. I didn't mean to upset you.
    ko: "…미안. 화나게 하려던 건 아니었어."
    ja: "…すまない。怒らせるつもりはなかったんだが…"
  event_arcanearchive_04_s_84:
    speaker: k
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_85:
    speaker: k
    en: I'm not angry.
    ko: 화난 게 아니야.
    ja: 怒ってんじゃない。
  event_arcanearchive_04_s_86:
    speaker: k
    en: I was just reflecting back on my life.
    ko: 그동안의 내 삶을 돌아봤던 거지.
    ja: ちょっと自分の人生を振り返ってただけだ。
  event_arcanearchive_04_s_87:
    speaker: "<Self>"
    en: Why?
    ko: 왜?
    ja: なぜ…？
  event_arcanearchive_04_s_88:
    speaker: k
    en: Because the same action has led to different results.
    ko: "…같은 행동에 다른 결과가 따르니까."
    ja: "…同じ行動で別の結果が生まれるんだなって。"
  event_arcanearchive_04_s_89:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_s_90:
    speaker: k
    en: I'm not in the mood to explain this to you.
    ko: 복잡한 얘기는 됐고.
    ja: まっ、んな話は置いといて。
  event_arcanearchive_04_s_91:
    speaker: k
    en: I don't know the specifics about this place myself, so I'll leave the explanations
      to Arcana.
    ko: 나도 자세한 건 모르니까, 여기에 대해서는 쟤한테 설명 들어.
    ja: |-
      私も詳しいことは知らないから、
      詳しくはそいつから説明してもらいな～
  event_arcanearchive_04_s_92:
    speaker: k
    en: I've got to get go... Good grief, what is it now?
    ko: 그럼 나 간… 아이씨, 또 뭐야?
    ja: じゃあ、私も失礼…ちっ、今度は何だ？
  event_arcanearchive_04_s_93:
    speaker: "<Monologue>"
    en: K once again touches her ear and grimaces.
    ko: 다시 귓가에 손을 댄 K가 인상을 찌푸렸다.
    ja: 再び耳元に手を当てたKが顔をしかめた
  event_arcanearchive_04_s_94:
    speaker: k
    en: It's a message from I.
    ko: "[I]로부터의 전언."
    ja: "…「I」からの伝言だ。"
  event_arcanearchive_04_s_95:
    speaker: k
    en: She says to check your phone.
    ko: "…핸드폰 확인해 보란다."
    ja: "…携帯を確認しろってさ。"
  event_arcanearchive_04_s_96:
    speaker: "<Self>"
    en: My phone?
    ko: 핸드폰?
    ja: 携帯？
  event_arcanearchive_04_s_97:
    speaker: "<Monologue>"
    en: Upon taking out my phone, I see there's a message.
    ko: 핸드폰을 꺼내 화면을 켜자, 메시지가 하나 도착해 있다.
    ja: |-
      携帯電話を取り出して画面を見ると、
      メッセージが1件届いていた
  event_arcanearchive_04_s_98:
    speaker: "<Narration>"
    en: '"Always act in a tactical manner."'
    ko: "[항상 택티컬하게 행동하도록.]"
    ja: "「常にタクティカルに行動すること」"
  event_arcanearchive_04_s_99:
    speaker: "<Self>"
    en: "..."
    ko: "………."
    ja: "……"
event_arcanearchive_04_e:
  event_arcanearchive_04_e_1:
    speaker: "<Monologue>"
    en: Soon after K leaves,
    ko: 잠시 후 K까지 떠나고 나서야.
    ja: しばらくして、Kも立ち去ったあと…
  event_arcanearchive_04_e_2:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩.
    ja: ドサッ
  event_arcanearchive_04_e_3:
    speaker: "<Monologue>"
    en: Arcana exhales in relief and plops to the ground.
    ko: 아르카나는 안도의 한숨을 내쉬며 바닥에 주저앉았다.
    ja: |-
      アルカナは安堵のため息をつきながら
      地面に座り込んだ
  event_arcanearchive_04_e_4:
    speaker: arcana
    en: My goodness...
    ko: 하아아아아아아아….
    ja: はぁぁぁぁ…
  event_arcanearchive_04_e_5:
    speaker: arcana
    en: I think I just shaved 10 years off my life.
    ko: 십년감수 했네에에에에….
    ja: 死ぬかと思ったぁぁぁぁ…
  event_arcanearchive_04_e_6:
    speaker: "<Self>"
    en: Thank you.
    ko: 고마워.
    ja: ありがとう
  event_arcanearchive_04_e_7:
    speaker: arcana
    en: Huh?
    ko: "…어?"
    ja: "…えっ？"
  event_arcanearchive_04_e_8:
    speaker: "<Self>"
    en: What are you so surprised for?
    ko: 왜?
    ja: "…？どうかしたか？"
  event_arcanearchive_04_e_9:
    speaker: arcana
    en: I didn't expect you to be thanking me.
    ko: "…고맙다고 할 줄은 몰랐어요."
    ja: "…お礼を言われるとは思いませんでした。"
  event_arcanearchive_04_e_10:
    speaker: "<Self>"
    en: You tried to protect me back there.
    ko: 아까 어떻게든 날 지키려고 해줬잖아.
    ja: |-
      さっき、必死に私を守ろうと
      してくれたじゃないか
  event_arcanearchive_04_e_11:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_12:
    speaker: arcana
    en: You haven't done anything wrong.
    ko: 그쪽은 아무 잘못 없잖아요.
    ja: だって、あなたは何も悪いことをしてません。
  event_arcanearchive_04_e_13:
    speaker: arcana
    en: You're just trying to help me, and got mixed up in all this as a result.
    ko: 그냥 나 도와주려고 하다가 말려든 건데.
    ja: |-
      ただ私の記憶を取り戻す手伝いをしようとして、
      巻き込まれただけ。
  event_arcanearchive_04_e_14:
    speaker: arcana
    en: You should hardly have to die because of that.
    ko: "…사람이 그런 이유로 죽으면 안 되잖아."
    ja: "…そんな理由で、死なせるわけにはいきません。"
  event_arcanearchive_04_e_15:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_16:
    speaker: "<Self>"
    en: I see. Thank you.
    ko: 그렇구나. 고마워.
    ja: そうか、ありがとう
  event_arcanearchive_04_e_17:
    speaker: arcana
    en: You're making me uncomfortable. I just did what needed to be done.
    ko: 나, 낯간지러우니까 그러지 마요. 그냥 할 일 한 건데 뭐.
    ja: |-
      て、照れくさいのでやめてください！
      すべきことをしたまでです。
  event_arcanearchive_04_e_18:
    speaker: arcana
    en: How the heck do you know members of Perilous Siege, anyway?
    ko: "…그런데 시지 패러리스 분들과는 어떻게 아는 사이에요?"
    ja: |-
      …ところで、シージペリラスの方たちと
      お知り合いだったんですか？
  event_arcanearchive_04_e_19:
    speaker: arcana
    en: Are you a...?
    ko: 그쪽 혹시….
    ja: あなたって、もしかして…
  event_arcanearchive_04_e_20:
    speaker: "<Self>"
    en: Yes, I'm a...
    ko: 맞아. 나는….
    ja: "…ああ、私は…"
  event_arcanearchive_04_e_21:
    speaker: arcana
    en: An assassin?
    ko: 진짜로 암살자?
    ja: 本当に殺し屋だったんですか！？
  event_arcanearchive_04_e_22:
    speaker: arcana
    en: You do seem to be the type, I guess.
    ko: 음. 잘 어울리는 것 같기도 하고….
    ja: う～ん、よく見ればそれっぽいような…
  event_arcanearchive_04_e_23:
    speaker: "<Self>"
    en: "... I'm a commander. I've told you that already."
    ko: "…지휘관이라고 했잖아."
    ja: "…指揮官だと言っただろう？"
  event_arcanearchive_04_e_24:
    speaker: arcana
    en: Oh. Right.
    ko: 아 맞다.
    ja: あっ、そうでした。
  event_arcanearchive_04_e_25:
    speaker: arcana
    en: Hold on, What's a commander from the Ark doing fraternizing with Nikkes from
      Perilous Siege?
    ko: 가 아니라.
    ja: "…って、そうじゃなくて！"
  event_arcanearchive_04_e_26:
    speaker: arcana
    en: That makes it even weirder!
    ko: 방주 지휘관이 시지 패러리스 소속 니케를 아는 게 더 이상한데요?
    ja: |-
      アークの指揮官がシージペリラスと
      お知り合いなんて、ヘンじゃありませんか？
  event_arcanearchive_04_e_27:
    speaker: "<Self>"
    en: It does?
    ko: 그… 런가?
    ja: そう…なのか？
  event_arcanearchive_04_e_28:
    speaker: arcana
    en: Yes!
    ko: 그… 렇죠?
    ja: えっ…そうじゃありませんか？
  event_arcanearchive_04_e_29:
    speaker: arcana
    en: Usually, anyone who crosses paths with them doesn't live to tell the tale.
    ko: 보통 아는 순간이 죽는 순간 아닌가?
    ja: 普通、知った瞬間に殺されるものでは？
  event_arcanearchive_04_e_30:
    speaker: arcana
    en: After all, they were apparently planning to bump you off initially.
    ko: 방금 전 처럼요.
    ja: まさにさっきが、そんな感じでしたよね？
  event_arcanearchive_04_e_31:
    speaker: "<Self>"
    en: Don't remind me...
    ko: "…그, 그렇겠네."
    ja: "…そ、そうだな"
  event_arcanearchive_04_e_32:
    speaker: arcana
    en: Hmm...
    ko: 흐음….
    ja: うーん…
  event_arcanearchive_04_e_33:
    speaker: "<Self>"
    en: How do you know D and K?
    ko: 그런데 아르카나야말로 D랑 K를 어떻게 알아?
    ja: |-
      アルカナこそ、
      どうしてDとKを知っているんだ？
  event_arcanearchive_04_e_34:
    speaker: arcana
    en: This library,
    ko: 아, 그건요.
    ja: あ、それはですね。
  event_arcanearchive_04_e_35:
    speaker: arcana
    en: or this precise location, rather...
    ko: 도서관, 정확히는 요기.
    ja: 図書館…正確には、この場所。
  event_arcanearchive_04_e_36:
    speaker: "<Monologue>"
    en: Arcana points to the ground.
    ko: 아르카나는 바닥을 가리켰다.
    ja: アルカナが床を指さした
  event_arcanearchive_04_e_37:
    speaker: arcana
    en: Perilous Siege handles security for the top-secret archive.
    ko: 특급 기밀 보관소 보안은 시지 패러리스 분들 담당이거든요.
    ja: |-
      機密保管庫のセキュリティは、
      シージペリラスの担当なんです。
  event_arcanearchive_04_e_38:
    speaker: arcana
    en: As such, I've had the... pleasure of running into them a handful of times.
    ko: "…몇 번 뵐 일이 있었어요."
    ja: "…なので、何度かお会いしたことがありまして。"
  event_arcanearchive_04_e_39:
    speaker: "<Self>"
    en: "... I see."
    ko: "…으, 응."
    ja: "…そうだったのか"
  event_arcanearchive_04_e_40:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_41:
    speaker: "<Monologue>"
    en: In an attempt to lighten the suddenly dour mood, I change the subject.
    ko: 급격히 어두워지는 분위기를 돌리려 다른 할 말을 찾았다.
    ja: |-
      急に暗くなった雰囲気を紛らわそうと、
      私は他の話題を探した
  event_arcanearchive_04_e_42:
    speaker: "<Self>"
    en: Can you tell me more about your memory coming back?
    ko: 그… 기억은 어떻게 돌아온 거야?
    ja: その…どうして記憶が戻ったんだ？
  event_arcanearchive_04_e_43:
    speaker: arcana
    en: Well,
    ko: 앗. 그게요.
    ja: あっ、それなんですが…
  event_arcanearchive_04_e_44:
    speaker: arcana
    en: before I opened the door, I remember mumbling something.
    ko: 아까 왜, 여기 문 열기 전에 제가 뭐라고 중얼거렸잖아요?
    ja: |-
      さっき、ここに続く扉を開ける前に
      私が何かつぶやいてましたよね？
  event_arcanearchive_04_e_45:
    speaker: "<Self>"
    en: Yeah, "Death" and "Rebirth". Stuff like that.
    ko: 죽음, 재탄생 뭐 그런 거였던 것 같은데.
    ja: ああ、そうだな
  event_arcanearchive_04_e_46:
    speaker: arcana
    en: Yes, those words act like triggers. Kind of like a form of self-suggestion.
    ko: 네. 그게 트리거거든요. 자기암시 같은 거라고 해야 하나?
    ja: |-
      それが記憶を取り戻すトリガーなんです。
      自己暗示…みたいなものと言いますか。
  event_arcanearchive_04_e_47:
    speaker: arcana
    en: Whenever I come here to work, I recite those words, and voila!
    ko: 일할 시간이 돼서 여기 들어와야 할 때 딱 외워주면.
    ja: |-
      仕事の時間になって、
      ここに来るべき時に唱えると…
  event_arcanearchive_04_e_48:
    speaker: arcana
    en: I remember everything that's happened in here.
    ko: 짠~ 안에서 있었던 일이 전부 기억난답니다.
    ja: |-
      ジャジャーン！
      なんと、この中で起きた出来事を
      すべて思い出せちゃうんです！
  event_arcanearchive_04_e_49:
    speaker: arcana
    en: It's super convenient. Sure, the very fact that I regain those memories means
      I have to get them wiped again once I'm done working, but that's not such a
      big deal.
    ko: |-
      엄청 편해요.
      지우는 건 못해서 기억 소거는 따로 받아야 하긴 해도 이게 어디야.
    ja: |-
      とっても便利なんですよ～
      ただ、思い出せても消すことはできないので、
      記憶を消す必要はあるんですけどね。
  event_arcanearchive_04_e_50:
    speaker: "<Self>"
    en: That actually works?
    ko: "…그게 돼?"
    ja: "…そんなことができるのか？"
  event_arcanearchive_04_e_51:
    speaker: arcana
    en: It sure does.
    ko: 되죠.
    ja: できます。
  event_arcanearchive_04_e_52:
    speaker: arcana
    en: Since I'm a Nikke.
    ko: 니케니까.
    ja: 私は、ニケなので。
  event_arcanearchive_04_e_53:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_54:
    speaker: arcana
    en: This time was an exception to the rule, what with me losing all of my memory
      and then regaining it all.
    ko: 뭐… 이번에는 좀 꼬여서 전~부 잊었다가 전~부 기억나 버렸지만,
    ja: |-
      まあ、今回はちょっとした
      アクシデントがあったせいで、
      全部忘れてから思い出すことになりましたけど…
  event_arcanearchive_04_e_55:
    speaker: arcana
    en: Normally I don't experience any major issues like that.
    ko: 평소에는 별문제 없었는걸요?
    ja: 普段は特に問題なかったんですよ？
  event_arcanearchive_04_e_56:
    speaker: "<Self>"
    en: You did this time.
    ko: 이번에는 문제가 생겼잖아.
    ja: "…だが、今回は問題が起きただろう？"
  event_arcanearchive_04_e_57:
    speaker: arcana
    en: Hehe.
    ko: 헤헷.
    ja: えへっ。
  event_arcanearchive_04_e_58:
    speaker: "<Monologue>"
    en: Arcana puts on a not entirely convincing innocent smile, then approaches me
      and links her arm with mine.
    ko: 아르카나는 웃으며 딴청을 부리다가, 내게 다가와 팔짱을 끼웠다.
    ja: |-
      アルカナは笑ってごまかすと、
      こちらに近づいて腕を組んだ
  event_arcanearchive_04_e_59:
    speaker: arcana
    en: Let's go.
    ko: 그럼 가요.
    ja: では、行きましょっか。
  event_arcanearchive_04_e_60:
    speaker: "<Self>"
    en: Go where?
    ko: "…어디를?"
    ja: "…どこに？"
  event_arcanearchive_04_e_61:
    speaker: arcana
    en: Didn't you hear K? I've got to give you an explanation, don't I?
    ko: 좀 전에 K 님이 얘기했잖아요? 그쪽한테 설명해 주라고.
    ja: |-
      さっき、K様が言ってたじゃないですか。
      私に説明してもらえ～って。
  event_arcanearchive_04_e_62:
    speaker: arcana
    en: I'll give you a tour of the library.
    ko: 도서관 투어, 시켜 드릴게요.
    ja: ということで、図書館ツアーをしましょう！
  event_arcanearchive_04_e_63:
    speaker: "<Monologue>"
    en: We return back to the antique reading room I had briefly seen before.
    ko: 아까 잠깐 봤던, 오래된 열람실에 다시 돌아왔다.
    ja: |-
      先ほど一瞬見かけた、
      年季の入った閲覧室に戻ってきた
  event_arcanearchive_04_e_64:
    speaker: arcana
    en: This is the top-secret archive I was telling you about.
    ko: 여기가 좀 전에 말한 특급 기밀 보관소.
    ja: ここが先ほどお伝えした、機密保管庫です。
  event_arcanearchive_04_e_65:
    speaker: arcana
    en: It may sound intimidating, but as you can see, it's little more than a rundown
      room of books.
    ko: 이름은 무시무시한 주제에 많이 낡았죠?
    ja: 名前こそ立派ですけど、すごく古いでしょう？
  event_arcanearchive_04_e_66:
    speaker: "<Self>"
    en: Is this where classified records are stored?
    ko: 비밀 기록을 보관하는 거야?
    ja: |-
      機密性の高い記録が、
      ここに保管されているのか？
  event_arcanearchive_04_e_67:
    speaker: arcana
    en: Yes. If I were to put it simply, you could call this an archive of forbidden
      books.
    ko: 네. 쉽게 말하면… 금서고 같은 느낌?
    ja: |-
      はい。簡単に言うと…
      禁書庫みたいなものでしょうか？
  event_arcanearchive_04_e_68:
    speaker: arcana
    en: Kinda like in fantasy novels
    ko: 그 왜, 판타지 소설 같은 거 보면 나오잖아요.
    ja: |-
      ほら、ファンタジー小説とかで
      よく出てきますよね？
  event_arcanearchive_04_e_69:
    speaker: arcana
    en: when they've got places where they keep dangerous and forbidden knowledge
      or magic.
    ko: 뭔가 아주 위험한 금단의 기록이나 금지된 마법 같은 게 보관되어 있는.
    ja: |-
      恐ろしい禁断の呪文や、
      禁じられた魔法なんかが保管されてる…
  event_arcanearchive_04_e_70:
    speaker: arcana
    en: Although there isn't any forbidden magic here.
    ko: 뭐… 여기에 금지된 마법 같은 건 없지만요.
    ja: |-
      まあ、この世界に禁じられた魔法なんて
      ありませんけど。
  event_arcanearchive_04_e_71:
    speaker: "<Self>"
    en: Then what is in here?
    ko: 그럼 뭐가 있는데?
    ja: じゃあ、ここには何があるんだ？
  event_arcanearchive_04_e_72:
    speaker: arcana
    en: Top-secret records, which are very dangerous.
    ko: 아주 위험한 금단의 기록?
    ja: と～っても恐ろしい禁断の記録、ですかね？
  event_arcanearchive_04_e_73:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_74:
    speaker: arcana
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  event_arcanearchive_04_e_75:
    speaker: "<Monologue>"
    en: Arcana, keeping her arm locked with mine, starts walking further inside the
      reading room.
    ko: |-
      아르카나는 여전히 내 팔짱을 낀 채로,
      열람실 안쪽을 향해 걸음을 옮겼다.
    ja: |-
      アルカナは相変わらず腕を組んだまま、
      閲覧室の奥へと歩き出した
  event_arcanearchive_04_e_76:
    speaker: arcana
    en: It looks similar to the grand reading room in the library, doesn't it?
    ko: 저희 도서관 대열람실이랑 비슷하죠?
    ja: |-
      よ～く見てみると、
      図書館の大閲覧室と似てる気がしませんか？
  event_arcanearchive_04_e_77:
    speaker: arcana
    en: This was the original reading room when the Ark library was first built.
    ko: 예~엣날에 방주 도서관이 처음 세워졌을 때 사용하던 열람실이거든요.
    ja: |-
      むか～し昔、アークに図書館が初めてできた頃に
      使われてた閲覧室なんです。
  event_arcanearchive_04_e_78:
    speaker: arcana
    en: Over the years, the library has undergone numerous expansions and become what
      you see now.
    ko: 도서관은 그다음에 증축을 몇 번 해서 지금의 모습이 됐고,
    ja: それから増築を重ねて図書館は今の姿になり…
  event_arcanearchive_04_e_79:
    speaker: arcana
    en: Meanwhile, this old reading room was reconfigured into a Forbidden Library.
    ko: 구 열람실인 여기는 금서고로 사용 중이죠.
    ja: |-
      旧閲覧室であるこの場所は、
      今では禁書庫として使われてるんです。
  event_arcanearchive_04_e_80:
    speaker: arcana
    en: The most important part of my job is—
    ko: 그리고 제일 중요한, 제가 하는 일은 이 금서고….
    ja: そして、私の最も重要な仕事はこの禁書庫…
  event_arcanearchive_04_e_81:
    speaker: arcana
    en: Oh, Forbidden Library. I like that! That's what I'm gonna call this place
      from now on.
    ko: 아. 앞으로도 계속 금서고라고 불러야겠다. 입에 딱 붙네요.
    ja: |-
      あっ、これからも禁書庫って呼びますね。
      なんだかしっくりきたので！
  event_arcanearchive_04_e_82:
    speaker: arcana
    en: Anyway, my job is to oversee this place.
    ko: |-
      어쨌든.
      제가 하는 일은 이 금서고를 관리하는 일.
    ja: |-
      …ええとつまり、
      私の仕事はこの禁書庫を管理することなんです。
  event_arcanearchive_04_e_83:
    speaker: arcana
    en: Since everything in here is highly classified information, which cannot leave
      this room under any circumstance,
    ko: 그리고 물론. 이 안에 있는 기록들은 전부 절대 밖에 새어나가서는 안 되는 최고 등급 기밀들이기 때문에.
    ja: |-
      当然、ここにある記録はどれも
      流出NGの最高機密の情報なので…
  event_arcanearchive_04_e_84:
    speaker: arcana
    en: I therefore have to get my memories wiped after working. It's the same for
      Phantom and Label with their jobs.
    ko: 저는 팬텀과 레이블처럼, 일을 한 뒤에는 기억 소거를 받아야 해요.
    ja: |-
      私はファントムやレーベルのように、
      仕事の後に記憶消去を受ける必要があるんです。
  event_arcanearchive_04_e_85:
    speaker: "<Self>"
    en: But it's particularly intense for you. A daily occurrence, from what I gather.
    ko: "…매일 한 번씩 받는다고 들었어."
    ja: "…ほぼ毎日受けていると聞いた"
  event_arcanearchive_04_e_86:
    speaker: arcana
    en: Yes. At least.
    ko: 네. 최소한은요.
    ja: |-
      はい、少なくとも
      1日に1回以上は受けてますね。
  event_arcanearchive_04_e_87:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_88:
    speaker: "<Self>"
    en: At least?
    ko: 최소한?
    ja: "…少なくとも？"
  event_arcanearchive_04_e_89:
    speaker: arcana
    en: I once had my memory wiped more than 10 times in a single day.
    ko: 열 번 넘게 받은 적도 있으니까요.
    ja: ええ、1日に10回以上受けたこともあります。
  event_arcanearchive_04_e_90:
    speaker: arcana
    en: For a while there, it negatively affected my work, and things started piling
      up...
    ko: 그, 막 일이 밀리고 꼬이고 난리가 난 적이 있었어서….
    ja: |-
      その、仕事のスケジュールがギチギチになって、
      大変な目に遭った時にそうなったというか…
  event_arcanearchive_04_e_91:
    speaker: arcana
    en: But it wasn't because I was slacking off! Promise!
    ko: 저, 절대로 귀찮아서 미루다가 그런 건 아니니까 오해하기 없기!
    ja: |-
      け、決して面倒でいろいろ先延ばしに
      しちゃったせいとかじゃありませんからね！？
  event_arcanearchive_04_e_92:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_93:
    speaker: arcana
    en: You've got a strange look on your face.
    ko: "…혹시 제가 이상한 얘기 했어요?"
    ja: "…あの、何かヘンなこと言っちゃいました？"
  event_arcanearchive_04_e_94:
    speaker: arcana
    en: Was it something I said?
    ko: 표정이 안 좋은데.
    ja: 顔が暗いような…
  event_arcanearchive_04_e_95:
    speaker: "<Self>"
    en: Are you okay?
    ko: 괜찮은 거야?
    ja: "…大丈夫なのか？"
  event_arcanearchive_04_e_96:
    speaker: arcana
    en: With what?
    ko: 뭐가요?
    ja: 何がですか？
  event_arcanearchive_04_e_97:
    speaker: "<Self>"
    en: Getting your memory wiped that often.
    ko: 그렇게 계속 기억 소거를 받는 거 말이야.
    ja: そんな頻度で記憶消去を何度も受けて…
  event_arcanearchive_04_e_98:
    speaker: arcana
    en: Oh, that?
    ko: 아, 그거요?
    ja: あ、そのことですかぁ。
  event_arcanearchive_04_e_99:
    speaker: arcana
    en: Of course I don't enjoy it. What a silly question.
    ko: 당연히 안 괜찮죠. 그걸 말이라고 해요?
    ja: |-
      もちろん、大丈夫じゃありません。
      当然でしょう？
  event_arcanearchive_04_e_100:
    speaker: "<Self>"
    en: "..."
    ko: 그럼….
    ja: じゃあ…
  event_arcanearchive_04_e_101:
    speaker: arcana
    en: Do you know how annoying it is to shuttle back and forth to Elysion headquarters
      all the time?
    ko: 매번 엘리시온 본사까지 왔다 갔다 하는 게 얼마나 번거로운데요.
    ja: |-
      毎回エリシオン本社まで往復するのって、
      すっごく面倒なんですよ？
  event_arcanearchive_04_e_102:
    speaker: arcana
    en: On top of that, I have to make the trip right after work.
    ko: 심지어 퇴근한 다음에 따로 가야 된다구요.
    ja: |-
      しかも仕事終わりのヘトヘトなタイミングで、
      消しに行かなきゃいけないんですから。
  event_arcanearchive_04_e_103:
    speaker: arcana
    en: I've been asking them to place a memory wipe device in my room or somewhere
      close, but they shot that idea down quick. Said it'd be too difficult to maintain
      the machine that way.
    ko: 그냥 제 방이나 어디에 기억 소거 장치 좀 놔달라고 해도 맨날 보안이니 뭐니.
    ja: |-
      私の部屋に記憶消去の装置を
      置いてくださ～いって頼んでも、
      セキュリティの問題で断られちゃって…
  event_arcanearchive_04_e_104:
    speaker: arcana
    en: Our Boss is a good person, but she is a bit stuck in her ways.
    ko: 저희 사장님 사람은 참 좋은데, 은근 고지식한 부분이 있는 것 같아요.
    ja: |-
      うちの社長、いい人ではあるんですけど
      頑固なところがあるんですよねぇ～
  event_arcanearchive_04_e_105:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_106:
    speaker: arcana
    en: "*Pfft*"
    ko: "……풋."
    ja: "…ぷっ。"
  event_arcanearchive_04_e_107:
    speaker: "<Self>"
    en: What's so funny?
    ko: "…왜?"
    ja: "…何だ？"
  event_arcanearchive_04_e_108:
    speaker: arcana
    en: Nothing, I...
    ko: 아뇨, 그냥….
    ja: いえ、ただ…
  event_arcanearchive_04_e_109:
    speaker: arcana
    en: I was just thinking about what a good person you are.
    ko: 그쪽, 진짜 좋은 사람이다~ 싶어서.
    ja: あなたって、本当にいい人なんだな～って。
  event_arcanearchive_04_e_110:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_04_e_111:
    speaker: arcana
    en: I'm simply doing what's expected of me.
    ko: 제가 해야 하는 일을 하는 것뿐이고,
    ja: 私は自分がすべきことをしてるだけで、
  event_arcanearchive_04_e_112:
    speaker: arcana
    en: The work I do isn't exceptionally painful or difficult.
    ko: 딱히 힘들거나 고통스럽거나 하지는 않으니까.
    ja: |-
      大変だな～とか、つらいな～とか、
      思ってませんからね？
  event_arcanearchive_04_e_113:
    speaker: "<Monologue>"
    en: Arcana playfully pokes my cheek.
    ko: 아르카나가 내 볼을 콕 찔렀다.
    ja: アルカナが私の頬をツンツンした
  event_arcanearchive_04_e_114:
    speaker: arcana
    en: So why don't you turn that frown upside down for me?
    ko: 그렇게 심란한 표정 하지 말기. 응?
    ja: |-
      だからそんな怖い顔、しないでください。
      ねっ？
  event_arcanearchive_04_e_115:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…알았어."
    ja: "…分かった"
  event_arcanearchive_04_e_116:
    speaker: arcana
    en: Good boy. Now then...
    ko: 아이 착하다. 그러면….
    ja: ふふ、いい子ですね。それじゃあ…
  event_arcanearchive_04_e_117:
    speaker: "<Monologue>"
    en: Arcana reaches out her hand.
    ko: 아르카나가 손을 내밀었다.
    ja: アルカナが手を差し出した
  event_arcanearchive_04_e_118:
    speaker: arcana
    en: What do you say we continue with our tour?
    ko: 계속할까요? 구경.
    ja: ツアーを続けましょうか？
event_arcanearchive_05_s:
  event_arcanearchive_05_s_1:
    speaker: "<Monologue>"
    en: Arcana and I make our way down the hallway connected to the reading room.
    ko: 아르카나와 함께 열람실 복도를 걸었다.
    ja: アルカナと共に歩き始めた閲覧室の廊下は…
  event_arcanearchive_05_s_2:
    speaker: "<Monologue>"
    en: Rows of old bookshelves stretch on seemingly infinitely.
    ko: 오래되어 보이는 책장들이 끝없이 이어진다.
    ja: 古そうな本棚が延々と続いている
  event_arcanearchive_05_s_3:
    speaker: "<Self>"
    en: There's so much here...
    ko: 진짜 넓네….
    ja: 本当に広いな…
  event_arcanearchive_05_s_4:
    speaker: arcana
    en: There certainly is.
    ko: 그쵸?
    ja: でしょう？
  event_arcanearchive_05_s_5:
    speaker: arcana
    en: Even so, the library is going to undergo another expansion soon.
    ko: 그런데도 또 증축할 거래요.
    ja: それなのに、また増築するらしいですよ。
  event_arcanearchive_05_s_6:
    speaker: arcana
    en: And this time, it's not to enlarge the area accessible to the public, but
      rather to make the Forbidden Library bigger.
    ko: |-
      심지어 이번에는 대열람실 넓히는 게 아니라,
      여기 금서고 공간이 부족해서.
    ja: |-
      しかも今度は、大閲覧室じゃなくて
      この禁書庫のスペースが
      足りないから～っていう理由で。
  event_arcanearchive_05_s_7:
    speaker: arcana
    en: It makes you wonder why there's so much to hide.
    ko: 다들 뭐 그렇게 숨길 게 많은 건지.
    ja: |-
      ホント、何をそんなに
      隠したがってるんでしょうねぇ。
  event_arcanearchive_05_s_8:
    speaker: "<Self>"
    en: You say that, but...
    ko: 그렇다기에는….
    ja: それにしては…
  event_arcanearchive_05_s_9:
    speaker: "<Monologue>"
    en: From looking at the labels on the bookshelves,
    ko: 지나쳐가는 책장에 붙어 있는 푯말들은.
    ja: 本棚に置かれている書籍の見出しは…
  event_arcanearchive_05_s_10:
    speaker: "<Monologue>"
    en: the contents contained here seem to be harmless records of human history rather
      than sensitive classified information.
    ko: 아무리 봐도 민감한 기밀이 아니라, 인류의 과거 기록 같았다.
    ja: |-
      なにやら重要な機密情報というよりは、
      人類の過去の記録に関する内容のようだった
  event_arcanearchive_05_s_11:
    speaker: "<Self>"
    en: World History, Pop Music, Film...
    ko: "[세계사], [대중가요], [영화]…."
    ja: "「世界史」、「ポピュラーソング」、「映画」…"
  event_arcanearchive_05_s_12:
    speaker: "<Self>"
    en: Is this the kind of information that really has to be kept secret?
    ko: "…이런 것들도 굳이 비밀스럽게 보관해야 돼?"
    ja: |-
      …こんなものを、わざわざ機密情報として
      保管する必要があるのか？
  event_arcanearchive_05_s_13:
    speaker: "<Monologue>"
    en: Below one of the labels which is marked "Theater",
    ko: 더해서 방금 지나친 [희곡]이라는 푯말 아래에는,
    ja: |-
      さらに、今通り過ぎた「戯曲」という
      見出しの下には…
  event_arcanearchive_05_s_14:
    speaker: "<Monologue>"
    en: there is a piece of paper affixed to the bookshelf which reads, "Not for me!".
    ko: "[내 취향 아님!] 이라고 적힌 메모지가 붙어 있다…."
    ja: |-
      「私の好みじゃない！」と書かれた
      付せんが貼られていた
  event_arcanearchive_05_s_15:
    speaker: arcana
    en: Secrets must be protected.
    ko: 비밀은 반드시 지켜야만 하는 것.
    ja: 秘密は、必ず守らなければなりません。
  event_arcanearchive_05_s_16:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_arcanearchive_05_s_17:
    speaker: arcana
    en: It's kind of like our squad's motto.
    ko: 저희 스쿼드의 모토 비슷한 거예요.
    ja: |-
      あっ、今のは私たち部隊の
      モットーみたいなものです。
  event_arcanearchive_05_s_18:
    speaker: "<Self>"
    en: Doesn't it kind of go without saying that secrets should be protected?
    ko: 당연한 말 아냐?
    ja: それは…当然のことじゃないのか？
  event_arcanearchive_05_s_19:
    speaker: arcana
    en: Yes, but the emphasis is on just how necessary it is.
    ko: "[지켜야만]."
    ja: |-
      「守らなければならない」ということは、
      「義務」ってことなんですよ。
  event_arcanearchive_05_s_20:
    speaker: "<Self>"
    en: I see.
    ko: "……아."
    ja: "……！"
  event_arcanearchive_05_s_21:
    speaker: arcana
    en: These books are valuable pieces of human history.
    ko: 저런 기록들은, 인류가 반드시 지켜야 하는 소중한 유산이잖아요?
    ja: |-
      こういった記録も、
      人類が守るべき大切な財産でしょう？
  event_arcanearchive_05_s_22:
    speaker: arcana
    en: When you have something of such immense value, what do you think is the best
      way to protect it?
    ko: 그런 소중한 걸 지키는 가장 좋은 방법이 뭘까요?
    ja: |-
      そんな大切なものを守るうえで、
      一番いい方法は何だと思いますか？
  event_arcanearchive_05_s_23:
    speaker: "<Self>"
    en: "... Let no one know of its existence."
    ko: "…다른 누구도 그 존재를 모르게 한다."
    ja: "…誰にもその存在を教えない"
  event_arcanearchive_05_s_24:
    speaker: arcana
    en: Precisely.
    ko: 네. 존재를 모르면 빼앗거나 부술 생각조차 할 수 없으니까.
    ja: ふふ、正解です。
  event_arcanearchive_05_s_25:
    speaker: arcana
    en: No one will steal them or desecrate them if they don't know they exist.
    ko: 그런 거예요.
    ja: |-
      存在さえ知られなければ、
      奪われたり壊されたりする心配も
      ありませんから。
  event_arcanearchive_05_s_26:
    speaker: "<Self>"
    en: Kind of ironic when you think about it.
    ko: "…아이러니하네."
    ja: "…皮肉な話だな"
  event_arcanearchive_05_s_27:
    speaker: arcana
    en: Very much so.
    ko: 아이러니하죠.
    ja: ですよね～
  event_arcanearchive_05_s_28:
    speaker: arcana
    en: Although... our founder saw things a bit differently.
    ko: 뭐… 그래도 저희 창립자님 생각은 조금 다르셨던 것 같지만요.
    ja: |-
      まあ…ここの創設者は、
      少し違う考えだったみたいですけど。
  event_arcanearchive_05_s_29:
    speaker: "<Self>"
    en: Founder?
    ko: 창립자?
    ja: 創設者？
  event_arcanearchive_05_s_30:
    speaker: arcana
    en: The man who both created the Best Seller Squad and entrusted us with overseeing
      the library.
    ko: 네. 저희 베스트셀러 스쿼드를 만들고, 도서관 관리를 맡기신 분이 있어요.
    ja: |-
      はい。ベストセラー部隊を作り、
      私たちに図書館の管理を命じた方です。
  event_arcanearchive_05_s_31:
    speaker: arcana
    en: I heard he retired from his previous line of work and went on to become the
      library director.
    ko: 다른 일 하시다가 은퇴하고 도서관 관장으로 부임하셨다고 하거든요.
    ja: |-
      他の仕事を引退されてから、
      図書館の館長として就任されたそうですよ。
  event_arcanearchive_05_s_32:
    speaker: "<Self>"
    en: What about now?
    ko: 지금은?
    ja: 今はどうしているんだ？
  event_arcanearchive_05_s_33:
    speaker: arcana
    en: Now... I guess you could say the position is vacant.
    ko: 지금은 공석… 이라고 해야 하나?
    ja: 今は、空席…と言うべきでしょうか。
  event_arcanearchive_05_s_34:
    speaker: arcana
    en: At the moment, our squad oversees everything here.
    ko: 그냥 저희 스쿼드가 다 맡아서 하고 있어요.
    ja: |-
      創設者の代わりに、
      私たちがいろいろと任されてる感じなんです。
  event_arcanearchive_05_s_35:
    speaker: arcana
    en: The founder stepped away a long time ago.
    ko: 그분은 오래전에 물러나셨거든요.
    ja: その方は、ずっと前に引退されたので。
  event_arcanearchive_05_s_36:
    speaker: "<Self>"
    en: What kind of person was he?
    ko: 어떤 사람이었어?
    ja: どんな人だったんだ？
  event_arcanearchive_05_s_37:
    speaker: arcana
    en: I don't know.
    ko: 몰라요.
    ja: 分かりません。
  event_arcanearchive_05_s_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_39:
    speaker: arcana
    en: You don't have to look at me like that.
    ko: 그, 그렇게 한심하게 보지 말아 줄래요?
    ja: そ、そんな呆れた顔で見ないでくれます？
  event_arcanearchive_05_s_40:
    speaker: arcana
    en: The reason I don't know is because I never met him.
    ko: 진짜 한 번도 본 적 없어서 그런 거니까.
    ja: |-
      仕方ないじゃないですか、
      一度も会ったことがないんですから。
  event_arcanearchive_05_s_41:
    speaker: "<Self>"
    en: Really?
    ko: 그래?
    ja: そうなのか？
  event_arcanearchive_05_s_42:
    speaker: arcana
    en: Of course not. He was around during the time of Operation Ark Guardian.
    ko: 당연하죠! 그분은 아크 가디언 작전 때 분이신데요!
    ja: |-
      そうですよ！だってその方は、
      アークガーディアン作戦の頃の方なんですから！
  event_arcanearchive_05_s_43:
    speaker: arcana
    en: I've been in this squad for a while, but not that long.
    ko: 저는 저희 스쿼드 들어온 지 그렇게 오래 안 됐다구요.
    ja: |-
      私はこの部隊に入ってからまだそれほど
      経ってないので、面識がないのも当然です。
  event_arcanearchive_05_s_44:
    speaker: "<Self>"
    en: Sorry, I thought you'd been here from the start.
    ko: "…미안. 아르카나도 처음부터 일한 줄 알았어."
    ja: |-
      …すまない。
      てっきり、アルカナも最初からいたのかと…
  event_arcanearchive_05_s_45:
    speaker: arcana
    en: I'm not that old, you know.
    ko: 저 그렇게 나이 안 많거든요?
    ja: |-
      もうっ。
      私、そこまでお年寄りじゃありませんよ？
  event_arcanearchive_05_s_46:
    speaker: arcana
    en: I'm the 17th one.
    ko: 17번째란 말이에요, 저는.
    ja: これでも17代目なんですからね。
  event_arcanearchive_05_s_47:
    speaker: "<Self>"
    en: 17th what?
    ko: 17번째?
    ja: 17代目？
  event_arcanearchive_05_s_48:
    speaker: arcana
    en: Manager of this Forbidden Library.
    ko: 17번째 금서고 관리자라는 뜻.
    ja: はい、17代目の禁書庫の管理者ってことです。
  event_arcanearchive_05_s_49:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_50:
    speaker: "<Self>"
    en: What happened to the previous managers?
    ko: 그럼 그 전의 관리자들은….
    ja: じゃあ、その前の管理者たちは…
  event_arcanearchive_05_s_51:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_52:
    speaker: arcana
    en: Do you remember what the doctor said before?
    ko: "…아까 의사 선생님이 한 말, 기억나요?"
    ja: "…さっきのお医者さんの言葉、覚えてますか？"
  event_arcanearchive_05_s_53:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_arcanearchive_05_s_54:
    speaker: mary
    en: Yes.
    ko: 네.
    ja: はい。
  event_arcanearchive_05_s_55:
    speaker: mary
    en: We call this a Mind Switch.
    ko: 우리는 그걸, 사고 전환이라고 부르죠.
    ja: 私たちはそれを、思考転換と呼んでいます。
  event_arcanearchive_05_s_56:
    speaker: arcana
    en: There you go, making that face again.
    ko: "…또 그 표정."
    ja: "…またその顔。"
  event_arcanearchive_05_s_57:
    speaker: arcana
    en: I shouldn't have said anything.
    ko: 괜히 말했네요. 그냥 비밀로 할걸.
    ja: |-
      う～ん、やっぱり言わないほうが
      よかったですかね？
  event_arcanearchive_05_s_58:
    speaker: "<Self>"
    en: I know I keep asking you this, but...
    ko: "…아까도 물어봤지만."
    ja: "…さっきも聞いたが…"
  event_arcanearchive_05_s_59:
    speaker: "<Self>"
    en: Are you sure you're okay?
    ko: 괜찮은 거야?
    ja: 本当に大丈夫なのか？
  event_arcanearchive_05_s_60:
    speaker: arcana
    en: "..."
    ko: 아, 음….
    ja: うーん…
  event_arcanearchive_05_s_61:
    speaker: arcana
    en: Okay, fine. This time, I won't change the subject and ramble about the commute.
    ko: "…이번에는 출퇴근 얘기하면서 말 안 돌릴게요."
    ja: "…さすがに今回は、ちゃんと答えますね。"
  event_arcanearchive_05_s_62:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_63:
    speaker: arcana
    en: Of course I'm not okay.
    ko: 당연히… 안 괜찮죠.
    ja: もちろん…大丈夫ではありません。
  event_arcanearchive_05_s_64:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_65:
    speaker: arcana
    en: It's my memories that make me who I am.
    ko: 꼭 사고 전환이 아니더라도,
    ja: 思考転換が起こらないとしても…
  event_arcanearchive_05_s_66:
    speaker: arcana
    en: Even if it doesn't go as far as a full-blown Mind Switch,
    ko: 기억이 있으니까 내가 나인 거잖아요?
    ja: |-
      記憶があるからこそ、
      私は私でいられるわけであって。
  event_arcanearchive_05_s_67:
    speaker: arcana
    en: it's still like a part of me is dying with every passing day.
    ko: 그런 의미에서 보면, 저는 매일매일 한 번씩… 음.
    ja: ふふっ…そう考えると、私は…
  event_arcanearchive_05_s_68:
    speaker: arcana
    en: It's not as if I'm losing all of my memories,
    ko: 매일 한 번, 절반씩은 죽고 있다고 할 수 있겠죠.
    ja: 毎日、半分は死んでると言えますね。
  event_arcanearchive_05_s_69:
    speaker: arcana
    en: but I am losing some of them,
    ko: 기억이 전부 날아가는 건 아니니까, 절반.
    ja: |-
      記憶がすべてなくなるわけではないので、
      あくまで半分だけですが…
  event_arcanearchive_05_s_70:
    speaker: arcana
    en: and part of me goes with it.
    ko: "……괜찮을 리가 없잖아요, 그런 게."
    ja: "…だとしても、大丈夫なはずがないでしょう？"
  event_arcanearchive_05_s_71:
    speaker: "<Self>"
    en: "..."
    ko: 그러면….
    ja: それなら…
  event_arcanearchive_05_s_72:
    speaker: arcana
    en: Nevertheless.
    ko: 그래도.
    ja: "…それでも。"
  event_arcanearchive_05_s_73:
    speaker: arcana
    en: This is a job which must be done.
    ko: 그래도… 누군가는 해야만 하는 일이니까.
    ja: それでも…誰かがすべきことだから。
  event_arcanearchive_05_s_74:
    speaker: "<Self>"
    en: Is protecting this information really that important?
    ko: 비밀을 지키는 게 그렇게나 중요해?
    ja: 秘密を守ることがそんなに大事なのか？
  event_arcanearchive_05_s_75:
    speaker: "<Self>"
    en: More than your own life?
    ko: 너희의… 목숨보다도?
    ja: 君たちの…命よりも？
  event_arcanearchive_05_s_76:
    speaker: arcana
    en: Yes.
    ko: 네. 중요해요.
    ja: はい。大事です。
  event_arcanearchive_05_s_77:
    speaker: arcana
    en: Far more important than the life of an ordinary Nikke like myself.
    ko: 저 같은 평범한 니케의 목숨 따위보다 훨씬.
    ja: 私のような普通のニケの命なんかより、ずっと。
  event_arcanearchive_05_s_78:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_79:
    speaker: arcana
    en: Come this way.
    ko: "…이쪽으로 와요."
    ja: "…こちらへ。"
  event_arcanearchive_05_s_80:
    speaker: "<Monologue>"
    en: Arcana moves deeper into the reading room.
    ko: 아르카나는 열람실 안쪽을 향해 걸음을 옮겼다.
    ja: アルカナは閲覧室の奥へと歩き出した
  event_arcanearchive_05_s_81:
    speaker: arcana
    en: The secrets contained in this place need to be kept safe.
    ko: 아까 말했었죠. 비밀을 [지킨다] 라고.
    ja: |-
      さっき、言いましたよね？
      秘密を守らなければならないと。
  event_arcanearchive_05_s_82:
    speaker: arcana
    en: Do you know from what?
    ko: 지킨다면… [무엇으로부터] 지키는 걸까요?
    ja: |-
      さて、ここで問題です。
      「何から」守っているんでしょ～か？
  event_arcanearchive_05_s_83:
    speaker: "<Self>"
    en: People with bad intentions?
    ko: 나쁜 의도로 접근하는 사람들?
    ja: 悪意を持って近づく人々、とかか…？
  event_arcanearchive_05_s_84:
    speaker: arcana
    en: No, Perilous Siege fulfills that role.
    ko: 그건 시지 패러리스 분들의 역할.
    ja: それはシージペリラスの方たちの役割です。
  event_arcanearchive_05_s_85:
    speaker: "<Self>"
    en: Then what?
    ko: 그럼….
    ja: じゃあ…
  event_arcanearchive_05_s_86:
    speaker: arcana
    en: From oblivion.
    ko: 망각이에요.
    ja: 正解は、忘却です。
  event_arcanearchive_05_s_87:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_arcanearchive_05_s_88:
    speaker: arcana
    en: These books contain records of a past which no longer exists.
    ko: 지금은 없는 과거의 존재들. 기록으로만 남아 있는 이들.
    ja: |-
      今はなき過去の存在や、
      記録でしか残っていない人々…
  event_arcanearchive_05_s_89:
    speaker: arcana
    en: If the information contained within these tomes is forgotten,
    ko: 모두에게서 잊힌다면, 그들은 진정한 죽음을 맞이하게 되죠.
    ja: |-
      そういった存在は、覚えている人が
      いなくなれば本当の死を迎えることになります。
  event_arcanearchive_05_s_90:
    speaker: arcana
    en: then the past world they describe dies along with them.
    ko: 하지만 다르게 말한다면.
    ja: ですがそれは、言いかえれば…
  event_arcanearchive_05_s_91:
    speaker: arcana
    en: As long as they are not forgotten, they are immortal.
    ko: 그들은 잊히지 않는 이상 불멸.
    ja: |-
      彼らは忘れられない限り、
      不滅の存在ということでもあります。
  event_arcanearchive_05_s_92:
    speaker: arcana
    en: So long as at least one person remembers them,
    ko: 이 세상에서 단 한 사람이라도 기억하고 있다면,
    ja: この世にたった一人でも覚えている人がいれば…
  event_arcanearchive_05_s_93:
    speaker: arcana
    en: they will live on.
    ko: 그들은 죽은 게 아니에요.
    ja: 死んだことにはなりません。
  event_arcanearchive_05_s_94:
    speaker: "<Monologue>"
    en: As we walk, the books sitting on the shelves gradually become visibly older.
    ko: 통로의 책장이 점점 더 오래된 것으로 변해간다.
    ja: |-
      歩みを進めるにつれ、脇に並ぶ本棚は
      どんどん古いものに変わっていく
  event_arcanearchive_05_s_95:
    speaker: "<Monologue>"
    en: The musty smell of vintage books thickens in the hushed Forbidden Library.
    ko: 조용한 금서고에 깔린 책 냄새도 진해진다.
    ja: |-
      それに伴い、静かな禁書庫に漂う本の匂いも
      濃くなっていった
  event_arcanearchive_05_s_96:
    speaker: arcana
    en: Personally, I find it somewhat odd myself.
    ko: 그리고 또, 이상하지 않나요?
    ja: それから、おかしいと思いませんか？
  event_arcanearchive_05_s_97:
    speaker: arcana
    en: If they're so desperate to protect this place, there shouldn't be a need for
      someone like me.
    ko: 그렇게까지 지키고 싶다면, 관리자 같은 건 필요 없을 텐데.
    ja: |-
      そこまで守りたいなら、
      そもそも管理人なんていらないはず。
  event_arcanearchive_05_s_98:
    speaker: arcana
    en: If they sealed this place up and kept it out of sight and out of mind, wouldn't
      that be easier?
    ko: 그냥 아무도 모르는 곳에 넣어놓고 봉인해 버리면 끝 아닐까요?
    ja: |-
      誰も知らない場所に封印してしまえば、
      それでオシマイじゃありませんか？
  event_arcanearchive_05_s_99:
    speaker: "<Self>"
    en: You're right. Normally, that's how it would be done.
    ko: "…그렇네. 일반적으로는 그렇게 할 거야."
    ja: "…そうだな。普通はそうするはずだ"
  event_arcanearchive_05_s_100:
    speaker: arcana
    en: Exactly.
    ko: 네. 저도 그렇게 생각했었어요.
    ja: 私も最初はそう思っていました。
  event_arcanearchive_05_s_101:
    speaker: arcana
    en: But...
    ko: 하지만….
    ja: でも…
  event_arcanearchive_05_s_102:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャ…
  event_arcanearchive_05_s_103:
    speaker: "<Monologue>"
    en: Arcana opens the old wooden door at the end of the passageway.
    ko: 아르카나는 통로 끝에 있는 낡은 나무문을 열었다.
    ja: |-
      アルカナは突き当たりにある
      古びた木の扉を開けた
  event_arcanearchive_05_s_104:
    speaker: arcana
    en: A secret can only exist when at least someone knows about it.
    ko: 비밀이란 건, 알고 있는 사람이 존재해야만 성립하니까.
    ja: |-
      秘密というのは、知ってる人が
      存在しないと成立しませんから。
  event_arcanearchive_05_s_105:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_106:
    speaker: "<Monologue>"
    en: Behind the door lies a small room, half of which is taken up by two bookshelves.
    ko: 안쪽은 책장 두 개로 반 이상 차는 작은 골방이었다.
    ja: |-
      扉の先にあったのは、2つの本棚が
      空間の半分以上を占めている小部屋だった
  event_arcanearchive_05_s_107:
    speaker: "<Monologue>"
    en: The ever-present scent of books lingers in the air. Arcana walks into the
      middle of the room and turns back to look at me.
    ko: 희미하게 책 냄새가 풍기는 방 중앙에서, 아르카나는 나를 돌아보았다.
    ja: |-
      かすかに本の匂いが漂う部屋の中央で、
      アルカナは私の方に向き直った
  event_arcanearchive_05_s_108:
    speaker: arcana
    en: Do you think there are things in this world that no one knows about?
    ko: 세상에 그 누구도 모르는 비밀이란 게 존재할 수 있을까요?
    ja: |-
      この世に誰も知らない秘密なんて、
      存在するんでしょうか？
  event_arcanearchive_05_s_109:
    speaker: arcana
    en: If absolutely no one knows about something, then it can't be a secret.
    ko: 만약 아무도 모른다면, 그건 비밀이 아니죠.
    ja: |-
      誰も知らないなら、
      それはもはや秘密ではありません。
  event_arcanearchive_05_s_110:
    speaker: arcana
    en: It couldn't possibly be contained within a memory or written record.
    ko: 기억도, 기록도 아니고….
    ja: 記憶でも、記録でもなく…
  event_arcanearchive_05_s_111:
    speaker: arcana
    en: It wouldn't be anything. It wouldn't, by our definition, exist.
    ko: 아무것도 아닌, 그냥 그저 그뿐인 무언가.
    ja: |-
      何でもない、
      存在しない何かになってしまいます。
  event_arcanearchive_05_s_112:
    speaker: arcana
    en: Our founder could never leave these records to such a fate.
    ko: 창립자님은, 그들이 그렇게 되는 걸 용납할 수 없었던 거예요.
    ja: |-
      きっと創設者は、彼らがそうなることを
      許せなかったんでしょうね。
  event_arcanearchive_05_s_113:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_s_114:
    speaker: arcana
    en: Nor could I,
    ko: 그리고, 저도.
    ja: そして私も…
  event_arcanearchive_05_s_115:
    speaker: arcana
    en: or my predecessors
    ko: 지금까지 이 사명을 스스로의 결정으로 받아들였던 제 선배님들도.
    ja: |-
      今までこの使命を、自らの意志で受け入れてきた
      先代の方たちも。
  event_arcanearchive_05_s_116:
    speaker: arcana
    en: who similarly shouldered this duty.
    ko: 똑같이 생각하고 있어요.
    ja: きっと、同じように考えていたんだと思います。
  event_arcanearchive_05_s_117:
    speaker: arcana
    en: At the very least,
    ko: 저분들은.
    ja: あの方たちは…
  event_arcanearchive_05_s_118:
    speaker: arcana
    en: they...
    ko: 저분들만큼은.
    ja: あの方たちの存在だけは。
  event_arcanearchive_05_s_119:
    speaker: arcana
    en: must not be forgotten.
    ko: 그렇게 되어서는 안 돼요.
    ja: 忘れられてはいけないのだと。
  event_arcanearchive_05_s_120:
    speaker: "<Monologue>"
    en: Arcana takes back a step to reveal a handwritten label on the bookshelf.
    ko: 아르카나가 한 걸음 물러나서 드러난 책장의 푯말.
    ja: |-
      アルカナは一歩下がると、
      とある本棚の見出しを指し示した
  event_arcanearchive_05_s_121:
    speaker: "<Monologue>"
    en: 'The writing reads:'
    ko: 누군가의 손글씨로 쓰여진 그 푯말에는.
    ja: 誰かの手書き文字で書かれたその見出しには…
  event_arcanearchive_05_s_122:
    speaker: "<Monologue>"
    en: Goddess Squad.
    ko: "[갓데스 스쿼드]라고 적혀 있었다."
    ja: "「ゴッデス部隊」と書かれていた"
event_arcanearchive_05_e:
  event_arcanearchive_05_e_1:
    speaker: "<Self>"
    en: Goddess Squad...?
    ko: 갓데스….
    ja: ゴッデス…
  event_arcanearchive_05_e_2:
    speaker: arcana
    en: The books in this room were written by none other than the founder herself.
    ko: 이 방에 있는 책들은 창립자님이 직접 쓰셨어요.
    ja: |-
      この部屋にある本は、
      創設者が書いたものです。
  event_arcanearchive_05_e_3:
    speaker: arcana
    en: The entire history of the Goddess Squad is recorded here,
    ko: 처음 스쿼드가 결성되었을 때부터, 아크 가디언 작전까지.
    ja: 部隊の結成から、アークガーディアン作戦まで…
  event_arcanearchive_05_e_4:
    speaker: arcana
    en: from when they were first formed, all the way to Operation Ark Guardian.
    ko: 갓데스의 모든 행적이 기록되어 있죠.
    ja: |-
      ゴッデス部隊の歴史が、
      すべて記録されています。
  event_arcanearchive_05_e_5:
    speaker: "<Monologue>"
    en: Arcana takes out a book from the top shelf.
    ko: 아르카나가 제일 위 칸에 있는 책을 뽑았다.
    ja: アルカナが一番上の棚にある本を取り出した
  event_arcanearchive_05_e_6:
    speaker: arcana
    en: All the information has been collated and neatly organized.
    ko: 그걸 전부 정리, 요약한 거.
    ja: |-
      彼らの活躍のすべてが整理され、
      ここに記されてるんです。
  event_arcanearchive_05_e_7:
    speaker: arcana
    en: I'm sure you'll be surprised to see
    ko: 아마 깜짝 놀랄걸요?
    ja: ふふ、きっとびっくりしますよ？
  event_arcanearchive_05_e_8:
    speaker: arcana
    en: there's more to the Goddess Squad than you thought.
    ko: 그쪽이 알던 갓데스 스쿼드의 활약은 빙산의 일각이에요.
    ja: |-
      あなたが知ってるゴッデス部隊の活躍は、
      きっと氷山の一角にすぎませんので。
  event_arcanearchive_05_e_9:
    speaker: arcana
    en: None of these books can be taken from here, but you're free to stay here and
      read at your leisure.
    ko: 반출은 안 되니까, 여기서 천천히 읽어보시면….
    ja: |-
      貸し出しはできないので、
      ここでゆっくり読んでいただ…
  event_arcanearchive_05_e_10:
    speaker: "<Self>"
    en: What about after?
    ko: 그다음은?
    ja: "…そのあとのことは？"
  event_arcanearchive_05_e_11:
    speaker: arcana
    en: Excuse me?
    ko: "……네?"
    ja: "…はい？"
  event_arcanearchive_05_e_12:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_arcanearchive_05_e_13:
    speaker: "<Self>"
    en: Are there no records about what happened after Operation Ark Guardian?
    ko: 그다음 기록은 없어?
    ja: アークガーディアン作戦以降の記録はないのか？
  event_arcanearchive_05_e_14:
    speaker: arcana
    en: Er... there are...
    ko: 아, 어… 이, 있기는 한데요.
    ja: あ、その…あるにはありますが、
  event_arcanearchive_05_e_15:
    speaker: arcana
    en: But they're all outside and publicly available,
    ko: 아크 가디언 작전 이후의 기록들은 밖에 따로 있어요.
    ja: |-
      その作戦以降の記録は、
      この部屋の外に置いてあるんです。
  event_arcanearchive_05_e_16:
    speaker: arcana
    en: because all the records covering the events after the operation were done
      by us.
    ko: 거기서부터는 저희가 기록했으니까요.
    ja: そこからは私たちが記録したものなので。
  event_arcanearchive_05_e_17:
    speaker: "<Self>"
    en: I see.
    ko: 그렇구나.
    ja: そうか…
  event_arcanearchive_05_e_18:
    speaker: arcana
    en: "...?"
    ko: "……??"
    ja: "……？？"
  event_arcanearchive_05_e_19:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: ペラ…
  event_arcanearchive_05_e_20:
    speaker: "<Monologue>"
    en: I briefly scan through the book Arcana hands me.
    ko: 아르카나에게서 받은 책을 훑어보았다.
    ja: アルカナから受け取った本を読み始めた
  event_arcanearchive_05_e_21:
    speaker: "<Self>"
    en: You're right... this is entirely different from the story I was told.
    ko: 확실히… 말로 듣는 거랑은 조금 다르네.
    ja: 確かに…実際に聞いた話とは少し違うな
  event_arcanearchive_05_e_22:
    speaker: arcana
    en: What have you heard?
    ko: "…말로 들었다고요?"
    ja: "…実際に聞いた？"
  event_arcanearchive_05_e_23:
    speaker: "<Self>"
    en: Only bits and pieces via word of mouth.
    ko: 응. 띄엄띄엄 이기는 하지만.
    ja: ああ。断片的なものだが…
  event_arcanearchive_05_e_24:
    speaker: arcana
    en: Ah, I see.
    ko: 아. 네.
    ja: あ、ハイハイ。
  event_arcanearchive_05_e_25:
    speaker: arcana
    en: "... Anyways."
    ko: "…어쨌든."
    ja: "…とにかく。"
  event_arcanearchive_05_e_26:
    speaker: arcana
    en: As you might know, we don't have detailed information on the Goddess Squad's
      exploits, nor their specific members.
    ko: |-
      아시겠지만, 갓데스의 구체적인 행적과 구성원들에 대해서는
      외부에 알려지지 않았어요.
    ja: |-
      ご存じの通り、ゴッデスの具体的な活躍や
      構成員については外部に知られてません。
  event_arcanearchive_05_e_27:
    speaker: arcana
    en: But it's not as if their existence is being hidden.
    ko: 그렇다고 갓데스 스쿼드 자체를 감춘 것도 아니고요.
    ja: |-
      でも、ゴッデス部隊の存在自体は
      隠されてないんですよね。
  event_arcanearchive_05_e_28:
    speaker: arcana
    en: Why would that be?
    ko: "…왜 그럴까요?"
    ja: なぜだと思いますか？
  event_arcanearchive_05_e_29:
    speaker: "<Self>"
    en: I don't know, why?
    ko: 왜 그런데?
    ja: "…なぜなんだ？"
  event_arcanearchive_05_e_30:
    speaker: arcana
    en: That wasn't a rhetorical question. I was genuinely asking.
    ko: 저도 몰라서 물어보는 건데요?
    ja: もう、私も分からないから聞いてるんです。
  event_arcanearchive_05_e_31:
    speaker: "<Self>"
    en: Er...
    ko: 아니….
    ja: そ、そうか…
  event_arcanearchive_05_e_32:
    speaker: arcana
    en: Hmph. I thought that since it was related to politics, you might know.
    ko: 흥. 뭔가 정치적인 문제일 것 같으니까, 혹시 그쪽은 알고 있나 했죠.
    ja: |-
      う～ん。政治的な理由かなと思ったので、
      あなたなら知ってるかと思ったんですが…
  event_arcanearchive_05_e_33:
    speaker: arcana
    en: Not to mention that you've had the good fortune of speaking to a Goddess.
    ko: 무려! 갓데스와 이.야.기.를.나.누.신 대단한 지휘관님이니까.
    ja: |-
      何と言っても！
      ゴッデスと直接お話したことがあるという
      偉大な指揮官様なんですから！
  event_arcanearchive_05_e_34:
    speaker: "<Self>"
    en: Sorry, but I don't know.
    ko: 진짜라니까….
    ja: "…本当に会ったんだが"
  event_arcanearchive_05_e_35:
    speaker: arcana
    en: "... I suppose it's not such a big deal anyway."
    ko: 뭐, 그래도 문제는 없을 거예요.
    ja: まあ、どっちだっていいことです。
  event_arcanearchive_05_e_36:
    speaker: "<Monologue>"
    en: Arcana carefully brushes some dust off the bookshelf.
    ko: 아르카나는 책장을 조심스럽게 쓸었다.
    ja: アルカナは本棚にそっと触れた
  event_arcanearchive_05_e_37:
    speaker: "<Monologue>"
    en: Something tells me she doesn't believe my assertion that I don't know anything.
    ko: "…내 말은 조금도 믿지 않는 것 같다."
    ja: |-
      …私がゴッデスに会ったということは、
      まったく信じていないようだ
  event_arcanearchive_05_e_38:
    speaker: arcana
    en: Not as long as we're keeping a watchful eye over them.
    ko: 저희가 이렇게, 지키고 있으니까.
    ja: |-
      どうであれ、
      私たちがこうして守っていきますから。
  event_arcanearchive_05_e_39:
    speaker: "<Self>"
    en: Indeed.
    ko: "…그렇네."
    ja: "…そうだな"
  event_arcanearchive_05_e_40:
    speaker: arcana
    en: Ah, and there's more covered here than just the Goddess Squad.
    ko: 아, 그리고 갓데스 분들뿐만 아니라.
    ja: |-
      あっ！ちなみに、
      ゴッデスの方たちだけじゃなく…
  event_arcanearchive_05_e_41:
    speaker: "<Monologue>"
    en: Arcana takes out a book from the bookshelf beside her.
    ko: 아르카나는 옆의 책장에서 책 한 권을 뽑았다.
    ja: アルカナは隣の本棚から1冊の本を取り出した
  event_arcanearchive_05_e_42:
    speaker: arcana
    en: This is a record of everyone who risked their life fighting for humankind,
    ko: 랩쳐의 침공부터 아크 가디언 작전까지.
    ja: |-
      ラプチャーの侵略から、
      アークガーディアン作戦まで。
  event_arcanearchive_05_e_43:
    speaker: arcana
    en: all the way from the First Rapture Invasion, to Operation Ark Guardian.
    ko: 인류를 위해 목숨 바쳐 싸웠던, 모든 분들에 대한 기록도 있어요.
    ja: |-
      人類のために命をかけて戦ってきた、
      すべての人々に関する記録もあるんですよ。
  event_arcanearchive_05_e_44:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_e_45:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: ペラ…
  event_arcanearchive_05_e_46:
    speaker: "<Monologue>"
    en: Arcana hands me the book, and I open it.
    ko: 아르카나에게 받은 책을 펼쳤다.
    ja: アルカナから受け取った本を開いた
  event_arcanearchive_05_e_47:
    speaker: "<Narration>"
    en: Daniel Carter. Age 23.
    ko: "[다니엘 카터. 23세.]"
    ja: "「ダニエル・カーター。23歳」"
  event_arcanearchive_05_e_48:
    speaker: "<Narration>"
    en: His life is recorded in Volume 17, Page 229.
    ko: "[그의 생애는 17권 229p에 기록되어 있음.]"
    ja: "「彼の生涯は17巻229ページに記載」"
  event_arcanearchive_05_e_49:
    speaker: "<Narration>"
    en: Stayed behind alone to operate the machine gun and provided cover for his
      squad's retreat.
    ko: "[분대의 퇴각을 위해 홀로 진지에 남아 중기관총을 운용.]"
    ja: |-
      「部隊を退却させるため、
      一人で戦地に残り重機関銃を使用」
  event_arcanearchive_05_e_50:
    speaker: "<Narration>"
    en: Shot once in the upper left arm, twice in the abdomen, yet continued firing
      until his death.
    ko: "[왼팔 상완에 1발, 복부에 2발 피격당한 상황에서도 사격을 지속하다 전사.]"
    ja: |-
      「左上腕に1発、腹部に2発、
      被弾した状況でも射撃を続けて戦死」
  event_arcanearchive_05_e_51:
    speaker: "<Narration>"
    en: With honor and gratitude for your sacrifice.
    ko: "[귀하의 희생에 경의와 감사를.]"
    ja: "「貴殿の犠牲に敬意と感謝を」"
  event_arcanearchive_05_e_52:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: ペラ…
  event_arcanearchive_05_e_53:
    speaker: "<Narration>"
    en: Sarah Bradley. Volunteered to become a Nikke aged 16.
    ko: "[사라 브래들리. 16세에 니케로 자원.]"
    ja: "「サラ・ブラッドリー。16歳でニケに志願」"
  event_arcanearchive_05_e_54:
    speaker: "<Narration>"
    en: Her life is recorded in Volume 42, Page 35.
    ko: "[그녀의 생애는 42권 35p에 기록되어 있음.]"
    ja: "「彼女の生涯は42巻35ページに記載」"
  event_arcanearchive_05_e_55:
    speaker: "<Narration>"
    en: Participated in Operation Ark Guardian, after which whereabouts are unknown.
    ko: "[아크 가디언 작전에 참여. 이후 행적 미상.]"
    ja: |-
      「アークガーディアン作戦に参加。
      その後は消息不明」
  event_arcanearchive_05_e_56:
    speaker: "<Narration>"
    en: Insufficient information regarding potential final moments. Supplemental information
      will be provided if discovered.
    ko: "[최후에 대한 정보가 부족. 차후 기록이 발견될 시 추가 요망.]"
    ja: |-
      「情報が不足している。
      今後記録が見つかった場合、追加希望」
  event_arcanearchive_05_e_57:
    speaker: "<Narration>"
    en: With honor and gratitude for your sacrifice.
    ko: "[귀하의 희생에 경의와 감사를.]"
    ja: "「貴殿の犠牲に敬意と感謝を」"
  event_arcanearchive_05_e_58:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: ペラ…
  event_arcanearchive_05_e_59:
    speaker: "<Narration>"
    en: Jake Harris. Age 38.
    ko: "[제이크 해리스. 38세.]"
    ja: "「ジェイク・ハリス。38歳」"
  event_arcanearchive_05_e_60:
    speaker: "<Narration>"
    en: Went missing during the Ark Evacuation Operation.
    ko: "[방주 피난 작전 도중 실종.]"
    ja: "「アーク避難作戦の途中で失踪」"
  event_arcanearchive_05_e_61:
    speaker: "<Narration>"
    en: Insufficient information on his life and final moments.
    ko: "[생애와 최후에 대한 정보가 부족.]"
    ja: "「彼の経歴と行方に関する情報が不足」"
  event_arcanearchive_05_e_62:
    speaker: "<Narration>"
    en: Supplemental information will be provided if discovered.
    ko: "[차후 기록이 발견될 시 추가 요망.]"
    ja: "「今後記録が見つかった場合、追加希望」"
  event_arcanearchive_05_e_63:
    speaker: "<Narration>"
    en: With honor and gratitude for your sacrifice.
    ko: "[귀하의 희생에 경의와 감사를.]"
    ja: "「貴殿の犠牲に敬意と感謝を」"
  event_arcanearchive_05_e_64:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_e_65:
    speaker: "<Narration>"
    en: "*Flip flip*"
    ko: 팔락- 팔락-
    ja: ペラ…ペラ…
  event_arcanearchive_05_e_66:
    speaker: "<Monologue>"
    en: On the next page, and the page after that,
    ko: 다음 장에도, 그다음 장에도.
    ja: 次のページも、その次のページも…
  event_arcanearchive_05_e_67:
    speaker: "<Monologue>"
    en: line after line of laudatory text appears, seemingly never-ending.
    ko: 정중한 필체로 적힌 문장들이 끝없이 이어졌다.
    ja: 丁寧な文字で書かれた文章が続いていた
  event_arcanearchive_05_e_68:
    speaker: "<Narration>"
    en: With honor and gratitude for your sacrifice.
    ko: "[귀하의 희생에 경의와 감사를.]"
    ja: "「貴殿の犠牲に敬意と感謝を」"
  event_arcanearchive_05_e_69:
    speaker: "<Narration>"
    en: "... With honor and gratitude for your sacrifice."
    ko: "[…귀하의 희생에 경의와 감사를.]"
    ja: "「…貴殿の犠牲に敬意と感謝を」"
  event_arcanearchive_05_e_70:
    speaker: "<Narration>"
    en: "... For your sacrifice."
    ko: "[……경의와 감사를.]"
    ja: "「…敬意と感謝を」"
  event_arcanearchive_05_e_71:
    speaker: arcana
    en: What do you think?
    ko: 어때요?
    ja: どうですか？
  event_arcanearchive_05_e_72:
    speaker: arcana
    en: Isn't this worth risking my life for?
    ko: 제 목숨 걸고 지킬만 하죠?
    ja: 命をかけて守る価値があるでしょう？
  event_arcanearchive_05_e_73:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_e_74:
    speaker: "<Self>"
    en: Only you can answer that. Not me.
    ko: "…대답할 수 없어."
    ja: "…うまく答えられない"
  event_arcanearchive_05_e_75:
    speaker: arcana
    en: Hehe. You truly are a good person.
    ko: 후후. 역시 좋은 사람.
    ja: ふふ。やっぱり、いい人ですね。
  event_arcanearchive_05_e_76:
    speaker: arcana
    en: For all these years, I've been trying my best to keep this information safe.
    ko: 뭐… 지금껏 혼자서 열심히 지켜왔는데.
    ja: "…今まで、一人で必死に守ってきました。"
  event_arcanearchive_05_e_77:
    speaker: arcana
    en: It's nice to have someone else here to remember both it, and these people,
      with me.
    ko: 같이 기억해 줄 사람 생기는 건 좋기는 하네요.
    ja: |-
      でも、一緒に覚えていてくれる人がいるって…
      なんだかいいですね。
  event_arcanearchive_05_e_78:
    speaker: arcana
    en: As far as I know, there are only a total of 10 or so people who know about
      this,
    ko: 원래, 이 내용들 알고 있는 건 저 포함해서 열 명 정도거든요?
    ja: |-
      これを知ってるのは、
      私も含めて10人くらいなんです。
  event_arcanearchive_05_e_79:
    speaker: arcana
    en: and now you're one of them.
    ko: 이제 거기에 그쪽도 포함.
    ja: 今日からあなたも仲間入りですね。
  event_arcanearchive_05_e_80:
    speaker: arcana
    en: So, you must help me to watch over these records.
    ko: 그러니까, 책임감을 갖고 같이 [지켜] 줘요.
    ja: |-
      なので、責任を持って
      一緒に「守って」いきましょうね。
  event_arcanearchive_05_e_81:
    speaker: "<Self>"
    en: I will.
    ko: "…응. 그럴게."
    ja: "…ああ"
  event_arcanearchive_05_e_82:
    speaker: "<Self>"
    en: After all, I am personally familiar with the Goddess Squad.
    ko: "…그래도 갓데스는 원래 알고 있었…."
    ja: "…とはいえ、ゴッデスのことは元から知って…"
  event_arcanearchive_05_e_83:
    speaker: arcana
    en: Why do you keep pretending as if you know them?
    ko: 저기요. 아까부터 자꾸 갓데스 분들 아는 척하시는데.
    ja: |-
      あの～、先ほどからゴッデスのことで
      知ったような口を利いてますけど…
  event_arcanearchive_05_e_84:
    speaker: arcana
    en: Were you their commander?
    ko: 그쪽, 뭐 갓데스 스쿼드 지휘관이라도 돼요?
    ja: |-
      ゴッデス部隊の指揮官にでも
      なったつもりですか？
  event_arcanearchive_05_e_85:
    speaker: "<Self>"
    en: Well, no, but... actually, wait a moment.
    ko: 그건 아닌데… 어라? 잠깐만.
    ja: |-
      いや、そうではなく…
      ん？待ってくれ
  event_arcanearchive_05_e_86:
    speaker: "<Monologue>"
    en: I re-open the first book that Arcana gave me, the one covering the Goddess
      Squad.
    ko: 아르카나가 처음 건네줬던, 갓데스 스쿼드에 대한 책을 펼쳤다.
    ja: |-
      アルカナから最初に受け取った、
      ゴッデス部隊に関する本を再び開いた
  event_arcanearchive_05_e_87:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: ペラ…
  event_arcanearchive_05_e_88:
    speaker: "<Monologue>"
    en: After checking and double-checking the table of contents along with the rest
      of the book,
    ko: 목차를 살펴보고, 책장도 훑어봤지만.
    ja: 目次を見て、本棚も確認したが…
  event_arcanearchive_05_e_89:
    speaker: "<Monologue>"
    en: I'm unable to turn up any information as to who was the commander of the Goddess
      Squad.
    ko: 갓데스 스쿼드의 지휘관에 관한 내용은 어디에서도 찾을 수 없었다.
    ja: |-
      ゴッデス部隊の指揮官に関する記述は
      どこにも見当たらなかった
  event_arcanearchive_05_e_90:
    speaker: "<Self>"
    en: There is no mention of the squad's commander anywhere.
    ko: 정작 지휘관에 대한 내용은 없네?
    ja: 指揮官に関する記録はないのか？
  event_arcanearchive_05_e_91:
    speaker: arcana
    en: The individual in question requested his name be redacted.
    ko: 본인이 빼달라고 요청했대요.
    ja: |-
      それが、抜いてほしいと
      本人から頼まれたそうなんです。
  event_arcanearchive_05_e_92:
    speaker: arcana
    en: He asserted that he did not deserve to have his name written alongside the
      Nikkes'.
    ko: "[나는 이들과 같은 곳에 이름을 올릴 자격이 없다]고."
    ja: |-
      「私は彼女たちと同じ場所に
      名前を載せる資格がない」と…
  event_arcanearchive_05_e_93:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_e_94:
    speaker: arcana
    en: After that, however, we recorded the names of all the commanders.
    ko: 그래도 그 뒤로는 예외 없이 전부 기록 중이에요.
    ja: |-
      あ、でもその方以降の指揮官からは
      例外なくすべて記録していますよ。
  event_arcanearchive_05_e_95:
    speaker: arcana
    en: Some of the more notable ones are Mad Dog and New Hope.
    ko: 굵직굵직한 분들로는 [미친개], [샛별]….
    ja: 有名な方たちで言うと、「狂犬」や「新星」…
  event_arcanearchive_05_e_96:
    speaker: "<Choice>"
    en: Who is Mad Dog?
    ko: 미친개는 또 누구지…?
    ja: 狂犬は誰のことだ…？
  event_arcanearchive_05_e_97:
    speaker: "<Choice>"
    en: My predecessor.
    ko: 오, 선배.
    ja: おっ、先輩
  event_arcanearchive_05_e_98:
    speaker: arcana
    en: There's also a commander who has recently been making a name for himself.
      He's the leader of the special task force Counters.
    ko: |-
      그리고 새로운 전설로도 불리는 지휘관과,
      그분이 이끄는 특수별동대 [카운터스] 까지도요.
    ja: |-
      そして新たな伝説とも呼ばれている指揮官と、
      彼が率いる特殊別働隊「カウンターズ」の
      こともバッチリ記録済みです。
  event_arcanearchive_05_e_99:
    speaker: "<Self>"
    en: You know of the Counters?
    ko: "…카운터스 알아?"
    ja: "…カウンターズを知っているのか？"
  event_arcanearchive_05_e_100:
    speaker: arcana
    en: Of course I know.
    ko: 당연히 알죠.
    ja: もちろんです。
  event_arcanearchive_05_e_101:
    speaker: arcana
    en: They're my favorite squad.
    ko: 제 최애 스쿼드인걸요?
    ja: なんたって、私の推し部隊ですから！
  event_arcanearchive_05_e_102:
    speaker: "<Self>"
    en: Are they now?
    ko: "……최애라고?"
    ja: "…推し？"
  event_arcanearchive_05_e_103:
    speaker: arcana
    en: Absolutely.
    ko: 네. 최애.
    ja: はい。
  event_arcanearchive_05_e_104:
    speaker: arcana
    en: I'll show you. Come this way.
    ko: 보여줄게요. 이리 와봐요.
    ja: |-
      彼らの記録も見せてあげますね。
      ささ、こちらへ！
  event_arcanearchive_05_e_105:
    speaker: "<Self>"
    en: Just a second.
    ko: 어, 잠깐 이것 좀.
    ja: あっ、その前にこれを…
  event_arcanearchive_05_e_106:
    speaker: "<Monologue>"
    en: As I move to put the book back on the bookshelf,
    ko: 아르카나를 따라가기 전에 책을 책장에 돌려놓으려고 할 때,
    ja: |-
      アルカナを追いかける前に、
      本を本棚に戻そうとしたその時…
  event_arcanearchive_05_e_107:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락-
    ja: ペラ…
  event_arcanearchive_05_e_108:
    speaker: "<Monologue>"
    en: a piece of paper falls out from between the pages.
    ko: 책 사이에서 종이 한장이 빠져 나왔다.
    ja: 本の隙間から1枚の紙が舞い落ちた
  event_arcanearchive_05_e_109:
    speaker: "<Self>"
    en: A note?
    ko: 메모지…?
    ja: メモ用紙…？
  event_arcanearchive_05_e_110:
    speaker: "<Monologue>"
    en: The paper has yellowed from age.
    ko: 오래되어 색이 바랜 메모지에는,
    ja: 古く色あせたその紙には…
  event_arcanearchive_05_e_111:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_05_e_112:
    speaker: "<Narration>"
    en: 'On it, there is written a single line:'
    ko: "[옛이야기는, 아름답게 끝난다.]"
    ja: たった一行だけがつづられていた
  event_arcanearchive_05_e_113:
    speaker: "<Monologue>"
    en: Old stories end beautifully.
    ko: 단 한 줄의 문장만이 적혀 있었다.
    ja: "――「昔話は、美しく終わる」"
event_arcanearchive_06_s:
  event_arcanearchive_06_s_1:
    speaker: "<Monologue>"
    en: I follow the eager Arcana to a bookshelf which is unusually clean.
    ko: 재촉하는 아르카나를 따라 유난히 깨끗한 책장 앞에 도착했다.
    ja: |-
      アルカナに急かされながら、
      ひときわきれいな本棚の前に到着した
  event_arcanearchive_06_s_2:
    speaker: "<Self>"
    en: Hmm?
    ko: 오….
    ja: おお…
  event_arcanearchive_06_s_3:
    speaker: "<Monologue>"
    en: Underneath the label which reads “Counters Squad”,
    ko: "[카운터스 스쿼드]라고 적혀 있는 푯말 아래에,"
    ja: |-
      「カウンターズ部隊」と
      書かれた見出しの下には…
  event_arcanearchive_06_s_4:
    speaker: "<Monologue>"
    en: there is a supplementary note that states “My Favorite!”.
    ko: "[내 최애!]라고 적힌 메모지가 붙어 있다."
    ja: "「私の推し！」と書かれた付せんが貼ってある"
  event_arcanearchive_06_s_5:
    speaker: arcana
    en: Of all the squads
    ko: 제가 금서고 관리자가 된 후에 기록한 스쿼드 중에,
    ja: |-
      この方たちは、私が禁書庫の
      管理者になってから記録した部隊の中で…
  event_arcanearchive_06_s_6:
    speaker: arcana
    en: I've kept records since becoming the manager,
    ko: 가장 뛰어난 활약을 보여주신 분들이에요.
    ja: |-
      一番すばらしい活躍を
      見せてくれた方たちなんです。
  event_arcanearchive_06_s_7:
    speaker: arcana
    en: the Counters have performed the best.
    ko: 그쪽도 알죠? 카운터스.
    ja: カウンターズ部隊。あなたも知ってますよね？
  event_arcanearchive_06_s_8:
    speaker: "<Self>"
    en: Oh, I'm perfectly aware of how capable they are.
    ko: 잘 알지.
    ja: ああ、よく知っている
  event_arcanearchive_06_s_9:
    speaker: arcana
    en: I imagine you would. After all, you've even spoken to members of the Goddess
      Squad.
    ko: 아무렴요. 갓데스랑 얘기도 하신 분인데.
    ja: |-
      ですよね～
      ゴッデスともお話したほどなんですから。
  event_arcanearchive_06_s_10:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_11:
    speaker: arcana
    en: The Counters are a Special Commando unit, so they've had to carry out all
      sorts of classified missions.
    ko: 그래도 이분들은 특수별동대로서 극비 임무를 워낙 많이 하신 분들이라.
    ja: |-
      ただ、この方たちは特殊別働隊として
      極秘任務を多く担当されてるので…
  event_arcanearchive_06_s_12:
    speaker: arcana
    en: There's a bunch of information about them which isn't known to the public
      either. Almost as much as the Goddess Squad.
    ko: 거의 갓데스 만큼이나 외부에 공표되지 않은 것들이 많아요.
    ja: |-
      ゴッデスと同じくらい、
      外部に公表されてないことが多いんです。
  event_arcanearchive_06_s_13:
    speaker: arcana
    en: Every time they've gone up against a Heretic, they've come out on top.
    ko: 만나는 헬레틱마다 전부 이겼다니까요?
    ja: |-
      なんと、遭遇したヘレティックに
      全勝してるんですよ？
  event_arcanearchive_06_s_14:
    speaker: "<Self>"
    en: Not every time. I'm pretty sure there were times that they were defeated or
      had to retreat.
    ko: 전부는 아닐걸? 지거나 도망친 적도 있고.
    ja: |-
      全勝ではないはずだ。
      負けたり逃げたりしたこともある
  event_arcanearchive_06_s_15:
    speaker: arcana
    en: Okay, but if we exclude tactical retreats and successful withdrawals, they're
      undefeated.
    ko: 그, 그래도 전략적 후퇴나 성공적인 철수를 빼면 승률 100%라구요!
    ja: |-
      で、でも、戦略的撤退や撤収に成功した
      ケースをのぞけば勝率は100％です！
  event_arcanearchive_06_s_16:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_17:
    speaker: arcana
    en: Hold on, how do you know all this?
    ko: 그쪽, 어떻게 알아요?
    ja: "…というか、どうして知ってるんですか？"
  event_arcanearchive_06_s_18:
    speaker: "<Self>"
    en: When we first went up against a Heretic, I thought we were done for.
    ko: 헬레틱을 처음 만났을 땐 정말 죽는 줄 알았었지….
    ja: |-
      ヘレティックに初めて会った時は、
      本当に死ぬかと思った…
  event_arcanearchive_06_s_19:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_20:
    speaker: "<Self>"
    en: Eventually, we got better and better.
    ko: 그래도 점점 요령이 붙더라고.
    ja: だが、そうした経験を積んでいく中で…
  event_arcanearchive_06_s_21:
    speaker: "<Self>"
    en: We worked more and more as a team, and everyone became stronger.
    ko: 호흡도 맞아가고, 다들 더 강해지고.
    ja: |-
      全員の練度が上がり、
      部隊の連携も今のレベルに至ったんだ
  event_arcanearchive_06_s_22:
    speaker: "<Self>"
    en: And above all... oh, I assume you've heard about Vapaus?
    ko: 그래도 무엇보다… 아, 그럼 혹시 언체인드도 알아?
    ja: |-
      そして何より…
      そうだ、アンチェインドのことは知っているか？
  event_arcanearchive_06_s_23:
    speaker: arcana
    en: I have. The commander of the Counters used it to defeat Nihilister.
    ko: 알죠. 카운터스 지휘관님이 그걸로 니힐리스타 잡았잖아요.
    ja: |-
      もちろんです。カウンターズの指揮官が
      それでニヒリスターを倒したんですよね。
  event_arcanearchive_06_s_24:
    speaker: arcana
    en: But apparently, it's no silver bullet.
    ko: "…그래도 마냥 쉽게 풀리는 일은 없나 봐요."
    ja: "…でも、そう簡単にはいかないようですね。"
  event_arcanearchive_06_s_25:
    speaker: arcana
    en: If only the commander of the Counters
    ko: 그런 걸 막 많이 만들 수 있었으면,
    ja: |-
      もしああいうものを大量に作ることが
      できているのなら、
  event_arcanearchive_06_s_26:
    speaker: arcana
    en: was able to make more of that stuff...
    ko: 카운터스 지휘관님이….
    ja: とっくにカウンターズの指揮官様が…
  event_arcanearchive_06_s_27:
    speaker: "<Self>"
    en: Hmm. Looks like not everything was recorded.
    ko: 음. 전부 기록되어 있는 건 아니었나보네….
    ja: |-
      そうか、すべて記録されているわけでは
      ないのか…
  event_arcanearchive_06_s_28:
    speaker: "<Monologue>"
    en: Arcana's gaze fixates on the name tag on my chest.
    ko: 아르카나의 시선이 내 가슴팍의 명찰로 향했다.
    ja: |-
      アルカナの視線が、
      ふと私の胸元にある名札に向けられた
  event_arcanearchive_06_s_29:
    speaker: arcana
    en: Then we could have already reclaimed the sur...
    ko: 벌써 지상 수복하고도… 남았을…?
    ja: 地上を奪還して…るはず…？
  event_arcanearchive_06_s_30:
    speaker: arcana
    en: Wait a second!
    ko: "……아, 아니! 잠깐만요!"
    ja: "…ちょ、ちょっと待ってください！"
  event_arcanearchive_06_s_31:
    speaker: arcana
    en: You've got the same name as the commander of the Counters.
    ko: 우, 우와~ 이제 보니 그쪽, 카운터스 지휘관님이랑 동명이인이시네요?
    ja: |-
      わ、わあ～…？
      よく見たら、カウンターズの指揮官様と
      同姓同名なんですね？
  event_arcanearchive_06_s_32:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_33:
    speaker: "<Monologue>"
    en: Arcana redirects her focus on my face.
    ko: 아르카나의 시선이 이번엔 내 얼굴로 향했다.
    ja: アルカナの視線が、今度は私の顔に向けられた
  event_arcanearchive_06_s_34:
    speaker: arcana
    en: And your face... it's awfully similar to what I saw during the attack on the
      Ark...
    ko: 게, 게다가 얼굴도… 저번에 방주 테러 때 본 거랑 비슷… 한 것 같고….
    ja: |-
      そ、それに顔も…この間のアークテロ事件で
      見たのと似てる…ような…
  event_arcanearchive_06_s_35:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_36:
    speaker: arcana
    en: How interesting.
    ko: 시, 신기하네요~
    ja: ふ、フシギですね～？
  event_arcanearchive_06_s_37:
    speaker: arcana
    en: You must be his doppelganger.
    ko: 도플갱어라는 게 실제로 있었군요?
    ja: ドッペルゲンガーって、実在したんですね～？
  event_arcanearchive_06_s_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_39:
    speaker: arcana
    en: "... Or his brother?"
    ko: "…형제?"
    ja: "…もしや、ご兄弟？"
  event_arcanearchive_06_s_40:
    speaker: "<Self>"
    en: "..."
    ko: "………."
    ja: "………"
  event_arcanearchive_06_s_41:
    speaker: arcana
    en: Are you serious?!
    ko: 지, 진짜에요?
    ja: ほ、ホントに？
  event_arcanearchive_06_s_42:
    speaker: arcana
    en: You're him?! You're the commander of the Counters?!
    ko: 그쪽, 진짜 [카운터스] 지휘관?
    ja: |-
      あなたがあの、
      「カウンターズ」の指揮官様なんですか…？
  event_arcanearchive_06_s_43:
    speaker: "<Self>"
    en: "... Hehe."
    ko: "…후후."
    ja: "…ふふ"
  event_arcanearchive_06_s_44:
    speaker: "<Monologue>"
    en: I puff my chest out as much as I can and flash my most dashing smile.
    ko: 가슴을 한껏 펴고, 내가 생각해 낼 수 있는 가장 멋진 표정을 지었다.
    ja: |-
      私は堂々と胸を張りながら、
      一番カッコいいと思う表情を決めた
  event_arcanearchive_06_s_45:
    speaker: "<Self>"
    en: Nice to meet you. I'm @UserName, the commander of the Counters.
    ko: 반가워. 카운터스 지휘관 @UserName, 정식으로 인사할게.
    ja: |-
      ちゃんとした自己紹介がまだだったな。
      カウンターズの指揮官、
      @UserNameだ
  event_arcanearchive_06_s_46:
    speaker: "<Self>"
    en: It's always nice meeting a fan.
    ko: 팬을 만나서 영광이야.
    ja: ファンに会えて光栄だ
  event_arcanearchive_06_s_47:
    speaker: arcana
    en: "..."
    ko: "………."
    ja: "………"
  event_arcanearchive_06_s_48:
    speaker: "<Monologue>"
    en: It takes Arcana about 20 minutes to accept reality.
    ko: "…아르카나가 현실을 받아들이는 데에는 약 20분 정도가 걸렸다."
    ja: |-
      …その後、アルカナが現実を受け入れるまで
      20分ほどかかった
  event_arcanearchive_06_s_49:
    speaker: "<Self>"
    en: Have you never seen a photo of me?
    ko: 내 사진 같은 건 본 적 없어?
    ja: 私の写真を見たことはないのか？
  event_arcanearchive_06_s_50:
    speaker: arcana
    en: My job usually consists of transcribing mission reports that come my way.
    ko: 일할 땐 그냥 작전 보고서 전달받은 다음에 옮겨 적거든요.
    ja: |-
      その、仕事の時は受け取った作戦報告書をもとに
      記録を取ってるので…
  event_arcanearchive_06_s_51:
    speaker: arcana
    en: I know your general description, but as far as actually seeing your face,
    ko: 대충 인상착의는 아는데… 얼굴은 그,
    ja: だいたいの雰囲気は分かりますが…
  event_arcanearchive_06_s_52:
    speaker: arcana
    en: it was only once, briefly during the attack on the Ark.
    ko: 방주 테러 때 스치듯 본 것밖에 없어서….
    ja: |-
      顔の方は、アークテロ事件の時に
      ちらっと見ただけで…
  event_arcanearchive_06_s_53:
    speaker: "<Self>"
    en: Phantom brought you to the Outpost.
    ko: 팬텀이 전초기지로 데려왔었잖아.
    ja: ファントムが君を前哨基地に連れてきただろう？
  event_arcanearchive_06_s_54:
    speaker: "<Self>"
    en: I'm the only commander at the Outpost, aren't I?
    ko: 전초기지에 있는 지휘관은 나밖에 없지 않아?
    ja: |-
      前哨基地にいる指揮官は私だけだから、
      そこでピンと来なかったのか？
  event_arcanearchive_06_s_55:
    speaker: arcana
    en: My mind was all scrambled then.
    ko: |-
      그때는 거기가 전초기지인지 방주인지
      지상인지 어딘지 신경 쓸 겨를도 없었거든요?
    ja: |-
      あの時は、そこが前哨基地なのかどこなのか、
      気にする余裕もなかったんです。
  event_arcanearchive_06_s_56:
    speaker: arcana
    en: I had no idea whether I was at the Outpost, the Ark, or on the surface.
    ko: "…머릿속이 완전 뒤죽박죽이었으니까."
    ja: "…頭の中が、めちゃくちゃでしたから。"
  event_arcanearchive_06_s_57:
    speaker: "<Self>"
    en: You didn't seem all that out of sorts.
    ko: "…멀쩡해 보여서 몰랐어."
    ja: "…すまない。落ち着いているように見えたから…"
  event_arcanearchive_06_s_58:
    speaker: arcana
    en: Just because someone doesn't show doesn't mean they're not hurting inside.
    ko: 아픈 거 티 낸다고 안 아픈 거 아니잖아요.
    ja: |-
      ふふ、目に見えるものだけが
      すべてじゃありませんよ？
  event_arcanearchive_06_s_59:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_60:
    speaker: arcana
    en: Still though...
    ko: "…그래도."
    ja: "…でも。"
  event_arcanearchive_06_s_61:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_62:
    speaker: "<Self>"
    en: What?
    ko: 왜?
    ja: どうかしたか？
  event_arcanearchive_06_s_63:
    speaker: arcana
    en: Nothing.
    ko: 아뇨, 그냥.
    ja: いえ、ただ…
  event_arcanearchive_06_s_64:
    speaker: arcana
    en: I just wondered if you were actually real.
    ko: 실존 인물이었구나, 싶어서.
    ja: 本当に実在してたんだなぁと思って。
  event_arcanearchive_06_s_65:
    speaker: "<Self>"
    en: Well, as you can see, I'm very much real.
    ko: 당연히 실존 인물이지.
    ja: 当たり前だろう？
  event_arcanearchive_06_s_66:
    speaker: arcana
    en: It may seem like a silly thought to you,
    ko: 그쪽은 본인 일이니까 그렇죠.
    ja: もう、本人からすればそうかもしれませんけど。
  event_arcanearchive_06_s_67:
    speaker: arcana
    en: but if your only reference point is these records, there are times when you
      wonder.
    ko: 기록으로 보는 입장에서는 이게 진짜 사람 맞나? 하는 생각이 든다구요.
    ja: |-
      記録で見る限りだと、
      本当にこんな人がいるの？
      って思っちゃうんですよ。
  event_arcanearchive_06_s_68:
    speaker: "<Self>"
    en: Really?
    ko: 그, 그런가?
    ja: そ、そうか…？
  event_arcanearchive_06_s_69:
    speaker: arcana
    en: Yeah! Your military career has defied belief from the start.
    ko: 그렇다니까요! 데뷔전부터 진짜 말이 안 됐어요.
    ja: |-
      そうですよ！
      デビュー戦から前代未聞でしたから。
  event_arcanearchive_06_s_70:
    speaker: arcana
    en: Even on your first mission, when the transport was shot down,
    ko: 첫 임무에 수송기가 격추당한 상황에서도,
    ja: |-
      初めての任務では
      輸送機が撃墜された状況にもかかわらず…
  event_arcanearchive_06_s_71:
    speaker: arcana
    en: you managed to lead a hastily formed squad, destroy the Blacksmith, and complete
      the mission.
    ko: 급조 스쿼드를 지휘해서 블랙스미스까지 파괴하고 목표 달성!
    ja: |-
      一時しのぎの部隊を指揮して
      ブラックスミスを見事撃破し、目標達成！
  event_arcanearchive_06_s_72:
    speaker: arcana
    en: You faced a few challenges in your next mission to pursue Chatterbox, sure,
    ko: 그리고 바로 다음 토커티브 추격전에서도 고전하긴 했지만….
    ja: |-
      それからまもなくして向かった、トーカティブの
      捕獲作戦でも苦戦こそしたものの…
  event_arcanearchive_06_s_73:
    speaker: arcana
    en: but that was also the first time you met the Goddesses.
    ko: 아, 그쵸. 그때 갓데스를 처음 만나셨죠.
    ja: |-
      あっ、そうでした！
      その時にゴッデスと初めて会ったのですね。
  event_arcanearchive_06_s_74:
    speaker: arcana
    en: Then you went further up north and encountered Unlimited.
    ko: 그리고 북부로 향해서, 언리미티드 스쿼드를 만나고.
    ja: |-
      …コホンッ。で、その後は北部に向かい、
      アンリミテッド部隊と出会ったあと…
  event_arcanearchive_06_s_75:
    speaker: arcana
    en: You met Snow White, and crossed paths yet again with Chatterbox.
    ko: 다시 토커티브랑 스노우 화이트 님과 조우.
    ja: |-
      再びトーカティブ、
      そしてスノーホワイト様と遭遇。
  event_arcanearchive_06_s_76:
    speaker: arcana
    en: Then, just when it seemed you were about to take it down, Modernia appeared
      and...!
    ko: 이번에는 잡나 싶은 순간, 코드네임 모더니아가 등장해서…!
    ja: |-
      今度こそ倒したかと思った瞬間、
      コードネーム・モダニアが登場して…！
  event_arcanearchive_06_s_77:
    speaker: arcana
    en: Oh, sorry.
    ko: "…아."
    ja: "…あっ。"
  event_arcanearchive_06_s_78:
    speaker: arcana
    en: I'm sure these aren't exactly pleasant memories for you.
    ko: 미안해요. 그쪽한테는 좋은 기억이 아니었을 텐데.
    ja: |-
      ごめんなさい、つい興奮して…
      あなたにとってはいい思い出じゃないのに…
  event_arcanearchive_06_s_79:
    speaker: "<Self>"
    en: It's okay. We may be separated now, but it's only temporary.
    ko: 괜찮아. 지금은 잠깐 헤어져 있을 뿐이니까.
    ja: |-
      気にしないでくれ。
      今は、一時的に離れているだけだ
  event_arcanearchive_06_s_80:
    speaker: arcana
    en: I see...
    ko: 네….
    ja: はい…
  event_arcanearchive_06_s_81:
    speaker: arcana
    en: How is Marian doing?
    ko: "…마리안 님은 잘 지내시나요?"
    ja: "…その。マリアン様はお元気ですか？"
  event_arcanearchive_06_s_82:
    speaker: arcana
    en: After that incident, we don't have any more reports regarding her.
    ko: 그 건에 대해서는 작전 보고서에 언급이 끊겨서요.
    ja: |-
      そのあたりに関しては、
      作戦報告書にも書かれてなかったので…
  event_arcanearchive_06_s_83:
    speaker: "<Self>"
    en: She's...
    ko: 지금은….
    ja: 今は…
  event_arcanearchive_06_s_84:
    speaker: arcana
    en: No, on second thought, don't tell me.
    ko: 아, 아니다. 말해주지 마요.
    ja: |-
      あっ、すみません！
      やっぱり言わないでください…！
  event_arcanearchive_06_s_85:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_arcanearchive_06_s_86:
    speaker: arcana
    en: If you told me anything, I'd be duty-bound to record it,
    ko: 그쪽한테 그런 걸 들으면 전 무조건 기록해야 해요. 그게 제 의무니까.
    ja: |-
      あなたからそんな話を聞いたら、
      記録しなくてはいけなくなります。
      それが私の義務ですから。
  event_arcanearchive_06_s_87:
    speaker: arcana
    en: and you don't want to leave a written record behind, do you?
    ko: 기록을 남기고 싶지 않은 거죠?
    ja: 記録を、残したくないんでしょう？
  event_arcanearchive_06_s_88:
    speaker: "<Self>"
    en: No, I don't... you won't get in trouble for this?
    ko: 그렇기는 한데… 그래도 돼?
    ja: それはそうだが…いいのか？
  event_arcanearchive_06_s_89:
    speaker: arcana
    en: It's fine.
    ko: 이 정도는 괜찮아요.
    ja: このくらいなら大丈夫です。
  event_arcanearchive_06_s_90:
    speaker: arcana
    en: The higher-ups censor some of the information they give us anyways,
    ko: 어차피 높으신 분들이 일단 걸러서 주기도 하고,
    ja: |-
      記録された内容は、上層部の方たちの
      検閲を受ける必要がありますし…
  event_arcanearchive_06_s_91:
    speaker: arcana
    en: and after all the hard work you've done for the good of the Ark, you can get
      away with this at the very least.
    ko: 이렇게 고생하는데 이정도 권한은 있어야지 덜 서럽죠.
    ja: |-
      こんなに苦労してるんだから、
      これくらいの権限は許していただかないと。
  event_arcanearchive_06_s_92:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 띠링-
    ja: ピロン――
  event_arcanearchive_06_s_93:
    speaker: "<Monologue>"
    en: A notification sound emits from Arcana's phone.
    ko: 아르카나의 핸드폰에서 알람이 울렸다.
    ja: アルカナの携帯の通知音が鳴った
  event_arcanearchive_06_s_94:
    speaker: arcana
    en: Oh boy.
    ko: 아….
    ja: あっ…
  event_arcanearchive_06_s_95:
    speaker: "<Self>"
    en: Is it Phantom?
    ko: 팬텀이야?
    ja: ファントムからか？
  event_arcanearchive_06_s_96:
    speaker: arcana
    en: No.
    ko: 아뇨.
    ja: いいえ。
  event_arcanearchive_06_s_97:
    speaker: arcana
    en: It's from the Boss. It's time for my memory wipe.
    ko: 사장님 호출이에요. 기억 소거 받으러 오라고.
    ja: |-
      社長からの呼び出しです。
      記憶消去を受けに来いと。
  event_arcanearchive_06_s_98:
    speaker: arcana
    en: I guess she found out that my memory came back.
    ko: 기억이 돌아온 걸 아셨나 봐요.
    ja: |-
      どうやら、記憶が戻ったことに
      気づいたようですね。
  event_arcanearchive_06_s_99:
    speaker: "<Self>"
    en: How did Ingrid...
    ko: 잉그리드가 그걸 어떻게….
    ja: どうしてイングリッドが…
  event_arcanearchive_06_s_100:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_101:
    speaker: arcana
    en: Let's get going.
    ko: 그럼 가요. 늦으면 사장님한테 혼나.
    ja: |-
      さっ、行きましょ。
      遅くなったら社長に怒られちゃいますので。
  event_arcanearchive_06_s_102:
    speaker: arcana
    en: I'll be in big trouble if I'm late.
    ko: 구경은… 음.
    ja: ツアーの続きは…う～ん…
  event_arcanearchive_06_s_103:
    speaker: arcana
    en: We'll have to do the rest of the tour another time.
    ko: "…나중에 마저 하죠, 뭐."
    ja: "…また今度ということで！"
  event_arcanearchive_06_s_104:
    speaker: "<Self>"
    en: Sure thing.
    ko: 응. 그러자.
    ja: ああ、分かった
  event_arcanearchive_06_s_105:
    speaker: "<Monologue>"
    en: As I move to set the book back on the shelf, my eye once against catches the
      note that reads "My Favorite!".
    ko: 책을 책장에 돌려놓으려다, [내 최애!]라고 쓰인 메모지가 다시 눈에 들어왔다.
    ja: |-
      手元の本を本棚に戻そうとしたその時、
      「私の推し！」と書かれたメモが
      再び視界に入った
  event_arcanearchive_06_s_106:
    speaker: "<Self>"
    en: Arcana.
    ko: "…아르카나."
    ja: "…アルカナ"
  event_arcanearchive_06_s_107:
    speaker: arcana
    en: Yes?
    ko: 네?
    ja: はい？
  event_arcanearchive_06_s_108:
    speaker: "<Self>"
    en: Why are you such a fan of ours?
    ko: 왜 우리 팬이 된 거야?
    ja: どうして私たちのファンになったんだ？
  event_arcanearchive_06_s_109:
    speaker: arcana
    en: How could I not be?
    ko: 당연히 팬이 되죠.
    ja: そんなの、当然じゃないですか？
  event_arcanearchive_06_s_110:
    speaker: arcana
    en: You guys give meaning to what I do.
    ko: 제가 하는 일이 의미가 있게 만들어주시는 분들이잖아요.
    ja: |-
      だってあなたたちは、私の仕事を
      有意義なものにしてくれたんですから。
  event_arcanearchive_06_s_111:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_112:
    speaker: arcana
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_arcanearchive_06_s_113:
    speaker: "<Monologue>"
    en: Arcana clasps her hands behind her back and quietly walks between the bookshelves.
    ko: 아르카나는 뒷짐을 지고는, 천천히 책장 사이를 걸었다.
    ja: |-
      アルカナは後ろ手を組み、
      ゆっくりと本棚の間を歩いた
  event_arcanearchive_06_s_114:
    speaker: arcana
    en: I know I was awfully lofty a few moments ago,
    ko: 아까는 좀 있어 보이려고,
    ja: さっきはちょっとカッコつけて、
  event_arcanearchive_06_s_115:
    speaker: arcana
    en: what with all that talk about protecting this information from oblivion, but...
    ko: 망각한테서 지키니 뭐니 얘길 하긴 했는데요.
    ja: 忘却から守るため～とか言っちゃいましたけど。
  event_arcanearchive_06_s_116:
    speaker: arcana
    en: The long and short of it is that if the Ark were to fall, it'd be curtains
      for these records.
    ko: 그래봤자 방주 망하면 다 끝인걸.
    ja: |-
      どんなに守ったところで、
      アークが滅べばすべてオシマイです。
  event_arcanearchive_06_s_117:
    speaker: "<Self>"
    en: "..."
    ko: 그건, 뭐….
    ja: "……"
  event_arcanearchive_06_s_118:
    speaker: arcana
    en: It's because of you,
    ko: 그쪽이랑,
    ja: だからこそ、あなたと…
  event_arcanearchive_06_s_119:
    speaker: "<Monologue>"
    en: Arcana stares at the wooden door at the end of the passageway.
    ko: 아르카나는 통로 끝, 나무문 쪽에 시선을 주었다.
    ja: |-
      アルカナは突き当たりにある
      木製の扉の方に視線を向けた
  event_arcanearchive_06_s_120:
    speaker: arcana
    en: and your compatriots,
    ko: 저분들이 계셨으니까.
    ja: あの方たちのおかげで、
  event_arcanearchive_06_s_121:
    speaker: arcana
    en: that there's a meaning to the work that I do.
    ko: 제가 하는 일에도 의미가 생긴다는 거죠.
    ja: 私の仕事に意味が生まれるんです。
  event_arcanearchive_06_s_122:
    speaker: arcana
    en: And...
    ko: 그리고….
    ja: それに…
  event_arcanearchive_06_s_123:
    speaker: "<Self>"
    en: Yes?
    ko: 그리고?
    ja: それに？
  event_arcanearchive_06_s_124:
    speaker: arcana
    en: It's just plain cool!
    ko: 멋있잖아요?
    ja: 単純に、カッコいいじゃないですか。
  event_arcanearchive_06_s_125:
    speaker: arcana
    en: Facing the Raptures and Heretics and not backing down. Defeating them all.
    ko: 랩쳐랑 헬레틱들 상대로도 하나도 안 물러서고. 다 무찌르고.
    ja: |-
      ラプチャーやヘレティックが相手でも、
      堂々とした態度。
  event_arcanearchive_06_s_126:
    speaker: arcana
    en: You standing your ground and bellowing, "I will protect my Nikkes!"
    ko: 그쪽도 막, 내 여자는 내가 지킨다! 하고 딱 막아서고.
    ja: |-
      「俺の女は俺が守る！」って、
      敵に立ち向かうその姿勢！
  event_arcanearchive_06_s_127:
    speaker: "<Choice>"
    en: Did I do that?
    ko: 내, 내가 그랬었어?
    ja: わ、私がいつそんなことを？
  event_arcanearchive_06_s_128:
    speaker: "<Choice>"
    en: When did I ever do that?
    ko: 내가 언제 그랬어!
    ja: そんなことは言ってない！
  event_arcanearchive_06_s_129:
    speaker: arcana
    en: Even if you didn't, it doesn't matter.
    ko: 아님 말구요.
    ja: ふふっ、そういうことにしておきま～す。
  event_arcanearchive_06_s_130:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_s_131:
    speaker: arcana
    en: Oh, right.
    ko: 아, 맞다.
    ja: あっ、そうだ。
  event_arcanearchive_06_s_132:
    speaker: arcana
    en: There was something I always wanted to tell you
    ko: 그래도 언젠가 실제로 만나게 된다면.
    ja: いつか実際に会えたら、
  event_arcanearchive_06_s_133:
    speaker: arcana
    en: if I ever met you in person.
    ko: 이 말 만큼은 꼭 하고 싶었는데.
    ja: これだけは伝えたいなって思ってたんです。
  event_arcanearchive_06_s_134:
    speaker: "<Self>"
    en: What's that?
    ko: 뭔데?
    ja: 何だ？
  event_arcanearchive_06_s_135:
    speaker: "<Monologue>"
    en: Arcana takes a step back,
    ko: 아르카나는 한 걸음 물러선 뒤.
    ja: アルカナはうやうやしく一歩下がると…
  event_arcanearchive_06_s_136:
    speaker: "<Monologue>"
    en: and bows her head.
    ko: 꾸벅 고개를 숙였다.
    ja: ぺこりと頭を下げた
  event_arcanearchive_06_s_137:
    speaker: arcana
    en: "... Thank you."
    ko: "…감사해요."
    ja: "…ありがとうございます。"
  event_arcanearchive_06_s_138:
    speaker: arcana
    en: For fighting for us.
    ko: 저희를 위해, 싸워주셔서.
    ja: 私たちのために、戦ってくださって。
  event_arcanearchive_06_s_139:
    speaker: "<Self>"
    en: "..."
    ko: "………."
    ja: "………"
  event_arcanearchive_06_s_140:
    speaker: "<Self>"
    en: Uh... thank you for all that you've done as well.
    ko: "…응. 나도 고마워."
    ja: "…ああ。こちらこそありがとう"
event_arcanearchive_06_e:
  event_arcanearchive_06_e_1:
    speaker: "<Monologue>"
    en: Arcana and I head out of the library and eventually arrive at Elysion headquarters.
    ko: 도서관을 나와, 아르카나와 함께 엘리시온 본사 앞에 도착했다.
    ja: |-
      図書館を出た私とアルカナは、
      エリシオン本社の前に到着した
  event_arcanearchive_06_e_2:
    speaker: arcana
    en: Oh, wait just a second.
    ko: 아. 잠깐만요.
    ja: あ、待ってください。
  event_arcanearchive_06_e_3:
    speaker: "<Self>"
    en: What is it?
    ko: 응?
    ja: どうかしたか？
  event_arcanearchive_06_e_4:
    speaker: arcana
    en: I need to take a photo as proof.
    ko: 인증샷 좀 찍을게요.
    ja: えへ、記念写真を撮り忘れてました。
  event_arcanearchive_06_e_5:
    speaker: "<Monologue>"
    en: Arcana leans against me and pulls out her phone.
    ko: 아르카나는 내 가슴팍에 등을 기대고 핸드폰을 꺼냈다.
    ja: |-
      アルカナは私の胸にもたれながら、
      携帯電話を取り出した
  event_arcanearchive_06_e_6:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_7:
    speaker: "<Monologue>"
    en: I suddenly remember all the photos plastered on the wall in Arcana's room.
    ko: 아르카나의 방에 붙어있던 수많은 사진이 떠올랐다.
    ja: |-
      ふと、アルカナの仕事部屋に貼ってあった
      大量の写真を思い出した
  event_arcanearchive_06_e_8:
    speaker: "<Self>"
    en: "... Arcana."
    ko: "…아르카나."
    ja: "…アルカナ"
  event_arcanearchive_06_e_9:
    speaker: arcana
    en: One second. Just gotta access the camera.
    ko: 잠깐만요. 카메라 어플 좀 켜구.
    ja: 待ってください、今カメラを起動して…
  event_arcanearchive_06_e_10:
    speaker: "<Self>"
    en: I can enter the Forbidden Library as well, right?
    ko: 이젠 나도 금서고 들어갈 수 있는 거잖아?
    ja: 今後は、私も禁書庫に入れるんだろう？
  event_arcanearchive_06_e_11:
    speaker: arcana
    en: That right. Since you have authorization.
    ko: 그쵸? 허가 받았으니까.
    ja: "…？そうですね、許可が出ましたので。"
  event_arcanearchive_06_e_12:
    speaker: arcana
    en: Goodness me, this camera is so slow.
    ko: "…으으. 켜는 거 너무 느리다."
    ja: うぅ、起動するのに時間が…
  event_arcanearchive_06_e_13:
    speaker: "<Self>"
    en: That means I'll be able to remember things for you.
    ko: "…그러니까 나도 같이 기억해 줄게."
    ja: "…ならこれからは、私も一緒に覚えていよう"
  event_arcanearchive_06_e_14:
    speaker: arcana
    en: I really ought to get a new ph...
    ko: 핸드폰 바꿀 때가 됐….
    ja: そろそろ替え時か…な…
  event_arcanearchive_06_e_15:
    speaker: arcana
    en: What?
    ko: 네??
    ja: えっ？？
  event_arcanearchive_06_e_16:
    speaker: "<Self>"
    en: Photos are great,
    ko: 의지할 수 있는 사람이 있으면 더 좋잖아.
    ja: 写真もいいが…
  event_arcanearchive_06_e_17:
    speaker: "<Self>"
    en: but it's better to have someone else you can depend on.
    ko: 사진도 사진이지만.
    ja: 頼れる相手がいた方がいいだろう？
  event_arcanearchive_06_e_18:
    speaker: arcana
    en: "..."
    ko: "………."
    ja: "………"
  event_arcanearchive_06_e_19:
    speaker: arcana
    en: I... I just take these photos for fun.
    ko: "…사진은 그냥 재미있어서 찍는 건데요?"
    ja: |-
      …写真は、ただ楽しいから
      撮ってるだけですけど？
  event_arcanearchive_06_e_20:
    speaker: "<Self>"
    en: You do?
    ko: 응?
    ja: えっ？
  event_arcanearchive_06_e_21:
    speaker: arcana
    en: You don't think selfies are fun?
    ko: 자기 얼굴 보면 재미있지 않아요?
    ja: |-
      だって、自分の顔を見るのって
      楽しいじゃありませんか。
  event_arcanearchive_06_e_22:
    speaker: arcana
    en: They are for me.
    ko: 난 그렇던데.
    ja: 少なくとも、私はそうなんです。
  event_arcanearchive_06_e_23:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_24:
    speaker: arcana
    en: I-I mean, I can totally get why someone would get the wrong idea.
    ko: 푸훗. 헷갈렸구나.
    ja: ぷふっ…もしかして、カン違いしちゃいました？
  event_arcanearchive_06_e_25:
    speaker: arcana
    en: That they'd take me for some tragic heroine or something like that,
    ko: 아아, 뭐. 헷갈릴 만하긴 하네요.
    ja: まあ、そう思っちゃうのも分かります。
  event_arcanearchive_06_e_26:
    speaker: arcana
    en: but... they'd be wrong!
    ko: 뭔가 비운의 여주인공틱 하구.
    ja: なんか、悲劇のヒロインっぽいですし。
  event_arcanearchive_06_e_27:
    speaker: "<Self>"
    en: "..."
    ko: "………."
    ja: "………"
  event_arcanearchive_06_e_28:
    speaker: arcana
    en: Anyway.
    ko: 그래도….
    ja: でも…
  event_arcanearchive_06_e_29:
    speaker: arcana
    en: You looked really cool a moment ago. Got my heart racing and everything.
    ko: 나름대로 멋있었어요. 좀 두근거렸어.
    ja: |-
      今の、結構カッコよかったですよ。
      ちょっとドキドキしちゃいました。
  event_arcanearchive_06_e_30:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵.
    ja: カシャッ
  event_arcanearchive_06_e_31:
    speaker: "<Monologue>"
    en: Once Arcana has configured the settings to her liking, she takes a photo.
    ko: 세팅이 끝났는지, 아르카나가 사진을 찍었다.
    ja: |-
      設定が終わったのか、
      アルカナはシャッターを押した
  event_arcanearchive_06_e_32:
    speaker: arcana
    en: Hmm...
    ko: 으음….
    ja: うーん…
  event_arcanearchive_06_e_33:
    speaker: arcana
    en: Any chance you could smile for me a little bit more?
    ko: 저기요? 좀 웃어주시면 안 될까요?
    ja: あの～、もうちょっと笑ってくれませんか？
  event_arcanearchive_06_e_34:
    speaker: arcana
    en: I want to remember this as a happy moment.
    ko: 이왕이면 밝은 모습으로 기억하고 싶은데.
    ja: せっかくなら、明るい姿を覚えておきたいので。
  event_arcanearchive_06_e_35:
    speaker: "<Self>"
    en: You said you didn't see this as a commemorative thing.
    ko: 기억하려고 찍는 건 아니라며?
    ja: 記録するために撮っているんじゃないんだろう？
  event_arcanearchive_06_e_36:
    speaker: arcana
    en: I don't.
    ko: 네. 기억하려고 찍는 거 아니에요.
    ja: はい、そうですよ？
  event_arcanearchive_06_e_37:
    speaker: arcana
    en: It's just...
    ko: 이건 그냥….
    ja: これはただ…
  event_arcanearchive_06_e_38:
    speaker: "<Narration>"
    en: "*Click click click*"
    ko: 찰칵. 찰칵. 찰칵.
    ja: カシャッ、カシャッ、カシャッ
  event_arcanearchive_06_e_39:
    speaker: arcana
    en: I just want to have a photo with my favorite commander that I can cherish.
    ko: 최애랑 찍은 사진 간직하려고 찍는 거.
    ja: |-
      推しとの写真を記念に撮りたいな～と
      思っただけです。
  event_arcanearchive_06_e_40:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_41:
    speaker: arcana
    en: Once my memory is wiped,
    ko: 뭐… 그래도 기억 지우고 나면.
    ja: とはいえ、記憶を消されてしまったら…
  event_arcanearchive_06_e_42:
    speaker: arcana
    en: I may be able to remember you helping me regain my memories,
    ko: 그쪽이 제가 기억 잃은 거 도와준 건 기억해도,
    ja: |-
      あなたが、私の記憶を取り戻すために
      手伝ってくれたことは覚えていても…
  event_arcanearchive_06_e_43:
    speaker: arcana
    en: but I may forget just how much I like you, and our conversation that we had
      in the Forbidden Library.
    ko: 제 최애라는 거랑, 금서고에서 했던 얘기는 잊어버리겠지만요.
    ja: |-
      あなたが私の推しだってことや、
      禁書庫で話したことは忘れちゃうんですけどね。
  event_arcanearchive_06_e_44:
    speaker: arcana
    en: There we go. That one came out much better.
    ko: 아. 이거 잘 나왔다.
    ja: あっ、これはいい感じに盛れてる！
  event_arcanearchive_06_e_45:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_46:
    speaker: arcana
    en: There you go again making that face.
    ko: 또 또 그런 표정 짓는다.
    ja: ほら～、またその顔。
  event_arcanearchive_06_e_47:
    speaker: arcana
    en: "... Fine."
    ko: 음….
    ja: うーん…
  event_arcanearchive_06_e_48:
    speaker: arcana
    en: If it bothers you that much...
    ko: "…정 그러면요."
    ja: "…そんなに引っかかるなら。"
  event_arcanearchive_06_e_49:
    speaker: "<Monologue>"
    en: Arcana holds out her pinky finger.
    ko: 아르카나가 새끼손가락을 내밀었다.
    ja: アルカナはそっと小指を差し出した
  event_arcanearchive_06_e_50:
    speaker: arcana
    en: Let's collaborate every once in a while.
    ko: 한 번씩, 저랑 협업해요.
    ja: 私と手を組みませんか？
  event_arcanearchive_06_e_51:
    speaker: "<Self>"
    en: Collaborate?
    ko: 협업?
    ja: 手を組む？
  event_arcanearchive_06_e_52:
    speaker: arcana
    en: Yeah, as in work together.
    ko: 네. 협업.
    ja: ふふ、はい。
  event_arcanearchive_06_e_53:
    speaker: arcana
    en: My job is to record things,
    ko: 어차피 제가 기록해야 되는데.
    ja: どうせ、記録するのは私なんです。
  event_arcanearchive_06_e_54:
    speaker: arcana
    en: and it's far better to get the information straight from the source than from
      reading secondhand reports.
    ko: 전달받아서 하는 것보다, 장본인한테 직접 듣는 게 더 정확하잖아.
    ja: |-
      なら、報告書をもとに書き写すより、
      本人から直接聞いた方が正確でしょう？
  event_arcanearchive_06_e_55:
    speaker: arcana
    en: Missions reports are dry as dirt anyway. I don't like reading them.
    ko: 작전 보고서는 너무 딱딱해서 별로 읽기 싫기도 하고요.
    ja: |-
      正直、作戦報告書の内容って堅苦しいので、
      あんまり読みたくないんですよね～
  event_arcanearchive_06_e_56:
    speaker: arcana
    en: And...
    ko: 그리고….
    ja: それに…
  event_arcanearchive_06_e_57:
    speaker: arcana
    en: When we're inside the Forbidden Library, I'd remember everything.
    ko: 금서고 안에서는 전부, 기억하고 있을 테니까.
    ja: 禁書庫の中では、すべて覚えているはずなので。
  event_arcanearchive_06_e_58:
    speaker: "<Self>"
    en: "... Okay."
    ko: "……알았어."
    ja: "…分かった"
  event_arcanearchive_06_e_59:
    speaker: arcana
    en: Promise?
    ko: 약속?
    ja: ふふ、約束ですよ？
  event_arcanearchive_06_e_60:
    speaker: "<Self>"
    en: Promise.
    ko: 약속.
    ja: ああ、約束しよう
  event_arcanearchive_06_e_61:
    speaker: "<Monologue>"
    en: I lock my pinky finger with Arcana's.
    ko: 아르카나와 손가락을 걸었다.
    ja: アルカナと指切りをした
  event_arcanearchive_06_e_62:
    speaker: arcana
    en: You stay put. I'll be back.
    ko: 그럼 얌전히 기다리고 있어요. 갔다 올게.
    ja: |-
      じゃあ、大人しく待っててくださいね。
      いってきま～す！
  event_arcanearchive_06_e_63:
    speaker: "<Monologue>"
    en: After Arcana disappears into the building, I check a message that I received
      a few moments prior.
    ko: |-
      …아르카나가 건물 안으로 사라진 뒤,
      핸드폰을 꺼내 조금 전에 왔던 메시지를 다시 확인했다.
    ja: |-
      …アルカナが建物の中に入った後、
      携帯電話を取り出して先ほど届いた
      メッセージを確認した
  event_arcanearchive_06_e_64:
    speaker: "<Narration>"
    en: I expect a tactical decision.
    ko: "[택티컬한 결정을 기대하겠다.]"
    ja: "「タクティカルな決断を期待している」"
  event_arcanearchive_06_e_65:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_66:
    speaker: "<Monologue>"
    en: I follow Arcana into Elysion headquarters.
    ko: 아르카나의 뒤를 따라, 엘리시온 본사 안쪽으로 걸음을 옮겼다.
    ja: |-
      アルカナに続くように、
      私はエリシオン本社へと入っていった
  event_arcanearchive_06_e_67:
    speaker: "<Monologue>"
    en: Upon seeing me enter the office, Ingrid puts down the tablet she was looking
      at.
    ko: 사무실에 들어가자, 잉그리드는 보고 있던 태블릿을 내려놓았다.
    ja: |-
      事務室に入ると、
      イングリッドは手にしていたタブレットを置いた
  event_arcanearchive_06_e_68:
    speaker: "<Self>"
    en: Ingri...
    ko: 잉그리….
    ja: イングリッ…
  event_arcanearchive_06_e_69:
    speaker: ingrid
    en: I don't know.
    ko: 모른다.
    ja: 知らないな。
  event_arcanearchive_06_e_70:
    speaker: "<Self>"
    en: You don't know what I was going to say.
    ko: "…내가 무슨 말을 할 줄 알고?"
    ja: "…まだ何も言っていないが"
  event_arcanearchive_06_e_71:
    speaker: ingrid
    en: I wasn't fully aware of what state Arcana was in,
    ko: 나는 니케 아르카나가 어떤 상태였는지 몰랐고,
    ja: |-
      私はニケ・アルカナが
      どのような状態だったのか…
  event_arcanearchive_06_e_72:
    speaker: ingrid
    en: and I'm not aware of what you saw in the secret archive.
    ko: 네가 특급 기밀 보관소에서 무엇을 봤는지도 모른다.
    ja: |-
      お前が最高機密の保管庫で何を見たのかなど、
      何も知らない。
  event_arcanearchive_06_e_73:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_74:
    speaker: ingrid
    en: I know you have many questions you want to ask, but I can't help you.
    ko: 묻고 싶은 게 많은 건 알지만, 내가 대답해 줄 수 있는 건 없다.
    ja: |-
      聞きたいことが山ほどあるだろうが、
      私には何も答えられない。
  event_arcanearchive_06_e_75:
    speaker: ingrid
    en: However...
    ko: 그래도….
    ja: しかし…
  event_arcanearchive_06_e_76:
    speaker: "<Monologue>"
    en: Ingrid stands up and looks out the window.
    ko: 잉그리드는 자리에서 일어나, 창밖을 바라보고 섰다.
    ja: イングリッドは立ち上がり、窓の外を見つめた
  event_arcanearchive_06_e_77:
    speaker: ingrid
    en: If I were to hypothetically talk out loud to myself, I don't think that'd
      be a problem.
    ko: 혼잣말 정도는 괜찮을지도 모르겠군.
    ja: 独り言くらいは構わないだろう。
  event_arcanearchive_06_e_78:
    speaker: "<Self>"
    en: "... Well, since I'm already here."
    ko: "…그럼 나도 온 김에."
    ja: "…なら、私も来たついでに時間を潰すとしよう"
  event_arcanearchive_06_e_79:
    speaker: "<Monologue>"
    en: I sit at the table, where some refreshments have been laid out.
    ko: 다과가 마련되어 있는 테이블에 앉았다.
    ja: |-
      そう言いながら、私は茶菓子が用意された
      テーブルに座った
  event_arcanearchive_06_e_80:
    speaker: "<Monologue>"
    en: Steam rises from the freshly poured cup of hot coffee.
    ko: 잔에 담긴 커피에서는 따뜻한 김이 올라오고 있다.
    ja: |-
      カップに淹れられたコーヒーからは、
      もくもくと湯気が立っている
  event_arcanearchive_06_e_81:
    speaker: "<Self>"
    en: I might as well stay for a few moments.
    ko: 시간이나 좀 때우다 갈게.
    ja: 構わないか？
  event_arcanearchive_06_e_82:
    speaker: ingrid
    en: Do as you like.
    ko: 뭐, 그러도록.
    ja: ああ、そうするといい。
  event_arcanearchive_06_e_83:
    speaker: "<Self>"
    en: How are the Judges connected to the secret archive?
    ko: "…어째서 [저지스]가 특급 기밀 보관소와 관련되어 있는 거지?"
    ja: |-
      …どうして「ジャッジス」が
      機密保管庫に関わっているんだ？
  event_arcanearchive_06_e_84:
    speaker: ingrid
    en: The Ark is a smaller place than most think.
    ko: 새삼스럽지만, 방주는 참 좁군.
    ja: 今さらだが、アークは狭い。
  event_arcanearchive_06_e_85:
    speaker: ingrid
    en: You often end up meeting someone in one place,
    ko: 여기서 봤던 누군가를,
    ja: ここで会った誰かと…
  event_arcanearchive_06_e_86:
    speaker: ingrid
    en: and then running into them again in another.
    ko: 다른 곳에서, 다른 직함으로 다시 만나는 경우도 많지.
    ja: |-
      異なる場所、異なる肩書きで
      再会するのもそう珍しいことではない。
  event_arcanearchive_06_e_87:
    speaker: ingrid
    en: It's an awfully small cast of characters. It can get a bit tiresome.
    ko: 전부 그놈이 그놈이다. 지겨워 죽겠군.
    ja: うんざりするほど、登場人物が少ないんだ。
  event_arcanearchive_06_e_88:
    speaker: "<Self>"
    en: Why are you hiding information about the Goddess Squad?
    ko: "…갓데스에 대한 정보는 왜 숨기는 거야?"
    ja: "…なぜゴッデスに関する情報を隠しているんだ？"
  event_arcanearchive_06_e_89:
    speaker: ingrid
    en: There are many people out there who want to keep that information safe under
      lock and key.
    ko: 비밀이 지켜지길 바라는 이들은 많지.
    ja: 秘密が守られることを願う者が多いからだ。
  event_arcanearchive_06_e_90:
    speaker: ingrid
    en: 'The question is: are their goals all the same?'
    ko: 하지만 그들의 목적이 전부 같을 것인가.
    ja: |-
      だが、はたしてその者たちの目的は
      同じだろうか？
  event_arcanearchive_06_e_91:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_92:
    speaker: ingrid
    en: For some, perhaps they see that as the best choice.
    ko: 어쩌면 누군가에게는, 그게 최선이었을 수도 있을 거다.
    ja: |-
      少なくとも、誰かにとっては
      それが最善だったのだろうな。
  event_arcanearchive_06_e_93:
    speaker: "<Self>"
    en: When you say some...
    ko: 누군가라면….
    ja: 誰かとは…？
  event_arcanearchive_06_e_94:
    speaker: ingrid
    en: There isn't that much information out there on
    ko: 베스트셀러 스쿼드를 설립한 사람이 있다.
    ja: "…ベストセラー部隊の創設者。"
  event_arcanearchive_06_e_95:
    speaker: ingrid
    en: the man who founded the Best Seller Squad.
    ko: 별다른 기록이 남아 있지는 않지만,
    ja: これといった記録は残っていないが、
  event_arcanearchive_06_e_96:
    speaker: ingrid
    en: The only thing I'm certain of is that
    ko: 숨기고 싶은 비밀이 있었다는 것만은 확실해.
    ja: 隠したい秘密があったことは間違いないだろう。
  event_arcanearchive_06_e_97:
    speaker: ingrid
    en: there was something that he wanted to hide.
    ko: 그리고 그건….
    ja: そしてそれは…
  event_arcanearchive_06_e_98:
    speaker: ingrid
    en: The same goes for the higher-ups in the Ark.
    ko: 당시 방주의 고위층도 마찬가지였겠지.
    ja: 当時のアーク上層部も同じだったのだろうな。
  event_arcanearchive_06_e_99:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_100:
    speaker: "<Self>"
    en: That could explain why some of the official records don't exactly align with
      the truth.
    ko: 몇몇 기록이 사실과 다른 것도 같은 이유겠네.
    ja: 事実と異なる記録があるのも、そのせいか…
  event_arcanearchive_06_e_101:
    speaker: ingrid
    en: You could be right.
    ko: 그럴지도 모르겠군.
    ja: そうかもしれない。
  event_arcanearchive_06_e_102:
    speaker: ingrid
    en: Not even I know all the secrets that are hidden there.
    ko: 나조차 그 안의 비밀들에 대해 전부 아는 건 아니니까.
    ja: |-
      私でさえ、その秘密について
      すべて知っているわけではないからな。
  event_arcanearchive_06_e_103:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_104:
    speaker: ingrid
    en: I'm getting tired of talking to myself. I have to get back to work.
    ko: "…슬슬 혼잣말도 지겹군. 일이나 해야겠어."
    ja: "…そろそろ独り言も飽きた。私は仕事に戻る。"
  event_arcanearchive_06_e_105:
    speaker: ingrid
    en: In fact, Arcana's memory wipe should be finished by now.
    ko: 그러고 보니… 아르카나의 기억 소거도 끝났던가.
    ja: |-
      …ついでに伝えておくが、
      アルカナの記憶消去はもう終わっているはずだ。
  event_arcanearchive_06_e_106:
    speaker: "<Choice>"
    en: Already?
    ko: "…벌써?"
    ja: "…もう終わったのか？"
  event_arcanearchive_06_e_107:
    speaker: "<Choice>"
    en: Doesn't it usually take a few hours?
    ko: 몇 시간은 걸리는 거 아니었나?
    ja: 数時間はかかるものじゃないのか？
  event_arcanearchive_06_e_108:
    speaker: ingrid
    en: It was already complete by the time you got here.
    ko: 네가 여기 들어올 때 이미 끝나 있었다.
    ja: お前がここに来る時には、すでに終わっていた。
  event_arcanearchive_06_e_109:
    speaker: "<Monologue>"
    en: Ingrid taps on the tablet.
    ko: 잉그리드가 태블릿을 톡톡 두드렸다.
    ja: |-
      イングリッドがタブレットを
      トントンと指で叩いた
  event_arcanearchive_06_e_110:
    speaker: ingrid
    en: There were times when I felt my patience was at its limit,
    ko: 짜증 나는 걸 참고 미실리스와 계속 협력한 보람이 있었어.
    ja: |-
      いら立ちを抑えながら、
      ミシリスと協力し続けたかいがあったな。
  event_arcanearchive_06_e_111:
    speaker: ingrid
    en: but I must admit that cooperating with Missilis was worth it in the end.
    ko: 이제 엘리시온의 선별 기억 소거 기술은.
    ja: エリシオンの選別型記憶消去の技術は、
  event_arcanearchive_06_e_112:
    speaker: ingrid
    en: It's afforded us the ability to upgrade our own selective memory wipe technology.
    ko: 더 빠르고.
    ja: より早く、
  event_arcanearchive_06_e_113:
    speaker: ingrid
    en: Now it's much faster. Much safer.
    ko: 더욱 안전하고.
    ja: より安全で、
  event_arcanearchive_06_e_114:
    speaker: ingrid
    en: And more tactical.
    ko: 더더욱 택티컬해졌다.
    ja: よりタクティカルになった。
  event_arcanearchive_06_e_115:
    speaker: "<Self>"
    en: Again with the tactical talk...
    ko: 그놈의 택티컬은….
    ja: またタクティカルか…
  event_arcanearchive_06_e_116:
    speaker: ingrid
    en: You ought to be thankful.
    ko: 그 택티컬에 감사하도록.
    ja: そのタクティカルに感謝するように。
  event_arcanearchive_06_e_117:
    speaker: ingrid
    en: It's thanks to this tactical collaboration that we succeeded in this attempt.
    ko: 덕분에 이번 시도에 성공할 수 있었으니까.
    ja: おかげで、今回の挑戦に成功できたのだからな。
  event_arcanearchive_06_e_118:
    speaker: "<Self>"
    en: What attempt?
    ko: "…무슨 시도?"
    ja: "…挑戦？"
  event_arcanearchive_06_e_119:
    speaker: ingrid
    en: You can see for yourself.
    ko: 뭐… 그건 직접 확인해 보도록.
    ja: "…どういう意味かは、その目で確かめるといい。"
  event_arcanearchive_06_e_120:
    speaker: ingrid
    en: At any rate, there won't be any issues with losing memories going forward.
    ko: 아무튼, 앞으로는 이번 같이 기억이 날아가는 일은 어지간해선 일어나지 않을 거다.
    ja: |-
      とにかく、今回のように記憶が飛ぶことは
      今後はよほどじゃない限り起きないはずだ。
  event_arcanearchive_06_e_121:
    speaker: "<Self>"
    en: Somehow I doubt that.
    ko: 어지간해선….
    ja: よほどじゃない限り…
  event_arcanearchive_06_e_122:
    speaker: ingrid
    en: There could always be the one-in-a-million exception.
    ko: 만에 하나는 있을 수 있겠지.
    ja: 万が一、ということはあるからな。
  event_arcanearchive_06_e_123:
    speaker: ingrid
    en: However, it's precisely because of that...
    ko: 그래도 그렇기 때문에.
    ja: だからこそ…
  event_arcanearchive_06_e_124:
    speaker: "<Monologue>"
    en: Ingrid turns around and looks at me.
    ko: 잉그리드는 몸을 돌려 나를 바라봤다.
    ja: イングリッドは振り返って私を見つめた
  event_arcanearchive_06_e_125:
    speaker: ingrid
    en: That we need someone to stand by us, and the decisions we make.
    ko: 사람에게는 자신의 선택을 지켜보고, 응원해 주는 타인이 필요한 법이다.
    ja: |-
      自らの選択を見守り、
      支えてくれる存在が必要なのだ。
  event_arcanearchive_06_e_126:
    speaker: "<Self>"
    en: "... I understand."
    ko: "……알았어."
    ja: "…そうだな"
  event_arcanearchive_06_e_127:
    speaker: "<Monologue>"
    en: I take a sip of the now cold coffee, and get up.
    ko: 식어버린 커피를 마저 마시고 자리에서 일어났다.
    ja: |-
      私は冷めてしまったコーヒーを流し込むと、
      そのまま立ち上がった
  event_arcanearchive_06_e_128:
    speaker: "<Self>"
    en: Then I'll be off.
    ko: 그럼 이만 갈게.
    ja: そろそろ失礼する
  event_arcanearchive_06_e_129:
    speaker: "<Self>"
    en: Thank you.
    ko: 고마웠어.
    ja: "…ありがとう"
  event_arcanearchive_06_e_130:
    speaker: ingrid
    en: Elysion coffee tastes pretty good, wouldn't you say?
    ko: 우리 엘리시온의 커피가 맛있기는 하지.
    ja: エリシオンのコーヒーは格別だろう？
  event_arcanearchive_06_e_131:
    speaker: "<Self>"
    en: "... Yes. Delicious."
    ko: "…응. 맛있더라."
    ja: "…ああ、おいしかった"
  event_arcanearchive_06_e_132:
    speaker: "<Monologue>"
    en: I open the door, and am just about to leave when Ingrid calls to me.
    ko: 문을 열고 사무실을 나가려는 순간, 잉그리드의 목소리가 들렸다.
    ja: |-
      ドアを開けて事務室から出ようとした瞬間、
      イングリッドの声が聞こえた
  event_arcanearchive_06_e_133:
    speaker: ingrid
    en: Wait just a moment.
    ko: 아, 잠깐 기다리도록.
    ja: ああ、少し待ってくれ。
  event_arcanearchive_06_e_134:
    speaker: ingrid
    en: There was something.
    ko: 오래된 기록이 남아있었군.
    ja: ちょうど古い記録が残っているのを見つけてな。
  event_arcanearchive_06_e_135:
    speaker: "<Self>"
    en: What are you talking about?
    ko: 무슨 기록?
    ja: 記録？
  event_arcanearchive_06_e_136:
    speaker: "<Monologue>"
    en: Ingrid taps on the tablet.
    ko: 잉그리드가 태블릿 화면을 두드렸다.
    ja: イングリッドがタブレットをタップした
  event_arcanearchive_06_e_137:
    speaker: ingrid
    en: Information on the founder of the Best Seller Squad.
    ko: 베스트셀러 스쿼드의 창립자 말이다.
    ja: |-
      先ほど、ベストセラー部隊の
      創設者の記録は残っていないと言ったが…
  event_arcanearchive_06_e_138:
    speaker: ingrid
    en: A signature on an authorization form.
    ko: 허가증에 서명이 남아 있었다.
    ja: くしくも許可証に署名が残っていた。
  event_arcanearchive_06_e_139:
    speaker: ingrid
    en: Although it's just an initial.
    ko: 이니셜 한 글자 뿐이기는 하지만.
    ja: イニシャルだけだがな。
  event_arcanearchive_06_e_140:
    speaker: ingrid
    en: O.
    ko: "[O]라고 적혀있군."
    ja: "「O」…から始まる人物だそうだ。"
  event_arcanearchive_06_e_141:
    speaker: "<Monologue>"
    en: I rush out of Elysion headquarters.
    ko: 빠른 걸음으로 엘리시온 본사를 나왔다.
    ja: その後、早足でエリシオン本社を後にすると…
  event_arcanearchive_06_e_142:
    speaker: "<Monologue>"
    en: Near the main entrance, I spot a shock of familiar aqua-blue hair.
    ko: 정문 근처 벤치에서 어느새 눈에 익은 물빛 머리카락이 보인다.
    ja: |-
      正門の近くにあるベンチで、
      見覚えのある青色の髪が見えた
  event_arcanearchive_06_e_143:
    speaker: "<Monologue>"
    en: Beside Arcana, there lies an Americano and a cup of lemon tea.
    ko: "…아르카나의 옆에는 레몬 티와 아메리카노가 놓여 있다."
    ja: |-
      …アルカナの隣には、レモンティーと
      ブラックコーヒーが置かれている
  event_arcanearchive_06_e_144:
    speaker: "<Self>"
    en: Arcana.
    ko: 아르카나.
    ja: アルカナ
  event_arcanearchive_06_e_145:
    speaker: arcana
    en: Who are you?
    ko: 누구세요?
    ja: あら、どちら様ですか～？
  event_arcanearchive_06_e_146:
    speaker: arcana
    en: Ah! You're not the legendary commander that I've heard about, are you?
    ko: "…아! 혹시 그 전설의 지휘관님?"
    ja: |-
      …あっ！もしかして、
      最強とウワサの指揮官様ですかっ？
  event_arcanearchive_06_e_147:
    speaker: arcana
    en: I'm a big fan!
    ko: 와~ 저 진짜 팬인데.
    ja: わあ～！私、大ファンなんです！
  event_arcanearchive_06_e_148:
    speaker: arcana
    en: Do you like coffee, by any chance?
    ko: 혹시 커피 좋아하세요?
    ja: あっ、コーヒーはお好きですか？
  event_arcanearchive_06_e_149:
    speaker: "<Choice>"
    en: I sure do. Thanks.
    ko: "…고마워."
    ja: "…ありがとう"
  event_arcanearchive_06_e_150:
    speaker: "<Choice>"
    en: You're a horrible actor.
    ko: 연기 진짜 못한다.
    ja: 大根役者だな
  event_arcanearchive_06_e_151:
    speaker: arcana
    en: What? I-I'm not acting!
    ko: 여, 연기한 거 아닌데요?
    ja: べ、別に芝居なんてしてませんけど？
  event_arcanearchive_06_e_152:
    speaker: "<Monologue>"
    en: I take the coffee that Arcana offers me.
    ko: 아르카나가 건네주는 커피를 받았다.
    ja: アルカナからコーヒーを受け取った
  event_arcanearchive_06_e_153:
    speaker: arcana
    en: Where are you coming from?
    ko: 근데 어디 갔다가 이제 오는 거예요?
    ja: それより、どこに行ってたんですか？
  event_arcanearchive_06_e_154:
    speaker: arcana
    en: I told you to stay put.
    ko: 얌전히 기다리라고 했잖아.
    ja: 大人しく待っててくださいって言ったのに。
  event_arcanearchive_06_e_155:
    speaker: "<Self>"
    en: Sorry. I had a conversation with Ingrid.
    ko: 미안. 잉그리드랑 얘기 좀 했어.
    ja: すまない。イングリッドと話をしていた
  event_arcanearchive_06_e_156:
    speaker: arcana
    en: Oh, I see.
    ko: 앗. 죄송.
    ja: あっ、そうだったんですね？
  event_arcanearchive_06_e_157:
    speaker: "<Self>"
    en: How's your memory?
    ko: "…기억은 어때?"
    ja: "…記憶の方はどうだ？"
  event_arcanearchive_06_e_158:
    speaker: arcana
    en: Well...
    ko: 음. 글쎄요….
    ja: うーん。どうでしょう…
  event_arcanearchive_06_e_159:
    speaker: "<Monologue>"
    en: After pondering something for a few moments, Arcana points at me.
    ko: 고민하던 아르카나가 나를 가리켰다.
    ja: アルカナは小さくうなると、私を指さした
  event_arcanearchive_06_e_160:
    speaker: arcana
    en: I remember
    ko: 최애.
    ja: 推し。
  event_arcanearchive_06_e_161:
    speaker: arcana
    en: you're my favorite commander.
    ko: 응.
    ja: ですよね？
  event_arcanearchive_06_e_162:
    speaker: "<Self>"
    en: Is that all?
    ko: "…끝이야?"
    ja: "…それだけか？"
  event_arcanearchive_06_e_163:
    speaker: arcana
    en: Do I need more?
    ko: 더 필요해요?
    ja: 他に確認が必要ですか？
  event_arcanearchive_06_e_164:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_165:
    speaker: "<Self>"
    en: No. That's enough.
    ko: "…아니. 충분해."
    ja: "…いや、十分だ"
  event_arcanearchive_06_e_166:
    speaker: arcana
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  event_arcanearchive_06_e_167:
    speaker: arcana
    en: So, what did you and the Boss talk about?
    ko: 아, 사장님이랑은 어떤 얘기 했어요?
    ja: それで、社長とはどんなお話を？
  event_arcanearchive_06_e_168:
    speaker: arcana
    en: It's alright if it's bad news.
    ko: "…혹시 안 좋은 얘기 있어도 괜찮아요."
    ja: "…あっ、ネガティブな話でも大丈夫ですよ！"
  event_arcanearchive_06_e_169:
    speaker: arcana
    en: I can take it. You of all people should know that.
    ko: 알죠? 나 그런 거 신경 안 쓰는 거.
    ja: |-
      そういうのは気にしないタイプだって、
      知ってるでしょう？
  event_arcanearchive_06_e_170:
    speaker: "<Self>"
    en: It's good news. She said that you won't be forgetting as much going forward.
    ko: 좋은 일이야. 앞으로는 이런 일 없을 거래.
    ja: |-
      …朗報だ。今後は、もう今回のようなことは
      起きないらしい
  event_arcanearchive_06_e_171:
    speaker: "<Self>"
    en: She said the memory wipes will be...
    ko: 기억 소거가 좀 더… 음.
    ja: 記憶消去が…以前よりも少しだけ
  event_arcanearchive_06_e_172:
    speaker: "<Choice>"
    en: Safer.
    ko: 안정적이 됐다나 봐.
    ja: 安定したそうだ
  event_arcanearchive_06_e_173:
    speaker: "<Choice>"
    en: More tactical.
    ko: "…택티컬 해졌다나봐."
    ja: "…タクティカルになったそうだ"
  event_arcanearchive_06_e_174:
    speaker: arcana
    en: Ah, so the collaboration with Missilis yielded some results?
    ko: 아, 미실리스랑 기술 협력하던 게 결과가 나왔나 보네요?
    ja: |-
      あ、ミシリスと協力してた成果が
      出たんですね。
  event_arcanearchive_06_e_175:
    speaker: arcana
    en: Ugh. Not that word again.
    ko: 으으. 그놈의 택티컬.
    ja: うう、またタクティカルですか…
  event_arcanearchive_06_e_176:
    speaker: arcana
    en: Anyway, it seems the collaboration with Missilis yielded some results?
    ko: "…그래도 미실리스랑 기술 협력하던 게 결과가 나왔나 보네요?"
    ja: |-
      …それはさておき、
      ミシリスと協力してた成果が出たんですね。
  event_arcanearchive_06_e_177:
    speaker: "<Self>"
    en: You knew?
    ko: 알고 있었어?
    ja: 知っていたのか？
  event_arcanearchive_06_e_178:
    speaker: arcana
    en: Yes. Boss kept telling me about it. In fact, she told me so many times I thought
      my ears were gonna fall off.
    ko: 네. 사장님이 저 안심시켜 주신다고 귀에 딱지가 앉도록 말씀하셨거든요.
    ja: |-
      はい。私を安心させるためでしょうけど、
      耳にタコができるほど聞かされてましたので。
  event_arcanearchive_06_e_179:
    speaker: arcana
    en: I think she wanted to reassure me, even though I kept telling her I was fine.
    ko: 괜찮다는데도 맨날.
    ja: 大丈夫ですって言っても、何度も何度も。
  event_arcanearchive_06_e_180:
    speaker: "<Self>"
    en: I see.
    ko: "…그렇구나."
    ja: "…そうか"
  event_arcanearchive_06_e_181:
    speaker: arcana
    en: What else?
    ko: 그리고는요?
    ja: 他には？
  event_arcanearchive_06_e_182:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: えっ？
  event_arcanearchive_06_e_183:
    speaker: arcana
    en: There's no way you two talked for as long as you did and only covered that.
    ko: 이렇게 오랫동안 겨우 그 얘기만 했을 리는 없잖아요.
    ja: |-
      こんなに時間がかかったんですから、
      それだけなはずがないでしょう？
  event_arcanearchive_06_e_184:
    speaker: arcana
    en: So, what else did you talk about? Something important?
    ko: 사장님이랑 또 무슨 얘기 했어요? 중요한 얘기?
    ja: |-
      他にはどんなお話を？
      もしかして、大事な話ですか？
  event_arcanearchive_06_e_185:
    speaker: "<Self>"
    en: That...
    ko: 그건… 음….
    ja: それは…まあ…
  event_arcanearchive_06_e_186:
    speaker: "<Self>"
    en: Is a secret, I'm afraid.
    ko: 비밀.
    ja: 秘密だ
  event_arcanearchive_06_e_187:
    speaker: arcana
    en: Huh?
    ko: 네에?
    ja: ええっ？
  event_arcanearchive_06_e_188:
    speaker: "<Self>"
    en: Then again, if I were to talk to myself, I suppose that'd be all right...
    ko: 하지만 혼잣말 정도는….
    ja: だが、独り言くらいなら…
  event_arcanearchive_06_e_189:
    speaker: "<Monologue>"
    en: I was in a playful mood, so I emulated what Ingrid had done with me. However...
      my audience wasn't as receptive.
    ko: 문득 장난기가 돌아서 방금 들은 말을 따라 해 봤지만.
    ja: |-
      ふとからかいたくなり、先ほどの
      イングリッドの真似をしようとしたが…
  event_arcanearchive_06_e_190:
    speaker: arcana
    en: Who talks to themselves in front of someone?!
    ko: 사람 눈앞에 두고 무슨 혼잣말이에요!
    ja: 目の前にいるのに、何が独り言ですか！
  event_arcanearchive_06_e_191:
    speaker: arcana
    en: Just tell me. Quickly.
    ko: 말해줘요. 빨리.
    ja: |-
      もうっ、教えてくださいよ～！
      は～や～く～！
  event_arcanearchive_06_e_192:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_06_e_193:
    speaker: "<Monologue>"
    en: Seems like I'm not the only one
    ko: 아무래도 비밀은 지킬 수 있는 사람이 따로 있는 것 같다.
    ja: |-
      …どうやら、秘密を守れる人というのは
      限られているようだ
  event_arcanearchive_06_e_194:
    speaker: "<Monologue>"
    en: who can keep a secret.
    ko: 이를테면….
    ja: 例えば…
  event_arcanearchive_06_e_195:
    speaker: arcana
    en: My lips are sealed! Promise!
    ko: 비밀 꼭 지킬 테니까, 응?
    ja: |-
      絶対に誰にも言いませんから、
      ねっ？
  event_arcanearchive_06_e_196:
    speaker: "<Monologue>"
    en: For example, the person standing before me, smiling and drinking her lemon
      tea,
    ko: "…무엇보다 숭고한 사명을."
    ja: たった1杯のレモンティーで笑顔を浮かべて
  event_arcanearchive_06_e_197:
    speaker: "<Monologue>"
    en: is second to none when it comes to keeping secrets, especially regarding her
      most noble of missions.
    ko: 레몬 티 한잔에, 웃으며 간직할 수 있는 사람이라던가?
    ja: |-
      何よりも崇高な使命を
      抱えていられるような人が、そうなのだろう
  event_arcanearchive_06_e_198:
    speaker: "<Narration>"
    en: 'ARCANE ARCHIVE: END'
    ko: 'ARCANE ARCHIVE : END'
    ja: 'ARCANE ARCHIVE : END'
event_arcanearchive_epilogue:
  event_arcanearchive_epilogue_1:
    speaker: "<Narration>"
    en: A few days later.
    ko: 며칠 뒤.
    ja: 数日後
  event_arcanearchive_epilogue_2:
    speaker: arcana
    en: Hyah!
    ko: 얍!
    ja: えいっ！
  event_arcanearchive_epilogue_3:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 촤라락-
    ja: コロンッ、コロコロコロ…
  event_arcanearchive_epilogue_4:
    speaker: arcana
    en: Hmm...
    ko: 으으으으으음….
    ja: う～～～～ん…
  event_arcanearchive_epilogue_5:
    speaker: "<Monologue>"
    en: Arcana stares intently at the stones scattered on the table.
    ko: 아르카나는 탁자 위에 던진 돌멩이들을 뚫어져라 바라보고 있다.
    ja: |-
      アルカナはテーブルの上に投げた石を
      じっと見つめている
  event_arcanearchive_epilogue_6:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: そして…
  event_arcanearchive_epilogue_7:
    speaker: delta
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_epilogue_8:
    speaker: delta
    en: Well?
    ko: 어떻… 습니까?
    ja: どう…ですか？
  event_arcanearchive_epilogue_9:
    speaker: arcana
    en: Sssh! You'll jinx it.
    ko: 쉿. 부정 타요.
    ja: シーッ、静かに。縁起が悪いですよ。
  event_arcanearchive_epilogue_10:
    speaker: delta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_epilogue_11:
    speaker: delta
    en: I understand.
    ko: 알겠습니다.
    ja: りょ、了解しました。
  event_arcanearchive_epilogue_12:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_epilogue_13:
    speaker: "<Monologue>"
    en: Delta, who is sitting across from Arcana, gulps nervously and stares at the
      stones.
    ko: 마주앉은 델타 또한, 침을 꿀꺽 삼키며 돌멩이들을 바라보고 있다.
    ja: |-
      向かい合って座っているデルタも、
      ごくりとツバを飲み込んで石を見つめている
  event_arcanearchive_epilogue_14:
    speaker: arcana
    en: Gah!
    ko: 아아앗!
    ja: あああっ！
  event_arcanearchive_epilogue_15:
    speaker: delta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_epilogue_16:
    speaker: delta
    en: What is i...
    ko: 어떻… 읍.
    ja: どう…はっ。
  event_arcanearchive_epilogue_17:
    speaker: "<Monologue>"
    en: Delta cuts herself off and covers her mouth.
    ko: "…델타는 말하다말고 스스로 입을 막았다."
    ja: "…デルタは開きかけた口をあわてて塞いだ"
  event_arcanearchive_epilogue_18:
    speaker: arcana
    en: Oh, it's okay, you can talk. It's all done.
    ko: 아, 이제 괜찮아요. 다 됐어요.
    ja: あ、もう大丈夫ですよ～。終わりましたので。
  event_arcanearchive_epilogue_19:
    speaker: delta
    en: So... what does it say?
    ko: "…그럼, 혹시."
    ja: "…それで、結果は…？"
  event_arcanearchive_epilogue_20:
    speaker: arcana
    en: I think it would be better to look nearby.
    ko: 주변에서 찾아보는 게 좋겠어요.
    ja: う～ん、この辺りを探すのがいいみたいですね。
  event_arcanearchive_epilogue_21:
    speaker: arcana
    en: You see how this stone is tilted to the side about 25 degrees?
    ko: 응. 이 돌멩이, 옆으로 25도 정도 기울어진 거 보이죠?
    ja: |-
      ほら。この石、横に25度くらい
      傾いてるでしょう？
  event_arcanearchive_epilogue_22:
    speaker: "<Narration>"
    en: "*Nod*"
    ko: 끄덕끄덕.
    ja: コクンコクン
  event_arcanearchive_epilogue_23:
    speaker: arcana
    en: That means that you should look carefully around your surroundings.
    ko: 그게 주변을 잘 보라는 의미에요.
    ja: これは、周りをよく見なさいって意味なんです。
  event_arcanearchive_epilogue_24:
    speaker: delta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_epilogue_25:
    speaker: "<Narration>"
    en: "*Glance*"
    ko: 두리번두리번.
    ja: キョロキョロ
  event_arcanearchive_epilogue_26:
    speaker: arcana
    en: In terms of your relationships, it's saying that it's a person you already
      know.
    ko: 연애운에 관해서라면, 이미 알고 지내던 사람을 뜻하는 건데.
    ja: |-
      これが恋愛運のことなら、すでに
      知り合ってる人ですよ～って意味なんですが、
  event_arcanearchive_epilogue_27:
    speaker: arcana
    en: You asked me how to become normal. This means that you'll find the answer
      very soon.
    ko: |-
      이번 델타 님의 질문은 평범해질 수 있는 방법이었으니까,
      곧 알게 된다~ 라는 뜻인 거죠.
    ja: |-
      今回デルタ様が占ってほしいのは
      普通になる方法だったので、
      もうすぐ分かるって意味になりますね。
  event_arcanearchive_epilogue_28:
    speaker: delta
    en: "*Gulp*"
    ko: "……꿀꺽."
    ja: "…ゴクッ…"
  event_arcanearchive_epilogue_29:
    speaker: arcana
    en: Hehe. It's just fortune-telling. Don't take it too seriously.
    ko: 후후. 그래도 그냥 흘려들으세요. 점이란 건 원래 그런 거니까.
    ja: |-
      あっ、でもテキトーに聞き流してくださいね？
      占いって、それくらいゆる～く
      構えてたほうがいいので。
  event_arcanearchive_epilogue_30:
    speaker: arcana
    en: Unless...
    ko: 아니면….
    ja: それとも…
  event_arcanearchive_epilogue_31:
    speaker: "<Monologue>"
    en: Arcana taps on the tarot cards.
    ko: 아르카나가 타로 덱을 톡톡 두드렸다.
    ja: アルカナがタロットカードをトントンと叩いた
  event_arcanearchive_epilogue_32:
    speaker: arcana
    en: You want me to do a tarot reading?
    ko: 타로점도 한번 보실래요?
    ja: タロットの方もやってみますか？
  event_arcanearchive_epilogue_33:
    speaker: arcana
    en: This is my specialty, so it might be more accurate.
    ko: 요게 제 주특기라, 조~금 더 정확할 수도요?
    ja: |-
      私のメインはこっちなので、
      より精度が上がるかな～と。
  event_arcanearchive_epilogue_34:
    speaker: delta
    en: Yes, please!
    ko: "…부탁드리겠습니다."
    ja: "…お願いします。"
  event_arcanearchive_epilogue_35:
    speaker: arcana
    en: A wise decision! Since you're a new customer, I'll even give you a discount.
      Half off!
    ko: 잘 생각하셨어요~ 처음 오셨으니까, 이번에는 특별히 반값으로….
    ja: |-
      ふふ、いい判断ですね。
      ご新規さんなので、今回は特別に半額で…
  event_arcanearchive_epilogue_36:
    speaker: "<Self>"
    en: Wait a second.
    ko: "…잠깐만."
    ja: "…待ってくれ"
  event_arcanearchive_epilogue_37:
    speaker: arcana
    en: Patience, now. You'll be after Delta.
    ko: 아. 그쪽은 델타 님 끝나고 봐 드릴게요.
    ja: |-
      あ、指揮官様もご希望ですか？
      でしたらデルタ様のあとで…
  event_arcanearchive_epilogue_38:
    speaker: "<Self>"
    en: That's not what I meant.
    ko: 아니, 그게 아니라.
    ja: いや、そういうことではなく…
  event_arcanearchive_epilogue_39:
    speaker: "<Self>"
    en: Why are you running your business in my room?
    ko: "…왜 내 방에서 영업하는 거야?"
    ja: "…どうして私の部屋で占いをしているんだ？"
  event_arcanearchive_epilogue_40:
    speaker: arcana
    en: I have no choice.
    ko: 어쩔 수 없잖아요.
    ja: だって、仕方ないじゃないですか。
  event_arcanearchive_epilogue_41:
    speaker: arcana
    en: How could I have known I needed to re-up my lease on the day I lost my memory?
    ko: 누가 하필 가게 재계약일에 기억을 잃을 줄 알았나?
    ja: |-
      よりによって、お店の契約の更新日に
      記憶を失っちゃったんですよ？
  event_arcanearchive_epilogue_42:
    speaker: "<Choice>"
    en: Why didn't you take care of something that important earlier?
    ko: 그런 중요한 건 미리 했으면 되지 않았을까…?
    ja: |-
      そんな大事なことなら、
      事前にやっておくべきだったのでは…？
  event_arcanearchive_epilogue_43:
    speaker: "<Choice>"
    en: Couldn't you have stopped by your shop when you were going around trying to
      recover your memories?
    ko: 기억 찾으러 돌아다닐 때 들러봤으면 되지 않았을까…?
    ja: |-
      記憶を取り戻そうとしている時に
      寄ればよかったのでは…？
  event_arcanearchive_epilogue_44:
    speaker: arcana
    en: That landlord is a real tyrant.
    ko: 건물주님도 참 그래요.
    ja: オーナーもひどいですよね。
  event_arcanearchive_epilogue_45:
    speaker: arcana
    en: Is a one-day grace period too much to ask?
    ko: 하루 정도는 봐줄 수 있는 거 아니에요?
    ja: 一日くらい、大目に見てくれたっていいのに。
  event_arcanearchive_epilogue_46:
    speaker: arcana
    en: I've never been late on my rent even once, and they kick me out the first
      chance they get.
    ko: 월세 한 번도 밀린 적 없는데, 기다렸다는 듯이 쫓아내는 게 어딨어. 그쵸.
    ja: |-
      今まで一度も滞納したことなんてないのに、
      待ってましたと言わんばかりに追い出すなんて！
  event_arcanearchive_epilogue_47:
    speaker: "<Self>"
    en: Don't change the subject.
    ko: 말 돌리지 말고….
    ja: 話をそらさないでくれ…
  event_arcanearchive_epilogue_48:
    speaker: arcana
    en: Oh come on, let me stay here just for a while?
    ko: 아이 잠깐만 신세 질게요~
    ja: |-
      ということで、
      ちょっとだけお世話になりますね～
  event_arcanearchive_epilogue_49:
    speaker: arcana
    en: It's not like I'm gonna be shacking up here permanently. I'll just be using
      it here and there for work.
    ko: |-
      아예 눌러살겠다는 것도 아니고,
      일할 때만 잠깐잠깐 쓰는 건데 뭐 어때.
    ja: |-
      居候するわけでもありませんし、
      お仕事の時にちょこっと借りるだけですから！
  event_arcanearchive_epilogue_50:
    speaker: "<Self>"
    en: Absolutely no... huh?
    ko: 충분히 문제가…. 어어?
    ja: そういう問題じゃ…ん？
  event_arcanearchive_epilogue_51:
    speaker: "<Monologue>"
    en: The ground beneath me starts to undulate, and I shoot up.
    ko: 갑자기 바닥이 흔들려서 벌떡 일어났다.
    ja: |-
      急に地面が揺れたように感じ、
      思わず立ち上がった
  event_arcanearchive_epilogue_52:
    speaker: "<Self>"
    en: What in the world...?
    ko: 뭐, 뭐야?
    ja: な、何だ？
  event_arcanearchive_epilogue_53:
    speaker: "<Monologue>"
    en: The tremors become more severe in the spot where I was sitting,
    ko: 내가 앉아 있던 자리가 잠시 흔들리더니.
    ja: |-
      すると、私が座っていた場所が
      ガタガタと揺れ始め…
  event_arcanearchive_epilogue_54:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 덜컥.
    ja: ガチャッ
  event_arcanearchive_epilogue_55:
    speaker: "<Monologue>"
    en: and a hole opens up.
    ko: "…열렸다."
    ja: "…開いた"
  event_arcanearchive_epilogue_56:
    speaker: "<Self>"
    en: You've gotta be kidding me.
    ko: "……에이, 설마."
    ja: まさか…
  event_arcanearchive_epilogue_57:
    speaker: "<Monologue>"
    en: From inside the hole...
    ko: 그리고 그 안에서는….
    ja: そして、その中から…
  event_arcanearchive_epilogue_58:
    speaker: quency_e
    en: Huh? Instructor?
    ko: 어라? 교관님?
    ja: あれ？教官様～？
  event_arcanearchive_epilogue_59:
    speaker: miranda_c
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_epilogue_60:
    speaker: miranda_c
    en: What the heck is the Commander doing here?
    ko: 지휘관이 있습니다! 어째서입니까?
    ja: むむっ、なぜ指揮官がこちらに！？
  event_arcanearchive_epilogue_61:
    speaker: phantom
    en: Hey, Monsieur! Fancy meeting you there.
    ko: 그대. 어째서 이곳에 있소?
    ja: おや君か、これは奇遇だね？
  event_arcanearchive_epilogue_62:
    speaker: "<Monologue>"
    en: A few familiar phantom thieves appear.
    ko: "…익숙한 괴도들이 나타났다."
    ja: "…見慣れた怪盗たちが現れた"
  event_arcanearchive_epilogue_63:
    speaker: "<Self>"
    en: I'm here because this is my own room.
    ko: 그야 내 방이니까….
    ja: なぜって、ここは私の部屋なんだが…
  event_arcanearchive_epilogue_64:
    speaker: quency_e
    en: Oh, guess we ended up somewhere we've been before.
    ko: 아~ 하다 보니 익숙한 루트로 와버렸나 봐.
    ja: |-
      てへっ。つい使い慣れたルートを
      通っちゃったみたい。
  event_arcanearchive_epilogue_65:
    speaker: arcana
    en: Hi, Phantom.
    ko: 아, 팬텀. 어서 와요.
    ja: あれ、ファントム？いらっしゃ～い。
  event_arcanearchive_epilogue_66:
    speaker: phantom
    en: Arcana? What are you doing here?
    ko: 아르카나? 왜 여기 있소?
    ja: "…アルカナ？なぜここに？"
  event_arcanearchive_epilogue_67:
    speaker: arcana
    en: This is my new workspace.
    ko: 그야 제 작업실이니까요.
    ja: |-
      しばらく仕事部屋として
      使わせてもらうことになったんですよ～
  event_arcanearchive_epilogue_68:
    speaker: phantom
    en: I see.
    ko: 그렇군.
    ja: なるほど、そういうことか。
  event_arcanearchive_epilogue_69:
    speaker: "<Self>"
    en: The hell it is!
    ko: 그렇긴 뭐가 그래!
    ja: 納得しないでくれ…
  event_arcanearchive_epilogue_70:
    speaker: arcana
    en: Are you conducting some... er... phantom activities?
    ko: 팬텀은 그거, 괴도 활동?
    ja: |-
      そういうファントムは、
      怪盗の活動の真っ最中ですか？
  event_arcanearchive_epilogue_71:
    speaker: phantom
    en: I am.
    ko: 맞소.
    ja: ああ。
  event_arcanearchive_epilogue_72:
    speaker: phantom
    en: I was scouting for the Thieves of Justice's activities scheduled for this
      weekend...
    ko: 이번 주말에 예정된 정의괴도단 활동을 위해 정찰을….
    ja: |-
      今週末に予定している正義の怪盗団の
      活動に向けて、ちょうどパトロールを…
  event_arcanearchive_epilogue_73:
    speaker: phantom
    en: Agh, darn it!
    ko: "…아, 이건…."
    ja: |-
      …！
      その、今のは…
  event_arcanearchive_epilogue_74:
    speaker: arcana
    en: Was that supposed to be a secret?
    ko: 비밀. 맞죠?
    ja: ふふ。秘密、でしょう？
  event_arcanearchive_epilogue_75:
    speaker: phantom
    en: Correct. No one outside this room can know about it.
    ko: 그렇소. 그 누구도 알아서는 안 되오.
    ja: "…ああ。誰にも知られてはならないからな。"
  event_arcanearchive_epilogue_76:
    speaker: delta
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_epilogue_77:
    speaker: delta
    en: What's all this about phantom thieves?
    ko: 괴도… 말입니까?
    ja: 怪盗…ですか？
  event_arcanearchive_epilogue_78:
    speaker: phantom
    en: "!!"
    ko: "!!!!!"
    ja: "！！！！！"
  event_arcanearchive_epilogue_79:
    speaker: phantom
    en: How the...?!
    ko: 어, 어째서…?
    ja: なっ…どういうことだ…？
  event_arcanearchive_epilogue_80:
    speaker: phantom
    en: I didn't sense your presence at all!
    ko: 분명 아무런 기척도 느끼지 못했소만…!
    ja: 何の気配も感じなかったぞ…！
  event_arcanearchive_epilogue_81:
    speaker: miranda_c
    en: Me neither!
    ko: 저도 그렇습니다!
    ja: 私もです！
  event_arcanearchive_epilogue_82:
    speaker: quency_e
    en: How interesting!
    ko: 신기하다~
    ja: 不思議ね～
  event_arcanearchive_epilogue_83:
    speaker: quency_e
    en: Would you like to join the Thieves of Justice?
    ko: 같이 정의괴도단 할래?
    ja: ねぇ、正義の怪盗団に入らない？
  event_arcanearchive_epilogue_84:
    speaker: delta
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_epilogue_85:
    speaker: arcana
    en: That means that you should look carefully around your surroundings.
    ko: 그게 주변을 잘 보라는 의미에요.
    ja: これは、周りをよく見なさいって意味なんです。
  event_arcanearchive_epilogue_86:
    speaker: delta
    en: "!!"
    ko: "!!"
    ja: "！！"
  event_arcanearchive_epilogue_87:
    speaker: "<Narration>"
    en: "*Glance*"
    ko: 두리번두리번.
    ja: キョロキョロ
  event_arcanearchive_epilogue_88:
    speaker: arcana
    en: In terms of your relationships, it's saying that it's a person you already
      know.
    ko: 연애운에 관해서라면, 이미 알고 지내던 사람을 뜻하는 건데.
    ja: |-
      これが恋愛運のことなら、すでに
      知り合ってる人ですよ～って意味なんですが、
  event_arcanearchive_epilogue_89:
    speaker: arcana
    en: You asked me how to become normal. This means that you'll find the answer
      very soon.
    ko: |-
      이번 델타 님의 질문은 평범해질 수 있는 방법이었으니까,
      곧 알게 된다~ 라는 뜻인 거죠.
    ja: |-
      今回デルタ様が占ってほしいのは
      普通になる方法だったので、
      もうすぐ分かるって意味になりますね。
  event_arcanearchive_epilogue_90:
    speaker: delta
    en: So I should... look around me...?
    ko: 분명… 주변을 잘 보라고….
    ja: 周りを…よく見る…
  event_arcanearchive_epilogue_91:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_arcanearchive_epilogue_92:
    speaker: arcana
    en: All right, let's take a look at your destiny...
    ko: 흐음. 운명을 한 번 점쳐볼까요?
    ja: |-
      うーん。
      ちょっとデルタ様の運勢を占ってみますね。
  event_arcanearchive_epilogue_93:
    speaker: arcana
    en: "..."
    ko: 얍.
    ja: えいっ。
  event_arcanearchive_epilogue_94:
    speaker: "<Monologue>"
    en: Arcana holds my hand and makes me flip over a tarot card.
    ko: 아르카나는 내 손을 잡고, 타로 카드를 뒤집게 했다.
    ja: |-
      アルカナは唐突に私の手を握ると、
      タロットカードをめくらせた
  event_arcanearchive_epilogue_95:
    speaker: arcana
    en: Oh. The Fool.
    ko: 오. [바보].
    ja: おっ、「愚者」ですかぁ。
  event_arcanearchive_epilogue_96:
    speaker: "<Choice>"
    en: What does that mean?
    ko: "…무슨 뜻이야?"
    ja: "…どういう意味なんだ？"
  event_arcanearchive_epilogue_97:
    speaker: "<Choice>"
    en: You're not making fun of me, are you?
    ko: "…놀리는 건 아니지?"
    ja: "…からかってるのか？"
  event_arcanearchive_epilogue_98:
    speaker: arcana
    en: Of course not!
    ko: 에이. 그런 거 아니에요.
    ja: いやいや、違いますよ。
  event_arcanearchive_epilogue_99:
    speaker: "<Self>"
    en: Then what does it mean?
    ko: 그럼 무슨 뜻이야?
    ja: "…それで、どういう意味なんだ？"
  event_arcanearchive_epilogue_100:
    speaker: arcana
    en: There are many different meanings. But in this case, it probably signifies...
    ko: 여러 가지 의미가 있기는 한데요. 지금 맞는 건 아마….
    ja: いろんな意味がありますが、この場合だと…
  event_arcanearchive_epilogue_101:
    speaker: arcana
    en: That you'll be getting mixed up in something new.
    ko: "…새로운 사건에 휘말린다?"
    ja: "…新しい事件に巻き込まれる、とか？"
  event_arcanearchive_epilogue_102:
    speaker: delta
    en: Can I really become a phantom thief?
    ko: "…저도 괴도가 될 수 있습니까?"
    ja: "…私も怪盗になれますか？"
  event_arcanearchive_epilogue_103:
    speaker: phantom
    en: Anyone who is righteous is welcome.
    ko: 정의로운 이라면 누구나 환영이오.
    ja: 正義感のある者なら、誰でも歓迎だ。
  event_arcanearchive_epilogue_104:
    speaker: arcana
    en: Uh oh...
    ko: 오오?
    ja: おおっ？
  event_arcanearchive_epilogue_105:
    speaker: "<Self>"
    en: Here we go again...
    ko: "……제발."
    ja: "…これ以上私を巻き込まないでくれ…"
