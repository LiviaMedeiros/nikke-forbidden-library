  event_newflavor_06_e_154:
    speaker: bready
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_newflavor_06_e_155:
    speaker: bready
    en: Hmm?
    ko: 이게….
    ja: これは…
  event_newflavor_06_e_156:
    speaker: bready
    en: What is that?
    ko: 이게 뭐야?
    ja: 何？
  event_newflavor_06_e_157:
    speaker: bready
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_newflavor_06_e_158:
    speaker: bready
    en: "*Lick lick*"
    ko: 할짝- 할짝-
    ja: ペロッ、ペロッ――
  event_newflavor_06_e_159:
    speaker: "<Self>"
    en: "...?"
