    ko: 하지만….
    ja: でも…
  event_newflavor_06_e_143:
    speaker: bready
    en: I think the Commander will be different.
    ko: 지휘관은 다를 것 같아.
    ja: 指揮官は、違う気がするの。
  event_newflavor_06_e_144:
