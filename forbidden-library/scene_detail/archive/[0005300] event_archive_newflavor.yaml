    speaker: bready
    en: Bonne Bouche.
    ko: 나왔어.
    ja: 私よ。
  event_newflavor_epilogue_6:
    speaker: "<Self>"
    en: You're a half hour early.
    ko: 오늘은 30분이나 일찍 왔네.
    ja: 今日は30分も早く来たな
  event_newflavor_epilogue_7:
    speaker: bready
    en: You kept saying you had other plans the past few times, so it's been a while
      since we last saw each other.
    ko: |-
      응, 자꾸 미미가 시간이 안 된다고 해서
      오랜만에 왔잖아.
    ja: |-
      うん。いつも時間がないって言われるし、
      会うのも久しぶりでしょ？
  event_newflavor_epilogue_8:
    speaker: bready
    en: That's why I couldn't help myself, and came early.
    ko: 그래서 빨리 왔어.
    ja: だから早く来たの。
  event_newflavor_epilogue_9:
    speaker: "<Self>"
    en: "..."
    ko: 아하….
    ja: そうか…
  event_newflavor_epilogue_10:
    speaker: bready
    en: Are you all set?
    ko: 준비는 다 된 거야?
    ja: 準備はいい？
  event_newflavor_epilogue_11:
    speaker: "<Self>"
    en: Yeah...
    ko: 응….
    ja: ああ…
  event_newflavor_epilogue_12:
    speaker: "<Monologue>"
    en: It's not like I had to do much to prepare. All I had to do was wash my hands.
    ko: "…준비라고 해봤자, 손을 깨끗하게 씻어두는 것뿐이지만."
    ja: |-
      …準備といっても、
      手をきれいに洗っただけだが…
  event_newflavor_epilogue_13:
    speaker: bready
    en: You remember how I told you there was something I wanted to experiment with?
    ko: 실험해 보고 싶은 게 있다고 했잖아.
    ja: 試してみたいことがあるって言ったでしょ？
  event_newflavor_epilogue_14:
    speaker: bready
    en: This might feel a bit unpleasant, but...
    ko: 조금 기분 나쁠 수 있겠지만….
    ja: |-
      ちょっと気持ち悪い感じが
      するかもしれないけど…
  event_newflavor_epilogue_15:
    speaker: bready
    en: Could you spread this whipped cream on your hand?
    ko: 이 생크림을 손에 발라줄 수 있을까?
    ja: この生クリームを手に塗ってくれる？
  event_newflavor_epilogue_16:
    speaker: "<Self>"
    en: What in the world for?
    ko: 바르라고? 생크림을?
    ja: 手に？生クリームを？
  event_newflavor_epilogue_17:
    speaker: bready
    en: The first time I tasted you,
    ko: 응.
    ja: うん。
  event_newflavor_epilogue_18:
    speaker: bready
    en: the predominant flavor profile was sweet.
    ko: 처음 느꼈던 건, 단맛.
    ja: 初めて味を見た時は、甘みだったけど。
  event_newflavor_epilogue_19:
    speaker: bready
    en: But last time, your fingers had a slightly salty taste to them.
    ko: |-
      하지만 지난번 미미의 손가락에서는,
      짠맛도 났어.
    ja: でもこの間は、指から塩味もしたの。
  event_newflavor_epilogue_20:
    speaker: "<Self>"
    en: That's probably because we were outside, what with the dust and sweat and
      all.
    ko: 그땐 밖이라, 먼지랑 땀 때문에 그랬던 거 아닐까…?
    ja: |-
      あの時は外にいたから、ホコリか汗でも
      混ざっていたんじゃないか…？
  event_newflavor_epilogue_21:
    speaker: bready
    en: Perhaps.
    ko: 그럴 수도 있지.
    ja: そうかもね。
  event_newflavor_epilogue_22:
    speaker: bready
    en: Still, a little experimenting couldn't hurt.
    ko: 그래도, 실험해 보는 건 나쁘지 않으니까.
    ja: でも、試してみるのも悪くないでしょ？
  event_newflavor_epilogue_23:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_24:
    speaker: "<Monologue>"
    en: I take the container of whipped cream and spread it onto my hand, rubbing
      it around.
    ko: 나는 통에 담긴 생크림을 손에 발라 비볐다.
    ja: |-
      私は容器に入っている生クリームを
      手に塗って馴染ませた
  event_newflavor_epilogue_25:
    speaker: "<Self>"
    en: Feels a bit like soap.
    ko: 으음… 비누 같기도 하고.
    ja: うーん…セッケンのようだな
  event_newflavor_epilogue_26:
    speaker: bready
    en: "*Gulp*..."
    ko: "…꿀꺽."
    ja: "…ゴクッ。"
  event_newflavor_epilogue_27:
    speaker: bready
    en: That should do it.
    ko: 그 정도면 된 것 같아.
    ja: それくらいでいいわ。
  event_newflavor_epilogue_28:
    speaker: bready
    en: All right, I'm going in.
    ko: 그럼, 잘 먹겠습니다.
    ja: じゃあ、いただきます。
  event_newflavor_epilogue_29:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_30:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_31:
    speaker: bready
    en: "*Lick*"
    ko: 할짝.
    ja: ペロッ…
  event_newflavor_epilogue_32:
    speaker: bready
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_newflavor_epilogue_33:
    speaker: bready
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_newflavor_epilogue_34:
    speaker: bready
    en: Such sweetness! Incredibly sweet.
    ko: 달아, 엄청 달아.
    ja: 甘い。とても甘いわ。
  event_newflavor_epilogue_35:
    speaker: bready
    en: Especially the parts of your hand where there's just a tinge of the whipped
      cream. Those are the best parts.
    ko: 특히, 생크림이 피부랑 얇게 맞닿은 이 부분이 제일 달고 맛있어.
    ja: |-
      特に、生クリームが肌と触れ合ってる
      部分が、一番甘くておいしいわ。
  event_newflavor_epilogue_36:
    speaker: bready
    en: I can't sense anything except the taste.
    ko: 맛 빼고는 아무것도 느껴지지 않아.
    ja: 味だけを感じられる。
  event_newflavor_epilogue_37:
    speaker: bready
    en: It's so fascinating.
    ko: "…너무 신기하네."
    ja: "…本当に不思議ね。"
  event_newflavor_epilogue_38:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_39:
    speaker: bready
    en: Could I lick just a little more?
    ko: 미미, 조금만 더 핥아도 될까?
    ja: ねえ、もう少しだけなめていい？
  event_newflavor_epilogue_40:
    speaker: "<Self>"
    en: I'd rather end it here, thanks.
    ko: 뭐? 아니 그건 좀….
    ja: 何？さすがにそろそろ…
  event_newflavor_epilogue_41:
    speaker: bready
    en: Very well. Next time, I'll bring some salt.
    ko: 아니면 다음에는 소금을 들고 와볼게.
    ja: それか、今度は塩を持ってくるわ。
  event_newflavor_epilogue_42:
    speaker: bready
    en: If I soak your hand in salt water, I assume it'd be saltier.
    ko: 손을 넣어서 절이면 짠맛이 확 나겠지?
    ja: |-
      手を漬け込んでみたら、
      いい感じに塩辛くなると思わない？
  event_newflavor_epilogue_43:
    speaker: bready
    en: Oh, or maybe rubbing it with some fruit would make it taste like that fruit?
    ko: |-
      아, 과일 같은 걸 문지르면
      그 과일의 맛이 나려나…?
    ja: |-
      あっ、フルーツにしたら
      そのフルーツの味になる…？
  event_newflavor_epilogue_44:
    speaker: bready
    en: Would the same thing work with vegetables too...?
    ko: 채소 같은 것도 될까….
    ja: あとは野菜も…
  event_newflavor_epilogue_45:
    speaker: "<Self>"
    en: Bready, please. Calm yourself.
    ko: 지, 진정해 브래디.
    ja: お、落ち着いてくれ、ブレッディ
  event_newflavor_epilogue_46:
    speaker: bready
    en: This is the first time I've experienced the pure sensation of taste ever since
      I became a Nikke. How can you expect me to be calm?
    ko: |-
      니케가 되고 나서, 처음으로 온전한 맛을 느끼고 있는데
      어떻게 진정을 할 수 있겠어.
    ja: |-
      ニケになってから、初めて純粋な味だけを
      感じられたのよ。落ち着いてなんて
      いられないわ。
  event_newflavor_epilogue_47:
    speaker: "<Self>"
    en: Fair point, but...
    ko: 그건 그렇지만….
    ja: そうかもしれないが…
  event_newflavor_epilogue_48:
    speaker: bready
    en: I'm going to enjoy tasting you in the future,
    ko: 그러니까, 미미.
    ja: だから、美味。
  event_newflavor_epilogue_49:
    speaker: bready
    en: Bonne Bouche.
    ko: 앞으로도 맛있게 잘 먹을게.
    ja: これからも、おいしくいただくわね。
  event_newflavor_epilogue_50:
    speaker: bready
    en: Let's meet often.
    ko: 자주 보자.
    ja: 末永くよろしく。
  event_newflavor_epilogue_51:
    speaker: bready
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_newflavor_epilogue_52:
    speaker: "<Narration>"
    en: 'NEW FLAVOR: END'
    ko: 'NEW FLAVOR : END'
    ja: 'NEW FLAVOR : END'
  event_newflavor_epilogue_53:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_54:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 보글보글-
    ja: グツグツ――
  event_newflavor_epilogue_55:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_56:
    speaker: "<Narration>"
    en: "*Sizzle*"
    ko: 치이익-
    ja: ジューッ――
  event_newflavor_epilogue_57:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_58:
    speaker: "<Narration>"
    en: "*Clatter, clatter*"
    ko: 달그락- 달그락-
    ja: カチャカチャ――
  event_newflavor_epilogue_59:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_60:
    speaker: crust
    en: "*Nom*"
    ko: "…냠."
    ja: "…ぱくっ…"
  event_newflavor_epilogue_61:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_epilogue_62:
    speaker: crust
    en: No.
    ko: 아니야.
    ja: ダメ。
  event_newflavor_epilogue_63:
    speaker: crust
    en: The flavor's much too ordinary.
    ko: 이건 그냥 평범한 맛이야.
    ja: これは何も特別じゃない。
  event_newflavor_epilogue_64:
    speaker: crust
    en: Let's try it again.
    ko: |-
      다시.
      다시 만들어 보자.
    ja: |-
      もう一回。
      もう一回作り直し。
  event_newflavor_epilogue_65:
    speaker: crust
    en: I...
    ko: 나도….
    ja: 私も…
  event_newflavor_epilogue_66:
    speaker: crust
    en: I've got to create a flavor that makes Bready happy.
    ko: 브래디가 행복해하는 맛을 만들어 낼 수 있을 거야.
    ja: ブレッディが幸せになれる味を作らなきゃ。
  event_newflavor_epilogue_67:
    speaker: crust
    en: That's been my goal from the very beginning.
    ko: 그게 나의 첫 번째 목표였으니까.
    ja: それが…私の最初の目標だったんだから。
