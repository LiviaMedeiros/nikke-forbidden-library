  event_newflavor_05_s_47:
    speaker: "<Self>"
    en: C-Crust!
    ko: 크, 크러스트!!
    ja: クラスト！！
  event_newflavor_05_s_48:
    speaker: "<Narration>"
    en: "*Dash*!"
    ko: 다다다-!!!
    ja: ダダダダッ――
  event_newflavor_05_s_49:
    speaker: "<Monologue>"
    en: Hearing my call, Crust drops everything and sprints over.
    ko: |-
      내가 부르는 소리에
      요리를 멈추고 전속력으로 달려온 크러스트는.
    ja: |-
      私の呼ぶ声を聞き、料理の手を止めて
      全速力で駆けつけたクラストは…
  event_newflavor_05_s_50:
    speaker: crust
    en: Hey!
    ko: 에잇!!
    ja: えいっ！
  event_newflavor_05_s_51:
    speaker: bready
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_newflavor_05_s_52:
    speaker: "<Self>"
    en: Huh?
    ko: 잉?
    ja: え？
  event_newflavor_05_s_53:
    speaker: "<Monologue>"
    en: Crust pulls out an old, tattered wallet from seemingly out of nowhere,
    ko: |-
      어디서 주웠는지 모르겠지만,
      낡고 더러운 지갑을 꺼내 들어.
    ja: |-
      どこで拾ったのか分からない、
      古く汚れた財布を取り出し…
  event_newflavor_05_s_54:
    speaker: "<Monologue>"
    en: and proceeds to hold it up to Bready's mouth.
    ko: 브래디의 입 앞에 가져다 댔다.
    ja: ブレッディの口に押し付けた
  event_newflavor_05_s_55:
    speaker: "<Self>"
    en: Um... Why are you suddenly giving her a wallet?
    ko: 크러스트, 갑자기 지갑을 왜…?
    ja: クラスト、どういうことだ…？
  event_newflavor_05_s_56:
    speaker: crust
    en: I had no choice.
    ko: 어쩔 수 없어요.
    ja: 最後の手段です。
  event_newflavor_05_s_57:
    speaker: crust
    en: If Bready's condition worsens before we can find quality ingredients,
    ko: |-
      지상의 재료들을 구하는 것보다,
      브래디의 상태가 나빠지는 속도가 더 빠르다면.
    ja: |-
      地上で食材を手に入れるより、
      ブレッディの状態が悪くなる方が早いなら…
  event_newflavor_05_s_58:
    speaker: crust
    en: this is the only option left.
    ko: 이 방법밖에 없거든요.
    ja: これしか方法がありません。
  event_newflavor_05_s_59:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  event_newflavor_05_s_60:
    speaker: bready
    en: "*Lick*"
    ko: "…할짝."
    ja: "…ペロッ。"
  event_newflavor_05_s_61:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_05_s_62:
    speaker: bready
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_newflavor_05_s_63:
    speaker: bready
    en: It's made of synthetic leather.
    ko: 인조가죽으로 만든 지갑이네.
    ja: 人造皮革で作った財布ね。
  event_newflavor_05_s_64:
    speaker: bready
    en: It must have felt lonely.
    ko: 외로웠나 봐.
    ja: 寂しかったみたい。
  event_newflavor_05_s_65:
    speaker: bready
    en: It's waited in the same spot for so long, hoping for its owner to return.
    ko: 오랫동안 같은 자리에서 주인을 기다리고 있었어.
    ja: ずっと同じ場所で持ち主を待っていたようね。
  event_newflavor_05_s_66:
    speaker: bready
    en: It's been tattered and trampled by Raptures, but it's endured all the same,
    ko: 찢어지고, 낡고, 랩쳐들에게 밟혀왔지만.
    ja: |-
      破れて、ボロボロになって、
      ラプチャーにも踏みつけられて…
  event_newflavor_05_s_67:
    speaker: bready
    en: forever remaining in the same spot.
    ko: 계속 그 자리에서 버티고 있었던 거야.
    ja: ずっと動かずに耐えていたのね。
  event_newflavor_05_s_68:
    speaker: bready
    en: "... It's a nice flavor."
    ko: "…좋은 맛이네."
    ja: "…おいしいわ。"
  event_newflavor_05_s_69:
    speaker: crust
    en: Bready, can you hear me?
    ko: 이제 우리 말이 들려, 브래디?
    ja: ブレッディ、聞こえる？
  event_newflavor_05_s_70:
    speaker: bready
    en: Yes, I can hear you.
    ko: 응, 잘 들려.
    ja: うん。よく聞こえてるわ。
  event_newflavor_05_s_71:
    speaker: bready
    en: Thank you for the lovely meal.
    ko: 멋진 음식 고마워, 크러스트.
    ja: いい味だったわ、クラスト。
  event_newflavor_05_s_72:
    speaker: "<Self>"
    en: What in the world is going on?
    ko: 갑자기 이게 무슨…?
    ja: どうなっている…？
  event_newflavor_05_s_73:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_05_s_74:
    speaker: crust
    en: Do you remember
    ko: 미식가님.
    ja: グルメ様。
  event_newflavor_05_s_75:
    speaker: crust
    en: when I told you Bready has incredible abilities?
    ko: |-
      브래디에게는 엄청난 능력이 있다고 했던 말
      기억하시나요?
    ja: |-
      ブレッディにはすごい能力があるって
      言ったこと、覚えてますか？
  event_newflavor_05_s_76:
    speaker: "<Self>"
    en: Yes.
    ko: 응, 기억하지.
    ja: ああ、覚えている
  event_newflavor_05_s_77:
    speaker: "<Self>"
    en: You said she can find out all there is to know about food.
    ko: 음식에 관한 모든 정보를 알 수 있는 능력이잖아.
    ja: 食べ物のあらゆる情報が分かるのだろう？
  event_newflavor_05_s_78:
    speaker: crust
    en: Exactly.
    ko: 정확하세요.
    ja: そうです。
  event_newflavor_05_s_79:
    speaker: bready
    en: And for me,
    ko: 그리고, 나는.
    ja: ただ、私にとっては…
  event_newflavor_05_s_80:
    speaker: bready
    en: anything that can be tasted can be considered food.
    ko: 맛을 볼 수 있는 모든 걸 음식이라고 생각해.
    ja: 味を感じられるなら、みんな食べ物だから。
  event_newflavor_05_s_81:
    speaker: "<Self>"
    en: So, does that mean...
    ko: 그 말은….
    ja: つまり…？
  event_newflavor_05_s_82:
    speaker: bready
    en: If I can touch it with my tongue, I can taste it.
    ko: 혀를 댈 수 있다면, 맛을 볼 수 있다는 것이고.
    ja: |-
      舌で触ることができるものなら、
      味が分かるでしょ。
  event_newflavor_05_s_83:
    speaker: bready
    en: That means I can taste just about anything.
    ko: 그렇기 때문에, 나는 모든 것을 맛볼 수 있어.
    ja: つまり、本当はどんな物でもいいってこと。
  event_newflavor_05_s_84:
    speaker: bready
    en: From water and regular food, to dirt and inanimate objects.
    ko: 물도, 흙도, 사물도.
    ja: 水でも、土でも、物でも。
  event_newflavor_05_s_85:
    speaker: "<Self>"
    en: So all that stuff you said about the wallet just now was from tasting it?
    ko: 그래서 방금 지갑을 맛 보고, 정보를 모두 알게 된 거야?
    ja: |-
      だから財布の味を見て、
      何もかも分かったということか？
  event_newflavor_05_s_86:
    speaker: bready
    en: It's harder for me to deduce everything about objects.
    ko: 사물의 정보를 모두 아는 건 힘들어.
    ja: 何もかもとはいかないわ。
  event_newflavor_05_s_87:
    speaker: bready
    en: I can, however, figure out their structural components, and delve into past
      memories which involve them.
    ko: 구성 요소와 단편적인 기억 정보 정도를 알 수 있지.
    ja: |-
      分かるのは何でできてるかとか、
      何があったかの断片的なイメージぐらいね。
  event_newflavor_05_s_88:
    speaker: bready
    en: The memories come at random,
    ko: 기억은 랜덤.
    ja: |-
      どういうイメージを受け取るかは
      私にも分からないわ。
  event_newflavor_05_s_89:
    speaker: bready
    en: but typically focus on the ones that are most vivid.
    ko: 가장 강렬했던 기억들 위주로 보여주는 것 같긴 해.
    ja: |-
      たぶん一番強く残ってる記憶を見せられてる、
      って気がするけど。
  event_newflavor_05_s_90:
    speaker: "<Self>"
    en: This ability of yours really is unbelievable.
    ko: "…진짜 말도 안 되는 능력을 갖고 있었잖아?"
    ja: "…本当にとんでもない能力だな"
  event_newflavor_05_s_91:
    speaker: bready
    en: This has to remain a secret.
    ko: 이건 비밀이야.
    ja: 秘密にしておいてね。
  event_newflavor_05_s_92:
    speaker: bready
    en: No one else can know.
    ko: 다른 곳에 퍼지면 안 되거든.
    ja: 他の人に知られないようにしてるの。
  event_newflavor_05_s_93:
    speaker: "<Self>"
    en: Why?
    ko: 왜?
    ja: なぜだ？
  event_newflavor_05_s_94:
    speaker: crust
    en: There's too much potential for others to abuse Bready's ability.
    ko: 브래디의 능력은 악용될 소지가 커요.
    ja: 悪用される可能性が高いからです。
  event_newflavor_05_s_95:
    speaker: crust
    en: All she has to do is taste something, anything, and she'll be able to reveal
      everything about it.
    ko: |-
      말 그대로, 맛을 볼 수만 있다면
      뭐든 알 수 있다는 것이니 말이에요.
    ja: |-
      言った通り、舌で触れれば
      何でも分かりますから。
  event_newflavor_05_s_96:
    speaker: "<Self>"
    en: "..."
    ko: 아….
    ja: 確かに…
  event_newflavor_05_s_97:
    speaker: bready
    en: It's an ability that can, and should, be used for good,
    ko: 정의롭게도 사용될 수 있는 능력이지만.
    ja: いいことのためにも使える能力だけど…
  event_newflavor_05_s_98:
    speaker: bready
    en: 'but many have tried to use me, and my abilities, with ill intentions:'
    ko: 사물에 깃든 기억으로 약점을 잡는다던가.
    ja: 持ち物から情報を引き出して弱みを握ろうとか…
  event_newflavor_05_s_99:
    speaker: bready
    en: Uncovering weaknesses or digging up secrets through the memories imprinted
      on objects.
    ko: |-
      비밀을 캐낸다던가, 하는 식으로
      나를 이용하려던 사람들이 많았거든.
    ja: |-
      秘密を暴こうとか、そういうふうに
      私を利用しようとする人が多かったの。
  event_newflavor_05_s_100:
    speaker: bready
    en: Just thinking about it leaves a bad taste in my mouth.
    ko: "…생각만 해도 맛없어."
    ja: "…思い出しただけで口の中が気持ち悪いわ。"
  event_newflavor_05_s_101:
    speaker: crust
    en: You must keep this a secret,
    ko: 그러니, 부탁드려요.
    ja: そういうわけなので、お願いします。
  event_newflavor_05_s_102:
    speaker: crust
    en: I beg of you.
    ko: 브래디의 비밀을 꼭 지켜주세요.
    ja: ブレッディの秘密のこと、守ってください。
  event_newflavor_05_s_103:
    speaker: bready
    en: Please.
    ko: 부탁할게.
    ja: お願いね。
  event_newflavor_05_s_104:
    speaker: "<Self>"
    en: I won't tell a soul.
    ko: 당연하지, 아무에게도 말하지 않아.
    ja: 当然だ。誰にも言わない
  event_newflavor_05_s_105:
    speaker: bready
    en: Thank you.
    ko: "…고마워."
    ja: "…ありがとう。"
  event_newflavor_05_s_106:
    speaker: bready
    en: This ability has made me know far more than I'd ever want to.
    ko: |-
      입맛이 이렇다 보니,
      나는 원치 않게 너무 많은 걸 알고 있어.
    ja: |-
      この能力のせいで、私は知りたくもないことを
      色々知りすぎてるの。
  event_newflavor_05_s_107:
    speaker: bready
    en: But I have to keep tasting things.
    ko: 하지만 맛은 계속해서 느껴야만 하지.
    ja: |-
      だからって、何も口にしないでいることも
      できないのよ。
  event_newflavor_05_s_108:
    speaker: bready
    en: It's situations like this where I can end up in danger of collapsing in on
      myself.
    ko: |-
      그래서, 이런 상황에서
      나 스스로에게 갇혀버리면.
    ja: |-
      さっきみたいに、
      自分の中に閉じこもりだすと…
  event_newflavor_05_s_109:
    speaker: bready
    en: I try to taste myself.
    ko: "[나]를 맛보려고 해."
    ja: "「自分自身」の味が気になりはじめるのよ。"
  event_newflavor_05_s_110:
    speaker: bready
    en: Tasting and chewing over my information, my thoughts, endlessly.
    ko: |-
      나의 정보, 나의 기억, 나의 맛을
      끊임없이 맛보고, 되새김질하고, 다시 맛보고.
    ja: |-
      自分の情報、自分の記憶、自分の味を
      永遠に確かめて、反すうして、また味を見て…
  event_newflavor_05_s_111:
    speaker: bready
    en: So much so that I lose sight of who I am.
    ko: |-
      그 정보에만 매몰되어서,
      내가 누군지 잊어버리게 될 정도로.
    ja: |-
      だんだん自分が誰だったか
      分からなくなって…
  event_newflavor_05_s_112:
    speaker: bready
    en: I keep tasting until I've worn it all down to nothing.
    ko: 닳고 닳을 때까지 맛을 봐.
    ja: それをすり切れるまで続けちゃうの。
  event_newflavor_05_s_113:
    speaker: "<Self>"
    en: Sounds intense.
    ko: 힘들겠다.
    ja: 大変だろうな
  event_newflavor_05_s_114:
    speaker: bready
    en: I'm sorry to
    ko: 어쩌다 보니 지휘관도 말려들게 해버렸네.
    ja: 指揮官も巻き込んじゃったわね。
  event_newflavor_05_s_115:
    speaker: bready
    en: have dragged you into all of this.
    ko: 곤란하게 만들어서 미안해.
    ja: 迷惑かけて、ごめんなさい。
  event_newflavor_05_s_116:
    speaker: "<Self>"
    en: Don't be sorry. I'm honored that you feel you can trust me with this secret.
    ko: |-
      미안해 하지 않아도 돼.
      오히려, 브래디의 비밀을 알게 되어서 영광인걸.
    ja: |-
      謝らなくていい。
      むしろ、知らせてもらって光栄だ
  event_newflavor_05_s_117:
    speaker: bready
    en: "..."
    ko: 정말….
    ja: 本当に…
  event_newflavor_05_s_118:
    speaker: bready
    en: You... you really feel that way?
    ko: "…정말 그렇게 생각해?"
    ja: "…本当に、そう思う？"
  event_newflavor_05_s_119:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_05_s_120:
    speaker: bready
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクリ――
  event_newflavor_05_s_121:
    speaker: crust
    en: Well, at any rate, we don't have many other options.
    ko: 에휴, 어쨌든 이렇게 된 거 어쩔 수 없지.
    ja: はぁ、こうなったら仕方ないね…
  event_newflavor_05_s_122:
    speaker: crust
    en: Our primary goal is to make sure Bready's condition improves. So, to that
      end, let's keep searching for anything we can find that's been left behind.
    ko: |-
      지금은 브래디의 상태가 괜찮아지는 게 중요하니까,
      돌아다니면서 유실물이나 그런 것들도 같이 찾아보자.
    ja: |-
      最初からブレッディのために来てるんだし、
      次からは昔の人の落とし物とかも
      一緒に探さないと。
  event_newflavor_05_s_123:
    speaker: crust
    en: If that doesn't work, we've got plenty of trees and dirt around us.
    ko: 정 안 되면, 나무나 흙 같은 것도 있고.
    ja: それもダメなら、木とか土とか…
  event_newflavor_05_s_124:
    speaker: bready
    en: Yes, the surface is full of things to taste.
    ko: 응, 지상에는 맛볼 수 있는 게 무한하니까.
    ja: |-
      そうね、地上なら味わえるものなんて
      いくらでも見つかりそう。
  event_newflavor_05_s_125:
    speaker: bready
    en: And of course,
    ko: 아.
    ja: あっ…
  event_newflavor_05_s_126:
    speaker: bready
    en: we'll keep looking for anything that could be a potential Splendamin substitute.
    ko: "…물론, 대체 식품도 열심히 찾아보고 말이야."
    ja: |-
      …もちろん、パーフェクトに代わるものも
      頑張って探すわ。
event_newflavor_05_e:
  event_newflavor_05_e_1:
    speaker: crust
    en: Here, try this.
    ko: 자, 여기!
    ja: はい、これ！
  event_newflavor_05_e_2:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_newflavor_05_e_3:
    speaker: bready
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_newflavor_05_e_4:
    speaker: bready
    en: There's no flavor.
    ko: 맛이 없어.
    ja: 味が良くないわ。
  event_newflavor_05_e_5:
    speaker: bready
    en: I can't see this being turned into a decent dish.
    ko: 그럴싸한 요리가 될 거라는 생각은 안 드네.
    ja: まともな料理にできるとは思えないわね。
  event_newflavor_05_e_6:
    speaker: crust
    en: Then, what about this?
    ko: 그럼, 이거는?!
    ja: じゃあ、こっちは！？
  event_newflavor_05_e_7:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_newflavor_05_e_8:
    speaker: bready
    en: Hmm.
    ko: 음.
    ja: うーん。
  event_newflavor_05_e_9:
    speaker: bready
    en: It's an interesting flavor, but it's not edible.
    ko: 흥미로운 맛이긴 한데, 이건 식용이 아니야.
    ja: 面白い味だけど、これは食用じゃないわ。
  event_newflavor_05_e_10:
    speaker: crust
    en: Darn...
    ko: 히이! 그렇구나….
    ja: ひえぇ！そっか…
  event_newflavor_05_e_11:
    speaker: "<Self>"
    en: Oooh, what about this?
    ko: 오! 이건 어때?
    ja: お！これはどうだ？
  event_newflavor_05_e_12:
    speaker: "<Self>"
    en: A mushroom!
    ko: 버섯!
    ja: キノコがあった
  event_newflavor_05_e_13:
    speaker: crust
    en: No kidding!
    ko: 버섯!
    ja: キノコですか！
  event_newflavor_05_e_14:
    speaker: crust
    en: Oooh, and it's an enoki mushroom!
    ko: 오~! 이건 팽이버섯이네요!
    ja: ああ～！これはエノキダケですね！
  event_newflavor_05_e_15:
    speaker: bready
    en: It has a nice, subtle aroma and pleasing texture,
    ko: 은은한 향도 좋고, 식감도 좋지.
    ja: 香りも、食感もいいわ。
  event_newflavor_05_e_16:
    speaker: bready
    en: but I'm afraid mushrooms won't work.
    ko: 하지만 버섯은 안 돼.
    ja: でも、キノコはダメね。
  event_newflavor_05_e_17:
    speaker: "<Self>"
    en: Why not?
    ko: 왜?
    ja: なぜだ？
  event_newflavor_05_e_18:
    speaker: bready
    en: It's true that they don't require sunlight and can grow using organic matter.
    ko: 햇빛도 필요 없고, 유기물을 활용해 자랄 수 있는.
    ja: |-
      確かに光は要らないし、
      有機物を活用すれば育てられるわ。
  event_newflavor_05_e_19:
    speaker: bready
    en: They're quite rich in nutrients as well.
    ko: 아주 유용한 식품이야.
    ja: とても便利な食材よ。
  event_newflavor_05_e_20:
    speaker: bready
    en: A supremely useful food.
    ko: 영양소도 풍부하고.
    ja: 栄養素も豊富だし。
  event_newflavor_05_e_21:
    speaker: bready
    en: However,
    ko: 하지만….
    ja: でも…
  event_newflavor_05_e_22:
    speaker: bready
    en: mushrooms are still mushrooms, so they won't work.
    ko: 버섯은 버섯이라 안 돼.
    ja: キノコはキノコだから。
  event_newflavor_05_e_23:
    speaker: "<Self>"
    en: What does that even mean?
    ko: 그게 대체 무슨 소리야?
    ja: どういう意味だ？
  event_newflavor_05_e_24:
    speaker: crust
    en: Splendamin can replicate meat, fruits, and everything in between, including
      mushrooms.
    ko: 퍼펙트로는 고기도, 과일도, 버섯도 만들 수 있어요.
    ja: |-
      パーフェクトはお肉にも、フルーツにも、
      キノコにもなります。
  event_newflavor_05_e_25:
    speaker: crust
    en: 'Whereas mushrooms can only be that: mushrooms.'
    ko: 하지만 버섯은 버섯밖에 되지 않는다는 말이죠.
    ja: でも、キノコはキノコにしかならないです。
  event_newflavor_05_e_26:
    speaker: "<Self>"
    en: Still, considering how dire the situation is, wouldn't mushrooms be a decent
      alternative to Splendamin?
    ko: |-
      그래도 이번 같은 일이 생겼을 때,
      퍼펙트의 대체제로는 괜찮은 거 아냐?
    ja: |-
      だが、今回みたいな問題が起きた時、
      パーフェクトの代わりにできるんじゃないか？
  event_newflavor_05_e_27:
    speaker: crust
    en: Hmm...
    ko: 으으음….
    ja: う～～ん…
  event_newflavor_05_e_28:
    speaker: bready
    en: They'd be fine.
    ko: 물론 괜찮지.
    ja: できなくはないわ。
  event_newflavor_05_e_29:
    speaker: bready
    en: They'd be easy to cultivate inside the Ark, could be mass-produced,
    ko: 방주에서 키우기에도 쉽고, 대량 생산하기도 쉽고.
    ja: |-
      アークでも育てられるし、
      大量生産にも向いてる。
  event_newflavor_05_e_30:
    speaker: bready
    en: are tasty, and packed full of nutrients.
    ko: 맛도 있고, 영양분도 있고.
    ja: 味もいいし、栄養分もある。
  event_newflavor_05_e_31:
    speaker: bready
    en: That's precisely why they can't work.
    ko: 그래서 안 돼.
    ja: だからこそ、ダメ。
  event_newflavor_05_e_32:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_newflavor_05_e_33:
    speaker: crust
    en: Trust me, we've tried it before, and failed.
    ko: 헤헤, 저희도 시도를 해봤는데 말이죠~
    ja: えへへ、私たちも試したことはあるんですけど…
  event_newflavor_05_e_34:
    speaker: crust
    en: There are too many practical hurdles to making it work.
    ko: 현실적으로 불가능한 부분들이 좀 많더라구요.
    ja: 現実的にダメなことが多かったんです。
  event_newflavor_05_e_35:
    speaker: crust
    en: We'd be better off trying to find something else.
    ko: |-
      버섯은 저희도 실패한 식품이라~
      다른 걸 찾는 게 좋을 것 같아요!
    ja: |-
      キノコは私たちも失敗してるので…
      他のものを探した方がいいと思います！
  event_newflavor_05_e_36:
    speaker: crust
    en: They would make for a great meal later, though, so we should still take them
      with us.
    ko: |-
      아~! 그래도, 이따 요리해서 먹으면 좋을 것 같으니까
      가져가야겠어요!
    ja: |-
      あ～！でも、あとで料理して食べるのには
      ぴったりなので、採っておきましょう！
  event_newflavor_05_e_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_05_e_38:
    speaker: "<Monologue>"
    en: Right before we came to the surface, I started feeling something wasn't quite
      right.
    ko: 지상에 올라오기 직전부터 느낀 이질감.
    ja: 地上に来る前から違和感を感じていた
  event_newflavor_05_e_39:
    speaker: "<Monologue>"
    en: I think I'm starting to understand why.
    ko: "…이제야 조금 알 것 같다."
    ja: "…その正体がつかめた気がする"
  event_newflavor_05_e_40:
    speaker: "<Self>"
    en: I know why you're saying mushrooms aren't a viable option.
    ko: 버섯이 안 되는 이유.
    ja: キノコが使えない理由は…
  event_newflavor_05_e_41:
    speaker: "<Self>"
    en: It's because they could cause people to stop relying on Splendamin.
    ko: 퍼펙트를 찾지 않는 사람들이 생겨버릴 테니까 그런 거지?
    ja: |-
      パーフェクトに戻らなくなる人が
      出てしまうからか？
  event_newflavor_05_e_42:
    speaker: crust
    en: "!!"
    ko: 흐이익…!!
    ja: ひゃあっ…！！
  event_newflavor_05_e_43:
    speaker: bready
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_newflavor_05_e_44:
    speaker: "<Self>"
    en: Splendamin is the Ark's only food source.
    ko: 퍼펙트는 방주의 유일무이한 음식이니까.
    ja: |-
      パーフェクトはアークにおいて
      唯一無二の食べ物でなければならない
  event_newflavor_05_e_45:
    speaker: crust
    en: "..."
    ko: 으으우….
    ja: ううう…
  event_newflavor_05_e_46:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_05_e_47:
    speaker: crust
    en: Bready has incredible abilities when it comes to tasting.
    ko: 브래디는 맛을 느끼는 것에 엄청난 능력들을 가지고 있다구요~
    ja: ブレッディは特別な味覚を持ってるんです～
  event_newflavor_05_e_48:
    speaker: "<Self>"
    en: Like what, exactly?
    ko: 정확히 어떤 능력들이 있는데?
    ja: 具体的にはどういうことができるんだ？
  event_newflavor_05_e_49:
    speaker: bready
    en: Well...
    ko: 음….
    ja: ええと…
  event_newflavor_05_e_50:
    speaker: bready
    en: nothing too grand.
    ko: 엄청난 건 아니지만.
    ja: すごいかどうかは知らないけど。
  event_newflavor_05_e_51:
    speaker: bready
    en: It's just that when I eat something, I can immediately identify everything
      about it.
    ko: 음식을 먹으면 그 음식에 관한 모든 정보를 알 수 있어.
    ja: |-
      料理を食べれば、その料理のことが
      何でもわかるの。
  event_newflavor_05_e_52:
    speaker: bready
    en: What ingredients were used, what flavors it has.
    ko: 어떤 재료가 들어갔는지, 어떤 맛들을 내고 있는지.
    ja: |-
      どんな食材を使っているかとか、
      どういう味付けをされているか、とか。
  event_newflavor_05_e_53:
    speaker: bready
    en: The nutritional information and precisely how it was made. Things like that.
    ko: 추가로 영양 성분이나, 만드는 과정… 뭐, 그런 것까지도.
    ja: 他には栄養成分とか、調理法とか…そんなとこ。
  event_newflavor_05_e_54:
    speaker: "<Self>"
    en: That's incredible.
    ko: 뭐야, 완전 엄청난데?
    ja: すごい能力じゃないか
  event_newflavor_05_e_55:
    speaker: bready
    en: You think so?
    ko: 그래…?
    ja: そうかしら…？
  event_newflavor_05_e_56:
    speaker: crust
    en: Bready will eat rare dishes from the surface to analyze them, and I use that
      data to recreate the flavors in my cooking.
    ko: |-
      그래서 브래디는 지상의 희귀한 음식을 먹어서 분석하고,
      제가 그 데이터로 맛을 내고 요리를 한답니다!
    ja: |-
      それで、ブレッディは地上の珍しい物を
      食べて分析して、私がそのデータをもとに
      料理を作っているんです！
  event_newflavor_05_e_57:
    speaker: crust
    en: That's one of our main undertakings at Cooking Oil.
    ko: 이게 바로, 쿠킹오일 스쿼드가 하는 일들이에요!
    ja: それがクッキングオイル部隊の仕事です！
  event_newflavor_05_e_58:
    speaker: bready
    en: But most importantly,
    ko: 하지만, 제일 중요한 건.
    ja: でも、一番大事なことは…
  event_newflavor_05_e_59:
    speaker: bready
    en: it has to be cheap to cultivate on a mass scale.
    ko: 싸게 대량 생산이 가능해야 한다는 거지.
    ja: 安く、大量生産できるかどうか。
  event_newflavor_05_e_60:
    speaker: bready
    en: At a lower cost than it does to manufacture Splendamin.
    ko: 지금의 퍼펙트를 만드는 것보다도 더.
    ja: それこそパーフェクトよりも、さらにね。
  event_newflavor_05_e_61:
    speaker: crust
    en: Those are some stringent requirements.
    ko: 으음… 그렇지.
    ja: うーん…そこだよね…
  event_newflavor_05_e_62:
    speaker: crust
    en: That's why I don't think we'll be finding a replacement anytime soon.
    ko: |-
      그래서, 퍼펙트를 완전히 대체할 만한 건
      없을 거라고 생각해요.
    ja: |-
      やっぱり、パーフェクトの代わりに
      なるものなんて、ないと思います。
  event_newflavor_05_e_63:
    speaker: "<Self>"
    en: First there's Bready's ability.
    ko: 브래디의 능력.
    ja: ブレッディの能力…
  event_newflavor_05_e_64:
    speaker: "<Self>"
    en: Then there are the things you've both said that indicate you know about Splendamin's
      production costs.
    ko: 그리고, 퍼펙트 생산 비용을 알고 있다는 듯한 말들.
    ja: |-
      それから、パーフェクトの生産コストを
      知っているような言い方…
  event_newflavor_05_e_65:
    speaker: "<Self>"
    en: You two must know all the secrets about Splendamin.
    ko: "…둘은 퍼펙트의 비밀을 알고 있구나."
    ja: "…パーフェクトの秘密を知っているんだな"
  event_newflavor_05_e_66:
    speaker: crust
    en: Uh...
    ko: 읏….
    ja: ううっ…
  event_newflavor_05_e_67:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_05_e_68:
    speaker: bready
    en: You're right.
    ko: 맞아.
    ja: そうよ。
  event_newflavor_05_e_69:
    speaker: bready
    en: That's why both Crust and I have safeguards installed in our brains.
    ko: 그래서 나와 크러스트의 뇌에는, 프로텍터가 달려있어.
    ja: |-
      私とクラストの脳に、
      特別な保護装置がつけられるぐらいにはね。
  event_newflavor_05_e_70:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
event_newflavor_06_s:
  event_newflavor_06_s_1:
    speaker: "<Self>"
    en: Did you say "safeguards"?
    ko: 뇌에 프로텍터가 달려있다고?
    ja: 脳に保護装置？
  event_newflavor_06_s_2:
    speaker: bready
    en: Yes. Do you know what that is?
    ko: 응, 뭔지 알아?
    ja: うん。どういうものか知ってる？
  event_newflavor_06_s_3:
    speaker: "<Choice>"
    en: I've heard of them.
    ko: 알고 있어.
    ja: 知っている
  event_newflavor_06_s_4:
    speaker: "<Choice>"
    en: Not really.
    ko: 아니, 잘 몰라.
    ja: いや、知らない
  event_newflavor_06_s_5:
    speaker: "<Monologue>"
    en: I've heard something similar regarding the Protocol Squad.
    ko: "…프로토콜 스쿼드의 뇌에도 프로텍터가 있다고 했었지."
    ja: |-
      …プロトコールのメンバーが
      脳にプロテクターがあると言っていた
  event_newflavor_06_s_6:
    speaker: "<Monologue>"
    en: It's probably the same thing.
    ko: 아마 그것과 같을 것이다.
    ja: おそらくそれと同じものだろう
  event_newflavor_06_s_7:
    speaker: bready
    en: I see.
    ko: 그렇구나.
    ja: そっか。
  event_newflavor_06_s_8:
    speaker: bready
    en: Then there's no need for a lengthy explanation.
    ko: 그럼 길게 설명할 필요는 없겠네.
    ja: じゃあ、詳しい説明はいらなさそうね。
  event_newflavor_06_s_9:
    speaker: bready
    en: Hm.
    ko: 잘 모르는구나.
    ja: 知らないのね。
  event_newflavor_06_s_10:
    speaker: bready
    en: Think of it as a safeguard to prevent corruption or brain scans.
    ko: |-
      침식이나 뇌 스캔을 방지하기 위해 있는,
      일종의 보호 장치라고 생각하면 돼.
    ja: 侵食や脳のスキャンを防ぐための仕組みよ。
  event_newflavor_06_s_11:
    speaker: bready
    en: Practically everything about Splendamin is veiled in secrecy.
    ko: 퍼펙트에 관한 건 극비 중의 극비.
    ja: |-
      パーフェクトに関わる情報は、
      極秘中の極秘だから。
  event_newflavor_06_s_12:
    speaker: bready
    en: Nothing about it can get out.
    ko: 다른 곳에 퍼지면 안 되거든.
    ja: 誰にも知られないようになってるの。
  event_newflavor_06_s_13:
    speaker: "<Self>"
    en: That's why both of you have been insisting that an alternative to Splendamin
      is impossible.
    ko: |-
      그래서 두 사람 모두,
      당연하다는 듯 대체 식품은 안 된다고 한 거구나.
    ja: |-
      だから代わりが見つかるわけがないと
      最初から当然のように言っていたんだな
  event_newflavor_06_s_14:
    speaker: crust
    en: "... Yes, but we're also telling the truth."
    ko: 맞아요….
    ja: そうです…
  event_newflavor_06_s_15:
    speaker: crust
    en: We've done plenty of our own investigating and research,
    ko: 퍼펙트 자체를 대체할 만한 식품은 없어요.
    ja: |-
      パーフェクトの代わりになるものなんて
      ありません。
  event_newflavor_06_s_16:
    speaker: crust
    en: and there's nothing that can fully replace Splendamin,
    ko: 계속 알아보고, 연구해 봤지만 말이에요.
    ja: 何度も調べて、研究してみたんですけど…
  event_newflavor_06_s_17:
    speaker: bready
    en: nor should there be.
    ko: 그리고, 조금이라도 대체할 만한 식품도 있어선 안 돼.
    ja: |-
      そもそも、少しでも代わりになる食べ物さえ、
      存在が望まれていないわ。
  event_newflavor_06_s_18:
    speaker: bready
    en: Eating is an integral part of human life.
    ko: 먹는다는 건, 인간에게 정말 중요한 일이야.
    ja: 食事は人間にとって、とても大事なことでしょ。
  event_newflavor_06_s_19:
    speaker: bready
    en: Nobody knows how Splendamin is made, or what ingredients are used.
    ko: |-
      퍼펙트는 어떻게 만들어지는지,
      어떤 재료로 만들어지는지 알려지지 않았어.
    ja: |-
      でもパーフェクトは作り方もそうだし、
      原料だって誰も知らない。
  event_newflavor_06_s_20:
    speaker: bready
    en: If people were able to eat food from the surface instead,
    ko: 그런데, 지상의 음식을 먹을 수 있다면.
    ja: |-
      なのに地上の物を
      食べられるようになったら…
  event_newflavor_06_s_21:
    speaker: bready
    en: especially if was cheap and available in large quantities,
    ko: 게다가 대량으로 싼값에 먹을 수 있다면.
    ja: |-
      しかも、それが大量に手に入って、
      安いって言うなら…
  event_newflavor_06_s_22:
    speaker: bready
    en: there would be all sorts of divisions in the Ark.
    ko: 방주는 여러 갈래로 나뉘게 되겠지.
    ja: アークの意見はバラバラになるでしょうね。
  event_newflavor_06_s_23:
    speaker: bready
    en: At least, that's what those at the top fear would happen.
    ko: "…위는, 그게 무서운 거야."
    ja: "…えらい人たちは、それが怖いのよ。"
  event_newflavor_06_s_24:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_06_s_25:
    speaker: "<Self>"
    en: I won't ask you to tell me about Splendamin. You wouldn't tell me anyway.
    ko: |-
      퍼펙트에 관해 알려달라고는 하지 않을게,
      어차피 말해 주지도 못할 테니까.
    ja: |-
      パーフェクトそのものの話は聞かないでおく、
      どうせ言えないことだろう
  event_newflavor_06_s_26:
    speaker: "<Self>"
    en: But I need to at least understand what's happening with these so-called "compromised
      ingredients" right now.
    ko: "…하지만, 적어도 이번 사태에 대해서는 알아야겠어."
    ja: |-
      …だが、少なくとも今回の事件に関わることは
      知っておく必要がある
  event_newflavor_06_s_27:
    speaker: bready
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_newflavor_06_s_28:
    speaker: "<Self>"
    en: You both know, don't you?
