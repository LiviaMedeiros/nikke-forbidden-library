    ja: |-
      食材の問題が解決したら、
      ぜひまたお訪ねください。
  event_newflavor_03_e_60:
    speaker: ade
    en: Take care, all of you.
    ko: |-
      그럼, 다녀오세요.
      주인님, 아가씨들.
    ja: |-
      では、ご主人様、お嬢様がた。
      いってらっしゃいませ。
  event_newflavor_03_e_61:
    speaker: "<Narration>"
    en: "*Ring*"
    ko: 딸랑-
    ja: チリン――
  event_newflavor_03_e_62:
    speaker: crust
    en: Well, we've made the rounds.
    ko: 하아~ 다 돌았네요.
    ja: ふぅ～…ぐるっと確認が終わりましたね。
  event_newflavor_03_e_63:
    speaker: crust
    en: At least the food at the Outpost is safe now.
    ko: 전초기지의 음식은 이걸로 안심이에요!
    ja: 前哨基地の食べ物はこれで安心です！
  event_newflavor_03_e_64:
    speaker: crust
    en: Great work, everyone.
    ko: 모두들 고생 많으셨어요~
    ja: みなさん、お疲れ様でした～
  event_newflavor_03_e_65:
    speaker: bready
    en: Yeah, nicely done, you guys.
    ko: 고생 많았어.
    ja: お疲れ様。
  event_newflavor_03_e_66:
    speaker: "<Self>"
    en: I really could use some proper food...
    ko: 맛있는 거 먹고 싶다….
    ja: おいしいものが食べたい…
  event_newflavor_03_e_67:
    speaker: crust
    en: Hang in there. Things will get better soon.
    ko: |-
      헤헤… 당분간만 참아주세요.
      금방 괜찮아질 거예요.
    ja: |-
      えへへ…ちょっとのガマンですよ。
      きっとすぐ解決するはずです。
  event_newflavor_03_e_68:
    speaker: "<Self>"
    en: All right.
    ko: 응, 알겠어.
    ja: ああ、そうだな
  event_newflavor_03_e_69:
    speaker: crust
    en: Oh, by the way.
    ko: 아~ 그리고!
    ja: あっ、それから！
  event_newflavor_03_e_70:
    speaker: crust
    en: When the flavors go back to normal, we'll make sure to invite you into our
      kitchen.
    ko: |-
      맛이 원래대로 돌아오게 되면,
      꼭 저희 주방에 초대드릴게요.
    ja: |-
      事件が解決して食べ物が元通りになったら、
      私たちのキッチンにご招待しますね。
  event_newflavor_03_e_71:
    speaker: crust
    en: If it hadn't been for this little snafu, we would've prepared a full-course
      meal instead of just a lunchbox.
    ko: |-
      이번 일만 아니었으면,
      도시락이 아니라 코스 요리를 준비해 드렸을 텐데….
    ja: |-
      こんな時じゃなかったら、
      お弁当じゃなくてコース料理を用意できたのに…
  event_newflavor_03_e_72:
    speaker: crust
    en: We feel bad we couldn't treat you to a proper feast like we wanted.
    ko: 여러모로 너무 아쉬웠거든요.
    ja: とっても残念です～
  event_newflavor_03_e_73:
    speaker: crust
    en: Isn't that right, Bready?
    ko: 그렇지, 브래디?
    ja: ねえ、ブレッディ？
  event_newflavor_03_e_74:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_03_e_75:
    speaker: crust
    en: "??"
    ko: "??"
    ja: "？？"
  event_newflavor_03_e_76:
    speaker: crust
    en: Bready?
    ko: 브래디~?
    ja: ブレッディ～？
  event_newflavor_03_e_77:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_03_e_78:
    speaker: "<Self>"
    en: Bready?
    ko: 브래디?
    ja: ブレッディ？
  event_newflavor_03_e_79:
    speaker: "<Monologue>"
    en: Bready stares blankly at her hand.
    ko: 브래디는 멍하니 자신의 손을 바라보고 있다.
    ja: |-
      ブレッディは、ぼんやりと
      自分の手を見つめている
  event_newflavor_03_e_80:
    speaker: crust
    en: Bready!
    ko: 브래디!
    ja: ブレッディ！
  event_newflavor_03_e_81:
    speaker: bready
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_newflavor_03_e_82:
    speaker: bready
    en: Are you talking to me?
    ko: 으응, 나 불렀어?
    ja: ん、呼んだ？
  event_newflavor_03_e_83:
    speaker: crust
    en: Bready, are you okay?
    ko: 브래디, 괜찮아?
    ja: ブレッディ、大丈夫？
  event_newflavor_03_e_84:
    speaker: crust
    en: You feel sick or something?
    ko: 컨디션이 안 좋은 거야?
    ja: 体調が悪いの？
  event_newflavor_03_e_85:
    speaker: bready
    en: I...
    ko: 아….
    ja: いや…
  event_newflavor_03_e_86:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_03_e_87:
    speaker: bready
    en: Crust, Commander.
    ko: |-
      크러스트, 지휘관.
      잠시만.
    ja: |-
      クラスト、指揮官。
      ごめん。
  event_newflavor_03_e_88:
    speaker: bready
    en: I have something important to say.
    ko: 중요하게 할 얘기가 있어.
    ja: 大事な話があるの。
  event_newflavor_03_e_89:
    speaker: crust
    en: Huh? What is it?
    ko: 응? 뭐, 뭔데?
    ja: え？ど、どうしたの？
  event_newflavor_03_e_90:
    speaker: bready
    en: I really can't taste anything.
    ko: 나, 정말로 맛이 느껴지지 않아.
    ja: 味が…分からなかったの。
  event_newflavor_03_e_91:
    speaker: crust
    en: What?!
    ko: 으엥?
    ja: ええっ？
  event_newflavor_03_e_92:
    speaker: bready
    en: Whenever I eat food that's been made using the compromised Splendamin, I can't
      taste a single thing.
    ko: |-
      문제가 있는 퍼펙트로 만들어진 음식들을 먹으면,
      아무런 맛도 느껴지지 않아.
    ja: |-
      問題のあるパーフェクトの味が、
      まったく分からないの。
  event_newflavor_03_e_93:
    speaker: crust
    en: Maybe Emma's cooking made your taste buds blow a fuse.
    ko: 그, 그건 아까 엠마의 음식을 먹고….
    ja: ええと、それって最初に飲んだものが…
  event_newflavor_03_e_94:
    speaker: bready
    en: No, that's not it.
    ko: 아냐, 엠마의 음식 때문이 아니야.
    ja: ううん。エマの料理のせいじゃない。
  event_newflavor_03_e_95:
    speaker: bready
    en: It's not just taste. No information or emotions are coming through either.
    ko: 맛뿐만이 아니라, 정보나 감정도 느껴지지 않아.
    ja: |-
      味だけじゃなくて、
      情報も、気持ちも、何にも。
  event_newflavor_03_e_96:
    speaker: crust
    en: "...!"
    ko: "……!!"
    ja: "……！！"
  event_newflavor_03_e_97:
    speaker: bready
    en: I didn't say anything, but I've felt like this ever since we went to that
      restaurant yesterday.
    ko: 말은 안 했지만, 어제 갔었던 식당에서부터 이랬어.
    ja: |-
      言いだせなかったけど、
      昨日調べたレストランでもそうだったの。
  event_newflavor_03_e_98:
    speaker: bready
    en: None of the food you or Ade prepared had any flavor whatsoever to me.
    ko: |-
      크러스트의 음식도, 에이드의 음식도
      아무런 맛이 느껴지지 않아.
    ja: |-
      クラストの料理も、エードの料理も
      何も感じられなかった。
  event_newflavor_03_e_99:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_03_e_100:
    speaker: bready
    en: I thought you would have noticed.
    ko: 크러스트도 눈치챘을 거라 생각해.
    ja: クラストは分かってたでしょ。
  event_newflavor_03_e_101:
    speaker: bready
    en: All of the feedback I gave was vague and oblique, and I didn't provide any
      concrete details regarding their ingredients or other information.
    ko: |-
      음식의 평도 돌려서 했고,
      재료나 정보도 정확하게 말하지 않았잖아.
    ja: |-
      料理の評価も遠回しな言い方しかしてないし、
      具体的な食材や情報は出さなかったから。
  event_newflavor_03_e_102:
    speaker: crust
    en: I assumed you were just being vague because it didn't taste good.
    ko: 나는 일부러 적당히 말하는 줄 알았어… 맛이 없으니까.
    ja: |-
      私はてっきりおいしくないって、
      ハッキリ言わないようにしてただけだと…
  event_newflavor_03_e_103:
    speaker: crust
    en: I had no idea...
    ko: 결국, 이건…!
    ja: じゃあ、これって…！
  event_newflavor_03_e_104:
    speaker: crust
    en: This is a really big deal!
    ko: 진짜 큰일이라는 얘기잖아아-?!
    ja: 本当に大事件ってこと！？
event_newflavor_intermission_01:
  event_newflavor_intermission_01_1:
    speaker: crust
    en: Tell us more,
    ko: 브, 브래디.
    ja: ブ、ブレッディ…
  event_newflavor_intermission_01_2:
    speaker: crust
    en: Bready.
    ko: 맛이 안 느껴진다는 거, 조금만 더 자세히 얘기해 줘.
    ja: |-
      味が感じられないっていうの、
      もう少し詳しく教えて。
  event_newflavor_intermission_01_3:
    speaker: bready
    en: My loss of taste only seems to happen with food made from compromised ingredients.
    ko: 문제가 있는 재료들로 만든 음식에만 이러는 것 같아.
    ja: |-
      問題のある食材が入った料理だけ
      分からないみたい。
  event_newflavor_intermission_01_4:
    speaker: bready
    en: Emma and Ade themselves had a flavor to them which I was able to pick up no
      problem,
    ko: 엠마와 에이드의 맛은 정상적으로 났거든.
    ja: エマとエードの味は、ちゃんと分かったし。
  event_newflavor_intermission_01_5:
    speaker: bready
    en: and the food made using older ingredients was fine as well.
    ko: 예전 재료로 만든 음식들도 괜찮았고.
    ja: 古い食材で作った料理も大丈夫だったわ。
  event_newflavor_intermission_01_6:
    speaker: crust
    en: Okay,
    ko: 그, 그렇구나….
    ja: そ、そっか…
  event_newflavor_intermission_01_7:
    speaker: crust
    en: that's good.
    ko: 흐아아, 다행이다.
    ja: ふわあ、よかったぁ。
  event_newflavor_intermission_01_8:
    speaker: crust
    en: So the issue isn't necessarily with you.
    ko: 브래디의 문제는 아니라서….
    ja: ブレッディがどうかしちゃったんじゃなくて…
  event_newflavor_intermission_01_9:
    speaker: "<Self>"
    en: Once this Splendamin issue is resolved, will everything go back to normal?
    ko: 그럼 퍼펙트 문제만 해결되면 다 괜찮아지는 것 아니야?
    ja: |-
      パーフェクトの問題が解決すれば、
      それも解決ということでは？
  event_newflavor_intermission_01_10:
    speaker: bready
    en: Yes,
    ko: 그렇지.
    ja: そうね。
  event_newflavor_intermission_01_11:
    speaker: bready
    en: but we don't know when that will happen.
    ko: 하지만, 언제 괜찮아질지 모르니까.
    ja: でも、いつそうなるか分からないから。
  event_newflavor_intermission_01_12:
    speaker: "<Self>"
    en: Haven't you been saying that it'll be resolved soon?
    ko: 금방 괜찮아진다고 하지 않았어?
    ja: すぐに解決すると言っていなかったか？
  event_newflavor_intermission_01_13:
    speaker: bready
    en: "... Sorry, that was a lie."
    ko: "…미안해, 그건 거짓말이었어."
    ja: "…悪いけど、あれは本当のことじゃないわ。"
  event_newflavor_intermission_01_14:
    speaker: bready
    en: I'm just parroting what the higher-ups told us to say.
    ko: 위에서 우리에게 한 얘기를 그대로 전했을 뿐이야.
    ja: 上層部から言われた話をそのまま伝えただけ。
  event_newflavor_intermission_01_15:
    speaker: bready
    en: Nobody has any idea when things will improve.
    ko: 정확히 언제 괜찮아질지는 아무도 몰라.
    ja: |-
      いつ解決できるかなんて、
      正確には誰にも分かってないの。
  event_newflavor_intermission_01_16:
    speaker: "<Self>"
    en: "!!"
    ko: 아악… 그렇구나.
    ja: なるほど…そういうことか
  event_newflavor_intermission_01_17:
    speaker: "<Self>"
    en: So we just have to stand around and wait?
    ko: 그럼 무작정 기다려야 하는 건가….
    ja: 結局、ただ待つしかないのか…
  event_newflavor_intermission_01_18:
    speaker: bready
    en: That's what they want, yes,
    ko: 그렇지.
    ja: そうね。
  event_newflavor_intermission_01_19:
    speaker: bready
    en: but that would take too long.
    ko: 하지만, 그러면 너무 늦을 거야.
    ja: でも、それだと遅すぎるわ。
  event_newflavor_intermission_01_20:
    speaker: "<Self>"
    en: What do you mean?
    ko: 늦어? 뭐가?
    ja: 遅すぎる？何にだ？
  event_newflavor_intermission_01_21:
    speaker: bready
    en: I can't go that long without a sense of taste.
    ko: 나는 계속해서 맛을 느끼지 않으면 안 되거든.
    ja: 私は味を感じ続けていないとおかしくなるの。
  event_newflavor_intermission_01_22:
    speaker: bready
    en: This might sound strange to you,
    ko: "…이상하게 들릴지도 모르겠지만."
    ja: ヘンな話に聞こえるかもしれないけど…
  event_newflavor_intermission_01_23:
    speaker: bready
    en: but if I can't taste, and thus receive information, I'll end up collapsing
      in on myself.
    ko: |-
      나는 맛과 정보를 받지 못하면,
      스스로에게 갇혀버려.
    ja: |-
      私は味覚を刺激されていないと、
      自分の中に閉じこもるようになってしまうの。
  event_newflavor_intermission_01_24:
    speaker: bready
    en: If I don't taste things continuously,
    ko: 능력에 대한 반작용 같은 거랄까.
    ja: 能力の副作用って感じかしら。
  event_newflavor_intermission_01_25:
    speaker: bready
    en: my ability essentially backfires on me.
    ko: 그래서 끊임없이 무언가를 맛봐야 해.
    ja: だから、何かを味見し続けていないとダメなの。
  event_newflavor_intermission_01_26:
    speaker: "<Self>"
    en: I'm not sure I fully understand.
    ko: 갇혀버린다고?
    ja: 閉じこもる？
  event_newflavor_intermission_01_27:
    speaker: bready
    en: It's hard to explain...
    ko: 응.
    ja: うん。
  event_newflavor_intermission_01_28:
    speaker: bready
    en: I'm feeling a bit out of it,
    ko: 뭐라고 설명하긴 어려운데.
    ja: 説明するのが難しいんだけど…
  event_newflavor_intermission_01_29:
    speaker: bready
    en: to be honest.
    ko: 멍- 하고 무기력해져.
    ja: ぼーっとして、無気力になるみたいな。
  event_newflavor_intermission_01_30:
    speaker: "<Self>"
    en: Hmm...
    ko: 아하….
    ja: なるほど…
  event_newflavor_intermission_01_31:
    speaker: "<Self>"
    en: It sounds like eating isn't a very enjoyable activity for you.
    ko: 그럼, 브래디는 생각보다 먹는 게 즐겁지 않겠구나.
    ja: |-
      それでは、食事を心から楽しむことが
      できないだろうな
  event_newflavor_intermission_01_32:
    speaker: bready
    en: "...!"
    ko: "……!"
    ja: "……！"
  event_newflavor_intermission_01_33:
    speaker: bready
    en: I didn't expect you to say something like that.
    ko: 그런 얘기를 해줄 거라고는 생각 못 했는데.
    ja: 見透かされるとは思ってなかったわ。
  event_newflavor_intermission_01_34:
    speaker: bready
    en: "... But you're right."
    ko: "…맞아."
    ja: "…その通りよ。"
  event_newflavor_intermission_01_35:
    speaker: bready
    en: Forcibly having to eat things and receive their information, like some kind
      of robot...
    ko: 기계처럼 무언가를 먹고, 그것의 정보를 강제적으로 알게 되는 건.
    ja: |-
      何かを食べた時、分析機にかけたみたいに
      情報が強制的に流れ込んでくるって…
  event_newflavor_intermission_01_36:
    speaker: bready
    en: It's not exactly pleasant.
    ko: 썩 유쾌한 일은 아니니까.
    ja: あまり楽しいことじゃないわ。
  event_newflavor_intermission_01_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_38:
    speaker: crust
    en: So what should we do?
    ko: 그러면 어쩌지….
    ja: じゃあ、どうしよう…
  event_newflavor_intermission_01_39:
    speaker: crust
    en: We could head back to the kitchen and check if there are any older ingredients
      left.
    ko: 일단 주방으로 돌아가서, 예전 재료가 남아있는지 볼까?
    ja: |-
      とりあえずキッチンに戻って、
      問題ない材料が残ってるか確認してみる？
  event_newflavor_intermission_01_40:
    speaker: bready
    en: We used them all for the lunchbox we gave to the Commander.
    ko: 지휘관에게 준 도시락에 다 썼잖아.
    ja: 指揮官に出したお弁当に使っちゃったでしょ。
  event_newflavor_intermission_01_41:
    speaker: crust
    en: Oh...
    ko: 아….
    ja: あっ…
  event_newflavor_intermission_01_42:
    speaker: "<Self>"
    en: Darn...
    ko: 아아….
    ja: ああ…
  event_newflavor_intermission_01_43:
    speaker: crust
    en: Um... then...
    ko: 그, 그럼….
    ja: じゃ、じゃあ…
  event_newflavor_intermission_01_44:
    speaker: crust
    en: We could go to the market and try to buy some slightly older ingredients.
    ko: 마켓에 가서, 조금 오래된 재료들이라도 사 올까?
    ja: |-
      マーケットに行って、
      少し古い食材を買ってこようか？
  event_newflavor_intermission_01_45:
    speaker: crust
    en: Although the restaurants have already started hoarding them, so I'm not sure
      how much will be left...
    ko: |-
      음식점들이 벌써 사재기를 시작했다고 해서,
      얼마나 남았을지는 잘 모르겠지만….
    ja: |-
      もう飲食関係の店が買い占めを
      始めてるらしいから、今から行って
      どれだけ残ってるかは分からないけど…
  event_newflavor_intermission_01_46:
    speaker: crust
    en: Oh, or...!
    ko: 아, 아니면…!!
    ja: そ、それとも…！
  event_newflavor_intermission_01_47:
    speaker: bready
    en: Crust.
    ko: 크러스트.
    ja: クラスト。
  event_newflavor_intermission_01_48:
    speaker: bready
    en: Don't worry so much.
    ko: 너무 걱정하지 마.
    ja: そんなに心配しないで。
  event_newflavor_intermission_01_49:
    speaker: bready
    en: I'll be fine. The worst thing is that I'll have to suffer for a few days.
    ko: |-
      나는 괜찮아,
      그래봤자 며칠 고생하는 것뿐이니까.
    ja: |-
      私のことは気にしないで。
      何日か苦しいだけだから。
  event_newflavor_intermission_01_50:
    speaker: crust
    en: But...
    ko: 하지만 브래디….
    ja: でも、ブレッディ…
  event_newflavor_intermission_01_51:
    speaker: crust
    en: Ugh...
    ko: 으으우….
    ja: ううう…
  event_newflavor_intermission_01_52:
    speaker: "<Self>"
    en: Wouldn't it be better if you didn't have to suffer at all?
    ko: 그래도 이왕이면 고생 안 하는 게 좋잖아.
    ja: |-
      しかし、できることなら
      苦しまない方がいいだろう？
  event_newflavor_intermission_01_53:
    speaker: crust
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  event_newflavor_intermission_01_54:
    speaker: crust
    en: My thoughts exactly, Mr. Gourmand!
    ko: 미식가님은 역시 제 마음을 알아주시는군요!
    ja: |-
      グルメ様はやっぱり
      私の気持ちを分かってくれるんですね！
  event_newflavor_intermission_01_55:
    speaker: crust
    en: There's no need to suffer unnecessarily.
    ko: 맞아요, 사서 고생할 필요는 없죠!
    ja: |-
      その通りです。
      わざわざ苦しむ必要なんてないですよね！
  event_newflavor_intermission_01_56:
    speaker: "<Self>"
    en: Let's look for a solution. There must be a way.
    ko: 방법이 있을 수도 있으니까, 찾아보자.
    ja: |-
      何か解決策があるかもしれない、
      考えてみよう
  event_newflavor_intermission_01_57:
    speaker: "<Self>"
    en: I have quite a few rations in my room. Would those work?
    ko: |-
      음, 내 방에 전투식량이 많은데
      그걸로는 안 되려나?
    ja: |-
      私の部屋に軍用の携帯食が大量にあるが、
      それではダメか？
  event_newflavor_intermission_01_58:
    speaker: bready
    en: Rations, processed food, instant food.
    ko: 전투식량, 가공식품, 즉석식품.
    ja: |-
      携帯食とか、加工食品とか、
      インスタント食品とか…
  event_newflavor_intermission_01_59:
    speaker: bready
    en: They all taste the same to me, and don't provide much information.
    ko: |-
      그런 것들은 모두 같은 맛이 나고,
      별다른 정보도 없어.
    ja: |-
      そういうのはみんな同じ味だし、
      特に情報もないの。
  event_newflavor_intermission_01_60:
    speaker: bready
    en: I could last half a day on them, but no longer than that.
    ko: 반나절 정도는 버틸 수 있겠지만, 그게 다야.
    ja: |-
      半日くらいはごまかせるでしょうけど…
      それが限界ね。
  event_newflavor_intermission_01_61:
    speaker: "<Self>"
    en: I see...
    ko: 그렇구나….
    ja: そうか…
  event_newflavor_intermission_01_62:
    speaker: "<Self>"
    en: So it has to be proper food.
    ko: 결국 제대로 된 음식이어야 하는 거네.
    ja: きちんとした食事でないといけないのか
  event_newflavor_intermission_01_63:
    speaker: bready
    en: Yes, my palette is rather demanding, unfortunately.
    ko: 응, 참 번거로운 입이야.
    ja: うん。面倒な舌よね。
  event_newflavor_intermission_01_64:
    speaker: crust
    en: Hmm...
    ko: 으음~
    ja: う～ん…
  event_newflavor_intermission_01_65:
    speaker: crust
    en: Hmmmm...
    ko: 으으으음~!!!
    ja: う～～ん…！！
  event_newflavor_intermission_01_66:
    speaker: "<Self>"
    en: I think I have two possible solutions.
    ko: 두 개의 방법이 있을 것 같네.
    ja: 2つ、方法がある
  event_newflavor_intermission_01_67:
    speaker: crust
    en: Two of them?!
    ko: 두 개! 두 개나요?
    ja: えっ！2つもですか？
  event_newflavor_intermission_01_68:
    speaker: bready
    en: What are they?
    ko: 그게 뭔데?
    ja: 教えてくれる？
  event_newflavor_intermission_01_69:
    speaker: "<Self>"
    en: The first is to solve the Splendamin issue ASAP so proper food becomes available
      sooner.
    ko: 첫 번째는 당장 정상적인 퍼펙트가 나올 수 있도록 해결한다.
    ja: |-
      1つ目、今すぐ正常なパーフェクトが
      製造できるよう問題を解決する
  event_newflavor_intermission_01_70:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_71:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_72:
    speaker: bready
    en: That's easier said than done.
    ko: 불가능에 가까운 방법이네.
    ja: ほぼ不可能ね。
  event_newflavor_intermission_01_73:
    speaker: crust
    en: "*Nod*"
    ko: 끄덕끄덕….
    ja: コクコク…
  event_newflavor_intermission_01_74:
    speaker: "<Self>"
    en: The second is to find a substitute for Splendamin.
    ko: 두 번째는, 퍼펙트를 대신할 무언가를 찾아낸다.
    ja: |-
      2つ目、パーフェクトの代わりになる
      何かを見つける
  event_newflavor_intermission_01_75:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_76:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_77:
    speaker: bready
    en: That's also next to impossible.
    ko: 불가능에 가까운 방법이네.
    ja: ほぼ不可能ね。
  event_newflavor_intermission_01_78:
    speaker: crust
    en: "*Nod nod*"
    ko: 끄덕끄덕끄덕….
    ja: コクコクコク…
  event_newflavor_intermission_01_79:
    speaker: bready
    en: However, of the two,
    ko: 하지만.
    ja: でも…
  event_newflavor_intermission_01_80:
    speaker: bready
    en: the second option might be worth trying.
    ko: 두 번째 방법은 할 만 하겠어.
    ja: 2つ目の方は、よさそうね。
  event_newflavor_intermission_01_81:
    speaker: crust
    en: Huh? Really?
    ko: 엥? 진짜로?
    ja: え？ホントに？
  event_newflavor_intermission_01_82:
    speaker: bready
    en: We all know that
    ko: 퍼펙트의 대체 식품.
    ja: パーフェクトの代わりになる食材なんて…
  event_newflavor_intermission_01_83:
    speaker: bready
    en: there is no substitute for Splendamin at the moment.
    ko: 사실상 없다고 봐야지.
    ja: まず、存在しないと考えるべきよ。
  event_newflavor_intermission_01_84:
    speaker: bready
    en: If there were, Splendamin wouldn't have been created in the first place.
    ko: |-
      그런 게 있었으면,
      퍼펙트는 애초에 만들어지지 않았을 테니까.
    ja: |-
      そんなものがあったら、そもそも
      パーフェクトは生まれてないはずだから。
  event_newflavor_intermission_01_85:
    speaker: bready
    en: However, the important thing is that it makes for a convincing excuse to go
      up to the surface.
    ko: 하지만, 중요한 건 꽤나 그럴싸한 핑계라는 거지.
    ja: |-
      でも、大事なのは
      もっともらしい理由ができるってこと。
  event_newflavor_intermission_01_86:
    speaker: bready
    en: We can say that we have to go up and search for a potential Splendamin substitute.
    ko: |-
      대체 식품에 관한 걸 찾기 위해서는
      지상에 올라가야만 하니까.
    ja: |-
      代わりの食材を探すなら、
      地上へ行くことになるわよね。
  event_newflavor_intermission_01_87:
    speaker: crust
    en: "!!"
    ko: 아…!!
    ja: あっ…！！
  event_newflavor_intermission_01_88:
    speaker: bready
    en: If we go up to the surface under that pretense...
    ko: |-
      그러니, 우리는 퍼펙트를 대신할 무언가를 찾기 위해
      지상에 올라가게 되면.
    ja: |-
      パーフェクトの代わりになる
      何かを見つけるには、地上で…
  event_newflavor_intermission_01_89:
    speaker: "<Self>"
    en: You'll naturally have to taste-test everything we come across as part of the
      search.
    ko: 직접 맛을 보면서 찾게 되겠지.
    ja: 見つけたものの味を確認することになるだろう
  event_newflavor_intermission_01_90:
    speaker: crust
    en: And that would mean that
    ko: 그럼, 자연스럽게…!
    ja: そうなれば、当然…！
  event_newflavor_intermission_01_91:
    speaker: crust
    en: Bready would get to explore and enjoy a whole bunch of flavors along the way!
    ko: 브래디가 여러 가지 맛을 보면서 다닐 수 있겠네요!
    ja: |-
      ブレッディがいろんなものを
      味見できるってことですね！
  event_newflavor_intermission_01_92:
    speaker: "<Self>"
    en: Exactly!
    ko: 그렇지!
    ja: その通りだ
  event_newflavor_intermission_01_93:
    speaker: bready
    en: Considering we have no way of knowing when this situation will correct itself,
      this is the best option we have available to us.
    ko: |-
      퍼펙트가 언제 정상적으로 돌아올지 모르는 지금으로선
      최고의 방법이네.
    ja: |-
      パーフェクトがいつ元に戻るか分からない以上、
      今できる最善の選択ね。
  event_newflavor_intermission_01_94:
    speaker: crust
    en: Then let's get a move on! To the surface!
    ko: 그럼 당장 가자! 지상으로!
    ja: じゃあ、今すぐ行こうよ！地上！
  event_newflavor_intermission_01_95:
    speaker: "<Self>"
    en: Off we go!
    ko: 가자! 가자!
    ja: 善は急げだ
  event_newflavor_intermission_01_96:
    speaker: bready
    en: The only thing is that if we do this, we'll need to produce tangible results.
    ko: |-
      …하지만, 대체 식품을 앞으로 내세운 이상
      그럴싸한 결과를 내야만 해.
    ja: |-
      …でも、そういう目標を掲げるなら、
      それなりの成果をあげなきゃならなくなるわ。
  event_newflavor_intermission_01_97:
    speaker: bready
    en: If we come back completely empty-handed, the Commander's reputation would
      take a hit.
    ko: 실패하게 되면, 지휘관의 명성에도 흠이 생길 테니까.
    ja: |-
      何もありませんでした、なんて言ったら、
      指揮官の評価に傷が付くわよ。
  event_newflavor_intermission_01_98:
    speaker: "<Self>"
    en: I don't mind.
    ko: 난 상관없어.
    ja: 私は構わない
  event_newflavor_intermission_01_99:
    speaker: bready
    en: You don't?
    ko: 왜?
    ja: どうして？
  event_newflavor_intermission_01_100:
    speaker: "<Self>"
    en: My reputation is stellar enough that it won't falter from something like this.
    ko: 내가 쌓아온 명성은 이 정도로 흔들리지 않으니까.
    ja: その程度では揺らがないぐらいの実績はある
  event_newflavor_intermission_01_101:
    speaker: bready
    en: Wow...
    ko: 아….
    ja: えっ…
  event_newflavor_intermission_01_102:
    speaker: "<Self>"
    en: And who knows? We might actually find a substitute.
    ko: 그리고 진짜로 찾을 수도 있잖아, 대체 식품.
    ja: |-
      それに、もしかしたら
      本当に見つかるかもしれないだろう
  event_newflavor_intermission_01_103:
    speaker: bready
    en: Well, actually...
    ko: 그건….
    ja: それは…
  event_newflavor_intermission_01_104:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_105:
    speaker: bready
    en: Never mind. You're right.
    ko: 그래.
    ja: そうね。
  event_newflavor_intermission_01_106:
    speaker: crust
    en: You're so cool, Mr. Gourmand!
    ko: 우오오! 멋있어요, 미식가님!
    ja: わああ！カッコいいです、グルメ様！
  event_newflavor_intermission_01_107:
    speaker: bready
    en: But why are you doing all this for someone you only met today?
    ko: |-
      하지만 오늘 처음 만났는데,
      너무 부담스러운 일을 맡게 된 것 아냐?
    ja: |-
      でも、今日会ったばかりなのに…
      そんなの迷惑じゃない？
  event_newflavor_intermission_01_108:
    speaker: "<Self>"
    en: It's not a problem.
    ko: 전혀 안 부담스러워.
    ja: まったくそんなことはない
  event_newflavor_intermission_01_109:
    speaker: "<Self>"
    en: As a Commander, it's my duty to be here for you.
    ko: 지휘관으로서 내가 해야 할 일인 걸.
    ja: 指揮官として、私がするべき仕事だ
  event_newflavor_intermission_01_110:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_111:
    speaker: "<Self>"
    en: I'm also worried about Bready as well.
    ko: 그리고, 브래디가 걱정되기도 하니까.
    ja: 個人的にも心配だからな
  event_newflavor_intermission_01_112:
    speaker: bready
    en: I told you, I'm fine.
    ko: 나는 괜찮아.
    ja: 私は大丈夫よ。
  event_newflavor_intermission_01_113:
    speaker: "<Self>"
    en: If that were true, Crust wouldn't be as concerned as she is.
    ko: |-
      정말 괜찮을 일이면,
      크러스트가 이렇게까지 걱정하진 않을 것 같은데.
    ja: |-
      本当にそうなら、
      クラストがここまで気にしないだろう
  event_newflavor_intermission_01_114:
    speaker: crust
    en: "!!"
    ko: 흐이…!
    ja: ひゃあっ…！
  event_newflavor_intermission_01_115:
    speaker: "<Self>"
    en: So I'm worried about you too.
    ko: 그래서 나도 같이 걱정이 돼.
    ja: だから私も放ってはおけない
  event_newflavor_intermission_01_116:
    speaker: bready
    en: I see.
    ko: 그렇구나.
    ja: そっか。
  event_newflavor_intermission_01_117:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_intermission_01_118:
    speaker: bready
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクリ――
  event_newflavor_intermission_01_119:
    speaker: crust
    en: Uh, Bready? You okay?
    ko: 브, 브래디?
    ja: ブ、ブレッディ？
  event_newflavor_intermission_01_120:
    speaker: bready
    en: It's just...
    ko: 아….
    ja: なんでもないわ…
  event_newflavor_intermission_01_121:
    speaker: bready
    en: This is the first time I've met a Commander like you.
    ko: "…이런 지휘관은 처음이네, 싶어서."
    ja: "…こんな指揮官は初めて、って思っただけ。"
  event_newflavor_intermission_01_122:
    speaker: bready
    en: All right then.
    ko: 그럼, 부탁할게.
    ja: じゃあ、よろしくね。
  event_newflavor_intermission_01_123:
    speaker: bready
    en: I'd be honored if you came up to the surface with us.
    ko: 우리들과 함께 지상으로 가줘.
    ja: 私たちを地上に連れていって。
event_newflavor_04_s:
  event_newflavor_04_s_1:
    speaker: "<Narration>"
    en: The next day.
    ko: 다음 날.
    ja: 翌日
  event_newflavor_04_s_2:
    speaker: andersen
    en: You're going to look for a Splendamin replacement?
    ko: 대체 식품을 구하러 가겠다고.
    ja: パーフェクトの代替となる食料源を探す？
  event_newflavor_04_s_3:
    speaker: andersen
    en: Where did you come up with that idea?
    ko: 그건 갑자기 어디서 나온 발상이지?
    ja: 雲をつかむような話だ。君の考えか？
  event_newflavor_04_s_4:
    speaker: "<Self>"
    en: Many people are having trouble because of the current issue we're having with
      Splendamin.
    ko: |-
      이번에 생긴 퍼펙트 문제 때문에
      많은 사람들이 불편을 겪고 있습니다.
    ja: |-
      今回のパーフェクトの問題で
      多くの人々が頭を悩ませています
  event_newflavor_04_s_5:
    speaker: "<Self>"
    en: I figured having additional food options other than Splendamin would be a
      good idea.
    ko: |-
      그래서 퍼펙트 말고도 먹을 수 있는
      다른 식품이 있으면 좋겠다는 생각이 들었습니다.
    ja: |-
      パーフェクト以外にも食糧源になるものが
      確保できれば理想的かと考えました
  event_newflavor_04_s_6:
    speaker: andersen
    en: Hmm...
    ko: 흠.
    ja: ふむ…
  event_newflavor_04_s_7:
    speaker: andersen
    en: All we've gotten is word that things haven't been resolved yet.
    ko: 아직도 해결되지 않았다고 했었지.
    ja: まだ解決していないと聞いている。
  event_newflavor_04_s_8:
    speaker: andersen
    en: We don't even know how things are progressing. It's quite frustrating.
    ko: 진행 상황을 모르니, 영 곤란하군.
    ja: |-
      進捗さえ耳に入ってこないというのは
      まったく困ったものだ。
  event_newflavor_04_s_9:
    speaker: andersen
    en: Did anyone from Cooking Oil mention anything?
    ko: 그쪽 스쿼드에게서 따로 들은 얘기는 없었나?
    ja: |-
      クッキングオイル部隊からは
      何か聞いていないか？
  event_newflavor_04_s_10:
    speaker: "<Self>"
    en: No. They're just as in the dark as we are.
    ko: 예, 그들도 자세한 건 모른다고 했습니다.
    ja: はい。彼女たちにも詳細は分からないそうです
  event_newflavor_04_s_11:
    speaker: andersen
    en: Really? That's strange.
    ko: 그래? 그것참 이상하군.
    ja: そうなのか？それは妙だな。
  event_newflavor_04_s_12:
    speaker: "<Self>"
    en: Hmm?
    ko: 예?
    ja: はい？
  event_newflavor_04_s_13:
    speaker: andersen
    en: At any rate,
    ko: 뭐, 일단 알겠네.
    ja: いや、ひとまず話は分かった。
  event_newflavor_04_s_14:
    speaker: andersen
    en: I hope to hear good news from you soon.
    ko: 기대하지.
    ja: 期待している。
  event_newflavor_04_s_15:
    speaker: "<Self>"
    en: "... All right."
    ko: "…예."
    ja: "…はい"
  event_newflavor_04_s_16:
    speaker: "<Monologue>"
    en: I head to the elevator with a heavy heart.
    ko: 나는 찝찝한 마음을 안고, 엘리베이터로 향했다.
    ja: |-
      どこか釈然としない気持ちを抱えたまま、
      私はエレベーターへと向かった
  event_newflavor_04_s_17:
    speaker: crust
    en: Good morning, Mr. Gourmand!
    ko: 미식가님, 좋은 아침이에요!
    ja: グルメ様、おはようございます！
  event_newflavor_04_s_18:
    speaker: "<Self>"
    en: Morning.
    ko: 응, 좋은 아침.
    ja: ああ、おはよう
  event_newflavor_04_s_19:
    speaker: "<Self>"
    en: Why do you have so much stuff?
    ko: 그런데 무슨 짐이 그렇게 많아…?
    ja: "…なぜこんなに荷物が多いんだ…？"
  event_newflavor_04_s_20:
    speaker: crust
    en: Oh, this is nothing.
    ko: 아, 별 건 아니구요~
    ja: いえ、それほどではないですよ～
  event_newflavor_04_s_21:
    speaker: crust
    en: I just packed a few essentials, hehe.
    ko: 필요한 것들 간단하게 챙겨봤어요! 헤헤.
    ja: 必要なものを簡単に用意しただけです！えへへ。
  event_newflavor_04_s_22:
    speaker: crust
    en: A camping stove, frying pan, pot, tongs, and other tools.
    ko: 휴대용 가스버너, 후라이팬, 냄비, 집게 등의 도구들.
    ja: |-
      携帯用ガスバーナーと、フライパンに、
      お鍋とか、トングとか、調理器具と…
  event_newflavor_04_s_23:
    speaker: crust
    en: Salt, pepper, chili powder, soy sauce, and other seasonings.
    ko: 소금, 후추, 고춧가루, 간장 등의 양념들.
    ja: |-
      調味料には塩、コショウ、
      トウガラシパウダーに、お醤油…
  event_newflavor_04_s_24:
    speaker: crust
    en: And...
    ko: 그리고….
    ja: それから…
  event_newflavor_04_s_25:
    speaker: "<Self>"
    en: Why are you bringing all of that?
    ko: 잠깐, 그것들은 왜 다 챙겨온 거야?
    ja: 待ってくれ、そんなに必要か？
  event_newflavor_04_s_26:
    speaker: crust
    en: So that when we find something tasty, we can cook it up straight away!
    ko: 맛있는 걸 찾으면, 바로 요리를 해야 하니까요!
    ja: |-
      おいしそうなものを見つけたら、
      すぐに調理してみないと！
  event_newflavor_04_s_27:
    speaker: crust
    en: That way, Bready can recover more quickly as well.
    ko: 그래야 브래디도 빠르게 좋아질 거구요.
    ja: |-
      そうすればブレッディもすぐに
      よくなるはずです。
  event_newflavor_04_s_28:
    speaker: "<Self>"
    en: This is starting to feel like a camping trip...
    ko: "…무슨 캠핑 가는 것 같네…."
    ja: "…まるでキャンプだな…"
  event_newflavor_04_s_29:
    speaker: "<Self>"
    en: How are you doing by the way, Bready?
    ko: 아! 그러고 보니, 브래디는 좀 괜찮아?
    ja: |-
      そうだ、そういえば…
      ブレッディの調子はどうだ？
  event_newflavor_04_s_30:
    speaker: bready
    en: Fine.
    ko: 응.
    ja: うん。
  event_newflavor_04_s_31:
    speaker: bready
    en: Sometimes I space out, but I'm all right.
    ko: 한 번씩 멍하긴 한데, 아직은 괜찮은 것 같아.
    ja: |-
      たまにぼーっとするけど、
      今のところは大丈夫よ。
  event_newflavor_04_s_32:
    speaker: bready
    en: "... For now."
    ko: "…아직은."
    ja: "…今のところは。"
  event_newflavor_04_s_33:
    speaker: "<Self>"
    en: "... I see."
    ko: 그렇구나….
    ja: "…そうか"
  event_newflavor_04_s_34:
    speaker: "<Self>"
    en: Let's get going.
    ko: 어서 출발하자.
    ja: 先を急ごう
  event_newflavor_04_s_35:
    speaker: crust
    en: Okie dokie!
    ko: 네!
    ja: はい！
  event_newflavor_04_s_36:
    speaker: bready
    en: All right.
    ko: 응.
    ja: うん。
  event_newflavor_04_s_37:
    speaker: "<Monologue>"
    en: Upon arriving at the surface, we begin looking for anything edible nearby.
    ko: |-
      지상에 도착한 우리는,
      주변을 돌아다니며 먹을만한 것을 찾기 시작했다.
    ja: |-
      地上に到着した私たちは、
      食べられそうなものを探しながら歩いた
  event_newflavor_04_s_38:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅- 저벅-
    ja: てくてく…
  event_newflavor_04_s_39:
    speaker: "<Self>"
    en: Bready, what kind of food do you prefer?
    ko: 브래디는 어떤 음식을 제일 좋아해?
    ja: ブレッディの一番好きな食べ物は何だ？
  event_newflavor_04_s_40:
    speaker: bready
    en: Hmm... I'm not sure.
    ko: 으음… 글쎄.
    ja: うーん…さぁ。
  event_newflavor_04_s_41:
    speaker: bready
    en: It's hard to narrow it down...
    ko: 정확하게 하나를 콕 집어서 얘기하기는 그렇고.
    ja: 一つに絞るのは難しいけど…
  event_newflavor_04_s_42:
    speaker: bready
    en: To put it simply, I like things that I find stimulating.
    ko: |-
      간단하게 얘기하자면,
      나에게 자극을 줄 수 있는 걸 좋아해.
    ja: |-
      簡単に言うと、
      刺激をくれるものが好きね。
  event_newflavor_04_s_43:
    speaker: "<Self>"
    en: You mean something like spicy foods?
    ko: 매운맛을 좋아한다는 건가…?
    ja: 辛いものが好物ということか…？
  event_newflavor_04_s_44:
    speaker: bready
    en: Not stimulating in that sense.
    ko: 그런 자극 쪽은 아니야.
    ja: そういう刺激じゃなくて。
  event_newflavor_04_s_45:
    speaker: bready
    en: I'm talking more about new flavors, ingredients, or textures.
    ko: 처음 느껴보는 맛, 성분, 느낌.
    ja: 初めて感じる味とか、成分とか、雰囲気とか。
  event_newflavor_04_s_46:
    speaker: bready
    en: That's what I'm into.
    ko: 이런 쪽이지.
    ja: そういうもの。
  event_newflavor_04_s_47:
    speaker: bready
    en: I'm sure there are plenty of things on the surface I haven't tried.
    ko: 지상은 여전히 새로운 것들이 많잖아.
    ja: |-
      地上にはまだ見たことないものが
      たくさんあるでしょ？
  event_newflavor_04_s_48:
    speaker: "<Self>"
    en: True.
    ko: 그렇지.
    ja: そうだな
  event_newflavor_04_s_49:
    speaker: bready
    en: Hm.
    ko: 응.
    ja: うん。
  event_newflavor_04_s_50:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_04_s_51:
    speaker: bready
    en: That's why I... Commander...
    ko: 그래서 나, 지휘관을….
    ja: だから私、指揮官のこと…
  event_newflavor_04_s_52:
    speaker: "<Self>"
    en: "??"
    ko: 응?
    ja: ん？
  event_newflavor_04_s_53:
    speaker: crust
    en: Bready! Mr. Gourmand!
    ko: 브래디! 미식가님!
    ja: ブレッディ！グルメ様！
  event_newflavor_04_s_54:
    speaker: crust
    en: I think I found something!
    ko: 제가 뭔가를 찾은 것 같아요!
    ja: いいものを見つけた気がします！
  event_newflavor_04_s_55:
    speaker: "<Self>"
    en: Really?
    ko: 오, 그래?
    ja: お、何だ？
  event_newflavor_04_s_56:
    speaker: crust
    en: Ta-da!
    ko: 짠~!
    ja: ジャ～ン！
  event_newflavor_04_s_57:
    speaker: crust
    en: It's a plant I've never seen before.
    ko: 처음 보는 풀이에요!
    ja: 初めて見る草です！
  event_newflavor_04_s_58:
    speaker: "<Self>"
    en: Neither have I...
    ko: 풀…?
    ja: 草…？
  event_newflavor_04_s_59:
    speaker: crust
    en: What do you think, Bready? Is it edible?
    ko: 브래디, 어때? 식용이 가능할까?
    ja: ブレッディ、どう？食べられるかな？
  event_newflavor_04_s_60:
    speaker: bready
    en: Hold on.
    ko: 잠시만.
    ja: ちょっと待って。
  event_newflavor_04_s_61:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_newflavor_04_s_62:
    speaker: bready
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_newflavor_04_s_63:
    speaker: bready
    en: "!!"
    ko: 음…!
    ja: んっ…！
  event_newflavor_04_s_64:
    speaker: bready
    en: It's a taste I've never had before, but it feels similar to water celery.
    ko: |-
      처음 먹어보는 맛이긴 한데,
      미나리랑 비슷한 느낌이야.
    ja: |-
      初めて食べた味だけど、
      セリに似てる感じね。
  event_newflavor_04_s_65:
    speaker: bready
    en: I am detecting trace amounts of toxins, so you'll need to be careful when
      eating it.
    ko: 독소가 조금 있어서, 먹을 때 조심만 하면 될 것 같아.
    ja: 毒素が少しあるから、調理には注意が必要ね。
  event_newflavor_04_s_66:
    speaker: bready
    en: The seeds appear to have traveled here via wind.
    ko: "…씨앗이던 시절, 바람을 타고 여기까지 날아왔나 봐."
    ja: |-
      …種だった頃に、風に乗って
      ここまで飛んで来たみたい。
  event_newflavor_04_s_67:
    speaker: bready
    en: For such a hostile and foreign environment, these seeds are really thriving.
    ko: 낯선 곳에서 잘 자라주었어.
    ja: 慣れない場所で、よく育ったわね。
  event_newflavor_04_s_68:
    speaker: crust
    en: Great! Looks like we found a winner!
    ko: 좋아! 하나 찾았다~!
    ja: やった！1つはっけ～ん！
  event_newflavor_04_s_69:
    speaker: "<Self>"
    en: You think that can replace Splendamin?
    ko: 이게 대체 식품이 될 수 있는 거야?
    ja: これがパーフェクトの代わりになるのか？
  event_newflavor_04_s_70:
    speaker: crust
    en: Huh?
    ko: 네?
    ja: はい？
  event_newflavor_04_s_71:
    speaker: crust
    en: Oh, no, I meant we found something that Bready can eat.
    ko: 으음, 아뇨… 그냥 브래디가 먹을만한 걸 찾은 거예요.
    ja: |-
      えっと、いいえ…ただブレッディが
      食べられそうなものを見つけただけです。
  event_newflavor_04_s_72:
    speaker: "<Self>"
    en: Don't forget that we're also up here to find Splendamin substitutes.
    ko: |-
      그래도 정말 아무것도 안 할 수는 없으니까,
      대체 식품이 될 만한 것들도 찾아보자.
    ja: |-
      本当に何もしない訳にはいかない。
      そういうものも一応探しておこう
  event_newflavor_04_s_73:
    speaker: crust
    en: Ah... Right, right.
    ko: 아…! 그렇죠.
    ja: あっ…！そうですね。
  event_newflavor_04_s_74:
    speaker: crust
    en: It won't be easy, but let's give it a shot!
    ko: 쉽지 않겠지만, 찾아보죠!
    ja: 難しそうですけど、探してみましょう！
event_newflavor_04_e:
  event_newflavor_04_e_1:
    speaker: crust
    en: Here, try this.
    ko: 자, 이거!
    ja: はい、これ！
  event_newflavor_04_e_2:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ
  event_newflavor_04_e_3:
    speaker: bready
    en: Hmm...
    ko: 음….
    ja: うーん…
  event_newflavor_04_e_4:
    speaker: bready
    en: This one won't work.
    ko: 이건 안 되겠어.
    ja: これはダメね。
  event_newflavor_04_e_5:
    speaker: bready
    en: But it does taste nice.
    ko: 그래도 맛은 있네.
    ja: でも味は悪くないわ。
  event_newflavor_04_e_6:
    speaker: crust
    en: What about this one?
    ko: 그럼 이거는?!
    ja: じゃあ、こっちは！？
  event_newflavor_04_e_7:
    speaker: "<Narration>"
    en: "*Lick*"
    ko: 할짝-
    ja: ペロッ――
  event_newflavor_04_e_8:
    speaker: bready
    en: Hmm... This won't work either.
    ko: 으음… 이것도 아니야.
    ja: うーん…これもダメ。
  event_newflavor_04_e_9:
    speaker: bready
    en: It's too difficult to cultivate.
    ko: 너무 힘들게 자랐어.
    ja: 育つ環境が難しすぎるわ。
  event_newflavor_04_e_10:
    speaker: crust
    en: Dang, this sure is tough.
    ko: 으우… 역시 쉽지 않구나.
    ja: うう…やっぱりそう簡単にはいかないよね。
  event_newflavor_04_e_11:
    speaker: "<Self>"
    en: What does something need to qualify as a replacement for Splendamin?
    ko: 어떻게 해야 대체 식품이 될 수 있는 건데?
    ja: |-
      パーフェクトの代わりになるには、
      どういう条件がいる？
  event_newflavor_04_e_12:
    speaker: crust
    en: Hmm...
    ko: 으으음~
    ja: う～ん…
  event_newflavor_04_e_13:
    speaker: crust
    en: First, it must be able to grow underground.
    ko: 일단, 지하에서도 자랄 수 있어야 하고.
    ja: まず、地下でも育たないとダメですね。
  event_newflavor_04_e_14:
    speaker: crust
    en: It needs to contain sufficient nutrients.
    ko: 영양소도 충분해야 하겠죠.
    ja: ちゃんと栄養になるもので…
  event_newflavor_04_e_15:
    speaker: crust
    en: And for the sake of our own quality of life, it should taste decent.
    ko: 삶의 질을 위해 어느 정도 맛도 있어야 할 테구요.
    ja: |-
      それを食べて暮らすことを考えると、
      ある程度おいしくないとつらいです。
  event_newflavor_04_e_16:
    speaker: bready
    en: But most importantly,
    ko: 하지만, 제일 중요한 건.
    ja: でも、一番大事なことは…
  event_newflavor_04_e_17:
    speaker: bready
    en: it has to be cheap to cultivate on a mass scale.
    ko: 싸게 대량 생산이 가능해야 한다는 거지.
    ja: 安く、大量生産できるかどうか。
  event_newflavor_04_e_18:
    speaker: bready
    en: At a lower cost than it does to manufacture Splendamin.
    ko: 지금의 퍼펙트를 만드는 것보다도 더.
    ja: それこそパーフェクトよりも、さらにね。
  event_newflavor_04_e_19:
    speaker: crust
    en: Those are some stringent requirements.
    ko: 으음… 그렇지.
    ja: うーん…そこだよね…
  event_newflavor_04_e_20:
    speaker: crust
    en: That's why I don't think we'll be finding a replacement anytime soon.
    ko: |-
      그래서, 퍼펙트를 완전히 대체할 만한 건
      없을 거라고 생각해요.
    ja: |-
      やっぱり、パーフェクトの代わりに
      なるものなんて、ないと思います。
  event_newflavor_04_e_21:
    speaker: "<Self>"
    en: I see...
    ko: "…음, 그렇구나."
    ja: "…そうか"
  event_newflavor_04_e_22:
    speaker: crust
    en: Still, let's keep looking!
    ko: 그래도 열심히 찾아보죠!
    ja: でも、頑張って探してみましょう！
  event_newflavor_04_e_23:
    speaker: crust
    en: Let's go, Bready.
    ko: 가자, 브래디!
    ja: 行こう、ブレッディ！
  event_newflavor_04_e_24:
    speaker: bready
    en: All right.
    ko: 응.
    ja: うん。
  event_newflavor_04_e_25:
    speaker: "<Narration>"
    en: "*Step step*"
    ko: 저벅- 저벅-
    ja: てくてく…
  event_newflavor_04_e_26:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_04_e_27:
    speaker: "<Self>"
    en: Something about this seems fishy.
    ko: 뭔가 이상하네….
    ja: 何かが腑に落ちない…
  event_newflavor_04_e_28:
    speaker: crust
    en: Let's see.
    ko: 어디 보자~
    ja: えっと～
  event_newflavor_04_e_29:
    speaker: crust
    en: Now that we've found a place to stay for the night, let's get ourselves sorted.
    ko: 오늘 잘 곳도 찾았으니, 정리를 좀 해볼까요?
    ja: |-
      休めそうな場所も見つけましたし、
      今日の収穫をおさらいしませんか？
  event_newflavor_04_e_30:
    speaker: crust
    en: From all the specimens we gathered today,
    ko: 바로 식용 가능한 것들이 2개.
    ja: そのまま食べられるものが2種類…
  event_newflavor_04_e_31:
    speaker: crust
    en: two can be eaten as is,
    ko: 따로 손을 봐야 먹을 수 있는 것들이 4개.
    ja: 手を加えれば食べられるものが4種類…
  event_newflavor_04_e_32:
    speaker: crust
    en: four need to be treated in some fashion before they're edible,
    ko: 아예 못 먹는 것들이 13개.
    ja: どうやっても食べられないものが13種類。
  event_newflavor_04_e_33:
    speaker: crust
    en: and thirteen are inedible.
    ko: 오늘 찾은 것들은 이렇게네요.
    ja: これで全部ですね。
  event_newflavor_04_e_34:
    speaker: bready
    en: All in all, not bad.
    ko: 나쁘지 않네.
    ja: 悪くないわね。
  event_newflavor_04_e_35:
    speaker: crust
    en: Hehe, I thought so too.
    ko: 헤헤, 그치~?
    ja: えへへ、だよね～？
  event_newflavor_04_e_36:
    speaker: "<Narration>"
    en: "*Growl*"
    ko: 꼬르르륵-
    ja: グゥゥゥゥ…
  event_newflavor_04_e_37:
    speaker: crust
