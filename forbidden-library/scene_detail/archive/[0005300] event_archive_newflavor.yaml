---
event_newflavor_prologue:
  event_newflavor_prologue_1:
    speaker: "<Narration>"
    en: "*Ring*"
    ko: 딸랑-
    ja: チリン――
  event_newflavor_prologue_2:
    speaker: femaleemployee
    en: Welcome!
    ko: 어서 오세요~
    ja: いらっしゃいませ～
  event_newflavor_prologue_3:
    speaker: femaleemployee
    en: How many are in your party?
    ko: 몇 분이신가요?
    ja: 何名様ですか？
  event_newflavor_prologue_4:
    speaker: bready
    en: Just one.
    ko: 1명.
    ja: 1人。
  event_newflavor_prologue_5:
    speaker: femaleemployee
    en: All right, I'll guide you to a single table.
    ko: 네, 개인석으로 안내해 드리겠습니다.
    ja: はい。お席へご案内します。
  event_newflavor_prologue_6:
    speaker: femaleemployee
    en: What would you like to order?
    ko: 메뉴는 어떤 것으로 드릴까요?
    ja: ご注文はお決まりですか？
  event_newflavor_prologue_7:
    speaker: bready
    en: I'll have whatever is the most popular.
    ko: 제일 잘 나가는 걸로 하나.
    ja: 一番人気のメニューで。
  event_newflavor_prologue_8:
    speaker: femaleemployee
    en: We have a special dish on offer this month. Would you like us to prepare that
      for you?
    ko: 그럼, 이달의 추천 메뉴로 준비해 드려도 괜찮을까요?
    ja: |-
      では、今月のおすすめで
      よろしいでしょうか？
  event_newflavor_prologue_9:
    speaker: bready
    en: Sure.
    ko: 응.
    ja: うん。
  event_newflavor_prologue_10:
    speaker: femaleemployee
    en: Very well. We'll have that ready for you in just a moment.
    ko: 알겠습니다, 잠시만 기다려주세요~
    ja: かしこまりました。少々お待ちください。
  event_newflavor_prologue_11:
    speaker: femaleemployee
    en: Here you are.
    ko: 손님, 메뉴 준비해 드리겠습니다.
    ja: お客様、お待たせいたしました。
  event_newflavor_prologue_12:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 달그락.
    ja: カチャ…
  event_newflavor_prologue_13:
    speaker: femaleemployee
    en: Enjoy!
    ko: 맛있게 드세요~
    ja: ごゆっくりどうぞ～
  event_newflavor_prologue_14:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_prologue_15:
    speaker: bready
    en: Ah, so it's sous-vide tenderloin.
    ko: 소의 안심 부위를 모방한 퍼펙트.
    ja: |-
      今月のおすすめメニューは…
      低温調理の牛ヒレステーキね。
  event_newflavor_prologue_16:
    speaker: bready
    en: Imitation beef tenderloin, made out of Splendamin.
    ko: 가니쉬로 아스파라거스, 감자, 버섯, 파프리카.
    ja: 牛ヒレ味のパーフェクトに…
  event_newflavor_prologue_17:
    speaker: bready
    en: Asparagus, potatoes, mushrooms, and bell peppers as sides.
    ko: 이달의 추천 메뉴는, 수비드 안심 스테이크였구나.
    ja: |-
      付け合わせのアスパラガス、
      ジャガイモ、キノコ、パプリカ風。
  event_newflavor_prologue_18:
    speaker: bready
    en: Let's see how it is.
    ko: 잘 먹을게.
    ja: いただきます。
  event_newflavor_prologue_19:
    speaker: bready
    en: "*Chomp*"
    ko: "…냠."
    ja: "…ぱくっ。"
  event_newflavor_prologue_20:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_prologue_21:
    speaker: bready
    en: "?"
    ko: "……???"
    ja: "……？？？"
  event_newflavor_prologue_22:
    speaker: bready
    en: "*Chomp*"
    ko: 냠.
    ja: もぐ。
  event_newflavor_prologue_23:
    speaker: bready
    en: "*Lick*"
    ko: 할짝.
    ja: ペロッ。
  event_newflavor_prologue_24:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_prologue_25:
    speaker: bready
    en: I can't taste anything.
    ko: 아무 맛이 안 나.
    ja: 味がしない…
  event_newflavor_prologue_26:
    speaker: bready
    en: I don't understand.
    ko: 아무것도 모르겠어.
    ja: 何も分からないわ。
  event_newflavor_prologue_27:
    speaker: bready
    en: What's going on with me...?
    ko: 내가… 어떻게…?
    ja: 私が…どうして…？
  event_newflavor_prologue_28:
    speaker: "<Narration>"
    en: "*Clink*!"
    ko: 쨍그랑-!
    ja: ガシャーン！
  event_newflavor_prologue_29:
    speaker: bready
    en: "...?"
    ko: "……?"
    ja: "……？"
  event_newflavor_prologue_30:
    speaker: glasseswoman
    en: How can you serve this to your customers?
    ko: 아니, 이게 진짜 손님 먹으라고 내놓은 음식이라고요?
    ja: これが人様に出す料理ですって？
  event_newflavor_prologue_31:
    speaker: glasseswoman
    en: The flavor is completely off!
    ko: 맛이 이상하잖아요!
    ja: 何なのよこの味は！？
  event_newflavor_prologue_32:
    speaker: femaleemployee
    en: Our sincerest apologies, ma'am. We'll prepare another dish for you right away.
    ko: |-
      죄송합니다, 손님.
      음식을 다시 내어드리겠습니다.
    ja: |-
      申し訳ございません、お客様。
      すぐに新しいものをお持ちいたします。
  event_newflavor_prologue_33:
    speaker: boy
    en: "*Waaaah*! *Waaaahh*!"
    ko: 으아앙~! 으아아앙~!!
    ja: うわ～ん！うわ～ん！！
  event_newflavor_prologue_34:
    speaker: youngman
    en: Are you sure this hasn't gone bad?
    ko: 상한 거 아니에요 이거?
    ja: これ、腐ってるんじゃないか？
  event_newflavor_prologue_35:
    speaker: youngman
    en: Food simply shouldn't taste like this!
    ko: 음식에서 날 수 없는 맛이라니까요!
    ja: 食べ物とは思えない！
  event_newflavor_prologue_36:
    speaker: staff_02
    en: I'll confirm with the kitchen and get back to you.
    ko: 주방에 확인 후에 말씀드리겠습니다.
    ja: キッチンに確認してまいります。
  event_newflavor_prologue_37:
    speaker: youngman
    en: Before you do that, just try some yourself!
    ko: 주방에 확인하기 전에, 직접 드셔보시라고요!
    ja: |-
      わざわざ行かなくたって、
      これを食えばわかるだろ！
  event_newflavor_prologue_38:
    speaker: bready
    en: Everyone seems to have a problem with the flavor...
    ko: 맛이 이상하다고?
    ja: 味がおかしい？
  event_newflavor_prologue_39:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_prologue_40:
    speaker: bready
    en: "*Chomp*"
    ko: 냠.
    ja: もぐ…
  event_newflavor_prologue_41:
    speaker: bready
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_prologue_42:
    speaker: bready
    en: This isn't good.
    ko: 큰일 났네.
    ja: 大変だわ。
event_newflavor_01_s:
  event_newflavor_01_s_1:
    speaker: "<Narration>"
    en: "*Knock knock*"
    ko: 똑똑.
    ja: コンコン
  event_newflavor_01_s_2:
    speaker: rapi
    en: Commander, may I come in?
    ko: 지휘관, 들어가도 되겠습니까.
    ja: |-
      指揮官。
      入ってもよろしいでしょうか。
  event_newflavor_01_s_3:
    speaker: "<Self>"
    en: Sure, come on in.
    ko: 응, 들어와.
    ja: ああ
  event_newflavor_01_s_4:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン
  event_newflavor_01_s_5:
    speaker: rapi
    en: Sorry for disturbing you so early in the morning,
    ko: 아침 일찍 죄송합니다.
    ja: 早朝から申し訳ありません。
  event_newflavor_01_s_6:
    speaker: rapi
    en: but have you eaten yet?
    ko: 지휘관, 아직 식사 전이십니까.
    ja: 指揮官、まだお食事は？
  event_newflavor_01_s_7:
    speaker: "<Self>"
    en: No, I just woke up.
    ko: 으응, 일어난 지 얼마 안 됐으니까.
    ja: ああ、起きたばかりだからな
  event_newflavor_01_s_8:
    speaker: rapi
    en: Good.
    ko: 다행이군요.
    ja: そうですか、安心しました。
  event_newflavor_01_s_9:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭-
    ja: ガサッ
  event_newflavor_01_s_10:
    speaker: rapi
    en: For the time being, please refrain from going to the dining hall or purchasing
      any food elsewhere.
    ko: 당분간은 식당에 가거나, 새로운 걸 사드시지 마시고.
    ja: しばらくは外食や食材の購入を控えて…
  event_newflavor_01_s_11:
    speaker: rapi
    en: Stick to these instead.
    ko: 이것만 드셔주십시오.
    ja: こちらのものをお召し上がりください。
  event_newflavor_01_s_12:
    speaker: "<Self>"
    en: Are those combat rations?
    ko: 이건… 전투 식량?
    ja: これは…戦闘時用の携帯食では？
  event_newflavor_01_s_13:
    speaker: rapi
    en: Yes.
    ko: 예.
    ja: はい。
  event_newflavor_01_s_14:
    speaker: rapi
    en: I prepared them in advance for whenever we're out on a mission.
    ko: 임무를 대비하여 미리 사두었던 전투 식량들입니다.
    ja: 任務に備えて事前に備蓄してあったものです。
  event_newflavor_01_s_15:
    speaker: "<Self>"
    en: Why is it so important that we have these instead of regular food?
    ko: 갑자기 왜 전투 식량을….
    ja: 何があった…？
  event_newflavor_01_s_16:
    speaker: rapi
    en: We don't know exactly what's going on,
    ko: "…지금, 정확한 이유는 알 수 없지만."
    ja: 正確な原因は不明ですが…
  event_newflavor_01_s_17:
    speaker: rapi
    en: but last night, reports began coming in about food in the Ark tasting unusual.
    ko: 어제 저녁부터 만들어진 음식들의 맛이 이상하다고 합니다.
    ja: |-
      食品から異常な味がするという訴えが
      昨晩から相次いでいるようです。
  event_newflavor_01_s_18:
    speaker: rapi
    en: It started with restaurants and household meals,
    ko: 식당 및 일반 가정집에서 가장 많은 민원이 들어왔고.
    ja: レストランの客や一般家庭の食事をはじめ…
  event_newflavor_01_s_19:
    speaker: rapi
    en: but earlier this morning, even pre-packaged snacks and treats have apparently
      developed an odd flavor to them.
    ko: |-
      새벽부터는 과자나 간식 등에서도
      이상한 맛이 난다고 하더군요.
    ja: 早朝には菓子類でも異常が確認されています。
  event_newflavor_01_s_20:
    speaker: rapi
    en: I tasted some myself, and the taste indeed was quite peculiar, unlike anything
      I'd experienced before.
    ko: |-
      제가 직접 먹어본 결과,
      확실히 처음 먹어보는 이상한 맛이 났습니다.
    ja: |-
      私も実際に食べてみたところ、
      確かに今までにない不可解な味がしました。
  event_newflavor_01_s_21:
    speaker: rapi
    en: That's why, just to be safe, I'm recommending you stick to combat rations
      for now.
    ko: |-
      그래서, 당분간은 안전하도록
      전투식량을 드시는 걸 추천해 드립니다.
    ja: |-
      ですので、しばらくは安全のため
      こちらをお召し上がりください。
  event_newflavor_01_s_22:
    speaker: "<Self>"
    en: What in the world...
    ko: 이럴 수가….
    ja: 一大事だな…
  event_newflavor_01_s_23:
    speaker: rapi
    en: Cooking Oil is on their way to investigate further.
    ko: |-
      자세한 확인을 위해,
      쿠킹오일 스쿼드가 이곳으로 오고 있다고 합니다.
    ja: |-
      詳細な事態把握のために、
      クッキングオイル部隊が
      こちらへ向かっています。
  event_newflavor_01_s_24:
    speaker: "<Self>"
    en: Cooking Oil? You mean the squad?
    ko: 쿠킹오일 스쿼드?
    ja: クッキングオイル？
  event_newflavor_01_s_25:
    speaker: "<Narration>"
    en: "*Thud thud thud*"
    ko: 다다다-!
    ja: ダダダダッ…！
  event_newflavor_01_s_26:
    speaker: "<Narration>"
    en: "*Knock knock knock*"
    ko: 똑똑! 똑똑똑!
    ja: コンコン！コンコンコン！
  event_newflavor_01_s_27:
    speaker: crust
    en: Hello! Is this the Commander's room?
    ko: 안녕하세요! 혹시 여기가 지휘관실 맞나요?
    ja: 失礼します！ここが指揮官室ですか？
  event_newflavor_01_s_28:
    speaker: crust
    en: If it is, may we come in?
    ko: 혹시 맞다면 들어가도 괜찮을까요?
    ja: 入ってもよろしいでしょうか？
  event_newflavor_01_s_29:
    speaker: crust
    en: I'm Crust from Cooking Oil.
    ko: 저는 쿠킹오일 스쿼드의 크러스트라고 합니다!
    ja: クッキングオイル所属のクラストと言います！
  event_newflavor_01_s_30:
    speaker: rapi
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_01_s_31:
    speaker: "<Monologue>"
    en: I glance at Rapi, who gives me an affirming nod.
    ko: |-
      나는 라피를 바라보았고,
      라피는 가볍게 고개를 끄덕였다.
    ja: |-
      ラピに目配せをすると、
      軽くうなずいた
  event_newflavor_01_s_32:
    speaker: "<Self>"
    en: Come in.
    ko: 응, 들어와.
    ja: ああ、構わない
  event_newflavor_01_s_33:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  event_newflavor_01_s_34:
    speaker: crust
    en: Oh boy,
    ko: 으아! 열렸다!
    ja: ひゃあっ！開いた！
  event_newflavor_01_s_35:
    speaker: crust
    en: this is really nerve-wracking...
    ko: |-
      후우…! 후우…!
      긴장돼…!
    ja: |-
      ふぅ…！はぁ…！
      ドキドキする…！
  event_newflavor_01_s_36:
    speaker: crust
    en: H-hello, Commander!
    ko: 아… 안녕하세요, 지휘관님!
    ja: こ…こんにちは、指揮官様！
  event_newflavor_01_s_37:
    speaker: crust
    en: It's an honor to finally meet you in person, hehe.
    ko: 이렇게 직접 만나 뵙게 되어서 영광이에요! 헤헤~
    ja: お会いできて光栄です！えへへ～
  event_newflavor_01_s_38:
    speaker: crust
    en: I'm Crust, the squad leader and head chef.
    ko: 저는 스쿼드의 리더이자 주방장인 크러스트라고 해요!
    ja: |-
      クッキングオイル部隊の
      リーダー兼料理長、クラストです！
  event_newflavor_01_s_39:
    speaker: crust
    en: Nice to meet you.
    ko: 잘 부탁드려요~
    ja: よろしくお願いします！
  event_newflavor_01_s_40:
    speaker: bready
    en: Hi.
    ko: 안녕.
    ja: どうも。
  event_newflavor_01_s_41:
    speaker: bready
    en: I'm Bready, the taster.
    ko: 나는 시식 담당인 브래디야.
    ja: 試食担当のブレッディよ。
  event_newflavor_01_s_42:
    speaker: bready
    en: Pleased to meet you.
    ko: 잘 부탁해.
    ja: よろしくね。
  event_newflavor_01_s_43:
    speaker: "<Self>"
    en: Nice to meet you both,
    ko: 만나서 반가워.
    ja: よろしく頼む
  event_newflavor_01_s_44:
    speaker: "<Self>"
    en: but what's this all about?
    ko: 그런데, 무슨 일이야?
    ja: それで、何があった？
  event_newflavor_01_s_45:
    speaker: crust
    en: Has no one briefed you yet?
    ko: 아~! 아직 이야기 전달을 못 받으셨군요!
    ja: あっ！まだ情報が届いてませんでしたか？
  event_newflavor_01_s_46:
    speaker: crust
    en: We're here to investigate why all the food has started tasting funny.
    ko: 음식 맛이 이상하게 변한 것 때문에 찾아왔어요.
    ja: |-
      食べ物の味がおかしくなってるって話、
      聞いてますよね？
  event_newflavor_01_s_47:
    speaker: crust
    en: We, including you, have to conduct an inquiry and come up with a solution.
    ko: 확인을 하고, 대안을 찾아야 하니까요!
    ja: |-
      状況を確認して、
      対策を見つけないといけないんです！
  event_newflavor_01_s_48:
    speaker: "<Self>"
    en: Wait, why am I included in this?
    ko: 내가…?
    ja: まさか私が…？
  event_newflavor_01_s_49:
    speaker: crust
    en: We were told to go and rendezvous with you, Commander.
    ko: 사장님께서 지휘관님에게 가보라고 하셨거든요~
    ja: 指揮官様に相談してって社長に言われたんです～
  event_newflavor_01_s_50:
    speaker: crust
    en: And so, to that end,
    ko: 그러니까, 일단.
    ja: なので、とりあえず…
  event_newflavor_01_s_51:
    speaker: crust
    en: we'd like to ask you to try this food.
    ko: 음식을 드셔주세요!
    ja: 料理を召し上がってください！
  event_newflavor_01_s_52:
    speaker: "<Self>"
    en: "??"
    ko: 음식?
    ja: 料理？
  event_newflavor_01_s_53:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 달그락- 달그락-
    ja: カチャカチャ…
  event_newflavor_01_s_54:
    speaker: "<Monologue>"
    en: Crust and Bready pull out a large lunchbox and place it on the desk.
    ko: |-
      크러스트와 브래디는 커다란 도시락통 하나를 꺼내,
      책상 위에 올려두었다.
    ja: |-
      クラストとブレッディが
      大きな弁当箱を取り出し、机の上に置いた
  event_newflavor_01_s_55:
    speaker: bready
    en: These are dishes that Crust made.
    ko: 크러스트가 직접 만든 요리야.
    ja: クラストの手作りよ。
  event_newflavor_01_s_56:
    speaker: bready
    en: Give them a taste.
    ko: 먹어봐.
    ja: 食べてみて。
  event_newflavor_01_s_57:
    speaker: "<Self>"
    en: Is that all I have to do?
    ko: "…먹기만 하면 되는 거야?"
    ja: "…食べるだけでいいのか？"
  event_newflavor_01_s_58:
    speaker: bready
    en: Yep.
    ko: 응.
    ja: うん。
  event_newflavor_01_s_59:
    speaker: bready
    en: And they'll be delicious too.
    ko: 맛있을 거야.
    ja: おいしいはずよ。
  event_newflavor_01_s_60:
    speaker: "<Monologue>"
    en: Wasn't she just saying how all the food has been tasting strange lately...?
    ko: "…방금 전 까지, 음식 맛이 이상하게 변했다고 했던 것 같은데…."
    ja: |-
      …その料理の味に異変があったという
      話のはずだが…
  event_newflavor_01_s_61:
    speaker: "<Monologue>"
    en: I glance at the lunchbox apprehensively.
    ko: 하는 생각을 하며, 나는 도시락을 바라보았다.
    ja: そう考えながら、私は弁当を確認した
  event_newflavor_01_s_62:
    speaker: "<Self>"
    en: How much did you put in this thing?
    ko: 이게… 몇 단이야?
    ja: これは…何段あるんだ？
  event_newflavor_01_s_63:
    speaker: crust
    en: I figured that
    ko: 아!
    ja: あ！
  event_newflavor_01_s_64:
    speaker: crust
    en: since it was our first time meeting each other, it'd be nice to let you try
      a variety of different dishes.
    ko: |-
      그래도 처음 뵙는 건데, 이런저런 음식들을
      맛 보게 해드리고 싶다고 생각했더니….
    ja: |-
      せっかく初めてお会いするので、
      色々食べてもらいたいな～と思って…
  event_newflavor_01_s_65:
    speaker: crust
    en: I think I may have gone overboard and made too much, hehe.
    ko: 생각보다 너무 많이 한 거 있죠, 헤헤~
    ja: つい作りすぎちゃいました。えへへ～
  event_newflavor_01_s_66:
    speaker: "<Self>"
    en: "... I see."
    ko: 그렇구나….
    ja: そうか…
  event_newflavor_01_s_67:
    speaker: "<Self>"
    en: Well, may I?
    ko: 잘 먹을게.
    ja: いただきます
  event_newflavor_01_s_68:
    speaker: crust
    en: Help yourself!
    ko: 네!
    ja: はい！
  event_newflavor_01_s_69:
    speaker: "<Monologue>"
    en: I reach for a small helping that appears to be an appetizer.
    ko: |-
      나는 딱 봐도 에피타이저처럼 보이는
      작은 음식에 젓가락을 가져다 댔다.
    ja: |-
      私はおそらく前菜であろう
      小さな料理を持ち上げた
  event_newflavor_01_s_70:
    speaker: crust
    en: Very nice!
    ko: 오!
    ja: あっ！
  event_newflavor_01_s_71:
    speaker: crust
    en: I see that
    ko: 드시는 순서를 아시는군요~!
    ja: それを最初に食べて欲しかったんです～！
  event_newflavor_01_s_72:
    speaker: crust
    en: you know which order to eat everything in.
    ko: 맞아요, 이것들 먼저 맛보시면 된답니다!
    ja: うれしいです～そのまま食べてください！
  event_newflavor_01_s_73:
    speaker: crust
    en: The scallops, truffles, and tuna are finger foods, so no need for utensils.
    ko: 순서대로 관자, 송로 버섯, 참치를 베이스로 만들었구요!
    ja: |-
      左側から、貝柱、トリュフ、マグロを
      ベースにしました！
  event_newflavor_01_s_74:
    speaker: crust
    en: You can pick them up with your hands.
    ko: 핑거 푸드로 만든 거라, 손으로 집어 드셔도 된답니다!
    ja: |-
      フィンガーフードとして作ったので、
      つまんで食べても大丈夫です！
  event_newflavor_01_s_75:
    speaker: crust
    en: Enjoy!
    ko: 맛있게 드세요~!
    ja: どうぞ召し上がれ～！
  event_newflavor_01_s_76:
    speaker: "<Self>"
    en: All right.
    ko: 그래…?
    ja: なるほど…？
  event_newflavor_01_s_77:
    speaker: "<Monologue>"
    en: I pick up the scallop on the left with one hand,
    ko: 나는 왼쪽에 있는 관자 요리를 한 손으로 집었고.
    ja: 私は一番左の料理を片手でつまみ…
  event_newflavor_01_s_78:
    speaker: "<Monologue>"
    en: and pop it into my mouth.
    ko: 입안으로 밀어 넣었다.
    ja: 口の中に放り込んだ
  event_newflavor_01_s_79:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_01_s_80:
    speaker: "<Self>"
    en: "?!"
    ko: "…?!?!"
    ja: "…！？！？"
  event_newflavor_01_s_81:
    speaker: "<Self>"
    en: Th-the flavor... it's...
    ko: 이, 이 맛은…?!
    ja: こ、この味は…！？
event_newflavor_01_e:
  event_newflavor_01_e_1:
    speaker: crust
    en: What do you think?
    ko: 어때요? 어때요??
    ja: どうですか？
  event_newflavor_01_e_2:
    speaker: crust
    en: Isn't it scrumptious?
    ko: 맛있죠?!
    ja: おいしいでしょう！？
  event_newflavor_01_e_3:
    speaker: "<Monologue>"
    en: Scrumptious...
    ko: 맛있다…?
    ja: おいしい…？
  event_newflavor_01_e_4:
    speaker: "<Monologue>"
    en: doesn't even begin to describe this scallop.
    ko: 이건 맛있다는 단순한 단어로 표현해서는 안 된다.
    ja: |-
      これは、おいしいなどと
      平凡な言葉で片付けていいものではない！
  event_newflavor_01_e_5:
    speaker: "<Self>"
    en: It's better than scrumptious.
    ko: 그냥 맛있는 게 아니야.
    ja: ただおいしいどころじゃない
  event_newflavor_01_e_6:
    speaker: "<Self>"
    en: The scallops are perfectly seared, the tangy lemon sauce enhances the freshness,
      and the crispy coconut adds a sweet crunch.
    ko: |-
      적당한 굽기의 관자, 상큼함을 돋구는 레몬 소스,
      식감을 살려주는 달콤하고 바삭한 크리스피 코코넛.
    ja: |-
      貝柱の絶妙な焼き加減、爽やかなレモンソース、
      甘いクリスピーココナッツの
      サクサクとした食感…
  event_newflavor_01_e_7:
    speaker: "<Self>"
    en: Everything blends together in a harmonious symphony for my tastebuds. It's
      absolutely divine.
    ko: 이 모든 것이 입안에 하나로 어우러져, 그야말로 미미!!!
    ja: |-
      すべてが口の中でハーモニーを奏でている。
      まさに美味…！！
  event_newflavor_01_e_8:
    speaker: crust
    en: Oh my goodness!
    ko: 미, 미미…!
    ja: 美味…ああ…！
  event_newflavor_01_e_9:
    speaker: bready
    en: Divine? What does he mean by that, Crust?
    ko: |-
      미미?
      그게 무슨 말이야, 크러스트?
    ja: そんなにうれしい言葉？クラスト。
  event_newflavor_01_e_10:
    speaker: crust
    en: That's a term we use to describe the absolute pinnacle of flavor.
    ko: 미미는… 최고의 음식 맛을 칭하는 말이야.
    ja: だって…料理にとっては最高のほめ言葉でしょ。
  event_newflavor_01_e_11:
    speaker: crust
    en: When something tastes so extraordinary that it transcends the limits of ordinary
      language.
    ko: 말 그대로 아름다운 수준의 맛이라는 거지.
    ja: 言葉通り、美しさを感じるぐらいの味ってこと。
  event_newflavor_01_e_12:
    speaker: bready
    en: Oh.
    ko: 아하.
    ja: そういうものかしら。
  event_newflavor_01_e_13:
    speaker: crust
    en: "*Sniffle* To receive such effusive praise from the Commander, and we've only
      just met!"
    ko: 흐윽…! 지휘관님과의 첫 만남에 이런 극찬을 받다니…!
    ja: |-
      ううっ…！初めて会った指揮官様から
      そこまでほめていただけるなんて…！
  event_newflavor_01_e_14:
    speaker: crust
    en: I can see that you're someone with a true love for food.
    ko: 이렇게나 음식을 좋아하는 분이시라니!!
    ja: とってもグルメな方だったんですね！！
  event_newflavor_01_e_15:
    speaker: crust
    en: All right, it's decided then.
    ko: 결정했어요.
    ja: 私、決めました。
  event_newflavor_01_e_16:
    speaker: crust
    en: You've made me feel special, and so I'll do the same for you.
    ko: |-
      지휘관님이 제 음식을 특별하게 만들어주셨으니,
      저도 지휘관님을 특별하게 생각하겠어요.
    ja: |-
      私の料理を特別に思ってくださったので、
      私も指揮官様のことを特別に思います。
  event_newflavor_01_e_17:
    speaker: crust
    en: From now on, I shall call you "Mr. Gourmand"!
    ko: 앞으로 지휘관님을 미식가님이라 부르겠어요!
    ja: |-
      これからは指揮官様のこと、
      グルメ様って呼びますね！
  event_newflavor_01_e_18:
    speaker: "<Self>"
    en: "... Mr. Gourmand?"
    ko: 내가, 미식가!
    ja: 私が…グルメ！
  event_newflavor_01_e_19:
    speaker: crust
    en: Yes, Mr. Gourmand! That compliment you gave me a moment ago is the best I've
      ever received!
    ko: |-
      네, 미식가님!
      제가 지금까지 들은 표현들 중에 최고였어요!
    ja: |-
      はい、グルメ様！
      今までで一番うれしいほめられ方でした！
  event_newflavor_01_e_20:
    speaker: crust
    en: There's still plenty of food left, so have at it!
    ko: 남은 음식들도 많으니, 맛있게 드셔주셔야 해요!
    ja: |-
      料理はまだまだたくさんあるので、
      ぜひ召し上がってください！
  event_newflavor_01_e_21:
    speaker: "<Self>"
    en: I certainly will.
    ko: 물론이지!!
    ja: もちろんだ！
  event_newflavor_01_e_22:
    speaker: crust
    en: Hehe, I'm so happy!
    ko: 으헤헤, 행복하네요!
    ja: えへへ、私、幸せです！
  event_newflavor_01_e_23:
    speaker: bready
    en: Crust,
    ko: 크러스트.
    ja: クラスト…
  event_newflavor_01_e_24:
    speaker: bready
    en: it's great that the Commander is enjoying the food as much as he is,
    ko: 지휘관이 맛있게 먹어주는 것도 좋지만.
    ja: おいしく食べてもらうのはいいけど…
  event_newflavor_01_e_25:
    speaker: bready
    en: but don't you have another lunchbox to share with him?
    ko: 그 전에, 다른 도시락도 줘야지.
    ja: その前に、他も食べてもらわないと。
  event_newflavor_01_e_26:
    speaker: crust
    en: Oh, right!
    ko: 아~!
    ja: あ～！
  event_newflavor_01_e_27:
    speaker: crust
    en: I almost forgot.
    ko: 맞아, 나도 참…!
    ja: そうだった！私ったらつい…！
  event_newflavor_01_e_28:
    speaker: "<Narration>"
    en: "*Clatter clatter*"
    ko: 달그락- 달그락-
    ja: カチャカチャ…
  event_newflavor_01_e_29:
    speaker: crust
    en: Before you finish all that food in front of you,
    ko: 미식가님, 그 도시락을 마저 드시기 전에.
    ja: グルメ様、そのお弁当はひとまず置いておいて…
  event_newflavor_01_e_30:
    speaker: crust
    en: be sure to try some of what's in here as well.
    ko: 이것도 드셔주세요!
    ja: こちらを召し上がってみてください！
  event_newflavor_01_e_31:
    speaker: "<Self>"
    en: Huh? Another lunchbox?
    ko: 응? 이것도 도시락이네.
    ja: ん？これも弁当か
  event_newflavor_01_e_32:
    speaker: crust
    en: This one's a bit different.
    ko: 네!
    ja: はい！
  event_newflavor_01_e_33:
    speaker: crust
    en: Please give it a taste and
    ko: 하지만 조금 다를 거예요.
    ja: でも、ちょっと違うはずです。
  event_newflavor_01_e_34:
    speaker: crust
    en: let me know what you think.
    ko: 드시고, 맛 평가를 부탁드릴게요.
    ja: 食べてみて、味の評価をお願いします。
  event_newflavor_01_e_35:
    speaker: "<Self>"
    en: All right.
    ko: 응!
    ja: 分かった！
  event_newflavor_01_e_36:
    speaker: "<Monologue>"
    en: The second lunchbox is also filled with dishes that look mouthwateringly delectable.
    ko: |-
      두 번째 도시락 역시
      보기만 해도 맛있어 보이는 음식들이 가득 들어있었다.
    ja: |-
      2つ目の重箱にも、見るからに
      食欲をそそる料理が所せましと並んでいた
  event_newflavor_01_e_37:
    speaker: "<Self>"
    en: I'll start with this one.
    ko: 잘 먹겠습니다~
    ja: いただきます
  event_newflavor_01_e_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  event_newflavor_01_e_39:
    speaker: "<Self>"
    en: "?!"
    ko: "……?!?!"
    ja: "……！？！？"
  event_newflavor_01_e_40:
    speaker: "<Monologue>"
    en: "*Gag*"
    ko: 헛구역질이 올라온다.
    ja: 吐き気がした
  event_newflavor_01_e_41:
    speaker: "<Monologue>"
    en: This tastes nothing like it looks. It's... utterly vile.
    ko: 보기와는 다르게, 정말 끔찍한 맛이다.
    ja: |-
      見た目からは想像もつかない、
      身の毛がよだつほどひどい味だ
  event_newflavor_01_e_42:
    speaker: rapi
    en: Are you okay, Commander?
    ko: 지휘관, 괜찮으십니까?
    ja: 指揮官、大丈夫ですか？
  event_newflavor_01_e_43:
    speaker: bready
    en: You can spit it out.
    ko: 뱉어도 돼.
    ja: 吐き出していいわよ。
  event_newflavor_01_e_44:
    speaker: bready
    en: That's probably one of the bad dishes.
    ko: 그건 맛없는 음식일 테니까.
    ja: そっちはマズイはずだから。
  event_newflavor_01_e_45:
    speaker: "<Self>"
    en: "*Ptooey*! Urgh..."
    ko: 우욱… 퉤퉤….
    ja: ううっ…ペッ…
  event_newflavor_01_e_46:
    speaker: bready
    en: Mhmm.
    ko: 음.
    ja: うん。
  event_newflavor_01_e_47:
    speaker: bready
    en: I'd say that confirms it.
    ko: 이걸로 확실해졌네.
    ja: これではっきりしたわね。
  event_newflavor_01_e_48:
    speaker: "<Self>"
    en: "*Blech*... Confirms what?"
    ko: |-
      콜록, 콜록…!
      뭐가 말이야?
    ja: |-
      ゴホ、ゴホ…！
      何のことだ？
  event_newflavor_01_e_49:
    speaker: bready
    en: The taste of the food around here has definitely changed.
    ko: 음식 맛이 이상해졌어.
    ja: 食材の味がおかしくなってるわ。
  event_newflavor_01_e_50:
    speaker: bready
    en: To be more specific,
    ko: 정확히 말하자면….
    ja: 正確に言うと…
  event_newflavor_01_e_51:
    speaker: bready
    en: Any Splendamin-based dishes that were manufactured this month are what seem
      to have been affected.
    ko: |-
      제조 일자가 이번 달 이후인 퍼펙트로 만들어진 음식들의 맛이
      이상해졌어.
    ja: |-
      今月以降に製造されてる
      パーフェクトの味がおかしいみたいね。
  event_newflavor_01_e_52:
    speaker: crust
    en: The first lunchbox was made with ingredients delivered prior to this month.
    ko: 첫 번째 도시락은, 그전에 납품받았던 재료들로 만들었구요.
    ja: |-
      最初のお弁当は、
      その前に手に入れた食材で作ってます。
  event_newflavor_01_e_53:
    speaker: crust
    en: The second used ingredients that were delivered today.
    ko: 두 번째 도시락은, 오늘 납품 받은 재료들로 만들었거든요.
    ja: |-
      2つ目のお弁当は、
      今日手に入れた食材で作ったんです。
  event_newflavor_01_e_54:
    speaker: "<Self>"
    en: Why has the taste suddenly changed?
    ko: 갑자기 왜 맛이 이상해진 거야?
    ja: なぜ急にそんなことが？
  event_newflavor_01_e_55:
    speaker: bready
    en: We're not entirely sure yet.
    ko: 우리도 자세한 사정은 잘 몰라.
    ja: 私たちにも詳しい事情は分かってないわ。
  event_newflavor_01_e_56:
    speaker: bready
    en: But considering this involves the Ark's food supply, it's imperative that
      we figure it out, and soon.
    ko: 그래도 방주의 식량이 걸린 문제니까, 금방 괜찮아질 거야.
    ja: |-
      でも、食べ物に関する問題だから
      すぐに解決されるはずよ。
  event_newflavor_01_e_57:
    speaker: crust
    en: All right,
    ko: 자~ 그럼!
    ja: さてと、それでは！
  event_newflavor_01_e_58:
    speaker: crust
    en: now that we've identified the issue, it's time to find a solution.
    ko: 이제 확인은 했으니, 대안을 찾아야 할 차례네요!
    ja: 確認も終わったので、次は対策探しです！
  event_newflavor_01_e_59:
    speaker: "<Self>"
    en: And how are you going to do that?
    ko: 어떻게 할 건데?
    ja: どうするんだ？
  event_newflavor_01_e_60:
    speaker: crust
    en: By using any and all means available to us.
    ko: 저희가 할 수 있는 일을 할 거예요~!
    ja: 私たちにできることをします！
  event_newflavor_01_e_61:
    speaker: bready
    en: We'll issue a recall on the affected items and raise awareness as to what's
      happening.
    ko: 회수를 하고, 주의를 주는 거죠.
    ja: 回収と、注意喚起ね。
  event_newflavor_01_e_62:
    speaker: crust
    en: |-
      Restaurants and supermarkets keep detailed records of manufacturing dates and suppliers,
      so it should be relatively easy for them to recall their stock.
    ko: |-
      음식점이나 마트는 재료 제조 일자를 다 알고 있고,
      어디서 납품받는지만 확인하면 회수하기가 쉬운데요.
    ja: |-
