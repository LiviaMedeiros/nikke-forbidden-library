---
d_nikke_arkrangerblack_01:
  d_nikke_arkrangerblack_01_1:
    speaker: "<Monologue>"
    en: After dropping off my report at the Central Government office, I head out.
    ko: 중앙 정부 사무소에 보고서를 제출하고 나왔다.
    ja: 中央政府の事務所に報告書を提出し、外へ出た
  d_nikke_arkrangerblack_01_2:
    speaker: "<Self>"
    en: Now that the report's done, I can finally make my way back to the Commander's
      Room...
    ko: 보고서 제출도 끝났으니 이제 지휘관실로….
    ja: 用事も済ませたし、指揮官室に…
  d_nikke_arkrangerblack_01_3:
    speaker: "<Monologue>"
    en: Suddenly, a familiar face catches my eye.
    ko: 낯익은 누군가가 눈에 띄었다.
    ja: すると、見覚えのある人物が視界に入った
  d_nikke_arkrangerblack_01_4:
    speaker: "<Self>"
    en: Black?
    ko: 블랙?
    ja: ブラック？
  d_nikke_arkrangerblack_01_5:
    speaker: arkrangerblack
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_arkrangerblack_01_6:
    speaker: arkrangerblack
    en: Ah, @UserName.
    ko: 아, @UserName.
    ja: ああ、@UserNameか。
  d_nikke_arkrangerblack_01_7:
    speaker: arkrangerblack
    en: It's been a while.
    ko: 오랜만이군.
    ja: 久しぶりだな。
  d_nikke_arkrangerblack_01_8:
    speaker: arkrangerblack
    en: Are you coming from the Central Government office?
    ko: 중앙 정부 사무소에서 오는 길인가?
    ja: 中央政府に用があったのか？
  d_nikke_arkrangerblack_01_9:
    speaker: "<Self>"
    en: Yeah. I had a backlog of paperwork to turn in.
    ko: 응. 보고할 서류가 좀 쌓였었거든.
    ja: ああ、溜まった書類を提出しにな
  d_nikke_arkrangerblack_01_10:
    speaker: arkrangerblack
    en: I see.
    ko: 그렇군.
    ja: そうか。
  d_nikke_arkrangerblack_01_11:
    speaker: arkrangerblack
    en: You look really worn out though.
    ko: 그런데 뭔가 많이 피곤해 보인다.
    ja: なんだか疲れているように見えるな。
  d_nikke_arkrangerblack_01_12:
    speaker: "<Self>"
    en: Really?
    ko: 그래?
    ja: そうか？
  d_nikke_arkrangerblack_01_13:
    speaker: arkrangerblack
    en: You've got dark circles under your eyes.
    ko: 눈 주변이 어두워 보이는군.
    ja: 目のクマが濃い。
  d_nikke_arkrangerblack_01_14:
    speaker: "<Self>"
    en: Guess I've been running myself ragged lately...
    ko: 한동안 바빠서 피곤했나 보네….
    ja: しばらく忙しかったからな…
  d_nikke_arkrangerblack_01_15:
    speaker: arkrangerblack
    en: Maybe you should get some rest?
    ko: 좀 쉬는 게 좋지 않겠나?
    ja: 少し休んだ方がいいのではないか？
  d_nikke_arkrangerblack_01_16:
    speaker: "<Self>"
    en: No, I'm in the mood for a walk. It's been a while.
    ko: 아니, 간만에 좀 돌아다니고 싶은 기분이야.
    ja: いや、久しぶりに少し歩こうと思っている
  d_nikke_arkrangerblack_01_17:
    speaker: arkrangerblack
    en: I suppose a walk could help you unwind as well...
    ko: 산책도 휴식에 도움이 되긴 하니까….
    ja: 確かに、散歩も息抜きにはなるか…
  d_nikke_arkrangerblack_01_18:
    speaker: arkrangerblack
    en: A light stroll around the Ark will probably help you sleep better tonight.
    ko: 가볍게 방주를 돌아다니다 보면, 저녁에 잠도 잘 올 거다.
    ja: |-
      アークを散策すれば、
      夜にはぐっすり眠れるだろう。
  d_nikke_arkrangerblack_01_19:
    speaker: "<Self>"
    en: You're probably right.
    ko: 그렇겠지?
    ja: そうだな
  d_nikke_arkrangerblack_01_20:
    speaker: arkrangerblack
    en: I don't know if saying this will bring you much comfort,
    ko: 이런 말을 한다고 해서 힘이 될지는 모르겠다만….
    ja: こんな言葉が力になるか分からないが…
  d_nikke_arkrangerblack_01_21:
    speaker: arkrangerblack
    en: but I know you've been carrying a lot on your shoulders, fighting on the battlefield
      while keeping up with all the paperwork on top of it.
    ko: 전투도 나서야 하고, 사무 업무도 해야 해서 고생이 많은 건 알고 있다.
    ja: 戦闘や事務処理に追われ、大変だろう。
  d_nikke_arkrangerblack_01_22:
    speaker: arkrangerblack
    en: I'm always rooting for you, @UserName.
    ko: 나는 항상 @UserName, 널 응원하고 있다.
    ja: |-
      私はいつも@UserNameを
      応援している。
  d_nikke_arkrangerblack_01_23:
    speaker: arkrangerblack
    en: And I doubt I'm the only one.
    ko: 아마 나뿐만이 아니겠지.
    ja: 私だけではなく…
  d_nikke_arkrangerblack_01_24:
    speaker: arkrangerblack
    en: You've got plenty of people rooting for you.
    ko: 많은 사람들이 응원하고 있을 거다.
    ja: 多くの人々が応援しているはずだ。
  d_nikke_arkrangerblack_01_25:
    speaker: "<Self>"
    en: Thanks. That really means a lot.
    ko: 고마워. 충분히 힘이 돼.
    ja: ありがとう。おかげで元気が出た
  d_nikke_arkrangerblack_01_26:
    speaker: arkrangerblack
    en: Is that so?
    ko: 그런가.
    ja: そうか。
  d_nikke_arkrangerblack_01_27:
    speaker: arkrangerblack
    en: I'm glad you feel that way.
    ko: 그렇게 생각해 줘서 다행이군.
    ja: それならよかった。
  d_nikke_arkrangerblack_01_28:
    speaker: arkrangerblack
    en: Well, I should get going...
    ko: 그럼 나는 이만….
    ja: では、私はこれで…
  d_nikke_arkrangerblack_01_29:
    speaker: arkrangerblack
    en: Actually, wait a moment.
    ko: 아니, 잠깐만 기다려다오.
    ja: "…いや、ちょっと待ってくれ。"
  d_nikke_arkrangerblack_01_30:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_arkrangerblack_01_31:
    speaker: arkrangerblack
    en: I'm about to start my patrol of the Ark.
    ko: 나는 지금 방주 순찰을 돌러 가는 길이다.
    ja: |-
      今、アークのパトロールに
      向かうところだったんだ。
  d_nikke_arkrangerblack_01_32:
    speaker: "<Self>"
    en: Why do you patrol the Ark anyway?
    ko: 왜 블랙이 방주를 순찰해?
    ja: なぜブラックがアークのパトロールを？
  d_nikke_arkrangerblack_01_33:
    speaker: arkrangerblack
    en: There may be people out there who need a hero's help, yet aren't in a position
      to ask for it.
    ko: 히어로의 도움을 바라는 사람이, 도움을 요청할 수 있는 상황이 아닐 수도 있으니까.
    ja: |-
      ヒーローの助けを必要とする人々が、
      いつも声を上げられるとは限らない。
  d_nikke_arkrangerblack_01_34:
    speaker: arkrangerblack
    en: So I need to keep an eye on every corner of the Ark, from the places in plain
      sight, to the ones people rarely notice.
    ko: 눈에 띄는 곳부터 쉽게 눈이 닿지 않는 곳까지, 구석구석 살필 필요가 있지.
    ja: |-
      目につく場所から、目立たない場所…
      すべてを確認する必要があるんだ。
  d_nikke_arkrangerblack_01_35:
    speaker: arkrangerblack
    en: That's all part of a hero's duty.
    ko: 그것까지도 히어로의 역할이니까.
    ja: それもヒーローの務め。
  d_nikke_arkrangerblack_01_36:
    speaker: "<Self>"
    en: Ah, I see.
    ko: 아, 그렇구나.
    ja: そうなのか…
  d_nikke_arkrangerblack_01_37:
    speaker: arkrangerblack
    en: So, I was thinking...
    ko: 그래서 말인데.
    ja: そういうわけで…
  d_nikke_arkrangerblack_01_38:
    speaker: arkrangerblack
    en: Would you care to join me, @UserName?
    ko: 혹시 @UserName도 같이 돌아볼 생각 없나?
    ja: "@UserNameも一緒に行かないか？"
  d_nikke_arkrangerblack_01_39:
    speaker: "<Self>"
    en: You want me to go on an Ark patrol?
    ko: 내가 방주 순찰을?
    ja: 私がアークのパトロールに？
  d_nikke_arkrangerblack_01_40:
    speaker: arkrangerblack
    en: Yes.
    ko: 그래.
    ja: そうだ。
  d_nikke_arkrangerblack_01_41:
    speaker: arkrangerblack
    en: I've been wanting to do some heroic work with you for some time now.
    ko: 예전부터 너와 함께 히어로 활동을 해보고 싶다는 생각이 있었다.
    ja: |-
      以前から、君と一緒に
      ヒーローとしての活動を
      行ってみたいと思っていた。
  d_nikke_arkrangerblack_01_42:
    speaker: arkrangerblack
    en: And since we'd be on patrol, it'd double nicely as your walk.
    ko: 순찰을 하며 가볍게 돌아다닐 수 있으니, 산책도 되겠지.
    ja: |-
      パトロールをしながら歩き回ることになる。
      散歩にもなるだろう。
  d_nikke_arkrangerblack_01_43:
    speaker: "<Self>"
    en: Okay, let's go.
    ko: 좋아, 같이 가자.
    ja: |-
      そうだな…
      分かった、一緒に行こう
  d_nikke_arkrangerblack_01_44:
    speaker: arkrangerblack
    en: Thanks.
    ko: 고맙다.
    ja: ありがとう。
  d_nikke_arkrangerblack_01_45:
    speaker: arkrangerblack
    en: Having the hero of the Ark by my side...
    ko: 방주의 영웅이 함께 해준다니.
    ja: アークの英雄が一緒とは。
  d_nikke_arkrangerblack_01_46:
    speaker: arkrangerblack
    en: I couldn't ask for a better partner.
    ko: 이보다 든든한 일은 없겠지.
    ja: これほど心強いことはない。
  d_nikke_arkrangerblack_01_47:
    speaker: arkrangerblack
    en: Let's be on our way, then.
    ko: 그럼 출발하도록 하겠다.
    ja: では、出発しよう。
  d_nikke_arkrangerblack_01_48:
    speaker: "<Monologue>"
    en: I follow Ark Ranger Black as she leads the way.
    ko: 나는 앞장서는 아크레인저 블랙의 뒤를 따라나섰다.
    ja: |-
      私は前を歩くアークレンジャー・ブラックの
      後に続いた
  d_nikke_arkrangerblack_01_49:
    speaker: "<Self>"
    en: By the way, which areas are we covering?
    ko: 그런데 어디부터 어디까지 순찰하는 거야?
    ja: |-
      ところで、どこからどこまで
      パトロールするつもりなんだ？
  d_nikke_arkrangerblack_01_50:
    speaker: arkrangerblack
    en: There's only so much ground I can cover in a single patrol.
    ko: 한 번 순찰을 나올 때 볼 수 있는 곳은 한정적이다.
    ja: |-
      一度に見て回ることができる場所は
      限られている。
  d_nikke_arkrangerblack_01_51:
    speaker: arkrangerblack
    en: After all, I can only be in one place at a time.
    ko: 아무리 그래도 내 몸은 하나니까 말이지.
    ja: 私の身体は一つしかないからな。
  d_nikke_arkrangerblack_01_52:
    speaker: arkrangerblack
    en: So I can't say exactly where we'll end up.
    ko: 그래서 어디까지라고 단정해서 말하기는 어렵다.
    ja: よって、範囲を決めるのは難しい。
  d_nikke_arkrangerblack_01_53:
    speaker: "<Self>"
    en: Fair enough...
    ko: 그렇겠네….
    ja: それもそうか…
  d_nikke_arkrangerblack_01_54:
    speaker: arkrangerblack
    en: Besides, what matters isn't how many places we cover, but how thoroughly we
      check them.
    ko: 그리고 얼마나 많은 곳을 둘러보는지보다는, 얼마나 자세히 둘러보는지가 중요해.
    ja: |-
      そして、多くの場所へ行くことよりも、
      しっかりと見回ることのほうが大切だ。
  d_nikke_arkrangerblack_01_55:
    speaker: arkrangerblack
    en: Carefully and meticulously.
    ko: 철저히, 그리고 꼼꼼하게.
    ja: 徹底的に、そして丁寧に。
  d_nikke_arkrangerblack_01_56:
    speaker: arkrangerblack
    en: I hope you'll keep that in mind.
    ko: 명심해주면 좋겠다.
    ja: 肝に銘じてほしい。
  d_nikke_arkrangerblack_01_57:
    speaker: "<Self>"
    en: Got it. You can count on me.
    ko: 응, 맡겨만 줘.
    ja: ああ、任せてくれ
  d_nikke_arkrangerblack_01_58:
    speaker: arkrangerblack
    en: "... Honestly, just looking at you puts me at ease."
    ko: "…정말, 보기만 해도 믿음이 가는 표정이군."
    ja: "…本当に、頼もしいな。"
  d_nikke_arkrangerblack_01_59:
    speaker: arkrangerblack
    en: Now then, shall we?
    ko: 그럼 이제 정말 출발하도록 할까?
    ja: では、さっそく出発しようか。
d_nikke_arkrangerblack_02:
  d_nikke_arkrangerblack_02_1:
    speaker: "<Narration>"
    en: "*Creeeak*"
    ko: 끼익-
    ja: キィ…
  d_nikke_arkrangerblack_02_2:
    speaker: "<Monologue>"
    en: Ark Ranger Black lifts the lid of a large dumpster in a back alley and peers
      inside.
    ko: 아크레인저 블랙이 뒷골목의 큰 쓰레기통을 열어 보고 있다.
    ja: |-
      アークレンジャー・ブラックは裏通りの
      大きなゴミ箱を開けて中をのぞきこんでいる
  d_nikke_arkrangerblack_02_3:
    speaker: arkrangerblack
    en: Everything seems fine here too.
    ko: 여기도 문제는 없군.
    ja: ここも異常なし。
  d_nikke_arkrangerblack_02_4:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arkrangerblack_02_5:
    speaker: arkrangerblack
    en: No issues here either.
    ko: 이곳에는 이상이 없어 보인다.
    ja: 特に問題はないようだ。
  d_nikke_arkrangerblack_02_6:
    speaker: arkrangerblack
    en: Let's head a little further in.
    ko: 좀 더 깊숙한 곳으로 들어가도록 할까.
    ja: もう少し奥へ行こう。
  d_nikke_arkrangerblack_02_7:
    speaker: "<Self>"
    en: Hey, Black.
    ko: 저기, 블랙.
    ja: あの、ブラック…
  d_nikke_arkrangerblack_02_8:
    speaker: arkrangerblack
    en: What is it?
    ko: 무슨 일이지?
    ja: どうかしたか？
  d_nikke_arkrangerblack_02_9:
    speaker: "<Self>"
    en: This is supposed to be a patrol, right?
    ko: 이거 순찰 맞지…?
    ja: これは…パトロールなのか？
  d_nikke_arkrangerblack_02_10:
    speaker: arkrangerblack
    en: It is.
    ko: 그렇다.
    ja: そうだ。
  d_nikke_arkrangerblack_02_11:
    speaker: arkrangerblack
    en: Is something wrong?
    ko: 무슨 문제라도 있나?
    ja: 何か問題が？
  d_nikke_arkrangerblack_02_12:
    speaker: "<Self>"
    en: I thought we'd be patrolling places people actually go.
    ko: 뭔가 사람들이 돌아다니는 곳을 둘러본다고 생각했거든.
    ja: |-
      もっと人通りの多い場所を
      見て回るのかと思っていた
  d_nikke_arkrangerblack_02_13:
    speaker: arkrangerblack
    en: Keeping an eye on places people frequent is vital, of course.
    ko: 사람들이 돌아다니는 곳을 둘러보는 건 중요하지.
    ja: それも大事なことだろう。
  d_nikke_arkrangerblack_02_14:
    speaker: arkrangerblack
    en: But checking places people rarely visit is just as important.
    ko: 하지만 인적이 드문 곳을 확인하는 것도 중요하다.
    ja: |-
      しかし、人通りが少ない場所を
      確認することも重要なんだ。
  d_nikke_arkrangerblack_02_15:
    speaker: arkrangerblack
    en: What if troublemakers are lurking around in back alleys?
    ko: 뒷골목에 불량배들이 진을 치고 있지는 않은가.
    ja: |-
      裏通りで、ならず者たちが
      たむろしていないか。
  d_nikke_arkrangerblack_02_16:
    speaker: arkrangerblack
    en: Or what if something suspicious has been left somewhere people wouldn't think
      to look?
    ko: 사람들이 확인하기 어려운 곳에 수상한 물건은 없는가.
    ja: 人々が確認しにくい場所に、怪しい物はないか。
  d_nikke_arkrangerblack_02_17:
    speaker: arkrangerblack
    en: Today's patrol is about looking into things that are easy to overlook.
    ko: 이렇게 놓치기 쉬운 것들을 보는 게, 오늘 하는 방주 순찰의 목적이다.
    ja: |-
      そういう見逃しやすい場所を確認することが、
      今日のパトロールの目的だ。
  d_nikke_arkrangerblack_02_18:
    speaker: arkrangerblack
    en: Like this, for example.
    ko: 지금 이것도 그렇지.
    ja: これもその一環なんだ。
  d_nikke_arkrangerblack_02_19:
    speaker: "<Narration>"
    en: "*Thunk*"
    ko: 텅-
    ja: パタンッ――
  d_nikke_arkrangerblack_02_20:
    speaker: "<Monologue>"
    en: Ark Ranger Black closes the lid of the dumpster.
    ko: 아크레인저 블랙이 쓰레기통 뚜껑을 닫았다.
    ja: ブラックは、ゴミ箱のフタを閉じた
  d_nikke_arkrangerblack_02_21:
    speaker: arkrangerblack
    en: Dumpsters in back alleys like these...
    ko: 평소엔 들여다보기 어려운 이런 뒷골목의 쓰레기통.
    ja: |-
      普段はなかなか見ることはない
      裏通りのゴミ箱の中。
  d_nikke_arkrangerblack_02_22:
    speaker: arkrangerblack
    en: Most people wouldn't think to check them.
    ko: 이런 걸 일반인들이 평소에 잘 살펴보는 일은 없지.
    ja: |-
      一般人が確認することなど、
      めったにないだろう。
  d_nikke_arkrangerblack_02_23:
    speaker: arkrangerblack
    en: That's exactly why we need to check the places people tend to overlook while
      we're on patrol today.
    ko: 그렇기 때문에 오늘 우리가 순찰하면서, 일반적으로 확인하기 어려운 곳들을 확인해야 한다.
    ja: |-
      だからこそ、私たちがパトロールを行い、
      安全を確認する必要があるんだ。
  d_nikke_arkrangerblack_02_24:
    speaker: "<Self>"
    en: Well, if you put it that way...
    ko: 뭐, 그런 이유라면….
    ja: まぁ、そういうことなら…
  d_nikke_arkrangerblack_02_25:
    speaker: arkrangerblack
    en: And besides, you never know.
    ko: 그리고 또 혹시 모르지.
    ja: それに、もしかしたら…
  d_nikke_arkrangerblack_02_26:
    speaker: arkrangerblack
    en: There could be a lost cat hiding in one of these dumpsters.
    ko: 길 잃은 고양이가 쓰레기통에 숨어 있을지도 모르는 일 아닌가.
    ja: 迷子のネコがゴミ箱に隠れているかもしれない。
  d_nikke_arkrangerblack_02_27:
    speaker: "<Self>"
    en: Have you ever actually found a cat hiding in a dumpster before?
    ko: 블랙은 쓰레기통에서 고양이를 찾은 적이 있어?
    ja: ゴミ箱でネコを見つけたことがあるのか？
  d_nikke_arkrangerblack_02_28:
    speaker: arkrangerblack
    en: No, I have not.
    ko: 아니, 없다.
    ja: いや、ない。
  d_nikke_arkrangerblack_02_29:
    speaker: arkrangerblack
    en: But I look anyway, because anything is possible.
    ko: 하지만 그럴 수도 있다는 생각으로 찾고 있다.
    ja: しかし、可能性はゼロではないと思っている。
  d_nikke_arkrangerblack_02_30:
    speaker: arkrangerblack
    en: That's what patrols are all about. Operating on the assumption that even the
      most unlikely thing could happen.
    ko: 순찰이라는 건 만에 하나, 억에 하나를 가정하고 돌아다니는 거니까.
    ja: |-
      パトロールというものは、
      「万が一」や「億が一」を想定しながら
      行うものだからな。
  d_nikke_arkrangerblack_02_31:
    speaker: arkrangerblack
    en: Now then, let's continue our patrol.
    ko: 그러면 순찰을 마저 하도록 하지.
    ja: さあ、パトロールを続けよう。
  d_nikke_arkrangerblack_02_32:
    speaker: arkrangerblack
    en: I'll take the left.
    ko: 나는 골목길 왼편을 살펴보도록 하겠다.
    ja: 私は道の左側を確認する。
  d_nikke_arkrangerblack_02_33:
    speaker: arkrangerblack
    en: "@UserName, you take the right."
    ko: 오른쪽은 @UserName, 네게 부탁한다.
    ja: "@UserNameは右側を頼む。"
  d_nikke_arkrangerblack_02_34:
    speaker: "<Self>"
    en: Got it.
    ko: 알았어.
    ja: 分かった
  d_nikke_arkrangerblack_02_35:
    speaker: "<Monologue>"
    en: I follow Ark Ranger Black deeper into the alley.
    ko: 아크레인저 블랙을 따라 뒷골목 더 깊숙한 곳으로 갔다.
    ja: |-
      ブラックの後に続き、
      裏通りをさらに奥へ進んだ
  d_nikke_arkrangerblack_02_36:
    speaker: "<Monologue>"
    en: Then I start going through the dumpsters along the right side.
    ko: 그리고 오른편에 있는 쓰레기통을 뒤지기 시작했다.
    ja: そして右側にあるゴミ箱を確認したところ…
  d_nikke_arkrangerblack_02_37:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭-
    ja: ガサッ――
  d_nikke_arkrangerblack_02_38:
    speaker: "<Monologue>"
    en: Something wriggles inside the dumpster I'm rummaging through.
    ko: 뒤지고 있던 쓰레기통에서 무언가 꿈틀거렸다.
    ja: ゴミ箱の中で、何かが動いているのが見えた
  d_nikke_arkrangerblack_02_39:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_arkrangerblack_02_40:
    speaker: cat
    en: "*Meow*"
    ko: 에오옭!
    ja: ウニャー！
  d_nikke_arkrangerblack_02_41:
    speaker: "<Self>"
    en: B-Black!
    ko: 브, 블랙!
    ja: ブ、ブラック！
  d_nikke_arkrangerblack_02_42:
    speaker: arkrangerblack
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_arkrangerblack_02_43:
    speaker: "<Self>"
    en: There's a black cat hiding in here!
    ko: 검은 고양이가 숨어 있어!
    ja: 黒いネコがいる！
  d_nikke_arkrangerblack_02_44:
    speaker: arkrangerblack
    en: Did you say a cat?
    ko: 고양이라고?
    ja: ネコだと？
  d_nikke_arkrangerblack_02_45:
    speaker: "<Monologue>"
    en: Ark Ranger Black walks over to the dumpster I'm at.
    ko: 아크레인저 블랙이 내가 뒤지고 있던 쓰레기통으로 다가왔다.
    ja: ブラックは私が確認していたゴミ箱に近づいた
  d_nikke_arkrangerblack_02_46:
    speaker: cat
    en: "*Meow*"
    ko: 애옹!
    ja: ニャオ～ン！
  d_nikke_arkrangerblack_02_47:
    speaker: arkrangerblack
    en: It really is a cat...
    ko: 정말로 고양이를 찾다니….
    ja: 本当にネコを見つけるとは…
  d_nikke_arkrangerblack_02_48:
    speaker: arkrangerblack
    en: I've been through these alleys countless times, but this is the first time
      I've actually found one.
    ko: 지금까지 수도 없이 뒷골목 순찰을 다녔지만, 고양이를 본 건 이번이 처음이다.
    ja: |-
      今まで数え切れないほど
      裏通りをパトロールしてきたが、
      ネコを見つけたのは今回が初めてだ。
  d_nikke_arkrangerblack_02_49:
    speaker: arkrangerblack
    en: Does it have a collar?
    ko: 혹시 고양이에게 인식표는 붙어 있나?
    ja: 認識票はあるか？
  d_nikke_arkrangerblack_02_50:
    speaker: "<Monologue>"
    en: I look the cat over.
    ko: 고양이의 몸을 살펴보았다.
    ja: 私はネコの体を確認した
  d_nikke_arkrangerblack_02_51:
    speaker: "<Self>"
    en: No, I don't see anything.
    ko: 아니, 몸에 붙어 있는 건 없어.
    ja: いや、何もついていないようだ
  d_nikke_arkrangerblack_02_52:
    speaker: arkrangerblack
    en: So it's not a lost cat then?
    ko: "…누군가 잃어버린 고양이는 아니라는 뜻인가."
    ja: "…飼い主がいるわけではないのか。"
  d_nikke_arkrangerblack_02_53:
    speaker: cat
    en: "*Meow*"
    ko: 애오옹!
    ja: ニャオン！
  d_nikke_arkrangerblack_02_54:
    speaker: arkrangerblack
    en: Hmm?
    ko: 음?
    ja: ん？
  d_nikke_arkrangerblack_02_55:
    speaker: "<Monologue>"
    en: The cat rubs itself against Ark Ranger Black's leg.
    ko: 고양이가 아크레인저 블랙의 다리에 몸을 비볐다.
    ja: ネコはブラックの足に体をすり寄せた
  d_nikke_arkrangerblack_02_56:
    speaker: arkrangerblack
    en: Why is it doing that?
    ko: 갑자기 고양이가 왜 이러는 거지?
    ja: 急にどうしたんだ？
  d_nikke_arkrangerblack_02_57:
    speaker: "<Self>"
    en: Looks like it likes you.
    ko: 블랙이 마음에 든 모양이네.
    ja: ブラックのことが気に入ったようだ
  d_nikke_arkrangerblack_02_58:
    speaker: arkrangerblack
    en: That's strange.
    ko: 그건 이상하군.
    ja: それは妙だな。
  d_nikke_arkrangerblack_02_59:
    speaker: arkrangerblack
    en: I haven't done a thing for it.
    ko: 난 이 고양이에게 뭔가 해준 게 없다.
    ja: 私はこのネコに何もしてあげていない。
  d_nikke_arkrangerblack_02_60:
    speaker: arkrangerblack
    en: Besides, you're the one who found it.
    ko: 고양이를 찾아낸 것도 @UserName인데.
    ja: 見つけたのも@UserNameだ。
  d_nikke_arkrangerblack_02_61:
    speaker: "<Monologue>"
    en: The cat reaches out toward Ark Ranger Black, pawing at the air.
    ko: 고양이가 아크레인저 블랙을 향해 앞발을 허공에 휘두른다.
    ja: |-
      ネコはブラックに向かって
      前足をあげた
  d_nikke_arkrangerblack_02_62:
    speaker: arkrangerblack
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_arkrangerblack_02_63:
    speaker: arkrangerblack
    en: This cat is behaving rather strangely.
    ko: 고양이가 수상한 행동을 하기 시작했다.
    ja: おかしな行動だ…
  d_nikke_arkrangerblack_02_64:
    speaker: "<Self>"
    en: I think it wants you to pick it up.
    ko: 안아달라는 것 같은데?
    ja: 抱っこしてほしいんじゃないか？
  d_nikke_arkrangerblack_02_65:
    speaker: arkrangerblack
    en: "... You think?"
    ko: 안아… 달라고?
    ja: 抱っこ…？
  d_nikke_arkrangerblack_02_66:
    speaker: "<Monologue>"
    en: Ark Ranger Black carefully lifts the cat into her arms.
    ko: 아크레인저 블랙이 고양이를 품에 안아 올리자,
    ja: ブラックがネコを抱きかかえると、
  d_nikke_arkrangerblack_02_67:
    speaker: "<Monologue>"
    en: The cat curls up and quietly settles into Ark Ranger Black's embrace.
    ko: 고양이는 몸을 말고 아크레인저 블랙의 품에 조용히 안겼다.
    ja: ネコは静かに彼女に身を委ねた
  d_nikke_arkrangerblack_02_68:
    speaker: arkrangerblack
    en: I think it's asleep.
    ko: "…잠든 것 같군."
    ja: "…眠ったようだ。"
  d_nikke_arkrangerblack_02_69:
    speaker: "<Self>"
    en: It looks cute sleeping like that.
    ko: 잠든 모습이 귀엽네.
    ja: 寝顔もかわいいな
  d_nikke_arkrangerblack_02_70:
    speaker: arkrangerblack
    en: It does.
    ko: 그래.
    ja: ああ。
  d_nikke_arkrangerblack_02_71:
    speaker: arkrangerblack
    en: But we can't leave things as they are.
    ko: 하지만 그렇다고 이대로 있을 수는 없다.
    ja: |-
      しかし、だからといって
      このままではいられない。
  d_nikke_arkrangerblack_02_72:
    speaker: arkrangerblack
    en: The proper procedure is to report that we've found it.
    ko: 고양이를 찾았으면 신고하는 것이 규칙이니까.
    ja: ネコを発見したら通報するのが規則だ。
  d_nikke_arkrangerblack_02_73:
    speaker: "<Self>"
    en: I'll take care of that.
    ko: 그건 내가 할게.
    ja: それは私に任せてくれ
  d_nikke_arkrangerblack_02_74:
    speaker: arkrangerblack
    en: Very well.
    ko: 알겠다.
    ja: 分かった、頼む。
  d_nikke_arkrangerblack_02_75:
    speaker: "<Monologue>"
    en: Using my phone, I call in an animal report to the A.C.P.U.
    ko: 나는 핸드폰으로 A.C.P.U.에 동물 신고를 했다.
    ja: 私は携帯電話でA.C.P.U.に連絡をした
  d_nikke_arkrangerblack_02_76:
    speaker: "<Monologue>"
    en: While we wait for the A.C.P.U. to arrive, Ark Ranger Black gently pets the
      cat with a soft smile.
    ko: 그리고 A.C.P.U.가 출동하기 전까지, 아크레인저 블랙은 부드러운 미소로 고양이를 쓰다듬어 주었다.
    ja: |-
      A.C.P.U.が到着するまで、
      アークレンジャー・ブラックは優しい笑顔で
      ネコをなでていた
  d_nikke_arkrangerblack_02_77:
    speaker: "<Narration>"
    en: A little later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_arkrangerblack_02_78:
    speaker: poli
    en: Thank you for reporting this.
    ko: 신고해 주셔서 감사해영.
    ja: ご連絡、ありがとうございますぅ。
  d_nikke_arkrangerblack_02_79:
    speaker: poli
    en: We'll contact the relevant department and make sure this kitty is well taken
      care of.
    ko: 그럼 이 고양이는 저희가 관련 부서와 연락해서 잘 보호하도록 할게영!
    ja: |-
      では、このネコは私たちが
      担当部署に連絡して保護しますねぇ！
  d_nikke_arkrangerblack_02_80:
    speaker: arkrangerblack
    en: We'll leave it in your capable hands.
    ko: 잘 부탁한다.
    ja: よろしく頼む。
  d_nikke_arkrangerblack_02_81:
    speaker: "<Monologue>"
    en: Poli places the cat into a carrier and takes off.
    ko: 폴리는 고양이를 켄넬에 넣어 돌아갔고,
    ja: |-
      ポリはネコをキャリーケースに入れて
      去っていった
  d_nikke_arkrangerblack_02_82:
    speaker: "<Monologue>"
    en: We watch her retreating back as she leaves.
    ko: 우리는 폴리가 가는 모습을 한동안 지켜보았다.
    ja: 私たちはポリの後ろ姿をしばらく眺めていた
  d_nikke_arkrangerblack_02_83:
    speaker: arkrangerblack
    en: I appreciate your help today, @UserName.
    ko: "@UserName, 오늘은 도와줘서 정말 고맙다."
    ja: "@UserName、今日は本当にありがとう。"
  d_nikke_arkrangerblack_02_84:
    speaker: arkrangerblack
    en: Thanks to you, we were able to help that cat.
    ko: 네 덕분에 한 마리의 고양이를 구할 수 있었다.
    ja: 君のおかげでネコを救うことができた。
  d_nikke_arkrangerblack_02_85:
    speaker: "<Self>"
    en: All I did was find a stray cat...
    ko: 그냥 소소하게 길고양이 한 마리를 찾았을 뿐인 건데, 뭐….
    ja: 野良ネコを1匹見つけただけだ
  d_nikke_arkrangerblack_02_86:
    speaker: "<Monologue>"
    en: Ark Ranger Black shakes her head.
    ko: 아크레인저 블랙이 고개를 저었다.
    ja: アークレンジャー・ブラックは首を横に振った
  d_nikke_arkrangerblack_02_87:
    speaker: arkrangerblack
    en: It's not so trivial as that.
    ko: 그저 소소하기만 한 일이 아니다.
    ja: 小さなことだと思うかもしれないが…
  d_nikke_arkrangerblack_02_88:
    speaker: arkrangerblack
    en: What seems like a small issue can turn into something much bigger later on.
    ko: 작은 일이라고 생각한 것이, 나중에 큰 일이 되기도 한다.
    ja: |-
      それがあとで、なにか
      大きなことに繋がることもある。
  d_nikke_arkrangerblack_02_89:
    speaker: arkrangerblack
    en: You should take pride in what we accomplished today.
    ko: 오늘 한 일에 자부심을 가져도 좋다.
    ja: 今日の成果を誇りに思うといい。
  d_nikke_arkrangerblack_02_90:
    speaker: "<Self>"
    en: Really?
    ko: 그래…?
    ja: そうだろうか…
  d_nikke_arkrangerblack_02_91:
    speaker: arkrangerblack
    en: Of course.
    ko: 물론이지.
    ja: ああ、そうだ。
  d_nikke_arkrangerblack_02_92:
    speaker: arkrangerblack
    en: Which is why...
    ko: 그래서 말이다만….
    ja: そういうわけで…
  d_nikke_arkrangerblack_02_93:
    speaker: arkrangerblack
    en: If you have time tomorrow, would you care to join me again?
    ko: 혹시 내일도 시간이 괜찮다면, 함께 해주지 않겠나?
    ja: 明日も時間があれば、一緒に活動をしないか？
  d_nikke_arkrangerblack_02_94:
    speaker: "<Self>"
    en: Sure. I'll make time for it.
    ko: 알았어, 시간 비워둘게.
    ja: ああ、時間を空けておく
  d_nikke_arkrangerblack_02_95:
    speaker: arkrangerblack
    en: Thanks.
    ko: 고맙다.
    ja: 感謝する。
  d_nikke_arkrangerblack_02_96:
    speaker: arkrangerblack
    en: Then let's finish the rest of today's patrol.
    ko: 그럼 오늘은 하던 순찰을 마저 끝내도록 하지.
    ja: では、パトロールを続けよう。
  d_nikke_arkrangerblack_02_97:
    speaker: arkrangerblack
    en: There are still plenty of places left for us to check.
    ko: 아직 우리가 둘러봐야 할 곳은 많으니까.
    ja: |-
      まだ私たちが確認すべき場所は
      たくさんあるからな。
  d_nikke_arkrangerblack_02_98:
    speaker: "<Monologue>"
    en: After finishing our patrol of the back alleys,
    ko: 그렇게 우리는 뒷골목 순찰을 마저 진행하고,
    ja: こうして私たちは裏通りのパトロールを続け…
  d_nikke_arkrangerblack_02_99:
    speaker: "<Monologue>"
    en: we part ways and agree to meet again tomorrow.
    ko: 내일 만날 약속을 한 뒤 헤어졌다.
    ja: 明日の約束をして別れた
d_nikke_arkrangerblack_03:
  d_nikke_arkrangerblack_03_1:
    speaker: "<Narration>"
    en: The following afternoon...
    ko: 다음 날 오후.
    ja: 翌日の午後
  d_nikke_arkrangerblack_03_2:
    speaker: "<Monologue>"
    en: I arrive at the park where I'd agreed to meet Ark Ranger Black.
    ko: 아크레인저 블랙과 약속한 공원에 도착했다.
    ja: |-
      アークレンジャー・ブラックと
      約束した公園に到着した
  d_nikke_arkrangerblack_03_3:
    speaker: arkrangerblack
    en: Oh, @UserName.
    ko: 아, @UserName.
    ja: "@UserName。"
  d_nikke_arkrangerblack_03_4:
    speaker: arkrangerblack
    en: Over here.
    ko: 이쪽이다.
    ja: こちらだ。
  d_nikke_arkrangerblack_03_5:
    speaker: "<Monologue>"
    en: I spot Ark Ranger Black standing beside a bench at the edge of the park.
    ko: 공원 한쪽 벤치 옆에서 아크레인저 블랙을 발견했다.
    ja: |-
      公園のベンチの脇に立っている
      アークレンジャー・ブラックを発見した
  d_nikke_arkrangerblack_03_6:
    speaker: "<Self>"
    en: Sorry, am I late?
    ko: 미안, 내가 좀 늦었지?
    ja: すまない、待たせたか？
  d_nikke_arkrangerblack_03_7:
    speaker: arkrangerblack
    en: No, you're right on time.
    ko: 아니, 정확하게 왔다.
    ja: いや、時間ぴったりだ。
  d_nikke_arkrangerblack_03_8:
    speaker: arkrangerblack
    en: I arrived a little early is all.
    ko: 내가 조금 일찍 와 있었을 뿐이지.
    ja: 私が少し早めに来ていただけだ。
  d_nikke_arkrangerblack_03_9:
    speaker: "<Monologue>"
    en: At Ark Ranger Black's feet sit several large trash bags.
    ko: 아크레인저 블랙의 발치엔 대용량 봉투 몇 장이 놓여 있었다.
    ja: |-
      アークレンジャー・ブラックの足元には
      大きな袋が数枚置いてあった
  d_nikke_arkrangerblack_03_10:
    speaker: "<Self>"
    en: What's all this?
    ko: 그런데 이건 뭐야?
    ja: ところで、それは？
  d_nikke_arkrangerblack_03_11:
    speaker: arkrangerblack
    en: Ah, these?
    ko: 아, 이거 말인가.
    ja: ああ、これか。
  d_nikke_arkrangerblack_03_12:
    speaker: arkrangerblack
    en: These are the supplies we'll need for today's heroic work.
    ko: 오늘의 히어로 활동에 필요한 장비다.
    ja: 今日の活動に必要な道具だ。
  d_nikke_arkrangerblack_03_13:
    speaker: arkrangerblack
    en: I prepared some for you as well.
    ko: "@UserName, 네 몫도 준비해 두었지."
    ja: 君の分も用意しておいた。
  d_nikke_arkrangerblack_03_14:
    speaker: "<Monologue>"
    en: Ark Ranger Black hands me one of the bags.
    ko: 아크레인저 블랙은 봉투 한 장을 내게 건넸다.
    ja: アークレンジャー・ブラックから袋を受け取った
  d_nikke_arkrangerblack_03_15:
    speaker: "<Self>"
    en: So we're picking up trash today?
    ko: 혹시 오늘 활동이 쓰레기 줍기야?
    ja: もしかして、今日の活動はゴミ拾いか？
  d_nikke_arkrangerblack_03_16:
    speaker: arkrangerblack
    en: We are.
    ko: 그렇다.
    ja: その通りだ。
  d_nikke_arkrangerblack_03_17:
    speaker: arkrangerblack
    en: The park will be crowded on the weekend.
    ko: 주말이 되면 공원에 사람이 많이 모일 거다.
    ja: 週末になれば、公園に大勢の人が集まるだろう。
  d_nikke_arkrangerblack_03_18:
    speaker: arkrangerblack
    en: It's best to clean things up beforehand.
    ko: 그 전에 한 번 정리해 두는 게 좋겠지.
    ja: その前に一度片づけておいた方がいい。
  d_nikke_arkrangerblack_03_19:
    speaker: "<Self>"
    en: Picking up trash counts as heroic work?
    ko: 쓰레기를 줍는 게 히어로 활동이라고?
    ja: ゴミ拾いもヒーローの活動なのか？
  d_nikke_arkrangerblack_03_20:
    speaker: arkrangerblack
    en: It does.
    ko: 그래.
    ja: ああ。
  d_nikke_arkrangerblack_03_21:
    speaker: arkrangerblack
    en: You can also immediately see the fruits of your labor. That's what I like
      about it.
    ko: 게다가 쓰레기를 줍는 건, 바로 내 행동의 결과물을 볼 수 있어서 좋다.
    ja: |-
      ゴミ拾いは、行動の結果が
      目に見えて分かるからいい。
  d_nikke_arkrangerblack_03_22:
    speaker: arkrangerblack
    en: Seeing the park become cleaner gives me a sense of accomplishment.
    ko: 깨끗해진 공원을 보고 있으면 뿌듯한 기분이 드니까.
    ja: |-
      きれいになった公園を見ていると、
      誇らしい気持ちになるんだ。
  d_nikke_arkrangerblack_03_23:
    speaker: "<Self>"
    en: I see...
    ko: 그렇구나….
    ja: そうか…
  d_nikke_arkrangerblack_03_24:
    speaker: arkrangerblack
    en: Well then, let's do our best today too.
    ko: 그럼 오늘도 잘 부탁한다.
    ja: では、今日もよろしく頼む。
  d_nikke_arkrangerblack_03_25:
    speaker: "<Monologue>"
    en: We walk around the park, picking up trash as we go.
    ko: 우리는 공원 곳곳을 돌아다니며 쓰레기를 줍고 다녔다.
    ja: 私たちは公園のゴミ拾いを始めた
  d_nikke_arkrangerblack_03_26:
    speaker: arkrangerblack
    en: This one's paper...
    ko: 이건 종이….
    ja: これは紙…
  d_nikke_arkrangerblack_03_27:
    speaker: arkrangerblack
    en: These need to be sorted into plastics and cans.
    ko: 이건 플라스틱이랑 캔으로 분리하면 되겠군.
    ja: これはプラスチックと缶に分類。
  d_nikke_arkrangerblack_03_28:
    speaker: "<Monologue>"
    en: Ark Ranger Black nimbly picks up the trash.
    ko: 아크레인저 블랙은 능숙하게 쓰레기를 줍고 있었다.
    ja: |-
      アークレンジャー・ブラックは、
      慣れた様子でゴミを拾っている
  d_nikke_arkrangerblack_03_29:
    speaker: "<Self>"
    en: Seems you come out to pick up trash pretty often.
    ko: 블랙은 자주 쓰레기를 주우러 오나 보네?
    ja: よくゴミを拾いに来るのか？
  d_nikke_arkrangerblack_03_30:
    speaker: arkrangerblack
    en: I wouldn't say "often."
    ko: 자주라고 할 정도는 아니다.
    ja: それほどではない。
  d_nikke_arkrangerblack_03_31:
    speaker: arkrangerblack
    en: Maybe once a week at most.
    ko: 공원 청소는 일주일에 많아야 한 번 정도니까.
    ja: 公園の掃除は、多くて一週間に一度ぐらいだな。
  d_nikke_arkrangerblack_03_32:
    speaker: arkrangerblack
    en: If I didn't have other commitments, I'd like to come by more oft...
    ko: 다른 일만 없다면 더 자주 오고 싶을….
    ja: 他の仕事がなければ、もっと頻繁に…
  d_nikke_arkrangerblack_03_33:
    speaker: "<Monologue>"
    en: Suddenly, Ark Ranger Black shifts her attention to beneath a bench.
    ko: 갑자기 아크레인저 블랙의 시선이 벤치 아래로 향했다.
    ja: |-
      突然、アークレンジャー・ブラックの視線が
      ベンチの下へ向けられた
  d_nikke_arkrangerblack_03_34:
    speaker: arkrangerblack
    en: There's something hidden under here.
    ko: 이런 게 벤치 아래에 숨어 있었군.
    ja: こんなものがベンチの下に隠れていたとは。
  d_nikke_arkrangerblack_03_35:
    speaker: "<Monologue>"
    en: A dusty plastic cup smeared with something sticky lies beneath the bench.
    ko: 벤치 아래에는 끈적한 액체와 먼지로 뒤덮인 플라스틱 컵이 있었다.
    ja: |-
      ベンチの下には、
      ベタベタした液体と砂ぼこりにまみれた
      プラスチックのコップがあった
  d_nikke_arkrangerblack_03_36:
    speaker: "<Monologue>"
    en: Ark Ranger Black picks it up by hand and drops it into the bag.
    ko: 아크레인저 블랙은 그것을 손으로 집어, 봉투에 넣었다.
    ja: |-
      アークレンジャー・ブラックは
      それを手で拾い、袋に入れた
  d_nikke_arkrangerblack_03_37:
    speaker: "<Self>"
    en: You're okay touching that with your bare hands?
    ko: 맨손으로 괜찮아?
    ja: 素手で大丈夫なのか？
  d_nikke_arkrangerblack_03_38:
    speaker: arkrangerblack
    en: Because my hands might get dirty?
    ko: 손이 더러워지니까 그런 건가?
    ja: 手が汚れるということか？
  d_nikke_arkrangerblack_03_39:
    speaker: "<Self>"
    en: Yeah.
    ko: 응.
    ja: ああ
  d_nikke_arkrangerblack_03_40:
    speaker: arkrangerblack
    en: Unfortunately, I didn't bring any tongs.
    ko: 안타깝게도 챙겨온 집게가 없다.
    ja: 残念ながら、トングを持ってこなかった。
  d_nikke_arkrangerblack_03_41:
    speaker: arkrangerblack
    en: If my hands get dirty, I'll wash them afterward. Simple as that.
    ko: 더러워진 것쯤이야 씻으면 그만이고.
    ja: 汚れたら洗えば済む話だ。
  d_nikke_arkrangerblack_03_42:
    speaker: arkrangerblack
    en: A hero shouldn't fret over a single piece of trash.
    ko: 히어로가 쓰레기 하나에 머뭇거릴 필요는 없지.
    ja: ヒーローがゴミ1つにためらう必要はない。
  d_nikke_arkrangerblack_03_43:
    speaker: arkrangerblack
    en: Hmm...?
    ko: "…음?"
    ja: "…ん？"
  d_nikke_arkrangerblack_03_44:
    speaker: arkrangerblack
    en: There's more trash over there.
    ko: 저기에도 쓰레기가 있군.
    ja: あそこにもあるな。
  d_nikke_arkrangerblack_03_45:
    speaker: "<Monologue>"
    en: Ark Ranger Black walks over to a trash can beside a vending machine and picks
      up a plastic bottle.
    ko: 아크레인저 블랙은 자판기 옆의 쓰레기통으로 향해, 페트병을 하나 주웠다.
    ja: |-
      アークレンジャー・ブラックは
      自動販売機の隣にあるゴミ箱に向かい、
      ペットボトルを拾った
  d_nikke_arkrangerblack_03_46:
    speaker: arkrangerblack
    en: It must have bounced out when someone tried to throw it away.
    ko: 쓰레기통에 버리려다가 튕겨서 나온 것 같군.
    ja: |-
      ゴミ箱に放り投げたが、
      入らなかったようだな。
  d_nikke_arkrangerblack_03_47:
    speaker: arkrangerblack
    en: Still, they shouldn't have left the empty bottle there.
    ko: 그렇다고 음료를 다 마신 페트병을 그대로 버리면 안 되지.
    ja: |-
      しかし、飲み終わったペットボトルを
      そのまま捨てるのは感心しないな。
  d_nikke_arkrangerblack_03_48:
    speaker: "<Self>"
    en: What are you going to do with it?
    ko: 뭐 하려고?
    ja: 何をするつもりだ？
  d_nikke_arkrangerblack_03_49:
    speaker: arkrangerblack
    en: I'm going to prep it for recycling.
    ko: 분리수거를 위한 작업을 하려고 한다.
    ja: リサイクルのための準備だ。
  d_nikke_arkrangerblack_03_50:
    speaker: "<Monologue>"
    en: Ark Ranger Black removes the label from the plastic bottle and separates the
      cap.
    ko: 아크레인저 블랙은 페트병의 라벨을 떼고, 뚜껑을 분리했다.
    ja: |-
      ブラックはペットボトルのラベルを剥がし、
      フタを外した
  d_nikke_arkrangerblack_03_51:
    speaker: arkrangerblack
    en: We have to separate everything first before it can be recycled.
    ko: 전부 따로 나눠야 분리수거할 수 있지.
    ja: 別々にしておかないと、リサイクルができない。
  d_nikke_arkrangerblack_03_52:
    speaker: arkrangerblack
    en: Recyclables have to be sorted like this before disposal.
    ko: 재활용 쓰레기는 이렇게 분리해서 배출해야 한다.
    ja: こういう作業も必要なんだ。
  d_nikke_arkrangerblack_03_53:
    speaker: "<Self>"
    en: You're really thorough about this.
    ko: 진짜 꼼꼼하게 하네.
    ja: 丁寧だな
  d_nikke_arkrangerblack_03_54:
    speaker: arkrangerblack
    en: If I'm going to do something, I should do it properly.
    ko: 일단 하겠다고 했으면 철저하게 해야 하지 않겠나.
    ja: 一度やると決めたら、徹底すべきだろう？
  d_nikke_arkrangerblack_03_55:
    speaker: arkrangerblack
    en: That's what heroic work is all about.
    ko: 그게 히어로 활동이다.
    ja: それがヒーローの活動だ。
  d_nikke_arkrangerblack_03_56:
    speaker: "<Monologue>"
    en: I look down at the trash inside my bag.
    ko: 나는 내가 봉투에 넣은 쓰레기들을 바라보았다.
    ja: 私は自分が袋に入れたゴミに目をやった
  d_nikke_arkrangerblack_03_57:
    speaker: "<Self>"
    en: "... I guess I'll have to take everything back out."
    ko: "…다시 꺼내야겠네, 이거."
    ja: "…分別をやり直そう"
  d_nikke_arkrangerblack_03_58:
    speaker: "<Monologue>"
    en: After finishing our cleanup, we sit down on a park bench.
    ko: 쓰레기 줍기를 끝내고, 공원 벤치에 앉아 있었다.
    ja: ゴミ拾いを終え、公園のベンチに座った
  d_nikke_arkrangerblack_03_59:
    speaker: "<Self>"
    en: Phew...
    ko: 후우….
    ja: ふぅ…
  d_nikke_arkrangerblack_03_60:
    speaker: arkrangerblack
    en: Good work today, @UserName.
    ko: 수고했다, @UserName.
    ja: お疲れ様。
  d_nikke_arkrangerblack_03_61:
    speaker: "<Monologue>"
    en: Ark Ranger Black offers me a bottle of water.
    ko: 아크레인저 블랙이 물병을 건넸다.
    ja: |-
      アークレンジャー・ブラックが
      ペットボトルを差し出した
  d_nikke_arkrangerblack_03_62:
    speaker: arkrangerblack
    en: Would you like some?
    ko: 이거라도 마시겠나?
    ja: 飲むか？
  d_nikke_arkrangerblack_03_63:
    speaker: "<Self>"
    en: Thanks.
    ko: 고마워. 잘 마실게.
    ja: ありがとう
  d_nikke_arkrangerblack_03_64:
    speaker: Narration
    en: "*Gulp, gulp*"
    ko: 꿀꺽 꿀꺽-
    ja: ゴク、ゴクッ
  d_nikke_arkrangerblack_03_65:
    speaker: "<Self>"
    en: Ahh... That's better.
    ko: 하아, 좀 살 것 같다.
    ja: はぁ、生き返る…
  d_nikke_arkrangerblack_03_66:
    speaker: arkrangerblack
    en: I'm sorry if I pushed you too hard.
    ko: "…너무 고생시킨 것 같아 미안하군."
    ja: "…付き合わせて、申し訳ない。"
  d_nikke_arkrangerblack_03_67:
    speaker: arkrangerblack
    en: Was it too tiring?
    ko: 많이 힘들었나?
    ja: 大変だったか？
  d_nikke_arkrangerblack_03_68:
    speaker: "<Self>"
    en: It's okay. This is a satisfying kind of tired.
    ko: 괜찮아. 기분 좋은 피로감이니까.
    ja: いや、心地のいい疲労感だ
  d_nikke_arkrangerblack_03_69:
    speaker: "<Monologue>"
    en: I look over the bags of trash we filled together, before turning my gaze back
      to the park.
    ko: 나는 우리가 함께 주운 쓰레기 봉투들, 그리고 공원을 바라보았다.
    ja: 私は拾ったゴミが入った袋と公園を眺めた
  d_nikke_arkrangerblack_03_70:
    speaker: "<Self>"
    en: To think we did all this ourselves...
    ko: "…이걸 우리 손으로 했구나."
    ja: "…私たちの手できれいにしたんだな"
  d_nikke_arkrangerblack_03_71:
    speaker: "<Self>"
    en: Seeing the park this clean feels pretty rewarding.
    ko: 깨끗해진 공원을 보고 있으니까 정말 뿌듯하네.
    ja: |-
      確かに、きれいになった公園を見ると
      誇らしい気持ちになる
  d_nikke_arkrangerblack_03_72:
    speaker: arkrangerblack
    en: Then our time together today was meaningful.
    ko: 그렇다면 오늘 함께한 의미가 있었군.
    ja: それなら今日という日を共にした意味があるな。
  d_nikke_arkrangerblack_03_73:
    speaker: arkrangerblack
    en: I'm glad to hear that.
    ko: 정말 다행….
    ja: 本当によかっ…
  d_nikke_arkrangerblack_03_74:
    speaker: littleboy
    en: Mom! That's Ark Ranger Black! That's really her!
    ko: 엄마! 저기 블랙이야! 진짜 블랙!
    ja: ママ！ブラックがいるよ！本物のブラック！
  d_nikke_arkrangerblack_03_75:
    speaker: "<Monologue>"
    en: A child passing through the park spots Ark Ranger Black and runs over.
    ko: 공원을 지나가던 한 아이가 아크레인저 블랙을 발견하고 뛰어왔다.
    ja: |-
      公園を通りがかった男の子が
      アークレンジャー・ブラックを見て
      駆け寄った
  d_nikke_arkrangerblack_03_76:
    speaker: arkrangerblack
    en: Excuse me for a moment, @UserName.
    ko: "@UserName, 잠시 실례하지."
    ja: "@UserName、少し失礼する。"
  d_nikke_arkrangerblack_03_77:
    speaker: arkrangerblack
    en: Hello there.
    ko: 안녕한가, 소년.
    ja: やあ、少年。
  d_nikke_arkrangerblack_03_78:
    speaker: "<Monologue>"
    en: Ark Ranger Black rises from the bench then drops to one knee to meet the child's
      eye level.
    ko: 아크레인저 블랙은 벤치에서 일어나, 한쪽 무릎을 굽혀 아이와 시선을 맞췄다.
    ja: |-
      アークレンジャー・ブラックは
      ベンチから立ち上がり、
      男の子の前に片ひざをついて目線を合わせた
  d_nikke_arkrangerblack_03_79:
    speaker: littleboy
    en: Black! Why are you at the park?
    ko: 블랙! 공원에는 왜 온 거야?
    ja: ブラック！どうしてここに？
  d_nikke_arkrangerblack_03_80:
    speaker: littleboy
    en: Did Rapture fiends come to the park too?
    ko: 랩쳐 괴인들이 공원에도 온 거야?
    ja: ラプチャー怪人が公園にいるの？
  d_nikke_arkrangerblack_03_81:
    speaker: arkrangerblack
    en: No, they didn't.
    ko: 그렇지 않다.
    ja: いや、そうではない。
  d_nikke_arkrangerblack_03_82:
    speaker: arkrangerblack
    en: I was picking up some trash, that's all.
    ko: 나는 그냥 쓰레기를 줍고 있었다.
    ja: 私はただ、ゴミ拾いをしていたんだ。
  d_nikke_arkrangerblack_03_83:
    speaker: littleboy
    en: Huh? Why are you doing that?
    ko: 쓰레기? 쓰레기를 왜 줍고 있어?
    ja: ゴミ拾い？どうして？
  d_nikke_arkrangerblack_03_84:
    speaker: arkrangerblack
    en: Because it's part of a hero's job.
    ko: 히어로의 일이니까.
    ja: ヒーローの仕事だからな。
  d_nikke_arkrangerblack_03_85:
    speaker: littleboy
    en: It is?
    ko: 히어로의 일?
    ja: ヒーローの仕事？
  d_nikke_arkrangerblack_03_86:
    speaker: arkrangerblack
    en: Yes.
    ko: 그렇다.
    ja: ああ。
  d_nikke_arkrangerblack_03_87:
    speaker: arkrangerblack
    en: Anything that benefits others is a hero's job.
    ko: 누군가에게 도움이 되는 일이라면, 무엇이든 히어로의 일이다.
    ja: |-
      誰かの役に立つことなら、
      何でもヒーローの仕事なんだ。
  d_nikke_arkrangerblack_03_88:
    speaker: littleboy
    en: I see!
    ko: 그렇구나!
    ja: そうなんだ！
  d_nikke_arkrangerblack_03_89:
    speaker: littleboy
    en: Then is he helping you with your heroic work too?
    ko: 혹시 저 형도 같이 하고 있던 거야?
    ja: あのお兄ちゃんも一緒に拾ってたの？
  d_nikke_arkrangerblack_03_90:
    speaker: "<Monologue>"
    en: The boy points at me.
    ko: 남자 아이가 손가락으로 나를 가리켰다.
    ja: 男の子は私を指さした
  d_nikke_arkrangerblack_03_91:
    speaker: arkrangerblack
    en: Of course. He's a hero just like us.
    ko: 물론이다. 저 형도 우리와 같은 히어로니까.
    ja: |-
      もちろん。あのお兄さんも、
      私たちと同じヒーローだからな。
  d_nikke_arkrangerblack_03_92:
    speaker: littleboy
    en: Hmm... then...
    ko: 음… 그러면….
    ja: うーん…それなら…
  d_nikke_arkrangerblack_03_93:
    speaker: "<Monologue>"
    en: The boy runs off, then returns a short while later.
    ko: 아이는 어딘가로 뛰어가더니, 곧 다시 돌아왔다.
    ja: 男の子はどこかへ走っていき、すぐに戻ってきた
  d_nikke_arkrangerblack_03_94:
    speaker: "<Monologue>"
    en: He drops a piece of trash into the bag.
    ko: 그리고 봉투에 주워온 쓰레기를 넣었다.
    ja: そして拾ったゴミを袋に入れた
  d_nikke_arkrangerblack_03_95:
    speaker: littleboy
    en: I picked up trash too!
    ko: 나도 쓰레기 주워 왔어!
    ja: ボクもゴミを拾ったよ！
  d_nikke_arkrangerblack_03_96:
    speaker: littleboy
    en: Does that mean I did heroic work?
    ko: 이러면 나도 히어로랑 같은 일은 한 거네?
    ja: |-
      これで、ボクもヒーローと
      同じことができたんだよね？
  d_nikke_arkrangerblack_03_97:
    speaker: arkrangerblack
    en: Yes.
    ko: 그렇다.
    ja: ああ。
  d_nikke_arkrangerblack_03_98:
    speaker: arkrangerblack
    en: I'm sure you'll grow up to be a great hero.
    ko: 소년은 아주 훌륭한 히어로가 될 수 있을 거다.
    ja: 君も立派なヒーローになれるはずだ。
  d_nikke_arkrangerblack_03_99:
    speaker: littleboy
    en: Hehe. Black complimented me! I can't wait to tell my friends tomorrow!
    ko: 헤헤. 블랙한테 칭찬받은 거, 내일 친구들한테 자랑해야지!
    ja: |-
      えへへ。ブラックに褒められたって、
      明日みんなに自慢しよーっと！
  d_nikke_arkrangerblack_03_100:
    speaker: littleboy
    en: Okay, I gotta go now! Bye, Black! Keep up the good work!
    ko: 그럼 나 이만 갈게, 블랙! 열심히 해!
    ja: じゃあね、ブラック！頑張ってね！
  d_nikke_arkrangerblack_03_101:
    speaker: arkrangerblack
    en: All right, get home safe.
    ko: 그래. 조심히 가도록.
    ja: ああ、気をつけて。
  d_nikke_arkrangerblack_03_102:
    speaker: "<Monologue>"
    en: The boy walks away holding his parents' hands.
    ko: 아이는 부모의 손을 잡고 돌아갔다.
    ja: 男の子は母親の手を握り、帰っていった
  d_nikke_arkrangerblack_03_103:
    speaker: arkrangerblack
    en: Thanks to that boy, this turned into an even happier day.
    ko: "…저 소년 덕분에 더 좋은 마무리가 됐군."
    ja: |-
      …あの少年のおかげで、
      いい締めくくりになったな。
  d_nikke_arkrangerblack_03_104:
    speaker: "<Self>"
    en: Yeah. It's so heartwarming.
    ko: 그러게. 뭔가 가슴이 따뜻해진 느낌이야.
    ja: そうだな。心が温まった
  d_nikke_arkrangerblack_03_105:
    speaker: "<Monologue>"
    en: Ark Ranger Black smiles quietly without a word.
    ko: 아크레인저 블랙은 말없이 미소를 지었다.
    ja: アークレンジャー・ブラックは、無言で微笑んだ
  d_nikke_arkrangerblack_03_106:
    speaker: "<Self>"
    en: So, will you be doing heroic work tomorrow too?
    ko: 블랙, 혹시 내일도 히어로 활동을 해?
    ja: ブラック、明日も活動をするのか？
  d_nikke_arkrangerblack_03_107:
    speaker: arkrangerblack
    en: Of course I will.
    ko: 당연히 한다.
    ja: 当然だ。
  d_nikke_arkrangerblack_03_108:
    speaker: arkrangerblack
    en: I don't have anything scheduled tomorrow.
    ko: 내일까지는 스케줄이 없으니까.
    ja: 明日まではスケジュールが入っていないからな。
  d_nikke_arkrangerblack_03_109:
    speaker: "<Self>"
    en: Then can I join you tomorrow as well?
    ko: 그럼 내일도 같이 해도 될까?
    ja: 明日も手伝っていいか？
  d_nikke_arkrangerblack_03_110:
    speaker: "<Self>"
    en: I'd like to experience this feeling again.
    ko: 오늘 같은 기분, 한 번 더 느껴보고 싶거든.
    ja: 今日みたいな気分をもう一度味わいたいんだ
  d_nikke_arkrangerblack_03_111:
    speaker: arkrangerblack
    en: Of course.
    ko: 물론이다.
    ja: もちろんだ。
  d_nikke_arkrangerblack_03_112:
    speaker: arkrangerblack
    en: Honestly, I was about to ask you the same thing.
    ko: 오히려 내가 부탁하고 싶을 정도지.
    ja: こちらからお願いしたいくらいだ。
  d_nikke_arkrangerblack_03_113:
    speaker: arkrangerblack
    en: But for now...
    ko: 하지만 그전에….
    ja: しかし、その前に…
  d_nikke_arkrangerblack_03_114:
    speaker: "<Monologue>"
    en: Ark Ranger Black lifts up the trash bags.
    ko: 아크레인저 블랙은 쓰레기 봉투를 집어 들었다.
    ja: |-
      アークレンジャー・ブラックは
      ゴミ袋を持ち上げた
  d_nikke_arkrangerblack_03_115:
    speaker: arkrangerblack
    en: Let's take care of the trash we collected.
    ko: 일단 우리가 주운 쓰레기부터 처리하도록 할까.
    ja: まずは私たちが拾ったゴミを片づけよう。
d_nikke_arkrangerblack_04:
  d_nikke_arkrangerblack_04_1:
    speaker: "<Monologue>"
    en: I arrive at the place where Ark Ranger Black and I arranged to meet.
    ko: 아크레인저 블랙과 약속한 장소에 도착했다.
    ja: |-
      アークレンジャー・ブラックと
      約束した場所に到着した
  d_nikke_arkrangerblack_04_2:
    speaker: "<Self>"
    en: So, what's our agenda today?
    ko: 오늘 할 일은 뭐야?
    ja: 今日は何をするんだ？
  d_nikke_arkrangerblack_04_3:
    speaker: arkrangerblack
    en: We're on patrol again.
    ko: 오늘도 순찰이다.
    ja: パトロールだ。
  d_nikke_arkrangerblack_04_4:
    speaker: "<Self>"
    en: Didn't we already do that?
    ko: 순찰은 저번에도 하지 않았어?
    ja: パトロールなら、この間もしただろう？
  d_nikke_arkrangerblack_04_5:
    speaker: arkrangerblack
    en: Today's patrol is a little different.
    ko: 오늘은 다르다.
    ja: それはまた別の活動だ。
  d_nikke_arkrangerblack_04_6:
    speaker: arkrangerblack
    en: Our goal is to find citizens in trouble and help them.
    ko: 오늘은 곤경에 빠진 시민을 찾아서, 그들을 돕는 순찰이다.
    ja: |-
      今日は困っている人々を見つけ、
      彼らを助けるためのパトロールだ。
  d_nikke_arkrangerblack_04_7:
    speaker: arkrangerblack
    en: This time, we'll be actively looking for people who need help.
    ko: 저번보다 도움이 필요한 사람을 더 적극적으로 찾는 일이지.
    ja: |-
      困っている人々がいないか、積極的に
      見回ることが目的さ。
  d_nikke_arkrangerblack_04_8:
    speaker: "<Self>"
    en: All right, let's do it.
    ko: 그래, 출발하자.
    ja: |-
      そうか、分かった。
      では出発しよう
  d_nikke_arkrangerblack_04_9:
    speaker: "<Monologue>"
    en: We walk through the streets together.
    ko: 우리는 거리 곳곳을 돌아다녔다.
    ja: 私たちは街中を歩き回った
  d_nikke_arkrangerblack_04_10:
    speaker: arkrangerblack
    en: Today we need to pay closer attention to our surroundings than usual, @UserName.
    ko: "@UserName. 오늘 우리는 평소보다 더 주의 깊게 주변을 살펴야 한다."
    ja: |-
      @UserName。
      今日はいつもより注意深く
      周囲を確認しなければならない。
  d_nikke_arkrangerblack_04_11:
    speaker: arkrangerblack
    en: Sometimes, the people who need help may not let it show.
    ko: 도움이 필요한 사람 중에는, 의외로 티가 나지 않는 경우도 있으니까.
    ja: |-
      人々が困っているかどうか、
      分かりにくい時もある。
  d_nikke_arkrangerblack_04_12:
    speaker: arkrangerblack
    en: Their expressions, posture, even what they're carrying... we can't overlook
      any signs, no matter how small.
    ko: 표정, 자세, 손에 든 것… 작은 신호 하나까지 놓치지 않아야 하지.
    ja: |-
      表情、姿勢、持ち物…
      小さな手がかり一つ、逃してはならない。
  d_nikke_arkrangerblack_04_13:
    speaker: "<Self>"
    en: Got it. I'll keep my eyes peeled.
    ko: 알았어. 나도 주의 깊게 볼게.
    ja: 分かった。気を付けよう
  d_nikke_arkrangerblack_04_14:
    speaker: arkrangerblack
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arkrangerblack_04_15:
    speaker: arkrangerblack
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_arkrangerblack_04_16:
    speaker: littlegirl
    en: Waaaaahhh!
    ko: 으아아아아앙!
    ja: うわああああん！
  d_nikke_arkrangerblack_04_17:
    speaker: "<Monologue>"
    en: In the direction Ark Ranger Black is looking, a little girl has flopped to
      the ground crying.
    ko: 아크레인저 블랙이 바라보고 있는 곳에는, 한 여자아이가 바닥에 주저앉아 있었다.
    ja: |-
      アークレンジャー・ブラックの視線の先に、
      公園で座り込んでいる女の子がいた
  d_nikke_arkrangerblack_04_18:
    speaker: littlegirl
    en: My balloon... my balloooon... waaahhh!
    ko: 풍선, 내 풍서언! 으아아앙!
    ja: 風船！私の風船がぁ！うわああん！
  d_nikke_arkrangerblack_04_19:
    speaker: leona
    en: This is a problem...
    ko: 이거 곤란하네….
    ja: 困ったなぁ…
  d_nikke_arkrangerblack_04_20:
    speaker: leona
    en: It's stuck too high up. There's no way to reach it.
    ko: 너무 높은 곳에 걸려 있어서, 꺼낼 수가 없어.
    ja: あんな高いところ、届かないよ…
  d_nikke_arkrangerblack_04_21:
    speaker: timi
    en: "*Grooowl*"
    ko: 커허엉….
    ja: ガォォ…
  d_nikke_arkrangerblack_04_22:
    speaker: "<Monologue>"
    en: We head over to the sobbing girl.
    ko: 우리는 소녀가 울고 있는 곳으로 걸음을 옮겼다.
    ja: 私たちは泣いている少女のもとへ向かった
  d_nikke_arkrangerblack_04_23:
    speaker: "<Self>"
    en: Hey Leona.
    ko: 레오나.
    ja: レオナ
  d_nikke_arkrangerblack_04_24:
    speaker: leona
    en: Hmm?
    ko: 어?
    ja: あれっ？
  d_nikke_arkrangerblack_04_25:
    speaker: leona
    en: Zoo Keeper?
    ko: 사육사님?
    ja: 飼育士さん。
  d_nikke_arkrangerblack_04_26:
    speaker: "<Self>"
    en: What's going on?
    ko: 무슨 일이야?
    ja: どうしたんだ？
  d_nikke_arkrangerblack_04_27:
    speaker: leona
    en: Ah, well...
    ko: 아, 그게….
    ja: あ、それがね…
  d_nikke_arkrangerblack_04_28:
    speaker: leona
    en: This little girl's balloon got stuck up there.
    ko: 이 꼬마가 놓친 풍선이 저기 걸려 버렸거든.
    ja: |-
      あの子の風船が、
      あそこに引っかかっちゃったの。
  d_nikke_arkrangerblack_04_29:
    speaker: "<Monologue>"
    en: Leona points toward the top of a building.
    ko: 레오나는 건물 위를 손가락으로 가리킨다.
    ja: レオナは建物の上を指さした
  d_nikke_arkrangerblack_04_30:
    speaker: "<Self>"
    en: That's definitely too high to climb...
    ko: 너무 높아서 올라가기가 어렵겠는데….
    ja: ずいぶん高いところにあるな…
  d_nikke_arkrangerblack_04_31:
    speaker: leona
    en: There's not much we can do from the windows,
    ko: 창문에서 뭐 어떻게 할 수 있는 곳도 아니고,
    ja: 窓から手が届く場所でもないし、
  d_nikke_arkrangerblack_04_32:
    speaker: leona
    en: and climbing the wall to get it back wouldn't be easy either...
    ko: 그렇다고 벽을 타고 올라가서 꺼내기도 어려워서….
    ja: 壁を伝って登るのも難しくて…
  d_nikke_arkrangerblack_04_33:
    speaker: littlegirl
    en: My balloooon! Waaahhh!
    ko: 풍서어언! 으아아앙!
    ja: ふうせぇん！うわああん！
  d_nikke_arkrangerblack_04_34:
    speaker: arkrangerblack
    en: I understand the situation.
    ko: 상황은 이해했다.
    ja: 状況は理解した。
  d_nikke_arkrangerblack_04_35:
    speaker: arkrangerblack
    en: Wait just a moment.
    ko: 잠시만 기다려다오.
    ja: 少し待っていてくれ。
  d_nikke_arkrangerblack_04_36:
    speaker: "<Monologue>"
    en: Ark Ranger Black walks toward the outer wall of the building.
    ko: 아크레인저 블랙이 건물 외벽 쪽으로 향했다.
    ja: |-
      アークレンジャー・ブラックは
      建物の外壁の方へ向かった
  d_nikke_arkrangerblack_04_37:
    speaker: arkrangerblack
    en: Ark Ranger Black!
    ko: 아크레인저 블랙!
    ja: アークレンジャー・ブラック！
  d_nikke_arkrangerblack_04_38:
    speaker: arkrangerblack
    en: Transform!
    ko: 변신!
    ja: 変身！
  d_nikke_arkrangerblack_04_39:
    speaker: leona
    en: Ark... Ranger...?
    ko: 아크… 레인저…?
    ja: アーク…レンジャー…？
  d_nikke_arkrangerblack_04_40:
    speaker: "<Monologue>"
    en: Ark Ranger Black nimbly leaps upward, kicking off the wall as she scales the
      building.
    ko: 아크레인저 블랙은 가볍게 도약해, 벽을 차며 건물 위로 올라갔다.
    ja: |-
      アークレンジャー・ブラックは軽くジャンプし、
      壁を蹴って建物の上へ登った
  d_nikke_arkrangerblack_04_41:
    speaker: leona
    en: Wow...
    ko: 와아….
    ja: わあ…
  d_nikke_arkrangerblack_04_42:
    speaker: "<Self>"
    en: She's even good at that...
    ko: 저런 것까지 잘하네….
    ja: こんなことまでできるのか…
  d_nikke_arkrangerblack_04_43:
    speaker: "<Monologue>"
    en: She grabs the balloon and lands softly on the ground.
    ko: 그리고 풍선을 잡아 사뿐히 내려왔다.
    ja: そして風船をキャッチし、軽やかに舞い降りた
  d_nikke_arkrangerblack_04_44:
    speaker: arkrangerblack
    en: Young lady.
    ko: 소녀여.
    ja: 少女よ。
  d_nikke_arkrangerblack_04_45:
    speaker: arkrangerblack
    en: I've retrieved your balloon.
    ko: 풍선을 가져왔다.
    ja: 風船を持ってきたぞ。
  d_nikke_arkrangerblack_04_46:
    speaker: arkrangerblack
    en: Would you like it back?
    ko: 받아주겠나?
    ja: 受け取ってくれるか？
  d_nikke_arkrangerblack_04_47:
    speaker: littlegirl
    en: Oh...!
    ko: 아…!
    ja: あっ…！
  d_nikke_arkrangerblack_04_48:
    speaker: littlegirl
    en: "*Sniff* Th-thank you!"
    ko: 훌쩍, 고, 고마워!
    ja: ぐすん、あ、ありがとう！
  d_nikke_arkrangerblack_04_49:
    speaker: arkrangerblack
    en: Next time, when you're holding a balloon, try wrapping the string around your
      wrist once.
    ko: 앞으로는 풍선을 잡고 있을 때, 끈을 손목에 한 번 감아두면 좋다.
    ja: |-
      これから風船を持つ時は、
      ひもを手首に一度巻きつけておくといい。
  d_nikke_arkrangerblack_04_50:
    speaker: arkrangerblack
    en: That way, you won't lose it again.
    ko: 풍선을 또 놓치고 싶지 않으면, 그렇게 해보도록.
    ja: そうすれば、手から離れることはないだろう。
  d_nikke_arkrangerblack_04_51:
    speaker: littlegirl
    en: Okay! I will!
    ko: 응! 그렇게 할게!
    ja: うん！そうするね！
  d_nikke_arkrangerblack_04_52:
    speaker: littlegirl
    en: Thank you so much!
    ko: 정말 고마워, 언니!
    ja: 本当にありがとう、お姉ちゃん！
  d_nikke_arkrangerblack_04_53:
    speaker: "<Monologue>"
    en: After saying thank you, the little girl leaves.
    ko: 여자아이는 감사 인사를 남기고 자리를 떠났다.
    ja: 女の子はお礼を伝え、その場を離れた
  d_nikke_arkrangerblack_04_54:
    speaker: leona
    en: I don't think Timi and I could've handled that on our own.
    ko: 나랑 티미만으론 어떻게 못 할 것 같았는데,
    ja: 私とティミだけじゃ、どうにもならなかったよ。
  d_nikke_arkrangerblack_04_55:
    speaker: leona
    en: Thanks for helping us.
    ko: 도와줘서 고마워.
    ja: 助けてくれてありがとう。
  d_nikke_arkrangerblack_04_56:
    speaker: arkrangerblack
    en: It was nothing.
    ko: 어려운 일은 아니다.
    ja: 大したことではない。
  d_nikke_arkrangerblack_04_57:
    speaker: arkrangerblack
    en: I simply did what I could.
    ko: 이걸 할 수 있는 게 나라서, 내가 했을 뿐이다.
    ja: 私にできることをしたまでだ。
  d_nikke_arkrangerblack_04_58:
    speaker: leona
    en: By the way... could you take your helmet off for a second?
    ko: "…그런데 혹시 잠깐 헬멧 좀 벗어줄 수 있어?"
    ja: "…ねえ、ヘルメットを脱いでくれる？"
  d_nikke_arkrangerblack_04_59:
    speaker: leona
    en: I think it's safe to take it off now.
    ko: 이젠 좀 벗어도 될 것 같은데.
    ja: もう脱いでもいいんだよね？
  d_nikke_arkrangerblack_04_60:
    speaker: arkrangerblack
    en: My apologies. I've gotten into the habit of transforming whenever something
      important comes up.
    ko: 미안하다. 뭔가 중요한 일을 할 때는 변신하는 게 습관이라서.
    ja: |-
      すまない。
      大切な時には変身するのが習慣なんだ。
  d_nikke_arkrangerblack_04_61:
    speaker: "<Monologue>"
    en: Ark Ranger Black removes her helmet.
    ko: 아크레인저 블랙이 헬멧을 벗었다.
    ja: |-
      アークレンジャー・ブラックは
      ヘルメットを脱いだ
  d_nikke_arkrangerblack_04_62:
    speaker: leona
    en: Wait, you wouldn't happen to be the one who reported finding a black cat a
      few days ago, would you?
    ko: "…혹시 며칠 전에 검은 고양이 한 마리를 신고해 주지 않았어?"
    ja: |-
      …ひょっとして、数日前に黒ネコを
      見つけて連絡してくれた？
  d_nikke_arkrangerblack_04_63:
    speaker: arkrangerblack
    en: I was there, but I only assisted.
    ko: 고양이를 찾은 건 맞지만, 나는 옆에서 거들기만 했을 뿐이다.
    ja: |-
      確かにネコは見つけたが、
      ただ隣で手を貸しただけだ。
  d_nikke_arkrangerblack_04_64:
    speaker: arkrangerblack
    en: "@UserName was actually the one who found and reported it."
    ko: 실제로 찾아서 신고한 건, @UserName이지.
    ja: |-
      見つけて連絡をしたのは、
      @UserNameだ。
  d_nikke_arkrangerblack_04_65:
    speaker: leona
    en: Zoo Keeper was with you?
    ko: 사육사님도 같이 있었던 거야?
    ja: 飼育士さんも一緒だったの？
  d_nikke_arkrangerblack_04_66:
    speaker: "<Self>"
    en: Yeah. Black and I were patrolling together.
    ko: 응. 블랙이랑 같이 순찰을 돌고 있었지.
    ja: |-
      ああ、ブラックと一緒に
      パトロールをしていたんだ
  d_nikke_arkrangerblack_04_67:
    speaker: leona
    en: I see.
    ko: 그랬구나~
    ja: そうだったのね～
  d_nikke_arkrangerblack_04_68:
    speaker: leona
    en: Then I guess I should thank you, Zoo Keeper.
    ko: 그럼 사육사님한테 고마워해야겠네.
    ja: じゃあ、飼育士さんにも感謝しなきゃ。
  d_nikke_arkrangerblack_04_69:
    speaker: "<Self>"
    en: Me? Why?
    ko: 나한테? 왜?
    ja: 私に？なぜだ？
  d_nikke_arkrangerblack_04_70:
    speaker: leona
    en: Because you saved that cat's life.
    ko: 고양이의 목숨을 구해줬으니까.
    ja: ネコの命を救ってくれたから。
  d_nikke_arkrangerblack_04_71:
    speaker: "<Self>"
    en: All I did was find it.
    ko: 난 그냥 찾기만 했을 뿐인데?
    ja: 私はただ見つけただけだ
  d_nikke_arkrangerblack_04_72:
    speaker: leona
    en: You really did save its life though.
    ko: 으응. 정말 목숨을 구해준 거야.
    ja: ううん。命を救ってくれたんだから。
  d_nikke_arkrangerblack_04_73:
    speaker: leona
    en: Happy Zoo took that cat in,
    ko: 그 고양이를 해피 주에서 인계받았거든.
    ja: あのネコ、ハッピーズーが引きとったの。
  d_nikke_arkrangerblack_04_74:
    speaker: leona
    en: and when we did a health check, it turned out to be sick.
    ko: 그래서 우리가 고양이 건강 상태를 체크해봤는데, 병에 걸려 있었어.
    ja: |-
      それで健康状態をチェックしたんだけど、
      病気だったの。
  d_nikke_arkrangerblack_04_75:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_arkrangerblack_04_76:
    speaker: leona
    en: Fortunately you found it when you did. Any later, and things could've ended
      poorly.
    ko: 일찍 발견해서 다행이지, 조금만 더 늦었으면 큰일이 날 뻔했다고.
    ja: |-
      早めに発見できたからよかったけど、
      あと一歩遅かったら大変なことになってたかも。
  d_nikke_arkrangerblack_04_77:
    speaker: "<Self>"
    en: But it looked perfectly fine.
    ko: 겉보기엔 멀쩡해 보였는데?
    ja: 見た目に異常はなかったが…
  d_nikke_arkrangerblack_04_78:
    speaker: leona
    en: Cats instinctively try to hide any symptoms of illness, so it wouldn't have
      been obvious until the symptoms got much worse.
    ko: 고양이들은 본능적으로 아픈 걸 숨기니까, 큰 증상이 나오기 전까진 티가 안 났을 거야.
    ja: |-
      ネコって本能的に弱みを隠しちゃうの。
      だから気づいた時には
      かなり悪くなってることも多いんだよ。
  d_nikke_arkrangerblack_04_79:
    speaker: "<Self>"
    en: If we'd just walked past that dumpster without checking it...
    ko: 별거 아니라고 쓰레기통을 그냥 지나쳤으면….
    ja: もしゴミ箱を通り過ぎていたら…
  d_nikke_arkrangerblack_04_80:
    speaker: "<Monologue>"
    en: I look over at Black.
    ko: 나는 블랙을 바라보았다.
    ja: 私はブラックを見た
  d_nikke_arkrangerblack_04_81:
    speaker: "<Monologue>"
    en: Black smiles and quietly nods.
    ko: 블랙은 고개를 끄덕이며 웃었다.
    ja: 彼女はうなずきながら笑った
  d_nikke_arkrangerblack_04_82:
    speaker: leona
    en: The cat's healthy now and doing great, so you don't need to worry.
    ko: 그래도 지금은 건강해져서 씩씩하게 지내고 있으니까, 이젠 안심해도 돼.
    ja: でも、今は元気にしてるから安心してね。
  d_nikke_arkrangerblack_04_83:
    speaker: "<Self>"
    en: That's a relief.
    ko: 다행이네.
    ja: それはよかった
  d_nikke_arkrangerblack_04_84:
    speaker: leona
    en: Well then, Timi and I have things to take care of, so we should get going.
    ko: 그러면 나랑 티미는 일이 있어서 먼저 가볼게.
    ja: |-
      じゃあ、私とティミは用事があるから
      失礼するね。
  d_nikke_arkrangerblack_04_85:
    speaker: leona
    en: If you ever find another animal, please take care of it too!
    ko: 혹시 또 동물을 발견하면, 그때도 잘 부탁해!
    ja: また動物を見つけたら、その時もよろしく！
  d_nikke_arkrangerblack_04_86:
    speaker: "<Self>"
    en: Got it.
    ko: 알았어.
    ja: ああ
  d_nikke_arkrangerblack_04_87:
    speaker: leona
    en: Let's go, Timi.
    ko: 가자, 티미.
    ja: 行こう、ティミ。
  d_nikke_arkrangerblack_04_88:
    speaker: timi
    en: "*Grooowl*"
    ko: 크허엉.
    ja: ガオ～
  d_nikke_arkrangerblack_04_89:
    speaker: "<Monologue>"
    en: Leona leaves with Timi.
    ko: 레오나는 티미를 데리고 자리를 떠났다.
    ja: レオナはティミを連れて去っていった
  d_nikke_arkrangerblack_04_90:
    speaker: arkrangerblack
    en: You seem happy.
    ko: 기쁜가 보군.
    ja: 嬉しいのか？
  d_nikke_arkrangerblack_04_91:
    speaker: arkrangerblack
    en: You're smiling.
    ko: 얼굴에 미소가 피어 있다.
    ja: 顔がほころんでいるぞ。
  d_nikke_arkrangerblack_04_92:
    speaker: "<Self>"
    en: I understand now what you meant before.
    ko: 블랙이 전에 했던 말, 그게 이런 거였구나.
    ja: |-
      ブラックが前に言っていたのは、
      こういうことだったんだな
  d_nikke_arkrangerblack_04_93:
    speaker: "<Self>"
    en: About how something insignificant can turn into something much bigger.
    ko: 정말 작은 일이라고 생각한 것들이 큰 일이 될 수도 있었어.
    ja: 小さなことが、あとで大きなことに繋がるって
  d_nikke_arkrangerblack_04_94:
    speaker: arkrangerblack
    en: Is that why you're smiling?
    ko: 그걸 깨달아서 웃고 있던 건가.
    ja: それに気づいて笑っていたのか？
  d_nikke_arkrangerblack_04_95:
    speaker: "<Self>"
    en: I'm also glad the cat got better.
    ko: 고양이가 건강해졌다니까 기쁘기도 하고.
    ja: もちろん、ネコが元気になって嬉しいのもある
  d_nikke_arkrangerblack_04_96:
    speaker: arkrangerblack
    en: I'm relieved to hear that as well.
    ko: 고양이 건은 나도 다행이라고 생각한다.
    ja: 私も安心した。
  d_nikke_arkrangerblack_04_97:
    speaker: "<Self>"
    en: Then should we continue the rest of our patrol?
    ko: 그럼 이제 우리는 순찰을 마저 하러 갈까?
    ja: さあ、パトロールを続けようか？
  d_nikke_arkrangerblack_04_98:
    speaker: arkrangerblack
    en: That's not a problem,
    ko: 순찰 가는 건 문제없다만….
    ja: それは問題ないが…
  d_nikke_arkrangerblack_04_99:
    speaker: arkrangerblack
    en: but you suddenly seem so full of energy.
    ko: 뭔가 갑자기 힘이 잔뜩 들어간 느낌이군.
    ja: なんだか急に力が入ったようだな。
  d_nikke_arkrangerblack_04_100:
    speaker: "<Self>"
    en: The more heroic work I do, the more rewarding it feels.
    ko: 히어로 활동을 하면 할수록, 뿌듯한 기분이 들고 있거든.
    ja: |-
      活動を続けるほど、
      誇らしい気持ちになるんだ
  d_nikke_arkrangerblack_04_101:
    speaker: "<Self>"
    en: It just makes me want to work even harder.
    ko: 그만큼 힘내야지.
    ja: だから頑張らないと
  d_nikke_arkrangerblack_04_102:
    speaker: arkrangerblack
    en: "... Heh."
    ko: "…훗."
    ja: "…ふっ。"
  d_nikke_arkrangerblack_04_103:
    speaker: arkrangerblack
    en: Putting your heart into something is always a good thing.
    ko: 뭐든 열심히 하는 건 좋은 일이지.
    ja: 何ごとも、頑張るのはいいことだ。
  d_nikke_arkrangerblack_04_104:
    speaker: arkrangerblack
    en: All right, let's keep looking for anyone who may need help.
    ko: 좋다. 곤란한 사람이 없는지, 마저 찾으러 가 보자.
    ja: よし。困っている人がいないか、探しに行こう。
d_nikke_arkrangerblack_05:
  d_nikke_arkrangerblack_05_1:
    speaker: "<Monologue>"
    en: Ark Ranger Black and I sit together on a bench.
    ko: 나와 아크레인저 블랙은 함께 벤치에 앉아 있다.
    ja: |-
      私とアークレンジャー・ブラックは
      ベンチに並んで座っている
  d_nikke_arkrangerblack_05_2:
    speaker: arkrangerblack
    en: You did great today too, @UserName.
    ko: 오늘 하루도 고생 많았다, @UserName.
    ja: |-
      今日も一日ご苦労だった、
      @UserName。
  d_nikke_arkrangerblack_05_3:
    speaker: "<Self>"
    en: You too.
    ko: 블랙도 수고 많았어.
    ja: ブラックもお疲れ様
  d_nikke_arkrangerblack_05_4:
    speaker: arkrangerblack
    en: This may sound a little sudden...
    ko: 새삼스럽겠지만….
    ja: 今さらではあるが…
  d_nikke_arkrangerblack_05_5:
    speaker: arkrangerblack
    en: But there's something I'd like to tell you.
    ko: 그래도 지금 전해두고 싶은 말이 있다.
    ja: それでも今、伝えておきたい言葉がある。
  d_nikke_arkrangerblack_05_6:
    speaker: arkrangerblack
    en: Thank you for joining me in my heroic work these past few days, @UserName.
    ko: "@UserName, 오늘까지 히어로 활동에 함께해 줘서 고맙다."
    ja: |-
      今日までヒーローとしての活動を
      共にしてくれてありがとう。
  d_nikke_arkrangerblack_05_7:
    speaker: arkrangerblack
    en: It couldn't have been easy helping me out like this.
    ko: 며칠씩이나 어울려준다는 게, 쉽지 않은 일이었을 텐데.
    ja: |-
      何日も続けるのは簡単なことでは
      なかっただろう。
  d_nikke_arkrangerblack_05_8:
    speaker: "<Self>"
    en: Not at all. It was a good experience.
    ko: 괜찮아. 좋은 경험이었거든.
    ja: 大丈夫だ。おかげでいい経験になった
  d_nikke_arkrangerblack_05_9:
    speaker: arkrangerblack
    en: "... Hearing you say that makes me happy."
    ko: "…그렇게 말해주니 마음이 놓이는군."
    ja: "…そう言ってもらえると安心する。"
  d_nikke_arkrangerblack_05_10:
    speaker: "<Self>"
    en: But why did you want me to join you in the first place?
    ko: 그런데 블랙은 왜 나한테 히어로 활동을 같이 하자고 한 거야?
    ja: |-
      ところで、ブラックはどうして私を
      誘ったんだ？
  d_nikke_arkrangerblack_05_11:
    speaker: arkrangerblack
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arkrangerblack_05_12:
    speaker: arkrangerblack
    en: There wasn't any grand reason behind it.
    ko: 거창한 이유가 있었던 건 아니다.
    ja: 大した理由があったわけではない。
  d_nikke_arkrangerblack_05_13:
    speaker: arkrangerblack
    en: I simply wanted to do heroic work together with you.
    ko: 그저 같이 히어로 활동을 해보고 싶었다.
    ja: ただ、一緒にしてみたかった。
  d_nikke_arkrangerblack_05_14:
    speaker: arkrangerblack
    en: The things I normally do, and the things I've always wanted to do.
    ko: 내가 평소에 하던 것들, 해보고 싶었던 것들을.
    ja: |-
      私のいつも行っていること、
      やってみたかったことを…
  d_nikke_arkrangerblack_05_15:
    speaker: arkrangerblack
    en: All with someone I admire.
    ko: 동경하는 대상과 함께 말이다.
    ja: 憧れの存在と一緒に、な。
  d_nikke_arkrangerblack_05_16:
    speaker: arkrangerblack
    en: It was really just a selfish desire on my part.
    ko: 단순한 내 욕심… 이지.
    ja: 単なる私のワガママ…と言えるだろう。
  d_nikke_arkrangerblack_05_17:
    speaker: "<Self>"
    en: So that's why.
    ko: 그런 이유였구나.
    ja: そんな理由だったのか
  d_nikke_arkrangerblack_05_18:
    speaker: arkrangerblack
    en: Yes. It's probably a much less noble reason than you expected.
    ko: 그래. 생각보다 별 볼 일 없는 이유다.
    ja: ああ。思ったより単純だろう？
  d_nikke_arkrangerblack_05_19:
    speaker: arkrangerblack
    en: I realize it may be a little late to say this,
    ko: 이제 와서 늦었을지도 모르지만,
    ja: 今さらかもしれないが、
  d_nikke_arkrangerblack_05_20:
    speaker: arkrangerblack
    en: but I'm sorry for dragging you around with me this whole time for my own selfish
      desires.
    ko: 고작 이런 이유로 며칠을 따라다니게 해서 미안하다.
    ja: |-
      そんな理由で何日も付き合わせてしまって
      すまなかった。
  d_nikke_arkrangerblack_05_21:
    speaker: arkrangerblack
    en: If any of it made you uncomfortable, I apologize.
    ko: "…기분이 나빴다면 사과하마."
    ja: "…不快にさせてしまったなら、謝らせてくれ。"
  d_nikke_arkrangerblack_05_22:
    speaker: "<Self>"
    en: Not at all. If anything, I'm the one who should be thanking you.
    ko: 아니, 오히려 나는 블랙에게 고맙다고 해야 돼.
    ja: いや、むしろ感謝している
  d_nikke_arkrangerblack_05_23:
    speaker: arkrangerblack
    en: Thank me...?
    ko: 고맙다고…?
    ja: 感謝…？
  d_nikke_arkrangerblack_05_24:
    speaker: "<Self>"
    en: At first, I was only tagging along with you.
    ko: 시작은 그냥 블랙을 따라나섰을 뿐이지만,
    ja: 最初はブラックの後を追いかけるだけだったが、
  d_nikke_arkrangerblack_05_25:
    speaker: "<Self>"
    en: But spending time with you made me realize how rewarding heroic work can be.
    ko: 같이 돌아다니면서 히어로 활동이 얼마나 뿌듯한 일인지 알게 됐어.
    ja: |-
      一緒に行動しながら、この活動が
      どれほどやりがいのあることか分かったんだ
  d_nikke_arkrangerblack_05_26:
    speaker: arkrangerblack
    en: I see...
    ko: 그런가….
    ja: そうか…
  d_nikke_arkrangerblack_05_27:
    speaker: "<Self>"
    en: Small actions can make someone smile, or even save a cat's life.
    ko: 작은 행동으로 누군가를 웃게 할 수도 있었고, 고양이를 살릴 수도 있었잖아.
    ja: |-
      小さな行動で、誰かを笑顔にしたり、
      ネコを救うことだってできた
  d_nikke_arkrangerblack_05_28:
    speaker: "<Self>"
    en: That's when I realized what it really means to be a true hero.
    ko: 이런 게 진짜 히어로구나, 싶더라고.
    ja: これが本物のヒーローだと、そう思ったんだ
  d_nikke_arkrangerblack_05_29:
    speaker: "<Self>"
    en: So I should be the one thanking you for helping me realize that.
    ko: 그걸 깨닫게 해줬으니까 고마워 해야 할 일이야.
    ja: 気づかせてくれて、感謝している
  d_nikke_arkrangerblack_05_30:
    speaker: arkrangerblack
    en: This was my first time doing heroic work together with someone else too.
    ko: 나도 누군가와 함께 히어로 활동을 한다는 건 이번이 처음이었다.
    ja: |-
      私も誰かと一緒に活動をしたのは
      今回が初めてだ。
  d_nikke_arkrangerblack_05_31:
    speaker: arkrangerblack
    en: Maybe that's why I got a bit carried away.
    ko: 그래서 그런지, 나도 모르게 들떴던 감이 좀 있어.
    ja: |-
      そのせいか、自分でも気づかぬうちに
      浮き足立っていたところもある。
  d_nikke_arkrangerblack_05_32:
    speaker: arkrangerblack
    en: To the point where I could honestly say I enjoyed it.
    ko: 즐겁다고 생각해도 될 정도로 말이다.
    ja: 楽しいと思えるほどにな。
  d_nikke_arkrangerblack_05_33:
    speaker: arkrangerblack
    en: Which means I should be the one thanking you.
    ko: 그렇기 때문에 감사의 인사는 내가 해야겠지.
    ja: だから、お礼を言うのは私の方だ。
  d_nikke_arkrangerblack_05_34:
    speaker: "<Self>"
    en: It's me who should be grateful.
    ko: 내가 고맙다니까.
    ja: いや、私だ
  d_nikke_arkrangerblack_05_35:
    speaker: arkrangerblack
    en: No, I'm the one who's grateful.
    ko: 아니, 내가 고마워해야 할 일이다.
    ja: いや、私こそ感謝している。
  d_nikke_arkrangerblack_05_36:
    speaker: "<Self>"
    en: No, I'm more grateful.
    ko: 아니, 내가 고맙대도.
    ja: いや、私の方が…
  d_nikke_arkrangerblack_05_37:
    speaker: arkrangerblack
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arkrangerblack_05_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arkrangerblack_05_39:
    speaker: arkrangerblack
    en: At this rate, we'll never stop thanking each other.
    ko: 계속 서로 고맙다고 하기만 해선 끝이 없겠군.
    ja: 互いに感謝してばかりではキリがないな。
  d_nikke_arkrangerblack_05_40:
    speaker: "<Self>"
    en: True.
    ko: 그러게.
    ja: そうだな
  d_nikke_arkrangerblack_05_41:
    speaker: arkrangerblack
    en: Still... thank you for everyth...
    ko: 그래도 오늘까지 정말 고마….
    ja: だが、今日まで本当にありが…
  d_nikke_arkrangerblack_05_42:
    speaker: "<Self>"
    en: There you go thanking me again.
    ko: 또 고맙다고 하네.
    ja: また言っているぞ
  d_nikke_arkrangerblack_05_43:
    speaker: "<Self>"
    en: Want me to start up again too?
    ko: 나도 더 하면 돼?
    ja: 私ももっと言っていいか？
  d_nikke_arkrangerblack_05_44:
    speaker: arkrangerblack
    en: No, let's stop here.
    ko: 아니, 이젠 정말 여기까지만 하도록 하지.
    ja: いや、さすがにここまでにしよう。
  d_nikke_arkrangerblack_05_45:
    speaker: arkrangerblack
    en: I'll try to rein in my thanks.
    ko: 나도 자중하도록 하겠다.
    ja: 私ももうやめておく。
  d_nikke_arkrangerblack_05_46:
    speaker: "<Monologue>"
    en: Ark Ranger Black turns her head and looks out over the city.
    ko: 아크레인저 블랙은 고개를 돌려 시내를 둘러보았다.
    ja: |-
      アークレンジャー・ブラックは
      街をぐるっと見渡した
  d_nikke_arkrangerblack_05_47:
    speaker: arkrangerblack
    en: It's getting late enough that there aren't many people around.
    ko: 이제 돌아다니는 사람도 없는 시간이군.
    ja: もう歩き回る人々もいない時間だな。
  d_nikke_arkrangerblack_05_48:
    speaker: arkrangerblack
    en: That's it for today's patrol.
    ko: 이제 순찰은 끝내겠다.
    ja: これでパトロールは終わりだ。
  d_nikke_arkrangerblack_05_49:
    speaker: arkrangerblack
    en: We should head back ourselves.
    ko: 우리도 슬슬 돌아가도록 하지.
    ja: 私たちもそろそろ帰ろう。
  d_nikke_arkrangerblack_05_50:
    speaker: "<Self>"
    en: Black, before we go, can I ask you one more thing?
    ko: "…블랙, 가기 전에 한 가지만 더 물어봐도 될까?"
    ja: "…ブラック、その前に1つ聞いてもいいか？"
  d_nikke_arkrangerblack_05_51:
    speaker: arkrangerblack
    en: What is it?
    ko: 무엇을 말인가.
    ja: 何だ？
  d_nikke_arkrangerblack_05_52:
    speaker: "<Self>"
    en: What kind of hero do you want to become?
    ko: 블랙은 어떤 히어로가 되고 싶어?
    ja: 君は、どんなヒーローになりたいんだ？
  d_nikke_arkrangerblack_05_53:
    speaker: arkrangerblack
    en: The hero I want to be...
    ko: "…내가 되고 싶은 히어로…."
    ja: "…私は…"
  d_nikke_arkrangerblack_05_54:
    speaker: "<Monologue>"
    en: Ark Ranger Black falls into contemplation.
    ko: 아크레인저 블랙은 생각에 잠겼다.
    ja: アークレンジャー・ブラックは考え込んだ
  d_nikke_arkrangerblack_05_55:
    speaker: "<Monologue>"
    en: She quietly ruminates on the question for a long while.
    ko: 그리고 꽤 오랜 시간을 고민했다.
    ja: そして、かなりの時間が経過した
  d_nikke_arkrangerblack_05_56:
    speaker: arkrangerblack
    en: I want to become a hero who can step up for people.
    ko: 나는 사람들을 위해 나설 수 있는 히어로가 되고 싶다.
    ja: |-
      私は人々の先頭に立てる
      ヒーローになりたい。
  d_nikke_arkrangerblack_05_57:
    speaker: arkrangerblack
    en: Whether it's something big or small.
    ko: 큰 일이든, 작은 일이든.
    ja: 大きなことであれ、小さなことであれ。
  d_nikke_arkrangerblack_05_58:
    speaker: "<Self>"
    en: I understand.
    ko: 알겠어.
    ja: そうか
  d_nikke_arkrangerblack_05_59:
    speaker: arkrangerblack
    en: May I ask why you wanted to know that?
    ko: 혹시 왜 그런 질문을 했는지 물어봐도 되겠나?
    ja: 質問の意図を尋ねてもいいか？
  d_nikke_arkrangerblack_05_60:
    speaker: "<Self>"
    en: I guess I wanted to walk the same path you're on.
    ko: 나도 블랙이 바라보는 방향으로 함께 나아가고 싶다는 생각이 들어서 말이야.
    ja: |-
      私もブラックが見つめる方向へ
      一緒に進みたいと思ったんだ
  d_nikke_arkrangerblack_05_61:
    speaker: arkrangerblack
    en: Aren't we already doing that?
    ko: 우리는 이미 같은 방향을 바라보고 있지 않나.
    ja: |-
      私たちはすでに同じ方向を
      見つめている、そうだろう？
  d_nikke_arkrangerblack_05_62:
    speaker: arkrangerblack
    en: The heroic work we did together proved that.
    ko: 우리가 함께 했던 히어로 활동이 그 증거다.
    ja: 私たちが行った活動がその証拠だ。
  d_nikke_arkrangerblack_05_63:
    speaker: arkrangerblack
    en: Not just by being together, but through the way we think as well.
    ko: 단순히 같이 있기만 하는 게 아니라, 같은 생각을 하면서 말이지.
    ja: |-
      ただ一緒にいるだけでなく、
      一緒に考えながら行動しただろう？
  d_nikke_arkrangerblack_05_64:
    speaker: "<Self>"
    en: I suppose you're right.
    ko: 그 말도 맞네.
    ja: それはそうだな
  d_nikke_arkrangerblack_05_65:
    speaker: arkrangerblack
    en: Which is why...
    ko: 그래서 말이다만….
    ja: だから…
  d_nikke_arkrangerblack_05_66:
    speaker: arkrangerblack
    en: If you have time in the future, would you join me for more heroic work?
    ko: 혹시 다음에 또 시간이 되거든, 함께 히어로 활동을 해주지 않겠나?
    ja: |-
      また時間があったら、
      付き合ってくれないか？
  d_nikke_arkrangerblack_05_67:
    speaker: "<Self>"
    en: Whether it's something big or small?
    ko: 큰 일이든, 작은 일이든?
    ja: 大きなことであれ、小さなことであれ？
  d_nikke_arkrangerblack_05_68:
    speaker: "<Monologue>"
    en: Ark Ranger Black smiles.
    ko: 아크레인저 블랙이 웃는다.
    ja: アークレンジャー・ブラックは笑った
  d_nikke_arkrangerblack_05_69:
    speaker: arkrangerblack
    en: Yes. Whether it's something big or small.
    ko: 그렇다. 큰 일이든, 작은 일이든.
    ja: ああ。そうだな。
  d_nikke_arkrangerblack_05_70:
    speaker: "<Self>"
    en: Just call me anytime, and I'll come running.
    ko: 언제든 불러주면 달려갈게.
    ja: いつでも呼んでくれ。駆けつける
  d_nikke_arkrangerblack_05_71:
    speaker: arkrangerblack
    en: "... It seems I've found a reliable partner."
    ko: "…든든한 동료가 생겼군."
    ja: "…頼もしい仲間ができたな。"
  d_nikke_arkrangerblack_05_72:
    speaker: "<Monologue>"
    en: Together, we got up from the bench and quietly started walking under the glow
      of the streetlights.
    ko: 그렇게 우리는 벤치에서 일어나, 조용히 가로등 빛을 따라 걷기 시작했다.
    ja: |-
      私たちはベンチから立ち上がり、
      静かに街灯の光に沿って歩き始めた
  d_nikke_arkrangerblack_05_73:
    speaker: "<Monologue>"
    en: Tomorrow, next week, next month, or even years from now...
    ko: 내일도, 다음 주도, 다음 달도, 몇 년이 지난 뒤에도.
    ja: 明日も、来週も、来月も、数年後も…
  d_nikke_arkrangerblack_05_74:
    speaker: "<Monologue>"
    en: Ark Ranger Black will probably still be picking up trash in the park,
    ko: 아마 아크레인저 블랙은 공원에서 쓰레기를 줍고.
    ja: |-
      アークレンジャー・ブラックは、
      公園でゴミを拾い、
  d_nikke_arkrangerblack_05_75:
    speaker: "<Monologue>"
    en: patrolling the back alleys and city streets,
    ko: 뒷골목과 시내를 순찰하며.
    ja: 裏通りや市街地をパトロールしながら、
  d_nikke_arkrangerblack_05_76:
    speaker: "<Monologue>"
    en: and stepping forward to help someone once again.
    ko: 또 어딘가에서 발 벗고 나서고 있을 것이다.
    ja: またどこかで人々を救うのだろう
  d_nikke_arkrangerblack_05_77:
    speaker: "<Monologue>"
    en: Because she's the kind of hero who cherishes even the smallest things.
    ko: 아크레인저 블랙은 작은 것도 소중하게 여기는, 그런 히어로이니까.
    ja: |-
      アークレンジャー・ブラックは、
      そういうヒーローなのだから
