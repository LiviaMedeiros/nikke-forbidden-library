---
d_nikke_avistar_01:
  d_nikke_avistar_01_1:
    speaker: "<Self>"
    en: "*Snore*"
    ko: 쿨….
    ja: ぐう…
  d_nikke_avistar_01_2:
    speaker: "<Monologue>"
    en: Late one night, while everyone is asleep...
    ko: 늦은 밤, 모두가 잠든 시각.
    ja: 深夜、誰もが寝静まる頃
  d_nikke_avistar_01_3:
    speaker: "<Monologue>"
    en: I, too, am fast asleep after a long day's work.
    ko: 나 또한, 긴 업무를 끝내고 단잠에 빠져있던 중.
    ja: 私もまた長い仕事を終え、ぐっすりと眠っていた
  d_nikke_avistar_01_4:
    speaker: "<Narration>"
    en: "*Knock, knock, knock*"
    ko: 다다다다-!
    ja: ドンドンドンドン…！
  d_nikke_avistar_01_5:
    speaker: avistar
    en: This is Avistar of the inspection unit Overseer.
    ko: 감찰 부대 오버시어 소속, 아비스타.
    ja: 監察部隊オーバーシアーのアビスタです。
  d_nikke_avistar_01_6:
    speaker: avistar
    en: Commencing forced entry.
    ko: 문, 강제 개방합니다.
    ja: 扉の強制開放を行います。
  d_nikke_avistar_01_7:
    speaker: "<Narration>"
    en: "*Beep, beep*"
    ko: 삐빅-
    ja: ピピッ――
  d_nikke_avistar_01_8:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_avistar_01_9:
    speaker: "<Self>"
    en: Huh...?
    ko: 으어…?
    ja: なんだ…？
  d_nikke_avistar_01_10:
    speaker: "<Monologue>"
    en: Before I am even fully awake, Avistar starts sticking tape all over the Commander's
      Room.
    ko: |-
      잠에서 미처 깨기도 전,
      아비스타가 지휘관실의 곳곳에 테이프를 붙인다.
    ja: |-
      私の目も覚め切らないうちから、
      アビスタは指揮官室のあちこちに
      テープを貼っていく
  d_nikke_avistar_01_11:
    speaker: "<Self>"
    en: What are you...?
    ko: 갑자기 이게 무슨…?
    ja: なんなんだ急に…？
  d_nikke_avistar_01_12:
    speaker: avistar
    en: Apologies for interrupting your sleep, Person of Interest.
    ko: 특별 관리 대상님, 주무시는데 죄송해요.
    ja: |-
      特別管理対象様、
      お休みのところ申し訳ありません。
  d_nikke_avistar_01_13:
    speaker: avistar
    en: A routine inspection flagged some discrepancies in one of your reports.
    ko: |-
      정기 감사 중에 보고서에 정리된 내용과
      저희 쪽 전산망에 확인된 내용이 다른 걸 확인했어요.
    ja: |-
      定期監査中、報告書の内容と
      私たちのデータベースの情報に
      相違が発見されました。
  d_nikke_avistar_01_14:
    speaker: "<Self>"
    en: What? That's not possible...
    ko: 뭐? 그럴 리가….
    ja: 何？そんなはずは…
  d_nikke_avistar_01_15:
    speaker: avistar
    en: I didn't want to suspect you either...
    ko: 저도 특별 관리 대상님을 의심하고 싶지는 않지만….
    ja: |-
      私も特別管理対象様を
      疑いたくはありませんが…
  d_nikke_avistar_01_16:
    speaker: avistar
    en: However, there are several points of interest that I must confirm.
    ko: 확실히 이상한 부분들이 몇 가지 있어서, 확인이 필요해요.
    ja: |-
      不審な点がいくつかありましたので、
      確認が必要です。
  d_nikke_avistar_01_17:
    speaker: "<Self>"
    en: Sure, but did you have to do it so late at night?
    ko: 그건 알겠는데, 꼭 이 늦은 시간에 확인해야 하는 거야?
    ja: |-
      それは分かったが、
      こんな夜遅くにやる必要があるのか？
  d_nikke_avistar_01_18:
    speaker: avistar
    en: Hmm... As you know,
    ko: 으음… 잘 알고 계시겠지만.
    ja: そうですね…私から言うまでもありませんが。
  d_nikke_avistar_01_19:
    speaker: avistar
    en: no abnormalities have ever been detected when investigating you before, Person
      of Interest.
    ko: |-
      지금껏, 특별 관리 대상님을 조사했을 때
      이상한 것이 나왔던 적은 없었죠.
    ja: |-
      これまで、特別管理対象様に対する調査で
      問題が出たことはありませんでした。
  d_nikke_avistar_01_20:
    speaker: avistar
    en: Maybe that's why the higher-ups think they're on to something this time.
    ko: 그래서 그런가, 이번에 상부에서 한 건 잡았다고 생각하나 봐요.
    ja: |-
      それがかえって、上層部のほうで
      急な反応を招いたようですね。
  d_nikke_avistar_01_21:
    speaker: avistar
    en: I received orders to mobilize immediately.
    ko: 지금 바로 출동하라는 명령을 받았어요.
    ja: |-
      諸々の思惑がからんで、
      緊急立ち入り調査の命令が下りました。
  d_nikke_avistar_01_22:
    speaker: "<Self>"
    en: "*Sigh* What time is it?"
    ko: 하… 시간이 몇 시인데.
    ja: |-
      まったく…
      今、何時だと思っているんだ
  d_nikke_avistar_01_23:
    speaker: "<Monologue>"
    en: I get out of bed and walk over to the fridge.
    ko: 나는 침대에서 일어나 냉장고 앞으로 걸어갔다.
    ja: |-
      私はベッドから身を起こし、
      冷蔵庫を開けようとした
  d_nikke_avistar_01_24:
    speaker: "<Self>"
    en: Lemme get a glass of wa—
    ko: 일단 물 한 잔만….
    ja: とりあえず水を1杯…
  d_nikke_avistar_01_25:
    speaker: "<Narration>"
    en: "*Slap!*"
    ko: 챱!
    ja: バシン！
  d_nikke_avistar_01_26:
    speaker: "<Monologue>"
    en: Avistar sticks a piece of tape on the fridge.
    ko: 아비스타가, 냉장고에 테이프를 붙였다.
    ja: 冷蔵庫にテープを貼りつけられた
  d_nikke_avistar_01_27:
    speaker: avistar
    en: Sorry.
    ko: 죄송해요.
    ja: 申し訳ありません。
  d_nikke_avistar_01_28:
    speaker: avistar
    en: Until our investigation is complete, everything in this room is considered
      evidence and must be left undisturbed.
    ko: |-
      조사가 모두 끝나기 전까지,
      이 방에 있는 모든 것들은 증거품으로 남겨둬야 해서요.
    ja: |-
      調査完了まで、
      この部屋にあるものはすべて
      証拠として保全されなければなりません。
  d_nikke_avistar_01_29:
    speaker: avistar
    en: You're not allowed to touch anything.
    ko: 건드실 수 없어요.
    ja: お手を触れないでください。
  d_nikke_avistar_01_30:
    speaker: "<Self>"
    en: I can't even have a drink?
    ko: 물도 못 마셔?
    ja: 水も飲ませてくれないのか？
  d_nikke_avistar_01_31:
    speaker: avistar
    en: Allow me to get it for you.
    ko: 제가 꺼내드릴게요.
    ja: 私が取りだします。
  d_nikke_avistar_01_32:
    speaker: "<Monologue>"
    en: Avistar pulls out the water for me before continuing to stick tape on everything
      in the Commander's Room.
    ko: |-
      아비스타는 나에게 물을 건네주고는,
      지휘관실 안 곳곳에 테이프를 붙인다.
    ja: |-
      アビスタは私に水を渡すと、
      また指揮官室の隅々までテープを貼り始めた
  d_nikke_avistar_01_33:
    speaker: "<Self>"
    en: Hang on, that doesn't include my phone, does it?
    ko: 잠깐, 설마 내 휴대폰에도?
    ja: 待ってくれ、まさか携帯もか？
  d_nikke_avistar_01_34:
    speaker: avistar
    en: Of course it does.
    ko: 그럼요.
    ja: そうなります。
  d_nikke_avistar_01_35:
    speaker: "<Self>"
    en: Can I just send a quick text to Rapi?
    ko: 라피한테 연락 한 통만 넣으면 안 될까?
    ja: 一度だけラピに連絡させてもらえないか？
  d_nikke_avistar_01_36:
    speaker: avistar
    en: No.
    ko: 안 돼요.
    ja: 許可できません。
  d_nikke_avistar_01_37:
    speaker: avistar
    en: Tell me what you wish to send, and I'll type it.
    ko: 저에게 말씀해 주시면, 제가 보내둘게요.
    ja: |-
      伝えたいことがあるのでしたら、
      私から代わりにご連絡いたします。
  d_nikke_avistar_01_38:
    speaker: "<Monologue>"
    en: Classic inspection unit. They take this stuff pretty seriously.
    ko: |-
      역시 감찰 부대라 그런가,
      이럴 때는 확실하다.
    ja: |-
      さすがは監察部隊というべきか、
      こういう時は徹底している
  d_nikke_avistar_01_39:
    speaker: "<Self>"
    en: So all this tape... What happens if I touch it?
    ko: |-
      이 테이프 같은 거,
      건들면 어떻게 되는 거야?
    ja: |-
      特殊なテープのようだな、
      触るとどうなるんだ？
  d_nikke_avistar_01_40:
    speaker: avistar
    en: It's a specially made seal, so anyone who touches it will leave their fingerprints
      behind.
    ko: 특수 제작된 씰이라, 손을 대면 그 사람의 지문이 남게 돼요.
    ja: 触れたりすれば、痕跡が残ります。
  d_nikke_avistar_01_41:
    speaker: avistar
    en: It's the perfect tool for catching anyone guilty of insubordination or other
      crimes.
    ko: 항명죄나, 뭐 이런저런 죄를 묻기 딱 좋아지겠죠.
    ja: |-
      命令違反やらなにやら、諸々の罪名で
      訴追されることになるでしょう。
  d_nikke_avistar_01_42:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_01_43:
    speaker: "<Self>"
    en: Okay, fine. So what do you need me to do?
    ko: |-
      그래, 알았어.
      내가 뭘 하면 될까?
    ja: |-
      そうか、分かった。
      で、私は何をすればいい？
  d_nikke_avistar_01_44:
    speaker: avistar
    en: There are some things I need to verify, so your full cooperation would be
      appreciated.
    ko: |-
      확인이 필요한 부분들이 있으니,
      적극 협조해 주시면 돼요.
    ja: |-
      確認が必要な点がありますので、
      ご協力をお願いします。
  d_nikke_avistar_01_45:
    speaker: "<Self>"
    en: What happens if you find even a single problem?
    ko: 만약 문제가 하나라도 발견되면?
    ja: もし、ひとつでも不正が見つかったら？
  d_nikke_avistar_01_46:
    speaker: avistar
    en: Hmm...
    ko: 음….
    ja: そうですね…
  d_nikke_avistar_01_47:
    speaker: avistar
    en: My mission is only to discover problems, so I don't know for certain.
    ko: 문제를 발견하는 것까지가 저의 임무라서, 자세히는 모르겠지만.
    ja: |-
      違反の調査までが私の職務ですから、
      詳しいことは言えませんが…
  d_nikke_avistar_01_48:
    speaker: avistar
    en: All I know is that you won't get away with it.
    ko: 분명 좋게 넘어가지는 못하겠죠.
    ja: 面倒なことになるでしょう。
  d_nikke_avistar_01_49:
    speaker: "<Self>"
    en: I see.
    ko: 그렇구나.
    ja: だろうな
  d_nikke_avistar_01_50:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_01_51:
    speaker: avistar
    en: You look very relaxed.
    ko: 표정이 아무렇지도 않아 보이시네요.
    ja: ずいぶん穏やかですね。
  d_nikke_avistar_01_52:
    speaker: avistar
    en: Are you that confident?
    ko: 자신 있으신 건가요?
    ja: 自信がおありですか？
  d_nikke_avistar_01_53:
    speaker: "<Self>"
    en: Of course.
    ko: 당연하지.
    ja: 当然だ
  d_nikke_avistar_01_54:
    speaker: avistar
    en: Very well...
    ko: "…그렇군요."
    ja: "…そうですか。"
  d_nikke_avistar_01_55:
    speaker: avistar
    en: Then let us begin.
    ko: 알겠어요, 그럼 바로 첫 번째로 넘어갈게요.
    ja: |-
      分かりました。
      では、一点目の確認を行います。
  d_nikke_avistar_01_56:
    speaker: avistar
    en: My first question pertains to the medical kits provided for each mission.
    ko: 임무마다 지급되는 의료용 키트에 관한 거예요.
    ja: |-
      任務ごとに支給される
      医療用キットに関する確認です。
  d_nikke_avistar_01_57:
    speaker: avistar
    en: According to the report, you used more kits than you were allotted.
    ko: |-
      보고서에 따르면, 지급되는 의료용 키트보다
      더 많은 양을 소모한 것으로 되어있더군요.
    ja: |-
      報告書によると、支給された数を
      上回る量の医療用キットが
      消費されていることになります。
  d_nikke_avistar_01_58:
    speaker: "<Self>"
    en: Medical kits?
    ko: 의료용 키트가?
    ja: 医療用キット？
  d_nikke_avistar_01_59:
    speaker: avistar
    en: Of course, you're not using so many that it's a problem,
    ko: 물론, 크게 문제가 되는 양은 아니긴 한데요.
    ja: |-
      むろん、ただちに意図的な改ざんが
      疑われるような量ではありません。
  d_nikke_avistar_01_60:
    speaker: avistar
    en: but there could be someone obtaining supplies in secret, which is why I must
      ask.
    ko: |-
      뒤에서 몰래 자원을 조달해 주는 사람이 있을 수도 있어서,
      확인이 필요해요.
    ja: |-
      しかし、資源の調達過程で
      何か問題のある行為が存在する
      可能性があります。
  d_nikke_avistar_01_61:
    speaker: "<Self>"
    en: Sure, I get it.
    ko: 응, 이해했어.
    ja: なるほど、話は分かった
  d_nikke_avistar_01_62:
    speaker: "<Self>"
    en: In order to do that, we'll have to go see Rapi.
    ko: 이걸 확인하려면, 일단 라피를 만나야 할 것 같은데.
    ja: そういうことなら、ラピに聞けばいい
  d_nikke_avistar_01_63:
    speaker: avistar
    en: Rapi?
    ko: 라피요?
    ja: ラピですか？
  d_nikke_avistar_01_64:
    speaker: avistar
    en: All right. I'll go with you.
    ko: 좋아요, 동행할 테니 함께 가죠.
    ja: |-
      分かりました。
      私も同行しますので、行きましょう。
  d_nikke_avistar_01_65:
    speaker: "<Monologue>"
    en: Despite the late hour,
    ko: 우리는 많이 늦은 시간이었지만.
    ja: すでに夜も更けていたが…
  d_nikke_avistar_01_66:
    speaker: "<Monologue>"
    en: we go to Rapi's room.
    ko: 함께 라피의 방으로 향했다.
    ja: 私たちはラピの部屋へ向かった
d_nikke_avistar_02:
  d_nikke_avistar_02_1:
    speaker: "<Narration>"
    en: "*Knock, knock*"
    ko: 똑똑.
    ja: コンコン――
  d_nikke_avistar_02_2:
    speaker: avistar
    en: Hello, Rapi.
    ko: 라피, 안녕하세요.
    ja: 夜分失礼します、ラピ。
  d_nikke_avistar_02_3:
    speaker: avistar
    en: This is Avistar of the inspection unit Overseer.
    ko: 감찰 부대 오버시어 소속, 아비스타입니다.
    ja: |-
      監察部隊オーバーシアーの
      アビスタです。
  d_nikke_avistar_02_4:
    speaker: avistar
    en: We're here to confirm something related to the investigation into Commander
      @UserName.
    ko: |-
      특별 관리 대상 @UserName 지휘관을 감찰하던 중,
      확인이 필요한 부분이 생겨서 방문했는데요.
    ja: |-
      特別管理対象@UserName指揮官に対する
      立ち入り調査中でして、
      お尋ねしたいことがあります。
  d_nikke_avistar_02_5:
    speaker: "<Monologue>"
    en: There's no response.
    ko: 아무런 반응이 없다.
    ja: 何の反応もない
  d_nikke_avistar_02_6:
    speaker: avistar
    en: Hmm, she must be asleep.
    ko: 음, 주무시나 보네요.
    ja: ふーむ、ご就寝中のようですね。
  d_nikke_avistar_02_7:
    speaker: "<Monologue>"
    en: Surely she heard all that.
    ko: "…분명 소리를 들었을 텐데."
    ja: "…声は聞こえているはずだ"
  d_nikke_avistar_02_8:
    speaker: "<Self>"
    en: Rapi.
    ko: 라피.
    ja: ラピ
  d_nikke_avistar_02_9:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_avistar_02_10:
    speaker: rapi_red
    en: Yes, Commander?
    ko: 지휘관, 부르셨습니까.
    ja: 指揮官、お呼びでしょうか。
  d_nikke_avistar_02_11:
    speaker: "<Self>"
    en: Oh... Sorry to bother you so late.
    ko: 아… 늦은 시간에 미안해.
    ja: ああ…こんな夜遅くにすまないが
  d_nikke_avistar_02_12:
    speaker: rapi_red
    en: It's all right.
    ko: 아뇨, 괜찮습니다.
    ja: いえ、お気になさらず。
  d_nikke_avistar_02_13:
    speaker: rapi_red
    en: In fact, I welcome visits from you at this hour.
    ko: 이 시간이면 오히려 언제든 환영입니다.
    ja: こんな時間の訪問こそ、いつでも歓迎です。
  d_nikke_avistar_02_14:
    speaker: "<Self>"
    en: What was that?
    ko: 뭐라고?
    ja: え？
  d_nikke_avistar_02_15:
    speaker: rapi_red
    en: I know you heard me.
    ko: 다 들으신 것 알고 있습니다.
    ja: 分かってるくせに…
  d_nikke_avistar_02_16:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_02_17:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_02_18:
    speaker: rapi_red
    en: So, what brings you here?
    ko: 그래서, 무슨 일이십니까?
    ja: それで、用件は？
  d_nikke_avistar_02_19:
    speaker: "<Self>"
    en: Oh...!
    ko: 아…!
    ja: ああ…
  d_nikke_avistar_02_20:
    speaker: "<Self>"
    en: Apparently there's a report saying we used more medical kits than were allotted
      to us.
    ko: |-
      그, 의료용 키트가 보급받은 것보다 더 많이 소모된 것으로
      보고서가 작성되었다고 해.
    ja: |-
      報告書にある医療用キットの消費量が
      補給された数より多いらしい
  d_nikke_avistar_02_21:
    speaker: rapi_red
    en: What?
    ko: 예?
    ja: え？
  d_nikke_avistar_02_22:
    speaker: rapi_red
    en: That can't be. I know I checked...
    ko: 그럴 리가 없습니다, 분명 다 체크했습니다만….
    ja: |-
      そんなことは考えられません。
      きちんと確認したはず…
  d_nikke_avistar_02_23:
    speaker: rapi_red
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_02_24:
    speaker: rapi_red
    en: What if this is a ploy to drag you away in the middle of the night?
    ko: |-
      이 야심한 시간에 지휘관을 끌어내기 위한
      누군가의 계략일 수도 있지 않을까요?
    ja: こんな時間に指揮官を連れ出すための策略…？
  d_nikke_avistar_02_25:
    speaker: avistar
    en: N-no, it's not!
    ko: 그, 그렇지 않아요!
    ja: そ、そういうものではありません！
  d_nikke_avistar_02_26:
    speaker: avistar
    en: We have supporting documents.
    ko: 저희도 자료가 다 남아 있다구요.
    ja: 私たちの資料とつじつまが合わないのです。
  d_nikke_avistar_02_27:
    speaker: rapi_red
    en: May I see those documents?
    ko: 그 자료, 한 번 볼 수 있을까?
    ja: その資料、見せてもらえる？
  d_nikke_avistar_02_28:
    speaker: avistar
    en: Certainly.
    ko: 예.
    ja: はい。
  d_nikke_avistar_02_29:
    speaker: "<Monologue>"
    en: Avistar pulls out a tablet and shows us.
    ko: 아비스타는 태블릿을 꺼내 보여주었다.
    ja: アビスタはタブレットを取り出し、画面を見せた
  d_nikke_avistar_02_30:
    speaker: rapi_red
    en: It is true...
    ko: "…정말이군요."
    ja: "…本当ね。"
  d_nikke_avistar_02_31:
    speaker: rapi_red
    en: That's the report I wrote, and I remember the quantity.
    ko: |-
      제가 쓴 보고서도 맞고,
      수량 역시 기억하고 있습니다.
    ja: |-
      これは間違いなく私が作った報告書で、
      数も覚えているわ。
  d_nikke_avistar_02_32:
    speaker: "<Self>"
    en: That's odd. You're not the type to make a mistake like that.
    ko: 라피가 이런 거에서 실수를 할 성격도 아니고, 이상하네.
    ja: ラピが何かするとも思えないし、妙だな
  d_nikke_avistar_02_33:
    speaker: rapi_red
    en: Hmm...
    ko: 흠….
    ja: ふむ…
  d_nikke_avistar_02_34:
    speaker: rapi_red
    en: Oh, Commander.
    ko: 아, 지휘관.
    ja: ああ、指揮官。
  d_nikke_avistar_02_35:
    speaker: rapi_red
    en: Do you think it's related to those things?
    ko: 혹시 그거 아닐까요?
    ja: もしかして、アレが原因では？
  d_nikke_avistar_02_36:
    speaker: "<Self>"
    en: By those things you mean...?
    ko: 그거라고 한다면….
    ja: アレと言うのは…
  d_nikke_avistar_02_37:
    speaker: "<Self>"
    en: Oh, those things that look just like the other thing!
    ko: 아, 되게 헷갈렸다던 그거?!
    ja: ああ、ものすごく紛らわしかったアレか！？
  d_nikke_avistar_02_38:
    speaker: rapi_red
    en: Yes, those things.
    ko: 예, 그거.
    ja: はい、そのアレです。
  d_nikke_avistar_02_39:
    speaker: avistar
    en: Th-those things...?!
    ko: 그, 그거…?!
    ja: 失礼、アレとは…！？
  d_nikke_avistar_02_40:
    speaker: avistar
    en: Don't tell me...! So somebody really was secretly receiving supplies?
    ko: 설마…! 뒤에서 몰래 자원을 받았다거나, 빼돌렸다거나.
    ja: |-
      まさか…！
      誰かから帳簿にないものを受け取っていたり、
      横流しされたりとか…
  d_nikke_avistar_02_41:
    speaker: avistar
    en: Is that what's happening?!
    ko: 그랬던 건가요?!
    ja: そういうことではありませんね！？
  d_nikke_avistar_02_42:
    speaker: rapi_red
    en: No.
    ko: 아니야.
    ja: 違うわ。
  d_nikke_avistar_02_43:
    speaker: rapi_red
    en: I think I know what's the issue.
    ko: 아마, 이것 때문이 아닐까 싶어.
    ja: たぶん、これのせい。
  d_nikke_avistar_02_44:
    speaker: "<Monologue>"
    en: Rapi goes and gets a familiar-looking white box.
    ko: 라피는, 익숙하게 생긴 흰 상자를 꺼내 왔다.
    ja: ラピは私たちが良く知る白い箱を取り出した
  d_nikke_avistar_02_45:
    speaker: avistar
    en: This is...
    ko: 이건….
    ja: これは…
  d_nikke_avistar_02_46:
    speaker: avistar
    en: One of your allotted medical kits.
    ko: 보급받은 의료용 키트네요.
    ja: 支給品の医療用キットですね。
  d_nikke_avistar_02_47:
    speaker: rapi_red
    en: You think it looks like one too, don't you?
    ko: 아비스타도 그렇게 보이는구나.
    ja: アビスタでもそう見えるのね。
  d_nikke_avistar_02_48:
    speaker: avistar
    en: What? You mean it's not?
    ko: 예? 아닌가요?
    ja: え？違うのですか？
  d_nikke_avistar_02_49:
    speaker: avistar
    en: Then what is it?
    ko: 그럼 이건 뭐죠?
    ja: すると、これはいったい？
  d_nikke_avistar_02_50:
    speaker: "<Narration>"
    en: "*Clack*"
    ko: 달칵-
    ja: パカッ
  d_nikke_avistar_02_51:
    speaker: "<Monologue>"
    en: Inside the white box is an enormous machine.
    ko: 흰 상자를 열자, 그 안에는 커다란 기계 하나가 들어있다.
    ja: |-
      白い箱を開くと、
      中に大きな装置がひとつ入っている
  d_nikke_avistar_02_52:
    speaker: avistar
    en: Oh...
    ko: 어….
    ja: これは…
  d_nikke_avistar_02_53:
    speaker: avistar
    en: It's a power reserve.
    ko: 예비 동력 장치네요.
    ja: 予備電源ですね。
  d_nikke_avistar_02_54:
    speaker: avistar
    en: I believe it's used on the surface to quickly recharge Nikkes' batteries when
      they run low.
    ko: |-
      지상에서 니케들의 배터리가 떨어졌을 때,
      급하게 충전하는 용도인 걸로 알고 있는데요.
    ja: |-
      地上で消耗しすぎたニケのエネルギーを
      緊急で補うために使うものだと聞いています。
  d_nikke_avistar_02_55:
    speaker: rapi_red
    en: That's right.
    ko: 맞아.
    ja: その通りよ。
  d_nikke_avistar_02_56:
    speaker: rapi_red
    en: We always take it with us just in case.
    ko: 혹시 모를 사태를 대비해서 매번 챙겨가고 있어.
    ja: 万が一のために、常備しているの。
  d_nikke_avistar_02_57:
    speaker: avistar
    en: Where did this come from?
    ko: 이게 어디서 난 건데요?
    ja: これの調達資金はどこから？
  d_nikke_avistar_02_58:
    speaker: "<Self>"
    en: I bought it with my personal funds.
    ko: 내가 사비로 산 거야.
    ja: 私が自費で購入している
  d_nikke_avistar_02_59:
    speaker: avistar
    en: What? Why?
    ko: 예? 왜요?
    ja: え？なぜでしょう？
  d_nikke_avistar_02_60:
    speaker: avistar
    en: You could just put in a request for one.
    ko: 보급 신청을 하시면 되는 것 아닌가요?
    ja: 補給の申請をすれば済む話では？
  d_nikke_avistar_02_61:
    speaker: "<Self>"
    en: The process for requesting additional supplies is a big pain.
    ko: 추가용 물자 보급 신청은, 과정이 제법 귀찮거든.
    ja: |-
      通常の補給品リストになくて
      手続きがかなり面倒になるからな
  d_nikke_avistar_02_62:
    speaker: avistar
    en: Still, spending your own money...
    ko: 아무리 그래도 사비로 사실 것까지는….
    ja: しかし、いくら何でも自費で購入する必要は…
  d_nikke_avistar_02_63:
    speaker: "<Self>"
    en: It's dangerous if a Nikke's battery suddenly runs low.
    ko: 배터리가 갑자기 떨어지면 위험하잖아.
    ja: 大事な時に動けなくなったら困るだろう？
  d_nikke_avistar_02_64:
    speaker: avistar
    en: I'll grant you that...
    ko: "…하긴."
    ja: "…それはそうですが。"
  d_nikke_avistar_02_65:
    speaker: avistar
    en: Given how often you go to the surface, I suppose it would put you danger.
    ko: |-
      지상에 자주 올라가시는
      특별 관리 대상자님 입장에서는 그러실 수 있겠네요.
    ja: |-
      地上での長期滞在や激戦が多い
      特別管理対象様には
      やむを得ない必需品ということですか。
  d_nikke_avistar_02_66:
    speaker: "<Self>"
    en: No, not me.
    ko: 아니, 나 말고.
    ja: まあ、私自身というより…
  d_nikke_avistar_02_67:
    speaker: "<Self>"
    en: I meant it's dangerous for the Nikkes.
    ko: 니케들이 위험하다고.
    ja: ニケたちが大変なことになるからな
  d_nikke_avistar_02_68:
    speaker: avistar
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_avistar_02_69:
    speaker: rapi_red
    en: I must've gotten mixed up while writing that report.
    ko: 보고서를 작성하던 중에, 헷갈렸던 것 같아.
    ja: やはり報告書を作る時、誤認していたようね。
  d_nikke_avistar_02_70:
    speaker: rapi_red
    en: As you can see, its new packaging looks very similar to the medical kits.
    ko: |-
      보면 알겠지만, 이번에 바뀐 패키지가
      의료용 키트랑 너무 비슷해졌거든.
    ja: |-
      見て分かる通り、最近パッケージが変わって
      医療用キットと見分けが
      つきにくくなってしまったの。
  d_nikke_avistar_02_71:
    speaker: rapi_red
    en: One, two three, four...
    ko: 하나, 둘, 셋, 넷….
    ja: いち、に、さん、し…
  d_nikke_avistar_02_72:
    speaker: rapi_red
    en: Yes, the number works out.
    ko: 응, 개수도 맞아.
    ja: 間違いなく、これで数も合うはずよ。
  d_nikke_avistar_02_73:
    speaker: rapi_red
    en: It was my mistake. I apologize.
    ko: 내가 실수했어, 미안해.
    ja: 私のミスね。申し訳ないわ。
  d_nikke_avistar_02_74:
    speaker: avistar
    en: B-but this...
    ko: 그, 그런….
    ja: そ、そうでしたか…
  d_nikke_avistar_02_75:
    speaker: rapi_red
    en: Commander, I apologize for causing a commotion.
    ko: 지휘관, 놀라게 해드려 죄송합니다.
    ja: 指揮官。ご迷惑をおかけしました。
  d_nikke_avistar_02_76:
    speaker: "<Self>"
    en: No, it's perfectly reasonable.
    ko: 아냐, 그럴 수도 있지.
    ja: 気にするな、そういうこともある
  d_nikke_avistar_02_77:
    speaker: avistar
    en: I-is this what the Commando Unit is like?
    ko: "…이, 이게 바로 특수별동대…?"
    ja: "…なるほど、これが特殊別働隊の…？"
  d_nikke_avistar_02_78:
    speaker: avistar
    en: Ah...! No, now's not the time.
    ko: 아…! 이게 아니지.
    ja: あっと…！感心している場合ではありません。
  d_nikke_avistar_02_79:
    speaker: avistar
    en: Just to be safe, I'm going to take this and have a look.
    ko: 혹시 모르니 이것들은 회수해서 확인해 볼게요.
    ja: |-
      念のため、こちらは一度預かって、
      確認させていただきます。
  d_nikke_avistar_02_80:
    speaker: avistar
    en: Please hand over the purchase details and receipt too.
    ko: 구매 내역 및 영수증도 함께 전달 부탁드려요.
    ja: |-
      あわせて購入品のリストと領収書も
      再提出をお願いします。
  d_nikke_avistar_02_81:
    speaker: "<Self>"
    en: Sure.
    ko: 알겠어.
    ja: 分かった
  d_nikke_avistar_02_82:
    speaker: avistar
    en: Ahem!
    ko: 크흠!
    ja: オホンッ！
  d_nikke_avistar_02_83:
    speaker: avistar
    en: Time for the second point of interest.
    ko: 그럼 두 번째로 넘어갈게요.
    ja: では、2点目の確認に向かいましょう。
d_nikke_avistar_03:
  d_nikke_avistar_03_1:
    speaker: avistar
    en: The second matter relates to the Outpost's energy consumption.
    ko: 두 번째는, 전초기지의 전력 소모량이 대해서예요.
    ja: 2点目は、前哨基地の電力消費量です。
  d_nikke_avistar_03_2:
    speaker: avistar
    en: You use roughly 10% more energy each month than the average squad.
    ko: 평균적인 부대의 소모량보다 매달 10%가량 더 많이 사용하고 있어요.
    ja: |-
      推定される消費量に比べ、
      毎月10％ほど多いようですね。
  d_nikke_avistar_03_3:
    speaker: avistar
    en: The other buildings are fine. The issue is with the building that houses the
      Commander's Room and the Nikkes' dorms.
    ko: |-
      다른 건물들은 문제가 없는데,
      지휘관실과 니케 분들의 숙소가 있는 이 건물.
    ja: |-
      他は問題ないようですが、
      指揮官室とニケの宿所がある、この建築物…
  d_nikke_avistar_03_4:
    speaker: avistar
    en: It appears the Command Center consumes the highest energy.
    ko: 커맨드 센터가 엄청 많은 전력을 사용 중이더라고요.
    ja: |-
      コマンドセンターが単独で
      その原因になっているようです。
  d_nikke_avistar_03_5:
    speaker: "<Self>"
    en: Is that a problem?
    ko: 그게 문제가 되는 거야?
    ja: それが何か問題になるのか？
  d_nikke_avistar_03_6:
    speaker: avistar
    en: Umm...
    ko: 음….
    ja: そうですね…
  d_nikke_avistar_03_7:
    speaker: avistar
    en: To be blunt, you could have set up a suspicious lab inside this building.
    ko: 막말로, 이 건물 안에 수상한 실험실을 만들었다거나.
    ja: |-
      たとえば、未許可の
      実験室などを秘密で作っているとか。
  d_nikke_avistar_03_8:
    speaker: avistar
    en: You could also be stealing electricity and using it for something dangerous.
    ko: 하는 식으로, 전기를 빼서 위험한 곳에 사용하고 계실 수도 있으니까요.
    ja: |-
      消費電力の多い理由が、
      不法な活動である可能性も否定できません。
  d_nikke_avistar_03_9:
    speaker: "<Self>"
    en: Nobody's said anything before. Why now...?
    ko: 지금까지 아무 말 없다가, 왜 이제 와서…?
    ja: |-
      今まで何も言われていなかったと思うが、
      なぜ今になって…？
  d_nikke_avistar_03_10:
    speaker: avistar
    en: Recently, the Ark has been trying harder to manage its energy and resource
      use.
    ko: 요새, 방주의 에너지와 자원 관리에 좀 힘쓰고 계시거든요.
    ja: |-
      最近、アークはエネルギーや資源の管理を
      厳格化しています。
  d_nikke_avistar_03_11:
    speaker: avistar
    en: Since we're investigating you anyway, we might as well look into this too.
    ko: 확인할 게 생긴 김에, 같이 알아보면 좋으니까요.
    ja: |-
      確認することができたので、
      この際調査しておこうというわけでしょう。
  d_nikke_avistar_03_12:
    speaker: "<Self>"
    en: How do you check that sort of thing?
    ko: 이런 경우는 어떻게 확인하는 거야?
    ja: どうやって調べるんだ？
  d_nikke_avistar_03_13:
    speaker: avistar
    en: I'll scan the building's power terminals.
    ko: 이 건물의 전력 단자를 스캔할 거예요.
    ja: 配電システムのスキャンを行います。
  d_nikke_avistar_03_14:
    speaker: avistar
    en: If I find anything suspicious, I can trace where that energy is going.
    ko: |-
      그리고, 수상한 곳이 있으면
      그 전력이 어디로 통하는지 확인하는 거죠.
    ja: |-
      不審な点が見つかれば、電力の流れを追って
      直接確認することになりますね。
  d_nikke_avistar_03_15:
    speaker: "<Self>"
    en: Oh, I see.
    ko: 오호.
    ja: なるほどな
  d_nikke_avistar_03_16:
    speaker: avistar
    en: Then I'll begin verifying.
    ko: 그럼, 확인할게요.
    ja: では、調査を開始します。
  d_nikke_avistar_03_17:
    speaker: "<Monologue>"
    en: Avistar sets up a large, suspicious-looking machine.
    ko: 아비스타는 수상하게 생긴 커다란 기계를 뚝딱이며 설치하더니.
    ja: アビスタは怪しげな大ぶりの装置を組み立てた
  d_nikke_avistar_03_18:
    speaker: "<Monologue>"
    en: She soon picks it up and begins to carry it around the inside of the building.
    ko: 이내, 그 기계를 들고 건물 안을 돌아다니기 시작했다.
    ja: それを持ち、建物の中を歩いていく
  d_nikke_avistar_03_19:
    speaker: "<Monologue>"
    en: A short while later...
    ko: 잠시 후.
    ja: しばらく…
  d_nikke_avistar_03_20:
    speaker: "<Monologue>"
    en: Or rather a long while later...
    ko: "…라고 하기에는 제법 긴 시간이 흘렀다."
    ja: "…と言うには長すぎる時間が経った"
  d_nikke_avistar_03_21:
    speaker: "<Self>"
    en: The sun's coming up. How much longer will this take?
    ko: 해 뜨고 있는데, 언제 끝나는 거야?
    ja: もう夜も明けそうだが、いつ終わるんだ？
  d_nikke_avistar_03_22:
    speaker: "<Self>"
    en: I'm so sleepy...
    ko: 나 너무 졸려….
    ja: 眠気が限界だ…
  d_nikke_avistar_03_23:
    speaker: avistar
    en: Hmm...!
    ko: 으으음…!
    ja: むむむ…！
  d_nikke_avistar_03_24:
    speaker: avistar
    en: Scan complete.
    ko: 다 끝났어요.
    ja: 終わりました。
  d_nikke_avistar_03_25:
    speaker: "<Self>"
    en: Did you find anything suspicious?
    ko: 이상한 건 찾았고?
    ja: 怪しいところは見つかったのか？
  d_nikke_avistar_03_26:
    speaker: avistar
    en: Yes, I did.
    ko: 예, 찾았어요.
    ja: はい、特定できています。
  d_nikke_avistar_03_27:
    speaker: avistar
    en: I found a suspicious stream of energy that none of the other buildings show.
    ko: |-
      다른 건물에는 없는, 수상한 전력 하나가
      따로 빠져서 이어지고 있는 걸 확인했어요.
    ja: |-
      普通の建物にはない、おかしな電力の流れが
      発生している場所がありました。
  d_nikke_avistar_03_28:
    speaker: avistar
    en: Let's go check it out.
    ko: 확인하러 가보죠.
    ja: これから確認に向かいます。
  d_nikke_avistar_03_29:
    speaker: "<Monologue>"
    en: Avistar walks with a determined expression,
    ko: 아비스타는 비장한 표정으로 걸어갔고.
    ja: アビスタが引き締まった顔つきで歩きだした
  d_nikke_avistar_03_30:
    speaker: "<Monologue>"
    en: as I follow behind.
    ko: 나는 그 뒤를 따라갔다.
    ja: 私はその後を追った
  d_nikke_avistar_03_31:
    speaker: avistar
    en: It's coming from here.
    ko: 여기군요.
    ja: ここですね。
  d_nikke_avistar_03_32:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_03_33:
    speaker: "<Self>"
    en: Why are you so nervous? Are you worried I might actually have a secret laboratory?
    ko: |-
      왜 그렇게 긴장해,
      진짜 숨겨진 실험실이라도 있을까 봐?
    ja: |-
      なぜそんなに緊張している？
      本当に実験室でもあると思っているのか？
  d_nikke_avistar_03_34:
    speaker: avistar
    en: N-no, but...
    ko: 그, 그건 아니지만….
    ja: そ、そうではありませんが…
  d_nikke_avistar_03_35:
    speaker: avistar
    en: If, just if, I really do discover something suspicious,
    ko: 혹시나, 만약에라도 수상한 게 발견된다면.
    ja: 万が一にも何か見つかったら…
  d_nikke_avistar_03_36:
    speaker: avistar
    en: it could really be bad for Anis.
    ko: 아니스에게 안 좋을 테니까요.
    ja: アニスにとってよくありませんから。
  d_nikke_avistar_03_37:
    speaker: "<Self>"
    en: Oh, so that's why.
    ko: 아, 그런 이유였구나.
    ja: なるほど、そういうことか
  d_nikke_avistar_03_38:
    speaker: "<Self>"
    en: Don't worry. Anis uses it the most.
    ko: 걱정 마, 아니스가 제일 잘 애용하니까.
    ja: |-
      心配するな、
      たぶん一番使っているのはアニスだ
  d_nikke_avistar_03_39:
    speaker: avistar
    en: What? She does?
    ko: 예? 아니스가요?
    ja: え？どういうことですか？
  d_nikke_avistar_03_40:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_avistar_03_41:
    speaker: "<Monologue>"
    en: Avistar opens the door without hesitation.
    ko: 아비스타가 망설임 없이 문을 열었다.
    ja: アビスタは思い切りよく扉を開けた
  d_nikke_avistar_03_42:
    speaker: avistar
    en: Wh-what in the world?!
    ko: 이, 이건…!
    ja: こ、これは…！
  d_nikke_avistar_03_43:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_03_44:
    speaker: avistar
    en: What is this?
    ko: 이건 뭐죠?
    ja: 何ですか？
  d_nikke_avistar_03_45:
    speaker: "<Monologue>"
    en: Inside the room is a large tank with a handle.
    ko: 방 안에 있는, 핸들이 달린 거대한 통.
    ja: |-
      扉の向こうには、
      ハンドルがついた大きな筒状の装置がある
  d_nikke_avistar_03_46:
    speaker: "<Narration>"
    en: "*Sizzle*"
    ko: 치이이-
    ja: プシューッ…！
  d_nikke_avistar_03_47:
    speaker: "<Monologue>"
    en: Something like hot vapor wafts out from it.
    ko: 그 안에서는 뜨거운 연기 같은 것도 나오고 있다.
    ja: 中から熱気を帯びた蒸気が噴き出した
  d_nikke_avistar_03_48:
    speaker: "<Narration>"
    en: "*Step, step*"
    ko: 저벅- 저벅-
    ja: スタスタ――
  d_nikke_avistar_03_49:
    speaker: anis_i
    en: "*Yawn*"
    ko: 흐아암….
    ja: ふわぁ…
  d_nikke_avistar_03_50:
    speaker: anis_i
    en: Huh? What the...?
    ko: 응? 뭐야.
    ja: あれ？何かしら。
  d_nikke_avistar_03_51:
    speaker: anis_i
    en: What are you guys doing here?
    ko: 아비스타랑 지휘관님이 왜 여기에 있어?
    ja: |-
      アビスタと指揮官様が
      なんでこんな所にいるの？
  d_nikke_avistar_03_52:
    speaker: avistar
    en: A-Anis!
    ko: 아, 아니스!
    ja: ア、アニス！
  d_nikke_avistar_03_53:
    speaker: avistar
    en: That's my question for you. What are you doing here?
    ko: 아니스야말로 여기엔 왜….
    ja: あなたの方こそ、なぜここに…
  d_nikke_avistar_03_54:
    speaker: anis_i
    en: Obviously, I came here to open this.
    ko: 나는 당연히, 이거 열려고 왔지.
    ja: トーゼン、これに用があるの。
  d_nikke_avistar_03_55:
    speaker: avistar
    en: Do you mean this big tank?
    ko: 이거라고 하시면, 이 큰 통이요?
    ja: これというのは、この大きな装置のことですね？
  d_nikke_avistar_03_56:
    speaker: avistar
    en: By the way, what is this thing?
    ko: 말 나온 김에, 대체 이건 뭔가요?
    ja: これはいったい何ですか？
  d_nikke_avistar_03_57:
    speaker: avistar
    en: You're not doing any strange experiments, are you?
    ko: 이상한 실험 같은 걸 하고 계시는 건 아니죠?
    ja: まさか、未許可の実験装置などでは？
  d_nikke_avistar_03_58:
    speaker: anis_i
    en: Huh? What are you talking about?
    ko: 뭐? 갑자기 그게 뭔 소리야.
    ja: え？なんの話よ。
  d_nikke_avistar_03_59:
    speaker: anis_i
    en: Step aside, please. I need some hot water.
    ko: 일단 비켜봐, 따뜻한 물 받아야 하니까.
    ja: |-
      とりあえずどいてもらえる？
      お湯をくまなきゃいけないから。
  d_nikke_avistar_03_60:
    speaker: avistar
    en: Hot water...?
    ko: 따뜻한 물…?
    ja: お湯…？
  d_nikke_avistar_03_61:
    speaker: anis_i
    en: Yeah, we're only getting cold water again.
    ko: 응, 또 찬물 밖에 안 나오거든.
    ja: |-
      そう。また冷たい水しか
      出なくなっちゃったのよ。
  d_nikke_avistar_03_62:
    speaker: "<Monologue>"
    en: Anis steps inside and turns the handle.
    ko: 아니스는 안으로 들어가, 핸들을 돌렸다.
    ja: アニスが装置のハンドルを回した
  d_nikke_avistar_03_63:
    speaker: "<Narration>"
    en: "*Squeak, squeak*"
    ko: 끼릭- 끼릭-
    ja: キコキコ…
  d_nikke_avistar_03_64:
    speaker: anis_i
    en: Perfect!
    ko: 좋았어!
    ja: うん、バッチリ！
  d_nikke_avistar_03_65:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_03_66:
    speaker: avistar
    en: Anis, is this...
    ko: 아니스, 혹시 이거….
    ja: アニス。もしかしてこれは…
  d_nikke_avistar_03_67:
    speaker: avistar
    en: some sort of machine... that makes hot water for showers?
    ko: 샤워할 때 쓰는 온수 만드는 기계… 뭐 그런 건가요?
    ja: |-
      シャワーなどに使う湯沸かし器…
      ということですか？
  d_nikke_avistar_03_68:
    speaker: anis_i
    en: Well, something like that.
    ko: 뭐, 비슷해.
    ja: まあ、そんなとこね。
  d_nikke_avistar_03_69:
    speaker: anis_i
    en: The Commander's Room is okay, but even after our bathroom got fixed, we still
      only get cold water.
    ko: |-
      지휘관님 방은 괜찮은데,
      우리 숙소는 고쳐도 한 번씩 차가운 물이 나오더라고.
    ja: |-
      指揮官様の部屋だけ大丈夫みたいだけど、
      私たちの宿所って直しても直しても
      よくお湯が出なくなるのよ。
  d_nikke_avistar_03_70:
    speaker: anis_i
    en: My room is especially the worst!
    ko: 특히! 내 방이 제일 자주 고장 나.
    ja: |-
      まったく！よりによって
      私の部屋のが一番よく壊れるのよね。
  d_nikke_avistar_03_71:
    speaker: anis_i
    en: So the Commander made us this hot water tank with his own money!
    ko: |-
      그래서~ 지휘관님이 사비로 만들어 준
      온수용 물탱크야!
    ja: |-
      で…指揮官様が自腹を切って
      この温水タンクを置いてくれたってわけ！
  d_nikke_avistar_03_72:
    speaker: anis_i
    en: You just turn the handle before you use it, and fill it up with water afterwards.
    ko: |-
      쓰기 전에 핸들 돌려주고,
      나중에 다시 물만 채워두면 돼.
    ja: |-
      使う時はハンドルを回して、
      あとで水を補充すればいいの。
  d_nikke_avistar_03_73:
    speaker: anis_i
    en: Pretty cool, huh?
    ko: 어때? 대박이지!
    ja: どう？けっこう便利でしょ！
  d_nikke_avistar_03_74:
    speaker: avistar
    en: N-no kidding.
    ko: 그, 그렇네요.
    ja: そ、そうですね。
  d_nikke_avistar_03_75:
    speaker: "<Self>"
    en: You probably don't realize, since you're always in the Ark,
    ko: 아비스타는 보통 방주에 있으니까 몰랐나 봐.
    ja: |-
      アビスタはいつもアークにいるから
      知らなかったようだな
  d_nikke_avistar_03_76:
    speaker: anis_i
    en: but the ability to shower with hot water is a blessing.
    ko: 평소에 따뜻한 물로 씻을 수 있다는 것 자체가 복 받은 거야.
    ja: |-
      毎日お湯で体を洗えるって
      実はぜいたくなことなのよ？
  d_nikke_avistar_03_77:
    speaker: anis_i
    en: Anyway, I'm off to shower!
    ko: 아무튼, 나는 씻으러 간다~
    ja: じゃ、私はシャワー浴びてくるから～
  d_nikke_avistar_03_78:
    speaker: "<Monologue>"
    en: Anis waves and returns the way she came.
    ko: 아니스가 손을 흔들며 왔던 길로 다시 돌아갔다.
    ja: アニスが手を振りながら去っていった
  d_nikke_avistar_03_79:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_03_80:
    speaker: "<Self>"
    en: Not the lab you were expecting, huh?
    ko: 생각했던 실험실은 아니었지?
    ja: 想像とは違ったか？
  d_nikke_avistar_03_81:
    speaker: avistar
    en: It really wasn't.
    ko: 그렇네요.
    ja: そうですね。
  d_nikke_avistar_03_82:
    speaker: avistar
    en: But!
    ko: 하지만!
    ja: ですが！
  d_nikke_avistar_03_83:
    speaker: avistar
    en: This will require further investigation. Keep that in mind.
    ko: 여기도 따로 추가 검사는 필요하니까, 참고 부탁드려요.
    ja: |-
      それはそれで別の監査が必要になりますので、
      そのつもりでいてください。
  d_nikke_avistar_03_84:
    speaker: "<Self>"
    en: Sure. So are we done?
    ko: 알았어, 그럼 여기서 끝인가?
    ja: 覚えておく。今回はこれで終わりか？
  d_nikke_avistar_03_85:
    speaker: avistar
    en: No, there's one more point of interest.
    ko: 아뇨, 하나 더 남았어요.
    ja: いえ、もう一点あります。
  d_nikke_avistar_03_86:
    speaker: "<Self>"
    en: All right. Let's get this over with.
    ko: 그래, 빨리 끝내자.
    ja: そうか、早く終わらせに行こう
d_nikke_avistar_04:
  d_nikke_avistar_04_1:
    speaker: avistar
    en: The last issue is something we overlooked because you're a Commando Unit,
    ko: 마지막은, 특수별동대라 평소에는 넘어갔던 부분인데요.
    ja: |-
      今までは、特殊別働隊だからということで
      チェックされていなかった部分ですが…
  d_nikke_avistar_04_2:
    speaker: avistar
    en: but your supply and consumption of ammunition is excessive.
    ko: 탄환 보급 및 소비량이 지나치게 많아요.
    ja: |-
      弾薬類の支給と消費の量に
      多すぎる疑いがあります。
  d_nikke_avistar_04_3:
    speaker: avistar
    en: Of course, given your achievements, it seems perfectly reasonable,
    ko: |-
      물론 지금까지의 실적들을 봤을 때,
      충분히 납득이 가긴 하지만.
    ja: |-
      無論、戦闘経歴を考えれば
      十分に説明のつく範囲ではありますが…
  d_nikke_avistar_04_4:
    speaker: avistar
    en: but while I'm investigating these matters, I'd like to verify this too.
    ko: 이왕 확인이 들어간 거, 함께 체크하기로 했어요.
    ja: |-
      ついでなので、
      これも確認しておくことになりました。
  d_nikke_avistar_04_5:
    speaker: avistar
    en: Some people do sell guns and ammunition illegally in the Outer Rim, you know.
    ko: |-
      아우터 림에 총이나 탄환 등을
      불법으로 사고파는 사람들도 있으니까요.
    ja: |-
      アウターリムへ銃器や弾薬を
      横流しするような方々も
      いないわけではありませんからね。
  d_nikke_avistar_04_6:
    speaker: "<Self>"
    en: Ah...
    ko: 아….
    ja: ああ…
  d_nikke_avistar_04_7:
    speaker: "<Monologue>"
    en: To be honest, I don't have anything to say to that.
    ko: 사실 이거는 딱히 할 말이 없는데.
    ja: 私自身にはとくに思い当たることもない
  d_nikke_avistar_04_8:
    speaker: "<Self>"
    en: Neon would know more about it than I would.
    ko: 나보다는 네온에게 확인받는 게 좋을 거야.
    ja: 話を聞くとしたらネオンだな
  d_nikke_avistar_04_9:
    speaker: "<Self>"
    en: Let's go see her.
    ko: 일단 가볼까.
    ja: とりあえず行ってみよう
  d_nikke_avistar_04_10:
    speaker: avistar
    en: All right.
    ko: 예.
    ja: はい。
  d_nikke_avistar_04_11:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_avistar_04_12:
    speaker: neon_v
    en: Hello, Master! And Avistar.
    ko: 안녕하세요, 스승님! 그리고 아비스타.
    ja: おはようございます、師匠！それにアビスタも。
  d_nikke_avistar_04_13:
    speaker: neon_v
    en: What brings you here so early?
    ko: 아침부터 무슨 일이세요?
    ja: 朝からどうかしましたか？
  d_nikke_avistar_04_14:
    speaker: avistar
    en: Good morning, Neon.
    ko: 좋은 아침이에요, 네온.
    ja: おはようございます、ネオン。
  d_nikke_avistar_04_15:
    speaker: avistar
    en: There's something we need to confirm.
    ko: 확인하고 싶은 게 있어서요.
    ja: おたずねしたいことがあります。
  d_nikke_avistar_04_16:
    speaker: neon_v
    en: There is?
    ko: 확인이요?
    ja: 私に質問ですか？
  d_nikke_avistar_04_17:
    speaker: avistar
    en: First, have a look at this tablet.
    ko: 우선, 이 태블릿을 봐주세요.
    ja: まずは、このタブレットを見てください。
  d_nikke_avistar_04_18:
    speaker: neon_v
    en: You two sure are busy first thing in the morning.
    ko: 이른 시간부터 바쁘시네요.
    ja: 朝早くから大変ですね。
  d_nikke_avistar_04_19:
    speaker: neon_v
    en: Hmm...
    ko: 음.
    ja: ふーむ…
  d_nikke_avistar_04_20:
    speaker: neon_v
    en: Oh, these are the reports about our last mission.
    ko: 오오, 지난번 임무 관련 보고서들이네요.
    ja: ああ、これは先日の任務報告書ですね。
  d_nikke_avistar_04_21:
    speaker: avistar
    en: Yes, I'd like to draw your attention to this part.
    ko: 예, 그중에서 이 부분.
    ja: ええ、中でも、この部分です。
  d_nikke_avistar_04_22:
    speaker: avistar
    en: Would you take a look at your supply and consumption of ammunition?
    ko: 탄환 보급량과 소비량을 봐주시겠어요?
    ja: 弾丸の支給量と消費量をご確認いただけますか？
  d_nikke_avistar_04_23:
    speaker: neon_v
    en: Yup, I see it.
    ko: 예, 봤어요.
    ja: はい、見ましたが。
  d_nikke_avistar_04_24:
    speaker: avistar
    en: What do you think?
    ko: 어떻게 생각하시나요?
    ja: 何かお気づきの点は？
  d_nikke_avistar_04_25:
    speaker: neon_v
    en: Now that I've turned into Neo-Neon, I guess I don't need these supplies anymore.
    ko: |-
      이제 네오-네온으로 바뀌었으니,
      이 보급품들은 필요가 없겠네요.
    ja: |-
      ネオ・ネオンになったので、
      この辺りの支給品はもう必要ありませんね。
  d_nikke_avistar_04_26:
    speaker: neon_v
    en: I don't think there are any bullets than can match my level of firepower.
    ko: |-
      저를 감당할 수 있는 화력의 탄환은,
      아무 데도 없을 테니까요.
    ja: |-
      今の私の火力を受け止められる弾丸なんて
      そうそうありませんから。
  d_nikke_avistar_04_27:
    speaker: avistar
    en: Th-that's not what I meant...
    ko: 그, 그게 아니라….
    ja: そ、そうではなく…
  d_nikke_avistar_04_28:
    speaker: avistar
    en: Did you really use all these rounds?
    ko: 이 많은 탄환을, 정말 다 사용하신 건가요?
    ja: |-
      これだけの弾薬を、
      本当に全て使い切ったのですか？
  d_nikke_avistar_04_29:
    speaker: neon_v
    en: Of course.
    ko: 당연하죠.
    ja: もちろんです。
  d_nikke_avistar_04_30:
    speaker: neon_v
    en: Don't underestimate the firepower that comes from overwhelming numbers.
    ko: 압도적인 물량에서 나오는 화력은 무시할 수 없으니까요.
    ja: |-
      圧倒的な物量は
      あなどれない火力を生みだします。
  d_nikke_avistar_04_31:
    speaker: neon_v
    en: But why do you ask?
    ko: 그런데, 갑자기 이건 왜 물어보시는 건가요?
    ja: ところで、なぜ急にそんな話を？
  d_nikke_avistar_04_32:
    speaker: neon_v
    en: Have you finally decided to walk the path of firepower too?
    ko: 아비스타도 드디어 화력의 길을 향해 걸어가기로 결심하신 건가요?
    ja: |-
      ひょっとして、アビスタも
      ついに火力の道に目覚めましたか？
  d_nikke_avistar_04_33:
    speaker: avistar
    en: No... that's not why I'm here.
    ko: 그런… 건 아니고요.
    ja: そういう話でも…ありません。
  d_nikke_avistar_04_34:
    speaker: avistar
    en: Your supply volume is so high that some suspect you of pocketing some.
    ko: |-
      보급량이 너무 많아서,
      뒤로 몰래 빼돌리는 것 아닌지에 대한 의심이 나오고 있거든요.
    ja: |-
      支給量が多いため、
      どこかへ横流ししている可能性などが
      疑われているのです。
  d_nikke_avistar_04_35:
    speaker: neon_v
    en: Really?
    ko: 그래요?
    ja: そうだったんですか？
  d_nikke_avistar_04_36:
    speaker: neon_v
    en: I don't like the thought of Master being under suspicion like that.
    ko: 스승님이 그런 의심을 받는 건, 아무래도 불편한데요.
    ja: |-
      師匠にそんな疑いを
      被らせるわけにはいきませんね。
  d_nikke_avistar_04_37:
    speaker: neon_v
    en: If you need to, you can give me a brain scan.
    ko: 필요하시다면, 뇌스캔을 해보시겠어요?
    ja: 必要でしたら、脳スキャンでも受けましょうか？
  d_nikke_avistar_04_38:
    speaker: neon_v
    en: All you'll see are scenes of our dazzling battles.
    ko: 볼 수 있는 거라곤, 저의 화려한 전투 장면뿐이겠지만요.
    ja: |-
      見られるものといえば、
      私の大火力な活躍シーンぐらいだと
      思いますが。
  d_nikke_avistar_04_39:
    speaker: avistar
    en: N-no...! We don't need to go that far.
    ko: 아, 아뇨…! 그렇게까지 할 필요는 없어요.
    ja: |-
      あ、いえ…！
      そこまでしていただく必要はありません。
  d_nikke_avistar_04_40:
    speaker: neon_v
    en: That's good.
    ko: 그렇다면 다행이지만요.
    ja: それならよかったです。
  d_nikke_avistar_04_41:
    speaker: avistar
    en: Well, all right.
    ko: "…일단, 알겠어요."
    ja: "…ひとまず、お話は理解しました。"
  d_nikke_avistar_04_42:
    speaker: avistar
    en: In order to receive this much in supplies, the amount of paperwork that would
      need to be filed must have been staggering.
    ko: |-
      이만큼의 양을 전부 보급받으려면,
      올려야 하는 서류의 양이 어마어마했겠네요.
    ja: |-
      しかし、これだけの量となると、
      書類提出もかなり面倒だったのでは
      ないでしょうか。
  d_nikke_avistar_04_43:
    speaker: neon_v
    en: I'm helping Master with that.
    ko: 그건 스승님께서 도와주고 계시죠.
    ja: それは師匠に手伝ってもらっていました。
  d_nikke_avistar_04_44:
    speaker: avistar
    en: What?
    ko: 예?
    ja: はい？
  d_nikke_avistar_04_45:
    speaker: avistar
    en: But he said requesting additional supplies was a pain.
    ko: 아까는 추가용 물자 보급 신청 과정이 귀찮다고 하셨잖아요.
    ja: |-
      先ほどは通常規定外の申請は面倒だと
      おっしゃっていましたね。
  d_nikke_avistar_04_46:
    speaker: avistar
    en: Requesting ammunition must be even more complicated.
    ko: 이쪽은 탄환이라, 훨씬 복잡하고 귀찮으실 텐데요.
    ja: |-
      しかも弾薬となれば、
      申請書類はさらに複雑で厳格になるはずです。
  d_nikke_avistar_04_47:
    speaker: "<Self>"
    en: Still, it's what Neon wants, so I don't have a choice.
    ko: 그래도 네온이 원하는데, 어쩔 수 없지.
    ja: |-
      面倒でも、ネオンが欲しいと言うなら
      仕方ないだろう
  d_nikke_avistar_04_48:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_04_49:
    speaker: avistar
    en: I see.
    ko: 그렇군요.
    ja: そうですか。
  d_nikke_avistar_04_50:
    speaker: "<Monologue>"
    en: Avistar smiles slightly.
    ko: 아비스타가 슬쩍 미소 지었다.
    ja: アビスタの顔が少しゆるんだ
  d_nikke_avistar_04_51:
    speaker: avistar
    en: That was all I needed to confirm.
    ko: 확인이 필요한 건 여기까지예요.
    ja: 確認事項はこれで全てです。
  d_nikke_avistar_04_52:
    speaker: avistar
    en: I don't see a need to investigate the ammunition issue further, so I believe
      that will be enough.
    ko: |-
      마지막 탄환에 관한 건은, 솔직히 제가 봐도 억지라
      이 정도면 충분할 것 같고요.
    ja: |-
      弾薬に関しては私から見ても
      無理筋の話でしたし、
      事実確認ができれば十分でしょう。
  d_nikke_avistar_04_53:
    speaker: "<Self>"
    en: Thank goodness.
    ko: 다행이다.
    ja: それはよかった
  d_nikke_avistar_04_54:
    speaker: "<Self>"
    en: So am I free to go now?
    ko: 그럼, 이제 나는 자유인 거지?
    ja: それで、私はもう自由の身ということだな？
  d_nikke_avistar_04_55:
    speaker: avistar
    en: No.
    ko: 아뇨.
    ja: いいえ。
  d_nikke_avistar_04_56:
    speaker: avistar
    en: You must accompany me until the investigation is completely over.
    ko: 완전히 조사가 끝날 때까지는, 저랑 동행하셔야 해요.
    ja: |-
      調査が完了するまでは、
      私の監視下にいていただきます。
  d_nikke_avistar_04_57:
    speaker: "<Self>"
    en: Ugh...
    ko: 윽….
    ja: はぁ…
  d_nikke_avistar_04_58:
    speaker: avistar
    en: I appreciate your cooperation despite what time it is.
    ko: 새벽부터 너무 고생 많으셨어요.
    ja: 深夜から本当にお疲れ様でした。
  d_nikke_avistar_04_59:
    speaker: avistar
    en: You may return to the Commander's Room for a brief rest.
    ko: 잠시 지휘관실에 돌아가서 숨 좀 돌리죠.
    ja: 指揮官室に戻って、ひと休みしましょう。
  d_nikke_avistar_04_60:
    speaker: avistar
    en: I've already sent documents for additional investigation, so it'll be over
      soon.
    ko: 추가 조사에 관한 자료들은 모두 보내놨으니까, 금방 끝날 거예요.
    ja: |-
      今回の調査結果はすでに送信しましたので、
      もうすぐ終わるはずです。
  d_nikke_avistar_04_61:
    speaker: "<Self>"
    en: Okay.
    ko: 그래.
    ja: だといいが
  d_nikke_avistar_04_62:
    speaker: "<Monologue>"
    en: I return to the Commander's Room with Avistar,
    ko: 묘하게 기분이 좋아 보이는 아비스타와 함께.
    ja: なぜか少し嬉しそうなアビスタに従って…
  d_nikke_avistar_04_63:
    speaker: "<Monologue>"
    en: who looks strangely happy.
    ko: 우리는 다시 지휘관실로 돌아갔다.
    ja: 私は指揮官室へ戻ってきた
d_nikke_avistar_05:
  d_nikke_avistar_05_1:
    speaker: "<Monologue>"
    en: We return to the tape-covered Commander's Room and sit down.
    ko: 우리는 테이프가 덕지덕지 붙어있는 지휘관실에 들어와 앉았다.
    ja: |-
      私たちはあちこちにテープが貼られたままの
      指揮官室で腰を下ろした
  d_nikke_avistar_05_2:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_05_3:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_05_4:
    speaker: "<Self>"
    en: Would you like some tea?
    ko: 차라도 한 잔 마실까?
    ja: お茶でも飲むか？
  d_nikke_avistar_05_5:
    speaker: avistar
    en: Thank you.
    ko: 좋아요.
    ja: そうですね。
  d_nikke_avistar_05_6:
    speaker: avistar
    en: I'll make it for you. Please remain seated.
    ko: 제가 드릴 테니까, 가만히 앉아 계세요.
    ja: 私がいれますので、座っていてください。
  d_nikke_avistar_05_7:
    speaker: "<Monologue>"
    en: Oh, right. I'm still not allowed to touch anything.
    ko: "…아, 나 아직 아무것도 건들면 안 된다고 했지."
    ja: "…そういえば、私はまだ何にも触れないのだった"
  d_nikke_avistar_05_8:
    speaker: "<Narration>"
    en: "*Rattle* *Clink*"
    ko: 달그락- 달그락-
    ja: カチャカチャ――
  d_nikke_avistar_05_9:
    speaker: avistar
    en: I was wondering...
    ko: "…있죠."
    ja: "…ひとつお伺いしますが…"
  d_nikke_avistar_05_10:
    speaker: avistar
    en: Isn't there something you desire, Person of Interest?
    ko: 특별 관리 대상님은, 욕심 같은 거 없으세요?
    ja: |-
      特別管理対象様は、
      欲しいものがおありではないのですか？
  d_nikke_avistar_05_11:
    speaker: "<Self>"
    en: Desire? Like what?
    ko: 욕심이라면, 어떤 거?
    ja: 欲しいものというと、どういった？
  d_nikke_avistar_05_12:
    speaker: avistar
    en: Money, power, something like that.
    ko: 돈이나 권력, 그런 것들이요.
    ja: お金や権力や、そういうものです。
  d_nikke_avistar_05_13:
    speaker: "<Self>"
    en: Of course.
    ko: 당연히 있지.
    ja: もちろん欲しい
  d_nikke_avistar_05_14:
    speaker: avistar
    en: Then why do you act like this?
    ko: 그런데 어떻게 그러실 수 있나요.
    ja: |-
      それなら、なぜこんなことを
      されているのでしょう。
  d_nikke_avistar_05_15:
    speaker: avistar
    en: You could be out there pursuing your own personal gain, you know.
    ko: 좀 더 개인의 이득을 추구하며 사실 수 있잖아요.
    ja: |-
      もっと自分の利益を追求することも
      できるはずです。
  d_nikke_avistar_05_16:
    speaker: "<Self>"
    en: I already am pursuing my own personal gain.
    ko: 충분히 내 이득을 추구하며 살고 있어.
    ja: 今でも十分、自分の利益は追求している
  d_nikke_avistar_05_17:
    speaker: avistar
    en: But it looks like you only care about the wellbeing of the Nikkes.
    ko: 제 눈에는 니케들을 위해 사는 것처럼 보여요.
    ja: |-
      私にはニケたちのために
      身を削っているように見えました。
  d_nikke_avistar_05_18:
    speaker: "<Self>"
    en: Right, which is personal gain for me.
    ko: 그럼, 그게 나의 이득인 거겠지.
    ja: |-
      それなら、それが私の
      求めるものということだろう
  d_nikke_avistar_05_19:
    speaker: avistar
    en: They're not your concern.
    ko: 남이잖아요.
    ja: しょせんは他人です。
  d_nikke_avistar_05_20:
    speaker: avistar
    en: On top of that, they're Nikkes.
    ko: 하물며, 니케라구요.
    ja: まして、ニケだなんて。
  d_nikke_avistar_05_21:
    speaker: "<Self>"
    en: They're comrades who risk their lives with me.
    ko: 나와 생사를 함께하는 동료들이야.
    ja: 私にとっては命を預けあう仲間だ
  d_nikke_avistar_05_22:
    speaker: "<Self>"
    en: Those comrades fight for me.
    ko: 그리고 그 동료들은 나를 위해 싸워.
    ja: みんな私のために戦ってくれている
  d_nikke_avistar_05_23:
    speaker: "<Self>"
    en: So I'm just doing what I can.
    ko: 그러니, 나도 내가 할 수 있는 걸 하는 것뿐이야.
    ja: だから、私も自分にできることをしているだけだ
  d_nikke_avistar_05_24:
    speaker: avistar
    en: I see.
    ko: 그렇군요.
    ja: そうでしたか。
  d_nikke_avistar_05_25:
    speaker: "<Narration>"
    en: "*Beep, beep*"
    ko: 삐빅-
    ja: ピピッ――
  d_nikke_avistar_05_26:
    speaker: "<Monologue>"
    en: Avistar's phone rings.
    ko: 아비스타의 휴대폰이 울린다.
    ja: アビスタの携帯端末が鳴った
  d_nikke_avistar_05_27:
    speaker: "<Monologue>"
    en: She stares blankly at the phone.
    ko: 아비스타는 그 휴대폰을 빤히 바라본다.
    ja: その画面に目をやりながら、彼女は聞いた
  d_nikke_avistar_05_28:
    speaker: avistar
    en: Don't you find it unfair?
    ko: 억울하지는 않으셨나요?
    ja: 腹立たしくは思わないのですか？
  d_nikke_avistar_05_29:
    speaker: avistar
    en: You're such a decent person, yet you receive all this suspicion.
    ko: |-
      내가 얼마나 깨끗한 사람인데,
      이런 쓸데없는 걸로 의심을 해!
    ja: |-
      「これだけ誠実に勤めているのに、
      こんなつまらない疑いをかけるとは何事だ！」
  d_nikke_avistar_05_30:
    speaker: avistar
    en: Doesn't it bother you?
    ko: 하면서 말이에요.
    ja: とか。
  d_nikke_avistar_05_31:
    speaker: "<Self>"
    en: I see it as a good chance to prove just how decent I am, so I don't find it
      unfair.
    ko: 내 깨끗함을 증명할 좋은 기회인데, 억울할 필요가 없지.
    ja: |-
      むしろそれを証明できる機会だ。
      腹を立てる必要がない
  d_nikke_avistar_05_32:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_05_33:
    speaker: "<Self>"
    en: Well, have I completely proven myself?
    ko: 어때, 완벽하게 증명했지?
    ja: どうだ？完璧に証明できているか？
  d_nikke_avistar_05_34:
    speaker: avistar
    en: Ha...
    ko: 하….
    ja: ふふ…
  d_nikke_avistar_05_35:
    speaker: avistar
    en: Haha! Hahaha!
    ko: 하하! 하하하~!
    ja: アハハ…ハハハハ！
  d_nikke_avistar_05_36:
    speaker: avistar
    en: Yes, you've proven yourself perfectly.
    ko: 네, 정말 완벽하게 증명하셨어요.
    ja: はい、完璧に証明されたようです。
  d_nikke_avistar_05_37:
    speaker: avistar
    en: The additional investigation found no wrongdoing.
    ko: 추가 검사 결과, 아무런 문제가 없는 걸로 나왔어요.
    ja: 監査報告が問題なく承認されました。
  d_nikke_avistar_05_38:
    speaker: "<Self>"
    en: Now you're finally smiling for real.
    ko: 이제야 제대로 웃네.
    ja: やっと心から笑えたようだな
  d_nikke_avistar_05_39:
    speaker: avistar
    en: Was I not earlier?
    ko: 아까는 표정이 영 별로였나요?
    ja: 今までも笑顔でいたと思いますが？
  d_nikke_avistar_05_40:
    speaker: "<Self>"
    en: You just looked so nervous before.
    ko: 계속 긴장한 것처럼 보였거든.
    ja: ずっと張り詰めているように見えた
  d_nikke_avistar_05_41:
    speaker: avistar
    en: So you noticed.
    ko: 느껴졌군요.
    ja: お見通しでしたか。
  d_nikke_avistar_05_42:
    speaker: avistar
    en: To be honest, I knew from the beginning that there wouldn't be any issues,
    ko: 솔직히, 처음부터 아무 문제 없을 거라고 믿었고.
    ja: |-
      正直なところ、
      何も問題はないだろうと信じてはいました。
  d_nikke_avistar_05_43:
    speaker: avistar
    en: even more so because Anis chose you.
    ko: 아니스가 선택한 분이니 더더욱 그렇게 생각했어요.
    ja: アニスの選んだ方であれば、なおさらです。
  d_nikke_avistar_05_44:
    speaker: avistar
    en: But still, you never know!
    ko: 그런데, 혹시 모르는 거잖아요…!
    ja: それでも、何があるかは分かりませんから。
  d_nikke_avistar_05_45:
    speaker: avistar
    en: What if you were genuinely hiding something?
    ko: 정말 뭔가를 숨기고 계셨다거나.
    ja: 本当に隠すのがうまいのかもしれないし…
  d_nikke_avistar_05_46:
    speaker: avistar
    en: It might not be intentional, but there could be something that leaves you
      open to criticism.
    ko: 의도하진 않지만, 꼬투리 잡힐만한 게 있을 수 있으니까요.
    ja: |-
      その気がなくとも、問題のあるものが
      出てくるかもしれませんから。
  d_nikke_avistar_05_47:
    speaker: "<Self>"
    en: You must really like Anis.
    ko: 아비스타는, 아니스를 정말 좋아하는구나.
    ja: アニスのことが本当に大事なようだな
  d_nikke_avistar_05_48:
    speaker: avistar
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_avistar_05_49:
    speaker: avistar
    en: I-I've been her fan for a long time.
    ko: 오, 오랜 팬이니까요.
    ja: む、昔からのファンですから。
  d_nikke_avistar_05_50:
    speaker: avistar
    en: Also, me saying this might make you uncomfortable,
    ko: "…그리고, 이런 말 불편하실 수도 있겠지만."
    ja: |-
      …それに、こんなことを口にすると
      困らせてしまうかもしれませんが…
  d_nikke_avistar_05_51:
    speaker: avistar
    en: but I like you too, Person of Interest.
    ko: 특별 관리 대상님도 좋아하고 있어요.
    ja: 特別管理対象様にも、同じ気持ちです。
  d_nikke_avistar_05_52:
    speaker: "<Self>"
    en: What?
    ko: 뭐?
    ja: え？
  d_nikke_avistar_05_53:
    speaker: avistar
    en: W-wait! I didn't mean it in a strange way!
    ko: 아, 아니…! 이상한 의미는 전혀 아니고요!
    ja: |-
      い、いえ…！
      決して変な意味ではなく…！
  d_nikke_avistar_05_54:
    speaker: avistar
    en: It's like I feel good when I see you, just like when I see Anis.
    ko: 아니스를 볼 때처럼, 기분 좋은 울림이 있다고 해야 할까요.
    ja: |-
      アニスを見ている時と同じように
      胸が高鳴るといいますか…
  d_nikke_avistar_05_55:
    speaker: avistar
    en: You seem trustworthy in a way that I can rely on, I guess.
    ko: 믿을 수 있다는 든든함이 있다고 해야 할까요.
    ja: 安心できる頼もしさがあるというか…
  d_nikke_avistar_05_56:
    speaker: "<Self>"
    en: Hmm, I think I know what you mean.
    ko: 응, 뭔지 알 것 같아.
    ja: なるほど、分かった気がする
  d_nikke_avistar_05_57:
    speaker: "<Self>"
    en: That's why I like you too, Avistar.
    ko: 나도 그런 의미로 아비스타가 참 좋거든.
    ja: そういうことなら、私もアビスタに同じ気持ちだ
  d_nikke_avistar_05_58:
    speaker: avistar
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_avistar_05_59:
    speaker: "<Narration>"
    en: "*Rrrip*"
    ko: 지익-
    ja: ベリッ…
  d_nikke_avistar_05_60:
    speaker: "<Monologue>"
    en: Avistar slowly stands up and removes the tape covering the Commander's Room.
    ko: |-
      아비스타가 천천히 몸을 일으켜,
      지휘관실 곳곳에 붙어있는 테이프를 떼어낸다.
    ja: |-
      アビスタはゆっくりと立ち上がり、
      指揮官室のあちこちに貼られた
      テープを剥がしていった
  d_nikke_avistar_05_61:
    speaker: avistar
    en: Thank you for accommodating such a difficult request so early in the day.
    ko: 이른 시간부터 어려운 부탁 들어주셔서 감사해요.
    ja: |-
      深夜からお時間を取らせてしまい
      申し訳ございませんでした。
  d_nikke_avistar_05_62:
    speaker: "<Self>"
    en: Sure. Hopefully we won't have to meet under these circumstances again.
    ko: 그래, 웬만하면 이런 일로 보지 말자.
    ja: できれば、こんな用で会うのは二度とごめんだ
  d_nikke_avistar_05_63:
    speaker: avistar
    en: In that case, you must remain as clean and incorruptible as you are now.
    ko: 그러려면 지금처럼 쭉 깨끗하고 청렴하게 사셔야 해요.
    ja: でしたら、今のまま清廉潔白でいてください。
  d_nikke_avistar_05_64:
    speaker: "<Self>"
    en: Don't worry. I'm pretty sure I can manage that.
    ko: 걱정 마, 그것만큼은 자신 있으니까.
    ja: 心配するな。そこだけは自信がある
  d_nikke_avistar_05_65:
    speaker: avistar
    en: I figured as much.
    ko: "…역시."
    ja: "…そうですね。"
  d_nikke_avistar_05_66:
    speaker: "<Monologue>"
    en: Without another word, Avistar bows her head deeply to me.
    ko: |-
      아비스타는 더 말을 잇지 않고,
      나에게 깊이 고개를 숙였다.
    ja: |-
      アビスタはそれ以上何も言わず、
      私に深く頭を下げた
  d_nikke_avistar_05_67:
    speaker: "<Monologue>"
    en: Looking at her,
    ko: 나는 그 모습을 보며.
    ja: 私はその姿を見て…
  d_nikke_avistar_05_68:
    speaker: "<Monologue>"
    en: I can feel her deep trust and respect.
    ko: 깊은 신뢰와 존경을 느꼈다.
    ja: 彼女から寄せられた深い信頼と尊敬を感じた
  d_nikke_avistar_05_69:
    speaker: "<Monologue>"
    en: This day leaves me with one certainty. However dangerous my path may be, at
      least it's the right one.
    ko: 내가 걸어온 길이, 험할지언정 틀리지는 않았다는 확신이 드는 하루였다.
    ja: |-
      自分の歩んできた道が
      けわしくとも間違っていなかったと
      確信した1日だった
