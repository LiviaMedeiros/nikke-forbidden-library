---
d_nikke_mint_01:
  d_nikke_mint_01_1:
    speaker: "<Narration>"
    en: The door to my room opens.
    ko: 지잉-
    ja: ウィーン――
  d_nikke_mint_01_2:
    speaker: mint
    en: Kitten!
    ko: 아기 고양이씨!
    ja: 子ネコさん！
  d_nikke_mint_01_3:
    speaker: "<Self>"
    en: Mint?
    ko: 민트?
    ja: ミント？
  d_nikke_mint_01_4:
    speaker: mint
    en: Oh, I'm so glad.
    ko: 다행이다.
    ja: よかった。
  d_nikke_mint_01_5:
    speaker: mint
    en: I was hoping you'd be here.
    ko: 역시 지휘관실에 계셨군요.
    ja: やっぱり指揮官室にいらっしゃったんですね。
  d_nikke_mint_01_6:
    speaker: mint
    en: You didn't get my text, so I thought I'd drop by.
    ko: 블라를 안 받으셔서 직접 찾아왔어요.
    ja: |-
      メッセージが既読にならなかったので、
      来ちゃいました。
  d_nikke_mint_01_7:
    speaker: "<Self>"
    en: You texted?
    ko: 블라?
    ja: メッセージ？
  d_nikke_mint_01_8:
    speaker: "<Monologue>"
    en: I pull my phone out of my pocket and check it.
    ko: 주머니에 있던 핸드폰을 꺼내 확인해보았다.
    ja: |-
      ポケットから携帯端末を取り出し
      確認した
  d_nikke_mint_01_9:
    speaker: "<Self>"
    en: Looks like my phone died...
    ko: 핸드폰이 배터리가 다 됐네….
    ja: 充電が切れているな…
  d_nikke_mint_01_10:
    speaker: "<Self>"
    en: Sorry, I had no idea you messaged.
    ko: 미안, 연락한 줄 몰랐어.
    ja: すまない、気づかなかった
  d_nikke_mint_01_11:
    speaker: mint
    en: That's okay. I was hoping to tell you face-to-face anyway.
    ko: 어차피 아기 고양이씨 얼굴을 직접 보면서 말씀드리고 싶었던 거라, 괜찮아요.
    ja: |-
      いずれにしろ、子ネコさんに直接会って
      お話しするつもりでしたから、
      気にしないでください。
  d_nikke_mint_01_12:
    speaker: mint
    en: And now here I am!
    ko: 아무튼 만났으니까.
    ja: とにかく、お会いできたわけですし。
  d_nikke_mint_01_13:
    speaker: "<Self>"
    en: What did you want to tell me?
    ko: 그래서 무슨 일로 온 거야?
    ja: それで、何の用だ？
  d_nikke_mint_01_14:
    speaker: mint
    en: It's simple, really.
    ko: 아, 그게 말이죠.
    ja: えっと、それがですね…
  d_nikke_mint_01_15:
    speaker: mint
    en: I'm here to give you a very special opportunity.
    ko: 아기 고양이씨에게 아주 특별한 기회를 드리려고 찾아왔어요.
    ja: |-
      子ネコさんに、とびっきりスペシャルな
      チャンスのご提案に来ました。
  d_nikke_mint_01_16:
    speaker: "<Self>"
    en: Oh? A special opportunity...?
    ko: 특별한 기회…?
    ja: スペシャルなチャンス…？
  d_nikke_mint_01_17:
    speaker: mint
    en: Yes, it's very, very special.
    ko: 네, 아주 아주 특별한 기회요.
    ja: |-
      ええ。もう二度とないような
      特別なチャンスですよ。
  d_nikke_mint_01_18:
    speaker: "<Self>"
    en: What is it?
    ko: 그게 뭔데?
    ja: 何だ？
  d_nikke_mint_01_19:
    speaker: mint
    en: Well...
    ko: 그건 말이죠….
    ja: それは…
  d_nikke_mint_01_20:
    speaker: mint
    en: It's a chance to spend a week with me doing whatever you want.
    ko: 절 일주일 동안 마음대로 하실 수 있는 기회예요.
    ja: 1週間、私を思い通りにできるチャンスです。
  d_nikke_mint_01_21:
    speaker: mint
    en: 'Just think: a week with the one and only Mint from the super popular group
      T.T. STAR!'
    ko: 최고의 인기 아이돌 T.T. STAR의 민트를 마음대로 할 수 있는 기회!
    ja: |-
      超売れっ子アイドル、T.T. STARの
      ミントを好きにできるチャーンス！
  d_nikke_mint_01_22:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_01_23:
    speaker: "<Self>"
    en: Uh, can you elaborate a little bit more?
    ko: 좀 더 정확하게 설명해 줄래…?
    ja: |-
      もう少し具体的に
      説明してくれないか…？
  d_nikke_mint_01_24:
    speaker: mint
    en: Oh, was that not enough information?
    ko: 아, 설명이 너무 짧았나요?
    ja: あっ、ちょっと説明が足りませんでしたね？
  d_nikke_mint_01_25:
    speaker: mint
    en: Let me back up a bit...
    ko: 사실은요….
    ja: 実はですね…
  d_nikke_mint_01_26:
    speaker: "<Narration>"
    en: Two days earlier...
    ko: 이틀 전.
    ja: 2日前
  d_nikke_mint_01_27:
    speaker: prika
    en: It won't be easy. At all.
    ko: 아무리 생각해봐도 쉽지 않겠어.
    ja: どう考えても、無理だろう。
  d_nikke_mint_01_28:
    speaker: avistar
    en: I agree.
    ko: 그러게요.
    ja: そうですね。
  d_nikke_mint_01_29:
    speaker: mint
    en: Really? I think it'll be fine.
    ko: 난 이 정도면 충분히 괜찮은 것 같은데?
    ja: 私は大丈夫だと思うけど？
  d_nikke_mint_01_30:
    speaker: "<Narration>"
    en: Mint, Prika, and Avistar sit across from each other.
    ko: 민트, 프리카, 아비스타는 서로를 마주보며 앉아 있다.
    ja: |-
      ミントとプリカとアビスタが
      向かい合って座っている
  d_nikke_mint_01_31:
    speaker: prika
    en: Hmm... I've made up my mind.
    ko: 그래, 결정했어.
    ja: いや、やっぱり…
  d_nikke_mint_01_32:
    speaker: prika
    en: I'm against it.
    ko: 난 반대야.
    ja: 私は反対だ。
  d_nikke_mint_01_33:
    speaker: avistar
    en: I'm against it too.
    ko: 네, 저도 반대예요.
    ja: はい、私も反対です。
  d_nikke_mint_01_34:
    speaker: mint
    en: I'm for it.
    ko: 난 찬성이야.
    ja: 私は賛成よ。
  d_nikke_mint_01_35:
    speaker: mint
    en: I really think it's worth trying.
    ko: 충분히 해볼 만한 가치가 있다고 생각해.
    ja: 十分、やる価値があると思うわ。
  d_nikke_mint_01_36:
    speaker: mint
    en: It's not like I'm the one who asked for it. The producers were the ones who
      asked me to audition.
    ko: 내가 먼저 하겠다고 한 것도 아니고, 드라마 제작사에서 먼저 오디션 제의를 한 거잖아.
    ja: |-
      私がやりたいって言ったんじゃなくて、
      ドラマの制作会社のほうから
      オーディションの話が舞い込んで来たのよ。
  d_nikke_mint_01_37:
    speaker: mint
    en: They said I have the right look for the female lead.
    ko: 여자 주인공이랑 내 이미지가 잘 맞을 것 같다고.
    ja: ヒロインと私のイメージがピッタリ合うって。
  d_nikke_mint_01_38:
    speaker: avistar
    en: That is indeed what it said in the proposal they sent us.
    ko: 확실히 회사에 온 제안서에는 그렇게 적혀있었죠.
    ja: |-
      確かに、事務所に届いた提案書には
      そのように記載がありました。
  d_nikke_mint_01_39:
    speaker: mint
    en: It's a shame that it's only a limited series, but it'll really help us branch
      out into new things.
    ko: 단편 드라마인 게 조금 아쉽긴 하지만, 그래도 우리 활동 범위를 넓히는 데 분명 도움이 될 거야.
    ja: |-
      短編ドラマなのがちょっと残念だけど、
      私たちの活動の場を広げていくのに
      きっとプラスになるはずよ。
  d_nikke_mint_01_40:
    speaker: mint
    en: There's no reason to say no.
    ko: 그걸 반대한다는 게 말이 돼?
    ja: それを反対するなんて…あり得ないわ。
  d_nikke_mint_01_41:
    speaker: prika
    en: Yes, there is.
    ko: 말이 돼.
    ja: なに言ってるんだ。
  d_nikke_mint_01_42:
    speaker: prika
    en: You may look perfect for the role, but you can't act.
    ko: 이미지는 맞을지 몰라도, 연기가 안 되는 걸.
    ja: |-
      イメージとは合ってるかもしれないけど、
      演技のほうはさっぱりだろ。
  d_nikke_mint_01_43:
    speaker: prika
    en: You're stiff as a board.
    ko: 너 완전 발연기잖아.
    ja: 大根役者もいいところじゃないか。
  d_nikke_mint_01_44:
    speaker: avistar
    en: Prika, try to be nicer when offering critique.
    ko: 프리카, 말을 조금만 돌려서 해주세요.
    ja: プリカ、もう少し言葉を選んでください。
  d_nikke_mint_01_45:
    speaker: avistar
    en: There are less aggressive ways to say things. For example, you could have
      said she's still new to acting.
    ko: 연기가 어설프다 같은 부드러운 표현도 있잖아요.
    ja: |-
      「演技がぎこちない」とか…
      ソフトな言い方もあるじゃないですか。
  d_nikke_mint_01_46:
    speaker: mint
    en: Wh-what's wrong with my acting?!
    ko: 내, 내 연기가 뭐 어때서!
    ja: わ、私の演技に何か文句でもあるの！？
  d_nikke_mint_01_47:
    speaker: mint
    en: I'd say I do pretty well!
    ko: 나 정도면 괜찮지 않아?
    ja: あれくらいできれば、大丈夫じゃない？
  d_nikke_mint_01_48:
    speaker: mint
    en: I'm certainly not "stiff as a board"...
    ko: 발연기라고 욕먹을 정도는 아닌 것 같은데~
    ja: 大根役者なんて言われるほどじゃないわよ～
  d_nikke_mint_01_49:
    speaker: prika
    en: Okay, then how about you read us a line?
    ko: "…그럼 이 대사 한번 해볼래?"
    ja: "…なら、このセリフを言ってみろ。"
  d_nikke_mint_01_50:
    speaker: "<Narration>"
    en: Prika picks up the script in front of her and shows it to Mint.
    ko: 프리카는 앞에 놓여있던 대본을 들어 민트에게 보여준다.
    ja: |-
      プリカは前に置かれた台本を
      ミントに見せた
  d_nikke_mint_01_51:
    speaker: mint
    en: This one?
    ko: 이 대사 말이지.
    ja: このセリフね。
  d_nikke_mint_01_52:
    speaker: mint
    en: Hmm...
    ko: 음음.
    ja: オホンッ。
  d_nikke_mint_01_53:
    speaker: mint
    en: I'm Sick Of The Way Things Are.
    ko: 이제너랑이러고있는것도지겨워.
    ja: もうあんたといっしょにいるのもうんざりよ。
  d_nikke_mint_01_54:
    speaker: mint
    en: You And I Have Been Sitting Here Like This For Eight Years.
    ko: 8년이나너랑이러고앉아있었다니.
    ja: はちねんもこんなふうにすごしてきたなんて。
  d_nikke_mint_01_55:
    speaker: prika
    en: I knew it. It won't work.
    ko: 역시 안 되겠어.
    ja: "…やっぱりヒドイな。"
  d_nikke_mint_01_56:
    speaker: prika
    en: No one will want to watch that.
    ko: 도저히 눈 뜨고 봐줄 만한 연기가 아니야.
    ja: |-
      とてもじゃないが、
      人様に見せられる演技じゃないぞ。
  d_nikke_mint_01_57:
    speaker: prika
    en: You sound like a child reading out of a textbook.
    ko: 초등학생이 국어책 읽는 것 같아.
    ja: 小学生の音読かってくらい棒読みだ。
  d_nikke_mint_01_58:
    speaker: avistar
    en: I have to agree.
    ko: 네, 동감이에요.
    ja: ええ、同感です。
  d_nikke_mint_01_59:
    speaker: mint
    en: Trust me! I can do this!
    ko: 아니, 할 수 있다니까!
    ja: もうっ。できるってば！
  d_nikke_mint_01_60:
    speaker: prika
    en: Mint...
    ko: 민트….
    ja: ミント…
  d_nikke_mint_01_61:
    speaker: prika
    en: I know you have good intentions,
    ko: 의도가 좋은 건 알겠어.
    ja: |-
      たしかに、何かに積極的に取り組むのは
      いいことだ。
  d_nikke_mint_01_62:
    speaker: prika
    en: but you just don't have the skills right now, and there's nothing we can do
      about that.
    ko: 하지만 당장 능력이 안 되는 건 어쩔 수 없잖아.
    ja: |-
      だけど、今の時点で実力が伴っていないんだ。
      どうしようもないだろ？
  d_nikke_mint_01_63:
    speaker: prika
    en: Give it up.
    ko: 포기하자.
    ja: 諦めよう。
  d_nikke_mint_01_64:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_01_65:
    speaker: mint
    en: "... do it."
    ko: "…수 있어."
    ja: "…みせるわ。"
  d_nikke_mint_01_66:
    speaker: prika
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_mint_01_67:
    speaker: avistar
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_mint_01_68:
    speaker: "<Narration>"
    en: Mint springs to her feet.
    ko: 민트가 자리를 박차고 일어섰다.
    ja: |-
      ミントはその場から
      勢いよく立ち上がった
  d_nikke_mint_01_69:
    speaker: mint
    en: I can do it.
    ko: 아니, 할 수 있어.
    ja: 絶対、やってみせるわ。
  d_nikke_mint_01_70:
    speaker: mint
    en: You think I can't do something as simple as acting?
    ko: 내가 고작 이런 연기 하나 못 해낼 것 같아?
    ja: |-
      演技の一つくらい、
      私ができないとでも思ってるの？
  d_nikke_mint_01_71:
    speaker: "<Narration>"
    en: Mint turns to Avistar.
    ko: 민트가 고개를 돌려 아비스타를 바라본다.
    ja: ミントがアビスタを見つめた
  d_nikke_mint_01_72:
    speaker: mint
    en: Avistar, what do we have on the schedule for this week?
    ko: 아비스타, 우리 이번 주 일정이 어떻게 돼?
    ja: アビスタ、今週のスケジュールは？
  d_nikke_mint_01_73:
    speaker: mint
    en: Start with the most important things.
    ko: 급한 일정 위주로.
    ja: 急ぎのものだけ教えて。
  d_nikke_mint_01_74:
    speaker: avistar
    en: Th-this week? Just a moment.
    ko: 이, 일정이요? 잠시만요.
    ja: ス、スケジュールですか？少々お待ちください。
  d_nikke_mint_01_75:
    speaker: "<Narration>"
    en: Avistar taps away at her tablet and checks the schedule.
    ko: 아비스타가 태블릿을 두드려 일정을 확인했다.
    ja: |-
      アビスタはタブレットを開いて
      スケジュールを確認した
  d_nikke_mint_01_76:
    speaker: avistar
    en: Aside from the cooking program next week...
    ko: 다음 주에 있는 요리 프로그램 촬영을 제외하면….
    ja: 来週の料理番組の収録以外に…
  d_nikke_mint_01_77:
    speaker: avistar
    en: you don't have anything urgent on the schedule.
    ko: 네, 급한 일정은 없네요.
    ja: 急ぎのスケジュールはありません。
  d_nikke_mint_01_78:
    speaker: mint
    en: So I'm free for the next week?
    ko: 다음 스케줄까지 일주일….
    ja: 来週の収録まで、あと1週間…
  d_nikke_mint_01_79:
    speaker: mint
    en: That should be enough time.
    ko: 그 정도면 괜찮겠어.
    ja: それくらいならイケそうね。
  d_nikke_mint_01_80:
    speaker: avistar
    en: What are you going to do?
    ko: "…어쩌시려고요?"
    ja: "…どうするつもりですか？"
  d_nikke_mint_01_81:
    speaker: mint
    en: Whatever it takes to become an actor you'll both take seriously.
    ko: 내가 어떻게 해서든, 둘이 납득할 만한 연기력으로 키워 올게.
    ja: |-
      何としてでも、あなたたち2人を
      納得させられる演技力を
      身につけるわ。
  d_nikke_mint_01_82:
    speaker: mint
    en: That means I won't be making it to the rehearsal room for a little while,
    ko: 그것 때문에 한동안 연습실에 얼굴은 못 비추겠지만,
    ja: |-
      だから、しばらくの間はトレーニングルームに
      顔を出せなくなると思うけど、
  d_nikke_mint_01_83:
    speaker: mint
    en: but as long as I make it to next week's filming, everything's fine, right?
    ko: 다음 주 촬영 일정만 지키면 그 정도는 괜찮지?
    ja: 来週の収録にさえ間に合えば、いいわよね？
  d_nikke_mint_01_84:
    speaker: avistar
    en: Yes, but neglecting rehearsal for a week is really not ideal...
    ko: 그렇긴 한데, 그래도 일주일이나 연습실을 비우는 건 좀….
    ja: |-
      …構いませんが、1週間も
      トレーニングルームに来ないというのは…
  d_nikke_mint_01_85:
    speaker: prika
    en: Okay.
    ko: 알았어.
    ja: 分かった。
  d_nikke_mint_01_86:
    speaker: prika
    en: If you can convince us with your acting after one week, then you'll have my
      vote.
    ko: 일주일 만에 우리가 납득할 만한 연기를 보여주면 반대하지 않을게.
    ja: |-
      1週間で私たちを納得させられる
      演技力を見せてくれるなら、反対しない。
  d_nikke_mint_01_87:
    speaker: avistar
    en: Prika...!
    ko: 프리카…!
    ja: プリカ…！
  d_nikke_mint_01_88:
    speaker: prika
    en: We're teammates.
    ko: 우린 동료잖아.
    ja: 私たちは仲間じゃないか。
  d_nikke_mint_01_89:
    speaker: prika
    en: When your teammate is this passionate about something, you may not agree with
      them, but you can't just shoot them down.
    ko: 동료가 저렇게 열의를 갖고 하겠다는데, 응원은 못 해줄지언정 반대만 할 수는 없지.
    ja: |-
      仲間が熱意を持ってやろうとしてるんだ。
      応援まではできないが、
      反対ばかりするわけにもいかないだろ。
  d_nikke_mint_01_90:
    speaker: prika
    en: Besides, there's enough time that we can still say no after seeing the end
      result.
    ko: 반대는 일단 결과를 보고 해도 늦지 않아.
    ja: |-
      反対するのは結果を見てからでも
      遅くはないからな。
  d_nikke_mint_01_91:
    speaker: avistar
    en: That may be true, but still...
    ko: 그건 그렇지만….
    ja: それはそうですが…
  d_nikke_mint_01_92:
    speaker: "<Narration>"
    en: Mint smiles and heads for the rehearsal room door.
    ko: 민트가 웃으며 연습실 문으로 향했다.
    ja: |-
      ミントは微笑みながら
      トレーニングルームの扉に向かった
  d_nikke_mint_01_93:
    speaker: mint
    en: One week from now, I'm gonna make you wonder how you ever doubted me!
    ko: 일주일 뒤에 눈이 번쩍 뜨게 해줄 테니까~
    ja: |-
      1週間後、腰を抜かすほど
      ビックリさせてあげるわ～
  d_nikke_mint_01_94:
    speaker: mint
    en: Just you wait!
    ko: 기다리고 있어!
    ja: 楽しみにしてて！
  d_nikke_mint_01_95:
    speaker: "<Narration>"
    en: With that, Mint leaves the rehearsal room.
    ko: 그렇게 민트는 연습실을 나섰다.
    ja: |-
      そうしてミントは
      トレーニングルームを後にした
d_nikke_mint_02:
  d_nikke_mint_02_1:
    speaker: "<Self>"
    en: So you want me to help you practice acting?
    ko: 그래서 연기 연습을 도와달라는 거야?
    ja: |-
      それで、演技の練習を
      手伝ってほしいというわけか？
  d_nikke_mint_02_2:
    speaker: mint
    en: Yeah.
    ko: 네.
    ja: ええ。
  d_nikke_mint_02_3:
    speaker: mint
    en: I've been practicing by myself for the past two days, but I think I've hit
      a wall.
    ko: 그러고 나와서 이틀 동안 혼자 연습해봤는데, 뭔가 한계가 느껴지더라고요.
    ja: |-
      あれから2日間、一人で練習してみたんですが、
      限界を感じてしまって。
  d_nikke_mint_02_4:
    speaker: mint
    en: Then I realized something.
    ko: 그러다가 깨달았죠.
    ja: それで、気づいたんです。
  d_nikke_mint_02_5:
    speaker: mint
    en: It was because I didn't have anyone to practice with.
    ko: 아, 연습 상대가 없어서 그렇구나.
    ja: 練習相手がいないからダメなんだ、って。
  d_nikke_mint_02_6:
    speaker: mint
    en: If I have someone to act across from, I bet I'll knock everyone's socks off!
    ko: 연습 상대만 있으면, 기가 막히게 연기할 수 있겠다! 라고요.
    ja: |-
      練習相手がいたら、
      すばらしい演技ができるはず！って
      思ったんです。
  d_nikke_mint_02_7:
    speaker: "<Self>"
    en: Why didn't you say that in the first place?
    ko: 그러면 처음부터 그렇게 말을 해야지….
    ja: |-
      それなら、そうと
      初めから言ってくれれば…
  d_nikke_mint_02_8:
    speaker: mint
    en: I got so worked up that I must've gotten ahead of myself.
    ko: 마음이 급해서 앞뒤 다 잘라먹고 말씀드렸네요.
    ja: |-
      気が急いでいたので、
      前後を端折ってしまいましたね。
  d_nikke_mint_02_9:
    speaker: mint
    en: Still, it's true that you can do whatever you want with me for a week while
      we practice together.
    ko: 그래도 연습을 도와주면서 절 일주일 동안 마음대로 할 수 있는 건 사실인데요?
    ja: |-
      でも、1週間練習を手伝いながら、
      私を好きにしていいのは本当ですよ？
  d_nikke_mint_02_10:
    speaker: "<Monologue>"
    en: Mint points to herself.
    ko: 민트가 손가락으로 자신을 가리켰다.
    ja: ミントは自分自身を指さした
  d_nikke_mint_02_11:
    speaker: mint
    en: You get a week with me, the one and only Mint from T.T. STAR.
    ko: 무려 T.T. STAR의 민트를요.
    ja: あのT.T. STARのミントを、です。
  d_nikke_mint_02_12:
    speaker: "<Self>"
    en: Doing "whatever" I want, by which you mean... practicing with you.
    ko: 연습을 마음대로, 인 거겠지.
    ja: |-
      好きに練習ができる、
      ということだろう？
  d_nikke_mint_02_13:
    speaker: "<Monologue>"
    en: Mint smiles silently.
    ko: 민트는 말없이 미소짓고 있다.
    ja: ミントは黙って笑顔を浮かべている
  d_nikke_mint_02_14:
    speaker: "<Self>"
    en: Did you bring a script?
    ko: "…혹시 대본은 가져왔어?"
    ja: "…台本は持ってきたのか？"
  d_nikke_mint_02_15:
    speaker: mint
    en: Of course.
    ko: 물론 가져왔죠.
    ja: もちろんです。
  d_nikke_mint_02_16:
    speaker: "<Monologue>"
    en: I take the script from Mint and read it over.
    ko: 민트에게 대본을 받아 읽어보았다.
    ja: |-
      ミントから台本を受け取り、
      目を通した
  d_nikke_mint_02_17:
    speaker: "<Monologue>"
    en: It's a TV show about a couple whose relationship is growing stale after living
      together for eight years, and how they regain their spark.
    ko: 드라마는 동거 8년차 커플이 서로에게 드라이해지면서, 권태기를 극복해 나가는 이야기였다.
    ja: |-
      ドラマは、同棲8年目のカップルが
      お互いに冷めながらも、倦怠期を
      克服していくというストーリーだった
  d_nikke_mint_02_18:
    speaker: "<Self>"
    en: Can you show me your acting?
    ko: 일단 연기하는 것부터 보여 줄래?
    ja: まずは、演技を見せてもらえるか？
  d_nikke_mint_02_19:
    speaker: mint
    en: Sure.
    ko: 그럼요.
    ja: 分かりました。
  d_nikke_mint_02_20:
    speaker: mint
    en: What line do you want me to read?
    ko: 어떤 대사를 보여드리면 될까요?
    ja: どのセリフにしましょうか？
  d_nikke_mint_02_21:
    speaker: "<Self>"
    en: Hm...
    ko: 음….
    ja: そうだな…
  d_nikke_mint_02_22:
    speaker: "<Self>"
    en: This one.
    ko: 여기로 부탁해.
    ja: ここを読んでくれ
  d_nikke_mint_02_23:
    speaker: "<Monologue>"
    en: I point to a line of dialogue in the script.
    ko: 나는 대본의 한 대사를 가리켰다.
    ja: |-
      私は台本の中の
      あるセリフを指さした
  d_nikke_mint_02_24:
    speaker: mint
    en: That's the exact same one Prika and Avistar asked me to read.
    ko: 프리카랑 아비스타가 시켰던 대사랑 똑같네요.
    ja: プリカとアビスタが選んだセリフと一緒ですね。
  d_nikke_mint_02_25:
    speaker: mint
    en: I've already done it three times, so I know I can do it.
    ko: 이미 3번이나 해본 대사니까, 잘할 수 있어요.
    ja: |-
      もう3回も読んだので、
      自信あります。
  d_nikke_mint_02_26:
    speaker: mint
    en: All right, then... Ahem...
    ko: 그럼… 흠흠.
    ja: オホンッ…いきますね。
  d_nikke_mint_02_27:
    speaker: mint
    en: I'm Sick Of The Way Things Are.
    ko: 이제너랑이러고있는것도지겨워.
    ja: もうあんたといっしょにいるのもうんざりよ。
  d_nikke_mint_02_28:
    speaker: mint
    en: You And I Have Been Sitting Here Like This For Eight Years.
    ko: 8년이나너랑이러고앉아있었다니.
    ja: はちねんもこんなふうにすごしてきたなんて。
  d_nikke_mint_02_29:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_02_30:
    speaker: mint
    en: How was it?
    ko: 어때요?
    ja: どうですか？
  d_nikke_mint_02_31:
    speaker: "<Self>"
    en: Now I get how those two feel.
    ko: 나도 다른 둘의 마음을 알 것 같아.
    ja: |-
      私もプリカとアビスタの
      気持ちが分かる気がする
  d_nikke_mint_02_32:
    speaker: mint
    en: What?! I think I did pretty good.
    ko: 아니, 이 정도면 괜찮다고 생각하는데요.
    ja: このくらいなら、大丈夫だと思うんですけどね。
  d_nikke_mint_02_33:
    speaker: mint
    en: I know I can improve a little, but I'm not that bad.
    ko: 진짜 조금 부족한 것뿐이지, 괜찮다니까요?
    ja: |-
      あとほんのちょっと上達すればいいだけで、
      今でも問題ないんですから。
  d_nikke_mint_02_34:
    speaker: "<Self>"
    en: You really think your acting is good?
    ko: "…진심으로 본인 연기가 괜찮다고 생각해?"
    ja: |-
      …本気で自分の演技が
      問題ないと思っているのか？
  d_nikke_mint_02_35:
    speaker: "<Monologue>"
    en: The playful smile disappears from Mint's lips.
    ko: 민트의 입가에서 장난스러운 웃음이 사라졌다.
    ja: |-
      ミントの口元から
      いたずらっぽい笑みが消えた
  d_nikke_mint_02_36:
    speaker: mint
    en: "... No."
    ko: "…아뇨."
    ja: "…いいえ。"
  d_nikke_mint_02_37:
    speaker: mint
    en: Honestly, I know how bad I am.
    ko: 사실은 알고 있어요.
    ja: ちゃんと、分かっているんです。
  d_nikke_mint_02_38:
    speaker: mint
    en: My acting needs a lot of work.
    ko: 제 연기가 많이 부족하다는 거요.
    ja: 自分の演技が下手だってこと。
  d_nikke_mint_02_39:
    speaker: "<Self>"
    en: And yet you still want to do this?
    ko: 그런데도 하고 싶은 거야?
    ja: それでも、やりたいのか？
  d_nikke_mint_02_40:
    speaker: mint
    en: Yeah.
    ko: 네.
    ja: ええ。
  d_nikke_mint_02_41:
    speaker: mint
    en: T.T. STAR has gotten... big.
    ko: T.T. STAR는 말이죠.
    ja: T.T. STARは、
  d_nikke_mint_02_42:
    speaker: mint
    en: We're at the height of our popularity right now.
    ko: 지금 최절정의 인기 아이돌이에요.
    ja: 今をときめく超売れっ子アイドルですよね。
  d_nikke_mint_02_43:
    speaker: mint
    en: Everything we do, from our concerts to TV appearances, is a huge success.
    ko: 콘서트를 열든, 예능을 나가든 뭘 해도 잘 나가고 있어요.
    ja: |-
      コンサートを開いても、バラエティに出ても、
      何をしても話題の中心にいます。
  d_nikke_mint_02_44:
    speaker: mint
    en: But we can't just stand in place and be happy with how things are.
    ko: 그렇다고 여기에 만족하고 멈춰서선 안 돼요.
    ja: |-
      だからといって、この場所に満足して
      足を止めるわけにはいかないんです。
  d_nikke_mint_02_45:
    speaker: mint
    en: We need to branch out into new things if we don't want to become old news.
    ko: 꾸준히 활동 반경을 넓혀 나가야, 이 바닥에서 도태되지 않을 수 있으니까요.
    ja: |-
      地道に活動の場を広げていかなきゃ、
      この厳しい業界では生き残れませんから。
  d_nikke_mint_02_46:
    speaker: mint
    en: That's why I really don't want to miss this opportunity,
    ko: 그래서 이번 기회를 놓치고 싶지 않아요.
    ja: だから、このチャンスを逃したくないんです。
  d_nikke_mint_02_47:
    speaker: mint
    en: especially since it came to me.
    ko: 특히나 좋은 기회가 먼저 찾아왔다면 더더욱요.
    ja: |-
      しかも、願ってもないチャンスが
      向こうから舞い込んできたなら、
      なおさらです。
  d_nikke_mint_02_48:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_02_49:
    speaker: "<Monologue>"
    en: Mint is looking me right in the eyes.
    ko: 민트가 내 눈을 똑바로 바라보고 있다.
    ja: |-
      ミントは私の目を
      まっすぐに見つめている
  d_nikke_mint_02_50:
    speaker: "<Self>"
    en: You seem serious.
    ko: 진심인 모양이네.
    ja: 本気のようだな
  d_nikke_mint_02_51:
    speaker: mint
    en: I'm completely serious.
    ko: 네, 상당히 진심이에요.
    ja: ええ、本気です。
  d_nikke_mint_02_52:
    speaker: "<Self>"
    en: Okay, I'll help you.
    ko: 알았어. 도와줄게.
    ja: 分かった、手伝おう
  d_nikke_mint_02_53:
    speaker: mint
    en: Really?
    ko: "…정말요?"
    ja: "…本当ですか？"
  d_nikke_mint_02_54:
    speaker: "<Self>"
    en: I should say, though, that while I do watch a lot of TV,
    ko: 그런데 내가 드라마를 자주 보긴 해도,
    ja: |-
      ただ、確かに私はドラマを
      よく観るほうだが
  d_nikke_mint_02_55:
    speaker: "<Self>"
    en: I'm not an expert, so don't just blindly trust everything I say.
    ko: 전문가는 아니니까 맹신하면 안 돼.
    ja: |-
      プロではない。
      何でも鵜呑みにしないように
  d_nikke_mint_02_56:
    speaker: mint
    en: Yeah, I know.
    ko: 네, 알고 있어요.
    ja: ええ、分かっています。
  d_nikke_mint_02_57:
    speaker: mint
    en: Still, I wanted to ask for your help anyway.
    ko: 알고 있는데도 아기 고양이씨한테 부탁드리는 거예요.
    ja: |-
      プロじゃないと分かった上で、
      子ネコさんにお願いしているんです。
  d_nikke_mint_02_58:
    speaker: mint
    en: Something tells me that if I practice with you, you'll be able to get me on
      track.
    ko: 아기 고양이씨라면, 뭔가 해결해 줄 수 있을 것 같다는 믿음이 있으니까요.
    ja: |-
      子ネコさんなら、きっと
      何とかしてくれるって信じています。
  d_nikke_mint_02_59:
    speaker: mint
    en: Anyway, let's do this!
    ko: 그럼 잘 부탁드립니다~
    ja: どうぞ、よろしくお願いします。
  d_nikke_mint_02_60:
    speaker: "<Monologue>"
    en: Mint smiles.
    ko: 민트가 고개를 꾸벅였다.
    ja: ミントは、ぺこりと頭を下げた
  d_nikke_mint_02_61:
    speaker: "<Self>"
    en: Let's start with the first scene in the script.
    ko: 일단 대본 첫 번째 장면부터 연습해볼까.
    ja: |-
      まずは、台本の
      最初のシーンから練習しよう
  d_nikke_mint_02_62:
    speaker: mint
    en: The first scene...
    ko: 첫 번째 장면….
    ja: 最初のシーン…
  d_nikke_mint_02_63:
    speaker: mint
    en: It starts with the two main characters finishing work and going home together.
    ko: 주인공 두명이 회사에서 퇴근하고 같이 돌아가는 장면이네요.
    ja: |-
      主人公の2人が仕事を終えて、
      一緒に帰宅するシーンですね。
  d_nikke_mint_02_64:
    speaker: mint
    en: I'll go first.
    ko: 그럼 제가 먼저 대사 할 게요?
    ja: じゃあ、私から始めますね？
  d_nikke_mint_02_65:
    speaker: "<Self>"
    en: Okay.
    ko: 응.
    ja: ああ
  d_nikke_mint_02_66:
    speaker: mint
    en: What Do You Want For Dinner.
    ko: 오늘저녁에뭐먹을까.
    ja: きょうのゆうしょくなににする。
  d_nikke_mint_02_67:
    speaker: "<Self>"
    en: "... Anything is fine."
    ko: "…아무거나."
    ja: "…なんでもいい"
  d_nikke_mint_02_68:
    speaker: mint
    en: Don't Say That.
    ko: 아무거나말고.
    ja: なんでもいいじゃなくて。
  d_nikke_mint_02_69:
    speaker: mint
    en: I Picked Out Dinner Last Night Too.
    ko: 어제도내가메뉴골랐었잖아.
    ja: |-
      きのうもわたしがメニューを
      かんがえたわよね。
  d_nikke_mint_02_70:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_02_71:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_02_72:
    speaker: mint
    en: Why aren't you saying the next line?
    ko: 아까부터 왜 자꾸 다음 대사를 안 해요?
    ja: 早く次のセリフを言ってくれますか？
  d_nikke_mint_02_73:
    speaker: "<Self>"
    en: Sorry.
    ko: 미안.
    ja: すまない
  d_nikke_mint_02_74:
    speaker: "<Self>"
    en: It's hard to focus for some reason...
    ko: 뭔가 지금 집중이 어려워서….
    ja: ちょっと集中できなくて…
  d_nikke_mint_02_75:
    speaker: mint
    en: I get that.
    ko: 이해해요.
    ja: その気持ち、分かります。
  d_nikke_mint_02_76:
    speaker: mint
    en: It must make you so nervous, looking me in the eyes and acting across from
      me.
    ko: 저랑 이렇게 눈을 마주보고 연기를 한다는 것 자체가, 얼마나 심장에 무리가 가겠어요?
    ja: |-
      私と見つめ合いながら演技するなんて、
      心臓がドキドキしちゃいますよね。
  d_nikke_mint_02_77:
    speaker: mint
    en: No wonder you can't focus.
    ko: 충분히 집중 못할 만 하죠.
    ja: 集中できなくて当然です。
  d_nikke_mint_02_78:
    speaker: "<Self>"
    en: No, it's because your acting is so awk...
    ko: 아니, 집중이 어려울 정도로 연기가 어설….
    ja: |-
      いや、集中できないほど
      セリフが棒よ…
  d_nikke_mint_02_79:
    speaker: mint
    en: What?
    ko: 네?
    ja: はい？
  d_nikke_mint_02_80:
    speaker: "<Self>"
    en: Err, it's nothing.
    ko: 아니, 아무것도 아니야.
    ja: いいや、何でもない
  d_nikke_mint_02_81:
    speaker: mint
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_mint_02_82:
    speaker: mint
    en: Anyway, I'll wait until you're ready. Just tell me when.
    ko: 일단 천천히 기다려 드릴 테니까, 준비되면 말씀하세요.
    ja: |-
      待ってますから、
      準備が整ったら教えてくださいね。
  d_nikke_mint_02_83:
    speaker: mint
    en: I can start whenever.
    ko: 전 언제 시작해도 좋으니까요.
    ja: 私は、いつでも始められますから。
  d_nikke_mint_02_84:
    speaker: mint
    en: I'll just read over the script while I wait.
    ko: 그러면 기다리는 동안 전 대본 좀 읽고 있을게요~
    ja: |-
      じゃあ、待ってる間に
      台本に目を通しておきます～
  d_nikke_mint_02_85:
    speaker: "<Self>"
    en: Okay...
    ko: 응….
    ja: ああ…
  d_nikke_mint_02_86:
    speaker: "<Monologue>"
    en: Now that I'm reading with Mint, it's really starting to hit me just how stiff
      her acting is.
    ko: 직접 상대 연기를 하려고 하니, 민트의 국어책 읽기가 유독 와닿았다.
    ja: |-
      実際に相手役を演じてみると、
      ミントの棒読みが気になって集中できない
  d_nikke_mint_02_87:
    speaker: "<Self>"
    en: I start to wonder...
    ko: 연습….
    ja: この練習…
  d_nikke_mint_02_88:
    speaker: "<Self>"
    en: Can I really help her improve...?
    ko: 잘할 수 있을까…?
    ja: うまくいくだろうか…？
d_nikke_mint_03:
  d_nikke_mint_03_1:
    speaker: "<Narration>"
    en: Day three of practice.
    ko: 연습 3일차.
    ja: 練習3日目
  d_nikke_mint_03_2:
    speaker: mint
    en: What do you want to eat today?
    ko: 우리 오늘 뭐 먹을까?
    ja: 今日は何を食べよっか？
  d_nikke_mint_03_3:
    speaker: mint
    en: Hmm... Okay.
    ko: 음… 이건 괜찮고.
    ja: そうね…これがいいわ。
  d_nikke_mint_03_4:
    speaker: mint
    en: What are you doing this weekend?
    ko: 이번 주말엔 뭐해?
    ja: 今週末は、何する予定？
  d_nikke_mint_03_5:
    speaker: mint
    en: That's not bad either.
    ko: 이것도 나쁘지 않아.
    ja: それも悪くないわね。
  d_nikke_mint_03_6:
    speaker: "<Self>"
    en: Your acting has gotten much better.
    ko: 연기가 훨씬 나아졌네.
    ja: だいぶ自然になってきたな
  d_nikke_mint_03_7:
    speaker: mint
    en: Of course it has.
    ko: 그럼요.
    ja: 当たり前でしょう。
  d_nikke_mint_03_8:
    speaker: mint
    en: This is me we're talking about.
    ko: 제가 누군데요.
    ja: 私を誰だと思ってるんですか。
  d_nikke_mint_03_9:
    speaker: mint
    en: Acting's a breeze if you just practice a bit.
    ko: 조금만 연습하면, 연기쯤이야 쉽죠.
    ja: |-
      ちょっと練習さえすれば、
      演技なんて楽勝ですよ。
  d_nikke_mint_03_10:
    speaker: "<Self>"
    en: Uh-huh...
    ko: 그래….
    ja: そうか…
  d_nikke_mint_03_11:
    speaker: "<Self>"
    en: Well, you definitely don't sound like you're reading out of a book now...
    ko: 확실히 국어책 읽기는 없어졌지….
    ja: 確かに、棒読みではなくなったな…
  d_nikke_mint_03_12:
    speaker: mint
    en: Okay, onto the next scene!
    ko: 그럼 다음 장면은~
    ja: それじゃ、次のシーンは～
  d_nikke_mint_03_13:
    speaker: mint
    en: In this one, the couple is eating and talking about work.
    ko: 식사하면서 회사 이야기를 하는 커플, 이거다.
    ja: |-
      食事をしながら、仕事の話をするカップル。
      ここだわ。
  d_nikke_mint_03_14:
    speaker: mint
    en: Let's get to it. Sit at your desk, please.
    ko: 자, 빨리 연습하게 아기 고양이씨도 책상에 앉아주세요.
    ja: |-
      ほら、早く始めましょう。
      子ネコさんも椅子に座ってください。
  d_nikke_mint_03_15:
    speaker: "<Monologue>"
    en: I sit at my desk across from Mint.
    ko: 나는 민트와 마주보고 책상에 앉았다.
    ja: |-
      私はミントと向かい合う形で
      椅子に座った
  d_nikke_mint_03_16:
    speaker: mint
    en: How was work today?
    ko: 오늘 회사에서 어땠어?
    ja: 今日の仕事、どうだった？
  d_nikke_mint_03_17:
    speaker: "<Self>"
    en: Same as usual, I guess.
    ko: 그냥 평소랑 똑같지, 뭐.
    ja: まあ、いつもと同じかな
  d_nikke_mint_03_18:
    speaker: "<Self>"
    en: How about you, babe? How was your...
    ko: 자기는 어땠….
    ja: お前は、どうだっ…
  d_nikke_mint_03_19:
    speaker: mint
    en: Whoa!
    ko: 꺄앗!
    ja: わっ！
  d_nikke_mint_03_20:
    speaker: mint
    en: Did you...
    ko: 어떡해!
    ja: 今…
  d_nikke_mint_03_21:
    speaker: mint
    en: Did you just call me babe?!
    ko: 자기가 뭐예요, 자기가!
    ja: "「お前」…って言いました！？"
  d_nikke_mint_03_22:
    speaker: mint
    en: You've got some guts, saying that to a pop star.
    ko: 아이돌한테 못하는 말이 없으시네요~
    ja: アイドルが相手でも、遠慮なく言えるんですね～
  d_nikke_mint_03_23:
    speaker: "<Self>"
    en: I'm just reading what's in the script.
    ko: 이건 그냥 대사잖아.
    ja: ただのセリフじゃないか
  d_nikke_mint_03_24:
    speaker: mint
    en: Hehe.
    ko: 후후.
    ja: ふふっ。
  d_nikke_mint_03_25:
    speaker: mint
    en: It's okay. I know how much you must've wanted to say it, even if only while
      acting.
    ko: 연기로라도 말해보고 싶은 마음, 잘 알겠어요.
    ja: |-
      演技でもいいから、
      そう呼んでみたかったんですよね。
      ちゃんと分かってますから。
  d_nikke_mint_03_26:
    speaker: mint
    en: Now, let's continue with the next line.
    ko: 그럼 다음 대사로 넘어갈까요?
    ja: じゃ、次のセリフに移りましょうか。
  d_nikke_mint_03_27:
    speaker: "<Self>"
    en: Right...
    ko: "…그래."
    ja: "…ああ"
  d_nikke_mint_03_28:
    speaker: mint
    en: My boss was breathing down my neck, and my team wouldn't give me a break.
    ko: 위에선 쪼고, 아래에선 치대고.
    ja: |-
      上司には詰められるし、
      部下には頼られっぱなし。
  d_nikke_mint_03_29:
    speaker: mint
    en: So same as usual for me too.
    ko: 나도 뭐 항상 똑같지.
    ja: 私もいつもと同じよ。
  d_nikke_mint_03_30:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_03_31:
    speaker: "<Self>"
    en: And the next line?
    ko: 다음 대사는?
    ja: 次は？
  d_nikke_mint_03_32:
    speaker: mint
    en: It says, "(Burping, then smiling) Oh, sorry."
    ko: '[(트림을 한 뒤 웃으며)"아, 미안~"]'
    ja: |-
      「（ゲップをして笑いながら）
      『あっ、ごめ～ん』」
  d_nikke_mint_03_33:
    speaker: mint
    en: How am I supposed to do that?
    ko: 이런 걸 제가 어떻게 해요?
    ja: |-
      いくら台本に書いてあるからって…
      これを私がやるんですか？
  d_nikke_mint_03_34:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_03_35:
    speaker: "<Monologue>"
    en: Now that Mint had fixed her issue with sounding so monotone,
    ko: 민트는 국어책 읽기를 고친 이후,
    ja: ミントの棒読みはだいぶ改善したが
  d_nikke_mint_03_36:
    speaker: "<Monologue>"
    en: 'we''ve encountered a new problem: she''s unable to focus on the scene, and
      she keeps breaking character.'
    ko: 역할에 이입하지 못하고 자기 자신이 튀어나온다는, 새로운 문제가 생겼다.
    ja: |-
      役に入り込めず、
      素の自分が出てしまうという
      新たな問題に直面していた
  d_nikke_mint_03_37:
    speaker: "<Self>"
    en: This isn't going to work.
    ko: 안 되겠어.
    ja: それではダメだ
  d_nikke_mint_03_38:
    speaker: mint
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_mint_03_39:
    speaker: mint
    en: What's wrong?
    ko: 왜 그러세요?
    ja: どうしました？
  d_nikke_mint_03_40:
    speaker: mint
    en: You look so serious.
    ko: 분위기 확 잡는 표정이네요.
    ja: 急に真剣な顔しちゃって。
  d_nikke_mint_03_41:
    speaker: "<Self>"
    en: You're not getting in to your character at all.
    ko: 지금 민트는 전혀 역할에 이입하질 않고 있어.
    ja: |-
      今のミントは
      まったく役になりきれていない
  d_nikke_mint_03_42:
    speaker: "<Self>"
    en: This requires special measures.
    ko: 그래서 특단의 조치가 필요해.
    ja: |-
      だから、思い切った手を打つ
      必要がある
  d_nikke_mint_03_43:
    speaker: mint
    en: What do you mean?
    ko: 특단의 조치요?
    ja: 思い切った手、ですか？
  d_nikke_mint_03_44:
    speaker: "<Self>"
    en: For the rest of your practice time,
    ko: 남은 연습 기간 동안.
    ja: 残りの練習期間は、ずっと
  d_nikke_mint_03_45:
    speaker: "<Self>"
    en: let's actually live together.
    ko: 우리 진짜로 같이 살자.
    ja: 本当に一緒に住もう
  d_nikke_mint_03_46:
    speaker: mint
    en: Wait, you're seriously asking me to live with you?
    ko: "…정말로 동거를 하자는 말씀이세요?"
    ja: "…実際に同棲しようってことですか？"
  d_nikke_mint_03_47:
    speaker: "<Self>"
    en: Yeah.
    ko: 응.
    ja: ああ
  d_nikke_mint_03_48:
    speaker: "<Self>"
    en: You keep breaking character as we practice,
    ko: 대본을 연습하고 있는데, 자꾸 민트가 튀어나오잖아.
    ja: |-
      練習していても、
      すぐに「ミント」が出る
  d_nikke_mint_03_49:
    speaker: "<Self>"
    en: so let's actually live together and recreate the situations you're supposed
      to act out.
    ko: |-
      그러니까 실제로 같이 살면서,
      우리가 연기해야 하는 상황을 재현해보자.
    ja: |-
      だから、実際に同棲して
      台本の中の状況を再現してみよう
  d_nikke_mint_03_50:
    speaker: "<Monologue>"
    en: Mint smiles.
    ko: 민트의 입꼬리가 올라갔다.
    ja: ミントの口元が緩んだ
  d_nikke_mint_03_51:
    speaker: mint
    en: Are you sure?
    ko: 괜찮으시겠어요?
    ja: いいんですか？
  d_nikke_mint_03_52:
    speaker: mint
    en: I don't mind, but will you really be okay?
    ko: 저는 상관 없는데, 아기 고양이씨가 괜찮을지 모르겠거든요.
    ja: |-
      私は平気ですけど、
      子ネコさんが大丈夫かなと思って。
  d_nikke_mint_03_53:
    speaker: mint
    en: If you spend all day with someone as pretty as me, you'll start having all
      sorts of thoughts.
    ko: 이렇게 예쁜 저랑 하루 종일 같이 있으면, 별 생각 다 들 것 아니에요.
    ja: |-
      一日中、こんなにかわいい私と一緒にいたら、
      あれこれ想像しちゃうんじゃないですか？
  d_nikke_mint_03_54:
    speaker: "<Self>"
    en: Oh, I don't mind at all.
    ko: 나는 딱히 상관 없….
    ja: 私は別に構わな…
  d_nikke_mint_03_55:
    speaker: mint
    en: Uh-huh.
    ko: 그렇죠.
    ja: そうですよね。
  d_nikke_mint_03_56:
    speaker: mint
    en: I bet you don't.
    ko: 그렇겠죠.
    ja: よく分かります。
  d_nikke_mint_03_57:
    speaker: mint
    en: It's a chance to spend all day with me. Of course this is something you'd
      want.
    ko: 저랑 하루 종일 붙어 있을 수 있는 기회니까, 당연~히 아기 고양이씨는 하고 싶겠죠.
    ja: |-
      一日中、私と一緒にいられる
      チャンスなんですから、
      もちろん子ネコさんは同棲したいですよね。
  d_nikke_mint_03_58:
    speaker: mint
    en: I get it.
    ko: 그 마음 이해해요.
    ja: その気持ち、痛いほど分かりますよ。
  d_nikke_mint_03_59:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_03_60:
    speaker: mint
    en: Can I go swing by my dorm?
    ko: 그러면 저, 잠깐 숙소에 다녀와도 될까요?
    ja: |-
      それじゃ、ちょっと宿所に
      行ってきてもいいですか？
  d_nikke_mint_03_61:
    speaker: mint
    en: I have a lot of stuff to bring.
    ko: 챙겨와야 할 것들이 많거든요.
    ja: |-
      持ってこないといけないものが
      たくさんあるんです。
  d_nikke_mint_03_62:
    speaker: "<Self>"
    en: Okay.
    ko: 그래, 알았어.
    ja: ああ、分かった
  d_nikke_mint_03_63:
    speaker: mint
    en: See you soon!
    ko: 그럼, 이따 봐요~
    ja: それじゃ、また後で～
  d_nikke_mint_03_64:
    speaker: "<Monologue>"
    en: Mint leaves the room.
    ko: 민트가 지휘관실을 나섰다.
    ja: ミントが指揮官室を出ていった
  d_nikke_mint_03_65:
    speaker: "<Narration>"
    en: Several hours later...
    ko: 몇 시간 뒤.
    ja: 数時間後
  d_nikke_mint_03_66:
    speaker: mint
    en: Oof...
    ko: "…읏차."
    ja: "…よいしょっと。"
  d_nikke_mint_03_67:
    speaker: "<Monologue>"
    en: Mint puts her bags on the floor.
    ko: 민트가 짐들을 바닥에 내려놓았다.
    ja: ミントが荷物を床に置いた
  d_nikke_mint_03_68:
    speaker: "<Self>"
    en: What's all this...?
    ko: 이게 다 뭐야….
    ja: 何だ、これは？
  d_nikke_mint_03_69:
    speaker: "<Monologue>"
    en: There's so much stuff that it's blocking the entrance to the room.
    ko: 짐이 너무 많은 탓에, 지휘관실 입구는 발디딜 틈조차 없었다.
    ja: |-
      指揮官室の入口にたくさんの荷物が置かれ、
      足の踏み場もなくなっていた
  d_nikke_mint_03_70:
    speaker: mint
    en: Since I'm going to be living here for a while, I brought everything I'll need.
    ko: 한동안 지휘관실에서 살게 될 테니까, 필요한 건 전부 챙겨왔죠.
    ja: |-
      しばらくここで暮らすことになるので、
      必要なものを全部持ってきたんです。
  d_nikke_mint_03_71:
    speaker: mint
    en: Clothes, PJs, shampoo, conditioner, serum, my hair dryer, facial masks...
    ko: 갈아 입을 옷이랑, 잠옷, 샴푸, 린스, 트리트먼트, 헤어 드라이어, 수분 팩….
    ja: |-
      着替えとパジャマ、シャンプーとリンス、
      トリートメントとドライヤー、水分補給パック…
  d_nikke_mint_03_72:
    speaker: "<Self>"
    en: You need all that when you're just going to be here for a little while?
    ko: 잠깐 동거하는데 그렇게까지 필요한 거야?
    ja: |-
      少しの間、一緒に暮らすだけなのに
      そんなに必要なのか？
  d_nikke_mint_03_73:
    speaker: mint
    en: I'm a pop star. For us, self-care is not a choice but an obligation.
    ko: |-
      저, 아이돌이잖아요.
      아이돌에게 자기 관리는 선택이 아니라 필수죠.
    ja: |-
      私、アイドルじゃないですか。
      アイドルにとってセルフケアは
      当たり前のことなんです。
  d_nikke_mint_03_74:
    speaker: mint
    en: I'm actually worried I didn't bring enough.
    ko: 오히려 모자르진 않을까 걱정인데요?
    ja: |-
      むしろ、足りないんじゃないかって
      心配なくらいですよ。
  d_nikke_mint_03_75:
    speaker: "<Self>"
    en: I see...
    ko: 그렇구나….
    ja: そうか…
  d_nikke_mint_03_76:
    speaker: mint
    en: Now then,
    ko: 그럼 아기 고양이씨.
    ja: じゃあ、子ネコさん。
  d_nikke_mint_03_77:
    speaker: mint
    en: will you help me unpack all this stuff?
    ko: 짐이 너무 많아서 그런데, 짐 푸는 것 좀 도와주실래요?
    ja: |-
      とりあえずこれを
      片付けるのを手伝ってくれませんか？
  d_nikke_mint_03_78:
    speaker: mint
    en: You can start by pulling everything out.
    ko: 일단 가져온 것들을 전부 꺼내면 돼요.
    ja: まずは、カバンから中身を全部出してください。
  d_nikke_mint_03_79:
    speaker: "<Self>"
    en: Okay.
    ko: 알았어.
    ja: 分かった
  d_nikke_mint_03_80:
    speaker: mint
    en: Wait!
    ko: 아!
    ja: あっ！
  d_nikke_mint_03_81:
    speaker: mint
    en: Unpack everything except for that small black bag.
    ko: 작은 검정색 가방에 있는 물건은 빼고서 꺼내주세요.
    ja: 小さい黒のバッグは開けないでくださいね。
  d_nikke_mint_03_82:
    speaker: "<Self>"
    en: Small black bag?
    ko: 검정색 가방?
    ja: 黒のバッグ？
  d_nikke_mint_03_83:
    speaker: "<Self>"
    en: Why? What's inside?
    ko: 뭐가 들어 있는데?
    ja: 何が入っているんだ？
  d_nikke_mint_03_84:
    speaker: mint
    en: I'm pretty sure it'd make you uncomfortable if you saw it.
    ko: 뭐가 들었는지 알면, 아기 고양이씨가 곤란할 텐데요?
    ja: |-
      それを知ったら、
      子ネコさんはアタフタしちゃうかもですね？
  d_nikke_mint_03_85:
    speaker: "<Self>"
