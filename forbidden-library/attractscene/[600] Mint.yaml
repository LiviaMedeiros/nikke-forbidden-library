    ko: "!!"
    ja: "！！"
  d_nikke_mint_03_88:
    speaker: mint
    en: I won't be upset if you accidentally happen to get a peek,
    ko: 아기 고양이씨라면 실수로 봤다고 하는 것까지는 봐드릴 수 있어요.
    ja: |-
      うっかり見てしまったってことなら、
      子ネコさんだから大目にみてあげます。
  d_nikke_mint_03_89:
