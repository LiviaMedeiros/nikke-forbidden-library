    en: but you're not allowed to steal any.
    ko: 그렇다고 훔쳐가시는 건 안 돼요~
    ja: でも、盗むのはダメですからね～
  d_nikke_mint_03_90:
    speaker: "<Self>"
    en: I wouldn't do that.
    ko: 안 훔쳐….
    ja: 盗まない…
  d_nikke_mint_03_91:
    speaker: mint
    en: Even though it's mine?
    ko: 다른 사람도 아니고, 제 건데요?
    ja: 私の下着ですよ？
  d_nikke_mint_03_92:
    speaker: "<Self>"
    en: I... wouldn't...
    ko: 안… 훔쳐….
    ja: 盗…まない…
  d_nikke_mint_03_93:
    speaker: mint
    en: Haha! I knew I could trust you.
    ko: 하핫~ 역시 아기 고양이씨는 믿음이 가네요.
    ja: ふふっ。やっぱり子ネコさんは信頼できますね。
  d_nikke_mint_03_94:
    speaker: mint
    en: All right, now let's get unpacking.
    ko: 자, 그럼 빨리 짐 푸는 것 좀 도와주실래요?
    ja: さてと、早く片付けましょうか？
  d_nikke_mint_03_95:
    speaker: "<Monologue>"
    en: I help Mint unpack her things, and we begin our first day of living together.
    ko: 그렇게 민트의 짐 정리를 도와주며, 우리의 동거 첫째 날이 지나갔다.
    ja: |-
      そうしてミントの荷物の整理を手伝い、
      私たちの同棲初日は過ぎていった
d_nikke_mint_04:
  d_nikke_mint_04_1:
    speaker: "<Narration>"
    en: Day four of practice.
    ko: 연습 4일차.
    ja: 練習4日目
  d_nikke_mint_04_2:
    speaker: "<Monologue>"
    en: In order to practice being a couple watching a movie at home together,
    ko: 같이 집에서 영화를 보는 커플을 연습하기 위해,
    ja: |-
      「家で一緒に映画を観るカップル」の
      演技のため
  d_nikke_mint_04_3:
    speaker: "<Monologue>"
    en: Mint and I sit on the couch and watch a zombie movie.
    ko: 나는 민트와 함께 소파에 앉아 좀비 영화를 보고 있었다.
    ja: |-
      私はミントとソファに座り、
      ゾンビ映画を観ていた
  d_nikke_mint_04_4:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_04_5:
    speaker: mint
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_mint_04_6:
    speaker: "<Monologue>"
    en: As we watch the movie,
    ko: 하지만 영화를 보는 내내,
    ja: しかし、映画を観ている間
  d_nikke_mint_04_7:
    speaker: "<Monologue>"
    en: Mint keeps leaning against my arm before moving away again.
    ko: 민트는 내 팔에 붙었다 떨어졌다를 반복하고 있다.
    ja: |-
      ミントは私の腕に
      くっついたり離れたりを
      繰り返している
  d_nikke_mint_04_8:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_04_9:
    speaker: mint
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_mint_04_10:
    speaker: "<Self>"
    en: Is the couch uncomfortable?
    ko: 혹시 자리가 불편해?
    ja: 座り心地でも悪いのか？
  d_nikke_mint_04_11:
    speaker: mint
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_mint_04_12:
    speaker: "<Self>"
    en: You just seem a bit fidgety.
    ko: 뭔가 안절부절 못하는 것 같아서.
    ja: なんだか落ち着かないようだな
  d_nikke_mint_04_13:
    speaker: mint
    en: Oh, I just...
    ko: 그냥 좀….
    ja: なんていうか…
  d_nikke_mint_04_14:
    speaker: "<Self>"
    en: You just what?
    ko: 그냥 좀?
    ja: なんていうか？
  d_nikke_mint_04_15:
    speaker: mint
    en: When the characters are watching a movie in the script, they sit so close
      to each other that they're touching.
    ko: 대본에서는 주인공들이 영화보면서 딱 달라 붙어 있잖아요?
    ja: |-
      台本では、2人が映画を観ながら
      ぴったりくっついてるじゃないですか。
  d_nikke_mint_04_16:
    speaker: "<Self>"
    en: So?
    ko: 있잖아요?
    ja: "「じゃないですか」？"
  d_nikke_mint_04_17:
    speaker: mint
    en: So...
    ko: 아니, 붙어 있잖아?
    ja: あっ、間違えた、くっついてるでしょ？
  d_nikke_mint_04_18:
    speaker: mint
    en: I was trying to do the same thing,
    ko: 그래서 그걸 좀 따라해 보려고 한 건데,
    ja: だから、その通りにしてみようと思ったのに…
  d_nikke_mint_04_19:
    speaker: mint
    en: but when I lean against your arm, I keep getting these thoughts.
    ko: 아기 고양이씨 팔에 붙어 있으려니까 자꾸 딴 생각이 들어서요.
    ja: |-
      子ネコさんの腕に触れていると、
      どうも集中できないんです。
  d_nikke_mint_04_20:
    speaker: "<Self>"
    en: What thoughts?
    ko: 들어서요?
    ja: "「できないんです」？"
  d_nikke_mint_04_21:
    speaker: mint
    en: J-just let me talk for a second. I'm trying to be honest here.
    ko: 바, 반말하는 건 천천히 적응하면 되니까, 어색해도 조금만 참아주세요.
    ja: |-
      タ、タメ口はだんだん慣れていきますから、
      不自然でも少しだけ我慢してください。
  d_nikke_mint_04_22:
    speaker: mint
    en: I just... I can't stop thinking about how much I want to squeeze your arm.
      It's driving me insa...
    ko: 가뜩이나 팔 한번 주물러 보고 싶은 생각 때문에, 신경쓰여 죽겠….
    ja: |-
      ただでさえ、腕を触ってみたくて
      たまらないんだから、落ち着かなく…
  d_nikke_mint_04_23:
    speaker: "<Self>"
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_mint_04_24:
    speaker: mint
    en: Ahem.
    ko: 크흠.
    ja: オホンッ。
  d_nikke_mint_04_25:
    speaker: mint
    en: Never mind.
    ko: 아무것도 아니에요.
    ja: 何でもありません。
  d_nikke_mint_04_26:
    speaker: mint
    en: More importantly, why do you look so calm right now?
    ko: 그보다 아기 고양이씨는 왜 아무렇지도 않은 얼굴인가요?
    ja: |-
      そんなことより、子ネコさんは
      どうして平気な顔をしてるんですか？
  d_nikke_mint_04_27:
    speaker: "<Self>"
    en: What do you mean?
    ko: 내가 왜?
    ja: いけないのか？
  d_nikke_mint_04_28:
    speaker: mint
    en: Do you really not feel anything when I lean so close to you?
    ko: 제가 이렇게 딱 달라붙어 있는 게 아무렇지도 않아요?
    ja: |-
      私がこんなにぴったりくっついてるのに、
      何とも思わないんですか？
  d_nikke_mint_04_29:
    speaker: mint
    en: It seems like it should be distracting you more.
    ko: 엄청 신경 쓰일 텐데요?
    ja: すっごく気になってるはずですよね？
  d_nikke_mint_04_30:
    speaker: "<Self>"
    en: Yeah, of course it's been distracting.
    ko: 신경 쓰이기는 해.
    ja: もちろん気になっている
  d_nikke_mint_04_31:
    speaker: mint
    en: Right?!
    ko: 그렇죠!
    ja: ですよね！
  d_nikke_mint_04_32:
    speaker: mint
    en: There's no way you could be so calm when I'm—
    ko: 제가 옆에 붙어 있는데, 아무렇지 않을 리가 없….
    ja: |-
      私がピタッってくっついてるのに、
      何も思わないはずが…
  d_nikke_mint_04_33:
    speaker: "<Self>"
    en: Still, we're trying to practice, so I haven't been letting it get to me.
    ko: 그래도 연습 중이니까 참아야지.
    ja: だが、練習中だろう
  d_nikke_mint_04_34:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_04_35:
    speaker: mint
    en: Right... That's the sort of person you are.
    ko: 그래요, 이런 분이었죠….
    ja: そうでした、こういう方でしたね…
  d_nikke_mint_04_36:
    speaker: mint
    en: Okay.
    ko: 알겠어요.
    ja: 分かりました。
  d_nikke_mint_04_37:
    speaker: mint
    en: Give me a moment and let's try again.
    ko: 저도 일단 마음을 좀 다잡고 다시 해볼게요.
    ja: 私も気を取り直して、もう一度やってみます。
  d_nikke_mint_04_38:
    speaker: mint
    en: Come on, Mint. This is not an arm...
    ko: 후우, 이건 팔이 아니다….
    ja: ふぅ、これは腕じゃない…
  d_nikke_mint_04_39:
    speaker: mint
    en: It's just a... log. Yeah. It's just a log...
    ko: 통나무다… 통나무다….
    ja: 丸太よ…丸太なの…
  d_nikke_mint_04_40:
    speaker: "<Monologue>"
    en: We continue watching the movie,
    ko: 그 뒤로도 영화를 같이 봤지만,
    ja: その後も、一緒に映画を観たが
  d_nikke_mint_04_41:
    speaker: "<Monologue>"
    en: but Mint keeps leaning close to my arm then moving away again.
    ko: 여전히 민트는 내 팔에 붙었다 떨어졌다를 반복했다.
    ja: |-
      相変わらずミントは私の腕に
      くっついたり離れたりを繰り返した
  d_nikke_mint_04_42:
    speaker: "<Narration>"
    en: Day five of practice.
    ko: 연습 5일차.
    ja: 練習5日目
  d_nikke_mint_04_43:
    speaker: "<Monologue>"
    en: I finish showering and step into the room.
    ko: 나는 샤워를 마치고 지휘관실에 돌아왔다.
    ja: |-
      私はシャワーを浴びて
      指揮官室に戻ってきた
  d_nikke_mint_04_44:
    speaker: mint
    en: Oh, you're done...
    ko: 아, 오셨….
    ja: あっ、戻ったん…
  d_nikke_mint_04_45:
    speaker: mint
    en: "!"
    ko: "!!"
    ja: "！！"
  d_nikke_mint_04_46:
    speaker: mint
    en: You came out in just your underwear again.
    ko: 또 속옷만 입고 나오셨네요.
    ja: また下着姿で…
  d_nikke_mint_04_47:
    speaker: "<Self>"
    en: I'm doing this every day so you can practice...
    ko: 연습 때문에 매일 이러고 나오는 건데….
    ja: |-
      練習のために、毎日これで
      出てきているのだが…
  d_nikke_mint_04_48:
    speaker: "<Self>"
    en: Isn't it about time you got used to it?
    ko: 이제 슬슬 적응할 때도 되지 않았어?
    ja: |-
      そろそろ慣れても
      いい頃じゃないか？
  d_nikke_mint_04_49:
    speaker: "<Self>"
    en: Is this even working?
    ko: 게다가 또 존댓말이 나왔네.
    ja: それに、また敬語になってるぞ
  d_nikke_mint_04_50:
    speaker: mint
    en: Yeah, I'm used to it.
    ko: 적응했어요.
    ja: 慣れてきましたよ。
  d_nikke_mint_04_51:
    speaker: mint
    en: I am.
    ko: 아니, 적응했어.
    ja: ううん、慣れてきたわ。
  d_nikke_mint_04_52:
    speaker: mint
    en: I don't even care anymore.
    ko: 그러니까 지금 아무렇지도 않잖아.
    ja: だから、もう何とも思ってないし。
  d_nikke_mint_04_53:
    speaker: "<Self>"
    en: You're staring so hard that I'm starting to wonder if you've forgotten how
      to blink.
    ko: 엄청 뚫어져라 쳐다보고 있는데?
    ja: 痛いほど視線を感じるな
  d_nikke_mint_04_54:
    speaker: mint
    en: I just try to fill these beautiful eyes with only pleasant sights.
    ko: 제 예쁜 눈에 멋있는 것만 담으려고 그래요.
    ja: |-
      私のキレイな瞳には、
      カッコいいものだけを映しておきたいんです。
  d_nikke_mint_04_55:
    speaker: mint
    en: It's not like I want to feel your abs,
    ko: 복근 한번 만져보고 싶다든가.
    ja: 腹筋を触ってみたいとか、
  d_nikke_mint_04_56:
    speaker: mint
    en: or hang from those thick arms of yours.
    ko: 저 두꺼운 팔에 한번 매달려보고 싶다든가.
    ja: あの太い腕にぶら下がってみたいとか、
  d_nikke_mint_04_57:
    speaker: mint
    en: I'm not thinking about any of that at all.
    ko: 그런 생각으로 보는 게 아니에요.
    ja: |-
      そういう下心があって
      見てるワケじゃありませんから。
  d_nikke_mint_04_58:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_04_59:
    speaker: "<Self>"
    en: Call me crazy,
    ko: 바로 존댓말로 돌아오네….
    ja: 急に敬語に戻ったな…
  d_nikke_mint_04_60:
    speaker: "<Self>"
    en: but I don't think focusing on "pleasant sights" is going to help you practice.
    ko: 이래선 연습이 안 되는데.
    ja: それじゃ練習にならないぞ
  d_nikke_mint_04_61:
    speaker: mint
    en: Okay, but I have a question.
    ko: 근데 아기 고양이씨.
    ja: ところで、子ネコさん。
  d_nikke_mint_04_62:
    speaker: mint
    en: Did you put on any kind of facial cream after your shower?
    ko: 얼굴에 아무것도 안 바르고 나온 거예요?
    ja: 顔に何も塗らないで出てきたんですか？
  d_nikke_mint_04_63:
    speaker: "<Self>"
    en: No.
    ko: 응.
    ja: ああ
  d_nikke_mint_04_64:
    speaker: mint
    en: I've noticed you don't do anything like that after you shower, but you really
      should.
    ko: 요 며칠째 계속 보면서 느낀 건데, 그러시면 안 돼요.
    ja: |-
      ここ数日、一緒にいて思ったんですが、
      その習慣はよくないですよ。
  d_nikke_mint_04_65:
    speaker: mint
    en: Right after a shower is the most important moment for skin care.
    ko: 샤워하고 난 직후가 피부 관리에 있어서 가장 중요한 순간이라고요.
    ja: |-
      シャワーして上がった直後が
      スキンケアで一番大事なタイミングなんです。
  d_nikke_mint_04_66:
    speaker: "<Self>"
    en: But if I put something on my face, it gets all sticky. I don't like it.
    ko: 얼굴에 뭘 바르면 끈적해서 싫어.
    ja: |-
      顔に何か塗ると
      ベタベタするから嫌なんだ
  d_nikke_mint_04_67:
    speaker: "<Monologue>"
    en: Mint looks carefully at my face.
    ko: 민트가 내 얼굴을 자세히 들여다 본다.
    ja: |-
      ミントが私の顔を
      じっとのぞきこんだ
  d_nikke_mint_04_68:
    speaker: mint
    en: I don't believe it.
    ko: "…말도 안 돼."
    ja: "…ウソでしょ。"
  d_nikke_mint_04_69:
    speaker: mint
    en: You really don't do anything to take care of your skin?
    ko: 정말 피부 관리 안하는 거 맞아요?
    ja: 本当にスキンケアしてないんですか？
  d_nikke_mint_04_70:
    speaker: mint
    en: I can't even tell.
    ko: 그런 피부가 아닌데?
    ja: そんなふうには見えません…
  d_nikke_mint_04_71:
    speaker: "<Self>"
    en: Then that means I don't have to change anything, right?
    ko: 그럼 괜찮은 거 아니야?
    ja: なら、しなくていいんじゃないか？
  d_nikke_mint_04_72:
    speaker: mint
    en: Wrong.
    ko: 아뇨.
    ja: それは違います。
  d_nikke_mint_04_73:
    speaker: mint
    en: Skin care is something you need to start when you're young.
    ko: 관리는 한 살이라도 젊었을 때부터 해야 의미가 있어요.
    ja: |-
      スキンケアは、1歳でも若いうちから
      始めることが、何よりも大切なんです。
  d_nikke_mint_04_74:
    speaker: mint
    en: In fact, it's because your skin is so nice right now that you need to take
      proper care of it.
    ko: 지금 좋으니까 오히려 더 잘 관리해야 하는 거죠.
    ja: |-
      今の状態がいいからこそ、
      きちんとケアをするべきですよ。
  d_nikke_mint_04_75:
    speaker: "<Self>"
    en: But it's so much work...
    ko: 귀찮은데….
    ja: 面倒だな…
  d_nikke_mint_04_76:
    speaker: mint
    en: Ugh, I swear...
    ko: 으휴, 정말…
    ja: まったくもう…
  d_nikke_mint_04_77:
    speaker: mint
    en: Are all men like this?
    ko: 남자들은 다 이런가요?
    ja: 男の人って、みんなこうなんですか？
  d_nikke_mint_04_78:
    speaker: mint
    en: Just come over here.
    ko: 됐으니까 이리 와 보세요.
    ja: いいから、こっちに来てください。
  d_nikke_mint_04_79:
    speaker: "<Monologue>"
    en: Mint pours some liquid onto a cotton pad and dabs it on my face.
    ko: 민트가 화장솜에 액체를 묻혀 내 얼굴에 문질렀다.
    ja: |-
      ミントはコットンに液体を含ませて
      私の顔に塗り込んだ
  d_nikke_mint_04_80:
    speaker: "<Self>"
    en: What's this?
    ko: 이건 뭐야?
    ja: 何だ、これは？
  d_nikke_mint_04_81:
    speaker: mint
    en: I'm balancing your pH levels with toner.
    ko: 토너로 피부결을 정돈하는 거예요.
    ja: 化粧水で肌のキメを整えているんです。
  d_nikke_mint_04_82:
    speaker: mint
    en: That should do it for that...
    ko: 이건 이 정도면 됐고….
    ja: このくらいでいいわね…
  d_nikke_mint_04_83:
    speaker: "<Monologue>"
    en: Next, she squirts a clear gel into her hands and rubs it on my face.
    ko: 이번엔 투명한 젤을 짜서 내 얼굴에 발라주었다.
    ja: |-
      今度は、透明なジェルを絞り出し
      私の顔に塗りたくった
  d_nikke_mint_04_84:
    speaker: "<Self>"
    en: That's cold.
    ko: 차가워.
    ja: 冷たい
  d_nikke_mint_04_85:
    speaker: mint
    en: Deal with it.
    ko: 참으세요.
    ja: 我慢してください。
  d_nikke_mint_04_86:
    speaker: mint
    en: We still have two more to go.
    ko: 아직 2개는 더 발라야 하니까요.
    ja: まだステップが2つ残ってますから。
  d_nikke_mint_04_87:
    speaker: "<Self>"
    en: Two more?!
    ko: 2개나 더?!
    ja: あと2つも！？
  d_nikke_mint_04_88:
    speaker: mint
    en: I just put on essence, so next is lotion, then moisturizer.
    ko: 방금 바른 건 에센스고, 아직 로션이랑 영양 크림도 남았어요.
    ja: |-
      さっき塗ったのは美容液で、
      まだ乳液とクリームが残っています。
  d_nikke_mint_04_89:
    speaker: "<Monologue>"
    en: After slathering me in product,
    ko: 얼굴에 화장품을 다 바르고 난 뒤,
    ja: 一通りのスキンケアを終えた後
  d_nikke_mint_04_90:
    speaker: "<Monologue>"
    en: Mint starts pinching my cheeks.
    ko: 민트는 내 얼굴을 쪼물딱 거리기 시작했다.
    ja: ミントは私の顔をマッサージし始めた
  d_nikke_mint_04_91:
    speaker: mint
    en: You should learn how to do all of this by yourself.
    ko: 이런 것도 혼자서 잘 챙기면 좋잖아요.
    ja: |-
      こういうことも自分で
      できるようにならなきゃですよ。
  d_nikke_mint_04_92:
    speaker: mint
    en: You can't keep neglecting your skin just because you've got good genes.
    ko: 본판이 좋다고, 너무 방심하고 있는 것 아니에요?
    ja: |-
      元がいいからって、
      サボりすぎなんじゃないですか？
  d_nikke_mint_04_93:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_04_94:
    speaker: mint
    en: Once your skin starts to go bad, it goes downhill real fast.
    ko: 피부 무너지는 건 진짜 한순간이에요.
    ja: |-
      お肌って、ホントに一瞬で
      ボロボロになるんですよ。
  d_nikke_mint_04_95:
    speaker: mint
    en: If you wait until that point, it's already too late.
    ko: 다 무너지고 난 다음에 관리하는 건 늦는다는 거.
    ja: ボロボロになってからじゃ、遅いってこと…
  d_nikke_mint_04_96:
    speaker: mint
    en: Remember that.
    ko: 꼭 알아두세요.
    ja: 肝に銘じてくださいね。
  d_nikke_mint_04_97:
    speaker: "<Self>"
    en: Mint.
    ko: "…민트."
    ja: "…ミント"
  d_nikke_mint_04_98:
    speaker: mint
    en: Yeah?
    ko: 왜요?
    ja: 何ですか？
  d_nikke_mint_04_99:
    speaker: "<Self>"
    en: That was it.
    ko: 이거야.
    ja: これだ
  d_nikke_mint_04_100:
    speaker: mint
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_mint_04_101:
    speaker: "<Self>"
    en: You really acted like you'd been living with me for eight years.
    ko: 방금 진짜 동거 8년차 여자 친구 같았어.
    ja: |-
      同棲8年目の
      彼女みたいだった
  d_nikke_mint_04_102:
    speaker: mint
    en: Oh...!
    ko: 아…!
    ja: えっ…！
  d_nikke_mint_04_103:
    speaker: "<Self>"
    en: Try to hold on to that feeling.
    ko: 이 느낌을 계속 기억하면 되겠는데?
    ja: 今の感じを忘れないでおくんだ
  d_nikke_mint_04_104:
    speaker: mint
    en: Hehe.
    ko: 후후.
    ja: ふふっ。
  d_nikke_mint_04_105:
    speaker: mint
    en: Well, don't feel the need to compliment me too much.
    ko: 너무 칭찬해주실 필요는 없어요.
    ja: あんまり褒めなくても大丈夫ですよ。
  d_nikke_mint_04_106:
    speaker: mint
    en: For someone like me, this all comes pretty easily.
    ko: 저 정도 되면, 이런 건 간단히 할 수 있는 거니까요.
    ja: このくらい、私にとっては朝飯前ですから。
  d_nikke_mint_04_107:
    speaker: "<Self>"
    en: Okay. I won't compliment you then.
    ko: 알았어. 그럼 칭찬은 안 할게.
    ja: そうか。なら、褒めない
  d_nikke_mint_04_108:
    speaker: mint
    en: Wait, you're not being serious, are you?
    ko: "…설마 진짜로 칭찬 안 해주는 거예요?"
    ja: "…まさか真に受けたんですか？"
  d_nikke_mint_04_109:
    speaker: mint
    en: But I'm working so hard!
    ko: 이렇게 열심히 노력했는데?
    ja: こんなに頑張ってるのに？
  d_nikke_mint_04_110:
    speaker: "<Self>"
    en: I have no idea what you want me to do...
    ko: 대체 어느 장단에 맞추라는 거야….
    ja: いったい、どうしてほしいんだ…
  d_nikke_mint_04_111:
    speaker: mint
    en: Haha!
    ko: 하핫~
    ja: ふふっ。
  d_nikke_mint_04_112:
    speaker: "<Monologue>"
    en: On her fifth day of practice, Mint finally starts to sound like someone who's
      lived with her boyfriend for eight years.
    ko: 연습 5일차가 되어서야, 민트는 동거 8년차 여자친구가 될 수 있었다.
    ja: |-
      練習5日目にしてようやく、
      ミントは同棲8年目の彼女に
      なりきることができた
d_nikke_mint_05:
  d_nikke_mint_05_1:
    speaker: "<Narration>"
    en: Day six of practice.
    ko: 연습 6일차.
    ja: 練習6日目
  d_nikke_mint_05_2:
    speaker: "<Self>"
    en: I'm gonna do laundry. Can I just throw everything in together?
    ko: 빨래하려고 하는데, 한꺼번에 해도 괜찮지?
    ja: |-
      今から洗濯するけど、
      まとめてやっていいだろ？
  d_nikke_mint_05_3:
    speaker: mint
    en: Wait!
    ko: 아니, 잠깐만!
    ja: ちょっと待って！
  d_nikke_mint_05_4:
    speaker: mint
    en: You have to wash my underwear separately!
    ko: 속옷은 따로 해야 돼!
    ja: 下着は別にして！
  d_nikke_mint_05_5:
    speaker: mint
    en: Last time you just threw it in with everything else and ruined it!
    ko: 저번에도 같이 세탁기 돌려서 내 속옷 다 망가졌었잖아!
    ja: |-
      この前も全部一緒に洗濯機に入れて、
      私の下着を全部ダメにしちゃったでしょ？
  d_nikke_mint_05_6:
    speaker: "<Self>"
    en: But it's so much work to sort it and do a separate load.
    ko: 따로 빼서 하려면 귀찮은데.
    ja: |-
      下着だけ別に洗うのは
      面倒くさいんだよ
  d_nikke_mint_05_7:
    speaker: mint
    en: You think everything is so much work.
    ko: 자기는 맨날 귀찮다고 그러더라?
    ja: あなたって、いつもそうよね？
  d_nikke_mint_05_8:
    speaker: mint
    en: And you don't listen when I tell you to turn your socks right side out,
    ko: 양말 좀 뒤집어서 놓지 말라고 해도 안 듣고.
    ja: |-
      靴下をちゃんと表にしてから洗ってって
      言っても、裏返しのままだし…
  d_nikke_mint_05_9:
    speaker: mint
    en: or when I tell you to hang up your clothes after taking them off.
    ko: 옷 좀 벗으면 옷걸이에 걸어 놓으라고 해도 안 듣고.
    ja: |-
      脱いだ服をハンガーにかけてって言っても、
      かけないし。
  d_nikke_mint_05_10:
    speaker: mint
    en: Is it really that hard?
    ko: 그게 그렇게 어려워?
    ja: そんなに難しいこと？
  d_nikke_mint_05_11:
    speaker: "<Self>"
    en: "*Sigh* Here we go again..."
    ko: 또 잔소리….
    ja: また小言かよ…
  d_nikke_mint_05_12:
    speaker: mint
    en: Forget it.
    ko: 됐다, 됐어.
    ja: もういい。
  d_nikke_mint_05_13:
    speaker: mint
    en: I'm sick of the way things are.
    ko: 이제 너랑 이러고 있는 것도 지겨워.
    ja: もうあんたと一緒にいるのも、うんざり。
  d_nikke_mint_05_14:
    speaker: mint
    en: You and I have been sitting here like this for eight years.
    ko: 어휴, 8년이나 너랑 이러고 앉아 있었다니.
    ja: |-
      はぁ、8年もこんなふうに
      過ごしてきたなんて。
  d_nikke_mint_05_15:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_05_16:
    speaker: mint
    en: When you say, "Here we go again,"
    ko: 방금 하신 [또 잔소리….]라는 대사 말인데요.
    ja: |-
      さっきの「また小言かよ…」っていう
      セリフなんですけど、
  d_nikke_mint_05_17:
    speaker: mint
    en: I think it'd be better to do it without the sigh.
    ko: 한숨 쉬는 듯한 느낌을 좀 빼는 게 좋겠어요.
    ja: |-
      ため息は、もうちょっと
      抑えたほうがいいと思います。
  d_nikke_mint_05_18:
    speaker: mint
    en: Instead of being genuinely upset, I think he's kind of just going along with
      it.
    ko: 진짜 듣기 싫다는 느낌보다는, 또 저러네~ 같은 느낌인 게 어울릴 것 같거든요.
    ja: |-
      もう聞きたくないって感じになるより、
      またかよ～というニュアンスが出たほうが
      合うと思うんです。
  d_nikke_mint_05_19:
    speaker: "<Self>"
    en: Okay.
    ko: 알았어.
    ja: 分かった
  d_nikke_mint_05_20:
    speaker: mint
    en: Let's practice scene three next.
    ko: 다음은 3번 씬 대사로 해볼게요.
    ja: 次は、3番目のシーンにいきますね。
  d_nikke_mint_05_21:
    speaker: mint
    en: How was work today?
    ko: 오늘 회사에서 어땠어?
    ja: 今日の仕事、どうだった？
  d_nikke_mint_05_22:
    speaker: "<Self>"
    en: Same as usual, I guess.
    ko: 그냥 평소랑 똑같지, 뭐.
    ja: まあ、いつもと同じかな
  d_nikke_mint_05_23:
    speaker: "<Self>"
    en: How about you, babe? How was your day?
    ko: 자기는 어땠어?
    ja: お前は、どうだった？
  d_nikke_mint_05_24:
    speaker: mint
    en: My boss was breathing down my neck, and my team wouldn't give me a break.
    ko: 위에선 쪼고, 아래에선 치대고.
    ja: |-
      上司には詰められるし、
      部下には頼られっぱなし。
  d_nikke_mint_05_25:
    speaker: mint
    en: So same as usual for me too.
    ko: 나도 뭐 항상 똑같지.
    ja: 私もいつもと同じよ。
  d_nikke_mint_05_26:
    speaker: mint
    en: "*Burp*"
    ko: 끅.
    ja: ゲフッ。
  d_nikke_mint_05_27:
    speaker: mint
    en: Oh, sorry. I didn't think that would be that loud.
    ko: 아, 나도 모르게 트림이 나왔네. 미안~
    ja: あ、ゲップ出ちゃった。ごめ～ん。
  d_nikke_mint_05_28:
    speaker: "<Self>"
    en: You're really absorbed in your role now.
    ko: "…이제 역할에 확실히 이입했구나."
    ja: "…すっかり役に入り込んでいるな"
  d_nikke_mint_05_29:
    speaker: mint
    en: That's what happens when a person with talent works hard.
    ko: 원래부터 재능 있는 사람이 노력까지 했으니, 당연한 결과예요.
    ja: |-
      元から才能に恵まれてた人が
      努力したんですから、当然の結果です。
  d_nikke_mint_05_30:
    speaker: mint
    en: It was only a matter of time.
    ko: 시간 문제였을 뿐이죠.
    ja: 遅かれ早かれ、こうなってましたよ。
  d_nikke_mint_05_31:
    speaker: "<Self>"
    en: Then I guess we're ready to wrap up here.
    ko: 그럼 이제 슬슬 마무리 지어야겠네.
    ja: では、そろそろ終わりにしないとな
  d_nikke_mint_05_32:
    speaker: "<Self>"
    en: I think we can stop living together now.
    ko: 동거는 끝내도 되겠어.
    ja: 同棲は解消してもよさそうだ
  d_nikke_mint_05_33:
    speaker: mint
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_mint_05_34:
    speaker: mint
    en: You mean... we're done practicing?
    ko: 혹시 연습은 이제 끝… 인가요?
    ja: もしかして、練習はこれでおしまい…ですか？
  d_nikke_mint_05_35:
    speaker: "<Self>"
    en: I think I've done all I can to help you.
    ko: 내가 도울 수 있는 건 여기까지인 것 같아.
    ja: |-
      私が手伝えるのは
      ここまでだ
  d_nikke_mint_05_36:
    speaker: "<Self>"
    en: Now you need an actual expert's advice.
    ko: 이젠 진짜 전문가의 도움이 필요해.
    ja: あとは、本物のプロの指導が必要だろう
  d_nikke_mint_05_37:
    speaker: mint
    en: I'm just too good now, huh? I improved too quickly.
    ko: 제 연기력이 워낙 빨리 높아졌으니까요.
    ja: |-
      私の演技力が
      あっという間に伸びちゃいましたからね。
  d_nikke_mint_05_38:
    speaker: mint
    en: That's what happens when you're just this talented.
    ko: 제가 잘나서 그런 건데, 어쩌겠어요.
    ja: 私が優秀すぎるんです。仕方ありません。
  d_nikke_mint_05_39:
    speaker: "<Self>"
    en: You were all monotone when you first got here,
    ko: 국어책 읽던 민트가,
    ja: あの棒読みだったミントが
  d_nikke_mint_05_40:
    speaker: "<Self>"
    en: but now you're good enough to teach others how it's done.
    ko: 이젠 남의 연기를 지도해줄 수 있는 정도가 됐네.
    ja: |-
      今は他人の演技指導が
      できるほどに成長したな
  d_nikke_mint_05_41:
    speaker: mint
    en: It's all thanks to you, Kitten.
    ko: "…이게 다 아기 고양이씨 덕분이에요."
    ja: "…これもすべて、子ネコさんのおかげです。"
  d_nikke_mint_05_42:
    speaker: mint
    en: I really appreciate everything you did.
    ko: 고맙습니다.
    ja: ありがとうございます。
  d_nikke_mint_05_43:
    speaker: "<Self>"
    en: I hardly did anything.
    ko: 내가 한 건 별로 없어.
    ja: たいしたことはしていない
  d_nikke_mint_05_44:
    speaker: "<Self>"
    en: This is because of all the hard work you put in.
    ko: 민트가 노력한 결과야.
    ja: ミントが努力した結果だ
  d_nikke_mint_05_45:
    speaker: mint
    en: But if you hadn't been here helping me, I don't think I would've come this
      far.
    ko: 아기 고양이씨가 도와주지 않았으면, 이렇게까진 못 했을 거예요.
    ja: |-
      子ネコさんが手伝ってくれなかったら、
      ここまでできませんでした。
  d_nikke_mint_05_46:
    speaker: "<Self>"
    en: I'm surprised to hear you say that.
    ko: 근데 의외의 대답이네.
    ja: 意外な返事だな
  d_nikke_mint_05_47:
    speaker: mint
    en: Oh? What were you expecting?
    ko: 의외요?
    ja: そうですか？
  d_nikke_mint_05_48:
    speaker: "<Self>"
    en: '"You must''ve had such a great time helping me."'
    ko: 민트라면, 절 도와줄 수 있어서 좋으셨겠어요?
    ja: |-
      ミントなら「私を手伝えて、
      さぞかし嬉しかったでしょうね」
  d_nikke_mint_05_49:
    speaker: "<Self>"
    en: Something like that.
    ko: 라고 할 줄 알았어.
    ja: とでも言うかと思った
  d_nikke_mint_05_50:
    speaker: mint
    en: While I do imagine that's true,
    ko: 그 말도 맞긴 한데요~
    ja: それも確かにそうなんですけど～
  d_nikke_mint_05_51:
    speaker: mint
    en: and while I'm glad that you seemed to have a good time,
    ko: 아기 고양이씨가 좋은 건 좋은 거고,
    ja: それはそれとして…
  d_nikke_mint_05_52:
    speaker: mint
    en: it's still important to express gratitude where it's due.
    ko: 제가 받은 도움에 감사 인사를 하는 건, 또 다른 이야기니까요.
    ja: |-
      手伝ってもらったことに
      感謝を伝えておきたかったんです。
  d_nikke_mint_05_53:
    speaker: mint
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_mint_05_54:
    speaker: mint
    en: You're still gonna help me for the rest of the day, right?
    ko: 그래도 오늘까진 계속 도와주는 거죠?
    ja: |-
      でも、今日まではまだ
      手伝ってくれるんですよね？
  d_nikke_mint_05_55:
    speaker: mint
    en: We have to finish our lines.
    ko: 일단 마무리는 지어야 하잖아요.
    ja: 最後まで終わらせないとですからね。
  d_nikke_mint_05_56:
    speaker: "<Self>"
    en: Sure.
    ko: 그래.
    ja: 分かった
  d_nikke_mint_05_57:
    speaker: "<Self>"
    en: I'll do whatever I can to help.
    ko: 할 수 있는 데까진 도울게.
    ja: できる限りのことは、やろう
  d_nikke_mint_05_58:
    speaker: mint
    en: I'm going to hold you to that!
    ko: 분명 약속한 거예요?
    ja: 確かに約束しましたからね？
  d_nikke_mint_05_59:
    speaker: mint
    en: Let's run through the whole thing again.
    ko: 그럼 마지막으로 전체 내용을 연습해보죠.
    ja: |-
      じゃあ、最初から最後まで通しで練習して
      終わりにしましょう。
  d_nikke_mint_05_60:
    speaker: "<Self>"
    en: The whole thing?
    ko: 전체를?
    ja: 通しで？
  d_nikke_mint_05_61:
    speaker: mint
    en: Yeah. Do you not want to?
    ko: 네. 싫으세요?
    ja: ええ。イヤですか？
  d_nikke_mint_05_62:
    speaker: "<Monologue>"
    en: Mint smiles as if provoking me.
    ko: 민트는 도발하듯 웃음을 지었다.
    ja: ミントは挑発的な笑みを浮かべた
  d_nikke_mint_05_63:
    speaker: "<Self>"
    en: Okay. Let's do it.
    ko: 좋아. 해보자.
    ja: よし、やってみよう
  d_nikke_mint_05_64:
    speaker: mint
    en: That's the spirit.
    ko: 기세가 좋으시네요.
    ja: そうこなくっちゃ。
  d_nikke_mint_05_65:
    speaker: mint
    en: I hope you're ready...
    ko: 그러면….
    ja: それじゃ…
  d_nikke_mint_05_66:
    speaker: mint
    en: because I'm not going to let you get any sleep tonight.
    ko: 오늘 밤은 안 재울 거예요.
    ja: 今夜は寝かせませんよ。
  d_nikke_mint_05_67:
    speaker: "<Self>"
    en: I get the feeling you'll fall asleep before I do.
    ko: 나보단 민트가 먼저 잘 것 같은데.
    ja: |-
      私よりミントが先に
      寝落ちするだろうな
  d_nikke_mint_05_68:
    speaker: "<Monologue>"
    en: And so we begin our final acting practice.
    ko: 그렇게 우리는 마지막 연기 연습을 시작했다.
    ja: |-
      こうして私たちは
      最後の練習を始めた
  d_nikke_mint_05_69:
    speaker: "<Monologue>"
    en: It's been a week since Mint moved all her things out of my room.
    ko: 민트가 지휘관실에서 짐을 뺀 지도 벌써 일주일이 넘게 지났다.
    ja: |-
      ミントが指揮官室から
      荷物を運び出してから、
      すでに1週間以上が過ぎた
  d_nikke_mint_05_70:
    speaker: "<Monologue>"
    en: I'm working there as usual,
    ko: 나는 평소처럼 지휘관실에서 업무를 보고 있다가,
    ja: |-
      私は、いつものように
      指揮官室で仕事をしていて
  d_nikke_mint_05_71:
    speaker: "<Monologue>"
    en: when I open a drawer to pull out a document.
    ko: 서류를 꺼내기 위해 서랍을 열었다.
    ja: |-
      書類を取り出すために
      引き出しを開けた
  d_nikke_mint_05_72:
    speaker: "<Self>"
    en: Why is this in here...?
    ko: 이게 왜 여기 있지…?
    ja: どうして、これがここに…？
  d_nikke_mint_05_73:
    speaker: "<Monologue>"
    en: Inside the drawer is a bottle of lotion, the same one Mint uses.
    ko: 서랍 안에는 민트가 사용하던 로션과 같은 로션이 들어있었다.
    ja: |-
      引き出しの中には
      ミントが使っていた乳液と
      同じものが入っていた
  d_nikke_mint_05_74:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_mint_05_75:
    speaker: "<Monologue>"
    en: A note is stuck to the bottle.
    ko: 로션에는 쪽지가 하나 붙어 있었고,
    ja: 乳液にはメモが1枚貼り付けられていた
  d_nikke_mint_05_76:
    speaker: "<Monologue>"
    en: I take it out and read it.
    ko: 나는 로션을 꺼내 쪽지를 읽어보았다.
    ja: 私は乳液を取り出し、メモを読んだ
  d_nikke_mint_05_77:
    speaker: "<Narration>"
    en: '"This is a present to thank you for the special practice. Don''t just save
      it because I gave it to you, though. Be sure to use it! ♡"'
    ko: "[이건 특별히 연습 도와준 선물이에요. 괜히 제가 준 선물이라고 아끼지 말고 팍팍 쓰세요♡]"
    ja: |-
      「これは練習を手伝ってくれたお礼です。
      私からのプレゼントだからって
      惜しまずに、どんどん使ってくださいね♡」
  d_nikke_mint_05_78:
    speaker: "<Narration>"
    en: '"You should start taking care of your skin while you''re still young! Got
      it?"'
    ko: "[그리고 피부 관리는 한 살이라도 젊었을 때부터! 알겠죠?]"
    ja: |-
      「スキンケアは1歳でも若いうちから！
      分かりましたか？」
  d_nikke_mint_05_79:
    speaker: "<Self>"
    en: When did this get here?
    ko: 이건 또 언제 넣어뒀대.
    ja: いつの間に入れたのだろう
  d_nikke_mint_05_80:
    speaker: "<Monologue>"
    en: I place the lotion and note on my desk.
    ko: 나는 로션과 쪽지를 지휘관실 책상에 올려놓았다.
    ja: |-
      私は乳液とメモを
      指揮官室の机に置いた
  d_nikke_mint_05_81:
    speaker: "<Monologue>"
    en: The heart on the note really stands out.
    ko: 쪽지에 적힌 하트가 유독 눈에 들어온다.
    ja: |-
      メモに描かれたハートが
      目を引く
  d_nikke_mint_05_82:
    speaker: "<Self>"
    en: Now I have no excuse not to use lotion...
    ko: 이러면 귀찮다고 안 바를 수도 없겠네….
    ja: |-
      そう言われたら、面倒でも
      塗らないわけにいかないな…
  d_nikke_mint_05_83:
    speaker: "<Monologue>"
    en: As I imagine Mint sneaking the bottle into my drawer,
    ko: 나는 서랍 속에 몰래 로션을 넣었을 민트를 상상하며,
    ja: |-
      私は、引き出しにこっそり
      乳液を入れるミントを想像しながら
  d_nikke_mint_05_84:
    speaker: "<Monologue>"
    en: I wonder how her audition went.
    ko: 민트의 오디션 결과를 기다리기로 했다.
    ja: |-
      ミントのオーディション結果を
      待つことにした
  d_nikke_mint_05_85:
    speaker: "<Narration>"
    en: "*Buzz*"
    ko: 지잉-
    ja: ブルルル―
  d_nikke_mint_05_86:
    speaker: "<Monologue>"
    en: When I think about Mint's acting the last time I saw her, I know it'll be
      good news.
    ko: 마지막에 본 민트의 연기를 생각하면, 분명 좋은 소식이 있겠지.
    ja: |-
      最後に見たあのミントの演技なら、
      きっといい知らせが届くはずだ
  d_nikke_mint_05_87:
    speaker: "<Self>"
    en: I start thinking about what to get her as a present to congratulate her...
    ko: 축하 선물로는 뭐가 좋으려나….
    ja: |-
      お祝いのプレゼントは
      何がいいだろうな…
