---
d_nikke_guilty_mightybunny_01:
  d_nikke_guilty_mightybunny_01_1:
    speaker: mana_b
    en: Finally, this dreadful event is over... I need to hurry if I want to leave
      early.
    ko: "드디어 이 지긋지긋한 행사도 끝이군요. \n빠른 퇴근을 위해 서둘러야겠습니다."
    ja: |-
      やっと、このうんざりするような
      イベントも終わりですね。
      早く帰りましょう。
  d_nikke_guilty_mightybunny_01_2:
    speaker: mana_b
    en: And this outfit... I can't stand it. I want to take it off as soon as possible.
    ko: 특히 이 의상. 최악입니다. 한 시라도 빨리 벗고 싶어요.
    ja: |-
      特にこの衣装。最悪です。
      一刻も早く脱がなくては…
  d_nikke_guilty_mightybunny_01_3:
    speaker: guilty_b
    en: Ugh, me too... I ran so hard, I'm all sweaty...
    ko: 으응, 나도오… 열심히 달렸더니, 여기저기 땀 찼어어….
    ja: |-
      うん、私もぉ…がんばって走ったから、
      汗で蒸れちゃったぁ…
  d_nikke_guilty_mightybunny_01_4:
    speaker: "<Narration>"
    en: "*Rustle, rustle*"
    ko: 부스럭, 부스럭
    ja: ガサゴソ――
  d_nikke_guilty_mightybunny_01_5:
    speaker: guilty_b
    en: There we go... Haaah.
    ko: 읏, 차아…. …후우우.
    ja: よいしょっと…ふぅぅ。
  d_nikke_guilty_mightybunny_01_6:
    speaker: guilty_b
    en: Still... I had to wear the same restraint outfit every day when I was in solitary
      confinement...
    ko: 그래도… 나는 독방에 있는 동안 똑같은 구속복만 입었으니까….
    ja: |-
      でも…私は独房にいる間、
      ずっと同じ服だったから…
  d_nikke_guilty_mightybunny_01_7:
    speaker: guilty_b
    en: This outfit was embarrassing... and uncomfortable... but I guess it was kind
      of fun, too...
    ko: 이 옷은… 부끄럽고 불편하지만… 재미있었던 것 같기도….
    ja: |-
      この服は…恥ずかしいし、動きづらいけど…
      楽しかったような気もするわぁ…
  d_nikke_guilty_mightybunny_01_8:
    speaker: guilty_b
    en: Hmm...
    ko: "…으음."
    ja: "…うーん。"
  d_nikke_guilty_mightybunny_01_9:
    speaker: "<Monologue>"
    en: Guilty suddenly stops while changing.
    ko: 옷을 갈아입던 길티가 문득 멈춰 섰다.
    ja: |-
      服を着替えていたギルティが、
      ふと手を止めた
  d_nikke_guilty_mightybunny_01_10:
    speaker: "<Self>"
    en: "*Sigh* I really love bunny girls."
    ko: 하… 바니걸. 너무 좋아.
    ja: はぁ…バニーガール。大好きだ…
  d_nikke_guilty_mightybunny_01_11:
    speaker: "<Self>"
    en: Bunny girls are simply the best...
    ko: 바니걸은 정말이지 최고….
    ja: バニーガールは本当にさいこ…
  d_nikke_guilty_mightybunny_01_12:
    speaker: guilty_b
    en: Counselor... What is it about bunny girls that made you so happy...?
    ko: 교과안… 왜 그렇게까지 바니걸에 기뻐한 걸까아….
    ja: |-
      教官は…どうしてあんなに
      バニーガールに喜んでたのかしら…
  d_nikke_guilty_mightybunny_01_13:
    speaker: guilty_b
    en: Do you really like this outfit that much...?
    ko: 이 옷이… 바니걸이 그렇게 좋아?
    ja: この服が…バニーガールがそんなに好きなの？
  d_nikke_guilty_mightybunny_01_14:
    speaker: guilty_b
    en: There were so many Nikkes dressed as bunny girls at Coin Rush...
    ko: 코인 러시엔 바니걸 차림을 한 니케가 잔뜩 있고….
    ja: |-
      コインラッシュには、
      バニーガール姿のニケがたくさんいて…
  d_nikke_guilty_mightybunny_01_15:
    speaker: guilty_b
    en: And you looked so happy to be surrounded by all of them...
    ko: 그 사이에 한가득 둘러싸여서, 교관 행복해 보였지이….
    ja: |-
      その人たちに囲まれて、
      教官、幸せそうだったなぁ…
  d_nikke_guilty_mightybunny_01_16:
    speaker: guilty_b
    en: I...
    ko: "…난 역시…."
    ja: "…私、やっぱり…"
  d_nikke_guilty_mightybunny_01_17:
    speaker: guilty_b
    en: I really do want to have you all to myself...
    ko: 역시, 교관을 좀 더 독점하고 싶어….
    ja: やっぱり、教官をもっと独り占めしたい…
  d_nikke_guilty_mightybunny_01_18:
    speaker: guilty_b
    en: If I wear this... then maybe...?
    ko: 이 옷과 함께라면… 혹시…?
    ja: この服なら…もしかして…？
  d_nikke_guilty_mightybunny_01_19:
    speaker: "<Monologue>"
    en: Today, I'm here for my regular visit with Guilty as her assigned counselor.
    ko: 오늘은 담당 교관으로서 정기적으로 길티 곁에 방문하는 날이다.
    ja: |-
      今日は担当教官として、
      定期的にギルティのもとを訪ねる日だ
  d_nikke_guilty_mightybunny_01_20:
    speaker: "<Monologue>"
    en: When I open the door, I'm sure she'll be...
    ko: 이 문을 열면 분명 길티가….
    ja: このドアを開ければ、そこにはギルティが…
  d_nikke_guilty_mightybunny_01_21:
    speaker: guilty_b
    en: Counselor...
    ko: 교과안….
    ja: 教官…
  d_nikke_guilty_mightybunny_01_22:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_guilty_mightybunny_01_23:
    speaker: "<Monologue>"
    en: I feel something warm and soft against my back. It's...
    ko: 등 뒤에서부터 따끈하고 말랑한 감각이 느껴진다. 이건….
    ja: |-
      背中から温かくて柔らかい
      感触が伝わってくる。これは…
  d_nikke_guilty_mightybunny_01_24:
    speaker: guilty_b
    en: Counselor, can you guess who I am...?
    ko: 교과안, 나 누군지 알겠어…?
    ja: 教官、誰だか分かる…？
  d_nikke_guilty_mightybunny_01_25:
    speaker: "<Self>"
    en: Of course, you're Guilty...
    ko: 당연히, 길티….
    ja: もちろん、ギルティだろう？
  d_nikke_guilty_mightybunny_01_26:
    speaker: guilty_b
    en: Nooo...
    ko: 아니야아….
    ja: 違うわぁ…
  d_nikke_guilty_mightybunny_01_27:
    speaker: "<Monologue>"
    en: I can feel Guilty shaking her head against my back.
    ko: 등 뒤로 머리를 도리도리 흔들며 부비는 느낌이 들었다.
    ja: |-
      頭を左右に振りながら、
      背中にこすりつける感触がした
  d_nikke_guilty_mightybunny_01_28:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_guilty_mightybunny_01_29:
    speaker: guilty_b
    en: Today, I'm not just Guilty...
    ko: 오늘은 그냥 길티 아니고오….
    ja: 今日は、ただのギルティじゃなくてぇ…
  d_nikke_guilty_mightybunny_01_30:
    speaker: "<Monologue>"
    en: Guilty's needy voice slips into my ears...
    ko: 잔뜩 응석부리는 길티의 목소리가 귓가에 속삭이듯 울린다….
    ja: |-
      甘えきったギルティの声が、
      耳元でささやくように響く…
  d_nikke_guilty_mightybunny_01_31:
    speaker: guilty_b
    en: I'm Bunny Girl Guilty...
    ko: 바니걸 길티야아….
    ja: バニーガール・ギルティよぉ…
  d_nikke_guilty_mightybunny_01_32:
    speaker: "<Self>"
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_guilty_mightybunny_01_33:
    speaker: "<Monologue>"
    en: I calm my racing heart and begin our counseling session as usual.
    ko: 놀란 가슴을 진정시키며, 평소 절차대로 상담을 시작하려 했다.
    ja: |-
      驚きで高鳴った胸を落ち着かせながら、
      いつも通りに面談を始めようとした
  d_nikke_guilty_mightybunny_01_34:
    speaker: "<Self>"
    en: Let's get started. I'll take off your restraints.
    ko: 상담을 시작하자. 구속구 풀어줄게, 길티.
    ja: |-
      面談を始めよう。
      拘束具を外すぞ、ギルティ
  d_nikke_guilty_mightybunny_01_35:
    speaker: guilty_b
    en: Yes, thank you...
    ko: 응, 고마워어….
    ja: うん、ありがとぉ…
  d_nikke_guilty_mightybunny_01_36:
    speaker: guilty_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_01_37:
    speaker: guilty_b
    en: Counselor... you're not really reacting...
    ko: 교관… 별로 반응이 없네에….
    ja: 教官…あんまり反応してくれないのねぇ…
  d_nikke_guilty_mightybunny_01_38:
    speaker: guilty_b
    en: You don't... like this?
    ko: 이런 거… 싫어?
    ja: こういうの…嫌い…？
  d_nikke_guilty_mightybunny_01_39:
    speaker: "<Monologue>"
    en: As if I could say no. Absolutely not.
    ko: 싫을 리 없다. 절대로.
    ja: 嫌いなわけがない
  d_nikke_guilty_mightybunny_01_40:
    speaker: "<Monologue>"
    en: There's no way I can resist a temptation like this.
    ko: 이런 유혹을 견뎌낼 수 있을 리 없다.
    ja: こんな誘惑、耐えられるはずもない
  d_nikke_guilty_mightybunny_01_41:
    speaker: guilty_b
    en: Counselor...
    ko: 교과안….
    ja: 教官…
  d_nikke_guilty_mightybunny_01_42:
    speaker: "<Monologue>"
    en: So soft, so sweet...
    ko: 이렇게 부드럽고, 달콤하고….
    ja: こんなに柔らかくて、甘くて…
  d_nikke_guilty_mightybunny_01_43:
    speaker: "<Monologue>"
    en: So smooth, so supple...
    ko: 매끈하고, 탄력 있는….
    ja: なめらかで、弾力のある…
  d_nikke_guilty_mightybunny_01_44:
    speaker: "<Monologue>"
    en: How could I possibly resist?
    ko: 바니걸의 유혹을.
    ja: バニーガールの誘惑に
  d_nikke_guilty_mightybunny_01_45:
    speaker: "<Narration>"
    en: She pulls me into a tight embrace.
    ko: 포옥!
    ja: ぎゅっ！
  d_nikke_guilty_mightybunny_01_46:
    speaker: "<Monologue>"
    en: With her hands finally free, Guilty holds me close.
    ko: 구속구를 풀어 손이 자유로워진 길티가 내 품에 안겨왔다.
    ja: |-
      拘束具を外され、手が自由になった
      ギルティが、私の胸に飛び込んできた
  d_nikke_guilty_mightybunny_01_47:
    speaker: "<Self>"
    en: G-Guilty?
    ko: 기, 길티?
    ja: ギ、ギルティ？
  d_nikke_guilty_mightybunny_01_48:
    speaker: guilty_b
    en: "*Huff, huff...*"
    ko: 색, 새액….
    ja: はぁ、はぁ…
  d_nikke_guilty_mightybunny_01_49:
    speaker: "<Monologue>"
    en: Guilty breathes heavily, her breathing punctuated by soft sighs.
    ko: 길티의 한숨 섞인 달뜬 호흡.
    ja: ギルティの吐息交じりの、熱を帯びた息づかい
  d_nikke_guilty_mightybunny_01_50:
    speaker: "<Monologue>"
    en: The intervals between her breaths gradually grow shorter.
    ko: 그 호흡은 점점 더 그 주기가 짧아진다.
    ja: その息づかいの間隔が次第に短くなっていく
  d_nikke_guilty_mightybunny_01_51:
    speaker: guilty_b
    en: "*Huff...* You know, Counselor..."
    ko: 후, 후우… 있지, 교과안….
    ja: ふ、ふぅ…ねぇ、教官…
  d_nikke_guilty_mightybunny_01_52:
    speaker: guilty_b
    en: I've been thinking about it... and...
    ko: 나, 이번에 천천히 생각해 봤는데… 역시….
    ja: 私、じっくり考えてみたんだけど…やっぱり…
  d_nikke_guilty_mightybunny_01_53:
    speaker: "<Self>"
    en: Er, yeah?
    ko: 으, 응?
    ja: な、何だ？
  d_nikke_guilty_mightybunny_01_54:
    speaker: guilty_b
    en: You know, I...
    ko: 있잖아아, 나는….
    ja: あのねぇ、私…
  d_nikke_guilty_mightybunny_01_55:
    speaker: "<Monologue>"
    en: A chill runs through me, even the fine hairs by my ears standing on end...
    ko: 귓가의 솜털마저 오싹해지는 감각에…
    ja: |-
      耳元の産毛まで、ぞくりとするような感覚に
      気を取られ…
  d_nikke_guilty_mightybunny_01_56:
    speaker: "<Monologue>"
    en: By the time I realize what's happening, it's far too late.
    ko: 너무 늦게 눈치채버렸다.
    ja: 気づくのが遅すぎた
  d_nikke_guilty_mightybunny_01_57:
    speaker: guilty_b
    en: I just want... to have you all to myself...
    ko: 교관을 좀 더… 독점하고 싶….
    ja: 教官をもっと…独り占めしたい…
  d_nikke_guilty_mightybunny_01_58:
    speaker: "<Monologue>"
    en: Guilty's arms around my waist are tightening, slowly at first...
    ko: 허리를 감싼 길티의 팔이 점점 강하게 조여 오고 있다는 것을.
    ja: |-
      腰に回されたギルティの腕が、
      だんだん強くなっているということに
  d_nikke_guilty_mightybunny_01_59:
    speaker: "<Self>"
    en: "... Huh?"
    ko: "…어?"
    ja: "…えっ？"
  d_nikke_guilty_mightybunny_01_60:
    speaker: "<Narration>"
    en: Then harder and harder...
    ko: 꼬옥….
    ja: ぎゅっ…
  d_nikke_guilty_mightybunny_01_61:
    speaker: guilty_b
    en: Haaah...
    ko: 후우….
    ja: ふぅ…
  d_nikke_guilty_mightybunny_01_62:
    speaker: "<Self>"
    en: W-wait, Guilty!
    ko: 자, 잠깐 기다려. 길티!
    ja: ま、待ってくれ、ギルティ！
  d_nikke_guilty_mightybunny_01_63:
    speaker: "<Narration>"
    en: Her embrace grows tighter...
    ko: 꼬오옥…!
    ja: ぎゅううっ…！
  d_nikke_guilty_mightybunny_01_64:
    speaker: guilty_b
    en: Uggh... I can't wait any longer... I've been waiting for this day for so loooong...
    ko: 으으응… 안 돼… 못 기다려어… 나… 이날을 많이 기다렸단 말이야아….
    ja: |-
      ううん…ダメ…待てない…
      私…この日をずっと待ってたんだからぁ…
  d_nikke_guilty_mightybunny_01_65:
    speaker: "<Narration>"
    en: And tighter...
    ko: 꽉….
    ja: ミシッ…
  d_nikke_guilty_mightybunny_01_66:
    speaker: "<Self>"
    en: That's not what I meant...!
    ko: 그게 아니라…!
    ja: そうじゃなくて…！
  d_nikke_guilty_mightybunny_01_67:
    speaker: "<Narration>"
    en: Then tighter still!
    ko: "…꽈아아악!"
    ja: "…ミシミシッ！"
  d_nikke_guilty_mightybunny_01_68:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 우둑!
    ja: ボキッ！
  d_nikke_guilty_mightybunny_01_69:
    speaker: "<Self>"
    en: Argh!
    ko: 아악!
    ja: ぐあっ！
  d_nikke_guilty_mightybunny_01_70:
    speaker: guilty_b
    en: "...!!!"
    ko: "…!!!"
    ja: "…！！！"
  d_nikke_guilty_mightybunny_01_71:
    speaker: "<Narration>"
    en: Before I can do anything, I hear a sharp crack in my lower back...
    ko: 우두둑!
    ja: バキ、ボキッ！
  d_nikke_guilty_mightybunny_01_72:
    speaker: "<Monologue>"
    en: As the bones begin to fracture under the force of her embrace.
    ko: 그렇게, 허리뼈에 금이 가고 말았다.
    ja: そうして、腰の骨にヒビが入った
  d_nikke_guilty_mightybunny_01_73:
    speaker: guilty_b
    en: Oh... Oh no...!
    ko: "…어엇… 어어어엇…!!!"
    ja: "…ええっ…ああああっ…！！！"
  d_nikke_guilty_mightybunny_01_74:
    speaker: guilty_b
    en: I... I didn't... I didn't mean to...!
    ko: 이러려던 게… 이러려던 게 아니었는데…!
    ja: |-
      こんなつもりじゃ…
      こんなつもりじゃなかったのに…！
  d_nikke_guilty_mightybunny_01_75:
    speaker: guilty_b
    en: C-Counselor... I-I'm s-sorry...!
    ko: 아, 안 돼애… 교관, 교과안…!
    ja: ダ、ダメェ…教官、教官…！
d_nikke_guilty_mightybunny_02:
  d_nikke_guilty_mightybunny_02_1:
    speaker: anis_i
    en: Commander! Oh crap, what do we do?! Commander!
    ko: 지휘관님! 아, 진짜 어떡해… 지휘관님!
    ja: 指揮官様！あぁ、どうしよう…指揮官様！
  d_nikke_guilty_mightybunny_02_2:
    speaker: neon_v
    en: To think a Nikke’s passionate back hug fractured your spine...
    ko: 이럴 수가. 니케의 열렬한 백허그에 허리뼈에 금이 가다니….
    ja: |-
      なんと。ニケの熱いハグで
      腰の骨にヒビが入るとは…
  d_nikke_guilty_mightybunny_02_3:
    speaker: neon_v
    en: Looks like you've set a whole new record, Master!
    ko: 스승님이 이번에 또 새로운 부상 기록을 세우셨어요!
    ja: また新たな記録を打ち立てましたね！
  d_nikke_guilty_mightybunny_02_4:
    speaker: rapi_red
    en: That's not something to brag about, Neon.
    ko: "…하아. 그건 자랑스러워할 일이 아니야, 네온."
    ja: "…はぁ。誇るようなことじゃないわ、ネオン。"
  d_nikke_guilty_mightybunny_02_5:
    speaker: rapi_red
    en: Commander, are you okay?
    ko: 지휘관, 괜찮으십니까?
    ja: 指揮官、大丈夫ですか？
  d_nikke_guilty_mightybunny_02_6:
    speaker: "<Self>"
    en: Yeah, I'm completely fine now.
    ko: 괜찮아. 바로 나았어.
    ja: 平気だ。もうなんともない
  d_nikke_guilty_mightybunny_02_7:
    speaker: anis_i
    en: What do you mean, you're fine?! Didn't you hear the Seraphim Squad? They said
      you need absolute rest!
    ko: "뭐가 괜찮아! 세라핌 스쿼드에서 말하는 거 못 들었어? \n지휘관님 절대 안정이야!"
    ja: |-
      何が平気よ！セラフィムから
      言われたこと、聞いてなかったの？
      絶対安静って！
  d_nikke_guilty_mightybunny_02_8:
    speaker: anis_i
    en: And... no matter how freakishly fast you recover, Commander, we can't just
      leave things like this.
    ko: "그리고… 지휘관님의 회복 속도가 아무리 보통이 아니라곤 해도… \n이런 상황을 계속 그냥 방치할 순 없다고."
    ja: |-
      それに…いくら指揮官様の回復力が
      普通じゃないからって…こんなの、
      このまま放っておくわけにはいかないわ。
  d_nikke_guilty_mightybunny_02_9:
    speaker: rapi_red
    en: I agree.
    ko: 나도 동의해.
    ja: 私も同感よ。
  d_nikke_guilty_mightybunny_02_10:
    speaker: rapi_red
    en: Commander, we urgently need to take measures to prevent this from happening
      again.
    ko: 지휘관, 재발 방지를 위한 후속 조치가 절실한 상황입니다.
    ja: |-
      指揮官、再発防止に向けた後続措置が
      早急に必要な状況です。
  d_nikke_guilty_mightybunny_02_11:
    speaker: mana
    en: As such, we've received numerous requests from Nikkes for appropriate punishment
      in this matter.
    ko: "…그런고로, 이번 건에 관련해 마땅한 벌칙이 필요하다는 \n니케들의 요청이 다수 확인되었습니다."
    ja: |-
      …ということで、今回の件に関して
      相応の処罰が必要だという
      ニケからの意見が、多数寄せられています。
  d_nikke_guilty_mightybunny_02_12:
    speaker: anis_i
    en: That's right!
    ko: 옳소!
    ja: 賛成！
  d_nikke_guilty_mightybunny_02_13:
    speaker: mana
    en: One proposed punishment is, "No approaching the Commander within 500 meters
      for the next 500 years."
    ko: "제안이 들어온 벌칙의 예시로는… \n[앞으로 500년간 지휘관 반경 500m 내 접근 금지]"
    ja: |-
      提案例としては…
      「今後500年間、指揮官の
      半径500メートル以内への接近禁止」
  d_nikke_guilty_mightybunny_02_14:
    speaker: mana
    en: There's also "No one-on-one visits with the Commander," and "No snacks for
      50 years."
    ko: "[지휘관과 단둘이 접견 금지], 그리고 [50년간 간식 금지] 등이 있군요."
    ja: |-
      「指揮官と二人きりでの接見禁止」、
      それから「50年間おやつ禁止」などが
      ありますね。
  d_nikke_guilty_mightybunny_02_15:
    speaker: guilty_b
    en: N-no... that's too harsh!
    ko: 시, 싫어어… 그런 건… 너무 가혹해애….
    ja: イ、イヤぁ…そんなの…ひどすぎる…
  d_nikke_guilty_mightybunny_02_16:
    speaker: "<Monologue>"
    en: Guilty looks like she's on the verge of tears.
    ko: 길티의 표정이 잔뜩 울상이 되었다.
    ja: ギルティは、すっかり泣き出しそうな様子だ
  d_nikke_guilty_mightybunny_02_17:
    speaker: "<Self>"
    en: She didn't do it on purpose, so maybe we can let it slide?
    ko: 고의는 아니었으니 괜찮지 않을까?
    ja: |-
      わざとではなかったんだし、
      お咎めなしでいいんじゃないか？
  d_nikke_guilty_mightybunny_02_18:
    speaker: guilty_b
    en: That's right! I didn't mean to...!
    ko: 맞아…! 일부러 그런 거 아니었어어….
    ja: そう…！わざとじゃなかったのぉ…
  d_nikke_guilty_mightybunny_02_19:
    speaker: mana
    en: "... Unfortunately, I took the liberty of looking into the details of the
      case beforehand"
    ko: "…유감스럽게도, 사건의 전말을 미리 가볍게 조사했습니다만…."
    ja: |-
      …残念ながら、事の次第を
      簡単に調査しましたが…
  d_nikke_guilty_mightybunny_02_20:
    speaker: mana
    en: and found this on a cell phone in Guilty's possession.
    ko: 길티가 소지한 휴대폰에서 이런 내용이 발견되었더군요.
    ja: |-
      ギルティが所持していた携帯電話から、
      このようなものが見つかりました。
  d_nikke_guilty_mightybunny_02_21:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_guilty_mightybunny_02_22:
    speaker: "<Monologue>"
    en: Mana plays a voice recording.
    ko: 마나가 음성 파일 하나를 재생했다.
    ja: マナは音声ファイルを再生した
  d_nikke_guilty_mightybunny_02_23:
    speaker: "<Monologue>"
    en: Guilty's voice can be heard through the speakers.
    ko: 녹음된 파일 속, 길티의 목소리가 들린다.
    ja: |-
      音声ファイルから、
      ギルティの声が聞こえてくる
  d_nikke_guilty_mightybunny_02_24:
    speaker: "<Monologue>"
    en: '"Hmm... What can I do in a bunny girl outfit to win Counselor over...?"'
    ko: "[으음… 바니걸 차림으로 뭘 어떻게 하면 \n교관의 마음을 얻을 수 있을까아….]"
    ja: |-
      「うーん…バニーガール姿でどんなことをすれば
      　教官の心をゲットできるかしら…」
  d_nikke_guilty_mightybunny_02_25:
    speaker: "<Monologue>"
    en: '"I''ve already tried waking him up in one..."'
    ko: "[바니걸 차림으로 모닝콜 해주기… 이건 이미 했고오….]"
    ja: |-
      「バニーガールでモーニングコール…
      　これはもうやったしぃ…」
  d_nikke_guilty_mightybunny_02_26:
    speaker: neon_v
    en: What?! That's so shameless!
    ko: 네에?! 정말 파렴치하네요!
    ja: はいぃ！？ハレンチですね！
  d_nikke_guilty_mightybunny_02_27:
    speaker: anis_i
    en: A bunny girl outfit first thing in the morning?! She totally did that on purpose!
      Seriously, unbelievable!
    ko: 아침부터 바니걸?! 노렸네, 노렸어! 기가 막혀 정말!
    ja: |-
      朝っぱらからバニーガール！？
      完全に狙ってたでしょ！まったく、あきれるわ！
  d_nikke_guilty_mightybunny_02_28:
    speaker: "<Monologue>"
    en: Then, Guilty's voice comes through again.
    ko: 이어서 녹음 파일 속, 길티의 목소리가 들려왔다.
    ja: 続いて再びギルティの声が流れ出した
  d_nikke_guilty_mightybunny_02_29:
    speaker: "<Monologue>"
    en: '"Then all that''s left... is to hug him from behind in a bunny girl outfit..."'
    ko: "[그럼 남은 거언… 바니걸 차림으로 백허그 해주기…?]"
    ja: |-
      「じゃあ、他にはぁ…
      　バニーガールで後ろからハグとか…？」
  d_nikke_guilty_mightybunny_02_30:
    speaker: mana
    en: This is where the issue lies.
    ko: 문제가 되는 부분은 바로 이 부분입니다.
    ja: 問題となるのは、まさにこの部分です。
  d_nikke_guilty_mightybunny_02_31:
    speaker: anis_i
    en: What the heck?! You knew exactly what you were doing, Guilty! You planned
      this whole thing from the start!
    ko: 뭐야! 이거 완전 확신범이네! 다 사전에 짜고 준비하고 한 거 아냐!
    ja: |-
      ハァ？完全に確信犯じゃない！
      全部事前に仕組んで準備してたってことでしょ！
  d_nikke_guilty_mightybunny_02_32:
    speaker: guilty_b
    en: N-no, it's not like that... I really didn't mean to fracture Counselor's spine...
    ko: 아, 아니야아… 교관 허리에 금 가게 하는 건 정말 계획에 없었어어….
    ja: |-
      ち、違うのぉ…教官の腰にヒビを
      入れるつもりは、本当になかったのよぉ…
  d_nikke_guilty_mightybunny_02_33:
    speaker: mana
    en: Commander, premeditated crimes are generally treated more seriously.
    ko: "…지휘관, 보통 계획형 범죄는 죄질이 더 무겁게 책정됩니다."
    ja: |-
      …指揮官。通常、計画的な犯行は
      より罪が重くなります。
  d_nikke_guilty_mightybunny_02_34:
    speaker: mana
    en: Guilty also has a prior criminal record, which needs to be taken into consideration...
    ko: "또한, 길티의 경우 과거 범죄 이력이 남아 있어 \n그 부분도 감안해야 하기는 합니다만…."
    ja: |-
      また、ギルティの場合は
      過去の犯罪歴がありますので、
      その点も考慮しなければなりませんが…
  d_nikke_guilty_mightybunny_02_35:
    speaker: mana
    en: How would you like to proceed, Commander?
    ko: 어떻게 하시겠습니까, 지휘관?
    ja: どうなさいますか？
  d_nikke_guilty_mightybunny_02_36:
    speaker: mana
    en: You are both the victim in this matter and Guilty's counselor.
    ko: 실질적인 피해자도 지휘관, 길티의 담당 교관도 지휘관이므로….
    ja: |-
      被害者は指揮官ですし、
      ギルティの担当教官も指揮官ですので…
  d_nikke_guilty_mightybunny_02_37:
    speaker: mana
    en: As such, the final decision regarding her punishment rests with you.
    ko: 그녀의 처벌에 관한 최종 결정 권한 또한 지휘관에게 귀속됩니다.
    ja: |-
      彼女の処罰に関する最終決定権もまた、
      指揮官に帰属します。
  d_nikke_guilty_mightybunny_02_38:
    speaker: "<Self>"
    en: Um...
    ko: 으음….
    ja: ふむ…
  d_nikke_guilty_mightybunny_02_39:
    speaker: "<Self>"
    en: How about you clean my room as punishment, Guilty?
    ko: 길티, 벌칙으로 내 방을 청소해 줄래?
    ja: |-
      ギルティ、罰として
      私の部屋を掃除してくれるか？
  d_nikke_guilty_mightybunny_02_40:
    speaker: guilty_b
    en: Clean your room...?
    ko: 교관 방을… 청소…?
    ja: 教官の部屋を…掃除…？
  d_nikke_guilty_mightybunny_02_41:
    speaker: "<Monologue>"
    en: It feels a little strange asking a bunny girl to clean instead of a maid...
    ko: "메이드가 아닌 바니걸에게 청소를 부탁하려니 \n살짝 번지수를 잘못 찾은 느낌은 들지만…."
    ja: |-
      メイドではなくバニーガールに掃除を頼むのは
      やや違う気もするが…
  d_nikke_guilty_mightybunny_02_42:
    speaker: "<Monologue>"
    en: But given the circumstances, I decide to keep that to myself.
    ko: 상황이 상황이니 쓸데없는 말은 하지 않기로 했다.
    ja: |-
      状況が状況だけに、
      余計なことは言わないことにした
  d_nikke_guilty_mightybunny_02_43:
    speaker: anis_i
    en: Wait, what?
    ko: 뭐어~?
    ja: ええ～っ？
  d_nikke_guilty_mightybunny_02_44:
    speaker: neon_v
    en: Master! She fractured your back, and that's all the punishment she gets?!
    ko: 스승님! 허리 골절이라는 사안에 비해 너무 가벼운 벌칙 아닌가요?
    ja: |-
      師匠！腰の骨のヒビという被害に比べて、
      罰が軽すぎませんか？
  d_nikke_guilty_mightybunny_02_45:
    speaker: anis_i
    en: Exactly! That's a punishment I'd give Neon for stealing my snacks!
    ko: "맞아! 지휘관님 방 청소라니! \n그건 네온이 맘대로 내 간식 훔쳐먹을 때나 내는 벌칙이라고!"
    ja: |-
      そうよ！指揮官様の部屋の掃除だなんて！
      そんなの、ネオンが勝手に私のおやつを
      盗み食いした時の罰じゃない！
  d_nikke_guilty_mightybunny_02_46:
    speaker: rapi_red
    en: Commander, if the punishment is too lenient, it won't do much to prevent her
      from doing it again.
    ko: 지휘관, 처벌이 너무 무르면 재발 방지 효과를 기대할 수 없습니다.
    ja: |-
      指揮官、甘すぎる処罰に
      再発防止の効果は期待できません。
  d_nikke_guilty_mightybunny_02_47:
    speaker: guilty_b
    en: I said I'd really be... more careful from now on...
    ko: 앞으론 정말… 조심할 거라니까아….
    ja: これからは本当に…気をつけるってばぁ…
  d_nikke_guilty_mightybunny_02_48:
    speaker: guilty_b
    en: I... I said I would...
    ko: 내가… 분명히 말했는데….
    ja: 私…ちゃんと言ってるのに…
  d_nikke_guilty_mightybunny_02_49:
    speaker: guilty_b
    en: But... no one believes me...
    ko: 또… 다들 내 말 안 믿어주고….
    ja: また…みんな私の言うこと信じてくれない…
  d_nikke_guilty_mightybunny_02_50:
    speaker: "<Monologue>"
    en: I'm getting a bad feeling about this... I need to get this under control,
      fast.
    ko: 이런, 슬슬 위험한 예감이 든다. 빨리 수습해야만….
    ja: |-
      まずい、そろそろ危険な予感がする。
      早く何とかしないと…
  d_nikke_guilty_mightybunny_02_51:
    speaker: "<Self>"
    en: Guilty's changed a lot from how she used to be. I think just having her clean
      should be enough to make her reflect on what she did.
    ko: |-
      지금의 길티는 예전과 달라, 많이 갱생했어.
      그러니까 청소만 해도 충분히 잘 반성할 거야.
    ja: |-
      今のギルティは昔とは違う。
      すでに変わろうと努力している。
      掃除だけで十分に反省してくれるはずだ
  d_nikke_guilty_mightybunny_02_52:
    speaker: "<Self>"
    en: Right, Guilty?
    ko: 그렇지, 길티?
    ja: そうだろう、ギルティ？
  d_nikke_guilty_mightybunny_02_53:
    speaker: guilty_b
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_guilty_mightybunny_02_54:
    speaker: guilty_b
    en: Yes, Counselor... hehe.
    ko: 응… 교관, 헤헤….
    ja: うん…教官、えへへ…
  d_nikke_guilty_mightybunny_02_55:
    speaker: guilty_b
    en: I've... changed sooo much...
    ko: 나… 많이 갱생했어어….
    ja: 私…反省してるし…
  d_nikke_guilty_mightybunny_02_56:
    speaker: guilty_b
    en: I'll do it... I'll do my best to clean your room...!
    ko: 할게, 교관 방 청소… 열심히 할게…!
    ja: 教官の部屋の掃除…がんばる…！
  d_nikke_guilty_mightybunny_02_57:
    speaker: "<Monologue>"
    en: That's how Guilty ended up cleaning my room.
    ko: 그렇게 길티에게 방 청소를 부탁하게 되었다.
    ja: |-
      こうして、ギルティに
      部屋の掃除を頼むことになった
  d_nikke_guilty_mightybunny_02_58:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_02_59:
    speaker: "<Monologue>"
    en: But now that I think about it... is this really going to be okay?
    ko: 이제서야 드는 생각이지만… 괜찮을까?
    ja: 今さらだが…大丈夫だろうか？
  d_nikke_guilty_mightybunny_02_60:
    speaker: guilty_b
    en: Hehe... I'm looking forward to... going to Counselor's room...
    ko: 헤헤… 교관 방… 가는 거 기대된다아….
    ja: えへへ…教官の部屋…楽しみぃ…
  d_nikke_guilty_mightybunny_02_61:
    speaker: "<Monologue>"
    en: Guilty's superhuman strength and room cleaning... not exactly a reassuring
      combination.
    ko: 무지막지한 괴력을 갖고 있는 길티와 방 청소라는 조합.
    ja: |-
      すさまじい怪力を持つギルティと、
      部屋の掃除という組み合わせ
  d_nikke_guilty_mightybunny_02_62:
    speaker: "<Monologue>"
    en: I can't exactly see this going smoothly.
    ko: 순탄하게 흘러갈 거란 느낌은 썩 들지 않는다.
    ja: 順調にいくとは、到底思えない
  d_nikke_guilty_mightybunny_02_63:
    speaker: "<Monologue>"
    en: With that in mind, a faint sense of unease starts creeping in...
    ko: 뒤늦게나마, 희미한 불안이 덮쳐왔다….
    ja: 今さらながら、不安が押し寄せてきた…
  d_nikke_guilty_mightybunny_02_64:
    speaker: "<Monologue>"
    en: Why do bad feelings always turn out to be right?
    ko: 왜 나쁜 예감은 항상 들어맞을까.
    ja: |-
      なぜ悪い予感というのは、
      いつも当たってしまうのだろうか
  d_nikke_guilty_mightybunny_02_65:
    speaker: "<Self>"
    en: I was hoping it was just me worrying too much...
    ko: 노파심이길 바랬는데….
    ja: ただの取り越し苦労であってほしかったのだが…
  d_nikke_guilty_mightybunny_02_66:
    speaker: guilty_b
    en: S-sorry, Counselor... I broke another...
    ko: 교, 교과안… 또 부서져 버렸어….
    ja: きょ、教官…また壊れちゃったぁ…
  d_nikke_guilty_mightybunny_02_67:
    speaker: guilty_b
    en: That makes five brooms...
    ko: 이걸로 다섯 개째야… 빗자루….
    ja: これで5本目ね…ほうき…
  d_nikke_guilty_mightybunny_02_68:
    speaker: "<Monologue>"
    en: Sure enough, we have a difficult road ahead of us.
    ko: 아니나 다를까, 우리 앞엔 험난한 길이 기다리고 있었다.
    ja: |-
      案の定、私たちの前には
      険しい道のりが待ち受けていた
  d_nikke_guilty_mightybunny_02_69:
    speaker: "<Self>"
    en: Guess we can think of it as practice for controlling your strength.
    ko: 이왕 이렇게 된 거, 힘 조절 연습이라고 생각하자.
    ja: こうなったら、力加減の練習だと思おう
  d_nikke_guilty_mightybunny_02_70:
    speaker: guilty_b
    en: Okay...
    ko: 응….
    ja: うん…
  d_nikke_guilty_mightybunny_02_71:
    speaker: "<Self>"
    en: So... why are you dressed as a bunny girl, Guilty?
    ko: 그런데… 길티, 왜 바니걸 차림으로 온 거야?
    ja: |-
      ところで…ギルティ、
      どうしてバニーガールで来たんだ？
  d_nikke_guilty_mightybunny_02_72:
    speaker: guilty_b
    en: Because... you...
    ko: 그건… 교관이….
    ja: それは…教官が…
  d_nikke_guilty_mightybunny_02_73:
    speaker: "<Self>"
    en: Me...?
    ko: 내가…?
    ja: 私が…？
  d_nikke_guilty_mightybunny_02_74:
    speaker: guilty_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_02_75:
    speaker: "<Monologue>"
    en: Guilty looks a little pouty, but her cheeks are flushed.
    ko: 어딘가 뾰로통해 보이지만 뺨은 상기된 길티의 얼굴.
    ja: ふくれっ面だが、頬は赤らんでいるギルティの顔
  d_nikke_guilty_mightybunny_02_76:
    speaker: "<Monologue>"
    en: Her eyes sparkle as though she's pleading with me for something.
    ko: 내게 무언가를 호소하는 듯한 눈동자가 빛난다.
    ja: 私に何かを訴えるように、瞳が輝いている
  d_nikke_guilty_mightybunny_02_77:
    speaker: guilty_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_02_78:
    speaker: guilty_b
    en: Well... you like it so much, Counselor...
    ko: 그야… 교관이 워낙… 좋아하니까….
    ja: だって…教官のことが、すごく…好きだから…
  d_nikke_guilty_mightybunny_02_79:
    speaker: "<Self>"
    en: Guilty...
    ko: 길티….
    ja: ギルティ…
  d_nikke_guilty_mightybunny_02_80:
    speaker: guilty_b
    en: I just wanted to see you happy, Counselor...
    ko: 나… 교관을 위해서… 교관이 기뻐하는 모습을 보고 싶어서어….
    ja: |-
      私…教官のために…
      教官の喜ぶ姿が見たくてぇ…
  d_nikke_guilty_mightybunny_02_81:
    speaker: guilty_b
    en: And have you all to myself a little more...
    ko: 교관을 좀 더, 독점하고 싶어서어….
    ja: 教官をもっと、独り占めしたくてぇ…
  d_nikke_guilty_mightybunny_02_82:
    speaker: guilty_b
    en: So...!
    ko: 그래서…!
    ja: だから…！
  d_nikke_guilty_mightybunny_02_83:
    speaker: "<Narration>"
    en: "*Crack!*"
    ko: 우지끈!
    ja: バキッ！
  d_nikke_guilty_mightybunny_02_84:
    speaker: "<Self>"
    en: Oh no...
    ko: 아차….
    ja: あっ…
  d_nikke_guilty_mightybunny_02_85:
    speaker: guilty_b
    en: Ahh... No...
    ko: 아앗… 안 돼애….
    ja: ああっ…ダメェ…
  d_nikke_guilty_mightybunny_02_86:
    speaker: "<Monologue>"
    en: And just like that, Guilty breaks the sixth broom.
    ko: 결국, 길티가 여섯 번째 빗자루를 부러뜨리고 말았다.
    ja: |-
      結局、ギルティは
      6本目のほうきを折ってしまった
d_nikke_guilty_mightybunny_03:
  d_nikke_guilty_mightybunny_03_1:
    speaker: "<Monologue>"
    en: And just like that, Guilty breaks the sixth broom.
    ko: 결국, 길티가 여섯 번째 빗자루를 부러뜨리고 말았다.
    ja: |-
      結局、ギルティは
      6本目のほうきを折ってしまった
  d_nikke_guilty_mightybunny_03_2:
    speaker: guilty_b
    en: Ugh... It's so hard to control my strength...
    ko: 으으… 힘 조절 너무 어려워어….
    ja: うう…力加減が、難しすぎる…
  d_nikke_guilty_mightybunny_03_3:
    speaker: "<Self>"
    en: Want to try holding hands again, Guilty? It’s been a while.
    ko: 길티, 오랜만에 다시 해볼까? 손잡기.
    ja: ギルティ、久しぶりにまた手を握ってみるか？
  d_nikke_guilty_mightybunny_03_4:
    speaker: guilty_b
    en: Really?!
    ko: "…! 정마알…?"
    ja: "…！本当ぉ…？"
  d_nikke_guilty_mightybunny_03_5:
    speaker: guilty_b
    en: So I can do that again...? Hold your hand tight... squeeze it, then let go...?
    ko: |-
      그럼 교관 손 꼬옥 잡으면서… 힘 줬다가 풀었다가 하는 거…
      또 해도 되는 거야…?
    ja: |-
      じゃあ、教官の手をぎゅっと握りながら…
      力を入れたり抜いたりするの…
      やってもいいの…？
  d_nikke_guilty_mightybunny_03_6:
    speaker: "<Self>"
    en: Yeah. Just be careful this time, okay?
    ko: 응, 이번엔 조심해줘.
    ja: ああ、今回は気をつけるんだぞ
  d_nikke_guilty_mightybunny_03_7:
    speaker: guilty_b
    en: Hehe, okay... I'll really try not to break any bones this time...!
    ko: "헤헤… 응…. \n이번에는 뼈 안 부러뜨리게 정말 조심할게에…!"
    ja: |-
      えへへ…うん…
      今度は骨を折らないように、
      ちゃんと気をつけるわぁ…！
  d_nikke_guilty_mightybunny_03_8:
    speaker: "<Narration>"
    en: Guilty grabs my hand tightly...
    ko: 꼬옥….
    ja: ぎゅっ…
  d_nikke_guilty_mightybunny_03_9:
    speaker: "<Self>"
    en: Your hands are warm, Guilty.
    ko: 길티는 손이 따뜻하구나.
    ja: ギルティの手は温かいな
  d_nikke_guilty_mightybunny_03_10:
    speaker: guilty_b
    en: Yours too... Counselor...
    ko: 으응… 교관 손도… 따뜻해애….
    ja: うん…教官の手も…あったかいよぉ…
  d_nikke_guilty_mightybunny_03_11:
    speaker: "<Narration>"
    en: Her fingers gently shift against mine.
    ko: 꼼지락, 꼼지락….
    ja: もぞっ、もぞっ
  d_nikke_guilty_mightybunny_03_12:
    speaker: guilty_b
    en: You remember when we first met...?
    ko: 있지이… 처음 만났을 때….
    ja: あのねぇ…初めて会った時…
  d_nikke_guilty_mightybunny_03_13:
    speaker: guilty_b
    en: Even though you were scared of my strength... you still held my hand... It
      made me so happy...
    ko: |-
      교관이 내 힘을 무서워하면서도…
      그런데도 내 손 잡아줘서… 정말 좋았어어….
    ja: |-
      私の力を怖がりながら…
      それでも私の手を握ってくれて…
      本当に嬉しかったの…
  d_nikke_guilty_mightybunny_03_14:
    speaker: guilty_b
    en: I really didn't know how much I needed to hold back to hold a human hand...
    ko: "얼마나 힘을 덜 줘야 인간의 손을 잡을 수 있는 건지… \n난 정말 하나도 몰랐었는데에…."
    ja: |-
      どのくらい力を抜けば人間の手を握れるのか…
      本当に分からなかったんだけどぉ…
  d_nikke_guilty_mightybunny_03_15:
    speaker: guilty_b
    en: You're the one who taught me all of that, Counselor...
    ko: 전부 다, 교관이 가르쳐준 거야아….
    ja: 全部、教官が教えてくれたのよね…
  d_nikke_guilty_mightybunny_03_16:
    speaker: "<Self>"
    en: I've learned a lot from you too, Guilty.
    ko: 나도 길티에게 배운 게 참 많아.
    ja: 私もギルティから学んだことがたくさんある
  d_nikke_guilty_mightybunny_03_17:
    speaker: guilty_b
    en: You've learned from me...? Like what?
    ko: 응? 교관이 나한테 뭘 배웠다고…? 어떤 거어…?
    ja: |-
      え？私から学んだこと…？
      それって、どんなことぉ…？
  d_nikke_guilty_mightybunny_03_18:
    speaker: "<Self>"
    en: For example...
    ko: 예를 들면….
    ja: 例えば…
  d_nikke_guilty_mightybunny_03_19:
    speaker: "<Narration>"
    en: Just then, my phone rings.
    ko: 그 때, 휴대폰이 울렸다.
    ja: その時、携帯電話が鳴った
  d_nikke_guilty_mightybunny_03_20:
    speaker: "<Self>"
    en: I think we'll stop here for today, Guilty.
    ko: 길티, 오늘은 여기까지 해야겠다.
    ja: ギルティ、今日はここまでにしよう
  d_nikke_guilty_mightybunny_03_21:
    speaker: guilty_b
    en: Huh...? But I didn't get to hear what you were going to say...
    ko: 응…? 그치만… 교관이 무슨 말 하려는지 아직 못 들었고….
    ja: |-
      え…？でも…教官…
      何を言おうとしたの…？
  d_nikke_guilty_mightybunny_03_22:
    speaker: guilty_b
    en: And I didn't finish cleaning... and we barely got to hold hands...
    ko: 청소도 아직 다 못했고오… 손 잡는 것도… 너무 짧은데에….
    ja: |-
      掃除もまだ終わってないしぃ…
      手を繋ぐのも…
  d_nikke_guilty_mightybunny_03_23:
    speaker: "<Self>"
    en: We can do it again next time.
    ko: 다음 기회가 또 있을 거야.
    ja: また次の機会がある
  d_nikke_guilty_mightybunny_03_24:
    speaker: guilty_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_03_25:
    speaker: guilty_b
    en: Okayyy... I'll do as you say, Counselor...
    ko: 알았어어… 교관 말 들을게에….
    ja: 分かったぁ…教官の言うことを聞くわねぇ…
  d_nikke_guilty_mightybunny_03_26:
    speaker: guilty_b
    en: I'm rehabilitated now, after all...
    ko: 나, 갱생했으니까아….
    ja: だって私、更生したからぁ…
  d_nikke_guilty_mightybunny_03_27:
    speaker: "<Narration>"
    en: That night...
    ko: 그날 밤
    ja: その日の夜
  d_nikke_guilty_mightybunny_03_28:
    speaker: guilty_b
    en: Counselor... He did that after looking at his phone... So the others must've
      interrupted us...
    ko: "교관… 휴대폰 보고 나서 그랬으니까… \n또 다른 애들이 방해한 거였겠지이…."
    ja: |-
      教官…携帯を見てああなったってことは…
      また他の子たちが邪魔したのねぇ…
  d_nikke_guilty_mightybunny_03_29:
    speaker: guilty_b
    en: I wanna use my strength... I really do... But I can't anymore... If I wanna
      stay by Counselor's side... I have to rehabilitate...
    ko: |-
      힘… 쓰고 싶다아. 이제 쓰면 안 되지만…
      교관 옆에 있으려면… 갱생… 해야 하니까….
    ja: |-
      力…使いたいなぁ…でももう使っちゃダメ…
      教官のそばにいるためには…
      更生…しなきゃだからぁ…
  d_nikke_guilty_mightybunny_03_30:
    speaker: guilty_b
    en: Still... it was just the two of us... in the Counselor's room... and I even
      got to hold his hand... hehe...
    ko: 그래도… 지휘관과 단둘이서… 지휘관의 방에서… 손도 잡고… 헤헤….
    ja: |-
      でも…教官と二人きりで…
      教官の部屋で…手も繋いで…えへへ…
  d_nikke_guilty_mightybunny_03_31:
    speaker: guilty_b
    en: It felt sooo nice... If this is what punishment is like... I might want it
      again...
    ko: 너무 좋았어어… 이런 벌이라면… 또… 받고 싶을지도오….
    ja: |-
      すごくよかったぁ…こんな罰なら…
      また…受けたいかも…
  d_nikke_guilty_mightybunny_03_32:
    speaker: guilty_b
    en: If I don't use my strength... then maybe...
    ko: 만약… 힘 쓰는 게 아니라면… 그렇다며언….
    ja: |-
      …力を使わないとして…
      それだったら…
  d_nikke_guilty_mightybunny_03_33:
    speaker: guilty_b
    en: Hmm...
    ko: 흐으음….
    ja: う～ん…
  d_nikke_guilty_mightybunny_03_34:
    speaker: "<Monologue>"
    en: Ever since that day, Guilty starts acting a little... strange.
    ko: 그날 이후로 길티의 모습이 좀 이상하다.
    ja: あの日以来、ギルティの様子が少しおかしい
  d_nikke_guilty_mightybunny_03_35:
    speaker: "<Monologue>"
    en: It starts with the smallest things. For example...
    ko: 처음에는 아주 사소한 변화로 시작했다. 예를 들면….
    ja: |-
      最初は、ごくわずかな変化だった。
      例えば…
  d_nikke_guilty_mightybunny_03_36:
    speaker: "<Self>"
    en: Hmm... Guilty's not here yet.
    ko: 약속 시간이 됐는데 길티가 안 보이네?
    ja: 約束の時間だが、ギルティがいないな
  d_nikke_guilty_mightybunny_03_37:
    speaker: "<Narration>"
    en: 5 minutes later...
    ko: 5분 후.
    ja: 5分後
  d_nikke_guilty_mightybunny_03_38:
    speaker: guilty
    en: Hi, Counselor...
    ko: 안녕, 교과안….
    ja: やっほー、教官…
  d_nikke_guilty_mightybunny_03_39:
    speaker: "<Self>"
    en: Hey, Guilty.
    ko: 안녕, 길티.
    ja: やあ、ギルティ
  d_nikke_guilty_mightybunny_03_40:
    speaker: guilty
    en: Um...
    ko: |-
      응….
      …….
    ja: |-
      うん…
      ……
  d_nikke_guilty_mightybunny_03_41:
    speaker: "<Narration>"
    en: Guilty steals a glance at the Commander.
    ko: 힐끔.
    ja: ちらっ
  d_nikke_guilty_mightybunny_03_42:
    speaker: guilty
    en: Aren't you... mad at me, Counselor?
    ko: 교과안… 화 안 내?
    ja: 教官…怒らないの…？
  d_nikke_guilty_mightybunny_03_43:
    speaker: guilty
    en: I was late... so I should be punished...
    ko: 나, 지각했는데에… 벌받아야 할지도오…?
    ja: |-
      私、遅刻したのよぉ…
      お仕置きが必要かもぉ…？
  d_nikke_guilty_mightybunny_03_44:
    speaker: "<Self>"
    en: It's only five minutes.
    ko: 5분 정도는 괜찮아.
    ja: 5分くらいなら構わない
  d_nikke_guilty_mightybunny_03_45:
    speaker: guilty
    en: Huh?
    ko: 어?
    ja: え？
  d_nikke_guilty_mightybunny_03_46:
    speaker: "<Self>"
    en: It's no big deal.
    ko: 5분 늦은 건데 뭐.
    ja: たった5分遅れただけだろう
  d_nikke_guilty_mightybunny_03_47:
    speaker: guilty
    en: "... So five minutes isn't enough, huh?"
    ko: |-
      …….
      5분 정도론, 안 되는 건가아….
    ja: |-
      ……
      5分くらいじゃ、ダメなのかなぁ…
  d_nikke_guilty_mightybunny_03_48:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_guilty_mightybunny_03_49:
    speaker: guilty
    en: Tch.
    ko: 체엣….
    ja: ちぇっ…
  d_nikke_guilty_mightybunny_03_50:
    speaker: guilty
    en: It's raining outside, Counselor... You might wanna bring an umbrella...
    ko: 교과안, 지금 밖에 비 오니까… 우산… 챙기는 게 좋을 거야아….
    ja: |-
      教官、雨が降ってるから…
      傘…持っていったほうがいいわよぉ…
  d_nikke_guilty_mightybunny_03_51:
    speaker: "<Self>"
    en: Got it. Thanks, Guilty.
    ko: 고마워, 길티.
    ja: ありがとう、ギルティ
  d_nikke_guilty_mightybunny_03_52:
    speaker: guilty
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_03_53:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_guilty_mightybunny_03_54:
    speaker: "<Monologue>"
    en: But when I step outside, it's perfectly sunny.
    ko: 건물 밖으로 나왔지만 화창하기만 하다.
    ja: |-
      建物の外に出てみたが、
      空は気持ちよく晴れている
  d_nikke_guilty_mightybunny_03_55:
    speaker: "<Self>"
    en: It's not raining?
    ko: 비가 안 오네?
    ja: 雨は降っていないな
  d_nikke_guilty_mightybunny_03_56:
    speaker: guilty
    en: Yeah, I lied to you, Counselor... I just wanted to give you a hard time...
    ko: |-
      응, 나, 교관한테 거짓말 했어…
      교관을, 골탕 먹이려고오….
    ja: |-
      うん。私、ウソをついたの…
      教官を、困らせようと思ってぇ…
  d_nikke_guilty_mightybunny_03_57:
    speaker: "<Self>"
    en: What?
    ko: 뭐?
    ja: 何？
  d_nikke_guilty_mightybunny_03_58:
    speaker: guilty
    en: So what do you think...? A-am I a bad girl...?
    ko: 어때…? 나, 나빠…?
    ja: どう…？私、悪い子…？
  d_nikke_guilty_mightybunny_03_59:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_03_60:
    speaker: guilty
    en: Counselor, Sin's got something to tell you...
    ko: 신이, 교관한테 할 말 있대애….
    ja: シンが、教官に話があるって…
  d_nikke_guilty_mightybunny_03_61:
    speaker: sin
    en: Huh? No I don't.
    ko: 응? 없는데?
    ja: え？話なんてないけど？
  d_nikke_guilty_mightybunny_03_62:
    speaker: "<Self>"
    en: "... All right, that's enough!"
    ko: "…더 이상은 안 되겠어!"
    ja: "…もうダメだ"
  d_nikke_guilty_mightybunny_03_63:
    speaker: "<Self>"
    en: We need to talk, Guilty.
    ko: 얘기할 게 있어, 길티.
    ja: ギルティ、話がある
  d_nikke_guilty_mightybunny_03_64:
    speaker: guilty_b
    en: Hehe... what's the matter, Counselor?
    ko: 응…! 헤헤, 왜애…? 교과안….
    ja: うん…！えへへ、なぁに…？教官…
  d_nikke_guilty_mightybunny_03_65:
    speaker: "<Self>"
    en: Listen up, Guilty.
    ko: 길티, 잘 들어.
    ja: よく聞くんだ
  d_nikke_guilty_mightybunny_03_66:
    speaker: guilty_b
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_guilty_mightybunny_03_67:
    speaker: "<Monologue>"
    en: Guilty stares at me with wide eyes. Seeing her like that...
    ko: 길티가 토끼눈을 뜨고 나를 바라본다. 그 모습에 그만….
    ja: |-
      ギルティが、きょとんとした表情で
      私を見つめている。その姿を見て…
  d_nikke_guilty_mightybunny_03_68:
    speaker: "<Self>"
    en: You're being a bad bunny!
    ko: 이러면 나쁜 토끼야!
    ja: これでは、悪いウサギだ！
  d_nikke_guilty_mightybunny_03_69:
    speaker: "<Monologue>"
    en: I end up blurting it out before I can stop myself.
    ko: 말이 헛나가고 말았다.
    ja: "…思わず口にしてしまった"
d_nikke_guilty_mightybunny_04:
  d_nikke_guilty_mightybunny_04_1:
    speaker: "<Self>"
    en: You're being a bad bunny!
    ko: 이러면 나쁜 토끼야!
    ja: これでは、悪いウサギだ！
  d_nikke_guilty_mightybunny_04_2:
    speaker: guilty_b
    en: "... What? A bad... bunny?"
    ko: "…으응? 나쁜… 토끼…?"
    ja: "…んん？悪い…ウサギ…？"
  d_nikke_guilty_mightybunny_04_3:
    speaker: guilty_b
    en: What do you mean, Counselor?
    ko: 그게 무슨 뜻이야, 교관…?
    ja: それってどういう意味…？
  d_nikke_guilty_mightybunny_04_4:
    speaker: "<Self>"
    en: H-hold on, let me try that again.
    ko: 다, 다시 말할게.
    ja: つ、つまり…
  d_nikke_guilty_mightybunny_04_5:
    speaker: guilty_b
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_guilty_mightybunny_04_6:
    speaker: "<Self>"
    en: You shouldn't make a habit of lying to people.
    ko: 습관적으로 사람을 속여선 안 돼.
    ja: 人を騙すことがクセになってはいけない
  d_nikke_guilty_mightybunny_04_7:
    speaker: "<Self>"
    en: Otherwise, the others might get the wrong idea about you.
    ko: 다른 사람들이 길티를 오해하게 될 거야.
    ja: |-
      周りの人に
      ギルティのことを誤解されてしまうぞ
  d_nikke_guilty_mightybunny_04_8:
    speaker: guilty_b
    en: Oh...
    ko: "…아…."
    ja: "…あ…"
  d_nikke_guilty_mightybunny_04_9:
    speaker: guilty_b
    en: Is that why... you called me here today, Counselor...?
    ko: 교관… 혹시 오늘… 그래서 날 부른 거야…?
    ja: |-
      教官…もしかして今日…
      それで私を呼んだの…？
  d_nikke_guilty_mightybunny_04_10:
    speaker: guilty_b
    en: I... thought you wanted to finish what you were saying last time...
    ko: 나느은… 교관이 지난번에 하다 만 얘기… 해줄 줄 알고….
    ja: |-
      私は…教官がこの前、途中でやめちゃった話の…
      続きをしてくれると思って…
  d_nikke_guilty_mightybunny_04_11:
    speaker: "<Self>"
    en: Finish what I was saying before...?
    ko: 하다 만 얘기…?
    ja: 途中でやめた話…？
  d_nikke_guilty_mightybunny_04_12:
    speaker: guilty_b
    en: "... So you don't remember."
    ko: "…기억 못 하는구나."
    ja: "…覚えてないのね。"
  d_nikke_guilty_mightybunny_04_13:
    speaker: guilty_b
    en: I've been waiting all this time...
    ko: 나는, 계속 기다리고 있었는데에….
    ja: 私は、ずっと待ってたのにぃ…
  d_nikke_guilty_mightybunny_04_14:
    speaker: guilty_b
    en: I even put on the bunny girl outfit... just because I thought you'd be happy...
    ko: 교관이 기뻐해 주면 좋겠어서, 기껏… 옷도….
    ja: |-
      教官が喜んでくれたらいいなと思って、
      …服もせっかく…
  d_nikke_guilty_mightybunny_04_15:
    speaker: "<Narration>"
    en: "*Clench...*"
    ko: 꾸우욱….
    ja: ぎゅうっ…
  d_nikke_guilty_mightybunny_04_16:
    speaker: "<Monologue>"
    en: Guilty curls her hands into fists, looking upset.
    ko: 길티가 속상한 듯 주먹을 꾹 쥔다.
    ja: ギルティは悲しそうに拳をぎゅっと握りしめた
  d_nikke_guilty_mightybunny_04_17:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  d_nikke_guilty_mightybunny_04_18:
    speaker: guilty_b
    en: Ugh... Mm... N-ngh...
    ko: "…아… 으음. 으으, 읏."
    ja: "…あ…うぅ。うう、うっ…"
  d_nikke_guilty_mightybunny_04_19:
    speaker: "<Monologue>"
    en: But she soon forces herself to relax her grip,
    ko: 하지만 곧 애써 힘을 풀어냈다.
    ja: だが、すぐになんとか力を緩めた
  d_nikke_guilty_mightybunny_04_20:
    speaker: "<Monologue>"
    en: just as she did the first time I held her hand.
    ko: 마치 나와 처음으로 손을 잡았을 때처럼.
    ja: まるで、初めて私と手を繋いだ時のように
  d_nikke_guilty_mightybunny_04_21:
    speaker: "<Self>"
    en: Good job, Guilty!
    ko: 잘했어, 길티!
    ja: えらいぞ、ギルティ！
  d_nikke_guilty_mightybunny_04_22:
    speaker: guilty_b
    en: Yeah, I'm glad you think so...
    ko: "…응. 칭찬해 줘서 기뻐어…."
    ja: "…うん。褒めてもらえて、嬉しいぃ…"
  d_nikke_guilty_mightybunny_04_23:
    speaker: guilty_b
    en: Counselor, I won't do that anymore... I won't lie to you...
    ko: 교관, 나 이제 안 그럴게… 거짓말 안 할게.
    ja: |-
      教官、もうあんなことしない…
      ウソはつかないから…
  d_nikke_guilty_mightybunny_04_24:
    speaker: guilty_b
    en: I... understand what you mean now.
    ko: 교관 말… 알아. 이제는 무슨 말인지 알아.
    ja: |-
      教官の言いたいこと…分かる。
      もう今はどういう意味か分かってるから…
  d_nikke_guilty_mightybunny_04_25:
    speaker: guilty_b
    en: I don't want everything we've done together to just go to waste either...
    ko: "교관이랑 지금까지 같이 해온 일들이 물거품이 되는 건, \n나도 싫으니까아…."
    ja: |-
      教官と今まで一緒に
      がんばったことが水の泡になるのは、
      私もイヤだからぁ…
  d_nikke_guilty_mightybunny_04_26:
    speaker: "<Self>"
    en: Thanks, Guilty!
    ko: 고마워, 길티!
    ja: ありがとう、ギルティ！
  d_nikke_guilty_mightybunny_04_27:
    speaker: guilty_b
    en: Yeah...
    ko: 응….
    ja: うん…
  d_nikke_guilty_mightybunny_04_28:
    speaker: "<Monologue>"
    en: Guilty walks out of the room,
    ko: 방문을 나서는 길티의 뒷모습.
    ja: 部屋を出ていくギルティの後ろ姿は…
  d_nikke_guilty_mightybunny_04_29:
    speaker: "<Monologue>"
    en: looking like a crestfallen bunny with its ears drooping.
    ko: 기가 죽어 두 귀가 축 늘어진 토끼와 닮았다.
    ja: |-
      しょげて両耳をだらんと垂らした
      ウサギのようだった
  d_nikke_guilty_mightybunny_04_30:
    speaker: guilty_b
    en: "... I got scolded."
    ko: "…혼나버렸다."
    ja: "…怒られちゃった。"
  d_nikke_guilty_mightybunny_04_31:
    speaker: guilty_b
    en: I know he's only doing it for my sake, but...
    ko: 교관이 날 위해서 그러는 거라는걸, 이제는 나도 알지만….
    ja: |-
      私のためを思って、言ってくれるんだって、
      今は私も分かるけど…
  d_nikke_guilty_mightybunny_04_32:
    speaker: guilty_b
    en: I felt so lonely after being scolded...
    ko: 혼나니까 외로웠어.
    ja: 怒られて、寂しかったな…
  d_nikke_guilty_mightybunny_04_33:
    speaker: guilty_b
    en: But... if I wanna stay with you, I have to rehabilitate...
    ko: 하지만… 교관이랑 같이 있으려면 난 갱생해야 해….
    ja: |-
      でも…教官と一緒にいるためには、
      更生しなきゃ…
  d_nikke_guilty_mightybunny_04_34:
    speaker: guilty_b
    en: "'Cause you're my counselor, after all..."
    ko: 교관은, 내 교관이니까아….
    ja: 教官は、私の教官だからぁ…
  d_nikke_guilty_mightybunny_04_35:
    speaker: guilty_b
    en: Hmm? Wait... then what happens if... someday, I become completely rehabilitated?
    ko: "…으응? 잠깐만… 그럼 만약에… 언젠가 내가 완벽하게 갱생한다면?"
    ja: |-
      …あれ？待って…じゃあ、もし…
      いつか私が完璧に更生したら？
  d_nikke_guilty_mightybunny_04_36:
    speaker: guilty_b
    en: What if I'm no longer a criminal... no longer guilty? What happens then?
    ko: 내가 죄인이… 유죄가 아니게 된다면? 그럼 그때는?
    ja: |-
      私が罪人じゃ…罪がなくなったら？
      その時は？
  d_nikke_guilty_mightybunny_04_37:
    speaker: guilty_b
    en: Will you still be my counselor?
    ko: 그때도… 교관은 그대로 내 교관인 걸까?
    ja: |-
      その時も…教官は、変わらず
      私の教官でいてくれるの？
  d_nikke_guilty_mightybunny_04_38:
    speaker: guilty_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_04_39:
    speaker: "<Narration>"
    en: Meanwhile, outside the Commander's Room...
    ko: 그 시각, 지휘관실 문밖.
    ja: 同じ時刻、指揮官室のドアの外
  d_nikke_guilty_mightybunny_04_40:
    speaker: anis_i
    en: "... Hey, you guys heard that too, right? I'm not hearing things, am I?"
    ko: "…야, 아까 들었어? 내가 잘못 들은 거 아니지?"
    ja: |-
      …ちょっと、さっきの聞いた？
      私の聞き間違いじゃないよね？
  d_nikke_guilty_mightybunny_04_41:
    speaker: neon_v
    en: I heard it too! Oh my gosh...
    ko: 저도 들었어요! 세상에… 스승님이….
    ja: 私も聞きました！まさか…師匠が…
  d_nikke_guilty_mightybunny_04_42:
    speaker: neon_v
    en: Master actually said, "Hey, you're being a bad bunny!" And then he... he actually...!
    ko: "[에잇, 이러면 나쁜 토끼야!] 하고… 막 그분을…!"
    ja: |-
      「ったく、これじゃ悪いウサギだ！」って…
      あの方を…！
  d_nikke_guilty_mightybunny_04_43:
    speaker: rapi_red
    en: I don't think the Commander said anything like "Hey."
    ko: 딱히 [에잇] 같은 건 안 하셨던 것 같은데.
    ja: "「ったく」とは言っていなかったと思うけど。"
  d_nikke_guilty_mightybunny_04_44:
    speaker: rapi_red
    en: But... yeah, I'm worried too. What happened in there?
    ko: 하지만… 그러게. 나도 신경 쓰여. 대체 무슨 상황이었던 걸까.
    ja: |-
      でも…そうね。私も気になるわ。
      いったいどういう状況だったのかしら。
  d_nikke_guilty_mightybunny_04_45:
    speaker: anis_i
    en: Why does she keep showing up in the Commander's room dressed like that?
    ko: 걔는 왜 또 그런 묘~한 복장으로 지휘관실을 찾아오냐고~!
    ja: |-
      あの子はなんでまた、あ～んな
      ヘンな格好で指揮官室に来るのよ～！
  d_nikke_guilty_mightybunny_04_46:
    speaker: anis_i
    en: "... But does the Commander really like that outfit enough to turn into a
      completely different person?"
    ko: "…근데 지휘관님은 그 옷이 그렇게 좋나? 사람 성격이 바뀔 정도로?"
    ja: |-
      …ていうか、指揮官様って
      あの服がそんなに好きなワケ？
      ヒトが変わっちゃうくらい？
  d_nikke_guilty_mightybunny_04_47:
    speaker: "<Monologue>"
    en: The Counters hear one stray remark during the visit and thinks they've got
      the whole situation figured out.
    ko: 방문에서 새어 나온 한 마디만으로 상황을 파악한 카운터스 스쿼드.
    ja: |-
      カウンターズ部隊は
      部屋から漏れ聞こえた一言によって…
  d_nikke_guilty_mightybunny_04_48:
    speaker: "<Monologue>"
    en: But they couldn't have been more wrong...
    ko: 그들은 아주 단단히 오해하고 말았고….
    ja: すっかり誤解してしまい…
  d_nikke_guilty_mightybunny_04_49:
    speaker: mana
    en: "... Excuse me? The Commander told Guilty that bad bunnies need training?"
    ko: "…예? 지휘관이 길티에게 \n[나쁜 토끼에게는 교육이 필요하다]고 했다고요?"
    ja: |-
      …え？指揮官がギルティに
      「悪いウサギにはしつけが必要だ」と
      言ったんですか？
  d_nikke_guilty_mightybunny_04_50:
    speaker: mana
    en: That's... quite a provocative thing to say.
    ko: 그건… 상당히… 자극적인 이야기로군요.
    ja: それは…かなり…刺激的な話ですね。
  d_nikke_guilty_mightybunny_04_51:
    speaker: mana
    en: "*Sigh...* What is it about those bunny girls that has him so fascinated?"
    ko: "…하아. 대체 그놈의 바니걸이 뭐라고…."
    ja: |-
      …はぁ。いったいバニーガールの
      どこがいいんでしょう…
  d_nikke_guilty_mightybunny_04_52:
    speaker: "<Monologue>"
    en: Rumors spread endlessly, changing a little with every retelling.
    ko: 원래 소문은 한없이 퍼져나가고, 점점 내용이 바뀐다.
    ja: |-
      ウワサとは、際限なく広がり、
      尾ひれがついて伝わるものだ
  d_nikke_guilty_mightybunny_04_53:
    speaker: "<Monologue>"
    en: New stories about me are making the rounds in the Ark.
    ko: 방주에는 나에 대한 새로운 이야기가 떠돌고 있다.
    ja: |-
      アークでは、私に関する
      新たなウワサが広まっていた
  d_nikke_guilty_mightybunny_04_54:
    speaker: "<Monologue>"
    en: '"The Commander''s changed. He''s not the kind person he used to be."'
    ko: "[요즘 지휘관은 사람이 변했다. 예전의 상냥하던 그 지휘관이 아니다.]"
    ja: |-
      「最近の指揮官は人が変わってしまった。
      　昔の優しかったあの指揮官ではない」
  d_nikke_guilty_mightybunny_04_55:
    speaker: "<Monologue>"
    en: And even... "The Commander came back a man, not a boy."
    ko: 즉… [지휘관이 소년에서 남자로 돌아왔다.]
    ja: "「指揮官が少年から男になって戻ってきた」"
  d_nikke_guilty_mightybunny_04_56:
    speaker: mustang
    en: Pardon, ma chère?
    ko: What?
    ja: What？
  d_nikke_guilty_mightybunny_04_57:
    speaker: "<Monologue>"
    en: Before long, it gets twisted into something like, "The Commander has turned
      into a beast."
    ko: 이는 머지않아 [지휘관이 짐승으로 변했다.] 따위의 말로 변주되고….
    ja: |-
      やがて「指揮官が獣になった」
      という話に変わり…
  d_nikke_guilty_mightybunny_04_58:
    speaker: ingrid
    en: "... What?"
    ko: "…뭐라고?"
    ja: "…何だと？"
  d_nikke_guilty_mightybunny_04_59:
    speaker: "<Monologue>"
    en: Eventually, it turns into a rumor that the Commander has transformed into
      a Rapture.
    ko: 결국 [지휘관이 랩쳐로 변했다.]는 루머에 이른다.
    ja: |-
      最終的に「指揮官がラプチャーになった」
      というウワサにまで発展した
  d_nikke_guilty_mightybunny_04_60:
    speaker: syuen
    en: That damn...!
    ko: 그 미친 X이!!!
    ja: あのXX野郎！！！
  d_nikke_guilty_mightybunny_04_61:
    speaker: "<Self>"
    en: No way...
    ko: "…이럴 수가."
    ja: "…なんてことだ"
  d_nikke_guilty_mightybunny_04_62:
    speaker: guilty_b
    en: But that's not what you meant, Counselor...
    ko: 교관은 그런 뜻으로 말한 게 아니었는데에….
    ja: |-
      教官は、そんな意味で
      言ったんじゃないのにぃ…
  d_nikke_guilty_mightybunny_04_63:
    speaker: "<Self>"
    en: Man, rumors are scary.
    ko: 소문은 정말 무섭구나.
    ja: ウワサは本当に怖いな
  d_nikke_guilty_mightybunny_04_64:
    speaker: guilty_b
    en: Yeah, they really are...
    ko: 응, 정말로오….
    ja: うん、そうねぇ…
  d_nikke_guilty_mightybunny_04_65:
    speaker: guilty_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_guilty_mightybunny_04_66:
    speaker: guilty_b
    en: You're really popular, Counselor...
    ko: 교관은… 정말 인기가 많구나아.
    ja: 教官は…本当に人気者なのねぇ…
  d_nikke_guilty_mightybunny_04_67:
    speaker: guilty_b
    en: That little rumor just kept spreading and spreading... until everyone was
      talking about it...
    ko: 작은 소문이 이렇게 크게 퍼지고 퍼져서… 모든 애들이 얘기할 정도로….
    ja: |-
      小さなウワサが、どんどん広まって…
      みんなが話題にするほど…
  d_nikke_guilty_mightybunny_04_68:
    speaker: "<Self>"
    en: They're just messing with me.
    ko: 그냥 놀리는 거지, 뭐.
    ja: ただからかわれているだけだろう
  d_nikke_guilty_mightybunny_04_69:
    speaker: guilty_b
    en: Is that so...?
    ko: 그런가아….
    ja: そうかしら….
  d_nikke_guilty_mightybunny_04_70:
    speaker: "<Self>"
    en: Honestly, I was worried people might start thinking you were a bad bunny,
      Guilty.
    ko: 길티가 나쁜 토끼라는 말이 퍼질까 봐 걱정했어.
    ja: |-
      ギルティが悪いウサギだという
      ウワサが広まるんじゃないかと、
      心配していたんだ
  d_nikke_guilty_mightybunny_04_71:
    speaker: "<Self>"
    en: I'd rather have weird rumors spread about me than you.
    ko: 차라리 내 소문이 이상하게 난 게 나아.
    ja: いっそ私の変なウワサが流れるほうがマシだ
  d_nikke_guilty_mightybunny_04_72:
    speaker: guilty_b
    en: You're still so warm, Counselor... Just like your hands...
    ko: "…교관은 여전히 따뜻하네에. 교관의 손처럼… 따뜻해."
    ja: |-
      …教官は相変わらず温かいわ。
      教官の手みたいに…あったかい。
  d_nikke_guilty_mightybunny_04_73:
    speaker: guilty_b
    en: It makes me so sad.
    ko: 너무 따뜻해서… 슬퍼질 정도로.
    ja: あったかすぎて…悲しくなるくらい…
  d_nikke_guilty_mightybunny_04_74:
    speaker: "<Self>"
    en: Sad...?
    ko: 슬프다고…?
    ja: 悲しいのか…？
  d_nikke_guilty_mightybunny_04_75:
    speaker: guilty_b
    en: Well, Counselor... Someday, when I'm finally a decent person...
    ko: "…있잖아, 교과안. 언젠가 내가 정말 어엿해져서…."
    ja: |-
      …あのね、教官。
      いつか私が本当に一人前になって…
  d_nikke_guilty_mightybunny_04_76:
    speaker: guilty_b
    en: when I stop causing trouble... when I learn to keep my strength under control...
    ko: 아무런 문제도 일으키지 않고, 힘도 조절하게 될 수 있게 돼서….
    ja: |-
      何の問題も起こさなくなって、
      力の加減もできるようになって…
  d_nikke_guilty_mightybunny_04_77:
    speaker: guilty_b
    en: when I'm finally rehabilitated...
    ko: 그래서 완전히 [갱생]하면….
    ja: そうして、完全に「更生」したら…
  d_nikke_guilty_mightybunny_04_78:
    speaker: guilty_b
    en: When that happens, are you going to leave me, Counselor...?
    ko: 그렇게 되면, 교관은 날 떠날 거야…?
    ja: |-
      そうなったら、
      教官は私から離れていっちゃうの…？
  d_nikke_guilty_mightybunny_04_79:
    speaker: "<Self>"
    en: Guilty...?
    ko: 길티…?
    ja: ギルティ…？
d_nikke_guilty_mightybunny_05:
  d_nikke_guilty_mightybunny_05_1:
    speaker: guilty_b
    en: When I'm finally rehabilitated... When that happens, are you going to leave
      me, Counselor...?
    ko: 내가 완전히 [갱생]하면… 그렇게 되면, 교관은 날 떠날 거야?
    ja: |-
      私が完全に「更生」したら…そうなったら、
      教官は私から離れていっちゃうの…？
  d_nikke_guilty_mightybunny_05_2:
    speaker: "<Monologue>"
    en: Uncertainty flickers in Guilty's eyes.
    ko: 길티의 눈동자가 불안하게 흔들린다.
    ja: ギルティの瞳が不安げに揺らいだ
  d_nikke_guilty_mightybunny_05_3:
    speaker: "<Monologue>"
    en: I immediately reach out and take her hands in mine.
    ko: 곧바로 손을 뻗어 길티의 손을 맞잡았다.
    ja: 手を伸ばし、ギルティの手を握った
  d_nikke_guilty_mightybunny_05_4:
    speaker: guilty_b
    en: Counselor...?
    ko: 교관…?
    ja: 教官…？
  d_nikke_guilty_mightybunny_05_5:
    speaker: "<Self>"
    en: Guilty, there's something I've been wanting to say.
    ko: 길티, 전부터 계속 하고 싶었던 말이 있어.
    ja: |-
      ギルティ、ずっと前から
      言いたかったことがあるんだ
  d_nikke_guilty_mightybunny_05_6:
    speaker: guilty_b
    en: Wh-what is it?
    ko: "…! 뭐, 뭔데에…?"
    ja: "…！な、なぁに…？"
  d_nikke_guilty_mightybunny_05_7:
    speaker: "<Monologue>"
    en: You're not the only one who's changed through your rehabilitation.
    ko: 갱생 활동을 통해 바뀐 건 길티뿐만이 아니다.
    ja: |-
      更生プロセスを通して変わったのは、
      ギルティだけじゃない
  d_nikke_guilty_mightybunny_05_8:
    speaker: "<Self>"
    en: I've learned a lot from you.
    ko: 난 길티에게 많은 걸 배웠어.
    ja: 私はギルティから、たくさんのことを教わった
  d_nikke_guilty_mightybunny_05_9:
    speaker: "<Self>"
    en: You felt lonely when you got caught up in all those rumors at the Rehabilitation
      Center, didn't you?
    ko: 갱생관에서 소문에 휘말렸을 때, 고독했지?
    ja: |-
      更生館でウワサになった時、
      孤独だっただろう？
  d_nikke_guilty_mightybunny_05_10:
    speaker: guilty_b
    en: Yeah...
    ko: "…응."
    ja: "…うん。"
  d_nikke_guilty_mightybunny_05_11:
    speaker: guilty_b
    en: A lot happened in my past...
    ko: 내 과거에는… 아주 여러 일이 있었지만….
    ja: |-
      私の過去には…
      本当に色んなことがあったけど…
  d_nikke_guilty_mightybunny_05_12:
    speaker: guilty_b
    en: Once I'd been branded with that label... it was so hard to move forward...
    ko: "한 번 낙인이 찍힌 상태에서… \n계속 앞으로 나아가는 건 너무 힘든 일이었어…."
    ja: |-
      一度烙印を押されたら…
      前に進み続けるのは、
      とてもつらいことだったわ…
  d_nikke_guilty_mightybunny_05_13:
    speaker: guilty_b
    en: No one would listen to me... or believe me...
    ko: 아무도 내 말을 들어주거나… 믿을 생각이 없으니까….
    ja: |-
      誰も私の話を聞いてくれないし…
      信じようともしてくれなかったから…
  d_nikke_guilty_mightybunny_05_14:
    speaker: guilty_b
    en: They just... feared my strength...
    ko: 그냥 내 힘을… 두려워하거나, 무서워하기만 하니까….
    ja: |-
      ただ私の力を…恐れたり、
      怖がったりするばかりで…
  d_nikke_guilty_mightybunny_05_15:
    speaker: "<Self>"
    en: But there's something even more powerful than the strength to break bones.
      It's the strength to change yourself for someone you care about.
    ko: "뼈를 부수는 괴력보다 더 대단한 건, \n소중한 사람을 위해 자신을 바꾸는 힘이야."
    ja: |-
      骨を砕くほどの怪力よりもすごいのは、
      大切な人のために自分を変える力だ
  d_nikke_guilty_mightybunny_05_16:
    speaker: "<Self>"
    en: That's what you taught me, Guilty.
    ko: 바로 그걸 길티가 내게 알려줬어.
    ja: そのことを、ギルティが私に教えてくれた
  d_nikke_guilty_mightybunny_05_17:
    speaker: "<Self>"
    en: Thank you for doing what I asked. And... thank you for not using your strength
      to test people's trust in you anymore.
    ko: "내 부탁을 들어줘서 고마워. \n힘을 써서 상대의 믿음을 시험하는 행동을… 멈춰줘서 고마워."
    ja: |-
      私の頼みを聞いてくれて礼を言う。
      力を使って相手の信頼を試すようなことを
      やめてくれて、ありがとう
  d_nikke_guilty_mightybunny_05_18:
    speaker: guilty_b
    en: C-Counselor, I...
    ko: 교과안… 정말, 교관은….
    ja: 教官…本当に、教官は…
  d_nikke_guilty_mightybunny_05_19:
    speaker: guilty_b
    en: I didn't know you noticed how hard I've been trying...
    ko: 내가 힘낸 거, 노력한 거, 다 알아주는구나아….
    ja: |-
      私ががんばったことも、努力したことも、
      全部分かってくれてるのねぇ…
  d_nikke_guilty_mightybunny_05_20:
    speaker: "<Self>"
    en: I'm not going anywhere, Guilty.
    ko: 나는 길티를 떠나지 않아.
    ja: 私はギルティから離れたりしない
  d_nikke_guilty_mightybunny_05_21:
    speaker: "<Self>"
    en: Even after you're fully rehabilitated, we'll still keep learning from each
      other.
    ko: 길티가 완전히 갱생해도, 우린 앞으로도 서로에게 더 배워나갈 거야.
    ja: |-
      ギルティが完全に更生しても、
      私たちはこれからも、お互いから
      学び合っていくんだ
  d_nikke_guilty_mightybunny_05_22:
    speaker: guilty_b
    en: O-okay! Even if I'm rehabilitated... even if I change... we'll still be...
      together...!
    ko: |-
      응, 응…! 내가 갱생해도… 바뀌어도,
      교관은, 우리는, 계속 같이… 함께…!
    ja: |-
      うん、うん…！私が更生しても…変わっても、
      教官は、私たちは、ずっと一緒…！
  d_nikke_guilty_mightybunny_05_23:
    speaker: guilty_b
    en: Hehe... hehehe...
    ko: 헤헤… 헤헤헷….
    ja: へへ…えへへっ…
  d_nikke_guilty_mightybunny_05_24:
    speaker: guilty_b
    en: I've never... been so happy that I actually laughed before...
    ko: 이렇게 진심으로 기뻐서 웃음이 나온 적… 처음이야….
    ja: こんなに嬉しくて心から笑ったの…初めて…
  d_nikke_guilty_mightybunny_05_25:
    speaker: guilty_b
    en: "... Hey, Counselor... there's just one last thing... I want you to know."
    ko: "…있지 교과안… 마지막으로 하나 더… 알아줬으면 좋겠는데에."
    ja: |-
      …ねぇ、教官…最後にもう1つだけ…
      分かってほしいことがあるんだけどぉ。
  d_nikke_guilty_mightybunny_05_26:
    speaker: guilty_b
    en: It was... really hard for me to change clothes...
    ko: 나… 갈아입느라 힘들었는데….
    ja: 私…着替えるの大変だったの…
  d_nikke_guilty_mightybunny_05_27:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_guilty_mightybunny_05_28:
    speaker: guilty_b
    en: Getting changed into this was... really hard...
    ko: 이거 갈아입느라 정말… 힘들었으니까아….
    ja: |-
      これに着替えるの、
      本当に…大変だったんだからぁ…
  d_nikke_guilty_mightybunny_05_29:
    speaker: guilty_b
    en: So... it'd really make me happy...
    ko: 교관이… 하나 더… 기뻐해 주면….
    ja: 教官が…もっと…喜んでくれたら…
  d_nikke_guilty_mightybunny_05_30:
    speaker: guilty_b
    en: If you could say "thank you" one more time...
    ko: 교관이 하나 더 고맙다고 말해주면 좋겠다아….
    ja: |-
      教官が、もう1回「ありがとう」って
      言ってくれたら嬉しいなぁ…
  d_nikke_guilty_mightybunny_05_31:
    speaker: "<Narration>"
    en: Guilty steals a glance at the Commander.
    ko: 힐끔.
    ja: ちらっ
  d_nikke_guilty_mightybunny_05_32:
    speaker: "<Self>"
    en: "... Thanks for dressing up as a bunny girl, Guilty."
    ko: "…바니걸이 되어줘서 고마워, 길티."
    ja: |-
      …バニーガールになってくれてありがとう、
      ギルティ
  d_nikke_guilty_mightybunny_05_33:
    speaker: guilty_b
    en: Hehe... any time...
    ko: 후후… 응….
    ja: ふふ…うん…
  d_nikke_guilty_mightybunny_05_34:
    speaker: guilty_b
    en: At first... I wasn't used to this outfit, so it was hard to move around...
    ko: 처음엔… 이 옷, 적응 안 돼서 움직이기 힘들었는데에….
    ja: |-
      最初は…この服、
      慣れなくて動きにくかったんだけどぉ…
  d_nikke_guilty_mightybunny_05_35:
    speaker: guilty_b
    en: But I think I get it now...
    ko: 이제는 알 것 같아.
    ja: 今なら分かる気がするの…
  d_nikke_guilty_mightybunny_05_36:
    speaker: guilty_b
    en: How a bunny girl walks... how she sits...
    ko: 바니걸은 어떻게 걷고… 어떻게 앉는지….
    ja: |-
      バニーガールはどうやって歩いて…
      どうやって座るのか…
  d_nikke_guilty_mightybunny_05_37:
    speaker: guilty_b
    en: How I should come up to you... when I'm your bunny girl...
    ko: 교관의 바니걸이 될 때… 교관 곁에 어떻게 다가가면 되는지이….
    ja: |-
      教官のバニーガールになる時…
      教官のそばにどうやって行くのか…
  d_nikke_guilty_mightybunny_05_38:
    speaker: guilty_b
    en: How I should hug you... Yeah, I think I really get it now...
    ko: 교관을 어떻게 포옹하면 되는지… 이제, 알 것 같아아….
    ja: |-
      どうやって教官を抱きしめればいいのか…
      もう、分かる気がする…
  d_nikke_guilty_mightybunny_05_39:
    speaker: "<Narration>"
    en: Guilty wraps her arms around me from behind.
    ko: 꼬옥.
    ja: ぎゅっ
  d_nikke_guilty_mightybunny_05_40:
    speaker: "<Self>"
    en: You...
    ko: 이건….
    ja: それは…
  d_nikke_guilty_mightybunny_05_41:
    speaker: "<Monologue>"
    en: Her hold is incredibly gentle.
    ko: 아주 약한 힘으로 등 뒤에 길티의 팔이 둘러진다.
    ja: ギルティの腕が背中に回される
  d_nikke_guilty_mightybunny_05_42:
    speaker: guilty_b
    en: Counselor... am I holding you too tightly?
    ko: 교과안… 지금 내 팔 힘… 어때?
    ja: 教官…今の私の力…どう…？
  d_nikke_guilty_mightybunny_05_43:
    speaker: guilty_b
    en: I'm... trying to keep my strength under control...
    ko: 나… 조절해 보고 있어….
    ja: 私…加減してるの…
  d_nikke_guilty_mightybunny_05_44:
    speaker: "<Monologue>"
    en: Guilty steps in front of me and pulls me into a gentle but firm embrace.
    ko: 정면에서 다가온 길티의 팔이 나를 부드럽고도 강하게 감싼다.
    ja: |-
      正面から伸びてきたギルティの腕が、
      私を優しく、そして力強く包み込む
  d_nikke_guilty_mightybunny_05_45:
    speaker: guilty_b
    en: How does it feel, Counselor...? Hmm...? Is this how you like it...?
    ko: 어때 교과안…? 응? 이런 느끼임…?
    ja: どう、教官…？ねぇ、こんな感じ…？
  d_nikke_guilty_mightybunny_05_46:
    speaker: guilty_b
    en: Or... maybe a little more... like this?
    ko: 아니면… 좀 더… 이렇게?
    ja: それとも…もっと…こう…？
  d_nikke_guilty_mightybunny_05_47:
    speaker: guilty_b
    en: If I'm squeezing too tight or you can't breathe... tell me, okay?
    ko: 너무 조이거나 숨 막히면… 말해줘, 알려줘어.
    ja: |-
      きつすぎたり、息苦しかったら…
      言ってちょうだいねぇ…
  d_nikke_guilty_mightybunny_05_48:
    speaker: guilty_b
    en: I want to get to know you better, Counselor...
    ko: 내가 교관을 더 잘 알 수 있게… 알려줘어….
    ja: 教官のこと、私にもっと教えてぇ…
  d_nikke_guilty_mightybunny_05_49:
    speaker: "<Monologue>"
    en: Guilty looks up at me anxiously, searching my face.
    ko: 길티가 내 얼굴을 애타게 올려다본다.
    ja: ギルティは、すがるように私の顔を見上げる
  d_nikke_guilty_mightybunny_05_50:
    speaker: "<Monologue>"
    en: She gauges my reaction from my expression and adjusts the strength of her
      grip accordingly.
    ko: 내 표정을 통해 반응을 가늠하고, 팔힘을 조절한다.
    ja: |-
      私の表情から反応をうかがい、
      腕の力を調節している
  d_nikke_guilty_mightybunny_05_51:
    speaker: "<Self>"
    en: This feels... seriously wrong.
    ko: 이런 느낌은 정말… 유죄….
    ja: これは本当に…有罪だ…
  d_nikke_guilty_mightybunny_05_52:
    speaker: guilty_b
    en: C'mon, it's nothing like that... I'm innocent, hehe...
    ko: 그런 게 어딨어어… 헤헤, 무죄야아….
    ja: そんなことないわぁ…えへへ、無罪よぉ…
  d_nikke_guilty_mightybunny_05_53:
    speaker: guilty_b
    en: Mmm, Counselor...
    ko: 으응, 교과안….
    ja: う～ん、教官…
  d_nikke_guilty_mightybunny_05_54:
    speaker: "<Monologue>"
    en: Guilty nestles into my arms like a child.
    ko: 길티가 어린아이처럼 내게 안겨온다.
    ja: ギルティが子どものように私に抱きついてくる
  d_nikke_guilty_mightybunny_05_55:
    speaker: "<Self>"
    en: I can't match your strength, but...
    ko: 길티의 강력한 힘에는 비할 바가 못 되겠지만….
    ja: |-
      ギルティの力には
      到底かなわないだろうが…
  d_nikke_guilty_mightybunny_05_56:
    speaker: "<Self>"
    en: I can still hug you just as tightly.
    ko: 나도 기세만큼은 그에 지지 않게 꽉 마주 안아줄게.
    ja: |-
      気持ちだけは負けないくらい、
      強く抱きしめ返そう
  d_nikke_guilty_mightybunny_05_57:
    speaker: guilty_b
    en: Hnngh... Mm-hm...!
    ko: "…흐으으. 응…!"
    ja: "…ふうう。うん…！"
  d_nikke_guilty_mightybunny_05_58:
    speaker: guilty_b
    en: I'm so... so happy...!
    ko: 행복해… 행복해애…!
    ja: 幸せ…私、幸せぇ…！
  d_nikke_guilty_mightybunny_05_59:
    speaker: "<Self>"
    en: Me too, Guilty.
    ko: 나도 행복해, 길티.
    ja: 私も幸せだ、ギルティ
  d_nikke_guilty_mightybunny_05_60:
    speaker: "<Narration>"
    en: We stay wrapped in each other's arms.
    ko: 포옥.
    ja: ぎゅっ
  d_nikke_guilty_mightybunny_05_61:
    speaker: "<Monologue>"
    en: Softness surrounds me.
    ko: 온통 부드러운 것이 내 몸을 감싼다.
    ja: 全身が柔らかいものに包まれる
  d_nikke_guilty_mightybunny_05_62:
    speaker: guilty_b
    en: In that cold, dark Rehabilitation Center, I never knew...
    ko: 차갑고 어두운 갱생관에선 전혀 몰랐어….
    ja: |-
      冷たくて暗い更生館じゃ、
      ぜんぜん知らなかった…
  d_nikke_guilty_mightybunny_05_63:
    speaker: guilty_b
    en: that holding hands with someone I like, hugging them close...
    ko: 좋아하는 사람이랑 손을 잡고, 꼬옥 안으면….
    ja: |-
      好きな人と手を繋いで、
      ぎゅって抱きしめると…
  d_nikke_guilty_mightybunny_05_64:
    speaker: guilty_b
    en: could make my body and heart feel so warm... then hotter...
    ko: 그러면… 몸도 마음도 따뜻해지다가… 곧 뜨거워지고….
    ja: |-
      心も体もあったかくなって…
      すぐにアツくなる…
  d_nikke_guilty_mightybunny_05_65:
    speaker: guilty_b
    en: Everything gets all soft... like I'm just going to melt...
    ko: 아주 말랑말랑하게, 녹아내릴 것 같은 느낌이 드는 거야아….
    ja: |-
      すごく柔らかくて、
      とろけちゃいそうな感じ…
  d_nikke_guilty_mightybunny_05_66:
    speaker: guilty_b
    en: If you hadn't helped me through rehab, Counselor... I would've gone my whole
      life without knowing... wouldn't I?
    ko: 교관이 날 갱생시켜주지 않았다면… 평생 몰랐겠지?
    ja: |-
      教官が私を更生させてくれなかったら…
      一生知らなかったかも…
  d_nikke_guilty_mightybunny_05_67:
    speaker: "<Self>"
    en: Happy to help, Guilty.
    ko: 영광이야.
    ja: 光栄だ
  d_nikke_guilty_mightybunny_05_68:
    speaker: guilty_b
    en: Hehe...
    ko: 후후….
    ja: ふふ…
  d_nikke_guilty_mightybunny_05_69:
    speaker: guilty_b
    en: Looks like I learned something new again...
    ko: 방금도 이렇게… 새로 또 하나 배웠네에….
    ja: 今もこうして…新しくまた、学んだわねぇ…
  d_nikke_guilty_mightybunny_05_70:
    speaker: "<Self>"
    en: Seems like it.
    ko: 그러게 말이야.
    ja: そうだな
  d_nikke_guilty_mightybunny_05_71:
    speaker: "<Monologue>"
    en: A sweet moment with the strongest bunny in the world awaits.
    ko: 세상에서 가장 힘이 센 토끼와의 달콤한 시간이 찾아온다.
    ja: |-
      世界で一番力持ちのウサギとの、
      甘い時間が訪れる
  d_nikke_guilty_mightybunny_05_72:
    speaker: guilty_b
    en: Counselor... ♥
    ko: 교과안…♥
    ja: 教官…♥
