---
d_nikke_arcana_fortunemate_01:
  d_nikke_arcana_fortunemate_01_1:
    speaker: "<Narration>"
    en: "*Thunk*"
    ko: 달칵.
    ja: ガサッ…
  d_nikke_arcana_fortunemate_01_2:
    speaker: arcana
    en: Ahh...
    ko: 아….
    ja: あっ…
  d_nikke_arcana_fortunemate_01_3:
    speaker: "<Monologue>"
    en: Arcana pulls a school uniform out of a box.
    ko: 아르카나가 상자에서 교복을 꺼낸다.
    ja: アルカナは箱から制服を取り出した
  d_nikke_arcana_fortunemate_01_4:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_5:
    speaker: "<Monologue>"
    en: |-
      She stares at it with a faraway gaze,
      lost in memories.
    ko: |-
      …그리고 추억에 잠긴,
      아련한 눈빛으로 그것을 바라본다.
    ja: |-
      …そして思い出に浸りながら、
      切なそうに制服を見つめた
  d_nikke_arcana_fortunemate_01_6:
    speaker: arcana
    en: So that's where it was...
    ko: 여기 있었구나….
    ja: ここにあったんだ…
  d_nikke_arcana_fortunemate_01_7:
    speaker: arcana
    en: Hehe. I can't believe this is already just a memory.
    ko: 후후. 이제 이것도 추억이네.
    ja: ふふ。これももう昔のことね。
  d_nikke_arcana_fortunemate_01_8:
    speaker: arcana
    en: It's taking me back.
    ko: "…응응. 기억나."
    ja: "…うん。覚えてる。"
  d_nikke_arcana_fortunemate_01_9:
    speaker: arcana
    en: Walking to school together under the cherry blossoms...
    ko: 같이 벚꽃이 내리는 교정을 거닐고….
    ja: 一緒に桜が舞い散る校庭を歩いて…
  d_nikke_arcana_fortunemate_01_10:
    speaker: arcana
    en: Going to class, hanging out after school...
    ko: 수업을 듣고, 방과 후에 놀러 가고….
    ja: 授業を受けて、放課後に遊びに行って…
  d_nikke_arcana_fortunemate_01_11:
    speaker: arcana
    en: And...
    ko: 그리고….
    ja: それから…
  d_nikke_arcana_fortunemate_01_12:
    speaker: arcana
    en: Having my first kiss under the fireworks on school festival day...
    ko: 축제 날. 불꽃놀이 아래에서 첫키스를 하면서….
    ja: 学祭の日。花火の下でファーストキスをして…
  d_nikke_arcana_fortunemate_01_13:
    speaker: arcana
    en: as we promised each other the future...
    ko: 서로… 미래를 약속했었지….
    ja: "…未来を約束したよね…"
  d_nikke_arcana_fortunemate_01_14:
    speaker: "<Monologue>"
    en: Arcana gently strokes the folds of the uniform.
    ko: 아르카나가 부드럽게 교복의 옷깃을 어루만진다.
    ja: アルカナが優しく制服の襟をなでた
  d_nikke_arcana_fortunemate_01_15:
    speaker: arcana
    en: It'll be our 20th wedding anniversary soon...
    ko: "…그렇네. 마침 곧 20번째 결혼기념일이니까."
    ja: |-
      …そうね。ちょうどもうすぐ
      20回目の結婚記念日だから…
  d_nikke_arcana_fortunemate_01_16:
    speaker: arcana
    en: I need to do something special for him.
    ko: 그이에게 깜짝 이벤트라도 해줘야겠다.
    ja: あの人にサプライズでもしてみようかな。
  d_nikke_arcana_fortunemate_01_17:
    speaker: arcana
    en: Hehe. I wonder if it still fits...
    ko: 후후. 아직 잘 맞으려나 모르겠네….
    ja: ふふ。まだ着れるかしら…
  d_nikke_arcana_fortunemate_01_18:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_19:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_20:
    speaker: "<Self>"
    en: "......"
    ko: "………."
    ja: "………"
  d_nikke_arcana_fortunemate_01_21:
    speaker: arcana
    en: Hehe...
    ko: 후후….
    ja: ふふ…
  d_nikke_arcana_fortunemate_01_22:
    speaker: "<Self>"
    en: Uh, Arcana?
    ko: "…저기, 아르카나?"
    ja: "…アルカナ？"
  d_nikke_arcana_fortunemate_01_23:
    speaker: arcana
    en: Yes?
    ko: 넹.
    ja: はい。
  d_nikke_arcana_fortunemate_01_24:
    speaker: "<Self>"
    en: That's a nice monologue and all, but...
    ko: 그… 상황극을 하는 건 좋은데.
    ja: その…芝居をするのは構わないが、
  d_nikke_arcana_fortunemate_01_25:
    speaker: "<Self>"
    en: do you need some time to get ready or...?
    ko: 마음의 준비를 할 시간이라도 좀….
    ja: せめて心の準備をする時間を…
  d_nikke_arcana_fortunemate_01_26:
    speaker: arcana
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_arcana_fortunemate_01_27:
    speaker: arcana
    en: I sent you a message saying I was on the way.
    ko: 지금 보러 간다고 블라 했잖아요.
    ja: 今から行くってBlaBlaしましたよね。
  d_nikke_arcana_fortunemate_01_28:
    speaker: "<Self>"
    en: |-
      You didn't tell me you'd be putting on a one-woman show
      about a married woman reminiscing about her youth...
    ko: |-
      다짜고짜, 소싯적 추억을 회상하는
      결혼 20년 차 아내 상황극을 한다고는 안 했잖아….
    ja: |-
      若い頃の思い出を振り返る結婚20年目の
      夫婦の設定だとは聞いていないが…
  d_nikke_arcana_fortunemate_01_29:
    speaker: arcana
    en: Oh, right. I guess I forgot that part.
    ko: 아 맞다. 깜빡했네요.
    ja: あ、うっかりしてました。
  d_nikke_arcana_fortunemate_01_30:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_31:
    speaker: arcana
    en: So, what do you think?
    ko: 그래서, 리액션은요?
    ja: それで、どうですか？
  d_nikke_arcana_fortunemate_01_32:
    speaker: "<Self>"
    en: I need a second.
    ko: "…잠깐만 있어봐."
    ja: "…ちょっと待ってくれ"
  d_nikke_arcana_fortunemate_01_33:
    speaker: "<Self>"
    en: That was a lot, so I want to make sure I have it straight.
    ko: 태클 걸 게 한두 개가 아니라서 좀 정리가 필요해.
    ja: |-
      聞きたいことがたくさんあるから
      ちょっと整理したいんだ
  d_nikke_arcana_fortunemate_01_34:
    speaker: arcana
    en: Really? Then I'll lay it out for you.
    ko: 그래요? 그럼 제가 대신 해드림.
    ja: そうなんですか？では、私が代わりに。
  d_nikke_arcana_fortunemate_01_35:
    speaker: "<Monologue>"
    en: Arcana holds up her pointer finger.
    ko: 아르카나가 처억 검지를 세웠다.
    ja: アルカナは人差し指を立てた
  d_nikke_arcana_fortunemate_01_36:
    speaker: arcana
    en: First, people normally reminisce when they're alone,
    ko: 첫 번째. 이렇게 추억에 잠기는 건 보통 혼자 있을 때 하는 건데,
    ja: |-
      1つ目。思い出に浸るなら
      ひとりで浸ればいいのに
  d_nikke_arcana_fortunemate_01_37:
    speaker: arcana
    en: so why did I bring all this stuff and do it here?
    ko: 왜 여기까지 들고 와서 했는가.
    ja: どうしてここに来たのか。
  d_nikke_arcana_fortunemate_01_38:
    speaker: "<Self>"
    en: Yep, that's my first question.
    ko: 음. 그렇지.
    ja: ああ、まあそうだな
  d_nikke_arcana_fortunemate_01_39:
    speaker: arcana
    en: Well, that's because...
    ko: 그건…!
    ja: それは…！
  d_nikke_arcana_fortunemate_01_40:
    speaker: arcana
    en: |-
      I missed you.
      Next!
    ko: |-
      그쪽 보고 싶었으니까.
      다음!
    ja: |-
      あなたに会いたかったからです。
      はい、次！
  d_nikke_arcana_fortunemate_01_41:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_42:
    speaker: arcana
    en: |-
      Question number two.
      Why did I choose to put on this act in particular?
    ko: |-
      다음 두 번째.
      왜 하필 이런 상황극인가.
    ja: |-
      2つ目。
      なぜよりによって、こんなお芝居なのか。
  d_nikke_arcana_fortunemate_01_43:
    speaker: "<Self>"
    en: Yeah, that too.
    ko: 그래. 그것도 궁금해.
    ja: ああ、それも気になるな
  d_nikke_arcana_fortunemate_01_44:
    speaker: arcana
    en: |-
      I have my reasons.
      Next!
    ko: |-
      그건 따로 이유가 있어요.
      다음!
    ja: |-
      ちゃんとした理由があるんです。
      はい、次！
  d_nikke_arcana_fortunemate_01_45:
    speaker: "<Self>"
    en: Hang on...
    ko: 아니….
    ja: そんな…
  d_nikke_arcana_fortunemate_01_46:
    speaker: arcana
    en: Third... Um...
    ko: 그리고 세 번째는… 음….
    ja: えっと3つ目は…うーん…
  d_nikke_arcana_fortunemate_01_47:
    speaker: arcana
    en: I can't think of anything. Never mind.
    ko: 에이. 생각 안 난다. 패스.
    ja: 思いつかないので、ここまで。
  d_nikke_arcana_fortunemate_01_48:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_49:
    speaker: arcana
    en: So go wash up. We're going out.
    ko: 그럼 얼른 씻어요. 나가게.
    ja: 早くシャワー浴びてください。出かけましょ。
  d_nikke_arcana_fortunemate_01_50:
    speaker: arcana
    en: I'll change in the meantime.
    ko: 저도 그사이에 갈아입을게요.
    ja: 私もその間に着替えますね。
  d_nikke_arcana_fortunemate_01_51:
    speaker: "<Self>"
    en: Change?
    ko: 갈아입는다고?
    ja: 着替える？
  d_nikke_arcana_fortunemate_01_52:
    speaker: arcana
    en: Yeah. I have to wear my school uniform today.
    ko: 응응. 오늘 교복 입어야 되거든요.
    ja: 今日は制服を着ないとなので。
  d_nikke_arcana_fortunemate_01_53:
    speaker: "<Self>"
    en: Why?
    ko: 왜?
    ja: なぜだ？
  d_nikke_arcana_fortunemate_01_54:
    speaker: arcana
    en: That's a secret.
    ko: 비밀.
    ja: ヒミツです。
  d_nikke_arcana_fortunemate_01_55:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_56:
    speaker: arcana
    en: Hurry! Chop chop!
    ko: 자자. 빨리요~
    ja: ほらほら、早く～
  d_nikke_arcana_fortunemate_01_57:
    speaker: "<Monologue>"
    en: Arcana pushes me toward the bathroom.
    ko: 아르카나가 나를 욕실로 밀어 넣는다.
    ja: アルカナは私を浴室へ押し込んだ
  d_nikke_arcana_fortunemate_01_58:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_59:
    speaker: "<Monologue>"
    en: Before I start washing up, I listen outside the door.
    ko: "…씻으려다, 바깥에 귀를 기울인다."
    ja: |-
      …シャワーを浴びようとしたが、
      外の音に耳を傾けた
  d_nikke_arcana_fortunemate_01_60:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_61:
    speaker: "<Choice>"
    en: Take a peek.
    ko: "…살짝 엿본다."
    ja: "…こっそりのぞき見をする"
  d_nikke_arcana_fortunemate_01_62:
    speaker: "<Choice>"
    en: Be good and finish washing.
    ko: 얌전히 씻는다.
    ja: おとなしくシャワーを浴びる
  d_nikke_arcana_fortunemate_01_63:
    speaker: "<Monologue>"
    en: I hold my breath and without making a sound, go to the door and—
    ko: 숨을 죽이고, 소리 나지 않게 샤워실 문을….
    ja: 息を潜め、音を立てずにシャワー室の扉を…
  d_nikke_arcana_fortunemate_01_64:
    speaker: arcana
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_65:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_66:
    speaker: arcana
    en: Are you peeking?
    ko: 엿보려구요?
    ja: のぞきですか？
  d_nikke_arcana_fortunemate_01_67:
    speaker: "<Self>"
    en: Er... yes...
    ko: "…으, 응."
    ja: "…あ、ああ"
  d_nikke_arcana_fortunemate_01_68:
    speaker: arcana
    en: Well, you opened the door too quickly.
    ko: 그러기엔 너무 일찍 열었잖아요~
    ja: それなら、ちょっと早すぎましたね～
  d_nikke_arcana_fortunemate_01_69:
    speaker: arcana
    en: I haven't even undone my zipper.
    ko: 아직 지퍼도 다 안 내렸을 시간인데.
    ja: まだチャックも下ろしてないのに。
  d_nikke_arcana_fortunemate_01_70:
    speaker: "<Self>"
    en: "... Then should I open it again in a bit?"
    ko: "…잠깐 있다가 다시 열까?"
    ja: "…もう少し経ってからもう一度開けようか？"
  d_nikke_arcana_fortunemate_01_71:
    speaker: arcana
    en: Hehe, no. Keep washing up.
    ko: 후후. 아뇨. 지금은 얌전히 씻어요.
    ja: |-
      ふふ、いいえ。
      今はおとなしくシャワーを浴びてください。
  d_nikke_arcana_fortunemate_01_72:
    speaker: "<Monologue>"
    en: Arcana closes the door with a smile.
    ko: 아르카나가 웃으며 문을 닫는다.
    ja: アルカナは笑顔で扉を閉めた
  d_nikke_arcana_fortunemate_01_73:
    speaker: arcana
    en: I'll let you take a good look later!
    ko: 나중에 마음껏 보게 해줄게요~
    ja: 今度好きなだけ見せてあげますね～
  d_nikke_arcana_fortunemate_01_74:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_75:
    speaker: "<Monologue>"
    en: |-
      I start taking off my clothes to shower
      when I hear Arcana's voice.
    ko: |-
      샤워를 하기 위해 옷을 벗으려는데,
      아르카나의 목소리가 들린다.
    ja: |-
      シャワーを浴びるために服を脱ごうとしたが、
      アルカナの声が聞こえてきた
  d_nikke_arcana_fortunemate_01_76:
    speaker: arcana
    en: No peeking!
    ko: 엿보면 안 돼요~
    ja: のぞきはダメですよ～
  d_nikke_arcana_fortunemate_01_77:
    speaker: "<Self>"
    en: I'm not.
    ko: "…안 봐."
    ja: "…そんなつもりはない"
  d_nikke_arcana_fortunemate_01_78:
    speaker: arcana
    en: Really?
    ko: 진짜요?
    ja: 本当に？
  d_nikke_arcana_fortunemate_01_79:
    speaker: arcana
    en: I only have my underwear on!
    ko: 저 지금 속옷만 입고 있는데~
    ja: 今、下着だけなんですけど～
  d_nikke_arcana_fortunemate_01_80:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_81:
    speaker: arcana
    en: You could at least take a little peek.
    ko: 조금 정도는 봐도 괜찮아요~
    ja: 少しくらいは見てもいいですよ～
  d_nikke_arcana_fortunemate_01_82:
    speaker: arcana
    en: Oh, I'm going to change my underwear too,
    ko: 아. 저 속옷도 딴 걸로 갈아입을 거라,
    ja: あ。下着も着替えるので、
  d_nikke_arcana_fortunemate_01_83:
    speaker: arcana
    en: so I'll have to take it all—
    ko: 이제 전부 벗을….
    ja: 全部脱ぎ…
  d_nikke_arcana_fortunemate_01_84:
    speaker: "<Self>"
    en: I said, I'm not looking!
    ko: 안 본다니까…!
    ja: だから、見るつもりはない…！
  d_nikke_arcana_fortunemate_01_85:
    speaker: arcana
    en: Ahahaha.
    ko: 아하하하.
    ja: あはははっ。
  d_nikke_arcana_fortunemate_01_86:
    speaker: "<Monologue>"
    en: |-
      By the time I finish taking a quick shower,
      Arcana has already changed clothes.
    ko: |-
      간단히 샤워를 마치고 나오자,
      아르카나는 이미 옷을 갈아입은 채였다.
    ja: |-
      簡単にシャワーを浴びて出ると、
      アルカナはすでに着替えを終えていた
  d_nikke_arcana_fortunemate_01_87:
    speaker: arcana_s
    en: What do you think?
    ko: 어때요?
    ja: どうです？
  d_nikke_arcana_fortunemate_01_88:
    speaker: "<Self>"
    en: It's been so long since I've seen you dressed like that.
    ko: 되게 오랜만에 보네, 그 차림.
    ja: 久しぶりに見るな
  d_nikke_arcana_fortunemate_01_89:
    speaker: arcana_s
    en: Right! How do I look? Just as beautiful as ever?
    ko: 그쵸! 어때요? 여전히 예뻐요?
    ja: |-
      ですよね！どうですか？
      やっぱりかわいいでしょう？
  d_nikke_arcana_fortunemate_01_90:
    speaker: "<Self>"
    en: Yeah, you look great.
    ko: 응. 엄청 예뻐.
    ja: ああ、すごくかわいい
  d_nikke_arcana_fortunemate_01_91:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_92:
    speaker: arcana_s
    en: I like you.
    ko: 좋아해요.
    ja: 好きです。
  d_nikke_arcana_fortunemate_01_93:
    speaker: "<Self>"
    en: I like you too.
    ko: 나도 좋아해.
    ja: 私も好きだ
  d_nikke_arcana_fortunemate_01_94:
    speaker: "<Monologue>"
    en: Arcana runs up to me and throws her arms around me.
    ko: 아르카나가 달려와 포옥 안겨들었다.
    ja: アルカナが胸に飛び込んできた
  d_nikke_arcana_fortunemate_01_95:
    speaker: "<Self>"
    en: Are we going to do something special now that you have your uniform on?
    ko: 교복 입어주는 이벤트 같은 거야?
    ja: 制服を着てくれるイベントのようなものなのか？
  d_nikke_arcana_fortunemate_01_96:
    speaker: arcana_s
    en: Mm... Sort of, but not yet.
    ko: 음… 비슷하기는 한데, 아직은 아니에요.
    ja: うーん…似たようなものですが、まだ違います。
  d_nikke_arcana_fortunemate_01_97:
    speaker: "<Self>"
    en: Not yet?
    ko: 아직은?
    ja: まだ？
  d_nikke_arcana_fortunemate_01_98:
    speaker: arcana_s
    en: You want to have some fun in the middle of the day?
    ko: 대낮부터 그러려구요?
    ja: 真っ昼間から始めるつもりですか？
  d_nikke_arcana_fortunemate_01_99:
    speaker: arcana_s
    en: If you do that after 20 years of marriage, people will think you're a horndog.
    ko: 결혼 20년차에 그러면 남들이 흉봐요~
    ja: |-
      結婚20年目でそれだと、
      周りから白い目で見られますよ～
  d_nikke_arcana_fortunemate_01_100:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_01_101:
    speaker: arcana_s
    en: Hehe.
    ko: 헤헷.
    ja: えへっ。
  d_nikke_arcana_fortunemate_01_102:
    speaker: "<Monologue>"
    en: Arcana links her elbow in mine.
    ko: 아르카나가 내게 팔짱을 끼웠다.
    ja: アルカナは私に腕を絡めた
  d_nikke_arcana_fortunemate_01_103:
    speaker: arcana_s
    en: Let's hurry.
    ko: 그럼 빨리 나가요.
    ja: じゃあ、早く行きましょ。
  d_nikke_arcana_fortunemate_01_104:
    speaker: arcana_s
    en: Don't worry. I dropped the kids off at your parent's.
    ko: 애들은 시댁에 맡겨 놨으니까 걱정 말구.
    ja: |-
      子どもたちはあなたの実家に預けたから
      安心してください。
  d_nikke_arcana_fortunemate_01_105:
    speaker: "<Self>"
    en: If we've been married 20 years, the kids can probably take care of themselves.
    ko: 결혼 20주년 정도면 큰애는 알아서 있겠지.
    ja: 結婚20年目なら、1人でも大丈夫じゃないか？
  d_nikke_arcana_fortunemate_01_106:
    speaker: arcana_s
    en: Pfft. You're right. They're probably all grown up.
    ko: 풋. 그렇네요. 성인일 수도 있겠구~
    ja: ふふっ。そうですね。もう成人してるかも？
  d_nikke_arcana_fortunemate_01_107:
    speaker: "<Self>"
    en: Oh, right.
    ko: 아, 맞다.
    ja: あ、そうだ
  d_nikke_arcana_fortunemate_01_108:
    speaker: "<Monologue>"
    en: I put a hand in my pocket.
    ko: 안주머니에 손을 넣는다.
    ja: 私は内ポケットに手を入れた
  d_nikke_arcana_fortunemate_01_109:
    speaker: "<Monologue>"
    en: I pull out a slightly worn...
    ko: 모서리가 조금씩 닳기 시작한,
    ja: 角が少し折れ曲がった、
  d_nikke_arcana_fortunemate_01_110:
    speaker: "<Monologue>"
    en: "... Wheel of Fortune card with a note attached."
    ko: 메모지가 붙은 [운명의 수레바퀴] 카드를 꺼낸다.
    ja: |-
      付せんがついている
      「運命の輪」のカードを取り出した
  d_nikke_arcana_fortunemate_01_111:
    speaker: "<Self>"
    en: Sorry. It's starting to tear.
    ko: 미안. 이제 슬슬 닳는 것 같은데.
    ja: すまない。ボロボロになってきたな
  d_nikke_arcana_fortunemate_01_112:
    speaker: "<Self>"
    en: Maybe I should laminate it.
    ko: 코팅이라도 할까?
    ja: ラミネート加工でもしようか？
  d_nikke_arcana_fortunemate_01_113:
    speaker: arcana_s
    en: No. I like it like this.
    ko: "…아뇨. 오히려 좋아요."
    ja: "…いいえ。むしろ嬉しいです。"
  d_nikke_arcana_fortunemate_01_114:
    speaker: "<Monologue>"
    en: Arcana takes the card and holds it endearingly to her chest.
    ko: 아르카나가 카드를 받아 들고, 품에 소중히 끌어안는다.
    ja: |-
      アルカナはカードを受け取り、
      大切そうに抱き寄せた
  d_nikke_arcana_fortunemate_01_115:
    speaker: arcana_s
    en: It feels like it holds all the time we've spent together.
    ko: "…우리가 함께한 시간이, 담겨 있는 것 같아서."
    ja: |-
      …私たちが一緒に過ごした時間が
      感じられる気がして。
d_nikke_arcana_fortunemate_02:
  d_nikke_arcana_fortunemate_02_1:
    speaker: "<Self>"
    en: So...
    ko: 그래서.
    ja: それで…
  d_nikke_arcana_fortunemate_02_2:
    speaker: arcana_s
    en: Hm?
    ko: 응응.
    ja: はいっ。
  d_nikke_arcana_fortunemate_02_3:
    speaker: "<Monologue>"
    en: Arcana holds my hand as she walks, a pep in her step.
    ko: 아르카나가 내 손을 잡고 경쾌하게 걷는다.
    ja: アルカナは私の手を握って軽快に歩いている
  d_nikke_arcana_fortunemate_02_4:
    speaker: "<Self>"
    en: Where are we going today?
    ko: 오늘은 어디 갈 거야?
    ja: 今日はどこに行くんだ？
  d_nikke_arcana_fortunemate_02_5:
    speaker: "<Self>"
    en: You always decide what we're going to do beforehand.
    ko: 항상 아르카나가 뭐 할지 미리 정해놨었잖아.
    ja: 予定はいつもアルカナが決めているだろう？
  d_nikke_arcana_fortunemate_02_6:
    speaker: arcana_s
    en: Yep! And naturally, I already broke down every second of the day.
    ko: 그쵸. 당연히 오늘도 할 거 초 단위로 정해져 있어요.
    ja: |-
      そうですね。
      もちろん今日も秒単位で決めてあります。
  d_nikke_arcana_fortunemate_02_7:
    speaker: arcana_s
    en: Oh! Now's the time for us to link arms!
    ko: 앗! 지금은 팔짱 낄 시간!
    ja: あっ！今は腕を組む時間！
  d_nikke_arcana_fortunemate_02_8:
    speaker: "<Monologue>"
    en: Arcana links her arm in mine.
    ko: 아르카나가 팔짱을 끼운다.
    ja: アルカナが私に腕を絡めた
  d_nikke_arcana_fortunemate_02_9:
    speaker: "<Self>"
    en: Every single second...?
    ko: 초 단위 일정이라….
    ja: 秒単位か…
  d_nikke_arcana_fortunemate_02_10:
    speaker: arcana_s
    en: Why not? Oh! Time to step with our left feet!
    ko: 왜요? 앗! 지금은 왼발을 내밀 시간!
    ja: |-
      それが何か？
      あっ！今は左足を前に出す時間！
  d_nikke_arcana_fortunemate_02_11:
    speaker: "<Self>"
    en: It just doesn't seem like something you'd do.
    ko: 진짜 아르카나랑 정반대에 있는 말이라서.
    ja: 君からは想像できない単語だな
  d_nikke_arcana_fortunemate_02_12:
    speaker: arcana_s
    en: No, it's not! I plan everything down to the second because I'm—
    ko: 아닌데요?? 저 완전 초 단위로 일하는-
    ja: ええっ？私は完璧に秒単位でお仕事をする――
  d_nikke_arcana_fortunemate_02_13:
    speaker: "<Self>"
    en: A cold, ruthless femme fatale?
    ko: 냉정냉혹 프로페셔널 직장인?
    ja: |-
      クールでスマートで
      プロフェッショナルな社会人？
  d_nikke_arcana_fortunemate_02_14:
    speaker: arcana_s
    en: Exactly.
    ko: 그쵸그쵸.
    ja: そうです。
  d_nikke_arcana_fortunemate_02_15:
    speaker: arcana_s
    en: Oh! And now!
    ko: 앗! 지금은!
    ja: あっ！今は！
  d_nikke_arcana_fortunemate_02_16:
    speaker: arcana_s
    en: Wait here.
    ko: 잠깐만 있어 봐요.
    ja: ちょっと待っててください。
  d_nikke_arcana_fortunemate_02_17:
    speaker: "<Monologue>"
    en: Arcana goes into a nearby store...
    ko: 아르카나가 근처 가게로 들어갔다가,
    ja: アルカナは近くの店に入り、
  d_nikke_arcana_fortunemate_02_18:
    speaker: "<Monologue>"
    en: "... and comes out carrying a bag stuffed with sketchbooks and crayons."
    ko: 스케치북과 색연필이 한가득 담긴 봉투를 들고나온다.
    ja: |-
      スケッチブックとクレヨンが入っている
      袋を持って出てきた
  d_nikke_arcana_fortunemate_02_19:
    speaker: "<Self>"
    en: What's that?
    ko: 그건 뭐야?
    ja: それは？
  d_nikke_arcana_fortunemate_02_20:
    speaker: arcana_s
    en: We need these today.
    ko: 오늘 써야 해서요.
    ja: 今日使うんです。
  d_nikke_arcana_fortunemate_02_21:
    speaker: "<Self>"
    en: "...?"
    ko: "…??"
    ja: "…？？"
  d_nikke_arcana_fortunemate_02_22:
    speaker: arcana_s
    en: Hehe. Let's get going. We don't want to be late.
    ko: 후후. 일단 가요. 늦겠다.
    ja: |-
      ふふ、とりあえず行きましょう。
      遅れちゃいますよ～
  d_nikke_arcana_fortunemate_02_23:
    speaker: "<Monologue>"
    en: A while later, Arcana leads me to our destination.
    ko: 잠시 후. 아르카나가 나를 끌고 도착한 곳은….
    ja: |-
      しばらくして
      アルカナが私を連れて到着した場所は…
  d_nikke_arcana_fortunemate_02_24:
    speaker: "<Self>"
    en: Big Dreams Kindergarten...?
    ko: "[꿈동산 어린이집]…?"
    ja: "「夢の丘保育園」…？"
  d_nikke_arcana_fortunemate_02_25:
    speaker: arcana_s
    en: Yep. This is the place.
    ko: 응. 오늘은 여기.
    ja: うん。今日はここ。
  d_nikke_arcana_fortunemate_02_26:
    speaker: "<Self>"
    en: What are we doing here?
    ko: 여기서… 뭐 하는데?
    ja: ここで…何をするんだ？
  d_nikke_arcana_fortunemate_02_27:
    speaker: arcana_s
    en: What else? Looking after the kids, of course!
    ko: 뭐 하긴요. 애기들 봐주는 거죠.
    ja: 決まってるでしょう？子どもたちのお世話です。
  d_nikke_arcana_fortunemate_02_28:
    speaker: "<Monologue>"
    en: Arcana opens the door and steps inside, and the children look at her.
    ko: 아르카나가 문을 열고 들어가자, 아이들의 시선이 집중된다.
    ja: |-
      アルカナがドアを開けて中に入ると、
      子どもたちの視線が集中した
  d_nikke_arcana_fortunemate_02_29:
    speaker: adultlikefemalechild
    en: Oh.
    ko: 앗.
    ja: あっ。
  d_nikke_arcana_fortunemate_02_30:
    speaker: twintailsfemalechild
    en: The pretty lady's here!
    ko: 예쁜 언니 왔다!
    ja: きれいなお姉ちゃんだ！
  d_nikke_arcana_fortunemate_02_31:
    speaker: arcana_s
    en: Hi! It's me, the pretty lady.
    ko: 안녕~ 예쁜 언니 왔어요~
    ja: こんにちは～きれいなお姉ちゃんですよ～
  d_nikke_arcana_fortunemate_02_32:
    speaker: "<Monologue>"
    en: The children start to gather around her until they see me and freeze.
    ko: 몰려들던 아이들이 뒤에 있는 나를 보고 멈칫한다.
    ja: |-
      駆け寄ってきた子どもたちが、
      後ろにいる私を見て動きを止めた
  d_nikke_arcana_fortunemate_02_33:
    speaker: adultlikefemalechild
    en: Who's that?
    ko: "…누구에요?"
    ja: "…だぁれ？"
  d_nikke_arcana_fortunemate_02_34:
    speaker: arcana_s
    en: He's my boyfriend! Isn't he handsome?
    ko: 언니 남자친구에요~ 멋있죠?
    ja: お姉ちゃんの彼氏ですよ～カッコイイでしょ？
  d_nikke_arcana_fortunemate_02_35:
    speaker: twintailsfemalechild
    en: Huh...?
    ko: 헤에….
    ja: へぇ…
  d_nikke_arcana_fortunemate_02_36:
    speaker: "<Monologue>"
    en: A girl with pigtails looks up at me with wide, bright eyes.
    ko: 양갈래머리를 한 아이가 나를 호기심 가득한 눈으로 올려다본다.
    ja: |-
      ツインテールの女の子が、
      好奇心に満ちた視線を私に向けている
  d_nikke_arcana_fortunemate_02_37:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: そして…
  d_nikke_arcana_fortunemate_02_38:
    speaker: "<Narration>"
    en: "*Plop*"
    ko: 털썩.
    ja: ドサッ
  d_nikke_arcana_fortunemate_02_39:
    speaker: despairingmalechild
    en: Ah, ahhh...
    ko: 아, 아아….
    ja: あ、ああ…
  d_nikke_arcana_fortunemate_02_40:
    speaker: adultlikemalechild
    en: |-
      It's okay.
      This is how life goes.
    ko: |-
      …괜찮아.
      살다 보면 이럴 때도 있는 거야.
    ja: |-
      …大丈夫。
      生きていれば、そういうこともあるさ。
  d_nikke_arcana_fortunemate_02_41:
    speaker: adultlikemalechild
    en: Have a juice box and move on.
    ko: 요구르트 한잔하고 잊어버려.
    ja: ジュースを飲んで忘れちまいな。
  d_nikke_arcana_fortunemate_02_42:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_02_43:
    speaker: "<Monologue>"
    en: In the back, a boy falls to the ground with a look of despair,
    ko: 뒤쪽에선 어떤 남자아이가 절망적인 얼굴로 쓰러져 있고,
    ja: |-
      後ろの方では、男の子が
      ショックを受けた様子で倒れており、
  d_nikke_arcana_fortunemate_02_44:
    speaker: "<Monologue>"
    en: and another boy who looks like his friend pats his back.
    ko: 친구로 보이는 아이가 실연의 아픔을 위로해 주고 있다….
    ja: |-
      友人らしき男の子が
      失恋の悲しみを慰めている…
  d_nikke_arcana_fortunemate_02_45:
    speaker: adultlikefemalechild
    en: Are you gonna make a picture diary too, Mr. Boyfriend?
    ko: 아저씨도 그림일기 해요?
    ja: おじさんも絵日記描くの？
  d_nikke_arcana_fortunemate_02_46:
    speaker: "<Choice>"
    en: A picture diary?
    ko: 그림일기?
    ja: 絵日記？
  d_nikke_arcana_fortunemate_02_47:
    speaker: "<Choice>"
    en: Mr. Boyfriend...?
    ko: 아, 아저씨….
    ja: お、おじさん…
  d_nikke_arcana_fortunemate_02_48:
    speaker: arcana_s
    en: Pfft...
    ko: 푸흡.
    ja: ふふっ。
  d_nikke_arcana_fortunemate_02_49:
    speaker: arcana_s
    en: You can call him Mr. @UserName.
    ko: 아저씨가 아니라 오빠.
    ja: おじさんじゃなくて、お兄ちゃん。
  d_nikke_arcana_fortunemate_02_50:
    speaker: adultlikefemalechild
    en: Hmm...
    ko: 으음….
    ja: うーん…
  d_nikke_arcana_fortunemate_02_51:
    speaker: "<Monologue>"
    en: The girl's eyes narrow at me in suspicion.
    ko: 여자아이가 나를 미심쩍은 얼굴로 올려다본다….
    ja: 女の子は疑わしそうな顔で私を見つめている…
  d_nikke_arcana_fortunemate_02_52:
    speaker: "<Self>"
    en: So what's a picture diary?
    ko: "…그런데 그림일기는 뭐야?"
    ja: "…絵日記って？"
  d_nikke_arcana_fortunemate_02_53:
    speaker: arcana_s
    en: I promised I'd make one with them today.
    ko: 오늘은 같이 그림일기 쓰기로 했거든요.
    ja: |-
      今日は一緒に絵日記を
      描くことになってるんです。
  d_nikke_arcana_fortunemate_02_54:
    speaker: "<Self>"
    en: Is that why you bought all that stuff?
    ko: 그래서 아까 그런 거 샀구나?
    ja: それでさっき道具を？
  d_nikke_arcana_fortunemate_02_55:
    speaker: arcana_s
    en: Yep.
    ko: 응응.
    ja: ですです。
  d_nikke_arcana_fortunemate_02_56:
    speaker: arcana_s
    en: But first, why don't we have a snack?
    ko: 자자. 우리 간식부터 먹을까요~
    ja: さっ。まずはおやつの時間ですよ～
  d_nikke_arcana_fortunemate_02_57:
    speaker: twintailsfemalechild
    en: Ice cream!
    ko: 아이스크림!
    ja: アイスクリーム！
  d_nikke_arcana_fortunemate_02_58:
    speaker: arcana_s
    en: We can have ice cream later.
    ko: 아이스크림은 이따가~
    ja: アイスはあとでね～
  d_nikke_arcana_fortunemate_02_59:
    speaker: "<Monologue>"
    en: As Arcana hands out cookies, a woman approaches her.
    ko: 쿠키를 나눠주는 아르카나에게 한 여성이 다가온다.
    ja: |-
      クッキーを配っていたアルカナの元へ、
      1人の女性がやってきた
  d_nikke_arcana_fortunemate_02_60:
    speaker: kindergartenfemaleteacher
    en: Hello.
    ko: 안녕하세요. 선생님.
    ja: こんにちは、先生。
  d_nikke_arcana_fortunemate_02_61:
    speaker: arcana_s
    en: Hi!
    ko: 안녕하세요~
    ja: こんにちは～
  d_nikke_arcana_fortunemate_02_62:
    speaker: kindergartenfemaleteacher
    en: Is this...?
    ko: 이쪽은 혹시…?
    ja: こちらの方は、もしや…？
  d_nikke_arcana_fortunemate_02_63:
    speaker: arcana_s
    en: He's my boyfriend! The one I mentioned before.
    ko: 저번에 말한 남자친구에요.
    ja: この間話した、彼氏です。
  d_nikke_arcana_fortunemate_02_64:
    speaker: arcana_s
    en: He's handsome, isn't he? And cool!
    ko: 잘생겼죠. 멋있죠!
    ja: カッコイイでしょう？素敵でしょう？
  d_nikke_arcana_fortunemate_02_65:
    speaker: kindergartenfemaleteacher
    en: Ah...!
    ko: 아…!
    ja: あっ…！
  d_nikke_arcana_fortunemate_02_66:
    speaker: kindergartenfemaleteacher
    en: Thank you for tagging along.
    ko: 같이 와주셔서 감사해요.
    ja: 来てくださって、ありがとうございます。
  d_nikke_arcana_fortunemate_02_67:
    speaker: kindergartenfemaleteacher
    en: I wish I had more time to talk, but I have to run...
    ko: 제대로 인사드려야 하는데, 시간이….
    ja: |-
      きちんとご挨拶したいのですが、
      予定の時間が差し迫っておりまして…
  d_nikke_arcana_fortunemate_02_68:
    speaker: arcana_s
    en: That's okay. He won't mind.
    ko: 괜찮아요. 이 사람 되게 쿨해서.
    ja: 大丈夫ですよ。この人、心が広いので。
  d_nikke_arcana_fortunemate_02_69:
    speaker: arcana_s
    en: I'll explain everything.
    ko: 제가 잘 설명할게요.
    ja: 私から説明しておきますね。
  d_nikke_arcana_fortunemate_02_70:
    speaker: kindergartenfemaleteacher
    en: Thank you. Bye, then.
    ko: 감사합니다. 그럼….
    ja: ありがとうございます。では…
  d_nikke_arcana_fortunemate_02_71:
    speaker: "<Monologue>"
    en: The woman who looks like a teacher waves and leaves the kindergarten.
    ko: 선생님으로 보이는 사람들이 내게 꾸벅 인사하며 어린이집을 나간다.
    ja: |-
      先生らしき人々が、
      私に頭を下げて保育園を後にした
  d_nikke_arcana_fortunemate_02_72:
    speaker: "<Self>"
    en: Are the teachers leaving?
    ko: 선생님들은 가는 거야?
    ja: 先生たちはどこかへ行くのか？
  d_nikke_arcana_fortunemate_02_73:
    speaker: arcana_s
    en: The teachers here have training once a month,
    ko: 여기 선생님들 매달 한번씩 교육 받으러 가셔야 하는데,
    ja: 毎月1回、研修があるんです。
  d_nikke_arcana_fortunemate_02_74:
    speaker: arcana_s
    en: but they don't have enough workers, so it's hard for them to do it in shifts.
    ko: 인원이 부족해서 로테이션을 돌리기 힘들다고 하더라구요.
    ja: でも人手が足りなくて、困っていたみたいで。
  d_nikke_arcana_fortunemate_02_75:
    speaker: "<Self>"
    en: Is that why you're looking after the kids?
    ko: 그래서 대신 봐주는 거고?
    ja: それで代わりに？
  d_nikke_arcana_fortunemate_02_76:
    speaker: arcana_s
    en: Yep.
    ko: 응응.
    ja: ですです。
  d_nikke_arcana_fortunemate_02_77:
    speaker: arcana_s
    en: I take them for a day so the teachers can do their training.
    ko: 제가 하루 봐주고, 그날 전부 가서 교육받고 오시는 거.
    ja: |-
      私が1日お世話して、その日に全員で
      研修を受けてもらうことにしたんです。
  d_nikke_arcana_fortunemate_02_78:
    speaker: "<Monologue>"
    en: Arcana shows me a picture on her phone.
    ko: 아르카나가 핸드폰으로 사진을 보여준다.
    ja: アルカナが携帯電話の写真を見せてきた
  d_nikke_arcana_fortunemate_02_79:
    speaker: arcana_s
    en: I just got certified, too!
    ko: 나도 얼마 전에 자격증 땄지롱.
    ja: 私もこの間、資格を取ったんですよ。
  d_nikke_arcana_fortunemate_02_80:
    speaker: "<Self>"
    en: Wow.
    ko: 오….
    ja: おお…
  d_nikke_arcana_fortunemate_02_81:
    speaker: "<Monologue>"
    en: |-
      Arcana shows me a document that says Certified Kindergarten Teacher
      with her picture and name on it.
    ko: |-
      [보육교사 자격증]이라는 문서에,
      아르카나의 사진과 함께 이름이 적혀 있다.
    ja: |-
      「保育士試験合格通知書」という書類に
      アルカナの写真と名前が載っていた
  d_nikke_arcana_fortunemate_02_82:
    speaker: "<Self>"
    en: You look really professional in your ID photo.
    ko: 그래도 증명사진은 얌전히 찍는구나?
    ja: 証明写真はおとなしいんだな
  d_nikke_arcana_fortunemate_02_83:
    speaker: arcana_s
    en: I tried to use a cute picture, but they denied it.
    ko: 포즈 취한거 냈다가 반려당했어요.
    ja: |-
      ポーズを決めたんですけど、
      その写真は却下されちゃいました。
  d_nikke_arcana_fortunemate_02_84:
    speaker: twintailsfemalechild
    en: Ms. Arcana! What are we doing today?
    ko: 언니! 오늘은 뭐 해요?
    ja: お姉ちゃん！今日は何するの？
  d_nikke_arcana_fortunemate_02_85:
    speaker: adultlikefemalechild
    en: We hafta do our picture diary.
    ko: 그림일기 해야 돼.
    ja: 絵日記を書こう～
  d_nikke_arcana_fortunemate_02_86:
    speaker: twintailsfemalechild
    en: Picture diary!
    ko: 그림일기!
    ja: 絵日記！
  d_nikke_arcana_fortunemate_02_87:
    speaker: "<Monologue>"
    en: As the children finish their snacks, they start to gather around us.
    ko: 슬슬 간식을 다 먹었는지, 아이들이 우리에게 몰려들고 있다.
    ja: |-
      おやつを食べ終えたのか、
      子どもたちが集まって来た
  d_nikke_arcana_fortunemate_02_88:
    speaker: "<Self>"
    en: I think this is above my pay grade.
    ko: "…솔직히 나는 자신 없는데."
    ja: "…正直、私は自信がない"
  d_nikke_arcana_fortunemate_02_89:
    speaker: arcana_s
    en: It's fine. I'm used to doing this alone.
    ko: 괜찮아요. 원래 혼자 했는걸요?
    ja: 大丈夫です。もともと1人でやってましたから。
  d_nikke_arcana_fortunemate_02_90:
    speaker: "<Monologue>"
    en: Arcana stands up and steps forward.
    ko: 아르카나가 일어나서 앞으로 나간다.
    ja: アルカナは立ち上がって前に出た
  d_nikke_arcana_fortunemate_02_91:
    speaker: arcana_s
    en: Now, find a crayon and sketchbook you like and gather round!
    ko: 자~ 마음에 드는 크레파스랑 스케치북 가지고 모여볼까요~
    ja: |-
      さあ、好きなクレヨンとスケッチブックを持って
      集まってくださいね～
  d_nikke_arcana_fortunemate_02_92:
    speaker: children
    en: Okay!
    ko: 네에!
    ja: はーい！
  d_nikke_arcana_fortunemate_02_93:
    speaker: arcana_s
    en: You too, big boy.
    ko: 거기 큰 아가두~
    ja: そこの大きな男の子も～
  d_nikke_arcana_fortunemate_02_94:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_02_95:
    speaker: "<Narration>"
    en: "*Tug*"
    ko: 꾸욱.
    ja: ぎゅっ
  d_nikke_arcana_fortunemate_02_96:
    speaker: "<Self>"
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_arcana_fortunemate_02_97:
    speaker: "<Monologue>"
    en: I feel something tugging at my clothes and look down.
    ko: 옷자락을 당기는 느낌에 아래를 보니,
    ja: 服の裾を引っ張られ、下を見ると…
  d_nikke_arcana_fortunemate_02_98:
    speaker: adultlikefemalechild
    en: Here.
    ko: 여기요.
    ja: はい、これ。
  d_nikke_arcana_fortunemate_02_99:
    speaker: "<Monologue>"
    en: A kid is holding out a sketchbook and crayon.
    ko: 한 아이가 스케치북과 크레파스를 내밀고 있다.
    ja: |-
      女の子がスケッチブックとクレヨンを
      差し出している
  d_nikke_arcana_fortunemate_02_100:
    speaker: "<Self>"
    en: Er, thanks.
    ko: 고, 고마워.
    ja: あ、ありがとう
  d_nikke_arcana_fortunemate_02_101:
    speaker: adultlikefemalechild
    en: And then...
    ko: 그리고요.
    ja: それから…
  d_nikke_arcana_fortunemate_02_102:
    speaker: "<Self>"
    en: Yes?
    ko: 응.
    ja: どうした？
  d_nikke_arcana_fortunemate_02_103:
    speaker: adultlikefemalechild
    en: Um...
    ko: 음….
    ja: えっと…
  d_nikke_arcana_fortunemate_02_104:
    speaker: adultlikefemalechild
    en: Ms. Arcana is really kind, so please be good to her.
    ko: 언니 엄청 좋은 사람이니까 잘해주세요.
    ja: |-
      お姉ちゃん、すっごくいい人だから
      優しくしてあげてね。
  d_nikke_arcana_fortunemate_02_105:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_02_106:
    speaker: "<Monologue>"
    en: The girl runs back to her friends, leaving me in shock.
    ko: 아이는 충격적인 말을 남기고 친구들에게 달려갔다.
    ja: |-
      女の子は衝撃的な言葉を残し、
      友人の元へ走っていった
  d_nikke_arcana_fortunemate_02_107:
    speaker: "<Self>"
    en: Why do all the kids here seem like grown-ups?
    ko: "…여기 애들은 왜 이렇게 다 어른 같아?"
    ja: |-
      …ここの子たちはどうしてみんな
      こんなに大人びているんだ？
  d_nikke_arcana_fortunemate_02_108:
    speaker: arcana_s
    en: Ahaha.
    ko: 아하하하.
    ja: あはははっ。
d_nikke_arcana_fortunemate_03:
  d_nikke_arcana_fortunemate_03_1:
    speaker: "<Monologue>"
    en: What followed was a whirlwind.
    ko: "…그리고, 폭풍 같은 시간이 지난다."
    ja: "…それから、嵐のような時間が過ぎていった"
  d_nikke_arcana_fortunemate_03_2:
    speaker: missingfronttoothmalechild
    en: Mr. Boyfriend! Help me build this!
    ko: 아저씨! 이거 도와주세요!
    ja: おじさん！これ、手伝って！
  d_nikke_arcana_fortunemate_03_3:
    speaker: "<Monologue>"
    en: A boy holds out a set of blocks.
    ko: 아이가 블록 세트를 내민다.
    ja: 男の子はブロックを差し出した
  d_nikke_arcana_fortunemate_03_4:
    speaker: dyedhairmalechild
    en: Ms. Arcana said to call him Mr. @UserName!
    ko: 누나가 아저씨 말구 오빠나 형이라고 부르랬어!
    ja: |-
      おじさんじゃなくて
      お兄ちゃんだって言ってたよ！
  d_nikke_arcana_fortunemate_03_5:
    speaker: missingfronttoothmalechild
    en: No! Mom says it's rude to call grown-ups by their names!
    ko: 아냐~ 엄마가 20살 넘으면 다 아저씨라고 해야 된댔어~
    ja: |-
      ううん。ママが20歳を超えたら
      みんなおじさんだって言ってたもん。
  d_nikke_arcana_fortunemate_03_6:
    speaker: dyedhairmalechild
    en: Is not!
    ko: 아니거든!
    ja: 違うよ！
  d_nikke_arcana_fortunemate_03_7:
    speaker: missingfronttoothmalechild
    en: Is too!
    ko: 아니거든~
    ja: 違わないよ～
  d_nikke_arcana_fortunemate_03_8:
    speaker: twintailsfemalechild
    en: My mom said it's better to call them "uncle."
    ko: 우리 엄마는 삼촌이라고 부르랬는데.
    ja: うちのママは「お兄さん」って呼べって。
  d_nikke_arcana_fortunemate_03_9:
    speaker: missingfronttoothmalechild
    en: Uncle?
    ko: 삼촌은 어.
    ja: お兄さん？
  d_nikke_arcana_fortunemate_03_10:
    speaker: missingfronttoothmalechild
    en: That's what you call your dad's brother! Dummy!
    ko: 어… 아빠 동생이잖아! 바~보야~
    ja: |-
      うーん…お兄ちゃんもお兄さんも
      大して変わんないじゃん。バーカ！
  d_nikke_arcana_fortunemate_03_11:
    speaker: twintailsfemalechild
    en: I-I'm not a dummy...!
    ko: 나, 나 바보 아냐…!
    ja: ば、バカじゃないもん…！
  d_nikke_arcana_fortunemate_03_12:
    speaker: missingfronttoothmalechild
    en: Are too!
    ko: 바보래요~
    ja: ば～か、ば～か！
  d_nikke_arcana_fortunemate_03_13:
    speaker: twintailsfemalechild
    en: Waaaaah...!
    ko: 으, 으아아아앙…!
    ja: う、うわあああん…！
  d_nikke_arcana_fortunemate_03_14:
    speaker: arcana_s
    en: Now, now. I told you not to talk to your friends like that!
    ko: 어허. 친구한테 그렇게 말하면 안 된다고 했죠~!
    ja: |-
      おともだちにそんな言い方をしちゃダメって
      言ったでしょ～？
  d_nikke_arcana_fortunemate_03_15:
    speaker: "<Narration>"
    en: "*Tug*"
    ko: 꾸욱.
    ja: ぎゅっ
  d_nikke_arcana_fortunemate_03_16:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: 何だ？
  d_nikke_arcana_fortunemate_03_17:
    speaker: adultlikefemalechild
    en: He likes her.
    ko: 쟤가 쟤 좋아해요.
    ja: あの男の子、あの子のことが好きなんだよ。
  d_nikke_arcana_fortunemate_03_18:
    speaker: adultlikefemalechild
    en: That's why he's picking on her.
    ko: 그래서 놀리는 거예요.
    ja: だからからかってるの。
  d_nikke_arcana_fortunemate_03_19:
    speaker: "<Self>"
    en: Oh... Okay.
    ko: 그, 그렇구나.
    ja: そ、そうだったのか
  d_nikke_arcana_fortunemate_03_20:
    speaker: adultlikefemalechild
    en: Do you like Ms. Arcana?
    ko: 오빠도 언니 좋아해요?
    ja: お兄ちゃんも、お姉ちゃんのことが好き？
  d_nikke_arcana_fortunemate_03_21:
    speaker: "<Self>"
    en: Huh?
    ko: "…응?"
    ja: "…えっ？"
  d_nikke_arcana_fortunemate_03_22:
    speaker: adultlikefemalechild
    en: Boyfriends and girlfriends are supposed to like each other.
    ko: 남자친구랑 여자친구는 서로 좋아하는 거잖아요.
    ja: |-
      カレシとカノジョって、
      好き同士なんでしょ？
  d_nikke_arcana_fortunemate_03_23:
    speaker: "<Self>"
    en: Right... Yeah.
    ko: 그… 렇지. 응.
    ja: そう…だな
  d_nikke_arcana_fortunemate_03_24:
    speaker: adultlikefemalechild
    en: Why?
    ko: 왜요?
    ja: どうかした？
  d_nikke_arcana_fortunemate_03_25:
    speaker: "<Self>"
    en: Huh?
    ko: 어, 어??
    ja: えっと…
  d_nikke_arcana_fortunemate_03_26:
    speaker: adultlikefemalechild
    en: Do you not like her?
    ko: "…안 좋아해요?"
    ja: "…好きじゃないの？"
  d_nikke_arcana_fortunemate_03_27:
    speaker: "<Self>"
    en: No, no, it's not that.
    ko: 아니아니, 그게 아니라.
    ja: いや、そうじゃなくて…
  d_nikke_arcana_fortunemate_03_28:
    speaker: arcana_s
    en: Why do you look so flustered?
    ko: 왜 그렇게 쩔쩔매고 있어요?
    ja: どうしてそんなにアタフタしてるんですか？
  d_nikke_arcana_fortunemate_03_29:
    speaker: "<Monologue>"
    en: Once Arcana realizes what's happening, she comes over...
    ko: 어느새 순식간에 상황을 정리한 아르카나가 다가와,
    ja: |-
      あっという間にトラブルを解決した
      アルカナがいつの間にか近づき、
  d_nikke_arcana_fortunemate_03_30:
    speaker: "<Monologue>"
    en: "... and crouches down in front of the kid."
    ko: 아이 앞에 쪼그리고 앉는다.
    ja: 女の子の隣にしゃがみ込んだ
  d_nikke_arcana_fortunemate_03_31:
    speaker: arcana_s
    en: Mr. @UserName... Hm...
    ko: 오빠는… 음….
    ja: お兄ちゃんは…うーん…
  d_nikke_arcana_fortunemate_03_32:
    speaker: arcana_s
    en: He likes me sooo much that he's a little shy about it.
    ko: 언니를 너~무 좋아해서 부끄러워 하는 거예요.
    ja: |-
      お姉ちゃんのことがだーい好きだから、
      照れてるんです。
  d_nikke_arcana_fortunemate_03_33:
    speaker: arcana_s
    en: The more you like someone, the harder it is to say it.
    ko: 좋아하는 마음이 클수록 말하기 힘들어지니까.
    ja: |-
      好きな気持ちが大きいほど、
      口に出しにくくなっちゃうの。
  d_nikke_arcana_fortunemate_03_34:
    speaker: arcana_s
    en: Is there someone you like too, Katie?
    ko: 케이티도 좋아하는 친구 있잖아요?
    ja: ケイティーも好きな子がいるでしょ？
  d_nikke_arcana_fortunemate_03_35:
    speaker: adultlikefemalechild
    en: N-no!
    ko: 아, 아니에요!
    ja: い、いないよ！
  d_nikke_arcana_fortunemate_03_36:
    speaker: "<Monologue>"
    en: |-
      As she says it, Katie glances over to
      the mature boy who comforted his heartbroken friend earlier.
    ko: |-
      그러면서도 아이… 케이티의 시선이,
      아까 실연당한 아이를 위로해 주던 어른스러워 보이는 아이에게 향한다.
    ja: |-
      そう言いながら、ケイティーの視線は
      先ほど失恋した男の子を慰めていた
      大人びた男の子の方へ向かっていた
  d_nikke_arcana_fortunemate_03_37:
    speaker: arcana_s
    en: Really?
    ko: 진짜?
    ja: ホント？
  d_nikke_arcana_fortunemate_03_38:
    speaker: adultlikefemalechild
    en: Can you keep a secret?
    ko: "…비밀로 해주세요."
    ja: "…ヒミツにしてね。"
  d_nikke_arcana_fortunemate_03_39:
    speaker: adultlikefemalechild
    en: I'm... gonna make him like me...
    ko: 제가… 저 좋아하게 만들거예요.
    ja: ぜったい振り向かせてみせるの。
  d_nikke_arcana_fortunemate_03_40:
    speaker: adultlikefemalechild
    en: I'm gonna do what you taught me.
    ko: 언니가 알려준 대로요.
    ja: お姉ちゃんが教えてくれた通りに。
  d_nikke_arcana_fortunemate_03_41:
    speaker: arcana_s
    en: Hehe. Okay. I promise I'll keep it secret.
    ko: 후후. 그래요. 약속.
    ja: ふふ。約束ね。
  d_nikke_arcana_fortunemate_03_42:
    speaker: adultlikefemalechild
    en: Okay.
    ko: "…네."
    ja: "…うん。"
  d_nikke_arcana_fortunemate_03_43:
    speaker: "<Self>"
    en: What exactly did you teach her?
    ko: "…뭘 알려준 거야?"
    ja: "…何を教えたんだ？"
  d_nikke_arcana_fortunemate_03_44:
    speaker: arcana_s
    en: Mm...
    ko: 음….
    ja: ええと…
  d_nikke_arcana_fortunemate_03_45:
    speaker: arcana_s
    en: How to be irresistible to the person you like?
    ko: 좋아하는 사람한테 사랑스럽게 티 내는 방법?
    ja: 好きな人に、かわいくアプローチする方法？
  d_nikke_arcana_fortunemate_03_46:
    speaker: "<Monologue>"
    en: Arcana and I watch Katie sit in front of the mature boy...
    ko: 아르카나와 함께 케이티가 어른스러운 남자아이 옆에 앉아,
    ja: |-
      アルカナとケイティーは
      大人びた男の子の隣に座り、
  d_nikke_arcana_fortunemate_03_47:
    speaker: "<Monologue>"
    en: "... and ask him questions about the book he's reading."
    ko: 읽고 있던 책에 대해 물어보는 모습을 본다.
    ja: 読んでいた本について質問をしている
  d_nikke_arcana_fortunemate_03_48:
    speaker: "<Self>"
    en: How should I put it...
    ko: "…뭐랄까."
    ja: "…なんと言うか…"
  d_nikke_arcana_fortunemate_03_49:
    speaker: "<Self>"
    en: She seems tough. And really grown up, too.
    ko: 엄청 당차네. 어른스럽고.
    ja: すごく大人っぽくて、しっかりしているな
  d_nikke_arcana_fortunemate_03_50:
    speaker: arcana_s
    en: Right? Doesn't she remind you of someone?
    ko: 그쵸? 누구 생각나지 않아요?
    ja: そうでしょう？誰かを思い出しませんか？
  d_nikke_arcana_fortunemate_03_51:
    speaker: arcana_s
    en: She's my best student, actually.
    ko: 참고로 제 수제자임.
    ja: ちなみに、私の一番弟子なんです。
  d_nikke_arcana_fortunemate_03_52:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_03_53:
    speaker: arcana_s
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  d_nikke_arcana_fortunemate_03_54:
    speaker: "<Monologue>"
    en: Arcana stands up.
    ko: 아르카나가 다시 일어난다.
    ja: アルカナは再び立ち上がった
  d_nikke_arcana_fortunemate_03_55:
    speaker: arcana_s
    en: Gather round, everyone!
    ko: 자~ 모여볼까요?
    ja: さあ、集まってくださいね～
  d_nikke_arcana_fortunemate_03_56:
    speaker: arcana_s
    en: It's time for a fairy tale!
    ko: 동화책 읽어줄게요~
    ja: 絵本を読みますよ～
  d_nikke_arcana_fortunemate_03_57:
    speaker: children
    en: Okay!
    ko: 네에!
    ja: はーい！
  d_nikke_arcana_fortunemate_03_58:
    speaker: arcana_s
    en: Once upon a time...
    ko: 옛날~ 옛날.
    ja: むか～し、むかし。あるところに…
  d_nikke_arcana_fortunemate_03_59:
    speaker: arcana_s
    en: "... there was a princess who was cursed to never leave the library."
    ko: 도서관 밖으로 나가지 못하는 저주에 걸린 공주님이 살았답니다~
    ja: |-
      図書館の外に出られない呪いにかけられた
      お姫様が暮らしていました～
  d_nikke_arcana_fortunemate_03_60:
    speaker: "<Self>"
    en: Is that a real fairy tale...?
    ko: "…그런 동화가 있어?"
    ja: "…そんな童話があるのか？"
  d_nikke_arcana_fortunemate_03_61:
    speaker: arcana_s
    en: Of course it is!
    ko: 그럼요.
    ja: あるんですよ～
  d_nikke_arcana_fortunemate_03_62:
    speaker: "<Monologue>"
    en: After that, Arcana continued to take good care of the children.
    ko: 그리고 그 뒤로도 아르카나는 혼자서 척척 아이들을 돌봤다.
    ja: |-
      そして、その後もアルカナは
      1人で子どもたちの面倒をしっかりと見ていた
  d_nikke_arcana_fortunemate_03_63:
    speaker: "<Monologue>"
    en: Lunchtime was a blur, and then the kids were all put down for their naps.
    ko: 폭풍 같았던 점심시간이 끝나고, 아이들을 전부 재우고 나서야.
    ja: |-
      嵐のようだったお昼ご飯の時間が終わり、
      子どもたちを全員寝かしつけてから…
  d_nikke_arcana_fortunemate_03_64:
    speaker: "<Monologue>"
    en: Arcana sits at the table and starts to write in a journal.
    ko: 아르카나는 테이블 앞에 자리를 잡고 앉아, 일지를 적기 시작했다.
    ja: アルカナはテーブルに座り、日誌を書き始めた
  d_nikke_arcana_fortunemate_03_65:
    speaker: "<Self>"
    en: So how did you get started with this?
    ko: 그런데 이 일은 어쩌다가 시작한 거야?
    ja: どうしてこの仕事を始めたんだ？
  d_nikke_arcana_fortunemate_03_66:
    speaker: arcana_s
    en: Um... It wasn't anything special.
    ko: 음… 별건 아니구요.
    ja: うーん…大したことじゃないんですけど…
  d_nikke_arcana_fortunemate_03_67:
    speaker: "<Monologue>"
    en: Arcana nibbles the tip of her pen and falls into thought.
    ko: 아르카나가 펜 끝을 입에 물고 생각에 잠긴다.
    ja: アルカナはペンの先を口元に当てて、考え込んだ
  d_nikke_arcana_fortunemate_03_68:
    speaker: arcana_s
    en: After I met you, my life itself didn't change too much.
    ko: 저, 그쪽 만나고 나서도 생활 사이클은 딱히 크게 안 변했거든요?
    ja: |-
      あなたに会ってからも、生活サイクルは
      そんなに変わらなかったんです。
  d_nikke_arcana_fortunemate_03_69:
    speaker: arcana_s
    en: But when we went to school together,
    ko: 근데 우리, 같이 학교 갔을 때.
    ja: でも、一緒に学校に行った時。
  d_nikke_arcana_fortunemate_03_70:
    speaker: arcana_s
    en: it really felt like... like I was seeing the world properly for the first
      time in a while.
    ko: 그때 진짜 오랜만에… 제대로 세상 구경했다고 해야 하나?
    ja: |-
      あの時は本当に久しぶりに…
      ちゃんと世間を体験したって言うか…
  d_nikke_arcana_fortunemate_03_71:
    speaker: arcana_s
    en: Anyway, so I started thinking.
    ko: 아무튼. 그러니까, 생각나더라구요.
    ja: とにかく、思い出したんです。
  d_nikke_arcana_fortunemate_03_72:
    speaker: "<Self>"
    en: Of what?
    ko: 어떤 게?
    ja: 何を？
  d_nikke_arcana_fortunemate_03_73:
    speaker: arcana_s
    en: All the things I'd been wanting to do.
    ko: 그동안 하고 싶었던 것들.
    ja: 今までずっと、やってみたかったこと。
  d_nikke_arcana_fortunemate_03_74:
    speaker: "<Monologue>"
    en: Arcana shows me her bookmarks on her phone.
    ko: 아르카나가 핸드폰으로 북마크 해둔 것들을 보여준다.
    ja: |-
      アルカナが携帯のブックマークを
      見せてくれた
  d_nikke_arcana_fortunemate_03_75:
    speaker: "<Monologue>"
    en: Caring for kids, baking, knitting, reading fairy tales...
    ko: 육아, 제빵, 뜨개질, 동화 등등.
    ja: 育児、パン作り、編み物、童話など…
  d_nikke_arcana_fortunemate_03_76:
    speaker: "<Monologue>"
    en: A stream of hobby videos appears on the screen.
    ko: 온갖 취미 영상들이 줄줄이 이어진다.
    ja: 様々な動画が並んでいる
  d_nikke_arcana_fortunemate_03_77:
    speaker: arcana_s
    en: So after work and on my days off, I started getting out more.
    ko: 그래서 쉬는 날이나 퇴근하고 나서 일부러 좀 많이 돌아다녔거든요?
    ja: |-
      それで、休みの日とか仕事終わりに
      街をブラブラしてみたんです。
  d_nikke_arcana_fortunemate_03_78:
    speaker: arcana_s
    en: During one of those times, I happened to meet the owner here.
    ko: 그러다가 우연히 여기 원장님하고 만나서요.
    ja: |-
      そうしたら偶然、
      ここの園長先生と会って…
  d_nikke_arcana_fortunemate_03_79:
    speaker: arcana_s
    en: I like kids, and I thought it would be fun, so I started to volunteer here.
    ko: 요새 애들도 좋아하게 됐구, 즐거울 것 같아서 봉사 겸 시작했죠.
    ja: |-
      最近子どものことも好きになったし、
      楽しそうだからボランティアも兼ねて
      始めてみたんです。
  d_nikke_arcana_fortunemate_03_80:
    speaker: arcana_s
    en: Also...
    ko: 그리구….
    ja: それに…
  d_nikke_arcana_fortunemate_03_81:
    speaker: "<Monologue>"
    en: Arcana looks over at the kids.
    ko: 아르카나의 시선이 아이들 쪽으로 향한다.
    ja: アルカナの視線が子どもたちの方に向けられた
  d_nikke_arcana_fortunemate_03_82:
    speaker: "<Monologue>"
    en: The mature boy is reading instead of sleeping,
    ko: "…잠들지 않고 책을 읽고 있는 어른스러워 보이는 아이의 손가락을,"
    ja: |-
      …眠らずに本を読んでいる
      大人びた男の子の指を、
  d_nikke_arcana_fortunemate_03_83:
    speaker: "<Monologue>"
    en: and Katie is holding his finger while she naps.
    ko: 케이티가 꼭 붙잡고 잠들어 있다.
    ja: ケイティーがぎゅっと握りながら、眠っていた
  d_nikke_arcana_fortunemate_03_84:
    speaker: arcana_s
    en: I wanted to do something that matters...
    ko: 소중하고 의미 있게 쓰고 싶었으니까요.
    ja: 大切に、有意義なことに使いたかったんです。
  d_nikke_arcana_fortunemate_03_85:
    speaker: arcana_s
    en: "... with the time given to me by my savior."
    ko: 제 생명의 은인에게 받은 시간을.
    ja: 命の恩人からもらった時間を。
  d_nikke_arcana_fortunemate_03_86:
    speaker: "<Self>"
    en: Thanks for sharing.
    ko: "…고마워."
    ja: "…ありがとう"
  d_nikke_arcana_fortunemate_03_87:
    speaker: arcana_s
    en: Hehe.
    ko: "…후후."
    ja: "…ふふ。"
  d_nikke_arcana_fortunemate_03_88:
    speaker: "<Monologue>"
    en: Arcana closes the journal and stands up.
    ko: 아르카나가 일지를 덮고 자리에서 일어난다.
    ja: アルカナは日誌を閉じて立ち上がった
  d_nikke_arcana_fortunemate_03_89:
    speaker: "<Self>"
    en: What do we do now?
    ko: 이제 뭐 하면 돼?
    ja: 次は何をするんだ？
  d_nikke_arcana_fortunemate_03_90:
    speaker: arcana_s
    en: Prepare snacks for when the kids wake up.
    ko: 이제 애기들 일어나면 줄 간식 준비.
    ja: みんなが起きたら食べさせるおやつの準備です。
  d_nikke_arcana_fortunemate_03_91:
    speaker: arcana_s
    en: Can you put one of these on each plate?
    ko: 요거, 하나만 일단 담아줄래요?
    ja: これを一つずつ入れてくれますか？
  d_nikke_arcana_fortunemate_03_92:
    speaker: "<Self>"
    en: Sure.
    ko: 알았어.
    ja: 分かった
  d_nikke_arcana_fortunemate_03_93:
    speaker: "<Monologue>"
    en: I put the rice cakes and fruit that Arcana hands me onto plates.
    ko: 아르카나가 준비한 작은 떡과 과일을 접시에 담는다.
    ja: |-
      アルカナが用意した小さなせんべいと
      フルーツを皿に盛り付けた
  d_nikke_arcana_fortunemate_03_94:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵.
    ja: カシャッ
  d_nikke_arcana_fortunemate_03_95:
    speaker: "<Self>"
    en: Why are you taking pictures?
    ko: 사진은 왜 찍어?
    ja: どうして写真を？
  d_nikke_arcana_fortunemate_03_96:
    speaker: arcana_s
    en: I have to take pictures of everything...
    ko: 이거 다 기록 남겨야 되거든요.
    ja: 全部記録しなきゃいけないんです。
  d_nikke_arcana_fortunemate_03_97:
    speaker: arcana_s
    en: "... to show to the parents."
    ko: 부모님들 보여드리는 용.
    ja: 保護者に報告するために。
  d_nikke_arcana_fortunemate_03_98:
    speaker: "<Monologue>"
    en: Arcana points the camera at me.
    ko: 카메라가 내게 향한다.
    ja: そして、カメラが私に向けられた
  d_nikke_arcana_fortunemate_03_99:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵.
    ja: カシャッ
  d_nikke_arcana_fortunemate_03_100:
    speaker: arcana_s
    en: And that one's for me.
    ko: 그리구 이건 제 거.
    ja: それから、これは自分用。
  d_nikke_arcana_fortunemate_03_101:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_03_102:
    speaker: arcana_s
    en: Hehe. Hang in there. We're almost done.
    ko: 후후. 남은 시간도 잘 부탁해요.
    ja: ふふ。残りの時間もお願いしますね。
d_nikke_arcana_fortunemate_04:
  d_nikke_arcana_fortunemate_04_1:
    speaker: kindergartenfemaleteacher
    en: Thank you for coming again today.
    ko: 오늘도 감사했습니다.
    ja: 今日もありがとうございました。
  d_nikke_arcana_fortunemate_04_2:
    speaker: arcana_s
    en: It was my pleasure!
    ko: 별말씀을요~
    ja: いえいえ～
  d_nikke_arcana_fortunemate_04_3:
    speaker: "<Monologue>"
    en: Arcana hands the journal to the teacher.
    ko: 아르카나가 선생님에게 일지를 건네준다.
    ja: アルカナは先生に日誌を渡した
  d_nikke_arcana_fortunemate_04_4:
    speaker: arcana_s
    en: Nothing much to report today.
    ko: 오늘 별다른 특이 사항은 없었는데,
    ja: 特に変わったことはありませんでしたが、
  d_nikke_arcana_fortunemate_04_5:
    speaker: arcana_s
    en: Eric had his nose in a book all day again.
    ko: 에릭이 오늘도 계속 책만 읽더라구요.
    ja: |-
      エリックは今日もずっと
      本ばかり読んでいました。
  d_nikke_arcana_fortunemate_04_6:
    speaker: kindergartenfemaleteacher
    en: Oh, that's all right.
    ko: 아, 그건 괜찮아요.
    ja: あ、それは大丈夫です。
  d_nikke_arcana_fortunemate_04_7:
    speaker: kindergartenfemaleteacher
    en: When I told his parents, they said to let him do what he wants.
    ko: 부모님들도 들으시고는, 하고 싶은 대로 하게 해 달라고 하셨어요.
    ja: |-
      保護者の方も、好きなようにさせてほしいと
      おっしゃっていたので。
  d_nikke_arcana_fortunemate_04_8:
    speaker: arcana_s
    en: That's good to hear. I thought something might have happened again.
    ko: 아아. 다행이네요. 저는 또 무슨 일 있는 줄 알구.
    ja: |-
      それならよかったです。
      何かあったのかと思っちゃいました。
  d_nikke_arcana_fortunemate_04_9:
    speaker: "<Narration>"
    en: "*Tug*"
    ko: 꾸욱.
    ja: ぎゅっ
  d_nikke_arcana_fortunemate_04_10:
    speaker: adultlikefemalechild
    en: Are you leaving, Mr. @UserName?
    ko: 오빠 이제 가요?
    ja: お兄ちゃん、行っちゃうの？
  d_nikke_arcana_fortunemate_04_11:
    speaker: "<Self>"
    en: Yeah.
    ko: 응.
    ja: ああ
  d_nikke_arcana_fortunemate_04_12:
    speaker: adultlikefemalechild
    en: Will you come back?
    ko: 또 와요?
    ja: また来てくれる？
  d_nikke_arcana_fortunemate_04_13:
    speaker: "<Self>"
    en: Um... I'm not sure.
    ko: 어… 글쎄.
    ja: うーん…どうだろう
  d_nikke_arcana_fortunemate_04_14:
    speaker: adultlikefemalechild
    en: I hope you do.
    ko: 또 왔으면 좋겠어요.
    ja: また来てほしいな。
  d_nikke_arcana_fortunemate_04_15:
    speaker: "<Self>"
    en: Why's that?
    ko: 왜?
    ja: なぜだ？
  d_nikke_arcana_fortunemate_04_16:
    speaker: "<Monologue>"
    en: Katie looks at Arcana, who's chatting with the teachers.
    ko: 케이티가 선생님들과 이야기 중인 아르카나를 본다.
    ja: |-
      ケイティーは先生たちと話をしている
      アルカナの方に目をやった
  d_nikke_arcana_fortunemate_04_17:
    speaker: adultlikefemalechild
    en: I think Ms. Arcana really likes you.
    ko: 언니가 엄청 좋아하는 것 같아서요.
    ja: お姉ちゃん、すごく喜んでたみたいだから。
  d_nikke_arcana_fortunemate_04_18:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_19:
    speaker: "<Self>"
    en: Okay. I promise I'll come next time.
    ko: 응. 다음에도 꼭 올게.
    ja: ああ、必ずまた来よう
  d_nikke_arcana_fortunemate_04_20:
    speaker: adultlikefemalechild
    en: All right. Thank you.
    ko: 네. 고맙습니다.
    ja: うん。ありがとう。
  d_nikke_arcana_fortunemate_04_21:
    speaker: arcana_s
    en: It looks like you and Katie have gotten close.
    ko: 케이티랑 그새 친해졌어요?
    ja: ケイティーと仲よくなったんですか？
  d_nikke_arcana_fortunemate_04_22:
    speaker: "<Self>"
    en: Yeah... I guess you could say that.
    ko: 뭐… 그런 셈이지.
    ja: まあ…そうだな
  d_nikke_arcana_fortunemate_04_23:
    speaker: "<Monologue>"
    en: Katie wanders over to Eric.
    ko: "…케이티는 어느새 에릭의 옆에 가 있다."
    ja: |-
      …ケイティーはいつの間にか、
      エリックの隣にいた
  d_nikke_arcana_fortunemate_04_24:
    speaker: arcana_s
    en: If you're done saying goodbye, let's go.
    ko: 인사 다 했으니까 이제 가요.
    ja: 挨拶も終わったので、帰りましょう。
  d_nikke_arcana_fortunemate_04_25:
    speaker: arcana_s
    en: Bye, everybody! See you next time!
    ko: 다들 안녕~ 나중에 또 올게요~
    ja: みんな、またね～
  d_nikke_arcana_fortunemate_04_26:
    speaker: "<Monologue>"
    en: I'd gotten sort of close with the kids, so they smile as they wave goodbye.
    ko: 나도 아이들과 어느 정도 친해져서, 다들 웃으며 인사해 준다.
    ja: |-
      私も少しは子どもたちと仲よくなり、
      みんな笑顔で挨拶してくれた
  d_nikke_arcana_fortunemate_04_27:
    speaker: despairingmalechild
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_28:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_29:
    speaker: "<Monologue>"
    en: Well, not all of them.
    ko: "…전부 다는 아닌 것 같지만."
    ja: "…全員ではないようだが…"
  d_nikke_arcana_fortunemate_04_30:
    speaker: arcana_s
    en: How was it?
    ko: 어땠어요?
    ja: どうでした？
  d_nikke_arcana_fortunemate_04_31:
    speaker: "<Self>"
    en: Umm... Different. I've never done something like this before.
    ko: 음… 신선했어. 이런 건 또 처음이라.
    ja: |-
      そうだな…
      初めての経験だったから、新鮮だった
  d_nikke_arcana_fortunemate_04_32:
    speaker: arcana_s
    en: Did it put you at ease?
    ko: 안심도 했어요?
    ja: 安心もしました？
  d_nikke_arcana_fortunemate_04_33:
    speaker: "<Self>"
    en: Put me at ease?
    ko: 안심?
    ja: 安心？
  d_nikke_arcana_fortunemate_04_34:
    speaker: arcana_s
    en: You know, like "Wow, Arcana's been doing really well even without me around."
    ko: 아르카나가 나 없는 동안에도 씩씩하게 잘 살고 있구나~ 하구.
    ja: |-
      アルカナは私がいない間も
      立派に過ごしてるんだな～って。
  d_nikke_arcana_fortunemate_04_35:
    speaker: "<Self>"
    en: Yeah, it did.
    ko: 그렇기는 하네.
    ja: それはそうだな
  d_nikke_arcana_fortunemate_04_36:
    speaker: "<Self>"
    en: Also, we've been on so many normal dates before.
    ko: 그리고 평범한 데이트는 그동안 많이 했으니까.
    ja: それに、普通のデートは何度もしたからな
  d_nikke_arcana_fortunemate_04_37:
    speaker: arcana_s
    en: Hehe. Exactly... Hang on.
    ko: 후후. 그쵸… 가 아니라.
    ja: ふふ。ですよね…って、そうじゃなくて！
  d_nikke_arcana_fortunemate_04_38:
    speaker: arcana_s
    en: Are you saying our relationship's grown stale?!
    ko: 슬슬 매너리즘에 빠져서 천천히 애정이 식어가고 있었던 거예요?!
    ja: |-
      マンネリ化して、
      徐々に愛が冷めていたってことですか！？
  d_nikke_arcana_fortunemate_04_39:
    speaker: "<Self>"
    en: Um... You tell me.
    ko: 음… 글쎄?
    ja: うーん…さあ？
  d_nikke_arcana_fortunemate_04_40:
    speaker: arcana_s
    en: Ha. You've left me with no choice. I didn't want to have to do this.
    ko: 하. 어쩔 수 없네요. 이것만은 꺼내지 않으려 했는데.
    ja: |-
      仕方ないですね。
      これだけは使わないでおこうと思ってたのに。
  d_nikke_arcana_fortunemate_04_41:
    speaker: arcana_s
    en: Time to unleash my ultimate date idea!
    ko: 이제 본격적으로, 제가 준비한 비장의 데이트 코스를 선보여야겠네요!
    ja: |-
      ここから、とっておきのデートコースを
      お見せしましょう！
  d_nikke_arcana_fortunemate_04_42:
    speaker: "<Self>"
    en: You always come up with the ideas.
    ko: 매번 아르카나가 준비하잖아.
    ja: 毎回アルカナが予定を立てているじゃないか
  d_nikke_arcana_fortunemate_04_43:
    speaker: arcana_s
    en: I'm always in the Ark, so it's easier for me to do it.
    ko: 맨날 방주에 있는 제가 하는 게 효율적이잖아요~
    ja: |-
      いつもアークにいる私が準備した方が
      効率的でしょう？
  d_nikke_arcana_fortunemate_04_44:
    speaker: arcana_s
    en: It's not like you can come up with date ideas while on missions.
    ko: 그쪽은 작전 나가는데 어떻게 데이트 코스까지 짜.
    ja: |-
      作戦で忙しいのに、デートコースを
      考える時間なんてあります？
  d_nikke_arcana_fortunemate_04_45:
    speaker: arcana_s
    en: Besides, I want to do a bunch of different things with you.
    ko: 그리구 나는 그쪽이랑 내가 하고 싶은 거 하고 싶으니깐.
    ja: それに、私は自分がしたいことをしたいんです。
  d_nikke_arcana_fortunemate_04_46:
    speaker: "<Self>"
    en: All right, sure.
    ko: 그래. 알았어.
    ja: ああ、分かった
  d_nikke_arcana_fortunemate_04_47:
    speaker: arcana_s
    en: Hehe.
    ko: 헤헷.
    ja: えへへっ。
  d_nikke_arcana_fortunemate_04_48:
    speaker: "<Monologue>"
    en: Arcana links her arm in mine and shows me different restaurants.
    ko: 아르카나가 팔짱을 끼우고 맛집을 검색해 보여준다.
    ja: |-
      アルカナは腕を絡め、
      レストランを検索して私に見せた
  d_nikke_arcana_fortunemate_04_49:
    speaker: arcana_s
    en: See this place? It went viral a while back.
    ko: 요기. 얼마 전에 되게 난리 났었던 데거든요?
    ja: ここ。かなり話題になってたお店なんです。
  d_nikke_arcana_fortunemate_04_50:
    speaker: arcana_s
    en: But it's been long enough that it shouldn't be super crowded. Let's go!
    ko: 근데 좀 지나서 사람 빠졌을 거예요. 같이 가요.
    ja: |-
      でも話題になってから時間が経ってるので、
      もう並んでないはず。行ってみましょう。
  d_nikke_arcana_fortunemate_04_51:
    speaker: "<Self>"
    en: Okay.
    ko: 응.
    ja: ああ
  d_nikke_arcana_fortunemate_04_52:
    speaker: "<Narration>"
    en: '"We''re all out of ingredients, so we closed early today! Thank you!"'
    ko: "[금일 재료 소진으로 조기 마감합니다! 감사합니다!]"
    ja: |-
      「売り切れのため、本日の営業を終了しました！
      本日もご来店ありがとうございました！」
  d_nikke_arcana_fortunemate_04_53:
    speaker: arcana_s
    en: Oh...
    ko: "…아."
    ja: "…あっ。"
  d_nikke_arcana_fortunemate_04_54:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_55:
    speaker: arcana_s
    en: W-wow. What are the odds?
    ko: 이, 이야~ 이런 우연도 다 있네요~
    ja: ま、まあ、こういうこともありますよね～
  d_nikke_arcana_fortunemate_04_56:
    speaker: arcana_s
    en: F-fortunately, I totally have a Plan B... Um...
    ko: 다, 다다행히 플랜 B가… 있으니까… 음….
    ja: ま、まだプランBが…あるので…えっと…
  d_nikke_arcana_fortunemate_04_57:
    speaker: "<Monologue>"
    en: Arcana whips her phone out and starts furiously typing.
    ko: 아르카나가 황급히 휴대폰을 꺼내 조작한다.
    ja: アルカナが慌てて携帯電話を取り出して操作した
  d_nikke_arcana_fortunemate_04_58:
    speaker: arcana_s
    en: Um... Right! Let's try this place!
    ko: 음… 그렇지! 여기로 가죠!
    ja: うーん…そうだ！ここにしましょう！
  d_nikke_arcana_fortunemate_04_59:
    speaker: "<Narration>"
    en: '"Closed for the day"'
    ko: "[정기 휴일]"
    ja: "「本日定休日」"
  d_nikke_arcana_fortunemate_04_60:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_61:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_62:
    speaker: "<Self>"
    en: Do you have a Plan C?
    ko: "…혹시 플랜 C도 있어?"
    ja: "…プランCもあるのか？"
  d_nikke_arcana_fortunemate_04_63:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_64:
    speaker: "<Monologue>"
    en: Arcana is growing visibly deflated by the second.
    ko: "…아르카나의 텐션이 급속도로 떨어지는 것이 눈에 보인다."
    ja: |-
      …アルカナのテンションが急激に下がったのが
      手に取るように分かった
  d_nikke_arcana_fortunemate_04_65:
    speaker: "<Self>"
    en: It's okay. Don't worry about it.
    ko: 괜찮으니까 신경 쓰지 마.
    ja: 大丈夫だから、気にするな
  d_nikke_arcana_fortunemate_04_66:
    speaker: arcana_s
    en: But this makes me someone who lets her boyfriend do the work for her.
    ko: "…이러면 그냥 자기 일에 남친 부려 먹은 여자 되잖아요."
    ja: |-
      …これだと、ただ彼氏をこき使った女に
      なるじゃないですか。
  d_nikke_arcana_fortunemate_04_67:
    speaker: arcana_s
    en: That's like... abusing the relationship!
    ko: 이런 것도 데이트 폭력의 일종이라구요.
    ja: こういうのもデートDVの一種ですよね…
  d_nikke_arcana_fortunemate_04_68:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_69:
    speaker: "<Monologue>"
    en: I hold my arms out, and Arcana buries herself in my chest.
    ko: 팔을 벌리자 아르카나가 품속에 파고든다.
    ja: 腕を広げると、アルカナは私に抱きついた
  d_nikke_arcana_fortunemate_04_70:
    speaker: arcana_s
    en: We haven't seen each other in so long.
    ko: 오랜만에 만나는 거니까,
    ja: 久しぶりに会ったから、
  d_nikke_arcana_fortunemate_04_71:
    speaker: arcana_s
    en: It was gonna be perfect... I came up with a story and everything...
    ko: 원래 진짜 근사하게 막… 스토리텔링하고 준비했었는데.
    ja: 本当はステキな流れを準備してたのに。
  d_nikke_arcana_fortunemate_04_72:
    speaker: "<Self>"
    en: A story?
    ko: 스토리텔링?
    ja: 流れ？
  d_nikke_arcana_fortunemate_04_73:
    speaker: arcana_s
    en: Yeah...
    ko: 웅….
    ja: うん…
  d_nikke_arcana_fortunemate_04_74:
    speaker: arcana_s
    en: It started with what I said earlier, about using my time well,
    ko: 아까 했던 말. 막 소중하게 시간 쓴다고 하는 것부터 해서,
    ja: |-
      さっき言いましたよね？
      大切に時間を使いたいってところから…
  d_nikke_arcana_fortunemate_04_75:
    speaker: arcana_s
    en: and then we were gonna have a really good date.
    ko: 제대로 된 데이트까지 이어가구.
    ja: 完璧なデートに繋げて…
  d_nikke_arcana_fortunemate_04_76:
    speaker: arcana_s
    en: Then we'd end up having drinks at a fancy bar...
    ko: 마지막에는 근사한 바 같은 데가서 술이라도 한잔 하면서….
    ja: 最後にはオシャレなバーで一杯やりながら…
  d_nikke_arcana_fortunemate_04_77:
    speaker: "<Self>"
    en: No drinks.
    ko: 술은 안돼.
    ja: 酒はダメだ
  d_nikke_arcana_fortunemate_04_78:
    speaker: arcana_s
    en: What? Why not?!
    ko: 응? 왜요!
    ja: え？なんでですか！
  d_nikke_arcana_fortunemate_04_79:
    speaker: arcana_s
    en: I was gonna change my clothes beforehand.
    ko: 바 갈 땐 어차피 옷 갈아입을 거였다구요.
    ja: バーに行く時は着替えるつもりでしたよ？
  d_nikke_arcana_fortunemate_04_80:
    speaker: "<Self>"
    en: I don't know why, but we can't. It just doesn't feel right.
    ko: "…왠지 모르겠지만 아무튼 안돼. 그냥 안돼."
    ja: "…とにかく、ダメなものはダメだ"
  d_nikke_arcana_fortunemate_04_81:
    speaker: arcana_s
    en: Hmph.
    ko: 치.
    ja: ちぇっ。
  d_nikke_arcana_fortunemate_04_82:
    speaker: "<Self>"
    en: You were acting so mature this morning, but now you're the total opposite.
    ko: "…낮에는 그렇게 어른스러웠는데, 지금은 정반대네."
    ja: |-
      …昼間はあんなに大人っぽかったのに、
      今は真逆だな
  d_nikke_arcana_fortunemate_04_83:
    speaker: arcana_s
    en: That's because I was a teacher this morning.
    ko: 낮에는 선생님이었잖아요.
    ja: 昼間は先生だったので。
  d_nikke_arcana_fortunemate_04_84:
    speaker: arcana_s
    en: Now I'm your girlfriend, so I can pout if I want.
    ko: 지금은 여친이니까 어리광 좀 부리는 거죠, 뭐.
    ja: 今は彼女だから、甘えてるんです。
  d_nikke_arcana_fortunemate_04_85:
    speaker: arcana_s
    en: Also, we finally got to spend the day together, but now it's ruined because
      of me.
    ko: 거기다 나 때문에 오랜만에 만나는 날 망쳤으니까.
    ja: |-
      久しぶりに会えた日が
      自分のせいで台無しになっちゃって…
  d_nikke_arcana_fortunemate_04_86:
    speaker: arcana_s
    en: I'm just... so mad at myself...
    ko: 막… 스스로한테도 화가 나구, 그냥….
    ja: それで…自分にも腹が立つし…
  d_nikke_arcana_fortunemate_04_87:
    speaker: "<Self>"
    en: You didn't ruin anything. It's okay.
    ko: 하나도 안 망쳤으니까 괜찮아.
    ja: 台無しになんてなっていない
  d_nikke_arcana_fortunemate_04_88:
    speaker: "<Self>"
    en: |-
      It doesn't matter what you do.
      What matters is who you're with.
    ko: |-
      뭘 하느냐가 중요한 게 아니라,
      누구랑 하는 게 중요한 거니까.
    ja: |-
      何をするかよりも、
      誰とするかのほうが大事だろう
  d_nikke_arcana_fortunemate_04_89:
    speaker: arcana_s
    en: Hehe. That sounds oddly familiar.
    ko: "…후후. 어디서 들었던 말인데요?"
    ja: "…ふふ。どこかで聞いたセリフですね。"
  d_nikke_arcana_fortunemate_04_90:
    speaker: "<Self>"
    en: Right?
    ko: 그렇지?
    ja: そうだろう？
  d_nikke_arcana_fortunemate_04_91:
    speaker: arcana_s
    en: Hehe.
    ko: 헤헷.
    ja: えへっ。
  d_nikke_arcana_fortunemate_04_92:
    speaker: "<Monologue>"
    en: Arcana moves away and takes my hand.
    ko: 아르카나가 몸을 떼고 손을 잡는다.
    ja: アルカナは私から離れ、手を握った
  d_nikke_arcana_fortunemate_04_93:
    speaker: "<Self>"
    en: Let's order some pizza.
    ko: 가서 떡볶이 시켜 먹자.
    ja: 帰ってピザの宅配でも頼もう
  d_nikke_arcana_fortunemate_04_94:
    speaker: arcana_s
    en: Can I add extra toppings?
    ko: 김말이는요?
    ja: ポテトは？
  d_nikke_arcana_fortunemate_04_95:
    speaker: "<Self>"
    en: Of course.
    ko: 당연히 추가해야지.
    ja: もちろん頼もう
  d_nikke_arcana_fortunemate_04_96:
    speaker: arcana_s
    en: And can we eat while watching TV?
    ko: 드라마 보면서?
    ja: ドラマを見ながら？
  d_nikke_arcana_fortunemate_04_97:
    speaker: "<Self>"
    en: Sure.
    ko: 응.
    ja: ああ
  d_nikke_arcana_fortunemate_04_98:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_04_99:
    speaker: arcana_s
    en: Then what will we do?
    ko: "…그리고 나서는요?"
    ja: "…それから？"
  d_nikke_arcana_fortunemate_04_100:
    speaker: "<Self>"
    en: Um... Well...
    ko: 음… 뭐….
    ja: そうだな…まあ…
  d_nikke_arcana_fortunemate_04_101:
    speaker: "<Self>"
    en: After we clean up... and brush our teeth...
    ko: 정리하고… 양치하고 나서….
    ja: 片づけて…歯を磨いて…
  d_nikke_arcana_fortunemate_04_102:
    speaker: "<Self>"
    en: We should sleep.
    ko: "…자야지?"
    ja: "…寝よう"
  d_nikke_arcana_fortunemate_04_103:
    speaker: arcana_s
    en: You mean that literally, right? Or do you mean something else?
    ko: 사전적 의미예요~ 아니면 다른 거예요?
    ja: そのままの意味ですか～？それとも、別の意味？
  d_nikke_arcana_fortunemate_04_104:
    speaker: "<Self>"
    en: Something else, obviously.
    ko: 당연히 다른 거.
    ja: 当然、別の方だ
  d_nikke_arcana_fortunemate_04_105:
    speaker: arcana_s
    en: Hmm...
    ko: 음….
    ja: えっと…
  d_nikke_arcana_fortunemate_04_106:
    speaker: arcana_s
    en: You know, I always wear a school uniform when I visit the kindergarten.
    ko: "…저, 원래 어린이집 갈때, 항상 교복 입거든요?"
    ja: |-
      …もともと保育園に行く時は、
      いつも制服を着てるんです。
  d_nikke_arcana_fortunemate_04_107:
    speaker: "<Self>"
    en: Really?
    ko: 그래?
    ja: そうか
  d_nikke_arcana_fortunemate_04_108:
    speaker: arcana_s
    en: Yeah. The first day I went, I had been hanging out with Amy so I was still
      in my uniform.
    ko: 네. 처음 간 날이 에이미 만나서 놀았던 날이라 교복 입고 있었거든요.
    ja: |-
      はい。最初に行ったのが
      エイミーと遊んだ日だったので、
      制服を着ていたんです。
  d_nikke_arcana_fortunemate_04_109:
    speaker: arcana_s
    en: |-
      I wore street clothes the next time, but the kids found it strange,
      so ever since then, I've gone dressed like this.
    ko: |-
      그랬더니 그다음에 사복 입고 가니까 애기들이 낯설어해서,
      그담부터 계속 이렇게 가요.
    ja: |-
      でも次に私服を着て行ったら、
      みんな人見知りしちゃって。
      それからずっと制服なんです。
  d_nikke_arcana_fortunemate_04_110:
    speaker: "<Self>"
    en: I see.
    ko: 그랬구나.
    ja: そうだったのか
  d_nikke_arcana_fortunemate_04_111:
    speaker: arcana_s
    en: Yep. But...
    ko: 응. 그런데….
    ja: うん。でも…
  d_nikke_arcana_fortunemate_04_112:
    speaker: arcana_s
    en: I also wore it today as your girlfriend.
    ko: 오늘은 여친으로서도 입었어요.
    ja: 今日は彼女としても、この服を着たんですよ。
  d_nikke_arcana_fortunemate_04_113:
    speaker: "<Self>"
    en: For the something special you told me about?
    ko: 아까 말했던 이벤트?
    ja: さっき言っていたイベントか？
  d_nikke_arcana_fortunemate_04_114:
    speaker: arcana_s
    en: Exactly.
    ko: 응응.
    ja: そうです。
  d_nikke_arcana_fortunemate_04_115:
    speaker: arcana_s
    en: I won't let you sleep tonight, @UserName.
    ko: "…오늘 안 재울 거예요. 선.배."
    ja: "…今日は寝かせませんよ。セ・ン・パ・イ。"
  d_nikke_arcana_fortunemate_04_116:
    speaker: arcana_s
    en: Or should I call you teacher?
    ko: 또… 선.생.님.
    ja: それとも…セ・ン・セ？
d_nikke_arcana_fortunemate_05:
  d_nikke_arcana_fortunemate_05_1:
    speaker: "<Narration>"
    en: The next morning...
    ko: 다음 날 아침.
    ja: 翌朝
  d_nikke_arcana_fortunemate_05_2:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭.
    ja: ゴソゴソ
  d_nikke_arcana_fortunemate_05_3:
    speaker: arcana_s
    en: Mm...
    ko: 으으….
    ja: んん…
  d_nikke_arcana_fortunemate_05_4:
    speaker: "<Monologue>"
    en: Arcana wakes up with the sound of rustling sheets.
    ko: 이불이 부스럭거리는 소리와 함께, 아르카나가 일어난다.
    ja: |-
      シーツがこすれる音と共に、
      アルカナが起き上がった
  d_nikke_arcana_fortunemate_05_5:
    speaker: "<Monologue>"
    en: The sound of her sleepy, stumbling footsteps heads toward the shower,
    ko: 잠에 취해 비틀거리는 발소리가 샤워실 쪽으로 이어지고,
    ja: |-
      寝ぼけてふらつく足音が
      シャワー室の方へ向かい、
  d_nikke_arcana_fortunemate_05_6:
    speaker: "<Monologue>"
    en: The water turns off, and I hear the hair dryer, along with Arcana's humming.
    ko: 곧 물소리가, 이어서 드라이기 소리와 함께, 아르카나의 콧노래 소리가 들린다.
    ja: |-
      やがて水の音、そしてドライヤーの音と共に
      アルカナの鼻歌が聞こえてくる
  d_nikke_arcana_fortunemate_05_7:
    speaker: "<Narration>"
    en: "*Whirrr*"
    ko: 위이이잉-
    ja: ウィィン…
  d_nikke_arcana_fortunemate_05_8:
    speaker: arcana_s
    en: Mmm-mm-hmm ♬
    ko: 흐흐흥~♬
    ja: ふんふふ～ん♬
  d_nikke_arcana_fortunemate_05_9:
    speaker: "<Narration>"
    en: "*Clack*"
    ko: 달칵.
    ja: カチャ…
  d_nikke_arcana_fortunemate_05_10:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_11:
    speaker: "<Self>"
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_arcana_fortunemate_05_12:
    speaker: "<Monologue>"
    en: |-
      Arcana makes eye contact with me as I lie on the bed,
      but she just turns and heads to the table.
    ko: |-
      침대에 누워있는 나와 눈이 마주친 아르카나가
      그대로 몸을 돌려 테이블로 향한다.
    ja: |-
      ベッドに横になっている私と目が合った
      アルカナは、振り返ってテーブルへ向かった
  d_nikke_arcana_fortunemate_05_13:
    speaker: "<Monologue>"
    en: Then...
    ko: 그리고….
    ja: そして…
  d_nikke_arcana_fortunemate_05_14:
    speaker: "<Monologue>"
    en: She picks up the box lying on the table...
    ko: 테이블 위에 있던 상자를 들었다가,
    ja: テーブルの上にあった箱を手に取り、
  d_nikke_arcana_fortunemate_05_15:
    speaker: "<Narration>"
    en: "*Thunk*"
    ko: 달칵.
    ja: コトン
  d_nikke_arcana_fortunemate_05_16:
    speaker: "<Monologue>"
    en: "...and sets it down."
    ko: "…내려놓는다."
    ja: "…置いた"
  d_nikke_arcana_fortunemate_05_17:
    speaker: arcana_s
    en: Ah...
    ko: 아….
    ja: あっ…
  d_nikke_arcana_fortunemate_05_18:
    speaker: "<Monologue>"
    en: Hang on. That's the box where she kept her school uniform.
    ko: "…잠깐. 저거 어제 그, 교복 들어 있던 상자잖아."
    ja: "…昨日、あの制服が入っていた箱だ"
  d_nikke_arcana_fortunemate_05_19:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_20:
    speaker: "<Monologue>"
    en: |-
      She stares at it with a faraway gaze,
      lost in memories.
    ko: |-
      …그리고 추억에 잠긴,
      아련한 눈빛으로 그것을 바라본다.
    ja: |-
      …そして思い出に浸りながら、
      切なそうに制服を見つめた
  d_nikke_arcana_fortunemate_05_21:
    speaker: arcana_s
    en: So that's where it was...
    ko: 여기 있었구나….
    ja: ここにあったんだ…
  d_nikke_arcana_fortunemate_05_22:
    speaker: arcana_s
    en: Hehe. I can't believe this is already just a memory.
    ko: 후후. 이제 이것도 추억이네.
    ja: ふふ。これももう昔のことね。
  d_nikke_arcana_fortunemate_05_23:
    speaker: arcana_s
    en: It's taking me back.
    ko: "…응응. 기억나."
    ja: "…うん。覚えてる。"
  d_nikke_arcana_fortunemate_05_24:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_25:
    speaker: arcana_s
    en: "...What was the next part?"
    ko: "…뭐였더라."
    ja: "…何だっけ。"
  d_nikke_arcana_fortunemate_05_26:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_27:
    speaker: arcana_s
    en: Oh, right.
    ko: 아, 맞다.
    ja: あ、そうだ。
  d_nikke_arcana_fortunemate_05_28:
    speaker: arcana_s
    en: Walking to school together under the cherry blossoms...
    ko: "…같이 벚꽃이 내리는 교정을 거닐고…."
    ja: "…一緒に桜が舞い散る校庭を歩いて…"
  d_nikke_arcana_fortunemate_05_29:
    speaker: arcana_s
    en: Going to class, hanging out after school...
    ko: 수업을 듣고, 방과 후에 놀러가고….
    ja: 授業を受けて、放課後に遊びに行って…
  d_nikke_arcana_fortunemate_05_30:
    speaker: arcana_s
    en: And...
    ko: 그리고….
    ja: そして…
  d_nikke_arcana_fortunemate_05_31:
    speaker: arcana_s
    en: Having my first kiss under the fireworks on school festival day...
    ko: 축제 날. 불꽃놀이 아래에서 첫키스를 하면서….
    ja: 学祭の日。花火の下でファーストキスをして…
  d_nikke_arcana_fortunemate_05_32:
    speaker: "<Self>"
    en: What are you doing?
    ko: "…뭐해?"
    ja: "…何をしているんだ？"
  d_nikke_arcana_fortunemate_05_33:
    speaker: arcana_s
    en: Oh. You're awake?
    ko: 앗. 깼어요?
    ja: あっ。起きました？
  d_nikke_arcana_fortunemate_05_34:
    speaker: "<Self>"
    en: I thought I was dreaming.
    ko: 꿈꾸는 줄 알았네.
    ja: 夢を見ているのかと思った
  d_nikke_arcana_fortunemate_05_35:
    speaker: "<Monologue>"
    en: I push back the covers and sit up.
    ko: 이불을 걷고 일어나 앉는다.
    ja: |-
      私はシーツをめくって起き上がり、
      ベッドの縁に腰を下ろした
  d_nikke_arcana_fortunemate_05_36:
    speaker: "<Monologue>"
    en: Arcana is sitting in the same seat as yesterday, looking through the same
      box.
    ko: "…아르카나는 어제랑 똑같은 자리에, 똑같은 상자를 두고 뒤적이고 있다."
    ja: |-
      …アルカナは昨日と同じ場所で、
      同じ箱を手にしていた
  d_nikke_arcana_fortunemate_05_37:
    speaker: arcana_s
    en: It feels kind of bad to just leave things as they were.
    ko: 아무리 생각해도 좀 아쉬워서.
    ja: やっぱりどう考えても、もったいなくて。
  d_nikke_arcana_fortunemate_05_38:
    speaker: arcana_s
    en: Basically, I wanted to do a time loop of yesterday.
    ko: 그쪽이 눈치 못 챘으면 어제 그대로 루프 할까 했죠.
    ja: |-
      あなたが気づかなかったら、
      昨日のあれをもう一度やろうかと思ったんです。
  d_nikke_arcana_fortunemate_05_39:
    speaker: arcana_s
    en: |-
      But since you noticed,
      you managed to escape the time loop and get on track for the true ending.
    ko: |-
      그런데 눈치채버렸으니까,
      루프를 탈출하고 트루 엔딩 루트에 진입하셨습니다~
    ja: |-
      でも気づかれちゃったので、
      ループから抜け出して
      トゥルーエンドルートに入りました～
  d_nikke_arcana_fortunemate_05_40:
    speaker: "<Self>"
    en: When will I reach the true ending?
    ko: 트루 엔딩은 언제 나오는데?
    ja: トゥルーエンドはいつ完成するんだ？
  d_nikke_arcana_fortunemate_05_41:
    speaker: arcana_s
    en: Mm...
    ko: 음….
    ja: うーん…
  d_nikke_arcana_fortunemate_05_42:
    speaker: arcana_s
    en: About 20 years from now?
    ko: 20년 정도 후쯤?
    ja: 20年後くらい？
  d_nikke_arcana_fortunemate_05_43:
    speaker: "<Self>"
    en: That's pretty far off.
    ko: 한참 남았구나….
    ja: まだまだ先だな…
  d_nikke_arcana_fortunemate_05_44:
    speaker: arcana_s
    en: |-
      You could still get the bad ending,
      so don't let your guard down.
    ko: |-
      중간에 배드엔딩으로 빠질 수도 있으니까,
      긴장 놓으면 안 돼요.
    ja: |-
      途中でバッドエンドになることもあるので、
      気を抜かないでくださいね。
  d_nikke_arcana_fortunemate_05_45:
    speaker: "<Monologue>"
    en: Arcana gets on the bed and hugs me.
    ko: 아르카나가 침대 위로 올라와 내게 안겨든다.
    ja: アルカナがベッドに上り、私に抱きついた
  d_nikke_arcana_fortunemate_05_46:
    speaker: arcana_s
    en: I had so much fun yesterday.
    ko: "…어제, 진짜 좋았어요."
    ja: "…昨日、すごくよかったです。"
  d_nikke_arcana_fortunemate_05_47:
    speaker: arcana_s
    en: It was great, and I was so happy.
    ko: 좋기도 하구, 엄청 행복했어.
    ja: 楽しくて、すごく幸せだった。
  d_nikke_arcana_fortunemate_05_48:
    speaker: "<Self>"
    en: Yeah, me too. But...
    ko: 응. 나도… 인데.
    ja: ああ、私も…だが…
  d_nikke_arcana_fortunemate_05_49:
    speaker: "<Self>"
    en: "... did you put your school uniform back on?"
    ko: "…교복, 다시 입었네?"
    ja: "…また制服を着たのか？"
  d_nikke_arcana_fortunemate_05_50:
    speaker: arcana_s
    en: Oh, this is my backup.
    ko: 아아. 이거는 예비용.
    ja: あっ、これは予備です。
  d_nikke_arcana_fortunemate_05_51:
    speaker: arcana_s
    en: The one I wore yesterday... Well, I can't put it on again right now.
    ko: 어제 입었던 건… 아무래도 당장은 못 입죠.
    ja: 昨日のは…しばらくは着られません。
  d_nikke_arcana_fortunemate_05_52:
    speaker: arcana_s
    en: Last night, you... Ya know...
    ko: 그쪽이 어젯밤에 그렇게 막.
    ja: あなたが昨日の夜に、ほら…
  d_nikke_arcana_fortunemate_05_53:
    speaker: arcana_s
    en: You got a... little too excited.
    ko: 막… 이케저케 했잖아.
    ja: その…色々したでしょ？
  d_nikke_arcana_fortunemate_05_54:
    speaker: "<Self>"
    en: Ahem...
    ko: 흠흠….
    ja: コホンッ…
  d_nikke_arcana_fortunemate_05_55:
    speaker: arcana_s
    en: Hehe. This was our school uniform day.
    ko: 후후. 이번에는 교복의 날이었으니까.
    ja: ふふ。今回は制服の日だったから…
  d_nikke_arcana_fortunemate_05_56:
    speaker: arcana_s
    en: Next time, I can do a bunny girl outfit or a bathing suit or maybe even a
      maid outfit!
    ko: 다음에는 뭐, 바니걸이나 수영복, 아니면 메이드의 날로 준비해 볼게요.
    ja: |-
      次はバニーガールとか、水着とか…
      メイドの日を準備しますね。
  d_nikke_arcana_fortunemate_05_57:
    speaker: "<Monologue>"
    en: Arcana squeezes me in a big hug before sitting back.
    ko: 아르카나가 나를 한번 힘껏 끌어안았다가 떨어진다.
    ja: アルカナが私を一度強く抱き寄せ、離れた
  d_nikke_arcana_fortunemate_05_58:
    speaker: arcana_s
    en: Well, it's time to get to work. For both of us.
    ko: 자자. 이제 다시 출근해야죠. 저희 둘 다.
    ja: ほら、仕事ですよね、2人とも。
  d_nikke_arcana_fortunemate_05_59:
    speaker: arcana_s
    en: Go wash up.
    ko: 얼른 씻고 나와요.
    ja: 早くシャワー浴びてきてくださいね。
  d_nikke_arcana_fortunemate_05_60:
    speaker: "<Monologue>"
    en: Once I shower and put on my uniform,
    ko: 씻고 제복으로 갈아입고 나오자,
    ja: シャワーを浴び、制服に着替えて出ると
  d_nikke_arcana_fortunemate_05_61:
    speaker: "<Monologue>"
    en: the waiting Arcana approaches me and tidies my clothes.
    ko: 기다리고 있던 아르카나가 다가와 옷매무새를 정리해 준다.
    ja: アルカナが近づき、服を整えてくれた
  d_nikke_arcana_fortunemate_05_62:
    speaker: arcana_s
    en: When are you leaving this time?
    ko: 이번엔 언제 나가요?
    ja: 次の作戦はいつですか？
  d_nikke_arcana_fortunemate_05_63:
    speaker: "<Self>"
    en: |-
      It hasn't been decided yet.
      I'll let you know once I hear.
    ko: |-
      아직 안 정해졌어.
      정해지면 알려줄게.
    ja: |-
      まだ決まっていないんだ。
      決まったら連絡する
  d_nikke_arcana_fortunemate_05_64:
    speaker: arcana_s
    en: Okay.
    ko: 응응.
    ja: はい。
  d_nikke_arcana_fortunemate_05_65:
    speaker: "<Self>"
    en: Can I see you again before I leave?
    ko: 나 나가기 전에 한 번 더 볼까?
    ja: 作戦前にもう一度会えるか？
  d_nikke_arcana_fortunemate_05_66:
    speaker: arcana_s
    en: No. I don't want to.
    ko: 아뇨. 싫어요.
    ja: イヤです。
  d_nikke_arcana_fortunemate_05_67:
    speaker: "<Self>"
    en: Why not?
    ko: 왜?
    ja: なぜだ？
  d_nikke_arcana_fortunemate_05_68:
    speaker: "<Self>"
    en: Come to think of it, we only ever see each other once.
    ko: 그러고 보니 항상 딱 한 번만 보네, 우리.
    ja: そういえば、いつも会うのは一度だけだな
  d_nikke_arcana_fortunemate_05_69:
    speaker: arcana_s
    en: Because if I see you more than that, I grow weak.
    ko: 여러 번 보면 나 맘 약해진단 말이에요.
    ja: 何回も会ったら、心が揺れちゃうんです。
  d_nikke_arcana_fortunemate_05_70:
    speaker: arcana_s
    en: Besides, if we only meet once, doesn't it make our passion that much stronger?
    ko: 그리구 이렇게 한 번씩 만나니까 더 애틋하고 그렇지 않아요?
    ja: |-
      それにこうして一度きりの方が
      恋しさが募りませんか？
  d_nikke_arcana_fortunemate_05_71:
    speaker: "<Self>"
    en: That's... true.
    ko: 그렇… 기는 한데.
    ja: それは…そうだが…
  d_nikke_arcana_fortunemate_05_72:
    speaker: arcana_s
    en: If we only spend a single day together,
    ko: 이렇게 하루만 같이 보내주면.
    ja: こうやって1日だけ一緒にいてくれたら、
  d_nikke_arcana_fortunemate_05_73:
    speaker: arcana_s
    en: then I can wait until the next time I see you.
    ko: 다음에 다시 만날 때까지, 충분히 기다릴 수 있어.
    ja: 次まで、ちゃんと待てるの。
  d_nikke_arcana_fortunemate_05_74:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_75:
    speaker: "<Self>"
    en: Same here. The time I spend with you...
    ko: 나한테도, 아르카나랑 이렇게 보내는 시간이.
    ja: 私も、アルカナとこうして過ごす時間が…
  d_nikke_arcana_fortunemate_05_76:
    speaker: "<Self>"
    en: It means a lot to me... and keeps me going.
    ko: 아주 소중하고… 의지가 돼.
    ja: とても大切で…よりどころになっている
  d_nikke_arcana_fortunemate_05_77:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_78:
    speaker: arcana_s
    en: Hey...
    ko: "…있죠."
    ja: "…あのね。"
  d_nikke_arcana_fortunemate_05_79:
    speaker: "<Monologue>"
    en: Arcana reaches out and fixes my bangs.
    ko: 아르카나가 손을 뻗어 내 앞머리를 정리해 준다.
    ja: アルカナは手を伸ばして私の前髪を整えた
  d_nikke_arcana_fortunemate_05_80:
    speaker: arcana_s
    en: You know the term "destined mate?"
    ko: "[운명의 상대], 라는 말이 있잖아요?"
    ja: "「運命の相手」って言葉があるでしょう？"
  d_nikke_arcana_fortunemate_05_81:
    speaker: arcana_s
    en: Sometimes it's used as another word for soulmate...
    ko: 단순히 천생연분이라는 뜻으로 쓰이기도 하지만….
    ja: 天が定めた縁っていう意味でも使うけど…
  d_nikke_arcana_fortunemate_05_82:
    speaker: "<Monologue>"
    en: Arcana pulls out the Wheel of Fortune card.
    ko: 아르카나가 [운명의 수레바퀴] 카드를 꺼낸다.
    ja: アルカナは「運命の輪」のカードを取り出した
  d_nikke_arcana_fortunemate_05_83:
    speaker: arcana_s
    en: "... but I think of it like this."
    ko: 저는 그렇게 생각해요.
    ja: 私は、こう思うんです。
  d_nikke_arcana_fortunemate_05_84:
    speaker: arcana_s
    en: It's two people... who share the same destiny.
    ko: 같은 운명을… 공유하는 사람들이라구.
    ja: 同じ運命を…共有する人なんだ、って。
  d_nikke_arcana_fortunemate_05_85:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_86:
    speaker: "<Monologue>"
    en: Arcana tucks the card into my pocket.
    ko: 아르카나가 카드를 내 안주머니에 넣어준다.
    ja: アルカナはカードを私の内ポケットに入れた
  d_nikke_arcana_fortunemate_05_87:
    speaker: arcana_s
    en: So take this too.
    ko: 그러니까, 이번엔 이것두.
    ja: だから、今回はこれも。
  d_nikke_arcana_fortunemate_05_88:
    speaker: "<Self>"
    en: What's that, a picture?
    ko: 사진?
    ja: 写真？
  d_nikke_arcana_fortunemate_05_89:
    speaker: arcana_s
    en: Yeah.
    ko: 응응.
    ja: ですです。
  d_nikke_arcana_fortunemate_05_90:
    speaker: arcana_s
    en: It took me a whole day to pick it out.
    ko: 이거 진짜 고르는데 하루 종일 걸렸어요.
    ja: 選ぶのに一日はかかりました。
  d_nikke_arcana_fortunemate_05_91:
    speaker: "<Monologue>"
    en: |-
      I take the picture of me and Arcana looking affectionate
      at M.M.R. Vocational School.
    ko: |-
      미미르 부속고에서 찍은,
      나와 아르카나의 다정한 모습의 사진을 받는다.
    ja: |-
      M.M.R.附属高校で撮った
      私とアルカナの仲睦まじい姿が
      写っている写真を受け取った
  d_nikke_arcana_fortunemate_05_92:
    speaker: "<Self>"
    en: We did take a lot of pictures then.
    ko: 그때 사진 많이 찍긴 했지.
    ja: 確かにたくさん撮ったな
  d_nikke_arcana_fortunemate_05_93:
    speaker: arcana_s
    en: No kidding. It took me over an hour just to look at them all.
    ko: 그러니까요. 한 번 쭉 보는 데만도 1시간 넘게 걸림.
    ja: |-
      そうなんです。
      ざっと見るだけでも1時間以上かかっちゃって。
  d_nikke_arcana_fortunemate_05_94:
    speaker: arcana_s
    en: I was thinking about getting you a locket for the picture,
    ko: 원래 사진 들어간 펜던트 같은 거 준비할까 했는데.
    ja: |-
      写真が入ってるペンダントでも
      用意しようかと思ったんですが、
  d_nikke_arcana_fortunemate_05_95:
    speaker: arcana_s
    en: but I thought it might get in the way when you move.
    ko: 그쪽 움직이는데 걸리적거릴 것 같아서요.
    ja: 作戦中に邪魔になるかな～って。
  d_nikke_arcana_fortunemate_05_96:
    speaker: "<Self>"
    en: No kidding. What if it got in my way, and I got shot and died?
    ko: 그러게. 걸리적거려서 총 맞고 죽으면.
    ja: |-
      そうだな。
      何かの拍子に引っかかって、
      そのまま撃たれて死んだら…
  d_nikke_arcana_fortunemate_05_97:
    speaker: "<Self>"
    en: I would curse you so that every time you ordered pizza, it would always arrive
      cold.
    ko: 피자 시킬 때마다 박스 세로로 세워서 받으라고 저주할 거야.
    ja: |-
      ピザを頼むたびに、
      箱が縦に置かれる呪いをかけるだろう
  d_nikke_arcana_fortunemate_05_98:
    speaker: arcana_s
    en: Pfft. I definitely wouldn't take that sitting down.
    ko: 푸흡. 그건 진짜 못 참겠는데요?
    ja: あははっ。それはイヤですね～
  d_nikke_arcana_fortunemate_05_99:
    speaker: arcana_s
    en: I would have to follow you right away to lodge a complaint.
    ko: 그러면 바로 따라가서 항의해야겠다.
    ja: そしたら私、すぐに後を追って抗議しますよ。
  d_nikke_arcana_fortunemate_05_100:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_101:
    speaker: arcana_s
    en: |-
      Hehe. I told you.
      We share the same destiny.
    ko: |-
      후후. 말했죠?
      같은 운명을 공유하는 사이라고.
    ja: |-
      ふふ、言ったでしょう？
      同じ運命を共有するって。
  d_nikke_arcana_fortunemate_05_102:
    speaker: "<Self>"
    en: It feels strange to hear you say you'll follow me when I die...
    ko: 나 죽으면 따라서 죽겠다는 말 들으니까 묘한 기분이야….
    ja: |-
      私の後を追うと言われると、
      何とも言えない気分だな…
  d_nikke_arcana_fortunemate_05_103:
    speaker: arcana_s
    en: |-
      Then all you have to do is come back safe.
      You and I have to live a long, happy life together.
    ko: |-
      무사히 돌아오면 되죠~
      저랑 같이 오래오래 행복하게 살아야 하니까.
    ja: |-
      無事に帰ってこればいいんですよ～
      一緒に末永く幸せに暮らさなきゃ。
  d_nikke_arcana_fortunemate_05_104:
    speaker: "<Monologue>"
    en: Arcana hugs me again.
    ko: 아르카나가 다시 안겨든다.
    ja: アルカナが再び抱きついた
  d_nikke_arcana_fortunemate_05_105:
    speaker: arcana_s
    en: Take good care of yourself this time too.
    ko: "…이번에도 몸 성히 다녀와요."
    ja: "…今回も元気に行ってきてくださいね。"
  d_nikke_arcana_fortunemate_05_106:
    speaker: "<Self>"
    en: You must worry about me every time.
    ko: 매번 걱정되는구나?
    ja: 今回も心配してくれるのか？
  d_nikke_arcana_fortunemate_05_107:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_108:
    speaker: arcana_s
    en: |-
      Well, yes, I'm extremely worried,
      but I won't tell you I'm worried so I don't make you worry.
    ko: |-
      엄청 걱정되지만,
      그쪽이 걱정할 것 같으니까 걱정한다고 얘기 안 할래.
    ja: |-
      すごく心配だけど、
      あなたを不安にさせたくないから、
      心配だって言わないの。
  d_nikke_arcana_fortunemate_05_109:
    speaker: "<Self>"
    en: What the heck?
    ko: 그게 뭐야.
    ja: 何だそれは
  d_nikke_arcana_fortunemate_05_110:
    speaker: arcana_s
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  d_nikke_arcana_fortunemate_05_111:
    speaker: "<Monologue>"
    en: Arcana leans back a little and looks up at me.
    ko: 아르카나가 살짝 몸을 떼고 나를 올려다 본다.
    ja: アルカナが少し離れ、私を見上げた
  d_nikke_arcana_fortunemate_05_112:
    speaker: arcana_s
    en: |-
      When I said I'd die if anything ever happened to you...
      Well, I lied.
    ko: |-
      그쪽이… 잘못되면 저도 죽겠다는 말.
      사실 거짓말이었어요.
    ja: |-
      あなたに何かあったら…後を追うって言葉。
      実はウソなんです。
  d_nikke_arcana_fortunemate_05_113:
    speaker: "<Self>"
    en: You did?
    ko: 그래?
    ja: そうなのか？
  d_nikke_arcana_fortunemate_05_114:
    speaker: arcana_s
    en: Yeah.
    ko: 응.
    ja: うん。
  d_nikke_arcana_fortunemate_05_115:
    speaker: arcana_s
    en: If that does happen, then for dozens or hundreds of years...
    ko: 만약 그렇게 되면… 저는 수십, 수백 년 동안.
    ja: もしそうなったら…私は数十年、数百年。
  d_nikke_arcana_fortunemate_05_116:
    speaker: arcana_s
    en: No, for thousands and millions of years...
    ko: 아니 수천, 수만 년 동안이라도.
    ja: いえ…数千年、数万年でも…
  d_nikke_arcana_fortunemate_05_117:
    speaker: arcana_s
    en: "...I'll protect them,"
    ko: "…지킬 거예요."
    ja: "…守ります。"
  d_nikke_arcana_fortunemate_05_118:
    speaker: arcana_s
    en: the records of everything you've ever done.
    ko: 그쪽이 지금껏 해온 일에 대한 기록을.
    ja: |-
      あなたが今まで
      成し遂げてきたことの記録を。
  d_nikke_arcana_fortunemate_05_119:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_120:
    speaker: "<Monologue>"
    en: I cup Arcana's cheek in my hand...
    ko: 아르카나의 뺨을 감싸고,
    ja: アルカナの頬を包み、
  d_nikke_arcana_fortunemate_05_121:
    speaker: "<Monologue>"
    en: "... and lean down for a kiss."
    ko: 몸을 숙여 입을 맞춘다.
    ja: 頭を下げてキスをした
  d_nikke_arcana_fortunemate_05_122:
    speaker: arcana_s
    en: Ah...
    ko: 아….
    ja: あっ…
  d_nikke_arcana_fortunemate_05_123:
    speaker: "<Monologue>"
    en: With a quiet gasp, she wraps her white arms around my neck.
    ko: 작은 탄성과 함께, 하얀 두 팔이 목을 끌어안는다.
    ja: 小さな声が漏れ、白い両腕が首に絡みついた
  d_nikke_arcana_fortunemate_05_124:
    speaker: arcana_s
    en: I want to say I love you,
    ko: 사랑한다고 말하고 싶은데,
    ja: 愛してるって言いたいけど、
  d_nikke_arcana_fortunemate_05_125:
    speaker: arcana_s
    en: but that feels like what the love interest would do in a movie right before
      the protagonist dies, so I won't.
    ko: 헤어질 때 말하면 뭔가 플래그 같으니까 참을게요.
    ja: |-
      別れの時に言うと、なんだかフラグみたいだから
      我慢しますね。
  d_nikke_arcana_fortunemate_05_126:
    speaker: "<Self>"
    en: Then say it when I come back.
    ko: 그럼 그건 돌아왔을 때 인사로 해줘.
    ja: じゃあ、それは帰ってきた時の挨拶にしてくれ
  d_nikke_arcana_fortunemate_05_127:
    speaker: "<Monologue>"
    en: I slowly take a step back and hold out my pinky finger.
    ko: 천천히 몸을 떼고 새끼손가락을 내민다.
    ja: ゆっくりと体を離し、小指を差し出した
  d_nikke_arcana_fortunemate_05_128:
    speaker: arcana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_arcana_fortunemate_05_129:
    speaker: "<Monologue>"
    en: Arcana beams and hooks her finger in mine.
    ko: 아르카나는 환하게 웃으며 손가락을 걸고는.
    ja: アルカナは明るく笑いながら、指切りをして…
  d_nikke_arcana_fortunemate_05_130:
    speaker: "<Monologue>"
    en: She speaks in a lovely voice.
    ko: 사랑스러운 목소리로 말했다.
    ja: かわいらしい声で言った
  d_nikke_arcana_fortunemate_05_131:
    speaker: arcana_s
    en: Okay. Promise!
    ko: "…응. 약속!"
    ja: "…うん。約束ですっ！"
