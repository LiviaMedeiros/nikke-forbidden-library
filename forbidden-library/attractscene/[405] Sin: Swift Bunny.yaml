---
d_nikke_sin_swiftbunny_01:
  d_nikke_sin_swiftbunny_01_1:
    speaker: "<Monologue>"
    en: It's a lazy weekend afternoon.
    ko: 나른한 주말 오후.
    ja: のどかな週末の午後
  d_nikke_sin_swiftbunny_01_2:
    speaker: "<Monologue>"
    en: To nobody's surprise, the Dual-Class Cafe was a huge success, having been
      run by those who mastered the art of both the bunny girl and the maid.
    ko: |-
      너무나 당연한 일이지만, 바니걸과 메이드.
      두 클래스를 섭렵한 이들이 서비스하는 듀얼-클래스 카페는 큰 인기를 끌었고.
    ja: |-
      当然のことながら、バニーガールとメイド、
      2つのクラスを極めし者たちが給仕する
      デュアルクラス・カフェは人気を博し…
  d_nikke_sin_swiftbunny_01_3:
    speaker: "<Monologue>"
    en: Encouraged by the enthusiastic reception, they decided to do a re-run of the
      event not long after.
    ko: 성원에 힘입어, 오래 지나지 않아 또다시 이벤트를 진행하게 되었다.
    ja: |-
      その好評に応える形で、
      早くも再びイベントを開催することになった
  d_nikke_sin_swiftbunny_01_4:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_01_5:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 달칵.
    ja: コトッ
  d_nikke_sin_swiftbunny_01_6:
    speaker: "<Monologue>"
    en: I sip on my coffee while watching the maids and bunny girls dart around the
      cafe.
    ko: 커피를 마시며, 메이드와 바니걸들이 가게를 누비는 모습을 본다.
    ja: |-
      コーヒーを飲みながら、
      メイドやバニーガールたちが
      店内を動き回る様子を眺める
  d_nikke_sin_swiftbunny_01_7:
    speaker: "<Monologue>"
    en: I can feel the fatigue melt away as my heart and body relax.
    ko: 심신이 안정되고, 몸과 마음에 쌓였던 피로가 풀린다.
    ja: |-
      心身が安らぎ、心と身体に溜まっていた
      疲れがほぐれていく
  d_nikke_sin_swiftbunny_01_8:
    speaker: "<Monologue>"
    en: My gaze settles on one particular bunny girl.
    ko: 그중, 한 바니걸에게 시선이 멈춘다.
    ja: |-
      ふと、その中の1人のバニーガールに
      視線が止まった
  d_nikke_sin_swiftbunny_01_9:
    speaker: sin_b
    en: Ade, how's our stock looking?
    ko: 에이드. 재고 괜찮아?
    ja: エード。在庫は足りてる？
  d_nikke_sin_swiftbunny_01_10:
    speaker: ade_b
    en: Oh, we are nearly out of complimentary cookies.
    ko: 아. 서비스용 쿠키가 거의 떨어졌어요.
    ja: |-
      あ、サービス用のクッキーが
      もうほとんどありません。
  d_nikke_sin_swiftbunny_01_11:
    speaker: sin_b
    en: I'll go and bake some more, then.
    ko: 그럼 내가 구워놓을게~
    ja: じゃあ、私が焼いとくわね～
  d_nikke_sin_swiftbunny_01_12:
    speaker: ade_b
    en: Hehe, sounds good. Thank you.
    ko: 후후. 네. 감사해요.
    ja: ふふ、はい。ありがとうございます。
  d_nikke_sin_swiftbunny_01_13:
    speaker: "<Self>"
    en: Hmm...
    ko: "…흠."
    ja: "…ほう"
  d_nikke_sin_swiftbunny_01_14:
    speaker: "<Monologue>"
    en: Ever since the most recent Coin Rush event, Sin's attitude has completely
      changed.
    ko: 최근 코인 러시에서 열렸던 이벤트 이후, 신의 태도는 몰라보게 변했다.
    ja: |-
      コインラッシュで開催されたイベントの後、
      シンの態度は見違えるほど変わった
  d_nikke_sin_swiftbunny_01_15:
    speaker: "<Monologue>"
    en: I was a little worried at first, but she's been doing well enough that I think
      I can rest easy now.
    ko: |-
      처음에는 그래도 조금 걱정했지만,
      이 정도면 이제 마음을 놓아도 되겠지.
    ja: |-
      最初は少し心配していたが
      今の様子をみたところ、
      もう安心できそうだ
  d_nikke_sin_swiftbunny_01_16:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 달칵.
    ja: コトッ
  d_nikke_sin_swiftbunny_01_17:
    speaker: "<Self>"
    en: "... Yeah. It's all good now."
    ko: "…그래. 그거면 된 거야."
    ja: "…ああ、それでいい"
  d_nikke_sin_swiftbunny_01_18:
    speaker: "<Monologue>"
    en: I set down my coffee cup, feeling a smile spread across my face in sheepish
      gratification.
    ko: |-
      코 밑을 스윽 문지르고 싶은 훈훈한 기분으로
      커피잔을 내려놓….
    ja: |-
      鼻の下をこすりたくなるような
      微笑ましい気持ちで
      コーヒーカップを置く…
  d_nikke_sin_swiftbunny_01_19:
    speaker: sin_b
    en: What's all good?
    ko: 뭐가 그거면 되는데?
    ja: それでいいって、何が？
  d_nikke_sin_swiftbunny_01_20:
    speaker: "<Self>"
    en: Well, obviously—gahhh, you scared me!
    ko: 그야 당연히 어 깜짝이야.
    ja: |-
      それは、もちろん…
      って、びっくりした！
  d_nikke_sin_swiftbunny_01_21:
    speaker: sin_b
    en: Hey there!
    ko: 안녕~
    ja: ヤッホ～
  d_nikke_sin_swiftbunny_01_22:
    speaker: "<Self>"
    en: I thought you went to bake some cookies.
    ko: 쿠키 구우러 간 거 아니었어?
    ja: クッキーを焼きに行ったんじゃなかったのか？
  d_nikke_sin_swiftbunny_01_23:
    speaker: sin_b
    en: I saw you here and decided to come over for a bit.
    ko: 주인님 온 거 보고 잠깐 와봤지~
    ja: |-
      ご主人様が見えたから、
      ちょっと来てみたの～
  d_nikke_sin_swiftbunny_01_24:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_sin_swiftbunny_01_25:
    speaker: "<Monologue>"
    en: Something about her voice is slightly off.
    ko: 그렇게 말하는 신의 목소리에서 작은 위화감이 느껴진다.
    ja: そう話すシンの声に小さな違和感を覚えた
  d_nikke_sin_swiftbunny_01_26:
    speaker: "<Self>"
    en: There's something different about your voice.
    ko: 평소랑 목소리가 좀 다른 것 같네?
    ja: いつもと少し声が違うような気がするな
  d_nikke_sin_swiftbunny_01_27:
    speaker: sin_b
    en: I figured you'd notice, Counsel... I mean, Master. 20 points for you!
    ko: |-
      역시 교관, 아니 주인님~ 눈치채 주는구나?
      상점 20점!
    ja: |-
      さすが教官。じゃなくてご主人様～
      気づいてくれたのね？
      ボーナスポイント20点～！
  d_nikke_sin_swiftbunny_01_28:
    speaker: sin_b
    en: They made a few tweaks to my converter. You can hear my voice more clearly
      now, right?
    ko: |-
      컨버터를 조금 개량했거든.
      내 목소리, 더 잘 들리지?
    ja: |-
      コンバーターを少し改良したの。
      私の声、よく聞こえるように
      なったでしょ？
  d_nikke_sin_swiftbunny_01_29:
    speaker: "<Monologue>"
    en: Sin smiles and sets down a small piece of cake in front of me.
    ko: 신이 웃으며 작은 조각 케이크 하나를 내려놓는다.
    ja: |-
      シンが微笑みながら、私の目の前に
      小さなカットケーキを1つ置いた
  d_nikke_sin_swiftbunny_01_30:
    speaker: "<Self>"
    en: What's this? I don't remember seeing it on the menu...
    ko: 이건 뭐야? 메뉴에 없던 것 같은데.
    ja: |-
      これは？
      メニューにはなかった気がするが
  d_nikke_sin_swiftbunny_01_31:
    speaker: sin_b
    en: You really have our menu memorized, don't you?
    ko: 역시 다 파악하고 있구나?
    ja: やっぱりメニューを全部把握してるのね？
  d_nikke_sin_swiftbunny_01_32:
    speaker: "<Self>"
    en: You bet.
    ko: 당연하지.
    ja: 当然だ
  d_nikke_sin_swiftbunny_01_33:
    speaker: "<Monologue>"
    en: I examine the simple piece of cake.
    ko: 심플한 디자인의 케이크를 살펴본다.
    ja: シンプルなデザインのケーキをながめた
  d_nikke_sin_swiftbunny_01_34:
    speaker: sin_b
    en: It's... a test version of something we're planning to add to the menu next
      season.
    ko: "…뭐, 다음 시즌에 낼 예정인 시험작이야."
    ja: "…次のシーズンに出す予定の試作品なの。"
  d_nikke_sin_swiftbunny_01_35:
    speaker: sin_b
    en: Give it a taste.
    ko: 맛 한번 봐줘.
    ja: 味見してみてよ。
  d_nikke_sin_swiftbunny_01_36:
    speaker: "<Self>"
    en: Sure.
    ko: 응.
    ja: ああ
  d_nikke_sin_swiftbunny_01_37:
    speaker: "<Monologue>"
    en: I pick up the fork and take a small bite of the cake.
    ko: 포크를 집어들고, 조각 케이크를 한 입 먹는다.
    ja: フォークを手に取り、カットケーキを一口食べる
  d_nikke_sin_swiftbunny_01_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_01_39:
    speaker: "<Monologue>"
    en: I instinctively tilt my head to one side and look at the cake.
    ko: 나도 모르게 고개가 한쪽으로 기울어진다.
    ja: 私は思わず首をかしげた
  d_nikke_sin_swiftbunny_01_40:
    speaker: sin_b
    en: Does it taste weird?
    ko: 이상해?
    ja: なにかヘン？
  d_nikke_sin_swiftbunny_01_41:
    speaker: "<Self>"
    en: It's not weird per se. It's just...
    ko: 이상하다기보단….
    ja: ヘンというより…
  d_nikke_sin_swiftbunny_01_42:
    speaker: "<Monologue>"
    en: I take another bite of the cake.
    ko: 케이크를 한 입 더 입에 넣는다.
    ja: ケーキをもう一口、口に運ぶ
  d_nikke_sin_swiftbunny_01_43:
    speaker: "<Self>"
    en: Something about it is...
    ko: 뭔가….
    ja: なんだか…
  d_nikke_sin_swiftbunny_01_44:
    speaker: "<Self>"
    en: "... Something about it is just... something."
    ko: "…뭔가 뭔가야."
    ja: "…なんだか、あれだな"
  d_nikke_sin_swiftbunny_01_45:
    speaker: sin_b
    en: What does that even mean?
    ko: 그게 뭐야~
    ja: 何それ～
  d_nikke_sin_swiftbunny_01_46:
    speaker: sin_b
    en: Minus 50 points for being unclear!
    ko: 제대로 말 안 해주는 주인님한테 벌점 50점~!
    ja: |-
      ちゃんと教えてくれないご主人様は、
      マイナス50点～！
  d_nikke_sin_swiftbunny_01_47:
    speaker: "<Self>"
    en: I just mean there's something peculiar about it that I can't quite put into
      words...
    ko: 그게, 뭔가 말로 표현할 수 없는 오묘한 느낌이라….
    ja: |-
      それが、何とも言葉では言い表せない
      不思議な…
  d_nikke_sin_swiftbunny_01_48:
    speaker: sin_b
    en: Does it taste bad?
    ko: 맛없어?
    ja: まずいってこと？
  d_nikke_sin_swiftbunny_01_49:
    speaker: "<Self>"
    en: Not really, but...
    ko: 그건 또 아니긴 한데….
    ja: そういうわけではないが…
  d_nikke_sin_swiftbunny_01_50:
    speaker: "<Self>"
    en: "... I dunno. There's something about it."
    ko: "…아무튼 그래."
    ja: "…とにかく、そういう感じだ"
  d_nikke_sin_swiftbunny_01_51:
    speaker: sin_b
    en: Yeah? Then it sounds like we shouldn't put it on the menu.
    ko: 그래? 그럼 이건 못 내놓겠네~
    ja: そう？なら、これはボツね～
  d_nikke_sin_swiftbunny_01_52:
    speaker: "<Monologue>"
    en: Sin nonchalantly takes away the plate.
    ko: 신이 대수롭지 않게 접시를 치운다.
    ja: シンは何でもないことのように皿を下げた
  d_nikke_sin_swiftbunny_01_53:
    speaker: "<Self>"
    en: How's work going?
    ko: 요새 일은 어때?
    ja: 最近、仕事はどうだ？
  d_nikke_sin_swiftbunny_01_54:
    speaker: sin_b
    en: Hmm...
    ko: 음….
    ja: そうね…
  d_nikke_sin_swiftbunny_01_55:
    speaker: sin_b
    en: Well, I'm trying my best.
    ko: 뭐, 노력하고 있어.
    ja: まあ、頑張ってはいるわ。
  d_nikke_sin_swiftbunny_01_56:
    speaker: "<Self>"
    en: Good... I'm proud of you.
    ko: "…그래. 장하다."
    ja: "…そうか、えらいな"
  d_nikke_sin_swiftbunny_01_57:
    speaker: sin_b
    en: Hahaha. I wonder when I'll finally get used to hearing that.
    ko: 하하하. 그 말은 언제나 돼야 적응되려나~
    ja: |-
      あはは。その言葉、
      いつになったら慣れるのかしら～
  d_nikke_sin_swiftbunny_01_58:
    speaker: sin_b
    en: Anyway, relax and enjoy yourself while you're here, Master!
    ko: 그럼, 편히 쉬세요. 주인님~
    ja: |-
      それでは、ごゆっくりお過ごしくださいませ。
      ご主人様～
  d_nikke_sin_swiftbunny_01_59:
    speaker: "<Monologue>"
    en: I spend the rest of my time in the cafe saying hello to some familiar faces
      and soaking in the energy from all the bunny girls and maids.
    ko: |-
      이후로도 간간이 아는 얼굴들과 인사를 나누며,
      메이드-바니 성분을 듬뿍 몸에 넣었다.
    ja: |-
      その後も時折、見知った顔と挨拶を交わしながら
      メイドバニーにたっぷりと癒された
  d_nikke_sin_swiftbunny_01_60:
    speaker: "<Narration>"
    en: "*Jingle*"
    ko: 짤랑-
    ja: チリン――
  d_nikke_sin_swiftbunny_01_61:
    speaker: "<Monologue>"
    en: As darkness begins to settle outside, I step out of the cafe.
    ko: 슬슬 밖이 어두워질 무렵이 되어 가게를 나섰을 때….
    ja: |-
      外が暗くなり始めた頃、
      店を出ると…
  d_nikke_sin_swiftbunny_01_62:
    speaker: "<Self>"
    en: Hm...?
    ko: 응?
    ja: おや？
  d_nikke_sin_swiftbunny_01_63:
    speaker: "<Monologue>"
    en: A familiar silhouette is heading toward a nearby alleyway.
    ko: 익숙한 뒷모습이 근처 뒷골목으로 향한다.
    ja: |-
      見覚えのある後ろ姿が、
      近くの裏通りへと向かっていった
  d_nikke_sin_swiftbunny_01_64:
    speaker: "<Monologue>"
    en: Then, at the mouth of the alley, it meets up with a shady-looking man and
      they disappear together.
    ko: |-
      그리고 골목 어귀에서,
      한눈에 봐도 인상이 좋지 않은 남자와 합류해 사라진다.
    ja: |-
      そして路地の入り口で
      見るからに悪そうな男と合流し、
      姿を消した
  d_nikke_sin_swiftbunny_01_65:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
d_nikke_sin_swiftbunny_02:
  d_nikke_sin_swiftbunny_02_1:
    speaker: "<Narration>"
    en: A few days later...
    ko: 며칠 뒤.
    ja: 数日後
  d_nikke_sin_swiftbunny_02_2:
    speaker: ade_b
    en: Um, Master...
    ko: 저… 주인님.
    ja: あの…ご主人様。
  d_nikke_sin_swiftbunny_02_3:
    speaker: "<Self>"
    en: Oh, is it already time for my fourth afternoon coffee? Thanks for the reminder.
    ko: 아. 벌써 네 번째 오후 커피 시간인가? 고마워.
    ja: |-
      あ、もう午後の4回目のコーヒーの時間か？
      ありがとう
  d_nikke_sin_swiftbunny_02_4:
    speaker: ade_b
    en: N-no, there's still some time left until then...
    ko: 아, 아뇨. 그건 아직 남았는데….
    ja: |-
      あ、いえ。
      それはまだ先なのですが…
  d_nikke_sin_swiftbunny_02_5:
    speaker: ade_b
    en: Wh-what I meant is... you're okay, right? There's nothing wrong... is there?
    ko: "…혹시 무슨 일 있으신 건 아니시죠…?"
    ja: "…何かあったわけではございませんよね…？"
  d_nikke_sin_swiftbunny_02_6:
    speaker: ade_b
    en: I'm very happy that you're visiting so often, but this is the first time I've
      seen you spend all day in here for several days in a row...
    ko: |-
      자주 찾아주시는 건 정말 기쁘지만,
      이렇게 며칠 동안 하루 종일 계시는 건 처음이라….
    ja: |-
      足しげく通ってくださるのは嬉しいのですが、
      こうして何日も続けて1日中お店に
      いらっしゃるのは初めてのことですので…
  d_nikke_sin_swiftbunny_02_7:
    speaker: "<Self>"
    en: "... I just didn't want to miss out on a two-in-one event like this."
    ko: "…2배 이벤트를 놓칠 수는 없잖아."
    ja: "…このイベントを逃すわけにはいかないだろう？"
  d_nikke_sin_swiftbunny_02_8:
    speaker: ade_b
    en: I-I see...
    ko: 그, 그렇군요….
    ja: さ、さようですか…
  d_nikke_sin_swiftbunny_02_9:
    speaker: "<Monologue>"
    en: I think back to when I saw Sin a few days ago.
    ko: 며칠 전 보았던 신의 모습.
    ja: 数日前に見かけた、シンの姿
  d_nikke_sin_swiftbunny_02_10:
    speaker: "<Monologue>"
    en: She might've simply been going home from work like normal,
    ko: 그냥 평범하게 퇴근하던 것일 수도 있지만….
    ja: ただ退勤しただけかもしれないが…
  d_nikke_sin_swiftbunny_02_11:
    speaker: "<Monologue>"
    en: but she had this downcast look on her face that I couldn't shake from my mind.
    ko: 최근 보여준 적 없었던 가라앉은 표정이 영 마음에 걸린다.
    ja: |-
      最近は見せることのなかった、
      あの沈んだ表情がどうしても気にかかる
  d_nikke_sin_swiftbunny_02_12:
    speaker: "<Self>"
    en: "... By the way, where's Sin? I don't think I've seen her today."
    ko: "…그런데 신은? 오늘 안 보이네?"
    ja: |-
      …ところで、シンは？
      今日は店にいないようだが
  d_nikke_sin_swiftbunny_02_13:
    speaker: ade_b
    en: Oh, she took the day off today because something urgent came up.
    ko: 아, 급한 일이 있다고 휴가를 냈어요.
    ja: あ、急用があるようで、今日はお休みです。
  d_nikke_sin_swiftbunny_02_14:
    speaker: "<Self>"
    en: Something urgent? Like what?
    ko: 급한 일? 무슨 일이래?
    ja: 急用？何かあったのか？
  d_nikke_sin_swiftbunny_02_15:
    speaker: ade_b
    en: I wasn't really told the specifics.
    ko: 자세한 사정은 저도 못 들었어요.
    ja: 詳しい事情は、私も聞いていないのです。
  d_nikke_sin_swiftbunny_02_16:
    speaker: ade_b
    en: She merely said she'll be here for sure tomorrow...
    ko: 대신 내일은 꼭 나오겠다고….
    ja: その代わり、明日は必ず出勤すると…
  d_nikke_sin_swiftbunny_02_17:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_18:
    speaker: "<Monologue>"
    en: The next morning...
    ko: 다음날 아침.
    ja: 翌朝
  d_nikke_sin_swiftbunny_02_19:
    speaker: "<Monologue>"
    en: It seems waiting for Sin before her shift at the Maid Cafe has paid off, as
      I finally run into her carrying a shopping bag.
    ko: |-
      메이드 카페 출근 시간 전부터 기다린 보람이 있었는지,
      봉투 하나를 들고 있는 신과 만날 수 있었다.
    ja: |-
      メイドの出勤時間前から
      待っていた甲斐があり、
      袋を持っているシンと会うことができた
  d_nikke_sin_swiftbunny_02_20:
    speaker: sin
    en: Counselor?
    ko: 교관?
    ja: 教官？
  d_nikke_sin_swiftbunny_02_21:
    speaker: "<Monologue>"
    en: I give her a small wave, relieved that the look on her face after spotting
      me is one of surprise rather than alarm.
    ko: 나를 본 신의 표정에 깃든 감정이 낭패가 아니라 놀람인 것에 내심 안도하며 가볍게 손을 흔든다.
    ja: |-
      私を見たシンの表情が
      気まずさではなく驚きであることに
      内心ほっとしながら、軽く手を振る
  d_nikke_sin_swiftbunny_02_22:
    speaker: "<Self>"
    en: Hey.
    ko: 안녕.
    ja: やあ
  d_nikke_sin_swiftbunny_02_23:
    speaker: sin
    en: What are you doing here?
    ko: 여기서 뭐 하고 있어?
    ja: ここで何してるの？
  d_nikke_sin_swiftbunny_02_24:
    speaker: sin
    en: The cafe's not open yet. Heck, our shifts haven't even started.
    ko: 카페 오픈 시간은커녕, 아직 우리 출근시간도 전인데?
    ja: |-
      開店時間どころか、まだ私たちの
      出勤時間にもなってないわよ？
  d_nikke_sin_swiftbunny_02_25:
    speaker: "<Self>"
    en: I was waiting for you.
    ko: 신을 기다리고 있었지.
    ja: シンを待っていたんだ
  d_nikke_sin_swiftbunny_02_26:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_27:
    speaker: sin
    en: Haha... You saw me, didn't you?
    ko: 하하. 봤구나?
    ja: はは。もしかして見ちゃったとか？
  d_nikke_sin_swiftbunny_02_28:
    speaker: "<Self>"
    en: Yeah.
    ko: 응.
    ja: ああ
  d_nikke_sin_swiftbunny_02_29:
    speaker: sin
    en: Um... When, and how much did you see?
    ko: 음… 언제, 어디까지?
    ja: その…いつ、どこまで？
  d_nikke_sin_swiftbunny_02_30:
    speaker: "<Self>"
    en: Four days ago, I saw you leave work with someone who looked suspicious.
    ko: 4일 전에 퇴근할 때, 수상한 사람이랑 같이 가는 걸 봤어.
    ja: |-
      4日前の仕事帰りに、
      怪しい人物と一緒にいるのを見かけたんだ
  d_nikke_sin_swiftbunny_02_31:
    speaker: "<Self>"
    en: And in the days after that, something seemed to be bothering you.
    ko: 그 다음부터도 뭔가 기색이 이상하기도 했고.
    ja: その後も、何だか様子がおかしかったしな
  d_nikke_sin_swiftbunny_02_32:
    speaker: sin
    en: Oh, now it makes sense.
    ko: 아아. 어쩐지~
    ja: ああ、そういうことね～
  d_nikke_sin_swiftbunny_02_33:
    speaker: sin
    en: Seeing you spend all day at the Maid Cafe for multiple days straight struck
      me as weird, even for you.
    ko: 아무리 교관이라도 며칠 내내 하루 종일 메이드 카페에 있는 건 이상하다고 생각하고 있었어.
    ja: |-
      いくら教官でも、何日も続けて
      1日中メイドカフェにいるのは
      おかしいと思ってたのよ。
  d_nikke_sin_swiftbunny_02_34:
    speaker: "<Self>"
    en: It's not that weird, what with the Dual-Class event going on right now.
    ko: 이상할 건 없지. 듀얼-클래스 이벤트 중인데.
    ja: |-
      デュアルクラスのイベント中なんだし
      別におかしくはないだろう
  d_nikke_sin_swiftbunny_02_35:
    speaker: sin
    en: Hahaha, is that so?
    ko: 하하하. 그런 거야?
    ja: あはは。そうなの？
  d_nikke_sin_swiftbunny_02_36:
    speaker: "<Self>"
    en: "... Can you tell me what's been going on?"
    ko: "…말해줄 수 있어? 무슨 일인지."
    ja: |-
      …話してくれるか？
      何があったのか
  d_nikke_sin_swiftbunny_02_37:
    speaker: sin
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_sin_swiftbunny_02_38:
    speaker: sin
    en: This isn't really the best time to get into it. For now, let's go.
    ko: 지금 당장은 좀 그렇고, 일단 가자.
    ja: 今はちょっと…とりあえず、行きましょ。
  d_nikke_sin_swiftbunny_02_39:
    speaker: "<Self>"
    en: Is the situation really that bad?
    ko: 그렇게 상황이 안 좋아?
    ja: そんなに深刻な状況なのか？
  d_nikke_sin_swiftbunny_02_40:
    speaker: sin
    en: Hm? What do you mean?
    ko: 응? 무슨 소리야?
    ja: え？どういうこと？
  d_nikke_sin_swiftbunny_02_41:
    speaker: "<Monologue>"
    en: Sin shows me the content of her shopping bag.
    ko: 신이 들고 있던 봉투의 안쪽을 보여준다.
    ja: シンが持っている袋の中を見せた
  d_nikke_sin_swiftbunny_02_42:
    speaker: "<Monologue>"
    en: "... Inside lies her bunny girl outfit."
    ko: "…바니걸 슈트가 들어 있다."
    ja: "…バニーガールスーツが入っていた"
  d_nikke_sin_swiftbunny_02_43:
    speaker: sin
    en: I gotta head to work!
    ko: 출근해야지~
    ja: 今は出勤しなくちゃでしょ～？
  d_nikke_sin_swiftbunny_02_44:
    speaker: "<Narration>"
    en: A short while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_sin_swiftbunny_02_45:
    speaker: "<Self>"
    en: "... You got scammed?"
    ko: "…사기를 당했다고?"
    ja: "…詐欺に遭った？"
  d_nikke_sin_swiftbunny_02_46:
    speaker: sin_b
    en: If you really boil it down, then yeah, pretty much.
    ko: 앞뒤 다 떼고 한마디로 요약하자면 그렇네~
    ja: 一言で言うと、そうなるわね～
  d_nikke_sin_swiftbunny_02_47:
    speaker: "<Narration>"
    en: "*Clatter*"
    ko: 달그락.
    ja: カチャ
  d_nikke_sin_swiftbunny_02_48:
    speaker: "<Monologue>"
    en: I wash dishes with Sin in the kitchen while we chat.
    ko: 신과 함께 주방에서 설거지를 하며 이야기를 나눈다.
    ja: |-
      シンと一緒にキッチンで
      皿洗いをしながら話をする
  d_nikke_sin_swiftbunny_02_49:
    speaker: "<Self>"
    en: "... I can't even imagine you getting scammed."
    ko: "…상상이 안 되는데."
    ja: "…想像がつかないな"
  d_nikke_sin_swiftbunny_02_50:
    speaker: sin_b
    en: Same here.
    ko: 나도야~
    ja: 私もよ～
  d_nikke_sin_swiftbunny_02_51:
    speaker: sin_b
    en: Literally. I never could've imagined it.
    ko: 정말. 상상도 못했어.
    ja: ほんと、考えたことすらなかったわ。
  d_nikke_sin_swiftbunny_02_52:
    speaker: "<Monologue>"
    en: Even as she says this, Sin doesn't seem particularly annoyed or frustrated.
    ko: |-
      그렇게 말하는 신의 얼굴은,
      딱히 분하거나 기분 나빠 보이지는 않는다.
    ja: |-
      そう言うシンの表情は
      特に悔しそうでも、不愉快そうでもない
  d_nikke_sin_swiftbunny_02_53:
    speaker: "<Self>"
    en: What exactly happened?
    ko: 뭐 어떻게 됐길래?
    ja: いったい何があったんだ？
  d_nikke_sin_swiftbunny_02_54:
    speaker: sin_b
    en: It's nothing big, really.
    ko: 그렇게 대단한 건 아냐.
    ja: 別に大したことじゃないわ。
  d_nikke_sin_swiftbunny_02_55:
    speaker: sin_b
    en: I basically just got a taste of what I used to do to others.
    ko: 전에 내가 하던 거랑 비슷하게 되돌려 받았을 뿐이지.
    ja: |-
      前に私がやったことが同じような形で
      返ってきただけ。
  d_nikke_sin_swiftbunny_02_56:
    speaker: "<Self>"
    en: What, so you just got tricked?
    ko: 그냥 당한 거야?
    ja: やられっぱなしか？
  d_nikke_sin_swiftbunny_02_57:
    speaker: sin_b
    en: I couldn't help it!
    ko: 어쩔 수 없잖아~!
    ja: だって仕方ないでしょ～？
  d_nikke_sin_swiftbunny_02_58:
    speaker: sin_b
    en: I'm still inexperienced when it comes to doing things properly.
    ko: 아직 이런 방식으로 해결하는 건 서투니까.
    ja: |-
      まともなやり方で解決するのは
      まだ得意じゃないんだから。
  d_nikke_sin_swiftbunny_02_59:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_60:
    speaker: sin_b
    en: Anyway... it made me realize something.
    ko: 뭐… 그래서 느꼈어.
    ja: まあ…それで思ったの。
  d_nikke_sin_swiftbunny_02_61:
    speaker: "<Monologue>"
    en: Sin places the last plate on the drying rack and dries her hands with a rag.
    ko: 신이 접시를 건조대에 놓고, 행주로 손을 닦는다.
    ja: |-
      シンは皿を水切りラックに置き、
      タオルで手を拭いた
  d_nikke_sin_swiftbunny_02_62:
    speaker: sin_b
    en: Trying to resolve things the right way...
    ko: 옳은 방식으로 일을 해결하는 건.
    ja: 正しいやり方で物事を解決するのって、
  d_nikke_sin_swiftbunny_02_63:
    speaker: sin_b
    en: It's really hard and complicated.
    ko: 참 어렵고 복잡한 거구나~ 하고.
    ja: 本当に難しくて、ややこしいんだな～って。
  d_nikke_sin_swiftbunny_02_64:
    speaker: "<Self>"
    en: "... Yeah, that's true. Oftentimes, it's not very easy."
    ko: |-
      …뭐, 그렇지.
      쉽지 않은 경우가 많아.
    ja: |-
      …まあ、そうだな。
      簡単にはいかないことが多い
  d_nikke_sin_swiftbunny_02_65:
    speaker: "<Self>"
    en: So that's what's been troubling you lately, huh?
    ko: 그거 때문에 요새 힘들었던 거구나?
    ja: それでこの頃大変そうにしていたんだな？
  d_nikke_sin_swiftbunny_02_66:
    speaker: sin_b
    en: Well, it's one thing...
    ko: 그것도 있고….
    ja: それもあるし…
  d_nikke_sin_swiftbunny_02_67:
    speaker: sin_b
    en: I've also been going around and meeting a lot of different people in my free
      time.
    ko: |-
      요새 시간이 날 때마다 좀 돌아다니면서,
      이 사람 저 사람 만나고 다녔거든.
    ja: |-
      ここ最近は時間があるたびに、あちこち出歩いて
      色んな人に会ってたの。
  d_nikke_sin_swiftbunny_02_68:
    speaker: "<Self>"
    en: What for?
    ko: 왜?
    ja: なぜだ？
  d_nikke_sin_swiftbunny_02_69:
    speaker: sin_b
    en: Oh, no particular reason...
    ko: 특별한 이유가 있는 건 아니고~
    ja: 何か特別な理由があるわけじゃないんだけど～
  d_nikke_sin_swiftbunny_02_70:
    speaker: sin_b
    en: I just... Hm...
    ko: 그냥… 음….
    ja: なんとなく…その…
  d_nikke_sin_swiftbunny_02_71:
    speaker: sin_b
    en: I wanted to meet up and have a chat, I guess.
    ko: 만나서 이야기를 좀 해보고 싶었달까?
    ja: 会って、話をしてみたかったっていうか。
  d_nikke_sin_swiftbunny_02_72:
    speaker: "<Self>"
    en: A chat?
    ko: 이야기?
    ja: 話？
  d_nikke_sin_swiftbunny_02_73:
    speaker: sin_b
    en: Yeah. A "proper" chat.
    ko: 응. [제대로 된] 이야기.
    ja: うん。「ちゃんとした」話。
  d_nikke_sin_swiftbunny_02_74:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_75:
    speaker: sin_b
    en: Along the way, I just happened to meet someone I knew back from the Rehabilitation
      Center.
    ko: 그러다 우연히, 예전에 갱생관에서 엮였던 사람이랑 만났어.
    ja: |-
      そしたら偶然、
      昔の更生館の知り合いに会ったの。
  d_nikke_sin_swiftbunny_02_76:
    speaker: sin_b
    en: He's probably the one you saw a few nights ago.
    ko: 아마 교관이 봤던 게 그 사람이겠지.
    ja: 多分、教官が見たのはその人。
  d_nikke_sin_swiftbunny_02_77:
    speaker: sin_b
    en: I felt... strange.
    ko: 뭔가… 이상한 기분이 들더라.
    ja: なんだか…妙な気持ちになったのよね。
  d_nikke_sin_swiftbunny_02_78:
    speaker: "<Self>"
    en: "... Strange how?"
    ko: "…어떤 기분이 들었어?"
    ja: "…どんな気持ちだ？"
  d_nikke_sin_swiftbunny_02_79:
    speaker: sin_b
    en: I don't know, like...
    ko: 음, 글쎄….
    ja: うーん、そうね…
  d_nikke_sin_swiftbunny_02_80:
    speaker: sin_b
    en: Apologetic? Ashamed?
    ko: 미안함? 부끄러움?
    ja: |-
      申し訳ないっていうか、
      恥ずかしいっていうか？
  d_nikke_sin_swiftbunny_02_81:
    speaker: sin_b
    en: Like I wanted to run away? Like I didn't want to see him?
    ko: 도망치고 싶다? 마주하고 싶지 않다?
    ja: |-
      逃げ出したいっていうか、
      向き合いたくないっていうか？
  d_nikke_sin_swiftbunny_02_82:
    speaker: sin_b
    en: It's hard to say exactly what I felt, but it was something like that.
    ko: 정확히 콕 집을 수는 없지만… 그런 비슷한 느낌이었어.
    ja: |-
      はっきりとは言えないんだけど…
      そんな感じかしら。
  d_nikke_sin_swiftbunny_02_83:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_84:
    speaker: sin_b
    en: Haha, I had no idea it would lead to me getting roped into some scam.
    ko: 하하. 그러다 이렇게 이상하게 말려들게 될지는 몰랐지~
    ja: |-
      はは。そこからこんなヘンなことに
      巻き込まれるとは思わなかったわ～
  d_nikke_sin_swiftbunny_02_85:
    speaker: sin_b
    en: Still, I'm trying my best to figure this out by myself.
    ko: 뭐, 그래도 어떻게든 혼자 해보려고 힘내는 중이야~
    ja: |-
      まあ、それでもなんとか
      1人で頑張ってるところよ～
  d_nikke_sin_swiftbunny_02_86:
    speaker: "<Self>"
    en: I'll help.
    ko: 도와줄게.
    ja: 手を貸そう
  d_nikke_sin_swiftbunny_02_87:
    speaker: sin_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_88:
    speaker: "<Monologue>"
    en: Sin, who had been sorting ingredients for the afternoon shift, suddenly stops.
    ko: 오후 영업을 위한 재료를 정리하던 신의 손이 멈춘다.
    ja: |-
      午後の営業に向けて材料を整理していた
      シンの手が止まった
  d_nikke_sin_swiftbunny_02_89:
    speaker: "<Monologue>"
    en: After staring at the floor for a while, she shifts her gaze toward me.
    ko: 한동안 바닥을 바라보던 신의 시선이 내게 향한다.
    ja: |-
      しばらく床を見つめていたシンの視線が
      私に向けられる
  d_nikke_sin_swiftbunny_02_90:
    speaker: sin_b
    en: "... That's not how it's supposed to work by my current standards."
    ko: "…그건 지금 내 기준에선 제대로 된 방식이 아닌데~?"
    ja: |-
      …それ、今の私の基準だと、
      ちゃんとしたやり方じゃないんだけど～？
  d_nikke_sin_swiftbunny_02_91:
    speaker: "<Self>"
    en: Then how should it work?
    ko: 그럼?
    ja: それなら？
  d_nikke_sin_swiftbunny_02_92:
    speaker: "<Monologue>"
    en: Sin turns to face me.
    ko: 신이 내게 돌아선다.
    ja: シンは私の方を向いた
  d_nikke_sin_swiftbunny_02_93:
    speaker: sin_b
    en: "... Please help me, Counselor."
    ko: "…도와줘. 교관."
    ja: "…助けて、教官。"
  d_nikke_sin_swiftbunny_02_94:
    speaker: sin_b
    en: I can't do this alone.
    ko: 나 혼자서는 역부족이야.
    ja: 私だけじゃ、たいへんなの。
  d_nikke_sin_swiftbunny_02_95:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_96:
    speaker: sin_b
    en: What?
    ko: 왜?
    ja: どうしたの？
  d_nikke_sin_swiftbunny_02_97:
    speaker: "<Self>"
    en: "... I'm still not used to this."
    ko: "…아직 적응이 안 돼서."
    ja: "…まだ慣れなくてな"
  d_nikke_sin_swiftbunny_02_98:
    speaker: "<Self>"
    en: But I'm proud of you.
    ko: 그래도 장하다.
    ja: それでも、えらいぞ
  d_nikke_sin_swiftbunny_02_99:
    speaker: sin_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_02_100:
    speaker: sin_b
    en: Haha, you're not the only one who isn't used to this.
    ko: 하하. 적응 안 되는 건 피차 마찬가지야.
    ja: あはは。慣れてないのはお互い様よ。
d_nikke_sin_swiftbunny_03:
  d_nikke_sin_swiftbunny_03_1:
    speaker: "<Narration>"
    en: After the Maid Cafe closes...
    ko: 메이드 카페 영업이 끝난 후.
    ja: メイドカフェの営業終了後
  d_nikke_sin_swiftbunny_03_2:
    speaker: "<Self>"
    en: Wh-what the...?
    ko: 뭐, 뭐야.
    ja: な、何だ…
  d_nikke_sin_swiftbunny_03_3:
    speaker: sin_b
    en: Hm? What's wrong?
    ko: 응? 뭐가~?
    ja: え？何が～？
  d_nikke_sin_swiftbunny_03_4:
    speaker: "<Self>"
    en: No, it's just...
    ko: 아니, 그게….
    ja: いや、その…
  d_nikke_sin_swiftbunny_03_5:
    speaker: "<Self>"
    en: "... I assumed it'd be the two of us who were going to take care of this."
    ko: "…나는 당연히 둘이서 해결하러 가는 건 줄 알았어."
    ja: |-
      …てっきり、2人で
      解決するものだと思っていたのだが
  d_nikke_sin_swiftbunny_03_6:
    speaker: sin_b
    en: Since I'd already decided to ask for help, I figured I'd ask my friends, too.
    ko: 이왕 도움을 청하기로 했는데, 친구들한테도 말해야지~
    ja: |-
      せっかくだから、みんなにも
      声をかけなきゃね～
  d_nikke_sin_swiftbunny_03_7:
    speaker: mast_m
    en: That's right! I can't just sit back and watch when my friend is in trouble!
    ko: 그렇수다! 친구가 위험에 처했는데 가만히 있을 수는 없지 않수!
    ja: |-
      その通りっ！仲間がピンチだってのに、
      じっとしてられるかぁ！？
  d_nikke_sin_swiftbunny_03_8:
    speaker: mast_m
    en: So, what's this all about? I'll do whatever I can to help!
    ko: 그래서, 무슨 일인 거요? 뭐든 도와주겠수다!
    ja: |-
      それで、何があったんだ？
      何でも力になるぜぇ！
  d_nikke_sin_swiftbunny_03_9:
    speaker: "<Self>"
    en: You came without even knowing what's going on, huh...?
    ko: 뭔지도 모르고 왔구나….
    ja: 事情も知らずに来たのか…
  d_nikke_sin_swiftbunny_03_10:
    speaker: anchor_m
    en: Sin got scammed.
    ko: 신이 사기를 당했다던데.
    ja: シンが詐欺に遭ったみたい。
  d_nikke_sin_swiftbunny_03_11:
    speaker: trony_m
    en: S-s-scammed...?!
    ko: 사, 사사사기…?!
    ja: さ、さささ詐欺…！？
  d_nikke_sin_swiftbunny_03_12:
    speaker: sin_b
    en: Yeah. I got caught up with someone kinda nasty, so I'm really in a pinch.
    ko: 맞아~ 좀 악질적으로 걸려서 많이 곤란해.
    ja: |-
      そうなの～。ちょっと悪質なやつに
      引っかかっちゃって、すっごく困ってるのよね～
  d_nikke_sin_swiftbunny_03_13:
    speaker: mast_m
    en: Wow, I never would've guessed you had a naive side to you, too.
    ko: 거, 신 양반도 세상 물정 모르는 순진한 면이 있었구만!
    ja: |-
      いやあ、シンさんにも世間知らずで
      ウブなところがあったんだなぁ！
  d_nikke_sin_swiftbunny_03_14:
    speaker: sin_b
    en: Yeah, it feels so different with the roles reversed.
    ko: 그러게~ 입장이 반대가 되니까 이렇게나 다르구나~
    ja: |-
      そうね～
      逆の立場って、こんな感じなのね～
  d_nikke_sin_swiftbunny_03_15:
    speaker: "<Self>"
    en: Still...
    ko: "…그런데 말이야."
    ja: "…これだ"
  d_nikke_sin_swiftbunny_03_16:
    speaker: "<Narration>"
    en: "*Flip*"
    ko: 팔락.
    ja: パラッ
  d_nikke_sin_swiftbunny_03_17:
    speaker: "<Monologue>"
    en: I pull out one of the fliers that the group who scammed Sin has been handing
      out.
    ko: 신에게 사기를 친 일당이 뿌리고 있다는 전단지를 꺼내든다.
    ja: |-
      シンを騙した一味が配っているという
      チラシを取り出した
  d_nikke_sin_swiftbunny_03_18:
    speaker: "<Narration>"
    en: '"The best heated mats in the universe! 100% authentic gold!"'
    ko: "[우주최강 옥장판 진짜리얼황금옥]"
    ja: "「宇宙最強健康マット、純金製」"
  d_nikke_sin_swiftbunny_03_19:
    speaker: "<Narration>"
    en: '"Benefits include helping you grow taller, reducing noise between floors,
      and super-infrared rays that promote health!"'
    ko: "[놀라운 효능 : 신장 증가 / 초적외선 발산 / 층간소음 감소]"
    ja: |-
      「驚きの効果：身長伸長、
      　超赤外線放出、騒音を軽減」
  d_nikke_sin_swiftbunny_03_20:
    speaker: "<Narration>"
    en: '"Customers who show this flier will be allowed to buy two extras!"'
    ko: "[해당 전단지 소지 시 추가 2개 구매 기회 증정]"
    ja: |-
      「本チラシをご持参の方は
      　追加で2点購入可能」
  d_nikke_sin_swiftbunny_03_21:
    speaker: "<Narration>"
    en: '"We ship anywhere in the Ark, and even to the surface! (Shipping charges
      apply)"'
    ko: "[방주는 당연, 지상도 어디든지 배송 가능(배송비 별도)]"
    ja: |-
      「アークはもちろん、
      　地上のどこでも配送可能（送料別）」
  d_nikke_sin_swiftbunny_03_22:
    speaker: "<Self>"
    en: Heated mats...? Really?
    ko: 아무리 그래도 옥장판은 좀….
    ja: いくら何でも健康マットは…
  d_nikke_sin_swiftbunny_03_23:
    speaker: "<Self>"
    en: These claims practically scream "scam."
    ko: 이거 멘트도 그렇고… 누가 봐도 사기잖아.
    ja: |-
      このキャッチコピーも…
      どう見ても詐欺だろう
  d_nikke_sin_swiftbunny_03_24:
    speaker: sin_b
    en: Yeah, it is pretty suspicious, huh?
    ko: 역시 좀 그렇지?
    ja: やっぱりちょっとアレよね？
  d_nikke_sin_swiftbunny_03_25:
    speaker: mast_m
    en: Wh-what?!
    ko: 엑, 이거?!
    ja: えっ！？
  d_nikke_sin_swiftbunny_03_26:
    speaker: mast_m
    en: Th-this is a scam?
    ko: 이, 이거 사기였수?
    ja: こ、これって詐欺だったのか！？
  d_nikke_sin_swiftbunny_03_27:
    speaker: "<Self>"
    en: "... Don't tell me you fell for it too, Mast."
    ko: "…설마 마스트도 샀어?"
    ja: "…まさか、マストも買ったのか？"
  d_nikke_sin_swiftbunny_03_28:
    speaker: mast_m
    en: W-well...
    ko: 그, 그게….
    ja: そ、その…
  d_nikke_sin_swiftbunny_03_29:
    speaker: anchor_m
    en: She recently gave one of these to both me and Helm.
    ko: 얼마 전에 나랑 헬름한테도 줬어.
    ja: この前、私とヘルムにもくれたよ。
  d_nikke_sin_swiftbunny_03_30:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_03_31:
    speaker: mast_m
    en: I mean...
    ko: 아니, 그게….
    ja: いや、その…
  d_nikke_sin_swiftbunny_03_32:
    speaker: mast_m
    en: Whenever I lie down on it, it melts away all the fatigue from cleaning the
      deck the whole day...
    ko: 틀어 놓고 좀 지지면 하루 종일 갑판 청소한 피로가 싹 풀렸단 말요….
    ja: |-
      これでに寝転んで体を温めると、
      甲板掃除の疲れが吹き飛ぶんだ…
  d_nikke_sin_swiftbunny_03_33:
    speaker: anchor_m
    en: You sound like an old man.
    ko: 아저씨 같아.
    ja: おじさんみたい。
  d_nikke_sin_swiftbunny_03_34:
    speaker: mast_m
    en: How can you say that to a sprightly young lady like me, Anchor?!
    ko: 꽃다운 소녀한테 그게 무슨 말이요, 앵커 양반!
    ja: |-
      うら若き乙女に向かって何てこと言うんだよ、
      アンカーさん！
  d_nikke_sin_swiftbunny_03_35:
    speaker: "<Monologue>"
    en: After bickering with Anchor for a while, Mast turns to Sin.
    ko: 한동안 앵커와 투닥거리던 마스트가 신을 본다.
    ja: |-
      しばらくアンカーと言い争っていたマストが
      シンを見た
  d_nikke_sin_swiftbunny_03_36:
    speaker: mast_m
    en: By the way, how did you even end up getting scammed in the first place?
    ko: 그런데, 대체 어쩌다 이런 사기에 당한 거요?
    ja: |-
      ところで、どうしてこんな詐欺に
      引っかかったんだ？
  d_nikke_sin_swiftbunny_03_37:
    speaker: mast_m
    en: I mean, I bought one because I genuinely wanted it, but you're not really
      the type to fall for something like this.
    ko: |-
      나야 진짜 갖고 싶어서 샀지만,
      신 양반이 이런 수작에 넘어갈 것 같지는 않수.
    ja: |-
      私は本当に欲しくて買ったけど、
      シンさんがこんな手口に引っかかるとは
      思えないぜ。
  d_nikke_sin_swiftbunny_03_38:
    speaker: anchor_m
    en: Were you blackmailed?
    ko: 협박당했어?
    ja: 脅されたの？
  d_nikke_sin_swiftbunny_03_39:
    speaker: sin_b
    en: No, nothing like that.
    ko: 그건 아니야.
    ja: そういうわけじゃないわ。
  d_nikke_sin_swiftbunny_03_40:
    speaker: sin_b
    en: The exaggerated ads and prices are problematic, but the whole transaction
      itself was legit.
    ko: 과대 광고랑 가격이 문제지, 행동은 그냥 정당한 영업이었으니까.
    ja: |-
      誇大広告と価格に問題はあるけど、
      ちゃんとした営業だったから。
  d_nikke_sin_swiftbunny_03_41:
    speaker: sin_b
    en: It's just...
    ko: 다만….
    ja: でも…
  d_nikke_sin_swiftbunny_03_42:
    speaker: "<Monologue>"
    en: Sin gazes at the maids for a moment.
    ko: 신이 잠시 메이드들을 바라본다.
    ja: シンはしばらくメイドたちを見つめた
  d_nikke_sin_swiftbunny_03_43:
    speaker: sin_b
    en: It's the salesman who was the issue.
    ko: 다만, 그 영업을 한 사람이 문제였어.
    ja: その営業をしてきた相手が問題だったのかも。
  d_nikke_sin_swiftbunny_03_44:
    speaker: sin_b
    en: He's kind of an old acquaintance.
    ko: 예전에, 조금 엮였던 사람이거든.
    ja: 昔のちょっとした知り合いで…
  d_nikke_sin_swiftbunny_03_45:
    speaker: sin_b
    en: "... Someone I know from the Rehabilitation Center."
    ko: "…갱생관에 있을 때."
    ja: "…更生館にいた頃の。"
  d_nikke_sin_swiftbunny_03_46:
    speaker: mast_m
    en: Hmm...
    ko: "…흠."
    ja: "…なるほど。"
  d_nikke_sin_swiftbunny_03_47:
    speaker: sin_b
    en: I mean... he did use that against me to make the sale, so I guess you could
      call it blackmail.
    ko: 뭐… 그걸 구실 삼았으니까 협박이라고 할 수도 있으려나?
    ja: |-
      まあ…それを口実にされたわけだし
      ある意味、脅迫かもね？
  d_nikke_sin_swiftbunny_03_48:
    speaker: sin_b
    en: He realized that I wouldn't be able to refuse, so he sunk his teeth in and
      wouldn't let go.
    ko: 내가 절대로 거절하지 못할 상황이라는 걸 눈치채고 그걸 물고 늘어졌어.
    ja: |-
      私が絶対に断れないってことを見抜いて、
      しつこく食い下がってきたの。
  d_nikke_sin_swiftbunny_03_49:
    speaker: mast_m
    en: That's an old trick.
    ko: 흔한 수법이구만.
    ja: よくある手口だ。
  d_nikke_sin_swiftbunny_03_50:
    speaker: mast_m
    en: No one catches on to that sort of thing quicker than a con artist.
    ko: 사기꾼 양반들만큼 눈치가 빠른 것도 없수다.
    ja: |-
      詐欺師の連中ほど
      勘が鋭い奴らはいねえからな。
  d_nikke_sin_swiftbunny_03_51:
    speaker: anchor_m
    en: And you still fell for it, knowing that?
    ko: 마스트는 그걸 알면서도 당한 거야?
    ja: マストは分かってて引っかかったの？
  d_nikke_sin_swiftbunny_03_52:
    speaker: mast_m
    en: Like I said, I bought mine because I actually wanted it!
    ko: 거 나는 갖고 싶어서 샀다니까!
    ja: |-
      私は欲しくて買ったんだって
      言ってるだろ！
  d_nikke_sin_swiftbunny_03_53:
    speaker: "<Self>"
    en: When you say you couldn't refuse, was there a specific reason for that?
    ko: 거절 못할 상황이라는 건, 다른 무슨 일이 또 있었어?
    ja: |-
      絶対に断れないとは、
      他に何かあったのか？
  d_nikke_sin_swiftbunny_03_54:
    speaker: sin_b
    en: Well...
    ko: 그게….
    ja: それが…
  d_nikke_sin_swiftbunny_03_55:
    speaker: "<Monologue>"
    en: Sin glances over at me before smiling and slumping her shoulders.
    ko: 신이 나를 슬쩍 보더니, 웃으며 어깨를 축 늘어뜨린다.
    ja: |-
      シンは私をちらっと見ると、
      苦笑いをして肩を落とした
  d_nikke_sin_swiftbunny_03_56:
    speaker: sin_b
    en: It turns out refusing is harder than I thought.
    ko: 거절한다는 게 생각보다 어렵더라고.
    ja: 断るのって思ったより難しくて。
  d_nikke_sin_swiftbunny_03_57:
    speaker: "<Self>"
    en: "... Huh?"
    ko: "…응?"
    ja: "…ん？"
  d_nikke_sin_swiftbunny_03_58:
    speaker: mast_m
    en: Refusing is... hard?
    ko: "…거절 말요?"
    ja: "…断るって？"
  d_nikke_sin_swiftbunny_03_59:
    speaker: mast_m
    en: As in, saying no?
    ko: 싫다고 말하는 그 거절??
    ja: いらないって言うことか！？
  d_nikke_sin_swiftbunny_03_60:
    speaker: sin_b
    en: Yeah.
    ko: 응.
    ja: うん。
  d_nikke_sin_swiftbunny_03_61:
    speaker: mast_m
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_03_62:
    speaker: mast_m
    en: What's so hard about it?
    ko: 그게 왜 어렵수…?
    ja: それの何が難しいんだぁ…？
  d_nikke_sin_swiftbunny_03_63:
    speaker: sin_b
    en: I've never had to do it before, nor have I ever been rejected myself.
    ko: 거절이란 거. 이전까진 해본 적도, 당해본 적도 없으니까.
    ja: |-
      断るなんて、今までしたことも
      されたこともなかったの。
  d_nikke_sin_swiftbunny_03_64:
    speaker: sin_b
    en: So I'm kind of bad at it.
    ko: 그래서 좀 서툴러.
    ja: だから、ちょっと苦手で。
  d_nikke_sin_swiftbunny_03_65:
    speaker: mast_m
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_03_66:
    speaker: mast_m
    en: I... never even thought of it as something you could be bad at.
    ko: 그, 그럴 수가 있는 거요…?
    ja: そ、そんなことってあるのか…？
  d_nikke_sin_swiftbunny_03_67:
    speaker: mast_m
    en: I-it's like my world has been turned upside down...!
    ko: 뭐, 뭔가… 지금까지 내가 알던 세상이랑은 다른 것 같수다…!
    ja: |-
      な、何だか…今まで私が知ってた
      世界とは違う世界の話みたいだ…！
  d_nikke_sin_swiftbunny_03_68:
    speaker: trony_m
    en: I-I understand. Saying no isn't easy...
    ko: |-
      나, 나는 이해해.
      쉽지 않아, 응….
    ja: わ、私には分かるよ。難しいよね…
  d_nikke_sin_swiftbunny_03_69:
    speaker: sin_b
    en: Exactly!
    ko: 그렇다니까~
    ja: そうなのよ～
  d_nikke_sin_swiftbunny_03_70:
    speaker: mast_m
    en: Huh...
    ko: 허어….
    ja: へぇ…
  d_nikke_sin_swiftbunny_03_71:
    speaker: sin_b
    en: I mean... that's not exactly the only reason I said yes, but it's a big part
      of it.
    ko: 뭐… 온전히 그것 때문이냐고 하면 그건 아니지만.
    ja: |-
      まあ…それだけが理由かって言われると
      そうでもないんだけど。
  d_nikke_sin_swiftbunny_03_72:
    speaker: sin_b
    en: Anyway, I wanted to take care of this the proper way, but it's tricky.
    ko: 어떻게든… [제대로] 돌려놓고 싶었는데, 쉽지 않더라고.
    ja: |-
      どうにかして…「ちゃんと」
      返品したかったんだけど、
      なかなか上手くいかなくて。
  d_nikke_sin_swiftbunny_03_73:
    speaker: sin_b
    en: I thought about reporting them,
    ko: 신고… 도 해보려고 하긴 했는데.
    ja: 通報も…しようとしたんだけど。
  d_nikke_sin_swiftbunny_03_74:
    speaker: sin_b
    en: but since they're technically a legitimate business and didn't use actual
      force, there wasn't really anything to report.
    ko: 일단 제대로 허가받은 업체고, 판매할 때도 강압은 없어서 별수 없었어.
    ja: |-
      一応ちゃんと許可を取ってる業者だし、
      強引に売りつけられたわけじゃなかったから
      どうしようもなかったのよね。
  d_nikke_sin_swiftbunny_03_75:
    speaker: "<Self>"
    en: Have you been looking into them?
    ko: 따로 조사해 봤어?
    ja: 自分で調査はしたのか？
  d_nikke_sin_swiftbunny_03_76:
    speaker: sin_b
    en: Just a bit of searching, that's all.
    ko: 그냥 검색 좀 해본 정도야.
    ja: ちょっと検索してみただけ。
  d_nikke_sin_swiftbunny_03_77:
    speaker: sin_b
    en: '... I could''ve gotten my hands on their ledger if I''d made some "requests,"
      but I didn''t want to resort to that.'
    ko: |-
      …[부탁] 몇 번만 하면 걔네 장부까지 손에 넣을 수 있었겠지만,
      그러고 싶지 않으니까.
    ja: |-
      …何回か「お願い」すれば、
      あいつらの帳簿まで手に入ったんだろうけど
      そうしたくはなかったから。
  d_nikke_sin_swiftbunny_03_78:
    speaker: trony_m
    en: Y-yeah. F-fighting crime with crime is probably...
    ko: 으, 응. 범죄에 범죄로 대, 대응해도 괜찮은 건….
    ja: |-
      う、うん。犯罪に犯罪で
      た、対抗していいのは…
  d_nikke_sin_swiftbunny_03_79:
    speaker: trony_m
    en: b-best left to all the antiheroes in movies...
    ko: 여, 영화 속 다크 히어로 정도야….
    ja: え、映画の中のダークヒーローだけだし…
  d_nikke_sin_swiftbunny_03_80:
    speaker: mast_m
    en: Heheh, that's why we're here today.
    ko: 헹. 그래서 우리가 모였지 않수.
    ja: |-
      えっへん。だからこそ、こうして私たちが
      集まったんだっ。
  d_nikke_sin_swiftbunny_03_81:
    speaker: mast_m
    en: Let's barge in and turn the whole place upside down!
    ko: 쳐들어가서 엎어 버리면 되겠지!
    ja: 乗り込んで、大暴れしてやろうぜ！
  d_nikke_sin_swiftbunny_03_82:
    speaker: sin_b
    en: As I've been saying, that's exactly what I want to avoid.
    ko: 그러기 싫다고 했잖아~
    ja: そういうのはイヤだって言ったでしょ～？
  d_nikke_sin_swiftbunny_03_83:
    speaker: anchor_m
    en: Then what should we do?
    ko: 그러면 어떻게 해?
    ja: じゃあ、どうするの？
  d_nikke_sin_swiftbunny_03_84:
    speaker: "<Self>"
    en: Want me to get someone to take care of it?
    ko: 내가 처리해달라고 할까?
    ja: 私から頼もうか？
  d_nikke_sin_swiftbunny_03_85:
    speaker: "<Monologue>"
    en: I pull out my phone and open my contacts.
    ko: 핸드폰을 꺼내 주소록을 연다.
    ja: 携帯電話を取り出してアドレス帳を開く
  d_nikke_sin_swiftbunny_03_86:
    speaker: "<Self>"
    en: It shouldn't be too hard, since there have been victims and we have physical
      evidence.
    ko: 증거품도 있고, 피해자도 있으니까 별로 어렵지는 않을 거야.
    ja: |-
      証拠品も被害者もそろっている。
      そんなに難しくはないはずだ
  d_nikke_sin_swiftbunny_03_87:
    speaker: sin_b
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_sin_swiftbunny_03_88:
    speaker: "<Monologue>"
    en: After thinking about it for a moment, Sin shakes her head.
    ko: 잠시 고민하던 신이 고개를 젓는다.
    ja: シンは少し悩み、首を横に振った
  d_nikke_sin_swiftbunny_03_89:
    speaker: sin_b
    en: "... No, that doesn't feel right."
    ko: "…아니. 그건 좀 아닌 것 같아."
    ja: "…ううん。それはちょっと違うかも。"
  d_nikke_sin_swiftbunny_03_90:
    speaker: sin_b
    en: I'm not saying that your way is wrong.
    ko: 물론 교관의 방식이 옳지 않은 건 아니지만.
    ja: |-
      もちろん、教官のやり方が
      間違ってるってわけじゃないけど。
  d_nikke_sin_swiftbunny_03_91:
    speaker: sin_b
    en: It's just...
    ko: 그래도….
    ja: でも…
  d_nikke_sin_swiftbunny_03_92:
    speaker: mast_m
    en: You want to handle it yourself.
    ko: 직접 해결하고 싶다는 거구만.
    ja: 自分で解決したいってことだな。
  d_nikke_sin_swiftbunny_03_93:
    speaker: sin_b
    en: Exactly.
    ko: 정답~
    ja: 正解～
  d_nikke_sin_swiftbunny_03_94:
    speaker: trony_m
    en: H-huh? Then wh-what about us...?
    ko: 에, 에? 그럼 우, 우리는…?
    ja: |-
      え、えっ？
      じゃあ、わ、私たちは…？
  d_nikke_sin_swiftbunny_03_95:
    speaker: mast_m
    en: Help from friends doesn't count! That's one of the marks of a great adventure!
    ko: 친구의 도움은 노카운트인 게 로망 아니겠수!
    ja: |-
      仲間の助けはノーカウントってのが
      ロマンってやつだ！
  d_nikke_sin_swiftbunny_03_96:
    speaker: sin_b
    en: Hahaha. I hadn't really thought about it, but that sounds about right.
    ko: 하하하. 그 생각까지는 못했는데, 맞는 것 같아.
    ja: |-
      あはは。そこまでは考えてなかったけど、
      その通りかもね。
  d_nikke_sin_swiftbunny_03_97:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_03_98:
    speaker: "<Self>"
    en: Okay. I respect your decision.
    ko: |-
      알았어.
      나도 신의 생각을 존중할게.
    ja: |-
      分かった。
      シンの考えを尊重しよう
  d_nikke_sin_swiftbunny_03_99:
    speaker: "<Monologue>"
    en: I put my phone away and take a moment to think.
    ko: 핸드폰을 집어넣고, 잠시 고민한다.
    ja: 携帯電話をしまい、しばらく考えた
  d_nikke_sin_swiftbunny_03_100:
    speaker: "<Self>"
    en: "... All right, I've got a plan."
    ko: "…그럼, 이렇게 하자."
    ja: "…じゃあ、こうしよう"
d_nikke_sin_swiftbunny_04:
  d_nikke_sin_swiftbunny_04_1:
    speaker: "<Narration>"
    en: A short while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_sin_swiftbunny_04_2:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_3:
    speaker: sin
    en: Do you really think it'll work?
    ko: 진짜 이런 걸로 돼?
    ja: 本当にこんなのでいいの？
  d_nikke_sin_swiftbunny_04_4:
    speaker: "<Self>"
    en: The thing about words is that they hold more power as you bring more of them
      together.
    ko: "…[말]은 말이야, 모이면 모일수록 힘이 생겨."
    ja: |-
      …「言葉」っていうのは、
      集まれば集まるほど力を持つ
  d_nikke_sin_swiftbunny_04_5:
    speaker: "<Self>"
    en: Granted, that power can just as easily take things in a bad direction...
    ko: 그 방향성이 안 좋은 쪽으로 흘러갈 수도 있지만….
    ja: |-
      それが悪い方に
      流れてしまうこともあるが…
  d_nikke_sin_swiftbunny_04_6:
    speaker: "<Monologue>"
    en: I take a piece of paper with Mast's name written on it,
    ko: 지금은 마스트의 이름만 쓰여 있는,
    ja: 今はマストの名前だけが載っている、
  d_nikke_sin_swiftbunny_04_7:
    speaker: "<Monologue>"
    en: as well as the heading, "Heated Mat Fraud Victims," and hand it to Sin.
    ko: "[옥장판 사기 피해자 명단]이라고 적힌 종이를 신에게 건넨다."
    ja: |-
      「健康マット詐欺被害者リスト」と書かれた
      紙をシンに渡した
  d_nikke_sin_swiftbunny_04_8:
    speaker: "<Self>"
    en: It all depends on the speaker's intent.
    ko: 그건 말을 하는 사람의 의도에 달린 거니까.
    ja: |-
      それは、言葉を口にする人の
      意図次第だ
  d_nikke_sin_swiftbunny_04_9:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_10:
    speaker: "<Self>"
    en: This won't be easy.
    ko: 아마 쉽지는 않을 거야.
    ja: きっと簡単ではないだろう
  d_nikke_sin_swiftbunny_04_11:
    speaker: "<Self>"
    en: Some of these people might not realize that they've been deceived,
    ko: 사기를 당한 사람 중엔 자기가 사기를 당했다는 걸 모르는 사람도 있을 거고,
    ja: |-
      騙された人の中には、自分が騙されたことに
      気づいていない人もいるだろうし…
  d_nikke_sin_swiftbunny_04_12:
    speaker: "<Self>"
    en: and others might not even want to admit it.
    ko: 심지어는 사기를 당한 걸 인정하고 싶지 않아 하는 사람도 있을 테니까.
    ja: |-
      騙されたことを認めたがらない人だって
      いるはずだからな
  d_nikke_sin_swiftbunny_04_13:
    speaker: "<Self>"
    en: Your job this time is to convince those people to use their voices for the
      right cause.
    ko: |-
      그런 사람들을 설득해서 옳은 방향으로 목소리를 내게 만드는 게,
      이번에 신이 할 일이야.
    ja: |-
      今回シンがやるべきことは、
      そういう人たちを説得して
      正しい方向へと声を上げさせることだ
  d_nikke_sin_swiftbunny_04_14:
    speaker: sin
    en: "... That really doesn't sound easy."
    ko: "…정말 쉽지 않겠네~"
    ja: "…それはホントに大変そうね～"
  d_nikke_sin_swiftbunny_04_15:
    speaker: sin
    en: It'd be simple if I took off my converter, though.
    ko: 컨버터를 벗으면 간단하겠지만.
    ja: コンバーターを外せば簡単なのに。
  d_nikke_sin_swiftbunny_04_16:
    speaker: "<Self>"
    en: Well... yeah.
    ko: 뭐… 그렇지.
    ja: まあ…そうだな
  d_nikke_sin_swiftbunny_04_17:
    speaker: sin
    en: "... Which do you think would be better?"
    ko: "…어느 쪽이 나을 것 같아?"
    ja: "…どっちがいいかしら？"
  d_nikke_sin_swiftbunny_04_18:
    speaker: "<Self>"
    en: What do you mean?
    ko: 응?
    ja: ん？
  d_nikke_sin_swiftbunny_04_19:
    speaker: sin
    en: Between the bunny girl outfit and my normal outfit, which would get my point
      across better?
    ko: 바니걸이랑 평상복 중에, 어느 쪽이 내 말이 더 잘 전해질까?
    ja: |-
      バニーガールと普段着、どっちの方が
      私の言葉が伝わりやすいと思う？
  d_nikke_sin_swiftbunny_04_20:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_21:
    speaker: "<Self>"
    en: I mean, I like the bunny girl outfit, but maybe not for this occasion.
    ko: 나는 바니걸이 좋긴 한데, 좀 그렇긴 하지?
    ja: |-
      私はバニーガールの方が好きだが、
      やっぱりちょっとあれだよな？
  d_nikke_sin_swiftbunny_04_22:
    speaker: sin
    en: Hahaha!
    ko: 하하하.
    ja: あはは。
  d_nikke_sin_swiftbunny_04_23:
    speaker: "<Monologue>"
    en: In front of a house in the residential area...
    ko: 주택가의 한 가정집 앞.
    ja: 住宅街の民家の前
  d_nikke_sin_swiftbunny_04_24:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_25:
    speaker: "<Monologue>"
    en: Sin slightly hesitates before carefully ringing the doorbell.
    ko: 잠시 망설이던 신이, 조심스럽게 초인종을 누른다.
    ja: |-
      シンはしばらくためらうと、
      おそるおそるインターホンを押した
  d_nikke_sin_swiftbunny_04_26:
    speaker: "<Narration>"
    en: The door creaks open.
    ko: 달칵.
    ja: ガチャッ
  d_nikke_sin_swiftbunny_04_27:
    speaker: sharpgrandma
    en: "... Who are you?"
    ko: "…누구요?"
    ja: "…どちら様？"
  d_nikke_sin_swiftbunny_04_28:
    speaker: sin
    en: Um...
    ko: 그….
    ja: あの…
  d_nikke_sin_swiftbunny_04_29:
    speaker: "<Monologue>"
    en: Sin glances over at me.
    ko: 신이 나를 흘깃 본다.
    ja: シンが私をちらっと見る
  d_nikke_sin_swiftbunny_04_30:
    speaker: "<Self>"
    en: Just do what you practiced.
    ko: 연습한 대로 해.
    ja: 練習通りにやれば大丈夫だ
  d_nikke_sin_swiftbunny_04_31:
    speaker: sin
    en: "... Okay."
    ko: "……응."
    ja: "…うん。"
  d_nikke_sin_swiftbunny_04_32:
    speaker: "<Monologue>"
    en: Sin bows her head at the old lady.
    ko: 신이 할머니에게 고개를 꾸벅 숙인다.
    ja: |-
      シンはおばあさんに向かって
      ぺこりと頭を下げた
  d_nikke_sin_swiftbunny_04_33:
    speaker: sin
    en: We're from a support group for heated mat fraud victims.
    ko: "[옥장판 사기 피해자 모임]에서 나왔어요."
    ja: "「健康マット詐欺被害者の会」から来ました。"
  d_nikke_sin_swiftbunny_04_34:
    speaker: sin
    en: Did you purchase this heated mat recently?
    ko: 혹시 최근에 이 옥장판, 구매하신 적 있으신가요?
    ja: |-
      ひょっとして最近、この健康マットを
      購入されませんでしたか？
  d_nikke_sin_swiftbunny_04_35:
    speaker: "<Monologue>"
    en: Sin shows the old lady the heated mat.
    ko: 신이 가져온 옥장판을 할머니에게 보여준다.
    ja: |-
      シンが持参した健康マットを
      おばあさんに見せた
  d_nikke_sin_swiftbunny_04_36:
    speaker: sharpgrandma
    en: "... I did. Is there a problem?"
    ko: "…샀는데, 뭐 문제 있나요?"
    ja: "…買ったけど、何か問題でもあるのかい？"
  d_nikke_sin_swiftbunny_04_37:
    speaker: sin
    en: We just wanted to let you know that this heated mat is a scam.
    ko: 다름이 아니라, 이 옥장판이 사기 판매라서요.
    ja: |-
      実はこの健康マット、
      効果のない詐欺商品なんです。
  d_nikke_sin_swiftbunny_04_38:
    speaker: sin
    en: My friend and I were scammed, too.
    ko: 저랑 제 친구도 당했어요.
    ja: 私と私の友だちも騙されてしまって…
  d_nikke_sin_swiftbunny_04_39:
    speaker: "<Monologue>"
    en: As the old lady hears what Sin has to say, the wariness in her expression
      slowly fades.
    ko: 신의 말을 듣고 있던 할머니의 얼굴에서 경계심이 천천히 사라져간다.
    ja: |-
      シンの話を聞いていたおばあさんの顔から
      徐々に警戒心が消えていく
  d_nikke_sin_swiftbunny_04_40:
    speaker: sin
    en: We've been going around looking for other victims so that we can report the
      seller and get a refund.
    ko: 그래서 신고하고, 환불을 받으려고 피해자 분들을 찾아 다니고 있어요.
    ja: |-
      それで通報してお金を返してもらおうと
      被害者の方々を訪ねて回ってるんです。
  d_nikke_sin_swiftbunny_04_41:
    speaker: sin
    en: If you wouldn't mind, I'd like to ask for you to sign this.
    ko: 괜찮으시면 여기 서명을 부탁드려요.
    ja: よろしければ、こちらに署名をお願いします。
  d_nikke_sin_swiftbunny_04_42:
    speaker: sin
    en: We'll keep you updated on the progress of the lawsuit using this number...
    ko: 환불 소송 진행 상황은 이 번호로 알려드릴….
    ja: |-
      返金訴訟の進捗状況は
      こちらの番号からお知らせし…
  d_nikke_sin_swiftbunny_04_43:
    speaker: sharpgrandma
    en: What, you think I didn't know it was nonsense?
    ko: 나라고 그게 말이 안 되는 걸 모르겠어요?
    ja: |-
      私だって、おかしな話だということくらい
      分かってたわ。
  d_nikke_sin_swiftbunny_04_44:
    speaker: sharpgrandma
    en: I bought it because those salesmen would come by and make pleasant conversation
      with me.
    ko: 그냥 찾아와서 어르신, 어르신~ 하면서 살갑게 말동무 해주고,
    ja: |-
      だけど、訪ねてきては
      優しく話し相手になってくれたり…
  d_nikke_sin_swiftbunny_04_45:
    speaker: sharpgrandma
    en: They'd even massage my shoulders, so I felt like I owed them that much.
    ko: 어깨 주물러주고 그러니까, 미안해서 팔아주는 거지.
    ja: |-
      肩を揉んでくれたりするから、
      申し訳なくて買ってあげたの。
  d_nikke_sin_swiftbunny_04_46:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_47:
    speaker: "<Monologue>"
    en: The old lady takes the pen from Sin's hand and scribbles her name down on
      the paper.
    ko: 할머니가 신의 손에서 펜을 가져가, 문서에 이름을 적는다.
    ja: |-
      おばあさんがシンの手からペンを取り、
      書類に名前を書いた
  d_nikke_sin_swiftbunny_04_48:
    speaker: sharpgrandma
    en: Still, when a girl young enough to be my granddaughter is so nice as to come
      by and try to help,
    ko: 그래도 손주뻘 아가씨가 이렇게까지 이야기하는데,
    ja: |-
      それでも、孫みたいな年頃のお嬢さんが
      ここまで言ってくれるんだから、
  d_nikke_sin_swiftbunny_04_49:
    speaker: sharpgrandma
    en: I can't sit back and do nothing just because I'm getting a little old.
    ko: 또 나이 먹고 가만히 있을 수는 없지요.
    ja: |-
      年寄りだからって、じっとしているわけには
      いかないわね。
  d_nikke_sin_swiftbunny_04_50:
    speaker: sin
    en: "... We'll make sure you get your money back. Just leave it to us."
    ko: "…꼭 돈 돌려받게 해드릴 테니까, 맡겨주세요."
    ja: |-
      …必ずお金を取り返しますから、
      私にお任せください。
  d_nikke_sin_swiftbunny_04_51:
    speaker: sharpgrandma
    en: Goodness, you certainly know how to inspire confidence, young lady.
    ko: 아이구. 젊은 처자가 말도 참 기특하게 하네.
    ja: まあ。心強いわね。
  d_nikke_sin_swiftbunny_04_52:
    speaker: sharpgrandma
    en: Come to think of it, the woman up the street bought one too. She's old like
      me.
    ko: 그렇지. 접때 윗집 할망구도 샀다고 하던데.
    ja: |-
      そうそう。この間、上の階のおばあさんも
      同じものを買ったって言ってたわ。
  d_nikke_sin_swiftbunny_04_53:
    speaker: sharpgrandma
    en: Hold on just a moment. I'll call her and tell her to come over. In the meantime,
      come in and have a cup of tea.
    ko: 있어 봐요. 전화해서 오라고 할 테니까, 들어와서 차라도 한 잔 해요.
    ja: |-
      電話してここに呼ぶから、
      上がってお茶でも飲んでいってちょうだい。
  d_nikke_sin_swiftbunny_04_54:
    speaker: sharpgrandma
    en: Actually, have you eaten yet? The other day, I just so happened to buy a bit
      more food than I need...
    ko: |-
      아니지. 밥은 먹었어요?
      안 그래도 요번에 내가 뭐 이것저것 많이 사 가지고….
    ja: |-
      そうだ。ご飯は食べた？
      ちょうど色々と買いすぎちゃったところでね…
  d_nikke_sin_swiftbunny_04_55:
    speaker: "<Monologue>"
    en: The old woman steps back inside, leaving the door open behind her.
    ko: 할머니가 문을 열어두고 집 안으로 들어간다.
    ja: |-
      おばあさんはドアを開けたまま、
      家の中に入っていった
  d_nikke_sin_swiftbunny_04_56:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_57:
    speaker: sin
    en: I really can't get used to this sort of thing.
    ko: 참 적응 안 된다니까, 이런 거.
    ja: ほんと、こういうの慣れないんだけど。
  d_nikke_sin_swiftbunny_04_58:
    speaker: "<Self>"
    en: You should probably try to get used to it sooner than later.
    ko: 빨리 익숙해지는 게 좋을걸?
    ja: 早く慣れた方がいいと思うぞ
  d_nikke_sin_swiftbunny_04_59:
    speaker: "<Self>"
    en: You'll wear yourself out if you keep reacting to every little normal thing.
    ko: 평범한 일에 일일이 반응하면 인생이 피곤해.
    ja: |-
      「普通」のことにいちいち反応していたら
      疲れるだけだ
  d_nikke_sin_swiftbunny_04_60:
    speaker: sin
    en: "... So what should I do in a situation like this?"
    ko: "…이럴 땐 어떻게 해야 돼?"
    ja: "…こういう時って、どうしたらいいの？"
  d_nikke_sin_swiftbunny_04_61:
    speaker: "<Self>"
    en: All you need to do is say, "Thank you."
    ko: "[감사합니다], 라고 하면 돼."
    ja: お礼を言えばいい
  d_nikke_sin_swiftbunny_04_62:
    speaker: sin
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_04_63:
    speaker: "<Monologue>"
    en: Sin smiles and steps through the doorway.
    ko: 신이 웃으며 현관으로 들어간다.
    ja: シンは笑顔で玄関に向かった
  d_nikke_sin_swiftbunny_04_64:
    speaker: sin
    en: Thank you for the offer! I actually haven't eaten yet!
    ko: 밥 안 먹었어요~ 감사합니다~!
    ja: |-
      まだ食べてないんです～！
      ありがとうございます！
  d_nikke_sin_swiftbunny_04_65:
    speaker: sharpgrandma
    en: You shouldn't go hungry when you're working for a good cause.
    ko: 좋은 일 하는데 밥 거르고 다니면 안 되지.
    ja: |-
      良いことをしているんだから、
      ちゃんと食べないとダメよ。
  d_nikke_sin_swiftbunny_04_66:
    speaker: sharpgrandma
    en: You too, young man! Have a bite to eat before you go!
    ko: 거기 총각도 밥 먹고 가요!
    ja: そこのお兄さんも食べていきな！
  d_nikke_sin_swiftbunny_04_67:
    speaker: "<Self>"
    en: Okay!
    ko: 네~
    ja: はい、ありがとうございます
  d_nikke_sin_swiftbunny_04_68:
    speaker: "<Monologue>"
    en: I check my phone as I respond to the old woman.
    ko: 대답하며 핸드폰을 꺼내본다.
    ja: 返事をしながら、携帯電話を取り出す
  d_nikke_sin_swiftbunny_04_69:
    speaker: "<Monologue>"
    en: I see a text message saying that things are going well, along with a photo
      of Mast, Anchor, and Trony being treated to a feast by some older folks.
    ko: 잘 되어간다는 메시지에, 어르신들에게 푸짐한 식사를 대접받고 있는 마스트, 앵커, 트로니의 사진이 첨부되어 있다.
    ja: |-
      順調だというメッセージには、
      お年寄りからごちそうを振る舞われている
      マスト、アンカー、トロニーの写真が
      添付されている
  d_nikke_sin_swiftbunny_04_70:
    speaker: "<Self>"
    en: "... I guess it's time to eat."
    ko: "…뭐, 일단 밥이나 먹자."
    ja: "…ひとまず、食事をいただこう"
d_nikke_sin_swiftbunny_05:
  d_nikke_sin_swiftbunny_05_1:
    speaker: "<Monologue>"
    en: "... It turns out we'd been underestimating the local elderly network."
    ko: "…우리는 어르신-네트워크를 얕보고 있었다."
    ja: |-
      …私たちは、お年寄りネットワークを
      侮っていた
  d_nikke_sin_swiftbunny_05_2:
    speaker: "<Monologue>"
    en: By the time we finally got to dessert after the multi-course meal,
    ko: |-
      끝없이 나오는 코스 요리를 간신히 해치운 뒤,
      뒤이어 준비된 후식을 먹을 때쯤에.
    ja: |-
      次から次へと出てくる料理を
      なんとか平らげ、その後に用意された
      デザートを食べる頃には…
  d_nikke_sin_swiftbunny_05_3:
    speaker: "<Monologue>"
    en: word about the heated mats had already gotten around to all the elderly people
      in the neighborhood.
    ko: 동네의 어르신들은 거의 전부 옥장판 관련한 연락을 받은 상태였다.
    ja: |-
      近所のお年寄りのほぼ全員に
      健康マットに関する情報が回っていた
  d_nikke_sin_swiftbunny_05_4:
    speaker: "<Monologue>"
    en: That allowed us to gather at the nearby meeting hall and get everyone's signatures
      before sunset.
    ko: |-
      덕분에 근처 회관에 모여,
      해가 지기 전에 모든 분들의 서명을 받을 수 있었다.
    ja: |-
      そのおかげで被害者が近所の会館に集まり、
      日が暮れる前に全員の署名を集めることができた
  d_nikke_sin_swiftbunny_05_5:
    speaker: "<Monologue>"
    en: And thanks to that...
    ko: 그리고….
    ja: そして…
  d_nikke_sin_swiftbunny_05_6:
    speaker: announcer
    en: Arrests have been made after authorities caught a group who had been deceiving
      the elderly into buying cheap counterfeit products at exorbitant prices.
    ko: |-
      건강에 좋다는 말로 노인들을 속여,
      값싼 가짜 옥장판을 고가에 팔아넘긴 일당이 체포되었습니다.
    ja: |-
      健康に良いとうたって購入者をだまし、安価な
      偽物の健康マットを高額で売りつけていた
      詐欺グループが、今日、逮捕されました。
  d_nikke_sin_swiftbunny_05_7:
    speaker: announcer
    en: The suspects are accused of targeting elderly people living alone,
    ko: 이들은 주로 홀로 거주하는 노인들을 노려,
    ja: 彼らは主に一人暮らしの老人を狙い、
  d_nikke_sin_swiftbunny_05_8:
    speaker: announcer
    en: using the promise of free vacations and promotional gifts to trick them into
      buying heated mats for dozens of times their retail price.
    ko: 무료 관광과 사은품 등을 미끼로, 가짜 옥장판을 정가의 수십 배 가격에 판매한 혐의를 받고 있습니다.
    ja: |-
      旅行や景品をプレゼントすると持ちかけ、
      偽の健康マットを定価の数十倍の価格で
      販売した疑いが持たれています。
  d_nikke_sin_swiftbunny_05_9:
    speaker: announcer
    en: The investigator in charge stated that the victims’ active efforts to come
      together, raise awareness of the fraud, and take action greatly assisted the
      investigation,
    ko: 또한 사건 담당자는 피해자들이 적극적으로 연대하여 피해 사실을 알리고 행동한 점이 수사에 큰 도움이 되었다며,
    ja: |-
      また、捜査関係者は、被害者自らが
      連携して被害を訴え、行動を起こしたことが
      捜査の大きな助けになったとし、
  d_nikke_sin_swiftbunny_05_10:
    speaker: announcer
    en: and expressed gratitude to the anonymous citizen who organized the victims'
      support group.
    ko: 피해자 모임을 조직한 익명의 시민에게 감사의 말을 전했습니다.
    ja: |-
      被害者の会を結成した匿名の市民に
      感謝の意を示しました。
  d_nikke_sin_swiftbunny_05_11:
    speaker: "<Self>"
    en: Looks like everything went well.
    ko: 잘 끝났네.
    ja: 一件落着だな
  d_nikke_sin_swiftbunny_05_12:
    speaker: sin_b
    en: Yeah. It couldn't have gone better.
    ko: 그러게. 이보다 더 잘 끝날 수는 없겠어.
    ja: |-
      ホント。これ以上ないくらい、
      見事な解決っぷりだったわ。
  d_nikke_sin_swiftbunny_05_13:
    speaker: mast_m
    en: Aw... My heated mat...
    ko: 아아… 내 옥장판이….
    ja: ああ…私の健康マットが…
  d_nikke_sin_swiftbunny_05_14:
    speaker: trony_m
    en: D-did they take yours, too...?
    ko: 마, 마스트 것도 가져갔어…?
    ja: マ、マストのも回収されたの…？
  d_nikke_sin_swiftbunny_05_15:
    speaker: anchor_m
    en: They took every last one as evidence.
    ko: 증거품이라고 다 가져갔어.
    ja: 証拠品だって、全部持って行っちゃった。
  d_nikke_sin_swiftbunny_05_16:
    speaker: mast_m
    en: It may have been a scam for everyone else, but for me, it was real...
    ko: 남들에게는 사기였을지 몰라도, 나한테는 그게 진짜였단 말요….
    ja: |-
      他の人にとっては
      詐欺だったかもしれないけど、
      私にとっては本物だったんだ…
  d_nikke_sin_swiftbunny_05_17:
    speaker: "<Self>"
    en: "... I'll get you a proper one, so cheer up."
    ko: "…내가 제대로 된 거 하나 사줄 테니까 기운 내."
    ja: |-
      …私が本物を買ってあげよう、
      元気を出せ
  d_nikke_sin_swiftbunny_05_18:
    speaker: sin_b
    en: I mean, at least we all got our refunds.
    ko: 그래도 전부 환불 받았잖아~
    ja: でも、全額戻って来たでしょう～？
  d_nikke_sin_swiftbunny_05_19:
    speaker: "<Self>"
    en: Mast, you said you bought three, right?
    ko: 마스트는 세 개 샀댔지?
    ja: マストは3つ買ったんだったか？
  d_nikke_sin_swiftbunny_05_20:
    speaker: mast_m
    en: Yeah, so now my wallet's gotten pretty fat all of a sudden.
    ko: 맞수다. 뭐, 덕분에 갑자기 지갑이 두둑해지기는 했수.
    ja: |-
      ああ…まあ、おかげで
      急に財布が潤ったぜ。
  d_nikke_sin_swiftbunny_05_21:
    speaker: anchor_m
    en: How fat?
    ko: 얼마나?
    ja: どれくらい？
  d_nikke_sin_swiftbunny_05_22:
    speaker: mast_m
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_05_23:
    speaker: "<Monologue>"
    en: Mast reluctantly holds up three fingers.
    ko: 마스트가 우물쭈물하며 손가락 세 개를 편다.
    ja: マストがもじもじしながら、指を3本立てた
  d_nikke_sin_swiftbunny_05_24:
    speaker: trony_m
    en: Th-three...?!
    ko: 사, 삼…?!
    ja: さ、さん…！？
  d_nikke_sin_swiftbunny_05_25:
    speaker: anchor_m
    en: Wow.
    ko: 오.
    ja: おお。
  d_nikke_sin_swiftbunny_05_26:
    speaker: sin_b
    en: Oh, now I get why you've been asking me to pay for you every time we've met
      up lately. It's because you bought those mats, huh?
    ko: |-
      그러고 보니 마스트.
      요새 맨날 얻어먹기만 한 게 옥장판 사서 그런 거였구나~?
    ja: |-
      そういえば、マスト。最近
      みんなに奢ってもらってばかりだったのって、
      健康マットを買ったからだったのね～？
  d_nikke_sin_swiftbunny_05_27:
    speaker: sin_b
    en: And here I was worried about you.
    ko: 나는 무슨 일 있나~ 하고 걱정했었는데.
    ja: 何かあったのかなって心配してたのよ。
  d_nikke_sin_swiftbunny_05_28:
    speaker: anchor_m
    en: I'm hungry.
    ko: 배고프다.
    ja: お腹すいた。
  d_nikke_sin_swiftbunny_05_29:
    speaker: mast_m
    en: Urgh...
    ko: 크윽….
    ja: くっ…
  d_nikke_sin_swiftbunny_05_30:
    speaker: mast_m
    en: "... Oh, what the heck! Dinner's on me tonight!"
    ko: "…에에잇! 꽁돈 생긴 김에 오늘은 내가 쏘겠수다!"
    ja: |-
      …ええいっ！カネが入ったことだし、
      今日は私がおごるぜぇ！
  d_nikke_sin_swiftbunny_05_31:
    speaker: mast_m
    en: Clear your schedules for after the cafe closes!
    ko: 오늘 영업 끝나고 다들 시간 비워두쇼!
    ja: |-
      今日の営業後は、
      みんな予定を空けておいてくれよな！
  d_nikke_sin_swiftbunny_05_32:
    speaker: sin_b
    en: Nice! Thanks for the treat!
    ko: 고마워, 잘 먹을게~
    ja: ありがとう、ごちそうになるわ～
  d_nikke_sin_swiftbunny_05_33:
    speaker: anchor_m
    en: Where should we go?
    ko: 어디로 갈까?
    ja: お店、どこがいいかな？
  d_nikke_sin_swiftbunny_05_34:
    speaker: trony_m
    en: I-I'll look up some places...!
    ko: 내, 내가 검색해볼게…!
    ja: わ、私、検索してみるね…！
  d_nikke_sin_swiftbunny_05_35:
    speaker: "<Self>"
    en: Have fun.
    ko: 재밌게 놀아~
    ja: みんな、楽しんでくるんだぞ
  d_nikke_sin_swiftbunny_05_36:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_sin_swiftbunny_05_37:
    speaker: "<Monologue>"
    en: I say goodbye to everyone as I walk out the door.
    ko: 일행을 배웅한 뒤 문을 닫는다.
    ja: 一行を見送ってドアを閉める
  d_nikke_sin_swiftbunny_05_38:
    speaker: "<Self>"
    en: "... I'm glad everything worked out."
    ko: "…잘 끝나서 다행이네."
    ja: "…無事に解決してよかった"
  d_nikke_sin_swiftbunny_05_39:
    speaker: "<Monologue>"
    en: I sit down, feeling a smile spread across my face in sheepish gratific...
    ko: |-
      코 밑을 스윽 문지르고 싶은 훈훈한 기분으로
      자리에 앉….
    ja: |-
      鼻の下をこすりたくなるような、
      微笑ましい気持ちで席に座り…
  d_nikke_sin_swiftbunny_05_40:
    speaker: sin_b
    en: Yeah, me too.
    ko: 그러게~
    ja: そうね～
  d_nikke_sin_swiftbunny_05_41:
    speaker: "<Self>"
    en: Gahhh, you scared me!
    ko: 어우 깜짝이야.
    ja: うわっ、びっくりした
  d_nikke_sin_swiftbunny_05_42:
    speaker: "<Self>"
    en: "... Wait, I thought you'd already left."
    ko: "…좀 전에 나가지 않았어?"
    ja: "…さっき出ていかなかったか？"
  d_nikke_sin_swiftbunny_05_43:
    speaker: sin_b
    en: There were, uh... still a few things I wanted to say.
    ko: 음… 할 말이 좀 남아서.
    ja: その…話したいことがあって。
  d_nikke_sin_swiftbunny_05_44:
    speaker: "<Self>"
    en: Like what?
    ko: 무슨 말?
    ja: 話って？
  d_nikke_sin_swiftbunny_05_45:
    speaker: sin_b
    en: You know. Things.
    ko: 이것저것?
    ja: 色々？
  d_nikke_sin_swiftbunny_05_46:
    speaker: "<Monologue>"
    en: I look at Sin, letting her know I'm ready to listen.
    ko: 들을 준비가 되었다는 뜻을 담아 신을 본다.
    ja: |-
      話を聞く準備はできているという意思を込めて、
      シンを見る
  d_nikke_sin_swiftbunny_05_47:
    speaker: sin_b
    en: First of all, about that cake I gave you before...
    ko: "…우선, 저번에 준 케이크 있잖아."
    ja: |-
      …まず、この前味見してもらった
      ケーキのことなんだけど。
  d_nikke_sin_swiftbunny_05_48:
    speaker: sin_b
    en: It wasn't actually something we were going to put on the menu.
    ko: 그거 신메뉴 아니었어.
    ja: あれ、新メニューじゃないの。
  d_nikke_sin_swiftbunny_05_49:
    speaker: sin_b
    en: I made it just for you, because I was grateful that you were looking out for
      me.
    ko: 교관이 신경 써주는 게 고마워서 따로 준비한 거거든.
    ja: |-
      教官が気にかけてくれたのが嬉しくて、
      特別に作ったケーキだったの。
  d_nikke_sin_swiftbunny_05_50:
    speaker: "<Self>"
    en: I kind of figured that might be the case.
    ko: 그렇지 않을까 생각하긴 했어.
    ja: そうじゃないかとは思っていたが…
  d_nikke_sin_swiftbunny_05_51:
    speaker: sin_b
    en: And yet you still told me it tasted weird?
    ko: 생각했는데 맛이 미묘하다고 한 거야~?
    ja: |-
      それならどうして、何とも言えない味
      だなんて言ったの～？
  d_nikke_sin_swiftbunny_05_52:
    speaker: sin_b
    en: Minus 500 points for being insensitive!
    ko: 무신경한 교관한테 벌점 500점!
    ja: デリカシーのない教官はマイナス500点！
  d_nikke_sin_swiftbunny_05_53:
    speaker: "<Self>"
    en: Th-that's a lot of points.
    ko: 이, 이건 좀 큰데?
    ja: そ、それはあんまりじゃないか…？
  d_nikke_sin_swiftbunny_05_54:
    speaker: sin_b
    en: You should've chosen your words more carefully!
    ko: 그러니까 잘 말했어야지~!
    ja: だったら、最初からちゃんと言ってくれなきゃ！
  d_nikke_sin_swiftbunny_05_55:
    speaker: "<Monologue>"
    en: Sin approaches me with a smile and slowly takes off her converter.
    ko: 웃으며 내게 다가선 신이 천천히 컨버터를 벗는다.
    ja: |-
      シンは微笑みながら私に近づき、
      ゆっくりとコンバーターを外した
  d_nikke_sin_swiftbunny_05_56:
    speaker: sin_b
    en: "... Aren't you going to run away?"
    ko: "…안 도망가?"
    ja: "…逃げないの？"
  d_nikke_sin_swiftbunny_05_57:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_sin_swiftbunny_05_58:
    speaker: "<Monologue>"
    en: A sweet scent tickles the tip of my nose.
    ko: "…달콤한 향이 코끝을 간질인다."
    ja: "…甘い香りが鼻先をくすぐる"
  d_nikke_sin_swiftbunny_05_59:
    speaker: "<Self>"
    en: "... I think I'm fine right here."
    ko: "…괜찮은 것 같아."
    ja: "…ああ、大丈夫だ"
  d_nikke_sin_swiftbunny_05_60:
    speaker: sin_b
    en: Haha. Really?
    ko: 하하. 그래?
    ja: あはは。そう？
  d_nikke_sin_swiftbunny_05_61:
    speaker: "<Monologue>"
    en: Sin, now standing right in front of me, leans close to my ear.
    ko: 바로 앞까지 다가온 신이 귓가에 고개를 가까이 한다.
    ja: |-
      目の前まで近づいてきたシンが、
      私の耳元に顔を寄せる
  d_nikke_sin_swiftbunny_05_62:
    speaker: sin_b
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_sin_swiftbunny_05_63:
    speaker: "<Monologue>"
    en: And then, for the first time ever, I clearly hear Sin's actual voice...
    ko: 그리고, 처음으로 제대로 들은 신의 진짜 목소리는.
    ja: |-
      そして、初めてちゃんと聞いた
      シンの本当の声は――
  d_nikke_sin_swiftbunny_05_64:
    speaker: sin_b
    en: Thank you. For helping me.
    ko: 고마워. 도와줘서.
    ja: ありがとう。力を貸してくれて。
  d_nikke_sin_swiftbunny_05_65:
    speaker: sin_b
    en: You get 999 points.
    ko: 상점 999점.
    ja: ボーナスポイント999点。
  d_nikke_sin_swiftbunny_05_66:
    speaker: "<Self>"
    en: Why not just round up?
    ko: 1점은 왜 빠졌어?
    ja: どうして1点足りないんだ？
  d_nikke_sin_swiftbunny_05_67:
