---
d_nikke_hongryeon_goddeath_01:
  d_nikke_hongryeon_goddeath_01_1:
    speaker: hongryeon_g
    en: I swear to thee,
    ko: 약조하겠네.
    ja: 約束しよう。
  d_nikke_hongryeon_goddeath_01_2:
    speaker: hongryeon_g
    en: I shall live and be happy.
    ko: 나는 반드시 행복하게 살겠네.
    ja: 私は必ず、幸せになってみせる。
  d_nikke_hongryeon_goddeath_01_3:
    speaker: "<Narration>"
    en: The red petals flutter down quietly,
    ko: 붉은 꽃잎만이 고요히 흩날린다.
    ja: 紅い花びらだけが静かに舞い続けた
  d_nikke_hongryeon_goddeath_01_4:
    speaker: "<Narration>"
    en: until the last petal gently settles upon the water's surface,
    ko: 마지막 남은 붉은 꽃잎이 수면에 내려앉는다.
    ja: 最後のひとひらが、水面に落ちた
  d_nikke_hongryeon_goddeath_01_5:
    speaker: "<Narration>"
    en: causing a tiny ripple.
    ko: 작은 파문과 함께.
    ja: 小さな波紋が広がり…
  d_nikke_hongryeon_goddeath_01_6:
    speaker: "<Narration>"
    en: Scarlet opens her eyes.
    ko: 홍련은 눈을 뜬다.
    ja: 紅蓮は目を開いた
  d_nikke_hongryeon_goddeath_01_7:
    speaker: "<Narration>"
    en: "*Psssssh*"
    ko: 푸쉬이-
    ja: プシュー
  d_nikke_hongryeon_goddeath_01_8:
    speaker: "<Narration>"
    en: The body maker opens.
    ko: 바디 메이커가 열린다.
    ja: 製造装置が開く
  d_nikke_hongryeon_goddeath_01_9:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_01_10:
    speaker: "<Narration>"
    en: In the blinding light, Scarlet squints.
    ko: 쏟아지는 빛에, 홍련은 눈을 찡그린다.
    ja: 差し込む光に、紅蓮は目を細め…
  d_nikke_hongryeon_goddeath_01_11:
    speaker: "<Narration>"
    en: She looks around,
    ko: 그리고 주변을 둘러본다.
    ja: 辺りを見回した
  d_nikke_hongryeon_goddeath_01_12:
    speaker: "<Narration>"
    en: only to find Johan, Cecil, and Papillon looking at her.
    ko: 요한과 세실, 파피용이 홍련을 바라보고 있다.
    ja: ヨハンとセシル、パピヨンが紅蓮を見つめている
  d_nikke_hongryeon_goddeath_01_13:
    speaker: cecil
    en: How are you feeling, Scarlet?
    ko: 홍련, 정신이 드나요?
    ja: 気がつきましたか？
  d_nikke_hongryeon_goddeath_01_14:
    speaker: hongryeon_g
    en: "... Never did I imagine we'd meet again in such fashion."
    ko: "…자네들과 이런 재회를 하게 될 거라곤, 상상도 못했군."
    ja: |-
      …こうして再会を果たすことになるとは
      思いもしなかったな。
  d_nikke_hongryeon_goddeath_01_15:
    speaker: hongryeon_g
    en: "'Tis been an age since we last met."
    ko: 다들 오랜만일세.
    ja: 皆、久しぶりだねぇ。
  d_nikke_hongryeon_goddeath_01_16:
    speaker: cecil
    en: Fortunately, everything appears to be in order.
    ko: 다행히 이상은 없군요.
    ja: 幸い、異常はないようですね。
  d_nikke_hongryeon_goddeath_01_17:
    speaker: johan
    en: That's all that matters.
    ko: 이상이 없으면 됐다.
    ja: 異常がないならそれでいい。
  d_nikke_hongryeon_goddeath_01_18:
    speaker: johan
    en: Cecil,
    ko: 세실.
    ja: セシル。
  d_nikke_hongryeon_goddeath_01_19:
    speaker: johan
    en: proceed with the necessary procedures
    ko: 간단하게 필요한 절차를 진행해라.
    ja: 手短に必要な手続きを進めろ。
  d_nikke_hongryeon_goddeath_01_20:
    speaker: johan
    en: and inform her of our current situation.
    ko: 그리고 현재 상황도 알려주는 게 좋겠군.
    ja: |-
      それから、現在の状況も
      伝えておいた方がいいだろう。
  d_nikke_hongryeon_goddeath_01_21:
    speaker: cecil
    en: Understood.
    ko: 알겠어요.
    ja: 分かりました。
  d_nikke_hongryeon_goddeath_01_22:
    speaker: johan
    en: We've taken our eyes off the Queen for too long.
    ko: 퀸에게서 너무 오래 눈을 떼고 있었군.
    ja: クイーンから長く目を離していた。
  d_nikke_hongryeon_goddeath_01_23:
    speaker: johan
    en: We'll head back first.
    ko: 우리는 먼저 돌아가 있겠다.
    ja: 私たちは先に戻っている。
  d_nikke_hongryeon_goddeath_01_24:
    speaker: papillon
    en: '"We"? You mean I have to go, too?'
    ko: 우리? 나까지 가야하는 거야?
    ja: 私たち？私も？
  d_nikke_hongryeon_goddeath_01_25:
    speaker: papillon
    en: W-wait!
    ko: 자, 잠깐만!
    ja: ちょ、ちょっと！
  d_nikke_hongryeon_goddeath_01_26:
    speaker: "<Narration>"
    en: Johan and Papillon walk out of the laboratory.
    ko: 요한과 파피용이 연구실을 나섰다.
    ja: ヨハンとパピヨンが研究室を出ていった
  d_nikke_hongryeon_goddeath_01_27:
    speaker: hongryeon_g
    en: As unyielding as ever, I see.
    ko: 딱딱한 건 여전하군그래.
    ja: 相変わらずの堅物だ。
  d_nikke_hongryeon_goddeath_01_28:
    speaker: cecil
    en: People don't change that easily.
    ko: 사람이 쉽게 바뀌나요.
    ja: そう簡単に変わると思いますか？
  d_nikke_hongryeon_goddeath_01_29:
    speaker: cecil
    en: That aside, we're a little pressed for time.
    ko: 그건 그렇고, 일단 지금 여유가 있는 상황은 아니에요.
    ja: それはそうと、あまり余裕がありません。
  d_nikke_hongryeon_goddeath_01_30:
    speaker: cecil
    en: I'll quickly bring you up to speed.
    ko: 그러니까 현재 상황부터 빠르게 전달할게요.
    ja: 現在の状況から手短にお伝えします。
  d_nikke_hongryeon_goddeath_01_31:
    speaker: cecil
    en: Scarlet, do you remember what happened when the Queen attacked Eden?
    ko: 홍련, 퀸이 에덴을 공격했을 때의 일은 기억하고 있나요?
    ja: |-
      クイーンがエデンを攻撃した時のことは
      覚えていますか？
  d_nikke_hongryeon_goddeath_01_32:
    speaker: hongryeon_g
    en: Aye, I do.
    ko: 물론일세.
    ja: 無論だ。
  d_nikke_hongryeon_goddeath_01_33:
    speaker: cecil
    en: In that case, it would be quicker to start with what happened next.
    ko: 그러면 그 이후의 이야기를 전해드리는 게 빠르겠군요.
    ja: |-
      それなら、その後の話をお伝えした方が
      早そうですね。
  d_nikke_hongryeon_goddeath_01_34:
    speaker: cecil
    en: The Queen went on to create new Heretics
    ko: 그 이후, 퀸은 새로운 헬레틱들을 만들어 냈어요.
    ja: |-
      クイーンは新たなヘレティックを
      作り出しました。
  d_nikke_hongryeon_goddeath_01_35:
    speaker: cecil
    en: modeled after you and your comrades.
    ko: 당신들의 흉내를 내는 헬레틱을요.
    ja: あなたたちを模倣したヘレティックを。
  d_nikke_hongryeon_goddeath_01_36:
    speaker: hongryeon_g
    en: Heretics fashioned after us...
    ko: 우리의 흉내를 내는 헬레틱….
    ja: 私たちを模倣したヘレティック…
  d_nikke_hongryeon_goddeath_01_37:
    speaker: cecil
    en: Then the Queen began attacking the Ark directly.
    ko: 그리고 퀸은 방주를 직접 공격하기 시작했고,
    ja: |-
      そして、クイーンは
      アークへの直接攻撃を始め、
  d_nikke_hongryeon_goddeath_01_38:
    speaker: cecil
    en: In response, the Ark decided to launch another Surface Reclamation War.
    ko: 결국 방주는 지상 탈환전을 시작하기로 했어요.
    ja: アークは地上奪還戦を開始。
  d_nikke_hongryeon_goddeath_01_39:
    speaker: cecil
    en: Eden will, of course, be joining the fight.
    ko: 물론 우리 에덴도 참전할 예정이죠.
    ja: 当然、私たちエデンも参戦する予定です。
  d_nikke_hongryeon_goddeath_01_40:
    speaker: cecil
    en: However, Eden wasn't strong enough to take on the Queen at the time.
    ko: 하지만 에덴 입장에서 퀸을 상대하기엔, 전력의 차이가 있었던 상태예요.
    ja: |-
      ですが、クイーンに対抗するには、
      戦力差がありました。
  d_nikke_hongryeon_goddeath_01_41:
    speaker: "<Narration>"
    en: Scarlet examines her own body.
    ko: 홍련은 자신의 바디를 둘러본다.
    ja: 紅蓮は自分のボディを見回した
  d_nikke_hongryeon_goddeath_01_42:
    speaker: hongryeon_g
    en: At the time, thou sayest? Is it so no longer?
    ko: 있었던, 이라는 뜻은 이젠 아니라는 건가?
    ja: 今は違うということかい？
  d_nikke_hongryeon_goddeath_01_43:
    speaker: cecil
    en: Correct.
    ko: 네, 당신과 라푼젤이 돌아왔으니까요.
    ja: |-
      はい、あなたとラプンツェルが
      戻りましたから。
  d_nikke_hongryeon_goddeath_01_44:
    speaker: cecil
    en: On Johan's orders, we prioritized rescuing you and Rapunzel.
    ko: 요한의 결정에 따라 당신과 라푼젤을 우선해서 살려냈죠.
    ja: ヨハンの決定により、お二人を優先しました。
  d_nikke_hongryeon_goddeath_01_45:
    speaker: cecil
    en: With both of you back, we've managed to close a significant portion of the
      gap in combat strength.
    ko: 그 덕분에 꽤 많은 전력의 차이를 메웠다고 보고 있어요.
    ja: |-
      そのおかげで、かなりの戦力差を
      埋められたと見ています。
  d_nikke_hongryeon_goddeath_01_46:
    speaker: hongryeon_g
    en: If memory serves me aright, Eden had no means of fashioning Nikke bodies.
    ko: 에덴에 니케 바디를 제작할 수 있는 기술은 없던 걸로 기억하네만.
    ja: エデンにニケの製造技術はなかったはずだが。
  d_nikke_hongryeon_goddeath_01_47:
    speaker: cecil
    en: Indeed, we didn't. But we acquired the technology through the Counters' Commander,
    ko: 네, 없었어요. 하지만 카운터스의 지휘관을 통해 입수했죠.
    ja: |-
      ええ。
      ですが、カウンターズの指揮官を通して
      入手したのです。
  d_nikke_hongryeon_goddeath_01_48:
    speaker: cecil
    en: who negotiated with the Ark.
    ko: 방주와 교섭해서요.
    ja: アークと交渉しました。
  d_nikke_hongryeon_goddeath_01_49:
    speaker: hongryeon_g
    en: Ho... As ever, my Lord doth swiftly turn words to deeds.
    ko: 호오. 역시 도령의 실행력은 대단하군.
    ja: |-
      ほお。さすがはぼっちゃんだ。
      大したものだな。
  d_nikke_hongryeon_goddeath_01_50:
    speaker: cecil
    en: But...
    ko: 그런데….
    ja: しかし…
  d_nikke_hongryeon_goddeath_01_51:
    speaker: "<Narration>"
    en: Cecil avoids Scarlet's gaze.
    ko: 세실이 홍련의 눈을 피한다.
    ja: セシルが紅蓮から目をそらした
  d_nikke_hongryeon_goddeath_01_52:
    speaker: hongryeon_g
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_hongryeon_goddeath_01_53:
    speaker: cecil
    en: Your body is somewhat different.
    ko: 당신의 바디는 조금 달라요.
    ja: あなたのボディは少し違います。
  d_nikke_hongryeon_goddeath_01_54:
    speaker: hongryeon_g
    en: What meanest thou?
    ko: 그게 무슨 말인가?
    ja: それはどういう意味だ？
  d_nikke_hongryeon_goddeath_01_55:
    speaker: cecil
    en: Come this way.
    ko: 일단 이쪽으로 오시죠.
    ja: ひとまず、こちらへ来てください。
  d_nikke_hongryeon_goddeath_01_56:
    speaker: cecil
    en: I'll explain how we were able to give you a new body.
    ko: 어떻게 당신에게 새로운 바디를 줄 수 있었는지,
    ja: どうしてあなたのボディを用意できたのか、
  d_nikke_hongryeon_goddeath_01_57:
    speaker: cecil
    en: You have the right...
    ko: 당신은 알아야 할 권리.
    ja: あなたには知る権利…
  d_nikke_hongryeon_goddeath_01_58:
    speaker: cecil
    en: No, the obligation to know.
    ko: 아니, 의무가 있어요.
    ja: いえ、知る義務があります。
d_nikke_hongryeon_goddeath_02:
  d_nikke_hongryeon_goddeath_02_1:
    speaker: "<Narration>"
    en: Cecil leads Scarlet farther into the laboratory.
    ko: 세실은 홍련을 이끌고 연구실 안쪽으로 들어갔다.
    ja: セシルは紅蓮を連れて研究室の中に入ると、
  d_nikke_hongryeon_goddeath_02_2:
    speaker: "<Narration>"
    en: She then picks up an item from her desk and holds it out to Scarlet.
    ko: 그리고 책상 위에 놓인 물건을 홍련에게 내밀었다.
    ja: 机の上に置かれた物を紅蓮に差し出した
  d_nikke_hongryeon_goddeath_02_3:
    speaker: cecil
    en: Take this.
    ko: 받아주세요.
    ja: 受け取ってください。
  d_nikke_hongryeon_goddeath_02_4:
    speaker: hongryeon_g
    en: Rose's hair ornament.
    ko: 언니의 머리 장식이군.
    ja: 姉さんの髪飾りか。
  d_nikke_hongryeon_goddeath_02_5:
    speaker: hongryeon_g
    en: That thou wouldst show me this...
    ko: 이걸 내게 보여준다는 건….
    ja: これを私に見せるということは…
  d_nikke_hongryeon_goddeath_02_6:
    speaker: cecil
    en: Yes, your body was built using Rose's as a base.
    ko: 네, 당신의 바디는 장화의 바디를 베이스로 제작됐어요.
    ja: |-
      はい、あなたのボディは
      薔花のボディをベースに製造されました。
  d_nikke_hongryeon_goddeath_02_7:
    speaker: cecil
    en: Even with Eden and the Ark's Nikke manufacturing technology,
    ko: 에덴과 방주의 니케 제작 기술이 포함되긴 했지만,
    ja: |-
      エデンとアークの製造技術が
      取り入れられてはいますが、
  d_nikke_hongryeon_goddeath_02_8:
    speaker: cecil
    en: we couldn't have brought you back without using Rose's body.
    ko: 장화의 바디를 쓰지 않고서는 당신을 되살리기 어려웠으니까요.
    ja: |-
      薔花のボディを使わなければ
      あなたを蘇らせることは難しかったのです。
  d_nikke_hongryeon_goddeath_02_9:
    speaker: cecil
    en: To explain in more detail, your original body was mass-produced, so—
    ko: 자세하게 설명하자면, 양산형 바디였던 당신의 몸은.
    ja: 量産型ボディだったあなたの身体は…
  d_nikke_hongryeon_goddeath_02_10:
    speaker: hongryeon_g
    en: Nay, thou needst not trouble thyself with further explanation.
    ko: 아니, 세세한 설명까지 해 줄 필요는 없네.
    ja: いや、そこまでの説明は必要ない。
  d_nikke_hongryeon_goddeath_02_11:
    speaker: hongryeon_g
    en: 'I seek but one answer from thee:'
    ko: 내가 듣고 싶은 것은 하나뿐일세.
    ja: 私が聞きたいことは一つだけだ。
  d_nikke_hongryeon_goddeath_02_12:
    speaker: hongryeon_g
    en: What befell Rose in her final moments?
    ko: 언니의 마지막은 어땠는가?
    ja: 姉さんの最期はどうだった？
  d_nikke_hongryeon_goddeath_02_13:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_02_14:
    speaker: cecil
    en: Rose was moving without a core,
    ko: 장화는 코어가 없이 움직이는 상태였어요.
    ja: 薔花はコアがないまま動いてました。
  d_nikke_hongryeon_goddeath_02_15:
    speaker: cecil
    en: driven solely by the instincts brought on by corruption, with no capacity
      for rational thought...
    ko: 이성 없이 침식에 의한 본능에 따라 움직이는,
    ja: 理性はなく、侵食による本能のままに動く…
  d_nikke_hongryeon_goddeath_02_16:
    speaker: cecil
    en: In that sense, she was essentially a zombie.
    ko: 좀비 같은 상태였다고 할 수 있죠.
    ja: 言わば、ゾンビのようなものでした。
  d_nikke_hongryeon_goddeath_02_17:
    speaker: cecil
    en: But she sacrificed herself to give you her body.
    ko: 하지만 당신에게 본인의 몸을 제공하기 위해 자신을 희생했어요.
    ja: |-
      ですが、あなたに自分のボディを提供するため
      自らを犠牲にしたのです。
  d_nikke_hongryeon_goddeath_02_18:
    speaker: hongryeon_g
    en: So her concern for me was born of instinct, then.
    ko: 나를 위한 마음이 본능과도 같았다는 게로군.
    ja: 私を想う心、それが本能だったということか。
  d_nikke_hongryeon_goddeath_02_19:
    speaker: cecil
    en: You could say that.
    ko: 그렇다고 할 수 있죠.
    ja: そうとも言えますね。
  d_nikke_hongryeon_goddeath_02_20:
    speaker: hongryeon_g
    en: Prithee, by what means did Rose sacrifice herself?
    ko: 그러면 언니는 어떻게 자신을 희생한 겐가?
    ja: |-
      ならば、姉さんはどのようにして
      己を犠牲にしたのだ？
  d_nikke_hongryeon_goddeath_02_21:
    speaker: cecil
    en: "... First, I owe you an apology."
    ko: "…일단 미안하다는 말부터 할게요."
    ja: "…その前に、謝らせてください。"
  d_nikke_hongryeon_goddeath_02_22:
    speaker: cecil
    en: If there had been a way to save you both, I would have looked for it.
    ko: 가능하다면 저도 당신과 장화, 모두를 살릴 수 있는 길을 찾고 싶었어요.
    ja: |-
      できることなら私も、あなたと薔花、
      どちらも救える道を探したかったのですが…
  d_nikke_hongryeon_goddeath_02_23:
    speaker: hongryeon_g
    en: I bear thee no blame.
    ko: 자네를 탓할 생각은 없네.
    ja: 君を責めるつもりはない。
  d_nikke_hongryeon_goddeath_02_24:
    speaker: hongryeon_g
    en: I desire only to know how she met her end.
    ko: 나는 그저 언니의 마지막을 알고 싶을 뿐이네.
    ja: 私はただ、姉さんの最期を知りたいだけだ。
  d_nikke_hongryeon_goddeath_02_25:
    speaker: "<Narration>"
    en: Cecil closes her eyes.
    ko: 세실이 눈을 감았다.
    ja: セシルは目を閉じた
  d_nikke_hongryeon_goddeath_02_26:
    speaker: cecil
    en: It's not a memory I'd care to revisit, but...
    ko: 다시 떠올리고 싶은 기억은 아니지만,
    ja: 二度と思い出したくない記憶ではありますが…
  d_nikke_hongryeon_goddeath_02_27:
    speaker: cecil
    en: Rose stabbed herself in the head
    ko: 장화는 스스로 자신의 머리를 찔렀어요.
    ja: 薔花は自ら、自身の頭を突き刺したのです。
  d_nikke_hongryeon_goddeath_02_28:
    speaker: cecil
    en: so I could revive you without hesitation.
    ko: 제가 더 고민하지 않고, 당신을 되살릴 수 있게끔.
    ja: |-
      私がこれ以上迷うことなく、
      あなたを蘇らせることができるようにと。
  d_nikke_hongryeon_goddeath_02_29:
    speaker: hongryeon_g
    en: Truly... an end most befitting her.
    ko: 참으로… 언니다운 최후였군.
    ja: 実に…姉さんらしい最期だな。
  d_nikke_hongryeon_goddeath_02_30:
    speaker: cecil
    en: I'm truly sorry I couldn't save Rose.
    ko: 장화를 구해내지 못해서 정말 미안해요.
    ja: 本当にごめんなさい。
  d_nikke_hongryeon_goddeath_02_31:
    speaker: cecil
    en: I understand if you resent me.
    ko: 절 원망해도 좋아요.
    ja: 私を恨んでも構いません。
  d_nikke_hongryeon_goddeath_02_32:
    speaker: hongryeon_g
    en: By thy grace, I was granted one final chance to see mine elder sister.
    ko: 낭자 덕에 마지막으로 언니를 만날 수 있었네.
    ja: 君のおかげで、最後に姉さんに会えたのだ。
  d_nikke_hongryeon_goddeath_02_33:
    speaker: hongryeon_g
    en: How could I ever lay the blame upon thee?
    ko: 내 어찌 낭자를 탓한단 말인가?
    ja: 責めることなどできまい。
  d_nikke_hongryeon_goddeath_02_34:
    speaker: hongryeon_g
    en: And yet, I daresay thou hast grown somewhat gentler thyself.
    ko: 그나저나 낭자도 뭔가 사람이 유해진 느낌이군.
    ja: |-
      それはそうと、君もどこか
      丸くなったのではないかい？
  d_nikke_hongryeon_goddeath_02_35:
    speaker: cecil
    en: "... I'm only human, after all."
    ko: "…저도 사람이니까요."
    ja: "…私も人間ですから。"
  d_nikke_hongryeon_goddeath_02_36:
    speaker: cecil
    en: I lost my comrades over nothing more than wounded pride and trivial ideals.
    ko: 한낱 자존심이나 별것도 아닌 사상 때문에 동료를 잃어버렸고,
    ja: |-
      ちっぽけなプライドや、
      つまらない思想のせいで仲間を失い…
  d_nikke_hongryeon_goddeath_02_37:
    speaker: cecil
    en: I regretted it only after it was too late.
    ko: 그때 가서야 뒤늦게 후회하고,
    ja: 失ってようやく後悔し…
  d_nikke_hongryeon_goddeath_02_38:
    speaker: cecil
    en: After suffering one loss after another, I suppose I've grown a little softer...
    ko: 그런 일들을 연속해서 겪다보니 조금은 유해졌다.
    ja: |-
      そういったことが重なるうちに、
      少しは丸くなったのかもしれませんね。
  d_nikke_hongryeon_goddeath_02_39:
    speaker: cecil
    en: No, perhaps weaker is the better word.
    ko: 아니, 유약해졌다고 봐도 되겠죠.
    ja: いいえ、弱くなったと言うべきでしょうか。
  d_nikke_hongryeon_goddeath_02_40:
    speaker: hongryeon_g
    en: Chide thyself not so.
    ko: 너무 자책하지 말게나.
    ja: あまり自分を責めるでない。
  d_nikke_hongryeon_goddeath_02_41:
    speaker: hongryeon_g
    en: Folk oft speak as though it were folly to mend the stable door once the horse
      hath bolted.
    ko: 소 잃고 외양간 고치는 게 나쁘다는 것처럼 말하곤 하지만,
    ja: |-
      例えるならば…
      牛を失ってから牛小屋を直すのは
      愚かなことのように思えるが…
  d_nikke_hongryeon_goddeath_02_42:
    speaker: hongryeon_g
    en: Yet what ill is there in mending it, though the horse be lost?
    ko: 잃고서라도 고치는 게 어딘가.
    ja: |-
      牛を失ってからでも、
      直すだけいいではないか。
  d_nikke_hongryeon_goddeath_02_43:
    speaker: hongryeon_g
    en: 'For such is the nature of man: he knoweth not the worth of a mended stable
      door till his horse hath fled.'
    ko: 오히려 사람은 소를 잃어보지 않으면, 외양간을 고칠 생각조차 못하는 존재일세.
    ja: |-
      人間とは、失わなければ
      直そうとさえ思わぬ存在だ。
  d_nikke_hongryeon_goddeath_02_44:
    speaker: cecil
    en: "... Thank you for saying that."
    ko: "…고마워요. 그렇게 말해줘서."
    ja: |-
      …ありがとうございます。
      そうおっしゃってくださって。
  d_nikke_hongryeon_goddeath_02_45:
    speaker: hongryeon_g
    en: Come now, square thy shoulders.
    ko: 자, 좀 어깨를 펴보시게.
    ja: さあ、胸を張っておくれ。
  d_nikke_hongryeon_goddeath_02_46:
    speaker: hongryeon_g
    en: Surely Eden's finest mind should not look so downcast.
    ko: 에덴의 두뇌가 그렇게 축 처져서야 되겠는가.
    ja: エデンの頭脳が、そううなだれていてどうする。
  d_nikke_hongryeon_goddeath_02_47:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_02_48:
    speaker: cecil
    en: Let's move on to practical matters.
    ko: 그럼 이제 현실적인 이야기를 해볼까요.
    ja: では、現実的な話をしましょう。
  d_nikke_hongryeon_goddeath_02_49:
    speaker: cecil
    en: First, check your body over.
    ko: 일단 당신의 바디를 체크해주세요.
    ja: まずは、身体の状態をチェックしてください。
  d_nikke_hongryeon_goddeath_02_50:
    speaker: cecil
    en: Let me know if you experience any discomfort,
    ko: 불편한 부분은 있는지,
    ja: 不便なところはないか、
  d_nikke_hongryeon_goddeath_02_51:
    speaker: cecil
    en: if there's anything you're dissatisfied with,
    ko: 마음에 들지 않는 부분은 있는지,
    ja: 気に入らないところはないか、
  d_nikke_hongryeon_goddeath_02_52:
    speaker: cecil
    en: or if you need anything else.
    ko: 더 필요한 게 있는지 말해주세요.
    ja: 他に必要なものはないか教えてください。
  d_nikke_hongryeon_goddeath_02_53:
    speaker: cecil
    en: I'll make any necessary adjustments promptly.
    ko: 조정이 필요한 부분이 있다면 빠르게 작업할게요.
    ja: 調整が必要な部分があれば、すぐに対応します。
  d_nikke_hongryeon_goddeath_02_54:
    speaker: hongryeon_g
    en: A matter yet to be set aright...
    ko: 조정이 필요한 부분이라….
    ja: 調整か…
  d_nikke_hongryeon_goddeath_02_55:
    speaker: "<Narration>"
    en: Scarlet gazes at the dormant red blade floating beside her.
    ko: 홍련은 잠들어 있는 붉은 칼날을 바라본다.
    ja: 紅蓮はいまだ眠りし赤い刃を見つめる
  d_nikke_hongryeon_goddeath_02_56:
    speaker: hongryeon_g
    en: Might my sister's blade and mine be joined as one?
    ko: 언니의 검과 내 검이 합쳐질 수 있는 것인가.
    ja: 姉さんの剣と私の剣が、一つに…？
  d_nikke_hongryeon_goddeath_02_57:
    speaker: "<Narration>"
    en: "*Shiing*"
    ko: 스르릉-
    ja: シャリン――
  d_nikke_hongryeon_goddeath_02_58:
    speaker: "<Narration>"
    en: She draws her sword,
    ko: 탁-
    ja: チンッ
  d_nikke_hongryeon_goddeath_02_59:
    speaker: "<Narration>"
    en: then quickly sheathes it with a clack.
    ko: 검이 한 번 뽑혔다가 다시 검집에 되돌아간다.
    ja: 剣が抜かれ、再び鞘に収まる
  d_nikke_hongryeon_goddeath_02_60:
    speaker: hongryeon_g
    en: I have need of naught else.
    ko: 필요한 것은 없네.
    ja: 特にないな。
  d_nikke_hongryeon_goddeath_02_61:
    speaker: cecil
    en: Are you sure?
    ko: 정말 괜찮은가요?
    ja: 本当に大丈夫ですか？
  d_nikke_hongryeon_goddeath_02_62:
    speaker: cecil
    en: If there's anything you need, just let me know.
    ko: 필요한 거라면 뭐든 말해줘도 괜찮은데요.
    ja: 何でも言っていただいて構いませんよ。
  d_nikke_hongryeon_goddeath_02_63:
    speaker: cecil
    en: There's no need to hold back.
    ko: 사양할 필요는 없어요.
    ja: 遠慮の必要はありません。
  d_nikke_hongryeon_goddeath_02_64:
    speaker: hongryeon_g
    en: This alone shall suffice.
    ko: 이걸로 충분하네.
    ja: これで十分だ。
  d_nikke_hongryeon_goddeath_02_65:
    speaker: hongryeon_g
    en: A swordsman need only take a blade in hand
    ko: 칼잡이들은 검을 들어보기만 해도,
    ja: 剣士というのは剣を手にしただけで、
  d_nikke_hongryeon_goddeath_02_66:
    speaker: hongryeon_g
    en: to know whether it befits him.
    ko: 내게 맞는 검인지 아닌지 판단할 수 있으니까.
    ja: 自分に合うかどうかが分かるのだよ。
  d_nikke_hongryeon_goddeath_02_67:
    speaker: hongryeon_g
    en: And my hand doth know this blade was wrought for me alone.
    ko: 이 검은 오직 나만을 위한 검이라는 걸, 내 손이 알고 있네.
    ja: |-
      この剣が私だけのための剣だということは、
      この手が知っている。
  d_nikke_hongryeon_goddeath_02_68:
    speaker: cecil
    en: So there's no need to test it?
    ko: 그렇다면 테스트도 필요 없는 건가요?
    ja: テストも必要ないということですか？
  d_nikke_hongryeon_goddeath_02_69:
    speaker: hongryeon_g
    en: What better practice couldst thou find than battle itself?
    ko: 실전이 곧 연습이지 않겠는가.
    ja: 実戦こそが修練であろう？
  d_nikke_hongryeon_goddeath_02_70:
    speaker: cecil
    en: Though I can't say I recommend it...
    ko: 그게 바람직하다고 생각하진 않지만….
    ja: 望ましいことだとは思いませんが…
  d_nikke_hongryeon_goddeath_02_71:
    speaker: cecil
    en: If that's your decision, I have nothing more to say.
    ko: 본인이 그렇다고 하니, 더 할 말은 없군요.
    ja: |-
      本人がそう言うなら、
      これ以上言うことはありませんね。
  d_nikke_hongryeon_goddeath_02_72:
    speaker: cecil
    en: Still, if you change your mind before we depart, let me know.
    ko: 그래도 혹시 출발 전까지 마음이 바뀐다면 말해주세요.
    ja: もし出発までに気が変わったら言ってください。
  d_nikke_hongryeon_goddeath_02_73:
    speaker: cecil
    en: We're short on time, so I can't prepare much.
    ko: 시간이 촉박해서 많은 걸 하긴 힘들겠지만,
    ja: |-
      時間が限られてるので、
      すべては難しいかもしれませんが、
  d_nikke_hongryeon_goddeath_02_74:
    speaker: cecil
    en: But I'll do what I can...
    ko: 최대한 준비할 수 있는 것들은 준비해 볼게요.
    ja: できる限り対応します。
  d_nikke_hongryeon_goddeath_02_75:
    speaker: cecil
    en: Weapons, equipment, whatever you need.
    ko: 무장이든, 뭐든.
    ja: 武装でも、何でも。
  d_nikke_hongryeon_goddeath_02_76:
    speaker: hongryeon_g
    en: If that be so, I have but one favor to ask of thee.
    ko: 오, 그렇다면 부탁하고 싶은 게 하나 있네.
    ja: おお、ならば一つ頼みたいことがあるのだが。
  d_nikke_hongryeon_goddeath_02_77:
    speaker: cecil
    en: Go ahead.
    ko: 말씀하세요.
    ja: どうぞ。
  d_nikke_hongryeon_goddeath_02_78:
    speaker: hongryeon_g
    en: Might I behold the flowers that bloom in Eden?
    ko: 에덴에 있는 꽃을 한 번 보러가도 되겠나?
    ja: エデンにある花を見ても？
d_nikke_hongryeon_goddeath_03:
  d_nikke_hongryeon_goddeath_03_1:
    speaker: cecil
    en: Flowers?
    ko: 꽃이요?
    ja: 花ですか？
  d_nikke_hongryeon_goddeath_03_2:
    speaker: hongryeon_g
    en: There is a flower I would fain behold.
    ko: 보고 싶은 꽃이 하나 있어서 그렇네.
    ja: ああ、見たい花があってね。
  d_nikke_hongryeon_goddeath_03_3:
    speaker: hongryeon_g
    en: I know full well this is hardly the time to go seeking flowers,
    ko: 지금 한가롭게 꽃이나 보고 있을 상황이 아니라는 건 알고 있네만,
    ja: |-
      のんびりと花など眺めている場合ではない
      ということは分かっているが…
  d_nikke_hongryeon_goddeath_03_4:
    speaker: hongryeon_g
    en: yet if I leave my heart unsettled, I fear I shall rue it unto my dying day.
    ko: 마지막으로 마음의 정리를 하지 않으면 후회할 것 같아 그러네.
    ja: |-
      最後に心の内を整理しておかねば、
      悔いを残しそうでな。
  d_nikke_hongryeon_goddeath_03_5:
    speaker: hongryeon_g
    en: I would fain set my heart at ease, once and for all.
    ko: 깔끔하게 마음의 정리를 하고 싶어.
    ja: 綺麗にしておきたいのだ。
  d_nikke_hongryeon_goddeath_03_6:
    speaker: cecil
    en: There are still more tests to run,
    ko: 추가 테스트해야 할 것도 있고,
    ja: 追加のテストもありますし…
  d_nikke_hongryeon_goddeath_03_7:
    speaker: cecil
    en: and I'd like to gather some additional data while I'm at it...
    ko: 조금이라도 데이터를 확보해두고 싶은 것도 있긴 한데.
    ja: |-
      少しでもデータを確保しておきたい
      ところではあるのですが。
  d_nikke_hongryeon_goddeath_03_8:
    speaker: "<Narration>"
    en: Cecil meets Scarlet's gaze.
    ko: 세실이 홍련의 눈을 바라본다.
    ja: セシルは紅蓮の目を見つめた
  d_nikke_hongryeon_goddeath_03_9:
    speaker: cecil
    en: "... But it's important not to leave anything unresolved, either."
    ko: "…미련을 남겨두지 않는 것도 중요하겠죠."
    ja: "…分かりました。それも大切なことですね。"
  d_nikke_hongryeon_goddeath_03_10:
    speaker: cecil
    en: We'll have time while Rapunzel undergoes her tests.
    ko: 어차피 라푼젤의 테스트를 진행하는 동안에는 시간이 있으니까요.
    ja: |-
      いずれにせよ、ラプンツェルのテストを
      行っている間は時間があります。
  d_nikke_hongryeon_goddeath_03_11:
    speaker: cecil
    en: Now, which flower shall I prepare for you?
    ko: 그래서 어떤 꽃으로 준비하면 될까요?
    ja: それで、どんな花ですか？
  d_nikke_hongryeon_goddeath_03_12:
    speaker: hongryeon_g
    en: I would fain behold a rose.
    ko: 장미를 한 송이 보고 싶네.
    ja: 薔薇が見たい。
  d_nikke_hongryeon_goddeath_03_13:
    speaker: cecil
    en: Unfortunately, we don't have any roses growing in Eden at the moment.
    ko: 안타깝지만 지금 에덴에 심어둔 장미가 없어요.
    ja: あいにく、今はエデンにバラはありません。
  d_nikke_hongryeon_goddeath_03_14:
    speaker: hongryeon_g
    en: Alas,
    ko: 그런가.
    ja: そうか。
  d_nikke_hongryeon_goddeath_03_15:
    speaker: hongryeon_g
    en: "'tis a pity."
    ko: 아쉽게 됐군.
    ja: それは残念だ。
  d_nikke_hongryeon_goddeath_03_16:
    speaker: cecil
    en: But we do have rose seeds.
    ko: 하지만 장미 씨앗이라면 있죠.
    ja: ですが、種ならあります。
  d_nikke_hongryeon_goddeath_03_17:
    speaker: cecil
    en: If those will do, shall I prepare some for you?
    ko: 그걸로도 괜찮다면 준비해 드릴까요?
    ja: それでもよければ、用意しましょうか？
  d_nikke_hongryeon_goddeath_03_18:
    speaker: hongryeon_g
    en: Aye, 'twould please me greatly!
    ko: "!! 물론이네."
    ja: "！！もちろんだ。"
  d_nikke_hongryeon_goddeath_03_19:
    speaker: hongryeon_g
    en: I should like nothing better than to plant them with mine own hands.
    ko: 내가 직접 심을 수 있으면, 더 없이 좋겠군.
    ja: |-
      この手で直に植えられるのなら、
      それ以上望むものはない。
  d_nikke_hongryeon_goddeath_03_20:
    speaker: cecil
    en: Understood.
    ko: 알겠어요.
    ja: 分かりました。
  d_nikke_hongryeon_goddeath_03_21:
    speaker: hongryeon_g
    en: Thou hast my thanks, Maiden Cecil.
    ko: 고맙네, 세실 낭자.
    ja: 礼を言う。
  d_nikke_hongryeon_goddeath_03_22:
    speaker: hongryeon_g
    en: Might I trouble thee for a few more favors, perchance?
    ko: 그런데 혹시 몇 가지만 더 부탁해도 되겠나?
    ja: ところで、もういくつか頼んでも？
  d_nikke_hongryeon_goddeath_03_23:
    speaker: cecil
    en: By all means.
    ko: 얼마든지요.
    ja: いくらでもどうぞ。
  d_nikke_hongryeon_goddeath_03_24:
    speaker: hongryeon_g
    en: Forgive me for troubling thee yet again,
    ko: 자꾸 번거롭게 해서 미안하지만,
    ja: 度々手を煩わせてすまぬが…
  d_nikke_hongryeon_goddeath_03_25:
    speaker: hongryeon_g
    en: but wouldst thou procure me a small sign and a wine cup?
    ko: 작은 팻말과 술잔을 하나 준비해 줬으면 하네.
    ja: 小さな立て札と、杯を1つ用意してもらいたい。
  d_nikke_hongryeon_goddeath_03_26:
    speaker: cecil
    en: "... Do you need alcohol as well?"
    ko: "…술까지 필요한가요?"
    ja: "…お酒も必要では？"
  d_nikke_hongryeon_goddeath_03_27:
    speaker: hongryeon_g
    en: If it be possible, I should welcome it gladly.
    ko: 그럴 수 있다면 좋겠지.
    ja: それはありがたい。
  d_nikke_hongryeon_goddeath_03_28:
    speaker: hongryeon_g
    en: But for now, water shall suffice.
    ko: 하지만 지금은 물로도 충분하네.
    ja: しかし、今は水で十分だ。
  d_nikke_hongryeon_goddeath_03_29:
    speaker: hongryeon_g
    en: When all is done and we have returned,
    ko: 술은 모든 것이 끝나고 돌아왔을 때,
    ja: 酒はすべてが終わって戻った時…
  d_nikke_hongryeon_goddeath_03_30:
    speaker: hongryeon_g
    en: then shall we share a cup and converse at our leisure.
    ko: 그 때 제대로 인사하면서 들겠네.
    ja: 挨拶をしながらいただくとしよう。
  d_nikke_hongryeon_goddeath_03_31:
    speaker: cecil
    en: Then head to the lobby. I'll have everything you requested ready and meet
      you there.
    ko: 그러면 말씀하신 것들을 준비해서 갈 테니, 먼저 로비로 가 있어 주세요.
    ja: |-
      では、用意して向かうので
      先にロビーでお待ちください。
  d_nikke_hongryeon_goddeath_03_32:
    speaker: "<Narration>"
    en: Scarlet slowly walks around the lobby, taking in the plants throughout the
      space.
    ko: 홍련은 로비를 천천히 걸어다니며, 곳곳에 심어진 식물들을 바라본다.
    ja: |-
      紅蓮はロビーをゆっくりと歩きながら、
      あちこちに植えられた植物を眺めた
  d_nikke_hongryeon_goddeath_03_33:
    speaker: "<Narration>"
    en: She then stops in front of a small artificial pond.
    ko: 그리고 작은 인공 연못 앞에 멈춰 섰다.
    ja: そして、小さな人工池の前で足を止めた
  d_nikke_hongryeon_goddeath_03_34:
    speaker: hongryeon_g
    en: Ho, a lotus groweth here as well.
    ko: 호오, 연꽃도 있었군.
    ja: ほう、蓮の花もあったのか。
  d_nikke_hongryeon_goddeath_03_35:
    speaker: hongryeon_g
    en: Methinks this a fair place to sow the rose seed.
    ko: 장미 씨앗을 이 근방에 심는 것도 괜찮을 것 같군그래.
    ja: 薔薇はこの辺りに植えてもよさそうだな。
  d_nikke_hongryeon_goddeath_03_36:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_03_37:
    speaker: hongryeon_g
    en: Nay,
    ko: 아니.
    ja: いや。
  d_nikke_hongryeon_goddeath_03_38:
    speaker: hongryeon_g
    en: the lotus hath no more need to abide alongside the rose.
    ko: 이제 더 이상 연꽃이 장미와 함께 있을 필요는 없지.
    ja: もう、蓮の花が薔薇と共にある必要はあるまい。
  d_nikke_hongryeon_goddeath_03_39:
    speaker: hongryeon_g
    en: "'Tis time the lotus learned to bloom alone."
    ko: 연꽃도 이젠 홀로 피어있을 줄 알아야 하니까.
    ja: |-
      蓮の花も、独りで咲く術を
      知らねばならぬからな。
  d_nikke_hongryeon_goddeath_03_40:
    speaker: cecil
    en: I brought everything you requested.
    ko: 말씀하신 것들 다 챙겨왔어요.
    ja: 頼まれたものを用意できました。
  d_nikke_hongryeon_goddeath_03_41:
    speaker: hongryeon_g
    en: Ah, thou hast returned.
    ko: 아아, 왔는가.
    ja: おお、来たか。
  d_nikke_hongryeon_goddeath_03_42:
    speaker: cecil
    en: Were you looking at the flowers?
    ko: 꽃을 보고 계셨나요?
    ja: 花を見ていたのですか？
  d_nikke_hongryeon_goddeath_03_43:
    speaker: hongryeon_g
    en: Indeed, I was seeking a fine place to sow the seed.
    ko: 그렇네. 어디에 심으면 좋을지 찾아보고 있었지.
    ja: |-
      ああ。どこに植えるのがよいか、
      探していたところだ。
  d_nikke_hongryeon_goddeath_03_44:
    speaker: cecil
    en: How about over there?
    ko: 저쪽은 어떤가요?
    ja: あちらはいかがですか？
  d_nikke_hongryeon_goddeath_03_45:
    speaker: "<Narration>"
    en: Cecil points to a spot in the garden.
    ko: 세실이 정원 한 곳을 가리켰다.
    ja: セシルが庭の一角を指さした
  d_nikke_hongryeon_goddeath_03_46:
    speaker: cecil
    en: That's where the lobby gets the most sunlight.
    ko: 로비에서 가장 볕이 잘드는 곳이에요.
    ja: ロビーで一番日当たりがいい場所です。
  d_nikke_hongryeon_goddeath_03_47:
    speaker: hongryeon_g
    en: Most excellent.
    ko: 아주 좋네.
    ja: おお。実にいい場所だな。
  d_nikke_hongryeon_goddeath_03_48:
    speaker: cecil
    en: Then let's plant it over there.
    ko: 그럼 저쪽에 심는 걸로 하죠.
    ja: では、あちらに植えることにしましょう。
  d_nikke_hongryeon_goddeath_03_49:
    speaker: cecil
    en: Here are the garden marker and the cup you asked for.
    ko: 일단 여기 말씀하신 팻말하고 술잔이에요.
    ja: 頼まれていた立て札と杯です。
  d_nikke_hongryeon_goddeath_03_50:
    speaker: cecil
    en: The rose seed is in this packet.
    ko: 봉투에 담긴게 장미 씨앗이고요.
    ja: 袋に入ってるのがバラの種です。
  d_nikke_hongryeon_goddeath_03_51:
    speaker: "<Narration>"
    en: Scarlet takes the things from Cecil.
    ko: 홍련이 세실에게서 짐을 받아든다.
    ja: セシルが紅蓮に手渡した
  d_nikke_hongryeon_goddeath_03_52:
    speaker: cecil
    en: Will you be planting it right away?
    ko: 지금 바로 심을 건가요?
    ja: 今すぐ植えますか？
  d_nikke_hongryeon_goddeath_03_53:
    speaker: hongryeon_g
    en: Nay, tarry a moment.
    ko: 아니, 잠시만 기다려주게.
    ja: いや、少し待っておくれ。
  d_nikke_hongryeon_goddeath_03_54:
    speaker: hongryeon_g
    en: I have a few words to inscribe upon the sign.
    ko: 팻말에 적을 말이 있으니.
    ja: 立て札に書き記したい言葉があるのだ。
  d_nikke_hongryeon_goddeath_03_55:
    speaker: "<Narration>"
    en: Scarlet presses a finger to the garden marker.
    ko: 홍련이 손가락으로 팻말을 누른다.
    ja: 紅蓮が指先を立て札に押しあてた
  d_nikke_hongryeon_goddeath_03_56:
    speaker: "<Narration>"
    en: "*Krkk*"
    ko: 또각-
    ja: スーッ
  d_nikke_hongryeon_goddeath_03_57:
    speaker: "<Narration>"
    en: One character at a time, an inscription takes shape on the marker.
    ko: 한 글자, 한 글자 팻말에 글귀가 적혀져간다.
    ja: 1文字ずつ文字が刻まれていく
  d_nikke_hongryeon_goddeath_03_58:
    speaker: cecil
    en: What are you writing?
    ko: 뭘 적고 계신거죠?
    ja: 何を書くのですか？
  d_nikke_hongryeon_goddeath_03_59:
    speaker: hongryeon_g
    en: Words I would impart unto Rose,
    ko: 언니에게 전해주고 싶은 말.
    ja: 姉さんに伝えたい言葉。
  d_nikke_hongryeon_goddeath_03_60:
    speaker: hongryeon_g
    en: and a reminder unto mine own heart.
    ko: 그리고 내 스스로에게 하는 말일세.
    ja: そして、私自身への言葉だ。
  d_nikke_hongryeon_goddeath_03_61:
    speaker: cecil
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_hongryeon_goddeath_03_62:
    speaker: "<Narration>"
    en: A faint smile crosses Scarlet's lips.
    ko: 홍련은 입가에 미소를 띄웠다.
    ja: 紅蓮は口元に笑みを浮かべた
  d_nikke_hongryeon_goddeath_03_63:
    speaker: hongryeon_g
    en: What I have writ upon it, thou shalt behold when I set the sign upright.
    ko: 뭐라고 썼는지는 팻말을 세울 때 보시게나.
    ja: |-
      何と書いたかは、立て札を立てる時に
      見ておくれ。
d_nikke_hongryeon_goddeath_04:
  d_nikke_hongryeon_goddeath_04_1:
    speaker: "<Narration>"
    en: Scarlet sits down near the garden bed.
    ko: 홍련이 화단 근처에 앉는다.
    ja: 紅蓮が花壇の近くに腰を下ろした
  d_nikke_hongryeon_goddeath_04_2:
    speaker: hongryeon_g
    en: Very well, then. Let us begin forthwith.
    ko: 그러면 바로 시작하도록 함세.
    ja: では、始めるとするかね。
  d_nikke_hongryeon_goddeath_04_3:
    speaker: "<Narration>"
    en: She then scoots to the front...
    ko: 홍련이 화단 앞에 앉는다.
    ja: 紅蓮は花壇の前で…
  d_nikke_hongryeon_goddeath_04_4:
    speaker: "<Narration>"
    en: "*Scritch, scritch*"
    ko: 퍼석- 퍼석-
    ja: ザクッ、ザクッ
  d_nikke_hongryeon_goddeath_04_5:
    speaker: "<Narration>"
    en: Carefully, she digs into the soil.
    ko: 흙을 조심스레 파낸다.
    ja: 慎重に土を掘り起こした
  d_nikke_hongryeon_goddeath_04_6:
    speaker: "<Narration>"
    en: From the packet, she takes a rose seed and places it in the hole.
    ko: 봉투에서 장미 씨앗을 꺼내고, 파낸 흙 위에 넣는다.
    ja: |-
      そして袋からバラの種を取り出し、
      掘り起こした土の上に置いた
  d_nikke_hongryeon_goddeath_04_7:
    speaker: "<Narration>"
    en: "*Scritch, scritch*"
    ko: 퍼석- 퍼석-
    ja: ザクッ、ザクッ
  d_nikke_hongryeon_goddeath_04_8:
    speaker: "<Narration>"
    en: She scoops the soil back over the seed.
    ko: 씨앗 위로 흙이 덮인다.
    ja: 種が土で覆われていく
  d_nikke_hongryeon_goddeath_04_9:
    speaker: hongryeon_g
    en: Shall this suffice?
    ko: 이러면 문제 없겠는가?
    ja: これでよいだろうか？
  d_nikke_hongryeon_goddeath_04_10:
    speaker: cecil
    en: You can pack the soil around it down a little too.
    ko: 주변의 흙을 조금 다져줘도 좋겠네요.
    ja: 周りの土を少し固めるといいかと。
  d_nikke_hongryeon_goddeath_04_11:
    speaker: cecil
    en: Just don't press too hard.
    ko: 너무 세지는 않게요.
    ja: あまり力は入れないでください。
  d_nikke_hongryeon_goddeath_04_12:
    speaker: "<Narration>"
    en: Scarlet pats down the soil over the seed.
    ko: 툭툭-
    ja: トン、トン
  d_nikke_hongryeon_goddeath_04_13:
    speaker: hongryeon_g
    en: Here should do nicely, methinks.
    ko: 이건 이 앞에 박아두면 되겠지.
    ja: これはこの前に立てておけばよいな。
  d_nikke_hongryeon_goddeath_04_14:
    speaker: "<Narration>"
    en: "*Thwup*"
    ko: 푸욱-
    ja: ザクッ
  d_nikke_hongryeon_goddeath_04_15:
    speaker: "<Narration>"
    en: The garden marker sinks into the soil in front of the flower bed where she
      planted the seed.
    ko: 씨앗을 심은 화단 앞에 팻말이 박힌다.
    ja: 種を植えた花壇の前に立て札が突き刺さる
  d_nikke_hongryeon_goddeath_04_16:
    speaker: "<Narration>"
    en: Cecil crouches down in front of it and reads the marker.
    ko: 세실이 화단 앞에 앉아, 팻말을 확인한다.
    ja: |-
      セシルは花壇の前にしゃがみ、
      立て札を確認した
  d_nikke_hongryeon_goddeath_04_17:
    speaker: cecil
    en: Though no flower stayeth red for eleven days, spring endeth not when its blossoms
      fall.
    ko: 화무십일일홍, 낙화춘불진.
    ja: 花無十一日紅、落花春不尽。
  d_nikke_hongryeon_goddeath_04_18:
    speaker: cecil
    en: Is that correct?
    ko: 맞나요?
    ja: ですか？
  d_nikke_hongryeon_goddeath_04_19:
    speaker: hongryeon_g
    en: Thou speakest true.
    ko: 정확하네.
    ja: その通り。
  d_nikke_hongryeon_goddeath_04_20:
    speaker: hongryeon_g
    en: Though no flower remaineth red for eleven days, spring endureth long after
      its blossoms have fallen.
    ko: 열하루 붉은 꽃은 없어도, 꽃이 진다고 해서 봄이 끝나지 않는다는 뜻이지.
    ja: |-
      十一日紅く咲く花はなくとも、花が散ったとて
      春が終わるわけではないという意味だ。
  d_nikke_hongryeon_goddeath_04_21:
    speaker: cecil
    en: The saying is "no flower remaineth red for ten days," is it not?
    ko: 그런데 화무십일홍이 맞는 표현으로 알고 있는데요.
    ja: 花無十日紅が正しい表現だと思っていました。
  d_nikke_hongryeon_goddeath_04_22:
    speaker: hongryeon_g
    en: 'One once spake thus:'
    ko: 누군가 그랬네.
    ja: 誰かが言っていた。
  d_nikke_hongryeon_goddeath_04_23:
    speaker: hongryeon_g
    en: '"Were a flower to bloom for but ten days, would that not be passing miserly?"'
    ko: 꽃이 열흘만 붉으면 너무 쪼잔하지 않느냐고.
    ja: |-
      花が紅いのは十日だけというのは、
      厳しすぎるのではないかと。
  d_nikke_hongryeon_goddeath_04_24:
    speaker: hongryeon_g
    en: Surely then, none would begrudge it one day more.
    ko: 그러니 하루쯤 더 붉어도, 뭐라 하는 이는 없지 않겠는가.
    ja: あと一日くらい紅くともいいではないか。
  d_nikke_hongryeon_goddeath_04_25:
    speaker: "<Narration>"
    en: Scarlet fills a cup with water,
    ko: 홍련이 술잔에 물을 따른다.
    ja: 紅蓮が杯に水を注ぎ…
  d_nikke_hongryeon_goddeath_04_26:
    speaker: "<Narration>"
    en: then tilts it over the spot where she planted the rose seed.
    ko: 그리고 장미 씨앗을 심은 곳에 술잔을 기울인다.
    ja: バラの種を植えた場所に杯を傾ける
  d_nikke_hongryeon_goddeath_04_27:
    speaker: "<Narration>"
    en: A gentle trickle of water falls onto the soil.
    ko: 쪼르르르-
    ja: トクトク…
  d_nikke_hongryeon_goddeath_04_28:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_04_29:
    speaker: cecil
    en: I'd only be in the way if I stayed here,
    ko: 제가 여기에 있어 봐야 방해만 될 것 같으니,
    ja: 私がここにいても邪魔なだけでしょう。
  d_nikke_hongryeon_goddeath_04_30:
    speaker: cecil
    en: so I'll go find Johan and Papillon for now.
    ko: 일단 전 요한과 파피용이 있는 곳에 가 있을게요.
    ja: ヨハンとパピヨンのところにいます。
  d_nikke_hongryeon_goddeath_04_31:
    speaker: hongryeon_g
    en: Thy company troubleth me not.
    ko: 같이 있어도 나는 신경쓰지 않네.
    ja: 構わぬさ。
  d_nikke_hongryeon_goddeath_04_32:
    speaker: cecil
    en: I'm not so tactless
    ko: 이런 상황에서 분위기를 못 읽을 정도로,
    ja: この状況で空気が読めないほど
  d_nikke_hongryeon_goddeath_04_33:
    speaker: cecil
    en: that I can't read the room.
    ko: 멋없는 여자는 아니에요.
    ja: 野暮な女ではないつもりです。
  d_nikke_hongryeon_goddeath_04_34:
    speaker: cecil
    en: For now, at least, do whatever you wish.
    ko: 잠깐만이라도 하고 싶은 대로 마음껏 하세요.
    ja: 束の間でも、心のむくままどうぞ。
  d_nikke_hongryeon_goddeath_04_35:
    speaker: cecil
    en: "... Sometimes, you have to keep your memories close to your heart and move
      on."
    ko: "…미련은 버리고 추억은 가슴에 묻어야 하는 법이니까요."
    ja: |-
      …未練は断ち切るもの。
      思い出は胸にしまうものですから。
  d_nikke_hongryeon_goddeath_04_36:
    speaker: hongryeon_g
    en: I thank thee.
    ko: 고맙네.
    ja: 感謝する。
  d_nikke_hongryeon_goddeath_04_37:
    speaker: cecil
    en: Don't mention it.
    ko: 천만에요.
    ja: どういたしまして。
  d_nikke_hongryeon_goddeath_04_38:
    speaker: "<Narration>"
    en: Cecil leaves the lobby.
    ko: 세실이 로비에서 벗어났다.
    ja: セシルがロビーを後にした
  d_nikke_hongryeon_goddeath_04_39:
    speaker: "<Narration>"
    en: Scarlet pours herself a glass of water
    ko: 쪼르르르-
    ja: トクトク…
  d_nikke_hongryeon_goddeath_04_40:
    speaker: "<Narration>"
    en: and takes a drink.
    ko: 홍련은 잔에 물을 받아 마신다.
    ja: 紅蓮は杯に水を注いで口をつけた
  d_nikke_hongryeon_goddeath_04_41:
    speaker: hongryeon_g
    en: "'Twould be only meet to share a cup of spirits at a time like this,"
    ko: 이럴 땐 당연히 곡차를 나눠야겠지만,
    ja: 酒を酌み交わすべきところだが…
  d_nikke_hongryeon_goddeath_04_42:
    speaker: hongryeon_g
    en: but prithee, indulge me just this once.
    ko: 오늘만 조금 이해해주게.
    ja: 今日だけは許しておくれ。
  d_nikke_hongryeon_goddeath_04_43:
    speaker: hongryeon_g
    en: Come our next meeting, I shall bring a cup worthy of thee.
    ko: 다음에는 언니를 위한 최고의 한 잔을 챙겨옴세.
    ja: 次は姉さんのために最高の一杯を持ってこよう。
  d_nikke_hongryeon_goddeath_04_44:
    speaker: "<Narration>"
    en: Scarlet pulls out Rose's hairpiece
    ko: 품에서 장화의 머리 장식을 꺼낸다.
    ja: 懐から薔花の髪飾りを取り出し…
  d_nikke_hongryeon_goddeath_04_45:
    speaker: "<Narration>"
    en: and ties it to the garden marker.
    ko: 머리 장식을 팻말에 묶는다.
    ja: 立て札に結びつけた
  d_nikke_hongryeon_goddeath_04_46:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 스르륵-
    ja: スルッ…
  d_nikke_hongryeon_goddeath_04_47:
    speaker: hongryeon_g
    en: Pray, keep thine eye upon me from afar, Rose.
    ko: 그곳에서 부디 지켜봐주시게, 언니.
    ja: どうかそこで見守っていておくれ、姉さん。
  d_nikke_hongryeon_goddeath_04_48:
    speaker: hongryeon_g
    en: With my comrades by my side, I shall venture forth toward the future.
    ko: 나는 동료들과 함께 미래를 향해 나아가겠네.
    ja: 私は仲間たちと共に、未来へと歩み出さねば。
  d_nikke_hongryeon_goddeath_04_49:
    speaker: "<Narration>"
    en: Scarlet tips her bottle,
    ko: 쪼르르르-
    ja: トクトク…
  d_nikke_hongryeon_goddeath_04_50:
    speaker: "<Narration>"
    en: pouring all the water onto the soil.
    ko: 홍련은 물병에 담긴 물을 모두 흙에 쏟아낸다.
    ja: 紅蓮は瓶の水をすべて土に注いだ
  d_nikke_hongryeon_goddeath_04_51:
    speaker: hongryeon_g
    en: But grieve not overmuch, for I shall keep thee forever in the dearest chamber
      of my heart.
    ko: 대신 내 가슴 속 가장 소중한 곳에 언니를 묻어둘 테니, 너무 섭섭해하진 마시게나.
    ja: |-
      代わりに、私の胸の内の
      最も大切な場所に、姉さんを留め置こう。
      だから、あまり寂しがらないでおくれ。
  d_nikke_hongryeon_goddeath_04_52:
    speaker: cecil_op_l
    en: Are you almost finished, Scarlet?
    ko: 홍련, 다 끝났나요?
    ja: 紅蓮、終わりましたか？
  d_nikke_hongryeon_goddeath_04_53:
    speaker: hongryeon_g
    en: I have done all that needed doing.
    ko: 해야 할 것은 모두 끝냈네.
    ja: すべきことはすべて終えた。
  d_nikke_hongryeon_goddeath_04_54:
    speaker: hongryeon_g
    en: And yet, thou seemest in such haste.
    ko: 그런데 많이 급해보이는군.
    ja: だが、ずいぶんと急いでいるようだな。
  d_nikke_hongryeon_goddeath_04_55:
    speaker: hongryeon_g
    en: Hath aught befallen thee?
    ko: 무슨 문제라도 있는가?
    ja: 何か問題でもあったのか？
  d_nikke_hongryeon_goddeath_04_56:
    speaker: cecil_op_l
    en: Communications are too unstable to get a clear picture of what's happening,
    ko: 통신 상태가 불량해서 정확한 상황 파악은 어려운데,
    ja: |-
      通信状態が悪いため
      正確な状況把握は難しいのですが、
  d_nikke_hongryeon_goddeath_04_57:
    speaker: cecil_op_l
    en: but it looks like a battle has broken out at the Lift.
    ko: 아무래도 궤도 엘리베이터에서 전투가 발생한 듯해요.
    ja: |-
      どうやら軌道エレベーターで
      戦闘が発生したようです。
  d_nikke_hongryeon_goddeath_04_58:
    speaker: cecil_op_l
    en: We'll have to leave earlier than planned.
    ko: 그래서 예정했던 것보다 더 빨리 출발해야하게 됐어요.
    ja: |-
      そのため、予定よりも早く
      出発する必要があります。
  d_nikke_hongryeon_goddeath_04_59:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_04_60:
    speaker: hongryeon_g
    en: Very well.
    ko: 알겠네.
    ja: 分かった。
  d_nikke_hongryeon_goddeath_04_61:
    speaker: hongryeon_g
    en: I shall set forth forthwith.
    ko: 그러면 지금 바로 출발하도록 하겠네.
    ja: ならば、今すぐ参ろう。
  d_nikke_hongryeon_goddeath_04_62:
    speaker: cecil_op_l
    en: No, please wait in the lobby for now.
    ko: 아뇨, 일단 로비에서 대기해주세요.
    ja: いいえ、ひとまずロビーで待機をお願いします。
  d_nikke_hongryeon_goddeath_04_63:
    speaker: cecil_op_l
    en: We're on our way,
    ko: 저희가 지금 로비로 가고 있으니까.
    ja: 私たちも今向かっているところです。
  d_nikke_hongryeon_goddeath_04_64:
    speaker: cecil_op_l
    en: and Rapunzel will be joining you shortly.
    ko: 그리고 라푼젤도 그쪽에 갈 거예요.
    ja: それから、ラプンツェルもそちらに。
d_nikke_hongryeon_goddeath_05:
  d_nikke_hongryeon_goddeath_05_1:
    speaker: "<Narration>"
    en: Cecil arrives in Eden's lobby,
    ko: 세실이 에덴 로비에 도착했다.
    ja: セシルがエデンのロビーに到着すると、
  d_nikke_hongryeon_goddeath_05_2:
    speaker: "<Narration>"
    en: followed shortly by Rapunzel.
    ko: 그리고 뒤이어 라푼젤도 로비에 나타났다.
    ja: |-
      それに続くようにラプンツェルも
      姿を現した
  d_nikke_hongryeon_goddeath_05_3:
    speaker: cecil
    en: Are you ready?
    ko: 준비는 끝나신 건가요.
    ja: 準備は整いましたか？
  d_nikke_hongryeon_goddeath_05_4:
    speaker: rapunzel_s
    en: Yes, of course.
    ko: 예, 물론이죠.
    ja: はい、バッチリです。
  d_nikke_hongryeon_goddeath_05_5:
    speaker: cecil
    en: How are you feeling?
    ko: 상태는 어떠시죠.
    ja: 調子はいかがですか？
  d_nikke_hongryeon_goddeath_05_6:
    speaker: rapunzel_s
    en: Hehe, I couldn't be better.
    ko: 후후. 이보다 좋을 순 없을 것 같은데요.
    ja: ふふ。これ以上ないほど、絶好調ですよ。
  d_nikke_hongryeon_goddeath_05_7:
    speaker: cecil
    en: Excellent. Then let's get going.
    ko: 좋아요. 그렇다면 출발하시죠.
    ja: それでは、出発ですね。
  d_nikke_hongryeon_goddeath_05_8:
    speaker: "<Narration>"
    en: Scarlet gets to her feet and walks over to Cecil and Rapunzel.
    ko: 홍련은 자리를 털고 일어나, 세실과 라푼젤에게 향했다.
    ja: |-
      紅蓮は立ち上がり、
      セシルとラプンツェルのもとへ向かった
  d_nikke_hongryeon_goddeath_05_9:
    speaker: hongryeon_g
    en: Very well. Let us make haste and lend my Lord our aid.
    ko: 좋네. 한시라도 빨리 도령에게 손을 보태러 가세나.
    ja: 一刻も早く、ぼっちゃんの助太刀に参ろう。
  d_nikke_hongryeon_goddeath_05_10:
    speaker: rapunzel_s
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_hongryeon_goddeath_05_11:
    speaker: hongryeon_g
    en: Well met, Rapunzel. Thou hast arrived at last.
    ko: 왔는가, 라푼젤.
    ja: 来たのかい、ラプンツェル。
  d_nikke_hongryeon_goddeath_05_12:
    speaker: rapunzel_s
    en: Scarlet...
    ko: 홍련….
    ja: 紅蓮…
  d_nikke_hongryeon_goddeath_05_13:
    speaker: hongryeon_g
    en: Thou lookest hale.
    ko: 혈색이 좋아 보이는군.
    ja: 顔色もよさそうだねぇ。
  d_nikke_hongryeon_goddeath_05_14:
    speaker: hongryeon_g
    en: Mayhap I worried for naught.
    ko: 내 괜한 걱정을 했나 싶네.
    ja: 余計な心配だったようだ。
  d_nikke_hongryeon_goddeath_05_15:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_05_16:
    speaker: "<Narration>"
    en: Scarlet knows all too well
    ko: 홍련은 알았다.
    ja: 紅蓮には分かった
  d_nikke_hongryeon_goddeath_05_17:
    speaker: "<Narration>"
    en: what emotion fills Rapunzel's eyes as she gazes at her.
    ko: 자신을 바라보는 라푼젤의 눈에 어떤 감정이 담겼는지를.
    ja: |-
      自分を見つめるラプンツェルの瞳に、
      どのような感情が込められているのか
  d_nikke_hongryeon_goddeath_05_18:
    speaker: "<Narration>"
    en: After all, she likely has that same look in her own eyes.
    ko: 아마 자신도 똑같은 눈을 하고 있을 테니까.
    ja: きっと自分も同じ目をしているだろう
  d_nikke_hongryeon_goddeath_05_19:
    speaker: hongryeon_g
    en: Yet surely, 'tis too soon for us to trade tales,
    ko: 그래도 회포를 풀기엔 아직 이르지 않겠는가.
    ja: だが、積もる話をするにはまだ早い
  d_nikke_hongryeon_goddeath_05_20:
    speaker: hongryeon_g
    en: whilst there remains a task yet to be done.
    ko: 아직 우리에게는 해야 할 일이 남아있으니 말일세.
    ja: 私たちには、まだすべきことがあるのだから
  d_nikke_hongryeon_goddeath_05_21:
    speaker: hongryeon_g
    en: Hm? Why dost thou gaze upon me so?
    ko: 음? 왜 그리 빤히 바라보는가.
    ja: ん？なぜそうまじまじと見つめる？
  d_nikke_hongryeon_goddeath_05_22:
    speaker: hongryeon_g
    en: If thou seekest a tearful reunion, I must disappoint thee.
    ko: 감동의 재회를 원한다면 사양하겠네.
    ja: 感動の再会なら、遠慮させてもらうよ。
  d_nikke_hongryeon_goddeath_05_23:
    speaker: hongryeon_g
    en: For we did meet again soon after that day, in truth. Hardly a reunion to make
      such a great fuss over.
    ko: 사실상 우린 그날 이후 바로 만난 것이나 다름없으니.
    ja: 私たちはすぐに再会したも同然だからな。
  d_nikke_hongryeon_goddeath_05_24:
    speaker: hongryeon_g
    en: And would that not be rather embarrassing? At this point—Mmph!
    ko: 그리고 낯간지럽지 않은가. 이쯤 되면- 으읍!
    ja: |-
      それに、気恥ずかしいではないか。
      今さら――むぐっ！
  d_nikke_hongryeon_goddeath_05_25:
    speaker: "<Narration>"
    en: Rapunzel pulls Scarlet into a hug.
    ko: 라푼젤이 홍련을 끌어 안았다.
    ja: ラプンツェルは紅蓮を抱き寄せた
  d_nikke_hongryeon_goddeath_05_26:
    speaker: rapunzel_s
    en: "... I'm so glad you came back."
    ko: "…돌아와서 정말 다행이에요."
    ja: "…戻ってきてくれて、本当に嬉しいです。"
  d_nikke_hongryeon_goddeath_05_27:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_hongryeon_goddeath_05_28:
    speaker: rapunzel_s
    en: I'm sorry, I've never been reunited with someone like this before, so I'm
      not quite sure what to make of these feelings...
    ko: 죄송해요. 이런 방식의 재회는 처음이라 뭔가 마음이 이상해서….
    ja: |-
      ごめんなさい。こんな形での再会は
      初めてなので、なんだか不思議な気持ちで…
  d_nikke_hongryeon_goddeath_05_29:
    speaker: hongryeon_g
    en: "... The same holds true for me, I daresay."
    ko: "…그건 나도 마찬가지라네."
    ja: "…それは私も同じだよ。"
  d_nikke_hongryeon_goddeath_05_30:
    speaker: "<Narration>"
    en: Scarlet and Rapunzel head for the Lift.
    ko: 홍련과 라푼젤은 궤도 엘리베이터로 향한다.
    ja: |-
      紅蓮とラプンツェルは
      軌道エレベーターへと向かった
  d_nikke_hongryeon_goddeath_05_31:
    speaker: cecil_op_l
    en: You're moving faster than I expected.
    ko: 생각보다 속도가 빠르군요.
    ja: 思ったより速いですね。
  d_nikke_hongryeon_goddeath_05_32:
    speaker: hongryeon_g
    en: My body doth feel remarkably light.
    ko: 어쩐지 몸이 많이 가볍네.
    ja: 体がずいぶんと軽い。
  d_nikke_hongryeon_goddeath_05_33:
    speaker: rapunzel_s
    en: Hehe, we're also wearing gear that improves our mobility.
    ko: 후후. 실제로 기동력이 좋은 장비를 착용하기도 했고요.
    ja: ふふ。機動力に長けた装備になりましたし。
  d_nikke_hongryeon_goddeath_05_34:
    speaker: cecil_op_l
    en: Either way, I'm glad you'll be able to join the fight sooner.
    ko: 뭐가 됐든, 빠르게 합류할 수 있어서 다행이네요.
    ja: |-
      何はともあれ、早く合流できそうで
      よかったです。
  d_nikke_hongryeon_goddeath_05_35:
    speaker: cecil_op_l
    en: We're reaching our destination ahead of schedule.
    ko: 목적지까지 남은 시간이 예상했던 것보다 빠르게 줄어들고 있어요.
    ja: 想定より速いペースで目的地に近づいています。
  d_nikke_hongryeon_goddeath_05_36:
    speaker: cecil_op_l
    en: I should warn you, though.
    ko: 그래서 미리 말씀드릴게요.
    ja: ですので、前もってお伝えしておきますね。
  d_nikke_hongryeon_goddeath_05_37:
    speaker: cecil_op_l
    en: The closer you get to the Lift, the more unstable the signal will become.
    ko: 궤도 엘리베이터에 가까워지면 가까워질수록, 통신 상태가 불량해져요.
    ja: |-
      軌道エレベーターに近づけば近づくほど、
      通信状態が悪化します。
  d_nikke_hongryeon_goddeath_05_38:
    speaker: cecil_op_l
    en: We'll likely lose contact with you soon after that,
    ko: 그래서 아마 오퍼레이터 연결이 곧 끊길 거예요.
    ja: |-
      間もなくこちらとの接続も
      切れてしまうでしょう。
  d_nikke_hongryeon_goddeath_05_39:
    speaker: cecil_op_l
    en: so you'll have to find your own way from there.
    ko: 남은 거리는 두 분이 알아서 찾아가야한다는 뜻이죠.
    ja: |-
      つまり、残りの道のりはお二人で
      向かうことになるということです。
  d_nikke_hongryeon_goddeath_05_40:
    speaker: hongryeon_g
    en: Fear not, for we have the coordinates in hand.
    ko: 좌표 데이터를 받아뒀으니, 문제 없네.
    ja: |-
      座標は受け取った。
      問題あるまい。
  d_nikke_hongryeon_goddeath_05_41:
    speaker: cecil_op_l
    en: And once you two arrive, aside from the Counters and Snow White,
    ko: 그리고 두 분이 도착하시게 되면 카운터스와 스노우 화이트 말고도,
    ja: |-
      それから、お二人が到着したら
      カウンターズとスノーホワイト以外にも…
  d_nikke_hongryeon_goddeath_05_42:
    speaker: cecil_op_l
    en: there'll... be four... others who'll... assist...
    ko: 다… 넷… 조력… 있을…. 데.
    ja: 他…の…協力…いる…はず…
  d_nikke_hongryeon_goddeath_05_43:
    speaker: rapunzel_s
    en: Cecil?
    ko: 세실?
    ja: セシル？
  d_nikke_hongryeon_goddeath_05_44:
    speaker: cecil_op_l
    en: They're... not... enemies. Don't... be... alarmed.
    ko: 적… 아니… 놀…. 세요.
    ja: 敵では…驚…ください。
  d_nikke_hongryeon_goddeath_05_45:
    speaker: hongryeon_g
    en: So our communications are severed, it would seem.
    ko: 정말로 통신이 끊겼군그래.
    ja: 切れてしまったな。
  d_nikke_hongryeon_goddeath_05_46:
    speaker: rapunzel_s
    en: From what Cecil said, we must be getting pretty close to the Lift.
    ko: 세실의 말대로라면, 저희가 궤도 엘리베이터에 많이 근접했다는 뜻이겠죠.
    ja: |-
      セシルの言う通りなら、
      かなり近づいたということですね。
  d_nikke_hongryeon_goddeath_05_47:
    speaker: rapunzel_s
    en: But I wonder what she was trying to tell us...
    ko: 그런데 무슨 말을 하려고 했던 걸까요?
    ja: |-
      ところで、セシルは
      何を言おうとしていたのでしょうか？
  d_nikke_hongryeon_goddeath_05_48:
    speaker: hongryeon_g
    en: Methinks she meant to tell us what awaiteth us upon our arrival.
    ko: 도착한 곳에서 있을 일에 대해 말하려던 느낌일세.
    ja: |-
      到着した先で何が起こるか、
      話そうとしていたような気がするが。
  d_nikke_hongryeon_goddeath_05_49:
    speaker: hongryeon_g
    en: Yet, 'twould be a shame to spoil the pleasure of discovery ere we arrive.
    ko: 뭐, 정확한 건 도착했을 때의 여흥으로 남겨두는 것도 좋겠어.
    ja: まあ、楽しみとしてとっておくのも一興だ。
  d_nikke_hongryeon_goddeath_05_50:
    speaker: "<Narration>"
    en: Scarlet turns her gaze toward the Lift.
    ko: 홍련의 시선이 궤도 엘리베이터를 향한다.
    ja: 紅蓮の視線が軌道エレベーターに向けられた
  d_nikke_hongryeon_goddeath_05_51:
    speaker: "<Narration>"
    en: "*Kaboom!*"
    ko: 콰아아앙-!
    ja: ドォーン！
  d_nikke_hongryeon_goddeath_05_52:
    speaker: "<Narration>"
    en: Loud explosions begin to echo in the distance.
    ko: 멀리서 폭발음이 들리기 시작한다.
    ja: 遠くから爆発音が聞こえ始めた
  d_nikke_hongryeon_goddeath_05_53:
    speaker: hongryeon_g
    en: Mayhap we ought to make haste.
    ko: 조금만 더 서두르는게 좋겠군.
    ja: 少しばかり急いだ方がよさそうだな。
  d_nikke_hongryeon_goddeath_05_54:
    speaker: rapunzel_s
    en: Yes, we should do what we can to ease the burden on the Believer and our sisters.
    ko: 네, 형제님과 자매님들의 고생을 덜어드려야죠.
    ja: |-
      はい。ブラザーや姉妹たちの負担を
      減らして差し上げないと。
  d_nikke_hongryeon_goddeath_05_55:
    speaker: hongryeon_g
    en: And for the sake of a happier future too, I say unto thee.
    ko: 그리고 행복한 미래를 위해서라도 말일세.
    ja: それに、幸せな未来のためにもな。
  d_nikke_hongryeon_goddeath_05_56:
    speaker: hongryeon_g
    en: For I am under a curse, that I must needs live happily all my days.
    ko: 나는 행복하게 살아야만 하는 주박에 걸린 몸이니까.
    ja: |-
      私は幸せに生きねばならぬという
      呪いにかかったのだ。
  d_nikke_hongryeon_goddeath_05_57:
    speaker: rapunzel_s
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_hongryeon_goddeath_05_58:
    speaker: rapunzel_s
    en: I heard that they used Rose's body to build yours...
    ko: 장화의 바디를 썼다고 들었는데….
    ja: 薔花のボディを使ったと伺いましたが…
  d_nikke_hongryeon_goddeath_05_59:
    speaker: rapunzel_s
    en: Are you experiencing any lingering effects from the corruption?
    ko: 혹시 침식의 여파 같은 게 남으신 건가요?
    ja: 侵食の影響が残っているのですか？
  d_nikke_hongryeon_goddeath_05_60:
    speaker: hongryeon_g
    en: Nay, 'tis no corruption.
    ko: 아니, 침식 따위가 아니라네.
    ja: いや、侵食などではない。
  d_nikke_hongryeon_goddeath_05_61:
    speaker: hongryeon_g
    en: "'Tis a curse most heartrending, yet one held most dear."
    ko: 너무나도 가슴 아프지만, 너무나도 사랑스러운 그런 주박일세.
    ja: |-
      あまりにも胸が痛み、あまりにも愛おしい…
      そんな呪いだ。
  d_nikke_hongryeon_goddeath_05_62:
    speaker: rapunzel_s
    en: What do you mean—
    ko: "? 그게 무슨…."
    ja: "？それはどういう…"
  d_nikke_hongryeon_goddeath_05_63:
    speaker: "<Narration>"
    en: "*Booooom!!*"
    ko: 콰아아아앙--!!
    ja: ドガァァァン――！！
  d_nikke_hongryeon_goddeath_05_64:
    speaker: "<Narration>"
    en: 'The explosions grow louder, and the distant figures gradually come into focus:'
    ko: 폭발음이 선명해지고, 멀리서 희미하게 보였던 것들도 점점 뚜렷해지기 시작한다.
    ja: |-
      爆発音が鮮明になり、
      遠くでかすかに見えていたものが
      次第にはっきりと見え始めた
  d_nikke_hongryeon_goddeath_05_65:
    speaker: "<Narration>"
    en: replicas of the swordswoman and the saintess,
    ko: 검사의 모조품과 성녀의 모조품.
    ja: 剣士の模造品と、聖女の模造品
  d_nikke_hongryeon_goddeath_05_66:
    speaker: "<Narration>"
    en: along with their comrades, all fighting against the enemy.
    ko: 그리고 이에 맞서는 동료들의 모습.
    ja: そして、それに立ち向かう仲間たちの姿
  d_nikke_hongryeon_goddeath_05_67:
    speaker: hongryeon_g
    en: Let us hence, Rapunzel!
    ko: 가세, 라푼젤!
    ja: 行くぞ、ラプンツェル！
  d_nikke_hongryeon_goddeath_05_68:
    speaker: rapunzel_s
    en: All right!
    ko: 예!
    ja: はい！
  d_nikke_hongryeon_goddeath_05_69:
    speaker: "<Narration>"
    en: Scarlet runs with renewed determination toward the comrades she'll share her
      future with.
    ko: 미래를 함께할 동료들이 있는 곳을 향해, 홍련은 더욱 힘을 내서 달렸다.
    ja: |-
      未来を共にする仲間たちがいる場所へと
      紅蓮はさらに力を込めて走った
  d_nikke_hongryeon_goddeath_05_70:
    speaker: "<Narration>"
    en: A gentle breeze brushes her hair,
    ko: 마치 힘내라고 머리를 쓰다듬어주는 것처럼,
    ja: まるで、頑張れと頭をなでるかのように
  d_nikke_hongryeon_goddeath_05_71:
    speaker: "<Narration>"
    en: as if gently stroking her head to encourage her onward.
    ko: 살가운 바람이 불어와 홍련의 머리카락을 스쳤다.
    ja: 優しい風が吹き抜け、紅蓮の髪をかすめた
