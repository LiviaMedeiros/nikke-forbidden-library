---
d_nikke_anis_star_01:
  d_nikke_anis_star_01_1:
    speaker: unknown
    en: "... Looks different than usual... kinda cute..."
    ko: "…는 모습… 평소랑… …르게 귀엽…."
    ja: "…てる…いつもと…ってかわ…"
  d_nikke_anis_star_01_2:
    speaker: unknown
    en: "... If I poke him... think he'd wake up...?"
    ko: "…건드리… 깨… 아니겠…?"
    ja: "…さわ…起こし…かな…？"
  d_nikke_anis_star_01_3:
    speaker: "<Monologue>"
    en: My eyes snap open at the poke on my cheek.
    ko: 볼을 찌르는 감각에 눈을 떴다.
    ja: 頬をつつかれる感覚で目を開いた
  d_nikke_anis_star_01_4:
    speaker: anis_i
    en: Ah...
    ko: 아….
    ja: あ…
  d_nikke_anis_star_01_5:
    speaker: "<Monologue>"
    en: I meet Anis's gaze as she peers down at me.
    ko: 내 얼굴을 들여다보고 있던 아니스와 눈이 마주쳤다.
    ja: 私の顔を見つめているアニスと目が合った
  d_nikke_anis_star_01_6:
    speaker: anis_i
    en: Sorry, did I wake you?
    ko: 미안. 내가 깨운 건가?
    ja: ごめん、起こしちゃった？
  d_nikke_anis_star_01_7:
    speaker: "<Self>"
    en: Why are you looking at me like that?
    ko: 왜 그렇게 쳐다보고 있어.
    ja: そんなに見つめて、何かあったか？
  d_nikke_anis_star_01_8:
    speaker: anis_i
    en: Well, I didn't exactly come here planning to stare at you or anything,
    ko: 아니, 사실 나도 이럴 생각으로 온 건 아니었거든?
    ja: いや…別にそんなつもりじゃなかったのよ？
  d_nikke_anis_star_01_9:
    speaker: anis_i
    en: but then I saw you sleeping and thought, "Wow, I've never seen you look that
      relaxed."
    ko: 근데 지휘관님이 자는 모습을 보고 있으니까, 느긋하게 자는 얼굴은 처음 보네~ 싶더라고.
    ja: |-
      寝顔が気持ちよさそうだったけど、
      改めてよく見たのは初めだな～って思って。
  d_nikke_anis_star_01_10:
    speaker: anis_i
    en: So I ended up just watching for a bit.
    ko: 그래서 보고 있었지.
    ja: それでつい見てたの。
  d_nikke_anis_star_01_11:
    speaker: anis_i
    en: "... You look pretty different when you're asleep, Commander."
    ko: "…지휘관님 자는 모습은 평소랑 많이 다르더라."
    ja: |-
      …指揮官様の寝顔、
      いつもと雰囲気が全然違ったから。
  d_nikke_anis_star_01_12:
    speaker: "<Self>"
    en: How so?
    ko: 어떻게 다른데?
    ja: どう違うんだ？
  d_nikke_anis_star_01_13:
    speaker: anis_i
    en: You're usually so dependable, but when you're asleep, you kinda look like
      a kid. It's cute.
    ko: 평소엔 믿음직한데, 자는 모습은 아이처럼 귀엽다고 해야 하나?
    ja: |-
      普段は頼もしく見えるのに、
      寝てると子どもみたいでかわいいって感じ？
  d_nikke_anis_star_01_14:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_01_15:
    speaker: "<Self>"
    en: All right, what's the catch? You want money?
    ko: 원하는 게 뭐야? 돈?
    ja: 狙いはなんだ？金か？
  d_nikke_anis_star_01_16:
    speaker: anis_i
    en: I meant that as a compliment, you know!
    ko: 순수하게 칭찬이거든!
    ja: 純粋にほめただけでしょ！
  d_nikke_anis_star_01_17:
    speaker: anis_i
    en: What do you take me for...?
    ko: 날 뭘로 보고….
    ja: 私をなんだと思ってるのよ…
  d_nikke_anis_star_01_18:
    speaker: anis_i
    en: Anyway, that's not the point. I came for something else.
    ko: 아무튼 그건 그거. 진짜 온 목적은 따로 있어.
    ja: |-
      ともかく、それはそれとして。
      ここに来た本当の目的はね…
  d_nikke_anis_star_01_19:
    speaker: "<Monologue>"
    en: Anis spreads her palm and holds it out.
    ko: 아니스는 자신의 손바닥을 펴서 내밀었고.
    ja: アニスが手のひらを差し出してきた
  d_nikke_anis_star_01_20:
    speaker: "<Monologue>"
    en: I lay my hand on hers.
    ko: 나는 그 손 위에 내 손을 올렸다.
    ja: 私はそこに自分の手を乗せた
  d_nikke_anis_star_01_21:
    speaker: anis_i
    en: Why're you putting your hand on mine?
    ko: 왜 지휘관님 손을 올려놓는 건데.
    ja: 何のつもり？
  d_nikke_anis_star_01_22:
    speaker: anis_i
    en: What are you, a puppy?
    ko: 강아지야?
    ja: お手？
  d_nikke_anis_star_01_23:
    speaker: "<Self>"
    en: Wasn't this what you wanted?
    ko: 이걸 원한 거 아니었어?
    ja: 違ったのか？
  d_nikke_anis_star_01_24:
    speaker: anis_i
    en: Ugh, seriously!
    ko: 아오! 진짜!
    ja: ああもう！
  d_nikke_anis_star_01_25:
    speaker: anis_i
    en: You're usually quick on the uptake, so why are you being so dense right now?
    ko: 평소엔 눈치 빠르면서, 이럴 때만 왜 이러는 건데!
    ja: |-
      いつもは話が早いタイプなのに、
      なんでこういう時だけニブいわけ！？
  d_nikke_anis_star_01_26:
    speaker: anis_i
    en: I'm asking if you got me a present.
    ko: 선물 없냐고, 선물.
    ja: プレゼントはないの？プレゼント。
  d_nikke_anis_star_01_27:
    speaker: anis_i
    en: I just moved on from my pop star days and came back way stronger, so where's
      my gift?
    ko: 무사히 아이돌을 졸업하고 완~전 파워업해서 돌아온 나한테 선물 같은 거 없어?
    ja: |-
      無事にアイドルを卒業して、
      パワーアップもして戻ってきたんだから
      記念品とかくれてもいいでしょ？
  d_nikke_anis_star_01_28:
    speaker: anis_i
    en: And if not a present, I'll settle for a reward.
    ko: 선물이 아니면 상이라도 괜찮아.
    ja: プレゼントじゃなくても、ごほうびとか。
  d_nikke_anis_star_01_29:
    speaker: "<Choice>"
    en: Uh, a reward or gift...
    ko: 선물이나 상이나….
    ja: プレゼントかごほうび…
  d_nikke_anis_star_01_30:
    speaker: "<Choice>"
    en: Sorry, I don't have anything ready right now.
    ko: 미안. 당장 준비해 둔 게 없네.
    ja: すまないが、今すぐ渡せるものはないな
  d_nikke_anis_star_01_31:
    speaker: anis_i
    en: A good commander knows when to use both the carrot and the stick, right?
    ko: 당근과 채찍을 확실하게 주는 것도 지휘관의 덕목이잖아.
    ja: |-
      アメとムチの使い分けも
      指揮官様の大事な役目でしょ。
  d_nikke_anis_star_01_32:
    speaker: anis_i
    en: Give me a carrot now, and you'll get a bonus—a smile from a popular pop star.
    ko: 게다가 지금 당근을 주면, 초인기 아이돌의 미소가 덤으로 따라오네~?
    ja: |-
      それに今なら、超人気アイドルの笑顔が
      おまけで返ってくるわよ～？
  d_nikke_anis_star_01_33:
    speaker: anis_i
    en: "... Well, former pop star, but still counts."
    ko: "…이젠 아이돌 뒤에 괄호로 은퇴가 붙지만."
    ja: "…まあ、「元」だけど。"
  d_nikke_anis_star_01_34:
    speaker: anis_i
    en: Doesn't have to be now, but just make sure you really think it over, okay?
    ko: 당장 없어도 잘 좀 생각해 보라고오~
    ja: 手元になくても、何かないか考えてよね～
  d_nikke_anis_star_01_35:
    speaker: "<Self>"
    en: Then tell me what you want.
    ko: 그럼 받고 싶은 걸 말해 봐.
    ja: それなら、欲しいものを言ってくれ
  d_nikke_anis_star_01_36:
    speaker: anis_i
    en: So, you'll give me whatever I want?
    ko: 뭐든 주는 거야?
    ja: なんでもいいの？
  d_nikke_anis_star_01_37:
    speaker: "<Self>"
    en: If it's within my ability, sure.
    ko: 내 능력을 벗어나는 것만 아니면.
    ja: 私の手が届くことなら
  d_nikke_anis_star_01_38:
    speaker: anis_i
    en: There's something I really want. I can go with that, right?
    ko: 그럼 나 완전 갖고 싶은 거 있는데, 그걸로 받아도 되지?
    ja: |-
      じゃ、すごく欲しいものがあるんだけど
      それでいい？
  d_nikke_anis_star_01_39:
    speaker: anis_i
    en: It's not expensive or anything hard to get.
    ko: 비싼 것도 아니고 주기 어려운 것도 아니거든.
    ja: 高いものじゃないし、大変なことでもないから。
  d_nikke_anis_star_01_40:
    speaker: "<Self>"
    en: The way you're emphasizing it is actually making me a bit worried.
    ko: 일부러 강조하는 것 같아서 오히려 걱정되는데.
    ja: 強調されると、かえって不安になるな
  d_nikke_anis_star_01_41:
    speaker: anis_i
    en: Hey, don't worry so much.
    ko: 무슨 걱정을 해~
    ja: 怖がることじゃないって～
  d_nikke_anis_star_01_42:
    speaker: anis_i
    en: It's not like I'm asking you to pluck stars out of the sky or anything...
    ko: 내가 뭐 별이라도 따다 달라고 하는 것도….
    ja: お空の星を取ってきてなんて言わないし…
  d_nikke_anis_star_01_43:
    speaker: anis_i
    en: Actually, now that I think about it, that might be nice.
    ko: 생각해 보니까 그것도 괜찮네.
    ja: あ、でもそれも悪くないかも。
  d_nikke_anis_star_01_44:
    speaker: anis_i
    en: Think you could grab me three?
    ko: 혹시 별 3개만 따다 줄 수 있어?
    ja: 3つでいいから取ってきてくれない？
  d_nikke_anis_star_01_45:
    speaker: anis_i
    en: I'll hang them in my room, so I have something to remember you by.
    ko: 지휘관님을 추억하면서 방에 장식으로 걸어둘게.
    ja: |-
      部屋に飾って、いつも指揮官様のことを
      思い浮かべるから。
  d_nikke_anis_star_01_46:
    speaker: "<Self>"
    en: That's beyond me...
    ko: 그건 내 능력 밖이야….
    ja: 星には手が届かないな…
  d_nikke_anis_star_01_47:
    speaker: anis_i
    en: All right, jokes aside...
    ko: 뭐, 농담은 접어두고.
    ja: ま、冗談はさておき…
  d_nikke_anis_star_01_48:
    speaker: anis_i
    en: I'm not asking for much.
    ko: 내가 갖고 싶은 건 별거 아니야.
    ja: ホントに大したものじゃないの。
  d_nikke_anis_star_01_49:
    speaker: anis_i
    en: Just one day.
    ko: 하루.
    ja: 1日だけ。
  d_nikke_anis_star_01_50:
    speaker: "<Monologue>"
    en: Anis holds up her index finger to me.
    ko: 아니스는 검지를 펴서 내게 보여주었다.
    ja: アニスが人差し指を私の前で立ててみせた
  d_nikke_anis_star_01_51:
    speaker: anis_i
    en: You're mine for the day, Commander.
    ko: 지휘관님의 오늘 하루를 나한테 줘.
    ja: 指揮官様の今日1日、私にちょうだい。
  d_nikke_anis_star_01_52:
    speaker: "<Self>"
    en: So... is this you asking me out?
    ko: 데이트하자는 거야?
    ja: デートの誘いか？
  d_nikke_anis_star_01_53:
    speaker: anis_i
    en: You could say that.
    ko: 그렇게도 말하지.
    ja: そうとも言うわね。
  d_nikke_anis_star_01_54:
    speaker: anis_i
    en: Once things start picking up again, who knows when we'll get a chance to enjoy
      the Ark like this?
    ko: 이제 본격적으로 바빠지기 시작하면, 언제 또 방주를 즐길 수 있을지 모르잖아.
    ja: |-
      これから本格的に忙しくなったら、
      いつまたアークで遊べるか分からないでしょ？
  d_nikke_anis_star_01_55:
    speaker: anis_i
    en: Especially just the two of us.
    ko: 지휘관님이랑 단 둘이 있을 수 있는 시간은 더더욱 그렇고.
    ja: |-
      指揮官様と二人きりなんて、
      もっと難しくなるだろうし。
  d_nikke_anis_star_01_56:
    speaker: anis_i
    en: Figured we should make the most of it while we can,
    ko: 즐길 수 있을 때 즐겨놔야겠다, 싶었어.
    ja: 楽しめるうちに楽しんでおこうと思って。
  d_nikke_anis_star_01_57:
    speaker: anis_i
    en: so I've already got today all planned out.
    ko: 그래서 오늘 갈 곳도 미리 다 생각해왔지.
    ja: 実は、行きたいところも決めてあるのよね。
  d_nikke_anis_star_01_58:
    speaker: "<Self>"
    en: So that's why you came so early...
    ko: 그럼 새벽부터 찾아온 건….
    ja: とすると、こんな朝早くに来たのは…
  d_nikke_anis_star_01_59:
    speaker: anis_i
    en: The first place I want to go has to be at dawn.
    ko: 맨 처음 가려고 하는 곳이, 새벽에 가야 하는 곳이거든.
    ja: |-
      最初に行きたい場所が、
      朝早くにいかないといけない場所なのよ。
  d_nikke_anis_star_01_60:
    speaker: anis_i
    en: And if I brought this up when everyone else was awake, they'd all insist on
      coming too...
    ko: 이런 말을 애들 다 일어나 있을 때 하면, 지들도 가겠다면서 난리칠 게 뻔하기도 하고….
    ja: |-
      あと、こんな話を聞かれたらみんな
      ついて来るって言って騒ぐに決まってるし…
  d_nikke_anis_star_01_61:
    speaker: anis_i
    en: Anyway!
    ko: 뭐, 아무튼!
    ja: とにかく！
  d_nikke_anis_star_01_62:
    speaker: anis_i
    en: Can I have you for a day?
    ko: 그래서 줄 수 있어? 하루?
    ja: 今日1日、つきあってくれる？
  d_nikke_anis_star_01_63:
    speaker: "<Self>"
    en: Okay, we'll do whatever you want, Anis.
    ko: 알았어. 아니스가 하고 싶은 대로 해.
    ja: 分かった。アニスが行きたいところに行こう
  d_nikke_anis_star_01_64:
    speaker: anis_i
    en: That's a promise, yeah?
    ko: 약속한 거다?
    ja: 約束したからね？
  d_nikke_anis_star_01_65:
    speaker: anis_i
    en: Then come out as soon as you're ready.
    ko: 그럼 준비 끝나면 바로 나와.
    ja: 準備ができたら、出てきて。
  d_nikke_anis_star_01_66:
    speaker: anis_i
    en: I've got something to take care of, so I'll head out first.
    ko: 난 잠깐 해야 할 일이 있어서, 먼저 나가 있을게.
    ja: |-
      私はちょっとやることがあるから、
      先に出てるわ。
  d_nikke_anis_star_01_67:
    speaker: "<Self>"
    en: Okay.
    ko: 알았어.
    ja: 分かった
  d_nikke_anis_star_01_68:
    speaker: anis_i
    en: See ya outside!
    ko: 그럼 밖에서 봐~!
    ja: じゃ、またあとで～！
  d_nikke_anis_star_01_69:
    speaker: "<Narration>"
    en: The door slides open.
    ko: 지잉-
    ja: ウィーン――
  d_nikke_anis_star_01_70:
    speaker: "<Monologue>"
    en: After Anis leaves the room, I quickly wash up.
    ko: 아니스가 지휘관실을 나간 후, 간단히 씻었다.
    ja: |-
      アニスが指揮官室から出た後、
      私は軽くシャワーを浴びた
  d_nikke_anis_star_01_71:
    speaker: "<Monologue>"
    en: Now I'm standing in front of the closet, trying to decide what to wear...
    ko: 그리고 옷장 앞에서 옷을 고르고 있을 때….
    ja: クローゼットの前で服を選んでいると…
  d_nikke_anis_star_01_72:
    speaker: "<Monologue>"
    en: I'm not sure why, but I switch off my phone and slip it into my pocket, just
      like Anis said.
    ko: 이유는 모르겠지만, 일단 아니스의 말대로 휴대폰 전원을 끄고 주머니에 넣었다.
    ja: |-
      不思議に思いながら、言われたとおり
      携帯の電源を切ってポケットに入れた
  d_nikke_anis_star_01_73:
    speaker: "<Monologue>"
    en: Once I'm ready, I step out of my room...
    ko: 그리고 준비를 마치고 지휘관실을 나섰을 때….
    ja: 支度を終えて指揮官室を出ると…
  d_nikke_anis_star_01_74:
    speaker: "<Self>"
    en: So that's why she left early.
    ko: 이것 때문에 먼저 나갔던 거구나.
    ja: やることと言っていたのはこれか
  d_nikke_anis_star_01_75:
    speaker: "<Monologue>"
    en: There's a sticky note on my door.
    ko: 지휘관실 문 앞에는 포스트잇이 한 장 붙어 있었다.
    ja: 指揮官室のドアの前に張り紙が貼られている
  d_nikke_anis_star_01_76:
    speaker: "<Narration>"
    en: "★ Anis has dibs on the Commander today. Do not disturb! ★"
    ko: "[★오늘 지휘관님은 아니스가 전세 냈음. 절대 연락 금지★]"
    ja: |-
      「★本日、指揮官様はアニスが貸し切り。
      　絶対連絡禁止★」
d_nikke_anis_star_02:
  d_nikke_anis_star_02_1:
    speaker: anis_i
    en: Every second counts, and it's already morning... What the hell did I even
      do?
    ko: 1분 1초가 아까워 죽겠는데, 뭐 했다고 벌써 날이 밝은 거야?
    ja: |-
      1分1秒でも惜しいのに、
      もう明るくなってきちゃったわね？
  d_nikke_anis_star_02_2:
    speaker: anis_i
    en: Was staying up all night even worth it?
    ko: 밤샌 의미가 있는지 모르겠네, 이거.
    ja: |-
      なんのために徹夜したのか
      分からないじゃない、これじゃ…
  d_nikke_anis_star_02_3:
    speaker: anis_i
    en: Now I just feel all stiff and gross.
    ko: 쓸데없이 몸만 찌뿌둥하고.
    ja: 無駄に体がだるくなっただけね。
  d_nikke_anis_star_02_4:
    speaker: anis_i
    en: Ugh!
    ko: 으으읏~!
    ja: んん～！
  d_nikke_anis_star_02_5:
    speaker: "<Monologue>"
    en: Anis stretches, her back arching slightly.
    ko: 아니스는 기지개를 켰다.
    ja: アニスが背筋を伸ばした
  d_nikke_anis_star_02_6:
    speaker: "<Self>"
    en: You look tired.
    ko: 많이 피곤해 보이네.
    ja: ずいぶんお疲れのようだな
  d_nikke_anis_star_02_7:
    speaker: anis_i
    en: I'm fine. Just a little sore.
    ko: 그냥 조금 뻐근한 정도라 괜찮아.
    ja: ちょっとだけだから平気。
  d_nikke_anis_star_02_8:
    speaker: anis_i
    en: I'm not complaining, not when I've finally got you all to myself.
    ko: 모처럼 지휘관님이랑 단둘이 나왔는데, 이보다 더한 것도 참아야지.
    ja: |-
      久しぶりに指揮官様と二人きりで
      お出かけできるんだから、
      これぐらいなんてことないわ。
  d_nikke_anis_star_02_9:
    speaker: anis_i
    en: Nnngh!
    ko: 으으읏~!
    ja: うぅ～ん！
  d_nikke_anis_star_02_10:
    speaker: "<Monologue>"
    en: She stretches again,
    ko: 아니스는 또 다시 기지개를 켰고.
    ja: アニスはもう一度背筋を伸ばし…
  d_nikke_anis_star_02_11:
    speaker: "<Monologue>"
    en: then looks up at the sky.
    ko: 그대로 하늘을 바라보았다.
    ja: そのまま空を見上げた
  d_nikke_anis_star_02_12:
    speaker: anis_i
    en: I'm kinda tired, but I feel great.
    ko: 몸은 좀 피곤해도 기분은 좋네.
    ja: 体はちょっと疲れてるけど、いい気分。
  d_nikke_anis_star_02_13:
    speaker: anis_i
    en: Maybe it's the clear weather... The sky looks especially nice today.
    ko: 날이 맑아서 그런가, 괜히 하늘도 더 예뻐 보이고.
    ja: |-
      晴れてるからかしら、
      いつもよりきれいに見えるわね。
  d_nikke_anis_star_02_14:
    speaker: "<Self>"
    en: Yeah, it really is clear.
    ko: 확실히 맑기는 해.
    ja: 確かにきれいだな
  d_nikke_anis_star_02_15:
    speaker: "<Monologue>"
    en: I look up at the sky as well.
    ko: 나도 고개를 들어 하늘을 바라보았다.
    ja: 私もつられて空を見上げていた
  d_nikke_anis_star_02_16:
    speaker: "<Monologue>"
    en: Above me, the Dome of Eternity is an unbroken, cloudless blue.
    ko: 이터널 스카이는 구름 한 점 없는 맑은 하늘을 보여주고 있었다.
    ja: |-
      エターナルスカイが
      雲一つない透き通った空を映し出している
  d_nikke_anis_star_02_17:
    speaker: anis_i
    en: "... Commander, remember"
    ko: "…지휘관님, 혹시 기억나?"
    ja: "…指揮官様、覚えてる？"
  d_nikke_anis_star_02_18:
    speaker: anis_i
    en: when I showed you around the Ark?
    ko: 예전에 내가 방주 소개해준다고 지휘관님 데리고 돌아다녔던 거.
    ja: 前に私がアークを見せて回った時のこと。
  d_nikke_anis_star_02_19:
    speaker: anis_i
    en: You kept staring up at it and asking me if it ever rains here or even snows.
    ko: 저걸 보면서 나한테 방주에 비는 내리냐, 눈은 내리냐 엄청 물어봤었잖아.
    ja: |-
      空を見ながら、アークに雨は降るのかとか、
      雪も降るのかとか、聞いてきたでしょ？
  d_nikke_anis_star_02_20:
    speaker: "<Self>"
    en: You mean when I'd just become the Counters' commander?
    ko: 내가 막 카운터스의 지휘관이 됐을 때 말이지?
    ja: |-
      私がカウンターズの指揮官に
      なったばかりの頃だな？
  d_nikke_anis_star_02_21:
    speaker: anis_i
    en: Yeah, more like when I showed you around the Ark, remember?
    ko: 응. 정확히는 내가 지휘관님한테 방주 알려준다고 둘이 돌아다녔을 때.
    ja: |-
      うん。正確には、
      アークのことを教えてあげるって
      言ったんだったかしら。
  d_nikke_anis_star_02_22:
    speaker: anis_i
    en: Thought we'd retrace that same route today.
    ko: 오늘 그때랑 같은 코스로 돌아보려고 하거든.
    ja: |-
      今日はあの時と同じコースを
      歩こうと思ってるの。
  d_nikke_anis_star_02_23:
    speaker: anis_i
    en: I had to put this together kinda last minute, so I ended up picking places
      we've already been...
    ko: 솔직히 급하게 짜느라 예전에 둘러봤던 데가 먼저 떠오른 거긴 한데….
    ja: |-
      まあ…考える時間がなくて、真っ先に
      思いついたのがそれってだけなんだけど…
  d_nikke_anis_star_02_24:
    speaker: anis_i
    en: But for a rushed date plan, it's pretty solid, right?
    ko: 급하게 짠 데이트 코스치곤 꽤 그럴듯하지 않아?
    ja: |-
      思い付きのデートコースにしては
      なかなか悪くないでしょ？
  d_nikke_anis_star_02_25:
    speaker: anis_i
    en: We'll start downtown, then—
    ko: 방주 시내부터 시작해서….
    ja: 街中からスタートして…
  d_nikke_anis_star_02_26:
    speaker: "<Self>"
    en: The fast food place, and then the Royal Road?
    ko: 패스트푸드점에 로열로드까지?
    ja: ファーストフード店にロイヤルロードか？
  d_nikke_anis_star_02_27:
    speaker: anis_i
    en: So you do remember.
    ko: 기억하고 있었구나.
    ja: 覚えててくれたのね。
  d_nikke_anis_star_02_28:
    speaker: "<Self>"
    en: I remember everything we've done together, Anis.
    ko: 지금까지 아니스랑 있었던 일은 전부 기억하고 있거든.
    ja: アニスとのことなら全部覚えている
  d_nikke_anis_star_02_29:
    speaker: anis_i
    en: Oh please, you just happened to remember that one thing.
    ko: 에이~ 그것만 어쩌다 기억하고 있을 뿐인 거 아니야?
    ja: またまた～、偶然そこだけ覚えてたんでしょ？
  d_nikke_anis_star_02_30:
    speaker: "<Self>"
    en: I even remember how disappointed you were when we first met.
    ko: 처음 만났을 때, 아니스가 날 보고 엄청 실망했던 것도 기억하는데?
    ja: |-
      初めて会った時、私を見たアニスが
      露骨にガッカリしていたことも覚えている
  d_nikke_anis_star_02_31:
    speaker: anis_i
    en: Why do you even remember stuff like that?!
    ko: 왜 그런 것까지 기억하는 건데?!
    ja: なんでそんなことまで覚えてるのよ！？
  d_nikke_anis_star_02_32:
    speaker: "<Self>"
    en: That was quite the first meeting.
    ko: 워낙 임팩트 있는 첫 만남이었잖아.
    ja: かなりインパクトのある初対面だったからな
  d_nikke_anis_star_02_33:
    speaker: anis_i
    en: No, it's just...
    ko: 아니, 그게….
    ja: それは、その…
  d_nikke_anis_star_02_34:
    speaker: anis_i
    en: Back then, things were a mess... and I was rushing...
    ko: 그땐 상황이 상황이었던 것도 있고… 마음이 급했던 것도 있고….
    ja: |-
      あの時は状況が状況だったし…
      気持ちに余裕もなかったし…
  d_nikke_anis_star_02_35:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_02_36:
    speaker: anis_i
    en: Ugh, whatever!
    ko: 아아아! 나도 모르겠다!
    ja: もう！昔のことはいいの！
  d_nikke_anis_star_02_37:
    speaker: anis_i
    en: I trust you more than anyone right now, so it's fine. That's enough for me.
    ko: 지금은 누구보다 지휘관님을 믿고 있으니까 괜찮잖아. 그럼 됐지!
    ja: |-
      今は誰よりも指揮官様を信じてるから、
      それでいいでしょ！？
  d_nikke_anis_star_02_38:
    speaker: anis_i
    en: So quit dragging your feet and let's move!
    ko: 어기적대지 말고, 빨리 가기나 하자!
    ja: のんびりしてないで、早く行きましょ！
  d_nikke_anis_star_02_39:
    speaker: "<Monologue>"
    en: Anis grabs my sleeve and pulls me along, taking the lead.
    ko: 아니스가 내 소매를 잡아끌며 앞장섰다.
    ja: アニスが私のそでを引いて歩き出した
  d_nikke_anis_star_02_40:
    speaker: "<Monologue>"
    en: But her grip doesn't match her pace.
    ko: 하지만 잡아당기는 힘은 걸음걸이에 비해 세지 않았다.
    ja: 足取りに比べて、引っ張る力は強くない
  d_nikke_anis_star_02_41:
    speaker: "<Self>"
    en: "... Okay, got it."
    ko: "…그래, 알았어."
    ja: "…ああ、そうだな"
  d_nikke_anis_star_02_42:
    speaker: "<Monologue>"
    en: I smile faintly and let her lead me.
    ko: 나는 엷게 미소 지으며, 아니스에게 이끌려 주었다.
    ja: 私は微笑み、アニスの先導に身を任せた
  d_nikke_anis_star_02_43:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして…
  d_nikke_anis_star_02_44:
    speaker: anis_i
    en: This is our first stop of the day.
    ko: 여기가 오늘의 첫 번째 목적지야.
    ja: ここが今日の最初の目的地ね。
  d_nikke_anis_star_02_45:
    speaker: "<Self>"
    en: So, what are we doing here?
    ko: 여기서 뭘 하는데?
    ja: 何かするのか？
  d_nikke_anis_star_02_46:
    speaker: anis_i
    en: You'll see. Just follow me for now.
    ko: 뭐… 보면 알 테니까, 일단 따라와 볼래?
    ja: |-
      まあ…見たら分かるわ。
      とりあえずついてきてくれる？
  d_nikke_anis_star_02_47:
    speaker: "<Monologue>"
    en: I follow Anis to a shop.
    ko: 아니스를 따라 어느 가게 앞으로 향했다.
    ja: |-
      アニスの背中を追いながら歩くと、
      行く先に店が見えた
  d_nikke_anis_star_02_48:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_02_49:
    speaker: clerk
    en: Welcome! What can I get for you?
    ko: 어서 오세요. 어떤 걸로 드릴까요?
    ja: |-
      いらっしゃいませ。
      ご注文はいかがなさいますか？
  d_nikke_anis_star_02_50:
    speaker: anis_i
    en: Two chocolate mousse cream puffs,
    ko: 아이스 초콜릿 무스 슈크림.
    ja: アイスチョコムースシュークリームを…
  d_nikke_anis_star_02_51:
    speaker: anis_i
    en: please.
    ko: 두 개, 주세요.
    ja: 2つください。
  d_nikke_anis_star_02_52:
    speaker: clerk
    en: I'm so sorry,
    ko: 죄송합니다, 손님.
    ja: 申し訳ございません、お客様…
  d_nikke_anis_star_02_53:
    speaker: clerk
    en: we only have one left right now...
    ko: 지금 재고가 하나밖에 남질 않아서요….
    ja: そちらは最後の1つとなっておりまして…
  d_nikke_anis_star_02_54:
    speaker: anis_i
    en: Wait, what!?
    ko: 아니 왜요!
    ja: ウソでしょ！？
  d_nikke_anis_star_02_55:
    speaker: anis_i
    en: How is it already sold out?!
    ko: 이 시간에 벌써 다 떨어졌다는 게 말이 돼요?!
    ja: こんな時間にもう売り切れ！？
  d_nikke_anis_star_02_56:
    speaker: anis_i
    en: I got up at dawn just for this!
    ko: 이거 사겠다고 일부러 새벽부터 나왔는데!
    ja: これが買いたくてわざわざ朝早く出てきたのに！
  d_nikke_anis_star_02_57:
    speaker: clerk
    en: Sorry, we had people lining up pretty early this morning...
    ko: 다른 손님들은 더 이른 시간부터 줄 서셨거든요….
    ja: |-
      朝早くから並ばれていたお客さんも
      大勢いらっしゃいまして…
  d_nikke_anis_star_02_58:
    speaker: clerk
    en: We'll make sure to stock more next time.
    ko: 앞으론 재고를 더 넉넉하게 준비해 두도록 하겠습니다.
    ja: |-
      今後は増産する予定ですが、
      本日はこれ限りです。
  d_nikke_anis_star_02_59:
    speaker: clerk
    en: Would you like to take the last one?
    ko: 일단 하나라도 가져가시겠어요?
    ja: 最後の1つになりますが、どうされますか？
  d_nikke_anis_star_02_60:
    speaker: anis_i
    en: Y-yes, please!
    ko: 주, 주세요!
    ja: く、ください！
  d_nikke_anis_star_02_61:
    speaker: "<Monologue>"
    en: The clerk wraps up the cream puff and hands it to Anis.
    ko: 점원은 슈크림을 하나 포장해서 아니스에게 건넸다.
    ja: |-
      店員はシュークリームを包み、
      アニスに渡した
  d_nikke_anis_star_02_62:
    speaker: anis_i
    en: So this is the chocolate mousse cream puff...
    ko: 이게 아이스 초콜릿 무스 슈크림….
    ja: これがアイスチョコムースシュークリーム…
  d_nikke_anis_star_02_63:
    speaker: "<Monologue>"
    en: Anis can't take her eyes off it.
    ko: 아니스는 슈크림에서 눈을 떼지 못했다.
    ja: |-
      アニスの目はシュークリームに
      釘付けとなっている
  d_nikke_anis_star_02_64:
    speaker: "<Self>"
    en: So that's what this was about.
    ko: 그게 목적이었구나.
    ja: それがお目当てだったのか
  d_nikke_anis_star_02_65:
    speaker: anis_i
    en: Yeah,
    ko: 응.
    ja: うん。
  d_nikke_anis_star_02_66:
    speaker: anis_i
    en: this thing's crazy popular lately, so it's hard to get.
    ko: 이거 요새 엄청 인기 있는 디저트라서 구하기 힘들거든.
    ja: |-
      最近大人気のスイーツだから
      買うのも大変なのよ。
  d_nikke_anis_star_02_67:
    speaker: anis_i
    en: I came so early and it's already almost sold out.
    ko: 일찍 나온다고 나왔는데, 벌써 다 팔린 거 봐.
    ja: |-
      開店直後を狙って来たのに、
      もう売り切れちゃったみたい。
  d_nikke_anis_star_02_68:
    speaker: "<Self>"
    en: Don't other places sell it?
    ko: 다른 가게에서는 안 팔아?
    ja: 他では売っていないのか？
  d_nikke_anis_star_02_69:
    speaker: anis_i
    en: Yeah, they do.
    ko: 팔긴 팔지.
    ja: 同じようなものなら売ってるわね。
  d_nikke_anis_star_02_70:
    speaker: anis_i
    en: But once something blows up, everyone tries to copy it, right?
    ko: 뭐 하나 유행 타면 너도나도 다 따라 하려고 하잖아.
    ja: |-
      何か人気の商品が出たら、
      どの店もマネしようとするでしょ？
  d_nikke_anis_star_02_71:
    speaker: anis_i
    en: The other shops' cream puffs are just average. I've tried them.
    ko: 근데 다른 가게 슈크림은 그냥 평범하다더라. 내가 먹어봐도 그랬고.
    ja: |-
      でも他の店のは
      そこまですごくないって言われてるし。
      私も食べてみてそう思ったわ。
  d_nikke_anis_star_02_72:
    speaker: anis_i
    en: This place, though... People say their chocolate's on another level.
    ko: 사람들 하는 말 들어보니까, 초코맛의 수준이 다르대.
    ja: |-
      ウワサだと、この店のは
      チョコの味が他と全然違うんだって。
  d_nikke_anis_star_02_73:
    speaker: "<Monologue>"
    en: Anis tears the cream puff in half and hands me one.
    ko: 아니스는 슈크림을 반으로 쪼개서, 한쪽을 내게 건넸다.
    ja: |-
      アニスがシュークリームを半分に割り、
      片方を私に差し出した
  d_nikke_anis_star_02_74:
    speaker: anis_i
    en: Here, Commander.
    ko: 자, 지휘관님.
    ja: はい、指揮官様。
  d_nikke_anis_star_02_75:
    speaker: anis_i
    en: It kinda sucks we only managed to get one...
    ko: 하나밖에 못 구해서 아쉽긴 해도….
    ja: 1つしか買えなかったのは残念だけど…
  d_nikke_anis_star_02_76:
    speaker: anis_i
    en: But hey, it's ours now.
    ko: 우리의 전리품이야.
    ja: 戦利品、山分けしましょ。
  d_nikke_anis_star_02_77:
    speaker: "<Self>"
    en: Thanks, it looks good.
    ko: 그럼 잘 먹을게.
    ja: では…いただこう
  d_nikke_anis_star_02_78:
    speaker: "<Monologue>"
    en: We each take a bite of our cream puffs.
    ko: 우리는 각자의 슈크림을 한입 베어 물었다.
    ja: 私たちはシュークリームを一口かじった
  d_nikke_anis_star_02_79:
    speaker: "<Self>"
    en: Wow, it's really sweet. The pastry's nice and soft too.
    ko: 진짜 달콤하네. 빵도 부드럽고.
    ja: 甘くてうまいな。皮もサクサクだ
  d_nikke_anis_star_02_80:
    speaker: anis_i
    en: Right? This is even better than I expected.
    ko: 그치? 기대 이상이야.
    ja: そうよね？期待以上だわ。
  d_nikke_anis_star_02_81:
    speaker: anis_i
    en: I can see why people are so obsessed with it.
    ko: 왜 사람들이 그렇게 좋아하는지 이제야 알겠네.
    ja: 大人気の理由もナットクね。
  d_nikke_anis_star_02_82:
    speaker: anis_i
    en: It's so good I finished it in one bite!
    ko: 너무 맛있어서 한입에 다 먹어버렸을 정도니까.
    ja: おいしすぎて、一口で全部食べちゃった。
  d_nikke_anis_star_02_83:
    speaker: "<Self>"
    en: You finished that whole thing already...?
    ko: 그 큰 걸 벌써 다 먹었다고…?
    ja: 半分でも大きかったはずだが…？
  d_nikke_anis_star_02_84:
    speaker: anis_i
    en: Guess that just means it's that good.
    ko: 뭐, 그만큼 맛있었다는 거잖아.
    ja: そのくらいおいしかったってこと。
  d_nikke_anis_star_02_85:
    speaker: anis_i
    en: Next time, we're coming even earlier.
    ko: 그나저나 다음엔 더 빨리 나와야겠네.
    ja: 今度はもっと早く行かないと。
  d_nikke_anis_star_02_86:
    speaker: anis_i
    en: Pretty sure one person can only get three...?
    ko: 한 사람당 세 개까지 살 수 있다고 했던가….
    ja: 1人3個までって話だったっけ…
  d_nikke_anis_star_02_87:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_02_88:
    speaker: "<Monologue>"
    en: I hold out what's left of mine to Anis.
    ko: 나는 남은 슈크림을 아니스에게 내밀었다.
    ja: 私は残りのシュークリームをアニスに差し出した
  d_nikke_anis_star_02_89:
    speaker: anis_i
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_anis_star_02_90:
    speaker: anis_i
    en: What's this?
    ko: 뭐야?
    ja: どうしたの？
  d_nikke_anis_star_02_91:
    speaker: "<Self>"
    en: Here, have this.
    ko: 이것도 먹어.
    ja: これも食べてくれ
  d_nikke_anis_star_02_92:
    speaker: anis_i
    en: What, you giving it to me 'cause you feel bad?
    ko: 혹시 내가 아쉬워해서 그래?
    ja: もしかして、私がまだ食べたそうにしてたから？
  d_nikke_anis_star_02_93:
    speaker: anis_i
    en: Nah, I'm good. It's better to stop while you still want a little more.
    ko: 그럼 됐어. 적당히 아쉬운 정도로 먹는 게 딱 좋아.
    ja: |-
      気にしないで。
      もう少し欲しいぐらいで終わるのが
      いちばんいいんだから。
  d_nikke_anis_star_02_94:
    speaker: "<Self>"
    en: No, I don't really like sweet stuff,
    ko: 나 사실 단 거 별로 안 좋아하거든.
    ja: 実は、甘いものは少しで満足する方でな
  d_nikke_anis_star_02_95:
    speaker: "<Self>"
    en: so I'd rather you have it, Anis.
    ko: 그래서 아니스가 먹어줬으면 좋겠어.
    ja: 後はアニスが食べてくれると助かる
  d_nikke_anis_star_02_96:
    speaker: "<Monologue>"
    en: Anis takes the cream puff from me.
    ko: 아니스가 내 슈크림을 받아들었다.
    ja: アニスが私のシュークリームを受け取った
  d_nikke_anis_star_02_97:
    speaker: anis_i
    en: If you keep being this nice to me, I'm gonna get spoiled.
    ko: 자꾸 이렇게 다정하게 하면, 나 진짜 버릇 나빠질지도 모른다?
    ja: |-
      ずっとそんなふうに甘やかしてたら、
      私、どんどんワガママになっちゃうかもよ？
  d_nikke_anis_star_02_98:
    speaker: "<Self>"
    en: So what if you get a little spoiled? Just be like that with me.
    ko: 나빠지면 어때. 나한테만 그러면 되지.
    ja: 別に構わない。私の前でだけならな
  d_nikke_anis_star_02_99:
    speaker: anis_i
    en: Huh...
    ko: "…그렇구나."
    ja: "…ふーん。"
  d_nikke_anis_star_02_100:
    speaker: "<Monologue>"
    en: Anis starts eating the cream puff I gave her,
    ko: 아니스는 내게 받은 슈크림을 먹기 시작했다.
    ja: |-
      アニスは私から受け取ったシュークリームを
      口に運んだ
  d_nikke_anis_star_02_101:
    speaker: "<Monologue>"
    en: savoring it one slow bite at a time.
    ko: 한 입씩, 아주 천천히.
    ja: 少しずつ、ゆっくりと味わうように
d_nikke_anis_star_03:
  d_nikke_anis_star_03_1:
    speaker: anis_i
    en: Nice, lots of space.
    ko: 지휘관님, 여기 앉아서 먹자.
    ja: 指揮官様、ここに座って食べましょ。
  d_nikke_anis_star_03_2:
    speaker: anis_i
    en: Let's eat here, Commander.
    ko: 자리도 넓고 딱 좋네.
    ja: 広くていい場所が空いてたわね。
  d_nikke_anis_star_03_3:
    speaker: "<Narration>"
    en: We drop into our seats with a soft thud.
    ko: 털썩-
    ja: ドサッ
  d_nikke_anis_star_03_4:
    speaker: "<Self>"
    en: I agreed to come here because you said you wanted to...
    ko: 오자고 해서 오긴 했는데….
    ja: 行こうと言うからついて来たが…
  d_nikke_anis_star_03_5:
    speaker: "<Self>"
    en: But burgers? Didn't we just have cream puffs?
    ko: 방금 전에 슈크림을 먹고, 또 햄버거를 먹어?
    ja: |-
      シュークリームを食べたばかりで、
      ハンバーガーも食べるのか？
  d_nikke_anis_star_03_6:
    speaker: anis_i
    en: Hey, food's food, and dessert's dessert.
    ko: 식사는 식사고 디저트는 디저트지.
    ja: ごはんはごはん、スイーツはスイーツよ。
  d_nikke_anis_star_03_7:
    speaker: anis_i
    en: They take up separate compartments in your stomach!
    ko: 디저트 배는 따로 있는 거라고~
    ja: 甘いものは別腹ってヤツね～
  d_nikke_anis_star_03_8:
    speaker: anis_i
    en: You know, I noticed you always go for the cheeseburger combo or the milkshake
      special whenever we come here.
    ko: 근데 지휘관님은 여기 오면 항상 치즈 버거 세트나 밀크셰이크 스페셜만 시키는 것 같네.
    ja: |-
      それより指揮官様、ここに来るといつも
      チーズバーガーセットか
      ミルクセーキスペシャルは注文してない？
  d_nikke_anis_star_03_9:
    speaker: anis_i
    en: 'And let me guess: you got the milkshake special again.'
    ko: 그거, 밀크셰이크 스페셜 맞지?
    ja: それ、ミルクセーキスペシャルでしょ？
  d_nikke_anis_star_03_10:
    speaker: "<Self>"
    en: You do the same thing.
    ko: 아니스도 그렇잖아.
    ja: アニスも同じだ
  d_nikke_anis_star_03_11:
    speaker: "<Self>"
    en: 'Let me guess: you got the cheeseburger combo.'
    ko: 치즈 버거 세트 시켰네.
    ja: いつものチーズバーガーセットじゃないか
  d_nikke_anis_star_03_12:
    speaker: anis_i
    en: At first, I just picked it 'cause it said "Best" on the menu.
    ko: "…처음엔 그냥 메뉴에 BEST라고 붙어 있어서 대충 시킨 거였거든?"
    ja: |-
      …最初はメニューにオススメってあったから
      それにしただけだったのよね。
  d_nikke_anis_star_03_13:
    speaker: anis_i
    en: I mean, I had to eat something. Might as well pick the "best" thing, right?
    ko: 뭐가 됐든 일단 먹긴 해야 하니까.
    ja: 何かは注文しないといけないし。
  d_nikke_anis_star_03_14:
    speaker: anis_i
    en: But at some point, whenever I couldn't decide, I'd just end up going with
      one of those two.
    ko: 그런데 어느 순간부터 따로 시키고 싶은 메뉴가 없으면, 일단 그 둘 중에 하나로 시키게 돼.
    ja: |-
      でもいつの間にか、
      気になるものが特になかったら、
      この2択になってるわね。
  d_nikke_anis_star_03_15:
    speaker: anis_i
    en: Guess I just got kinda attached.
    ko: 먹다 보니 정이라도 들었나.
    ja: 食べてるうちに気に入ったのかしら。
  d_nikke_anis_star_03_16:
    speaker: "<Narration>"
    en: Anis takes a bite and chews slowly.
    ko: 우물-
    ja: もぐもぐ…
  d_nikke_anis_star_03_17:
    speaker: anis_i
    en: Huh...?
    ko: 음…?
    ja: あれ…？
  d_nikke_anis_star_03_18:
    speaker: anis_i
    en: Did they tweak the recipe or something?
    ko: 재료가 좀 바뀐 건가?
    ja: 材料変わった…？
  d_nikke_anis_star_03_19:
    speaker: anis_i
    en: This tastes better than usual.
    ko: 뭔가 평소보다 더 맛있는데.
    ja: 何となく、いつもよりおいしい気がするわ。
  d_nikke_anis_star_03_20:
    speaker: "<Monologue>"
    en: I take a bite of my burger, then wash it down with a sip of the milkshake.
    ko: 나도 버거를 먹은 다음, 밀크셰이크를 한 입 마셨다.
    ja: |-
      私も自分のハンバーガーにかじりつき、
      ミルクセーキを一口飲んだ
  d_nikke_anis_star_03_21:
    speaker: "<Self>"
    en: It tastes the same to me.
    ko: 난 평소랑 똑같은 것 같은데.
    ja: いつも通りだと思うが
  d_nikke_anis_star_03_22:
    speaker: anis_i
    en: Did they just change the cheeseburger?
    ko: 혹시 치즈 버거만 바뀐 건가?
    ja: |-
      もしかして、チーズバーガーだけ
      リニューアルされたとか？
  d_nikke_anis_star_03_23:
    speaker: anis_i
    en: Lemme try yours.
    ko: 그럼 내가 한번 지휘관님 거 먹어볼게.
    ja: 指揮官様のやつ、ちょっと味見してもいい？
  d_nikke_anis_star_03_24:
    speaker: "<Self>"
    en: Here you go.
    ko: 자, 여기.
    ja: ああ
  d_nikke_anis_star_03_25:
    speaker: "<Monologue>"
    en: I hold out my burger to Anis.
    ko: 나는 가져가라고 아니스에게 버거를 내밀었다.
    ja: 私は自分のハンバーガーをアニスの前に置いた
  d_nikke_anis_star_03_26:
    speaker: anis_i
    en: Aaaaaah...
    ko: 아아~
    ja: あ～ん…
  d_nikke_anis_star_03_27:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_03_28:
    speaker: anis_i
    en: Aaaaah!
    ko: 아아~!
    ja: あ～ん！
  d_nikke_anis_star_03_29:
    speaker: "<Self>"
    en: "... Fine."
    ko: "…알았어."
    ja: "…仕方ないな"
  d_nikke_anis_star_03_30:
    speaker: "<Monologue>"
    en: I hold out my half-eaten burger and feed it to Anis.
    ko: 먹던 버거를 그대로, 아니스에게 먹여주었다.
    ja: |-
      私は置いたハンバーガーを取り
      アニスの口元に差し出した
  d_nikke_anis_star_03_31:
    speaker: "<Narration>"
    en: She chews quietly.
    ko: 우물우물-
    ja: ぱくっ…もぐもぐ…
  d_nikke_anis_star_03_32:
    speaker: anis_i
    en: No way this tastes the same as usual.
    ko: 아니, 어디가 평소랑 똑같다는 거야.
    ja: ちょっと、全然いつも通りと違うじゃない。
  d_nikke_anis_star_03_33:
    speaker: anis_i
    en: Even yours tastes better, Commander.
    ko: 지휘관님 버거도 더 맛있어졌잖아.
    ja: こっちもいつもよりおいしいわ。
  d_nikke_anis_star_03_34:
    speaker: anis_i
    en: It's got more umami to it or something.
    ko: 뭔가 감칠맛이 는 것 같은 느낌인데.
    ja: なんか、コクが出てるっていうか。
  d_nikke_anis_star_03_35:
    speaker: anis_i
    en: "... All right, I'm trying the milkshake too."
    ko: "…혹시 모르니까 밀크셰이크도 한번 마셔볼게."
    ja: "…念のため、ミルクセーキも一口もらうわね。"
  d_nikke_anis_star_03_36:
    speaker: "<Monologue>"
    en: Anis grabs my milkshake
    ko: 아니스가 내 밀크셰이크 컵을 가져갔다.
    ja: アニスにミルクセーキのカップを取り上げられた
  d_nikke_anis_star_03_37:
    speaker: "<Narration>"
    en: and takes a long slurp.
    ko: 호로록-
    ja: ゴクッ――
  d_nikke_anis_star_03_38:
    speaker: anis_i
    en: Hmm...
    ko: 으음….
    ja: うーん…
  d_nikke_anis_star_03_39:
    speaker: anis_i
    en: Yeah, this one's kinda sweeter too.
    ko: 이것도 좀 더 달달한 느낌이 든단 말이지.
    ja: 前より甘くなってる気がするわ。
  d_nikke_anis_star_03_40:
    speaker: "<Self>"
    en: Here, let me try yours.
    ko: 이번엔 내가 아니스 거 먹어볼게.
    ja: 私もアニスのチーズバーガーを食べてみよう
  d_nikke_anis_star_03_41:
    speaker: anis_i
    en: Yeah, her—
    ko: 응, 여ㄱ….
    ja: うん。はい、どう…
  d_nikke_anis_star_03_42:
    speaker: "<Monologue>"
    en: As Anis moves to feed me, she stops.
    ko: 아니스는 버거를 먹여주려다가, 손을 멈췄다.
    ja: |-
      チーズバーガーを差し出そうとした
      アニスの手が止まった
  d_nikke_anis_star_03_43:
    speaker: anis_i
    en: Um... Commander,
    ko: 그… 지휘관님.
    ja: あの…指揮官様。
  d_nikke_anis_star_03_44:
    speaker: anis_i
    en: mind if I grab a bread knife real quick?
    ko: 카운터에 빵칼 좀 가지러 다녀와도 될까?
    ja: ちょっとナイフを取ってくるわね？
  d_nikke_anis_star_03_45:
    speaker: "<Self>"
    en: What for?
    ko: 빵칼은 왜?
    ja: どうした？
  d_nikke_anis_star_03_46:
    speaker: anis_i
    en: I-I just wanted to cut it neatly, that's all.
    ko: 그, 그냥 깨끗하게 잘라 주고 싶어서 그렇지.
    ja: き、きれいに切ったほうがいいでしょ。
  d_nikke_anis_star_03_47:
    speaker: anis_i
    en: It's more hygienic that way.
    ko: 위생적으로도 그게 좋으니까.
    ja: 衛生的に、うん。
  d_nikke_anis_star_03_48:
    speaker: "<Self>"
    en: You were fine eating mine...
    ko: 아니스는 내 버거를 그냥 먹었는데?
    ja: 私のハンバーガーは気にせずかじっただろう？
  d_nikke_anis_star_03_49:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_03_50:
    speaker: "<Self>"
    en: And drinking from my straw, though.
    ko: 밀크셰이크까지 내 빨대로 마셨고.
    ja: ミルクセーキのストローにも口を付けていた
  d_nikke_anis_star_03_51:
    speaker: anis_i
    en: Hey, you could've said something...
    ko: 아니, 알고 있었으면 말을 좀 해달라고요….
    ja: いや、気づいてたなら早く言ってよね…
  d_nikke_anis_star_03_52:
    speaker: anis_i
    en: I had no idea I was eating where you'd already taken a bite.
    ko: 나 진짜로 지휘관님이 입댄 곳을 먹는다는 자각은 없었단 말이야.
    ja: |-
      私、指揮官様が口を付けたものを食べてるって
      自覚してなかったのよ。
  d_nikke_anis_star_03_53:
    speaker: "<Self>"
    en: That's not like you, Anis.
    ko: 뭔가 평소의 아니스답지 않네.
    ja: いつものアニスらしくないな
  d_nikke_anis_star_03_54:
    speaker: anis_i
    en: What do you mean?
    ko: 나답지 않아?
    ja: 私らしくない？
  d_nikke_anis_star_03_55:
    speaker: "<Self>"
    en: Normally, you'd just feed me without thinking twice.
    ko: 다른 때 같았으면 아무렇지 않게 먹여줬을 것 같은데.
    ja: いつもならそんなこと気にしないはずだ
  d_nikke_anis_star_03_56:
    speaker: anis_i
    en: P-people change, you know?
    ko: 사, 사람이 살다 보면 변하기도 하고 하는 거지.
    ja: |-
      そ、それは生きてれば
      変わることだってあるでしょ？
  d_nikke_anis_star_03_57:
    speaker: "<Self>"
    en: So now you won't feed me anymore?
    ko: 변했으니까 나한테는 안 먹여주는 거야?
    ja: 変わったから、私には食べさせてくれないのか？
  d_nikke_anis_star_03_58:
    speaker: anis_i
    en: Fine, I'll do it! Happy?
    ko: "…알았어! 하면 되잖아!"
    ja: "…分かったわよ！やればいいんでしょ！"
  d_nikke_anis_star_03_59:
    speaker: "<Monologue>"
    en: She brings the cheeseburger to my lips.
    ko: 아니스는 치즈 버거를 내 입에 넣어주었다.
    ja: アニスがチーズバーガーを私の口にねじ込んだ
  d_nikke_anis_star_03_60:
    speaker: "<Self>"
    en: Yeah, it does taste better.
    ko: 음. 확실히 맛있어졌네.
    ja: ああ、確かにおいしくなっている
  d_nikke_anis_star_03_61:
    speaker: "<Self>"
    en: Maybe it's because you fed me.
    ko: 아니스가 먹여줘서 그런가 보다.
    ja: アニスが食べさせてくれたからだな
  d_nikke_anis_star_03_62:
    speaker: anis_i
    en: That's not what I was getting at...
    ko: 아니, 내가 맛있어졌다는 건 그런 거랑 다르다고….
    ja: |-
      いや、おいしくなったって言ったのは
      そういう話じゃなくて…
  d_nikke_anis_star_03_63:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_03_64:
    speaker: anis_i
    en: "*Sigh*"
    ko: 하아….
    ja: はぁ…
  d_nikke_anis_star_03_65:
    speaker: "<Monologue>"
    en: She slumps onto the table.
    ko: 아니스는 테이블 위에 축 늘어졌다.
    ja: |-
      アニスは垂れ下がるような姿勢で
      テーブルに頭を乗せた
  d_nikke_anis_star_03_66:
    speaker: anis_i
    en: You're right.
    ko: 진짜 그렇네.
    ja: ホント、まったくね。
  d_nikke_anis_star_03_67:
    speaker: anis_i
    en: I'm not my usual self.
    ko: 지휘관님 말대로, 뭔가 평소의 나답지 않아.
    ja: |-
      指揮官様の言う通り、
      いつもの私らしくないわ。
  d_nikke_anis_star_03_68:
    speaker: "<Self>"
    en: What's wrong?
    ko: 그렇지?
    ja: そうだろう？
  d_nikke_anis_star_03_69:
    speaker: anis_i
    en: Honestly...
    ko: 솔직히 말하면….
    ja: もう正直に言っちゃうけど…
  d_nikke_anis_star_03_70:
    speaker: anis_i
    en: When you lied earlier just to give me your cream puff, my heart actually started
      racing.
    ko: 아까 지휘관님이 거짓말까지 하면서 슈크림 나눠줬을 때, 나 엄청 두근거렸거든?
    ja: |-
      さっき指揮官様がウソまでついて
      シュークリームを分けてくれた時、
      すごくドキドキしたのよ？
  d_nikke_anis_star_03_71:
    speaker: anis_i
    en: That's when things got weird. The old me would've just taken it since free
      food's free food, right?
    ko: 그때부터 이상했어. 예전의 나였으면 웬 떡이냐 하고 아무 생각 없이 받아 갔을 테니까.
    ja: |-
      あの時からおかしかったわ。
      昔の私なら、ラッキー！って
      何も考えずに食べてたはずだし。
  d_nikke_anis_star_03_72:
    speaker: anis_i
    en: But now,
    ko: 지금도 그래.
    ja: 今だってそう。
  d_nikke_anis_star_03_73:
    speaker: anis_i
    en: I'm seriously getting worked up over something like sharing a bite? What's
      wrong with me?
    ko: 내가 먹던 걸 서로 먹여준다고 해서 이렇게 반응할 애였나, 싶네.
    ja: |-
      自分の食べてるものをお互いに
      食べさせ合うくらいで
      こんなに意識しないはず。
  d_nikke_anis_star_03_74:
    speaker: anis_i
    en: If anything, I'd usually be the one telling you to try mine... not sitting
      here hesitating like this.
    ko: 오히려 내가 지휘관님한테 하자고 하면 했지, 못 하겠다곤 안 했을 것 같은데….
    ja: |-
      今までならそうするにしても、
      ナイフで切るなんて言うワケないのに…
  d_nikke_anis_star_03_75:
    speaker: "<Self>"
    en: It's fine. I'll go along with whatever you want.
    ko: 그래도 상관없잖아. 내가 다 받아줄 건데.
    ja: |-
      別にいいじゃないか
      私はどう変わろうと受け入れる
  d_nikke_anis_star_03_76:
    speaker: "<Monologue>"
    en: I gently stroke Anis's hair as she lies face down.
    ko: 나는 엎드려 있는 아니스의 머리를 쓰다듬었다.
    ja: 私は机に伏せたアニスの頭に手を伸ばし、なでた
  d_nikke_anis_star_03_77:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_03_78:
    speaker: anis_i
    en: More...
    ko: 더.
    ja: もっと。
  d_nikke_anis_star_03_79:
    speaker: "<Self>"
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_anis_star_03_80:
    speaker: anis_i
    en: Stroke my head more gently.
    ko: 더 부드럽게 쓰다듬어줘.
    ja: もっと優しく。
  d_nikke_anis_star_03_81:
    speaker: anis_i
    en: You said you'd give me whatever I want, didn't you?
    ko: 다 받아준댔잖아.
    ja: 何でも受け入れてくれるんでしょ？
  d_nikke_anis_star_03_82:
    speaker: "<Self>"
    en: That I did.
    ko: 그래, 알았어.
    ja: ああ、そうだな
  d_nikke_anis_star_03_83:
    speaker: "<Monologue>"
    en: I stroke her hair more gently and slowly.
    ko: 아니스의 머리를 더 부드럽게, 그리고 천천히 쓰다듬었다.
    ja: |-
      さっきよりも優しく、ゆっくりと
      アニスの頭をなでた
  d_nikke_anis_star_03_84:
    speaker: anis_i
    en: "... That feels nice."
    ko: "…손길이 부드러워서 기분 좋다."
    ja: "…手、柔らかくて気持ちいい。"
  d_nikke_anis_star_03_85:
    speaker: femaleguest_a
    en: Yeesh, what's up with her? Is this her first relationship or something?
    ko: 아… 연애 처음 하나. 왜 저런대?
    ja: |-
      何かしら…初恋のカップル？
      どうしたのかしら？
  d_nikke_anis_star_03_86:
    speaker: femaleguest_b
    en: No idea, but she seems to be enjoying herself. Just let her be.
    ko: 몰라, 좋나 보지~ 내비둬.
    ja: |-
      さあ？仲良さそうだし～
      ほっといてあげましょ。
  d_nikke_anis_star_03_87:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_03_88:
    speaker: "<Monologue>"
    en: Anis lifts her head.
    ko: 아니스가 고개를 들어 올렸다.
    ja: アニスが頭を上げた
  d_nikke_anis_star_03_89:
    speaker: anis_i
    en: I think that's enough...
    ko: 여기까지만 할까…?
    ja: これぐらいにしときましょ…？
  d_nikke_anis_star_03_90:
    speaker: "<Self>"
    en: I can keep going if you want.
    ko: 난 더 해도 괜찮은데.
    ja: 私は別に続けてもかまわないが
  d_nikke_anis_star_03_91:
    speaker: anis_i
    en: N-no, it's fine.
    ko: 돼, 됐어.
    ja: も、もう大丈夫だから。
  d_nikke_anis_star_03_92:
    speaker: anis_i
    en: We've still got places to be, so we should get going soon.
    ko: 어차피 가야 할 곳도 남아서, 슬슬 일어나야 돼.
    ja: まだ行くところもあるし、そろそろ出ないと。
  d_nikke_anis_star_03_93:
    speaker: anis_i
    en: Come on, let's finish this.
    ko: 빨리 남은 거나 해치우자.
    ja: 早く食べていきましょ。
  d_nikke_anis_star_03_94:
    speaker: "<Monologue>"
    en: She resumes eating her burger.
    ko: 아니스는 본인의 햄버거를 다시 먹기 시작했다.
    ja: アニスは自分のハンバーガーにかじりついた
  d_nikke_anis_star_03_95:
    speaker: anis_i
    en: Yep, it's even better now...
    ko: 역시 맛있어졌네.
    ja: やっぱり、おいしくなってるわ。
  d_nikke_anis_star_03_96:
    speaker: anis_i
    en: Even more than before.
    ko: "…아까보다도 더."
    ja: "…さっきより、もっと。"
d_nikke_anis_star_04:
  d_nikke_anis_star_04_1:
    speaker: "<Narration>"
    en: After we finish eating, we arrive at our next stop.
    ko: 식사를 마치고 다음 목적지에 도착했다.
    ja: 食事を済ませ、次の目的地に向かった
  d_nikke_anis_star_04_2:
    speaker: "<Self>"
    en: Are we going shopping?
    ko: 이번엔 쇼핑하러 가는 거야?
    ja: 次はショッピングか？
  d_nikke_anis_star_04_3:
    speaker: anis_i
    en: Yeah, but we're not there yet.
    ko: 쇼핑하러 온 건 맞는데, 아직 더 가야 돼.
    ja: そうなんだけど、もう少し先よ。
  d_nikke_anis_star_04_4:
    speaker: anis_i
    en: The place I wanna go is further in.
    ko: 내가 가고 싶은 곳은 좀 더 안쪽에 있거든.
    ja: |-
      私の行きたいお店が
      ちょっとセンターを外れた場所にあるの。
  d_nikke_anis_star_04_5:
    speaker: "<Self>"
    en: So what are you getting?
    ko: 뭘 사려는 건데?
    ja: 何の店だ？
  d_nikke_anis_star_04_6:
    speaker: anis_i
    en: That's a secret.
    ko: 그건 비밀.
    ja: それはヒミツ。
  d_nikke_anis_star_04_7:
    speaker: anis_i
    en: You'll find out when we get there.
    ko: 가보면 알아.
    ja: 行けば分かるわ。
  d_nikke_anis_star_04_8:
    speaker: "<Monologue>"
    en: I follow Anis deep into the Royal Road shopping district.
    ko: 아니스를 따라 로열 로드 쇼핑 거리 깊숙한 곳까지 들어갔다.
    ja: |-
      アニスについて、ロイヤルロードの
      ショッピング街を奥へと進んだ
  d_nikke_anis_star_04_9:
    speaker: "<Narration>"
    en: The crowd buzzes all around us.
    ko: 웅성웅성-
    ja: ガヤガヤ――
  d_nikke_anis_star_04_10:
    speaker: anis_i
    en: All right, this is the place.
    ko: 자, 여기가 목적지야.
    ja: 着いたわ、ここよ。
  d_nikke_anis_star_04_11:
    speaker: anis_i
    en: Damn, it's packed.
    ko: 근데 사람 진짜 많네.
    ja: ずいぶん繁盛してるみたいね。
  d_nikke_anis_star_04_12:
    speaker: "<Monologue>"
    en: Anis stares at the large photo of herself hanging at the entrance.
    ko: 아니스는 큼지막하게 입구에 걸린 자신의 사진을 바라보았다.
    ja: |-
      アニスの視線が
      入口に大きく飾られている
      自分の写真に向けられた
  d_nikke_anis_star_04_13:
    speaker: anis_i
    en: Do they really need to make it this flashy for a retired pop star?
    ko: 은퇴한 아이돌 상대로 이렇게까지 화려하게 할 필요 있나….
    ja: |-
      引退したアイドルなんて、
      こんな目立つように飾ってくれなくても…
  d_nikke_anis_star_04_14:
    speaker: "<Self>"
    en: A T.T. STAR pop-up store?
    ko: T.T. STAR 팝업 스토어….
    ja: T.T. STARのポップアップストアか…
  d_nikke_anis_star_04_15:
    speaker: anis_i
    en: Apparently, this is T.T. STAR's last pop-up store,
    ko: 3인조인 T.T. STAR의 팝업 스토어로는 이게 마지막이라더라.
    ja: |-
      3人組のT.T. STARとしては
      これが最後になるからって。
  d_nikke_anis_star_04_16:
    speaker: anis_i
    en: so the owner said they're going all out for it...
    ko: 마지막이니까 그만큼 화려하게 하겠다고 사장님한테 듣긴 했는데….
    ja: |-
      その分豪華にするって
      社長から聞いてはいたけど…
  d_nikke_anis_star_04_17:
    speaker: "<Self>"
    en: It's pretty packed, so I guess the fans really wanted this.
    ko: 이렇게 사람이 많은 걸 보면 팬들도 원했던 것 같은데.
    ja: |-
      これだけ大勢の人が来ているなら
      ファンも望んでいたということだ
  d_nikke_anis_star_04_18:
    speaker: "<Self>"
    en: You don't like it, Anis?
    ko: 아니스는 싫어?
    ja: アニスは気に入らないのか？
  d_nikke_anis_star_04_19:
    speaker: anis_i
    en: I like it. I do, but...
    ko: 당연히 좋지. 좋긴 한데….
    ja: もちろん嬉しいわよ。嬉しいけど…
  d_nikke_anis_star_04_20:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_04_21:
    speaker: anis_i
    en: Commander,
    ko: 지휘관님.
    ja: 指揮官様。
  d_nikke_anis_star_04_22:
    speaker: anis_i
    en: hang on a sec.
    ko: 잠깐만 기다려 줄래?
    ja: ちょっと待ってくれる？
  d_nikke_anis_star_04_23:
    speaker: anis_i
    en: My hands are getting kinda sweaty.
    ko: 나 이상하게 손에 땀이 차서.
    ja: なんだか手汗が止まらなくて。
  d_nikke_anis_star_04_24:
    speaker: "<Self>"
    en: Are you nervous?
    ko: 긴장돼?
    ja: 緊張しているのか？
  d_nikke_anis_star_04_25:
    speaker: anis_i
    en: "... A little."
    ko: "…조금."
    ja: "…ちょっとね。"
  d_nikke_anis_star_04_26:
    speaker: anis_i
    en: Feels kinda like my first time going on stage.
    ko: 뭔가 처음 무대 올라갈 때랑 비슷한 기분이야.
    ja: 初めてステージに上がった時ぐらい。
  d_nikke_anis_star_04_27:
    speaker: "<Self>"
    en: That sounds like more than a little.
    ko: 그럼 조금이 아닌 것 같은데.
    ja: それはちょっとではないと思うが
  d_nikke_anis_star_04_28:
    speaker: anis_i
    en: Hey, cut me some slack, all right?
    ko: 아 쫌! 이런 건 적당히 넘어가 주라!
    ja: もう！あんまり意識させないでよ！
  d_nikke_anis_star_04_29:
    speaker: anis_i
    en: This is new for me too!
    ko: 나도 이런 건 처음이란 말이야!
    ja: 私だってこんなこと初めてなんだから！
  d_nikke_anis_star_04_30:
    speaker: "<Monologue>"
    en: I reach out and take Anis's hand in mine.
    ko: 나는 팔을 뻗어 아니스의 손을 잡았다.
    ja: 私は手を伸ばし、アニスの手を握った
  d_nikke_anis_star_04_31:
    speaker: "<Self>"
    en: Maybe this will calm you down.
    ko: 이러면 좀 진정이 되지 않을까?
    ja: こうしていれば少しは落ち着くか？
  d_nikke_anis_star_04_32:
    speaker: anis_i
    en: "!"
    ko: "!!"
    ja: "！！"
  d_nikke_anis_star_04_33:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_04_34:
    speaker: "<Self>"
    en: Why'd you go quiet?
    ko: 왜 조용해졌어?
    ja: 急に静かになったな？
  d_nikke_anis_star_04_35:
    speaker: anis_i
    en: "... Now I'm starting to get nervous for a whole different reason."
    ko: "…다른 의미로 긴장되기 시작해서."
    ja: "…別の意味で緊張してきちゃって。"
  d_nikke_anis_star_04_36:
    speaker: "<Self>"
    en: Anyway, let's just head in and figure it out as we go.
    ko: 어찌됐든 일단 들어가서 고민하자.
    ja: とりあえず、中に入ってみようか
  d_nikke_anis_star_04_37:
    speaker: "<Self>"
    en: I'm curious to see what's inside too.
    ko: 나도 안에 뭐 있는지 궁금해.
    ja: 何があるのか、私も気になる
  d_nikke_anis_star_04_38:
    speaker: anis_i
    en: "... Okay."
    ko: "…응."
    ja: "…うん。"
  d_nikke_anis_star_04_39:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_anis_star_04_40:
    speaker: anis_i
    en: Did I grab too much?
    ko: 너무 많이 담았나?
    ja: 買いすぎ？
  d_nikke_anis_star_04_41:
    speaker: "<Monologue>"
    en: Anis looks down at the basket in her hand.
    ko: 아니스는 들고 있는 바구니를 바라보았다.
    ja: アニスは手に持った買い物かごに目をやった
  d_nikke_anis_star_04_42:
    speaker: anis_i
    en: "... Whatever. Better to regret buying it than not buying it at all."
    ko: "…뭐, 안 사고 후회하느니 사고 후회하는 게 낫겠지."
    ja: |-
      …ま、買わずに後悔するより
      買って後悔する方がいいわよね。
  d_nikke_anis_star_04_43:
    speaker: anis_i
    en: Let's go pay.
    ko: 이제 계산하러 가자.
    ja: レジに行きましょ。
  d_nikke_anis_star_04_44:
    speaker: "<Self>"
    en: Want me to get it?
    ko: 내가 살까?
    ja: 私が出そう
  d_nikke_anis_star_04_45:
    speaker: anis_i
    en: Nah, I've got it. Why're you paying? It's my stuff.
    ko: 됐어. 내 물건인데 지휘관님이 왜 사 줘.
    ja: ううん。私の買い物だから、自分で出すわ。
  d_nikke_anis_star_04_46:
    speaker: "<Self>"
    en: It's not the first time I've gotten you something.
    ko: 내가 사주는 게 이번이 처음도 아닌데.
    ja: 別に、私に出させるのも初めてじゃないだろう
  d_nikke_anis_star_04_47:
    speaker: anis_i
    en: "...?"
    ko: "…??"
    ja: "…？？"
  d_nikke_anis_star_04_48:
    speaker: "<Self>"
    en: I got you a necklace once, remember?
    ko: 예전에 목걸이 사준 적도 있잖아.
    ja: ネックレスを買ったことがあったな
  d_nikke_anis_star_04_49:
    speaker: anis_i
    en: You remembered that too...?
    ko: 그것도 기억하고 있었어…?
    ja: それも覚えてたの…？
  d_nikke_anis_star_04_50:
    speaker: "<Self>"
    en: I remember buying you that new necklace,
    ko: 신상 목걸이라고 사줬던 것도 기억하고.
    ja: 新作だと言っていたことも覚えている
  d_nikke_anis_star_04_51:
    speaker: "<Self>"
    en: then heading out to the Outer Rim after.
    ko: 그 뒤로 아우터 림에 갔던 것도 기억하고.
    ja: そのあとアウターリムに行ったことも…
  d_nikke_anis_star_04_52:
    speaker: "<Self>"
    en: We even shared a beer that night.
    ko: 그날 저녁에 아니스랑 맥주 한 캔 했던 것도 기억하지.
    ja: 夜にビールで乾杯したことも覚えているな
  d_nikke_anis_star_04_53:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_04_54:
    speaker: anis_i
    en: I thought you'd only remembered bits and pieces,
    ko: 정말 어쩌다 기억하고 있을 뿐이라고 생각했는데.
    ja: たまたまかと思ってたけど…
  d_nikke_anis_star_04_55:
    speaker: anis_i
    en: but you actually remember everything we've been through.
    ko: 진짜 나랑 있었던 일은 전부 기억하고 있었구나….
    ja: |-
      本当に私との出来事、
      全部覚えててくれてるのね。
  d_nikke_anis_star_04_56:
    speaker: "<Self>"
    en: Even that time you burped after drinking some soda...
    ko: 그날 아니스가 탄산수 마시고 트림했던 것까지….
    ja: 炭酸水を飲んでゲップをしたこともな
  d_nikke_anis_star_04_57:
    speaker: anis_i
    en: "*Sigh*"
    ko: 하아…
    ja: はあ…
  d_nikke_anis_star_04_58:
    speaker: anis_i
    en: You really do remember the most random things.
    ko: 쓸데없는 것까지 다 기억하고 있네.
    ja: 余計なことは覚えなくていいから。
  d_nikke_anis_star_04_59:
    speaker: "<Self>"
    en: Why, you falling for me or something?
    ko: 왜? 반할 것 같아?
    ja: どうした？惚れたか？
  d_nikke_anis_star_04_60:
    speaker: "<Monologue>"
    en: Anis turns her head away,
    ko: 아니스는 나에게서 고개를 돌렸다.
    ja: アニスが顔を背けた
  d_nikke_anis_star_04_61:
    speaker: "<Monologue>"
    en: but her ears are bright red.
    ko: 하지만 붉어진 귀는 선명히 보인다.
    ja: だが、はっきりと赤くなった耳が見える
  d_nikke_anis_star_04_62:
    speaker: anis_i
    en: Yeah, I've been into you for a while now...
    ko: 반한 거야 진즉 반해 있었지 뭐….
    ja: そんなの、とっくに昔から…
  d_nikke_anis_star_04_63:
    speaker: anis_i
    en: Figures, right? The one who falls first is the one who loses.
    ko: 이게 좋아하는 사람이 지는 거다, 뭐 그런 건가.
    ja: 惚れた弱みってヤツかしらね、これが。
  d_nikke_anis_star_04_64:
    speaker: anis_i
    en: Whatever, just take it.
    ko: 됐으니까 이거나 받아.
    ja: ま、いいわ。はい、これ。
  d_nikke_anis_star_04_65:
    speaker: "<Monologue>"
    en: I take the basket Anis holds out.
    ko: 나는 아니스가 들이민 바구니를 받아들었다.
    ja: アニスが突き出した買い物かごを受け取った
  d_nikke_anis_star_04_66:
    speaker: "<Self>"
    en: I'm paying. You sure you don't want anything else?
    ko: 이왕 사주는 건데, 더 안 사도 괜찮겠어?
    ja: |-
      私が出すと言ったのに、
      もっと買わなくていいのか？
  d_nikke_anis_star_04_67:
    speaker: anis_i
    en: It's fine, that's enough.
    ko: 괜찮아. 그 정도로 충분해.
    ja: 大丈夫。それで十分よ。
  d_nikke_anis_star_04_68:
    speaker: anis_i
    en: Let's go pay already.
    ko: 빨리 계산이나 하러 가자.
    ja: 早くレジに行きましょ。
  d_nikke_anis_star_04_69:
    speaker: anis_i
    en: No point wasting time.
    ko: 시간 아까워.
    ja: 時間がもったいないわ。
  d_nikke_anis_star_04_70:
    speaker: "<Self>"
    en: Okay.
    ko: 알았어.
    ja: 分かった
  d_nikke_anis_star_04_71:
    speaker: "<Monologue>"
    en: We make our way to the counter.
    ko: 우리는 계산대로 향했다.
    ja: 私たちはレジへ向かった
  d_nikke_anis_star_04_72:
    speaker: "<Self>"
    en: Could you ring this up for me?
    ko: 이거 계산해 주세요.
    ja: これをお願いします
  d_nikke_anis_star_04_73:
    speaker: "<Monologue>"
    en: The cashier looks past me at Anis.
    ko: 점원은 내 뒤에 서 있는 아니스를 바라보았다.
    ja: |-
      私の背中に隠れているアニスを
      店員がまじまじと見つめた
  d_nikke_anis_star_04_74:
    speaker: clerk
    en: Um...
    ko: 저기 혹시….
    ja: あの…ひょっとして…
  d_nikke_anis_star_04_75:
    speaker: clerk
    en: Are you Anis from T.T. STAR, by any chance?
    ko: T.T. STAR의 아니스 맞죠…?
    ja: T.T. STARの…ご本人様…？
  d_nikke_anis_star_04_76:
    speaker: anis_i
    en: Nah, I'm not Anis from T.T. STAR. Just Anis.
    ko: 그냥 아니스긴 해요. T.T. STAR는 아니고.
    ja: もうT.T. STARじゃないけどね。
  d_nikke_anis_star_04_77:
    speaker: clerk
    en: I knew it!
    ko: 역시!
    ja: やっぱり！
  d_nikke_anis_star_04_78:
    speaker: clerk
    en: I applied to work here because this is the last T.T. STAR pop-up store!
    ko: 저, 3인조 T.T. STAR 팝업 스토어는 이게 마지막이라고 해서 알바에 지원했어요!
    ja: |-
      私、3人組のT.T. STARでは今回が
      最後のポップアップストアだって聞いて、
      バイトに応募したんです！
  d_nikke_anis_star_04_79:
    speaker: clerk
    en: I couldn't just let it end like that, but I never thought I'd actually get
      to meet you in person! I'm so glad I applied!
    ko: |-
      마지막이라는 게 아쉬워서 지원했는데, 실물을 만나게 될 줄은…!
      아… 지원하길 잘했다.
    ja: |-
      最後だから思い切って応募したんですけど、
      まさか本物に会えるなんて…！
      ああ…本当によかった…
  d_nikke_anis_star_04_80:
    speaker: "<Narration>"
    en: The cashier pulls Anis into a tight hug.
    ko: 꾸욱-
    ja: ムギュッ――
  d_nikke_anis_star_04_81:
    speaker: anis_i
    en: "?"
    ko: "??"
    ja: "？？"
  d_nikke_anis_star_04_82:
    speaker: littlegirl
    en: Anis! Miss Anis!
    ko: 언니! 아니스 언니!
    ja: アニス！アニスおねえちゃん！
  d_nikke_anis_star_04_83:
    speaker: littlegirl
    en: Could you sign this for me?
    ko: 나 여기에 사인해 주면 안 돼?
    ja: これにサインちょうだい？
  d_nikke_anis_star_04_84:
    speaker: maleguest_a
    en: What? Anis is here?!
    ko: 뭐? 아니스가 여기 왔다고?
    ja: えっ？アニスが来てるのか？
  d_nikke_anis_star_04_85:
    speaker: femaleguest_a
    en: Me too! Please sign mine!
    ko: 나도! 나도 사인해 줘!
    ja: 私も！私にもサインして！
  d_nikke_anis_star_04_86:
    speaker: maleguest_b
    en: She's over there at the counter!
    ko: 저기 계산대 앞에 있다!
    ja: あそこのレジの前だ！
  d_nikke_anis_star_04_87:
    speaker: "<Monologue>"
    en: Customers suddenly swarm the counter, and the store erupts into chaos.
    ko: 손님들이 일제히 계산대로 몰려들면서, 가게 안이 소란스러워졌다.
    ja: |-
      客がいっせいにレジへ殺到し、
      店内はたちまち大騒ぎになった
  d_nikke_anis_star_04_88:
    speaker: "<Self>"
    en: This is bad...
    ko: 이거 큰일 났네….
    ja: 大変なことになったな…
  d_nikke_anis_star_04_89:
    speaker: anis_i
    en: Sorry, Commander...
    ko: 미안… 지휘관님.
    ja: ごめんね…指揮官様。
  d_nikke_anis_star_04_90:
    speaker: anis_i
    en: I should've known people would recognize me at a T.T. STAR pop-up store. That
      was careless of me.
    ko: T.T. STAR 팝업 스토어면 당연히 사람들이 알아볼 수 있다고 예상했어야 했는데, 내 생각이 짧았어.
    ja: |-
      T.T. STARのグッズを売ってる店なんて
      行ったら気づかれて騒ぎになるってこと、
      全然考えてなかったわ。
  d_nikke_anis_star_04_91:
    speaker: anis_i
    en: Honestly, it's weirder that no one noticed until now.
    ko: 그래, 오히려 지금까지 못 알아본 게 말이 안 됐지.
    ja: |-
      逆に…今まで気づかれずに済んでたことが
      不思議なくらいね。
  d_nikke_anis_star_04_92:
    speaker: anis_i
    en: "... But it's not like we're out of options."
    ko: "…그래도 해결할 방법이 없는 건 아니야."
    ja: "…でも、解決策がないわけじゃないわ。"
  d_nikke_anis_star_04_93:
    speaker: "<Self>"
    en: So, what now?
    ko: 어쩌게?
    ja: どうするんだ？
  d_nikke_anis_star_04_94:
    speaker: anis_i
    en: What do you think?
    ko: 어쩌긴.
    ja: どうするって…
  d_nikke_anis_star_04_95:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_04_96:
    speaker: anis_i
    en: We run for it.
    ko: "…튀어야지."
    ja: "…ダッシュで逃げるのよ。"
d_nikke_anis_star_05:
  d_nikke_anis_star_05_1:
    speaker: anis_i
    en: "*Huff... huff...*"
    ko: 하아, 하아….
    ja: はぁ、はぁ…
  d_nikke_anis_star_05_2:
    speaker: "<Self>"
    en: "*Huff...*"
    ko: 하아….
    ja: はぁ…
  d_nikke_anis_star_05_3:
    speaker: anis_i
    en: Pfft!
    ko: 푸훕.
    ja: ふふっ…
  d_nikke_anis_star_05_4:
    speaker: anis_i
    en: Hahahaha!
    ko: 아하하하하!
    ja: あはははは！
  d_nikke_anis_star_05_5:
    speaker: "<Self>"
    en: What's so funny?
    ko: 갑자기 왜 웃어?
    ja: 急に笑いだして、どうした？
  d_nikke_anis_star_05_6:
    speaker: anis_i
    en: Nah, it's just the situation.
    ko: 아니, 그냥 상황이 웃겨서.
    ja: なんか、急におかしく感じちゃったのよ。
  d_nikke_anis_star_05_7:
    speaker: anis_i
    en: Running away 'cause people recognized me kinda makes me feel like a celebrity.
    ko: 사람들이 알아봐서 도망치는 거, 진짜 연예인 같잖아.
    ja: |-
      みんなに気づかれて逃げるって、
      すごく芸能人っぽいじゃない？
  d_nikke_anis_star_05_8:
    speaker: anis_i
    en: Funny how I never got to do that when I was still a pop star.
    ko: 아이돌일 땐 못 해본 걸 은퇴하고 나서야 해보네.
    ja: |-
      アイドルの時に経験できなかったこと、
      引退してから経験するなんて。
  d_nikke_anis_star_05_9:
    speaker: anis_i
    en: Heh, that was actually pretty fun!
    ko: 아~ 재밌었다.
    ja: あ～…楽しかった。
  d_nikke_anis_star_05_10:
    speaker: "<Monologue>"
    en: Anis looks at the clock in the park.
    ko: 아니스는 공원에 걸린 시계를 바라보았다.
    ja: アニスは公園の時計を見上げた
  d_nikke_anis_star_05_11:
    speaker: anis_i
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_anis_star_05_12:
    speaker: anis_i
    en: They say time flies when you're having fun. Guess they're right.
    ko: 즐거운 시간은 후딱 지나간다더니, 진짜 그렇네.
    ja: 楽しい時間はあっという間って本当ね。
  d_nikke_anis_star_05_13:
    speaker: anis_i
    en: Looks like the day's almost over.
    ko: 이제 오늘도 얼마 안 남았어.
    ja: もう少しで今日が終わっちゃいそう。
  d_nikke_anis_star_05_14:
    speaker: "<Self>"
    en: You happy with it?
    ko: 만족했어?
    ja: 満足できたか？
  d_nikke_anis_star_05_15:
    speaker: anis_i
    en: With what?
    ko: 만족?
    ja: 満足？
  d_nikke_anis_star_05_16:
    speaker: "<Self>"
    en: I mean, did you enjoy today's date?
    ko: 오늘 데이트는 만족했냐는 거지.
    ja: 今日のデートのことだ
  d_nikke_anis_star_05_17:
    speaker: anis_i
    en: Hmm...?
    ko: 만족이라….
    ja: 満足、か…
  d_nikke_anis_star_05_18:
    speaker: anis_i
    en: "... Yeah, I guess I did. Thinking about it, today was really fun."
    ko: 오늘 있었던 일들을 생각해 보면 참 즐거웠지.
    ja: |-
      今日一日、振り返ってみると
      全部楽しかったわ。
  d_nikke_anis_star_05_19:
    speaker: anis_i
    en: You looked kinda cute while you were asleep.
    ko: 지휘관님이 자는 모습은 귀여웠고.
    ja: 指揮官様のかわいい寝顔が見られたし…
  d_nikke_anis_star_05_20:
    speaker: anis_i
    en: Everything we ate was great.
    ko: 같이 먹었던 음식은 전부 맛있었고.
    ja: 一緒に食べたものは全部おいしかったし…
  d_nikke_anis_star_05_21:
    speaker: anis_i
    en: And when I got nervous, you held my hand. That really got to me.
    ko: 긴장했을 때 지휘관님이 손을 잡아 줬던 건 설렜고.
    ja: 手を握ってくれた時はドキドキしたし…
  d_nikke_anis_star_05_22:
    speaker: anis_i
    en: When I realized you remembered everything about us... Yeah, that meant a lot.
    ko: 나랑 있었던 일은 전부 기억한다는 걸 알았을 땐 감동했어.
    ja: |-
      私といる時のことを
      全部覚えててくれたって
      分かった時は感動しちゃったし。
  d_nikke_anis_star_05_23:
    speaker: anis_i
    en: You teasing me was a little embarrassing, not gonna lie.
    ko: 날 놀렸을 때는 조금 당황하기도 했지만,
    ja: からかわれた時に反応に困ったりはしたけど。
  d_nikke_anis_star_05_24:
    speaker: anis_i
    en: But even counting that, I had a really good time.
    ko: 그것도 다 포함해서 즐거웠지.
    ja: そういうことも含めて全部楽しめたわ。
  d_nikke_anis_star_05_25:
    speaker: "<Self>"
    en: I'm glad you enjoyed it.
    ko: 즐거웠다니 다행이야.
    ja: 楽しめたならよかった
  d_nikke_anis_star_05_26:
    speaker: anis_i
    en: Funny how everything changes when you start seeing things differently.
    ko: 보는 눈이 바뀌니까, 이렇게나 즐거울 수 있네.
    ja: 見る目が変わると、こんなに楽しくなるのね。
  d_nikke_anis_star_05_27:
    speaker: anis_i
    en: All the places we went today... We've already been to them together, right?
    ko: 오늘 갔던 곳들 전부, 이미 지휘관님이랑 둘러봤던 곳이잖아?
    ja: |-
      今日行った場所って、ほとんど指揮官様と
      行ったことのある場所ばっかりだったでしょ？
  d_nikke_anis_star_05_28:
    speaker: anis_i
    en: But somehow, it feels completely different this time.
    ko: 그런데 그때랑은 느낌이 전혀 달라.
    ja: でも、あの時と全然違ったの。
  d_nikke_anis_star_05_29:
    speaker: anis_i
    en: Today... I really had fun.
    ko: 오늘은… 진짜 즐거웠어.
    ja: 今日は…本当に楽しかった。
  d_nikke_anis_star_05_30:
    speaker: anis_i
    en: Heh, if I'd known the Ark was like this, I wouldn't have spent so long hating
      it.
    ko: 아~ 방주가 이렇게 즐거운 곳인 줄 알았으면, 진작에 사랑해 줄 걸.
    ja: |-
      あーあ…アークがこんなに
      楽しい場所だって知ってれば、
      もっと前から好きになってたのになぁ。
  d_nikke_anis_star_05_31:
    speaker: "<Monologue>"
    en: Anis lifts her head and looks up at the Dome of Eternity.
    ko: 아니스는 고개를 들어 이터널 스카이를 바라보았다.
    ja: アニスが顔を上げ、エターナルスカイを見つめた
  d_nikke_anis_star_05_32:
    speaker: anis_i
    en: "... Thank you, Commander,"
    ko: "…고마워, 지휘관님."
    ja: "…ありがとう、指揮官様。"
  d_nikke_anis_star_05_33:
    speaker: anis_i
    en: for making me feel happy.
    ko: 내가 즐겁다고 느낄 수 있게 해 줘서.
    ja: 私に楽しいって思わせてくれて。
  d_nikke_anis_star_05_34:
    speaker: "<Self>"
    en: I didn't really do anything...
    ko: 내가 뭘 했다고….
    ja: 私は別に何も…
  d_nikke_anis_star_05_35:
    speaker: anis_i
    en: Oh, you definitely did. You're the reason I came to love the Ark.
    ko: 뭘 했긴. 내가 방주를 사랑할 수 있게 해줬지.
    ja: |-
      ううん。私がアークを
      好きになれるようにしてくれたの。
  d_nikke_anis_star_05_36:
    speaker: anis_i
    en: That's why I'm having such a good time today.
    ko: 그러니까 지금 이렇게 즐거운 거고.
    ja: おかげ様で、今はこんなに楽しいわ。
  d_nikke_anis_star_05_37:
    speaker: "<Self>"
    en: That wasn't me.
    ko: 내가 해준 게 아니야.
    ja: それは私が何かしたからではない
  d_nikke_anis_star_05_38:
    speaker: "<Self>"
    en: This is all you, Anis.
    ko: 아니스가 스스로 그렇게 된 거지.
    ja: アニスが自分で変わったんだ
  d_nikke_anis_star_05_39:
    speaker: "<Monologue>"
    en: Anis shakes her head.
    ko: 아니스는 고개를 저었다.
    ja: アニスは首を横に振った
  d_nikke_anis_star_05_40:
    speaker: anis_i
    en: It took a lot... a lot of things, a lot of people, before I really started
      to care about the Ark.
    ko: 방주를 사랑하게 되기까지, 뭐… 많은 일이 있었고 많은 사람들이 있었는데.
    ja: |-
      アークを好きでいられるようになるまで、
      んー…いろんなことがあったり、
      いろんな人に会ったりしたけど…
  d_nikke_anis_star_05_41:
    speaker: anis_i
    en: But it all started with you, Commander.
    ko: 그 시작은 지휘관님이었어.
    ja: その始まりは指揮官様だったの。
  d_nikke_anis_star_05_42:
    speaker: anis_i
    en: You're kind to everyone, whether they're human or Nikke.
    ko: 지휘관님은 사람이든, 니케든 상관없이 누구에게나 상냥하니까.
    ja: |-
      指揮官様って人間でもニケでも、
      誰にでも優しくするでしょ。
  d_nikke_anis_star_05_43:
    speaker: anis_i
    en: Honestly, that worried me at first.
    ko: 그래서 솔직히 처음엔 좀 걱정했거든.
    ja: 正直、最初はちょっと心配してたのよ。
  d_nikke_anis_star_05_44:
    speaker: anis_i
    en: If you treat everyone like that, aren't you gonna get hurt or betrayed someday?
    ko: 누구한테나 그렇게 상냥하게 굴면, 언젠가 크게 다치지 않을까? 배신당하지는 않을까?
    ja: |-
      そんなことしてたら、
      いつか大ケガするんじゃない？
      ひどい裏切りに遭うんじゃない？って。
  d_nikke_anis_star_05_45:
    speaker: "<Monologue>"
    en: Anis looks at me and smiles.
    ko: 아니스가 나를 바라보며 미소 지었다.
    ja: アニスが私に向き直り、微笑んだ
  d_nikke_anis_star_05_46:
    speaker: anis_i
    en: But I was wrong.
    ko: 근데 그렇지 않더라고.
    ja: でも、そうならなかったから。
  d_nikke_anis_star_05_47:
    speaker: anis_i
    en: No matter how many times you got hurt or knocked down, you always got back
      up.
    ko: 몇 번을 상처 입고 넘어져도, 다시 일어나는 사람이더라.
    ja: 何回傷ついても立ち上がって。
  d_nikke_anis_star_05_48:
    speaker: anis_i
    en: Watching you made me start seeing the brighter side.
    ko: 그 모습을 보다 보니, 나도 모르게 밝은 쪽을 보게 됐어.
    ja: |-
      そういうところを見てたら、
      私もいつの間にか
      明るい方を見るようになってた。
  d_nikke_anis_star_05_49:
    speaker: anis_i
    en: So yeah, Commander, you're the star I found in all that mess.
    ko: 그러니까 지휘관님은 내가 진흙 속에서 찾은 별이야.
    ja: |-
      だから指揮官様は、
      私が泥沼の中で見つけた星ってところね。
  d_nikke_anis_star_05_50:
    speaker: anis_i
    en: "... The one I love most."
    ko: "…내가 가장 사랑하는 별."
    ja: "…私にとって、一番大事な星。"
  d_nikke_anis_star_05_51:
    speaker: "<Self>"
    en: Wouldn't that mean I've become the star of the Ark's star?
    ko: 과분한 영광이네.
    ja: 身に余る光栄だな
  d_nikke_anis_star_05_52:
    speaker: "<Self>"
    en: That's more than I deserve.
    ko: 방주의 별의 별이 된 거잖아.
    ja: アークの星の星になれたというわけか
  d_nikke_anis_star_05_53:
    speaker: anis_i
    en: Trust me, Commander,
    ko: "…전혀 과분하지 않아."
    ja: "…身に余るなんて、そんなことないわ。"
  d_nikke_anis_star_05_54:
    speaker: anis_i
    en: you deserve it.
    ko: 지휘관님에게는.
    ja: 指揮官様だもん。
  d_nikke_anis_star_05_55:
    speaker: "<Monologue>"
    en: Anis looks up at the sky.
    ko: 아니스의 시선이 하늘로 향했다.
    ja: アニスが空に視線を向けた
  d_nikke_anis_star_05_56:
    speaker: anis_i
    en: Hey, Commander...
    ko: 있잖아, 지휘관님.
    ja: ねぇ、指揮官様。
  d_nikke_anis_star_05_57:
    speaker: "<Self>"
    en: Yeah?
    ko: 응.
    ja: なんだ？
  d_nikke_anis_star_05_58:
    speaker: anis_i
    en: There's still so much I want to do, you know?
    ko: 나 아직 하고 싶은 게 잔뜩 남아있거든?
    ja: |-
      私、まだまだやりたいことが
      山ほど残ってるのよね。
  d_nikke_anis_star_05_59:
    speaker: anis_i
    en: We can't possibly get through it all today,
    ko: 아무리 그래도 오늘 다 할 수는 없겠지만.
    ja: さすがに今日中に全部はムリだけど。
  d_nikke_anis_star_05_60:
    speaker: anis_i
    en: but someday, I'm going to do it all and enjoy every bit of it.
    ko: 언젠가 전부 다 할 거고, 전부 다 즐길 거야.
    ja: |-
      でもいつか全部やってみせるし、
      何もかも楽しんでやるわ。
  d_nikke_anis_star_05_61:
    speaker: anis_i
    en: And if you're there with me when that happens...
    ko: 만약 그럴 때마다 지휘관님이 내 옆에 있어 준다면….
    ja: |-
      もしその時、いつも指揮官様が
      そばにいてくれたら…
  d_nikke_anis_star_05_62:
    speaker: anis_i
    en: I think I'd be really happy.
    ko: 그땐 행복할 것 같아.
    ja: 私、きっと幸せだと思う。
  d_nikke_anis_star_05_63:
    speaker: anis_i
    en: So if I'm smiling like that, I want you smiling too, Commander.
    ko: 그리고 내가 행복해서 웃는 만큼, 지휘관님도 웃어줬으면 좋겠어.
    ja: |-
      それで私が幸せなぶん、
      指揮官様にも笑っててほしいかな。
  d_nikke_anis_star_05_64:
    speaker: "<Monologue>"
    en: Anis scratches her cheek, looking a little embarrassed.
    ko: 아니스가 멋쩍게 뺨을 긁었다.
    ja: アニスの指が照れくさそうに頬をかいた
  d_nikke_anis_star_05_65:
    speaker: anis_i
    en: Haha...
    ko: 아하하….
    ja: あはは…
  d_nikke_anis_star_05_66:
    speaker: anis_i
    en: Wow, that got serious fast.
    ko: 나답지 않게 너무 진지했나.
    ja: こんなマジメな話、私らしくないわね。
  d_nikke_anis_star_05_67:
    speaker: anis_i
    en: My bad, my bad,
    ko: 미안, 미안.
    ja: ごめん、ごめん。
  d_nikke_anis_star_05_68:
    speaker: anis_i
    en: just forget I said anything, okay?
    ko: 적당히 흘려들어.
    ja: テキトーに聞き流しといて。
  d_nikke_anis_star_05_69:
    speaker: "<Self>"
    en: Hmm, I'm not sure I can do that.
    ko: 아니, 그건 좀 어려울 것 같은데.
    ja: いや、それは難しいな
  d_nikke_anis_star_05_70:
    speaker: anis_i
    en: "...?"
    ko: "…??"
    ja: "…？？"
  d_nikke_anis_star_05_71:
    speaker: "<Monologue>"
    en: I take both of Anis's hands
    ko: 나는 아니스의 양손을 마주 잡았고.
    ja: 私はアニスの両手を取り…
  d_nikke_anis_star_05_72:
    speaker: "<Monologue>"
    en: and pull her in close.
    ko: 품에 안을 수 있을 만큼 끌어당겼다.
    ja: 抱きしめられそうなほど近くに引き寄せた
  d_nikke_anis_star_05_73:
    speaker: "<Self>"
    en: I want you to be happy too, Anis.
    ko: 나도 아니스가 행복했으면 좋겠어.
    ja: 私もアニスには幸せでいてほしい
  d_nikke_anis_star_05_74:
    speaker: "<Self>"
    en: So I'll always be by your side with a smile.
    ko: 그러니까 늘 웃는 모습으로 옆에 있을 거야.
    ja: だから、いつも笑顔でそばにいよう
  d_nikke_anis_star_05_75:
    speaker: anis_i
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_anis_star_05_76:
    speaker: anis_i
    en: Wow...
    ko: 진짜….
    ja: もう…
  d_nikke_anis_star_05_77:
    speaker: anis_i
    en: You've been spoiling me all day.
    ko: 오늘은 지휘관님한테 계속 뭘 받기만 하네.
    ja: 今日は指揮官様にもらってばっかりね。
  d_nikke_anis_star_05_78:
    speaker: "<Self>"
    en: You did say you wanted a present, right?
    ko: 아니스가 선물을 달라고 했으니까.
    ja: プレゼントが欲しいと言っていただろう
  d_nikke_anis_star_05_79:
    speaker: anis_i
    en: That was just an excuse for a date.
    ko: 그건 그냥 데이트할 핑계지.
    ja: そんなのただの口実だったし…
  d_nikke_anis_star_05_80:
    speaker: anis_i
    en: Didn't think I'd be the one getting spoiled...
    ko: 정말로 이렇게 받기만 할 줄 누가 알았나….
    ja: |-
      本当にこんなにもらえるなんて
      思ってなかったから…
  d_nikke_anis_star_05_81:
    speaker: "<Self>"
    en: Oh right, we left the T.T. STAR merch at the store.
    ko: 그러고 보니 T.T. STAR 굿즈는 가게에 두고 왔네.
    ja: |-
      そういえばT.T. STARのグッズ、
      店に置いてきてしまったな
  d_nikke_anis_star_05_82:
    speaker: anis_i
    en: It's fine.
    ko: 괜찮아.
    ja: 気にしないで。
  d_nikke_anis_star_05_83:
    speaker: "<Monologue>"
    en: Anis buries her face in my chest.
    ko: 아니스가 내 가슴에 얼굴을 묻었다.
    ja: アニスが私の胸に顔をうずめた
  d_nikke_anis_star_05_84:
    speaker: "<Monologue>"
    en: Her arms are wrapped tightly around my waist, as though she has no intention
      of letting go.
    ko: 그리고 허리를 감싸 안은 팔은, 쉽게 풀리지 않을 것 같았다.
    ja: |-
      腰に回った手が、
      そう簡単には放してくれそうにない
  d_nikke_anis_star_05_85:
    speaker: anis_i
    en: I ended up getting something even better.
    ko: 대신 더 큰 선물을 받았잖아.
    ja: 代わりにもっといいものをもらったから。
  d_nikke_anis_star_05_86:
    speaker: "<Self>"
    en: So, did you enjoy it in the end?
    ko: 그래서 만족했냐는 질문에 대한 대답은?
    ja: それで、結局満足はできたのか？
  d_nikke_anis_star_05_87:
    speaker: anis_i
    en: Oh, that?
    ko: 아, 그거 말이지.
    ja: ああ、そういう質問だったわね。
  d_nikke_anis_star_05_88:
    speaker: anis_i
    en: Not even close.
    ko: 전~혀 만족 못 해.
    ja: ぜ～んぜん。
  d_nikke_anis_star_05_89:
    speaker: anis_i
    en: If I enjoyed it, that means it's over, right?
    ko: 만족했다는 건, 더 안 해도 된다는 뜻이잖아?
    ja: |-
      満足したってことは、
      これ以上いらないってことでしょ？
  d_nikke_anis_star_05_90:
    speaker: anis_i
    en: But I'm having way too much fun to stop now.
    ko: 이렇게나 즐겁고 행복한데, 어떻게 만족하고 끝내겠어.
    ja: |-
      こんなに楽しくて幸せなこと、
      どれだけあったって足りないもの。
  d_nikke_anis_star_05_91:
    speaker: "<Self>"
    en: Wow, someone's greedy.
    ko: 욕심쟁이네.
    ja: 欲張りだな
  d_nikke_anis_star_05_92:
    speaker: anis_i
    en: Yep, I'm actually pretty greedy.
    ko: 맞아. 나 사실 엄청 욕심 많은 여자거든.
    ja: そうよ？私、とっても欲張りなの。
  d_nikke_anis_star_05_93:
    speaker: "<Self>"
    en: Well then, don't hold back.
    ko: 욕심쟁이니까,
    ja: それなら、欲張りらしく…
  d_nikke_anis_star_05_94:
    speaker: "<Self>"
    en: Be greedy and make me happy too.
    ko: 마음껏 욕심부려서 나도 행복하게 해 줘.
    ja: |-
      思う存分ワガママを言って、
      私を幸せにしてくれ
  d_nikke_anis_star_05_95:
    speaker: anis_i
    en: "... Okay!"
    ko: "…응!"
    ja: "…うん！"
  d_nikke_anis_star_05_96:
    speaker: anis_i
    en: I've still got the rest of the day, so I'm going all in till the very end.
    ko: 그럼 아직 내가 받은 하루는 남아있으니까, 마지막까지 제대로 욕심부려야겠네.
    ja: |-
      貸し切った1日はまだ残ってるし、
      徹底的に欲張っておかないとね。
  d_nikke_anis_star_05_97:
    speaker: anis_i
    en: The more I indulge myself, the happier I'll get and the harder I'll fall...
    ko: 내가 욕심내서 즐기고 행복해진 만큼, 점점 더 사랑하게 될 테니까.
    ja: |-
      思い通りに楽しんで幸せになったぶん、
      もっと好きになれるはずだから。
  d_nikke_anis_star_05_98:
    speaker: "<Self>"
    en: For the Ark?
    ko: 방주를?
    ja: アークを？
  d_nikke_anis_star_05_99:
    speaker: anis_i
    en: Yeah, the Ark as well!
    ko: 아니, 방주도!
    ja: ううん、アークも！
