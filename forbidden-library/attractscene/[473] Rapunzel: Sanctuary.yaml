---
d_nikke_rapunzel_sanctuary_01:
  d_nikke_rapunzel_sanctuary_01_1:
    speaker: redshoes
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_2:
    speaker: redshoes
    en: I'm begging you, please spare me.
    ko: 살려줘요. 부탁이에요.
    ja: 助けてください。お願いです。
  d_nikke_rapunzel_sanctuary_01_3:
    speaker: rapunzel_s
    en: No.
    ko: 싫어요.
    ja: お断りします。
  d_nikke_rapunzel_sanctuary_01_4:
    speaker: rapunzel_s
    en: I cannot forgive you.
    ko: 저는 당신을 용서할 수 없어요.
    ja: 私にはあなたを赦すことができません。
  d_nikke_rapunzel_sanctuary_01_5:
    speaker: "<Narration>"
    en: "*Click, hiss...*"
    ko: 달칵- 푸쉬이-
    ja: カチャッ、プシュー…
  d_nikke_rapunzel_sanctuary_01_6:
    speaker: cecil
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_rapunzel_sanctuary_01_7:
    speaker: "<Narration>"
    en: The wait is over.
    ko: 기다림의 끝.
    ja: 待ちわびた、その日
  d_nikke_rapunzel_sanctuary_01_8:
    speaker: "<Narration>"
    en: The body maker opens.
    ko: 바디 메이커가 열리고.
    ja: ボディ製造装置が開き…
  d_nikke_rapunzel_sanctuary_01_9:
    speaker: "<Narration>"
    en: A soft golden light spills into the room, enveloping everything in its gentle
      glow.
    ko: 은은한 황금빛이 방 안을 감싸안듯 퍼진다.
    ja: |-
      黄金色のほのかな光が、
      部屋を包み込むように広がった
  d_nikke_rapunzel_sanctuary_01_10:
    speaker: cecil
    en: This is...
    ko: 이건….
    ja: これは…
  d_nikke_rapunzel_sanctuary_01_11:
    speaker: "<Narration>"
    en: Out of the golden light steps
    ko: 황금빛 안에서 걸어 나온 건.
    ja: 黄金色の光の中から現れたのは
  d_nikke_rapunzel_sanctuary_01_12:
    speaker: "<Narration>"
    en: a saintess with a benevolent smile.
    ko: 자애로운 미소를 띤 성녀.
    ja: 慈愛に満ちた微笑みを浮かべた聖女だった
  d_nikke_rapunzel_sanctuary_01_13:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_14:
    speaker: "<Narration>"
    en: Rapunzel slowly straightens up.
    ko: 라푼젤이 천천히 몸을 일으킨다.
    ja: ラプンツェルがゆっくりと体を起こす
  d_nikke_rapunzel_sanctuary_01_15:
    speaker: cecil
    en: It's been a while, Rapunzel.
    ko: 오랜만이네요.
    ja: 久しぶりですね。
  d_nikke_rapunzel_sanctuary_01_16:
    speaker: cecil
    en: Welcome back.
    ko: 돌아온 걸 환영해요. 라푼젤.
    ja: おかえりなさい、ラプンツェル。
  d_nikke_rapunzel_sanctuary_01_17:
    speaker: cecil
    en: Congratulations on becoming
    ko: 축하드려요.
    ja: おめでとうございます。
  d_nikke_rapunzel_sanctuary_01_18:
    speaker: cecil
    en: the first Nikke to be rolled out in Eden.
    ko: 에덴에서 롤아웃 된 첫 번째 니케가 되셨네요.
    ja: |-
      あなたがエデンでロールアウトされた
      最初のニケです。
  d_nikke_rapunzel_sanctuary_01_19:
    speaker: cecil
    en: How does it feel?
    ko: 기분이 어떠신가요?
    ja: 気分はどうですか？
  d_nikke_rapunzel_sanctuary_01_20:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_21:
    speaker: cecil
    en: You must be disoriented.
    ko: 아, 정신이 없으시겠군요.
    ja: あぁ、まだ混乱しているようですね。
  d_nikke_rapunzel_sanctuary_01_22:
    speaker: cecil
    en: It's your first time receiving a new body, after all.
    ko: 새로운 바디를 얻으신 건 처음이실 테니.
    ja: |-
      新しいボディになったのは、
      初めてでしょうから。
  d_nikke_rapunzel_sanctuary_01_23:
    speaker: cecil
    en: I'll need your cooperation.
    ko: 협조를 좀 부탁드려도 될까요?
    ja: 少々ご協力いただけますか？
  d_nikke_rapunzel_sanctuary_01_24:
    speaker: cecil
    en: We require the data on our end as well.
    ko: 저희 측에서도 데이터가 필요한 상황이거든요.
    ja: こちらでもデータを収集しておきたいので。
  d_nikke_rapunzel_sanctuary_01_25:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_26:
    speaker: cecil
    en: Please stand and walk slowly.
    ko: 일어서서 천천히 걸어보시겠어요?
    ja: 立って、ゆっくり歩いてみてください。
  d_nikke_rapunzel_sanctuary_01_27:
    speaker: cecil
    en: How responsive is the body?
    ko: 바디의 감도는 어떠신가요?
    ja: 感度はどうですか？
  d_nikke_rapunzel_sanctuary_01_28:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_29:
    speaker: cecil
    en: "... Rapunzel?"
    ko: "…라푼젤?"
    ja: "…ラプンツェル？"
  d_nikke_rapunzel_sanctuary_01_30:
    speaker: cecil
    en: That's strange. There shouldn't be anything wrong with your speech functions.
    ko: 이상하네요. 언어 기능에는 분명 문제가 없을 텐데.
    ja: |-
      おかしいですね。
      言語機能に問題はないはずですが…
  d_nikke_rapunzel_sanctuary_01_31:
    speaker: cecil
    en: Well, all right,
    ko: 뭐, 좋아요.
    ja: まあ、いいでしょう。
  d_nikke_rapunzel_sanctuary_01_32:
    speaker: cecil
    en: we'll check the rest as we go.
    ko: 차차 확인해 보는 거로 하죠.
    ja: 追々確認しましょうか。
  d_nikke_rapunzel_sanctuary_01_33:
    speaker: cecil
    en: For now, let's take a closer look at this part—
    ko: 일단 이 부분에 대해 좀 더-
    ja: まずは、このパーツについてもう少し――
  d_nikke_rapunzel_sanctuary_01_34:
    speaker: rapunzel_s
    en: "... derful."
    ko: "…륭해요."
    ja: "…ばらしいです。"
  d_nikke_rapunzel_sanctuary_01_35:
    speaker: cecil
    en: Sorry?
    ko: 네?
    ja: はい？
  d_nikke_rapunzel_sanctuary_01_36:
    speaker: rapunzel_s
    en: Th-this... this sensitivity is wonderful!
    ko: 후, 훌륭, 훌륭한 감도예요…!
    ja: す、すばら、素晴らしいです…！
  d_nikke_rapunzel_sanctuary_01_37:
    speaker: rapunzel_s
    en: M-my previous body could never have been this sensitive...!
    ko: 이, 이전의 몸이라면 상상도 하지 못할 정도로 감도가 올라갔달까요…?
    ja: |-
      い、以前のボディとは比べものにならないほど
      感度が上がったと言いましょうか…
  d_nikke_rapunzel_sanctuary_01_38:
    speaker: rapunzel_s
    en: "*Pant, pant*"
    ko: 하악 하악!
    ja: はあ、はあ！
  d_nikke_rapunzel_sanctuary_01_39:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_40:
    speaker: cecil
    en: From what you've said, there appears to be no cause for concern.
    ko: 말하시는 걸 보니, 걱정할 필요는 없어 보이는군요.
    ja: その様子なら、心配の必要はなさそうですね。
  d_nikke_rapunzel_sanctuary_01_41:
    speaker: rapunzel_s
    en: Yes, of course.
    ko: 네, 물론이죠.
    ja: ええ、もちろんです。
  d_nikke_rapunzel_sanctuary_01_42:
    speaker: rapunzel_s
    en: As you can see, I'm feeling more vigorous than ever.
    ko: 보다시피 저는 어느 때보다 왕성한 상태랍니다.
    ja: |-
      ご覧の通り、私はいつにも増して
      血気盛んな状態です。
  d_nikke_rapunzel_sanctuary_01_43:
    speaker: cecil
    en: That's good to hear.
    ko: 듣던 중 다행이네요.
    ja: それを聞いて安心しました。
  d_nikke_rapunzel_sanctuary_01_44:
    speaker: cecil
    en: Transplanting Red Shoes's parts was a gamble on our end, too.
    ko: 레드 슈즈를 이식하는 건 저희 쪽에서도 모험이었으니까요.
    ja: |-
      赤い靴を移植するのは、
      こちらとしても冒険でしたから。
  d_nikke_rapunzel_sanctuary_01_45:
    speaker: rapunzel_s
    en: Oh, now that you mention it, the parts...
    ko: 아, 그러고 보니 파츠들이….
    ja: ああ、そういえばパーツが…
  d_nikke_rapunzel_sanctuary_01_46:
    speaker: cecil
    en: Yes, a significant portion of your body consists of parts from Red Shoes.
    ko: 네, 당신을 구성하는 파츠의 상당수가 레드 슈즈로 이루어져 있어요.
    ja: |-
      はい、あなたを構成するパーツのほとんどが
      レッドシューズのものでできています。
  d_nikke_rapunzel_sanctuary_01_47:
    speaker: cecil
    en: I'll explain the details as we conduct the tests.
    ko: 자세한 내용은 테스트를 하며 말씀드리죠.
    ja: 詳細はテストをしながらお話ししますね。
  d_nikke_rapunzel_sanctuary_01_48:
    speaker: rapunzel_s
    en: Tests...?
    ko: 테스트…?
    ja: テスト…？
  d_nikke_rapunzel_sanctuary_01_49:
    speaker: cecil
    en: There's no need to make that face.
    ko: 그런 표정 지으실 필요 없어요.
    ja: そのような顔をする必要はありません。
  d_nikke_rapunzel_sanctuary_01_50:
    speaker: cecil
    en: It's only a simple performance test.
    ko: 단순 성능 테스트일 뿐이니까요.
    ja: 簡単な性能テストですから。
  d_nikke_rapunzel_sanctuary_01_51:
    speaker: cecil
    en: Follow me when you're ready.
    ko: 준비가 되면 따라와 주세요.
    ja: 準備ができたら、ついてきてください。
  d_nikke_rapunzel_sanctuary_01_52:
    speaker: "<Narration>"
    en: Cecil leaves the laboratory.
    ko: 세실은 연구실을 나갔다.
    ja: セシルは研究室を出て行った
  d_nikke_rapunzel_sanctuary_01_53:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_01_54:
    speaker: "<Narration>"
    en: Left alone, Rapunzel closes her hand around the faintly glowing rosary.
    ko: 혼자 남은 라푼젤은 은은하게 빛나고 있는 로사리오를 감싸 쥐었다.
    ja: |-
      一人残されたラプンツェルは、
      ほのかに光っているロザリオを握りしめた
  d_nikke_rapunzel_sanctuary_01_55:
    speaker: rapunzel_s
    en: Thank you, sisters,
    ko: 고마워요. 자매님들.
    ja: ありがとうございます、姉妹のみなさん。
  d_nikke_rapunzel_sanctuary_01_56:
    speaker: rapunzel_s
    en: for lending me your strength...
    ko: 자매님들의 힘.
    ja: みなさんのお力は…
  d_nikke_rapunzel_sanctuary_01_57:
    speaker: rapunzel_s
    en: I'll be sure to put it to good use.
    ko: 이로운 곳에 사용하도록 할게요.
    ja: 決して無駄にはいたしません。
d_nikke_rapunzel_sanctuary_02:
  d_nikke_rapunzel_sanctuary_02_1:
    speaker: cecil
    en: First of all, your overall specs have improved considerably.
    ko: 우선, 전체적인 스펙은 상당히 상승했어요.
    ja: |-
      まず、全体的なスペックは
      かなり向上しています。
  d_nikke_rapunzel_sanctuary_02_2:
    speaker: cecil
    en: More importantly,
    ko: 무엇보다 유의미한 것이라면.
    ja: 何より大きいのは、
  d_nikke_rapunzel_sanctuary_02_3:
    speaker: cecil
    en: transplanting Red Shoes's parts has addressed your previous weaknesses.
    ko: 레드 슈즈를 이식해 기존의 단점까지 커버된 상태죠.
    ja: |-
      赤い靴を移植したことで、
      これまでの弱点を
      カバーできたことですね。
  d_nikke_rapunzel_sanctuary_02_4:
    speaker: johan
    en: I hear you've been dissatisfied with your mobility for some time.
    ko: 전부터 기동력에 대한 아쉬움이 있었다고 들었다.
    ja: |-
      以前から、機動力に物足りなさを
      感じていると聞いていた。
  d_nikke_rapunzel_sanctuary_02_5:
    speaker: johan
    en: Now you'll be able to reach wherever you're needed quickly.
    ko: 네가 필요한 곳, 어디로든 빠르게 갈 수 있겠지.
    ja: |-
      これならお前が必要とされる場所へ
      すぐに向かうことができるだろう。
  d_nikke_rapunzel_sanctuary_02_6:
    speaker: rapunzel_s
    en: I can get there... quickly?
    ko: 빠르게 간다고요…?
    ja: すぐに…イケる、ということですか…？
  d_nikke_rapunzel_sanctuary_02_7:
    speaker: johan
    en: "... That's right."
    ko: "…그렇다."
    ja: "…そうだ。"
  d_nikke_rapunzel_sanctuary_02_8:
    speaker: johan
    en: If Cecil's design holds, your mobility should have increased dramatically.
    ko: 세실의 설계대로라면 기동력이 압도적으로 상승했을 거다.
    ja: |-
      セシルの設計通りなら、
      機動力は飛躍的に向上しているはずだ。
  d_nikke_rapunzel_sanctuary_02_9:
    speaker: johan
    en: Moving freely across the battlefield to heal and provide support
    ko: 전장 곳곳을 누비며 치료와 보조를 하는 것.
    ja: 戦場を駆け巡り、治療と支援を行う。
  d_nikke_rapunzel_sanctuary_02_10:
    speaker: johan
    en: is no longer a pipe dream.
    ko: 그것도 이제 꿈은 아니다.
    ja: それも、もはや夢ではない。
  d_nikke_rapunzel_sanctuary_02_11:
    speaker: johan
    en: Tactically, you'd be an invaluable asset—
    ko: 전술적으로 아주 유용하게-
    ja: 戦術的に非常に有用な――
  d_nikke_rapunzel_sanctuary_02_12:
    speaker: rapunzel_s
    en: Wh-what on earth have you done to my body? Y-you mean I can go that fast...?!
    ko: 제, 제 몸에 대체 무슨 짓을 하신 건가요? 빠, 빠르게 간다니…!
    ja: |-
      わ、私の体にいったい何をしたんですか！？
      す、すぐにイケるだなんて…！
  d_nikke_rapunzel_sanctuary_02_13:
    speaker: rapunzel_s
    en: I-I may have to see Eden in a new light. To think you were so well-versed
      in this sort of thing...
    ko: 에, 에덴을 다시 봐야겠네요. 이런 쪽에도 일가견이 있었을 줄은….
    ja: |-
      エ、エデンに対する認識を
      改めないといけませんね。
      まさか、そちらにも造詣が深かったとは…
  d_nikke_rapunzel_sanctuary_02_14:
    speaker: johan
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_02_15:
    speaker: johan
    en: I only enhanced you.
    ko: 강화를 했을 뿐이다.
    ja: 強化しただけだ。
  d_nikke_rapunzel_sanctuary_02_16:
    speaker: johan
    en: Cecil, brief her on the armaments.
    ko: 세실, 무장에 대한 설명은 맡기도록 하지.
    ja: セシル、武装についての説明は任せる。
  d_nikke_rapunzel_sanctuary_02_17:
    speaker: johan
    en: I'll review the test results afterward via video.
    ko: 테스트 결과는 이후, 영상으로 확인하도록 하겠다.
    ja: テスト結果は後ほど映像で確認しておこう。
  d_nikke_rapunzel_sanctuary_02_18:
    speaker: cecil
    en: Yes, if that's what you prefer.
    ko: 네, 편하실 대로요.
    ja: ええ、お好きなように。
  d_nikke_rapunzel_sanctuary_02_19:
    speaker: "<Narration>"
    en: Johan shakes his head and leaves the room.
    ko: 요한은 고개를 내저으며 방을 나갔다.
    ja: |-
      ヨハンは、あきれたように首を横に振り、
      部屋を出ていった
  d_nikke_rapunzel_sanctuary_02_20:
    speaker: cecil
    en: All right, then. Shall we head inside?
    ko: 자, 좋아요. 그럼 들어가 보시겠어요?
    ja: さあ、どうぞ。入ってください。
  d_nikke_rapunzel_sanctuary_02_21:
    speaker: rapunzel_s
    en: Where is this...?
    ko: 여긴…?
    ja: ここは…？
  d_nikke_rapunzel_sanctuary_02_22:
    speaker: cecil
    en: It's crude, but you may consider it a makeshift simulation room.
    ko: 조악하긴 하지만 간이 시뮬레이션 룸… 이라고 봐주시면 될 것 같네요.
    ja: |-
      簡単なものではありますが、
      シミュレーションルーム…
      と思っていただければいいかと。
  d_nikke_rapunzel_sanctuary_02_23:
    speaker: cecil
    en: I put it together to test everyone's performance.
    ko: 당신들의 성능 테스트를 위해 임시로 제작했어요.
    ja: |-
      あなたたちの性能をテストするために、
      臨時で用意しました。
  d_nikke_rapunzel_sanctuary_02_24:
    speaker: rapunzel_s
    en: Everyone, you say...?
    ko: 당신들… 이라고 하셨죠.
    ja: 今、「あなたたち」…とおっしゃいましたね。
  d_nikke_rapunzel_sanctuary_02_25:
    speaker: rapunzel_s
    en: Come to think of it, Sister Scarlet and Sister Noah...
    ko: 그러고 보니 홍련과 노아 자매님은….
    ja: そういえば、紅蓮とノアは…
  d_nikke_rapunzel_sanctuary_02_26:
    speaker: cecil
    en: Those two aren't ready yet.
    ko: 둘은 아직이에요.
    ja: お二人はまだです。
  d_nikke_rapunzel_sanctuary_02_27:
    speaker: cecil
    en: Scarlet is in the final stages of adjustment, so you'll be able to see her
      soon.
    ko: 홍련은 최종 조정 중이니 곧 볼 수 있겠네요.
    ja: |-
      紅蓮は最終調整中ですので、
      もうすぐ会えると思いますよ。
  d_nikke_rapunzel_sanctuary_02_28:
    speaker: rapunzel_s
    en: Oh... That's a relief, then.
    ko: 아… 그렇다면 다행이에요.
    ja: あぁ…それならよかったです。
  d_nikke_rapunzel_sanctuary_02_29:
    speaker: cecil
    en: Let's start by going over the armaments.
    ko: 우선 무장에 대한 설명부터 진행할게요.
    ja: まずは、武装についての説明から。
  d_nikke_rapunzel_sanctuary_02_30:
    speaker: cecil
    en: Take a good look at the staff.
    ko: 지팡이를 잘 봐주세요.
    ja: 杖をよく見てください。
  d_nikke_rapunzel_sanctuary_02_31:
    speaker: rapunzel_s
    en: Yes, you mean this staff here?
    ko: 네, 이 지팡이 말씀이시죠?
    ja: はい、この杖のことですね？
  d_nikke_rapunzel_sanctuary_02_32:
    speaker: "<Narration>"
    en: Rapunzel looks at the red parts attached to the staff.
    ko: 라푼젤은 지팡이에 달린 붉은 파츠를 바라본다.
    ja: |-
      ラプンツェルは杖に取り付けられた
      赤いパーツに目をやった
  d_nikke_rapunzel_sanctuary_02_33:
    speaker: cecil
    en: Yes, that's where we incorporated Red Shoes's parts.
    ko: 예. 그 부분이 레드 슈즈를 활용한 부분이에요.
    ja: |-
      はい、その部分にレッドシューズの武装を
      活用しました。
  d_nikke_rapunzel_sanctuary_02_34:
    speaker: cecil
    en: We also upgraded your armaments to match your body's improved specs.
    ko: 바디의 스펙이 오른 만큼 무장에도 신경을 썼죠.
    ja: |-
      ボディのスペックが上がった分、
      武装にもこだわったのですよ。
  d_nikke_rapunzel_sanctuary_02_35:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_02_36:
    speaker: cecil
    en: Let me explain how they work—
    ko: 기능에 관해 설명해 드리자면-
    ja: 機能については――
  d_nikke_rapunzel_sanctuary_02_37:
    speaker: rapunzel_s
    en: Hm?
    ko: 응?
    ja: あら？
  d_nikke_rapunzel_sanctuary_02_38:
    speaker: rapunzel_s
    en: There seems to be some kind of switch here...
    ko: 여기에 무슨 스위치 같은 게….
    ja: ここに何かスイッチが…
  d_nikke_rapunzel_sanctuary_02_39:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵-
    ja: カチッ――
  d_nikke_rapunzel_sanctuary_02_40:
    speaker: "<Narration>"
    en: A low hum reverberates through the room.
    ko: 웅웅웅웅--!
    ja: ヴヴヴヴ！
  d_nikke_rapunzel_sanctuary_02_41:
    speaker: rapunzel_s
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  d_nikke_rapunzel_sanctuary_02_42:
    speaker: rapunzel_s
    en: What's this... vibration?!
    ko: 뭔가요…! 이 진동은…?!
    ja: 何ですか…！？この振動は…！！
  d_nikke_rapunzel_sanctuary_02_43:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_02_44:
    speaker: cecil
    en: Try pushing the switch up a little further.
    ko: 스위치를 더 올려보시겠어요?
    ja: 目盛りをもう少し上げてみてください。
  d_nikke_rapunzel_sanctuary_02_45:
    speaker: rapunzel_s
    en: F-further...?
    ko: 오, 올려…?
    ja: あ、上げる、ですか…？
  d_nikke_rapunzel_sanctuary_02_46:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵-
    ja: カチッ――
  d_nikke_rapunzel_sanctuary_02_47:
    speaker: "<Narration>"
    en: The staff begins to vibrate violently,
    ko: 웅웅웅웅웅웅웅웅---!!
    ja: ヴヴヴヴヴヴヴヴ！！
  d_nikke_rapunzel_sanctuary_02_48:
    speaker: "<Narration>"
    en: its head blurring from the intensity.
    ko: 지팡이의 머리가 흐리게 보일 정도로 진동하고 있다.
    ja: |-
      杖の先端がぼやけて見えるほど、
      激しく振動している
  d_nikke_rapunzel_sanctuary_02_49:
    speaker: rapunzel_s
    en: "!!!!"
    ko: "!!!!"
    ja: "！！！！"
  d_nikke_rapunzel_sanctuary_02_50:
    speaker: rapunzel_s
    en: Wh-wh-what's this...?!
    ko: 뭐, 뭐 뭐 뭔가요…!
    ja: こ、こ、これは…！
  d_nikke_rapunzel_sanctuary_02_51:
    speaker: rapunzel_s
    en: T-to put such a magnificent—I mean, such a perverse function in here...!
    ko: 이, 이런 훌륭한- 아, 아니! 망측한 기능을 넣어놓으시다니…!
    ja: |-
      こ、こんな素晴らしい…い、いえ！
      ハレンチな機能を搭載するなんて…！
  d_nikke_rapunzel_sanctuary_02_52:
    speaker: cecil
    en: You could call it the Ultravibration Staff.
    ko: "[초진동 지팡이]라고 할 수 있겠네요."
    ja: "「超振動の杖」とでも呼びましょうか。"
  d_nikke_rapunzel_sanctuary_02_53:
    speaker: cecil
    en: It can produce vibrations at whatever intensity you desire.
    ko: 당신이 원하는 강도의 진동을 만들어 낼 수 있죠.
    ja: |-
      あなたが望む強さの振動を
      生みだすことができます。
  d_nikke_rapunzel_sanctuary_02_54:
    speaker: rapunzel_s
    en: I-I can't wait to try it out... Hah... Hah...
    ko: 빠, 빨리 시험해 보고 싶네요… 하악 하악!
    ja: は、早く試してみたいものです…はあ、はあ！
  d_nikke_rapunzel_sanctuary_02_55:
    speaker: rapunzel_s
    en: A-ah, no! I mean on the Raptures, of course! Please don't misunderstand. Hahaha...
    ko: |-
      아, 아니! 물론 랩쳐에게 시험해 보고 싶다는 뜻이었으니까,
      오해는 말아주세요. 아하하….
    ja: |-
      い、いえ！もちろんラプチャーに
      試してみたいという意味です。
      誤解しないでくださいね。ふふふ…
  d_nikke_rapunzel_sanctuary_02_56:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_02_57:
    speaker: cecil
    en: Beyond its raw destructive power, it has another crucial function.
    ko: 물리적인 파괴력은 물론, 다른 핵심적인 기능도 존재해요.
    ja: |-
      物理的な破壊力はもちろん、
      他にも核心となる効果があります。
  d_nikke_rapunzel_sanctuary_02_58:
    speaker: cecil
    en: It can disrupt the nanomachines' configuration and render them ineffective.
    ko: 나노 머신의 배열을 흩트려 무력화할 수 있어요.
    ja: |-
      ナノマシンの配列を乱し、
      無力化することが可能です。
  d_nikke_rapunzel_sanctuary_02_59:
    speaker: rapunzel_s
    en: Nanomachines...
    ko: 나노 머신….
    ja: ナノマシン…
  d_nikke_rapunzel_sanctuary_02_60:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_02_61:
    speaker: rapunzel_s
    en: So we're to face the Heretics.
    ko: 헬레틱을 상대해야 하는 거군요.
    ja: ヘレティックを相手にするということですね。
  d_nikke_rapunzel_sanctuary_02_62:
    speaker: cecil
    en: Yes, your guess is correct.
    ko: 네, 당신의 추측이 맞아요.
    ja: お察しの通りです。
  d_nikke_rapunzel_sanctuary_02_63:
    speaker: cecil
    en: A new Heretic has appeared.
    ko: 새로운 헬레틱이 나타났어요.
    ja: 新たなヘレティックが現れました。
  d_nikke_rapunzel_sanctuary_02_64:
    speaker: cecil
    en: That is precisely why we have little time to spare.
    ko: 사실 그 때문에 상황이 그리 여유롭진 않아요.
    ja: |-
      ですので、
      あまり悠長にしている時間はありません。
  d_nikke_rapunzel_sanctuary_02_65:
    speaker: cecil
    en: She has already left for the Lift to declare war.
    ko: |-
      현재 그 사람이 선전포고를 위해
      궤도 엘리베이터로 떠난 상황이죠.
    ja: |-
      現在、あの方が宣戦布告のため
      軌道エレベーターへ向かっているところです。
  d_nikke_rapunzel_sanctuary_02_66:
    speaker: rapunzel_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_rapunzel_sanctuary_02_67:
    speaker: rapunzel_s
    en: Then shouldn't we hurry over there?
    ko: 그럼 서둘러 가야 하는 것 아닌가요?
    ja: では、私も急いで向かうべきではありませんか？
  d_nikke_rapunzel_sanctuary_02_68:
    speaker: rapunzel_s
    en: We don't exactly have time to run any tests...
    ko: 테스트를 진행할 여유는….
    ja: テストを行っている余裕など…
  d_nikke_rapunzel_sanctuary_02_69:
    speaker: cecil
    en: What do you mean? We still need to finish the tests.
    ko: 무슨 소리인가요. 그래도 테스트는 마쳐야죠.
    ja: いいえ、テストは終わらせましょう。
  d_nikke_rapunzel_sanctuary_02_70:
    speaker: cecil
    en: Scarlet's body will be ready soon.
    ko: 곧 홍련의 바디 메이킹이 완료될 거예요.
    ja: まもなく紅蓮のボディが完成します。
  d_nikke_rapunzel_sanctuary_02_71:
    speaker: cecil
    en: We have some time before then.
    ko: 그 전까지 조금의 여유는 있으니까요.
    ja: それまでは、少し時間がありますから。
  d_nikke_rapunzel_sanctuary_02_72:
    speaker: cecil
    en: In the meantime, I'll make sure you can join them as soon as possible.
    ko: 대신 최대한 빨리 합류하실 수 있게 도와드릴게요.
    ja: |-
      その代わり、できるだけ早く
      合流できるようお手伝いします。
  d_nikke_rapunzel_sanctuary_02_73:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_02_74:
    speaker: rapunzel_s
    en: Yes... Thank you.
    ko: 예… 고마워요.
    ja: はい…ありがとうございます。
d_nikke_rapunzel_sanctuary_03:
  d_nikke_rapunzel_sanctuary_03_1:
    speaker: "<Narration>"
    en: As the simulation begins, Raptures come swarming in.
    ko: 시뮬레이션이 시작되자, 랩쳐들이 몰려온다.
    ja: |-
      シミュレーションが始まると、
      ラプチャーがラプンツェルに
      押し寄せた
  d_nikke_rapunzel_sanctuary_03_2:
    speaker: "<Narration>"
    en: At the same time, Cecil continues her explanation.
    ko: 그와 동시에 세실의 설명이 이어진다.
    ja: 同時に、セシルの説明が続く
  d_nikke_rapunzel_sanctuary_03_3:
    speaker: "<Narration>"
    en: The Queen, who stole Liliweiss's body...
    ko: 릴리바이스의 몸을 빼앗은 퀸.
    ja: リリーバイスのボディを奪ったクイーン
  d_nikke_rapunzel_sanctuary_03_4:
    speaker: "<Narration>"
    en: The appearance of a new Heretic...
    ko: 새로운 헬레틱의 등장.
    ja: 新たなヘレティックの登場
  d_nikke_rapunzel_sanctuary_03_5:
    speaker: rapunzel_s
    en: Hngh!
    ko: 흐읍--!
    ja: はぁっ！
  d_nikke_rapunzel_sanctuary_03_6:
    speaker: "<Narration>"
    en: "*Whoosh... Clang!*"
    ko: 후웅- 까앙--!!
    ja: ブンッ、カキィン――！！
  d_nikke_rapunzel_sanctuary_03_7:
    speaker: "<Narration>"
    en: And the fact that every one of them, in both appearance and ability,
    ko: 그리고 그들의 외형과 능력은 하나같이.
    ja: |-
      そして、それらの見た目や能力は
      どれもこれも…
  d_nikke_rapunzel_sanctuary_03_8:
    speaker: "<Narration>"
    en: bears a striking resemblance to the exalted Goddesses of Victory.
    ko: 지고한 승리의 여신들을 빼닮았다는 사실까지.
    ja: |-
      勝利の女神たちに
      そっくりだという事実まで
  d_nikke_rapunzel_sanctuary_03_9:
    speaker: "<Narration>"
    en: Rapunzel grits her teeth,
    ko: 까드득-
    ja: ギリッ――
  d_nikke_rapunzel_sanctuary_03_10:
    speaker: "<Narration>"
    en: feeling her head grow hot.
    ko: 라푼젤은 머리가 뜨거워지는 것을 느낀다.
    ja: ラプンツェルは、こみ上げる怒りを感じた
  d_nikke_rapunzel_sanctuary_03_11:
    speaker: rapunzel_s
    en: "... I cannot forgive this."
    ko: "…용서할 수 없어요."
    ja: "…許せません。"
  d_nikke_rapunzel_sanctuary_03_12:
    speaker: noah
    en: Me!
    ko: 내가 바로!
    ja: この私が…！
  d_nikke_rapunzel_sanctuary_03_13:
    speaker: noah
    en: I'm the strongest shield on the surface!!
    ko: 지상 최강의 방패다아아아--!!
    ja: 地上最強の盾だああああッ！！
  d_nikke_rapunzel_sanctuary_03_14:
    speaker: isabel
    en: Aaaaaah!
    ko: 아아아아아--!!
    ja: はぁぁぁぁっ――！！
  d_nikke_rapunzel_sanctuary_03_15:
    speaker: isabel
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_03_16:
    speaker: isabel
    en: Darling.
    ko: 사랑스러운 분.
    ja: 愛しいあなた。
  d_nikke_rapunzel_sanctuary_03_17:
    speaker: isabel
    en: To see you once more...
    ko: 당신을 다시 한번.
    ja: あなたにもう一度――
  d_nikke_rapunzel_sanctuary_03_18:
    speaker: harran
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_03_19:
    speaker: harran
    en: Follower... I leave the rest...
    ko: 종자야… 뒤는 부탁….
    ja: 従者…あとは任せ…
  d_nikke_rapunzel_sanctuary_03_20:
    speaker: "<Narration>"
    en: Blasphemy.
    ko: 모독.
    ja: 冒涜
  d_nikke_rapunzel_sanctuary_03_21:
    speaker: "<Narration>"
    en: This is clearly blasphemy.
    ko: 이것은 분명한 모독이다.
    ja: これは明らかな冒涜だ
  d_nikke_rapunzel_sanctuary_03_22:
    speaker: "<Narration>"
    en: "*Fwoosh!*"
    ko: 파칭--!
    ja: ピカッ――！
  d_nikke_rapunzel_sanctuary_03_23:
    speaker: "<Narration>"
    en: Light bursts forth from the halo hovering behind her.
    ko: 등 뒤에 떠 있는 타륜에서 빛이 뿜어져 나온다.
    ja: 背後に浮かぶ輪から光がほとばしる
  d_nikke_rapunzel_sanctuary_03_24:
    speaker: "<Narration>"
    en: The surge sends her hurtling forward at incredible speed.
    ko: 그와 함께 엄청난 속도로 돌진.
    ja: それとともに、すさまじい速度で突進した
  d_nikke_rapunzel_sanctuary_03_25:
    speaker: "<Narration>"
    en: "*Kaboom!*"
    ko: 콰아앙--!!
    ja: ドガァン！！
  d_nikke_rapunzel_sanctuary_03_26:
    speaker: "<Narration>"
    en: She suppresses the fury welling up inside her and activates her staff.
    ko: 차오르는 분노를 억누르며 지팡이를 작동시킨다.
    ja: |-
      こみ上げる怒りを抑えながら、
      杖を作動させた
  d_nikke_rapunzel_sanctuary_03_27:
    speaker: "<Narration>"
    en: It begins to hum, vibrating with power.
    ko: 드드드드드--!!
    ja: ドドドドドー！！
  d_nikke_rapunzel_sanctuary_03_28:
    speaker: rapunzel_s
    en: Hnnnngh!
    ko: 흐으으읍--!
    ja: はぁぁぁっ――！
  d_nikke_rapunzel_sanctuary_03_29:
    speaker: "<Narration>"
    en: A high-pitched ringing fills the air.
    ko: 키이이잉--
    ja: キィィィン…
  d_nikke_rapunzel_sanctuary_03_30:
    speaker: "<Narration>"
    en: The core of the last Rapture goes dark.
    ko: 마지막 랩쳐의 코어가 빛을 잃는다.
    ja: 最後のラプチャーのコアが光を失った
  d_nikke_rapunzel_sanctuary_03_31:
    speaker: rapunzel_s
    en: "*Huff... huff...*"
    ko: 후우… 후우….
    ja: はぁ…はぁ…
  d_nikke_rapunzel_sanctuary_03_32:
    speaker: "<Narration>"
    en: "*Whiiir*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_rapunzel_sanctuary_03_33:
    speaker: cecil
    en: Good, that should be sufficient for now.
    ko: 좋아요. 이만하면 충분하겠어요.
    ja: いいでしょう。十分です。
  d_nikke_rapunzel_sanctuary_03_34:
    speaker: cecil
    en: Excellent data.
    ko: 훌륭한 지표네요.
    ja: 素晴らしい数値ですね。
  d_nikke_rapunzel_sanctuary_03_35:
    speaker: cecil
    en: They far exceed what we had on hand.
    ko: 저희가 보유하고 있던 데이터를 아득히 웃도는 수준이에요.
    ja: |-
      既存データを
      はるかに上回るレベルです。
  d_nikke_rapunzel_sanctuary_03_36:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_03_37:
    speaker: cecil
    en: Rapunzel?
    ko: 라푼젤?
    ja: ラプンツェル？
  d_nikke_rapunzel_sanctuary_03_38:
    speaker: rapunzel_s
    en: "... Yes?"
    ko: "…예."
    ja: "…はい。"
  d_nikke_rapunzel_sanctuary_03_39:
    speaker: cecil
    en: Are you angry?
    ko: 화가 나신 건가요.
    ja: 怒っているのですか？
  d_nikke_rapunzel_sanctuary_03_40:
    speaker: rapunzel_s
    en: "... I'd be lying if I said no."
    ko: "…아니라고 하면 거짓말이겠죠."
    ja: "…違うと言えば嘘になりますね。"
  d_nikke_rapunzel_sanctuary_03_41:
    speaker: cecil
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_03_42:
    speaker: cecil
    en: There's no need to get so worked up.
    ko: 너무 그렇게 화내지 마세요.
    ja: 怒らないでください。
  d_nikke_rapunzel_sanctuary_03_43:
    speaker: cecil
    en: The fact that the Queen is creating imitations of you
    ko: 퀸이 당신들을 흉내 낸 존재들을 만들고 있다는 건.
    ja: |-
      クイーンがあなたたちの
      真似をしたということは、
  d_nikke_rapunzel_sanctuary_03_44:
    speaker: cecil
    en: means your existence has become a serious threat to her.
    ko: 당신들의 존재가 큰 위협이 되고 있다는 뜻이니까요.
    ja: |-
      あなたたちの存在が大きな脅威に
      なっているということですから。
  d_nikke_rapunzel_sanctuary_03_45:
    speaker: rapunzel_s
    en: Cecil, that's not what's important right now—
    ko: 세실, 저는 지금 그게 중요한 게-
    ja: セシル、そのようなことは重要では――
  d_nikke_rapunzel_sanctuary_03_46:
    speaker: cecil
    en: Inherit...
    ko: 인헤르트는.
    ja: インヘルトは…
  d_nikke_rapunzel_sanctuary_03_47:
    speaker: cecil
    en: They were dear to me, too.
    ko: 제게도 소중한 동료였어요.
    ja: 私にとっても大切な仲間でした。
  d_nikke_rapunzel_sanctuary_03_48:
    speaker: rapunzel_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_rapunzel_sanctuary_03_49:
    speaker: cecil
    en: That is why we must move forward.
    ko: 그렇기에 나아가야 해요.
    ja: だからこそ、進まなければ。
  d_nikke_rapunzel_sanctuary_03_50:
    speaker: cecil
    en: Because what they fought to protect still remains.
    ko: 그들이 지켜낸 것.
    ja: 彼女たちが守り抜いたもの――
  d_nikke_rapunzel_sanctuary_03_51:
    speaker: cecil
    en: You and Eden are still here.
    ko: 당신들과 에덴이 남아 있으니까요.
    ja: あなたたちとエデンが、残っているのですから。
  d_nikke_rapunzel_sanctuary_03_52:
    speaker: rapunzel_s
    en: "... Cecil."
    ko: "…세실."
    ja: "…セシル。"
  d_nikke_rapunzel_sanctuary_03_53:
    speaker: cecil
    en: Will you see it through
    ko: 이어가 주실 수 있으신가요.
    ja: 受け継いでいただけますか。
  d_nikke_rapunzel_sanctuary_03_54:
    speaker: cecil
    en: with me?
    ko: 저와 함께.
    ja: 私と一緒に。
  d_nikke_rapunzel_sanctuary_03_55:
    speaker: rapunzel_s
    en: Yes, I will.
    ko: 예, 알겠어요.
    ja: はい、分かりました。
  d_nikke_rapunzel_sanctuary_03_56:
    speaker: rapunzel_s
    en: I'll make those who blasphemed against my sisters pay for what they've done.
    ko: 자매님들을 모독한 자들에게 대가를 치르게 해드리겠어요.
    ja: |-
      仲間を冒涜した者たちに、
      代償を払わせます。
  d_nikke_rapunzel_sanctuary_03_57:
    speaker: rapunzel_s
    en: I swear...
    ko: 반드시.
    ja: 絶対に。
  d_nikke_rapunzel_sanctuary_03_58:
    speaker: cecil
    en: "... All right."
    ko: "…그래요."
    ja: "…そうですね。"
  d_nikke_rapunzel_sanctuary_03_59:
    speaker: cecil
    en: That concludes the simulation.
    ko: 좋아요. 시뮬레이션은 여기까지.
    ja: |-
      では、シミュレーションは
      ここまでにしましょう。
  d_nikke_rapunzel_sanctuary_03_60:
    speaker: cecil
    en: By the way,
    ko: 그나저나.
    ja: ところで…
  d_nikke_rapunzel_sanctuary_03_61:
    speaker: cecil
    en: may I ask you something?
    ko: 한가지 여쭤봐도 될까요.
    ja: 1つお聞きしたいことがあります。
  d_nikke_rapunzel_sanctuary_03_62:
    speaker: rapunzel_s
    en: Of course, anything you need.
    ko: 예, 필요한 게 있다면 뭐든지요.
    ja: はい、私に分かることであれば何なりと。
  d_nikke_rapunzel_sanctuary_03_63:
    speaker: cecil
    en: We detected an anomaly during the body's construction, albeit only for an
      instant.
    ko: 바디 메이킹 중, 찰나의 순간이었지만 이상이 감지되었어요.
    ja: |-
      ボディの製作中、ほんの一瞬でしたが
      異常が検知されたのです。
  d_nikke_rapunzel_sanctuary_03_64:
    speaker: cecil
    en: Do you know anything about it?
    ko: 이에 대해 뭔가 알고 계신 게 있나요?
    ja: 何か心あたりがありますか？
  d_nikke_rapunzel_sanctuary_03_65:
    speaker: rapunzel_s
    en: An anomaly... I see.
    ko: 이상… 말이군요.
    ja: 異常…ですか。
  d_nikke_rapunzel_sanctuary_03_66:
    speaker: "<Narration>"
    en: As Rapunzel closes her hand around the rosary, a soft light spills out.
    ko: 라푼젤이 로사리오를 감싸 쥐자 은은한 빛이 흘러나온다.
    ja: |-
      ラプンツェルがロザリオを握りしめると、
      ほのかな光が放たれた
  d_nikke_rapunzel_sanctuary_03_67:
    speaker: cecil
    en: "... NIMPH."
    ko: "…NIMPH."
    ja: "…NIMPH。"
  d_nikke_rapunzel_sanctuary_03_68:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_03_69:
    speaker: rapunzel_s
    en: You said we had some time to spare?
    ko: 잠시의 여유가 있다고 하셨죠.
    ja: 少し時間があるとおっしゃいましたね。
  d_nikke_rapunzel_sanctuary_03_70:
    speaker: "<Narration>"
    en: "*Clink*"
    ko: 잘그락-
    ja: チャリン…
  d_nikke_rapunzel_sanctuary_03_71:
    speaker: "<Narration>"
    en: Rapunzel shows Cecil the glowing rosary.
    ko: 라푼젤이 빛나는 로사리오를 세실에게 보여준다.
    ja: ラプンツェルは、セシルに光るロザリオを見せた
  d_nikke_rapunzel_sanctuary_03_72:
    speaker: rapunzel_s
    en: I was saved by my sisters.
    ko: 저는 자매님들로 인해 구원받았답니다.
    ja: 私は姉妹たちに救われたのです。
d_nikke_rapunzel_sanctuary_04:
  d_nikke_rapunzel_sanctuary_04_1:
    speaker: "<Narration>"
    en: Rapunzel slowly begins to speak.
    ko: 라푼젤 천천히 입을 열었다.
    ja: ラプンツェルはゆっくりと口を開き…
  d_nikke_rapunzel_sanctuary_04_2:
    speaker: "<Narration>"
    en: She tells her about a space generated from NIMPH data,
    ko: NIMPH의 데이터로 생성된 공간.
    ja: NIMPHのデータによって生成された空間
  d_nikke_rapunzel_sanctuary_04_3:
    speaker: "<Narration>"
    en: about meeting Red Shoes there,
    ko: 그곳에서 레드 슈즈와 만났던 이야기.
    ja: そこでレッドシューズと出会ったこと
  d_nikke_rapunzel_sanctuary_04_4:
    speaker: "<Narration>"
    en: and about the help she received from the countless people who live on within
      her.
    ko: 그리고 라푼젤이 짊어진 수많은 이들의 도움을 받은 이야기까지.
    ja: |-
      そして、ラプンツェルが背負う、
      多くの人々に助けられたことを語った
  d_nikke_rapunzel_sanctuary_04_5:
    speaker: cecil
    en: "... What an interesting story."
    ko: "…흥미로운 이야기네요."
    ja: "…興味深いお話ですね。"
  d_nikke_rapunzel_sanctuary_04_6:
    speaker: rapunzel_s
    en: Isn't it? What a cruel twist of fate.
    ko: 그렇죠? 참 얄궂은 인연이에요.
    ja: そうでしょう？本当に皮肉な縁です。
  d_nikke_rapunzel_sanctuary_04_7:
    speaker: cecil
    en: To think personality data was hidden that deep within an armament...
    ko: 무장의 깊은 곳에 인격 데이터를 숨겨놓았을 줄이야….
    ja: 武装の奥深くに人格データを隠していたなんて…
  d_nikke_rapunzel_sanctuary_04_8:
    speaker: cecil
    en: And I proceeded with the transplant without even realizing it. An oversight
      on my part.
    ko: "…그런 것도 인지하지 못하고 이식을 진행했다니, 제 불찰이네요."
    ja: |-
      …気づかず移植を進めてしまったとは…
      私の落ち度ですね。
  d_nikke_rapunzel_sanctuary_04_9:
    speaker: rapunzel_s
    en: There's no need to feel guilty.
    ko: 죄책감 가지실 필요는 없어요.
    ja: ご自分を責める必要はありません。
  d_nikke_rapunzel_sanctuary_04_10:
    speaker: rapunzel_s
    en: It all worked out in the end, didn't it?
    ko: 결과적으로 잘 해결됐잖아요?
    ja: 結果的に、無事に解決したじゃないですか。
  d_nikke_rapunzel_sanctuary_04_11:
    speaker: cecil
    en: "... Yes, thank you."
    ko: "…그래요. 고마워요."
    ja: "…ええ、ありがとうございます。"
  d_nikke_rapunzel_sanctuary_04_12:
    speaker: cecil
    en: It's about time.
    ko: 슬슬 시간이 됐네요.
    ja: そろそろ時間です。
  d_nikke_rapunzel_sanctuary_04_13:
    speaker: cecil
    en: I should go check on Scarlet's body.
    ko: 홍련의 바디를 체크하러 가봐야겠어요.
    ja: 紅蓮のボディを確認しに行ってきます。
  d_nikke_rapunzel_sanctuary_04_14:
    speaker: rapunzel_s
    en: "... She's coming back, then."
    ko: "…돌아오는 거군요."
    ja: "…戻るのですね。"
  d_nikke_rapunzel_sanctuary_04_15:
    speaker: cecil
    en: "... Yes."
    ko: "…예."
    ja: "…はい。"
  d_nikke_rapunzel_sanctuary_04_16:
    speaker: rapunzel_s
    en: Hehe, I'm looking forward to it. Go on, then.
    ko: 후후. 기대되네요. 다녀오세요.
    ja: ふふ、楽しみです。行ってらっしゃい。
  d_nikke_rapunzel_sanctuary_04_17:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_04_18:
    speaker: rapunzel_s
    en: Thank you, sisters,
    ko: 고마워요. 자매님들.
    ja: ありがとうございます、姉妹のみなさん。
  d_nikke_rapunzel_sanctuary_04_19:
    speaker: rapunzel_s
    en: for giving someone as incomplete as me the conviction I needed.
    ko: 부족한 제게 확신을 주셔서.
    ja: 至らない私に、確信をくださって。
  d_nikke_rapunzel_sanctuary_04_20:
    speaker: rapunzel_s
    en: The truth is... I never had any to begin with.
    ko: 사실… 제겐 확신이 없었거든요.
    ja: "…私には信じることができなかったのです。"
  d_nikke_rapunzel_sanctuary_04_21:
    speaker: rapunzel
    en: This will prevent the mound from being desecrated by any Raptures in the future.
    ko: 이걸로 한동안은 랩쳐가 여길 헤집을 일은 없을 거예요.
    ja: |-
      これでラプチャーがここを荒らすことは
      しばらくないでしょう。
  d_nikke_rapunzel_sanctuary_04_22:
    speaker: rapunzel
    en: It won't be long before my sister's NIMPH dissipates. My hair will no longer
      have any effect then.
    ko: |-
      자매님의 NIMPH는 얼마 후 완전히 흩어질 것이고,
      그때 쯤엔 이 머리카락의 역할도 끝나겠죠.
    ja: |-
      姉妹のNIMPHはしばらくすると完全に散り、
      その頃になると髪の毛も役割を終えます。
  d_nikke_rapunzel_sanctuary_04_23:
    speaker: rapunzel
    en: I hope my sister's redemption is nigh...
    ko: 이걸로 자매님은 구원받을….
    ja: これで姉妹は救われ…
  d_nikke_rapunzel_sanctuary_04_24:
    speaker: rapunzel
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_04_25:
    speaker: rapunzel
    en: Do you think she will have salvation?
    ko: 구원받는… 걸까요?
    ja: 救われるの…でしょうか？
  d_nikke_rapunzel_sanctuary_04_26:
    speaker: rapunzel_s
    en: That question always weighed heavily on my mind.
    ko: 이 물음이 항상 제 곁을 맴돌았어요.
    ja: この問いが、いつも私から離れませんでした。
  d_nikke_rapunzel_sanctuary_04_27:
    speaker: rapunzel_s
    en: I buried you and prayed that you would rest in peace.
    ko: 자매님들을 묻어드리고, 편히 잠드시길 기도했지만.
    ja: |-
      姉妹たちを葬り、
      安らかに眠れるよう祈っていましたが…
  d_nikke_rapunzel_sanctuary_04_28:
    speaker: rapunzel_s
    en: But at the same time, I kept your NIMPHs inside me and carried them with me
      all this time.
    ko: 동시에 여러분들의 NIMPH를 제 안에 담아, 계속 짊어지고 있었으니까요.
    ja: |-
      同時に、みなさんのNIMPHを私の中に留め、
      背負い続けていたのですから。
  d_nikke_rapunzel_sanctuary_04_29:
    speaker: rapunzel_s
    en: Was I holding close the very people I should have let go completely?
    ko: 온전히 놓아드려야 할 분들을, 제 곁에 붙잡아두고 있는 건 아닐까.
    ja: |-
      本当なら解放してさしあげるべき方々を、
      私のもとに引き留めて
      しまっているのではないか。
  d_nikke_rapunzel_sanctuary_04_30:
    speaker: rapunzel_s
    en: Whenever I think about it, part of my heart always feels heavy.
    ko: 그렇게 생각하면, 늘 마음 한편이 무거웠어요.
    ja: |-
      そう考えるたびに、
      いつも心のどこかが重かったのです。
  d_nikke_rapunzel_sanctuary_04_31:
    speaker: rapunzel_s
    en: I know I did it for you, but was there also some selfish desire in it? Was
      I really doing it for my own sake?
    ko: |-
      분명 자매님들을 위한 마음이었지만,
      그 안에 자기만족을 위한 욕심이 있던 게 아닐까.
    ja: |-
      確かにみなさんを思ってのことでしたが、
      自己満足のための欲もあったのではないか、と。
  d_nikke_rapunzel_sanctuary_04_32:
    speaker: "<Narration>"
    en: A mysterious light emanates from the rosary, enveloping Rapunzel.
    ko: 로사리오에서 흘러나온 신비로운 빛이 라푼젤을 감싼다.
    ja: |-
      ロザリオからほとばしる神秘的な光が、
      ラプンツェルを包み込む
  d_nikke_rapunzel_sanctuary_04_33:
    speaker: rapunzel_s
    en: But after everything that happened, I finally have my answer.
    ko: 하지만 이번 일을 계기로, 드디어 답을 얻었어요.
    ja: |-
      ですが、今回のことをきっかけに、
      ようやく答えを得られました。
  d_nikke_rapunzel_sanctuary_04_34:
    speaker: rapunzel_s
    en: When Red Shoes tried to overwhelm my NIMPH with corruption,
    ko: 레드 슈즈가 제 NIMPH를 침식으로 뒤덮으려 했을 때.
    ja: |-
      レッドシューズが私のNIMPHを
      侵食で覆い尽くそうとした時…
  d_nikke_rapunzel_sanctuary_04_35:
    speaker: rapunzel_s
    en: what protected me to the very end was the strength you all entrusted to me.
    ko: 저를 끝까지 지켜준 건, 제가 짊어진 여러분들의 힘이었으니까요.
    ja: |-
      私を最後まで守ってくれたのは、
      私が背負っているみなさんのお力でした。
  d_nikke_rapunzel_sanctuary_04_36:
    speaker: rapunzel_s
    en: I can stand here today
    ko: 제가 지금 이곳에 있을 수 있는 건.
    ja: 私が今、ここにいられるのも…
  d_nikke_rapunzel_sanctuary_04_37:
    speaker: rapunzel_s
    en: because of you who fell without a name.
    ko: 이름 없이 쓰러져간 여러분들의 덕.
    ja: 名もなく倒れていった、みなさんのおかげです。
  d_nikke_rapunzel_sanctuary_04_38:
    speaker: rapunzel_s
    en: Thank you
    ko: 감사해요.
    ja: ありがとうございます。
  d_nikke_rapunzel_sanctuary_04_39:
    speaker: rapunzel_s
    en: for staying with me, even in my imperfect heart.
    ko: 부족한 제 마음까지, 함께해 주셔서.
    ja: 至らない私の心に、寄り添ってくださって。
  d_nikke_rapunzel_sanctuary_04_40:
    speaker: "<Narration>"
    en: Rapunzel sits in a chair and looks out the window.
    ko: 라푼젤은 의자에 앉아 밖으로 이어진 창문을 바라본다.
    ja: ラプンツェルは椅子に座り、窓を見つめる
  d_nikke_rapunzel_sanctuary_04_41:
    speaker: rapunzel_s
    en: "... Please continue to believe in me."
    ko: "…앞으로도 저를 믿어주세요."
    ja: "…これからも、私を信じてください。"
  d_nikke_rapunzel_sanctuary_04_42:
    speaker: rapunzel_s
    en: I'll protect the world you wanted to protect,
    ko: 자매님들이 지켜내고 싶었던 세계.
    ja: 姉妹のみなさんが守りたかった世界を…
  d_nikke_rapunzel_sanctuary_04_43:
    speaker: rapunzel_s
    en: no matter what.
    ko: 제가 반드시 지켜낼 테니까요.
    ja: 私が必ず守り抜きますから。
  d_nikke_rapunzel_sanctuary_04_44:
    speaker: rapunzel_s
    en: And please wait for me, Believer.
    ko: 그리고 기다려 주세요. 형제님.
    ja: そして、待っていてください。ブラザー。
  d_nikke_rapunzel_sanctuary_04_45:
    speaker: rapunzel_s
    en: Just a little longer. I'll be there soon.
    ko: 금방 갈게요. 조금만 기다려 주세요.
    ja: |-
      すぐに参ります。
      もう少しだけ、お待ちください。
  d_nikke_rapunzel_sanctuary_04_46:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_04_47:
    speaker: "<Narration>"
    en: Rapunzel leans back in her chair and quietly closes her eyes.
    ko: 라푼젤은 의자에 기대어 가만히 눈을 감는다.
    ja: |-
      ラプンツェルは椅子にもたれかかり、
      静かに目を閉じた
  d_nikke_rapunzel_sanctuary_04_48:
    speaker: "<Narration>"
    en: She etches her newfound conviction deep into her heart.
    ko: 그리고 방금 얻은 확신을, 가슴 깊이 새겨넣는다.
    ja: |-
      そして、たったいま得た確信を、
      胸の奥深くに刻み込んだ
  d_nikke_rapunzel_sanctuary_04_49:
    speaker: rapunzel_s
    en: I won't waver anymore.
    ko: 이제, 흔들리지 않을게요.
    ja: もう、揺らぎはしません。
  d_nikke_rapunzel_sanctuary_04_50:
    speaker: "<Narration>"
    en: Gathering herself, Rapunzel waits for Scarlet's return.
    ko: 그렇게 마음을 다잡으며, 라푼젤은 홍련이 돌아오기를 기다렸다.
    ja: |-
      そうして決意を新たにし、
      ラプンツェルは紅蓮が戻るのを待った
  d_nikke_rapunzel_sanctuary_04_51:
    speaker: "<Narration>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_04_52:
    speaker: "<Narration>"
    en: A while later...
    ko: 시간이 얼마나 흘렀을까.
    ja: どれくらい時間が経っただろうか
  d_nikke_rapunzel_sanctuary_04_53:
    speaker: "<Narration>"
    en: "*Whiiir*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_rapunzel_sanctuary_04_54:
    speaker: rapunzel_s
    en: Oh, Cecil.
    ko: 아. 세실.
    ja: あら、セシル。
  d_nikke_rapunzel_sanctuary_04_55:
    speaker: cecil
    en: You're still here, I see.
    ko: 아직 여기 계셨군요.
    ja: まだこちらにいらっしゃったのですね。
  d_nikke_rapunzel_sanctuary_04_56:
    speaker: rapunzel_s
    en: Is something wrong? You don't look well.
    ko: 무슨 일 있나요? 표정이 좋지 않네요.
    ja: 何かあったのですか？お顔が暗いですよ。
  d_nikke_rapunzel_sanctuary_04_57:
    speaker: cecil
    en: "... Yes, I've just confirmed something."
    ko: "…예. 방금 확인된 게 있어서요."
    ja: "…はい。先ほど分かったことですが…"
  d_nikke_rapunzel_sanctuary_04_58:
    speaker: "<Narration>"
    en: Cecil shows Rapunzel what's on the screen she's holding.
    ko: 세실이 손에 들고 있는 화면을 라푼젤에게 보여준다.
    ja: セシルは手元の画面をラプンツェルに見せた
  d_nikke_rapunzel_sanctuary_04_59:
    speaker: cecil
    en: The resolution is low, but we've confirmed that a battle has broken out at
      the Lift.
    ko: |-
      해상도가 낮아 흐릿하지만,
      궤도 엘리베이터에서 전투가 발생한 것을 확인했어요.
    ja: |-
      解像度が低く不鮮明ではありますが、
      軌道エレベーターで戦闘が発生したことを
      確認しました。
  d_nikke_rapunzel_sanctuary_04_60:
    speaker: rapunzel_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_rapunzel_sanctuary_04_61:
    speaker: cecil
    en: There are still a few tests left to run, but...
    ko: 아직 좀 더 테스트할 게 남았지만….
    ja: まだいくつかテストは残っていますが…
  d_nikke_rapunzel_sanctuary_04_62:
    speaker: cecil
    en: The situation doesn't look good. We should deploy you immediately.
    ko: 상황이 좋지 않아 보이니, 이대로 긴급 투입하는 게 좋겠어요.
    ja: |-
      状況がよくないようなので、
      このまま行っていただいたほうがよさそうです。
  d_nikke_rapunzel_sanctuary_04_63:
    speaker: rapunzel_s
    en: Understood. We'd better hurry.
    ko: 알겠어요. 서둘러야겠군요.
    ja: 分かりました。急がなくてはなりませんね。
  d_nikke_rapunzel_sanctuary_04_64:
    speaker: cecil
    en: Yes, come to the lobby once you're ready.
    ko: 예. 준비가 끝나는 대로 로비로 나와주세요.
    ja: |-
      ええ。
      準備ができ次第、ロビーへお越しください。
d_nikke_rapunzel_sanctuary_05:
  d_nikke_rapunzel_sanctuary_05_1:
    speaker: "<Narration>"
    en: Rapunzel makes a few quick preparations and heads for the lobby.
    ko: 간단한 채비를 마친 라푼젤은 로비로 향했다.
    ja: |-
      簡単に支度を済ませたラプンツェルは、
      ロビーへ向かった
  d_nikke_rapunzel_sanctuary_05_2:
    speaker: cecil
    en: You're here.
    ko: 오셨군요.
    ja: いらっしゃいましたね。
  d_nikke_rapunzel_sanctuary_05_3:
    speaker: cecil
    en: Are you ready?
    ko: 준비는 끝나신 건가요.
    ja: 準備は整いましたか？
  d_nikke_rapunzel_sanctuary_05_4:
    speaker: rapunzel_s
    en: Yes, of course.
    ko: 예, 물론이죠.
    ja: はい、バッチリです。
  d_nikke_rapunzel_sanctuary_05_5:
    speaker: cecil
    en: How are you feeling?
    ko: 상태는 어떠시죠.
    ja: 調子はいかがですか？
  d_nikke_rapunzel_sanctuary_05_6:
    speaker: rapunzel_s
    en: Hehe, I don't think I could feel any better than this.
    ko: 후후. 이보다 좋을 순 없을 것 같은데요.
    ja: ふふ。これ以上ないほど、絶好調ですよ。
  d_nikke_rapunzel_sanctuary_05_7:
    speaker: cecil
    en: Good.
    ko: 좋아요.
    ja: 分かりました。
  d_nikke_rapunzel_sanctuary_05_8:
    speaker: cecil
    en: Then let's go.
    ko: 그렇다면 출발하시죠.
    ja: それでは、出発ですね。
  d_nikke_rapunzel_sanctuary_05_9:
    speaker: hongryeon
    en: Very well.
    ko: 좋네.
    ja: よし。
  d_nikke_rapunzel_sanctuary_05_10:
    speaker: hongryeon
    en: Let us make haste and lend my Lord our aid.
    ko: 한시라도 빨리 도령에게 손을 보태러 가세나.
    ja: 一刻も早く、ぼっちゃんの助太刀に参ろう。
  d_nikke_rapunzel_sanctuary_05_11:
    speaker: rapunzel_s
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_rapunzel_sanctuary_05_12:
    speaker: rapunzel_s
    en: That voice...
    ko: 이 목소리는….
    ja: この声は…
  d_nikke_rapunzel_sanctuary_05_13:
    speaker: "<Narration>"
    en: "*Click, clack*"
    ko: 또각- 또각-
    ja: コツ、コツ――
  d_nikke_rapunzel_sanctuary_05_14:
    speaker: "<Narration>"
    en: A familiar voice reaches her from somewhere nearby.
    ko: 어딘가에서 들려오는 익숙한 목소리.
    ja: どこからか聞こえてくる、馴染みのある声
  d_nikke_rapunzel_sanctuary_05_15:
    speaker: "<Narration>"
    en: Rapunzel's eyes go wide as she turns toward the sound.
    ko: 눈을 동그랗게 뜬 라푼젤이 소리가 들려오는 곳을 바라본다.
    ja: |-
      目を丸くしたラプンツェルは、
      声のするほうを見つめた
  d_nikke_rapunzel_sanctuary_05_16:
    speaker: "<Narration>"
    en: 'And there she is: Scarlet.'
    ko: 그러자, 홍련의 모습이 보인다.
    ja: 紅蓮の姿が見えた
  d_nikke_rapunzel_sanctuary_05_17:
    speaker: hongryeon_g
    en: So thou hast come, Rapunzel.
    ko: 왔는가, 라푼젤.
    ja: 来たのかい、ラプンツェル。
  d_nikke_rapunzel_sanctuary_05_18:
    speaker: rapunzel_s
    en: Scarlet...
    ko: 홍련….
    ja: 紅蓮…
  d_nikke_rapunzel_sanctuary_05_19:
    speaker: hongryeon_g
    en: Thou lookest hale.
    ko: 혈색이 좋아 보이는군.
    ja: 顔色もよさそうだねぇ。
  d_nikke_rapunzel_sanctuary_05_20:
    speaker: hongryeon_g
    en: Mayhap I worried for naught.
    ko: 내 괜한 걱정을 했나 싶네.
    ja: 余計な心配だったようだ。
  d_nikke_rapunzel_sanctuary_05_21:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_05_22:
    speaker: hongryeon_g
    en: Hm? Why dost thou gaze upon me so?
    ko: 음? 왜 그리 빤히 바라보는가.
    ja: ん？なぜそうまじまじと見つめる？
  d_nikke_rapunzel_sanctuary_05_23:
    speaker: hongryeon_g
    en: If thou seekest a tearful reunion, I must disappoint thee.
    ko: 감동의 재회를 원한다면 사양하겠네.
    ja: 感動の再会なら、遠慮させてもらうよ。
  d_nikke_rapunzel_sanctuary_05_24:
    speaker: hongryeon_g
    en: For we did meet again soon after that day, in truth. Hardly a reunion to make
      such a great fuss over.
    ko: 사실상 우린 그날 이후 바로 만난 것이나 다름없으니.
    ja: 私たちはすぐに再会したも同然だからな。
  d_nikke_rapunzel_sanctuary_05_25:
    speaker: hongryeon_g
    en: And would that not be rather embarrassing? At this point—Mmph!
    ko: 그리고 낯간지럽지 않은가. 이쯤 되면- 으읍!
    ja: |-
      それに、気恥ずかしいではないか。
      今さら――むぐっ！
  d_nikke_rapunzel_sanctuary_05_26:
    speaker: rapunzel_s
    en: "... I'm so glad you came back."
    ko: "…돌아와서 정말 다행이에요."
    ja: "…戻ってきてくれて、本当に嬉しいです。"
  d_nikke_rapunzel_sanctuary_05_27:
    speaker: hongryeon_g
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_05_28:
    speaker: rapunzel_s
    en: I'm sorry, I've never been reunited with someone like this before, so I'm
      not quite sure what to make of these feelings...
    ko: 죄송해요. 이런 방식의 재회는 처음이라 뭔가 마음이 이상해서….
    ja: |-
      ごめんなさい。こんな形での再会は
      初めてなので、なんだか不思議な気持ちで…
  d_nikke_rapunzel_sanctuary_05_29:
    speaker: hongryeon_g
    en: "... The same holds true for me, I daresay."
    ko: "…그건 나도 마찬가지라네."
    ja: "…それは私も同じだよ。"
  d_nikke_rapunzel_sanctuary_05_30:
    speaker: hongryeon_g
    en: More to the point... wouldst thou let go of me whilst we converse?
    ko: 것보다… 이것 좀 놓고 말해주겠나?
    ja: それより…離れてから話そう。
  d_nikke_rapunzel_sanctuary_05_31:
    speaker: rapunzel_s
    en: Oh yes, I'm sorry.
    ko: 아아. 네에, 죄송해요.
    ja: ああっ、はい。すみません。
  d_nikke_rapunzel_sanctuary_05_32:
    speaker: hongryeon_g
    en: "*Sigh*"
    ko: 후우.
    ja: ふぅ…
  d_nikke_rapunzel_sanctuary_05_33:
    speaker: hongryeon_g
    en: Thy appearance may have changed, but thou art still the same.
    ko: 겉모습만 바뀌었지, 자넨 그대로군.
    ja: 見た目こそ変わったが、君は相変わらずだねぇ。
  d_nikke_rapunzel_sanctuary_05_34:
    speaker: rapunzel_s
    en: Hehe. Isn't that just as true of you, Scarlet?
    ko: 후후. 그건 홍련도 마찬가지 아닌가요.
    ja: ふふ、それは紅蓮も同じではありませんか？
  d_nikke_rapunzel_sanctuary_05_35:
    speaker: hongryeon_g
    en: Aye, thou art not wrong.
    ko: 그것도 틀린 말은 아니지.
    ja: それもそうだな。
  d_nikke_rapunzel_sanctuary_05_36:
    speaker: cecil
    en: Hmm...
    ko: 흠.
    ja: コホン…
  d_nikke_rapunzel_sanctuary_05_37:
    speaker: cecil
    en: Are you quite finished?
    ko: 이야기는 다 끝나셨나요?
    ja: お話は終わりましたか？
  d_nikke_rapunzel_sanctuary_05_38:
    speaker: rapunzel_s
    en: Oh, sorry to keep you waiting.
    ko: 아, 기다리게 했군요.
    ja: あら、お待たせしてしまいましたね。
  d_nikke_rapunzel_sanctuary_05_39:
    speaker: cecil
    en: Well, I anticipated as much. It's of no concern.
    ko: 뭐, 이 정도쯤은 예상했으니 괜찮아요.
    ja: 想定内です。構いませんよ。
  d_nikke_rapunzel_sanctuary_05_40:
    speaker: johan
    en: The coordinates are set. You can depart immediately.
    ko: 좌표는 입력해 놨으니, 바로 출발하면 된다.
    ja: 座標は入力しておいた。すぐに出発するといい。
  d_nikke_rapunzel_sanctuary_05_41:
    speaker: "<Narration>"
    en: The gates of Eden open.
    ko: 에덴의 문이 열린다.
    ja: エデンの扉が開く
  d_nikke_rapunzel_sanctuary_05_42:
    speaker: "<Narration>"
    en: Rapunzel and Scarlet stand before them.
    ko: 라푼젤과 홍련은 문 앞에 선다.
    ja: ラプンツェルと紅蓮は扉の前に立った
  d_nikke_rapunzel_sanctuary_05_43:
    speaker: rapunzel_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_rapunzel_sanctuary_05_44:
    speaker: rapunzel_s
    en: Johan, Cecil, thank you.
    ko: 요한, 세실. 고마워요.
    ja: ヨハン、セシル。ありがとうございます。
  d_nikke_rapunzel_sanctuary_05_45:
    speaker: rapunzel_s
    en: For now, that's all I can say.
    ko: 지금으로선 이 말밖에 할 수 있는 말이 없네요.
    ja: 今は、これしか言えることがなくて…
  d_nikke_rapunzel_sanctuary_05_46:
    speaker: hongryeon_g
    en: I am in thy debt.
    ko: 은혜를 입었네.
    ja: 世話になった。
  d_nikke_rapunzel_sanctuary_05_47:
    speaker: hongryeon_g
    en: I shall surely repay thee.
    ko: 이 일은 내 반드시 갚겠네.
    ja: この恩、いつか必ずや返そう。
  d_nikke_rapunzel_sanctuary_05_48:
    speaker: cecil
    en: Don't mention it.
    ko: 별말씀을요.
    ja: どういたしまして。
  d_nikke_rapunzel_sanctuary_05_49:
    speaker: johan
    en: Best of luck.
    ko: 행운을 빌지.
    ja: 幸運を祈る。
  d_nikke_rapunzel_sanctuary_05_50:
    speaker: hongryeon_g
    en: Then, Rapunzel, let us be on our way.
    ko: 그렇다면 라푼젤, 가세나.
    ja: では、ラプンツェル。参ろう。
  d_nikke_rapunzel_sanctuary_05_51:
    speaker: rapunzel_s
    en: Okay.
    ko: 좋아요.
    ja: ええ。
  d_nikke_rapunzel_sanctuary_05_52:
    speaker: "<Narration>"
    en: "*Whiiir*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_rapunzel_sanctuary_05_53:
    speaker: "<Narration>"
    en: Rapunzel steps out of Eden.
    ko: 라푼젤은 에덴을 나섰다.
    ja: ラプンツェルはエデンを後にした
  d_nikke_rapunzel_sanctuary_05_54:
    speaker: "<Narration>"
    en: Judgment awaits those who blasphemed against the Goddesses of Victory, and
      peace awaits the world she wishes to protect.
    ko: 승리의 여신을 모독한 자들에게 심판을, 지키고 싶은 세계에 평안을.
    ja: |-
      勝利の女神を冒涜した者たちに裁きを、
      守りたいと願う世界に平穏を
  d_nikke_rapunzel_sanctuary_05_55:
    speaker: "<Narration>"
    en: And onward she goes, toward the sight everyone has longed to behold.
    ko: 그리고, 모두가 보고 싶던 그 경치를 향해.
    ja: そして、誰もが望んだあの景色を目指して
