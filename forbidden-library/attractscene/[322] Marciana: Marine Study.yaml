---
d_nikke_marciana_marinestudy_01:
  d_nikke_marciana_marinestudy_01_1:
    speaker: naga_s
    en: Looks like everyone's finally here.
    ko: 이제 정말 다 모였네.
    ja: よし、これで全員揃ったね。
  d_nikke_marciana_marinestudy_01_2:
    speaker: marciana_s
    en: What's this about, Naga?
    ko: 나가, 무슨 일로 우리를 부른 거죠?
    ja: |-
      ナガ、今日はどういった理由で
      私たちを呼んだのですか？
  d_nikke_marciana_marinestudy_01_3:
    speaker: tia_l
    en: Well, you see...
    ko: 그건 말이죠오~
    ja: それはですねぇ～
  d_nikke_marciana_marinestudy_01_4:
    speaker: tia_l
    en: Ta-da!
    ko: 짜잔~
    ja: ジャジャ～ン！
  d_nikke_marciana_marinestudy_01_5:
    speaker: "<Monologue>"
    en: Naga and Tia pull out what they had hidden away.
    ko: 나가와 티아가 숨겨두었던 물건을 꺼냈다.
    ja: |-
      ナガとティアは隠しておいた
      あるものを取り出した
  d_nikke_marciana_marinestudy_01_6:
    speaker: marciana_s
    en: They're necklaces... made from seashells.
    ko: 조개 껍질로 만든 목걸이… 네요.
    ja: 貝殻のネックレス…ですか？
  d_nikke_marciana_marinestudy_01_7:
    speaker: naga_s
    en: There are so many beautiful seashells on this island,
    ko: 이 섬에 예쁜 조개 껍질들이 많거든요.
    ja: はい。島にきれいな貝殻がいっぱいあったので、
  d_nikke_marciana_marinestudy_01_8:
    speaker: naga_s
    en: and we thought they'd make the perfect necklaces,
    ko: 그래서 그것들로 목걸이를 만들어 왔어요.
    ja: それを使ってネックレスを作ってみたんです。
  d_nikke_marciana_marinestudy_01_9:
    speaker: naga_s
    en: so we decided to make them as gifts for everyone.
    ko: 모두에게 선물해주고 싶어서.
    ja: みんなにプレゼントしたいなと思って。
  d_nikke_marciana_marinestudy_01_10:
    speaker: littlemermaid_s
    en: They're... for us?
    ko: "[정말… 우리에게 주는 선물이야?]"
    ja: "「これ…ぜんぶ、私たちのために？」"
  d_nikke_marciana_marinestudy_01_11:
    speaker: tia_l
    en: You bet!
    ko: 그러엄~
    ja: そうだよぉ～！
  d_nikke_marciana_marinestudy_01_12:
    speaker: tia_l
    en: We made them using shells we picked out that we thought suited each of you.
    ko: 나가랑 같이 각자에게 어울릴 것 같은 조개들로 선별해서 만들어 봤어~
    ja: |-
      ナガと一緒に、みんなに似合いそうな
      貝殻を選んで作ってみたのぉ～
  d_nikke_marciana_marinestudy_01_13:
    speaker: "<Monologue>"
    en: We each receive a seashell necklace made by Naga and Tia.
    ko: 우리는 나가와 티아가 만든 조개 껍질 목걸이를 받았다.
    ja: |-
      私たちはナガとティアが作った
      貝殻のネックレスを受け取った
  d_nikke_marciana_marinestudy_01_14:
    speaker: tia_l
    en: They look so great on all of you!
    ko: 다들 진짜 잘 어울린다아~
    ja: みんな、すごく似合ってるよぉ～
  d_nikke_marciana_marinestudy_01_15:
    speaker: marciana_s
    en: Thank you so much. I never expected to receive a gift like this.
    ko: 정말 고마워요. 이런 선물을 받을 거라곤 생각도 못했네요.
    ja: |-
      …本当にありがとうございます。
      まさか、こんなプレゼントをいただけるなんて
      夢にも思いませんでした。
  d_nikke_marciana_marinestudy_01_16:
    speaker: mori
    en: I-I don't know if I deserve something like this...
    ko: 내, 내가 이런 걸 받아도 괜찮을지 모르겠네….
    ja: |-
      わ、私までこんな素敵なものを
      もらっちゃっていいのかな…
  d_nikke_marciana_marinestudy_01_17:
    speaker: grave_p
    en: I won't be able to wear it during training, but I'll treasure it.
    ko: 훈련 중에 착용할 수는 없겠지만, 소중히 간직하겠다.
    ja: 訓練中は着用できないが、大切にする。
  d_nikke_marciana_marinestudy_01_18:
    speaker: littlemermaid_s
    en: Thank you so much for the gift!
    ko: "[선물, 정말 고마워!]"
    ja: "「プレゼント、本当にありがとう！」"
  d_nikke_marciana_marinestudy_01_19:
    speaker: "<Monologue>"
    en: While everyone is thanking Naga and Tia, Rapi approaches me.
    ko: 다들 나가와 티아에게 감사 인사를 전하고 있을 때, 라피가 내 옆으로 다가왔다.
    ja: |-
      各々がナガとティアに感謝の
      言葉を伝えていると、
      ラピが私に近づいてきた
  d_nikke_marciana_marinestudy_01_20:
    speaker: rapi_red
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  d_nikke_marciana_marinestudy_01_21:
    speaker: "<Self>"
    en: Yeah?
    ko: 응?
    ja: ん？どうしたんだ？
  d_nikke_marciana_marinestudy_01_22:
    speaker: rapi_red
    en: What do you think of my necklace?
    ko: 제 목걸이, 어떻게 생각하십니까.
    ja: このネックレス、どう思いますか。
  d_nikke_marciana_marinestudy_01_23:
    speaker: "<Self>"
    en: Shouldn't you be thanking Naga and Tia too...?
    ko: 방금은 라피도 고맙다고 말해야 하는 흐름 아니었어…?
    ja: |-
      ええと…そうだな、まずはラピからも
      二人にお礼を言ってみてはどうだ…？
  d_nikke_marciana_marinestudy_01_24:
    speaker: rapi_red
    en: Of course, I really appreciate the gift.
    ko: 예, 물론 선물은 고맙습니다.
    ja: もちろん、プレゼントには感謝しています。
  d_nikke_marciana_marinestudy_01_25:
    speaker: rapi_red
    en: But I'm even more curious what you think of it.
    ko: 하지만 지휘관의 감상이 더 궁금해서요.
    ja: |-
      ですが、まずは指揮官の感想を
      お聞きしたいと思いまして。
  d_nikke_marciana_marinestudy_01_26:
    speaker: "<Self>"
    en: It looks good on you.
    ko: 잘 어울려.
    ja: よく似合っている
  d_nikke_marciana_marinestudy_01_27:
    speaker: rapi_red
    en: I'd like to hear your thoughts in more detail.
    ko: 좀 더 구체적인 감상을 원합니다.
    ja: |-
      そうではなく、もう少し具体的に
      お願いできますか。
  d_nikke_marciana_marinestudy_01_28:
    speaker: "<Self>"
    en: Th-the colors of the shells really complement your red hair.
    ko: 조, 조개 색깔이 라피의 붉은 머리카락이랑 정말 잘 어울려.
    ja: |-
      か、貝殻の色がラピの赤い髪と
      よく似合っている
  d_nikke_marciana_marinestudy_01_29:
    speaker: rapi_red
    en: I see.
    ko: 그렇습니까.
    ja: ふふ、そうですか。
  d_nikke_marciana_marinestudy_01_30:
    speaker: marciana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_01_31:
    speaker: cinderella_s
    en: What about me, Prince?
    ko: 왕자님, 나는 어때?
    ja: 王子様、私はどうかしら？
  d_nikke_marciana_marinestudy_01_32:
    speaker: "<Self>"
    en: It looks great on you too, Cinderella.
    ko: 신데렐라도 정말 잘 어울려.
    ja: シンデレラも、とても似合っている
  d_nikke_marciana_marinestudy_01_33:
    speaker: cinderella_s
    en: You had so much more to say about Rapi. Is that really all you have to say
      about me?
    ko: 라피한테는 구체적인 감상을 들려줬으면서, 나한테는 그것 뿐이야?
    ja: |-
      ラピのことは細かく見ていたのに、
      私にはそれだけ？
  d_nikke_marciana_marinestudy_01_34:
    speaker: "<Self>"
    en: Th-those shells look like flowers, and I love how they go well with the flower
      accessories in your hair.
    ko: 조, 조개가 꽃처럼 생겨서 머리의 꽃장식이랑 매치되는 느낌이 좋아.
    ja: |-
      か、貝殻が花のような形をしているから、
      頭の花飾りとマッチしていて素敵だ
  d_nikke_marciana_marinestudy_01_35:
    speaker: cinderella_s
    en: Hehe...
    ko: "…후훗."
    ja: "…ふふっ。"
  d_nikke_marciana_marinestudy_01_36:
    speaker: marciana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_01_37:
    speaker: littlemermaid_s
    en: Ah woo...
    ko: 아우….
    ja: あう…
  d_nikke_marciana_marinestudy_01_38:
    speaker: cinderella_s
    en: Siren?
    ko: 세이렌?
    ja: セイレーン？
  d_nikke_marciana_marinestudy_01_39:
    speaker: cinderella_s
    en: You want to hear what the Prince thinks too?
    ko: 세이렌도 왕자님의 감상이 듣고 싶은 거야?
    ja: セイレーンも、王子様の感想が気になるの？
  d_nikke_marciana_marinestudy_01_40:
    speaker: littlemermaid_s
    en: I-I'm okay...
    ko: "[나, 나는 괜찮아….]"
    ja: "「う、ううん！私は大丈夫…」"
  d_nikke_marciana_marinestudy_01_41:
    speaker: cinderella_s
    en: Prince, tell Siren what you think too.
    ko: 왕자님, 세이렌에게도 감상을 들려줘.
    ja: 王子様、セイレーンにもお願いできるかしら？
  d_nikke_marciana_marinestudy_01_42:
    speaker: littlemermaid_s
    en: I'm really okay...!
    ko: "[정말 난 괜찮…!]"
    ja: "「ほ、本当に大丈夫だから…！」"
  d_nikke_marciana_marinestudy_01_43:
    speaker: "<Self>"
    en: The shells are just as colorful as your bubbles. The necklace suits you so
      well, it almost looks like it was yours all along.
    ko: 조개가 세이렌의 물거품 같이 알록달록해서, 원래 세이렌이 가지고 있던 목걸이라는 생각이 들 만큼 잘 어울려.
    ja: |-
      貝殻がセイレーンの水泡のように
      色とりどりで、まるで最初から
      身につけていたみたいにぴったりだな
  d_nikke_marciana_marinestudy_01_44:
    speaker: littlemermaid_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_marciana_marinestudy_01_45:
    speaker: littlemermaid_s
    en: Ah, ah woo...
    ko: 아, 아우….
    ja: あ、あう…
  d_nikke_marciana_marinestudy_01_46:
    speaker: "<Monologue>"
    en: Little Mermaid hides behind Cinderella, blushing.
    ko: 리틀 머메이드는 얼굴을 붉히며 신데렐라의 뒤로 숨었다.
    ja: |-
      リトルマーメイドは顔を赤らめながら
      シンデレラの後ろに隠れた
  d_nikke_marciana_marinestudy_01_47:
    speaker: rapi_red
    en: You told Siren exactly what you thought right away.
    ko: 세이렌에겐 바로 구체적인 감상을 들려주시는군요.
    ja: |-
      セイレーンには、
      すぐに具体的な感想をおっしゃるんですね。
  d_nikke_marciana_marinestudy_01_48:
    speaker: rapi_red
    en: I can't say I'm pleased with that.
    ko: 이건 조금 불만입니다.
    ja: 少し不満です。
  d_nikke_marciana_marinestudy_01_49:
    speaker: "<Self>"
    en: I figured you'd ask eventually, so I just did it ahead of time...
    ko: 어차피 요구할 테니까 미리 한 것 뿐이야….
    ja: |-
      どうせ聞かれるから、
      先に言っただけだ…
  d_nikke_marciana_marinestudy_01_50:
    speaker: marciana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_01_51:
    speaker: "<Monologue>"
    en: Marciana hangs back, watching everyone compare their seashell necklaces.
    ko: 마르차나는 한발짝 떨어져서, 조개 껍질 목걸이 품평회를 바라보고 있었다.
    ja: |-
      マルチャーナは少し離れた場所で、
      貝殻のネックレスの品評会をながめている
  d_nikke_marciana_marinestudy_01_52:
    speaker: naga_s
    en: Miss Marciana.
    ko: 마르차나 선생님.
    ja: マルチャーナ先生。
  d_nikke_marciana_marinestudy_01_53:
    speaker: marciana_s
    en: "... Yes?"
    ko: "…예?"
    ja: "…はい？"
  d_nikke_marciana_marinestudy_01_54:
    speaker: naga_s
    en: You don't seem very happy...
    ko: 표정이 안 좋아 보이시는데….
    ja: なんだか浮かない顔をされてますけど…
  d_nikke_marciana_marinestudy_01_55:
    speaker: naga_s
    en: Is the seashell necklace not to your liking?
    ko: 혹시 조개 껍질 목걸이가 마음에 안 드세요?
    ja: |-
      もしかして、貝殻のネックレスが
      気に入りませんでしたか？
  d_nikke_marciana_marinestudy_01_56:
    speaker: marciana_s
    en: N-no,
    ko: 아, 아뇨.
    ja: い、いいえ。
  d_nikke_marciana_marinestudy_01_57:
    speaker: marciana_s
    en: I do like it.
    ko: 마음에 듭니다.
    ja: もちろん気に入っています。
  d_nikke_marciana_marinestudy_01_58:
    speaker: marciana_s
    en: It's a beautiful necklace.
    ko: 정말 예쁜 목걸이네요.
    ja: とても素敵なネックレスですね。
  d_nikke_marciana_marinestudy_01_59:
    speaker: tia_l
    en: Did something happen?
    ko: 그러면 무슨 일 있으세요오~?
    ja: じゃあ、どうしたんですかぁ～？
  d_nikke_marciana_marinestudy_01_60:
    speaker: tia_l
    en: You seem really down...
    ko: 지금 엄청 표정이 어두우신데에….
    ja: 今、すごく暗い顔をされてましたけどぉ…
  d_nikke_marciana_marinestudy_01_61:
    speaker: marciana_s
    en: I'm probably just a little tired.
    ko: 그냥 조금 피곤한 거겠죠.
    ja: "…おそらく、少し疲れているのでしょう。"
  d_nikke_marciana_marinestudy_01_62:
    speaker: marciana_s
    en: It's nothing.
    ko: 아무 일 없습니다.
    ja: 何でもありません。
  d_nikke_marciana_marinestudy_01_63:
    speaker: marciana_s
    en: Thank you for your concern,
    ko: 걱정해줘서 고마워요.
    ja: ご心配いただき、ありがとうございます。
  d_nikke_marciana_marinestudy_01_64:
    speaker: marciana_s
    en: and thank you for the necklace, too.
    ko: 아, 목걸이도요.
    ja: それと、ネックレスも。
  d_nikke_marciana_marinestudy_01_65:
    speaker: "<Monologue>"
    en: Marciana walks away, leaving Naga and Tia behind.
    ko: 마르차나는 나가와 티아를 뒤로하고, 자리를 떠났다.
    ja: |-
      マルチャーナはナガとティアに背を向けると、
      その場から去っていった
  d_nikke_marciana_marinestudy_01_66:
    speaker: naga_s
    en: Don't you think Miss Marciana's acting a little strange?
    ko: 선생님, 뭔가 이상하지?
    ja: "…やっぱり、なんかおかしいよね？"
  d_nikke_marciana_marinestudy_01_67:
    speaker: tia_l
    en: Yeah...
    ko: 그러게에….
    ja: そうだねぇ…
  d_nikke_marciana_marinestudy_01_68:
    speaker: marciana_s
    en: "*Sigh*"
    ko: 하아.
    ja: はぁ…
  d_nikke_marciana_marinestudy_01_69:
    speaker: marciana_s
    en: I couldn't sleep, so I came out for a walk...
    ko: 도무지 잠이 오질 않아서 혼자 산책이라도 좀 하러 나왔는데….
    ja: |-
      どうしても眠れないから、
      散歩でもしようと外に出てきたけれど…
  d_nikke_marciana_marinestudy_01_70:
    speaker: marciana_s
    en: But it doesn't seem to be helping...
    ko: 별 소용은 없어 보이네….
    ja: あまり効果はなさそうね…
  d_nikke_marciana_marinestudy_01_71:
    speaker: "<Narration>"
    en: Marciana strolls along the beach.
    ko: 마르차나는 천천히 모래사장을 걷는다.
    ja: マルチャーナは静かに砂浜を歩いている
  d_nikke_marciana_marinestudy_01_72:
    speaker: marciana_s
    en: No matter how much fresh air I get...
    ko: 아무리 바람을 쐐 봐도….
    ja: いくら気分転換をしようとしても…
  d_nikke_marciana_marinestudy_01_73:
    speaker: marciana_s
    en: this heavy feeling in my chest just won't go away.
    ko: 가슴 속에 뭔가 얹혀 있는 듯한 이 답답함은 사라지질 않아.
    ja: |-
      胸の奥に何かがつかえているような
      もどかしさは、なかなか消えないわね。
  d_nikke_marciana_marinestudy_01_74:
    speaker: "<Narration>"
    en: Marciana places her hand on her chest.
    ko: 마르차나는 자신의 가슴에 손을 얹는다.
    ja: マルチャーナは自身の胸に手を当てた
  d_nikke_marciana_marinestudy_01_75:
    speaker: marciana_s
    en: What's this uneasy feeling...?
    ko: 이 답답한 기분은 대체 뭐지…?
    ja: このもどかしさは、いったい何なのかしら…？
  d_nikke_marciana_marinestudy_01_76:
    speaker: "<Narration>"
    en: Marciana quietly closes her eyes.
    ko: 마르차나는 조용히 눈을 감는다.
    ja: マルチャーナはゆっくりと目を閉じた
  d_nikke_marciana_marinestudy_01_77:
    speaker: marciana_s
    en: Naga and Tia gave each of us a pretty seashell necklace,
    ko: 나가와 티아가 예쁜 조개 껍질 목걸이를 선물해줬고.
    ja: |-
      ナガとティアが、きれいな貝殻の
      ネックレスをプレゼントしてくれて…
  d_nikke_marciana_marinestudy_01_78:
    speaker: marciana_s
    en: and everyone happily put theirs on.
    ko: 다들 기뻐하며 목에 걸었어.
    ja: みなさんが、嬉しそうに首にかけていた。
  d_nikke_marciana_marinestudy_01_79:
    speaker: "<Narration>"
    en: Marciana stops in her tracks and opens her eyes.
    ko: 마르차나는 걸음을 멈추고 눈을 떴다.
    ja: マルチャーナは足を止め、目を開いた
  d_nikke_marciana_marinestudy_01_80:
    speaker: marciana_s
    en: The Commander was just sharing his opinion on everyone's necklaces.
    ko: 그리고 지휘관님은 다른 분들에게 잘 어울린다고 감상을 말씀해주셨지.
    ja: |-
      そして、指揮官様はそれぞれに
      よく似合っていると感想を伝えて…
  d_nikke_marciana_marinestudy_01_81:
    speaker: marciana_s
    en: "... They were the ones who asked for his opinion."
    ko: "…다른 분들이 그저 지휘관님께 감상을 물어봤을 뿐이잖아."
    ja: |-
      …そうよ。みなさんは、
      ただ指揮官様に感想を聞いただけ。
  d_nikke_marciana_marinestudy_01_82:
    speaker: marciana_s
    en: It's not like I have any reason to let that bother me...
    ko: 내가 답답해할 만한 일은 아닌데….
    ja: 私がもどかしく感じる必要はないのに…
  d_nikke_marciana_marinestudy_01_83:
    speaker: "<Narration>"
    en: As if to soothe Marciana,
    ko: 바닷바람은 마르차나의 기분을 달래기라도 하듯.
    ja: |-
      その時、海風がまるでマルチャーナの
      揺れる心をなだめようとするかのように
  d_nikke_marciana_marinestudy_01_84:
    speaker: "<Narration>"
    en: the sea breeze gently brushes through her hair.
    ko: 살랑, 하고 마르차나의 머릿결을 어루만지며 지나갔다.
    ja: マルチャーナの髪をそっと撫でていった
  d_nikke_marciana_marinestudy_01_85:
    speaker: marciana_s
    en: "*Sigh...*"
    ko: 하아….
    ja: "…はぁ…"
d_nikke_marciana_marinestudy_02:
  d_nikke_marciana_marinestudy_02_1:
    speaker: "<Narration>"
    en: The next day...
    ko: 다음 날.
    ja: 翌日
  d_nikke_marciana_marinestudy_02_2:
    speaker: naga_s
    en: Tia, isn't that Miss Marciana over there?
    ko: 티아, 저기 마르차나 선생님 아니야?
    ja: |-
      ね、ティア。
      あれって、マルチャーナ先生じゃない？
  d_nikke_marciana_marinestudy_02_3:
    speaker: tia_l
    en: Huh? Where?
    ko: 으응~? 어디이~?
    ja: えぇ～？どこぉ～？
  d_nikke_marciana_marinestudy_02_4:
    speaker: "<Narration>"
    en: In the direction Naga points, Marciana can be seen walking by.
    ko: 나가가 가리키는 곳에 마르차나가 걸어 가고 있었다.
    ja: |-
      ティアはナガが指さした方向に目を向けると、
      マルチャーナが歩いているのが見えた
  d_nikke_marciana_marinestudy_02_5:
    speaker: tia_l
    en: You're right!
    ko: 진짜다!
    ja: ホントだ～！
  d_nikke_marciana_marinestudy_02_6:
    speaker: tia_l
    en: Miss Marciana!
    ko: 선생니임~!
    ja: せんせぇ～！
  d_nikke_marciana_marinestudy_02_7:
    speaker: "<Narration>"
    en: Naga and Tia walk over to Marciana.
    ko: 나가와 티아는 마르차나에게 다가갔다.
    ja: 二人はマルチャーナのもとへ駆けていった
  d_nikke_marciana_marinestudy_02_8:
    speaker: marciana_s
    en: Naga? Tia?
    ko: 나가? 티아?
    ja: "…ナガ？ティア？"
  d_nikke_marciana_marinestudy_02_9:
    speaker: tia_l
    en: We saw you passing by, so we thought we'd come say hi!
    ko: 선생님이 지나가고 계시길래 왔어요오~
    ja: |-
      先生が通りかかったのが見えたので、
      来ちゃいましたぁ～
  d_nikke_marciana_marinestudy_02_10:
    speaker: naga_s
    en: "... You seem exhausted."
    ko: "…뭔가 많이 피곤해 보이시네요."
    ja: "…なんか、かなりお疲れみたいですけど"
  d_nikke_marciana_marinestudy_02_11:
    speaker: naga_s
    en: Is something wrong?
    ko: 무슨 일 있으신가요?
    ja: 何かあったんですか？
  d_nikke_marciana_marinestudy_02_12:
    speaker: marciana_s
    en: No, nothing's wrong.
    ko: 아뇨, 아무 일 없습니다.
    ja: いえ、何でもありません。
  d_nikke_marciana_marinestudy_02_13:
    speaker: naga_s
    en: But you look really tired...
    ko: 아무 일 없다고 하기엔 너무 피곤해 보이시는데….
    ja: |-
      そういうわりには、
      かなり疲れてるみたいですけど…
  d_nikke_marciana_marinestudy_02_14:
    speaker: marciana_s
    en: It must be because I took a rather long walk last night.
    ko: 어젯밤에 산책을 좀 오래 해서 그럴 겁니다.
    ja: 昨日の夜、長めに散歩をしていたからでしょう。
  d_nikke_marciana_marinestudy_02_15:
    speaker: marciana_s
    en: I just had a lot on my mind.
    ko: 생각할 게 좀 있었거든요.
    ja: 少し考え事をしておりましたので。
  d_nikke_marciana_marinestudy_02_16:
    speaker: naga_s
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_marciana_marinestudy_02_17:
    speaker: tia_l
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_marciana_marinestudy_02_18:
    speaker: marciana_s
    en: I felt a little uneasy,
    ko: 가슴이 좀 답답했습니다.
    ja: |-
      突然、言いようのない
      もどかしさを感じてしまい…
  d_nikke_marciana_marinestudy_02_19:
    speaker: marciana_s
    en: so I went for a walk to get some fresh air...
    ko: 그래서 바닷바람 좀 쐬려고 산책을 했는데….
    ja: |-
      それで、少し海風に当たりたくて
      散歩に出かけたのですが…
  d_nikke_marciana_marinestudy_02_20:
    speaker: tia_l
    en: What's making you feel so uneasy?
    ko: 왜 답답하셨는데요?
    ja: |-
      あのぉ…なんで急に、
      もどかしくなったんですか？
  d_nikke_marciana_marinestudy_02_21:
    speaker: marciana_s
    en: I'm not sure...
    ko: 그냥….
    ja: それは…
  d_nikke_marciana_marinestudy_02_22:
    speaker: marciana_s
    en: I just felt kind of uneasy yesterday.
    ko: 그냥 어제 뭔가 답답했습니다.
    ja: |-
      …正直、よく分かりません。
      なぜか昨日は、もどかしさを
      感じてしまったのです。
  d_nikke_marciana_marinestudy_02_23:
    speaker: naga_s
    en: Something must've happened to make you feel this way,
    ko: 답답해진 계기가 있을 거잖아요.
    ja: |-
      でも、もどかしさを感じたきっかけが
      あるはずですよね。
  d_nikke_marciana_marinestudy_02_24:
    speaker: naga_s
    en: or maybe you can think back to when these feelings first started.
    ko: 아니면 언제부터 답답해지기 시작했다든지.
    ja: |-
      いつ頃からもどかしさを
      感じるようになったんですか？
  d_nikke_marciana_marinestudy_02_25:
    speaker: naga_s
    en: I can't promise we'll be able to fix it, but why don't you talk to us about
      it?
    ko: 해결해 드릴 수 있을지는 모르겠지만, 저희한테 한번 털어놔 보세요.
    ja: |-
      解決できるかどうかは分かりませんが、
      私たちに話してくれませんか？
  d_nikke_marciana_marinestudy_02_26:
    speaker: tia_l
    en: Yeah! They say a problem shared is a problem halved!
    ko: 맞아요! 고민은 나누면 반이 되잖아요~
    ja: |-
      そうですよぉ！悩んだ時は、
      誰かに話すと楽になるって言いますし！
  d_nikke_marciana_marinestudy_02_27:
    speaker: marciana_s
    en: The only thing I've figured out is that I started feeling this way after you
      handed out the necklaces yesterday.
    ko: 파악하고 있는 건, 어제 나가와 티아가 목걸이를 나눠준 이후에 답답해졌다는 것 뿐이에요.
    ja: |-
      …分かっているのは、昨日お二人が
      ネックレスをくださったあとから、もどかしさを
      感じるようになったということだけです。
  d_nikke_marciana_marinestudy_02_28:
    speaker: marciana_s
    en: More specifically, it started after the Commander said the necklaces looked
      good on everyone.
    ko: 정확히는 지휘관님이 다른 분들께 목걸이가 잘 어울린다고 감상을 들려준 뒤부터.
    ja: |-
      正確には、みなさんにネックレスが
      よく似合っていると指揮官様が
      感想を述べられたあとから…
  d_nikke_marciana_marinestudy_02_29:
    speaker: tia_l
    en: Oh, that sounds like—
    ko: 어, 그거….
    ja: えっ、それって…
  d_nikke_marciana_marinestudy_02_30:
    speaker: "<Narration>"
    en: Suddenly, Naga pokes Tia in the side.
    ko: 갑자기 나가가 티아의 허리춤을 찔렀다.
    ja: |-
      その時、ナガがティアの腰のあたりを
      軽くつついた
  d_nikke_marciana_marinestudy_02_31:
    speaker: tia_l
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_marciana_marinestudy_02_32:
    speaker: naga_s
    en: M-Miss Marciana! This sounds like a grown-up problem that's a little out of
      our league.
    ko: 서, 선생님! 역시 어른들의 일을 저희가 어떻게 할 수는 없나 봐요.
    ja: |-
      せ、先生！やっぱりオトナのことは
      私たちじゃどうすることもできなさそうです。
  d_nikke_marciana_marinestudy_02_33:
    speaker: naga_s
    en: I'm sorry, I don't think we can be of much help.
    ko: 도움이 되어드리진 못할 것 같아요. 죄송해요.
    ja: お役に立てずごめんなさい。
  d_nikke_marciana_marinestudy_02_34:
    speaker: marciana_s
    en: No, it's fine.
    ko: 아닙니다.
    ja: いえ、気にしないでください。
  d_nikke_marciana_marinestudy_02_35:
    speaker: marciana_s
    en: I'm just grateful you took the time to listen.
    ko: 제 고민을 들어준 것만으로도 감사하죠.
    ja: |-
      こうして悩みを聞いてくださっただけでも、
      感謝していますので。
  d_nikke_marciana_marinestudy_02_36:
    speaker: naga_s
    en: All right, we should get going now.
    ko: 그럼 저희는 이만 가볼게요.
    ja: それじゃ、私たちはこれで失礼しますね。
  d_nikke_marciana_marinestudy_02_37:
    speaker: naga_s
    en: Come on, Tia.
    ko: 가자, 티아.
    ja: 行こ、ティア。
  d_nikke_marciana_marinestudy_02_38:
    speaker: tia_l
    en: O-okay...!
    ko: 으, 응…!
    ja: う、うん…！
  d_nikke_marciana_marinestudy_02_39:
    speaker: "<Narration>"
    en: Naga and Tia run off in the direction Marciana came from.
    ko: 나가와 티아는 마르차나가 오던 방향으로 달려갔다.
    ja: |-
      ナガとティアはマルチャーナと
      反対の方向へ駆けていった
  d_nikke_marciana_marinestudy_02_40:
    speaker: naga_s
    en: You noticed it too, didn't you, Tia?
    ko: 티아, 눈치챘어?
    ja: "…ティア、気づいてる？"
  d_nikke_marciana_marinestudy_02_41:
    speaker: tia_l
    en: That Miss Marciana's jealous?
    ko: 마르차나 선생님이 질투를 한다는 거 말이지~?
    ja: |-
      マルチャーナ先生が
      ヤキモチやいてることでしょぉ～？
  d_nikke_marciana_marinestudy_02_42:
    speaker: tia_l
    en: Why didn't you say anything?
    ko: 근데 왜 말씀 안 드린 거야~?
    ja: でも、なんで言わなかったのぉ～？
  d_nikke_marciana_marinestudy_02_43:
    speaker: tia_l
    en: We could've just told her right away!
    ko: 아까 바로 말씀드려도 되지 않았을까아~
    ja: その場で教えてあげてもよかったのに～
  d_nikke_marciana_marinestudy_02_44:
    speaker: naga_s
    en: I just figured we might be able to help.
    ko: 뭔가 우리가 도움이 되어 드릴 수 있을 것 같았거든.
    ja: |-
      だって、私たちにも手伝えることが
      ありそうだなって思ったから。
  d_nikke_marciana_marinestudy_02_45:
    speaker: tia_l
    en: Help...?
    ko: 도움…?
    ja: 手伝えること？
  d_nikke_marciana_marinestudy_02_46:
    speaker: naga_s
    en: Yeah, that's right.
    ko: 그래, 도움.
    ja: うん、手伝えること。
  d_nikke_marciana_marinestudy_02_47:
    speaker: naga_s
    en: If things go well, we might even see a different side of her and Teacher.
    ko: 우리가 잘만 하면, 두 선생님의 좋은 모습을 볼 수 있을지도 몰라.
    ja: |-
      うまくいけば、先生たちの一歩進んだ関係が
      見られるかも。
  d_nikke_marciana_marinestudy_02_48:
    speaker: naga_s
    en: "... All right, let's start planning."
    ko: "…지금부터 계획을 세워보자."
    ja: "…てことで、さっそく計画立てよっ。"
  d_nikke_marciana_marinestudy_02_49:
    speaker: naga_s
    en: Miss Marciana!
    ko: 선생님!
    ja: 先生！
  d_nikke_marciana_marinestudy_02_50:
    speaker: tia_l
    en: Miss Marcianaaa!
    ko: 선생니임~!
    ja: せんせぇ～！
  d_nikke_marciana_marinestudy_02_51:
    speaker: "<Narration>"
    en: Naga and Tia rush over to find Marciana.
    ko: 나가와 티아가 마르차나를 찾아 달려왔다.
    ja: |-
      ナガとティアが再びマルチャーナのもとへ
      駆け寄った
  d_nikke_marciana_marinestudy_02_52:
    speaker: marciana_s
    en: What's going on? I thought you two had rushed off to handle something urgent.
    ko: 무슨 일 있나요? 급한 일이 있어서 간 줄 알았는데.
    ja: |-
      どうしたのですか？
      てっきり急用があってどこかに行かれたのかと…
  d_nikke_marciana_marinestudy_02_53:
    speaker: tia_l
    en: We have a favor to ask, Miss Marciana.
    ko: 마르차나 선생님께 부탁드리고 싶은 일이 있어서요~
    ja: |-
      実は、マルチャーナ先生に
      お願いしたいことがあるんです～
  d_nikke_marciana_marinestudy_02_54:
    speaker: naga_s
    en: About the seashell necklaces we made for you yesterday...
    ko: 저희가 어제 만들어드렸던 조개 껍질 목걸이 있잖아요.
    ja: |-
      昨日、みんなに貝殻のネックレスを
      渡したじゃないですか。
  d_nikke_marciana_marinestudy_02_55:
    speaker: naga_s
    en: We were thinking of making a few more, but we just haven't had the time to
      collect more shells.
    ko: 그걸 좀 더 만들까 하는데, 지금 조개 껍질을 주우러 갈 시간이 없어요.
    ja: |-
      あれをもっと作ろうかと思ってるんですけど、
      今、貝殻を拾いに行く時間がなくて。
  d_nikke_marciana_marinestudy_02_56:
    speaker: naga_s
    en: So if it's not too much trouble, would you mind helping us gather some?
    ko: 그래서 정말 죄송하지만, 선생님이 조개 껍질을 좀 주워다 주실 수 없을까 해서….
    ja: |-
      それで、本当に申し訳ないんですが、
      先生に貝殻を拾ってきてもらえないかな～と
      思いまして…
  d_nikke_marciana_marinestudy_02_57:
    speaker: naga_s
    en: Sorry for asking something like this when you probably already have enough
      on your plate.
    ko: 답답해서 마음도 심란하실 텐데, 이런 부탁드려서 죄송해요.
    ja: |-
      心がモヤモヤしている時に、
      こんなお願いをしちゃって悪いんですが…
  d_nikke_marciana_marinestudy_02_58:
    speaker: marciana_s
    en: It's fine. If anything, collecting seashells might help me clear my mind,
      so it doesn't sound too bad.
    ko: 괜찮습니다. 조개라도 주우면서 마음을 비울 수 있을 테니, 오히려 좋겠죠.
    ja: |-
      構いませんよ。貝殻を拾っている間は
      心を無にできるでしょうから、
      むしろちょうどいいかもしれません。
  d_nikke_marciana_marinestudy_02_59:
    speaker: naga_s
    en: Really? You don't mind?
    ko: 정말이죠? 정말 부탁드려도 되는 거죠?
    ja: ホントですか？じゃあ、お願いできますか？
  d_nikke_marciana_marinestudy_02_60:
    speaker: marciana_s
    en: Of course not.
    ko: 물론입니다.
    ja: ええ。
  d_nikke_marciana_marinestudy_02_61:
    speaker: marciana_s
    en: How many seashells should I collect?
    ko: 조개는 얼마나 주워오면 되죠?
    ja: |-
      それで、貝殻はどれくらい
      拾ってくればよろしいですか？
  d_nikke_marciana_marinestudy_02_62:
    speaker: tia_l
    en: Tons!
    ko: 많이요~
    ja: それはもう、た～っくさんです！
  d_nikke_marciana_marinestudy_02_63:
    speaker: marciana_s
    en: What do you mean by "tons," exactly...?
    ko: 그러니까 얼마나 많이….
    ja: ええと、そのたくさんというのは具体的に…
  d_nikke_marciana_marinestudy_02_64:
    speaker: naga_s
    en: The more, the better!
    ko: 최대한 많으면 많을 수록 좋아요.
    ja: 多ければ多いほどいいですね。
  d_nikke_marciana_marinestudy_02_65:
    speaker: marciana_s
    en: "... Understood. I'll collect as many as I can."
    ko: "…일단 알겠습니다. 주울 수 있는 만큼 최대한 주워보죠."
    ja: |-
      …ひとまず分かりました。
      拾えるだけ拾ってみますね。
  d_nikke_marciana_marinestudy_02_66:
    speaker: marciana_s
    en: Any kind of seashell from the beach will do?
    ko: 해변에 있는 아무 조개면 될까요?
    ja: 海辺にある貝殻なら何でも構いませんか？
  d_nikke_marciana_marinestudy_02_67:
    speaker: tia_l
    en: Yeah!
    ko: 네~!
    ja: は～い！
  d_nikke_marciana_marinestudy_02_68:
    speaker: marciana_s
    en: I'll be on my way, then.
    ko: 그럼 다녀오겠습니다.
    ja: では、行ってきます。
  d_nikke_marciana_marinestudy_02_69:
    speaker: tia_l
    en: Whew, good thing she didn't ask anything else.
    ko: 선생님이 아무것도 물어보지 않으셔서 다행이야~
    ja: ふぅ…先生が何も聞いてこなくてよかったぁ～
  d_nikke_marciana_marinestudy_02_70:
    speaker: tia_l
    en: I haven't even come up with an excuse yet, hehe.
    ko: 무슨 핑계를 대야할 지는 생각해둔 게 없었는데에~
    ja: |-
      なんてごまかすかは
      まだ考えてなかったもんねぇ～
  d_nikke_marciana_marinestudy_02_71:
    speaker: naga_s
    en: All right then, let's go find Teacher.
    ko: 그럼 이제 우리는 다른 선생님을 찾아가볼까.
    ja: |-
      それじゃ、もう一人の先生のところに
      行ってみよっか。
  d_nikke_marciana_marinestudy_02_72:
    speaker: "<Narration>"
    en: Naga and Tia move on to their next target.
    ko: 나가와 티아는 다음 타겟을 찾아 이동했다.
    ja: ナガとティアは次のターゲットのもとに移動した
  d_nikke_marciana_marinestudy_02_73:
    speaker: naga_s
    en: Teacher!
    ko: 선생님!
    ja: 先生！
  d_nikke_marciana_marinestudy_02_74:
    speaker: tia_l
    en: Teaaacher!
    ko: 선생니임~!
    ja: せんせぇ～！
  d_nikke_marciana_marinestudy_02_75:
    speaker: "<Self>"
    en: Naga? Tia?
    ko: 나가? 티아?
    ja: ナガ？ティア？どうしたんだ？
  d_nikke_marciana_marinestudy_02_76:
    speaker: naga_s
    en: Sorry to bother you, but we've got a somewhat urgent favor to ask. Is now
      a good time?
    ko: 좀 급하게 부탁드릴 게 있는데, 괜찮을까요?
    ja: |-
      ちょっと急なお願いがあるんですけど、
      いま大丈夫ですか？
  d_nikke_marciana_marinestudy_02_77:
    speaker: "<Self>"
    en: What do you need?
    ko: 무슨 부탁인데?
    ja: どんなお願いだ？
  d_nikke_marciana_marinestudy_02_78:
    speaker: naga_s
    en: Miss Marciana hurried off to search for something important
    ko: 마르차나 선생님이 급히 찾을 게 있다고 어딜 좀 가셨거든요.
    ja: |-
      実は、マルチャーナ先生が急に
      集めるものがあるって言って、
      どこかに行っちゃったんです。
  d_nikke_marciana_marinestudy_02_79:
    speaker: naga_s
    en: and asked us to send someone over to help.
    ko: 근데 도와줄 사람이 있었으면 좋겠으니까, 좀 불러와 달라고 하셨어요.
    ja: |-
      それで、手伝ってくれる人が欲しいから
      誰か呼んできてと言われまして。
  d_nikke_marciana_marinestudy_02_80:
    speaker: "<Self>"
    en: Where did she go?
    ko: 어디로 가면 돼?
    ja: どこに行けばいいんだ？
  d_nikke_marciana_marinestudy_02_81:
    speaker: naga_s
    en: That beach over there.
    ko: 저쪽에 있는 해변가요.
    ja: あっちの海辺です。
  d_nikke_marciana_marinestudy_02_82:
    speaker: "<Monologue>"
    en: Naga points the way I need to go.
    ko: 나가가 가야할 곳을 손가락으로 가리켰다.
    ja: ナガは行き先を指さした
  d_nikke_marciana_marinestudy_02_83:
    speaker: "<Self>"
    en: Got it. I'll get going...
    ko: 알았어. 지금 출발할….
    ja: 分かった。今から行って…
  d_nikke_marciana_marinestudy_02_84:
    speaker: tia_l
    en: Oopsies!
    ko: 아앗~!
    ja: ああ～っ！
  d_nikke_marciana_marinestudy_02_85:
    speaker: "<Monologue>"
    en: Tia deliberately drops a handwritten note in plain sight.
    ko: 티아가 보란 듯이 한 장의 쪽지를 떨어트렸다.
    ja: ティアがわざとらしく1枚のメモを落とした
  d_nikke_marciana_marinestudy_02_86:
    speaker: tia_l
    en: Oh no, my super-secret note!
    ko: 내 비밀 쪽지가 떨어졌네에~
    ja: 秘密のメモが落ちちゃったぁ～！
  d_nikke_marciana_marinestudy_02_87:
    speaker: tia_l
    en: Where did it go?
    ko: 근데 쪽지가 어디 갔는지 모르겠는거얼~
    ja: え～ん、どこに行ったのかなぁ～？
  d_nikke_marciana_marinestudy_02_88:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_02_89:
    speaker: "<Monologue>"
    en: I pick up the note from the ground.
    ko: 떨어진 쪽지를 주웠다.
    ja: 落ちたメモを拾った
  d_nikke_marciana_marinestudy_02_90:
    speaker: naga_s
    en: We have something to take care of, so we should get going now.
    ko: 선생님, 저희는 바쁜 일이 있어서 이만 가 볼게요.
    ja: |-
      他の用事があるので、
      私たちはこれで失礼しますね。
  d_nikke_marciana_marinestudy_02_91:
    speaker: "<Self>"
    en: Wait, but your note...
    ko: 아니, 이 쪽지는 가져가야….
    ja: 待て、その前にこのメモを受け取っ…
  d_nikke_marciana_marinestudy_02_92:
    speaker: naga_s
    en: See you later, Teacher!
    ko: 그럼 가보겠습니다!
    ja: それじゃ先生、あとはよろしくお願いします！
  d_nikke_marciana_marinestudy_02_93:
    speaker: tia_l
    en: Bye-bye, Teacher!
    ko: 바이 바이~ 선생니임~
    ja: せんせぇ～、バイバ～イ！
  d_nikke_marciana_marinestudy_02_94:
    speaker: "<Monologue>"
    en: Naga and Tia hurry off.
    ko: 나가와 티아는 급히 자리를 떴고.
    ja: ナガとティアは急いでその場を離れていった
  d_nikke_marciana_marinestudy_02_95:
    speaker: "<Monologue>"
    en: I unfold the note and read it.
    ko: 나는 일단 쪽지를 펴서 확인했다.
    ja: |-
      残された私はひとまずメモを広げ、
      内容を確認した
  d_nikke_marciana_marinestudy_02_96:
    speaker: "<Self>"
    en: They could've just told me straight up...
    ko: "…이런 건 그냥 솔직하게 말해도 되는데."
    ja: |-
      …こういうことは、
      正直に言ってくれていいのだが…
  d_nikke_marciana_marinestudy_02_97:
    speaker: "<Monologue>"
    en: The note reads, "Please take good care of Miss Marciana!"
    ko: 쪽지에는 [마르차나 선생님을 잘 부탁해요!] 라고 적혀 있었다.
    ja: |-
      メモには、「マルチャーナ先生を
      よろしくお願いします！」と書かれていた
d_nikke_marciana_marinestudy_03:
  d_nikke_marciana_marinestudy_03_1:
    speaker: "<Monologue>"
    en: I head in the direction Naga pointed and spot Marciana.
    ko: 나가가 가르킨 방향으로 와보니 마르차나가 있었다.
    ja: |-
      ナガが指さした方向に足を運んでみると、
      マルチャーナがいた
  d_nikke_marciana_marinestudy_03_2:
    speaker: marciana_s
    en: My hands are pretty full...
    ko: 슬슬 손에 담기는 힘들겠는데….
    ja: そろそろ手に収まらなくなってきたわね…
  d_nikke_marciana_marinestudy_03_3:
    speaker: marciana_s
    en: Maybe I can fit some more inside my clothes?
    ko: 옷 안에 넣어가면 더 담을 수 있을까?
    ja: 服の中に入れれば、もう少し持てるかしら？
  d_nikke_marciana_marinestudy_03_4:
    speaker: "<Self>"
    en: Marciana.
    ko: 마르차나.
    ja: マルチャーナ
  d_nikke_marciana_marinestudy_03_5:
    speaker: marciana_s
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_marciana_marinestudy_03_6:
    speaker: marciana_s
    en: C-Commander?! What brings you here...?
    ko: 지, 지휘관님?! 여긴 어쩐 일로….
    ja: し、指揮官様！？どうしてここに…
  d_nikke_marciana_marinestudy_03_7:
    speaker: "<Self>"
    en: I heard you were collecting seashells, so I'm here to help.
    ko: 마르차나가 조개를 줍고 있다고 들어서, 좀 도와주려고.
    ja: |-
      マルチャーナが貝殻を集めていると
      聞いて、手伝おうと思ってな
  d_nikke_marciana_marinestudy_03_8:
    speaker: marciana_s
    en: Did Naga and Tia send you here?
    ko: 혹시 나가랑 티아에게 들으셨습니까?
    ja: もしかして、ナガとティアから聞いたのですか？
  d_nikke_marciana_marinestudy_03_9:
    speaker: "<Self>"
    en: Yeah, that's part of it, but I also just wanted to spend some time with you.
    ko: 그것도 있는데, 그냥 내가 마르차나랑 같이 있고 싶어서 왔어.
    ja: |-
      それもあるが、ただマルチャーナと
      一緒にいたくて来たんだ
  d_nikke_marciana_marinestudy_03_10:
    speaker: marciana_s
    en: S-spend some time with...
    ko: 저, 저랑 같이 있고 싶….
    ja: わ、私と一緒にいたい…
  d_nikke_marciana_marinestudy_03_11:
    speaker: marciana_s
    en: Ahem.
    ko: 크흠.
    ja: オホンッ。
  d_nikke_marciana_marinestudy_03_12:
    speaker: "<Monologue>"
    en: Marciana fixes her hair and straightens her clothes.
    ko: 마르차나가 머리와 옷매무새를 정리했다.
    ja: マルチャーナは髪と身だしなみを整えた
  d_nikke_marciana_marinestudy_03_13:
    speaker: marciana_s
    en: I'd appreciate your help, Commander.
    ko: 그럼 지휘관님의 도움은 감사히 받도록 하겠습니다.
    ja: |-
      では、せっかくですので指揮官様の
      ご厚意に甘えさせていただきますね。
  d_nikke_marciana_marinestudy_03_14:
    speaker: marciana_s
    en: If you don't mind, could you collect some pretty seashells for me?
    ko: 주우실 때, 가능하면 예쁜 조개들로 부탁드립니다.
    ja: |-
      拾う際は、なるべくきれいな貝殻を
      お願いいたします。
  d_nikke_marciana_marinestudy_03_15:
    speaker: "<Self>"
    en: Sure thing.
    ko: 알았어.
    ja: 分かった
  d_nikke_marciana_marinestudy_03_16:
    speaker: "<Self>"
    en: Are Naga and Tia planning to make seashell necklaces again?
    ko: 그런데 나가랑 티아는 또 조개 껍질 목걸이를 만드려고 하는 거야?
    ja: |-
      ところで、ナガとティアは
      また貝殻のネックレスを作るつもりなのか？
  d_nikke_marciana_marinestudy_03_17:
    speaker: marciana_s
    en: That's what I heard.
    ko: 그렇다고 들었습니다.
    ja: ええ、そう聞きました。
  d_nikke_marciana_marinestudy_03_18:
    speaker: marciana_s
    en: Like the ones they made for us yesterday...
    ko: 어제 만들어서 저희들에게 줬던 것처럼….
    ja: |-
      昨日、手作りして
      私たちに贈ってくださったもののように…
  d_nikke_marciana_marinestudy_03_19:
    speaker: marciana_s
    en: Yesterday...
    ko: 어제… 만들었던….
    ja: そう…昨日…
  d_nikke_marciana_marinestudy_03_20:
    speaker: marciana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_03_21:
    speaker: "<Self>"
    en: Marciana?
    ko: 마르차나?
    ja: マルチャーナ？
  d_nikke_marciana_marinestudy_03_22:
    speaker: marciana_s
    en: Yes?
    ko: 예.
    ja: あっ、はい。
  d_nikke_marciana_marinestudy_03_23:
    speaker: "<Self>"
    en: You suddenly looked troubled, so I was wondering if something was wrong.
    ko: 갑자기 마르차나 표정이 어두워지길래, 무슨 일 있나 해서.
    ja: 急に浮かない顔をして、どうしたんだ？
  d_nikke_marciana_marinestudy_03_24:
    speaker: marciana_s
    en: I must be a little tired after taking such a long walk last night.
    ko: 어제 저녁에 산책을 좀 오래 했더니, 좀 피곤했던 모양이네요.
    ja: |-
      昨晩、長めに散歩をしたせいか、
      少し疲れているようです。
  d_nikke_marciana_marinestudy_03_25:
    speaker: marciana_s
    en: There's nothing to worry about.
    ko: 아무 일도 없습니다.
    ja: ご心配には及びません。
  d_nikke_marciana_marinestudy_03_26:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_03_27:
    speaker: "<Self>"
    en: Come to think of it, you're not wearing your necklace.
    ko: 그러고 보니, 마르차나는 목걸이를 안 차고 있네?
    ja: |-
      そういえば、マルチャーナは
      ネックレスをつけていないんだな？
  d_nikke_marciana_marinestudy_03_28:
    speaker: marciana_s
    en: I left it safely stored on the boat we'll be taking back.
    ko: 목걸이는 돌아갈 보트에 잘 보관해 두었습니다.
    ja: |-
      ネックレスは、帰る際に乗るボートに
      きちんと保管してあります。
  d_nikke_marciana_marinestudy_03_29:
    speaker: marciana_s
    en: I was afraid it might get damaged if I wore it around.
    ko: 차고 다녔다가 괜히 망가질 것 같아서요.
    ja: |-
      身につけたままでは、
      うっかり壊してしまいそうですので。
  d_nikke_marciana_marinestudy_03_30:
    speaker: marciana_s
    en: I know it's a little strange to keep a gift stored away when it was meant
      to be worn...
    ko: 차고 다니라고 준 선물을 보관만 해두는 건 좀 이상하지만….
    ja: |-
      …身につけてほしくて贈られたものを
      ただ保管しておくというのも、
      少しおかしいかもしれませんが…
  d_nikke_marciana_marinestudy_03_31:
    speaker: marciana_s
    en: but that's how much I treasure it.
    ko: 그만큼 소중하게 여기고 싶었습니다.
    ja: それだけ大切にしたいと思ったのです。
  d_nikke_marciana_marinestudy_03_32:
    speaker: "<Self>"
    en: That's a shame.
    ko: 그건 아쉽네.
    ja: それは残念だな
  d_nikke_marciana_marinestudy_03_33:
    speaker: marciana_s
    en: A shame...?
    ko: 아쉬우시다고요…?
    ja: えっ…？
  d_nikke_marciana_marinestudy_03_34:
    speaker: "<Self>"
    en: It looked really good on you.
    ko: 마르차나한테 엄청 잘 어울렸거든.
    ja: マルチャーナによく似合っていたから
  d_nikke_marciana_marinestudy_03_35:
    speaker: marciana_s
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_marciana_marinestudy_03_36:
    speaker: marciana_s
    en: Is that so...?
    ko: 그렇습니까…?
    ja: そ、そうでしょうか…？
  d_nikke_marciana_marinestudy_03_37:
    speaker: "<Self>"
    en: It looked especially good with your penguin suit.
    ko: 특히 그 펭귄 수트랑 잘 어울렸어.
    ja: |-
      ああ、そのペンギンスーツと
      よく似合っていた
  d_nikke_marciana_marinestudy_03_38:
    speaker: "<Self>"
    en: I don't know how to describe it... It was both cute and pretty.
    ko: 귀여운 거랑 예쁜 게 같이 있는 느낌이라고 할까.
    ja: |-
      かわいらしさと美しさ、
      どちらも兼ね備えているというか
  d_nikke_marciana_marinestudy_03_39:
    speaker: marciana_s
    en: Th-thank you...
    ko: 가, 감사합니다….
    ja: あ、ありがとうございます…
  d_nikke_marciana_marinestudy_03_40:
    speaker: "<Monologue>"
    en: Marciana blushes and averts her gaze.
    ko: 마르차나는 얼굴을 붉히며 시선을 떨궜다.
    ja: |-
      マルチャーナは顔を赤らめながら
      視線をそらした
  d_nikke_marciana_marinestudy_03_41:
    speaker: marciana_s
    en: Th-then shall we keep collecting seashells?
    ko: 그, 그럼 조개를 마저 주워볼까요!
    ja: で、では、引き続き貝殻を拾いましょうか！
  d_nikke_marciana_marinestudy_03_42:
    speaker: "<Self>"
    en: Yeah, let's.
    ko: 그래, 같이 줍자.
    ja: そうだな、今度は一緒に拾おう
  d_nikke_marciana_marinestudy_03_43:
    speaker: "<Monologue>"
    en: We wander along the beach, picking up seashells.
    ko: 우리는 모래사장을 돌아다니며 조개를 주웠다.
    ja: |-
      そうして私たちは、砂浜を歩き回りながら
      貝殻を拾っていった
  d_nikke_marciana_marinestudy_03_44:
    speaker: marciana_s
    en: This shell has a lovely pink hue. It would suit Tia nicely.
    ko: 이 조개는 분홍빛이 도는 걸 보니, 티아에게 어울리겠네요.
    ja: |-
      この貝殻はピンクがかった色をしていますから、
      ティアに似合いそうですね。
  d_nikke_marciana_marinestudy_03_45:
    speaker: marciana_s
    en: And this one would be perfect for Naga...
    ko: 이건 나가에게….
    ja: あ、こちらのはナガに…
  d_nikke_marciana_marinestudy_03_46:
    speaker: "<Self>"
    en: You're serious even when you're just picking up seashells.
    ko: 마르차나는 조개 하나 줍는데도 진지하네.
    ja: |-
      マルチャーナは、貝殻一つ
      拾うのにも真剣なんだな
  d_nikke_marciana_marinestudy_03_47:
    speaker: marciana_s
    en: Of course. My students asked me to do this, so I can't afford to take it lightly.
    ko: |-
      학생들에게 부탁 받은 일이니까요.
      부탁 받은 이상, 소홀히 할 수는 없습니다.
    ja: |-
      生徒から頼まれたことですから、
      手を抜くわけにはいきません。
  d_nikke_marciana_marinestudy_03_48:
    speaker: "<Self>"
    en: Then who do you think this would look good on?
    ko: 그럼 이건 누구한테 어울릴 것 같아?
    ja: |-
      そうだな。
      ところで、これは誰に似合うと思う？
  d_nikke_marciana_marinestudy_03_49:
    speaker: "<Monologue>"
    en: I hold out a small, round seashell to her.
    ko: 나는 작고 둥근 조개 하나를 내밀었다.
    ja: 私は小さくて丸い貝殻を1つ差し出した
  d_nikke_marciana_marinestudy_03_50:
    speaker: marciana_s
    en: Hm... Let's see.
    ko: 음… 글쎄요.
    ja: ええと…そうですね。
  d_nikke_marciana_marinestudy_03_51:
    speaker: marciana_s
    en: It's a lovely color... Wouldn't it suit Cinderella or Siren better?
    ko: 색이 곱긴 한데… 신데렐라나 세이렌에게 어울리지 않을까요?
    ja: |-
      色がとてもきれいですので…
      シンデレラやセイレーンに
      似合うのではないでしょうか？
  d_nikke_marciana_marinestudy_03_52:
    speaker: "<Self>"
    en: I picked it up because I thought it would look good on you.
    ko: 난 마르차나한테 잘 어울릴 것 같아서 주웠는데.
    ja: |-
      私は、マルチャーナに似合うと思って
      拾ったんだがな
  d_nikke_marciana_marinestudy_03_53:
    speaker: marciana_s
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_marciana_marinestudy_03_54:
    speaker: marciana_s
    en: M-me...?
    ko: 저, 저요…?
    ja: わ、私ですか…？
  d_nikke_marciana_marinestudy_03_55:
    speaker: "<Self>"
    en: Yeah, I'd like you to have it.
    ko: 응. 받아줄래?
    ja: ああ、受け取ってくれるか？
  d_nikke_marciana_marinestudy_03_56:
    speaker: marciana_s
    en: "... Thank you, I'll be sure to cherish it."
    ko: "…감사합니다. 소중히 간직하겠습니다."
    ja: |-
      …ありがとうございます。
      大切にしまっておきます。
  d_nikke_marciana_marinestudy_03_57:
    speaker: "<Monologue>"
    en: Marciana carefully takes the seashell with both hands.
    ko: 마르차나는 조개를 두 손으로 조심스럽게 받아 들었다.
    ja: マルチャーナは両手で貝殻を慎重に受け取った
  d_nikke_marciana_marinestudy_03_58:
    speaker: marciana_s
    en: He picked this out just for me...
    ko: 지휘관님께서 골라주신 조개 껍질….
    ja: 指揮官様が選んでくださった貝殻…
  d_nikke_marciana_marinestudy_03_59:
    speaker: "<Monologue>"
    en: While Marciana is admiring the seashell, a smooth pebble catches my eye.
    ko: 마르차나가 조개를 바라보고 있을 때, 맨들거리는 조약돌 하나가 내 눈에 들어왔다.
    ja: |-
      マルチャーナが貝殻を見つめている横で、
      つるつるとした小石がふと目に留まった
  d_nikke_marciana_marinestudy_03_60:
    speaker: marciana_s
    en: I'll keep this shell with the necklace I received yesterday...
    ko: 그럼 이 조개는 어제 받은 목걸이랑 같이 두도록….
    ja: |-
      では、この貝殻は昨日いただいた
      ネックレスと一緒に保管して…
  d_nikke_marciana_marinestudy_03_61:
    speaker: marciana_s
    en: "... Commander?"
    ko: "…지휘관님?"
    ja: "…指揮官様？"
  d_nikke_marciana_marinestudy_03_62:
    speaker: marciana_s
    en: What are you looking at so intently?
    ko: 뭘 그렇게 유심히 보고 계십니까?
    ja: 何をそんなにじっと見ていらっしゃるのですか？
  d_nikke_marciana_marinestudy_03_63:
    speaker: "<Self>"
    en: I was just looking around for more seashells.
    ko: 더 챙길만한 조개가 없을까 둘러 보고 있었어.
    ja: |-
      他によさそうな貝殻がないか、
      あたりを見回していたんだ
  d_nikke_marciana_marinestudy_03_64:
    speaker: "<Monologue>"
    en: I slip the pebble into my pocket while Marciana isn't looking.
    ko: 나는 마르차나 몰래 조약돌을 주머니에 챙겼다.
    ja: |-
      私はマルチャーナに内緒で
      小石をポケットにしまった
  d_nikke_marciana_marinestudy_03_65:
    speaker: marciana_s
    en: We have enough shells now,
    ko: 이제 조개는 충분합니다.
    ja: さて、これで貝殻は十分でしょう。
  d_nikke_marciana_marinestudy_03_66:
    speaker: marciana_s
    en: or rather, we can't carry any more.
    ko: 더 챙길 손이 없다고 하는 게 정확하겠군요.
    ja: |-
      正確には、「これ以上は持てない」と
      言うべきですね。
  d_nikke_marciana_marinestudy_03_67:
    speaker: marciana_s
    en: Shall we head back and give them to Naga and Tia?
    ko: 그럼… 이만 돌아가서 나가와 티아에게 조개를 전달해 줄까요.
    ja: |-
      では…そろそろ戻って、
      ナガとティアに貝殻を渡しにいきましょうか。
  d_nikke_marciana_marinestudy_03_68:
    speaker: "<Self>"
    en: Before that, let's take a stroll along the beach.
    ko: 그전에, 잠깐 해변이나 같이 걷다가 갈까.
    ja: |-
      その前に、少しだけ海辺を
      散歩してから行かないか？
  d_nikke_marciana_marinestudy_03_69:
    speaker: marciana_s
    en: The beach?
    ko: 해변을요?
    ja: 海辺を、ですか？
  d_nikke_marciana_marinestudy_03_70:
    speaker: "<Self>"
    en: Yeah, since the weather's nice and all.
    ko: 응. 모처럼 날씨도 좋으니까.
    ja: ああ、せっかく天気もいいし
  d_nikke_marciana_marinestudy_03_71:
    speaker: marciana_s
    en: I suppose if it's not a very long stroll, then...
    ko: 잠깐… 이라면, 괜찮겠죠.
    ja: それは…分かりました。
  d_nikke_marciana_marinestudy_03_72:
    speaker: marciana_s
    en: Sure, okay.
    ko: 알겠습니다.
    ja: "…少しだけなら。"
  d_nikke_marciana_marinestudy_03_73:
    speaker: "<Monologue>"
    en: We walk side by side along the shore.
    ko: 우리는 나란히 서서 해변가를 걸었다.
    ja: 私たちは並んで海辺を歩いた
  d_nikke_marciana_marinestudy_03_74:
    speaker: "<Self>"
    en: Marciana, you still look pretty tense.
    ko: 마르차나, 표정이 아직도 좀 굳어 있네.
    ja: まだ少し表情がぎこちないな
  d_nikke_marciana_marinestudy_03_75:
    speaker: marciana_s
    en: "... You could tell? I've been trying to keep my spirits up, but..."
    ko: "…그런가요. 최대한 밝게 있으려고 노력은 하고 있습니다만…."
    ja: |-
      …そうでしょうか。
      できるだけ明るくしようと
      努めてはいるのですが…
  d_nikke_marciana_marinestudy_03_76:
    speaker: "<Monologue>"
    en: I playfully kick up a spray of seawater at Marciana.
    ko: 마르차나에게 장난스레 물을 차서 튀겼다.
    ja: |-
      私はイタズラをするように海水を蹴り上げ、
      マルチャーナに水しぶきをかけた
  d_nikke_marciana_marinestudy_03_77:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 찰싹-
    ja: パシャッ
  d_nikke_marciana_marinestudy_03_78:
    speaker: "<Monologue>"
    en: Her face is soon wet with seawater.
    ko: 마르차나의 얼굴이 바닷물에 젖었다.
    ja: マルチャーナの顔が海水で濡れた
  d_nikke_marciana_marinestudy_03_79:
    speaker: marciana_s
    en: "... You did that on purpose, didn't you?"
    ko: "…일부러 그러신 거죠?"
    ja: "…わざとですね？"
  d_nikke_marciana_marinestudy_03_80:
    speaker: "<Self>"
    en: I was just trying to lighten things up.
    ko: 이러면 분위기가 좀 풀릴까 해서.
    ja: これで少し雰囲気が和らぐかと思って
  d_nikke_marciana_marinestudy_03_81:
    speaker: "<Monologue>"
    en: Marciana stares at me for a moment,
    ko: 마르차나는 내 쪽을 빤히 바라보더니,
    ja: マルチャーナはこちらをじっと見つめると
  d_nikke_marciana_marinestudy_03_82:
    speaker: "<Monologue>"
    en: then scoops up a handful of water and splashes me with it.
    ko: 손으로 물을 퍼서 그대로 내게 뿌렸다.
    ja: 手で水をすくい、そのまま勢いよく私にかけた
  d_nikke_marciana_marinestudy_03_83:
    speaker: "<Self>"
    en: W-wait! I didn't splash you nearly that much...!
    ko: 자, 잠깐! 난 이렇게까지 많이 뿌리진 않았는데…!
    ja: |-
      ま、待ってくれ！
      そこまでたくさんかけていないのだが…！
  d_nikke_marciana_marinestudy_03_84:
    speaker: marciana_s
    en: I-I'm sorry!
    ko: 죄, 죄송합니다!
    ja: も、申し訳ございません！
  d_nikke_marciana_marinestudy_03_85:
    speaker: marciana_s
    en: I meant to hold back, but before I knew it...
    ko: 힘조절을 하려고 했는데, 저도 모르게 그만….
    ja: 加減しようとしたのですが、つい…
  d_nikke_marciana_marinestudy_03_86:
    speaker: "<Self>"
    en: No need to apologize. The game's on.
    ko: 사과할 거 없어. 이제 나도 제대로 할 거니까.
    ja: |-
      …謝る必要はない。
      今から私も、本気でやらせてもらおう
  d_nikke_marciana_marinestudy_03_87:
    speaker: marciana_s
    en: "... Excuse me?"
    ko: "…예?"
    ja: "…はい？"
  d_nikke_marciana_marinestudy_03_88:
    speaker: marciana_s
    en: Wait, Commander...!
    ko: 잠깐, 지휘관님…!
    ja: お、お待ちください、指揮官様…！
  d_nikke_marciana_marinestudy_03_89:
    speaker: "<Monologue>"
    en: Before we know it, we're splashing each other and having fun in the water.
    ko: 어느새 우리는 서로에게 물장난을 치며 물놀이를 즐기고 있었다.
    ja: |-
      いつの間にか、私たちは水をかけ合いながら
      海辺でのひとときを楽しんでいた
  d_nikke_marciana_marinestudy_03_90:
    speaker: marciana_s
    en: You really don't go easy on me, Commander.
    ko: 지휘관님, 정말 봐주시는 게 없네요.
    ja: 指揮官様は、本当に容赦がありませんね。
  d_nikke_marciana_marinestudy_03_91:
    speaker: "<Self>"
    en: Says you. You looked ready to bite my head off.
    ko: 마르차나야말로 잡아 먹을 기세던데?
    ja: マルチャーナこそ、かなり本気だっただろう？
  d_nikke_marciana_marinestudy_03_92:
    speaker: marciana_s
    en: Was I? Hehe.
    ko: 그랬나요, 후후.
    ja: そう見えましたか？ふふ。
  d_nikke_marciana_marinestudy_03_93:
    speaker: marciana_s
    en: "... Huh?"
    ko: "…어라."
    ja: "…あら？"
  d_nikke_marciana_marinestudy_03_94:
    speaker: "<Monologue>"
    en: After laughing for a while, Marciana suddenly goes still.
    ko: 한참 웃던 마르차나가, 문득 동작을 멈췄다.
    ja: |-
      しばらく笑っていたマルチャーナが、
      ふと動きを止めた
  d_nikke_marciana_marinestudy_03_95:
    speaker: "<Self>"
    en: What's wrong?
    ko: 왜 그래?
    ja: どうかしたか？
  d_nikke_marciana_marinestudy_03_96:
    speaker: marciana_s
    en: My chest... doesn't feel so heavy anymore.
    ko: 가슴이… 답답하지 않습니다.
    ja: 胸の…もどかしさがなくなりました。
  d_nikke_marciana_marinestudy_03_97:
    speaker: marciana_s
    en: Since yesterday, it's felt like something was weighing on my chest,
    ko: 어제부터 줄곧, 가슴 한쪽이 얹힌 것처럼 답답했는데.
    ja: |-
      昨日からずっと、胸の奥に
      何かが重くのしかかっているような
      もどかしさがあったのですが。
  d_nikke_marciana_marinestudy_03_98:
    speaker: marciana_s
    en: but being here with you like this... It's as if it simply vanished.
    ko: 지휘관님과 이러고 있으니, 거짓말처럼 답답한 게 사라졌어요.
    ja: |-
      指揮官様とこうして過ごしているうちに、
      ウソのように消えていました。
  d_nikke_marciana_marinestudy_03_99:
    speaker: "<Self>"
    en: So that's why you seemed so down.
    ko: 표정이 어두웠던 건, 그 답답함 때문이었구나.
    ja: |-
      浮かない顔をしていたのは、
      そのせいだったのか
  d_nikke_marciana_marinestudy_03_100:
    speaker: marciana_s
    en: I'm sorry if I worried you.
    ko: 신경 쓰이게 해드렸다면 죄송합니다.
    ja: ご心配をおかけしてしまい、申し訳ありません。
  d_nikke_marciana_marinestudy_03_101:
    speaker: marciana_s
    en: But I'm okay now. I feel much lighter.
    ko: |-
      그래도 이젠 괜찮습니다.
      답답한 건 전부 사라졌으니까요.
    ja: |-
      ですが、もう大丈夫です。
      もどかしさはすべて消え去りましたので。
  d_nikke_marciana_marinestudy_03_102:
    speaker: "<Self>"
    en: Did you figure out why you were feeling that way?
    ko: 왜 답답했는지는 알아냈어?
    ja: そのもどかしさの原因は、分かったのか？
  d_nikke_marciana_marinestudy_03_103:
    speaker: marciana_s
    en: "... No, I'm still not entirely sure."
    ko: "…아뇨. 그건 아직 잘 모르겠습니다."
    ja: "…いいえ。それは、まだ分かりません。"
  d_nikke_marciana_marinestudy_03_104:
    speaker: marciana_s
    en: But I do know that being with you makes me feel better.
    ko: 다만, 지휘관님과 함께 있으면 괜찮아진다는 것만은 알았습니다.
    ja: |-
      ですが、指揮官様と一緒にいれば
      よくなるということは分かりました。
  d_nikke_marciana_marinestudy_03_105:
    speaker: "<Self>"
    en: If you start feeling that way again, tell me right away.
    ko: 혹시 또 답답해지면, 그땐 바로 나한테 말해줘.
    ja: |-
      もしまたもどかしくなった時は、
      すぐ私に話してくれ
  d_nikke_marciana_marinestudy_03_106:
    speaker: "<Self>"
    en: I'll be there in a heartbeat to help you through it.
    ko: 언제든지 답답함을 풀어주러 달려 올게.
    ja: |-
      そのもどかしさを晴らしに、
      いつでも駆けつけよう
  d_nikke_marciana_marinestudy_03_107:
    speaker: marciana_s
    en: "... Yes, I'll keep that in mind."
    ko: "…예, 명심해 두겠습니다."
    ja: "…はい、心に留めておきます。"
  d_nikke_marciana_marinestudy_03_108:
    speaker: "<Monologue>"
    en: A quiet moment settles between us as Marciana looks out over the sea.
    ko: 잠깐의 침묵이 이어지고, 마르차나가 수평선을 바라보았다.
    ja: |-
      しばしの沈黙が流れ、
      マルチャーナは水平線を見つめた
  d_nikke_marciana_marinestudy_03_109:
    speaker: marciana_s
    en: The sunset is beautiful.
    ko: 석양이 정말 예쁘네요.
    ja: 夕日が、とてもきれいですね。
  d_nikke_marciana_marinestudy_03_110:
    speaker: "<Self>"
    en: It really is. Want to enjoy the view a little longer before we head back?
    ko: 그러게. 조금만 더 구경하다가 돌아갈까?
    ja: |-
      そうだな。もう少しだけ
      夕日を楽しんでから戻ろうか？
  d_nikke_marciana_marinestudy_03_111:
    speaker: marciana_s
    en: Yes, just for a little while.
    ko: 예, 아주 잠깐만.
    ja: ええ、ほんの少しだけ。
  d_nikke_marciana_marinestudy_03_112:
    speaker: "<Monologue>"
    en: I feel Marciana standing a little closer to me than usual.
    ko: 마르차나가 평소보다 조금 더 가깝게 내 옆에 붙었다는 것을 느끼며.
    ja: |-
      マルチャーナが普段よりも少しだけ近くに
      寄り添ってきたのを感じながら
  d_nikke_marciana_marinestudy_03_113:
    speaker: "<Monologue>"
    en: Then we stand side by side on the beach, watching the sun sink below the horizon.
    ko: 우리는 해변가에 나란히 서서, 수평선 너머의 석양을 바라보았다.
    ja: |-
      私たちはただ静かに、
      水平線の向こうに沈む夕日をながめた
d_nikke_marciana_marinestudy_04:
  d_nikke_marciana_marinestudy_04_1:
    speaker: marciana_s
    en: We ended up staying at the beach longer than I expected.
    ko: 생각보다 오래 놀다가 왔군요.
    ja: 思ったよりも長く夕日を見てしまいましたね。
  d_nikke_marciana_marinestudy_04_2:
    speaker: marciana_s
    en: The sun has already set.
    ko: 벌써 해가 졌습니다.
    ja: 日も、もうすっかり沈んで…
  d_nikke_marciana_marinestudy_04_3:
    speaker: "<Self>"
    en: Sorry... I was the one who suggested we hang out a little longer...
    ko: 미안… 내가 놀다 가자고 하는 바람에….
    ja: |-
      …すまない。
      私がゆっくりしてから戻ろうと言ったせいで…
  d_nikke_marciana_marinestudy_04_4:
    speaker: marciana_s
    en: Oh, I wasn't trying to blame you.
    ko: 아, 지휘관님이 잘못했다고 말하려던 게 아닙니다.
    ja: |-
      い、いえ。指揮官様を責めるつもりで
      言ったのではありません。
  d_nikke_marciana_marinestudy_04_5:
    speaker: marciana_s
    en: I just didn't expect it to get dark so quickly...
    ko: 그냥 생각보다 어두워졌구나 싶어서….
    ja: ただ、思ったより暗くなっていたので…
  d_nikke_marciana_marinestudy_04_6:
    speaker: marciana_s
    en: A-and...
    ko: 그, 그리고!
    ja: そ、それに！
  d_nikke_marciana_marinestudy_04_7:
    speaker: "<Monologue>"
    en: Marciana looks me straight in the eyes.
    ko: 마르차나가 나를 정면에서 바라보았다.
    ja: マルチャーナは私をまっすぐ見つめた
  d_nikke_marciana_marinestudy_04_8:
    speaker: "<Monologue>"
    en: It's too dark to tell for sure, but it looks like she's blushing.
    ko: 어두워서 확실하게 보이진 않지만, 마르차나의 얼굴이 붉은 것 같았다.
    ja: |-
      暗くてはっきりとは見えなかったが、
      マルチャーナの顔が
      ほのかに赤らんでいるように見えた
  d_nikke_marciana_marinestudy_04_9:
    speaker: marciana_s
    en: "... I had so much fun that I completely lost track of time."
    ko: "…저도 즐거워서 시간 가는 줄 몰랐으니까요."
    ja: |-
      …とても楽しくて、時間が経つのを
      すっかり忘れていたのは私も同じですから。
  d_nikke_marciana_marinestudy_04_10:
    speaker: marciana_s
    en: It almost makes me want to invite you out next time.
    ko: 다음엔 제가 함께 놀러가자고 말씀드리고 싶을 만큼요.
    ja: |-
      次は、私から一緒に遊びましょうと
      お誘いしたいくらいで…
  d_nikke_marciana_marinestudy_04_11:
    speaker: "<Self>"
    en: Sure, just let me know.
    ko: 그러자. 언제든지 말만 해줘.
    ja: ああ、いつでも誘ってくれ
  d_nikke_marciana_marinestudy_04_12:
    speaker: "<Monologue>"
    en: Marciana takes a step closer to me.
    ko: 마르차나가 한발짝 다가왔다.
    ja: |-
      その言葉を聞いたマルチャーナが、
      一歩近づいてきた
  d_nikke_marciana_marinestudy_04_13:
    speaker: marciana_s
    en: Then...
    ko: 그러면…!
    ja: でしたら…！
  d_nikke_marciana_marinestudy_04_14:
    speaker: marciana_s
    en: would you... spend tomorrow with me, too?
    ko: 내일도… 같이 있어주실 수 있을까요?
    ja: 明日も…一緒にいていただけませんか？
  d_nikke_marciana_marinestudy_04_15:
    speaker: "<Self>"
    en: Tomorrow?
    ko: 내일 바로?
    ja: 明日も？
  d_nikke_marciana_marinestudy_04_16:
    speaker: marciana_s
    en: I-I guess tomorrow's a bit too soon...
    ko: 여, 역시 내일 바로는 어렵겠죠….
    ja: や、やはり明日もというのは、難しいですよね…
  d_nikke_marciana_marinestudy_04_17:
    speaker: "<Monologue>"
    en: Marciana visibly deflates in disappointment.
    ko: 마르차나는 축 늘어졌다.
    ja: マルチャーナは肩を落としてうつむいた
  d_nikke_marciana_marinestudy_04_18:
    speaker: "<Monologue>"
    en: Somehow, even her penguin suit seems to sag along with her.
    ko: 왠지 마르차나의 펭귄 수트도, 마르차나처럼 축 늘어진 것만 같았다.
    ja: |-
      なぜかマルチャーナのペンギンスーツも、
      彼女と同じく落ち込んでいるように見えた
  d_nikke_marciana_marinestudy_04_19:
    speaker: "<Self>"
    en: I don't think I've ever seen this side of you before.
    ko: 마르차나가 이런 모습을 보여주는 건 처음인 것 같네.
    ja: |-
      マルチャーナがこういう姿を
      見せるのは、初めてだな
  d_nikke_marciana_marinestudy_04_20:
    speaker: marciana_s
    en: "... What do you mean?"
    ko: "…이런 모습이요?"
    ja: "…どういう姿のことでしょうか？"
  d_nikke_marciana_marinestudy_04_21:
    speaker: "<Self>"
    en: You're pretty cute when you get all clingy like that.
    ko: 응석부리는 모습 말이야.
    ja: |-
      甘えてくる姿のことだ。
      そういうマルチャーナもかわいらしいな
  d_nikke_marciana_marinestudy_04_22:
    speaker: "<Self>"
    en: Let's hang out tomorrow.
    ko: 이런 모습도 꽤 귀엽네.
    ja: では、明日も一緒に過ごそうか？
  d_nikke_marciana_marinestudy_04_23:
    speaker: marciana_s
    en: W-we should really head back. It's getting late.
    ko: 그, 그럼 시간도 늦었으니 진짜 돌아가도록 할까요.
    ja: |-
      そ、その…じ、時間も遅いですし、
      今度こそ帰りましょうか。
  d_nikke_marciana_marinestudy_04_24:
    speaker: marciana_s
    en: Thank you for everything today.
    ko: 오늘 정말 감사했습니다.
    ja: 今日は本当に、ありがとうございました。
  d_nikke_marciana_marinestudy_04_25:
    speaker: "<Monologue>"
    en: Marciana takes the seashells I've been carrying in my arms.
    ko: 마르차나가 내 팔에 담겨 있던 조개 껍질들을 챙긴다.
    ja: |-
      マルチャーナは私が腕に抱えていた貝殻を
      そそくさと回収した
  d_nikke_marciana_marinestudy_04_26:
    speaker: marciana_s
    en: I'll take these to Naga and Tia.
    ko: 그리고 이건 제가 가져다주도록 할게요.
    ja: それから、この貝殻は私が持ち帰りますね。
  d_nikke_marciana_marinestudy_04_27:
    speaker: "<Self>"
    en: That's a lot for one person. You sure you'll be okay?
    ko: 양이 좀 많은데, 괜찮겠어?
    ja: かなり量が多いが、大丈夫か？
  d_nikke_marciana_marinestudy_04_28:
    speaker: marciana_s
    en: All I have to do is carry them. It shouldn't be a problem.
    ko: 들고 가는 것 뿐이라면 문제 없습니다.
    ja: 持ち帰るだけなら問題ありません。
  d_nikke_marciana_marinestudy_04_29:
    speaker: marciana_s
    en: I'll see you tomorrow, then.
    ko: 그럼 내일 다시 뵙도록 하겠습니다.
    ja: "…それでは、また明日お会いしましょう。"
  d_nikke_marciana_marinestudy_04_30:
    speaker: "<Monologue>"
    en: Marciana turns and walks away with her arms full of seashells, hiding her
      face behind the penguin wings.
    ko: 마르차나는 팔에 조개 껍질을 가득 안은 채, 펭귄 날개로 얼굴을 가리며 돌아갔다.
    ja: |-
      マルチャーナは両腕いっぱいに
      貝殻を抱えたまま口元まで持ち上げ、
      顔を隠しながら帰っていった
  d_nikke_marciana_marinestudy_04_31:
    speaker: marciana_s
    en: Naga, Tia, here are the shells you asked for.
    ko: 나가, 티아. 조개 껍질 챙겨왔습니다.
    ja: ナガ、ティア。貝殻を集めてきました。
  d_nikke_marciana_marinestudy_04_32:
    speaker: tia_l
    en: Miss Marciana!
    ko: 마르차나 선생니임~?
    ja: あれ？マルチャーナせんせぇ～？
  d_nikke_marciana_marinestudy_04_33:
    speaker: tia_l
    en: Huh? Why are you back alone...?
    ko: 어? 그런데 왜 혼자 돌아오셨….
    ja: どうして一人で帰って…
  d_nikke_marciana_marinestudy_04_34:
    speaker: marciana_s
    en: Sorry to interrupt, but I'd like to get straight to the point.
    ko: 말하는 중에 죄송하지만, 일단 바로 본론으로 들어가겠습니다.
    ja: |-
      お話をさえぎって申し訳ありませんが、
      さっそく本題に入らせていただきます。
  d_nikke_marciana_marinestudy_04_35:
    speaker: marciana_s
    en: You both already knew I had feelings for the Commander, didn't you?
    ko: 두 분은 제가 지휘관님을 좋아한다는 걸, 진작 눈치채고 계셨죠?
    ja: |-
      お二人は、私が指揮官様に
      好意を抱いていることに気づいていましたね？
  d_nikke_marciana_marinestudy_04_36:
    speaker: tia_l
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_marciana_marinestudy_04_37:
    speaker: naga_s
    en: H-how'd you know?
    ko: 그, 그걸 어떻게 아셨어요?
    ja: ど、どうして分かったんですか？
  d_nikke_marciana_marinestudy_04_38:
    speaker: marciana_s
    en: Just as I thought...
    ko: 역시….
    ja: やはり…
  d_nikke_marciana_marinestudy_04_39:
    speaker: marciana_s
    en: So it was the two of you who arranged for the Commander and me to be alone
      today.
    ko: 오늘 지휘관님과 제가 단둘이 있을 수 있었던 것도, 두 분이 계획하신 일이었군요.
    ja: |-
      今日、指揮官様と二人きりで
      過ごすことができたのは、
      お二人の計画によるものだったのですね。
  d_nikke_marciana_marinestudy_04_40:
    speaker: naga_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_04_41:
    speaker: naga_s
    en: We were pretty sure you had feelings for Teacher,
    ko: 마르차나 선생님이 선생님을 좋아하시는 것 같은데,
    ja: |-
      私たちは、マルチャーナ先生が
      @UserName先生を好きなことに
      気づいてたんですけど…
  d_nikke_marciana_marinestudy_04_42:
    speaker: naga_s
    en: but you were the only one who didn't seem to realize it, and it was hard to
      watch.
    ko: 정작 마르차나 선생님만 그걸 모르고 답답해하시는 것 같아서요.
    ja: |-
      マルチャーナ先生だけが
      そのことに気づいてなくて、そのせいで
      もどかしい思いをされてる気がして。
  d_nikke_marciana_marinestudy_04_43:
    speaker: naga_s
    en: We're truly sorry for taking it upon ourselves to push the two of you together.
    ko: 저희 멋대로 두 분을 움직이게 한 건, 정말 죄송합니다.
    ja: |-
      私たちの勝手な判断で
      お二人を振り回してしまって、
      本当にすみませんでした。
  d_nikke_marciana_marinestudy_04_44:
    speaker: tia_l
    en: We thought that if you two were alone together, you might figure out your
      feelings...
    ko: 두 분이 단둘이 있으면, 선생님도 깨달으실 거라고 생각해서….
    ja: |-
      二人きりになれば、
      @UserName先生も気づくかなぁと
      思って…
  d_nikke_marciana_marinestudy_04_45:
    speaker: tia_l
    en: We're sorry...
    ko: 죄송해요….
    ja: ごめんなさい…
  d_nikke_marciana_marinestudy_04_46:
    speaker: "<Narration>"
    en: Naga and Tia lower their heads.
    ko: 나가와 티아가 고개를 숙였다.
    ja: ナガとティアがうつむいた
  d_nikke_marciana_marinestudy_04_47:
    speaker: marciana_s
    en: Why are you apologizing?
    ko: 왜 사과하시는 건가요?
    ja: なぜ謝るのですか？
  d_nikke_marciana_marinestudy_04_48:
    speaker: marciana_s
    en: You were both only trying to help me.
    ko: 두 분은 절 위해서 그러신 거잖아요.
    ja: |-
      お二人は、私のためを思って
      そうしてくださったのでしょう？
  d_nikke_marciana_marinestudy_04_49:
    speaker: naga_s
    en: I thought you were going to scold us...
    ko: "…저희를 혼내시려던 게 아니었나요?"
    ja: "…私たちのこと、叱らないんですか？"
  d_nikke_marciana_marinestudy_04_50:
    speaker: marciana_s
    en: What kind of teacher would I be if I scolded students who care about me?
    ko: 자신을 위하는 학생을 나무라는 선생님이 어디 있겠어요.
    ja: |-
      先生のためを思って行動してくださる
      生徒を叱る先生などいません。
  d_nikke_marciana_marinestudy_04_51:
    speaker: marciana_s
    en: If anything, I should be thanking you two.
    ko: 오히려 제가 고맙다고 해야죠.
    ja: むしろ私は、お二人に感謝すべき立場ですので。
  d_nikke_marciana_marinestudy_04_52:
    speaker: "<Narration>"
    en: Naga and Tia stand frozen, dumbfounded by Marciana's unexpected reaction.
    ko: 나가와 티아는 예상 못한 마르차나의 반응에, 멍하니 굳었다.
    ja: |-
      ナガとティアは予想外のマルチャーナの反応に
      ぽかんとしたまま、微動だにしなかった
  d_nikke_marciana_marinestudy_04_53:
    speaker: naga_s
    en: B-but Miss Marciana, when did you realize you had feelings for him?
    ko: 그, 그런데 선생님. 어떻게 좋아한다는 감정을 깨달으신 거예요?
    ja: |-
      と、ところで先生。
      どうやって好きって気持ちに気づいたんですか？
  d_nikke_marciana_marinestudy_04_54:
    speaker: marciana_s
    en: On the way back, I found myself reflecting on the difference
    ko: 돌아오는 길에, 곰곰이 생각해봤습니다.
    ja: |-
      ここに戻る途中で、
      ゆっくり考えてみたのです。
  d_nikke_marciana_marinestudy_04_55:
    speaker: marciana_s
    en: between the unease I felt yesterday and the warmth I felt today.
    ko: 어제 느꼈던 답답함과, 오늘 느꼈던 따뜻함의 차이가 뭘지.
    ja: |-
      昨日感じたもどかしさと、
      今日感じたあたたかさの違いは
      何なのだろうと。
  d_nikke_marciana_marinestudy_04_56:
    speaker: marciana_s
    en: Yesterday, seeing how kind he was to everyone else left my heart feeling unbearably
      heavy.
    ko: 다른 분들에게 친절하신 모습을 보고 있을 땐, 그토록 답답했으면서.
    ja: |-
      他のみなさんに親切にしている姿を
      目にした時は、あんなにもどかしさを
      感じていたのに…
  d_nikke_marciana_marinestudy_04_57:
    speaker: marciana_s
    en: So why was it that being alone with him filled me with such warmth?
    ko: 어째서 단둘이 있을 땐, 그렇게 따뜻했던 걸까?
    ja: |-
      どうして二人きりになった時は、
      あれほどあたたかい気持ちに
      なったのだろうと。
  d_nikke_marciana_marinestudy_04_58:
    speaker: marciana_s
    en: If one of my students had come to me with the very same concern, what advice
      would I have given them?
    ko: 만약에 학생이 똑같은 고민을 하고 있었다면, 나는 뭐라고 대답해줬을까?
    ja: |-
      もし、生徒たちが同じ悩みを抱えていた時、
      私はなんと答えるのだろうか…と。
  d_nikke_marciana_marinestudy_04_59:
    speaker: marciana_s
    en: Once I looked at it that way, the answer became clear.
    ko: 그렇게 생각하니 답이 나오더군요.
    ja: そしたら、おのずと答えが見えてきたのです。
  d_nikke_marciana_marinestudy_04_60:
    speaker: marciana_s
    en: I have feelings for the Commander all along.
    ko: 아, 내가 지휘관님을 좋아하고 있었구나 하고요.
    ja: |-
      ああ、私は指揮官様のことが
      好きなのかと。
  d_nikke_marciana_marinestudy_04_61:
    speaker: marciana_s
    en: "... I'm a little embarrassed it took me this long to realize it."
    ko: "…진작 알아챘어야 했던 건데 조금 부끄럽네요."
    ja: "…今さら気づくなんて、少し面映ゆいですね。"
  d_nikke_marciana_marinestudy_04_62:
    speaker: naga_s
    en: Ooh...
    ko: 오오….
    ja: わあっ…
  d_nikke_marciana_marinestudy_04_63:
    speaker: tia_l
    en: So Miss Marciana finally realized she's in love!
    ko: 드디어 마르차나 선생님이 연애 감정을 깨달았어~!
    ja: |-
      ついにマルチャーナ先生が
      恋心に気づいたぁ～！
  d_nikke_marciana_marinestudy_04_64:
    speaker: naga_s
    en: So what did you do after that?
    ko: 그래서, 그다음엔 어떻게 하셨어요?
    ja: それで、その後はどうしたんですかっ？
  d_nikke_marciana_marinestudy_04_65:
    speaker: marciana_s
    en: What do you mean?
    ko: 어떻게 하다니요?
    ja: どうした、とは？
  d_nikke_marciana_marinestudy_04_66:
    speaker: naga_s
    en: You realized you have feelings for him,
    ko: 좋아한다는 걸 자각하셨잖아요.
    ja: |-
      ほら、好きって気持ちに
      気づいたじゃないですか。
  d_nikke_marciana_marinestudy_04_67:
    speaker: naga_s
    en: so did you do anything about it?
    ko: 그걸 깨닫고, 뭐라도 하셨어요?
    ja: |-
      気持ちに気づいたあと、
      何か言いましたか？
  d_nikke_marciana_marinestudy_04_68:
    speaker: marciana_s
    en: "... I asked if he could spend some time with me again tomorrow, like he did
      today."
    ko: "…내일도 오늘처럼 같이 있어주실 수 있냐고 여쭤봤습니다."
    ja: |-
      …明日も、今日のように
      一緒にいてくれないかと尋ねると、
  d_nikke_marciana_marinestudy_04_69:
    speaker: marciana_s
    en: And he agreed.
    ko: 지휘관님도 승낙하셨고요.
    ja: 指揮官様も了承してくださいました。
  d_nikke_marciana_marinestudy_04_70:
    speaker: tia_l
    en: You've already got the next date lined up?
    ko: 바로 다음 데이트 약속까지 잡으신 거예요오~?
    ja: |-
      きゃ～！もう次のデートの約束まで
      取りつけたんですねぇ～！
  d_nikke_marciana_marinestudy_04_71:
    speaker: naga_s
    en: Then I suppose we should start planning for tomorrow.
    ko: 그럼 이제 내일 어떻게 해야 할지, 계획을 짜야겠네요?
    ja: |-
      じゃあ、明日はどういう作戦でいくか、
      さっそく練らなきゃですね？
  d_nikke_marciana_marinestudy_04_72:
    speaker: naga_s
    en: We'll do what we can to help things work out between the two of you.
    ko: 두 분이 잘 되실 수 있도록 저희도 도와드릴게요.
    ja: |-
      先生たちがうまくいくように、
      お手伝いさせてください。
  d_nikke_marciana_marinestudy_04_73:
    speaker: marciana_s
    en: That's all right.
    ko: 괜찮습니다.
    ja: いえ、その必要はありません。
  d_nikke_marciana_marinestudy_04_74:
    speaker: marciana_s
    en: You've already done more than enough by helping me understand how I truly
      feel.
    ko: 제 마음을 깨닫게 해준 것만으로도, 이미 분에 넘치는 도움을 받은 거죠.
    ja: |-
      自分の気持ちに気づかせていただけただけでも、
      十分すぎるほどの助けになりましたから。
  d_nikke_marciana_marinestudy_04_75:
    speaker: marciana_s
    en: I'll take it from here.
    ko: 이다음의 일은 스스로 해결해보도록 할게요.
    ja: |-
      これから先のことは、
      自分の力で頑張りたいと思います。
  d_nikke_marciana_marinestudy_04_76:
    speaker: naga_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_04_77:
    speaker: naga_s
    en: It seems you've already made up your mind. We'd only be overstepping if we
      got involved any further.
    ko: 이미 결심하신 것 같으니, 저희가 더 나서는 건 오히려 실례겠네요.
    ja: |-
      分かりました。決意は固いみたいですし、
      私たちがこれ以上口を出すのは
      かえって失礼かもしれませんね。
  d_nikke_marciana_marinestudy_04_78:
    speaker: tia_l
    en: Still, it'd be nice if we could help somehow...
    ko: 그래도 뭔가 도와드릴 수 있으면 좋을 텐데에….
    ja: でも、何か手伝えることはないかなぁ…
  d_nikke_marciana_marinestudy_04_79:
    speaker: naga_s
    en: How about picking out a gift for Teacher while you're on your date tomorrow...?
    ko: 내일 데이트하면서 선생님께 드릴 선물을 준비해본다… 는 건 어떠세요?
    ja: |-
      う～ん…明日、デートの時に渡すプレゼントを
      用意するっていうのは、どうですか？
  d_nikke_marciana_marinestudy_04_80:
    speaker: marciana_s
    en: A... gift?
    ko: 선물… 말인가요?
    ja: プレゼント…ですか？
  d_nikke_marciana_marinestudy_04_81:
    speaker: "<Narration>"
    en: Marciana pulls out the seashell she had tucked away.
    ko: 마르차나는 품에 넣어뒀던 조개를 꺼냈다.
    ja: |-
      マルチャーナは懐にしまっていた
      貝殻を取り出した
  d_nikke_marciana_marinestudy_04_82:
    speaker: tia_l
    en: Wow, that shell's so colorful!
    ko: 엄청 알록한 조개다아~
    ja: わぁ、すっごくカラフルな貝殻ですねぇ～
  d_nikke_marciana_marinestudy_04_83:
    speaker: tia_l
    en: Did you pick that up too?
    ko: 그것도 주워오신 거예요~?
    ja: それも拾ってきたんですかぁ～？
  d_nikke_marciana_marinestudy_04_84:
    speaker: marciana_s
    en: The Commander gave me this seashell.
    ko: 이건 지휘관님이 제게 주신 조개입니다.
    ja: いえ、これは指揮官様がくださった貝殻です。
  d_nikke_marciana_marinestudy_04_85:
    speaker: marciana_s
    en: He said he thought it'd suit me.
    ko: 저한테 잘 어울릴 것 같다고 하시면서요.
    ja: |-
      …私によく似合いそうだと
      おっしゃっていました。
  d_nikke_marciana_marinestudy_04_86:
    speaker: marciana_s
    en: Maybe I should get him something just as thoughtful...
    ko: 이런 느낌의 선물이면 좋지 않을까 싶은데….
    ja: |-
      私からも、このようなプレゼントを
      贈れたら素敵なのですが…
  d_nikke_marciana_marinestudy_04_87:
    speaker: naga_s
    en: That sounds great.
    ko: 그거 좋네요.
    ja: それ、いいですね。
  d_nikke_marciana_marinestudy_04_88:
    speaker: naga_s
    en: Why don't you give him a seashell too, Miss Marciana?
    ko: 마르차나 선생님도 조개를 선물로 드리는 건 어떨까요?
    ja: |-
      じゃあ、マルチャーナ先生からも
      貝殻を贈ってみるのはどうですか？
  d_nikke_marciana_marinestudy_04_89:
    speaker: tia_l
    en: That's a great idea!
    ko: 좋다아~
    ja: いいかもぉ～
  d_nikke_marciana_marinestudy_04_90:
    speaker: marciana_s
    en: Give the Commander a seashell...?
    ko: 지휘관님께 조개를요…?
    ja: 指揮官様に貝殻を、ですか…？
  d_nikke_marciana_marinestudy_04_91:
    speaker: naga_s
    en: Yeah, one that suits him.
    ko: 네. 선생님께 잘 어울릴 것 같은 조개로요.
    ja: |-
      はい。@UserName先生に
      似合いそうなものを。
  d_nikke_marciana_marinestudy_04_92:
    speaker: naga_s
    en: We have plenty of shells, so I'm sure we'll find the perfect one.
    ko: 마침 조개도 많이 있으니까, 이 중에 하나는 고를 만한 게 있을 것 같아요.
    ja: |-
      ちょうど貝殻もたくさんありますし、
      この中に1つくらいは
      似合うものがあるんじゃないかなと。
  d_nikke_marciana_marinestudy_04_93:
    speaker: tia_l
    en: Just pick one that reminds you of Teacher!
    ko: 선생님하면 떠오르는 이미지로 고르면 될 것 같다아~
    ja: |-
      うんうん！@UserName先生を
      思い浮かべた時に、一番イメージに
      ぴったりなものを選ぶのはどうですかぁ～？
  d_nikke_marciana_marinestudy_04_94:
    speaker: naga_s
    en: Miss Marciana, what kind of seashell do you think would suit him?
    ko: 마르차나 선생님은 어떤 조개가 선생님한테 어울릴 것 같으세요?
    ja: |-
      マルチャーナ先生的には、
      どんな貝殻が似合うと思いますか？
  d_nikke_marciana_marinestudy_04_95:
    speaker: marciana_s
    en: "... A sturdy one."
    ko: "……단단한 조개."
    ja: |-
      そうですね…
      …硬い貝殻、でしょうか。
  d_nikke_marciana_marinestudy_04_96:
    speaker: marciana_s
    en: I think a sturdy one would suit the Commander best.
    ko: 껍질이 단단한 조개가, 지휘관님께 잘 어울릴 것 같네요.
    ja: |-
      そういったものが、
      指揮官様によく似合われるのではないかなと…
  d_nikke_marciana_marinestudy_04_97:
    speaker: naga_s
    en: Then let's find the sturdiest seashell here.
    ko: 그럼 이 중에서 가장 단단한 조개를 찾아보죠.
    ja: |-
      じゃ、この中から一番硬い貝殻を
      探してみましょっ。
  d_nikke_marciana_marinestudy_04_98:
    speaker: tia_l
    en: Yay!
    ko: 와아!
    ja: だね！
  d_nikke_marciana_marinestudy_04_99:
    speaker: "<Narration>"
    en: Marciana, Naga, and Tia spend the night searching through countless seashells
      for the sturdiest one they can find.
    ko: 마르차나와 나가, 티아는 수많은 조개 중 가장 단단한 조개를 찾으며 밤을 보냈다.
    ja: |-
      マルチャーナとナガとティアの3人は、
      たくさんの貝殻の中から
      一番硬い貝殻を探しながら夜を過ごした
d_nikke_marciana_marinestudy_05:
  d_nikke_marciana_marinestudy_05_1:
    speaker: "<Self>"
    en: Did I keep you waiting, Marciana?
    ko: 마르차나, 오래 기다렸어?
    ja: マルチャーナ、待たせたな
  d_nikke_marciana_marinestudy_05_2:
    speaker: marciana_s
    en: No, I just got here as well.
    ko: 아뇨. 저도 방금 막 도착했습니다.
    ja: いえ、私もつい先ほど到着したばかりです。
  d_nikke_marciana_marinestudy_05_3:
    speaker: "<Self>"
    en: I don't think so...
    ko: 아닌 것 같은데….
    ja: そうは思えないが…
  d_nikke_marciana_marinestudy_05_4:
    speaker: "<Monologue>"
    en: I wipe a bead of sweat from Marciana's forehead.
    ko: 마르차나의 이마에 흐르는 땀방울을 닦아주었다.
    ja: |-
      マルチャーナの額に
      にじんだ汗をそっと拭いた
  d_nikke_marciana_marinestudy_05_5:
    speaker: marciana_s
    en: Oh...!
    ko: 아…!
    ja: あっ…！
  d_nikke_marciana_marinestudy_05_6:
    speaker: marciana_s
    en: "... I'm sorry, I actually got here a little early."
    ko: "…죄송합니다. 사실 조금 일찍 나와 있었습니다."
    ja: |-
      …申し訳ありません。
      実を言うと、少し早めに来ておりました。
  d_nikke_marciana_marinestudy_05_7:
    speaker: "<Self>"
    en: How early?
    ko: 얼마나?
    ja: どのくらい前から来てたんだ？
  d_nikke_marciana_marinestudy_05_8:
    speaker: marciana_s
    en: About an hour...?
    ko: 대충 한 시간 정도…?
    ja: だいたい、1時間ほど前でしょうか…
  d_nikke_marciana_marinestudy_05_9:
    speaker: "<Self>"
    en: Sorry for making you wait.
    ko: 기다리게 해서 미안해.
    ja: そうか…待たせてすまなかった
  d_nikke_marciana_marinestudy_05_10:
    speaker: marciana_s
    en: Please, don't be.
    ko: 아, 아닙니다.
    ja: と、とんでもありません。
  d_nikke_marciana_marinestudy_05_11:
    speaker: marciana_s
    en: I simply chose to arrive early.
    ko: 제가 멋대로 일찍 나왔을 뿐인 걸요.
    ja: 私が勝手に早く来ただけですので。
  d_nikke_marciana_marinestudy_05_12:
    speaker: "<Self>"
    en: To make it up to you, let's go wherever you want today.
    ko: 사과의 의미로, 오늘은 마르차나가 가고 싶은 곳에 가보자.
    ja: |-
      お詫びのしるしに、今日はマルチャーナが
      行きたいところに行こうか
  d_nikke_marciana_marinestudy_05_13:
    speaker: marciana_s
    en: Wherever I want...?
    ko: 제가 가고 싶은 곳이요…?
    ja: 私が行きたいところ、ですか…？
  d_nikke_marciana_marinestudy_05_14:
    speaker: marciana_s
    en: I'd like to walk along the beach with you again, like we did yesterday.
    ko: 전 어제처럼, 함께 해변을 걷고 싶습니다.
    ja: |-
      …では、昨日のように
      海辺を散歩するのはどうでしょうか。
  d_nikke_marciana_marinestudy_05_15:
    speaker: marciana_s
    en: As long as I'm with you, anywhere is fine.
    ko: 지휘관님과 함께라면 뭐든 좋으니까요.
    ja: |-
      指揮官様と一緒なら、
      どんなことも楽しいですので。
  d_nikke_marciana_marinestudy_05_16:
    speaker: "<Self>"
    en: Hearing you say that makes me kind of happy.
    ko: 그렇게 말해주니까 뭔가 기쁘네.
    ja: そう言ってもらえると、なんだか嬉しいな
  d_nikke_marciana_marinestudy_05_17:
    speaker: "<Monologue>"
    en: I take Marciana's hand.
    ko: 나는 마르차나의 손을 잡았다.
    ja: 私はマルチャーナの手を握った
  d_nikke_marciana_marinestudy_05_18:
    speaker: "<Self>"
    en: Shall we?
    ko: 그럼 가볼까?
    ja: では、行こうか？
  d_nikke_marciana_marinestudy_05_19:
    speaker: marciana_s
    en: "... Yes."
    ko: "…예."
    ja: "…はい。"
  d_nikke_marciana_marinestudy_05_20:
    speaker: "<Self>"
    en: Come to think of it, did Naga and Tia manage to make the necklaces from the
      seashells we picked up yesterday?
    ko: 그러고 보니, 어제 주운 조개로 목걸이는 잘 만들었대?
    ja: |-
      そういえば、昨日拾った貝殻で
      ネックレスはうまく作れたのか？
  d_nikke_marciana_marinestudy_05_21:
    speaker: marciana_s
    en: I haven't heard anything yet, but I'm sure they'll make beautiful necklaces.
      They're both very talented, after all.
    ko: 아직 들은 건 없지만, 둘 다 솜씨가 좋으니 분명 잘 만들 겁니다.
    ja: |-
      まだあの子たちから何も聞いていませんが、
      二人とも器用ですから
      きっと素敵なものができるはずです。
  d_nikke_marciana_marinestudy_05_22:
    speaker: marciana_s
    en: Um... Commander,
    ko: 저… 지휘관님.
    ja: その…指揮官様。
  d_nikke_marciana_marinestudy_05_23:
    speaker: marciana_s
    en: speaking of seashells...
    ko: 마침 조개 이야기가 나와서 말인데….
    ja: ちょうど貝殻の話が出たことですし…
  d_nikke_marciana_marinestudy_05_24:
    speaker: "<Monologue>"
    en: Marciana takes out a seashell from her penguin suit.
    ko: 마르차나가 펭귄 수트에서 조개를 꺼냈다.
    ja: マルチャーナは懐から貝殻を取り出した
  d_nikke_marciana_marinestudy_05_25:
    speaker: marciana_s
    en: I'd like you to have this shell.
    ko: 이 조개를 받아주시겠습니까?
    ja: この貝殻を受け取っていただけますか？
  d_nikke_marciana_marinestudy_05_26:
    speaker: "<Self>"
    en: It's for me?
    ko: 이걸 나한테?
    ja: これを私に？
  d_nikke_marciana_marinestudy_05_27:
    speaker: marciana_s
    en: Yes. Yesterday, you picked out a shell that suited me.
    ko: 예. 어제는 지휘관님이 제게 어울리는 조개를 골라주셨죠.
    ja: |-
      はい。昨日は、指揮官様が私に似合う
      貝殻を選んでくださいましたよね。
  d_nikke_marciana_marinestudy_05_28:
    speaker: marciana_s
    en: This time, I wanted to do the same for you,
    ko: 이번엔 제가 지휘관님께 어울리는 걸 드리고 싶었어요.
    ja: |-
      ですので今度は、私から指揮官様に
      贈りたいと思ったのです。
  d_nikke_marciana_marinestudy_05_29:
    speaker: marciana_s
    en: so I brought one of the shells we collected yesterday.
    ko: 그래서 어제 주운 조개에서 하나를 챙겨왔습니다.
    ja: |-
      昨日拾った貝殻の中から、
      一番似合いそうなものを選んでみました。
  d_nikke_marciana_marinestudy_05_30:
    speaker: "<Self>"
    en: What makes you think it'd suit me?
    ko: 어떤 점이 나랑 어울리는데?
    ja: |-
      どんなところが、
      私に似合いそうだと思ったんだ？
  d_nikke_marciana_marinestudy_05_31:
    speaker: marciana_s
    en: Because it looks like the toughest shell.
    ko: 이 조개 껍질이 가장 단단해보였거든요.
    ja: |-
      一番硬そうなところが、
      指揮官様にぴったりだなと…
  d_nikke_marciana_marinestudy_05_32:
    speaker: marciana_s
    en: It feels like it can protect someone, just like you do, Commander.
    ko: 지휘관님처럼 단단하게 누군가를 지켜줄 것 같은 느낌이었습니다.
    ja: |-
      …指揮官様のように、
      誰かを頼もしく守ってくれそうな
      印象を受けたのです。
  d_nikke_marciana_marinestudy_05_33:
    speaker: "<Monologue>"
    en: Marciana presses the seashell into my palm, then gently folds my fingers around
      it.
    ko: 마르차나가 조개를 내 손에 쥐여 주었다.
    ja: |-
      マルチャーナが私の手のひらの上に
      貝殻をそっと置いた
  d_nikke_marciana_marinestudy_05_34:
    speaker: "<Monologue>"
    en: Her fingertips are trembling ever so slightly.
    ko: 그 손끝은 미세하게 떨리고 있었다.
    ja: その指先は、かすかに震えている
  d_nikke_marciana_marinestudy_05_35:
    speaker: "<Self>"
    en: Thank you, I'll cherish it.
    ko: 고마워. 소중히 간직할게.
    ja: ありがとう。大切にする
  d_nikke_marciana_marinestudy_05_36:
    speaker: "<Monologue>"
    en: We walk on in comfortable silence until we reach the shore.
    ko: 우리는 기분 좋은 침묵과 함께 계속 걸으며, 물가에 도착했다.
    ja: |-
      私たちは心地よい沈黙に包まれたまま
      歩き続け、波打ち際に到着した
  d_nikke_marciana_marinestudy_05_37:
    speaker: "<Self>"
    en: We both got soaked playing here yesterday.
    ko: 어제 여기서 물장난을 치다가 흠뻑 젖었었지.
    ja: |-
      昨日、ここで水をかけ合って
      ずぶ濡れになったんだったな
  d_nikke_marciana_marinestudy_05_38:
    speaker: marciana_s
    en: You started first.
    ko: 지휘관님께서 먼저 시작하셨죠.
    ja: |-
      先に水をかけてきたのは、
      指揮官様のほうでしたけれどね。
  d_nikke_marciana_marinestudy_05_39:
    speaker: "<Self>"
    en: But it looked like you had the most fun.
    ko: 마르차나가 더 신나보이긴 했지만 말이야.
    ja: |-
      だが、マルチャーナのほうが
      楽しんでいるように見えた
  d_nikke_marciana_marinestudy_05_40:
    speaker: marciana_s
    en: "... I won't deny it."
    ko: "…부정은 못 하겠네요."
    ja: "…否定はできませんね。"
  d_nikke_marciana_marinestudy_05_41:
    speaker: "<Monologue>"
    en: Marciana breaks into a gentle smile and lightly kicks the water with her toes.
    ko: 마르차나가 살며시 웃으며 발끝으로 물을 찼다.
    ja: |-
      マルチャーナは微笑みながら、
      つま先で水を蹴った
  d_nikke_marciana_marinestudy_05_42:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 찰싹-
    ja: パシャッ
  d_nikke_marciana_marinestudy_05_43:
    speaker: marciana_s
    en: Hehe, that's for yesterday.
    ko: 후훗. 어제의 답례입니다.
    ja: ふふっ。昨日のお返しです。
  d_nikke_marciana_marinestudy_05_44:
    speaker: "<Self>"
    en: "... Looks like you started it this time."
    ko: "…오늘은 마르차나가 먼저 시작한 거다?"
    ja: "…まさか、君のほうから始めるとはな？"
  d_nikke_marciana_marinestudy_05_45:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 철썩-
    ja: バシャッ
  d_nikke_marciana_marinestudy_05_46:
    speaker: marciana_s
    en: I-I didn't splash you with that much water...!
    ko: 저, 전 이렇게까지 물을 많이 뿌리진 않았는데…!
    ja: そ、そこまでたくさんかけていなかったのに…！
  d_nikke_marciana_marinestudy_05_47:
    speaker: "<Self>"
    en: I didn't hold back.
    ko: 최대한 있는 힘껏 뿌려 봤어.
    ja: はは、ありったけの力でかけてみた
  d_nikke_marciana_marinestudy_05_48:
    speaker: marciana_s
    en: I see how it is.
    ko: 알겠습니다.
    ja: 分かりました。
  d_nikke_marciana_marinestudy_05_49:
    speaker: marciana_s
    en: In that case, I'll give it everything I've got...
    ko: 그럼 저도 최선을 다해 있는 힘껏 뿌려보도록….
    ja: では、私も全力でいかせていただきま…
  d_nikke_marciana_marinestudy_05_50:
    speaker: "<Monologue>"
    en: As Marciana bends down, her foot slips on the wet sand.
    ko: 마르차나는 몸을 숙이다가, 젖은 모래에 발이 미끄러졌다.
    ja: |-
      マルチャーナがしゃがもうとした瞬間、
      水を含んだ砂浜に足を取られた
  d_nikke_marciana_marinestudy_05_51:
    speaker: "<Self>"
    en: Marciana!
    ko: 마르차나…!
    ja: マルチャーナ…！
  d_nikke_marciana_marinestudy_05_52:
    speaker: "<Narration>"
    en: "*Splash!*"
    ko: 풍덩-!
    ja: バシャァァンッ！
  d_nikke_marciana_marinestudy_05_53:
    speaker: "<Monologue>"
    en: I try to catch Marciana, but I end up falling with her.
    ko: 마르차나를 붙잡아주려고 했지만, 나도 같이 넘어져버리고 말았다.
    ja: |-
      とっさにマルチャーナを受け止めようとしたが、
      踏ん張りきれず一緒に転んでしまった
  d_nikke_marciana_marinestudy_05_54:
    speaker: marciana_s
    en: Commander! Are you all right?
    ko: 지휘관님! 괜찮으십니까?
    ja: 指揮官様！大丈夫ですか？
  d_nikke_marciana_marinestudy_05_55:
    speaker: "<Monologue>"
    en: Marciana is sprawled over me, looking down at me.
    ko: 마르차나가 내 위에 엎어진 상태로, 나를 바라보고 있다.
    ja: |-
      マルチャーナは私に覆いかぶさる形で
      こちらを見つめている
  d_nikke_marciana_marinestudy_05_56:
    speaker: "<Self>"
    en: I landed in the water, so I'm okay.
    ko: 바닷물에 넘어진 거라 괜찮아.
    ja: 浅瀬で転んだだけだから、平気だ
  d_nikke_marciana_marinestudy_05_57:
    speaker: "<Self>"
    en: How about you, Marciana?
    ko: 마르차나는?
    ja: マルチャーナのほうこそ、ケガはないか？
  d_nikke_marciana_marinestudy_05_58:
    speaker: marciana_s
    en: I'm okay, too.
    ko: 저도 괜찮습니다.
    ja: 私は大丈夫です。
  d_nikke_marciana_marinestudy_05_59:
    speaker: marciana_s
    en: You broke my fall...
    ko: 지휘관님이 쿠션이 되어주셨으니까요….
    ja: 指揮官様がクッションになってくださったので…
  d_nikke_marciana_marinestudy_05_60:
    speaker: "<Self>"
    en: Haha...
    ko: 하핫.
    ja: ははっ
  d_nikke_marciana_marinestudy_05_61:
    speaker: marciana_s
    en: Wh-why are you laughing all of a sudden?
    ko: 가, 갑자기 왜 웃으시는 거죠?
    ja: な、なぜ笑うのですか？
  d_nikke_marciana_marinestudy_05_62:
    speaker: "<Self>"
    en: I'm actually enjoying this.
    ko: 그냥 이 상황이 좀 즐겁네.
    ja: この状況が楽しいからだ
  d_nikke_marciana_marinestudy_05_63:
    speaker: "<Self>"
    en: I never imagined I'd fall into the water with you.
    ko: 마르차나랑 같이 물에 빠질 거라곤 상상도 못 해봤어.
    ja: |-
      マルチャーナと一緒に
      海で転ぶとは想像もしていなかった
  d_nikke_marciana_marinestudy_05_64:
    speaker: "<Monologue>"
    en: We sit up side by side on the shore, still soaked from our fall.
    ko: 우리는 몸을 일으켜, 젖은 채로 물가에 나란히 앉았다.
    ja: |-
      私たちは体を起こすと、
      濡れたまま海辺に並んで座った
  d_nikke_marciana_marinestudy_05_65:
    speaker: marciana_s
    en: "... Whenever I'm with you, I find myself enjoying every moment."
    ko: "…지휘관님과 함께 있으면, 저도 즐겁습니다."
    ja: "…指揮官様と一緒にいると、私も楽しいです。"
  d_nikke_marciana_marinestudy_05_66:
    speaker: marciana_s
    en: I can't stop smiling, and my heart just keeps racing...
    ko: 자꾸 웃음이 나오고, 두근거리고….
    ja: ずっと笑顔になれて、ドキドキして…
  d_nikke_marciana_marinestudy_05_67:
    speaker: marciana_s
    en: It makes me wish this moment would never end.
    ko: 그리고 이 시간이 끝나지 않았으면 하는… 그런 마음이 듭니다.
    ja: |-
      この時間が終わらなければいいのにと…
      そう思ってしまいます。
  d_nikke_marciana_marinestudy_05_68:
    speaker: "<Self>"
    en: Me too.
    ko: 나도 그래.
    ja: 私もだ
  d_nikke_marciana_marinestudy_05_69:
    speaker: marciana_s
    en: Huh?
    ko: 예?
    ja: えっ？
  d_nikke_marciana_marinestudy_05_70:
    speaker: "<Self>"
    en: Time goes by too fast whenever I'm with you.
    ko: 마르차나랑 있으면 시간이 너무 빨리 가서 아쉬워.
    ja: |-
      マルチャーナといると、
      あっという間に時間が過ぎてしまう
  d_nikke_marciana_marinestudy_05_71:
    speaker: marciana_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_marciana_marinestudy_05_72:
    speaker: "<Self>"
    en: Shall we get going?
    ko: 그럼 이제 슬슬 일어날까?
    ja: では、そろそろ歩こうか？
  d_nikke_marciana_marinestudy_05_73:
    speaker: "<Self>"
    en: We've still got plenty of the beach left to explore...
    ko: 아직 해변을 둘러보려면 한참 남았….
    ja: |-
      このあたりには、
      見て回るところがまだあるし…
  d_nikke_marciana_marinestudy_05_74:
    speaker: marciana_s
    en: Commander.
    ko: 지휘관님.
    ja: 指揮官様。
  d_nikke_marciana_marinestudy_05_75:
    speaker: "<Monologue>"
    en: Marciana grabs my sleeve.
    ko: 마르차나가 내 옷소매를 잡았다.
    ja: マルチャーナが私の服のすそを引っ張った
  d_nikke_marciana_marinestudy_05_76:
    speaker: marciana_s
    en: This may be sudden, but there's something I'd like to tell you today.
    ko: 갑작스럽지만, 오늘 꼭 전하고 싶은 말이 있습니다.
    ja: |-
      …突然で申し訳ありませんが、今日は
      どうしてもお伝えしたいことがあるんです。
  d_nikke_marciana_marinestudy_05_77:
    speaker: "<Self>"
    en: What is it?
    ko: 전하고 싶은 말?
    ja: 伝えたいこと？
  d_nikke_marciana_marinestudy_05_78:
    speaker: marciana_s
    en: Yesterday, I couldn't answer why I'd been feeling so uneasy.
    ko: 제가 왜 답답했는지, 어제는 그 이유를 말씀드리지 못했었죠.
    ja: |-
      はい。なぜ私がもどかしさを感じていたのか、
      昨日はその理由をお伝えできませんでした。
  d_nikke_marciana_marinestudy_05_79:
    speaker: marciana_s
    en: Now I know the reason.
    ko: 이제는 그 이유를 분명히 알고 있습니다.
    ja: ですが今は、はっきりと分かります。
  d_nikke_marciana_marinestudy_05_80:
    speaker: "<Monologue>"
    en: Marciana takes a deep breath and looks me straight in the eye.
    ko: 마르차나는 잠시 숨을 고르더니, 똑바로 나를 바라보았다.
    ja: |-
      マルチャーナはひと呼吸置くと、
      まっすぐに私を見つめた
  d_nikke_marciana_marinestudy_05_81:
    speaker: marciana_s
    en: I was... jealous.
    ko: 그건… 질투였어요.
    ja: "…嫉妬、だったのです。"
  d_nikke_marciana_marinestudy_05_82:
    speaker: marciana_s
    en: I couldn't stand seeing someone else by your side.
    ko: 지휘관님 곁에 다른 분이 있다는 게, 견딜 수 없이 신경 쓰였던 거예요.
    ja: |-
      指揮官様のそばに他の方がいることに、
      いてもたってもいられなくて。
  d_nikke_marciana_marinestudy_05_83:
    speaker: "<Monologue>"
    en: Marciana leans in a little closer.
    ko: 마르차나의 얼굴이 조금 더 가까워졌다.
    ja: マルチャーナの顔が一歩近づいてきた
  d_nikke_marciana_marinestudy_05_84:
    speaker: marciana_s
    en: Even though it's my own heart, I'm the last to realize how I truly feel.
    ko: 제 마음인데도, 제가 가장 늦게 알아차렸네요.
    ja: |-
      なのに、自分自身の気持ちに
      誰よりも鈍いままだったのです。
  d_nikke_marciana_marinestudy_05_85:
    speaker: marciana_s
    en: The answer has been there from the very beginning.
    ko: 처음부터 답은 정해져 있었는데 말이죠.
    ja: "…ずっと、答えはそこにあったのに。"
  d_nikke_marciana_marinestudy_05_86:
    speaker: marciana_s
    en: Commander,
    ko: 지휘관님.
    ja: 指揮官様。
  d_nikke_marciana_marinestudy_05_87:
    speaker: marciana_s
    en: I like you.
    ko: 저는 당신을 좋아합니다.
    ja: 私は、あなたが好きです。
  d_nikke_marciana_marinestudy_05_88:
    speaker: marciana_s
    en: I'm still inexperienced when it comes to love...
    ko: 사랑이라는 감정에는 아직 많이 서툴지만….
    ja: 恋という感情には、まだまだ不慣れですが…
  d_nikke_marciana_marinestudy_05_89:
    speaker: marciana_s
    en: But I want to spend the rest of my life by your side.
    ko: 평생 당신 곁에 있고 싶어요.
    ja: |-
      これからはずっと、
      あなたのそばにいさせてください。
  d_nikke_marciana_marinestudy_05_90:
    speaker: "<Monologue>"
    en: For a moment, only the gentle murmur of the waves can be heard.
    ko: 짧은 시간, 파도 소리만이 잔잔하게 울려퍼졌다.
    ja: しばらくの間、波の音だけが静かに響いた
  d_nikke_marciana_marinestudy_05_91:
    speaker: "<Self>"
    en: So this is a confession from the cutest penguin in the world.
    ko: 세상에서 가장 귀여운 펭귄의 고백이네.
    ja: "…この世で一番かわいいペンギンの告白だな"
  d_nikke_marciana_marinestudy_05_92:
    speaker: "<Monologue>"
    en: Marciana brushes her hair back and looks away.
    ko: 마르차나가 머리를 쓸어넘기며 눈을 피했다.
    ja: |-
      マルチャーナは前髪を
      指で払いながら視線をそらした
  d_nikke_marciana_marinestudy_05_93:
    speaker: marciana_s
    en: P-penguins are such romantic creatures.
    ko: 페, 펭귄은 정말 낭만적인 동물입니다.
    ja: |-
      ペ、ペンギンはとてもロマンチックな
      動物なんです。
  d_nikke_marciana_marinestudy_05_94:
    speaker: marciana_s
    en: Once they find a mate, they stay together for life.
    ko: 한번 맺어진 짝과 평생을 함께하거든요.
    ja: |-
      一度結ばれた相手とは、
      生涯をともにするのですから。
  d_nikke_marciana_marinestudy_05_95:
    speaker: "<Self>"
    en: Did you know this too?
    ko: 그럼 이것도 알고 있어?
    ja: なら、これは知っているか？
  d_nikke_marciana_marinestudy_05_96:
    speaker: "<Self>"
    en: Some penguins give their mate a pretty pebble when they confess their love.
    ko: 펭귄 중에는 사랑을 고백할 때, 예쁜 조약돌을 주는 펭귄이 있대.
    ja: |-
      ペンギンの中には、愛を告白する時に
      きれいな小石を贈る個体もいるそうだ
  d_nikke_marciana_marinestudy_05_97:
    speaker: marciana_s
    en: Huh...?
    ko: 예…?
    ja: え…？
  d_nikke_marciana_marinestudy_05_98:
    speaker: "<Monologue>"
    en: I take a pebble out of my pocket and place it in Marciana's hand.
    ko: 주머니에서 조약돌을 꺼내, 마르차나의 손에 쥐어주었다.
    ja: |-
      私はポケットから小石を取り出すと、
      マルチャーナの手にそっとのせた
  d_nikke_marciana_marinestudy_05_99:
    speaker: marciana_s
    en: This is...
    ko: 이건….
    ja: これは…
  d_nikke_marciana_marinestudy_05_100:
    speaker: "<Self>"
    en: I actually picked it up yesterday while you weren't looking.
    ko: 사실 어제, 마르차나 몰래 주워뒀어.
    ja: 実は昨日、こっそり拾っておいたんだ
  d_nikke_marciana_marinestudy_05_101:
    speaker: "<Self>"
    en: As soon as I saw it, I knew I wanted to give it to you.
    ko: 보자 마자, 마르차나에게 주고 싶다는 생각이 들어서.
    ja: |-
      見つけた瞬間、マルチャーナに
      贈りたいと思ってな
  d_nikke_marciana_marinestudy_05_102:
    speaker: marciana_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marciana_marinestudy_05_103:
    speaker: marciana_s
    en: How strange...
    ko: "…이상하네요."
    ja: "…不思議ですね。"
  d_nikke_marciana_marinestudy_05_104:
    speaker: marciana_s
    en: I only received a pretty little pebble, and yet...
    ko: 분명 예쁜 조약돌을 하나 받았을 뿐인데.
    ja: ただ、きれいな小石をいただいただけなのに。
  d_nikke_marciana_marinestudy_05_105:
    speaker: marciana_s
    en: I don't think I'll ever feel uneasy again.
    ko: 이제 더 이상, 가슴이 답답해질 일은 없을 것 같습니다.
    ja: |-
      もうこれ以上、あのもどかしさを
      感じることはないと思えるのです。
  d_nikke_marciana_marinestudy_05_106:
    speaker: marciana_s
    en: Because I finally know where your heart lies.
    ko: 지휘관님의 마음이 어디로 향하는지, 이제는 명확하게 알고 있으니까요.
    ja: |-
      …指揮官様の心が誰に向いているのか、
      今ははっきりと分かるからでしょうか。
  d_nikke_marciana_marinestudy_05_107:
    speaker: "<Monologue>"
    en: Marciana hugs the pebble to her chest.
    ko: 마르차나는 조약돌을 가슴에 끌어 안았고.
    ja: マルチャーナは小石を胸にぎゅっと抱きしめた
  d_nikke_marciana_marinestudy_05_108:
    speaker: "<Monologue>"
    en: Our eyes meet, and we smile,
    ko: 우리는 서로를 마주 보며 웃었다.
    ja: |-
      そして互いに笑顔をこぼしながら、
      穏やかに見つめあった
  d_nikke_marciana_marinestudy_05_109:
    speaker: "<Monologue>"
    en: like two penguins who have finally found their mates.
    ko: 마침내 서로의 짝을 찾은 펭귄처럼.
    ja: まるで、生涯の伴侶を見つけたペンギンのように
