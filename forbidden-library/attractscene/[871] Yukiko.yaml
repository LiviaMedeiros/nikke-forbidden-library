---
d_nikke_ce009_02_01:
  d_nikke_ce009_02_01_1:
    speaker: "<Monologue>"
    en: Yukiko wants to check out the hot springs in this world.
    ko: 유키코는 이 세계의 온천을 보고 싶다고 했다.
    ja: 雪子からこの世界の温泉が見たいと言われた
  d_nikke_ce009_02_01_2:
    speaker: "<Monologue>"
    en: There are artificial hot springs in the Ark, but I doubt that's what she has
      in mind.
    ko: |-
      방주에도 온천을 흉내 낸 욕탕들이 있지만,
      유키코가 원하는 것은 그게 아닐 것이다.
    ja: |-
      アークにも温泉風の施設はあるが、
      雪子が見たがっているのは
      そういうものではないだろう
  d_nikke_ce009_02_01_3:
    speaker: "<Monologue>"
    en: If that's the case, the only option is Snowfield Hot Spring up on the surface.
    ko: 그렇다면 지상의 설온장 밖에 없겠지.
    ja: ならば、地上にある雪見温泉しかない
  d_nikke_ce009_02_01_4:
    speaker: "<Monologue>"
    en: Since it'd be nearly impossible for Yukiko to find it on her own,
    ko: 그곳을 유키코 혼자 찾아가는 것은 불가능에 가까울 것이기 때문에,
    ja: |-
      しかし、彼女を単独で
      送り出すわけにもいかないため…
  d_nikke_ce009_02_01_5:
    speaker: "<Monologue>"
    en: I decide to go with her.
    ko: 나는 유키코를 따라나섰다.
    ja: 成り行き上、私も同行することになった
  d_nikke_ce009_02_01_6:
    speaker: ce009_02
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_01_7:
    speaker: "<Self>"
    en: Yukiko!
    ko: 유키코!
    ja: 待たせたな
  d_nikke_ce009_02_01_8:
    speaker: ce009_02
    en: Oh, Commander. You're here.
    ko: 아 지휘관, 왔구나.
    ja: あ、指揮官。来たんだね。
  d_nikke_ce009_02_01_9:
    speaker: "<Self>"
    en: What were you doing?
    ko: 뭐 하고 있었어?
    ja: 何をしていたんだ？
  d_nikke_ce009_02_01_10:
    speaker: ce009_02
    en: I was just thinking...
    ko: 잠시 생각을 좀 하고 있었어.
    ja: ちょっと考えごとを。
  d_nikke_ce009_02_01_11:
    speaker: ce009_02
    en: It's fascinating
    ko: 신기하다 싶었거든.
    ja: 不思議だなって思ったの。
  d_nikke_ce009_02_01_12:
    speaker: ce009_02
    en: that even an underground city like this has hot springs.
    ko: 이런 지하 도시에도 온천이 있다니.
    ja: こんな地下の都市にも温泉があるなんて。
  d_nikke_ce009_02_01_13:
    speaker: ce009_02
    en: "... Then again,"
    ko: "…아니지."
    ja: "…いや、"
  d_nikke_ce009_02_01_14:
    speaker: ce009_02
    en: maybe being underground actually makes it easier to bring in the water. Yeah,
      that makes sense.
    ko: 오히려 지하라서 온천수를 끌어오기 더 좋을 수도 있겠네, 응.
    ja: |-
      むしろ地下だから、
      温泉水をくみ上げやすいのかも？
  d_nikke_ce009_02_01_15:
    speaker: "<Self>"
    en: Um... good guess,
    ko: 음… 좋은 추론이긴 한데.
    ja: まあ…ここにも無いわけではないが
  d_nikke_ce009_02_01_16:
    speaker: "<Self>"
    en: but there aren't any hot springs in the Ark.
    ko: 여기엔 없어.
    ja: 今日行くのはこの近くではない
  d_nikke_ce009_02_01_17:
    speaker: ce009_02
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_02_01_18:
    speaker: ce009_02
    en: What do you mean?
    ko: 그게 무슨 말이야?
    ja: どういうこと？
  d_nikke_ce009_02_01_19:
    speaker: "<Self>"
    en: It's not here,
    ko: 여긴 아니고.
    ja: 今日の目的地はここではなく…
  d_nikke_ce009_02_01_20:
    speaker: "<Self>"
    en: but up there.
    ko: 여기.
    ja: 上にある
  d_nikke_ce009_02_01_21:
    speaker: ce009_02
    en: Up there...?
    ko: 위…?
    ja: 上…？
  d_nikke_ce009_02_01_22:
    speaker: ce009_02
    en: You mean...
    ko: 어, 위라고 하면….
    ja: えっと、上っていうと…
  d_nikke_ce009_02_01_23:
    speaker: ce009_02
    en: there's a hot spring at the Outpost?
    ko: 전초기지에 있다는 건가?
    ja: 前哨基地にあるってこと？
  d_nikke_ce009_02_01_24:
    speaker: "<Self>"
    en: You'll see when we get there.
    ko: 이따가 보면 알 거야.
    ja: 行けば分かる
  d_nikke_ce009_02_01_25:
    speaker: ce009_02
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_ce009_02_01_26:
    speaker: tove
    en: Hehe, hope I didn't keep you two waiting.
    ko: 헤헤, 두 분 오래 기다리셨나요?
    ja: えへへ、お待たせしてしまいましたか？
  d_nikke_ce009_02_01_27:
    speaker: "<Self>"
    en: Hey, Tove.
    ko: 왔구나.
    ja: 来てくれたか
  d_nikke_ce009_02_01_28:
    speaker: tove
    en: Hi, Survivalist!
    ko: 생존가님, 안녕하세요!
    ja: 生存者様、こんにちは！
  d_nikke_ce009_02_01_29:
    speaker: ce009_02
    en: Commander, who's this...?
    ko: 지휘관, 이분은…?
    ja: 指揮官、こちらの方は…？
  d_nikke_ce009_02_01_30:
    speaker: "<Self>"
    en: This is Tove, our survival expert.
    ko: 생존 전문가 토브라고 해.
    ja: サバイバル専門家のトーブだ
  d_nikke_ce009_02_01_31:
    speaker: "<Self>"
    en: She'll be our guide to Snowfield Hot Spring.
    ko: 우리를 설온장으로 안내해 줄 거야.
    ja: 私たちを雪見温泉まで案内してくれる
  d_nikke_ce009_02_01_32:
    speaker: ce009_02
    en: Our guide to the hot spring...? Then you must've come all this way for me.
    ko: |-
      온천까지 안내…?
      그럼, 저를 위해 와주신 거군요?
    ja: |-
      温泉までの案内を…！？
      じゃあ、私のために来てくださったんですね。
  d_nikke_ce009_02_01_33:
    speaker: ce009_02
    en: It's a pleasure to meet you, Expert! I'll be in your care. My name is Yukiko
      Amagi. Please call me Yukiko.
    ko: |-
      잘 부탁드려요, 전문가님!
      저는 아마기 유키코라고 합니다. 유키코라고 불러주세요.
    ja: |-
      よろしくお願いします、専門家さん！
      私、天城雪子と申します。
      どうぞ、雪子と呼んでください。
  d_nikke_ce009_02_01_34:
    speaker: tove
    en: S-survival expert...?
    ko: 새, 생존 전문가님…?
    ja: サ、サバイバル専門家…？
  d_nikke_ce009_02_01_35:
    speaker: tove
    en: A-ahem!
    ko: 크, 크흠!
    ja: オ、オホンッ！
  d_nikke_ce009_02_01_36:
    speaker: tove
    en: Hehe... Likewise! It's nice to meet you. You can call me Tove!
    ko: |-
      헤헤… 저야말로 잘 부탁드려요!
      저는 토브라고 불러주시면 돼요!
    ja: |-
      えへへ…こちらこそよろしくお願いしますね！
      私のことはトーブで大丈夫です！
  d_nikke_ce009_02_01_37:
    speaker: ce009_02
    en: I didn't expect we'd need a survival expert just to visit a hot spring.
    ko: 그나저나 온천에 가는데 생존 전문가께서 오시다니.
    ja: |-
      それにしても、温泉に行くのに
      サバイバル専門家の方がいらっしゃるなんて…
  d_nikke_ce009_02_01_38:
    speaker: ce009_02
    en: Is the trip there that difficult?
    ko: 혹시… 가는 길이 험한 걸까요?
    ja: もしかして…すごく険しい道のりなんですか？
  d_nikke_ce009_02_01_39:
    speaker: tove
    en: To get to Snowfield Hot Spring, we have to travel across the surface, where
      it's crawling with Raptures.
    ko: |-
      설온장으로 가기 위해선,
      랩쳐들이 우글우글한 지상을 통해야 하거든요.
    ja: |-
      雪見温泉へ行くには、
      ラプチャーだらけの地上へ
      出ないといけません。
  d_nikke_ce009_02_01_40:
    speaker: tove
    en: So having a Nikke with you is an absolute must!
    ko: 즉, 니케의 동행이 필수적이란 거죠!
    ja: |-
      つまり、ニケのサポートが
      必要不可欠ということです！
  d_nikke_ce009_02_01_41:
    speaker: ce009_02
    en: I see... I hope I'm not putting everyone out.
    ko: |-
      그렇군요…!
      그럼, 괜히 민폐를 끼친 건 아닌지…
    ja: |-
      なるほど…！
      となると、ご迷惑をおかけしてしまったのかも…
  d_nikke_ce009_02_01_42:
    speaker: ce009_02
    en: I'm sorry... This is all because I brought up the hot springs.
    ko: 제가 온천 얘기를 꺼내는 바람에… 뭔가 죄송한걸요.
    ja: |-
      ごめんなさい。
      私が軽率に「温泉を見たい」なんて言ったから…
      なんだかすみません。
  d_nikke_ce009_02_01_43:
    speaker: tove
    en: Don't worry about it! This is my job, after all!
    ko: 그건 걱정 마세요! 이게 제 할 일이니까요!
    ja: ご心配なく！それが私の仕事ですから！
  d_nikke_ce009_02_01_44:
    speaker: tove
    en: Besides, I volunteered for this myself.
    ko: 제가 직접 지원해서 오기도 했고요.
    ja: 自分から立候補したことですし。
  d_nikke_ce009_02_01_45:
    speaker: "<Self>"
    en: We'll be counting on you, Tove.
    ko: 잘 부탁할게. 토브.
    ja: 頼んだぞ、トーブ
  d_nikke_ce009_02_01_46:
    speaker: tove
    en: All right!
    ko: 네!
    ja: はい！
  d_nikke_ce009_02_01_47:
    speaker: tove
    en: Let's kick off your special guided trip
    ko: 그렇다면 설온장 특별 에스코트 서비스.
    ja: |-
      ではさっそく、
      スペシャルエスコートサービス付き
      雪見温泉ツアー…
  d_nikke_ce009_02_01_48:
    speaker: tove
    en: to Snowfield Hot Spring!
    ko: 출발하겠습니다!
    ja: スタートです！
  d_nikke_ce009_02_01_49:
    speaker: "<Monologue>"
    en: With Tove leading the way, we head for Snowfield Hot Spring.
    ko: 그렇게 우리는 토브의 에스코트를 받아, 설온장으로 향하게 되었다.
    ja: |-
      こうして私たちは、
      トーブにエスコートされながら
      雪見温泉へ向かうことになった
d_nikke_ce009_02_02:
  d_nikke_ce009_02_02_1:
    speaker: ce009_02
    en: Wow...
    ko: 와아….
    ja: わあ…
  d_nikke_ce009_02_02_2:
    speaker: ce009_02
    en: So this is the place you were talking about...
    ko: 이곳이 지휘관이 말했던….
    ja: ここが指揮官が言っていた場所？
  d_nikke_ce009_02_02_3:
    speaker: "<Self>"
    en: How does it compare to the hot springs in your world?
    ko: 너희 세계랑 비교하면 어때?
    ja: 君たちの世界と比べてどうだ？
  d_nikke_ce009_02_02_4:
    speaker: ce009_02
    en: "... It's amazing."
    ko: "…굉장해."
    ja: "…すごい。"
  d_nikke_ce009_02_02_5:
    speaker: ce009_02
    en: A hot spring this big is rare even in my world.
    ko: 우리 세계에서도 이렇게 커다란 온천장은 드물거든.
    ja: |-
      私たちの世界でも、
      こんなに大きな温泉はめったにないの。
  d_nikke_ce009_02_02_6:
    speaker: ludmilla_w
    en: So you've come.
    ko: 왔군.
    ja: 来たわね。
  d_nikke_ce009_02_02_7:
    speaker: ludmilla_w
    en: Servant and...
    ko: 시종, 그리고….
    ja: しもべ、それから…
  d_nikke_ce009_02_02_8:
    speaker: ludmilla_w
    en: visitor from another world.
    ko: 다른 세계에서 온 이여.
    ja: 異世界からのお客様。
  d_nikke_ce009_02_02_9:
    speaker: ce009_02
    en: Ah...!
    ko: 앗…!
    ja: わっ…！？
  d_nikke_ce009_02_02_10:
    speaker: mica_w
    en: Hehe. Long time no see, Old-Timer!
    ko: 헤헤, 오랜만이에요. 아저씨!
    ja: えへへ、久しぶりですね。おじさん！
  d_nikke_ce009_02_02_11:
    speaker: mica_w
    en: I see you've brought a new guest.
    ko: 새로운 손님을 데려오셨군요?
    ja: 新しいお客様を連れて来られたんですよね？
  d_nikke_ce009_02_02_12:
    speaker: "<Self>"
    en: It's been a while, you two.
    ko: 둘 다 오랜만이야.
    ja: 2人とも久しぶりだな
  d_nikke_ce009_02_02_13:
    speaker: ludmilla_w
    en: Let us continue our conversation inside.
    ko: 자세한건 들어가서 이야기하도록 하지.
    ja: 話の続きは中でしましょう。
  d_nikke_ce009_02_02_14:
    speaker: ludmilla_w
    en: It wouldn't do to leave our guests standing out here.
    ko: 손님을 밖에 두는건 예의가 아니니 말이야.
    ja: お客様を外に立たせておくのは失礼になるわ。
  d_nikke_ce009_02_02_15:
    speaker: mica_w
    en: Please follow me!
    ko: 두 분 다 저를 따라와 주세요!
    ja: では、ご案内しますね！
  d_nikke_ce009_02_02_16:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵-
    ja: カチャ…
  d_nikke_ce009_02_02_17:
    speaker: ludmilla_w
    en: Your timing couldn't have been better.
    ko: 마침 시기적절하게 찾아왔구나.
    ja: ちょうどタイミングがよかったわね。
  d_nikke_ce009_02_02_18:
    speaker: ludmilla_w
    en: Mica and I had just gathered to tend to Snowfield Hot Spring for the first
      time in quite a while.
    ko: 이 몸과 미카도 간만에 설온장을 위해 모인 참이었으니 말이야.
    ja: 私もミカも、久しぶりに様子を見に来たのよ。
  d_nikke_ce009_02_02_19:
    speaker: "<Self>"
    en: That's good to hear.
    ko: 그건 다행이네.
    ja: それはよかった
  d_nikke_ce009_02_02_20:
    speaker: ludmilla_w
    en: Oh, forgive me. I have yet to introduce myself.
    ko: 아아, 그러고 보니 소개가 늦었군.
    ja: あっ、そういえば紹介が遅れたわね。
  d_nikke_ce009_02_02_21:
    speaker: ludmilla_w
    en: I am Ludmilla.
    ko: 이 몸은 루드밀라라고 한다.
    ja: 私はルドミラよ。
  d_nikke_ce009_02_02_22:
    speaker: ludmilla_w
    en: I oversee Snowfield Hot Spring and guide those who lose their way in the snowy
      mountains.
    ko: 이 설온장을 관리하며, 설산에서 길 잃은 자들을 인도하고 있지.
    ja: |-
      この雪見温泉の管理人で、
      雪山で道に迷った人を導いているわ。
  d_nikke_ce009_02_02_23:
    speaker: mica_w
    en: My name's Mica! I help Ludmilla out at Snowfield Hot Spring!
    ko: 저는 미카에요! 루드밀라 곁에서 설온장 일을 돕고 있어요!
    ja: |-
      私はミカです！ルドミラのそばで
      雪見温泉のお仕事を手伝ってます！
  d_nikke_ce009_02_02_24:
    speaker: ce009_02
    en: It's a pleasure to meet you, Ludmilla-san, Mica-san.
    ko: 반가워요. 루드밀라 씨, 미카 씨.
    ja: |-
      お会いできて嬉しいです。
      ルドミラさん、ミカさん。
  d_nikke_ce009_02_02_25:
    speaker: ce009_02
    en: I'm Yukiko Amagi. Please call me Yukiko.
    ko: |-
      아마기 유키코라고 해요.
      유키코라고 불러 주세요.
    ja: |-
      天城雪子と言います。
      雪子って呼んでください。
  d_nikke_ce009_02_02_26:
    speaker: ludmilla_w
    en: So, I hear you'd like to look around Snowfield Hot Spring?
    ko: 그래서, 설온장을 둘러보고 싶다고 했나?
    ja: 雪見温泉を見たいのだったわね？
  d_nikke_ce009_02_02_27:
    speaker: ce009_02
    en: Yes, I'd love to.
    ko: 네, 맞아요.
    ja: はい。
  d_nikke_ce009_02_02_28:
    speaker: ce009_02
    en: When I heard there were hot springs in this world too, I couldn't help but
      get curious.
    ko: 이 세계에도 온천이 있다길래 호기심이 생겼거든요.
    ja: |-
      この世界にも温泉があると聞いて、
      気になったんです。
  d_nikke_ce009_02_02_29:
    speaker: ce009_02
    en: I wanted to see what they're like...
    ko: 과연 어떻게 되어있을까… 하고.
    ja: どんな感じなんだろう…って。
  d_nikke_ce009_02_02_30:
    speaker: mica_w
    en: Y-you said you're the heiress to an inn, right?
    ko: 여, 여관의 후계자라고 하셨죠?
    ja: りょ、旅館の跡継ぎさん、でしたよね？
  d_nikke_ce009_02_02_31:
    speaker: ce009_02
    en: That's right. My family runs a hot spring inn, so someday, I'll also...
    ko: |-
      네, 맞아요. 본가에서 온천을 운영하거든요.
      그러니 저도 언젠가는….
    ja: |-
      はい。
      実家が旅館なので、
      ゆくゆくは…という感じなんです。
  d_nikke_ce009_02_02_32:
    speaker: mica_w
    en: I-I see...
    ko: 그, 그렇군요?
    ja: な、なるほど。
  d_nikke_ce009_02_02_33:
    speaker: mica_w
    en: I have to admit... I'm a little nervous.
    ko: 뭐랄까… 조금 긴장되네요.
    ja: なんというか…ちょっと緊張しますね。
  d_nikke_ce009_02_02_34:
    speaker: mica_w
    en: We've never had someone who does this for a living as a guest before... Hehe.
    ko: 본업을 삼고 계시는 분이 오신 건 처음이라서요… 헤헤.
    ja: |-
      本業の方が来るのは
      初めてなので…えへへ。
  d_nikke_ce009_02_02_35:
    speaker: ce009_02
    en: Haha, there's really no need to feel so pressured.
    ko: 아하하, 너무 부담가지실 필욘 없어요.
    ja: |-
      あはは、あまりプレッシャーに
      思わないでください。
  d_nikke_ce009_02_02_36:
    speaker: ce009_02
    en: I'm not really here to evaluate anything. It's more like I'm just on a vacation,
    ko: 지금은 평가하러 왔다기보단, 여행 온 기분이니까요.
    ja: |-
      何も視察に来てるとかじゃなくて、ええと…
      旅行に来ているみたいな感覚なんです。
  d_nikke_ce009_02_02_37:
    speaker: ce009_02
    en: so I'd love to see what things are usually like around here. Please don't
      feel like you have to go out of your way for me!
    ko: |-
      그러니, 평소의 모습을 볼 수 있으면 좋겠어요.
      너무 신경 쓰지 않으셔도 되니까요!
    ja: |-
      だから、普段通りのミカさんや、
      雪見温泉を見られたら嬉しいなって。
      気を遣わないでいただける方がありがたいです！
  d_nikke_ce009_02_02_38:
    speaker: ludmilla_w
    en: Haha, Yukiko is quite right.
    ko: 하하, 유키코의 말이 맞다.
    ja: ふふ、彼女の言う通りよ。
  d_nikke_ce009_02_02_39:
    speaker: ludmilla_w
    en: At Snowfield Hot Spring, our philosophy is that everyone who visits should
      be able to rest in comfort.
    ko: 설온장은 누구나 편히 쉬어갈 수 있는 장소라는 게 모토니까.
    ja: |-
      誰もが気楽に休める場所、
      それが雪見温泉の目指すものだから。
  d_nikke_ce009_02_02_40:
    speaker: ludmilla_w
    en: I'm certain she won't be disappointed, so there's no need to worry.
    ko: 분명 실망하지 않을 테니, 너무 걱정 말거라.
    ja: |-
      期待を裏切ることはないはずよ。
      心配しすぎることはないわ。
  d_nikke_ce009_02_02_41:
    speaker: "<Self>"
    en: I'm actually looking forward to this too. It's been a while.
    ko: 나도 오랜만에 기대되는걸.
    ja: 私も久しぶりだから楽しみだ
  d_nikke_ce009_02_02_42:
    speaker: ludmilla_w
    en: Would you be so kind as to show our guests around, Mica?
    ko: 미카여, 손님들의 안내를 부탁해도 되겠나?
    ja: ミカ、お客様の案内を頼めるかしら？
  d_nikke_ce009_02_02_43:
    speaker: ludmilla_w
    en: I'll be with you as soon as I've finished attending to a few matters.
    ko: 이 몸은 하던 일을 끝내고 돌아오도록 하마.
    ja: 私は他の作業を終わらせてから戻るわ。
  d_nikke_ce009_02_02_44:
    speaker: mica_w
    en: Of course! Leave it to me!
    ko: 네, 물론이죠! 제게 맡겨주세요!
    ja: はい、もちろんです！お任せください！
  d_nikke_ce009_02_02_45:
    speaker: "<Monologue>"
    en: With that, Mica spends the next few hours
    ko: 그렇게 우리는 미카의 안내에 이끌려.
    ja: こうして私たちはミカに案内され、
  d_nikke_ce009_02_02_46:
    speaker: "<Monologue>"
    en: showing us around Snowfield Hot Spring.
    ko: 한참 동안 설온장을 둘러보았고.
    ja: ゆっくり雪見温泉を見て回った
  d_nikke_ce009_02_02_47:
    speaker: "<Monologue>"
    en: By the time we finally head back inside, the sun is already setting.
    ko: 해 질 녘이 되어서야 실내로 돌아올 수 있었다.
    ja: |-
      室内に戻ってくることができたのは、
      日暮れ頃だった
  d_nikke_ce009_02_02_48:
    speaker: "<Self>"
    en: This place has gotten a lot better since the last time I was here.
    ko: 전보다 훨씬 좋아진 거 같은데.
    ja: 前よりもよくなっている気がするな
  d_nikke_ce009_02_02_49:
    speaker: "<Self>"
    en: What'd you think, Yukiko?
    ko: 유키코는 어땠어?
    ja: 君の感想は？
  d_nikke_ce009_02_02_50:
    speaker: ce009_02
    en: It was amazing! It really made me realize this is the kind of hot spring you
      can only find on the surface.
    ko: |-
      정말 멋졌어!
      지상에 있으니까 가능한 온천이구나 싶더라고.
    ja: |-
      もちろん、とても素敵だったよ！
      地上にあるからこその温泉って感じがして…
  d_nikke_ce009_02_02_51:
    speaker: ce009_02
    en: I know I said I'm just here on vacation,
    ko: 아까는 여행 온 기분이라 했지만.
    ja: 旅行のつもりなんて言ったけど…
  d_nikke_ce009_02_02_52:
    speaker: ce009_02
    en: but seeing it in person is something else. The atmosphere is wonderful, and
      you can really feel how much care has gone into this place. I feel like I've
      learned so much from the experience.
    ko: |-
      막상 마주하니 분위기도 있는 데다 정성까지 느껴져서,
      배울 점이 엄청 많았달까….
    ja: |-
      綺麗な場所や、こだわりがあるところが多くて、
      勉強になるところが多いなとも思っちゃった。
  d_nikke_ce009_02_02_53:
    speaker: mica_w
    en: Hehe, I'm glad to hear that!
    ko: 헤헤, 그렇다면 다행이네요!
    ja: えへへ、それならよかったです！
  d_nikke_ce009_02_02_54:
    speaker: ce009_02
    en: Are you two really the only ones running this entire hot spring?
    ko: 이 거대한 설온장을 두 분이 관리하고 있는 건가요?
    ja: |-
      この大きな雪見温泉を
      お二人で管理しているんですか？
  d_nikke_ce009_02_02_55:
    speaker: mica_w
    en: Yep! But there's another Nikke who lives here and helps out, too.
    ko: 네! 그렇긴 한데, 상주하며 도와주는 니케 분도 있어요.
    ja: |-
      はい！でも、他に住み込みで
      手伝ってくれているニケもいるんです。
  d_nikke_ce009_02_02_56:
    speaker: mica_w
    en: We're all working together to give our guests an even better experience.
    ko: 다 같이 힘을 합쳐 더 나은 접객을 위해 힘쓰고 있답니다.
    ja: |-
      みんなで力を合わせて、
      素敵なおもてなしができるように頑張ってます。
  d_nikke_ce009_02_02_57:
    speaker: "<Narration>"
    en: "*Bzzzt*"
    ko: 끼이익-
    ja: キィィ…
  d_nikke_ce009_02_02_58:
    speaker: mica_w
    en: Like this big massage chair, for example...
    ko: 예를 들어 여기 있는 대형 안마의자라던가….
    ja: |-
      たとえば、ここにある
      大きなマッサージチェアですけど…
  d_nikke_ce009_02_02_59:
    speaker: ce009_04
    en: Urrrrrgghh...
    ko: 으으으으으으….
    ja: うううううう…
  d_nikke_ce009_02_02_60:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_02_02_61:
    speaker: ce009_04
    en: Th-the v-v-vibrations just won't stop...!
    ko: 떠떠떠떠떠떨림이 멈추지 않는다고오오오옴….
    ja: ふふふふふ震えが止まらないクマぁぁぁぁ…
  d_nikke_ce009_02_02_62:
    speaker: ce009_02
    en: T-Teddie?! What's going on...?!
    ko: 고, 곰?! 이게 무슨 일이야…?!
    ja: ク、クマさん！？どうしたの…！？
  d_nikke_ce009_02_02_63:
    speaker: ce009_04
    en: Th-th-th-that v-v-voice... Y-Y-Yuki-chaaan?!
    ko: 그그그그목목목소리는…유키키키이짜아아앙…?!
    ja: |-
      あばばばばばば…
      そそそそののの声は…
      ユキキキキキチャチャチャチャン…！？
  d_nikke_ce009_02_02_64:
    speaker: ce009_02
    en: Pfft... He can't even say my name properly...
    ko: 푸, 푸흡… 곰이 내 이름을 전혀 못 부르고 있….
    ja: ぷぷっ…！クマさん、全然私の名前、呼べてな…
  d_nikke_ce009_02_02_65:
    speaker: ce009_02
    en: Hahaha...!
    ko: 푸하하핫…!
    ja: ぷぷぷぷっ…！
  d_nikke_ce009_02_02_66:
    speaker: "<Self>"
    en: Teddie?!
    ko: 곰?!
    ja: クマ！？
  d_nikke_ce009_02_02_67:
    speaker: mica_w
    en: O-oh no...
    ko: 이, 이럴 수가….
    ja: そ、そんな…
  d_nikke_ce009_02_02_68:
    speaker: mica_w
    en: Don't tell me you've been like this all day...
    ko: 설마 오늘 하루 종일 이러고 계셨던 건가요…?
    ja: まさか今日一日中、この状態で…？
  d_nikke_ce009_02_02_69:
    speaker: ce009_04
    en: I c-c-can't get uuuup...! The chair's reclined way too faaaar...!
    ko: 모모모모몸이 뒤로 젖혀져서어어어 일어날 수가 없다고오오옴….
    ja: |-
      かかかか体がのけぞってぇぇぇ
      起き上がれないクマぁぁぁ…
  d_nikke_ce009_02_02_70:
    speaker: ce009_04
    en: H-h-hurry up and help me uuuup...!
    ko: 빠빠빠빠빨리 일으켜달라고오오오옴….
    ja: はははは早く起こしてほしいクマぁぁぁ…
  d_nikke_ce009_02_02_71:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_02_72:
    speaker: "<Monologue>"
    en: As Yukiko doubles over with laughter, I help the flailing Teddie out of the
      massage chair.
    ko: |-
      웃음보가 터진 유키코를 뒤로하고,
      안마의자에서 버둥거리는 곰을 일으켜 세워준다.
    ja: |-
      笑いのスイッチが入ってしまった
      雪子は後回しにし、マッサージチェアで
      もがいていたクマを起こした
  d_nikke_ce009_02_02_73:
    speaker: ce009_04
    en: I-I don't feel so good...
    ko: 소, 속이 좋지 않다곰….
    ja: は、吐きそうクマ…
  d_nikke_ce009_02_02_74:
    speaker: "<Self>"
    en: "... When'd you get here?"
    ko: "…곰은 언제부터 와있던 거야?"
    ja: "…いつ来ていたんだ？"
  d_nikke_ce009_02_02_75:
    speaker: mica_w
    en: Well...
    ko: 아, 그게 말이죠…
    ja: ええと、それはですね…
  d_nikke_ce009_02_02_76:
    speaker: mica_w
    en: He got here before you two did.
    ko: 두 분이 오기 전에 먼저 오셨어요.
    ja: お二人が来る前からです。
  d_nikke_ce009_02_02_77:
    speaker: mica_w
    en: He said he wanted to enjoy the hot spring on his own, so we left him to it...
      I had no idea it'd end up like this.
    ko: 온천을 자유롭게 즐기고 싶다 해서 보내드렸었는데, 이렇게 될 줄은….
    ja: |-
      気ままに楽しみたいとおっしゃったので
      個別の案内はしなかったんですが、
      まさかこんなことになってたなんて…
  d_nikke_ce009_02_02_78:
    speaker: ce009_04
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_02_02_79:
    speaker: "<Narration>"
    en: Teddie jolts up.
    ko: 벌떡-
    ja: ガバッ！
  d_nikke_ce009_02_02_80:
    speaker: ce009_04
    en: F-forget that! What time is it right now?!
    ko: 그, 그보다! 지금 몇 시냐곰?!
    ja: そ、それはそうと！今は何時クマ！？
  d_nikke_ce009_02_02_81:
    speaker: ce009_02
    en: The sun's setting... so it's probably evening?
    ko: 해가 지고 있으니… 아마 저녁 아닐까?
    ja: 日が暮れてるから…夕方じゃないかな？
  d_nikke_ce009_02_02_82:
    speaker: ce009_04
    en: This is bad...
    ko: "…큰일이다곰."
    ja: "…大変クマ。"
  d_nikke_ce009_02_02_83:
    speaker: ce009_04
    en: I gotta go.
    ko: 곰은 가봐야겠다곰.
    ja: こうしちゃいられないクマよ！
  d_nikke_ce009_02_02_84:
    speaker: "<Monologue>"
    en: Teddie hurries off somewhere.
    ko: 곰이 황급히 자리를 뜬다.
    ja: クマはあわてた様子でその場を去った
  d_nikke_ce009_02_02_85:
    speaker: ce009_02
    en: "... Looks like Teddie still has a lot he wants to do."
    ko: "…곰은 아직 하고 싶은 게 많나 보네."
    ja: |-
      …クマさんは、まだやりたいことが
      たくさんあるみたい。
  d_nikke_ce009_02_02_86:
    speaker: "<Self>"
    en: Yeah...
    ko: 그러게….
    ja: そのようだな…
  d_nikke_ce009_02_02_87:
    speaker: mica_w
    en: Hehe, you two should get some rest, too.
    ko: 헤헤, 두 분 도 이제 그만 쉬세요.
    ja: えへへ、お二人もお疲れでしょう？
  d_nikke_ce009_02_02_88:
    speaker: mica_w
    en: I'll be heading back now.
    ko: 저도 돌아가 있을 테니까요.
    ja: 私はここで失礼しますね。
  d_nikke_ce009_02_02_89:
    speaker: mica_w
    en: I hope you have a relaxing stay!
    ko: 편안한 휴식 되시길 바랄게요!
    ja: ごゆっくりおくつろぎください！
d_nikke_ce009_02_03:
  d_nikke_ce009_02_03_1:
    speaker: ce009_02
    en: Mica-san! Um, do you have a moment?
    ko: |-
      미카 씨!
      저기, 잠시 괜찮으신가요?
    ja: |-
      ミカさん！
      あの、少しいいですか？
  d_nikke_ce009_02_03_2:
    speaker: mica_w
    en: Huh? Yes?
    ko: 으응? 네?
    ja: えっ？はい！
  d_nikke_ce009_02_03_3:
    speaker: mica_w
    en: Do you need something?
    ko: 혹시 필요한 거라도 있으신가요?
    ja: 何か必要なものでもありますか？
  d_nikke_ce009_02_03_4:
    speaker: ce009_02
    en: No, not really.
    ko: 아, 그건 아니고요.
    ja: あっ、いえ、そうではなくて。
  d_nikke_ce009_02_03_5:
    speaker: ce009_02
    en: I was hoping to ask you a few things about the hot spring, Mica-san.
    ko: 온천 관리인이신 미카 씨에게 이것저것 여쭤보고 싶은 게 있어서요.
    ja: |-
      温泉の管理人のミカさんに
      色々とお聞きしたいことがあるんです。
  d_nikke_ce009_02_03_6:
    speaker: mica_w
    en: Sure! Ask away!
    ko: 네, 물론 여쭤보셔도 되죠!
    ja: もちろん、何でも聞いてください！
  d_nikke_ce009_02_03_7:
    speaker: ce009_02
    en: Thank you.
    ko: 감사드려요.
    ja: ありがとうございます。
  d_nikke_ce009_02_03_8:
    speaker: ce009_02
    en: Um... first,
    ko: 음… 그렇다면 먼저 여쭤보고 싶은 건.
    ja: そしたら、まずは…
  d_nikke_ce009_02_03_9:
    speaker: ce009_02
    en: may I ask what kind of guests usually come to Snowfield Hot Spring?
    ko: 설온장에는 어떤 손님들이 오시는지 여쭤봐도 될까요?
    ja: |-
      雪見温泉にはどんなお客さんが
      いらっしゃるのか、訊いていいですか？
  d_nikke_ce009_02_03_10:
    speaker: ce009_02
    en: And, if you don't mind... I'd also like to ask how you bring in guests!
    ko: |-
      그리고, 혹시 괜찮으시다면…
      손님을 모으는 방법 같은 것도 여쭤보고 싶어요!
    ja: |-
      それと、もし良ければなんですけど…
      集客方法とかも伺いたいです！
  d_nikke_ce009_02_03_11:
    speaker: ce009_02
    en: I was just curious because it doesn't seem like you do much advertising.
    ko: 뭔가 크게 홍보하고 있는 느낌은 아닌 것 같아 궁금해서요.
    ja: |-
      大々的に宣伝してる感じではなさそうで、
      気になって…
  d_nikke_ce009_02_03_12:
    speaker: mica_w
    en: Oh, our guests are mainly Nikkes who get lost in the North...
    ko: 아, 저희는 주로 북부에서 길을 잃은 니케 분들이….
    ja: |-
      あっ、この温泉には主に北部で道に迷った
      ニケの皆さんが…
  d_nikke_ce009_02_03_13:
    speaker: "<Narration>"
    en: Meanwhile...
    ko: 한편 그 무렵….
    ja: 一方、その頃…
  d_nikke_ce009_02_03_14:
    speaker: ce009_04
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_15:
    speaker: ce009_04
    en: "*Sniff, sniff*"
    ko: 킁킁….
    ja: クンクン…
  d_nikke_ce009_02_03_16:
    speaker: ce009_04
    en: "... Am I in the right place, bearhaps?"
    ko: "…여긴가곰?"
    ja: "…ここクマ？"
  d_nikke_ce009_02_03_17:
    speaker: eunhwa_t
    en: I'd recognize the back of your head anywhere.
    ko: 낯익은 뒤통수로군.
    ja: おい、そこの見覚えのあるクマ。
  d_nikke_ce009_02_03_18:
    speaker: ce009_04
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_19:
    speaker: eunhwa_t
    en: Hey, I'm talking to you.
    ko: "…어이, 너를 부르고 있잖아."
    ja: チッ…おい、お前に訊いてる
  d_nikke_ce009_02_03_20:
    speaker: ce009_04
    en: Shh.
    ko: 쉿.
    ja: シーッ。
  d_nikke_ce009_02_03_21:
    speaker: ce009_04
    en: Don't talk to me right now.
    ko: 말 걸지 말아 달라곰.
    ja: 話しかけないでほしいクマ。
  d_nikke_ce009_02_03_22:
    speaker: ce009_04
    en: I'm beary focused.
    ko: 곰은 지금 집중 중이다곰.
    ja: 集中モードクマよ。
  d_nikke_ce009_02_03_23:
    speaker: eunhwa_t
    en: What are you doing here?
    ko: 여기서 뭘 하고 있는 거지?
    ja: ここで何をしている？
  d_nikke_ce009_02_03_24:
    speaker: ce009_04
    en: "... I'm on the hunt"
    ko: "…곰은 지금 찾아 헤매고 있다곰."
    ja: "…クマは今、探し求めているクマ。"
  d_nikke_ce009_02_03_25:
    speaker: ce009_04
    en: for every man's dream.
    ko: 사나이의 로망을 말이지곰.
    ja: ズバリ、男のロマンを！
  d_nikke_ce009_02_03_26:
    speaker: eunhwa_t
    en: "... What exactly do you mean?"
    ko: "…그게 뭐지?"
    ja: "…何だそれは。"
  d_nikke_ce009_02_03_27:
    speaker: ce009_04
    en: Like I said, I'm searching for every man's dream!
    ko: 그러니까, [사나이의 로망] 이라곰!
    ja: だから、「男のロマン」クマ！
  d_nikke_ce009_02_03_28:
    speaker: eunhwa_t
    en: That's what I'm asking. What exactly do you mean?
    ko: 그러니까, 그게 뭐냐고 묻고 있다.
    ja: だから、それが何かと聞いている。
  d_nikke_ce009_02_03_29:
    speaker: ce009_04
    en: C'mon, there's only one thing a guy dreams of at a hot spring!
    ko: 온천의 로망이라면 한 가지 아니겠냐곰.
    ja: 温泉のロマンといえば、他にないクマよ。
  d_nikke_ce009_02_03_30:
    speaker: ce009_04
    en: A mixed bath, of course!
    ko: 당연히 혼탕이지곰!
    ja: とうぜん、混浴クマ～！
  d_nikke_ce009_02_03_31:
    speaker: eunhwa_t
    en: Oh, is that so?
    ko: 호오, 그래?
    ja: ほう、そうか。
  d_nikke_ce009_02_03_32:
    speaker: ce009_04
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_33:
    speaker: ce009_04
    en: Huh...?
    ko: 곰…?
    ja: クマ…？
  d_nikke_ce009_02_03_34:
    speaker: "<Narration>"
    en: Only then does Teddie turn around.
    ko: 그제서야 뒤를 돌아본다.
    ja: |-
      クマはその時になって、
      ようやく後ろを振り向いた
  d_nikke_ce009_02_03_35:
    speaker: ce009_04
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  d_nikke_ce009_02_03_36:
    speaker: eunhwa_t
    en: You've got a sick way of thinking.
    ko: 생각이 썩어 빠졌군.
    ja: 脳ミソが腐っているな。
  d_nikke_ce009_02_03_37:
    speaker: "<Narration>"
    en: Eunhwa grabs Teddie and stretches him hard.
    ko: 쭈우우우욱-
    ja: ミシミシミシ――
  d_nikke_ce009_02_03_38:
    speaker: ce009_04
    en: Gaaaahhhh?! S-stop that!
    ko: 아다다다다다?! 아, 안된다곰!
    ja: いだだだだだだ！？ダメクマー！
  d_nikke_ce009_02_03_39:
    speaker: ce009_04
    en: My cute body's getting stretched beyond the laws of physics!
    ko: 곰의 귀여운 몸이 [물리법칙]을 무시하고 늘어나고 있다곰!
    ja: |-
      クマのぷりちーなカラダがッ、
      「ブツリホーソク」を無視して
      伸ばされちゃってるクマぁ～！？
  d_nikke_ce009_02_03_40:
    speaker: ce009_04
    en: I-I can't bear it any more, Eunhwa-chan!
    ko: 은화짱, 그 이상은 안 된다곰~!!!
    ja: |-
      「ウンファチャン、
      それ以上はダメクマぁ～！！！！」
  d_nikke_ce009_02_03_41:
    speaker: "<Monologue>"
    en: After exploring the hot spring inn, Yukiko and I head back inside.
    ko: 유키코와 설온장 구경을 끝내고 난 후, 들어온 실내.
    ja: |-
      雪子と温泉見学を終えた後、
      旅館の中に戻った
  d_nikke_ce009_02_03_42:
    speaker: "<Monologue>"
    en: No sooner do we step through the door than it swings open again, bringing
      our peaceful moment to an end.
    ko: 돌아오자마자 곧바로 문이 열리고 평온한 한때는 끝을 고했다.
    ja: |-
      しかし、戻ってすぐに向かった先で、
      開かれた扉とともに
      おだやかなひと時は終わりを告げた
  d_nikke_ce009_02_03_43:
    speaker: "<Narration>"
    en: "*Creak*"
    ko: 끼이익-
    ja: キィィ…
  d_nikke_ce009_02_03_44:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_45:
    speaker: ce009_02
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_46:
    speaker: ce009_04
    en: Urghhh...
    ko: 고오옴….
    ja: クマぁ…
  d_nikke_ce009_02_03_47:
    speaker: "<Monologue>"
    en: In stumbles a battered Teddie.
    ko: 너덜너덜해진 곰과.
    ja: ボロボロになったクマと…
  d_nikke_ce009_02_03_48:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_49:
    speaker: "<Monologue>"
    en: And standing before him is...
    ko: 그 앞에 서 있는 건….
    ja: その前で立っているのは…
  d_nikke_ce009_02_03_50:
    speaker: "<Self>"
    en: Absolute?
    ko: 앱솔루트?
    ja: アブソルート？
  d_nikke_ce009_02_03_51:
    speaker: emma_t
    en: Oh my, if it isn't the Commander and Yukiko.
    ko: 어머, 지휘관이랑 유키코잖아?
    ja: あら、指揮官と雪子？
  d_nikke_ce009_02_03_52:
    speaker: ce009_04
    en: Commander, Yuki-chan... Good to see you again...
    ko: |-
      지휘관, 유키짱…
      또 본다곰….
    ja: |-
      ちしかん…ユキチャン…
      さっきぶりクマ…
  d_nikke_ce009_02_03_53:
    speaker: eunhwa_t
    en: The fact you're still talking means I went too easy on you.
    ko: 아직 말할 힘이 남아 있는 걸 보니, 손을 덜 봐줬나 보군.
    ja: |-
      まだしゃべる力が残っているところを見ると、
      罰が足りなかったようだな。
  d_nikke_ce009_02_03_54:
    speaker: ce009_04
    en: N-ngaaah!
    ko: 으, 으갸악~!
    ja: ウギャー！！！！
  d_nikke_ce009_02_03_55:
    speaker: ce009_04
    en: I'm sorry, Eunhwa-chan! Please don't stretch me anymore!
    ko: |-
      곰이 잘못했다곰!
      더 이상 은화짱에게 늘어나는 건 사양이다곰!!!
    ja: |-
      クマが悪かったクマ～！！
      もうウンファチャンに伸ばされちゃうのは
      ゴメンクマよ！！！！
  d_nikke_ce009_02_03_56:
    speaker: "<Monologue>"
    en: As Teddie tries to escape Eunhwa...
    ko: 은화를 피해 도망간 곰은….
    ja: ウンファから逃げ出したクマは…
  d_nikke_ce009_02_03_57:
    speaker: "<Narration>"
    en: "*Fwomp*"
    ko: 푹신-
    ja: ぼすっ…
  d_nikke_ce009_02_03_58:
    speaker: emma_t
    en: Oh my!
    ko: 어머나~
    ja: あらあら～
  d_nikke_ce009_02_03_59:
    speaker: "<Monologue>"
    en: He falls right onto Emma.
    ko: 엠마 쪽으로 쓰러졌다.
    ja: エマの方に倒れ込んだ
  d_nikke_ce009_02_03_60:
    speaker: ce009_02
    en: Oh, Absolute! Thank you for helping train us the other day.
    ko: |-
      아, 앱솔루트 여러분!
      지난번 훈련 지도해 주셔서 감사했어요.
    ja: |-
      あっ、アブソルートの皆さん！
      先日は訓練をつけていただき、
      ありがとうございました。
  d_nikke_ce009_02_03_61:
    speaker: ce009_02
    en: What brings you here?
    ko: 그런데, 여긴 무슨 일이신가요?
    ja: でも、どうしてここに…？
  d_nikke_ce009_02_03_62:
    speaker: vesti_t
    en: W-well, we come here to unwind after missions every now and then.
    ko: 으응. 이, 임무가 끝나면 종종 피로를 풀러 오거든.
    ja: |-
      に、任務が終わったら、
      よく疲れをほぐしにくるの。
  d_nikke_ce009_02_03_63:
    speaker: vesti_t
    en: The facilities are great, and there aren't many people around, either...
    ko: 여긴 시설도 좋은데 보는 눈도 적으니까….
    ja: 施設も整ってるし、人も少ないから…
  d_nikke_ce009_02_03_64:
    speaker: ce009_02
    en: Going to a hot spring to unwind after a hard day's work...
    ko: 퇴근 후의 휴식으로 온천이라…
    ja: 仕事終わりの休憩に温泉…
  d_nikke_ce009_02_03_65:
    speaker: ce009_02
    en: I know exactly how that feels.
    ko: 그 기분, 잘 알아요.
    ja: その気持ち、よくわかります。
  d_nikke_ce009_02_03_66:
    speaker: ce009_02
    en: We often have guests stop by our hot spring after work.
    ko: 손님들이 일을 끝내고 저희 온천에 오시는 경우가 종종 있거든요.
    ja: |-
      大きな仕事を終えたお客様が、休憩にうちの
      温泉にいらっしゃることがよくありますから…
  d_nikke_ce009_02_03_67:
    speaker: vesti_t
    en: Hehe... R-right?
    ko: 헤헤… 그, 그렇지?
    ja: えへへ…そ、そうでしょ？
  d_nikke_ce009_02_03_68:
    speaker: emma_t
    en: Hmm... I didn't expect to see so many tired faces around here.
    ko: 으음… 생각보다 피곤해 보이는 사람들이 많네~?
    ja: |-
      う～ん…思ったより、疲れている人が
      たくさんいるってことね～？
  d_nikke_ce009_02_03_69:
    speaker: emma_t
    en: I was going to take it easy tonight, but I guess that can't be helped.
    ko: 오늘은 좀 쉴까 했는데 어쩔 수 없겠어.
    ja: |-
      今日はちょっと休むつもりだったけど、
      仕方ないわ～
  d_nikke_ce009_02_03_70:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_02_03_71:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_72:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_03_73:
    speaker: emma_t
    en: I'll just have to work a little magic for everyone who's been working so hard.
    ko: 고생한 모두를 위해 내가 솜씨를 좀 발휘해야겠는걸?
    ja: |-
      頑張ったみんなのために、
      腕を振るうしかないわよね？
  d_nikke_ce009_02_03_74:
    speaker: "<Self>"
    en: Uh oh...
    ko: 서, 설마….
    ja: ま、まさか…
  d_nikke_ce009_02_03_75:
    speaker: emma_t
    en: You must all be hungry.
    ko: 다들 배고프지?
    ja: みんな、お腹が空いてるでしょう？
  d_nikke_ce009_02_03_76:
    speaker: emma_t
    en: I'll take care of dinner tonight.
    ko: 오늘 저녁은 내가 준비하도록 할게.
    ja: 今日の夕食は私が用意するわ～
  d_nikke_ce009_02_03_77:
    speaker: "<Monologue>"
    en: Emma's words leave me in despair.
    ko: 엠마의 말에 나는 절망했다.
    ja: エマの言葉に私は絶望した
  d_nikke_ce009_02_03_78:
    speaker: "<Monologue>"
    en: Little do I know this despair is nothing compared to the hell that's yet to
      come.
    ko: |-
      하지만 이때 느낀 절망은 뒤에 찾아올 지옥에 비하면,
      사소한 것에 불과했다는 사실을 알 길이 없었다.
    ja: |-
      しかし、この時点で感じた絶望は
      その後の地獄と比べれば
      些細なものだったのだと
      私には知る由もなかった
d_nikke_ce009_02_04:
  d_nikke_ce009_02_04_1:
    speaker: "<Self>"
    en: We already ate earlier...
    ko: 우리는 아까 뭐를 좀 먹어서….
    ja: いや、私たちは先に少し食べたから…
  d_nikke_ce009_02_04_2:
    speaker: ce009_02
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_02_04_3:
    speaker: ce009_02
    en: But Commander, we haven't eaten anything since we got here—
    ko: 지휘관, 우리 여기 온 이후로 아무것도….
    ja: 指揮官、ここに来てからはまだ何も…
  d_nikke_ce009_02_04_4:
    speaker: "<Self>"
    en: Shh...
    ko: 쉬, 쉬이잇….
    ja: シ、シーッ…
  d_nikke_ce009_02_04_5:
    speaker: emma_t
    en: I heard that!
    ko: 그렇다는데~?
    ja: あら、そうなの～？
  d_nikke_ce009_02_04_6:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_7:
    speaker: vesti_t
    en: I think we're in big trouble, Eunhwa...
    ko: 큰일 났어, 은화….
    ja: どうしよう、ウンファ…
  d_nikke_ce009_02_04_8:
    speaker: eunhwa_t
    en: "... Agreed."
    ko: "…동감이다."
    ja: "…まずいな。"
  d_nikke_ce009_02_04_9:
    speaker: "<Self>"
    en: Crap...
    ko: 크흑….
    ja: くっ…
  d_nikke_ce009_02_04_10:
    speaker: ce009_02
    en: Wait, Emma-san!
    ko: 엠마 씨, 잠시만요!
    ja: エマさん、待ってください！
  d_nikke_ce009_02_04_11:
    speaker: emma_t
    en: Hm?
    ko: 으응?
    ja: どうしたの？
  d_nikke_ce009_02_04_12:
    speaker: ce009_02
    en: Would it be all right if I made dinner tonight?
    ko: 오늘은 제가 요리해도 괜찮을까요?
    ja: 今日は私が料理してもいいですか？
  d_nikke_ce009_02_04_13:
    speaker: ce009_02
    en: I've been wanting to thank you for helping us before.
    ko: 저번에 저희를 도와주신 것에 대한 감사를 표현하고 싶었거든요.
    ja: |-
      この前、私たちを手伝って…訓練を
      つけてくださったお礼をしたかったんです。
  d_nikke_ce009_02_04_14:
    speaker: ce009_02
    en: This may not be the Amagi Inn, but we're at a hot spring, so I'd love to cook
      for everyone tonight.
    ko: |-
      아마기 여관은 아니지만, 모처럼의 온천이니까요!
      여기선 제가 대접할게요!
    ja: |-
      いつか、温泉でおもてなしができればと
      思っていたんですが…天城旅館じゃないけど、
      せっかくの温泉ですから！ここは私が！
  d_nikke_ce009_02_04_15:
    speaker: emma_t
    en: Oh my, really?
    ko: 어머, 그래?
    ja: あら、そう？
  d_nikke_ce009_02_04_16:
    speaker: emma_t
    en: Well... if that's how you feel, I suppose I can't say no.
    ko: 그런 마음이라면 양보할 수밖에 없겠는걸?
    ja: |-
      そこまで言われちゃったら、
      今日はお願いするしかないわね～
  d_nikke_ce009_02_04_17:
    speaker: vesti_t
    en: Whoa... R-really?
    ko: 와아… 저, 정말?
    ja: わあ…ほ、本当？
  d_nikke_ce009_02_04_18:
    speaker: eunhwa_t
    en: "... Looks like we can rest easy for now."
    ko: "…한숨 돌릴 수 있겠군."
    ja: "…一安心だな。"
  d_nikke_ce009_02_04_19:
    speaker: ce009_04
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_20:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_21:
    speaker: ce009_02
    en: Thanks for waiting, everyone!
    ko: 다들 오래 기다렸지!
    ja: みんな、お待たせ！
  d_nikke_ce009_02_04_22:
    speaker: ce009_02
    en: Dinner's ready. I hope you like it...
    ko: 음식 완성됐어. 입에 맞으면 좋겠는데….
    ja: ご飯ができたよ。口に合うといいんだけど…
  d_nikke_ce009_02_04_23:
    speaker: "<Narration>"
    en: Yukiko sets a dish down with a clink.
    ko: 달칵-
    ja: カチャ…
  d_nikke_ce009_02_04_24:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_25:
    speaker: "<Monologue>"
    en: A dark aura emanates from it,
    ko: 유키코가 내온 음식에서는 검은 오오라가 피어오르고 있다.
    ja: |-
      運ばれてきた料理は、
      禍々しい気配を放っていた
  d_nikke_ce009_02_04_26:
    speaker: "<Narration>"
    en: pulsing with an ominous presence.
    ko: 고오오오오-
    ja: ゴゴゴゴゴ――
  d_nikke_ce009_02_04_27:
    speaker: miranda
    en: Wow, that looks delicious!
    ko: 와아, 정말 먹음직스러워 보입니다!
    ja: わあ、とってもおいしそうです！
  d_nikke_ce009_02_04_28:
    speaker: miranda
    en: Just what you'd expect from the future owner of a renowned inn!
    ko: 역시 여관집 딸의 솜씨입니다!
    ja: さすが旅館の娘さんですね！
  d_nikke_ce009_02_04_29:
    speaker: quency_e
    en: You're right. It's got kind of a unique smell, too.
    ko: 그러게~ 냄새도 뭔가 독특한걸?
    ja: そうね～匂いもなんだか変わってるわ。
  d_nikke_ce009_02_04_30:
    speaker: ce009_02
    en: Hearing you say that makes me very happy. Thanks, everyone.
    ko: 그렇게 말해주니 기분이 좋네, 다들 고마워.
    ja: |-
      そう言ってもらえると嬉しいな。
      みんな、ありがとう。
  d_nikke_ce009_02_04_31:
    speaker: "<Self>"
    en: Object X...
    ko: 물체 X….
    ja: 物体X…
  d_nikke_ce009_02_04_32:
    speaker: phantom
    en: Hm? What was that?
    ko: 음? 뭐라고 했소?
    ja: ん？何か言ったかい？
  d_nikke_ce009_02_04_33:
    speaker: "<Self>"
    en: "... It just felt right to call it that."
    ko: "…왜인지 그렇게 불러야 할 것 같은 느낌이 들었어."
    ja: "…なぜかそう呼ばなければならない気がした"
  d_nikke_ce009_02_04_34:
    speaker: phantom
    en: They say good food is made with care.
    ko: 음식은 정성이라고 들었소.
    ja: 料理は真心だと聞いた。
  d_nikke_ce009_02_04_35:
    speaker: phantom
    en: It may look a little different from what we're used to, but I'm sure it'll
      taste great.
    ko: 생긴 건 우리가 아는 음식과 조금 다르긴 하지만, 분명 맛있을 거요.
    ja: |-
      私たちの知る料理と
      見た目も違うということは、
      きっと味わったことのない美味に違いない。
  d_nikke_ce009_02_04_36:
    speaker: quency_e
    en: Don't mind if I do!
    ko: 잘 먹을게~
    ja: いただきま～す！
  d_nikke_ce009_02_04_37:
    speaker: miranda
    en: Time to dig in!
    ko: 맛있게 먹겠습니다!
    ja: いただきます！
  d_nikke_ce009_02_04_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_39:
    speaker: Choice
    en: Eat it.
    ko: 먹는다.
    ja: 食べる
  d_nikke_ce009_02_04_40:
    speaker: Choice
    en: Eat it.
    ko: 먹는다.
    ja: 食べる
  d_nikke_ce009_02_04_41:
    speaker: "<Narration>"
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクッ――
  d_nikke_ce009_02_04_42:
    speaker: "<Self>"
    en: "!!!!"
    ko: "!!!!"
    ja: "！！！！"
  d_nikke_ce009_02_04_43:
    speaker: "<Monologue>"
    en: "... I don't want to recall what happened after."
    ko: "…그 이후의 기억은 떠올리고 싶지 않다."
    ja: "…その後のことは思い出したくもない"
  d_nikke_ce009_02_04_44:
    speaker: vesti_t
    en: C-Commander? Are you okay?
    ko: 지, 지휘관님? 괜찮은 거야?
    ja: し、指揮官様？大丈夫？
  d_nikke_ce009_02_04_45:
    speaker: vesti_t
    en: You're sweating bullets...
    ko: 식은땀이 줄줄 나는데?
    ja: 冷や汗がすごいけど…
  d_nikke_ce009_02_04_46:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_47:
    speaker: ce009_02
    en: Maybe it's because we've been walking around for so long...
    ko: "…너무 오래 돌아다닌 탓일까?"
    ja: "…歩きすぎたせいかな？"
  d_nikke_ce009_02_04_48:
    speaker: ce009_02
    en: This won't do. I'd better hurry and get dinner ready.
    ko: 안 되겠어, 준비를 서두를게.
    ja: こうしちゃいられない。準備を急がなきゃ。
  d_nikke_ce009_02_04_49:
    speaker: ce009_02
    en: You'll feel better after you eat and get a good night's rest.
    ko: 음식을 먹고 푹 쉬면 괜찮아질 테니까.
    ja: ご飯を食べて、ゆっくり休めばよくなるよね。
  d_nikke_ce009_02_04_50:
    speaker: "<Self>"
    en: No, it's okay... Take your time.
    ko: 아니야… 천천히 해도 괜찮아.
    ja: いや…急がなくていい
  d_nikke_ce009_02_04_51:
    speaker: emma_t
    en: Hey, Yukiko...
    ko: 유키코~ 있지.
    ja: ねえ、雪子～
  d_nikke_ce009_02_04_52:
    speaker: emma_t
    en: Are you sure you'll be okay on your own?
    ko: 혼자선 너무 힘들지 않겠어?
    ja: 一人じゃ大変でしょう？
  d_nikke_ce009_02_04_53:
    speaker: emma_t
    en: Would you like me to lend you a hand?
    ko: 나도 손을 좀 보태도 괜찮을까?
    ja: 私も手伝っていいかしら～？
  d_nikke_ce009_02_04_54:
    speaker: ce009_02
    en: That sounds wonderful!
    ko: 물론이죠!
    ja: もちろんです！
  d_nikke_ce009_02_04_55:
    speaker: ce009_02
    en: It's really reassuring to know you'll be helping, Emma-san!
    ko: 엠마씨가 도와준다니 정말 든든하네요!
    ja: |-
      エマさんに手伝ってもらえるなら、
      とっても助かります！
  d_nikke_ce009_02_04_56:
    speaker: vesti_t
    en: It should be okay if she's just helping out... right?
    ko: 보조만 한다니까 괜찮겠지…?
    ja: サポートだけなら、大丈夫だよね…？
  d_nikke_ce009_02_04_57:
    speaker: eunhwa_t
    en: "... Well, she seems confident enough. Guess we'll just have to trust her."
    ko: |-
      …뭐, 자신이 있어보이니 괜찮을 거다.
      믿어볼 수밖에.
    ja: |-
      …雪子は旅館のもてなしに
      自信があるようだった。
      信じるしかないが…きっと平気だろう。
  d_nikke_ce009_02_04_58:
    speaker: "<Monologue>"
    en: I have to tell them now if I don't want to go through something awful.
    ko: 지금 말해야한다. 끔찍한 시간을 보내고 싶지 않다면.
    ja: |-
      今すぐ言わなければならない。
      地獄の時間を過ごしたくないのなら…
  d_nikke_ce009_02_04_59:
    speaker: "<Monologue>"
    en: But...
    ko: 하지만….
    ja: だが…
  d_nikke_ce009_02_04_60:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_61:
    speaker: "<Monologue>"
    en: Looking at Yukiko and Emma smiling, I just can't bring myself to say it.
    ko: 유키코와 엠마의 웃는 얼굴을 보자, 차마 입이 떨어지지 않는다.
    ja: 雪子とエマの笑顔を見たら、何も言えなかった
  d_nikke_ce009_02_04_62:
    speaker: ce009_04
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_63:
    speaker: "<Monologue>"
    en: Unable to hold it in any longer, Teddie finally tries to speak...
    ko: 안절부절못하던 곰이 참지 못하고 뭔가를 말하려고 한다….
    ja: |-
      ソワソワしていたクマが、耐えきれずに
      何かを言おうとしている…
  d_nikke_ce009_02_04_64:
    speaker: ce009_04
    en: I-if we don't stop her now, we're gonna be in beary big trouble...!
    ko: 지, 지금 말리지 않으면 큰일이 날 거다곰…!
    ja: い、今すぐ止めないと大変なことになるクマ…！
  d_nikke_ce009_02_04_65:
    speaker: "<Self>"
    en: "... Listen to me, Teddie."
    ko: "…곰, 잘 들어."
    ja: "…クマ、よく聞くんだ"
  d_nikke_ce009_02_04_66:
    speaker: "<Self>"
    en: Look how excited they are. Can you really bring yourself to rain on their
      parade?
    ko: 너는 저 설레는 표정을 보고도 찬물을 끼얹을 수 있어?
    ja: |-
      君はあの嬉しそうな顔を見ても、
      水を差すようなことを言えるか？
  d_nikke_ce009_02_04_67:
    speaker: ce009_04
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_ce009_02_04_68:
    speaker: ce009_04
    en: N-not really...
    ko: 그, 그건 아니다곰.
    ja: そ、それはできないクマ。
  d_nikke_ce009_02_04_69:
    speaker: "<Self>"
    en: Maybe that's just something we've gotta deal with as men.
    ko: 우리가 감당해야 할 몫이 아닐까? 사나이로서.
    ja: |-
      ここは私たちが覚悟を決めるべきではないか？
      男として
  d_nikke_ce009_02_04_70:
    speaker: ce009_04
    en: Y-you're right.
    ko: 마, 맞는 말이다곰.
    ja: そっ、そうクマね。
  d_nikke_ce009_02_04_71:
    speaker: ce009_04
    en: "... You're the manliest man I know, Commander! I've got a whole new respect
      for you!"
    ko: "…지휘관, 남자 중의 남자다곰! 다시 봤다곰!"
    ja: |-
      …ちしかん、男の中の「漢」クマ！
      御見逸れしたクマ！
  d_nikke_ce009_02_04_72:
    speaker: ce009_04
    en: All right! I'll show you I've got what it takes to be a real man, too!
    ko: |-
      알겠다곰…!
      곰도 남자다운 모습을 보여주겠다곰!!
    ja: |-
      わかったクマ…！
      クマも「漢」見せるクマよー！！
  d_nikke_ce009_02_04_73:
    speaker: "<Self>"
    en: We just need to get through it, got it?
    ko: 그 순간만 견뎌내면 되는 거야. 알겠지?
    ja: |-
      口にした一瞬だけ耐え抜けば大丈夫だ
      いいな？
  d_nikke_ce009_02_04_74:
    speaker: "<Monologue>"
    en: "... And so, we decide to await our deaths with quiet resolve."
    ko: "…그렇게 우린 의연한 마음으로 [죽음]을 기다리기로 했다."
    ja: |-
      …こうして私たちは覚悟を決め、
      「死」を待つことにした
  d_nikke_ce009_02_04_75:
    speaker: ce009_04
    en: Blergh.
    ko: 그헥.
    ja: ぐふっ。
  d_nikke_ce009_02_04_76:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 쿵-
    ja: ドサッ――
  d_nikke_ce009_02_04_77:
    speaker: "<Monologue>"
    en: Teddie collapses onto the dining table.
    ko: 식탁 위에 곰이 쓰러진다.
    ja: テーブルの上にクマが倒れた
  d_nikke_ce009_02_04_78:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_79:
    speaker: ce009_02
    en: T-Teddie?! Are you okay?
    ko: 고, 곰?! 괜찮은 거야?
    ja: ク、クマ！？大丈夫？
  d_nikke_ce009_02_04_80:
    speaker: emma_t
    en: He must've been exhausted.
    ko: 피로가 많이 쌓였던 모양이네.
    ja: ずいぶん疲れてたのね～
  d_nikke_ce009_02_04_81:
    speaker: emma_t
    en: To think he fell asleep right after eating...
    ko: 음식을 먹고 바로 잠에 들 정도였다니….
    ja: 食べてる途中で眠っちゃうなんて…
  d_nikke_ce009_02_04_82:
    speaker: emma_t
    en: Well, we did make sure to use plenty of ingredients that'll help him recover.
    ko: 피로 회복에 좋은 재료를 잔뜩 넣었으니까.
    ja: 疲労回復に効く材料をたくさん入れたのよ。
  d_nikke_ce009_02_04_83:
    speaker: ce009_02
    en: I see, so that's what happened...!
    ko: 그런 거였군요…!
    ja: そういうことだったんですね…！
  d_nikke_ce009_02_04_84:
    speaker: ce009_02
    en: Then maybe this meal was a success after all.
    ko: 그렇다면, 이번 음식은 성공적일지도 모르겠어요.
    ja: |-
      それなら、今回の料理は
      大成功かもしれませんね。
  d_nikke_ce009_02_04_85:
    speaker: "<Self>"
    en: Uh...
    ko: 아….
    ja: うっ…
  d_nikke_ce009_02_04_86:
    speaker: "<Narration>"
    en: A low, ominous hum fills the air, followed by the unsettling sound of bubbling.
    ko: 고오오오오- 부글부글부글-
    ja: |-
      ゴポゴポ…
      ゴポゴポゴポ…ゴゴゴ…グツグツ…
  d_nikke_ce009_02_04_87:
    speaker: "<Monologue>"
    en: Whatever it is reeks of an unidentifiable odor, its color resembling something
      dredged up from the abyss.
    ko: 정체불명의 냄새를 풍기며, 심연에서 볼 법한 색을 한 [무언가].
    ja: |-
      謎の匂いを放っている、まるで深淵を覗いた先に
      あるかのような色をした「何か」は、
  d_nikke_ce009_02_04_88:
    speaker: "<Monologue>"
    en: It almost sounds as though resentful screams are echoing from within...
    ko: 원한 서린 무언가의 비명소리가 들려오는 듯하다….
    ja: 怨嗟のごときゴポゴポという音を立てている
  d_nikke_ce009_02_04_89:
    speaker: "<Self>"
    en: Um... can I ask what this is?
    ko: 혹시… 무슨 음식인지 알 수 있을까?
    ja: ええと…これは何か聞いていいか？
  d_nikke_ce009_02_04_90:
    speaker: ce009_02
    en: Oh, this?
    ko: 아, 이거 말이지?
    ja: ああ、これ？
  d_nikke_ce009_02_04_91:
    speaker: ce009_02
    en: It's curry. I just thought curry would be perfect for a meal everyone could
      enjoy together.
    ko: 카레야. 다 같이 먹는다고 하면 역시 카레겠지 싶었거든.
    ja: |-
      カレーだよ。
      みんなで食べるっていったら、カレーかなって。
  d_nikke_ce009_02_04_92:
    speaker: ce009_02
    en: I've made it for my friends before, too.
    ko: 나, 전에도 동료들에게 카레를 만들어 준 적이 있어서.
    ja: |-
      私、前にも仲間に
      カレーを作ったことがあるんだ。
  d_nikke_ce009_02_04_93:
    speaker: ce009_02
    en: The color's a little different because I added all kinds of healthy ingredients...
      but I'm sure it'll turn out fine this time.
    ko: |-
      몸에 좋은 걸 이것저것 넣느라 색이 좀 변하긴 했지만…
      이번엔 괜찮을 거야.
    ja: |-
      体にいいものを色々入れたから
      ちょっと色が変わっちゃったけど…
      今回は大丈夫だと思う。
  d_nikke_ce009_02_04_94:
    speaker: "<Self>"
    en: I see...
    ko: 그렇구나….
    ja: そうか…
  d_nikke_ce009_02_04_95:
    speaker: "<Monologue>"
    en: Eunhwa and Vesti are sitting beside me too, both breaking out in a cold sweat.
    ko: 옆에서 은화와 베스티도 식은 땀을 흘리고 있다.
    ja: |-
      脇を見ると、ウンファとベスティーの顔にも
      冷や汗が垂れている
  d_nikke_ce009_02_04_96:
    speaker: "<Monologue>"
    en: These are the same members of Absolute who wouldn't have even flinched in
      the face of a Heretic.
    ko: 헬레틱을 상대로도 눈 하나 꿈쩍 안 하던 그 앱솔루트가.
    ja: |-
      ヘレティックを前にしても
      一切動じることのない、
      最強のアブソルートが…
  d_nikke_ce009_02_04_97:
    speaker: eunhwa_t
    en: "*Sigh*"
    ko: 하아.
    ja: はぁ…
  d_nikke_ce009_02_04_98:
    speaker: eunhwa_t
    en: Dragging this out won't change anything.
    ko: 시간 끌어봤자 변하는 건 없겠지.
    ja: 時間を稼いだところで、もう何も変わらん。
  d_nikke_ce009_02_04_99:
    speaker: eunhwa_t
    en: I'll eat it.
    ko: 먹는다.
    ja: 食うしかない。
  d_nikke_ce009_02_04_100:
    speaker: vesti_t
    en: M-me too...!
    ko: 나, 나도…!
    ja: わ、私も…！
  d_nikke_ce009_02_04_101:
    speaker: "<Narration>"
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクン――
  d_nikke_ce009_02_04_102:
    speaker: eunhwa_t
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_103:
    speaker: vesti_t
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_104:
    speaker: "<Narration>"
    en: Their chairs scrape against the floor.
    ko: 드르륵-
    ja: ガタッ
  d_nikke_ce009_02_04_105:
    speaker: "<Self>"
    en: Eunhwa...? Vesti...?
    ko: 은화…? 베스티…?
    ja: ウンファ…？ベスティー…？
  d_nikke_ce009_02_04_106:
    speaker: "<Monologue>"
    en: Their expressions suddenly darken. They rise from their seats
    ko: 급격히 낯빛이 어두워진 둘은 자리에서 일어났고.
    ja: 突然真っ青な顔になった2人が、席を立ち…
  d_nikke_ce009_02_04_107:
    speaker: "<Monologue>"
    en: and disappear through the door as though in a trance.
    ko: 무언가에 홀린 듯 문밖으로 사라졌다.
    ja: |-
      何かに取りつかれたかのような様子で、
      扉の外へと姿を消した
  d_nikke_ce009_02_04_108:
    speaker: ce009_02
    en: Maybe they just weren't that hungry...
    ko: "…배가 별로 고프지 않았던 걸까요?"
    ja: |-
      …あんまりお腹が
      空いていなかったんでしょうか？
  d_nikke_ce009_02_04_109:
    speaker: emma_t
    en: Hmm... I suppose so.
    ko: 으음… 그러게.
    ja: う～ん…そうね。
  d_nikke_ce009_02_04_110:
    speaker: emma_t
    en: At least they had something to eat before they left.
    ko: 그래도 조금이라도 먹고 가서 다행이야.
    ja: でも、少しでも食べてもらえてよかったわ～
  d_nikke_ce009_02_04_111:
    speaker: ce009_02
    en: Yeah, we're the ones who got everyone to come out here when all they wanted
      to do was rest.
    ko: 네, 다들 쉬고 싶어 했던 걸 저희가 데려온 거니까요.
    ja: |-
      そうですね。
      みなさん、休もうとしているところを
      私たちが引き留めたので。
  d_nikke_ce009_02_04_112:
    speaker: ce009_02
    en: Teddie already seems to be getting some rest... That's enough for me.
    ko: 곰은 이미 쉬고 있는 것 같고… 이 정도로도 전 만족해요.
    ja: |-
      クマさんはもうお休み中みたいだし…
      これぐらいでも満足です。
  d_nikke_ce009_02_04_113:
    speaker: emma_t
    en: Hee hee, that just leaves one person!
    ko: 후후, 그럼 이제 한 명만 남은 거네~?
    ja: ふふ、じゃあ後は一人だけね～？
  d_nikke_ce009_02_04_114:
    speaker: ce009_02
    en: That's right, the person I've been looking forward to most is up next.
    ko: 그렇네요. 가장 기대되는 분이 남았어요.
    ja: そうですね。一番楽しみです。
  d_nikke_ce009_02_04_115:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_04_116:
    speaker: emma_t
    en: Hm? Why are you just sitting there?
    ko: 으응? 그런데 왜 가만히 있는 거야?
    ja: あら？どうしてじっとしてるのかしら？
  d_nikke_ce009_02_04_117:
    speaker: emma_t
    en: Oh, don't tell me...
    ko: 아, 설마….
    ja: あっ、もしかして…
  d_nikke_ce009_02_04_118:
    speaker: "<Self>"
    en: No, it's definitely not because the food looks bad or anything...
    ko: 아니, 음식이 맛없어 보인다거나 절대 그런 건….
    ja: |-
      いや、料理がおいしくなさそうとか
      そういうことでは決して…
  d_nikke_ce009_02_04_119:
    speaker: emma_t
    en: You must've wanted to be pampered like Teddie, too!
    ko: 지휘관도 곰처럼 응석 부리고 싶었구나?
    ja: 指揮官もクマみたいに甘えたかったのね？
  d_nikke_ce009_02_04_120:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_02_04_121:
    speaker: emma_t
    en: You should've just said so sooner!
    ko: 그렇다면 진작 이야기했어야지~
    ja: |-
      それならそうと、
      早く言ってくれたらよかったのに～
  d_nikke_ce009_02_04_122:
    speaker: "<Monologue>"
    en: Emma scoops up a heaping spoonful of "curry."
    ko: 엠마가 숟가락으로 카레?를 듬뿍 뜬다.
    ja: |-
      エマがスプーンでカレー？を
      たっぷりとすくい上げた
  d_nikke_ce009_02_04_123:
    speaker: ce009_02
    en: As expected of you, Emma-san! First Teddie, and now the Commander...!
    ko: 역시 엠마 씨네요! 곰에 이어 지휘관까지…!
    ja: |-
      流石エマさん！
      クマさんもイチコロでしたもんね！
  d_nikke_ce009_02_04_124:
    speaker: emma_t
    en: Here comes the airplane...
    ko: 자, 아~ 해볼까?
    ja: はい、お口を開けて～？
  d_nikke_ce009_02_04_125:
    speaker: emma_t
    en: Say "aah"!
    ko: 아~
    ja: あ～ん。
  d_nikke_ce009_02_04_126:
    speaker: "<Self>"
    en: A-aah...
    ko: 아, 아아….
    ja: あ、ああ…
  d_nikke_ce009_02_04_127:
    speaker: emma_t
    en: Come on, open a little wider. Aaahh...
    ko: 더 크게~ 아아~
    ja: もっと大きく～あ～ん。
  d_nikke_ce009_02_04_128:
    speaker: "<Self>"
    en: Aaahhh...
    ko: 아아아아….
    ja: あ…あーん…
  d_nikke_ce009_02_04_129:
    speaker: "<Narration>"
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクッ――
  d_nikke_ce009_02_04_130:
    speaker: emma_t
    en: Oh my, Commander?
    ko: 어머, 지휘관?
    ja: あら？指揮官？
  d_nikke_ce009_02_04_131:
    speaker: emma_t
    en: What's wrong all of a sudden...? You just fell right into my arms...
    ko: 갑자기 왜 이러지…? 내 품에 안겨서는.
    ja: |-
      急にどうしたのかしら…？
      私の胸で固まっちゃったわ。
  d_nikke_ce009_02_04_132:
    speaker: ce009_02
    en: "... Maybe he was just touched by how delicious our curry is."
    ko: "…저희 카레가 너무 맛있어서 감동한 걸지도 몰라요."
    ja: |-
      私たちのカレーが美味し過ぎて
      感動してるのかも。
  d_nikke_ce009_02_04_133:
    speaker: ce009_02
    en: Commander, you're welcome to have seconds.
    ko: 지휘관, 아직 리필할 수 있으니까.
    ja: 指揮官、まだまだおかわりできますからね。
  d_nikke_ce009_02_04_134:
    speaker: ce009_02
    en: We put our hearts into making this meal, so I hope it helps you relax!
    ko: 우리의 정성이 담긴 음식으로 피로를 풀어줬으면 해!
    ja: 健康にいい食材で、疲れを取ってください！
  d_nikke_ce009_02_04_135:
    speaker: ce009_02
    en: "... Commander?"
    ko: "…지휘관?"
    ja: "…指揮官？"
  d_nikke_ce009_02_04_136:
    speaker: "<Monologue>"
    en: After that, I don't remember anything.
    ko: 그 이후의 기억은 없다.
    ja: 私の記憶はそこで途絶えた
d_nikke_ce009_02_05:
  d_nikke_ce009_02_05_1:
    speaker: "<Monologue>"
    en: Just like that, the indescribable dinner finally comes to an end.
    ko: 그렇게 형용할 수 없는 식사 시간이 지나고.
    ja: |-
      そうして、筆舌に尽くしがたい
      食事の時間は過ぎ…
  d_nikke_ce009_02_05_2:
    speaker: "<Monologue>"
    en: Before long, the sun slips below the horizon, and it's time to call it a day.
    ko: 어느덧 해가 저물어 하루를 마무리할 시간이 찾아왔다.
    ja: いつの間にか一日を終える時間となっていた
  d_nikke_ce009_02_05_3:
    speaker: ce009_02
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_05_4:
    speaker: ce009_02
    en: We've only been here a day, but I already don't want to leave.
    ko: |-
      겨우 하루 있었을 뿐인데,
      벌써 설온장을 떠나기 싫어졌어.
    ja: |-
      たった1日いただけなのに、
      もう雪見温泉を出たくなくなっちゃった。
  d_nikke_ce009_02_05_5:
    speaker: "<Self>"
    en: Gonna miss this place?
    ko: 아쉬워?
    ja: 名残惜しいのか？
  d_nikke_ce009_02_05_6:
    speaker: ce009_02
    en: I'd be lying if I said I'm not.
    ko: 아니라고 하면 거짓말이겠지.
    ja: 違うって言ったら嘘になるかな。
  d_nikke_ce009_02_05_7:
    speaker: ce009_02
    en: Snowfield Hot Spring... Just as its name suggests, it's a place where you
      can soak in a hot spring while admiring the beautiful snow.
    ko: 설온장, 이름 그대로 예쁜 눈을 보면서 온천에 들어갈 수 있는 곳.
    ja: |-
      その名の通り、
      綺麗な雪を見ながら温泉に浸かれる場所で…
  d_nikke_ce009_02_05_8:
    speaker: ce009_02
    en: I've learned so much. Honestly... it was everything I could've hoped for.
    ko: 배울 것도 많았고, 정말이지… 최고였어.
    ja: たくさん学べることもあったし、最高だったよ。
  d_nikke_ce009_02_05_9:
    speaker: ce009_02
    en: A world full of new experiences, and so many wonderful people...
    ko: 모든 게 새로운 세계에, 멋진 사람들까지.
    ja: 何もかもが目新しい世界に、素敵な人たち…
  d_nikke_ce009_02_05_10:
    speaker: ce009_02
    en: At first, I was scared. After all, I'd just been dropped into a strange world.
    ko: 처음에는 무서웠거든, 모르는 세계에 던져져서.
    ja: 最初はね、知らない世界に放り出されて、
  d_nikke_ce009_02_05_11:
    speaker: ce009_02
    en: Though Teddie was with me, all I wanted was to go back home.
    ko: 곰이 함께하긴 했지만, 돌아가고 싶다는 생각밖에 안 들었어.
    ja: |-
      クマさんが一緒とは言え怖くて、
      帰りたいとしか思わなかった。
  d_nikke_ce009_02_05_12:
    speaker: ce009_02
    en: But now, I guess I've already grown attached to this place.
    ko: 그런데 지금은 벌써 정이 들어버렸을지도.
    ja: でも、今はもう情が湧いちゃったみたい。
  d_nikke_ce009_02_05_13:
    speaker: "<Self>"
    en: That's good to hear.
    ko: 그건 다행이네.
    ja: それは光栄だ
  d_nikke_ce009_02_05_14:
    speaker: "<Narration>"
    en: "*Creak*"
    ko: 끼이익-
    ja: キィィ…
  d_nikke_ce009_02_05_15:
    speaker: ludmilla_w
    en: Oh, there you two are.
    ko: 아, 마침 여기 있었군.
    ja: ああ、ちょうどここにいたのね。
  d_nikke_ce009_02_05_16:
    speaker: ce009_02
    en: Ludmilla-san?
    ko: 루드밀라 씨?
    ja: ルドミラさん？
  d_nikke_ce009_02_05_17:
    speaker: ce009_02
    en: What brings you here at this hour?
    ko: 이 시간엔 무슨 일이신가요?
    ja: こんな時間にどうしたんですか？
  d_nikke_ce009_02_05_18:
    speaker: ludmilla_w
    en: I thought I ought to stop by before the hour grew too late.
    ko: 시간이 더 늦기 전에 들려야 할 것 같아서 말이야.
    ja: 夜遅くなる前に寄っておこうと思ったの。
  d_nikke_ce009_02_05_19:
    speaker: ludmilla_w
    en: I wished to thank you for making the journey all the way here.
    ko: 일부러 여기까지 와준 것에 대한 감사를 전하려 했거든.
    ja: |-
      わざわざここまで足を運んでもらった
      お礼をしておこうと思って。
  d_nikke_ce009_02_05_20:
    speaker: ce009_02
    en: Huh...?
    ko: 보답…?
    ja: お礼…？
  d_nikke_ce009_02_05_21:
    speaker: ludmilla_w
    en: Mica.
    ko: 미카여.
    ja: ミカ。
  d_nikke_ce009_02_05_22:
    speaker: ludmilla_w
    en: Please give her what we prepared.
    ko: 준비한 것을 넘겨주자꾸나.
    ja: 渡してちょうだい。
  d_nikke_ce009_02_05_23:
    speaker: mica_w
    en: Hehe, okay!
    ko: 헤헤, 넵!
    ja: えへへ、はい！
  d_nikke_ce009_02_05_24:
    speaker: "<Monologue>"
    en: Mica hands over a neatly folded outfit.
    ko: 미카가 정성스럽게 개어진 옷을 건네준다.
    ja: ミカは、丁寧に折りたたまれた服を差し出した
  d_nikke_ce009_02_05_25:
    speaker: ce009_02
    en: This is...
    ko: 이건….
    ja: これは…
  d_nikke_ce009_02_05_26:
    speaker: mica_w
    en: It's a gift from Ludmilla and me!
    ko: 저랑 루드밀라가 준비한 선물이에요!
    ja: 私とルドミラからのプレゼントです！
  d_nikke_ce009_02_05_27:
    speaker: mica_w
    en: Hehe, would you like to try it on?
    ko: 헤헤, 괜찮으시다면 한번 입어보시겠어요?
    ja: |-
      えへへ、よかったら一度
      着て見せてもらえませんか？
  d_nikke_ce009_02_05_28:
    speaker: "<Monologue>"
    en: Yukiko stares at her reflection in the mirror.
    ko: 유키코는 거울에 비친 자신의 모습을 바라본다.
    ja: 雪子が鏡に映った自分の姿を見た
  d_nikke_ce009_02_05_29:
    speaker: ce009_02_p
    en: Wow...!
    ko: 와아…!
    ja: わぁ…！
  d_nikke_ce009_02_05_30:
    speaker: mica_w
    en: Hehe, I thought red would look really good on you, so I picked this out for
      you.
    ko: 헤헤, 뭔가 빨간색이 잘 어울리실 것 같아서 골라봤어요.
    ja: |-
      えへへ、なんだか赤が似合いそうだったので
      この色にしてみました。
  d_nikke_ce009_02_05_31:
    speaker: mica_w
    en: What do you think?
    ko: 어떠신가요?
    ja: どうでしたか？
  d_nikke_ce009_02_05_32:
    speaker: ce009_02_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_05_33:
    speaker: mica_w
    en: H-huh...?
    ko: 어, 어라…?
    ja: あ、あれ…？
  d_nikke_ce009_02_05_34:
    speaker: mica_w
    en: You... don't like it?
    ko: 혹시… 별로인가요?
    ja: もしかして…あまりお気に入りに…？
  d_nikke_ce009_02_05_35:
    speaker: ce009_02_p
    en: N-no, that's not it! It's just...
    ko: |-
      아, 아니야!
      그게 아니라….
    ja: |-
      う、ううん！
      そうじゃなくって…
  d_nikke_ce009_02_05_36:
    speaker: ce009_02_p
    en: I'm so happy knowing you picked it out just for me.
    ko: 나를 위해 골라준 거라고 생각하니까, 기뻐서.
    ja: |-
      私のために選んでくれたんだと思ったら、
      すごく嬉しくて。
  d_nikke_ce009_02_05_37:
    speaker: ce009_02_p
    en: And it's so pretty... I can't stop looking at it.
    ko: 게다가 디자인도 정말 예쁘고… 자꾸 눈이가.
    ja: |-
      それに、デザインもとても素敵…
      つい見入っちゃう。
  d_nikke_ce009_02_05_38:
    speaker: ludmilla_w
    en: Though you come from another world, you're still my guests.
    ko: 비록 다른 세계에서 온 손님이라도,
    ja: たとえ他の世界からのお客様であろうと…
  d_nikke_ce009_02_05_39:
    speaker: ludmilla_w
    en: We prepared this in the hope that you'll leave with fond memories of your
      stay.
    ko: 기분 좋게 돌아갔으면 하는 마음에 준비했다.
    ja: |-
      心地よく過ごして帰ってほしいという
      想いを込めて用意したものよ。
  d_nikke_ce009_02_05_40:
    speaker: mica_w
    en: I hope our feelings came through!
    ko: 저희의 마음이 전해졌으면 좋겠어요!
    ja: 私たちの気持ちが伝わったら嬉しいです！
  d_nikke_ce009_02_05_41:
    speaker: ce009_02_p
    en: Yeah, they really did! I can really feel how much thought you put into it!
    ko: 응! 엄청, 제대로, 전해지고 있어!
    ja: うん、すっごく、ちゃんと、伝わってます！
  d_nikke_ce009_02_05_42:
    speaker: ce009_02_p
    en: Hehe, I'll treasure it and wear it while I'm here!
    ko: 에헤헤, 여기에 묵는 동안은, 소중히 입을게!
    ja: |-
      えへへ、ここに泊まらせていただく間は、
      このパジャマを大切に着させていただきますね！
  d_nikke_ce009_02_05_43:
    speaker: ludmilla_w
    en: I'm pleased to hear you're satisfied.
    ko: 만족했다니 다행이군.
    ja: 満足してもらえたなら、何よりね。
  d_nikke_ce009_02_05_44:
    speaker: ludmilla_w
    en: Let us take our leave, then.
    ko: 그렇다면 우리도 돌아가자꾸나.
    ja: さて、私たちは戻りましょう。
  d_nikke_ce009_02_05_45:
    speaker: mica_w
    en: Okay!
    ko: 네!
    ja: はい！
  d_nikke_ce009_02_05_46:
    speaker: mica_w
    en: Good night, you two!
    ko: 두 분 모두 편안한 밤 보내세요!
    ja: お二人とも、ごゆっくりお休みください！
  d_nikke_ce009_02_05_47:
    speaker: "<Narration>"
    en: "*Creak*"
    ko: 끼이익-
    ja: キィィ…
  d_nikke_ce009_02_05_48:
    speaker: ce009_02_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_02_05_49:
    speaker: "<Monologue>"
    en: Yukiko continues looking at her reflection, looking pleased with what she
      sees.
    ko: 유키코는 만족스러운 듯, 거울에 비친 자신의 모습을 바라보고 있다.
    ja: |-
      雪子は嬉しそうに、
      鏡に映る自身の姿を眺めていた
  d_nikke_ce009_02_05_50:
    speaker: "<Self>"
    en: It looks great on you.
    ko: 잘 어울리네.
    ja: よく似合っている
  d_nikke_ce009_02_05_51:
    speaker: ce009_02_p
    en: Hehe, right?
    ko: 후후, 그렇지?
    ja: ふふ、そうでしょ？
  d_nikke_ce009_02_05_52:
    speaker: ce009_02_p
    en: The D-Wave might keep me from taking these pajamas home, but...
    ko: D-WAVE의 영향으로, 이 잠옷은 가져가지 못할 수도 있지만….
    ja: |-
      D-WAVEの影響で、このパジャマは
      持ち帰れないかもしれないけど…
  d_nikke_ce009_02_05_53:
    speaker: ce009_02_p
    en: When I get back, I'm going to buy a similar set and have a pajama party with
      Chie and the others.
    ko: |-
      돌아가면 치에 일행이랑 이런 잠옷을 사서,
      파자마 파티를 해야겠어.
    ja: |-
      帰ったら千枝たちと、
      こういうパジャマを買って、
      パジャマパーティーをしようかな。
  d_nikke_ce009_02_05_54:
    speaker: ce009_02_p
    en: Assuming I still remember this world, anyway.
    ko: 만약, 이 세계에서 보낸 기억이 남는다면.
    ja: この世界で過ごした記憶がもし残るんだったら、
  d_nikke_ce009_02_05_55:
    speaker: ce009_02_p
    en: Everything I experienced here, everyone I met, all the stories I heard...
      I want to tell them all about it.
    ko: |-
      내가 경험한 것들, 만났던 사람들, 이야기…
      전부 알려주고 싶거든.
    ja: |-
      私が経験したこと、出会った人たちのこと…
      全部、教えてあげたい。
  d_nikke_ce009_02_05_56:
    speaker: "<Self>"
    en: I hope you'll be able to do that.
    ko: 꼭 그럴 수 있으면 좋겠네.
    ja: そうなるといいな
  d_nikke_ce009_02_05_57:
    speaker: ce009_02_p
    en: Hehe, yeah.
    ko: 후후, 응.
    ja: ふふ、うん。
  d_nikke_ce009_02_05_58:
    speaker: ce009_02_p
    en: I'm sure everyone's going to want to hear all about it. They might even wish
      they could come here too.
    ko: |-
      분명 다들 엄청 궁금해할 거야.
      자기도 가보고 싶다고 부러워할지도 모르겠어.
    ja: |-
      きっとみんな、興味津々になるはずだよ。
      自分も行ってみたいって羨ましがるかもね。
  d_nikke_ce009_02_05_59:
    speaker: "<Self>"
    en: Please send them my regards.
    ko: 응, 내 안부도 꼭 전해줘.
    ja: ああ、私のこともよろしく伝えてくれ
  d_nikke_ce009_02_05_60:
    speaker: ce009_02_p
    en: Of course.
    ko: 그럼, 당연하지.
    ja: うん、もちろん。
  d_nikke_ce009_02_05_61:
    speaker: ce009_02_p
    en: Oh! I was so caught up talking, I didn't even realize how late it'd gotten.
    ko: 아, 이야기하다 보니 시간이 이렇게 됐네.
    ja: あっ、話してたらもうこんな時間。
  d_nikke_ce009_02_05_62:
    speaker: ce009_02_p
    en: I should probably head to bed. You must be tired too. I hope you and Teddie
      get some good rest.
    ko: |-
      나는 이제 슬슬 자러 가봐야겠어.
      지휘관도 피곤할 테니, 곰이랑 푹 쉬어.
    ja: |-
      私はそろそろ寝ようかな。
      指揮官も疲れてるだろうし、
      クマさんと一緒にゆっくり休んでね！
  d_nikke_ce009_02_05_63:
    speaker: "<Self>"
    en: Yeah, I should head back to my room as well.
    ko: 응, 그러면 나도 방으로 돌아가 볼게.
    ja: ああ。私も部屋に戻る
  d_nikke_ce009_02_05_64:
    speaker: ce009_02_p
