---
d_nikke_belorta_pumpkinwitch_01:
  d_nikke_belorta_pumpkinwitch_01_1:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_belorta_pumpkinwitch_01_2:
    speaker: belorta_h
    en: Hiya, Old-Timer! ♡
    ko: 아저씨~ 안녕♡
    ja: おじさ～ん、やっほー♡
  d_nikke_belorta_pumpkinwitch_01_3:
    speaker: "<Monologue>"
    en: Belorta walks into my room with a huge bag.
    ko: 벨로타가 커다란 가방을 들고 지휘관실에 들어섰다.
    ja: |-
      ベロータが大きなカバンを持って
      指揮官室に入ってきた
  d_nikke_belorta_pumpkinwitch_01_4:
    speaker: "<Self>"
    en: Oh, is it that time already?
    ko: 아, 벌써 시간이 이렇게 됐었네.
    ja: ああ、もうこんな時間か
  d_nikke_belorta_pumpkinwitch_01_5:
    speaker: "<Self>"
    en: You're here for your session, right? Have a seat on the sofa.
    ko: 상담하러 온 거지? 소파에 앉아.
    ja: 面談だろう？ソファにかけてくれ
  d_nikke_belorta_pumpkinwitch_01_6:
    speaker: belorta_h
    en: Hehe, you're not gonna tell me you're busy, are you?
    ko: 흐흥~ 혹시 지금 바빠?
    ja: フフン～、いま忙しい？
  d_nikke_belorta_pumpkinwitch_01_7:
    speaker: belorta_h
    en: Nah, of course you're not. You cleared your schedule for our session, so you're
      totally free, right?
    ko: 아니지? 나랑 상담하려고 시간 비워둬서 한가하지?
    ja: |-
      忙しくないよね？私と面談するために
      時間を空けておいてくれたんだから、
      ヒマでしょ？
  d_nikke_belorta_pumpkinwitch_01_8:
    speaker: "<Self>"
    en: Yeah, I did. What's up?
    ko: 응, 그렇긴 한데 왜?
    ja: ああ。それはそうだが、どうした？
  d_nikke_belorta_pumpkinwitch_01_9:
    speaker: belorta_h
    en: How about we skip the session today and have some fun instead?
    ko: 그럼, 오늘은 상담 대신에 나랑 놀아주라♡
    ja: じゃあ、今日は面談の代わりに私と遊んで♡
  d_nikke_belorta_pumpkinwitch_01_10:
    speaker: belorta_h
    en: There's something I've been wanting to try!
    ko: 해보고 싶은 놀이가 생겼거든~
    ja: やってみたいことがあるの～
  d_nikke_belorta_pumpkinwitch_01_11:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: 何をやってみたいんだ？
  d_nikke_belorta_pumpkinwitch_01_12:
    speaker: "<Narration>"
    en: "*Rustle, rustle*"
    ko: 부스럭 부스럭-
    ja: ゴソゴソ
  d_nikke_belorta_pumpkinwitch_01_13:
    speaker: belorta_h
    en: Ta-da! ♡
    ko: 짜잔~♡
    ja: ジャジャーン♡
  d_nikke_belorta_pumpkinwitch_01_14:
    speaker: "<Monologue>"
    en: Belorta pulls a tablet out of her bag and shows it to me.
    ko: 벨로타가 가방에서 태블릿을 꺼내 내게 보여주었다.
    ja: |-
      ベロータはカバンから
      タブレットを取り出し、私に見せた
  d_nikke_belorta_pumpkinwitch_01_15:
    speaker: "<Self>"
    en: What's this?
    ko: 이게 뭐야?
    ja: これは？
  d_nikke_belorta_pumpkinwitch_01_16:
    speaker: "<Self>"
    en: '"The Witch''s Tale"?'
    ko: "[마녀 이야기]?"
    ja: "…「魔女の物語」？"
  d_nikke_belorta_pumpkinwitch_01_17:
    speaker: belorta_h
    en: I've been reading this lately, and it's sooo much fun!
    ko: 최근에 읽은 건데 어엄-청 재밌어~
    ja: 最近読んだんだけど、すっごく面白いの！
  d_nikke_belorta_pumpkinwitch_01_18:
    speaker: belorta_h
    en: Plus, it tells you all about witches.
    ko: 게다가 마녀에 대해 자세히 적혀있어서~
    ja: 魔女のことが詳しく書いてあって～
  d_nikke_belorta_pumpkinwitch_01_19:
    speaker: belorta_h
    en: The more I read it, the more I wanna become a real witch! Kyahaha!
    ko: 이걸 읽다 보니까 진짜 마녀가 되어보고 싶어지지 뭐야♡
    ja: |-
      これを読んだら、本物の魔女に
      なってみたくなっちゃったんだ♡
  d_nikke_belorta_pumpkinwitch_01_20:
    speaker: "<Self>"
    en: "... You're joking."
    ko: "…설마."
    ja: "…まさか"
  d_nikke_belorta_pumpkinwitch_01_21:
    speaker: belorta_h
    en: I mean it, Old-Timer! ♡
    ko: 맞아, 아저씨♡
    ja: そのまさかだよ、おじさん♡
  d_nikke_belorta_pumpkinwitch_01_22:
    speaker: belorta_h
    en: I really wanna become a witch!
    ko: 나 진짜 마녀가 되어보고 싶어~
    ja: 私、本物の魔女になってみたいの～
  d_nikke_belorta_pumpkinwitch_01_23:
    speaker: belorta_h
    en: So you'll come play with me, right?
    ko: 같이 어울려서 놀아줄 거지?
    ja: 付き合ってくれるよね？
  d_nikke_belorta_pumpkinwitch_01_24:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_belorta_pumpkinwitch_01_25:
    speaker: belorta_h
    en: You will, right?
    ko: 놀아줄 거지~?
    ja: 私と遊んでくれるよね～？
  d_nikke_belorta_pumpkinwitch_01_26:
    speaker: "<Monologue>"
    en: Belorta looks at me with puppy-dog eyes.
    ko: 벨로타가 가련한 표정으로 나를 올려다본다.
    ja: ベロータが可憐な表情で私を見上げてくる
  d_nikke_belorta_pumpkinwitch_01_27:
    speaker: belorta_h
    en: Pleeease?
    ko: 으응~?
    ja: いいでしょ～？
  d_nikke_belorta_pumpkinwitch_01_28:
    speaker: "<Monologue>"
    en: She moves a little closer.
    ko: 조금 더 가까워져 온다.
    ja: より近づいてくる
  d_nikke_belorta_pumpkinwitch_01_29:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…알았어."
    ja: "…分かった"
  d_nikke_belorta_pumpkinwitch_01_30:
    speaker: belorta_h
    en: Hehe, you're the best, Old-Timer! ♡
    ko: 역시 아저씨가 최고라니까♡
    ja: やっぱ、おじさんって最高♡
  d_nikke_belorta_pumpkinwitch_01_31:
    speaker: belorta_h
    en: Well, since you gave me the okay and all...
    ko: 허락도 받았으니까, 우선은~
    ja: 許可ももらったことだし、まずは～
  d_nikke_belorta_pumpkinwitch_01_32:
    speaker: "<Narration>"
    en: "*Rustle, rustle*"
    ko: 부스럭 부스럭-
    ja: ゴソゴソ
  d_nikke_belorta_pumpkinwitch_01_33:
    speaker: belorta_h
    en: Found 'em!
    ko: 여기 있다!
    ja: あった！
  d_nikke_belorta_pumpkinwitch_01_34:
    speaker: belorta_h
    en: Put these on first.
    ko: 이거부터 끼면 돼!
    ja: まずは、これをつけて！
  d_nikke_belorta_pumpkinwitch_01_35:
    speaker: "<Monologue>"
    en: Belorta pulls a pair of black ears and a matching tail out of her bag and
      hands them to me.
    ko: 벨로타가 가방에서 검은 귀와 꼬리 장식을 꺼내서 내게 건넸다.
    ja: |-
      ベロータはカバンから黒い耳と尻尾の
      飾りを取り出し、私に手渡した
  d_nikke_belorta_pumpkinwitch_01_36:
    speaker: "<Self>"
    en: What are these for?
    ko: 갑자기 이건 왜?
    ja: これは何なんだ？
  d_nikke_belorta_pumpkinwitch_01_37:
    speaker: belorta_h
    en: Isn't it obvious? Look, look!
    ko: 왜냐하면~ 여길 봐!
    ja: ほら、ここ見て！
  d_nikke_belorta_pumpkinwitch_01_38:
    speaker: belorta_h
    en: See the black cat next to the witch on the cover?
    ko: 여기 표지에 보면 마녀 옆에 검은 고양이가 있지?
    ja: |-
      表紙の魔女の隣に
      黒いネコがいるでしょ？
  d_nikke_belorta_pumpkinwitch_01_39:
    speaker: belorta_h
    en: Every witch needs a familiar,
    ko: 마녀에게는 [사역마]라는 게 꼭 필요한데~
    ja: |-
      魔女には「使い魔」っていうのが
      必要なんだけど～
  d_nikke_belorta_pumpkinwitch_01_40:
    speaker: belorta_h
    en: and apparently, they're usually black cats!
    ko: 보통 검은 고양이 모습을 하고 있대!
    ja: 普通は黒いネコの姿をしてるんだって！
  d_nikke_belorta_pumpkinwitch_01_41:
    speaker: belorta_h
    en: So you're gonna be my familiar, Old-Timer ♡
    ko: 그러니까 아저씨가 내 사역마가 되어줘♡
    ja: だから、おじさんが私の使い魔になって♡
  d_nikke_belorta_pumpkinwitch_01_42:
    speaker: belorta_h
    en: Put these on and become a black cat!
    ko: 이걸 끼고 검은 고양이가 되는 거야~
    ja: これを付けて、黒いネコになるの～
  d_nikke_belorta_pumpkinwitch_01_43:
    speaker: belorta_h
    en: And don't forget to go, "Meow!" Kyahaha!
    ko: 야옹~ 하고!
    ja: にゃ～んって！
  d_nikke_belorta_pumpkinwitch_01_44:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_belorta_pumpkinwitch_01_45:
    speaker: belorta_h
    en: You'll do it for me, right?
    ko: 해줄 거지~?
    ja: やってくれるよね～？
  d_nikke_belorta_pumpkinwitch_01_46:
    speaker: "<Monologue>"
    en: Belorta looks at me with puppy-dog eyes.
    ko: 벨로타가 가련한 표정으로 나를 올려다본다.
    ja: ベロータが可憐な表情で私を見上げてくる
  d_nikke_belorta_pumpkinwitch_01_47:
    speaker: belorta_h
    en: Pleeease?
    ko: 으응~?
    ja: いいでしょ～？
  d_nikke_belorta_pumpkinwitch_01_48:
    speaker: "<Monologue>"
    en: She moves a little closer.
    ko: 조금 더 가까워져 온다.
    ja: より近づいてくる
  d_nikke_belorta_pumpkinwitch_01_49:
    speaker: "<Self>"
    en: "... Do I really have to meow?"
    ko: 꼭 야옹… 이라고만 말해야 돼?
    ja: "「にゃー」としか…言ってはいけないのか？"
  d_nikke_belorta_pumpkinwitch_01_50:
    speaker: belorta_h
    en: Nah, you don't have to ♡
    ko: 아니, 안 그래도 돼♡
    ja: ううん、そんなことないよ♡
  d_nikke_belorta_pumpkinwitch_01_51:
    speaker: belorta_h
    en: I like talking with you more.
    ko: 난 아저씨랑 말하는 게 좋거든~
    ja: 私はおじさんと話すのが好きだもん～
  d_nikke_belorta_pumpkinwitch_01_52:
    speaker: "<Self>"
    en: "... All right."
    ko: 그럼… 알았어.
    ja: なら…分かった…
  d_nikke_belorta_pumpkinwitch_01_53:
    speaker: belorta_h
    en: Hehe, you're the best, Old-Timer! ♡
    ko: 역시 아저씨가 최고라니까♡
    ja: やっぱ、おじさんって最高♡
  d_nikke_belorta_pumpkinwitch_01_54:
    speaker: "<Monologue>"
    en: I put on the ears and tail Belorta had prepared for me.
    ko: 벨로타가 준비해 준 귀와 꼬리를 착용했다.
    ja: ベロータが用意した耳と尻尾を装着した
  d_nikke_belorta_pumpkinwitch_01_55:
    speaker: belorta_h
    en: Wow! They look great on you, Old-Timer!
    ko: 우와~ 아저씨 진짜 잘 어울린다~
    ja: わあ～。おじさん、すごく似合ってるよ～！
  d_nikke_belorta_pumpkinwitch_01_56:
    speaker: belorta_h
    en: Now then...
    ko: 그럼 이제!
    ja: それじゃあ！
  d_nikke_belorta_pumpkinwitch_01_57:
    speaker: belorta_h
    en: Time to make our contract!
    ko: 계약할 시간이야!
    ja: 契約の時間ね！
  d_nikke_belorta_pumpkinwitch_01_58:
    speaker: "<Self>"
    en: "... What?"
    ko: "…뭐?"
    ja: "…え？"
d_nikke_belorta_pumpkinwitch_02:
  d_nikke_belorta_pumpkinwitch_02_1:
    speaker: "<Self>"
    en: A contract?
    ko: 계약?
    ja: 契約？
  d_nikke_belorta_pumpkinwitch_02_2:
    speaker: belorta_h
    en: Yep, a contract! ♡
    ko: 응, 계약♡
    ja: うん、契約♡
  d_nikke_belorta_pumpkinwitch_02_3:
    speaker: belorta_h
    en: No worries, I've already prepped everything.
    ko: 내가 미리 다 준비해 왔거든?
    ja: 私がちゃーんと全部準備してきたんだから。
  d_nikke_belorta_pumpkinwitch_02_4:
    speaker: "<Narration>"
    en: "*Tap, tap, tap*"
    ko: 톡- 토독- 톡-
    ja: ピッ、ピピッ、ピッ
  d_nikke_belorta_pumpkinwitch_02_5:
    speaker: "<Monologue>"
    en: Belorta taps away at her tablet for a moment before setting it down on the
      table.
    ko: 벨로타가 잠시간 태블릿을 조작하더니, 탁자에 내려놓는다.
    ja: |-
      ベロータはタブレットを操作すると、
      テーブルの上に置いた
  d_nikke_belorta_pumpkinwitch_02_6:
    speaker: "<Monologue>"
    en: The first thing that catches my eye is the large heading: Familiar Contract.
    ko: "[사역마 계약서] 라는 큰 글자가 제일 먼저 눈에 띈다."
    ja: |-
      「使い魔契約書」という
      大きな文字が真っ先に目に入った
  d_nikke_belorta_pumpkinwitch_02_7:
    speaker: belorta_h
    en: Since cats can't read, I'll read it for you!
    ko: 자, 그럼 읽어줄게~
    ja: じゃ、読むね～
  d_nikke_belorta_pumpkinwitch_02_8:
    speaker: belorta_h
    en: Article 1. The familiar must obey the witch's every command.
    ko: 제1조. 사역마는 마녀의 명령에 절대복종한다.
    ja: 第1条。使い魔は魔女の命令に絶対服従とする。
  d_nikke_belorta_pumpkinwitch_02_9:
    speaker: "<Self>"
    en: "... Huh?"
    ko: "…응?"
    ja: "…ん？"
  d_nikke_belorta_pumpkinwitch_02_10:
    speaker: belorta_h
    en: Article 2. The familiar must bring the witch snacks every single day.
    ko: 제2조. 사역마는 마녀에게 매일 간식을 상납한다.
    ja: 第2条。使い魔は魔女に毎日おやつを捧げる。
  d_nikke_belorta_pumpkinwitch_02_11:
    speaker: "<Self>"
    en: Hold on.
    ko: 잠깐만.
    ja: ちょっと待ってくれ
  d_nikke_belorta_pumpkinwitch_02_12:
    speaker: belorta_h
    en: Article 3. The witch is free to play as many pranks as she likes.
    ko: 제3조. 마녀의 장난은 무제한으로 허용된다.
    ja: 第3条。魔女のイタズラは制限なく許される。
  d_nikke_belorta_pumpkinwitch_02_13:
    speaker: belorta_h
    en: Article 4. The familiar may not refuse any of the witch's requests.
    ko: 제4조. 사역마는 마녀의 요구를 거부할 수 없다.
    ja: 第4条。使い魔は魔女の要求を拒否できない。
  d_nikke_belorta_pumpkinwitch_02_14:
    speaker: "<Self>"
    en: This contract seems a bit unfair.
    ko: 이거 너무 불평등한 계약 아냐?
    ja: あまりにも不平等な契約じゃないか？
  d_nikke_belorta_pumpkinwitch_02_15:
    speaker: belorta_h
    en: Hey, let me finish!
    ko: 에이~ 끝까지 들어봐.
    ja: もう～、最後まで聞いてよ。
  d_nikke_belorta_pumpkinwitch_02_16:
    speaker: "<Monologue>"
    en: Belorta reads the entire contract without pausing.
    ko: 벨로타는 계약서 내용을 막힘없이 읽어 내려갔고.
    ja: ベロータは契約書の内容をスラスラと読み進めた
  d_nikke_belorta_pumpkinwitch_02_17:
    speaker: "<Monologue>"
    en: The clauses are so outrageous they'd make a slave contract seem reasonable.
    ko: 노예 계약도 울고 갈 조항들이 줄줄 이어졌다.
    ja: |-
      奴隷契約も真っ青な条項が
      次から次へと続いていった
  d_nikke_belorta_pumpkinwitch_02_18:
    speaker: belorta_h
    en: And now for the most important part!
    ko: 제일 중요한 부분이야~
    ja: ここが一番大事なところね～
  d_nikke_belorta_pumpkinwitch_02_19:
    speaker: belorta_h
    en: Article 10. If the familiar faithfully fulfills their duties, the witch shall
      provide ■■ as compensation.
    ko: 제10조. 사역마가 자신의 역할을 충실히 이행한 경우, 마녀는 보수로 ■■를 지급한다.
    ja: |-
      第10条。使い魔が自分の役割を
      忠実に果たした場合、
      魔女は報酬として■■を支給する。
  d_nikke_belorta_pumpkinwitch_02_20:
    speaker: belorta_h
    en: So whatcha think?
    ko: 어때, 어때?
    ja: どう？どう？
  d_nikke_belorta_pumpkinwitch_02_21:
    speaker: belorta_h
    en: You totally want to sign it, don'tcha?
    ko: 막 사인하고 싶어지지 않아?
    ja: 今すぐサインしたくならない？
  d_nikke_belorta_pumpkinwitch_02_22:
    speaker: "<Self>"
    en: Here.
    ko: 여기 이 보수 부분.
    ja: "…この報酬の部分"
  d_nikke_belorta_pumpkinwitch_02_23:
    speaker: "<Self>"
    en: This section's been redacted. So what's the reward?
    ko: 가려져 있는데, 결국 보수가 뭐야?
    ja: 隠されているが、報酬は何なんだ？
  d_nikke_belorta_pumpkinwitch_02_24:
    speaker: belorta_h
    en: It's a secret ♡
    ko: 그건~ 비밀이야♡
    ja: それは～、ナイショ♡
  d_nikke_belorta_pumpkinwitch_02_25:
    speaker: belorta_h
    en: Where's the fun if you already know what the reward is?
    ko: 보수가 미리 뭔지 알아버리면 김새잖아~?
    ja: |-
      先に分かっちゃったら、
      つまらないでしょ～？
  d_nikke_belorta_pumpkinwitch_02_26:
    speaker: "<Self>"
    en: But if I like the reward, I might be motivated to work even harder.
    ko: 보수가 마음에 들면 더 힘내고 싶어질 수도 있잖아.
    ja: |-
      報酬が気に入れば、
      もっとやる気が出るかもしれないだろう？
  d_nikke_belorta_pumpkinwitch_02_27:
    speaker: belorta_h
    en: Nope, no way!
    ko: 안 돼 안 돼~
    ja: ダメ、ダメ～
  d_nikke_belorta_pumpkinwitch_02_28:
    speaker: belorta_h
    en: That'd spoil the surprise, and that'd be no fun!
    ko: 그럼 깜짝 요소가 없어져서 재미없는걸~
    ja: |-
      それじゃ、サプライズ感がなくなって
      つまんないもん～
  d_nikke_belorta_pumpkinwitch_02_29:
    speaker: belorta_h
    en: But don't worry!
    ko: 그리고 걱정 마~
    ja: それに心配しないで～
  d_nikke_belorta_pumpkinwitch_02_30:
    speaker: belorta_h
    en: I'm sure you're gonna love it, hehe!
    ko: 아저씨, 분명 마음에 들어 할 걸~?
    ja: おじさん、きっと気に入ると思うよ～？
  d_nikke_belorta_pumpkinwitch_02_31:
    speaker: "<Monologue>"
    en: Seeing Belorta smile so confidently, a wave of unease washes over me.
    ko: 자신만만하게 웃는 벨로타를 보자, 불안감이 엄습하지만.
    ja: |-
      自信満々に笑うベロータを見て、
      不安が押し寄せたが…
  d_nikke_belorta_pumpkinwitch_02_32:
    speaker: "<Monologue>"
    en: For now, I decide not to dwell on it.
    ko: 우선은 넘어갔다.
    ja: ひとまずは流すことにした
  d_nikke_belorta_pumpkinwitch_02_33:
    speaker: belorta_h
    en: Now that we're all done reading,
    ko: 다 읽어봤지?
    ja: 全部読んだよね？
  d_nikke_belorta_pumpkinwitch_02_34:
    speaker: belorta_h
    en: it's time to sign! Don't be shy ♡
    ko: 그럼 이제 사인해줘♡
    ja: それじゃ、サインして♡
  d_nikke_belorta_pumpkinwitch_02_35:
    speaker: "<Self>"
    en: Hm...
    ko: "…음."
    ja: "…ふむ"
  d_nikke_belorta_pumpkinwitch_02_36:
    speaker: "<Self>"
    en: There's no denying this contract's a bit...
    ko: 역시 아무리 봐도 이 계약은….
    ja: やはり、どう考えてもこの契約は…
  d_nikke_belorta_pumpkinwitch_02_37:
    speaker: belorta_h
    en: Come on, Old-Timer!
    ko: 아저씨~
    ja: おじさ～ん。
  d_nikke_belorta_pumpkinwitch_02_38:
    speaker: belorta_h
    en: I know you're super busy. Just humor me for today, okay?
    ko: |-
      나도 아저씨 바쁜 거 잘 알아.
      오늘만 어울려줘도 돼~
    ja: |-
      私もおじさんが忙しいのはよく分かってるよ。
      今日だけ付き合ってくれればいいから～
  d_nikke_belorta_pumpkinwitch_02_39:
    speaker: belorta_h
    en: And trust me, you're really gonna like what you're getting out of this!
    ko: 그리고 여기 적힌 보수 진~짜로 마음에 들 거라니까?
    ja: |-
      それにここに書いてある報酬、
      ぜ～ったい気に入るから。
  d_nikke_belorta_pumpkinwitch_02_40:
    speaker: belorta_h
    en: So... will you sign it for me?
    ko: 그러니까 사인 해주면 안 돼?
    ja: だから、サインしてくれる？
  d_nikke_belorta_pumpkinwitch_02_41:
    speaker: belorta_h
    en: Pretty please? With a cherry on top!
    ko: 이렇게 부탁할게~
    ja: お願い～
  d_nikke_belorta_pumpkinwitch_02_42:
    speaker: "<Monologue>"
    en: Belorta looks at me with puppy-dog eyes.
    ko: 벨로타가 가련한 표정으로 나를 올려다본다.
    ja: ベロータが可憐な表情で私を見上げてくる
  d_nikke_belorta_pumpkinwitch_02_43:
    speaker: "<Monologue>"
    en: If Rapi were here,
    ko: 라피가 옆에서 보고 있었다면.
    ja: もしラピが隣で見ていたら…
  d_nikke_belorta_pumpkinwitch_02_44:
    speaker: "<Monologue>"
    en: she'd probably scold me for falling for the same trick over and over.
    ko: 똑같은 수에 몇 번을 당하시는 겁니까, 하고 핀잔줬을 것 같다.
    ja: |-
      「何度同じ手に引っかかるおつもりですか」と、
      呆れられていたことだろう
  d_nikke_belorta_pumpkinwitch_02_45:
    speaker: "<Monologue>"
    en: But... I just can't say no to that look.
    ko: 하지만… 저 표정엔 이길 수가 없다.
    ja: だが…あの表情には勝てない
  d_nikke_belorta_pumpkinwitch_02_46:
    speaker: "<Monologue>"
    en: I pick up the tablet and sign the contract.
    ko: 태블릿을 들고가 서명란에 사인했다.
    ja: タブレットを手に取り、署名欄にサインした
  d_nikke_belorta_pumpkinwitch_02_47:
    speaker: belorta_h
    en: Woohoo! You're the best, Old-Timer! ♡
    ko: 와아~ 아저씨가 진짜 최고야♡
    ja: わあ～、おじさんってホント最高だよ♡
  d_nikke_belorta_pumpkinwitch_02_48:
    speaker: belorta_h
    en: We've got a deal!
    ko: 계약 성립~
    ja: 契約成立～
  d_nikke_belorta_pumpkinwitch_02_49:
    speaker: belorta_h
    en: Now let's hurry and gather the ingredients!
    ko: 그럼 빠르게 재료를 모아볼까?
    ja: それじゃ、さっそく素材を集めよっか？
  d_nikke_belorta_pumpkinwitch_02_50:
    speaker: "<Self>"
    en: What ingredients?
    ko: 재료? 무슨 재료?
    ja: 素材？何の素材だ？
  d_nikke_belorta_pumpkinwitch_02_51:
    speaker: belorta_h
    en: What do you mean, "what ingredients"?
    ko: 흐흥~ 뭐긴 뭐야.
    ja: フフン～、決まってるじゃん。
  d_nikke_belorta_pumpkinwitch_02_52:
    speaker: belorta_h
    en: What's a witch without magic potions?
    ko: 마녀, 하면 마법약 아니겠어?
    ja: 魔女といえば、魔法薬でしょ？
  d_nikke_belorta_pumpkinwitch_02_53:
    speaker: belorta_h
    en: So we're gonna gather everything we need to brew some!
    ko: 마법약을 만들기 위한 재료를 모을 거야~
    ja: 魔法薬を作るための素材を集めるんだよ～
  d_nikke_belorta_pumpkinwitch_02_54:
    speaker: belorta_h
    en: Since you're my familiar, all you have to do is help your witch out.
    ko: 아저씨는 내 사역마니까, 마녀인 날 도와주면 돼.
    ja: |-
      おじさんは私の使い魔だから、
      魔女の私を手伝うの。
  d_nikke_belorta_pumpkinwitch_02_55:
    speaker: belorta_h
    en: Easy, right? Kyahaha!
    ko: 어때, 쉽지?
    ja: ね、カンタンでしょ？
d_nikke_belorta_pumpkinwitch_03:
  d_nikke_belorta_pumpkinwitch_03_1:
    speaker: "<Monologue>"
    en: Belorta and I head outside to look for ingredients.
    ko: 벨로타와 함께 재료를 구하러 밖으로 나왔다.
    ja: ベロータと一緒に素材を集めに外へ出た
  d_nikke_belorta_pumpkinwitch_03_2:
    speaker: "<Self>"
    en: What kind of magic potion are you planning to make?
    ko: 그런데 무슨 마법약을 만드는 거야?
    ja: ところで、どんな魔法薬を作るんだ？
  d_nikke_belorta_pumpkinwitch_03_3:
    speaker: belorta_h
    en: A witch doesn't spill her secrets ♡
    ko: 그것도 비밀♡
    ja: それもナイショ♡
  d_nikke_belorta_pumpkinwitch_03_4:
    speaker: belorta_h
    en: But don't worry, I'll show you what we'll need.
    ko: 하지만 재료는 보여줄게.
    ja: でも、素材は見せてあげる。
  d_nikke_belorta_pumpkinwitch_03_5:
    speaker: belorta_h
    en: There are quite a few things you'll have to get for me, y'know?
    ko: 아저씨한테 얻어야 하는 것도 꽤 있거든?
    ja: |-
      おじさんからゲットしなきゃいけないものも、
      結構あるんだよ？
  d_nikke_belorta_pumpkinwitch_03_6:
    speaker: "<Self>"
    en: What kind of things are we talking about?
    ko: 나한테 얻어야 하는 것…?
    ja: 私からゲットしなければいけないもの…？
  d_nikke_belorta_pumpkinwitch_03_7:
    speaker: "<Monologue>"
    en: Belorta hands me her tablet.
    ko: 벨로타에게 태블릿을 전달받았다.
    ja: ベロータからタブレットを受け取った
  d_nikke_belorta_pumpkinwitch_03_8:
    speaker: "<Monologue>"
    en: It contains a list of ingredients needed for the potion.
    ko: 그곳엔 마법약에 필요한 재료 목록이 있었다.
    ja: そこには魔法薬に必要な素材のリストがあった
  d_nikke_belorta_pumpkinwitch_03_9:
    speaker: "<Monologue>"
    en: A handful of candy, dark chocolate, a ripe pumpkin...
    ko: 사탕 한 줌, 진한 초콜릿, 잘 익은 호박.
    ja: |-
      キャンディひとつかみ、濃厚なチョコレート、
      よく熟れたカボチャ
  d_nikke_belorta_pumpkinwitch_03_10:
    speaker: "<Monologue>"
    en: Familiar's sigh, familiar's tears, familiar's heartbeat, familiar's...
    ko: 사역마의 한숨, 사역마의 눈물, 사역마의 심장 소리, 사역마의….
    ja: |-
      使い魔のため息、使い魔の涙、
      使い魔の心臓の音、使い魔の…
  d_nikke_belorta_pumpkinwitch_03_11:
    speaker: "<Self>"
    en: What's this?
    ko: 이게 뭐야?
    ja: これは？
  d_nikke_belorta_pumpkinwitch_03_12:
    speaker: belorta_h
    en: It says it right there, duh!
    ko: 거기 쓰인 그대로야~
    ja: そこに書いてあるとおりだよ～
  d_nikke_belorta_pumpkinwitch_03_13:
    speaker: "<Self>"
    en: A sigh, tears, a heartbeat... You sure these are ingredients?
    ko: 한숨, 눈물, 심장 소리… 이런 게 재료라구?
    ja: |-
      ため息、涙、心臓の音…
      こんなものも素材なのか？
  d_nikke_belorta_pumpkinwitch_03_14:
    speaker: belorta_h
    en: You betcha! ♡
    ko: 맞아♡
    ja: そうだよ♡
  d_nikke_belorta_pumpkinwitch_03_15:
    speaker: belorta_h
    en: This potion just can't be made without you, Old-Timer!
    ko: 아저씨가 꼭~ 필요한 물약이거든.
    ja: |-
      おじさんがいないと、
      ぜぇ～ったいに作れない薬なんだから。
  d_nikke_belorta_pumpkinwitch_03_16:
    speaker: "<Self>"
    en: "*Sigh...*"
    ko: "…하아."
    ja: "…はぁ"
  d_nikke_belorta_pumpkinwitch_03_17:
    speaker: belorta_h
    en: Ah!
    ko: 앗!
    ja: あっ！
  d_nikke_belorta_pumpkinwitch_03_18:
    speaker: "<Monologue>"
    en: Belorta takes out a small glass vial and holds it up to my mouth, pretending
      to collect my sigh.
    ko: 벨로타가 작은 유리병을 꺼내 내 입가에 대고 한숨을 담는 시늉을 했다.
    ja: |-
      ベロータは小さなガラス瓶を取り出し
      私の口元に当て、ため息を
      閉じ込めるような仕草をした
  d_nikke_belorta_pumpkinwitch_03_19:
    speaker: belorta_h
    en: See? We already got an ingredient!
    ko: 우와~ 벌써 재료를 하나 모았어!
    ja: やったぁ～、もう素材が一つ集まっちゃった！
  d_nikke_belorta_pumpkinwitch_03_20:
    speaker: belorta_h
    en: You're amazing, Old-Timer!
    ko: 아저씨 대단한데~?
    ja: おじさん、すご～い！
  d_nikke_belorta_pumpkinwitch_03_21:
    speaker: belorta_h
    en: While we're at it, how about some tears too?
    ko: 이왕 하는 김에 눈물까지 어때?
    ja: せっかくだし、涙もいっちゃおっか？
  d_nikke_belorta_pumpkinwitch_03_22:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_belorta_pumpkinwitch_03_23:
    speaker: "<Self>"
    en: I... don't think I can cry.
    ko: 눈물은… 안 나는데.
    ja: 涙は…出ない
  d_nikke_belorta_pumpkinwitch_03_24:
    speaker: belorta_h
    en: We can worry about that later!
    ko: 그럼 그건 이따가 다른 방법으로 시도해 보자~
    ja: んじゃ、それは後で別の方法で試してみよ～
  d_nikke_belorta_pumpkinwitch_03_25:
    speaker: belorta_h
    en: Look, it says it right here.
    ko: 여기 쓰여있어.
    ja: ここに書いてあるの。
  d_nikke_belorta_pumpkinwitch_03_26:
    speaker: belorta_h
    en: The ingredients have to be made with genuine feelings!
    ko: "[진심]을 담은 재료여야 한다고!"
    ja: |-
      「気持ち」のこもった素材じゃなきゃ
      ダメなんだって！
  d_nikke_belorta_pumpkinwitch_03_27:
    speaker: belorta_h
    en: Come on, let's go grab the candy and chocolate first!
    ko: 일단은 사탕이랑 초콜릿부터 구하러 가볼까~?
    ja: |-
      とりあえず、キャンディと
      チョコから集めに行こっか～？
  d_nikke_belorta_pumpkinwitch_03_28:
    speaker: belorta_h
    en: The Halloween festival's already in full swing, so getting them should be
      easy!
    ko: 마침 할로윈 축제 중이기도 하니까, 얻기 쉬울 거야!
    ja: |-
      ちょうどハロウィンのイベントがやってるから、
      カンタンにもらえるはずだよ！
  d_nikke_belorta_pumpkinwitch_03_29:
    speaker: "<Self>"
    en: Wait, how?
    ko: 응? 어떻게?
    ja: ん？どうやって？
  d_nikke_belorta_pumpkinwitch_03_30:
    speaker: belorta_h
    en: Easy! We'll just say, "Trick or treat! Gimme some candy, or I'll play a trick
      on you!"
    ko: 사탕을 주지 않으면, 장난칠 거야!
    ja: お菓子をくれなきゃ、イタズラしちゃうぞ！
  d_nikke_belorta_pumpkinwitch_03_31:
    speaker: belorta_h
    en: Then we'll get all the candy and chocolate we need.
    ko: 라고 하면 사탕이나 초콜릿을 얻을 수 있어.
    ja: |-
      って言えば、キャンディとか
      チョコがもらえるの。
  d_nikke_belorta_pumpkinwitch_03_32:
    speaker: belorta_h
    en: Come on, let's go, Old-Timer!
    ko: 얼른 가자~
    ja: 早く行こ～
  d_nikke_belorta_pumpkinwitch_03_33:
    speaker: "<Self>"
    en: Er, sure...
    ko: 그, 그래….
    ja: わ、分かった…
  d_nikke_belorta_pumpkinwitch_03_34:
    speaker: "<Monologue>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_belorta_pumpkinwitch_03_35:
    speaker: "<Monologue>"
    en: Belorta approaches an older woman handing out candy in the park.
    ko: 벨로타가 공원에서 사탕을 나눠주고 있는 아주머니에게 다가갔다.
    ja: |-
      ベロータは公園でお菓子を
      配っている女性に近づいた
  d_nikke_belorta_pumpkinwitch_03_36:
    speaker: momwoman
    en: Oh my, aren't you a cutie? Come here, sweetheart.
    ko: 어머나, 어서 오렴. 귀여운 꼬마야.
    ja: あら、こんにちは。かわいいお嬢ちゃん。
  d_nikke_belorta_pumpkinwitch_03_37:
    speaker: belorta_h
    en: Trick or treat! Gimme some candy,
    ko: 사탕을 주지 않으면, 장난칠 거야!
    ja: お菓子をくれなきゃ、イタズラしちゃうぞ！
  d_nikke_belorta_pumpkinwitch_03_38:
    speaker: belorta_h
    en: or I'll play a trick on you!
    ko: 사탕 줘~
    ja: キャンディちょうだ～い。
  d_nikke_belorta_pumpkinwitch_03_39:
    speaker: momwoman
    en: Of course, here you are.
    ko: 그래 그래, 여기 있단다.
    ja: はいはい、どうぞ。
  d_nikke_belorta_pumpkinwitch_03_40:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭-
    ja: ゴソゴソ
  d_nikke_belorta_pumpkinwitch_03_41:
    speaker: "<Monologue>"
    en: The older woman smiles as she hands Belorta a handful of candy.
    ko: 아주머니가 웃으며 벨로타에게 사탕을 한 줌 건넸다.
    ja: |-
      女性は微笑みながら、
      ベロータにキャンディをひと掴み手渡した
  d_nikke_belorta_pumpkinwitch_03_42:
    speaker: "<Narration>"
    en: "*Poke*"
    ko: 쿡-
    ja: ツンッ――
  d_nikke_belorta_pumpkinwitch_03_43:
    speaker: "<Monologue>"
    en: Belorta pokes me in the side.
    ko: 벨로타가 내 옆구리를 찔렀다.
    ja: ベロータが私の脇腹をつついた
  d_nikke_belorta_pumpkinwitch_03_44:
    speaker: belorta_h
    en: Your turn, Old-Timer.
    ko: 아저씨도 빨리~
    ja: おじさんも早く～
  d_nikke_belorta_pumpkinwitch_03_45:
    speaker: "<Monologue>"
    en: I walk up to the older woman.
    ko: 나는 아주머니 앞으로 다가갔다.
    ja: 私は女性の前に歩み寄った
  d_nikke_belorta_pumpkinwitch_03_46:
    speaker: momwoman
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_belorta_pumpkinwitch_03_47:
    speaker: "<Self>"
    en: Give me some candy, or I'll play a trick on you.
    ko: 사탕을 주지 않으면, 장난칠 겁니다.
    ja: お菓子をくれないと、いたずらします
  d_nikke_belorta_pumpkinwitch_03_48:
    speaker: momwoman
    en: What was that? I'm sorry, I didn't hear you. You'll have to speak up, sonny.
    ko: |-
      네? 뭐라고요?
      너무 작게 이야기해서 못 들었어요, 청년.
    ja: |-
      え？何ですって？
      声が小さすぎて聞こえなかったわ、お兄さん。
  d_nikke_belorta_pumpkinwitch_03_49:
    speaker: "<Self>"
    en: Er, well...
    ko: 그… 아니….
    ja: その…いえ…
  d_nikke_belorta_pumpkinwitch_03_50:
    speaker: "<Self>"
    en: Sorry to bother you, but... could I have some of that chocolate?
    ko: 죄송하지만, 거기 있는 초콜릿 좀… 얻을 수 있을까 해서요.
    ja: |-
      すみませんが、そこにあるチョコを…
      いただけないかと思いまして
  d_nikke_belorta_pumpkinwitch_03_51:
    speaker: "<Self>"
    en: I'm... a little hungry...
    ko: 배가… 좀 고파서….
    ja: お腹が…ちょっと空いていまして…
  d_nikke_belorta_pumpkinwitch_03_52:
    speaker: momwoman
    en: Goodness, you look like a perfectly healthy young man... Tsk, tsk.
    ko: "…아이고, 멀쩡한 청년처럼 보이는데… 쯔쯧."
    ja: |-
      …あらあら、きちんとした若者に見えるのに…
      かわいそうに。
  d_nikke_belorta_pumpkinwitch_03_53:
    speaker: momwoman
    en: They say it's next to impossible for young folks to find work these days.
      You must be having a rough time.
    ko: |-
      요즘 청년들 일자리 구하기가 하늘의 별 따기라더니,
      많이 힘든가 보구만.
    ja: |-
      最近の若い人は仕事を見つけるのも
      大変だって聞くけど、
      ずいぶん苦労しているみたいだねぇ。
  d_nikke_belorta_pumpkinwitch_03_54:
    speaker: momwoman
    en: Here, sonny, take these. Hang in there.
    ko: 가져가서 먹어요. 힘내요, 청년.
    ja: |-
      これ、持っていって食べなさい。
      頑張ってね、お兄さん。
  d_nikke_belorta_pumpkinwitch_03_55:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭-
    ja: ゴソゴソ
  d_nikke_belorta_pumpkinwitch_03_56:
    speaker: "<Monologue>"
    en: The older woman hands me some chocolate with a sympathetic look.
    ko: 아주머니가 안타까운 얼굴로 내게 초콜릿을 건넸다.
    ja: |-
      女性は気の毒そうな顔をして、
      私にチョコレートを差し出した
  d_nikke_belorta_pumpkinwitch_03_57:
    speaker: "<Self>"
    en: "... Thank you."
    ko: "…감사합니다."
    ja: "…ありがとうございます"
  d_nikke_belorta_pumpkinwitch_03_58:
    speaker: "<Monologue>"
    en: I head back to Belorta.
    ko: 벨로타에게 돌아갔다.
    ja: ベロータのもとへ戻った
  d_nikke_belorta_pumpkinwitch_03_59:
    speaker: belorta_h
    en: Wow, Old-Timer! Nice job!
    ko: 와~ 아저씨! 잘했어!
    ja: わあ～、おじさん！やったぁ！
  d_nikke_belorta_pumpkinwitch_03_60:
    speaker: belorta_h
    en: "... But what's with that look on your face?"
    ko: 그런데 표정이 왜 그래?
    ja: でも、なんでそんな顔してるの？
  d_nikke_belorta_pumpkinwitch_03_61:
    speaker: "<Self>"
    en: I should've just... bought these at the store.
    ko: 그냥… 가게에서 살걸.
    ja: 普通に…店で買えばよかった
  d_nikke_belorta_pumpkinwitch_03_62:
    speaker: belorta_h
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_belorta_pumpkinwitch_03_63:
    speaker: "<Self>"
    en: "... It's nothing."
    ko: 아무것도 아냐.
    ja: 何でもない
d_nikke_belorta_pumpkinwitch_04:
  d_nikke_belorta_pumpkinwitch_04_1:
    speaker: "<Monologue>"
    en: A few hours later...
    ko: 몇 시간 후.
    ja: 数時間後
  d_nikke_belorta_pumpkinwitch_04_2:
    speaker: "<Monologue>"
    en: After gathering a bunch of ingredients, we head back to the Toy Store.
    ko: 우리는 꽤 많은 재료를 얻어 장난감 가게로 돌아왔다.
    ja: |-
      私たちはたくさんの素材を手に入れて、
      おもちゃ屋に戻ってきた
  d_nikke_belorta_pumpkinwitch_04_3:
    speaker: belorta_h
    en: Candy, chocolate, a pumpkin...
    ko: 사탕이랑, 초콜릿이랑 호박이랑~
    ja: キャンディに、チョコとカボチャ～
  d_nikke_belorta_pumpkinwitch_04_4:
    speaker: belorta_h
    en: And I even got a sigh and some tears out of you! ♡
    ko: 한숨도 얻었고, 눈물도 얻었지♡
    ja: それに、ため息と涙もゲットできちゃった♡
  d_nikke_belorta_pumpkinwitch_04_5:
    speaker: belorta_h
    en: Old-Timer, I had no idea you cried so easily!
    ko: 아저씨~ 그렇게 잘 우는 줄 몰랐어~
    ja: |-
      おじさ～んがそんなに
      涙もろいとは思わなかったよ～
  d_nikke_belorta_pumpkinwitch_04_6:
    speaker: belorta_h
    en: You didn't even make it past the first second of a "Try Not to Cry Challenge"
      video before the waterworks started! Kyahaha!
    ko: "[울음 참기 챌린지] 영상을 보자마자 바로 울어버릴 줄은~"
    ja: |-
      「涙こらえチャレンジ」の動画で
      すぐ泣いちゃうんだもん～
  d_nikke_belorta_pumpkinwitch_04_7:
    speaker: "<Self>"
    en: I think it's weirder that you didn't cry, Belorta.
    ko: 오히려 안 운 벨로타가 이상한 거 아냐?
    ja: |-
      泣かなかったベロータのほうが
      おかしいんじゃないか？
  d_nikke_belorta_pumpkinwitch_04_8:
    speaker: belorta_h
    en: I've seen that video way too many times.
    ko: 난 너무 많이 본 영상이라서 그래~
    ja: 私は、もう何回も見たから～
  d_nikke_belorta_pumpkinwitch_04_9:
    speaker: belorta_h
    en: It was sooooo sad that I got curious how everyone else would react,
    ko: 너~무 슬프길래, 다른 사람들 반응이 궁금해져서
    ja: |-
      す～っごく悲しかったから、
      他の人の反応も気になって
  d_nikke_belorta_pumpkinwitch_04_10:
    speaker: belorta_h
    en: so I kept showing it to everyone I met.
    ko: 만나는 사람마다 보여줬었거든.
    ja: 会う人みんなに見せたんだよね。
  d_nikke_belorta_pumpkinwitch_04_11:
    speaker: belorta_h
    en: I've seen it so many times that it doesn't get to me anymore.
    ko: 그러다 보니까 너무 많이 봐서 이젠 괜찮아져 버렸어~
    ja: |-
      そうやって何度も見てるうちに、
      すっかり平気になっちゃったんだ～
  d_nikke_belorta_pumpkinwitch_04_12:
    speaker: belorta_h
    en: Hehe, Mica still cries every single time I show it to her.
    ko: 아, 미카는 보여줄 때마다 울더라?
    ja: あ、ミカは見せるたびに泣いてたっけ。
  d_nikke_belorta_pumpkinwitch_04_13:
    speaker: "<Self>"
    en: Speaking of which, Mica's not here. Where is she?
    ko: |-
      그러고 보니, 미카가 없네.
      미카는?
    ja: |-
      そういえば、ミカがいないな。
      ミカはどこだ？
  d_nikke_belorta_pumpkinwitch_04_14:
    speaker: belorta_h
    en: Probably out trick-or-treating?
    ko: 미카도 사탕 받으러 간 거 아닐까~?
    ja: |-
      ミカもキャンディをもらいに
      行ったんじゃないかな～？
  d_nikke_belorta_pumpkinwitch_04_15:
    speaker: belorta_h
    en: It is Halloween, after all!
    ko: 할로윈이니까!
    ja: ハロウィンだもん！
  d_nikke_belorta_pumpkinwitch_04_16:
    speaker: belorta_h
    en: Anyway, Old-Timer, we're almost done gathering the ingredients.
    ko: 어쨌든 아저씨~ 이제 재료도 마무리 단계야.
    ja: |-
      とにかく～、集めなきゃいけない素材も
      あとちょっとだよ。
  d_nikke_belorta_pumpkinwitch_04_17:
    speaker: belorta_h
    en: All that's left is... your heartbeat and shriek! ♡
    ko: 남은 건… 사역마의 심장 소리랑 사역마의 비명이네♡
    ja: あとは…使い魔の心臓の音と悲鳴だね♡
  d_nikke_belorta_pumpkinwitch_04_18:
    speaker: "<Self>"
    en: How are you going to get those?
    ko: 그건 어떻게 모을 셈이야?
    ja: それは…どうやって集めるつもりなんだ？
  d_nikke_belorta_pumpkinwitch_04_19:
    speaker: belorta_h
    en: I've got my ways!
    ko: 다 방법이 있지~
    ja: ちゃんと方法があるんだ～
  d_nikke_belorta_pumpkinwitch_04_20:
    speaker: belorta_h
    en: C'mere and I'll show you! ♡
    ko: 이쪽으로 와♡
    ja: こっちに来て♡
  d_nikke_belorta_pumpkinwitch_04_21:
    speaker: "<Monologue>"
    en: Belorta leads me to a storage room next to the Toy Store.
    ko: 벨로타는 나를 가게 옆 창고로 안내했다.
    ja: ベロータは私を店の隣の倉庫へ案内した
  d_nikke_belorta_pumpkinwitch_04_22:
    speaker: "<Monologue>"
    en: As soon as she opens the door, I'm greeted by a black curtain.
    ko: 창고를 열자, 검은 커튼이 보였다.
    ja: 倉庫を開けると、黒いカーテンが見えた
  d_nikke_belorta_pumpkinwitch_04_23:
    speaker: "<Self>"
    en: What's this?
    ko: 이건 뭐야?
    ja: これは？
  d_nikke_belorta_pumpkinwitch_04_24:
    speaker: belorta_h
    en: Remember, Old-Timer?
    ko: 아저씨 기억 나~?
    ja: おじさん、覚えてる～？
  d_nikke_belorta_pumpkinwitch_04_25:
    speaker: belorta_h
    en: A looong time ago, you helped Mica and me turn the Toy Store into a haunted
      house.
    ko: 예~전에 나랑 미카랑 장난감 가게를 귀신의 집으로 꾸민 적이 있었잖아.
    ja: |-
      ずーっと前に、私とミカでおもちゃ屋を
      お化け屋敷にしたことあったでしょ？
  d_nikke_belorta_pumpkinwitch_04_26:
    speaker: belorta_h
    en: I couldn't bear to let all those props go to waste, so I set them all up here
      instead.
    ko: 그때 활용한 아이템들이 아까워서 여기에 그대로 다시 꾸며놨었거든.
    ja: |-
      その時に使ったアイテムがもったいなくて、
      ここにそのまま飾り付けてあるんだ。
  d_nikke_belorta_pumpkinwitch_04_27:
    speaker: belorta_h
    en: Just like a real haunted house ♡
    ko: 귀신의 집처럼♡
    ja: お化け屋敷みたいに♡
  d_nikke_belorta_pumpkinwitch_04_28:
    speaker: belorta_h
    en: Hehe... It's the perfect place to collect heartbeats and shrieks!
    ko: 흐흥~ 심장 소리랑 비명을 수집하기에는 딱이지~
    ja: |-
      フフン～、心臓の音と悲鳴を
      集めるにはぴったりでしょ～
  d_nikke_belorta_pumpkinwitch_04_29:
    speaker: belorta_h
    en: Now then, Old-Timer, you're going in!
    ko: 지금부터 아저씨는 이 귀신의 집에 들어가는 거야~
    ja: |-
      今からおじさんは、
      このお化け屋敷に入るんだよ～
  d_nikke_belorta_pumpkinwitch_04_30:
    speaker: "<Self>"
    en: Just so you know, I don't scare easily.
    ko: 미리 말해두는데, 나 잘 안 놀라.
    ja: 先に言っておくが、私はそう簡単に驚かないぞ
  d_nikke_belorta_pumpkinwitch_04_31:
    speaker: belorta_h
    en: That's what everyone says at first!
    ko: 다들 처음엔 그렇게 말하더라구~
    ja: みんな最初はそう言うんだよね～
  d_nikke_belorta_pumpkinwitch_04_32:
    speaker: belorta_h
    en: Go on, Old-Timer! Get in there already! ♡
    ko: 얼른 들어가, 아저씨♡
    ja: 早く入って、おじさん♡
  d_nikke_belorta_pumpkinwitch_04_33:
    speaker: "<Narration>"
    en: I feel a shove from behind.
    ko: 툭-
    ja: トンッ
  d_nikke_belorta_pumpkinwitch_04_34:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_belorta_pumpkinwitch_04_35:
    speaker: "<Monologue>"
    en: Belorta pushes me through the black curtain.
    ko: 벨로타에게 등을 떠밀려 검은 커튼 너머로 들어갔다.
    ja: |-
      ベロータに背中を押され、
      黒いカーテンの向こうへ入った
  d_nikke_belorta_pumpkinwitch_04_36:
    speaker: "<Monologue>"
    en: It's pitch black inside. I can't see a thing.
    ko: 암막 커튼인지, 창고 안은 칠흑같이 어두웠다.
    ja: |-
      遮光されているせいか、
      倉庫の中は漆黒の闇に包まれていた
  d_nikke_belorta_pumpkinwitch_04_37:
    speaker: "<Self>"
    en: "... Belorta?"
    ko: "…벨로타?"
    ja: "…ベロータ？"
  d_nikke_belorta_pumpkinwitch_04_38:
    speaker: "<Narration>"
    en: "*Clack*"
    ko: 덜그럭-
    ja: カタッ…
  d_nikke_belorta_pumpkinwitch_04_39:
    speaker: "<Self>"
    en: Is that you...?
    ko: 거기 있었….
    ja: そこか…？
  d_nikke_belorta_pumpkinwitch_04_40:
    speaker: "<Monologue>"
    en: As soon as I reach out, something cold brushes against my hand.
    ko: 손을 뻗자, 무언가 서늘한 게 손에 닿는다.
    ja: |-
      手を伸ばすと、
      何かひんやりとしたものに触れた
  d_nikke_belorta_pumpkinwitch_04_41:
    speaker: "<Narration>"
    en: Suddenly,
    ko: 번쩍-
    ja: ピカッ
  d_nikke_belorta_pumpkinwitch_04_42:
    speaker: "<Monologue>"
    en: the skeleton's eye sockets light up,
    ko: 해골 모형의 눈에서 불빛이 번쩍인다.
    ja: ガイコツの模型の目が光る
  d_nikke_belorta_pumpkinwitch_04_43:
    speaker: "<Monologue>"
    en: and the thing I'm touching is its hand.
    ko: 내 손에 닿은 건 해골 모형의 손이었다.
    ja: 私が触れたのは、ガイコツの模型の手だった
  d_nikke_belorta_pumpkinwitch_04_44:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_belorta_pumpkinwitch_04_45:
    speaker: "<Monologue>"
    en: Startled, I jerk my hand away.
    ko: 깜짝 놀라 손을 거둔다.
    ja: 驚いて手を引っ込める
  d_nikke_belorta_pumpkinwitch_04_46:
    speaker: "<Narration>"
    en: "*Flutter, flutter*"
    ko: 파다다닥-!
    ja: バサバサバサッ！
  d_nikke_belorta_pumpkinwitch_04_47:
    speaker: "<Monologue>"
    en: Something takes flight behind me.
    ko: 등 뒤에서 무언가 날아오르는 소리가 들린다.
    ja: 背後から何かが飛び立つ音が聞こえた
  d_nikke_belorta_pumpkinwitch_04_48:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_belorta_pumpkinwitch_04_49:
    speaker: "<Monologue>"
    en: I flinch, hunch my shoulders, and instinctively bolt forward.
    ko: 놀라서 나도 모르게 등을 움츠리며 앞으로 달려간다.
    ja: 驚いて思わず身をすくめ、前方へ走り出した
  d_nikke_belorta_pumpkinwitch_04_50:
    speaker: "<Monologue>"
    en: Then...
    ko: 그리고.
    ja: そして…
  d_nikke_belorta_pumpkinwitch_04_51:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 펑-!
    ja: バッ！
  d_nikke_belorta_pumpkinwitch_04_52:
    speaker: "<Monologue>"
    en: Something suddenly jumps out in front of me.
    ko: 내 앞으로 무언가가 튀어나왔다.
    ja: 目の前に何かが飛び出してきた
  d_nikke_belorta_pumpkinwitch_04_53:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_belorta_pumpkinwitch_04_54:
    speaker: "<Monologue>"
    en: I'm so startled that I freeze in my tracks.
    ko: 너무 놀라 그 자리에서 얼어버렸다.
    ja: あまりの驚きに、その場で固まってしまった
  d_nikke_belorta_pumpkinwitch_04_55:
    speaker: belorta_h
    en: Aww, c'mon, Old-Timer! What's with you? You're really not scared at all?
    ko: |-
      에이~ 아저씨 뭐야?
      하나도 안 놀라고 있는 거 맞지?
    ja: |-
      え～、ちょっとおじさん？
      ぜんぜん驚いてないでしょ？
  d_nikke_belorta_pumpkinwitch_04_56:
    speaker: belorta_h
    en: I haven't heard a single shriek!
    ko: 비명이 전혀 안 들려~
    ja: 悲鳴がまったく聞こえないよ～
  d_nikke_belorta_pumpkinwitch_04_57:
    speaker: "<Self>"
    en: I-I-I told you... I don't scare easily...
    ko: 내내내내가말했지? 잘안놀란다고.
    ja: い、い、い、言っただろ？あまり驚かないって
  d_nikke_belorta_pumpkinwitch_04_58:
    speaker: belorta_h
    en: Looks like I've got no choice!
    ko: 이렇게 된 이상 최후의 수단이야.
    ja: こうなったからには、最後の手段だね。
  d_nikke_belorta_pumpkinwitch_04_59:
    speaker: belorta_h
    en: Time to unleash my witchy trump card. I'll show you something really scary
      ♡
    ko: 마녀 비장의 카드, 진짜 무서운 걸 보여 줄게♡
    ja: |-
      魔女の最後の切り札、
      ホントに恐ろしいものを見せてあげる♡
  d_nikke_belorta_pumpkinwitch_04_60:
    speaker: "<Narration>"
    en: "*Click, click*"
    ko: 딸깍- 딸깍-
    ja: カチッ…カチッ…
  d_nikke_belorta_pumpkinwitch_04_61:
    speaker: belorta_h
    en: "... Huh?"
    ko: "…어라?"
    ja: "…あれ？"
  d_nikke_belorta_pumpkinwitch_04_62:
    speaker: belorta_h
    en: Why isn't it working?
    ko: 왜 작동이 안 되지?
    ja: なんで動かないんだろ？
  d_nikke_belorta_pumpkinwitch_04_63:
    speaker: "<Narration>"
    en: "*Click, click, click*"
    ko: 딸깍- 딸깍- 딸깍-
    ja: カチッ…カチッ…カチッ…
  d_nikke_belorta_pumpkinwitch_04_64:
    speaker: belorta_h
    en: Did you go poking around inside, Old-Timer?
    ko: 아저씨, 혹시 안에 있는 거 이것저것 건드렸어?
    ja: おじさん、もしかして中のものに触った？
  d_nikke_belorta_pumpkinwitch_04_65:
    speaker: "<Self>"
    en: Nope, I didn't touch anything.
    ko: 아니, 아무것도 안 만졌어.
    ja: いや、何も触っていない
  d_nikke_belorta_pumpkinwitch_04_66:
    speaker: "<Narration>"
    en: "*Clack*"
    ko: 덜그럭-
    ja: カタッ…
  d_nikke_belorta_pumpkinwitch_04_67:
    speaker: belorta_h
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_belorta_pumpkinwitch_04_68:
    speaker: belorta_h
    en: Wait, what was that?
    ko: 그럼 방금 저 소리는 뭐지?
    ja: じゃあ、さっきの音は何？
  d_nikke_belorta_pumpkinwitch_04_69:
    speaker: "<Narration>"
    en: "*Rattle, rattle*"
    ko: 덜그럭- 덜그럭-
    ja: カタカタ…
  d_nikke_belorta_pumpkinwitch_04_70:
    speaker: "<Self>"
    en: Isn't that one of the props you set up?
    ko: 벨로타가 설치한 장치 아니야?
    ja: ベロータが仕掛けた装置じゃないのか？
  d_nikke_belorta_pumpkinwitch_04_71:
    speaker: belorta_h
    en: But I, uh, didn't set anything up over there...
    ko: 저쪽에는 아무것도 설치 안 했는데….
    ja: あっちには何も仕掛けてないんだけど…
  d_nikke_belorta_pumpkinwitch_04_72:
    speaker: "<Narration>"
    en: "*Screeeeech*"
    ko: 덜그럭- 끼이이익….
    ja: カタッ…キィィィ…
  d_nikke_belorta_pumpkinwitch_04_73:
    speaker: belorta_h
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_belorta_pumpkinwitch_04_74:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_belorta_pumpkinwitch_04_75:
    speaker: "<Narration>"
    en: "*Crash! Bang!*"
    ko: 우당탕- 콰당-!
    ja: ドタバタッ、ドンッ！
  d_nikke_belorta_pumpkinwitch_04_76:
    speaker: "<Narration>"
    en: "*Whoomp!*"
    ko: 와락-!
    ja: ギュッ！
  d_nikke_belorta_pumpkinwitch_04_77:
    speaker: "<Monologue>"
    en: Belorta throws herself into my arms.
    ko: 벨로타가 내 품으로 뛰어드는 게 느껴진다.
    ja: ベロータが私の胸に飛び込んでくるのを感じた
  d_nikke_belorta_pumpkinwitch_04_78:
    speaker: belorta_h
    en: Eek!
    ko: 꺄아~
    ja: キャア～！
  d_nikke_belorta_pumpkinwitch_04_79:
    speaker: "<Self>"
    en: Aaaah!
    ko: 으아아악!
    ja: うわあああっ！
  d_nikke_belorta_pumpkinwitch_04_80:
    speaker: "<Monologue>"
    en: We instinctively cling to each other in fear.
    ko: 무서워 덩달아 끌어안아 버렸다.
    ja: |-
      怖くなり、つられてベロータを
      抱きしめてしまった
  d_nikke_belorta_pumpkinwitch_04_81:
    speaker: unknown
    en: Gah...!
    ko: 아야야….
    ja: いたた…
  d_nikke_belorta_pumpkinwitch_04_82:
    speaker: unknown
    en: Old-Timer? Belorta?
    ko: 아저씨…? 벨로타…?
    ja: おじさん…？ベロータ…？
  d_nikke_belorta_pumpkinwitch_04_83:
    speaker: "<Self>"
    en: I know that voice...
    ko: 이 목소리는….
    ja: この声は…
  d_nikke_belorta_pumpkinwitch_04_84:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵-
    ja: カチッ…
  d_nikke_belorta_pumpkinwitch_04_85:
    speaker: "<Monologue>"
    en: Belorta turns on a flashlight and shines it toward the voice.
    ko: 벨로타가 손전등을 켜 소리가 난 쪽을 비췄다.
    ja: |-
      ベロータが懐中電灯を点け、
      声のしたほうを照らした
  d_nikke_belorta_pumpkinwitch_04_86:
    speaker: "<Monologue>"
    en: A familiar face peeks out from behind a fallen shelf.
    ko: 쓰러진 선반 사이로 익숙한 얼굴이 보였다.
    ja: 倒れた棚の隙間から、見慣れた顔が見えた
  d_nikke_belorta_pumpkinwitch_04_87:
    speaker: mica
    en: I-I'm sorry for scaring you...
    ko: 우우… 놀라게 해드려서 죄송해요….
    ja: うぅ…驚かせてしまってごめんなさい…
  d_nikke_belorta_pumpkinwitch_04_88:
    speaker: mica
    en: I heard some weird noises coming from the storage room, so I came to check
      it out... and then I fell...
    ko: 창고 안에서 이상한 소리가 들리는 것 같아서 들어왔다가… 넘어져 버려서….
    ja: |-
      倉庫の中から変な音が聞こえた気がして
      入ってみたんですけど…転んでしまって…
  d_nikke_belorta_pumpkinwitch_04_89:
    speaker: belorta_h
    en: Aw man, it was only Mica?
    ko: 뭐야~ 미카였구나~
    ja: なーんだ、ミカだったの～
  d_nikke_belorta_pumpkinwitch_04_90:
    speaker: belorta_h
    en: I thought I was gonna see a real ghost!
    ko: 진짜 유령인 줄 알고 기대했잖아~
    ja: 本物の幽霊かと思って期待しちゃった～
  d_nikke_belorta_pumpkinwitch_04_91:
    speaker: "<Self>"
    en: Weren't you scared?
    ko: 무서워했던 거 아냐?
    ja: 怖がってたんじゃないのか？
  d_nikke_belorta_pumpkinwitch_04_92:
    speaker: belorta_h
    en: Who, me? Nuh-uh!
    ko: 아닌데~?
    ja: 違うもん～
  d_nikke_belorta_pumpkinwitch_04_93:
    speaker: "<Self>"
    en: Then why did you cling to me?
    ko: 그럼 왜 안긴 거야?
    ja: じゃあ、どうして抱きついてきたんだ？
  d_nikke_belorta_pumpkinwitch_04_94:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵-
    ja: カチッ…
  d_nikke_belorta_pumpkinwitch_04_95:
    speaker: "<Self>"
    en: Aaaah!
    ko: 으아아악!
    ja: うわあああっ！
  d_nikke_belorta_pumpkinwitch_04_96:
    speaker: "<Monologue>"
    en: My shriek plays from a voice recorder.
    ko: 녹음기에서 내 비명소리가 재생된다.
    ja: レコーダーから私の悲鳴が再生された
  d_nikke_belorta_pumpkinwitch_04_97:
    speaker: "<Self>"
    en: Oh...
    ko: 아….
    ja: あ…
  d_nikke_belorta_pumpkinwitch_04_98:
    speaker: belorta_h
    en: We needed the sound of your heart pounding and your shrieks ♡
    ko: 사역마의 심장 소리랑 비명 모으려구♡
    ja: 使い魔の心臓の音と悲鳴を集めるためだよ♡
  d_nikke_belorta_pumpkinwitch_04_99:
    speaker: belorta_h
    en: Thanks to Mica, we got everything we needed!
    ko: 그래도 미카 덕분에 다 모았네?
    ja: でも、ミカのおかげで全部集まったね？
  d_nikke_belorta_pumpkinwitch_04_100:
    speaker: belorta_h
    en: Thanks, you two! ♡
    ko: 고마워~ 둘 다♡
    ja: ありがと～、2人とも♡
d_nikke_belorta_pumpkinwitch_05:
  d_nikke_belorta_pumpkinwitch_05_1:
    speaker: "<Monologue>"
    en: |-
      After the "fun" in the storage room is over,
      Belorta and I head back to the Toy Store.
    ko: |-
      창고에서의 난리가 일단락된 후,
      벨로타와 나는 다시 장난감 가게로 돌아왔다.
    ja: |-
      倉庫での騒ぎが一段落した後、
      ベロータと私は再びおもちゃ屋に戻った
  d_nikke_belorta_pumpkinwitch_05_2:
    speaker: belorta_h
    en: Now that we have all the ingredients,
    ko: 이제 재료는 다 모였으니까~
    ja: これで素材は一通り集まったから～
  d_nikke_belorta_pumpkinwitch_05_3:
    speaker: belorta_h
    en: all that's left is to brew the magic potion! ♡
    ko: 마법약을 만들기만 하면 돼♡
    ja: あとは魔法薬を作るだけだね♡
  d_nikke_belorta_pumpkinwitch_05_4:
    speaker: "<Self>"
    en: How are you going to do that?
    ko: 어떻게 만들게?
    ja: どうやって作るんだ？
  d_nikke_belorta_pumpkinwitch_05_5:
    speaker: belorta_h
    en: Ta-da! ♡
    ko: 짜잔♡
    ja: ジャーン♡
  d_nikke_belorta_pumpkinwitch_05_6:
    speaker: belorta_h
    en: I've got everything ready, so I'm gonna brew it in this cauldron here.
    ko: 다 준비해 뒀지~ 여기 이 솥으로 만들 거야.
    ja: |-
      全部準備してあるんだ～
      この釜で作るの。
  d_nikke_belorta_pumpkinwitch_05_7:
    speaker: belorta_h
    en: Don't come any closer, Old-Timer!
    ko: 가까이 오면 안 돼~!
    ja: あ、近づいちゃダメだよ～！
  d_nikke_belorta_pumpkinwitch_05_8:
    speaker: belorta_h
    en: You might ruin the magic!
    ko: 마법 효능이 떨어질 수 있으니까!
    ja: 魔法の効果が薄れちゃうかもしれないから！
  d_nikke_belorta_pumpkinwitch_05_9:
    speaker: "<Monologue>"
    en: Belorta stands over a small cauldron and starts adding the ingredients one
      by one.
    ko: 작은 솥단지 앞에 선 벨로타가 재료를 하나씩 넣기 시작한다.
    ja: |-
      小さな釜の前に立ったベロータは
      素材を1つずつ入れ始めた
  d_nikke_belorta_pumpkinwitch_05_10:
    speaker: "<Monologue>"
    en: Candy, chocolate, pumpkin, tears, a sigh, a heartbeat, a shriek...
    ko: 사탕, 초콜릿, 호박, 눈물, 한숨, 심장 소리, 비명….
    ja: |-
      キャンディ、チョコレート、カボチャ、
      涙、ため息、心臓の音、悲鳴…
  d_nikke_belorta_pumpkinwitch_05_11:
    speaker: "<Monologue>"
    en: Belorta tips the vial containing the sigh into the cauldron and plays the
      recording of my heartbeat and shriek. The whole thing is downright bizarre.
    ko: |-
      한숨이 담긴 빈 병을 기울이고,
      심장 소리, 비명이 담긴 녹음기를 재생하는 모습은 그야말로 기묘했다.
    ja: |-
      ため息の入った空き瓶を傾け、
      心臓の音と悲鳴が録音されたレコーダーを
      再生する姿は、奇妙な光景だった
  d_nikke_belorta_pumpkinwitch_05_12:
    speaker: "<Monologue>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_belorta_pumpkinwitch_05_13:
    speaker: "<Monologue>"
    en: A sweet smell begins to fill the Toy Store.
    ko: 달콤한 향기가 가게 안에 퍼지기 시작했다.
    ja: 甘い香りが店内に漂い始めた
  d_nikke_belorta_pumpkinwitch_05_14:
    speaker: belorta_h
    en: Aaand we're done! ♡
    ko: 됐다~ 완성이야♡
    ja: できた～、完成♡
  d_nikke_belorta_pumpkinwitch_05_15:
    speaker: belorta_h
    en: I call it the "Lovey-Dovey Potion"!
    ko: 무려 [사랑의 마법약] 이라구~
    ja: なんと「愛の魔法薬」だよ～
  d_nikke_belorta_pumpkinwitch_05_16:
    speaker: "<Self>"
    en: Lovey-Dovey Potion?
    ko: 사랑의 마법약?
    ja: 愛の魔法薬？
  d_nikke_belorta_pumpkinwitch_05_17:
    speaker: belorta_h
    en: Yeah, it says right here
    ko: 응, 여기에 뭐라 쓰여있냐 하면~
    ja: うん、ここに書いてあるんだけど～
  d_nikke_belorta_pumpkinwitch_05_18:
    speaker: belorta_h
    en: that whoever drinks it will think about the other all day long.
    ko: 마신 사람이 하루 종일 상대방 생각만 하게 되는 약, 이래!
    ja: |-
      「飲んだ人が一日中、
      相手のことばかり考えちゃう薬」だって！
  d_nikke_belorta_pumpkinwitch_05_19:
    speaker: belorta_h
    en: Pretty amazing, huh? The color and smell are perfect, too!
    ko: 굉장하지~? 색도 향도 완벽해!
    ja: すごいでしょ～？色も香りもカンペキ！
  d_nikke_belorta_pumpkinwitch_05_20:
    speaker: belorta_h
    en: Well then, bottoms up!
    ko: 그럼, 어디 한번~
    ja: どれどれ～
  d_nikke_belorta_pumpkinwitch_05_21:
    speaker: "<Monologue>"
    en: Belorta pours the potion into a cup and downs it in one gulp.
    ko: 벨로타가 컵에 마법약을 따라 단숨에 마셔버린다.
    ja: |-
      ベロータはコップに魔法薬を注ぐと、
      一気に飲み干してしまった
  d_nikke_belorta_pumpkinwitch_05_22:
    speaker: belorta_h
    en: Mmm, this is so sweet ♡
    ko: 푸하~ 달다, 달아♡
    ja: ぷは～、すっごく甘いね♡
  d_nikke_belorta_pumpkinwitch_05_23:
    speaker: "<Self>"
    en: "...?!"
    ko: "…?!"
    ja: "…！？"
  d_nikke_belorta_pumpkinwitch_05_24:
    speaker: "<Self>"
    en: Why'd you drink it, Belorta?
    ko: 그걸 왜 벨로타가 마셔?
    ja: なぜベロータが飲むんだ？
  d_nikke_belorta_pumpkinwitch_05_25:
    speaker: belorta_h
    en: I gotta see what it does.
    ko: 효과를 시험해 봐야지.
    ja: 効果を試してみなきゃ。
  d_nikke_belorta_pumpkinwitch_05_26:
    speaker: belorta_h
    en: I made it, so of course I wanna know!
    ko: 내가 만든 거니까, 궁금하잖아~
    ja: |-
      自分で作ったんだから、
      気になるに決まってるでしょ～
  d_nikke_belorta_pumpkinwitch_05_27:
    speaker: "<Self>"
    en: So, does it work?
    ko: 그래서 어때? 효과가 있는 것 같아?
    ja: それで、どうだ？効果はありそうか？
  d_nikke_belorta_pumpkinwitch_05_28:
    speaker: belorta_h
    en: Hmm...
    ko: 음~
    ja: う～ん。
  d_nikke_belorta_pumpkinwitch_05_29:
    speaker: "<Monologue>"
    en: Belorta tilts her head.
    ko: 벨로타가 고개를 갸웃한다.
    ja: ベロータは首をかしげた
  d_nikke_belorta_pumpkinwitch_05_30:
    speaker: belorta_h
    en: I dunno.
    ko: 잘 모르겠어.
    ja: よく分かんない。
  d_nikke_belorta_pumpkinwitch_05_31:
    speaker: "<Self>"
    en: Looks like it failed?
    ko: 실패인 것 같아?
    ja: 失敗か？
  d_nikke_belorta_pumpkinwitch_05_32:
    speaker: belorta_h
    en: I didn't say that!
    ko: 아니~ 그게 아니라.
    ja: ううん～、そうじゃなくて。
  d_nikke_belorta_pumpkinwitch_05_33:
    speaker: belorta_h
    en: It's just that I've been right beside you, thinking about you all day,
    ko: 오늘 하루 종일 아저씨 옆에서 아저씨 생각만 했으니까~
    ja: |-
      今日一日、おじさんの隣で
      おじさんのことばかり考えてたから～
  d_nikke_belorta_pumpkinwitch_05_34:
    speaker: belorta_h
    en: so I can't really tell if it's working or not, hehe ♡
    ko: 효과가 있는지 없는지, 잘 모르겠다는 이야기야♡
    ja: |-
      効果があるのかないのか、
      よく分かんないってこと♡
  d_nikke_belorta_pumpkinwitch_05_35:
    speaker: "<Self>"
    en: "...!"
    ko: "…!"
    ja: "……！"
  d_nikke_belorta_pumpkinwitch_05_36:
    speaker: belorta_h
    en: Wanna try some, Old-Timer?
    ko: 아저씨도 마셔볼래?
    ja: おじさんも飲んでみる？
  d_nikke_belorta_pumpkinwitch_05_37:
    speaker: "<Monologue>"
    en: Belorta hands me a cup containing the potion.
    ko: 벨로타가 건넨, 마법약이 담긴 컵을 받았다.
    ja: |-
      ベロータが差し出した
      魔法薬の入ったカップを受け取り
  d_nikke_belorta_pumpkinwitch_05_38:
    speaker: "<Monologue>"
    en: I drink the liquid, which smells like hot cocoa.
    ko: 핫초코향이 나는 액체를 마신다.
    ja: ココアの香りがする液体を飲んだ
  d_nikke_belorta_pumpkinwitch_05_39:
    speaker: "<Narration>"
    en: "*Gulp*"
    ko: 꿀꺽-
    ja: ゴクッ…
  d_nikke_belorta_pumpkinwitch_05_40:
    speaker: "<Monologue>"
    en: It's incredibly sweet.
    ko: 달다, 굉장히.
    ja: ものすごく甘い…
  d_nikke_belorta_pumpkinwitch_05_41:
    speaker: belorta_h
    en: How is it?
    ko: 어때?
    ja: どう？
  d_nikke_belorta_pumpkinwitch_05_42:
    speaker: belorta_h
    en: Can you feel it working?
    ko: 아저씨는 효과가 있는 것 같아?
    ja: おじさんには、効果ありそう？
  d_nikke_belorta_pumpkinwitch_05_43:
    speaker: "<Self>"
    en: "... I don't really know."
    ko: "…나도 잘 모르겠네."
    ja: "…私もよく分からない"
  d_nikke_belorta_pumpkinwitch_05_44:
    speaker: "<Self>"
    en: I feel the same as you.
    ko: 벨로타랑 똑같아.
    ja: ベロータと同じだ
  d_nikke_belorta_pumpkinwitch_05_45:
    speaker: belorta_h
    en: Really? I'm happy to hear it, hehe.
    ko: 진짜로? 기뻐~
    ja: ホントに？嬉しい～
  d_nikke_belorta_pumpkinwitch_05_46:
    speaker: belorta_h
    en: Now that we're done making the magic potion,
    ko: 그럼 마법약 만들기도 끝났고~
    ja: じゃあ、魔法薬作りも終わったことだし～
  d_nikke_belorta_pumpkinwitch_05_47:
    speaker: belorta_h
    en: and you've been keeping me company all day,
    ko: 아저씨가 오늘 하루 종일 나랑 놀아주느라 고생했으니까~
    ja: |-
      おじさんは一日中、
      私と遊んで頑張ったから～
  d_nikke_belorta_pumpkinwitch_05_48:
    speaker: belorta_h
    en: I guess I owe you a little reward.
    ko: 보수는 줘야지.
    ja: 報酬をあげなきゃね。
  d_nikke_belorta_pumpkinwitch_05_49:
    speaker: belorta_h
    en: 'Article 10 of our contract: If the familiar faithfully fulfills their duties,
      the witch shall provide ■■ as compensation.'
    ko: |-
      계약서 제10조.
      사역마가 자신의 역할을 충실히 이행한 경우, 마녀는 보수로 ■■를 지급한다.
    ja: |-
      契約書第10条。
      使い魔が自身の役割を忠実に果たした場合、
      魔女は報酬として■■を支給する。
  d_nikke_belorta_pumpkinwitch_05_50:
    speaker: belorta_h
    en: And the reward hidden here is...
    ko: 여기 가려진 보수가 뭐였냐 하면~
    ja: この報酬が何かっていうと～
  d_nikke_belorta_pumpkinwitch_05_51:
    speaker: "<Narration>"
    en: "*Mwah*"
    ko: 쪽-
    ja: チュッ
  d_nikke_belorta_pumpkinwitch_05_52:
    speaker: belorta_h
    en: But once isn't enough, you know.
    ko: 한 번으로는 아쉬우니까~
    ja: 1回じゃ物足りないから～
  d_nikke_belorta_pumpkinwitch_05_53:
    speaker: "<Narration>"
    en: "*Smooch, smooch*"
    ko: 쪽, 쪽-
    ja: チュッ、チュッ――
  d_nikke_belorta_pumpkinwitch_05_54:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_belorta_pumpkinwitch_05_55:
    speaker: "<Monologue>"
    en: Belorta gives me a playful smile before scampering off toward the door.
    ko: 벨로타가 장난스레 웃으며 문 쪽으로 도망갔다.
    ja: |-
      ベロータがいたずらっぽく笑いながら、
      ドアのほうへと逃げていった
  d_nikke_belorta_pumpkinwitch_05_56:
    speaker: belorta_h
    en: Oh right, I almost forgot!
    ko: 아, 맞다! 하나 깜빡했는데~
    ja: あ、そうだ！一つ言い忘れてたんだけど～
  d_nikke_belorta_pumpkinwitch_05_57:
    speaker: belorta_h
    en: The Familiar Contract automatically renews ♡
    ko: 사역마 계약, 사실 자동 갱신제거든♡
    ja: 使い魔の契約、実は自動更新制なの♡
  d_nikke_belorta_pumpkinwitch_05_58:
    speaker: belorta_h
    en: So you'll be my familiar next Halloween, and the Halloween after that, too...
    ko: 내년 할로윈도, 내후년 할로윈도.
    ja: 来年のハロウィンも、再来年のハロウィンも。
  d_nikke_belorta_pumpkinwitch_05_59:
    speaker: belorta_h
    en: Which means you'll be my familiar foreeeever!
    ko: 아저씨는 계~속 내 사역마라는 뜻이야.
    ja: おじさんは、ず～っと私の使い魔ってこと。
  d_nikke_belorta_pumpkinwitch_05_60:
    speaker: belorta_h
    en: You'd better be ready, Old-Timer ♡
    ko: 그러니까 각오해 둬, 아저씨♡
    ja: だから覚悟しておいてね、おじさん♡
  d_nikke_belorta_pumpkinwitch_05_61:
    speaker: "<Narration>"
    en: "*Jingle!*"
    ko: 딸랑-!
    ja: チリーン！
  d_nikke_belorta_pumpkinwitch_05_62:
    speaker: "<Monologue>"
    en: Belorta disappears into the Toy Store, leaving only the sweet smell of hot
      cocoa behind.
    ko: 벨로타가 사라진 가게 안에 달콤한 핫초코 향기만이 남았다.
    ja: |-
      ベロータが去った店内には、
      甘いココアの香りだけが漂っていた
  d_nikke_belorta_pumpkinwitch_05_63:
    speaker: "<Monologue>"
    en: I read over the contract one more time,
    ko: 혹시나 하는 마음에 계약서를 다시 읽어 내려가자,
    ja: |-
      ひょっとしてと思い、
      契約書を読み直してみると、
  d_nikke_belorta_pumpkinwitch_05_64:
    speaker: "<Monologue>"
    en: and find another sentence in fine print beneath Article 10.
    ko: 제10조 아래, 작은 글씨로 문장이 하나 더 적혀 있었다.
    ja: |-
      第10条の下に、小さな文字で
      文章が書かれていた
  d_nikke_belorta_pumpkinwitch_05_65:
    speaker: "<Monologue>"
    en: '"If the reward is satisfactory, this contract will automatically renew next
      Halloween ♡"'
    ko: "[단, 보수가 마음에 들었을 경우, 본 계약은 다음 할로윈에 자동으로 갱신된다♡]"
    ja: |-
      「ただし、報酬を気に入ってもらえた場合、
      本契約は次のハロウィンに自動更新される♡」
  d_nikke_belorta_pumpkinwitch_05_66:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_belorta_pumpkinwitch_05_67:
    speaker: "<Monologue>"
    en: Looks like the contract will renew automatically after all.
    ko: 아무래도 계약은 자동으로 갱신될 것 같다.
    ja: どうやら契約は自動更新されることになりそうだ
