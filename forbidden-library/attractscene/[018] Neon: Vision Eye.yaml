---
d_nikke_neon_visioneye_01:
  d_nikke_neon_visioneye_01_1:
    speaker: "<Monologue>"
    en: One peaceful afternoon...
    ko: 평화로운 오후.
    ja: のどかな昼下がりだ
  d_nikke_neon_visioneye_01_2:
    speaker: "<Monologue>"
    en: I finally finish the backlog of work I'd had been putting off.
    ko: "…지금까지 미뤄 놓았던 일들을 드디어 다 처리했다."
    ja: |-
      …先延ばしにしていた仕事が
      ようやく全部片付いた
  d_nikke_neon_visioneye_01_3:
    speaker: "<Monologue>"
    en: Time to sit back and enjoy some peace and—
    ko: 이제 편안하게 여유를 만끽하며 좀 쉴….
    ja: これで心置きなく休め…
  d_nikke_neon_visioneye_01_4:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_neon_visioneye_01_5:
    speaker: "<Monologue>"
    en: "... Never mind. Why did I even get my hopes up?"
    ko: |-
      …수 없겠구나.
      그럼 그렇지.
    ja: |-
      …るはずもない。
      いつものことだ
  d_nikke_neon_visioneye_01_6:
    speaker: neon_v
    en: Master!
    ko: 스승님!
    ja: 師匠！
  d_nikke_neon_visioneye_01_7:
    speaker: "<Self>"
    en: Neon?
    ko: 네온?
    ja: ネオン？
  d_nikke_neon_visioneye_01_8:
    speaker: neon_v
    en: Are you busy right now?
    ko: 혹시 지금 바쁘신가요?
    ja: 今、お忙しいですか？
  d_nikke_neon_visioneye_01_9:
    speaker: "<Self>"
    en: "... No, not exactly."
    ko: "…아니, 딱히 바쁘진 않아."
    ja: "…いや、特に用事はない"
  d_nikke_neon_visioneye_01_10:
    speaker: neon_v
    en: I knew it! I figured you'd be free right around now.
    ko: |-
      와, 역시!
      스승님이라면 지금쯤 한가하실 줄 알았어요.
    ja: |-
      やっぱり！
      師匠ならヒマしてる頃だろうと思いました。
  d_nikke_neon_visioneye_01_11:
    speaker: "<Self>"
    en: "... What brings you here? Are you here to hang out?"
    ko: |-
      …지휘관실엔 무슨 일이야?
      놀러 온 거야?
    ja: |-
      …指揮官室に何の用だ？
      遊びにきただけか？
  d_nikke_neon_visioneye_01_12:
    speaker: neon_v
    en: Nope.
    ko: 아뇨.
    ja: いいえ。
  d_nikke_neon_visioneye_01_13:
    speaker: neon_v
    en: I'm here because I have a favor to ask.
    ko: 부탁드릴 게 있어서 왔어요.
    ja: お願いがあって来ました。
  d_nikke_neon_visioneye_01_14:
    speaker: "<Self>"
    en: What is it?
    ko: 무슨 부탁?
    ja: お願い？
  d_nikke_neon_visioneye_01_15:
    speaker: neon_v
    en: Will you go to the Outer Rim with me?
    ko: 혹시 저랑 같이 아우터 림에 가주실 수 있나요?
    ja: アウターリムに付き添っていただけませんか？
  d_nikke_neon_visioneye_01_16:
    speaker: "<Self>"
    en: "... The Outer Rim? Why?"
    ko: "…아우터 림에? 왜?"
    ja: "…アウターリムに？なぜだ？"
  d_nikke_neon_visioneye_01_17:
    speaker: neon_v
    en: Don't freak out,
    ko: "…듣고 놀라지 마세요."
    ja: "…聞いて驚かないでくださいね。"
  d_nikke_neon_visioneye_01_18:
    speaker: neon_v
    en: but I finally found the Legendary Gun we've been looking for!
    ko: |-
      스승님과 그렇게 찾아 헤매던
      전설의 총을 드디어 찾았거든요!
    ja: |-
      師匠とあれほど探し求めていた
      伝説の銃がついに見つかったんです！
  d_nikke_neon_visioneye_01_19:
    speaker: "<Self>"
    en: Really?!
    ko: "…정말?!"
    ja: "…本当か！？"
  d_nikke_neon_visioneye_01_20:
    speaker: neon_v
    en: Just kidding.
    ko: 는 뻥이고요.
    ja: "…というのはウソで。"
  d_nikke_neon_visioneye_01_21:
    speaker: "<Self>"
    en: Hmph.
    ko: 응.
    ja: "…"
  d_nikke_neon_visioneye_01_22:
    speaker: neon_v
    en: You've already heard about my past so you should know...
    ko: 스승님도 제 과거 이야기를 들어서 아시다시피.
    ja: |-
      師匠にはもう、
      昔の私のことをお話していますが…
  d_nikke_neon_visioneye_01_23:
    speaker: neon_v
    en: I was really weak back when I was still a human.
    ko: 제가 인간이었을 때, 몸이 많이 약했잖아요.
    ja: |-
      私って人間だった頃、
      体がすごく弱かったんですよね。
  d_nikke_neon_visioneye_01_24:
    speaker: "<Self>"
    en: Right...
    ko: "…그렇지."
    ja: "…そうらしいな"
  d_nikke_neon_visioneye_01_25:
    speaker: neon_v
    en: But look at me now.
    ko: 그런데 지금은 어떻죠?
    ja: 今の私のこと、どう思います？
  d_nikke_neon_visioneye_01_26:
    speaker: "<Choice>"
    en: You're even healthier?
    ko: 더 건강해졌지?
    ja: さらに健康体になった
  d_nikke_neon_visioneye_01_27:
    speaker: "<Choice>"
    en: You're even stronger?
    ko: 더 강해졌지?
    ja: さらに強くなった
  d_nikke_neon_visioneye_01_28:
    speaker: neon_v
    en: Yup, exactly!
    ko: 예, 맞아요!
    ja: その通りです！
  d_nikke_neon_visioneye_01_29:
    speaker: neon_v
    en: I've been reborn as hyper-technological Neo-Neon.
    ko: 초 오버-테크놀로지 네오-네온으로 재탄생되었죠.
    ja: |-
      超オーバーテクノロジーの結晶、
      ネオ・ネオンとして生まれ変わりました。
  d_nikke_neon_visioneye_01_30:
    speaker: neon_v
    en: To be honest, I was already pretty healthy when I became a Nikke,
    ko: 사실 니케가 됐을 때도 이미 건강하긴 했지만.
    ja: |-
      最初にニケになった時点で、
      もともと健康にはなっていましたが…
  d_nikke_neon_visioneye_01_31:
    speaker: neon_v
    en: but you could say I became even healthier after getting my new body!
    ko: 새 바디를 받고 더 건강해졌다고 볼 수 있죠!
    ja: |-
      新しいボディを手に入れて、
      さらに健康になったというわけです！
  d_nikke_neon_visioneye_01_32:
    speaker: neon_v
    en: I did grow stronger, but I also became even healthier!
    ko: 강해진 것도 맞지만, 더 건강해졌다고 볼 수 있죠!
    ja: |-
      強くなったのもそうですが、
      さらに健康になったんです！
  d_nikke_neon_visioneye_01_33:
    speaker: neon_v
    en: Because I've been reborn as hyper-technological Neo-Neon.
    ko: 초 오버-테크놀로지 네오-네온으로 재탄생되었으니까요.
    ja: |-
      超オーバーテクノロジーの結晶、
      ネオ・ネオンに生まれ変わりましたから。
  d_nikke_neon_visioneye_01_34:
    speaker: neon_v
    en: So now that I'm healthy, I'd like to visit the place where I used to live.
    ko: |-
      그래서 지금 건강한 상태로
      제가 예전에 살았던 곳을 한번 가보고 싶어요.
    ja: |-
      それで、今の健康な体で
      以前暮らしていた場所に
      行ってみたくなったんです。
  d_nikke_neon_visioneye_01_35:
    speaker: neon_v
    en: Where I lived, and where I worked...
    ko: 과거에 지냈던 곳도 그렇고, 일했던 곳도요.
    ja: 住んでいたところも、働いていたところも…
  d_nikke_neon_visioneye_01_36:
    speaker: neon_v
    en: I haven't been back there since that day.
    ko: 그날 이후로 직접 다시 가본 적은 없거든요.
    ja: あの日から、一度も足を運んでいません。
  d_nikke_neon_visioneye_01_37:
    speaker: neon_v
    en: My memories are still so vivid, it's made me a little curious.
    ko: 기억만 생생하다 보니 조금 궁금해져서요.
    ja: |-
      記憶がハッキリ戻ってきてから
      頭を離れないんです。
  d_nikke_neon_visioneye_01_38:
    speaker: neon_v
    en: I wonder how it's all changed.
    ko: 지금은 어떻게 변했을지.
    ja: 今あそこが、どうなっているのか。
  d_nikke_neon_visioneye_01_39:
    speaker: "<Self>"
    en: Going there shouldn't be a problem,
    ko: "…가는 건 문제없는데."
    ja: "…行くのは構わないが"
  d_nikke_neon_visioneye_01_40:
    speaker: "<Self>"
    en: but do you remember the way?
    ko: 길 같은 건 다 기억나?
    ja: 場所は分かっているのか？
  d_nikke_neon_visioneye_01_41:
    speaker: neon_v
    en: Yeap! You don't have to worry about that.
    ko: 예! 그건 걱정 안 하셔도 돼요.
    ja: はい！その点は心配ご無用です。
  d_nikke_neon_visioneye_01_42:
    speaker: neon_v
    en: So you'll come with me?
    ko: 같이 가주실 거죠?
    ja: 一緒に行っていただけますよね？
  d_nikke_neon_visioneye_01_43:
    speaker: "<Self>"
    en: Sure, let's go.
    ko: 그래, 가보자.
    ja: 分かった、行こう
  d_nikke_neon_visioneye_01_44:
    speaker: neon_v
    en: Yay!
    ko: 야호!
    ja: やった～！
  d_nikke_neon_visioneye_01_45:
    speaker: neon_v
    en: Thanks, Master.
    ko: 감사해요, 스승님.
    ja: ありがとうございます、師匠。
  d_nikke_neon_visioneye_01_46:
    speaker: "<Monologue>"
    en: As soon as we enter the Outer Rim, people nearby start stealing glances at
      us.
    ko: |-
      아우터 림으로 들어서자,
      근처에 있던 사람들이 우리를 힐끔 쳐다봤다.
    ja: |-
      アウターリムに足を踏み入れてから、
      あたりの人々にひそかな視線を
      向けられ続けている
  d_nikke_neon_visioneye_01_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_01_48:
    speaker: "<Self>"
    en: What was it like living in the Outer Rim?
    ko: "…아우터 림에 살았을 때 어땠어?"
    ja: |-
      …アウターリムに住んでいた頃は
      どうだったんだ？
  d_nikke_neon_visioneye_01_49:
    speaker: neon_v
    en: Hmm...
    ko: 음….
    ja: そうですね…
  d_nikke_neon_visioneye_01_50:
    speaker: neon_v
    en: It was actually kind of fun.
    ko: 나름 재밌었어요.
    ja: それなりに楽しんでいました。
  d_nikke_neon_visioneye_01_51:
    speaker: "<Self>"
    en: Fun?
    ko: 재밌었어?
    ja: 楽しかった？
  d_nikke_neon_visioneye_01_52:
    speaker: neon_v
    en: Yeah.
    ko: 예.
    ja: はい。
  d_nikke_neon_visioneye_01_53:
    speaker: neon_v
    en: There were so many good people in my life.
    ko: 주변에 좋은 사람들이 많았거든요.
    ja: 周りがみんないい人ばかりでしたから。
  d_nikke_neon_visioneye_01_54:
    speaker: neon_v
    en: We didn't have much, but we shared what we had.
    ko: 다들 가진 건 많지 않았지만, 서로 나눠 쓰면서 살았죠.
    ja: |-
      みんな足りないものばかりでしたけど、
      お互いに分け合いながら暮らしていました。
  d_nikke_neon_visioneye_01_55:
    speaker: neon_v
    en: Once a month, we'd even have a day where we bartered our goods.
    ko: 한 달에 한 번씩 물물교환 하는 날도 있었는데.
    ja: 月に一度、物々交換をする日があったんです。
  d_nikke_neon_visioneye_01_56:
    speaker: neon_v
    en: Everyone would get really excited whenever that time came around.
    ko: 그날이 오면 모두가 엄청 들떠 있었어요.
    ja: その日にはみんな浮かれていました。
  d_nikke_neon_visioneye_01_57:
    speaker: neon_v
    en: You could get food there that was hard to come by in the Outer Rim.
    ko: 아우터 림에서는 먹기 힘든 음식을 구할 수 있었거든요.
    ja: |-
      アウターリムでは滅多にありつけない
      ぜいたく品が、その日だけは手に入るので。
  d_nikke_neon_visioneye_01_58:
    speaker: "<Self>"
    en: Like what?
    ko: 어떤 음식?
    ja: どんな物だ？
  d_nikke_neon_visioneye_01_59:
    speaker: neon_v
    en: Nutrium.
    ko: 배양육이죠.
    ja: 培養肉です。
  d_nikke_neon_visioneye_01_60:
    speaker: neon_v
    en: You could only get Nutrium if you were really lucky, or on special occasions.
    ko: |-
      배양육은 진짜 운이 좋거나
      특별한 날에나 먹을 수 있었거든요.
    ja: |-
      本当に運がいい時や、
      特別な日にしか食べられません。
  d_nikke_neon_visioneye_01_61:
    speaker: "<Self>"
    en: Then what did you normally eat?
    ko: "…그럼 평소엔 뭘 먹었어?"
    ja: "…普段は何を食べていたんだ？"
  d_nikke_neon_visioneye_01_62:
    speaker: neon_v
    en: Somebody else's half-eaten bread.
    ko: 누가 먹다 남긴 빵이요.
    ja: 誰かの食べ残しのパンか…
  d_nikke_neon_visioneye_01_63:
    speaker: neon_v
    en: Or expired Splendamin.
    ko: 아니면 유통기한 지난 퍼펙트.
    ja: 賞味期限切れのパーフェクトか。
  d_nikke_neon_visioneye_01_64:
    speaker: neon_v
    en: I basically lived off that stuff.
    ko: 그게 거의 주식이었죠.
    ja: そのあたりが多かったです。
  d_nikke_neon_visioneye_01_65:
    speaker: neon_v
    en: There was also this bread soaked in some kind of sketchy sauce. That was the
      best.
    ko: |-
      그중에서도 수상한 소스에 절여진 빵이 있었는데요.
      그게 정말 맛있었어요.
    ja: |-
      とくにおいしかったものと言えば、
      怪しいソース漬けのパンですね。
  d_nikke_neon_visioneye_01_66:
    speaker: neon_v
    en: Too bad I never figured out what that sauce was.
    ko: 지금도 그 소스가 뭐였는지 몰라서  조금 아쉽지만.
    ja: |-
      あのソースの正体が今でも分からなくて、
      ちょっと残念です。
  d_nikke_neon_visioneye_01_67:
    speaker: neon_v
    en: All I know is it was really tasty.
    ko: 그래도 정말 맛있었던 걸로 기억해요.
    ja: |-
      それでも、すごくおいしかったことだけは
      よく覚えています。
  d_nikke_neon_visioneye_01_68:
    speaker: "<Self>"
    en: It was that good, huh?
    ko: "…그 정도야?"
    ja: "…そこまで言うほどか？"
  d_nikke_neon_visioneye_01_69:
    speaker: neon_v
    en: Yeah!
    ko: 예!
    ja: はい！
  d_nikke_neon_visioneye_01_70:
    speaker: neon_v
    en: If you tried it, I'm sure you'd like it just as much as I did.
    ko: 스승님도 드셔보시면 분명 맛있다고 하실걸요?
    ja: |-
      師匠も食べたらきっと
      おいしいって言うと思いますよ？
  d_nikke_neon_visioneye_01_71:
    speaker: "<Self>"
    en: Now I'm curious what it tastes like.
    ko: 어떤 맛인지 궁금하긴 하네.
    ja: どんな味がするのか気になるな
  d_nikke_neon_visioneye_01_72:
    speaker: neon_v
    en: If I ever get my hands on some, you'll be the first one I share it with!
    ko: 언젠가 구하게 되면 꼭 스승님께 먼저 드릴게요!
    ja: |-
      もし手に入ったら、
      真っ先に師匠に分けて差し上げますね！
  d_nikke_neon_visioneye_01_73:
    speaker: "<Self>"
    en: Thanks...
    ko: "…고마워."
    ja: "…ありがとう"
  d_nikke_neon_visioneye_01_74:
    speaker: "<Self>"
    en: Didn't you say your personality was pretty different back then?
    ko: 성격도 지금이랑 많이 달랐다고 했었지?
    ja: 性格も今とは全然違ったと言っていたな？
  d_nikke_neon_visioneye_01_75:
    speaker: neon_v
    en: Completely different.
    ko: 완전히요.
    ja: ええ、まったく。
  d_nikke_neon_visioneye_01_76:
    speaker: neon_v
    en: Compared to what I'm like now... I was basically a whole other person.
    ko: "지금이랑 비교하면… \n거의 다른 사람이라고 봐도 될걸요?"
    ja: |-
      今と比べたら…
      見分けがつかないと思いますよ？
  d_nikke_neon_visioneye_01_77:
    speaker: neon_v
    en: Back then,
    ko: 그때의 저는 말이죠.
    ja: あの頃の私は…そうですね。
  d_nikke_neon_visioneye_01_78:
    speaker: neon_v
    en: I was quiet, calm, serious, and decisive...
    ko: 조용하고, 차분하고, 진중하고, 똑 부러지고….
    ja: |-
      大人しくて、冷静で、
      まじめで、しっかりしていて…
  d_nikke_neon_visioneye_01_79:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_01_80:
    speaker: neon_v
    en: Hang on, Master.
    ko: 잠시만요, 스승님.
    ja: 待ってください、師匠。
  d_nikke_neon_visioneye_01_81:
    speaker: neon_v
    en: What's with that look on your face?
    ko: 그 표정은 뭔가요?
    ja: その顔は何ですか？
  d_nikke_neon_visioneye_01_82:
    speaker: "<Self>"
    en: Huh? What about my face?
    ko: |-
      …어, 어?
      내 표정이 왜?
    ja: |-
      …な、なんだ？
      私の顔がどうかしたか？
  d_nikke_neon_visioneye_01_83:
    speaker: neon_v
    en: You look like you're not buying it.
    ko: 그럴 리가 없다는 표정인데요.
    ja: 信じられないという顔をしていますね。
  d_nikke_neon_visioneye_01_84:
    speaker: "<Self>"
    en: N-no, that's not it...!
    ko: 아, 아니야…!
    ja: か、かん違いだ…！
  d_nikke_neon_visioneye_01_85:
    speaker: neon_v
    en: I was a bit surprised myself when I learned about my past personality.
    ko: 저도 예전의 제 성격을 알게 됐을 때는 조금 놀랐어요.
    ja: |-
      自分でも昔の性格を知った時は
      少し驚いたぐらいです。
  d_nikke_neon_visioneye_01_86:
    speaker: neon_v
    en: It's so different from how I am now.
    ko: 지금의 저와는 너무 다르잖아요.
    ja: 今の私とぜんぜん違うじゃないですか。
  d_nikke_neon_visioneye_01_87:
    speaker: neon_v
    en: But I like my new personality better!
    ko: 그런데 전 지금 제 성격이 더 마음에 들어요!
    ja: まあ、私は今の私の性格の方が好きですけどね！
  d_nikke_neon_visioneye_01_88:
    speaker: "<Self>"
    en: I like both the old Neon and the new one.
    ko: |-
      나는 예전의 네온도
      지금의 네온도 다 좋아.
    ja: |-
      私はどちらのネオンでも
      好きになっただろう
  d_nikke_neon_visioneye_01_89:
    speaker: neon_v
    en: Aww... Master.
    ko: 오… 스승님.
    ja: わぁ…師匠。
  d_nikke_neon_visioneye_01_90:
    speaker: neon_v
    en: Some things never change. You really do know how to play with a woman's heart!
    ko: 역시 여자의 마음을 들었다 놨다 하는 솜씨는 어디 안 가시는군요!
    ja: |-
      さすがは次々に女性を
      手玉に取られている方です！
  d_nikke_neon_visioneye_01_91:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_01_92:
    speaker: neon_v
    en: Hehe. I knew you'd say something like that.
    ko: |-
      헤헷.
      스승님이라면 그렇게 대답하실 줄 알았어요.
    ja: |-
      ふふ…
      師匠ならそう言ってくれると
      思っていました。
  d_nikke_neon_visioneye_01_93:
    speaker: neon_v
    en: Oh!
    ko: 앗.
    ja: あ。
  d_nikke_neon_visioneye_01_94:
    speaker: neon_v
    en: We were so busy talking, I didn't realize we're already here.
    ko: 이야기하다 보니까 도착했네요.
    ja: 話しているうちに着きましたよ。
  d_nikke_neon_visioneye_01_95:
    speaker: "<Monologue>"
    en: Neon points ahead.
    ko: 네온이 앞을 가리켰다.
    ja: ネオンが正面を指さした
  d_nikke_neon_visioneye_01_96:
    speaker: "<Self>"
    en: "... This was where you lived?"
    ko: "…여기가 집이라고?"
    ja: "…探していたのは家のはずだが？"
  d_nikke_neon_visioneye_01_97:
    speaker: neon_v
    en: Yeah, if you go just a little farther in, you'll see my old home.
    ko: |-
      예, 여기서 조금만 더 들어가면
      제가 살았던 집이 나와요.
    ja: |-
      はい。ここからもう少し進んだところに
      住んでいました。
  d_nikke_neon_visioneye_01_98:
    speaker: neon_v
    en: Let's go!
    ko: 들어가죠!
    ja: 行きましょう！
d_nikke_neon_visioneye_02:
  d_nikke_neon_visioneye_02_1:
    speaker: "<Self>"
    en: "... You used to live here?"
    ko: "…여기서 살았던 거야?"
    ja: "…ここで暮らしていたのか？"
  d_nikke_neon_visioneye_02_2:
    speaker: neon_v
    en: That's right.
    ko: 예, 맞아요.
    ja: はい、そうです。
  d_nikke_neon_visioneye_02_3:
    speaker: "<Monologue>"
    en: Neon picks up some garbage off the floor.
    ko: 네온은 땅에 있던 쓰레기를 주워 들었다.
    ja: ネオンが床に落ちているゴミを拾った
  d_nikke_neon_visioneye_02_4:
    speaker: neon_v
    en: There's a lot of trash.
    ko: 쓰레기가 많네요.
    ja: 散らかっていますね。
  d_nikke_neon_visioneye_02_5:
    speaker: neon_v
    en: It wasn't exactly clean to begin with, but it wasn't this bad.
    ko: |-
      예전에도 깨끗한 편은 아니었지만
      이 정도는 아니었는데.
    ja: |-
      昔もきれいとは言えなかったですが、
      ここまでひどくはありませんでした。
  d_nikke_neon_visioneye_02_6:
    speaker: neon_v
    en: I guess everyone else must've moved.
    ko: 사람들도 다 다른 데로 옮겨갔나 봐요.
    ja: |-
      ご近所さんたちがみんな
      他の場所へ引っ越したみたいですね。
  d_nikke_neon_visioneye_02_7:
    speaker: neon_v
    en: The tunnel is completely empty.
    ko: 터널이 텅 비어있는 걸 보니.
    ja: トンネル全部、もう誰もいません。
  d_nikke_neon_visioneye_02_8:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_02_9:
    speaker: neon_v
    en: Let's see... It should be around here somewhere.
    ko: "…보자 보자, 이쯤이었던 것 같은데."
    ja: "…え～、確かこの辺だったと思うのですが…"
  d_nikke_neon_visioneye_02_10:
    speaker: "<Monologue>"
    en: Neon strides ahead, then stops next to one of the tunnel's pillars.
    ko: |-
      네온은 앞장서서 앞으로 성큼성큼 걸어가다
      터널 기둥 옆에서 멈춰 섰다.
    ja: |-
      ネオンは先頭に立って足早に奥へ進んでいき
      支柱の脇で止まった
  d_nikke_neon_visioneye_02_11:
    speaker: neon_v
    en: Oh, I found it!
    ko: 와, 찾았다!
    ja: あ、ありました！
  d_nikke_neon_visioneye_02_12:
    speaker: neon_v
    en: Do you see it, Master?
    ko: 스승님, 여기 보이세요?
    ja: 師匠、見えますか？
  d_nikke_neon_visioneye_02_13:
    speaker: neon_v
    en: This yellow line.
    ko: 이 노란 선.
    ja: この黄色い線。
  d_nikke_neon_visioneye_02_14:
    speaker: "<Monologue>"
    en: Neon points to a faded yellow line on the ground.
    ko: 네온이 가리킨 바닥에는 희미하게 남은 노란 선 하나가 보였다.
    ja: |-
      ネオンが指さした床に、
      1本の黄色い線がうっすらと残っている
  d_nikke_neon_visioneye_02_15:
    speaker: neon_v
    en: This was my home.
    ko: 여기가 제 집이었어요.
    ja: ここが私の家だったんです。
  d_nikke_neon_visioneye_02_16:
    speaker: "<Self>"
    en: Surely it wasn't just this one square?
    ko: "…설마 이 한 칸은 아니지?"
    ja: |-
      …まさか、この区切り1マスということでは
      ないだろうな？
  d_nikke_neon_visioneye_02_17:
    speaker: neon_v
    en: It was.
    ko: 맞는데요?
    ja: そのまさかですが？
  d_nikke_neon_visioneye_02_18:
    speaker: "<Self>"
    en: What? But it's so tiny.
    ko: "…뭐? 엄청 좁은데."
    ja: "…本当に？生活には狭すぎる"
  d_nikke_neon_visioneye_02_19:
    speaker: neon_v
    en: Is it?
    ko: 그런가요?
    ja: そうですか？
  d_nikke_neon_visioneye_02_20:
    speaker: "<Monologue>"
    en: Neon steps inside the faded yellow line.
    ko: 네온이 흐릿한 노란 선 안으로 들어갔다.
    ja: ネオンはかすれた黄色い線の中に足を入れた
  d_nikke_neon_visioneye_02_21:
    speaker: neon_v
    en: Hmm...
    ko: "…음."
    ja: "…うーん。"
  d_nikke_neon_visioneye_02_22:
    speaker: neon_v
    en: Now that I'm looking at it, it does seem pretty small.
    ko: 다시 보니까, 확실히 좁긴 하네요.
    ja: 改めて見ると、確かに狭い気がしますね。
  d_nikke_neon_visioneye_02_23:
    speaker: neon_v
    en: It felt much bigger back then.
    ko: 그때는 꽤 넓어 보였는데.
    ja: あの頃は広く感じていたほどでしたが。
  d_nikke_neon_visioneye_02_24:
    speaker: "<Self>"
    en: So you actually lived here?
    ko: 여기서 생활했던 거야?
    ja: ここで暮らしていたのか？
  d_nikke_neon_visioneye_02_25:
    speaker: neon_v
    en: Yes, I did.
    ko: 예, 그렇죠.
    ja: はい、そうです。
  d_nikke_neon_visioneye_02_26:
    speaker: neon_v
    en: I slept here and kept my things here.
    ko: |-
      자는 것도 여기.
      짐 두는 것도 여기.
    ja: |-
      寝るのもここ。
      荷物を置くのもここ。
  d_nikke_neon_visioneye_02_27:
    speaker: neon_v
    en: This one square of floor was quite literally my bedroom and entire house.
    ko: 말 그대로 이 바닥 한 칸이 제 집이고 방이었죠.
    ja: 言葉通り、この1マスの空間が私の家でした。
  d_nikke_neon_visioneye_02_28:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_02_29:
    speaker: neon_v
    en: Even so, it wasn't a bad way to live.
    ko: 그래도 나름 살기 좋았어요.
    ja: それでも、住み心地はいい方だったんですよ。
  d_nikke_neon_visioneye_02_30:
    speaker: neon_v
    en: At least there's a ceiling here.
    ko: 여기는 천장이 있잖아요.
    ja: ここは天井がありますから。
  d_nikke_neon_visioneye_02_31:
    speaker: neon_v
    en: A lot of other places don't even have that.
    ko: 다른 데는 천장 없는 곳도 많았거든요.
    ja: |-
      他の場所では無いことの方が
      多かったですからね。
  d_nikke_neon_visioneye_02_32:
    speaker: neon_v
    en: We also had a security guard.
    ko: 게다가 경비 아저씨도 있었고요.
    ja: あと、見張りのおじさんもいましたし。
  d_nikke_neon_visioneye_02_33:
    speaker: "<Self>"
    en: A security guard?
    ko: 경비 아저씨?
    ja: 見張りのおじさん？
  d_nikke_neon_visioneye_02_34:
    speaker: neon_v
    en: Yeah. He was a bit gruff, but really kind.
    ko: 예, 무뚝뚝하긴 했는데 꽤 착하셨어요.
    ja: ええ、無愛想だけどとても親切な人でした。
  d_nikke_neon_visioneye_02_35:
    speaker: neon_v
    en: Whenever a fight broke out at night, he'd step in to stop it. Sometimes he'd
      even share his Splendamin with us.
    ko: 밤에 싸움 나면 말리러 오고, 가끔 퍼펙트도 나눠주고 그랬는데.
    ja: |-
      夜にケンカを止めに来てくれたり、
      たまにパーフェクトを分けてくれたり。
  d_nikke_neon_visioneye_02_36:
    speaker: neon_v
    en: I wonder where he is now.
    ko: 지금은 어디 계실지 모르겠네요.
    ja: ここを離れてどこに行かれたんでしょうね。
  d_nikke_neon_visioneye_02_37:
    speaker: "<Narration>"
    en: "*Plop*"
    ko: 털썩-
    ja: ドサッ
  d_nikke_neon_visioneye_02_38:
    speaker: "<Monologue>"
    en: Neon lies down inside the yellow line.
    ko: 네온은 노란 선 안에 누웠다.
    ja: ネオンが黄色い線の中に身を投げ出した
  d_nikke_neon_visioneye_02_39:
    speaker: neon_v
    en: Wow.
    ko: 와.
    ja: ああ…
  d_nikke_neon_visioneye_02_40:
    speaker: neon_v
    en: I haven't lain here in so long.
    ko: 여기 누워보는 건 진짜 오랜만이네요.
    ja: ここで横になるのも本当に久しぶりです。
  d_nikke_neon_visioneye_02_41:
    speaker: neon_v
    en: I used to think it was so comfy, but not anymore.
    ko: |-
      그땐 편하다고 생각했는데,
      지금은 엄청 불편하네요.
    ja: |-
      あの頃は寝心地がいいと思っていましたが、
      今ではとてもそう思えませんね。
  d_nikke_neon_visioneye_02_42:
    speaker: neon_v
    en: Do you wanna lie down too, Master?
    ko: 스승님도 한 번 누워보실래요?
    ja: 師匠もいかがですか？
  d_nikke_neon_visioneye_02_43:
    speaker: "<Monologue>"
    en: I walk over and lie down next to Neon.
    ko: 나는 네온 옆으로 다가가 누웠다.
    ja: 私はネオンの隣で横になった
  d_nikke_neon_visioneye_02_44:
    speaker: neon_v
    en: How is it?
    ko: 어때요?
    ja: どうでしょう？
  d_nikke_neon_visioneye_02_45:
    speaker: "<Self>"
    en: It's cold and hard.
    ko: 차갑고, 딱딱해.
    ja: 冷たいし、硬いな
  d_nikke_neon_visioneye_02_46:
    speaker: neon_v
    en: Right?
    ko: 그렇죠.
    ja: そうですね。
  d_nikke_neon_visioneye_02_47:
    speaker: neon_v
    en: But back then,
    ko: 그래도 그때는요.
    ja: でも、あの頃は…
  d_nikke_neon_visioneye_02_48:
    speaker: neon_v
    en: having this one little square made me feel like I had the whole world.
    ko: |-
      이 한 칸을 가지고 있으면,
      세상을 다 가진 기분이었어요.
    ja: |-
      この枠1つが自分のものというだけで、
      世界全部を手にしているような気分でした。
  d_nikke_neon_visioneye_02_49:
    speaker: neon_v
    en: It wasn't easy to nab this spot, you know.
    ko: 참고로 여기 자리 하나 얻는 것도 쉽지 않거든요.
    ja: それだけで、ものすごく大変なことでしたから。
  d_nikke_neon_visioneye_02_50:
    speaker: "<Self>"
    en: Really?
    ko: 그래?
    ja: そうなのか？
  d_nikke_neon_visioneye_02_51:
    speaker: neon_v
    en: Yeah. I had to save up for years, and have good credit too.
    ko: |-
      예, 꼬박 몇 년은 돈을 모아야 해요.
      신용도 좋아야 하고요.
    ja: |-
      ええ、何年も貯めたお金のほかに、
      信用も必要になるんです。
  d_nikke_neon_visioneye_02_52:
    speaker: "<Self>"
    en: I see...
    ko: "…그렇구나."
    ja: "…そうなのか"
  d_nikke_neon_visioneye_02_53:
    speaker: neon_v
    en: Life in the Outer Rim is no walk in the park.
    ko: 아우터 림 생활도 호락호락하지 않다구요.
    ja: アウターリムの生活も甘くはないんですよ。
  d_nikke_neon_visioneye_02_54:
    speaker: "<Self>"
    en: How does it feel to be back?
    ko: 다시 와보니까 어때?
    ja: 久しぶりに来てみて、どうだ？
  d_nikke_neon_visioneye_02_55:
    speaker: neon_v
    en: Hmm... Up until the moment we arrived...
    ko: 음… 여기 오기 전까지만 해도.
    ja: うーん…来る前までは…
  d_nikke_neon_visioneye_02_56:
    speaker: neon_v
    en: I thought coming back would leave me feeling unsettled and that it would weigh
      on me.
    ko: |-
      이곳을 생각하면 마음이 뒤숭숭해지고,
      많이 괴로울 줄 알았거든요.
    ja: |-
      考えるだけで心がざわついて
      きっととてもつらくなると思っていました。
  d_nikke_neon_visioneye_02_57:
    speaker: neon_v
    en: But now that I'm actually here,
    ko: 그런데 막상 와보니.
    ja: でも、いざ来てみると…
  d_nikke_neon_visioneye_02_58:
    speaker: neon_v
    en: I keep reminiscing about the days I spent here.
    ko: 그냥 여기서 지내던 날들만 떠오르네요.
    ja: |-
      純粋に、ここで過ごした日々のことが
      頭に浮かんで来ただけでした。
  d_nikke_neon_visioneye_02_59:
    speaker: "<Self>"
    en: Are they good memories?
    ko: 좋은 기억이야?
    ja: いい思い出か？
  d_nikke_neon_visioneye_02_60:
    speaker: neon_v
    en: They're not bad.
    ko: 나쁘진 않았어요.
    ja: 悪くはありません。
  d_nikke_neon_visioneye_02_61:
    speaker: neon_v
    en: Time has passed, and a lot has changed.
    ko: 시간이 흐른 만큼 많은 게 변했네요.
    ja: |-
      時が流れた分、
      いろいろ変わったということでしょう。
  d_nikke_neon_visioneye_02_62:
    speaker: neon_v
    en: Still, I'm glad I came.
    ko: 그래도 와 보길 잘한 것 같아요.
    ja: 来てみて本当によかったです。
  d_nikke_neon_visioneye_02_63:
    speaker: neon_v
    en: It's pretty surreal, lying here again like this.
    ko: 제가 지금 다시 여기 누워 있다는 게 조금 신기하거든요.
    ja: |-
      自分が今ここで横になっていることが
      不思議な気がします。
  d_nikke_neon_visioneye_02_64:
    speaker: neon_v
    en: If my past self could see me now, she'd be shocked.
    ko: 그리고 그때의 제가 지금의 저를 봤으면 아마 엄청 놀랐을 거예요.
    ja: |-
      昔の私が今の私をみたら
      きっとすごく驚くと思います。
  d_nikke_neon_visioneye_02_65:
    speaker: neon_v
    en: She'd be like, how did you get so healthy?
    ko: 너 왜 이렇게 건강해졌어? 하면서.
    ja: どうやってそんなに元気になったの？って。
  d_nikke_neon_visioneye_02_66:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_02_67:
    speaker: neon_v
    en: Hngh.
    ko: 읏챠.
    ja: よいしょっと…
  d_nikke_neon_visioneye_02_68:
    speaker: "<Monologue>"
    en: Neon rises to her feet.
    ko: 네온이 자리에서 일어났다.
    ja: ネオンが起き上がった
  d_nikke_neon_visioneye_02_69:
    speaker: neon_v
    en: Well, now that you've seen my old home,
    ko: 자, 그럼 제가 살았던 집은 다 봤으니까.
    ja: さて、家はこれぐらいでいいでしょう。
  d_nikke_neon_visioneye_02_70:
    speaker: neon_v
    en: shall we move on to the next place?
    ko: 다음 장소로 가볼까요?
    ja: 次の目的地へ向かいましょうか？
  d_nikke_neon_visioneye_02_71:
    speaker: "<Self>"
    en: There's more?
    ko: 다음 장소?
    ja: 次の目的地？
  d_nikke_neon_visioneye_02_72:
    speaker: neon_v
    en: Yep! I'll show you where I used to work too!
    ko: 예! 제가 일하던 곳도 보여드릴게요!
    ja: はい！私のかつての職場です！
d_nikke_neon_visioneye_03:
  d_nikke_neon_visioneye_03_1:
    speaker: neon_v
    en: Master, over here!
    ko: 스승님, 여기예요!
    ja: 師匠、ここです！
  d_nikke_neon_visioneye_03_2:
    speaker: neon_v
    en: This is the entertainment district where I used to work.
    ko: 제가 일하던 환락가 거리예요.
    ja: この歓楽街で働いていました。
  d_nikke_neon_visioneye_03_3:
    speaker: "<Monologue>"
    en: I follow Neon into an alley.
    ko: 네온을 따라 골목으로 들어서자,
    ja: ネオンに続いて路地へ足を踏み入れると…
  d_nikke_neon_visioneye_03_4:
    speaker: "<Monologue>"
    en: Colorful lights spill through the cramped, dark alleyway.
    ko: 어둡고 좁은 골목 사이사이로 형형색색의 불빛이 번지고 있었다.
    ja: |-
      暗くて狭い路地のあちこちに
      色とりどりの光が広がっている
  d_nikke_neon_visioneye_03_5:
    speaker: "<Narration>"
    en: "*Splash*"
    ko: 찰박-!
    ja: バシャッ！
  d_nikke_neon_visioneye_03_6:
    speaker: outerrimman1
    en: Aw, damn it. I stepped in a puddle! Just my luck.
    ko: |-
      에이, 물웅덩이 밟았잖아!
      재수가 없으려니.
    ja: |-
      チッ、水たまりかよ！
      ツイてねぇな。
  d_nikke_neon_visioneye_03_7:
    speaker: drunkman
    en: Ahaha! Told you to watch where you're going, man!
    ko: |-
      크헤헤헤!
      그러니까 앞 좀 잘 보고 다니라고~!
    ja: |-
      ブハハハッ！
      ちゃんと前見て歩けっての～！
  d_nikke_neon_visioneye_03_8:
    speaker: drunkman
    en: So, where to next?
    ko: 다음엔 어딜 가볼까~
    ja: 次はどこにすっかな～
  d_nikke_neon_visioneye_03_9:
    speaker: dirtyman
    en: Hey, out of my way. You're blocking the way.
    ko: |-
      어이, 다들 비켜.
      길 막히니까.
    ja: |-
      おい、どけよ。
      道塞ぐんじゃねぇ。
  d_nikke_neon_visioneye_03_10:
    speaker: "<Monologue>"
    en: The alley was packed with people, their voices a tangle of laughter and frustration.
    ko: |-
      골목 안은 짜증 섞인 목소리와 웃음소리가 뒤엉킨 채,
      사람들이 가득 차 있었다.
    ja: |-
      路地は荒っぽい声や笑い声も入り混じり、
      にぎわっていた
  d_nikke_neon_visioneye_03_11:
    speaker: neon_v
    en: The vibe here is something, huh?
    ko: 분위기가 좀… 그렇죠?
    ja: 雰囲気がちょっと…騒々しいでしょう？
  d_nikke_neon_visioneye_03_12:
    speaker: neon_v
    en: It's still as crowded and hectic as ever.
    ko: 여기는 여전히 사람도 많고 정신없네요.
    ja: 相変わらず人が多くて落ち着きませんね。
  d_nikke_neon_visioneye_03_13:
    speaker: "<Self>"
    en: I feel like I could get lost in here.
    ko: "…길 잃을 것 같아."
    ja: "…道に迷いそうだ"
  d_nikke_neon_visioneye_03_14:
    speaker: neon_v
    en: Don't worry, we'll never get lost here.
    ko: 길은 절대 안 잃을 테니까, 걱정 마세요.
    ja: そこは私がいますので、ご安心を。
  d_nikke_neon_visioneye_03_15:
    speaker: neon_v
    en: I used to clean this whole alley back in the day.
    ko: 제가 이 골목 전체를 청소했었거든요.
    ja: 私、この辺りの路地を全部掃除していたんです。
  d_nikke_neon_visioneye_03_16:
    speaker: "<Self>"
    en: "... This whole place?"
    ko: "…이 골목 전체를?"
    ja: "…この辺り全部？"
  d_nikke_neon_visioneye_03_17:
    speaker: neon_v
    en: Yeah. It's quite big, huh?
    ko: 예, 꽤 넓죠?
    ja: ええ。かなり広いでしょう？
  d_nikke_neon_visioneye_03_18:
    speaker: neon_v
    en: I cleaned from here all the way to the end. There was always so much to clean.
    ko: |-
      여기서부터 저쪽 끝까지 청소했어요.
      청소할 게 엄청 많았는데.
    ja: |-
      ここから、あの先あたりまで全部です。
      片付けるものはいつもたくさんありました。
  d_nikke_neon_visioneye_03_19:
    speaker: "<Self>"
    en: What was that job like?
    ko: "…청소 일은 어땠어?"
    ja: "…掃除の仕事はどんなものだった？"
  d_nikke_neon_visioneye_03_20:
    speaker: neon_v
    en: Hmm...
    ko: 음.
    ja: うーん。
  d_nikke_neon_visioneye_03_21:
    speaker: neon_v
    en: It was pretty rough at first.
    ko: 처음엔 좀 버거웠죠.
    ja: 最初は大変でした。
  d_nikke_neon_visioneye_03_22:
    speaker: neon_v
    en: My body was weak, and the alley was so huge. There were also so many rooms
      to clean.
    ko: |-
      몸은 안 좋은데 골목은 넓지,
      방도 많고요.
    ja: |-
      体は弱かったですし、体力もないのに、
      路地は広くて掃除する部屋もたくさん
      ありましたから。
  d_nikke_neon_visioneye_03_23:
    speaker: neon_v
    en: Everything was so caked in dust, I'd end up coughing like crazy from walking
      around all day.
    ko: 먼지도 많아서 하루 종일 돌아다니다 보면 기침도 엄청나곤 했어요.
    ja: |-
      ホコリだらけで、1日歩き回った後には
      咳が止まらなくなっていましたね。
  d_nikke_neon_visioneye_03_24:
    speaker: neon_v
    en: But I eventually got used to it after a while!
    ko: 그래도 계속하다 보니 나중에는 익숙해지더라고요!
    ja: まあ、続けるうちにだんだん慣れていきました！
  d_nikke_neon_visioneye_03_25:
    speaker: "<Monologue>"
    en: Neon walks deeper into the alley with familiar steps.
    ko: 네온은 익숙한 발걸음으로 골목 안쪽으로 더 들어갔다.
    ja: |-
      ネオンは迷いのない足取りで、
      路地の奥へ進んでいく
  d_nikke_neon_visioneye_03_26:
    speaker: neon_v
    en: It doesn't look like much has changed.
    ko: 다시 와보니까 여긴 크게 변한 게 없네요.
    ja: ここはそんなに変わっていませんね。
  d_nikke_neon_visioneye_03_27:
    speaker: neon_v
    en: I feel like I could navigate this place with my eyes closed.
    ko: 눈을 감고도 걸을 수 있을 것 같아요.
    ja: 目を閉じたままでも歩けそうです。
  d_nikke_neon_visioneye_03_28:
    speaker: neon_v
    en: I really went through it all here.
    ko: 여기서 정말 별의별 일을 다 겪었었는데.
    ja: ここでは本当に色々なことがありました。
  d_nikke_neon_visioneye_03_29:
    speaker: "<Self>"
    en: Like what?
    ko: 무슨 일?
    ja: 例えば？
  d_nikke_neon_visioneye_03_30:
    speaker: neon_v
    en: Finding random people passed out on the street was a daily occurrence.
    ko: 모르는 사람이 길바닥에 쓰러져 있는 건 기본이었고요.
    ja: |-
      知らない人が道端に倒れているのは
      いつものことです。
  d_nikke_neon_visioneye_03_31:
    speaker: neon_v
    en: There were lots of rooms that reeked from the moment you opened the door too.
    ko: 문 열자마자 이상한 냄새가 확 풍겨오는 방도 있었고.
    ja: |-
      掃除のために扉を開けたら、
      強烈な異臭がしてきたり…
  d_nikke_neon_visioneye_03_32:
    speaker: neon_v
    en: I've even been hit by flying bottles.
    ko: 날아오는 술병에 맞은 적도 있었어요.
    ja: 酒の瓶が飛んできたりしたこともありましたね。
  d_nikke_neon_visioneye_03_33:
    speaker: "<Self>"
    en: Weren't you scared?
    ko: "…안 무서웠어?"
    ja: "…怖くなかったのか？"
  d_nikke_neon_visioneye_03_34:
    speaker: neon_v
    en: Sure I was.
    ko: 무서웠죠.
    ja: 最初は。
  d_nikke_neon_visioneye_03_35:
    speaker: neon_v
    en: But humans are good at adapting.
    ko: 그런데 사람은 적응의 동물이라고 하잖아요?
    ja: ですが、人は適応する生き物だと言うでしょう？
  d_nikke_neon_visioneye_03_36:
    speaker: neon_v
    en: At some point, it started to feel strange when nothing unusual happened.
    ko: 나중에는 아무 일도 없는 날이 더 낯설게 느껴지더라고요.
    ja: |-
      そのうち何もない日の方が
      変だと思うようになりました。
  d_nikke_neon_visioneye_03_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_03_38:
    speaker: neon_v
    en: Still, there were good moments too.
    ko: 그래도 일하다 보면 좋은 일도 있었어요.
    ja: 働いていると、いいこともありましたし。
  d_nikke_neon_visioneye_03_39:
    speaker: neon_v
    en: Sometimes I'd get tipped too.
    ko: 가끔 팁을 받을 때도 있었고.
    ja: たまにチップをもらえるとか。
  d_nikke_neon_visioneye_03_40:
    speaker: neon_v
    en: Every once in a while, I'd get lucky and score some decent food.
    ko: 드물게는 멀쩡한 음식을 얻어먹을 때도 있었거든요.
    ja: |-
      ごくまれに、ちゃんとした食べ物が
      手に入るとか。
  d_nikke_neon_visioneye_03_41:
    speaker: "<Self>"
    en: And that was a good thing...?
    ko: "…그게 좋은 일이야?"
    ja: "…それがいいことなのか？"
  d_nikke_neon_visioneye_03_42:
    speaker: neon_v
    en: Of course!
    ko: 그럼요!
    ja: もちろんです！
  d_nikke_neon_visioneye_03_43:
    speaker: neon_v
    en: Out in the Outer Rim, that's considered pretty huge.
    ko: 아우터 림에서는 엄청 좋은 일이죠.
    ja: |-
      アウターリムではものすごく
      ラッキーなことですよ。
  d_nikke_neon_visioneye_03_44:
    speaker: neon_v
    en: But being back here, feels rather strange.
    ko: 근데 여기 오니까 기분이 좀 묘하네요.
    ja: |-
      でも…改めて来てみると、
      何だか不思議な気分ですね。
  d_nikke_neon_visioneye_03_45:
    speaker: "<Self>"
    en: Why's that?
    ko: 왜?
    ja: なぜだ？
  d_nikke_neon_visioneye_03_46:
    speaker: neon_v
    en: Back then, this was my everyday life, so I didn't even realize how hard I
      had it.
    ko: 그땐 그게 일상이어서 힘든 줄도 모르고 살았거든요.
    ja: |-
      あの頃はそれが日常だったので、
      つらいとも考えずに暮らしていました。
  d_nikke_neon_visioneye_03_47:
    speaker: neon_v
    en: Now that I'm back here,
    ko: 그런데 지금 다시 와보니까,
    ja: ですが、今ここに来たら…
  d_nikke_neon_visioneye_03_48:
    speaker: neon_v
    en: I realize just how much I had to struggle.
    ko: 아, 나 진짜 열심히 살았구나 싶어서요.
    ja: |-
      なんだか、私って本当に
      頑張って生きていたんだな…と思えて。
  d_nikke_neon_visioneye_03_49:
    speaker: neon_v
    en: I'd drag myself to work no matter how sick I was,
    ko: 아픈 몸으로도 어떻게든 일하러 나왔고.
    ja: 具合が悪い時でも、なんとか働いて…
  d_nikke_neon_visioneye_03_50:
    speaker: neon_v
    en: thinking that if I can just get through today, I can get through tomorrow
      too.
    ko: 오늘만 잘 버티면 내일도 버틸 수 있겠지.
    ja: 今日さえ乗り越えれば、明日も乗り越えられる。
  d_nikke_neon_visioneye_03_51:
    speaker: neon_v
    en: That thought kept me going as I cleaned.
    ko: 그런 생각으로 열심히 청소했거든요.
    ja: そう思いながら、頑張って掃除していました。
  d_nikke_neon_visioneye_03_52:
    speaker: "<Self>"
    en: You should be proud of yourself.
    ko: 대견하네.
    ja: 立派だな
  d_nikke_neon_visioneye_03_53:
    speaker: neon_v
    en: Right?
    ko: 그렇죠?
    ja: そうでしょう？
  d_nikke_neon_visioneye_03_54:
    speaker: neon_v
    en: I nearly fell for myself all over again.
    ko: 새삼 저한테 반할 뻔했어요.
    ja: 今さら自分にほれ直してしまうところでした。
  d_nikke_neon_visioneye_03_55:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_03_56:
    speaker: neon_v
    en: Oh, I wonder if that building is still there.
    ko: 앗, 아직 그 건물이 남아 있으려나?
    ja: あ、あそこは今も残っているでしょうか？
  d_nikke_neon_visioneye_03_57:
    speaker: "<Self>"
    en: What building?
    ko: 무슨 건물?
    ja: あそこ？
  d_nikke_neon_visioneye_03_58:
    speaker: "<Monologue>"
    en: Neon points to an old building at the end of the alley.
    ko: 네온이 골목 끝에 있는 낡은 건물을 가리켰다.
    ja: ネオンが路地の奥にある古い建築物を指さした
  d_nikke_neon_visioneye_03_59:
    speaker: neon_v
    en: There used to be a trading post there.
    ko: 저기가 예전에 교환소가 있던 곳이거든요.
    ja: 昔、あの辺りに交換所があったんです。
  d_nikke_neon_visioneye_03_60:
    speaker: "<Self>"
    en: A trading post?
    ko: 교환소?
    ja: 交換所？
  d_nikke_neon_visioneye_03_61:
    speaker: neon_v
    en: Yeah.
    ko: 예.
    ja: ええ。
  d_nikke_neon_visioneye_03_62:
    speaker: neon_v
    en: If you caught a rat, you could trade them for things like cookies.
    ko: 쥐를 잡아가면 쿠키 같은 걸로 바꿔주던 곳이었어요.
    ja: |-
      ネズミを捕まえて持っていくと、
      クッキーなどに交換してもらえました。
  d_nikke_neon_visioneye_03_63:
    speaker: neon_v
    en: If you were lucky, you could even get some Splendamin.
    ko: 운이 좋으면 퍼펙트 같은 걸 받을 때도 있었고요.
    ja: |-
      運がよければ、パーフェクトの時も
      あったんですよ。
  d_nikke_neon_visioneye_03_64:
    speaker: neon_v
    en: I always looked forward to stopping by there after work.
    ko: 전 일이 끝나면 그곳에 들르는 게 은근히 기다려졌어요.
    ja: |-
      仕事のあとに寄るのが
      私のひそかな楽しみでした。
  d_nikke_neon_visioneye_03_65:
    speaker: neon_v
    en: I'd always wonder what that day's trade would be.
    ko: 오늘은 뭘로 바꿔줄까 싶어서요.
    ja: 今日は何に換えてもらえるかな～と。
  d_nikke_neon_visioneye_03_66:
    speaker: neon_v
    en: It's probably gone now...
    ko: 지금은 없어졌을 것 같긴 한데….
    ja: さすがにもう無くなっているでしょうけど…
  d_nikke_neon_visioneye_03_67:
    speaker: neon_v
    en: Still, I want to see for myself.
    ko: 그래도 한 번 확인해보고 싶네요.
    ja: 自分の目で確かめておきたいんです。
  d_nikke_neon_visioneye_03_68:
    speaker: "<Monologue>"
    en: Neon slowly walks over and stops where the building once stood.
    ko: 네온은 천천히 발걸음을 옮겨, 낡은 건물이 있던 자리에 멈춰 섰다.
    ja: |-
      ゆっくりと歩くネオンの足が
      彼女の指さした場所の手前で止まった
  d_nikke_neon_visioneye_03_69:
    speaker: "<Monologue>"
    en: However, only rubble remains.
    ko: 그러나 그곳에는 무너진 자재들만이 쓸쓸히 남아 있었다.
    ja: そこには崩れた資材だけが物寂しく残されていた
  d_nikke_neon_visioneye_03_70:
    speaker: neon_v
    en: "... It's not there anymore."
    ko: "…역시 없네요."
    ja: "…やっぱりなくなっているみたいですね。"
  d_nikke_neon_visioneye_03_71:
    speaker: "<Self>"
    en: Are you disappointed?
    ko: 실망했어?
    ja: がっかりしたか？
  d_nikke_neon_visioneye_03_72:
    speaker: neon_v
    en: A little.
    ko: 조금은요.
    ja: はい、少し。
  d_nikke_neon_visioneye_03_73:
    speaker: neon_v
    en: Now that the building's gone, it's really sinking in.
    ko: "…건물이 없어진 걸 보니, 더 실감 나네요."
    ja: |-
      …建物もなくなっているのを見たら、
      ますます実感が湧きました。
  d_nikke_neon_visioneye_03_74:
    speaker: neon_v
    en: So much time has passed.
    ko: 시간이 꽤 지났다는 게요.
    ja: ずいぶん経ってるんだなあって。
  d_nikke_neon_visioneye_03_75:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_03_76:
    speaker: neon_v
    en: Still, I'm glad.
    ko: 그래도 다행이에요.
    ja: でも、よかったです。
  d_nikke_neon_visioneye_03_77:
    speaker: "<Self>"
    en: About what?
    ko: "…뭐가?"
    ja: "…何がだ？"
  d_nikke_neon_visioneye_03_78:
    speaker: neon_v
    en: Some of the places I remember are still here.
    ko: 제가 기억하던 것들이 전부 사라진 건 아니라서요.
    ja: |-
      私の記憶の中にあるものが
      全部なくなっているわけじゃなかったので。
  d_nikke_neon_visioneye_03_79:
    speaker: neon_v
    en: Like my home and this alley... I can still recognize them.
    ko: |-
      집도 그렇고, 이 골목도 그렇고.
      알아볼 수는 있잖아요.
    ja: |-
      家も、この通りも。
      確かにここにありましたから。
  d_nikke_neon_visioneye_03_80:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_03_81:
    speaker: neon_v
    en: Ready to go to the last place?
    ko: 이제 마지막 장소로 가볼까요?
    ja: では、最後の場所へ行くとしましょうか？
  d_nikke_neon_visioneye_03_82:
    speaker: "<Self>"
    en: There's another stop?
    ko: 마지막 장소?
    ja: 最後の場所？
  d_nikke_neon_visioneye_03_83:
    speaker: neon_v
    en: Yes. The place where I was with Princess for the last time.
    ko: 예, 공주님이랑 마지막으로 함께 있었던 곳이요.
    ja: ええ。お姫様と最後にいた場所です。
  d_nikke_neon_visioneye_03_84:
    speaker: neon_v
    en: I wasn't planning to go at first,
    ko: 처음엔 안 가려고 했거든요.
    ja: |-
      最初は行かないでおくつもり
      だったんですけどね。
  d_nikke_neon_visioneye_03_85:
    speaker: neon_v
    en: but if I came all this way and left without seeing it,
    ko: 근데 여기까지 와놓고 그냥 가버리면,
    ja: ここまで来て行かなかったら…
  d_nikke_neon_visioneye_03_86:
    speaker: neon_v
    en: I think it would eat at me.
    ko: 계속 신경 쓰일 것 같아서요.
    ja: ずっと心残りになる気がするので。
  d_nikke_neon_visioneye_03_87:
    speaker: "<Self>"
    en: Are you sure?
    ko: "…괜찮겠어?"
    ja: "…大丈夫か？"
  d_nikke_neon_visioneye_03_88:
    speaker: neon_v
    en: I dunno.
    ko: 글쎄요?
    ja: どうでしょう？
  d_nikke_neon_visioneye_03_89:
    speaker: neon_v
    en: I guess I'll find out when I get there.
    ko: 그건 가봐야 알 것 같아요.
    ja: 行ってみないと分かりません。
  d_nikke_neon_visioneye_03_90:
    speaker: neon_v
    en: Let's go, Master!
    ko: 가죠, 스승님!
    ja: 行きましょう、師匠！
d_nikke_neon_visioneye_04:
  d_nikke_neon_visioneye_04_1:
    speaker: "<Self>"
    en: What was Princess like?
    ko: "…공주님은 어떤 사람이었어?"
    ja: "…どんな人だったんだ？"
  d_nikke_neon_visioneye_04_2:
    speaker: neon_v
    en: Princess?
    ko: 공주님이요?
    ja: お姫様のことですか？
  d_nikke_neon_visioneye_04_3:
    speaker: neon_v
    en: Hmm...
    ko: "…음."
    ja: "…うーん。"
  d_nikke_neon_visioneye_04_4:
    speaker: neon_v
    en: She wasn't a good person.
    ko: 좋은 사람은 아니었어요.
    ja: 決していい人とは言えませんでしたね。
  d_nikke_neon_visioneye_04_5:
    speaker: neon_v
    en: She always looked down on others.
    ko: 남 무시하는 건 기본이고.
    ja: 基本的には周りの皆を見下していました。
  d_nikke_neon_visioneye_04_6:
    speaker: neon_v
    en: She was always complaining about something, and she was proud too.
    ko: 불만도 엄청 많고, 자존심도 세고.
    ja: 不満ばっかりで、プライドも高くて。
  d_nikke_neon_visioneye_04_7:
    speaker: neon_v
    en: She got irritated at the drop of a hat, and she really didn't mince her words.
    ko: 툭하면 짜증 내고, 말도 진짜 예쁘게 안 했어요.
    ja: すぐ怒るし、話し方にもすごくトゲがあるし。
  d_nikke_neon_visioneye_04_8:
    speaker: "<Self>"
    en: W-wait? She sounds so...
    ko: |-
      자, 잠깐만.
      너무 좀….
    ja: |-
      ま、待ってくれ。
      それだとあまりにも…
  d_nikke_neon_visioneye_04_9:
    speaker: neon_v
    en: I know, she sounds like a horrible person, huh?
    ko: 완전 못된 사람 같죠?
    ja: ものすごくイヤな性格の人に聞こえるでしょう？
  d_nikke_neon_visioneye_04_10:
    speaker: neon_v
    en: Well, you're not exactly wrong.
    ko: 뭐, 아주 틀린 말은 아니에요.
    ja: まあ、それも間違ってはいないんです。
  d_nikke_neon_visioneye_04_11:
    speaker: neon_v
    en: Still, she was good to me.
    ko: 그래도 저한테는 좋은 사람이었어요.
    ja: でも、私にとって、彼女はいい人でした。
  d_nikke_neon_visioneye_04_12:
    speaker: neon_v
    en: People always have more than one side to them.
    ko: |-
      원래 사람이라는 게
      꼭 한 가지 모습으로만 비춰지는 건 아니잖아요.
    ja: |-
      そもそも人って、一面だけじゃ
      はかり切れないものだと思います。
  d_nikke_neon_visioneye_04_13:
    speaker: neon_v
    en: Someone can be awful to one person,
    ko: 누군가한텐 못된 사람이어도.
    ja: 誰かにとっては悪い人でも…
  d_nikke_neon_visioneye_04_14:
    speaker: neon_v
    en: and wonderful to another.
    ko: 다른 누군가에게는 정말 좋은 사람일 수 있듯이.
    ja: |-
      他の誰かにとっては
      すごくいい人だってことも、ありますよね。
  d_nikke_neon_visioneye_04_15:
    speaker: neon_v
    en: That's what Princess was like to me.
    ko: 공주님은 저한테 그랬어요.
    ja: 私にとってのお姫様は、それです。
  d_nikke_neon_visioneye_04_16:
    speaker: neon_v
    en: She may have snapped at me, but she wished for my health and happiness more
      than anyone else.
    ko: |-
      틱틱거리면서도
      누구보다 제가 건강해지고 행복하게 살길 바랬던 사람.
    ja: |-
      気難しくても、私の身体を気づかって、
      幸せを誰よりも願ってくれていた人でした。
  d_nikke_neon_visioneye_04_17:
    speaker: "<Self>"
    en: No matter how she treated others,
    ko: 남들에게 어떤 사람이었든,
    ja: 他の人に対してはともかく…
  d_nikke_neon_visioneye_04_18:
    speaker: "<Self>"
    en: the fact that she treated you well means she was a good person.
    ko: 네온에게 잘해줬다면 좋은 사람인 건 변하지 않지.
    ja: |-
      ネオンに優しかったのなら
      きっといい人だったのだろう
  d_nikke_neon_visioneye_04_19:
    speaker: neon_v
    en: I agree.
    ko: 예, 맞아요.
    ja: はい、その通りです。
  d_nikke_neon_visioneye_04_20:
    speaker: neon_v
    en: That's why I liked her.
    ko: 그래서 저는 공주님을 좋아했어요.
    ja: だから、私はお姫様のことが好きでした。
  d_nikke_neon_visioneye_04_21:
    speaker: neon_v
    en: We're here.
    ko: 도착했어요.
    ja: ここですね。
  d_nikke_neon_visioneye_04_22:
    speaker: neon_v
    en: This is where I was with Princess for the last time.
    ko: 여기가 공주님이랑 마지막으로 함께 있었던 곳이에요.
    ja: お姫様と私が、最後に一緒にいた場所です。
  d_nikke_neon_visioneye_04_23:
    speaker: "<Monologue>"
    en: I slowly look around the area near the Partition.
    ko: 나는 격벽 주변을 천천히 둘러봤다.
    ja: 私は防壁に近いその場所をゆっくりと見渡した
  d_nikke_neon_visioneye_04_24:
    speaker: "<Monologue>"
    en: Several people are sitting against the wall or silently going about their
      business.
    ko: |-
      …격벽 주변에는 몇몇 사람들이 벽에 기대앉아 있거나
      말없이 제 할 일을 하고 있었다.
    ja: |-
      …壁に寄りかかったり座ったりしている者が
      数人、何も言わずに自分のことをしている
  d_nikke_neon_visioneye_04_25:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_04_26:
    speaker: neon_v
    en: My memories of that day are as vivid as ever,
    ko: 아직 그날의 기억은 선명한데.
    ja: |-
      あの日のことがはっきり
      頭の中に残っているのに…
  d_nikke_neon_visioneye_04_27:
    speaker: neon_v
    en: but there's no trace of it left. I thought at least something would remain.
    ko: |-
      여긴 아무것도 안 남아 있네요.
      뭐라도 남아있을 줄 알았는데.
    ja: |-
      ここには何も残っていないんですね。
      何か一つぐらいはあると思っていました。
  d_nikke_neon_visioneye_04_28:
    speaker: neon_v
    en: Even the bloodstains are gone.
    ko: 핏자국조차 안 남아 있어요.
    ja: 血の痕さえありません。
  d_nikke_neon_visioneye_04_29:
    speaker: "<Self>"
    en: It has been a long time.
    ko: 아무래도 시간이 많이 지났으니까.
    ja: かなりの時間が経っているからな
  d_nikke_neon_visioneye_04_30:
    speaker: neon_v
    en: You're right.
    ko: 그렇죠.
    ja: そうですね。
  d_nikke_neon_visioneye_04_31:
    speaker: neon_v
    en: It was weird of me to hope that there'd still be anything here.
    ko: 뭔가 남아 있길 바라는 게 이상한 거겠죠.
    ja: |-
      むしろ何か残っていると期待する方が
      おかしかったんでしょう。
  d_nikke_neon_visioneye_04_32:
    speaker: neon_v
    en: The Partition and lights are still the same. Just the traces of that day are
      gone.
    ko: |-
      격벽도 불빛도 그대로인데.
      그날의 흔적만 사라져 버렸네요.
    ja: |-
      防壁も光もあの時のままなのに、
      あの日の痕跡だけがありません。
  d_nikke_neon_visioneye_04_33:
    speaker: "<Monologue>"
    en: Neon keeps her head down, staring at the ground.
    ko: 네온은 고개를 숙인 채 바닥을 바라봤다.
    ja: ネオンはうつむき、路面に視線を落とした
  d_nikke_neon_visioneye_04_34:
    speaker: neon_v
    en: I was worried I might burst into tears just thinking about Princess,
    ko: 공주님 생각에 너무 슬퍼서 울어버리면 어쩌나 싶었는데.
    ja: |-
      お姫様のことを考えだしたら、
      泣いてしまうんじゃないかと
      思っていました。
  d_nikke_neon_visioneye_04_35:
    speaker: neon_v
    en: But somehow I'm all right.
    ko: 막상 그렇진 않네요.
    ja: 意外と涙も出ないものですね。
  d_nikke_neon_visioneye_04_36:
    speaker: neon_v
    en: All I keep thinking about is our last moment together.
    ko: 대신 공주님과 함께했던 마지막 순간만 자꾸 떠올라요.
    ja: 一緒にいた最後の瞬間だけが頭に浮かびます。
  d_nikke_neon_visioneye_04_37:
    speaker: neon_v
    en: We were there for each other until the very end.
    ko: 그때 저희는 마지막까지 서로에게 의지하고 있었거든요.
    ja: 終わりまで互いに頼り合っていました。
  d_nikke_neon_visioneye_04_38:
    speaker: neon_v
    en: It's always weighed on me that I never got to say any final words to her that
      day
    ko: 그날, 공주님께 마지막 한마디도 남지기 못한 게 계속 마음에 걸렸는데….
    ja: |-
      最後の一言を言えていなかったことが
      ずっと心残りだったんですが…
  d_nikke_neon_visioneye_04_39:
    speaker: neon_v
    en: Maybe now I can.
    ko: 이제야 할 수 있겠네요.
    ja: やっと言えます。
  d_nikke_neon_visioneye_04_40:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_04_41:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_04_42:
    speaker: neon_v
    en: Princess.
    ko: "…공주님."
    ja: "…お姫様。"
  d_nikke_neon_visioneye_04_43:
    speaker: neon_v
    en: I'm back.
    ko: 저 왔어요.
    ja: 会いに来ました。
  d_nikke_neon_visioneye_04_44:
    speaker: neon_v
    en: What do you think?
    ko: 어때요?
    ja: どうです？
  d_nikke_neon_visioneye_04_45:
    speaker: neon_v
    en: I've changed a lot, haven't I?
    ko: 예전이랑 많이 달라졌죠?
    ja: あの頃とは別人みたいでしょう？
  d_nikke_neon_visioneye_04_46:
    speaker: neon_v
    en: I've gotten healthy, just like you wanted.
    ko: 공주님이 원하던 대로, 저 건강해졌어요.
    ja: |-
      お姫様の願い通り、
      私は元気な身体になりました。
  d_nikke_neon_visioneye_04_47:
    speaker: neon_v
    en: I don't cough anymore.
    ko: 이제 기침도 안 하고요.
    ja: もう咳も出ません。
  d_nikke_neon_visioneye_04_48:
    speaker: neon_v
    en: I'm really enjoying my life now.
    ko: 하루하루 즐겁게 살고 있어요.
    ja: 毎日、楽しく過ごしています。
  d_nikke_neon_visioneye_04_49:
    speaker: neon_v
    en: I even live in the Ark now!
    ko: 그것도 방주에서요!
    ja: それも、あのアークで！
  d_nikke_neon_visioneye_04_50:
    speaker: neon_v
    en: I eat lots of good food,
    ko: 맛있는 것도 많이 먹고.
    ja: おいしいものをいっぱい食べました。
  d_nikke_neon_visioneye_04_51:
    speaker: neon_v
    en: and I've met people I can laugh and talk with.
    ko: 같이 웃고 떠들 사람들도 생겼어요.
    ja: 一緒に笑ってはしゃげる仲間もできました。
  d_nikke_neon_visioneye_04_52:
    speaker: neon_v
    en: And also...
    ko: 그리고 또….
    ja: それに…
  d_nikke_neon_visioneye_04_53:
    speaker: "<Monologue>"
    en: Neon looks at me.
    ko: 네온이 나를 바라봤다.
    ja: ネオンが私の方を見た
  d_nikke_neon_visioneye_04_54:
    speaker: neon_v
    en: "... I have my Master and my friends who are like family to me."
    ko: 가족 같은 스승님이랑 동료들도 곁에 있어요.
    ja: |-
      家族のような師匠と仲間が
      そばにいてくれます。
  d_nikke_neon_visioneye_04_55:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_04_56:
    speaker: neon_v
    en: The old me never could have imagined this, don't you think?
    ko: 예전의 저라면 상상도 못 했을 거예요. 그쵸?
    ja: あの時の私からは想像もつきませんよね？
  d_nikke_neon_visioneye_04_57:
    speaker: neon_v
    en: "... Thank you, Princess."
    ko: "…고마워요 공주님."
    ja: "…ありがとう、お姫様。"
  d_nikke_neon_visioneye_04_58:
    speaker: neon_v
    en: For thinking of me until the very end,
    ko: 마지막까지 제 생각해 줘서.
    ja: 最後まで私のことを思ってくれて。
  d_nikke_neon_visioneye_04_59:
    speaker: neon_v
    en: for telling me to live healthily,
    ko: 건강하게 살라고 해줘서.
    ja: 私の健康を願ってくれて。
  d_nikke_neon_visioneye_04_60:
    speaker: neon_v
    en: and for telling me to live happily.
    ko: 행복하게 살라고 해줘서.
    ja: 私の幸せを願ってくれて。
  d_nikke_neon_visioneye_04_61:
    speaker: neon_v
    en: "... I miss you."
    ko: "…보고 싶어요."
    ja: "…会いたいです。"
  d_nikke_neon_visioneye_04_62:
    speaker: "<Self>"
    en: Neon...
    ko: 네온….
    ja: ネオン…
  d_nikke_neon_visioneye_04_63:
    speaker: neon_v
    en: It's sad... not being able to see someone you miss ever again.
    ko: 역시 보고 싶은 사람을 다시 볼 수 없다는 건… 슬프네요.
    ja: |-
      やっぱり、会いたい人に
      二度と会えないっていうのは…悲しいですね。
  d_nikke_neon_visioneye_04_64:
    speaker: neon_v
    en: It would've been better if she could see me herself.
    ko: 제 모습을 직접 보셨으면 더 좋았을 텐데.
    ja: 今の私の姿、見てほしかったのに。
  d_nikke_neon_visioneye_04_65:
    speaker: neon_v
    en: If she could see me...
    ko: 아마 실제로 보셨다면….
    ja: もし見たら、きっと…
  d_nikke_neon_visioneye_04_66:
    speaker: "<Monologue>"
    en: Neon frowns and crosses her arms.
    ko: 네온은 인상을 쓰며 팔짱을 꼈다.
    ja: ネオンがしかめっ面をして腕を組んだ
  d_nikke_neon_visioneye_04_67:
    speaker: neon_v
    en: '"Hmph."'
    ko: 흥.
    ja: "「ふん！」"
  d_nikke_neon_visioneye_04_68:
    speaker: neon_v
    en: '"I should hope so."'
    ko: 당연히 그래야지.
    ja: "「当然でしょ？」"
  d_nikke_neon_visioneye_04_69:
    speaker: neon_v
    en: '"I would never forgive you if you lived a sorry little life after I went
      through all that trouble to save you."'
    ko: 기껏 살려놨더니, 불행하게 살고 있었으면 용서 안 했을 거다.
    ja: |-
      「せっかく助けてあげたのに、
      不幸な毎日なんて許さないわ」
  d_nikke_neon_visioneye_04_70:
    speaker: neon_v
    en: That's probably what she'd say.
    ko: "…라고 하셨을 거예요."
    ja: "…とか、言ったと思います。"
  d_nikke_neon_visioneye_04_71:
    speaker: "<Self>"
    en: Maybe she'd even smile and be happy for you.
    ko: 웃으며 좋아했을 수도 있지.
    ja: 笑って喜んでくれるかもしれない
  d_nikke_neon_visioneye_04_72:
    speaker: neon_v
    en: Hehe, maybe she would.
    ko: 후후, 그랬을 수도 있겠네요.
    ja: ふふっ、そうかもしれませんね。
  d_nikke_neon_visioneye_04_73:
    speaker: neon_v
    en: Master,
    ko: 스승님.
    ja: 師匠。
  d_nikke_neon_visioneye_04_74:
    speaker: neon_v
    en: do you mind if I stay here a little longer?
    ko: 저 여기서 조금만 더 있어도 될까요?
    ja: あと少しだけここにいてもいいですか？
  d_nikke_neon_visioneye_04_75:
    speaker: neon_v
    en: I'd like to reminisce about Princess a bit more.
    ko: 이곳에서 공주님을 조금만 더 추억하고 싶어서요.
    ja: もう少し浸っていたいんです。
  d_nikke_neon_visioneye_04_76:
    speaker: "<Self>"
    en: Sure. I'll stay with you.
    ko: 응, 옆에 있어줄게.
    ja: ああ、問題ない
  d_nikke_neon_visioneye_04_77:
    speaker: neon_v
    en: Thank you.
    ko: 감사해요.
    ja: ありがとうございます。
  d_nikke_neon_visioneye_04_78:
    speaker: "<Monologue>"
    en: Neon quietly stares at the empty space for a while.
    ko: |-
      네온은 아무것도 남지 않은 그 자리를
      한동안 가만히 바라보고 있었다.
    ja: |-
      ネオンは何も残っていないその場所を
      しばらくの間じっと見つめていた
d_nikke_neon_visioneye_05:
  d_nikke_neon_visioneye_05_1:
    speaker: neon_v
    en: "*Sigh*"
    ko: "…후우."
    ja: "…ふぅ。"
  d_nikke_neon_visioneye_05_2:
    speaker: neon_v
    en: Ready to go back to the Ark?
    ko: 이제 그만 방주로 돌아갈까요?
    ja: そろそろアークへ帰りましょうか。
  d_nikke_neon_visioneye_05_3:
    speaker: "<Self>"
    en: You don't want to stay any longer?
    ko: 더 안 있어도 돼?
    ja: もういいのか？
  d_nikke_neon_visioneye_05_4:
    speaker: neon_v
    en: No, I think this is enough.
    ko: 예, 충분한 것 같아요.
    ja: はい、もう十分です。
  d_nikke_neon_visioneye_05_5:
    speaker: neon_v
    en: I've made my peace with things, and most importantly, I feel relieved.
    ko: |-
      이제 마음도 어느 정도 정리 됐고,
      무엇보다 정말 많이 후련해졌거든요.
    ja: |-
      ある程度は気持ちも整理できましたし
      とてもスッキリしました。
  d_nikke_neon_visioneye_05_6:
    speaker: neon_v
    en: I'm really glad I came.
    ko: 오길 잘했다는 생각이 들어요.
    ja: 来てよかったです。
  d_nikke_neon_visioneye_05_7:
    speaker: neon_v
    en: If I hadn't, I think this would've weighed on my mind for a long time.
    ko: 이곳에 안 왔으면 두고두고 계속 생각났을 것 같아요.
    ja: |-
      来ないままでいたら、
      ずっと引きずっていたと思います。
  d_nikke_neon_visioneye_05_8:
    speaker: "<Self>"
    en: I'm glad to hear that.
    ko: 다행이네.
    ja: それはよかった
  d_nikke_neon_visioneye_05_9:
    speaker: "<Self>"
    en: Let's head back then.
    ko: 그럼 이제 방주로 돌아갈까?
    ja: では、アークに帰ろうか？
  d_nikke_neon_visioneye_05_10:
    speaker: neon_v
    en: Yep!
    ko: 예!
    ja: はい！
  d_nikke_neon_visioneye_05_11:
    speaker: neon_v
    en: Oh, hang on!
    ko: 아, 잠시만요!
    ja: あっ、ちょっと待ってください！
  d_nikke_neon_visioneye_05_12:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_05_13:
    speaker: "<Monologue>"
    en: Neon stands there with her eyes closed.
    ko: 네온은 눈을 감은 채, 한동안 제자리에 서 있었다.
    ja: |-
      ネオンは目を閉じたまま、
      しばらくその場に立ち尽くしていた
  d_nikke_neon_visioneye_05_14:
    speaker: "<Monologue>"
    en: After a moment, a faint smile spreads on her face.
    ko: |-
      그리고 잠시 후,
      희미한 미소가 네온의 입가에 번졌다.
    ja: |-
      しばらくして、
      ネオンはかすかな笑みを口元に浮かべた
  d_nikke_neon_visioneye_05_15:
    speaker: neon_v
    en: Okay.
    ko: 좋아요.
    ja: よし。
  d_nikke_neon_visioneye_05_16:
    speaker: neon_v
    en: Now we can really go!
    ko: 이제 진짜 출발하죠!
    ja: それでは、出発しましょう！
  d_nikke_neon_visioneye_05_17:
    speaker: "<Self>"
    en: What were you doing?
    ko: 뭐 한 거야?
    ja: 何をしていたんだ？
  d_nikke_neon_visioneye_05_18:
    speaker: neon_v
    en: I had one more thing to say to Princess.
    ko: 마지막으로 공주님께 한마디 더 했어요.
    ja: お姫様へ、最後にもう一言だけ。
  d_nikke_neon_visioneye_05_19:
    speaker: neon_v
    en: Even the air is different between the Ark and the Outer Rim.
    ko: 역시 아우터 림이랑 방주는 공기 자체가 다르네요.
    ja: |-
      やはり、アウターリムとアークでは
      空気そのものがまったく違いますね。
  d_nikke_neon_visioneye_05_20:
    speaker: "<Self>"
    en: You're right.
    ko: 그러게.
    ja: そうだな
  d_nikke_neon_visioneye_05_21:
    speaker: neon_v
    en: Master.
    ko: 스승님.
    ja: 師匠。
  d_nikke_neon_visioneye_05_22:
    speaker: neon_v
    en: How was today?
    ko: 오늘 하루 어떠셨어요?
    ja: 今日一日、どうでしたか？
  d_nikke_neon_visioneye_05_23:
    speaker: neon_v
    en: You must've been tired, following me around all day.
    ko: 저 따라다니시느라, 힘드셨을 것 같아서요.
    ja: 私にあちこち連れ回されて、お疲れでしょう。
  d_nikke_neon_visioneye_05_24:
    speaker: "<Self>"
    en: Not at all.
    ko: 힘들진 않았어.
    ja: 疲れてはいない
  d_nikke_neon_visioneye_05_25:
    speaker: "<Self>"
    en: I'm glad that I got to see for myself where you came from and how you lived.
    ko: |-
      오히려 네온이 과거에 어떤 곳에서
      어떻게 살아왔는지 직접 봐서 좋았지.
    ja: |-
      昔のネオンが
      どんな場所でどう生きてきたのか
      この目で見ることができてよかった
  d_nikke_neon_visioneye_05_26:
    speaker: neon_v
    en: Thank you for saying that.
    ko: 그렇게 말씀해 주셔서 감사해요.
    ja: ありがとうございます。
  d_nikke_neon_visioneye_05_27:
    speaker: neon_v
    en: Although, I would have liked to show you a more impressive side of myself...
    ko: 그래도 스승님한테는 좀 더 멋있는 모습을 보여드리고 싶었는데….
    ja: |-
      とはいえ、師匠にはもう少し
      カッコいいところをお見せしたかったのに…
  d_nikke_neon_visioneye_05_28:
    speaker: neon_v
    en: So it's a bit of a shame.
    ko: 그게 조금 아쉽네요.
    ja: ちょっと残念です。
  d_nikke_neon_visioneye_05_29:
    speaker: "<Self>"
    en: You were more than impressive enough.
    ko: 충분히 멋있었어.
    ja: 十分にカッコよかった
  d_nikke_neon_visioneye_05_30:
    speaker: neon_v
    en: Hehe, thanks.
    ko: 헤헷, 감사합니다!
    ja: へへへ、ありがとうございます！
  d_nikke_neon_visioneye_05_31:
    speaker: neon_v
    en: You know, Master...
    ko: 있잖아요, 스승님.
    ja: "…ねえ、師匠。"
  d_nikke_neon_visioneye_05_32:
    speaker: neon_v
    en: As I walked through the Outer Rim today, I kept thinking about the people
      who used to be in my life.
    ko: |-
      오늘 아우터 림을 다시 돌아보면서
      옛날에 같이 지냈던 사람들이 많이 생각났어요.
    ja: |-
      今日、アウターリム巡りをしながら
      昔一緒に過ごしていた人たちのことが
      何度も頭に浮かびました。
  d_nikke_neon_visioneye_05_33:
    speaker: neon_v
    en: Even though I know what became of them,
    ko: 다들 어떻게 됐는지 아는데도,
    ja: みんながどうなったのかも知っているのに…
  d_nikke_neon_visioneye_05_34:
    speaker: neon_v
    en: I kept thinking about them anyway.
    ko: 이상하게 자꾸 생각이 나더라고요.
    ja: なぜか何度も頭に浮かんできたんです。
  d_nikke_neon_visioneye_05_35:
    speaker: neon_v
    en: I'm really glad you came to the Outer Rim with me.
    ko: 그래서 스승님이랑 아우터 림을 가서 다행이다 싶었어요.
    ja: |-
      師匠がついて来てくださって
      本当に助かりました。
  d_nikke_neon_visioneye_05_36:
    speaker: neon_v
    en: If I'd gone by myself, I probably would've overthought everything
    ko: 혼자 갔으면 몇 번이고 고민하다가,
    ja: もし私一人だったら、きっと何度も迷って…
  d_nikke_neon_visioneye_05_37:
    speaker: neon_v
    en: and eventually just turned around and come back.
    ko: 끝내 그냥 되돌아왔을 것 같거든요.
    ja: 途中で引き返していたという気がします。
  d_nikke_neon_visioneye_05_38:
    speaker: neon_v
    en: I was able to be brave because I had you.
    ko: 스승님이 곁에 있어서 용기 낼 수 있었어요.
    ja: |-
      師匠が隣にいてくれたおかげで、
      勇気を出すことができました。
  d_nikke_neon_visioneye_05_39:
    speaker: "<Self>"
    en: If you ever want to go to the Outer Rim again, just say the word.
    ko: 앞으로도 아우터 림에 가고 싶으면 말해.
    ja: |-
      これからも行きたくなったら
      いつでも言ってくれ
  d_nikke_neon_visioneye_05_40:
    speaker: "<Self>"
    en: I'll go with you.
    ko: 같이 가줄게.
    ja: また一緒に行こう
  d_nikke_neon_visioneye_05_41:
    speaker: neon_v
    en: Really?
    ko: 정말요?
    ja: いいんですか？
  d_nikke_neon_visioneye_05_42:
    speaker: neon_v
    en: You're the best, Master!
    ko: 역시, 스승님!
    ja: さすが、師匠！
  d_nikke_neon_visioneye_05_43:
    speaker: "<Monologue>"
    en: As Neon and I walk the streets, she briefly stops and looks up at the Ark's
      lights.
    ko: |-
      네온은 나와 함께 길을 걷다가
      잠시 걸음을 멈추고 방주의 불빛들을 올려다봤다.
    ja: |-
      私と並んで歩いていたネオンが、
      ふいに歩みを止め、アークの光を見上げた
  d_nikke_neon_visioneye_05_44:
    speaker: neon_v
    en: Looking at it from this angle, the Ark really does sparkle.
    ko: |-
      이렇게 보니까
      방주는 정말 반짝반짝하네요.
    ja: |-
      改めて見ると、
      アークって本当にキラキラしていますね。
  d_nikke_neon_visioneye_05_45:
    speaker: "<Self>"
    en: Yeah. It seems even brighter today than usual.
    ko: |-
      그러게.
      오늘따라 유난히 더 반짝이는 것 같네.
    ja: |-
      そうだな。
      今日はひときわ輝いて見える気がする
  d_nikke_neon_visioneye_05_46:
    speaker: neon_v
    en: Back when I was in the Outer Rim, I used to wander around in hopes of seeing
      something this bright and dazzling.
    ko: |-
      아우터 림에 있을 때는
      매번 이렇게 밝고 반짝이는 걸 보고 싶어서 찾아다녔거든요.
    ja: |-
      アウターリムにいた頃は、
      そういう明るく輝くものが見たくて
      いつも探し回っていました。
  d_nikke_neon_visioneye_05_47:
    speaker: neon_v
    en: I never imagined I'd end up living in the Ark.
    ko: 그땐 제가 방주에서 살게 될 줄은 정말 몰랐어요.
    ja: |-
      自分がアークに住めるようになるなんて
      夢にも思っていませんでしたし。
  d_nikke_neon_visioneye_05_48:
    speaker: neon_v
    en: I thought it existed in a whole other world from me.
    ko: 저랑은 상관없는 곳이라고 생각했거든요.
    ja: 自分とは関係のない場所だと思っていたんです。
  d_nikke_neon_visioneye_05_49:
    speaker: neon_v
    en: A place I could never reach.
    ko: 닿을 수 없는 곳이라고도 생각했고.
    ja: 手の届くことがない場所だ、って。
  d_nikke_neon_visioneye_05_50:
    speaker: neon_v
    en: But now, here I am, walking through the Ark like it's nothing.
    ko: 그런데 지금은 아무렇지도 않게 방주를 걷고 있네요.
    ja: |-
      でも今は、当たり前のように
      アークを歩いています。
  d_nikke_neon_visioneye_05_51:
    speaker: neon_v
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_neon_visioneye_05_52:
    speaker: neon_v
    en: Back then, I survived without ever thinking about the near future,
    ko: 그땐 당장의 미래도 생각하지 않고 살았었는데,
    ja: |-
      あの頃はすぐ先の未来のことも
      考えずに生きていました。
  d_nikke_neon_visioneye_05_53:
    speaker: neon_v
    en: but now...
    ko: 지금은 이렇게….
    ja: それが、今はこうして…
  d_nikke_neon_visioneye_05_54:
    speaker: neon_v
    en: I get to see these dazzling lights,
    ko: 반짝이는 빛을 볼 수 있게 되었어요.
    ja: 輝く光を見られるようになりました。
  d_nikke_neon_visioneye_05_55:
    speaker: neon_v
    en: and I even see a future.
    ko: 미래를 볼 수 있게 된 거죠.
    ja: 未来を見ることができるようになったんです。
  d_nikke_neon_visioneye_05_56:
    speaker: neon_v
    en: This is probably the life Princess wanted for me too, huh?
    ko: "…공주님도 제가 이렇게 살아가길 바라셨던 거겠죠?"
    ja: |-
      …お姫様もきっと、
      それを望んでいたんですよね？
  d_nikke_neon_visioneye_05_57:
    speaker: "<Self>"
    en: Yeah, I'm sure it is.
    ko: 응, 분명 그랬을 거야.
    ja: ああ、きっとそうだ
  d_nikke_neon_visioneye_05_58:
    speaker: neon_v
    en: Good!
    ko: 좋아요!
    ja: よーし！
  d_nikke_neon_visioneye_05_59:
    speaker: neon_v
    en: Since I received healthy eyes from Princess,
    ko: 전 공주님께 건강한 눈을 받았으니,
    ja: お姫様からもらった、この健康な目で…
  d_nikke_neon_visioneye_05_60:
    speaker: neon_v
    en: I'll use them to watch over everything going forward!
    ko: 앞으로 더 많은 걸 지키도록 하겠어요!
    ja: これからたくさんのものを守ってみせますよ！
  d_nikke_neon_visioneye_05_61:
    speaker: "<Self>"
    en: Good.
    ko: 좋아.
    ja: いい心意気だ
  d_nikke_neon_visioneye_05_62:
    speaker: neon_v
    en: Hehe. I sound trustworthy, don't I?
    ko: |-
      후훗.
      믿음직스럽죠?
    ja: |-
      ふふふ。
      頼もしくなったでしょう？
  d_nikke_neon_visioneye_05_63:
    speaker: "<Self>"
    en: You always were.
    ko: 원래도 믿음직스러웠어.
    ja: 元から頼もしかった
  d_nikke_neon_visioneye_05_64:
    speaker: neon_v
    en: Then let's say I'm even more so now.
    ko: 그럼 더 믿음직한 걸로 해두죠.
    ja: |-
      では、さらに頼もしくなったということに
      しておきましょう。
  d_nikke_neon_visioneye_05_65:
    speaker: neon_v
    en: On that note...
    ko: 그런 의미에서.
    ja: そういうわけですから…
  d_nikke_neon_visioneye_05_66:
    speaker: neon_v
    en: Master! Let's keep fighting the good fight!
    ko: |-
      스승님!
      앞으로도 잘 부탁드려요!
    ja: |-
      師匠！
      これからもよろしくお願いしますね！
  d_nikke_neon_visioneye_05_67:
    speaker: "<Self>"
    en: Huh? Where's this coming from?
    ko: 갑자기?
    ja: いきなりだな？
  d_nikke_neon_visioneye_05_68:
    speaker: neon_v
    en: Well, I did get a new body and all.
    ko: 새로운 바디를 받았으니.
    ja: 新しいボディになりましたので。
  d_nikke_neon_visioneye_05_69:
    speaker: neon_v
    en: So I'm greeting you with a new heart and a new resolve.
    ko: 새 마음 새 뜻으로 다시 인사드리는 거예요.
    ja: 気分一新、改めてごあいさつです。
  d_nikke_neon_visioneye_05_70:
    speaker: "<Self>"
    en: Well then, let's keep it up.
    ko: 그래, 나도 잘 부탁해.
    ja: ああ、こちらこそよろしく
  d_nikke_neon_visioneye_05_71:
    speaker: "<Monologue>"
    en: Neon's voice sounds even lighter than before.
    ko: 네온의 목소리는 처음보다 한결 가벼워져 있었다.
    ja: |-
      ネオンの声は、出かける前よりも
      さらに明るくなっていた
  d_nikke_neon_visioneye_05_72:
    speaker: "<Monologue>"
    en: I walk with Neon, passing between countless shimmering buildings.
    ko: |-
      나는 네온과 함께
      수없이 반짝이는 건물들 사이를 지나 앞을 향해 걸어갔다.
    ja: |-
      私はネオンとともに
      光を放つ街並みの中を、前へと歩き続けた
