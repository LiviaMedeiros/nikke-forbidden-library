---
d_nikke_marian_queen_01:
  d_nikke_marian_queen_01_1:
    speaker: "<Narration>"
    en: Marian opens her eyes.
    ko: 마리안이 눈을 떴다.
    ja: マリアンは目を覚ました
  d_nikke_marian_queen_01_2:
    speaker: marian_queen
    en: How long has it been now...?
    ko: 시간이 얼마나… 지났지?
    ja: あれから…どのくらい経ったのかしら？
  d_nikke_marian_queen_01_3:
    speaker: marian_queen
    en: Ah...
    ko: 아….
    ja: あぁ…
  d_nikke_marian_queen_01_4:
    speaker: marian_queen
    en: I miss the Commander...
    ko: 지휘관… 보고 싶다.
    ja: 指揮官…会いたい…
  d_nikke_marian_queen_01_5:
    speaker: marian_queen
    en: Hehe, but he probably doesn't even...
    ko: 후후, 하지만 지휘관은 나를….
    ja: ふふ、でも指揮官は私を…
  d_nikke_marian_queen_01_6:
    speaker: marian_queen
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_7:
    speaker: marian_queen
    en: If somehow a miracle happens...
    ko: 기적이라도 일어난다면….
    ja: 奇跡でも起きれば…
  d_nikke_marian_queen_01_8:
    speaker: marian_queen
    en: Then just maybe...
    ko: 그렇다면 혹시….
    ja: そうすれば、もしかしたら…
  d_nikke_marian_queen_01_9:
    speaker: "<Narration>"
    en: '"If your determination is that unshakable, then doesn''t it stop being a
      miracle, and becomes something that''s bound to happen?"'
    ko: "[그렇게 의지가 확고하다면, 기적이 아니라 결국 일어날 일이 아닐까?]"
    ja: |-
      「それほど揺るぎない意志があるのなら、
      　それは奇跡ではなく、
      　起こるべくして起こることなのではないか？」
  d_nikke_marian_queen_01_10:
    speaker: marian_queen
    en: Oh...!
    ko: 아…!
    ja: あっ…！
  d_nikke_marian_queen_01_11:
    speaker: "<Narration>"
    en: Marian recalls a happy moment.
    ko: 마리안은 행복했던 순간을 떠올렸다.
    ja: マリアンは幸せだった時を思い返した
  d_nikke_marian_queen_01_12:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_13:
    speaker: "<Narration>"
    en: Marian moves to the side of the door and scans the room.
    ko: 마리안은 문 옆에 비켜서서, 실내를 살핀다.
    ja: |-
      マリアンは扉の脇に身を寄せ、
      室内の様子をうかがった
  d_nikke_marian_queen_01_14:
    speaker: marian
    en: I don't see any immediate threats.
    ko: 당장 눈에 띄는 위협 요소는 없네요.
    ja: 見たところ、脅威となるものはなさそうですね。
  d_nikke_marian_queen_01_15:
    speaker: "<Self>"
    en: Let's go in then.
    ko: 그럼 들어가 볼까?
    ja: では、入ってみるか？
  d_nikke_marian_queen_01_16:
    speaker: marian
    en: Let me go in first and...
    ko: 일단 제가 먼저 들어가서….
    ja: まず私が先に…
  d_nikke_marian_queen_01_17:
    speaker: "<Narration>"
    en: The Commander strides inside.
    ko: 지휘관이 안으로 성큼 발을 내디뎠다.
    ja: 指揮官は大股で中へと足を踏み入れた
  d_nikke_marian_queen_01_18:
    speaker: "<Self>"
    en: It's pretty clean in here for a building that's falling apart.
    ko: 다 무너져 가는 건물치곤 안은 깨끗하네.
    ja: 外観の割に、中はきれいだな
  d_nikke_marian_queen_01_19:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_20:
    speaker: "<Self>"
    en: Marian?
    ko: 마리안?
    ja: マリアン？
  d_nikke_marian_queen_01_21:
    speaker: marian
    en: Commander, you shouldn't go inside before I do.
    ko: 지휘관이 먼저 들어가시면 어떡해요.
    ja: 指揮官が先に入ってどうするんですか。
  d_nikke_marian_queen_01_22:
    speaker: marian
    en: You need to wait until I've made sure it's safe.
    ko: 제가 확실하게 안전을 확보한 다음에 들어가셔야죠.
    ja: 私がしっかり安全を確保してからじゃないと。
  d_nikke_marian_queen_01_23:
    speaker: marian
    en: On the battlefield, your safety comes first.
    ko: 전장에선 지휘관의 안전이 가장 중요하잖아요.
    ja: 戦場では指揮官の安全が何より優先です。
  d_nikke_marian_queen_01_24:
    speaker: "<Self>"
    en: I just didn't want to see you... you know.
    ko: 보고 싶지 않았어.
    ja: 見たくなかったんだ
  d_nikke_marian_queen_01_25:
    speaker: marian
    en: What...?
    ko: "…네?"
    ja: "…え？"
  d_nikke_marian_queen_01_26:
    speaker: "<Self>"
    en: I didn't want to see you get hurt, Marian.
    ko: 마리안이 다치는 모습은 보고 싶지 않았어.
    ja: マリアンがケガをする姿は、見たくなかった
  d_nikke_marian_queen_01_27:
    speaker: "<Self>"
    en: If someone's going to get hurt, I'd rather it be me.
    ko: 그럴 거라면 차라리 내가 다치는 게 낫겠다 싶었고.
    ja: |-
      それならいっそ、自分が
      ケガをしたほうがマシだと思ったんだ
  d_nikke_marian_queen_01_28:
    speaker: marian
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_marian_queen_01_29:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_30:
    speaker: marian
    en: I feel the same way, you know.
    ko: 그건 저도 마찬가지예요.
    ja: それは私も同じです。
  d_nikke_marian_queen_01_31:
    speaker: marian
    en: I don't want to see you in danger, either.
    ko: 저도 지휘관이 위험해지는 모습은 보고 싶지 않아요.
    ja: |-
      指揮官が危険な目に遭う姿は、
      私も見たくありません。
  d_nikke_marian_queen_01_32:
    speaker: marian
    en: That's why I was going to go in first.
    ko: 그래서 제가 먼저 들어가려고 했던 거고요.
    ja: だから、私が先に…
  d_nikke_marian_queen_01_33:
    speaker: "<Narration>"
    en: The Commander smiles and takes Marian's hand.
    ko: 지휘관이 웃으며 마리안의 손을 잡았다.
    ja: |-
      指揮官は微笑みながら、
      マリアンの手を握った
  d_nikke_marian_queen_01_34:
    speaker: "<Self>"
    en: All right. I'll be careful from now on, so don't be upset with me.
    ko: 알았어. 앞으로 조심할 테니까 화 풀어.
    ja: |-
      分かった。これからは気をつける。
      機嫌を直してくれ
  d_nikke_marian_queen_01_35:
    speaker: "<Self>"
    en: Next time, let's hold hands like this and walk in together.
    ko: 다음엔 이렇게 손잡고 같이 들어가자.
    ja: 今度はこうやって手をつないで、一緒に入ろう
  d_nikke_marian_queen_01_36:
    speaker: marian
    en: You just wanted an excuse to hold my hand, didn't you?
    ko: 이걸 핑계로 손을 잡고 싶었던 건 아니고요?
    ja: もう、手をつなぎたかっただけじゃないですか？
  d_nikke_marian_queen_01_37:
    speaker: "<Self>"
    en: "... You caught me."
    ko: "…들켰네."
    ja: "…バレたか"
  d_nikke_marian_queen_01_38:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_39:
    speaker: marian
    en: Pfft. Hehe.
    ko: 푸훗.
    ja: ふふっ。
  d_nikke_marian_queen_01_40:
    speaker: "<Narration>"
    en: Marian holds the Commander's hand back.
    ko: 마리안이 지휘관의 손을 마주 잡는다.
    ja: マリアンが指揮官の手を握り返した
  d_nikke_marian_queen_01_41:
    speaker: marian
    en: Fine, I won't be upset with you, but please come in behind me next time. Okay?
    ko: 화 풀 테니까, 다음부턴 제 뒤에 따라서 들어와 주세요.
    ja: |-
      分かりました。
      でも次からは私の後から来てくださいね。
  d_nikke_marian_queen_01_42:
    speaker: "<Self>"
    en: Let's take a good look around. I have a feeling we'll find something here.
    ko: 일단 뭐가 나와도 나올 것 같은 느낌이니까 잘 찾아보자.
    ja: |-
      ここなら何かありそうだな。
      よく探してみよう
  d_nikke_marian_queen_01_43:
    speaker: "<Self>"
    en: We might be able to restock some supplies.
    ko: 부족한 물자를 보충할 수 있을지도 몰라.
    ja: 物資を補給できるかもしれない
  d_nikke_marian_queen_01_44:
    speaker: marian
    en: "... Don't change the subject!"
    ko: "…말 돌리지 마시고요!"
    ja: "…話をそらさないでください！"
  d_nikke_marian_queen_01_45:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_marian_queen_01_46:
    speaker: marian
    en: I don't really see anything that would be immediately useful.
    ko: 당장 쓸모 있는 건 눈에 띄질 않네요.
    ja: 今すぐ使えそうなものは、見当たりませんね。
  d_nikke_marian_queen_01_47:
    speaker: marian
    en: The only things here are documents and office supplies.
    ko: 서류나 사무용품 같은 것들밖에 없어요.
    ja: |-
      書類とか事務用品のようなものなら
      あるのですが…
  d_nikke_marian_queen_01_48:
    speaker: marian
    en: "... Do you think this place used to be an office?"
    ko: "…사무실로 쓰던 공간이었던 걸까요?"
    ja: "…事務所として使われていたのでしょうか。"
  d_nikke_marian_queen_01_49:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_50:
    speaker: marian
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_marian_queen_01_51:
    speaker: marian
    en: What are you looking at?
    ko: 뭘 그렇게 유심히 보고 계세요?
    ja: どうしたんですか？
  d_nikke_marian_queen_01_52:
    speaker: "<Self>"
    en: Take a look at this.
    ko: 마리안, 이것 좀 볼래?
    ja: マリアン、これを見てくれ
  d_nikke_marian_queen_01_53:
    speaker: "<Narration>"
    en: The Commander picks up an old notebook from the desk.
    ko: 지휘관이 책상 위의 낡은 수첩을 집어 들었다.
    ja: 指揮官は机の上にあった古びた手帳を手に取った
  d_nikke_marian_queen_01_54:
    speaker: marian
    en: '"My Bucket List"...'
    ko: "[나의 버킷 리스트]…."
    ja: "「私のやりたいことリスト」…"
  d_nikke_marian_queen_01_55:
    speaker: marian
    en: Is there something important recorded in here?
    ko: 안에 뭔가 중요한 내용이라도 적혀 있나요?
    ja: 何か重要なことでも書いてあるんですか？
  d_nikke_marian_queen_01_56:
    speaker: "<Self>"
    en: I was just thinking maybe we could make something like this too.
    ko: 그냥 우리도 이런 걸 만들어서 해보면 좋겠다 싶어서 보여주는 거야.
    ja: |-
      私たちもこういうものを作って、
      やってみたらどうかなと思って
  d_nikke_marian_queen_01_57:
    speaker: "<Self>"
    en: Honestly, I can't really read what's inside since the pages are so worn.
    ko: 종이가 다 헤져서 안에 뭐라고 적혀 있는지는 모르겠네.
    ja: |-
      紙がボロボロで、
      何と書いてあるかまでは分からないな
  d_nikke_marian_queen_01_58:
    speaker: marian
    en: A bucket list, huh...
    ko: 해보고 싶은 일….
    ja: やりたいこと…
  d_nikke_marian_queen_01_59:
    speaker: "<Self>"
    en: We might as well make some memories as we go, right?
    ko: 이왕 가는 길에 추억도 쌓으면서 가면 좋잖아?
    ja: せっかくだ、思い出も作りながら進もう
  d_nikke_marian_queen_01_60:
    speaker: marian
    en: But won't we be making memories anyway, just by being together?
    ko: 지휘관과 함께 있으면, 그것만으로도 추억이 되지 않을까요?
    ja: |-
      指揮官と一緒にいれば、
      それだけで思い出になります。
  d_nikke_marian_queen_01_61:
    speaker: "<Self>"
    en: Sure, but... maybe we can still come up with some specific things to do.
    ko: |-
      그렇긴 한데….
      그래도 뭔가 구체적으로 다른 걸 생각해 보자.
    ja: |-
      それはそうだが…
      具体的にできることを考えてみないか？
  d_nikke_marian_queen_01_62:
    speaker: marian
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_marian_queen_01_63:
    speaker: marian
    en: There is one thing I can think of...
    ko: 잠깐 머리에 떠오르는 게 있기는 한데….
    ja: 頭に浮かんだことはあるのですが…
  d_nikke_marian_queen_01_64:
    speaker: "<Self>"
    en: What is it?
    ko: 어떤 거?
    ja: どんなことだ？
  d_nikke_marian_queen_01_65:
    speaker: marian
    en: I'd like to go stargazing.
    ko: 별 구경을 해보고 싶어요.
    ja: 星空をながめてみたいです。
  d_nikke_marian_queen_01_66:
    speaker: marian
    en: Somewhere romantic if possible, like a beach at night.
    ko: 이왕이면 밤바다 같은 분위기 좋은 곳에서요.
    ja: |-
      せっかくなら夜の海みたいな、
      雰囲気のいい場所で。
  d_nikke_marian_queen_01_67:
    speaker: "<Self>"
    en: That might be hard to do at this time of day...
    ko: 그러면 지금 하긴 어렵겠네….
    ja: それは、今すぐは難しそうだな…
  d_nikke_marian_queen_01_68:
    speaker: marian
    en: Hehe. It'd probably be hard to find a beach around here too, huh?
    ko: 아하하. 바다를 찾는 것도 쉽지 않겠죠?
    ja: あはは、海を探すのも簡単じゃないですよね？
  d_nikke_marian_queen_01_69:
    speaker: "<Self>"
    en: Anything else?
    ko: 혹시 다른 건 없어?
    ja: 他にはないか？
  d_nikke_marian_queen_01_70:
    speaker: marian
    en: "... I feel like I've been the only one talking for a while."
    ko: "…그런데 뭔가 아까부터 계속 저만 말하고 있지 않나요?"
    ja: "…さっきから私ばかりじゃないですか。"
  d_nikke_marian_queen_01_71:
    speaker: marian
    en: I want to hear about your bucket list, too.
    ko: 저도 지휘관의 버킷 리스트가 궁금한데요.
    ja: |-
      私も指揮官のやりたいことリスト、
      気になります。
  d_nikke_marian_queen_01_72:
    speaker: "<Self>"
    en: I was hoping to hear a little more about yours first.
    ko: 마리안이 하고 싶은 것부터 들으려고 그래.
    ja: マリアンの意見を先に聞きたかったんだ
  d_nikke_marian_queen_01_73:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_74:
    speaker: marian
    en: Something like... waking up to a gentle touch in the morning...
    ko: 아침에 부드러운 손길을 느끼면서 일어나 보기…?
    ja: |-
      朝、優しくなでられながら
      目を覚ますこと、でしょうか…
  d_nikke_marian_queen_01_75:
    speaker: marian
    en: And then eating the breakfast that you made for me while I was sleeping.
    ko: 그리고 나서 미리 준비된 아침 식사를 먹으러 가는 거예요.
    ja: |-
      それから、用意してもらった朝ごはんを
      食べるんです。
  d_nikke_marian_queen_01_76:
    speaker: "<Self>"
    en: Hmm... I'll be sure to remember that.
    ko: 음… 일단 머릿속에 잘 넣어둘게.
    ja: そうか…とりあえず頭に入れておこう
  d_nikke_marian_queen_01_77:
    speaker: "<Self>"
    en: Both of those things are pretty modest requests, though.
    ko: 근데 뭔가 다 소박한 내용이네?
    ja: それにしても、どれもささやかな願いだな？
  d_nikke_marian_queen_01_78:
    speaker: marian
    en: You think so?
    ko: 그런가요?
    ja: そうですか？
  d_nikke_marian_queen_01_79:
    speaker: marian
    en: I thought they were pretty extravagant...
    ko: 전 이 정도면 꽤 사치스럽다고 생각했는데….
    ja: 贅沢かなと思っていたんですが…
  d_nikke_marian_queen_01_80:
    speaker: marian
    en: So what's on your bucket list, Commander?
    ko: 그러면 지휘관이 생각한 버킷 리스트는 뭐가 있는데요?
    ja: じゃあ、指揮官は？
  d_nikke_marian_queen_01_81:
    speaker: "<Self>"
    en: Doing whatever you want to do.
    ko: 내 버킷 리스트는 마리안이 하고 싶은 걸 하는 거야.
    ja: |-
      私のやりたいことは、
      マリアンのやりたいことをすることだ
  d_nikke_marian_queen_01_82:
    speaker: marian
    en: "...!"
    ko: "!!"
    ja: "！！"
  d_nikke_marian_queen_01_83:
    speaker: marian
    en: That's cheating!
    ko: 그 대답은 반칙이잖아요!
    ja: その答えはずるいですよ！
  d_nikke_marian_queen_01_84:
    speaker: marian
    en: Tell me what you actually want to do!
    ko: 제대로 된 걸 말씀해주세요!
    ja: 自分のやりたいことを教えてください！
  d_nikke_marian_queen_01_85:
    speaker: "<Self>"
    en: But that is what I actually want to do.
    ko: 하지만 정말 그게 내가 하고 싶은 일인 걸?
    ja: でも、本当なんだ
  d_nikke_marian_queen_01_86:
    speaker: "<Narration>"
    en: For a moment, Marian pouts at the Commander.
    ko: 잠시 동안, 마리안은 뾰로통한 표정으로 지휘관을 바라본다.
    ja: |-
      しばらくの間、マリアンは
      拗ねた表情で指揮官を見つめていた
  d_nikke_marian_queen_01_87:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_88:
    speaker: marian
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  d_nikke_marian_queen_01_89:
    speaker: marian
    en: Do you think we'll stay like this forever?
    ko: 이런 날이 앞으로도 계속 이어질 수 있을까요…?
    ja: |-
      こんな日が、これからもずっと
      続くんでしょうか…？
  d_nikke_marian_queen_01_90:
    speaker: "<Self>"
    en: Huh? What do you mean?
    ko: 왜 갑자기 불안해졌어?
    ja: どうしたんだ？急に
  d_nikke_marian_queen_01_91:
    speaker: marian
    en: I'm just so happy right now.
    ko: 지금 이 순간이 너무 행복해서요.
    ja: 今この瞬間が、とても幸せで…
  d_nikke_marian_queen_01_92:
    speaker: marian
    en: You know, talking about what we want to do,
    ko: 해보고 싶은 걸 서로 이야기해 주고,
    ja: やりたいことを話したり…
  d_nikke_marian_queen_01_93:
    speaker: marian
    en: and giving each other a hard time and stuff...
    ko: 서로 투닥거리기도 하고….
    ja: ふざけ合ったり…
  d_nikke_marian_queen_01_94:
    speaker: marian
    en: Now that I've experienced happiness like this,
    ko: 이렇게 한 번 행복을 느껴보고 나니까,
    ja: こうして一度、幸せを感じてしまうと、
  d_nikke_marian_queen_01_95:
    speaker: marian
    en: I'm starting to get afraid that I'll lose it...
    ko: 점점 이 행복을 잃게 되지 않을까 불안한 마음이 커져요….
    ja: |-
      この幸せが失われるんじゃないかって、
      不安がどんどん大きくなるんです…
  d_nikke_marian_queen_01_96:
    speaker: "<Self>"
    en: Don't worry. We just need to keep making little happy moments like this, one
      day at a time.
    ko: 괜찮아. 우리가 이 행복을 이어나가면 돼. 하나씩, 천천히.
    ja: |-
      心配するな。この幸せをつないでいけばいい。
      ひとつずつ、ゆっくりと
  d_nikke_marian_queen_01_97:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_01_98:
    speaker: marian
    en: You're right. One day at a time...
    ko: 그렇네요. 하나씩, 천천히….
    ja: そうですね。ひとつずつ、ゆっくりと…
  d_nikke_marian_queen_01_99:
    speaker: "<Narration>"
    en: Marian smiles faintly as she mulls over his words.
    ko: 마리안은 지휘관의 말을 곱씹으며, 희미하게 웃었다.
    ja: |-
      マリアンは指揮官の言葉を噛み締めながら、
      かすかに微笑んだ
d_nikke_marian_queen_02:
  d_nikke_marian_queen_02_1:
    speaker: marian
    en: Mmm...
    ko: 으음….
    ja: うぅん…
  d_nikke_marian_queen_02_2:
    speaker: "<Narration>"
    en: Marian opens her eyes to a gentle touch on her head.
    ko: 마리안은 머리에 느껴지는 부드러운 손길에 눈을 뜬다.
    ja: |-
      マリアンは頭を優しくなでる
      手の感触で目を覚ました
  d_nikke_marian_queen_02_3:
    speaker: "<Self>"
    en: Good morning.
    ko: 일어났어?
    ja: 起きたか？
  d_nikke_marian_queen_02_4:
    speaker: marian
    en: Comman...der...
    ko: 지휘… 관….
    ja: 指揮…官…
  d_nikke_marian_queen_02_5:
    speaker: "<Self>"
    en: So? How does it feel to cross something off your bucket list?
    ko: 어때? 버킷 리스트를 하나 달성한 소감은.
    ja: |-
      どうだ？やりたいことリストの
      ひとつを達成した気分は
  d_nikke_marian_queen_02_6:
    speaker: marian
    en: My bucket list...?
    ko: 버킷 리스트…?
    ja: やりたいことリスト…？
  d_nikke_marian_queen_02_7:
    speaker: "<Narration>"
    en: Marian places her hand on the Commander's.
    ko: 마리안은 지휘관의 손에 자신의 손을 포갠다.
    ja: マリアンは指揮官の手に自分の手を重ねた
  d_nikke_marian_queen_02_8:
    speaker: marian
    en: This is what I mentioned yesterday...
    ko: 이거, 어제 말했던 버킷 리스트….
    ja: これって、昨日話した…
  d_nikke_marian_queen_02_9:
    speaker: "<Self>"
    en: Yeah. You wanted to wake up to a gentle touch, right?
    ko: 응. 마리안이 부드러운 손길을 느끼며 일어나보고 싶댔잖아.
    ja: |-
      ああ。優しくなでられながら目覚めてみたいって
      言っただろう？
  d_nikke_marian_queen_02_10:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_11:
    speaker: marian
    en: This is why you insisted on taking night watch last night, isn't it?
    ko: 이러려고 어젯밤엔 지휘관이 불침번을 서겠다고 한 거였군요?
    ja: |-
      だから、自分が寝ずの番をすると
      言ってくださったんですね？
  d_nikke_marian_queen_02_12:
    speaker: "<Self>"
    en: You were really hard to convince.
    ko: 마리안이 양보해주지 않으니까 꽤 힘들었어.
    ja: |-
      マリアンがなかなか譲ってくれないから、
      大変だった
  d_nikke_marian_queen_02_13:
    speaker: marian
    en: Well, yeah. Keeping watch is supposed to be my job.
    ko: 원래는 제가 해야 할 일이니까요.
    ja: だって、本来は私がするべきことですから。
  d_nikke_marian_queen_02_14:
    speaker: marian
    en: Wait...
    ko: "…?"
    ja: "…？"
  d_nikke_marian_queen_02_15:
    speaker: "<Narration>"
    en: Marian gently touches the skin under the Commander's eyes.
    ko: 마리안은 지휘관의 눈 밑을 어루만졌다.
    ja: マリアンは指揮官の目の下をそっとなでた
  d_nikke_marian_queen_02_16:
    speaker: marian
    en: Commander.
    ko: 지휘관.
    ja: 指揮官。
  d_nikke_marian_queen_02_17:
    speaker: marian
    en: Did you realize you have bags under your eyes?
    ko: 눈 밑에 다크서클이 엄청 진한 거 아세요?
    ja: |-
      目の下のクマがすごいことになっています、
      ご存じでしたか？
  d_nikke_marian_queen_02_18:
    speaker: "<Self>"
    en: Are they that bad?
    ko: 많이 심해?
    ja: そんなにか？
  d_nikke_marian_queen_02_19:
    speaker: marian
    en: Yeah, they're pretty dark.
    ko: 예. 생각보다 되게 진해요.
    ja: ええ、きっとご想像より濃いですよ。
  d_nikke_marian_queen_02_20:
    speaker: "<Self>"
    en: Well, it happens. Some days you just have bags under your eyes.
    ko: 뭐 어쩌다 가끔 그런 날도 있겠지.
    ja: まあ、たまにはそういう日もあるだろう
  d_nikke_marian_queen_02_21:
    speaker: marian
    en: They don't look like they're from just one night of watch, though...
    ko: 이건 불침번 섰다고 생기는 수준이 아닌 것 같은데….
    ja: 一晩でこうはならない気がするんですが…
  d_nikke_marian_queen_02_22:
    speaker: "<Self>"
    en: Anyway, wanna go eat? I made breakfast.
    ko: 일단 밥부터 먹으러 갈까? 미리 식사도 다 준비해놨어.
    ja: |-
      とりあえず朝食を食べようか？
      もう用意してあるんだ
  d_nikke_marian_queen_02_23:
    speaker: marian
    en: But...
    ko: 그치만….
    ja: でも…
  d_nikke_marian_queen_02_24:
    speaker: "<Self>"
    en: I'm fine, I'm fine. I'm sure they'll go away after I eat.
    ko: 괜찮아, 괜찮아. 밥 먹고 나면 나아져.
    ja: 平気だ。食事をすればよくなるだろう
  d_nikke_marian_queen_02_25:
    speaker: "<Narration>"
    en: The Commander tries to scoop Marian up in his arms.
    ko: 지휘관이 마리안을 안아 올리려고 한다.
    ja: 指揮官がマリアンを抱き上げようとした
  d_nikke_marian_queen_02_26:
    speaker: marian
    en: W-wait a moment!
    ko: 자, 자, 잠깐만요!
    ja: ま、ま、待ってください！
  d_nikke_marian_queen_02_27:
    speaker: marian
    en: I can walk on my own!
    ko: 제 발로 걸어서 갈게요!
    ja: 自分で歩けます！
  d_nikke_marian_queen_02_28:
    speaker: "<Self>"
    en: Isn't carrying you to the table the next step?
    ko: 이 다음에 안아서 식탁에 가는 것까지가 정해진 순서 아니야?
    ja: |-
      抱き上げてテーブルに行くまでが
      お決まりのパターンじゃないのか？
  d_nikke_marian_queen_02_29:
    speaker: marian
    en: I could see how you'd think that, but I...
    ko: 아니, 그렇게 볼 수도 있긴 한데요….
    ja: そ、そうかもしれませんが…
  d_nikke_marian_queen_02_30:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_31:
    speaker: "<Self>"
    en: "??"
    ko: "??"
    ja: "…？"
  d_nikke_marian_queen_02_32:
    speaker: marian
    en: "... I don't want you to think I'm heavy."
    ko: "…지휘관에게 무겁다는 말은 듣고 싶지 않아요."
    ja: "…指揮官に重いって思われたくないんです。"
  d_nikke_marian_queen_02_33:
    speaker: "<Self>"
    en: I'd never say that.
    ko: 내가 무겁다고 할 리 없잖아.
    ja: そんなこと言うわけないだろう
  d_nikke_marian_queen_02_34:
    speaker: marian
    en: Y-yeah, but I don't even want you to think it.
    ko: 그, 그런 생각이 들게 하는 것도 싫어요.
    ja: そ、そう思われるだけでもイヤです。
  d_nikke_marian_queen_02_35:
    speaker: "<Narration>"
    en: Marian throws off her blanket and gets up.
    ko: 마리안이 담요를 제치며 자리에서 일어난다.
    ja: マリアンは毛布をどけて、立ち上がった
  d_nikke_marian_queen_02_36:
    speaker: marian
    en: What I wanted was to wake up and eat a breakfast that you'd made while I slept,
    ko: 아침에 일어나서 준비된 식사를 먹으러 가는 거였으니까,
    ja: |-
      私のやりたいことリストは、朝起きて
      用意してもらった食事を食べることですから…
  d_nikke_marian_queen_02_37:
    speaker: marian
    en: which means that we can still check it off the list without you carrying me
      to the table. Right?
    ko: 이대로 가도 버킷 리스트 달성에는 아무 문제 없어요. 맞죠?
    ja: |-
      自分で行っても、かなえたことになります。
      そうですよね？
  d_nikke_marian_queen_02_38:
    speaker: "<Self>"
    en: Right.
    ko: 그렇긴 하지.
    ja: 確かにそうだな
  d_nikke_marian_queen_02_39:
    speaker: marian
    en: Okay, then just let's do that.
    ko: 그러니까 여기서 더 뭘 해주려고 하시지 않아도 돼요.
    ja: |-
      ですから、これ以上私のために
      何かしてくださらなくて大丈夫です。
  d_nikke_marian_queen_02_40:
    speaker: marian
    en: Now, is the food over there?
    ko: 자, 식사를 준비해두신 곳은 저쪽인가요?
    ja: |-
      さあ、食事を用意してくださったのは
      あちらですか？
  d_nikke_marian_queen_02_41:
    speaker: marian
    en: Let's go eat.
    ko: 어서 가요, 지휘관.
    ja: 早く行きましょう、指揮官。
  d_nikke_marian_queen_02_42:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_43:
    speaker: "<Narration>"
    en: The Commander smiles and follows Marian.
    ko: 지휘관은 빙그레 웃으며, 마리안의 뒤를 따라 나섰다.
    ja: 指揮官は微笑み、マリアンの後を追った
  d_nikke_marian_queen_02_44:
    speaker: marian
    en: Thank you for the meal.
    ko: 잘 먹었습니다.
    ja: ごちそうさまでした。
  d_nikke_marian_queen_02_45:
    speaker: "<Self>"
    en: I wish I could've made something better.
    ko: 더 맛있는 걸 준비할 수 있었으면 좋았을 텐데.
    ja: |-
      もっとおいしいものを
      用意できればよかったんだが…
  d_nikke_marian_queen_02_46:
    speaker: marian
    en: Given the circumstances, this was a feast.
    ko: 지금 상황에 이 정도면 진수성찬이죠.
    ja: こんな状況です、十分なごちそうですよ。
  d_nikke_marian_queen_02_47:
    speaker: marian
    en: Everything tasted really good.
    ko: 정말 맛있었어요.
    ja: 本当においしかったです。
  d_nikke_marian_queen_02_48:
    speaker: marian
    en: There were a lot of things I actually hadn't ever seen before.
    ko: 그런데 처음 보는 음식들이 많았네요?
    ja: |-
      ところで、初めて見るものが
      たくさんありましたけど…
  d_nikke_marian_queen_02_49:
    speaker: marian
    en: Where did you get all of it?
    ko: 다 어디서 구하신 거예요?
    ja: どこで手に入れたんですか？
  d_nikke_marian_queen_02_50:
    speaker: "<Self>"
    en: "... It was just stuff that we already had."
    ko: "…원래 있던 것들이야."
    ja: "…元からあったものだ"
  d_nikke_marian_queen_02_51:
    speaker: "<Narration>"
    en: Marian looks the Commander in the eyes.
    ko: 마리안이 지휘관의 눈을 바라본다.
    ja: マリアンが指揮官の目を見つめた
  d_nikke_marian_queen_02_52:
    speaker: "<Narration>"
    en: The Commander avoids her gaze.
    ko: 지휘관이 마리안의 시선을 피한다.
    ja: 指揮官はマリアンから視線をそらした
  d_nikke_marian_queen_02_53:
    speaker: "<Narration>"
    en: "*Poke*"
    ko: 꾸욱-
    ja: ツンッ――
  d_nikke_marian_queen_02_54:
    speaker: "<Narration>"
    en: She pokes him in the side.
    ko: 마리안이 지휘관의 옆구리를 찌른다.
    ja: マリアンが指揮官の脇腹をつついた
  d_nikke_marian_queen_02_55:
    speaker: "<Self>"
    en: Ack!
    ko: 으핫!
    ja: うわぁっ！
  d_nikke_marian_queen_02_56:
    speaker: "<Narration>"
    en: "*Poke, poke*"
    ko: 꾸욱- 꾸욱-
    ja: ツンッ、ツンッ――
  d_nikke_marian_queen_02_57:
    speaker: "<Self>"
    en: Hahaha!
    ko: 으하핫!
    ja: はははっ！
  d_nikke_marian_queen_02_58:
    speaker: marian
    en: The only food we have are the rations we brought with us,
    ko: 저희가 가지고 있는 식량은 출발할 때 챙겨온 보존식밖에 없어요.
    ja: |-
      私たちの食料は、
      出発の時に持っていた保存食だけです。
  d_nikke_marian_queen_02_59:
    speaker: marian
    en: and I always keep track of how much we have left.
    ko: 남은 수량은 제가 항상 파악하고 있고요.
    ja: 残りの量も、私が把握しています。
  d_nikke_marian_queen_02_60:
    speaker: marian
    en: Plus, we didn't pick up any supplies on the way here.
    ko: 게다가 여기까지 오는 길에 따로 식량을 보급한 적도 없죠.
    ja: |-
      それに、途中で食料を補給したことも
      ありませんよね。
  d_nikke_marian_queen_02_61:
    speaker: marian
    en: All of that is to say, this wasn't stuff we already had.
    ko: 그렇다는 건, 이것들이 원래부터 있던 게 아니라는 뜻이에요.
    ja: |-
      つまり、これは元から
      あったものではないということです。
  d_nikke_marian_queen_02_62:
    speaker: marian
    en: Now, tell me the truth. Where did you get it?
    ko: 자, 빨리 사실대로 대답해주세요. 어디서 구하신 거예요?
    ja: |-
      さあ、正直に話してください。
      どこで手に入れたんですか？
  d_nikke_marian_queen_02_63:
    speaker: "<Self>"
    en: I found it while I was walking around the area here at dawn.
    ko: 새벽에 주변을 돌아다니다가 이것저것 찾은 거야.
    ja: |-
      明け方に辺りを歩き回って、
      いろいろ見つけたんだ
  d_nikke_marian_queen_02_64:
    speaker: marian
    en: While you were on night watch?
    ko: 불침번 설 때요?
    ja: 寝ずの番の時に、ですか？
  d_nikke_marian_queen_02_65:
    speaker: "<Self>"
    en: Yeah.
    ko: 응.
    ja: そうだ
  d_nikke_marian_queen_02_66:
    speaker: marian
    en: You went out alone at dawn?
    ko: 새벽에 혼자서요?
    ja: 明け方に、一人で？
  d_nikke_marian_queen_02_67:
    speaker: "<Self>"
    en: "... Yeah."
    ko: "…응."
    ja: "…ああ"
  d_nikke_marian_queen_02_68:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_69:
    speaker: marian
    en: What's gotten into you? First yesterday, and now this.
    ko: 어제부터 자꾸 왜 이러시는 거예요….
    ja: |-
      昨日から、どうしてそんなこと
      ばかりするんですか…
  d_nikke_marian_queen_02_70:
    speaker: marian
    en: You could've been in danger.
    ko: 자칫하면 지휘관이 위험해질 수도 있던 거잖아요.
    ja: |-
      一歩間違えれば、危険な目に
      遭っていたかもしれないんですよ？
  d_nikke_marian_queen_02_71:
    speaker: "<Self>"
    en: I just want to make as many memories with you as possible.
    ko: 난 그냥 마리안과 최대한 많은 추억을 만들고 싶었어.
    ja: |-
      私はただ、マリアンとできるだけ
      たくさんの思い出を作りたかっただけだ
  d_nikke_marian_queen_02_72:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_73:
    speaker: marian
    en: When you put it like that, I don't know what to say...
    ko: 그렇게 대답하시면, 저도 더 할 말이 없어지잖아요….
    ja: |-
      そんなふうに言われたら…私もこれ以上
      何も言えなくなっちゃうじゃないですか…
  d_nikke_marian_queen_02_74:
    speaker: "<Narration>"
    en: Marian takes hold of the Commander's hand.
    ko: 마리안이 지휘관의 손을 붙잡는다.
    ja: マリアンが指揮官の手を握りしめた
  d_nikke_marian_queen_02_75:
    speaker: marian
    en: You don't have to try to surprise me or anything,
    ko: 깜짝 이벤트가 아니어도 되니까,
    ja: サプライズじゃなくていいですから。
  d_nikke_marian_queen_02_76:
    speaker: marian
    en: so don't go doing everything on your own.
    ko: 뭐든 혼자서 하려고 하진 않았으면 좋겠어요.
    ja: 何でも一人でやろうとしないでほしいです。
  d_nikke_marian_queen_02_77:
    speaker: marian
    en: Memories are only ours if we make them together, right?
    ko: 함께 만들어야 우리들의 추억이라고 할 수 있는 거잖아요?
    ja: |-
      一緒に作るから、
      私たちの思い出って言えるんじゃないですか？
  d_nikke_marian_queen_02_78:
    speaker: "<Self>"
    en: "... Okay, I'll try to be better about it."
    ko: "…노력은 해 볼게."
    ja: "…努力はする"
  d_nikke_marian_queen_02_79:
    speaker: marian
    en: You're not hiding anything else, right?
    ko: 그럼 더 숨기고 있는 건 없으신 거죠?
    ja: もう隠していることはありませんね？
  d_nikke_marian_queen_02_80:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_81:
    speaker: marian
    en: You are, aren't you?!
    ko: 설마 아직 뭘 더 하실 생각…!
    ja: まさか、まだ何か…！
  d_nikke_marian_queen_02_82:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_02_83:
    speaker: "<Narration>"
    en: Marian pulls away from the Commander.
    ko: 마리안이 지휘관과 떨어진다.
    ja: マリアンが指揮官から離れた
  d_nikke_marian_queen_02_84:
    speaker: marian
    en: "... I see Raptures up ahead."
    ko: "…전방에 랩쳐 확인."
    ja: "…前方にラプチャーを確認。"
  d_nikke_marian_queen_02_85:
    speaker: "<Self>"
    en: "...!"
    ko: "!!"
    ja: "！！"
  d_nikke_marian_queen_02_86:
    speaker: marian
    en: Fortunately, they don't seem to be coming this way yet.
    ko: 다행히 아직 이쪽으로 접근하려는 기색은 없네요.
    ja: |-
      幸い、まだこちらに近づいてくる
      気配はありません。
  d_nikke_marian_queen_02_87:
    speaker: marian
    en: I think we can avoid them if we move now.
    ko: 지금이라면 마주치지 않고 이동할 수 있을 것 같아요.
    ja: 今なら遭遇せずに移動できそうです。
  d_nikke_marian_queen_02_88:
    speaker: "<Self>"
    en: Then let's take a detour.
    ko: 그럼 조금 우회해서 돌아가는 걸로 하자.
    ja: では、少し迂回して戻ろう
  d_nikke_marian_queen_02_89:
    speaker: marian
    en: Yeah.
    ko: 예, 지휘관.
    ja: はい、指揮官。
d_nikke_marian_queen_03:
  d_nikke_marian_queen_03_1:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_03_2:
    speaker: marian
    en: Looks like there are Raptures over here too.
    ko: 여기에서도 랩쳐가 보이기 시작하네요.
    ja: ここでもラプチャーが現われ始めましたね。
  d_nikke_marian_queen_03_3:
    speaker: marian
    en: If we go this way, we won't be able to avoid a fight.
    ko: 이쪽 방향으로 이동하려면 전투는 불가피하겠어요.
    ja: |-
      こちらの方向に進むとなると、
      戦闘は避けられそうにありません。
  d_nikke_marian_queen_03_4:
    speaker: "<Self>"
    en: What about that way over there?
    ko: 그럼 저쪽은 어때?
    ja: じゃあ、あちらは？
  d_nikke_marian_queen_03_5:
    speaker: "<Narration>"
    en: The Commander points in another direction.
    ko: 지휘관이 손가락으로 방향을 가리켰다.
    ja: 指揮官が指で方向を指し示した
  d_nikke_marian_queen_03_6:
    speaker: "<Self>"
    en: It's a long way around, but we'll definitely avoid a fight.
    ko: 많이 돌아가는 게 되겠지만, 전투는 확실하게 피할 수 있을 거야.
    ja: |-
      かなり遠回りにはなるが、
      戦闘は確実に避けられるはずだ
  d_nikke_marian_queen_03_7:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_03_8:
    speaker: marian
    en: That does look like the best route.
    ko: 확실히 저쪽 방향이 최적의 루트이긴 하겠네요.
    ja: 確かにあちらが、最適なルートでしょうね。
  d_nikke_marian_queen_03_9:
    speaker: marian
    en: There are no Raptures in sight, and it'd be easy to take cover if we need
      to.
    ko: 눈에 띄는 랩쳐도 없고, 여차하면 은폐하기도 용이할 테니까요.
    ja: |-
      ラプチャーも見当たりませんし、
      いざという時も身を隠しやすそうですから。
  d_nikke_marian_queen_03_10:
    speaker: marian
    en: It'll be more physically demanding than flat ground, though...
    ko: 그런데 평지보다는 체력적인 부담이 더 있을 것 같은데….
    ja: |-
      ただ、平地よりは体力的な負担が
      大きくなると思いますが…
  d_nikke_marian_queen_03_11:
    speaker: "<Narration>"
    en: Marian looks at the Commander with concern.
    ko: 마리안이 지휘관을 걱정스레 바라본다.
    ja: マリアンが心配そうに指揮官を見つめた
  d_nikke_marian_queen_03_12:
    speaker: marian
    en: Will you be okay?
    ko: 괜찮으시겠어요?
    ja: 問題ありませんか？
  d_nikke_marian_queen_03_13:
    speaker: "<Self>"
    en: Yeah, no problem.
    ko: 괜찮아. 문제없어.
    ja: ああ、問題ない
  d_nikke_marian_queen_03_14:
    speaker: marian
    en: Then we'll head over that way.
    ko: 그러면 저쪽으로 우회해서 이동하도록 할게요.
    ja: |-
      では、あちらに迂回して
      移動することにしましょう。
  d_nikke_marian_queen_03_15:
    speaker: marian
    en: Let me know as soon as you start to get tired.
    ko: 조금이라도 힘들면 언제든지 말씀해주세요.
    ja: |-
      少しでもつらいと思ったら、
      いつでもおっしゃってくださいね。
  d_nikke_marian_queen_03_16:
    speaker: "<Narration>"
    en: "*Rustle, rustle*"
    ko: 부스럭부스럭-
    ja: ガサガサ――
  d_nikke_marian_queen_03_17:
    speaker: marian
    en: Are you okay, Commander?
    ko: 지휘관, 좀 괜찮으세요?
    ja: 指揮官、大丈夫ですか？
  d_nikke_marian_queen_03_18:
    speaker: "<Self>"
    en: Yes, I'm fine.
    ko: 응. 괜찮아.
    ja: ああ、大丈夫だ
  d_nikke_marian_queen_03_19:
    speaker: marian
    en: Okay, great.
    ko: 다행이네요.
    ja: よかったです。
  d_nikke_marian_queen_03_20:
    speaker: marian
    en: I'm sure there will be an easier path somewhere ahead. Just hang in there
      a little longer.
    ko: 편한 길이 나올 때까지, 조금만 더 버텨주세요.
    ja: |-
      平坦な道に出るまで、
      もう少しだけ頑張ってください。
  d_nikke_marian_queen_03_21:
    speaker: "<Self>"
    en: What about you, Marian? Are you okay?
    ko: 마리안이야말로 괜찮아?
    ja: マリアンこそ大丈夫か？
  d_nikke_marian_queen_03_22:
    speaker: "<Self>"
    en: You've been leading the way and clearing the brush this whole time...
    ko: 계속 앞장서서 수풀을 헤쳐주고 있는데….
    ja: |-
      ずっと先頭に立って、
      茂みをかき分けてくれている…
  d_nikke_marian_queen_03_23:
    speaker: "<Narration>"
    en: Marian smiles.
    ko: 마리안이 웃는다.
    ja: マリアンが微笑んだ
  d_nikke_marian_queen_03_24:
    speaker: marian
    en: I'm fine. Remember, I'm a Nikke.
    ko: 저도 괜찮아요. 전 니케니까요.
    ja: 私も大丈夫です。私はニケですから。
  d_nikke_marian_queen_03_25:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_03_26:
    speaker: "<Narration>"
    en: Marian clears a path through the brush,
    ko: 마리안이 수풀을 헤집고,
    ja: マリアンが茂みをかき分け
  d_nikke_marian_queen_03_27:
    speaker: "<Narration>"
    en: while the Commander follows behind her,
    ko: 지휘관이 뒤를 따라가며,
    ja: 指揮官がその後を追い
  d_nikke_marian_queen_03_28:
    speaker: "<Narration>"
    en: and the two keep moving forward.
    ko: 둘은 계속해서 앞으로 나아간다.
    ja: 二人はそのまま先へと進んでいった
  d_nikke_marian_queen_03_29:
    speaker: "<Narration>"
    en: "*Drip*"
    ko: 또르르-
    ja: ポタポタ――
  d_nikke_marian_queen_03_30:
    speaker: marian
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_marian_queen_03_31:
    speaker: "<Self>"
    en: That's the sound of water dripping, isn't it?
    ko: 이거 물방울 소리지?
    ja: 水滴の音か？
  d_nikke_marian_queen_03_32:
    speaker: marian
    en: Yeah! I think it's just up ahead!
    ko: 예! 이 앞인 것 같아요!
    ja: はい！この先みたいです！
  d_nikke_marian_queen_03_33:
    speaker: marian
    en: Let's go straight through here!
    ko: 곧장 앞으로 갈게요!
    ja: このまま、まっすぐ進みますね！
  d_nikke_marian_queen_03_34:
    speaker: "<Narration>"
    en: Marian forces her way through the brush.
    ko: 마리안이 거칠게 수풀을 헤집고 나아갔다.
    ja: |-
      マリアンは勢いよく茂みをかき分けて
      進んでいった
  d_nikke_marian_queen_03_35:
    speaker: marian
    en: There's a pool of water!
    ko: 여기 물 웅덩이가 있어요!
    ja: ここに水たまりがあります！
  d_nikke_marian_queen_03_36:
    speaker: "<Narration>"
    en: Marian scoops up some water with one hand.
    ko: 마리안이 한 손으로 물을 떠보았다.
    ja: マリアンが片手で水をすくった
  d_nikke_marian_queen_03_37:
    speaker: marian
    en: It looks clean, too...
    ko: 물 상태도 양호한 것 같고….
    ja: 水の状態もよさそうですし…
  d_nikke_marian_queen_03_38:
    speaker: marian
    en: We could set up camp and rest here.
    ko: 여기라면 임시 베이스를 만들어서 쉴 수도 있겠어요.
    ja: |-
      ここを拠点として、
      少し休むこともできそうですね。
  d_nikke_marian_queen_03_39:
    speaker: marian
    en: Is that okay with you, Com...
    ko: 지휘관, 괜찮으시겠….
    ja: 指揮官、大丈夫で…
  d_nikke_marian_queen_03_40:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_03_41:
    speaker: marian
    en: Pfft. Hehe.
    ko: 푸훗.
    ja: ふふっ。
  d_nikke_marian_queen_03_42:
    speaker: "<Self>"
    en: What is it?
    ko: "?"
    ja: "？"
  d_nikke_marian_queen_03_43:
    speaker: marian
    en: You're covered in grass.
    ko: 온몸에 풀을 달고 계시네요.
    ja: 体中、草だらけです。
  d_nikke_marian_queen_03_44:
    speaker: marian
    en: And your clothes are all dusty.
    ko: 옷에 먼지도 잔뜩 쌓였고요.
    ja: 服にもホコリがいっぱい。
  d_nikke_marian_queen_03_45:
    speaker: marian
    en: We should get you brushed off.
    ko: 좀 털어내셔야겠어요.
    ja: 少し払ったほうがよさそうですね。
  d_nikke_marian_queen_03_46:
    speaker: "<Narration>"
    en: Marian brushes the grass off the Commander.
    ko: 마리안이 지휘관의 몸을 털어준다.
    ja: マリアンは指揮官の体についた汚れを払った
  d_nikke_marian_queen_03_47:
    speaker: "<Self>"
    en: You might need it more than me.
    ko: 마리안이 더 많이 털어야겠어.
    ja: マリアンこそ
  d_nikke_marian_queen_03_48:
    speaker: "<Narration>"
    en: The Commander brushes the grass off Marian too.
    ko: 지휘관도 마리안의 몸을 털어준다.
    ja: 指揮官もマリアンの体を払った
  d_nikke_marian_queen_03_49:
    speaker: "<Self>"
    en: Sorry for putting you through all this.
    ko: 고생하게 해서 미안해.
    ja: 苦労をかけてすまない
  d_nikke_marian_queen_03_50:
    speaker: "<Self>"
    en: Making you lead the way alone the whole time...
    ko: 계속 혼자 앞장서게 하고….
    ja: ずっと一人で先を歩かせてしまって…
  d_nikke_marian_queen_03_51:
    speaker: marian
    en: It's no problem at all. This is what I'm supposed to do.
    ko: 괜찮아요. 이게 제가 해야 할 일인 걸요.
    ja: |-
      そんなこと言わないでください。
      これが私の役目ですから。
  d_nikke_marian_queen_03_52:
    speaker: marian
    en: "... More importantly, we've both gotten pretty dirty from all that walking."
    ko: "…그것보다, 한참을 걸었더니 둘 다 많이 지저분해졌네요."
    ja: |-
      …それより、ずいぶん歩いたので、
      二人ともすっかり汚れてしまいました。
  d_nikke_marian_queen_03_53:
    speaker: marian
    en: Now that we have water, why don't we wash up?
    ko: 마침 물도 발견했으니까, 여기서 씻는 건 어떨까요?
    ja: |-
      ちょうど水も見つかりましたし、
      ここで体を洗っていきませんか？
  d_nikke_marian_queen_03_54:
    speaker: "<Self>"
    en: Yeah, good idea. You should wash up first.
    ko: 그러자. 마리안이 먼저 씻는 게 좋지 않겠어?
    ja: |-
      そうしよう。
      先にマリアンが洗ってくれ
  d_nikke_marian_queen_03_55:
    speaker: marian
    en: Actually, I think I should go scout the area first.
    ko: 전 주변 정찰을 돌고 와야 할 것 같아요.
    ja: 私は周辺の偵察をしてきます。
  d_nikke_marian_queen_03_56:
    speaker: marian
    en: It looks safe, but just in case.
    ko: 안전해 보이기는 하는데, 혹시라는 게 있으니까요.
    ja: |-
      安全そうに見えますが、
      万が一ということもありますから。
  d_nikke_marian_queen_03_57:
    speaker: marian
    en: You can wash up first.
    ko: 그동안 지휘관이 먼저 씻어주세요.
    ja: その間に、お先にどうぞ。
  d_nikke_marian_queen_03_58:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…알았어."
    ja: "…分かった"
  d_nikke_marian_queen_03_59:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_marian_queen_03_60:
    speaker: "<Self>"
    en: All right, I'm done. Your turn.
    ko: 나 왔어. 이제 마리안 차례야.
    ja: 洗ったぞ。次はマリアンの番だ
  d_nikke_marian_queen_03_61:
    speaker: marian
    en: That was quick.
    ko: 빨리 오셨네요?
    ja: ずいぶん早かったですね？
  d_nikke_marian_queen_03_62:
    speaker: "<Self>"
    en: I wasn't that dirty. Now go get washed up, and hurry back.
    ko: 엄청 지저분한 상태는 아니었잖아. 마리안도 빨리 씻고 와.
    ja: |-
      そんなに汚れていなかったからな。
      マリアンも早く体を洗ってくれ
  d_nikke_marian_queen_03_63:
    speaker: marian
    en: Okay. I'll be back before you know it.
    ko: 예, 금방 다녀올게요.
    ja: はい、すぐに戻りますね。
  d_nikke_marian_queen_03_64:
    speaker: "<Narration>"
    en: On her way to wash up, Marian stops.
    ko: 마리안이 씻으러 가다가 멈춰 섰다.
    ja: |-
      マリアンは体を洗いに行こうとして、
      ふと足を止めた
  d_nikke_marian_queen_03_65:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_03_66:
    speaker: "<Self>"
    en: What is it?
    ko: "?"
    ja: "？"
  d_nikke_marian_queen_03_67:
    speaker: marian
    en: Um...
    ko: 저….
    ja: あの…
  d_nikke_marian_queen_03_68:
    speaker: "<Self>"
    en: Oh, right. Don't worry. I won't peek.
    ko: 알았어. 안 훔쳐볼게.
    ja: 分かっている。のぞいたりはしない
  d_nikke_marian_queen_03_69:
    speaker: marian
    en: Th-that's not what I meant...!
    ko: 그, 그게 아니라요…!
    ja: そ、そうではなくて…！
  d_nikke_marian_queen_03_70:
    speaker: marian
    en: I checked and there aren't any Raptures nearby, so it should be fine,
    ko: 일단 주변에 랩쳐가 없다는 건 확인해서 괜찮은데,
    ja: |-
      周りにラプチャーがいないことは
      確認したので大丈夫だとは思うのですが…
  d_nikke_marian_queen_03_71:
    speaker: marian
    en: but please don't wander too far.
    ko: 혹시라도 너무 멀리는 가시면 안 돼요.
    ja: |-
      万が一ということもあります。
      あまり遠くには行かないでくださいね。
  d_nikke_marian_queen_03_72:
    speaker: marian
    en: And if anything happens, call me right away. Got it?
    ko: 만약 뭔가 나타나면 바로 절 불러주시고요. 아셨죠?
    ja: |-
      もし何か現れたら、
      すぐに私を呼んでください。いいですか？
  d_nikke_marian_queen_03_73:
    speaker: "<Narration>"
    en: The Commander nods.
    ko: 지휘관이 고개를 끄덕였다.
    ja: 指揮官はうなずいた
  d_nikke_marian_queen_03_74:
    speaker: marian
    en: Good... I'll be back.
    ko: 그럼… 다녀올게요.
    ja: それじゃ…行ってきます。
  d_nikke_marian_queen_03_75:
    speaker: "<Narration>"
    en: However, when Marian gets back...
    ko: 하지만 마리안이 씻고 돌아왔을 때,
    ja: だが、マリアンが戻った時…
  d_nikke_marian_queen_03_76:
    speaker: marian
    en: Commander...?
    ko: 지휘관…?
    ja: 指揮官…？
  d_nikke_marian_queen_03_77:
    speaker: "<Narration>"
    en: "... she only finds footprints where the Commander should have been waiting."
    ko: 지휘관이 기다리고 있어야 할 곳에는 군화 발자국만 남아있었다.
    ja: |-
      指揮官が待っているはずの場所には、
      軍靴の足跡しか残されていなかった
  d_nikke_marian_queen_03_78:
    speaker: marian
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_marian_queen_03_79:
    speaker: "<Narration>"
    en: A sense of dread suddenly comes over her.
    ko: 문득 불안한 예감이 머리를 스친다.
    ja: ふと、嫌な予感が脳裏をよぎった
  d_nikke_marian_queen_03_80:
    speaker: marian
    en: No...
    ko: 설마.
    ja: まさか…
  d_nikke_marian_queen_03_81:
    speaker: marian
    en: There's no way he...
    ko: 설마, 아니겠죠?
    ja: まさか、そんなはずないですよね？
  d_nikke_marian_queen_03_82:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_03_83:
    speaker: marian
    en: Commander!
    ko: 지휘관!
    ja: 指揮官！
  d_nikke_marian_queen_03_84:
    speaker: marian
    en: Where are you?!
    ko: 어디 계세요!
    ja: どこにいるんですか！
d_nikke_marian_queen_04:
  d_nikke_marian_queen_04_1:
    speaker: "<Narration>"
    en: Marian runs as she follows the footprints.
    ko: 마리안이 발자국을 따라 달린다.
    ja: マリアンは足跡をたどって走っている
  d_nikke_marian_queen_04_2:
    speaker: marian
    en: Commander...!
    ko: 지휘관…!
    ja: し、指揮官…！
  d_nikke_marian_queen_04_3:
    speaker: marian
    en: Where did you go?!
    ko: 대체 어디로 가신 거예요!
    ja: いったいどこにいるんですか！？
  d_nikke_marian_queen_04_4:
    speaker: "<Narration>"
    en: Her voice trembles more and more.
    ko: 마리안의 목소리가 점점 더 떨렸다.
    ja: マリアンの声が、次第に震えを増していった
  d_nikke_marian_queen_04_5:
    speaker: marian
    en: You said you'd call for me if something happened...!
    ko: 무슨 일이 있으면 불러주시기로 하셨으면서…!
    ja: |-
      何かあったら呼んでくれるって、
      約束したのに…！
  d_nikke_marian_queen_04_6:
    speaker: marian
    en: Please... Please tell me nothing happened...
    ko: 설마, 혼자 있는 사이에 무슨 일이라도….
    ja: まさか、一人でいる間に何か…
  d_nikke_marian_queen_04_7:
    speaker: "<Self>"
    en: Marian?
    ko: 마리안?
    ja: マリアン？
  d_nikke_marian_queen_04_8:
    speaker: marian
    en: "...!"
    ko: "!!"
    ja: "！！"
  d_nikke_marian_queen_04_9:
    speaker: marian
    en: Commander!
    ko: 지휘관!
    ja: 指揮官！
  d_nikke_marian_queen_04_10:
    speaker: "<Narration>"
    en: Marian throws herself into the Commander's arms.
    ko: 마리안이 지휘관의 품에 안겨들었다.
    ja: マリアンは指揮官の胸に飛び込んだ
  d_nikke_marian_queen_04_11:
    speaker: marian
    en: Oh, what a relief...
    ko: 아아 다행이다….
    ja: ああ、よかった…
  d_nikke_marian_queen_04_12:
    speaker: marian
    en: I'm so relieved...
    ko: 다행이야….
    ja: 本当によかった…
  d_nikke_marian_queen_04_13:
    speaker: marian
    en: You're okay...
    ko: 아무 일 없었어….
    ja: 無事で…
  d_nikke_marian_queen_04_14:
    speaker: "<Self>"
    en: What is it? What's wrong?
    ko: 갑자기 왜 그러는 거야?
    ja: どうしたんだ？
  d_nikke_marian_queen_04_15:
    speaker: marian
    en: I finished washing up, and when I came back, you were gone...
    ko: 씻고 오니까 지휘관이 사라져서….
    ja: |-
      体を洗って戻ったら、
      指揮官がいなくて…
  d_nikke_marian_queen_04_16:
    speaker: marian
    en: I thought something terrible had happened...
    ko: 잠깐 자리를 비운 사이에, 무슨 일이 생긴 줄 알았어요….
    ja: |-
      ほんの少し目を離した隙に、
      何かあったのかと…
  d_nikke_marian_queen_04_17:
    speaker: "<Self>"
    en: Oh... I made you worry.
    ko: "…내가 걱정하게 만들었구나."
    ja: "…心配をかけてしまったな"
  d_nikke_marian_queen_04_18:
    speaker: "<Narration>"
    en: She keeps her face buried in his chest and doesn't look up.
    ko: 마리안이 가슴에 얼굴을 묻은 채, 고개를 들지 않는다.
    ja: |-
      マリアンは胸に顔をうずめたまま、
      顔を上げようとしない
  d_nikke_marian_queen_04_19:
    speaker: "<Self>"
    en: I'm sorry... I just went out to scan the surroundings, but I was coming right
      back.
    ko: 걱정하게 해서 미안해. 주변만 확인하고 바로 돌아오려 했어.
    ja: |-
      心配させてすまなかった。
      周りを確認して、すぐ戻るつもりだったんだ
  d_nikke_marian_queen_04_20:
    speaker: marian
    en: It's... okay...
    ko: 괜찮… 아요….
    ja: 大丈夫…です…
  d_nikke_marian_queen_04_21:
    speaker: marian
    en: All that matters... is that nothing happened...
    ko: 아무 일… 없었으면 그걸로… 됐어요….
    ja: 無事ならそれで…いいんです…
  d_nikke_marian_queen_04_22:
    speaker: "<Narration>"
    en: The Commander gently lifts Marian's chin.
    ko: 지휘관이 마리안의 고개를 들어 올린다.
    ja: 指揮官はマリアンの顔を上に向けた
  d_nikke_marian_queen_04_23:
    speaker: "<Self>"
    en: I did the last thing I ever wanted to do.
    ko: 내가 제일 하고 싶지 않았던 일을 해버렸네.
    ja: 一番したくなかったことをしてしまったな
  d_nikke_marian_queen_04_24:
    speaker: marian
    en: What's that...?
    ko: 하고 싶지 않았던 일이요…?
    ja: したくなかったこと…ですか？
  d_nikke_marian_queen_04_25:
    speaker: "<Self>"
    en: More than anything, I never wanted to make you cry.
    ko: 마리안 눈에 눈물 맺히게 하는 일만큼은 하고 싶지 않았거든.
    ja: |-
      マリアンを泣かせることだけは、
      したくなかったんだ
  d_nikke_marian_queen_04_26:
    speaker: "<Narration>"
    en: He wipes away her tears.
    ko: 지휘관이 마리안의 눈물을 닦아주었다.
    ja: 指揮官はマリアンの涙をぬぐった
  d_nikke_marian_queen_04_27:
    speaker: "<Self>"
    en: From now on, I won't leave your side.
    ko: 이젠 정말 마리안 옆에서 떨어지지 않을게.
    ja: もう君のそばから離れない
  d_nikke_marian_queen_04_28:
    speaker: marian
    en: "... Okay."
    ko: "…예."
    ja: "…はい。"
  d_nikke_marian_queen_04_29:
    speaker: "<Narration>"
    en: Marian wipes her eyes and slowly catches her breath.
    ko: 마리안이 눈가를 훔치며 천천히 숨을 고른다.
    ja: |-
      マリアンが目元をふきながら、
      ゆっくりと息を整えた
  d_nikke_marian_queen_04_30:
    speaker: marian
    en: Where did you go, anyway?
    ko: 그래서 어디에 갔다 오시는 거예요?
    ja: それで、どこに行ってたんですか？
  d_nikke_marian_queen_04_31:
    speaker: "<Self>"
    en: I searched the area a little because there was something I was looking for.
    ko: 찾고 싶은 게 있어서 좀 둘러보고 왔어.
    ja: 探したいものがあって、少し周りを見ていたんだ
  d_nikke_marian_queen_04_32:
    speaker: marian
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_marian_queen_04_33:
    speaker: "<Self>"
    en: I'd like to show it to you. Care to come with me?
    ko: 마리안에게 보여주고 싶은데, 같이 가 볼래?
    ja: |-
      見せたいものがある。
      一緒に来てくれないか？
  d_nikke_marian_queen_04_34:
    speaker: marian
    en: "... This time, you'd better not leave my side."
    ko: "…이번에야말로 저한테서 떨어지시면 안 돼요."
    ja: "…今度こそ、私から離れちゃダメですからね。"
  d_nikke_marian_queen_04_35:
    speaker: "<Self>"
    en: I won't. I'll be right next to you.
    ko: 응. 이번엔 꼭 붙어서 가자.
    ja: ああ、今度はぴったりくっついて行こう
  d_nikke_marian_queen_04_36:
    speaker: "<Narration>"
    en: Marian looks up at the sky.
    ko: 마리안이 하늘을 올려다본다.
    ja: マリアンが空を見上げた
  d_nikke_marian_queen_04_37:
    speaker: marian
    en: Wow...!
    ko: 와아…!
    ja: わあ…！
  d_nikke_marian_queen_04_38:
    speaker: "<Self>"
    en: Do you like it?
    ko: 마음에 들어?
    ja: 気に入ったか？
  d_nikke_marian_queen_04_39:
    speaker: marian
    en: I love it...!
    ko: 네…!
    ja: はい…！
  d_nikke_marian_queen_04_40:
    speaker: marian
    en: The stars are so beautiful!
    ko: 별이 정말 예뻐요!
    ja: 星がすごくきれいです！
  d_nikke_marian_queen_04_41:
    speaker: "<Self>"
    en: It's just too bad we're not at a beach right now, huh?
    ko: 그래도 밤바다가 아닌 건 조금 아쉽긴 하지?
    ja: でも、夜の海じゃなくて残念だろう？
  d_nikke_marian_queen_04_42:
    speaker: "<Narration>"
    en: Marian shakes her head.
    ko: 마리안이 고개를 젓는다.
    ja: マリアンが首を横に振った
  d_nikke_marian_queen_04_43:
    speaker: marian
    en: This sky is prettier than any other night sky out there.
    ko: 지금 이 하늘이, 그 어떤 밤하늘보다 좋은걸요.
    ja: |-
      いま見ているこの空が、
      どんな夜空よりも素敵です。
  d_nikke_marian_queen_04_44:
    speaker: marian
    en: I don't think there's anywhere more romantic right now than here.
    ko: 아마 지금 여기보다 더 분위기 좋은 곳은 없지 않을까요?
    ja: |-
      きっと、今ここより雰囲気のいい場所なんて
      ないと思います。
  d_nikke_marian_queen_04_45:
    speaker: "<Self>"
    en: Then I guess we crossed another thing off your bucket list.
    ko: 그럼 이걸로 버킷 리스트를 또 하나 달성했다고 할 수 있겠네.
    ja: |-
      では、これでやりたいことリストを
      またひとつ達成できたな
  d_nikke_marian_queen_04_46:
    speaker: marian
    en: "... Not yet."
    ko: "…아직이에요."
    ja: "…まだです。"
  d_nikke_marian_queen_04_47:
    speaker: "<Narration>"
    en: Marian takes the Commander's hand.
    ko: 마리안이 지휘관의 손을 잡는다.
    ja: マリアンが指揮官の手を握る
  d_nikke_marian_queen_04_48:
    speaker: marian
    en: Walking hand in hand was part of it, too.
    ko: 손잡고 걷는 것까지가 버킷 리스트였으니까요.
    ja: |-
      手をつないで歩くまでが、
      やりたいことですから。
  d_nikke_marian_queen_04_49:
    speaker: "<Self>"
    en: Ah, right.
    ko: 맞아, 그랬었지.
    ja: ああ、そうだったな
  d_nikke_marian_queen_04_50:
    speaker: "<Narration>"
    en: The two start walking, hand in hand.
    ko: 둘은 다정하게 손을 잡고 걷기 시작한다.
    ja: 二人は仲睦まじく手をつなぎ、歩き始めた
  d_nikke_marian_queen_04_51:
    speaker: marian
    en: You know, I don't think I've ever really taken the time to just look at the
      stars.
    ko: 생각해보면 지금까지 느긋하게 밤하늘을 본 적은 없었어요.
    ja: |-
      考えてみたら、今までゆっくり夜空を
      ながめたことなんてなかったですね。
  d_nikke_marian_queen_04_52:
    speaker: marian
    en: I never realized how bright they were,
    ko: 그래서 별이 얼마나 밝은지,
    ja: だから、星がどれほど明るいのかも、
  d_nikke_marian_queen_04_53:
    speaker: marian
    en: or how beautiful the moon was.
    ko: 달이 얼마나 예쁜지도 모르고 지냈네요.
    ja: |-
      月がどれほどきれいなのかも、
      知らなかったです。
  d_nikke_marian_queen_04_54:
    speaker: marian
    en: If it weren't for you, I might've have known.
    ko: 지휘관이 아니었다면 아마 평생 몰랐을지도 모르고요.
    ja: |-
      指揮官がいなかったら、
      一生知らないままだったかもしれません。
  d_nikke_marian_queen_04_55:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_04_56:
    speaker: marian
    en: Oh, look over there! That one's the brightest!
    ko: 아, 지휘관! 저게 가장 밝은 별이에요!
    ja: あっ、指揮官！あれが一番明るい星ですよ！
  d_nikke_marian_queen_04_57:
    speaker: marian
    en: The brightest star you can see from the surface...!
    ko: 지상에서 볼 수 있는 가장 밝은…!
    ja: 地上から見られる、一番明るい…！
  d_nikke_marian_queen_04_58:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_04_59:
    speaker: marian
    en: Commander.
    ko: "…지휘관."
    ja: "…指揮官？"
  d_nikke_marian_queen_04_60:
    speaker: marian
    en: Aren't you going to look the stars? They're really pretty.
    ko: 제대로 별 구경하고 있는 거 맞나요?
    ja: どうしたんですか？
  d_nikke_marian_queen_04_61:
    speaker: marian
    en: Why do you keep looking at me like that...?
    ko: 왜 자꾸 제 얼굴을 보고 있는….
    ja: どうしてさっきから私の顔ばかり…
  d_nikke_marian_queen_04_62:
    speaker: "<Self>"
    en: Because I'd rather look at you than them.
    ko: 그걸 별보다 더 보고 싶어서.
    ja: 星よりも、君を見ていたいから
  d_nikke_marian_queen_04_63:
    speaker: marian
    en: "...!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_marian_queen_04_64:
    speaker: "<Narration>"
    en: Marian gently wraps both her hands around the Commander's.
    ko: 마리안이 지휘관의 손을 두 손으로 가만히 감싸쥐었다.
    ja: |-
      マリアンは指揮官の手を
      両手でそっと包み込んだ
  d_nikke_marian_queen_04_65:
    speaker: marian
    en: "... Commander."
    ko: "…지휘관."
    ja: "…指揮官。"
  d_nikke_marian_queen_04_66:
    speaker: marian
    en: You've helped me do things I never thought I'd actually be able to do,
    ko: 하고 싶다고 생각만 했던 걸 이렇게 하나씩 이뤄주셔서,
    ja: |-
      やってみたいと願うだけだったことを、
      こうして一つずつ叶えてくださって…
  d_nikke_marian_queen_04_67:
    speaker: marian
    en: and I'm so happy right now.
    ko: 저 지금 행복해요.
    ja: 私、幸せです。
  d_nikke_marian_queen_04_68:
    speaker: marian
    en: But... it also makes me a little sad.
    ko: 그런데… 그래서 조금 아쉽기도 하네요.
    ja: でも…だからこそ、少し寂しくもあるんです。
  d_nikke_marian_queen_04_69:
    speaker: "<Self>"
    en: Why is that?
    ko: 아쉬워?
    ja: 寂しい？
  d_nikke_marian_queen_04_70:
    speaker: marian
    en: Because you only ever do what I want.
    ko: 예. 자꾸 제가 원하는 것만 들어주시잖아요.
    ja: |-
      はい。いつも私の願いばかり
      叶えてくださるから。
  d_nikke_marian_queen_04_71:
    speaker: marian
    en: I want to help you do things that you want to do, too.
    ko: 저도 지휘관이 원하는 걸 이뤄드리고 싶어요.
    ja: 私も、指揮官の願いを叶えたいです。
  d_nikke_marian_queen_04_72:
    speaker: "<Self>"
    en: Just seeing you smile like this is enough for me.
    ko: 난 마리안이 이렇게 웃어주는 것만 봐도 충분한데.
    ja: |-
      マリアンがこうして笑ってくれるだけで、
      私は十分だ
  d_nikke_marian_queen_04_73:
    speaker: marian
    en: No, I'm not letting you get off that easy.
    ko: 안 돼요.
    ja: ダメです。
  d_nikke_marian_queen_04_74:
    speaker: marian
    en: Just having you smiling by my side was enough for me, too.
    ko: 저도 지휘관이 웃으면서 제 옆에 있는 것만으로도 충분했어요.
    ja: |-
      私だって、指揮官が笑顔で
      隣にいてくれるだけで、
      十分だったんですよ。
  d_nikke_marian_queen_04_75:
    speaker: marian
    en: But then you kept asking, so I thought of some things to do.
    ko: 집요하게 물어보시니까 뭐든 생각해서 대답해드린 거라고요.
    ja: |-
      何度も聞いてくださるので、
      考えたんですから。
  d_nikke_marian_queen_04_76:
    speaker: marian
    en: Now it's your turn. Hurry and think of something you want to do.
    ko: 자, 빨리 지휘관도 해보고 싶은 걸 고민해주세요.
    ja: |-
      さあ、早く指揮官も
      やってみたいことを考えてみてください。
  d_nikke_marian_queen_04_77:
    speaker: "<Self>"
    en: Hmm, in that case...
    ko: 음, 그러면….
    ja: うーん、それなら…
d_nikke_marian_queen_05:
  d_nikke_marian_queen_05_1:
    speaker: marian
    en: Are you sure? You just want to rest your head on my lap?
    ko: 정말 무릎베개로 괜찮으세요?
    ja: 本当に膝枕でいいんですか？
  d_nikke_marian_queen_05_2:
    speaker: marian
    en: Talk about modest requests...
    ko: 다른 것도 해드릴 수 있는데….
    ja: 他のことだってなんでも…
  d_nikke_marian_queen_05_3:
    speaker: "<Self>"
    en: For me, it's the most extravagant thing I could ask for.
    ko: 나한테는 이게 더할 나위 없는 사치야.
    ja: 私にとっては、この上ない贅沢だ
  d_nikke_marian_queen_05_4:
    speaker: "<Narration>"
    en: Marian strokes the Commander's hair as he lies in her lap.
    ko: 마리안은 누워 있는 지휘관의 머리카락을 어루만진다.
    ja: |-
      マリアンは横になっている
      指揮官の髪を優しくなでた
  d_nikke_marian_queen_05_5:
    speaker: marian
    en: Commander.
    ko: "…지휘관."
    ja: "…指揮官。"
  d_nikke_marian_queen_05_6:
    speaker: marian
    en: I'm really grateful for everything you've been doing for me.
    ko: 절 위해 이런 것들을 준비해줘서, 정말 고마워요.
    ja: |-
      私のためにいろいろ準備してくださって、
      本当にありがとうございます。
  d_nikke_marian_queen_05_7:
    speaker: marian
    en: But now, I want you to be honest with me.
    ko: 하지만 이젠 정말 솔직하게 대답해주세요.
    ja: でも、今度は本当に正直に答えてくださいね。
  d_nikke_marian_queen_05_8:
    speaker: marian
    en: Why did you suddenly start doing all of these things?
    ko: 왜 갑자기 이런 것들을 해주려고 하시는 거예요?
    ja: どうして急に、やりたいことを？
  d_nikke_marian_queen_05_9:
    speaker: "<Self>"
    en: I told you this morning.
    ko: 이유는 오늘 아침에도 말했던 것 같은데.
    ja: 今朝言っただろう
  d_nikke_marian_queen_05_10:
    speaker: marian
    en: What, that you want to make a lot of memories with me?
    ko: 저랑 많은 추억을 만들고 싶다던 거요?
    ja: |-
      私とたくさんの思い出を作りたい、と
      おっしゃっていたことですか？
  d_nikke_marian_queen_05_11:
    speaker: "<Self>"
    en: Yeah. This thing we're doing is really hard,
    ko: 응. 우리 여정엔 힘든 일이 많으니까,
    ja: ああ、私たちの旅はつらいことも多い
  d_nikke_marian_queen_05_12:
    speaker: "<Self>"
    en: so I want us to make as many good memories together as we can.
    ko: 마리안과 좋은 추억을 최대한 많이 만들고 싶었어.
    ja: |-
      だからマリアンといい思い出を
      できるだけたくさん作りたかったんだ
  d_nikke_marian_queen_05_13:
    speaker: marian
    en: "... Why the sudden push for it, though?"
    ko: "…왜 그렇게까지 저와 많은 추억을 만들고 싶으셨는데요?"
    ja: "…どうしてそこまで？"
  d_nikke_marian_queen_05_14:
    speaker: "<Self>"
    en: I just figure the more memories we make, the more you'll remember me.
    ko: 우리가 쌓은 추억의 수만큼, 마리안이 나를 기억해줄 것 같아서.
    ja: |-
      二人で思い出を重ねた分だけ、
      マリアンが私のことを覚えていてくれる気がして
  d_nikke_marian_queen_05_15:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_05_16:
    speaker: marian
    en: I see. So now I have memories that I can't ever let myself forget.
    ko: 제가 절대 잊으면 안 되는 추억들이 생겨버린 거였군요.
    ja: |-
      私には、絶対に忘れてはいけない思い出が
      できたんですね。
  d_nikke_marian_queen_05_17:
    speaker: "<Self>"
    en: Does that make them heavy...?
    ko: 추억이 좀 무거워?
    ja: ちょっと重かったか？
  d_nikke_marian_queen_05_18:
    speaker: marian
    en: Yeah, they're heavy.
    ko: 네, 무거워요.
    ja: はい、重いです。
  d_nikke_marian_queen_05_19:
    speaker: marian
    en: So heavy that they just might crush me.
    ko: 무거워 죽겠어요.
    ja: 重くて死にそうです。
  d_nikke_marian_queen_05_20:
    speaker: marian
    en: "... But before I die from that,"
    ko: "…그런데 그 추억에 깔려 죽는 것보다,"
    ja: "…でも、その思い出に押しつぶされるより先に…"
  d_nikke_marian_queen_05_21:
    speaker: marian
    en: I'm pretty sure I'll die of happiness first.
    ko: 너무 행복해서 죽는 게 더 빠를 것 같아요.
    ja: 幸せすぎて死んでしまいそうです。
  d_nikke_marian_queen_05_22:
    speaker: "<Narration>"
    en: The Commander smiles quietly.
    ko: 지휘관은 조용히 웃는다.
    ja: 指揮官は静かに微笑んだ
  d_nikke_marian_queen_05_23:
    speaker: marian
    en: What about you, Commander?
    ko: 그런데 지휘관은 어떡하죠?
    ja: でも、指揮官はどうするんですか？
  d_nikke_marian_queen_05_24:
    speaker: "<Self>"
    en: Huh? Me?
    ko: 응? 나?
    ja: ん？私？
  d_nikke_marian_queen_05_25:
    speaker: marian
    en: You have to remember me too.
    ko: 지휘관도 절 기억해주셔야 하잖아요.
    ja: |-
      指揮官にも、私のことを
      覚えていてほしいです。
  d_nikke_marian_queen_05_26:
    speaker: marian
    en: And that means you have to make a lot of good memories for yourself.
    ko: 그러려면 지휘관도 좋은 추억을 많이 만들어야죠.
    ja: |-
      だから、指揮官にも
      いい思い出をたくさん作ってもらわないと。
  d_nikke_marian_queen_05_27:
    speaker: "<Self>"
    en: I already have.
    ko: 나도 좋은 추억을 많이 만들었어.
    ja: 私にもいい思い出がたくさんできた
  d_nikke_marian_queen_05_28:
    speaker: "<Self>"
    en: Every time you've ever smiled is a good memory for me.
    ko: 마리안이 웃는 모습 하나하나가, 좋은 추억으로 남아 있으니까.
    ja: |-
      マリアンの笑顔の一つひとつが、
      いい思い出だからな
  d_nikke_marian_queen_05_29:
    speaker: marian
    en: Agh, there you go again, saying nice things to talk your way out of it.
    ko: 또 혼자만 치사하게 빠져나가시네요?
    ja: またそうやって自分だけうまく逃げて～
  d_nikke_marian_queen_05_30:
    speaker: marian
    en: It's not fair...
    ko: 능구렁이같이….
    ja: ずるいです…
  d_nikke_marian_queen_05_31:
    speaker: "<Self>"
    en: Do you hate me now?
    ko: 그래서 싫어졌어?
    ja: 嫌いになったか？
  d_nikke_marian_queen_05_32:
    speaker: marian
    en: No...
    ko: "…아뇨."
    ja: "…いいえ。"
  d_nikke_marian_queen_05_33:
    speaker: marian
    en: It's just, after all you've done for me, what if I'm the only one who remembers
      this later...?
    ko: 이렇게까지 해주셨으면서, 나중에 나만 기억하고 있으면 어쩌나….
    ja: |-
      ここまでしてくださったのに、いつか
      私しか覚えていなかったらどうしようって…
  d_nikke_marian_queen_05_34:
    speaker: marian
    en: That's what I'm starting to worry about.
    ko: 그런 걱정이 들기 시작했어요.
    ja: 心配になってしまって。
  d_nikke_marian_queen_05_35:
    speaker: "<Self>"
    en: But there's no way I'd forget you...
    ko: 내가 마리안을 잊을 리… 없잖아.
    ja: 私がマリアンを忘れるわけ…ないだろう
  d_nikke_marian_queen_05_36:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_05_37:
    speaker: marian
    en: Y-yeah... of course not.
    ko: 그, 그렇… 겠죠?
    ja: そ、そう…ですよね？
  d_nikke_marian_queen_05_38:
    speaker: marian
    en: And there's no way I'd ever forget you, either.
    ko: 물론 저도 지휘관을 잊을 리가 없을 거고요.
    ja: 当然、私も指揮官を忘れるわけないですし。
  d_nikke_marian_queen_05_39:
    speaker: marian
    en: You're the one who showed me hope,
    ko: 지휘관은 제게 희망을 알려준 사람이에요.
    ja: 指揮官は、私に希望を教えてくれた人です。
  d_nikke_marian_queen_05_40:
    speaker: marian
    en: the one who helped me realize that being with someone could be this warm,
    ko: 그리고 누군가와 함께 있는 것이, 이렇게나 따뜻하다는 걸 알 수 있도록,
    ja: |-
      そして、誰かと一緒にいることが
      こんなにも温かいことなんだって…
  d_nikke_marian_queen_05_41:
    speaker: marian
    en: that a person could be this warm.
    ko: 사람의 온기를 느끼게 해준 사람이죠.
    ja: |-
      人のぬくもりを
      感じさせてくれた人でもあります。
  d_nikke_marian_queen_05_42:
    speaker: marian
    en: "... There's no way I could ever forget you."
    ko: "…그런 지휘관을 제가 잊을 리 없어요."
    ja: |-
      …そんな指揮官のことを、
      私が忘れるはずありません。
  d_nikke_marian_queen_05_43:
    speaker: "<Self>"
    en: But what if you do forget?
    ko: 그래도 만약에 잊게 되면?
    ja: それでも、もし忘れてしまったら？
  d_nikke_marian_queen_05_44:
    speaker: marian
    en: Then I'll have you by my side to whisper in my ear all the memories we made.
    ko: 그땐 지휘관이 옆에서 우리가 쌓았던 추억을 속삭여주세요.
    ja: |-
      そのときは、指揮官が私に、
      私たちが積み重ねてきた思い出を
      聞かせてください。
  d_nikke_marian_queen_05_45:
    speaker: marian
    en: If I trace them back, one by one,
    ko: 그 추억을 하나씩 떠올리면,
    ja: その思い出を一つずつたどれば…
  d_nikke_marian_queen_05_46:
    speaker: marian
    en: then I'm sure I'll be able to remember you, even if I've lost my memory.
    ko: 기억을 잃었더라도 분명 지휘관을 기억해낼 수 있을 거예요.
    ja: |-
      たとえ記憶を失っていたとしても、
      きっと指揮官のことを思い出せるはずです。
  d_nikke_marian_queen_05_47:
    speaker: "<Narration>"
    en: Marian takes the Commander's hand in both of hers and brings it to her cheek.
    ko: 마리안은 지휘관의 손을 양손으로 감싸 자신의 볼에 가져갔다.
    ja: |-
      マリアンは指揮官の手を両手で包み込み、
      自分の頬に寄せた
  d_nikke_marian_queen_05_48:
    speaker: marian
    en: We've made so many good memories together, after all.
    ko: 좋은 추억을 잔뜩 만들었으니까요.
    ja: 素敵な思い出がたくさんできたんですから。
  d_nikke_marian_queen_05_49:
    speaker: marian
    en: I don't think it's too much to hope for a miracle, especially when it's something
      I want so much.
    ko: 이렇게나 간절하니까, 그 정도의 기적은 바라도 되지 않을까요?
    ja: |-
      こんなにも強く願っているんです。
      それくらいの奇跡は望んでもいいですよね？
  d_nikke_marian_queen_05_50:
    speaker: "<Self>"
    en: If your determination is that unshakable,
    ko: 그렇게까지 의지가 확고하다면,
    ja: それほど揺るぎない意志があるのなら、
  d_nikke_marian_queen_05_51:
    speaker: "<Self>"
    en: then doesn't it stop being a miracle, and becomes something that's bound to
      happen?
    ko: 기적이 아니라 결국 일어날 일이 아닐까?
    ja: |-
      それは奇跡ではなく、
      起こるべくして起こることなのではないか？
  d_nikke_marian_queen_05_52:
    speaker: marian
    en: Something that's... bound to happen?
    ko: 결국 일어날 일이요?
    ja: 起こるべくして起こる、ですか？
  d_nikke_marian_queen_05_53:
    speaker: "<Self>"
    en: Yeah. A certainty.
    ko: 응. 한마디로 필연인 거지.
    ja: ああ。つまり、必然だ
  d_nikke_marian_queen_05_54:
    speaker: marian
    en: A certainty...
    ko: 필연….
    ja: 必然…
  d_nikke_marian_queen_05_55:
    speaker: marian
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_05_56:
    speaker: marian
    en: You're right. Calling it a miracle would ignore our determination to make
      it happen.
    ko: 그래요. 그걸 기적이라고 부르면, 확고한 의지를 부정하는 게 되겠네요.
    ja: |-
      そうですね。それを奇跡と言うなら、
      この強い想いも
      否定することになってしまいますね。
  d_nikke_marian_queen_05_57:
    speaker: "<Self>"
    en: Exactly. Even our meeting was a certainty.
    ko: 응. 그러니까 우리의 만남도 필연이었던 거야.
    ja: ああ。だから、私たちの出会いも必然だったんだ
  d_nikke_marian_queen_05_58:
    speaker: marian
    en: It was?
    ko: 우리의 만남도요?
    ja: 私たちの出会いも、ですか？
  d_nikke_marian_queen_05_59:
    speaker: "<Self>"
    en: Yeah, since we both met each other with something unshakable in our hearts.
    ko: 우리도 가슴에 확고한 무언가를 품고서 만나게 된 사이니까.
    ja: |-
      私たちも、胸に揺るぎない何かを抱いて
      出会った仲なのだから
  d_nikke_marian_queen_05_60:
    speaker: "<Narration>"
    en: Marian smiles brightly.
    ko: 마리안이 밝게 웃었다.
    ja: マリアンは明るく笑った
  d_nikke_marian_queen_05_61:
    speaker: marian
    en: I guess you're right... We were bound to meet each other.
    ko: 맞아요. 우리의 만남도 필연이에요.
    ja: そうですね。私たちの出会いも必然です。
  d_nikke_marian_queen_05_62:
    speaker: marian_queen
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_marian_queen_05_63:
    speaker: marian_queen
    en: It's just like he said... Our meeting was a certainty.
    ko: 그래… 지휘관이 말했던 것처럼 우리의 만남은 필연이야.
    ja: |-
      そう…指揮官が言っていた通り、
      私たちの出会いは必然だった。
  d_nikke_marian_queen_05_64:
    speaker: marian_queen
    en: Which is why, miracle or no, I'm going to remember all our memories someday.
    ko: 그러니까 기적이 아니더라도, 언젠가 우리의 추억들을 떠올릴 수 있어.
    ja: |-
      だから、奇跡が起きなくても、
      いつか二人の思い出を思い出せる。
  d_nikke_marian_queen_05_65:
    speaker: marian_queen
    en: "... Right, Commander?"
    ko: "…그렇죠, 지휘관?"
    ja: "…ですよね、指揮官？"
  d_nikke_marian_queen_05_66:
    speaker: "<Narration>"
    en: No answer comes.
    ko: 대답은 들리지 않는다.
    ja: 返事は聞こえない
  d_nikke_marian_queen_05_67:
    speaker: "<Narration>"
    en: But believing in the certainty that lies at the end of her wait,
    ko: 하지만 기다림의 끝에 있을 필연을 믿으며,
    ja: けれど、待ち続けた先にある必然を信じて
  d_nikke_marian_queen_05_68:
    speaker: "<Narration>"
    en: Marian closes her eyes with a smile.
    ko: 마리안은 웃는 얼굴로 눈을 감았다.
    ja: マリアンは笑顔で目を閉じた
