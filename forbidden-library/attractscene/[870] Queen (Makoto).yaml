---
d_nikke_ce009_01_01:
  d_nikke_ce009_01_01_1:
    speaker: ade
    en: Miss Makoto, shouldn't you be on your way soon?
    ko: 마코토 아가씨, 이제 슬슬 나가봐야 하지 않으실까요?
    ja: 真お嬢様、そろそろお出かけのお時間では？
  d_nikke_ce009_01_01_2:
    speaker: ce009_01_f
    en: Oh, look at the time!
    ko: 앗, 벌써 시간이 그렇게 됐네.
    ja: あっ、もうそんな時間？
  d_nikke_ce009_01_01_3:
    speaker: ade
    en: It seems you were so busy helping out at the Maid Cafe that you lost track
      of time.
    ko: 메이드 카페 일을 도와주시느라 정신이 없으셨나 보네요.
    ja: |-
      メイドカフェのお仕事のお手伝いは、
      あわただしかったでしょう？
  d_nikke_ce009_01_01_4:
    speaker: ade
    en: You were planning to head out and have a look around the Ark today, weren't
      you?
    ko: 오늘은 나가서 방주를 돌아보시려는 거죠?
    ja: 今日はアークのご見学をされる予定でしたね？
  d_nikke_ce009_01_01_5:
    speaker: ce009_01_f
    en: Yeah.
    ko: 응.
    ja: ええ。
  d_nikke_ce009_01_01_6:
    speaker: "<Narration>"
    en: Makoto grabs her bag from beside the Maid Cafe's entrance and slings it over
      her shoulder.
    ko: 마코토는 메이드 카페 입구에 놓인 숄더백을 멨다.
    ja: |-
      真はメイドカフェの入口に置いてあった
      ショルダーバッグをかけた
  d_nikke_ce009_01_01_7:
    speaker: ce009_01_f
    en: This world seems so different from ours.
    ko: 우리가 살던 세상이랑 다른 점이 많은 것 같아서,
    ja: 私たちが暮らしている世界と色々違う気がして、
  d_nikke_ce009_01_01_8:
    speaker: ce009_01_f
    en: I figured I might learn a thing or two by exploring the Ark.
    ko: 방주를 둘러보면 공부가 좀 되지 않을까 싶었거든.
    ja: |-
      アークを見て回ったら、
      勉強になりそうだなって思ったの。
  d_nikke_ce009_01_01_9:
    speaker: ade
    en: I see.
    ko: 그러시군요.
    ja: さようでございましたか。
  d_nikke_ce009_01_01_10:
    speaker: ade
    en: I'd love to show you around the Ark myself, but...
    ko: 마음 같아선 직접 안내해 드릴 수 있으면 좋겠는데….
    ja: 私がご案内して差し上げたいところですが…
  d_nikke_ce009_01_01_11:
    speaker: ade
    en: I'm afraid I still have work to do here at the Maid Cafe.
    ko: 죄송하게도 아직 메이드 카페의 일이 남았네요.
    ja: |-
      残念ながら、メイドカフェの仕事が
      片付かないものでして。
  d_nikke_ce009_01_01_12:
    speaker: ce009_01_f
    en: It's all right. I'm already imposing on you enough as it is. I can't ask you
      to go out of your way to show me around.
    ko: 괜찮아. 가뜩이나 신세 지고 있는데, 무리해서 안내해달라고 하는 건 염치없지.
    ja: |-
      大丈夫よ。ただでさえお世話になってるのに、
      無理して案内を頼むことなんてできないわ。
  d_nikke_ce009_01_01_13:
    speaker: ce009_01_f
    en: Besides...
    ko: 그리고….
    ja: それに…
  d_nikke_ce009_01_01_14:
    speaker: "<Narration>"
    en: Makoto's shoulder bag suddenly wiggles, and out pops a cat's head.
    ko: 마코토가 매고 있던 숄더백이 꿈틀거리더니, 고양이 한 마리가 고개를 내밀었다.
    ja: |-
      真のショルダーバッグが動き、
      中から1匹のネコが顔を出した
  d_nikke_ce009_01_01_15:
    speaker: ce009_05_c
    en: No way I'm letting Makoto head out alone into a world she's never seen before.
    ko: 생판 모르는 세상에 마코토를 혼자 둘 수는 없지.
    ja: |-
      未知の世界に、
      マコトひとり放り出すわけないだろ。
  d_nikke_ce009_01_01_16:
    speaker: ce009_05_c
    en: I'll be going with her too, so don't worry!
    ko: 그래서 이 몸도 같이 가니까, 너무 걱정하지 마!
    ja: ワガハイも一緒に行くから、心配すんな！
  d_nikke_ce009_01_01_17:
    speaker: ade
    en: I see.
    ko: 후후, 그렇군요.
    ja: ふふ、安心しました。
  d_nikke_ce009_01_01_18:
    speaker: ade
    en: In that case, I hope you both have a safe journey.
    ko: 그러면 두 분 모두 조심히 다녀오세요.
    ja: |-
      ではお二人とも、どうぞお気をつけて
      いってらっしゃいませ。
  d_nikke_ce009_01_01_19:
    speaker: ce009_01_f
    en: Will do!
    ko: 응, 다녀올게!
    ja: ええ、行ってきます！
  d_nikke_ce009_01_01_20:
    speaker: ce009_01_f
    en: Wow...
    ko: 와….
    ja: わあ…
  d_nikke_ce009_01_01_21:
    speaker: ce009_01_f
    en: This place amazes me every time I see it.
    ko: 이곳은 정말 볼 때마다 신기하네.
    ja: ここは、本当に見るたびに不思議な場所ね。
  d_nikke_ce009_01_01_22:
    speaker: ce009_05_c
    en: Whatcha lookin' at?
    ko: 어딜 보고 있는 거야?
    ja: どこを見てるんだ？
  d_nikke_ce009_01_01_23:
    speaker: ce009_01_f
    en: See that signboard in front of the store?
    ko: 저기 가게 앞에 입간판 보여?
    ja: あのお店の前にある看板、見える？
  d_nikke_ce009_01_01_24:
    speaker: ce009_01_f
    en: It's actually a hologram.
    ko: 입간판이 홀로그램으로 되어 있어서 보고 있었어.
    ja: 看板がホログラムになっているの。
  d_nikke_ce009_01_01_25:
    speaker: ce009_05_c
    en: Whoa! Even I've never seen anything like that!
    ko: 오오, 이 몸도 저런 건 처음 봐!
    ja: おお、ああいうのはワガハイも初めて見るぞ！
  d_nikke_ce009_01_01_26:
    speaker: ce009_01_f
    en: Yeah, there are so many things I've never seen before.
    ko: 그래, 처음 보는 것들이 엄청 많네.
    ja: 見たことないものがたくさんあるわ。
  d_nikke_ce009_01_01_27:
    speaker: ce009_01_f
    en: "... So this is what the world looks like when science and technology advance."
    ko: "…과학 기술이 발달하면 이런 식으로 되는구나."
    ja: |-
      …科学技術が発展すると、
      こういうふうになるのね。
  d_nikke_ce009_01_01_28:
    speaker: ce009_01_f
    en: I'm glad I came out to explore.
    ko: 확실히 둘러보러 나오길 잘한 것 같아.
    ja: やっぱり、出かけて正解だったわ。
  d_nikke_ce009_01_01_29:
    speaker: ce009_05_c
    en: Still, let's stay on our guard.
    ko: 그래도 혹시 모르니까 조심하자.
    ja: でも、注意は怠るなよ。
  d_nikke_ce009_01_01_30:
    speaker: ce009_05_c
    en: I came along because I figured it'd be dangerous for you to come out here
      alone.
    ko: 마코토가 혼자 나오면 위험할 것 같아서, 이 몸도 함께 나온 거니까.
    ja: |-
      マコト一人だと危険かもしれないから、
      ワガハイも一緒に来てるんだ。
  d_nikke_ce009_01_01_31:
    speaker: ce009_05_c
    en: Since we don't know much about this place, it can't hurt to be careful.
    ko: 우리가 잘 모르는 곳인 만큼, 조심해서 나쁠 건 없어.
    ja: |-
      よく知らない場所だからこそ、
      気をつけて悪いことはないからな。
  d_nikke_ce009_01_01_32:
    speaker: ce009_01_f
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_01_01_33:
    speaker: ce009_05_c
    en: Makoto? You suddenly went quiet. What's wrong?
    ko: |-
      마코토?
      갑자기 말이 없어졌는데, 무슨 일이야?
    ja: |-
      マコト？
      急に黙って、どうしたんだ？
  d_nikke_ce009_01_01_34:
    speaker: ce009_01_f
    en: I can't shake the feeling someone was watching us...
    ko: 뭔가 사람들의 시선이 느껴지는 것 같아서.
    ja: なんだか、周りの視線を感じる気がして。
  d_nikke_ce009_01_01_35:
    speaker: "<Narration>"
    en: Makoto's mind drifts back to the Commander's words.
    ko: 문득 마코토는 지휘관이 해주었던 말을 떠올렸다.
    ja: ふと、真は指揮官の話を思い出した
  d_nikke_ce009_01_01_36:
    speaker: "<Narration>"
    en: Animals are extremely rare in the Ark,
    ko: "[방주에서 동물은 정말 희귀한 존재거든.]"
    ja: "「アークでは、動物はとても貴重な存在なんだ」"
  d_nikke_ce009_01_01_37:
    speaker: "<Narration>"
    en: so they're all protected.
    ko: "[모든 동물이 보호 대상이야.]"
    ja: "「すべての動物が保護対象になっている」"
  d_nikke_ce009_01_01_38:
    speaker: "<Narration>"
    en: You should be careful. Someone might mistake Morgana for an ordinary cat and
      try to take him into protective custody.
    ko: "[그래서 혹시 모르가나를 오해해서 보호하려고 할 수 있으니까, 조심하는 게 좋아.]"
    ja: |-
      「モルガナのことを誤解して
      保護しようとする人が出るかもしれない。
      気をつけてくれ」
  d_nikke_ce009_01_01_39:
    speaker: ce009_01_f
    en: If you get taken to an animal shelter, it'd cause trouble for the Commander
      and Ade.
    ko: 괜히 모르가나가 동물 보호소에 붙잡히면, 지휘관이나 에이드한테 민폐겠지.
    ja: |-
      モルガナがシェルターに連れていかれたら
      指揮官やエードに迷惑がかかるわ。
  d_nikke_ce009_01_01_40:
    speaker: ce009_01_f
    en: Sorry, Morgana, but could you stay hidden in the bag for now?
    ko: 모르가나, 미안한데 가방에 몸 좀 숨어줄 수 있을까?
    ja: |-
      モルガナ、申し訳ないけど
      カバンに隠れててくれるかしら？
  d_nikke_ce009_01_01_41:
    speaker: ce009_01_f
    en: It might be a little cramped, though...
    ko: 좀 좁을 수도 있지만….
    ja: 少し窮屈かもしれないけど…
  d_nikke_ce009_01_01_42:
    speaker: "<Narration>"
    en: Morgana does as Makoto asks and ducks back into her shoulder bag.
    ko: 모르가나는 시키는 대로, 마코토의 숄더백 안에 머리를 숨겼다.
    ja: |-
      モルガナは言われるがまま
      真のショルダーバッグの中に飛び込んだ
  d_nikke_ce009_01_01_43:
    speaker: ce009_05_c
    en: I can see just fine from inside the bag, so it's all good. I don't want to
      cause Ade any trouble, either.
    ko: |-
      가방 안에서도 밖은 보이니까 괜찮아.
      이 몸도 에이드에게 민폐 끼치고 싶진 않으니까.
    ja: |-
      ワガハイもエードたちに
      迷惑はかけたくねーしな。
      カバンの中からでも外は見えるし、大丈夫だ。
  d_nikke_ce009_01_01_44:
    speaker: ce009_05_c
    en: Besides, it's not like I'm a cat!
    ko: 물론, 이 몸은 고양이가 아니지만 말이야!
    ja: まあ、ワガハイ本当はネコじゃねーけどな！
  d_nikke_ce009_01_01_45:
    speaker: "<Narration>"
    en: Makoto pulls out a map of the Ark from underneath Morgana.
    ko: 마코토는 모르가나 밑에 깔려 있던 방주의 지도를 꺼냈다.
    ja: |-
      真は、モルガナの下敷きになっていた
      アークの地図を取り出した
  d_nikke_ce009_01_01_46:
    speaker: ce009_01_f
    en: We should stick to the places the Commander marked on the map as much as possible.
    ko: 최대한 지휘관이 지도에 체크해 준 곳들 위주로만 둘러봐야겠어.
    ja: |-
      なるべく、指揮官が地図に
      マークしてくれた場所を中心に周りましょ。
  d_nikke_ce009_01_01_47:
    speaker: ce009_01_f
    en: He said they're safe to visit, remember?
    ko: 실제로 방문해도 문제 없는 곳이라고, 지휘관에게 들었잖아.
    ja: |-
      実際に訪問しても問題ない場所だって
      指揮官に教えてもらったものね。
  d_nikke_ce009_01_01_48:
    speaker: ce009_05_c
    en: Where are we headed next, then?
    ko: 그럼 다음은 어디로 갈 생각인데?
    ja: じゃあ、次はどこに行くつもりなんだ？
  d_nikke_ce009_01_01_49:
    speaker: "<Narration>"
    en: Morgana glances up at Makoto from inside the bag.
    ko: 모르가나는 가방 안에서 마코토를 올려 보았다.
    ja: モルガナはカバンの中から真を見上げた
  d_nikke_ce009_01_01_50:
    speaker: ce009_01_f
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_ce009_01_01_51:
    speaker: ce009_01_f
    en: Looks like there's a Central Government building nearby. Let's head there
      first.
    ko: |-
      일단 이 근처에 중앙정부 청사가 있다고 하니까,
      그쪽으로 가보려고 해.
    ja: |-
      まずはこの近くに
      中央政府の庁舎があるみたいだから、
      そっちに行こうかしら。
  d_nikke_ce009_01_01_52:
    speaker: ce009_01_f
    en: I'd like to check out the library too.
    ko: 그리고 도서관에도 좀 가보고 싶어.
    ja: それから、図書館にも行ってみたいわ。
  d_nikke_ce009_01_01_53:
    speaker: ce009_05_c
    en: Sounds good. Nothing broadens your horizons like trying something new.
    ko: 그래, 확실히 식견을 넓히는 데는 새로운 경험만 한 게 없지.
    ja: |-
      見聞を広げるには、新しい経験をするのが
      一番だからな。
  d_nikke_ce009_01_01_54:
    speaker: ce009_05_c
    en: Let's go!
    ko: 그럼 가보자고!
    ja: 行ってみようぜ！
  d_nikke_ce009_01_01_55:
    speaker: "<Narration>"
    en: Makoto and Morgana head toward the Central Government office building.
    ko: 마코토와 모르가나는 중앙정부 청사 방향으로 향했다.
    ja: 真とモルガナは、中央政府庁舎へ向かった
  d_nikke_ce009_01_01_56:
    speaker: ce009_05_c
    en: Is that building over there the Central Government office building?
    ko: 앞에 저 건물, 저기가 중앙정부 청사 아니야?
    ja: あれが中央政府の庁舎じゃないか？
  d_nikke_ce009_01_01_57:
    speaker: ce009_01_f
    en: Looks like it.
    ko: 그런 것 같네.
    ja: そうみたいね。
  d_nikke_ce009_01_01_58:
    speaker: ce009_01_f
    en: That's what the map says too.
    ko: 지도에도 그렇게 나와 있어.
    ja: 地図にもそう書かれているわ。
  d_nikke_ce009_01_01_59:
    speaker: "<Narration>"
    en: As Makoto approaches the Central Government office building,
    ko: 마코토는 중앙정부 청사에 가까이 다가갔고,
    ja: 真が中央政府庁舎に近づくと…
  d_nikke_ce009_01_01_60:
    speaker: "<Narration>"
    en: she locks eyes with the three Nikkes standing in front of it.
    ko: 건물 앞에서 세 명의 니케와 눈이 마주쳤다.
    ja: 建物の前で3人のニケと目が合った
  d_nikke_ce009_01_01_61:
    speaker: yulha
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_01_01_62:
    speaker: admi
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_ce009_01_01_63:
    speaker: privaty
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_ce009_01_01_64:
    speaker: privaty
    en: You are...
    ko: 당신은….
    ja: あなたは…
d_nikke_ce009_01_02:
  d_nikke_ce009_01_02_1:
    speaker: privaty
    en: So you're the one I've heard about.
    ko: 당신이 그 사람이군요.
    ja: あなたが例の…
  d_nikke_ce009_01_02_2:
    speaker: ce009_01_f
    en: You know who I am?
    ko: 저를 알고 계시는 건가요?
    ja: 私のことを知っているんですか？
  d_nikke_ce009_01_02_3:
    speaker: privaty
    en: Yes, I heard from the Commander that
    ko: 네, 지휘관에게 들었어요.
    ja: ええ、指揮官から聞いています。
  d_nikke_ce009_01_02_4:
    speaker: privaty
    en: a student from another world and a talking cat are in the Ark right now.
    ko: 다른 세계에서 온 학생과 말하는 고양이가 지금 방주에 있다고.
    ja: |-
      他の世界から来た学生と、
      しゃべるネコがアークにいると。
  d_nikke_ce009_01_02_5:
    speaker: ce009_05_c
    en: I'm a human!
    ko: 이 몸은 인간이야!
    ja: ワガハイはニンゲンだッ！
  d_nikke_ce009_01_02_6:
    speaker: "<Narration>"
    en: Morgana pokes his head out of the bag.
    ko: 모르가나가 가방 밖으로 고개를 내밀었다.
    ja: モルガナがカバンの外へ顔を突き出した
  d_nikke_ce009_01_02_7:
    speaker: privaty
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_ce009_01_02_8:
    speaker: yulha
    en: The cat's actually talking.
    ko: 진짜 말하는 고양이가 있잖아.
    ja: 本当にネコがしゃべってるわ。
  d_nikke_ce009_01_02_9:
    speaker: admi
    en: So it really is true...
    ko: 정말이네요.
    ja: 本当ですね。
  d_nikke_ce009_01_02_10:
    speaker: yulha
    en: It's gotta be the one Newbie mentioned, right?
    ko: 그럼 이 고양이가 걔야?
    ja: じゃあ、このネコがあれなの？
  d_nikke_ce009_01_02_11:
    speaker: admi
    en: I would think so.
    ko: 그렇지 않을까요?
    ja: そうじゃないですか？
  d_nikke_ce009_01_02_12:
    speaker: admi
    en: I can't imagine there'd be another talking cat in the Ark.
    ko: 말하는 고양이가 방주에 또 있을 리는 없으니까요.
    ja: |-
      しゃべるネコがアークにいるわけ
      ありませんから。
  d_nikke_ce009_01_02_13:
    speaker: yulha
    en: Makes sense.
    ko: 듣고 보니 그렇군.
    ja: 言われてみればそうね。
  d_nikke_ce009_01_02_14:
    speaker: ce009_05_c
    en: I may look like a cat, but I'm human, dammit!
    ko: |-
      이 몸은 인간이라고!
      겉보기에는 고양이처럼 보일지도 모르지만….
    ja: |-
      だから、ワガハイはニンゲンだっての。
      そりゃ見た目はネコっぽいかもしれねぇが…
  d_nikke_ce009_01_02_15:
    speaker: yulha
    en: Yeah, yeah. So what brings you here?
    ko: 그래, 그런 걸로 하자. 그래서 넌 여기에 뭐 하러 왔어?
    ja: |-
      まっ、そういうことにしてあげる。
      で？あんたたちは何しに来たの？
  d_nikke_ce009_01_02_16:
    speaker: ce009_01_f
    en: We're here to take a look around the Central Government building.
    ko: 중앙정부 청사에 견학 좀 하러 왔어요.
    ja: 中央政府庁舎の見学に来ました。
  d_nikke_ce009_01_02_17:
    speaker: ce009_01_f
    en: My older sister is a prosecutor,
    ko: 저한테 언니가 한 명 있는데, 언니가 검사거든요.
    ja: |-
      私、姉がいて…
      姉は、検事なんです。
  d_nikke_ce009_01_02_18:
    speaker: ce009_01_f
    en: so I wanted to see how people in another world who do similar work carry out
      their jobs.
    ko: 그래서 다른 세계에서 비슷한 일을 하는 분들의 모습을 보고 싶었어요.
    ja: |-
      だから、別の世界で似たような
      仕事をしている人たちの様子を
      見てみたいと思って。
  d_nikke_ce009_01_02_19:
    speaker: ce009_01_f
    en: Um... you're the Triangle Squad, right?
    ko: 저기… 여러분은 트라이앵글 스쿼드, 맞죠?
    ja: |-
      その…皆さんは
      「トライアングル部隊」の方々ですよね？
  d_nikke_ce009_01_02_20:
    speaker: yulha
    en: Oh? You know us?
    ko: 음? 우리를 알고 있나?
    ja: ん？私たちを知ってるの？
  d_nikke_ce009_01_02_21:
    speaker: ce009_01_f
    en: The Commander also told me about all of you.
    ko: 저도 지휘관에게 여러분에 대한 이야기를 들었거든요.
    ja: 私も指揮官に話を聞いていたんです。
  d_nikke_ce009_01_02_22:
    speaker: ce009_01_f
    en: Hearing that you do the same kind of work as my sister naturally caught my
      interest...
    ko: 그래서 이야기를 들었을 때, 언니랑 비슷한 일을 하신다고 해서 관심이 갔….
    ja: |-
      それで、ご説明いただいてるときに…
      姉と似たような仕事をされている
      ということだったので、興味があっ…
  d_nikke_ce009_01_02_23:
    speaker: privaty
    en: He told you about us?!
    ko: 지휘관이 우리 이야기를요?!
    ja: 指揮官が私たちの話を！？
  d_nikke_ce009_01_02_24:
    speaker: "<Narration>"
    en: Privaty steps right up to Makoto.
    ko: 프리바티가 마코토에게 바짝 다가섰다.
    ja: プリバティは真に勢いよく迫った
  d_nikke_ce009_01_02_25:
    speaker: ce009_01_f
    en: Y-yeah...
    ko: 예, 예….
    ja: は、はい…
  d_nikke_ce009_01_02_26:
    speaker: ce009_01_f
    en: U-um, don't you think you're a little too close...?
    ko: 저, 저기… 그… 거리가 너무 가깝….
    ja: |-
      そ、その…えっと…
      距離が、近…
  d_nikke_ce009_01_02_27:
    speaker: privaty
    en: The Commander talked about us? What'd he say?
    ko: 지휘관이 우리 이야기를 했나요? 뭐라고 하셨죠?
    ja: |-
      指揮官が私たちの話をしたと言いましたね？
      どんなことを聞いたのですか？
  d_nikke_ce009_01_02_28:
    speaker: privaty
    en: Did he say anything about me?!
    ko: 특히 저에 관한 거요!
    ja: 特に私のことについて！
  d_nikke_ce009_01_02_29:
    speaker: yulha
    en: Why do you want to know?
    ko: 그게 왜 궁금한데.
    ja: なんでそんなとこを強調するのよ。
  d_nikke_ce009_01_02_30:
    speaker: privaty
    en: I-I'm just curious, okay?!
    ko: 그, 그냥 신경 쓰이잖아요!
    ja: で、でも気になるじゃないですか！
  d_nikke_ce009_01_02_31:
    speaker: ce009_01_f
    en: He told me you were a very diligent squad.
    ko: 굉장히 성실한 스쿼드라고 하시던걸요.
    ja: と、とても真面目な部隊だって言ってました。
  d_nikke_ce009_01_02_32:
    speaker: privaty
    en: "... Is that all he said?"
    ko: "…그게 끝인가요?"
    ja: "…それだけですか？"
  d_nikke_ce009_01_02_33:
    speaker: privaty
    en: Anything else?
    ko: 다른 건 없어요?
    ja: 他には何か？
  d_nikke_ce009_01_02_34:
    speaker: ce009_01_f
    en: Other than that?
    ko: 다른 거…?
    ja: 他に…？
  d_nikke_ce009_01_02_35:
    speaker: ce009_01_f
    en: Not really. He's told me about so many different squads...
    ko: |-
      특별히는요.
      워낙 많은 스쿼드들의 이야기를 들어서….
    ja: |-
      ええと…と、特には。
      私も色々な部隊の話を訊いてしまったもので…
  d_nikke_ce009_01_02_36:
    speaker: privaty
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_01_02_37:
    speaker: admi
    en: You don't seem very happy, Privaty.
    ko: 표정이 안 좋으시네요, 프리바티.
    ja: 顔色が悪いですよ、プリバティ。
  d_nikke_ce009_01_02_38:
    speaker: admi
    en: Isn't it a good thing to be considered diligent?
    ko: 성실하다고 평가받았으면, 좋은 것 아닌가요?
    ja: |-
      真面目だと評価されているなら、
      喜ぶべきですよね？
  d_nikke_ce009_01_02_39:
    speaker: yulha
    en: She's probably off thinking about something stupid again.
    ko: 또 시답잖은 생각이나 하고 있겠지.
    ja: どうせまたつまらないことを考えてるのよ。
  d_nikke_ce009_01_02_40:
    speaker: admi
    en: I see...
    ko: 그렇군요.
    ja: そうですね。
  d_nikke_ce009_01_02_41:
    speaker: yulha
    en: "... Could you at least look at me when you're talking?"
    ko: "…근데 넌 어딜 보면서 대답하는 거야."
    ja: "…あなたもさっきからずっと、何見てるの？"
  d_nikke_ce009_01_02_42:
    speaker: ce009_05_c
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_ce009_01_02_43:
    speaker: admi
    en: A cat...
    ko: 고양이….
    ja: ネコ…
  d_nikke_ce009_01_02_44:
    speaker: ce009_01_f
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_01_02_45:
    speaker: ce009_01_f
    en: Would you like to pet him?
    ko: 혹시 만져보고 싶으신 건가요?
    ja: もしかして、触ってみたいとか…？
  d_nikke_ce009_01_02_46:
    speaker: admi
    en: N-no, that's okay.
    ko: 아, 아뇨. 괜찮아요.
    ja: い、いえ。大丈夫です。
  d_nikke_ce009_01_02_47:
    speaker: ce009_01_f
    en: "... Morgana."
    ko: "…모르가나."
    ja: "…モルガナ。"
  d_nikke_ce009_01_02_48:
    speaker: ce009_05_c
    en: Ugh...
    ko: 정말이지….
    ja: ったく…
  d_nikke_ce009_01_02_49:
    speaker: ce009_05_c
    en: Fine.
    ko: 알았어.
    ja: 分かったよ。
  d_nikke_ce009_01_02_50:
    speaker: ce009_01_f
    en: The Commander told me about you... You're Admi, right?
    ko: 지휘관에게 들었는데, 애드미… 맞죠?
    ja: |-
      指揮官から教えてもらったけど、
      アドミさん…よね？
  d_nikke_ce009_01_02_51:
    speaker: admi
    en: Yes, that's me.
    ko: 네, 맞아요.
    ja: はい。
  d_nikke_ce009_01_02_52:
    speaker: ce009_01_f
    en: Morgana says it's okay, so would you like to pet him?
    ko: 모르가나도 괜찮다고 하니까, 한번 쓰다듬어 보실래요?
    ja: |-
      モルガナも大丈夫だから、
      良かったら撫でてみませんか？
  d_nikke_ce009_01_02_53:
    speaker: admi
    en: I-it's fine, really!
    ko: 저, 정말 괜찮아요!
    ja: ほ、本当に大丈夫です！
  d_nikke_ce009_01_02_54:
    speaker: admi
    en: Just being able to see him is enough for me.
    ko: 정말 보고 있는 것만으로 충분해요.
    ja: 見ているだけでも十分なので。
  d_nikke_ce009_01_02_55:
    speaker: ce009_01_f
    en: You don't have to hold back.
    ko: 너무 사양하지 않으셔도 괜찮아요.
    ja: そんなに遠慮しなくても大丈夫ですよ。
  d_nikke_ce009_01_02_56:
    speaker: ce009_01_f
    en: Morgana's a gentleman. He won't mind if you pet him.
    ko: |-
      모르가나는 [신사]거든요.
      쓰다듬는다고 기분 나빠하지 않아요.
    ja: |-
      モルガナは「紳士」なんです。
      撫でて不機嫌になったりはしないですから。
  d_nikke_ce009_01_02_57:
    speaker: ce009_05_c
    en: Nyahaha! That's right, I'm a gentleman!
    ko: 냐하하. 맞아, 맞아. 이 몸은 [신사]니까!
    ja: ニャフフ。そうそう、ワガハイ、紳士だからな！
  d_nikke_ce009_01_02_58:
    speaker: admi
    en: I-in that case...
    ko: 그, 그러면 조금만 실례할게요….
    ja: じゃ、じゃあ、お言葉に甘えて少しだけ…
  d_nikke_ce009_01_02_59:
    speaker: "<Narration>"
    en: Admi reaches out and gently pets Morgana's head.
    ko: 애드미의 손이 모르가나의 머리를 쓰다듬는다.
    ja: アドミはモルガナの頭をなでた
  d_nikke_ce009_01_02_60:
    speaker: admi
    en: Wh-whoa...!
    ko: 와… 와아…!
    ja: わ…わあ…！
  d_nikke_ce009_01_02_61:
    speaker: "<Narration>"
    en: While Admi is absorbed in petting Morgana, Makoto feels someone's eyes on
      her.
    ko: 애드미가 한참 모르가나를 쓰다듬고 있을 때, 마코토는 묘한 시선을 느꼈다.
    ja: |-
      アドミがモルガナをなでている間、
      真は妙な視線を感じた
  d_nikke_ce009_01_02_62:
    speaker: "<Narration>"
    en: It's the same strange sensation she had while exploring the Ark.
    ko: 방주 시내를 구경하고 있을 때와 비슷한 느낌의 시선.
    ja: |-
      市街地を見物していた時にも
      感じたが、それと似ている
  d_nikke_ce009_01_02_63:
    speaker: ce009_01_f
    en: Sorry... I think that's enough for now.
    ko: "…죄송해요. 이제 슬슬 괜찮을까요?"
    ja: |-
      …ごめんなさい。
      もうそろそろ、いいかしら？
  d_nikke_ce009_01_02_64:
    speaker: admi
    en: S-sorry, I've been petting him for too long, haven't I?
    ko: 죄, 죄송해요. 제가 너무 오래 만지고 있었죠.
    ja: す、すみません。触りすぎましたね。
  d_nikke_ce009_01_02_65:
    speaker: admi
    en: Thank you both for being so considerate.
    ko: 두 분 다 배려해주셔서… 감사합니다.
    ja: お心遣い、ありがとうございました。
  d_nikke_ce009_01_02_66:
    speaker: ce009_05_c
    en: It's nothing for a gentleman like me. Don't worry.
    ko: 이 정도쯤은 이 몸한테 아무것도 아니야. 괜찮아.
    ja: |-
      ワガハイにとっては、
      これくらい何てことないぞ。気にすんな。
  d_nikke_ce009_01_02_67:
    speaker: ce009_01_f
    en: No, it isn't really about the time. I just can't shake the feeling that someone's
      watching us.
    ko: 네, 시간 문제가 아니라 누군가의 시선이 느껴져서 신경이 쓰였어요.
    ja: |-
      ええ。時間の問題じゃなくて、
      誰かの視線を感じたのが気になったんです。
  d_nikke_ce009_01_02_68:
    speaker: admi
    en: I see.
    ko: 앗, 그렇겠군요.
    ja: ああ、そういうことでしたか。
  d_nikke_ce009_01_02_69:
    speaker: "<Narration>"
    en: Murmurs ripple through the surrounding crowd.
    ko: 주변이 웅성거리기 시작했다.
    ja: 街がざわつき始めた
  d_nikke_ce009_01_02_70:
    speaker: "<Narration>"
    en: On the opposite side of the Central Government Headquarters, Leona is stopping
      passersby to speak with them.
    ko: 레오나가 청사 반대편에서 지나가는 행인들을 붙잡고 말을 거는 모습이 보인다.
    ja: |-
      レオナが庁舎の向かい側の道で
      通行人に話しかけている
  d_nikke_ce009_01_02_71:
    speaker: timi
    en: "*Growl!*"
    ko: 크허엉!
    ja: ガオー！
  d_nikke_ce009_01_02_72:
    speaker: leona
    en: I heard someone spotted a stray cat around here. Has anyone seen it?
    ko: 길고양이를 목격했다는 제보를 들었는데, 혹시 본 사람이 있을까?
    ja: |-
      野良ネコを見かけたって
      通報があったんだけど、
      見かけた人はいませんか？
  d_nikke_ce009_01_02_73:
    speaker: ce009_01_f
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_ce009_01_02_74:
    speaker: privaty
    en: "... If she realizes the cat's here, we're going to have a real problem."
    ko: "…이거 고양이가 여기 있다는 걸 들키면 상당히 귀찮아지겠어요."
    ja: |-
      …ここにいると気づかれたら、
      非常に面倒なことになりそうです。
  d_nikke_ce009_01_02_75:
    speaker: yulha
    en: He's definitely going to end up in a shelter.
    ko: 무조건 동물 보호소 행이겠지.
    ja: シェルター送りにしようとするでしょうね。
  d_nikke_ce009_01_02_76:
    speaker: ce009_01_f
    en: Wh-what do we do...?
    ko: 어, 어쩌지…?
    ja: ど、どうしよう…？
  d_nikke_ce009_01_02_77:
    speaker: admi
    en: We'll try to buy you some time.
    ko: 저희가 시간을 끌어볼게요.
    ja: 私たちが時間を稼ぎます。
  d_nikke_ce009_01_02_78:
    speaker: yulha
    en: Yeah, that's the best plan.
    ko: 그래, 그게 좋겠어.
    ja: そうね、それがいいわ。
  d_nikke_ce009_01_02_79:
    speaker: yulha
    en: We'll stall her. Get out of here while you can.
    ko: 우리가 말을 걸어서 시간을 끌고 있을 테니까, 그 틈에 빨리 여길 떠나.
    ja: |-
      私たちが足止めしておくから、
      早くここを離れて。
  d_nikke_ce009_01_02_80:
    speaker: ce009_01_f
    en: Will that really be okay? I don't want to inconvenience anyone...
    ko: 그래도 괜찮을까요? 괜히 민폐만 끼치는 것 같은데….
    ja: |-
      いいんですか？
      迷惑をおかけしてしまうんじゃ…
  d_nikke_ce009_01_02_81:
    speaker: yulha
    en: Just consider it my way of saying thanks for showing us the cat...
    ko: 그냥 고양이를 보여준 답례….
    ja: ネコを見せてもらった…
  d_nikke_ce009_01_02_82:
    speaker: yulha
    en: No, more importantly, for letting Admi pet him.
    ko: 아니, 애드미한테 고양이를 쓰다듬게 해준 답례라고 생각해.
    ja: |-
      いえ、アドミにネコをなでさせてくれた
      お礼だと思って。
  d_nikke_ce009_01_02_83:
    speaker: yulha
    en: Thanks to you, I got to see that cute look on her face.
    ko: 덕분에 귀여운 표정을 봤거든.
    ja: おかげでいい顔が見れたわ。
  d_nikke_ce009_01_02_84:
    speaker: admi
    en: Y-Yulha!
    ko: 유, 율하!
    ja: ユ、ユルハ！
  d_nikke_ce009_01_02_85:
    speaker: privaty
    en: Anyway, leave it to us and get going before Leona comes any closer.
    ko: 아무튼 여긴 우리한테 맡기고, 레오나가 이쪽으로 더 다가오기 전에 빨리 가세요.
    ja: |-
      とにかく、ここは私たちに任せて
      レオナが来る前に行ってください。
  d_nikke_ce009_01_02_86:
    speaker: ce009_01_f
    en: "... Thank you. I'll leave it to you, then!"
    ko: "…감사합니다. 그럼 부탁드릴게요!"
    ja: |-
      …ありがとうございます。
      後のことは、お願いしますね！
  d_nikke_ce009_01_02_87:
    speaker: ce009_05_c
    en: See ya, Admi!
    ko: 또 보자, 애드미!
    ja: またな、アドミ！
  d_nikke_ce009_01_02_88:
    speaker: "<Narration>"
    en: With the Triangle Squad covering her back, Makoto runs in the opposite direction
      from Leona.
    ko: 마코토는 트라이앵글 스쿼드에게 뒤를 맡긴 채, 레오나가 오는 반대 방향으로 뛰어갔다.
    ja: |-
      真とモルガナはトライアングル部隊に後を任せ、
      レオナの進行方向と反対側へ駆け出した
d_nikke_ce009_01_03:
  d_nikke_ce009_01_03_1:
    speaker: ce009_01_f
    en: Do you think she's finally given up?
    ko: 이젠 안 쫓아오려나?
    ja: もう追ってこないかしら？
  d_nikke_ce009_01_03_2:
    speaker: ce009_05_c
    en: We've come pretty far, so I think we're in the clear now.
    ko: 이만큼 도망쳤으면 괜찮겠지.
    ja: これだけ逃げたら大丈夫だろ。
  d_nikke_ce009_01_03_3:
    speaker: ce009_05_c
    en: Thanks to those guys, we actually managed to get away.
    ko: 그래도 그 녀석들 덕분에 도망칠 수 있었네.
    ja: アイツらのおかげで助かったな。
  d_nikke_ce009_01_03_4:
    speaker: ce009_05_c
    en: But why are we even running in the first place—Mmph!
    ko: 근데 대체 우리가 왜 도망쳐야… 읍!
    ja: でも、なんでワガハイたちが逃げ…もがっ！
  d_nikke_ce009_01_03_5:
    speaker: "<Narration>"
    en: Makoto clamps her hand over Morgana's muzzle,
    ko: 마코토가 모르가나의 입을 가렸다.
    ja: 真はモルガナの口を塞ぎ…
  d_nikke_ce009_01_03_6:
    speaker: "<Narration>"
    en: then ducks around the corner of an alleyway.
    ko: 그리고 골목길 모퉁이에 몸을 숨겼다.
    ja: そのまま路地の隅に身を隠した
  d_nikke_ce009_01_03_7:
    speaker: leona
    en: Kittyyy! Where are you?
    ko: 고양아~ 어디 있어~?
    ja: ネコちゃ～ん、どこ行ったの～？
  d_nikke_ce009_01_03_8:
    speaker: leona
    en: I'm not gonna hurt you, I promise!
    ko: 나쁜 짓 하려는 거 아니야~
    ja: なんにも怖くないからね～
  d_nikke_ce009_01_03_9:
    speaker: leona
    en: I just want to take you somewhere nice and give you something tasty to eat,
      so there's no need to run away.
    ko: 좋은 곳에서 맛있는 거 먹게 해주려고 하는 건데, 왜 도망칠까?
    ja: |-
      素敵な場所でおいしいものが食べられるよ、
      逃げなくても大丈夫だよ～？
  d_nikke_ce009_01_03_10:
    speaker: leona
    en: Right, Timi?
    ko: 그렇지, 티미?
    ja: そうでしょ、ティミ？
  d_nikke_ce009_01_03_11:
    speaker: timi
    en: Rawr!
    ko: 크헝.
    ja: ガオ！
  d_nikke_ce009_01_03_12:
    speaker: leona
    en: Yeah, I wonder where it went...
    ko: 그러게, 대체 어디로 갔을까….
    ja: うーん、どこに行っちゃったのかな…
  d_nikke_ce009_01_03_13:
    speaker: leona
    en: Kittyyy! Where are youuu?
    ko: 고양아~ 어디 있니~
    ja: ネコちゃ～ん、どこ～？
  d_nikke_ce009_01_03_14:
    speaker: "<Narration>"
    en: Leona's voice gradually grows distant.
    ko: 레오나의 목소리가 점점 멀어졌다.
    ja: レオナの声が徐々に遠ざかった
  d_nikke_ce009_01_03_15:
    speaker: ce009_01_f
    en: "... I think they're finally gone."
    ko: "…드디어 갔나 봐."
    ja: "…やっと行ったみたい。"
  d_nikke_ce009_01_03_16:
    speaker: "<Narration>"
    en: Makoto takes her hand off Morgana's muzzle.
    ko: 마코토는 모르가나의 입을 가리던 손을 치웠다.
    ja: 真はモルガナの口を塞ぐ手を離した
  d_nikke_ce009_01_03_17:
    speaker: ce009_05_c
    en: Phew!
    ko: 푸하!
    ja: プハッ！
  d_nikke_ce009_01_03_18:
    speaker: ce009_05_c
    en: But seriously, why do we have to run from them?
    ko: 아니, 근데 대체 왜 우리가 도망쳐야 하는데!
    ja: |-
      なんでワガハイたちが
      逃げなきゃなんねぇんだ！？
  d_nikke_ce009_01_03_19:
    speaker: ce009_01_f
    en: The Commander told us to be careful, remember?
    ko: 지휘관이 조심하라고 말해줬었잖아.
    ja: 指揮官が気をつけろって言ってたでしょ？
  d_nikke_ce009_01_03_20:
    speaker: ce009_01_f
    en: We got too complacent.
    ko: 우리가 너무 안일했던 거지.
    ja: 私たちの考えが甘すぎたのよ。
  d_nikke_ce009_01_03_21:
    speaker: ce009_01_f
    en: I figured the collar would keep people from mistaking you for a stray...
    ko: 목걸이도 하고 있었으니 길고양이처럼 보이지는 않을 거라고 생각했는데….
    ja: |-
      首輪も着けているし、
      野良には見えないと思っていたけど…
  d_nikke_ce009_01_03_22:
    speaker: ce009_01_f
    en: But I guess they might not be able to tell from a distance.
    ko: 멀리서 보면 모를 수도 있겠네.
    ja: 遠目にはわからないのかもしれないわね…
  d_nikke_ce009_01_03_23:
    speaker: ce009_05_c
    en: "... What if we showed them I can talk?"
    ko: "…혹시 이 몸이 말하는 모습을 보여주면 괜찮지 않을까?"
    ja: |-
      …ワガハイが話すところを見せれば
      納得するんじゃないか？
  d_nikke_ce009_01_03_24:
    speaker: ce009_05_c
    en: Then we could just tell them I'm not actually a cat.
    ko: 고양이가 아니라고 사실을 말해주면 되잖아.
    ja: ネコじゃないって事実を証明すればいいだろ？
  d_nikke_ce009_01_03_25:
    speaker: ce009_01_f
    en: I don't know about that.
    ko: 글쎄.
    ja: どうかしら。
  d_nikke_ce009_01_03_26:
    speaker: ce009_01_f
    en: If they found out you're a talking cat, they'd probably be even more determined
      to catch you.
    ko: 말하는 고양이가 나타났다고, 더 붙잡으려 혈안이 될 것 같은….
    ja: |-
      しゃべるネコが現れたって、
      余計捕まえようとするんじゃ…
  d_nikke_ce009_01_03_27:
    speaker: leona
    en: Kitty?
    ko: 고양아?
    ja: ネコ？
  d_nikke_ce009_01_03_28:
    speaker: ce009_01_f
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_ce009_01_03_29:
    speaker: ce009_05_c
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_ce009_01_03_30:
    speaker: "<Narration>"
    en: Makoto and Morgana come face-to-face with Leona, who pops up out of nowhere.
    ko: 마코토와 모르가나는 갑자기 나타난 레오나와 눈이 마주쳤다.
    ja: いつの間にか近くにいたレオナと目が合った
  d_nikke_ce009_01_03_31:
    speaker: ce009_05_c
    en: W-we've been spotted!
    ko: 드, 들켰다!
    ja: み、見つかった！
  d_nikke_ce009_01_03_32:
    speaker: ce009_05_c
    en: Run!
    ko: 도망쳐!
    ja: 逃げるぞ！
  d_nikke_ce009_01_03_33:
    speaker: "<Narration>"
    en: Makoto bolts toward the opposite alleyway.
    ko: 마코토는 반대편 골목길로 뛰기 시작했다.
    ja: 真は反対側の路地へ駆け出した
  d_nikke_ce009_01_03_34:
    speaker: leona
    en: Did that cat just talk...? No, that's beside the point!
    ko: 고양이가 사람 말을… 아니, 이게 아니지.
    ja: ネコがしゃべって…って、それより…
  d_nikke_ce009_01_03_35:
    speaker: leona
    en: W-wait!
    ko: 자, 잠깐만!
    ja: ま、待って！
  d_nikke_ce009_01_03_36:
    speaker: leona
    en: Miss!
    ko: 거기 학생!
    ja: そこのあなた！
  d_nikke_ce009_01_03_37:
    speaker: leona
    en: I'm not trying to hurt the cat!
    ko: 고양이한테 나쁜 짓을 하려는 거 아니라니까!
    ja: ネコに悪いようにする気はないから！
  d_nikke_ce009_01_03_38:
    speaker: "<Narration>"
    en: Her footsteps fade into the distance.
    ko: 타다다닥-
    ja: ダダダダッ――
  d_nikke_ce009_01_03_39:
    speaker: leona
    en: Oh, come on!
    ko: 도망치지 말라니까?!
    ja: 聞こえてないの～！？
  d_nikke_ce009_01_03_40:
    speaker: ce009_01_f
    en: "*Huff, huff*"
    ko: 하아, 하아.
    ja: はあ、はあ…
  d_nikke_ce009_01_03_41:
    speaker: ce009_01_f
    en: I just ran without thinking... Where are we?
    ko: 도망친다고 무작정 뛰어왔는데, 여긴 대체 어디야.
    ja: とにかく逃げてきたけど、ここはどこかしら？
  d_nikke_ce009_01_03_42:
    speaker: ce009_05_c
    en: Looks like we're at the library.
    ko: 도서관인 것 같은데?
    ja: 図書館じゃないか？
  d_nikke_ce009_01_03_43:
    speaker: ce009_05_c
    en: There's a sign over there.
    ko: 저기에 적혀 있어.
    ja: あそこに書いてあるぞ。
  d_nikke_ce009_01_03_44:
    speaker: ce009_01_f
    en: The library...?
    ko: 도서관…?
    ja: 図書館…？
  d_nikke_ce009_01_03_45:
    speaker: "<Narration>"
    en: A sign at the building's entrance reads "Ark Library."
    ko: 건물 입구에는 [방주 도서관]이라고 적혀 있다.
    ja: 建物の入口に「アーク図書館」と書かれている
  d_nikke_ce009_01_03_46:
    speaker: "<Narration>"
    en: It seems to be closing time, as a staff member is locking the doors.
    ko: 다만 이제 폐관 시간이 되었는지, 직원이 문을 닫고 있었다.
    ja: |-
      しかしすでに閉館の時間なのか、
      職員らしき人物が施錠を始めていた
  d_nikke_ce009_01_03_47:
    speaker: ce009_01_f
    en: Huh? Isn't that staff member...
    ko: 어라? 저 직원, 혹시….
    ja: あら？　あの人、もしかして…
  d_nikke_ce009_01_03_48:
    speaker: ce009_01_f
    en: Phantom?
    ko: 팬텀…?
    ja: ファントム…？
  d_nikke_ce009_01_03_49:
    speaker: phantom
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_ce009_01_03_50:
    speaker: "<Narration>"
    en: Phantom looks over at Makoto while closing the library door.
    ko: 도서관 문을 닫고 있던 팬텀이 마코토를 바라보았다.
    ja: 施錠していたファントムが振り返った
  d_nikke_ce009_01_03_51:
    speaker: phantom
    en: Makoto?
    ko: 마코토?
    ja: 真？
  d_nikke_ce009_01_03_52:
    speaker: "<Narration>"
    en: Morgana pokes his head out of the bag.
    ko: 모르가나가 가방 밖으로 얼굴을 내밀었다.
    ja: モルガナがカバンの外に顔を出した
  d_nikke_ce009_01_03_53:
    speaker: ce009_05_c
    en: I'm here, too!
    ko: 이 몸도 있어!
    ja: ワガハイもいるぞ！
  d_nikke_ce009_01_03_54:
    speaker: phantom
    en: Oh, Morgana, you're here as well.
    ko: 아, 모르가나도 있었구려.
    ja: ああ、モルガナもいたのか。
  d_nikke_ce009_01_03_55:
    speaker: phantom
    en: My apologies. I didn't notice you were inside the bag.
    ko: 가방 안에 있어서 몰라봤소. 미안하오.
    ja: |-
      カバンの中は気づかなかったよ。
      失礼したね。
  d_nikke_ce009_01_03_56:
    speaker: ce009_05_c
    en: What are you doing here, Phantom?
    ko: 팬텀은 왜 여기 있는 거야?
    ja: ファントムはどうしてここに？
  d_nikke_ce009_01_03_57:
    speaker: phantom
    en: Isn't it only natural for a librarian to be in a library?
    ko: 도서관 사서가 도서관에 있는 건 당연한 일 아니오.
    ja: 司書が図書館にいるのは当然だろう？
  d_nikke_ce009_01_03_58:
    speaker: ce009_01_f
    en: A librarian...?
    ko: 사서…?
    ja: 司書…？
  d_nikke_ce009_01_03_59:
    speaker: phantom
    en: I'm a librarian by trade. Didn't I mention that before?
    ko: 내 본업은 사서요. 예전에 말한 적 있지 않소?
    ja: |-
      本業は司書なのだよ。
      言っていなかったかな？
  d_nikke_ce009_01_03_60:
    speaker: ce009_01_f
    en: I don't think you have.
    ko: 처음 들어보는데.
    ja: 初耳よ。
  d_nikke_ce009_01_03_61:
    speaker: phantom
    en: Perhaps I mentioned it to someone else... In any case, I'm glad you know now.
    ko: |-
      다른 사람한테 말했던가….
      아무튼 지금이라도 알아주면 고맙겠소.
    ja: |-
      おや、話したのは別の誰かだったか…？
      とにかく、そういうことだ。
  d_nikke_ce009_01_03_62:
    speaker: phantom
    en: So, what brings you to the library?
    ko: 그래서 도서관에는 어쩐 일이오?
    ja: それで、図書館に何の用かな？
  d_nikke_ce009_01_03_63:
    speaker: phantom
    en: We're already closed for the day.
    ko: 이미 폐관 시간은 지났소.
    ja: すでに閉館時間は過ぎてしまっているが。
  d_nikke_ce009_01_03_64:
    speaker: "<Narration>"
    en: Just then, Leona's voice calls out from the distance.
    ko: 그때, 멀리서 레오나의 목소리가 들려왔다.
    ja: その時、遠くからレオナの声が聞こえた
  d_nikke_ce009_01_03_65:
    speaker: leona
    en: Where are youuu, kitty?
    ko: 고양아, 어디 있니~
    ja: ネコちゃ～ん、どこ～？
  d_nikke_ce009_01_03_66:
    speaker: ce009_01_f
    en: W-we gotta run!
    ko: 도, 도망쳐야 돼!
    ja: に、逃げなきゃ！
  d_nikke_ce009_01_03_67:
    speaker: phantom
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_01_03_68:
    speaker: phantom
    en: Are you being pursued?
    ko: 혹시 쫓기고 있는 것이오?
    ja: どうやら、追われているようだね？
  d_nikke_ce009_01_03_69:
    speaker: ce009_01_f
    en: It just kind of happened that way.
    ko: 어쩌다 보니 그렇게 됐어.
    ja: 気づいたらそうなっちゃったの。
  d_nikke_ce009_01_03_70:
    speaker: ce009_01_f
    en: It's not like we're being chased because we did anything wrong...
    ko: 딱히 잘못해서 쫓기고 있는 건 아니긴 한데….
    ja: 別に悪いことしたわけじゃないんだけど…
  d_nikke_ce009_01_03_71:
    speaker: phantom
    en: Hmm...
    ko: 음….
    ja: ふーむ…
  d_nikke_ce009_01_03_72:
    speaker: phantom
    en: As one phantom thief to another, I cannot simply stand by.
    ko: 같은 괴도끼리의 정을 생각해서, 두고 볼 수만은 없겠군.
    ja: 怪盗同士のよしみだ、放ってはおけないな。
  d_nikke_ce009_01_03_73:
    speaker: phantom
    en: Come with me. I shall make an exception and permit you to use the library
      after hours.
    ko: 이쪽으로 오시오. 특별히 도서관의 운영시간 외 열람을 허락해 주겠소.
    ja: |-
      ついて来たまえ。
      時間外だが、特別に図書館への
      立ち入りを許可しよう。
d_nikke_ce009_01_04:
  d_nikke_ce009_01_04_1:
    speaker: leona
    en: Where in the world did they go?
    ko: 대체 어디로 간 거지?
    ja: どこに行っちゃったんだろ？
  d_nikke_ce009_01_04_2:
    speaker: "<Narration>"
    en: Leona walks over to Phantom, who's locking up the library.
    ko: 레오나가 도서관 문을 잠그고 있는 팬텀에게 다가왔다.
    ja: |-
      レオナは図書館の施錠をしている
      ファントムに話しかけた
  d_nikke_ce009_01_04_3:
    speaker: leona
    en: Hey, have you seen a cat around here?
    ko: 저기, 혹시 고양이 한 마리 못 봤어?
    ja: ねえ、ネコを見てない？
  d_nikke_ce009_01_04_4:
    speaker: phantom
    en: A cat?
    ko: 고양이 말이오?
    ja: ネコかい？
  d_nikke_ce009_01_04_5:
    speaker: phantom
    en: I can't say I have.
    ko: 못 봤소.
    ja: 見ていないな。
  d_nikke_ce009_01_04_6:
    speaker: phantom
    en: One doesn't often come across such a rare creature.
    ko: 그런 희귀한 존재를 어찌 쉽게 보겠소.
    ja: |-
      生き物なんて珍しい。
      そうそう見かけるはずないと思うが。
  d_nikke_ce009_01_04_7:
    speaker: leona
    en: That's strange... I could've sworn she came this way.
    ko: 이상하다? 분명 이쪽으로 온 것 같았는데….
    ja: 変ね…こっちに向かってたはずなんだけど…
  d_nikke_ce009_01_04_8:
    speaker: phantom
    en: I haven't seen any cats, but I did see someone who seemed to be making a hasty
      escape.
    ko: 고양이는 못 봤지만, 급하게 도망가고 있는 것 같은 사람이라면 봤소.
    ja: |-
      ネコのことは知らないが、
      ずいぶん急いでいる様子の人は見かけたよ。
  d_nikke_ce009_01_04_9:
    speaker: leona
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_ce009_01_04_10:
    speaker: leona
    en: Was she carrying a shoulder bag?
    ko: 그 사람 혹시 숄더백을 들고 있었어?
    ja: その人、ショルダーバッグを提げてなかった？
  d_nikke_ce009_01_04_11:
    speaker: phantom
    en: Yes, indeed.
    ko: 그렇소.
    ja: 言われてみれば。
  d_nikke_ce009_01_04_12:
    speaker: leona
    en: Can you tell me which way she went?
    ko: 어디로 갔는지 알려 줄 수 있을까?
    ja: どっちに行ったか教えてくれない？
  d_nikke_ce009_01_04_13:
    speaker: phantom
    en: She went that way.
    ko: 그 사람이라면 저쪽으로 갔소.
    ja: あちらへ走っていったね。
  d_nikke_ce009_01_04_14:
    speaker: "<Narration>"
    en: Phantom points in the opposite direction to the library.
    ko: 팬텀은 도서관 반대 방향을 가리켰다.
    ja: ファントムが図書館とは反対の方向を指さした
  d_nikke_ce009_01_04_15:
    speaker: leona
    en: Thanks for letting me know!
    ko: 알려줘서 고마워!
    ja: 教えてくれてありがとう！
  d_nikke_ce009_01_04_16:
    speaker: leona
    en: Let's go, Timi!
    ko: 가자, 티미!
    ja: 行くよ、ティミ！
  d_nikke_ce009_01_04_17:
    speaker: timi
    en: "*Growl!*"
    ko: 커헝!
    ja: ガオォ！
  d_nikke_ce009_01_04_18:
    speaker: "<Narration>"
    en: Leona and Timi hurry off in the direction Phantom pointed.
    ko: 레오나와 티미는 팬텀이 가리킨 방향으로 뛰어갔다.
    ja: |-
      レオナとティミは、
      ファントムが示した方向へ駆けていった
  d_nikke_ce009_01_04_19:
    speaker: "<Narration>"
    en: Once they're out of sight, Phantom steps into the library.
    ko: 팬텀은 그 모습을 확인한 뒤, 도서관 안으로 들어갔다.
    ja: |-
      ファントムはそれを確かめ、
      図書館の中へ戻った
  d_nikke_ce009_01_04_20:
    speaker: phantom
    en: I made sure Leona was well out of the way,
    ko: 레오나가 꽤 멀리까지 가는 걸 확인은 했는데,
    ja: レオナが遠くまで行ったのは確認したが…
  d_nikke_ce009_01_04_21:
    speaker: phantom
    en: but I still think it'd be best if you stayed in the library for the time being.
    ko: 그래도 일단 한동안은 도서관에 있는 게 어떻겠소?
    ja: |-
      念のため、しばらくここにいたほうが
      いいのではないかな？
  d_nikke_ce009_01_04_22:
    speaker: phantom
    en: The Ark Library is one of the most secure places in the Ark, so you should
      be safe here.
    ko: 방주의 도서관은 보안 등급이 아주 높은 곳이라 안전하오.
    ja: |-
      ここはセキュリティレベルがとても高いから、
      心配しなくていい。
  d_nikke_ce009_01_04_23:
    speaker: phantom
    en: I'll explain everything to Leona later.
    ko: 레오나에게는 나중에 따로 사실을 설명해두도록 하겠소.
    ja: レオナには、後ほど改めて事情を説明しよう。
  d_nikke_ce009_01_04_24:
    speaker: ce009_01_f
    en: Would that really be okay?
    ko: 그래도 될까?
    ja: そうしていいかしら？
  d_nikke_ce009_01_04_25:
    speaker: phantom
    en: Of course.
    ko: 물론이오.
    ja: もちろんだとも。
  d_nikke_ce009_01_04_26:
    speaker: phantom
    en: If you grow bored, you're welcome to have a look around the library. Though
      I'm afraid there's little to see besides the books.
    ko: 심심하면 도서관 구경을 해도 좋소. 볼 만한 건 책밖에 없겠지만.
    ja: |-
      退屈であれば、館内を見学しても構わないよ。
      見るべきものは本しかないと思うがね。
  d_nikke_ce009_01_04_27:
    speaker: ce009_05_c
    en: You did say you wanted to check out the library.
    ko: 마코토, 도서관에도 오고 싶어 했었잖아.
    ja: 真、図書館に来たがってたよな。
  d_nikke_ce009_01_04_28:
    speaker: ce009_05_c
    en: We kinda just ended up here, but I guess it worked out.
    ko: 의도하고 온 건 아니었지만 잘됐네.
    ja: |-
      計画通りにはいかなかったけど、
      よかったじゃねえか。
  d_nikke_ce009_01_04_29:
    speaker: ce009_01_f
    en: I guess you're right.
    ko: 그러게.
    ja: そうね。
  d_nikke_ce009_01_04_30:
    speaker: ce009_01_f
    en: Thanks for everything, Phantom.
    ko: 여러모로 고마워, 팬텀.
    ja: 色々とありがとう、ファントム。
  d_nikke_ce009_01_04_31:
    speaker: ce009_01_f
    en: I never even got the chance to explain what was going on...
    ko: 사정도 제대로 설명 못 했는데….
    ja: 事情もちゃんと説明できていないのに…
  d_nikke_ce009_01_04_32:
    speaker: phantom
    en: It's just the sort of camaraderie only fellow phantom thieves share.
    ko: 이게 다 괴도 동지끼리만 이해할 수 있는 정이라오.
    ja: 怪盗同士、分かることもあるさ。
  d_nikke_ce009_01_04_33:
    speaker: phantom
    en: Oh, before I show you around the library, would you mind waiting a moment?
    ko: 아, 도서관을 구경하기 전에 잠깐만 기다려 주시겠소?
    ja: |-
      ああ、図書館見学の前に
      少し待っていてもらえるかな？
  d_nikke_ce009_01_04_34:
    speaker: phantom
    en: There's something I need to take care of.
    ko: 해야 할 것이 좀 있다오.
    ja: 連絡をしておかないと。
  d_nikke_ce009_01_04_35:
    speaker: "<Narration>"
    en: Phantom steps away for a moment and returns in less than ten minutes.
    ko: 팬텀은 잠깐 어디로 향하더니, 10분도 지나지 않아 돌아왔다.
    ja: |-
      ファントムはどこかへ姿を消し、
      10分も経たないうちに戻ってきた
  d_nikke_ce009_01_04_36:
    speaker: ce009_01_f
    en: Where'd you go?
    ko: 어디에 갔다 온 거야?
    ja: どこに行ってたの？
  d_nikke_ce009_01_04_37:
    speaker: "<Narration>"
    en: Phantom shows Makoto what she's holding.
    ko: 팬텀은 손에 들고 있던 것들을 보여주었다.
    ja: ファントムは手にしているものを見せた
  d_nikke_ce009_01_04_38:
    speaker: "<Narration>"
    en: In one hand is a duty log, and in the other is a change of clothes.
    ko: 한 손에는 당직일지, 그리고 다른 한 손에는 옷 한 벌이 들려 있다.
    ja: |-
      片手に当直日誌と書かれたもの、
      もう片方の手には一揃いの服が握られている
  d_nikke_ce009_01_04_39:
    speaker: ce009_05_c
    en: A duty log?
    ko: 당직일지?
    ja: 当直日誌？
  d_nikke_ce009_01_04_40:
    speaker: phantom
    en: I had to switch shifts with another staff member so I could be with you.
    ko: 그대들과 함께 있으려면 당직 근무자를 바꿔야 했소.
    ja: |-
      君たちを案内するなら、
      誰かに当番を代わって
      もらわなければならないのでね。
  d_nikke_ce009_01_04_41:
    speaker: ce009_01_f
    en: Sorry, you even went out of your way to switch shifts because of us...
    ko: 미안해. 우리 때문에 일부러 당직까지 바꾸고….
    ja: |-
      えっ、わざわざ交代を？
      私たちのせいでごめんなさい…！
  d_nikke_ce009_01_04_42:
    speaker: phantom
    en: Worry not. Like I said, it's just the camaraderie between fellow phantom thieves.
    ko: |-
      괜찮소.
      아까도 말했지만, 이게 다 괴도끼리의 정 아니겠소?
    ja: |-
      いや、構わないさ。
      先ほども言ったが、
      「怪盗」同士のよしみだろう？
  d_nikke_ce009_01_04_43:
    speaker: "<Narration>"
    en: Phantom smiles and flips open the duty log.
    ko: 팬텀이 웃으며 당직일지를 펴서 보여주었다.
    ja: ファントムは当直日誌を開いてみせた
  d_nikke_ce009_01_04_44:
    speaker: "<Narration>"
    en: '"Note: I swaped shifs with Lable to acomodate some guets."'
    ko: "[비고: 손임 안네룰 위헤 래이불과 당직 일쩡을 바껏소.]"
    ja: "「れんらくじこう：けんがくしゃ \nあんないのため れーべるに \nとうばんを へんこう」"
  d_nikke_ce009_01_04_45:
    speaker: ce009_01_f
    en: That's... quite a unique sentence.
    ko: 굉장히 개성적인 문장이네….
    ja: ずいぶん個性的な書き方ね…
  d_nikke_ce009_01_04_46:
    speaker: phantom
    en: And about these clothes...
    ko: 그리고 이 옷 말인데.
    ja: それから、こちらの服は…
  d_nikke_ce009_01_04_47:
    speaker: phantom
    en: Would you accept them, Makoto?
    ko: 마코토, 이걸 받아주겠소?
    ja: 真、受け取ってもらえるかい？
  d_nikke_ce009_01_04_48:
    speaker: "<Narration>"
    en: Phantom hands the clothes to Makoto.
    ko: 팬텀은 손에 들고 있던 옷을 마코토에게 건넸다.
    ja: ファントムが服を真に差し出した
  d_nikke_ce009_01_04_49:
    speaker: ce009_01_f
    en: What's this...?
    ko: 이건…?
    ja: これは…？
  d_nikke_ce009_01_04_50:
    speaker: phantom
    en: A set of pajamas.
    ko: 잠옷이라오.
    ja: パジャマさ。
  d_nikke_ce009_01_04_51:
    speaker: phantom
    en: I thought it best that you spend the night here at the library, so I had these
      prepared for your comfort.
    ko: 아예 도서관에서 묵고 가는 게 좋을 것 같으니, 편하게 있으라고 준비했소.
    ja: |-
      いっそここに泊まっていくといい。
      くつろげるようにと思ってね。
  d_nikke_ce009_01_04_52:
    speaker: "<Narration>"
    en: Makoto unfolds the pajamas Phantom gave her.
    ko: 마코토는 팬텀에게 받은 잠옷을 펼쳐본다.
    ja: |-
      真はファントムから受け取った
      パジャマを確認した
  d_nikke_ce009_01_04_53:
    speaker: ce009_01_f
    en: Th-this is...!
    ko: 이, 이건…!
    ja: こ、これは…！
  d_nikke_ce009_01_04_54:
    speaker: phantom
    en: I hope it's to your liking.
    ko: 마음에 들었으면 좋겠구려.
    ja: 気に入ってもらえるといいが。
  d_nikke_ce009_01_04_55:
    speaker: ce009_01_f
    en: Buchimaru-kun?!
    ko: 부치마루?!
    ja: これ…「ブチまる君」！？
  d_nikke_ce009_01_04_56:
    speaker: ce009_01_f
    en: "... No, wait. It isn't."
    ko: "…가 아니구나."
    ja: "…あっ、ごめんなさい、違うわね…"
  d_nikke_ce009_01_04_57:
    speaker: phantom
    en: What's this "Buchimaru-kun"?
    ko: 부치마루가 무엇이오?
    ja: ブチまる君…とは、何だい？
  d_nikke_ce009_01_04_58:
    speaker: ce009_01_f
    en: Um... it's this mascot character I like. It kind of looks like a panda.
    ko: 그… 내가 좋아하는 마스코트 캐릭터야. 판다 같은 디자인의 캐릭터.
    ja: |-
      その…私の好きなマスコットキャラクターなの。
      パンダみたいなデザインで…
  d_nikke_ce009_01_04_59:
    speaker: ce009_01_f
    en: O-of course, I know it doesn't really suit me, but...
    ko: 무, 물론 그런 게 나한테 어울리지 않는다는 건 알고 있지만….
    ja: 私のイメージじゃないかもしれないけど…
  d_nikke_ce009_01_04_60:
    speaker: ce009_05_c
    en: Really?
    ko: 그런가?
    ja: そうか？
  d_nikke_ce009_01_04_61:
    speaker: ce009_05_c
    en: I think it suits you just fine. Right, Phantom?
    ko: |-
      이 몸이 보기엔 그렇지 않은 것 같은데.
      그렇지, 팬텀?
    ja: |-
      そんなことないと思うけどなぁ。
      な、ファントム？
  d_nikke_ce009_01_04_62:
    speaker: phantom
    en: Indeed. The pajamas and the sleep mask both suit you very well.
    ko: 그렇소. 잠옷도, 눈가리개도 마코토에게 아주 잘 어울리오.
    ja: |-
      そうだね。このアイマスクも、
      真に似合っているよ。
  d_nikke_ce009_01_04_63:
    speaker: ce009_01_f
    en: They're cute, but I don't know about me wearing them.
    ko: 귀여운 건 맞는데, 그걸 내가 입는 건 다른 문제라니까.
    ja: かわいいけど、私が着るかどうかは別よ。
  d_nikke_ce009_01_04_64:
    speaker: ce009_05_c
    en: Man, you're hard to please...
    ko: 까다롭구만….
    ja: 気難しいなぁ…
  d_nikke_ce009_01_04_65:
    speaker: phantom
    en: I thought these would suit you, so I brought them.
    ko: 나는 마코토와 어울린다고 생각해서 가져왔소.
    ja: |-
      真に似合いそうだと思って
      持って来たんだ。
  d_nikke_ce009_01_04_66:
    speaker: phantom
    en: You're naturally beautiful, so I'm sure even something this cute would suit
      you.
    ko: 마코토는 본판이 좋아서, 이런 귀여운 것들도 잘 어울릴 거요.
    ja: |-
      スタイルがいいから、こういう
      かわいらしいパジャマも似合うはずさ。
  d_nikke_ce009_01_04_67:
    speaker: ce009_05_c
    en: Nyahaha, that's right! See? I told you so!
    ko: |-
      냐후후, 그렇지!
      역시 그렇다니까~
    ja: |-
      ニャフフ、だよな！
      やっぱりそう思うよな～
  d_nikke_ce009_01_04_68:
    speaker: phantom
    en: I can't imagine anyone wearing it better than you.
    ko: 아마 마코토보다 잘 어울리는 사람은 없을 것 같소.
    ja: きっと、真より似合う人はいないだろう。
  d_nikke_ce009_01_04_69:
    speaker: ce009_01_f
    en: I-if you insist...
    ko: 그, 그렇게까지 말한다면….
    ja: そ、そこまで言うなら…
  d_nikke_ce009_01_04_70:
    speaker: ce009_01_f
    en: I guess I could try it on...
    ko: 한번 입어 볼까…?
    ja: 着てみようかしら…？
d_nikke_ce009_01_05:
  d_nikke_ce009_01_05_1:
    speaker: ce009_01_p
    en: "... I've changed into them."
    ko: "…일단 갈아입고 왔어."
    ja: "…とりあえず、着替えたわ。"
  d_nikke_ce009_01_05_2:
    speaker: phantom
    en: Oh!
    ko: 오오!
    ja: ほう！
  d_nikke_ce009_01_05_3:
    speaker: ce009_05_c
    en: See? I told you it'd look great on you, Makoto!
    ko: |-
      이 몸이 어울릴 거라고 했잖아.
      완전 잘 어울려, 마코토!
    ja: 変じゃねーって！バッチリだぞ、マコト！
  d_nikke_ce009_01_05_4:
    speaker: phantom
    en: Just as I thought, I have a good eye.
    ko: 역시 내 눈은 틀리지 않았소.
    ja: やはり、私の目に狂いはなかった。
  d_nikke_ce009_01_05_5:
    speaker: phantom
    en: It suits you perfectly.
    ko: 정말 잘 어울리오.
    ja: 本当によく似合っているよ。
  d_nikke_ce009_01_05_6:
    speaker: ce009_01_p
    en: You're making me blush...
    ko: 그렇게 칭찬을 들으니까 좀 부끄럽네….
    ja: そんなに褒められると、照れくさいんだけど…
  d_nikke_ce009_01_05_7:
    speaker: phantom
    en: Is it comfortable to move around in?
    ko: 혹시 움직이기 불편하지는 않소?
    ja: 動きにくくはないかな？
  d_nikke_ce009_01_05_8:
    speaker: ce009_01_p
    en: It is.
    ko: 그건 괜찮아.
    ja: ええ、その点は大丈夫よ。
  d_nikke_ce009_01_05_9:
    speaker: ce009_01_p
    en: The fabric is soft and stretchy, so it's easy to move around in and really
      comfortable to wear.
    ko: 원단이 부드럽고, 신축성도 있어서 움직이기 편해. 착용감이 정말 좋네.
    ja: |-
      生地は柔らかくて、
      伸縮性もあって動きやすいの。
      すごく着心地がいいわ。
  d_nikke_ce009_01_05_10:
    speaker: phantom
    en: That's a relief.
    ko: 다행이오.
    ja: それはよかった。
  d_nikke_ce009_01_05_11:
    speaker: phantom
    en: Those pajamas are my gift to you, so you're welcome to take them with you
      when you leave.
    ko: 잠옷은 내가 주는 선물이니, 돌아갈 때 가져가도 좋소.
    ja: |-
      パジャマは私からのプレゼントだ。
      持ち帰ってくれても構わない。
  d_nikke_ce009_01_05_12:
    speaker: phantom
    en: Though I'm not sure whether you'll be able to bring them back to your own
      world because of D-Wave...
    ko: D-WAVE 때문에, 원래 세계에까지 가져갈 수 있을지는 모르겠다만.
    ja: |-
      D-WAVEの件があるから、
      難しいかもしれないが…
  d_nikke_ce009_01_05_13:
    speaker: ce009_01_p
    en: Thank you, Phantom.
    ko: 고마워, 팬텀.
    ja: ありがとう、ファントム。
  d_nikke_ce009_01_05_14:
    speaker: ce009_01_p
    en: I feel bad that you've been doing so much for me...
    ko: 그런데 계속 도움만 받아서 미안하네….
    ja: でも、もらってばかりで悪いわ…
  d_nikke_ce009_01_05_15:
    speaker: phantom
    en: If you're happy with the gift, that's enough for me.
    ko: 마코토가 선물을 마음에 들어한다면 나는 그걸로 충분하오.
    ja: |-
      贈ったものが気に入ってもらえたなら、
      それだけで十分さ。
  d_nikke_ce009_01_05_16:
    speaker: phantom
    en: Now, allow me to show you around the library.
    ko: 그럼 이제 도서관을 안내해 주도록 하겠소.
    ja: では、改めて図書館を案内しよう。
  d_nikke_ce009_01_05_17:
    speaker: "<Narration>"
    en: With Phantom leading the way, Makoto begins exploring the library.
    ko: 마코토는 팬텀을 따라 도서관을 둘러보기 시작했다.
    ja: |-
      真はファントムに連れられ、
      図書館の見学を始めた
  d_nikke_ce009_01_05_18:
    speaker: ce009_01_p
    en: This really is a huge library.
    ko: 새삼스럽지만, 진짜 큰 도서관이구나.
    ja: 改めて思ったけど、本当に大きな図書館なのね。
  d_nikke_ce009_01_05_19:
    speaker: ce009_01_p
    en: I wonder how long it'd take to explore the whole place... Actually, am I even
      allowed to go into every room?
    ko: |-
      여길 전부 둘러보려면 얼마나 걸리려나….
      아니, 애초에 모든 장소에 들어갈 수는 있는 거야?
    ja: |-
      全部を見て回ろうと思ったら、
      どれくらいかかるのかしら…
      いえ、そもそもすべての場所に
      私が入ることはできるの？
  d_nikke_ce009_01_05_20:
    speaker: phantom
    en: As long as you're with me, you can go into most places...
    ko: 나와 함께 가면 대부분 둘러볼 수 있지만,
    ja: 私がいれば、ほとんどの場所には入れるが…
  d_nikke_ce009_01_05_21:
    speaker: phantom
    en: but there are still some rooms
    ko: 전부 다 둘러볼 수 있는 것 아니라오.
    ja: すべてというわけにはいかないね。
  d_nikke_ce009_01_05_22:
    speaker: phantom
    en: even I can't take you into.
    ko: 내가 함께 있어도 갈 수 없는 곳은 있소.
    ja: 私の権限でも、案内できない場所はある。
  d_nikke_ce009_01_05_23:
    speaker: ce009_05_c
    en: What's in those rooms?
    ko: 거기엔 뭐가 있는데?
    ja: そこには何があるんだ？
  d_nikke_ce009_01_05_24:
    speaker: phantom
    en: I'm afraid I can't tell you.
    ko: 말해줄 수 없소.
    ja: それは言えないな。
  d_nikke_ce009_01_05_25:
    speaker: ce009_05_c
    en: Now you've really got me curious.
    ko: 그렇게 들으니까 괜히 더 궁금해지는데?
    ja: そう言われると余計気になるぜ。
  d_nikke_ce009_01_05_26:
    speaker: ce009_05_c
    en: Think there's treasure in there?
    ko: 보물이라도 있나?
    ja: オタカラでもあるのか？
  d_nikke_ce009_01_05_27:
    speaker: phantom
    en: As a phantom thief myself, I understand your curiosity about hidden places.
    ko: 괴도로서 비밀스러운 장소가 궁금한 건 이해하오.
    ja: |-
      怪盗として、隠されたものが
      気になるということは分かる。
  d_nikke_ce009_01_05_28:
    speaker: phantom
    en: But they do say curiosity killed the cat.
    ko: 하지만 호기심이 고양이를 죽인다고 했소.
    ja: |-
      しかし、「好奇心はネコを殺す」とも
      言うだろう。
  d_nikke_ce009_01_05_29:
    speaker: phantom
    en: It would be wise not to set foot in there, even in jest.
    ko: 장난으로라도 그곳에 발 들일 생각은 하지 않는 게 좋소.
    ja: |-
      冗談でも、そこへ忍び込むことだけは
      考えないでおいてくれたまえ。
  d_nikke_ce009_01_05_30:
    speaker: ce009_01_p
    en: Morgana,
    ko: 모르가나.
    ja: モルガナ。
  d_nikke_ce009_01_05_31:
    speaker: ce009_01_p
    en: you're putting Phantom on the spot.
    ko: 팬텀이 곤란해 하잖아.
    ja: ファントムが困ってるでしょ。
  d_nikke_ce009_01_05_32:
    speaker: ce009_01_p
    en: Let's just stick to the places she's willing to show us.
    ko: 우린 얌전히 안내해 주는 곳으로만 가자.
    ja: |-
      私たちは、おとなしく
      案内してもらえる場所に行きましょ。
  d_nikke_ce009_01_05_33:
    speaker: ce009_05_c
    en: Yeah, she's already doing us a huge favor by hiding us here, so we can't push
      our luck.
    ko: 그래. 모처럼 숨겨주고 있는데, 폐를 끼칠 수는 없지.
    ja: |-
      ああ、そうだな。
      せっかく泊めてもらえるってのに、
      迷惑はかけられねぇ。
  d_nikke_ce009_01_05_34:
    speaker: ce009_05_c
    en: Though I'm really curious, I won't go into any of those rooms.
    ko: 신경은 쓰이지만, 정말로 가진 않을게.
    ja: 気にはなるが、本当に行くことはしないさ。
  d_nikke_ce009_01_05_35:
    speaker: phantom
    en: Thank you for understanding.
    ko: 이해해 줘서 고맙소.
    ja: 理解に感謝するよ。
  d_nikke_ce009_01_05_36:
    speaker: phantom
    en: I'd show you everything if it were up to me, but rules are rules.
    ko: 내 마음 같아선 다 보여주고 싶지만, 규칙은 규칙이라오.
    ja: |-
      何もかも見せてあげたいとは思うのだが、
      そういう決まりでね。
  d_nikke_ce009_01_05_37:
    speaker: phantom
    en: Still, as long as it isn't a restricted area, I'm happy to show you wherever
      you'd like to go.
    ko: 그래도 출입이 금지된 구역만 아니라면 어디든 좋소.
    ja: |-
      しかし、それ以外のエリアは
      どこを見てくれても大丈夫だ。
  d_nikke_ce009_01_05_38:
    speaker: phantom
    en: If there's a book you'd like to read, do let me know. I'll find it for you.
    ko: |-
      읽고 싶은 책이 있다면 말해주시오.
      뭐든 찾아줄 수 있소.
    ja: |-
      読みたいものがあれば教えてくれたまえ。
      こちらで検索しよう。
  d_nikke_ce009_01_05_39:
    speaker: phantom
    en: Though there are a few books I can't show you...
    ko: 물론 책도 보여줄 수 없는 게 있긴 하지만….
    ja: もちろん、見せられない本もあるが…
  d_nikke_ce009_01_05_40:
    speaker: ce009_01_p
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_ce009_01_05_41:
    speaker: ce009_01_p
    en: Nothing specific comes to mind. I don't really know what books you have here,
      either...
    ko: 특별히 이거다 싶은 게 떠오르는 건 없네. 어떤 책이 있는지도 잘 모르고….
    ja: |-
      特にこれ！ってものは思い浮かばないわ。
      どんな本があるのかもよく知らないし…
  d_nikke_ce009_01_05_42:
    speaker: ce009_01_p
    en: Instead of looking for one specific book,
    ko: 차라리 뭐 하나 정해서 찾는 게 아니라,
    ja: 何か特定の本を探すんじゃなくて、
  d_nikke_ce009_01_05_43:
    speaker: ce009_01_p
    en: I'd rather browse the library and see what's here.
    ko: 어떤 책이 있는지 보면서, 도서관을 둘러보고 싶어.
    ja: |-
      どんな分類の本があるのか見ながら、
      図書館を見て回りたいかしら。
  d_nikke_ce009_01_05_44:
    speaker: ce009_01_p
    en: I'm sure I'll find something I'd like to read.
    ko: 그러다 보면, 읽어보고 싶은 책도 찾을 수 있을 거야.
    ja: |-
      そうしたら、そのうち読んでみたい本も
      見つかると思うの。
  d_nikke_ce009_01_05_45:
    speaker: ce009_01_p
    en: And while we're at it, I'd like to talk with you a little more, too.
    ko: 겸사겸사 팬텀이랑 같이 얘기를 좀 더 나누고 싶기도 하고.
    ja: |-
      それから、もう少しファントムと
      お話もしたいし。
  d_nikke_ce009_01_05_46:
    speaker: phantom
    en: That sounds good.
    ko: 그것도 좋소.
    ja: それもいいだろう。
  d_nikke_ce009_01_05_47:
    speaker: phantom
    en: I was hoping we could talk a little more as well.
    ko: 나도 그대들과 좀 더 깊은 대화를 나누고 싶다고 생각하던 참이오.
    ja: |-
      私も君たちと、もう少し深い話がしたいと
      思っていたところだ。
  d_nikke_ce009_01_05_48:
    speaker: phantom
    en: Thanks to you both, tonight's shift won't be a lonely one.
    ko: 덕분에 이번 당직은 쓸쓸하지 않겠구려.
    ja: おかげで、今宵は退屈しないですみそうだ。
  d_nikke_ce009_01_05_49:
    speaker: "<Narration>"
    en: And so, Phantom, Makoto, and Morgana look around the library,
    ko: 그렇게 팬텀과 마코토와 모르가나는 도서관을 구경하며,
    ja: |-
      それから、ファントムと真とモルガナは
      図書館を見物しつつ…
  d_nikke_ce009_01_05_50:
    speaker: "<Narration>"
    en: chatting about all sorts of things until late into the night.
    ko: 밤이 깊을 때까지 서로 다양한 이야기를 나누었다.
    ja: 夜が更けるまで、色々な話をした
  d_nikke_ce009_01_05_51:
    speaker: phantom
    en: "... Perhaps that's why I always end up recommending phantom thief novels."
    ko: 그래서 그런지, 추천하고 보면 나도 모르게 괴도 소설을 추천하고 있소.
    ja: |-
      …そのせいか、怪盗小説を人に勧めるのが
      クセになっていてね。
  d_nikke_ce009_01_05_52:
    speaker: ce009_01_p
    en: It's only natural to recommend things you like.
    ko: 좋아하는 걸 추천하는 건 자연스러운 거지.
    ja: 好きなものを勧めるのは自然なことよ。
  d_nikke_ce009_01_05_53:
    speaker: ce009_01_p
    en: It's the same for me.
    ko: 나도 그래.
    ja: 私もそうだわ。
  d_nikke_ce009_01_05_54:
    speaker: ce009_01_p
    en: Whenever someone asks me for a movie recommendation, I usually end up recommending
      film noirs.
    ko: 영화를 추천하려고 하면 누아르 영화 같은 걸 추천하거든.
    ja: |-
      映画のおすすめを聞かれたら、
      任侠映画を勧めちゃうの。
  d_nikke_ce009_01_05_55:
    speaker: ce009_01_p
    en: Given the genre, though... It's a little embarrassing to admit I like those
      kinds of movies.
    ko: 장르가 장르다 보니, 그런 걸 좋아한다고 말하긴 좀 부끄러운데….
    ja: |-
      ジャンルがジャンルだし、
      そういうのが好きだって
      ちょっと言いにくいけど…
  d_nikke_ce009_01_05_56:
    speaker: phantom
    en: It's a little unexpected, but there's nothing wrong with that.
    ko: 의외이긴 하다만, 그것도 괜찮지 않겠소?
    ja: 意外ではあるが、それも面白いのではないかな？
  d_nikke_ce009_01_05_57:
    speaker: phantom
    en: Everyone has different tastes, after all.
    ko: 취향은 사람마다 다른 법이니.
    ja: 好みというのは人それぞれだからね。
  d_nikke_ce009_01_05_58:
    speaker: ce009_05_c
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_01_05_59:
    speaker: ce009_05_c
    en: It's getting late, guys. Let's call it a night.
    ko: 밤도 깊었으니, 오늘은 이만 자자….
    ja: 夜も遅いし、今日はもう寝ようぜ…
  d_nikke_ce009_01_05_60:
    speaker: ce009_01_p
    en: You're right, but...
    ko: 확실히 늦은 시간이긴 하지만….
    ja: 確かに、もうこんな時間だけど…
  d_nikke_ce009_01_05_61:
    speaker: ce009_01_p
    en: I can't stop thinking about that phantom thief novel you recommended.
    ko: 팬텀이 추천해 준 괴도 소설이 너무 신경쓰여서 그런데,
    ja: |-
      ファントムから勧められた
      怪盗小説が気になるから、
  d_nikke_ce009_01_05_62:
    speaker: ce009_01_p
    en: Can we talk about it just a little longer?
    ko: 조금만 더 이야기해도 될까?
    ja: もう少しだけお話していいかしら？
  d_nikke_ce009_01_05_63:
    speaker: ce009_01_p
    en: A phantom thief novel recommended by a librarian? It's got to be really good.
    ko: 도서관 사서가 추천해주는 괴도 소설이라니. 엄청 재미있을 것 같잖아.
    ja: |-
      図書館の司書がオススメする怪盗小説なんて
      面白いに決まってるわ。
  d_nikke_ce009_01_05_64:
    speaker: phantom
    en: I'm delighted to hear you're interested in phantom thief novels.
    ko: 마코토가 괴도 소설에 흥미를 가진다니, 듣던 중 반가운 말이오.
    ja: ふふ、興味を持ってもらえて光栄だ。
  d_nikke_ce009_01_05_65:
    speaker: phantom
    en: 'There''s one called "Juvenile Phantom Thieves: Stolen Justice." Would you
      care to give it a read?'
    ko: "[정의를 훔쳐라, 청년 괴도들!]이라는 괴도 소설이 있는데, 한번 읽어 보시겠소?"
    ja: |-
      「若き怪盗たちよ、正義を盗め！」という
      作品があるのだが、試しに読んでみるかい？
  d_nikke_ce009_01_05_66:
    speaker: phantom
    en: It's about a group of student phantom thieves who band together to teach corrupt
      adults a lesson.
    ko: 학생들이 나쁜 어른들을 혼내주기 위해 만든 괴도 조직의 이야기라오.
    ja: |-
      生徒たちが悪い大人を懲らしめるために作った
      怪盗組織の話だ。
  d_nikke_ce009_01_05_67:
    speaker: ce009_01_p
    en: "... This feels a little like what we do as the Phantom Thieves of Hearts.
      Now you've got me curious."
    ko: |-
      …왠지 마음의 괴도단 활동과 비슷할지도 모르겠네.
      흥미가 생기는걸.
    ja: |-
      へぇ…なんだか、
      「心の怪盗団」の活動と似ているかも。
      すごく興味深いわ。
  d_nikke_ce009_01_05_68:
    speaker: ce009_01_p
    en: Can we go see it right now?
    ko: 지금 바로 보러갈 수 있을까?
    ja: 今すぐ見に行ってもいいかしら？
  d_nikke_ce009_01_05_69:
    speaker: phantom
    en: Of course.
    ko: 물론이오.
    ja: もちろんさ。
  d_nikke_ce009_01_05_70:
    speaker: ce009_05_c
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_01_05_71:
    speaker: "<Narration>"
    en: Unable to join their conversation,
    ko: 하지만 모르가나는 대화에 끼지 못하고,
    ja: |-
      結局その晩、モルガナは会話から
      置いてけぼりにされたまま…
  d_nikke_ce009_01_05_72:
    speaker: "<Narration>"
    en: Morgana can only meow through the night.
    ko: 밤새 야옹거리며 울 뿐이었다.
    ja: |-
      一晩中、ニャーニャーと
      鳴き声を響かせるばかりだった
