---
d_nikke_maxwell_mechanic_01:
  d_nikke_maxwell_mechanic_01_1:
    speaker: "<Narration>"
    en: Late one night,
    ko: 늦은 밤.
    ja: 深夜
  d_nikke_maxwell_mechanic_01_2:
    speaker: "<Narration>"
    en: only the glow of a monitor illuminates the room.
    ko: 모니터에서 새어 나오는 빛만이 방을 밝히고 있었고.
    ja: |-
      モニターからあふれる光だけが
      部屋を照らし…
  d_nikke_maxwell_mechanic_01_3:
    speaker: "<Narration>"
    en: Someone sits alone before the screen.
    ko: 그 앞에 누군가 홀로 앉아 있다.
    ja: その前に誰かが一人で座っている
  d_nikke_maxwell_mechanic_01_4:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_01_5:
    speaker: "<Narration>"
    en: "*Click, click*"
    ko: 딸깍- 딸깍-
    ja: カチッ…カチッ…
  d_nikke_maxwell_mechanic_01_6:
    speaker: "<Monologue>"
    en: Of all the things that exist in this world,
    ko: 세상에 존재하는 모든 것 중.
    ja: この世に存在するものの中で
  d_nikke_maxwell_mechanic_01_7:
    speaker: "<Monologue>"
    en: there's nothing that can't be proven with science.
    ko: 과학으로 증명할 수 없는 것은 없다.
    ja: 科学で証明できないものはない
  d_nikke_maxwell_mechanic_01_8:
    speaker: "<Monologue>"
    en: Physical mechanisms, chemical reactions, thermodynamic changes,
    ko: 물리 작용, 화학 반응, 열역학 변화.
    ja: 物理作用、化学反応、熱力学的変化…
  d_nikke_maxwell_mechanic_01_9:
    speaker: "<Monologue>"
    en: even emotions.
    ko: 심지어 감정까지도.
    ja: さらには感情までも
  d_nikke_maxwell_mechanic_01_10:
    speaker: "<Monologue>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_01_11:
    speaker: "<Monologue>"
    en: Take love, for example.
    ko: 사랑을 예로 들어보자.
    ja: 愛を例に挙げよう
  d_nikke_maxwell_mechanic_01_12:
    speaker: "<Monologue>"
    en: From a biological standpoint, it's simple.
    ko: 생물학적으로 보면 단순하다.
    ja: 生物学的に見れば、単純なことだ
  d_nikke_maxwell_mechanic_01_13:
    speaker: "<Monologue>"
    en: Individuals with different genes
    ko: 서로 다른 유전자를 가진 개체가.
    ja: 互いに異なる遺伝子を持つ個体が
  d_nikke_maxwell_mechanic_01_14:
    speaker: "<Monologue>"
    en: are drawn to one another to ensure the survival of the species.
    ko: 종의 보존을 위해 상대에게 끌리는 것.
    ja: 種の存続のために相手に惹かれること
  d_nikke_maxwell_mechanic_01_15:
    speaker: "<Monologue>"
    en: Hormones like dopamine, oxytocin, and serotonin are released.
    ko: 도파민, 옥시토신, 세로토닌.
    ja: ドーパミン、オキシトシン、セロトニン
  d_nikke_maxwell_mechanic_01_16:
    speaker: "<Monologue>"
    en: The brain reacts, and behavior follows.
    ko: 호르몬이 분비되고, 뇌가 반응하고, 행동으로 이어지는 거야.
    ja: |-
      ホルモンが分泌され、脳が反応し、
      行動へとつながる
  d_nikke_maxwell_mechanic_01_17:
    speaker: "<Monologue>"
    en: Inexplicable attraction. Destined partners. Soul mates.
    ko: 설명할 수 없는 끌림, 운명의 상대, 영혼의 단짝.
    ja: |-
      説明のつかない引力、
      運命の相手、ソウルメイト
  d_nikke_maxwell_mechanic_01_18:
    speaker: "<Monologue>"
    en: They're wrapped in grand, romantic notions, but the underlying mechanism is
      simple.
    ko: 거창하게 포장되어 있지만 메커니즘은 단순하지.
    ja: |-
      大げさに飾り立てられているが、
      メカニズムは簡単だ
  d_nikke_maxwell_mechanic_01_19:
    speaker: "<Monologue>"
    en: Humans and Nikkes alike are little more than highly sophisticated machines.
    ko: 인간도 니케도 아주 정교한 기계와 다를 바가 없달까.
    ja: |-
      人間もニケも、精巧な機械と
      変わらないと言うべきか
  d_nikke_maxwell_mechanic_01_20:
    speaker: "<Monologue>"
    en: And yet...
    ko: "…그런데."
    ja: "…ところが"
  d_nikke_maxwell_mechanic_01_21:
    speaker: "<Monologue>"
    en: One day, as though defying every law of the universe,
    ko: 어느 날, 이 세상의 모든 법칙을 비웃기라도 하듯.
    ja: |-
      ある日、この世のすべての法則を
      あざ笑うかのように
  d_nikke_maxwell_mechanic_01_22:
    speaker: "<Monologue>"
    en: a being beyond all understanding appeared.
    ko: 도무지 이해할 수 없는 존재가 나타났다.
    ja: とうてい理解できない存在が現れた
  d_nikke_maxwell_mechanic_01_23:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_01_24:
    speaker: "<Narration>"
    en: "*Click, click*"
    ko: 딸깍- 딸깍-
    ja: カチッ…カチッ…
  d_nikke_maxwell_mechanic_01_25:
    speaker: "<Narration>"
    en: Maxwell pulls out the report she'd hidden away.
    ko: 맥스웰은 숨겨놨던 보고서 파일을 다시 꺼낸다.
    ja: |-
      マクスウェルは隠してあった
      報告書のファイルを開いた
  d_nikke_maxwell_mechanic_01_26:
    speaker: "<Narration>"
    en: '"Test result."'
    ko: 실험 결과.
    ja: 実験の結果
  d_nikke_maxwell_mechanic_01_27:
    speaker: "<Narration>"
    en: '"It is difficult to see that the Nikke''s performance increased from the
      relationship with the test subject."'
    ko: 실험 대상과의 접촉으로 니케의 성능이 향상되었다고 보기 어려움.
    ja: |-
      実験対象との接触によってニケの性能が
      向上するとは判断できない
  d_nikke_maxwell_mechanic_01_28:
    speaker: "<Narration>"
    en: '"Due to the psychological care provided by the test subject,"'
    ko: 실험 대상의 심리 케어로.
    ja: 実験対象の心理的なケアにより、
  d_nikke_maxwell_mechanic_01_29:
    speaker: "<Narration>"
    en: '"the Nikke''s morale increased,"'
    ko: 니케의 사기 증진을 일으켜.
    ja: ニケの士気が上がり
  d_nikke_maxwell_mechanic_01_30:
    speaker: "<Narration>"
    en: '"therefore increasing the Nikke''s combat-related abilities."'
    ko: 해당 니케의 전투 관련 능력을 향상시킨 것으로 확인됨.
    ja: |-
      該当ニケの戦闘関連能力が
      向上したものとみられる
  d_nikke_maxwell_mechanic_01_31:
    speaker: "<Narration>"
    en: '"This"'
    ko: 이상으로.
    ja: 以上をもって
  d_nikke_maxwell_mechanic_01_32:
    speaker: "<Narration>"
    en: '"ends the experiment."'
    ko: 실험을 종료한다.
    ja: 実験を終了する
  d_nikke_maxwell_mechanic_01_33:
    speaker: maxwell_p
    en: "... I wrote this so no one would take Cutey away from me."
    ko: "…전에 베이비를 뺏기기 싫어서 작성했던 문서."
    ja: |-
      …前に、ベビーを奪われたくなくて
      作成した報告書。
  d_nikke_maxwell_mechanic_01_34:
    speaker: maxwell_p
    en: But looking at it now, it's still the only explanation.
    ko: 그런데 지금 다시 봐도, 이렇게 밖에 설명이 안 되네.
    ja: |-
      いま改めて見ても、
      こういうふうにしか説明できないね…
  d_nikke_maxwell_mechanic_01_35:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_01_36:
    speaker: maxwell_p
    en: A precious test subject with the potential to uncover a wealth of new knowledge,
    ko: 새로운 지식의 열매를 잔뜩 맺어낼, 귀한 실험체.
    ja: |-
      新しい知識の実をたくさん実らせてくれる、
      貴重な実験体。
  d_nikke_maxwell_mechanic_01_37:
    speaker: maxwell_p
    en: or so I thought.
    ko: "…인 줄 알았지만."
    ja: "…だと思ってたんだけど。"
  d_nikke_maxwell_mechanic_01_38:
    speaker: maxwell_p
    en: But the more time we spend together, the more questions I have.
    ko: 같이 다니면 다닐수록 물음표만 늘어난단 말이지.
    ja: |-
      一緒にいればいるほど、
      ハテナマークばっかり増えていくのよね～
  d_nikke_maxwell_mechanic_01_39:
    speaker: maxwell_p
    en: Even the way he behaves is beyond anything I can predict.
    ko: 행동 양식부터가 예측 범위 밖인데도.
    ja: 行動パターンから予想の範囲外なのに、
  d_nikke_maxwell_mechanic_01_40:
    speaker: maxwell_p
    en: And yet he always delivers results beyond my expectations.
    ko: 항상 기대 이상의 결과를 이끌어내.
    ja: いつも期待以上の結果をもたらしてくれる。
  d_nikke_maxwell_mechanic_01_41:
    speaker: maxwell_p
    en: "... It's unscientific."
    ko: "…비과학적이야."
    ja: "…非科学的よね。"
  d_nikke_maxwell_mechanic_01_42:
    speaker: "<Narration>"
    en: "*Click, click*"
    ko: 딸깍- 딸깍-
    ja: カチッ…カチッ…
  d_nikke_maxwell_mechanic_01_43:
    speaker: "<Narration>"
    en: The screen changes.
    ko: 화면이 전환된다.
    ja: 画面が切り替わる
  d_nikke_maxwell_mechanic_01_44:
    speaker: "<Narration>"
    en: The firepower metrics of every Nikke who's interacted with Commander @UserName
    ko: "@UserName 지휘관과 교류한 니케들의 화력 지표."
    ja: |-
      「@UserName指揮官と交流した
      ニケの火力指標」
  d_nikke_maxwell_mechanic_01_45:
    speaker: "<Narration>"
    en: are all trending upward.
    ko: 예외 없이 전부 우상향을 그리고 있다.
    ja: 例外なく、すべて右肩上がりになっている
  d_nikke_maxwell_mechanic_01_46:
    speaker: maxwell_p
    en: Looks like I wasn't the only one
    ko: "…역시 나만 그런 게 아니었네."
    ja: "…やっぱり私だけじゃなかったのね。"
  d_nikke_maxwell_mechanic_01_47:
    speaker: maxwell_p
    en: affected by Cutey.
    ko: 베이비한테 영향을 받고 있는 건.
    ja: ベビーから影響を受けるのは。
  d_nikke_maxwell_mechanic_01_48:
    speaker: maxwell_p
    en: The samples keep piling up, but the underlying cause is still...
    ko: 표본들은 쌓이는데, 그 원인은 여전히….
    ja: |-
      サンプルは増える一方だけど、
      その原因はいまだに…
  d_nikke_maxwell_mechanic_01_49:
    speaker: "<Narration>"
    en: The scrolling comes to a stop, revealing someone's personnel file.
    ko: 스크롤이 멈추고 누군가의 인적 사항이 눈에 들어온다.
    ja: |-
      スクロールしていた手が止まり、
      ある人物の個人情報が目に入った
  d_nikke_maxwell_mechanic_01_50:
    speaker: "<Narration>"
    en: '"Commander @UserName''s Profile."'
    ko: "@UserName 지휘관의 프로필."
    ja: "@UserName指揮官のプロフィール"
  d_nikke_maxwell_mechanic_01_51:
    speaker: "<Narration>"
    en: She sees his affiliation, rank, and date of commission,
    ko: 소속, 계급, 임관일.
    ja: 所属、階級、任官日
  d_nikke_maxwell_mechanic_01_52:
    speaker: "<Narration>"
    en: but everything else is blank.
    ko: 그 이외의 정보는 전부 공란.
    ja: それ以外の情報はすべて空欄だ
  d_nikke_maxwell_mechanic_01_53:
    speaker: maxwell_p
    en: Cutey sure has a lot of secrets.
    ko: 베이비는 참 비밀이 많은 남자라니까.
    ja: ベビーって、ホントに秘密が多いのね。
  d_nikke_maxwell_mechanic_01_54:
    speaker: maxwell_p
    en: Come to think of it...
    ko: "…그러고 보니."
    ja: "…そういえば。"
  d_nikke_maxwell_mechanic_01_55:
    speaker: maxwell_p
    en: We've known each other for quite a while now,
    ko: 만난 지는 꽤 된 거 같은데.
    ja: 出会ってから、もうけっこう経ったのに…
  d_nikke_maxwell_mechanic_01_56:
    speaker: maxwell_p
    en: but there's still so much I don't know about him.
    ko: 아직도 모르는 게 이렇게나 많네.
    ja: |-
      まだ知らないことが
      こんなにたくさんあるんだ。
  d_nikke_maxwell_mechanic_01_57:
    speaker: maxwell_p
    en: Oh.
    ko: 아.
    ja: あっ。
  d_nikke_maxwell_mechanic_01_58:
    speaker: maxwell_p
    en: Is it because he's still wary of me?
    ko: 아직도 경계심이 남아 있어서 그런가?
    ja: まだ警戒してるってことかな？
  d_nikke_maxwell_mechanic_01_59:
    speaker: maxwell_p
    en: Is it because I see Cutey as a test subject?
    ko: 내가 베이비를 실험 대상으로만 봐서?
    ja: |-
      私がベビーのことを
      実験対象としか見てないから？
  d_nikke_maxwell_mechanic_01_60:
    speaker: maxwell_p
    en: Hmm...
    ko: 으으음….
    ja: うう～ん…
  d_nikke_maxwell_mechanic_01_61:
    speaker: "<Narration>"
    en: She props her chin on her hand, and the photo of a familiar man in the corner
      of the monitor catches her eye.
    ko: 턱을 괴자, 모니터 구석에 익숙한 남자의 사진이 눈에 들어온다.
    ja: |-
      頬杖をつくと、モニターの隅に表示されている
      見慣れた男の写真が目に留まった
  d_nikke_maxwell_mechanic_01_62:
    speaker: maxwell_p
    en: Hmm...
    ko: 흐음~
    ja: うーん。
  d_nikke_maxwell_mechanic_01_63:
    speaker: maxwell_p
    en: He's definitely my type, looks-wise.
    ko: 확실히 얼굴은 내 취향인데 말이지.
    ja: 顔は間違いなく私のタイプなんだよね。
  d_nikke_maxwell_mechanic_01_64:
    speaker: maxwell_p
    en: "... I want to get to know him better,"
    ko: "…더 알고 싶어."
    ja: "…もっと知りたい。"
  d_nikke_maxwell_mechanic_01_65:
    speaker: maxwell_p
    en: not as a test subject or a bundle of data. Just... him.
    ko: 실험이니 데이터니, 그런 거 다 떼고.
    ja: |-
      実験とかデータとか、
      そんなのは置いといて…
  d_nikke_maxwell_mechanic_01_66:
    speaker: drake_p
    en: What are you staring at so late at night?
    ko: 이 야심한 밤에 뭘 그렇게 보고 있는 거지?
    ja: こんな夜更けに何をしているんだ？
  d_nikke_maxwell_mechanic_01_67:
    speaker: maxwell_p
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  d_nikke_maxwell_mechanic_01_68:
    speaker: maxwell_p
    en: Y-you startled me!
    ko: 까, 깜짝이야!
    ja: び、びっくりした！
  d_nikke_maxwell_mechanic_01_69:
    speaker: maxwell_p
    en: D-Drake...?!
    ko: 드, 드레이크…?!
    ja: ド、ドレイク…！？
  d_nikke_maxwell_mechanic_01_70:
    speaker: maxwell_p
    en: What the heck?!
    ko: 뭐야. 너!
    ja: 急に何なのよ！
  d_nikke_maxwell_mechanic_01_71:
    speaker: drake_p
    en: Cooking up a scheme?
    ko: 작당 모의 같은 건가?
    ja: 何か悪企みでもしているのか？
  d_nikke_maxwell_mechanic_01_72:
    speaker: drake_p
    en: Very well, I'll join in!
    ko: 그렇다면 나도 어울려 주도록 하지!
    ja: それなら、私も付き合うとしよう！
  d_nikke_maxwell_mechanic_01_73:
    speaker: maxwell_p
    en: "*Sigh...* No, it's not like that."
    ko: 하아… 그런 건 아니고.
    ja: はぁ…そんなんじゃないって。
  d_nikke_maxwell_mechanic_01_74:
    speaker: maxwell_p
    en: I was doing research. Just research.
    ko: 연구 중이었어. 연 구 중.
    ja: 研究中だったのよ。研・究・中。
  d_nikke_maxwell_mechanic_01_75:
    speaker: drake_p
    en: Oh, in that case, I'm out.
    ko: 아, 그렇다면 사양하지.
    ja: あ…それなら遠慮する。
  d_nikke_maxwell_mechanic_01_76:
    speaker: drake_p
    en: I don't do headaches.
    ko: 머리 아픈 건 싫어서.
    ja: 頭が痛くなるようなことは苦手だからな。
  d_nikke_maxwell_mechanic_01_77:
    speaker: maxwell_p
    en: So what brings you here this late?
    ko: 그래서 갑자기 뭔데, 이 시간에.
    ja: それで、こんな時間に急にどうしたの？
  d_nikke_maxwell_mechanic_01_78:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_01_79:
    speaker: drake_p
    en: Actually...
    ko: 사실은 말이지.
    ja: 実は…
  d_nikke_maxwell_mechanic_01_80:
    speaker: drake_p
    en: I have to go to the bathroom.
    ko: 화장실에 가고 싶은데.
    ja: トイレに行きたいのだが…
  d_nikke_maxwell_mechanic_01_81:
    speaker: drake_p
    en: Will you come with me?
    ko: 좀 같이 가줄 수 있겠나?
    ja: ついてきてくれないか？
  d_nikke_maxwell_mechanic_01_82:
    speaker: drake_p
    en: "... Don't tell Laplace."
    ko: "…라플라스에겐 말하지 말아 다오."
    ja: "…ラプラスには秘密にしてくれ。"
  d_nikke_maxwell_mechanic_01_83:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_01_84:
    speaker: maxwell_p
    en: "*Sigh...* Fine."
    ko: 에효… 그래.
    ja: ったく…分かったわよ。
  d_nikke_maxwell_mechanic_01_85:
    speaker: maxwell_p
    en: Let's go.
    ko: 갑시다, 가요.
    ja: さっさと行きましょ。
  d_nikke_maxwell_mechanic_01_86:
    speaker: maxwell_p
    en: Oh, right! Before we do... give me a second.
    ko: 아, 맞다! 그전에… 잠시만.
    ja: |-
      あ、そうだ！その前に…
      ちょっと待って。
  d_nikke_maxwell_mechanic_01_87:
    speaker: "<Narration>"
    en: "*Tap, tap, tap*"
    ko: 타다다닥- 탁-
    ja: カタカタカタッ、タッ
  d_nikke_maxwell_mechanic_01_88:
    speaker: "<Narration>"
    en: Maxwell fires off a message.
    ko: 어딘가로 맥스웰의 메시지가 전송되었다.
    ja: マクスウェルは誰かにメッセージを送った
  d_nikke_maxwell_mechanic_01_89:
    speaker: drake_p
    en: Are you done yet, Maxwell?
    ko: 맥스웰 아직인가?
    ja: マクスウェル、まだか？
  d_nikke_maxwell_mechanic_01_90:
    speaker: drake_p
    en: If I had to put a number on how bad things are, I'd say we're at a nine out
      of ten...
    ko: 지금 사태의 심각성을 숫자로 표현하자면 10중 9정도의-
    ja: |-
      事の深刻さを数字で表すとしたら、
      10段階の9ぐらいなんだが…
  d_nikke_maxwell_mechanic_01_91:
    speaker: maxwell_p
    en: I'm coming already!
    ko: 아 간다고 좀!
    ja: 今、行くってば！
d_nikke_maxwell_mechanic_02:
  d_nikke_maxwell_mechanic_02_1:
    speaker: "<Narration>"
    en: Liquid is poured,
    ko: 쪼르르-
    ja: トクトク…
  d_nikke_maxwell_mechanic_02_2:
    speaker: "<Narration>"
    en: then a cup is set down in front of me.
    ko: 달칵-
    ja: コトッ…
  d_nikke_maxwell_mechanic_02_3:
    speaker: maxwell_p
    en: Here, Cutey. Drink up.
    ko: 자, 베이비 마셔.
    ja: さあ、ベビー。召し上がれ。
  d_nikke_maxwell_mechanic_02_4:
    speaker: maxwell_p
    en: Think of it as a welcome drink for your first visit to my place.
    ko: 이건 내 숙소 첫 방문 기념으로 주는 웰컴 드링크.
    ja: |-
      私の宿所に初めて来た記念の
      ウェルカムドリンクだよ。
  d_nikke_maxwell_mechanic_02_5:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_02_6:
    speaker: "<Monologue>"
    en: Wisps of steam rise from the dark liquid she hands me.
    ko: 건네받은 검은 액체에서는 김이 모락모락 나고 있다.
    ja: 手渡された黒い液体から、湯気が立ち上っている
  d_nikke_maxwell_mechanic_02_7:
    speaker: maxwell_p
    en: Why are you giving me that suspicious look?
    ko: 뭐야, 그 의심스러운 눈초리는.
    ja: 何よ、その目は。
  d_nikke_maxwell_mechanic_02_8:
    speaker: maxwell_p
    en: There's nothing wrong with it.
    ko: 이상한 거 아니야.
    ja: 怪しいものじゃないわよ。
  d_nikke_maxwell_mechanic_02_9:
    speaker: maxwell_p
    en: Relax, it's just coffee.
    ko: 단순한 커피라고.
    ja: ただのコーヒーだってば。
  d_nikke_maxwell_mechanic_02_10:
    speaker: maxwell_p
    en: You don't seriously think I'd slip something weird into it, do you?
    ko: 내가 설마 음료 속에 이상한 거라도 탔을까 봐?
    ja: |-
      もしかして、私が飲み物の中に
      何かヘンなものでも入れたと思ってる？
  d_nikke_maxwell_mechanic_02_11:
    speaker: maxwell_p
    en: Then you'd wake up strapped to an operating table?
    ko: 막 눈떠보니 수술대 위에 있고.
    ja: 目を覚ましたら手術台の上にいて…
  d_nikke_maxwell_mechanic_02_12:
    speaker: maxwell_p
    en: That's what you're imagining, isn't it?
    ko: 그런 거 상상한 건 아니지?
    ja: "…みたいなことを想像してたとか？"
  d_nikke_maxwell_mechanic_02_13:
    speaker: "<Self>"
    en: "... Of course not."
    ko: "…그럴 리가."
    ja: "…まさか"
  d_nikke_maxwell_mechanic_02_14:
    speaker: "<Monologue>"
    en: How'd she know...?
    ko: "…어떻게 알았지?"
    ja: どうして分かったんだ？
  d_nikke_maxwell_mechanic_02_15:
    speaker: maxwell_p
    en: Seriously, Cutey,
    ko: 베이비, 아무리 그래도 그렇지.
    ja: ベビー、いくらなんでもそれはないよ。
  d_nikke_maxwell_mechanic_02_16:
    speaker: maxwell_p
    en: if you're going to be suspicious of even a simple act of kindness, even I'd
      be a little hurt.
    ko: 단순 호의에 그런 의심을 사면 나라도 상처받는다고.
    ja: |-
      ただの親切心をそんなふうに
      疑われたら、私だって傷つくな～
  d_nikke_maxwell_mechanic_02_17:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_02_18:
    speaker: maxwell_p
    en: What kind of person do you think I am?
    ko: 애초에 나를 뭐라 생각하는 거야?
    ja: そもそも、私を何だと思ってるの？
  d_nikke_maxwell_mechanic_02_19:
    speaker: maxwell_p
    en: I may have an insatiable thirst for knowledge, but I haven't abandoned my
      sense of ethics.
    ko: 내가 아무리 지식욕이 넘친다 해도 윤리의식을 버리진 않는다니까?
    ja: |-
      いくら知識欲に溢れてても、
      倫理観がないってわけじゃないんだからね？
  d_nikke_maxwell_mechanic_02_20:
    speaker: "<Self>"
    en: Your sense of ethics...?
    ko: 윤리의식…?
    ja: 倫理観…？
  d_nikke_maxwell_mechanic_02_21:
    speaker: maxwell
    en: Next up is the firepower test.
    ko: 그럼 다음은 화력 테스트.
    ja: じゃあ、次は火力テスト。
  d_nikke_maxwell_mechanic_02_22:
    speaker: maxwell
    en: Press the button by your waist, and a gun should pop out. Go ahead and shoot
      that building over there!
    ko: |-
      허리 쪽 버튼을 누르면 총이 하나 나올 거야.
      그걸로 앞에 저 건물 좀 쏴볼래?
    ja: |-
      腰にあるボタンを押すと銃が出るんだ。
      それであの向こうの建物を撃ってみて！
  d_nikke_maxwell_mechanic_02_23:
    speaker: "<Narration>"
    en: "*Bang!*"
    ko: 콰앙---!!!!!!!!!!!!!
    ja: バン！！！！！！！
  d_nikke_maxwell_mechanic_02_24:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
  d_nikke_maxwell_mechanic_02_25:
    speaker: "<Narration>"
    en: "*Thud!*"
    ko: 우당탕탕-!
    ja: ガシャァン！
  d_nikke_maxwell_mechanic_02_26:
    speaker: maxwell
    en: Why would you refuse?
    ko: 거절은 무슨 거절이야.
    ja: 断るって選択肢とか、ないから！
  d_nikke_maxwell_mechanic_02_27:
    speaker: maxwell
    en: If you're that bothered by the heat,
    ko: 그렇게 더운 게 싫으면.
    ja: 暑いのがそんなに嫌なら
  d_nikke_maxwell_mechanic_02_28:
    speaker: maxwell
    en: just take your clothes off.
    ko: 옷을 벗으면 되는 거 아냐?
    ja: 服を脱げばいいかもよ？
  d_nikke_maxwell_mechanic_02_29:
    speaker: "<Self>"
    en: "!!!"
    ko: "!!!!!"
    ja: "！！！！！"
  d_nikke_maxwell_mechanic_02_30:
    speaker: maxwell
    en: Hmm...
    ko: 흐응~
    ja: ふ～ん。
  d_nikke_maxwell_mechanic_02_31:
    speaker: maxwell
    en: So this is what you've been hiding under those clothes, Cutey?
    ko: 베이비의 속살은 이랬구나?
    ja: ベビーの素肌はこうなんだ。
  d_nikke_maxwell_mechanic_02_32:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_02_33:
    speaker: maxwell_p
    en: Well? If you think about it, I'm right, aren't I?
    ko: 어때, 생각해 보니까 맞는 거 같지?
    ja: どう、思い返してみてもそうでしょ？
  d_nikke_maxwell_mechanic_02_34:
    speaker: "<Self>"
    en: "... Yeah, I guess."
    ko: "…그런 거 같아."
    ja: "…そのようだな"
  d_nikke_maxwell_mechanic_02_35:
    speaker: maxwell_p
    en: Of course!
    ko: 당연하지~
    ja: 当然だよ～
  d_nikke_maxwell_mechanic_02_36:
    speaker: maxwell_p
    en: Come on, you know how much you mean to me.
    ko: 내가 베이비를 얼마나 아끼는데.
    ja: |-
      ベビーのこと、
      すっごく大切に思ってるんだから。
  d_nikke_maxwell_mechanic_02_37:
    speaker: maxwell_p
    en: So are you going to drink it or not?
    ko: 그래서, 진짜 안 마실 거야?
    ja: それで、ホントに飲まないの？
  d_nikke_maxwell_mechanic_02_38:
    speaker: "<Monologue>"
    en: After all that, it would be rude to keep refusing.
    ko: "…이렇게까지 말하는데 더 이상 거절하는 건 실례겠지."
    ja: "…ここまで言われて、断るのも失礼だろう"
  d_nikke_maxwell_mechanic_02_39:
    speaker: "<Narration>"
    en: I take a sip.
    ko: 꿀꺽-
    ja: ゴクッ――
  d_nikke_maxwell_mechanic_02_40:
    speaker: "<Monologue>"
    en: A well-balanced blend of acidity and nuttiness spreads across my tongue.
    ko: 적절한 밸런스의 산미와 고소함이 혀에 느껴진다.
    ja: バランスのとれた酸味とコクが舌に伝わった
  d_nikke_maxwell_mechanic_02_41:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_02_42:
    speaker: maxwell_p
    en: Pretty good, right? Bet it caught you by surprise.
    ko: 어때, 맛있어서 깜짝 놀랐지?
    ja: どう、おいしくてビックリでしょ？
  d_nikke_maxwell_mechanic_02_43:
    speaker: maxwell_p
    en: Hehe, I did make it especially for you, Cutey.
    ko: 헤헤, 베이비를 위해서 특별히 준비한 거니까 당연하지~
    ja: |-
      へへ、ベビーのために
      用意したんだから当たり前だよ～
  d_nikke_maxwell_mechanic_02_44:
    speaker: maxwell_p
    en: Okay, then sip on it while you listen.
    ko: 음, 좋아. 그렇다면 마시면서 들어줘.
    ja: うん。それじゃ、飲みながら聞いて。
  d_nikke_maxwell_mechanic_02_45:
    speaker: "<Self>"
    en: Is there another experiment?
    ko: 또 실험이야?
    ja: また実験か？
  d_nikke_maxwell_mechanic_02_46:
    speaker: maxwell_p
    en: Haha, unfortunately, this is more of a favor than an experiment.
    ko: 아하하. 아쉽지만, 이번엔 실험보단 부탁에 가깝달까.
    ja: |-
      あはは。残念だけど、
      今回は実験っていうより、お願いに近いかな。
  d_nikke_maxwell_mechanic_02_47:
    speaker: maxwell_p
    en: Got a minute?
    ko: 시간 괜찮지?
    ja: 時間、大丈夫だよね？
  d_nikke_maxwell_mechanic_02_48:
    speaker: "<Self>"
    en: Yeah... I guess so.
    ko: 뭐… 그렇지.
    ja: まあ…大丈夫だ
  d_nikke_maxwell_mechanic_02_49:
    speaker: maxwell_p
    en: Haha, perfect.
    ko: 하하, 좋아.
    ja: はは、よかった。
  d_nikke_maxwell_mechanic_02_50:
    speaker: maxwell_p
    en: Then before I ask my favor, there's something I'd like to ask you first.
    ko: 그렇다면, 부탁하기 전에 한 가지 묻고 싶은 게 있어.
    ja: |-
      じゃあ、お願いの前に
      一つ聞きたいことがあるの。
  d_nikke_maxwell_mechanic_02_51:
    speaker: maxwell_p
    en: Hmm, how should I put this...? It's a rather sensitive question.
    ko: 음, 어떻게 말해야 하나… 좀 예민한 질문일 수도 있는데.
    ja: |-
      えっと、なんていうか…
      ちょっとデリケートな質問かも。
  d_nikke_maxwell_mechanic_02_52:
    speaker: "<Self>"
    en: I don't think anything would surprise me at this point.
    ko: 뭐, 이제 와서 더 놀랄 것도 없지 않을까.
    ja: 今さら、もう驚くようなこともないだろう
  d_nikke_maxwell_mechanic_02_53:
    speaker: maxwell_p
    en: Haha, that's a relief.
    ko: 아하하, 그렇다면 다행이네~
    ja: あはは、ならいいけど～
  d_nikke_maxwell_mechanic_02_54:
    speaker: maxwell_p
    en: Good.
    ko: 좋아.
    ja: よしっ。
  d_nikke_maxwell_mechanic_02_55:
    speaker: "<Narration>"
    en: Maxwell slowly leans toward me.
    ko: 맥스웰이 상체를 내 쪽으로 천천히 기울여온다.
    ja: |-
      マクスウェルが上半身を
      こちらへゆっくりと傾けてくる
  d_nikke_maxwell_mechanic_02_56:
    speaker: maxwell_p
    en: "... Cutey,"
    ko: "…베이비."
    ja: "…ベビー。"
  d_nikke_maxwell_mechanic_02_57:
    speaker: maxwell_p
    en: so you've got a thing going with the Counters?
    ko: 카운터스랑 그렇고 그런 사이야?
    ja: カウンターズと、そういう関係なの？
  d_nikke_maxwell_mechanic_02_58:
    speaker: "<Self>"
    en: Pffft!
    ko: 푸학-
    ja: ブハッ！
  d_nikke_maxwell_mechanic_02_59:
    speaker: maxwell_p
    en: Hahaha, I knew you'd be surprised.
    ko: 푸하핫, 역시 놀라는구나?
    ja: ハハッ、やっぱり驚いちゃった？
  d_nikke_maxwell_mechanic_02_60:
    speaker: "<Self>"
    en: "*Cough, cough*"
    ko: 콜록콜록-
    ja: ゴホッ、ゴホッ
  d_nikke_maxwell_mechanic_02_61:
    speaker: "<Self>"
    en: Where'd that come from...?
    ko: 갑자기 그게 무슨 소리야…?
    ja: いきなり何の話だ…？
  d_nikke_maxwell_mechanic_02_62:
    speaker: maxwell_p
    en: Actually,
    ko: 아, 그게 말이지.
    ja: ああ、えっとね…
  d_nikke_maxwell_mechanic_02_63:
    speaker: maxwell_p
    en: the only reason I brought it up was because of this...
    ko: 이 얘기를 꺼낸 게 다른 이유가 아니라-
    ja: こんな話をしたのは…
  d_nikke_maxwell_mechanic_02_64:
    speaker: maxwell_p
    en: Take a look.
    ko: 이거 때문이야. 볼래?
    ja: これのためなの。見る？
  d_nikke_maxwell_mechanic_02_65:
    speaker: "<Monologue>"
    en: Maxwell holds out a tablet.
    ko: 맥스웰이 나에게 태블릿을 내민다.
    ja: マクスウェルは私にタブレットを渡した
  d_nikke_maxwell_mechanic_02_66:
    speaker: maxwell_p
    en: Oh, it's confidential, so don't go telling anyone.
    ko: 아, 원래 대외비니까 어디 가서 말하진 말고.
    ja: |-
      あ、ホントは機密情報だから
      外に漏らさないでね。
  d_nikke_maxwell_mechanic_02_67:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_maxwell_mechanic_02_68:
    speaker: "<Monologue>"
    en: On the screen, I see familiar names
    ko: 화면에는 낯익은 이름들과 함께.
    ja: 画面には見慣れた名前とともに
  d_nikke_maxwell_mechanic_02_69:
    speaker: "<Monologue>"
    en: alongside graphs trending upward.
    ko: 우상향하고 있는 그래프들이 보인다.
    ja: 右肩上がりに推移するグラフが見える
  d_nikke_maxwell_mechanic_02_70:
    speaker: "<Self>"
    en: What's this?
    ko: 이게 뭐야?
    ja: これは？
  d_nikke_maxwell_mechanic_02_71:
    speaker: maxwell_p
    en: Records from the Simulation Room.
    ko: 시뮬레이션 룸 기록이야.
    ja: シミュレーションルームの記録だよ。
  d_nikke_maxwell_mechanic_02_72:
    speaker: maxwell_p
    en: They're all from Nikkes who've interacted with you.
    ko: 베이비랑 교류했던 니케들 거.
    ja: ベビーと交流のあったニケたちのね。
  d_nikke_maxwell_mechanic_02_73:
    speaker: maxwell_p
    en: Pretty interesting, isn't it?
    ko: 신기하지 않아?
    ja: 不思議じゃない？
  d_nikke_maxwell_mechanic_02_74:
    speaker: "<Self>"
    en: I mean... It's only natural, isn't it?
    ko: 그거야 뭐… 자연스러운 거 아닐까?
    ja: "…自然なことじゃないか？"
  d_nikke_maxwell_mechanic_02_75:
    speaker: "<Self>"
    en: The longer it goes on, the more experience they get and...
    ko: 시간이 지날수록 경험이 쌓이는 건 당연-
    ja: |-
      時間が経つにつれて、
      経験が積まれていくのは自然な…
  d_nikke_maxwell_mechanic_02_76:
    speaker: maxwell_p
    en: Then what about this?
    ko: 그러면 여기.
    ja: じゃあ、ここ。
  d_nikke_maxwell_mechanic_02_77:
    speaker: maxwell_p
    en: How do you explain the Nikkes who were barely making any progress before they
      met you?
    ko: 베이비를 만나기 전엔 지지부진하던 녀석들은 어떻게 설명할 거야?
    ja: |-
      ベビーに出会う前は伸び悩んでた子たちのことは
      どう説明するつもり？
  d_nikke_maxwell_mechanic_02_78:
    speaker: "<Self>"
    en: That's...
    ko: 그건….
    ja: それは…
  d_nikke_maxwell_mechanic_02_79:
    speaker: maxwell_p
    en: Well, you're free to think whatever you want as a commander, Cutey.
    ko: 뭐, 지휘관인 베이비 입장에서 어떻게 생각하던 자유지만.
    ja: |-
      まあ、指揮官であるベビーが
      どう考えようと自由だけど、
  d_nikke_maxwell_mechanic_02_80:
    speaker: maxwell_p
    en: But from my perspective as a researcher, experience alone doesn't explain
      it.
    ko: 연구원인 내 입장으로 봤을 땐, 단지 경험만으로는 설명이 안 돼.
    ja: |-
      研究者として見ると、
      ただの経験だけでは説明がつかないの。
  d_nikke_maxwell_mechanic_02_81:
    speaker: maxwell_p
    en: When a Nikke shares both a mental connection and physical contact with you,
    ko: 베이비와 정신적인 교류, 그리고 신체적인 접촉.
    ja: ベビーとの精神的な交流、そして肉体的な接触。
  d_nikke_maxwell_mechanic_02_82:
    speaker: maxwell_p
    en: that's when she grows... That's the hypothesis I've been working with.
    ko: 이 두 가지가 있을 때 니케가 성장한다… 라는 가설이 세워진 거지.
    ja: |-
      この2つがあると、ニケが成長する…
      っていう仮説が導き出されたってわけ。
  d_nikke_maxwell_mechanic_02_83:
    speaker: maxwell_p
    en: In fact, that's already been proven.
    ko: 사실, 여기까지는 이미 결론이 난 이야기야.
    ja: 実は、ここまではもう結論が出てる話なの。
  d_nikke_maxwell_mechanic_02_84:
    speaker: maxwell_p
    en: The hypothesis has been verified, including the fact that you've had an effect
      on me too.
    ko: 가설도 검증됐고, 나한테도 영향이 있었다는 것까지.
    ja: |-
      仮説を検証して、
      私にも影響があったということまで。
  d_nikke_maxwell_mechanic_02_85:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_02_86:
    speaker: maxwell_p
    en: You know, I've always treated you like a test subject.
    ko: 그 왜, 나는 항상 베이비를 실험체로만 대해왔잖아?
    ja: |-
      ほら、私っていつもベビーのことを
      実験体として扱ってきたでしょ？
  d_nikke_maxwell_mechanic_02_87:
    speaker: maxwell_p
    en: So this time, I want to do the opposite.
    ko: 그러니까 이번엔 반대로.
    ja: だから、今回は逆に。
  d_nikke_maxwell_mechanic_02_88:
    speaker: maxwell_p
    en: I want to collect data from the same perspective as the other Nikkes.
    ko: 다른 니케들과 같은 입장으로, 데이터를 수집해보고 싶어졌어.
    ja: |-
      ほかのニケたちと同じような立場で
      データを集めてみたくなったの。
  d_nikke_maxwell_mechanic_02_89:
    speaker: maxwell_p
    en: I got curious about what that might be like.
    ko: 문득 궁금해지더라고.
    ja: 急に気になっちゃってね。
  d_nikke_maxwell_mechanic_02_90:
    speaker: "<Self>"
    en: In other words...
    ko: 그 말은 즉…..
    ja: それは、つまり…
  d_nikke_maxwell_mechanic_02_91:
    speaker: maxwell_p
    en: So, Cutey,
    ko: 그러니까, 베이비.
    ja: ってことで、ベビー。
  d_nikke_maxwell_mechanic_02_92:
    speaker: maxwell_p
    en: think you could take care of me too, like you do the other Nikkes?
    ko: 나도 한 번, 다른 니케들처럼 케어해줄 수 있겠어?
    ja: |-
      私のことも、ほかのニケみたいに
      ケアしてくれない？
  d_nikke_maxwell_mechanic_02_93:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_02_94:
    speaker: "<Narration>"
    en: I jump to my feet.
    ko: 벌떡-
    ja: スクッ――
  d_nikke_maxwell_mechanic_02_95:
    speaker: maxwell_p
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_maxwell_mechanic_02_96:
    speaker: maxwell_p
    en: Whoa, Cutey.
    ko: 뭐야… 베이비, 갑자기.
    ja: 急にどうしたの、ベビー。
  d_nikke_maxwell_mechanic_02_97:
    speaker: maxwell_p
    en: You startled me.
    ko: 깜짝 놀랐잖아.
    ja: びっくりしたじゃない。
  d_nikke_maxwell_mechanic_02_98:
    speaker: "<Self>"
    en: You sure you won't be disappointed?
    ko: 실망하지 않을 자신 있어?
    ja: がっかりしない自信はあるか？
  d_nikke_maxwell_mechanic_02_99:
    speaker: maxwell_p
    en: What? Disappointed?
    ko: 뭐라고? 실망?
    ja: えっ？ガッカリ？
  d_nikke_maxwell_mechanic_02_100:
    speaker: maxwell_p
    en: What could you possibly do to disappoint me?
    ko: 내가 베이비한테 실망할 일이 뭐 있어.
    ja: 私がベビーにガッカリするわけないでしょ。
  d_nikke_maxwell_mechanic_02_101:
    speaker: maxwell_p
    en: You've always exceeded my expectations.
    ko: 언제나 늘 기대 이상을 보여줬잖아.
    ja: いつも期待以上だよ。
  d_nikke_maxwell_mechanic_02_102:
    speaker: "<Self>"
    en: Okay,
    ko: 좋아.
    ja: よし
  d_nikke_maxwell_mechanic_02_103:
    speaker: "<Self>"
    en: then come with me to my room.
    ko: 그렇다면 내 방으로 따라와.
    ja: なら、私の部屋に来てくれ
d_nikke_maxwell_mechanic_03:
  d_nikke_maxwell_mechanic_03_1:
    speaker: maxwell_p
    en: So Cutey,
    ko: 베이비는 말이지.
    ja: ベビーはさ…
  d_nikke_maxwell_mechanic_03_2:
    speaker: maxwell_p
    en: do you think there are things science just can't explain?
    ko: 과학으로 설명하지 못하는 게 있다고 생각해?
    ja: 科学で説明できないことって、あると思う？
  d_nikke_maxwell_mechanic_03_3:
    speaker: "<Choice>"
    en: Of course.
    ko: 당연하지.
    ja: 当然、あると思う
  d_nikke_maxwell_mechanic_03_4:
    speaker: "<Choice>"
    en: No, I don't think so.
    ko: 아니, 없을 것 같아.
    ja: いいや、ないと思う
  d_nikke_maxwell_mechanic_03_5:
    speaker: maxwell_p
    en: Haha, that's so like you, Cutey.
    ko: 아하하, 베이비다운 대답이네.
    ja: あはは、ベビーらしい答えだね。
  d_nikke_maxwell_mechanic_03_6:
    speaker: maxwell_p
    en: But I see things a little differently...
    ko: 그런데 내 생각은 좀 다르단 말이지-
    ja: でも、私の考えはちょっと違うのよ…
  d_nikke_maxwell_mechanic_03_7:
    speaker: maxwell_p
    en: Thought so.
    ko: 역시 그렇지?
    ja: やっぱりそう思う？
  d_nikke_maxwell_mechanic_03_8:
    speaker: maxwell_p
    en: Hmm... The old me would've agreed with you in a heartbeat,
    ko: 음… 예전의 나라면 베이비의 말에 바로 동의했을 텐데.
    ja: |-
      うん…前の私ならベビーの言葉に
      すぐ同意しただろうけど、
  d_nikke_maxwell_mechanic_03_9:
    speaker: maxwell_p
    en: But these days...
    ko: 요즘은 말이지-
    ja: 最近はね…
  d_nikke_maxwell_mechanic_03_10:
    speaker: maxwell_p
    en: Actually, forget that!
    ko: "…가 아니라!"
    ja: "…じゃなくて！"
  d_nikke_maxwell_mechanic_03_11:
    speaker: maxwell_p
    en: This feels just like our usual counseling session!
    ko: 이건 우리가 평소에도 하는 상담이잖아!
    ja: |-
      これじゃ、いつも私たちが
      やってる面談と同じでしょ！
  d_nikke_maxwell_mechanic_03_12:
    speaker: "<Self>"
    en: I thought you said you wouldn't be disappointed.
    ko: 실망 안 한다면서.
    ja: がっかりしないと言っただろう
  d_nikke_maxwell_mechanic_03_13:
    speaker: maxwell_p
    en: No, that's not what I meant...!
    ko: 아니, 그게 아니라…!
    ja: いや、そうじゃなくて…！
  d_nikke_maxwell_mechanic_03_14:
    speaker: maxwell_p
    en: "*Sigh...* Never mind."
    ko: 하아… 됐다.
    ja: はぁ…もう分かった。
  d_nikke_maxwell_mechanic_03_15:
    speaker: maxwell_p
    en: So you've been providing psychological care for the other Nikkes too, right?
    ko: 그러니까 다른 니케들도 심리 케어는 계속하고 있다, 이거지?
    ja: |-
      つまり、ほかのニケにも心理的なケアは
      ずっとしてるって言いたいんでしょ？
  d_nikke_maxwell_mechanic_03_16:
    speaker: "<Self>"
    en: Yep.
    ko: 그렇지.
    ja: そうだ
  d_nikke_maxwell_mechanic_03_17:
    speaker: "<Narration>"
    en: "*Tap, tap*"
    ko: 타다닥-
    ja: タタッ――
  d_nikke_maxwell_mechanic_03_18:
    speaker: maxwell_p
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_maxwell_mechanic_03_19:
    speaker: maxwell_p
    en: What are you writing on your tablet?
    ko: 태블릿에 뭘 그렇게 적는 거야?
    ja: タブレットに何を打ち込んでるの？
  d_nikke_maxwell_mechanic_03_20:
    speaker: "<Self>"
    en: Hmm, I guess you could call it a record of our session.
    ko: 으음, 상담 기록이라 해야 할까.
    ja: ああ、面談記録とでも言うべきか
  d_nikke_maxwell_mechanic_03_21:
    speaker: "<Self>"
    en: There are some things I might miss if I just rely on memory.
    ko: 아무래도 내가 다 기억하기엔 놓치는 부분이 있을 수도 있을 테니까.
    ja: |-
      私の記憶だけでは、どうしても
      抜けてしまうところもあるかもしれないから
  d_nikke_maxwell_mechanic_03_22:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_03_23:
    speaker: maxwell_p
    en: You're more thoughtful than you look, Cutey.
    ko: 베이비는 보기보다 섬세하구나.
    ja: ベビーって、見た目よりも細かいんだ。
  d_nikke_maxwell_mechanic_03_24:
    speaker: maxwell_p
    en: Seeing things from your perspective definitely puts things in a different
      light.
    ko: 확실히 입장을 바꿔서 바라보니 보이는 게 있네.
    ja: |-
      やっぱり立場が変わると、
      見えてくることもあるんだね。
  d_nikke_maxwell_mechanic_03_25:
    speaker: "<Self>"
    en: Well, that's the end of our session.
    ko: 좋아, 이제 상담은 끝.
    ja: よし、これで面談は終わりだ
  d_nikke_maxwell_mechanic_03_26:
    speaker: "<Self>"
    en: I'll go get ready, so just wait...
    ko: 잠깐 준비하고 올 테니까, 여기서 잠시-
    ja: ちょっと身支度をしてくるから、ここで少し…
  d_nikke_maxwell_mechanic_03_27:
    speaker: maxwell_p
    en: Hang on, Cutey.
    ko: 잠깐, 베이비.
    ja: 待って、ベビー。
  d_nikke_maxwell_mechanic_03_28:
    speaker: maxwell_p
    en: Can I take a look at your tablet?
    ko: 그 태블릿, 나도 좀 봐도 돼?
    ja: そのタブレット、私もちょっと見ていい？
  d_nikke_maxwell_mechanic_03_29:
    speaker: "<Self>"
    en: My tablet?
    ko: 태블릿을?
    ja: これを？
  d_nikke_maxwell_mechanic_03_30:
    speaker: maxwell_p
    en: Why? I'm not allowed?
    ko: 응, 안돼?
    ja: うん、ダメ？
  d_nikke_maxwell_mechanic_03_31:
    speaker: maxwell_p
    en: Don't tell me you've been writing bad things about me.
    ko: 설마 내 험담이라도 적어 놓은 거야?
    ja: まさか、私の悪口でも書いてあるとか？
  d_nikke_maxwell_mechanic_03_32:
    speaker: "<Self>"
    en: Of course not.
    ko: 그럴 리가.
    ja: そんなわけないだろう
  d_nikke_maxwell_mechanic_03_33:
    speaker: "<Self>"
    en: But I also have info on the other Nikkes, so just look at your section.
    ko: 대신 다른 니케들의 내용도 있으니까, 맥스웰 부분만 봐.
    ja: |-
      見てもかまわないが、
      ほかのニケたちのことも書いてあるから、
      自分のところだけにしてくれ
  d_nikke_maxwell_mechanic_03_34:
    speaker: maxwell_p
    en: Okay, okay.
    ko: 예이 예이~
    ja: はいは～い。
  d_nikke_maxwell_mechanic_03_35:
    speaker: "<Monologue>"
    en: I hand the tablet to Maxwell and step away.
    ko: 나는 태블릿을 맥스웰에게 넘겨주고 자리를 비웠다.
    ja: |-
      私はタブレットをマクスウェルに渡し、
      席を外した
  d_nikke_maxwell_mechanic_03_36:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_03_37:
    speaker: maxwell_p
    en: All right then,
    ko: 좋아 그럼.
    ja: よし、それじゃ…
  d_nikke_maxwell_mechanic_03_38:
    speaker: maxwell_p
    en: let's see what Cutey thinks of me.
    ko: 베이비가 나를 어떻게 생각하는지 확인해 보실까?
    ja: |-
      ベビーが私のことをどう思ってるのか
      確かめてみよっかな？
  d_nikke_maxwell_mechanic_03_39:
    speaker: "<Narration>"
    en: "*Tap, tap*"
    ko: 톡톡-
    ja: トントン…
  d_nikke_maxwell_mechanic_03_40:
    speaker: "<Narration>"
    en: '"Maxwell"'
    ko: 맥스웰.
    ja: マクスウェル
  d_nikke_maxwell_mechanic_03_41:
    speaker: "<Narration>"
    en: '"One of the best researchers at Missilis."'
    ko: 미실리스 최고의 연구원 중 하나.
    ja: ミシリス最高の研究者の一人
  d_nikke_maxwell_mechanic_03_42:
    speaker: "<Narration>"
    en: '"A gifted researcher with both innovative thinking and the ability to bring
      her ideas to life."'
    ko: 응용력과 실행력을 모두 갖춘 인재.
    ja: 応用力と実行力を兼ね備えた人材
  d_nikke_maxwell_mechanic_03_43:
    speaker: "<Narration>"
    en: '"She has an extraordinary talent for machines and invention,"'
    ko: 기계와 발명에 엄청난 재능을 가지고 있지만,
    ja: |-
      機械と発明に関して
      素晴らしい才能を持っているが
  d_nikke_maxwell_mechanic_03_44:
    speaker: "<Narration>"
    en: '"but her expertise extends across a wide range of fields."'
    ko: 그 외의 분야에도 폭넓은 지식을 갖추고 있다.
    ja: |-
      それ以外の分野にも
      幅広い知識を持ち合わせている
  d_nikke_maxwell_mechanic_03_45:
    speaker: maxwell_p
    en: I mean, everyone knows that.
    ko: 뭐… 이 정돈 누구나 다 아는 사실이고.
    ja: まあ…これくらいは誰でも知ってる事実よね。
  d_nikke_maxwell_mechanic_03_46:
    speaker: maxwell_p
    en: What's next?
    ko: 그다음은?
    ja: それから？
  d_nikke_maxwell_mechanic_03_47:
    speaker: "<Narration>"
    en: '"Sometimes, she gets a little too carried away with her experiments and causes
      problems,"'
    ko: 가끔은 실험정신이 너무 과해서 문제일 때도 있지만.
    ja: |-
      たまに実験への情熱が度を超え
      問題を起こすこともあるが
  d_nikke_maxwell_mechanic_03_48:
    speaker: "<Narration>"
    en: '"but I think that''s part of her unique charm."'
    ko: 그것도 맥스웰다운 매력이라 생각한다.
    ja: それもマクスウェルらしい魅力だと思っている
  d_nikke_maxwell_mechanic_03_49:
    speaker: maxwell_p
    en: Haha, so that's why he was so embarrassed?
    ko: 하하, 이런 걸 써놔서 저렇게 부끄러워했구나?
    ja: |-
      はは、こんなことが書いてあったから
      あんなに恥ずかしがってたんだ？
  d_nikke_maxwell_mechanic_03_50:
    speaker: maxwell_p
    en: He really does have an adorable side.
    ko: 베이비도 참 귀여운 구석이 있다니까.
    ja: かわいいとこあるんだから。
  d_nikke_maxwell_mechanic_03_51:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_03_52:
    speaker: maxwell_p
    en: I was always dragging him around for my experiments,
    ko: 맨날 실험한다고 데리고 다녀서.
    ja: いつも実験実験って連れ回して、
  d_nikke_maxwell_mechanic_03_53:
    speaker: maxwell_p
    en: so I figured he wouldn't be too happy about it. Well, that's a surprise.
    ko: 유쾌하게 생각하진 않을 것 같았는데, 의외네.
    ja: いい気はしてないと思ってたから、意外だな。
  d_nikke_maxwell_mechanic_03_54:
    speaker: "<Narration>"
    en: '"Also,"'
    ko: 그리고.
    ja: それに…
  d_nikke_maxwell_mechanic_03_55:
    speaker: "<Narration>"
    en: '"she doesn''t seem to realize how kind she is."'
    ko: 본인 스스로가 얼마나 다정한 사람인지 모르는 것 같다.
    ja: |-
      自分がどれほど優しい人なのか、
      本人は気づいていないようだ
  d_nikke_maxwell_mechanic_03_56:
    speaker: maxwell_p
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_maxwell_mechanic_03_57:
    speaker: maxwell_p
    en: Kind?
    ko: 다정하다고?
    ja: 優しい？
  d_nikke_maxwell_mechanic_03_58:
    speaker: maxwell_p
    en: Come on, no way.
    ko: 에이~ 그럴 리가.
    ja: もう～、んなわけないじゃない。
  d_nikke_maxwell_mechanic_03_59:
    speaker: maxwell_p
    en: Everything I do is driven by self-interest.
    ko: 나는 철저하게 이해관계에 의해서 움직인단 말이지.
    ja: 私は徹底して利害関係で動くタイプなんだから。
  d_nikke_maxwell_mechanic_03_60:
    speaker: maxwell_p
    en: Cutey would be pretty disappointed if he found out what I'm really like.
    ko: 우리 베이비가 내 본심을 알면 실망하겠는걸?
    ja: |-
      ベビーが私の本心を知ったら
      ガッカリしちゃうだろうね？
  d_nikke_maxwell_mechanic_03_61:
    speaker: "<Narration>"
    en: "*Whirr*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_maxwell_mechanic_03_62:
    speaker: "<Self>"
    en: Disappointed by what?
    ko: 무슨 실망을 한다고?
    ja: 何をがっかりするって？
  d_nikke_maxwell_mechanic_03_63:
    speaker: maxwell_p
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_03_64:
    speaker: maxwell_p
    en: Ah, haha... It's nothing.
    ko: 아, 아하하. 별거 아니야~
    ja: あ、あはは。何でもないよ～
  d_nikke_maxwell_mechanic_03_65:
    speaker: maxwell_p
    en: I was just disappointed there wasn't more about me.
    ko: 안에 내용은 생각보다 별거 없어서 실망했다고~
    ja: |-
      思ったより大したことは書いてなくて
      ガッカリだったってこと～
  d_nikke_maxwell_mechanic_03_66:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_03_67:
    speaker: maxwell_p
    en: More importantly, Cutey, what's with that outfit?
    ko: 그보다 베이비, 그 복장은 뭐야?
    ja: それよりベビー、その格好はどうしたの？
  d_nikke_maxwell_mechanic_03_68:
    speaker: maxwell_p
    en: Going on a date or something later?
    ko: 이따가 어디 데이트라도 가려고?
    ja: これからどっかにデートでも行くつもり？
  d_nikke_maxwell_mechanic_03_69:
    speaker: "<Self>"
    en: Yeah, you can call it that.
    ko: 뭐, 비슷한 거라고 할 수 있지.
    ja: まあ、そうとも言えるな
  d_nikke_maxwell_mechanic_03_70:
    speaker: maxwell_p
    en: R-really?
    ko: 그, 그래?
    ja: そ、そうなの？
  d_nikke_maxwell_mechanic_03_71:
    speaker: maxwell_p
    en: Who are you meeting?
    ko: 누구랑 약속인데?
    ja: 誰と？
  d_nikke_maxwell_mechanic_03_72:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: ふむ…
  d_nikke_maxwell_mechanic_03_73:
    speaker: "<Monologue>"
    en: I hold out a hand to Maxwell.
    ko: 맥스웰에게 손을 내민다.
    ja: マクスウェルに手を差し出した
  d_nikke_maxwell_mechanic_03_74:
    speaker: maxwell_p
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_maxwell_mechanic_03_75:
    speaker: "<Self>"
    en: The person in my room right now.
    ko: 지금 방 안에 있는 사람.
    ja: 今、私の部屋にいる人と
  d_nikke_maxwell_mechanic_03_76:
    speaker: maxwell_p
    en: It's been a while
    ko: 오랜만이네.
    ja: 久しぶりだね。
  d_nikke_maxwell_mechanic_03_77:
    speaker: maxwell_p
    en: since we got to hang out like this.
    ko: 베이비랑 이렇게 둘이 돌아다니는 건.
    ja: ベビーとこうして二人で歩き回るの。
  d_nikke_maxwell_mechanic_03_78:
    speaker: "<Self>"
    en: I know, right?
    ko: 그렇지?
    ja: そうだな
  d_nikke_maxwell_mechanic_03_79:
    speaker: maxwell_p
    en: This is pretty interesting.
    ko: 그런데 재밌네.
    ja: でも、面白いね。
  d_nikke_maxwell_mechanic_03_80:
    speaker: maxwell_p
    en: I said I wanted to see things from the other Nikkes' point of view, and before
      I knew it, we were on a date.
    ko: 다른 니케들의 입장을 알고 싶다고 했는데, 바로 데이트를 하다니.
    ja: |-
      ほかのニケの立場になってみたいって言ったら、
      すぐにデートだなんて。
  d_nikke_maxwell_mechanic_03_81:
    speaker: maxwell_p
    en: Is this how you charm all the other Nikkes into getting stronger?
    ko: 이렇게 다른 니케들도 살살 꼬셔서, 성능을 마구 올려버리는 건가?
    ja: |-
      こうやってほかのニケのことも
      上手に誘い込んで、
      性能をどんどん引き上げてるってわけ？
  d_nikke_maxwell_mechanic_03_82:
    speaker: "<Self>"
    en: It's not like that...
    ko: "…그런 건 아니고."
    ja: "…そういうわけじゃない"
  d_nikke_maxwell_mechanic_03_83:
    speaker: "<Self>"
    en: I just wanted to spend some time with you doing something you enjoy.
    ko: 맥스웰이 좋아하는 걸 하면서 시간을 보내고 싶었어.
    ja: |-
      マクスウェルが好きなことをしながら
      一緒に過ごしたかっただけだ
  d_nikke_maxwell_mechanic_03_84:
    speaker: "<Self>"
    en: We've been pretty busy lately with all the surface exploration and everything.
    ko: 왜, 우리 한동안 바빴잖아? 지상 탐색이다 뭐다 해서.
    ja: |-
      お互い、しばらく忙しかったからな。
      地上探索や色々なことで
  d_nikke_maxwell_mechanic_03_85:
    speaker: maxwell_p
    en: Yeah, I guess so.
    ko: 뭐, 그렇긴 하지.
    ja: まあ、確かにね。
  d_nikke_maxwell_mechanic_03_86:
    speaker: maxwell_p
    en: We've been... busy.
    ko: 바쁘다… 라.
    ja: 忙しい…か。
  d_nikke_maxwell_mechanic_03_87:
    speaker: maxwell_p
    en: But I've never really thought about it that way before.
    ko: 이때까지 그런 생각은 한 번도 안 해봤는데.
    ja: |-
      そんなふうに考えたこと、
      今まで一度もなかったな。
  d_nikke_maxwell_mechanic_03_88:
    speaker: maxwell_p
    en: That's just my role in Matis, isn't it?
    ko: 그건 메티스로서 내 역할이잖아?
    ja: |-
      だってそれが、メティスとしての
      私の役割でしょ？
  d_nikke_maxwell_mechanic_03_89:
    speaker: maxwell_p
    en: And you said you wanted to do something I like?
    ko: 그리고 내가 좋아하는 거라니.
    ja: それに、私が好きなことって…
  d_nikke_maxwell_mechanic_03_90:
    speaker: maxwell_p
    en: Nothing really comes to mind besides experiments.
    ko: 실험 빼고 딱히 떠오르는 게 없는데.
    ja: 実験以外は、特に思い浮かばないしね。
  d_nikke_maxwell_mechanic_03_91:
    speaker: maxwell_p
    en: You don't have me confused with another woman, do you, Cutey?
    ko: 베이비, 설마 다른 여자랑 헷갈린 거 아냐?
    ja: |-
      ベビー、ひょっとして
      ほかの女と勘違いしちゃってない？
  d_nikke_maxwell_mechanic_03_92:
    speaker: "<Self>"
    en: Of course not, I think you're the one who forgot.
    ko: 그럴 리가, 맥스웰이야말로 기억 안 나는 거야?
    ja: まさか。マクスウェルこそ覚えてないのか？
  d_nikke_maxwell_mechanic_03_93:
    speaker: maxwell_p
    en: Huh?
    ko: 엥?
    ja: えっ？
  d_nikke_maxwell_mechanic_03_94:
    speaker: maxwell_p
    en: What's with the confidence?
    ko: 뭐야, 그 확신에 찬 말투는.
    ja: 何なの、その確信に満ちた言い方は。
  d_nikke_maxwell_mechanic_03_95:
    speaker: "<Monologue>"
    en: We chat as we walk, and before we know it, we've arrived at our destination.
    ko: 이야기하며 걷다 보니 어느새 목적지에 도착하게 되었다.
    ja: |-
      話しながら歩いていると、
      いつの間にか目的地に到着していた
  d_nikke_maxwell_mechanic_03_96:
    speaker: "<Self>"
    en: We're almost there.
    ko: 이제 거의 다 왔네.
    ja: もう目の前だな
  d_nikke_maxwell_mechanic_03_97:
    speaker: maxwell_p
    en: This is... a cafe?
    ko: 여긴… 카페?
    ja: ここって…カフェ？
  d_nikke_maxwell_mechanic_03_98:
    speaker: "<Self>"
    en: I'll be right back. Wait here.
    ko: 금방 다녀올 테니 여기서 기다리고 있어.
    ja: すぐに戻るから、ここで待っててくれ
  d_nikke_maxwell_mechanic_03_99:
    speaker: "<Narration>"
    en: "*Jingle*"
    ko: 딸랑-
    ja: チリン――
  d_nikke_maxwell_mechanic_03_100:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_03_101:
    speaker: maxwell_p
    en: Was he always like that?
    ko: 베이비가 원래 저랬었나?
    ja: ベビーって、元からあんな感じだったっけ？
  d_nikke_maxwell_mechanic_03_102:
    speaker: maxwell_p
    en: Hmm... He's totally different from how he is in the lab.
    ko: 흐음~ 뭔가 연구실에서 볼 때랑 느낌이 완전 다른데.
    ja: |-
      ふ～ん、なんか研究室で会う時の
      雰囲気とは全然違う。
  d_nikke_maxwell_mechanic_03_103:
    speaker: maxwell_p
    en: I mean, at his core, he's still the same person, but—
    ko: 뭐, 본질은 변하지 않은 것 같긴 하지만.
    ja: まあ、本質は変わってないみたいだけど。
  d_nikke_maxwell_mechanic_03_104:
    speaker: "<Narration>"
    en: "*Poke*"
    ko: 꾹-
    ja: ツン
  d_nikke_maxwell_mechanic_03_105:
    speaker: maxwell_p
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_maxwell_mechanic_03_106:
    speaker: "<Narration>"
    en: "*Poke, poke, poke*"
    ko: 꾹꾹꾹-
    ja: ツン、ツン、ツン
  d_nikke_maxwell_mechanic_03_107:
    speaker: boyfan
    en: Um, excuse me...
    ko: 저, 저기.
    ja: あ、あの…
  d_nikke_maxwell_mechanic_03_108:
    speaker: maxwell_p
    en: Hm?
    ko: 응?
    ja: ん？
  d_nikke_maxwell_mechanic_03_109:
    speaker: maxwell_p
    en: A kid? What's the matter?
    ko: 꼬마잖아? 무슨 일이니?
    ja: おちびちゃん、どうしたの？
  d_nikke_maxwell_mechanic_03_110:
    speaker: boyfan
    en: Uh...
    ko: 아.
    ja: あっ。
  d_nikke_maxwell_mechanic_03_111:
    speaker: boyfan
    en: W-well...
    ko: 그, 그게.
    ja: え、えっと…
  d_nikke_maxwell_mechanic_03_112:
    speaker: boyfan
    en: Are you... from M-Matis...?
    ko: 혹시… 메, 메티스 맞나요….?
    ja: もしかして…メ、メティスの人ですか…？
  d_nikke_maxwell_mechanic_03_113:
    speaker: boyfan
    en: The heroes of the Ark...?
    ko: 방주의 히어로…?
    ja: アークのヒーローの…？
  d_nikke_maxwell_mechanic_03_114:
    speaker: maxwell_p
    en: Haha, aren't you a shy one?
    ko: 아하하, 소심한 꼬마구나?
    ja: あはは、恥ずかしがり屋のおちびちゃんだね？
  d_nikke_maxwell_mechanic_03_115:
    speaker: maxwell_p
    en: Yep, that's right.
    ko: 그래, 맞아.
    ja: うん、そうだよ。
  d_nikke_maxwell_mechanic_03_116:
    speaker: maxwell_p
    en: I'm from Matis, the heroes of the Ark.
    ko: 이 누나가 방주의 히어로 메티스야.
    ja: アークのヒーロー、メティスのメンバーだよ。
  d_nikke_maxwell_mechanic_03_117:
    speaker: maxwell_p
    en: Since you worked up the courage to come talk to me, how about an autograph...?
    ko: 용기 내서 찾아왔으니, 사인이라도….
    ja: |-
      勇気を出して話しかけてくれたことだし、
      サインでも…
  d_nikke_maxwell_mechanic_03_118:
    speaker: boyfan
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_03_119:
    speaker: boyfan
    en: Whoaaaa!
    ko: 우오오오오오오-!
    ja: うわぁぁぁぁぁぁー！
  d_nikke_maxwell_mechanic_03_120:
    speaker: maxwell_p
    en: Geez, that startled me!
    ko: 까, 깜짝이야…!
    ja: び、びっくりした…！
  d_nikke_maxwell_mechanic_03_121:
    speaker: boyfan
    en: Matis is here!
    ko: 메티스가 왔다아---!
    ja: メティスだぁーーー！
  d_nikke_maxwell_mechanic_03_122:
    speaker: boyfan
    en: I-it's really Matis!
    ko: 지, 진짜 메티스다아아아--!
    ja: ほ、本物のメティスだぁぁぁーー！
  d_nikke_maxwell_mechanic_03_123:
    speaker: "<Narration>"
    en: The boy's voice echoes down the street.
    ko: 소년의 목소리가 거리에 쩌렁쩌렁 울린다.
    ja: 少年の声が街中に響き渡った
  d_nikke_maxwell_mechanic_03_124:
    speaker: maxwell_p
    en: "... I've got a bad feeling about this."
    ko: "…이거 느낌이 안 좋은데."
    ja: "…イヤな予感がするんだけど。"
d_nikke_maxwell_mechanic_04:
  d_nikke_maxwell_mechanic_04_1:
    speaker: fancyclerk
    en: Thank you for waiting. Here are your drinks!
    ko: 주문하신 음료 나왔습니다, 고객님~
    ja: お待たせいたしました。ご注文のドリンクです～
  d_nikke_maxwell_mechanic_04_2:
    speaker: "<Narration>"
    en: "*Jingle*"
    ko: 딸랑-
    ja: チリン――
  d_nikke_maxwell_mechanic_04_3:
    speaker: "<Narration>"
    en: A chorus of murmurs fills the air.
    ko: 웅성웅성-
    ja: ガヤガヤ――
  d_nikke_maxwell_mechanic_04_4:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_maxwell_mechanic_04_5:
    speaker: "<Monologue>"
    en: The moment I step out of the cafe, I'm greeted by a sea of people.
    ko: 가게 문을 나서자마자, 시야가 사람들로 가득 찼다.
    ja: |-
      店の外に出ると、
      見渡す限り人であふれていた
  d_nikke_maxwell_mechanic_04_6:
    speaker: fancywoman
    en: Really? You didn't mishear, did you?
    ko: 진짜야? 잘못 들은 거 아니지?
    ja: マジで？聞き間違いじゃないよね？
  d_nikke_maxwell_mechanic_04_7:
    speaker: youngman01
    en: I'm telling you!
    ko: 진짜라니까!
    ja: ホントだって！
  d_nikke_maxwell_mechanic_04_8:
    speaker: youngman01
    en: Look over there! It's Maxwell!
    ko: 저기 봐봐, 맥스웰이잖아!
    ja: あそこ見ろよ、マクスウェルじゃん！
  d_nikke_maxwell_mechanic_04_9:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_04_10:
    speaker: "<Monologue>"
    en: I look in the direction everyone's pointing
    ko: 시민들이 가리키는 방향을 바라보니,
    ja: 人々が指さす方向を見ると
  d_nikke_maxwell_mechanic_04_11:
    speaker: "<Monologue>"
    en: and see Maxwell surrounded by a crowd so dense she can't move.
    ko: 인파에 둘러싸여 오도 가도 못하는 맥스웰이 보인다.
    ja: |-
      人に囲まれ、身動きが取れなくなっている
      マクスウェルが見えた
  d_nikke_maxwell_mechanic_04_12:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_04_13:
    speaker: "<Narration>"
    en: Without hesitation, I force my way into the sea of people.
    ko: 나는 망설임 없이 인파 속으로 들어갔다.
    ja: |-
      私はためらうことなく
      人混みの中をかき分けていった
  d_nikke_maxwell_mechanic_04_14:
    speaker: maxwell_p
    en: Oh, there you are, Cutey.
    ko: 오, 베이비 왔구나?
    ja: あっ、ベビー。
  d_nikke_maxwell_mechanic_04_15:
    speaker: "<Self>"
    en: What's going on?
    ko: 이게 무슨 일이야?
    ja: いったいどうしたんだ？
  d_nikke_maxwell_mechanic_04_16:
    speaker: maxwell_p
    en: Oh, well...
    ko: 아… 그게 말이지.
    ja: えっと…それがね。
  d_nikke_maxwell_mechanic_04_17:
    speaker: maxwell_p
    en: Long story short, they're all here for my autograph.
    ko: 결론만 말하자면 내 사인을 받으려고 모인 사람들이야.
    ja: |-
      結論だけ言うと、私のサインを
      もらおうって人が集まっちゃって。
  d_nikke_maxwell_mechanic_04_18:
    speaker: maxwell_p
    en: They spotted me while I was waiting for you, Cutey.
    ko: 베이비를 기다리고 있다가 딱 걸렸단 말이지~
    ja: |-
      ベビーを待ってる間に
      まんまと捕まっちゃったってわけ～
  d_nikke_maxwell_mechanic_04_19:
    speaker: "<Self>"
    en: "... There sure are a lot of people here."
    ko: "…사람이 많긴 하네."
    ja: "…ずいぶん多いな"
  d_nikke_maxwell_mechanic_04_20:
    speaker: maxwell_p
    en: Haha, right?
    ko: 하하, 그렇지?
    ja: はは、だよね？
  d_nikke_maxwell_mechanic_04_21:
    speaker: maxwell_p
    en: Let's get out of here first. I've got things mostly under control.
    ko: 일단 여기서 벗어나자, 상황은 어느 정도 정리해놨어.
    ja: |-
      ひとまずここを離れようよ。
      今はある程度落ち着いたから。
  d_nikke_maxwell_mechanic_04_22:
    speaker: "<Self>"
    en: Are you sure it's okay to just leave?
    ko: 그냥 가도 괜찮은 거야?
    ja: このままここを離れても大丈夫か？
  d_nikke_maxwell_mechanic_04_23:
    speaker: maxwell_p
    en: This is my personal time.
    ko: 이건 내 개인 시간이잖아?
    ja: 今は私のプライベートな時間でしょ？
  d_nikke_maxwell_mechanic_04_24:
    speaker: maxwell_p
    en: I already told them any real fan would respect that,
    ko: 진정한 팬이라면 충분히 존중해 줘야 할 시간이라고.
    ja: 本当のファンなら尊重してくれるはず。
  d_nikke_maxwell_mechanic_04_25:
    speaker: maxwell_p
    en: so don't worry.
    ko: 이미 잘 말해놨으니 걱정 마.
    ja: もうちゃんと話しておいたから、心配しないで。
  d_nikke_maxwell_mechanic_04_26:
    speaker: "<Self>"
    en: Okay, then let's go.
    ko: "…알겠어, 그럼 가자."
    ja: "…分かった。では、行こう"
  d_nikke_maxwell_mechanic_04_27:
    speaker: "<Monologue>"
    en: I take Maxwell's hand and start weaving through the crowd.
    ko: 나는 맥스웰의 손을 잡고 인파 속을 헤쳐 나가기 시작했다.
    ja: |-
      私はマクスウェルの手を握り、
      人混みの中をかき分けながら進んでいった
  d_nikke_maxwell_mechanic_04_28:
    speaker: youngman
    en: H-hey, she's leaving!
    ko: 어, 어어… 저기 간다!
    ja: お、おい…あっちだ！
  d_nikke_maxwell_mechanic_04_29:
    speaker: youngman
    en: Maxwell, wait!
    ko: 잠깐만요, 맥스웰!
    ja: 待ってください、マクスウェル！
  d_nikke_maxwell_mechanic_04_30:
    speaker: fancywoman
    en: Oh, I wanted an autograph too!
    ko: 아아, 나도 사인받고 싶었는데!
    ja: あ～あ、私もサイン欲しかったのに！
  d_nikke_maxwell_mechanic_04_31:
    speaker: "<Narration>"
    en: In an instant,
    ko: 우르르-
    ja: ドドドッ
  d_nikke_maxwell_mechanic_04_32:
    speaker: "<Monologue>"
    en: the crowd rushes after us.
    ko: 순식간에 인파가 우리를 따라 움직이기 시작했다.
    ja: |-
      あっという間に、
      人々が私たちを追うように動き始めた
  d_nikke_maxwell_mechanic_04_33:
    speaker: "<Monologue>"
    en: Just then...
    ko: 그 순간.
    ja: その時…
  d_nikke_maxwell_mechanic_04_34:
    speaker: littlegirl
    en: A-aah!
    ko: 으, 으아앗-!
    ja: う、うわぁっ！
  d_nikke_maxwell_mechanic_04_35:
    speaker: "<Narration>"
    en: "*Thud*"
    ko: 털썩-
    ja: ドサッ
  d_nikke_maxwell_mechanic_04_36:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_04_37:
    speaker: maxwell_p
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_04_38:
    speaker: littlegirl
    en: Waaah...
    ko: 우, 우으….
    ja: う、うう…
  d_nikke_maxwell_mechanic_04_39:
    speaker: "<Narration>"
    en: Without a moment's hesitation,
    ko: 다다다다-
    ja: タタタタッ――
  d_nikke_maxwell_mechanic_04_40:
    speaker: "<Monologue>"
    en: Maxwell rushes over to the little girl.
    ko: 맥스웰은 망설임 없이 소녀에게 뛰어갔다.
    ja: |-
      マクスウェルは、ためらうことなく
      少女のもとへ駆け寄った
  d_nikke_maxwell_mechanic_04_41:
    speaker: maxwell_p
    en: Are you okay, kid?
    ko: 꼬마야, 괜찮아?
    ja: おちびちゃん、大丈夫？
  d_nikke_maxwell_mechanic_04_42:
    speaker: maxwell_p
    en: Can you get up?
    ko: 일어날 수 있겠어?
    ja: 立てる？
  d_nikke_maxwell_mechanic_04_43:
    speaker: littlegirl
    en: Y-yeah...
    ko: 네, 네에.
    ja: う、うん。
  d_nikke_maxwell_mechanic_04_44:
    speaker: maxwell_p
    en: Can you hold her for a sec, Cutey?
    ko: 베이비, 이 친구 좀 안고 있어 줄래?
    ja: ベビー、この子を抱っこしててくれる？
  d_nikke_maxwell_mechanic_04_45:
    speaker: "<Self>"
    en: Sure.
    ko: 응, 알겠어.
    ja: ああ、分かった
  d_nikke_maxwell_mechanic_04_46:
    speaker: "<Monologue>"
    en: Maxwell hands the kid off to me
    ko: 나에게 아이를 건네준 맥스웰은.
    ja: 私に少女を託したマクスウェルは
  d_nikke_maxwell_mechanic_04_47:
    speaker: "<Monologue>"
    en: before turning toward the crowd and heading over to the man who knocked the
      little girl down.
    ko: 인파 쪽으로 몸을 돌려 아이를 넘어트린 남자에게 다가간다.
    ja: |-
      人混みの方へ身をひるがえし、
      少女を突き飛ばした男に近づいた
  d_nikke_maxwell_mechanic_04_48:
    speaker: maxwell_p
    en: "... Hey."
    ko: "…저기."
    ja: "…ちょっと。"
  d_nikke_maxwell_mechanic_04_49:
    speaker: maxwell_p
    en: What do you think you're doing?
    ko: 지금 뭐 하자는 거야?
    ja: どういうつもり？
  d_nikke_maxwell_mechanic_04_50:
    speaker: maxwell_p
    en: You knocked that kid over.
    ko: 애가 밀려 넘어졌잖아.
    ja: 子どもを押して転ばせるなんて。
  d_nikke_maxwell_mechanic_04_51:
    speaker: youngman
    en: Um... I didn't mean to.
    ko: 아… 그게 그러려던 게 아닌데.
    ja: あ…そんなつもりはなかったんですが…
  d_nikke_maxwell_mechanic_04_52:
    speaker: youngman
    en: I-I'm sorry.
    ko: 죄, 죄송합니다.
    ja: す、すみません。
  d_nikke_maxwell_mechanic_04_53:
    speaker: youngman
    en: I just thought you were going to leave...
    ko: 갑자기 떠나실 거 같아서….
    ja: 急にお帰りになるようだったので…
  d_nikke_maxwell_mechanic_04_54:
    speaker: maxwell_p
    en: Don't apologize to me.
    ko: 나한테 사과할 게 아니라.
    ja: 私に謝るんじゃなくて、
  d_nikke_maxwell_mechanic_04_55:
    speaker: maxwell_p
    en: Don't you think you owe that little girl an apology?
    ko: 이 꼬마한테 사과하는 게 먼저 아닐까?
    ja: この子に謝るのが先じゃない？
  d_nikke_maxwell_mechanic_04_56:
    speaker: youngman
    en: "... I'm sorry, kid."
    ko: "…미안하다, 꼬마야."
    ja: "…ごめんね、お嬢ちゃん。"
  d_nikke_maxwell_mechanic_04_57:
    speaker: "<Monologue>"
    en: The crowd murmurs at the sight of Maxwell's firm resolve.
    ko: 단호한 맥스웰의 모습에 인파가 술렁인다.
    ja: 毅然としたマクスウェルの姿に人々がどよめいた
  d_nikke_maxwell_mechanic_04_58:
    speaker: "<Narration>"
    en: Whoa...
    ko: 와아아….
    ja: おおお…
  d_nikke_maxwell_mechanic_04_59:
    speaker: maxwell_p
    en: "*Sigh...*"
    ko: "…하아."
    ja: "…はぁ。"
  d_nikke_maxwell_mechanic_04_60:
    speaker: maxwell_p
    en: You all wanted my autograph, right?
    ko: 다들 사인을 원한다고 했지?
    ja: あなたたち、サインが欲しいんだったわよね？
  d_nikke_maxwell_mechanic_04_61:
    speaker: maxwell_p
    en: Fine, I'll sign for everyone.
    ko: 좋아, 그렇다면 해줄게.
    ja: いいわ、書いてあげる。
  d_nikke_maxwell_mechanic_04_62:
    speaker: maxwell_p
    en: But...
    ko: 대신.
    ja: その代わり。
  d_nikke_maxwell_mechanic_04_63:
    speaker: maxwell_p
    en: Only if you stay orderly.
    ko: 질서를 지켜서.
    ja: きちんと順番を守って、
  d_nikke_maxwell_mechanic_04_64:
    speaker: maxwell_p
    en: No more incidents like that, got it?
    ko: 방금 같은 일이 일어나지 않게, 알겠지?
    ja: 今みたいなことが起こらないように。いいわね？
  d_nikke_maxwell_mechanic_04_65:
    speaker: "<Monologue>"
    en: Once the impromptu autograph session is over,
    ko: 갑작스럽게 시작된 사인회를 마치고,
    ja: 唐突に始まったサイン会を終え
  d_nikke_maxwell_mechanic_04_66:
    speaker: "<Monologue>"
    en: we collapse onto a park bench,
    ko: 우리는 공원 벤치에 주저앉았다.
    ja: 私たちは公園のベンチに座った
  d_nikke_maxwell_mechanic_04_67:
    speaker: "<Narration>"
    en: exhausted.
    ko: 털썩-
    ja: ドサッ
  d_nikke_maxwell_mechanic_04_68:
    speaker: maxwell_p
    en: Ugh... This is killing me.
    ko: 아으~ 죽겠다아.
    ja: あぁ～、疲れたぁ。
  d_nikke_maxwell_mechanic_04_69:
    speaker: maxwell_p
    en: I've never really done anything like this before, so now my whole body's aching.
    ko: 하지도 않던 짓을 하려니 삭신이 쑤시네.
    ja: 慣れないことをしたから、体中が痛むね。
  d_nikke_maxwell_mechanic_04_70:
    speaker: "<Self>"
    en: It was cool, though.
    ko: 그래도 멋졌어.
    ja: でも、カッコよかったぞ
  d_nikke_maxwell_mechanic_04_71:
    speaker: maxwell_p
    en: Really? I didn't exactly do it out of a sense of justice.
    ko: 그래? 딱히 정의감에 한 일은 아닌데.
    ja: そう？別に正義感でやったわけじゃないけど。
  d_nikke_maxwell_mechanic_04_72:
    speaker: maxwell_p
    en: I was just trying to prevent a bigger headache later.
    ko: 나중에 귀찮은 일 생길까 봐 방지 차원에서 한 거지.
    ja: |-
      後で面倒なことになると困るから、
      先に手を打っただけ。
  d_nikke_maxwell_mechanic_04_73:
    speaker: maxwell_p
    en: Can you imagine the uproar if people found out a kid got hurt because of Matis?
    ko: 메티스 때문에 애가 다쳤대 봐, 얼마나 난리가 나겠어?
    ja: |-
      メティスのせいで子どもが
      ケガしたなんてことになったら、
      大騒ぎになっちゃうでしょ？
  d_nikke_maxwell_mechanic_04_74:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_04_75:
    speaker: maxwell_p
    en: What's with that face?
    ko: 뭘 그런 표정으로 봐.
    ja: なんでそんな顔で見てるの。
  d_nikke_maxwell_mechanic_04_76:
    speaker: maxwell_p
    en: You look like you've seen a ghost.
    ko: 못 볼 걸 본 사람처럼.
    ja: とんでもないものを見たような顔しちゃって。
  d_nikke_maxwell_mechanic_04_77:
    speaker: "<Self>"
    en: I knew I wasn't seeing things.
    ko: 역시 내 눈이 틀리지 않았구나 해서.
    ja: やはり私の目に狂いはなかった
  d_nikke_maxwell_mechanic_04_78:
    speaker: maxwell_p
    en: Ahaha, what are you talking about?
    ko: 아하하, 뭐야 그거.
    ja: あはは、どういう意味よ。
  d_nikke_maxwell_mechanic_04_79:
    speaker: maxwell_p
    en: Cutey, you don't actually think I'm a good person, do you?
    ko: 베이비, 설마 내가 좋은 사람이라고 생각하는 거야?
    ja: ベビー、まさか私のこといい人だとか思ってる？
  d_nikke_maxwell_mechanic_04_80:
    speaker: maxwell_p
    en: If you do, I'd like to clear that up right now.
    ko: 그렇다면 그 오해 얼른 풀어줬으면 하는데.
    ja: だったらその誤解は早く解いてほしいんだけど。
  d_nikke_maxwell_mechanic_04_81:
    speaker: "<Self>"
    en: But you didn't ignore them.
    ko: 그래도 그냥 지나치지 않은 건 사실이잖아.
    ja: でも、見過ごさなかったのは事実だろう？
  d_nikke_maxwell_mechanic_04_82:
    speaker: maxwell_p
    en: Yeah, I wonder why I didn't.
    ko: 글쎄, 내가 갑자기 왜 그랬을까.
    ja: そうね、なんであんなことしたんだろう。
  d_nikke_maxwell_mechanic_04_83:
    speaker: maxwell_p
    en: Normally, I would've just walked right past.
    ko: 평소였으면 그냥 지나쳤을 텐데.
    ja: |-
      いつもだったら、
      そのまま見過ごしてたはずなのに。
  d_nikke_maxwell_mechanic_04_84:
    speaker: maxwell_p
    en: Maybe it's because you were watching?
    ko: 베이비가 지켜보고 있어서 그랬을지도?
    ja: ベビーが見てたからかも？
  d_nikke_maxwell_mechanic_04_85:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_04_86:
    speaker: maxwell_p
    en: Geez, seriously...
    ko: 에휴, 진짜.
    ja: あぁ～、もう。
  d_nikke_maxwell_mechanic_04_87:
    speaker: maxwell_p
    en: Hanging around you is starting to rub off on me.
    ko: 베이비랑 있으니까, 나까지 이상해지는 거 같다니까.
    ja: |-
      ベビーと一緒にいると、
      私までおかしくなるみたい。
  d_nikke_maxwell_mechanic_04_88:
    speaker: maxwell_p
    en: By the way, Cutey,
    ko: 그러고 보니, 베이비.
    ja: そういえば、ベビー。
  d_nikke_maxwell_mechanic_04_89:
    speaker: maxwell_p
    en: what's that you've been carrying around this whole time?
    ko: 아까부터 계속 가지고 다니던 그건 뭐야?
    ja: さっきからずっと持ってるそれ、何？
  d_nikke_maxwell_mechanic_04_90:
    speaker: "<Self>"
    en: Oh, this?
    ko: 아, 이거 말이지.
    ja: ああ、これか
  d_nikke_maxwell_mechanic_04_91:
    speaker: "<Monologue>"
    en: I hold up the two drinks, now lukewarm after the ice has melted.
    ko: 얼음이 녹아 미지근해진 음료 두 잔을 꺼내 들었다.
    ja: 氷が溶けてぬるくなった飲み物を2つ取り出した
  d_nikke_maxwell_mechanic_04_92:
    speaker: maxwell_p
    en: Oh, lemonade?
    ko: 오오, 레모네이드잖아?
    ja: おお、レモネード？
  d_nikke_maxwell_mechanic_04_93:
    speaker: "<Self>"
    en: I bought these for us earlier, but looking at them now, I don't think we should
      drink them.
    ko: 아까 같이 마시려고 산 건데… 상태를 보니까 못 먹겠네.
    ja: |-
      さっき一緒に飲もうと思って買ったのだが…
      これではもう飲めないな
  d_nikke_maxwell_mechanic_04_94:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_04_95:
    speaker: maxwell_p
    en: That's okay. Give it here.
    ko: 괜찮아, 이리 줘 봐.
    ja: 大丈夫、それちょうだい。
  d_nikke_maxwell_mechanic_04_96:
    speaker: "<Self>"
    en: It's not cold anymore. Is that okay?
    ko: 미지근할 텐데 괜찮아?
    ja: ぬるくなってしまったが、いいのか？
  d_nikke_maxwell_mechanic_04_97:
    speaker: maxwell_p
    en: Yeah, it's fine. Give it to me. I'll drink it.
    ko: 응. 괜찮으니까 달라고, 마셔버리게.
    ja: うん。平気だからもらうね。いただきます。
  d_nikke_maxwell_mechanic_04_98:
    speaker: "<Narration>"
    en: "*Gulp, gulp*"
    ko: 꿀꺽꿀꺽-
    ja: ゴクゴク
  d_nikke_maxwell_mechanic_04_99:
    speaker: maxwell_p
    en: Ahh...
    ko: 파하-
    ja: ぷはーっ。
  d_nikke_maxwell_mechanic_04_100:
    speaker: maxwell_p
    en: Whew, I finally feel alive again!
    ko: 휴우~ 이제야 좀 살 거 같네.
    ja: ふぅ～、生き返った。
  d_nikke_maxwell_mechanic_04_101:
    speaker: "<Self>"
    en: I'm glad you like it.
    ko: 잘 마셔서 다행이네.
    ja: それならよかった
  d_nikke_maxwell_mechanic_04_102:
    speaker: maxwell_p
    en: Haha, of course!
    ko: 하하, 당연하지~
    ja: あはは、ごちそうさま～
  d_nikke_maxwell_mechanic_04_103:
    speaker: maxwell_p
    en: So you remembered
    ko: 기억해 주고 있었구나?
    ja: 覚えててくれたんだね？
  d_nikke_maxwell_mechanic_04_104:
    speaker: maxwell_p
    en: it was my favorite thing back when I was human.
    ko: 인간일 때의 내가 가장 좋아하던 거라고.
    ja: 人間の頃に私が大好きだったものだって。
  d_nikke_maxwell_mechanic_04_105:
    speaker: "<Self>"
    en: You said it wasn't worth the effort, so you rarely drank it.
    ko: 그리고 비효율적이라 잘 안 마신다고 했지.
    ja: |-
      それに、効率的じゃないから
      飲まないと言っていたな
  d_nikke_maxwell_mechanic_04_106:
    speaker: maxwell_p
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_04_107:
    speaker: maxwell_p
    en: Haha, you've got a great memory, Cutey.
    ko: 아하하, 베이비 기억력 진짜 좋네.
    ja: あはは、ベビーって記憶力がすごいね。
  d_nikke_maxwell_mechanic_04_108:
    speaker: maxwell_p
    en: Well, this is kind of a special case.
    ko: 뭐, 지금은 좀 예외적인 상황이니까.
    ja: まあ、今はちょっと例外的な状況だし、
  d_nikke_maxwell_mechanic_04_109:
    speaker: maxwell_p
    en: After all, you gave me this lemonade.
    ko: 이건 베이비가 준 레모네이드잖아.
    ja: ベビーがくれたレモネードだからね。
  d_nikke_maxwell_mechanic_04_110:
    speaker: maxwell_p
    en: All right, up we go.
    ko: 읏차-
    ja: よいしょっと。
  d_nikke_maxwell_mechanic_04_111:
    speaker: "<Monologue>"
    en: Maxwell stands up.
    ko: 맥스웰이 몸을 일으켰다.
    ja: マクスウェルが立ち上がった
  d_nikke_maxwell_mechanic_04_112:
    speaker: maxwell_p
    en: It's getting late. Let's head back.
    ko: 자, 시간도 늦었으니 돌아가자.
    ja: じゃ、もう遅いし、帰ろっか。
  d_nikke_maxwell_mechanic_04_113:
    speaker: "<Self>"
    en: "... We're leaving already?"
    ko: "…벌써 가도 괜찮은거야?"
    ja: "…もういいのか？"
  d_nikke_maxwell_mechanic_04_114:
    speaker: maxwell_p
    en: Well, it's a little sad, but it can't be helped.
    ko: 뭐, 조금 아쉽지만 어쩔 수 없지.
    ja: まあ、ちょっと名残惜しいけど仕方ないよ。
  d_nikke_maxwell_mechanic_04_115:
    speaker: maxwell_p
    en: You should get back to your life, Cutey,
    ko: 이제 베이비는 베이비의 일상으로,
    ja: ベビーはベビーの日常に、
  d_nikke_maxwell_mechanic_04_116:
    speaker: maxwell_p
    en: and I should get back to mine.
    ko: 나는 나의 일상으로 돌아가야 하니.
    ja: 私は私の日常に戻らなきゃ。
  d_nikke_maxwell_mechanic_04_117:
    speaker: maxwell_p
    en: I've got a mountain of work waiting for me after being away on the surface.
    ko: 지상에 가있는 동안 밀려있던 일이 산더미거든.
    ja: |-
      地上に行ってる間に
      仕事が山ほど溜まってるんだ。
  d_nikke_maxwell_mechanic_04_118:
    speaker: maxwell_p
    en: What's up? Is there still something you wanted to do?
    ko: 그런데 왜? 아직 하고 싶은 게 남았어?
    ja: |-
      でも、なんで？
      まだ何かやり残したことでもある？
  d_nikke_maxwell_mechanic_04_119:
    speaker: "<Self>"
    en: I was just wondering how your data collection went today.
    ko: 오늘 데이터 수집 결과가 어떤가 해서.
    ja: 今日のデータ収集の結果が気になる
  d_nikke_maxwell_mechanic_04_120:
    speaker: "<Self>"
    en: That's the whole reason we met, after all.
    ko: 애초에 만난 목적이 그거였잖아.
    ja: もともと、そのためだっただろう？
  d_nikke_maxwell_mechanic_04_121:
    speaker: maxwell_p
    en: Oh, right. That.
    ko: 아, 맞다. 그거 말이지?
    ja: あ、そうだった。そのことね。
  d_nikke_maxwell_mechanic_04_122:
    speaker: maxwell_p
    en: Hmm, it's hard to say...
    ko: 흐음, 글쎄… 어떠려나.
    ja: う～ん、そうだな…どうだろう。
  d_nikke_maxwell_mechanic_04_123:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_maxwell_mechanic_04_124:
    speaker: maxwell_p
    en: Then let me ask you this instead.
    ko: 그렇다면, 이번엔 내가 반대로 물어볼게.
    ja: じゃあ、今度は私が聞くね。
  d_nikke_maxwell_mechanic_04_125:
    speaker: maxwell_p
    en: Are you sure you won't be disappointed?
    ko: 실망하지 않을 자신 있어?
    ja: がっかりしない自信はある？
  d_nikke_maxwell_mechanic_04_126:
    speaker: "<Self>"
    en: What could you possibly do to disappoint me?
    ko: 내가 맥스웰한테 실망할 일이 뭐 있겠어.
    ja: 私がマクスウェルにがっかりするわけはない
  d_nikke_maxwell_mechanic_04_127:
    speaker: maxwell_p
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_maxwell_mechanic_04_128:
    speaker: maxwell_p
    en: Hahaha, I should've known.
    ko: 하하하, 역시.
    ja: ははは、さすがだね。
  d_nikke_maxwell_mechanic_04_129:
    speaker: maxwell_p
    en: Of course you'd say that.
    ko: 베이비라면 그렇게 나와야지.
    ja: ベビーなら、そう来なくちゃね。
  d_nikke_maxwell_mechanic_04_130:
    speaker: maxwell_p
    en: Okay then,
    ko: 좋아.
    ja: よし。
  d_nikke_maxwell_mechanic_04_131:
    speaker: maxwell_p
    en: follow me.
    ko: 그렇다면 따라와.
    ja: なら、ついてきて。
d_nikke_maxwell_mechanic_05:
  d_nikke_maxwell_mechanic_05_1:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_2:
    speaker: maxwell_p
    en: So I looked into how contact with you affects a Nikke's growth.
    ko: 베이비의 접촉이 니케 성장에 미치는 영향에 대한 조사.
    ja: |-
      ベビーとの接触がニケの成長に
      及ぼす影響についての調査だけど。
  d_nikke_maxwell_mechanic_05_3:
    speaker: maxwell_p
    en: Um... Long story short,
    ko: 음… 결론부터 말하자면.
    ja: えっと…結論から言うと…
  d_nikke_maxwell_mechanic_05_4:
    speaker: maxwell_p
    en: surprisingly enough, I found absolutely nothing.
    ko: 놀랍게도 얻은 게 하나~도 없어.
    ja: 驚くことに、収穫はな～んにもなかったの。
  d_nikke_maxwell_mechanic_05_5:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_6:
    speaker: maxwell_p
    en: I wasn't expecting to get any meaningful data in just one day anyway.
    ko: 애초에 하루 만에 유의미한 데이터를 얻을 거라곤 생각 안 했어.
    ja: |-
      もともと、一日で有意義なデータが
      得られるとは思ってなかったしね。
  d_nikke_maxwell_mechanic_05_7:
    speaker: maxwell_p
    en: Oh well,
    ko: 뭐, 그러면 어때.
    ja: まあ、それでもいいじゃない。
  d_nikke_maxwell_mechanic_05_8:
    speaker: maxwell_p
    en: at least I got to go on a date with you for the first time in a while.
    ko: 오랜만에 베이비랑 데이트도 했고.
    ja: 久しぶりにベビーとデートもできたし、
  d_nikke_maxwell_mechanic_05_9:
    speaker: maxwell_p
    en: I'll just take that as a win.
    ko: 그걸로 위안 삼으면 되는 거지.
    ja: それで十分だって思えばいいから。
  d_nikke_maxwell_mechanic_05_10:
    speaker: "<Self>"
    en: You've changed a lot.
    ko: 많이 변했네.
    ja: ずいぶん変わったな
  d_nikke_maxwell_mechanic_05_11:
    speaker: maxwell_p
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_05_12:
    speaker: maxwell_p
    en: Where'd that come from, Cutey?
    ko: 베이비. 갑자기 그게 무슨 소리야.
    ja: いきなり何を言い出すかと思ったら。
  d_nikke_maxwell_mechanic_05_13:
    speaker: maxwell_p
    en: What do you mean I've changed?
    ko: 내가 변하긴 뭘 변했다 그래.
    ja: 私のどこが変わったって言うのよ。
  d_nikke_maxwell_mechanic_05_14:
    speaker: maxwell_p
    en: Keep talking nonsense like that, and you'll be sorry.
    ko: 또 이상한 소리 할 거면 가만 안 둬?
    ja: |-
      またおかしなことでも言ったら、
      ただじゃおかないわよ？
  d_nikke_maxwell_mechanic_05_15:
    speaker: "<Self>"
    en: You've always been all about efficiency,
    ko: 맥스웰은 원래 효율적인 걸 추구하잖아.
    ja: |-
      もともとマクスウェルは
      効率を重視するタイプだろう
  d_nikke_maxwell_mechanic_05_16:
    speaker: "<Self>"
    en: but you've changed. I noticed it today, and back on the surface too.
    ko: 그런데 달라졌어. 오늘도 그렇고, 지상에서도.
    ja: |-
      だが、変わった。
      今日もそうだったし、地上でも
  d_nikke_maxwell_mechanic_05_17:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_18:
    speaker: "<Self>"
    en: You helped that little girl after she got knocked over in the crowd,
    ko: 인파에 밀려 넘어진 아이를 일으켜 세워준다던가.
    ja: |-
      人混みで押されて転んだ
      子どもを起こしてあげるとか
  d_nikke_maxwell_mechanic_05_19:
    speaker: "<Self>"
    en: you even drank that lukewarm lemonade and said it was good for my sake...
    ko: 미지근한 레모네이드도 맛있다고 마셔준다던가.
    ja: |-
      ぬるくなったレモネードを
      おいしいと言って飲んでくれるとか
  d_nikke_maxwell_mechanic_05_20:
    speaker: "<Self>"
    en: That's kind of strange for someone who only does things when there's something
      in it for her.
    ko: 이해관계로 움직이는 사람치고는, 좀 이상하지.
    ja: 利害関係で動くタイプにしては、何かが違う
  d_nikke_maxwell_mechanic_05_21:
    speaker: maxwell_p
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_05_22:
    speaker: maxwell_p
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_maxwell_mechanic_05_23:
    speaker: maxwell_p
    en: Kind?
    ko: 다정하다고?
    ja: 優しい？
  d_nikke_maxwell_mechanic_05_24:
    speaker: maxwell_p
    en: Come on, no way.
    ko: 에이~ 그럴 리가.
    ja: もう～、んなわけないじゃない。
  d_nikke_maxwell_mechanic_05_25:
    speaker: maxwell_p
    en: Everything I do is driven by self-interest.
    ko: 나는 철저하게 이해관계에 의해서 움직인단 말이지.
    ja: 私は徹底して利害関係で動くタイプなんだから。
  d_nikke_maxwell_mechanic_05_26:
    speaker: maxwell_p
    en: Cutey would be pretty disappointed if he found out what I'm really like.
    ko: 우리 베이비가 내 본심을 알면 실망하겠는걸?
    ja: |-
      ベビーが私の本心を知ったら
      ガッカリしちゃうだろうね？
  d_nikke_maxwell_mechanic_05_27:
    speaker: maxwell_p
    en: So you heard me...
    ko: "…들은 거구나."
    ja: "…聞いてたんだ。"
  d_nikke_maxwell_mechanic_05_28:
    speaker: "<Self>"
    en: Uh, I didn't mean to, but...
    ko: 어, 의도하진 않았지만.
    ja: ああ、聞くつもりではなかったが
  d_nikke_maxwell_mechanic_05_29:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_30:
    speaker: maxwell_p
    en: "*Sigh...* I can't get anything past you, Cutey."
    ko: 하아, 베이비는 진짜 못 당하겠네.
    ja: はぁ、ベビーにはホント敵わないな。
  d_nikke_maxwell_mechanic_05_31:
    speaker: maxwell_p
    en: The more time I spend with you, the more I feel like you're seeing right through
      me.
    ko: 같이 있을수록 점점 발가벗겨지는 기분이랄까.
    ja: |-
      一緒にいればいるほど、どんどん本心を
      見透かされてく感じっていうか。
  d_nikke_maxwell_mechanic_05_32:
    speaker: maxwell_p
    en: Fine, I'll admit it.
    ko: 그래, 인정할게.
    ja: そうだね、認めるよ。
  d_nikke_maxwell_mechanic_05_33:
    speaker: maxwell_p
    en: Today, I finally figured it out.
    ko: 오늘에서야 확실히 알았어.
    ja: 今日で、ようやくハッキリ分かった。
  d_nikke_maxwell_mechanic_05_34:
    speaker: maxwell_p
    en: Meeting you changed me somehow.
    ko: 베이비를 만나면서 나에게도 뭔가 변화가 있었다는걸.
    ja: |-
      ベビーと会ってるうちに
      私にも何か変化が起こってたってこと。
  d_nikke_maxwell_mechanic_05_35:
    speaker: maxwell_p
    en: I still can't explain why, but...
    ko: 원인은 여전히 설명 못 하겠지만.
    ja: 原因は、いまだに説明できないんだけど…
  d_nikke_maxwell_mechanic_05_36:
    speaker: maxwell_p
    en: I've come to the conclusion that
    ko: 베이비의 [마음]이 내 안의 [무언가]를 이끌어냈다-
    ja: |-
      ベビーの「心」が
      私の中の「何か」を引き出した…
  d_nikke_maxwell_mechanic_05_37:
    speaker: maxwell_p
    en: your heart awakened something inside me.
    ko: 라는 결론이 되겠네.
    ja: っていう結論になるかな。
  d_nikke_maxwell_mechanic_05_38:
    speaker: maxwell_p
    en: Heh...
    ko: 하.
    ja: はぁ…
  d_nikke_maxwell_mechanic_05_39:
    speaker: maxwell_p
    en: '"Your heart," "something inside me."'
    ko: "[마음]이니, [무언가]니."
    ja: "「心」とか、「何か」とか。"
  d_nikke_maxwell_mechanic_05_40:
    speaker: maxwell_p
    en: These aren't words a researcher should be using.
    ko: 이거 연구원으로서 하면 안 될 소린데.
    ja: |-
      研究者としてこんなこと
      言うべきじゃないんだけど。
  d_nikke_maxwell_mechanic_05_41:
    speaker: "<Self>"
    en: There are some things in this world that science just can't prove.
    ko: 이 세상엔 과학으로 증명하기 힘든 것들도 있는 법이야.
    ja: |-
      この世には科学で
      証明できないこともあるということだ
  d_nikke_maxwell_mechanic_05_42:
    speaker: maxwell_p
    en: Haha, if anyone else had said that, I'd have scoffed.
    ko: 하하, 다른 사람한테 들었으면 코웃음 쳤을 텐데.
    ja: |-
      はは、他の人に言われたら
      鼻で笑ってたと思うけど…
  d_nikke_maxwell_mechanic_05_43:
    speaker: maxwell_p
    en: But coming from you, it's oddly convincing.
    ko: 베이비가 하니까 묘하게 설득력이 있네.
    ja: ベビーが言うと、妙に説得力があるね。
  d_nikke_maxwell_mechanic_05_44:
    speaker: maxwell_p
    en: Still, it's my job to prove things like that,
    ko: 그래도 그걸 증명해 내는 게 내 일이니까.
    ja: |-
      だけど、それを証明してみせるのが
      私の仕事だから。
  d_nikke_maxwell_mechanic_05_45:
    speaker: maxwell_p
    en: so I'm not going to stop my research.
    ko: 연구를 멈추진 않을 거야.
    ja: 研究をやめるつもりはないよ。
  d_nikke_maxwell_mechanic_05_46:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_47:
    speaker: maxwell_p
    en: What I'm getting at is...
    ko: "…그러니까 말이지."
    ja: "…だからさ。"
  d_nikke_maxwell_mechanic_05_48:
    speaker: "<Monologue>"
    en: Maxwell comes up to me and kisses me.
    ko: 맥스웰이 다가와 입을 맞춘다.
    ja: マクスウェルが近づき、キスをした
  d_nikke_maxwell_mechanic_05_49:
    speaker: "<Self>"
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_maxwell_mechanic_05_50:
    speaker: maxwell_p
    en: A-ahem!
    ko: 크, 크흠!
    ja: オ、オホンッ！
  d_nikke_maxwell_mechanic_05_51:
    speaker: maxwell_p
    en: Th-this is an experiment.
    ko: 이, 이건 실험이야.
    ja: こ、これは実験だよ。
  d_nikke_maxwell_mechanic_05_52:
    speaker: maxwell_p
    en: So now we've only got two data points.
    ko: 이제 기껏해서 표본이 두 개 생긴 거니까.
    ja: 今、ようやくサンプルが2つになったんだから。
  d_nikke_maxwell_mechanic_05_53:
    speaker: maxwell_p
    en: You know, the more trials you run, the closer your results get to the average.
    ko: 왜, 시행 횟수가 많아질수록 평균값에 가까워지는 법이잖아.
    ja: |-
      ほら、試行回数が増えるほど、
      平均値に近づいてくものでしょ。
  d_nikke_maxwell_mechanic_05_54:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_55:
    speaker: maxwell_p
    en: I'm done denying it.
    ko: "…그리고 이제 부정하지 않으려고."
    ja: "…それに、もう否定するのはやめようと思って。"
  d_nikke_maxwell_mechanic_05_56:
    speaker: maxwell_p
    en: So Cutey,
    ko: 그러니까 베이비.
    ja: だからね、ベビー。
  d_nikke_maxwell_mechanic_05_57:
    speaker: maxwell_p
    en: will you... keep researching this with me?
    ko: 이 연구… 좀 더 같이 해줄 수 있어?
    ja: この研究に…もうちょっと付き合ってくれる？
  d_nikke_maxwell_mechanic_05_58:
    speaker: "<Self>"
    en: "... Okay."
    ko: "…알겠어."
    ja: "…分かった"
  d_nikke_maxwell_mechanic_05_59:
    speaker: maxwell_p
    en: So...
    ko: 이제 안 하는구나?
    ja: もう言わないんだね？
  d_nikke_maxwell_mechanic_05_60:
    speaker: maxwell_p
    en: You're not telling me to stop anymore?
    ko: 그만두라는 말.
    ja: やめてほしいって。
  d_nikke_maxwell_mechanic_05_61:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_62:
    speaker: "<Self>"
    en: Now that you've admitted it, I should too.
    ko: 맥스웰이 인정했으니까, 나도 인정해야지.
    ja: マクスウェルが認めたんだ、私も認めよう
  d_nikke_maxwell_mechanic_05_63:
    speaker: maxwell_p
    en: Haha, perfect.
    ko: 하하, 좋아.
    ja: はは、分かったよ。
  d_nikke_maxwell_mechanic_05_64:
    speaker: maxwell_p
    en: So...
    ko: 그러면 있지.
    ja: じゃあさ…
  d_nikke_maxwell_mechanic_05_65:
    speaker: maxwell_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_66:
    speaker: "<Monologue>"
    en: Maxwell slowly approaches me
    ko: 맥스웰이 천천히 다가와,
    ja: マクスウェルがゆっくりと近づき
  d_nikke_maxwell_mechanic_05_67:
    speaker: "<Monologue>"
    en: and quietly burrows into my arms.
    ko: 조용히 품 안으로 파고들었다.
    ja: そっと私の胸に顔をうずめた
  d_nikke_maxwell_mechanic_05_68:
    speaker: maxwell_p
    en: "... Looking forward to working with you, Cutey."
    ko: "…앞으로도 잘 부탁할게."
    ja: "…これからもよろしくね。"
  d_nikke_maxwell_mechanic_05_69:
    speaker: "<Narration>"
    en: '"Test 2 Results"'
    ko: 제2차 실험 결과.
    ja: 2度目の実験結果
  d_nikke_maxwell_mechanic_05_70:
    speaker: "<Narration>"
    en: '"..."'
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_71:
    speaker: "<Narration>"
    en: '"It''s difficult to admit this as a researcher,"'
    ko: 연구원으로서 쉽게 인정하기 어려운 결론이지만.
    ja: 研究者として、容易には受け入れがたい結論だが
  d_nikke_maxwell_mechanic_05_72:
    speaker: "<Narration>"
    en: '"but there are things in this world that science can''t prove."'
    ko: 이 세상에는 과학으로 증명하기 힘든 것들이 존재한다.
    ja: |-
      この世には科学で
      証明できない事象が存在する
  d_nikke_maxwell_mechanic_05_73:
    speaker: "<Narration>"
    en: '"They can''t be quantified with data"'
    ko: 데이터로 수치화할 수 없고.
    ja: それは、データとして数値化できず
  d_nikke_maxwell_mechanic_05_74:
    speaker: "<Narration>"
    en: '"or explained by any formula."'
    ko: 공식으로도 설명할 수 없는.
    ja: どんな法則でも説明のつかない
  d_nikke_maxwell_mechanic_05_75:
    speaker: "<Narration>"
    en: '"And yet, they undeniably exist."'
    ko: 그러나 분명히 존재하는 무언가.
    ja: しかし、確実に存在する何かだ
  d_nikke_maxwell_mechanic_05_76:
    speaker: "<Narration>"
    en: '"..."'
    ko: "……."
    ja: "……"
  d_nikke_maxwell_mechanic_05_77:
    speaker: "<Narration>"
    en: '"P.S."'
    ko: 덧붙여.
    ja: 追記
  d_nikke_maxwell_mechanic_05_78:
    speaker: "<Narration>"
    en: '"Still, it''s a researcher''s duty to prove them."'
    ko: 그러나 그것을 증명해 내는 것이 연구원의 본분.
    ja: だが、それを証明してみせるのが研究者の役目
  d_nikke_maxwell_mechanic_05_79:
    speaker: "<Narration>"
    en: '"In order to reduce the margin of error"'
    ko: 오차 범위를 줄이고.
    ja: 誤差の範囲を狭め
  d_nikke_maxwell_mechanic_05_80:
    speaker: "<Narration>"
    en: '"and reach a more definitive conclusion,"'
    ko: 보다 확실한 결론을 도출하기 위해.
    ja: より確かな結論を導き出すために
  d_nikke_maxwell_mechanic_05_81:
    speaker: "<Narration>"
    en: '"I recommend increasing the frequency of contact with the test subject."'
    ko: 실험 대상과의 접촉 빈도를 늘리는 것을 권고한다.
    ja: 実験対象との接触頻度を増やすことを推奨する
