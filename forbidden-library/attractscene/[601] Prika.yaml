---
d_nikke_prika_01:
  d_nikke_prika_01_1:
    speaker: "<Narration>"
    en: I lean back into the couch,
    ko: 스윽- 스윽-
    ja: スッ、スッ――
  d_nikke_prika_01_2:
    speaker: "<Monologue>"
    en: scrolling through my phone absentmindedly.
    ko: 소파에 기대 앉아 핸드폰을 본다.
    ja: ソファーに寄りかかり、携帯を見る
  d_nikke_prika_01_3:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_prika_01_4:
    speaker: "<Monologue>"
    en: I read through the comments, taking in how people are responding.
    ko: 화면을 스크롤하며 커뮤니티 반응을 살핀다.
    ja: |-
      画面をスクロールしながら、
      コミュニティの反応を確認する
  d_nikke_prika_01_5:
    speaker: "<Narration>"
    en: '"Do we really need Prika?"'
    ko: "[근데 프리카 빠져도 되지 않음?]"
    ja: "「プリカって脱退した方がよくね？」"
  d_nikke_prika_01_6:
    speaker: "<Narration>"
    en: My hand stills.
    ko: 멈칫.
    ja: ピタッ
  d_nikke_prika_01_7:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_01_8:
    speaker: "<Narration>"
    en: I tap my phone screen.
    ko: 톡.
    ja: タッ
  d_nikke_prika_01_9:
    speaker: "<Narration>"
    en: '"Tbh I feel like Mint alone can totally carry this lol."'
    ko: "[민트만 있어도 될 것 같은데 ㄹㅇ;;]"
    ja: "「ミントだけいれば十分な気が…」"
  d_nikke_prika_01_10:
    speaker: "<Narration>"
    en: '- "Highest pull rate! Fxj4KL213.tye"'
    ko: ㄴ[확률 최고 뽑기! Fxj4KL213.tye]
    ja: ㄴ高確率SSRガチャ！Fxj4KL213.tye
  d_nikke_prika_01_11:
    speaker: "<Narration>"
    en: '- "Totally man lol."'
    ko: ㄴ[ㄹㅇㅋㅋ]
    ja: ㄴマジそれなww
  d_nikke_prika_01_12:
    speaker: "<Narration>"
    en: '- "Comment deleted by user."'
    ko: ㄴ[작성자에 의해 삭제된 댓글입니다.]
    ja: |-
      ㄴこのコメントは作成者により
      　削除されました
  d_nikke_prika_01_13:
    speaker: "<Narration>"
    en: '- "Mint is waifu."'
    ko: ㄴ[민트 내 아내임]
    ja: ㄴミントは俺の嫁
  d_nikke_prika_01_14:
    speaker: "<Narration>"
    en: '- "Comment deleted by user."'
    ko: ㄴ[작성자에 의해 삭제된 댓글입니다.]
    ja: |-
      ㄴこのコメントは作成者により
      　削除されました
  d_nikke_prika_01_15:
    speaker: "<Narration>"
    en: '- "Yeah, true. They can just bring in songwriters anyway."'
    ko: ㄴ[글킨함. 노래야 소속사가 작곡가 붙여주면 되고.]
    ja: |-
      ㄴ確かにな。事務所が作曲家を雇えば
      　曲のほうも問題ないし
  d_nikke_prika_01_16:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_01_17:
    speaker: "<Monologue>"
    en: Before I even realize it, my fingers move to the comment box.
    ko: 나도 모르게 댓글 창에 손가락이 향한다.
    ja: |-
      私の指は無意識のうちに
      コメント欄に向かっていた
  d_nikke_prika_01_18:
    speaker: "<Narration>"
    en: "*Tap, tap, tap*"
    ko: 토도도독-
    ja: トトトトッ…
  d_nikke_prika_01_19:
    speaker: "<Monologue>"
    en: I keep my emotions firmly in check
    ko: 최대한 감정을 억누르며.
    ja: なるべく感情を抑え、
  d_nikke_prika_01_20:
    speaker: "<Monologue>"
    en: as I type out what I believe is a logical, rational comment, then hit post.
    ko: 논리적이고 이성적으로 댓글을 작성해 등록한다.
    ja: |-
      論理的かつ理性的な文章で
      コメントを作成し、投稿した
  d_nikke_prika_01_21:
    speaker: "<Self>"
    en: Phew...
    ko: 후우.
    ja: ふぅ…
  d_nikke_prika_01_22:
    speaker: "<Monologue>"
    en: Surely they've come to their senses by now...
    ko: 이 정도면 정신을 차렸겠….
    ja: |-
      これだけ言ってやれば
      こいつらも目を覚ますはず…
  d_nikke_prika_01_23:
    speaker: "<Narration>"
    en: "*Bzzz*"
    ko: 지잉-
    ja: ブブブ…
  d_nikke_prika_01_24:
    speaker: "<Narration>"
    en: '"Notification: You have a reply."'
    ko: "[알림 : 대댓글이 달렸습니다.]"
    ja: |-
      「お知らせ：あなたのコメントに
      返信があります」
  d_nikke_prika_01_25:
    speaker: "<Narration>"
    en: '- "Dumbass."'
    ko: ㄴ[ㅄ]
    ja: ㄴ頭イカれてんな
  d_nikke_prika_01_26:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  d_nikke_prika_01_27:
    speaker: "<Monologue>"
    en: Fury overtakes me.
    ko: 머리에 열이 확 오른다.
    ja: 頭に血がのぼった
  d_nikke_prika_01_28:
    speaker: "<Narration>"
    en: "*Tap, tap, tap, tap, tap*"
    ko: 토도도도도도독-
    ja: トトトトトトッ…
  d_nikke_prika_01_29:
    speaker: "<Monologue>"
    en: My fingers dance across the screen.
    ko: 손가락이 액정 위에서 춤을 춘다.
    ja: 液晶の上で指が激しく踊る
  d_nikke_prika_01_30:
    speaker: "<Monologue>"
    en: I finish typing a long comment, and just as my hand moves toward the Reply
      button...
    ko: 장문의 댓글을 작성하고, 등록 버튼을 누르려는 순간….
    ja: |-
      コメント欄に長文を打ち込み
      投稿ボタンを押そうとしたその時…
  d_nikke_prika_01_31:
    speaker: prika
    en: What are you doing?
    ko: 뭐해?
    ja: 何してるんだ？
  d_nikke_prika_01_32:
    speaker: "<Self>"
    en: Uh, I...
    ko: 어, 그게….
    ja: えっと、その…
  d_nikke_prika_01_33:
    speaker: "<Monologue>"
    en: Before I know it, Prika's beside me, peering at my phone screen.
    ko: 어느새 옆에 다가온 프리카가 핸드폰 화면을 본다.
    ja: |-
      いつの間にか隣に来ていたプリカが
      私の携帯画面を覗き込んだ
  d_nikke_prika_01_34:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_01_35:
    speaker: "<Monologue>"
    en: Her eyes skim through the comments.
    ko: 프리카의 눈동자가 댓글을 훑는다.
    ja: プリカの目がコメントの文字を追う
  d_nikke_prika_01_36:
    speaker: prika
    en: Scroll up.
    ko: 올려봐.
    ja: 携帯貸して。
  d_nikke_prika_01_37:
    speaker: "<Self>"
    en: Huh?
    ko: "…응?"
    ja: "…えっ？"
  d_nikke_prika_01_38:
    speaker: prika
    en: Show me the post you were about to comment on.
    ko: 지금 댓글 달려고 한 글 내용. 보여줘.
    ja: |-
      今コメントしようとした書き込み、
      見せてくれ。
  d_nikke_prika_01_39:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_01_40:
    speaker: "<Narration>"
    en: I swipe upward
    ko: 스윽-
    ja: スッ――
  d_nikke_prika_01_41:
    speaker: "<Monologue>"
    en: and the post comes into view.
    ko: 화면을 스크롤해, 본문 내용을 보여준다.
    ja: |-
      画面をスクロールし、
      書き込みの内容を見せた
  d_nikke_prika_01_42:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_01_43:
    speaker: "<Self>"
    en: I was just...
    ko: 나는 그냥….
    ja: 私はただ…
  d_nikke_prika_01_44:
    speaker: prika
    en: I know. You were trying to stand up for me.
    ko: 알아. 편들어 준 거.
    ja: |-
      分かってる。
      味方になってくれたんだろ。
  d_nikke_prika_01_45:
    speaker: prika
    en: But do you really have to leave comments like that?
    ko: 그렇다고 그렇게 댓글을 다는 거야?
    ja: だからって、ここまで書く必要あるか？
  d_nikke_prika_01_46:
    speaker: "<Self>"
    en: Doesn't that piss you off...?
    ko: 아니, 열받잖아….
    ja: でも、腹が立つじゃないか…
  d_nikke_prika_01_47:
    speaker: prika
    en: I'm fine. I don't care what they think.
    ko: 나는 괜찮아. 신경 안 써.
    ja: 私なら平気だ。気にしないから。
  d_nikke_prika_01_48:
    speaker: "<Monologue>"
    en: Prika takes my phone from my hand.
    ko: 프리카가 내 손에서 핸드폰을 가져간다.
    ja: プリカは私の手から携帯を取り上げた
  d_nikke_prika_01_49:
    speaker: prika
    en: Enough about that.
    ko: 그건 됐고.
    ja: そんなことより…
  d_nikke_prika_01_50:
    speaker: prika
    en: I'm ready now, so have a listen.
    ko: 준비 다 됐으니까 이제 들어봐.
    ja: 準備ができたから、聞いてほしい。
  d_nikke_prika_01_51:
    speaker: "<Self>"
    en: Oh, is this your new song?
    ko: 아. 신곡이랬지?
    ja: あぁ、新曲を作ったと言っていたな
  d_nikke_prika_01_52:
    speaker: "<Monologue>"
    en: I get up from the couch.
    ko: 소파에서 몸을 일으킨다.
    ja: 私はソファーから体を起こした
  d_nikke_prika_01_53:
    speaker: prika
    en: Yeah, it's still just a rough draft, though.
    ko: 응. 아직 러프 단계기는 하지만.
    ja: ああ。まだラフの段階だけどな。
  d_nikke_prika_01_54:
    speaker: "<Self>"
    en: Wait... I thought you hadn't started working on the next album yet?
    ko: 어… 그런데 앨범 작업은 아직 시작 안 한 거 아니었어?
    ja: |-
      まだアルバムの作業には
      まだ取り掛かっていないんじゃ
      なかったか？
  d_nikke_prika_01_55:
    speaker: prika
    en: It's not a full album. I'm thinking about releasing a digital single.
    ko: 정규 앨범은 아니고, 디지털 싱글을 내볼까 해서.
    ja: |-
      フルアルバムじゃなくて、
      デジタルシングルを出そうと
      思ってるんだ。
  d_nikke_prika_01_56:
    speaker: prika
    en: My... solo song.
    ko: 내… 솔로곡.
    ja: 私の…ソロ曲を。
  d_nikke_prika_01_57:
    speaker: "<Self>"
    en: Really? What about Mint?
    ko: 응? 민트는?
    ja: ん？ミントは？
  d_nikke_prika_01_58:
    speaker: prika
    en: She said it's a hassle, so she's sitting this one out.
    ko: 귀찮다고 쉰대.
    ja: 面倒だからいいってさ。
  d_nikke_prika_01_59:
    speaker: "<Self>"
    en: Haha, I see...
    ko: 하하….
    ja: はは…
  d_nikke_prika_01_60:
    speaker: "<Monologue>"
    en: Prika sits down and fiddles with some settings,
    ko: 프리카가 자리에 앉아, 이것저것 세팅을 한다.
    ja: |-
      プリカは椅子に座り、
      セッティングをし始めた
  d_nikke_prika_01_61:
    speaker: "<Monologue>"
    en: then she places her hands on the synthesizer.
    ko: 그리고, 신디사이저에 손을 얹는다.
    ja: そして、シンセサイザーに手を乗せた
  d_nikke_prika_01_62:
    speaker: "<Self>"
    en: You're going to play it yourself?
    ko: 직접 연주하게?
    ja: 今ここで演奏するのか？
  d_nikke_prika_01_63:
    speaker: prika
    en: Yeah.
    ko: 응.
    ja: ああ。
  d_nikke_prika_01_64:
    speaker: "<Monologue>"
    en: A melody spills from the speakers
    ko: 곧, 스피커에서 멜로디가 흘러나오고.
    ja: やがて、スピーカーからメロディーが流れ出し
  d_nikke_prika_01_65:
    speaker: "<Monologue>"
    en: as her slender fingers glide across the keys.
    ko: 가는 손가락이 건반 위를 움직인다.
    ja: ほっそりとした指が鍵盤の上を軽やかに舞った
  d_nikke_prika_01_66:
    speaker: prika
    en: I think it'll come across better this way.
    ko: 그게 좀 더, 잘 전해질 것 같아.
    ja: その方が、伝わる気がするから。
d_nikke_prika_02:
  d_nikke_prika_02_1:
    speaker: "<Monologue>"
    en: Prika takes her hands off the keys and turns to me.
    ko: 프리카가 건반에서 손을 떼고 내게 몸을 돌린다.
    ja: プリカが鍵盤から手を離し、私の方に顔を向けた
  d_nikke_prika_02_2:
    speaker: prika
    en: What do you think?
    ko: 어땠어?
    ja: どうだった？
  d_nikke_prika_02_3:
    speaker: "<Self>"
    en: Hmm... How should I put it...?
    ko: 음… 뭐랄까….
    ja: うーん…なんというか…
  d_nikke_prika_02_4:
    speaker: "<Monologue>"
    en: I weigh my words carefully.
    ko: 고민하며 신중하게 말을 고른다.
    ja: 悩みながら、慎重に言葉を選んだ
  d_nikke_prika_02_5:
    speaker: "<Self>"
    en: It sounds a little... different from the music you usually make.
    ko: 지금까지 듣던 프리카의 음악이랑 조금… 다른 것 같아.
    ja: 今までのプリカの音楽とは…少し違う気がした
  d_nikke_prika_02_6:
    speaker: prika
    en: Really? How so?
    ko: 그래? 어떤 점이?
    ja: そうか？どういうところが？
  d_nikke_prika_02_7:
    speaker: "<Self>"
    en: Um...
    ko: 으, 으음….
    ja: そ、そうだな…
  d_nikke_prika_02_8:
    speaker: "<Monologue>"
    en: I desperately rack my brain for the right words.
    ko: 필사적으로 표현할 방법을 찾는다.
    ja: 言葉を頭の中で必死に探す
  d_nikke_prika_02_9:
    speaker: "<Self>"
    en: I mean... Uh...
    ko: 그러니까… 어….
    ja: つまり…その…
  d_nikke_prika_02_10:
    speaker: "<Self>"
    en: Maybe it's just because I'm so used to hearing you sing with Mint, and before
      that with Anis too...
    ko: 원래 민트랑, 그리고 전에는 아니스까지 같이 부르던 거에 익숙해서 그런 걸 수도 있는데.
    ja: |-
      ミントやアニスと一緒に
      歌っていた時の曲に慣れているから
      そう感じるのかもしれないが
  d_nikke_prika_02_11:
    speaker: "<Self>"
    en: but something about the pacing feels different. Like... the flow, maybe?
    ko: 멜로디의… 간격? 호흡?
    ja: メロディーの…間隔？息遣い？
  d_nikke_prika_02_12:
    speaker: "<Self>"
    en: I can't really put my finger on it.
    ko: 뭐 그런 게 약간 신경 쓰인다고 해야 하나.
    ja: そういうものが、若干気になったというか…
  d_nikke_prika_02_13:
    speaker: "<Self>"
    en: "... It feels a little different from the hidden track on your last album."
    ko: "…저번 앨범, 히든 트랙하고도 조금 다른 느낌이야."
    ja: |-
      …以前のアルバムの隠しトラックとも
      少し違った感じがした
  d_nikke_prika_02_14:
    speaker: prika
    en: Right.
    ko: 그렇구나.
    ja: そうか。
  d_nikke_prika_02_15:
    speaker: "<Self>"
    en: I'm sorry...
    ko: "…미안."
    ja: "…すまない"
  d_nikke_prika_02_16:
    speaker: prika
    en: Huh? Why are you apologizing all of a sudden?
    ko: 응? 갑자기 왜 사과해?
    ja: ん？どうして謝るんだ？
  d_nikke_prika_02_17:
    speaker: "<Self>"
    en: Well...
    ko: 그게….
    ja: それは…
  d_nikke_prika_02_18:
    speaker: "<Self>"
    en: I figured being told you've changed probably isn't the kind of thing a creative
      person wants to hear.
    ko: |-
      …달라졌다는 말은,
      창작하는 사람한테는 조금 안 좋은 평가가 아닐까 해서.
    ja: |-
      …今までと違うというのは
      アーティストにとって批判的な言葉に
      聞こえるかもしれないと思って
  d_nikke_prika_02_19:
    speaker: prika
    en: Well... Usually, that's true...
    ko: 뭐… 일반적으로는 그렇지만….
    ja: まあ…一般的にはそうかもしれないが…
  d_nikke_prika_02_20:
    speaker: "<Monologue>"
    en: Prika shifts her gaze to the monitor.
    ko: 프리카가 모니터에 시선을 준다.
    ja: プリカはモニターに視線を移した
  d_nikke_prika_02_21:
    speaker: prika
    en: I was trying to do something different this time.
    ko: 이번엔 다른 걸 해보려고 한 거니까.
    ja: |-
      今回は今までとは違う曲を
      作ってみようと思ってるんだ。
  d_nikke_prika_02_22:
    speaker: prika
    en: Honestly, if people said it sounded too much like my earlier work, I'd be
      disappointed in myself.
    ko: |-
      오히려 이전이랑 비슷하다는 얘기를 들었으면,
      스스로에게 실망했겠지.
    ja: |-
      だから、もし今まで通りだって言われてたら
      むしろ自分にガッカリしてたかもな。
  d_nikke_prika_02_23:
    speaker: "<Monologue>"
    en: Prika stares at the monitor for a while before suddenly speaking up.
    ko: 한동안 모니터를 바라보고 있던 프리카가 문득 입을 열었다.
    ja: |-
      プリカは、しばらくモニターを見つめ、
      おもむろに口を開いた
  d_nikke_prika_02_24:
    speaker: prika
    en: "... It's a love song."
    ko: "…사랑 노래야."
    ja: "…ラブソングにしようと思ってる。"
  d_nikke_prika_02_25:
    speaker: "<Self>"
    en: A love song?
    ko: 사랑 노래?
    ja: ラブソング？
  d_nikke_prika_02_26:
    speaker: prika
    en: Yeah,
    ko: 응.
    ja: ああ。
  d_nikke_prika_02_27:
    speaker: prika
    en: but that kind of thing just isn't really me.
    ko: 나는 아무래도 그런 쪽이랑은 거리가 있으니까.
    ja: 私はそういう感じとは程遠いタイプだからさ。
  d_nikke_prika_02_28:
    speaker: "<Monologue>"
    en: Prika looks at a poster of Mint hanging on the studio wall.
    ko: 프리카가 작업실 한편에 붙어 있는, 민트의 포스터를 바라본다.
    ja: |-
      プリカはスタジオの片隅に貼られている
      ミントのポスターを見つめた
  d_nikke_prika_02_29:
    speaker: prika
    en: I'm not exactly cute or affectionate,
    ko: 사랑스럽거나, 애교가 있지는 않잖아, 나는.
    ja: |-
      可愛いとか愛嬌とかとは
      無縁な感じだろ？
  d_nikke_prika_02_30:
    speaker: prika
    en: but I still... wanted to try it.
    ko: 그래서 조금… 해보고 싶어졌어.
    ja: だから…ちょっと挑戦してみたくなったんだ。
  d_nikke_prika_02_31:
    speaker: "<Monologue>"
    en: Prika shows me an empty notebook.
    ko: 프리카가 텅 빈 노트를 보여준다.
    ja: そう言うと、プリカは白紙のノートを見せた
  d_nikke_prika_02_32:
    speaker: prika
    en: 'But then I hit a wall on the most important part: the lyrics.'
    ko: 정작 제일 중요한 가사에서 막혀 버렸지만.
    ja: |-
      肝心の作詞の時点で、
      すでに行き詰まってるけどな。
  d_nikke_prika_02_33:
    speaker: "<Self>"
    en: The lyrics...?
    ko: 가사….
    ja: 歌詞か…
  d_nikke_prika_02_34:
    speaker: prika
    en: Of course, the emotion in the melody matters too,
    ko: 당연히 멜로디에 담긴 정서도 중요하지만,
    ja: |-
      もちろんメロディーに込められた
      感情も大事だけど、
  d_nikke_prika_02_35:
    speaker: prika
    en: but the lyrics are what actually convey the meaning,
    ko: 직접적으로 의미를 전달하는 건 가사잖아.
    ja: |-
      曲が表現したいことを
      ダイレクトに伝えられるのは、
      やっぱり歌詞だろ？
  d_nikke_prika_02_36:
    speaker: prika
    en: especially since this is... a love song.
    ko: 특히 이건… 사랑 노래니까.
    ja: 特にこれは…ラブソングだしさ。
  d_nikke_prika_02_37:
    speaker: "<Monologue>"
    en: Prika slides the notebook toward me.
    ko: 프리카가 책상 위로 노트를 밀어준다.
    ja: プリカはノートを机の上に置いた
  d_nikke_prika_02_38:
    speaker: prika
    en: So I need some inspiration, Muse.
    ko: 그러니까. 나한테 영감을 줘, 뮤즈.
    ja: |-
      だから、ミューズ。
      インスピレーションをくれ。
  d_nikke_prika_02_39:
    speaker: "<Self>"
    en: Huh? S-so suddenly?
    ko: 가, 갑자기?
    ja: きゅ、急に…？
  d_nikke_prika_02_40:
    speaker: prika
    en: These things usually happen when you least expect them.
    ko: 원래 그런 건 갑자기 찾아오는 법이야.
    ja: |-
      こういうアイデアって、
      いきなり舞い降りてくるものなんだ。
  d_nikke_prika_02_41:
    speaker: "<Self>"
    en: I guess...
    ko: 어….
    ja: うーん…
  d_nikke_prika_02_42:
    speaker: "<Monologue>"
    en: I pick up a pen and stare down at the blank page.
    ko: 일단 펜을 쥐고, 텅 빈 노트를 내려다본다.
    ja: |-
      私はひとまずペンを握り、
      白紙のノートを見つめた
  d_nikke_prika_02_43:
    speaker: "<Self>"
    en: There's something about the blank page... It just feels so...
    ko: 뭔가… 이렇게 백지니까 엄청….
    ja: なんだか…白紙だからか余計に…
  d_nikke_prika_02_44:
    speaker: prika
    en: Pretty daunting, huh?
    ko: 막막하지?
    ja: 思いつかないだろ？
  d_nikke_prika_02_45:
    speaker: "<Monologue>"
    en: Prika takes out another pen and writes her name on the page.
    ko: 프리카가 다른 펜을 꺼내, 노트에 자신의 이름을 적는다.
    ja: |-
      プリカは別のペンを手に取ると、
      ノートに自分の名前を書いた
  d_nikke_prika_02_46:
    speaker: "<Narration>"
    en: '"Prika"'
    ko: "[PRIKA]"
    ja: "「PRIKA」"
  d_nikke_prika_02_47:
    speaker: prika
    en: That's why you should just write something first.
    ko: 그래서 일단 뭐라도 적어보는 게 중요해.
    ja: 何でもいいから、何か書くことが大事なんだ。
  d_nikke_prika_02_48:
    speaker: prika
    en: Anything that comes to mind.
    ko: 생각나는 대로, 아무거나.
    ja: 思いつくままに、何でも。
  d_nikke_prika_02_49:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_prika_02_50:
    speaker: "<Monologue>"
    en: 'I pause for a moment, then jot down a couple of words in my notebook:'
    ko: 잠시 고민하다가, 노트에 단어를 적는다.
    ja: 私はしばらく悩んでから、ノートに単語を書いた
  d_nikke_prika_02_51:
    speaker: "<Narration>"
    en: '"Love Song" and "Lyrics."'
    ko: "[사랑 노래], [가사]."
    ja: "「ラブソング」、「歌詞」"
  d_nikke_prika_02_52:
    speaker: prika
    en: Yeah, that's it.
    ko: 응. 그렇게.
    ja: そうそう。そうやって。
  d_nikke_prika_02_53:
    speaker: prika
    en: Now just write down whatever comes to mind.
    ko: 그리고 또, 거기서 생각나는 것들을 적어보는 거야.
    ja: |-
      そこから思いついた言葉を
      また書いていくんだ。
  d_nikke_prika_02_54:
    speaker: "<Monologue>"
    en: Next to the words I wrote, Prika adds, "Sweetness."
    ko: 프리카가 내가 적은 단어 옆에, [달콤함]이라고 적는다.
    ja: |-
      プリカは私が書いた単語の横に
      「甘い」と書いた
  d_nikke_prika_02_55:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_prika_02_56:
    speaker: "<Monologue>"
    en: Pens in hand, we start jotting down whatever words come to mind
    ko: 펜을 쥐고, 빈 노트 위에 이것저것.
    ja: ペンを握ったまま、真っ白なノートへ
  d_nikke_prika_02_57:
    speaker: "<Monologue>"
    en: across the blank page.
    ko: 떠오르는 단어들을 적어 나간다.
    ja: 思いつくままに単語を書き連ねていく
  d_nikke_prika_02_58:
    speaker: prika
    en: Once we've got enough down like this...
    ko: 그렇게 어느 정도 적었으면….
    ja: こんな感じで、ある程度書けたら…
  d_nikke_prika_02_59:
    speaker: "<Monologue>"
    en: Prika points at the jumble of words scrawled across the page.
    ko: 프리카가 노트 위에 어지러이 적힌 단어들을 가리킨다.
    ja: プリカはノートに書かれた単語を指さした
  d_nikke_prika_02_60:
    speaker: prika
    en: Now we start brainstorming.
    ko: 이제 생각해 보는 거지.
    ja: 今度はこれをもとに考えていく。
  d_nikke_prika_02_61:
    speaker: "<Self>"
    en: Got it...
    ko: "…알았어."
    ja: "…分かった"
  d_nikke_prika_02_62:
    speaker: "<Monologue>"
    en: After several minutes of staring at the notebook,
    ko: 그렇게 노트와 눈싸움 하기를 몇 분.
    ja: そうしてノートとにらめっこをすること数分
  d_nikke_prika_02_63:
    speaker: "<Monologue>"
    en: 'two words jump out at me: "Prika" and "sweetness."'
    ko: 수많은 단어들 중, [PRIKA]와 [달콤함]이 눈에 들어온다.
    ja: |-
      数々の単語の中から、
      「PRIKA」と「甘い」が目に入った
  d_nikke_prika_02_64:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_02_65:
    speaker: "<Monologue>"
    en: I pick up my pen and add a "Pa" to Prika's name.
    ko: 펜을 들어, 프리카의 이름 앞에 [PA]를 추가한다.
    ja: |-
      ペンを握り、プリカの名前の先頭に
      「PA」という文字を追加する
  d_nikke_prika_02_66:
    speaker: "<Self>"
    en: "... You know that old nursery rhyme?"
    ko: "…그거 있잖아. 옛날 동화였나."
    ja: その…昔の童謡だったか…
  d_nikke_prika_02_67:
    speaker: "<Self>"
    en: Little girls are made of sugar and spice, and...
    ko: 여자아이는 설탕과 향신료, 그리고….
    ja: 女の子はお砂糖とスパイスと…
  d_nikke_prika_02_68:
    speaker: prika
    en: All that's nice.
    ko: 온갖 근사한 것들로 만들어져 있다.
    ja: 素敵な何かでできている。
  d_nikke_prika_02_69:
    speaker: "<Self>"
    en: You know it?
    ko: 알고 있어?
    ja: 知っているのか？
  d_nikke_prika_02_70:
    speaker: prika
    en: Yeah, it helps with writing lyrics too.
    ko: 응. 가사를 쓰는 데도 그렇고.
    ja: ああ。歌詞を書くにしても、
  d_nikke_prika_02_71:
    speaker: prika
    en: Same with composing. The more stuff you know, the better.
    ko: 곡을 만드는 데도, 이런저런 거 많이 알면 좋으니까.
    ja: |-
      曲を作るにしても、
      色々な知識を取り入れることは
      大事だからな。
  d_nikke_prika_02_72:
    speaker: "<Monologue>"
    en: Prika picks up her pen again.
    ko: 프리카가 펜을 집어든다.
    ja: プリカはペンを手に取った
  d_nikke_prika_02_73:
    speaker: prika
    en: "... I think that's a good starting point."
    ko: "…괜찮은 접근인 것 같아."
    ja: "…なかなかいいアプローチだ。"
  d_nikke_prika_02_74:
    speaker: prika
    en: Hmm... Sugar and spice...
    ko: 음… 설탕과 향신료라….
    ja: うーん…砂糖とスパイスか…
  d_nikke_prika_02_75:
    speaker: prika
    en: I get the spice part, but sugar...?
    ko: 향신료는 알겠는데, 설탕은….
    ja: スパイスは分かるが、砂糖っていうのは…
  d_nikke_prika_02_76:
    speaker: "<Self>"
    en: What about it?
    ko: 왜?
    ja: どうした？
  d_nikke_prika_02_77:
    speaker: prika
    en: What do you mean?
    ko: 왜냐니. 그야….
    ja: いや…
  d_nikke_prika_02_78:
    speaker: prika
    en: It's because... sugar's sweet.
    ko: 그야, 설탕은 달콤하잖아.
    ja: だって、砂糖って甘いだろ？
  d_nikke_prika_02_79:
    speaker: "<Monologue>"
    en: Prika slowly traces over the word "sweetness."
    ko: 프리카가 [달콤함]이라는 단어를 천천히 덧쓴다.
    ja: |-
      プリカは「甘い」という文字を
      ゆっくりとペンでなぞった
  d_nikke_prika_02_80:
    speaker: "<Self>"
    en: But you know...
    ko: "…근데 말이야."
    ja: "…だが…"
  d_nikke_prika_02_81:
    speaker: prika
    en: Yeah?
    ko: 응.
    ja: ん？
  d_nikke_prika_02_82:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_02_83:
    speaker: "<Self>"
    en: Bell peppers, also called paprikas, are actually a little sweet.
    ko: 파프리카는, 은근히 달아.
    ja: パプリカは、意外と甘いぞ
  d_nikke_prika_02_84:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_02_85:
    speaker: prika
    en: Huh?
    ko: "…응?"
    ja: "…えっ？"
  d_nikke_prika_02_86:
    speaker: "<Self>"
    en: You've never tried it before?
    ko: 한 번도 안 먹어 봤어?
    ja: 一度も食べたことがないのか？
  d_nikke_prika_02_87:
    speaker: prika
    en: Uh, yeah...
    ko: 아, 응….
    ja: あ、ああ…
  d_nikke_prika_02_88:
    speaker: prika
    en: I never really thought to try it...
    ko: 그럴 생각을 못해봤던 것… 같아.
    ja: 食べようなんて、思ったことも…なかったな。
  d_nikke_prika_02_89:
    speaker: "<Self>"
    en: Just a sec.
    ko: 잠깐만 기다려봐.
    ja: ちょっと待っていてくれ
  d_nikke_prika_02_90:
    speaker: prika
    en: Huh? Muse?
    ko: 어? 뮤즈?
    ja: えっ？ミューズ？
  d_nikke_prika_02_91:
    speaker: "<Monologue>"
    en: I grab my coat and head out of the studio.
    ko: 겉옷을 집어들고, 작업실을 나섰다.
    ja: 私は上着をつかみ、スタジオを後にした
d_nikke_prika_03:
  d_nikke_prika_03_1:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_prika_03_2:
    speaker: "<Monologue>"
    en: I return to the studio with some exceptionally fresh, top-grade paprika, thanks
      to Crust.
    ko: |-
      크러스트에게 부탁해서,
      아주 신선하고 품질 좋은 파프리카를 구해왔다.
    ja: |-
      クラストに頼み、
      採れたての新鮮なパプリカを手に入れて
      スタジオに戻った
  d_nikke_prika_03_3:
    speaker: "<Self>"
    en: Here.
    ko: 자.
    ja: これを
  d_nikke_prika_03_4:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_03_5:
    speaker: prika
    en: You really are full of surprises, Muse.
    ko: "…정말 알수록 신기하네, 뮤즈는."
    ja: |-
      …ホント、知れば知るほど
      不思議な人だな、ミューズは。
  d_nikke_prika_03_6:
    speaker: prika
    en: Where'd you even get something like this?
    ko: 갑자기 이런 걸 어디서 구해온 거야?
    ja: どこで手に入れたんだ？
  d_nikke_prika_03_7:
    speaker: "<Self>"
    en: I've got my ways.
    ko: 다 방법이 있지.
    ja: 色々と伝手があるんだ
  d_nikke_prika_03_8:
    speaker: "<Self>"
    en: Go on, try it.
    ko: 어서 먹어봐.
    ja: とにかく、食べてみてくれ
  d_nikke_prika_03_9:
    speaker: prika
    en: Sure, but...
    ko: 응. 그런데….
    ja: ああ。ところで…
  d_nikke_prika_03_10:
    speaker: prika
    en: do you just eat this as-is?
    ko: "…이거, 생으로 그냥 먹는 거야?"
    ja: これって…生で食べられるのか？
  d_nikke_prika_03_11:
    speaker: "<Self>"
    en: Uh... Hang on a sec.
    ko: 어… 잠깐만.
    ja: ああ…少し待ってくれ
  d_nikke_prika_03_12:
    speaker: "<Monologue>"
    en: I quickly look up how to eat paprika.
    ko: 급히 [파프리카 먹는 법]이라고 검색한다.
    ja: 急いで「パプリカの食べ方」と検索した
  d_nikke_prika_03_13:
    speaker: "<Narration>"
    en: 'Fun fact: They''re sweet and delicious even when eaten raw!'
    ko: "[리빙 포인트 : 파프리카는 그냥 먹어도 달고 맛있다!]"
    ja: |-
      「暮らしの知恵：パプリカは生で食べても
      甘くておいしい野菜です！」
  d_nikke_prika_03_14:
    speaker: "<Self>"
    en: "... Apparently, you can just eat it as is."
    ko: "…그냥 먹어도 괜찮대."
    ja: "…生で食べられるみたいだ"
  d_nikke_prika_03_15:
    speaker: prika
    en: Really?
    ko: "…진짜?"
    ja: "…ホントか？"
  d_nikke_prika_03_16:
    speaker: "<Self>"
    en: I guess...?
    ko: 아마… 도?
    ja: おそ…らく？
  d_nikke_prika_03_17:
    speaker: "<Self>"
    en: I've never actually eaten it on its own before either.
    ko: 나도 그냥 먹어본 적은 없어서.
    ja: 私も生では食べたことがないんだ
  d_nikke_prika_03_18:
    speaker: "<Monologue>"
    en: Prika lets out a faint snort of laughter and picks up the paprika.
    ko: 프리카가 피식 웃으며 파프리카를 집어들었다.
    ja: プリカはクスッと笑うと、パプリカを手に取った
  d_nikke_prika_03_19:
    speaker: prika
    en: I'll trust you, Muse.
    ko: 믿을게. 뮤즈가 하는 말이니까.
    ja: ミューズがそう言うんだ、信じるよ。
  d_nikke_prika_03_20:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 아삭-
    ja: シャキッ――
  d_nikke_prika_03_21:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_03_22:
    speaker: prika
    en: It's sweet.
    ko: "…달콤해."
    ja: "…甘い。"
  d_nikke_prika_03_23:
    speaker: "<Self>"
    en: Right?
    ko: 그치?
    ja: だろう？
  d_nikke_prika_03_24:
    speaker: prika
    en: Here, Muse. Give it a try.
    ko: 자, 뮤즈도. 맛 봐봐.
    ja: ほら、ミューズも。食べてみな。
  d_nikke_prika_03_25:
    speaker: "<Monologue>"
    en: I pick up the paprika Prika took a bite out of.
    ko: 프리카가 한 입 먹은 파프리카를 집어든다.
    ja: |-
      私はプリカが一口かじった
      パプリカを手に取った
  d_nikke_prika_03_26:
    speaker: prika
    en: Oh, that's...!
    ko: 앗, 그건…!
    ja: あっ、それは…！
  d_nikke_prika_03_27:
    speaker: "<Narration>"
    en: "*Crunch*"
    ko: 아삭-
    ja: シャキッ――
  d_nikke_prika_03_28:
    speaker: "<Self>"
    en: Mmm, it really is sweet.
    ko: 음. 확실히 달콤하네.
    ja: ああ、確かに甘いな
  d_nikke_prika_03_29:
    speaker: prika
    en: But I already took a bite out of that one...
    ko: "…내가 먹던 거잖아, 그거."
    ja: "…それ、私の食べかけだろ。"
  d_nikke_prika_03_30:
    speaker: "<Self>"
    en: So what?
    ko: 뭐 어때.
    ja: まあ、いいじゃないか
  d_nikke_prika_03_31:
    speaker: "<Monologue>"
    en: I defiantly wolf down the rest of the paprika.
    ko: 보란 듯이 파프리카를 우걱우걱 먹어 치운다.
    ja: |-
      私は見せつけるように、
      パプリカをむしゃむしゃと平らげた
  d_nikke_prika_03_32:
    speaker: prika
    en: You're unbelievable.
    ko: 못 말려.
    ja: まったく。
  d_nikke_prika_03_33:
    speaker: "<Monologue>"
    en: Prika picks up another paprika and takes a bite out of it.
    ko: 프리카도 다른 파프리카를 집어 들어, 다시 한 입 베어 문다.
    ja: |-
      プリカも別のパプリカを手に取り、
      一口かじった
  d_nikke_prika_03_34:
    speaker: prika
    en: "... I had no idea"
    ko: "…그렇구나. 파프리카는 달콤한 거였네."
    ja: "…パプリカって、こんなに甘かったんだな。"
  d_nikke_prika_03_35:
    speaker: prika
    en: paprikas could be this sweet.
    ko: 지금까지 전혀 몰랐어.
    ja: まったく知らなかった。
  d_nikke_prika_03_36:
    speaker: "<Self>"
    en: Huh, really?
    ko: 그래?
    ja: そうか
  d_nikke_prika_03_37:
    speaker: prika
    en: Yeah.
    ko: 응.
    ja: ああ。
  d_nikke_prika_03_38:
    speaker: "<Monologue>"
    en: Prika looks around the studio.
    ko: 프리카가 작업실을 둘러본다.
    ja: プリカはスタジオを見回した
  d_nikke_prika_03_39:
    speaker: prika
    en: My world isn't all that big.
    ko: 내 세계는 그렇게 넓지 않으니까.
    ja: 私の世界はそんなに広くないから。
  d_nikke_prika_03_40:
    speaker: "<Self>"
    en: At least you now know
    ko: 이제라도 알았잖아?
    ja: だが今、知ることができたじゃないか
  d_nikke_prika_03_41:
    speaker: "<Self>"
    en: paprikas are sweet.
    ko: 파프리카도 달콤하다는 걸.
    ja: パプリカも甘いってことを
  d_nikke_prika_03_42:
    speaker: prika
    en: Yeah...
    ko: "…그러게."
    ja: "…そうだな。"
  d_nikke_prika_03_43:
    speaker: "<Monologue>"
    en: Prika studies the notebook for a brief moment before reaching for her pen.
    ko: 잠시 노트를 내려다보던 프리카가 펜을 잡는다.
    ja: |-
      しばらくノートを見つめていたプリカが
      ペンを握った
  d_nikke_prika_03_44:
    speaker: "<Monologue>"
    en: Then...
    ko: 그리고….
    ja: そして…
  d_nikke_prika_03_45:
    speaker: "<Narration>"
    en: "*Scribble, scribble*"
    ko: 사각- 사각-
    ja: サラ、サラ…
  d_nikke_prika_03_46:
    speaker: "<Monologue>"
    en: Where words once crowded the page,
    ko: 단어들로 가득했던 노트에, 천천히.
    ja: 数々の単語が散らばったノートに
  d_nikke_prika_03_47:
    speaker: "<Monologue>"
    en: sentences slowly begin to take shape, one by one.
    ko: 문장들이 자리잡는다.
    ja: ゆっくりと文章が生まれていった
  d_nikke_prika_03_48:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_03_49:
    speaker: "<Monologue>"
    en: Watching Prika slip into her own world in an instant, I quietly sit down on
      the couch...
    ko: |-
      순식간에 자신의 세계로 빠져드는 프리카를 보며,
      조용히 소파에 앉아서….
    ja: |-
      一瞬で自分の世界に入り込んだプリカを横目に、
      私はそっとソファーに座り…
  d_nikke_prika_03_50:
    speaker: "<Narration>"
    en: "*Swish*"
    ko: 스윽.
    ja: スッ…
  d_nikke_prika_03_51:
    speaker: "<Monologue>"
    en: "... and take out my phone."
    ko: "…핸드폰을 꺼낸다."
    ja: "…携帯を取り出した"
  d_nikke_prika_03_52:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_03_53:
    speaker: "<Monologue>"
    en: There'd better not be anyone else posting nasty comments.
    ko: "…또 악플을 다는 녀석은 없겠지?"
    ja: |-
      …誹謗中傷を書き込んでる奴は
      もういないよな？
  d_nikke_prika_03_54:
    speaker: "<Monologue>"
    en: A little while later,
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_prika_03_55:
    speaker: "<Monologue>"
    en: I look up from my phone when I hear Prika set her pen down.
    ko: 프리카가 펜을 내려놓는 소리에, 핸드폰에서 시선을 뗐다.
    ja: |-
      プリカがペンを置く音が聞こえ、
      私は携帯から目を離した
  d_nikke_prika_03_56:
    speaker: "<Self>"
    en: You're done already?
    ko: 벌써 다 됐어?
    ja: もうできたのか？
  d_nikke_prika_03_57:
    speaker: prika
    en: Once I get in the zone, I can get it done pretty quickly.
    ko: 원래 한 번 흐름 타면 금방 해.
    ja: 一度筆が乗ると、一気に書けるんだ。
  d_nikke_prika_03_58:
    speaker: "<Monologue>"
    en: Prika stretches.
    ko: 프리카가 기지개를 켠다.
    ja: プリカが伸びをした
  d_nikke_prika_03_59:
    speaker: prika
    en: Want to see, Muse?
    ko: "…뮤즈가 한 번 볼래?"
    ja: "…ミューズ。見てくれるか？"
  d_nikke_prika_03_60:
    speaker: "<Self>"
    en: Me?
    ko: 내가?
    ja: 私が？
  d_nikke_prika_03_61:
    speaker: prika
    en: Yeah.
    ko: 응.
    ja: ああ。
  d_nikke_prika_03_62:
    speaker: prika
    en: Composing takes specialized knowledge and skill, so there's only so much regular
      folks can really contribute.
    ko: |-
      곡은 아무래도 전문 지식이랑 기술이 필요하니까,
      일반인이 피드백을 주기에 한계가 있지만.
    ja: |-
      作曲は専門知識と技術が必要だから
      普通の人からフィードバックをもらうのは
      なかなか難しいけど、
  d_nikke_prika_03_63:
    speaker: prika
    en: Lyrics are a different story, though.
    ko: 가사는 조금 달라.
    ja: 作詞は少し違うんだ。
  d_nikke_prika_03_64:
    speaker: "<Self>"
    en: R-really?
    ko: 그, 그런가…?
    ja: そ、そうなのか…？
  d_nikke_prika_03_65:
    speaker: prika
    en: I'm not saying it's unprofessional or anything.
    ko: 아. 물론 전문적이지 않다는 건 아냐.
    ja: |-
      ああ。もちろんプロみたいに、
      とはいかないけど。
  d_nikke_prika_03_66:
    speaker: prika
    en: You can still figure out the meaning.
    ko: 그래도 담긴 의미는 파악할 수 있으니까.
    ja: |-
      でも、歌詞に込められた意味は
      分かるだろ。
  d_nikke_prika_03_67:
    speaker: "<Monologue>"
    en: Prika holds out the notebook.
    ko: 프리카가 노트를 건네준다.
    ja: プリカはノートを差し出した
  d_nikke_prika_03_68:
    speaker: "<Self>"
    en: Whoa...
    ko: "…와."
    ja: "…おお…"
  d_nikke_prika_03_69:
    speaker: "<Monologue>"
    en: Inside the notebook are lyrics that read like poetry,
    ko: 노트에는, 설탕과 향신료. 그리고 달콤함을 키워드로 하는,
    ja: |-
      「砂糖」と「スパイス」、
      そして「甘い」をキーワードにした
  d_nikke_prika_03_70:
    speaker: "<Monologue>"
    en: built around the keywords "sugar," "spice," and "sweetness."
    ko: 한 편의 시 같은 노래 가사가 적혀 있다.
    ja: |-
      一編の詩のような歌詞が
      ノートに書き連ねられている
  d_nikke_prika_03_71:
    speaker: prika
    en: "... I still need to tweak it a bit to fit the melody."
    ko: "…멜로디에 맞춰서 조금 다듬어야 하기는 하지만."
    ja: |-
      …メロディーに合わせたら
      少し書き換える必要が
      出てくると思う。
  d_nikke_prika_03_72:
    speaker: "<Monologue>"
    en: Prika lets out a quiet sigh, as though she's about to sing the lyrics.
    ko: 가사를 붙여 불러보려는지, 프리카가 작게 숨을 내쉰다.
    ja: |-
      歌詞をメロディーに乗せて
      歌おうとしているのか、
      プリカは小さく息を吐いた
  d_nikke_prika_03_73:
    speaker: "<Monologue>"
    en: And just before her fingers touch the keys...
    ko: 그리고 손가락이 건반에 닿기 직전….
    ja: そして、指が鍵盤に置かれたかと思った瞬間…
  d_nikke_prika_03_74:
    speaker: prika
    en: I think we should call it a day.
    ko: "…오늘은 여기까지 해야겠다."
    ja: "…今日はここまでにしよう。"
  d_nikke_prika_03_75:
    speaker: "<Self>"
    en: That was sudden.
    ko: 갑자기?
    ja: 突然どうしたんだ？
  d_nikke_prika_03_76:
    speaker: prika
    en: I suddenly lost all motivation.
    ko: 갑자기 의욕이 떨어졌어.
    ja: 急にやる気がなくなった。
  d_nikke_prika_03_77:
    speaker: prika
    en: Maybe it's because I poured everything into the lyrics earlier.
    ko: 조금 전에 가사에 전부 쏟아부어서 그런가.
    ja: |-
      さっき歌詞を書く時に
      エネルギーを全部使ったからかな。
  d_nikke_prika_03_78:
    speaker: "<Monologue>"
    en: Prika makes a phone call.
    ko: 프리카가 어디론가 전화를 건다.
    ja: プリカはどこかに電話をかけた
  d_nikke_prika_03_79:
    speaker: "<Monologue>"
    en: From what I can tell, the person on the other end is Avistar.
    ko: 대충 들어보니, 통화 상대는 아비스타인 것 같다.
    ja: どうやら通話相手はアビスタのようだ
  d_nikke_prika_03_80:
    speaker: prika
    en: Yeah, I think I can make it work.
    ko: "…응. 맞출 수 있을 것 같아."
    ja: "…ああ。合わせられると思う。"
  d_nikke_prika_03_81:
    speaker: prika
    en: I'll finish by tomorrow... No, the day after tomorrow.
    ko: 내일… 아니, 모레까지 마무리할게.
    ja: 明日…いや、明後日までに仕上げるよ。
  d_nikke_prika_03_82:
    speaker: prika
    en: Recording's in three days anyway, right?
    ko: 녹음은 3일 후였으니까 괜찮지?
    ja: |-
      レコーディングは3日後だから
      大丈夫だよな？
  d_nikke_prika_03_83:
    speaker: prika
    en: "... Okay, thanks."
    ko: "…응. 알았어. 고마워."
    ja: "…ああ。分かった。ありがとう。"
  d_nikke_prika_03_84:
    speaker: "<Monologue>"
    en: Prika hangs up.
    ko: 프리카가 전화를 끊었다.
    ja: プリカが電話を切った
  d_nikke_prika_03_85:
    speaker: "<Self>"
    en: You're recording in three days?
    ko: "…녹음이 3일 후였어?"
    ja: "…レコーディング、3日後だったのか？"
  d_nikke_prika_03_86:
    speaker: prika
    en: Yeah.
    ko: 응.
    ja: ああ。
  d_nikke_prika_03_87:
    speaker: "<Self>"
    en: "... But you literally just wrote the lyrics."
    ko: "…그런데 조금 전에 가사 쓴 거고?"
    ja: "…それなのに、いま歌詞を作っていたのか？"
  d_nikke_prika_03_88:
    speaker: prika
    en: Yeah.
    ko: 응.
    ja: ああ。
  d_nikke_prika_03_89:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_03_90:
    speaker: prika
    en: That's why I asked you for your help.
    ko: 그러니까 뮤즈한테 도와달라고 했지.
    ja: だから、ミューズに助けを求めたんだ。
  d_nikke_prika_03_91:
    speaker: prika
    en: I was stuck on it until the very last minute.
    ko: 아슬아슬할 때까지 막혀 있었으니까.
    ja: ギリギリまで行き詰まってたからさ。
  d_nikke_prika_03_92:
    speaker: prika
    en: "... Honestly, I didn't want you to hear it until it was finished and released."
    ko: |-
      …솔직히 완성하고 발표할 때까지는,
      뮤즈한테 안 들려주고 싶었는데.
    ja: |-
      …本当は完成してリリースしてから
      聞いてもらいたかったんだけど…
  d_nikke_prika_03_93:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_03_94:
    speaker: prika
    en: Maybe this wasn't so bad after all.
    ko: 이러는 것도, 나쁘지 않았던 것 같네.
    ja: こういうのも、悪くないかもな。
d_nikke_prika_04:
  d_nikke_prika_04_1:
    speaker: "<Monologue>"
    en: Soon after, Prika releases her solo digital single.
    ko: 얼마 뒤. 프리카의 단독 디지털 싱글이 발매되었다.
    ja: |-
      それからしばらくして、
      プリカのソロデジタルシングルが
      リリースされた
  d_nikke_prika_04_2:
    speaker: avistar
    en: Hmm... So far, everything seems fine.
    ko: 음… 일단 추이는 괜찮아요.
    ja: ひとまず、売れ行きは好調ですね。
  d_nikke_prika_04_3:
    speaker: "<Narration>"
    en: Avistar looks down at her tablet.
    ko: 아비스타가 태블릿 화면을 들여다본다.
    ja: アビスタはタブレット画面をのぞき込んだ
  d_nikke_prika_04_4:
    speaker: avistar
    en: You've broken into the first page of all the major charts,
    ko: 주요 차트 전부 1페이지 진입했고,
    ja: |-
      主要チャートはすべて1ページ目に
      ランクインしていますし、
  d_nikke_prika_04_5:
    speaker: avistar
    en: and you're making slow but steady progress upwards.
    ko: 느리지만 꾸준히 상승세에요.
    ja: 緩やかではありますが、右肩上がりです。
  d_nikke_prika_04_6:
    speaker: prika
    en: Glad to hear that.
    ko: 응. 다행이네.
    ja: ああ。よかった。
  d_nikke_prika_04_7:
    speaker: mint
    en: What made you decide to write a song like this?
    ko: 근데 무슨 바람이 불어서 이런 곡을 썼어?
    ja: |-
      でも、ラブソングなんて、
      急にどういう風の吹き回し？
  d_nikke_prika_04_8:
    speaker: mint
    en: When I heard you were releasing a solo song, I honestly thought you'd do some
      cool hip-hop-style song.
    ko: 나는 솔로곡 낸다길래 뭐, 걸크러시 힙합이나 그런 거 하려나~ 했는데.
    ja: |-
      ソロ曲を出すっていうから、
      てっきりヒップホップとか
      カッコいい曲かと思ってたわ。
  d_nikke_prika_04_9:
    speaker: prika
    en: I just wanted to give it a try.
    ko: 그냥. 해보고 싶어서.
    ja: "…なんとなく、やってみたいと思ったんだ。"
  d_nikke_prika_04_10:
    speaker: mint
    en: Hmm... really?
    ko: 음… 그래?
    ja: へえ～…そうなんだ？
  d_nikke_prika_04_11:
    speaker: mint
    en: So how does it feel?
    ko: 그래서 어때? 해보니까?
    ja: それで？やってみてどうだった？
  d_nikke_prika_04_12:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_13:
    speaker: mint
    en: Okay, okay, I won't ask.
    ko: 알았어, 알았어. 안 물어볼게.
    ja: 分かった、分かった。聞かないわよ。
  d_nikke_prika_04_14:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャ
  d_nikke_prika_04_15:
    speaker: "<Self>"
    en: Hey, guys.
    ko: 나 왔어.
    ja: みんな、お疲れ
  d_nikke_prika_04_16:
    speaker: prika
    en: Oh, Mu—
    ko: 아, 뮤-
    ja: あっ、ミュー…
  d_nikke_prika_04_17:
    speaker: mint
    en: Kitten!
    ko: 아기 고양이 씨!
    ja: 子ネコさん！
  d_nikke_prika_04_18:
    speaker: "<Monologue>"
    en: Mint hurries over and takes the fruit basket out of my hands.
    ko: 민트가 달려와, 내가 가져온 과일 바구니를 받아간다.
    ja: |-
      ミントは私に駆け寄ると、
      私が差し入れに持ってきた
      フルーツのカゴ盛りを受け取った
  d_nikke_prika_04_19:
    speaker: mint
    en: Wow, what's all this? Fruit?
    ko: 와. 이게 뭐예요? 과일?
    ja: わぁ、もしかしてフルーツですか？
  d_nikke_prika_04_20:
    speaker: "<Self>"
    en: It's to congratulate Prika on her single.
    ko: 프리카 싱글 축하해 주려고.
    ja: プリカのソロ曲リリースのお祝いだ
  d_nikke_prika_04_21:
    speaker: "<Monologue>"
    en: Mint turns to look at Prika.
    ko: 민트가 몸을 돌려 프리카를 본다.
    ja: ミントは振り返ってプリカを見た
  d_nikke_prika_04_22:
    speaker: mint
    en: That's what he says.
    ko: 그렇다는데?
    ja: だそうよ？
  d_nikke_prika_04_23:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_24:
    speaker: "<Monologue>"
    en: I can't see Mint's face, but Prika's expression turns strange.
    ko: 민트의 얼굴은 보이지 않지만, 프리카의 표정이 묘해진다.
    ja: |-
      ミントの顔は見えないが、
      プリカはだんだん複雑な表情になっていく
  d_nikke_prika_04_25:
    speaker: "<Self>"
    en: Congrats, I heard it's a huge hit.
    ko: 축하해. 엄청 잘 된 거 아냐?
    ja: |-
      おめでとう。
      ずいぶんヒットしているじゃないか
  d_nikke_prika_04_26:
    speaker: avistar
    en: Yes, we were just talking about that!
    ko: 맞아요! 안 그래도 그 얘기 하고 있었어요.
    ja: |-
      はい！ちょうど今、
      その話をしていたところです。
  d_nikke_prika_04_27:
    speaker: "<Monologue>"
    en: Avistar fills me in on the situation.
    ko: 아비스타에게 설명을 들었다.
    ja: アビスタから話を聞いた
  d_nikke_prika_04_28:
    speaker: "<Self>"
    en: I've been streaming it nonstop too.
    ko: 나도 열심히 스트리밍 돌리고 있어.
    ja: 私も頑張って再生回数に貢献している
  d_nikke_prika_04_29:
    speaker: "<Monologue>"
    en: I show Prika my phone.
    ko: 핸드폰을 프리카에게 보여준다.
    ja: プリカに携帯を見せた
  d_nikke_prika_04_30:
    speaker: prika
    en: "... Thanks."
    ko: "…고마워."
    ja: "…ありがとう。"
  d_nikke_prika_04_31:
    speaker: mint
    en: Let's see...
    ko: 어디 봐봐~
    ja: どれどれ～
  d_nikke_prika_04_32:
    speaker: "<Monologue>"
    en: Mint takes my phone from me.
    ko: 민트가 내 핸드폰을 가져간다.
    ja: ミントが私の携帯を取った
  d_nikke_prika_04_33:
    speaker: mint
    en: You really have been working hard... Huh?
    ko: 진짜 열심히 해주고 있… 어라?
    ja: ほんとに頑張ってくれてる…って、あれ？
  d_nikke_prika_04_34:
    speaker: "<Self>"
    en: What is it?
    ko: 왜?
    ja: どうした？
  d_nikke_prika_04_35:
    speaker: "<Monologue>"
    en: Mint looks at Prika and grins.
    ko: 민트가 프리카를 보고 씩 웃는다.
    ja: ミントはプリカを見て、にやりと笑った
  d_nikke_prika_04_36:
    speaker: mint
    en: Prika, you didn't write the lyrics?
    ko: 프리카. 가사 네가 안 썼네?
    ja: |-
      プリカ。歌詞書いたの、
      あなたじゃなかったのね？
  d_nikke_prika_04_37:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_38:
    speaker: "<Self>"
    en: Oh, we wrote them toge...
    ko: 아, 저번에 같이….
    ja: あ、この間一緒に…
  d_nikke_prika_04_39:
    speaker: prika
    en: I-I'm going to step out for a minute.
    ko: "…나, 나는 잠깐 나갔다 올게."
    ja: "…ちょ、ちょっと出かけてくる。"
  d_nikke_prika_04_40:
    speaker: prika
    en: I have to get ready for my solo performance... and take care of some other
      stuff.
    ko: 솔로 무대 준비도 해야 되고… 어, 이것저것 있으니까.
    ja: |-
      ソロステージとか、その…
      いろいろ準備することがあるし。
  d_nikke_prika_04_41:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 달칵.
    ja: ガチャ
  d_nikke_prika_04_42:
    speaker: "<Monologue>"
    en: Prika rushes out of the practice room.
    ko: 프리카가 황급히 연습실을 나갔다.
    ja: プリカは慌ててトレーニングルームを出て行った
  d_nikke_prika_04_43:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_44:
    speaker: "<Self>"
    en: Did I say something wrong?
    ko: "…나 뭐 이상한 말 했어?"
    ja: "…何か変なことでも言ったか？"
  d_nikke_prika_04_45:
    speaker: avistar
    en: I-I'm not sure...
    ko: 그, 글쎄요….
    ja: さ、さあ…
  d_nikke_prika_04_46:
    speaker: mint
    en: You're not the one acting weird. It's Prika.
    ko: 이상한 건 아기 고양이 씨가 아니라 프리카예요.
    ja: |-
      変なのは子ネコさんじゃなくて
      プリカです。
  d_nikke_prika_04_47:
    speaker: "<Monologue>"
    en: Mint holds up my phone for Avistar to see.
    ko: 민트가 아비스타에게 핸드폰 화면을 보여준다.
    ja: ミントはアビスタに携帯電話の画面を見せた
  d_nikke_prika_04_48:
    speaker: mint
    en: Isn't that right, Avistar?
    ko: 그렇죠?
    ja: でしょ？
  d_nikke_prika_04_49:
    speaker: avistar
    en: What are you—Oh...
    ko: 무슨 말씀… 어?
    ja: どういうことで…あれ？
  d_nikke_prika_04_50:
    speaker: "<Self>"
    en: What is it?
    ko: 왜?
    ja: 何だ？
  d_nikke_prika_04_51:
    speaker: avistar
    en: Th-that can't be right...
    ko: 그… 럴 리가 없는데….
    ja: そ…そんなはず…
  d_nikke_prika_04_52:
    speaker: "<Self>"
    en: What's wrong? You guys are freaking me out.
    ko: 아니, 왜. 왜 그래 무섭게.
    ja: な、何かまずいことでもあったのか？
  d_nikke_prika_04_53:
    speaker: avistar
    en: Look...
    ko: 그게….
    ja: その…
  d_nikke_prika_04_54:
    speaker: "<Monologue>"
    en: Avistar hands my phone back to me.
    ko: 아비스타가 내게 핸드폰을 돌려준다.
    ja: アビスタは携帯電話を私に返した
  d_nikke_prika_04_55:
    speaker: avistar
    en: Prika never lets anyone else write her lyrics.
    ko: 프리카는 본인 곡 가사, 절대 남한테 안 맡기거든요.
    ja: |-
      プリカはいつも自分の曲の歌詞は
      絶対に他人に任せないんです。
  d_nikke_prika_04_56:
    speaker: avistar
    en: She says the lyrics are the heart of a song...
    ko: 가사야말로 곡의 정체성이라면서….
    ja: 歌詞こそが曲のアイデンティティだからって…
  d_nikke_prika_04_57:
    speaker: mint
    en: We used to fight about that a lot.
    ko: 예전에 그걸로 엄청 싸웠었는데.
    ja: 昔、そのことですごく揉めたことがあるんです。
  d_nikke_prika_04_58:
    speaker: "<Self>"
    en: "... Huh?"
    ko: "…응?"
    ja: "…えっ？"
  d_nikke_prika_04_59:
    speaker: prika
    en: Want to see, Muse?
    ko: "…뮤즈가 한 번 볼래?"
    ja: "…ミューズ。見てくれるか？"
  d_nikke_prika_04_60:
    speaker: "<Self>"
    en: Me?
    ko: 내가?
    ja: 私が？
  d_nikke_prika_04_61:
    speaker: prika
    en: Yeah,
    ko: 응.
    ja: ああ。
  d_nikke_prika_04_62:
    speaker: prika
    en: Composing takes specialized knowledge and skill, so there's only so much regular
      folks can really contribute.
    ko: |-
      곡은 아무래도 전문 지식이랑 기술이 필요하니까,
      일반인이 피드백을 주기에 한계가 있지만.
    ja: |-
      作曲は専門知識と技術が必要だから
      普通の人からフィードバックをもらうのは
      なかなか難しいけど、
  d_nikke_prika_04_63:
    speaker: prika
    en: Lyrics are a different story, though.
    ko: 가사는 조금 달라.
    ja: 作詞は少し違うんだ。
  d_nikke_prika_04_64:
    speaker: "<Self>"
    en: R-really?
    ko: 그, 그런가…?
    ja: そ、そうなのか…？
  d_nikke_prika_04_65:
    speaker: prika
    en: I'm not saying it's unprofessional or anything.
    ko: 아. 물론 전문적이지 않다는 건 아냐.
    ja: |-
      ああ。もちろんプロみたいに、
      とはいかないけど。
  d_nikke_prika_04_66:
    speaker: prika
    en: You can still figure out the meaning.
    ko: 그래도 담긴 의미는 파악할 수 있으니까.
    ja: |-
      でも、歌詞に込められた意味は
      分かるだろ。
  d_nikke_prika_04_67:
    speaker: "<Monologue>"
    en: Prika holds out the notebook.
    ko: 프리카가 노트를 건네준다.
    ja: プリカはノートを差し出した
  d_nikke_prika_04_68:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_69:
    speaker: "<Monologue>"
    en: On the phone screen, details about Prika's solo song are displayed.
    ko: 핸드폰 화면에는, 이번 프리카의 솔로곡 정보가 떠 있다.
    ja: |-
      携帯の画面には、
      プリカのソロ曲の情報が
      表示されている
  d_nikke_prika_04_70:
    speaker: "<Narration>"
    en: 'Title: Before Sweetness'
    ko: "[제목 : Before Sweetness]"
    ja: "「タイトル：Before Sweetness」"
  d_nikke_prika_04_71:
    speaker: "<Narration>"
    en: 'Main Artist: Prika'
    ko: "[보컬 : Prika]"
    ja: "「ボーカル：Prika」"
  d_nikke_prika_04_72:
    speaker: "<Narration>"
    en: 'Composer: Prika'
    ko: "[작곡 : Prika]"
    ja: "「作曲：Prika」"
  d_nikke_prika_04_73:
    speaker: "<Monologue>"
    en: And...
    ko: 그리고….
    ja: そして…
  d_nikke_prika_04_74:
    speaker: "<Narration>"
    en: 'Lyricist: Muse'
    ko: "[작사 : Muse]"
    ja: "「作詞：Muse」"
  d_nikke_prika_04_75:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_76:
    speaker: avistar
    en: Person of Interest?
    ko: 특별 관리 대상님?
    ja: 特別管理対象様？
  d_nikke_prika_04_77:
    speaker: "<Self>"
    en: Oh, sorry...
    ko: "…아. 미안."
    ja: "…ああ、すまない…"
  d_nikke_prika_04_78:
    speaker: "<Self>"
    en: I just...
    ko: 그냥….
    ja: その…
  d_nikke_prika_04_79:
    speaker: "<Monologue>"
    en: I tap the screen and play the song.
    ko: 화면을 터치해 음악을 재생한다.
    ja: 画面をタッチして曲を再生した
  d_nikke_prika_04_80:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_04_81:
    speaker: "<Self>"
    en: It feels like she's giving me special treatment.
    ko: "…아무래도, 특별 취급해 주는 모양이라서."
    ja: "…特別扱いをしてもらった気がする"
d_nikke_prika_05:
  d_nikke_prika_05_1:
    speaker: "<Narration>"
    en: Several days later...
    ko: 며칠 뒤.
    ja: 数日後
  d_nikke_prika_05_2:
    speaker: "<Narration>"
    en: I lean back into the couch,
    ko: 스윽- 스윽-
    ja: スッ、スッ――
  d_nikke_prika_05_3:
    speaker: "<Monologue>"
    en: scrolling through my phone absentmindedly.
    ko: 소파에 기대 앉아 핸드폰을 본다.
    ja: ソファーに寄りかかり、携帯を見る
  d_nikke_prika_05_4:
    speaker: "<Narration>"
    en: '"Anyone heard Prika''s new single?"'
    ko: "[프리카 싱글 들음?]"
    ja: "「プリカのシングル聞いた？」"
  d_nikke_prika_05_5:
    speaker: "<Narration>"
    en: I tap my phone screen.
    ko: 톡.
    ja: タッ
  d_nikke_prika_05_6:
    speaker: "<Narration>"
    en: '"It''s so different from anything else she''s done. It''s sweet."'
    ko: "[지금까지랑 좀 다른데? 달달함]"
    ja: "「今までと違うな。なんか甘い感じ」"
  d_nikke_prika_05_7:
    speaker: "<Narration>"
    en: '- "Highest pull rate! Fxj4KL213.tye"'
    ko: ㄴ[확률 최고 뽑기! Fxj4KL213.tye]
    ja: ㄴ高確率SSRガチャ！Fxj4KL213.tye
  d_nikke_prika_05_8:
    speaker: "<Narration>"
    en: '- "Totally man lol."'
    ko: ㄴ[ㄹㅇㅋㅋ]
    ja: ㄴそれな
  d_nikke_prika_05_9:
    speaker: "<Narration>"
    en: '- "I think you either love it or hate it."'
    ko: ㄴ[호불호 좀 갈릴듯]
    ja: ㄴ好みが分かれそう
  d_nikke_prika_05_10:
    speaker: "<Narration>"
    en: '- "Honestly, it''s pretty good."'
    ko: ㄴ[ㄱㅊ은것같은데]
    ja: ㄴいい感じだと思うけどな
  d_nikke_prika_05_11:
    speaker: "<Narration>"
    en: '- "Mint is waifu."'
    ko: ㄴ[민트 내 아내임]
    ja: ㄴミントは俺の嫁
  d_nikke_prika_05_12:
    speaker: "<Narration>"
    en: '- "I like it."'
    ko: ㄴ[난 좋음]
    ja: ㄴ俺は結構好き
  d_nikke_prika_05_13:
    speaker: prika
    en: Looking at that again?
    ko: 또 그런 거 보고 있어?
    ja: またそんなの見てるのか？
  d_nikke_prika_05_14:
    speaker: "<Self>"
    en: I didn't leave any comments this time.
    ko: 이번에는 댓글은 안 달았어.
    ja: 今回はコメントしていない
  d_nikke_prika_05_15:
    speaker: "<Monologue>"
    en: Prika chuckles and sits beside me.
    ko: 프리카가 픽 웃고는, 내 옆에 앉는다.
    ja: プリカはクスッと笑い、私の隣に座った
  d_nikke_prika_05_16:
    speaker: "<Self>"
    en: How's being a solo artist?
    ko: 솔로 활동은 좀 어때?
    ja: ソロ活動はどうだ？
  d_nikke_prika_05_17:
    speaker: prika
    en: It's not too bad. I just have to promote the song on music shows.
    ko: 큰 문제는 없어. 기껏해야 음악 프로 나가는 정도니까.
    ja: |-
      難なく楽しめてるよ。
      音楽番組にも出演したんだ。
  d_nikke_prika_05_18:
    speaker: prika
    en: Mint and Avistar help me out a lot too.
    ko: 민트랑 아비스타가 많이 도와주기도 하고.
    ja: ミントとアビスタもサポートしてくれてる。
  d_nikke_prika_05_19:
    speaker: "<Self>"
    en: Oh, I saw you perform live.
    ko: 아. 라이브 하는 거 봤어.
    ja: ライブ、見させてもらった
  d_nikke_prika_05_20:
    speaker: prika
    en: Yeah...
    ko: 아, 응.
    ja: あ、ああ…
  d_nikke_prika_05_21:
    speaker: prika
    en: What'd you think?
    ko: "…어땠어?"
    ja: "…どうだった？"
  d_nikke_prika_05_22:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_prika_05_23:
    speaker: "<Monologue>"
    en: Unlike last time, I already know what to say.
    ko: 저번과 달리, 이번에는 미리 생각해둔 감상을 입에 담는다.
    ja: |-
      この前とは違い、
      あらかじめ考えておいた感想を口にした
  d_nikke_prika_05_24:
    speaker: "<Self>"
    en: The melody definitely feels more stable than the first time I heard it.
    ko: 확실히 처음 들었을 때보다 멜로디가 안정됐어.
    ja: 初めて聞いた時より確実に音程が安定したな
  d_nikke_prika_05_25:
    speaker: "<Self>"
    en: Some people might say the chorus lacks punch,
    ko: 후렴의 폭발력이 약하다고 느낄 수도 있지만,
    ja: サビの爆発力が弱い気もするが、
  d_nikke_prika_05_26:
    speaker: "<Self>"
    en: but structurally, the song flows really well.
    ko: 사실 곡 전체의 구조를 보면 완벽한 흐름이지.
    ja: 曲の構成を考えたら、流れは完璧だと思う
  d_nikke_prika_05_27:
    speaker: "<Self>"
    en: And the way the lyrics layer over the piano...
    ko: 게다가 피아노의 레이어 위에 얹히는 가사의 밀도가….
    ja: |-
      それに、ピアノのレイヤーに乗せられた
      歌詞の密度が…
  d_nikke_prika_05_28:
    speaker: "<Self>"
    en: "... A-anyway, I like it."
    ko: "…아, 아무튼. 좋았어."
    ja: "…と、とにかく、最高だった"
  d_nikke_prika_05_29:
    speaker: "<Monologue>"
    en: Prika's eyes widen for a moment before she lets out a small laugh.
    ko: 잠시 눈이 커졌던 프리카가 픽 웃는다.
    ja: プリカは目を丸くすると、クスッと笑った
  d_nikke_prika_05_30:
    speaker: prika
    en: What the heck?
    ko: 뭐야 그게.
    ja: 何だ、それ。
  d_nikke_prika_05_31:
    speaker: prika
    en: Since when did you become a music critic?
    ko: 그새 평론가 다 됐네.
    ja: すっかり評論家だな。
  d_nikke_prika_05_32:
    speaker: "<Self>"
    en: I just gave it some thought beforehand.
    ko: 미리 좀 생각해 놨거든.
    ja: 前もって考えておいたんだ
  d_nikke_prika_05_33:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_05_34:
    speaker: prika
    en: I was hoping for
    ko: "…나는 좀 더."
    ja: "…私は、もう少し…"
  d_nikke_prika_05_35:
    speaker: prika
    en: something more... personal?
    ko: 뮤즈의 개인적인… 이라고 해야 하나.
    ja: ミューズ独自の…っていうか
  d_nikke_prika_05_36:
    speaker: prika
    en: More... casual? Honest? No, that's not quite it...
    ko: 좀 더… 일상적… 사적인… 음, 조금 다른데….
    ja: |-
      もっとこう…日常的で…個人的…
      っていうのは、ちょっと違うか…
  d_nikke_prika_05_37:
    speaker: prika
    en: "... Instead of a professional evaluation, I wanted to hear what you actually
      thought."
    ko: "…그런 전문적인 평가보단, 좀 더 평범한 감상이 듣고 싶었는데."
    ja: |-
      …とにかくそういう評論家っぽい感想より、
      もっと普通の感想が聞きたいんだけど。
  d_nikke_prika_05_38:
    speaker: "<Self>"
    en: Hmm...
    ko: 음….
    ja: うーん…
  d_nikke_prika_05_39:
    speaker: "<Self>"
    en: It really resonated with me.
    ko: "…와 닿았어. 마음에."
    ja: "…胸に響いた"
  d_nikke_prika_05_40:
    speaker: prika
    en: "... Oh yeah?"
    ko: "…그래?"
    ja: "…そうか。"
  d_nikke_prika_05_41:
    speaker: "<Monologue>"
    en: Prika stands up and stretches.
    ko: 프리카가 일어나 기지개를 켠다.
    ja: プリカは立ち上がって伸びをした
  d_nikke_prika_05_42:
    speaker: prika
    en: Guess I can finally work on the full album in peace.
    ko: 응. 그럼 마음 편하게 정규 앨범 작업 시작할 수 있겠다.
    ja: |-
      これで心置きなくフルアルバムの作業に
      取り掛かれそうだ。
  d_nikke_prika_05_43:
    speaker: "<Self>"
    en: You're still promoting your single, aren't you?
    ko: 솔로 활동 아직 좀 남았잖아.
    ja: まだソロ活動が残っているだろう？
  d_nikke_prika_05_44:
    speaker: prika
    en: That's true...
    ko: 그렇기는 한데….
    ja: まあ、そうだけど…
  d_nikke_prika_05_45:
    speaker: prika
    en: But I've already achieved everything I wanted.
    ko: "…이루고 싶었던 건 다 이뤘으니까."
    ja: "…叶えたかったことは全部叶ったから。"
  d_nikke_prika_05_46:
    speaker: "<Monologue>"
    en: Prika brings over a tablet.
    ko: 프리카가 태블릿을 가져온다.
    ja: プリカがタブレットを持ってきた
  d_nikke_prika_05_47:
    speaker: prika
    en: Take a look at this.
    ko: 한 번 봐줘.
    ja: ちょっと見てくれるか？
  d_nikke_prika_05_48:
    speaker: "<Self>"
    en: What's this?
    ko: 뭔데?
    ja: 何だ？
  d_nikke_prika_05_49:
    speaker: prika
    en: These are potential tracks for our upcoming album.
    ko: 우리 정규 앨범 후보곡들.
    ja: フルアルバムの候補曲なんだけど…
  d_nikke_prika_05_50:
    speaker: "<Monologue>"
    en: I take the tablet and look over the playlist.
    ko: 태블릿을 받아들고, 재생 목록을 훑어본다.
    ja: |-
      私はタブレットを受け取り、
      再生リストに目を通した
  d_nikke_prika_05_51:
    speaker: prika
    en: Once I narrow these down, I can finally get to work for real.
    ko: 이중에서 거르고 거른 다음에 본격적으로 작업해야지.
    ja: |-
      この中から選び抜いて曲を決めたら、
      本格的な作業に入るつもりなんだ。
  d_nikke_prika_05_52:
    speaker: "<Monologue>"
    en: I listen to the shortlisted tracks with Prika.
    ko: 프리카와 함께 후보곡들을 듣는다.
    ja: プリカと一緒に候補曲を聴いていった
  d_nikke_prika_05_53:
    speaker: "<Monologue>"
    en: Some are little more than melodies, some are just Prika humming over the music,
    ko: 어떤 곡은 멜로디만. 어떤 곡은 프리카의 허밍이.
    ja: |-
      メロディーだけの曲や、
      プリカのハミングだけの曲
  d_nikke_prika_05_54:
    speaker: "<Monologue>"
    en: and others already sound nearly complete.
    ko: 그리고 거의 완성된 것 같아 보이는 곡들도 있다.
    ja: そして、ほぼ完成に近い曲もあった
  d_nikke_prika_05_55:
    speaker: "<Self>"
    en: There's so many. There's gotta be over a hundred songs here.
    ko: 엄청 많네. 100곡도 넘는데?
    ja: すごい数だな。100曲以上あるぞ？
  d_nikke_prika_05_56:
    speaker: prika
    en: I've been writing songs consistently for a long time now.
    ko: 작곡 자체는 예전부터 꾸준히 해왔으니까.
    ja: |-
      曲自体は、だいぶ前から
      コツコツ作り貯めてたから。
  d_nikke_prika_05_57:
    speaker: prika
    en: Still... I didn't realize I'd built up this much.
    ko: 그래도… 어느새 이만큼이나 쌓였구나.
    ja: |-
      それでも…いつの間にか
      こんなに増えたんだな。
  d_nikke_prika_05_58:
    speaker: "<Monologue>"
    en: Prika slowly scrolls through the list.
    ko: 프리카가 천천히 화면을 스크롤한다.
    ja: プリカはゆっくりと画面をスクロールした
  d_nikke_prika_05_59:
    speaker: "<Narration>"
    en: Then she pauses.
    ko: 멈칫.
    ja: ピタッ
  d_nikke_prika_05_60:
    speaker: "<Monologue>"
    en: Her eyes stop on the title of the song at the very bottom.
    ko: 목록의 가장 아래에 있는 곡의 제목을 보고, 프리카가 멈칫한다.
    ja: |-
      リストの一番下にある曲のタイトルを見て、
      プリカの指が止まった
  d_nikke_prika_05_61:
    speaker: "<Narration>"
    en: '"After Sweetness"'
    ko: "[After Sweetness]"
    ja: "「After Sweetness」"
  d_nikke_prika_05_62:
    speaker: "<Self>"
    en: Oh, that's...
    ko: 어, 이건….
    ja: ん？これは…
  d_nikke_prika_05_63:
    speaker: prika
    en: Oh, this...
    ko: 아, 이건….
    ja: あっ、これは…
  d_nikke_prika_05_64:
    speaker: prika
    en: It just popped into my head all of a sudden.
    ko: 그냥 진짜 갑자기 떠올라서.
    ja: さっき急に思い浮かんだんだ。
  d_nikke_prika_05_65:
    speaker: "<Monologue>"
    en: Prika hurriedly turns off the tablet screen.
    ko: 프리카가 황급히 태블릿 화면을 끈다.
    ja: プリカは慌ててタブレットの画面を消した
  d_nikke_prika_05_66:
    speaker: prika
    en: I just threw it together before you came over.
    ko: 뮤즈가 오기 직전에, 대충 해 본 거야.
    ja: |-
      ミューズが来る前に、
      パパッと作ってみただけだから。
  d_nikke_prika_05_67:
    speaker: "<Self>"
    en: Is this your next solo song?
    ko: 요번 솔로곡의 후속곡이야?
    ja: 今回のソロ曲をアレンジしたのか？
  d_nikke_prika_05_68:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_05_69:
    speaker: prika
    en: Yeah...
    ko: "…응."
    ja: "…ああ。"
  d_nikke_prika_05_70:
    speaker: prika
    en: You helped me out so much,
    ko: 이번에는 뮤즈한테 도움을 많이 받았잖아.
    ja: |-
      今回の曲はミューズに
      かなり助けてもらっただろ？
  d_nikke_prika_05_71:
    speaker: prika
    en: and even wrote almost all the lyrics yourself.
    ko: 특히 가사는 뮤즈가 거의 다 썼고.
    ja: |-
      特に、歌詞はほとんど
      ミューズが書いてくれたようなものだし。
  d_nikke_prika_05_72:
    speaker: "<Self>"
    en: I just added a few keywords, that's all.
    ko: 나는 그냥 키워드 몇 개 쓴 것밖에 없잖아.
    ja: 私はキーワードをいくつか書いただけだ
  d_nikke_prika_05_73:
    speaker: prika
    en: That's the important part.
    ko: 그게 중요한 거니까.
    ja: それが一番大事なんだ。
  d_nikke_prika_05_74:
    speaker: prika
    en: Anyway, this is...
    ko: "…아무튼. 이건 온전히 내가…."
    ja: "…とにかく。この曲は…"
  d_nikke_prika_05_75:
    speaker: prika
    en: this is the version I put my heart into.
    ko: 내 마음을 담아서 작업한 버전이야.
    ja: |-
      想いを込めて、
      私一人で作ったバージョンなんだ。
  d_nikke_prika_05_76:
    speaker: prika
    en: The song isn't all that different.
    ko: 곡 자체는 크게 다르지 않아.
    ja: 曲自体はそんなに変わってない。
  d_nikke_prika_05_77:
    speaker: "<Self>"
    en: "... Can I listen to it?"
    ko: "…들려줄 수 있어?"
    ja: "…聞かせてくれるか？"
  d_nikke_prika_05_78:
    speaker: prika
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_prika_05_79:
    speaker: prika
    en: Will you tell me what you think?
    ko: "…감상, 들려줄 거야?"
    ja: "…感想、教えてくれるか？"
  d_nikke_prika_05_80:
    speaker: "<Self>"
    en: Sure.
    ko: 응.
    ja: ああ
  d_nikke_prika_05_81:
    speaker: prika
    en: "... Fine."
    ko: "……알았어."
    ja: "…分かった。"
  d_nikke_prika_05_82:
    speaker: "<Monologue>"
    en: Prika gets up and walks over to the synthesizer.
    ko: 프리카가 일어나 신디사이저 앞으로 향한다.
    ja: |-
      プリカは立ち上がり、
      シンセサイザーの前に向かった
  d_nikke_prika_05_83:
    speaker: "<Monologue>"
    en: Closing her eyes, she lets out a quiet breath.
    ko: 눈을 감고 작게 숨을 내쉰 프리카는,
    ja: そして目を閉じ、息を吐いた
  d_nikke_prika_05_84:
    speaker: "<Monologue>"
    en: Somehow, she looks even more nervous than she did on stage the other day.
    ko: 얼마 전에 본, 라이브 무대에서보다도 긴장한 것 같아 보인다.
    ja: |-
      どことなく、この間の
      ライブのステージよりも緊張して見える
  d_nikke_prika_05_85:
    speaker: prika
    en: "... Okay, here we go."
    ko: "…시작할게."
    ja: "…始めるぞ。"
  d_nikke_prika_05_86:
    speaker: "<Monologue>"
    en: As the intro plays, Prika's fingers glide across the keys.
    ko: 전주가 흘러나오고, 프리카의 손가락이 건반 위를 천천히 오간다.
    ja: |-
      前奏が流れ、プリカの指が
      鍵盤の上をゆっくりと行き来する
  d_nikke_prika_05_87:
    speaker: "<Monologue>"
    en: The melody gently envelops my heart,
    ko: 부드럽게 마음을 감싸는 멜로디와,
    ja: 心をそっと包み込むメロディーと、
  d_nikke_prika_05_88:
    speaker: "<Monologue>"
    en: while her sweet voice washes over me.
    ko: 달콤한 프리카의 목소리는, 틀림없이.
    ja: プリカの甘い歌声は間違いなく…
  d_nikke_prika_05_89:
    speaker: "<Monologue>"
    en: "... Her song is unmistakably made of sugar and spice."
    ko: "…설탕과 향신료로 되어 있었다."
    ja: "…砂糖とスパイスそのものだった"
