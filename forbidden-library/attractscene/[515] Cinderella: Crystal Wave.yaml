---
d_nikke_cinderella_crystalwave_01:
  d_nikke_cinderella_crystalwave_01_1:
    speaker: "<Narration>"
    en: Cinderella approaches the luggage stacked near the boat.
    ko: 신데렐라는 배 근처에 있는 짐 쪽으로 다가갔다.
    ja: |-
      シンデレラは船のそばに置いてあった
      荷物へ近づいた
  d_nikke_cinderella_crystalwave_01_2:
    speaker: "<Narration>"
    en: Penguin No. 1 and Rapi follow behind her.
    ko: 그 뒤를 펭군 1호와 라피가 따른다.
    ja: その後をペンくん1号とラピが追う
  d_nikke_cinderella_crystalwave_01_3:
    speaker: cinderella_s
    en: You really put a lot of thought into all of this, Prince.
    ko: 정말 세심하게 이것저것 준비해 왔네, 왕자님.
    ja: 本当にたくさん準備してくれたのね。
  d_nikke_cinderella_crystalwave_01_4:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_01_5:
    speaker: rapi_red
    en: The Commander is always serious about having fun.
    ko: 지휘관은 놀 준비에 진심이었으니까.
    ja: 指揮官は、遊ぶための準備に本気だったもの。
  d_nikke_cinderella_crystalwave_01_6:
    speaker: cinderella_s
    en: Hehe, he's something else.
    ko: 후후, 왕자님도 참.
    ja: ふふ、王子様ったら。
  d_nikke_cinderella_crystalwave_01_7:
    speaker: cinderella_s
    en: Let's see, where's my sunscreen?
    ko: 어디 보자, 선크림이….
    ja: ええと、日焼け止めは…
  d_nikke_cinderella_crystalwave_01_8:
    speaker: "<Narration>"
    en: After a bit of rummaging...
    ko: 뒤적뒤적-
    ja: ガサゴソ――
  d_nikke_cinderella_crystalwave_01_9:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_01_10:
    speaker: "<Narration>"
    en: Penguin No. 1 proudly holds up a bottle of sunscreen.
    ko: 짐 속에서 선크림을 자랑스럽게 치켜든 펭군 1호.
    ja: |-
      ペン君1号が荷物の中から
      日焼け止めを誇らしげに掲げた
  d_nikke_cinderella_crystalwave_01_11:
    speaker: cinderella_s
    en: Why, thank you.
    ko: 어머나, 고마워.
    ja: あら、ありがとう。
  d_nikke_cinderella_crystalwave_01_12:
    speaker: cinderella_s
    en: You're quite the capable little thing, aren't you?
    ko: 넌 정말 유능한 아이구나.
    ja: あなたは本当に有能な子ね。
  d_nikke_cinderella_crystalwave_01_13:
    speaker: "<Narration>"
    en: Cinderella pats Penguin No. 1 on the head.
    ko: 쓰담-
    ja: ナデナデ…
  d_nikke_cinderella_crystalwave_01_14:
    speaker: peng1
    en: Peng!
    ko: 페엥~
    ja: ペ～ン。
  d_nikke_cinderella_crystalwave_01_15:
    speaker: rapi_red
    en: It's melting.
    ko: 그냥 녹아내리는군.
    ja: すっかり骨抜きね。
  d_nikke_cinderella_crystalwave_01_16:
    speaker: cinderella_s
    en: Hm?
    ko: 음?
    ja: あら？
  d_nikke_cinderella_crystalwave_01_17:
    speaker: cinderella_s
    en: Looks like... something else fell out too.
    ko: 그런데… 옆에 뭔가 같이 떨어졌는데?
    ja: "…何か落ちているわ。"
  d_nikke_cinderella_crystalwave_01_18:
    speaker: cinderella_s
    en: What's this?
    ko: 이게 뭘까?
    ja: これは何かしら？
  d_nikke_cinderella_crystalwave_01_19:
    speaker: "<Narration>"
    en: Cinderella picks up something lying next to the luggage.
    ko: 신데렐라는 짐 옆에 떨어진 무언가를 집어 들었다.
    ja: |-
      シンデレラは荷物のそばに
      落ちていた物を拾い上げた
  d_nikke_cinderella_crystalwave_01_20:
    speaker: cinderella_s
    en: Amor Tetra?
    ko: 아모르 테트라?
    ja: アモール…テトラ？
  d_nikke_cinderella_crystalwave_01_21:
    speaker: rapi_red
    en: It's a magazine.
    ko: 잡지야.
    ja: 雑誌よ。
  d_nikke_cinderella_crystalwave_01_22:
    speaker: cinderella_s
    en: A magazine?
    ko: 잡지?
    ja: 雑誌？
  d_nikke_cinderella_crystalwave_01_23:
    speaker: rapi_red
    en: Yeah, it's published by Tetra Line.
    ko: 응, 테트라 라인에서 출간하는 잡지.
    ja: ええ、テトララインが出版している雑誌。
  d_nikke_cinderella_crystalwave_01_24:
    speaker: rapi_red
    en: It features fashion spreads and all sorts of interesting articles.
    ko: 패션 화보와 각종 흥미로운 정보들이 담겨있어.
    ja: |-
      ファッション特集とか、
      いろいろな面白い情報が載っているの。
  d_nikke_cinderella_crystalwave_01_25:
    speaker: rapi_red
    en: A new issue just came out, so I guess the Commander picked it up.
    ko: 이번에 신간이 나와서 지휘관이 챙겨왔나 봐.
    ja: |-
      最近、新刊が出たから
      指揮官が持ってきたようね。
  d_nikke_cinderella_crystalwave_01_26:
    speaker: cinderella_s
    en: May I read it?
    ko: 이거, 읽어봐도 될까?
    ja: これ、借りてもいいかしら？
  d_nikke_cinderella_crystalwave_01_27:
    speaker: rapi_red
    en: Sure. Just make sure to put it back when you're done.
    ko: 응, 다 읽고 제자리에만 넣어둬.
    ja: ええ。読み終わったら、そこに置いておいて。
  d_nikke_cinderella_crystalwave_01_28:
    speaker: "<Narration>"
    en: Rapi leaves.
    ko: 라피가 떠나갔다.
    ja: ラピが去っていった
  d_nikke_cinderella_crystalwave_01_29:
    speaker: "<Narration>"
    en: Cinderella begins reading the magazine while Penguin No. 1 remains by her
      side.
    ko: 신데렐라는 그 자리에서 잡지를 읽기 시작했고 펭군 1호는 그 곁을 지켰다.
    ja: |-
      シンデレラはその場で雑誌を読み始め、
      ペンくん1号はそのそばで
      シンデレラを見守っている
  d_nikke_cinderella_crystalwave_01_30:
    speaker: "<Narration>"
    en: The pages rustle softly.
    ko: 팔랑-
    ja: パラッ
  d_nikke_cinderella_crystalwave_01_31:
    speaker: "<Narration>"
    en: '"7 Ways to Capture a Prince"'
    ko: "[나만의 왕자님을 사로잡는 7가지 방법]"
    ja: "「私だけの王子様を射止める7つの方法」"
  d_nikke_cinderella_crystalwave_01_32:
    speaker: cinderella_s
    en: Hm...? A prince?
    ko: 음…? 왕자님?
    ja: え…？王子様？
  d_nikke_cinderella_crystalwave_01_33:
    speaker: cinderella_s
    en: Why does this have instructions on how to win over a prince?
    ko: 왜 왕자님을 사로잡는 방법이 여기에 적혀있는 거지?
    ja: |-
      どうして王子様を射止める方法が
      こんなところに書いてあるのかしら？
  d_nikke_cinderella_crystalwave_01_34:
    speaker: "<Narration>"
    en: Cinderella flips a page.
    ko: 팔랑-
    ja: パラッ
  d_nikke_cinderella_crystalwave_01_35:
    speaker: "<Narration>"
    en: '"Ladies, are you waiting around for Prince Charming to come to you?"'
    ko: "[여러분, 왕자님이 먼저 다가오길 기다리고만 있진 않나요?]"
    ja: |-
      「王子様がやってくるのを
      　ただ待っているだけですか？」
  d_nikke_cinderella_crystalwave_01_36:
    speaker: "<Narration>"
    en: '"Love doesn''t come to those who wait."'
    ko: "[사랑은 가만히 기다린다고 찾아오는 게 아니에요.]"
    ja: |-
      「愛は、ただじっと待っていれば
      　訪れるものではありません」
  d_nikke_cinderella_crystalwave_01_37:
    speaker: "<Narration>"
    en: '"Sometimes it smiles on the person who''s brave enough to approach the other."'
    ko: "[때로는 용기 내어 먼저 다가간 사람에게 먼저 미소 짓기도 하죠.]"
    ja: |-
      「時には勇気を出して近づけば、
      　向こうから微笑みかけてくれることも」
  d_nikke_cinderella_crystalwave_01_38:
    speaker: "<Narration>"
    en: '"Today, let''s look at a few special ways to turn that uncertain distance
      into sparks."'
    ko: "[오늘은 그 사람과의 애매한 거리를 설렘으로 바꿔줄 특별한 방법들을 알려드릴게요.]"
    ja: |-
      「今日は、あの人とのアイマイな
      　関係をトキメキに変える、
      　とっておきの方法をご紹介します」
  d_nikke_cinderella_crystalwave_01_39:
    speaker: "<Narration>"
    en: Cinderella flips a page.
    ko: 팔랑-
    ja: パラッ
  d_nikke_cinderella_crystalwave_01_40:
    speaker: "<Narration>"
    en: '"Step 1: Let your hands do the talking."'
    ko: "[STEP1. 손은 마음보다 먼저 닿는 고백입니다.]"
    ja: |-
      「STEP1.
      　手は心よりも先に想いを届けてくれます」
  d_nikke_cinderella_crystalwave_01_41:
    speaker: "<Narration>"
    en: '"If you can''t quite find the words, start with a gentle touch."'
    ko: "[말로 마음을 전하기 어렵다면, 손끝부터 시작해 보세요.]"
    ja: |-
      「言葉で気持ちを伝えられないなら、
      　まずは指先から始めてみましょう」
  d_nikke_cinderella_crystalwave_01_42:
    speaker: "<Narration>"
    en: '"The moment you take his hand, the distance between you will feel just a
      little smaller."'
    ko: "[자연스럽게 손을 잡는 순간, 두 사람의 거리는 한 뼘 더 가까워질 겁니다.]"
    ja: |-
      「自然に手がつながれた瞬間、
      　二人の距離はほんの少し縮まるはずです」
  d_nikke_cinderella_crystalwave_01_43:
    speaker: cinderella_s
    en: Take his hand?
    ko: 손잡기, 라.
    ja: 手をつなぐ、ね。
  d_nikke_cinderella_crystalwave_01_44:
    speaker: cinderella_s
    en: When was the last time I held Prince's hand?
    ko: 왕자님이랑 언제 마지막으로 손을 잡아봤더라?
    ja: |-
      王子様と最後に手をつないだのは
      いつだったかしら？
  d_nikke_cinderella_crystalwave_01_45:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_01_46:
    speaker: cinderella_s
    en: No, wait... That can't be right.
    ko: 아니, 잠깐. 그럴 리가….
    ja: ううん、待って。そんなはずは…
  d_nikke_cinderella_crystalwave_01_47:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_01_48:
    speaker: cinderella_s
    en: Oh my...
    ko: "…어머나."
    ja: "…あら。"
  d_nikke_cinderella_crystalwave_01_49:
    speaker: cinderella_s
    en: Now that I think about it...
    ko: 그러고 보니, 나 정말로….
    ja: そういえば、私今まで…
  d_nikke_cinderella_crystalwave_01_50:
    speaker: cinderella_s
    en: I've never actually held Prince's hand before.
    ko: 왕자님이랑 한 번도 손을 제대로 잡아본 적이 없구나?
    ja: 一度も王子様と手をつないだことがないわ。
  d_nikke_cinderella_crystalwave_01_51:
    speaker: peng1
    en: Peng.
    ko: 페엥.
    ja: ペーン。
  d_nikke_cinderella_crystalwave_01_52:
    speaker: cinderella_s
    en: Shocking, isn't it?
    ko: 조금 충격이네.
    ja: 少しショックね…
  d_nikke_cinderella_crystalwave_01_53:
    speaker: cinderella_s
    en: This won't do.
    ko: 이대론 안 되겠어.
    ja: このままじゃいけないわ。
  d_nikke_cinderella_crystalwave_01_54:
    speaker: cinderella_s
    en: I'll have to take a much closer look.
    ko: 아무래도 더 꼼꼼하게 잘 읽어봐야겠는걸.
    ja: もっとしっかり読んでみましょう。
  d_nikke_cinderella_crystalwave_01_55:
    speaker: "<Narration>"
    en: As if on cue, Penguin No. 1 walks over to the luggage, returns carrying a
      deck chair,
    ko: 그 말에 펭군 1호가 짐 쪽으로 다가가 선베드를 들고 왔다.
    ja: |-
      その言葉を聞いたペンくん1号が
      荷物の中からサンベッドを引っ張ってきた
  d_nikke_cinderella_crystalwave_01_56:
    speaker: "<Narration>"
    en: and snaps it open.
    ko: 촤악-
    ja: バサッ
  d_nikke_cinderella_crystalwave_01_57:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_01_58:
    speaker: cinderella_s
    en: Oh, is that for me to sit in while I read?
    ko: 아, 여기서 편하게 보라고?
    ja: ここでリラックスして読んでってことかしら？
  d_nikke_cinderella_crystalwave_01_59:
    speaker: cinderella_s
    en: Thank you.
    ko: 고마워.
    ja: ありがとう。
  d_nikke_cinderella_crystalwave_01_60:
    speaker: "<Narration>"
    en: Cinderella reclines gracefully on the deck chair
    ko: 우아하게 선베드에 누운 신데렐라는.
    ja: シンデレラは優雅にサンベッドに横たわった
  d_nikke_cinderella_crystalwave_01_61:
    speaker: "<Narration>"
    en: and goes back to reading her magazine.
    ko: 다시 잡지를 정독하기 시작했다.
    ja: そして再び、雑誌を熱心に読み始めた
d_nikke_cinderella_crystalwave_02:
  d_nikke_cinderella_crystalwave_02_1:
    speaker: "<Narration>"
    en: With a snap,
    ko: 탁-
    ja: パタンッ
  d_nikke_cinderella_crystalwave_02_2:
    speaker: "<Narration>"
    en: Cinderella closes the magazine.
    ko: 신데렐라는 잡지를 덮었다.
    ja: シンデレラは雑誌を閉じた
  d_nikke_cinderella_crystalwave_02_3:
    speaker: cinderella_s
    en: Okay, let's think this through.
    ko: 그러니까, 정리하자면.
    ja: つまり…
  d_nikke_cinderella_crystalwave_02_4:
    speaker: cinderella_s
    en: First, I need to find a natural way to hold his hand.
    ko: 우선은 자연스럽게 손을 잡으면 된다는 거네.
    ja: まずは、自然に手をつなげばいいのね。
  d_nikke_cinderella_crystalwave_02_5:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_6:
    speaker: cinderella_s
    en: Holding hands isn't the hard part.
    ko: 손잡는 거 정도야 뭐, 어려울 것 없지만.
    ja: |-
      手をつなぐくらいなら、
      そんなに難しいことではないけれど…
  d_nikke_cinderella_crystalwave_02_7:
    speaker: cinderella_s
    en: The tricky part is making it look natural.
    ko: 자연스럽게 부분이 좀 걸려.
    ja: 自然に、というのが引っかかるわ。
  d_nikke_cinderella_crystalwave_02_8:
    speaker: cinderella_s
    en: Maybe I should go find the Prince first.
    ko: 우선은 왕자님을 찾으러 가볼까?
    ja: まずは王子様を探しに行きましょう。
  d_nikke_cinderella_crystalwave_02_9:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして
  d_nikke_cinderella_crystalwave_02_10:
    speaker: cinderella_s
    en: There you are, Prince.
    ko: 왕자님, 여기 있었네.
    ja: 王子様、ここにいたのね。
  d_nikke_cinderella_crystalwave_02_11:
    speaker: cinderella_s
    en: What have you been doing?
    ko: 뭐 하고 있었어?
    ja: 何をしていたの？
  d_nikke_cinderella_crystalwave_02_12:
    speaker: "<Self>"
    en: I was thinking of going for a walk.
    ko: 산책이나 할까 했는데.
    ja: 散歩に行くところだ
  d_nikke_cinderella_crystalwave_02_13:
    speaker: cinderella_s
    en: Very well, I shall join you.
    ko: 좋아, 그럼 같이 가자.
    ja: そう。なら、一緒に行きましょう。
  d_nikke_cinderella_crystalwave_02_14:
    speaker: "<Monologue>"
    en: Cinderella and I begin strolling slowly along the beach.
    ko: 신데렐라와 함께 해변을 따라 천천히 걷기 시작했다.
    ja: |-
      シンデレラと一緒に海岸沿いを
      ゆっくりと歩き始めた
  d_nikke_cinderella_crystalwave_02_15:
    speaker: "<Monologue>"
    en: Oddly enough, she seems to be sticking closer to me than usual.
    ko: 묘하게 신데렐라가 평소보다 더 가까이 밀착해 걷는 느낌이다.
    ja: やけにいつもより距離が近い気がするが…
  d_nikke_cinderella_crystalwave_02_16:
    speaker: "<Monologue>"
    en: Or maybe it's just my imagination.
    ko: 기분 탓인가.
    ja: 気のせいだろうか
  d_nikke_cinderella_crystalwave_02_17:
    speaker: cinderella_s
    en: Prince, can you hold out your hand?
    ko: 왕자님, 손 좀 내밀어 볼래?
    ja: 王子様、手を出してくれる？
  d_nikke_cinderella_crystalwave_02_18:
    speaker: "<Self>"
    en: My hand?
    ko: 손?
    ja: 手を？
  d_nikke_cinderella_crystalwave_02_19:
    speaker: "<Self>"
    en: Like this?
    ko: 이렇게?
    ja: こうか？
  d_nikke_cinderella_crystalwave_02_20:
    speaker: cinderella_s
    en: Yes, just like that.
    ko: 응, 그렇게.
    ja: ええ、そうね。
  d_nikke_cinderella_crystalwave_02_21:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_02_22:
    speaker: cinderella_s
    en: Your hand is so big.
    ko: 왕자님은 손이 크구나.
    ja: 王子様の手は大きいのね。
  d_nikke_cinderella_crystalwave_02_23:
    speaker: cinderella_s
    en: I'd like to see how they compare to mine.
    ko: 내 손이랑 한번 비교해 보고 싶어.
    ja: 私の手と比べてみたいわ。
  d_nikke_cinderella_crystalwave_02_24:
    speaker: "<Monologue>"
    en: Just as Cinderella's hand was drawing closer to mine...
    ko: 신데렐라의 손이 내 손위로 다가오던 그때.
    ja: |-
      シンデレラの手が
      私の手に触れようとしたその時
  d_nikke_cinderella_crystalwave_02_25:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_26:
    speaker: "<Monologue>"
    en: Penguin No. 1 stretches out a wing and places it on my hand.
    ko: 펭군 1호가 날개를 뻗어 내 손에 얹었다.
    ja: |-
      ペンくん1号が翼を広げて
      私の手の上に乗った
  d_nikke_cinderella_crystalwave_02_27:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_02_28:
    speaker: cinderella_s
    en: Oh...
    ko: "…앗."
    ja: "…あっ。"
  d_nikke_cinderella_crystalwave_02_29:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_30:
    speaker: cinderella_s
    en: My first attempt ended in failure.
    ko: 첫 번째 시도, 실패네.
    ja: 最初の作戦は…失敗ね。
  d_nikke_cinderella_crystalwave_02_31:
    speaker: "<Self>"
    en: What was that?
    ko: 뭐라고?
    ja: 何か言ったか？
  d_nikke_cinderella_crystalwave_02_32:
    speaker: cinderella_s
    en: Nothing.
    ko: 아냐, 아무것도.
    ja: ううん、何でもないわ。
  d_nikke_cinderella_crystalwave_02_33:
    speaker: "<Monologue>"
    en: Cinderella lets out a small sigh and starts walking again.
    ko: 신데렐라는 작게 한숨을 내쉬며 다시 걷기 시작했다.
    ja: |-
      そう言って、シンデレラは小さくため息をつくと
      再び歩き始めた
  d_nikke_cinderella_crystalwave_02_34:
    speaker: "<Narration>"
    en: "*Squish*"
    ko: 말랑-
    ja: ムニュッ
  d_nikke_cinderella_crystalwave_02_35:
    speaker: "<Monologue>"
    en: Penguin No. 1's wing feels soft in my hand.
    ko: 손에 잡힌 펭군 1호의 날개가 부드럽다.
    ja: ペンくん1号の羽の柔らかな感触が伝わってくる
  d_nikke_cinderella_crystalwave_02_36:
    speaker: "<Narration>"
    en: "*Smack*"
    ko: 탁-
    ja: バッ
  d_nikke_cinderella_crystalwave_02_37:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_38:
    speaker: "<Monologue>"
    en: It bats my hand away and waddles after Cinderella.
    ko: 펭군 1호가 내 손을 뿌리치고 신데렐라를 따라가 버린다.
    ja: |-
      ペンくん1号が私の手を振りほどき、
      シンデレラを追いかけて行ってしまった
  d_nikke_cinderella_crystalwave_02_39:
    speaker: "<Self>"
    en: But you took my hand first...
    ko: 아니… 네가 먼저 잡았잖아….
    ja: いや…君が先につないできたんじゃないか…
  d_nikke_cinderella_crystalwave_02_40:
    speaker: "<Monologue>"
    en: A moment later, Cinderella stops in her tracks, as though she's discovered
      something.
    ko: 잠시 후, 앞서가던 신데렐라가 무언가를 발견한 듯 발걸음을 멈추었다.
    ja: |-
      しばらくして、先を歩いていたシンデレラが
      何かを見つけたように足を止めた
  d_nikke_cinderella_crystalwave_02_41:
    speaker: cinderella_s
    en: Look at that, Prince.
    ko: 저것 좀 봐, 왕자님.
    ja: 王子様、あれを見て。
  d_nikke_cinderella_crystalwave_02_42:
    speaker: "<Self>"
    en: What is it?
    ko: 뭔데?
    ja: どうした？
  d_nikke_cinderella_crystalwave_02_43:
    speaker: cinderella_s
    en: Look at that shell. Isn't that color beautiful?
    ko: 저기 있는 조개껍데기, 색이 너무 아름답지 않아?
    ja: |-
      そこに落ちている貝殻、
      とても美しいと思わない？
  d_nikke_cinderella_crystalwave_02_44:
    speaker: cinderella_s
    en: I've never seen a shade quite so mysterious before.
    ko: 저런 신비한 색은 처음 봐.
    ja: あんなに神秘的な色は初めて見たわ。
  d_nikke_cinderella_crystalwave_02_45:
    speaker: "<Self>"
    en: Wow, you're right. It's pretty.
    ko: 오오, 그러게. 예쁘다.
    ja: ああ、そうだな。きれいだ
  d_nikke_cinderella_crystalwave_02_46:
    speaker: "<Monologue>"
    en: Just as we both reach for the shell...
    ko: 동시에 조개껍데기에 손을 뻗은 그때.
    ja: |-
      二人同時に貝殻に手を伸ばした、
      ちょうどその瞬間
  d_nikke_cinderella_crystalwave_02_47:
    speaker: "<Narration>"
    en: "*Snatch*"
    ko: 탁-
    ja: バッ
  d_nikke_cinderella_crystalwave_02_48:
    speaker: "<Monologue>"
    en: Penguin No. 1 darts in, snatches up the shell with its beak, and proudly presents
      it to Cinderella.
    ko: |-
      펭군 1호가 잽싸게 조개껍데기를 부리로 집어,
      자랑스럽게 신데렐라에게 내밀었다.
    ja: |-
      ペンくん1号が素早く貝殻をくちばしでくわえ、
      誇らしげにシンデレラへと差し出した
  d_nikke_cinderella_crystalwave_02_49:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_50:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_02_51:
    speaker: cinderella_s
    en: Th-thank you.
    ko: 고, 고마워.
    ja: あ、ありがとう。
  d_nikke_cinderella_crystalwave_02_52:
    speaker: "<Monologue>"
    en: After that, Cinderella makes several more suggestions...
    ko: 그 이후로도, 신데렐라가 몇 가지 제안을 해왔지만.
    ja: |-
      それ以降も、シンデレラから
      何か言われるたびに…
  d_nikke_cinderella_crystalwave_02_53:
    speaker: cinderella_s
    en: Prince, can you help me carry this?
    ko: 왕자님, 이것 좀 같이 들어줄래?
    ja: 王子様、これを一緒に聴いてみない？
  d_nikke_cinderella_crystalwave_02_54:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_55:
    speaker: cinderella_s
    en: Prince, look over here.
    ko: 왕자님, 여기 좀 봐줄래?
    ja: 王子様、ちょっとここを見てくれる？
  d_nikke_cinderella_crystalwave_02_56:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_02_57:
    speaker: "<Monologue>"
    en: But Penguin No. 1 interferes every single time.
    ko: 번번이 펭군 1호가 끼어들었다.
    ja: "…ペンくん1号が割って入った"
  d_nikke_cinderella_crystalwave_02_58:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_02_59:
    speaker: "<Self>"
    en: Cinderella, are you okay?
    ko: 신데렐라, 괜찮아?
    ja: シンデレラ、大丈夫か？
  d_nikke_cinderella_crystalwave_02_60:
    speaker: "<Self>"
    en: It seems like you've been wanting to say something.
    ko: 아까부터 뭔가 하고 싶은 거 아니야?
    ja: |-
      さっきから、何かやりたいことが
      あるんじゃないのか？
  d_nikke_cinderella_crystalwave_02_61:
    speaker: "<Self>"
    en: You can tell me.
    ko: 직접 이야기해 줘.
    ja: よかったら話してくれ
  d_nikke_cinderella_crystalwave_02_62:
    speaker: cinderella_s
    en: No...
    ko: "…그건."
    ja: "…それは…"
  d_nikke_cinderella_crystalwave_02_63:
    speaker: cinderella_s
    en: It wouldn't be natural if I did that.
    ko: 자연스럽게 해야 해서 안 돼.
    ja: 自然にそうならないといけないの、言えないわ。
  d_nikke_cinderella_crystalwave_02_64:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: ん？
  d_nikke_cinderella_crystalwave_02_65:
    speaker: cinderella_s
    en: "*Sigh...* We should get going."
    ko: "…하아, 오늘은 이만 돌아갈까."
    ja: "…はぁ、今日はこれで戻ろうかしら。"
  d_nikke_cinderella_crystalwave_02_66:
    speaker: cinderella_s
    en: Ah!
    ko: 앗!
    ja: きゃっ！
  d_nikke_cinderella_crystalwave_02_67:
    speaker: "<Narration>"
    en: Cinderella trips,
    ko: 탁-
    ja: グイッ
  d_nikke_cinderella_crystalwave_02_68:
    speaker: "<Monologue>"
    en: but I catch her before she falls.
    ko: 발을 헛디딘 신데렐라를 잡아주었다.
    ja: |-
      足がもつれたシンデレラを
      とっさに捕まえた
  d_nikke_cinderella_crystalwave_02_69:
    speaker: "<Self>"
    en: Are you okay?
    ko: 괜찮아?
    ja: 大丈夫か？
  d_nikke_cinderella_crystalwave_02_70:
    speaker: cinderella_s
    en: Yes, I'm...
    ko: 응, 괜찮….
    ja: ええ、大丈…
  d_nikke_cinderella_crystalwave_02_71:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_02_72:
    speaker: cinderella_s
    en: You're holding my hand.
    ko: "…손, 잡아줬네."
    ja: "…手をつないでくれたのね。"
  d_nikke_cinderella_crystalwave_02_73:
    speaker: "<Self>"
    en: Oh, I was afraid you might fall. I'll let go.
    ko: |-
      아, 넘어질 것 같아서.
      금방 뺄게.
    ja: |-
      ああ、転びそうだったからな。
      すぐに離す
  d_nikke_cinderella_crystalwave_02_74:
    speaker: "<Narration>"
    en: Cinderella tightens her grip
    ko: 꽈악-
    ja: ギュッ
  d_nikke_cinderella_crystalwave_02_75:
    speaker: "<Monologue>"
    en: and interlaces her fingers through mine, locking our hands together even more
      tightly.
    ko: 신데렐라가 그대로 깍지를 껴서, 손이 더 깊이 맞잡혔다.
    ja: |-
      シンデレラがそのまま指を絡ませると
      二人の手はより深く絡み合った
  d_nikke_cinderella_crystalwave_02_76:
    speaker: "<Self>"
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_cinderella_crystalwave_02_77:
    speaker: cinderella_s
    en: Your hand... is so large and warm.
    ko: 왕자님의 손… 크고 따뜻하네, 후후.
    ja: 王子様の手…大きくて温かいのね、ふふ。
  d_nikke_cinderella_crystalwave_02_78:
    speaker: cinderella_s
    en: Would you mind if we stayed like this a little longer?
    ko: 이대로 조금만 더 잡고 있어 줄래?
    ja: このまま、もう少しだけつないでいてもいい？
  d_nikke_cinderella_crystalwave_02_79:
    speaker: "<Self>"
    en: I don't mind...
    ko: "…그래."
    ja: "…ああ"
  d_nikke_cinderella_crystalwave_02_80:
    speaker: "<Monologue>"
    en: We stroll along the beach, hand in hand.
    ko: 우리는 그대로 손을 맞잡은 채 해변을 거닐었다.
    ja: 私たちは手をつないだまま、浜辺を散歩した
d_nikke_cinderella_crystalwave_03:
  d_nikke_cinderella_crystalwave_03_1:
    speaker: "<Monologue>"
    en: The next day,
    ko: 다음 날.
    ja: 翌日
  d_nikke_cinderella_crystalwave_03_2:
    speaker: "<Monologue>"
    en: I see Cinderella waving to me near the boat.
    ko: 배 근처에서 신데렐라가 손을 흔드는 모습이 보였다.
    ja: |-
      船の近くで手を振っている
      シンデレラが見えた
  d_nikke_cinderella_crystalwave_03_3:
    speaker: cinderella_s
    en: Over here, Prince.
    ko: 왕자님, 여기야.
    ja: 王子様、ここよ。
  d_nikke_cinderella_crystalwave_03_4:
    speaker: cinderella_s
    en: Let's see, the next step is...
    ko: 어디 보자, 그다음 단계는….
    ja: ええと、次のステップは…
  d_nikke_cinderella_crystalwave_03_5:
    speaker: "<Narration>"
    en: '"Step 2: Share Something Sweet"'
    ko: "[STEP2. 달콤함을 나누세요.]"
    ja: "「STEP2. 甘いものをシェアしましょう」"
  d_nikke_cinderella_crystalwave_03_6:
    speaker: "<Narration>"
    en: '"Enjoy a sweet dessert together and savor the little moments of tasting the
      same flavor."'
    ko: "[함께 달콤한 디저트를 먹고, 같은 맛을 느끼는 사소한 순간.]"
    ja: |-
      「一緒に甘いスイーツを食べて、
      　同じ味を分かち合う
      　ささやかなひとときを過ごしましょう」
  d_nikke_cinderella_crystalwave_03_7:
    speaker: "<Narration>"
    en: '"Before you know it, those shared moments will blossom into a special connection."'
    ko: "[그런 경험들이 쌓이면 어느새 두 사람 사이에는 특별한 공감이 생겨날 거예요.]"
    ja: |-
      「そうした経験を積み重ねていけば、
      　いつしか二人の間には
      　特別な絆が生まれることでしょう」
  d_nikke_cinderella_crystalwave_03_8:
    speaker: cinderella_s
    en: A sweet dessert...
    ko: 달콤한 디저트….
    ja: 甘いスイーツ…
  d_nikke_cinderella_crystalwave_03_9:
    speaker: "<Self>"
    en: Shaved ice? What's the occasion?
    ko: 빙수네? 웬 거야?
    ja: かき氷？いきなりどうしたんだ？
  d_nikke_cinderella_crystalwave_03_10:
    speaker: cinderella_s
    en: I wanted to try it, so I asked Grave to make some for me.
    ko: 먹어보고 싶어서, 그레이브에게 부탁했어.
    ja: 食べてみたくて、グレイブに頼んだの。
  d_nikke_cinderella_crystalwave_03_11:
    speaker: "<Self>"
    en: So all you had to do was ask, huh?
    ko: 부탁하면 나오는구나….
    ja: 頼んだら出てくるものなのか…
  d_nikke_cinderella_crystalwave_03_12:
    speaker: cinderella_s
    en: It's a little too much for me to finish alone,
    ko: 혼자 먹기에는 양이 좀 많은 것 같아서.
    ja: 一人で食べるには量が多すぎるから、
  d_nikke_cinderella_crystalwave_03_13:
    speaker: cinderella_s
    en: so I asked you to join me, Prince.
    ko: 같이 먹으려고 불렀어, 왕자님.
    ja: 一緒に食べようと思って呼んだのよ。
  d_nikke_cinderella_crystalwave_03_14:
    speaker: cinderella_s
    en: Come, have a seat.
    ko: 여기 앉아.
    ja: ここに座って。
  d_nikke_cinderella_crystalwave_03_15:
    speaker: "<Self>"
    en: Sure, thanks.
    ko: 그래, 고마워.
    ja: そうか、ありがとう
  d_nikke_cinderella_crystalwave_03_16:
    speaker: "<Self>"
    en: Hm? But there's only one spoon.
    ko: 음? 그런데… 스푼이 하나뿐인데?
    ja: |-
      ん？でも…
      スプーンが1つしかないな
  d_nikke_cinderella_crystalwave_03_17:
    speaker: cinderella_s
    en: Oh, you're right.
    ko: 어머나, 그러네.
    ja: あら、本当ね。
  d_nikke_cinderella_crystalwave_03_18:
    speaker: "<Self>"
    en: Should I go get another?
    ko: 하나 더 가져올까?
    ja: もう1つ持ってこようか？
  d_nikke_cinderella_crystalwave_03_19:
    speaker: cinderella_s
    en: No, Prince. There's no need.
    ko: 아냐, 왕자님. 그럴 필요 없어.
    ja: いいえ。その必要はないわ。
  d_nikke_cinderella_crystalwave_03_20:
    speaker: cinderella_s
    en: We can both share this one.
    ko: 하나로 같이 나눠 먹으면 되잖아.
    ja: このスプーンで一緒に食べればいいもの。
  d_nikke_cinderella_crystalwave_03_21:
    speaker: "<Self>"
    en: Are you okay with that?
    ko: 괜찮겠어?
    ja: いいのか？
  d_nikke_cinderella_crystalwave_03_22:
    speaker: cinderella_s
    en: Of course.
    ko: 물론이지.
    ja: もちろんよ。
  d_nikke_cinderella_crystalwave_03_23:
    speaker: cinderella_s
    en: You can have the first bite, Prince.
    ko: 왕자님 먼저 줄게.
    ja: 私が食べさせてあげるわね。
  d_nikke_cinderella_crystalwave_03_24:
    speaker: "<Narration>"
    en: Cinderella scoops up a spoonful of shaved ice
    ko: 푹-
    ja: サクッ
  d_nikke_cinderella_crystalwave_03_25:
    speaker: "<Monologue>"
    en: and holds it out to me.
    ko: 신데렐라는 스푼으로 빙수를 한입 떠 내게 내밀었다.
    ja: |-
      シンデレラはスプーンでかき氷をすくい、
      私の前に差し出した
  d_nikke_cinderella_crystalwave_03_26:
    speaker: cinderella_s
    en: Say ahh.
    ko: 자, 아- 해봐.
    ja: はい、あ～ん。
  d_nikke_cinderella_crystalwave_03_27:
    speaker: "<Self>"
    en: Ahh...
    ko: "…아."
    ja: "…あ～ん"
  d_nikke_cinderella_crystalwave_03_28:
    speaker: "<Narration>"
    en: "*Chomp*"
    ko: 텁석-
    ja: ガブッ！
  d_nikke_cinderella_crystalwave_03_29:
    speaker: "<Monologue>"
    en: Penguin No. 1 eats the shaved ice right off the spoon.
    ko: 펭군 1호가 스푼에 있는 빙수를 먹어버렸다.
    ja: |-
      ペンくん1号がスプーンに盛られていた
      かき氷を食べてしまった
  d_nikke_cinderella_crystalwave_03_30:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_03_31:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_03_32:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_03_33:
    speaker: cinderella_s
    en: You're... acting just like you did yesterday.
    ko: 너… 어제도 그러더니.
    ja: あなた…昨日も…
  d_nikke_cinderella_crystalwave_03_34:
    speaker: "<Self>"
    en: Seems like Penguin No. 1 wanted a taste too.
    ko: 펭군 1호도 먹고 싶었나 봐.
    ja: ペンくん1号も食べたかったんだな
  d_nikke_cinderella_crystalwave_03_35:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_03_36:
    speaker: cinderella_s
    en: I see.
    ko: 그렇구나.
    ja: "…そうだったのね。"
  d_nikke_cinderella_crystalwave_03_37:
    speaker: cinderella_s
    en: All right, then I'll go get another one.
    ko: 알았어, 그럼 하나 받아올게.
    ja: じゃあ、もう1つもらってくるわ。
  d_nikke_cinderella_crystalwave_03_38:
    speaker: grave_p
    en: There's no need.
    ko: 그럴 필요 없다.
    ja: その必要はない。
  d_nikke_cinderella_crystalwave_03_39:
    speaker: "<Self>"
    en: Wh-when did you get here?!
    ko: 어, 언제 왔어?!
    ja: い、いつからいたんだ！？
  d_nikke_cinderella_crystalwave_03_40:
    speaker: grave_p
    en: Just now.
    ko: 방금 전에.
    ja: つい先ほどだ。
  d_nikke_cinderella_crystalwave_03_41:
    speaker: grave_p
    en: Here, I brought you one.
    ko: 여기, 가져왔다.
    ja: ほら、かき氷だ。
  d_nikke_cinderella_crystalwave_03_42:
    speaker: cinderella_s
    en: Thank you, Grave.
    ko: 고마워, 그레이브.
    ja: 助かったわ、グレイブ。
  d_nikke_cinderella_crystalwave_03_43:
    speaker: "<Self>"
    en: "... How'd you know to bring this?"
    ko: "…어떻게 알고 가져온 거야?"
    ja: "…なぜ、かき氷が必要だと分かったんだ？"
  d_nikke_cinderella_crystalwave_03_44:
    speaker: grave_p
    en: When it comes to Cinderella, I just know.
    ko: 신데렐라에 대한 건 늘 알 수 있다.
    ja: |-
      シンデレラのことなら、
      いつでも、何でも分かる。
  d_nikke_cinderella_crystalwave_03_45:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_03_46:
    speaker: grave_p
    en: I'm heading back to training.
    ko: 그럼 난 다시 훈련하러 간다.
    ja: では、訓練に戻る。
  d_nikke_cinderella_crystalwave_03_47:
    speaker: "<Monologue>"
    en: Grave disappears into the distance.
    ko: 그레이브가 멀어졌다.
    ja: グレイブが去っていった
  d_nikke_cinderella_crystalwave_03_48:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_03_49:
    speaker: cinderella_s
    en: Here, this one's for you.
    ko: 자, 여기 네 몫이야.
    ja: さあ、これがあなたの分よ。
  d_nikke_cinderella_crystalwave_03_50:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_03_51:
    speaker: "<Monologue>"
    en: Seeing how happy the penguin is, I guess it really wanted some shaved ice.
    ko: 기뻐하는 걸 보니, 정말 먹고 싶었던 것 같다.
    ja: |-
      嬉しがっている様子を見るに、
      本当に食べたかったようだ
  d_nikke_cinderella_crystalwave_03_52:
    speaker: cinderella_s
    en: Why don't you eat it in the shade over there? It'll be much cooler.
    ko: 저쪽 나무 그늘로 가서 먹고 올래? 더 시원할 거야.
    ja: |-
      あそこの木陰で食べたらどうかしら？
      涼しそうよ。
  d_nikke_cinderella_crystalwave_03_53:
    speaker: "<Monologue>"
    en: Penguin No. 1 briefly glares at me.
    ko: 펭군 1호는 잠시 나를 흘겨보더니.
    ja: ペンくん1号はしばらく私をにらみつけると
  d_nikke_cinderella_crystalwave_03_54:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_03_55:
    speaker: "<Monologue>"
    en: It then obediently waddles over to the shade of a tree.
    ko: 순순히 나무 그늘 쪽으로 뒤뚱뒤뚱 걸어갔다.
    ja: |-
      素直に木陰の方へ
      よちよちと歩いていった
  d_nikke_cinderella_crystalwave_03_56:
    speaker: cinderella_s
    en: Now, where were we?
    ko: 그럼, 아까 어디까지 했었더라.
    ja: ええと、どこまで進んだかしら。
  d_nikke_cinderella_crystalwave_03_57:
    speaker: cinderella_s
    en: Oh dear, my shaved ice...
    ko: 이런, 빙수가….
    ja: あっ、かき氷が…
  d_nikke_cinderella_crystalwave_03_58:
    speaker: "<Monologue>"
    en: The shaved ice has melted into little more than flavored water.
    ko: 빙수는 녹아서 거의 물이 된 상태였다.
    ja: |-
      かき氷は溶けて、
      ほとんど液体になっていた
  d_nikke_cinderella_crystalwave_03_59:
    speaker: cinderella_s
    en: Prince, let me go get you a new one...
    ko: 왕자님, 내가 다시 바꿔올….
    ja: 王子様、私がまた新しいものを…
  d_nikke_cinderella_crystalwave_03_60:
    speaker: "<Narration>"
    en: I pick up the bowl
    ko: 텁석-
    ja: シャリッ！
  d_nikke_cinderella_crystalwave_03_61:
    speaker: "<Narration>"
    en: and gulp it down.
    ko: 꿀꺽.
    ja: ゴクン
  d_nikke_cinderella_crystalwave_03_62:
    speaker: cinderella_s
    en: Prince...?
    ko: "…왕자님?"
    ja: "…王子様？"
  d_nikke_cinderella_crystalwave_03_63:
    speaker: "<Self>"
    en: It's still good even melted.
    ko: 녹아도 맛있는데?
    ja: 溶けてもうまいな
  d_nikke_cinderella_crystalwave_03_64:
    speaker: "<Self>"
    en: Want a bite, Cinderella? Open wide.
    ko: |-
      신데렐라도 한입 먹어볼래?
      아- 해봐.
    ja: |-
      シンデレラも食べてみるか？
      あーん、してみろ
  d_nikke_cinderella_crystalwave_03_65:
    speaker: "<Monologue>"
    en: I scoop up a spoonful of the melted shaved ice and hold it out to Cinderella.
    ko: 녹아버린 빙수를 한입 떠서 신데렐라에게 건넸다.
    ja: |-
      溶けてしまったかき氷を一口すくい、
      シンデレラの前に差し出した
  d_nikke_cinderella_crystalwave_03_66:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_03_67:
    speaker: "<Monologue>"
    en: She accepts it and takes a bite.
    ko: 신데렐라는 빙수를 받아먹었다.
    ja: |-
      シンデレラは差し出された
      かき氷を食べた
  d_nikke_cinderella_crystalwave_03_68:
    speaker: cinderella_s
    en: Hmm, you're right.
    ko: "…음, 그러네."
    ja: "…ええ、そうね。"
  d_nikke_cinderella_crystalwave_03_69:
    speaker: cinderella_s
    en: It's really good. Sweet, too.
    ko: 정말 맛있어, 달콤하고.
    ja: 甘くて、とてもおいしい。
  d_nikke_cinderella_crystalwave_03_70:
    speaker: cinderella_s
    en: I think it tastes even sweeter when I share it with you, Prince. Hehe.
    ko: 왕자님이랑 함께 나눠 먹으니까 더 달콤하게 느껴지는 것 같아, 후후.
    ja: |-
      王子様と一緒に食べると、
      もっと甘く感じる気がするわ、ふふ。
  d_nikke_cinderella_crystalwave_03_71:
    speaker: "<Self>"
    en: Hang on, you've got something on your face.
    ko: 잠깐만, 여기 시럽이 묻었어.
    ja: 待て、ここにシロップがついている
  d_nikke_cinderella_crystalwave_03_72:
    speaker: cinderella_s
    en: I do? Where?
    ko: 응? 어디에?
    ja: え？どこかしら？
  d_nikke_cinderella_crystalwave_03_73:
    speaker: "<Monologue>"
    en: I reach out and gently wipe the corner of Cinderella's mouth with my thumb.
    ko: 손을 뻗어 신데렐라의 입가를 손끝으로 가만히 닦아주었다.
    ja: |-
      手を伸ばし、シンデレラの
      口元をそっと指先で拭いた
  d_nikke_cinderella_crystalwave_03_74:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_03_75:
    speaker: "<Monologue>"
    en: Just as I'm about to pull my hand away,
    ko: 다시 손을 떼려던 순간.
    ja: 再び指を離そうとしたその瞬間
  d_nikke_cinderella_crystalwave_03_76:
    speaker: "<Monologue>"
    en: she catches it and draws it closer, resting her cheek against my palm.
    ko: 신데렐라가 내 손을 그대로 끌어당겨, 뺨에 고개를 기울였다.
    ja: |-
      シンデレラは、そのまま私の手を
      自分の頬に引き寄せた
  d_nikke_cinderella_crystalwave_03_77:
    speaker: "<Monologue>"
    en: "... It's soft."
    ko: "…부드럽다."
    ja: "…柔らかい。"
  d_nikke_cinderella_crystalwave_03_78:
    speaker: cinderella_s
    en: You're so warm.
    ko: 따뜻하네.
    ja: それに温かいわ。
  d_nikke_cinderella_crystalwave_03_79:
    speaker: "<Self>"
    en: Cinderella?
    ko: 신데렐라…?
    ja: シンデレラ…？
  d_nikke_cinderella_crystalwave_03_80:
    speaker: cinderella_s
    en: Let's do this again sometime,
    ko: 다음에도 같이 먹자.
    ja: 次も一緒に食べましょう。
  d_nikke_cinderella_crystalwave_03_81:
    speaker: cinderella_s
    en: okay?
    ko: 알았지?
    ja: いいわね？
  d_nikke_cinderella_crystalwave_03_82:
    speaker: "<Self>"
    en: Yeah, let's.
    ko: "…좋아."
    ja: "…ああ"
d_nikke_cinderella_crystalwave_04:
  d_nikke_cinderella_crystalwave_04_1:
    speaker: "<Monologue>"
    en: After we finish our shaved ice...
    ko: 빙수를 다 먹은 후.
    ja: かき氷を食べ終わった後…
  d_nikke_cinderella_crystalwave_04_2:
    speaker: "<Self>"
    en: Where are we going?
    ko: 우리 지금 어디 가는 거야?
    ja: どこに行くんだ？
  d_nikke_cinderella_crystalwave_04_3:
    speaker: cinderella_s
    en: Somewhere nice.
    ko: 좋은 곳.
    ja: 素敵なところよ。
  d_nikke_cinderella_crystalwave_04_4:
    speaker: "<Self>"
    en: Huh?
    ko: 응?
    ja: 素敵なところ？
  d_nikke_cinderella_crystalwave_04_5:
    speaker: cinderella_s
    en: Hehe, I'm taking you to a secret place I happened to discover.
    ko: 후후, 실은 내가 우연히 알아낸 비밀 장소로 가는 중이야.
    ja: ふふ。私が偶然見つけた秘密の場所があるの。
  d_nikke_cinderella_crystalwave_04_6:
    speaker: cinderella_s
    en: I've been wanting to show it to you.
    ko: 왕자님이랑 같이 가보고 싶어서.
    ja: 王子様と一緒に行ってみたくて。
  d_nikke_cinderella_crystalwave_04_7:
    speaker: "<Self>"
    en: Okay, let's go.
    ko: 그래, 가보자.
    ja: 分かった、行こう
  d_nikke_cinderella_crystalwave_04_8:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_04_9:
    speaker: "<Narration>"
    en: '"Step 3: Get closer, just the two of you."'
    ko: "[STEP3. 단둘이서, 더 가까이.]"
    ja: |-
      「STEP3.
      　二人きりで、もっと近くに」
  d_nikke_cinderella_crystalwave_04_10:
    speaker: "<Narration>"
    en: '"Leave the hustle and bustle behind and enjoy some quiet time together."'
    ko: "[소란스러운 곳을 벗어나 두 사람만의 조용한 시간을 가져보세요.]"
    ja: |-
      「にぎやかな場所から抜け出し、
      　二人だけで静かな時間を過ごしてみては？」
  d_nikke_cinderella_crystalwave_04_11:
    speaker: "<Narration>"
    en: '"Sometimes, simply walking side by side and sharing the same view is enough
      to bring two people closer."'
    ko: "[나란히 걷고, 같은 풍경을 바라보는 것만으로도 두 사람의 거리는 한층 가까워질 거예요.]"
    ja: |-
      「並んで歩きながら、
      　同じ景色を眺めるだけで、
      　二人の距離はもっと縮まることでしょう」
  d_nikke_cinderella_crystalwave_04_12:
    speaker: cinderella_s
    en: Just the two of us...
    ko: 단둘만의 시간이라….
    ja: 二人きりの時間…
  d_nikke_cinderella_crystalwave_04_13:
    speaker: cinderella_s
    en: I like that.
    ko: "…좋네."
    ja: "…よさそうね。"
  d_nikke_cinderella_crystalwave_04_14:
    speaker: "<Monologue>"
    en: Cinderella lowers herself to Penguin No. 1's eye level.
    ko: 신데렐라가 펭군 1호에게 몸을 숙여 시선을 맞춘다.
    ja: |-
      シンデレラは身をかがめ、
      ペンくん1号と目線を合わせた
  d_nikke_cinderella_crystalwave_04_15:
    speaker: cinderella_s
    en: I have a favor to ask. Would you help me?
    ko: 부탁이 있는데, 들어줄 수 있을까?
    ja: お願いがあるのだけど、聞いてくれる？
  d_nikke_cinderella_crystalwave_04_16:
    speaker: peng1
    en: Peng?
    ko: 페엥?
    ja: ペーン？
  d_nikke_cinderella_crystalwave_04_17:
    speaker: cinderella_s
    en: Could you keep watch at this entrance and make sure no one comes through?
    ko: 여기, 이쪽 입구에서 혹시 누구 들어오는 사람이 없는지 보초를 좀 서줄래?
    ja: |-
      ここの入り口で、誰も入ってこないように
      見張りをお願いしたいの。
  d_nikke_cinderella_crystalwave_04_18:
    speaker: cinderella_s
    en: This is a very important mission.
    ko: 이건 굉장히 중요한 임무야.
    ja: とても大事な任務だから…
  d_nikke_cinderella_crystalwave_04_19:
    speaker: cinderella_s
    en: Can I count on you?
    ko: 그러니까, 부탁해도 될까?
    ja: 任せてもいいかしら？
  d_nikke_cinderella_crystalwave_04_20:
    speaker: peng1
    en: Peng!
    ko: 페엥!
    ja: ペーンッ！
  d_nikke_cinderella_crystalwave_04_21:
    speaker: "<Monologue>"
    en: Penguin No. 1 nods proudly and stands by the entrance, puffing out its chest.
    ko: |-
      펭군 1호는 의기양양한 표정으로 고개를 끄덕이더니,
      입구에 자리를 잡고 가슴을 한껏 폈다.
    ja: |-
      ペンくん1号は意気揚々とうなずくと
      入り口に立ち、得意げに胸を張った
  d_nikke_cinderella_crystalwave_04_22:
    speaker: "<Self>"
    en: Huh, it actually listened to you.
    ko: 의외로 순순히 말을 들어주네?
    ja: 意外と素直に言うことを聞くんだな？
  d_nikke_cinderella_crystalwave_04_23:
    speaker: cinderella_s
    en: They tend to be cooperative if you ask nicely.
    ko: 부탁하면 잘 들어주던걸.
    ja: お願いすれば、ちゃんと聞いてくれるわ。
  d_nikke_cinderella_crystalwave_04_24:
    speaker: cinderella_s
    en: Now then, shall we move on?
    ko: 그럼, 우리는 다시 가볼까?
    ja: 私たちは先を急ぎましょうか？
  d_nikke_cinderella_crystalwave_04_25:
    speaker: "<Monologue>"
    en: Cinderella and I make our way deeper into the jungle.
    ko: 신데렐라와 함께 정글 안쪽으로 들어갔다.
    ja: |-
      シンデレラと一緒に
      ジャングルの奥へ入った
  d_nikke_cinderella_crystalwave_04_26:
    speaker: "<Monologue>"
    en: Before long,
    ko: 조금 더 깊이 들어가자.
    ja: さらに奥へと進んでいくと…
  d_nikke_cinderella_crystalwave_04_27:
    speaker: "<Monologue>"
    en: a shimmering lake comes into view.
    ko: 눈앞에 반짝이는 호수가 펼쳐졌다.
    ja: 目の前に、きらきらと輝く湖が広がった
  d_nikke_cinderella_crystalwave_04_28:
    speaker: "<Self>"
    en: Wow... I had no idea this was here.
    ko: 와… 이런 곳이 있었어?
    ja: おお…こんな場所があったのか
  d_nikke_cinderella_crystalwave_04_29:
    speaker: cinderella_s
    en: I found this place by chance while I was out scouting.
    ko: 날아다니면서 정찰하다가 우연히 발견한 곳이야.
    ja: 空から偵察していたら、偶然見つけたのよ。
  d_nikke_cinderella_crystalwave_04_30:
    speaker: cinderella_s
    en: It was so beautiful, I wanted to show it to you.
    ko: 아름다워서, 왕자님한테 보여주고 싶었거든.
    ja: 美しいところだから、王子様に見せたかったの。
  d_nikke_cinderella_crystalwave_04_31:
    speaker: cinderella_s
    en: What do you think?
    ko: 어때?
    ja: どうかしら？
  d_nikke_cinderella_crystalwave_04_32:
    speaker: "<Self>"
    en: Absolutely gorgeous.
    ko: 정말 아름답네.
    ja: とても美しいな
  d_nikke_cinderella_crystalwave_04_33:
    speaker: "<Choice>"
    en: The lake, I mean.
    ko: 호수가.
    ja: 湖が
  d_nikke_cinderella_crystalwave_04_34:
    speaker: "<Choice>"
    en: Not the lake. You.
    ko: 네가.
    ja: 君が
  d_nikke_cinderella_crystalwave_04_35:
    speaker: cinderella_s
    en: It is, isn't it?
    ko: 그렇지?
    ja: そうでしょう？
  d_nikke_cinderella_crystalwave_04_36:
    speaker: cinderella_s
    en: Seeing you enjoy it makes me happy too.
    ko: 좋아해 주니까, 나도 좋네.
    ja: 気に入ってくれて、私も嬉しいわ。
  d_nikke_cinderella_crystalwave_04_37:
    speaker: cinderella_s
    en: I'm glad we came here together.
    ko: 같이 온 보람이 있어.
    ja: 一緒に来たかいがあるわね。
  d_nikke_cinderella_crystalwave_04_38:
    speaker: cinderella_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_cinderella_crystalwave_04_39:
    speaker: cinderella_s
    en: You're something else, Prince.
    ko: 왕자님도 참.
    ja: 王子様ったら。
  d_nikke_cinderella_crystalwave_04_40:
    speaker: cinderella_s
    en: I hear that all the time, but it means more coming from you.
    ko: 자주 듣는 이야기인데도, 왕자님한테 들으니 더 좋은 느낌이네.
    ja: |-
      聞き慣れた言葉だけれど、
      王子様に言われるとなんだかもっと嬉しいわ。
  d_nikke_cinderella_crystalwave_04_41:
    speaker: "<Monologue>"
    en: Cinderella places a hand over her heart.
    ko: 신데렐라는 자신의 가슴에 손을 얹었다.
    ja: シンデレラは自分の胸に手を当てた
  d_nikke_cinderella_crystalwave_04_42:
    speaker: cinderella_s
    en: My heart's beating faster.
    ko: 여기가 좀 더 빠르게 뛰고.
    ja: ここがもっと高鳴って…
  d_nikke_cinderella_crystalwave_04_43:
    speaker: cinderella_s
    en: I feel this warmth spreading through me.
    ko: 따듯해지는 느낌이야.
    ja: あたたかくなるみたい。
  d_nikke_cinderella_crystalwave_04_44:
    speaker: cinderella_s
    en: It'd be a shame to leave right away. Want to rest here for a bit?
    ko: 바로 돌아가긴 아쉬우니까, 잠시 쉬다 갈까?
    ja: |-
      すぐに帰るのはもったいないわ。
      もう少し休憩しましょう。
  d_nikke_cinderella_crystalwave_04_45:
    speaker: "<Self>"
    en: Sure.
    ko: 그러자.
    ja: ああ、そうしよう
  d_nikke_cinderella_crystalwave_04_46:
    speaker: "<Monologue>"
    en: I sit beside Cinderella and gaze out at the lake.
    ko: 신데렐라의 옆에 앉아 호수를 바라봤다.
    ja: |-
      シンデレラの隣に座って
      湖をながめた
  d_nikke_cinderella_crystalwave_04_47:
    speaker: "<Monologue>"
    en: It's so beautiful and peaceful.
    ko: 아름답고, 평화롭다.
    ja: 美しくて、穏やかだ
  d_nikke_cinderella_crystalwave_04_48:
    speaker: "<Narration>"
    en: A gentle weight settles against my shoulder.
    ko: 툭-
    ja: トンッ
  d_nikke_cinderella_crystalwave_04_49:
    speaker: "<Monologue>"
    en: Cinderella has rested her head on it.
    ko: 어깨에 신데렐라의 머리가 닿아왔다.
    ja: |-
      シンデレラが私の肩に
      そっと頭をのせた
  d_nikke_cinderella_crystalwave_04_50:
    speaker: "<Monologue>"
    en: Then her hand comes to rest over mine.
    ko: 그리고 신데렐라의 손이 내 손등을 덮었다.
    ja: |-
      そして、シンデレラの手が
      私の手の甲を包み込んだ
  d_nikke_cinderella_crystalwave_04_51:
    speaker: cinderella_s
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_cinderella_crystalwave_04_52:
    speaker: cinderella_s
    en: This is the first time
    ko: 처음이야.
    ja: 初めてなの。
  d_nikke_cinderella_crystalwave_04_53:
    speaker: cinderella_s
    en: I've ever spent time like this with someone.
    ko: 누군가랑, 이런 시간을 보내는 건.
    ja: 誰かと、こういう時間を過ごすのは。
  d_nikke_cinderella_crystalwave_04_54:
    speaker: cinderella_s
    en: But... I may be in trouble.
    ko: 그런데… 큰일이네.
    ja: だけど…困ったわ。
  d_nikke_cinderella_crystalwave_04_55:
    speaker: cinderella_s
    en: I'm so happy that I find myself wishing time would just stop.
    ko: 너무 좋아서, 이대로 시간이 멈췄으면 좋겠다는 생각이 들어.
    ja: |-
      あまりにも心地がよくて、このまま
      時間が止まってほしいと思ってしまうわね。
  d_nikke_cinderella_crystalwave_04_56:
    speaker: "<Self>"
    en: Cinderella...
    ko: 신데렐라….
    ja: シンデレラ…
  d_nikke_cinderella_crystalwave_04_57:
    speaker: "<Monologue>"
    en: Cinderella slowly raises her head.
    ko: 신데렐라가 천천히 고개를 들었다.
    ja: シンデレラはゆっくりと顔を上げた
  d_nikke_cinderella_crystalwave_04_58:
    speaker: "<Monologue>"
    en: Our faces are only inches apart.
    ko: 얼굴이 가까웠다.
    ja: 顔が近づく
  d_nikke_cinderella_crystalwave_04_59:
    speaker: "<Monologue>"
    en: Her grip on my hand tightens.
    ko: 손에 한층 더 깊이 힘이 실렸다.
    ja: 握る手に、さらに力がこもった
  d_nikke_cinderella_crystalwave_04_60:
    speaker: cinderella_s
    en: Prince,
    ko: 왕자님.
    ja: 王子様。
  d_nikke_cinderella_crystalwave_04_61:
    speaker: cinderella_s
    en: are you free tonight?
    ko: 오늘 저녁에도, 시간 좀 내줄래?
    ja: 今日の夜も、少し付き合ってくれるかしら？
  d_nikke_cinderella_crystalwave_04_62:
    speaker: "<Self>"
    en: Tonight?
    ko: 오늘 저녁?
    ja: 今日の夜？
  d_nikke_cinderella_crystalwave_04_63:
    speaker: cinderella_s
    en: Yes.
    ko: 응.
    ja: ええ。
  d_nikke_cinderella_crystalwave_04_64:
    speaker: cinderella_s
    en: I'll be waiting near the lighthouse.
    ko: 등대 근처에서, 기다릴 테니까.
    ja: 灯台の近くで待っているわ。
  d_nikke_cinderella_crystalwave_04_65:
    speaker: cinderella_s
    en: Do come.
    ko: 꼭 와줘.
    ja: 来てくれるわよね？
  d_nikke_cinderella_crystalwave_04_66:
    speaker: "<Self>"
    en: Okay.
    ko: 알았어.
    ja: 分かった
  d_nikke_cinderella_crystalwave_04_67:
    speaker: cinderella_s
    en: All right, it's a promise.
    ko: 좋아, 약속이야.
    ja: ええ、約束よ。
  d_nikke_cinderella_crystalwave_04_68:
    speaker: "<Monologue>"
    en: Cinderella rests her head on my shoulder once more.
    ko: 신데렐라가 다시 한번, 어깨에 머리를 기댔다.
    ja: |-
      そう言うと、シンデレラはもう一度
      私の肩に頭をのせた
d_nikke_cinderella_crystalwave_05:
  d_nikke_cinderella_crystalwave_05_1:
    speaker: cinderella_s
    en: Hmm, maybe I should read it again.
    ko: 음, 한 번 더 읽어볼까.
    ja: もう一度読んでみましょう。
  d_nikke_cinderella_crystalwave_05_2:
    speaker: "<Narration>"
    en: Cinderella pulls the magazine out of her bag and starts reading it again.
    ko: 신데렐라는 짐에서 잡지를 꺼내 다시 읽기 시작했다.
    ja: |-
      シンデレラはカバンから雑誌を
      取り出して、読み始めた
  d_nikke_cinderella_crystalwave_05_3:
    speaker: cinderella_s
    en: The next step is... I see.
    ko: 다음 단계는… 음, 그렇지.
    ja: 次は…ええと、これね。
  d_nikke_cinderella_crystalwave_05_4:
    speaker: cinderella_s
    en: So that's how I should finish it.
    ko: 마무리는 이렇게 하면 된다는 거구나.
    ja: これが最後のステップね。
  d_nikke_cinderella_crystalwave_05_5:
    speaker: "<Narration>"
    en: Cinderella flips a page.
    ko: 팔랑-
    ja: パラッ
  d_nikke_cinderella_crystalwave_05_6:
    speaker: cinderella_s
    en: Wait, there's more on the next page?
    ko: 응? 뒤에 더 있었네?
    ja: あら？後ろに続きがあったのね？
  d_nikke_cinderella_crystalwave_05_7:
    speaker: cinderella_s
    en: I've never seen this part before.
    ko: 이건 처음 보는 내용인데.
    ja: これは…初めて見る内容だわ。
  d_nikke_cinderella_crystalwave_05_8:
    speaker: cinderella_s
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_cinderella_crystalwave_05_9:
    speaker: "<Monologue>"
    en: That night, I head to the lighthouse as promised.
    ko: 그날 밤, 신데렐라와 약속한 대로 등대 근처로 향했다.
    ja: |-
      その日の夜、シンデレラとの約束通り
      灯台の近くへ向かった
  d_nikke_cinderella_crystalwave_05_10:
    speaker: "<Monologue>"
    en: Cinderella is already there, and I walk over to her, taking a seat at her
      side.
    ko: 먼저 도착해있었던 신데렐라의 옆에 자연스럽게 다가가 나란히 앉았다.
    ja: |-
      先に到着していたシンデレラの隣に近づき、
      並んで腰を下ろした
  d_nikke_cinderella_crystalwave_05_11:
    speaker: cinderella_s
    en: Prince, don't you think I've been acting a little strange lately?
    ko: 왕자님, 최근에 내 행동이 좀 이상하지 않았어?
    ja: |-
      王子様、最近私の行動が
      少しおかしいと思わなかった？
  d_nikke_cinderella_crystalwave_05_12:
    speaker: "<Choice>"
    en: Yeah, it seemed a little strange.
    ko: 좀 이상했어.
    ja: そうだな
  d_nikke_cinderella_crystalwave_05_13:
    speaker: "<Choice>"
    en: Really? I didn't notice anything off.
    ko: 그랬나? 이상하지 않았는데.
    ja: |-
      そうだったか？
      おかしいとは思わなかったな
  d_nikke_cinderella_crystalwave_05_14:
    speaker: cinderella_s
    en: Hehe, is that so?
    ko: 후후, 그랬지?
    ja: ふふ、そうでしょう？
  d_nikke_cinderella_crystalwave_05_15:
    speaker: cinderella_s
    en: I thought you might say that.
    ko: 그렇게 생각할 것 같았어.
    ja: そう思っていると思ったわ。
  d_nikke_cinderella_crystalwave_05_16:
    speaker: cinderella_s
    en: Is that so?
    ko: 정말?
    ja: 本当？
  d_nikke_cinderella_crystalwave_05_17:
    speaker: cinderella_s
    en: Well, that's a relief...
    ko: 그렇다면 다행이지만….
    ja: それならいいのだけど…
  d_nikke_cinderella_crystalwave_05_18:
    speaker: cinderella_s
    en: To tell you the truth, I was reading a magazine
    ko: 실은, 잡지를 봤는데 거기에 그런 글이 있더라구.
    ja: |-
      実は、雑誌を読んでいたら、
      ある記事が載っていたの。
  d_nikke_cinderella_crystalwave_05_19:
    speaker: cinderella_s
    en: and came across an article called "7 Ways to Capture a Prince."
    ko: "[나만의 왕자님을 사로잡는 7가지 방법] 이란 글이."
    ja: |-
      「私だけの王子様を射止める7つの方法」
      という記事。
  d_nikke_cinderella_crystalwave_05_20:
    speaker: "<Self>"
    en: So you read the latest Amor Tetra?
    ko: 아모르 테트라를 봤구나?
    ja: アモールテトラを読んだのか？
  d_nikke_cinderella_crystalwave_05_21:
    speaker: cinderella_s
    en: How did you know?
    ko: 어머, 어떻게 알았어?
    ja: あら、どうして分かったの？
  d_nikke_cinderella_crystalwave_05_22:
    speaker: "<Self>"
    en: I was the one who brought it,
    ko: 내가 가져온 잡지니까.
    ja: 私が持って来た雑誌だからな
  d_nikke_cinderella_crystalwave_05_23:
    speaker: "<Self>"
    en: so of course I've already read it.
    ko: 진즉 다 읽어봤지.
    ja: 目は通した
  d_nikke_cinderella_crystalwave_05_24:
    speaker: cinderella_s
    en: Well, that makes this easier.
    ko: 그럼 더 이야기가 빠르겠네.
    ja: それなら話が早いわね。
  d_nikke_cinderella_crystalwave_05_25:
    speaker: cinderella_s
    en: I tried the method from the magazine on you, Prince.
    ko: 거기 적힌 방법대로 왕자님한테 해본 거거든.
    ja: |-
      その雑誌に書いてあったことを、
      王子様に実践してみたの。
  d_nikke_cinderella_crystalwave_05_26:
    speaker: cinderella_s
    en: I followed the steps one by one, and when I got to the very end, I found a
      note written at the bottom.
    ko: 그렇게 단계별로 해보고 있었는데, 맨 마지막엔 그런 글이 적혀있더라?
    ja: |-
      ステップごとに試してみたのだけど、
      最後にこんなことが書かれていたわ。
  d_nikke_cinderella_crystalwave_05_27:
    speaker: "<Narration>"
    en: '"Step 7: Close the magazine."'
    ko: "[STEP7. 잡지를 덮으세요.]"
    ja: "「STEP7. 雑誌を閉じて」"
  d_nikke_cinderella_crystalwave_05_28:
    speaker: "<Narration>"
    en: '"Everything you''ve learned so far has simply been a small step toward bringing
      the two of you closer together."'
    ko: "[지금까지 알려드린 것들은 두 사람의 거리를 좁히기 위한 작은 계기일 뿐이에요.]"
    ja: |-
      「これまでのステップは、
      　二人の距離を縮めるための
      　小さなきっかけに過ぎません」
  d_nikke_cinderella_crystalwave_05_29:
    speaker: "<Narration>"
    en: '"When it comes to the feelings you truly want to share, no words or techniques
      can express them for you."'
    ko: "[정말 전하고 싶은 마음은, 어떤 말이나 방법으로도 대신할 수 없답니다.]"
    ja: |-
      「本当に伝えたい想いは、
      　どんな言葉や方法でも
      　代わりにはなりません」
  d_nikke_cinderella_crystalwave_05_30:
    speaker: "<Narration>"
    en: '"So now, look the person in front of you in the eye and tell them how you
      feel."'
    ko: "[그러니, 이제는 눈앞의 그 사람을 바라보며 직접 마음을 전해보세요.]"
    ja: |-
      「最後は目の前にいるその人を見つめながら、
      　直接気持ちを伝えてみましょう」
  d_nikke_cinderella_crystalwave_05_31:
    speaker: cinderella_s
    en: After guiding me every step of the way, the writer's telling me I have to
      handle the most important part myself.
    ko: 여기까지 차근차근 알려줘 놓고, 가장 중요한 순간엔 스스로 하라니.
    ja: |-
      今まで丁寧に教えてくれていたのに、
      一番肝心なところは「自分でやれ」だなんて。
  d_nikke_cinderella_crystalwave_05_32:
    speaker: cinderella_s
    en: That's a rather irresponsible piece of advice.
    ko: 꽤 무책임한 조언이네.
    ja: ずいぶん無責任なアドバイスね。
  d_nikke_cinderella_crystalwave_05_33:
    speaker: cinderella_s
    en: "... But I like it."
    ko: "…하지만, 마음에 들어."
    ja: "…けれど、気に入ったわ。"
  d_nikke_cinderella_crystalwave_05_34:
    speaker: cinderella_s
    en: Come to think of it, Prince, we've never even properly held hands.
    ko: 생각해 보니까, 나 왕자님이랑 손도 제대로 잡아본 적이 없더라.
    ja: |-
      考えてみたら、王子様とまともに
      手をつないだことがなかったもの。
  d_nikke_cinderella_crystalwave_05_35:
    speaker: cinderella_s
    en: Maybe that's why I was starting to get a little impatient.
    ko: 그래서 좀 조바심이 났던 것 같아.
    ja: だから、ちょっと焦っていたのかもしれないわ。
  d_nikke_cinderella_crystalwave_05_36:
    speaker: cinderella_s
    en: Funny, isn't it?
    ko: 웃기지?
    ja: おかしいわよね？
  d_nikke_cinderella_crystalwave_05_37:
    speaker: "<Self>"
    en: No, I thought it was fun.
    ko: 아니, 재밌었어.
    ja: いや、楽しかった
  d_nikke_cinderella_crystalwave_05_38:
    speaker: cinderella_s
    en: Fun?
    ko: 재밌었다고?
    ja: 楽しかった？
  d_nikke_cinderella_crystalwave_05_39:
    speaker: "<Self>"
    en: Yeah, I thought it was pretty cute to see you work harder than usual.
    ko: 응, 그리고 열심히 하는 모습이 평소랑 다르게 꽤 귀여웠어.
    ja: |-
      ああ、それに普段とは違う
      一生懸命な姿が意外とかわいかった
  d_nikke_cinderella_crystalwave_05_40:
    speaker: cinderella_s
    en: You're saying the strangest things, haha.
    ko: 뭐야, 그게. 후후.
    ja: どういう意味かしら、ふふ。
  d_nikke_cinderella_crystalwave_05_41:
    speaker: cinderella_s
    en: "... Anyway,"
    ko: "…어쨌든, 그런 이유로."
    ja: "…とにかく、そういうわけなの。"
  d_nikke_cinderella_crystalwave_05_42:
    speaker: cinderella_s
    en: that's why I want to tell you how I feel in my own way.
    ko: 내가 하고 싶은 대로 내 마음을 전하려고.
    ja: 自分なりの方法で想いを伝えたくて。
  d_nikke_cinderella_crystalwave_05_43:
    speaker: cinderella_s
    en: Will you give me your hand?
    ko: 손, 줘볼래?
    ja: 手を出してくれる？
  d_nikke_cinderella_crystalwave_05_44:
    speaker: "<Monologue>"
    en: I hold out my hand,
    ko: 손을 내밀자.
    ja: 私は手を差し出した
  d_nikke_cinderella_crystalwave_05_45:
    speaker: "<Narration>"
    en: and Cinderella clasps it tightly.
    ko: 꽈악-
    ja: ギュッ
  d_nikke_cinderella_crystalwave_05_46:
    speaker: cinderella_s
    en: This was in the magazine.
    ko: 이건, 잡지에 있었던 거고.
    ja: これは、雑誌に載っていた方法。
  d_nikke_cinderella_crystalwave_05_47:
    speaker: "<Monologue>"
    en: She slowly draws my hand toward her and presses it against her cheek.
    ko: 신데렐라가 손을 천천히 끌어당겨, 자기 뺨에 가져다 댔다.
    ja: |-
      シンデレラはゆっくりと私の手を引き寄せ、
      自分の頬に当てた
  d_nikke_cinderella_crystalwave_05_48:
    speaker: cinderella_s
    en: And so was this.
    ko: 이것도, 잡지에 있었던 거야.
    ja: これも、雑誌に載っていた方法。
  d_nikke_cinderella_crystalwave_05_49:
    speaker: cinderella_s
    en: But what comes next wasn't.
    ko: 그런데 그다음은, 잡지에 없거든.
    ja: でも、その続きは載っていなかった。
  d_nikke_cinderella_crystalwave_05_50:
    speaker: "<Self>"
    en: Cinderella...
    ko: "…신데렐라."
    ja: "…シンデレラ"
  d_nikke_cinderella_crystalwave_05_51:
    speaker: cinderella_s
    en: May I do as I wish?
    ko: 내가 하고 싶은 대로, 해봐도 될까?
    ja: 私なりのやり方で、やってみてもいいかしら？
  d_nikke_cinderella_crystalwave_05_52:
    speaker: "<Monologue>"
    en: As soon as I nod,
    ko: 고개를 끄덕이자.
    ja: そう言われ、うなずくと…
  d_nikke_cinderella_crystalwave_05_53:
    speaker: "<Monologue>"
    en: her lips meet mine.
    ko: 입술이 맞닿아왔다.
    ja: 唇が重なり合った
  d_nikke_cinderella_crystalwave_05_54:
    speaker: cinderella_s
    en: "... One more time."
    ko: "…한 번 더."
    ja: "…もう一度。"
  d_nikke_cinderella_crystalwave_05_55:
    speaker: cinderella_s
    en: This time, will you make the first move?
    ko: 이번엔 왕자님이 먼저 해줄래?
    ja: 今度は、王子様からしてくれる？
  d_nikke_cinderella_crystalwave_05_56:
    speaker: "<Monologue>"
    en: I cup her cheek and pull her toward me.
    ko: 신데렐라의 뺨을 감싸, 그대로 끌어당겼다.
    ja: |-
      シンデレラの頬を両手で包み込み、
      そのまま引き寄せた
  d_nikke_cinderella_crystalwave_05_57:
    speaker: "<Monologue>"
    en: Our lips meet once more.
    ko: 다시 한번, 입술이 맞닿았다.
    ja: もう一度、唇が重なり合った
  d_nikke_cinderella_crystalwave_05_58:
    speaker: cinderella_s
    en: "... This is bad."
    ko: "…큰일이네, 정말."
    ja: "…困ったわ。"
  d_nikke_cinderella_crystalwave_05_59:
    speaker: cinderella_s
    en: It's only making me want more.
    ko: 점점 더 욕심나.
    ja: どんどん欲が出てきてしまうわ。
  d_nikke_cinderella_crystalwave_05_60:
    speaker: cinderella_s
    en: I think I want to do it again.
    ko: 또 하고 싶어질 것 같아.
    ja: また、したくなりそう。
  d_nikke_cinderella_crystalwave_05_61:
    speaker: "<Self>"
    en: Then we can just do it again.
    ko: 그럼, 또 하면 돼.
    ja: その時は、またすればいい
  d_nikke_cinderella_crystalwave_05_62:
    speaker: cinderella_s
    en: You say such embarrassing things so effortlessly.
    ko: 왕자님은 그런 낯부끄러운 이야기를 아무렇지도 않게 하네.
    ja: |-
      王子様ったら、そんな恥ずかしいことを
      さらっと言えてしまうのね。
  d_nikke_cinderella_crystalwave_05_63:
    speaker: cinderella_s
    en: And yet... that's exactly what I like about you, hehe.
    ko: 그래서… 좋은 거지만, 후후.
    ja: だから…好きなの。ふふ。
  d_nikke_cinderella_crystalwave_05_64:
    speaker: cinderella_s
    en: Prince,
    ko: 왕자님.
    ja: 王子様。
  d_nikke_cinderella_crystalwave_05_65:
    speaker: cinderella_s
    en: will you... stay with me a little longer?
    ko: 이대로 조금만 더… 같이 있어 줄래?
    ja: このままもう少しだけ…一緒にいてくれる？
  d_nikke_cinderella_crystalwave_05_66:
    speaker: "<Self>"
    en: I'd like that.
    ko: 좋아.
    ja: 分かった
  d_nikke_cinderella_crystalwave_05_67:
    speaker: "<Monologue>"
    en: Once again, two shadows become one
    ko: 두 개의 그림자가, 다시 하나로 합쳐졌다.
    ja: 2つの影が、再び1つに重なり合った
  d_nikke_cinderella_crystalwave_05_68:
    speaker: "<Monologue>"
    en: and remain that way for a very long time.
    ko: 아주 오랫동안.
    ja: そして長い間、重なり合ったままだった
