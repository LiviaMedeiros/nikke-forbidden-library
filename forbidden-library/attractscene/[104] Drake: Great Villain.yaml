---
d_nikke_drake_greatvillain_01:
  d_nikke_drake_greatvillain_01_1:
    speaker: "<Monologue>"
    en: The door to the Commander's Room opens, and Drake walks in.
    ko: 지휘관실 문이 열리고, 드레이크가 들어왔다.
    ja: 指揮官室の扉が開き、ドレイクが入室した
  d_nikke_drake_greatvillain_01_2:
    speaker: drake_p
    en: Whirr.
    ko: 지잉~
    ja: ウィーン。
  d_nikke_drake_greatvillain_01_3:
    speaker: "<Self>"
    en: Why are you saying the sound effects out loud?
    ko: 그걸 왜 입으로 말하고 있어….
    ja: なぜわざわざ口で…
  d_nikke_drake_greatvillain_01_4:
    speaker: drake_p
    en: A special villain like me deserves a special entrance.
    ko: 특별한 존재에겐 특별한 입장 방법이 필요하다.
    ja: 特別な存在には、特別な入場方法が必要だ。
  d_nikke_drake_greatvillain_01_5:
    speaker: "<Self>"
    en: Well, it sure is special, I'll give you that.
    ko: 확실히 특별하긴 하네.
    ja: 確かに特別ではあるな…
  d_nikke_drake_greatvillain_01_6:
    speaker: drake_p
    en: It's not something just anyone could come up with.
    ko: 아무나 생각해 낼 수 있는 방법이 아니지.
    ja: 誰でも思いつくような方法ではないだろう？
  d_nikke_drake_greatvillain_01_7:
    speaker: drake_p
    en: Only I, the great Drake, could've thought of something like that!
    ko: 이 드레이크님이니까 생각해 낼 수 있는 거다!
    ja: このドレイク様だからこそ思いつけるのだ！
  d_nikke_drake_greatvillain_01_8:
    speaker: drake_p
    en: Marvel at my greatness!
    ko: 더 감탄해라!
    ja: もっと感心しろ！
  d_nikke_drake_greatvillain_01_9:
    speaker: "<Self>"
    en: Wow, very impressive.
    ko: 와, 대단해.
    ja: わあ、すごいな
  d_nikke_drake_greatvillain_01_10:
    speaker: drake_p
    en: Hahaha! Surely you can be more enthusiastic than that!
    ko: 하하하-!! 좀 더 격하게 반응해도 좋다!
    ja: |-
      ハハハッ！！
      もっと激しくリアクションをしてもいいぞ！
  d_nikke_drake_greatvillain_01_11:
    speaker: "<Self>"
    en: So, what brings you to the Commander's Room?
    ko: 그래서 지휘관실에는 무슨 일인데?
    ja: それで、指揮官室には何の用だ？
  d_nikke_drake_greatvillain_01_12:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_01_13:
    speaker: drake_p
    en: Well, no matter. You'll have plenty more opportunities to behold my greatness
      in the future.
    ko: 뭐, 좋다. 감탄할 기회는 앞으로도 얼마든지 있으니까.
    ja: |-
      まあ、いいだろう。感心する機会は
      これからいくらでもあるからな。
  d_nikke_drake_greatvillain_01_14:
    speaker: drake_p
    en: Before I state my business, let me ask you a question.
    ko: 일단 용건을 말하기 전에, 먼저 하나 묻도록 하겠다.
    ja: 用件を話す前に、一つ聞こう。
  d_nikke_drake_greatvillain_01_15:
    speaker: drake_p
    en: Who do you think I am?
    ko: 네놈은 내가 누구라고 생각하지?
    ja: 貴様は私を誰だと思っている？
  d_nikke_drake_greatvillain_01_16:
    speaker: "<Self>"
    en: A villain.
    ko: 빌런.
    ja: ヴィラン
  d_nikke_drake_greatvillain_01_17:
    speaker: drake_p
    en: I'm not just any villain!
    ko: 그냥 빌런이 아니다!
    ja: ただのヴィランではない！
  d_nikke_drake_greatvillain_01_18:
    speaker: drake_p
    en: I'm the Great Villain!
    ko: 그레이트 빌런이다!
    ja: グレイトヴィランだ！
  d_nikke_drake_greatvillain_01_19:
    speaker: drake_p
    en: A super great one, at that!
    ko: 그것도 슈퍼로 그레이트한!
    ja: それもスーパーでグレイトなヴィラン！
  d_nikke_drake_greatvillain_01_20:
    speaker: drake_p
    en: Therefore, I must distinguish myself from my former self.
    ko: 따라서 이전의 나와는 달라질 필요가 있다.
    ja: だからもう、これまでの私ではいられない。
  d_nikke_drake_greatvillain_01_21:
    speaker: drake_p
    en: I must earn everyone's recognition as a true villain!
    ko: 사람들에게 더욱 빌런으로 인정받아야 한다.
    ja: |-
      人々により一層ヴィランとして
      認められなければならないのだ。
  d_nikke_drake_greatvillain_01_22:
    speaker: drake_p
    en: However, as of late, people keep calling me a hero instead.
    ko: 하지만 요즘 들어 사람들이 더욱 나를 히어로라고 부른다.
    ja: |-
      だが最近、以前にも増して
      ヒーローと呼ばれるようになってしまった。
  d_nikke_drake_greatvillain_01_23:
    speaker: drake_p
    en: Worse yet, they're calling me the Great Hero!
    ko: 심지어 그레이트 히어로라고 부른다!
    ja: |-
      しまいにはグレイトヒーローとまで
      呼ばれる始末だ！
  d_nikke_drake_greatvillain_01_24:
    speaker: drake_p
    en: Why do you think that is, Moron?
    ko: 네놈은 그 이유가 뭐라고 생각하지?
    ja: 貴様は、その理由は何だと思う？
  d_nikke_drake_greatvillain_01_25:
    speaker: "<Self>"
    en: Maybe you haven't committed enough acts of villainy.
    ko: 아직 악행이 모자란 것 아닐까?
    ja: まだ悪事が足りないからじゃないか？
  d_nikke_drake_greatvillain_01_26:
    speaker: drake_p
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_drake_greatvillain_01_27:
    speaker: drake_p
    en: I doubt there are any villains out there who commit villainous deeds as diligently
      as I do.
    ko: 나처럼 열심히 악행을 저지르고 다니는 빌런은 없을 텐데.
    ja: |-
      私ほど熱心に悪事を働いているヴィランなど
      他にいないだろう。
  d_nikke_drake_greatvillain_01_28:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_01_29:
    speaker: drake_p
    en: This is entirely unfair!
    ko: 이건 부당하다!
    ja: こんなの不当だ！
  d_nikke_drake_greatvillain_01_30:
    speaker: drake_p
    en: I'm filing a complaint to the labor authorities!
    ko: 노동청에 신고하겠다!
    ja: 労働局に通報してやる！
  d_nikke_drake_greatvillain_01_31:
    speaker: "<Self>"
    en: Wouldn't that be kind of difficult, since villains are freelancers?
    ko: 빌런은 프리랜서라서 힘들지 않을까?
    ja: |-
      ヴィランはフリーランスだから、
      それは難しいんじゃないか？
  d_nikke_drake_greatvillain_01_32:
    speaker: drake_p
    en: What?
    ko: 뭣.
    ja: 何だと？
  d_nikke_drake_greatvillain_01_33:
    speaker: drake_p
    en: Damn it! This is an outrage!
    ko: 젠장! 억울하다!
    ja: くそっ！理不尽だ！
  d_nikke_drake_greatvillain_01_34:
    speaker: drake_p
    en: Freelancers deserve the right to stand up against injustice too!
    ko: 프리랜서에게도 부당함에 대항할 권리를 줘라!
    ja: |-
      フリーランサーにも不当な扱いに
      抗議する権利をよこせ！
  d_nikke_drake_greatvillain_01_35:
    speaker: "<Self>"
    en: Well, what did you figure the reason was?
    ko: 그래서 드레이크가 생각했던 이유는 뭔데?
    ja: それで、ドレイクはどう思っているんだ？
  d_nikke_drake_greatvillain_01_36:
    speaker: drake_p
    en: Right!
    ko: "!! 그래."
    ja: "！！ああ。"
  d_nikke_drake_greatvillain_01_37:
    speaker: drake_p
    en: The reason why I'm still perceived as a hero.
    ko: 내가 여전히 히어로 취급을 받는 이유.
    ja: 私が未だにヒーロー扱いされる理由。
  d_nikke_drake_greatvillain_01_38:
    speaker: drake_p
    en: That's because...
    ko: 그건….
    ja: それは…
  d_nikke_drake_greatvillain_01_39:
    speaker: "<Self>"
    en: Because?
    ko: 그건?
    ja: それは？
  d_nikke_drake_greatvillain_01_40:
    speaker: drake_p
    en: Because I haven't had my official villain debut showcase yet!
    ko: 아직 정식으로 빌런 데뷔 무대를 보여주지 않았기 때문이다!
    ja: |-
      まだ正式にヴィランのデビューステージを
      見せていないからだ！
  d_nikke_drake_greatvillain_01_41:
    speaker: "<Self>"
    en: "... A debut showcase?"
    ko: "…데뷔 무대?"
    ja: "…デビューステージ？"
  d_nikke_drake_greatvillain_01_42:
    speaker: drake_p
    en: Plebs will never understand unless you spell it out for them.
    ko: 우민들은 말로 해주지 않으면 모른다.
    ja: |-
      愚民どもは、言葉にしてやらないと
      理解できないのだ。
  d_nikke_drake_greatvillain_01_43:
    speaker: drake_p
    en: Hence, I must make an official announcement.
    ko: 그러니 공식적으로 발표할 필요가 있다.
    ja: だから、正式に発表する必要がある。
  d_nikke_drake_greatvillain_01_44:
    speaker: "<Self>"
    en: Did you just call the citizens of the Ark "plebs"?
    ko: 지금 시민들을 우매하다고 한 거야?
    ja: 今、市民を愚かだと言ったか？
  d_nikke_drake_greatvillain_01_45:
    speaker: drake_p
    en: '"Pleb" is short for "People Loyal to an Extraordinary Being." Yours truly,
      that is.'
    ko: 우민은 [우리들의 민중]의 줄임말이다!
    ja: 愚民は「愚かではない民衆」の略だ！
  d_nikke_drake_greatvillain_01_46:
    speaker: drake_p
    en: Don't get the wrong idea!
    ko: 오해하지 마라!
    ja: 誤解するな！
  d_nikke_drake_greatvillain_01_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_01_48:
    speaker: drake_p
    en: Anyway, ever since my upgrade, I have become the undisputed strongest supervillain
      in the Ark!
    ko: 아무튼 나는 파워업하면서 명실상부한 방주 최강의 빌런이 되었지.
    ja: |-
      とにかく、私はパワーアップして
      名実ともにアーク最強のヴィランになった。
  d_nikke_drake_greatvillain_01_49:
    speaker: drake_p
    en: I've been reborn as the Great Villain.
    ko: 그레이트 빌런으로 다시 태어난 거다.
    ja: グレイトヴィランとして生まれ変わったのだ。
  d_nikke_drake_greatvillain_01_50:
    speaker: drake_p
    en: Therefore, I need a stage where I can officially announce my debut as a villain!
    ko: 그래서 이번에 빌런 데뷔를 공식으로 발표할 무대가 필요하다.
    ja: |-
      だから、ヴィランのデビューを
      正式に発表するステージが
      必要というわけだ。
  d_nikke_drake_greatvillain_01_51:
    speaker: "<Self>"
    en: That sounds like a huge undertaking. It won't be easy.
    ko: 꽤나 스케일이 커서 쉽지 않겠는걸.
    ja: |-
      スケールが大きすぎて、
      難しそうだな
  d_nikke_drake_greatvillain_01_52:
    speaker: drake_p
    en: Right.
    ko: 그렇다.
    ja: その通りだ。
  d_nikke_drake_greatvillain_01_53:
    speaker: drake_p
    en: Which is why I am here to enlist your aid!
    ko: 그러니 네놈도 나를 도와라!
    ja: だから貴様も私を手伝え！
  d_nikke_drake_greatvillain_01_54:
    speaker: "<Self>"
    en: Why me...
    ko: 내가 왜….
    ja: なぜ私が…
  d_nikke_drake_greatvillain_01_55:
    speaker: drake_p
    en: The Villain Union's motto is to overcome hardships by working together and
      supporting each other.
    ko: 서로 의지하고, 힘을 합쳐 고난을 극복하는 게 우리 빌런 연합의 모토다.
    ja: |-
      互いに頼り合い、力を合わせて
      苦難を乗り越える。
      それがヴィラン連合のモットーだ。
  d_nikke_drake_greatvillain_01_56:
    speaker: drake_p
    en: And you are a member of the Villain Union.
    ko: 그리고 네놈은 빌런 연합의 일원이지.
    ja: 貴様はヴィラン連合の一員だろう。
  d_nikke_drake_greatvillain_01_57:
    speaker: drake_p
    en: Now, repeat after me.
    ko: 자, 따라해라.
    ja: さあ、復唱しろ。
  d_nikke_drake_greatvillain_01_58:
    speaker: drake_p
    en: Friendship! Love! Youth!
    ko: 우정! 사랑! 청춘!
    ja: 友情！愛！青春！
  d_nikke_drake_greatvillain_01_59:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_01_60:
    speaker: drake_p
    en: Come on, say it! Friendship! Love! Youth!
    ko: 빨리 따라해라! 우정! 사랑! 청춘!
    ja: 早く復唱しろ！友情！愛！青春！
  d_nikke_drake_greatvillain_01_61:
    speaker: "<Self>"
    en: Friendship. Love. Youth.
    ko: 우정. 사랑. 청춘.
    ja: 友情。愛。青春
  d_nikke_drake_greatvillain_01_62:
    speaker: drake_p
    en: Put some energy into it!
    ko: 기합을 넣어서 말해라!
    ja: もっと気合いを入れて言え！
  d_nikke_drake_greatvillain_01_63:
    speaker: drake_p
    en: Embody that Great Villain energy!
    ko: 그레이트한 빌런 기합 말이다!
    ja: グレイトなヴィランの気合を！
  d_nikke_drake_greatvillain_01_64:
    speaker: "<Self>"
    en: "... Friendship! Love! Youth!"
    ko: "…우정! 사랑! 청춘!"
    ja: "…友情！愛！青春！"
  d_nikke_drake_greatvillain_01_65:
    speaker: drake_p
    en: Good. Never forget those words. They are essential for any villain to live
      by.
    ko: 좋다. 지금 한 말은 잘 기억해둬라. 빌런이 품어야 할 필수 소양이니까.
    ja: |-
      よし。今言ったことをよく覚えておけ。
      ヴィランが備えるべき素養だからな。
  d_nikke_drake_greatvillain_01_66:
    speaker: "<Self>"
    en: These values seem more suited to heroes than villains...
    ko: 이건 빌런이 아니라 히어로의 필수 소양 같은….
    ja: ヴィランではなく、ヒーローの素養な気が…
  d_nikke_drake_greatvillain_01_67:
    speaker: drake_p
    en: With that in mind, take a look at this.
    ko: 그런 의미에서 이걸 봐라.
    ja: そういうわけで、これを見ろ。
  d_nikke_drake_greatvillain_01_68:
    speaker: "<Monologue>"
    en: Drake hands me a piece of paper with something written on it.
    ko: 드레이크가 무언가 적힌 종이를 내밀었다.
    ja: ドレイクが何かが書かれた紙を差し出した
  d_nikke_drake_greatvillain_01_69:
    speaker: drake_p
    en: It's a list of the things we need.
    ko: 필요한 것들을 적은 리스트다.
    ja: 必要なものリストだ。
  d_nikke_drake_greatvillain_01_70:
    speaker: "<Monologue>"
    en: I take the paper and read it.
    ko: 종이를 받아 읽어보았다.
    ja: 紙を受け取って読んでみた
  d_nikke_drake_greatvillain_01_71:
    speaker: "<Narration>"
    en: 'The Villain Debut Showcase Checklist:'
    ko: "[빌런 데뷔 무대를 위해 필요한 것 리스트]"
    ja: |-
      「ヴィランのデビューステージに
      　必要なもの」
  d_nikke_drake_greatvillain_01_72:
    speaker: "<Narration>"
    en: 1. A stage
    ko: "[1.무대]"
    ja: "「1.ステージ」"
  d_nikke_drake_greatvillain_01_73:
    speaker: "<Narration>"
    en: 2. Invitations
    ko: "[2.초대장]"
    ja: "「2.招待状」"
  d_nikke_drake_greatvillain_01_74:
    speaker: "<Narration>"
    en: '3.'
    ko: "[3. ]"
    ja: "「3.」"
  d_nikke_drake_greatvillain_01_75:
    speaker: "<Self>"
    en: There are only two things on the list.
    ko: 2번까지 밖에 안 적혀 있는데?
    ja: 2番までしか書かれていないが？
  d_nikke_drake_greatvillain_01_76:
    speaker: drake_p
    en: A stage and invitations to send to people.
    ko: 필요한 건 무대와 사람들을 부를 초대장.
    ja: |-
      必要なのはステージと、
      人々を呼ぶための招待状だ。
  d_nikke_drake_greatvillain_01_77:
    speaker: drake_p
    en: Those are the only two things I need.
    ko: 그 둘만 있으면 충분하다.
    ja: その2つさえあればいい。
  d_nikke_drake_greatvillain_01_78:
    speaker: drake_p
    en: Because the most important part of this showcase is my presence!
    ko: 가장 중요한 건 나 자신이니까!
    ja: 一番肝心なのは、この私だからな！
  d_nikke_drake_greatvillain_01_79:
    speaker: "<Monologue>"
    en: I take another look at the list.
    ko: 다시 한번 리스트를 살펴보았다.
    ja: もう一度、リストを確認した
  d_nikke_drake_greatvillain_01_80:
    speaker: "<Monologue>"
    en: On closer inspection, it looked like something had been written after number
      3 and then erased.
    ko: 자세히 보니, 3번 뒤에 뭔가 썼다가 지운 듯한 흔적이 보였다.
    ja: |-
      よく見ると、3番の後ろに
      何かを書いて消したような跡が見えた
  d_nikke_drake_greatvillain_01_81:
    speaker: "<Self>"
    en: Are you sure it's not just because you couldn't think of anything else to
      write down?
    ko: 더 생각나는 게 없어서 못 적은 건 아니고?
    ja: 何も思いつかなかったわけではないのか？
  d_nikke_drake_greatvillain_01_82:
    speaker: drake_p
    en: "... Preposterous!"
    ko: "…바보 같은 소리!"
    ja: "…バカなことを言うな！"
  d_nikke_drake_greatvillain_01_83:
    speaker: drake_p
    en: This list was completed after much deliberation!
    ko: 거듭된 고민 끝에 나온 답이다!
    ja: 熟考の末に出した答えだ！
  d_nikke_drake_greatvillain_01_84:
    speaker: drake_p
    en: I definitely wasn't agonizing over whether there should be a third item, only
      to draw a blank and erase it!
    ko: 절대 세 개는 있어야 하지 않을까 고민하다가, 생각나지 않아서 지운 게 아니다!
    ja: |-
      3つは必要だろうと、
      ひとまず書いてみただけだ。
      決していい案が思いつかずに
      消したわけではない！
  d_nikke_drake_greatvillain_01_85:
    speaker: "<Self>"
    en: "... I see."
    ko: "…그렇구나."
    ja: "…そうか"
  d_nikke_drake_greatvillain_01_86:
    speaker: drake_p
    en: Anyway, our priority right now is the stage.
    ko: 아무튼 지금 중요한 건 무대다.
    ja: とにかく、今一番大事なのはステージだ。
  d_nikke_drake_greatvillain_01_87:
    speaker: drake_p
    en: We must procure a stage first before I can write the venue on the invitations.
    ko: 무대부터 마련해야 초대장에 장소도 적을 수 있지.
    ja: |-
      ステージが手配できなければ、
      招待状に場所を書くこともできないだろう。
  d_nikke_drake_greatvillain_01_88:
    speaker: drake_p
    en: Tomorrow, you and I will go search for a venue we can rent.
    ko: 그러니 내일은 네놈과 함께 대관할 곳에 찾아가겠다.
    ja: |-
      だから明日は貴様と一緒に
      ステージとなる会場へ行くぞ。
  d_nikke_drake_greatvillain_01_89:
    speaker: "<Self>"
    en: I never agreed to—
    ko: 나 아직 간다곤….
    ja: いや、まだ行くとは…
  d_nikke_drake_greatvillain_01_90:
    speaker: drake_p
    en: I'll take care of contacting the venues!
    ko: 대관할 곳에 연락은 내가 해두도록 하겠다!
    ja: 会場への連絡は私がしておく！
  d_nikke_drake_greatvillain_01_91:
    speaker: drake_p
    en: Don't be late!
    ko: 절대 늦지 마라!
    ja: 絶対に遅れるんじゃないぞ！
  d_nikke_drake_greatvillain_01_92:
    speaker: "<Monologue>"
    en: Drake marches toward the door, only to turn around and return.
    ko: 드레이크가 지휘관실 문 앞에 섰다가, 다시 돌아왔다.
    ja: |-
      ドレイクが指揮官室のドアの前で立ち止まり、
      また戻ってきた
  d_nikke_drake_greatvillain_01_93:
    speaker: drake_p
    en: Here, take this.
    ko: 일단 이거부터 받아둬라.
    ja: とりあえず、これを受け取れ。
  d_nikke_drake_greatvillain_01_94:
    speaker: "<Monologue>"
    en: Drake hands me a credit card.
    ko: 드레이크가 카드를 건넸다.
    ja: ドレイクがカードを差し出した
  d_nikke_drake_greatvillain_01_95:
    speaker: "<Self>"
    en: Why are you suddenly giving me this?
    ko: 갑자기 카드는 왜 주는 거야?
    ja: どうして急に？
  d_nikke_drake_greatvillain_01_96:
    speaker: drake_p
    en: Use this card to make all the payments tomorrow!
    ko: 내일 할 결제는 모두 네놈이 이 카드로 해라!
    ja: |-
      明日の支払いは全部、
      貴様がこのカードで払え！
  d_nikke_drake_greatvillain_01_97:
    speaker: "<Self>"
    en: Surely you can handle something like that yourself?
    ko: 그 정도는 드레이크가 해도 되잖아.
    ja: ドレイクがやればいいだろう
  d_nikke_drake_greatvillain_01_98:
    speaker: drake_p
    en: It's embarrassing to pay for everything myself. It feels like I'm flaunting
      my wealth.
    ko: 돈 많다고 자랑하는 것 같아서, 직접 결제하는 건 좀 부끄러워.
    ja: |-
      金持ちだと自慢しているようで、
      自分で払うのは少し恥ずかしい。
  d_nikke_drake_greatvillain_01_99:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_01_100:
    speaker: drake_p
    en: I'm leaving for real now!
    ko: 그럼 이제 진짜 간다!
    ja: それじゃあ、今度こそ行くぞ！
  d_nikke_drake_greatvillain_01_101:
    speaker: drake_p
    en: Don't be late!
    ko: 절대 늦지 마라!
    ja: 絶対に遅れるなよ！
d_nikke_drake_greatvillain_02:
  d_nikke_drake_greatvillain_02_1:
    speaker: "<Narration>"
    en: The next day...
    ko: 다음 날.
    ja: 翌日
  d_nikke_drake_greatvillain_02_2:
    speaker: manager_t
    en: It's a pleasure to meet you, Miss Drake.
    ko: 반갑습니다, 드레이크님.
    ja: お目にかかれて光栄です、ドレイク様。
  d_nikke_drake_greatvillain_02_3:
    speaker: manager_t
    en: I also saw your recent appearance on the news. It was quite something.
    ko: 얼마 전에 뉴스에 나왔던 것도 아주 잘 봤습니다.
    ja: 先日もニュースで拝見しました。
  d_nikke_drake_greatvillain_02_4:
    speaker: manager_t
    en: It was truly a heartwarming piece of news, something rarely seen these days.
    ko: 정말 요즘 보기 힘든 가슴 따뜻한 소식이었어요.
    ja: |-
      最近ではなかなか見られない、
      心温まるお話でした。
  d_nikke_drake_greatvillain_02_5:
    speaker: manager_t
    en: I always find myself impressed by how exceptional you heroes of the Ark are.
    ko: 역시 방주의 히어로는 남다르다는 걸 항상 느끼고 있습니다.
    ja: |-
      やはり、アークのヒーローは違うと
      常々感じております。
  d_nikke_drake_greatvillain_02_6:
    speaker: drake_p
    en: Um... er, I see.
    ko: 어… 음, 그렇군.
    ja: ふむ…そうだな…
  d_nikke_drake_greatvillain_02_7:
    speaker: "<Monologue>"
    en: Drake and the theater's manager exchange polite bows.
    ko: 드레이크와 극장 관계자가 서로 허리를 숙여 인사했다.
    ja: |-
      ドレイクと劇場のスタッフは、
      互いにお辞儀をしながら挨拶をした
  d_nikke_drake_greatvillain_02_8:
    speaker: manager_t
    en: Now then.
    ko: 그래서.
    ja: それで…
  d_nikke_drake_greatvillain_02_9:
    speaker: manager_t
    en: Regarding the purpose of your visit, which you mentioned over the phone yesterday...
    ko: 어제 전화로 알려주셨던 방문 사유 말입니다만.
    ja: |-
      昨日お電話でおっしゃっていた
      ご訪問の理由ですが。
  d_nikke_drake_greatvillain_02_10:
    speaker: manager_t
    en: You said you were putting together a showcase that would set the Ark abuzz,
      correct?
    ko: 방주를 뜨겁게 만들 무대를 준비한다고 하셨었죠.
    ja: |-
      アークを熱狂させるステージを
      準備するためということでしたね。
  d_nikke_drake_greatvillain_02_11:
    speaker: drake_p
    en: Yes. Which is why I require nothing less than your grandest stage.
    ko: 그렇다. 그래서 아주 화려한 무대가 필요하다.
    ja: |-
      ああ。この上なく華やかな
      ステージが必要だ。
  d_nikke_drake_greatvillain_02_12:
    speaker: manager_t
    en: May I ask the exact purpose of your venue rental? Depending on what you plan
      to use the venue for, we may not be able to rent it out to you.
    ko: 정확한 대관 목적이 어떻게 되실까요? 목적에 따라 대관이 불가능할 수도 있습니다.
    ja: |-
      目的を教えていただけますか？
      場合によっては、お断りする場合もございます。
  d_nikke_drake_greatvillain_02_13:
    speaker: drake_p
    en: I plan to leave the weaklings of the Ark with a memory that they'll never
      forget for the rest of their lives.
    ko: 방주의 약자들에게, 평생 잊지 못할 기억을 남겨주기 위함이다.
    ja: |-
      アークの弱者どもに、
      一生忘れられない記憶を刻み込むためだ。
  d_nikke_drake_greatvillain_02_14:
    speaker: drake_p
    en: I will make sure it reaches even the deepest depths of the Ark.
    ko: 방주의 가장 낮은 곳까지, 빠짐없이 닿게 할 거다.
    ja: アークの最下層にまで、余すことなく届かせる。
  d_nikke_drake_greatvillain_02_15:
    speaker: "<Self>"
    en: No one's gonna understand you if you put it like that...
    ko: 그런 식으로 말하면 누가 알아들어….
    ja: そんな言い方じゃ伝わらないだろう…
  d_nikke_drake_greatvillain_02_16:
    speaker: manager_t
    en: That sounds wonderful.
    ko: 네, 좋습니다.
    ja: はい、承知いたしました。
  d_nikke_drake_greatvillain_02_17:
    speaker: "<Self>"
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_drake_greatvillain_02_18:
    speaker: manager_t
    en: We'll arrange for you to use our theater's largest stage. It just so happens
      to be available this weekend.
    ko: 저희 극장에서 가장 큰 무대로 대관해드리죠. 마침 이번 주말에 비어있네요.
    ja: |-
      当劇場で一番大きなステージを
      お貸ししましょう。
      ちょうど今週末が空いております。
  d_nikke_drake_greatvillain_02_19:
    speaker: drake_p
    en: Hahaha! An excellent decision!
    ko: 하하하! 좋은 선택이다!
    ja: ハハハ！いい選択だ！
  d_nikke_drake_greatvillain_02_20:
    speaker: "<Self>"
    en: "... You actually understood what she just said?"
    ko: "…방금 그걸 알아들으셨어요?"
    ja: "…今ので理解できたのですか？"
  d_nikke_drake_greatvillain_02_21:
    speaker: manager_t
    en: To be honest, I already had an idea as to what the purpose may be from the
      start.
    ko: 사실 처음부터 어떤 목적일지 짐작은 하고 있었습니다.
    ja: 実は、最初からおおよそ察しておりました。
  d_nikke_drake_greatvillain_02_22:
    speaker: manager_t
    en: Miss Drake's words simply confirmed my guess.
    ko: 드레이크님이 말씀해주셔서 확신했을 뿐이고요.
    ja: ドレイク様のお話で、確信を得られました。
  d_nikke_drake_greatvillain_02_23:
    speaker: manager_t
    en: An event that would leave the Ark's most vulnerable with an unforgettable
      memory. One that would reach even the deepest corners of the Ark...
    ko: 방주의 약자들에게 평생 잊지 못할 기억을 남겨주며, 가장 낮은 곳까지 닿게 할 만한 일….
    ja: |-
      アークの弱き者たちに
      一生忘れられない記憶を残し、
      最下層にまで届かせる…
  d_nikke_drake_greatvillain_02_24:
    speaker: manager_t
    en: Then there can only be one thing you're planning to do.
    ko: 그렇다면 하시려는 일은 하나밖에 없지 않겠습니까?
    ja: であれば、1つしかないでしょう？
  d_nikke_drake_greatvillain_02_25:
    speaker: manager_t
    en: There's no reason for us to refuse such a request.
    ko: 그런 걸 저희가 거절할 이유는 없죠.
    ja: それを、こちらが拒否する理由はございません。
  d_nikke_drake_greatvillain_02_26:
    speaker: manager_t
    en: Is there anything else you need other than the stage?
    ko: 그럼 대관 외에 추가로 필요하신 건 있을까요?
    ja: 会場以外に必要なものはございますか？
  d_nikke_drake_greatvillain_02_27:
    speaker: drake_p
    en: Huh?
    ko: 음?
    ja: ん？
  d_nikke_drake_greatvillain_02_28:
    speaker: drake_p
    en: What else would I need?
    ko: 뭐가 또 필요하지?
    ja: 会場以外に必要なものとは？
  d_nikke_drake_greatvillain_02_29:
    speaker: manager_t
    en: Things like stage equipment, for example.
    ko: 무대 기자재 같은 것들 말입니다.
    ja: 舞台機材のようなものです。
  d_nikke_drake_greatvillain_02_30:
    speaker: manager_t
    en: You'll also need staff to help run the event...
    ko: 행사 진행을 도울 스태프도 있어야 할 거고….
    ja: |-
      イベントの進行をお手伝いするスタッフも
      必要でしょうし…
  d_nikke_drake_greatvillain_02_31:
    speaker: "<Monologue>"
    en: Drake turns toward me.
    ko: 드레이크가 이쪽을 바라본다.
    ja: ドレイクがこちらを見た
  d_nikke_drake_greatvillain_02_32:
    speaker: drake_p
    en: Moron!
    ko: 네놈!
    ja: 貴様！
  d_nikke_drake_greatvillain_02_33:
    speaker: drake_p
    en: Why didn't you tell me I'd be needing such things?!
    ko: 왜 이런 것들이 필요하다고 말하지 않았나!
    ja: どうして教えてくれなかった！
  d_nikke_drake_greatvillain_02_34:
    speaker: "<Self>"
    en: I'm just tagging along.
    ko: 나는 그냥 따라왔을 뿐인데?
    ja: 私はただついてきただけだ
  d_nikke_drake_greatvillain_02_35:
    speaker: "<Self>"
    en: Besides, this was all your idea.
    ko: 게다가 이건 드레이크가 생각했던 거잖아.
    ja: それに、これはドレイクの発案だろう
  d_nikke_drake_greatvillain_02_36:
    speaker: drake_p
    en: What?
    ko: 뭣.
    ja: 何だと？
  d_nikke_drake_greatvillain_02_37:
    speaker: drake_p
    en: Oh, yeah. I guess you're right.
    ko: 아, 맞다. 그랬지.
    ja: ああ、確かにそうだったな。
  d_nikke_drake_greatvillain_02_38:
    speaker: manager_t
    en: "... If it's all right with you two, we'd be happy to take care of the arrangements
      for you."
    ko: "…두 분만 괜찮으시다면, 저희 극장에서 준비해드릴까요?"
    ja: |-
      …お二人さえよろしければ、
      私どもでご用意いたしましょうか？
  d_nikke_drake_greatvillain_02_39:
    speaker: drake_p
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_drake_greatvillain_02_40:
    speaker: manager_t
    en: We also provide services such as stage equipment, stage decorations, and staff
      support when you rent a venue with us.
    ko: 저희 극장에선 대관할 때 기자재나 무대 장식, 스태프를 지원하는 서비스도 함께 제공하고 있습니다.
    ja: |-
      当劇場では、会場貸し出しの際に
      機材や舞台装飾、スタッフ支援サービスも
      合わせて提供しております。
  d_nikke_drake_greatvillain_02_41:
    speaker: "<Self>"
    en: "... Why are you going so far to help us?"
    ko: "…대체 왜 이렇게까지 도와주시는 거죠?"
    ja: "…どうしてそこまでしてくださるのですか？"
  d_nikke_drake_greatvillain_02_42:
    speaker: manager_t
    en: Haha, please consider this an investment of sorts.
    ko: 후후. 일종의 투자라고 생각해주시면 좋겠군요.
    ja: |-
      ふふ。一種の投資だと
      思っていただければ。
  d_nikke_drake_greatvillain_02_43:
    speaker: manager_t
    en: Since this is an event hosted by Miss Drake, we believe it will have a positive
      impact on our theater's image.
    ko: 드레이크님이 개최하는 행사니까, 저희 극장의 이미지에 긍정적인 효과를 불러올 거라 기대하고 있습니다.
    ja: |-
      ドレイク様が主催されるイベントですから、
      当劇場のイメージにとっても
      プラスになるはずです。
  d_nikke_drake_greatvillain_02_44:
    speaker: manager_t
    en: We're hoping to gain some publicity from it.
    ko: 일종의 홍보 효과를 노리는 거죠.
    ja: 一種の宣伝効果を狙っているわけです。
  d_nikke_drake_greatvillain_02_45:
    speaker: manager_t
    en: That's why we believe holding your event on our largest stage will have a
      much greater promotional impact.
    ko: 그런 만큼 작은 무대보다는 큰 무대로 제공해드리는 게, 확실한 홍보 효과가 나올 거라고 보고 있습니다.
    ja: |-
      ですので、なるべく大きなステージを
      提供させていただく方が
      確実な宣伝効果が得られると考えております。
  d_nikke_drake_greatvillain_02_46:
    speaker: manager_t
    en: We're also hoping to take advantage of the increased number of visitors the
      event will bring.
    ko: 무대 행사를 진행하면 당일에 극장을 찾는 손님이 많을 테니, 특수를 노리려는 생각도 있죠.
    ja: |-
      イベントを開催すれば、
      多くのお客様が当劇場を訪れますから、
      売上アップを狙うという考えもございます。
  d_nikke_drake_greatvillain_02_47:
    speaker: "<Self>"
    en: Oh...
    ko: 아….
    ja: あ…
  d_nikke_drake_greatvillain_02_48:
    speaker: manager_t
    en: With that said, we'd be happy to provide all of this free of charge.
    ko: 그런 의미에서 이 모든 것들을 무상으로 제공해드리겠습니다.
    ja: |-
      これらすべてを無償で
      ご提供させていただきます。
  d_nikke_drake_greatvillain_02_49:
    speaker: manager_t
    en: Calling this a quid pro quo might be a bit much, but...
    ko: 대신이라고 하긴 좀 뭐하지만.
    ja: 代わりと言っては何ですが…
  d_nikke_drake_greatvillain_02_50:
    speaker: manager_t
    en: In return for providing these services at no cost, we would greatly appreciate
      it if you could include our theater's name as an organizer of the event.
    ko: 다양한 서비스를 무상으로 제공해드리는 만큼, 행사 주관에 저희 극장 이름만 살짝 끼워넣어주시면 감사하겠습니다.
    ja: |-
      イベントの主催に当劇場の名前を
      加えていただけませんか？
  d_nikke_drake_greatvillain_02_51:
    speaker: manager_t
    en: I'd like to make the most of this promotional opportunity while we're at it.
    ko: 이왕이면 홍보 효과를 제대로 노리고 싶거든요.
    ja: |-
      せっかくの機会ですので、
      大いにアピールしたいと考えております。
  d_nikke_drake_greatvillain_02_52:
    speaker: drake_p
    en: Hahaha!
    ko: 하하하!
    ja: ハハハ！
  d_nikke_drake_greatvillain_02_53:
    speaker: drake_p
    en: You're pretty cunning, aren't you?
    ko: 네놈도 꽤 약삭빠르군.
    ja: 貴様も抜け目ないな。
  d_nikke_drake_greatvillain_02_54:
    speaker: drake_p
    en: Color me impressed.
    ko: 아주 마음에 든다.
    ja: 実に気に入ったぞ。
  d_nikke_drake_greatvillain_02_55:
    speaker: manager_t
    en: Haha. Let's just say that I'm quick to do the math.
    ko: 후후. 계산이 빠르다고 해주시죠.
    ja: ふふ。計算が早い、と言っていただけると。
  d_nikke_drake_greatvillain_02_56:
    speaker: drake_p
    en: But business is business!
    ko: 하지만 계산은 계산이다!
    ja: だが、それとこれとは話は別だ！
  d_nikke_drake_greatvillain_02_57:
    speaker: drake_p
    en: I will pay the venue rental fee!
    ko: 대관료는 내겠다!
    ja: 代金は払う！
  d_nikke_drake_greatvillain_02_58:
    speaker: manager_t
    en: There's really no need to worry about the venue rental fee. Think of it as
      a marketing expense on our end.
    ko: 사실상 마케팅 비용인 거니까, 정말 대관료는 괜찮습니다.
    ja: |-
      マーケティング費用のようなものです。
      本当に結構ですよ。
  d_nikke_drake_greatvillain_02_59:
    speaker: manager_t
    en: We simply ask that you do a few things to help promote our theater...
    ko: 단지 저희 극장을 홍보하기 위한 몇 가지만 해주시면….
    ja: |-
      ただ、当劇場を宣伝するために
      いくつかお願いできれば…
  d_nikke_drake_greatvillain_02_60:
    speaker: drake_p
    en: That's one thing,
    ko: 그건 그거!
    ja: それはそれ！
  d_nikke_drake_greatvillain_02_61:
    speaker: drake_p
    en: and this is another!
    ko: 이건 이거!
    ja: これはこれだ！
  d_nikke_drake_greatvillain_02_62:
    speaker: drake_p
    en: I'll pay for the venue!
    ko: 대관료는 지불하겠다!
    ja: ちゃんと支払わせてもらう！
  d_nikke_drake_greatvillain_02_63:
    speaker: manager_t
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_02_64:
    speaker: manager_t
    en: Wanting to pay a fair price no matter what...
    ko: 무슨 일이 있어도 정당한 대가를 지불하겠다….
    ja: |-
      何があっても正当な対価を支払うと
      おっしゃるのですね…
  d_nikke_drake_greatvillain_02_65:
    speaker: manager_t
    en: I should've expected nothing less from you, Miss Drake.
    ko: 역시 드레이크님이시군요.
    ja: さすがはドレイク様。
  d_nikke_drake_greatvillain_02_66:
    speaker: manager_t
    en: If you really insist, I suppose we can't refuse.
    ko: 그렇게까지 말씀하신다면 어쩔 수 없죠.
    ja: 仕方ありません。
  d_nikke_drake_greatvillain_02_67:
    speaker: manager_t
    en: How would you like to pay?
    ko: 그럼 결제는 어떻게 도와드릴까요?
    ja: では、お支払いはどのようにいたしましょうか？
  d_nikke_drake_greatvillain_02_68:
    speaker: drake_p
    en: Moron, handle the payment.
    ko: 결제는 네놈이 해라!
    ja: 支払いは貴様がしろ！
  d_nikke_drake_greatvillain_02_69:
    speaker: drake_p
    en: And do it like you're some arrogant rich dude who has nothing but money going
      for him!
    ko: 돈만 많은 졸부인 것처럼 허세를 부리면서 말이지!
    ja: 成金のように、見栄を張ってな！
  d_nikke_drake_greatvillain_02_70:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_02_71:
    speaker: "<Monologue>"
    en: I pull the card Drake gave me last night out of my pocket.
    ko: 주머니에서 어제 받았던 드레이크의 카드를 꺼냈다.
    ja: |-
      昨日受け取ったドレイクのカードを
      ポケットから取り出した
  d_nikke_drake_greatvillain_02_72:
    speaker: "<Self>"
    en: "... We'll make payment with this card."
    ko: "…이 카드로 결제해 주세요."
    ja: "…支払いはこのカードでお願いします"
  d_nikke_drake_greatvillain_02_73:
    speaker: manager_t
    en: You must be the person in charge of handling the payments. I'll process it
      right away.
    ko: 결제 담당자가 따로 계셨군요. 알겠습니다.
    ja: |-
      会計担当の方がいらしたのですね。
      かしこまりました。
  d_nikke_drake_greatvillain_02_74:
    speaker: "<Monologue>"
    en: The manager accepts the card and leaves.
    ko: 극장 관계자가 카드를 받아들고 갔다.
    ja: |-
      劇場のスタッフはカードを受け取ると、
      その場を後にした
  d_nikke_drake_greatvillain_02_75:
    speaker: drake_p
    en: Haha! Things couldn't go any more smoothly than this. We even found ourselves
      a trustworthy ally.
    ko: 하하! 든든한 아군까지 얻다니, 일이 정말 순조롭게 진행되는군!
    ja: |-
      ハハ！頼もしい味方まで手に入ったぞ。
      こうも順調に進むとはな！
  d_nikke_drake_greatvillain_02_76:
    speaker: "<Self>"
    en: Yeah. I didn't expect them to offer us the venue free of charge.
    ko: 그러게. 설마 무상으로 대관해 주려고 할 줄은 몰랐어.
    ja: |-
      そうだな。まさか無償で
      貸すと言われるとは思わなかった
  d_nikke_drake_greatvillain_02_77:
    speaker: manager_t
    en: The payment has been made.
    ko: 결제 완료했습니다.
    ja: 決済が完了いたしました。
  d_nikke_drake_greatvillain_02_78:
    speaker: drake_p
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_drake_greatvillain_02_79:
    speaker: drake_p
    en: You're pretty efficient!
    ko: 일처리가 빠르군!
    ja: 仕事が早いな！
  d_nikke_drake_greatvillain_02_80:
    speaker: "<Monologue>"
    en: The manager hands me the card and the receipt.
    ko: 극장 관계자가 카드와 영수증을 건넸다.
    ja: 劇場スタッフからカードと領収書を受け取った
  d_nikke_drake_greatvillain_02_81:
    speaker: manager_t
    en: Since the payment has been sorted, we'll get started with the stage decorations
      and promotional banners right away.
    ko: 결제도 끝났으니, 아마 바로 필요한 무대 장식이나 홍보용 플래카드 제작에 들어갈 겁니다.
    ja: |-
      お支払いが済みましたので、
      すぐに舞台装飾や
      広報用プラカードの製作に入ります。
  d_nikke_drake_greatvillain_02_82:
    speaker: manager_t
    en: Once the designs are complete, we'll need your approval on them...
    ko: 완성이 되면 제작된 시안을 컨펌해주실 필요가 있는데….
    ja: |-
      完成したら、デザイン案を
      ご確認いただく必要がございますが…
  d_nikke_drake_greatvillain_02_83:
    speaker: manager_t
    en: Should we reach out to you directly for the approval, Miss Drake?
    ko: 컨펌 연락은 드레이크님께 드리면 될까요?
    ja: |-
      確認のご連絡は、ドレイク様に
      差し上げればよろしいでしょうか？
  d_nikke_drake_greatvillain_02_84:
    speaker: drake_p
    en: No need!
    ko: 필요 없다!
    ja: その必要はない！
  d_nikke_drake_greatvillain_02_85:
    speaker: drake_p
    en: I entrust everything to you!
    ko: 전부 네놈에게 일임하도록 하지!
    ja: すべて貴様に一任する！
  d_nikke_drake_greatvillain_02_86:
    speaker: manager_t
    en: "... Thank you for placing your trust in us."
    ko: "…굉장히 신뢰받고 있군요."
    ja: |-
      …随分と信頼してくださって
      いるのですね。
  d_nikke_drake_greatvillain_02_87:
    speaker: manager_t
    en: We'll do our utmost to live up to your trust and make the necessary preparations.
    ko: 그러면 신뢰에 보답할 수 있도록, 최선을 다해 준비하도록 하겠습니다.
    ja: |-
      それでは、その信頼にお応えできるよう、
      最善を尽くして準備させていただきます。
  d_nikke_drake_greatvillain_02_88:
    speaker: drake_p
    en: Hahahaha! As you should!
    ko: 하하하하하! 좋다!
    ja: ハハハハハ！いいぞ！
d_nikke_drake_greatvillain_03:
  d_nikke_drake_greatvillain_03_1:
    speaker: drake_p
    en: Everything's falling into place, thanks to our capable ally.
    ko: 좋은 아군을 얻은 덕분에 일사천리로 진행됐군.
    ja: |-
      心強い味方を得たおかげで、
      とんとん拍子に事が進むな。
  d_nikke_drake_greatvillain_03_2:
    speaker: drake_p
    en: Now that the stage is all set, the next step is to send out the invitations.
    ko: 이제 무대도 준비됐으니, 다음은 초대장이다.
    ja: |-
      これでステージの準備は整った。
      次は招待状だ。
  d_nikke_drake_greatvillain_03_3:
    speaker: drake_p
    en: Let's head to the print shop to get the invitation cards printed for the plebs.
    ko: 인쇄소에 우민들에게 나눠줄 초대장을 만들러 가자.
    ja: |-
      愚民どもに配る招待状を作りに、
      印刷所へ行くぞ。
  d_nikke_drake_greatvillain_03_4:
    speaker: "<Self>"
    en: Right now?
    ko: 지금 바로?
    ja: 今から？
  d_nikke_drake_greatvillain_03_5:
    speaker: drake_p
    en: I've already thought of what to put on the invitations.
    ko: 이미 초대장에 적을 문구까지 다 생각해 왔다.
    ja: 招待状に書く内容は、もう全部考えてある。
  d_nikke_drake_greatvillain_03_6:
    speaker: drake_p
    en: Now, follow me!
    ko: 자, 따라와라!
    ja: さあ、ついて来い！
  d_nikke_drake_greatvillain_03_7:
    speaker: "<Monologue>"
    en: Drake drags me along to the print shop.
    ko: 드레이크에게 이끌려 인쇄소로 향했다.
    ja: ドレイクに連れられ、印刷所へ向かった
  d_nikke_drake_greatvillain_03_8:
    speaker: drake_p
    en: Make me some invitation cards according to the wording written here!
    ko: 여기 적힌 문구대로 초대장을 만들어라!
    ja: ここに書かれた通りに招待状を作れ！
  d_nikke_drake_greatvillain_03_9:
    speaker: "<Monologue>"
    en: Drake hands a piece of paper to the print shop clerk.
    ko: 드레이크가 인쇄소 직원에게 종이를 내밀었다.
    ja: ドレイクは印刷所のスタッフに紙を差し出した
  d_nikke_drake_greatvillain_03_10:
    speaker: maleemployee
    en: Um...
    ko: 음….
    ja: ほう…
  d_nikke_drake_greatvillain_03_11:
    speaker: "<Monologue>"
    en: The clerk carefully reviews the wording that will go on the invitations.
    ko: 인쇄소 직원이 초대장 문구를 천천히 확인했다.
    ja: |-
      印刷所のスタッフは、
      招待状の内容をじっくりと確認した
  d_nikke_drake_greatvillain_03_12:
    speaker: maleemployee
    en: How many do you need?
    ko: 몇 장이나 필요하시죠?
    ja: 何枚必要ですか？
  d_nikke_drake_greatvillain_03_13:
    speaker: drake_p
    en: A hundred copies will do.
    ko: 100장이면 충분하다.
    ja: 100枚で十分だ。
  d_nikke_drake_greatvillain_03_14:
    speaker: maleemployee
    en: Sure thing.
    ko: 알겠습니다.
    ja: かしこまりました。
  d_nikke_drake_greatvillain_03_15:
    speaker: maleemployee
    en: It should take around thirty minutes. Thank you for your patience.
    ko: 30분 정도 걸릴 테니, 잠시만 기다려주세요.
    ja: |-
      30分ほどいただきますので、
      少々お待ちください。
  d_nikke_drake_greatvillain_03_16:
    speaker: "<Self>"
    en: Will a hundred copies really be enough?
    ko: 겨우 100장으로 괜찮겠어?
    ja: 100枚で足りるのか？
  d_nikke_drake_greatvillain_03_17:
    speaker: drake_p
    en: You think this won't be enough, Moron?
    ko: 네놈은 이게 부족할 거라고 생각하나?
    ja: 足りないと思うのか？
  d_nikke_drake_greatvillain_03_18:
    speaker: "<Self>"
    en: If you want the entire Ark to know about it, then yes, it won't be enough.
    ko: 방주 전체에 알릴 생각이라면 적은 게 맞지.
    ja: |-
      アーク中に知らせるつもりなら、
      どう考えても少ないだろう
  d_nikke_drake_greatvillain_03_19:
    speaker: drake_p
    en: Hmph! How short-sighted of you!
    ko: 흥! 생각이 짧군!
    ja: ふん！考えが浅い！
  d_nikke_drake_greatvillain_03_20:
    speaker: drake_p
    en: These are invitations sent by yours truly.
    ko: 이 드레이크님이 보내는 초대장이다.
    ja: このドレイク様からの招待状だ。
  d_nikke_drake_greatvillain_03_21:
    speaker: drake_p
    en: It'll spread throughout the Ark by word of mouth, obviously.
    ko: 입소문을 타고 방주 전체에 전달될 게 뻔하지.
    ja: |-
      口コミでアーク全体に伝わるに
      決まっているだろう。
  d_nikke_drake_greatvillain_03_22:
    speaker: drake_p
    en: Knowing that, making any more would just be a waste.
    ko: 그걸 알면서도 더 제작하는 건 자원 낭비다.
    ja: |-
      それを分かっていながら、
      これ以上の数を刷るのは
      資源の無駄遣いだ。
  d_nikke_drake_greatvillain_03_23:
    speaker: drake_p
    en: We should conserve resources for the sake of the environment.
    ko: 환경 보호를 위해서라도 자원은 아껴 써야 해.
    ja: 環境保護のためにも、資源は節約すべきだ。
  d_nikke_drake_greatvillain_03_24:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_03_25:
    speaker: "<Narration>"
    en: 30 minutes later...
    ko: 30분 후.
    ja: 30分後
  d_nikke_drake_greatvillain_03_26:
    speaker: "<Narration>"
    en: "*Thump*"
    ko: 털썩-
    ja: ドサッ――
  d_nikke_drake_greatvillain_03_27:
    speaker: maleemployee
    en: Here are the hundred invitation cards you requested.
    ko: 말씀하신 초대장 100장, 인쇄 끝났습니다.
    ja: 招待状100枚の印刷が完了しました。
  d_nikke_drake_greatvillain_03_28:
    speaker: drake_p
    en: That was fast!
    ko: 빠르군!
    ja: 早いな！
  d_nikke_drake_greatvillain_03_29:
    speaker: maleemployee
    en: How would you like to pay?
    ko: 결제는 어떻게 도와드릴까요?
    ja: お支払いはどうされますか？
  d_nikke_drake_greatvillain_03_30:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_03_31:
    speaker: maleemployee
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_03_32:
    speaker: "<Monologue>"
    en: Everyone's eyes turn to me.
    ko: 자리에 있는 모두가 나를 바라본다.
    ja: その場にいる全員が、私を見ている
  d_nikke_drake_greatvillain_03_33:
    speaker: "<Self>"
    en: All right, guess I'll pay...
    ko: 그래, 내가 해야지….
    ja: ああ、私の役目だよな…
  d_nikke_drake_greatvillain_03_34:
    speaker: "<Monologue>"
    en: I pull out Drake's card once again.
    ko: 이번에도 드레이크의 카드를 꺼냈다.
    ja: 今回もドレイクのカードを取り出した
  d_nikke_drake_greatvillain_03_35:
    speaker: "<Self>"
    en: "... Please charge it to this card."
    ko: "…이 카드로 해주세요."
    ja: "…このカードでお願いします"
  d_nikke_drake_greatvillain_03_36:
    speaker: "<Monologue>"
    en: We finish paying and leave the print shop.
    ko: 결제를 마치고 인쇄소를 빠져나왔다.
    ja: 支払いを済ませ、印刷所を後にした
  d_nikke_drake_greatvillain_03_37:
    speaker: drake_p
    en: This invitation is a masterpiece.
    ko: 초대장이 아주 명문이군.
    ja: なかなかの名文だな。
  d_nikke_drake_greatvillain_03_38:
    speaker: drake_p
    en: The quality is even better than I expected.
    ko: 생각 이상으로 잘 만들어졌다.
    ja: 思った以上にいい出来だ。
  d_nikke_drake_greatvillain_03_39:
    speaker: "<Self>"
    en: Come to think of it, I haven't seen what's written on them yet.
    ko: 그러고 보니 뭐라고 썼는지 아직 못 봤네.
    ja: |-
      そういえば、何と書いたのか
      まだ見ていなかったな
  d_nikke_drake_greatvillain_03_40:
    speaker: drake_p
    en: You'd be missing out big time if you don't read this literary masterpiece!
    ko: 이 명문을 보지 못하는 건 인생의 손해지!
    ja: |-
      こんな名文を読まないなんて、
      人生の損だ！
  d_nikke_drake_greatvillain_03_41:
    speaker: drake_p
    en: Go on, read it!
    ko: 빨리 읽어 봐라!
    ja: 早く読め！
  d_nikke_drake_greatvillain_03_42:
    speaker: "<Monologue>"
    en: Drake hands me an invitation.
    ko: 드레이크가 초대장을 건네주었다.
    ja: ドレイクが招待状を差し出した
  d_nikke_drake_greatvillain_03_43:
    speaker: "<Narration>"
    en: '"Invitation"'
    ko: "[<초대장>]"
    ja: "「招待状」"
  d_nikke_drake_greatvillain_03_44:
    speaker: "<Narration>"
    en: '"You are cordially invited to this special event."'
    ko: "[여러분들을 특별한 자리에 모십니다.]"
    ja: "「皆様を特別なお席へご招待いたします」"
  d_nikke_drake_greatvillain_03_45:
    speaker: "<Narration>"
    en: '"We hope to bring together the generosity of all who attend and dedicate
      it to building a better world."'
    ko: "[모여주신 분들의 작은 뜻을 모아, 더 나은 세상을 위해 쓰고자 합니다.]"
    ja: |-
      「お集まりいただいた皆様の
      　ささやかなお志を募り、よりよい世界のために
      　役立てたいと考えております」
  d_nikke_drake_greatvillain_03_46:
    speaker: "<Narration>"
    en: '"No matter how modest your support, we will never forget your kindness."'
    ko: "[작은 마음이라도 모아주신다면, 그 뜻을 결코 잊지 않겠습니다.]"
    ja: |-
      「ささやかなお気持ちでもお寄せいただければ、
      　そのお志は決して忘れません」
  d_nikke_drake_greatvillain_03_47:
    speaker: "<Narration>"
    en: '"Please honor us with your presence and witness this special moment with
      us."'
    ko: "[귀한 걸음 하시어, 부디 그 순간을 함께 지켜봐 주십시오.]"
    ja: |-
      「足をお運びいただき、ありがとうございます。
      　どうかその瞬間を共に見届けてください」
  d_nikke_drake_greatvillain_03_48:
    speaker: "<Narration>"
    en: '"Yours sincerely, Drake."'
    ko: "[-삼가 드레이크 올림-]"
    ja: "「ドレイクより」"
  d_nikke_drake_greatvillain_03_49:
    speaker: "<Self>"
    en: "... Are you sure this will work?"
    ko: "…이거 괜찮은 거 맞아?"
    ja: "…これ、大丈夫なのか？"
  d_nikke_drake_greatvillain_03_50:
    speaker: "<Self>"
    en: This doesn't exactly sound like an invitation to a villain's debut showcase.
    ko: 빌런 데뷔 무대 초대장으로는 안 보이는데.
    ja: |-
      ヴィランのデビューステージの
      招待状には見えないが
  d_nikke_drake_greatvillain_03_51:
    speaker: drake_p
    en: How could you fail to grasp the deeper meaning behind these words?
    ko: 문장에 담긴 이 깊은 뜻을 모르다니.
    ja: |-
      この文章に込められた
      深い意味が分からないとはな。
  d_nikke_drake_greatvillain_03_52:
    speaker: drake_p
    en: Since I'm feeling generous, I shall personally interpret the true meaning
      behind this invitation!
    ko: 특별히 내가 이 초대장에 담긴 뜻을 해석해서 읽어주마!
    ja: 特別に私が解説しながら読んでやる！
  d_nikke_drake_greatvillain_03_53:
    speaker: drake_p
    en: Invitation. I've prepared a special event that will leave you morons speechless.
    ko: 초대장. 네놈들을 충격에 빠트릴 특별한 행사를 준비했다.
    ja: |-
      招待状。貴様らを震撼させる
      特別な行事を準備した。
  d_nikke_drake_greatvillain_03_54:
    speaker: drake_p
    en: This world will be better off once I become famous as a villain.
    ko: 내가 빌런으로 유명해지는 것이 더 나은 세상이다.
    ja: |-
      私がヴィランとして有名になってこそ、
      よりよい世界となるのだ。
  d_nikke_drake_greatvillain_03_55:
    speaker: drake_p
    en: Since I'm a generous villain, I will remember every last one of your stunned
      faces.
    ko: 나는 관대한 빌런이니, 네놈들이 받은 충격을 잊지 않고 기억해주겠다.
    ja: |-
      私は寛大なヴィランだ。
      貴様らが受けた衝撃は必ず記憶してやる。
  d_nikke_drake_greatvillain_03_56:
    speaker: drake_p
    en: You'd better show up and witness it!
    ko: 반드시 와서 지켜봐라.
    ja: 必ず来て、その目で確かめるがいい。
  d_nikke_drake_greatvillain_03_57:
    speaker: drake_p
    en: Well? Impressed?
    ko: 자, 어떠냐!
    ja: どうだ！
  d_nikke_drake_greatvillain_03_58:
    speaker: "<Self>"
    en: "... Maybe you should've just written that instead."
    ko: "…진짜 그렇게 적지 그랬어."
    ja: "…いっそ、そう書けばよかったのに"
  d_nikke_drake_greatvillain_03_59:
    speaker: drake_p
    en: It's an invitation, you know. I didn't want it to come across as too rude.
    ko: 초대장인데 너무 무례한 건 좀 그렇다.
    ja: |-
      招待状なのに、あまりにも無礼なのは
      どうかと思ったんだ。
  d_nikke_drake_greatvillain_03_60:
    speaker: drake_p
    en: Invitations should be polite.
    ko: 초대는 공손하게 해야 하니까.
    ja: 丁重に招待するべきだからな。
  d_nikke_drake_greatvillain_03_61:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_03_62:
    speaker: drake_p
    en: You must be speechless because of my impeccable judgment!
    ko: 내 안목에 감탄해서 말도 안 나오는 모양이군!
    ja: 感心して、言葉も出なくなったか！
  d_nikke_drake_greatvillain_03_63:
    speaker: drake_p
    en: Now, all that's left to do is hand out these invitations.
    ko: 자, 그럼 남은 건 초대장을 나눠주는 일 뿐이다.
    ja: さあ、あとは招待状を配るだけだ。
  d_nikke_drake_greatvillain_03_64:
    speaker: drake_p
    en: Come with me!
    ko: 따라와라!
    ja: ついて来い！
  d_nikke_drake_greatvillain_03_65:
    speaker: "<Self>"
    en: Can't you just litter them all over the Ark, since they're invitations from
      a villain?
    ko: 빌런의 초대장이니까 그냥 길거리에 뿌려도 되지 않아?
    ja: |-
      ヴィランの招待状なんだから、
      道端にばら撒いてもいいんじゃないか？
  d_nikke_drake_greatvillain_03_66:
    speaker: drake_p
    en: Moron!
    ko: 네놈!
    ja: 貴様！
  d_nikke_drake_greatvillain_03_67:
    speaker: drake_p
    en: Then who's going to clean all that up?!
    ko: 그럼 그건 누가 다 치울 거냐!
    ja: それを誰が片付けるというのだ！
  d_nikke_drake_greatvillain_03_68:
    speaker: drake_p
    en: The sanitation workers already have it hard enough, and you want to add more
      to their plates?
    ko: 가뜩이나 고생하는 환경 미화원들을 더 고생시키려고 하다니.
    ja: |-
      ただでさえ大変な清掃員たちに、
      これ以上の負担を与えようとするとは！
  d_nikke_drake_greatvillain_03_69:
    speaker: drake_p
    en: Only a devil would do such a thing!
    ko: 악마가 따로 없군!
    ja: 貴様は悪魔そのものだな！
  d_nikke_drake_greatvillain_03_70:
    speaker: "<Self>"
    en: Sure... Let's just go and hand them out...
    ko: 그래… 그냥 나눠주러 가자….
    ja: そうか…じゃあ、配りに行こう…
  d_nikke_drake_greatvillain_03_71:
    speaker: "<Narration>"
    en: A little while later...
    ko: 잠시 후.
    ja: しばらくして――
  d_nikke_drake_greatvillain_03_72:
    speaker: drake_p
    en: Good work.
    ko: 고생했다.
    ja: ご苦労だった。
  d_nikke_drake_greatvillain_03_73:
    speaker: drake_p
    en: You seem exhausted.
    ko: 그런데 많이 지쳐보이는군.
    ja: しかし、ずいぶん疲れているようだな。
  d_nikke_drake_greatvillain_03_74:
    speaker: "<Self>"
    en: I didn't think we'd be bowing ninety degrees to every single person we handed
      them out to.
    ko: 한 명 한 명 90도 인사하면서 나눠줄 줄은 몰랐으니까.
    ja: |-
      まさか一人ひとりに90度のお辞儀をしながら
      配ることになるとは思わなかったからな
  d_nikke_drake_greatvillain_03_75:
    speaker: "<Self>"
    en: My hands are numb from shaking hands nonstop...
    ko: 악수도 너무 많이 해서 손이 저려….
    ja: 握手もしすぎて、もう手が痺れてきた…
  d_nikke_drake_greatvillain_03_76:
    speaker: drake_p
    en: Is this all it takes for you to crack?
    ko: 고작 이 정도로 약한 소리를 하다니.
    ja: これっぽっちで弱音を吐くとは。
  d_nikke_drake_greatvillain_03_77:
    speaker: drake_p
    en: You're still a long way from becoming the greatest villain.
    ko: 네놈은 최강의 빌런이 되려면 아직 멀었다.
    ja: |-
      最強のヴィランになるには、
      まだまだだ。
  d_nikke_drake_greatvillain_03_78:
    speaker: "<Self>"
    en: "... Says the one who's collapsed on the ground."
    ko: "…지금 지쳐서 땅바닥에 쓰러져 있는 건 누구지?"
    ja: "…疲れて地面に倒れ込んでいるのは誰だ？"
  d_nikke_drake_greatvillain_03_79:
    speaker: "<Monologue>"
    en: I stare at Drake, who's collapsed at my feet.
    ko: 발 아래에 쓰러져 있는 드레이크를 바라보았다.
    ja: 足元に倒れているドレイクを見つめた
  d_nikke_drake_greatvillain_03_80:
    speaker: drake_p
    en: As if the greatest villain would ever collapse from exhaustion.
    ko: 최강의 빌런이 지쳐서 쓰러지는 일이 있을 것 같나.
    ja: 最強のヴィランが疲れて倒れるわけないだろう。
  d_nikke_drake_greatvillain_03_81:
    speaker: drake_p
    en: I'm merely getting acquainted with the ground.
    ko: 나는 그냥 땅바닥과 스킨십을 하고 있었을 뿐이다.
    ja: 地面とスキンシップをしていただけだ。
  d_nikke_drake_greatvillain_03_82:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_03_83:
    speaker: drake_p
    en: Hehehe.
    ko: 후후후.
    ja: フフフ…
  d_nikke_drake_greatvillain_03_84:
    speaker: drake_p
    en: All right, all the preparations are complete.
    ko: 그럼 이제 모든 준비가 끝났다.
    ja: これですべての準備は整った。
  d_nikke_drake_greatvillain_03_85:
    speaker: drake_p
    en: The look on those plebs' faces when they witness my debut as a villain.
    ko: 내가 빌런으로 데뷔하는 모습을 본 우민들의 표정.
    ja: |-
      私がヴィランとしてデビューする姿を目にした
      愚民どもの表情。
  d_nikke_drake_greatvillain_03_86:
    speaker: drake_p
    en: Just the thought of it makes my heart race.
    ko: 상상만 해도 설레는군!
    ja: 想像しただけでもワクワクするな！
  d_nikke_drake_greatvillain_03_87:
    speaker: drake_p
    en: I don't think I'll be able to sleep until the big day with all this anticipation!
    ko: 너무 설레서 당일까지 못 잘 것 같은 기분이다!
    ja: |-
      あまりに楽しみすぎて、
      当日まで眠れそうにもない！
  d_nikke_drake_greatvillain_03_88:
    speaker: drake_p
    en: Just like a kindergartener who's too excited to sleep the night before a field
      trip!
    ko: 마치 소풍 전날 기대감에 잠 못 드는 유치원생처럼!
    ja: |-
      遠足前夜、期待に胸を膨らませて
      眠れない幼稚園児のようにな！
  d_nikke_drake_greatvillain_03_89:
    speaker: drake_p
    en: Hahaha!
    ko: 하하하--!!
    ja: ハハハ――！！
  d_nikke_drake_greatvillain_03_90:
    speaker: drake_p
    en: Hahahahaha!!
    ko: 하하하하하--!!
    ja: ハハハハハ――！！
  d_nikke_drake_greatvillain_03_91:
    speaker: "<Monologue>"
    en: As Drake's laughter rings out, we decide to call it a day.
    ko: 울려퍼지는 드레이크의 웃음소리와 함께, 우리는 일단 해산하기로 했다.
    ja: |-
      響き渡るドレイクの笑い声と共に、
      私たちは一旦解散することにした
d_nikke_drake_greatvillain_04:
  d_nikke_drake_greatvillain_04_1:
    speaker: "<Self>"
    en: The day has finally come...
    ko: "…드디어 오늘인가."
    ja: "…ついに今日か"
  d_nikke_drake_greatvillain_04_2:
    speaker: "<Narration>"
    en: "*Bzzt*"
    ko: 지잉-
    ja: ブブッ――
  d_nikke_drake_greatvillain_04_3:
    speaker: "<Monologue>"
    en: I leave the Commander's Room to go see Drake.
    ko: 나는 일단 드레이크를 만나러 지휘관실을 나섰다.
    ja: 私はドレイクに会うため、指揮官室を出た
  d_nikke_drake_greatvillain_04_4:
    speaker: drake_p
    en: You're finally here!
    ko: 드디어 왔나!
    ja: ようやく来たか！
  d_nikke_drake_greatvillain_04_5:
    speaker: drake_p
    en: Look at all these letters and money!
    ko: 봐라, 이 수많은 편지와 돈을!
    ja: 見ろ、この大量の手紙と金を！
  d_nikke_drake_greatvillain_04_6:
    speaker: drake_p
    en: This is proof that everyone in the Ark knows about my debut, even though I
      only handed out a hundred invitations!
    ko: 이게 바로 초대장을 100장밖에 만들지 않았는데도, 벌써 방주에 소문이 돌았다는 증거다!
    ja: |-
      招待状たった100枚で、
      もうアーク中に噂が広まったという証拠だ！
  d_nikke_drake_greatvillain_04_7:
    speaker: "<Self>"
    en: What's all this?
    ko: 이게 다 뭐야?
    ja: これは何なんだ？
  d_nikke_drake_greatvillain_04_8:
    speaker: drake_p
    en: They're letters and donations people sent to support me!
    ko: 날 응원하겠다며 사람들이 보내준 편지와 후원금이다!
    ja: |-
      私を応援すると言って、
      皆が送ってくれた手紙と支援金だ！
  d_nikke_drake_greatvillain_04_9:
    speaker: "<Monologue>"
    en: I pick up a letter and read it.
    ko: 편지 한 장을 집어들어 읽어 본다.
    ja: 手紙を一枚手に取り、読んでみた
  d_nikke_drake_greatvillain_04_10:
    speaker: "<Narration>"
    en: '"Please use this donation for a good cause!"'
    ko: "[후원금은 꼭 좋은 곳에 써주세요!]"
    ja: "「支援金はぜひ、良いことに使ってください！」"
  d_nikke_drake_greatvillain_04_11:
    speaker: "<Narration>"
    en: '"I''ll always be cheering you on. You''ve got this, Drake!"'
    ko: "[항상 응원하고 있어요. 드레이크 파이팅!]"
    ja: |-
      「いつも応援しています。
      　ドレイク、ファイト！」
  d_nikke_drake_greatvillain_04_12:
    speaker: drake_p
    en: Looks like people are finally recognizing my true greatness.
    ko: 슬슬 이제 사람들이 내 진가를 알아가고 있는 것 같군.
    ja: |-
      そろそろ皆が、
      私の真価に気づき始めたようだな。
  d_nikke_drake_greatvillain_04_13:
    speaker: drake_p
    en: I can't wait to see their reactions when I make the official announcement
      on stage!
    ko: 무대에서 공식적으로 발표까지 하면 어떤 반응일지, 기대가 돼서 참을 수가 없다!
    ja: |-
      ステージで正式発表までしたら、
      どんな反応になるか…
      待ちきれないな！
  d_nikke_drake_greatvillain_04_14:
    speaker: drake_p
    en: Hahaha!
    ko: 하하하--!!
    ja: ハハハ！！
  d_nikke_drake_greatvillain_04_15:
    speaker: "<Self>"
    en: I feel like this whole thing is headed in a weird direction...
    ko: 이거 뭔가 좀 이상하게 흘러가는 것 같은데….
    ja: 何だか変な方向に話が進んでいる気が…
  d_nikke_drake_greatvillain_04_16:
    speaker: drake_p
    en: Weird? On the contrary. Everything is falling into place exactly as it's supposed
      to.
    ko: 이상하긴. 모든 게 다 제자리를 찾아가고 있는 거다.
    ja: |-
      変だと？
      すべてが正しい方向へ進んでいるだけだ。
  d_nikke_drake_greatvillain_04_17:
    speaker: drake_p
    en: Come, let us go to the theater!
    ko: 자, 어서 빨리 극장으로 가자!
    ja: さあ！早く劇場へ行くぞ！
  d_nikke_drake_greatvillain_04_18:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_04_19:
    speaker: drake_p
    en: "... But seriously, how am I supposed to return all this money?"
    ko: "…근데 진짜 이 돈들은 어떻게 돌려줘야 하지?"
    ja: |-
      …だが、このお金は
      どうやって返したらいいんだ？
  d_nikke_drake_greatvillain_04_20:
    speaker: "<Self>"
    en: I guess you could just send them back to their addresses.
    ko: 나중에 반송이라도 하면 되겠지, 뭐.
    ja: まあ、後で返送すればいいだろう
  d_nikke_drake_greatvillain_04_21:
    speaker: "<Monologue>"
    en: A huge crowd has gathered in front of the theater.
    ko: 극장 앞은 수많은 인파로 가득했다.
    ja: 劇場前は、大勢の人々で溢れかえっていた
  d_nikke_drake_greatvillain_04_22:
    speaker: drake_p
    en: Are all these people here to witness my debut as a villain?
    ko: 이게 전부 다 내 빌런 데뷔 현장을 목격하러 온 사람들인가.
    ja: |-
      全員、私のヴィランデビューを
      見に来たのか。
  d_nikke_drake_greatvillain_04_23:
    speaker: drake_p
    en: I knew planning a showcase was a genius move!
    ko: 역시 무대 행사를 계획하길 잘했군!
    ja: やはりイベントを計画して正解だったな！
  d_nikke_drake_greatvillain_04_24:
    speaker: drake_p
    en: Hahaha!!
    ko: 하하하-!!
    ja: ハハハハハ！！
  d_nikke_drake_greatvillain_04_25:
    speaker: "<Self>"
    en: It's going to be hard to even get inside with this many people.
    ko: 사람이 너무 많아서 안에 들어가기도 힘들겠는데.
    ja: 人が多すぎて、中に入るのも大変そうだ
  d_nikke_drake_greatvillain_04_26:
    speaker: malecitizen
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_drake_greatvillain_04_27:
    speaker: malecitizen
    en: Look, it's Drake!
    ko: 저기 드레이크다!
    ja: ドレイクだ！
  d_nikke_drake_greatvillain_04_28:
    speaker: "<Monologue>"
    en: At the man's shout, people begin crowding around us.
    ko: 한 남성의 외침과 함께, 군중들이 몰려들었다.
    ja: 一人の男性がそう叫ぶと、群衆が押し寄せた
  d_nikke_drake_greatvillain_04_29:
    speaker: malecitizen
    en: Drake!
    ko: 드레이크!
    ja: ドレイク！
  d_nikke_drake_greatvillain_04_30:
    speaker: malecitizen
    en: Look over here, please!
    ko: 여기 한 번만 봐 줘!
    ja: こっちを見てくれ！
  d_nikke_drake_greatvillain_04_31:
    speaker: malecitizen
    en: I even brought the emergency stash I'd been hiding from my wife to donate
      to this cause!
    ko: 오늘 행사에 후원하려고 와이프 몰래 숨겨둔 비상금까지 꺼내 왔어!
    ja: |-
      今日のイベントのために、
      妻に隠してたへそくりまで持ってきたんだ！
  d_nikke_drake_greatvillain_04_32:
    speaker: femalecitizen
    en: Drake!
    ko: 드레이크!
    ja: ドレイク！
  d_nikke_drake_greatvillain_04_33:
    speaker: femalecitizen
    en: I even cashed out my savings just to attend today's event!
    ko: 오늘 행사에 참가하려고 모아둔 적금까지 깨서 왔어요!
    ja: |-
      今日のイベントのために、
      積立貯金を崩しました！
  d_nikke_drake_greatvillain_04_34:
    speaker: femalecitizen
    en: I'm looking forward to it!
    ko: 좋은 행사 부탁해요!
    ja: いいイベントを期待しています！
  d_nikke_drake_greatvillain_04_35:
    speaker: drake_p
    en: Hahaha!
    ko: 하하하!
    ja: ハハハ！
  d_nikke_drake_greatvillain_04_36:
    speaker: drake_p
    en: You better!
    ko: 물론이다!
    ja: もちろんだ！
  d_nikke_drake_greatvillain_04_37:
    speaker: drake_p
    en: Prepare yourselves for an electrifying performance unlike anything you've
      ever seen!
    ko: 어디서도 보지 못한 뜨거운 무대를 보여주지!
    ja: |-
      ここでしか見られない、
      熱いステージを見せてやろう！
  d_nikke_drake_greatvillain_04_38:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_04_39:
    speaker: "<Monologue>"
    en: Something's not right.
    ko: 이상하다.
    ja: おかしい
  d_nikke_drake_greatvillain_04_40:
    speaker: "<Monologue>"
    en: No matter how I look at it, there's something off about these people's reactions.
    ko: 아무리 봐도 사람들의 반응이 이상하다.
    ja: どう考えても、人々の反応がおかしい
  d_nikke_drake_greatvillain_04_41:
    speaker: malejournalist
    en: Miss Drake, we're from the TV broadcasting station!
    ko: 드레이크 씨, XXX 방송국에서 나왔습니다!
    ja: ドレイクさん、テレビ局の者です！
  d_nikke_drake_greatvillain_04_42:
    speaker: malejournalist
    en: Could you say a few words about the purpose behind this event?
    ko: 이번 행사를 기획하신 목적에 대해 한 말씀 부탁드립니다!
    ja: |-
      今回のイベントを企画された目的について、
      一言お願いいたします！
  d_nikke_drake_greatvillain_04_43:
    speaker: drake_p
    en: Ah, a press interview!
    ko: 오, 방송국 인터뷰인가!
    ja: おお、テレビのインタビューか！
  d_nikke_drake_greatvillain_04_44:
    speaker: drake_p
    en: I have but one objective.
    ko: 내 목적은 오직 하나.
    ja: 私の目的はただ一つ。
  d_nikke_drake_greatvillain_04_45:
    speaker: drake_p
    en: And that is to leave the weaklings of the Ark with a memory that they'll never
      forget for the rest of their lives.
    ko: 방주의 약자들에게, 평생 잊지 못할 기억을 남겨주기 위해서다!
    ja: |-
      アークの弱き者たちに、
      一生忘れられない記憶を残してやるためだ！
  d_nikke_drake_greatvillain_04_46:
    speaker: drake_p
    en: I will make sure it reaches even those in the deepest depths of the Ark!
    ko: 가장 낮은 곳에 있는 이들에게까지 빠짐없이 닿게 할 거다!
    ja: |-
      最も低い場所にいる者たちにまで、
      余すことなく届けてやる！
  d_nikke_drake_greatvillain_04_47:
    speaker: femalereporter
    en: So your goal is to raise funds to help those in need!
    ko: 불우한 이웃을 돕기 위한 모금만이 목적이라는 말씀이군요!
    ja: |-
      恵まれない方々を助けるための
      募金が目的ということですね！
  d_nikke_drake_greatvillain_04_48:
    speaker: drake_p
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_drake_greatvillain_04_49:
    speaker: drake_p
    en: "... A fundraiser for those in need?"
    ko: "…불우 이웃 모금?"
    ja: "…恵まれない人たちへの募金？"
  d_nikke_drake_greatvillain_04_50:
    speaker: femalereporter
    en: Then could you tell us why you're working alongside the Commander of Counters?
    ko: 그럼 카운터스의 지휘관님과 함께 행동하고 있으신 이유도 있을까요!
    ja: |-
      では、カウンターズの指揮官様と一緒に
      行動されている理由は！？
  d_nikke_drake_greatvillain_04_51:
    speaker: drake_p
    en: Well, that's because we're part of the same union...
    ko: 아, 그건 같은 연합 동료라서….
    ja: あ、それは同じ連合の仲間だからで…
  d_nikke_drake_greatvillain_04_52:
    speaker: femalereporter
    en: So you even convinced the Commander of Counters to participate in the fundraiser!
    ko: 카운터스의 지휘관님까지 설득해서 모금에 동참하게 된 거군요!
    ja: |-
      カウンターズの指揮官様まで説得して、
      募金に参加してもらったのですね！
  d_nikke_drake_greatvillain_04_53:
    speaker: femalereporter
    en: You mentioned a union. Are you aiming to found an organization?
    ko: 연합이라고 하시면, 혹시 단체 같은 것까지 만들 생각이 있으신 건가요?
    ja: |-
      連合とおっしゃいますと、
      団体のようなものを作るおつもりですか？
  d_nikke_drake_greatvillain_04_54:
    speaker: drake_p
    en: We're already an organization, though I do plan on expanding it someday...
    ko: 이미 단체이긴 하고, 언젠간 더 큰 연합으로 만들 생각은 있는데….
    ja: |-
      すでに団体ではあるし、いつかもっと大きな
      連合にするつもりではいるが…
  d_nikke_drake_greatvillain_04_55:
    speaker: femalereporter
    en: So you even plan on establishing a foundation using the donations raised through
      this event!
    ko: 이번 모금 행사를 통해 모인 후원금으로 재단 설립까지!
    ja: |-
      今回のイベントで集めた支援金で、
      財団の設立まで！
  d_nikke_drake_greatvillain_04_56:
    speaker: "<Monologue>"
    en: Drake stares at me, dumbfounded.
    ko: 드레이크가 얼빠진 표정으로 나를 바라보았다.
    ja: ドレイクは困ったような顔で私を見た
  d_nikke_drake_greatvillain_04_57:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_04_58:
    speaker: drake_p
    en: Don't you dare look away, Moron!
    ko: 네놈! 눈 돌리지 마라!
    ja: 貴様！目を逸らすな！
  d_nikke_drake_greatvillain_04_59:
    speaker: "<Monologue>"
    en: As I avert my gaze, the banner hanging in front of the theater catches my
      eye.
    ko: 시선을 피하니, 극장 앞에 걸려있는 플래카드가 눈에 들어왔다.
    ja: |-
      目をそらした先に、劇場の前に掲げられた
      看板があった
  d_nikke_drake_greatvillain_04_60:
    speaker: "<Self>"
    en: "... Drake's Charity Fundraiser?"
    ko: "…드레이크의 자선 모금 행사?"
    ja: "…ドレイクの慈善募金イベント？"
  d_nikke_drake_greatvillain_04_61:
    speaker: "<Monologue>"
    en: Drake also turns to look at the banner.
    ko: 드레이크도 내가 보고 있는 플래카드를 확인했다.
    ja: ドレイクも私が見ている方を見た
  d_nikke_drake_greatvillain_04_62:
    speaker: drake_p
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_drake_greatvillain_04_63:
    speaker: drake_p
    en: H-how did my debut showcase turn into a charity fundraiser...?
    ko: 왜, 왜 내 데뷔 무대가 자선 모금 행사로….
    ja: |-
      な、なぜ私のデビューステージが
      慈善募金イベントに…
  d_nikke_drake_greatvillain_04_64:
    speaker: "<Monologue>"
    en: The ambiguity of her reasoning for reserving the venue.
    ko: 어정쩡하게 넘어갔던 대관 사유.
    ja: |-
      うやむやになっていた
      無料での会場貸出の理由
  d_nikke_drake_greatvillain_04_65:
    speaker: "<Monologue>"
    en: The wording printed on the invitations we handed out.
    ko: 사람들에게 나눠준 초대장에 적힌 문구.
    ja: 招待状に書かれていた文言
  d_nikke_drake_greatvillain_04_66:
    speaker: "<Monologue>"
    en: Plus, Drake's polite demeanor when she handed out those invitations...
    ko: 그리고 그걸 공손하게 나눠준 드레이크.
    ja: そしてそれを丁寧に配ったドレイク
  d_nikke_drake_greatvillain_04_67:
    speaker: "<Self>"
    en: No wonder they misunderstood.
    ko: 오해하는 게 당연하겠네, 이건.
    ja: これは、誤解されても当然だな
  d_nikke_drake_greatvillain_04_68:
    speaker: drake_p
    en: What?
    ko: 뭣.
    ja: 何だと？
  d_nikke_drake_greatvillain_04_69:
    speaker: malecitizen
    en: Drake! Drake!
    ko: 드레이크! 드레이크!
    ja: ドレイク！ドレイク！
  d_nikke_drake_greatvillain_04_70:
    speaker: femalecitizen
    en: The Ark's hero! The Ark's angel!
    ko: 방주의 히어로! 방주의 천사!
    ja: アークのヒーロー！アークの天使！
  d_nikke_drake_greatvillain_04_71:
    speaker: "<Monologue>"
    en: More and more people begin to crowd around us.
    ko: 점점 사람들이 주변에 몰려들기 시작했고.
    ja: 次第に人々が周りに集まり始め…
  d_nikke_drake_greatvillain_04_72:
    speaker: "<Monologue>"
    en: Their cheers grow increasingly louder.
    ko: 그만큼 환호성 소리도 더 커져갔다.
    ja: |-
      それに比例して、
      歓声もさらに大きくなっていった
  d_nikke_drake_greatvillain_04_73:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_04_74:
    speaker: drake_p
    en: Clap louder! Cheer louder!
    ko: 더 갈채해라! 더 환호해라!
    ja: もっと拍手をしろ！もっと歓喜しろ！
  d_nikke_drake_greatvillain_04_75:
    speaker: drake_p
    en: I'll show you everything you want and more! Mwahaha!
    ko: 네놈들이 원하는 것, 그 이상을 보여주겠다! 하하하-!!
    ja: |-
      貴様らが望む以上のものを見せてやろう！
      ハッハッハ！
  d_nikke_drake_greatvillain_04_76:
    speaker: "<Self>"
    en: "... At least she seems to be enjoying everyone cheering for her."
    ko: "…그래도 사람들이 환호해주는 건 즐겁나 보네."
    ja: "…それでも、人々の歓声は嬉しいようだな"
  d_nikke_drake_greatvillain_04_77:
    speaker: "<Monologue>"
    en: Amid the crowd's thunderous applause,
    ko: 결국 사람들의 열화와 같은 환영 속에서.
    ja: 人々の熱烈な歓迎を受け
  d_nikke_drake_greatvillain_04_78:
    speaker: "<Monologue>"
    en: Drake's villain debut showcase-turned-fundraiser gets underway,
    ko: 본래는 빌런 데뷔의 장이 됐어야 할 드레이크의 자선 행사가 열렸고.
    ja: |-
      ヴィランデビューの場となるはずだった
      ドレイクの慈善イベントが開催され…
  d_nikke_drake_greatvillain_04_79:
    speaker: "<Monologue>"
    en: and it ends in resounding success.
    ko: 행사는 성황리에 막을 내렸다.
    ja: イベントは大盛況のうちに幕を閉じた
d_nikke_drake_greatvillain_05:
  d_nikke_drake_greatvillain_05_1:
    speaker: announcer
    en: Up next is a story that put smiles on citizens' faces last weekend.
    ko: 다음은 지난 주말, 시민들을 웃음 짓게 했던 소식입니다.
    ja: |-
      続いては先週末、
      市民を笑顔にしたニュースです。
  d_nikke_drake_greatvillain_05_2:
    speaker: announcer
    en: Just recently, Drake of Matis personally hosted a charity fundraiser.
    ko: 얼마 전, 메티스의 드레이크가 직접 자선 행사를 개최했다고 하는데요.
    ja: |-
      先日、メティスのドレイクが
      チャリティーイベントを開催しました。
  d_nikke_drake_greatvillain_05_3:
    speaker: announcer
    en: Many citizens of the Ark participated in this event and donated to help those
      in need.
    ko: 이 행사에 많은 시민들이 참가해 불우 이웃을 돕기 위한 성금을 모았다고 합니다.
    ja: |-
      このイベントには多くの市民が参加し、
      恵まれない人々を助けるための募金が
      行われたとのことです。
  d_nikke_drake_greatvillain_05_4:
    speaker: announcer
    en: While the large turnout posed a risk of accidents,
    ko: 현장에 너무 많은 인파가 몰리는 바람에 사고가 날 수도 있었지만.
    ja: |-
      会場には非常に多くの人々が集まったため
      事故が起きる可能性もありましたが
  d_nikke_drake_greatvillain_05_5:
    speaker: announcer
    en: citizens expressed that an event with such good intentions deserved an attitude
      to match.
    ko: 좋은 의도의 행사에는 이에 걸맞은 태도를 보여야 한다며,
    ja: |-
      善意のイベントには
      それにふさわしい態度を示すべきだと、
  d_nikke_drake_greatvillain_05_6:
    speaker: announcer
    en: It was heartwarming to see citizens voluntarily maintaining order as they
      participated in the charity event.
    ko: 시민들이 자발적으로 질서를 지키며 자선 행사에 참가하는 훈훈한 모습을 보였습니다.
    ja: |-
      市民が自発的にルールを守りながら
      チャリティーイベントに参加するという
      心温まる光景が見られました。
  d_nikke_drake_greatvillain_05_7:
    speaker: announcer
    en: But this remarkable display of community spirit did not end at the event venue.
    ko: 이러한 수준 높은 시민 의식은 행사 현장에서만 보여진 것이 아닌데요.
    ja: |-
      このような高い意識が見られたのは、
      イベント会場だけではありません。
  d_nikke_drake_greatvillain_05_8:
    speaker: announcer
    en: Let's hear more from our reporter on the scene.
    ko: 자세한 소식, 기자를 통해 전해드리도록 하겠습니다.
    ja: 詳しい内容は、記者がお伝えいたします。
  d_nikke_drake_greatvillain_05_9:
    speaker: malejournalist
    en: The invitations were reportedly handed out by Matis's Drake herself on the
      streets of the Ark.
    ko: 개최자인 메티스의 드레이크가 직접 방주 시내를 돌아다니며 나누어 주었다고 하는 초대장.
    ja: |-
      主催者であるメティスのドレイクが、
      自らアーク市街地を回りながら配ったという
      招待状。
  d_nikke_drake_greatvillain_05_10:
    speaker: malejournalist
    en: With only around a hundred copies said to have been distributed,
    ko: 이 초대장은 당초 100여 장 되는 수량만 배포된 것으로 알려졌습니다.
    ja: |-
      この招待状は、当初100枚程度のみ
      配布されたと伝えられています。
  d_nikke_drake_greatvillain_05_11:
    speaker: malejournalist
    en: some of them have been listed at a premium on online marketplaces.
    ko: 적은 수량으로 인해 초대장에는 프리미엄이 붙어, 중고 거래 사이트에 올라오기도 했습니다.
    ja: |-
      数が少ないため、
      招待状の希少価値が高まり、
      中古取引サイトに出回ることもありました。
  d_nikke_drake_greatvillain_05_12:
    speaker: femalecitizen
    en: I'd still want one, even at that price. There are so few of them in existence,
      after all.
    ko: "(비싸더라도) 갖고 싶긴 하죠. 몇 장 뿌리지도 않은 건데."
    ja: |-
      （高くても）欲しいですよね。
      数枚しか出回っていませんし。
  d_nikke_drake_greatvillain_05_13:
    speaker: femalecitizen
    en: Even so, the event was for a good cause, and I didn't want to spoil that by
      buying one.
    ko: 그래도 좋은 의도로 시작한 행산데 괜히 초치는 것 같아서 살 생각은 안 들더라구요.
    ja: |-
      でも、善意で始まったイベントなのに
      水を差しちゃうような気がして…
      買う気にはなれませんでした。
  d_nikke_drake_greatvillain_05_14:
    speaker: malejournalist
    en: Thanks to the citizens' remarkable community spirit, donations collected from
      the event and beyond have reportedly reached a record high.
    ko: 시민들의 높은 시민 의식과 함께, 행사 안팎으로 모인 성금은 역대 최대 모금액인 것으로 알려졌습니다.
    ja: |-
      市民の善意に支えられ、
      イベント内外で集まった寄付金は
      過去最高の金額となったと言われています。
  d_nikke_drake_greatvillain_05_15:
    speaker: malejournalist
    en: Experts have pointed out that this fundraising event was not only driven by
      good intentions, but also by a masterfully executed strategy.
    ko: 이번 모금 행사는 좋은 의도와 별개로, 상당히 고도의 전략이 동반된 행사였다는 전문가 의견이 많습니다.
    ja: |-
      今回の募金イベントは、その意図とは別に
      かなり高度な戦略が伴っていたという
      専門家の分析もあります。
  d_nikke_drake_greatvillain_05_16:
    speaker: maleexpert
    en: While she certainly leveraged her own popularity, I believe her collaboration
      with the Commander of Counters also played a significant role.
    ko: 본인의 인지도를 활용한 것도 있지만, 카운터스의 지휘관과 함께 했다는 점도 꽤 크게 작용했다고 봅니다.
    ja: |-
      本人の認知度を活用したというのもありますが、
      カウンターズの指揮官と一緒だったという点も、
      かなり大きかったのではないでしょうか。
  d_nikke_drake_greatvillain_05_17:
    speaker: maleexpert
    en: After all, the level of attention generated when two highly influential figures
      come together is something that can't be overlooked.
    ko: 아무래도 큰 영향력을 지닌 인물 둘이 함께 한다고 했을 때의 주목도, 이걸 무시하긴 어려우니까요.
    ja: |-
      やはり、影響力を持つ人物が2人揃うとなれば、
      その注目度は無視できませんからね。
  d_nikke_drake_greatvillain_05_18:
    speaker: maleexpert
    en: Moreover, the fact that the Commander closely followed Drake's lead makes
      it difficult to believe there was no prior coordination.
    ko: 게다가 지휘관이 드레이크를 따라가는 형태로 움직였다는 건 사전 합의가 없었다고 보기 어려운 모습입니다.
    ja: |-
      さらに、指揮官がドレイクに従う形で動いたのは
      事前の合意があってこそでしょう。
  d_nikke_drake_greatvillain_05_19:
    speaker: maleexpert
    en: It may have seemed like a spontaneous collaboration, but it was likely carefully
      planned behind the scenes.
    ko: 겉보기에만 게릴라 형식으로 진행된 것처럼 보일 뿐, 이미 물밑에서 치밀하게 계획했겠죠.
    ja: |-
      表向きはゲリラ形式でしたが、
      水面下では緻密な計画が
      進められていたのでしょう。
  d_nikke_drake_greatvillain_05_20:
    speaker: maleexpert
    en: "... Drake is more than just a kind-hearted hero. She may very well be the
      most meticulous and strategic hero we've ever seen."
    ko: "…드레이크는 착하기만 한 것이 아닌, 누구보다 치밀하고 계획적인 히어로일 겁니다."
    ja: |-
      …ドレイクは、ただ優しいだけでなく
      誰よりも緻密で計画的なヒーローだと言えます。
  d_nikke_drake_greatvillain_05_21:
    speaker: malejournalist
    en: In addition to the partnership between two of the Ark's most well-known figures,
    ko: 이렇듯 유명하기로 손 꼽히는 두 인물이 함께 움직인 것과 더불어.
    ja: |-
      このように、有名人である2人が
      共に動いたことに加え、
  d_nikke_drake_greatvillain_05_22:
    speaker: malejournalist
    en: many believe Drake's long-standing reputation as a hero played a major role
      in the fundraiser's success.
    ko: 평소 드레이크가 쌓아왔던 선한 이미지가 이번 모금에 큰 원동력이 되었다는 평가입니다.
    ja: |-
      これまでドレイクが築き上げてきた
      善良なイメージが、今回の募金活動の
      大きな原動力となったと評価されています。
  d_nikke_drake_greatvillain_05_23:
    speaker: malejournalist
    en: The event proved why Drake, now equipped with upgraded gear, has earned the
      title of Great Hero.
    ko: 한층 업그레이드된 무장을 입고 돌아온 드레이크가, 왜 그레이트 히어로라고 불리게 되었는지 알 수 있었던 행사였습니다.
    ja: |-
      一層アップグレードされた武装を身につけ
      戻ってきたドレイクが、なぜグレイトヒーローと
      呼ばれるようになったのかが
      よく分かるイベントでした。
  d_nikke_drake_greatvillain_05_24:
    speaker: malejournalist
    en: Now, all eyes are on how far Drake's acts of kindness will go.
    ko: 과연 드레이크의 선행은 어디까지 진행될 것인지, 귀추가 주목되고 있습니다.
    ja: |-
      果たしてドレイクの善行はどこまで続くのか、
      その動向が注目されています。
  d_nikke_drake_greatvillain_05_25:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_05_26:
    speaker: "<Narration>"
    en: "*Beep*"
    ko: 삐익-
    ja: ピッ
  d_nikke_drake_greatvillain_05_27:
    speaker: "<Monologue>"
    en: I turn off the TV.
    ko: TV를 껐다.
    ja: テレビを消した
  d_nikke_drake_greatvillain_05_28:
    speaker: "<Self>"
    en: The internet has also been going crazy over your fundraiser—
    ko: 인터넷에서도 이번 자선 행사.
    ja: |-
      インターネットでも今回の
      チャリティーイベントの話題で持ちきりだな
  d_nikke_drake_greatvillain_05_29:
    speaker: "<Self>"
    en: I mean, your villain debut showcase...
    ko: 아니, 빌런 데뷔 무대 영상이 올라와서 화제더라고….
    ja: |-
      いや、ヴィランのデビューステージの
      動画が上がって、それが話題になっている…
  d_nikke_drake_greatvillain_05_30:
    speaker: "<Monologue>"
    en: I open the video-sharing app on my phone.
    ko: 핸드폰에서 동영상 공유 어플을 켰다.
    ja: 携帯電話で動画配信アプリを開いた
  d_nikke_drake_greatvillain_05_31:
    speaker: drake_p
    en: Here! Take a look at this!
    ko: 자! 이걸 봐라!
    ja: おい！これを見ろ！
  d_nikke_drake_greatvillain_05_32:
    speaker: drake_p
    en: It's an electric dinosaur!
    ko: 전기 공룡이다!
    ja: 電気恐竜だ！
  d_nikke_drake_greatvillain_05_33:
    speaker: citizenry
    en: Woooow!
    ko: 와아아!
    ja: わああ！
  d_nikke_drake_greatvillain_05_34:
    speaker: drake_p
    en: Hahahahaha!!
    ko: 하하하하하-!!
    ja: ハハハハハハ！！
  d_nikke_drake_greatvillain_05_35:
    speaker: drake_p
    en: If you enjoyed this spectacular performance, pay up!
    ko: 멋진 공연을 봤으면 돈을 내라!
    ja: |-
      素晴らしいショーを見せてやったのだから、
      金を払え！
  d_nikke_drake_greatvillain_05_36:
    speaker: drake_p
    en: The more you pay, the happier the world becomes!
    ko: 네놈들이 돈을 내는 만큼 세상이 행복해진다!
    ja: |-
      お前たちが金を払うほど、
      幸せな世界になるのだ！
  d_nikke_drake_greatvillain_05_37:
    speaker: "<Monologue>"
    en: I scroll down to the comments below the video.
    ko: 스크롤을 내려 영상 아래 댓글을 확인한다.
    ja: |-
      スクロールして動画の下にある
      コメントを確認する
  d_nikke_drake_greatvillain_05_38:
    speaker: "<Narration>"
    en: '"A meaningful event AND a fun show to boot? I''m so jealous! I wish I could''ve
      been there!"'
    ko: "[좋은 행사에 즐거운 무대까지~ 직관하신 분들 정말 부럽네요~]"
    ja: |-
      「素敵なイベントに楽しいステージまで！
      　生で観れた人たちが本当に羨ましいです～」
  d_nikke_drake_greatvillain_05_39:
    speaker: "<Narration>"
    en: '"LOL If it wasn''t Drake hosting, people would''ve thought this was some
      kind of cult gathering LOL (14 replies)"'
    ko: "[ㅋㅋㅋ드레이크 말고 다른 사람이었으면 무슨 사이비 종교 현장인 줄 알았을 듯 (답글 14개)]"
    ja: |-
      「ドレイクじゃなくて他の人だったら、
      　カルト宗教の集会だな（返信14件）」
  d_nikke_drake_greatvillain_05_40:
    speaker: "<Narration>"
    en: '"I''d love to attend if an event like this happens again! Looking forward
      to hearing more positive news like this :) (1 reply)"'
    ko: "[또 이런 행사가 열리면 그땐 직접 가보고 싶네요! 앞으로도 이런 이야기들이 많이 들렸으면 좋겠어요ㅎㅎ (답글 1개)]"
    ja: |-
      「またこんなイベントが開催されたら、
      　次は絶対行ってみたい！
      　これからもこういう話が
      　たくさん聞けたら嬉しいです（返信1件）」
  d_nikke_drake_greatvillain_05_41:
    speaker: "<Narration>"
    en: '"This is so inspiring :D I''m going to make a donation tomorrow! Hehe."'
    ko: "[저도 이런 모습은 배워야겠어요^^ 내일 바로 기부하러 갑니다~ ㅎ]"
    ja: |-
      「こういう姿は見習わないと^^
      　明日早速寄付しに行きます～！」
  d_nikke_drake_greatvillain_05_42:
    speaker: "<Monologue>"
    en: I don't bother reading further and put down my phone.
    ko: 댓글을 더 보지 않고 핸드폰을 내려놓았다.
    ja: それ以上コメントは見ずに、携帯電話を置いた
  d_nikke_drake_greatvillain_05_43:
    speaker: drake_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_05_44:
    speaker: "<Self>"
    en: "... Don't be too disappointed that things didn't work out."
    ko: "…실패했다고 너무 실망하지는 마."
    ja: "…失敗したからって、そんなに落ち込むな"
  d_nikke_drake_greatvillain_05_45:
    speaker: "<Self>"
    en: There's always next time.
    ko: 다음에 더 확실하게 하면 되지.
    ja: 次はもっと確実にやればいい
  d_nikke_drake_greatvillain_05_46:
    speaker: drake_p
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  d_nikke_drake_greatvillain_05_47:
    speaker: "<Self>"
    en: Hehe?
    ko: 후후?
    ja: ふふ？
  d_nikke_drake_greatvillain_05_48:
    speaker: drake_p
    en: Hehehehe...
    ko: 후후후후후.
    ja: ふふふふふ。
  d_nikke_drake_greatvillain_05_49:
    speaker: drake_p
    en: Mwahahahaha!!
    ko: 후하하하하하--!!
    ja: フハハハハハ！！
  d_nikke_drake_greatvillain_05_50:
    speaker: drake_p
    en: Didn't work out?
    ko: 실패?
    ja: 失敗？
  d_nikke_drake_greatvillain_05_51:
    speaker: drake_p
    en: No, I'd call this a success in its own right!
    ko: 아니! 이건 또 하나의 성공이다!
    ja: |-
      違う！
      これも一種の成功だ！
  d_nikke_drake_greatvillain_05_52:
    speaker: drake_p
    en: I merely gave them a glimpse of my power...
    ko: 내 힘의 편린을 보여준 거지!
    ja: 私の力の片鱗を見せつけたということ！
  d_nikke_drake_greatvillain_05_53:
    speaker: drake_p
    en: This is the true power of a villain that captivates the public and draws them
      in!
    ko: 이거야말로 대중을 현혹해서 모이게 하는 빌런의 힘!
    ja: |-
      これこそが大衆を惑わし、
      集結させるヴィランの力！
  d_nikke_drake_greatvillain_05_54:
    speaker: drake_p
    en: This is the authority I possess as a villain!
    ko: 빌런의 권세라는 거다!
    ja: ヴィランの権威というものだ！
  d_nikke_drake_greatvillain_05_55:
    speaker: "<Self>"
    en: W-wow...
    ko: 오, 오오….
    ja: お、おお…
  d_nikke_drake_greatvillain_05_56:
    speaker: drake_p
    en: Now, people will believe anything I say.
    ko: 이제 사람들은 내가 하는 말이라면 어떤 말이라도 믿는다.
    ja: |-
      今や人々は、私の言うことなら
      どんな言葉でも信じる。
  d_nikke_drake_greatvillain_05_57:
    speaker: drake_p
    en: I could tell them chickens can fly, and they'd believe me!
    ko: 콩으로 메주를 쑨다고 해도 말이지!
    ja: 豆から味噌を造ると言ってもだ！
  d_nikke_drake_greatvillain_05_58:
    speaker: "<Self>"
    en: That's actually something they should believe.
    ko: 그건 믿어야 하는 말이긴 해.
    ja: それは信じるべき言葉ではあるな
  d_nikke_drake_greatvillain_05_59:
    speaker: drake_p
    en: You should make note of this, Moron.
    ko: 그러니 네놈도 잘 봐둬라.
    ja: 貴様もよく見ておけ。
  d_nikke_drake_greatvillain_05_60:
    speaker: drake_p
    en: After all, the greatest villain must know how to manipulate people just like
      how I'm doing.
    ko: 최강의 빌런은 지금처럼 사람들을 멋대로 조종할 줄도 알아야 하니까.
    ja: |-
      最強のヴィランたるもの、
      今回のように人々を意のままに操る術も
      知っておかねばならないからな。
  d_nikke_drake_greatvillain_05_61:
    speaker: drake_p
    en: In order to do so, I must first earn their trust.
    ko: 사람들을 조종하기 위해선, 일단 사람들에게 신뢰를 쌓아야 한다.
    ja: |-
      人々を操るためには、
      まず人々からの信頼を築かねばならない。
  d_nikke_drake_greatvillain_05_62:
    speaker: drake_p
    en: First, I'll make them trust me, then gradually bring them to my side.
    ko: 사람들이 나를 신뢰하게 만들면서 점점 내게 감화시키는 거다.
    ja: |-
      人々が私を信頼するように仕向け、
      徐々に感化していくのだ。
  d_nikke_drake_greatvillain_05_63:
    speaker: drake_p
    en: Soon, they'll become my followers and willingly obey my every word!
    ko: 그럼 결국 내 추종자가 되고, 내가 원하는 대로 움직여 준다!
    ja: |-
      そうすれば、ゆくゆくは私の追従者となり、
      私の意のままに動く！
  d_nikke_drake_greatvillain_05_64:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_05_65:
    speaker: drake_p
    en: You don't seem to believe me.
    ko: 못 믿는 눈치로군.
    ja: 信じられないという表情だな。
  d_nikke_drake_greatvillain_05_66:
    speaker: drake_p
    en: But there's already someone who became my follower through this method.
    ko: 하지만 이 방법으로 벌써 내 추종자가 된 사람이 있다.
    ja: |-
      だが、この方法ですでに
      私の追従者となった者がいる。
  d_nikke_drake_greatvillain_05_67:
    speaker: drake_p
    en: In fact, I'll be meeting them tomorrow to have a little chat!
    ko: 게다가 내일 만나서 함께 이야기를 나누기로 했지!
    ja: |-
      しかも、明日会って話をする
      約束までしたのだ！
  d_nikke_drake_greatvillain_05_68:
    speaker: "<Self>"
    en: You do know that's a charity ambassador meeting?
    ko: 그거 그냥 자선 단체 홍보대사 미팅이잖아.
    ja: |-
      それはただの慈善団体広報大使の
      ミーティングじゃないか
  d_nikke_drake_greatvillain_05_69:
    speaker: drake_p
    en: The ambassador meeting is nothing more than a cover.
    ko: 홍보대사 미팅은 명목일 뿐이다.
    ja: 広報大使のミーティングなど、名目上のことだ。
  d_nikke_drake_greatvillain_05_70:
    speaker: drake_p
    en: 'A discussion between adults requires two things: a justification, and something
      to gain out of it.'
    ko: 어른들의 대화에는 명목과 실리, 두 가지가 필요한 법이니까.
    ja: |-
      大人の会話には、名目と実利、
      その両方が必要だからな。
  d_nikke_drake_greatvillain_05_71:
    speaker: drake_p
    en: I will meet with my follower and impart the core values of the Villain Union.
    ko: 추종자와 만나서, 우리 빌런 연합의 필수 소양을 알려주고 오겠다.
    ja: |-
      追従者と会って、ヴィラン連合の
      心得を叩き込んでこよう。
  d_nikke_drake_greatvillain_05_72:
    speaker: "<Self>"
    en: The core values of the Villain Union?
    ko: 빌런 연합의 필수 소양?
    ja: ヴィラン連合の心得？
  d_nikke_drake_greatvillain_05_73:
    speaker: drake_p
    en: Have you already forgotten, Moron?!
    ko: 네놈! 벌써 잊은 거냐!
    ja: 貴様！もう忘れたのか！
  d_nikke_drake_greatvillain_05_74:
    speaker: drake_p
    en: Again, repeat after me!
    ko: 자, 다시 따라해라!
    ja: さあ、もう一度繰り返せ！
  d_nikke_drake_greatvillain_05_75:
    speaker: drake_p
    en: Friendship! Love! Youth!
    ko: 우정! 사랑! 청춘!
    ja: 友情！愛！青春！
  d_nikke_drake_greatvillain_05_76:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_drake_greatvillain_05_77:
    speaker: drake_p
    en: Friendship! Love! Youth!
    ko: 우정! 사랑! 청춘!
    ja: 友情！愛！青春！
  d_nikke_drake_greatvillain_05_78:
    speaker: "<Self>"
    en: Friendship. Love. Youth.
    ko: 우정. 사랑. 청춘.
    ja: 友情。愛。青春
  d_nikke_drake_greatvillain_05_79:
    speaker: drake_p
    en: Put some energy into it!
    ko: 기합을 넣어서 말해라!
    ja: もっと気合いを入れて言え！
  d_nikke_drake_greatvillain_05_80:
    speaker: drake_p
    en: Embody that Super Great Villain energy!
    ko: 슈퍼로 그레이트한 빌런 기합 말이다!
    ja: スーパーでグレイトなヴィランの気合いを！
  d_nikke_drake_greatvillain_05_81:
    speaker: "<Self>"
    en: "... Friendship! Love! Youth!"
    ko: "…우정! 사랑! 청춘!"
    ja: "…友情！愛！青春！"
  d_nikke_drake_greatvillain_05_82:
    speaker: drake_p
    en: Mwahahaha!!
    ko: 하하하하하하-!!
    ja: ハハハハハハ！！
  d_nikke_drake_greatvillain_05_83:
    speaker: drake_p
    en: I shall teach everyone the ways of the Villain Union!
    ko: 모든 사람들에게 빌런 연합의 소양을 불어넣겠다!
    ja: |-
      皆にヴィラン連合の心得を
      教え込んでやる！
  d_nikke_drake_greatvillain_05_84:
    speaker: drake_p
    en: Once I gather many followers, I will announce my transformation into a villain.
      It's gonna be perfect!
    ko: 잔뜩 생긴 추종자들과 다 함께, 빌런으로 전향했다고 발표하는 것도 좋겠군.
    ja: |-
      そして山ほどできた追従者たちと一緒に、
      ヴィランに転向したと発表するのもいいだろう。
  d_nikke_drake_greatvillain_05_85:
    speaker: drake_p
    en: Truly a fitting twist for the Great Villain.
    ko: 그거야말로 그레이트 빌런에게 걸맞은 반전이다.
    ja: |-
      それこそグレイトヴィランに相応しい、
      大どんでん返しだ。
  d_nikke_drake_greatvillain_05_86:
    speaker: drake_p
    en: The Ark will be abuzz with shock, and more shock, and even more shock.
    ko: 아마 충격의 충격의 충격으로 방주가 떠들썩해지겠지.
    ja: |-
      きっと、衝撃に次ぐ衝撃で、
      アーク中が大騒ぎになるだろうな。
  d_nikke_drake_greatvillain_05_87:
    speaker: drake_p
    en: The entire Ark will be talking about me!
    ko: 온 방주가 내 이야기로 가득할 거다!
    ja: アーク中が私の話で持ちきりになるに違いない！
  d_nikke_drake_greatvillain_05_88:
    speaker: drake_p
    en: Haha!
