---
d_nikke_laplace_ultimatehero_01:
  d_nikke_laplace_ultimatehero_01_1:
    speaker: "<Narration>"
    en: The door opens.
    ko: 지잉-
    ja: ウィーン――
  d_nikke_laplace_ultimatehero_01_2:
    speaker: laplace_p
    en: Birdie!
    ko: 버드 보이!
    ja: バードボーイ！
  d_nikke_laplace_ultimatehero_01_3:
    speaker: laplace_p
    en: Check this out!
    ko: 이걸 좀 봐라!
    ja: これを見てくれ！
  d_nikke_laplace_ultimatehero_01_4:
    speaker: "<Self>"
    en: Laplace?
    ko: 라플라스?
    ja: ラプラス？
  d_nikke_laplace_ultimatehero_01_5:
    speaker: laplace_p
    en: I threw this together yesterday and...
    ko: 이건 어제 급히 만든….
    ja: 昨日急いで作った――
  d_nikke_laplace_ultimatehero_01_6:
    speaker: "<Monologue>"
    en: I place my hand on Laplace's forehead.
    ko: 나는 라플라스의 이마에 손을 짚었다.
    ja: 私はラプラスのおでこに手を当てた
  d_nikke_laplace_ultimatehero_01_7:
    speaker: "<Self>"
    en: Are you okay?
    ko: 어디 아픈 건 아니지?
    ja: 具合でも悪いのか？
  d_nikke_laplace_ultimatehero_01_8:
    speaker: laplace_p
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_laplace_ultimatehero_01_9:
    speaker: laplace_p
    en: I'm perfectly fine!
    ko: 내 몸엔 아무 이상 없다!
    ja: どこも悪くはない！
  d_nikke_laplace_ultimatehero_01_10:
    speaker: "<Self>"
    en: Have you been eating well?
    ko: 밥은 잘 챙겨 먹었어?
    ja: 食事はちゃんととったか？
  d_nikke_laplace_ultimatehero_01_11:
    speaker: laplace_p
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_laplace_ultimatehero_01_12:
    speaker: laplace_p
    en: I already had breakfast, lunch, and even a snack!
    ko: 아침, 점심에 간식까지 챙겨 먹고 왔다!
    ja: |-
      朝食と昼食、それにおやつまで
      しっかりと食べた！
  d_nikke_laplace_ultimatehero_01_13:
    speaker: "<Self>"
    en: That's weird. Laplace would never enter through the door like a normal person...
    ko: 이상하네. 라플라스가 얌전히 문으로 들어올 리 없는데….
    ja: |-
      おかしい…ラプラスが
      ドアから入ってくるなんて…
  d_nikke_laplace_ultimatehero_01_14:
    speaker: laplace_p
    en: Forget that, Birdie!
    ko: 지금 중요한 건 그런 게 아니다, 버드 보이!
    ja: |-
      いま大切なのはそこじゃないんだ、
      バードボーイ！
  d_nikke_laplace_ultimatehero_01_15:
    speaker: laplace_p
    en: Look at this!
    ko: 이걸 좀 봐라!
    ja: これを見てくれ！
  d_nikke_laplace_ultimatehero_01_16:
    speaker: "<Monologue>"
    en: Laplace hands over a poster.
    ko: 라플라스가 포스터 한 장을 건넸다.
    ja: ラプラスがポスターを取り出した
  d_nikke_laplace_ultimatehero_01_17:
    speaker: "<Narration>"
    en: '"Next-Gen Heroes Wanted!"'
    ko: "[히어로 후배 모집 중!]"
    ja: "「ヒーローの後輩を募集中！」"
  d_nikke_laplace_ultimatehero_01_18:
    speaker: "<Narration>"
    en: '"Now recruiting aspiring heroes!"'
    ko: "[히어로가 될 후배들을 모집하고 있다!]"
    ja: |-
      「次のヒーローになる後輩たちを
      　募集している！」
  d_nikke_laplace_ultimatehero_01_19:
    speaker: "<Narration>"
    en: '"Interested in world peace? Contact us!"'
    ko: "[세계 평화에 관심이 있는 이들은 연락 바란다!]"
    ja: "「世界平和に興味がある者は連絡を！」"
  d_nikke_laplace_ultimatehero_01_20:
    speaker: "<Self>"
    en: "... What's this?"
    ko: "…이게 뭐야?"
    ja: "…これは？"
  d_nikke_laplace_ultimatehero_01_21:
    speaker: laplace_p
    en: I wanted to train some new heroes, so I threw this poster together in a hurry
      yesterday.
    ko: 히어로 후배를 양성하고 싶어서, 내가 어제 급히 만든 포스터다.
    ja: |-
      ヒーローの後輩を募集するため、
      私が昨日急いで作ったポスターだ。
  d_nikke_laplace_ultimatehero_01_22:
    speaker: laplace_p
    en: Think you could take a look and tell me if it turned out okay?
    ko: 그런데 포스터가 잘 나왔는지 확인을 좀 받고 싶다.
    ja: |-
      ポスターの仕上がりを
      確かめてもらいたい！
  d_nikke_laplace_ultimatehero_01_23:
    speaker: laplace_p
    en: I know I can count on you for an accurate assessment, Birdie.
    ko: 버드 보이라면 정확한 평가를 내려줄 테니까.
    ja: |-
      バードボーイならちゃんと
      評価をしてくれるはずだ。
  d_nikke_laplace_ultimatehero_01_24:
    speaker: "<Monologue>"
    en: I take the poster and examine it closely.
    ko: 포스터를 받아 천천히 살펴보았다.
    ja: ポスターを受け取り、ゆっくりと内容を確認した
  d_nikke_laplace_ultimatehero_01_25:
    speaker: "<Self>"
    en: You're asking people to contact you, but you didn't include any contact info.
    ko: 연락하라고 했는데, 연락처가 없네.
    ja: "「連絡を！」と書いてあるが、連絡先がないな"
  d_nikke_laplace_ultimatehero_01_26:
    speaker: "<Self>"
    en: You should add it to the poster.
    ko: 포스터에 연락처도 적어두는 게 좋겠어.
    ja: |-
      ポスターに連絡先を載せておいたほうが
      いいだろう
  d_nikke_laplace_ultimatehero_01_27:
    speaker: laplace_p
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_laplace_ultimatehero_01_28:
    speaker: laplace_p
    en: Good catch! You spotted something even I missed!
    ko: 내가 놓친 부분을 캐치하다니…!
    ja: 私が見落としていた部分を指摘するとは…！
  d_nikke_laplace_ultimatehero_01_29:
    speaker: laplace_p
    en: That's my Birdie!
    ko: 역시 버드 보이다!
    ja: さすがバードボーイ！
  d_nikke_laplace_ultimatehero_01_30:
    speaker: "<Self>"
    en: Did you draw this, Laplace?
    ko: 혹시 이건 라플라스가 그린 거야?
    ja: これはラプラスが描いたのか？
  d_nikke_laplace_ultimatehero_01_31:
    speaker: "<Monologue>"
    en: I point at the crude drawing above the poster's text. It looks like a yellow
      blob with horns.
    ko: 포스터 문구 위, 노란색 덩어리에 뿔이 나 있는 듯한 손그림을 가리켰다.
    ja: |-
      ポスターの文言の上にある、黄色の塊から
      ツノが生えたような手描きのイラストを指さした
  d_nikke_laplace_ultimatehero_01_32:
    speaker: laplace_p
    en: Of course!
    ko: 물론이다!
    ja: そうだ！
  d_nikke_laplace_ultimatehero_01_33:
    speaker: laplace_p
    en: I poured my heart and soul into it!
    ko: 내 진심을 가득 담은 그림이다!
    ja: 私の想いをこめたイラストだ！
  d_nikke_laplace_ultimatehero_01_34:
    speaker: "<Self>"
    en: It's supposed to symbolize a hero's heart, right?
    ko: 이건 히어로의 마음을 상징한 그림이지?
    ja: |-
      これはヒーローの精神を
      象徴的に描いたんだろう？
  d_nikke_laplace_ultimatehero_01_35:
    speaker: "<Self>"
    en: An abstract interpretation evoking powerful emotions that defy description...
    ko: 비재현적 언어로 강한 정서적 울림을 표현한….
    ja: 抽象的な表現で、強い感情のうねりを表現した…
  d_nikke_laplace_ultimatehero_01_36:
    speaker: laplace_p
    en: It's just a drawing of me.
    ko: 그건 그냥 날 그린 거다.
    ja: それは、私自身を描いたものだ。
  d_nikke_laplace_ultimatehero_01_37:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_01_38:
    speaker: laplace_p
    en: And I'm striking this pose!
    ko: 바로 이 포즈를 말이다!
    ja: 見ろ、このポーズだ！
  d_nikke_laplace_ultimatehero_01_39:
    speaker: "<Monologue>"
    en: Laplace points a finger toward the sky.
    ko: 라플라스는 하늘을 향해 손가락을 들어올렸다.
    ja: ラプラスは空に向かって人差し指を突き立てた
  d_nikke_laplace_ultimatehero_01_40:
    speaker: "<Self>"
    en: O-on second look, it actually looks just like you.
    ko: 다, 다시 보니까 라플라스랑 똑같이 생긴 것 같네.
    ja: よ、よく見たらラプラスにそっくりだな
  d_nikke_laplace_ultimatehero_01_41:
    speaker: laplace_p
    en: You think so too, Birdie? Hahaha!
    ko: 버드 보이가 보기에도 그런가? 하하하!
    ja: そう思うか？ははは！
  d_nikke_laplace_ultimatehero_01_42:
    speaker: "<Self>"
    en: What brought this on, though?
    ko: 그런데 갑자기 왜 후배 모집이야?
    ja: ところで、なぜ急に後輩の募集を？
  d_nikke_laplace_ultimatehero_01_43:
    speaker: laplace_p
    en: I was really inspired by a cartoon I watched yesterday!
    ko: 어제 애니메이션을 보면서 감명을 받았다!
    ja: 昨日アニメを観て感銘を受けたからだ！
  d_nikke_laplace_ultimatehero_01_44:
    speaker: laplace_p
    en: The hero passes the torch to the next generation, gives everything he's got
      to defeat the villain, and goes down in a blaze of glory...
    ko: 후배들에게 뒤를 맡기고, 악당을 쓰러트리기 위해 자신의 모든 힘을 써서 장렬하게 쓰러진 히어로….
    ja: |-
      後輩たちに後を託し、悪党を倒すために
      持てる力をすべて使い果たして、
      華麗に散っていくヒーロー…
  d_nikke_laplace_ultimatehero_01_45:
    speaker: laplace_p
    en: Watching that made me realize I ought to start mentoring the next generation
      myself!
    ko: 그걸 보면서 나도 후배를 만들어야겠다는 생각이 들었다!
    ja: |-
      それを観て、
      私も後輩を作らねばと思ったんだ！
  d_nikke_laplace_ultimatehero_01_46:
    speaker: "<Self>"
    en: "... You're not thinking of retiring, are you?"
    ko: "…혹시 은퇴를 생각하고 있는 건 아니지?"
    ja: "…まさか引退を考えているのか？"
  d_nikke_laplace_ultimatehero_01_47:
    speaker: laplace_p
    en: Absolutely not!
    ko: 아니!
    ja: 違う！
  d_nikke_laplace_ultimatehero_01_48:
    speaker: laplace_p
    en: There's no such thing as retirement in my book!
    ko: 내가 히어로를 은퇴하는 일은 없다!
    ja: 私がヒーローを引退することはない！
  d_nikke_laplace_ultimatehero_01_49:
    speaker: laplace_p
    en: Once a hero, forever a hero!
    ko: 한 번 히어로는 영원한 히어로다!
    ja: |-
      一度ヒーローになった者は、
      永遠にヒーローだからな！
  d_nikke_laplace_ultimatehero_01_50:
    speaker: "<Self>"
    en: So what made you suddenly want to mentor someone...?
    ko: 근데 후배는 왜 갑자기….
    ja: だが後輩だなんて…
  d_nikke_laplace_ultimatehero_01_51:
    speaker: laplace_p
    en: "'Cause it's cool!"
    ko: 멋있으니까!
    ja: カッコいいからだ！
  d_nikke_laplace_ultimatehero_01_52:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_01_53:
    speaker: laplace_p
    en: "... 'Cause it's cool!"
    ko: 멋있으니…!
    ja: カッコいいか…
  d_nikke_laplace_ultimatehero_01_54:
    speaker: "<Self>"
    en: Oh, I heard you the first time.
    ko: 못 알아들어서 가만히 있던 게 아니야.
    ja: 大丈夫だ。ちゃんと聞き取れた
  d_nikke_laplace_ultimatehero_01_55:
    speaker: laplace_p
    en: Yeah? Glad to hear you get it!
    ko: 그런가. 이해한 것 같아 다행이군!
    ja: そうか。理解できたようで何よりだ！
  d_nikke_laplace_ultimatehero_01_56:
    speaker: laplace_p
    en: I'll take that to mean the poster gets your approval!
    ko: 아무튼 버드 보이가 보기에, 포스터에 문제가 없다는 걸로 이해하겠다!
    ja: |-
      とにかくバードボーイから見ても
      ポスターに問題がないということは分かった！
  d_nikke_laplace_ultimatehero_01_57:
    speaker: "<Self>"
    en: Except there's no contact info.
    ko: 연락처가 없는 걸 빼면 말이지.
    ja: 連絡先がないこと以外はな
  d_nikke_laplace_ultimatehero_01_58:
    speaker: laplace_p
    en: Let's see...
    ko: 그거라면….
    ja: ならば…
  d_nikke_laplace_ultimatehero_01_59:
    speaker: "<Monologue>"
    en: Laplace grabs a pen from my desk and scribbles something on the poster.
    ko: 라플라스는 지휘관실에 있던 펜을 들어, 포스터에 뭔가를 적어 넣었다.
    ja: |-
      ラプラスは指揮官室にあったペンを取ると、
      ポスターに何かを書き込んだ
  d_nikke_laplace_ultimatehero_01_60:
    speaker: laplace_p
    en: This should do it.
    ko: 이걸로 되겠지.
    ja: これでいいだろう。
  d_nikke_laplace_ultimatehero_01_61:
    speaker: laplace_p
    en: Thanks, Birdie!
    ko: 고맙다, 버드 보이!
    ja: 助かった、バードボーイ！
  d_nikke_laplace_ultimatehero_01_62:
    speaker: laplace_p
    en: Honestly, I wasn't sure I'd done a good job with the poster until you took
      a look.
    ko: 사실 버드 보이에게 확인받기 전까진 포스터를 잘 만들었는지 확신이 없었는데,
    ja: |-
      バードボーイに確認してもらうまでは
      ポスターの出来に自信が持てなかったのだが…
  d_nikke_laplace_ultimatehero_01_63:
    speaker: laplace_p
    en: Hearing what you had to say really gave me confidence!
    ko: 버드 보이의 의견을 듣고 자신이 생겼다!
    ja: バードボーイの意見を聞いて自信が湧いてきた！
  d_nikke_laplace_ultimatehero_01_64:
    speaker: "<Self>"
    en: That's good to hear.
    ko: 그건 다행이네.
    ja: それはよかった
  d_nikke_laplace_ultimatehero_01_65:
    speaker: laplace_p
    en: See you next time, Birdie!
    ko: 그럼 다음에 또 보러 오겠다, 버드 보이!
    ja: では、また会おう！
  d_nikke_laplace_ultimatehero_01_66:
    speaker: laplace_p
    en: Heroic window smash!
    ko: 히어로 창문 깨기-!!
    ja: ヒーロー窓割り！！
  d_nikke_laplace_ultimatehero_01_67:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 와장창-
    ja: ガッシャーン！
  d_nikke_laplace_ultimatehero_01_68:
    speaker: "<Self>"
    en: Why'd she go right back to her usual self on the way out...?
    ko: 아니 왜 나갈 땐 또 평소처럼 나가는 거야….
    ja: どうして帰る時は、いつもと同じなんだ…
  d_nikke_laplace_ultimatehero_01_69:
    speaker: "<Narration>"
    en: The next day...
    ko: 다음 날.
    ja: 翌日
  d_nikke_laplace_ultimatehero_01_70:
    speaker: laplace_p
    en: Heroic window smash!
    ko: 히어로 창문 부수기-!!
    ja: ヒーロー窓砕き！！
  d_nikke_laplace_ultimatehero_01_71:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 와장창-
    ja: ガッシャーン！
  d_nikke_laplace_ultimatehero_01_72:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_01_73:
    speaker: laplace_p
    en: Birdie! We've got an emergency!
    ko: 버드 보이! 긴급 사태다!
    ja: バードボーイ！緊急事態だ！
  d_nikke_laplace_ultimatehero_01_74:
    speaker: "<Self>"
    en: What is it this time?
    ko: 이번엔 무슨 일이야?
    ja: 今度はどうした？
  d_nikke_laplace_ultimatehero_01_75:
    speaker: laplace_p
    en: Nobody's signed up to be a next-gen hero!
    ko: 후배 모집에 지원자가 없다!
    ja: 後輩の募集に、誰も応募してこない！
  d_nikke_laplace_ultimatehero_01_76:
    speaker: "<Self>"
    en: It's only been a day since you put the poster up.
    ko: 아직 붙인 지 하루밖에 안 지났잖아.
    ja: まだ1日しか経っていないだろう
  d_nikke_laplace_ultimatehero_01_77:
    speaker: laplace_p
    en: A day or two is beside the point!
    ko: 하루인지 이틀인지는 중요하지 않다!
    ja: 1日だろうと2日だろうと関係ない！
  d_nikke_laplace_ultimatehero_01_78:
    speaker: laplace_p
    en: I expected applicants to be lining up in droves by now!
    ko: 내 예상대로라면 오늘부터 지원자가 바글바글해야 한다!
    ja: |-
      私の予想では、今日から
      応募者がわんさか来ているはずなんだ！
  d_nikke_laplace_ultimatehero_01_79:
    speaker: laplace_p
    en: But there's barely anyone here...
    ko: 그런데 이렇게나 지원자가 없다니….
    ja: それなのに、こんなに応募者がいないなんて…
  d_nikke_laplace_ultimatehero_01_80:
    speaker: laplace_p
    en: The Ark must be facing a full-blown crisis!
    ko: 이건 방주의 대위기가 틀림 없다!
    ja: これはアークの一大事に違いない！
  d_nikke_laplace_ultimatehero_01_81:
    speaker: "<Self>"
    en: I don't think it's that serious...
    ko: 고작 그런 일로 대위기까진 아닌 것 같은데….
    ja: 別に一大事というほどでもないと思うが…
  d_nikke_laplace_ultimatehero_01_82:
    speaker: laplace_p
    en: Letting your guard down is exactly how bigger crises happen, Birdie!
    ko: 방심이 더 큰 위기를 불러오는 법이다, 버드 보이!
    ja: |-
      その油断が大きな危機を招くんだぞ、
      バードボーイ！
  d_nikke_laplace_ultimatehero_01_83:
    speaker: laplace_p
    en: That's why...
    ko: 그러니까.
    ja: だから…
  d_nikke_laplace_ultimatehero_01_84:
    speaker: "<Monologue>"
    en: Laplace grabs my hand and pulls me along.
    ko: 라플라스가 내 손을 잡아 끌었다.
    ja: ラプラスが私の手を引っ張った
  d_nikke_laplace_ultimatehero_01_85:
    speaker: laplace_p
    en: We're recruiting the next generation of heroes ourselves!
    ko: 우리가 직접 히어로 후배가 될 지원자를 모집하러 가는 거다.
    ja: |-
      私たちで、ヒーローの
      後輩となる者を集める。
  d_nikke_laplace_ultimatehero_01_86:
    speaker: laplace_p
    en: C'mon, to the poster!
    ko: 지금 당장 포스터 앞으로 가자!
    ja: 今すぐ、ポスターのところへ行こう！
  d_nikke_laplace_ultimatehero_01_87:
    speaker: "<Self>"
    en: Wait, let me at least clean up the shattered glass...!
    ko: 잠깐만. 깨진 유리는 정리하고 가야…!
    ja: 待ってくれ。割れたガラスを片付けてから…！
  d_nikke_laplace_ultimatehero_01_88:
    speaker: "<Monologue>"
    en: But Laplace is too strong, and she drags me out of the room.
    ko: 하지만 라플라스가 이끄는 강한 힘에, 나는 질질 끌려갈 수밖에 없었다.
    ja: |-
      私はそのままラプラスに引っ張られ、
      ズルズルと引きずられていった
d_nikke_laplace_ultimatehero_02:
  d_nikke_laplace_ultimatehero_02_1:
    speaker: cocoa
    en: I don't see it anywhere...
    ko: 아무리 찾아 봐도 업써.
    ja: 探したけど、なかった。
  d_nikke_laplace_ultimatehero_02_2:
    speaker: biscuit
    en: I know, right?
    ko: 그러게요.
    ja: そうですね。
  d_nikke_laplace_ultimatehero_02_3:
    speaker: cocoa
    en: I know what this is! It's the first test to become a hero!
    ko: 코코아는 알 수 이써. 이건 히어로가 되기 위한 첫 번째 테스트야.
    ja: |-
      ココアには分かる。
      これはヒーローになるための最初のテスト。
  d_nikke_laplace_ultimatehero_02_4:
    speaker: cocoa
    en: Only those who solve it get to be a hero!
    ko: 이 문제를 풀고 온 자만이 히어로가 될 수 있는 거지.
    ja: この問題を解いた人だけがヒーローになれる。
  d_nikke_laplace_ultimatehero_02_5:
    speaker: laplace_p
    en: B-Birdie! We've got a potential recruit checking out the poster!
    ko: 버, 버드 보이! 포스터에 관심을 보이는 지원자가 있다!
    ja: |-
      バ、バードボーイ！
      ポスターに興味を示している者がいるぞ！
  d_nikke_laplace_ultimatehero_02_6:
    speaker: "<Self>"
    en: Yeah, I guess so.
    ko: 그러게.
    ja: そうだな
  d_nikke_laplace_ultimatehero_02_7:
    speaker: cocoa
    en: Oh, Master.
    ko: 오. 주인.
    ja: おっ、主人。
  d_nikke_laplace_ultimatehero_02_8:
    speaker: biscuit
    en: Hello, Trainer.
    ko: 아, 훈련사님.
    ja: あっ、訓練士さん。
  d_nikke_laplace_ultimatehero_02_9:
    speaker: "<Self>"
    en: Hey there. You two checking out the poster?
    ko: 안녕. 둘 다 포스터를 보고 있는 거야?
    ja: やあ。二人とも、ポスターを見ているのか？
  d_nikke_laplace_ultimatehero_02_10:
    speaker: cocoa
    en: Yeah,
    ko: 마자.
    ja: そのとーり。
  d_nikke_laplace_ultimatehero_02_11:
    speaker: cocoa
    en: it said to get in touch if you're interested in world peace.
    ko: 세계 평화에 관심이 있으면 연락하래서 보고 이써써.
    ja: |-
      世界平和に興味があるなら連絡をって
      書いてあるから、見てた。
  d_nikke_laplace_ultimatehero_02_12:
    speaker: cocoa
    en: Protecting world peace is what professional maids do.
    ko: 세계 평화를 지키는 건, 프로 메이드가 할 일이니깐.
    ja: |-
      世界の平和を守るのは、
      プロメイドの仕事だから。
  d_nikke_laplace_ultimatehero_02_13:
    speaker: biscuit
    en: The little guy I'm taking care of got so excited after watching a hero cartoon
      yesterday.
    ko: 이번에 맡게 된 친구가, 어제 히어로 애니메이션을 보고서 눈을 엄청 빛내더라구요.
    ja: |-
      預かることになった子が、
      昨日ヒーローのアニメを観て
      目をキラキラ輝かせていて…
  d_nikke_laplace_ultimatehero_02_14:
    speaker: biscuit
    en: I think he really wants to be a hero, so I thought it'd be fun to learn alongside
      him. That's why I was checking out the poster, hehe.
    ko: 아무래도 히어로가 되고 싶은 것 같아서, 저도 같이 배워볼까 싶은 마음에 포스터를 보고 있었어요. 헤헤.
    ja: |-
      ヒーローに憧れているみたいなので、
      私も勉強してみようと思って…
      ポスターをながめていました。へへ。
  d_nikke_laplace_ultimatehero_02_15:
    speaker: "<Monologue>"
    en: A dog at Biscuit's feet wags its tail.
    ko: 비스킷의 다리 밑에 있는 강아지가 꼬리를 흔들고 있다.
    ja: ビスケットの足元にいるイヌが尻尾を振っている
  d_nikke_laplace_ultimatehero_02_16:
    speaker: biscuit
    en: Meet Bruce!
    ko: 바로 이 친구예요. 이름은 브루스!
    ja: この子です。ブルースっていうんですよ！
  d_nikke_laplace_ultimatehero_02_17:
    speaker: "<Self>"
    en: A dog that watches hero cartoons...?
    ko: 강아지가 히어로 애니메이션을 봤다고…?
    ja: イヌがヒーローのアニメを…？
  d_nikke_laplace_ultimatehero_02_18:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_02_19:
    speaker: biscuit
    en: Yesterday, he glanced at the TV, then stayed glued to it until the cartoon
      was over.
    ko: 어제 켜져 있던 TV를 한 번 보더니, 애니메이션이 끝날 때까지 계속 지켜보던 걸요?
    ja: |-
      昨日、つけっぱなしになっていたテレビを
      見ている子がいるなと思ったら、
      終わるまでずっと見入っていたんです。
  d_nikke_laplace_ultimatehero_02_20:
    speaker: "<Self>"
    en: Is that even possible...?
    ko: 그게 있을 수 있는 일인가….
    ja: そんなことがあり得るのか…
  d_nikke_laplace_ultimatehero_02_21:
    speaker: laplace_p
    en: Birdie!
    ko: 버드 보이!
    ja: バードボーイ！
  d_nikke_laplace_ultimatehero_02_22:
    speaker: laplace_p
    en: Anyone can aspire to be a hero, no matter their gender, age, race, or species!
    ko: 히어로가 되고 싶은 마음을 지니는 건, 성별도, 나이도, 종족도 가리지 않는다!
    ja: |-
      ヒーローになりたいという気持ちに、
      性別も、年齢も、種族も関係ない！
  d_nikke_laplace_ultimatehero_02_23:
    speaker: bruce
    en: "*Woof! Woof, woof!*"
    ko: 멍-! 멍멍-!
    ja: ワン！ワンワン！
  d_nikke_laplace_ultimatehero_02_24:
    speaker: laplace_p
    en: That's the spirit!
    ko: 그래, 바로 그 기세다!
    ja: そう、まさにその勢いだ！
  d_nikke_laplace_ultimatehero_02_25:
    speaker: cocoa
    en: But there's a problem, Master.
    ko: 주인. 그런데 문제가 이써.
    ja: 主人。でも問題がある。
  d_nikke_laplace_ultimatehero_02_26:
    speaker: cocoa
    en: The poster says to contact them if you're interested, but there's no contact
      info.
    ko: 관심 있으면 연락을 하라고 써 있는데, 정작 연락처가 업써.
    ja: |-
      「興味があるなら連絡を」って
      書いてるけど、連絡先がない。
  d_nikke_laplace_ultimatehero_02_27:
    speaker: "<Self>"
    en: Hm? I could've sworn Laplace wrote down her contact info on it yesterday.
    ko: |-
      ?
      어제 분명 연락처를 적었을 텐데.
    ja: |-
      ？
      昨日、確かに連絡先を書いたはずだが
  d_nikke_laplace_ultimatehero_02_28:
    speaker: "<Monologue>"
    en: Looking closely, I see the contact info written in tiny letters in one corner.
    ko: 포스터를 자세히 살펴보니, 연락처는 한쪽 귀퉁이에 아주 작은 글씨로 적혀 있었다.
    ja: |-
      ポスターをよく見ると、連絡先は片隅に
      とても小さな字で書かれていた
  d_nikke_laplace_ultimatehero_02_29:
    speaker: "<Self>"
    en: Why'd she write it so small...?
    ko: 연락처는 왜 이렇게 작게 써둔 거야….
    ja: どうしてこんな小さな字で…
  d_nikke_laplace_ultimatehero_02_30:
    speaker: cocoa
    en: Huh? Did you find it?
    ko: "?? 연락처 찾아써?"
    ja: "？？連絡先、あった？"
  d_nikke_laplace_ultimatehero_02_31:
    speaker: "<Self>"
    en: Right here, in the corner.
    ko: 여기 모서리에 연락처가 있어.
    ja: ここの隅に記載されている
  d_nikke_laplace_ultimatehero_02_32:
    speaker: cocoa
    en: Ooooh!
    ko: "…오오!"
    ja: "…おおっ！"
  d_nikke_laplace_ultimatehero_02_33:
    speaker: cocoa
    en: Master, you're amazing!
    ko: 주인 대다내!
    ja: 主人、すごい！
  d_nikke_laplace_ultimatehero_02_34:
    speaker: cocoa
    en: Thanks to you, we've passed the first test!
    ko: 주인 덕분에 벌써 첫 번째 테스트를 통과해써!
    ja: |-
      主人のおかげで
      もう最初のテストにごーかくした！
  d_nikke_laplace_ultimatehero_02_35:
    speaker: cocoa
    en: I'll contact them right now!
    ko: 지금 바로 연락해 보께!
    ja: 今すぐ連絡してみる！
  d_nikke_laplace_ultimatehero_02_36:
    speaker: laplace_p
    en: No need for that, future hero!
    ko: 그럴 필요는 없다. 미래의 히어로!
    ja: その必要はないぞ。未来のヒーロー！
  d_nikke_laplace_ultimatehero_02_37:
    speaker: "<Monologue>"
    en: Laplace places her hand on Cocoa's shoulder.
    ko: 라플라스가 코코아의 어깨에 손을 얹었다.
    ja: ラプラスがココアの肩に手をのせた
  d_nikke_laplace_ultimatehero_02_38:
    speaker: laplace_p
    en: Just come straight to me! I'm the one people contact anyway!
    ko: 내게 직접 말하면 된다! 연락을 받는 건 나니까!
    ja: |-
      私に直接言えばいい！
      この連絡先は私のものだからな！
  d_nikke_laplace_ultimatehero_02_39:
    speaker: cocoa
    en: You're the one who put up this poster, Laplace?
    ko: 라플라스가 이 포스터를 붙인 거야?
    ja: ラプラスがこのポスターを貼ったの？
  d_nikke_laplace_ultimatehero_02_40:
    speaker: laplace_p
    en: That's right! That's why I'm on the poster too!
    ko: 그렇다. 그래서 포스터에 내 모습도 그려져 있지!
    ja: |-
      そうだ。
      ポスターに私の姿も描いてある！
  d_nikke_laplace_ultimatehero_02_41:
    speaker: "<Monologue>"
    en: Laplace points at the drawing of herself on the poster.
    ko: 라플라스가 포스터의 본인… 을 가리켰다.
    ja: ラプラスがポスターに描かれた自分…を指さした
  d_nikke_laplace_ultimatehero_02_42:
    speaker: cocoa
    en: I thought whoever drew it messed up and just left it unfinished...
    ko: 저거 그냥 잘못 그려서 그리다 만 게 아니어써?
    ja: |-
      これ、失敗したやつをそのまま
      貼ったのかと思ってた。
  d_nikke_laplace_ultimatehero_02_43:
    speaker: biscuit
    en: I also thought it was just a pretty yellow blob.
    ko: 저도 그냥 예쁜 노란색 덩어리인 줄 알았어요.
    ja: |-
      私も、ただのきれいな黄色の塊だと
      思っていました。
  d_nikke_laplace_ultimatehero_02_44:
    speaker: laplace_p
    en: Th-that can't be right!
    ko: 그, 그럴 리가 없다!
    ja: そ、そんなはずはない！
  d_nikke_laplace_ultimatehero_02_45:
    speaker: laplace_p
    en: Look closer!
    ko: 자세히 봐라!
    ja: よく見ろ！
  d_nikke_laplace_ultimatehero_02_46:
    speaker: laplace_p
    en: Anyone can tell that's me!
    ko: 누가 봐도 내 모습이지 않나!
    ja: どう見ても私じゃないか！
  d_nikke_laplace_ultimatehero_02_47:
    speaker: biscuit
    en: Now that you mention it, I can kind of see it...
    ko: 말씀하신 걸 들어보니까 그렇게 보이는 것 같기도 하고….
    ja: 言われてみれば、そんな気も…
  d_nikke_laplace_ultimatehero_02_48:
    speaker: cocoa
    en: I still don't get it.
    ko: 코코아는 아직도 잘 모르게써.
    ja: ココアは、まだよく分かんない。
  d_nikke_laplace_ultimatehero_02_49:
    speaker: laplace_p
    en: "...!!"
    ko: "…!!"
    ja: "…！！"
  d_nikke_laplace_ultimatehero_02_50:
    speaker: laplace_p
    en: A-anyway, it's obvious you two are really into heroes.
    ko: 아, 아무튼 둘이 히어로에 관심이 많다는 건 잘 알겠다.
    ja: |-
      と、とにかく2人がヒーローに
      興味津々だということは分かった。
  d_nikke_laplace_ultimatehero_02_51:
    speaker: bruce
    en: "*Woof, woof!*"
    ko: 멍멍-!
    ja: ワンワン！
  d_nikke_laplace_ultimatehero_02_52:
    speaker: laplace_p
    en: Wait!
    ko: 그렇군!
    ja: そうだった！
  d_nikke_laplace_ultimatehero_02_53:
    speaker: laplace_p
    en: Make that three!
    ko: 둘이 아니라 셋이었다!
    ja: 2人ではなく、3人だったな！
  d_nikke_laplace_ultimatehero_02_54:
    speaker: "<Monologue>"
    en: Bruce wags his tail and nuzzles against Laplace's legs.
    ko: 브루스는 꼬리를 흔들며 라플라스의 다리에 몸을 비볐다.
    ja: |-
      ブルースは、しっぽを振りながら
      ラプラスの足に体をこすりつけた
  d_nikke_laplace_ultimatehero_02_55:
    speaker: "<Self>"
    en: So you two... I mean, you three are all joining the hero training?
    ko: 그럼 둘… 아니, 셋 다 히어로 수업에 참가하는 거지?
    ja: |-
      じゃあ、2人…じゃなくて3人は
      ヒーローの訓練に参加するんだな？
  d_nikke_laplace_ultimatehero_02_56:
    speaker: cocoa
    en: I'll try it out.
    ko: 일단 참가해 볼 생각은 이써.
    ja: うん。参加しようと思う。
  d_nikke_laplace_ultimatehero_02_57:
    speaker: biscuit
    en: Me too. I want to join, for Bruce's sake.
    ko: 저도 브루스를 위해서 참가는 하고 싶어요.
    ja: 私もブルースのために参加したいです。
  d_nikke_laplace_ultimatehero_02_58:
    speaker: laplace_p
    en: Excellent! Your passion has truly moved me, future heroes!
    ko: 좋다! 나는 후보들의 열의에 감격했다!
    ja: よし！君たちの熱意に感激した！
  d_nikke_laplace_ultimatehero_02_59:
    speaker: laplace_p
    en: Hero training begins first thing tomorrow!
    ko: 그런 의미에서, 바로 내일부터 히어로 수업 시작이다!
    ja: |-
      ということで、早速明日から
      ヒーローレッスンを始める！
  d_nikke_laplace_ultimatehero_02_60:
    speaker: "<Self>"
    en: Not today?
    ko: 오늘부터가 아니라?
    ja: 今日からじゃないのか？
  d_nikke_laplace_ultimatehero_02_61:
    speaker: laplace_p
    en: A great lesson begins with thorough preparation.
    ko: 좋은 수업은 철저한 준비 위에 존재할 수 있지.
    ja: |-
      よいヒーローレッスンは、徹底した
      準備があってこそ成り立つものだ。
  d_nikke_laplace_ultimatehero_02_62:
    speaker: laplace_p
    en: So with that, I'll head off and get ready for class!
    ko: "…그런 의미에서 나는 수업 준비를 위해 먼저 가보도록 하겠다!"
    ja: |-
      …では、私は準備があるので
      先に失礼させてもらう！
  d_nikke_laplace_ultimatehero_02_63:
    speaker: "<Monologue>"
    en: Laplace strikes a cool pose and confidently walks away,
    ko: 라플라스는 멋지게 폼을 잡으며 뚜벅뚜벅 돌아갔다.
    ja: |-
      ラプラスはカッコよくポーズを決めると
      スタスタと去っていった
  d_nikke_laplace_ultimatehero_02_64:
    speaker: "<Monologue>"
    en: only to come right back...
    ko: "…가 다시 되돌아 왔다."
    ja: "…と思った瞬間に、戻ってきた"
  d_nikke_laplace_ultimatehero_02_65:
    speaker: laplace_p
    en: Does that picture... really not look like me?
    ko: 그런데… 정말 저 그림이 내 모습으로 보이지 않는 건가?
    ja: |-
      ところで…本当にあのイラストは
      私に見えなかったのか？
  d_nikke_laplace_ultimatehero_02_66:
    speaker: biscuit
    en: N-now that I know it's you, I can kind of see it... but then again, maybe
      not...
    ko: 저, 정체를 알고서 보면 그렇게 보이는 것 같기도 하고… 아닌 것 같기도 하고….
    ja: |-
      えっと、正解を言われてから見ると
      そう見えるような…見えないような…
  d_nikke_laplace_ultimatehero_02_67:
    speaker: cocoa
    en: I'll teach you how to draw when we get to hero training.
    ko: 히어로 수업 받으러 가면, 코코아가 그림에 대해 알려주께.
    ja: |-
      ヒーローレッスンの時に、
      ココアが絵の描き方を教えてあげる。
  d_nikke_laplace_ultimatehero_02_68:
    speaker: laplace_p
    en: I... see.
    ko: 그렇… 군.
    ja: そうか…
  d_nikke_laplace_ultimatehero_02_69:
    speaker: "<Monologue>"
    en: Laplace finally leaves for real this time,
    ko: 라플라스는 이번에야말로 정말 돌아갔다.
    ja: ラプラスは今度こそ本当に去っていった
  d_nikke_laplace_ultimatehero_02_70:
    speaker: "<Monologue>"
    en: quietly peeling the poster she'd put up off the bulletin board.
    ko: 슬쩍 게시판에 붙여둔 포스터를 떼고서.
    ja: |-
      そっと掲示板に貼ってあったポスターを
      剥がして…
d_nikke_laplace_ultimatehero_03:
  d_nikke_laplace_ultimatehero_03_1:
    speaker: "<Narration>"
    en: The next day...
    ko: 다음 날.
    ja: 翌日
  d_nikke_laplace_ultimatehero_03_2:
    speaker: "<Monologue>"
    en: Last night, Laplace told me where today's hero training would be held.
    ko: 어제 저녁, 라플라스에게 오늘 히어로 수업을 진행할 장소를 전달받았다.
    ja: |-
      昨晩、ラプラスから
      今日の訓練を行う場所を教えてもらった
  d_nikke_laplace_ultimatehero_03_3:
    speaker: "<Self>"
    en: Well, you told me to come, so here I am...
    ko: 오라고 해서 오긴 왔는데….
    ja: 来いと言われて来てみたが…
  d_nikke_laplace_ultimatehero_03_4:
    speaker: biscuit
    en: Wow, this place is huge!
    ko: 와~ 여기 엄청 넓어요.
    ja: わぁ～、とっても広いですね。
  d_nikke_laplace_ultimatehero_03_5:
    speaker: biscuit
    en: I wonder what this place is for.
    ko: 대체 뭐하는 곳일까요?
    ja: 何をする場所なのでしょうか？
  d_nikke_laplace_ultimatehero_03_6:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_03_7:
    speaker: cocoa
    en: There's a whole bunch of big glass panes over there.
    ko: 저기 큰 유리가 잔뜩 이써.
    ja: あそこ、大きなガラスがいっぱいある。
  d_nikke_laplace_ultimatehero_03_8:
    speaker: laplace_p
    en: Finally!
    ko: 드디어 왔나!
    ja: やっと来たか！
  d_nikke_laplace_ultimatehero_03_9:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_laplace_ultimatehero_03_10:
    speaker: "<Monologue>"
    en: Before we know it, Laplace is standing beside us.
    ko: 어느새 라플라스가 우리 옆에 와 있었다.
    ja: いつの間にかラプラスが私たちの隣に立っていた
  d_nikke_laplace_ultimatehero_03_11:
    speaker: laplace_p
    en: Welcome, candidates!
    ko: 잘 왔다, 후보들!
    ja: みんな、よく来てくれた！
  d_nikke_laplace_ultimatehero_03_12:
    speaker: laplace_p
    en: Starting today, this is where you'll train to become heroes!
    ko: 지금부터 후보들은 여기서 히어로가 되기 위한 수업을 받게 될 거다!
    ja: |-
      候補生の君たちには、今からここで
      ヒーローになるためのレッスンを受けてもらう！
  d_nikke_laplace_ultimatehero_03_13:
    speaker: laplace_p
    en: I had this place prepared especially for all of you!
    ko: 후보들을 위해 특별히 준비한, 바로 이 곳에서 말이지!
    ja: |-
      君たちのために特別に用意した、
      この場所で！
  d_nikke_laplace_ultimatehero_03_14:
    speaker: laplace_p
    en: Hahaha! No need to thank me!
    ko: 하하하! 그렇게 감사하지 않아도 된다!
    ja: ははは！そんなに感謝しなくてもいい！
  d_nikke_laplace_ultimatehero_03_15:
    speaker: laplace_p
    en: After all, you'll be learning from none other than yours truly!
    ko: 후보들은 다른 누구도 아닌, 바로 나에게 히어로가 되기 위한 수업을 받으니까 말이다!
    ja: |-
      君たちは他の誰でもなく、この私から
      ヒーローになるためのレッスンを
      受けるのだからな！
  d_nikke_laplace_ultimatehero_03_16:
    speaker: laplace_p
    en: You may only be candidates now, but you're all future elite heroes!
    ko: 아직 후보라고는 하지만, 엘리트 히어로가 될 예정이라고 할 수 있지!
    ja: |-
      まだ候補生だが、未来のエリートヒーローだと
      言っても過言ではないだろう！
  d_nikke_laplace_ultimatehero_03_17:
    speaker: laplace_p
    en: So naturally, you deserve the very best!
    ko: 그러니까 당연한 대우라고 생각하면 된다!
    ja: だから、当然の待遇だと思って構わないぞ！
  d_nikke_laplace_ultimatehero_03_18:
    speaker: "<Self>"
    en: You sound pretty confident.
    ko: 상당히 자신만만한데?
    ja: ずいぶん自信満々だな？
  d_nikke_laplace_ultimatehero_03_19:
    speaker: laplace_p
    en: Of course! But heroes let their actions do the talking.
    ko: 당연하다! 하지만 히어로는 행동으로 보여주는 법.
    ja: |-
      もちろんだ！
      だが、ヒーローとは行動で示すもの。
  d_nikke_laplace_ultimatehero_03_20:
    speaker: laplace_p
    en: Now then, let's begin the lesson!
    ko: 그럼 바로 수업을 시작하도록 하겠다!
    ja: 早速レッスンを始めよう！
  d_nikke_laplace_ultimatehero_03_21:
    speaker: laplace_p
    en: Candidate No. 1!
    ko: 후보 1호!
    ja: 候補生1号！
  d_nikke_laplace_ultimatehero_03_22:
    speaker: "<Monologue>"
    en: Laplace points at Cocoa.
    ko: 라플라스가 코코아를 가리켰다.
    ja: ラプラスがココアを指さした
  d_nikke_laplace_ultimatehero_03_23:
    speaker: cocoa
    en: I'm Candidate No. 1?
    ko: 코코아가 후보 1호인 거야?
    ja: ココアが、こーほせー1号？
  d_nikke_laplace_ultimatehero_03_24:
    speaker: laplace_p
    en: That's right!
    ko: 그렇다!
    ja: そうだ！
  d_nikke_laplace_ultimatehero_03_25:
    speaker: laplace_p
    en: You three are Candidate No. 1, No. 2, and No. 3!
    ko: 순서대로 후보 1호, 2호, 3호다!
    ja: 順番に候補生1号、2号、3号だ！
  d_nikke_laplace_ultimatehero_03_26:
    speaker: "<Monologue>"
    en: Laplace points at Cocoa, Biscuit, and Bruce respectively.
    ko: 라플라스가 코코아, 비스킷, 브루스를 차례로 가리켰다.
    ja: |-
      ラプラスがココア、ビスケット、
      ブルースを順番に指さした
  d_nikke_laplace_ultimatehero_03_27:
    speaker: laplace_p
    en: First, I'll start with Candidate No. 1's lesson. Then I'll move on to No.
      2 and No. 3!
    ko: 먼저 후보 1호를 위한 수업을 진행하고, 다음으로 2호와 3호의 수업을 진행하도록 하지!
    ja: |-
      まずは候補生1号のためのレッスンを行い、
      次に2号と3号のレッスンを行うつもりだ！
  d_nikke_laplace_ultimatehero_03_28:
    speaker: cocoa
    en: Okey dokey,
    ko: 알아써.
    ja: 分かった。
  d_nikke_laplace_ultimatehero_03_29:
    speaker: cocoa
    en: I'll do my best.
    ko: 코코아 열심히 하께.
    ja: ココア、がんばる。
  d_nikke_laplace_ultimatehero_03_30:
    speaker: laplace_p
    en: That's the spirit, Candidate No. 1!
    ko: 좋은 자세다, 후보 1호!
    ja: その調子だ、候補生1号！
  d_nikke_laplace_ultimatehero_03_31:
    speaker: laplace_p
    en: Now, do exactly as I do!
    ko: 그럼 일단 나를 따라해라!
    ja: では、まず私の真似をしてみてくれ！
  d_nikke_laplace_ultimatehero_03_32:
    speaker: laplace_p
    en: Huuup!
    ko: 흐읍!
    ja: すぅっ！
  d_nikke_laplace_ultimatehero_03_33:
    speaker: "<Monologue>"
    en: Laplace takes a deep breath, filling her lungs until her stomach bulges.
    ko: 라플라스는 숨을 크게 들이쉬더니, 배를 부풀렸다.
    ja: |-
      ラプラスは大きく息を吸い込み、
      腹をふくらませた
  d_nikke_laplace_ultimatehero_03_34:
    speaker: laplace_p
    en: Come on... Do as I do...!
    ko: 어서…따라해라…!
    ja: 早く…真似をするんだ…！
  d_nikke_laplace_ultimatehero_03_35:
    speaker: cocoa
    en: "'Kay!"
    ko: 알아써!
    ja: 分かった！
  d_nikke_laplace_ultimatehero_03_36:
    speaker: cocoa
    en: Huuup!
    ko: 흐읍!
    ja: すぅっ！
  d_nikke_laplace_ultimatehero_03_37:
    speaker: "<Monologue>"
    en: Cocoa also takes a deep breath, filling her lungs until her stomach bulges.
    ko: 코코아도 숨을 크게 들이쉬고, 배를 부풀렸다.
    ja: |-
      ココアも大きく息を吸い込み、
      腹をふくらませた
  d_nikke_laplace_ultimatehero_03_38:
    speaker: laplace_p
    en: Bwahaha!
    ko: 와하하!
    ja: ワッハッハッ！
  d_nikke_laplace_ultimatehero_03_39:
    speaker: cocoa
    en: Bwahaha!
    ko: 와하하!
    ja: ワッハッハッ！
  d_nikke_laplace_ultimatehero_03_40:
    speaker: laplace_p
    en: Huuup!
    ko: 흐읍!
    ja: すぅっ！
  d_nikke_laplace_ultimatehero_03_41:
    speaker: cocoa
    en: Huuup!
    ko: 흐읍!
    ja: すぅっ！
  d_nikke_laplace_ultimatehero_03_42:
    speaker: laplace_p
    en: Bwahahaha!
    ko: 와하하하!
    ja: ワッハッハッハッ！
  d_nikke_laplace_ultimatehero_03_43:
    speaker: cocoa
    en: Bwahahaha!
    ko: 와하하하!
    ja: ワッハッハッハッ！
  d_nikke_laplace_ultimatehero_03_44:
    speaker: cocoa
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_03_45:
    speaker: cocoa
    en: Why are we doing this again?
    ko: 그런데 이거 왜 하는 거야?
    ja: これって何のためにやってるの？
  d_nikke_laplace_ultimatehero_03_46:
    speaker: laplace_p
    en: A loud voice is a must for every hero!
    ko: 히어로에게 목소리 크기는 너무나도 중요하기 때문이다!
    ja: |-
      ヒーローにとって、声の大きさは
      何よりも大事だからだ！
  d_nikke_laplace_ultimatehero_03_47:
    speaker: laplace_p
    en: When you make your entrance, when you make your exit, when you unleash your
      ultimate attack...
    ko: 등장할 때도, 퇴장할 때도, 필살기를 사용할 때도.
    ja: |-
      登場する時も、退場する時も、
      必殺技を繰り出す時も。
  d_nikke_laplace_ultimatehero_03_48:
    speaker: laplace_p
    en: A hero has to shout at the top of their lungs!
    ko: 히어로는 항상 크게 소리 질러야 한다!
    ja: |-
      ヒーローは、いつも大きな声で
      叫ばなければいけない！
  d_nikke_laplace_ultimatehero_03_49:
    speaker: laplace_p
    en: The louder your voice, the stronger your fighting spirit!
    ko: 목소리 크기가 곧 기합이니까!
    ja: 声が大きいと気合いが入るからな！
  d_nikke_laplace_ultimatehero_03_50:
    speaker: cocoa
    en: Can you save the world with that too?
    ko: 그걸로 세계 평화도 구할 수 이써?
    ja: それで世界を救える？
  d_nikke_laplace_ultimatehero_03_51:
    speaker: laplace_p
    en: Of course!
    ko: 물론이다!
    ja: もちろんだ！
  d_nikke_laplace_ultimatehero_03_52:
    speaker: laplace_p
    en: The louder you shout, the stronger your heroic powers become!
    ko: 소리를 크게 지르면 그만큼 히어로 파워도 강력해지지!
    ja: |-
      大きな声で叫べば、
      その分ヒーローパワーも強力になるんだ！
  d_nikke_laplace_ultimatehero_03_53:
    speaker: cocoa
    en: Oooh.
    ko: 오오.
    ja: おお…
  d_nikke_laplace_ultimatehero_03_54:
    speaker: laplace_p
    en: A certain someone might nag you to quiet down, but pay them no heed!
    ko: 가끔 소리 좀 지르지 말라고 하는 잔소리꾼이 있지만, 그런 건 신경쓰지 않아도 좋다!
    ja: |-
      まれに「大声を出すな」と小言を言う者もいるが
      そんなことは気にしなくていい！
  d_nikke_laplace_ultimatehero_03_55:
    speaker: laplace_p
    en: We're yelling so that we can save the world!
    ko: 우린 세계를 구하기 위해서 소리를 지르는 거니까!
    ja: |-
      私たちは世界を救うために
      声を張り上げているんだからな！
  d_nikke_laplace_ultimatehero_03_56:
    speaker: "<Self>"
    en: Is that certain someone Maxwell?
    ko: 혹시 그거 맥스웰을 말하는 거야?
    ja: ひょっとして、マクスウェルのことか？
  d_nikke_laplace_ultimatehero_03_57:
    speaker: laplace_p
    en: "... I-I never said it was her!"
    ko: "…누, 누구라고 말하진 않았다!"
    ja: "…だ、誰とは言っていない！"
  d_nikke_laplace_ultimatehero_03_58:
    speaker: laplace_p
    en: C-Candidate No. 1!
    ko: 후, 후보 1호!
    ja: こ、候補生1号！
  d_nikke_laplace_ultimatehero_03_59:
    speaker: laplace_p
    en: Now then, let's continue your training!
    ko: 그럼 계속해서 소리 지르는 훈련이다!
    ja: 声を張り上げるトレーニングを続けよう！
  d_nikke_laplace_ultimatehero_03_60:
    speaker: laplace_p
    en: This time, we're going to practice shouting your hero catchphrase!
    ko: 이번엔 히어로 구호를 외쳐보도록 하겠다!
    ja: |-
      今度は、ヒーローの掛け声を
      叫んでみるとしよう！
  d_nikke_laplace_ultimatehero_03_61:
    speaker: cocoa
    en: "'Kay!"
    ko: 알아써!
    ja: 分かった！
  d_nikke_laplace_ultimatehero_03_62:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_03_63:
    speaker: "<Monologue>"
    en: Bruce trots over to Laplace and wags his tail.
    ko: 브루스가 라플라스의 발치에 와서 꼬리를 흔들었다.
    ja: |-
      ブルースはラプラスの足元に駆け寄り
      しっぽを振った
  d_nikke_laplace_ultimatehero_03_64:
    speaker: laplace_p
    en: No. 3?
    ko: 3호?
    ja: 3号？
  d_nikke_laplace_ultimatehero_03_65:
    speaker: laplace_p
    en: You want to join in too?
    ko: 3호도 같이 하고 싶다고?
    ja: 3号も一緒にやりたいのか？
  d_nikke_laplace_ultimatehero_03_66:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_03_67:
    speaker: laplace_p
    en: That's my star pupil!
    ko: 역시 우등생답군!
    ja: さすがは優等生だな！
  d_nikke_laplace_ultimatehero_03_68:
    speaker: laplace_p
    en: All right, No. 3, let's hear you shout too!
    ko: 그래, 3호도 같이 소리를 지르는 거다!
    ja: よし、3号も一緒に大声で叫ぶんだぞ！
  d_nikke_laplace_ultimatehero_03_69:
    speaker: bruce
    en: "*Woof, woof!*"
    ko: 멍멍-!
    ja: ワンワン！
  d_nikke_laplace_ultimatehero_03_70:
    speaker: "<Monologue>"
    en: I edge over to Biscuit.
    ko: 나는 비스킷에게 슬쩍 다가갔다.
    ja: 私はビスケットにそっと近づいた
  d_nikke_laplace_ultimatehero_03_71:
    speaker: "<Self>"
    en: Did Bruce really say that?
    ko: 브루스가 정말 그렇게 말했어?
    ja: ブルースが本当にそう言ったのか？
  d_nikke_laplace_ultimatehero_03_72:
    speaker: biscuit
    en: He did!
    ko: 네!
    ja: はい！
  d_nikke_laplace_ultimatehero_03_73:
    speaker: biscuit
    en: He got so excited that he said he wanted to practice too!
    ko: 엄청 신나서 자기도 같이 연습하겠다고 했어요!
    ja: |-
      とても張り切っていて、
      自分も一緒に練習するそうです！
  d_nikke_laplace_ultimatehero_03_74:
    speaker: biscuit
    en: Just seeing how excited he is makes me happy. Hehe!
    ko: 되게 신나보여서 보기만 해도 기분이 좋네요. 헤헤.
    ja: |-
      すごく楽しそうで、
      見ているだけで嬉しくなりますね。へへ。
  d_nikke_laplace_ultimatehero_03_75:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_03_76:
    speaker: "<Narration>"
    en: One hour later...
    ko: 1시간 뒤.
    ja: 1時間後
  d_nikke_laplace_ultimatehero_03_77:
    speaker: laplace_p
    en: Excellent! Now let's hear your hero catchphrases, just like we practiced!
    ko: 좋다! 이제 연습한대로 각자의 구호를 외쳐보도록 하겠다!
    ja: |-
      よし！それでは、練習した通りに
      それぞれの掛け声を叫んでみよう！
  d_nikke_laplace_ultimatehero_03_78:
    speaker: laplace_p
    en: First up, No. 1!
    ko: 먼저 1호!
    ja: まずは、1号！
  d_nikke_laplace_ultimatehero_03_79:
    speaker: cocoa
    en: Here comes Cocoa!
    ko: 코코아 등장-!!
    ja: ココアさんじょー！！
  d_nikke_laplace_ultimatehero_03_80:
    speaker: laplace_p
    en: No. 3!
    ko: 3호!
    ja: 3号！
  d_nikke_laplace_ultimatehero_03_81:
    speaker: bruce
    en: "*Awoooo!*"
    ko: 머엉-!
    ja: ワオーン！
  d_nikke_laplace_ultimatehero_03_82:
    speaker: "<Monologue>"
    en: Cocoa and Bruce's voices are hoarse from shouting.
    ko: 너무 소리를 지른 탓에 코코아와 브루스의 목소리가 걸걸해져 있었다.
    ja: |-
      大声を出しすぎたせいで、
      ココアとブルースの声はガラガラになっていた
  d_nikke_laplace_ultimatehero_03_83:
    speaker: laplace_p
    en: Don't forget to review what you learned when you get home!
    ko: 오늘 배운 수업은 집에 가서도 다시 복습할 수 있도록!
    ja: |-
      今日のレッスンで習ったことは
      家に帰ってからも復習するように！
  d_nikke_laplace_ultimatehero_03_84:
    speaker: cocoa
    en: "'Kay!"
    ko: 아라따!
    ja: もちろんだ！
  d_nikke_laplace_ultimatehero_03_85:
    speaker: bruce
    en: "*Awoooo!*"
    ko: 머엉-!
    ja: ワオーン！
  d_nikke_laplace_ultimatehero_03_86:
    speaker: "<Self>"
    en: Cocoa's starting to sound like Laplace...
    ko: 코코아가 라플라스 같은 말투를 쓰고 있어….
    ja: |-
      ココアがラプラスのような
      話し方になっている…
  d_nikke_laplace_ultimatehero_03_87:
    speaker: laplace_p
    en: On to the next lesson!
    ko: 그럼 이제 다음 수업으로 넘어가도록 하지!
    ja: さて、次のレッスンに移ろう！
  d_nikke_laplace_ultimatehero_03_88:
    speaker: laplace_p
    en: No. 2! You're up!
    ko: 2호! 수업을 준비해라!
    ja: 2号！準備をしろ！
  d_nikke_laplace_ultimatehero_03_89:
    speaker: biscuit
    en: Is it finally my turn? Hehe.
    ko: 이제 드디어 저도 참여할 수 있게 된 건가요? 헤헤.
    ja: やっと私も参加できるんですね。へへ。
  d_nikke_laplace_ultimatehero_03_90:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_03_91:
    speaker: "<Monologue>"
    en: We follow Laplace as she moves to another spot.
    ko: 우리는 자리를 이동하는 라플라스의 뒤를 따라갔다.
    ja: 私たちは移動するラプラスの後についていった
  d_nikke_laplace_ultimatehero_03_92:
    speaker: laplace_p
    en: Next up...
    ko: 다음 수업은….
    ja: 次のレッスンは…
  d_nikke_laplace_ultimatehero_03_93:
    speaker: laplace_p
    en: Heroic glass-breaking!
    ko: 유리 깨기 수업이다!
    ja: ガラス割りだ！
d_nikke_laplace_ultimatehero_04:
  d_nikke_laplace_ultimatehero_04_1:
    speaker: biscuit
    en: Are we going to break all this glass?
    ko: 이 유리들을 전부 깨는 건가요?
    ja: このガラスを全部割るんですか？
  d_nikke_laplace_ultimatehero_04_2:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_04_3:
    speaker: laplace_p
    en: Indeed!
    ko: 그렇다!
    ja: そうだ！
  d_nikke_laplace_ultimatehero_04_4:
    speaker: laplace_p
    en: The most important part of being a hero is... smashing through windows to
      make an entrance!
    ko: |-
      히어로에게 가장 중요한 것….
      그것은 유리를 깨며 등장하는 것이니까!
    ja: |-
      ヒーローにとって一番大事なこと…
      それはガラスを割りながら
      登場することだからだ！
  d_nikke_laplace_ultimatehero_04_5:
    speaker: laplace_p
    en: Allow me to demonstrate!
    ko: 일단 내가 먼저 시범을 보여주도록 하겠다!
    ja: まずは、私が手本を見せるとしよう！
  d_nikke_laplace_ultimatehero_04_6:
    speaker: "<Monologue>"
    en: Laplace shifts into position
    ko: 라플라스는 준비 자세를 취했다.
    ja: ラプラスは走り出す構えを取った
  d_nikke_laplace_ultimatehero_04_7:
    speaker: "<Narration>"
    en: and dashes forward.
    ko: 타다다닥-
    ja: ダダダダッ――
  d_nikke_laplace_ultimatehero_04_8:
    speaker: laplace_p
    en: Heroic window smash!
    ko: 히어로 창문 분쇄하기-!!
    ja: ヒーロー窓粉砕！！
  d_nikke_laplace_ultimatehero_04_9:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 와장창-
    ja: ガッシャーン！
  d_nikke_laplace_ultimatehero_04_10:
    speaker: "<Monologue>"
    en: Laplace spins around, thrusting an arm skyward.
    ko: 라플라스는 하늘을 향해 팔을 뻗으며 뒤돌아보았다.
    ja: |-
      ラプラスは空に向かって
      腕を伸ばしながら振り返った
  d_nikke_laplace_ultimatehero_04_11:
    speaker: laplace_p
    en: Did you get a good look?
    ko: 잘 보았나!
    ja: 見たか！
  d_nikke_laplace_ultimatehero_04_12:
    speaker: laplace_p
    en: That's how a hero makes an entrance!
    ko: 이것이 히어로가 등장하는 방법이다!
    ja: これが、ヒーローの登場の仕方だ！
  d_nikke_laplace_ultimatehero_04_13:
    speaker: laplace_p
    en: Don't forget to finish off with a cool heroic pose!
    ko: 특히 마지막에 멋진 히어로 포즈를 보여주는 게 중요하니까, 이건 절대 잊지 않도록!
    ja: |-
      最後にカッコいいヒーローポーズを
      決めるのが大事だから、
      絶対に忘れないように！
  d_nikke_laplace_ultimatehero_04_14:
    speaker: "<Self>"
    en: Isn't this a little dangerous for a dog?
    ko: 그런데 강아지가 이런 걸 하기엔 좀 위험하지 않을까?
    ja: |-
      でも、イヌがガラスを割るのは
      危ないんじゃないか？
  d_nikke_laplace_ultimatehero_04_15:
    speaker: laplace_p
    en: No need to worry!
    ko: 그건 걱정 없다!
    ja: その心配は無用だ！
  d_nikke_laplace_ultimatehero_04_16:
    speaker: laplace_p
    en: I made sure to use special glass. It shatters easily, but the pieces aren't
      sharp!
    ko: 쉽게 부서지고 부서져도 파편에 날이 서지 않는 특별한 유리로 준비했으니까!
    ja: |-
      簡単に割れて、割れても破片でケガをしない
      特別なガラスを用意したからな！
  d_nikke_laplace_ultimatehero_04_17:
    speaker: "<Self>"
    en: "!!"
    ko: "!!"
    ja: "！！"
  d_nikke_laplace_ultimatehero_04_18:
    speaker: "<Self>"
    en: Wh-who would've thought Laplace could be so thoughtful...?
    ko: 라, 라플라스가 이런 배려를…!
    ja: ラ、ラプラスがこんな配慮を…！
  d_nikke_laplace_ultimatehero_04_19:
    speaker: bruce
    en: "*Woof! Whimper...*"
    ko: 멍-! 머엉….
    ja: ワン！ワオーン…
  d_nikke_laplace_ultimatehero_04_20:
    speaker: laplace_p
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_laplace_ultimatehero_04_21:
    speaker: laplace_p
    en: No. 3, you still look a little hesitant.
    ko: 3호. 여전히 주눅든 모습이군.
    ja: 3号。怖がっているようだな。
  d_nikke_laplace_ultimatehero_04_22:
    speaker: laplace_p
    en: Trust me, you won't get hurt. Go on, jump through the glass!
    ko: 정말로 다치지 않으니까, 나를 믿고 유리에 뛰어들어도 좋다!
    ja: |-
      本当に大丈夫だ。
      私を信じてガラスに飛び込んでみるんだ！
  d_nikke_laplace_ultimatehero_04_23:
    speaker: biscuit
    en: Actually, Bruce isn't worried about the glass. He's worried about the jumping
      part.
    ko: 지금 브루스는 유리를 걱정하는 게 아니라, 뛰는 것 자체를 걱정하는 거예요.
    ja: |-
      ブルースはガラスが心配なのではなくて、
      ジャンプすること自体が不安なんです。
  d_nikke_laplace_ultimatehero_04_24:
    speaker: biscuit
    en: He's always been afraid of jumping that high...
    ko: 브루스는 높이 뛰는 걸 무서워하거든요….
    ja: |-
      元々高くジャンプすることを
      怖がっていたので…
  d_nikke_laplace_ultimatehero_04_25:
    speaker: laplace_p
    en: Hmm... I get it.
    ko: 음… 그럴 수 있지.
    ja: ふむ…なるほど。
  d_nikke_laplace_ultimatehero_04_26:
    speaker: laplace_p
    en: But you can't give up now, No. 3!
    ko: 하지만 그렇다고 주저앉아선 안 된다, 3호!
    ja: |-
      でも、だからといって
      諦めてはいけないぞ、3号！
  d_nikke_laplace_ultimatehero_04_27:
    speaker: laplace_p
    en: This is exactly when you have to power through with sheer fighting spirit!
    ko: 이럴 때일수록 기합으로 극복해야 한다!
    ja: こういう時こそ、気合いで乗り越えるべきだ！
  d_nikke_laplace_ultimatehero_04_28:
    speaker: bruce
    en: "*Whimper...*"
    ko: 머엉….
    ja: クゥーン…
  d_nikke_laplace_ultimatehero_04_29:
    speaker: "<Monologue>"
    en: Bruce slumps to the ground.
    ko: 브루스가 축 늘어졌다.
    ja: ブルースは力なくへたり込んだ
  d_nikke_laplace_ultimatehero_04_30:
    speaker: biscuit
    en: Bruce...
    ko: 브루스….
    ja: ブルース…
  d_nikke_laplace_ultimatehero_04_31:
    speaker: biscuit
    en: Okay, got it...
    ko: "…그래, 알았어."
    ja: "…うん、分かった。"
  d_nikke_laplace_ultimatehero_04_32:
    speaker: "<Monologue>"
    en: Biscuit takes a step forward.
    ko: 비스킷이 한 발짝 나섰다.
    ja: ビスケットが一歩前に出た
  d_nikke_laplace_ultimatehero_04_33:
    speaker: biscuit
    en: Just watch for now, Bruce.
    ko: 브루스는 그냥 지켜보고 있어.
    ja: ブルース、見てて。
  d_nikke_laplace_ultimatehero_04_34:
    speaker: bruce
    en: "*Woof...?*"
    ko: 멍…?
    ja: ワン…？
  d_nikke_laplace_ultimatehero_04_35:
    speaker: biscuit
    en: If you're scared, you don't have to do it. I'll take care of the scary part.
    ko: 무서우면 하지 않아도 돼. 무서운 건 내가 다 할게.
    ja: |-
      怖かったら、やらなくてもいいよ。
      怖いことは私が全部やってあげるから。
  d_nikke_laplace_ultimatehero_04_36:
    speaker: biscuit
    en: It's okay to just watch until you feel ready to give it a try.
    ko: 브루스는 하고 싶은 마음이 들 때까지, 그냥 보고만 있어도 괜찮아.
    ja: |-
      ブルースがやりたいって思うまで、
      見てるだけで大丈夫だよ。
  d_nikke_laplace_ultimatehero_04_37:
    speaker: bruce
    en: "*Woof...*"
    ko: 멍….
    ja: ワン…
  d_nikke_laplace_ultimatehero_04_38:
    speaker: laplace_p
    en: Oooh...!
    ko: 오오…!
    ja: おお…！
  d_nikke_laplace_ultimatehero_04_39:
    speaker: laplace_p
    en: Now that's heroic camaraderie!
    ko: 이것이 히어로의 동료애!
    ja: これがヒーローの、仲間への愛だな！
  d_nikke_laplace_ultimatehero_04_40:
    speaker: laplace_p
    en: Absolutely dazzling!
    ko: 정말 눈부시군!
    ja: 本当にまぶしいぞ！
  d_nikke_laplace_ultimatehero_04_41:
    speaker: biscuit
    en: Okay... Here goes nothing!
    ko: 그럼 비스킷… 출발합니다!
    ja: それでは、ビスケット…いきます！
  d_nikke_laplace_ultimatehero_04_42:
    speaker: laplace_p
    en: Just don't forget to shout your catchphrase before charging in, then strike
      an awesome pose at the end!
    ko: 구호를 외치면서 깨고, 마지막에 멋진 포즈를 취하는 걸 잊으면 안 된다!
    ja: |-
      掛け声を叫びながら割るんだ！
      そして、最後にカッコいい
      ポーズを決めるのを忘れないように！
  d_nikke_laplace_ultimatehero_04_43:
    speaker: biscuit
    en: Got it...!
    ko: 네…!
    ja: はい…！
  d_nikke_laplace_ultimatehero_04_44:
    speaker: "<Monologue>"
    en: Biscuit dashes toward the glass pane with a determined look.
    ko: 비스킷이 결의에 찬 표정으로 유리를 향해 달려갔다.
    ja: |-
      ビスケットは決意に満ちた表情で
      ガラスに向かって走っていった
  d_nikke_laplace_ultimatehero_04_45:
    speaker: biscuit
    en: H-heroic window smash!
    ko: 히, 히어로 창문 깨기-!!
    ja: ヒ、ヒーロー窓割り！！
  d_nikke_laplace_ultimatehero_04_46:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 와장창-
    ja: ガッシャーン！
  d_nikke_laplace_ultimatehero_04_47:
    speaker: "<Monologue>"
    en: Biscuit turns around awkwardly.
    ko: 비스킷이 어정쩡한 자세로 뒤돌아보았다.
    ja: ビスケットは中途半端な体勢のまま振り返った
  d_nikke_laplace_ultimatehero_04_48:
    speaker: biscuit
    en: H-how did I do?
    ko: 이, 이렇게 하면 되는 건가요?
    ja: こ、こんな感じでいいんでしょうか？
  d_nikke_laplace_ultimatehero_04_49:
    speaker: "<Monologue>"
    en: Laplace glances over at Bruce.
    ko: 라플라스가 브루스를 바라보았다.
    ja: ラプラスはブルースを見た
  d_nikke_laplace_ultimatehero_04_50:
    speaker: bruce
    en: "*Woof...*"
    ko: 멍….
    ja: ワン…
  d_nikke_laplace_ultimatehero_04_51:
    speaker: "<Monologue>"
    en: He still looks scared.
    ko: 브루스는 여전히 주눅든 모습이었다.
    ja: ブルースは、まだ怖がっているようだった
  d_nikke_laplace_ultimatehero_04_52:
    speaker: laplace_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_04_53:
    speaker: laplace_p
    en: No, that's not how you do it!
    ko: 아니, 그 따위로 하는 게 아니다!
    ja: いや、まだまだだ！
  d_nikke_laplace_ultimatehero_04_54:
    speaker: laplace_p
    en: At this rate, you'll never become a real hero!
    ko: 이래선 히어로의 발끝에도 못 미친다!
    ja: それじゃ、ヒーローの足元にも及ばない！
  d_nikke_laplace_ultimatehero_04_55:
    speaker: laplace_p
    en: Again!
    ko: 다시!
    ja: もう一度！
  d_nikke_laplace_ultimatehero_04_56:
    speaker: "<Monologue>"
    en: Despite what she says, Laplace looks completely crushed.
    ko: 말과 달리, 라플라스의 표정은 나라라도 잃은 듯했다.
    ja: |-
      言葉とは裏腹に、ラプラスの表情は
      とてもつらそうに見えた
  d_nikke_laplace_ultimatehero_04_57:
    speaker: biscuit
    en: G-got it!
    ko: 아, 알겠어요!
    ja: わ、分かりました！
  d_nikke_laplace_ultimatehero_04_58:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 와장창-
    ja: ガッシャーン！
  d_nikke_laplace_ultimatehero_04_59:
    speaker: laplace_p
    en: Again!
    ko: 다시!
    ja: もう一度！
  d_nikke_laplace_ultimatehero_04_60:
    speaker: "<Narration>"
    en: "*Crasssh!*"
    ko: 와장창창-
    ja: ガッシャァァーン！
  d_nikke_laplace_ultimatehero_04_61:
    speaker: laplace_p
    en: Again!
    ko: 다시!
    ja: もう一度！
  d_nikke_laplace_ultimatehero_04_62:
    speaker: "<Narration>"
    en: "*Crassssssh!*"
    ko: 와장창창창-
    ja: ガッシャァァァーン！
  d_nikke_laplace_ultimatehero_04_63:
    speaker: biscuit
    en: Nghhh...
    ko: 우으으….
    ja: ううう…
  d_nikke_laplace_ultimatehero_04_64:
    speaker: laplace_p
    en: Agai—
    ko: 다ㅅ….
    ja: もういち…
  d_nikke_laplace_ultimatehero_04_65:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍!
    ja: ワン！
  d_nikke_laplace_ultimatehero_04_66:
    speaker: "<Self>"
    en: "... Bruce?"
    ko: "…브루스?"
    ja: "…ブルース？"
  d_nikke_laplace_ultimatehero_04_67:
    speaker: "<Monologue>"
    en: Bruce, who has been quietly watching until now, raises his tail straight up.
    ko: 가만히 지켜만 보고 있던 브루스가 꼬리를 빳빳하게 세웠다.
    ja: |-
      静かに見守っていたブルースが
      しっぽをピンと立てた
  d_nikke_laplace_ultimatehero_04_68:
    speaker: laplace_p
    en: Got a problem with how I treat No. 2?
    ko: 내가 2호를 대하는 방식에 불만이 있는 건가?
    ja: 私の2号に対するやり方が気に入らないのか？
  d_nikke_laplace_ultimatehero_04_69:
    speaker: laplace_p
    en: Then show me, No. 3.
    ko: 그렇다면 3호, 네가 보여주면 된다.
    ja: それなら3号、君が見せてくれ。
  d_nikke_laplace_ultimatehero_04_70:
    speaker: laplace_p
    en: Show me the same heroic camaraderie
    ko: 2호가 네게 했던 것처럼,
    ja: 2号が君に見せてくれたような…
  d_nikke_laplace_ultimatehero_04_71:
    speaker: laplace_p
    en: No. 2 showed you!
    ko: 히어로의 동료애를 말이다…!
    ja: ヒーローの、仲間への愛を…！
  d_nikke_laplace_ultimatehero_04_72:
    speaker: "<Monologue>"
    en: At Laplace's words, Bruce charges toward the glass pane without hesitation.
    ko: 라플라스의 말에 브루스는 망설임 없이 유리를 향해 뛰어갔다.
    ja: |-
      ラプラスの言葉を受け、
      ブルースはためらうことなく
      ガラスに向かって走っていった
  d_nikke_laplace_ultimatehero_04_73:
    speaker: bruce
    en: "*Woof, woof!*"
    ko: 멍멍-!
    ja: ワンワン！
  d_nikke_laplace_ultimatehero_04_74:
    speaker: "<Narration>"
    en: "*Crash*"
    ko: 와장창-
    ja: ガッシャーン！
  d_nikke_laplace_ultimatehero_04_75:
    speaker: biscuit
    en: B-Bruce jumped so high...!
    ko: 브, 브루스가 엄청 높이 점프를 했어요…!
    ja: ブ、ブルースがとっても高くジャンプしました！
  d_nikke_laplace_ultimatehero_04_76:
    speaker: "<Monologue>"
    en: Bruce merely turns his head to look at Laplace.
    ko: 브루스는 고개만 돌려 라플라스를 바라보았다.
    ja: ブルースは顔だけ振り返り、ラプラスを見つめた
  d_nikke_laplace_ultimatehero_04_77:
    speaker: laplace_p
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_laplace_ultimatehero_04_78:
    speaker: "<Narration>"
    en: "*Clap, clap, clap*"
    ko: 짝짝짝-
    ja: パチパチパチ――
  d_nikke_laplace_ultimatehero_04_79:
    speaker: "<Monologue>"
    en: Laplace applauds, nodding in approval.
    ko: 라플라스가 고개를 끄덕이며 박수를 쳤다.
    ja: ラプラスがうなずきながら、拍手を送った
  d_nikke_laplace_ultimatehero_04_80:
    speaker: laplace_p
    en: That's it, No. 3.
    ko: 바로 그거다, 3호.
    ja: そう、それだ。3号。
  d_nikke_laplace_ultimatehero_04_81:
    speaker: laplace_p
    en: Hold on to that feeling, and you can be a hero whenever the time comes.
    ko: 그 감각을 기억하면, 3호는 언제든 히어로가 될 수 있을 거다.
    ja: |-
      その感覚を覚えておけ。そうすれば
      君はいつでもヒーローになれるはずだ。
  d_nikke_laplace_ultimatehero_04_82:
    speaker: biscuit
    en: Bruce!
    ko: 브루스!
    ja: ブルース！
  d_nikke_laplace_ultimatehero_04_83:
    speaker: "<Monologue>"
    en: Biscuit runs over and throws her arms around Bruce.
    ko: 비스킷이 달려가 브루스를 껴안았다.
    ja: ビスケットが駆け寄り、ブルースを抱きしめた
  d_nikke_laplace_ultimatehero_04_84:
    speaker: biscuit
    en: That was amazing! You can jump so high now!
    ko: 대단해! 이제 높게 뛸 수 있게 됐어!
    ja: |-
      すごいよ！
      高くジャンプできたね！
  d_nikke_laplace_ultimatehero_04_85:
    speaker: bruce
    en: "*Woof!*"
    ko: 머엉-!
    ja: ワオーン！
  d_nikke_laplace_ultimatehero_04_86:
    speaker: biscuit
    en: Now we can play frisbee too! Hehe.
    ko: 이제 원반 던지기도 할 수 있을 거야! 헤헤.
    ja: |-
      もうフリスビーもキャッチ
      できちゃいそうだね！へへ。
  d_nikke_laplace_ultimatehero_04_87:
    speaker: "<Monologue>"
    en: We watch as Biscuit and Bruce embrace each other.
    ko: 우리는 비스킷과 브루스가 서로를 부둥켜안는 모습을 바라보았다.
    ja: |-
      私たちはビスケットとブルースが
      互いに抱きしめ合う姿を見つめた
  d_nikke_laplace_ultimatehero_04_88:
    speaker: laplace_p
    en: Urgh...
    ko: "…크윽."
    ja: "…くっ。"
  d_nikke_laplace_ultimatehero_04_89:
    speaker: "<Monologue>"
    en: Laplace lurches toward me and grabs my shoulder.
    ko: 라플라스가 쓰러지듯 내 어깨를 붙잡았다.
    ja: ラプラスが倒れ込むように私の肩を掴んだ
  d_nikke_laplace_ultimatehero_04_90:
    speaker: laplace_p
    en: Birdie.
    ko: 버드 보이.
    ja: バードボーイ。
  d_nikke_laplace_ultimatehero_04_91:
    speaker: laplace_p
    en: Playing the villain doesn't suit me. I can feel my hero power fading...!
    ko: 어울리지 않게 악역을 자처했더니, 히어로 파워가 떨어지는 느낌이다…!
    ja: |-
      柄にもなく悪役を買って出たせいか、
      ヒーローパワーが下がってしまった気がする…！
  d_nikke_laplace_ultimatehero_04_92:
    speaker: "<Self>"
    en: Still, you really looked like a proper mentor just now.
    ko: 그래도 방금 라플라스는 진짜 선배 같았어.
    ja: |-
      でも、さっきのラプラスは
      本当に先輩のようだった
  d_nikke_laplace_ultimatehero_04_93:
    speaker: "<Self>"
    en: So... is the lesson over?
    ko: 이제 수업은 이걸로 끝이야?
    ja: レッスンはこれで終わりか？
  d_nikke_laplace_ultimatehero_04_94:
    speaker: laplace_p
    en: For today, yeah.
    ko: 내가 준비한 오늘 수업은 끝이다.
    ja: 私が用意した今日のレッスンは終わりだ。
  d_nikke_laplace_ultimatehero_04_95:
    speaker: laplace_p
    en: But we're far from finished!
    ko: 하지만 이걸로 모든 게 끝났다고 할 수는 없지.
    ja: |-
      だが、これですべて終わったという
      わけではない。
  d_nikke_laplace_ultimatehero_04_96:
    speaker: "<Self>"
    en: "...?"
    ko: "…?"
    ja: "…？"
d_nikke_laplace_ultimatehero_05:
  d_nikke_laplace_ultimatehero_05_1:
    speaker: "<Narration>"
    en: A few days later...
    ko: 며칠 뒤.
    ja: 数日後
  d_nikke_laplace_ultimatehero_05_2:
    speaker: laplace_p
    en: "... Aren't you excited, Birdie?"
    ko: "…버드 보이, 기대 되지 않나?"
    ja: "…バードボーイ、楽しみだな。"
  d_nikke_laplace_ultimatehero_05_3:
    speaker: "<Self>"
    en: Yeah, it's been a while since I've been to the Maid Cafe, so I'm looking forward
      to it.
    ko: 응. 나도 메이드 카페는 오랜만이라 기대돼.
    ja: |-
      ああ、私もメイドカフェは
      久しぶりだから楽しみだ
  d_nikke_laplace_ultimatehero_05_4:
    speaker: laplace_p
    en: We're here to make sure the rookies are putting what they've learned into
      practice!
    ko: 우린 후배들이 배운 것을 잘 실천하고 있는지 확인하러 온 거다!
    ja: |-
      後輩たちが習ったことを
      きちんと実践しているのか
      確かめに来たんだ！
  d_nikke_laplace_ultimatehero_05_5:
    speaker: laplace_p
    en: Don't get distracted, Birdie!
    ko: 목적을 착각하면 안 된다, 버드 보이!
    ja: 目的を間違えてはいけないぞ、バードボーイ！
  d_nikke_laplace_ultimatehero_05_6:
    speaker: "<Self>"
    en: Oh, right.
    ko: 아, 그랬었지.
    ja: ああ、そうだったな
  d_nikke_laplace_ultimatehero_05_7:
    speaker: laplace_p
    en: Pull yourself together.
    ko: 정신 똑바로 차려야 한다.
    ja: しっかり気を引き締めてくれ。
  d_nikke_laplace_ultimatehero_05_8:
    speaker: laplace_p
    en: You need to set an example for the rookies.
    ko: 이래서야 후배들에게 본보기가 되질 않아.
    ja: そんな調子では手本になれないぞ。
  d_nikke_laplace_ultimatehero_05_9:
    speaker: "<Self>"
    en: Right. Let's go in, then.
    ko: 그래. 일단 들어가 보자.
    ja: そうだな。とりあえず中に入ってみよう
  d_nikke_laplace_ultimatehero_05_10:
    speaker: laplace_p
    en: Got it!
    ko: 알겠다!
    ja: ああ！
  d_nikke_laplace_ultimatehero_05_11:
    speaker: laplace_p
    en: Then the window it is!
    ko: 그럼 창문을….
    ja: では、窓を…
  d_nikke_laplace_ultimatehero_05_12:
    speaker: "<Self>"
    en: W-we're just here to check on their progress today, so let's use the door.
    ko: 오, 오늘은 수업의 성과를 확인하러 온 거니까 그냥 문으로 들어가자.
    ja: |-
      きょ、今日はレッスンの成果を確かめに
      来ただけだから、普通にドアから入ろう
  d_nikke_laplace_ultimatehero_05_13:
    speaker: laplace_p
    en: "... You've got a point, Birdie!"
    ko: "…버드 보이의 말에도 일리가 있군!"
    ja: "…バードボーイの言葉も一理ある！"
  d_nikke_laplace_ultimatehero_05_14:
    speaker: laplace_p
    en: Today, we're here not just as heroes, but as mentors!
    ko: 오늘은 그냥 히어로가 아니라, 히어로 선배로서 왔으니까 말이다!
    ja: |-
      今日はヒーローではなく、
      ヒーローの先輩として来たのだからな！
  d_nikke_laplace_ultimatehero_05_15:
    speaker: "<Narration>"
    en: "*Jingle*"
    ko: 딸랑-
    ja: チリン――
  d_nikke_laplace_ultimatehero_05_16:
    speaker: cocoa
    en: Oh!
    ko: "…헛!"
    ja: "…はっ！"
  d_nikke_laplace_ultimatehero_05_17:
    speaker: "<Narration>"
    en: She takes off running.
    ko: 타다다닥-
    ja: ダダダダッ――
  d_nikke_laplace_ultimatehero_05_18:
    speaker: cocoa
    en: Welcome back, Master. It's been a while.
    ko: 주인. 오랜만에 왔네.
    ja: 主人。久しぶりだね。
  d_nikke_laplace_ultimatehero_05_19:
    speaker: "<Self>"
    en: Hey, Cocoa. It's been a while.
    ko: 오랜만이야, 코코아.
    ja: 久しぶりだな、ココア
  d_nikke_laplace_ultimatehero_05_20:
    speaker: cocoa
    en: Are you here to eat omurice?
    ko: 오므라이스 먹으러 와써?
    ja: オムライス食べに来た？
  d_nikke_laplace_ultimatehero_05_21:
    speaker: "<Self>"
    en: No, we're here for something else today.
    ko: 아니, 오늘은 다른 일로 왔어.
    ja: いいや、今日は別の用で来たんだ
  d_nikke_laplace_ultimatehero_05_22:
    speaker: cocoa
    en: Something else?
    ko: 다른 일?
    ja: 別の用？
  d_nikke_laplace_ultimatehero_05_23:
    speaker: "<Self>"
    en: We're here to see if you've been applying what you've learned.
    ko: 코코아가 수업 때 배운 걸 잘 실천하고 있는지 보러 왔어.
    ja: |-
      ココアが習ったことを
      きちんと実践しているか、見に来たんだ
  d_nikke_laplace_ultimatehero_05_24:
    speaker: cocoa
    en: Hehe.
    ko: 후후.
    ja: ふふ。
  d_nikke_laplace_ultimatehero_05_25:
    speaker: cocoa
    en: Of course I have.
    ko: 그건 문제 업써.
    ja: それはだいじょーぶ。
  d_nikke_laplace_ultimatehero_05_26:
    speaker: cocoa
    en: I put what I learned to good use whenever I give customers a little something
      extra.
    ko: 가끔씩 서비스로 수업 때 배운 걸 잘 써먹고 이쓰니깐.
    ja: |-
      たまにサービスで、習ったことを
      ちゃんと活かしてるよ。
  d_nikke_laplace_ultimatehero_05_27:
    speaker: "<Self>"
    en: Something extra?
    ko: 서비스?
    ja: サービス？
  d_nikke_laplace_ultimatehero_05_28:
    speaker: cocoa
    en: When I'm putting ketchup on my customers' omurice, I ask them if they like
      heroes.
    ko: 케첩 뿌릴 때, 히어로를 좋아하냐고 손님들한테 물어바.
    ja: |-
      ケチャップをかける時、
      ヒーローが好きかをお客さんに聞いてる。
  d_nikke_laplace_ultimatehero_05_29:
    speaker: cocoa
    en: If they say they do, I show them what I learned.
    ko: 좋아한다고 하면 그때 배운 걸 보여주는 거지.
    ja: |-
      好きって言ったら、
      あの時に習ったことを見せてあげる。
  d_nikke_laplace_ultimatehero_05_30:
    speaker: "<Self>"
    en: How do you show them?
    ko: 어떻게 보여주는데?
    ja: どうやってるんだ？
  d_nikke_laplace_ultimatehero_05_31:
    speaker: cocoa
    en: Just a sec.
    ko: 잠깐만 기다려바.
    ja: ちょっと待ってて。
  d_nikke_laplace_ultimatehero_05_32:
    speaker: "<Monologue>"
    en: Cocoa heads into the kitchen and returns with a plate of omurice.
    ko: 코코아가 주방에 들어가서 오므라이스를 한 그릇 가져왔다.
    ja: |-
      ココアが厨房に入っていき、
      オムライスを1皿持ってきた
  d_nikke_laplace_ultimatehero_05_33:
    speaker: cocoa
    en: Ahem.
    ko: 흠흠.
    ja: オホンッ…
  d_nikke_laplace_ultimatehero_05_34:
    speaker: cocoa
    en: Behold, the hero's omurice!
    ko: 이게 히어로의 오므라이스다!
    ja: これはヒーローのオムライスだ！
  d_nikke_laplace_ultimatehero_05_35:
    speaker: cocoa
    en: Heroic ketchup splash!
    ko: 히어로 케첩 뿌리기-!!
    ja: ヒーローケチャップビーム！！
  d_nikke_laplace_ultimatehero_05_36:
    speaker: "<Monologue>"
    en: Imitating Laplace, Cocoa squirts ketchup onto the omurice.
    ko: 코코아가 라플라스를 흉내내며 오므라이스에 케첩을 뿌렸다.
    ja: |-
      ココアがラプラスの真似をしながら
      オムライスにケチャップをかけた
  d_nikke_laplace_ultimatehero_05_37:
    speaker: cocoa
    en: Like this.
    ko: 이러케 해.
    ja: こうするの。
  d_nikke_laplace_ultimatehero_05_38:
    speaker: "<Self>"
    en: Th-that was... unique.
    ko: 개, 개성적인 케첩 뿌리기네.
    ja: こ、個性的なケチャップのかけ方だな
  d_nikke_laplace_ultimatehero_05_39:
    speaker: "<Self>"
    en: Why've you been so quiet this whole time, Laplace?
    ko: 근데 라플라스는 왜 아까부터 계속 말없이 듣고만 있어?
    ja: |-
      ラプラスはどうしてさっきから
      黙って聞いているだけなんだ？
  d_nikke_laplace_ultimatehero_05_40:
    speaker: laplace_p
    en: Outstanding, No. 1!
    ko: 후배가 멋지게 성장한 모습을 바라보고 있었다!
    ja: 後輩がカッコよく成長した姿を見つめていた！
  d_nikke_laplace_ultimatehero_05_41:
    speaker: laplace_p
    en: Look how much you've grown!
    ko: 훌륭하다, 1호!
    ja: 素晴らしいぞ、1号！
  d_nikke_laplace_ultimatehero_05_42:
    speaker: laplace_p
    en: You're putting everything you learned in training into practice!
    ko: 수업 때 배운 것을 잘 실천하고 있군!
    ja: |-
      レッスンで習ったことを
      ちゃんと実践しているな！
  d_nikke_laplace_ultimatehero_05_43:
    speaker: cocoa
    en: No need to praise me.
    ko: 칭찬은 갠차나.
    ja: 褒めなくてもだいじょーぶ。
  d_nikke_laplace_ultimatehero_05_44:
    speaker: cocoa
    en: Putting what I learn into practice is easy for a pro maid.
    ko: 프로 메이드라면 배운 걸 응용하는 것쯤은 일도 아니니깐.
    ja: |-
      プロメイドなら、習ったことを
      応用するのは当たり前のことだから。
  d_nikke_laplace_ultimatehero_05_45:
    speaker: laplace_p
    en: Excellent! I'm satisfied with how No. 1 turned out. I'll be on my way!
    ko: 좋다. 그럼 나는 1호의 모습에 만족하고 자리를 떠나도록 하지!
    ja: |-
      よし。私は1号の成長に満足した。
      この辺で失礼する！
  d_nikke_laplace_ultimatehero_05_46:
    speaker: "<Monologue>"
    en: Laplace turns around and gives a casual wave with her right hand as she walks
      out of the Maid Cafe.
    ko: 라플라스는 뒤돌아 오른팔을 가볍게 들며 메이드 카페를 나갔다.
    ja: |-
      ラプラスは振り返りざまに右手を軽く上げ、
      メイドカフェを後にした
  d_nikke_laplace_ultimatehero_05_47:
    speaker: "<Self>"
    en: I've got to go. I'll come back another time, Cocoa.
    ko: 코코아, 지금은 일이 있어서 다음에 또 올게.
    ja: ココア、今は用事があるからまた今度来る
  d_nikke_laplace_ultimatehero_05_48:
    speaker: cocoa
    en: You're not gonna have the omurice?
    ko: 오므라이스는 안 먹고 가는 거야?
    ja: オムライスは食べないの？
  d_nikke_laplace_ultimatehero_05_49:
    speaker: "<Self>"
    en: I'll have it next time, promise!
    ko: 그건 다음에 먹을게!
    ja: また次回いただこう
  d_nikke_laplace_ultimatehero_05_50:
    speaker: biscuit
    en: Good boy! Since you waited so nicely again, you get a treat!
    ko: 옳지, 옳지. 이번에도 잘 기다렸으니까, 상으로 간식을 줄게~
    ja: |-
      よしよし。ちゃんと待てたから、
      ご褒美におやつをあげるね～
  d_nikke_laplace_ultimatehero_05_51:
    speaker: bruce
    en: "*Woof!*"
    ko: 멍-!
    ja: ワン！
  d_nikke_laplace_ultimatehero_05_52:
    speaker: biscuit
    en: Huh?
    ko: "?"
    ja: "？"
  d_nikke_laplace_ultimatehero_05_53:
    speaker: biscuit
    en: Bruce! Where are you going? I've got your treat right here...
    ko: |-
      브루스! 어디 가는 거야?
      간식은 여기 있….
    ja: |-
      ブルース！どこに行くの？
      おやつはここに…
  d_nikke_laplace_ultimatehero_05_54:
    speaker: "<Monologue>"
    en: Bruce comes up to us and wags his tail.
    ko: 브루스가 우리에게 다가와 꼬리를 흔들었다.
    ja: |-
      ブルースは私たちのもとに駆け寄り
      しっぽを振った
  d_nikke_laplace_ultimatehero_05_55:
    speaker: laplace_p
    en: I take it you've been doing well, No. 2.
    ko: 그동안 잘 있었나, 2호.
    ja: 2号、元気だったか？
  d_nikke_laplace_ultimatehero_05_56:
    speaker: "<Self>"
    en: Hey, Biscuit.
    ko: 안녕, 비스킷.
    ja: やあ、ビスケット
  d_nikke_laplace_ultimatehero_05_57:
    speaker: biscuit
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_laplace_ultimatehero_05_58:
    speaker: biscuit
    en: Laplace! Trainer!
    ko: 라플라스! 훈련사님까지…!
    ja: ラプラス！訓練士さんまで…！
  d_nikke_laplace_ultimatehero_05_59:
    speaker: biscuit
    en: What brings you here?
    ko: 여긴 어쩐 일이세요?
    ja: どうしてこちらに？
  d_nikke_laplace_ultimatehero_05_60:
    speaker: laplace_p
    en: I just came to check on my rookies!
    ko: 후배의 모습을 보러 왔을 뿐이다!
    ja: 後輩の様子を見に来たんだ！
  d_nikke_laplace_ultimatehero_05_61:
    speaker: laplace_p
    en: Have you been putting what you learned into practice?
    ko: 수업 때 배운 건 잘 실천하고 있는 건가?
    ja: |-
      レッスンで習ったことを
      ちゃんと実践しているか？
  d_nikke_laplace_ultimatehero_05_62:
    speaker: biscuit
    en: We sure have!
    ko: 잘 실천하고 있죠!
    ja: はい、ちゃんと実践しています！
  d_nikke_laplace_ultimatehero_05_63:
    speaker: biscuit
    en: He's gotten so good at jumping that he catches frisbees like it's nothing
      now! Hehe.
    ko: 얼마나 잘 뛰던지, 이제 원반 던지기 정도는 가볍게 할 수 있어요. 헤헤.
    ja: |-
      ものすごくジャンプが得意になって、
      今ではフリスビーくらいなら
      余裕で取ってこれるんです。へへ。
  d_nikke_laplace_ultimatehero_05_64:
    speaker: biscuit
    en: Wanna see?
    ko: 한번 보실래요?
    ja: 見てみますか？
  d_nikke_laplace_ultimatehero_05_65:
    speaker: "<Monologue>"
    en: Biscuit picks up the frisbee lying on the floor.
    ko: 비스킷이 바닥에 놓여 있던 원반을 집어들었다.
    ja: |-
      ビスケットが地面に落ちていた
      フリスビーを拾い上げた
  d_nikke_laplace_ultimatehero_05_66:
    speaker: biscuit
    en: Bruce! Let's show them what we've been practicing!
    ko: 브루스! 우리 원반 놀이 하는 모습을 보여주자!
    ja: ブルース！2人に見せてあげよう！
  d_nikke_laplace_ultimatehero_05_67:
    speaker: "<Monologue>"
    en: Biscuit throws the frisbee...
    ko: 비스킷이 원반을 던졌다.
    ja: ビスケットがフリスビーを投げた
  d_nikke_laplace_ultimatehero_05_68:
    speaker: bruce
    en: "*Awoooo!*"
    ko: 머엉-!!
    ja: ワオーン！！
  d_nikke_laplace_ultimatehero_05_69:
    speaker: "<Monologue>"
    en: Bruce makes an impressive leap, catches it in his mouth, and brings it back!
    ko: 그리고 브루스가 멋지게 뛰어올라 원반을 물어왔다.
    ja: |-
      すると、ブルースがカッコよくジャンプをし、
      フリスビーを口でキャッチした
  d_nikke_laplace_ultimatehero_05_70:
    speaker: biscuit
    en: Good boy, Bruce!
    ko: 잘 했어, 브루스!
    ja: 上手だよ、ブルース！
  d_nikke_laplace_ultimatehero_05_71:
    speaker: laplace_p
    en: '... Even the way he yelled, "Heroic frisbee catch!" as he caught the frisbee
      was perfect.'
    ko: "…원반을 물 때 [히어로 원반 물기-!!]라고 하는 것까지 완벽하다."
    ja: |-
      …キャッチする時、
      「ヒーローフリスビーキャッチ！」
      と言うところまで完璧だ。
  d_nikke_laplace_ultimatehero_05_72:
    speaker: laplace_p
    en: You've really been putting what you've learned into practice!
    ko: 배운 걸 정말 잘 응용하고 있군!
    ja: 習ったことをしっかり応用している！
  d_nikke_laplace_ultimatehero_05_73:
    speaker: biscuit
    en: Hehe... Bruce is a smart doggie, after all.
    ko: 브루스는 똑똑한 강아지니까요. 헤헤.
    ja: ブルースが賢いんです。えへへ。
  d_nikke_laplace_ultimatehero_05_74:
    speaker: laplace_p
    en: Now that I've seen my rookies are doing well, I shall take my leave, satisfied!
    ko: 그럼 후배들이 잘하고 있는 모습도 봤으니, 나는 만족하고 떠나도록 하겠다!
    ja: |-
      後輩たちの頑張っている姿を
      見届けられて、私は満足した。
      失礼するとしよう！
  d_nikke_laplace_ultimatehero_05_75:
    speaker: biscuit
    en: You're leaving already? But you just got here...
    ko: 방금 오셨는데, 벌써 가시는 건가요?
    ja: |-
      さっき来たばかりなのに、
      もう行っちゃうんですか？
  d_nikke_laplace_ultimatehero_05_76:
    speaker: laplace_p
    en: A hero always knows when it's time to make an exit!
    ko: 히어로는 떠나야할 때를 정확히 알고 있는 법이니까!
    ja: |-
      ヒーローは自分の去り際を
      よく心得ているからな！
  d_nikke_laplace_ultimatehero_05_77:
    speaker: "<Monologue>"
    en: Laplace steps out of the shelter.
    ko: 라플라스는 보호소를 나섰다.
    ja: ラプラスはシェルターを後にした
  d_nikke_laplace_ultimatehero_05_78:
    speaker: "<Self>"
    en: I better get going, too. Bye, Biscuit.
    ko: 비스킷, 그럼 나도 이만 가볼게.
    ja: ビスケット、私もこれで失礼する
  d_nikke_laplace_ultimatehero_05_79:
    speaker: biscuit
    en: Take care, Trainer!
    ko: 네! 조심히 가세요~
    ja: はい！お気をつけて～
  d_nikke_laplace_ultimatehero_05_80:
    speaker: bruce
    en: "*Woof!*"
    ko: 머엉-!
    ja: ワオーン！
  d_nikke_laplace_ultimatehero_05_81:
    speaker: "<Monologue>"
    en: I watch Bruce as he sees Laplace off.
    ko: 그런 라플라스를 배웅하는 브루스의 모습은.
    ja: ラプラスを見送るブルースの姿は
  d_nikke_laplace_ultimatehero_05_82:
    speaker: "<Monologue>"
    en: It reminds me of a soldier saluting a respected veteran.
    ko: 마치 노병을 향해 경례하는 군인의 모습 같았다.
    ja: |-
      まるで老兵に向かって
      敬礼をする軍人のようだった
  d_nikke_laplace_ultimatehero_05_83:
    speaker: laplace_p
    en: Birdie, it makes me happy to see my rookies grow into such fine heroes!
    ko: 버드 보이, 훌륭하게 자란 히어로 후배들을 보니 기분이 좋군!
    ja: |-
      バードボーイ。立派に成長した
      後輩たちを見て、私は気分がいい！
  d_nikke_laplace_ultimatehero_05_84:
    speaker: "<Self>"
    en: But was the training actually effective?
    ko: 근데 정말 수업이 효과가 있었던 건 맞아?
    ja: |-
      ところで、本当にレッスンの成果が
      あったのか？
  d_nikke_laplace_ultimatehero_05_85:
    speaker: laplace_p
    en: What do you mean?
    ko: 그게 무슨 말이지?
    ja: それはどういう意味だ？
  d_nikke_laplace_ultimatehero_05_86:
    speaker: "<Self>"
    en: All they've learned is how to shout hero catchphrases while squirting ketchup,
    ko: 그냥 케첩 뿌릴 때 구호만 외치고,
    ja: ただケチャップをかける時に叫んで、
  d_nikke_laplace_ultimatehero_05_87:
    speaker: "<Self>"
    en: and how to play frisbee, right?
    ko: 원반 던지기 놀이를 할 수 있게 된 것 뿐이잖아.
    ja: |-
      フリスビーをキャッチできるように
      なっただけじゃないか
  d_nikke_laplace_ultimatehero_05_88:
    speaker: laplace_p
    en: That's not true!
    ko: 그렇지 않다!
    ja: それは違うぞ！
  d_nikke_laplace_ultimatehero_05_89:
    speaker: laplace_p
    en: The very first step to becoming a hero is developing a hero's mindset!
    ko: 히어로가 되기 위한 첫 번째 원칙은 히어로 정신을 발휘하는 것이니까!
    ja: |-
      ヒーローになるための第一歩は、
      ヒーローマインドを持つことだ！
  d_nikke_laplace_ultimatehero_05_90:
    speaker: laplace_p
    en: Shouting your hero catchphrase while squirting ketchup,
    ko: 케첩을 뿌리며 기합으로 히어로 구호를 외치는 것.
    ja: |-
      ケチャップをかけながら、
      気合を入れてヒーローの掛け声を叫ぶこと。
  d_nikke_laplace_ultimatehero_05_91:
    speaker: laplace_p
    en: pushing past your limits and finally catching that frisbee...
    ko: 자신의 한계를 극복해서 원반 던지기를 성공하는 것.
    ja: |-
      自分の限界を乗り越えて、
      フリスビーキャッチを成功させること。
  d_nikke_laplace_ultimatehero_05_92:
    speaker: laplace_p
    en: That's what having a hero's mindset is all about!
    ko: 이 모든 것들이 다 히어로 정신이다!
    ja: これらすべてがヒーローマインドだからな！
  d_nikke_laplace_ultimatehero_05_93:
    speaker: laplace_p
    en: I'd say the training was a smashing success!
    ko: 수업은 대성공이었다고 할 수 있지!
    ja: レッスンは大成功と言っても過言ではない！
  d_nikke_laplace_ultimatehero_05_94:
    speaker: "<Self>"
    en: Well, if you say so.
    ko: 뭐. 라플라스가 그렇다면 그런 거겠지.
    ja: |-
      まあ、ラプラスが言うなら
      そうなんだろう
  d_nikke_laplace_ultimatehero_05_95:
    speaker: laplace_p
    en: That settles it! We can't just sit around.
    ko: 그런 의미에서 우리가 가만히 있을 수는 없게 됐군.
    ja: というわけで、こうしてはいられない。
  d_nikke_laplace_ultimatehero_05_96:
    speaker: laplace_p
    en: Birdie! Time to get training session no. 2 ready!
    ko: 버드 보이! 바로 제 2회 히어로 수업을 준비하자!
    ja: |-
      バードボーイ！
      すぐに第2回ヒーローレッスンを準備しよう！
  d_nikke_laplace_ultimatehero_05_97:
    speaker: "<Self>"
    en: R-right now?
    ko: 지, 지금 바로?
    ja: い、今すぐ？
  d_nikke_laplace_ultimatehero_05_98:
    speaker: laplace_p
    en: Acting on your ideas right away is part of being a hero!
    ko: 생각을 바로 실천하는 것도 히어로 정신이니까!
    ja: |-
      思い立ったらすぐ行動。
      それもヒーローマインドだからな！
  d_nikke_laplace_ultimatehero_05_99:
    speaker: "<Self>"
    en: "... Right."
    ko: "…그래."
    ja: "…分かった"
  d_nikke_laplace_ultimatehero_05_100:
    speaker: "<Self>"
    en: I guess going along with it until the end is part of being a hero too.
    ko: 끝까지 어울려 주는 것도 히어로 정신이겠지.
    ja: |-
      最後まで付き合ってやることも、
      ヒーローマインドだな？
  d_nikke_laplace_ultimatehero_05_101:
    speaker: laplace_p
    en: Hahaha! Exactly, Birdie!
    ko: 하하하! 바로 그거다, 버드 보이!
    ja: ははは！その通りだ、バードボーイ！
  d_nikke_laplace_ultimatehero_05_102:
    speaker: "<Monologue>"
    en: Looking thoroughly satisfied, Laplace strides off with her usual heroic confidence.
    ko: 라플라스는 한껏 만족한 표정으로 씩씩하게 걸어갔다.
    ja: |-
      ラプラスはすっかり満足した様子で
      意気揚々と歩いていった
  d_nikke_laplace_ultimatehero_05_103:
    speaker: "<Monologue>"
    en: It seems her dream of training the next generation of heroes isn't ending
      anytime soon.
    ko: 아무래도 히어로 후배를 양성하겠다는 라플라스의 꿈은 계속될 것 같다.
    ja: |-
      ヒーローの後輩を養成するというラプラスの夢は
      これからも続きそうだ
