---
d_nikke_snowcrane_01:
  d_nikke_snowcrane_01_1:
    speaker: "<Narration>"
    en: "*Zzzt-zzzt*"
    ko: 지직- 지지직-
    ja: ザザッ、ザーッ…
  d_nikke_snowcrane_01_2:
    speaker: tvvoice
    en: Yum, yum!
    ko: 냠~ 냠~
    ja: もぐっ、もぐっ。
  d_nikke_snowcrane_01_3:
    speaker: tvvoice
    en: Mm! All you need is a few bites of this super energizing fuel bomb!
    ko: 으음! 먹기만 해도 기운이 펄펄! 체력이 쑥쑥!
    ja: |-
      う～ん！食べるだけで元気もりもり！
      体力ぐんぐんチャージ！
  d_nikke_snowcrane_01_4:
    speaker: snowcrane
    en: Oh my.
    ko: 어머.
    ja: まあ。
  d_nikke_snowcrane_01_5:
    speaker: tvvoice
    en: It's full of important nutrients and looks cute to boot!
    ko: 영양 보충도 되는데, 귀엽게 생기기까지!
    ja: 栄養補給もできて、見た目もかわいい！
  d_nikke_snowcrane_01_6:
    speaker: tvvoice
    en: Is this really dessert?
    ko: 이거, 정말 디저트 맞아~?
    ja: これがスイーツってホント～？
  d_nikke_snowcrane_01_7:
    speaker: snowcrane
    en: Oh my!
    ko: 어머, 어머~
    ja: あらあら～
  d_nikke_snowcrane_01_8:
    speaker: snowcrane
    en: My friend's been looking so tired recently. I bet he'd be very happy to get
      one of those.
    ko: |-
      우리 친구가 요새 많이 피곤해 보이던데,
      하나 드리면 아주 좋겠네요~
    ja: |-
      最近、おともだちがお疲れのようですし…
      こういうのをあげるのもいいかもしれませんね～
  d_nikke_snowcrane_01_9:
    speaker: snowcrane
    en: Hmm...
    ko: 음….
    ja: う～ん…
  d_nikke_snowcrane_01_10:
    speaker: snowcrane
    en: Maybe it'd be better to make one myself.
    ko: 아무래도, 파는 것보단 직접 만드는 게 낫겠죠?
    ja: |-
      やっぱり、市販のものより
      手作りのほうがいいでしょうか？
  d_nikke_snowcrane_01_11:
    speaker: snowcrane
    en: Great, now what ingredients do I need?
    ko: 좋아요, 그럼 재료는 이렇게….
    ja: うん、そうしましょう。さてと、材料は…
  d_nikke_snowcrane_01_12:
    speaker: tvvoice
    en: "*Zzzt-zzzt*"
    ko: 지직- 지지직-
    ja: ザザッ、ザーッ…
  d_nikke_snowcrane_01_13:
    speaker: "<Self>"
    en: Haa...
    ko: 하아….
    ja: はぁ…
  d_nikke_snowcrane_01_14:
    speaker: "<Monologue>"
    en: I have way too much work.
    ko: "…일이 너무 많이 쌓였다."
    ja: "…仕事が山積みだ"
  d_nikke_snowcrane_01_15:
    speaker: "<Self>"
    en: I feel like I've totally lost my way...
    ko: 길이 안 보이네, 길이….
    ja: まるで先が見えないな…
  d_nikke_snowcrane_01_16:
    speaker: "<Monologue>"
    en: Work has been piling up for days, pushing my exhaustion to its limits.
    ko: |-
      요 며칠 몰려드는 업무로 인해,
      나의 피로는 최고치를 찍고 있었다.
    ja: |-
      ここ数日で仕事が一気に立て込み、
      私の疲労はピークに達していた
  d_nikke_snowcrane_01_17:
    speaker: "<Monologue>"
    en: Maybe I'll lie down and rest for just an hour...
    ko: 1시간이라도 눈을 좀 붙일까….
    ja: 1時間だけ仮眠するか…
  d_nikke_snowcrane_01_18:
    speaker: "<Narration>"
    en: "*Knock, knock*"
    ko: 똑똑.
    ja: コンコン
  d_nikke_snowcrane_01_19:
    speaker: "<Monologue>"
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_snowcrane_01_20:
    speaker: "<Self>"
    en: Who could that be at this hour?
    ko: 이 시간에 누구야?
    ja: こんな時間に誰だ？
  d_nikke_snowcrane_01_21:
    speaker: snowcrane
    en: Hey, friend. It's me, Snow Crane.
    ko: 친구~ 저예요, 백학.
    ja: |-
      こんばんは～
      私です、シラツルです。
  d_nikke_snowcrane_01_22:
    speaker: snowcrane
    en: Sorry to bother you so late. May I come in just for a moment?
    ko: |-
      늦은 시간에 미안해요.
      잠시 들어가도 괜찮을까요?
    ja: |-
      夜分にごめんなさい。
      少しだけお邪魔してもいいですか？
  d_nikke_snowcrane_01_23:
    speaker: "<Monologue>"
    en: Snow Crane came to see me? Is something wrong?
    ko: 백학이 직접 찾아온 거면… 무슨 일이 있는 건가?
    ja: |-
      シラツルが直接訪ねてくるとは…
      いったい何の用だろう？
  d_nikke_snowcrane_01_24:
    speaker: "<Self>"
    en: Of course. Come in.
    ko: 물론이지, 들어와.
    ja: もちろんだ、入ってくれ
  d_nikke_snowcrane_01_25:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_snowcrane_01_26:
    speaker: snowcrane
    en: Hi there!
    ko: 안녕하세요~
    ja: こんばんは～
  d_nikke_snowcrane_01_27:
    speaker: snowcrane
    en: I knew you'd still be awake.
    ko: 역시, 아직 안 주무시고 계셨군요.
    ja: やっぱり、まだ寝ていなかったんですね。
  d_nikke_snowcrane_01_28:
    speaker: "<Self>"
    en: Yeah, I've had a lot of work recently.
    ko: 응, 요새 일이 좀 많네.
    ja: ああ。最近、仕事が立て込んでいてな
  d_nikke_snowcrane_01_29:
    speaker: "<Self>"
    en: So what brings you here?
    ko: 그런데, 무슨 일이야?
    ja: それで、何の用だ？
  d_nikke_snowcrane_01_30:
    speaker: snowcrane
    en: Oh, nothing much.
    ko: 아~ 다른 건 아니고요.
    ja: えっと、実は…
  d_nikke_snowcrane_01_31:
    speaker: snowcrane
    en: I just whipped up a little snack for my tired friend.
    ko: 피곤할 우리 친구를 위해, 간식을 좀 준비해 왔어요~
    ja: |-
      おともだちが疲れてるんじゃないかと思って、
      差し入れを持ってきたんです～
  d_nikke_snowcrane_01_32:
    speaker: snowcrane
    en: This dessert is pretty trendy, and they call it a super energizing fuel bomb.
    ko: 요새 유행이라던 기운 펄펄 체력 쑥쑥 디저트예요.
    ja: |-
      最近流行っている、
      元気もりもり体力ぐんぐんスイーツです。
  d_nikke_snowcrane_01_33:
    speaker: "<Self>"
    en: Whoa, really?
    ko: 와, 정말?
    ja: おお、本当か？
  d_nikke_snowcrane_01_34:
    speaker: "<Self>"
    en: That's great. I was just starting to get hungry.
    ko: 마침 출출했는데, 잘됐다.
    ja: ちょうど小腹が空いていたんだ
  d_nikke_snowcrane_01_35:
    speaker: snowcrane
    en: But you know,
    ko: 음~ 그런데 말이죠.
    ja: あっ、ただ…
  d_nikke_snowcrane_01_36:
    speaker: snowcrane
    en: I was worried the store-bought one might have a lot of bad ingredients, so
      I bought everything and made it myself.
    ko: |-
      파는 것들은 안 좋은 성분이 많이 들어가 있을 것 같아서,
      직접 재료들을 사서 만들었거든요.
    ja: |-
      市販のものは体に悪い成分が
      たくさん入っていそうだったので、
      自分で手作りしてみたんです。
  d_nikke_snowcrane_01_37:
    speaker: "<Self>"
    en: Wow, you made it yourself? I can't wait to try it!
    ko: |-
      오오, 직접 만들었어?
      기대된다!
    ja: 手作り？すごいじゃないか！
  d_nikke_snowcrane_01_38:
    speaker: snowcrane
    en: Hehe, it's adorable the way your eyes are sparkling with anticipation,
    ko: 후후, 기대에 찬 눈빛이 너무 귀엽긴 하지만….
    ja: |-
      ふふ、その期待でいっぱいのお目々が
      とってもかわいらしいですが…
  d_nikke_snowcrane_01_39:
    speaker: snowcrane
    en: but don't get your hopes up.
    ko: 생각한 것만큼 잘 안 만들어져서요.
    ja: 思った通りの仕上がりとはいかなくて…
  d_nikke_snowcrane_01_40:
    speaker: "<Monologue>"
    en: Snow Crane pulls out something that looks like a grubby clod of clay wrapped
      in cling wrap.
    ko: 백학이 주머니에서, 비닐에 싸여진 꼬질꼬질한 찰흙 같은 걸 꺼냈다.
    ja: |-
      シラツルのポケットから、ビニールに包まれた
      粘土の塊のようなものが出てきた
  d_nikke_snowcrane_01_41:
    speaker: "<Self>"
    en: What's that...?
    ko: 어… 이게 뭐야?
    ja: こ…これは…？
  d_nikke_snowcrane_01_42:
    speaker: snowcrane
    en: Mm... So when I saw it on TV,
    ko: 으음~ 분명 TV에서 보기로는 말이죠.
    ja: その～…
  d_nikke_snowcrane_01_43:
    speaker: snowcrane
    en: it looked like a white cookie shaped like an adorable rabbit.
    ko: 귀여운 토끼처럼 생긴 하얀 떡? 같았거든요.
    ja: |-
      テレビで見たのは、かわいいウサギ型の
      白いおもちのようだったので、
  d_nikke_snowcrane_01_44:
    speaker: snowcrane
    en: So I bought all the ingredients, made the dough,
    ko: 그래서 찹쌀을 사서, 절구로 직접 찧은 다음에~
    ja: もち米を買って、自力で細かく砕いてから～
  d_nikke_snowcrane_01_45:
    speaker: snowcrane
    en: put it on a baking sheet, and made a face out of chia seeds.
    ko: 찹쌀떡을 만들어서, 까만 깨로 얼굴을 만든 거예요.
    ja: おもちにして、黒ゴマで顔を作ってみたんです。
  d_nikke_snowcrane_01_46:
    speaker: "<Self>"
    en: Aha... So that's how it happened.
    ko: 아하… 그, 그렇구나.
    ja: "…そ、そうだったのか"
  d_nikke_snowcrane_01_47:
    speaker: snowcrane
    en: It looks different, doesn't it?
    ko: 그렇게 안 보이죠~?
    ja: ウサギさんのおもちには見えませんよね～？
  d_nikke_snowcrane_01_48:
    speaker: snowcrane
    en: I've never seen such a complicated-looking dessert before...
    ko: 이렇게 복잡하게 생긴 디저트는 처음 봐서요….
    ja: |-
      あんなに複雑なスイーツを見るのは
      初めてだったので…
  d_nikke_snowcrane_01_49:
    speaker: "<Monologue>"
    en: I stare at the clod of clay— I mean, the cookie that Snow Crane is holding.
    ko: 나는 백학이 들고 있는 찰흙… 아니, 찹쌀떡을 바라보았다.
    ja: |-
      私はシラツルが持ってきた粘土…
      いや、スイーツを見た
  d_nikke_snowcrane_01_50:
    speaker: "<Self>"
    en: Can I try it?
    ko: 먹어봐도 돼?
    ja: "…とりあえず、食べてもいいか？"
  d_nikke_snowcrane_01_51:
    speaker: snowcrane
    en: Oh, I'd be very grateful if you did...
    ko: 어머, 그래 주면 고맙긴 한데요….
    ja: |-
      まあ。もちろん、
      食べてもらえたら嬉しいですが…
  d_nikke_snowcrane_01_52:
    speaker: snowcrane
    en: But what if it tastes bad?
    ko: 맛없으면 어쩌죠?
    ja: おいしくなかったらどうしましょう？
  d_nikke_snowcrane_01_53:
    speaker: "<Self>"
    en: It's okay. You worked so hard on it.
    ko: 괜찮아, 열심히 만들었잖아.
    ja: 問題ない、頑張って作ったんだろう？
  d_nikke_snowcrane_01_54:
    speaker: "<Narration>"
    en: "*Nom*"
    ko: 냠.
    ja: パクッ
  d_nikke_snowcrane_01_55:
    speaker: "<Narration>"
    en: "*Munch, munch*"
    ko: 우물우물-
    ja: もぐもぐ…
  d_nikke_snowcrane_01_56:
    speaker: snowcrane
    en: H-how is it...?
    ko: "…어, 어때요?"
    ja: "…ど、どうです？"
  d_nikke_snowcrane_01_57:
    speaker: snowcrane
    en: It's terrible, isn't it?
    ko: 역시, 영 별로인가요…?
    ja: やっぱり、イマイチですか…？
  d_nikke_snowcrane_01_58:
    speaker: "<Self>"
    en: No, it's not that.
    ko: 아니, 그런 건 아닌데.
    ja: いや、そうではないが…
  d_nikke_snowcrane_01_59:
    speaker: "<Self>"
    en: It's just so bitter...
    ko: 너무 써….
    ja: 苦すぎる…
  d_nikke_snowcrane_01_60:
    speaker: snowcrane
    en: Oh!
    ko: 아~!
    ja: あっ、実は…
  d_nikke_snowcrane_01_61:
    speaker: snowcrane
    en: Like I told you, it's a super energizing fuel bomb dessert.
    ko: 기운 펄펄 체력 쑥쑥 디저트라고 했잖아요.
    ja: |-
      元気もりもり体力ぐんぐんスイーツ
      という名にふさわしいよう、
  d_nikke_snowcrane_01_62:
    speaker: snowcrane
    en: So I put all sorts of stuff that's good for you inside.
    ko: 그래서 떡 안에 몸에 좋은 것들을 넣어봤어요.
    ja: おもちの中に体にいいものを入れてみたんです。
  d_nikke_snowcrane_01_63:
    speaker: snowcrane
    en: Things that are good for you tend to be bitter.
    ko: 몸에 좋은 건, 쓴 법이니까요~
    ja: 良薬は口に苦しと言いますので～
  d_nikke_snowcrane_01_64:
    speaker: "<Self>"
    en: Mm... Hang on.
    ko: 음… 잠시만.
    ja: そ、そうか…ちょっといいか？
  d_nikke_snowcrane_01_65:
    speaker: "<Monologue>"
    en: I look up "super energizing fuel bomb dessert" on my computer.
    ko: 나는 컴퓨터에 [기운 펄펄 체력 쑥쑥 디저트] 라는 것을 검색했고.
    ja: |-
      パソコンの前に向かい、
      「元気もりもり体力ぐんぐんスイーツ」
      で検索すると
  d_nikke_snowcrane_01_66:
    speaker: "<Monologue>"
    en: I'm quickly able to find some adorable-looking desserts.
    ko: 정말 앙증맞게 생긴 귀여운 디저트들을 쉽게 발견할 수 있었다.
    ja: |-
      かわいらしい形をしたスイーツの画像が
      すぐに出てきた
  d_nikke_snowcrane_01_67:
    speaker: "<Monologue>"
    en: It appears Crust makes them.
    ko: "…크러스트가 제작하는 거구나."
    ja: |-
      …どうやら、クラストが開発した
      スイーツのようだ
  d_nikke_snowcrane_01_68:
    speaker: "<Self>"
    en: So you've never seen a dessert like this?
    ko: 이런 디저트를 처음 본다고?
    ja: こういうスイーツを見るのは初めてか？
  d_nikke_snowcrane_01_69:
    speaker: snowcrane
    en: Yes, I normally eat candy or more simple snacks.
    ko: 네, 보통은 사탕이나 단순하게 생긴 과자 같은 걸 먹었으니까요.
    ja: |-
      はい。普段はアメとか、
      シンプルなお菓子しか食べないので。
  d_nikke_snowcrane_01_70:
    speaker: "<Monologue>"
    en: That means she saw this dessert for the first time, thought of me,
    ko: 문득, 처음 보는 디저트를 보며 나를 떠올리고.
    ja: |-
      …新しいスイーツを見つけた際に
      私のことを思い出し…
  d_nikke_snowcrane_01_71:
    speaker: "<Monologue>"
    en: and even at this late hour, whipped up a batch to bring to me.
    ko: 이 늦은 시간까지 만들어 직접 가져와 준 백학에게.
    ja: |-
      こんな遅い時間に作って
      持ってきてくれたシラツルに
  d_nikke_snowcrane_01_72:
    speaker: "<Monologue>"
    en: I suddenly get the urge to show her some new experiences in the wider world.
    ko: 조금 더 다양한 경험과 세상을 보여주고 싶다는 생각이 들었다.
    ja: |-
      もっと色々な世界を
      見せてあげたいと思った
  d_nikke_snowcrane_01_73:
    speaker: "<Self>"
    en: Then why don't we go check out some desserts tomorrow?
    ko: 그럼, 내일 같이 디저트나 구경하러 가볼까?
    ja: |-
      なら、明日一緒に
      スイーツを食べに行かないか？
  d_nikke_snowcrane_01_74:
    speaker: snowcrane
    en: Huh?
    ko: 네?
    ja: えっ？
  d_nikke_snowcrane_01_75:
    speaker: snowcrane
    en: But you said you're really busy.
    ko: 하지만, 우리 친구… 많이 바쁘잖아요.
    ja: |-
      でも、おともだちは…
      すごく忙しいんでしょう？
  d_nikke_snowcrane_01_76:
    speaker: snowcrane
    en: Even now, you look exhausted.
    ko: 지금도 많이 피곤해 보이는데요….
    ja: 今だってお疲れのようですし…
  d_nikke_snowcrane_01_77:
    speaker: "<Self>"
    en: After eating the dessert you gave me, I feel super energized.
    ko: 백학이 준 디저트 먹고, 기운이 펄펄 나거든.
    ja: |-
      気にするな。シラツルの差し入れのおかげで
      元気もりもりになったからな
  d_nikke_snowcrane_01_78:
    speaker: "<Self>"
    en: I owe you one.
    ko: 보답은 해야지.
    ja: 礼はさせてくれ
  d_nikke_snowcrane_01_79:
    speaker: snowcrane
    en: Oh.
    ko: 어머나.
    ja: まあ。
  d_nikke_snowcrane_01_80:
    speaker: snowcrane
    en: Hmm...
    ko: 음~
    ja: う～ん…
  d_nikke_snowcrane_01_81:
    speaker: snowcrane
    en: Hmmmm...
    ko: 으으음~
    ja: そうですね～…
  d_nikke_snowcrane_01_82:
    speaker: snowcrane
    en: Okay!
    ko: 좋아요!
    ja: "…分かりました！"
  d_nikke_snowcrane_01_83:
    speaker: "<Self>"
    en: Oh, I thought you were going to say no.
    ko: 오, 거절할 줄 알았는데.
    ja: てっきり断られるかと思ったが…
  d_nikke_snowcrane_01_84:
    speaker: snowcrane
    en: Since you put it like that, it would be rude to turn you down.
    ko: 우리 친구가 그렇게까지 말하는데, 거절하는 것도 예의가 아니니까요.
    ja: |-
      おともだちにそこまで言われて、
      断るのも失礼ですから。
  d_nikke_snowcrane_01_85:
    speaker: "<Monologue>"
    en: Snow Crane smiles gently.
    ko: 백학은 부드럽게 미소를 지었다.
    ja: そう言うと、シラツルは優しい微笑みを浮かべた
  d_nikke_snowcrane_01_86:
    speaker: snowcrane
    en: I'm looking forward to it. See you tomorrow!
    ko: 기대할게요, 내일 만나요~
    ja: |-
      楽しみにしていますね。
      では、また明日～
d_nikke_snowcrane_02:
  d_nikke_snowcrane_02_1:
    speaker: "<Narration>"
    en: "*Pour*"
    ko: 쪼르르르-
    ja: トクトク…
  d_nikke_snowcrane_02_2:
    speaker: femaleemployee
    en: When you pour the hot milk over top, the chocolate melts, revealing the cake
      inside.
    ko: |-
      뜨거운 우유를 부어주면, 초콜릿이 녹으면서
      안에 있는 케이크가 보이게 됩니다.
    ja: |-
      上から温めたミルクをかけると、
      チョコが溶けて中からケーキが
      出てくるんですよ。
  d_nikke_snowcrane_02_3:
    speaker: snowcrane
    en: My word!
    ko: 어머!
    ja: まあ！
  d_nikke_snowcrane_02_4:
    speaker: femaleemployee
    en: Would you like to take this hammer?
    ko: 이번에는, 이 망치를 들어보시겠어요?
    ja: |-
      では、こちらのハンマーを
      持っていただけますか？
  d_nikke_snowcrane_02_5:
    speaker: snowcrane
    en: Oh, what a sweet little hammer.
    ko: 어머나, 아주 작고 귀여운 망치네요.
    ja: |-
      あらあら…ずいぶん小さくて
      かわいらしいハンマーですね。
  d_nikke_snowcrane_02_6:
    speaker: femaleemployee
    en: Now use it to break this bead.
    ko: 그걸로 이 유리공을 깨주세요.
    ja: |-
      こちらのハンマーで、
      このガラス玉を割ってみてください。
  d_nikke_snowcrane_02_7:
    speaker: snowcrane
    en: Wh-what...?
    ko: 네, 네…?
    ja: は、はい…？
  d_nikke_snowcrane_02_8:
    speaker: snowcrane
    en: But it's so beautiful...
    ko: 이렇게 예쁜 유리공을요…?
    ja: こんなにキレイなガラス玉をですか…？
  d_nikke_snowcrane_02_9:
    speaker: femaleemployee
    en: Isn't it? Just give it a little tap.
    ko: 네~ 아주 살살. 톡! 해보시겠어요?
    ja: はい。優しくトン！と叩いてみてください。
  d_nikke_snowcrane_02_10:
    speaker: snowcrane
    en: T-tap...
    ko: 토, 토옥….
    ja: ト、ト～ン…
  d_nikke_snowcrane_02_11:
    speaker: "<Narration>"
    en: "*Crumble*"
    ko: 파스스스-
    ja: パリッ…
  d_nikke_snowcrane_02_12:
    speaker: snowcrane
    en: M-my word...!
    ko: 어, 어머나…!
    ja: あ、あらまあ…！
  d_nikke_snowcrane_02_13:
    speaker: femaleemployee
    en: When the thin sugar glaze breaks, you can see the soft pastry inside.
    ko: |-
      얇은 설탕막이 깨지면서,
      안에 있는 부드러운 빵 부분이 나오게 됩니다.
    ja: |-
      薄いシュガードームを割ると、
      中から柔らかいスポンジが
      現われる仕掛けなんです。
  d_nikke_snowcrane_02_14:
    speaker: snowcrane
    en: That's... That's amazing...!
    ko: 너무…! 너무 신기해요~!
    ja: すごく…！すごく不思議です～！
  d_nikke_snowcrane_02_15:
    speaker: snowcrane
    en: This is closer to a work of art than a dessert.
    ko: 이건 디저트라기 보다는… 하나의 예술 작품에 더 가깝네요.
    ja: |-
      これはスイーツというよりも…
      もはや芸術作品のようですね～
  d_nikke_snowcrane_02_16:
    speaker: "<Self>"
    en: Isn't it cool? Try it.
    ko: |-
      신기하지?
      한 번 먹어봐.
    ja: 不思議だろう？食べてみてくれ
  d_nikke_snowcrane_02_17:
    speaker: snowcrane
    en: It's almost too beautiful to eat,
    ko: 먹기에 너무 아까워 보이긴 하지만~
    ja: "…食べるのはもったいない気がしますが～"
  d_nikke_snowcrane_02_18:
    speaker: snowcrane
    en: but since you used your valuable time to bring me here, I'll enjoy it.
    ko: |-
      우리 친구가 귀한 시간 내서 데려와 준 거니까,
      잘 먹을게요.
    ja: |-
      おともだちが大事な時間を割いて
      連れてきてくださったことですし、
      いただいてみますね。
  d_nikke_snowcrane_02_19:
    speaker: snowcrane
    en: "*Nom*"
    ko: 냠.
    ja: パクッ
  d_nikke_snowcrane_02_20:
    speaker: snowcrane
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_snowcrane_02_21:
    speaker: "<Self>"
    en: How is it? It's good, right?
    ko: 어때? 맛있지.
    ja: どうだ？おいしいだろう？
  d_nikke_snowcrane_02_22:
    speaker: snowcrane
    en: Mm... Yeah.
    ko: 음~ 네.
    ja: う～ん、そうですね。
  d_nikke_snowcrane_02_23:
    speaker: snowcrane
    en: It's good,
    ko: 맛있긴 한데요~
    ja: 確かにおいしいんですが～
  d_nikke_snowcrane_02_24:
    speaker: snowcrane
    en: but it's too sweet for my taste.
    ko: 제 입맛에는 너무 단 것 같아요.
    ja: 私の舌には、少し甘すぎるようです。
  d_nikke_snowcrane_02_25:
    speaker: "<Self>"
    en: Really? I think it's just right.
    ko: 그래? 난 적당하다고 생각했는데.
    ja: そうか？私にはちょうどいい甘さだが…
  d_nikke_snowcrane_02_26:
    speaker: snowcrane
    en: I tend to like simpler food, hehe.
    ko: 저는 담백한 음식들을 좋아하는 편이거든요~ 후후.
    ja: ふふ、私はシンプルな食べ物が好みなので～
  d_nikke_snowcrane_02_27:
    speaker: "<Self>"
    en: That's too bad. I like it.
    ko: 아쉽네, 나는 맛있는데.
    ja: |-
      そうか、残念だな。
      私はおいしいと思うのだが…
  d_nikke_snowcrane_02_28:
    speaker: "<Narration>"
    en: "*Munch, munch*"
    ko: 우물우물.
    ja: もぐもぐ…
  d_nikke_snowcrane_02_29:
    speaker: snowcrane
    en: Oh dear, is it that good, my friend?
    ko: 으휴, 우리 친구. 그렇게 맛있어요?
    ja: |-
      もう、おともだちったら。
      おいしくいただくのはいいことですが～
  d_nikke_snowcrane_02_30:
    speaker: snowcrane
    en: Are you trying to eat it with your chin?
    ko: 입이 아니라 턱으로 먹네~
    ja: 口じゃなくて、あごで食べちゃってますよ～？
  d_nikke_snowcrane_02_31:
    speaker: "<Monologue>"
    en: Snow Crane wipes my mouth with a white handkerchief.
    ko: 백학이 하얀 손수건으로 내 입가를 닦아주었다.
    ja: |-
      シラツルは白いハンカチで
      私の口元を拭いた
  d_nikke_snowcrane_02_32:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_02_33:
    speaker: "<Monologue>"
    en: Why do I feel like I've become a five-year-old?
    ko: 뭐지, 이 5살짜리 어린애가 된 것 같은 기분은….
    ja: |-
      …何だ？この5歳児にでも
      なったような気分は…
  d_nikke_snowcrane_02_34:
    speaker: "<Self>"
    en: Anyway! If you don't like it, then I'll have to finish it by myself.
    ko: 아무튼! 어쩔 수 없지, 내가 다 먹을 수밖에.
    ja: |-
      と、とにかく。
      私が全部食べるしかないだろう？
  d_nikke_snowcrane_02_35:
    speaker: snowcrane
    en: Oh, you can't do that.
    ko: 어머, 그건 안 돼요.
    ja: あら、それはダメですよ。
  d_nikke_snowcrane_02_36:
    speaker: "<Self>"
    en: Hm? Why not?
    ko: 응? 왜?
    ja: ん？なぜだ？
  d_nikke_snowcrane_02_37:
    speaker: snowcrane
    en: Sweet things aren't good for you.
    ko: 이렇게 단 건 몸에 좋지 않아요.
    ja: こんなに甘いものは、体に良くありません。
  d_nikke_snowcrane_02_38:
    speaker: snowcrane
    en: You could put on weight or get cavities.
    ko: 살이 찔 수도 있고, 충치가 날 수도 있으니까요.
    ja: |-
      太るかもしれませんし、
      虫歯だってできるかもしれませんよ？
  d_nikke_snowcrane_02_39:
    speaker: "<Self>"
    en: Oh...
    ko: 아….
    ja: あっ…
  d_nikke_snowcrane_02_40:
    speaker: "<Monologue>"
    en: I finally understand why Snow Crane insisted on using the words "super energizing
      fuel bomb."
    ko: |-
      백학이 굳이 [기운 펄펄 체력 쑥쑥] 이라는 키워드에 꽂힌 이유를
      이제야 좀 알 것 같았다.
    ja: |-
      シラツルがなぜ「元気もりもり
      体力ぐんぐん」に固執していたのか、
      今になって分かった気がした
  d_nikke_snowcrane_02_41:
    speaker: "<Self>"
    en: Yeah, but it's fine to eat this much...
    ko: 그래도 이 정도는 먹어도 되지 않나…?
    ja: だが、これくらいはいいのでは…？
  d_nikke_snowcrane_02_42:
    speaker: snowcrane
    en: Uh-uh, no sir.
    ko: 쓰읍- 안 돼요.
    ja: ダメと言ったらダメです。
  d_nikke_snowcrane_02_43:
    speaker: "<Self>"
    en: Okay...
    ko: 넵….
    ja: はい…
  d_nikke_snowcrane_02_44:
    speaker: snowcrane
    en: Hehe, you're such a good boy.
    ko: 후후~ 역시 착하다니까요.
    ja: ふふ、やっぱりいい子ですね。
  d_nikke_snowcrane_02_45:
    speaker: "<Monologue>"
    en: Snow Crane gently pats my head.
    ko: 백학이 내 머리를 부드럽게 쓰다듬어주었다.
    ja: シラツルが私の頭を優しくなでた
  d_nikke_snowcrane_02_46:
    speaker: snowcrane
    en: Still, thank you so much.
    ko: 그래도 정말 고마워요.
    ja: でも、今日はありがとうございました。
  d_nikke_snowcrane_02_47:
    speaker: snowcrane
    en: This was a good experience.
    ko: 좋은 경험이었어요.
    ja: おかげでいい経験になりました。
  d_nikke_snowcrane_02_48:
    speaker: "<Self>"
    en: There's still more to experience.
    ko: 아직 경험할 게 남아있어.
    ja: |-
      その、もう少しだけいいか？
      まだ見せたいものがあるんだ
  d_nikke_snowcrane_02_49:
    speaker: snowcrane
    en: Really? Are we going to another dessert shop?
    ko: 그래요? 다른 디저트 가게도 가는 건가요?
    ja: |-
      あら、そうなんですか？
      他のスイーツのお店に行くとか？
  d_nikke_snowcrane_02_50:
    speaker: "<Self>"
    en: Something like that.
    ko: 뭐, 비슷해.
    ja: まあ、そんなところだ
  d_nikke_snowcrane_02_51:
    speaker: "<Self>"
    en: If you don't want to eat any more, then let's go.
    ko: 더 안 먹을 거면, 일어나자.
    ja: もう食べないなら、行こう
  d_nikke_snowcrane_02_52:
    speaker: snowcrane
    en: Hmm...
    ko: 으음~
    ja: う～ん。
  d_nikke_snowcrane_02_53:
    speaker: snowcrane
    en: It's not good to waste food either, so I'll get a doggy bag.
    ko: 음식을 남기는 것도 좋지 않으니까, 이건 제가 싸가도록 할게요.
    ja: |-
      食べ物を残すのはいけませんので、
      残ったものはテイクアウトしますね。
  d_nikke_snowcrane_02_54:
    speaker: "<Self>"
    en: I thought you said you didn't like it.
    ko: 입맛에 안 맞다고 하지 않았어?
    ja: 口に合わないんだろう？
  d_nikke_snowcrane_02_55:
    speaker: snowcrane
    en: Haa, but even so.
    ko: 아휴, 그래도요~
    ja: それはそうですけど～
  d_nikke_snowcrane_02_56:
    speaker: snowcrane
    en: If I take it with me and mix it with other food, it might be okay.
    ko: 가져가서 다른 음식들이랑 섞어 먹으면 또 괜찮아질 수도 있어요.
    ja: |-
      持ち帰って他の食べ物と混ぜたら、
      おいしくなるかもしれませんし。
  d_nikke_snowcrane_02_57:
    speaker: "<Self>"
    en: S-sure...
    ko: 그, 그래….
    ja: そ、そうか…
  d_nikke_snowcrane_02_58:
    speaker: snowcrane
    en: Oh!
    ko: 어머!
    ja: まあ！
  d_nikke_snowcrane_02_59:
    speaker: snowcrane
    en: Is this the dessert I saw on TV?
    ko: 이거 TV에서 봤던 그 디저트, 맞죠?
    ja: あれって、テレビに出ていたスイーツですよね？
  d_nikke_snowcrane_02_60:
    speaker: "<Self>"
    en: Yep, it's the same rabbit dessert.
    ko: 응, 그 토끼 디저트 맞아.
    ja: ああ、あのウサギのスイーツだな
  d_nikke_snowcrane_02_61:
    speaker: snowcrane
    en: It certainly does look a lot like the ones I made.
    ko: 확실히, 제가 만든 것과 비교가 많이 되긴 하네요~
    ja: やっぱり、私の作ったものとは大違いですね～
  d_nikke_snowcrane_02_62:
    speaker: snowcrane
    en: It's even cuter in person.
    ko: 실제로 보니 더 귀여워요.
    ja: 実物のほうがずっとかわいいです。
  d_nikke_snowcrane_02_63:
    speaker: "<Self>"
    en: You said the store-bought ones probably had a lot of ingredients that are
      bad for you, right?
    ko: |-
      분명, 파는 건 안 좋은 성분이 많이 들어가 있어서
      몸에 안 좋을 것 같다고 했었지?
    ja: |-
      そういえば、市販のものは
      体に悪そうだと言っていたな？
  d_nikke_snowcrane_02_64:
    speaker: snowcrane
    en: That's right.
    ko: 네, 맞아요.
    ja: ええ、そうですね。
  d_nikke_snowcrane_02_65:
    speaker: snowcrane
    en: I never saw this dessert or the company that made it before,
    ko: |-
      아무래도 처음 보는 회사에,
      처음 보는 디저트다 보니.
    ja: |-
      初めて聞く会社で作られた
      見慣れないスイーツでしたので、
  d_nikke_snowcrane_02_66:
    speaker: snowcrane
    en: so I'm highly suspicious of them.
    ko: 불량 식품 같은 느낌이 들어서요.
    ja: ジャンクフードのような気がしてしまって。
  d_nikke_snowcrane_02_67:
    speaker: snowcrane
    en: I want my friend to eat only the best things. Hehe.
    ko: 우리 친구에게는 좋은 것만 드리고 싶거든요~ 후후.
    ja: |-
      おともだちには、体にいいものだけを
      食べてほしいんです～
  d_nikke_snowcrane_02_68:
    speaker: "<Self>"
    en: I see.
    ko: 그렇구나.
    ja: なるほど
  d_nikke_snowcrane_02_69:
    speaker: "<Self>"
    en: That's why I came here to prove to you that this dessert is made with good
      ingredients!
    ko: 그래서, 이 디저트가 좋은 재료로 만들어졌다는 걸 증명하러 왔어!
    ja: |-
      今日は、あのスイーツが体にいい材料で
      できていることを証明しようと思ってな
  d_nikke_snowcrane_02_70:
    speaker: snowcrane
    en: Prove it how?
    ko: 증명이요? 어떻게요?
    ja: 証明ですか？どうやって？
  d_nikke_snowcrane_02_71:
    speaker: "<Self>"
    en: I know the person who makes it.
    ko: 이 디저트, 내가 아는 사람이 만드는 거거든.
    ja: あのスイーツは私の知り合いが作っているんだ
  d_nikke_snowcrane_02_72:
    speaker: snowcrane
    en: Oh my word, I had no idea!
    ko: 세상에, 그랬군요~!
    ja: まあ、そうだったんですか～！
  d_nikke_snowcrane_02_73:
    speaker: snowcrane
    en: It seems my friend has a lot of other impressive friends.
    ko: 우리 친구는, 멋진 친구들을 많이 갖고 있나 보네요~
    ja: 素敵なおともだちがたくさんいるんですね～
  d_nikke_snowcrane_02_74:
    speaker: snowcrane
    en: So it was the friend of my friend? I can't wait.
    ko: 친구의 친구라니, 기대되는데요~?
    ja: |-
      おともだちのおともだちですか～
      どんな子なんでしょうね～？
  d_nikke_snowcrane_02_75:
    speaker: "<Self>"
    en: Are you more excited about meeting her than tasting the dessert?
    ko: 디저트보다 그쪽이 더 기대되는 거야?
    ja: スイーツよりもそちらのほうが楽しみか？
  d_nikke_snowcrane_02_76:
    speaker: snowcrane
    en: Hehe, naturally I'm looking forward to both.
    ko: 후후~ 당연히 둘 다 기대되죠.
    ja: ふふ、もちろんどちらも楽しみですよ。
  d_nikke_snowcrane_02_77:
    speaker: snowcrane
    en: Shall we?
    ko: 어서 가볼까요~?
    ja: じゃあ、行きましょうか～？
  d_nikke_snowcrane_02_78:
    speaker: "<Monologue>"
    en: Snow Crane leans over slightly and holds her hand out to me like you would
      for a kid.
    ko: |-
      백학이 마치 아이에게 하듯,
      살짝 허리를 숙여 내게 손을 건넸다.
    ja: |-
      シラツルはまるで子どもに接するように、
      少しかがみながら私に手を差し出した
  d_nikke_snowcrane_02_79:
    speaker: "<Monologue>"
    en: You're shorter than me.
    ko: "…나보다 키도 작으면서."
    ja: "…私よりも背が低いのにも関わらず"
  d_nikke_snowcrane_02_80:
    speaker: snowcrane
    en: Mm...
    ko: 음….
    ja: あら…？
  d_nikke_snowcrane_02_81:
    speaker: snowcrane
    en: You certainly are taller than I thought.
    ko: 생각했던 것보다 훨씬 더 크시네요.
    ja: 思ったよりもずいぶん背が高いんですね。
  d_nikke_snowcrane_02_82:
    speaker: snowcrane
    en: Then if you don't mind, why don't you hold out your hand?
    ko: 괜찮으면, 친구가 먼저 손 내밀어 주실래요~?
    ja: |-
      よければ、おともだちのほうから
      手を出してくれますか～？
  d_nikke_snowcrane_02_83:
    speaker: "<Monologue>"
    en: I hold out my hand to Snow Crane.
    ko: 나는 백학에게 손을 내밀었고.
    ja: 私はシラツルに手を差し出した
  d_nikke_snowcrane_02_84:
    speaker: snowcrane
    en: There's a good boy.
    ko: 착해라~
    ja: ふふ、いい子ですね～
  d_nikke_snowcrane_02_85:
    speaker: "<Monologue>"
    en: Snow Crane takes my hand.
    ko: 백학은 내 손을 잡았다.
    ja: シラツルは私の手を握った
  d_nikke_snowcrane_02_86:
    speaker: "<Self>"
    en: Why are we holding hands?
    ko: 그런데, 손은 왜 잡는 거야?
    ja: ところで、なぜ手をつなぐんだ？
  d_nikke_snowcrane_02_87:
    speaker: snowcrane
    en: What a silly question.
    ko: 당연한 걸 물어보네요.
    ja: それはもちろん、
  d_nikke_snowcrane_02_88:
    speaker: snowcrane
    en: It's because I don't want you to lose your way.
    ko: 길을 잃으면 안 되니까요~
    ja: 迷子になったら困るからですよ～
  d_nikke_snowcrane_02_89:
    speaker: "<Self>"
    en: Aha...
    ko: 아하….
    ja: そうか…
  d_nikke_snowcrane_02_90:
    speaker: "<Monologue>"
    en: We hold hands and walk toward Crust's kitchen.
    ko: 우리는 손을 잡고, 함께 크러스트의 주방으로 향했다.
    ja: |-
      私たちは手をつなぎながら、
      ともにクラストのキッチンに向かった
d_nikke_snowcrane_03:
  d_nikke_snowcrane_03_1:
    speaker: "<Narration>"
    en: "*Zing*"
    ko: 지잉-
    ja: ウィーン――
  d_nikke_snowcrane_03_2:
    speaker: crust
    en: Oh! Welcome, Mr. Gourmand.
    ko: 아! 어서 오세요, 미식가님!
    ja: あ！お待ちしてました、グルメ様！
  d_nikke_snowcrane_03_3:
    speaker: snowcrane
    en: Oh...!
    ko: 어머나…!
    ja: まあ…！
  d_nikke_snowcrane_03_4:
    speaker: snowcrane
    en: Oh my word, you didn't tell me your friend was so adorable.
    ko: 세상에, 이렇게 귀여운 친구라고는 말해주지 않았잖아요~
    ja: |-
      こんなにかわいいおともだちと
      お会いできるなんて～！
  d_nikke_snowcrane_03_5:
    speaker: "<Monologue>"
    en: Snow Crane runs over to Crust.
    ko: 백학은 크러스트에게 달려갔다.
    ja: シラツルはクラストのもとへと駆け寄った
  d_nikke_snowcrane_03_6:
    speaker: crust
    en: H-hello...!
    ko: 아, 안녕하세요…!
    ja: こ、こんにちは…！
  d_nikke_snowcrane_03_7:
    speaker: crust
    en: I'm Crust from Cooking Oil.
    ko: 저는 쿠킹오일 스쿼드의 크러스트라고 해요.
    ja: クッキングオイル所属のクラストと言います。
  d_nikke_snowcrane_03_8:
    speaker: snowcrane
    en: Hehe, what a polite introduction.
    ko: 후후~ 인사성도 바르네요.
    ja: |-
      うふふ～
      きちんと挨拶もできて、いい子ですね～
  d_nikke_snowcrane_03_9:
    speaker: snowcrane
    en: I'm Snow Crane. Nice to meet you.
    ko: 저는 백학이라고 해요, 잘 부탁드려요~
    ja: |-
      私はシラツルと言います。
      よろしくお願いしますね～
  d_nikke_snowcrane_03_10:
    speaker: crust
    en: Mr. Gourmand told me
    ko: 미식가님께 이야기 들었어요.
    ja: |-
      は、はい！
      グルメ様からお話は聞きました。
  d_nikke_snowcrane_03_11:
    speaker: crust
    en: that you were worried my Super Energizing Fuel Bomb Desserts had bad ingredients
      in them!
    ko: |-
      제가 만든 [기운 펄펄 체력 쑥쑥 디저트]에
      나쁜 성분이 있지 않을까 걱정하셨다는 걸 말이에요!
    ja: |-
      私が作った「元気もりもり
      体力ぐんぐんスイーツ」に悪い成分が
      入ってないか、心配されているんですよね！
  d_nikke_snowcrane_03_12:
    speaker: snowcrane
    en: Oh my.
    ko: 어머.
    ja: まあ…
  d_nikke_snowcrane_03_13:
    speaker: snowcrane
    en: I'm sorry. I'm just a very cautious person...
    ko: 미안해요, 제가 조심성이 좀 많은 편이라….
    ja: |-
      ごめんなさいね。
      私って、ちょっと心配性なところがあって…
  d_nikke_snowcrane_03_14:
    speaker: snowcrane
    en: If I'd known they were made by such a lovely friend, I never would've said
      that.
    ko: |-
      이렇게 귀엽고 사랑스러운 친구가 만들었다는 걸 알았으면,
      그런 이야기는 하지 않았을 거예요.
    ja: |-
      こんなにかわいらしい子が作ってると
      知っていたら、そんなことは
      言い出さなかったんですが…
  d_nikke_snowcrane_03_15:
    speaker: crust
    en: No, it's all right.
    ko: 아뇨, 괜찮아요.
    ja: いえ、大丈夫です！
  d_nikke_snowcrane_03_16:
    speaker: crust
    en: It's only natural to feel that way.
    ko: 당연히 그렇게 느끼실 수 있죠.
    ja: そう思われるのも当然ですので！
  d_nikke_snowcrane_03_17:
    speaker: crust
    en: So I decided to show you how I make my desserts and let you try making them
      yourself!
    ko: |-
      그래서, 제 디저트가 어떻게 만들어지는지 보여드리면서
      직접 만들어보는 시간을 가져보려고 해요!
    ja: |-
      そこで、私が実際に作っているところを
      お見せしながらご一緒に作るのは
      どうでしょうか！
  d_nikke_snowcrane_03_18:
    speaker: snowcrane
    en: You're going to give me a demonstration?
    ko: 크러스트 친구가 직접 시범을 보여주는 건가요~?
    ja: |-
      まあ、クラストがお手本を
      見せてくれるんですか～？
  d_nikke_snowcrane_03_19:
    speaker: crust
    en: That's right!
    ko: 네, 맞아요!
    ja: はいっ！
  d_nikke_snowcrane_03_20:
    speaker: snowcrane
    en: That sounds so fun.
    ko: 너무 재밌겠네요~
    ja: ふふ、それは面白そうですね～
  d_nikke_snowcrane_03_21:
    speaker: "<Self>"
    en: Oh, Crust. Would it be possible to make it a little less sweet?
    ko: |-
      아, 크러스트.
      디저트 만드는 거, 덜 달게 가능할까?
    ja: |-
      そうだ、クラスト。
      甘さを控えめにしたものも作れるか？
  d_nikke_snowcrane_03_22:
    speaker: crust
    en: Of course!
    ko: 물론이죠~!
    ja: もちろんです！
  d_nikke_snowcrane_03_23:
    speaker: crust
    en: Hehe, I'll make a special treat just for the two of you!
    ko: 헤헤, 두 분만을 위한 특별 디저트가 되겠네요!
    ja: |-
      えへへ、お二人だけの
      スペシャルなスイーツになりそうですね！
  d_nikke_snowcrane_03_24:
    speaker: crust
    en: Ready to start?
    ko: 그럼, 시작해 볼까요?
    ja: では、さっそく始めましょうか？
  d_nikke_snowcrane_03_25:
    speaker: crust
    en: First,
    ko: 첫 번째.
    ja: まず初めに～
  d_nikke_snowcrane_03_26:
    speaker: crust
    en: you make the dough out of flour.
    ko: 밀가루로 반죽을 만들어 줍니다.
    ja: 小麦粉で生地を作ります。
  d_nikke_snowcrane_03_27:
    speaker: snowcrane
    en: Wow, you mean this powder turns into a dough?
    ko: 와~ 이 가루들이 반죽이 된다는 거죠?
    ja: わあ～、この粉が生地になるんですね？
  d_nikke_snowcrane_03_28:
    speaker: snowcrane
    en: That's incredible.
    ko: 신기하네요.
    ja: 不思議ですね～
  d_nikke_snowcrane_03_29:
    speaker: "<Self>"
    en: No kidding. I've never made a dessert like this before ei—
    ko: 그러게, 나도 이런 디저트 만들어보는 건 처음인 것 같은-
    ja: そうだな。私もスイーツ作りは初めて…
  d_nikke_snowcrane_03_30:
    speaker: "<Self>"
    en: "...!"
    ko: "……!"
    ja: "……！"
  d_nikke_snowcrane_03_31:
    speaker: "<Monologue>"
    en: As I chat excitedly while pouring out flour,
    ko: 밀가루를 그릇에 부으며 신나게 말하다가.
    ja: |-
      小麦粉をボウルに入れながら
      楽しく話していると
  d_nikke_snowcrane_03_32:
    speaker: "<Monologue>"
    en: I suddenly feel it go up my nose.
    ko: 갑자기 가루들이 코로 훅 들어오는 것을 느꼈다.
    ja: |-
      突然、小麦粉が
      鼻にふっと入り込んできた
  d_nikke_snowcrane_03_33:
    speaker: snowcrane
    en: Friend? What's wrong?
    ko: 친구? 갑자기 왜 그래요?
    ja: おともだち、どうかしましたか？
  d_nikke_snowcrane_03_34:
    speaker: snowcrane
    en: You look a little—
    ko: 표정이 이상한-
    ja: 急に不思議な顔をして…
  d_nikke_snowcrane_03_35:
    speaker: "<Self>"
    en: A...! A...!
    ko: 으…! 으에에…!
    ja: ふっ…！ふあっ…！
  d_nikke_snowcrane_03_36:
    speaker: "<Self>"
    en: Achoo!
    ko: 푸엣취!!
    ja: はくしょんっ！！
  d_nikke_snowcrane_03_37:
    speaker: snowcrane
    en: Oh dear...!
    ko: 어머나…!
    ja: あらら…！
  d_nikke_snowcrane_03_38:
    speaker: "<Monologue>"
    en: My sneeze sends flour flying in all directions.
    ko: 나의 재채기에 밀가루들이 사방으로 휘날렸고.
    ja: |-
      こらえきれずに出たくしゃみで
      小麦粉があちこちに飛び散り
  d_nikke_snowcrane_03_39:
    speaker: "<Monologue>"
    en: I turn white from head to toe.
    ko: 나는 머리부터 상체까지 모두 새하얗게 변해있었다.
    ja: 私は上半身が真っ白になっていた
  d_nikke_snowcrane_03_40:
    speaker: crust
    en: M-Mr. Gourmand...
    ko: 미, 미식가님….
    ja: グ、グルメ様…
  d_nikke_snowcrane_03_41:
    speaker: snowcrane
    en: Pfft...!
    ko: 풉…!
    ja: プッ…！
  d_nikke_snowcrane_03_42:
    speaker: snowcrane
    en: Ahaha! Hehehe!
    ko: 아하하~! 후후후~!
    ja: あははっ、うふふふふ…！
  d_nikke_snowcrane_03_43:
    speaker: snowcrane
    en: What are you doing? Just look at this mess.
    ko: 뭐 하시는 거예요~ 정말 칠칠치 못하다니까요.
    ja: |-
      もう、何してるんですか～
      本当にそそっかしい子ですね。
  d_nikke_snowcrane_03_44:
    speaker: "<Monologue>"
    en: Snow Crane carefully shakes the flour from my hair.
    ko: 백학은 조심스러운 손짓으로 내 머리에 있는 밀가루를 털어주었다.
    ja: |-
      シラツルは優しい手つきで
      私の頭についた小麦粉を払った
  d_nikke_snowcrane_03_45:
    speaker: crust
    en: Are you okay?
    ko: 괘, 괜찮으세요?
    ja: だ、大丈夫ですか？
  d_nikke_snowcrane_03_46:
    speaker: crust
    en: You might want to wash off...
    ko: 씻으셔야 할 것 같은데….
    ja: シャワーを浴びたほうがよさそうですけど…
  d_nikke_snowcrane_03_47:
    speaker: "<Self>"
    en: I'm okay. I just feel bad about messing up the kitchen...
    ko: 난 괜찮은데, 주방이 너무 더러워져서 미안해….
    ja: |-
      いや、私は平気だ。
      キッチンを汚してしまってすまない…
  d_nikke_snowcrane_03_48:
    speaker: snowcrane
    en: We'll clean it right up before we leave.
    ko: 저희가 나갈 때, 아주 깨끗하게 정리해 두고 갈게요.
    ja: 帰る時に、きれいにお掃除しておきますね。
  d_nikke_snowcrane_03_49:
    speaker: crust
    en: Hehe, I certainly don't mind.
    ko: 헤헤, 저야말로 괜찮아요.
    ja: えへへ、気にしないでください。
  d_nikke_snowcrane_03_50:
    speaker: "<Monologue>"
    en: After I shook off as much flour as I could, the dessert class resumed.
    ko: |-
      최대한 밀가루를 털어낸 나는,
      디저트 만들기를 이어갔다.
    ja: |-
      私はできるだけ小麦粉を払い落とした後、
      スイーツ作りを再開した
  d_nikke_snowcrane_03_51:
    speaker: crust
    en: Second,
    ko: 두 번째.
    ja: さて、この後は～
  d_nikke_snowcrane_03_52:
    speaker: crust
    en: we'll make the almond paste that's full of all sorts of nutrients to put inside
      the dough!
    ko: 반죽 안에 들어갈 영양 듬뿍 고소한 아몬드 크림을 만들 거예요!
    ja: |-
      生地の中に入れる、栄養たっぷりで
      香ばしいアーモンドクリームを作りましょう！
  d_nikke_snowcrane_03_53:
    speaker: crust
    en: Once you mix together all those ingredients, we'll simmer it until it thickens!
    ko: |-
      재료들을 다 섞으셨으면,
      약한 불에서 걸쭉해질 때까지 끓여주세요!
    ja: |-
      材料を全部混ぜたら、
      とろみがつくまで弱火で煮立たせてください！
  d_nikke_snowcrane_03_54:
    speaker: "<Narration>"
    en: "*Bubble bubble*"
    ko: 보글보글-
    ja: グツグツ…
  d_nikke_snowcrane_03_55:
    speaker: snowcrane
    en: Mm... It smells so nutty and sweet.
    ko: 음~ 고소하고 달콤한 냄새가 나네요.
    ja: う～ん、香ばしくて甘い香りがしますね。
  d_nikke_snowcrane_03_56:
    speaker: snowcrane
    en: Stand back a bit, friend.
    ko: 친구는 살짝 뒤로 가 있도록 해요.
    ja: |-
      おともだちは、
      少し後ろに下がっていてください。
  d_nikke_snowcrane_03_57:
    speaker: "<Self>"
    en: Hm? Why?
    ko: 응? 왜?
    ja: ん？なぜだ？
  d_nikke_snowcrane_03_58:
    speaker: "<Self>"
    en: We have to stir it while it simmers.
    ko: 계속 끓이면서 저어야 하는 거 아냐?
    ja: 火にかけながらかき混ぜるんだろう？
  d_nikke_snowcrane_03_59:
    speaker: snowcrane
    en: That's right.
    ko: 맞아요.
    ja: そうですよ。
  d_nikke_snowcrane_03_60:
    speaker: snowcrane
    en: But you see, fire is very, very dangerous.
    ko: 하지만 불은~ 매우매우 위험하니까요.
    ja: でも、火はと～っても危険ですので、
  d_nikke_snowcrane_03_61:
    speaker: snowcrane
    en: I'll do it for you.
    ko: 제가 대신 해드릴게요~
    ja: 私が代わりにかき混ぜますね～
  d_nikke_snowcrane_03_62:
    speaker: "<Self>"
    en: I think you're being a little overprotective.
    ko: 너무 과보호하는 거 아냐?
    ja: 過保護すぎないか…？
  d_nikke_snowcrane_03_63:
    speaker: snowcrane
    en: But what if there's flour left over?
    ko: 밀가루가 남아있으면 큰일이잖아요.
    ja: 小麦粉がダマになっていたら大変ですので。
  d_nikke_snowcrane_03_64:
    speaker: snowcrane
    en: It might go boom! and explode out.
    ko: 펑~ 하고 터질 수도 있답니다?
    ja: パ～ンって、急に爆発するかもしれませんよ？
  d_nikke_snowcrane_03_65:
    speaker: crust
    en: Oh, don't worry.
    ko: 그렇지는 않아요~
    ja: それならご安心ください！
  d_nikke_snowcrane_03_66:
    speaker: crust
    en: This kitchen perfectly controls all explosions, fire, and gas.
    ko: |-
      저희 주방은 폭발, 불, 가스 같은 것들을
      완벽하게 제어하고 있거든요.
    ja: |-
      私のキッチンでは、そういった事故が
      起きないようにガスや各種設備を
      しっかりコントロールしていますので！
  d_nikke_snowcrane_03_67:
    speaker: snowcrane
    en: Really? Is that sort of thing possible?
    ko: 네~? 그럴 수가 있나요?
    ja: まあ、そんなことができるんですか？
  d_nikke_snowcrane_03_68:
    speaker: crust
    en: Hehe, it sure is!
    ko: 헤헤, 네!
    ja: えへへ、はい！
  d_nikke_snowcrane_03_69:
    speaker: crust
    en: I sometimes have guests or offer classes, so I can't let it be dangerous here!
    ko: |-
      손님들도 오시고, 수업도 종종 하기 때문에
      위험하면 안 되니까요!
    ja: |-
      ここにはお客様も来ますし、
      たまにレッスンもしてるので
      危険があってはダメですから！
  d_nikke_snowcrane_03_70:
    speaker: snowcrane
    en: Wow, that's amazing.
    ko: 와아, 정말 대단하네요~
    ja: まあ、本当にすごいですね～
  d_nikke_snowcrane_03_71:
    speaker: "<Self>"
    en: Hmm...
    ko: 흠….
    ja: "……"
  d_nikke_snowcrane_03_72:
    speaker: "<Monologue>"
    en: In spite of this, Snow Crane keeps peeking over at me.
    ko: 그럼에도 백학은 나를 힐끗힐끗 쳐다보았고.
    ja: |-
      シラツルはクラストの説明に感心しながらも、
      私のほうをチラチラと見ている
  d_nikke_snowcrane_03_73:
    speaker: "<Monologue>"
    en: I finally take a step back.
    ko: 나는, 결국 한 발짝 뒤로 물러났다.
    ja: 結局、私は一歩下がることにした
  d_nikke_snowcrane_03_74:
    speaker: snowcrane
    en: Hehe, there's good boy.
    ko: 후후~ 역시 착하다니까요.
    ja: ふふ、やっぱりいい子ですね。
  d_nikke_snowcrane_03_75:
    speaker: "<Self>"
    en: It's because you're so nervous.
    ko: "…너무 불안해하니까."
    ja: "…そこまで不安がられると、さすがにな"
  d_nikke_snowcrane_03_76:
    speaker: snowcrane
    en: Oh!
    ko: 아!
    ja: あっ！
  d_nikke_snowcrane_03_77:
    speaker: snowcrane
    en: Crust,
    ko: 그런데요, 크러스트.
    ja: ところで、クラスト。
  d_nikke_snowcrane_03_78:
    speaker: snowcrane
    en: is this paste really good for you?
    ko: 이 크림은 정말 건강에 좋은 것 맞나요?
    ja: このクリームって、本当に体にいいのですか？
  d_nikke_snowcrane_03_79:
    speaker: snowcrane
    en: It has sugar in it, so I worry it might actually be bad for you...
    ko: |-
      설탕도 들어가고 하던데,
      오히려 몸에 안 좋은 건 아닐지….
    ja: |-
      砂糖も入ってますし、
      むしろ体に良くないんじゃ…
  d_nikke_snowcrane_03_80:
    speaker: snowcrane
    en: I only want my friend to eat the best things.
    ko: 우리 친구에게는 좋은 것만 먹이고 싶거든요.
    ja: |-
      おともだちには、できるだけ
      体にいいものだけを食べさせたいんです。
  d_nikke_snowcrane_03_81:
    speaker: crust
    en: Of course!
    ko: 당연하죠~!
    ja: ご安心ください～！
  d_nikke_snowcrane_03_82:
    speaker: crust
    en: The powder I just put in isn't sugar. It's a new sweetener I created.
    ko: |-
      아까 넣으셨던 가루는,
      설탕이 아니라 이번에 새로 개발한 대체 당이에요.
    ja: |-
      さっき入れた粉は、本物の砂糖じゃなく
      新しく開発した代用甘味料なんです。
  d_nikke_snowcrane_03_83:
    speaker: crust
    en: I wanted to make up for the downsides of other sweeteners, so I made it both
      sweet and nutritious!
    ko: |-
      기존 대체 당의 단점들을 보완해서,
      달달하면서도 다양한 영양소가 있는 쪽으로 만들었거든요!
    ja: |-
      今までの代用甘味料の欠点を補えるように、
      甘さはそのままに色んな栄養素を入れて
      作りました！
  d_nikke_snowcrane_03_84:
    speaker: snowcrane
    en: S-sweetener?
    ko: 대, 대체… 당이요?
    ja: だ、代用…甘味料？
  d_nikke_snowcrane_03_85:
    speaker: snowcrane
    en: What's that?
    ko: 그게 뭐죠?
    ja: それは…何ですか？
  d_nikke_snowcrane_03_86:
    speaker: snowcrane
    en: Wait, you say it's nutritious too?
    ko: 아니, 게다가 영양소가 다양하다고요?
    ja: しかも、色んな栄養素が入っているのですか…？
  d_nikke_snowcrane_03_87:
    speaker: snowcrane
    en: So it won't rot your teeth or make you gain weight?
    ko: 그럼 이가 썩지도 않고, 살이 찌지도 않나요?
    ja: |-
      つまり、虫歯にもならないし
      太る心配もないのですか？
  d_nikke_snowcrane_03_88:
    speaker: crust
    en: Just like all foods, you don't want to eat too much of it,
    ko: 음식은 음식인지라, 많이 먹으면 어쩔 수 없겠지만….
    ja: |-
      う～ん…甘味料には変わりないので、
      食べ過ぎには注意しないとですが…
  d_nikke_snowcrane_03_89:
    speaker: crust
    en: but it's nothing for you to worry about!
    ko: 그렇게 걱정하실 정도는 아닐 거예요!
    ja: |-
      基本的には、そこまで心配しなくても
      大丈夫だと思います！
  d_nikke_snowcrane_03_90:
    speaker: snowcrane
    en: Aha...
    ko: 아하~
    ja: なるほど～
  d_nikke_snowcrane_03_91:
    speaker: snowcrane
    en: Then I suppose I don't need to be too worried.
    ko: 제가 너무 걱정하지 않아도 되겠어요.
    ja: なら、安心して食べられそうですね。
  d_nikke_snowcrane_03_92:
    speaker: "<Monologue>"
    en: Snow Crane glances over at me.
    ko: 백학이 나를 슬쩍 쳐다보았다.
    ja: シラツルはチラッと私のほうを見た
  d_nikke_snowcrane_03_93:
    speaker: "<Self>"
    en: Snow Crane?
    ko: 백학?
    ja: シラツル？
  d_nikke_snowcrane_03_94:
    speaker: snowcrane
    en: Hehe, I have no idea why I worry so much and want to take care of you.
    ko: |-
      후후, 하지만 왜 이렇게 걱정스럽고, 챙겨주고 싶고
      그러는지 모르겠네요~
    ja: |-
      ふふ。そう言われても心配で、
      お世話してあげたくなっちゃうのは
      どうしてなんでしょうね～
  d_nikke_snowcrane_03_95:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_03_96:
    speaker: "<Self>"
    en: You can keep worrying and taking care of me.
    ko: 계속 걱정하고, 챙겨주면 되지.
    ja: |-
      それなら、これからも
      そのままでいてくれていい
  d_nikke_snowcrane_03_97:
    speaker: snowcrane
    en: Can I really?
    ko: 어머, 그래도 되나요?
    ja: まあ、いいんですか？
  d_nikke_snowcrane_03_98:
    speaker: snowcrane
    en: You don't find it annoying or overwhelming?
    ko: 싫거나, 부담스럽진 않나요?
    ja: イヤだったり、迷惑だったりしませんか？
  d_nikke_snowcrane_03_99:
    speaker: "<Self>"
    en: Why would I be annoyed or overwhelmed by you worrying about me?
    ko: 나 걱정해 준다는데, 싫고 부담스러울 게 뭐 있어.
    ja: |-
      私を気にかけてくれる人を
      迷惑だとは思わない
  d_nikke_snowcrane_03_100:
    speaker: snowcrane
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_03_101:
    speaker: snowcrane
    en: Hehe...
    ko: 후후~
    ja: "…うふふ。"
  d_nikke_snowcrane_03_102:
    speaker: "<Monologue>"
    en: Snow Crane reaches her hand out to me.
    ko: 백학은 나를 향해 손을 쭉 뻗었고.
    ja: |-
      シラツルは微笑みながら
      私に向かって手を伸ばした
  d_nikke_snowcrane_03_103:
    speaker: "<Monologue>"
    en: This time I automatically bow my head and accept her pats.
    ko: 나는 이제 자연스럽게, 고개를 숙여 쓰다듬을 받았다.
    ja: |-
      それを見た私は自然と頭を下げ、
      ナデナデを享受するのだった
d_nikke_snowcrane_04:
  d_nikke_snowcrane_04_1:
    speaker: crust
    en: Ta-da! And now our Super Energizing Fuel Bomb Desserts are done!
    ko: 짠~ 이렇게 [기운 펄펄 체력 쑥쑥 디저트] 완성~!
    ja: |-
      ジャ～ン！
      「元気もりもり体力ぐんぐんスイーツ」、
      完成で～す！
  d_nikke_snowcrane_04_2:
    speaker: snowcrane
    en: My word! I can't believe I made something so adorable with my own hands...
    ko: 어머나~ 제 손으로 이렇게 귀여운 걸 만들다니…
    ja: |-
      まあ～！まさか、手作りで
      こんなにかわいいスイーツを作れるなんて…
  d_nikke_snowcrane_04_3:
    speaker: snowcrane
    en: Look at that. Your bunny's ears are a bit bigger than mine.
    ko: 세상에, 우리 친구의 토끼는 귀가 조금 더 크네요?
    ja: |-
      ふふ、おともだちのウサギさんは
      お耳がちょっと大きめですね？
  d_nikke_snowcrane_04_4:
    speaker: snowcrane
    en: It looks so much cuter.
    ko: 훨씬 귀여워요~
    ja: うんとかわいく見えます～
  d_nikke_snowcrane_04_5:
    speaker: crust
    en: You both did an excellent job!
    ko: 두 분 모두 정말 잘 만드셨네요!
    ja: お二人とも、とっても上手に作れましたね！
  d_nikke_snowcrane_04_6:
    speaker: crust
    en: Great work!
    ko: 정말 수고 많으셨어요!
    ja: 本当にお疲れ様でした！
  d_nikke_snowcrane_04_7:
    speaker: snowcrane
    en: Thank you for taking the time to teach us.
    ko: 크러스트 친구도, 열심히 가르치느라 고생 많았어요~
    ja: |-
      クラストもお疲れ様でした～
      一生懸命教えてくれて、ありがとうございます。
  d_nikke_snowcrane_04_8:
    speaker: crust
    en: Hehe...
    ko: 헤, 헤헤….
    ja: へへ、えへへ…
  d_nikke_snowcrane_04_9:
    speaker: crust
    en: Just doing my job... Hehe.
    ko: 이게 제 일인걸요… 헤헷.
    ja: これが私のお仕事なので…えへへへ。
  d_nikke_snowcrane_04_10:
    speaker: "<Monologue>"
    en: As Snow Crane pats her head, Crust smiles and grows red.
    ko: |-
      백학의 쓰다듬을 받는 크러스트는
      얼굴이 붉어진 채로 웃고 있었다.
    ja: |-
      シラツルに頭をなでられたクラストは、
      顔を赤らめながら笑顔を見せた
  d_nikke_snowcrane_04_11:
    speaker: snowcrane
    en: Ready to go?
    ko: 자, 그럼 가볼까요~?
    ja: それでは、行きましょうか～？
  d_nikke_snowcrane_04_12:
    speaker: "<Self>"
    en: Hm? Go where?
    ko: 응? 어딜 가?
    ja: ん？どこに行くんだ？
  d_nikke_snowcrane_04_13:
    speaker: snowcrane
    en: They're so cute.
    ko: 너무 귀엽잖아요.
    ja: とってもかわいいスイーツを作れたので～
  d_nikke_snowcrane_04_14:
    speaker: snowcrane
    en: It'd be a waste to just eat them, so I want to get pictures.
    ko: 이대로 바로 먹기엔 아까우니까, 사진으로 남기고 싶어서요~
    ja: |-
      このまま食べてしまうのはもったいないですし、
      写真に残しておきたいなと思いまして～
  d_nikke_snowcrane_04_15:
    speaker: "<Self>"
    en: "...?"
    ko: "……?"
    ja: "……？"
  d_nikke_snowcrane_04_16:
    speaker: crust
    en: "??"
    ko: "??"
    ja: "？？"
  d_nikke_snowcrane_04_17:
    speaker: snowcrane
    en: Let's go to a photography studio.
    ko: 사진관에 가려고요~
    ja: 写真館に行きたいな～と。
  d_nikke_snowcrane_04_18:
    speaker: snowcrane
    en: Come to think of it, I've never seen a photography studio.
    ko: 그러고 보니, 사진관을 본 기억이 없네요.
    ja: |-
      …あら？そういえば、この辺りで
      写真館は見たことがないですね。
  d_nikke_snowcrane_04_19:
    speaker: snowcrane
    en: Do you know of a good place?
    ko: 혹시 괜찮은 곳 알고 계신가요~?
    ja: どこか写真を撮れる場所は知ってますか～？
  d_nikke_snowcrane_04_20:
    speaker: "<Self>"
    en: A photography studio?
    ko: 사진관…?
    ja: 写真館…？
  d_nikke_snowcrane_04_21:
    speaker: crust
    en: Unless you're going to get a portrait done, wouldn't it be better to just
      take pictures here on your phone?
    ko: |-
      프로필 사진 같은 걸 찍으시려는 게 아니라면,
      그냥 여기서 휴대폰으로 찍으시는 게 낫지 않을까요…?
    ja: |-
      証明写真とかじゃなければ、
      ここで携帯で撮ればいいのでは…？
  d_nikke_snowcrane_04_22:
    speaker: snowcrane
    en: Take a picture... on my phone?
    ko: 휴대폰으로… 사진을요?
    ja: 携帯で…写真を…？
  d_nikke_snowcrane_04_23:
    speaker: "<Monologue>"
    en: Bewildered, Snow Crane pulls out her phone.
    ko: 백학이 어리둥절해하며 본인의 휴대폰을 꺼냈다.
    ja: シラツルは戸惑いながら携帯端末を取り出した
  d_nikke_snowcrane_04_24:
    speaker: snowcrane
    en: With this little thing?
    ko: 이 작은 걸로요?
    ja: こんなに小さいもので？
  d_nikke_snowcrane_04_25:
    speaker: "<Monologue>"
    en: It feels like the same thing keeps happening.
    ko: 계속 비슷한 일이 일어나고 있는 것 같은데….
    ja: |-
      …今日は何度も、シラツルの
      似たような反応を見ている気がする
  d_nikke_snowcrane_04_26:
    speaker: crust
    en: Oh, do you have trouble using your phone?
    ko: 아, 휴대폰 사용이 어려우신가요?
    ja: えっと、カメラの出し方が分かりませんか？
  d_nikke_snowcrane_04_27:
    speaker: crust
    en: If you look here, you can see the camera icon.
    ko: 여기 보시면, 카메라 아이콘이 있어요.
    ja: ここにカメラのアイコンがあるので、
  d_nikke_snowcrane_04_28:
    speaker: crust
    en: If you push this button, then ta-da!
    ko: 이 버튼을 누르시면~ 짠!
    ja: ここを押すと～、ジャーン！
  d_nikke_snowcrane_04_29:
    speaker: crust
    en: It turns on the camera!
    ko: 카메라가 켜진답니다!
    ja: カメラモードになるんです！
  d_nikke_snowcrane_04_30:
    speaker: snowcrane
    en: Oh my word...!
    ko: 어머, 어머나~!
    ja: あらまあ～！
  d_nikke_snowcrane_04_31:
    speaker: snowcrane
    en: I can see you! Wow, that's incredible...!
    ko: 여러분이 보여요! 와아 신기해라…!
    ja: みなさんが見えます～！わあ、不思議…！
  d_nikke_snowcrane_04_32:
    speaker: snowcrane
    en: Oh my word, it's so clear...!
    ko: 세상에, 엄청 선명하네요~!
    ja: しかも、とても鮮明に写ってます～！
  d_nikke_snowcrane_04_33:
    speaker: snowcrane
    en: So how do you take a picture?
    ko: 그런데, 어떻게 찍는 건가요?
    ja: "…ところで、どうやって撮るんですか？"
  d_nikke_snowcrane_04_34:
    speaker: "<Self>"
    en: Just tap that round button, and it'll take one.
    ko: 동그란 버튼을 터치하면, 자동으로 찍혀.
    ja: |-
      丸いボタンを押すと、
      自動で撮ってくれるはずだ
  d_nikke_snowcrane_04_35:
    speaker: snowcrane
    en: The round button...
    ko: 동그란 버튼….
    ja: 丸いボタン…
  d_nikke_snowcrane_04_36:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵-
    ja: カシャッ
  d_nikke_snowcrane_04_37:
    speaker: snowcrane
    en: Oh my! Hehe, it really worked.
    ko: 어머~ 후후, 정말 찍히네.
    ja: まあっ！ふふ、本当に撮れました～
  d_nikke_snowcrane_04_38:
    speaker: snowcrane
    en: Hmm...
    ko: 흠흠~
    ja: ふんふ～ん…
  d_nikke_snowcrane_04_39:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_04_40:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_04_41:
    speaker: "<Monologue>"
    en: After taking a picture, Snow Crane stands still for a while.
    ko: 백학은 사진 한 장을 찍고, 한참을 가만히 있는다.
    ja: |-
      シラツルは写真を1枚撮った後、
      なぜかじっと見つめている
  d_nikke_snowcrane_04_42:
    speaker: "<Self>"
    en: Snow Crane? What are you doing?
    ko: 백학? 뭐해…?
    ja: シラツル？どうしたんだ…？
  d_nikke_snowcrane_04_43:
    speaker: snowcrane
    en: Waiting for the picture to come out.
    ko: 사진이 나오길 기다리고 있어요~
    ja: 写真が出てくるのを待ってるんです～
  d_nikke_snowcrane_04_44:
    speaker: "<Self>"
    en: To come out?
    ko: 사진이 나와?
    ja: 写真が出てくる？
  d_nikke_snowcrane_04_45:
    speaker: snowcrane
    en: Yes. It went snap and took it, so now it's time for the photo to come out.
    ko: |-
      네, 찰칵~하고 찍었으니까
      사진이 나올 차례예요.
    ja: |-
      はい。カシャッと1枚撮ったので、
      次は写真が出てくるのをじ～っと待つ時間です。
  d_nikke_snowcrane_04_46:
    speaker: snowcrane
    en: I have to make sure it turned out well.
    ko: 잘 찍혔는지 확인을 해야 하니까요.
    ja: |-
      うまく撮れたか、ちゃんと確かめないと
      いけませんので。
  d_nikke_snowcrane_04_47:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_04_48:
    speaker: crust
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_04_49:
    speaker: snowcrane
    en: Oh...! Then it must use film.
    ko: 아~! 이게 아니라, 필름으로 되나 보네요.
    ja: "…あっ！もしかして、フィルム式でしたか？"
  d_nikke_snowcrane_04_50:
    speaker: snowcrane
    en: That means I have to find somewhere to print my pictures...
    ko: 그러면 인화를 할 수 있는 곳을….
    ja: じゃあ、現像できるところを…
  d_nikke_snowcrane_04_51:
    speaker: "<Self>"
    en: Thanks for today, Crust. We'll be on our way.
    ko: |-
      …크러스트, 오늘 고마웠어.
      먼저 가볼게.
    ja: |-
      …クラスト、今日はありがとう。
      これで失礼する
  d_nikke_snowcrane_04_52:
    speaker: crust
    en: My pleasure...! Have a good day.
    ko: 네…! 조심히 들어가세요.
    ja: は、はい！気をつけてお帰りください～！
  d_nikke_snowcrane_04_53:
    speaker: "<Monologue>"
    en: I hurriedly take Snow Crane's hand and leave the kitchen.
    ko: 나는 다급히 백학의 손을 잡고, 주방을 빠져나왔다.
    ja: |-
      私は急いでシラツルの手を取ると、
      キッチンから足早に立ち去った
  d_nikke_snowcrane_04_54:
    speaker: snowcrane
    en: Oh dear, friend.
    ko: 어머, 친구.
    ja: まあ、おともだちったら。
  d_nikke_snowcrane_04_55:
    speaker: snowcrane
    en: It's not polite to leave without properly saying goodbye to Crust.
    ko: |-
      크러스트에게 제대로 인사도 못 했는데,
      이렇게 나오는 건 예의가 아니에요.
    ja: |-
      クラストにきちんと挨拶もしないで
      帰るなんて、メッ、ですよ～？
  d_nikke_snowcrane_04_56:
    speaker: "<Self>"
    en: I just thought it would be even less polite to keep standing there.
    ko: "…계속 그렇게 있는 게 더 예의가 아닐 것 같아서 그랬어."
    ja: |-
      …その、あのままいたほうが
      迷惑をかける気がしてな
  d_nikke_snowcrane_04_57:
    speaker: snowcrane
    en: Really?
    ko: 어머, 그런가요?
    ja: あら、そうなんですか？
  d_nikke_snowcrane_04_58:
    speaker: snowcrane
    en: I suppose she might have other plans that we were getting in the way of.
    ko: 뒤에 다른 일정이 있는데, 저희가 시간을 너무 뺏었나 보네요.
    ja: |-
      あのあと別の予定があったのに、
      私たちが長引かせてしまった…
      ということでしょうか？
  d_nikke_snowcrane_04_59:
    speaker: snowcrane
    en: I'll just have to contact her later.
    ko: 다음에 따로 연락을 드려봐야겠어요~
    ja: |-
      そういうことなら、
      また今度連絡してみましょう～
  d_nikke_snowcrane_04_60:
    speaker: snowcrane
    en: So where are we going now? Are we going to print my photo?
    ko: |-
      그래서, 우리는 어디로 가는 거예요?
      인화를 하러 가는 건가요?
    ja: |-
      それで、今からどこへ向かうんですか？
      写真を現像できるところですか？
  d_nikke_snowcrane_04_61:
    speaker: "<Self>"
    en: Something like that.
    ko: 뭐, 비슷하지.
    ja: まあ、そんなところだ
  d_nikke_snowcrane_04_62:
    speaker: "<Monologue>"
    en: I take Snow Crane
    ko: 백학과 함께 도착한 곳은.
    ja: シラツルとともに向かったのは
  d_nikke_snowcrane_04_63:
    speaker: "<Monologue>"
    en: to a place that prints photos from your phone.
    ko: 휴대폰 사진을 출력해 주는 곳이었다.
    ja: |-
      携帯端末で撮った写真を
      プリントできる店だった
  d_nikke_snowcrane_04_64:
    speaker: staff_02
    en: Welcome. Are you here to print some photos?
    ko: 어서 오세요, 사진 출력하러 오셨나요?
    ja: |-
      いらっしゃいませ。
      写真プリントをご希望ですか？
  d_nikke_snowcrane_04_65:
    speaker: staff_02
    en: If you hand me your phone and chose the pictures you want, I'll get started
      right away.
    ko: 휴대폰 주시면, 원하는 사진 선택해서 진행해 드리겠습니다.
    ja: |-
      携帯をお渡しいただければ、
      ご希望の写真をプリントいたします。
  d_nikke_snowcrane_04_66:
    speaker: snowcrane
    en: Oh!
    ko: 아~!
    ja: まあ…！
  d_nikke_snowcrane_04_67:
    speaker: snowcrane
    en: Here you go. Thank you!
    ko: 여기 있어요, 감사해요~
    ja: では、この写真をお願いします～
  d_nikke_snowcrane_04_68:
    speaker: staff_02
    en: Thank you.
    ko: 네, 감사합니다.
    ja: はい、かしこまりました。
  d_nikke_snowcrane_04_69:
    speaker: staff_02
    en: Can I help you with anything, sir?
    ko: 옆에 계신 남성분은 괜찮으신가요?
    ja: お隣のお客様も、何かプリントなさいますか？
  d_nikke_snowcrane_04_70:
    speaker: "<Self>"
    en: Uh...
    ko: 음….
    ja: ふむ…
  d_nikke_snowcrane_04_71:
    speaker: "<Monologue>"
    en: Snow Crane stares at her phone with anticipation.
    ko: 백학은, 기대에 찬 눈으로 휴대폰을 바라보고 있었다.
    ja: シラツルは期待に満ちた瞳で私を見つめている
  d_nikke_snowcrane_04_72:
    speaker: "<Monologue>"
    en: I cautiously hold up my phone...
    ko: 나는 조심스레 내 휴대폰을 들어.
    ja: 私は携帯端末を構えると
  d_nikke_snowcrane_04_73:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵-
    ja: カシャッ
  d_nikke_snowcrane_04_74:
    speaker: "<Monologue>"
    en: "... and take a picture of her."
    ko: 그런 백학을 찍었다.
    ja: そんなシラツルを撮影した
  d_nikke_snowcrane_04_75:
    speaker: "<Self>"
    en: Yes, please.
    ko: 네, 제 것도 부탁드릴게요.
    ja: では、こちらをお願いします
  d_nikke_snowcrane_04_76:
    speaker: staff_02
    en: I'll have them ready for you shortly.
    ko: 넵, 금방 해드릴게요.
    ja: はい、すぐにプリントしますね。
  d_nikke_snowcrane_04_77:
    speaker: "<Monologue>"
    en: By the time we received our photos and stepped outside,
    ko: 인화된 사진을 받고, 가게를 나서자.
    ja: |-
      しばらくしてプリントされた写真を
      受け取り、店を後にすると
  d_nikke_snowcrane_04_78:
    speaker: "<Monologue>"
    en: it was growing dark.
    ko: 밖이 어둑해지고 있었다.
    ja: 外はすっかり暗くなっていた
  d_nikke_snowcrane_04_79:
    speaker: "<Self>"
    en: "*Yawn*"
    ko: 하아암….
    ja: ふわぁ…
  d_nikke_snowcrane_04_80:
    speaker: snowcrane
    en: Oh, you must be so tired.
    ko: 어머, 많이 피곤하시죠?
    ja: あらら、ずいぶん疲れたでしょう？
  d_nikke_snowcrane_04_81:
    speaker: "<Self>"
    en: N-no. I'm still doing okay.
    ko: |-
      아, 아냐.
      아직은 괜찮아.
    ja: い、いや。まだ平気だ
  d_nikke_snowcrane_04_82:
    speaker: "<Self>"
    en: We have to go eat our desserts now.
    ko: 이제 디저트 먹으러 가야지.
    ja: 作ったスイーツを食べないと…
  d_nikke_snowcrane_04_83:
    speaker: snowcrane
    en: Hmm...
    ko: 흐으음~
    ja: う～ん。
  d_nikke_snowcrane_04_84:
    speaker: snowcrane
    en: Are you sure you're all right?
    ko: 정말 괜찮은 것 맞죠~?
    ja: 本当に大丈夫なんですか～？
  d_nikke_snowcrane_04_85:
    speaker: "<Self>"
    en: Yes, of course.
    ko: 응, 당연하지.
    ja: ああ、もちろんだ
  d_nikke_snowcrane_04_86:
    speaker: "<Self>"
    en: It's pretty late. Want to go to the Commander's Room?
    ko: 시간이 늦었으니까, 지휘관실로 갈까?
    ja: |-
      もうこんな時間だから、
      指揮官室に行こうか
  d_nikke_snowcrane_04_87:
    speaker: snowcrane
    en: I suppose we have to.
    ko: 어쩔 수 없네요~
    ja: 仕方ありませんね～
  d_nikke_snowcrane_04_88:
    speaker: snowcrane
    en: But if it's too much, be sure to tell me, all right?
    ko: 대신, 힘들면 언제든 말하기에요. 알았죠~?
    ja: |-
      その代わり、疲れた時は教えてくださいね。
      分かりましたか～？
  d_nikke_snowcrane_04_89:
    speaker: "<Self>"
    en: I will.
    ko: 네, 네.
    ja: ああ、分かった
  d_nikke_snowcrane_04_90:
    speaker: "<Monologue>"
    en: I hold my hand out to Snow Crane.
    ko: 나는 백학에게 손을 내밀었다.
    ja: 私はシラツルに手を差し出した
  d_nikke_snowcrane_04_91:
    speaker: snowcrane
    en: Oh.
    ko: 어머.
    ja: あら。
  d_nikke_snowcrane_04_92:
    speaker: snowcrane
    en: You held your hand out first, hehe.
    ko: 먼저 손을 내밀어 주셨네요? 후후.
    ja: 先に手を差し出してくれましたね？ふふ。
  d_nikke_snowcrane_04_93:
    speaker: "<Self>"
    en: Yeah. I don't want you losing your way.
    ko: 응, 길을 잃으면 안 되잖아.
    ja: ああ、迷子になったら困るだろう？
  d_nikke_snowcrane_04_94:
    speaker: "<Self>"
    en: I know the way to the Commander's Room best.
    ko: 지휘관실로 가는 길은 내가 제일 잘 아니까.
    ja: |-
      指揮官室への行き方は、
      私が一番よく知っているからな
  d_nikke_snowcrane_04_95:
    speaker: snowcrane
    en: Hehe, I see.
    ko: 후후~ 그렇네요.
    ja: うふふ、そうですね。
  d_nikke_snowcrane_04_96:
    speaker: snowcrane
    en: Let's go.
    ko: 가요.
    ja: では、行きましょうか。
  d_nikke_snowcrane_04_97:
    speaker: "<Monologue>"
    en: We return to the Commander's Room holding hands.
    ko: 우리는 손을 잡고, 함께 지휘관실로 돌아갔다.
    ja: |-
      私たちは手をつなぎながら、
      ともに指揮官室へ戻った
d_nikke_snowcrane_05:
  d_nikke_snowcrane_05_1:
    speaker: snowcrane
    en: Ta-da! I laid them out on a dessert plate.
    ko: 짠~ 디저트 접시에 올려뒀어요.
    ja: ジャ～ン、スイーツをお皿に盛り付けました。
  d_nikke_snowcrane_05_2:
    speaker: snowcrane
    en: Ready to try them?
    ko: 먹어볼까요?
    ja: さっそく食べてみましょうか？
  d_nikke_snowcrane_05_3:
    speaker: "<Self>"
    en: Before that,
    ko: 그 전에.
    ja: その前に
  d_nikke_snowcrane_05_4:
    speaker: "<Self>"
    en: let's look at our pictures.
    ko: 사진 먼저 보자.
    ja: 先ほどプリントした写真を確認しておこうか
  d_nikke_snowcrane_05_5:
    speaker: "<Monologue>"
    en: I pull two pictures out of an envelope.
    ko: 나는 봉투에서, 사진 2장을 꺼냈다.
    ja: 私は封筒から2枚の写真を取り出した
  d_nikke_snowcrane_05_6:
    speaker: "<Self>"
    en: This is the one you took.
    ko: 이게 백학이 찍은 거.
    ja: これはシラツルが撮った写真
  d_nikke_snowcrane_05_7:
    speaker: snowcrane
    en: Oh my.
    ko: 어머.
    ja: あら。
  d_nikke_snowcrane_05_8:
    speaker: snowcrane
    en: Mm...
    ko: 음….
    ja: うーん…
  d_nikke_snowcrane_05_9:
    speaker: snowcrane
    en: What is this supposed to be a picture of?
    ko: 제가 뭘 찍은 걸까요?
    ja: "…私ったら、何を撮ったんでしょう？"
  d_nikke_snowcrane_05_10:
    speaker: "<Self>"
    en: Beats me...
    ko: 글쎄….
    ja: 何だろうな…
  d_nikke_snowcrane_05_11:
    speaker: "<Monologue>"
    en: Snow Crane's picture is so dynamic you can practically feel it moving.
    ko: |-
      백학이 찍은 사진은, 속도감이 한껏 느껴질 정도로
      역동적으로 찍혔다.
    ja: |-
      シラツルの撮った写真は
      躍動感あふれる仕上がりだった
  d_nikke_snowcrane_05_12:
    speaker: "<Monologue>"
    en: In other words, it was very blurry.
    ko: 즉, 엄청 흔들렸다는 거다.
    ja: つまり、ものすごくブレていた
  d_nikke_snowcrane_05_13:
    speaker: snowcrane
    en: Taking a picture is harder than I thought.
    ko: 사진을 찍는 건 쉬운 일이 아니네요~
    ja: 写真を撮るのって、難しいんですね～
  d_nikke_snowcrane_05_14:
    speaker: snowcrane
    en: What picture did you print?
    ko: 친구는 어떤 사진을 인화했어요?
    ja: おともだちは、どんな写真を現像したんですか？
  d_nikke_snowcrane_05_15:
    speaker: "<Narration>"
    en: "*Flap*"
    ko: 팔랑.
    ja: パラッ
  d_nikke_snowcrane_05_16:
    speaker: snowcrane
    en: Oh my.
    ko: 어머나.
    ja: まあ。
  d_nikke_snowcrane_05_17:
    speaker: snowcrane
    en: It's me!
    ko: 이건… 저네요!
    ja: これは…私ですね！
  d_nikke_snowcrane_05_18:
    speaker: snowcrane
    en: When did you take this?
    ko: 언제 찍으신 거예요?
    ja: いつの間に撮っていたんですか？
  d_nikke_snowcrane_05_19:
    speaker: "<Self>"
    en: You just looked so cute while you were waiting for your file— I mean, your
      film to be processed.
    ko: 아까 출력… 아니, 인화하기 직전에 표정이 너무 귀여워서.
    ja: |-
      先ほどの写真をプリント…いや、現像する
      直前の表情がかわいくて撮ったんだ
  d_nikke_snowcrane_05_20:
    speaker: snowcrane
    en: Hehe, you're the first person to ever call me cute.
    ko: 후후~ 저를 귀엽다고 해주시는 분은 처음이네요.
    ja: |-
      うふふっ。私のことをかわいいと
      言ってくださった子は初めてです。
  d_nikke_snowcrane_05_21:
    speaker: snowcrane
    en: It's so clear. There's no blur at all. You did a wonderful job.
    ko: |-
      선명하고, 흔들리지도 않고.
      정말 잘 찍으셨네요~
    ja: |-
      ブレずに鮮明に写っていますね～
      とっても上手に撮れましたね～
  d_nikke_snowcrane_05_22:
    speaker: snowcrane
    en: There's nothing my friend can't do!
    ko: 우리 친구는, 못 하는 게 없다니까요~
    ja: おともだちは、何でもできちゃうんですね～
  d_nikke_snowcrane_05_23:
    speaker: snowcrane
    en: "*Pat pat*"
    ko: 쓰담쓰담~
    ja: なでなで～
  d_nikke_snowcrane_05_24:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_05_25:
    speaker: snowcrane
    en: Well, I wanted to have a picture that I could look at whenever I wanted.
    ko: |-
      아무튼, 사진을 남겨서
      생각날 때마다 보고 싶었는데.
    ja: |-
      でも、写真を残しておけば思い出すたびに
      いつでも見られると思ったのに、
  d_nikke_snowcrane_05_26:
    speaker: snowcrane
    en: That's too bad.
    ko: 아쉽네요~
    ja: 残念ですね～
  d_nikke_snowcrane_05_27:
    speaker: "<Self>"
    en: Can I see your phone?
    ko: 잠시 휴대폰 좀 줘볼래?
    ja: 少し携帯を貸してくれるか？
  d_nikke_snowcrane_05_28:
    speaker: snowcrane
    en: Huh?
    ko: 네?
    ja: はい？
  d_nikke_snowcrane_05_29:
    speaker: snowcrane
    en: Here you go.
    ko: 네, 여기 있어요.
    ja: ええ、いいですよ～
  d_nikke_snowcrane_05_30:
    speaker: "<Monologue>"
    en: I open the album on Snow Crane's phone.
    ko: 나는 백학의 휴대폰 안에 있는 앨범으로 들어갔다.
    ja: |-
      私はシラツルの携帯端末の
      写真アルバムを開いた
  d_nikke_snowcrane_05_31:
    speaker: "<Self>"
    en: Actually, you can see your pictures on your phone too.
    ko: 사실, 이렇게 휴대폰 안에서도 볼 수 있어.
    ja: ここを開くと、携帯でも見ることができる
  d_nikke_snowcrane_05_32:
    speaker: snowcrane
    en: My word.
    ko: 세상에.
    ja: まあ…！
  d_nikke_snowcrane_05_33:
    speaker: snowcrane
    en: The picture I took earlier is right there!
    ko: 아까 찍은 사진이, 이 안에도 있네요!
    ja: あら、さっき撮った写真もありますね！
  d_nikke_snowcrane_05_34:
    speaker: snowcrane
    en: You mean I can take a picture whenever and look at it here?
    ko: 그러면 언제든 사진을 찍고, 여기서 볼 수 있다는 건가요?
    ja: |-
      では、携帯で写真を撮ったら
      いつでも見られるということですか？
  d_nikke_snowcrane_05_35:
    speaker: snowcrane
    en: A-as long as I have my phone?
    ko: 이, 이 휴대폰만 있으면?
    ja: こ、この携帯さえあれば？
  d_nikke_snowcrane_05_36:
    speaker: "<Self>"
    en: Yep.
    ko: 맞아.
    ja: そうだ
  d_nikke_snowcrane_05_37:
    speaker: snowcrane
    en: Oh my word...
    ko: 어머나….
    ja: あらまあ…
  d_nikke_snowcrane_05_38:
    speaker: snowcrane
    en: Why did you take me to the print shop instead of telling me about this sooner?
    ko: |-
      왜 이 기능을 알려주지 않고,
      바로 인화하러 가신 건가요?
    ja: |-
      でも、どうしてこの機能をナイショにして、
      現像しに行ったんですか？
  d_nikke_snowcrane_05_39:
    speaker: "<Self>"
    en: I mean... I thought you'd like this better.
    ko: 뭐랄까, 그쪽을 더 좋아할 것 같아서.
    ja: そのほうが気に入ると思ったんだ
  d_nikke_snowcrane_05_40:
    speaker: "<Self>"
    en: You have the real thing, and you can display it somewhere. It's very useful.
    ko: |-
      실물도 있고, 어디 붙여놓을 수도 있고.
      유용하잖아.
    ja: |-
      プリントした写真があれば、どこかに
      貼ったりもできて便利だろう？
  d_nikke_snowcrane_05_41:
    speaker: snowcrane
    en: Hmm... That's true.
    ko: 음~ 확실히 그렇네요.
    ja: う～ん、確かにそうですね。
  d_nikke_snowcrane_05_42:
    speaker: snowcrane
    en: You know me very well, my friend.
    ko: 우리 친구, 제 취향을 너무 잘 아는데요~?
    ja: |-
      ふふ。おともだちは、私の好みを
      よーく分かってるんですね～？
  d_nikke_snowcrane_05_43:
    speaker: snowcrane
    en: But this picture won't do. You can't even tell what anything is.
    ko: |-
      하지만, 이 사진은 안 돼요.
      뭐가 뭔지 하나도 못 알아볼 테니까요.
    ja: |-
      でも、この写真は失敗です。
      これでは何の写真かまったく分かりませんので。
  d_nikke_snowcrane_05_44:
    speaker: snowcrane
    en: Would you mind if I tried taking more pictures?
    ko: |-
      그래서 그런데요.
      저, 사진을 좀 더 찍어봐도 될까요…?
    ja: |-
      そこでなんですが、
      もう少し写真を撮ってもいいですか…？
  d_nikke_snowcrane_05_45:
    speaker: snowcrane
    en: There's one I've been wanting to take.
    ko: 사실, 꼭 찍고 싶었던 사진이 있거든요.
    ja: 実は、どうしても撮りたい写真があるんです。
  d_nikke_snowcrane_05_46:
    speaker: "<Self>"
    en: What is it?
    ko: 어떤 사진인데?
    ja: どんな写真だ？
  d_nikke_snowcrane_05_47:
    speaker: snowcrane
    en: Hehe, I'll get some practice and let you know when I get good at it.
    ko: 후후, 연습해서 어느 정도 잘 찍게 되면 말씀드릴게요.
    ja: |-
      ふふ、練習して
      うまく撮れるようになったら教えますね。
  d_nikke_snowcrane_05_48:
    speaker: snowcrane
    en: I'll figure it out quickly, so wait just a second!
    ko: 금방 익숙해질 테니 잠시만 기다려보세요~!
    ja: |-
      すぐに慣れると思うので、
      ちょっと待っててくださいね～！
  d_nikke_snowcrane_05_49:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵-
    ja: カシャッ
  d_nikke_snowcrane_05_50:
    speaker: snowcrane
    en: I... have to keep my hands from shaking.
    ko: 손을… 최대한 떨지 않고~
    ja: 手を…なるべく動かさないようにして～
  d_nikke_snowcrane_05_51:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵-
    ja: カシャッ
  d_nikke_snowcrane_05_52:
    speaker: snowcrane
    en: Hmm, why is it so blurry?
    ko: 으음, 왜 이렇게 흐리게 나오는 걸까….
    ja: う～ん、どうしてこんなにぼやけるのでしょう…
  d_nikke_snowcrane_05_53:
    speaker: snowcrane
    en: Oh, suddenly it got so clear.
    ko: 어머. 갑자기 선명해졌어요.
    ja: あら、急に鮮明になりました。
  d_nikke_snowcrane_05_54:
    speaker: snowcrane
    en: Auto focus...?
    ko: 자동 초점…?
    ja: ええと…自動補正…？
  d_nikke_snowcrane_05_55:
    speaker: snowcrane
    en: Oho...
    ko: 오호~
    ja: へえ～
  d_nikke_snowcrane_05_56:
    speaker: "<Narration>"
    en: "*Click, click*"
    ko: 찰칵- 찰칵-
    ja: カシャ、カシャ
  d_nikke_snowcrane_05_57:
    speaker: "<Monologue>"
    en: Snow Crane's photo shoot goes on longer and longer.
    ko: 백학의 사진 찍는 시간이 점점 길어지고.
    ja: シラツルの写真撮影の時間は予想以上に長引き…
  d_nikke_snowcrane_05_58:
    speaker: "<Monologue>"
    en: My days of exhaustion catch up to me, and my eyes slowly start to close.
    ko: 요 며칠 계속 피곤했던 나는, 점점 눈이 감기기 시작한다.
    ja: |-
      ここ数日疲れがたまっていた私は、
      次第にまぶたが重くなってきた
  d_nikke_snowcrane_05_59:
    speaker: "<Self>"
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_05_60:
    speaker: snowcrane
    en: Ah!
    ko: 아~!
    ja: あぁ～！
  d_nikke_snowcrane_05_61:
    speaker: snowcrane
    en: It came out clear and not shaky. I got it!
    ko: |-
      흔들리지도 않았고, 선명하고.
      됐어요…!
    ja: |-
      ブレてない鮮明な写真。
      ようやく撮れました…！
  d_nikke_snowcrane_05_62:
    speaker: snowcrane
    en: Friend, I finally learned how to take—
    ko: 친구, 저 이제 사진 잘 찍-
    ja: おともだち、やっと上手に…
  d_nikke_snowcrane_05_63:
    speaker: snowcrane
    en: Oh.
    ko: 어머.
    ja: あら。
  d_nikke_snowcrane_05_64:
    speaker: "<Self>"
    en: "*Snore*"
    ko: 쿨-
    ja: ぐう…
  d_nikke_snowcrane_05_65:
    speaker: snowcrane
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_snowcrane_05_66:
    speaker: snowcrane
    en: I'm sorry. You didn't get any rest because of me.
    ko: "…미안해요, 저 때문에 쉬지도 못하고."
    ja: |-
      …ごめんなさい。
      私のせいで休めなかったですよね。
  d_nikke_snowcrane_05_67:
    speaker: "<Monologue>"
    en: In my sleep, I felt someone gently stroking my hair.
    ko: 잠결에, 누군가가 부드럽게 머리를 쓸어주는 것을 느꼈다.
    ja: |-
      ウトウトしていると、誰かが
      優しく頭をなでているのを感じた
  d_nikke_snowcrane_05_68:
    speaker: snowcrane
    en: I missed you so much, and I just happened to have the perfect excuse.
    ko: 너무 보고 싶었는데, 마침 좋은 핑계가 있었거든요.
    ja: |-
      …会いたいなぁと思っていた時に、
      ちょうどいい口実を見つけてしまって。
  d_nikke_snowcrane_05_69:
    speaker: "<Narration>"
    en: Snow Crane stares at the dessert lying abandoned on my desk.
    ko: 백학은 덩그러니 책상에 놓인 디저트를 바라보았다.
    ja: |-
      シラツルは、テーブルにぽつんと置かれた
      スイーツを見つめた
  d_nikke_snowcrane_05_70:
    speaker: snowcrane
    en: You always work so hard.
    ko: 늘 고생이 많아요.
    ja: いつもご苦労様です。
  d_nikke_snowcrane_05_71:
    speaker: snowcrane
    en: I'll just take one picture and let you get some sleep.
    ko: 그러니까 한 장만 찍어갈게요.
    ja: 最後に1枚だけ、撮らせてくださいね。
  d_nikke_snowcrane_05_72:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 찰칵-
    ja: カシャッ
  d_nikke_snowcrane_05_73:
    speaker: snowcrane
    en: Well, my friend.
    ko: 음~ 우리 친구.
    ja: ふふっ、おともだちったら。
  d_nikke_snowcrane_05_74:
    speaker: snowcrane
    en: You look very handsome even when you're sleeping.
    ko: 졸고 있는 모습도 참 멋있네요.
    ja: 寝ている姿もとっても素敵ですね。
  d_nikke_snowcrane_05_75:
    speaker: snowcrane
    en: This will be enough to last me till next time.
    ko: 이거면 버틸 수 있겠어요~
    ja: これがあれば、しばらく耐えられそうです～
  d_nikke_snowcrane_05_76:
    speaker: "<Monologue>"
    en: My body grows lighter...
    ko: 몸이 가벼워지고.
    ja: 突然、体が軽くなり
  d_nikke_snowcrane_05_77:
    speaker: "<Narration>"
    en: "*Slide*"
    ko: 스윽-
    ja: スッ――
  d_nikke_snowcrane_05_78:
    speaker: "<Monologue>"
    en: "...and I feel a familiar bed against my back."
    ko: 등에 익숙한 침대가 닿는 것을 느낀다.
    ja: 背中に慣れ親しんだベッドの感触を覚えた
  d_nikke_snowcrane_05_79:
    speaker: "<Narration>"
    en: "*Smooch*"
    ko: 쪽-
    ja: チュッ…
  d_nikke_snowcrane_05_80:
    speaker: "<Monologue>"
    en: I feel something warm on my forehead.
    ko: 이마에 따뜻한 감촉이 느껴진다.
    ja: 額にあたたかい何かが触れた
  d_nikke_snowcrane_05_81:
    speaker: snowcrane
    en: Thanks for all you taught me today.
    ko: 오늘, 많은 걸 알려주셔서 감사했어요.
    ja: |-
      …今日は、色んなことを教えてくださり
      ありがとうございました。
  d_nikke_snowcrane_05_82:
    speaker: snowcrane
    en: See you again, my friend. Have a good night.
    ko: |-
      우리 친구, 또 만나요~
      즐거운 밤 되세요~
    ja: |-
      また会いましょうね。
      素敵な夜を～
  d_nikke_snowcrane_05_83:
    speaker: "<Monologue>"
    en: I fall into a deep, dreamless sleep.
    ko: 나는 꿈도 꾸지 않고, 아주 깊은 잠을 잤고.
    ja: |-
      その後、夢すら見ることなく
      深い眠りについた私は…
  d_nikke_snowcrane_05_84:
    speaker: "<Monologue>"
    en: The next day, I only wake up in the afternoon.
    ko: 다음 날, 오후가 됐을 때 겨우 일어날 수 있었다.
    ja: 翌日の午後にようやく体を起こした
  d_nikke_snowcrane_05_85:
    speaker: "<Self>"
    en: Ah... I overslept.
    ko: 아… 너무 잤다.
    ja: はあ…寝すぎたな
  d_nikke_snowcrane_05_86:
    speaker: "<Monologue>"
    en: It hurts my heart to think of all the work I have left, but I feel refreshed
      after sleeping so deeply.
    ko: |-
      일이 밀린 만큼 마음은 아팠지만,
      푹 자서 몸은 너무나 가벼웠다.
    ja: |-
      まだ仕事がたまっていると思うと
      気が重たかったが、ぐっすり寝たおかげか
      体はすっかり軽くなっていた
  d_nikke_snowcrane_05_87:
    speaker: "<Self>"
    en: I should message Snow Crane and apologize for—
    ko: 백학한테도 미안하다고 연락을 해야….
    ja: シラツルに謝罪の連絡もしないと…
  d_nikke_snowcrane_05_88:
    speaker: "<Monologue>"
    en: When I get out of bed,
    ko: 침대에서 일어난 나는.
    ja: ベッドから起き上がった私は
  d_nikke_snowcrane_05_89:
    speaker: "<Monologue>"
    en: I discover a small box and a piece of paper on my desk.
    ko: 책상에 올려진 작은 상자와, 종이 한 장을 발견했다.
    ja: |-
      テーブルの上に小さな箱と1枚の紙が
      置かれていることに気づいた
  d_nikke_snowcrane_05_90:
    speaker: "<Self>"
    en: What's this?
    ko: 이게 뭐지?
    ja: 何だろう？
  d_nikke_snowcrane_05_91:
    speaker: "<Narration>"
    en: "*Rustle*"
    ko: 부스럭-
    ja: ゴソゴソ…
  d_nikke_snowcrane_05_92:
    speaker: "<Monologue>"
    en: When I open the box, I find the desserts we never got to eat last night.
    ko: 상자를 열어보자, 어제 미처 먹지 못했던 디저트가 있었다.
    ja: |-
      箱を開けると、昨日テイクアウトした
      スイーツが入っていた
  d_nikke_snowcrane_05_93:
    speaker: "<Self>"
    en: Or wait... The shape is a bit different.
    ko: 아닌가? 모양이 조금… 다른 것 같은데.
    ja: "…いや、形が少し違う気がするな"
  d_nikke_snowcrane_05_94:
    speaker: "<Monologue>"
    en: There's a note written on the piece of paper.
    ko: 옆에 있는 종이에는 메모가 쓰여있다.
    ja: |-
      横にあった紙に視線を移すと、
      そこにはメモが残されていた
  d_nikke_snowcrane_05_95:
    speaker: "<Narration>"
    en: '"While I went to get my film processed, I got yours done as well. Didn''t
      it turn out great?"'
    ko: |-
      [제 것 인화하는 김에, 친구 것도 해뒀어요.
      아주 잘 나왔죠?]
    ja: |-
      「私の写真を現像するついでに、
      おともだちの写真も現像しました。
      すごくいい写真でしょう？」
  d_nikke_snowcrane_05_96:
    speaker: "<Narration>"
    en: '"I thought our desserts might not be good on day two, so I made new ones."'
    ko: |-
      [그리고, 디저트는 하루 지나서 상했을 수도 있으니까
      제가 다시 만들어서 올려놨어요.]
    ja: |-
      「あと、スイーツは1日経ったら
      悪くなっているかもしれなかったので、
      私が改めて作ったものを置いておきました」
  d_nikke_snowcrane_05_97:
    speaker: "<Narration>"
    en: '"I put even more healthy ingredients in, so I hope they taste good."'
    ko: |-
      [건강한 재료들을 좀 더 넣어봤는데,
      맛있었으면 좋겠네요.]
    ja: |-
      「体にいい材料を少し足してみました。
      お口に合うといいんですが」
  d_nikke_snowcrane_05_98:
    speaker: "<Narration>"
    en: '"See you next time! That''s a promise!"'
    ko: "[그럼 또 만나요~ 약속!]"
    ja: |-
      「それでは、また会いましょうね。
      約束ですよ～！」
  d_nikke_snowcrane_05_99:
    speaker: "<Self>"
    en: A photo?
    ko: 사진?
    ja: 写真…？
  d_nikke_snowcrane_05_100:
    speaker: "<Monologue>"
    en: When I turn the piece of paper around, I see a picture of me sleeping with
      my head resting in my hand.
    ko: 종이를 뒤집자, 턱을 괴고 앉아서 자고 있는 나의 사진이 보였다.
    ja: |-
      紙を裏返すと、頬杖をついたまま
      眠っている私の姿が写っていた
  d_nikke_snowcrane_05_101:
    speaker: "<Self>"
    en: She really went to get her film processed.
    ko: 결국 인화했네.
    ja: 自分でプリントできたんだな
  d_nikke_snowcrane_05_102:
    speaker: "<Self>"
    en: She made new desserts too.
    ko: 그리고, 결국 또 새로 만들었네.
    ja: スイーツもまた作り直したのか
  d_nikke_snowcrane_05_103:
    speaker: "<Monologue>"
    en: I shake my head and take a bite.
    ko: 못 말린다는 생각을 하며, 디저트를 한 입 베어 물었다.
    ja: |-
      困ったものだと思いながら、
      スイーツを一口ほおばった
  d_nikke_snowcrane_05_104:
    speaker: "<Monologue>"
    en: It's bitter but still pretty sweet.
    ko: 썼지만, 그래도 제법 달았다.
    ja: |-
      味はやはり苦かったが、
      思ったよりもだいぶ甘かった
  d_nikke_snowcrane_05_105:
    speaker: "<Self>"
    en: I think I see the way out now.
    ko: 이제야 길이 좀 보이네.
    ja: "…やっと少し、ゴールが見えてきた気がするな"
  d_nikke_snowcrane_05_106:
    speaker: "<Self>"
    en: Time to get back to work.
    ko: 밀린 일처리를 시작해볼까?
    ja: さて、たまっている仕事を片付けるとするか
