---
d_nikke_ce009_03_01:
  d_nikke_ce009_03_01_1:
    speaker: "<Narration>"
    en: After temporarily parting ways with the group, Aigis strolls through the Ark,
      reviewing the data the Commander gave her.
    ko: |-
      일행과 잠시 헤어진 아이기스는
      지휘관에게 받은 데이터를 보며 방주를 산책하고 있었다.
    ja: |-
      仲間たちとしばし
      別行動することになったアイギスは、
      指揮官に教えてもらったデータを参照しながら
      アークを散策していた
  d_nikke_ce009_03_01_2:
    speaker: "<Narration>"
    en: She's visited quite a few places already, but with today likely to be her
      last day here, she finds herself wondering where to go next.
    ko: |-
      여러 곳을 견학했지만, 아마 오늘이 마지막 날이 될 것이기에
      아이기스는 마지막으로 어디를 갈지 생각하고 있다.
    ja: |-
      いろいろな場所を見学してきたが
      今日が恐らく最後の日になるため、
      アイギスは最後にどこに行くか考えている
  d_nikke_ce009_03_01_3:
    speaker: "<Narration>"
    en: Around her, the streets hum with the chatter of the crowd.
    ko: 웅성웅성-
    ja: ザワザワ――
  d_nikke_ce009_03_01_4:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_01_5:
    speaker: ce009_03
    en: Excuse me. May I ask you a question?
    ko: |-
      실례합니다.
      질문을 드려도 괜찮겠습니까?
    ja: |-
      すみません。
      質問をさせていただいてもよろしいでしょうか？
  d_nikke_ce009_03_01_6:
    speaker: femaleguest
    en: Yes?
    ko: 네?
    ja: はい？
  d_nikke_ce009_03_01_7:
    speaker: ce009_03
    en: The population density in this area is abnormally high.
    ko: 이 장소의 인구 밀도가 비정상적으로 높습니다.
    ja: この場所の人口密度が異常に高くなっています。
  d_nikke_ce009_03_01_8:
    speaker: ce009_03
    en: Is there something here that causes the citizens of the Ark to gather?
    ko: 이곳에 방주 시민들을 멈춰 세우는 무언가가 있는 겁니까?
    ja: |-
      アーク市民の皆さんが
      立ち止まってしまうような何かが、
      この場所にある…ということでしょうか？
  d_nikke_ce009_03_01_9:
    speaker: femaleguest
    en: Oh, that?
    ko: 아아, 그거라면….
    ja: ああ、それでしたら…
  d_nikke_ce009_03_01_10:
    speaker: femaleguest
    en: It's probably because of this.
    ko: 이것 때문일 거예요.
    ja: きっと、これですね。
  d_nikke_ce009_03_01_11:
    speaker: "<Narration>"
    en: She pulls something long out of the plastic bag.
    ko: 봉투에서 기다란 무언가를 꺼내 든다.
    ja: 女性は袋から細長い何かを取り出した
  d_nikke_ce009_03_01_12:
    speaker: femaleguest
    en: It's the candy-flavored shish kebab that's all over social media!
    ko: 요즘 SNS에서 대유행하는 사탕 맛 꼬치!
    ja: |-
      最近SNSで話題になっている、
      串焼きキャンディです！
  d_nikke_ce009_03_01_13:
    speaker: ce009_03
    en: A candy-flavored shish kebab?
    ko: 사탕 맛 꼬치.
    ja: 串焼きキャンディ、でありますか？
  d_nikke_ce009_03_01_14:
    speaker: ce009_03
    en: According to my database, shish kebabs typically consist of meat, vegetables,
      or other ingredients grilled over an open flame.
    ko: |-
      제가 아는 꼬치구이란,
      고기나 채소 등을 꼬치에 꽂아 바비큐를 할 때 먹는 음식입니다.
    ja: |-
      わたしの知る限り、串焼きとは塩やタレなどで
      味付けをされた鶏肉や、野菜などを串に刺した
      バーベキューなどに出てくる料理。
  d_nikke_ce009_03_01_15:
    speaker: ce009_03
    en: Candy is a sweet confection. Combining the two would produce a rather unusual
      dish.
    ko: |-
      그리고 사탕은 매우 달콤한 과자입니다.
      이 둘이 합쳐진다면 상당히 난이도 높은 음식이 탄생하겠군요.
    ja: |-
      一方でキャンディは、とても甘いお菓子です。
      この2つが合体すると
      一般常識的に考えるとかなり難易度の
      高い食べ物が生まれると考えられますが…
  d_nikke_ce009_03_01_16:
    speaker: femaleguest
    en: Haha, I know, right? But it's still incredibly popular!
    ko: |-
      아하하, 그렇죠?
      그런데도 정말 인기 있는 음식이에요!
    ja: |-
      あはは、そうでしょう？
      でも、すごく人気の食べ物なんですよ！
  d_nikke_ce009_03_01_17:
    speaker: femaleguest
    en: If you want some too, you'd better get in line soon.
    ko: 그쪽도 원하시면 빨리 줄 서는 게 좋을 거예요.
    ja: 食べたいなら、早く並んだほうがいいですよ。
  d_nikke_ce009_03_01_18:
    speaker: femaleguest
    en: I couldn't get any before, but I finally managed to get some today!
    ko: 저도 전혀 살 수가 없었는데, 드디어 오늘 구할 수 있었답니다.
    ja: |-
      私も全然買えなくて、
      今日やっと手に入ったんです。
  d_nikke_ce009_03_01_19:
    speaker: ce009_03
    en: Is this dish exclusive to the Ark?
    ko: 방주를 제외한 어디에서도 맛볼 수 없는 겁니까?
    ja: アーク以外では食べられないものですか？
  d_nikke_ce009_03_01_20:
    speaker: femaleguest
    en: Yes, absolutely!
    ko: 네, 그럼요!
    ja: もちろんです！
  d_nikke_ce009_03_01_21:
    speaker: ce009_03
    en: Thank you for the information.
    ko: 정보 제공에 감사드리는 바입니다.
    ja: |-
      ありがとうございます。
      情報提供、感謝するであります。
  d_nikke_ce009_03_01_22:
    speaker: ce009_03
    en: Candy-flavored shish kebabs... I have determined that they may aid in gathering
      information about the Ark.
    ko: |-
      사탕 맛 꼬치…
      방주의 정보를 얻기 위해 도움이 될 수 있는 체험으로 판단했습니다.
    ja: |-
      串焼きキャンディ…アークの情報を得るための、
      有力な体験と判断しました。
  d_nikke_ce009_03_01_23:
    speaker: ce009_03
    en: I would like to acquire one.
    ko: 꼭 입수하고 싶군요.
    ja: 是非、入手したいものであります。
  d_nikke_ce009_03_01_24:
    speaker: "<Narration>"
    en: Aigis takes her place at the end of the long line.
    ko: 아이기스는 기나긴 줄의 마지막에 자리 잡았다.
    ja: アイギスは行列の最後尾に並んだ
  d_nikke_ce009_03_01_25:
    speaker: ce009_03
    en: I've been waiting in line for an hour. At last, it's my turn.
    ko: 줄을 서기 시작한 지 1시간… 드디어 제 차례로군요.
    ja: |-
      並び始めてから1時間…
      ようやくわたしの順番でありますね。
  d_nikke_ce009_03_01_26:
    speaker: ce009_03
    en: One candy-flavored shish kebab, please.
    ko: 사탕 맛 꼬치 1개 부탁드리겠습니다.
    ja: 串焼きキャンディを1点、お願いします。
  d_nikke_ce009_03_01_27:
    speaker: employee
    en: Er, ma'am...
    ko: 아, 손님….
    ja: あの、お客様…
  d_nikke_ce009_03_01_28:
    speaker: ce009_03
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_03_01_29:
    speaker: ce009_03
    en: You seem troubled. Is something the matter?
    ko: |-
      곤란한 표정을 짓고 계시는군요.
      무슨 문제가 생긴 겁니까?
    ja: |-
      困ったような表情をしていらっしゃいますね。
      何か問題が起きたのでありますか？
  d_nikke_ce009_03_01_30:
    speaker: employee
    en: I'm so sorry,
    ko: 그게… 죄송해서 어쩌죠.
    ja: それが…大変申し訳ございません。
  d_nikke_ce009_03_01_31:
    speaker: employee
    en: but we just sold our last candy-flavored kebab.
    ko: 방금 재고가 딱 떨어진 상태라서요.
    ja: たった今、品切れになってしまいまして。
  d_nikke_ce009_03_01_32:
    speaker: ce009_03
    en: "... I see, so that was the situation."
    ko: "…그렇군요. 그런 사정이었습니까."
    ja: "…なるほど、そういうことですか。"
  d_nikke_ce009_03_01_33:
    speaker: employee
    en: You must've been waiting in line for a while. I'm sorry about that.
    ko: 오래 기다리셨을 텐데 죄송합니다.
    ja: |-
      ずっとお待ちいただいておりましたのに、
      申し訳ございません。
  d_nikke_ce009_03_01_34:
    speaker: rei
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_03_01_35:
    speaker: ce009_03
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_ce009_03_01_36:
    speaker: rei
    en: "*Gulp...*"
    ko: 뜨, 뜨끔….
    ja: ド、ドキッ…
  d_nikke_ce009_03_01_37:
    speaker: "<Narration>"
    en: Rei hastily hides the kebab behind her back before Aigis notices it.
    ko: 아이기스의 시선이 닿기 전, 라이는 급하게 꼬치를 뒤로 숨긴다.
    ja: |-
      アイギスに気づかれる前に、
      ライはあわてて串を背後に隠した
  d_nikke_ce009_03_01_38:
    speaker: ce009_03
    en: I have heard that they are so popular that someone spent several days trying
      to buy one.
    ko: |-
      인기가 아주 많다고 들었습니다.
      제가 들은 이야기론 사는데 며칠이나 걸린 분이 있다고….
    ja: |-
      とても人気と伺いました。
      わたしが話を聞いた方は、
      買うのに数日かかったと…
  d_nikke_ce009_03_01_39:
    speaker: ce009_03
    en: In that case, I suppose it can't be helped. Thank you for explaining the situation.
    ko: 그렇다면 어쩔 수 없는 일이군요. 설명해 주셔서 감사합니다.
    ja: |-
      であれば仕方のないことです。
      ご説明いただき、感謝いたします。
  d_nikke_ce009_03_01_40:
    speaker: rei
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_01_41:
    speaker: rei
    en: "*Nom, nom...*"
    ko: 오물오물….
    ja: もぐもぐ…
  d_nikke_ce009_03_01_42:
    speaker: rei
    en: Hehe... there's nothing better than a snack before school.
    ko: 흐흥~ 역시 군것질은 등교 전에 해줘야 제맛이라니까.
    ja: |-
      う～ん、やっぱり買い食いするなら
      登校前が一番だね。
  d_nikke_ce009_03_01_43:
    speaker: rei
    en: Okay, one more bite! Aaah!
    ko: 이 기세를 몰아 한입 더! 아아앙~
    ja: もう一口行っちゃお！あ～ん…
  d_nikke_ce009_03_01_44:
    speaker: rei
    en: "?!"
    ko: "?!"
    ja: "！？"
  d_nikke_ce009_03_01_45:
    speaker: rei
    en: H-huh?! There's only one piece left...
    ko: 머, 먹다 보니 한 조각 밖에 안 남았다….
    ja: い、いつの間にかもう一口分しか残ってない…
  d_nikke_ce009_03_01_46:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_01_47:
    speaker: rei
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_03_01_48:
    speaker: rei
    en: You're the one from earlier...
    ko: 너는 아까 그….
    ja: あなたはさっきの…
  d_nikke_ce009_03_01_49:
    speaker: ce009_03
    en: Yes, that's correct.
    ko: 예, 맞습니다.
    ja: はい、その通りです。
  d_nikke_ce009_03_01_50:
    speaker: ce009_03
    en: We meet again.
    ko: 또 만났군요.
    ja: またお会いしましたね。
  d_nikke_ce009_03_01_51:
    speaker: rei
    en: "... You're not still after the kebab, are you?"
    ko: "…설마 꼬치에 미련이 남은 거야?"
    ja: "…まさか、この串を狙ってるの？"
  d_nikke_ce009_03_01_52:
    speaker: rei
    en: Hmph! You can give me those puppy eyes all you want, but I'm not giving you
      any!
    ko: 흥, 그렇게 쳐다봐도 안 줄 거거든?!
    ja: |-
      ふんっ。そんなふうに見たって
      あげないよ！？
  d_nikke_ce009_03_01_53:
    speaker: rei
    en: I'm saving the rest for Ein and Zwei!
    ko: 남은 건 아인이랑 츠바이 거니까!
    ja: こっちの2本は、アインとツバイの分だから！
  d_nikke_ce009_03_01_54:
    speaker: ce009_03
    en: No, that wasn't my intention.
    ko: |-
      아닙니다, 그런 의도는 없습니다.
      제가 당신을 본 이유는….
    ja: |-
      いえ、そのような意図はありません。
      わたしがあなたを見ていたのは…
  d_nikke_ce009_03_01_55:
    speaker: ce009_03
    en: I was merely observing your reaction as you ate in order to imagine what it
      tastes like.
    ko: |-
      당신이 먹는 리액션을 보고,
      어떤 맛인지 상상해 내는 중이었습니다.
    ja: |-
      あなたが串焼きキャンディを
      食べるリアクションから、
      どんな味なのか、想像をしていたのであります。
  d_nikke_ce009_03_01_56:
    speaker: rei
    en: "... You want it that badly?"
    ko: "…그렇게나 먹고 싶은 거야?"
    ja: "…そんなに食べたいの？"
  d_nikke_ce009_03_01_57:
    speaker: ce009_03
    en: To be honest, I'm not sure I'd go that far.
    ko: |-
      [그렇게나] 인지 아닌지는,
      솔직히 말씀드리자면 잘 모르겠습니다만….
    ja: |-
      「そんなに」というほどかどうかは、
      実を言うと、わたしにもわかりかねますが…
  d_nikke_ce009_03_01_58:
    speaker: ce009_03
    en: However, it is true that my curiosity has been piqued.
    ko: 호기심이 동하는 것은 사실입니다.
    ja: 好奇心がくすぐられるのは確かです。
  d_nikke_ce009_03_01_59:
    speaker: rei
    en: "... Really?"
    ko: "…그래?"
    ja: "…そう？"
  d_nikke_ce009_03_01_60:
    speaker: rei
    en: Okay... then here you go!
    ko: 그렇다면… 자 여기!
    ja: う～ん…じゃあ、これ！
  d_nikke_ce009_03_01_61:
    speaker: "<Narration>"
    en: Rei holds out the last remaining piece to Aigis.
    ko: 라이가 마지막 남은 한 조각을 내밀었다.
    ja: ライは最後の1ピースを差し出した
  d_nikke_ce009_03_01_62:
    speaker: ce009_03
    en: Are you certain? You purchased this for yourself...
    ko: 괜찮으시겠습니까? 이건 당신이 구매한….
    ja: よろしいのですか？これはあなたが購入された…
  d_nikke_ce009_03_01_63:
    speaker: rei
    en: I'm a senior, so I can share!
    ko: 난 3학년이니까, 이 정도쯤은 양보할 수 있어!
    ja: |-
      私は3年生だから、
      これくらい譲ってあげられるもん！
  d_nikke_ce009_03_01_64:
    speaker: rei
    en: Even if it's my last piece!
    ko: 그게 마지막 한 조각이라도 말이야.
    ja: それがたとえ、最後の一口分だとしても…
  d_nikke_ce009_03_01_65:
    speaker: ce009_03
    en: Thank you.
    ko: 감사드립니다.
    ja: ありがとうございます。
  d_nikke_ce009_03_01_66:
    speaker: "<Narration>"
    en: "*Munch*"
    ko: 우물-
    ja: もぐもぐ…
  d_nikke_ce009_03_01_67:
    speaker: ce009_03
    en: A flavor unique to the Ark... It defies simple description.
    ko: "…방주에서만 느낄 수 있는 맛은 오묘한 맛."
    ja: "…アークでしか体験できない、奥深い味わい。"
  d_nikke_ce009_03_01_68:
    speaker: ce009_03
    en: Database updated.
    ko: 데이터베이스에 등록해 두겠습니다.
    ja: データベースに登録しておきます。
  d_nikke_ce009_03_01_69:
    speaker: rei
    en: "... Database?"
    ko: "…데이터베이스?"
    ja: "…データベース？"
  d_nikke_ce009_03_01_70:
    speaker: rei
    en: C-come to think of it, there's something kinda different about you...
    ko: 그, 그러고 보니 생긴 것도 그렇고 뭔가 다른 거 같은데….
    ja: そ、そういえば、見た目がなにか違うような…
  d_nikke_ce009_03_01_71:
    speaker: rei
    en: You're... not a Nikke, are you?
    ko: 너… 혹시 니케가 아닌 거야?
    ja: あなた…もしかしてニケじゃないの？
  d_nikke_ce009_03_01_72:
    speaker: ce009_03
    en: Correct, I am not a Nikke. Your deduction is accurate.
    ko: 예, 저는 니케가 아닙니다. 정확히 간파하셨군요.
    ja: |-
      はい。わたしはニケではありません。
      似てはいるようですが、正確に見抜きましたね。
  d_nikke_ce009_03_01_73:
    speaker: ce009_03
    en: One could say that I am an outsider from another world.
    ko: 저는 다른 세계에서 이곳으로 찾아온 이방인… 이라고 할 수 있는 존재.
    ja: |-
      わたしは、ここではない他の世界から、
      この世界へとやってきた…
      異邦人、というような存在でしょうか。
  d_nikke_ce009_03_01_74:
    speaker: ce009_03
    en: I am Aigis, the seventh-generation Anti-Shadow Suppression Weapon.
    ko: 대 섀도 특수 제압 병장 제7식, 아이기스라고 합니다.
    ja: |-
      対シャドウ特別制圧兵装七式・アイギスと
      申します。
d_nikke_ce009_03_02:
  d_nikke_ce009_03_02_1:
    speaker: ce009_03
    en: My name is Aigis. I am a humanoid anti-Shadow weapon designed to suppress
      enemies.
    ko: |-
      저는 아이기스,
      인간형 대 섀도… 적을 제압하기 위한 병기입니다.
    ja: |-
      わたしはアイギス。
      人型の対シャドウ…敵を
      制圧するための兵器であります。
  d_nikke_ce009_03_02_2:
    speaker: ce009_03
    en: While I do share some similarities with Nikkes,
    ko: 니케와 유사점이 있기는 하나.
    ja: ニケとの類似点もありますが、
  d_nikke_ce009_03_02_3:
    speaker: ce009_03
    en: in terms of composition, I am actually closer to the drones beside you than
      to you, who possess human organs.
    ko: |-
      인간의 생체 기관이 있는 당신보다,
      오히려 옆에 계시는 드론에 가까운 존재라고 할 수 있겠습니다.
    ja: |-
      人間の生体器官を持つあなたより、
      むしろ、隣にいらっしゃるドローンに
      近い存在といえるでしょう。
  d_nikke_ce009_03_02_4:
    speaker: rei
    en: I've never heard of anything like that before...
    ko: "…그런 게 있다는 말은 들은 적 없는데."
    ja: "…そんなの聞いたことないなぁ。"
  d_nikke_ce009_03_02_5:
    speaker: rei
    en: Hmph! You're just making that up because I look young, aren't you?
    ko: 흥! 너 지금 내가 어려 보인다고 거짓말하는 거지?
    ja: |-
      あっ！私が子どもに見えるからって
      からかってるんでしょ！？
  d_nikke_ce009_03_02_6:
    speaker: rei
    en: Believe it or not, I'm a senior!
    ko: 이래 봬도 나 3학년이거든?
    ja: こう見えても、3年生なんだけど？
  d_nikke_ce009_03_02_7:
    speaker: ce009_03
    en: I am not lying.
    ko: 거짓말이 아닙니다.
    ja: ウソではありません。
  d_nikke_ce009_03_02_8:
    speaker: ce009_03
    en: Would you like me to prove it?
    ko: 증명해 드립니까?
    ja: 証明いたしましょうか？
  d_nikke_ce009_03_02_9:
    speaker: "<Narration>"
    en: "*Click*"
    ko: 철컥-
    ja: カチャ――
  d_nikke_ce009_03_02_10:
    speaker: "<Narration>"
    en: Aigis raises the weapon built into her hand.
    ko: 아이기스가 손의 무장을 치켜든다.
    ja: アイギスが手に仕込まれた武器を構えた
  d_nikke_ce009_03_02_11:
    speaker: ce009_03
    en: I was informed that Nikkes cannot equip this type of weapon.
    ko: 해당 방식의 무장은 니케에게 장착이 불가하다 들었습니다만.
    ja: |-
      この方式の武装はニケに装着できないと
      うかがいました。
  d_nikke_ce009_03_02_12:
    speaker: rei
    en: Gah! I-it's real...
    ko: 뜨헉. 지, 진짜네…?
    ja: わわっ。もしかして、ホントに…？
  d_nikke_ce009_03_02_13:
    speaker: ce009_03
    en: Yes, I may resemble a Nikke, but I am not one.
    ko: 예, 저는 니케와 닮았지만 다른 존재니까요.
    ja: |-
      はい。
      わたしはニケとは似て非なる存在なのです。
  d_nikke_ce009_03_02_14:
    speaker: ce009_03
    en: Before we continue, may I ask for your name?
    ko: 그보다, 당신의 이름을 알려주실 수 있습니까?
    ja: |-
      ところで…あなたのお名前を
      教えていただいてもいいでしょうか。
  d_nikke_ce009_03_02_15:
    speaker: rei
    en: I... I'm Rei.
    ko: 나는… 라이라고 해.
    ja: 私は…ライだよ。
  d_nikke_ce009_03_02_16:
    speaker: ce009_03
    en: Rei-san... Confirmed. Database updated.
    ko: 라이… 확인했습니다. 데이터베이스에 기록해 두겠습니다.
    ja: |-
      ライさん…承知いたしました。
      データベースに記録しておくであります。
  d_nikke_ce009_03_02_17:
    speaker: rei
    en: Didn't you already say you'd update your database...?
    ko: 아까도 말했던 거 같은데, 기록해 둔다고…?
    ja: さっきも言ってたけど、記録するって…？
  d_nikke_ce009_03_02_18:
    speaker: rei
    en: "... A-ahem!"
    ko: |-
      …헛!
      크, 크흠!
    ja: |-
      …はっ！
      オ、オホンッ！
  d_nikke_ce009_03_02_19:
    speaker: rei
    en: And another thing! I'm a third-year!
    ko: 그리고 말이지? 난 3학년이거든?
    ja: それとね、私は3年生だよ？
  d_nikke_ce009_03_02_20:
    speaker: rei
    en: Third-years are the highest grade. That makes me the boss of the classroom!
    ko: 3학년은 가장 높은 학년이야. 교실의 왕이라고.
    ja: 3年生は一番上の学年で、教室の王様なの。
  d_nikke_ce009_03_02_21:
    speaker: ce009_03
    en: '"Seniors are the bosses of the classroom." Database updated.'
    ko: "[3학년은 교실의 왕]… 추가해 두겠습니다."
    ja: "「3年生は教室の王様」…追加しておきます。"
  d_nikke_ce009_03_02_22:
    speaker: ce009_03
    en: It appears that's one of the rules of this world. I've learned something new.
    ko: 이 세계에는 그런 규칙이 있나 보군요. 공부가 되었습니다.
    ja: |-
      この世界には、そのようなルールが
      あるのですね。勉強になるであります。
  d_nikke_ce009_03_02_23:
    speaker: rei
    en: Hehe, exactly! You really get me, Aigis.
    ko: 헤헤, 그렇지! 아이기스는 뭔가 말이 잘 통하네~
    ja: |-
      えへへ、そうそう！
      アイギスは話が分かるね～
  d_nikke_ce009_03_02_24:
    speaker: rei
    en: Anyway, what were you doing over here?
    ko: 그런데 넌 여기서 뭐 하고 있던 거야?
    ja: ところで、ここで何をしてるの？
  d_nikke_ce009_03_02_25:
    speaker: rei
    en: It feels like you've been wandering around for a while now...
    ko: 아까부터 계속 돌아다니는 것 같던데….
    ja: さっきからずっと歩き回ってたみたいだけど…
  d_nikke_ce009_03_02_26:
    speaker: ce009_03
    en: I'm exploring the Ark.
    ko: 방주를 둘러보고 있었습니다.
    ja: アークを見物していました。
  d_nikke_ce009_03_02_27:
    speaker: ce009_03
    en: I have already looked around downtown, so I am now deciding where to go next.
    ko: 시내를 구경하고, 다음 장소를 물색하고 있었습니다.
    ja: |-
      市街地を見て回り、
      次の目的地を探していたところです。
  d_nikke_ce009_03_02_28:
    speaker: rei
    en: I see!
    ko: 흐응, 그래?
    ja: ふ～ん、そうなんだ。
  d_nikke_ce009_03_02_29:
    speaker: rei
    en: Then wanna come to school with me?
    ko: 그러면 나랑 같이 학교에 가는 건 어때?
    ja: じゃあ、一緒に学校に行かない？
  d_nikke_ce009_03_02_30:
    speaker: ce009_03
    en: Your... school?
    ko: 학교… 말입니까?
    ja: 学校…でありますか？
  d_nikke_ce009_03_02_31:
    speaker: rei
    en: Yeah! I've got lots of friends there!
    ko: 응! 거기에 내 친구들이 많거든!
    ja: うん！友だちもたくさんいるよ！
  d_nikke_ce009_03_02_32:
    speaker: ce009_03
    en: A school for Nikkes. How intriguing.
    ko: 니케들의 학교군요, 흥미가 생깁니다.
    ja: |-
      ニケにも、学校があるのですね…
      興味が湧いてきたであります。
  d_nikke_ce009_03_02_33:
    speaker: ce009_03
    en: However, I am neither a Nikke nor a student there. Would that be acceptable?
    ko: 하지만 전 니케도, 학생도 아닙니다. 괜찮으신 겁니까?
    ja: |-
      しかし、わたしはニケでも、
      生徒でもありません。
      大丈夫ですか？
  d_nikke_ce009_03_02_34:
    speaker: ce009_03
    en: My understanding is that a school is intended for enrolled students. Wouldn't
      bringing me along inconvenience everyone?
    ko: |-
      학교란, 등록된 학생이 다니는 곳으로 인식하고 있습니다.
      저를 데려가면 민폐가 되지 않을까요?
    ja: |-
      学校とは、登録された生徒が
      通う場所であると認識しています。
      わたしを連れていったら、
      ライさんに迷惑がかかるのではないでしょうか？
  d_nikke_ce009_03_02_35:
    speaker: rei
    en: U-um... I guess you have a point.
    ko: 어… 새, 생각해 보니 그렇네?
    ja: あっ…い、言われてみれば。
  d_nikke_ce009_03_02_36:
    speaker: rei
    en: What do we do...?
    ko: 그럼 어떻게 하지…?
    ja: じゃあ、どうしよう…？
  d_nikke_ce009_03_02_37:
    speaker: rei
    en: Hmmm...
    ko: 흐으응….
    ja: うーん…
  d_nikke_ce009_03_02_38:
    speaker: ce009_03
    en: In terms of composition, I am actually closer to the drones beside you than
      to you, who possess human organs.
    ko: |-
      인간의 생체 기관이 있는 당신보다,
      오히려 옆에 계시는 드론에 가까운 존재라고 할 수 있겠습니다.
    ja: |-
      人間の生体器官を持つあなたより、
      むしろ、隣にいらっしゃるドローンに
      近い存在といえるでしょう。
  d_nikke_ce009_03_02_39:
    speaker: rei
    en: "... That's it!"
    ko: "…그래!"
    ja: "…そうだっ！"
  d_nikke_ce009_03_02_40:
    speaker: rei
    en: Hehe, c'mere for a sec.
    ko: 헤헤, 잠깐 이쪽으로 와볼래?
    ja: えへへ、ちょっとお耳貸して？
  d_nikke_ce009_03_02_41:
    speaker: ce009_03
    en: "... Like this?"
    ko: "…이렇게 말입니까?"
    ja: "…こうですか？"
  d_nikke_ce009_03_02_42:
    speaker: "<Narration>"
    en: Aigis leans in toward Rei.
    ko: 아이기스가 라이 쪽으로 귀를 기울였다.
    ja: アイギスがライに耳を近づけた
  d_nikke_ce009_03_02_43:
    speaker: rei
    en: "*Whisper, whisper*"
    ko: 속닥속닥….
    ja: ひそひそ…
  d_nikke_ce009_03_02_44:
    speaker: ce009_03
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_03_02_45:
    speaker: rei
    en: What do you think?
    ko: 어때~?
    ja: どう～？
  d_nikke_ce009_03_02_46:
    speaker: naru1
    en: A new junior's here!
    ko: 후배 등장.
    ja: 後輩登場。
  d_nikke_ce009_03_02_47:
    speaker: naru2
    en: Already?
    ko: 벌써?
    ja: もう？
  d_nikke_ce009_03_02_48:
    speaker: naru3
    en: Hooray!
    ko: 만세입니다~!
    ja: バンザイで～す！
  d_nikke_ce009_03_02_49:
    speaker: rei
    en: Hehe, see? Even the Narus think it's a great idea!
    ko: 흐흥, 나루들도 좋다는데~?
    ja: あはは、ナルたちも喜んでるよ。
  d_nikke_ce009_03_02_50:
    speaker: ce009_03
    en: I believe that's a reasonable proposal.
    ko: 나쁘지 않은 제안이라고 생각합니다.
    ja: 悪くない提案だと思います。
  d_nikke_ce009_03_02_51:
    speaker: ce009_03
    en: Since the Commander has already granted me permission to explore the Ark,
      I do not foresee any problems.
    ko: 방주 견학에 대해서는 지휘관의 허가도 있었으니, 문제는 없을 겁니다.
    ja: |-
      アークの見学については、
      指揮官から許可ももらっているので、
      問題ないはずであります。
  d_nikke_ce009_03_02_52:
    speaker: ce009_03
    en: As thanks for the candy-flavored kebab, I will provide my full support.
    ko: |-
      사탕 꼬치에 대한 답례도 겸해서,
      전력으로 서포트에 임하겠습니다.
    ja: |-
      キャンディのお礼も含めて、
      全力でライさんのサポートに取り組みます。
  d_nikke_ce009_03_02_53:
    speaker: rei
    en: Yay! Let's go, let's go!
    ko: 좋아~ 그럼 가자 가자~
    ja: うん。じゃ、行こ！
  d_nikke_ce009_03_02_54:
    speaker: ce009_03
    en: So this is it...
    ko: 이곳이….
    ja: ここが…
  d_nikke_ce009_03_02_55:
    speaker: rei
    en: How's that? Pretty cool, right?
    ko: 어때? 굉장하지?
    ja: どう？すごいでしょ？
  d_nikke_ce009_03_02_56:
    speaker: ce009_03
    en: Yes, this is an exceptionally large school built on expansive grounds. The
      Ark's architectural engineering is truly remarkable.
    ko: |-
      예, 넓은 부지에 엄청난 크기의 학교로군요.
      방주의 건축 기술은 항상 놀랍습니다.
    ja: |-
      はい…とても大きな校舎に、広い敷地…
      アークの建築技術には驚かされてばかりです。
  d_nikke_ce009_03_02_57:
    speaker: ce009_03
    en: I never imagined there would be a school of this scale underground. Thank
      you for showing me around.
    ko: |-
      지하에 이런 학교가 있다니… 예상 밖입니다.
      안내해 주셔서 감사합니다.
    ja: |-
      地下にこのような学校があるとは想定外でした。
      案内してくださり、感謝いたします。
  d_nikke_ce009_03_02_58:
    speaker: ein
    en: Whoa, Rei?
    ko: 어라? 라이 선배 아녜요?
    ja: あれ？ライ先輩？
  d_nikke_ce009_03_02_59:
    speaker: ein
    en: What's going on? You're here so early.
    ko: 웬일이래, 이렇게 일찍 등교하시고.
    ja: こんな早い時間に登校なんて珍し～！
  d_nikke_ce009_03_02_60:
    speaker: ein
    en: Usually, you come running in right before they close the gates.
    ko: 보통 교문이 닫히기 직전에 허겁지겁 들어오시잖아요.
    ja: いっつも校門が閉まるギリギリで来るのに。
  d_nikke_ce009_03_02_61:
    speaker: zwei
    en: Yeah... It is really early.
    ko: 그러게… 확실히 이른 시간이긴 하네.
    ja: 確かに…いつもより早いですね。
  d_nikke_ce009_03_02_62:
    speaker: rei
    en: Hehehe... You guys wanna know why?
    ko: 후후후, 제군들 그것이 궁금한가?
    ja: ふっふっふ。理由が気になる？
  d_nikke_ce009_03_02_63:
    speaker: rei
    en: Well... ta-da!
    ko: 그 이유는 말이지… 짜잔-!
    ja: それはズバリ…じゃじゃーん！
  d_nikke_ce009_03_02_64:
    speaker: ein
    en: Whoa! Isn't this that viral kebab?!
    ko: 우오오! 이거 요즘 유행하는 꼬치 아녜요?!
    ja: |-
      うわ～っ！
      これ、最近バズってる串じゃないですか！？
  d_nikke_ce009_03_02_65:
    speaker: ein
    en: I heard it's basically impossible to get unless you line up before the store
      even opens. How'd you get this?!
    ko: 오픈런 안 하면 절대 못 구한다는데, 어떻게 하신 거예요?!
    ja: |-
      開店前に並ばないと絶対買えないやつ！
      どうしたんですか！？
  d_nikke_ce009_03_02_66:
    speaker: rei
    en: Hehe, that's why I got up before sunrise today.
    ko: 후후, 그래서 오늘 해뜨기 전에 일어났지.
    ja: ふふふ…今日はおひさまより早く起きたの。
  d_nikke_ce009_03_02_67:
    speaker: rei
    en: Guess that's just what a caring senior does!
    ko: 후배를 생각하는 선배의 마음이랄까?
    ja: 後輩のために頑張る先輩って感じでしょ？
  d_nikke_ce009_03_02_68:
    speaker: naru1
    en: Rei, you're actually dependable for once.
    ko: 라이, 간만에 듬직.
    ja: ライ、久しぶりに頼もしい。
  d_nikke_ce009_03_02_69:
    speaker: naru2
    en: Now that's something you don't see every day!
    ko: 해가 서쪽에서?
    ja: 太陽が西から昇る？
  d_nikke_ce009_03_02_70:
    speaker: naru3
    en: I'm impressed!
    ko: 대단합니다~!
    ja: すごいで～す！
  d_nikke_ce009_03_02_71:
    speaker: ce009_03
    en: I see...
    ko: "…그렇구나-"
    ja: "…なるほどなー。"
  d_nikke_ce009_03_02_72:
    speaker: ce009_03
    en: Now I understand why you call yourself the boss of the classroom. As expected,
      Rei-san, you're quite impressive.
    ko: |-
      라이가 왜 자칭 교실의 왕인지 단번에 이해했습니다.
      역시 대단하시군요.
    ja: |-
      なぜライさんが「教室の王様」なのか
      一瞬で理解できました。流石でありますね。
  d_nikke_ce009_03_02_73:
    speaker: zwei
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_03_02_74:
    speaker: ein
    en: Wh-who are you?
    ko: 누, 누구세요?
    ja: あれ、どちら様？
  d_nikke_ce009_03_02_75:
    speaker: ce009_03
    en: Thank you for asking. I am...
    ko: 아, 잘 물어봐 주셨습니다. 저는….
    ja: |-
      よくぞお聞きくださいました。
      わたしは…
  d_nikke_ce009_03_02_76:
    speaker: ce009_03
    en: Naru 4.
    ko: "[나루 4호]라고 합니다."
    ja: "「ナル4号」であります。"
d_nikke_ce009_03_03:
  d_nikke_ce009_03_03_1:
    speaker: "<Narration>"
    en: Once in the classroom, Aigis explains the situation to the students.
    ko: 교실로 이동한 아이기스는 학생들에게 상황을 설명했다.
    ja: |-
      教室に移動したアイギスは、
      学生たちに状況を説明した
  d_nikke_ce009_03_03_2:
    speaker: zwei
    en: So that's what happened...
    ko: "…그렇게 된 거였군요."
    ja: "…そういうことでしたか。"
  d_nikke_ce009_03_03_3:
    speaker: ce009_03
    en: Yes. I will be accompanying Rei-san to learn more about this world.
    ko: |-
      예, 이 세계에 대해 더 배우고자
      라이와 동행하게 되었습니다.
    ja: |-
      はい。この世界のことをもっと学ぶべく、
      ライさんに同行しているのであります。
  d_nikke_ce009_03_03_4:
    speaker: ein
    en: Oh, I get it now.
    ko: 아아, 이제 이해했어요.
    ja: あー、やっと分かった。
  d_nikke_ce009_03_03_5:
    speaker: ein
    en: You really caught me off guard when you suddenly said you were Naru 4.
    ko: 갑자기 나루 4호라 하시길래, 깜짝 놀랐네요.
    ja: |-
      急にナル4号とか言われたから、
      びっくりしましたよ。
  d_nikke_ce009_03_03_6:
    speaker: ce009_03
    en: That name was chosen as a cover identity so I could enter the school. If a
      teacher is present, I would appreciate it if you addressed me as such.
    ko: |-
      교내에 들어가기 위해 설정된 호칭입니다.
      선생님이 계실 경우에 그렇게 불러 주시면 감사드리겠습니다.
    ja: |-
      校内に入らせていただくために
      設定した呼称です。先生などがいる場合は、
      そう呼んでいただければと。ご理解ください。
  d_nikke_ce009_03_03_7:
    speaker: ce009_03
    en: Thanks to Rei-san's generosity, I was also given the opportunity to attend
      class today.
    ko: 오늘은 라이의 호의로 저도 수업을 체험할 수 있게 되었습니다.
    ja: |-
      今日はライさんのご厚意によって、
      わたしも授業などを体験することになりました。
  d_nikke_ce009_03_03_8:
    speaker: ce009_03
    en: It is hardly enough to repay the favor, but if you ever require my assistance,
      please do not hesitate to ask.
    ko: |-
      답례라고 하긴 부족하지만,
      서포트가 필요할 땐 언제든 말씀해 주시길 바랍니다.
    ja: |-
      お礼と言ってはなんですが、
      サポートが必要なときはお申し付けください。
      お手伝いをするであります。
  d_nikke_ce009_03_03_9:
    speaker: rei
    en: Hehe, you heard her!
    ko: 흐흥, 다들 들었지?
    ja: ふふんっ。みんな聞いたでしょ？
  d_nikke_ce009_03_03_10:
    speaker: rei
    en: Aigis is one of us today. Let's all get along!
    ko: |-
      아이기스도 오늘은 우리 학교 친구야.
      다 같이 사이좋게 지내자!
    ja: |-
      アイギスも今日は私たちの学校の友だちだよ。
      みんなで仲よくしようね！
  d_nikke_ce009_03_03_11:
    speaker: zwei
    en: Of course.
    ko: 물론이죠.
    ja: もちろんです。
  d_nikke_ce009_03_03_12:
    speaker: ein
    en: Don't worry!
    ko: 걱정 마세요!
    ja: ご心配なく！
  d_nikke_ce009_03_03_13:
    speaker: ein
    en: Oh right, Rei,
    ko: 아, 맞다.
    ja: あ、そうだ。
  d_nikke_ce009_03_03_14:
    speaker: ein
    en: you did your homework, right?
    ko: 라이 선배, 오늘 숙제는 해오셨죠?
    ja: ライ先輩、今日の宿題やってきました？
  d_nikke_ce009_03_03_15:
    speaker: rei
    en: H-homework? What homework?
    ko: 으, 으잉? 무슨 숙제?
    ja: えっ？宿題って？
  d_nikke_ce009_03_03_16:
    speaker: ein
    en: Wait, seriously? You don't remember?
    ko: 에엥, 기억 안 나세요?
    ja: あちゃ～、覚えてないんですか？
  d_nikke_ce009_03_03_17:
    speaker: ein
    en: Come on, Miss Marciana already told you the other day.
    ko: 저번에 마르차나 선생님이 말씀하셨잖아요.
    ja: マルチャーナ先生が言ってたじゃないですか。
  d_nikke_ce009_03_03_18:
    speaker: ein
    en: You were supposed to get it done by today.
    ko: 이번에는 꼭 해오라고요.
    ja: 今回のは絶対忘れちゃダメだって。
  d_nikke_ce009_03_03_19:
    speaker: zwei
    en: Yeah, I'd never seen her be that stern before.
    ko: 맞아요, 그렇게 강하게 말씀하시는 건 처음 봤어요.
    ja: |-
      そうですよ。
      あれほどハッキリ言われていたのに。
  d_nikke_ce009_03_03_20:
    speaker: rei
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_03_21:
    speaker: rei
    en: I-I forgot...
    ko: 까, 까먹고 있었어.
    ja: わ、忘れてた…
  d_nikke_ce009_03_03_22:
    speaker: rei
    en: I got so distracted by the candy-flavored shish kebabs...
    ko: 사탕 맛 꼬치에 정신이 팔려서 그만….
    ja: 串焼きキャンディに夢中で…
  d_nikke_ce009_03_03_23:
    speaker: rei
    en: A-Aigis...
    ko: 아… 아이기스.
    ja: ア…アイギス。
  d_nikke_ce009_03_03_24:
    speaker: ce009_03
    en: Yes? Is something the matter?
    ko: 예, 부르셨습니까.
    ja: はい、お呼びでしょうか。
  d_nikke_ce009_03_03_25:
    speaker: rei
    en: Th-this is bad!
    ko: 크, 큰일 났어.
    ja: ど、どうしよう。
  d_nikke_ce009_03_03_26:
    speaker: rei
    en: Miss Marciana gets really scary when she's mad!
    ko: 마르차나 선생님은 화나면 진짜 무섭단 말야.
    ja: マルチャーナ先生、怒るとすっごく怖いんだよ。
  d_nikke_ce009_03_03_27:
    speaker: ce009_03
    en: Scary...? How so?
    ko: 무섭다…? 어떤 방식으로 화를 내는 겁니까?
    ja: |-
      怖い…？
      それは、どのような怒り方なのでしょうか。
  d_nikke_ce009_03_03_28:
    speaker: marciana
    en: What do you mean you didn't do your homework...?
    ko: 뭐라고요? 숙제를 안 해오셨다고요…?
    ja: |-
      何ですって？
      宿題をやってこなかった…？
  d_nikke_ce009_03_03_29:
    speaker: marciana
    en: Reiiiii!
    ko: 라이이이이-!
    ja: ライ！！！
  d_nikke_ce009_03_03_30:
    speaker: marciana
    en: Get over here right now!
    ko: 이쪽으로 오세요!
    ja: こっちに来なさい！
  d_nikke_ce009_03_03_31:
    speaker: rei
    en: Waaahh!
    ko: 흐어어어엉.
    ja: ふええええん…
  d_nikke_ce009_03_03_32:
    speaker: rei
    en: I-I'm scared...!
    ko: 무, 무서워…!
    ja: こ、怖いよぉ…！
  d_nikke_ce009_03_03_33:
    speaker: ein
    en: She didn't sound that scary to me...
    ko: 그 정도까진 아니었던 거 같은데….
    ja: そこまで怒ったことはないと思いますけど…
  d_nikke_ce009_03_03_34:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_03_35:
    speaker: ce009_03
    en: Homework is assigned to help students learn. It is meaningless unless completed
      by the students themselves.
    ko: |-
      숙제는 학생이 실력을 키우기 위한 것.
      본인이 직접 하지 않으면 의미가 없다고 인식하고 있습니다.
    ja: |-
      宿題は学生が力を付けるためのもの。
      本人が取り組まないと意味がないと
      認識しています。
  d_nikke_ce009_03_03_36:
    speaker: ce009_03
    en: However... I will help just this once.
    ko: 하지만 이번만큼은 제가 도와드리도록 하겠습니다.
    ja: |-
      しかし、今回だけは
      わたしがお手伝いするであります。
  d_nikke_ce009_03_03_37:
    speaker: rei
    en: "*Sniffle*"
    ko: 뚝.
    ja: えっ。
  d_nikke_ce009_03_03_38:
    speaker: rei
    en: R-really...?
    ko: 지, 진짜아…?
    ja: ほ、ホント…？
  d_nikke_ce009_03_03_39:
    speaker: ce009_03
    en: Yes, I am Naru 4 today, after all. Assisting you is my way of repaying your
      kindness.
    ko: |-
      네, 오늘의 전 [나루 4호] 이니까요.
      라이의 서포트를 하며 은혜를 갚도록 하겠습니다.
    ja: |-
      はい。今日のわたしは、「ナル4号」ですから。
      ライさんのサポートをして、
      恩返しをさせていただきます。
  d_nikke_ce009_03_03_40:
    speaker: ce009_03
    en: Besides, I'm interested in the kind of homework assigned to Nikkes. Would
      you mind showing it to me?
    ko: |-
      그리고 니케에게 내주는 숙제에도 흥미가 있습니다.
      숙제를 보여 주시겠습니까?
    ja: |-
      それに、ニケに出される宿題にも
      興味があります。
      宿題を見せていただけますか？
  d_nikke_ce009_03_03_41:
    speaker: rei
    en: Here you go.
    ko: 응, 여기.
    ja: うん、これなんだけど。
  d_nikke_ce009_03_03_42:
    speaker: "<Narration>"
    en: Rei hands Aigis her tablet.
    ko: 라이가 아이기스에게 태블릿을 건넨다.
    ja: ライはアイギスにタブレットを渡した
  d_nikke_ce009_03_03_43:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_03_44:
    speaker: ce009_03
    en: Hmm... These appear to be simple math problems. This should be easy for me.
    ko: |-
      흠… 단순 수학 문제군요.
      이 정도라면 저에겐 간단합니다.
    ja: |-
      ふむ…数学の問題ですね。
      これであれば、わたしにとっては単純です。
  d_nikke_ce009_03_03_45:
    speaker: rei
    en: R-really?!
    ko: 저, 정말?!
    ja: ほ、ホントに！？
  d_nikke_ce009_03_03_46:
    speaker: ce009_03
    en: Indeed. How much time do we have until the teacher arrives?
    ko: 예, 선생님이 오실 때까지 시간이 얼마나 있습니까?
    ja: |-
      はい。
      先生がいらっしゃるまで、
      どれくらい時間がありますか？
  d_nikke_ce009_03_03_47:
    speaker: ein
    en: Uh...
    ko: 어… 그게.
    ja: え～と…
  d_nikke_ce009_03_03_48:
    speaker: ein
    en: We've got about 10 minutes until class starts.
    ko: 수업 시작까지 10분 정도 남았어요.
    ja: 授業開始までの、あと10分くらいかな。
  d_nikke_ce009_03_03_49:
    speaker: ce009_03
    en: That should be sufficient. May I borrow a pen?
    ko: 그 정도면 충분합니다. 펜을 빌려주시겠습니까?
    ja: |-
      それだけあれば、十分ですね。
      ペンを貸していただけますか？
  d_nikke_ce009_03_03_50:
    speaker: ein
    en: H-here ya go.
    ko: 여, 여기요.
    ja: はい、これ。
  d_nikke_ce009_03_03_51:
    speaker: ce009_03
    en: Naru 4, commencing mission.
    ko: 나루 4호, 임무에 착수하겠습니다.
    ja: ナル4号、任務に着手します。
  d_nikke_ce009_03_03_52:
    speaker: "<Narration>"
    en: "*Scribble, scribble*"
    ko: 사사사삭-
    ja: サラサラッ――
  d_nikke_ce009_03_03_53:
    speaker: rei
    en: Oooh...
    ko: 오오….
    ja: おお…
  d_nikke_ce009_03_03_54:
    speaker: "<Narration>"
    en: "*Scribble, scribble, scribble*"
    ko: 사사사사사삭-
    ja: サラサラサラッ――
  d_nikke_ce009_03_03_55:
    speaker: rei
    en: Ooooooh...!
    ko: 오오오오오…!
    ja: おおおおお…！
  d_nikke_ce009_03_03_56:
    speaker: "<Narration>"
    en: However, the crowd of students gathered to watch brings a teacher walking
      down the hallway to a stop.
    ko: |-
      하지만 구경을 위해 몰려든 인파는
      복도를 지나가던 선생님의 발걸음을 멈추게 했다.
    ja: |-
      だが、見物に集まった人だかりが
      廊下を歩いていた先生の足を止めた
  d_nikke_ce009_03_03_57:
    speaker: marciana
    en: "...?"
    ko: "…?"
    ja: "…？"
  d_nikke_ce009_03_03_58:
    speaker: marciana
    en: What's going on?
    ko: 무슨 일 있는 건가요?
    ja: 何かあったのですか？
  d_nikke_ce009_03_03_59:
    speaker: marciana
    en: Why's everyone gathered here...?
    ko: 다들 이렇게 모여서….
    ja: 今日は皆さん早いですね…
  d_nikke_ce009_03_03_60:
    speaker: "<Narration>"
    en: "*Swoosh*"
    ko: 우르르-
    ja: サーッ――
  d_nikke_ce009_03_03_61:
    speaker: "<Narration>"
    en: The crowd scatters as soon as Marciana arrives.
    ko: 마르차나의 등장에 인파가 순식간에 흩어지고.
    ja: |-
      マルチャーナが教室に現れ、
      蜘蛛の子のように散った
  d_nikke_ce009_03_03_62:
    speaker: rei
    en: Gah!
    ko: 뜨헉….
    ja: ギクッ…
  d_nikke_ce009_03_03_63:
    speaker: "<Narration>"
    en: With the crowd gone, Aigis and Rei are revealed, hard at work on their homework.
    ko: 그 속에서 열심히 숙제하고 있는 아이기스, 라이가 드러났다.
    ja: |-
      中心で宿題をしていた
      アイギスとライが視線に入る
  d_nikke_ce009_03_03_64:
    speaker: marciana
    en: "... Rei? And who's that beside you...?"
    ko: "…라이? 그리고 옆에 있는 건…."
    ja: |-
      …ライ？
      それに、隣にいるのは…
  d_nikke_ce009_03_03_65:
    speaker: marciana
    en: Can you explain what's going on here?
    ko: 이게 무슨 상황인지 설명을 부탁드려도 될까요?
    ja: どういうことか、説明してもらえますか？
  d_nikke_ce009_03_03_66:
    speaker: rei
    en: I, um... w-well...
    ko: 아, 그게… 저, 그, 그게….
    ja: えっと、その…だから…
  d_nikke_ce009_03_03_67:
    speaker: ce009_03
    en: Please allow me to explain. I am Naru 4.
    ko: 제가 설명드리겠습니다. 저는 나루 4호입니다.
    ja: |-
      わたしが説明させていただきます。
      わたしはナル4号。
  d_nikke_ce009_03_03_68:
    speaker: ce009_03
    en: I am... Rei-san's support unit, so to speak. I am currently assisting her
      with her homework.
    ko: |-
      라이의 서포트 유닛… 이라고 할 수 있겠군요.
      현재 숙제를 지원하고 있습니다.
    ja: |-
      ライさんのサポートユニットです。
      今は、宿題の支援をしているであります。
  d_nikke_ce009_03_03_69:
    speaker: rei
    en: "!!!"
    ko: "!!!"
    ja: "！！！"
d_nikke_ce009_03_04:
  d_nikke_ce009_03_04_1:
    speaker: rei
    en: Waaahhhh!
    ko: 흐어어어어엉-
    ja: ふえええええん…
  d_nikke_ce009_03_04_2:
    speaker: "<Narration>"
    en: '"I''m sorry,"'
    ko: 잘못했습니다.
    ja: ごめんなさい
  d_nikke_ce009_03_04_3:
    speaker: "<Narration>"
    en: '"I asked Aigis to do the homework I should''ve done myself."'
    ko: 스스로 해야 할 숙제를 아이기스에게 부탁했습니다.
    ja: |-
      自分でやらないとならない宿題を、
      アイギスにやってもらいました
  d_nikke_ce009_03_04_4:
    speaker: rei
    en: "*Sniff, sniff...*"
    ko: 훌쩍 훌쩍….
    ja: グスン…ヒック…
  d_nikke_ce009_03_04_5:
    speaker: "<Narration>"
    en: '"I knew it was wrong, but I was in such a hurry."'
    ko: 나쁜 짓인 거 알았는데 너무 급했습니다.
    ja: |-
      悪いって分かってたのに、
      ごまかしてしまいました
  d_nikke_ce009_03_04_6:
    speaker: "<Narration>"
    en: '"Since I was the one who asked Aigis, please don''t blame her."'
    ko: 제가 시킨 거니까 아이기스는 봐주세요.
    ja: |-
      私がさせたことなので、
      アイギスのことは叱らないでください
  d_nikke_ce009_03_04_7:
    speaker: "<Narration>"
    en: '"Please scold me instead."'
    ko: 나만 혼내주세요.
    ja: 罰は私が一人で受けます
  d_nikke_ce009_03_04_8:
    speaker: rei
    en: "*Sob... Hic...*"
    ko: 흐극… 흐극… 끄흡….
    ja: ううっ…ヒック…
  d_nikke_ce009_03_04_9:
    speaker: "<Narration>"
    en: '"I sincerely regret what I did."'
    ko: 진심으로 반성합니다.
    ja: 心から反省しています
  d_nikke_ce009_03_04_10:
    speaker: "<Narration>"
    en: '"But my pride as a senior..."'
    ko: 다만 3학년으로서의 위엄이….
    ja: "――でも、3年生としての威厳が…"
  d_nikke_ce009_03_04_11:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_04_12:
    speaker: ce009_03
    en: I'm sorry, Rei-san.
    ko: 죄송합니다, 라이.
    ja: 申し訳ありません、ライさん。
  d_nikke_ce009_03_04_13:
    speaker: ce009_03
    en: I had allocated all my resources to solving the math problems, so I failed
      to notice the teacher approaching.
    ko: |-
      계산에 모든 리소스를 할당하고 있었기 때문에
      선생님이 다가오는 것을 알아차리지 못했습니다.
    ja: |-
      計算に集中し、リソースを割いていたため、
      先生の接近に気づくことができませんでした。
  d_nikke_ce009_03_04_14:
    speaker: ce009_03
    en: If I had taught you how to solve them instead of doing all the work myself,
      perhaps you wouldn't have been scolded.
    ko: |-
      직접 풀지 않고 라이에게 풀이 방법을 알려드렸다면,
      꾸짖음은 없었을지도 모르겠군요.
    ja: |-
      もしくは、わたしが解くのではなく、
      わたしがライさんに解き方を
      教える選択を取っていれば
      叱られることはなかったかもしれません…
  d_nikke_ce009_03_04_15:
    speaker: rei
    en: I-it's okay... *Sniff*
    ko: 괘, 괜찮아… 크흡.
    ja: だ、大丈夫だよ…ううっ。
  d_nikke_ce009_03_04_16:
    speaker: rei
    en: H-humans... I mean, even Narus make mistakes... *Sniff*
    ko: 사, 사람… 아니, 나루도 실수할 수 있는 법이니까… 훌쩍.
    ja: |-
      に、人間…いや、ナルだって
      失敗はするものだから…グスン。
  d_nikke_ce009_03_04_17:
    speaker: naru1
    en: The word "mistake" isn't in our dictionary.
    ko: 나루 사전 실수 없음.
    ja: ナルの辞書に「失敗」という文字なし。
  d_nikke_ce009_03_04_18:
    speaker: naru2
    en: Well, obviously!
    ko: 당연한 소리를?
    ja: 当たり前のことを？
  d_nikke_ce009_03_04_19:
    speaker: naru3
    en: That's right!
    ko: 인정합니다~!
    ja: 認めま～す！
  d_nikke_ce009_03_04_20:
    speaker: rei
    en: Waaaahhhhh!
    ko: 크허어어어엉-
    ja: うわあああああん～
  d_nikke_ce009_03_04_21:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_04_22:
    speaker: ce009_03
    en: I'll go get some tissues.
    ko: 휴지를 찾아오겠습니다.
    ja: ティッシュを探してきますね。
  d_nikke_ce009_03_04_23:
    speaker: "<Narration>"
    en: Aigis walks down the school corridor.
    ko: 아이기스는 복도를 걸었다.
    ja: アイギスは廊下を探し歩いた
  d_nikke_ce009_03_04_24:
    speaker: rei
    en: Waaahhhh!
    ko: 호어어어엉-
    ja: ふええええん！
  d_nikke_ce009_03_04_25:
    speaker: "<Narration>"
    en: Rei's wails reverberate through the air.
    ko: 라이의 울음소리가 복도에 메아리친다.
    ja: ライの泣き声が廊下に響き渡っている
  d_nikke_ce009_03_04_26:
    speaker: naga
    en: I was wondering what that sound was... Turns out it's Rei crying.
    ko: 무슨 소린가 했더니, 라이 울음소리였구나?
    ja: 何かと思えば、ライの泣き声だったみたい？
  d_nikke_ce009_03_04_27:
    speaker: tia
    en: Yeah, I can really tell now that we're closer.
    ko: 그러게에~ 여기까지 오니까 확실히 알겠는걸?
    ja: |-
      そうっぽいねぇ～
      ここまで来るとハッキリわかるよぉ？
  d_nikke_ce009_03_04_28:
    speaker: ce009_03
    en: And you two are...?
    ko: 두 분은…?
    ja: お二人は…？
  d_nikke_ce009_03_04_29:
    speaker: naga
    en: Hehe, so that's what happened.
    ko: 후훗, 그렇게 된 거였구나.
    ja: ふふ、そんなことがあったんだ。
  d_nikke_ce009_03_04_30:
    speaker: naga
    en: That's so Rei.
    ko: 라이다운 시추에이션인걸.
    ja: ライらしいね。
  d_nikke_ce009_03_04_31:
    speaker: ce009_03
    en: With that said...
    ko: "…그래서 말입니다."
    ja: "…あの。"
  d_nikke_ce009_03_04_32:
    speaker: ce009_03
    en: May I ask you both a question as Rei-san's friends?
    ko: |-
      라이의 친구이신 두 분께
      한가지 여쭤봐도 되겠습니까?
    ja: |-
      ライさんのご友人であるお二人に
      一つお尋ねしてもよろしいですか？
  d_nikke_ce009_03_04_33:
    speaker: tia
    en: Hm? What is it? You can ask us anything.
    ko: 우응? 뭔데에? 뭐든 물어봐아.
    ja: んん～？なぁに？何でも聞いてぇ。
  d_nikke_ce009_03_04_34:
    speaker: ce009_03
    en: What do high school girls in this world like most?
    ko: 이 세계의 여고생들이 가장 좋아하는 것은 무엇입니까?
    ja: |-
      この世界において、学校に通う女性が
      一番好きなものは何ですか？
  d_nikke_ce009_03_04_35:
    speaker: tia
    en: Hmm... What do I like?
    ko: 흐응~ 뭘 좋아하냐구?
    ja: う～ん。好きなもの？
  d_nikke_ce009_03_04_36:
    speaker: tia
    en: Well, I'm a high school girl too, so if I had to pick...
    ko: 나도 여고생이니까, 좋아하는 거라면~
    ja: |-
      私も女子高生だし、
      好きなものって聞かれたらぁ…
  d_nikke_ce009_03_04_37:
    speaker: tia
    en: I'd say reptiles!
    ko: 아무래도 파충류라고 해야 할까?
    ja: やっぱり爬虫類かなぁ？
  d_nikke_ce009_03_04_38:
    speaker: ce009_03
    en: Reptiles...? Based on my data regarding high school girls, that is not an
      answer I would have expected.
    ko: |-
      파충류… 말입니까?
      제가 알고 있는 [여고생]에게선 나오지 않을 답이라 생각합니다.
    ja: |-
      爬虫類…ですか？
      わたしの知る「女子高生」からは
      出ない案だと考えます。
  d_nikke_ce009_03_04_39:
    speaker: ce009_03
    en: Does that include all reptiles, such as geckos, chameleons, and pit vipers?
    ko: |-
      그것은 도마뱀붙이나 카멜레온, 살모사 등
      모든 파충류가 해당합니까?
    ja: |-
      それは、ヤモリやカメレオン、マムシなど
      すべての爬虫類が当てはまりますか？
  d_nikke_ce009_03_04_40:
    speaker: naga
    en: Haha, that's just something Tia likes. Not everyone's like that.
    ko: 아하하, 그건 티아의 개인적인 기호라서 모두에게 적용되는 건 아냐.
    ja: |-
      あはは…それはティアの個人的な好みだから
      全員には当てはまらないと思うけど。
  d_nikke_ce009_03_04_41:
    speaker: naga
    en: You're asking because you want to comfort Rei, right?
    ko: 라이를 달래주고 싶어서 물어본 거지?
    ja: ライをなぐさめてあげたいの？
  d_nikke_ce009_03_04_42:
    speaker: ce009_03
    en: Yes, my support was insufficient, and I made Rei-san cry.
    ko: 예, 제 서포트가 부족하여 라이를 슬프게 해 버렸으니까요.
    ja: |-
      はい。
      わたしのサポートが至らず、
      ライさんを悲しませてしまいましたから。
  d_nikke_ce009_03_04_43:
    speaker: naga
    en: Then... I think it all comes down to one thing, no matter what world you're
      from.
    ko: 그렇다면… 어느 세상에서 왔든 한 가지로 귀결되지 않을까 싶어.
    ja: |-
      だったら…どんな世界だろうと
      アレで決まりじゃない？
  d_nikke_ce009_03_04_44:
    speaker: naga
    en: Sweet treats.
    ko: 달콤한 디저트.
    ja: 甘～いスイーツ。
  d_nikke_ce009_03_04_45:
    speaker: tia
    en: Oh, you're right. I like sweet treats too!
    ko: 아, 그렇네에. 나도 디저트 좋아하거든~
    ja: |-
      ああ、そうだねぇ。
      私もスイーツ大好きぃ～
  d_nikke_ce009_03_04_46:
    speaker: ce009_03
    en: Sweet treats... I see. Thank you for sharing your insight.
    ko: 달콤한 디저트로군요. 알려 주셔서 감사합니다.
    ja: |-
      甘いスイーツですね。
      教えていただき、ありがとうございます。
  d_nikke_ce009_03_04_47:
    speaker: ce009_03
    en: Is there a dessert shop nearby? I will go there at once.
    ko: 근방에 가게가 있습니까? 다녀오도록 하겠습니다.
    ja: |-
      近くにお店はありますか？
      行ってくるであります。
  d_nikke_ce009_03_04_48:
    speaker: tia
    en: Nah, no need.
    ko: 으응, 그럴 필요 없어.
    ja: |-
      ううん～
      その必要はないよぉ。
  d_nikke_ce009_03_04_49:
    speaker: "<Narration>"
    en: Tia shakes her head before pulling an elegantly wrapped chocolate out of her
      bag.
    ko: |-
      고개를 가로저은 티아는
      가방에서 고급스럽게 포장된 초콜릿을 꺼낸다.
    ja: |-
      首を横に振ったティアが、
      高級そうなラッピングの施された
      チョコレートをカバンから取り出した
  d_nikke_ce009_03_04_50:
    speaker: tia
    en: Just pop this in her mouth.
    ko: 이걸 라이 입에 쏙 넣어줘.
    ja: これをライの口に入れてあげて。
  d_nikke_ce009_03_04_51:
    speaker: tia
    en: I bet that'll make her stop crying!
    ko: 그러면 눈물이 뚝 그칠 거야~
    ja: そうしたら、涙もぴたっと止まるからぁ～
  d_nikke_ce009_03_04_52:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_04_53:
    speaker: ce009_03
    en: Thank you, but are you sure that's okay?
    ko: 감사합니다만, 괜찮은 겁니까?
    ja: 感謝いたしますが、よろしいのですか？
  d_nikke_ce009_03_04_54:
    speaker: ce009_03
    en: Shouldn't these be for the two of you?
    ko: 두 분이 드셔야 할 몫이 아닌지….
    ja: お二人の分なのでは…
  d_nikke_ce009_03_04_55:
    speaker: tia
    en: Hehe, don't worry about it.
    ko: 헤헤, 그건 신경 쓰지 않아도 돼.
    ja: えへへ、そんなの気にしなくていいよぉ。
  d_nikke_ce009_03_04_56:
    speaker: tia
    en: We were planning to stop by a delicious dessert place later anyway.
    ko: 이따가 맛있는 디저트 가게에 가기로 했거든.
    ja: あとでおいしいスイーツ屋さんに行くしぃ。
  d_nikke_ce009_03_04_57:
    speaker: tia
    en: Right, Naga?
    ko: 그렇지, 나가?
    ja: ねぇ、ナガ？
  d_nikke_ce009_03_04_58:
    speaker: naga
    en: Yeah, so don't put so much pressure on yourself.
    ko: 맞아, 그러니 너무 부담 갖지 않아도 돼.
    ja: うん、気にしないでいいよ。
  d_nikke_ce009_03_04_59:
    speaker: naga
    en: You're just helping a friend, that's all.
    ko: 친구를 돕는 일이잖아.
    ja: 友だちのためだから。
  d_nikke_ce009_03_04_60:
    speaker: ce009_03
    en: A friend...
    ko: |-
      친구… 말입니까.
      그렇다면 라이도 분명….
    ja: |-
      友だち…
      ライさんも、確か…
  d_nikke_ce009_03_04_61:
    speaker: rei
    en: "*Sniffle, sniffle*"
    ko: 쿨쩍 쿨쩍.
    ja: グスン、グスン。
  d_nikke_ce009_03_04_62:
    speaker: ce009_03
    en: Rei-san.
    ko: 라이.
    ja: ライさん。
  d_nikke_ce009_03_04_63:
    speaker: rei
    en: N-nngh...
    ko: 흐, 흐윽….
    ja: う、うぅっ…
  d_nikke_ce009_03_04_64:
    speaker: ce009_03
    en: Please lift your head, Rei-san.
    ko: 라이, 고개를 들어 주십시오.
    ja: ライさん、お顔を上げてください。
  d_nikke_ce009_03_04_65:
    speaker: rei
    en: Waaaahhhh!
    ko: 호어어어어어엉.
    ja: ふええええええん…
  d_nikke_ce009_03_04_66:
    speaker: ce009_03
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_04_67:
    speaker: naga
    en: Now's your chance.
    ko: 넣어버리자.
    ja: 入れちゃえば？
  d_nikke_ce009_03_04_68:
    speaker: ce009_03
    en: Understood. Rei-san, please excuse me while I put this in your mouth.
    ko: |-
      알겠습니다.
      실례합니다, 라이. 입 쪽을 만지도록 하겠습니다.
    ja: |-
      そうですね。
      すみません、口を触らせていただきます。
  d_nikke_ce009_03_04_69:
    speaker: "<Narration>"
    en: The chocolate slips into Rei's mouth.
    ko: 쏘옥-
    ja: ポイッ
  d_nikke_ce009_03_04_70:
    speaker: rei
    en: Waaah—Mmph!
    ko: 흐어어어어웁.
    ja: ふええええ…むぐっ。
  d_nikke_ce009_03_04_71:
    speaker: rei
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_04_72:
    speaker: rei
    en: "*Nom, nom*"
    ko: 우물우물….
    ja: もぐもぐ…
  d_nikke_ce009_03_04_73:
    speaker: rei
    en: Mmm...
    ko: 으, 으음….
    ja: んん…
  d_nikke_ce009_03_04_74:
    speaker: rei
    en: Heh... hehe...
    ko: 헤… 헤헤….
    ja: え…えへへ…
  d_nikke_ce009_03_04_75:
    speaker: rei
    en: Hehehehe, this is yummy.
    ko: 으헤헤헤, 맛잇다아.
    ja: えへへへ、おいしい～
  d_nikke_ce009_03_04_76:
    speaker: rei
    en: Can I have one more?
    ko: 하나 더 없어?
    ja: もう1個ないの？
  d_nikke_ce009_03_04_77:
    speaker: ce009_03
    en: Confirmation complete. Rei-san has stopped crying. I am very pleased.
    ko: |-
      라이의 눈물이 멈춘 것을 확인했습니다.
      매우 기쁘군요.
    ja: |-
      ライさんの涙が止まったことを確認。
      とても喜んでいるであります。
  d_nikke_ce009_03_04_78:
    speaker: tia
    en: See? I told you.
    ko: 내 말이 맞지~?
    ja: 言った通りでしょ～？
  d_nikke_ce009_03_04_79:
    speaker: ce009_03
    en: Yes, it was very effective indeed.
    ko: 예, 효과가 확실하군요.
    ja: 効果てきめんであります。
  d_nikke_ce009_03_04_80:
    speaker: "<Narration>"
    en: Once Rei stops crying and returns to class,
    ko: 그렇게 울음을 그친 라이는 수업에 복귀할 수 있었고.
    ja: そうして、泣きやんだライは無事に授業へ戻り…
  d_nikke_ce009_03_04_81:
    speaker: "<Narration>"
    en: Aigis slowly strolls around the campus, taking in the sights of the school.
    ko: |-
      아이기스는 교정을 천천히 거닐며,
      학교의 모습을 견학할 수 있었다.
    ja: |-
      アイギスはキャンパスをゆっくり歩いて、
      学校の様子を見学して回った
d_nikke_ce009_03_05:
  d_nikke_ce009_03_05_1:
    speaker: "<Narration>"
    en: Time passes,
    ko: 그렇게 시간은 흘러.
    ja: それから時は流れ…
  d_nikke_ce009_03_05_2:
    speaker: "<Narration>"
    en: and before long, the school day is over.
    ko: 어느새 하교 시간이 되었다.
    ja: いつの間にか、下校時刻になっていた
  d_nikke_ce009_03_05_3:
    speaker: ein
    en: Huh? Aigis?
    ko: 어라, 아이기스?
    ja: あれ、アイギス？
  d_nikke_ce009_03_05_4:
    speaker: ein
    en: What are you doing here?
    ko: 여기서 뭐 하고 계세요?
    ja: ここで何してるんですか？
  d_nikke_ce009_03_05_5:
    speaker: ce009_03
    en: I was waiting for everyone so that I could express my gratitude and bid you
      farewell.
    ko: |-
      감사를 전하고, 작별 인사를 하기 위해
      여러분을 기다리고 있었습니다.
    ja: |-
      今日のお礼を伝えて…
      お別れの挨拶をするために、
      みなさんを待っていました。
  d_nikke_ce009_03_05_6:
    speaker: ce009_03
    en: "... I don't see Rei-san. Did she leave already?"
    ko: "…라이가 보이지 않는군요. 먼저 간 겁니까?"
    ja: |-
      …ライさんが見当たりませんね。
      先に帰られたのでしょうか？
  d_nikke_ce009_03_05_7:
    speaker: zwei
    en: She has to stay after school because she didn't do her homework.
    ko: 나머지 수업을 하고 계세요. 숙제를 안 해오신 것 때문에요.
    ja: 宿題を忘れた罰で、居残り補習です。
  d_nikke_ce009_03_05_8:
    speaker: ein
    en: We waited as long as we could, but it looks like she's gonna be a while.
    ko: 저희도 최대한 기다려봤는데 늦어지는 것 같더라구요.
    ja: |-
      私たちも待とうと思ったんですけど、
      かなり遅くなるみたいで。
  d_nikke_ce009_03_05_9:
    speaker: ce009_03
    en: "... I see."
    ko: "…그렇습니까."
    ja: "…そうですか。"
  d_nikke_ce009_03_05_10:
    speaker: ce009_03
    en: I was hoping to say goodbye, but that's unfortunate.
    ko: 인사를 드리고 싶었는데, 아쉽게 되었군요.
    ja: ご挨拶したかったのですが、残念です。
  d_nikke_ce009_03_05_11:
    speaker: ein
    en: Yeah, that's a shame.
    ko: 그러게요. 저도 뭔가 아쉬운걸요.
    ja: せっかくなのに、なんか惜しい感じ。
  d_nikke_ce009_03_05_12:
    speaker: ein
    en: We'll pass your regards along to Rei.
    ko: 라이 선배한테는 저희가 안부 전해둘게요.
    ja: ライ先輩には伝えておきます。
  d_nikke_ce009_03_05_13:
    speaker: zwei
    en: Though it was brief, I enjoyed our time together.
    ko: 짧은 시간이었지만 만나서 즐거웠어요.
    ja: 短い時間でしたが、楽しかったです。
  d_nikke_ce009_03_05_14:
    speaker: zwei
    en: I hope we meet again.
    ko: 다음에 또 봐요.
    ja: またお会いしましょう。
  d_nikke_ce009_03_05_15:
    speaker: ce009_03
    en: I had a wonderful time as well. Thank you for teaching me so many things.
    ko: |-
      예, 저도 정말 즐거웠습니다.
      여러 가지 알려 주셔서 감사했습니다.
    ja: |-
      はい。わたしも本当に楽しかったです。
      色々教えていただき、ありがとうございました。
  d_nikke_ce009_03_05_16:
    speaker: ce009_03
    en: Farewell, everyone.
    ko: 그렇다면 모두 안녕히….
    ja: では…みなさん、さよう…
  d_nikke_ce009_03_05_17:
    speaker: "<Narration>"
    en: Just as Aigis steps through the school gate...
    ko: 아이기스가 교문 밖으로 발을 내딛는 순간-
    ja: |-
      アイギスが校門の外に
      足を踏み出そうとした瞬間――
  d_nikke_ce009_03_05_18:
    speaker: rei
    en: Aiiiiigis!
    ko: 아---- 이---- 기---- 스----!
    ja: アーーーイーーーギーーースーーー！
  d_nikke_ce009_03_05_19:
    speaker: ce009_03
    en: Rei-san?
    ko: 라이…?
    ja: ライさん…？
  d_nikke_ce009_03_05_20:
    speaker: "<Narration>"
    en: Aigis turns around to see Rei running toward her as fast as her little legs
      can carry her.
    ko: 뒤를 돌아보자 짧은 다리로 열심히 달려오는 라이가 보인다.
    ja: |-
      振り返ると、短い足で必死に走る
      ライの姿があった
  d_nikke_ce009_03_05_21:
    speaker: rei
    en: Hehe, hehehe.
    ko: 헤헤, 헤헤헤.
    ja: へへ、えへへ。
  d_nikke_ce009_03_05_22:
    speaker: rei
    en: Th-thank goodness... I made it.
    ko: 다, 다행이다아… 늦지 않았어.
    ja: よ、よかったぁ…間に合って。
  d_nikke_ce009_03_05_23:
    speaker: zwei
    en: Rei...?
    ko: 라이 선배…?
    ja: ライ先輩…？
  d_nikke_ce009_03_05_24:
    speaker: ein
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_03_05_25:
    speaker: ein
    en: Rei! Watch your feet!
    ko: 라이 선배! 밑을 봐요! 밑!
    ja: ライ先輩！足もと！危ない！
  d_nikke_ce009_03_05_26:
    speaker: rei
    en: Huh?
    ko: 으응?
    ja: えっ？
  d_nikke_ce009_03_05_27:
    speaker: "<Narration>"
    en: Rei trips
    ko: 툭-
    ja: ガンッ――
  d_nikke_ce009_03_05_28:
    speaker: "<Narration>"
    en: and falls to the ground.
    ko: 쿠당탕-!
    ja: ドテーン！
  d_nikke_ce009_03_05_29:
    speaker: rei
    en: Urghhh...
    ko: 끄으으으….
    ja: ううううっ…
  d_nikke_ce009_03_05_30:
    speaker: "<Narration>"
    en: Aigis helps Rei back to her feet.
    ko: 아이기스가 넘어진 라이를 일으켜 세운다.
    ja: アイギスが転んだライを起こした
  d_nikke_ce009_03_05_31:
    speaker: ce009_03
    en: Based on your physical capabilities, Rei-san, I conclude that you were sprinting
      at full speed just now.
    ko: |-
      라이의 신체 스펙으로 볼 때,
      방금의 속도는 전력 질주였다고 판단됩니다.
    ja: |-
      ライさんの身体数値からするに、
      今のは全力疾走と言うべき
      速度であったと考えます。
  d_nikke_ce009_03_05_32:
    speaker: ce009_03
    en: "... Did you run all the way here just to see me off?"
    ko: "…저를 만나기 위해 달려와 주신 겁니까?"
    ja: |-
      …わたしに会うために、
      走ってきてくださったのですか？
  d_nikke_ce009_03_05_33:
    speaker: rei
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_05_34:
    speaker: rei
    en: Hmph! Of course not!
    ko: 흥! 아니?
    ja: ふんっ！違うよ？
  d_nikke_ce009_03_05_35:
    speaker: ce009_03
    en: "?"
    ko: "?"
    ja: "？"
  d_nikke_ce009_03_05_36:
    speaker: rei
    en: I-I just...
    ko: 그, 그냥!
    ja: た、ただ…！
  d_nikke_ce009_03_05_37:
    speaker: rei
    en: I just thought you'd leave without saying anything, so I came to see for myself.
    ko: 나루 4호가 말도 없이 갈 거 같아서, 구경하러 온 거뿐이야.
    ja: |-
      ナル4号が何も言わずに
      行っちゃいそうだったから、
      様子を見に来ただけだもん。
  d_nikke_ce009_03_05_38:
    speaker: rei
    en: It's not like I came because I'd miss you or anything!
    ko: 절대 아쉽다거나 그래서 따라온 거 아니거든?
    ja: 寂しいとかじゃ、絶対ないよ？
  d_nikke_ce009_03_05_39:
    speaker: ce009_03
    en: "... Very well, I'll accept that."
    ko: "…그런 것으로 해두겠습니다."
    ja: "…そういうことにしておくであります。"
  d_nikke_ce009_03_05_40:
    speaker: ein
    en: "... Clearly she means the opposite."
    ko: "…누가 봐도."
    ja: "…分かりやすいなぁ。"
  d_nikke_ce009_03_05_41:
    speaker: zwei
    en: Yeah...
    ko: "…그러게."
    ja: "…本当に。"
  d_nikke_ce009_03_05_42:
    speaker: rei
    en: So... you're really leaving?
    ko: 그래서, 진짜 간다고?
    ja: でも、ホントに行っちゃうの？
  d_nikke_ce009_03_05_43:
    speaker: ce009_03
    en: Yes. If I don't return soon, my comrades in this world will be worried.
    ko: |-
      예, 서둘러 돌아가지 않으면,
      이 세계의 [동료]들이 걱정할 테니까요.
    ja: |-
      はい、そろそろ戻らないと、
      この世界での「仲間」たちに
      心配されてしまいますから。
  d_nikke_ce009_03_05_44:
    speaker: ein
    en: Return? Back to where?
    ko: 돌아간다니, 어디로 가시는 거예요?
    ja: 戻るって、どこへ？
  d_nikke_ce009_03_05_45:
    speaker: ce009_03
    en: I will be returning to the Commander and the others.
    ko: 지휘관 일행이 있는 곳으로 복귀합니다.
    ja: 指揮官たちのところへ、であります。
  d_nikke_ce009_03_05_46:
    speaker: ce009_03
    en: It is almost time for me to return to my own world. I must begin preparing
      for my departure.
    ko: |-
      원래 세계로 돌아갈 시간이 다가오고 있습니다.
      그래서 그 준비를 할 예정입니다.
    ja: |-
      わたしが元の世界に戻る時間が迫っています。
      ですので、そのための準備をする予定です。
  d_nikke_ce009_03_05_47:
    speaker: zwei
    en: Oh... back to your own world...
    ko: 아… 원래 세계로….
    ja: 元の、世界に…
  d_nikke_ce009_03_05_48:
    speaker: rei
    en: "...!"
    ko: "…!"
    ja: "…！"
  d_nikke_ce009_03_05_49:
    speaker: ein
    en: So this is really goodbye...?
    ko: 그럼, 이별이라는 건가요…?
    ja: じゃあ、これでお別れってこと…？
  d_nikke_ce009_03_05_50:
    speaker: ce009_03
    en: Yes, I must go back to everyone else.
    ko: 네, 모두가 있는 곳으로 돌아가야 합니다.
    ja: |-
      はい。皆さんのところに
      戻らなくてはなりませんので。
  d_nikke_ce009_03_05_51:
    speaker: ein
    en: I see... Got anything you want to say, Rei?
    ko: 그렇군요… 라이 선배는 할 말 없으세요?
    ja: |-
      そっか…ライ先輩、
      何か言い残したことはありません？
  d_nikke_ce009_03_05_52:
    speaker: ein
    en: This might really be goodbye...
    ko: 저 말대로면 오늘이 학교에서의 마지막일 거 같은데….
    ja: |-
      話が本当なら、
      もう会えなくなりそうですけど…
  d_nikke_ce009_03_05_53:
    speaker: rei
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_05_54:
    speaker: rei
    en: H-hmph! It's not like I care!
    ko: 흐, 흥! 따, 딱히?
    ja: ふ、ふんっ！べ、別に？
  d_nikke_ce009_03_05_55:
    speaker: rei
    en: Seniors don't get all sentimental over stuff like this!
    ko: 3학년은 이런 거로 아쉬워하지 않으니까!
    ja: |-
      3年生はこういうことで
      寂しがったりしないもん！
  d_nikke_ce009_03_05_56:
    speaker: ce009_03
    en: Truly remarkable, Rei-san. As the boss of the classroom, your mental fortitude
      is fitting of your title.
    ko: |-
      역시 대단합니다. 라이.
      3학년은 교실의 왕… 왕에 걸맞은 정신력입니다.
    ja: |-
      流石ですね、ライさん。
      3年生は教室の王様…
      王様にふさわしい精神性であります。
  d_nikke_ce009_03_05_57:
    speaker: ce009_03
    en: Thank you all very much for today. I hope we'll meet again someday.
    ko: |-
      그럼 여러분, 오늘 하루 정말 감사했습니다.
      언젠가 다시 만날 수 있다면 좋겠군요.
    ja: |-
      では、皆さん。
      今日1日、本当にありがとうございました。
      またどこかでお会いできれば嬉しいです。
  d_nikke_ce009_03_05_58:
    speaker: "<Narration>"
    en: Aigis makes her way back toward the school gate.
    ko: 아이기스는 다시 교문으로 발걸음을 옮겼다.
    ja: アイギスが再び校門へ足を向けた
  d_nikke_ce009_03_05_59:
    speaker: rei
    en: "..."
    ko: "……."
    ja: "……"
  d_nikke_ce009_03_05_60:
    speaker: rei
    en: N-nngh...
    ko: 우, 우우….
    ja: う、うう…
  d_nikke_ce009_03_05_61:
    speaker: zwei
    en: Rei?
    ko: 라이 선배?
    ja: ライ先輩？
  d_nikke_ce009_03_05_62:
    speaker: rei
    en: Waah...
    ko: 우우우….
    ja: ううう…
  d_nikke_ce009_03_05_63:
    speaker: ce009_03
    en: Waah?
    ko: 우우우?
    ja: ううう？
  d_nikke_ce009_03_05_64:
    speaker: rei
    en: Waaaahhh!
    ko: 흐어어어엉-
    ja: ふええええん！
  d_nikke_ce009_03_05_65:
    speaker: ce009_03
    en: "!"
    ko: "!"
    ja: "！"
  d_nikke_ce009_03_05_66:
    speaker: rei
    en: H-hngh... Aigis, can't you stay?
    ko: 끄, 끄흡… 아이기스, 안 가면 안돼?
    ja: う、うう…アイギス、行かないとダメなの？
  d_nikke_ce009_03_05_67:
    speaker: rei
    en: I-I'm sorry... I've been trying so hard not to cry.
    ko: 미, 미안해. 계속 참고 있었는데….
    ja: ご、ごめん。ずっとガマンしてたんだけど…
  d_nikke_ce009_03_05_68:
    speaker: ce009_03
    en: You did so well. You're amazing, Rei-san.
    ko: 잘 참으셨습니다. 라이는 역시 대단하네요.
    ja: ガマンができて、ライさんは偉かったですね。
  d_nikke_ce009_03_05_69:
    speaker: rei
    en: I brought you here, and ended up just making you do my homework.
    ko: 내가 데려와서 숙제나 시키고….
    ja: 連れてきたのに、宿題なんかさせちゃって…
  d_nikke_ce009_03_05_70:
    speaker: rei
    en: And even though I'm supposed to be a senior, I've been doing nothing but cry
      all day... *Sob*
    ko: 3학년이라 해놓고 계속 우는 모습만 보여주고… 끄윽.
    ja: 3年生なのに、泣き顔ばっかり見せて…ヒック。
  d_nikke_ce009_03_05_71:
    speaker: ce009_03
    en: Not at all. I was very happy to spend that time with you as Naru 4.
    ko: |-
      아닙니다.
      저는 라이를 만나 나루 4호로서 있던 시간이 좋았으니까요.
    ja: |-
      いいえ。
      わたしは、ライさんに出会い、ナル4号として
      学校に連れてきていただいて、良かったです。
  d_nikke_ce009_03_05_72:
    speaker: ce009_03
    en: Thanks to you, I got to experience, observe, and learn things that I could
      only have at a school in the Ark.
    ko: |-
      라이 덕분에 방주의 학교에서만 느낄 수 있는 것들을
      체험하고, 견학하고, 배울 수 있었습니다.
    ja: |-
      ライさんのおかげで、アークの学校でしか
      体験できないことを体験し、見学をし、
      学ぶことができたのですから。
  d_nikke_ce009_03_05_73:
    speaker: rei
    en: "... R-really?"
    ko: "…그, 그래?"
    ja: "…そ、そう？"
  d_nikke_ce009_03_05_74:
    speaker: ce009_03
    en: Yes, so there's no need for you to feel guilty, Rei-san.
    ko: 예, 그러니 라이가 죄책감을 가질 필욘 없습니다.
    ja: |-
      はい。ですから、
      ライさんが罪悪感を抱く必要はありません。
  d_nikke_ce009_03_05_75:
    speaker: ce009_03
    en: We're friends, after all. If we could remain friends even after I return to
      my own world, I would be very happy.
    ko: |-
      저희는 친구이지 않습니까.
      이 세계에서 돌아간 후에도, 그럴 수 있다면 기쁠 것 같습니다.
    ja: |-
      わたしたちは「友だち」…
      学校を出ても、この世界から帰ってからも、
      そうであれたら嬉しいであります。
  d_nikke_ce009_03_05_76:
    speaker: rei
    en: Aigis...
    ko: "…아이기스."
    ja: "…アイギス。"
  d_nikke_ce009_03_05_77:
    speaker: rei
    en: Okay,
    ko: 응, 알겠어.
    ja: うん、分かった。
  d_nikke_ce009_03_05_78:
    speaker: rei
    en: "'cause we're friends!"
    ko: 우린 친구니까!
    ja: 私たち、友だちだから！
  d_nikke_ce009_03_05_79:
    speaker: ce009_03
    en: Hehe...
    ko: 후후….
    ja: ふふっ。
  d_nikke_ce009_03_05_80:
    speaker: ce009_03
    en: I hope we'll meet again someday, Rei-san.
    ko: 또 만나요, 라이.
    ja: また会いましょう、ライさん。
  d_nikke_ce009_03_05_81:
    speaker: ce009_03
    en: Until then,
    ko: 그때까지 [나루 4호] 라는 이름.
    ja: その時まで「ナル4号」という名前は…
  d_nikke_ce009_03_05_82:
    speaker: ce009_03
    en: I'll keep the name "Naru 4" safely stored in my database.
    ko: 데이터베이스에 소중히 남겨둘 테니 말입니다.
    ja: データベースに大切に残しておくであります。
  d_nikke_ce009_03_05_83:
    speaker: "<Narration>"
    en: As the three wave her off,
    ko: 그렇게 아이기스는 손을 흔드는 세 사람을 뒤로한 채.
    ja: こうして、アイギスは手を振る3人を背に…
  d_nikke_ce009_03_05_84:
    speaker: "<Narration>"
    en: Aigis steps through the school gate.
    ko: 교문 밖으로 발걸음을 옮겼다.
    ja: 門の外へと去っていった
