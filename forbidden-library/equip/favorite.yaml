200101:
  name:
    en: Strawberry Fields
    ko: 딸기향 이끌림
    ja: イチゴの香りの誘惑
  description:
    en: |-
      ■ Activates when entering Full Burst. Affects self.
      <color=#00AEFF> DEF ▲ {description_value_01}% for {description_value_02} sec.</color>
      ■ Activates when attacked while in the Attract state. Affects self.
      <color=#00AEFF>Restores {description_value_03}% of the skill user's <word_group=10025>final</word_group> Max HP.</color>
      ■ Activates after landing {description_value_04} normal attacks while in the Attract state. Affects self.
      <color=#00AEFF>Increases the <word_group=10001>stack count of stackable buffs</word_group> by {description_value_05}.</color>
    ko: "■ 풀 버스트 타임 시작 시 자신에게 \n<color=#00AEFF>[방어력 {description_value_01}% ▲] [{description_value_02}초
      유지]</color>\n■ 피격 시 자신이 주목 상태라면 자신에게\n<color=#00AEFF>[시전자의 <word_group=10025>최종</word_group>
      최대 체력 비례 {description_value_03}% 회복]</color>\n■ 일반 공격 {description_value_04}회
      명중 시 자신이 주목 상태라면 자신에게\n<color=#00AEFF>[<word_group=10001>중첩 가능 이로운 효과 중첩량</word_group>
      {description_value_05}개 ▲]</color>"
    ja: |-
      ■フルバーストタイムが発動した時、自分に
      <color=#00AEFF>「防御力{description_value_01}％▲」「{description_value_02}秒間維持」</color>
      ■攻撃を受けた時、自分がヘイト状態なら自分に
      <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_03}％回復」</color>
      ■通常攻撃が{description_value_04}回命中した時、自分がヘイト状態なら自分に
      <color=#00AEFF>「<word_group=10001>スタック可能バフ効果のスタック量</word_group>{description_value_05}個▲」</color>
  info_description:
    en: Skill 1
    ko: 스킬1
    ja: スキル1
200201:
  name:
    en: Invasion
    ko: 인베이젼
    ja: インヴェイジョン
  description:
    en: |-
      ■ Activates when the last bullet hits the target. Affects the target if the skill user is in Collect Hacking Code.
      <color=#00AEFF>ATK ▼ {description_value_01}% for {description_value_02} sec.
      DEF ▼ {description_value_03}% for {description_value_04} sec.</color>
      ■ Activates when entering Full Burst. Affects self.
      <color=#00AEFF>Reload speed is fixed at a {description_value_05}% increase for {description_value_06} sec.</color>
    ko: |-
      ■ 마지막 탄환 명중 시 자신이 해킹 코드 수집 상태라면 대상에게
      <color=#00AEFF>[공격력 {description_value_01}% ▼] [{description_value_02}초 유지]
      [방어력 {description_value_03}% ▼] [{description_value_04}초 유지]</color>
      ■ 풀 버스트 타임 진입 시 자신에게
      <color=#00AEFF>[재장전 속도 {description_value_05}% 증가 상태로 고정] [{description_value_06}초 유지]</color>
    ja: |-
      ■最後の弾丸が命中した時、自分がハッキングコード収集状態なら対象に
      <color=#00AEFF>「攻撃力{description_value_01}％▼」「{description_value_02}秒間維持」
      「防御力{description_value_03}％▼」「{description_value_04}秒間維持」</color>
      ■フルバーストタイム発動時、自分に
      <color=#00AEFF>「リロード速度{description_value_05}％増加状態で固定」「{description_value_06}秒間維持」</color>
  info_description:
    en: Skill 1
    ko: 스킬1
    ja: スキル1
200301:
  name:
    en: "... Ah"
    ko: "…아"
    ja: "…あ"
  description:
    en: |-
      ■ Activates when attacking with Full Charge. Affects all allies.
      <color=#00AEFF>Max HP ▲ {description_value_01}% for {description_value_02} sec.</color>
      ■ Activates when attacking with Full Charge. Affects all allies when in Wake Up status.
      <color=#00AEFF>True Damage ▲ {description_value_03}% for {description_value_04} sec.</color>
    ko: |-
      ■ 풀 차지 공격 시 아군 전체에게
      <color=#00AEFF>[최대 체력 {description_value_01}% ▲] [{description_value_02}초 유지]</color>
      ■ 풀 차지 공격 시 자신이 일어남 상태라면 아군 전체에게
      <color=#00AEFF>[방어력 무시 대미지 {description_value_03}% ▲] [{description_value_04}초 유지]</color>
    ja: |-
      ■フルチャージして攻撃した時、味方全体に
      <color=#00AEFF>「最大HP{description_value_01}％▲」「{description_value_02}秒間維持」</color>
      ■フルチャージして攻撃した時、自分が起きた状態なら味方全体に
      <color=#00AEFF>「防御力無視ダメージ{description_value_03}％▲」「{description_value_04}秒間維持」</color>
  info_description:
    en: Skill 2
    ko: 스킬2
    ja: スキル2
200401:
  name:
    en: Hero Vision
    ko: 히어로 비전
    ja: ヒーロービジョン
  description:
    en: |-
      ■ Activates when attacking with Full Charge. Affects self.
      <color=#00AEFF>Hero Vision: Explosion Radius ▲ {description_value_01}%, stacks up to {description_value_02} time(s) and lasts for {description_value_03} sec.</color>
    ko: |-
      ■ 풀차지 공격 시 자신에게
      <color=#00AEFF>[히어로 비전 : 폭발 범위 {description_value_01}% ▲] [{description_value_02}중첩] [{description_value_03}초 유지]</color>
    ja: |-
      ■フルチャージして攻撃した時、自分に
      <color=#00AEFF>「ヒーロービジョン：爆発範囲{description_value_01}％▲」
      「{description_value_02}スタック」「{description_value_03}秒間維持」</color>
  info_description:
    en: Skill 1
    ko: 스킬1
    ja: スキル1
200501:
  name:
    en: Snake Scale
    ko: 스네이크 스케일
    ja: スネークスケール
  description:
    en: |-
      ■ Affects self.
      <color=#00AEFF>Hit Rate ▲ {description_value_01}% continuously.</color>
      ■ Activates when entering Full Burst. Affects self.
      <color=#00AEFF>Vamp: <word_group=10004>Prevents being targeted by single-target attacks</word_group> continuously. This effect is removed upon taking a direct hit.
      Invulnerable for {description_value_02} sec.</color>
      ■ Activates when using Burst Skill. Affects all allies.
      <color=#00AEFF><word_group=10002>Re-enters Burst</word_group> Stage 2.</color>
    ko: |-
      ■ 자신에게
      <color=#00AEFF>[명중률 {description_value_01}% ▲] [지속]</color>
      ■ 풀 버스트 타임 시작 시 자신에게
      <color=#00AEFF>[애교 : <word_group=10004>1인 공격 대상에서 제외</word_group> 직접 피격 시 해제] [지속]
      [무적] [{description_value_02}초 유지]</color>
      ■ 버스트 스킬 사용 시 아군 전체에게
      <color=#00AEFF>[<word_group=10002>버스트 재진입</word_group> 2단계]</color>
    ja: |-
      ■自分に
      <color=#00AEFF>「命中率{description_value_01}％▲」「持続」</color>
      ■フルバーストタイムが発動した時、自分に
      <color=#00AEFF>「愛嬌：<word_group=10004>単一攻撃対象から除外</word_group>直接攻撃を受けると解除」「持続」
      「無敵」「{description_value_02}秒間維持」</color>
      ■バーストスキルを使用した時、味方全体に
      <color=#00AEFF>「<word_group=10002>バースト再突入</word_group>2段階」</color>
  info_description:
    en: Skill 2
    ko: 스킬2
    ja: スキル2
200601:
  name:
    en: Health Up!
    ko: 헬스업!
    ja: ヘルスアップ！
  description:
    en: |-
      ■ Activates after landing {description_value_01} normal attack(s). Affects all allies.
      <color=#00AEFF>Hit Rate ▲ {description_value_02}% for {description_value_03} sec.</color>
      ■ Activates after landing {description_value_04} normal attack(s). Affects all allies with a Submachine Gun.
      <color=#00AEFF>Hit Rate ▲ {description_value_05}% for {description_value_06} sec.</color>
      ■ Activates after landing {description_value_07} normal attack(s). Affects self.
      <color=#00AEFF>ATK ▲ {description_value_08}% for {description_value_09} sec.</color>
