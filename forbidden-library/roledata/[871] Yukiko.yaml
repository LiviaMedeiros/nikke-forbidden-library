c871_Lobby_Touch_1:
  en: I still can't believe it... This isn't inside the TV, it's... another world,
    isn't it?
  ko: |-
    아직도 믿기지 않지만…
    여긴 TV 속이 아니라, 다른 세계… 인 거지?
  ja: |-
    まだ信じられないけど…
    ここはテレビの中とは違う、他の世界…なんだよね？
c871_Lobby_Touch_2:
  en: I'm doing pretty well thanks to everyone being so kind. Thank you for looking
    out for me.
  ko: |-
    다들 친절하게 대해줘서 편하게 지내고 있어.
    신경 써줘서 고마워.
  ja: |-
    みんな優しいから、気楽に過ごせてるよ。
    気にかけてくれてありがとう。
c871_Lobby_Touch_3:
  en: Oh...! Er, uh... Don't worry about me. I'm just a little nervous being in an
    unfamiliar place.
  ko: |-
    아…! 그, 그게, 신경 쓰지 마.
    낯선 곳에 와서 조금 긴장했을 뿐이니까.
  ja: |-
    あっ…！　えっと、気にしないで。
    知らない場所に来て、
    ちょっと緊張してるだけだから。
c871_Lobby_Touch_Love_1:
  en: I'm totally used to this place now. It's all thanks to you.
  ko: |-
    이곳에도 이제 완전히 익숙해졌어.
    고마워. 네 덕분이야.
  ja: |-
    この場所にもすっかり慣れちゃった。
    ありがとう。あなたのおかげよ。
c871_Lobby_Touch_Love_2:
  en: I'm going to be practicing cooking with Emma. Would you like to come along?
  ko: |-
    이번에 엠마 씨랑 같이 요리 연습을 하게 됐어.
    괜찮으면 같이 갈래?
  ja: |-
    今度、エマさんと一緒に料理の練習をすることになったの。
    よかったら一緒にどう？
c871_Lobby_Touch_Love_3:
  en: Pfft... Oh, sorry. I was thinking of something Neon said earlier. It was just
    something silly... Hahaha.
  ko: |-
    …푸흡. 아, 미안. 아까 네온 씨한테 들은 말이 생각나서.
    그냥 별거 아닌 이야기였는데… 아하하하.
  ja: |-
    …ぷっ。あ、ごめんね。
    さっきネオンさんから聞いた話を思い出しちゃって。
    たいしたことじゃなかったんだけど…あはははっ。
c871_Lobby_Stay_1:
  en: Hm, I wonder what Teddie's up to... Maybe I should go check on him.
  ko: |-
    그러고 보니 곰은 뭐 하고 있으려나…?
    상태 좀 보러 가볼까.
  ja: |-
    そういえば、クマさんは何してるのかな…？
    様子を見に行ってみようっと。
c871_Lobby_Stay_Love_1:
  en: If you have time, would you like to get some fresh air? I've wanted to explore
    the Outpost for a while now. Could you show me around...?
  ko: |-
    시간 괜찮으면 잠깐 바람 쐬지 않을래?
    전부터 이 기지를 한번 탐험해 보고 싶었거든. 안내해 줄 수 있을까…?
  ja: |-
    時間があるなら、少し息抜きしない？
    前からこの基地を探検してみたかったの。案内してもらえるかな…？
c871_Outpost_Touch_1:
  en: The Outpost... So it's like a military base, right? And yet it's so lively...
  ko: |-
    전초기지… 라면, 군대 같은 거지?
    그런데도 이렇게 활기가 넘치다니….
  ja: |-
    前哨基地…ってことは、 軍隊みたいなものだよね？
    それなのに、 こんなに活気づいてるなんて…
c871_Outpost_Touch_2:
  en: Hey, are there any inns in the Ark? If there are... I'd be curious to see one.
  ko: |-
    저기, 방주에도 료칸 같은 게 있을까?
    혹시 있다면… 좀 궁금하네.
  ja: |-
    ねえ、アークには 旅館ってあるのかな？
    もしあるんだったら、 ちょっと気になるなーって。
c871_Outpost_Touch_3:
  en: Wait, there's a haunted place nearby...?! I might be curious to see that...
    Could you take me there?
  ko: |-
    엥, 근처에 심령 스팟이…!?
    그건 좀 궁금할지도… 데려가 줄 수 있어?
  ja: |-
    えっ、近くに心霊スポットが…！？
    それはちょっと気になるかも…連れて行ってもらってもいい？
c871_Gacha_Get_1:
  en: My name is Yukiko Amagi. It is a pleasure to make your... Er, you want me to
    relax? Hehe. Okay. Thanks.
  ko: |-
    아마기 유키코, 라고 합니다. 모쪼록 잘 부탁드리….
    앗. 편하게 하라고? 후후. 고마워, 잘 부탁해.
  ja: |-
    天城雪子、っていいます。何卒よろしく…
    えっ、もっと気楽に？ふふ、ありがとう。よろしくね。
c871_Reinforce_1:
  en: Have I gotten a little stronger?
  ko: 좀 더 강해진 걸까?
  ja: ちょっとは強くなれたかな？
c871_Reinforce_2:
  en: My body feels lighter.
  ko: 몸이 가벼워진 것 같아.
  ja: 体が軽くなった気がする。
c871_Reinforce_3:
  en: Hehe. That's great.
  ko: 후후. 좋았어.
  ja: ふふ、いい感じ。
c871_Gift_1:
  en: I'll put this to good use.
  ko: 소중히 쓸게.
  ja: 大切に使うね。
c871_Gift_2:
  en: I appreciate you taking care of me.
  ko: 챙겨줘서 고마워.
  ja: 気にかけてくれてありがとう。
c871_Gift_3:
  en: This is for me? Hehe, thanks. That makes me happy.
  ko: 나한테 주는 거야? 후후. 기뻐.
  ja: 私にくれるの？ふふ、嬉しい。
c871_Attractive_Up_1:
  en: I'll work hard to repay your kindness.
  ko: 네 친절에 보답할 수 있도록 노력할게.
  ja: あなたの優しさに応えられるよう、頑張るね。
c871_Attractive_Up_2:
  en: Oh right, I've been meaning to get you something... Would a boxed lunch be okay?
    What do you think?
  ko: |-
    아 맞다, 다음에 뭐라도 답례를….
    도시락 같은 거면 괜찮을까? 어때?
  ja: そうだ、今度何かお礼を…お弁当とかあったら助かるかな？　どう？
c871_Attractive_Up_3:
  en: Thank you. I count on you for a lot.
  ko: 고마워. 많이 의지하고 있어.
  ja: ありがとう。頼りにしてるよ。
c871_Party_Deploy_1:
  en: Okay. I'll do what I can.
  ko: 응. 열심히 해볼게.
  ja: うん。頑張るね。
c871_Field_Touch_1:
  en: What is it?
  ko: 무슨 일이야?
  ja: どうしたの？
c871_Field_Go_1:
  en: We just need to go that way, right?
  ko: 저쪽으로 가면 되는 거지?
  ja: あっちに行けばいいんだよね？
c871_Battle_Enter_1:
  en: I just need to do what I practiced...!
  ko: 연습한 대로 하면 될 거야…!
  ja: 練習通りにやれば大丈夫…！
c871_Battle_Ready_1:
  en: I won't lose!
  ko: 지지 않을 거야!
  ja: 負けないよ！
c871_Battle_Ready_2:
  en: Leave it to me!
  ko: 맡겨줘!
  ja: 任せて！
c871_Battle_Ready_3:
  en: I'm ready!
  ko: 준비 완료야!
  ja: 準備完了！
c871_Reload_1:
  en: This is how you do it, right?
  ko: 이렇게 하는 거 맞겠지…!
  ja: これで合ってるよね…！
c871_Reload_2:
  en: Reloading!
  ko: 재정비할게!
  ja: リロードするね！
c871_Reload_3:
  en: Slow and easy, just like I learned...!
  ko: 배운 대로 천천히…!
  ja: 教わった通りに、ゆっくり…！
c871_Ult_Skill_Ready_1:
  en: This is it! Everyone ready?
  ko: 지금이 기회야! 준비됐어?
  ja: |-
    今がチャンスよ！
    準備はいい？
c871_Ult_Skill_1:
  en: Dance, Sakuya!
  ko: 간다, 사쿠야!
  ja: いくよ、サクヤ！
c871_FullBurst_1:
  en: This will end it!
  ko: 이걸로 끝이야!
  ja: おしまいよ！
c871_Kill_Monster_1:
  en: Gotcha!
  ko: 잡았다!
  ja: 当たった！
c871_Kill_Monster_2:
  en: That one's down!
  ko: 쓰러졌어!
  ja: 倒したよ！
c871_Kill_Monster_3:
  en: Nice! Got one!
  ko: 좋아, 적 격파했어!
  ja: やった、敵撃破だね！
c871_Damage_1:
  en: Ah!
  ko: 꺅…!
  ja: きゃっ…！
c871_Damage_2:
  en: Ugh!
  ko: 윽…!
  ja: くっ…！
c871_Damage_3:
  en: Ouch!
  ko: 아팟…!
  ja: 痛っ…！
c871_Die_1:
  en: I can't... move...
  ko: 이제, 움직일 수 없어….
  ja: もう、動けない…
c871_Win_1:
  en: I'll be counting on you next time too. Hehe.
  ko: 다음에도 잘 부탁해. 후후.
  ja: 次も、ごひいきに。ふふ！
