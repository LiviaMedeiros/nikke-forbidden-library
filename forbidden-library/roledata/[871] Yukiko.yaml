  ko: "■ 전투 시작 시 자신에게\n<color=#00AEFF>[페르소나 - 코노하나사쿠야] [지속] [해제 불가] : \n기능 : 페르소나를
    통해 아군을 회복합니다.\n효과 1 : {description_value_01}초 마다 아군 전체에게 [메디아 : 시전자의 <word_group=10025>최종</word_group>
    최대 체력 비례 {description_value_02}% 회복]</color>\n■ 전투 시작 시와 풀 버스트 타임 종료 시 자신에게\n<color=#00AEFF>[공격력
    {description_value_04}% ▲] [{description_value_05}초 유지]</color>\n■ 1 more 적용 시
    적 전체에게\n<color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_03}%
    <word_group=10019>분배 대미지</word_group>]</color>"
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「ペルソナ - コノハナサクヤ」「持続」「解除不可」：
    機能：ペルソナを使って味方を回復する
    効果1：{description_value_01}秒ごとに味方全体に「メディア：スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_02}％回復」</color>
    ■戦闘開始時およびフルバーストタイムが
    終了した時、自分に
    <color=#00AEFF>「攻撃力{description_value_04}％▲」「{description_value_05}秒間維持」</color>
    ■1moreが適用された時、敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_03}％の<word_group=10019>分配ダメージ</word_group>」</color>
