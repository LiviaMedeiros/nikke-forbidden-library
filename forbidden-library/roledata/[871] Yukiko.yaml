---
871_name:
  en: Yukiko
  ko: 유키코
  ja: 雪子
c871_description:
  en: |-
    Her full name is Yukiko Amagi.
    She's a member of the Investigation Team formed by a group of students from Yasogami High School, as well as a Persona user.
    As daughter to the manager of the renowned Amagi Inn, she is undergoing training as its next heir.
    Though quick-witted, she struggles a bit at reading the room and can come across as airheaded.
  ko: |-
    풀네임은 아마기 유키코.
    야소가미 고등학교에 다니는 학생들로 결성된 [자칭 특별수사대]의 일원이자 페르소나 구사자 소녀.
    오래된 고급 여관 [아마기 여관]의 여주인의 딸이며, 현재는 여주인 수업이 한창이다.
    머리 회전이 빠르지만, 분위기를 읽는 데에는 다소 서툰 면이 있으며 약간 천연스러운 성격이다.
  ja: |-
    フルネームは天城雪子。
    八十神高校に通う学生たちで結成された
    「自称特別捜査隊」の一員でペルソナ使いの少女。
    老舗高級旅館「天城屋旅館」の女将の娘であり、
    現在は女将修行の真っ最中。
    頭の回転が速いが、空気を読むことに
    いま一つ疎いところがあり、やや天然気味。
871_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_871:
  en: Yukiko's Spare Body
  ko: 유키코 스페어 바디
  ja: 雪子のスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_mg_down:
  en: Machine Gun
  ko: 머신건
  ja: マシンガン
character_shot_description_localkey_mg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
28712_name:
  en: Scarlet Flower
  ko: 진홍의 꽃
  ja: 真紅の華
28712_description:
  en: "■ Activates at the start of battle. Affects self.\n<color=#00AEFF>Attack Damage
    ▲ {description_value_10}% continuously.</color>\n■ Activates when using Burst
    Skill. \n<color=#00AEFF>Scarlet Flower: This effect is continuous and cannot be
    removed.\nFunction: Yukiko strengthens herself.\nEffect 1: Activates every {description_value_01}
    sec. Affects all allies. Mediarama: Restores HP equal to {description_value_02}%
    of the skill user's <word_group=10025>final</word_group> max HP.\nEffect 2: Affects
    self. Fire Amp: <word_group=10019>Distributed Damage</word_group> ▲ {description_value_03}%
    continuously. This effect cannot be removed.\nEffect 3: Affects self. Scarlet
    Protection: <word_group=10108>Damage taken from Water Code enemies</word_group>
    ▼ {description_value_04}% continuously. This effect cannot be removed.\n<word_group=10097>Deactivation
    condition</word_group>: When Full Burst ends.</color>\n■ Activates when entering
    Burst Stage 3. Affects self.\n<color=#00AEFF><word_group=10009>Elemental Advantage
    Attack Damage</word_group> ▲ {description_value_05}% for {description_value_06}
    sec.</color>\n■ Activates when 1 More takes effect. Affects all <word_group=10082>standard
    Burst {description_value_07} allies</word_group> (except the skill user) in the
    Persona state.\n<color=#00AEFF>Follow Up: ATK ▲ {description_value_08}% of the
    skill user's ATK for {description_value_09} sec.</color>"
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[공격 대미지 {description_value_10}% ▲] [지속]</color>
    ■ 버스트 스킬 사용 시
    <color=#00AEFF>[진홍의 꽃] [지속] [해제 불가] :
    기능 : 자신을 강화합니다.
    효과 1 : {description_value_01}초 마다 아군 전체에게 [메디라마 : 시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_02}% 회복]
    효과 2 : 자신에게 [화염 부스터 : <word_group=10019>분배 대미지</word_group> {description_value_03}%▲] [지속] [해제 불가]
    효과 3 : 자신에게 [진홍의 수호 : <word_group=10108>수냉 코드 적으로부터 받는 대미지</word_group> {description_value_04}% ▼] [지속] [해제 불가]
    <word_group=10097>제거 시점</word_group> : 풀 버스트 타임 종료 시</color>
    ■ 버스트 3단계 진입 시 자신에게
    <color=#00AEFF>[<word_group=10009>우월 코드 공격 대미지</word_group> {description_value_05}% ▲] [{description_value_06}초 유지]</color>
    ■ 1more 적용 시 자신을 제외한 <word_group=10082>기본 버스트 단계가 Step{description_value_07}인</word_group> 페르소나 상태 아군 전체에게
    <color=#00AEFF>[추격 : 시전자 기준 공격력 {description_value_08}% ▲] [{description_value_09}초 유지]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「攻撃ダメージ{description_value_10}％▲」「持続」</color>
    ■バーストスキルを使用した時、
    <color=#00AEFF>「真紅の華」「持続」「解除不可」：
    機能：自分を強化する
    効果1：{description_value_01}秒ごとに味方全体に「メディラマ：スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_02}％回復」
    効果2：自分に「火炎ブースタ：<word_group=10019>分配ダメージ</word_group>{description_value_03}％▲」「持続」「解除不可」
    効果3：自分に「真紅の守護：
    <word_group=10108>水冷コードの敵から受けるダメージ</word_group>{description_value_04}％▼」
    「持続」「解除不可」
    <word_group=10097>解除条件</word_group>：フルバーストタイムが終了した時</color>
    ■バースト3段階突入時、自分に
    <color=#00AEFF>「<word_group=10009>有利コードの攻撃ダメージ</word_group>{description_value_05}％▲」
    「{description_value_06}秒間維持」</color>
    ■1moreが適用された時、自分を除く
    <word_group=10082>基本バースト段階が{description_value_07}の</word_group>ペルソナ状態の
    味方全体に
    <color=#00AEFF>「追撃：スキル発動者基準で
    攻撃力{description_value_08}％▲」「{description_value_09}秒間維持」</color>
