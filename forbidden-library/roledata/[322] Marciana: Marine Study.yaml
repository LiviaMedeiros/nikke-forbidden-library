    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
23222_name:
  en: Penguin Emergency Dispatch
  ko: 펭군 긴급 출동
  ja: ペンくん緊急出動
23222_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Whistle: ATK ▲ {description_value_01}% continuously. Stacks up to {description_value_02} times.
    Whistle stacks ▲ {description_value_03}.</color>
    ■ Activates every time there are {description_value_04} or fewer Raptures present for a period of {description_value_05} sec. Affects self.
    <color=#00AEFF>Whistle: ATK ▲ {description_value_01}% continuously. Stacks up to {description_value_02} times.</color>
    ■ Activates every time there are {description_value_06} or more Raptures present for a period of {description_value_07} sec.
    <color=#00AEFF>Penguin Emergency Dispatch
    Function: Expends Whistle stacks to attack Raptures when there are {description_value_06} or more present.
    Effect 1: Affects all enemies. Deals {description_value_08}% of <word_group=10025>final</word_group> ATK as additional damage.
    Effect 2: Affects self. Whistle stacks ▼ {description_value_09}.</color>
    ■ Only activates when a Rapture appears or is neutralized while there are {description_value_10} or fewer Raptures. Affects self.
    <color=#00AEFF><word_group=10009>Elemental Advantage Attack Damage</word_group> ▲ {description_value_11}% continuously.</color>
  ko: "■ 전투 시작 시 자신에게\n<color=#00AEFF>[휘슬 : 공격력 {description_value_01}% ▲] [{description_value_02}
    중첩] [지속]\n[휘슬 중첩량 {description_value_03}개 ▲]</color>\n■ 랩쳐가 {description_value_04}기
    이하인 상태가 {description_value_05}초간 유지될 때마다 자신에게\n<color=#00AEFF>[휘슬 : 공격력 {description_value_01}%
    ▲] [{description_value_02} 중첩] [지속]</color>\n■ 랩쳐가 {description_value_06}기 이상인
    상태가 {description_value_07}초간 유지될 때마다\n<color=#00AEFF>[펭군 긴급 출동] : \n기능 : 랩쳐가 {description_value_06}기
    이상일 때 휘슬을 소모하여 긴급하게 랩쳐를 공격합니다.\n효과 1 : 적 전체에게 [<word_group=10025>최종</word_group>
    공격력 {description_value_08}% 추가 대미지]\n효과 2 : 자신에게 [휘슬 중첩량 {description_value_09}개
    ▼]</color>\n■ 랩쳐 등장 시와 사망 시 랩쳐가 {description_value_10}기 이하인 상태에 한하여 자신에게\n<color=#00AEFF>[<word_group=10009>우월
    코드 공격 대미지</word_group> {description_value_11}% ▲] [지속]</color>"
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「ホイッスル：攻撃力{description_value_01}％▲」「{description_value_02}スタック」「持続」
    「ホイッスルスタック量{description_value_03}個▲」</color>
    ■ラプチャーが{description_value_04}機以下の状態を{description_value_05}秒間維持するたび、自分に
    <color=#00AEFF>「ホイッスル：攻撃力{description_value_01}％▲」「{description_value_02}スタック」「持続」</color>
    ■ラプチャーが{description_value_06}機以上の状態を{description_value_07}秒間維持するたび
    <color=#00AEFF>「ペンくん緊急出動」：
    機能：ラプチャーが{description_value_06}機以上の時、ホイッスルを消費し、緊急でラプチャーを攻撃する
    効果1：敵全体に「<word_group=10025>最終</word_group>攻撃力の{description_value_08}％の
    追加ダメージ」
    効果2：自分に「ホイッスルスタック量{description_value_09}個▼」</color>
    ■ラプチャーが出現または破壊された時、ラプチャーが{description_value_10}機以下の場合、自分に
    <color=#00AEFF>「<word_group=10009>有利コードの攻撃ダメージ</word_group>{description_value_11}％▲」「持続」</color>
