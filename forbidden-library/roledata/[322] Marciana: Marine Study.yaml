23221_name:
  en: Emergency Whistle
  ko: 이머전시 휘슬
  ja: エマージェンシー・ホイッスル
23221_description:
  en: |-
    ■ Activates when entering Full Burst after this unit uses her Burst Skill. Affects the {description_value_01} enemy unit(s) with the highest <word_group=10025>final</word_group> Max HP.
    <color=#00AEFF>Flagged Target Designation
    Effect 1: Deals {description_value_02}% of <word_group=10025>final</word_group> ATK as additional damage.
    Effect 2: Activates when the target is alive.
    Flagged Target: ATK ▼ {description_value_03}% for {description_value_04} sec.</color>
    ■ Activates <word_group=10077>when an enemy is neutralized</word_group> if the target is in the Flagged Target state. Affects {description_value_01} random enemy unit(s).
    <color=#00AEFF>Flagged Target Designation
    Effect 1: Deals {description_value_02}% of <word_group=10025>final</word_group> ATK as additional damage.
    Effect 2: Activates when the target is alive.
    Flagged Target: ATK ▼ {description_value_03}% for {description_value_04} sec.</color>
    ■ Activates when landing {description_value_08} normal attacks against a target in the High-Risk Target state. Affects the target.
    <color=#00AEFF>Deals {description_value_09}% of <word_group=10025>final</word_group> ATK as additional damage.</color>
  ko: "■ 풀 버스트 타임 시작 시 직전에 자신이 버스트 스킬을 사용했다면 <word_group=10025>최종</word_group> 최대
    체력이 가장 높은 적 {description_value_01}기에게\n<color=#00AEFF>[경계 대상 지정] : \n효과 1 : [<word_group=10025>최종</word_group>
    공격력 {description_value_02}% 추가 대미지]\n효과 2 : 대상 생존 시 [경계 대상 : 공격력 {description_value_03}%
    ▼] [{description_value_04}초 유지]</color>\n■ <word_group=10077>적 사망 시</word_group>
    대상이 경계 대상 상태라면 무작위 적 {description_value_01}기에게\n<color=#00AEFF>[경계 대상 지정] : \n효과
    1 : [<word_group=10025>최종</word_group> 공격력 {description_value_02}% 추가 대미지]\n효과
    2 : 대상 생존 시 [경계 대상 : 공격력 {description_value_03}% ▼] [{description_value_04}초 유지]</color>\n■
    일반 공격 {description_value_08}회 명중 시 대상이 고위험 대상 상태라면 대상에게\n<color=#00AEFF>[<word_group=10025>최종</word_group>
    공격력 {description_value_09}% 추가 대미지]</color>"
  ja: "■フルバーストタイムが発動した時、直前に自分がバーストスキルを使用していれば<word_group=10025>最終</word_group>最大HPが最も高い敵{description_value_01}機に\n<color=#00AEFF>「警戒対象指定」：
    \n効果1：「<word_group=10025>最終</word_group>攻撃力の{description_value_02}％の追加ダメージ」\n効果2：対象が生存している時、「警戒対象：攻撃力{description_value_03}％▼」「{description_value_04}秒間維持」</color>\n■<word_group=10077>敵が破壊された時</word_group>、\n対象が警戒対象状態なら、ランダムな敵{description_value_01}機に\n<color=#00AEFF>「警戒対象指定」：
    \n効果1：「<word_group=10025>最終</word_group>攻撃力の{description_value_02}％の追加ダメージ」\n効果2：対象が生存している時、「警戒対象：攻撃力{description_value_03}％▼」「{description_value_04}秒間維持」</color>\n■通常攻撃が{description_value_08}回命中した時、対象が高リスク対象状態なら、対象に\n<color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_09}％の追加ダメージ」</color>"
