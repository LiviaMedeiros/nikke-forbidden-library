---
322_name:
  en: 'Marciana: Marine Study'
  ko: '마르차나 : 마린 스터디'
  ja: マルチャーナ：マリンスタディ
c322_description:
  en: |-
    Marciana on a graduation trip with her students. Embarrassed by the daring design of her swimsuit, she decided to wear a penguin costume to cover herself.
    The Penguin Squad protecting her is a surprise gift from Rei.
  ko: |-
    학생들과의 졸업 여행에 나선 마르차나.
    파격적인 디자인의 수영복이 부끄러워, 펭귄 옷을 덧입었다.
    그녀를 지키는 펭군 부대는 라이의 깜짝선물이다.
  ja: |-
    生徒たちと卒業旅行に出かけたマルチャーナ。
    大胆な水着は恥ずかしいので、ペンギンの服を重ね着した。
    彼女を守っているペンくんの部隊は
    ライからのサプライズプレゼントだ。
322_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_322:
  en: 'Marciana: Marine Study''s Spare Body'
  ko: '마르차나 : 마린 스터디 스페어 바디'
  ja: マルチャーナ：マリンスタディのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
