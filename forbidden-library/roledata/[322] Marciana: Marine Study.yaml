321_name:
  en: Marciana
  ko: 마르차나
  ja: マルチャーナ
c322_Lobby_Touch_1:
  en: It's reassuring having the Penguin Squad with us.
  ko: 펭군 부대가 함께 있어 든든합니다.
  ja: ペンギン隊が一緒なので、心強いです。
c322_Lobby_Touch_2:
  en: Um... Could you please not call me a penguin?
  ko: 그… 펭귄이라고 부르지 말아 주세요.
  ja: その…ペンギンと呼ぶのはやめてください。
c322_Lobby_Touch_3:
  en: I am always prepared to help my students.
  ko: 언제든지 학생들을 도와줄 준비가 되어있습니다.
  ja: いつでも彼女たちをサポートする準備はできています。
c322_Lobby_Touch_Love_1:
  en: It makes me self-conscious when you stare at me like that. Are you curious about
    my penguin outfit?
  ko: |-
    그렇게 빤히 쳐다보시면… 곤란합니다.
    펭귄 옷이 신기하신가요?
  ja: |-
    そんなに見つめられると…困ります。
    ペンギンの服が珍しいのですか？
c322_Lobby_Touch_Love_2:
  en: Oh dear, this outfit keeps slipping down... Um, i-it's nothing.
  ko: |-
    이런… 옷이 자꾸 흘러내려서….
    아, 아무것도 아닙니다.
  ja: |-
    ああっ…服がズレて…
    な、何でもありません。
c322_Lobby_Touch_Love_3:
  en: Do you like penguins too, Commander? I adore them.
  ko: |-
    지휘관님도 펭귄을 좋아하십니까?
    저는… 아주 많이 좋아합니다.
  ja: |-
    指揮官様もペンギンがお好きなのですか？
    私は…とても好きです。
c322_Lobby_Stay_1:
  en: You go ahead. I'll stay here and keep watch.
  ko: 여긴 제가 지키고 있겠습니다, 다녀오세요.
  ja: ここは私が守ります。どうぞ行ってください。
c322_Lobby_Stay_Love_1:
  en: Will you be much longer, Commander? It's just... the Penguin Squad was wondering
    when you'd be back.
  ko: |-
    지휘관님, 오래 걸리시나요?
    아뇨, 그… 펭군 부대가 궁금해해서 말입니다.
  ja: |-
    指揮官様、長くかかりますか？
    いえ、その…ペンギン隊が気にしておりまして。
c322_Outpost_Touch_1:
  en: Let's avoid going near the school. I'd rather not run into my students dressed
    like this.
  ko: |-
    …학교는 피해 가시죠.
    이 차림으로 학생들과 마주치고 싶지 않습니다.
  ja: |-
    …学校は避けましょう。
    この格好でみんなに 会いたくありません。
c322_Outpost_Touch_2:
  en: Rei gave me this Penguin Squad as a gift. Aren't they adorable?
  ko: |-
    라이가 선물해 준 펭군 부대입니다.
    귀엽지 않나요.
  ja: |-
    ライがプレゼントしてくれた ペンギン隊です。
    可愛らしいでしょう？
c322_Outpost_Touch_3:
  en: Wearing this makes it rather difficult to use my hands.
  ko: 이렇게 입고 입으니, 손을 쓰기가 영 불편하네요.
  ja: この格好だと、 手を使いにくいですね。
c322_Gacha_Get_1:
  en: S-sorry, but I can't take off the penguin outfit.
  ko: 죄, 죄송합니다만… 펭귄 옷은 벗을 수 없습니다.
  ja: す、すみませんが…ペンギンスーツは脱げません。
c322_Reinforce_1:
  en: This should come in very handy for my classes.
  ko: 수업할 때 많은 도움이 되겠군요.
  ja: 授業の役に立ちそうですね。
c322_Reinforce_2:
  en: The Penguin Squad is growing right alongside me too.
  ko: 펭군 부대도 함께 성장하고 있습니다.
  ja: ペンギン隊も一緒に成長しています。
c322_Reinforce_3:
  en: I can be of even greater help to my students going forward. Thank you.
  ko: |-
    앞으로 더욱 많은 학생들에게 도움이 될 수 있을 것 같습니다.
    감사합니다.
  ja: |-
    さらに多くの学生の助けになることができると思います。
    ありがとうございます。
c322_Gift_1:
  en: The Penguin Squad is going to love this.
  ko: 펭군 부대가 좋아하겠네요.
  ja: ペンくんたちが喜びそうですね。
c322_Gift_2:
  en: I wasn't expecting this. When did you have time to prepare this?
  ko: |-
    예상 못 했습니다.
    언제 또 이런 걸 준비하셨습니까.
  ja: |-
    予想もしていませんでした。
    いつこのようなものを用意されたのですか？
c322_Gift_3:
  en: You know precisely what I like... I'm truly grateful.
  ko: |-
    제가 좋아하는 게 뭔지 너무 잘 알고 계시네요.
    …진심으로 감사합니다.
  ja: |-
    私が喜ぶものをよくご存じですね。
    …本当にありがとうございます。
c322_Attractive_Up_1:
  en: I am always grateful to you.
  ko: 언제나 감사하게 생각하고 있습니다.
  ja: いつも感謝しています。
c322_Attractive_Up_2:
  en: I want to continue being someone you can depend on, Commander.
  ko: 앞으로도 지휘관님의 힘이 되고 싶습니다.
  ja: これからも指揮官様のお力になりたいです。
c322_Attractive_Up_3:
  en: Would it be all right if I stayed by your side a little longer? I'd like that.
  ko: |-
    조금 더 이렇게… 곁에 있어도 괜찮을까요?
    그러고 싶습니다.
  ja: |-
    もう少しだけこのまま…そばにいてもいいですか？
    一緒にいたいのです。
c322_Party_Deploy_1:
  en: Penguin Squad, are you ready?
  ko: 펭군 부대, 준비됐습니까?
  ja: ペンギン隊、準備はいいですか？
c322_Field_Touch_1:
  en: Well then, shall we get going?
  ko: 그럼, 출발해 볼까요.
  ja: では、出発しましょう。
c322_Field_Go_1:
  en: Please come this way.
  ko: 이쪽으로 오시면 됩니다.
  ja: どうぞ、こちらへ。
c322_Battle_Enter_1:
  en: Let's begin class.
  ko: 수업, 시작하시죠.
  ja: 授業を始めましょう。
c322_Battle_Ready_1:
  en: Let's go, Penguin Squad!
  ko: 가시죠, 펭군 부대!
  ja: ペンギン隊、行きますよ！
c322_Battle_Ready_2:
  en: I'll show you the power of penguins!
  ko: 펭귄의 힘을 보여드리겠습니다!
  ja: ペンギンの力をお見せしましょう！
c322_Battle_Ready_3:
  en: I will protect my students!
  ko: 학생들을 지켜내겠습니다!
  ja: 生徒たちを守り抜きます！
c322_Reload_1:
  en: Penguin No. 2, back me up.
  ko: 펭군 2호, 서포트를.
  ja: ペンくん2号、サポートを。
c322_Reload_2:
  en: Oh dear, my hands are slipping.
  ko: 이런, 손이 미끄럽습니다.
  ja: あっ、手が滑りました。
c322_Reload_3:
  en: I'll make this quick.
  ko: 빠르게 하겠습니다.
  ja: すぐに終わらせます。
c322_Ult_Skill_Ready_1:
  en: Penguin Squad, ready for action.
  ko: 펭군 부대, 준비 완료입니다.
  ja: ペンギン隊、準備完了です。
c322_Ult_Skill_1:
  en: Why isn't this working...? D-don't look!
  ko: 이게 왜 이렇게 안 되는… 보, 보지 마세요!
  ja: うまく着替えられな…み、見ないでください！
c322_FullBurst_1:
  en: K-keep pushing forward!
  ko: 이, 이대로 밀어붙이는 겁니다!
  ja: こ、このまま押し切りましょう！
c322_Kill_Monster_1:
  en: Well done, Penguin Squad.
  ko: 잘했습니다, 펭군 부대.
  ja: ペンギン隊、よくできました。
c322_Kill_Monster_2:
  en: That's taken care of.
  ko: 처리했습니다.
  ja: 処理しました。
c322_Kill_Monster_3:
  en: There's no need to worry.
  ko: 걱정 마세요.
  ja: 心配いりません。
c322_Damage_1:
  en: Ugh!
  ko: 윽!
  ja: うっ！
c322_Damage_2:
  en: Th-this is nothing.
  ko: 이, 이 정도쯤은.
  ja: こ、これくらいは…
c322_Damage_3:
  en: Ngh!
  ko: 크읏!
  ja: くうっ！
c322_Die_1:
  en: I... only wanted to protect my students...
  ko: 학생들을… 꼭 지켜내고 싶었는데….
  ja: 生徒たちを…守りたかったのに…
c322_Win_1:
  en: Victory to the penguins.
  ko: 펭귄의 승리입니다.
  ja: ペンギンの勝ちです。
322_cv_ja:
  en: 'CV: Konomi Inagaki'
  ko: 'CV : 이나가키 코노미'
  ja: CV：稲垣好
322_cv_ko:
  en: 'CV: Lee Noon-sol'
  ko: 'CV : 이눈솔'
  ja: CV：イ・ヌンソル
322_cv_en:
  en: 'CV: Madeline Dorroh'
  ko: 'CV : 매들린 도로'
  ja: CV：Madeline Dorroh
