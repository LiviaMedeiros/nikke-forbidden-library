---
872_name:
  en: Aigis
  ko: 아이기스
  ja: アイギス
c872_description:
  en: |-
    The seventh-generation Anti-Shadow Suppression Weapon developed by the Kirijo Group.
    As part of the Specialized Extracurricular Execution Squad (SEES), she is an android capable of of summoning a Persona.
    While she initially behaves like a machine, acting in an obedient and overly straightforward manner, she gradually comes to develop human emotions.
  ko: |-
    키리조 그룹이 개발한 대 섀도 특수 제압 병장 제7식.
    페르소나 소환도 가능한 마음을 지닌 인간형 병기로서 [특별과외활동부]에 가입한다.
    처음에는 기계답게 성실하고 직선적인 언행을 보이지만, 점차 인간다운 감정에 눈떠 간다.
  ja: |-
    桐条グループが開発した対シャドウ特別制圧兵装七式。
    ペルソナの召喚も可能な心を持った人型兵器として、「特別課外活動部」に加入する。
    当初は機械らしく、実直な言動をしていくが次第に人間らしい感情に目覚めていく。
872_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_872:
  en: Aigis's Spare Body
  ko: 아이기스 스페어 바디
  ja: アイギスのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_smg_down:
  en: Submachine Gun
  ko: 기관단총
  ja: サブマシンガン
character_shot_description_localkey_smg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
28722_name:
  en: Papillon Heart
  ko: 파피용 하트
  ja: パピヨンハート
28722_description:
  en: |-
    ■ Activates when using Burst Skill as long as this unit is still alive.
    <color=#00AEFF>Papillon Heart: This effect is continuous and cannot be removed.
    Function: Aigis strengthens her allies.
    Effect 1: Affects all allies. Matarukaja: ATK ▲ {description_value_01}% of the skill user's ATK continuously. This effect cannot be removed.
    Effect 2: Affects all allies. Marakukaja: DEF ▲ {description_value_02}% of the skill user's DEF continuously. This effect cannot be removed.
    <word_group=10097>Deactivation condition</word_group>: When Full Burst ends.</color>
  ko: |-
    ■ 버스트 스킬 사용 시 자신이 생존해 있을 때 한하여
    <color=#00AEFF>[파피용 하트] [지속] [해제 불가] :
    기능 : 아군을 강화합니다.
    효과 1 : 아군 전체에게 [마하타루카쟈 : 시전자 기준 공격력 {description_value_01}% ▲] [지속] [해제 불가]
    효과 2 : 아군 전체에게 [마하라쿠카쟈 : 시전자 기준 방어력 {description_value_02}%▲] [지속] [해제 불가]
    <word_group=10097>제거 시점</word_group> : 풀 버스트 타임 종료 시</color>
  ja: |-
    ■バーストスキル使用時、自分が生存している限り
    <color=#00AEFF>「パピヨンハート」「持続」「解除不可」：
    機能：味方を強化する
    効果1：味方全体に「マハタルカジャ：スキル発動者基準で攻撃力{description_value_01}％▲」「持続」「解除不可」
    効果2：味方全体に「マハラクカジャ：スキル発動者基準で防御力{description_value_02}％▲」「持続」「解除不可」
    <word_group=10097>解除条件</word_group>：フルバーストタイムが終了した時</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
28721_name:
  en: 'Persona: Palladion'
  ko: '페르소나 : 팔라디온'
  ja: ペルソナ：パラディオン
28721_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Persona - Palladion: This effect is continuous and cannot be removed.
    Function: Aigis strengthens herself using her Persona.
    Effect 1: Tarukaja: ATK ▲ {description_value_01}% continuously. This effect cannot be removed.
    Effect 2: Rakukaja: DEF ▲ {description_value_02}% continuously. This effect cannot be removed.</color>
  ko: "■ 전투 시작 시 자신에게\n<color=#00AEFF>[페르소나 - 팔라디온] [지속] [해제 불가] : \n기능 : 페르소나를 통해
    자신을 강화합니다.\n효과 1 : [타루카쟈 : 공격력 {description_value_01}% ▲] [지속] [해제 불가]\n효과 2 :
    [라쿠카쟈 : 방어력 {description_value_02}% ▲] [지속] [해제 불가]</color>"
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「ペルソナ - パラディオン」「持続」「解除不可」：
    機能：ペルソナを使って自分を強化する
    効果1：「タルカジャ：攻撃力{description_value_01}％▲」「持続」「解除不可」
    効果2：「ラクカジャ：防御力{description_value_02}％▲」「持続」「解除不可」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
18723_name:
  en: Heat Wave
  ko: 히트 웨이브
  ja: ヒートウェイブ
18723_description:
  en: |-
    ■ Affects all enemies.
    <color=#00AEFF>Deals {description_value_01}% of <word_group=10025>final</word_group> ATK as <word_group=10019>distributed damage</word_group>.</color>
  ko: |-
    ■ 적 전체에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_01}% <word_group=10019>분배 대미지</word_group>]</color>
  ja: |-
    ■敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_01}％の<word_group=10019>分配ダメージ</word_group>」</color>
skill_name_1001:
  en: Burst Skill
  ko: 버스트 스킬
  ja: バーストスキル
material_characterskill_b_r:
  en: Burst Manual I
  ko: 버스트 매뉴얼 I
  ja: バーストマニュアルI
material_characterskill_b_r_desc:
  en: |-
    A manual that provides a summary of how to enhance Nikke's inherent abilities.
    Used when upgrading Burst Skills.

    Obtained from the Simulation Room.
  ko: |-
    니케의 비장의 수를 강화할 방법이 총망라된 매뉴얼입니다.
    버스트 스킬의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの切り札を強化する方法が\n網羅されているマニュアル
    バーストスキルのレベルアップに使用する

    「獲得先」：シミュレーションルーム
material_characterskill_b_sr:
  en: Burst Manual II
  ko: 버스트 매뉴얼 II
  ja: バーストマニュアルII
