  en: Skill Manual III
  ko: 스킬 매뉴얼 III
  ja: スキルマニュアルIII
material_characterskill_a_ssr_desc:
  en: |-
    A manual that provides a summary of how to greatly enhance Nikke's inherent abilities to the fullest extent.
    Used when upgrading skills 1 and 2.

    Obtained from the Simulation Room.
  ko: |-
    니케가 가진 고유 능력을 극한까지 갈고닦을 수 있는 방법이 총망라된 매뉴얼입니다.
    스킬 1, 2의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの固有能力を極限まで磨く方法が網羅されているマニュアル
    スキル1、2のレベルアップに使用する

    「獲得先」：シミュレーションルーム
c872_Lobby_Touch_1:
  en: Like the Nikkes, I too was born for combat. I can fight however much you need
    me to.
  ko: |-
    저 역시 니케와 마찬가지로, 싸우기 위해 태어난 존재입니다.
    전투라면 얼마든지 맡겨주십시오.
  ja: |-
    わたしもニケと同じように、戦うために生まれた存在であります。
    戦闘なら、いくらでもお任せください。
c872_Lobby_Touch_2:
  en: I require nothing aside from mission supplies.
  ko: 임무를 위한 보급 외에는 불필요합니다.
  ja: 任務用の補給以外は、必要ありません。
c872_Lobby_Touch_3:
  en: I must return safely, for the sake of my mission.
  ko: 사명을 위해, 저는 반드시 무사히 귀환해야 합니다.
  ja: 使命のために、わたしは無事に帰還せねばなりません。
c872_Lobby_Touch_Love_1:
  en: Today's mission is to stand by? I see...
  ko: |-
    오늘 임무는 대기입니까?
    …그렇구나ㅡ
  ja: |-
    今日の任務は待機でありますか？
    …なるほどなー。
c872_Lobby_Touch_Love_2:
  en: Not long ago, I had a conversation with Volt-san while Liter-san was performing
    maintenance on me. He told me she's been doing maintenance for decades now, and
    how her skills were... Commander? Why do you look so surprised?
  ko: |-
    얼마 전, 리타 씨에게 정비를 받으면서 볼트 씨와도 이야기를 나눴습니다.
    벌써 수십 년이나 정비를 해 오셨다더니 과연 대단한 실력이셨….
    …지휘관? 왜 그렇게 놀라고 계신 건가요?
  ja: |-
    先日、リターさんに整備してもらいながらボルトさんともお話もしました。
    もう何十年も整備をされているだけあって流石の腕前で…
    指揮官？　なぜそんなに驚いていらっしゃるのでしょうか？
c872_Lobby_Touch_Love_3:
  en: My combat capabilities have been significantly enhanced. Thank you for your
    support.
  ko: |-
    전투 능력이 크게 향상되었습니다.
    지원에 감사드립니다.
  ja: |-
    戦闘能力が大幅に向上しました。
    サポート、感謝いたします。
c872_Lobby_Stay_1:
  en: Standby order acknowledged.
  ko: 대기 명령, 접수했습니다.
  ja: 待機命令、承りました。
c872_Lobby_Stay_Love_1:
  en: It's break time. May I go to the Ark? I have an appointment with Beatrice.
  ko: |-
    휴식 시간이군요. 그럼 방주에 다녀와도 괜찮겠습니까?
    베아트리체 씨와 약속이 있어서요.
  ja: |-
    休憩時間ですね。では、アークに行ってきてもよろしいですか？
    ベアトリーチェさんとの約束がありますので。
c872_Outpost_Touch_1:
  en: No abnormalities detected.
  ko: 이상 없습니다.
  ja: 異常なしであります。
c872_Outpost_Touch_2:
  en: Greetings. I am currently conversing with Max-san and Timi-san. Would you care
    to join us, Commander?
  ko: |-
    안녕하세요. 지금 맥스 씨, 티미 씨와 이야기를 나누고 있습니다.
    지휘관도 괜찮으시다면 함께하시겠습니까?
  ja: |-
    こんにちは。今、マックスさんとティミさんとお話をしています。
    指揮官もよろしければご一緒にどうでしょうか？
c872_Outpost_Touch_3:
  en: I was told this place is a military outpost... Why are there individuals dressed
    in maid outfits, swimsuits, and as bunny girls?
  ko: |-
    여기는 [전초기지]라고 들었는데….
    어째서 메이드복이나 수영복, 바니걸 차림의 분들이 있는 걸까요?
  ja: |-
    ここは『前哨基地』と伺っていたのですが…
    なぜメイド服や水着、バニーガール姿の方がいるのでしょう？
c872_Gacha_Get_1:
  en: I am Aigis, the seventh-generation Anti-Shadow Suppression Weapon. I will be
    joining you for now.
  ko: |-
    대 섀도 특수 제압 병장 제7식·아이기스,
    임시 합류했습니다.
  ja: |-
    対シャドウ特別制圧兵装七式・アイギス、
    臨時合流であります。
c872_Reinforce_1:
  en: Power output has increased.
  ko: 출력, 상승되었습니다.
  ja: 出力、アップであります。
c872_Reinforce_2:
  en: Combat performance has increased.
  ko: 전투 능력이 상승했습니다.
  ja: 戦闘能力が上昇しました。
c872_Reinforce_3:
  en: I can be of greater assistance now.
  ko: 이걸로 좀 더 도움이 될 수 있습니다.
  ja: これでもっとお役に立てます！
c872_Gift_1:
  en: I will put this to good use.
  ko: 유용하게 사용하겠습니다.
  ja: ありがたく使わせていただきます。
c872_Gift_2:
  en: Thank you for replenishing my supplies.
  ko: 물자 보급에 감사드립니다.
  ja: 物資の補給、感謝であります。
c872_Gift_3:
  en: I will prepare something suitable in return.
  ko: 신속히 답례를 준비하겠습니다.
  ja: 迅速にお返しを準備いたします。
c872_Attractive_Up_1:
  en: I will repay the trust you have put in me.
  ko: 당신의 신뢰에 보답하겠습니다.
  ja: あなたの信頼にお応えいたします。
c872_Attractive_Up_2:
  en: Motivation has increased. Currently at 200%.
  ko: 의욕이 상승했습니다. 200%입니다.
  ja: やる気が上昇しました。200％であります。
c872_Attractive_Up_3:
  en: Thank you. I look forward to your continued support.
  ko: 감사합니다. 앞으로도 잘 부탁드립니다.
  ja: ありがとうございます。これからもよろしくお願いします。
c872_Party_Deploy_1:
  en: Ready to deploy.
  ko: 출격 준비 완료입니다.
  ja: 出撃準備完了であります。
c872_Field_Touch_1:
  en: Awaiting instructions.
  ko: 지시를 부탁드립니다.
  ja: 指示をお願いします。
c872_Field_Go_1:
  en: Please leave it to me.
  ko: 맡겨 주십시오.
  ja: お任せください。
c872_Battle_Enter_1:
  en: Orders confirmed. Ready for battle.
  ko: 지시 확인. 전투 준비.
  ja: 指示を確認。戦闘準備。
c872_Battle_Ready_1:
  en: Here we go!
  ko: 갑니다!
  ja: 行きます！
c872_Battle_Ready_2:
  en: Commencing combat!
  ko: 전투 개시입니다!
  ja: 戦闘開始であります！
c872_Battle_Ready_3:
  en: Target locked!
  ko: 목표 포착!
  ja: 目標を捕捉！
c872_Reload_1:
