---
580_name:
  en: Phantom
  ko: 팬텀
  ja: ファントム
c580_description:
  en: |-
    During the day, she's a librarian at the Ark's biggest library.
    At night, she's a phantom thief who punishes evil in the name of justice.
    Though she believes she keeps her nightly activities well hidden, most of the people who should know of it already do.
  ko: |-
    낮에는 방주의 가장 큰 도서관에서 사서로 일하고,
    밤에는 정의를 위해 악한 자들을 벌하는 괴도가 된다.
    본인은 괴도 활동을 하고 있다는 것을 잘 숨기고 있다고 생각하지만, 알 만한 사람들은 대부분 다 알고 있다.
  ja: |-
    昼はアークで最も大きな図書館で司書として働き、
    夜は正義のために悪者を罰する怪盗になる。
    自分では怪盗の活動をうまく隠せていると思っているが、
    ほとんど公然の秘密となっている。
580_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_580:
  en: Phantom's Spare Body
  ko: 팬텀 스페어 바디
  ja: ファントムのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_ar_down:
  en: Assault Rifle
  ko: 소총
  ja: アサルトライフル
character_shot_description_localkey_ar_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
25802_name:
  en: Thief's Vision
  ko: 괴도의 시선
  ja: 怪盗の鑑定眼
25802_description_1:
  en: |-
    ■ Activates when Thief's Dagger is at max stacks. Affects targets in the Calling Card state.
    <color=#00AEFF>Deals {description_value_08}% of <word_group=10025>final</word_group> ATK as additional damage. Removes Calling Card.</color>
    ■ Activates when Thief's Dagger is at max stacks. Removes stacks and affects self.
    <color=#00AEFF><word_group=10019>Distributed Damage</word_group> ▲ {description_value_01}% continuously. Stacks up to {description_value_02} times. Stacks are removed when using Burst Skill.</color>
    ■ Activates after performing {description_value_03} normal attacks. Affects self.
    <color=#00AEFF>ATK ▲ {description_value_04}% for {description_value_05} sec.
    <word_group=10019>Distributed Damage</word_group> ▲ {description_value_06}% for {description_value_07} sec.</color>
  ko: |-
    ■ 자신이 괴도의 단검 최대 중첩 상태라면 예고장 상태의 대상에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_08}% 추가 대미지] [효과 적용 후 예고장 제거]</color>
    ■ 자신이 괴도의 단검 최대 중첩 상태라면 중첩 해제 후 자신에게
    <color=#00AEFF>[<word_group=10019>분배 대미지</word_group> {description_value_01}% ▲] [{description_value_02} 중첩] [버스트 스킬 사용 시 중첩 제거] [지속]</color>
    ■ 일반 공격 {description_value_03}회 공격 시 자신에게
    <color=#00AEFF>[공격력 {description_value_04}% ▲] [{description_value_05}초 유지]
    [<word_group=10019>분배 대미지</word_group> {description_value_06}% ▲] [{description_value_07}초 유지]</color>
  ja: |-
    ■自分が怪盗の短剣フルスタック状態なら、
    予告状状態の対象に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_08}％の追加ダメージ」
    「効果発動後予告状解除」</color>
    ■自分が怪盗の短剣フルスタック状態なら、
    スタック解除後自分に
    <color=#00AEFF>「<word_group=10019>分配ダメージ</word_group>{description_value_01}％▲」
    「{description_value_02}スタック」
    「バーストスキル使用時スタック解除」「持続」</color>
    ■通常攻撃で{description_value_03}回攻撃した時、自分に
    <color=#00AEFF>「攻撃力{description_value_04}％▲」「{description_value_05}秒間維持」
    「<word_group=10019>分配ダメージ</word_group>{description_value_06}％▲」「{description_value_07}秒間維持」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
25801_name:
  en: Thief's Calling Card
  ko: 괴도의 예고장
  ja: 怪盗の予告状
25801_description_1:
  en: |-
    ■ Activates when landing a normal attack on a Rapture that is not in the Calling Card state. Affects the target.
    <color=#00AEFF>Calling Card: DEF ▼ {description_value_01}% for {description_value_02} sec.</color>
    ■ Activates when landing a normal attack on a Rapture that is not in the Calling Card state. Affects self.
    <color=#00AEFF>Thief's Dagger: Hit Rate ▲ {description_value_03}%. Stacks up to {description_value_04} times and lasts for {description_value_05} sec.</color>
    ■ Activates when landing a normal attack on a target that is in the Calling Card state. Affects self.
    <color=#00AEFF>Attack Damage ▲ {description_value_06}% for {description_value_07} round(s).</color>
  ko: |-
    ■ 일반 공격 명중 시 대상이 예고장 상태가 아닌 랩쳐라면 대상에게
    <color=#00AEFF>[예고장 : 방어력 {description_value_01}% ▼] [{description_value_02}초 유지]</color>
    ■ 일반 공격 명중 시 대상이 예고장 상태가 아닌 랩쳐라면 자신에게
    <color=#00AEFF>[괴도의 단검 : 명중률 {description_value_03}% ▲] [{description_value_04} 중첩] [{description_value_05}초 유지]</color>
    ■ 일반 공격 명중 시 대상이 예고장 상태라면 자신에게
    <color=#00AEFF>[공격 대미지 {description_value_06}% ▲] [{description_value_07}발 유지]</color>
  ja: |-
    ■通常攻撃が命中した時、対象が
    予告状状態ではないラプチャーなら
    対象に
    <color=#00AEFF>「予告状：防御力{description_value_01}％▼」「{description_value_02}秒」</color>
    ■通常攻撃が命中した時、
    予告状状態ではないラプチャーなら自分に
    <color=#00AEFF>「怪盗の短剣：命中率{description_value_03}％▲」
    「{description_value_04}スタック」「{description_value_05}秒間維持」</color>
    ■通常攻撃が命中した時、
    対象が予告状状態なら自分に
    <color=#00AEFF>「攻撃ダメージ{description_value_06}％▲」「{description_value_07}発間維持」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
15803_name:
  en: 'Secret Trick: Rampage of Thieves'
  ko: 비기 괴도 난무
  ja: 秘技・怪盗乱舞
15803_description:
  en: |-
    ■ Affects all enemies.
    <color=#00AEFF>Deals {description_value_01}% of <word_group=10025>final</word_group> ATK as <word_group=10019>distributed damage</word_group>.</color>
  ko: |-
    ■ 적 전체에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_01}% <word_group=10019>분배 대미지</word_group> ]</color>
  ja: |-
    ■敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_01}％の<word_group=10019>分配ダメージ</word_group>」</color>
skill_name_1001:
  en: Burst Skill
  ko: 버스트 스킬
  ja: バーストスキル
material_characterskill_b_r:
  en: Burst Manual I
  ko: 버스트 매뉴얼 I
  ja: バーストマニュアルI
material_characterskill_b_r_desc:
  en: |-
    A manual that provides a summary of how to enhance Nikke's inherent abilities.
    Used when upgrading Burst Skills.

    Obtained from the Simulation Room.
  ko: |-
    니케의 비장의 수를 강화할 방법이 총망라된 매뉴얼입니다.
    버스트 스킬의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの切り札を強化する方法が\n網羅されているマニュアル
    バーストスキルのレベルアップに使用する

    「獲得先」：シミュレーションルーム
material_characterskill_b_sr:
  en: Burst Manual II
  ko: 버스트 매뉴얼 II
  ja: バーストマニュアルII
material_characterskill_b_sr_desc:
  en: |-
    A manual that provides a summary of how to greatly enhance Nikke's inherent abilities.
    Used when upgrading Burst Skills.

    Obtained from the Simulation Room.
  ko: |-
    니케의 비장의 수를 더욱더 강화할 방법이 총망라된 매뉴얼입니다.
    버스트 스킬의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの切り札をさらに強化する方法が\n網羅されているマニュアル
    バーストスキルのレベルアップに使用する

    「獲得先」：シミュレーションルーム
material_characterskill_water:
  en: P.S.I.D. Code Manual
  ko: P.S.I.D. 코드 매뉴얼
  ja: P.S.I.D.コードマニュアル
material_characterskill_water_desc:
  en: |-
    A manual only for Nikkes with P.S.I.D. code.
    It is not available for Nikkes with other codes.
    Used when upgrading skills.
  ko: "P.S.I.D. 코드가 내장된 니케 전용으로 만들어진 매뉴얼입니다. \n다른 코드가 내장된 니케는 사용할 수 없으니 주의를 요합니다.\n스킬
    레벨 업에 사용됩니다."
  ja: |-
    P.S.I.D.コードが搭載されたニケ専用のマニュアル
    他のコードが搭載されたニケは使えないので注意が必要
    スキルのレベルアップに使用する
material_characterskill_b_ssr:
  en: Burst Manual III
  ko: 버스트 매뉴얼 III
  ja: バーストマニュアルIII
material_characterskill_b_ssr_desc:
  en: |-
    A manual that provides a summary of how to enhance Nikke's inherent abilities to the fullest extent.
    Used when upgrading Burst Skills.

    Obtained from the Simulation Room.
  ko: |-
    니케의 비장의 수를 극한까지 강화할 방법이 총망라된 매뉴얼입니다.
    버스트 스킬의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの切り札を極限まで強化する方法が\n網羅されているマニュアル
    バーストスキルのレベルアップに使用する

    「獲得先」：シミュレーションルーム
material_characterskill_a_r:
  en: Skill Manual I
  ko: 스킬 매뉴얼 I
  ja: スキルマニュアルI
material_characterskill_a_r_desc:
  en: |-
    A manual that provides a summary of how to enhance Nikke's inherent abilities.
    Used when upgrading skills 1 and 2.

    Obtained from the Simulation Room.
  ko: |-
    니케가 가진 고유 능력을 갈고닦을 수 있는 방법이 총망라된 매뉴얼입니다.
    스킬 1, 2의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの固有能力を磨く方法が網羅されているマニュアル
    スキル1、2のレベルアップに使用する

    「獲得先」：シミュレーションルーム
