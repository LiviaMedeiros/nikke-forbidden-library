  en: 'Snow White: Heavy Arms'
  ko: '스노우 화이트 : 헤비암즈'
  ja: スノーホワイト：ヘビーアームズ
472_name:
  en: 'Scarlet: Goddeath'
  ko: '홍련 : 신살'
  ja: 紅蓮：神殺
c473_Lobby_Touch_1:
  en: I was just offering my morning prayers... It is good to see you, Believer, hehe.
  ko: "새로운 아침의 기도를 올리며… \n반가운 형제님께 인사드려요, 후후."
  ja: |-
    新たな朝の祈りを捧げ…
    親愛なるブラザーにごあいさついたします。ふふ。
c473_Lobby_Touch_2:
  en: I feel completely different with all the improvements to my mobility! I'm sure
    I'll be able to take care of everyone even better now.
  ko: |-
    이렇게 뛰어난 기동력이라니… 완전히 새로운 감각이에요!
    형제자매님들을 더 잘 보살필 수 있겠어요.
  ja: |-
    こんなに機動力が上がるなんて、今までにない気分です！
    みなさんのお力になれそうです。
c473_Lobby_Touch_3:
  en: My twelve thousand sisters are always with me, here in my heart.
  ko: |-
    제 마음속에는 언제나…
    일만 이천의 자매님들이 함께 한답니다.
  ja: |-
    私の心の中にはいつも…
    1万と2千人の姉妹たちが共にいます。
c473_Lobby_Touch_Love_1:
  en: The time has come to turn to the next page. I cannot wait to see what story
    unfolds together with you.
  ko: |-
    이제 다음 페이지를 넘길 때가 왔어요.
    형제님과 함께 감상하고 싶네요.
  ja: |-
    そろそろ次のページをめくる時が来ました。
    ブラザーと一緒に見届けたいものですね。
c473_Lobby_Touch_Love_2:
  en: I'm happy we were able to meet again after so long, Believer. You've grown even
    more impressive... just like me, hehe.
  ko: |-
    오랜만에 만나 뵈어서 기뻐요, 형제님.
    더 멋진 모습으로 성장하셨네요? 꼭 지금의 저처럼요, 후후.
  ja: |-
    久しぶりにお会いできて嬉しいです、ブラザー。
    より素敵に成長されましたね？まるで今の私のように、ふふ。
c473_Lobby_Touch_Love_3:
  en: My staff has a lot of uses, you know. It even has some... special features.
  ko: "제 지팡이는 참 쓸 데가 많아요~ \n특수한 기능도 달려있답니다?"
  ja: |-
    私の杖には、色々な使い道があるのですよ。
    特殊な機能もついています。
c473_Lobby_Stay_1:
  en: Oh my... Are we trying out a little abandonment play...? You are... such a tease...
  ko: 어머나, 이건… 방치 플레이인가요…? 애태우시네요….
  ja: |-
    あら、これは…放置プレイというものですか…？
    私は今、焦らされているのでしょうか…
c473_Lobby_Stay_Love_1:
  en: I'll wait patiently for you. Take your time and come back safely.
  ko: |-
    참을성 있게 기다릴게요.
    조급해하지 마시고, 안전하게 돌아오세요.
  ja: |-
    ずっとお待ちしています。
    焦らず、安全にお戻りください。
c473_Outpost_Touch_1:
  en: I imagine many sisters now call this their home and hold it dear... It is all
    thanks to you, Believer.
  ko: |-
    이곳을 고향 삼아 마음을 두고 있는 자매님들이 참 많겠어요.
    그건 분명 형제님 덕분이겠죠?
  ja: |-
    ここを故郷と思い、心を寄せている 姉妹たちも多いのでしょうね。
    きっとこれも、 ブラザーのおかげでしょう。
c473_Outpost_Touch_2:
  en: One day, when the fighting is over, I'd like to spend a normal day here with
    everyone.
  ko: |-
    언젠가… 모든 싸움이 끝나면,
    다 함께 이곳에서 아주 평범한 하루를 보내고 싶네요.
  ja: |-
    いつか… すべての戦いが終わったら…
    みんなと一緒に、ここで ごく平凡な一日を 過ごしたいものですね。
c473_Outpost_Touch_3:
  en: As always, there are so many great places to pray here. It'll make it easy to
    clear my mind and get centered.
  ko: |-
    여전히 이곳엔 기도드리기 좋은 장소가 참 많네요.
    차분히 마음속을 정리할 수 있겠어요~
  ja: |-
    相変わらず、 ここは祈りを捧げるのに
    良い場所がたくさんありますね。
    落ち着いて 心の整理ができそうです。
c473_Gacha_Get_1:
  en: I'm so happy to see you again. Let us walk together in light's embrace.
  ko: |-
    다시 만나 뵈어서 다행이에요.
    자, 함께 가죠. 빛의 가호 속으로.
  ja: |-
    またお会いできてうれしいです。
    さあ、共に参りましょう。光の加護のもとへ。
c473_Reinforce_1:
  en: Your gentle touch makes both my heart and my body flutter...!
  ko: 신사적인 손길에 몸도 마음도…!
  ja: その紳士的な手つきに、身も心も…！
c473_Reinforce_2:
  en: You know my body so well...
  ko: 제 몸을 너무 잘 아시네요….
  ja: 私の身体のことを、よくご存じなのですね…
c473_Reinforce_3:
  en: My strength grows thanks to you, Believer. Did something of yours also grow...?
    Hehe... Hehehe...
  ko: |-
    형제님 덕분에 제 힘이 더 커지고 있어요.
    혹시 형제님도 커지셨나요? 후우, 후우.
  ja: |-
    ブラザーのおかげで、私の力がさらに大きくなっています。
    もしや、ブラザーも大きくなりましたか？はぁ、はぁ。
c473_Gift_1:
  en: Thank you so much for this. I will use it where I think it is most needed.
  ko: "챙겨주셔서 감사해요. \n오래 고민하고, 가장 필요한 곳에 쓸게요."
  ja: |-
    お気遣いありがとうございます。
    しっかりと考え、一番必要なところで使いますね。
c473_Gift_2:
  en: Bombarding me with thoughtful gifts...?! If your plan is to conquer me, Believer...
    it's working...!
  ko: 이렇게 다정한 선물 공세라니…! 이러다간 함락 당해요…!
  ja: |-
    こんなに思いやりのあるプレゼントで攻められてしまったら…！
    落とされてしまいます…！
c473_Gift_3:
  en: You have to give me a chance to repay your kindness someday, okay?
  ko: 형제님, 언젠가 제게도 꼭 보답할 기회를 주셔야 해요?
  ja: ブラザー。いつか私にも、必ずお返しの機会をくださいね？
c473_Attractive_Up_1:
  en: Your kindness always warms my heart. It gets me warmer... and warmer... until...!
  ko: |-
    형제님의 다정함에, 제 마음도 따뜻해지네요~
    따뜻하게… 달아오르다가… 결국엔…!
  ja: |-
    ブラザーの優しさに、私の心まで温かくなります。
    温かく…火照って…最後には！
c473_Attractive_Up_2:
  en: Your words and actions... they're always quite the saving grace for me.
  ko: 형제님의 말과 행동들이… 제게 큰 구원이 된답니다.
  ja: ブラザーの言葉や行動は…私にとって大きな救いになります。
c473_Attractive_Up_3:
  en: Somewhere along the line, my heart became entirely yours. What in the world
    did you do to me, Believer? Hehe.
  ko: |-
    어느새 형제님께 제 마음을 다 빼앗겨 버렸네요.
    형제님, 대체 절 어떻게 하신 거예요? 후후.
  ja: |-
    いつの間にか、ブラザーにすっかり心を奪われてしまいましたね。
    いったい私に何をされたのですか？ふふ。
c473_Party_Deploy_1:
  en: Don't worry. I am here for you.
  ko: 제가 있으니 안심하시길.
  ja: 私がいます、ご安心を。
c473_Field_Touch_1:
  en: Did you call for me? Hehe.
  ko: 부르셨나요? 후후.
  ja: お呼びですか？ふふ。
c473_Field_Go_1:
  en: This way is open.
  ko: 이쪽으로 길이 열렸어요.
  ja: 道が開かれました。
c473_Battle_Enter_1:
  en: It's about to begin. Be careful, everyone.
  ko: 곧 시작이네요, 다들 조심해요.
  ja: まもなく始まります。みなさん、気を付けてください。
c473_Battle_Ready_1:
  en: I won't let a single person's blood be spilled.
  ko: 그 누구도 피 흘릴 일은 없을 거예요.
  ja: 誰一人、血を流すことはありません。
c473_Battle_Ready_2:
  en: I'll protect you, no matter where you are.
  ko: 어디에 계시든, 제가 지켜드릴게요.
  ja: どこにいても、私がお守りします。
c473_Battle_Ready_3:
  en: With this new strength, I hope to embrace everyone...
  ko: 새로운 힘으로, 모두를 감쌀 수 있기를….
  ja: 新たな力で、皆さんを包み込めますように…
c473_Reload_1:
  en: Shall we catch our breath?
  ko: 잠깐 숨 좀 고를까요?
  ja: ひと息つきましょうか？
c473_Reload_2:
  en: It's important to rest.
  ko: 쉬어가는 시간도 필요하답니다.
  ja: 休憩の時間も必要ですよ。
c473_Reload_3:
  en: Reloading...! I'm spent. Spent...?
  ko: 가득 채울게요~ 헉, 가득 채운다…?
  ja: いっぱいにしますね。はっ、いっぱいにする…？
c473_Ult_Skill_Ready_1:
  en: I'm prepared.
  ko: 준비됐답니다.
  ja: 準備はできました。
c473_Ult_Skill_1:
  en: Into the light... Garden of Arcadia!
  ko: 빛을 따라서, 가든 오브 아르카디아.
  ja: 光の導きを、ガーデンオブアルカディア。
c473_FullBurst_1:
  en: Let us become one!
  ko: 모두 하나 될 시간이에요!
  ja: みんなが一つになる時間です！
c473_Kill_Monster_1:
  en: Hehe.
  ko: 후훗.
  ja: ふふっ。
c473_Kill_Monster_2:
  en: Wonderful.
  ko: 좋네요.
  ja: いいですね。
c473_Kill_Monster_3:
  en: Oh my.
  ko: 어머나.
  ja: あら。
c473_Damage_1:
  en: Ngh.
  ko: 윽.
  ja: うっ。
c473_Damage_2:
  en: Ow.
  ko: 아읏.
  ja: あうっ。
c473_Damage_3:
  en: So rough...!
  ko: 격하네요…!
  ja: 激しいですね…！
c473_Die_1:
  en: It cannot end like this...!
  ko: 이렇게 끝낼 수는 없어요…!
  ja: このまま終わるわけにはいきません…！
c473_Win_1:
  en: I knew we would win, because I trusted in you. Hehe.
  ko: 후후. 형제님을 믿었던 만큼, 이길 줄 알고 있었답니다?
  ja: ふふ、ブラザーならきっと勝てると信じていました。
