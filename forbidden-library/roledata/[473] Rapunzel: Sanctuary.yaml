14733_description:
  en: |-
    ■ Activates when this unit is not in the Nanoparticle Consumption state.
    <color=#00AEFF>Effects vary according to the number of incapacitated allies. Only one set of effects is applied.
    Activates if {description_value_08} or more allies are incapacitated. Affects all incapacitated allies.
    Nanoparticle Injection: Revives with {description_value_01}% HP. Activates once per battle.
    ATK ▲ {description_value_02}% of the skill user's ATK for {description_value_03} sec. Activates once per battle.
    DEF ▲ {description_value_04}% of the skill user's DEF for {description_value_05} sec. Activates once per battle.

    Activates if {description_value_09} or fewer allies are incapacitated. Affects all allies.
    ATK ▲ {description_value_06}% of the skill user's ATK for {description_value_07} sec.</color>

    ■ Activates when this unit is in the Nanoparticle Consumption state. Affects all allies.
    <color=#00AEFF>ATK ▲ {description_value_06}% of the skill user's ATK for {description_value_07} sec.</color>
  ko: |-
    ■ 자신이 나노 입자 소모 상태가 아니라면
    <color=#00AEFF>[전투 불능 아군 수량 별 효과] [해당되는 효과만 적용]
    전투 불능 상태인 아군이 {description_value_08}기 이상이라면 전투 불능 상태 아군 전체에게
    [나노 입자 투여 : 체력 {description_value_01}%로 부활] [전투 중 1회 발동]
    [시전자 기준 공격력 {description_value_02}% ▲] [{description_value_03}초 유지] [전투 중 1회 발동]
    [시전자 기준 방어력 {description_value_04}% ▲] [{description_value_05}초 유지] [전투 중 1회 발동]

    전투 불능 아군이 {description_value_09}기 이하라면 아군 전체에게
    [시전자 기준 공격력 {description_value_06}% ▲] [{description_value_07}초 유지]</color>

    ■ 자신이 나노 입자 소모 상태라면 아군 전체에게
    <color=#00AEFF>[시전자 기준 공격력 {description_value_06}% ▲] [{description_value_07}초 유지]</color>
  ja: |-
    ■自分がナノ粒子消耗状態でなければ
    <color=#00AEFF>「戦闘不能者数別の効果」
    「該当効果のみ適用」
    戦闘不能状態の味方が{description_value_08}機以上の場合、
    戦闘不能状態の味方全体に
    「ナノ粒子投与：HP{description_value_01}％で復活」「戦闘中1回発動」
    「スキル発動者基準で攻撃力{description_value_02}％▲」
    「{description_value_03}秒間維持」「戦闘中1回発動」
    「スキル発動者基準で防御力{description_value_04}％▲」
    「{description_value_05}秒間維持」「戦闘中1回発動」

    戦闘不能状態の味方が{description_value_09}機以下の場合、
    味方全体に
    「スキル発動者基準で攻撃力{description_value_06}％▲」
    「{description_value_07}秒間維持」</color>

    ■自分がナノ粒子消耗状態なら、味方全体に
    <color=#00AEFF>「スキル発動者基準で攻撃力{description_value_06}％▲」
    「{description_value_07}秒間維持」</color>
