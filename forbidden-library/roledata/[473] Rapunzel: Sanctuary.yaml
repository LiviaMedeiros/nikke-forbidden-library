  ja: スキル2
24731_name:
  en: Divine Light
  ko: 디바인 라이트
  ja: ディヴァインライト
24731_description:
  en: |-
    ■ Activates when performing a Full Charge attack. Affects all allies.
    <color=#00AEFF>Restores HP equal to {description_value_01}% of the skill user's <word_group=10025>final</word_group> max HP.</color>
    ■ Activates when entering Full Burst. Affects self and all allies in the <word_group=10111>Into the Fray</word_group> state.
    <color=#00AEFF>Attack Damage ▲ {description_value_02}% for {description_value_03} sec.</color>
    ■ Activates when using Nanoparticle Injection. Affects self.
    <color=#00AEFF><word_group=10031>Cooldown</word_group> of Burst Skill ▲ {description_value_04} sec. This effect cannot be removed.
    Nanoparticle Consumption: DEF ▲ {description_value_05}%. This effect is continuous and cannot be removed. Effect persists after revival.</color>
    ■ Activates only when at Full Charge during a Full Charge attack. Affects self.
    <color=#00AEFF>Gains <word_group=10092>immunity to effects that increase charge speed</word_group>. This effect is continuous.
    Gains <word_group=10093>immunity to effects that decrease charge speed</word_group>. This effect is continuous.</color>
  ko: |-
    ■ 풀 차지 공격 시 아군 전체에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_01}% 회복]</color>
    ■ 풀 버스트 타임 시작 시 자신과 <word_group=10111>임전</word_group> 상태인 아군 전체에게
    <color=#00AEFF>[공격 대미지 {description_value_02}% ▲] [{description_value_03}초 유지]</color>
    ■ 나노 입자 투여 사용 시 자신에게
    <color=#00AEFF>[버스트 스킬 <word_group=10031>재사용 시간</word_group> {description_value_04}초 ▲] [해제 불가]
    [나노 입자 소모 : 방어력 {description_value_05}% ▲] [지속] [해제 불가] [부활 시 유지]</color>
    ■ 풀 차지 시 자신이 풀 차지 상태일 때 한하여 자신에게
    <color=#00AEFF>[<word_group=10092>차지 속도 증가 효과 면역</word_group>] [지속]
    [<word_group=10093>차지 속도 감소 효과 면역</word_group>] [지속]</color>
  ja: |-
    ■フルチャージして攻撃した時、味方全体に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_01}％回復」</color>
    ■フルバーストタイムが発動した時、
    自分と<word_group=10111>臨戦</word_group>状態の味方全体に
    <color=#00AEFF>「攻撃ダメージ{description_value_02}％▲」「{description_value_03}秒間維持」</color>
    ■ナノ粒子投与を使用した時、自分に
    <color=#00AEFF>「バーストスキル<word_group=10031>クールタイム</word_group>{description_value_04}秒▲」
    「解除不可」
    「ナノ粒子消耗：防御力{description_value_05}％▲」「持続」「解除不可」「復活後も維持」</color>
    ■フルチャージした時、自分がフルチャージ状態の時に限り自分に
    <color=#00AEFF>「<word_group=10092>チャージ速度増加効果無効</word_group>」「持続」
    「<word_group=10093>チャージ速度減少効果無効</word_group>」「持続」</color>
