473_name:
  en: 'Rapunzel: Sanctuary'
  ko: '라푼젤 : 생츄어리'
  ja: ラプンツェル：サンクチュアリ
c473_description:
  en: Rapunzel's mobility has greatly increased thanks to Red Shoes's parts. She now
    appears more divine than ever, and grants salvation to her enemies with her new
    staff that is capable of dismantling even nanomachines with its vibrations.
  ko: |-
    레드 슈즈의 파츠로 인해 기동력이 크게 향상된 라푼젤.
    한층 더 성스러워진 모습.
    나노머신마저 분해하는 초진동 지팡이로 적에게 구원을 선사한다.
  ja: |-
    レッドシューズのパーツによって
    機動力が大幅に向上したラプンツェル。
    さらに神聖な姿となった。ナノマシンさえも
    分解する超振動の杖で敵に救いをもたらす。
473_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_473:
  en: 'Rapunzel: Sanctuary''s Spare Body'
  ko: '라푼젤 : 생츄어리 스페어 바디'
  ja: ラプンツェル：サンクチュアリのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_rl_up:
  en: Rocket Launcher
  ko: 런처
  ja: ロケットランチャー
character_shot_description_localkey_rl_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
24732_name:
  en: Celestial Haven
  ko: 셀레스티얼 헤이븐
  ja: セレスティアルヘヴン
24732_description:
  en: |-
    ■ Activates when Full Charge is maintained for {description_value_01} or more seconds while this unit is not in the Goddess Blessing state. Affects self.
    <color=#00AEFF>Creates a shared <word_group=10023>shield</word_group> with HP equal to {description_value_02}% of the skill user's <word_group=10025>final</word_group> max HP that protects all allies from damage. This shield is removed when charging ends.</color>
    ■ Activates when Full Charge is maintained for {description_value_01} or more seconds while this unit is not in the Goddess Blessing state. Affects all allies.
    <color=#00AEFF>Goddess Blessing: DEF ▲ {description_value_03}% of the skill user's DEF for {description_value_04} sec.</color>
    ■ Activates when entering Full Burst. Affects self and all allies in the <word_group=10111>Into the Fray</word_group> state.
    <color=#00AEFF>ATK ▲ {description_value_05}% of the skill user's ATK for {description_value_06} sec.</color>
    ■ Activates when performing a Full Charge attack. Affects the enemy nearest to the crosshair.
    <color=#00AEFF>Deals {description_value_07}% of <word_group=10025>final</word_group> ATK as additional damage.</color>
  ko: |-
    ■ 풀 차지 상태를 {description_value_01}초 이상 유지 시 자신이 갓데스 블레싱 상태가 아니라면 자신에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_02}% 공용 <word_group=10023>보호막</word_group>] [차지 종료 시 제거]</color>
    ■ 풀 차지 상태를 {description_value_01}초 이상 유지 시 자신이 갓데스 블레싱 상태가 아니라면 아군 전체에게
    <color=#00AEFF>[갓데스 블레싱 : 시전자 기준 방어력 {description_value_03}% ▲] [{description_value_04}초 유지]</color>
    ■ 풀 버스트 타임 시작 시 자신과 <word_group=10111>임전</word_group> 상태인 아군 전체에게
    <color=#00AEFF>[시전자 기준 공격력 {description_value_05}% ▲] [{description_value_06}초 유지]</color>
    ■ 풀 차지 공격 시 조준선에 가장 가까운 적 1기에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_07}% 추가 대미지]</color>
  ja: |-
    ■フルチャージ状態を{description_value_01}秒以上維持した時、
    自分がゴッデスブレッシング状態でなければ、
    自分に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_02}％の共用<word_group=10023>バリア</word_group>」
    「チャージ終了時に解除」</color>
    ■フルチャージ状態を{description_value_01}秒以上維持した時、
    自分がゴッデスブレッシング状態でなければ
    味方全体に
    <color=#00AEFF>「ゴッデスブレッシング：
    スキル発動者基準で防御力{description_value_03}％▲」
    「{description_value_04}秒間維持」</color>
    ■フルバーストタイムが発動した時、
    自分と<word_group=10111>臨戦</word_group>状態の味方全体に
    <color=#00AEFF>「スキル発動者基準で攻撃力{description_value_05}％▲」「{description_value_06}秒間維持」</color>
    ■フルチャージして攻撃した時、
    照準線に最も近い敵1機に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力{description_value_07}％追加ダメージ」</color>
skill_name_1003:
  en: Skill 2
