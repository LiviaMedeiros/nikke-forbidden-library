15833_name:
  en: Radiant Youth
  ko: 빛나는 청춘
  ja: 輝く青春
15833_description:
  en: |-
    ■ Affects self.
    <color=#00AEFF>Making Memories
    Function: Enhances attack capabilities.
    Effect 1: Critical Rate ▲ {description_value_01}% continuously.
    Effect 2: Reloads {description_value_02} round(s).
    Effect 3: Attack Damage ▲ {description_value_03}% continuously.</color>
    ■ Affects all enemies.
    <color=#00AEFF>Deals {description_value_04}% of <word_group=10025>final</word_group> ATK as Burst Skill damage.</color>
  ko: |-
    ■ 자신에게
    <color=#00AEFF>[추억 남기기] :
    기능 : 자신의 공격 능력 강화.
    효과1 : [크리티컬 확률 {description_value_01}% ▲] [지속]
    효과2 : [탄환 충전 {description_value_02}발]
    효과3 : [공격 대미지 {description_value_03}% ▲] [지속]</color>
    ■ 적 전체에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_04}% 버스트 스킬 대미지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「思い出作り」：
    機能：自分の攻撃能力強化
    効果1：「クリティカル確率{description_value_01}％▲」
    「持続」
    効果2：「弾丸チャージ{description_value_02}発」
    効果3：「攻撃ダメージ{description_value_03}％▲」
    「持続」</color>
    ■敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_04}％の
    バーストスキルダメージ」</color>
