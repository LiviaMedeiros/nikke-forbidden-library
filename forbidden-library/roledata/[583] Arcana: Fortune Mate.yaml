    ■ 행복한 기억 적용 시 자신에게
    <color=#00AEFF>[청춘의 기록 : 일반 공격 대미지 {description_value_03}% <word_group=10029>배율</word_group> ▲] [{description_value_04} 중첩] [지속]</color>
    ■ 풀 버스트 타임 종료 시 자신에게
    <color=#00AEFF>[추억 남기기 해제]
    [청춘의 기록 해제]</color>
  ja: |-
    ■フルバーストタイムが終了した時、
    ショットガンを所持する味方全体に
    <color=#00AEFF>「スキル発動者基準で攻撃力{description_value_01}％×
    大切な思い出のスタック数▲」
    「{description_value_02}秒間維持」</color>
    ■幸せな思い出を適用時、自分に
    <color=#00AEFF>「青春の記録：
    通常攻撃ダメージ{description_value_03}％<word_group=10029>倍率</word_group>▲」
    「{description_value_04}スタック」「持続」</color>
    ■フルバーストタイムが終了した時、自分に
    <color=#00AEFF>「思い出作り解除」
    「青春の記録解除」</color>
