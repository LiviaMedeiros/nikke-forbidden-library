---
583_name:
  en: 'Arcana: Fortune Mate'
  ko: '아르카나 : 포츈 메이트'
  ja: アルカナ：フォーチュンメイト
c583_description:
  en: A mysterious and pretty transfer student who started attending the M.M.R. Vocational
    School. Although her stated purpose is to organize the old files in the library,
    all she really thinks about is making the most out of the only youth she'll ever
    have in life.
  ko: |-
    미미르 부속 고등학교에 등장한 수수께끼의 미소녀 전학생.
    일단은 학교 도서실의 오래된 자료를 정리하기 위해 왔지만,
    머릿속엔 인생에 단 한 번뿐인 청춘을 즐길 생각만이 가득하다.
  ja: |-
    M.M.R.附属高校に登場した謎の美少女転校生。
    学校の図書室の古い資料を整理するという目的で来たが、
    人生でたった一度の青春を謳歌することで頭がいっぱいだ。
583_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_583:
  en: 'Arcana: Fortune Mate''s Spare Body'
  ko: '아르카나 : 포츈 메이트 스페어 바디'
  ja: アルカナ：フォーチュンメイトのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sg_down:
  en: Shotgun
  ko: 샷건
  ja: ショットガン
character_shot_description_localkey_sg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
25832_name:
  en: Memories and Moments
  ko: 기억과 추억
  ja: 記憶と思い出
25832_description:
  en: |-
    ■ Activates when performing normal attacks while in Making Memories status. Affects self.
    <color=#00AEFF>Effect changes according to the number of attacks. The effect of each phase does not stack. <word_group=10100>Resets</word_group> when Making Memories is removed.
    Two times: Reloads {description_value_01} round(s).
    Four times: Happy Memories: Number of <word_group=10038>pellets</word_group> ▲ {description_value_02} continuously, stacks up to {description_value_03} time(s).
    Six times: Precious Moments: ATK ▲ {description_value_04}% continuously, stacks up to {description_value_05} time(s).</color>
    ■ Activates when using Burst Skill. Affects all shotgun-wielding allies (except self).
    <color=#00AEFF>Attack Damage ▲ {description_value_06}% for {description_value_07} sec.</color>
  ko: |-
    ■ 일반 공격 시 자신이 추억 남기기 상태라면 자신에게
    <color=#00AEFF>[공격 횟수 별 효과] [단계별 효과만 적용] [추억 남기기 해제 시 <word_group=10100>초기화</word_group>]
    2회 : [탄환 충전 {description_value_01}발]
    4회 : [행복한 기억 : <word_group=10038>펠릿</word_group> 개수 {description_value_02}개 ▲] [{description_value_03} 중첩] [지속]
    6회 : [소중한 추억 : 공격력 {description_value_04}% ▲] [{description_value_05} 중첩] [지속]</color>
    ■ 버스트 스킬 사용 시 자신을 제외한 샷건 소지 아군 전체에게
    <color=#00AEFF>[공격 대미지 {description_value_06}% ▲] [{description_value_07}초 유지]</color>
  ja: |-
    ■通常攻撃時、自分が思い出作り状態なら、
    自分に
    <color=#00AEFF>「攻撃回数別の効果」
    「各段階の効果のみ適用」
    「思い出作り解除時<word_group=10100>初期化</word_group>」
    2回：「弾丸チャージ{description_value_01}発」
    4回：「幸せな思い出：<word_group=10038>ペレット</word_group>数{description_value_02}個▲」
    「{description_value_03}スタック」「持続」
    6回：「大切な思い出：攻撃力{description_value_04}％▲」
    「{description_value_05}スタック」「持続」</color>
    ■バーストスキルを使用した時、自分を除く
    ショットガンを所持する味方全体に
    <color=#00AEFF>「攻撃ダメージ{description_value_06}％▲」「{description_value_07}秒間維持」</color>
