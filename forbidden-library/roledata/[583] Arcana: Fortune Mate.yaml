580_name:
  en: Phantom
  ko: 팬텀
  ja: ファントム
581_name:
  en: Arcana
  ko: 아르카나
  ja: アルカナ
582_name:
  en: Label
  ko: 레이블
  ja: レーベル
c583_Lobby_Touch_1:
  en: Should we run away together? Our youth is short, we can't stay trapped in this
    tiny classroom forever.
  ko: |-
    저희, 같이 도망칠래요?
    청춘은 짧은데, 이런 좁은 교실에 계속 갇혀있을 순 없잖아요.
  ja: |-
    私たち、一緒に抜け出しませんか？
    青春は短いのに、こんな狭い教室で閉じこもってられませんっ！
c583_Lobby_Touch_2:
  en: Ooh, this angle's great! Let me take a quick photo.
  ko: |-
    오~ 지금 구도 좋은데요?
    사진 한 장 찍어줄게요.
  ja: |-
    ああ～！その構図、素敵ですね？
    一枚撮らせてください。
c583_Lobby_Touch_3:
  en: Hey, did you do your homework...? I didn't do mine. Will you take the blame
    with me?
  ko: |-
    있잖아요, 숙제했어요…?
    저 안 했는데, 같이 혼나주면 안 돼요…?
  ja: |-
    宿題って、やりました…？
    やってないので、一緒に怒られてくれませんか…？
c583_Lobby_Touch_Love_1:
  en: I've always wanted to go on a date in our uniforms. What do you say? Will you
    be my boyfriend?
  ko: |-
    저, 교복 데이트 로망 있는데.
    어때요? 제 남친 하실래요?
  ja: |-
    私、制服デートが憧れなんです。
    なので、よければ付き合ってもらえませんか？
c583_Lobby_Touch_Love_2:
  en: If you were my teacher, at least I'd get to see you every day.
  ko: |-
    그쪽이 선생님이면,
    얼굴 보는 재미라도 있을 텐데.
  ja: あなたが先生だったら、顔を眺めてるだけで楽しそうなのに。
c583_Lobby_Touch_Love_3:
  en: Quick question! Are you dating anyone? This is more important to me than the
    test!
  ko: |-
    질문 있어요! 지금 사귀는 사람 있어요?
    저한테는 시험 보다 더 중요한 문제거든요?
  ja: |-
    質問で～す！今付き合ってる人はいますか？
    私にとっては、試験より大事な問題なんです。
c583_Lobby_Stay_1:
  en: Excuse me! I'm right here! You didn't forget me, did you?
  ko: 저기요~ 저 여기 있어요~ 잊으신 거 아니죠?
  ja: あの～ここに私がいること…忘れてないですよね？
c583_Lobby_Stay_Love_1:
  en: I skipped class to come here, but you aren't going to look at me? Even when
    I look this cute? Seriously?
  ko: |-
    수업도 땡땡이치고 왔는데, 안 봐줄 거예요?
    이렇게 예쁜데? 진짜로?
  ja: |-
    授業もサボってきたのに、見てくれないんですか？
    こんなにかわいくしてきたのに？ホントに？
c583_Outpost_Touch_1:
  en: I'm late, I'm late! Wait, I'm out of bread?
  ko: |-
    지각이야, 지각~
    아, 식빵이 없네.
  ja: |-
    遅刻、遅刻～！
    あっ、食パン忘れちゃった。
c583_Outpost_Touch_2:
  en: Let's take a picture together. I like the buildings here. They're so pretty.
  ko: |-
    우리, 같이 사진 찍어요.
    여기 건물이 예뻐서, 마음에 들어.
  ja: |-
    ここで記念写真を撮りましょう。
    建物がきれいで、好きなんです。
c583_Outpost_Touch_3:
  en: You know, I think going on a secret date here would be pretty fun.
  ko: |-
    솔직히, 여기서 몰래 데이트하는 거
    좀 재미있어요.
  ja: |-
    正直、秘密のデートみたいで
    ちょっと楽しいです。
c583_Gacha_Get_1:
  en: Let's have the best days of our lives.
  ko: 그쪽, 저랑 같이 눈부신 청춘을 한 번 만들어 보실래요?
  ja: 私と一緒に、キラキラの青春を過ごしてみませんか？
c583_Reinforce_1:
  en: I think I prefer being the one protected.
  ko: 저는 보호받는 쪽이 더 좋은데 말이에요.
  ja: 私は守られたい方なんですけどね。
c583_Reinforce_2:
  en: Have you ever heard of the Invincible High School Girl?
  ko: 무적의 여고생! 이라고 들어보셨나요?
  ja: 無敵の女子高生！ってよく聞きません？
c583_Reinforce_3:
  en: I can't get too smart! I think being a little airheaded is kinda attractive.
  ko: |-
    너무 똑똑해지면 안 되는데~
    저는 살짝 바보 같은 게 또 매력이거든요.
  ja: |-
    賢くなりすぎたらどうしましょう～
    チャームポイントが無くなっちゃうかも？
c583_Gift_1:
  en: This must be how people ask each other out these days. I love it.
  ko: |-
    요새는 이런 식으로 데이트 신청을 하나 봐.
    …되게 좋네.
  ja: |-
    こういうデートの申し込み方が流行りなんですね。
    …とっても素敵です。
c583_Gift_2:
  en: Do you maybe like me? You always give me such perfect gifts, so I was just wondering...
  ko: |-
    혹시 저 좋아해요?
    다른 뜻은 없고, 너무 내 취향으로만 선물을 주니까….
  ja: |-
    私のこと、好きなんですか？
    好みに合ったプレゼントばっかりなんて…
c583_Gift_3:
  en: I got you a gift too. Go on, open it. I'm waiting.
  ko: |-
    저도 그쪽을 위해 선물 하나 준비했어요.
    …뭐해요, 안 풀어보고. 그쪽 바로 앞에 서있잖아요.
  ja: |-
    私もプレゼントを用意したんです。
    …早く受け取ってください。目の前に立ってますよ？
c583_Attractive_Up_1:
  en: I like you. I could say it a hundred, even a thousand times.
  ko: 좋아해요. 백 번이고 천 번이고 말할 수 있어.
  ja: 好きです。何百回でも、何千回でも言えます。
c583_Attractive_Up_2:
  en: Ugh! I can't take it anymore. I just want to shower you with kisses!
  ko: 으윽…! 이제 한계예요, 마구마구 뽀뽀하고 싶다구요!
  ja: ううっ…！もう限界です。キスさせてください！
c583_Attractive_Up_3:
  en: Are you even human? Seriously, how can you be this cool?
  ko: |-
    사람이 어떻게 그래요, 네?
    적당히 멋있어야지 진짜.
  ja: |-
    責任取ってくださいよ、もう。
    カッコよすぎるのがいけないんです。
c583_Party_Deploy_1:
  en: But I'm a high schooler. Do I really have to go...?
  ko: 저 학생인데? 진짜 가요…?
  ja: 私、学生なんですけど？本当に…？
c583_Field_Touch_1:
  en: Yes...?
  ko: 네에…?
  ja: 呼びました…？
c583_Field_Go_1:
  en: Aww, I don't wanna go...
  ko: 이잉, 가기 싫어~
  ja: え～ん、行きたくな～い！
c583_Battle_Enter_1:
  en: All right, fine. Come at me!
  ko: 어쩔 수 없죠, 다 덤벼요!
  ja: 仕方ないですね、やっちゃいますよ！
c583_Battle_Ready_1:
  en: I'm putting my trust in you...!
  ko: 그쪽만 믿을게요…!
  ja: あなたを信じます…！
c583_Battle_Ready_2:
  en: Witness the Invincible High School Girl!
  ko: 무적의 여고생을 보여드리죠!
  ja: 無敵の女子高生をお見せします！
c583_Battle_Ready_3:
  en: "*Huff... huff...!* I've got this!"
  ko: 후우…! 후우…! 힘내라, 나 자신!
  ja: はぁ…！はぁ…！頑張れ、私！
c583_Reload_1:
  en: One, two...!
  ko: 하나, 두울…!
  ja: ひとつ、ふたつ…！
c583_Reload_2:
  en: Am I doing this right? Really?
  ko: 이거 맞아요? 진짜?
  ja: これで合ってますか？ホントに？
c583_Reload_3:
  en: Wait... I need a breather.
  ko: 잠시만… 나 숨 좀 쉴게요.
  ja: 待って…深呼吸しますね。
c583_Ult_Skill_Ready_1:
  en: I'm ready.
  ko: 준비됐어요.
  ja: 準備できました。
c583_Ult_Skill_1:
  en: I'll treasure this moment forever.
  ko: 이 순간, 평생 간직할게요.
  ja: この瞬間、一生大切にします。
c583_FullBurst_1:
  en: Here it comes! My finishing move!
  ko: 가라! 마지막 필살기!
  ja: 行きます！必殺技でフィニッシュです！
c583_Kill_Monster_1:
  en: Did you see that? Did you see it?
  ko: 봤죠? 봤죠!
  ja: わっ！見てました！？
c583_Kill_Monster_2:
  en: All right!
  ko: 오예!
  ja: やったぁ！
c583_Kill_Monster_3:
  en: Are there any more?
  ko: 더 있어요?
  ja: まだいるんですか？
c583_Damage_1:
  en: Eek!
  ko: 꺅!
  ja: きゃっ！
c583_Damage_2:
  en: Oww...
  ko: 우엥….
  ja: うえ～ん…
c583_Damage_3:
  en: Hmph!
  ko: 힝!
  ja: あーん！
c583_Die_1:
  en: I didn't... want you to see me like this...
  ko: 이런 모습… 보이고 싶지 않았는데….
  ja: こんな姿…見せたくなかったのに…
c583_Win_1:
  en: Class is over! Can we go have fun now? Please?
  ko: 수업, 끝! 이제 진짜 놀러 가는 거죠? 응?
  ja: 授業はおしまい！早く遊びに行きましょう～！いいですよねっ？
583_cv_ja:
  en: 'CV: Natsumi Murakami'
  ko: 'CV : 무라카미 나츠미'
  ja: CV：村上奈津実
