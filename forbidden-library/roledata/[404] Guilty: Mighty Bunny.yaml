c404_Lobby_Touch_1:
  en: I even get to be a bunny girl now that I'm rehabilitated... How fascinating...
  ko: 갱생하니까 바니걸도 돼보네에… 신기하다아….
  ja: |-
    バニーガールになるなんて、更生する前は考えもしなかったわ…
    不思議…
c404_Lobby_Touch_2:
  en: Will I be able to properly handle this outfit...?
  ko: 내가 이 옷은 잘 제어할 수 있을까아…?
  ja: 私、この服をちゃんと制御できるかしら…
c404_Lobby_Touch_3:
  en: Once this is over... will you remove my restraints?
  ko: 이번 일만 잘 끝나면 그때는 풀어주는거야아…?
  ja: |-
    今回の仕事が無事に終わったら…
    私を解放してくれる…？
c404_Lobby_Touch_Love_1:
  en: I guess you like this kind of position, Counselor...
  ko: 교관은… 이런 자세를 좋아하나봐아….
  ja: 教官って…こういう体勢が好きなのね…
c404_Lobby_Touch_Love_2:
  en: Think you'll be able to handle me even in this outfit...?
  ko: 내가 이 옷까지 입었는데도 날 감당할 수 있겠어어…?
  ja: こんな服を着てるけど…我慢できるのかしらぁ…？
c404_Lobby_Touch_Love_3:
  en: Aren't you being a little too handsy just because I'm tied up...?
  ko: 묶여있다고 너무 만지는 거 아니야아…?
  ja: 拘束されてるからって…好き勝手触りすぎじゃない…？
c404_Lobby_Stay_1:
  en: I'm bored... You know, I could easily break free from these...
  ko: 심심한데에... 나 이거 끊을 수 있는데에….
  ja: 退屈だわ…これ、外しちゃおうかしら…
c404_Lobby_Stay_Love_1:
  en: If I stay put, you'll hold my hand, right...? Then I'll be good and wait...
  ko: 여기 가만히 있으면 교관이 손 잡아주는 거지이…? 그럼 나 잘 기다려볼게에….
  ja: |-
    ここでじっとしてれば教官が手を握ってくれるのよね…？
    それなら大人しく待ってるわ…
c404_Outpost_Touch_1:
  en: I think I'm starting to get used to this place...
  ko: 이제 여기도 조금 익숙한 거 같아아….
  ja: ここにもだんだん慣れてきたかも…
c404_Outpost_Touch_2:
  en: There are others wearing outfits like mine... How curious...
  ko: 나랑 비슷한 옷을 입은 애들도 있네에… 신기하다아….
  ja: |-
    私と同じような服を 着てる子たちもいるのね…
    不思議だわ…
c404_Outpost_Touch_3:
  en: I wonder what everyone else does for fun around here...
  ko: 다른 애들은 여기서 뭐하고 놀려나아….
  ja: 他のみんなは ここで何して遊んでるのかしら…
c404_Gacha_Get_1:
  en: What do you think, Counselor? It's my first time dressing up as a bunny girl,
    so I'm feeling a little awkward...
  ko: 교과안… 어때? 바니걸은 처음이라 조금 어색하네에….
  ja: |-
    教官…どう？
    バニーガールなんて初めてだから慣れないわ…
c404_Reinforce_1:
  en: Who knows what I might be capable of...? You'd better stay right by my side,
    Counselor...
  ko: 내가 무슨 짓을 할 줄 알고오… 교관, 내 옆에 잘 붙어있어야돼애…
  ja: |-
    私って何をするか分からないわよねぇ…
    教官、私の隣から離れないでね…
c404_Reinforce_2:
  en: I don't think I should try to get any stronger than this... Are you sure this
    is okay?
  ko: 여기서 더 강해지면 안될 것 같은데에… 괜찮겠어?
  ja: これ以上強くなったらダメなのに…本当に大丈夫？
c404_Reinforce_3:
  en: What if I become too strong... and make people afraid of bunny girls...?
  ko: 너무 세져서어… 사람들이 바니걸을 무서워하면 어떡하지이…?
  ja: |-
    強くなりすぎちゃって…
    みんながバニーガールを怖がるようになったらどうしよう…？
c404_Gift_1:
  en: Whoa... Thanks, Counselor. What would you like me to do now?
  ko: 우와아… 고마워, 교과안… 이제 내가 뭐하면 돼?
  ja: |-
    わぁ…ありがとう、教官…
    私は何をすればいいの？
c404_Gift_2:
  en: You must really like my outfit... That's why you're giving me this gift, right?
  ko: 교관도 이 옷이 마음에 들었구나아… 그래서 선물 주는 거 맞지이…?
  ja: |-
    教官もこの服が気に入ったのね…
    だからプレゼントをくれたんでしょ…？
c404_Gift_3:
  en: I feel like luck has been on my side ever since I became a bunny girl...
  ko: 바니걸이 되고 더 행운이 따라오는 것 같아아….
  ja: バニーガールになってからもっと運が良くなった気がするわ…
c404_Attractive_Up_1:
  en: I'll do anything for you... Just call for me, Counselor...
  ko: 교관이 부르며언… 내가 뭐든 해줄게에….
  ja: 教官が呼ぶなら…何でもしてあげる…
c404_Attractive_Up_2:
  en: I can't help wanting more of you, Counselor... You'll keep holding my hand,
    right?
  ko: 자꾸만 교관한테 욕심이 나아… 그래도 계속 손 잡아줄거지이…?
  ja: |-
    ますます教官が欲しくなってきちゃった…
    それでも手を握っててくれる…？
c404_Attractive_Up_3:
  en: I heard bunny girls bring good luck... I'll share mine with you, Counselor.
  ko: 바니걸이 행운을 가져다 준댔어어… 교관한테 행운을 줄게에….
  ja: |-
    バニーガールは幸運を運んでくれるんですって…
    教官に幸運をあげるわ…
c404_Party_Deploy_1:
  en: What do you need me to do this time...?
  ko: 이번엔 뭘 하면 돼애...?
  ja: 今度は何をすればいいのぉ…？
c404_Field_Touch_1:
  en: You called...?
  ko: 불렀어어…?
  ja: 呼んだ…？
c404_Field_Go_1:
  en: I don't have to hop around like a bunny, right...?
  ko: 깡총깡총 뛰어야 되는 건 아니지이…?
  ja: ぴょんぴょん飛ばなきゃダメ…？
c404_Battle_Enter_1:
  en: I brought you good luck... Now untie me, Counselor...
  ko: 내가 행운을 가져왔어어… 이제 풀어줘, 교과안….
  ja: |-
    幸運を運んできたわ…
    だから教官、これ外して…
c404_Battle_Ready_1:
  en: This shouldn't take long...
  ko: 금방 끝날 거 같아아….
  ja: すぐに終わりそう…
c404_Battle_Ready_2:
  en: If we win, you'll hold my hand again, right...?
  ko: 이거 이기면 또 손 잡아줄거지이…?
  ja: これに勝ったら、また手を握ってくれるのよね…？
c404_Battle_Ready_3:
  en: Will I be able to make proper use of this outfit...?
  ko: 이 옷 제대로 쓸 수 있을까아…?
  ja: この服、ちゃんと使えるかしら…？
c404_Reload_1:
  en: This outfit is uncomfortable...
  ko: 이 옷 불편해애….
  ja: この服、動きづらいわ…
c404_Reload_2:
  en: Aren't you afraid of me...?
  ko: 나 무섭지 않아…?
  ja: 私のこと、怖くない…？
c404_Reload_3:
  en: I think I could manage even without a gun...
  ko: 총 없어도 될 거 같은데에….
  ja: 銃がなくても大丈夫そうだけど…
c404_Ult_Skill_Ready_1:
  en: I'm ready, Counselor. Just say the word...
  ko: 난 준비됐어, 교관. 말만 해….
  ja: |-
    私は準備できてるわ、教官。
    なんでも言って…
c404_Ult_Skill_1:
  en: I'm gonna have as much fun as I want...
  ko: 내 마음대로 실컷 놀아볼게에….
  ja: 好きなように思いきり遊んでくるわ…
c404_FullBurst_1:
  en: Isn't it fun playing with a bunny girl...?
  ko: 바니걸이랑 노는 거 재밌지이…?
  ja: バニーガールと遊ぶの、楽しいでしょ…？
c404_Kill_Monster_1:
  en: Too easy...
  ko: 너무 쉽네에….
  ja: 楽勝ね…
c404_Kill_Monster_2:
  en: That was fun...
  ko: 재밌다아….
  ja: 楽しいわ…
c404_Kill_Monster_3:
  en: It broke...
  ko: 부서져버렸네에….
  ja: 壊れちゃった…
c404_Damage_1:
  en: Ow...!
  ko: 엇…!
  ja: あっ…！
c404_Damage_2:
  en: Ugh!
  ko: 읏!
  ja: うっ！
c404_Damage_3:
  en: Argh...
  ko: 악….
  ja: くっ…
c404_Die_1:
  en: I don't wanna do this anymore. This is no fun...
  ko: 이제 그만할래, 재미없어어….
  ja: もうやめる…つまらないわ…
c404_Win_1:
  en: I did well, right, Counselor...?
  ko: 교과안… 나 잘했지이…?
  ja: 教官…私、よくやったでしょ…？
