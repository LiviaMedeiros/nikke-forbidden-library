    유지 시간 : {description_value_04}발
    추가 효과 1 : [차지 대미지 {description_value_05}% ▲] [{description_value_06}발 유지]
    추가 효과 2 : [공격 대미지 {description_value_01}% ▲] [{description_value_02}초 유지]</color>
  ja: |-
