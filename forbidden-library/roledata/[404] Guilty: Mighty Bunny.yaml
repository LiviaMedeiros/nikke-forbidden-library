14043_description:
  en: |-
    ■ Affects self.
    <color=#00AEFF>Mighty Stomp: Changes the weapon in use
    Charge Time: Fixed at 1.5 sec
    Damage: {description_value_03}% of <word_group=10025>final</word_group> ATK
    Full Charge Damage: 250%
    Duration: {description_value_04} round(s)
    Additional Effect 1: Charge Damage ▲ {description_value_05}% for {description_value_06} round(s).
    Additional Effect 2: Attack Damage ▲ {description_value_01}% for {description_value_02} sec.</color>
  ko: |-
    ■ 자신에게
    <color=#00AEFF>[마이티 스톰프 : 사용 무기 변경] :
