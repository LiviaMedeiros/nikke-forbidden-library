---
404_name:
  en: 'Guilty: Mighty Bunny'
  ko: '길티 : 마이티 바니'
  ja: ギルティ：マイティバニー
c404_description:
  en: Guilty in a high-tech exoskeleton bunny girl suit. She has become even stronger
    thanks to the suit's boost to her already overwhelming physical strength. However,
    she still gets entirely docile in front of the one person who helped her get rehabilitated.
  ko: "하이테크 외골격 바니걸 슈트를 입고 등장한 길티.\n슈트의 보조로 원래도 압도적이던 근력이 더욱 강해졌지만, \n자신을 갱생시켜 준 단
    한 명의 앞에서만은 한없이 얌전해진다."
  ja: |-
    ハイテク外骨格バニーガールスーツを着たギルティ。
    もともと圧倒的だった筋力がスーツの効果で
    さらに強化された。しかし、自分を更生させてくれた
    ただ一人の前でだけはすっかり大人しくなる。
404_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_404:
  en: 'Guilty: Mighty Bunny''s Spare Body'
  ko: '길티 : 마이티 바니 스페어 바디'
  ja: ギルティ：マイティバニーのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sr_up:
  en: Sniper Rifle
  ko: 저격소총
  ja: スナイパーライフル
character_shot_description_localkey_sr_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
24042_name:
  en: Can I Take These Off...?
  ko: 이거… 풀어도 돼?
  ja: これ…ほどいてもいい？
24042_description:
  en: |-
    ■ Activates only if this unit is in the <word_group=10110>Bunny Mode</word_group>: Engage state.
    <color=#00AEFF>Chain Release
    Function: Changes some attacks' damage into true damage.
    Effect 1: Affects self. Normal attacks deal true damage. This effect is continuous and cannot be removed.
    Effect 2: Affects self. Mighty Stomp deals true damage. This effect is continuous and cannot be removed.
    Effect 3: Activates when landing a Full Charge attack. Affects the target. Deals {description_value_01}% of <word_group=10025>final</word_group> ATK as true damage.</color>
    ■ Activates only when this unit is in the <word_group=10110>Bunny Mode</word_group>: Stance state.
    <color=#00AEFF>Chain Enhance
    Function: Enhances this unit's offensive capabilities.
    Effect 1: Affects self. Attack Damage ▲ {description_value_02}%. This effect is continuous and cannot be removed.
    Effect 2: Affects self. Charge Damage ▲ {description_value_03}%. This effect is continuous and cannot be removed.
    Effect 3: Activates when landing a Full Charge attack. Affects the target. Deals {description_value_04}% of <word_group=10025>final</word_group> ATK as additional damage.</color>
  ko: |-
    ■ 자신이 <word_group=10110>바니 모드</word_group> : 인게이지 상태일 때 한하여
    <color=#00AEFF>[체인 릴리즈]
    기능 : 공격을 방어력 무시 대미지로 변경합니다.
    효과 1 : 자신에게 [일반 공격을 방어력 무시 대미지로 적용] [지속] [해제 불가]
    효과 2 : 자신에게 [마이티 스톰프를 방어력 무시 대미지로 적용] [지속] [해제 불가]
    효과 3 : 풀 차지 공격 명중 시 대상에게 [<word_group=10025>최종</word_group> 공격력 {description_value_01}% 방어력 무시 대미지]</color>
    ■ 자신이 <word_group=10110>바니 모드</word_group> : 스탠스 상태일 때 한하여
    <color=#00AEFF>[체인 인헨스]
    기능 : 공격 능력을 강화합니다.
    효과 1 : 자신에게 [공격 대미지 {description_value_02}% ▲] [지속] [해제 불가]
    효과 2 : 자신에게 [차지 대미지 {description_value_03}% ▲] [지속] [해제 불가]
    효과 3 : 풀 차지 공격 명중 시 대상에게 [<word_group=10025>최종</word_group> 공격력 {description_value_04}% 추가 대미지]</color>
  ja: |-
    ■自分が
    <word_group=10110>バニーモード</word_group>：エンゲージ状態の時に限り
    <color=#00AEFF>「チェーンリリース」
    機能：攻撃を防御力無視ダメージに変更
    効果1：自分に
    「通常攻撃に防御力無視ダメージを適用」
    「持続」「解除不可」
    効果2：自分に
    「マイティストンプに防御力無視ダメージを適用」
    「持続」「解除不可」
    効果3：フルチャージ攻撃が命中した時、
    対象に
    「<word_group=10025>最終</word_group>攻撃力の{description_value_01}％の
    防御力無視ダメージ」</color>
    ■自分が<word_group=10110>バニーモード</word_group>：スタンス状態の時に限り
    <color=#00AEFF>「チェーンエンハンス」
    機能：攻撃能力を強化する
    効果1：
    自分に「攻撃ダメージ{description_value_02}％▲」
    「持続」「解除不可」
    効果2：自分に
    「チャージダメージ{description_value_03}％▲」
    「持続」「解除不可」
    効果3：フルチャージ攻撃が命中した時、対象に
    「<word_group=10025>最終</word_group>攻撃力の{description_value_04}％の追加ダメージ」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
24041_name:
  en: What Should I Do...?
  ko: 어떻게 하는 게 좋아…?
  ja: どうしたらいい…？
24041_description:
  en: "■ Activates at the start of battle. Affects self.\n<color=#00AEFF>ATK ▲ {description_value_01}%.
    This effect is continuous.</color>\n■ Activates at the start of battle and when
    Full Charge is maintained for {description_value_02} or more seconds while this
    unit is not in the Mighty Stomp state. Affects self.\n<color=#00AEFF>Initiates
    a new <word_group=10110>Bunny Mode</word_group> based on the current mode.</color>\nActivates
    if this unit is in the <word_group=10110>Bunny Mode</word_group>: Stance state.\n<color=#00AEFF>Initiates
    <word_group=10110>Bunny Mode</word_group>: Engage. This effect is continuous and
    cannot be removed.</color>\nActivates if this unit is not in the <word_group=10110>Bunny
    Mode</word_group>: Stance state.\n<color=#00AEFF>Initiates <word_group=10110>Bunny
    Mode</word_group>: Stance. This effect is continuous and cannot be removed.</color>\n■
    Activates when this unit enters the <word_group=10110>Bunny Mode</word_group>:
    Engage state. Affects all allies in the <word_group=10110>Bunny Mode</word_group>:
    Stance state. \n<color=#00AEFF>Initiates <word_group=10110>Bunny Mode</word_group>:
    Engage. This effect is continuous and cannot be removed.</color>\n■ Activates
    when this unit enters the <word_group=10110>Bunny Mode</word_group>: Stance state.
    Affects all allies in the <word_group=10110>Bunny Mode</word_group>: Engage state.\n<color=#00AEFF>Initiates
    <word_group=10110>Bunny Mode</word_group>: Stance. This effect is continuous and
    cannot be removed.</color>"
  ko: "■ 전투 시작 시 자신에게\n<color=#00AEFF>[공격력 {description_value_01}% ▲] [지속]</color>\n■
    전투 시작 시와 풀 차지 상태를 {description_value_02}초 이상 유지 시 마이티 스톰프 상태가 아니라면 자신에게\n<color=#00AEFF>[상태에
    맞는 <word_group=10110>바니 모드</word_group>만 적용]</color>\n자신이 <word_group=10110>바니
    모드</word_group> : 스탠스 상태라면\n<color=#00AEFF>[<word_group=10110>바니 모드</word_group>
    : 인게이지] [지속] [해제 불가]</color>\n자신이 <word_group=10110>바니 모드</word_group> : 스탠스 상태가
    아니라면\n<color=#00AEFF>[<word_group=10110>바니 모드</word_group> : 스탠스] [지속] [해제 불가]</color>\n■
    자신에게 <word_group=10110>바니 모드</word_group> : 인게이지 적용 시 <word_group=10110>바니 모드</word_group>
    : 스탠스 상태인 아군 전체에게 \n<color=#00AEFF>[<word_group=10110>바니 모드</word_group> : 인게이지]
    [지속] [해제 불가]</color>\n■ 자신에게 <word_group=10110>바니 모드</word_group> : 스탠스 적용 시 <word_group=10110>바니
    모드</word_group> : 인게이지 상태인 아군 전체에게\n<color=#00AEFF>[<word_group=10110>바니 모드</word_group>
    : 스탠스] [지속] [해제 불가]</color>"
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「攻撃力{description_value_01}％▲」「持続」</color>
    ■戦闘開始時およびフルチャージ状態を
    {description_value_02}秒以上維持した場合、
    マイティストンプ状態でなければ自分に
    <color=#00AEFF>「条件に合う<word_group=10110>バニーモード</word_group>のみ適用」</color>
    自分が<word_group=10110>バニーモード</word_group>：スタンス状態なら、
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：エンゲージ」
    「持続」「解除不可」</color>
    自分が<word_group=10110>バニーモード</word_group>：スタンス状態で
    なければ、
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>スタンス」
    「持続」「解除不可」</color>
    ■自分に<word_group=10110>バニーモード</word_group>：エンゲージが
    適用時、<word_group=10110>バニーモード</word_group>：スタンス状態の
    味方全体に
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：エンゲージ」
    「持続」「解除不可」</color>
    ■自分に<word_group=10110>バニーモード</word_group>：スタンスが
    適用時<word_group=10110>バニーモード</word_group>：エンゲージ状態の味方全体に
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：スタンス」
    「持続」「解除不可」</color>
