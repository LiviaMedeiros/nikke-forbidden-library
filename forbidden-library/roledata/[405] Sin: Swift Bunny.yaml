---
405_name:
  en: 'Sin: Swift Bunny'
  ko: '신 : 스위프트 바니'
  ja: シン：スウィフトバニー
c405_description:
  en: Sin in a high-tech, ultra-lightweight bunny girl suit. On top of her already
    remarkable linguistic skills, she gains the ability to move at ultra-high speeds
    thanks to her suit. She joins the event as an anti-hero.
  ko: |-
    하이테크 초경량 바니걸 슈트를 입고 등장한 신.
    원래도 출중하던 언어 능력에 더해 슈트를 통한 초고속 이동 능력도 갖추고,
    안티히어로로서 이벤트에 참여한다.
  ja: |-
    ハイテク超軽量バニーガールスーツを着たシン。
    もともと持っていた言葉を自在に操る能力に加え
    スーツの効果による超高速移動能力も兼ね備え、
    アンチヒーローとしてイベントに参加する。
405_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_405:
  en: 'Sin: Swift Bunny''s Spare Body'
  ko: '신 : 스위프트 바니 스페어 바디'
  ja: シン：スウィフトバニーのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sr_up:
  en: Sniper Rifle
  ko: 저격소총
  ja: スナイパーライフル
character_shot_description_localkey_sr_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
24052_name:
  en: Bullet Switch
  ko: 스위칭 불렛
  ja: スイッチングバレット
24052_description:
  en: |-
    ■ Activates only if this unit is in the <word_group=10110>Bunny Mode</word_group>: Engage state.
    <color=#00AEFF>Noise Bullets
    Function: Changes some attacks' damage into true damage.
    Effect 1: Normal attacks deal true damage. This effect is continuous and cannot be removed.
    Effect 2: Swift Piercing deals true damage. This effect is continuous and cannot be removed.</color>
    ■ Activates only if this unit is in the <word_group=10110>Bunny Mode</word_group>: Stance state.
    <color=#00AEFF>Enhanced Bullets
    Function: Enhances this unit's offensive capabilities.
    Effect 1: Critical Rate ▲ {description_value_01}%. This effect is continuous and cannot be removed.
    Effect 2: Critical Damage ▲ {description_value_02}%. This effect is continuous and cannot be removed.</color>
    ■ Activates when using Burst Skill. Affects self.
    <color=#00AEFF>Swift Piercing: Changes the weapon in use
    Charge Time: Fixed at 0.5 sec
    Damage: {description_value_03}% of <word_group=10025>final</word_group> ATK
    Full Charge Damage: 300%
    Duration: {description_value_04} sec</color>
  ko: |-
    ■ 자신이 <word_group=10110>바니 모드</word_group> : 인게이지 상태일 때 한하여 자신에게
    <color=#00AEFF>[노이즈 불렛]
    기능 : 공격을 방어력 무시 대미지로 변경합니다.
    효과 1 : [일반 공격을 방어력 무시 대미지로 적용] [지속] [해제 불가]
    효과 2 : [스위프트 피어싱을 방어력 무시 대미지로 적용] [지속] [해제 불가]</color>
    ■ 자신이 <word_group=10110>바니 모드</word_group> : 스탠스 상태일 때 한하여 자신에게
    <color=#00AEFF>[인헨스 불렛]
    기능 : 공격 능력을 강화합니다.
    효과 1 : [크리티컬 확률 {description_value_01}% ▲] [지속] [해제 불가]
    효과 2 : [크리티컬 대미지 {description_value_02}% ▲] [지속] [해제 불가]</color>
    ■ 버스트 스킬 사용 시 자신에게
    <color=#00AEFF>[스위프트 피어싱 : 사용 무기 변경] :
    차지 시간 : 0.5초로 고정
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_03}%
    풀 차지 대미지 : 300% 대미지
    유지 시간 : {description_value_04}초</color>
  ja: |-
    ■自分が
    <word_group=10110>バニーモード</word_group>：エンゲージ状態の時のみ、自分に
    <color=#00AEFF>「ノイズバレット」
    機能：攻撃を防御力無視ダメージに変更
    効果1：「通常攻撃に防御力無視ダメージを適用」
    「持続」「解除不可」
    効果2：「スウィフトピアシングを防御力無視ダメージとして適用」
    「持続」「解除不可」</color>
    ■自分が
    <word_group=10110>バニーモード</word_group>：スタンス状態の時のみ、自分に
    <color=#00AEFF>「エンハンスバレット」
    機能：攻撃能力を強化する
    効果1：「クリティカル確率{description_value_01}％▲」
    「持続」「解除不可」
    効果2：「クリティカルダメージ{description_value_02}％▲」
    「持続」「解除不可」</color>
    ■バーストスキル使用時、自分に
    <color=#00AEFF>「スウィフトピアシング：使用武器変更」：
    チャージ時間：0.5秒に固定
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_03}％
    フルチャージダメージ：300％
    維持時間：{description_value_04}秒</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
24051_name:
  en: Bunny Shift
  ko: 바니 시프트
  ja: バニーシフト
24051_description:
  en: "■ Activates at the start of battle. Affects self.\n<color=#00AEFF>ATK ▲ {description_value_01}%.
    This effect is continuous.</color>\n■ Activates during Full Charge if this unit
    is not in the Swift Piercing state. Affects self.\n<color=#00AEFF>Normal Attack
    Damage <word_group=10029>Multiplier</word_group> ▲ {description_value_02}% for
    {description_value_03} round(s).\nCharge Damage ▲ {description_value_04}% for
    {description_value_05} round(s).</color>\n■ Activates at the start of battle and
    when Full Charge is maintained for {description_value_06} or more seconds. Affects
    self.\n<color=#00AEFF>Initiates a new <word_group=10110>Bunny Mode</word_group>
    based on the current mode.</color>\nActivates if this unit is in the <word_group=10110>Bunny
    Mode</word_group>: Stance state.\n<color=#00AEFF>Initiates <word_group=10110>Bunny
    Mode</word_group>: Engage. This effect is continuous and cannot be removed.</color>\nActivates
    if this unit is not in the <word_group=10110>Bunny Mode</word_group>: Stance state.\n<color=#00AEFF>Initiates
    <word_group=10110>Bunny Mode</word_group>: Stance. This effect is continuous and
    cannot be removed.</color>\n■ Activates when this unit enters the <word_group=10110>Bunny
    Mode</word_group>: Engage state. Affects all allies in the <word_group=10110>Bunny
    Mode</word_group>: Stance state. \n<color=#00AEFF>Initiates <word_group=10110>Bunny
    Mode</word_group>: Engage. This effect is continuous and cannot be removed.</color>\n■
    Activates when this unit enters the <word_group=10110>Bunny Mode</word_group>:
    Stance state. Affects all allies in the <word_group=10110>Bunny Mode</word_group>:
    Engage state.\n<color=#00AEFF>Initiates <word_group=10110>Bunny Mode</word_group>:
    Stance. This effect is continuous and cannot be removed.</color>"
  ko: "■ 전투 시작 시 자신에게\n<color=#00AEFF>[공격력 {description_value_01}% ▲] [지속] </color>\n■
    풀 차지 시 자신이 스위프트 피어싱 상태가 아니라면 자신에게\n<color=#00AEFF>[일반 공격 대미지 <word_group=10029>배율</word_group>
    {description_value_02}% ▲] [{description_value_03}발 유지]\n[차지 대미지 {description_value_04}%
    ▲] [{description_value_05}발 유지]</color>\n■ 전투 시작 시와 풀 차지 상태를 {description_value_06}초
    이상 유지 시 자신에게\n<color=#00AEFF>[상태에 맞는 <word_group=10110>바니 모드</word_group>만 적용]</color>\n자신이
    <word_group=10110>바니 모드</word_group> : 스탠스 상태라면\n<color=#00AEFF>[<word_group=10110>바니
    모드</word_group> : 인게이지] [지속] [해제 불가]</color>\n자신이 <word_group=10110>바니 모드</word_group>
    : 스탠스 상태가 아니라면\n<color=#00AEFF>[<word_group=10110>바니 모드</word_group> : 스탠스] [지속]
    [해제 불가]</color>\n■ 자신에게 <word_group=10110>바니 모드</word_group> : 인게이지 적용 시 <word_group=10110>바니
    모드</word_group> : 스탠스 상태인 아군 전체에게 \n<color=#00AEFF>[<word_group=10110>바니 모드</word_group>
    : 인게이지] [지속] [해제 불가]</color>\n■ 자신에게 <word_group=10110>바니 모드</word_group> : 스탠스
    적용 시 <word_group=10110>바니 모드</word_group> : 인게이지 모드인 아군 전체에게\n<color=#00AEFF>[<word_group=10110>바니
    모드</word_group> : 스탠스] [지속] [해제 불가]</color>"
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「攻撃力{description_value_01}％▲」「持続」</color>
    ■フルチャージした時、自分がスウィフトピアシング状態ではない場合は自分に
    <color=#00AEFF>「通常攻撃ダメージ<word_group=10029>倍率</word_group>{description_value_02}％▲」
    「{description_value_03}発間維持」
    「チャージダメージ{description_value_04}％▲」
    「{description_value_05}発間維持」</color>
    ■戦闘開始時およびフルチャージ状態を
    {description_value_06}秒以上維持した時、自分に
    <color=#00AEFF>「条件に合う<word_group=10110>バニーモード</word_group>のみ適用」</color>
    自分が<word_group=10110>バニーモード</word_group>：スタンス状態なら、
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：エンゲージ」
    「持続」「解除不可」</color>
    自分が<word_group=10110>バニーモード</word_group>：スタンス状態でなければ
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：スタンス」
    「持続」「解除不可」</color>
    ■自分に<word_group=10110>バニーモード</word_group>：エンゲージが適用時、<word_group=10110>バニーモード</word_group>：スタンス状態の味方全体に
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：エンゲージ」
    「持続」「解除不可」</color>
    ■自分に<word_group=10110>バニーモード</word_group>：スタンスが適用時、
    <word_group=10110>バニーモード</word_group>：エンゲージモードの味方全体に
    <color=#00AEFF>「<word_group=10110>バニーモード</word_group>：スタンス」
    「持続」「解除不可」</color>
