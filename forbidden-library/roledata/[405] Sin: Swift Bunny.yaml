material_characterskill_a_ssr:
  en: Skill Manual III
  ko: 스킬 매뉴얼 III
  ja: スキルマニュアルIII
material_characterskill_a_ssr_desc:
  en: |-
    A manual that provides a summary of how to greatly enhance Nikke's inherent abilities to the fullest extent.
    Used when upgrading skills 1 and 2.

    Obtained from the Simulation Room.
  ko: |-
    니케가 가진 고유 능력을 극한까지 갈고닦을 수 있는 방법이 총망라된 매뉴얼입니다.
    스킬 1, 2의 레벨 업에 사용됩니다.

    [획득처] : 시뮬레이션 룸
  ja: |-
    ニケの固有能力を極限まで磨く方法が網羅されているマニュアル
    スキル1、2のレベルアップに使用する

    「獲得先」：シミュレーションルーム
400_name:
  en: Guilty
  ko: 길티
  ja: ギルティ
401_name:
  en: Sin
  ko: 신
  ja: シン
402_name:
  en: Quency
  ko: 퀀시
  ja: クエンシー
403_name:
  en: 'Quency: Escape Queen'
  ko: '퀀시 : 이스케이프 퀸'
  ja: クエンシー：エスケープクイーン
404_name:
  en: 'Guilty: Mighty Bunny'
  ko: '길티 : 마이티 바니'
  ja: ギルティ：マイティバニー
c405_Lobby_Touch_1:
  en: Don't you think this outfit would look better without the converter?
  ko: 이 옷은 컨버터가 없는 게 더 잘 어울릴 거 같지 않아?
  ja: この服にはコンバーターがない方がいいと思わない？
c405_Lobby_Touch_2:
  en: Having trouble deciding where to look, Instructor?
  ko: 교관, 눈을 어디에다 둘 지 몰라하는 것 같네~?
  ja: 教官、目のやり場に困ってるみたいね～？
c405_Lobby_Touch_3:
  en: Aren't I an exemplary prisoner? I've adjusted well, and I always do what I'm
    told.
  ko: 나 되게 모범수지? 적응도 잘하고 말도 잘 듣잖아~
  ja: |-
    私ってかなりの模範囚よね～？
    すぐに適応できるし、言うこともよく聞くし～
c405_Lobby_Touch_Love_1:
  en: I'll give you carrots instead of Splendamin from now on. Do you like carrots,
    Instructor?
  ko: 이제는 퍼펙트 바 말고 당근 줄게. 당근 좋아해, 교관?
  ja: |-
    これからはパーフェクトバーじゃなくてニンジンをあげる。
    教官、ニンジンは好き？
c405_Lobby_Touch_Love_2:
  en: If I give you enough luck, will you set me free?
  ko: 행운 많이 주면 이것도 풀어주려나~
  ja: 幸運をたくさんあげたら、これ外してくれるのかな～
c405_Lobby_Touch_Love_3:
  en: You keep fiddling with my converter because you want to take it off for me,
    don't you? I can see right through you.
  ko: 교관도 컨버터 풀어주고 싶어서 자꾸 만지는 거지? 다 알아~
  ja: |-
    教官もコンバーターを外したいから何回も触ってくるんでしょ？
    お見通しよ～
c405_Lobby_Stay_1:
  en: I'm bored... Are you sick of bunny girls already?
  ko: 심심한데에… 바니걸은 질린거야?
  ja: |-
    退屈～…
    バニーガールには飽きちゃったの？
c405_Lobby_Stay_Love_1:
  en: You used me up and now you're just going to abandon me? I even dressed up as
    a bunny girl just for you... That's a 50-point deduction!
  ko: |-
    이제 쓸만큼 썼다고 방치하는 거야?
    바니걸까지 됐는데 버려두다니~ 벌점 50점!
  ja: |-
    用済みだからって放置するの？
    バニーガールにまでなったのに放っておくなんて、マイナス50点！
c405_Outpost_Touch_1:
  en: There are a lot of bunny girls around here. Is this what you're into?
  ko: 바니걸이 꽤 많네~ 교관이 좋아하는 스타일이야?
  ja: |-
    バニーガールがこんなにいっぱい！
    教官はこういうのが好きなの？
c405_Outpost_Touch_2:
  en: I'm glad I got rehabilitated. Now I get to be a bunny girl and go wherever I
    want!
  ko: 갱생하길 잘했어~ 바니걸도 되고, 마음껏 돌아다니고~
  ja: |-
    更生してよかったわ～
    バニーガールにもなれるし、 思いっきり歩き回れるし～
c405_Outpost_Touch_3:
  en: Everyone here seems so well-behaved. Being too good all the time isn't always
    a good thing, though.
  ko: 여기엔 착한 애들이 꽤 많은 것 같아. 너무 착하게만 살면 안 좋을텐데~
  ja: |-
    ここにはいい子たちが たくさんいるのね。
    あんまりいい子すぎるのも よくないと思うけど～
c405_Gacha_Get_1:
  en: I heard you like bunny girls, Instructor. Fifty points to me for dressing up
    as one just for you!
  ko: 교관이 바니걸을 좋아한다며? 교관을 위해 바니걸이 된 나한테 상점 50점~
  ja: |-
    教官はバニーガールが好きなのよね？
    教官のためにバニーガールになった私にプラス50点～！
c405_Reinforce_1:
  en: Why are you being so nice to me? Do you need me to do something?
  ko: 왜 이렇게 잘해주는거야~ 나한테 뭐 시킬 일 있어?
  ja: |-
    どうしてこんなによくしてくれるの～？
    私にやってほしいことがあるとか？
c405_Reinforce_2:
  en: I feel like I've evolved into a super bunny girl! Hahaha!
  ko: 슈퍼 바니걸이 된 거 같은데? 하하하~
  ja: スーパーバニーガールになっちゃったかも？ふふふ～
c405_Reinforce_3:
  en: Luck recharged!
  ko: 행운 충전~
  ja: 幸運チャージ！
c405_Gift_1:
  en: You're giving me something this nice? Are you sure you're ready to handle the
    consequences, Instructor?
  ko: 나한테 이렇게 좋은 걸 준다고? 교관, 감당할 수 있겠어?
  ja: |-
    こんなにいいものをくれるの？
    教官、大丈夫？
c405_Gift_2:
  en: Should I give you a carrot in return?
  ko: 그럼 난 당근을 주면 되나?
  ja: 私はニンジンをあげればいい？
c405_Gift_3:
  en: Thanks! Guess I'll behave and listen to you for now.
  ko: 고마워~ 당분간은 교관 말 잘 들어야겠다.
  ja: |-
    ありがと～！
    しばらくは教官の言うことをちゃんと聞くわ。
c405_Attractive_Up_1:
  en: Maybe I won't betray you after all.
  ko: 교관은 배신 안 해야겠다~
  ja: 教官のことは裏切ったりしないわ～
c405_Attractive_Up_2:
  en: I'll give you good luck, just for you, Instructor.
  ko: 내가 특별히 교관한테만 행운을 줄게.
  ja: 教官にだけ、特別に幸運をあげる。
c405_Attractive_Up_3:
  en: Since I'm feeling generous, 50 points to you for treating your bunny girl well!
  ko: 기분이다, 바니걸을 예뻐해주는 교관에게 상점 50점~
  ja: バニーガールをかわいがってくれる教官にプラス50点～！
c405_Party_Deploy_1:
  en: What could a bunny girl possibly do?
  ko: 바니걸이 뭘 할 수 있나~
  ja: バニーガールに何ができるっていうのよ～
c405_Field_Touch_1:
  en: I'm going.
  ko: 가고 있어.
  ja: 今行くわ。
c405_Field_Go_1:
  en: Here comes the bunny!
  ko: 토끼 가는 중~
  ja: ウサギが向かってるわ～
c405_Battle_Enter_1:
  en: Who knew bunny girls are this busy?
  ko: 바니걸도 바쁘네.
  ja: バニーガールも忙しいわね。
c405_Battle_Ready_1:
  en: Here's some good luck for you.
  ko: 행운을 드릴게요~
  ja: 幸運をお届けしま～す。
c405_Battle_Ready_2:
  en: I'll end this quick.
  ko: 빠르게 끝내줄게.
  ja: さっさと終わらせてあげる。
c405_Battle_Ready_3:
  en: Looks easy enough.
  ko: 쉬워 보이는데?
  ja: 楽勝そうだけど？
c405_Reload_1:
  en: Can you do it for me instead, Instructor?
  ko: 교관이 대신 해주라~
  ja: 教官が代わりにやって～
c405_Reload_2:
  en: Just a sec...
  ko: 잠시만….
  ja: ちょっと待って…
c405_Reload_3:
  en: Bunnies have to do these things too?
  ko: 토끼가 이런 것도 해?
  ja: ウサギがこんなことまでするの？
c405_Ult_Skill_Ready_1:
  en: With all my luck!
  ko: 행운을 모아서~
  ja: 幸運を集めて～
c405_Ult_Skill_1:
  en: This is a piece of cake for a bunny girl like me!
  ko: 바니걸에게 이정도는 식은 죽 먹기라고~
  ja: これくらい、バニーガールにはカンタン～
c405_FullBurst_1:
  en: That wasn't so hard, was it?
  ko: 이정도는 어렵지 않지?
  ja: この程度、余裕でしょ？
c405_Kill_Monster_1:
  en: Okay, next!
  ko: 자, 다음~!
  ja: はい、次～！
c405_Kill_Monster_2:
  en: That was too easy.
  ko: 너무 쉽다.
  ja: 楽勝すぎるわ。
c405_Kill_Monster_3:
  en: Bunny, bunny!
  ko: 바니 바니~
  ja: バニーバニー！
c405_Damage_1:
  en: Ow! I got hit!
  ko: 아야! 나 맞았어~
  ja: いたっ！当たっちゃった～
c405_Damage_2:
  en: Ouch!
  ko: 아!
  ja: もう！
c405_Damage_3:
  en: Ugh...
  ko: 윽….
  ja: うっ…
c405_Die_1:
  en: Hmph... there's no reasoning with them.
  ko: 하… 얘네랑은 대화가 안돼.
  ja: はぁ…あの子たちには話が通じないわ…
c405_Win_1:
  en: This bunny brought you good luck!
  ko: 토끼가 행운을 가져왔어요~
  ja: ウサギが幸運を運んできました～！
405_cv_ja:
  en: 'CV: Atsumi Tanezaki'
  ko: 'CV : 타네자키 아츠미'
  ja: CV：種﨑敦美
405_cv_ko:
  en: 'CV: Yeo Yoon-mi'
  ko: 'CV : 여윤미'
  ja: CV：ヨ・ユンミ
405_cv_en:
  en: 'CV: Brittany Lauda'
  ko: 'CV : 브리타니 라우다'
  ja: CV：Brittany Lauda
