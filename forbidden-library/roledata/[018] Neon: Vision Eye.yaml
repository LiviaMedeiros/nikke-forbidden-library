---
18_name:
  en: 'Neon: Vision Eye'
  ko: '네온 : 비전 아이'
  ja: ネオン：ビジョン・アイ
c018_description:
  en: Neon now boasts a healthy body that completely shields her from outside interference.
    She has dubbed her newly upgraded self "Neo-Neon," and continues on her journey
    along the path of firepower—now with even greater firepower!
  ko: |-
    외부에서의 간섭을 완전히 차단하는 건강한 바디를 이식받은 네온.
    새로 업그레이드된 자신을 네오-네온이라 칭하고 있다.
    더 강력한 화력으로, 변함없이 화력의 길을 걷는다.
  ja: |-
    外部からの干渉を完全に遮断することができる
    健康なボディを移植されたネオン。
    新しくアップグレードした自身をネオ・ネオンと呼んでいる。
    より強力な火力で、火力の道をひたすら歩み続ける。
