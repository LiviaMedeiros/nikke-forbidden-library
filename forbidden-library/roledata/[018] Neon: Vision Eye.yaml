c018_Lobby_Touch_1:
  en: At this point, shouldn't you be calling me "Master"? Which would make me...
    Master-Master!
  ko: |-
    이 정도면, 스승님이 저를 스승님이라고 불러야 하지 않을까요?
    그럼 전… 스승스승님인가요?!
  ja: |-
    こうなった今、師匠が私を師匠と呼ぶべきではありませんか？
    つまり私は…スペシャル師匠ですか！？
c018_Lobby_Touch_2:
  en: I need someplace to test my firepower. Right now, I feel like I have no limits.
  ko: |-
    제 화력을 시험할 만한 곳이 필요해요.
    지금의 전, 한계가 없는 느낌이거든요.
  ja: |-
    私の火力を試す場所が必要ですね。
    今の私には、限界なんてない気がするんです。
c018_Lobby_Touch_3:
  en: You don't think I need my glasses anymore? Of course I do! These glasses are
    the very source of my firepower.
  ko: |-
    이 안경, 이제 안 껴도 되지 않냐고요?
    안돼요! 제 화력은, 이 안경에서 나오는 거거든요.
  ja: |-
    この眼鏡、もう必要ないんじゃないかって？
    ダメです！私の火力は、この眼鏡から始まっているのです。
c018_Lobby_Touch_Love_1:
  en: The way of firepower really has no end. You'll keep guiding me, won't you, Master?
  ko: |-
    화력의 길은 끝이 없네요.
    계속 이끌어 주실 거죠, 스승님?
  ja: |-
    火力の道に終わりはありません。
    これからも私を導いてくれますよね？師匠！
c018_Lobby_Touch_Love_2:
  en: A healthy body is a good thing. I'm glad you're so strong and well, Master.
  ko: |-
    건강한 몸은 좋은 거예요.
    스승님이 튼튼해서 다행이에요!
  ja: |-
    健康が一番ですよ。
    師匠が丈夫でよかったです！
c018_Lobby_Touch_Love_3:
  en: I can't talk about my past without crying, but I think I'm ready to share with
    you.
  ko: |-
    눈물 없이 들을 수 없는 저의 과거,
    스승님께라면 말해드릴 수 있을 것 같아요.
  ja: |-
    涙なしには語れない私の過去。
    師匠になら、お話しできそうです。
c018_Lobby_Stay_1:
  en: Master! What're you doing? Leaving me here like this is a massive blow to our
    combat capabilities!
  ko: |-
    스승님! 뭐 하시는 거죠?
    저를 이렇게 방치하시다니, 전력에 큰 손실이라구요!
  ja: |-
    師匠！何をしているんですか？
    私を放置するなんて、戦力に大きな損失が生じますよ！
c018_Lobby_Stay_Love_1:
  en: The stronger the weapon, the more time it needs to cool down. Take your time
    coming back, Master!
  ko: |-
    화력이 강한 총일수록, 식힐 시간이 필요한 법이죠.
    천천히 다녀오세요, 스승님!
  ja: |-
    火力が高い銃であるほど、冷却時間が必要なものです。
    ゆっくり戻ってきてくださいね、師匠！
c018_Outpost_Touch_1:
  en: Doesn't the Outpost seem a bit small for Neo-Neon?
  ko: |-
    이 전초기지, 이제 저 네오-네온을 품기에는
    조금 좁아 보이지 않나요?
  ja: |-
    この前哨基地は、 ネオ・ネオンの居場所にしては
    少し狭いと思いませんか？
c018_Outpost_Touch_2:
  en: I don't know if I said this before, but I like it here because it's bright.
  ko: 새삼스럽지만, 여기는 밝아서 좋네요.
  ja: 改めて感じましたが、 ここは明るくていいですね。
c018_Outpost_Touch_3:
  en: Nothing beats having a home to return to.
  ko: 돌아올 집이 있다는 건, 정말 기분 좋은 일이네요!
  ja: 帰る家があるって、 本当に嬉しいことですね！
c018_Gacha_Get_1:
  en: Neo-Neon here, responding to the call for firepower.
  ko: 네오-네온. 화력의 부름을 받고, 이곳에 강림했습니다.
  ja: ネオ・ネオン。火力に導かれ、ここに降臨しました。
c018_Reinforce_1:
  en: Firrrepowerrr!
  ko: 화려어어어어억-!!
  ja: かぁりょぉぉぉくぅぅぅー！！
c018_Reinforce_2:
  en: Aren't you afraid of how much greater my firepower might get?
  ko: |-
    스승님은 두렵지 않으신가요…?
    저의 화력이 어디까지 성장할지 말이에요.
  ja: |-
    師匠は恐ろしくないのですか…？
    私の火力が、どこまで成長してしまうのか！
c018_Reinforce_3:
  en: Wow! I was already healthy, but I feel even better now!
  ko: 와우! 원래도 건강했지만, 더 좋아진 기분이네요!
  ja: わあ！もともと元気でしたけど、さらに健康になった気がします！
c018_Gift_1:
  en: You're encouraging me to work even harder, right? Well, consider today the first
    day of my special firepower training!
  ko: |-
    더 열심히 하라는 의미인 거죠?
    좋아요, 오늘부터 화력 특훈이에요!
  ja: |-
    もっと頑張れってことですよね。
    分かりました。今日から火力の特訓です！
c018_Gift_2:
  en: I kinda feel bad always being the one to receive gifts. I do appreciate it,
    though, Master!
  ko: |-
    매번 받기만 해서 좀 그렇긴 하네요.
    감사합니다, 스승님!
  ja: |-
    いつももらってばかりで申し訳ないです。
    ありがとうございます、師匠！
c018_Gift_3:
  en: Oooh! I know exactly what to do with this!
  ko: 오오…! 잘 쓰겠습니다!
  ja: おおっ…！大切に使います！
c018_Attractive_Up_1:
  en: You really are the only one I'd ever want to call "Master."
  ko: 역시, 제가 모실만한 분은 스승님 한 분 밖에 없는 것 같네요.
  ja: やっぱり私の師匠にふさわしい方は、師匠しかいませんね。
c018_Attractive_Up_2:
  en: Me and my firepower are with you until the end, Master!
  ko: 충! 성! 화력의 네온은 평생 스승님만을 따르겠습니다!
  ja: 火力のネオンは、一生師匠についていきます！
c018_Attractive_Up_3:
  en: Glasses, firepower, and you... Put those three together, and you basically get
    me, huh? They're like my building blocks.
  ko: |-
    안경, 화력, 스승님… 이렇게 셋이 만나
    저, 네온을 구성하고 있는 것 아닐까요?
  ja: 眼鏡、火力、師匠…この3つで、私が構成されているのでは？
c018_Party_Deploy_1:
  en: Neo-Neon, moving out!
  ko: 네오-네온. 출동합니다!
  ja: ネオ・ネオン。出動します！
c018_Field_Touch_1:
  en: Did you call?
  ko: 부르셨나요!
  ja: お呼びでしょうか！
c018_Field_Go_1:
  en: On to greater firepower!
  ko: 화력의 길로!
  ja: 火力の道へ！
c018_Battle_Enter_1:
  en: Finally, a place to test my firepower.
  ko: 드디어, 제 화력을 시험할 수 있겠네요.
  ja: ついに、私の火力を試す時が来ましたね。
c018_Battle_Ready_1:
  en: I'm counting on you, Master!
  ko: 스승님, 가르침을 주세요!
  ja: 師匠、ご指導お願いいたします！
c018_Battle_Ready_2:
  en: Keep your distance, okay?
  ko: 멀리 떨어져 계세요!
  ja: 離れていてください！
c018_Battle_Ready_3:
  en: Firepower, ready! Neon, ready!
  ko: 화력, OK! 네온, OK!
  ja: 火力、OK！ネオン、OK！
c018_Reload_1:
  en: Firepower! Firepower!
  ko: 화력! 화력!
  ja: 火力！火力！
c018_Reload_2:
  en: Let me adjust my glasses!
  ko: 안경 좀 고쳐쓸게요!
  ja: 眼鏡をかけ直しますね！
c018_Reload_3:
  en: There's no time to rest!
  ko: 쉴 틈이 없다구요!
  ja: 休んでいる暇はありませんよ！
c018_Ult_Skill_Ready_1:
  en: Firepower!
  ko: 화력!
  ja: 火力！
c018_Ult_Skill_1:
  en: Get ready for max firepower!
  ko: 화력, 최대로 갑니다!
  ja: 火力、フルスロットルで行きます！
c018_FullBurst_1:
  en: Fiiiiirepoweerrr!
  ko: 화려어억-!!
  ja: かりょくぅぅ！！
c018_Kill_Monster_1:
  en: That was nothing.
  ko: 별 거 아니네요.
  ja: 大したことないですね。
c018_Kill_Monster_2:
  en: Nothing beats firepower!
  ko: 역시, 화력!
  ja: やっぱり、火力！
c018_Kill_Monster_3:
  en: Next!
  ko: 다음, 갑니다!
  ja: 次、行きます！
c018_Damage_1:
  en: Agh!
  ko: 으악!
  ja: うおっ！
c018_Damage_2:
  en: Ugh...!
  ko: 윽…!
  ja: うっ…！
c018_Damage_3:
  en: Firepower...!
  ko: 화력…!
  ja: 火力…！
c018_Die_1:
  en: I'm sure I had enough firepower...
  ko: 화력이 부족하지는 않았을 텐데요…!
  ja: 火力は十分だったはずですが…！
c018_Win_1:
  en: Hehe, another victory for firepower!
  ko: 후후, 화력의 가호가 함께 한 덕분이죠!
  ja: ふふ。火力のご加護のおかげです！
