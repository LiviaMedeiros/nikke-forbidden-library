20181_name:
  en: Healthy Body
  ko: 건강한 몸
  ja: 超健康体
20181_description:
  en: |-
    ■ Activates when attacked while not in Healthy Body status. Affects self.
    <color=#00AEFF>Invulnerable for {description_value_03} sec. Activates {description_value_04} time(s) per battle.
    Gains <word_group=10039>debuff immunity</word_group> to ∞ debuffs for {description_value_05} sec. Activates {description_value_06} time(s) per battle.
    Healthy Body: Incoming healing ▲ {description_value_01}% for {description_value_02} sec.</color>
    ■ Activates when landing a Full Charge attack. Affects the enemy if the enemy is the <word_group=10105>stage target</word_group>.
    <color=#00AEFF>Firepower Explosion:
    Effect: Deals {description_value_07}% of <word_group=10025>final</word_group> ATK as additional damage.
    Additional effect of Super Firepower status: Deals {description_value_08}% of <word_group=10025>final</word_group> ATK as additional damage.</color>
  ko: "■ 피격 시 자신이 건강한 몸 상태가 아니라면 자신에게\n<color=#00AEFF>[무적] [{description_value_03}초
    유지] [전투 중 {description_value_04}회 발동]\n[<word_group=10039>해로운 효과 면역</word_group>
    ∞개] [{description_value_05}초 유지] [전투 중 {description_value_06}회 발동]\n[건강한 몸 : 받는
    체력 회복량 {description_value_01}% ▲] [{description_value_02}초 유지]</color>\n■ 풀 차지
    공격 명중 시 대상이 <word_group=10105>타겟</word_group>이라면 대상에게\n<color=#00AEFF>[화력 폭발]
    : \n효과 : [<word_group=10025>최종</word_group> 공격력 {description_value_07}% 추가 대미지]\n초화력
    상태 추가 효과 : [<word_group=10025>최종</word_group> 공격력 {description_value_08}% 추가 대미지]</color>"
  ja: |-
    ■攻撃を受けた時、自分が健康体状態でなければ、自分に
    <color=#00AEFF>「無敵」「{description_value_03}秒間維持」「戦闘中{description_value_04}回発動」
    「<word_group=10039>デバフ効果免疫</word_group>∞個」「{description_value_05}秒間維持」「戦闘中{description_value_06}回発動」
    「健康体：受けるHP回復量{description_value_01}％▲」「{description_value_02}秒間維持」</color>
    ■フルチャージ攻撃が命中した時、対象が<word_group=10105>ターゲット</word_group>なら、対象に
    <color=#00AEFF>「火力爆発」：
    効果：「<word_group=10025>最終</word_group>攻撃力の{description_value_07}％の追加ダメージ」
    超火力状態追加効果：「<word_group=10025>最終</word_group>攻撃力の{description_value_08}％の追加ダメージ」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
10183_name:
  en: Super Firepower
  ko: 초화력
  ja: 超火力解放
10183_description:
  en: |-
    ■ Activates when the Firepower Gauge's charge is lower than 100. Affects self.
    <color=#00AEFF>Firepower Charge: Charges the Firepower Gauge for {description_value_02} sec. This effect cannot be removed.
    Increases the Firepower Gauge's charge by 1.</color>
    ■ Activates when the Firepower Gauge's charge is at 100. Affects self.
    <color=#00AEFF>Super Firepower: Attack Damage ▲ {description_value_04}% for {description_value_05} sec.
    Decreases the Firepower Gauge's charge by 100.</color>
    ■ Affects self.
    <color=#00AEFF>Explosion Radius ▲ {description_value_06}% for {description_value_07} sec.
    Attack Damage ▲ {description_value_10}% for {description_value_11} sec.</color>
  ko: |-
    ■ 자신이 화력 게이지가 100미만이면 자신에게
    <color=#00AEFF>[화력 충전 : 화력 게이지 충전 가능] [{description_value_02}초 유지] [해제 불가]
    [화력 게이지 1 충전] </color>
    ■ 자신이 화력 게이지가 100이라면 자신에게
    <color=#00AEFF>[초화력 : 공격 대미지 {description_value_04}% ▲] [{description_value_05}초 유지]
    [화력 게이지 100 소모]</color>
    ■ 자신에게
    <color=#00AEFF>[폭발 범위 {description_value_06}% ▲] [{description_value_07}초 유지]
    [공격 대미지 {description_value_10}% ▲] [{description_value_11}초 유지]</color>
  ja: |-
    ■自分の火力ゲージが100未満の場合、自分に
    <color=#00AEFF>「火力チャージ：火力ゲージチャージ可能」「{description_value_02}秒間維持」「解除不可」
    「火力ゲージ1チャージ」</color>
    ■自分の火力ゲージが100の場合、自分に
    <color=#00AEFF>「超火力：攻撃ダメージ{description_value_04}％▲」「{description_value_05}秒間維持」
    「火力ゲージ100消費」</color>
    ■自分に
    <color=#00AEFF>「爆発範囲{description_value_06}％▲」「{description_value_07}秒間維持」
    「攻撃ダメージ{description_value_10}％▲」「{description_value_11}秒間維持」</color>
