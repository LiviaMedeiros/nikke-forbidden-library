  en: "-"
  ko: "-"
  ja: "-"
piece_18:
  en: 'Neon: Vision Eye''s Spare Body'
  ko: '네온 : 비전 아이 스페어 바디'
  ja: ネオン：ビジョン・アイのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_rl_up:
  en: Rocket Launcher
  ko: 런처
  ja: ロケットランチャー
character_shot_description_localkey_rl_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
20182_name:
  en: Firepower Charge
  ko: 화력 충전
  ja: 超火力チャージ
20182_description:
  en: "■ Activates at the start of battle. Affects self.\n<color=#00AEFF>Increases
    the Firepower Gauge's charge by {description_value_08}.</color>\n■ Activates when
    performing a normal attack while in Firepower Charge status. Affects self.\n<color=#00AEFF>Increases
    the Firepower Gauge's charge by 2.</color>\n■ Activates when Firepower Charge
    ends. Affects self.\n<color=#00AEFF>Increases the Firepower Gauge's charge by
    {description_value_09}.</color>\n■ Activates when Full Burst ends while Firepower
    Gauge is active. Affects self.\n<color=#00AEFF><word_group=10014>Burst Gauge filling
    speed</word_group> ▲ {description_value_02}% x Firepower Gauge charge amount for
    {description_value_03} sec.</color>\n■ Activates when entering Full Burst. Affects
    self.\n<color=#00AEFF>Maximum Firepower: \nEffect: ATK ▲ {description_value_04}%
    for {description_value_05} sec.\nAdditional effect for Super Firepower: ATK ▲
    {description_value_06}% for {description_value_07} sec.</color>"
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[화력 게이지 {description_value_08} 충전] </color>
    ■ 일반 공격 시 자신이 화력 충전 상태라면 자신에게
    <color=#00AEFF>[화력 게이지 2 충전]</color>
    ■ 화력 충전 상태 종료 시 자신에게
    <color=#00AEFF>[화력 게이지 {description_value_09} 충전]</color>
    ■ 풀 버스트 타임 종료 시 자신이 화력 게이지 보유 상태라면 자신에게
    <color=#00AEFF>[<word_group=10014>버스트 게이지 충전 속도</word_group> {description_value_02}% X 화력 게이지 충전량 ▲] [{description_value_03}초 유지]</color>
    ■ 풀 버스트 타임 시작 시 자신에게
    <color=#00AEFF>[화력 전개] :
    효과 : [공격력 {description_value_04}% ▲] [{description_value_05}초 유지]
    초화력 추가 효과 : [공격력 {description_value_06}% ▲] [{description_value_07}초 유지] </color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「火力ゲージ{description_value_08}チャージ」</color>
    ■通常攻撃をした時、自分が火力チャージ状態なら、自分に
    <color=#00AEFF>「火力ゲージ2チャージ」</color>
    ■火力チャージ状態が終了した時、自分に
    <color=#00AEFF>「火力ゲージ{description_value_09}チャージ」</color>
    ■フルバーストタイムが終了した時、自分に火力ゲージがある状態なら自分に
    <color=#00AEFF>「<word_group=10014>バーストゲージのチャージ速度</word_group>{description_value_02}％×火力ゲージのチャージ量▲」
    「{description_value_03}秒間維持」</color>
    ■フルバーストタイムが発動した時、自分に
    <color=#00AEFF>「火力全開」：
    効果：「攻撃力{description_value_04}％▲」「{description_value_05}秒間維持」
    超火力追加効果：「攻撃力{description_value_06}％▲」「{description_value_07}秒間維持」</color>
