---
600_name:
  en: Mint
  ko: 민트
  ja: ミント
c600_description:
  en: |-
    The leader of T.T. STAR (Twinkle Twin Star). As one of the Ark's top pop stars, she is currently enjoying a surge in popularity.
    Having realized early on that singing and dancing alone are not enough to succeed as a pop star, she has made it a point to frequently appear on different variety shows. While she may seem fragile, she actually possesses a solid sense of self-love and great mental fortitude.
  ko: |-
    T.T. STAR(Twinkle Twin Star)의 리더로, 한창 많은 인기를 얻고 있는 방주의 대표 아이돌.
    춤과 노래만으로 아이돌로서 성공하기 부족하다는 것을 일찍이 깨달아, 다양한 예능 프로에 꾸준히 얼굴을 비치고 있다.
    유약해 보이는 외형과 달리 강한 자기애를 바탕으로 단단한 멘탈을 소유하고 있다.
  ja: |-
    T.T. STAR（Twinkle Twin Star）のリーダーで、
    絶大な人気を誇るアークを代表するアイドル。
    ダンスと歌だけでアイドルとして成功するには限界があると
    早い段階で気づき、さまざまなバラエティ番組へ
    地道に出演している。
    温和そうな見た目とは裏腹に、高い自己肯定感に裏付けられた
    ブレないメンタルの持ち主。
600_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_600:
  en: Mint's Spare Body
  ko: 민트 스페어 바디
  ja: ミントのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_rl_up:
  en: Rocket Launcher
  ko: 런처
  ja: ロケットランチャー
character_shot_description_localkey_rl_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
26002_name:
  en: Fantastic Performance!
  ko: 멋진 무대였어요!
  ja: 素敵なステージでした！
26002_description:
  en: |-
    ■ Activates when entering Burst Stage 3 while not in Sing Along status. Affects self.
    <color=#00AEFF><word_group=10101>Cancels</word_group> <word_group=10102>Assigned Part</word_group>: Singing.</color>
    <color=#00AEFF><word_group=10101>Cancels</word_group> <word_group=10102>Assigned Part</word_group>: Dancing.</color>
    ■ Activates when entering Burst Stage 3 while in <word_group=10102>Assigned Part</word_group>: Singing status. Affects all allies.
    <color=#00AEFF>Critical Rate ▲ {description_value_01}% for {description_value_02} sec.
    <word_group=10066>Projectile Explosion Damage</word_group> ▲ {description_value_03}% for {description_value_04} sec.
    <word_group=10042>Pierce Damage</word_group> ▲ {description_value_05}% for {description_value_06} sec.</color>
  ko: |-
    ■ 버스트 3단계 진입 시 자신이 떼창 상태가 아니라면 자신에게
    <color=#00AEFF>[<word_group=10102>무대 파트</word_group> : 보컬 <word_group=10101>삭제</word_group>]</color>
    <color=#00AEFF>[<word_group=10102>무대 파트</word_group> : 댄스 <word_group=10101>삭제</word_group>]</color>
    ■ 버스트 3단계 진입 시 자신이 <word_group=10102>무대 파트</word_group> : 보컬 상태라면 아군 전체에게
    <color=#00AEFF>[크리티컬 확률 {description_value_01}% ▲] [{description_value_02}초 유지]
    [<word_group=10066>발사체 폭발 대미지</word_group> {description_value_03}% ▲] [{description_value_04}초 유지]
    [<word_group=10042>관통 대미지</word_group> {description_value_05}% ▲] [{description_value_06}초 유지]</color>
  ja: |-
    ■バースト3段階突入時、自分が
    シンガロング状態でなければ自分に
    <color=#00AEFF>「<word_group=10102>ステージパート</word_group>：ボーカル<word_group=10101>消去</word_group>」</color>
    <color=#00AEFF>「<word_group=10102>ステージパート</word_group>：ダンス<word_group=10101>消去</word_group>」</color>
    ■バースト3段階突入時、自分が
    <word_group=10102>ステージパート</word_group>：ボーカル状態なら、
    味方全体に
    <color=#00AEFF>「クリティカル確率{description_value_01}％▲」
    「{description_value_02}秒間維持」
    「<word_group=10066>発射体爆発ダメージ</word_group>{description_value_03}％▲」
    「{description_value_04}秒間維持」
    「<word_group=10042>貫通ダメージ</word_group>{description_value_05}％▲」「{description_value_06}秒間維持」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
26001_name:
  en: Here I Go!
  ko: 노래, 시작할게요!
  ja: ミュージック、スタート！
26001_description:
  en: |-
    ■ Activates when attacking with Full Charge while in <word_group=10102>Assigned Part</word_group>: Singing status. Affects all allies.
    <color=#00AEFF>Singing Effect: ATK ▲ {description_value_01}% of the skill user's ATK for {description_value_02} sec.</color>

    ■ Activates when attacking with Full Charge while in <word_group=10102>Assigned Part</word_group>: Dancing status. Affects all allies.
    <color=#00AEFF>Dancing Effect: Constantly recovers {description_value_03}% of the skill user's <word_group=10025>final</word_group> Max HP every 1 sec for {description_value_04} sec.</color>
  ko: |-
    ■ 풀 차지 공격 시 자신이 <word_group=10102>무대 파트</word_group> : 보컬 상태라면 아군 전체에게
    <color=#00AEFF>[보컬 효과 : 시전자 기준 공격력 {description_value_01}% ▲] [{description_value_02}초 유지]</color>
    ■ 풀 차지 공격 시 자신이 <word_group=10102>무대 파트</word_group> : 댄스 상태라면 아군 전체에게
    <color=#00AEFF>[댄스 효과 : 시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_03}% 지속 회복] [1초 간격] [{description_value_04}초 유지]</color>
  ja: |-
    ■フルチャージして攻撃した時、自分が
    <word_group=10102>ステージパート</word_group>：ボーカル状態なら、
    味方全体に
    <color=#00AEFF>「ボーカルエフェクト：スキル発動者基準で攻撃力{description_value_01}％▲」「{description_value_02}秒間維持」</color>
    ■フルチャージして攻撃した時、自分が
    <word_group=10102>ステージパート</word_group>：ダンス状態なら、
    味方全体に
    <color=#00AEFF>「ダンスエフェクト：スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_03}％持続回復」
    「1秒間隔」「{description_value_04}秒間維持」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
16003_name:
  en: Let's Sing Together!
  ko: 다 함께 불러주세요!
  ja: みんな一緒に～！
16003_description:
  en: |-
    ■ Affects self.
    <color=#00AEFF>Only one <word_group=10102>Assigned Part</word_group> is applied according to Mint's current status.</color>
    Status 1: If in the <word_group=10102>Assigned Part</word_group>: Dancing status, Mint gains <word_group=10102>Assigned Part</word_group>: Singing. This effect is continuous and cannot be removed.
    Status 2: If not in the <word_group=10102>Assigned Part</word_group>: Dancing status, Mint gains <word_group=10102>Assigned Part</word_group>: Dancing. This effect is continuous and cannot be removed.
    ■ Affects all allies.
    <color=#00AEFF>Sing Along: Attack Damage ▲ {description_value_01}% for {description_value_02} sec.
    Max Ammunition Capacity ▲ {description_value_03}% for {description_value_04} sec.
    Critical Damage ▲ {description_value_05}% for {description_value_06} sec.</color>
  ko: |-
    ■ 자신에게
    <color=#00AEFF>[상태에 맞는 <word_group=10102>무대 파트</word_group>만 적용]
    상태 1 : 자신이 <word_group=10102>무대 파트</word_group> : 댄스 상태라면 [<word_group=10102>무대 파트</word_group> : 보컬] [지속] [해제 불가]
    상태 2 : 자신이 <word_group=10102>무대 파트</word_group> : 댄스 상태가 아니라면 [<word_group=10102>무대 파트</word_group> : 댄스] [지속] [해제 불가]</color>
    ■ 아군 전체에게
    <color=#00AEFF>[떼창 : 공격 대미지 {description_value_01}% ▲] [{description_value_02}초 유지]
    [최대 장탄 수 {description_value_03}% ▲] [{description_value_04}초 유지]
    [크리티컬 대미지 {description_value_05}% ▲] [{description_value_06}초 유지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「条件に合う<word_group=10102>ステージパート</word_group>のみ適用」
    条件1：自分が<word_group=10102>ステージパート</word_group>：
    ダンス状態なら、
    「<word_group=10102>ステージパート</word_group>：ボーカル」「持続」
    「解除不可」
    条件2：自分が<word_group=10102>ステージパート</word_group>：
    ダンス状態でなければ
    「<word_group=10102>ステージパート</word_group>：ダンス」「持続」
    「解除不可」</color>
    ■味方全体に
    <color=#00AEFF>「シンガロング：攻撃ダメージ{description_value_01}％▲」「{description_value_02}秒間維持」
    「最大装弾数{description_value_03}％▲」「{description_value_04}秒間維持」
    「クリティカルダメージ{description_value_05}％▲」「{description_value_06}秒間維持」</color>
