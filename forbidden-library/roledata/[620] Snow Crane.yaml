---
620_name:
  en: Snow Crane
  ko: 백학
  ja: シラツル
c620_description:
  en: |-
    A Nikke in the Central Government who is tasked with managing the Ark's clandestine agreements.
    Very few people know of her existence, and even her squad is shrouded in secrecy. Firmly believing that the world will one day grow to be truly kind, she thinks of everyone around her as children, and always cares for them with a gentle smile.
  ko: |-
    방주의 비밀 서약들을 관리하는 중앙 정부 소속의 니케.
    베일에 싸여 있는 스쿼드에 소속된 만큼 그녀의 존재를 알고 있는 자는 많지 않다.
    착한 세계가 언젠가 찾아오리라 믿고 있으며, 항상 상냥하게 웃는 얼굴로 주변의 모두를 어린아이처럼 여기며 아끼고 있다.
  ja: |-
    アークにおける秘密の誓約を管理する中央政府所属のニケ。
    秘密のベールに包まれた部隊に所属しているため、
    彼女の存在を知る者は数少ない。
    いつか優しい世界が訪れると信じている。
    いつも優しい笑顔で過ごしながら、
    周囲の人々を子どものように思い、大切にしている。
620_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_620:
  en: Snow Crane's Spare Body
  ko: 백학 스페어 바디
  ja: シラツルのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sr_up:
  en: Sniper Rifle
  ko: 저격소총
  ja: スナイパーライフル
