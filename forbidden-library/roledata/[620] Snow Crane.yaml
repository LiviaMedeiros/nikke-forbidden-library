  ja: |-
    ■自分が誓約解除状態ではない時のみ、味方全体に
    <color=#00AEFF>「回復独占誓約：スキル発動者基準で最大HP{description_value_01}％▲」「持続」</color>
    ■<word_group=10027>回復効果が適用された時</word_group>自分が発動した効果でなければ自分に
    <color=#00AEFF>「誓約違反立証：与えるHP回復量{description_value_02}％▼」「最大{description_value_03}個」「持続」</color>
