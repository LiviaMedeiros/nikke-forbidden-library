    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
26202_name:
  en: Legal Effect
  ko: 서약 효력
  ja: 誓約発効
26202_description:
  en: "■ Activates after {description_value_01} Full Charge attack(s). Affects all
    allies in Exclusive Recovery Agreement status.\n<color=#00AEFF>Recovers {description_value_02}%
    of the caster's <word_group=10025>final</word_group> max HP as HP.</color>\n■
    Activates when entering Full Burst. Affects all allies. \n<color=#00AEFF>Generates
    a <word_group=10023>shield</word_group> with {description_value_03}% of the caster's
    <word_group=10025>final</word_group> max HP for {description_value_04} sec.</color>\n■
    Activates when Proof of Violation reaches max stacks. Affects self. \n<color=#00AEFF>Terminated
    Contract: Gains immunity to Proof of Violation continuously.\nRecovers {description_value_05}%
    of the caster's <word_group=10025>final</word_group> max HP as HP every 1 sec
    continuously.</color>"
  ko: "■ 풀 차지 공격 {description_value_01}회 공격 시 회복 독점 서약 상태인 아군 전체에게 \n<color=#00AEFF>[시전자의
    <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_02}% 회복]</color>\n■
    풀 버스트 타임 시작 시 아군 전체에게 \n<color=#00AEFF>[시전자의 <word_group=10025>최종</word_group>
    최대 체력 비례 {description_value_03}% <word_group=10023>보호막</word_group>] [{description_value_04}초
    유지]</color>\n■ 자신의 서약 위반 증거가 최대 수량이라면 자신에게\n<color=#00AEFF>[서약 해지 : 서약 위반 증거 면역]
    [지속]\n[시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_05}%
    회복] [1초 간격] [지속]</color>"
  ja: |-
    ■フルチャージ状態で{description_value_01}回攻撃した時、回復独占誓約状態の味方全体に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_02}％回復」</color>
    ■フルバーストタイムが発動した時、味方全体に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_03}％の<word_group=10023>バリア</word_group>」「{description_value_04}秒間維持」</color>
    ■自分の誓約違反立証が最大数なら、自分に
    <color=#00AEFF>「誓約解除：誓約違反立証免疫」「持続」
    「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_05}％回復」「1秒間隔」「持続」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
26201_name:
  en: Exclusive Agreement
  ko: 독점 서약
  ja: 独占誓約
26201_description:
  en: |-
    ■ Activates only while not in Terminated Contract status. Affects all allies.
    <color=#00AEFF>Exclusive Recovery Agreement: Max HP ▲ {description_value_01}% of the caster's max HP continuously.</color>
    ■ Activates when <word_group=10027>recovery takes effect</word_group> if the recovery is not coming from this unit. Affects self.
    <color=#00AEFF>Proof of Violation: Potency of HP restored ▼ {description_value_02}% continuously, up to {description_value_03} time(s).</color>
  ko: "■ 자신이 서약 해지 상태가 아닐 때 한하여 아군 전체에게\n<color=#00AEFF>[회복 독점 서약 : 시전자 기준 최대 체력 {description_value_01}%
    ▲] [지속]</color>\n■ <word_group=10027>회복 효과 적용 시</word_group> 자신이 사용한 회복 효과가 아니라면
    자신에게 \n<color=#00AEFF>[서약 위반 증거 : 주는 체력 회복량 {description_value_02}% ▼] [최대 {description_value_03}개]
