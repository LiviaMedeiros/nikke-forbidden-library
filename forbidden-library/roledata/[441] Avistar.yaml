---
441_name:
  en: Avistar
  ko: 아비스타
  ja: アビスタ
c441_description:
  en: A Nikke in the Overseer Squad, an inspection unit. She is calm and always meticulously
    performs her duties at work. She is also an avid fan of Anis.
  ko: |-
    감찰부대 오버시어 스쿼드 소속의 니케.
    침착한 성격으로, 늘 꼼꼼하게 업무를 처리한다.
    아니스의 열렬한 팬이다.
  ja: |-
    監察部隊オーバーシアー所属のニケ。
    落ち着いた性格で、いつも丁寧に業務をこなす。
    アニスの熱狂的なファン。
441_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_441:
  en: Avistar's Spare Body
  ko: 아비스타 스페어 바디
  ja: アビスタのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_mg_down:
  en: Machine Gun
  ko: 머신건
  ja: マシンガン
character_shot_description_localkey_mg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
24412_name:
  en: Afterglow
  ko: 애프터 글러우
  ja: アフターグロウ
24412_description:
  en: |-
    ■ Activates when entering Full Burst while in Stargazer status with over {description_value_01}% HP. Affects self.
    <color=#00AEFF>Current HP ▼ {description_value_02}%</color>
    ■ Activates when entering Full Burst while in Stargazer status. Affects <word_group=10103>her favorite pop star</word_group>.
    <color=#00AEFF><word_group=10066>Projectile Explosion Damage</word_group> ▲ {description_value_03}% continuously.
    Attack Damage ▲ {description_value_04}% continuously.</color>
  ko: |-
    ■ 풀 버스트 타임 시작 시 자신의 체력이 {description_value_01}% 이상이고 스타게이저 상태라면 자신에게
    <color=#00AEFF>[현재 체력 {description_value_02}% ▼]</color>
    ■ 풀 버스트 타임 시작 시 자신이 스타게이저 상태일 때 한하여 <word_group=10103>나의 우상</word_group>에게
    <color=#00AEFF>[<word_group=10066>발사체 폭발 대미지</word_group> {description_value_03}% ▲] [지속]
    [공격 대미지 {description_value_04}% ▲] [지속]</color>
  ja: |-
    ■フルバーストタイムが発動した時、自分のHPが{description_value_01}％以上で、
    スターゲイザー状態なら、自分に
    <color=#00AEFF>「現在のHP{description_value_02}％▼」</color>
    ■フルバーストタイムが発動した時、自分がスターゲイザー状態の時に限り、<word_group=10103>自分のアイドル</word_group>に
    <color=#00AEFF>「<word_group=10066>発射体爆発ダメージ</word_group>{description_value_03}％▲」「持続」
    「攻撃ダメージ{description_value_04}％▲」「持続」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
24411_name:
  en: Aftershow
  ko: 애프터쇼
  ja: アフターショー
24411_description:
  en: |-
    ■ Activates when Full Burst ends. Affects <word_group=10103>her favorite pop star</word_group>.
    <color=#00AEFF>Aftershow: ATK ▲ {description_value_02}% of the caster's ATK. This effect is removed when entering Full Burst.</color>
    ■ Activates when Full Burst ends. Affects self.
    <color=#00AEFF>Recovers {description_value_03}% of the caster's <word_group=10025>final</word_group> max HP as HP every 1 sec for {description_value_04} sec.
    Removes Stargazer.</color>
  ko: |-
    ■ 풀 버스트 타임 종료 시 <word_group=10103>나의 우상</word_group>에게
    <color=#00AEFF>[애프터 쇼 : 시전자 기준 공격력 {description_value_02}% ▲] [풀버스트 진입 시 제거]</color>
    ■ 풀 버스트 타임 종료 시 자신에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_03}% 회복] [1초 간격] [{description_value_04}초 유지]
    [스타 게이저 제거]</color>
  ja: |-
    ■フルバーストタイムが終了した時、<word_group=10103>自分のアイドル</word_group>に
    <color=#00AEFF>「アフターショー：スキル発動者基準で攻撃力{description_value_02}％▲」「フルバーストタイム発動時解除」</color>
    ■フルバーストタイムが終了した時、自分に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_03}％回復」「1秒間隔」「{description_value_04}秒間維持」
    「スターゲイザー解除」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
14413_name:
  en: Stargazer
  ko: 스타게이저
  ja: スターゲイザー
14413_description:
  en: |-
    ■ Affects all allies.
    <color=#00AEFF><word_group=10002>Re-enters Burst</word_group> Stage 1.</color>
    ■ Affects self.
    <color=#00AEFF>Stargazer: Max HP ▲ {description_value_01}% of the caster's max HP continuously.</color>
  ko: |-
    ■ 아군 전체에게
    <color=#00AEFF>[<word_group=10002>버스트 재진입</word_group> 1단계]</color>
    ■ 자신에게
    <color=#00AEFF>[스타게이저 : 시전자 기준 최대 체력 {description_value_01}% ▲] [지속]</color>
  ja: |-
    ■味方全体に
    <color=#00AEFF>「<word_group=10002>バースト再突入</word_group>1段階」</color>
    ■自分に
    <color=#00AEFF>「スターゲイザー：スキル発動者基準で最大HP{description_value_01}％▲」「持続」</color>
skill_name_1001:
  en: Burst Skill
  ko: 버스트 스킬
  ja: バーストスキル
