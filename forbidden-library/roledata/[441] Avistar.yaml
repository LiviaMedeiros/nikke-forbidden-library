c441_Lobby_Touch_1:
  en: Please let me know if you need any intel.
  ko: 필요한 자료가 있으면 말씀해 주세요.
  ja: 必要な資料があったら、言ってください。
c441_Lobby_Touch_2:
  en: I'm a bit busy right now. Could you come back a little later?
  ko: 지금은 바빠서요, 이따가 다시 와주시겠어요?
  ja: 今は忙しいので、またあとで来てくれますか？
c441_Lobby_Touch_3:
  en: Many people are wary of us, likely because of the work we do. It's all part
    of the job, I suppose.
  ko: |-
    저희가 하는 일 때문인지, 경계하는 분들이 많으시더라고요.
    어쩔 수 없죠.
  ja: |-
    仕事柄、警戒されることが多いのです。
    仕方ありません。
c441_Lobby_Touch_Love_1:
  en: If you want to know anything related to Anis, feel free to call me. I have a
    bevy of information.
  ko: |-
    아니스에 관해서 필요한 게 있으시면, 언제든 저를 불러주세요.
    웬만한 자료는 다 갖고 있으니까요.
  ja: |-
    アニスに関して必要なものがあれば、いつでも呼んでください。
    だいたいの資料はそろっています。
c441_Lobby_Touch_Love_2:
  en: I edited some of the footage I took of you during the last mission, and it turned
    out quite well. Would you like to see it?
  ko: |-
    지난 임무 때, 특별 관리 대상님을 찍어서 편집해봤어요.
    제법 잘 나왔는데, 한 번 보실래요?
  ja: |-
    先日の任務の際に、特別管理対象様を撮影して編集してみました。
    よく撮れていると思いますが、ご覧になりますか？
c441_Lobby_Touch_Love_3:
  en: Gaining an inspection unit's trust is a truly remarkable feat. Which is to say,
    I trust you, Person of Interest.
  ko: |-
    감찰 부대의 신뢰를 받는 건, 정말 대단한 거예요.
    그런 의미에서, 신뢰하고 있어요. 특별 관리 대상님.
  ja: |-
    監察部隊の信頼を得るというのは、本当にすごいことです。
    信頼しています。特別管理対象様。
c441_Lobby_Stay_1:
  en: May I leave now? I have several places I need to investigate.
  ko: |-
    저, 조사해야 하는 곳들이 있어서…
    이만 가봐도 될까요?
  ja: |-
    調べたいところがあるので…
    失礼してもよろしいですか？
c441_Lobby_Stay_Love_1:
  en: Take your time. I'll be here editing Anis's concert footage.
  ko: 천천히 오세요, 아니스 무대 영상 편집하고 있으면 되니까요.
  ja: |-
    ゆっくりで構いません。
    アニスのステージ動画を編集していますので。
c441_Outpost_Touch_1:
  en: The Outpost is remarkably clean, no doubt thanks to your leadership.
  ko: 전초기지는 특별 관리 대상님이 관리하셔서 그런가, 깨끗하네요.
  ja: 前哨基地は特別管理対象様が 管理されているからか、 清潔ですね。
c441_Outpost_Touch_2:
  en: I thought I just saw Anis...!
  ko: 방금 아니스를 본 것 같았는데…!
  ja: 今アニスを見かけたような…！
c441_Outpost_Touch_3:
  en: I like reading books in the library, as well as editing videos at home.
  ko: 저는 도서관에서 책을 읽거나, 숙소에서 편집하는 걸 좋아해요.
  ja: |-
    私は図書館で本を読んだり、
    宿所で動画を編集したりすることが 好きです。
c441_Gacha_Get_1:
  en: Hello. I'm Avistar from the inspection unit Overseer.
  ko: 안녕하세요, 감찰 부대 오버시어 소속 아비스타라고 해요.
  ja: こんにちは。監察部隊オーバーシアー所属のアビスタと申します。
c441_Reinforce_1:
  en: Now I can conduct inspections more thoroughly.
  ko: 더 꼼꼼하게 감찰할게요.
  ja: もっと細かく監査しますね。
c441_Reinforce_2:
  en: I feel like I can really chip in now.
  ko: 서류만 보던 저도, 이 정도라면 제법 활약할 수 있겠어요.
  ja: 書類整理ばかりだった私でも、これなら活躍できそうです。
c441_Reinforce_3:
  en: So this is what it feels like... I learned something new.
  ko: 이런 느낌이군요… 하나 배웠어요.
  ja: こんな感じなんですね…勉強になりました。
c441_Gift_1:
  en: Is this for me? ... You didn't get it through any illicit channels, did you?
  ko: |-
    저에게 주시는 건가요?
    …수상한 경로를 통해 받은 물건은 아니겠죠?
  ja: |-
    これを私に…？
    …違法ルートを使って入手したものではありませんよね？
c441_Gift_2:
  en: If possible, I would prefer some Anis-related merchandise.
  ko: 이왕이면, 아니스 관련 굿즈로 부탁드려요.
  ja: せっかくなら、アニスのグッズでお願いします。
c441_Gift_3:
  en: Thank you. I'll make good use of it.
  ko: 감사해요, 유용하게 쓸게요.
  ja: ありがとうございます。大切に使わせていただきます。
c441_Attractive_Up_1:
  en: You're a really good person. I'm always grateful for all you do.
  ko: |-
    특별 관리 대상님은 정말 좋은 분이시네요.
    늘 감사하고 있어요.
  ja: |-
    特別管理対象様は本当に素敵な方ですね。
    いつも感謝しています。
c441_Attractive_Up_2:
  en: My heart is beating fast, just like when I see Anis.
  ko: 아니스를 볼 때처럼, 뭔가 두근두근하네요.
  ja: アニスを見ている時のように、なんだかドキドキしますね。
c441_Attractive_Up_3:
  en: I've never met someone as upright and unsullied as you. Being near you puts
    my mind at ease.
  ko: |-
    특별 관리 대상님처럼 깨끗하고 청렴한 분은 처음이에요.
    옆에 있으면, 마음이 편해져요.
  ja: |-
    特別管理対象様のように清らかで誠実な方は初めてです。
    隣にいると、心が落ち着きます。
c441_Party_Deploy_1:
  en: Combat isn't exactly my forte...
  ko: 전투에는 크게 소질이 없는데요….
  ja: 戦闘の素質はあまりないのですが…
c441_Field_Touch_1:
  en: Yes?
  ko: 예.
  ja: はい。
c441_Field_Go_1:
  en: Moving.
  ko: 이동할게요.
  ja: 移動します。
c441_Battle_Enter_1:
  en: I'll do my best.
  ko: 그래도, 최선을 다해볼게요.
  ja: とにかく、一生懸命頑張ります。
c441_Battle_Ready_1:
  en: Anis, I need your strength!
  ko: 아니스, 저에게 힘을…!
  ja: アニス、私に力を…！
c441_Battle_Ready_2:
  en: I should be able to handle this...
  ko: 이 정도는 별거 아닐 거예요….
  ja: これくらい、大したことありません…
c441_Battle_Ready_3:
  en: I have the perfect plan.
  ko: 이론은 완벽해요.
  ja: 理論は完璧です。
c441_Reload_1:
  en: I just need a little break.
  ko: 좀 더 차분하게 갈게요.
  ja: 落ち着いていきますね。
c441_Reload_2:
  en: Reloading.
  ko: 리로드.
  ja: リロード。
c441_Reload_3:
  en: J-just a moment.
  ko: 자, 잠시만요.
  ja: ちょ、ちょっと待ってください。
c441_Ult_Skill_Ready_1:
  en: I'll handle this.
  ko: 제가 나설게요.
  ja: 私が行きます。
c441_Ult_Skill_1:
  en: N-no peeking! You'll distract me!
  ko: 모, 몰래 보는 건 업무 방해예요!
  ja: こ、こっそり見るなんて、業務妨害ですよ！
c441_FullBurst_1:
  en: Concentrate your fire!
  ko: 이쪽으로, 쏘세요!
  ja: こちらを撃ってください！
c441_Kill_Monster_1:
  en: Got one.
  ko: 정리했어요.
  ja: 片づきました。
c441_Kill_Monster_2:
  en: Who's next?
  ko: 다음은요?
  ja: 次はどこですか？
c441_Kill_Monster_3:
  en: Nice!
  ko: 좋았어…!
  ja: よし…！
c441_Damage_1:
  en: Agh!
  ko: 윽…!
  ja: うっ…！
c441_Damage_2:
  en: Ouch!
  ko: 아야!
  ja: ああ！
c441_Damage_3:
  en: Urgh...
  ko: 크읏….
  ja: くっ…
c441_Die_1:
  en: Looks like I still have a long way to go...
  ko: 아직은… 많이 부족한가 봐요….
  ja: まだまだ…力不足のようです…
c441_Win_1:
  en: I think I managed to pull my weight.
  ko: 이 정도면, 발목을 잡지는 않겠네요.
  ja: これなら、足を引っ張ることはなさそうですね。
