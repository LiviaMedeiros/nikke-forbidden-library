---
472_name:
  en: 'Scarlet: Goddeath'
  ko: '홍련 : 신살'
  ja: 紅蓮：神殺
c472_description:
  en: Scarlet has become whole after inheriting Rose's resolve. Carrying her sister's
    wish in her heart, she raises her sword towards a future she can share with her
    loved ones.
  ko: |-
    장화의 의지를 이어받아 완전해진 홍련.
    언니가 남긴 바람을 가슴에 품고,
    소중한 이들과 함께할 미래를 향해 검을 든다.
  ja: |-
    薔花の意志を継ぎ、完全体となった紅蓮。
    姉が残した願いを胸に抱き、
    大切な人たちと共にある未来に向かって剣を構える
472_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_472:
  en: 'Scarlet: Goddeath''s Spare Body'
  ko: '홍련 : 신살 스페어 바디'
  ja: 紅蓮：神殺のスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_ar_down:
  en: Assault Rifle
  ko: 소총
  ja: アサルトライフル
character_shot_description_localkey_ar_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
24722_name:
  en: 'Beyond the Fade: Sword Dance'
  ko: 화무십일일홍 · 난무
  ja: 花無十一日紅・乱舞
24722_description:
  en: |-
    ■ Activates after landing {description_value_01} critical hits with normal attacks while not in the Beyond the Fade: Full Bloom state. Affects self.
    <color=#00AEFF>Reloads {description_value_02} round(s).</color>
    ■ Activates when using Burst Skill. Affects self.
    <color=#00AEFF><word_group=10111>Into the Fray</word_group>: At One With the Sword
    Function: Enhances Iai damage and the offensive capabilities of normal attacks.
    Effect 1: Normal Attack Critical Rate ▲ {description_value_03}% for {description_value_04} sec. This effect cannot be removed.
    Effect 2: Attack Damage ▲ {description_value_05}% for {description_value_06} sec. This effect cannot be removed.
    Effect 3: Iai's additional damage is <word_group=10084>scaled</word_group> by 100% for {description_value_07} sec. This effect cannot be removed.</color>
  ko: |-
    ■ 일반 공격 크리티컬 {description_value_01}회 명중 시 자신이 화무십일일홍 · 만개 상태가 아니라면 자신에게
    <color=#00AEFF>[탄환 충전 {description_value_02}발]</color>
    ■ 버스트 스킬 사용 시 자신에게
    <color=#00AEFF>[<word_group=10111>임전</word_group> : 신검합일]
    기능 : 일반 공격의 공격 능력과 거합 효과가 강화됩니다.
    효과 1 : [일반 공격 크리티컬 확률 {description_value_03}% ▲] [{description_value_04}초 유지] [해제 불가]
    효과 2 : [공격 대미지 {description_value_05}% ▲] [{description_value_06}초 유지] [해제 불가]
    효과 3 : [거합 추가 대미지 배율이 100% <word_group=10084>증가 상태로 변경</word_group>] [{description_value_07}초 유지] [해제 불가]</color>
  ja: |-
    ■通常攻撃が{description_value_01}回クリティカル命中した時、
    自分が花無十一日紅・満開状態でなければ、自分に
    <color=#00AEFF>「弾丸チャージ{description_value_02}発」</color>
    ■バーストスキルを使用した時、自分に
    <color=#00AEFF>「<word_group=10111>臨戦</word_group>：身剣合一」
    機能：通常攻撃の攻撃能力と居合効果を
    強化する
    効果1：
    「通常攻撃のクリティカル確率{description_value_03}％▲」
    「{description_value_04}秒間維持」「解除不可」
    効果2：「攻撃ダメージ{description_value_05}％▲」
    「{description_value_06}秒間維持」「解除不可」
    効果3：「居合の追加ダメージ倍率が100％
    <word_group=10084>効果量に対し増加</word_group>」「{description_value_07}秒間維持」
    「解除不可」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
24721_name:
  en: 'Beyond the Fade: Bloom'
  ko: 화무십일일홍 · 개화
  ja: 花無十一日紅・開花
24721_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF><word_group=10111>Into the Fray</word_group>: Serene Mind
    Function: Normal attacks become wide-range piercing attacks and deal additional damage to the enemy.
    Effect 1: Affects self. Gains Pierce. This effect is continuous and cannot be removed.
    Effect 2: Affects self. Normal Attack Critical Rate ▲ {description_value_01}%. This effect is continuous and cannot be removed.
    Effect 3: Activates when performing a normal attack. Affects the enemy unit nearest to the crosshair. Iai: Deals {description_value_02}% of <word_group=10025>final</word_group> ATK as additional damage.</color>
    ■ Activates when entering Full Burst. Affects self.
    <color=#00AEFF>Critical Damage ▲ {description_value_03}% for {description_value_04} sec.</color>
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[<word_group=10111>임전</word_group> : 명경지수]
    기능 : 일반 공격이 넓은 폭의 관통 공격으로 발사되고 적에게 추가 대미지를 가합니다.
    효과 1 : 자신에게 [관통 특화] [지속] [해제 불가]
    효과 2 : 자신에게 [일반 공격 크리티컬 확률 {description_value_01}% ▲] [지속] [해제 불가]
    효과 3 : 일반 공격 시 조준선에 가장 가까운 적 1기에게 [거합 : <word_group=10025>최종</word_group> 공격력 {description_value_02}% 추가 대미지]</color>
    ■ 풀 버스트 타임 시작 시 자신에게
    <color=#00AEFF>[크리티컬 대미지 {description_value_03}% ▲] [{description_value_04}초 유지]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「<word_group=10111>臨戦</word_group>：明鏡止水」
    機能：通常攻撃が広範囲の貫通攻撃となり、
    敵に追加ダメージを与える
    効果1：自分に「貫通特化」「持続」
    「解除不可」
    効果2：自分に
    「通常攻撃のクリティカル確率
    {description_value_01}％▲」
    「持続」「解除不可」
    効果3：通常攻撃をした時、
    照準線に最も近い敵1機に
    「居合：<word_group=10025>最終</word_group>攻撃力の{description_value_02}％の
    追加ダメージ」</color>
    ■フルバーストタイムが発動した時、自分に
    <color=#00AEFF>「クリティカルダメージ{description_value_03}％▲」
    「{description_value_04}秒間維持」</color>
