14723_description:
  en: |-
    ■ Affects self.
    <color=#00AEFF>Beyond the Fade: Full Bloom: Changes the weapon in use.
    Function: Enhances Scarlet: Goddeath and increases the range of normal attacks.
    Damage: {description_value_01}% of <word_group=10025>final</word_group> ATK
    Duration: {description_value_02} sec
    Additional Effects
    Effect 1: Normal Attack Range ▲ 100% for {description_value_03} sec. This effect cannot be removed.
