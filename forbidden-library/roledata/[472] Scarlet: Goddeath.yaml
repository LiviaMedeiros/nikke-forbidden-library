  ko: '홍련 : 흑영'
  ja: 紅蓮：ブラックシャドウ
226_name:
  en: 'Rapunzel: Pure Grace'
  ko: '라푼젤 : 퓨어 그레이스'
  ja: ラプンツェル：ピュアグレイス
471_name:
  en: 'Snow White: Heavy Arms'
  ko: '스노우 화이트 : 헤비암즈'
  ja: スノーホワイト：ヘビーアームズ
473_name:
  en: 'Rapunzel: Sanctuary'
  ko: '라푼젤 : 생츄어리'
  ja: ラプンツェル：サンクチュアリ
c472_Lobby_Touch_1:
  en: "'Twas a great blessing to behold my sister one final time."
  ko: 마지막으로, 언니를 볼 수 있어 좋았네.
  ja: 最後に、姉さんの顔が見られてよかった。
c472_Lobby_Touch_2:
  en: Let not haste overcome thee. One drink, and thy trouble shall seem no great
    matter.
  ko: |-
    급하게 굴 것 없네.
    술 한잔 기울이고 나면 별것 아니게 될 테니.
  ja: |-
    急ぐ必要はない。
    一杯飲めば、大したことではなくなるさ。
c472_Lobby_Touch_3:
  en: I dream'd a dream much too sumptuous for one of my estate. I shall never forget
    it.
  ko: |-
    분에 넘치는 호화로운 꿈을 꾸었지 뭔가.
    평생 잊지 못할 것 같군그래.
  ja: |-
    身に合わぬぜいたくな夢を見てしまったようだ。
    一生涯忘れ得ぬであろうな。
c472_Lobby_Touch_Love_1:
  en: Thy face appears to shine. Doth our reunion after this long while bring thee
    joy?
  ko: |-
    표정이 밝군.
    간만에 보니 반가워서 그런 건가?
  ja: |-
    明るい顔だねぇ。
    久方ぶりに会えて嬉しいかい？
c472_Lobby_Touch_Love_2:
  en: Many things have I cleaved in my days, but never would I wish to sever the bond
    betwixt us.
  ko: |-
    내 많은 것을 베어왔네만,
    도령과의 인연만큼은 베고 싶지 않아.
  ja: |-
    多くのものを斬ってきたが…
    ぼっちゃんとの縁だけは斬りたくないものだ。
c472_Lobby_Touch_Love_3:
  en: To behold my comrades thus restored doth awaken within me new feeling.
  ko: |-
    이것 참.
    새로워진 동료들의 모습을 보니 감회가 새롭군그래.
  ja: |-
    さてはて…
    一皮むけた仲間たちの姿は、感無量だねぇ。
c472_Lobby_Stay_1:
  en: Hath thy business taken thee elsewhere? Thou art aloof as a passing shadow.
  ko: |-
    도령은 늘 바쁘군.
    얼굴 보기가 참 힘들단 말이지.
  ja: |-
    相変わらず忙しいようだねぇ。
    顔を拝むのも一苦労だ。
c472_Lobby_Stay_Love_1:
  en: Folly followeth haste. I shall prepare us some fine liquor; return in thine
    own good time.
  ko: |-
    서두르면 일을 그르치는 법.
    좋은 술을 준비해 놓고 기다릴 테니 천천히 오시게.
  ja: |-
    急いては事を仕損じるというであろう。
    いい酒を用意して待っている、のんびり来ておくれ。
c472_Outpost_Touch_1:
  en: Knowest thou where to find good, strong drink? Lead me thither.
  ko: |-
    괜찮은 술을 맛볼 수 있는 곳은 어디인가?
    안내해 주게.
  ja: |-
    うまい酒が味わえる場所はどこだい？
    案内しておくれ。
c472_Outpost_Touch_2:
  en: Pray, what manner of splendidly adorned edifice stands yonder?
  ko: 호오, 저기 저 화려하게 생긴 건물은 뭘 하는 곳인가?
  ja: おや…あの目を引く建物は、 いったい何をするところだい？
c472_Outpost_Touch_3:
  en: Much bettered is this place since my previous visitation. The fruit, no doubt,
    of thine endeavors.
  ko: |-
    이전에 왔을 때보다 훨씬 좋아졌군.
    다 도령이 노력한 덕이겠지.
  ja: |-
    前に来た時より、 ずいぶんよくなっておる。
    これもぼっちゃんの 努力のたまものだねぇ。
c472_Gacha_Get_1:
  en: I shall honor my sister's wish and live in happiness. Pray, accompany me, my
    Lord.
  ko: |-
    나는 언니의 바람에 따라 행복해질걸세.
    도령도 함께 해주게나.
  ja: |-
    私は姉さんの願い通り、幸せになるぞ。
    ぼっちゃんもそばにいておくれ。
c472_Reinforce_1:
  en: This gift of thine doth truly amaze. My body is grown lighter.
  ko: |-
    참 신기한 재주일세.
    몸이 한결 가벼워졌군.
  ja: |-
    実に不思議だね。
    体がずいぶん軽くなった。
c472_Reinforce_2:
  en: Methinks I could cleave aught asunder.
  ko: 뭐든 베어낼 수 있을 것만 같네.
  ja: 今なら何でも斬れそうだ。
c472_Reinforce_3:
  en: It now seems to me our triumph on the surface is nigh.
  ko: 지상 탈환이 머지않았다는 기분이 드는군.
  ja: 地上奪還の時は遠くなさそうだ。
c472_Gift_1:
  en: Bestowest thou on me such a precious gift?
  ko: 이런 귀한 걸 주어도 괜찮겠나?
  ja: こんな貴重なものをもらってもいいのかい？
c472_Gift_2:
  en: I fear this may inspire jealousy in the others.
  ko: 이거 원, 다른 낭자들의 시샘을 받을지도 모르겠군.
  ja: おやおや、他のお嬢ちゃんたちに何と言われるか…
c472_Gift_3:
  en: When all is done, I shall repay this grace with a most exquisite bottle of liquor.
  ko: |-
    이 은혜는 모든 게 끝난 뒤에 갚겠네.
    아주 좋은 술로 말일세.
  ja: |-
    この恩は、すべてが片付いた時に返すとしよう。
    極上の酒という形でな。
c472_Attractive_Up_1:
  en: I see thou desirest to drink with me. Thy countenance tells all.
  ko: 표정을 보아하니, 나와 한잔하고 싶은 모양이로군.
  ja: その顔、私と一杯やりたいと言っているねぇ。
c472_Attractive_Up_2:
  en: I marvel how thou utterest such indiscretions with facility, my Lord.
  ko: 도령은 어찌그리 낯간지러운 말을 잘하는 건지.
  ja: ぼっちゃんは、よくあんな照れくさい言葉を口にできるものだ。
c472_Attractive_Up_3:
  en: Thy presence makes me drunk without liquor, as it were.
  ko: 도령과 함께 있으면, 술이 없어도 취하는 기분일세.
  ja: ぼっちゃんといると、酒がなくとも酔い心地だ。
c472_Party_Deploy_1:
  en: Shall I go forth?
  ko: 벌써 내가 나설 차례인가.
  ja: そろそろ私の出番か？
c472_Field_Touch_1:
  en: Didst thou call?
  ko: 불렀는가.
  ja: 呼んだかい？
c472_Field_Go_1:
  en: I shall lead.
  ko: 앞장서겠네.
  ja: 私が前に出よう。
c472_Battle_Enter_1:
  en: Let us give them battle.
  ko: 자, 그럼 베러 가봄세.
  ja: では、参ろう。
c472_Battle_Ready_1:
  en: Hold thy distance and observe, my Lord.
  ko: 도령은 뒤에서 구경이나 하게나.
  ja: ぼっちゃんは後ろで見ていておくれ。
c472_Battle_Ready_2:
  en: Good fortune. My body and blade are restless.
  ko: 몸이 근질근질하던 차에 잘 됐군.
  ja: ちょうど体がうずいていたところだ。
c472_Battle_Ready_3:
  en: Be not troubled. I shall end this swiftly.
  ko: 걱정 말게, 금방 끝낼 테니.
  ja: 心配には及ばぬ、すぐに片をつけよう。
c472_Reload_1:
  en: There is no need to rush.
  ko: 서두르지 말게나.
  ja: 慌てるでない。
c472_Reload_2:
  en: I am sheathing my blade.
  ko: 납도 중일세.
  ja: 刀を休ませよう。
c472_Reload_3:
  en: There is virtue in rest.
  ko: 휴식 또한 중요한 법이지.
  ja: 息継ぎもまた大切だ。
c472_Ult_Skill_Ready_1:
  en: The time has come.
  ko: 때가 왔네.
  ja: 時が来た。
c472_Ult_Skill_1:
  en: Bloom. Beyond the fade.
  ko: 피어라. 화무십일일홍.
  ja: 咲き誇れ…花無十一日紅。
c472_FullBurst_1:
  en: Grant them no respite.
  ko: 쉴 틈 없이 밀어붙이겠네.
  ja: 休む間は与えてやらぬぞ。
c472_Kill_Monster_1:
  en: An easy foe.
  ko: 문제없네.
  ja: 事もなし。
c472_Kill_Monster_2:
  en: Cleaved in twain.
  ko: 잘 베어지는군.
  ja: 実によく斬れる。
c472_Kill_Monster_3:
  en: Farewell.
  ko: 잘 가게나.
  ja: 往生せい。
c472_Damage_1:
  en: Ngh!
  ko: 큿…!
  ja: くっ…！
c472_Damage_2:
  en: Ugh!
  ko: 읏…!
  ja: うっ…！
c472_Damage_3:
  en: How vexing.
  ko: 성가시군.
  ja: 面倒な…
c472_Die_1:
  en: Is my blade... grown dull...?
  ko: 이것 참… 베어내지 못했단 말인가.
  ja: やれやれ…斬り損ねたか。
c472_Win_1:
  en: Are thou watching, Rose? Behold thy sister, whom thou lovest so.
  ko: |-
    언니, 보고 있는가.
    언니의 자랑스러운 동생을.
  ja: |-
    姉さん、見ているかい。
    姉さんの自慢の妹を。
472_cv_ja:
  en: 'CV: Reina Ueda'
  ko: 'CV : 우에다 레이나'
  ja: CV：上田麗奈
472_cv_ko:
  en: 'CV: Jang Ye-na'
  ko: 'CV : 장예나'
  ja: CV：チャン・イェナ
