    <color=#00AEFF>[화무십일일홍 · 만개 : 사용 무기 변경]
    기능 : 자신을 강화하고 일반 공격을 더 넓은 폭으로 공격합니다.
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_01}% 대미지
    유지 시간 : {description_value_02}초
    추가 효과
    효과 1 : [일반 공격 폭 100% ▲] [{description_value_03}초 유지] [해제 불가]
    효과 2 : [공격력 {description_value_04}% ▲] [{description_value_05}초 유지] [해제 불가]</color>
    ■ 조준선에 가장 가까운 적 {description_value_06}기에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_07}% 추가 대미지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「花無十一日紅・満開：使用武器変更」
    機能：自分を強化し通常攻撃の範囲が
    さらに拡大
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_01}％のダメージ
    持続時間：{description_value_02}秒
    追加効果
    効果1：「通常攻撃の範囲100％▲」
    「{description_value_03}秒間維持」「解除不可」
    効果2：「攻撃力{description_value_04}％▲」
    「{description_value_05}秒間維持」「解除不可」</color>
    ■照準線に最も近い敵{description_value_06}機に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_07}％の追加ダメージ」</color>
