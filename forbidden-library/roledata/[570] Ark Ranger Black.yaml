---
570_name:
  en: Ark Ranger Black
  ko: 아크레인저 블랙
  ja: アークレンジャー・ブラック
c570_description:
  en: |-
    The Nikke who plays Black in the hit show Ark Rangers.
    While she already plays a hero on TV, her dream is to become a real hero off-screen. She is always pushing herself to the limit through an intense training regimen.
  ko: |-
    인기 프로그램 여신전대 아크레인저에서 블랙 역할을 맡고 있다.
    언제나 혹독한 트레이닝으로 자신을 한계까지 몰아붙여 훈련한다.
    TV 속 역할만이 아니라, TV 밖에서도 진정한 히어로가 되길 꿈꾸고 있다.
  ja: |-
    人気番組「女神戦隊アークレンジャー」のブラック。
    過酷なトレーニングで自分を限界まで追い込み、
    鍛錬を重ねる。テレビの中の役としてだけでなく、
    現実の世界でも本物のヒーローになることを夢見ている。
570_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_570:
  en: Ark Ranger Black's Spare Body
  ko: 아크레인저 블랙 스페어 바디
  ja: アークレンジャー・ブラックのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_ar_down:
  en: Assault Rifle
  ko: 소총
  ja: アサルトライフル
character_shot_description_localkey_ar_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
25702_name:
  en: Tremble! Ark Black Collider!
  ko: 전율! 아크 블랙 코레더!
  ja: 激震！アークブラックコレダー！
25702_description:
  en: |-
    ■ Activates when Transformation takes effect and when the enemy appears while Transformation is in effect. Affects all enemies.
    <color=#00AEFF>Ark Black Collider: Deals {description_value_01}% of <word_group=10025>final</word_group> ATK as sustained damage every 1 sec until Transformation is <word_group=10101>canceled</word_group>.</color>
    ■ Activates when entering Full Burst. Affects all Wind Code allies with assault rifles.
    <color=#00AEFF>Sustained Damage ▲ {description_value_02}% for {description_value_03} sec.</color>
  ko: |-
    ■ 변신 상태 적용 시와 변신 상태 적용 중 적 등장 시 적 전체에게
    <color=#00AEFF>[아크 블랙 코레더 : <word_group=10025>최종</word_group> 공격력 {description_value_01}% 지속 대미지] [1초 간격] [변신 <word_group=10101>삭제</word_group> 시 해제]</color>
    ■ 풀 버스트 타임 시작 시 풍압 코드 소총 아군 전체에게
    <color=#00AEFF>[지속 대미지 {description_value_02}% ▲] [{description_value_03}초 유지]</color>
  ja: |-
    ■変身状態が適用された時および
    変身状態適用中に敵が出現した時、敵全体に
    <color=#00AEFF>「アークブラックコレダー：<word_group=10025>最終</word_group>攻撃力
    {description_value_01}％の持続ダメージ」「1秒間隔」
    「変身<word_group=10101>解除</word_group>まで」</color>
    ■フルバーストタイムが発動した時、
    風圧コードのアサルトライフルの味方全体に
    <color=#00AEFF>「持続ダメージ{description_value_02}％▲」「{description_value_03}秒間維持」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
25701_name:
  en: Transform! Ark Ranger Black!
  ko: 변신! 아크레인저 블랙!
  ja: 変身！アークレンジャー・ブラック！
25701_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF><word_group=10011>Damage to Parts</word_group> ▲ {description_value_01}% continuously.</color>
    ■ Activates when an ally or self <word_group=10052>destroys an enemy's part</word_group>. Affects self.
    <color=#00AEFF>Charges battery by {description_value_02}% continuously, up to 100%. This effect cannot be removed.</color>
    ■ Activates when battery reaches 100%. Affects self.
    <color=#00AEFF>Transformation
    Function: Transforms into an Ark Ranger and strengthens herself while depleting her battery.
    Effect 1: Battery ▼ {description_value_04}% every 0.2 sec continuously. This effect cannot be removed.
    Effect 2: ATK ▲ {description_value_05}% continuously. This effect cannot be removed.
    <word_group=10097>Deactivation condition</word_group>: When the battery drops to 0%</color>
    ■ Activates after performing {description_value_07} normal attack(s). Affects self.
    <color=#00AEFF>Sustained Damage ▲ {description_value_08}% for {description_value_09} sec.</color>
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[<word_group=10011>파츠 대미지</word_group> {description_value_01}% ▲] [지속]</color>
    ■ 자신을 포함한 아군 누군가 <word_group=10052>파츠 파괴 시</word_group> 자신에게
    <color=#00AEFF>[배터리 {description_value_02}% 충전] [최대 100%] [지속] [해제 불가]</color>
    ■ 배터리가 100% 도달 시 자신에게
    <color=#00AEFF>[변신]
    기능 : 아크레인저로 변신하여 배터리를 소모하는 대신 자신을 강화합니다.
    효과1 : [배터리 {description_value_04}% ▼] [0.2초 간격] [지속] [해제 불가]
    효과2 : [공격력 {description_value_05}% ▲] [지속] [해제 불가]
    <word_group=10097>제거 시점</word_group> : 배터리가 0% 도달 시</color>
    ■ 일반 공격 {description_value_07}회 공격 시 자신에게
    <color=#00AEFF>[지속 대미지 {description_value_08}% ▲] [{description_value_09}초 유지]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「<word_group=10011>パーツダメージ</word_group>{description_value_01}％▲」「持続」</color>
    ■自分を含む味方の誰かが
    <word_group=10052>パーツを破壊した時</word_group>、自分に
    <color=#00AEFF>「バッテリー{description_value_02}％チャージ」「最大100％」「持続」「解除不可」</color>
    ■バッテリーが100％になった時、自分に
    <color=#00AEFF>「変身」
    機能：アークレンジャーに変身し、 バッテリーを消費する代わりに 自分を強化する
    効果1：「バッテリー{description_value_04}％▼」「0.2秒間隔」「持続」「解除不可」
    効果2：「攻撃力{description_value_05}％▲」「持続」「解除不可」
    <word_group=10097>解除条件</word_group>：バッテリーが0％になった時</color>
    ■通常攻撃で{description_value_07}回攻撃した時、自分に
    <color=#00AEFF>「持続ダメージ{description_value_08}％▲」「{description_value_09}秒間維持」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
15703_name:
  en: Ultimate Attack! Ark Black Meteor!
  ko: 궁극! 아크 블랙 메테오!
  ja: 必殺！アークブラックメテオ！
15703_description:
  en: |-
    ■ Activates while in Transformation status. Affects self.
    <color=#00AEFF>Battery ▲ {description_value_03}%</color>
    ■ Activates while not in Transformation status. Affects self.
    <color=#00AEFF>Emergency Charge Protocol
    Function: Quickly charges the battery and transforms into an Ark Ranger.
    Effect 1: Battery ▲ 100%
    Effect 2: Battery ▼ {description_value_06}% after transforming.</color>
    ■ Affects the {description_value_07} enemy unit(s) with the highest <word_group=10025>final</word_group> max HP.
    <color=#00AEFF>Deals {description_value_08}% of <word_group=10025>final</word_group> ATK as sustained damage every 1 sec for {description_value_09} sec.</color>
    ■ Affects self.
    <color=#00AEFF>Sustained Damage ▲ {description_value_10}% for {description_value_11} sec.</color>
  ko: |-
    ■ 자신이 변신 상태라면 자신에게
    <color=#00AEFF>[배터리 {description_value_03}% ▲]</color>
    ■ 자신이 변신 상태가 아니라면 자신에게
    <color=#00AEFF>[배터리 긴급 충전] :
    기능 : 긴급하게 배터리를 충전하여 아크레인저로 변신합니다.
    효과1 : [배터리 100% ▲]
    효과2 : 변신 이후 [배터리 {description_value_06}% ▼]</color>
    ■ <word_group=10025>최종</word_group> 최대 체력이 가장 높은 적 {description_value_07}기에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_08}% 지속 대미지] [1초 간격] [{description_value_09}초 유지]</color>
    ■ 자신에게
    <color=#00AEFF>[지속 대미지 {description_value_10}% ▲] [{description_value_11}초 유지]</color>
  ja: |-
    ■自分が変身状態なら、自分に
    <color=#00AEFF>「バッテリー{description_value_03}％▲」</color>
    ■自分が変身状態でなければ、自分に
    <color=#00AEFF>「バッテリー緊急チャージ」：
    機能：緊急でバッテリーをチャージし、
    アークレンジャーに変身する
    効果1：「バッテリー100％▲」
    効果2：変身後、「バッテリー{description_value_06}％▼」</color>
    ■<word_group=10025>最終</word_group>最大HPが最も高い敵{description_value_07}機に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_08}％の持続ダメージ」
    「1秒間隔」
    「{description_value_09}秒間維持」</color>
    ■自分に
    <color=#00AEFF>「持続ダメージ{description_value_10}％▲」「{description_value_11}秒間維持」</color>
