c570_Lobby_Touch_1:
  en: Ark Ranger Black! Transform!
  ko: 아크레인저 블랙! 변신!
  ja: アークレンジャー・ブラック！変身！
c570_Lobby_Touch_2:
  en: Once again, I've protected peace on the Ark.
  ko: 오늘도 방주의 평화를 무사히 지켜냈다.
  ja: 今日も無事、アークの平和を守り抜いた。
c570_Lobby_Touch_3:
  en: If trouble comes your way, call for the Ark Rangers. No matter where we are,
    we'll hear your call and come to your aid.
  ko: |-
    무슨 일이 생긴다면, 아크레인저를 불러라.
    어디에 있든, 그 목소리를 듣고 찾아가겠다.
  ja: |-
    何かあったら、アークレンジャーを呼べ。
    どこにいようと、必ず駆けつける。
c570_Lobby_Touch_Love_1:
  en: A hero doesn't entrust their back to just anyone... but with you, I think I
    can.
  ko: |-
    히어로는 함부로 등을 맡기지 않지만,
    너라면 믿고 맡겨도 될 듯하군.
  ja: |-
    ヒーローは、誰にでも背中を預けるわけではない。
    だが、君なら信じて任せられそうだ。
c570_Lobby_Touch_Love_2:
  en: I respect you a great deal. You've become the Ark's hero, despite being an ordinary
    human.
  ko: |-
    평범한 사람의 몸으로 방주의 히어로가 되다니,
    너를 존경하고 있다.
  ja: |-
    生身の人間の身体でアークのヒーローになるとは…
    尊敬に値する。
c570_Lobby_Touch_Love_3:
  en: Keep your eyes on us from here on out.
  ko: 앞으로도 우리의 활약을 지켜봐 주면 좋겠군.
  ja: これからも我々の活躍をしっかり見守ってくれ。
c570_Lobby_Stay_1:
  en: There are citizens out there right now living in fear. Let me go help them.
  ko: |-
    지금도 불안에 떨고 있는 시민이 어딘가에 있을 거다.
    나를 이만 보내다오.
  ja: |-
    今も私を待っている者が、どこかにいるはずだ。
    止めないでくれ。
c570_Lobby_Stay_Love_1:
  en: Preparations are complete. Call on the Ark Rangers whenever you need us.
  ko: |-
    모든 준비를 마쳤다.
    언제든 아크레인저를 불러 다오.
  ja: |-
    準備はすべて整った。
    いつでもアークレンジャーを呼んでくれ。
c570_Outpost_Touch_1:
  en: I see there is now one more place the Ark Rangers must protect.
  ko: 아크레인저가 지켜야 할 곳이 한 군데 더 늘었군.
  ja: アークレンジャーが 守るべき場所が、また一つ増えた。
c570_Outpost_Touch_2:
  en: Everyone here deserves to be called a hero.
  ko: 이곳에 있는 모두가 히어로라고 해도 과언이 아니겠군.
  ja: ここにいる全員が ヒーローだと言っても 過言ではないだろう。
c570_Outpost_Touch_3:
  en: I'm going to stop by the gym. I can't neglect my training.
  ko: |-
    체육관에 들를 예정이다.
    훈련을 게을리해서는 안 되니까.
  ja: |-
    ジムに寄る予定だ。
    トレーニングを怠るわけには いかないからな。
c570_Gacha_Get_1:
  en: The Ark Rangers will always protect peace on the Ark!
  ko: 방주의 평화는, 우리 아크레인저가 지킨다!
  ja: アークの平和は、私たちアークレンジャーが守る！
c570_Reinforce_1:
  en: An Ark Ranger never stops improving.
  ko: 아크레인저는 끝도 없이 성장한다.
  ja: アークレンジャーは、どこまでも成長し続ける。
c570_Reinforce_2:
  en: Now I can protect even more people.
  ko: 더 많은 시민을 지킬 수 있겠군.
  ja: より多くの人々を守ることができそうだ。
c570_Reinforce_3:
  en: Thank you. I've grown stronger because of you.
  ko: 고맙다. 덕분에 더 성장했다.
  ja: ありがとう。おかげで、さらに成長できた。
c570_Gift_1:
  en: I... really didn't see this coming. Thank you.
  ko: |-
    이건… 정말 생각지도 못했다.
    진심으로 고맙다.
  ja: |-
    これは…まったく想像していなかった。
    心から感謝する。
c570_Gift_2:
  en: Thank you. I'll fight to bring the gift of peace to more people.
  ko: 나도 더 많은 시민들에게 평화를 선물할 수 있도록 하겠다.
  ja: 私もより多くの人々に平和を届けられるよう、最善を尽くす。
c570_Gift_3:
  en: This was exactly what I needed. I don't know how you knew, but I'll put it to
    good use.
  ko: |-
    마침 내게 필요했던 거다.
    어떻게 알았는지는 모르겠지만, 잘 쓰겠다.
  ja: |-
    まさに私が必要としていたものだ。
    なぜ分かったのかは見当もつかないが、大切に使わせてもらう。
c570_Attractive_Up_1:
  en: "... It seems I've found a new hero of my own."
  ko: "…내게도 새로운 영웅이 생긴 것 같군."
  ja: "…私にも新たなヒーローができたようだ。"
c570_Attractive_Up_2:
  en: I can't make sense of this feeling. Respect? Admiration? Or perhaps... something
    else.
  ko: |-
    이 감정이 무엇인지 모르겠다.
    존경? 경의? 그것도 아니라면….
  ja: |-
    この感情はいったい…
    尊敬？敬意？それとも…
c570_Attractive_Up_3:
  en: You always inspire me. I want to become someone who can do the same.
  ko: |-
    너는 늘 나에게 감동을 주는군.
    나도 그런 존재가 되고 싶다.
  ja: |-
    君はいつも私に感動を与えてくれる。
    私もそのような存在になりたい。
c570_Party_Deploy_1:
  en: Are you in need of a hero?
  ko: 히어로가 필요한 순간인가.
  ja: 今こそ、ヒーローが必要な時か。
c570_Field_Touch_1:
  en: You called?
  ko: 불렀나.
  ja: 呼んだか？
c570_Field_Go_1:
  en: Moving out.
  ko: 이동하지.
  ja: 移動しよう。
c570_Battle_Enter_1:
  en: Ark Ranger Black, ready for battle!
  ko: 아크레인저 블랙! 준비 완료!
  ja: アークレンジャー・ブラック！準備はできている！
c570_Battle_Ready_1:
  en: Bring it on, you Rapture fiends!
  ko: 덤벼라! 랩쳐 괴인들!
  ja: かかってこい！ラプチャー怪人どもめ！
c570_Battle_Ready_2:
  en: Get behind me, everyone!
  ko: 다들, 내 뒤로 숨어라!
  ja: みんな、私の後ろに隠れろ！
c570_Battle_Ready_3:
  en: Don't worry, we'll protect you.
  ko: 우리가 지켜줄 테니, 걱정하지 마라.
  ja: 私たちが守る。心配するな。
c570_Reload_1:
  en: The enemy is strong.
  ko: 쉽지 않은 상대다.
  ja: 手強い相手だ。
c570_Reload_2:
  en: Don't worry. Just trust us.
  ko: 걱정 말고, 우리를 믿어라.
  ja: 心配無用だ、私たちを信じろ。
c570_Reload_3:
  en: Anyone hurt?
  ko: 모두, 다친 곳은 없나?
  ja: みんな、ケガはないか？
c570_Ult_Skill_Ready_1:
  en: Here I go!
  ko: 간다!
  ja: 行くぞ！
c570_Ult_Skill_1:
  en: Ultimate attack! Ark Black Meteor!
  ko: 궁극! 아크 블랙 메테오-!!
  ja: 必殺！アークブラックメテオー！！
c570_FullBurst_1:
  en: Our time is now!
  ko: 우리의 시간이다!
  ja: 私たちの時間だ！
c570_Kill_Monster_1:
  en: Hardly a challenge.
  ko: 별거 아니군.
  ja: たいしたことはないな。
c570_Kill_Monster_2:
  en: That one's down.
  ko: 해치웠다.
  ja: 片付けたぞ。
c570_Kill_Monster_3:
  en: Who's next?
  ko: 다음은 누구냐!
  ja: 次は、誰だ！
c570_Damage_1:
  en: Argh...!
  ko: 큭…!
  ja: くっ…！
c570_Damage_2:
  en: I'm fine!
  ko: 난 괜찮다!
  ja: 私は平気だ！
c570_Damage_3:
  en: Ugh...!
  ko: 으윽…!
  ja: ううっ…！
c570_Die_1:
  en: A hero... never falls...!
  ko: 히어로는… 절대 쓰러지지 않는다…!
  ja: ヒーローは…絶対に倒れない…！
c570_Win_1:
  en: Have no fear, for we will never lose!
  ko: 두려워하지 마라. 우리는 절대 지지 않는다!
  ja: 恐れるな。我々は、絶対に負けない！
