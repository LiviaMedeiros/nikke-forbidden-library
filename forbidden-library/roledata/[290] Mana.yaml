  ko: 소총
  ja: アサルトライフル
character_shot_description_localkey_ar_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
22902_name:
  en: Metal σ
  ko: 매터 시그마
  ja: マターシグマ
22902_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Metal σ: <word_group=10014>Burst Gauge filling speed</word_group> ▲ {description_value_01}% continuously.</color>
    ■ Activates when entering Full Burst while in the Metal σ state. Affects self.
    <color=#00AEFF>Attack Damage ▲ {description_value_02}% for {description_value_03} sec.
    ATK ▲ {description_value_04}% for {description_value_05} sec.
    Removes Metal σ.</color>
    ■ Activates when entering Full Burst. Affects the {description_value_06} ally unit(s) with the longest base Charge Time.
    <color=#00AEFF>Charge Time ▼ {description_value_07} sec for {description_value_08} sec.</color>
    ■ Activates if the skill user used her Burst Skill before the end of Full Burst. Affects self.
    <color=#00AEFF>Metal σ: <word_group=10014>Burst Gauge filling speed</word_group> ▲ {description_value_01}% continuously.</color>
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[매터 시그마 : <word_group=10014>버스트 게이지 충전 속도</word_group> {description_value_01}% ▲] [지속]</color>
    ■ 풀 버스트 타임 시작 시 자신이 매터 시그마 상태라면 자신에게
    <color=#00AEFF>[공격 대미지 {description_value_02}% ▲] [{description_value_03}초 유지]
    [공격력 {description_value_04}% ▲] [{description_value_05}초 유지]
    [매터 시그마 해제]</color>
    ■ 풀 버스트 타임 시작 시 기본 차지 시간이 가장 긴 아군 {description_value_06}기에게
    <color=#00AEFF>[차지 시간 {description_value_07}초 ▼] [{description_value_08}초 유지]</color>
    ■ 풀 버스트 타임 종료 시 직전에 자신이 버스트 스킬을 사용 했다면 자신에게
    <color=#00AEFF>[매터 시그마 : <word_group=10014>버스트 게이지 충전 속도</word_group> {description_value_01}% ▲] [지속]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「マターシグマ：<word_group=10014>バーストゲージのチャージ速度</word_group>
    {description_value_01}％▲」「持続」</color>
    ■フルバーストタイムが発動した時、自分がマターシグマ状態なら自分に
    <color=#00AEFF>「攻撃ダメージ{description_value_02}％▲」「{description_value_03}秒間維持」
    「攻撃力{description_value_04}％▲」「{description_value_05}秒間維持」
    「マターシグマ解除」</color>
    ■フルバーストタイムが発動した時、基本チャージ時間が一番長い味方{description_value_06}機に
    <color=#00AEFF>「チャージ時間{description_value_07}秒▼」「{description_value_08}秒間維持」</color>
    ■フルバーストタイムが終了した時、直前に自分がバーストスキルを使用していれば自分に
    <color=#00AEFF>「マターシグマ：<word_group=10014>バーストゲージのチャージ速度</word_group>{description_value_01}％▲」「持続」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
22901_name:
  en: Metal γ
  ko: 매터 감마
  ja: マターガンマ
22901_description:
  en: "■ Activates at the start of battle. Affects self. \n<color=#00AEFF>Metal γ:
    ATK ▲ {description_value_01}% continuously. Activates once per battle.</color>\n■
    Activates when in the Metal γ state after performing 10 normal attacks. Affects
    all allies.\n<color=#00AEFF>Restores HP equal to {description_value_02}% of the
    skill user's <word_group=10025>final</word_group> max HP.</color>\n■ Activates
    when an ally is incapacitated while the skill user is in the Metal γ state. Affects
    the {description_value_03} incapacitated ally unit(s) with the highest <word_group=10025>final</word_group>
    ATK (except the skill user).\n<color=#00AEFF>Revives with {description_value_04}%
    HP.</color>\n■ Activates when an ally is incapacitated. Affects self.\n<color=#00AEFF>Removes
    Metal γ.</color>"
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[매터 감마 : 공격력 {description_value_01}% ▲] [지속] [전투 중 1회 발동]</color>
    ■ 일반 공격 10회 공격 시 자신이 매터 감마 상태라면 아군 전체에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_02}% 회복]</color>
    ■ 아군 전투불능 시 자신이 매터 감마 상태라면 자신을 제외한 전투불능 상태 <word_group=10025>최종</word_group> 공격력이 가장 높은 아군 {description_value_03}기에게
    <color=#00AEFF>[체력 {description_value_04}%로 부활]</color>
    ■ 아군 전투불능 시 자신에게
    <color=#00AEFF>[매터 감마 해제]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「マターガンマ：攻撃力{description_value_01}％▲」
    「持続」「戦闘中1回発動」</color>
    ■通常攻撃で10回攻撃した時、
    自分がマターガンマ状態なら味方全体に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの
    {description_value_02}％回復」</color>
    ■味方が戦闘不能時、自分が
    マターガンマ状態なら
    自分を除く戦闘不能状態の
    <word_group=10025>最終</word_group>攻撃力が最も高い味方{description_value_03}機に
    <color=#00AEFF>「HP{description_value_04}％で復活」</color>
    ■味方が戦闘不能時、自分に
    <color=#00AEFF>「マターガンマ解除」</color>
