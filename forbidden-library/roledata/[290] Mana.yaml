     <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_04}% 지속 대미지] [1초 간격] [{description_value_05}초 유지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「持続ダメージ{description_value_01}％▲」「{description_value_02}秒間維持」</color>
    ■照準線に最も近い敵{description_value_03}機に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_04}％の持続ダメージ」
    「1秒間隔」「{description_value_05}秒間維持」</color>
