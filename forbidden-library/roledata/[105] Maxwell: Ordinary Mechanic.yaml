    <color=#00AEFF>「攻撃ダメージ{description_value_04}％▲」「{description_value_05}秒間維持」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
11053_name:
  en: Matis UberBuster
  ko: 메티스 버스트 버스터
  ja: メティスバスターバスター
11053_description:
  en: |-
    ■ Affects self.
    <color=#00AEFF>Changes the weapon in use: Matis UberBuster
    Charge Time is fixed. Effect varies according to the stage of Overcurrent. Only one effect is triggered at a time.
    Charge Time: {description_value_09}sec.
    Stage 1 or below: Fixed at {description_value_09} sec.
    Stage 2: Fixed at {description_value_01} sec.
    Stage 3: Fixed at {description_value_02} sec.
    Stage 4: Fixed at {description_value_03} sec.
    Stage 5 or above: Fixed at {description_value_04} sec.
    Damage: {description_value_05}% of <word_group=10025>final</word_group> ATK
    Full Charge Damage: 300%
    Max Ammunition Capacity: {description_value_06}
    Additional Effect: Gains Pierce.</color>
    ■ Affects all allies.
    <color=#00AEFF>Attack Damage ▲ {description_value_07}% for {description_value_08} sec.</color>
  ko: |-
    ■ 자신에게
    <color=#00AEFF>[사용 무기 변경 : 메티스 버스트 버스터] :
    [차지 시간]
    [과전류 단계별 효과] [단계별 효과만 적용]
    차지 시간 : {description_value_09}초
    1단계이하 : {description_value_09}초 고정
    2단계 : {description_value_01}초 고정
    3단계 : {description_value_02}초 고정
    4단계 : {description_value_03}초 고정
    5단계이상 : {description_value_04}초 고정
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_05}% 대미지
    풀 차지 대미지 : 300%
    최대 장탄 수 : {description_value_06}발
    추가 효과 : [관통 특화]</color>
    ■ 아군 전체에게
    <color=#00AEFF>[공격 대미지 {description_value_07}%▲] [{description_value_08}초 유지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「使用武器変更：メティスバスターバスター」：
    「チャージ時間」
    「過電流の段階別の効果」
    「各段階の効果のみ適用」
    チャージ時間：{description_value_09}秒
    1段階以下：{description_value_09}秒に固定
    2段階：{description_value_01}秒に固定
    3段階：{description_value_02}秒に固定
    4段階：{description_value_03}秒に固定
    5段階以上：{description_value_04}秒に固定
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_05}％のダメージ
    フルチャージダメージ：300％
    最大装弾数：{description_value_06}発
    追加効果：「貫通特化」</color>
    ■味方全体に
    <color=#00AEFF>「攻撃ダメージ{description_value_07}％▲」「{description_value_08}秒間維持」</color>
