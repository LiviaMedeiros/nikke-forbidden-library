---
105_name:
  en: 'Maxwell: Ordinary Mechanic'
  ko: '맥스웰 : 오디너리 미케닉'
  ja: マクスウェル：オーディナリーメカニック
c105_description:
  en: Missilis's best researcher is back and better than ever. With her enhanced firepower
    and even sharper intelligence, she can calculate all variables on the battlefield.
  ko: |-
    미실리스 최고의 연구원이 한 단계 진화해 돌아왔다.
    더욱 날카로워진 지성과 강화된 화력으로, 전장의 모든 변수를 계산해 낸다.
  ja: |-
    ミシリス最高の研究者がより進化して帰ってきた。
    研ぎ澄まされた知性と強化された火力で、
    戦場のあらゆる変数を計算し尽くす。
105_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_105:
  en: 'Maxwell: Ordinary Mechanic''s Spare Body'
  ko: '맥스웰 : 오디너리 미케닉 스페어 바디'
  ja: マクスウェル：オーディナリーメカニックのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sr_up:
  en: Sniper Rifle
  ko: 저격소총
  ja: スナイパーライフル
character_shot_description_localkey_sr_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
21052_name:
  en: Output Switching Sequence
  ko: 출력 전환 시퀀스
  ja: 出力切替シーケンス
21052_description:
  en: |-
    ■ Activates when using Burst Skill. Affects all allies.
    <color=#00AEFF>ATK ▲ {description_value_01}% of the skill user's <word_group=10025>final</word_group> max HP for {description_value_02} sec.</color>
    ■ Activates when using Burst Skill. Affects self.
    <color=#00AEFF>Overcurrent: ATK ▲ {description_value_05}% continuously. Up to {description_value_06} stages in total.</color>
    ■ Activates when performing a Full Charge attack. Affects all allies.
    <color=#00AEFF><word_group=10015>Fills Burst Gauge</word_group> by {description_value_07}%.</color>
  ko: |-
    ■ 버스트 스킬 사용 시 아군 전체에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력의 {description_value_01}% 만큼 공격력 ▲] [{description_value_02}초 유지]</color>
    ■ 버스트 스킬 사용 시 자신에게
    <color=#00AEFF>[과전류 : 공격력 {description_value_05}% ▲] [최대 {description_value_06}단계] [지속]</color>
    ■ 풀 차지 공격 시 아군 전체에게
    <color=#00AEFF>[<word_group=10015>버스트 게이지 충전</word_group> {description_value_07}%] </color>
  ja: |-
    ■バーストスキルを使用した時、味方全体に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_01}％分の攻撃力▲」
    「{description_value_02}秒間維持」</color>
    ■バーストスキルを使用した時、自分に
    <color=#00AEFF>「過電流：攻撃力{description_value_05}％▲」「最大{description_value_06}段階」
    「持続」</color>
    ■フルチャージして攻撃した時、味方全体に
    <color=#00AEFF>「<word_group=10015>バーストゲージのチャージ</word_group>{description_value_07}％」</color>
