c094_Lobby_Touch_1:
  en: Is something wrong, Commander? I can listen, i-if you'd like!
  ko: 지휘관님. 무슨 일이야? 내, 내가 들어줄게!
  ja: |-
    指揮官様、どうしたの？
    わ、私が話を聞いてあげるね！
c094_Lobby_Touch_2:
  en: |-
    Um, Commander... I-I get flustered when you look at me like that.
    Could you look that way, instead?
  ko: |-
    저, 저기… 지휘관님. 그, 그렇게 쳐다보면 부끄러운데….
    저쪽 보고 있으면, 안 돼?
  ja: |-
    し、指揮官様。
    そ、そんなにじろじろ見られると恥ずかしいんだけど…
    少しだけ、あっちを見てもらっていい？
c094_Lobby_Touch_3:
  en: Commander, you think I'm strong... right?
  ko: 있잖아. 지휘관님은 내가 강하다고 생각하는 거, 맞지?
  ja: |-
    ねぇ、指揮官様。
    指揮官様は私のこと、強いって思ってくれてるんだよね？
c094_Lobby_Touch_Love_1:
  en: |-
    You can tell me anything. After all, you and I... are friends, aren't we?
    Hehe. I said it. F-friends...
  ko: "뭐든 말해 줘. 지휘관님하고 난 친구잖아. \n헤헤…. 친구래, 친구…."
  ja: |-
    な、何でも言ってね。だって指揮官様と私は、友だちなんだから。
    えへ、えへへ…友だちだって…
c094_Lobby_Touch_Love_2:
  en: |-
    Commander, my face feels really warm...
    Do you know why that is...?
  ko: |-
    지휘관님. 나, 얼굴이 너무 뜨거워….
    왜 그런 건지 지휘관님은 알아…?
  ja: |-
    ねぇ、指揮官様。なんだか、すごく顔が熱いの…
    どうしてなのか、分かる…？
c094_Lobby_Touch_Love_3:
  en: |-
    What's inside my shawl?
    Here, I'll show you... b-but only you, Commander.
  ko: "숄 안쪽에 있는 것들 말이야? \n지, 지휘관님한테만 특별히 보여줄게."
  ja: |-
    ケープの中にあるもの？
    し、指揮官様にだけ、特別に見せてあげるね。
c094_Lobby_Stay_1:
  en: "... Y-you're not gonna leave me alone like this forever, are you?"
  ko: 지휘관님…. 나 계속 이대로 혼자 두는 건 아니… 지?
  ja: |-
    指揮官様…
    ずっとこのまま私を一人にしておくつもりじゃ…ないよね？
c094_Lobby_Stay_Love_1:
  en: Kitty, when do you think the Commander will be back? I bet it won't be too long...
    But I really can't wait... Hehe.
  ko: "키티. 지휘관님은 언제 오실까? 조금만 기다리면 오시겠지? \n기대된다. 헤헤."
  ja: |-
    ねぇ、ミニー。指揮官様はいつ来るかなぁ？
    もう少し待てば来るよね？楽しみだなぁ…えへへ。
c094_Outpost_Touch_1:
  en: Let's leave the Armory to Eu-Eunhwa and... hang out! Just the two of u-us...
    as friends!
  ko: |-
    무기고는 으, 은화한테 맡겨두고,
    우, 우리… 친구끼리 놀러 안 갈래?
  ja: |-
    ぶ、武器庫のことは ウンファに任せて、
    と、友だち同士、 遊びに行くのはどうかな…？
c094_Outpost_Touch_2:
  en: Emma said rest is important, so... why don't y-you and I rest together?
  ko: "엠마가 휴식은 중요하댔어. 그러니까 지휘관님. \n나, 나랑 같이 쉬자."
  ja: |-
    エマがね、 休憩も大事よって言ってたんだ。
    だ、だからその… 一緒に、休憩しよ？
c094_Outpost_Touch_3:
  en: |-
    Where would you like to go, Commander?
    I-I'm fine with anywhere, as long as it's with you.
  ko: "지휘관님은 어디로 가고 싶어? \n나, 난 지휘관님이 가는 곳이라면 어디든 좋아."
  ja: |-
    指揮官様はどこに行きたい？
    わ、私は、指揮官様と一緒なら どこでもいいよ。
c094_Gacha_Get_1:
  en: If anyone tries to hurt you or our squad, I'll wipe them out with my missiles!
    So, please continue looking out for us...
  ko: |-
    지휘관님하고 우릴 괴롭히는 녀석들은 내 미사일로 전부 쓸어버릴게.
    그러니까, 이번에도 잘 부탁해….
  ja: |-
    指揮官様と私たちをいじめる奴らは、
    私のミサイルで全部吹っ飛ばしちゃうね。
    だからこれからも、よろしくね…
c094_Reinforce_1:
  en: I'll keep getting stronger...!
  ko: 계속해서 더 강해질 거야!
  ja: これからももっと強くなるよ！
c094_Reinforce_2:
  en: With this, I can kill even more.
  ko: 이걸로 더 많이 죽일 수 있겠다.
  ja: これでもっとたくさん倒せるね。
c094_Reinforce_3:
  en: Those bullies can't do anything to me anymore!
  ko: 날 괴롭히던 녀석들도 이젠 아무것도 못 하겠지?
  ja: 私をいじめてた奴らも、これでもう何もしてこないよね？
c094_Gift_1:
  en: I-is this for me? R-really?
  ko: 내, 내가 이거 받아도 돼…? 저, 정말로?
  ja: わ、私なんかがもらっていいの…？ほ、本当に？
c094_Gift_2:
  en: |-
    Th-thank you, Commander.
    Hehe... I love it.
  ko: "고, 고마워. 지휘관님. \n헤, 헤헤. 좋다."
  ja: |-
    あ、ありがとう、指揮官様。
    へへ、えへへ…嬉しいな。
c094_Gift_3:
  en: I had something for you too... I'll be sure to br-bring it next time.
  ko: 나도 줄 게 있었는데… 나, 나중에 꼭 들고 올게.
  ja: |-
    あ、あのね、私もプレゼントがあるんだ…
    ま、また今度持ってくるね。
c094_Attractive_Up_1:
  en: I'll try even harder to make you proud of me, Commander... because we're b-besties!
  ko: 지휘관님을 위해서 더 열심히 할게. 우린 아주 친한 치, 친구니까.
  ja: |-
    指揮官様のために、もっと頑張るね。
    だって私たちは、すごく仲のいい…と、友だちだから。
c094_Attractive_Up_2:
  en: I... I don't think "friends" is enough anymore. Wh-what comes after friends...?
  ko: "친구… 그런 말로는 부족한 거 같아. \n치, 친구 다음은 뭐, 뭐라고 부르면 되지?"
  ja: |-
    友だち…って言葉じゃ、なんだか物足りないかも。
    と、友だちの次は、何て呼べばいいのかな？
c094_Attractive_Up_3:
  en: I-I want to stay with you f-forever, Commander. Always.
  ko: 나, 나 있잖아. 지휘관님이랑 계속 가, 같이 있고 싶어.
  ja: あ、あのね…指揮官様と、ず、ずっと一緒にいたいな。
c094_Party_Deploy_1:
  en: O-okay! I'll do my best!
  ko: 응! 열심히 할게!
  ja: うん！一生懸命がんばるね！
c094_Field_Touch_1:
  en: Um... Wh-what should I do...?
  ko: 어… 어떻게 할까?
  ja: ど…どうすればいいかな？
c094_Field_Go_1:
  en: Is this the r-right path?
  ko: 이 길로 가는 거 마, 맞지?
  ja: こ、このルートで合ってる？
c094_Battle_Enter_1:
  en: I'm ready to fight.
  ko: 싸울 준비 됐어.
  ja: 戦闘の準備、できたよ。
c094_Battle_Ready_1:
  en: Engaging the enemy now! Let's kill them all!
  ko: 전투 개시. 다 죽여버리자.
  ja: 戦闘開始。全部倒してくるね。
c094_Battle_Ready_2:
  en: Target sighted. Do I just crush them?
  ko: 적을 발견했어. 부숴버리면 되지?
  ja: 目標発見。倒しちゃっていいよね？
c094_Battle_Ready_3:
  en: I-I'll be right back!
  ko: 금, 금방 끝내고 올게.
  ja: す、すぐに終わらせてくるね。
c094_Reload_1:
  en: H-hold on! Reloading is taking longer than I thought...
  ko: 자, 잠깐만. 무기 장전에 시간이 걸려서….
  ja: ま、待って！まだ装填が…
c094_Reload_2:
  en: G-get any closer, and you're all dead!
  ko: 가, 가까이 오면… 죽여버린다!
  ja: ち、近寄ったら…殺しちゃうよ！
c094_Reload_3:
  en: C-can you cover me, please?
  ko: 엄호 좀… 부탁해도, 될까?
  ja: え、援護を…お願いしてもいい？
c094_Ult_Skill_Ready_1:
  en: Target locked.
  ko: 조준 완료했어.
  ja: 照準完了。
c094_Ult_Skill_1:
  en: Missile container online. Full barrage, fire!
  ko: 미사일 컨테이너 온라인. 전탄 발사!
  ja: ミサイルコンテナ、オンライン。全弾発射！
c094_FullBurst_1:
  en: G-good! Blow them all to pieces!
  ko: 조, 좋아! 전부 다 쓸어버리는 거야!
  ja: う、うん！全部片づけちゃうね！
c094_Kill_Monster_1:
  en: D-did you see that, Commander?
  ko: 지, 지휘관님. 보고 있어?
  ja: し、指揮官様。ちゃんと見てた？
c094_Kill_Monster_2:
  en: I-I did it!
  ko: 해, 해냈어!
  ja: や、やったよ！
c094_Kill_Monster_3:
  en: Hehe... They're all dead?
  ko: 헤헤. 죽었네?
  ja: えへへ、死んじゃったね。
c094_Damage_1:
  en: Ah!
  ko: 꺅!
  ja: きゃっ！
c094_Damage_2:
  en: Ugh!
  ko: 하윽!
  ja: はうっ！
c094_Damage_3:
  en: Ah!
  ko: 앗.
  ja: あっ！
c094_Die_1:
  en: I-I'm sorry, C-Commander... I... I couldn't win...
  ko: |-
    지휘… 관님… 미안….
    못… 이겼어….
  ja: |-
    指揮官…様…
    ごめん…勝て…なかった…
c094_Win_1:
  en: As long as I'm with you, Commander... I-I think I can do even better!
  ko: 지휘관님과 함께라면, 나… 더 잘할 수 있을 거 같아!
  ja: し、指揮官様と一緒なら…もっと上手に戦える気がする…！
c094_01_Lobby_Touch_1:
  en: I-I never imagined I'd get to wear a school uniform. It feels different. It's
    making me excited... Hehe.
  ko: |-
    교, 교복을 입어볼 수 있게 되다니.
    색다른 기분이라 뭔가 좀 설레는걸… 헤헤.
  ja: |-
    せ、制服が着られるなんてなんだか新鮮な気持ち。
    ワクワクしちゃう…えへへ。
c094_01_Lobby_Touch_2:
  en: Hehe. I said I was going to school, so Emma helped me pick out this uniform.
  ko: 헤헤. 학교에 간다고 해서 엠마가 같이 골라준 교복이야.
  ja: |-
    えへへ。この制服、学校へ行くことになった私のために
    エマが一緒に選んでくれたの。
c094_01_Lobby_Touch_3:
  en: C-Commander, look at this ribbon on my chest... I really like it.
  ko: |-
    지, 지휘관님. 이거 좀 봐줄 수… 있어?
    가슴에 이거…. 엄청 마음에 드는 리본이야.
  ja: |-
    し、指揮官様。これ…見てくれる？
    胸元のこのリボン…すごくお気に入りなの。
c094_01_Lobby_Touch_Love_1:
  en: C-Commander, how do you like this uniform? Do you think it suits me...?
  ko: |-
    지, 지휘관님. 이 교복 어때?
    나한테 잘 어울려…?
  ja: |-
    ねぇ、指揮官様。この制服、どう？
    似合ってるかな…？
c094_01_Lobby_Touch_Love_2:
  en: You want to know what's in my bag? Well, I wasn't sure what to bring, so...
    I brought everything.
  ko: |-
    가방 안에 있는 거?
    뭐, 뭘 준비해야 할지 몰라서 전부 준비해 봤어.
  ja: |-
    カバンの中身？
    な、何を準備すればいいか分からなくて
    なんでも入れてきちゃった。
c094_01_Lobby_Touch_Love_3:
  en: If I'd really gone to school with you, we would've been friends, right? I would've
    been the new kid, and you could've shown me around... Hehe...
  ko: |-
    만약 진짜 학교에 다녔다면 지휘관님과 친구가 될 수 있었겠지?
    아니, 신입생이니까 후배였으려나. 헤헤….
  ja: |-
    もし本当に学校に通ってたら、きっと指揮官様と
    友だちになれてたよね？
    あっ、新入生だから後輩かな。えへへ…
c094_01_Lobby_Stay_1:
  en: I-I'm all ready to go... I wonder what's taking the Commander so long...?
  ko: |-
    추, 출발할 준비는 다 끝났는데….
    지휘관님은 왜 이렇게 늦는 걸까….
  ja: |-
    しゅ、出発の準備はできてるのに…
    指揮官様、どうしてこんなに遅いんだろう…
c094_01_Lobby_Stay_Love_1:
  en: I got all ready while I was waiting... b-but maybe I should pack more stuff
    in my bag, just to be sure.
  ko: |-
    기다리는 동안 준비해야 할 건 다 했는데….
    아, 아니야… 혹시 모르니까 일단 더 챙겨두자.
  ja: |-
    待ってる間に準備は終わったけど…
    う、ううん…念のために、もうちょっと確認しておこっと。
c094_01_Outpost_Touch_1:
  en: I-it would be fun to walk around in school uniforms with Eunhwa and Emma.
  ko: 으, 은화랑 엠마도 같이 교복 입고 돌아다니면 재밌겠다.
  ja: |-
    ウ、ウンファとエマと一緒に
    制服を来て歩いたら楽しそうだな。
c094_01_Outpost_Touch_2:
  en: I-it feels like I'm skipping class to go hang out, hehe.
  ko: 뭐, 뭔가 수업 빠지고 놀러가는 기분이야.
  ja: な、なんだか授業をサボって 遊びにいく気分。
c094_01_Outpost_Touch_3:
  en: I-I think I could go to class at the Tactics Academy dressed like this... You'll
    go with me, won't you, Commander?
  ko: |-
    이, 이대로 택틱 아카데미에 가서 수업을 들어도 될 것 같은데….
    지휘관님도 같이 가줄 거지…?
  ja: |-
    こ、このままタクティクアカデミーに 授業を聞ききに行けちゃいそう…
    指揮官様も 一緒に行ってくれるよね…？
c094_01_Gacha_Get_1:
  en: I got myself a school uniform! What do you think? D-do I look okay?
  ko: "…교복을 한번 입어봤는데, 지휘관님이 보기엔 어때? 괘, 괜찮아?"
  ja: |-
    …制服を着てみたんだけど、指揮官様から見て、どう？
    に、似合ってる？
c094_01_Reinforce_1:
  en: Th-this'll make me look like less of a new student, right...?
  ko: 이, 이렇게 신입생 티를 벗어가는 거겠지?
  ja: こ、こうやって新入生っぽさが抜けていくのかな？
c094_01_Reinforce_2:
  en: When I'm with you, I feel like I grow so much stronger.
  ko: 지휘관님이랑 같이 있으면 훨씬 더 강해질 수 있을 거야.
  ja: 指揮官様と一緒にいると、もっともっと強くなれる気がするよ。
c094_01_Reinforce_3:
  en: Now I can wipe them all out... Wait, students don't say things like that, huh...?
  ko: |-
    이제 마음껏 쓸어버릴 수…
    아, 학생은 이런 말 안 하지…?
  ja: |-
    これで思いっきり倒せ…
    あっ、学生はこんなこと言わないよね…？
c094_01_Gift_1:
  en: A p-present? Hehe. Is this to celebrate me starting school?
  ko: 서, 선물? 헤헤. 혹시 입학 축하 선물 같은 거야?
  ja: |-
    プ、プレゼント？えへへ。
    もしかして入学祝い？
c094_01_Gift_2:
  en: I'm going to treasure this, since you're the one who gave it to me.
  ko: 지휘관님이 준 거니까 소중히 간직할게.
  ja: 指揮官様がくれたものだから、大切にするね。
c094_01_Gift_3:
  en: A present? From you...? For some reason, I-I'm so nervous...
  ko: |-
    지휘관님이 주는 선물이라 그런 걸까?
    괜히 기, 긴장된다….
  ja: |-
    指揮官様からのプレゼントだからかな？
    な、なんか緊張しちゃう…
c094_01_Attractive_Up_1:
  en: For you, Commander, I'll work even harder...!
  ko: |-
    지휘관님을 위해서…
    지금보다 더 열심히 할게…!
  ja: |-
    指揮官様のために…
    今よりもっと頑張るね…！
c094_01_Attractive_Up_2:
  en: I-if you don't mind, I'd like us to stay together for... Uhh, never mind.
  ko: |-
    그… 지휘관님이 괜찮다면, 이대로 쭉 같이 있어도…
    아, 아무것도 아니야.
  ja: |-
    その…指揮官様さえよければ、このままずっと一緒にいても…
    なっ、何でもない。
c094_01_Attractive_Up_3:
  en: Wanna hang out after class? ... I-I'm sorry, Commander. I just wanted to pretend
    like we're at school. Hehe...
  ko: |-
    서, 선배…!
    미, 미안 지휘관님. 그냥 한번 이렇게 불러보고 싶었어, 헤헤….
  ja: |-
    せ、先輩…！
    ご、ごめんね、指揮官様。
    一度こうやって呼んでみたかったの、えへへ…
c094_01_Party_Deploy_1:
  en: I-I'm all ready.
  ko: 주, 준비는 다 끝났어.
  ja: じゅ、準備できたよ。
c094_01_Field_Touch_1:
  en: Commander...? Wh-what is it?
  ko: 지휘관님…? 무, 무슨 일이야?
  ja: 指揮官様…？ど、どうしたの？
c094_01_Field_Go_1:
  en: R-right... I'm going.
  ko: 으, 응… 지금 그쪽으로 가고 있어.
  ja: う、うん…今そっちに行くね。
c094_01_Battle_Enter_1:
  en: I see the enemy... Am I cleared to fire...?
  ko: 적이 보이는데… 쏠까…?
  ja: 敵がいるけど…撃ってもいい…？
c094_01_Battle_Ready_1:
  en: Leave it to me, C-Commander...
  ko: 지, 지휘관님… 나한테 맡겨줘.
  ja: し、指揮官様…私に任せて。
c094_01_Battle_Ready_2:
  en: Let's end this before my uniform gets dirty...
  ko: 교복이 더러워지기 전에 끝낼게….
  ja: 制服が汚れちゃう前に終わらせるね…
c094_01_Battle_Ready_3:
  en: D-don't underestimate... new students...!
  ko: 시, 신입생이라고 무시하면… 안 돼…!
  ja: し、新入生だからって甘く見ちゃ…ダメだよ…！
c094_01_Reload_1:
  en: W-wait, I've got more ammo in my bag...
  ko: 부, 분명 탄환을 가방에 넣어뒀는데….
  ja: ちゃ、ちゃんと弾丸をカバンに入れたはずなのに…
c094_01_Reload_2:
  en: I-I'll reload real fast.
  ko: 그, 금방 교체할게….
  ja: す、すぐにリロードするね…
c094_01_Reload_3:
  en: I didn't tear my uniform, right...?
  ko: 교복에… 찢어진 곳은 없겠지…?
  ja: 制服…破れてないよね…？
c094_01_Ult_Skill_Ready_1:
  en: Now I can wipe them all out.
  ko: 이제 쓸어버릴 수 있어.
  ja: これでもう全部倒せるよ。
c094_01_Ult_Skill_1:
  en: Target acquired. Full barrage, fire!
  ko: 타깃 지정, 올 그린. 전탄 사출!
  ja: |-
    ターゲットロックオン、オールグリーン。
    全弾発射！
c094_01_FullBurst_1:
  en: Now...! Blow them all to pieces!
  ko: 지금…! 전부 쏟아부어!
  ja: 今だよ…！全部ぶち込め！
c094_01_Kill_Monster_1:
  en: Was that okay...?
  ko: 괜찮았어…?
  ja: 大丈夫だった…？
c094_01_Kill_Monster_2:
  en: I got one...
  ko: 일단 하나… 처치했어.
  ja: ひとまず1体…倒したよ。
c094_01_Kill_Monster_3:
  en: Hehe. I did it!
  ko: 헤헤. 내가 해냈어!
  ja: えへへ。私、やったよ！
c094_01_Damage_1:
  en: Ouch!
  ko: 아얏!
  ja: ああっ！
c094_01_Damage_2:
  en: Ugh...
  ko: 으윽….
  ja: ううっ…
c094_01_Damage_3:
  en: Ow...
  ko: 읏….
  ja: うっ…
c094_01_Die_1:
  en: Sorry, Commander... I may be dressed like a student, but that's no excuse for
    this...
  ko: |-
    미안해… 지휘관님….
    교복을 입었다고, 마음까지 학생이어선 안 됐는데….
  ja: |-
    ごめんね…指揮官様…
    制服を着てるからって、気持ちまで学生じゃダメなのに…
c094_01_Win_1:
  en: W-we did it, Commander. This means I'll make it to school tomorrow, right...?
    Hehe.
  ko: |-
    해, 해냈어, 지휘관님.
    내일도 문제없이 등교할 수 있겠지…? 헤헤.
  ja: |-
    や、やったよ、指揮官様。
    これで明日も登校できるよね…？えへへ。
94_cv_ja:
  en: 'CV: Rie Kugimiya'
  ko: 'CV : 쿠기미야 리에'
  ja: CV：釘宮理恵
94_cv_ko:
  en: 'CV: Yoo Bo-ra'
  ko: 'CV : 유보라'
  ja: CV：ユ・ボラ
94_cv_en:
  en: 'CV: Ratana'
  ko: 'CV : 라타나'
  ja: CV：Ratana
