142_name:
  en: Frima
  ko: 프림
  ja: プリム
141_name:
  en: Milk
  ko: 밀크
  ja: ミルク
143_name:
  en: 'Milk: Blooming Bunny'
  ko: '밀크 : 블루밍 바니'
  ja: ミルク：ブルーミングバニー
c140_Lobby_Touch_1:
  en: If you need anything, just give me a shout.
  ko: 의뢰할 것이 있으면 언제든 말해.
  ja: 頼みたいことがあったらいつでも言いな。
c140_Lobby_Touch_2:
  en: What a nice day for jogging.
  ko: 오늘은 좀 달리고 싶은 날이네.
  ja: 今日はちょっと走りたい気分なの。
c140_Lobby_Touch_3:
  en: Hey Partner, how about sharing a nice cup of joe with me? Plenty of sugar, of
    course!
  ko: 파트너, 커피 한잔할까? 슈가 커피로.
  ja: |-
    パートナー、コーヒー一杯どう？
    シュガーコーヒーで。
c140_Lobby_Touch_Love_1:
  en: A kiss with a coffee aftertaste... I can see myself getting addicted to that.
    How about you?
  ko: |-
    커피향이 나는 키스, 중독될 것 같아.
    파트너는 어떻게 생각해?
  ja: |-
    コーヒーの香りがするキスって病みつきになりそう。
    パートナーはどう思う？
c140_Lobby_Touch_Love_2:
  en: This place is dullsville. How about we go for a ride on my motorcycle?
  ko: 답답한데 같이 바이크나 타고 오지 않을래?
  ja: |-
    何だかスカッとしたいわ。
    バイク乗って来てくれない？
c140_Lobby_Touch_Love_3:
  en: I don't mind what the mission is as long as it's with you, Partner.
  ko: 파트너와 함께라면 어떤 의뢰도 좋아.
  ja: パートナーが一緒ならどんな依頼でも引き受けるわ。
c140_Lobby_Stay_1:
  en: "*Sigh...* How long are you gonna keep me waiting?"
  ko: 음… 언제까지 기다려야 하지?
  ja: う～ん…いつまで待てばいいの？
c140_Lobby_Stay_Love_1:
  en: I'll get myself a cup of coffee. Take your time.
  ko: 나는 커피 한 잔 마시고 있을 테니까 천천히 해.
  ja: |-
    私ならコーヒー飲んでるから、
    ゆっくりでいいのよ。
c140_Outpost_Touch_1:
  en: I really dig this place. It's perfect for jogging.
  ko: 이곳은 맘에 들어. 맘껏 달릴 수 있거든.
  ja: ここは好きよ。 思い切り走れるから。
c140_Outpost_Touch_2:
  en: Have you been to the cafe? The coffee there is spectacular. They don't skimp
    on the sugar!
  ko: 카페는 가봤어? 거기 슈가 커피가 맛있어.
  ja: |-
    カフェは行ってみた？
    あそこの シュガーコーヒーは 格別よ。
c140_Outpost_Touch_3:
  en: This cafe would be perfect if it weren't for those two weirdoes.
  ko: 카페는 좋아. 이상한 녀석 둘이 있다는 것만 빼면.
  ja: カフェっていいわ。 おかしな野郎どもがいなければね。
c140_Gacha_Get_1:
  en: What have you got for me this time, Partner?
  ko: 파트너, 이번 의뢰는 뭐지?
  ja: パートナー、今度の依頼は何？
c140_Reinforce_1:
  en: I can jog for a bit longer.
  ko: 좀 더 달릴 수 있겠는데.
  ja: まだまだ走れるのに。
c140_Reinforce_2:
  en: Don't worry. The power belongs to you, Partner.
  ko: 걱정 마. 이 힘은 온전히 파트너의 것이니까.
  ja: 心配ないわ。この力は全部パートナーのものだから。
c140_Reinforce_3:
  en: Since we are upgrading, I would appreciate it if you can upgrade more.
  ko: 이왕 하는 거 좀 더 챙겨주면 고맙겠어.
  ja: 折角だしもっとたくさんくれてもいいのよ。
c140_Gift_1:
  en: Thank you, I'm sure this will come in handy.
  ko: 고마워 파트너. 잘 쓰겠어.
  ja: ありがとう、パートナー。大切に使うわ。
c140_Gift_2:
  en: This is expensive! I'll pay you back with my equally expensive kiss.
  ko: 귀한 물건이군. 내 귀한 키스로 보답할게.
  ja: 貴重な品物ね。私の特別キスでお礼するわ。
c140_Gift_3:
  en: Your next request is on the house!
  ko: 다음 의뢰는 무상으로 해주겠어.
  ja: 次の依頼はただでやってあげる。
c140_Attractive_Up_1:
  en: We've become closer... Sounds weird when I put it like that.
  ko: 관계가 깊어지고 있군. 조금 야한데.
  ja: 関係が深まってきてるわね。ちょっといやらしいけど。
c140_Attractive_Up_2:
  en: You're full-bodied and sweet, just like a cup of sugar coffee.
  ko: 파트너는 진하고 달달하군. 슈가 커피 같은 맛이야.
  ja: |-
    パートナーは濃厚で甘いのね。
    シュガーコーヒーみたい。
c140_Attractive_Up_3:
  en: I think I'm addicted to you, Partner. I want another taste.
  ko: 파트너한테 중독된 것 같아. 계속 맛보고 싶어.
  ja: |-
    パートナーにハマっちゃったみたい。
    ずっと味わっていたいの。
c140_Party_Deploy_1:
  en: Let's go.
  ko: 달려볼까.
  ja: 走ってみようかしら。
c140_Field_Touch_1:
  en: What's next?
  ko: 뭘 할까?
  ja: 何しようかしら？
c140_Field_Go_1:
  en: Let's go, Black Typhoon. Whoosh!
  ko: 가자, 블랙 타이푼. 부아아앙-
  ja: 行きましょう、ブラックタイフーン。ブアアアーン。
c140_Battle_Enter_1:
  en: Let's get down to business.
  ko: 시작이군.
  ja: 始まったか。
c140_Battle_Ready_1:
  en: 'Request difficulty: Medium.'
  ko: 의뢰 난이도는 적당하군.
  ja: 依頼の難易度はまずまずってところね。
c140_Battle_Ready_2:
  en: Let's go.
  ko: 어디 한 번 달려볼까.
  ja: ちょっと走ってみようかしら。
c140_Battle_Ready_3:
  en: How quickly should I wrap this all up?
  ko: 그럼, 몇 초 만에 끝내볼까?
  ja: さて、数秒で終わらせちゃうよ。
c140_Reload_1:
  en: Reloading, cover me!
  ko: 리로드. 목숨 걸고 날 지켜.
  ja: リロード。命懸けで私を守る。
c140_Reload_2:
  en: Current ammo is sufficient.
  ko: 탄환은 아직 충분해.
  ja: 弾丸はまだ十分。
c140_Reload_3:
  en: No attacking while I'm reloading!
  ko: 장전 중엔 공격 금지야.
  ja: 装填中の攻撃は禁止よ。
c140_Ult_Skill_Ready_1:
  en: Partner!
  ko: 파트너.
  ja: パートナー。
c140_Ult_Skill_1:
  en: Playtime's over. Take this!
  ko: 슬슬 끝내볼까. 자, 다 받아 가.
  ja: |-
    そろそろ終わらせようかしら。
    ほら、全部受け取って。
c140_FullBurst_1:
  en: Let's show them how we roll.
  ko: 모두 쏟아부어주자고.
  ja: 全部注ぎ込むわよ。
c140_Kill_Monster_1:
  en: Good shot.
  ko: 굿 샷.
  ja: グッドショット。
c140_Kill_Monster_2:
  en: One point for me.
  ko: 내가 잡았어.
  ja: 私が捕まえたわ。
c140_Kill_Monster_3:
  en: Clear.
  ko: 클리어.
  ja: クリア。
c140_Damage_1:
  en: Ow!
  ko: 윽!
  ja: うっ！
c140_Damage_2:
  en: "*Grunt*"
  ko: 크읏!
  ja: くうっ！
c140_Damage_3:
  en: "*Gasp*"
  ko: 허억!
  ja: うっ！
c140_Die_1:
  en: I've got low blood sugar... What else can I do?
  ko: 당이 떨어졌어. 이건 어쩔 수 없는 거야.
  ja: そろそろ甘いもの補充しなくちゃね。これは仕方がないのよ。
c140_Win_1:
  en: Request cleared.
  ko: 의뢰 완료.
  ja: 依頼完了。
c140_03_Lobby_Touch_1:
  en: Fighting in a bunny girl outfit... This is a rather unusual assignment.
  ko: 바니걸 복장으로 싸우라니… 이번 의뢰는 꽤 특이한걸.
  ja: |-
    バニーガールの格好で戦え…？
    今回の依頼は、ずいぶん変わってるわね。
c140_03_Lobby_Touch_2:
  en: Riding in this outfit honestly ain't that bad.
  ko: 이런 옷을 입고 달리는 것도 은근 괜찮더라고.
  ja: こういう服装で走るのも、案外悪くないわね。
c140_03_Lobby_Touch_3:
  en: Ever wonder what coffee made by a bunny girl would taste like? For starters,
    it'd be loaded with sugar.
  ko: 바니걸이 타주는 커피는 어떤 맛일지 궁금하지 않아? 일단 설탕은 많이 들어갈거야.
  ja: |-
    バニーガールが淹れるコーヒーの味、気にならない？
    もちろん、砂糖はたっぷりで。
c140_03_Lobby_Touch_Love_1:
  en: I bet a kiss in this outfit would taste different from usual. Whaddya think,
    Partner? Wanna find out?
  ko: 이 옷을 입고 하는 키스는 평소랑 다른 맛이 나겠네. 파트너는 어떻게 생각해? 지금 맛볼래?
  ja: |-
    この格好でするキスは、いつもと違う味がしそうね。
    パートナーはどう思う？…味見、してみる？
c140_03_Lobby_Touch_Love_2:
  en: I'll take on an assignment from you any day, Partner. And today, I'll give you
    everything I've got.
  ko: 파트너의 의뢰라면 언제든 환영이야. 특히 오늘은 찐하게 상대해 줄 수 있겠어.
  ja: |-
    パートナーからの依頼ならいつでも歓迎よ。
    今日は特別に、たっぷり相手をしてあげる。
c140_03_Lobby_Touch_Love_3:
  en: You've never ridden a bike with a bunny girl before, have you, Partner? What
    do you say, wanna give it a try today?
  ko: 파트너, 바니걸이랑 바이크 타본 적 없지? 어때, 오늘 해볼래?
  ja: |-
    パートナーって、バニーガールとバイクに
    乗ったことはないでしょ？どう？今日、乗ってみない？
c140_03_Lobby_Stay_1:
  en: Do I just keep waiting here like this?
  ko: 여기서 그냥 이렇게 기다리면 돼?
  ja: ここで待っていればいいのね？
c140_03_Lobby_Stay_Love_1:
  en: I'll be here sippin' on my coffee, so feel free to do whatever you need to do.
  ko: 커피 한 잔 하고 있으면 되니까 편하게 할 일 해.
  ja: |-
    コーヒーでも飲みながらゆっくりしてるから、
    気にせずやることをやってきて。
c140_03_Outpost_Touch_1:
  en: Don't worry. I won't stir up any trouble here.
  ko: 여기서는 사고 안칠테니 걱정하지마.
  ja: ここではトラブルを 起こさないから、心配しないで。
c140_03_Outpost_Touch_2:
  en: If it's an assignment from you, Partner, I'm always in.
  ko: 파트너가 맡기는 의뢰는 언제든 환영이야.
  ja: あら、依頼？ パートナーなら いつでも歓迎するわ。
c140_03_Outpost_Touch_3:
  en: If I ride around in this outfit, everyone's gonna stare... That sounds pretty
    exhilarating.
  ko: 이 옷을 입고 달리면 모두가 쳐다보겠지… 제법 짜릿하겠는데?
  ja: |-
    この格好で走ったら、 きっと注目されるわよね…
    …結構、快感かも？
c140_03_Gacha_Get_1:
  en: Guess there are assignments that require me to become a bunny girl. Well, no
    big deal.
  ko: 토끼가 돼야하는 의뢰도 있네. 뭐, 문제없어.
  ja: |-
    ウサギにならなきゃいけない依頼もあるのね。
    まっ、いいけど。
c140_03_Reinforce_1:
  en: The next assignment will be a cinch.
  ko: 다음 의뢰는 쉽게 끝낼 수 있겠어.
  ja: 今度の依頼は、すぐに終わりそうね。
c140_03_Reinforce_2:
  en: Think you can keep up with me, Partner?
  ko: 감당할 수 있겠어, 파트너?
  ja: パートナーは、最後まで耐えられるかしら？
c140_03_Reinforce_3:
  en: Sweet. Now I can shake things up even more than before.
  ko: 좋아, 전보다 더 대담하게 판을 엎을 수 있겠어.
  ja: もっと大胆に暴れ回れそうね。
c140_03_Gift_1:
  en: A perfect gift for a bunny girl. Thank you.
  ko: 바니걸에게 딱 어울리는 선물이네. 고마워.
  ja: |-
    バニーガールにぴったりのプレゼントね。
    ありがとう。
c140_03_Gift_2:
  en: I got you something in return. Here, it's a carrot.
  ko: 나도 선물에 대한 보답을 준비했어. 자, 당근이야.
  ja: プレゼントのお礼を用意したわ。はい、ニンジンよ。
c140_03_Gift_3:
  en: This'll come in handy whenever I need to stir up some trouble.
  ko: 사고 칠 때, 파트너가 준 선물을 쓰면 딱 좋겠는걸.
  ja: |-
    何かトラブルを起こしちゃった時は、
    パートナーからもらったプレゼントを使えばよさそうね。
c140_03_Attractive_Up_1:
  en: Wanna celebrate this with a proper kiss?
  ko: 기념으로 진하게 키스 한 번 할까?
  ja: 記念に、熱いキスでもする？
c140_03_Attractive_Up_2:
  en: This is bad. Whenever you're by my side, I find myself wanting to stir up even
    bigger trouble.
  ko: 큰일 났네. 파트너가 옆에 있으니 자꾸만 더 큰 사고도 치고 싶어져.
  ja: |-
    困ったわ。パートナーが隣にいると、
    もっと派手なトラブルを起こしたくなるわね。
c140_03_Attractive_Up_3:
  en: Who knew we could grow even closer? Maybe our bond is deeper than I thought.
  ko: 여기서 더 가까워질 수가 있었네. 우리 사이, 꽤 깊을수도 있겠어.
  ja: |-
    …まさか、こんなに距離が縮まるなんてね。
    私たちの関係も、ずいぶんと深くなったと思わない？
c140_03_Party_Deploy_1:
  en: I'll show you what bunny girls can do.
  ko: 바니걸의 실력을 보여주지.
  ja: バニーガールの実力を見せてあげる。
c140_03_Field_Touch_1:
  en: Is it another assignment?
  ko: 의뢰인가?
  ja: 依頼かしら？
c140_03_Field_Go_1:
  en: Where are we going this time?
  ko: 이번엔 어디로 가면 되지?
  ja: 今度はどこに行くの？
c140_03_Battle_Enter_1:
  en: So I just have to go all out, right?
  ko: 실컷 달리면 되는거지?
  ja: 思いっきり走ればいいのね？
c140_03_Battle_Ready_1:
  en: This assignment should be a breeze.
  ko: 이번 의뢰도 어렵지 않겠어.
  ja: 今回の依頼も簡単そうね。
c140_03_Battle_Ready_2:
  en: So this is my mission as a bunny girl? Fine by me.
  ko: 바니걸로서의 임무인가… 뭐, 상관없어.
  ja: |-
    この格好でする任務なのかしら…
    まぁ、いいわ。
c140_03_Battle_Ready_3:
  en: Let's do this, Partner.
  ko: 가자, 파트너.
  ja: 行くわよ、パートナー。
c140_03_Reload_1:
  en: I'll put an end to this soon.
  ko: 곧 끝내줄게.
  ja: すぐに終わらせてあげる。
c140_03_Reload_2:
  en: Enjoying the view from back there?
  ko: 내 뒷모습, 꽤 볼만하겠는데.
  ja: 後ろ姿、見ごたえあるでしょ？
c140_03_Reload_3:
  en: With you around, Partner, I can let my guard down a little.
  ko: 파트너가 있으니, 이 정도 틈은 괜찮겠지.
  ja: パートナーがいるし、多少の隙は問題ないか。
c140_03_Ult_Skill_Ready_1:
  en: This bunny's locked and loaded.
  ko: 토끼는 준비됐어.
  ja: ウサギは準備万端よ。
c140_03_Ult_Skill_1:
  en: Time to go full throttle!
  ko: 거칠게 몰아쳐볼까?
  ja: ガンガン攻めちゃおうかしら？
c140_03_FullBurst_1:
  en: Let's get this over with!
  ko: 빠르게 끝내자고!
  ja: さっさと終わらせるわよ！
c140_03_Kill_Monster_1:
  en: So it's true, bunnies bring good luck...
  ko: 토끼가 행운을 준다더니…
  ja: ウサギは幸運を運ぶらしいわね？
c140_03_Kill_Monster_2:
  en: That was easy.
  ko: 쉽네.
  ja: 楽勝ね。
c140_03_Kill_Monster_3:
  en: Pretty wild for a bunny girl, huh?
  ko: 바니걸치곤 꽤 거칠었지?
  ja: 見た目に反して、結構激しかったでしょ？
c140_03_Damage_1:
  en: Ugh!
  ko: 으윽!
  ja: ううっ！
c140_03_Damage_2:
  en: Oof!
  ko: 컥!
  ja: ぐっ！
c140_03_Damage_3:
  en: Argh...!
  ko: 아악…!
  ja: ああっ…！
c140_03_Die_1:
  en: Maybe the outfit was too restrictive...
  ko: "…옷이 좀 불편했나…"
  ja: "…動きづらい格好のせいかしら…"
c140_03_Win_1:
  en: Did you enjoy working this assignment with a bunny girl, Partner?
  ko: 파트너, 바니걸과 함께하는 의뢰는 어땠어?
  ja: |-
    ねえ、パートナー。バニーガールと一緒に
    こなす依頼はどうだった？
