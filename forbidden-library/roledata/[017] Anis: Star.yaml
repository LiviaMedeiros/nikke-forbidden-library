17_name:
  en: 'Anis: Star'
  ko: '아니스 : 스타'
  ja: アニス：スター
c017_description:
  en: Equipped with the expansive armament Star made from Pretty's body and core,
    Anis has risen above the pains of her past and now strives to become the true
    star of the Ark.
  ko: |-
    프리티의 바디와 코어로 만든 확장 무장 STAR를 장착한 아니스.
    과거의 아픔을 딛고,
    그녀는 이제 진정한 의미로 방주의 별이 되려 한다.
  ja: |-
    プリティーのボディとコアで作られた
    拡張武装STARを装備したアニス。
    過去の痛みを乗り越え、彼女は今、
    本当の意味でアークの星になろうとしている。
17_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_17:
  en: 'Anis: Star''s Spare Body'
  ko: '아니스 : 스타 스페어 바디'
  ja: アニス：スターのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_rl_up:
  en: Rocket Launcher
  ko: 런처
  ja: ロケットランチャー
character_shot_description_localkey_rl_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
20172_name:
  en: Stardust
  ko: 스타더스트
  ja: スターダスト
20172_description:
  en: |-
    ■ Activates when entering Full Burst while in My Own Star status. Affects all allies.
    <color=#00AEFF>ATK ▲ {description_value_01}% of caster's ATK for {description_value_02} sec.</color>
    ■ Activates when performing a Full Charge attack while in Everyone's Star status. Affects all allies.
    <color=#00AEFF>Restores {description_value_03}% of the caster's <word_group=10025>final</word_group> max HP as HP.</color>
    ■ Activates when entering Full Burst. Affects self and all allies with lower <word_group=10025>final</word_group> DEF than self.
    <color=#00AEFF><word_group=10066>Projectile Explosion Damage</word_group> ▲ {description_value_04}% for {description_value_05} sec.</color>
    ■ Activates when entering Full Burst. Affects all allies.
    <color=#00AEFF>Attack Damage ▲ {description_value_06}% for {description_value_07} sec.</color>
  ko: |-
    ■ 풀 버스트 타임 시작 시 자신이 나만의 별 상태라면 아군 전체에게
    <color=#00AEFF>[시전자 기준 공격력 {description_value_01}% ▲] [{description_value_02}초 유지]</color>
    ■ 풀 차지 공격 시 자신이 모두의 별 상태라면 아군 전체에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_03}% 회복]</color>
    ■ 풀 버스트 타임 시작 시 자신과 자신보다 <word_group=10025>최종</word_group> 방어력이 낮은 아군 전체에게
    <color=#00AEFF>[<word_group=10066>발사체 폭발 대미지</word_group> {description_value_04}% ▲] [{description_value_05}초 유지]</color>
    ■ 풀 버스트 타임 시작 시 아군 전체에게
    <color=#00AEFF>[공격 대미지 {description_value_06}% ▲] [{description_value_07}초 유지]</color>
  ja: |-
    ■フルバーストタイムが発動した時、
    自分が私だけの星状態なら、味方全体に
    <color=#00AEFF>「スキル発動者基準で攻撃力{description_value_01}％▲」「{description_value_02}秒間維持」</color>
    ■フルチャージして攻撃した時、
    自分がみんなの星状態なら、味方全体に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの
    {description_value_03}％回復」</color>
    ■フルバーストタイムが発動した時、
    自分と自分より<word_group=10025>最終</word_group>防御力が低い味方全体に
    <color=#00AEFF>「<word_group=10066>発射体爆発ダメージ</word_group>{description_value_04}％▲」「{description_value_05}秒間維持」</color>
    ■フルバーストタイムが発動した時、味方全体に
    <color=#00AEFF>「攻撃ダメージ{description_value_06}％▲」「{description_value_07}秒間維持」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
20171_name:
  en: Starfall
  ko: 스타 폴
  ja: スターフォール
20171_description:
  en: |-
    ■ Activates at the start of battle only if self is alive. Affects all allies.
    <color=#00AEFF><word_group=10014>Burst Gauge filling speed</word_group> ▲ {description_value_05}% continuously.</color>
    ■ Activates at the start of battle and when Full Burst ends.
    <color=#00AEFF>Effect differs according to squad formation. Only the corresponding effect is applied.
    If there are no other <word_group=10067>Burst {description_value_01} allies</word_group>:
    Effect 1: Affects self. <word_group=10101>Cancels</word_group> Everyone's Star.
    Effect 2: Affects self. My Own Star: ATK ▲ {description_value_02}%. This effect is continuous and cannot be removed.
    Effect 3: Affects all allies. <word_group=10031>Cooldown</word_group> of Burst Skill ▼ {description_value_03} sec.
    If there are any other <word_group=10067>Burst {description_value_01} allies</word_group>:
    Effect 1: Affects self. <word_group=10101>Cancels</word_group> My Own Star.
    Effect 2: Affects self. Everyone's Star: <word_group=10062>Re-enters Burst and changes to Stage {description_value_01}</word_group>. This effect is continuous and cannot be removed.</color>
    ■ Activates when hitting a target with Full Charge. Affects the target.
    <color=#00AEFF>Deals {description_value_04}% of <word_group=10025>final</word_group> ATK as additional damage.</color>
  ko: |-
    ■ 전투 시작 시 자신이 생존 상태일 때 한하여 아군 전체에게
    <color=#00AEFF>[<word_group=10014>버스트 게이지 충전 속도</word_group> {description_value_05}% ▲] [지속]</color>
    ■ 전투 시작 시와 풀 버스트 타임 종료 시
    <color=#00AEFF>[스쿼드 구성 별 효과] [해당되는 효과만 적용]
    자신을 제외한 <word_group=10067>기본 버스트 단계가 Step {description_value_01}인 아군</word_group>이 없다면
    효과 1 : 자신에게 [모두의 별 <word_group=10101>삭제</word_group>]
    효과 2 : 자신에게 [나만의 별 : 공격력 {description_value_02}% ▲] [지속] [해제 불가]
    효과 3 : 아군 전체에게 [버스트 스킬 <word_group=10031>재사용 시간</word_group> {description_value_03}초 ▼]
    자신을 제외한 <word_group=10067>기본 버스트 단계가 Step {description_value_01}인 아군</word_group>이 있다면
    효과 1 : 자신에게 [나만의 별 <word_group=10101>삭제</word_group>]
    효과 2 : 자신에게 [모두의 별 : <word_group=10062>버스트 재진입 {description_value_01}단계로 변경</word_group>] [지속] [해제 불가]</color>
    ■ 풀 차지 공격 명중 시 대상에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_04}% 추가 대미지]</color>
  ja: |-
    ■戦闘開始時、自分が生存している限り、味方全体に
    <color=#00AEFF>「<word_group=10014>バーストゲージのチャージ速度</word_group>{description_value_05}％▲」「持続」</color>
    ■戦闘開始時およびフルバーストタイムが終了した時、
    <color=#00AEFF>「部隊構成による効果」
    「該当効果のみ適用」
    自分を除く<word_group=10067>基本バースト段階が{description_value_01}の味方</word_group>がいない場合、
    効果1：自分に「みんなの星<word_group=10101>消去</word_group>」
    効果2：自分に「私だけの星：
    攻撃力{description_value_02}％▲」「持続」「解除不可」
    効果3：味方全体に「バーストスキル<word_group=10031>クールタイム</word_group>{description_value_03}秒▼」
    自分を除く<word_group=10067>基本バースト段階が{description_value_01}の味方</word_group>がいる場合、
    効果1：自分に「私だけの星<word_group=10101>消去</word_group>」
    効果2：自分に「みんなの星：<word_group=10062>バースト再突入{description_value_01}段階に変更</word_group>」「持続」「解除不可」</color>
    ■フルチャージ攻撃が命中した時、対象に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_04}％の追加ダメージ」</color>
