10173_name:
  en: Star Anis
  ko: 스타 아니스
  ja: スターアニス
10173_description:
  en: |-
    ■ Affects self.
    <color=#00AEFF>Shooting Stars
    Function: Generates stars around Anis that attack random targets automatically.
    Damage: {description_value_01}% of <word_group=10025>final</word_group> ATK
    Attack Interval: 0.25 sec
    Duration: {description_value_02} sec
    Additional Effects
    Charge time is fixed at {description_value_10} sec for {description_value_02} sec.
    Explosion Radius ▲ {description_value_03}% for {description_value_02} sec.
    DEF ▲ {description_value_05}% for {description_value_02} sec.</color>
    ■ Activates while in My Own Star status. Affects self.
    <color=#00AEFF>Attack Damage ▲ {description_value_06}% for {description_value_07} sec.</color>
    ■ Activates while in Everyone's Star status. Affects all allies.
    <color=#00AEFF>Max HP ▲ {description_value_08}% of the caster's max HP for {description_value_09} sec.</color>
  ko: |-
    ■ 자신에게
    <color=#00AEFF>[슈팅 스타]
    기능 : 아니스 주변에 작은 별을 생성하여 무작위 대상에게 자동 공격합니다.
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_01}%
    공격 간격 : 0.25초
    유지 시간 : {description_value_02}초
    추가 효과
    [차지 시간 {description_value_10}초로 고정] [{description_value_02}초 유지]
    [폭발 범위 {description_value_03}% ▲] [{description_value_02}초 유지]
    [방어력 {description_value_05}% ▲] [{description_value_02}초 유지]</color>
    ■ 자신이 나만의 별 상태라면 자신에게
    <color=#00AEFF>[공격 대미지 {description_value_06}% ▲] [{description_value_07}초 유지]</color>
    ■ 자신이 모두의 별 상태라면 아군 전체에게
    <color=#00AEFF>[시전자 기준 최대 체력 {description_value_08}% ▲] [{description_value_09}초 유지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「シューティングスター」
    機能：アニスの周囲に小さな星が生成され、ランダムな対象に自動攻撃する
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_01}％
    攻撃間隔：0.25秒
    維持時間：{description_value_02}秒
    追加効果
    「チャージ時間{description_value_10}秒に固定」
    「{description_value_02}秒間維持」
    「爆発範囲{description_value_03}％▲」「{description_value_02}秒間維持」
    「防御力{description_value_05}％▲」「{description_value_02}秒間維持」</color>
    ■自分が私だけの星状態なら、自分に
    <color=#00AEFF>「攻撃ダメージ{description_value_06}％▲」「{description_value_07}秒間維持」</color>
    ■自分がみんなの星状態なら、味方全体に
    <color=#00AEFF>「スキル発動者基準で最大HP{description_value_08}％▲」「{description_value_09}秒間維持」</color>
