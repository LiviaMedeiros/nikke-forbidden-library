---
104_name:
  en: 'Drake: Great Villain'
  ko: '드레이크 : 그레이트 빌런'
  ja: ドレイク：グレイトヴィラン
c104_description:
  en: A true villain who's been reborn using the full might of Missilis's technology.
    As the self-described leader of the Villain Union, she chooses villainy every
    day.
  ko: |-
    미실리스의 기술력을 총동원해 다시 태어난 최강의 빌런.
    자칭 빌런 연합의 리더로서, 오늘도 악행에 매진하고 있다.
  ja: |-
    ミシリスの技術力を結集し、生まれ変わった最強のヴィラン。
    自称ヴィラン連合のリーダーとして、
    今日も悪事に励んでいる。
104_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_104:
  en: 'Drake: Great Villain''s Spare Body'
  ko: '드레이크 : 그레이트 빌런 스페어 바디'
  ja: ドレイク：グレイトヴィランのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sg_down:
  en: Shotgun
  ko: 샷건
  ja: ショットガン
character_shot_description_localkey_sg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
21042_name:
  en: Fashionably Late Villain
  ko: 빌런, 지각하다
  ja: ヴィランは遅れてやってくる
21042_description:
  en: |-
    ■ Activates when Full Burst ends. Affects all allies.
    <color=#00AEFF>Max HP ▲ {description_value_02}% of the skill user's max HP (without restoring HP) continuously. Stacks up to {description_value_03} times.</color>
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Fashionably Late: ATK ▲ {description_value_01}% of the skill user's <word_group=10025>final</word_group> max HP continuously.</color>
  ko: |-
    ■ 풀 버스트 타임 종료 시 아군 전체에게
    <color=#00AEFF>[시전자 기준 최대 체력만 {description_value_02}% ▲] [{description_value_03} 중첩] [지속]</color>
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[지각 : 시전자의 <word_group=10025>최종</word_group> 최대 체력의 {description_value_01}% 만큼 공격력 ▲] [지속]</color>
  ja: |-
    ■フルバーストタイムが終了した時、味方全体に
    <color=#00AEFF>「スキル発動者基準で最大HPのみ{description_value_02}％▲」「{description_value_03}スタック」「持続」</color>
    ■戦闘開始時、自分に
    <color=#00AEFF>「遅刻：スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_01}％分の攻撃力▲」「持続」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
21041_name:
  en: Super Duper Overdrive
  ko: 오버 오버 드라이브
  ja: オーバーオーバードライブ
21041_description:
  en: |-
    ■ Activates when entering Full Burst. Affects self.
    <color=#00AEFF>Changes the weapon in use: Super Duper Overdrive
    Charge Time: Fixed at 1.5 sec
    Damage: {description_value_01}% of <word_group=10025>final</word_group> ATK
    <word_group=10038>Pellet</word_group> Count: 15
    Full Charge Damage: 300%
    Max Ammunition Capacity: {description_value_02}</color>
    ■ Activates when Super Duper Overdrive ends. Affects self.
    <color=#00AEFF>Removes {description_value_03}% of ammo.</color>
  ko: |-
    ■ 풀 버스트 타임 시작 시 자신에게
    <color=#00AEFF>[사용 무기 변경 : 오버 오버 드라이브] :
    차지 시간 : 1.5초로 고정
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_01}% 대미지
    <word_group=10038>펠릿</word_group> 개수 : 15개
    풀 차지 대미지 : 300%
    최대 장탄 수 : {description_value_02}발</color>
    ■ 오버 오버 드라이브 상태 종료 시 자신에게
    <color=#00AEFF>[탄환 {description_value_03}% 제거]</color>
  ja: |-
    ■フルバーストタイムが発動した時、自分に
    <color=#00AEFF>「使用武器変更：オーバーオーバードライブ」：
    チャージ時間：1.5秒に固定
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_01}％のダメージ
    <word_group=10038>ペレット</word_group>数：15個
    フルチャージダメージ：300％
    最大装弾数：{description_value_02}発</color>
    ■オーバーオーバードライブ状態が終了した時、自分に
    <color=#00AEFF>「残弾数{description_value_03}％低下」</color>
skill_name_1002:
