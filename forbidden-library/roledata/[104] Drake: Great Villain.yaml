102_name:
  en: Maxwell
  ko: 맥스웰
  ja: マクスウェル
101_name:
  en: Drake
  ko: 드레이크
  ja: ドレイク
100_name:
  en: Laplace
  ko: 라플라스
  ja: ラプラス
103_name:
  en: 'Laplace: Ultimate Hero'
  ko: '라플라스 : 얼티밋 히어로'
  ja: ラプラス：アルティメットヒーロー
105_name:
  en: 'Maxwell: Ordinary Mechanic'
  ko: '맥스웰 : 오디너리 미케닉'
  ja: マクスウェル：オーディナリーメカニック
c104_Lobby_Touch_1:
  en: Hahaha! Feel that? It's the overwhelming power flowing from my body!
  ko: |-
    후후후, 느껴지나?
    이 몸에게서 흘러넘치는 압도적인 힘이!
  ja: |-
    フフフ、感じるか？
    この身からあふれ出る圧倒的な力を！
c104_Lobby_Touch_2:
  en: Gaze upon this magnificent electric dinosaur!
  ko: |-
    여길 봐라!
    이 멋진 공룡 모양 전격을!
  ja: |-
    見ろ！
    このカッコいい恐竜の電撃を！
c104_Lobby_Touch_3:
  en: A hero is no match for me!
  ko: 히어로따위는 내 상대가 되지 않는다!
  ja: ヒーローなど、私の敵ではない！
c104_Lobby_Touch_Love_1:
  en: Now I am not just the ultimate villain, but the strongest villain too!
  ko: 이제 나는 최고의 빌런을 넘어, 최강의 빌런이다!
  ja: もはや私は最高のヴィランを超え、最強のヴィランだ！
c104_Lobby_Touch_Love_2:
  en: Can you handle this destructive power, Moron? ... 'Cause I still can't.
  ko: |-
    네 놈, 이 파괴적인 힘을 감당할 수 있겠나?
    나는 아직 못하겠다.
  ja: |-
    この破滅的な力に耐えられるか？
    私には、まだ無理だ。
c104_Lobby_Touch_Love_3:
  en: Mwahaha! Now that I've powered up, I'm practically invincible! ... Not actually
    invincible, of course.
  ko: |-
    후후후, 파워업한 나는 이제 무적에 가깝다!
    …진짜 무적은 아니지만.
  ja: |-
    フフフ、パワーアップした私はもう無敵に近い！
    …本当に無敵ではないがな。
c104_Lobby_Stay_1:
  en: It's quiet! Are you in awe of my newfound power? ... Wait, did you all go out
    to eat without me?
  ko: |-
    조용하군, 강해진 나의 위압감 때문인가!
    …혹시 나만 빼고 밥먹으러 갔나.
  ja: |-
    静かだな。強くなった私に怯えたか！
    …それとも私を置いて食事に行ったのか？
c104_Lobby_Stay_Love_1:
  en: I'll be doing some things for the Villain Union until you return!
  ko: 네놈이 돌아올 때까지 빌런 연합 활동을 하고 있겠다!
  ja: 貴様が戻ってくるまで、ヴィラン連合の活動をしているぞ！
c104_Outpost_Touch_1:
  en: There are so many new buildings! It might be time for a little villainy!
  ko: |-
    새로운 건물이 많이 생겼군!
    악행을 저지를 시간인가!
  ja: |-
    新しい建物がずいぶん増えたな！
    悪事を働く時が来たようだ！
c104_Outpost_Touch_2:
  en: I demand a hideout be built for the Villain Union! ... But if not, I understand.
  ko: |-
    빌런 연합을 위한 건물을 하나 세워라!
    안 되면 어쩔 수 없고.
  ja: |-
    ヴィラン連合のための建物を一つ建てろ！
    ダメなら仕方ないが。
c104_Outpost_Touch_3:
  en: I see the Maid Cafe hasn't changed at all! Someday I'll have to make my Villain
    Omurice again!
  ko: |-
    메이드 카페는 여전하군!
    언젠가 또 빌런 오므라이스를 만들어 주마!
  ja: |-
    メイドカフェは相変わらずだな！
    いつかまた、ヴィランオムライスを作ってやろう！
c104_Gacha_Get_1:
  en: I am Drake, leader of the Villain Union and the strongest villain there is!
    Join the union, Moron!
  ko: |-
    빌런 연합의 리더이자 최강의 빌런인 드레이크다!
    네 놈도 가입해라!
  ja: |-
    ヴィラン連合のリーダーにして最強のヴィラン、ドレイクだ！
    貴様も加入しろ！
c104_Reinforce_1:
  en: "... There I go again, getting even stronger."
  ko: "…이런, 또 강해져버린 건가."
  ja: "…なんてことだ、また強くなってしまったのか。"
c104_Reinforce_2:
  en: I've gotten even stronger than before?! Just what are my limits?!
  ko: |-
    여기서 더 강해질 수 있었단 말인가!
    내 한계는 대체 어디까지지!
  ja: |-
    さらに強くなれたということか！
    私の限界は、いったいどこなんだ！
c104_Reinforce_3:
  en: Haha... Hahaha! I'm becoming more and more perfect! Rejoice!
  ko: |-
    후후… 하하하!
    이 몸은 점점 더 완벽해지고 있다! 기뻐하도록!
  ja: |-
    フフ…ハハハ！
    この体はますます完璧になっている！喜ぶがいい！
c104_Gift_1:
  en: Give me more! ... If you don't have anymore, though, that's okay.
  ko: |-
    더 내놔라!
    …없으면 됐다.
  ja: |-
    もっとよこせ！
    …ないならいい。
c104_Gift_2:
  en: Haha! Offering a bribe to a villain? A wise choice!
  ko: |-
    후후… 빌런에게 뇌물을 바치다니!
    현명한 선택이다!
  ja: |-
    フフ…ヴィランに賄賂を贈るとは！
    賢明な選択だ！
c104_Gift_3:
  en: Are you trying to make me happy to lower my guard?! ... If so, you succeeded.
  ko: |-
    나를 기쁘게 해서 방심시키려는 작전인가!
    …그렇다면 성공이다.
  ja: |-
    私を喜ばせて油断させようという作戦か！
    …それなら成功だ。
c104_Attractive_Up_1:
  en: This has improved my opinion of you a little! ... Just a little. Honest.
  ko: |-
    네놈을 조금 더 인정해주마!
    아주 조금. 정말 조금 더.
  ja: |-
    少しは貴様を認めてやろう！
    ほんの少しだけ。本当に少しだけだぞ。
c104_Attractive_Up_2:
  en: Growing attached to a villain, eh? You're dangerous.
  ko: 빌런에게 정을 붙이다니, 네 놈은 위험한 녀석이군.
  ja: ヴィランに情をかけるとは、貴様は本当に危険なヤツだ。
c104_Attractive_Up_3:
  en: Just for you, I'll try not to react whenever you say something embarrassing!
  ko: 특별히 네 놈은 낯부끄러운 소리를 해도 봐주겠다!
  ja: 貴様だけは、どんなに恥ずかしいことを言っても大目に見てやろう！
c104_Party_Deploy_1:
  en: Haha! I'm totally ready.
  ko: 후후. 준비는 완벽하다.
  ja: フフ。準備は万全だ。
c104_Field_Touch_1:
  en: What is it? You wanna join the Villain Union?
  ko: 뭐지, 빌런 연합에 합류할 건가.
  ja: 何だ、ヴィラン連合に加わるつもりか。
c104_Field_Go_1:
  en: Time for a villainous entrance!
  ko: 이게 바로 빌런 워킹이다!
  ja: これが、ヴィランウォーキングだ！
c104_Battle_Enter_1:
  en: It is finally time to show you what a villain can do!
  ko: 드디어 빌런의 힘을 보여줄 때인가!
  ja: ついにヴィランの力を見せつける時が来たか！
c104_Battle_Ready_1:
  en: Stand back and watch!
  ko: 네 놈은 뒤에서 구경이나 해라!
  ja: 貴様は後ろで見学でもしていろ！
c104_Battle_Ready_2:
  en: Time for my Villainous Web to shine again!
  ko: 빌런 웹이 또 다시 빛을 발할 때가 왔군!
  ja: 再びヴィランウェッブが輝く時が来たな！
c104_Battle_Ready_3:
  en: The Villain Union's always taking new recruits!
  ko: 빌런 연합, 상시 모집 중이다!
  ja: ヴィラン連合、随時メンバー募集中だ！
c104_Reload_1:
  en: My lightning strikes where it wants!
  ko: 내 전격은 자유자재로 움직인다!
  ja: 私の電撃は自由自在に動くぞ！
c104_Reload_2:
  en: Rest is important!
  ko: 휴식은 중요하다!
  ja: 休息は大切だ！
c104_Reload_3:
  en: Nice and slow... Quickly, you say? Okay.
  ko: 이런 건 여유롭게… 빨리 하라고? 알겠다.
  ja: ここはのんびりと…早くしろだと？分かった。
c104_Ult_Skill_Ready_1:
  en: Haha! I'm ready!
  ko: 후후, 이 몸은 준비됐다!
  ja: フフ、私は準備できている！
c104_Ult_Skill_1:
  en: Take this! Special Villainous Web!
  ko: 빌런 웹 스페셜! 전개---!!
  ja: ヴィランウェッブスペシャル！展開ーーー！！
c104_FullBurst_1:
  en: Mwahaha! Behold the power of a villain!
  ko: 후하하하! 이게 빌런의 힘이다!
  ja: フハハハ！これがヴィランの力だ！
c104_Kill_Monster_1:
  en: Too easy!
  ko: 너무 쉽군!
  ja: 簡単すぎるな！
c104_Kill_Monster_2:
  en: Taste my lightning!
  ko: 전격 맛 좀 봐라!
  ja: 電撃の恐ろしさを思い知れ！
c104_Kill_Monster_3:
  en: Villain strike!
  ko: 빌런 어택!
  ja: ヴィランアタック！
c104_Damage_1:
  en: Ugh!
  ko: 윽!
  ja: うっ！
c104_Damage_2:
  en: Argh!
  ko: 큭!
  ja: くっ！
c104_Damage_3:
  en: Hrngh!
  ko: 흐억!
  ja: うあっ！
c104_Die_1:
  en: I haven't been defeated! I'm just taking a sec to strategically check the floor!
  ko: |-
    쓰러진 게 아니다!
    작전상 잠깐 바닥을 확인했을 뿐이다!
  ja: |-
    倒れたわけではない！
    作戦上、少し地面を確認しただけだ！
c104_Win_1:
  en: Heh heh... Surprised? That's just the power of the strongest villain alive!
    Marvel all you'd like!
  ko: "후후… 놀랐나? 감탄해도 좋다! \n이게 바로 최강의 빌런, 드레이크의 힘이니까!"
  ja: |-
    フフ…驚いたか？驚くがいい！
    これこそが最強のヴィラン、ドレイクの力だ！
