---
19_name:
  en: 'Marian: Queen'
  ko: '마리안 : 퀸'
  ja: マリアン：クイーン
c019_description:
  en: Marian has become a true Queen in order to protect those she holds dear, and
    to create a world where no one must die—a kind world where everyone loves and
    is loved.
  ko: |-
    소중한 사람들을 지키고, 그 누구도 죽지 않는 세계를 만들기 위해.
    모두가 사랑하고 사랑받는 상냥한 세계를 이루기 위해.
    마리안은 진정한 여왕이 되었다.
  ja: |-
    大切な人たちを守るため、
    誰も死ぬことのない世界を作るため、
    誰もが愛し愛される優しい世界を作るため…
    真の女王となったマリアン。
19_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_19:
  en: 'Marian: Queen''s Spare Body'
  ko: '마리안 : 퀸 스페어 바디'
  ja: マリアン：クイーンのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_mg_down:
  en: Machine Gun
  ko: 머신건
  ja: マシンガン
character_shot_description_localkey_mg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
20192_name:
  en: Synthetic World
  ko: 유사 세계
  ja: 世界の模倣
20192_description:
  en: |-
    ■ Activates when using Burst Skill. Affects self.
    <color=#00AEFF><word_group=10111>Into the Fray</word_group>: Penetrant Wish
    Function: Deals core damage to all enemies in the Open Wounds state.
    Effect 1: Activates after performing {description_value_01} normal attacks. Affects all enemies in the Open Wounds state. Deals {description_value_02}% of <word_group=10025>final</word_group> ATK as <word_group=10104>core strike damage</word_group>.
    Effect 2: Affects self. <word_group=10085>Recurring interval</word_group> of <word_group=10111>Into the Fray</word_group>: Sharpened Resolve ▼ {description_value_03} sec.
    Duration: {description_value_04} sec</color>
    ■ Activates when entering Full Burst while not in the <word_group=10111>Into the Fray</word_group>: Penetrant Wish state. Affects self.
    <color=#00AEFF><word_group=10050>Sequential Attack</word_group> Damage ▲ {description_value_05}% for {description_value_06} sec.</color>
    ■ Activates when entering Full Burst while in the <word_group=10111>Into the Fray</word_group>: Penetrant Wish state. Affects self.
    <color=#00AEFF>Core Damage ▲ {description_value_07}% for {description_value_08} sec.</color>
  ko: |-
    ■ 버스트 스킬 사용 시 자신에게
    <color=#00AEFF>[<word_group=10111>임전</word_group> : 파고드는 소망]
    기능 : 약점 개방 상태의 모든 적에게 코어 대미지로 공격합니다.
    효과 1 : 일반 공격 {description_value_01}회 공격 시 약점 개방 상태 적 전체에게 [<word_group=10025>최종</word_group> 공격력 {description_value_02}% <word_group=10104>코어 명중 대미지</word_group>]
    효과 2 : 자신에게 [<word_group=10111>임전</word_group> : 의지를 벼린 창끝 <word_group=10085>반복 주기</word_group> {description_value_03}초 ▼]
    유지 시간 : {description_value_04}초</color>
    ■ 풀 버스트 타임 시작 시 자신이 <word_group=10111>임전</word_group> : 파고드는 소망 상태가 아니라면 자신에게
    <color=#00AEFF>[<word_group=10050>순차 공격</word_group> 대미지 {description_value_05}% ▲] [{description_value_06}초 유지]</color>
    ■ 풀 버스트 타임 시작 시 자신이 <word_group=10111>임전</word_group> : 파고드는 소망 상태라면 자신에게
    <color=#00AEFF>[코어 대미지 {description_value_07}% ▲] [{description_value_08}초 유지]</color>
  ja: |-
    ■バーストスキルを使用した時、自分に
    <color=#00AEFF>「<word_group=10111>臨戦</word_group>：胸を刺す願い」
    機能：弱点露出状態のすべての敵に
    コアダメージ値での攻撃を行う
    効果1：通常攻撃で{description_value_01}回攻撃した時、
    弱点露出状態の敵全体に
    「<word_group=10025>最終</word_group>攻撃力の{description_value_02}％の<word_group=10104>コア命中ダメージ</word_group>」
    効果2：自分に
    「<word_group=10111>臨戦</word_group>：意思の鋭槍<word_group=10085>再発動周期</word_group>{description_value_03}秒▼」
    維持時間：{description_value_04}秒</color>
    ■フルバーストタイムが発動した時、自分が
    <word_group=10111>臨戦</word_group>：胸を刺す願い状態でなければ、自分に
    <color=#00AEFF>「<word_group=10050>順番攻撃</word_group>ダメージ{description_value_05}％▲」
    「{description_value_06}秒間維持」</color>
    ■フルバーストタイムが発動した時、自分が
    <word_group=10111>臨戦</word_group>：胸を刺す願い状態なら、自分に
    <color=#00AEFF>「コアダメージ{description_value_07}％▲」「{description_value_08}秒間維持」</color>
skill_name_1003:
  en: Skill 2
