    [공격력 {description_value_04}% ▲] [{description_value_05}초 유지]
    [공격 대미지 {description_value_06}% ▲] [{description_value_07}초 유지]</color>
    ■ 적 전체에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_08}% 버스트 스킬 대미지]</color>
  ja: |-
    ■自分に
    <color=#00AEFF>「弾丸チャージ{description_value_01}％」
    「<word_group=10073>マシンガン立ち上げ速度</word_group>{description_value_02}％▲」
    「{description_value_03}秒間維持」
    「攻撃力{description_value_04}％▲」「{description_value_05}秒間維持」
    「攻撃ダメージ{description_value_06}％▲」「{description_value_07}秒間維持」</color>
    ■敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_08}％の
    バーストスキルダメージ」</color>
