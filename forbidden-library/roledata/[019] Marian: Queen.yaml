  ja: スキル2
20191_name:
  en: Sharpened Resolve
  ko: 의지를 벼린 창끝
  ja: 意思の鋭槍
20191_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF><word_group=10111>Into the Fray</word_group>: Sharpened Resolve
    Function: Launches Dark Matter spears at random enemies.
    Effect 1: Affects random enemies. Dark Matter Spear: Deals {description_value_01}% of <word_group=10025>final</word_group> ATK as damage. <word_group=10050>Attacks sequentially</word_group> {description_value_02} times.
    Effect 2: Activates when landing a hit with a Dark Matter spear. Affects the target. Open Wounds: Damage Taken ▲ {description_value_03}%. This effect is continuous and cannot be removed.
    <word_group=10085>Recurring interval</word_group>: {description_value_04} sec</color>
    ■ Activates when using Burst Skill. Affects all enemies.
    <color=#00AEFF>Open Wounds: Damage Taken ▲ {description_value_03}%. This effect is continuous and cannot be removed.</color>
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[<word_group=10111>임전</word_group> : 의지를 벼린 창끝]
    기능 : 무작위 적들에게 다크 매터 창을 발사합니다.
    효과 1 : 무작위 적들에게 [다크 매터 창 : <word_group=10025>최종</word_group> 공격력 {description_value_01}% 대미지] [{description_value_02}회 <word_group=10050>순차 공격</word_group>]
    효과 2 : 다크 매터 창 명중 시 대상에게 [약점 개방 : 받는 대미지 {description_value_03}% ▲] [지속] [해제 불가]
    <word_group=10085>반복 주기</word_group> : {description_value_04}초</color>
    ■ 버스트 스킬 사용 시 적 전체에게
    <color=#00AEFF>[약점 개방 : 받는 대미지 {description_value_03}% ▲] [지속] [해제 불가]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「<word_group=10111>臨戦</word_group>：意思の鋭槍」
    機能：ランダムな敵にダークマターの槍を
    発射する
    効果1：ランダムな敵に
    「ダークマターの槍：<word_group=10025>最終</word_group>攻撃力の{description_value_01}％のダメージ」「{description_value_02}回<word_group=10050>順番に攻撃</word_group>」
    効果2：ダークマターの槍が命中した時、
    対象に
    「弱点露出：受けるダメージ{description_value_03}％▲」
    「持続」「解除不可」
    <word_group=10085>再発動周期</word_group>：{description_value_04}秒</color>
    ■バーストスキルを使用した時、敵全体に
    <color=#00AEFF>「弱点露出：受けるダメージ{description_value_03}％▲」
    「持続」「解除不可」</color>
