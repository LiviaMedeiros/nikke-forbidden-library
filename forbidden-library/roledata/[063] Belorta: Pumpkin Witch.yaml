    [지속 대미지 {description_value_03}% ▲] [{description_value_04}초 유지]</color>
  ja: |-
    ■自分の<word_group=10109>右隣の</word_group>味方1機に
    <color=#00AEFF>「スキル発動者基準で攻撃力{description_value_01}％▲」
