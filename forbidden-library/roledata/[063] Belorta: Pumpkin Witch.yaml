62_name:
  en: 'Mica: Snow Buddy'
  ko: '미카 : 스노우 버디'
  ja: ミカ：スノーバディ
60_name:
  en: Belorta
  ko: 벨로타
  ja: ベロータ
61_name:
  en: Mica
  ko: 미카
  ja: ミカ
c063_Lobby_Touch_1:
  en: What do you think, Old-Timer? Do I look like a real witch?
  ko: 아저씨, 나 어때? 진짜 마녀 같아?
  ja: |-
    おじさん、どう？
    私、本物の魔女に見える？
c063_Lobby_Touch_2:
  en: Trick or treat! Gimme some candy, or get ready for a prank!
  ko: |-
    트릭 오어 트릿!
    사탕 안 주면 장난칠 거야!
  ja: |-
    トリック・オア・トリート！
    お菓子をくれなきゃいたずらしちゃうよ！
c063_Lobby_Touch_3:
  en: Want some of this candy? It's really good!
  ko: |-
    이거 먹어볼래~?
    엄-청 맛있는 사탕이야!
  ja: |-
    これ、食べてみる～？
    ものすっごくおいしいキャンディだよ！
c063_Lobby_Touch_Love_1:
  en: Hey, Old-Timer, let's go look at some Halloween toys ♡
  ko: 아저씨~ 나랑 할로윈 장난감 구경하러 가자♡
  ja: |-
    おじさん～、私と一緒に
    ハロウィンのおもちゃを見に行こうよ♡
c063_Lobby_Touch_Love_2:
  en: From now on, you're gonna spend every Halloween with me, okay? ♡
  ko: 앞으로 할로윈은 매번 나랑 보내는 거야♡
  ja: |-
    これから毎年、
    ハロウィンは私と過ごしてね♡
c063_Lobby_Touch_Love_3:
  en: I'll only give you the tastiest candy ♡
  ko: 아저씨한테는 맛있는 사탕만 줄게♡
  ja: おじさんには、おいしいキャンディだけをあげる♡
c063_Lobby_Stay_1:
  en: Old-Timer! If you don't get out here quickly, I'm gonna cast a terrible curse
    on you!
  ko: |-
    아저씨~!
    빨리 안 오면, 무시무시한 저주를 걸어버릴 거야!
  ja: |-
    おじさん～！
    早く来てくれないと、こわ～い呪いを
    かけちゃうからね！
c063_Lobby_Stay_Love_1:
  en: Hmm...! I gotta think of some pranks I can pull with Old-Timer this Halloween
    ♡
  ko: 흐흥~ 아저씨랑 할로윈에 무슨 장난 칠지 생각해야지♡
  ja: |-
    フフン～、ハロウィンに
    おじさんとどんないたずらをするか
    考えなくちゃ♡
c063_Outpost_Touch_1:
  en: Come check out the toy store! This little witch will be waiting for you ♡
  ko: 장난감 가게에 놀러 와! 마녀가 기다리고 있으니까♡
  ja: |-
    おもちゃ屋さんに遊びに来て！
    魔女が待ってるから♡
c063_Outpost_Touch_2:
  en: Old-Timer, have you seen Mica? We said we'd make Halloween decorations together,
    but she ran off!
  ko: |-
    아저씨, 혹시 미카 못 봤어?
    같이 할로윈 장식 만들기로 했는데 어디 간 거야~!
  ja: |-
    おじさん、ミカを見なかった？
    一緒にハロウィンの飾りを作るって約束したのに～！
c063_Outpost_Touch_3:
  en: I hid some pumpkin candy around here. Try to find it!
  ko: 여기에 호박 사탕 숨겨놨어, 한번 찾아봐!
  ja: |-
    ここにカボチャのキャンディを隠しておいたよ。
    探してみて！
c063_Gacha_Get_1:
  en: Belorta the witch, reporting for candy! Let's have some fun, Old-Timer!
  ko: |-
    마녀 벨로타 등장이요~!
    아저씨, 오늘도 재밌게 놀자!
  ja: |-
    魔女っ子ベロータ参上～！
    おじさん、今日も楽しく遊ぼう！
c063_Reinforce_1:
  en: Now I'll have an even better Halloween ♡
  ko: 할로윈에 더 신나게 놀 수 있겠어♡
  ja: |-
    ハロウィンだからいつもより
    もっと楽しく遊べそう♡
c063_Reinforce_2:
  en: I feel like I'm becoming a real witch!
  ko: 진짜 마녀가 되어가는 기분이야~!
  ja: 本物の魔女になった気分～！
c063_Reinforce_3:
  en: I just thought of a fun prank!
  ko: 재밌는 장난이 생각났어!
  ja: おもしろいいたずらを思いついちゃった！
c063_Gift_1:
  en: A Halloween present? Thanks ♡
  ko: 할로윈 선물이야? 고마워♡
  ja: ハロウィンのプレゼント？ありがとう♡
c063_Gift_2:
  en: Can I display this at the toy store? I want to look at it every day ♡
  ko: |-
    이거 장난감 가게에 진열해도 돼?
    매일매일 보고 싶거든♡
  ja: |-
    これ、おもちゃ屋さんに飾ってもいい？
    毎日見てたいんだもん♡
c063_Gift_3:
  en: I always love your gifts!
  ko: 아저씨가 주는 건 뭐든지 좋아!
  ja: おじさんがくれるものなら何でも嬉しい！
c063_Attractive_Up_1:
  en: I like you even more than candy ♡
  ko: 사탕보다 아저씨가 더 좋아♡
  ja: キャンディよりおじさんの方が好き♡
c063_Attractive_Up_2:
  en: If anyone's bothering you, just let me know. I'll get them back with a prank!
  ko: 아저씨 누가 괴롭히면 말해, 내가 장난으로 혼내 줄게!
  ja: |-
    おじさん、もし誰かにいじめられたら言ってね。
    私がいたずらでこらしめてあげるから！
c063_Attractive_Up_3:
  en: Spending Halloween with you is the best ♡
  ko: 역시 할로윈은 아저씨랑 보내는 게 제일 재밌어♡
  ja: |-
    やっぱりハロウィンは
    おじさんと過ごすのが一番楽しいな♡
c063_Party_Deploy_1:
  en: Can I bring my candy bucket?
  ko: 사탕 바구니 들고 가도 돼?
  ja: キャンディのカゴを持っていってもいい？
c063_Field_Touch_1:
  en: I'm here, Old-Timer!
  ko: 나 여기 있어, 아저씨!
  ja: 私はここだよ、おじさん！
c063_Field_Go_1:
  en: I can't believe I don't get a broom!
  ko: 마녀인데 빗자루가 없다니~
