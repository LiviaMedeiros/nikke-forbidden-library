---
63_name:
  en: 'Belorta: Pumpkin Witch'
  ko: '벨로타 : 펌킨 위치'
  ja: ベロータ：パンプキンウィッチ
c063_description:
  en: Belorta has dressed up as a witch to have fun at the Halloween festival. Of
    course, she's still as mischievious as ever.
  ko: |-
    할로윈 축제를 즐기기 위해 마녀 복장으로 꾸민 벨로타.
    축제에서도 장난기 넘치는 모습은 여전하다.
  ja: |-
    ハロウィンのお祭りを楽しむため魔女に変身したベロータ。
    お祭りでもイタズラ好きな姿は相変わらずだ。
63_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_63:
  en: 'Belorta: Pumpkin Witch''s Spare Body'
  ko: '벨로타 : 펌킨 위치 스페어 바디'
  ja: ベロータ：パンプキンウィッチのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_rl_up:
  en: Rocket Launcher
  ko: 런처
  ja: ロケットランチャー
character_shot_description_localkey_rl_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
20632_name:
  en: Trick or Treat!
  ko: 트릭 오어 트릿!
  ja: トリック・オア・トリート！
20632_description:
  en: |-
    ■ Activates when landing a Full Charge attack while in the Ghost Costume state. Affects the target.
    <color=#00AEFF>Ghostly Prank: Damage Taken ▲ {description_value_01}% for {description_value_02} sec.</color>
    ■ Activates when performing a Full Charge attack. Affects the ally <word_group=10109>to the right </word_group> of this unit.
    <color=#00AEFF>Sustained Damage ▲ {description_value_03}% for {description_value_04} sec.</color>
  ko: |-
    ■ 풀 차지 공격 명중 시 자신이 유령 분장 상태라면 대상에게
    <color=#00AEFF>[유령의 장난 : 받는 대미지 {description_value_01}% ▲] [{description_value_02}초 유지]</color>
    ■ 풀 차지 공격 시 자신의 <word_group=10109>우측 자리</word_group> 아군 1기에게
    <color=#00AEFF>[지속 대미지 {description_value_03}% ▲] [{description_value_04}초 유지]</color>
  ja: |-
    ■フルチャージ攻撃が命中した時、
    自分がおばけの仮装状態なら、対象に
    <color=#00AEFF>「おばけのイタズラ：受けるダメージ
    {description_value_01}％▲」「{description_value_02}秒間維持」</color>
    ■フルチャージして攻撃した時、
    自分の<word_group=10109>右隣の</word_group>味方1機に
    <color=#00AEFF>「持続ダメージ{description_value_03}％▲」「{description_value_04}秒間維持」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
20631_name:
  en: Playful Little Witch
  ko: 플레이풀 리틀 위치
  ja: プレイフル・リトル・ウィッチ
20631_description:
  en: |-
    ■ Activates when entering Full Burst. Affects self.
    <color=#00AEFF>Ghost Costume: <word_group=10004>Prevents being targeted by single-target attacks</word_group> for {description_value_01} sec. This effect is removed upon taking a direct hit.
    Prank Preparation: Max HP ▲ {description_value_02}% for {description_value_03} sec.</color>
    ■ Activates when entering Full Burst. Affects the ally <word_group=10109>to the right</word_group> of this unit.
    <color=#00AEFF>ATK ▲ {description_value_04}% of the skill user's ATK for {description_value_05} sec.</color>
  ko: |-
    ■ 풀 버스트 타임 시작 시 자신에게
    <color=#00AEFF>[유령 분장 : <word_group=10004>1인 공격 대상에서 제외</word_group> 직접 피격 시 해제] [{description_value_01}초 유지]
    [장난 준비 : 최대 체력 {description_value_02}% ▲] [{description_value_03}초 유지]</color>
    ■ 풀 버스트 타임 시작 시 자신의 <word_group=10109>우측 자리</word_group> 아군 1기에게
    <color=#00AEFF>[시전자 기준 공격력 {description_value_04}% ▲] [{description_value_05}초 유지]</color>
  ja: |-
    ■フルバーストタイムが発動した時、自分に
    <color=#00AEFF>「おばけの仮装：<word_group=10004>単一攻撃の対象から除外</word_group>
    直接攻撃を受けると解除」「{description_value_01}秒間維持」
    「イタズラ準備：最大HP{description_value_02}％▲」
    「{description_value_03}秒間維持」</color>
    ■フルバーストタイムが発動した時、
    自分の<word_group=10109>右隣の</word_group>味方1機に
    <color=#00AEFF>「スキル発動者基準で攻撃力{description_value_04}％▲」
    「{description_value_05}秒間維持」</color>
skill_name_1002:
  en: Skill 1
  ko: 스킬1
  ja: スキル1
