---
601_name:
  en: Prika
  ko: 프리카
  ja: プリカ
c601_description:
  en: |-
    A member of T.T. STAR (Twinkle Twin Star). As one of the Ark's top pop stars, she is currently enjoying a surge in popularity.
    She sticks to a rigorous training regimen which, combined with her talents in songwriting and composition, makes her the most technically capable member of the group. Although she exhibits confidence no matter who she's interacting with and never second-guesses her own thoughts, she is surprisingly mentally fragile.
  ko: |-
    T.T. STAR(Twinkle Twin Star)의 멤버로, 한창 많은 인기를 얻고 있는 방주의 대표 아이돌.
    항상 고강도의 트레이닝을 하고 있으며, 작사, 작곡 등에도 재능이 있어 팀 내에서 최고의 기량을 가진다.
    상대가 누구든 당당하게 대하며 자신의 생각에 한 치의 망설임도 없지만, 의외로 유리 멘탈이다.
  ja: |-
    T.T. STAR（Twinkle Twin Star）のメンバーで、
    絶大な人気を誇るアークを代表するアイドル。
    常にハードなトレーニングをこなし、作詞作曲などにも才能があり、
    チーム内で最高のスキルを持つ。
    相手が誰であろうと堂々と接し、自分の考えに少しの迷いもないが、
    意外とガラスの心の持ち主。
601_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_601:
  en: Prika's Spare Body
  ko: 프리카 스페어 바디
  ja: プリカのスペアボディ
piece:
  en: |-
    Can be used for Nikkes' Limit Breaks.
    If a Nikke's Limit Break has reached the max level, any additional Spare Bodies for that Nikke will be converted to Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sr_up:
  en: Sniper Rifle
  ko: 저격소총
  ja: スナイパーライフル
character_shot_description_localkey_sr_up:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Charge Time: {charge_time} sec.
    Full Charge Damage: {full_charge_damage}% of damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    차지 시간: {charge_time}초
    풀 차지 대미지: {full_charge_damage}% 대미지
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    チャージ時間：{charge_time}秒
    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
26012_name:
  en: One More Song!
  ko: 한 곡 더!
  ja: もう1曲！
26012_description:
  en: |-
    ■ Activates when entering Full Burst. Affects self.
    <color=#00AEFF>Max HP ▲ {description_value_01}% for {description_value_02} sec.</color>
    ■ Activates when Sing Along takes effect while Prika is in Performance status.
    <color=#00AEFF>Encore
    Function: Extends the duration of Performance for Prika and strengthens allies.
    Effect 1: Affects the member who initiated Sing Along. <word_group=10102>Assigned Part</word_group>: Singing. This effect is continuous and cannot be removed.
    Effect 2: Affects all allies. Performance <word_group=10051>duration ▲ {description_value_03} sec.</word_group>
    Effect 3: Affects all allies. Attack Damage ▲ {description_value_04}% for {description_value_05} sec.
    Effect 4: Affects self. <word_group=10031>Cooldown</word_group> of Burst Skill ▲ {description_value_06} sec.</color>
  ko: |-
    ■ 풀 버스트 타임 시작 시 자신에게
    <color=#00AEFF>[최대 체력 {description_value_01}% ▲] [{description_value_02}초 유지]</color>
    ■ 떼창 적용 시 자신이 퍼포먼스 상태라면
    <color=#00AEFF>[앵콜] :
    기능 : 자신의 퍼포먼스 시간을 연장하고 아군을 강화.
    효과1 : 떼창 시전자에게 [<word_group=10102>무대 파트</word_group> : 보컬] [지속] [해제 불가]
    효과2 : 아군 전체에게 [퍼포먼스 <word_group=10051>유지시간 {description_value_03}초 ▲</word_group>]
    효과3 : 아군 전체에게 [공격 대미지 {description_value_04}% ▲] [{description_value_05}초 유지]
    효과4 : 자신에게 [버스트 스킬 <word_group=10031>재사용 시간</word_group> {description_value_06}초 ▲]</color>
  ja: |-
    ■フルバーストタイムが発動した時、自分に
    <color=#00AEFF>「最大HP{description_value_01}％▲」「{description_value_02}秒間維持」</color>
    ■シンガロングが適用された時、
    自分がパフォーマンス状態なら
    <color=#00AEFF>「アンコール」：
    機能：自分のパフォーマンス時間を延長して
    味方を強化
    効果1：シンガロングのスキル発動者に
    「<word_group=10102>ステージパート</word_group>：ボーカル」「持続」
    「解除不可」
    効果2：味方全体に「パフォーマンス<word_group=10051>維持時間{description_value_03}秒▲</word_group>」
    効果3：味方全体に「攻撃ダメージ{description_value_04}％▲」「{description_value_05}秒間維持」
    効果4：自分に「バーストスキル<word_group=10031>クールタイム</word_group>{description_value_06}秒▲」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
26011_name:
