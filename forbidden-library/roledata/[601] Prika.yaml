16013_description:
  en: |-
    ■ Affects all allies.
    <color=#00AEFF>Performance
    Function: Strengthens allies and restores HP.
    Effect 1: Restores {description_value_01}% of the caster's <word_group=10025>final</word_group> max HP as HP every 1 sec for {description_value_02} sec. This effect cannot be removed.
    Effect 2: Charge Damage ▲ {description_value_05}% for {description_value_06} sec. This effect cannot be removed.</color>
  ko: "■ 아군 전체에게\n<color=#00AEFF>[퍼포먼스] : \n기능 : 아군 회복 및 강화.\n효과1 : [시전자의 <word_group=10025>최종</word_group>
    최대 체력 비례 {description_value_01}% 지속 회복] [1초 간격] [{description_value_02}초 유지] [해제
    불가]\n효과2 : [차지 대미지 {description_value_05}% ▲] [{description_value_06}초 유지] [해제
    불가]</color>"
  ja: |-
    ■味方全体に
    <color=#00AEFF>「パフォーマンス」：
    機能：味方回復＆強化
    効果1：「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_01}％持続回復」「1秒間隔」
    「{description_value_02}秒間維持」「解除不可」
    効果2：「チャージダメージ{description_value_05}％▲」「{description_value_06}秒間維持」「解除不可」</color>
