    ■ Activates only while in Performance status. Affects self.
    <color=#00AEFF>Potency of HP restored ▲ {description_value_07}% continuously.
    Gains Pierce continuously.</color>
  ko: |-
    ■ 풀 차지 공격 시 아군 전체에게
    <color=#00AEFF>[<word_group=10066>발사체 폭발 대미지</word_group> {description_value_01}% ▲] [{description_value_02}초 유지]
    [<word_group=10042>관통 대미지</word_group> {description_value_03}% ▲] [{description_value_04}초 유지]
    [시전자 기준 공격력 {description_value_05}% ▲] [{description_value_06}초 유지]</color>
    ■ 자신이 퍼포먼스 상태일 때 한하여 자신에게
    <color=#00AEFF>[주는 체력 회복량 {description_value_07}% ▲] [지속]
    [관통 특화] [지속]</color>
  ja: |-
    ■フルチャージして攻撃した時、味方全体に
    <color=#00AEFF>「<word_group=10066>発射体爆発ダメージ</word_group>{description_value_01}％▲」
    「{description_value_02}秒間維持」
    「<word_group=10042>貫通ダメージ</word_group>{description_value_03}％▲」「{description_value_04}秒間維持」
    「スキル発動者基準で攻撃力{description_value_05}％▲」
    「{description_value_06}秒間維持」</color>
    ■自分がパフォーマンス状態の時に限り、
    自分に
    <color=#00AEFF>「与えるHP回復量{description_value_07}％▲」「持続」
    「貫通特化」「持続」</color>
skill_name_1002:
