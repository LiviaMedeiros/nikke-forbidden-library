580_name:
  en: Phantom
  ko: 팬텀
  ja: ファントム
581_name:
  en: Arcana
  ko: 아르카나
  ja: アルカナ
583_name:
  en: 'Arcana: Fortune Mate'
  ko: '아르카나 : 포츈 메이트'
  ja: アルカナ：フォーチュンメイト
c582_Lobby_Touch_1:
  en: A-am I even worthy... of being in your presence?
  ko: 이, 이렇게 귀한 분 앞에 누추한 제가 와도 되는 걸까요….
  ja: |-
    こ、こんな尊いお方の前に、
    みすぼらしい私が立っていいんでしょうか…
c582_Lobby_Touch_2:
  en: |-
    Y-you... don't really want me here, do you?
    I'm sorry, I'm sorry, I'm sorry, I'm sorry for overstepping...
  ko: |-
    여, 역시 제가 여기 있는 게 싫으셨던 건가요…?
    죄송합니다죄송합니다죄송합니다주제넘어서죄송합니다….
  ja: |-
    や、やっぱり私がここに来るのは嫌だったんですか…？
    すみませんすみませんすみませんでしゃばってすみません…
c582_Lobby_Touch_3:
  en: I-if that's what you want, I'll go sit in the trash can over there...
  ko: 워, 원하시면 저기 쓰레기통에 들어가 있을게요….
  ja: お、お望みなら、あのゴミ箱に入ってますね…
c582_Lobby_Touch_Love_1:
  en: Just trust me from now on... I'll be watching your every move... Every morning,
    noon, evening, even in the dead of night... Hehehe...
  ko: |-
    앞으로 저만 믿어주세요… 매일 아침 점심 저녁 새벽…
    당신의 일거수일투족을 지켜보고 있을 테니까… 흐흐흐….
  ja: |-
    これから私だけを信じてください…
    毎日…朝、昼、晩、そして夜中まで…
    あなたの一挙手一投足を見守りますから…ふふふ…
c582_Lobby_Touch_Love_2:
  en: Ahh... I knew it. Fate must have led me here...
  ko: 아아… 역시 운명이 나를 이곳으로 이끈 거야….
  ja: ああ…やっぱり運命に導かれたのね…
c582_Lobby_Touch_Love_3:
  en: |-
    Hehehe... If a man and a woman find themselves alone in a place like this...
    There's really only one thing they should do. Don't you think?
  ko: |-
    으흐흐… 이런 곳에 남녀 단둘이 남는다면…
    해야 할 것은 하나밖에 없지 않나요?
  ja: |-
    うふふ…こんな場所に男女二人っきり…
    すべきことは、一つしかないでしょう？
c582_Lobby_Stay_1:
  en: |-
    H-huh...? Where did you go...?
    Y-you're not... meeting another woman, are you...?
  ko: |-
    어, 어라…? 어디 가신 거지…?
    서, 설마… 다른 여자를 만나고 있다거나… 그런 건 아니겠지…?
  ja: |-
    あ、あれ…？いったいどこへ…？
    …ほ、他の女と会ってるとか…？まさかそんなね…
c582_Lobby_Stay_Love_1:
  en: |-
    Hehehe... N-not here... I-I'm not ready yet...
    Ah...! H-hey... wh-when did you come back...?
  ko: |-
    으흐흐… 여기선 안 돼요… 아직 저는 마음의 준비가…
    아…! 다, 다, 당신…? 언제 돌아오셨던 건가요…?
  ja: |-
    ぐふふ…ここではダメですよ…まだ心の準備が…
    あっ…！あ、あ、あなた…？いつ戻ってきたんですか…？
c582_Outpost_Touch_1:
  en: I-I... just want to hurry back to my room...
  ko: 아아… 빠, 빨리 방에 돌아가고 싶어….
  ja: ああ…は、早く部屋に戻りたい…
c582_Outpost_Touch_2:
  en: Th-there are too many people here...
  ko: 여, 여긴 사람이 너무 많아….
  ja: こ、ここは人が多すぎる…
c582_Outpost_Touch_3:
  en: Eek...! Y-you scared me...
  ko: 흐익…! 까, 깜짝이야….
  ja: ひぃっ…！び、びっくりした…
c582_Gacha_Get_1:
  en: |-
    Oh! You finally came for me...!
    I knew we were destined to meet... Hehehe.
  ko: |-
    아아… 드디어 저를 찾아주셨군요…!
    역시 저희는 만나게 될 운명이었던 거예요… 으흐흐흐.
  ja: |-
    ああ…ついに私を見つけてくれたんですね…！
    やっぱり、私たちは出会う運命だったんです…うふふふ。
c582_Reinforce_1:
  en: Hehe, good... Now we can stay together a little longer...
  ko: 흐흐, 좋아… 이걸로 좀 더 오래 함께할 수 있어….
  ja: ふふ…これでずっと一緒にいられる…
c582_Reinforce_2:
  en: Hehehe... Does this mean I don't have to worry about being abandoned anymore?
  ko: 으흐흐… 이제 버림받을 걱정은 하지 않아도 되는 걸까요?
  ja: うふふ…これで捨てられる心配はしなくていいですよね？
c582_Reinforce_3:
  en: |-
    You're treating me so well...
    Does that mean you want to be with me forever...? Hehehe...
  ko: |-
    이렇게 챙겨주신다는 건…
    레이블과 평생을 함께하고 싶다는 의미…? 으흐흐….
  ja: |-
    こんなに気遣ってくれるということは…
    レーベルと一生を共にしたいということ…？ぐふふ…
c582_Gift_1:
  en: I-if you keep this up... I might start getting the wrong idea...
  ko: 계, 계속 이러시면… 저 오해해 버려요…?
  ja: こ、このままだと…勘違いしちゃいますよ…？
c582_Gift_2:
  en: Hehehe... I'll cherish the gift you gave me... Forever...
  ko: 흐흐흐… 당신이 준 선물… 소중히 간직할게요. 영원히….
  ja: ふふふ…あなたからのプレゼント…大切にしますね。永遠に…
c582_Gift_3:
  en: |-
    *Sniff sniff* Ohh, this smells just like you...
    If I sleep with it by my side... it'll feel like I'm sleeping next to you! Hehe...
  ko: |-
    킁킁… 아아… 이건 당신의 냄새…
    옆에 두고 자면… 당신과 자는 느낌이 나지 않을까요...? 으흐흐.
  ja: |-
    クンクン…ああ…これはあなたの匂い…隣に置いて寝たら…
    あなたに添い寝してもらってる気分になるのでは…？ぐふふ。
c582_Attractive_Up_1:
  en: Ahh... I could die happy today...
  ko: |-
    아아… 이 레이블,
    오늘부로 숨이 멎어버려도 좋아요….
  ja: |-
    ああ…このレーベル…
    今日、死んでもかまいません…
c582_Attractive_Up_2:
  en: I'll say it as many times as you want. I like you. I like you, I like you, I
    like you, I like you, I like you...
  ko: |-
    몇 번이라도 말해 드릴게요… 좋아해요.
    좋아해요좋아해요좋아해요좋아해요좋아해요….
  ja: |-
    何度でもお伝えします…好きです。
    好きです好きです好きです好きです好きです…
c582_Attractive_Up_3:
  en: For you, I'd give everything... My time, my money, even my entire life...
  ko: |-
    당신이라면 모든 걸 드릴 수 있어요…
    시간이든 돈이든 제 인생까지도 전부….
  ja: |-
    あなたになら、何でも差し上げます…
    時間、お金、私の人生…すべて…
c582_Party_Deploy_1:
  en: |-
    H-have you guys ever kissed? Well, I have...
    I-in my imagination, of course... Hehehe...
  ko: |-
    호, 혹시 다들 키스는 해보셨는지… 저는 해봤거든요…
    물론 상상이지만… 으흐흐.
  ja: |-
    み、みなさんキスの経験は…？私はありますよ…
    もちろん想像ですけど…ぐふふ。
c582_Field_Touch_1:
  en: Wh-what's the matter...? Did I do something wrong...?
  ko: 왜, 왜 그러시나요…? 제가 무슨 실수를…?
  ja: ど、どうかしました…？私、何かやっちゃいました…？
c582_Field_Go_1:
  en: I-I don't want to... But if that's what you want...
  ko: 시, 싫지만… 당신이 원한다면….
  ja: い、嫌ですけど…あなたが望むなら…
c582_Battle_Enter_1:
  en: Can someone like me really be of help...?
  ko: 과연 저 같은 게 도움이 될 수 있을지….
  ja: 私なんかが役に立てるんでしょうか…
c582_Battle_Ready_1:
  en: I have to show my best side...
  ko: 멋진 모습을 보여줘야만 해….
  ja: いいところを見せないと…
c582_Battle_Ready_2:
  en: If I win this battle... then I'm yours... Hehehe...
  ko: 이번 전투를 무사히 끝내면 당신에게… 으흐흐….
  ja: 戦闘が無事に終わったら…ぐふふ…
c582_Battle_Ready_3:
  en: Hehehe... Keep your eyes on me, all right?
  ko: 으흐흐… 잘 지켜봐 주셔야 해요…?
  ja: ちゃんと見ていてくださいね…？
c582_Reload_1:
  en: Reload, reload, reload...
  ko: 장전장전장전….
  ja: 装填装填装填…
c582_Reload_2:
  en: C-come on, reload...
  ko: 자, 장전 좀….
  ja: そ、装填を…
c582_Reload_3:
  en: I-I'll be quick. Just don't call me useless...
  ko: 빠, 빨리할 테니까 쓸모없다는 말만은….
  ja: す、すぐやるから「役立たず」って言わないで…
c582_Ult_Skill_Ready_1:
  en: I'll do anything you command...!
  ko: 당신의 명령이라면 무엇이든…!
  ja: あなたのご命令とあらば、何だって…！
c582_Ult_Skill_1:
  en: Ahh, yes... We were meant to be together...!
  ko: 아아… 그래. 우린 맺어질 운명이었던 거야…!
  ja: 私たち、結ばれる運命だったんだ…！
c582_FullBurst_1:
  en: I'll handle everything that bothers you...!
  ko: 당신을 귀찮게 하는 것들은 전부…!
  ja: あなたを煩わせるものは、すべて…！
c582_Kill_Monster_1:
  en: "... Die."
  ko: "…죽어줘."
  ja: "…消えて。"
c582_Kill_Monster_2:
  en: Hehehe... G-gotcha.
  ko: 흐흐흐… 자, 잡았다.
  ja: ふふふ…た、倒した。
c582_Kill_Monster_3:
  en: Get out of my way...
  ko: 방해하지 마….
  ja: 邪魔しないで…
c582_Damage_1:
  en: This is the worst...
  ko: 아아, 최악….
  ja: 最悪…
c582_Damage_2:
  en: I don't like this...
  ko: 기분 나빠….
  ja: 気に入らない…
c582_Damage_3:
  en: Why...?
  ko: 어째서…?
  ja: どうして…？
c582_Die_1:
  en: I'm sorry, I'm sorry, I'm sorry, I'm sorry for being useless...
  ko: 죄송합니다죄송합니다죄송합니다쓸모없어서 죄송합니다….
  ja: すみませんすみませんすみません役立たずですみません…
c582_Win_1:
  en: Now that every enemy standing between us is gone... does this mean we can finally
    hold our wedding...? Hehehe.
  ko: |-
    당신과 저를 방해하는 적은 다 사라졌으니…
    이제 결혼식을 올리면 되려나요…? 으흐흐.
  ja: |-
    私たちを邪魔する敵は消えたので…
    あとは結婚式を挙げるだけですね…？うふふ。
c582_01_Lobby_Touch_1:
  en: D-does this costume look weird...? I should've just stuck to what I usually
    wear...
  ko: |-
    이, 이차림… 많이 이상한가요…?
    역시 평소대로 입을 걸 그랬나 봐요….
  ja: |-
    こ、この格好…やっぱりヘンですか…？
    いつもと同じ服にすればよかった…
c582_01_Lobby_Touch_2:
  en: E-eek...! I didn't realize the price tag was still attached... I only bought
    this costume recently...
  ko: |-
    히, 히익…! 가, 가격표가 아직 붙어 있었나요…?
    새로 산 코스프레 의상이라서….
  ja: |-
    ひ、ひいっ…！ね、値札が付いてました…？
    買ったばかりのコスプレ衣装なので…
c582_01_Lobby_Touch_3:
  en: I-I wanted to try out the love ritual I read about in this book... so I got
    myself this costume and a few things to go with it...
  ko: |-
    채, 책에 나온 사랑의 의식을 따라 해 보고 싶어서….
    의상이랑 소품을 하나씩 모아봤어요….
  ja: |-
    ほ、本で読んだ愛の儀式をやってみたくて…
    衣装と小物をそろえてみました…
c582_01_Lobby_Touch_Love_1:
  en: I-I'll exorcise everything that's possessing you... whether it's evil spirits,
    or... other women... Hehehe...
  ko: |-
    다, 당신에게 붙은 건 전부 제가 떼어낼게요….
    악령도… 다른 여자도… 흐흐흐….
  ja: |-
    あ、あなたについているものは私が全部引きはがしてあげます…
    悪霊も…他の女も…ふふふ…
c582_01_Lobby_Touch_Love_2:
  en: A-according to the book, we must kiss at the end of the ritual... th-though
    I was the one who wrote that part, hehe...
  ko: |-
    채, 책에는 의식의 마지막에 입맞춤을 하라고 적혀 있었어요….
    무, 물론 제가 덧붙였지만요… 흐흐.
  ja: |-
    儀式の最後はキスをしろと本に書いてありました…
    ま、まあ…私が書き足したんですけどね…ふふ。
c582_01_Lobby_Touch_Love_3:
  en: Wh-what do you think...? I tried to dress in a way I thought you'd like... P-please
    tell me what you want to see me wear next time...
  ko: |-
    어, 어때요…? 당신의 취향을 생각하면서 꾸며 봤는데….
    다음에는 어떤 모습이 보고 싶은지도 알려주세요….
  ja: |-
    ど、どうですか…？
    あなたの好みを考えてオシャレをしてみたんですが…
    次はどんな格好が見たいか教えてください…
c582_01_Lobby_Stay_1:
  en: I-I guess you don't want to see me wearing something like this after all...
    I'll just go over to that corner and put all this stuff away...
  ko: |-
    여, 역시 이런 차림의 저는 보고 싶지 않으신 거겠죠….
    구석에서 소품이나 정리하고 있을게요….
  ja: |-
    や、やっぱり私のこんな格好、見たくもないですよね…
    隅で小物の整理でもしています…
c582_01_Lobby_Stay_Love_1:
  en: I'll wait for you to come back. And in the meantime, I'll prepare a ritual just
    for the two of us.
  ko: |-
    다, 당신이 돌아오실 때까지 기다릴게요….
    우리 둘만의 의식을 준비해 둘 테니까요… 으흐흐.
  ja: |-
    あ、あなたが戻ってくるまで待っています…
    私たち二人だけの儀式の準備をしていますね…ぐふふ。
c582_01_Outpost_Touch_1:
  en: I-I was looking for a quiet place... I tried setting out the candles and red
    string somewhere else, but everyone started looking at me all weird...
  ko: |-
    조, 조용한 곳을 찾고 있었어요….
    촛불이랑 붉은 실을 펼쳐 놓으면 다들 이상하게 쳐다봐서….
  ja: |-
    し、静かな場所を探していました…
    ロウソクと赤い糸を広げていると、 みんなにヘンな目で見られるので…
c582_01_Outpost_Touch_2:
  en: Wh-why is everyone avoiding me...? I'm just cosplaying...
  ko: |-
    다, 다들 왜 저를 피하는 걸까요…?
    그냥 코스프레를 한 것뿐인데….
  ja: |-
    ど、どうしてみんな私を 避けるんでしょうか…？
    ただのコスプレなのに…
c582_01_Outpost_Touch_3:
  en: D-do you know of any stores around here that sell occult items...?
  ko: 호, 혹시 오컬트 소품 파는 곳이 어디 있는지 아시나요…?
  ja: あ、あの…オカルトグッズって どこに売っているか ご存じですか…？
c582_01_Gacha_Get_1:
  en: I-I've prepared everything we need for our ritual of love... Now let's begin,
    just the two of us... hehehe.
  ko: |-
    다, 당신과 함께할 사랑의 의식에 필요한 건 전부 준비했어요….
    이제 둘이서 시작해 봐요… 으흐흐.
  ja: |-
    あ、あなたとの愛の儀式に必要な物はすべて準備できています…
    さあ、二人で始めましょう…ぐふふ。
c582_01_Reinforce_1:
  en: Now that I'm all prepared... there's no way the ritual of love could fail, right...?
  ko: 이 정도로 준비했으니… 사랑의 의식이 실패할 리가 없겠죠…?
  ja: これだけ準備すれば…失敗することはないですよね…？
c582_01_Reinforce_2:
  en: If I keep getting stronger like this... soon enough, no one will be able to
    take me away from your side... Hehe.
  ko: |-
    이렇게 계속 강해지면….
    언젠가는 당신 곁에서 아무도 저를 떼어놓지 못하겠죠… 흐흐.
  ja: |-
    こうやって強くなり続ければ…
    いつかは誰も私をあなたから引き離せなくなるでしょう？…ふふ。
c582_01_Reinforce_3:
  en: Every time you help me like this... I feel like we grow closer... Hehehe...
  ko: |-
    이렇게 하나씩 채워주실 때마다….
    당신과의 거리가 가까워지는 기분이에요… 흐흐흐….
  ja: |-
    こうやってくださるたびに…
    あなたとの距離が近くなる気がします…ふふふ…
c582_01_Gift_1:
  en: Y-you're giving this to me...? I don't deserve it, but... I'll never lose it...
  ko: |-
    저, 저 같은 것에게 이런 걸 챙겨주시다니….
    이 선물은 절대 잃어버리지 않을게요….
  ja: |-
    わ、私なんかにこんなものを…
    このプレゼント、絶対に大切にします…
c582_01_Gift_2:
  en: You really don't mind that I like these things...? Th-then I'll never hide it
    from you...
  ko: |-
    제 취향을 싫어하지 않으신다는 뜻이죠…?
    그, 그럼 앞으로도 숨기지 않을게요….
  ja: |-
    私の好みも、嫌いじゃないってことですよね…
    そ、それならこれからも隠さないようにしますね…
c582_01_Gift_3:
  en: How did you know I'd like this...? H-have you been watching me all this time...?
    Hehehe...
  ko: |-
    제가 좋아할 거라는 걸 어떻게 아신 거예요…?
    호, 혹시 평소에도 저를 계속 지켜보고 계셨던 건가요…? 으흐흐….
  ja: |-
    私が喜ぶってどうして分かったんですか…？
    も、もしかしていつも私のことを…？うふふ…
c582_01_Attractive_Up_1:
  en: Would you mind if I lit another candle...? I-I'd like to celebrate how much
    closer we've gotten today...
  ko: |-
    초를 하나 더 켜도 될까요…?
    다, 당신과 가까워진 오늘을 기념하고 싶어서요….
  ja: |-
    ロウソクをもうひとつ灯してもいいですか…？
    あ、あなたに近づけた今日という日を記念して…
c582_01_Attractive_Up_2:
  en: I like you, I like you, I like you, I like you so much... Th-this isn't a spell.
    It's just how I feel...
  ko: |-
    좋아해요좋아해요좋아해요정말좋아해요…
    이, 이건 주문이 아니라… 진심이에요….
  ja: |-
    好きです好きです好きです大好きです…
    じゅ、呪文ではなく…本音です…
c582_01_Attractive_Up_3:
  en: I-I read in the book that our feelings will become mutual if we stare into each
    other's eyes for long enough... So please, keep looking at me just a little longer...
    Hehehe...
  ko: |-
    책에는 오래 눈을 마주치면 마음이 통한다고 적혀 있었어요….
    그러니까 조금만 더… 저를 보고 있어 주세요… 으흐흐….
  ja: |-
    長く見つめ合えば心が通じるって本に書いてありました…
    だから、もう少し…私を見ていてください…うふふ…
c582_01_Party_Deploy_1:
  en: Y-you're really bringing me along...?
  ko: 저, 저도 데려가 주시는 건가요…?
  ja: わ、私も連れていってくれるんですか…？
c582_01_Field_Touch_1:
  en: T-touching me is... a sign of affection, right?
  ko: 저, 저를 만지셨다는 건… 호감의 징조겠죠?
  ja: わ、私を触ったのは…好意の表れですよね？
c582_01_Field_Go_1:
  en: I-I don't need my red string... I'll follow you, and only you, hehehe...
  ko: 부, 붉은 실은 필요 없어요… 당신만 따라갈 테니까요… 으흐흐….
  ja: |-
    あ、赤い糸なんて必要ありません…
    あなたについていきますから…うふふ…
c582_01_Battle_Enter_1:
  en: E-evil spirits, begone! Th-that's what the book says to say...
  ko: 나, 나쁜 것들은 물러가라! 그, 그냥 책에서 본 대로 해봤어요….
  ja: あ、悪霊退散！…ほ、本のマネをしてみました…
c582_01_Battle_Ready_1:
  en: I won't let anything possess you...!
  ko: 당신에게 붙는 건 다 쫓아낼게요…!
  ja: あなたについているものは、すべてはらいます…！
c582_01_Battle_Ready_2:
  en: I-I'll fight for you... Hehehe.
  ko: 사, 상대해 드릴게요… 으흐흐.
  ja: お、お相手しましょう…うふふ…
c582_01_Battle_Ready_3:
  en: S-stop getting in our way...
  ko: 바, 방해꾼이 많네요….
  ja: じゃ、邪魔が多いですね…
c582_01_Reload_1:
  en: I-I can't make any mistakes...
  ko: 시, 실수하면 안 돼….
  ja: し、失敗しちゃダメ…
c582_01_Reload_2:
  en: I-I'm just catching my breath...!
  ko: 수, 숨 좀 돌릴게요…!
  ja: す、少し休みます…！
c582_01_Reload_3:
  en: S-stay calm...!
  ko: 조, 좀 더 차분하게…!
  ja: も、もっと落ち着いて…！
c582_01_Ult_Skill_Ready_1:
  en: M-my turn now... Hehehe.
  ko: 이, 이제 제 차례네요… 으흐흐.
  ja: こ、今度は私の番ですね…うふふ。
c582_01_Ult_Skill_1:
  en: L-let us begin our ritual of love...!
  ko: 사, 사랑의 의식을 시작할게요…!
  ja: あ、愛の儀式を始めます…！
c582_01_FullBurst_1:
  en: I-I'll get rid of anything standing in our way...!
  ko: 바, 방해꾼을 전부 없앨게요…!
  ja: じゃ、邪魔者はすべて消し去ります…！
c582_01_Kill_Monster_1:
  en: Hehehe... Got one.
  ko: 으흐흐… 쓰러졌네요.
  ja: うふふ…やりましたね。
c582_01_Kill_Monster_2:
  en: I-I did it...!
  ko: 제, 제대로 처리했어요…!
  ja: き、きれいに片づけました…！
c582_01_Kill_Monster_3:
  en: Phew... One less obstacle...!
  ko: 후우... 바, 방해꾼 하나 끝...!
  ja: ふう…じゃ、邪魔者排除完了…！
c582_01_Damage_1:
  en: Ugh...!
  ko: 읏…!
  ja: うっ…！
c582_01_Damage_2:
  en: Urgh...!
  ko: 아윽…!
  ja: ううっ…！
c582_01_Damage_3:
  en: "... Eek!"
  ko: "…히익!"
  ja: "…ひいっ！"
c582_01_Die_1:
  en: I-I must pause the ritual... I'll leave the rest to you...
  ko: 의, 의식을 중단할게요… 뒤를 부탁해요….
  ja: ぎ、儀式は中断です…あとはお願いします…
c582_01_Win_1:
  en: Now that nothing's in our way... let's go get ready for the ritual of love...
    Hehehe...
  ko: |-
    방해꾼도 전부 사라졌네요…
    그럼 이제… 사랑의 의식을 준비하러 가요… 으흐흐….
  ja: |-
    邪魔者はすべて消えましたね…
    では…愛の儀式の準備をしましょう…うふふ…
