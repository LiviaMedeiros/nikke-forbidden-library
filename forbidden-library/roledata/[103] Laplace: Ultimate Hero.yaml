103_name:
  en: 'Laplace: Ultimate Hero'
  ko: '라플라스 : 얼티밋 히어로'
  ja: ラプラス：アルティメットヒーロー
c103_description:
  en: A true hero who's been reborn using the full might of Missilis's technology.
    Should you ever find yourself in a crisis, you needn't worry; wherever help is
    needed, that's where she'll be.
  ko: |-
    미실리스의 기술력을 총동원해 다시 태어난 진정한 히어로.
    만일 위기에 빠지더라도 걱정할 필요는 없다.
    도움이 필요한 곳이라면, 그녀는 반드시 나타날 테니까.
  ja: |-
    ミシリスの技術力を総動員して生まれ変わった真のヒーロー。
    ピンチに陥ったとしても何も案ずることはない。
    助けを必要としている場所には、彼女が必ず現れるのだから。
