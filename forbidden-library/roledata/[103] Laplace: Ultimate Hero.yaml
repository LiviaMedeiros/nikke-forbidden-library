c103_Lobby_Touch_1:
  en: This pounding in my chest... This is the new hero power of Matis!
  ko: 가슴의 두근거림… 이것이 새로운 메티스의 히어로 파워다!
  ja: この胸の高鳴り…これが新しいメティスのヒーローパワーだ！
c103_Lobby_Touch_2:
  en: I think I can take down even more villains now! I'd like to hear what you think
    too, Birdie!
  ko: |-
    이제 더 많은 악당을 쓰러트릴 수 있을 것 같은데,
    버드 보이의 생각도 듣고 싶다!
  ja: |-
    悪党をもっとたくさん倒せるようになった気がする。
    バードボーイの考えも聞かせてくれ！
c103_Lobby_Touch_3:
  en: As long as you're by my side, there's nothing to fear.
  ko: 버드 보이, 너와 함께라면 두려울 것이 없다.
  ja: バードボーイ、君と一緒なら何も怖くない。
c103_Lobby_Touch_Love_1:
  en: Watch closely, Birdie! You're about to see what a real hero looks like!
  ko: 버드 보이! 진정한 히어로의 모습, 잘 봐 둬라!
  ja: |-
    バードボーイ！
    真のヒーローの姿をよく見てくれ！
c103_Lobby_Touch_Love_2:
  en: Thanks to your faith in me, I've become even stronger.
  ko: 네가 믿어 준 덕분에, 나는 더 강해졌다.
  ja: |-
    君が信じてくれたおかげで、
    私はさらに強くなった。
c103_Lobby_Touch_Love_3:
  en: Head up! Point your finger at the sky! Yes, that's it! That's the pose of a
    true hero! Hahaha!
  ko: |-
    고개를 들어 하늘을 향해 손가락을 뻗어보는 거다!
    그래, 그게 히어로 자세다! 하하하!
  ja: |-
    顔を上げ、空に向かって手を伸ばせ！
    そう！それがヒーローのポーズだ！ははは！
c103_Lobby_Stay_1:
  en: I'm bursting with energy! I'm itching to do something!
  ko: 힘이 넘치는데, 아무것도 안 하니까 몸이 근질거린다!
  ja: |-
    力はあり余っているのに、何もすることがない。
    体がムズムズする！
c103_Lobby_Stay_Love_1:
  en: There's no point in me going out there alone... I'll be waiting for you to come
    back, Birdie!
  ko: |-
    나 혼자 출동하는 건 의미가 없지만….
    버드 보이, 네가 돌아오길 기다리고 있겠다!
  ja: |-
    私一人で出動しても意味がない…
    バードボーイ、君が戻ってくるのを待っている！
c103_Outpost_Touch_1:
  en: This peaceful sight means more to me now than ever before!
  ko: 이 평화로운 풍경이, 예전보다 가슴에 더 새겨지는 느낌이다!
  ja: この平和な光景が、 前より心に響くな！
c103_Outpost_Touch_2:
  en: I can feel the vibrations from the armory all the way to my fingertips! My senses
    are much sharper now!
  ko: |-
    무기고에서 나는 진동이 손끝까지 뚜렷하게 느껴진다!
    지금의 나는 감각이 더 예민해진 것 같다!
  ja: |-
    武器庫の振動が、 指先まではっきりと伝わってくる！
    感覚がもっと鋭くなったようだ！
c103_Outpost_Touch_3:
  en: Maxwell's hammer sounds mightier than ever! I won't be outdone!
  ko: 맥스웰의 망치 소리가 더 우렁차졌군! 좋다, 나도 질 수 없지!
  ja: |-
    マクスウェルのハンマーの音が さらに力強くなったな！
    私も負けてはいられない！
c103_Gacha_Get_1:
  en: Laplace, the ultimate hero! I've come to light the way!
  ko: 얼티밋 히어로, 라플라스! 한 줄기 빛이 되기 위해 이곳에 왔다!
  ja: |-
    アルティメットヒーロー、ラプラス！
    みんなを照らすため、ここに参上！
c103_Reinforce_1:
  en: Magnificent. This is the true power of a hero.
  ko: 음, 훌륭하다. 이것이 진정한 히어로의 힘이지.
  ja: おお、すごい。これが真のヒーローの力だ。
c103_Reinforce_2:
  en: Haha! I've surpassed yesterday's me once again!
  ko: 오오! 어제의 나를 또 한 번 뛰어넘었군!
  ja: おお！昨日の私をまたひとつ超えたな！
c103_Reinforce_3:
  en: Well done, Birdie! I swear I'll never use this power in vain!
  ko: 잘했다, 버드 보이! 이 힘, 결코 헛되이 쓰지 않겠다!
  ja: |-
    よくやった、バードボーイ！
    この力、決して無駄にはしない！
c103_Gift_1:
  en: You got this for me?! Even a true hero can't help but be touched!
  ko: 이런 걸 나에게…! 진정한 히어로도 감동할 수밖에 없군.
  ja: これを私に…？真のヒーローでも感動だ。
c103_Gift_2:
  en: Getting a gift from you makes me just as happy as powering up!
  ko: |-
    버드 보이에게 선물을 받는 건,
    내 힘이 더욱 강해졌을 때만큼이나 기쁘다!
  ja: |-
    バードボーイからプレゼントをもらうのは、
    力がもっと強くなった時と同じくらいうれしい！
c103_Gift_3:
  en: Birdie, thanks for sticking with me, even after I've changed!
  ko: 버드 보이! 새로워진 나에게도 변함없는 마음, 정말 고맙다!
  ja: バードボーイ！新しくなった私も変わらず気にかけてくれて、本当に感謝する！
c103_Attractive_Up_1:
  en: Your trust is what made me a true hero.
  ko: 버드 보이의 신뢰가, 나를 진정한 히어로로 만들었다.
  ja: バードボーイの信頼が、私を真のヒーローにしたんだ。
c103_Attractive_Up_2:
  en: You're so reliable, Birdie! I'm counting on you from here on out!
  ko: |-
    정말 의지가 된다, 버드 보이!
    앞으로도 잘 부탁한다!
  ja: |-
    本当に頼りになるな、バードボーイ！
    これからもよろしく頼む！
c103_Attractive_Up_3:
  en: It's always fun being with you, Birdie! It always has been, and it always will
    be!
  ko: |-
    버드 보이와 함께 있으면 늘 즐겁다.
    지금까지도, 그리고 앞으로도 계속 말이다!
  ja: |-
    バードボーイと一緒にいるといつも楽しい！
    今までも、これからもずっとだ！
c103_Party_Deploy_1:
  en: Ultimate Hero Laplace, engage!
  ko: 얼티밋 히어로 라플라스, 출격한다!
  ja: アルティメットヒーローラプラス、出撃だ！
c103_Field_Touch_1:
  en: You called, Birdie?
  ko: 불렀나, 버드 보이!
  ja: 呼んだか、バードボーイ！
c103_Field_Go_1:
  en: I'll show you the way of a true hero!
  ko: 진정한 히어로의 걸음을 보여주겠다!
  ja: 真のヒーローの歩みを見せてやる！
c103_Battle_Enter_1:
  en: Let the battle begin!
  ko: 전투 개시다!
  ja: 戦闘開始だ！
c103_Battle_Ready_1:
  en: Fear not, for the true hero is here!
  ko: 두려워 마라, 여기 진정한 히어로가 있다.
  ja: 恐れるな。ここに真のヒーローがいる。
c103_Battle_Ready_2:
  en: No villain can stop me!
  ko: 그 어떤 악당도 나를 막을 수는 없다!
  ja: どんな悪党だろうと、私を止めることはできない！
c103_Battle_Ready_3:
  en: Time to put my new heroic powers to the test!
  ko: 히어로의 새로운 힘을 시험할 수 있겠군!
  ja: ヒーローの新たな力を試す時だ！
c103_Reload_1:
  en: Just you wait! I'll be back after I recharge!
  ko: 기다려라, 악당 놈들! 충전 후 다시 간다!
  ja: |-
    待っていろ、悪党ども！
    チャージしたらすぐに行く！
c103_Reload_2:
  en: Ultimate Hero Power, recharging!
  ko: 얼티밋 히어로 파워, 재충전!
  ja: アルティメットヒーローパワー、再チャージ！
c103_Reload_3:
  en: You're tough, I'll give you that. But I'm not losing!
  ko: 끈질긴 녀석들이군. 하지만 지지 않는다!
  ja: しつこい奴らだ。しかし、負けはしない！
c103_Ult_Skill_Ready_1:
  en: Birdie, now!
  ko: 버드 보이, 지금이다!
  ja: バードボーイ、今だ！
c103_Ult_Skill_1:
  en: Mjolnir, smite!
  ko: 묠니르, 스마이트--!!
  ja: ミョルニル、スマイト！！
c103_FullBurst_1:
  en: It's time to take down the villains!
  ko: 바로 지금이 악당들을 쓰러트릴 때다!
  ja: 今だ！悪党どもをやっつけろ！
c103_Kill_Monster_1:
  en: Evil has been vanquished!
  ko: 악당을 무찔렀다!
  ja: 悪党を倒したぞ！
c103_Kill_Monster_2:
  en: The fight isn't over!
  ko: 아직 적이 남았군.
  ja: まだ敵が残っているな。
c103_Kill_Monster_3:
  en: I won't stop now!
  ko: 여기서 멈추지 않는다!
  ja: こんなところで止まらない！
c103_Damage_1:
  en: Ugh.
  ko: 윽.
  ja: うっ…
c103_Damage_2:
  en: Nngh.
  ko: 으읏.
  ja: ううっ。
c103_Damage_3:
  en: Oof.
  ko: 큿.
  ja: くっ。
c103_Die_1:
  en: Sorry, Birdie. Looks like my hero power just wasn't enough...
  ko: 미안하다, 버드 보이. 히어로 파워가 부족했던 것 같다….
  ja: |-
    すまない、バードボーイ。
    ヒーローパワーが足りなかったようだ…
c103_Win_1:
  en: Where there's a hero, victory is sure to follow! Hahaha!
  ko: 히어로가 있는 곳에 승리가 있는 법이다! 하하하!
  ja: ヒーローのいるところに勝利あり！ハッハッハ！
c103_01_Lobby_Touch_1:
  en: Nice to meet you! I'm Laplace, the hero of tomorrow!
  ko: 반갑다! 나는 미래에 히어로가 될, 라플라스라고 한다!
  ja: |-
    会えて嬉しい！
    私は未来のヒーロー、ラプラスだ！
c103_01_Lobby_Touch_2:
  en: My body used to be weak, but not anymore!
  ko: |-
    예전에 내 몸은 약했다.
    그러나, 이제 더는 약하지 않다!
  ja: |-
    私の体は弱かった。
    しかし、もう弱くはない！
c103_01_Lobby_Touch_3:
  en: I'll face every hardship head-on! I'll scale every wall in my way! And if I
    get knocked down, I'll just get right back up!
  ko: |-
    고난이 오면 맞선다! 벽이 있으면 넘는다!
    쓰러지면 다시 일어나면 된다!
  ja: |-
    困難には立ち向かう！壁があれば乗り越える！
    倒れても、また立ち上がればいい！
c103_01_Lobby_Touch_Love_1:
  en: I will become a hero. This isn't just a dream. It's the future I've chosen for
    myself!
  ko: |-
    나는 반드시 히어로가 될 것이다.
    이건 꿈이 아니다. 내가 정한 미래다!
  ja: |-
    私は必ずヒーローになってみせる。
    これは夢ではない。私が決めた未来だ！
c103_01_Lobby_Touch_Love_2:
  en: I believe in myself! And I believe in Syuen because she believes in me!
  ko: |-
    나는 나를 믿는다.
    그리고 나를 믿는 슈엔을 믿는다!
  ja: |-
    私は私を信じている。
    そして私を信じてくれるシュエンを信じている！
c103_01_Lobby_Touch_Love_3:
  en: Give up? Not a chance! "Giving up" isn't in my dictionary!
  ko: |-
    포기? 걱정 마라!
    내 사전에 포기란 없다!
  ja: |-
    諦める？心配するな！
    私の辞書に諦めるという文字はない！
c103_01_Lobby_Stay_1:
  en: I'm terrible at sitting around waiting! How much longer do I have to wait?
  ko: 가만히 기다리는 건 자신 없다! 언제까지 기다리면 되지?
  ja: |-
    じっと待っているのは苦手だ！
    いつまで待てばいい？
c103_01_Lobby_Stay_Love_1:
  en: If I want to be a hero, I've gotta pass a grueling test first! I'll keep training
    until then, so hurry back!
  ko: |-
    히어로가 되려면 난이도 높은 테스트를 거쳐야 한다!
    단련하고 있을 테니 다녀와라!
  ja: |-
    ヒーローになるために、難しいテストをクリアしなければならない！
    私はここで鍛えているから、行ってこい！
c103_01_Outpost_Touch_1:
  en: Now, where's Syuen? Oh, I think she went that way!
  ko: |-
    슈엔이 있는 곳은 어디지?
    아, 저쪽이었던 것 같다!
  ja: |-
    シュエンはどこだ？
    あっ、あっちだ！
c103_01_Outpost_Touch_2:
  en: Just wait a little longer! I'll become a hero and keep this place safe!
  ko: |-
    조금만 기다려라!
    히어로가 되어 이곳의 평화를 지켜주겠다!
  ja: |-
    少し待っていてくれ！
    ヒーローになって、私がここの平和を守る！
c103_01_Outpost_Touch_3:
  en: Need help? Just call on me!
  ko: |-
    도움이 필요한가?
    언제든 나를 불러라!
  ja: |-
    助けが必要か？
    いつでも呼んでくれ！
c103_01_Gacha_Get_1:
  en: I'm Laplace! I may have been weak once, but I will become the strongest hero
    ever!
  ko: |-
    내 이름은 라플라스!
    약했던 과거를 딛고, 최강의 히어로가 될 자다!
  ja: |-
    私の名前はラプラス！
    弱かった過去の自分を乗り越え、最強のヒーローになる者だ！
c103_01_Reinforce_1:
  en: Whoa! My body feels so much lighter!
  ko: 오오, 몸이 가벼워지고 있다!
  ja: おお！体が軽くなってきた！
c103_01_Reinforce_2:
  en: So this is what it feels like to get stronger!
  ko: 이것이 강해지는 느낌인가!
  ja: これが強くなるという感覚か！
c103_01_Reinforce_3:
  en: I feel like I'm one step closer to becoming a hero. Thanks!
  ko: 히어로에 한 걸음 더 가까워진 것 같다. 고맙다!
  ja: ヒーローにまた一歩近づいた気がする。感謝する！
c103_01_Gift_1:
  en: Support for a hero-in-training? I'll gladly take it!
  ko: 예비 히어로를 위한 지원인가? 고맙게 받겠다!
  ja: 未来のヒーローへのサポートか？ありがたくいただこう！
c103_01_Gift_2:
  en: I've never received anything like this before. I'm so happy!
  ko: 이런 건 처음 받아보는군. 기쁘다!
  ja: こういうものは初めてもらった。嬉しいぞ！
c103_01_Gift_3:
  en: You really put this together yourself? I'm so touched! I promise I'll become
    a hero and repay you!
  ko: |-
    정말 이걸 직접 준비한 건가? 감동이다!
    꼭 히어로가 되어 보답하겠다!
  ja: |-
    本当に君がこれを用意してくれたのか？感動したぞ！
    必ずヒーローになって恩を返そう！
c103_01_Attractive_Up_1:
  en: I'm counting on you from here on out!
  ko: 앞으로도 잘 부탁한다!
  ja: これからもよろしく頼む！
c103_01_Attractive_Up_2:
  en: Thanks for believing in me! I feel like I can take on anything!
  ko: |-
    믿어줘서 고맙다.
    뭐든 다 해낼 수 있을 것만 같다!
  ja: |-
    信じてくれてありがとう。
    何でもやり遂げられそうだ！
c103_01_Attractive_Up_3:
  en: So this is what happiness feels like! I already feel like a true hero!
  ko: |-
    이게 바로 행복이라는 건가!
    벌써 히어로가 된 기분이다!
  ja: |-
    これが幸せということか！
    もうヒーローになった気分だ！
c103_01_Party_Deploy_1:
  en: Never fear! Your hero's here!
  ko: 걱정 마라! 내가 왔다!
  ja: もう心配いらない！私が来たからな！
c103_01_Field_Touch_1:
  en: I'll protect you no matter what!
  ko: 내가 꼭 지켜주겠다!
  ja: 私が守ってみせる！
c103_01_Field_Go_1:
  en: Someone call for a hero?
  ko: 날 불렀나?
  ja: 私を呼んだか？
c103_01_Battle_Enter_1:
  en: Hero... No, it's time for this hero-in-training to step up!
  ko: |-
    히어로, 아니.
    예비 히어로가 나설 차례군!
  ja: |-
    ヒーロー、いや、
    未来のヒーローの出番だな！
c103_01_Battle_Ready_1:
  en: A hero overcomes hardship and never stops moving forward!
  ko: 고난을 이겨내고 앞으로 나아가는 것이 히어로다!
  ja: 困難に打ち勝ち、前へ進む。それがヒーローだ！
c103_01_Battle_Ready_2:
  en: I'll prove I've got what it takes to be a hero!
  ko: 히어로가 될 자격이 있다는 걸 보여주겠다!
  ja: ヒーローの資格を見せてやる！
c103_01_Battle_Ready_3:
  en: Leave everything to me!
  ko: 나만 믿어라!
  ja: 私を信じろ！
c103_01_Reload_1:
  en: Piece of cake!
  ko: 이 정도는 식은 죽 먹기다!
  ja: こんなの朝飯前だ！
c103_01_Reload_2:
  en: Have no fear! Your hero is here!
  ko: 불안해하지 마라, 내가 있다!
  ja: 不安に思うな、私がいる！
c103_01_Reload_3:
  en: Just a quick breather!
  ko: 잠깐 숨 돌리겠다!
  ja: 少し息を整える！
c103_01_Ult_Skill_Ready_1:
  en: I'm ready!
  ko: 준비됐다!
  ja: 準備できたぞ！
c103_01_Ult_Skill_1:
  en: I'll surpass my limits and become a hero!
  ko: 나는 한계를 넘어 히어로가 된다--!!
  ja: 限界を超え、ヒーローになる！！
c103_01_FullBurst_1:
  en: Give it everything you've got!
  ko: 전력으로 퍼부어라!
  ja: 全力でかかれ！
c103_01_Kill_Monster_1:
  en: Justice delivers the final blow!
  ko: 정의의 일격이다!
  ja: 正義の一撃だ！
c103_01_Kill_Monster_2:
  en: I've gotten stronger!
  ko: 나는 강해졌다!
  ja: 私は強くなった！
c103_01_Kill_Monster_3:
  en: Bring it on!
  ko: 누구든 덤벼라!
  ja: 誰であろうとかかってこい！
c103_01_Damage_1:
  en: Ugh.
  ko: 큭.
  ja: くっ…
c103_01_Damage_2:
  en: Darn.
  ko: 이런.
  ja: おっと…
c103_01_Damage_3:
  en: Argh.
  ko: 윽.
  ja: うっ…
c103_01_Die_1:
  en: I lost... But it's not over yet.
  ko: 졌다… 하지만 끝난 것은 아니다.
  ja: 負けた…だが、終わったわけではない。
c103_01_Win_1:
  en: See that? Justice always prevails!
  ko: 봤나! 정의는 언제나 승리한다!
  ja: 見たか！正義は常に勝つ！
103_cv_ja:
  en: 'CV: Ai Kakuma'
  ko: 'CV : 카쿠마 아이'
  ja: CV：加隈亜衣
103_cv_ko:
  en: 'CV: Kim Ye-rim'
  ko: 'CV : 김예림'
  ja: CV：キム・エリム
103_cv_en:
  en: 'CV: Lauren Landa'
  ko: 'CV : 로런 랜다'
  ja: CV：Lauren Landa
