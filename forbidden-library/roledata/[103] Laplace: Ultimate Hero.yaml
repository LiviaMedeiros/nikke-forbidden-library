    フルチャージダメージ：{full_charge_damage}％のダメージ
    「コアダメージ{core_damage_rate}％」</color>
21032_name:
  en: Over Energy
  ko: 오버 에너지
  ja: オーバーエネルギー
21032_description:
  en: |-
    ■ Activates after performing {description_value_08} normal attacks while in the Electric Power, Fully Full Charge state. Affects self.
    <color=#00AEFF>Over Energy ▲ {description_value_09}% continuously, up to {description_value_01}%.</color>
    ■ Activates when Over Energy reaches {description_value_01}%. <word_group=10100>Resets</word_group> Over Energy and affects self.
    <color=#00AEFF>Advances to the next Over Energy stage. Effects vary for each stage of Over Energy. <word_group=10028>Each subsequent effect triggers all effects before it</word_group>:
    Stage 1: Max HP ▲ {description_value_02}% continuously.
    Stage 2: Max HP ▲ {description_value_03}% continuously.
    Stage 3: Max HP ▲ {description_value_04}% continuously.
    Stage 4: Max HP ▲ {description_value_05}% continuously.</color>
    ■ Activates when entering Burst Stage 3. Affects self.
    <color=#00AEFF>Attack Damage ▲ {description_value_06}% for {description_value_07} sec.</color>
  ko: |-
    ■ 일반 공격 {description_value_08}회 공격 시 자신이 일렉트릭 파워 풀 풀 차지 상태라면 자신에게
    <color=#00AEFF>[오버 에너지 {description_value_09}% ▲] [최대 {description_value_01}%] [지속]</color>
    ■ 자신이 오버 에너지 {description_value_01}% 도달 시 <word_group=10100>초기화</word_group> 후 자신에게
    <color=#00AEFF>[오버 에너지 단계 증가] [오버 에너지 단계 별 효과] [<word_group=10028>하위 효과 중복 적용</word_group>]
    1단계 : [최대 체력만 {description_value_02}% ▲] [지속]
    2단계 : [최대 체력만 {description_value_03}% ▲] [지속]
    3단계 : [최대 체력만 {description_value_04}% ▲] [지속]
    4단계 : [최대 체력만 {description_value_05}% ▲] [지속]</color>
    ■ 버스트 3단계 진입 시 자신에게
    <color=#00AEFF>[공격 대미지 {description_value_06}% ▲] [{description_value_07}초 유지]</color>
  ja: |-
    ■通常攻撃で{description_value_08}回攻撃した時、自分がエレクトリックパワー・フル・フルチャージ状態なら自分に
    <color=#00AEFF>「オーバーエネルギー{description_value_09}％▲」「最大{description_value_01}％」「持続」</color>
    ■自分がオーバーエネルギー{description_value_01}％状態になった時、
    <word_group=10100>初期化</word_group>した後、自分に
    <color=#00AEFF>「オーバーエネルギーの段階増加」「オーバーエネルギーの段階別の効果」「<word_group=10028>下位効果のスタック適用</word_group>」
    1段階：「最大HPのみ{description_value_02}％▲」「持続」
    2段階：「最大HPのみ{description_value_03}％▲」「持続」
    3段階：「最大HPのみ{description_value_04}％▲」「持続」
    4段階：「最大HPのみ{description_value_05}％▲」「持続」</color>
    ■バースト3段階突入時、自分に<color=#00AEFF>「攻撃ダメージ{description_value_06}％▲」「{description_value_07}秒間維持」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
21031_name:
  en: Electric Power, Fully Full Charge!
  ko: 일렉트릭 파워 풀 풀 차지
  ja: エレクトリックパワー、フル・フルチャージ！！
21031_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>ATK ▲ {description_value_01}% of the skill user's <word_group=10025>final</word_group> max HP continuously.</color>
    ■ Activates when performing a Full Charge attack. Affects self.
    <color=#00AEFF>Warm Up: Charge Speed ▲ {description_value_02}% continuously. Stacks up to {description_value_03} times.</color>
    ■ Activates when Warm Up is at max stacks. Removes stacks and affects self.
    <color=#00AEFF>Changes the weapon in use: Electric Power, Fully Full Charge
    Damage: {description_value_05}% of <word_group=10025>final</word_group> ATK
    Max Ammunition Capacity: {description_value_06} (<word_group=10107>max ammunition effects refresh when the weapon in use changes</word_group>)
    <word_group=10097>Deactivation condition</word_group>: When all rounds are fired
    Additional Effect: Gains Pierce</color>
    ■ Activates when Electric Power, Fully Full Charge ends. Affects self.
    <color=#00AEFF>Removes {description_value_07}% of ammo.</color>
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[시전자의 <word_group=10025>최종</word_group> 최대 체력의 {description_value_01}% 만큼 공격력 ▲] [지속]</color>
    ■ 풀 차지 공격 시 자신에게
    <color=#00AEFF>[예열 : 차지 속도 {description_value_02}% ▲] [{description_value_03} 중첩] [지속]</color>
    ■ 자신이 예열 최대 중첩 상태라면 중첩 해제 후 자신에게
    <color=#00AEFF>[사용 무기 변경 : 일렉트릭 파워 풀 풀 차지] :
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_05}% 대미지
    최대 장탄 수 : {description_value_06}발 (<word_group=10107>사용 무기 변경 시 최대 장탄 수 효과 갱신</word_group>)
    <word_group=10097>제거 시점</word_group> : 모든 탄환 발사 시
    추가 효과 : 관통 특화</color>
    ■ 일렉트릭 파워 풀 풀 차지 상태 종료 시 자신에게
    <color=#00AEFF>[탄환 {description_value_07}% 제거]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_01}％分の
    攻撃力▲」「持続」</color>
    ■フルチャージして攻撃した時、自分に
    <color=#00AEFF>「ウォームアップ：チャージ速度{description_value_02}％▲」
    「{description_value_03}スタック」「持続」</color>
    ■自分がウォームアップのフルスタック状態なら
    スタック解除後、自分に
    <color=#00AEFF>「使用武器変更：
    エレクトリックパワー・フル・フルチャージ」
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_05}％のダメージ
    最大装弾数：{description_value_06}発（<word_group=10107>使用武器変更時、最大装弾数に対する効果更新</word_group>）
    <word_group=10097>解除条件</word_group>：全弾消費した時
    追加効果：貫通特化</color>
    ■エレクトリックパワー・フル・フルチャージ状態が終了した時、自分に
    <color=#00AEFF>「残弾数{description_value_07}％減少」</color>
