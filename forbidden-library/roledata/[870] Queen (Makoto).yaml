    「獲得先」：シミュレーションルーム
c870_Lobby_Touch_1:
  en: This world's culture and technology are nothing like ours... I feel like there's
    a lot I can learn.
  ko: |-
    우리 세계와는 문화도 기술도 다른 세계네….
    배울 수 있는 게 많을 것 같아.
  ja: |-
    私たちの世界とは文化も技術も違う世界…
    学べることがたくさんありそうね。
c870_Lobby_Touch_2:
  en: I wonder if Mona's gotten used to this world yet... I'm a bit worried about
    him.
  ko: |-
    모나는 벌써 이 세계에 익숙해졌을까…?
    조금 걱정되네.
  ja: |-
    モナはもうこの世界に慣れたかしら…？
    ちょっと心配だわ。
c870_Lobby_Touch_3:
  en: Not only did I end up in another world, but I got caught up in something big,
    too... Still, I can't let it get me down. I need to do what I can.
  ko: |-
    다른 세계에 오게 된 데다 큰일에도 휘말렸네….
    그래도 기죽고 있을 수는 없어. 할 수 있는 일을 해야지.
  ja: |-
    他の世界に来てしまった上に、大変なことに巻き込まれたわね…
    でも、めげてはいられないわ。できることをやらないと。
c870_Lobby_Touch_Love_1:
  en: I saw someone wearing what looked like a straitjacket earlier... It's amazing
    she can fight in something like that. Maybe I'll talk to her next time I see her.
  ko: |-
    아까 구속복 같은 걸 입은 사람을 봤는데….
    저런 차림으로 싸울 수 있다니 멋지네. 다음에 한번 말을 걸어볼까?
  ja: |-
    さっき、拘束衣のようなものを着た人を見かけたのだけど…
    あの格好で戦えるなんて、格好いいわね。今度話しかけてみようかしら…？
c870_Lobby_Touch_Love_2:
  en: I'm gradually getting used to this world with your help. Thank you.
  ko: |-
    덕분에 이 세계에도 조금씩 익숙해지고 있어.
    고마워.
  ja: |-
    貴方のおかげで、この世界にも慣れてきたわ。
    ありがとう。
c870_Lobby_Touch_Love_3:
  en: There must be a reason we ended up here, such as to help you... or something
    like that.
  ko: |-
    우리가 여기에 오게 된 데에도 분명 이유가 있을 거야.
    예를 들면, 지휘관에게 힘이 되기 위해서… 라든가.
  ja: |-
    私たちがここに来たことには理由があるはず。
    例えば、指揮官の力になるため…とか、ね。
c870_Lobby_Stay_1:
  en: Taking a break? Mind if I go look around the area?
  ko: |-
    휴식 중이야?
    그러면 주변을 좀 둘러보고 와도 될까?
  ja: |-
    休憩中？
    それなら、辺りを見て回ってきてもいいかしら。
c870_Lobby_Stay_Love_1:
  en: Could you show me around the Ark if you have time? There's a lot I want to know.
  ko: |-
    시간이 괜찮다면 방주를 안내해 줄 수 있을까?
    알고 싶은 게 많거든.
  ja: |-
    もし時間があるなら、アークを案内してもらえないかしら。
    知りたいことがたくさんあるの。
c870_Outpost_Touch_1:
  en: I, uh... heard from Helm that there are... g-ghosts in the Outpost... Er, never
    mind! Forget I said anything...!
  ko: |-
    그게… 헬름에게 들었는데….
    전초기지에는 유, 유령이….
    아, 아니! 미안해, 아무것도 아니야…!
  ja: |-
    その…ヘルムに教えてもらったのだけど…
    前哨基地には、ゆ、幽霊が…
    い、いえ！　ごめんなさい、何でもないわ…！
c870_Outpost_Touch_2:
  en: Hmm... How exactly do I get to the Ark from here...?
  ko: |-
    음… 방주에 가려면
    어떻게 하면 되는 걸까…?
  ja: |-
    えっと…アークに行くには、
    どうすればいいのかしら…？
c870_Outpost_Touch_3:
  en: My time here has been good so far thanks to everyone helping me out. Thanks
    for being so kind.
  ko: |-
    다들 도와줘서, 편하게 지내고 있어.
    친절하게 대해줘서 고마워.
  ja: |-
    みんなのおかげで、快適に過ごせているわ。
    親切にしてくれてありがとう。
c870_Gacha_Get_1:
  en: I am Queen, strategist for the Phantom Thieves. I look forward to working with
    you while I'm here.
  ko: |-
    [괴도단의 참모], 퀸이야.
    이곳에 있는 동안 잘 부탁해.
  ja: |-
    『怪盗団の参謀』こと、クイーンよ。
    ここにいる間、よろしくね。
c870_Reinforce_1:
  en: This power... is interesting.
  ko: 이 힘은… 신기하네.
  ja: この力は…不思議ね。
c870_Reinforce_2:
  en: I feel like I've gotten even stronger.
  ko: 한층 강해진 것 같은 기분이 들어.
  ja: さらに強くなった気がするわ。
c870_Reinforce_3:
  en: I'll do all I can to repay you using this strength I've received.
  ko: 받은 이 힘으로 보답할 수 있도록 노력할게.
  ja: 貰ったこの力で恩返しできるよう、頑張るわね。
c870_Gift_1:
  en: Thanks. I'll put this to good use.
  ko: 고마워. 잘 쓸게.
  ja: ありがとう。使わせてもらうわ。
c870_Gift_2:
  en: I really appreciate this.
  ko: 소중히 할게.
  ja: 大事にするわね。
c870_Gift_3:
  en: I'm gonna have to get you something in return.
  ko: 보답을 준비해야겠네.
  ja: お返しを準備しなきゃ。
c870_Attractive_Up_1:
  en: After getting to this world, I never expected to build this kind of trust with
    someone.
  ko: 다른 세계에 와서 이런 신뢰를 쌓게 될 줄은 몰랐어.
  ja: 他の世界に来て、こんなふうに信頼を築くことができるなんて。
c870_Attractive_Up_2:
  en: I promise to live up to your faith in me.
  ko: 응. 믿음에 보답할게.
  ja: うん。信頼に応えるわ。
c870_Attractive_Up_3:
  en: Thank you. You've helped me to enjoy myself even in this unfamiliar world.
  ko: |-
    고마워.
    덕분에 이 세계에 와서도 즐겁게 지내고 있어.
  ja: |-
    ありがとう。
    貴方のおかげで、この世界に来ても楽しいわ。
c870_Party_Deploy_1:
  en: All right, I'm ready.
  ko: 좋아. 준비됐어.
  ja: よし。準備できたわ。
c870_Field_Touch_1:
  en: I'm listening.
  ko: 듣고 있어.
  ja: 聞いているわ。
c870_Field_Go_1:
  en: Let's move out!
  ko: 움직이자.
  ja: 行こう。
c870_Battle_Enter_1:
  en: I can start anytime.
  ko: 언제든 시작할 수 있어.
  ja: いつでも始められるわ。
c870_Battle_Ready_1:
  en: Let's finish this quickly!
  ko: 단숨에 끝내자!
  ja: 一気にカタをつける！
c870_Battle_Ready_2:
  en: My fists have been itching for a fight.
  ko: 주먹이 근질거리네.
  ja: 拳が唸るわね。
c870_Battle_Ready_3:
  en: No holds barred!
  ko: 힘으로 밀어붙일게.
  ja: 力づくでやるわ。
c870_Reload_1:
  en: Reloading!
  ko: 재장전 중이야!
  ja: リロード中よ！
c870_Reload_2:
  en: Cover me!
  ko: 엄호해 줘!
  ja: 援護して！
c870_Reload_3:
  en: Reloading... done!
  ko: 재장전… 완료!
  ja: リロード…完了！
c870_Ult_Skill_Ready_1:
  en: Let's wipe 'em out!
  ko: 먼지 하나도 남기지 않겠어!
  ja: チリ一つ残さない！
c870_Ult_Skill_1:
  en: Charge, Johanna!
  ko: 달려라, 요한나!
  ja: 駆けろ、ヨハンナ！
c870_FullBurst_1:
  en: Fist of Justice!
  ko: 철.권.제.재!
  ja: 鉄・拳・制・裁！
c870_Kill_Monster_1:
  en: How's this?!
  ko: 이건 어때!
  ja: これはどう！？
c870_Kill_Monster_2:
  en: Got that one!
  ko: 처리했어!
  ja: 片づけたわ！
c870_Kill_Monster_3:
  en: Next!
  ko: 다음!
  ja: 次！
c870_Damage_1:
  en: Ouch...!
  ko: 아파…!
  ja: 痛い…！
c870_Damage_2:
  en: Ugh.
  ko: 윽….
  ja: うっ…
c870_Damage_3:
  en: Tch...
  ko: 칫….
  ja: チッ…
c870_Die_1:
  en: I'm sorry, everyone...
  ko: 모두, 미안해….
  ja: 皆、ごめんなさい…
c870_Win_1:
  en: Don't forget this feeling!
  ko: 지금 이 느낌을 잊지 말자.
  ja: 今の感覚を忘れないようにね！
