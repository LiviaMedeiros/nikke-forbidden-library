---
870_name:
  en: Queen (Makoto)
  ko: 퀸(마코토)
  ja: クイーン（真）
c870_description:
  en: |-
    Her full name is Makoto Niijima.
    She's the student council president at Shujin Academy and strategist for the Phantom Thieves of Hearts.
    She is calm, responsible, and proactive, but sometimes too earnest to compromise.
    A certain incident led to her Persona awakening, after which she became a member of the Phantom Thieves of Hearts.
  ko: |-
    풀네임은 니지마 마코토.
    슈진 고등학교의 학생회장이자 [마음의 괴도단]의 브레인.
    냉정하고 책임감이 강하며 행동력도 있지만, 지나치게 성실해 타협하지 못하는 면도 있다.
    어느 사건을 계기로 페르소나 능력을 각성하고, [마음의 괴도단]의 일원이 된다.
  ja: |-
    本名は新島真。
    秀尽学園の生徒会長であり、「心の怪盗団」のブレーン。
    冷静で責任感が強く、行動力もあるが、生真面目で妥協ができない一面も。
    ある事件をきっかけにペルソナ能力を覚醒し、「心の怪盗団」の一員となる。
870_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_870:
  en: Queen (Makoto)'s Spare Body
  ko: 퀸(마코토) 스페어 바디
  ja: クイーン（真）のスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_sg_down:
  en: Shotgun
  ko: 샷건
  ja: ショットガン
character_shot_description_localkey_sg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
28702_name:
  en: Fist of Justice!
  ko: 철・권・제・재!
  ja: 鉄・拳・制・裁！
28702_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Attack Damage ▲ {description_value_09}% continuously.</color>
    ■ Activates when using Burst Skill. Affects self.
    <color=#00AEFF>Fist of Justice!: This effect is continuous and cannot be removed.
    Function: Queen (Makoto) strengthens herself.
    Effect 1: Nuke Amp: <word_group=10009>Elemental Advantage Attack Damage</word_group> ▲ {description_value_01}% continuously. This effect cannot be removed.
    Effect 2: Rakukaja: DEF ▲ {description_value_02}% continuously. This effect cannot be removed.
    <word_group=10097>Deactivation condition</word_group>: When Full Burst ends.</color>
    ■ Activates when entering Burst Stage 3. Affects self.
    <color=#00AEFF><word_group=10019>Distributed Damage</word_group> ▲ {description_value_03}% for {description_value_04} sec.</color>
    ■ Activates when 1 More takes effect. Affects all <word_group=10082>standard Burst {description_value_05} allies</word_group> (except the skill user) in the Persona state.
    <color=#00AEFF>Baton Pass: ATK ▲ {description_value_06}% of the skill user's ATK continuously. Stacks up to {description_value_07} times.</color>
  ko: |-
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[공격 대미지 {description_value_09}% ▲] [지속]</color>
    ■ 버스트 스킬 사용 시 자신에게
    <color=#00AEFF>[철・권・제・재!] [지속] [해제 불가] :
    기능 : 자신을 강화합니다.
    효과 1 : [핵열 하이부스터 : <word_group=10009>우월 코드 공격 대미지</word_group> {description_value_01}% ▲] [지속] [해제 불가]
    효과 2 : [라쿠카쟈 : 방어력 {description_value_02}% ▲] [지속] [해제 불가]
    <word_group=10097>제거 시점</word_group> : 풀 버스트 타임 종료 시</color>
    ■ 버스트 3단계 진입 시 자신에게
    <color=#00AEFF>[<word_group=10019>분배 대미지</word_group> {description_value_03}% ▲] [{description_value_04}초 유지]</color>
    ■ 1more 적용 시 자신을 제외한 <word_group=10082>기본 버스트 단계가 Step{description_value_05}인</word_group> 페르소나 상태 아군 전체에게
    <color=#00AEFF>[배턴 터치 : 시전자 기준 공격력 {description_value_06}% ▲] [{description_value_07}중첩] [지속]</color>
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「攻撃ダメージ{description_value_09}％▲」「持続」</color>
    ■バーストスキルを使用した時、自分に
    <color=#00AEFF>「鉄・拳・制・裁！」「持続」「解除不可」：
    機能：自分を強化する
    効果1：「核熱ハイブースタ：<word_group=10009>有利コードの攻撃ダメージ</word_group>{description_value_01}％▲」「持続」「解除不可」
    効果2：「ラクカジャ：防御力{description_value_02}％▲」「持続」「解除不可」
    <word_group=10097>解除条件</word_group>：フルバーストタイムが終了した時</color>
    ■バースト3段階突入時、自分に
    <color=#00AEFF>「<word_group=10019>分配ダメージ</word_group>{description_value_03}％▲」「{description_value_04}秒間維持」</color>
    ■1moreが適用された時、自分を除く<word_group=10082>基本バースト段階が{description_value_05}の</word_group>ペルソナ状態の味方全体に
    <color=#00AEFF>「バトンタッチ：スキル発動者基準で攻撃力{description_value_06}％▲」「{description_value_07}スタック」「持続」</color>
skill_name_1003:
  en: Skill 2
  ko: 스킬2
  ja: スキル2
28701_name:
  en: 'Persona: Johanna'
  ko: '페르소나 : 요한나'
  ja: ペルソナ：ヨハンナ
28701_description:
  en: |-
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Persona - Johanna: This effect is continuous and cannot be removed.
    Function: Queen (Makoto) strengthens herself using her Persona.
    Effect 1: Nuke Boost: <word_group=10009>Elemental Advantage Attack Damage</word_group> ▲ {description_value_01}% continuously. This effect cannot be removed.
    Effect 2: Defense Master: DEF ▲ {description_value_02}% continuously. This effect cannot be removed.</color>
    ■ Activates at the start of battle and when Full Burst ends. Affects self.
    <color=#00AEFF>ATK ▲ {description_value_05}% for {description_value_06} sec.</color>
    ■ Activates when 1 More takes effect. Affects all enemies.
    <color=#00AEFF>Deals {description_value_03}% of <word_group=10025>final</word_group> ATK as <word_group=10019>distributed damage</word_group>.</color>
    ■ Activates when Follow Up takes effect. Affects all enemies.
    <color=#00AEFF>Deals {description_value_04}% of <word_group=10025>final</word_group> ATK as <word_group=10019>distributed damage</word_group>.</color>
  ko: "■ 전투 시작 시 자신에게\n<color=#00AEFF>[페르소나 - 요한나] [지속] [해제 불가] : \n기능 : 페르소나를 통해
    자신을 강화합니다.\n효과 1 : [핵열 부스터 : <word_group=10009>우월 코드 공격 대미지</word_group> {description_value_01}%
    ▲] [지속] [해제 불가]\n효과 2 : [방어의 마음가짐 : 방어력 {description_value_02}% ▲] [지속] [해제 불가]</color>\n■
    전투 시작 시와 풀 버스트 타임 종료 시 자신에게\n<color=#00AEFF>[공격력 {description_value_05}% ▲] [{description_value_06}초
    유지]</color>\n■ 1more 적용 시 적 전체에게\n<color=#00AEFF>[<word_group=10025>최종</word_group>
    공격력 {description_value_03}% <word_group=10019>분배 대미지</word_group>]</color>\n■
    추격 적용 시 적 전체에게\n<color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_04}%
    <word_group=10019>분배 대미지</word_group>]</color>"
  ja: |-
    ■戦闘開始時、自分に
    <color=#00AEFF>「ペルソナ - ヨハンナ」「持続」「解除不可」：
    機能：ペルソナを使って自分を強化する
    効果1：「核熱ブースタ：<word_group=10009>有利コードの攻撃ダメージ</word_group>{description_value_01}％▲」「持続」「解除不可」
    効果2：「防御の心得：防御力{description_value_02}％▲」「持続」「解除不可」</color>
    ■戦闘開始時およびフルバーストタイムが終了した時、自分に
    <color=#00AEFF>「攻撃力{description_value_05}％▲」「{description_value_06}秒間維持」</color>
    ■1moreが適用された時、敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_03}％の<word_group=10019>分配ダメージ</word_group>」</color>
    ■追撃が適用された時、敵全体に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_04}％の<word_group=10019>分配ダメージ</word_group>」</color>
