  ja: リトルマーメイド
c515_Lobby_Touch_1:
  en: Grave prepared this swimsuit especially for me. What do you think? Isn't it
    beautiful?
  ko: |-
    그레이브가 날 위해 준비해 준 수영복이야.
    어때, 아름답지 않아?
  ja: |-
    グレイブが私に用意してくれた水着よ。
    どう？美しいでしょう？
c515_Lobby_Touch_2:
  en: I knew it. I just look good in everything. You agree, don't you, Prince?
  ko: |-
    역시 난 뭘 입어도 잘 어울린다니까.
    왕자님도 그렇게 생각하지?
  ja: |-
    やっぱり、私は何を着ても似合うわ。
    王子様もそう思うでしょう？
c515_Lobby_Touch_3:
  en: It's so sparkly. Absolutely perfect.
  ko: 반짝반짝하네, 완벽해.
  ja: 輝いているわ。完璧ね。
c515_Lobby_Touch_Love_1:
  en: Prince, could you hold this for me while I change into my swimsuit?
  ko: 왕자님, 내가 수영복을 갈아입는 동안 이쪽을 좀 잡아주겠어?
  ja: 王子様。着替える間、ここを押さえていてくれる？
c515_Lobby_Touch_Love_2:
  en: Which do you like better? The white or the black?
  ko: |-
    왕자님은 어느 쪽이 더 마음에 들어?
    흰 쪽? 검은 쪽?
  ja: |-
    王子様はどちらが好み？
    白かしら？黒かしら？
c515_Lobby_Touch_Love_3:
  en: I'm so glad I got to come to the beach with you, Prince.
  ko: 왕자님이랑 이렇게 함께 바다에 올 수 있어서 기쁜걸?
  ja: 王子様と海に来られて嬉しいわ。
c515_Lobby_Stay_1:
  en: Don't you think you've kept me waiting a little too long in this heat?
  ko: 이렇게 더운 날에 너무 오래 기다리게 하는 거 아냐?
  ja: 暑いのに、待たせすぎではないかしら？
c515_Lobby_Stay_Love_1:
  en: Don't worry about me and go on ahead. I'll try on some other swimsuits while
    you're gone.
  ko: |-
    신경 쓰지 말고 다녀와.
    그동안 다른 수영복으로도 갈아입어 봐야겠네.
  ja: |-
    気にせず行ってきて。
    その間に、他の水着も試しておくわ。
c515_Outpost_Touch_1:
  en: I heard there's a place called a swimming pool. Take me to see it, Prince.
  ko: |-
    수영장이라는 곳이 있다고 들었어.
    거긴 어떤 곳인지 구경시켜줘, 왕자님.
  ja: |-
    プールがあると聞いたわ。
    案内してくれる？王子様。
c515_Outpost_Touch_2:
  en: Look, Prince. Isn't my reflection in the mirror absolutely beautiful?
  ko: |-
    저기 봐, 왕자님.
    거울에 비친 내 모습, 너무 아름답지 않아?
  ja: |-
    見て、王子様。
    鏡に映った私、 とても美しいでしょう？
c515_Outpost_Touch_3:
  en: I really hope Grave wears a swimsuit next time too.
  ko: 다음엔 그레이브도 꼭 수영복을 입었으면 좋겠어.
  ja: 次はグレイブも水着を着るべきね。
c515_Gacha_Get_1:
  en: I'm glowing beneath the radiant sunlight. I truly am beautiful.
  ko: |-
    빛나는 햇살 아래에서 빛나는 나.
    정말 아름다워.
  ja: |-
    まぶしい日差しの下で、輝く私。
    本当に美しいわ。
c515_Reinforce_1:
  en: I feel lighter somehow.
  ko: 몸이 가벼워진 기분이야.
  ja: 体が軽くなった気がするわ。
c515_Reinforce_2:
  en: Glass Slippers are gleaming.
  ko: 유리구두가 빛나고 있어.
  ja: ガラスの靴も輝いているわ。
c515_Reinforce_3:
  en: If I get any more beautiful here, it could be a problem.
  ko: 여기서 더 아름다워지면 곤란한데.
  ja: これ以上美しくなったら困ってしまうわ。
c515_Gift_1:
  en: When did you have time to prepare this gift?
  ko: 이런 선물은 언제 다 준비한 거야?
  ja: こんな贈り物、いつの間に用意していたの？
c515_Gift_2:
  en: Did you prepare this for me? How thoughtful of you.
  ko: 날 위해 준비한 거구나. 상냥해라.
  ja: 私のために手に入れてくれたのね。優しい人。
c515_Gift_3:
  en: You always give me such beautiful gifts, Prince. Thank you.
  ko: 왕자님이 주는 선물은 늘 아름답네, 고마워.
  ja: 王子様のプレゼントはいつも美しいわ、ありがとう。
c515_Attractive_Up_1:
  en: You're beautiful yourself, Prince.
  ko: 왕자님, 아름다워.
  ja: 王子様、美しいわ。
c515_Attractive_Up_2:
  en: You know, I really enjoy being with you, Prince.
  ko: 그거 알아? 왕자님이랑 있으면 즐거워.
  ja: 知っていたかしら？王子様と一緒にいると、楽しいの。
c515_Attractive_Up_3:
  en: I could get used to spending time with you, Prince. That could be a problem.
  ko: |-
    왕자님이랑 함께 있는 시간에 익숙해져 버릴 것 같아.
    큰일이네.
  ja: |-
    一緒にいることが当たり前になってしまいそう。
    困ったわね。
c515_Party_Deploy_1:
  en: Promise we'll be together even by the beach, Prince.
  ko: 바다에서도 함께 하자, 왕자님.
  ja: 海でも一緒にいましょう、王子様。
c515_Field_Touch_1:
  en: Yes? What's wrong?
  ko: 응, 왜 그래?
  ja: あら、呼ばれた？
c515_Field_Go_1:
  en: Time to move with grace.
  ko: 아름답게 움직여볼까?
  ja: 美しく動きましょう？
c515_Battle_Enter_1:
  en: Let's finish this quickly.
  ko: 빠르게 끝내자.
  ja: 早く終わらせましょう。
c515_Battle_Ready_1:
  en: I won't let anyone ruin our long-awaited vacation.
  ko: 모처럼의 휴가를 방해받을 순 없지.
  ja: せっかくのバカンスを邪魔されたくないわ。
c515_Battle_Ready_2:
  en: Don't worry, Prince. I'll protect you.
  ko: 걱정 마, 왕자님은 내가 지켜줄게.
  ja: 心配しないで。王子様は私が守るから。
c515_Battle_Ready_3:
  en: Let's wrap this up quickly and relax together.
  ko: 얼른 마무리하고 같이 쉬자.
  ja: 早く終わらせて休みましょう。
c515_Reload_1:
  en: Glass Slippers is sparkling today too.
  ko: 오늘도 유리구두는 반짝이네.
  ja: ガラスの靴は今日も輝いているわ。
c515_Reload_2:
  en: I got all dirty. I'll have to change later.
  ko: 지저분해졌네, 이따가 갈아입어야겠어.
  ja: 汚れてしまったわ…あとで着替えないと。
c515_Reload_3:
  en: Just a moment. Let me brush off this sand.
  ko: 잠시, 모래 좀 털게.
  ja: 待って、砂を払うわ。
c515_Ult_Skill_Ready_1:
  en: Shall we go, Prince?
  ko: 가볼까, 왕자님?
  ja: 行きましょう、王子様。
c515_Ult_Skill_1:
  en: Beautiful... Me, you, and the sea foam.
  ko: 너무… 아름다워. 물거품도, 나도, 왕자님도.
  ja: ああ…美しいわ。水泡も、私も、王子様も。
c515_FullBurst_1:
  en: I'm going all out.
  ko: 이대로 다 쏟아내는 거야.
  ja: このまま全力で行くわ。
c515_Kill_Monster_1:
  en: Don't get in my way.
  ko: 방해하지 마.
  ja: 邪魔をしないで。
c515_Kill_Monster_2:
  en: Be gone.
  ko: 사라져.
  ja: 消えて。
c515_Kill_Monster_3:
  en: How annoying.
  ko: 성가셔.
  ja: 目障りね。
c515_Damage_1:
  en: Ugh.
  ko: 윽.
  ja: うっ…
c515_Damage_2:
  en: Ngh.
  ko: 읏.
  ja: ああっ。
c515_Damage_3:
  en: What the...!
  ko: 뭐야…!
  ja: なに…！？
c515_Die_1:
  en: I didn't want anyone ruining our fun...
  ko: 즐거운 시간을 방해받고 싶지 않았는데….
  ja: 楽しい時間を邪魔されたくなかったわ…
c515_Win_1:
  en: Come on, let's go enjoy the rest of our vacation, Prince.
  ko: 자, 남은 휴가를 즐기러 가자. 왕자님.
  ja: さあ、残りのバカンスを楽しみましょう、王子様。
