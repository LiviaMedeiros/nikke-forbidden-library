  ja: スキル2
25151_name:
  en: Beauty-Full
  ko: 뷰티-풀
  ja: ビューティー・フル
25151_description_1:
  en: |-
    ■ Activates upon reloading to max ammunition while in the Preparation for Change state. Affects self.
    <color=#00AEFF>Changes the weapon in use: Snipe Mode
    Charge Time: 1 sec
    Damage: {description_value_01}% of <word_group=10025>final</word_group> ATK
    Full Charge Damage: 250% of damage
    Max Ammunition Capacity: 15 (<word_group=10106>max ammunition effects refresh after reloading</word_group>)
    Additional Effect 1: Gains Pierce.
    Additional Effect 2: Activates when performing a Full Charge attack. <word_group=10099>Expends ammo</word_group>. Amount: {description_value_02} round(s).
    Additional Effect 3: Charge time is fixed at 1 sec.
    Removal Condition: Reloading to max ammunition while in the Preparation for Change state.</color>
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>Beauty-Full: Attack Damage ▲ {description_value_03}% continuously.</color>
    ■ Activates upon reloading to max ammunition. Affects self.
    <color=#00AEFF>Preparation for Change: Reload time is fixed at 3 sec for {description_value_04} sec. Removed upon firing the last bullet.</color>
    ■ Activates every {description_value_10} sec. Affects the enemy unit nearest to the crosshair.
    <color=#00AEFF>Deals {description_value_07}% of <word_group=10025>final</word_group> ATK as damage.</color>
    ■ Activates each time <word_group=10078>total ammo consumed by allies</word_group> reaches {description_value_08}. Affects all allies.
    <color=#00AEFF><word_group=10015>Fills Burst Gauge</word_group> by {description_value_09}%.</color>
  ko: |-
    ■ 최대 장탄 재장전 완료 시 자신이 변경 준비 상태라면 자신에게
    <color=#00AEFF>[사용 무기 변경 : 저격 모드] :
    차지 시간 : 1초
    대미지 : <word_group=10025>최종</word_group> 공격력 {description_value_01}% 대미지
    풀 차지 대미지 : 250% 대미지
    최대 장탄 수 : 15발 (<word_group=10106>재장전 완료 시 최대 장탄 수 효과 갱신</word_group>)
    추가 효과 1 : 관통 특화
    추가 효과 2 : 풀 차지 공격 시 <word_group=10099>탄환 소모</word_group> {description_value_02}발
    추가 효과 3 : 차지 시간 1초로 고정
    해제 조건 : 변경 준비 상태에서 최대 장탄 재장전 완료</color>
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[뷰티-풀: 공격 대미지 {description_value_03}% ▲] [지속]</color>
    ■ 최대 장탄 재장전 완료 시 자신에게
    <color=#00AEFF>[변경 준비 : 재장전 시간 3초로 고정] [{description_value_04}초 유지] [마지막 탄환 공격 시 제거]</color>
    ■ {description_value_10}초 마다 조준선에 가장 가까운 적 1기에게
    <color=#00AEFF>[<word_group=10025>최종</word_group> 공격력 {description_value_07}% 대미지]</color>
    ■ <word_group=10078>아군이 소비한 탄의 총합</word_group>이 {description_value_08}발이 될 때마다 아군 전체에게
    <color=#00AEFF>[<word_group=10015>버스트 게이지 충전</word_group> {description_value_09}%] </color>
  ja: |-
    ■最大弾数のリロードが完了した時、
    自分が変更準備状態なら、自分に
    <color=#00AEFF>「使用武器変更：狙撃モード」：
    チャージ時間：1秒
    ダメージ：<word_group=10025>最終</word_group>攻撃力の{description_value_01}％のダメージ
    フルチャージダメージ：250％
    最大装弾数：15発（<word_group=10106>リロード完了時、最大装弾数に対する効果更新</word_group>）
    追加効果1：貫通特化
    追加効果2：フルチャージして攻撃した時、<word_group=10099>弾薬消費</word_group>{description_value_02}発
    追加効果3：チャージ時間1秒に固定
    解除条件：変更準備状態で最大弾数のリロードを完了した時</color>
    ■戦闘開始時、自分に
    <color=#00AEFF>「ビューティー・フル：攻撃ダメージ{description_value_03}％▲」「持続」</color>
    ■最大弾数のリロードが完了した時、自分に
    <color=#00AEFF>「変更準備：リロード時間を3秒に固定」「{description_value_04}秒間維持」「最後の弾丸で攻撃時解除」</color>
    ■{description_value_10}秒ごとに照準線に最も近い敵1機に
    <color=#00AEFF>「<word_group=10025>最終</word_group>攻撃力の{description_value_07}％のダメージ」</color>
    ■<word_group=10078>味方が消費した弾の合計</word_group>が{description_value_08}発ごとに、味方全体に
    <color=#00AEFF>「<word_group=10015>バーストゲージのチャージ</word_group>{description_value_09}％」</color>
