---
515_name:
  en: 'Cinderella: Crystal Wave'
  ko: '신데렐라 : 크리스탈 웨이브'
  ja: シンデレラ：クリスタルウェーブ
c515_description:
  en: Cinderella in a swimsuit Grave prepared for her. With a new swimsuit that showcases
    her beauty and her very own private changing room, she seems immensely satisfied.
  ko: |-
    그레이브가 준비해 준 수영복을 입은 신데렐라.
    자신의 아름다움이 돋보일 수 있는 수영복에, 전용 탈의실까지.
    덕분에 매우 만족스러운 모양이다.
  ja: |-
    グレイブが用意した水着を着たシンデレラ。
    自分の美しさが際立つ水着に、専用の更衣室まで
    用意してもらい、とても満足している。
515_cv:
  en: "-"
  ko: "-"
  ja: "-"
piece_515:
  en: 'Cinderella: Crystal Wave''s Spare Body'
  ko: '신데렐라 : 크리스탈 웨이브 스페어 바디'
  ja: シンデレラ：クリスタルウェーブのスペアボディ
piece:
  en: |-
    Used for a Nikke's Limit Break.
    Spare Bodies for a fully enhanced Nikke will be converted into Body Labels.
  ko: |-
    니케의 한계돌파 재료로 사용됩니다.
    최대로 성장한 니케의 스페어 바디는 바디 라벨로 변경됩니다.
  ja: |-
    ニケの限界突破素材として使用する
    最大値まで成長したニケのスペアボディは、\nボディラベルに変更される
character_shot_name_localkey_mg_down:
  en: Machine Gun
  ko: 머신건
  ja: マシンガン
character_shot_description_localkey_mg_down:
  en: |-
    ■ Affects target(s).
    <color=#00AEFF>Deals {damage}% of ATK as damage.
    Deals {core_damage_rate}% damage when attacking core.</color>
  ko: |-
    ■ 대상에게
    <color=#00AEFF>[공격력 {damage}% 대미지]
    [코어 대미지 {core_damage_rate}%]</color>
  ja: |-
    ■対象に
    <color=#00AEFF>「攻撃力の{damage}％のダメージ」
    「コアダメージ{core_damage_rate}％」</color>
25152_name:
  en: Mode Swap
  ko: 모드 스왑
  ja: モードスワップ
25152_description:
  en: |-
    ■ Activates at the start of battle and when using Burst Skill. Affects self.
    <color=#00AEFF><word_group=10024>Decoy</word_group>: Creates an avatar with {description_value_01}% of the skill user's <word_group=10025>final</word_group> Max HP. This effect is continuous.</color>
    ■ Activates at the start of battle. Affects self.
    <color=#00AEFF>ATK ▲ {description_value_02}% continuously.</color>
    ■ Activates when Snipe Mode takes effect. Affects self.
    <color=#00AEFF>Destroy: <word_group=10011>Damage to Parts</word_group> ▲ {description_value_03}% continuously.
    Removes Pinpoint.</color>
    ■ Activates at the start of battle and when Snipe Mode is removed. Affects self.
    <color=#00AEFF>Pinpoint: Damage dealt when attacking core ▲ {description_value_04}% continuously.
    Removes Destroy.</color>
    ■ Activates when entering Full Burst after this unit uses her Burst Skill.
    <color=#00AEFF>Effect varies according to this unit's current mode. Only one effect is applied.</color>
    Activates while in Snipe Mode. Affects all enemies (including parts).
    <color=#00AEFF>Effect 1: Deals {description_value_05}% of <word_group=10025>final</word_group> ATK as damage.</color>
    Activates while not in Snipe Mode. Affects all enemies with activated cores.
    <color=#00AEFF>Effect 1: Deals {description_value_06}% of <word_group=10025>final</word_group> ATK as <word_group=10104>core strike damage</word_group>.</color>
  ko: |-
    ■ 전투 시작 시와 버스트 스킬 사용 시 자신에게
    <color=#00AEFF>[<word_group=10024>디코이</word_group> : 시전자의 <word_group=10025>최종</word_group> 최대 체력 비례 {description_value_01}% 분신] [지속]</color>
    ■ 전투 시작 시 자신에게
    <color=#00AEFF>[공격력 {description_value_02}% ▲] [지속]</color>
    ■ 저격모드 적용 시 자신에게
    <color=#00AEFF>[디스트로이 : <word_group=10011>파츠 대미지</word_group> {description_value_03}% ▲] [지속]
    [핀 포인트 해제]</color>
    ■ 전투 시작 시와 저격모드 해제 시 자신에게
    <color=#00AEFF>[핀 포인트 : 코어 대미지 {description_value_04}% ▲] [지속]
    [디스트로이 해제]</color>
    ■ 풀 버스트 타임 시작 시 직전에 자신이 버스트 스킬을 사용했다면
    <color=#00AEFF>[모드 적용 별 효과] [해당되는 효과만 적용]</color>
    자신이 저격 모드라면 적 전체에게 (파츠 포함)
    <color=#00AEFF>효과 1 : [<word_group=10025>최종</word_group> 공격력 {description_value_05}% 대미지]</color>
    자신이 저격 모드가 아니라면 코어가 활성화된 적 전체에게
    <color=#00AEFF>효과 1 : [<word_group=10025>최종</word_group> 공격력 {description_value_06}% <word_group=10104>코어 명중 대미지</word_group>]</color>
  ja: |-
    ■戦闘開始時およびバーストスキル使用時、自分に
    <color=#00AEFF>「<word_group=10024>デコイ</word_group>：スキル発動者の<word_group=10025>最終</word_group>最大HPの{description_value_01}％の分身」「持続」</color>
    ■戦闘開始時、自分に
    <color=#00AEFF>「攻撃力{description_value_02}％▲」「持続」</color>
    ■狙撃モード適用時、自分に
    <color=#00AEFF>「デストロイ：<word_group=10011>パーツダメージ</word_group>{description_value_03}％▲」「持続」
    「ピンポイント解除」</color>
    ■戦闘開始時および狙撃モード解除時、
    自分に
    <color=#00AEFF>「ピンポイント：コアダメージ{description_value_04}％▲」
    「持続」「デストロイ解除」</color>
    ■フルバーストタイムが発動した時、直前に自分がバーストスキルを使用していれば
    <color=#00AEFF>「モード適用別効果」「該当効果のみ適用」</color>
    自分が狙撃モードなら
    敵全体に（パーツ含む）
    <color=#00AEFF>効果1：「<word_group=10025>最終</word_group>攻撃力の
    {description_value_05}％のダメージ」</color>
    自分が狙撃モードでなければ
    コアが活性化している敵全体に
    <color=#00AEFF>効果1：「<word_group=10025>最終</word_group>攻撃力の{description_value_06}％の<word_group=10104>コア命中ダメージ</word_group>」</color>
